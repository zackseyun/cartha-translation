id: JER.46.10
reference: Jeremiah 46:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְֽ/הַ/יּ֨וֹם הַ/ה֜וּא לַ/אדֹנָ֧/י יְהוִ֣ה צְבָא֗וֹת י֤וֹם נְקָמָה֙ לְ/הִנָּקֵ֣ם מִ/צָּרָ֔י/ו וְ/אָכְלָ֥ה חֶ֨רֶב֙ וְ/שָׂ֣בְעָ֔ה וְ/רָוְתָ֖ה מִ/דָּמָ֑/ם כִּ֣י זֶ֠בַח לַ/אדֹנָ֨/י יְהוִ֧ה צְבָא֛וֹת בְּ/אֶ֥רֶץ צָפ֖וֹן אֶל נְהַר פְּרָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/010.yaml
  text: That day belongs to the Lord GOD of Armies[a], a day of vengeance, to avenge himself on his foes. The sword will devour and be satisfied and drink its fill of their blood, for the Lord GOD of Armies has a sacrifice in the land of the north[b], by the Euphrates River.
  footnotes:
  - marker: a
    text: Or, 'for there is a sacrifice for the Lord GOD of Armies.' The Hebrew can be taken as an existential clause rather than the more idiomatic 'has a sacrifice.'
    reason: lexical_alternative
  - marker: b
    text: Traditional English often has 'LORD of hosts' for 'Lord GOD of Armies.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날은 주 여호와 만군의 하나님[a]께 속한 날이니, 원수를 갚는 날입니다. 칼이 삼키고 배부르며 그들의 피로 흠뻑 취할 것이니, 주 여호와 만군의 하나님께서 북쪽 땅[b], 곧 유프라테스 강가에 제물을 두셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만군의 주 여호와께 속한 날’로도 읽을 수 있습니다. 히브리어는 귀속을 나타내는 ל가 있어서, ‘그 날은 주 여호와 만군의 하나님께 속한 날’처럼 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘북쪽 땅에서’입니다. 전쟁 장소를 가리키는 지리적 표현으로, 유프라테스 강가의 카르케미스 전투 맥락을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: וְהַיּוֹם הַהוּא
  english_pob_choice: That day
  chosen_korean: 그 날
  alternatives_korean:
  - 그리고 그 날
  - 그 날은
  lexicon: HALOT
  rationale: 시간을 가리키는 지시 표현으로, 한국어에서는 자연스럽게 ‘그 날’로 옮기되 문맥상 주제화를 살려 ‘그 날은’으로 시작했습니다.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: belongs to the Lord GOD of Armies
  chosen_korean: 주 여호와 만군의 하나님께 속한
  alternatives_korean:
  - 주 여호와 만군의 하나님을 위한
  - 주 여호와 만군의 하나님이 가지신
  lexicon: HALOT
  rationale: לְ/לַ는 소유·귀속 관계를 나타내므로, 단순히 ‘위한’보다 ‘~께 속한’이 원문의 관계를 더 투명하게 드러냅니다.
- source_word: צְבָאוֹת
  english_pob_choice: of Armies
  chosen_korean: 만군의
  alternatives_korean:
  - 군대의
  - 군들의
  lexicon: HALOT
  rationale: 주권적 전쟁 이미지를 가진 칭호로서, 한국어 성서 전통과의 연속성을 유지하면서도 군사적 의미를 살려 ‘만군의’로 옮겼습니다.
- source_word: וְאָכְלָה חֶרֶב וְשָׂבְעָה וְרָוְתָה מִדָּמָם
  english_pob_choice: The sword will devour and be satisfied and drink its fill of their blood
  chosen_korean: 칼이 삼키고 배부르며 그들의 피로 흠뻑 취할 것이니
  alternatives_korean:
  - 칼이 먹어 배부르며 그들의 피를 충분히 마실 것이니
  - 칼이 삼키고 만족하며 그들의 피를 마셔 흡족할 것이니
  lexicon: HALOT
  rationale: 칼의 의인화를 살려 ‘삼키고 배부르며’로 대응했고, רוה의 감각을 한국어 관용에 맞게 ‘흠뻑 취하다’로 옮겨 피에 대한 과잉 포만 이미지를 보존했습니다.
- source_word: כִּי זֶבַח
  english_pob_choice: for ... has a sacrifice
  chosen_korean: 제물을 두셨기 때문입니다
  alternatives_korean:
  - 제물이 있기 때문입니다
  - 제사가 있기 때문입니다
  lexicon: HALOT
  rationale: 히브리어는 존재문으로도 읽힐 수 있지만, 문맥상 야훼께서 ‘제물/희생’을 마련하셨다는 뜻이 분명하여 더 직접적인 ‘두셨기 때문입니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה / YHWH와 아도나이의 결합을 한국어로 어떻게 드러낼지
  chosen_reading: 주 여호와
  alternative_readings:
  - 주 하나님
  - 주 야훼
  rationale: 본문의 אֲדֹנָי יְהוִה는 호칭과 고유명사가 결합된 형식이므로, 주권 호칭 ‘주’와 신명 ‘여호와’를 함께 살려 읽는 것이 문맥상 가장 자연스럽습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
- issue: כִּי זֶבַח의 의미를 단순 비유로 약화할지, 희생 제의 이미지로 유지할지
  chosen_reading: 제물을 두셨기 때문입니다
  alternative_readings:
  - 제사가 있기 때문입니다
  - 희생 제물이 있기 때문입니다
  rationale: 전쟁의 참상을 제의적 언어로 해석하는 본문의 긴장을 보존해야 하므로, ‘제물’로 옮겨 희생-제사 어휘를 직접 드러냈습니다.
  doctrine_reference: 예언서의 심판-제의 이미지
