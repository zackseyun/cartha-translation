review_pass:
  verdict: revise
  source_fidelity: 현 초안은 핵심 전쟁·제의 이미지를 대체로 보존하지만, אֲדֹנָי יְהוִה צְבָאוֹת를 ‘주 여호와 만군의 하나님’으로 옮겨 원문에 없는 ‘하나님’을 추가하고 칭호의 결합도 부정확하게 처리했습니다. 또한 כִּי זֶבַח 절에는 ‘두셨다’에 해당하는 동사가 없으므로 ‘제물을 두셨기 때문입니다’는 원문보다 구체적입니다. לְהִנָּקֵם의 재귀적 의미도 명시하는 편이 좋습니다.
  naturalness: ‘그날’, ‘보복의 날’, ‘칼은 삼키고 배부르며 … 마실 것입니다’는 현대 표준어 합쇼체에서 자연스럽고, 칼의 의인화와 원문의 병렬을 유지합니다. ‘피로 흠뻑 취하다’는 피에 취한다는 뜻으로도 읽혀 רוה의 ‘마시어 흡족해지다’라는 동작상을 다소 흐릴 수 있어 ‘피를 실컷 마시다’로 고쳤습니다.
  terminology: אֲדֹנָי יְהוִה צְבָאוֹת는 ‘주 만군의 여호와’로 옮겨 ‘주’(아도나이), ‘여호와’(YHWH), ‘만군의’(체바오트)를 모두 보존했습니다. זֶבַח는 전쟁의 죽음을 제의적으로 묘사하는 표현이므로 ‘희생 제물’로 유지했습니다.
  issues:
  - severity: high
    issue: ‘주 여호와 만군의 하나님’은 원문 칭호에 없는 ‘하나님’을 첨가하고, צְבָאוֹת가 여호와를 수식하는 관계를 불분명하게 만듭니다.
    rationale: 히브리어 אֲדֹנָי יְהוִה צְבָאוֹת는 ‘주 만군의 여호와’에 해당합니다. 원문에 없는 신칭을 더하지 않아야 합니다.
  - severity: high
    issue: ‘제물을 두셨기 때문입니다’는 כִּי זֶבַח לַאדֹנָי의 명사절에 없는 동사를 추가합니다.
    rationale: 이 구절은 ‘주 만군의 여호와께 드릴 희생 제물이 있기 때문이다’ 또는 ‘… 희생 제사가 있기 때문이다’라는 존재 구문으로 읽는 것이 안전합니다.
  - severity: medium
    issue: ‘원수를 갚는 날’은 לְהִנָּקֵם מִצָּרָיו의 ‘자기 대적들에게 복수하시다’라는 재귀적 의미를 충분히 드러내지 못합니다.
    rationale: 주어가 자신을 위해/자기 대적들에게 보복하시는 의미를 문장에 명시하면 원문에 더 가깝습니다.
  - severity: medium
    issue: ‘그들의 피로 흠뻑 취할’은 רוה의 포만·음용 이미지를 다소 모호하게 합니다.
    rationale: 칼의 의인화를 따라 ‘그들의 피를 실컷 마실’로 옮기면 앞선 ‘삼키고 배부르며’와의 점층적 표현이 분명해집니다.
  revised_text: 그날은 주 만군의 여호와께 속한 날, 곧 그분께서 자기 대적들에게 복수하시는 보복의 날입니다. 칼은 삼키고 배부르며 그들의 피를 실컷 마실 것입니다. 이는 주 만군의 여호와께 드릴 희생 제물이 북쪽 땅, 유프라테스 강가에 있기 때문입니다.
  revised_footnotes:
  - marker: a
    text: ‘만군의’는 직역하면 ‘군대들의’이며, 여호와의 군사적 주권을 나타내는 칭호입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘북쪽 땅에서, 유프라테스 강을 향하여/곁에’입니다. 문맥에서는 유프라테스 강가의 장소를 가리킵니다.
    reason: source_note
  revision_rationale: 원문에 없는 ‘하나님’과 ‘두셨다’를 제거하고, 주 만군의 여호와라는 칭호를 일관되게 복원했습니다. 보복의 대상과 칼의 의인화된 음용 이미지를 더 직접적으로 반영했습니다. 희생 제물의 존재와 장소라는 원문의 명사절은 유지하되, 누가 제물을 마련했는지는 본문이 말하지 않는 만큼 첨가하지 않았습니다.
