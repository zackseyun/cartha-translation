revisions:
- from: 야훼의 말씀이 예레미야 선지자에게 임했는데, 곧 여러 나라에 관한 말씀입니다.[a]
  to: 여러 나라에 관하여 예레미야 예언자에게 임한 야훼의 말씀입니다.[a]
  rationale: 원문의 관계절 표제 구조를 보존하도록 어순과 문장 연결을 바로잡았습니다. ‘관하여’는 עַל의 넓은 주제 표지 기능을 본문에서 유지하며, ‘거슬러’라는 문맥적 가능성은 각주에 남겼습니다. 신명 ‘야훼’와 예언적 계시 관용구 ‘말씀…에게 임하다’는 유지했습니다.
  reviewer_model: gpt-5.6-terra
