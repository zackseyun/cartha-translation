id: JER.46.1
reference: Jeremiah 46:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא עַל הַ/גּוֹיִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/001.yaml
  text: The word of Yahweh that came to Jeremiah the prophet concerning the nations:[a]
  footnotes:
  - marker: a
    text: Or 'against the nations.' The Hebrew preposition can introduce the subject matter generally or, in context, hostile oracles directed against them.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀이 예레미야 선지자에게 임했는데, 곧 여러 나라에 관한 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 나라를 향한/반대하는’입니다. 히브리어 전치사 עַל은 주제 일반을 가리킬 수도 있고, 문맥상 그들을 향한 적대적 경고문을 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: The word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언문 서두의 고정된 표현을 살리되, יְהוָה는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: הָיָה ... אֶל
  english_pob_choice: came to
  chosen_korean: 임했습니다
  alternatives_korean:
  - 왔습니다
  - 전해졌습니다
  lexicon: HALOT
  rationale: ‘말씀이 ...에게 임하다’는 예언서 관용구를 한국어로 자연스럽게 살리면서, 단순한 이동보다 계시의 도착을 드러냅니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 선지자
  alternatives_korean:
  - 예언자
  - 선지자
  lexicon: HALOT
  rationale: 예레미야를 지칭하는 직함을 표준 한국어 성경 문맥에 맞게 ‘선지자’로 옮겼고, 여기서는 호칭보다 공식 서문 톤이 중요합니다.
- source_word: עַל הַגּוֹיִם
  english_pob_choice: concerning the nations
  chosen_korean: 여러 나라에 관한
  alternatives_korean:
  - 여러 나라를 향한
  - 여러 나라에 대하여
  lexicon: HALOT
  rationale: עַל의 범위를 서두 수준에서 넓게 유지해 ‘관한’으로 옮겼으며, 본문 주석의 ‘against’ 가능성은 본문에서 확정하지 않았습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: יהוה를 ‘야훼’로 표기합니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 טetragrammaton을 직접 사용하므로, 신적 고유명을 보존하는 프로젝트 방침에 따라 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: עַל הַגּוֹיִם의 방향성
  chosen_reading: ‘여러 나라에 관한’으로 두어 제목의 범위를 열어 둡니다.
  alternative_readings:
  - 여러 나라를 향한
  - 여러 나라를 반대하는
  rationale: 이 절은 뒤따르는 심판 예언들의 표제이므로, 본문 자체에서는 ‘against’의 해석을 확정하지 않고 여지를 남깁니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
