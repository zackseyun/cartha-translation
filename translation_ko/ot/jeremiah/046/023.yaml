id: JER.46.23
reference: Jeremiah 46:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּרְת֤וּ יַעְרָ/הּ֙ נְאֻם יְהוָ֔ה כִּ֖י לֹ֣א יֵֽחָקֵ֑ר כִּ֤י רַבּוּ֙ מֵֽ/אַרְבֶּ֔ה וְ/אֵ֥ין לָ/הֶ֖ם מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/023.yaml
  text: They have cut down her forest[a], declares Yahweh, though it cannot be searched out, because they are more numerous than locusts, and they are without number.
  footnotes:
  - marker: a
    text: Or 'for it cannot be searched out.' The Hebrew conjunction can be read causally ('for/because') or concessively ('though'); the main text adopts the concessive sense as the better fit in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그 숲을 베어 넘어뜨렸습니다[a], 야훼의 말씀입니다. 그것은 찾아헤아릴 수 없을지라도, 그들이 메뚜기보다 더 많고 수효가 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾아헤아릴 수 없기 때문입니다.’ 히브리어 접속사는 원인적(‘왜냐하면’) 또는 양보적(‘비록…일지라도’)으로 읽을 수 있으며, 본문은 문맥에 더 잘 맞는 양보적 의미를 따랐습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כָּרְתוּ
  english_pob_choice: They have cut down
  chosen_korean: 베어 넘어뜨렸습니다
  alternatives_korean:
  - 잘랐습니다
  - 베어 냈습니다
  - 찍어 넘어뜨렸습니다
  lexicon: HALOT
  rationale: כרת의 ‘자르다/베다’ 의미를 살리면서, 숲을 대상으로 한 파괴적 행위를 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: יַעְרָהּ
  english_pob_choice: her forest
  chosen_korean: 그 숲
  alternatives_korean:
  - 그녀의 숲
  - 그의 숲
  - 그 숲속
  lexicon: HALOT
  rationale: 히브리어의 3인칭 여성 접미사는 문맥상 의인화된 이집트를 가리키지만, 한국어에서는 소유 대명사보다 지시적 표현이 더 자연스러워 과도한 성별 표시를 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 하나님
  lexicon: HALOT
  rationale: 본문의 신명 표기를 전통 대체어가 아니라 음역 ‘야훼’로 옮겨, POB의 स्रोत 직역 원칙과 공적 이름성을 반영했습니다.
- source_word: לֹא יֵחָקֵר
  english_pob_choice: though it cannot be searched out
  chosen_korean: 찾아헤아릴 수 없을지라도
  alternatives_korean:
  - 찾아낼 수 없을지라도
  - 헤아릴 수 없을지라도
  - 탐지할 수 없을지라도
  lexicon: HALOT
  rationale: נִפעל형의 ‘찾아내다/헤아리다’ 의미를 함께 살리며, POB가 채택한 양보적 의미를 한국어 ‘-일지라도’로 표현했습니다.
- source_word: מֵאַרְבֶּה
  english_pob_choice: than locusts
  chosen_korean: 메뚜기보다 더 많고
  alternatives_korean:
  - 메뚜기보다 많고
  - 메뚜기 떼보다 더 많고
  - 메뚜기보다도 많고
  lexicon: HALOT
  rationale: 비교 구문을 자연스럽게 살리기 위해 ‘~보다 더 많다’로 옮겼고, אַרְבֶּה를 한국어 성경에서 통용되는 ‘메뚜기’로 유지했습니다.
theological_decisions:
- issue: 예언적 선포 공식의 처리
  chosen_reading: ‘야훼의 말씀입니다’로 옮겨 예언자적 선언의 종결성을 살렸습니다.
  alternative_readings:
  - ‘야훼의 선언입니다’
  - ‘주의 말씀입니다’
  - ‘야훼의 말씀이니라’
  rationale: נְאֻם יְהוָה는 예언 문맥의 공식 표현이므로, 현대 합쇼체에서도 단정적 선포의 어조를 유지하는 것이 본문의 힘을 잘 드러냅니다.
  doctrine_reference: 예언자적 서문 공식의 문체 보존
- issue: 양보적 כִּי의 해석
  chosen_reading: 전후 문맥상 ‘그것은 …일지라도’로 읽었습니다.
  alternative_readings:
  - ‘왜냐하면’
  - ‘그것은 …이기 때문에’
  - ‘비록 …이라도’
  rationale: 히브리어 כִּי가 여기서는 단순 원인보다 양보적 뉘앙스를 띠므로, POB의 해석을 따라 숲이 ‘찾아헤아릴 수 없음’에도 불구하고 베임을 당하는 역설을 살렸습니다.
  doctrine_reference: 문맥 기반 접속사 해석
