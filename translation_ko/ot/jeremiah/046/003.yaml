  rationale: 영어 POB가 두 무기를 구분해 제시한 점을 따라, מָגֵן과의 대조가 보이도록 ‘작은 방패’로 옮겼습니다.
- source_word: וּגְשׁוּ
  english_pob_choice: advance
  chosen_korean: 나아가십시오
  alternatives_korean:
