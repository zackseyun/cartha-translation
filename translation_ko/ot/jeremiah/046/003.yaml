lexical_decisions:
- source_word: עִרְכוּ
  english_pob_choice: Prepare
  chosen_korean: 갖추고
  alternatives_korean:
  - 준비하고
  - 정렬하고
  - 배치하고
  lexicon: HALOT
  rationale: 군사적 문맥에서 단순한 ‘준비하다’보다 무기를 전투 태세로 갖추게 한다는 뜻을 더 자연스럽게 드러냅니다.
- source_word: מָגֵן
  english_pob_choice: buckler
  chosen_korean: 방패
  alternatives_korean:
  - 작은 방패
  - 버클러
  lexicon: HALOT
  rationale: 한국어에서는 ‘버클러’보다 ‘작은 방패’ 또는 ‘방패’가 이해 가능성이 높아, צִנָּה와의 대비는 주석으로 남기고 본문은 읽기 쉽게 처리했습니다.
- source_word: צִנָּה
  english_pob_choice: shield
  chosen_korean: 작은 방패
  alternatives_korean:
  - 방패
  - 큰 방패
  lexicon: HALOT
  rationale: 영어 POB가 두 무기를 구분해 제시한 점을 따라, מָגֵן과의 대조가 보이도록 ‘작은 방패’로 옮겼습니다.
- source_word: וּגְשׁוּ
  english_pob_choice: advance
  chosen_korean: 나아가십시오
  alternatives_korean:
  - 다가가십시오
  - 전진하십시오
  - 접근하십시오
  lexicon: HALOT
  rationale: 전투를 향한 움직임을 자연스럽게 살리면서도, 원어의 ‘다가가다/접근하다’ 의미를 과도하게 약화시키지 않도록 했습니다.
- source_word: לַמִּלְחָמָה
  english_pob_choice: to battle
  chosen_korean: 전투로
  alternatives_korean:
  - 싸움으로
  - 전쟁으로
  - 전투를 향해
  lexicon: HALOT
  rationale: לְ + 명사 구문을 목적지/방향으로 받아들여, 전투에 들어가는 움직임을 한국어 조사로 간결하게 표현했습니다.
