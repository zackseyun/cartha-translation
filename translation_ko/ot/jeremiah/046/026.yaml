  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְתַתִּ֗י/ם בְּ/יַד֙ מְבַקְשֵׁ֣י נַפְשָׁ֔/ם וּ/בְ/יַ֛ד נְבֽוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל וּ/בְ/יַד עֲבָדָ֑י/ו וְ/אַחֲרֵי כֵ֛ן תִּשְׁכֹּ֥ן כִּֽ/ימֵי קֶ֖דֶם נְאֻם יְהוָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/026.yaml
  text: And I will give them into the hand of those who seek their life[a], and into the hand of Nebuchadnezzar king of Babylon, and into the hand of his servants. But afterward she will dwell as in days of old[b], declares Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; conventionally rendered ''Nebuchadnezzar'' in English.'
    reason: lexical_alternative
  - marker: b
    text: Or 'those who seek to kill them'; Hebrew literally, 'those who seek their life.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 그들의 목숨을 노리는 자들의 손과 바벨론 왕 느부갓네살의 손과 그의 신하들의 손에 넘겨주겠습니다. 그러나 그 뒤에는 이집트가 옛날처럼[a] 살게 될 것입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘옛적의 날들처럼’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  english_pob_choice: And I will give them
  chosen_korean: 내가 그들을 … 넘겨주겠습니다
  alternatives_korean:
  - 내가 그들을 … 주겠습니다
  - 내가 그들을 … 넘기겠습니다
  lexicon: HALOT
  rationale: 히브리어 נתן은 여기서 ‘주다’보다 적대적 상황의 결과를 드러내는 ‘넘겨주다’가 더 자연스럽고, 이어지는 ‘손에’ 관용구와도 잘 맞습니다.
- source_word: בְיַד / וּבְיַד
  english_pob_choice: into the hand of
  chosen_korean: …의 손에
  alternatives_korean:
  - …의 권세 아래
  - …의 힘에
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 그대로 살려, 단순한 신체 부위가 아니라 지배·처분의 권한을 뜻하는 표현임을 유지했습니다.
- source_word: מְבַקְשֵׁי נַפְשָׁם
  english_pob_choice: those who seek their life
  chosen_korean: 자기들의 생명을 찾는 자들
  alternatives_korean:
  - 그들을 죽이려는 자들
  - 생명을 노리는 자들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘생명을 찾는 자들’로 히브리어의 문구를 보존하되, 한국어에서는 소유격을 보완해 의미가 자연스럽게 읽히도록 했습니다.
- source_word: וְאַחֲרֵי כֵן תִּשְׁכֹּן כִּימֵי קֶדֶם
  english_pob_choice: But afterward she will dwell as in days of old
  chosen_korean: 그러나 그 뒤에는 예전의 날들처럼 거주할 것입니다
  alternatives_korean:
  - 그러나 그 뒤에는 옛날처럼 살 것입니다
  - 그러나 이후에는 예전처럼 다시 거주할 것입니다
  lexicon: HALOT
  rationale: 여성 단수 동사 תִּשְׁכֹּן의 주어를 에집트로 보아 ‘그 뒤에는’과 함께 복원했고, כִּימֵי קֶדֶם은 관용적으로 ‘예전의 날들처럼’으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 결어를 한국어 성경체로 자연스럽게 옮기되, מקור의 신명기 명칭 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 렌더링했습니다.
theological_decisions:
- issue: 예언적 판단과 회복의 대비
  chosen_reading: ‘그러나 그 뒤에는’으로 심판에서 회복으로의 전환을 분명히 했습니다.
  alternative_readings:
  - ‘그리고 그 뒤에는’
  - ‘그 후에’
  rationale: 앞절의 처벌 선언과 뒤이은 회복 약속 사이의 반전을 한국어 접속으로 드러내는 것이 문맥상 중요합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: Preserve rhetorical force and discourse contrast'
- issue: 하나님 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명기가 직접 나와 있으므로, 프로젝트 기본값에 따라 언약적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
