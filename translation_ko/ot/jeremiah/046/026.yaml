  verdict: revise
  source_fidelity: ‘자기들의 생명을 찾는 자들’은 히브리어 מְבַקְשֵׁי נַפְשָׁם의 소유 관계를 한국어에서 잘못 드러내어, ‘자기 자신의 생명을 찾는 자들’로 읽힐 수 있습니다. 또한 후반절의 여성 단수 동사는 문맥상 이집트를 가리키므로, 한국어에서 주어를 밝혀 앞선 복수 목적어와 혼동되지 않게 해야 합니다.
  naturalness: ‘그들의 목숨을 노리는 자들’은 한국어에서 자연스러우면서도 ‘생명을 찾다’라는 히브리어 관용구의 적대적 뜻을 충실히 전달합니다. ‘이집트가 그 뒤에는 옛날처럼 살게 될 것입니다’는 국가를 여성 단수로 의인화한 원문의 뜻을 자연스럽게 보존합니다.
  terminology: ‘느부갓네살’, ‘바벨론 왕’, ‘신하들’, ‘야훼’는 표준 한국어 성경 문맥과 프로젝트의 신명 표기 원칙에 부합합니다. ‘넘겨주겠습니다’와 ‘손에’는 נתן 및 בְּיַד의 처분·지배 관용구를 적절히 반영합니다.
  issues:
