  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִי זֶ֖ה כַּ/יְאֹ֣ר יַֽעֲלֶ֑ה כַּ/נְּהָר֕וֹת יִֽתְגָּעֲשׁ֖וּ מֵימָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/007.yaml
  text: Who is this[a], rising like the Nile[b], like rivers whose waters surge?
  footnotes:
  - marker: a
    text: Hebrew יְאֹר can mean 'river,' but in this Egyptian context it likely refers specifically to the Nile.
    reason: lexical_alternative
  - marker: b
    text: Or 'whose waters roar' / 'whose waters heave.'
    reason: lexical_alternative
translation:
  language: ko
  text: “누가 나일처럼, 강들처럼 그 물이 넘쳐흐르는 이입니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי זֶה
  english_pob_choice: Who is this
  chosen_korean: “누가 이입니까?”
  alternatives_korean:
  - “누구입니까?”
  - “누가 저 사람입니까?”
  lexicon: HALOT
  rationale: מִי זֶה가 던지는 수사적 질문을 한국어의 자연스러운 조사형 질문으로 옮겨, 대상의 정체를 드러내는 긴장감을 살렸습니다.
- source_word: כַּיְאֹר
  english_pob_choice: like the Nile
  chosen_korean: “나일처럼”
  alternatives_korean:
  - “나일강처럼”
  - “강처럼”
  lexicon: HALOT
  rationale: 예레미야 46장의 애굽 문맥에서 יְאֹר는 일반적인 강보다 나일을 가리키는 뜻이 강하므로, 이를 한국어로도 분명하게 드러냈습니다.
- source_word: יִתְגָּעֲשׁוּ
  english_pob_choice: surge
  chosen_korean: “넘쳐흐르는”
  alternatives_korean:
  - “일렁이는”
  - “소용돌이치는”
  - “몰아치는”
  lexicon: HALOT
  rationale: 히트파엘 געש의 격렬하고 넘실거리는 물의 움직임을 한국어에서 가장 직관적으로 보여 주는 표현으로 옮겼습니다.
- source_word: מֵימָיו
  english_pob_choice: whose waters
  chosen_korean: “그 물이”
  alternatives_korean:
  - “그의 물이”
  - “그 강물들이”
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의/그것의 물’이지만, 시적 의인화와 한국어 문장 흐름을 고려하여 소유 관계를 풀어 ‘그 물이’로 자연스럽게 처리했습니다.
