  naturalness: ‘나일강처럼 솟아오르며 그 물결이 강들처럼 넘실거리는 이는 누구입니까?’는 현대 표준 한국어의 격식 있는 합쇼체로 자연스럽고, 수사적 질문의 시적 흐름도 유지합니다.
