source:
  edition: WLC
  text: אַ֠תָּה אַל תִּירָ֞א עַבְדִּ֤/י יַֽעֲקֹב֙ נְאֻם יְהוָ֔ה כִּ֥י אִתְּ/ךָ֖ אָ֑נִי כִּי֩ אֶעֱשֶׂ֨ה כָלָ֜ה בְּ/כָֽל הַ/גּוֹיִ֣ם אֲשֶׁ֧ר הִדַּחְתִּ֣י/ךָ שָׁ֗מָּ/ה וְ/אֹֽתְ/ךָ֙ לֹא אֶעֱשֶׂ֣ה כָלָ֔ה וְ/יִסַּרְתִּ֨י/ךָ֙ לַ/מִּשְׁפָּ֔ט וְ/נַקֵּ֖ה לֹ֥א אֲנַקֶּֽ/ךָּ־־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/028.yaml
  text: But you[a], do not fear, my servant Jacob, declares Yahweh, for I am with you. For I will make a full end of all the nations where I have driven you, but of you I will not make a full end. Yet I will discipline you with justice[b], and I will by no means leave you unpunished.
  footnotes:
  - marker: a
    text: Or 'I will not completely destroy you.' The Hebrew repeats 'make a full end' for rhetorical contrast between the nations and Jacob.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will certainly not acquit you.' The Hebrew can carry the forensic sense 'declare innocent,' though here it also implies not leaving Jacob without due punishment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 두려워하지 마십시오, 나의 종 야곱아. 야훼의 말씀입니다. 내가 너와 함께 있기 때문입니다. 내가 너를 그곳으로 몰아낸 모든 민족을 완전히 멸망시키겠지만, 너를 완전히 멸망시키지는 않겠습니다.[a] 그러나 너를 공의에 따라 징계하겠고, 결코 네가 벌을 면하게 하지는 않겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘완전히 멸망시키다’는 히브리어에서 ‘완전한 끝을 이루다’라는 표현이 모든 민족과 야곱을 대조하며 반복되는 것을 반영합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘결코 너를 무죄로 하지 않겠다’입니다. 히브리어는 법정적으로 ‘무죄로 선언하다’라는 뜻을 지닐 수 있으며, 여기서는 벌을 면하게 하지 않으신다는 뜻을 함께 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마라
  alternatives_korean:
  - 두려워하지 말라
  - 무서워하지 마라
  lexicon: HALOT
  rationale: 예언적 금지 표현을 현대 한국어 명령문으로 자연스럽게 살리면서, פחד/ירא의 기본 뜻인 두려움 금지를 직접 전달합니다.
- source_word: עַבְדִּי יַעֲקֹב
  english_pob_choice: my servant Jacob
  chosen_korean: 내 종 야곱
  alternatives_korean:
  - 나의 종 야곱
  - 내 종, 야곱
  lexicon: HALOT
  rationale: ‘종’은 עבד의 기본 의미를 유지하고, ‘야곱’을 그대로 살려 민족적/언약적 호칭을 보존합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언이니라
  lexicon: HALOT
  rationale: POB의 YHWH 기본 표기인 ‘야훼’를 따르고, נְאֻם의 공식적 예언 서식을 한국어 성경체로 압축해 옮겼습니다.
- source_word: כִּי אִתְּךָ אָנִי
  english_pob_choice: for I am with you
  chosen_korean: 내가 너와 함께 있기 때문이다
  alternatives_korean:
  - 내가 너와 함께하니
  - 내가 너와 함께 있기 때문입니다
  lexicon: HALOT
  rationale: 보호와 위로의 근거를 분명히 드러내는 인과절을 살리되, 한국어 어순에 맞게 매끄럽게 옮겼습니다.
- source_word: אֶעֱשֶׂה כָלָה
  english_pob_choice: I will make a full end
  chosen_korean: 완전히 멸망시킬 것이지만
  alternatives_korean:
  - 철저히 끝장낼 것이지만
  - 전멸시킬 것이지만
  lexicon: HALOT
  rationale: ‘make a full end’의 반복적 수사를 한국어에서 ‘완전히 멸망시키다’로 직역성 있게 살려, 열방과 야곱의 대조를 유지했습니다.
- source_word: וְנַקֵּה לֹא אֲנַקֶּךָּ
  english_pob_choice: I will by no means leave you unpunished
  chosen_korean: 결코 너를 무죄로 놓아주지는 않겠다
  alternatives_korean:
  - 결코 너를 벌하지 않고 넘어가지 않겠다
  - 결코 너를 무죄 판결하지 않겠다
  lexicon: HALOT
  rationale: נקה의 장부적/법정적 함의와 POB의 ‘leave you unpunished’ 선택을 반영해, 단순 처벌보다 ‘무죄 판정’의 부정으로 표현했습니다.
theological_decisions:
- issue: 야곱에 대한 멸망 금지와 징계의 공존
  chosen_reading: 하나님은 야곱을 열방처럼 전멸시키지 않으시되, 공의로운 징계는 실제로 행하십니다.
  alternative_readings:
  - 하나님은 야곱을 어떤 의미에서도 전혀 멸하지 않으십니다
  - 징계는 단지 교육적 표현일 뿐 실제 처벌은 아닙니다
  rationale: 본문은 ‘완전히 멸망’의 부정과 ‘징계’ 및 ‘무죄로 두지 않음’을 함께 두어 보존과 심판을 동시에 말하므로, 둘 중 하나로 평탄화하지 않았습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
