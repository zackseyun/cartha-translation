base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/005.yaml
  text: Why have I seen this? They are terrified[a], turning back; their warriors are crushed, and they have fled hastily and have not turned back. Terror is on every side[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'their mighty men are beaten down.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'fled in flight,' an emphatic expression for complete rout.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 내가 이것을 보았습니까? 그들은 겁에 질려 뒤로 물러서고, 그들의 용사들은 쓰러집니다[a]. 그들은 황급히 달아났으며[b] 돌아서지 않았습니다. 사방에는 공포가 있습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 용사들은 꺾였다’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘도망에 도망했다’는 식의 강한 반복으로, 완전한 패주를 강조합니다.
    reason: lexical_alternative
