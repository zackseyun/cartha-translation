theological_decisions:
- issue: 예언자적 종결 공식의 신명 번역
  chosen_reading: ‘야훼의 말씀입니다’로 마무리하여 예언 선포의 권위를 분명히 했습니다.
  alternative_readings:
  - ‘여호와의 말씀입니다’
  - ‘주님의 말씀이십니다’
  rationale: 본문의 נְאֻם יְהוָה는 직접적 신탁 공식이므로, 전통적 ‘주’로 완화하지 않고 신명과 예언 선언을 그대로 드러내는 것이 소스 충실성에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
