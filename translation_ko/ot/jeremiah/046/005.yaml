  - 사방에서 공포가 닥칩니다
  lexicon: HALOT
  rationale: 예레미야서의 반복적 관용구를 유지하되, 한국어에서는 공간적 압박을 분명히 하는 표현으로 옮겼습니다.
- source_word: יְהוָה
