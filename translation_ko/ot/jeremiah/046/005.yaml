  rationale: 문맥상 전투에 능한 병력을 가리키므로, 전통적이면서도 의미가 분명한 ‘용사들’을 택했습니다.
- source_word: מָנוֹס נָסוּ
  english_pob_choice: they have fled in flight
  chosen_korean: 급히 도망하며
