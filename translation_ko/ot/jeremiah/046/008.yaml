id: JER.46.8
reference: Jeremiah 46:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִצְרַ֨יִם֙ כַּ/יְאֹ֣ר יַֽעֲלֶ֔ה וְ/כַ/נְּהָר֖וֹת יִתְגֹּ֣עֲשׁוּ מָ֑יִם וַ/יֹּ֗אמֶר אַֽעֲלֶה֙ אֲכַסֶּה אֶ֔רֶץ אֹבִ֥ידָה עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/008.yaml
  text: Egypt rises like the Nile[a], and its waters surge like rivers. It says, ‘I will rise, I will cover the earth; I will destroy the city and those who dwell in it.’
  footnotes:
  - marker: a
    text: Or 'I will cover the land.' The Hebrew אֶרֶץ can mean either 'earth' or 'land'; the main text preserves the sweeping, hyperbolic force of Egypt's boast.
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트가 나일강[a]처럼 올라오고, 그 물이 강들처럼 소란을 일으킵니다. 그것은 이렇게 말합니다. “내가 올라가서 땅을 뒤덮고, 성과 그 안에 사는 자들을 멸하겠다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나일강처럼’. 히브리어 יְאֹר는 이집트 문맥에서 나일강을 가리키며, 본문은 이집트의 군사적·홍수 같은 팽창 이미지를 유지합니다.
    reason: source_note
lexical_decisions:
- source_word: מִצְרַיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 미스라임
  lexicon: HALOT
  rationale: 지명으로서의 표준 현대 한국어 표기를 택했고, 문맥상 국가를 의인화한 표현이므로 자연스럽습니다.
- source_word: כַּיְאֹר
  english_pob_choice: like the Nile
  chosen_korean: 나일강
  alternatives_korean:
  - 강
  - 나일
  lexicon: HALOT
  rationale: 이집트 문맥의 יְאֹר는 보통 나일강을 가리키므로, 일반적인 ‘강’보다 더 정확하고 구체적으로 옮겼습니다.
- source_word: וְכַנְּהָרוֹת יִתְגֹּעֲשׁוּ מָיִם
  english_pob_choice: and its waters surge like rivers
  chosen_korean: 그 물이 강들처럼 소란을 일으킵니다
  alternatives_korean:
  - 그 물이 강들처럼 요동칩니다
  - 그 물이 강물처럼 들끓습니다
  lexicon: HALOT
  rationale: 복수 ‘강들’과 물의 격렬한 움직임을 살리되, 한국어에서 자연스러운 동사 ‘소란을 일으키다’로 격동과 소용돌이의 이미지를 전달했습니다.
- source_word: אֹבִידָה
  english_pob_choice: I will destroy
  chosen_korean: 멸하겠다
  alternatives_korean:
  - 파멸시키겠다
  - 없애겠다
  lexicon: HALOT
  rationale: 전쟁적 위협의 강한 종결을 간결하게 살리는 동사로 옮겼습니다.
theological_decisions:
- issue: 에레츠(אֶרֶץ)의 범위
  chosen_reading: ‘땅’으로 옮겨 이집트의 과장된 팽창 선언을 살렸습니다.
  alternative_readings:
  - ‘온 땅’
  - ‘나라’
  rationale: 문맥은 이집트의 자만이 세계를 뒤덮겠다는 과장법을 드러내므로, 좁은 ‘나라’보다 더 넓은 ‘땅’이 원문의 수사적 힘을 보존합니다.
  doctrine_reference: 예레미야 46장 전반의 열방 심판 신탁
