id: JER.46.2
reference: Jeremiah 46:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/מִצְרַ֗יִם עַל חֵ֨יל פַּרְעֹ֤ה נְכוֹ֙ מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁר הָיָ֥ה עַל נְהַר פְּרָ֖ת בְּ/כַרְכְּמִ֑שׁ אֲשֶׁ֣ר הִכָּ֗ה נְבֽוּכַדְרֶאצַּר֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַת֙ הָֽ/רְבִיעִ֔ית לִ/יהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֥לֶךְ יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/046/002.yaml
  text: 'Concerning Egypt: concerning the army of Pharaoh Neco king of Egypt[a], which was by the Euphrates River at Carchemish, which Nebuchadnezzar king of Babylon struck down in the fourth year of Jehoiakim son of Josiah[b], king of Judah.'
  footnotes:
  - marker: a
    text: Hebrew could also be rendered 'Against Egypt' at the heading; here 'Concerning Egypt' is chosen because the verse functions as a superscription introducing the subject of the oracle.
    reason: alternative_reading
  - marker: b
    text: The Hebrew name form here is closer to 'Nebuchadrezzar'; English tradition commonly uses 'Nebuchadnezzar.'
    reason: lexical_alternative
translation:
  language: ko
  text: '「이집트에 관하여[a]: 유프라테스 강가의 갈그미스에 있던 이집트 왕 파라오 느고의 군대에 관하여. 바빌론 왕 느부갓네살[b]이 유다 왕 요시야의 아들 여호야김 제4년에 그 군대를 쳤습니다.」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표제는 ‘이집트를 거슬러’로도 옮길 수 있습니다. 그러나 여기서는 뒤따르는 역사적 설명의 대상을 소개하는 표제로 보아 ‘이집트에 관하여’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 여기의 히브리어 이름 형태는 통상적인 한국어 성경의 ‘느부갓네살’보다 ‘느부갓레살’에 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמִצְרַיִם / עַל
  english_pob_choice: Concerning Egypt / concerning
  chosen_korean: 「이집트에 관하여」
  alternatives_korean:
  - 「이집트를 향하여」
  - 「이집트에 대하여」
  - 「이집트에게」
  lexicon: HALOT
  rationale: 예언서 표제에서 לְ + 국가명은 단순한 방향보다 주제 표지를 이루므로, 영어 POB의 'Concerning Egypt'에 맞춰 한국어도 '…에 관하여'로 옮겨 오라클의 주제 소개 기능을 살렸습니다.
- source_word: חֵיל
  english_pob_choice: army
  chosen_korean: 군대
  alternatives_korean:
  - 병력
  - 군사력
  - 군사
  lexicon: HALOT
  rationale: 여기서는 일반적인 힘이 아니라 군사 집단을 가리키므로, 현대 한국어에서 가장 자연스럽고 명료한 '군대'를 택했습니다.
- source_word: פַּרְעֹה נְכוֹ
  english_pob_choice: Pharaoh Neco
  chosen_korean: 파라오 느고
  alternatives_korean:
  - 파라오 네고
  - 바로 느고
  lexicon: HALOT
  rationale: 히브리어 음가를 반영하는 '느고'가 표준화된 음역에 가장 가깝고, 본문이 지칭하는 이집트 왕호는 직역하여 '파라오'로 두는 것이 원문 구조를 잘 살립니다.
- source_word: בְּכַרְכְּמִשׁ
  english_pob_choice: at Carchemish
  chosen_korean: 갈그미스에 있던
  alternatives_korean:
  - 갈그미스에서
  - 갈그미스에
  lexicon: HALOT
  rationale: 전투 장소를 나타내는 באר/בְּ 구문이므로, 문맥상 '있던'을 더해 군대의 위치를 자연스럽게 풀되 지명 자체는 그대로 보존했습니다.
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 무찔렀습니다
  - 쳐부쉈습니다
  - 때렸습니다
  lexicon: HALOT
  rationale: נכה는 '치다/쳐서 쓰러뜨리다'의 폭을 가지며, 영어 POB의 'struck down'에 대응해 과도하게 해석적인 '무찔렀습니다'보다 원형적 동사를 살렸습니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓네살
  - 네부카드네자르
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 널리 인지되는 표준 음역을 유지하되, 히브리어 철자상 더 가까운 형태와의 차이는 본문 독해의 흐름을 해치지 않는 범위에서 감수했습니다.
- source_word: בִּשְׁנַת הָרְבִיעִית לִיהוֹיָקִים
  english_pob_choice: in the fourth year of Jehoiakim
  chosen_korean: 유다 왕 요시야의 아들 여호야김의 제4년에
  alternatives_korean:
  - 여호야김의 제4년에
  - 여호야김 왕의 제4년에
  lexicon: HALOT
  rationale: 히브리어의 왕위 연대 공식은 소유격 관계를 통해 표시되므로, '제4년에'와 함께 이어지는 인명 관계를 명시해 영어 POB의 연대 표지를 한국어에서 분명하게 전달했습니다.
theological_decisions:
- issue: 표제 구문의 방향성
  chosen_reading: 이 구절은 적대적 선언을 앞세운 본문이라기보다, 예언의 대상을 밝히는 표제 기능을 우선하여 '이집트에 관하여'로 시작했습니다.
  alternative_readings:
  - 이집트를 향하여
  - 이집트에 대하여
  - 이집트를 거슬러
  rationale: 히브리어 לְ/עַל 조합은 오라클 표제에서 주제 표지를 이룰 수 있으므로, 본문 기능을 따라 과도한 적대 뉘앙스를 먼저 고정하지 않았습니다.
  doctrine_reference: 예언서 서문·표제 기능의 문맥 우선 원칙
