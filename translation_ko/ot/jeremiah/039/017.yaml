  text: וְ/הִצַּלְתִּ֥י/ךָ בַ/יּוֹם הַ/ה֖וּא נְאֻם יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ בְּ/יַ֣ד הָֽ/אֲנָשִׁ֔ים אֲשֶׁר אַתָּ֥ה יָג֖וֹר מִ/פְּנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/017.yaml
  text: But I will deliver you on that day[a], declares Yahweh[b], and you will not be given into the hand of the men of whom you are afraid.
  footnotes:
  - marker: a
    text: Or 'rescue you' or 'save you.' The Hebrew verb can carry the sense of delivering someone from danger.
    reason: lexical_alternative
  - marker: b
    text: Literally 'into the hand of the men.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 내가 그날에 당신을 구해 드릴 것입니다[a]. 야훼의 말씀입니다. 그리고 당신은 당신이 두려워하는 그 사람들의 손에[b] 넘겨지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구출해 드릴 것입니다’, ‘건져 드릴 것입니다’. 히브리어 동사는 위험에서 건져 내는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 사람들의 권세 아래’. 직역하면 ‘그 사람들의 손에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  english_pob_choice: But I will deliver you
  chosen_korean: 그러나 내가 당신을 구해 드릴 것입니다
  alternatives_korean:
  - 그리고 내가 당신을 건져 드릴 것입니다
  - 그리고 내가 당신을 구원해 드릴 것입니다
  lexicon: HALOT
  rationale: 히필 נצל은 위험에서 건져 내고 구해 내는 뜻이므로, 현대 한국어에서는 ‘구해 드리다’가 가장 자연스럽게 구출의 의미를 살립니다. 문맥상 대조가 분명하므로 앞의 וְ는 ‘그러나’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 직설적 화행보다 선포 공식을 드러내는 표현이어서, 한국어에서는 ‘말씀입니다’로 옮겨 예언적 어조를 유지했습니다.
- source_word: וְלֹא תִנָּתֵן
  english_pob_choice: and you will not be given
  chosen_korean: 그리고 당신은 … 넘겨지지 않을 것입니다
  alternatives_korean:
  - 그리고 당신은 … 주어지지 않을 것입니다
  - 그리고 당신은 … 건네지지 않을 것입니다
  lexicon: HALOT
  rationale: 니팔 נתן의 수동 의미를 살리되, 뒤의 ‘손에’와 결합되는 한국어에서는 ‘넘겨지다’가 가장 자연스럽고 강한 피동 뉘앙스를 전달합니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 권세에
  - 힘 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 ‘손에’로 옮겼으며, 이는 통제·지배 아래로 넘어감을 생생하게 유지합니다.
- source_word: אֲשֶׁר אַתָּה יָגוֹר מִפְּנֵיהֶם
  english_pob_choice: of whom you are afraid
  chosen_korean: 당신이 두려워하는 그 사람들
  alternatives_korean:
  - 당신이 그들 앞에서 두려워하는 사람들
  - 당신이 무서워하는 사람들
  lexicon: HALOT
  rationale: גור + מִפְּנֵי는 단순한 감정 이상의 ‘두려움 앞에 서 있음/두려워함’을 뜻하므로, 자연스럽고 직접적인 ‘두려워하는’으로 옮겼습니다. הָאֲנָשִׁים은 복수 남성형이므로 ‘그 사람들’로 구체화했습니다.
theological_decisions:
- issue: 예언적 선포 공식 נְאֻם יְהוָה의 한국어 처리
  chosen_reading: ‘야훼의 말씀입니다’로 옮겨, 단순 서술보다 하나님의 직접 선포를 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: 이 공식은 본문의 권위를 표시하는 정형 표현이므로, 평서형 문장 안에 쉼표로 끼워 넣기보다 독립적인 선포문으로 처리하는 것이 예언서의 어조를 더 잘 보존합니다.
  doctrine_reference: Jeremiah prophetic formula נְאֻם יְהוָה
