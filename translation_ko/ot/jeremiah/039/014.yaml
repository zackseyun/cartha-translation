id: JER.39.14
reference: Jeremiah 39:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלְחוּ֩ וַ/יִּקְח֨וּ אֶֽת יִרְמְיָ֜הוּ מֵ/חֲצַ֣ר הַ/מַּטָּרָ֗ה וַ/יִּתְּנ֤וּ אֹת/וֹ֙ אֶל גְּדַלְיָ֨הוּ֙ בֶּן אֲחִיקָ֣ם בֶּן שָׁפָ֔ן לְ/הוֹצִאֵ֖/הוּ אֶל הַ/בָּ֑יִת וַ/יֵּ֖שֶׁב בְּ/ת֥וֹךְ הָ/עָֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/014.yaml
  text: So they sent and took Jeremiah from the court of the guard, and they entrusted him to Gedaliah son of Ahikam, son of Shaphan, to bring him home. So he lived among the people.
translation:
  language: ko
  text: 그들이 사람을 보내어 시위대 뜰에서 예레미야를 데려다가, 아히감의 아들, 사반의 손자 그달리야에게 맡겨 집으로 데려가게 하였더니, 그는 백성 가운데서 살았습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘시위대 뜰’은 히브리어의 감금 공간을 가리키는 표현으로, 문맥상 경비·보호가 동시에 연상됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֵחֲצַר הַמַּטָּרָה
  english_pob_choice: from the court of the guard
  chosen_korean: 시위대 뜰에서
  alternatives_korean:
  - 경비 뜰에서
  - 감옥 뜰에서
  - 수비대 뜰에서
  lexicon: חָצֵר; מַּטָּרָה
  rationale: WLC의 장소 표현을 한국어로는 감옥 내부의 ‘뜰’이라는 공간감이 살아나도록 옮기되, 공적인 감시·구금의 성격을 반영해 ‘시위대’로 처리했습니다.
- source_word: וַיִּתְּנוּ אֹתוֹ אֶל גְּדַלְיָהוּ
  english_pob_choice: they entrusted him to Gedaliah
  chosen_korean: 그달리야에게 맡겨
  alternatives_korean:
  - 그달리야에게 넘겨
  - 그달리야에게 인계하여
  - 그달리야에게 맡기고
  lexicon: נתן + אל
  rationale: 직역의 ‘주다’보다, 여기서는 예레미야의 보호·관리 책임을 넘기는 뜻이어서 POB의 ‘entrusted’에 맞는 ‘맡기다’를 사용했습니다.
- source_word: לְהוֹצִיאוֹ אֶל הַבָּיִת
  english_pob_choice: to bring him home
  chosen_korean: 집으로 데려가게 하였더니
  alternatives_korean:
  - 집으로 데려가게 하였더니
  - 집안으로 데려가게 하였더니
  - 집으로 이끌게 하였더니
  lexicon: בַּיִת
  rationale: הַבָּיִת를 단순 건물의 ‘집’이 아니라 예레미야가 머물 생활 공간으로 이해해야 하므로, POB의 ‘home’를 살려 자연스럽게 옮겼습니다.
- source_word: וַיֵּשֶׁב בְּתוֹךְ הָעָם
  english_pob_choice: So he lived among the people
  chosen_korean: 그는 백성 가운데서 살았습니다
  alternatives_korean:
  - 그는 백성 가운데서 살았습니다
  - 그리하여 그는 백성 한가운데 살았습니다
  - 그는 백성 가운데 머물렀습니다
  lexicon: ישׁב + בתוך
  rationale: ‘거주하다’의 지속 상태를 살리면서 גם ‘among’의 공동체적 위치를 드러내기 위해 ‘가운데서 살다’로 옮겼습니다.
theological_decisions:
- issue: 예레미야의 이동 목적을 어떻게 표현할지
  chosen_reading: ‘집으로 데려가게 하였더니’로 옮겨, 단순한 이송이 아니라 보호받는 거처로 옮겨지는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘집으로 데려가게 하였다’
  - ‘집으로 이르게 하였다’
  rationale: POB의 최신 판본이 ‘to bring him home’로 정리한 해석을 반영해, 예레미야가 다시 공동체 안의 생활 공간으로 복귀하는 장면을 분명히 했습니다.
  doctrine_reference: 서술적 맥락 해석
