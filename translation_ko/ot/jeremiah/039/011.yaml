  lexicon: HALOT
  rationale: 히브리어의 속격 관계를 자연스러운 한국어 관형 구조로 옮겼고, 성경에서 널리 쓰이는 ‘바벨론’을 유지했습니다.
- source_word: עַל יִרְמְיָהוּ
