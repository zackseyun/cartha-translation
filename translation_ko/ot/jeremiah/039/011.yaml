  - 처형인들의 우두머리
  lexicon: HALOT
  rationale: 직역의 배경 의미는 ‘도살자/집행인들의 우두머리’이지만, 왕실 군사 문맥에서는 친위대 지휘관을 가리키므로 읽기 쉬운 역사적 기능어인 ‘친위대장’으로 옮겼습니다.
