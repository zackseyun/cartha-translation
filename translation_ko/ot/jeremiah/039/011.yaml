    text: Or 'chief of the executioners'; literally, 'chief of the slaughterers/butchers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론 왕 느부갓네살이 느부사라단, 곧 친위대장이며, 예레미야에 관하여 명령을 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘도살자들/집행인들의 우두머리’라는 뜻이지만, 여기서는 왕의 친위·처형 집행을 맡은 관직을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: gave orders
  chosen_korean: 명령을 내렸습니다
