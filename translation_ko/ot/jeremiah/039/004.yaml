  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר רָ֠אָ/ם צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כֹ֣ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַֽ֠/יִּבְרְחוּ וַ/יֵּצְא֨וּ לַ֤יְלָה מִן הָ/עִיר֙ דֶּ֚רֶךְ גַּ֣ן הַ/מֶּ֔לֶךְ בְּ/שַׁ֖עַר בֵּ֣ין הַ/חֹמֹתָ֑יִם וַ/יֵּצֵ֖א דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/004.yaml
  text: And when Zedekiah king of Judah and all the men of war saw them[a], they fled and went out by night from the city by way of the king’s garden, through the gate between the two walls[b]; and he went out by way of the Arabah.
  footnotes:
  - marker: a
    text: Hebrew has 'he went out' in the final clause, though some translations smooth this to 'they went out' to match the earlier plural verbs.
    reason: textual_variant
  - marker: b
    text: Or 'the plain' or 'the Jordan Valley' for 'the Arabah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야와 모든 군인들이 그들을 보았을 때, 그들은 도망하여 밤에 성읍에서 나와 왕의 정원을 지나 두 성벽 사이의 문을 통과하였고, 그는 아라바[b] 길로 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마소라 본문은 마지막 절에서 단수 동사 ‘그는 나갔다’를 사용하지만, 일부 번역은 앞의 복수 동사들과 맞추어 ‘그들은 나갔다’로 매끈하게 옮깁니다.
    reason: textual_variant
  - marker: b
    text: ‘아라바’는 ‘평야’ 또는 ‘요단 계곡’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָם
  english_pob_choice: saw them
  chosen_korean: 그들을 보았을 때
  alternatives_korean:
  - 보았을 때
  - 그들을 보았을 때
  lexicon: HALOT
  rationale: 히브리어 목적어 대명사 -ם을 반영해 ‘그들을’로 분명히 하되, 한국어 문맥상 자연스럽게 ‘보았을 때’로 옮겼습니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the men of war
  chosen_korean: 모든 군인들
  alternatives_korean:
  - 전쟁의 사람들
  - 전사들
  - 군인들
  lexicon: HALOT
  rationale: 직역의 ‘전쟁의 사람들’보다 이 구문이 가리키는 군사 집단을 현대 한국어에서 분명히 드러내는 ‘군인들’이 자연스럽습니다.
- source_word: בְּשַׁעַר בֵּין הַחֹמֹתָיִם
  english_pob_choice: through the gate between the two walls
  chosen_korean: 두 성벽 사이의 문을 통해
  alternatives_korean:
  - 두 성벽 사이의 문으로
  - 성벽들 사이의 문을 통해
  lexicon: HALOT
  rationale: 이중형 חֹמֹתָיִם을 ‘두 성벽’으로 살려, 이동 동사와 맞게 ‘문을 통해’로 방향을 분명히 했습니다.
- source_word: הָעֲרָבָה
  english_pob_choice: the Arabah
  chosen_korean: 아라바 길
  alternatives_korean:
  - 아라바
  - 평야 길
  - 요단 계곡 길
  lexicon: HALOT
  rationale: 지리 용어를 일반명사로 풀지 않고 음역 ‘아라바’를 유지하되, 본문 흐름상 이동 경로를 드러내기 위해 ‘길’을 덧붙였습니다.
theological_decisions:
- issue: 히브리어 마지막 절의 단수 동사 וַיֵּצֵא를 어떻게 반영할지
  chosen_reading: ‘그는 … 나갔습니다’로 단수형을 유지했습니다.
  alternative_readings:
  - ‘그들은 … 나갔습니다’로 앞의 복수 동사들과 맞춤
  - 단수/복수를 흐리게 처리
  rationale: POB 영어 주석이 지적하듯 마소라 본문은 마지막 절에서 단수 동사를 유지하므로, 이를 평준화하지 않고 보존했습니다.
  doctrine_reference: 본문비평/어법상의 차이를 평탄화하지 않는 원문 충실성 원칙
