- source_word: וַיָּצֻרוּ עָלֶיהָ
  english_pob_choice: and they laid siege to it
  chosen_korean: 그곳을 포위하였습니다
  alternatives_korean:
  - 그곳에 포위하였습니다
  - 그곳을 에워쌌습니다
  lexicon: HALOT
  rationale: צור의 군사적 의미를 분명히 드러내는 표준적 한국어로 옮겼습니다.
theological_decisions:
- issue: 전쟁 서술의 직접성
  chosen_reading: 본문의 역사적·군사적 진행을 완곡하게 바꾸지 않고, ‘포위하였습니다’로 직설적으로 옮겼습니다.
  alternative_readings:
  - 에워쌌습니다
  - 공격하였습니다
  rationale: 이 절은 예루살렘 공성의 시작을 기록하는 역사 서술이므로, 원문의 군사적 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 역사서술의 문맥 보존
