base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/001.yaml
  text: In the ninth year of Zedekiah king of Judah[a], in the tenth month, Nebuchadnezzar king of Babylon came to Jerusalem with all his army, and they laid siege to it.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; traditionally rendered ''Nebuchadnezzar'' in English.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 시드기야의 제9년[a], 열째 달에 바빌론 왕 느부갓네살이 그의 온 군대와 함께 예루살렘으로 와서, 그곳을 포위하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 철자는 ‘느부갓레살’에 더 가깝지만, 한국어 성경에서 널리 쓰이는 ‘느부갓네살’을 따랐습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הַתְּשִׁעִית
  english_pob_choice: In the ninth year
  chosen_korean: 제9년
  alternatives_korean:
