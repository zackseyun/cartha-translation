lexical_decisions:
- source_word: בְּ/עַשְׁתֵּֽי עֶשְׂרֵ֤ה שָׁנָה֙ לְ/צִדְקִיָּ֔הוּ
  english_pob_choice: In the eleventh year of Zedekiah
  chosen_korean: 시드기야의 열한째 해
  alternatives_korean:
  - 시드기야의 열한 해째 되는 때
  - 시드기야의 제11년
  lexicon: HALOT
  rationale: 히브리어의 연대 표시는 왕의 치세를 기준으로 하는 관용구이므로, 한국어도 자연스럽게 ‘~의 열한째 해’로 옮겨 시점을 보존했습니다.
- source_word: בַּ/חֹ֥דֶשׁ הָ/רְבִיעִ֖י
  english_pob_choice: in the fourth month
  chosen_korean: 넷째 달
  alternatives_korean:
  - 네 번째 달
  - 사월
  lexicon: HALOT
  rationale: 원문은 달의 서수를 제시하므로, 현대 절기명으로 바꾸지 않고 ‘넷째 달’로 직역해 달 번호를 유지했습니다.
- source_word: בְּ/תִשְׁעָ֣ה לַ/חֹ֑דֶשׁ
  english_pob_choice: on the ninth day of the month
  chosen_korean: 그 달 아홉째 날에
  alternatives_korean:
  - 그 달 아홉째 되는 날에
  - 아홉째 날에
  lexicon: HALOT
  rationale: 히브리어는 달 안의 날짜를 뜻하는 관용 표현이므로, 앞절의 ‘달’을 받아 ‘그 달 아홉째 날에’로 자연스럽게 정리했습니다.
- source_word: הָבְקְעָ֖ה הָ/עִֽיר־
  english_pob_choice: the city was breached
  chosen_korean: 성읍이 함락되었습니다
  alternatives_korean:
  - 성읍이 뚫렸습니다
  - 성읍이 파괴되었습니다
  - 성읍이 무너졌습니다
  lexicon: HALOT
  rationale: בקע의 ‘갈라지다/뚫리다’는 군사적 돌파를 가리키지만, 한국어에서는 성읍의 성벽이 뚫려 전투가 패배로 끝나는 결과를 드러내는 ‘함락되다’가 가장 정확하고 자연스럽습니다.
theological_decisions:
- issue: 예루살렘의 직접 명시 여부
  chosen_reading: 원문대로 ‘성읍’으로 두고, 주석 없이도 문맥상 예루살렘을 가리키게 했습니다.
  alternative_readings:
  - 예루살렘 성읍
  - 그 도시
  rationale: 히브리어는 특정 도시명을 쓰지 않고 정관사 있는 ‘성읍’을 사용하므로, 원문의 절제된 표현을 유지하는 편이 더 직접적입니다.
  doctrine_reference: 성경 본문의 역사 서술 정확성
