  source_fidelity: ‘함락되었습니다’는 성이 돌파된 결과를 앞당겨 표현하여, הָבְקְעָה(‘뚫리다, 돌파되다’)의 직접적 군사 표현보다 강합니다. ‘성읍이 뚫렸습니다’로 옮기면 성벽·방어선이 돌파된 사건을 원문에 가깝게 유지합니다. 날짜와 연대 표현은 원문의 순서와 의미를 충실히 반영합니다.
  naturalness: ‘시드기야의 열한째 해’도 이해되지만, 왕의 재위 연대를 나타내는 한국어 성경 문체로는 ‘시드기야 제십일년’이 더 자연스럽고 간결합니다. ‘성읍이 뚫렸습니다’는 포위전 문맥에서 자연스러운 표현입니다.
  terminology: 시드기야, 넷째 달, 성읍은 적절합니다. 날짜에서 ‘날’은 히브리어 관용구에 함축되어 있으므로 본문에 보충할 수 있으며, 각주는 이를 명확히 하는 대안으로 조정합니다.
