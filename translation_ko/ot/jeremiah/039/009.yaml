  source_fidelity: 현 번역은 יֶתֶר הָעָם הַנִּשְׁאָרִים를 ‘남은 백성의 남은 자들’로 옮겨, ‘백성 가운데 남은 자들’이라는 원문의 수식 관계를 부자연스럽게 이중화합니다. 또한 הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו는 상대편에게 넘어간 이들을 뜻할 뿐 ‘도망자들’이라는 의미는 포함하지 않습니다. 수정문은 세 부류의 목적어와 반복을 보존하고, 마지막 반복구에 없는 ‘도성’도 보충하지 않았습니다.
  naturalness: ‘도성에 남아 있던 나머지 백성’ 및 ‘남아 있던 나머지 백성’은 현대 표준 한국어로 자연스러우면서 원문의 반복을 드러냅니다. ‘포로로 끌고 갔습니다’는 강제 이주/유배의 의미를 명료하게 전달하는 합쇼체 표현입니다.
  terminology: 느부사라단과 바빌론은 통용 표기를 사용했습니다. רַב־טַבָּחִים는 문맥상 왕실·군사 직책이므로 ‘경호대장’으로 옮기고, 각주에서 문자적 어원 및 직책성을 밝혔습니다. ‘그에게’는 선행 대상이 본문 자체에서 명시되지 않는 점을 보존합니다.
  issues:
