id: JER.39.9
reference: Jeremiah 39:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֣ר נָפְל֣וּ עָלָ֔י/ו וְ/אֵ֛ת יֶ֥תֶר הָ/עָ֖ם הַ/נִּשְׁאָרִ֑ים הֶגְלָ֛ה נְבֽוּזַר אֲדָ֥ן רַב טַבָּחִ֖ים בָּבֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/009.yaml
  text: As for the rest of the people who remained in the city[a], and the deserters who had gone over to him, together with the rest of the people who remained, Nebuzaradan, the captain of the guard[c][b], carried away to Babylon.
  footnotes:
  - marker: a
    text: Or 'those who had defected to him.' The Hebrew idiom literally says 'those who had fallen to him,' a military expression for going over to the opposing side.
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats 'the rest of the people who remained.' The repetition has been preserved rather than smoothed out.
    reason: lexical_alternative
  - marker: c
    text: '''Captain of the guard'' renders a title literally related to ''chief of the slaughterers,'' an official Babylonian royal/military post.'
    reason: cultural_note
translation:
  language: ko
  text: 도성에 남은 백성의 남은 자들과 그에게로 넘어간 도망자들과, 또 남은 백성의 남은 자들을 느부사라단 곧 친위대장이 바빌로니아로 사로잡아 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그에게로 떨어진/넘어간 자들’입니다. 군사적 관용구로서 상대편에게 투항하거나 넘어간 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘남은 백성의 남은 자들’을 반복합니다. 의미를 매끄럽게 줄이기보다 반복을 보존했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘친위대장’은 문자적으로는 ‘도살자들의 우두머리’에 가깝지만, 이 본문에서는 바빌론 왕실/군사 직책을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר הָעָם
  english_pob_choice: the rest of the people
  chosen_korean: 백성의 남은 자들
  alternatives_korean:
  - 나머지 백성
  - 백성의 나머지
  lexicon: HALOT
  rationale: יֶתֶר는 ‘남은 것/나머지’를 뜻하므로, 문맥상 자연스러운 ‘남은 자들’로 옮겨 남은 무리를 분명히 했습니다.
- source_word: הַנִּשְׁאָרִים
  english_pob_choice: who remained
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남아 있던 사람들
  - 남겨진 자들
  lexicon: HALOT
  rationale: 분사형은 ‘남겨져 남아 있는 자들’의 뜻이므로, 한국어에서는 중복을 피하면서도 상태를 분명히 하는 ‘남은 자들’이 적절합니다.
- source_word: הַנֹּפְלִים אֲשֶׁר נָפְלוּ עָלָיו
  english_pob_choice: the deserters who had gone over to him
  chosen_korean: 그에게로 넘어간 도망자들
  alternatives_korean:
  - 그에게로 투항한 자들
  - 그에게로 전향한 자들
  lexicon: HALOT
  rationale: נפל על의 군사적 관용구는 적진/상대편으로 ‘넘어가다’는 뜻이므로, ‘도망자들’과 결합해 배신·이탈의 뉘앙스를 살렸습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 친위대장
  alternatives_korean:
  - 경호대장
  - 호위대장
  lexicon: HALOT
  rationale: 직역하면 ‘도살자들의 우두머리’이지만, 문맥상 바빌론 왕실의 군사 직함이므로 기능적으로 대응하는 ‘친위대장’을 택했습니다.
theological_decisions:
- issue: 반복 표현의 보존
  chosen_reading: ‘남은 백성의 남은 자들’을 두 번 반복해 원문의 반복을 그대로 드러냈습니다.
  alternative_readings:
  - 한 번만 묶어 자연스럽게 정리함
  rationale: 히브리어는 같은 구조를 반복해 강조하므로, 의미상 중복처럼 보여도 평탄화하지 않고 반복을 유지하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 반복 보존 원칙
