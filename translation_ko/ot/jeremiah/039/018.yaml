  source_fidelity: 본문의 핵심 의미는 대체로 정확합니다. 다만 לְשָׁלָל의 전쟁 은유는 ‘노획물처럼 너의 것이’보다 ‘전리품처럼 얻게 된다’로 옮기는 편이 히브리어의 ‘네 목숨이 네게 전리품으로 될 것이다’라는 구문과 한국어 관용을 더 잘 살립니다. 각주 내용은 본문상의 해당 어구에 맞게 재배치해야 합니다.
  naturalness: ‘네 생명은 노획물처럼 너의 것이 될 것이다’는 현대 표준 한국어에서 다소 직역투입니다. ‘너는 목숨을 전리품처럼 얻게 될 것이다’가 자연스러우면서도 은유를 보존합니다. ‘여호와의 말씀이다’는 예언자적 종결 공식으로 자연스럽고 적절합니다.
  terminology: ‘반드시 구해 낼 것이다’, ‘칼에 쓰러지지 않을 것이다’, ‘신뢰하였기 때문이다’, ‘여호와’는 문맥과 합쇼체에 적절합니다. נֶפֶשׁ은 여기서 영혼이 아니라 생존하는 목숨을 뜻하므로 ‘목숨’이 특히 알맞습니다.
