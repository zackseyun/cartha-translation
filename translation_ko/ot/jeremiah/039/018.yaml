  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י מַלֵּט֙ אֲמַלֶּטְ/ךָ֔ וּ/בַ/חֶ֖רֶב לֹ֣א תִפֹּ֑ל וְ/הָיְתָ֨ה לְ/ךָ֤ נַפְשְׁ/ךָ֙ לְ/שָׁלָ֔ל כִּֽי בָטַ֥חְתָּ בִּ֖/י נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/018.yaml
  text: For I will surely rescue you[a], and you will not fall by the sword. Your life will be yours as plunder, because you have trusted in me[b], declares Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''your life will be yours as plunder,'' a wartime idiom meaning you will escape with your life.'
    reason: cultural_note
  - marker: b
    text: Or 'I will certainly deliver you.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 반드시 구해 낼 것이며, 너는 칼에 쓰러지지 않을 것이다. 네 생명은 노획물처럼 너의 것이 될 것이다. 이는 네가 나를 신뢰하였기 때문이다. 여호와의 말씀이시다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘네 생명은 노획물처럼 너의 것이 될 것이다’라는 관용구로, 목숨만 건져 도망치는 전쟁 은유입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘내가 반드시 너를 구해 낼 것이다’. 히브리어는 강조용 부정사 절대형과 유한 동사를 함께 써서 확언을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּט אֲמַלֶּטְךָ
  english_pob_choice: I will surely rescue you
  chosen_korean: 내가 너를 반드시 구해 낼 것이며
  alternatives_korean:
  - 내가 너를 반드시 건져 낼 것이며
  - 내가 너를 반드시 구원할 것이다
  lexicon: HALOT
  rationale: 불완전한 동사와 강조용 부정사 절대형의 결합이 주는 확실한 약속을 한국어의 ‘반드시’로 살렸고, 전투적 맥락에 맞게 ‘구해 내다’를 택했습니다.
- source_word: וּבַחֶרֶב לֹא תִפֹּל
  english_pob_choice: and you will not fall by the sword
  chosen_korean: 너는 칼에 쓰러지지 않을 것이다
  alternatives_korean:
  - 너는 칼에 죽지 않을 것이다
  - 너는 칼에 넘어지지 않을 것이다
  lexicon: HALOT
  rationale: 직역의 ‘떨어지다/넘어지다’보다 한국어에서 전투적 피살을 자연스럽게 드러내는 ‘쓰러지다’를 사용해 히브리어 관용을 살렸습니다.
- source_word: וְהָיְתָה לְךָ נַפְשְׁךָ לְשָׁלָל
  english_pob_choice: Your life will be yours as plunder
  chosen_korean: 네 생명은 노획물처럼 너의 것이 될 것이다
  alternatives_korean:
  - 네 생명은 전리품처럼 너의 것이 될 것이다
  - 네 목숨은 노획물처럼 네 것이 될 것이다
  lexicon: HALOT
  rationale: נֶפֶשׁ을 이 문맥에서 ‘생명’으로 옮겨 생존의 뜻을 분명히 했고, 전쟁 문맥의 은유를 ‘노획물’로 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀이시다
  alternatives_korean:
  - 야훼의 말씀이시다
  - 여호와께서 선언하신다
  lexicon: HALOT
  rationale: 주어진 영어 본문이 YHWH를 Yahweh로 옮긴 점을 반영하되, 한국어 본문은 프로젝트 기본 용례에 맞춰 ‘여호와’로 표기했습니다. ‘말씀이시다’는 예언적 공식의 종결감을 살립니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 구절의 영어 POB는 Yahweh를 사용하지만, 한국어 공동체 독해성과 본문 일관성을 위해 기본 관용형 ‘여호와’를 채택했습니다. 다만 원문 표지의 신명성은 예언자적 말미 공식을 통해 유지했습니다.
  doctrine_reference: POB Korean glossary default for יְהוָה / YHWH
- issue: נֶפֶשׁ의 의미
  chosen_reading: 생명
  alternative_readings:
  - 목숨
  - 혼
  rationale: 약속은 전투에서의 육체적 생존을 가리키므로, 내면적 영혼론을 유발하는 ‘혼’보다 ‘생명’이 원문의 문맥적 의미를 가장 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3
