  to: 내가 너를 반드시 구해 낼 것이며[a], 너는 칼에 쓰러지지 않을 것이다. 너는 목숨을 전리품처럼 얻게 될 것이다.[b] 이는 네가 나를 신뢰하였기 때문이다. 여호와의 말씀이다.
