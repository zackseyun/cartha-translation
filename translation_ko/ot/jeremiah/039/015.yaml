    text: 또는 ‘예레미야가 경비대 뜰에 갇혀 있는 동안, 야훼의 말씀이 그에게 임했습니다. 그 말씀은 이러했습니다:’
    reason: lexical_alternative
  revision_rationale: 원문의 시간절을 앞세워 한국어 어순을 자연스럽게 하되, ‘야훼의 말씀’이라는 예언 공식, 예레미야의 구금 상태, 경비대 뜰이라는 장소를 보존했습니다. ‘그 말씀은 이러했습니다:’로 לֵאמֹר가 다음 절의 직접 인용을 도입하는 기능을 명시적으로 살렸습니다. ‘그에게’는 원문의 예레미야를 자연스럽게 받으며 의미를 바꾸지 않습니다.
