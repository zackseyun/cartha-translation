translation:
  language: ko
  text: 야훼의 말씀이 예레미야에게 임하셨습니다. 그가 감시대 뜰에 갇혀 있을 때였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예레미야가 경비대 뜰에 갇혀 있는 동안 야훼의 말씀이 예레미야에게 임하셨습니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh had come
  chosen_korean: 야훼의 말씀이 … 임하셨습니다
  alternatives_korean:
  - 야훼의 말씀이 … 왔습니다
  - 야훼의 말씀이 … 전해졌습니다
  lexicon: HALOT
  rationale: 예언서의 정형 표현인 ‘말씀이 임하다’를 살려 계시의 도래를 나타냈습니다. ‘전해지다’는 계시의 주도성과 엄중함을 약화시킵니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: POB의 표기 원칙에 따라 신명사 טetragrammaton은 ‘야훼’로 옮겼습니다. 이는 직함이 아니라 고유한 언약 이름을 드러냅니다.
- source_word: עָצוּר
  english_pob_choice: confined
  chosen_korean: 갇혀 있을 때
  alternatives_korean:
  - 억류되어 있을 때
  - 구금되어 있을 때
  - 감금되어 있을 때
  lexicon: HALOT
  rationale: 문맥상 예레미야가 경비대 뜰 안에 제한된 상태였음을 자연스럽게 드러내기 위해 ‘갇혀 있다’를 택했습니다. ‘구금’은 다소 법률적이고, ‘감금’은 더 강한 형벌 뉘앙스가 있습니다.
- source_word: בַּ/חֲצַר הַ/מַּטָּרָה
  english_pob_choice: in the court of the guard
  chosen_korean: 감시대 뜰
  alternatives_korean:
  - 경비대 뜰
  - 파수대 뜰
  - 감옥 뜰
  lexicon: HALOT
  rationale: חצר를 ‘뜰’로, מַטָּרָה를 이 문맥의 감시·경비 기능에 맞게 ‘감시대’로 옮겼습니다. ‘감옥 뜰’은 원문의 구체적 장소성을 흐릴 수 있습니다.
- source_word: לֵ/אמֹר
  english_pob_choice: saying
  chosen_korean: …였습니다
  alternatives_korean:
  - 말하여 이르시되
  - 이르시기를
  lexicon: HALOT
  rationale: 이 절의 핵심은 다음 절의 직접 인용을 여는 서술이므로, 한국어에서는 문장 종결을 부드럽게 이어 주는 방식으로 처리했습니다. 별도의 ‘말하여 이르시되’는 본문이 여기서 실제 발화를 시작하지 않으므로 과잉입니다.
theological_decisions:
- issue: 예언 공식의 시제 표현
  chosen_reading: ‘말씀이 … 임하셨습니다’로 현재적·완결적 계시 도래를 살렸습니다.
  alternative_readings:
  - ‘말씀이 … 왔습니다’
  - ‘말씀이 … 오셨습니다’
  rationale: 히브리어 서술은 사건 보고이지만, 예언 공식의 관용적 힘을 살리기 위해 단순 과거보다 계시의 도래를 강조하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
