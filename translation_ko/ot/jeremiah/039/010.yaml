source:
  edition: WLC
  text: וּ/מִן הָ/עָ֣ם הַ/דַּלִּ֗ים אֲשֶׁ֤ר אֵין לָ/הֶם֙ מְא֔וּמָה הִשְׁאִ֛יר נְבוּזַרְאֲדָ֥ן רַב טַבָּחִ֖ים בְּ/אֶ֣רֶץ יְהוּדָ֑ה וַ/יִּתֵּ֥ן לָ/הֶ֛ם כְּרָמִ֥ים וִֽ/יגֵבִ֖ים בַּ/יּ֥וֹם הַ/הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/010.yaml
  text: But Nebuzaradan the captain of the guard left some of the poorest of the people[a], who had nothing, in the land of Judah, and on that day he gave them vineyards and fields.
  footnotes:
  - marker: a
    text: Or possibly 'cisterns' or 'winepresses' for the final term; the Hebrew word is uncertain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 호위대장 느부사라단은 백성 가운데 가장 가난하여 아무것도 가진 것이 없는 사람들 일부를 유다 땅에 남겨 두고, 그날 그들에게 포도원들과 밭들을[a] 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 마지막 단어는 의미가 불확실하여 ‘밭들’ 외에 ‘물 저장고들’ 또는 ‘포도즙틀들’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הָעָם הַדַּלִּים אֲשֶׁר אֵין לָהֶם מְאוּמָה
  english_pob_choice: some of the poorest of the people, who had nothing
  chosen_korean: 유다 땅에 있던 백성 중 가장 가난한 사람들, 곧 아무것도 가진 것이 없는 사람들
  alternatives_korean:
  - 백성 가운데 가난한 사람들
  - 백성 중 가난한 사람들, 곧 아무것도 없는 사람들
  lexicon: HALOT
  rationale: 부분적 선택을 드러내는 מן은 ‘중’으로, 하층 민중을 뜻하는 הָעָם הַדַּלִּים은 ‘가장 가난한 사람들’로 옮겨 영어 POB의 사회경제적 의미를 살렸습니다.
- source_word: הִשְׁאִיר
  english_pob_choice: left
  chosen_korean: 남겨 두고
  alternatives_korean:
  - 두고
  - 남기고
  lexicon: HALOT
  rationale: 군정적 맥락에서 단순히 ‘두다’보다 사람들을 생존자로 남겨 두는 뉘앙스를 살리는 표현이 자연합니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 호위대장
  alternatives_korean:
  - 경호대장
  - 시위대장
  lexicon: HALOT
  rationale: 전통적 관용 번역을 따르되, 본문의 행정·군사적 직함을 한국어로 간명하게 전달했습니다.
- source_word: כְּרָמִים וִיגֵבִים
  english_pob_choice: vineyards and fields
  chosen_korean: 포도원들과 밭들
  alternatives_korean:
  - 포도원들과 농지들
  - 포도원들과 밭
  lexicon: HALOT
  rationale: כְּרָמִים은 분명히 포도원이며, וִיגֵבִים은 POB가 ‘fields’로 처리한 토지 재산의 의미를 따라 밭들로 옮겼습니다. 다만 히브리어 단어 자체는 불확실합니다.
theological_decisions:
- issue: 문장 접속의 톤
  chosen_reading: ‘그러나’로 시작해 앞 문맥의 심판·포로 상황과 대비를 살렸습니다.
  alternative_readings:
  - 그리고
  - 그런데
  rationale: 원문의 וּמִן은 단순 접속보다 앞선 서술과의 대비를 동반하므로, 서술 흐름을 해치지 않는 범위에서 ‘그러나’가 가장 자연스럽습니다.
  doctrine_reference: 문맥적 서사 대비
