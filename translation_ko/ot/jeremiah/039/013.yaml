id: JER.39.13
reference: Jeremiah 39:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח נְבֽוּזַרְאֲדָ֣ן רַב טַבָּחִ֗ים וּ/נְבֽוּשַׁזְבָּ רַב סָרִ֔יס וְ/נֵרְגַ֥ל שַׂר אֶ֖צֶר רַב מָ֑ג וְ/כֹ֖ל רַבֵּ֥י מֶֽלֶךְ בָּבֶֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/013.yaml
  text: Nebuzaradan the captain of the guard[a], Nebushazban the chief officer, Nergal-sharezer the chief magus[c][b], and all the chief officials of the king of Babylon sent word.
  footnotes:
  - marker: a
    text: Or simply, 'sent.' The Hebrew verb is elliptical here, and the following verse continues the action they initiated.
    reason: lexical_alternative
  - marker: b
    text: '''Chief officer'' translates a title that can also be rendered ''chief eunuch'' or ''chief court official.'''
    reason: lexical_alternative
  - marker: c
    text: '''Chief magus'' renders a Babylonian court title; traditionally some English versions leave it untranslated as ''Rab-mag.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 느부사라단 경호대장[a], 느부사즈반 고위 관리, 느르갈사레셀 마술사장[c][b], 그리고 바벨론 왕의 모든 고위 관리가 전갈을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여기서 목적어가 생략된 엘립시스이며, 다음 절이 그 행위를 이어받습니다.
    reason: source_note
  - marker: b
    text: ‘고위 관리’는 여기의 직함이 ‘내시’ 또는 ‘궁정 고관’으로도 옮길 수 있음을 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘마술사장’은 바빌론 궁정 직함을 뜻으로 옮긴 것이며, 전통적으로는 ‘라브마그’로 음역하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent word
  chosen_korean: 전갈을 보냈습니다
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: HALOT
  rationale: 히브리어 동사 שׁלח의 기본 뜻은 ‘보내다’이며, 이 절은 다음 절과 연결되는 생략 구조이므로 한국어에서는 무엇을 보냈는지 드러내는 ‘전갈을 보냈습니다’가 자연스럽습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 호위대장
  - 친위대장
  lexicon: HALOT
  rationale: 직역하면 ‘도살자들의 우두머리’이지만, 관용적으로 왕실 경호대의 지휘관을 가리키는 직함이므로 의미를 살려 ‘경호대장’으로 옮겼습니다.
- source_word: רַב סָרִיס
  english_pob_choice: chief officer
  chosen_korean: 고위 관리
  alternatives_korean:
  - 최고 내시
  - 궁정 고관
  lexicon: HALOT
  rationale: סָרִיס는 문자적으로는 ‘내시’일 수 있으나, 신바빌로니아 궁정 문맥에서는 고위 관리라는 직함으로 쓰일 수 있어, 불확실한 신체적 의미를 고정하지 않고 ‘고위 관리’로 번역했습니다.
- source_word: רַב מָג
  english_pob_choice: chief magus
  chosen_korean: 마술사장
  alternatives_korean:
  - 주술사장
  - 라브마그
  lexicon: HALOT
  rationale: 바빌론 궁정 직함을 한국어로 뜻풀이하되, 고대 동방의 종교·점술적 성격을 반영하기 위해 ‘마술사장’으로 옮겼습니다.
theological_decisions:
- issue: 엘립시스 처리
  chosen_reading: ‘보냈습니다’로 처리하여 앞선 주체들이 누군가에게 메시지나 사자를 보냈다는 흐름을 드러냈습니다.
  alternative_readings:
  - 그들이 보냈습니다
  - 전갈을 파견했습니다
  rationale: 히브리어는 목적어가 생략된 채 다음 절로 이어지는 구조이므로, 한국어에서는 문맥상 보완하되 과도하게 구체화하지 않는 방식이 가장 충실합니다.
  doctrine_reference: 문맥-통사 보존 원칙
