  naturalness: ‘마술사장’은 현대 한국어에서 비자연스럽고 직함으로도 다소 불분명합니다. ‘수석 마술사’가 더 자연스럽습니다. 나열된 주어는 ‘과/와, 그리고’로 연결하여 문장을 매끄럽게 하였습니다.
