source:
  edition: WLC
  text: וַ/יָּבֹ֗אוּ כֹּ֚ל שָׂרֵ֣י מֶֽלֶךְ בָּבֶ֔ל וַ/יֵּשְׁב֖וּ בְּ/שַׁ֣עַר הַ/תָּ֑וֶךְ נֵרְגַ֣ל שַׂר אֶ֠צֶר סַֽמְגַּר נְב֞וּ שַׂר סְכִ֣ים רַב סָרִ֗יס נֵרְגַ֤ל שַׂר אֶ֨צֶר֙ רַב מָ֔ג וְ/כָל שְׁאֵרִ֔ית שָׂרֵ֖י מֶ֥לֶךְ בָּבֶֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/003.yaml
  text: 'Then all the officials of the king of Babylon came in and sat in the Middle Gate: Nergal-sharezer[a], Samgar-nebu, Sarsechim the Rab-saris, Nergal-sharezer the Rab-mag[d][c][b], and all the rest of the officials of the king of Babylon.'
  footnotes:
  - marker: a
    text: Or 'at the Middle Gate.' The Hebrew preposition can be rendered either way in this setting.
    reason: lexical_alternative
  - marker: b
    text: The sequence 'Samgar-nebu, Sarsechim the Rab-saris' is difficult. Some interpreters divide the names and titles differently, such as reading 'Samgar' as a title or 'Sarsechim' as an office rather than a personal name.
    reason: alternative_reading
  - marker: c
    text: '''Rab-saris'' is a Babylonian title, traditionally understood as something like ''chief eunuch'' or ''chief court official.'''
    reason: cultural_note
  - marker: d
    text: '''Rab-mag'' is a Babylonian title, possibly meaning ''chief magus'' or a high-ranking ritual official.'
    reason: cultural_note
translation:
  language: ko
  text: 그때 바벨론 왕의 모든 고관이 들어와서 중문에 앉았는데, 곧 네르갈사르에셀, 삼가르느부, 살스김 곧 랩사리스, 네르갈사르에셀 곧 랩마그, 그리고 바벨론 왕의 나머지 모든 고관들이었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘중문에서’로도 옮길 수 있습니다. 히브리어 전치사는 이 자리에서 장소 또는 진입 지점을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘삼가르느부, 살스김’의 구분은 어렵습니다. 일부 해석은 이 부분을 이름과 직함으로 다르게 나눕니다.
    reason: alternative_reading
  - marker: c
    text: ‘랩사리스’는 바빌론계 직함으로, 전통적으로는 ‘대환관’ 또는 ‘수석 내시’ 정도로 이해됩니다.
    reason: cultural_note
  - marker: d
    text: ‘랩마그’는 아마도 ‘수석 박사’나 높은 제의·학문 직무를 가리키는 바빌론계 직함입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: came in
  chosen_korean: 들어와서
  alternatives_korean:
  - 들어왔습니다
  - 왔습니다
  lexicon: HALOT
  rationale: 이동의 결과가 성 안으로의 진입임을 살리면서도 한국어에서 자연스러운 서술 연결을 위해 '들어와서'로 옮겼습니다.
- source_word: כֹּל שָׂרֵי מֶלֶךְ בָּבֶל
  english_pob_choice: all the officials of the king of Babylon
  chosen_korean: 바벨론 왕의 모든 고관
  alternatives_korean:
  - 바벨론 왕의 모든 관리
  - 바벨론 왕의 모든 방백
  lexicon: HALOT
  rationale: שָׂרֵי는 단순한 군사 지휘관보다 넓은 상층 행정·권력자를 가리키므로, 문맥에 맞는 '고관'을 택했습니다.
- source_word: בְּשַׁעַר הַתָּוֶךְ
  english_pob_choice: in the Middle Gate
  chosen_korean: 중문에
  alternatives_korean:
  - 중문에서
  - 가운데 문에
  lexicon: HALOT
  rationale: 문 자체를 가리키는 고유한 명칭으로 읽어 '중문'을 사용했고, 전치사 בְּ는 한국어에서 자연스러운 위치 표현인 '-에'로 옮겼습니다.
- source_word: רַב סָרִיס
  english_pob_choice: the Rab-saris
  chosen_korean: 랩사리스
  alternatives_korean:
  - 대환관
  - 수석 내시
  lexicon: HALOT
  rationale: 이 표현은 바빌론 관직 호칭이므로, 의미역보다 음역을 살려 직함의 이국성과 고유성을 보존했습니다.
theological_decisions:
- issue: 열거문의 직함 처리
  chosen_reading: 본문의 바빌론 직함들은 뜻풀이보다 음역을 우선해, 독자가 고대 제국의 관직 체계를 낯설게 그대로 보도록 했습니다.
  alternative_readings:
  - 의역하여 '대환관'처럼 풀어 쓰기
  - 현대적 직책명으로 일반화하기
  rationale: 본문은 인물 이름과 관직명이 뒤섞인 난해한 목록이므로, 과도한 해석을 피하고 원문의 역사성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: '번역 원칙: 원문 형식과 역사적 특수성 보존'
