  naturalness: ‘중문’은 가능한 고유 지명형 번역이며 자연스럽습니다. 다만 인명·직함 열거 뒤의 ‘그리고 … 고관들이었습니다’는 현대 한국어 문장으로 부자연스럽습니다. 또한 각주 a의 ‘진입 지점’은 히브리어 전치사의 여기서의 ‘~안에/~에서(또는 ~에)’라는 위치적 범위를 넘어섭니다.
  terminology: 바빌로니아 관직명은 본문에서 음역으로 유지하는 편이 적절합니다. 다만 각주 c의 ‘대환관 또는 수석 내시’는 서로 지나치게 겹치며 영어 감사 기록의 ‘chief court official’ 가능성을 누락합니다. 각주 d의 ‘수석 박사’는 rab-mag의 불확실한 의례·전문 관직을 현대 학위·직업 명칭으로 오해하게 할 수 있으므로 피하는 것이 좋습니다.
