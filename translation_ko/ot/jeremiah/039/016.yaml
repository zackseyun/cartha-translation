base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/016.yaml
  text: 'Go and say to Ebed-melech the Cushite[a], ‘Thus says Yahweh of hosts, the God of Israel: Behold, I am bringing my words against this city for harm and not for good[b], and they will come to pass before you on that day.’'
  footnotes:
  - marker: a
    text: Or 'the Ethiopian.' The Hebrew says 'the Cushite.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for disaster and not for good.'
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 에벳멜렉 곧 구스 사람에게 말하라. 「만군의 여호와, 이스라엘의 하나님이 이렇게 말씀하신다. 보아라, 내가 이 성에 내 말들을 가져오는데, 해를 주려는 것이지 복을 주려는 것이 아니다. 그것들은 그날 너의 앞에 이루어질 것이다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘구스 사람’입니다. 전통적으로는 ‘에티오피아 사람’으로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘해’는 심판 맥락의 רָעָה를 현대 한국어로 옮긴 것입니다. 직역하면 ‘재앙’일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָל֣וֹךְ וְאָמַרְתָּ
  english_pob_choice: Go and say
  chosen_korean: 가서 … 말하라
  alternatives_korean:
  - 가서 말하십시오
  - 가서 말해라
  lexicon: HALOT
  rationale: 불완전명령의 강조된 지시를 자연스러운 한국어 명령문으로 옮겼습니다.
- source_word: לְעֶבֶד מֶלֶךְ הַכּוּשִׁי
  english_pob_choice: to Ebed-melech the Cushite
  chosen_korean: 에벳멜렉 곧 구스 사람에게
  alternatives_korean:
  - 에벳멜렉 구스인에게
  - 에벳멜렉 에티오피아 사람에게
  lexicon: HALOT
  rationale: 고유명사 에벳멜렉을 음역하고, הַכּוּשִׁי는 ‘구스 사람’으로 직역해 민족명을 보존했습니다.
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 여호와, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 야훼, 이스라엘의 하나님
  - 만군의 주, 이스라엘의 하나님
  lexicon: HALOT
  rationale: 공동체에서 널리 통용되는 ‘만군의 여호와’를 유지하되, המקרא적 호칭 구조를 그대로 살렸습니다.
- source_word: לְרָעָה וְלֹא לְטוֹבָה
  english_pob_choice: for harm and not for good
  chosen_korean: 해를 주려는 것이지 복을 주려는 것이 아니다
  alternatives_korean:
  - 재앙을 주려는 것이지 복을 주려는 것이 아니다
  - 해를 위해서이지 선을 위해서가 아니다
  lexicon: HALOT
  rationale: רָעָה를 단순한 도덕적 ‘악’보다 심판 맥락의 ‘해/재앙’으로 옮겨 대조를 분명하게 했습니다.
- source_word: וְהָיוּ לְפָנֶיךָ
  english_pob_choice: they will come to pass before you
  chosen_korean: 그것들은 그날 너의 앞에 이루어질 것이다
  alternatives_korean:
  - 그것들은 그날 네 앞에 있을 것이다
  - 그것들은 그날 네가 보는 앞에서 일어날 것이다
  lexicon: HALOT
  rationale: 문맥상 ‘before you’는 단순한 위치가 아니라 사건이 눈앞에서 성취된다는 뜻이므로, 과도한 해석 없이 ‘이루어질 것이다’로 옮겼습니다.
theological_decisions:
- issue: 예언 공식의 하나님의 이름과 언약적 호칭
  chosen_reading: ‘여호와’와 ‘만군의 여호와, 이스라엘의 하나님’으로 옮겨 예언자적 선포의 공적·언약적 어조를 유지했습니다.
  alternative_readings:
  - ‘야훼’로 통일
  - ‘주님’으로 대체
  rationale: 본문의 예언자적 메시지 전달 형식을 보존하면서, 청자에게 익숙한 호칭을 사용해 문체의 무게를 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘구스 사람’의 민족적 표지
  chosen_reading: 하나의 고유한 민족명으로서 ‘구스 사람’을 유지했습니다.
  alternative_readings:
  - ‘에티오피아 사람’
  - ‘구스인’
  rationale: 히브리어 הַכּוּשִׁי의 직접 대응을 살려, 후대 지리적 연상을 덜어내고 본문의 민족 표지를 보존했습니다.
  doctrine_reference: HALOT ethnonym usage
