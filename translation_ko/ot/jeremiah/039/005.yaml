base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/005.yaml
  text: But the army of the Chaldeans pursued them and overtook Zedekiah in the plains of Jericho. They seized him and brought him up to Nebuchadnezzar king of Babylon at Riblah[a], in the land of Hamath, and he passed sentence on him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; the more familiar English form ''Nebuchadnezzar'' is used in the main text.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갈대아 군대가 그들을 뒤쫓아 예루살렘 평원에서 시드기야를 따라잡았습니다. 그들은 그를 붙잡아 바벨론 왕 느부갓네살에게, 하맛 땅에 있는 리블라로 데려갔으며, 그가 그에게 판결을 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어에는 ‘느부갓레살’에 가까운 철자가 나오지만, 본문에는 더 익숙한 ‘느부갓네살’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  english_pob_choice: the army of the Chaldeans
  chosen_korean: 갈대아 군대
  alternatives_korean:
  - 갈대아 사람들의 군대
  - 바벨론 군대
  lexicon: HALOT
  rationale: כַּשְׂדִּים은 역사적으로 바벨론 제국과 연결되지만, POB가 원어의 민족·정치 명칭을 살린 점을 따라 ‘갈대아’로 옮겼습니다.
- source_word: וַיִּרְדְּפוּ ... אַחֲרֵיהֶם
  english_pob_choice: pursued them
  chosen_korean: 그들을 뒤쫓아
  alternatives_korean:
  - 그들을 추격하여
  - 그들을 쫓아
  lexicon: HALOT
  rationale: רדף의 군사적 추적 의미를 자연스럽게 살리되, 문맥의 긴박함을 유지하는 표현으로 옮겼습니다.
- source_word: וַיַּשִּׂגוּ
  english_pob_choice: overtook
  chosen_korean: 따라잡았습니다
  alternatives_korean:
  - 붙잡았습니다
  - 추월했습니다
  lexicon: HALOT
  rationale: 도주자에 대한 추격이 성공한 결과를 나타내므로 ‘따라잡다’가 가장 직관적으로 의미를 전달합니다.
- source_word: וַיִּקְחוּ אֹתוֹ
  english_pob_choice: They seized him
  chosen_korean: 그를 붙잡아
  alternatives_korean:
  - 그를 잡아
  - 그를 사로잡아
  lexicon: HALOT
  rationale: לָקַח의 기본값은 ‘취하다/데려가다’이지만, 여기서는 군사적 체포 상황이므로 강제성을 드러내는 ‘붙잡다’가 적절합니다.
- source_word: וַיְדַבֵּר אִתּוֹ מִשְׁפָּטִים
  english_pob_choice: he passed sentence on him
  chosen_korean: 그가 그에게 판결을 내렸습니다
  alternatives_korean:
  - 그가 그에게 판결들을 선고했습니다
  - 그가 그에게 심판을 말했습니다
  lexicon: HALOT
  rationale: 문자적으로는 ‘그에게 판결들/법정 판단들을 말했다’는 뜻이지만, 문맥상 재판·선고를 가리키므로 한국어 법률어인 ‘판결을 내리다’로 옮겼습니다.
theological_decisions:
- issue: 느부갓네살 이름 표기
  chosen_reading: 느부갓네살
  alternative_readings:
