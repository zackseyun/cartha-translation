  source_fidelity: ‘예루살렘 평원’은 히브리어 בְּעַרְבוֹת יְרֵחוֹ(‘여리고 평원/여리고의 평야’)와 명백히 불일치하므로 반드시 ‘여리고 평원’으로 고쳐야 합니다. 또한 리블라는 느부갓네살의 소재지를 나타내며, 그에게 시드기야를 데려간 것으로 문장 관계를 분명히 해야 합니다. משפטים의 법적 의미는 ‘판결을 내리다’로 자연스럽게 전달됩니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지합니다. ‘하맛 땅 리블라에 있는 바벨론 왕 느부갓네살에게’는 리블라의 수식 범위와 행위의 대상을 명료하게 하며, 마지막 절은 대명사 반복을 피하고 주어를 밝혀 자연스럽습니다.
  terminology: ‘갈대아 군대’, ‘시드기야’, ‘바벨론’, ‘하맛’, ‘리블라’, ‘느부갓네살’은 일관되고 통용적인 성경 한국어 고유명사 표기입니다. 본문의 통용형 ‘느부갓네살’과 히브리어 철자에 가까운 ‘느부갓레살’의 차이는 이름에 직접 붙인 각주로 적절히 처리합니다.
  issues:
