    rationale: 리블라는 느부갓네살이 있던 장소이고, 시드기야는 그 왕에게 데려가집니다. 수정문은 ‘하맛 땅 리블라에 있는 ... 느부갓네살에게’로 이를 명료하게 표시합니다.
