revisions:
- from: 갈대아 군대가 그들을 뒤쫓아 예루살렘 평원에서 시드기야를 따라잡았습니다. 그들은 그를 붙잡아 바벨론 왕 느부갓네살에게, 하맛 땅에 있는 리블라로 데려갔으며, 그가 그에게 판결을 내렸습니다.[a]
  to: 갈대아 군대가 그들을 뒤쫓아 여리고 평원에서 시드기야를 따라잡았습니다. 그들은 그를 붙잡아 하맛 땅 리블라에 있는 바벨론 왕 느부갓네살[a]에게 데리고 올라갔으며, 느부갓네살이 그에게 판결을 내렸습니다.
  rationale: 원문 지명 ‘여리고’를 회복하고, 리블라가 느부갓네살의 소재지임을 한국어 문장 안에서 분명히 했습니다. משפטים의 복수형이 지닌 법적 판단의 의미는 한국어 관용 법률 표현인 ‘판결을 내리다’로 무리 없이 전달됩니다. 각주는 해당 고유명사에 직접 연결했습니다.
