    issue: ‘예루살렘 평원’
    rationale: 원문은 ‘여리고 평원들’(בְּעַרְבוֹת יְרֵחוֹ)을 말합니다. 예루살렘은 다른 지명이며, 지리적·본문적 의미를 바꾸는 오류입니다.
  - severity: medium
