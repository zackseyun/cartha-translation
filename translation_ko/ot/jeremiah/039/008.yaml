  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת בֵּ֤ית הַ/מֶּ֨לֶךְ֙ וְ/אֶת בֵּ֣ית הָ/עָ֔ם שָׂרְפ֥וּ הַ/כַּשְׂדִּ֖ים בָּ/אֵ֑שׁ וְ/אֶת חֹמ֥וֹת יְרוּשָׁלִַ֖ם נָתָֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/039/008.yaml
  text: The Chaldeans burned the king’s house and the houses of the people with fire[b][a], and they tore down the walls of Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the palace' for 'the king’s house.'
    reason: lexical_alternative
  - marker: b
    text: '''Chaldeans'' refers to the Babylonian forces.'
    reason: cultural_note
translation:
  language: ko
  text: 갈대아 사람들이 왕궁과 백성의 집들을 불로 태웠고, 예루살렘의 성벽을 헐어 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕궁’은 직역하면 ‘왕의 집’이며, 왕실 거처를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 바빌로니아 군대를 가리키는 역사적 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 왕의 궁전
  lexicon: HALOT
  rationale: 히브리어 בַּיִת은 왕권 문맥에서 왕궁을 뜻할 수 있으므로, 한국어에서는 자연스럽고 의미가 분명한 ‘왕궁’으로 옮겼습니다. ‘왕의 집’은 직역이지만 어색하고, ‘왕의 궁전’은 의미는 맞아도 표현이 조금 더 장황합니다.
- source_word: בֵּית הָעָם
  english_pob_choice: the houses of the people
  chosen_korean: 백성의 집들
  alternatives_korean:
  - 백성들의 집들
  - 민중의 집들
  lexicon: HALOT
  rationale: 단수 구성형이지만 문맥상 복수의 거주지를 가리키므로 ‘집들’로 풀어야 합니다. ‘백성의 집들’은 원문의 구조를 비교적 직접적으로 반영하면서도 자연스럽습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: The Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 갈대아인들
  - 바빌로니아 사람들
  lexicon: HALOT
  rationale: POB의 ‘Chaldeans’를 따라 원문 표지성을 살렸습니다. ‘바빌로니아 사람들’은 해석적 동의어이지만, 원문의 민족명/정치적 호칭을 더 직접적으로 드러내는 것은 ‘갈대아 사람들’입니다.
- source_word: נָתָצוּ
  english_pob_choice: they tore down
  chosen_korean: 헐어 버렸습니다
  alternatives_korean:
  - 무너뜨렸습니다
  - 헐었습니다
  lexicon: HALOT
  rationale: 성벽을 구조적으로 파괴하는 동사로서 ‘헐어 버리다’가 ‘tore down’의 의도와 가장 가깝습니다. ‘무너뜨리다’는 자연 현상처럼 들릴 수 있어 의도적 철거의 뉘앙스가 약합니다.
theological_decisions:
- issue: 갈대아 사람들의 정체성 표기
  chosen_reading: 본문은 역사적 행위 주체를 ‘갈대아 사람들’로 직접 표기합니다.
  alternative_readings:
  - ‘바빌로니아 사람들’로 풀어 독자 이해를 돕는 방식
  rationale: 원문이 민족명/정치명으로서 כַּשְׂדִּים을 사용하므로, 해석을 앞세워 지명을 대체하기보다 원문 호칭을 보존하는 편이 본문 의미의 결을 유지합니다.
  doctrine_reference: 역사서술의 원문 표지 보존
