  source_fidelity: 히브리어 원문은 갈대아 사람들이 왕의 집과 백성의 집들을 불태우고 예루살렘 성벽을 헐었다고 말합니다. 번역은 행위 주체, 불에 의한 소각, 복수의 백성 집, 성벽의 의도적 파괴를 충실히 반영합니다. ‘왕궁’은 왕의 집에 대한 문맥상 자연스러운 번역이며, 직역 가능성은 각주로 보완되어 있습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘갈대아 사람들’, ‘백성의 집들’, ‘성벽을 헐어 버렸습니다’는 역사 서술 문맥에서 무리 없이 읽힙니다.
  terminology: ‘갈대아 사람들’은 כַּשְׂדִּים의 원문 호칭을 보존하며, 바빌로니아 군대를 가리킨다는 각주도 적절합니다. ‘왕궁’의 해석적 성격과 ‘왕의 집’이라는 직역을 알리는 각주도 영어 POB 감사 기록 및 원문의 어휘 범위와 부합합니다.
