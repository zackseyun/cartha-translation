id: JER.8.12
reference: Jeremiah 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֹבִ֕שׁוּ כִּ֥י תוֹעֵבָ֖ה עָשׂ֑וּ גַּם בּ֣וֹשׁ לֹֽא יֵבֹ֗שׁוּ וְ/הִכָּלֵם֙ לֹ֣א יָדָ֔עוּ לָ/כֵ֞ן יִפְּל֣וּ בַ/נֹּפְלִ֗ים בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם יִכָּשְׁל֖וּ אָמַ֥ר יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/012.yaml
  text: Were they ashamed because they had done an abomination? No[a], they were not ashamed at all; they did not even know how to blush. Therefore they will fall among the fallen; at the time of their punishment they will stumble, says Yahweh.
  footnotes:
  - marker: a
    text: Or 'at the time of their visitation.' The Hebrew can denote a time when God visits people for judgment or calls them to account.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 가증한 일을 저질렀으니 부끄러워해야 했습니다. 그러나 조금도 부끄러워하지 않았고, 붉어질 줄도 몰랐습니다. 그러므로 그들은 쓰러진 자들 가운데서 쓰러질 것이며, 그들의 벌받을 때에 넘어질 것입니다. 야훼께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פְּקֻדָּה는 ‘방문’, ‘점검’, ‘벌’의 의미 폭이 있으며, 이 문맥에서는 하나님의 심판을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִ֕שׁוּ
  english_pob_choice: Were they ashamed
  chosen_korean: 부끄러워해야 했습니다
  alternatives_korean:
  - 부끄러웠습니까
  - 부끄러움을 당했습니까
  lexicon: HALOT
  rationale: 여기서는 수사적 질문의 예상값을 드러내야 하므로, 실제로 부끄러워했는지 묻기보다 ‘부끄러워해야 했다’로 기대된 반응의 결핍을 살렸습니다.
- source_word: תוֹעֵבָ֖ה
  english_pob_choice: an abomination
  chosen_korean: 가증한 일
  alternatives_korean:
  - 가증스러운 것
  - 혐오스러운 일
  lexicon: HALOT
  rationale: 예언서의 도덕·종교적 강도를 유지하면서 한국어 성경에서 널리 통용되는 ‘가증한 일’로 옮겼습니다.
- source_word: גַּם בּוֹשׁ לֹא יֵבֹ֗שׁוּ וְהִכָּלֵם֙ לֹ֣א יָדָ֔עוּ
  english_pob_choice: No, they were not ashamed at all; they did not even know how to blush
  chosen_korean: 그러나 조금도 부끄러워하지 않았고, 붉어질 줄도 몰랐습니다
  alternatives_korean:
  - 아예 부끄러워하지 않았고, 얼굴 붉힐 줄도 몰랐습니다
  - 전혀 부끄러움을 모르고, 수치심을 드러낼 줄도 몰랐습니다
  lexicon: HALOT
  rationale: ‘붉어질 줄도 몰랐다’는 히브리어의 ‘수치의 표정/표시를 알지 못함’과 영어 POB의 ‘blush’ 이미지를 자연스럽게 살립니다.
- source_word: יִפְּל֣וּ בַ/נֹּפְלִ֗ים
  english_pob_choice: they will fall among the fallen
  chosen_korean: 그들은 쓰러진 자들 가운데서 쓰러질 것이며
  alternatives_korean:
  - 그들은 쓰러진 자들 가운데 떨어질 것이며
  - 그들은 넘어져 있는 자들과 함께 쓰러질 것이며
  lexicon: HALOT
  rationale: 히브리어의 반복 구조를 살려 ‘쓰러진 자들 가운데서 쓰러질 것’으로 옮겨, 같은 어근의 강조와 운율을 보존했습니다.
- source_word: בְּ/עֵ֧ת פְּקֻדָּתָ֛/ם
  english_pob_choice: at the time of their punishment
  chosen_korean: 그들의 벌받을 때에
  alternatives_korean:
  - 그들의 돌보심/방문 때에
  - 그들이 심문받을 때에
  lexicon: HALOT
  rationale: פְּקֻדָּה는 ‘방문/점검/벌’의 폭이 있으나, 이 문맥에서는 심판의 결과를 분명히 드러내는 ‘벌받을 때’가 가장 직접적입니다.
- source_word: אָמַ֥ר יְהוָֽה
  english_pob_choice: says Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 여호와께서 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: DOCTRINE.md contested terms
  rationale: 본 프로젝트 기본어에 따라 신명사 יְהוָה를 ‘야훼’로 음역하고, 예언적 발화 공식을 현대 합쇼체로 유지했습니다.
theological_decisions:
- issue: 예언적 수사에서 ‘부끄러움’과 ‘수치’의 결핍을 어떻게 드러낼지
  chosen_reading: 단순한 감정 묘사보다, 마땅히 부끄러워해야 할 죄에 대한 도덕적 무감각을 강조했습니다.
  alternative_readings:
  - 그들은 부끄러웠다
  - 그들은 수치를 느끼지 못했다
  rationale: 문맥은 단순 감정 상태가 아니라 죄에 대한 완고한 무감각과 심판 직전의 완강함을 고발하므로, 수사적 질문과 대조를 한국어에서 더 분명하게 살렸습니다.
  doctrine_reference: Jeremiah 8:12 judgment context; shame/honor rhetoric
