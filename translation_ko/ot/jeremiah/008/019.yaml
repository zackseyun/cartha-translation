id: JER.8.19
reference: Jeremiah 8:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה ק֞וֹל שַֽׁוְעַ֣ת בַּת עַמִּ֗/י מֵ/אֶ֨רֶץ֙ מַרְחַקִּ֔ים הַֽ/יהוָה֙ אֵ֣ין בְּ/צִיּ֔וֹן אִם מַלְכָּ֖/הּ אֵ֣ין בָּ֑/הּ מַדּ֗וּעַ הִכְעִס֛וּ/נִי בִּ/פְסִלֵי/הֶ֖ם בְּ/הַבְלֵ֥י נֵכָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/019.yaml
  text: 'Look—the cry of the daughter of my people from a distant land: “Is Yahweh not in Zion? Is her King not in her?” Why have they provoked me to anger with their carved images[c][b][a], with foreign idols?'
  footnotes:
  - marker: a
    text: Or, more literally, “the sound of the cry of the daughter of my people.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from a land of far distances,” that is, from very far away.
    reason: lexical_alternative
  - marker: c
    text: Or “with foreign vanities,” a Hebrew expression that mocks idols as empty and worthless.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오—내 백성의 딸이 먼 나라에서 부르짖는 소리입니다. 「야훼께서 시온에 계시지 않습니까? 그녀의 왕이 그녀 안에 계시지 않습니까?」 그런데 어찌하여 그들이 자기들의 새긴 우상으로, 외국의 헛된 것들로 나를 격노하게 했습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 백성의 딸의 부르짖음의 소리’입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘아주 먼 거리의 땅에서’라는 뜻으로, 매우 먼 곳을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: ‘헛된 것들’은 우상을 비웃는 히브리어 표현으로, 공허하고 무가치하다는 뉘앙스를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 갑작스러운 주목을 요구하는 감탄사로서 현대 한국어에서는 「보십시오」가 가장 자연스럽고, 예언문장의 긴박함도 유지합니다.
- source_word: ק֞וֹל שַֽׁוְעַ֣ת
  english_pob_choice: the cry
  chosen_korean: 부르짖는 소리
  alternatives_korean:
  - 부르짖음
  - 외침
  lexicon: HALOT
  rationale: 직역하면 ‘부르짖음의 소리’이지만, 한국어에서는 ‘부르짖는 소리’가 애끓는 호소와 소리의 뉘앙스를 함께 살립니다.
- source_word: מֵאֶ֨רֶץ֙ מַרְחַקִּ֔ים
  english_pob_choice: from a distant land
  chosen_korean: 먼 나라에서
  alternatives_korean:
  - 먼 땅에서
  - 아주 먼 곳에서
  lexicon: HALOT
  rationale: 복수형 표현의 관용적 의미가 ‘아주 멂’이므로, 유배적 거리감을 자연스럽게 드러내는 ‘먼 나라에서’로 옮겼습니다.
- source_word: בִּפְסִילֵיהֶ֖ם
  english_pob_choice: with their carved images
  chosen_korean: 자기들의 새긴 우상으로
  alternatives_korean:
  - 자기들의 새긴 형상으로
  - 자기들의 조각한 우상으로
  lexicon: HALOT
  rationale: פסל의 구체성은 ‘새긴/깎아 만든 형상’에 있고, 문맥상 우상 비판이 분명하므로 ‘새긴 우상’으로 풀어 의미와 형상을 함께 살렸습니다.
- source_word: בְּהַבְלֵ֥י נֵכָֽר
  english_pob_choice: with foreign idols
  chosen_korean: 외국의 헛된 것들로
  alternatives_korean:
  - 외국의 헛됨으로
  - 이방의 헛된 것들로
  lexicon: HALOT
  rationale: הבל은 우상 문맥에서 ‘헛됨/덧없음’의 조롱을 담으므로, POB의 의미선을 따라 ‘헛된 것들’로 번역해 우상 자체의 공허함을 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 신명기가 아닌 고유명 יְהוָה가 직접 나오므로 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약명 자체를 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: ‘her King’의 지시 대상
  chosen_reading: 그녀의 왕이 그녀 안에 계시지 않습니까?
  alternative_readings:
  - 그녀의 왕이 그녀 안에 없지 않습니까?
  - 그녀의 왕이 그녀 가운데 계시지 않습니까?
  rationale: 평행구조상 ‘왕’은 시온의 인간 왕이 아니라 야훼를 가리키므로, 대문자 표기 대신 존대 동사와 문맥으로 신적 지시를 분명히 했습니다.
  doctrine_reference: Contextual divine kingship in Jer 8:19
