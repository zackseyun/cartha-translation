  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 인용문 안의 히브리어 여성 단수 대명사는 시온을 가리키므로, ‘그녀의 왕이 그녀 안에’라는 직역적 표현보다 시온을 다시 밝혀 주는 것이 한국어에서 정확하고 자연스럽습니다. 또한 ‘그런데’는 원문에 없는 대조를 더하므로 삭제하는 편이 안전합니다. פסילים의 복수도 ‘우상들’로 드러냈습니다.
  naturalness: ‘그녀’와 ‘그녀 안에’는 현대 표준 한국어 성서 문체에서 부자연스럽고 지시 대상도 흐립니다. ‘시온의 왕께서 그곳에’가 자연스럽게 원문의 관계를 전달합니다. ‘아주 먼 땅’은 ארץ와 복수형 마르하킴이 나타내는 매우 먼 거리를 자연스럽게 보존합니다.
  terminology: ‘야훼’, ‘시온’, ‘내 백성의 딸’, ‘새긴 우상들’을 유지했습니다. הבלי נכר는 우상 polemic의 ‘헛됨’과 이방성을 보존하여 ‘이방의 헛된 것들’로 옮겼습니다. 왕의 신적 지시는 바로 앞의 야훼와 존대 표현으로 문맥상 드러나되, 원문 이상으로 해석을 고정하지 않았습니다.
  issues:
