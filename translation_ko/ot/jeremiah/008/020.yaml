  chosen_korean: 지나갔고
  alternatives_korean:
  - 지났고
  - 지나갔습니다
  lexicon: HALOT
  rationale: 완료된 사건을 나타내는 완료형으로서, 문맥의 탄식 어조를 살리면서도 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
