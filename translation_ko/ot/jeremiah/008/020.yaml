  - 종결되었습니다
  lexicon: HALOT
  rationale: 완결을 나타내는 완료형을 현대 한국어로 간명하게 표현했습니다. 첫 절의 ‘지나갔고’와 평행을 이루게 했습니다.
- source_word: נוֹשָׁעְנוּ
  english_pob_choice: have not been saved
  chosen_korean: 구원받지 못했습니다
