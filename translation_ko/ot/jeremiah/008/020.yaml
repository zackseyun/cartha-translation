  - 구출되지 못했습니다
  lexicon: HALOT
  rationale: ישׁע의 수동/결과적 의미를 유지하면서, 영어 POB의 ‘saved’가 가진 더 넓은 구원의 어감을 한국어로 직접 반영했습니다.
theological_decisions:
- issue: ישׁע의 번역을 ‘구원’으로 둘지 ‘구출’로 좁힐지
  chosen_reading: 구원받지 못했습니다
  alternative_readings:
  - 구출되지 못했습니다
  - 도움을 받지 못했습니다
  rationale: 이 절은 계절이 지났는데도 회복이 오지 않았다는 공동체적 탄식을 담고 있어, 문맥상 즉각적 구출의 의미를 포함하면서도 더 넓은 구원의 어감을 유지하는 표현이 가장 적합합니다.
