id: JER.8.17
reference: Jeremiah 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ הִנְ/נִ֨י מְשַׁלֵּ֜חַ בָּ/כֶ֗ם נְחָשִׁים֙ צִפְעֹנִ֔ים אֲשֶׁ֥ר אֵין לָ/הֶ֖ם לָ֑חַשׁ וְ/נִשְּׁכ֥וּ אֶתְ/כֶ֖ם נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/017.yaml
  text: For behold[a], I am sending among you snakes, vipers that cannot be charmed, and they will bite you[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'adders' for 'vipers.' The Hebrew term refers to a venomous snake.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'for which there is no charm' or 'no incantation'; the sense is that these snakes cannot be charmed.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 너희 가운데에 뱀들, 곧 독사들을 보내고 있습니다. 그것들은 길들일 수 없으므로 너희를 물 것입니다[b], 여호와의 말씀이니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보라’로 옮길 수 있습니다. הִנְנִי의 강한 강조를 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들에게는 주술/속삭임이 없다’는 뜻으로, 곧 뱀을 달래거나 다루는 주문이 통하지 않는다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: behold / look, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 자, 내가
  lexicon: HALOT
  rationale: הִנְנִי의 강한 지시·강조를 한국어 명령형 감탄으로 옮기되, 현대 합쇼체에서 자연스럽고 격식 있는 ‘보십시오, 내가’로 처리했습니다.
- source_word: בָּכֶם
  english_pob_choice: among you
  chosen_korean: 너희 가운데에
  alternatives_korean:
  - 너희에게
  - 너희를 향해
  lexicon: HALOT
  rationale: 뱀을 ‘풀어 놓는’ 이미지가 집단의 한가운데로 들어오는 뉘앙스를 가지므로, 단순한 방향어보다 ‘너희 가운데에’가 원문 감각을 더 잘 살립니다.
- source_word: צִפְעֹנִים
  english_pob_choice: vipers
  chosen_korean: 독사들
  alternatives_korean:
  - 살무사들
  - 독을 가진 뱀들
  lexicon: HALOT
  rationale: 원어는 치명적인 독사를 가리키므로, 한국어에서 의미를 곧장 드러내는 ‘독사들’이 적절합니다. ‘살무사’는 특정 종으로 좁아질 수 있습니다.
- source_word: אֵין לָהֶם לָחַשׁ
  english_pob_choice: that cannot be charmed
  chosen_korean: 길들일 수 없으므로
  alternatives_korean:
  - 주문으로 다룰 수 없으므로
  - 주술로 달랠 수 없으므로
  lexicon: HALOT
  rationale: לָחַשׁ은 뱀을 다루는 주문·주술적 속삭임을 가리키므로, 핵심 의미인 ‘통제 불가’를 살려 ‘길들일 수 없으므로’로 옮겼습니다. 문자적 요소는 각주로 보완합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀이니라
  alternatives_korean:
  - 야훼의 말씀이니라
  - 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 용례에 따라 신명사 יְהוָה는 한국어 성경 관용인 ‘여호와’로 옮기되, 예언 선언식 결구는 ‘말씀이니라’가 아니라도 합쇼체로 자연스럽게 유지됩니다.
theological_decisions:
- issue: 예언적 경고의 직접성
  chosen_reading: ‘보십시오, 내가 … 보내고 있습니다’로 현재진행형/임박성을 살려 심판의 확정성을 드러냈습니다.
  alternative_readings:
  - ‘내가 … 보낼 것입니다’
  - ‘내가 … 보내려 합니다’
  rationale: הִנְנִי + 분사 구조는 단순 미래보다 이미 임박한 확정 행위를 강조하므로, 한국어에서도 진행형을 사용해 경고의 긴박함을 보존했습니다.
  doctrine_reference: WLC 히필/분사 구문과 예언 문맥의 담화 기능
- issue: 여호와 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB가 본문에서 Yahweh를 쓰더라도, 한국어 합본의 본문에서는 이 절의 예언 공식에 맞는 기존 한국어 성서 관용을 우선했습니다. 다만 원문 신명사 표기는 각주 없이도 식별 가능합니다.
  doctrine_reference: POB 한국어 표기 기본원칙
