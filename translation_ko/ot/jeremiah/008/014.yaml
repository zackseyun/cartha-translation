revisions:
- from: 우리가 왜 가만히 앉아 있습니까?[a] 서로 모여[b] 성채 도시들로 들어가 거기서 멸망합시다. 우리 하나님 야훼께서 우리를 멸망시키시고 독이 든 물을 마시게 하셨기 때문입니다. 우리는 야훼께 죄를 지었습니다.
  to: 우리가 왜 가만히 앉아 있습니까? 모여서 요새 성읍들로 들어가 거기서 멸망합시다.[a] 우리 하나님 야훼께서 우리를 멸망하게 하시고 독이 든 물을 마시게 하셨기 때문입니다.[b] 우리는 야훼께 죄를 지었습니다.
  rationale: 문맥상 심판과 파멸의 의미를 본문에 유지했습니다. 동시에 דמה의 침묵·정지 의미와 רֹאשׁ의 문자적 독성 이미지는 각각 해당 어구에 연결된 각주로 보존했습니다. ‘요새 성읍들’로 표현을 다듬고, 각주 표지를 해당 원어 어구와 정확히 연결했습니다.
