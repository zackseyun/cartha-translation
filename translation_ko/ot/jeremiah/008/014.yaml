id: JER.8.14
reference: Jeremiah 8:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל מָה֙ אֲנַ֣חְנוּ יֹֽשְׁבִ֔ים הֵֽאָסְפ֗וּ וְ/נָב֛וֹא אֶל עָרֵ֥י הַ/מִּבְצָ֖ר וְ/נִדְּמָה שָּׁ֑ם כִּי֩ יְהוָ֨ה אֱלֹהֵ֤י/נוּ הֲדִמָּ֨/נוּ֙ וַ/יַּשְׁקֵ֣/נוּ מֵי רֹ֔אשׁ כִּ֥י חָטָ֖אנוּ לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/014.yaml
  text: Why are we sitting still? Gather yourselves[a], and let us enter the fortified cities and perish there, for Yahweh our God has doomed us and given us poisoned water to drink[b], because we have sinned against Yahweh.
  footnotes:
  - marker: a
    text: Or 'and be silent there' / 'and be destroyed there' for 'and perish there'; the Hebrew verb can carry senses of silence, stillness, or ruin.
    reason: lexical_alternative
  - marker: b
    text: Literally 'water of gall' or 'water of poison.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 왜 가만히 앉아 있습니까?[a] 서로 모여[b] 성채 도시들로 들어가 거기서 멸망합시다. 우리 하나님 야훼께서 우리를 멸망시키시고 독이 든 물을 마시게 하셨기 때문입니다. 우리는 야훼께 죄를 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 조용히 있으라’ / ‘거기서 멸망하라’. 히브리어 동사는 침묵, 정지, 파멸의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘스스로 모여’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבִים
  english_pob_choice: sitting still
  chosen_korean: 가만히 앉아 있습니까
  alternatives_korean:
  - 앉아 있습니까
  - 머물고 있습니까
  - 그대로 있습니까
  lexicon: HALOT
  rationale: 단순한 ‘앉다’보다 여기서는 행동하지 않고 머무르는 무위의 뉘앙스가 핵심이어서, 한국어에서는 ‘가만히 앉아’로 수동성과 답답함을 살렸습니다.
- source_word: הֵאָסְפוּ
  english_pob_choice: Gather yourselves
  chosen_korean: 서로 모여
  alternatives_korean:
  - 모이십시오
  - 집결하십시오
  - 스스로 모이십시오
  lexicon: HALOT
  rationale: 니팔 명령형의 집합 촉구를 자연스럽게 옮기되, 반사적 뉘앙스를 살리기 위해 ‘서로 모여’로 표현했습니다.
- source_word: עָרֵי הַמִּבְצָר
  english_pob_choice: the fortified cities
  chosen_korean: 성채 도시들
  alternatives_korean:
  - 요새 도시들
  - 요새화된 도시들
  - 견고한 도시들
  lexicon: HALOT
  rationale: 군사적으로 방어 가능한 도시들을 가리키므로, ‘성채 도시들’이 방어 거점의 성격을 간결하게 드러냅니다.
- source_word: מֵי רֹאשׁ
  english_pob_choice: poisoned water
  chosen_korean: 독이 든 물
  alternatives_korean:
  - 쓴 물
  - 독물
  - 쓸개물
  lexicon: HALOT
  rationale: ‘로쉬’의 독성 이미지를 현대 한국어에서 분명하게 전달하면서, 주석을 통해 더 문자적인 대안을 열어 두었습니다.
theological_decisions:
- issue: דמה 계열 표현의 심판적 의미
  chosen_reading: 이 절은 백성이 야훼께서 자신들을 심판 아래 멸망시키셨다고 인정하는 말로 읽습니다.
  alternative_readings:
  - 야훼께서 우리를 침묵시키셨다
  - 그들이 단지 거기서 조용히 머물자는 뜻이다
  rationale: 성채 도시, 독이 든 물, 죄 고백이 함께 나오므로 ‘멸망시키다’가 문맥의 심판 선언을 가장 잘 반영합니다. 동시에 ‘가만히/서로 모여’라는 첫 절의 호출이 비극적 반응임을 살렸습니다.
  doctrine_reference: '번역 철학 §3: 진짜 모호성이 있을 때 긴장을 보존하되, 문맥상 우세한 뜻을 우선 반영'
