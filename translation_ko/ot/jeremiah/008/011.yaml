id: JER.8.11
reference: Jeremiah 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְרַפּ֞וּ אֶת שֶׁ֤בֶר בַּת עַמִּ/י֙ עַל נְקַלָּ֔ה לֵ/אמֹ֖ר שָׁל֣וֹם שָׁל֑וֹם וְ/אֵ֖ין שָׁלֽוֹם־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/011.yaml
  text: They have treated the wound of the daughter of my people lightly[a], saying, ‘Peace[b], peace,’ when there is no peace.
  footnotes:
  - marker: a
    text: Or 'superficially' / 'as though it were a trivial thing.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew shalom can also mean 'well-being,' 'wholeness,' or 'security.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 내 백성 딸의 상처를 가볍게 치료하면서 “평안하다, 평안하다”라고 말하지만, 평안은 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 상처를 ‘피상적으로’ 또는 ‘사소한 일처럼’ 다루었다는 뜻도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 shalom은 ‘평안’뿐 아니라 ‘안녕’, ‘온전함’, ‘안전’까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַפּוּ
  english_pob_choice: have treated
  chosen_korean: 치료하면서
  alternatives_korean:
  - 치유하면서
  - 낫게 하면서
  - 치료해 주면서
  lexicon: HALOT
  rationale: 히브리어 רפא의 기본 뜻은 ‘치료하다/고치다’이지만, 문맥상 실제로는 상처를 표면적으로 다룬다는 반어가 핵심이므로 ‘치료하다’ 계열을 살리되 진행형으로 처리했습니다.
- source_word: עַל נְקַלָּה
  english_pob_choice: lightly
  chosen_korean: 가볍게
  alternatives_korean:
  - 피상적으로
  - 사소한 일처럼
  - 별것 아닌 듯
  lexicon: HALOT
  rationale: ‘가볍게’는 그들이 심각한 상처를 대수롭지 않게 다뤘다는 비난을 간결하게 전달하며, 영어 POB의 ‘lightly’와 가장 자연스럽게 대응합니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성 딸
  alternatives_korean:
  - 내 백성의 딸
  - 내 백성 이스라엘의 딸
  - 내 백성
  lexicon: HALOT
  rationale: 예언서의 관용적 의인화를 보존하기 위해 ‘딸’을 유지했습니다. 한국어에서는 소유격 어순을 조금 자연화해도 비유적 긴장감이 살아 있습니다.
- source_word: שָׁלוֹם שָׁלוֹם
  english_pob_choice: Peace, peace
  chosen_korean: “평안하다, 평안하다”
  alternatives_korean:
  - “평안, 평안”
  - “평화, 평화”
  - “모든 것이 괜찮다, 모든 것이 괜찮다”
  lexicon: HALOT
  rationale: שָׁלוֹם은 평화뿐 아니라 평안/안녕/안전을 포괄하므로 본문은 반복 구조를 살려 ‘평안하다’로 옮기고, 의미 범위는 각주에서 보완하는 편이 가장 적절합니다.
theological_decisions:
- issue: 예언적 비난의 반어 유지
  chosen_reading: ‘평안하다, 평안하다’라는 말이 실제 상황과 정면으로 어긋난다는 반어를 그대로 드러냈습니다.
  alternative_readings:
  - ‘모든 것이 괜찮다, 괜찮다’
  - ‘평화, 평화’
  rationale: 본문의 핵심은 거짓 안심을 주는 선언과 ‘평안은 없습니다’라는 현실의 충돌입니다. 이를 희석하지 않고 반복과 부정을 병치해 예언적 책망의 날카로움을 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
