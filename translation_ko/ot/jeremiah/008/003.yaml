id: JER.8.3
reference: Jeremiah 8:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִבְחַ֥ר מָ֨וֶת֙ מֵֽ/חַיִּ֔ים לְ/כֹ֗ל הַ/שְּׁאֵרִית֙ הַ/נִּשְׁאָרִ֔ים מִן הַ/מִּשְׁפָּחָ֥ה הָֽ/רָעָ֖ה הַ/זֹּ֑את בְּ/כָל הַ/מְּקֹמ֤וֹת הַ/נִּשְׁאָרִים֙ אֲשֶׁ֣ר הִדַּחְתִּ֣י/ם שָׁ֔ם נְאֻ֖ם יְהוָ֥ה צְבָאֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
  footnotes:
  - marker: a
    text: Hebrew literally, 'in all the remaining places where I have driven them there.' The wording emphasizes the scattered survivors in every place of exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 죽음이 삶보다 택해질 것입니다. 이 악한 가족[a]에서 남아 있는 모든 남은 자가, 내가 그들을 흩어 보낸 모든 남아 있는 곳에서 그렇게 될 것입니다—만군의 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 그들을 그곳으로 흩어 보낸 모든 남아 있는 곳에서’라는 뜻입니다. 이 표현은 포로지에 흩어진 생존자들을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִבְחַר
  english_pob_choice: will be chosen
  chosen_korean: 택해질 것입니다
  alternatives_korean:
  - 선택될 것입니다
  - 뽑힐 것입니다
  lexicon: HALOT
  rationale: נבחר의 수동적 의미를 살리되, 예언문맥의 단호함을 유지하기 위해 자연스러운 미래 수동형으로 옮겼습니다.
- source_word: מֵחַיִּים
  english_pob_choice: rather than life
  chosen_korean: 삶보다
  alternatives_korean:
  - 생명보다
  - 삶 대신
  lexicon: HALOT
  rationale: בחר와 결합한 מִן의 비교 의미를 간결하게 살려, 죽음이 삶을 선호 대상으로 삼는 역설을 드러냈습니다.
- source_word: הַשְּׁאֵרִית הַנִּשְׁאָרִים
  english_pob_choice: the remnant who remain
  chosen_korean: 남아 있는 모든 남은 자
  alternatives_korean:
  - 남은 자
  - 생존한 자들
  lexicon: HALOT
  rationale: שְׁאֵרִית의 예언적 뉘앙스를 살려 ‘남은 자’를 유지하고, participle의 반복을 ‘남아 있는’으로 반영했습니다.
- source_word: הַמִּשְׁפָּחָה הָרָעָה הַזֹּאת
  english_pob_choice: this evil family
  chosen_korean: 이 악한 가족
  alternatives_korean:
  - 이 악한 집안
  - 이 악한 가문
  lexicon: HALOT
  rationale: מִשְׁפָּחָה는 혈연적 집단을 가리키므로 ‘가족’이 가장 직역에 가깝고, רָעָה는 도덕적 악을 직설적으로 옮겼습니다.
- source_word: נְאֻם יְהוָה צְבָאוֹת
  english_pob_choice: declares Yahweh of hosts
  chosen_korean: 만군의 야훼의 말씀입니다
  alternatives_korean:
  - 만군의 야훼께서 말씀하십니다
  - 만군의 야훼께서 선포하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 공식을 한국어 성경체로 자연스럽게 옮기되, divine name은 본 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: מִשְׁפָּחָה의 범위와 심판 대상
  chosen_reading: ‘가족’으로 옮겨 현재 세대의 혈연 공동체이면서도, 예언적 심판 대상인 집단이라는 긴장을 살렸습니다.
  alternative_readings:
  - 가문
  - 집안
  rationale: 문맥상 단순한 핵가족이 아니라 공동체적·혈연적 책임을 지는 집단을 가리키므로, 한국어에서 가장 직접적인 혈연 집단 표현을 택했습니다.
  doctrine_reference: 예언서 문맥의 집단 심판 이해
