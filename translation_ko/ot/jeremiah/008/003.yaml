  yaml_path: translation/ot/jeremiah/008/003.yaml
  text: And death will be chosen rather than life by all the remnant who remain from this evil family[a], in all the places where the remnant remain, where I have driven them—declares Yahweh of hosts.
  footnotes:
  - marker: a
    text: Hebrew literally, 'in all the remaining places where I have driven them there.' The wording emphasizes the scattered survivors in every place of exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 악한 가문에서 남아 있는 모든 남은 자들은, 내가 그들을 흩어 보낸 모든 남아 있는 곳에서[a] 삶보다 죽음을 택할 것입니다—만군의 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 그들을 그곳으로 흩어 보낸 모든 남아 있는 곳에서’라고 합니다. 이 표현은 포로지마다 흩어져 남아 있는 생존자들을 강조합니다.
    reason: lexical_alternative
