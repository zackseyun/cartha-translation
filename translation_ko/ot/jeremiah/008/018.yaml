lexical_decisions:
- source_word: מַבְלִיגִיתִי
  english_pob_choice: My sorrow is beyond healing
  chosen_korean: 내 슬픔은 고칠 수 없고
  alternatives_korean:
  - 내 위로는 사라졌고
  - 내 위안은 사라졌고
  - 나는 슬픔 속에서 스스로 위로할 수 없고
  lexicon: HALOT
  rationale: 문맥상 첫 구는 ‘위로/회복/치유’의 부재를 압축적으로 드러내는 난해한 표현이므로, 영어 POB의 최종 판단에 맞춰 ‘고칠 수 없다’로 자연스럽게 옮겼습니다.
- source_word: יָגוֹן
  english_pob_choice: sorrow
  chosen_korean: 슬픔
  alternatives_korean:
  - 근심
  - 비애
  - 애통
  lexicon: HALOT
  rationale: 이 명사는 애통과 비통을 가리키며, 여기서는 시적 문맥에 맞는 표준적인 ‘슬픔’이 가장 직접적입니다.
- source_word: לִבִּי
  english_pob_choice: my heart
  chosen_korean: 내 마음
  alternatives_korean:
  - 내 심장
  - 내 속
  - 내 중심
  lexicon: HALOT
  rationale: 히브리어 ‘마음’은 감정과 의지의 자리이므로, 한국어에서도 자연스러운 내적 주체로 ‘내 마음’이 적절합니다.
- source_word: דַוָּי
  english_pob_choice: is sick
  chosen_korean: 병들었습니다
  alternatives_korean:
  - 아픕니다
  - 쇠약합니다
  - 병이 들었습니다
  lexicon: HALOT
  rationale: 형용사는 질병/쇠약 상태를 나타내므로, 비유적 내면 상태를 살리되 현대 한국어에서 자연스러운 ‘병들었습니다’로 옮겼습니다.
theological_decisions:
- issue: 첫 절반의 난해한 히브리어 표현을 어떻게 처리할지
  chosen_reading: 회복 불가능한 슬픔으로 이해하여 ‘내 슬픔은 고칠 수 없고’로 옮겼습니다.
  alternative_readings:
  - ‘내가 슬픔 속에서 스스로 위로하려 했으나’
  - ‘내 위로가 사라졌고’
  rationale: 본 절의 핵심은 단순 감정 묘사가 아니라 치유 불가능한 상실감입니다. 영어 POB의 수정판과 히브리어 문맥을 따라 그 의미를 보존했습니다.
  doctrine_reference: 예레미야 8:18의 애가적 문맥
- issue: 마음의 상태를 신체적 질병 이미지로 옮길지 여부
  chosen_reading: ‘내 마음은 속에서 병들었습니다’로 내면의 고통을 신체적 질병 이미지로 유지했습니다.
  alternative_readings:
  - ‘내 마음이 속에서 아픕니다’
  - ‘내 마음이 제 안에서 쇠약합니다’
  rationale: 히브리어의 비유적 질병 이미지를 약화시키지 않기 위해, 내면의 병듦이라는 강한 표현을 유지했습니다.
  doctrine_reference: 히브리 시가의 은유적 표현
