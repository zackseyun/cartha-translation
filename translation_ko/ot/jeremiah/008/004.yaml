  text: 그들에게 이렇게 말해야 합니다. 「야훼께서 이렇게 말씀하십니다. 사람들이 넘어지면 다시 일어나지 않겠습니까? 사람이 돌아서고도 돌아오지 않겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
