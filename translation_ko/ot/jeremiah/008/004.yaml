    text: 또는 “사람이 되돌아서고도 돌아오지 않겠습니까?” 히브리어는 수사적 효과를 위해 같은 동사(돌다/돌아오다)를 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: You shall say to them
  chosen_korean: 너는 그들에게 이렇게 말해야 합니다
  alternatives_korean:
