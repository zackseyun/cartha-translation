  text: 'You shall say to them[a], ‘Thus says Yahweh: Do people fall and not rise again? Does one turn away and not return?’'
  footnotes:
  - marker: a
    text: Or, 'Does one turn back and not return?' The Hebrew repeats the same verb ('turn/return') for rhetorical effect.
    reason: lexical_alternative
translation:
  language: ko
  text: 너는 그들에게 이렇게 말해야 합니다. 「야훼께서 이렇게 말씀하십니다. 사람들이 넘어져도 다시 일어나지 않겠습니까? 사람이 돌아서고도 돌아오지 않겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “사람이 돌아서고도 돌아오지 않겠습니까?” 히브리어는 수사적 효과를 위해 같은 동사(돌다/돌아오다)를 반복합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: You shall say to them
  chosen_korean: 너는 그들에게 이렇게 말해야 합니다
  alternatives_korean:
  - 그들에게 말하십시오
  - 너는 그들에게 말해야 합니다
  lexicon: HALOT
  rationale: 예언적 소명 문맥의 명령/미래적 지시를 자연스러운 현대 한국어로 옮기되, 청자에게 전달되는 직접 명령성을 유지했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 주님께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 수식구를 ‘이렇게 말씀하십니다’로 자연스럽게 옮기고, יְהוָה는 프로젝트 기본값에 따라 야훼로 렌더링했습니다.
- source_word: הֲיִפְּלוּ וְלֹא יָקוּמוּ
  english_pob_choice: Do people fall and not rise again?
  chosen_korean: 사람들이 넘어져도 다시 일어나지 않겠습니까?
  alternatives_korean:
  - 사람들이 넘어져도 다시 일어나지 않습니까?
  - 사람이 넘어져도 다시 일어나지 않겠습니까?
  lexicon: HALOT
  rationale: 수사적 질문의 압박을 살리기 위해 ‘-겠습니까’형을 사용했고, 일반 진술로서의 복수성을 살려 ‘사람들이’를 택했습니다.
- source_word: אִם יָשׁוּב וְלֹא יָשׁוּב־
  english_pob_choice: Does one turn away and not return?
  chosen_korean: 사람이 돌아서고도 돌아오지 않겠습니까?
  alternatives_korean:
  - 사람이 돌아서고도 돌아오지 않습니까?
  - 누군가 돌아서고도 돌아오지 않겠습니까?
  lexicon: HALOT
  rationale: שׁוּב의 반복을 한국어에서도 ‘돌아서고… 돌아오지’로 살려, 되돌아옴의 의미 대비를 분명히 했습니다.
