source:
  edition: WLC
  text: מִ/דָּ֤ן נִשְׁמַע֙ נַחְרַ֣ת סוּסָ֗י/ו מִ/קּוֹל֙ מִצְהֲל֣וֹת אַבִּירָ֔י/ו רָעֲשָׁ֖ה כָּל הָ/אָ֑רֶץ וַ/יָּב֗וֹאוּ וַ/יֹּֽאכְלוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֥שְׁבֵי בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/016.yaml
  text: From Dan is heard the snorting of his horses[a]; at the sound of the neighing of his stallions the whole land quakes. They come and devour the land and its fullness[c][b], the city and those who dwell in it.
  footnotes:
  - marker: a
    text: Or 'the whole earth trembles.' The Hebrew אֶרֶץ can mean either 'land' or 'earth'; here 'land' fits the immediate context of invasion and devastation.
    reason: lexical_alternative
  - marker: b
    text: Or 'the land and everything in it.' Hebrew 'its fullness' refers to all that fills the land.
    reason: lexical_alternative
  - marker: c
    text: Or 'his mighty horses' for 'his stallions.' The Hebrew term can denote strength or nobility; in this context it refers to powerful war-horses.
    reason: lexical_alternative
translation:
  language: ko
  text: 단에서 그의 말들이 콧김을 내뿜는 소리가 들립니다. 그의 준마들이 울부짖는 소리에 온 땅이 흔들립니다.[a] 그들이 와서 땅과 그 안에 가득한 것[b], 성읍과 그 안에 사는 사람들을 삼킵니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 세상’. 히브리어 אֶרֶץ는 ‘땅’ 또는 ‘세상’을 뜻할 수 있습니다. 여기서는 침공과 황폐의 문맥상 ‘온 땅’이 알맞습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅과 그 모든 것’. 히브리어는 땅을 채우고 있는 모든 것을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그의 힘센 말들’. 히브리어는 힘이나 위엄을 뜻할 수 있으며, 여기서는 강한 전쟁 말들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּן
  english_pob_choice: From Dan
  chosen_korean: 단에서
  alternatives_korean:
  - 단으로부터
  - 단 지역에서
  lexicon: HALOT
  rationale: 전치사 מִן의 출발점 의미를 살리되, 지명은 본문을 자연스럽게 읽히도록 ‘단에서’로 옮겼습니다.
- source_word: נַחְרַת סוּסָיו / מִצְהֲלוֹת אַבִּירָיו
  english_pob_choice: the snorting of his horses / the neighing of his stallions
  chosen_korean: 말발굽 소리 / 그의 준마들의 울음소리
  alternatives_korean:
  - 그의 말들의 코고는 소리 / 그의 강한 말들의 울음소리
  - 그의 군마들의 코푸는 소리 / 그의 준마들의 울음소리
  lexicon: HALOT
  rationale: 말의 거친 호흡과 울음소리를 한국어 독자가 즉시 떠올릴 수 있게 하되, 전쟁 말의 위세를 드러내는 문맥을 반영해 ‘준마들’로 옮겼습니다.
- source_word: רָעֲשָׁה כָּל הָאָרֶץ
  english_pob_choice: the whole land quakes
  chosen_korean: 온 땅이 흔들립니다
  alternatives_korean:
  - 온 땅이 떨립니다
  - 온 나라가 흔들립니다
  lexicon: HALOT
  rationale: אֶרֶץ가 이 문맥에서는 침공의 대상인 ‘땅/토지’를 가리키므로 ‘온 땅’으로 두고, 동사는 충격적 진동을 살려 ‘흔들립니다’로 옮겼습니다.
- source_word: אֶרֶץ וּמְלוֹאָהּ
  english_pob_choice: the land and its fullness
  chosen_korean: 땅과 그 충만함
  alternatives_korean:
  - 땅과 그 안에 가득한 것
  - 땅과 그 모든 것
  lexicon: HALOT
  rationale: מְלוֹא의 ‘가득 찬 것, 채워진 것’이라는 뜻을 보존하기 위해 직역성이 있는 ‘충만함’을 택했습니다.
- source_word: עִיר וְיֹשְׁבֵי בָהּ
  english_pob_choice: the city and those who dwell in it
  chosen_korean: 성읍과 그 안에 사는 자들
  alternatives_korean:
  - 성읍과 그 주민들
  - 도성과 그 거주자들
  lexicon: HALOT
  rationale: יֹשְׁבֵי의 현재적 거주 의미를 살리면서 예언문체에 맞게 ‘그 안에 사는 자들’로 옮겼습니다.
theological_decisions:
- issue: 전쟁 말의 묘사를 통한 심판 이미지
  chosen_reading: 본문의 말소리는 단순한 자연 묘사가 아니라, 북쪽에서 밀려오는 침공과 야훼의 심판이 임박했음을 드러내는 예언적 경고로 읽었습니다.
  alternative_readings:
  - 단순한 과장된 시적 표현으로만 읽기
  - 실제 전투 소리의 묘사로만 제한하기
  rationale: 문맥상 말소리와 땅의 흔들림, 성읍과 거주민의 삼킴이 함께 연결되어 있어 침공-심판의 예언적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 예언서의 심판 경고와 언약적 징계
- issue: אֶרֶץ의 범위
  chosen_reading: 여기서는 ‘땅’으로 번역해 지역적 파괴와 황폐화를 강조했습니다.
  alternative_readings:
  - ‘땅’ 대신 ‘온 땅’ 또는 ‘세상’으로 일반화하기
  - ‘나라’로 국가적 의미를 강조하기
  rationale: 이 절의 초점은 유다 땅의 침공과 황폐이므로, 광범위한 우주적 의미보다 국지적 피해를 드러내는 번역이 본문의 의도를 더 잘 반영합니다.
  doctrine_reference: 본문 맥락 우선 원칙
