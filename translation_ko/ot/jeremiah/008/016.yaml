  source_fidelity: 첫 구절의 נַחְרַת סוּסָיו는 말발굽 소리가 아니라 말들이 콧김을 내뿜는 소리(코를 거칠게 울리는 소리)입니다. 또한 וַיֹּאכְלוּ는 뒤따르는 ‘땅과 그 안에 가득한 것, 성읍과 그 안에 사는 사람들’ 전체를 목적어로 취하므로 한국어에서도 한 번의 ‘삼킵니다’로 연결하는 편이 원문 구조에 충실합니다.
  naturalness: ‘말발굽 소리’와 ‘준마들의 울음소리’의 병치는 원문의 서로 다른 말소리를 정확히 반영하지 못합니다. ‘말들이 콧김을 내뿜는 소리’와 ‘준마들이 울부짖는 소리’는 현대 표준 한국어의 자연스러운 예언문체를 유지하면서 의미를 구별합니다. ‘그 충만함’은 한국어에서 다소 불투명하므로 ‘그 안에 가득한 것’이 자연스럽습니다.
  terminology: ‘단’, ‘온 땅’, ‘성읍’은 적절합니다. אַבִּירָיו는 말 문맥에서 ‘준마들’로 옮길 수 있으며, 대안 ‘힘센 말들’을 각주로 보존합니다. 아레츠의 ‘땅/세상’ 가능성은 ‘온 땅’에 붙는 각주에서 제시해야 합니다.
