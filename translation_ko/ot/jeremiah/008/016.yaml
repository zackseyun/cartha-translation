  to: 단에서 그의 말들이 콧김을 내뿜는 소리가 들립니다. 그의 준마들이 울부짖는 소리에 온 땅이 흔들립니다.[a] 그들이 와서 땅과 그 안에 가득한 것[b], 성읍과 그 안에 사는 사람들을 삼킵니다.[c]
