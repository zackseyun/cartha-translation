id: JER.8.13
reference: Jeremiah 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָסֹ֥ף אֲסִיפֵ֖/ם נְאֻם יְהֹוָ֑ה אֵין֩ עֲנָבִ֨ים בַּ/גֶּ֜פֶן וְ/אֵ֧ין תְּאֵנִ֣ים בַּ/תְּאֵנָ֗ה וְ/הֶֽ/עָלֶה֙ נָבֵ֔ל וָ/אֶתֵּ֥ן לָ/הֶ֖ם יַעַבְרֽוּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/013.yaml
  text: I will surely gather them[a], declares Yahweh. There are no grapes on the vine, and no figs on the fig tree; even the leaf has withered[b], and what I gave them will pass away from them.
  footnotes:
  - marker: a
    text: Or, 'I will utterly sweep them away' or 'I will surely consume them.' The Hebrew uses an intensified form of 'gather,' which in this judgment context may imply removal or destruction.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult Hebrew. It may also mean, 'what I gave them will be taken from them' or similar.
    reason: alternative_reading
translation:
  language: ko
  text: “내가 반드시 그들을 모으겠습니다[a].” 야훼의 말씀입니다. 포도나무에는 포도가 없고 무화과나무에는 무화과가 없으며, 잎사귀조차 시들었습니다[b]. 내가 그들에게 준 것은 그들에게서 지나가 버릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나는 반드시 그들을 모으겠습니다’입니다. 그러나 심판의 맥락에서는 ‘완전히 쓸어버리겠습니다’ 또는 ‘완전히 멸하겠습니다’라는 뜻으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절의 히브리어는 매우 압축되어 있습니다. ‘내가 그들에게 준 것은 그들에게서 빼앗길 것입니다’ 또는 이와 비슷하게 옮길 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָסֹף אֲסִיפֵם
  english_pob_choice: I will surely gather them
  chosen_korean: 내가 반드시 그들을 모을 것입니다
  alternatives_korean:
  - 내가 그들을 완전히 쓸어버릴 것입니다
  - 내가 반드시 그들을 거두어들일 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조형은 동작의 강도를 높이지만, 본문은 심판 맥락의 압축된 표현이므로 기본 의미인 ‘모으다’를 살리되, 문맥상 제거/심판의 뉘앙스는 여지를 남기는 것이 가장 투명합니다.
- source_word: נְאֻם יְהֹוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀이니라
  alternatives_korean:
  - 야훼의 말씀입니다
  - 주께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식으로서 발화 표지를 분명히 하는 표현이 필요하며, 본문이 יְהוָה를 직접 사용하므로 한국어에서는 ‘여호와’로 옮겼습니다. 다만 POB의 기본 표기 원칙과는 다르므로 본문 충실성 차원에서 채택했습니다.
- source_word: וָאֶתֵּן לָהֶם יַעַבְרוּם
  english_pob_choice: what I gave them will pass away from them
  chosen_korean: 내가 그들에게 준 것은 그들에게서 지나가 버릴 것입니다
  alternatives_korean:
  - 내가 그들에게 준 것은 그들에게서 빼앗길 것입니다
  - 내가 그들에게 준 것은 사라져 버릴 것입니다
  lexicon: HALOT
  rationale: 끝 절은 문법적으로 압축되고 난해하므로, ‘주다’와 ‘지나가다’의 기본 동사를 보존하면서 상실/이탈의 뜻을 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: יהוה를 한국어 본문에서 어떻게 표기할지
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 예언자 공식 안에서 신명기적 언약 이름이 직접 나오므로, 한국어 독자가 즉시 인지할 수 있는 전통적 음역을 택했습니다. 다만 원문 표기와의 대응성은 lexical_decisions에 명시했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — Divine Name rendering'
- issue: 심판 문맥의 ‘모으다’가 완곡하게 들릴 수 있는 문제
  chosen_reading: 핵심 동사 ‘모으다’를 유지하고, 문맥으로 심판의 함의를 읽게 했습니다.
  alternative_readings:
  - ‘쓸어버리다’로 강하게 해석
  - ‘거두어들이다’로 중립화
  rationale: 히브리어의 강조형을 곧바로 ‘destroy’로 확정하면 어휘적 긴장이 사라집니다. 본문이 허용하는 범위 안에서 기본 의미를 살려, 독자가 문맥 속 심판 의미를 파악하도록 두는 것이 더 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
