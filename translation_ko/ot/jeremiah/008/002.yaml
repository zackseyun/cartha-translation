review_pass:
  verdict: revise
  source_fidelity: 현 초안은 וּשְׁטָחוּם의 능동형(‘그들이 그것들을 널어 놓을 것이다’)을 ‘그들은 … 펼쳐질 것입니다’라는 수동형으로 바꾸어, 행위자와 목적어의 관계를 뒤바꿉니다. 또한 천체들을 가리키는 관계절이 뒤 문장으로 분리되면서 ‘그것들 앞에’가 무엇을 받는지 불명확해졌습니다. לְדֹמֶן은 수치의 표상인 ‘배설물/똥’이지 유익한 비료를 연상시키는 ‘거름’으로 완화하지 않는 것이 적절합니다.
  naturalness: 수정문은 한국어의 현대 공적 문체를 유지하면서, 반복되는 숭배 행위를 한 문장 안에서 자연스럽게 연결합니다. ‘하늘의 모든 천체’는 כאן의 천체 숭배 문맥을 분명히 하며, ‘하늘의 만군’이 한국어에서 ‘만군의 여호와’와 연상될 수 있는 혼동도 피합니다.
  terminology: צְבָא הַשָּׁמַיִם은 문맥상 ‘하늘의 모든 천체’로 옮기고 각주에서 직역적 대안을 제시했습니다. עבד/הלך אחרי/דרש/השתחוה의 구별은 ‘섬기며/뒤를 따르고/찾으며/엎드렸던’으로 보존했습니다. דֹמֶן은 예언서의 모욕적 이미지를 유지하여 ‘배설물’로 옮겼습니다.
  issues:
  - severity: high
    issue: 첫 절이 능동문에서 수동문으로 바뀌었습니다.
    rationale: וּשְׁטָחוּם은 ‘그들이 그것들을 펼쳐/널어 놓을 것이다’라는 3인칭 복수 능동형이며, 현 초안의 ‘그들은 … 펼쳐질 것입니다’는 주어와 목적어를 혼동합니다.
  - severity: high
    issue: 천체를 받는 관계절의 선행사가 불명확합니다.
    rationale: ‘그들이 … 엎드렸던 그것들 앞에’는 이미 언급된 해·달·하늘의 만군을 뒤늦게 지시하여 문장 구조가 어색하고 지시 대상도 흐립니다.
  - severity: medium
    issue: ‘거름’은 דֹמֶן의 모욕적·불결한 이미지를 약화할 수 있습니다.
    rationale: 현대 한국어의 ‘거름’은 비료라는 긍정적 용례가 강합니다. 문맥의 유기·수치 이미지를 위해 ‘배설물’이 더 충실합니다.
  - severity: low
    issue: ‘하늘의 만군’은 한국어에서 신명 칭호와 혼동될 여지가 있습니다.
    rationale: 원문은 숭배 대상인 해·달과 함께 놓인 하늘의 천체 무리를 가리키므로 ‘하늘의 모든 천체’가 문맥상 더 명료합니다.
  revised_text: 그들은 그것들을, 그들이 사랑하고 섬기며 그 뒤를 따르고 찾으며 그들에게 엎드렸던 해와 달과 하늘의 모든 천체[a] 앞에 널어 놓을 것입니다. 그것들은 거두어지지도 않고 묻히지도 않을 것이며, 땅 위[c]의 배설물이 될 것입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘하늘의 모든 군대’. 여기서는 해와 달과 함께 언급된 천체들의 무리를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘찾으며’는 문맥상 ‘문의하며’ 또는 ‘물으며’로도 옮길 수 있으며, 천체를 향한 종교적 탐문을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘땅의 얼굴 위’입니다.
    reason: lexical_alternative
  revision_rationale: 원문의 능동 구문과 대명사 관계를 회복하고, 천체 숭배를 묘사하는 다섯 동사의 연쇄를 유지했습니다. ‘찾으며’의 대안적 종교적 문의 의미는 각주로 보존했습니다. 다만 이 번역문에는 b 각주가 걸릴 ‘찾으며’에 표지가 빠져 있으므로, 최종 본문에는 해당 표지를 추가해야 합니다.
