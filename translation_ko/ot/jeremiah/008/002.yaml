  text: וּ/שְׁטָחוּ/ם֩ לַ/שֶּׁ֨מֶשׁ וְ/לַ/יָּרֵ֜חַ וּ/לְ/כֹ֣ל צְבָ֣א הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר אֲהֵב֜וּ/ם וַ/אֲשֶׁ֤ר עֲבָדוּ/ם֙ וַֽ/אֲשֶׁר֙ הָלְכ֣וּ אַֽחֲרֵי/הֶ֔ם וַ/אֲשֶׁ֣ר דְּרָשׁ֔וּ/ם וַ/אֲשֶׁ֥ר הִֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם לֹ֤א יֵאָֽסְפוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְיֽוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/002.yaml
  text: And they will spread them out before the sun and the moon and all the host of the heavens[a], which they loved and which they served and after which they walked and which they sought and to which they bowed down. They will not be gathered, and they will not be buried[c][b]; they will become dung on the surface of the ground.
  footnotes:
  - marker: a
    text: Or 'all the host of heaven.'
    reason: lexical_alternative
  - marker: b
    text: '''Which they sought'' may also be rendered ''which they consulted'' or ''of which they inquired,'' highlighting religious inquiry directed toward the heavenly bodies.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'on the face of the ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 해와 달과 하늘의 만군 앞에 펼쳐질 것입니다. 그들이 사랑하고, 섬기고, 그 뒤를 따라다니고, 찾고, 그 앞에 엎드렸던 그것들 앞에 말입니다. 그것들은 거두어지지도 않고 묻히지도 못하며, 땅의 표면 위의 거름이 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 만군’은 문자적으로는 ‘하늘의 모든 군대’에 가깝습니다.
    reason: source_note
  - marker: b
    text: ‘찾고’는 여기서 종교적으로 ‘문의하다’ 또는 ‘조사하다’는 뜻일 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘땅의 표면 위’는 문자적으로는 ‘땅의 얼굴 위’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁטָחוּם
  english_pob_choice: they will spread them out
  chosen_korean: 펼쳐질 것입니다
  alternatives_korean:
  - 펴 놓을 것입니다
  - 널어 놓을 것입니다
  lexicon: HALOT
  rationale: 시신이나 뼈를 우상 앞에 드러내어 놓는 이미지를 한국어에서 자연스럽게 살리되, 단순한 흩뿌림으로 약화되지 않게 했습니다.
- source_word: וּלְכֹל צְבָא הַשָּׁמַיִם
  english_pob_choice: all the host of the heavens
  chosen_korean: 하늘의 만군
  alternatives_korean:
  - 하늘의 군대
  - 하늘의 모든 군상
  lexicon: HALOT
  rationale: צָבָא의 집합적·군대적 뉘앙스를 ‘만군’으로 살렸고, ‘하늘’은 원문의 복수형을 한국어에서 자연스럽게 압축해 옮겼습니다.
- source_word: וַאֲשֶׁר דְּרָשׁוּם
  english_pob_choice: which they sought
  chosen_korean: 찾고
  alternatives_korean:
  - 구한
  - 물은
  lexicon: HALOT
  rationale: 종교적 ‘문의하다’까지 포함할 수 있지만, 앞뒤의 ‘사랑하고/섬기고/엎드렸던’ 연쇄 속에서 탐구와 의존의 폭을 유지하는 중립적 동사로 옮겼습니다.
- source_word: לְדֹמֶן
  english_pob_choice: dung
  chosen_korean: 거름
  alternatives_korean:
  - 똥
  - 배설물
  lexicon: HALOT
  rationale: 예언적 수치와 부정을 드러내는 강한 이미지이지만, 현대 한국어에서 문학적·공적 문체로는 ‘거름’이 지나친 노골성을 줄이면서도 오염과 폐기라는 뜻을 전달합니다.
theological_decisions:
- issue: 우상 숭배 동사의 연쇄를 어떻게 살릴지
  chosen_reading: ‘사랑하고, 섬기고, 그 뒤를 따라다니고, 찾고, … 엎드렸던’으로 동사들을 구분해 유지했습니다.
  alternative_readings:
  - ‘숭배했던’으로 통합
  - ‘예배했던’으로 일반화
  rationale: 히브리어는 서로 다른 동사들을 겹쳐 써서 천체에 대한 포괄적 헌신을 고발합니다. 한국어에서도 그 구분을 지켜 예언적 고발의 강도를 보존했습니다.
  doctrine_reference: 번역 원리 §§1, 5
