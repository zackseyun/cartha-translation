  - 주님
  rationale: 본문의 יְהוָה를 프로젝트 기본값에 따라 음역해, 언약 სახელ의 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
