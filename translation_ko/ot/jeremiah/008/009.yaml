base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
  footnotes:
  - marker: a
    text: Or 'caught' or 'taken.' The Hebrew verb can denote being seized or trapped.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 자들은 수치를 당하고, 놀라 사로잡힐 것입니다.[a] 보십시오, 그들은 야훼의 말씀을 버렸으니, 그들에게 무슨 지혜가 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘붙잡힐 것입니다’, ‘덫에 걸릴 것입니다’. 히브리어 동사는 붙잡히거나 덫에 걸리는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  english_pob_choice: are put to shame
  chosen_korean: 부끄러움을 당하고
  alternatives_korean:
  - 수치를 당하고
