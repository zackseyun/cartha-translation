    issue: 각주 표지가 ‘사로잡힙니다’가 아니라 문장 끝의 수사 의문문 뒤에 놓여 있습니다.
    rationale: 각주는 וַיִּלָּכֵדוּ(사로잡히다)의 대안 번역을 설명하므로 해당 번역어 바로 뒤에 붙여야 독자가 각주의 참조 대상을 명확히 알 수 있습니다.
  - severity: low
    issue: ‘당황하며’는 חַתּוּ의 의미와 문장 연결을 충분히 살리지 못합니다.
    rationale: 이 동사는 심판과 패배 앞에서 크게 놀라거나 낙담하고 혼란에 빠지는 뜻입니다. ‘놀라’가 간결하면서도 자연스럽게 그 의미를 반영합니다.
