id: JER.8.9
reference: Jeremiah 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֹבִ֣ישׁוּ חֲכָמִ֔ים חַ֖תּוּ וַ/יִּלָּכֵ֑דוּ הִנֵּ֤ה בִ/דְבַר יְהוָה֙ מָאָ֔סוּ וְ/חָכְמַֽת מֶ֖ה לָ/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/009.yaml
  text: The wise men are put to shame; they are dismayed and captured. Look[a], they have rejected the word of Yahweh, so what wisdom do they have?
  footnotes:
  - marker: a
    text: Or 'caught' or 'taken.' The Hebrew verb can denote being seized or trapped.
    reason: lexical_alternative
translation:
  language: ko
  text: 지혜로운 자들은 부끄러움을 당하고, 당황하며 사로잡힙니다. 보십시오, 그들은 야훼의 말씀을 버렸으니, 그들에게 무슨 지혜가 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잡혔다’, ‘붙잡혔다’. 히브리어 동사는 사로잡히거나 덫에 걸린다는 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  english_pob_choice: are put to shame
  chosen_korean: 부끄러움을 당하고
  alternatives_korean:
  - 수치를 당하고
  - 부끄러움을 받으며
  lexicon: HALOT
  rationale: 히필형의 수동적 결과를 살려 단순 내면 감정이 아니라 공개적 수치를 표현했습니다.
- source_word: חֲכָמִים
  english_pob_choice: the wise men
  chosen_korean: 지혜로운 자들
  alternatives_korean:
  - 지혜자들
  - 현자들
  lexicon: HALOT
  rationale: 본문의 남성 복수형을 살리되, 한국어에서는 직역 투의 '지혜로운 사람들'보다 간결한 '지혜로운 자들'이 예언적 책망에 자연스럽습니다.
- source_word: וַיִּלָּכֵדוּ
  english_pob_choice: and captured
  chosen_korean: 사로잡힙니다
  alternatives_korean:
  - 붙잡힙니다
  - 포로가 됩니다
  lexicon: HALOT
  rationale: 잡히거나 덫에 걸린다는 뜻을 함께 담을 수 있는 표현으로, 판단의 결과로 완전히 제압되는 뉘앙스를 살렸습니다.
- source_word: בִדְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 '야훼'로 옮기고, דָּבָר는 예언문맥에 맞게 '말씀'으로 옮겼습니다.
- source_word: מָאָסוּ
  english_pob_choice: have rejected
  chosen_korean: 버렸으니
  alternatives_korean:
  - 거절했으니
  - 배척했으니
  lexicon: HALOT
  rationale: מאס의 핵심은 단순 비호감이 아니라 권위 있는 거부이므로, 한국어에서는 강한 거절을 뜻하는 '버리다'로 옮겼습니다.
- source_word: וְחָכְמַת מֶה לָהֶם
  english_pob_choice: so what wisdom do they have?
  chosen_korean: 무슨 지혜가 있겠습니까?
  alternatives_korean:
  - 그들에게 무슨 지혜가 있습니까?
  - 어떤 지혜가 그들에게 있겠습니까?
  lexicon: HALOT
  rationale: 앞 절의 이유를 받아 논박하는 수사 의문문으로 처리해, 야훼의 말씀을 버린 자들에게 실제 지혜가 없다는 의미를 드러냈습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
