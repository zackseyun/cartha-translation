  lexicon: HALOT
  rationale: 잡히거나 덫에 걸린다는 뜻을 함께 담을 수 있는 표현으로, 판단의 결과로 완전히 제압되는 뉘앙스를 살렸습니다.
- source_word: בִדְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 '야훼'로 옮기고, דָּבָר는 예언문맥에 맞게 '말씀'으로 옮겼습니다.
- source_word: מָאָסוּ
  english_pob_choice: have rejected
  chosen_korean: 버렸으니
  alternatives_korean:
  - 거절했으니
  - 배척했으니
  lexicon: HALOT
  rationale: מאס의 핵심은 단순 비호감이 아니라 권위 있는 거부이므로, 한국어에서는 강한 거절을 뜻하는 '버리다'로 옮겼습니다.
- source_word: וְחָכְמַת מֶה לָהֶם
  english_pob_choice: so what wisdom do they have?
  chosen_korean: 무슨 지혜가 있겠습니까?
  alternatives_korean:
  - 그들에게 무슨 지혜가 있습니까?
  - 어떤 지혜가 그들에게 있겠습니까?
  lexicon: HALOT
  rationale: 앞 절의 이유를 받아 논박하는 수사 의문문으로 처리해, 야훼의 말씀을 버린 자들에게 실제 지혜가 없다는 의미를 드러냈습니다.
