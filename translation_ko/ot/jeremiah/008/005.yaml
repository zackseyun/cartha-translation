  chosen_korean: 돌아서 버렸습니다 / 끊임없이 돌아서 버렸습니다 / 돌아오기를
  alternatives_korean:
  - 배교했습니다 / 배교
  - 되돌아오다
  - 돌이키다
  lexicon: HALOT
  rationale: שוב 계열 반복의 말놀이를 살리기 위해 '돌아서다/돌아오다'를 일관되게 사용하고, 교회어인 '회개하다'는 본문의 반복을 흐릴 수 있어 피했습니다.
- source_word: הֶחֱזִיקוּ בַּתַּרְמִית
  english_pob_choice: They hold fast to deceit
  chosen_korean: 속임수에 굳게 매달려 있으며
  alternatives_korean:
  - 속임수를 굳게 붙들고 있으며
  - 속임수에 집착하며
  lexicon: HALOT
  rationale: חזק의 강한 고착감을 한국어의 '굳게 매달리다'로 옮겨, 단순한 소유가 아니라 의도적 집착을 드러냈습니다.
- source_word: בַּתַּרְמִית
  english_pob_choice: deceit
  chosen_korean: 속임수
  alternatives_korean:
  - 기만
  - 거짓
  lexicon: HALOT
  rationale: תרמית는 기만적 행위를 가리키므로, 자연스러운 현대 한국어로 '속임수'를 택했습니다.
theological_decisions:
- issue: 예루살렘의 문장 내 기능
  chosen_reading: 예루살렘을 '이 백성'과 동격으로 두고 대시로 분리했습니다.
  alternative_readings:
  - '''오 예루살렘''으로 호격 처리'
  - 예루살렘을 번역하지 않고 별도 절로 처리
  rationale: 히브리어는 예루살렘을 직접 호칭하기보다 백성을 규정하는 동격으로 읽는 것이 자연스러워, 본문에 없는 호격을 덧붙이지 않으면서도 독자가 구조를 따라가도록 했습니다.
  doctrine_reference: Translation philosophy item 1
- issue: 마지막 동사의 신학적 해석
  chosen_reading: '''돌아오다''를 유지해 회개의 함의를 암시하되 직접 설교적 용어로 확장하지 않았습니다.'
  alternative_readings:
  - '''회개하다'''
  - '''돌이키다'''
  rationale: 본문은 שוב의 반복을 통해 귀환/복귀의 대비를 강조하므로, 신학적 적용은 남기되 어휘 자체는 원문 반복을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: Translation philosophy items 3 and 5
