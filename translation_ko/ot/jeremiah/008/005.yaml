source:
  edition: WLC
  text: מַדּ֨וּעַ שׁוֹבְבָ֜ה הָ/עָ֥ם הַ/זֶּ֛ה יְרוּשָׁלִַ֖ם מְשֻׁבָ֣ה נִצַּ֑חַת הֶחֱזִ֨יקוּ֙ בַּ/תַּרְמִ֔ית מֵאֲנ֖וּ לָ/שֽׁוּב׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/005.yaml
  text: Why has this people turned away—Jerusalem—with a perpetual turning away? They hold fast to deceit[c][b][a]; they refuse to return.
  footnotes:
  - marker: a
    text: Or 'with an everlasting backsliding' or 'in perpetual apostasy.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew repeats forms of the verb 'turn/return' throughout the verse, contrasting the people's turning away with their refusal to return.
    reason: lexical_alternative
  - marker: c
    text: '''Jerusalem'' may also be taken as a vocative: ''Why has this people turned away, O Jerusalem...?'''
    reason: alternative_reading
translation:
  language: ko
  text: 어찌하여 이 백성, 곧 예루살렘은[c] 끊임없는 돌아섬으로 돌아섰습니까?[a] 그들은 속임수를 굳게 붙들고 있으며, 돌아오기를 거부합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘지속적인 돌아섬으로 돌아섰습니까?’입니다. 히브리어는 ‘돌다/돌아오다’와 관련된 표현을 반복합니다. ‘영속적인 배교’ 또는 ‘끝없는 배반’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 절은 ‘돌다/돌아오다’와 관련된 히브리어 표현을 반복하여, 백성의 돌아섬과 그들이 돌아오기를 거부하는 일을 대조합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘예루살렘’은 호격으로도 읽을 수 있습니다. 곧 ‘어찌하여 이 백성이 돌아섰습니까, 예루살렘아?’라는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַדּוּעַ
