base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/007.yaml
  text: Even the stork in the heavens knows her appointed times, and the turtledove, the swift, and the crane keep the time of their coming; but my people do not know the judgment of the LORD.
translation:
  language: ko
  text: 공중의 황새도 제때를 알고, 산비둘기와 제비와 두루미도 자기들이 올 때를 지키는데, 내 백성은 야훼의 심판을 알지 못합니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 חֲסִידָה는 일반적으로 ‘황새’를 뜻합니다.
    reason: source_note
  - marker: b
    text: 영문 POB의 swift를 반영해 새 이름을 ‘제비’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסִידָה
  english_pob_choice: stork
  chosen_korean: 황새
  alternatives_korean:
  - 학
  - 왜가리
  lexicon: standard zoological/common-bible bird term
  rationale: 히브리어 חֲסִידָה는 일반적으로 ‘황새’를 가리키므로, 한국어에서도 가장 직접적인 대응인 황새를 썼습니다.
- source_word: בַּשָּׁמַיִם
  english_pob_choice: in the heavens
  chosen_korean: 공중의
  alternatives_korean:
  - 하늘의
  - 하늘 가운데의
  lexicon: spatial descriptor
  rationale: 문맥상 새들이 나는 공간을 가리키므로 ‘공중의’가 자연스럽고, 시적 표현도 유지합니다.
- source_word: עוּגָגוּר / תֹר וְסוּס וְעָגוּר
  english_pob_choice: turtledove, the swift, and the crane
  chosen_korean: 산비둘기와 제비와 두루미
  alternatives_korean:
  - 산비둘기와 제비와 학
  - 산비둘기와 칼새와 두루미
  lexicon: bird identifications
  rationale: 영문 POB의 ‘swift’를 반영해 제비로 옮겼고, 마지막 새는 흔한 성경 번역 관례에 따라 두루미로 처리해 한국어 독자의 식별 가능성을 높였습니다.
- source_word: מִשְׁפַּט יְהוָה
  english_pob_choice: the judgment of the LORD
  chosen_korean: 야훼의 심판
  alternatives_korean:
  - 주님의 심판
  - 여호와의 판단
  lexicon: judicial/prophetic term
  rationale: מִשְׁפָּט는 단순한 ‘판단’보다 하나님의 공적 판결·심판을 가리키므로 ‘심판’이 더 정확합니다. YHWH는 프로젝트 기본어인 야훼를 따랐습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문 יהוה를 프로젝트 기본값대로 직접 음역해, 경외적 완곡어보다 स्रोत-대응성을 우선했습니다.
  doctrine_reference: YHWH transliteration policy
- issue: 하나님의 ‘מִשְׁפָּט’의 의미
  chosen_reading: 심판
  alternative_readings:
  - 판단
  - 공의
  rationale: 새들의 본능적 질서와 대비되는 것은 하나님의 판결/심판이므로, 도덕적 추상어보다 예언적 경고의 뉘앙스를 살렸습니다.
  doctrine_reference: prophetic judgment terminology
