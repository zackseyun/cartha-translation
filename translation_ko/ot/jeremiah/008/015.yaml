  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
  footnotes:
  - marker: a
    text: Or 'We waited/expected peace ... a time of healing.' The opening verb can be rendered with the nuance of hoping, waiting, or expecting.
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being or wholeness, not merely the absence of conflict.'
    reason: lexical_alternative
  - marker: c
    text: Or 'dismay' or 'fright' for the final term.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 평강[a][b]을 바랐으나 좋은 일은 없었고, 치유의 때를 바랐으나 보십시오, 공포[c]가 닥쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바랐으나’는 קַוֵּה를 문맥에 따라 옮긴 것입니다. 이 말은 ‘바라다’, ‘기다리다’, 또는 ‘기대하다’로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 שָׁלוֹם의 번역입니다. 이것은 단순히 전쟁이 없는 상태뿐 아니라 안녕과 온전함을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘공포’는 ‘경악’, ‘두려움’ 또는 ‘전율’로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֵּה
  english_pob_choice: We hoped
  chosen_korean: 우리는 평강을 바라았으나
  alternatives_korean:
