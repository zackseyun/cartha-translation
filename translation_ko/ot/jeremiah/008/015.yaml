id: JER.8.15
reference: Jeremiah 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַוֵּ֥ה לְ/שָׁל֖וֹם וְ/אֵ֣ין ט֑וֹב לְ/עֵ֥ת מַרְפֵּ֖ה וְ/הִנֵּ֥ה בְעָתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/015.yaml
  text: We hoped for peace[a], but there was no good; for a time of healing, but behold[c][b], terror.
  footnotes:
  - marker: a
    text: Or 'We waited/expected peace ... a time of healing.' The opening verb can be rendered with the nuance of hoping, waiting, or expecting.
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' (shalom) can also carry the sense of well-being or wholeness, not merely the absence of conflict.'
    reason: lexical_alternative
  - marker: c
    text: Or 'dismay' or 'fright' for the final term.
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 평강을 바라았으나 좋은 것이 없었고, 치유의 때를 바랐으나 보십시오, 공포였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘바라았으나’는 קַוֵּה의 ‘바라다/기다리다/기대하다’ 범위를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 단순한 전쟁 부재보다 안녕과 온전함을 포함하는 שָׁלוֹם의 의미를 함께 담습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘보십시오’는 히브리어 הִנֵּה의 돌연한 제시와 탄식의 충격을 살립니다.
    reason: korean_style_note
lexical_decisions:
- source_word: קַוֵּה
  english_pob_choice: We hoped
  chosen_korean: 우리는 평강을 바라았으나
  alternatives_korean:
  - 우리는 평강을 기다렸으나
  - 우리는 평강을 기대했으나
  lexicon: HALOT
  rationale: 문맥상 집단적 탄식의 과거 회상으로 읽히므로 1인칭 복수로 옮기고, קוה의 ‘바라다/기다리다/기대하다’ 범위를 살려 자연스러운 탄식문으로 표현했습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: for peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  lexicon: HALOT
  rationale: שָׁלוֹם의 기본 뜻인 평강을 택해 단순한 전쟁 부재보다 더 넓은 복원과 안녕의 뉘앙스를 살렸습니다.
- source_word: לְעֵת מַרְפֵּה
  english_pob_choice: for a time of healing
  chosen_korean: 치유의 때를
  alternatives_korean:
  - 회복의 때를
  - 낫게 하시는 때를
  lexicon: HALOT
  rationale: ‘때’라는 시간 표현을 유지하면서 מַרְפֵּה의 치유·회복 의미를 자연스럽게 살리기 위해 ‘치유의 때’로 옮겼습니다.
- source_word: בְעָתָה
  english_pob_choice: terror
  chosen_korean: 공포였습니다
  alternatives_korean:
  - 두려움이었습니다
  - 경악이었습니다
  - 전율이었습니다
  lexicon: HALOT
  rationale: 끝말의 급전환과 절망적 충격을 살리기 위해 ‘공포’로 옮겼고, 서술형 종결을 사용해 앞의 기대와 대조되는 현실을 마무리했습니다.
theological_decisions:
- issue: 예레미야 8:15의 탄식어조와 반전
  chosen_reading: ‘보십시오’는 히브리어 הִנֵּה의 돌연한 제시감을 살리는 감탄형으로 두어, 기대한 평강과 실제의 공포 사이의 급격한 반전을 드러냈습니다.
  alternative_readings:
  - ‘보라’
  - ‘그런데’
  rationale: 본문의 수사적 충격을 약화하지 않으면서 현대 한국어에서 자연스럽고 엄숙한 탄식 어조를 유지하기 위해서입니다.
  doctrine_reference: 예언서 탄식과 심판 선언의 수사
- issue: שָׁלוֹם의 범위
  chosen_reading: ‘평강’은 단순한 분쟁 부재보다 더 넓은 복리·안녕·온전함의 의미를 포함하도록 이해했습니다.
  alternative_readings:
  - 평화
  - 안녕
  rationale: 영어 POB의 주석이 지적하듯 שָׁלוֹם은 포괄적 복원 개념이므로, 한국어에서도 교회 전통어이면서 의미가 넓은 ‘평강’을 택했습니다.
  doctrine_reference: 구약의 샬롬 개념
