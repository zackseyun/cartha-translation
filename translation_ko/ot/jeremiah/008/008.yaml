  text: אֵיכָ֤ה תֹֽאמְרוּ֙ חֲכָמִ֣ים אֲנַ֔חְנוּ וְ/תוֹרַ֥ת יְהוָ֖ה אִתָּ֑/נוּ אָכֵן֙ הִנֵּ֣ה לַ/שֶּׁ֣קֶר עָשָׂ֔ה עֵ֖ט שֶׁ֥קֶר סֹפְרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/008.yaml
  text: How can you say[a], ‘We are wise, and the law of Yahweh is with us’? But look, the lying pen of the scribes has made it into a lie.
  footnotes:
  - marker: a
    text: Or, “Surely, look, the pen of the scribes has made falsehood,” or “the false pen of the scribes has worked falsely.” The Hebrew is compact and allows more than one way of expressing the scribes’ falsification.
    reason: lexical_alternative
translation:
  language: ko
  text: 어떻게 “우리는 지혜롭고 야훼의 율법이 우리와 함께 있다”라고 말할 수 있습니까?[a] 보십시오, 서기관들의 거짓 붓이 그것을 거짓으로 만들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “참으로, 보십시오, 서기관들의 붓이 거짓을 만들어 냈습니다” 또는 “서기관들의 거짓 붓이 거짓되게 행했습니다.” 히브리어는 매우 압축되어 있어 여러 방식으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיכָה
  english_pob_choice: How can
  chosen_korean: 어떻게 …라고 말할 수 있습니까?
  alternatives_korean:
  - 어떻게
  - 어찌
  lexicon: HALOT
  rationale: 분개한 수사 의문을 한국어로 자연스럽게 살리기 위해 ‘어떻게 …라고 말할 수 있습니까?’로 옮겼습니다.
- source_word: תּוֹרַת יְהוָה
  english_pob_choice: the law of Yahweh
  chosen_korean: 야훼의 율법
  alternatives_korean:
  - 야훼의 가르침
  - 주님의 율법
  lexicon: HALOT
  rationale: 예레미야 문맥에서 תורה는 언약적 ‘율법’의 의미가 강하므로 ‘율법’을 유지했고, יְהוָה는 본항 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: לַשֶּׁקֶר … שֶׁקֶר
  english_pob_choice: has made it a lie
  chosen_korean: 거짓으로 만들었습니다
  alternatives_korean:
  - 거짓이 되게 했습니다
  - 거짓으로 만들어 버렸습니다
  lexicon: HALOT
  rationale: פֶּן/서기관들의 행위가 결과적으로 토라를 ‘거짓’으로 바꾸는 뜻을 한국어에서 가장 직접적으로 드러내기 위해 결과 상태를 살렸습니다.
- source_word: עֵט שֶׁקֶר סֹפְרִים
  english_pob_choice: the lying pen of the scribes
  chosen_korean: 서기관들의 거짓된 펜
  alternatives_korean:
  - 서기관들의 거짓 펜
  - 서기관들의 펜, 곧 거짓
  lexicon: HALOT
  rationale: 축약된 히브리어 구조를 따라 ‘펜’을 주어로 두고 ‘거짓된’으로 성격을 밝혔습니다. ‘서기관들’은 조작의 주체를 분명히 합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 번역본의 기준에 따라 여호와 대용을 쓰지 않고, 본문 속 신적 고유명을 직접 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
