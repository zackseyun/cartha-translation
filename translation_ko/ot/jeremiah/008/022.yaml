  source_fidelity: ‘유향’은 일반적으로 frankincense(유향나무 수지)를 뜻하여 히브리어 צֳרִי, 곧 길르앗과 연관된 약용 발삼/수지와 동일시하기 어렵습니다. ‘발삼’이 이 어휘의 약용 수지 의미를 더 정확하게 전달합니다. 나머지 문장은 두 병렬 의문문, ‘왜 그러면’의 추론적 연결, 그리고 ‘내 백성의 딸’이라는 의인화를 충실히 보존합니다.
  naturalness: ‘발삼’은 일상어는 아니지만 이 고유 약재를 정확히 지칭하며, 각주가 의미를 보완하므로 성서 번역의 격식 있는 문맥에서 자연스럽습니다. ‘회복이 이루어지지 않았습니까?’도 현대 합쇼체로 자연스럽습니다.
