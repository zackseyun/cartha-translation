base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
  footnotes:
  - marker: a
    text: Or 'resin' or 'balsam.' The Hebrew term refers to a medicinal gum/resin associated with Gilead.
    reason: lexical_alternative
  - marker: b
    text: Or 'recovery' or 'restoration' for 'the healing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗에 발삼이 없습니까? 거기에 의사가 없습니까? 그런데 왜 내 백성의 딸의 회복이 이루어지지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘약용 수지’로 번역할 수 있습니다. 히브리어 용어는 길르앗과 연결된 약용 발삼 수지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘치유’나 ‘건강의 회복’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  english_pob_choice: balm
  chosen_korean: 유향
  alternatives_korean:
