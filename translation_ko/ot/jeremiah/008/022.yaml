id: JER.8.22
reference: Jeremiah 8:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/צֳרִי֙ אֵ֣ין בְּ/גִלְעָ֔ד אִם רֹפֵ֖א אֵ֣ין שָׁ֑ם כִּ֗י מַדּ֨וּעַ֙ לֹ֣א עָֽלְתָ֔ה אֲרֻכַ֖ת בַּת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/022.yaml
  text: Is there no balm in Gilead? Is there no physician there? Why then has the healing of the daughter of my people not come about?[a][b]
  footnotes:
  - marker: a
    text: Or 'resin' or 'balsam.' The Hebrew term refers to a medicinal gum/resin associated with Gilead.
    reason: lexical_alternative
  - marker: b
    text: Or 'recovery' or 'restoration' for 'the healing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 길르앗에 유향이 없습니까? 거기에 의사가 없습니까? 그런데 왜 내 백성의 딸의 회복이 이루어지지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수지’나 ‘발삼’으로 번역할 수 있습니다. 히브리어 용어는 길르앗과 연결된 약용 수지/향료를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘회복’이나 ‘치유’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֳרִי
  english_pob_choice: balm
  chosen_korean: 유향
  alternatives_korean:
  - 발삼
  - 치유용 수지
  lexicon: HALOT
  rationale: 히브리어 צֳרִי는 길르앗과 연결된 약용 수지/향료를 가리키므로, 한국어에서는 전통적으로도 통하는 '유향'을 택해 약재의 이미지를 살리되 지나치게 기술적으로 만들지 않았습니다.
- source_word: בְּגִלְעָד
  english_pob_choice: in Gilead
  chosen_korean: 길르앗에
  alternatives_korean:
  - 길르앗에 있는
  - 길르앗에서
  lexicon: HALOT
  rationale: 지명은 직역보다 자연스러운 처격으로 처리해, 질문의 공간적 대비를 분명하게 드러냈습니다.
- source_word: רֹפֵא
  english_pob_choice: physician
  chosen_korean: 의사
  alternatives_korean:
  - 치유자
  - 의료인
  lexicon: HALOT
  rationale: 유향과 짝을 이루는 의료 은유를 고려할 때, '의사'가 가장 직접적이고 현대 한국어에서도 자연스럽습니다.
- source_word: אֲרֻכַת
  english_pob_choice: the healing
  chosen_korean: 회복
  alternatives_korean:
  - 치유
  - 낫게 됨
  - 복원
  lexicon: HALOT
  rationale: אֲרֻכָה는 상처나 질병의 회복·치유를 뜻하므로, 결과 상태를 드러내는 '회복'이 문맥에 잘 맞습니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성
  - 내 백성의 딸아
  lexicon: HALOT
  rationale: 예언적 의인화 표현을 평평하게 풀지 않고 그대로 살려, 원문의 애가적 정서와 수사적 힘을 보존했습니다.
theological_decisions:
- issue: ‘딸’로 의인화된 ‘내 백성’ 표현을 평이한 집단명으로 바꿀지 여부
  chosen_reading: 주요 본문에서는 ‘내 백성의 딸’을 유지합니다.
  alternative_readings:
  - 내 백성
  - 내 백성 이스라엘
  rationale: 이 표현은 단순 지시가 아니라 애가와 탄식을 담은 인격화이므로, 평탄화하면 예언자의 정서와 수사적 긴장이 약해집니다.
  doctrine_reference: '번역 원칙: 원문이 가진 문학적·신학적 긴장을 유지하는 최적 대응'
