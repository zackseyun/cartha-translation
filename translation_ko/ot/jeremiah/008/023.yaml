source:
  edition: WLC
  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
  footnotes:
  - marker: a
    text: Or 'If only my head were water, and my eye a spring of tears.' The Hebrew opens with an idiom of longing ('Who will give...?') and uses a singular form for 'eye,' though English often renders it idiomatically as 'eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 내 머리가 물이 되고 내 눈이 눈물의 샘이 되면 좋겠습니다. 그러면 내가 내 백성의 딸의 살해된 자들 때문에 밤낮으로 울겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아, 내 머리가 물이 되고 내 눈이 눈물의 샘이면 좋겠습니다.’ 히브리어는 갈망을 나타내는 관용구(‘누가 주겠느냐?’)로 시작하며, ‘눈’은 단수형이지만 한국어에서는 자연스럽게 복수로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  english_pob_choice: Oh, that ... were
  chosen_korean: 아, ... 되면 좋겠습니다
  alternatives_korean:
  - 아, ...이면 좋겠습니다
  - 누가 ... 주겠습니까
  lexicon: HALOT
  rationale: 히브리어 관용구는 실제 질문이 아니라 강한 바람과 애통을 나타내므로, 한국어에서는 탄식의 감정을 살리는 소망형으로 옮겼습니다.
- source_word: רֹאשִׁי
  english_pob_choice: my head
  chosen_korean: 내 머리
  alternatives_korean:
  - 내 머리통
  - 내 정수리
  lexicon: HALOT
  rationale: 신체 이미지가 문자적으로 쓰였으므로 축약하지 않고 그대로 옮겼습니다.
- source_word: מְקוֹר דִּמְעָה
  english_pob_choice: a fountain of tears
  chosen_korean: 눈물의 샘
  alternatives_korean:
  - 눈물의 원천
  - 눈물의 분수
  lexicon: HALOT
  rationale: מְקוֹר은 샘/분수/근원을 뜻하며, 시적 문맥에서는 ‘샘’이 가장 자연스럽고 ‘눈물’과도 잘 어울립니다.
- source_word: וְאֶבְכֶּה יוֹמָם וָלַיְלָה
  english_pob_choice: so that I might weep day and night
  chosen_korean: 그러면 내가 ... 밤낮으로 울겠습니다
  alternatives_korean:
  - 그리하여 내가 ... 밤낮으로 울겠습니다
  - 밤낮으로 울 수 있겠습니다
  lexicon: HALOT
  rationale: cohortative는 바람의 결과를 나타내므로, 한국어에서는 ‘그러면’으로 이어지는 의지/결과 표현을 사용해 지속적 애도를 드러냈습니다.
- source_word: בַת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 내 백성의 딸
  alternatives_korean:
  - 내 백성
  - 내 백성의 딸아이
  lexicon: HALOT
  rationale: 예언서의 전형적 인격화 표현을 유지해, 공동체를 ‘딸’로 부르는 시적 이미지를 평이하게 드러냈습니다.
theological_decisions:
- issue: בַת עַמִּי의 비유적 인격화를 평이한 의미로 풀지 않을지
  chosen_reading: ‘내 백성의 딸’로 직역에 가깝게 보존합니다
  alternative_readings:
  - 내 백성
  - 내 사랑하는 백성
  rationale: 이 표현은 교리적 용어가 아니라 애가적·예언적 인격화이므로, 이미지를 유지하는 편이 본문의 정서와 문학성을 더 잘 전달합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
