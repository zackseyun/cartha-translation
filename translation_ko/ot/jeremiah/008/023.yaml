revisions:
- from: 아, 내 머리가 물이 되고 내 눈이 눈물의 샘이 되면 좋겠습니다. 그러면 내가 내 백성의 딸의 살해된 자들 때문에 밤낮으로 울겠습니다.[a]
  to: 아, 내 머리가 물이 되고 내 눈이 눈물의 샘이 되어, 내가 내 백성의 딸 가운데 죽임을 당한 이들을 두고 밤낮으로 울 수 있다면 좋겠습니다.[a]
  rationale: 소망을 나타내는 히브리어 관용구와 그에 이어지는 코호르타티브를 하나의 애가적 소망으로 자연스럽게 연결했습니다. 또한 ‘내 백성의 딸’의 시적 인격화는 유지하되, 희생자들을 가리키는 표현을 현대 표준 한국어에 맞게 다듬고 각주와 본문의 관계를 일치시켰습니다.
