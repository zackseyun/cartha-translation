source:
  edition: WLC
  text: מִֽי יִתֵּ֤ן רֹאשִׁ/י֙ מַ֔יִם וְ/עֵינִ֖/י מְק֣וֹר דִּמְעָ֑ה וְ/אֶבְכֶּה֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֵ֖ת חַֽלְלֵ֥י בַת עַמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/023.yaml
  text: Oh[a], that my head were water, and my eyes a fountain of tears, so that I might weep day and night for the slain of the daughter of my people.
  footnotes:
  - marker: a
    text: Or 'If only my head were water, and my eye a spring of tears.' The Hebrew opens with an idiom of longing ('Who will give...?') and uses a singular form for 'eye,' though English often renders it idiomatically as 'eyes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아, 내 머리가 물이 되고 내 눈이 눈물의 샘이 되어, 내가 내 백성의 딸 가운데 죽임을 당한 이들을 두고 밤낮으로 울 수 있다면 좋겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 내 머리를 물로, 내 눈을 눈물의 샘으로 만들어 주겠습니까? 그러면 내가 내 백성의 딸 가운데 죽임을 당한 이들을 두고 밤낮으로 울 수 있겠습니다.’ 히브리어는 실제 질문이 아니라 갈망을 나타내는 관용구(직역하면 ‘누가 주겠느냐?’)로 시작합니다. 히브리어의 ‘눈’은 단수형이며, 한국어의 ‘눈’은 문맥에 따라 양쪽 눈을 함께 가리킬 수 있습니다.
    reason: lexical_alternative
