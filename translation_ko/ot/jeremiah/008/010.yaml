  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֩ אֶתֵּ֨ן אֶת נְשֵׁי/הֶ֜ם לַ/אֲחֵרִ֗ים שְׂדֽוֹתֵי/הֶם֙ לְ/י֣וֹרְשִׁ֔ים כִּ֤י מִ/קָּטֹן֙ וְ/עַד גָּד֔וֹל כֻּלֹּ֖/ה בֹּצֵ֣עַ בָּ֑צַע מִ/נָּבִיא֙ וְ/עַד כֹּהֵ֔ן כֻּלֹּ֖/ה עֹ֥שֶׂה שָּֽׁקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/010.yaml
  text: Therefore I will give their wives to others[a], their fields to those who will possess them; for from the least even to the greatest, every one of them is greedy for unjust gain; from prophet even to priest[c][b], every one of them practices falsehood.
  footnotes:
  - marker: a
    text: Or 'their fields to inheritors/heirs'; the Hebrew verb can mean 'inherit' or 'take possession,' and here likely includes the sense of seizure by new possessors.
    reason: lexical_alternative
  - marker: b
    text: Or 'is greedy for gain'; the Hebrew expression can denote acquisitiveness generally, but in prophetic contexts often implies dishonest or unjust profit.
    reason: lexical_alternative
  - marker: c
    text: Or 'deals falsely' or 'acts deceitfully.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 그들의 아내들을 다른 이들에게[a], 그들의 밭들을 그것들을 차지할 자들에게 주겠습니다. 이는 가장 작은 자로부터 가장 큰 자에 이르기까지 모두가 부정한 이익을 탐하기 때문입니다. 예언자에게서부터 제사장에 이르기까지[b] 모두가 거짓을 행합니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 밭들을 상속자들에게/그것들을 차지할 자들에게’. 히브리어 동사는 ‘상속하다’와 ‘차지하다’를 모두 뜻할 수 있으며, 여기서는 새 점유자에 의한 점거의 뉘앙스가 포함될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘예언자에게서 제사장에게 이르기까지’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘거짓을 다룹니다’/‘속입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그러므로
  lexicon: HALOT
  rationale: 앞선 고발에 대한 논리적·심판적 귀결을 나타내므로, 연결사로서 가장 자연스러운 ‘그러므로’를 택했습니다.
- source_word: לְיוֹרְשִׁים
  english_pob_choice: to those who will possess them
  chosen_korean: 그것들을 차지할 자들에게
  alternatives_korean:
  - 그것들을 상속할 자들에게
  - 그것들을 소유할 자들에게
  - 그것들을 차지할 자들에게
  lexicon: HALOT
  rationale: ירשׁ는 ‘상속하다/차지하다/소유하다’의 범위를 가지지만, 여기서는 단순 상속보다 타인이 점유하게 되는 뜻이 두드러져 ‘차지할 자들’로 옮겼습니다.
- source_word: בֹּצֵעַ בָּצַע
  english_pob_choice: is greedy for unjust gain
  chosen_korean: 부정한 이익을 탐하기
  alternatives_korean:
  - 이익을 탐하기
  - 탐욕을 부리기
  - 부정한 이익을 탐하기
  lexicon: HALOT
  rationale: 동사+명사 결합이 탐욕과 그 불의한 성격을 함께 드러내므로, 단순한 ‘이익’보다 ‘부정한 이익’이 문맥의 도덕적 뉘앙스를 살립니다.
- source_word: עֹשֶׂה שָּׁקֶר
  english_pob_choice: practices falsehood
  chosen_korean: 거짓을 행합니다
  alternatives_korean:
  - 거짓을 행합니다
  - 속임을 일삼습니다
  - 거짓을 저지릅니다
  lexicon: HALOT
  rationale: עשה + שקר는 단발적 거짓말보다 ‘거짓을 행하는’ 지속적 행위를 뜻하므로, 현대 한국어에서도 직설적이고 반복성을 살리는 표현을 택했습니다.
theological_decisions:
- issue: 심판 선언의 성격
  chosen_reading: 여호와께서 아내와 밭을 다른 자들에게 넘기시는 언약적 심판 선언으로 읽었습니다.
  alternative_readings:
  - 전쟁으로 인한 재산 상실을 단순 서술하는 표현으로 읽는 것
  rationale: 1인칭 미래형 ‘내가 주겠다’가 단순 상황 묘사보다 하나님의 사법적 행위를 가리키므로, 그 심판성을 한국어에서도 유지했습니다.
  doctrine_reference: 예레미야의 언약 심판 신탁
