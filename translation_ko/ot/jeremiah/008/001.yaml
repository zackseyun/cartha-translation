revisions:
- from: 그때에, 야훼께서 말씀하십니다. 그들은 유다 왕들의 뼈와 그 고관들의 뼈와 제사장들의 뼈와 예언자들의 뼈와 예루살렘 주민들의 뼈를 그들의 무덤에서 끌어내릴 것입니다.[a]
  to: 그때에 야훼의 말씀입니다. 그들이 유다 왕들의 뼈와 유다의 고관들의 뼈와 제사장들의 뼈와 예언자들의 뼈와 예루살렘 주민들의 뼈를 그들의 무덤에서 끌어낼 것입니다.
  rationale: 이 수정은 동사의 이동 방향을 원문에 맞게 바로잡고, 고관들의 소속을 명시했습니다. 기존 각주에는 본문 이해에 필요한 원어 대안이나 본문상의 불확실성이 제시되지 않았으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:56Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 미지정 복수 주어, 뼈의 반복, 유다의 고관들을 가리키는 소유 관계, 그리고 ‘그들의 무덤에서’라는 출발점을 대체로 충실히 반영했습니다. 그러나 ‘끌어내릴 것입니다’는 ‘내리다’로 분석될 수 있어 히브리어 וְיֹצִיאוּ(무덤에서 밖으로 꺼내다)의 방향과 맞지 않습니다.
  naturalness: ‘그때에 야훼의 말씀입니다’는 נְאֻם יְהוָה에 맞는 자연스럽고 격식 있는 예언 선언 공식입니다. ‘끌어낼 것입니다’로 고치면 현대 표준어 합쇼체에서 의미와 문법이 모두 분명해집니다.
  terminology: ‘야훼’, ‘뼈’, ‘제사장들’, ‘예언자들’, ‘예루살렘 주민들’, ‘무덤’은 적절합니다. שָׂרָיו의 ‘고관들’도 이 문맥에서 가능한 현대적 격식어입니다. 소유 대상을 명확히 하기 위해 ‘유다의 고관들’로 표기했습니다.
  issues:
  - severity: high
    issue: ‘끌어내릴 것입니다’
    rationale: 원문은 무덤 ‘에서’ 뼈를 밖으로 가져오는 행위를 뜻합니다. ‘끌어내리다’는 아래로 이동시키는 뜻으로 이해될 수 있으므로, ‘끌어낼 것입니다’가 원문의 방향과 한국어 용법에 맞습니다.
  - severity: low
    issue: ‘그 고관들’의 선행사 불명확성
    rationale: 히브리어 접미사는 유다를 가리킵니다. ‘유다의 고관들’로 하면 소유 관계가 분명해지며 의미 변화가 없습니다.
  revised_text: 그때에 야훼의 말씀입니다. 그들이 유다 왕들의 뼈와 유다의 고관들의 뼈와 제사장들의 뼈와 예언자들의 뼈와 예루살렘 주민들의 뼈를 그들의 무덤에서 끌어낼 것입니다.
