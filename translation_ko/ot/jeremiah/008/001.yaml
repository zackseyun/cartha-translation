id: JER.8.1
reference: Jeremiah 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֣יא נְאֻם יְהוָ֡ה ו/יציאו אֶת עַצְמ֣וֹת מַלְכֵֽי יְהוּדָ֣ה וְ/אֶת עַצְמוֹת שָׂרָי/ו֩ וְ/אֶת עַצְמ֨וֹת הַ/כֹּהֲנִ֜ים וְ/אֵ֣ת עַצְמ֣וֹת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת עַצְמ֥וֹת יוֹשְׁבֵֽי יְרוּשָׁלִָ֖ם מִ/קִּבְרֵי/הֶֽם־־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/001.yaml
  text: At that time, declares Yahweh, they will bring out the bones of the kings of Judah, the bones of its officials, the bones of the priests, the bones of the prophets, and the bones of the inhabitants of Jerusalem from their graves.
translation:
  language: ko
  text: 그때에, 야훼께서 말씀하십니다. 그들은 유다 왕들의 뼈와 그 고관들의 뼈와 제사장들의 뼈와 예언자들의 뼈와 예루살렘 주민들의 뼈를 그들의 무덤에서 끌어내릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘고관들’은 שָׂרִים의 문맥적 선택으로, 전통적 ‘방백들/지도자들’보다 국가 권력층을 더 분명히 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그때
  lexicon: HALOT
  rationale: 미래의 특정 시점을 여는 예언 공식으로, 한국어에서는 간결한 ‘그때에’가 가장 자연스럽고 지시적 힘도 유지합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼께서 선포하십니다
  lexicon: HALOT
  rationale: 예언자적 선언 공식이므로 존칭 종결을 유지한 ‘말씀하십니다’가 적절하며, 하나님의 이름은 지침대로 ‘야훼’로 옮겼습니다.
- source_word: עַצְמוֹת
  english_pob_choice: bones
  chosen_korean: 뼈
  alternatives_korean:
  - 유해
  - 뼛조각
  lexicon: HALOT
  rationale: 히브리어의 구체적이고 반복적인 표현을 살려 ‘뼈’를 유지했습니다. ‘유해’는 의미를 넓혀 반복의 충격을 약화시킬 수 있습니다.
- source_word: שָׂרָיו
  english_pob_choice: its officials
  chosen_korean: 그 고관들
  alternatives_korean:
  - 그 지도자들
  - 그 관리들
  lexicon: HALOT
  rationale: 문맥상 왕실·국가의 상층 지도층을 가리키므로, 현대 한국어에서 격이 있으면서도 직역성을 해치지 않는 ‘고관들’이 적절합니다.
- source_word: מִקִּבְרֵיהֶם
  english_pob_choice: from their graves
  chosen_korean: 그들의 무덤에서
  alternatives_korean:
  - 그들의 묘에서
  - 그들의 묘지에서
  lexicon: HALOT
  rationale: קבר의 기본 뜻인 ‘무덤’을 살렸고, 출처를 나타내는 조사 ‘에서’로 이동의 방향을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 신명(神名)을 제목성 표현으로 대체하지 않고 직접 표기해, 예언 선언의 인격적·언약적 뉘앙스를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: נְאֻם의 화법
  chosen_reading: 말씀하십니다
  alternative_readings:
  - 선언하십니다
  - 말하십니다
  rationale: 예언문 공식에서 단순 서술보다 신적 발화의 권위를 드러내는 존칭형이 적합하며, 본문은 하나님 직접 화법이므로 합쇼체를 유지했습니다.
  doctrine_reference: '번역 원칙: 직접 화법의 예우 유지'
