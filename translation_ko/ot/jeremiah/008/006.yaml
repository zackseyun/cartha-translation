source:
  edition: WLC
  text: הִקְשַׁ֤בְתִּי וָֽ/אֶשְׁמָע֙ לוֹא כֵ֣ן יְדַבֵּ֔רוּ אֵ֣ין אִ֗ישׁ נִחָם֙ עַל רָ֣עָת֔/וֹ לֵ/אמֹ֖ר מֶ֣ה עָשִׂ֑יתִי כֻּלֹּ֗/ה שָׁ֚ב ב/מרצות/ם כְּ/ס֥וּס שׁוֹטֵ֖ף בַּ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/006.yaml
  text: 'I have paid attention and listened: they do not speak rightly[a]. No man repents of his evil, saying, ‘What have I done?’ Every one turns in his own course[c][b], like a horse rushing into battle.'
  footnotes:
  - marker: a
    text: Or, 'they do not speak what is right.' Literally, 'not thus they speak.'
    reason: lexical_alternative
  - marker: b
    text: '''No man'' renders Hebrew אישׁ, a masculine singular form used here representatively.'
    reason: lexical_alternative
  - marker: c
    text: Or, 'Every one turns to his own running/course.' The Hebrew expression pictures headlong persistence in one's chosen path.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 귀 기울여 들어 보니, 그들은 바르게 말하지 않습니다[a]. 자기 악을 회개하며 ‘내가 무엇을 하였는가?’라고 말하는 사람은 아무도[b] 없습니다. 저마다 전쟁터로 돌진하는 말처럼 자기 길로[c] 되돌아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 바른 것을 말하지 않습니다.’ 직역하면 ‘그들은 그렇게 말하지 않습니다.’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אישׁ은 여기서 대표적으로 쓰인 남성 단수형입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기 달림/행로로.’ 히브리어 표현은 각자가 자신이 택한 길을 거침없이 고수하는 모습을 그립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשַׁבְתִּי וָאֶשְׁמָע
  english_pob_choice: I have paid attention and listened
  chosen_korean: 제가 주의 깊게 살펴듣고 보아도
  alternatives_korean:
  - 제가 주의 깊게 듣고 보아도
  - 제가 귀 기울여 듣고 보아도
  lexicon: HALOT
  rationale: 두 동사의 중첩이 ‘주의 깊은 관찰과 청취’를 함께 드러내므로, ‘살펴듣다’로 청각과 주의를 함께 살렸습니다.
- source_word: לוֹא כֵן יְדַבֵּרוּ
  english_pob_choice: they do not speak rightly
  chosen_korean: 그들은 바르게 말하지 않습니다
  alternatives_korean:
  - 그들은 그렇게 말하지 않습니다
  - 그들은 옳게 말하지 않습니다
  lexicon: HALOT
  rationale: 직역의 ‘그렇게’보다, 문맥상 말의 내용이 부정확하고 옳지 않다는 평가를 드러내기 위해 ‘바르게’로 옮겼습니다.
- source_word: נִחָם עַל רָעָתוֹ
  english_pob_choice: repents of his evil
  chosen_korean: 자기 악에 대해 회개하지 않으면서
  alternatives_korean:
  - 자기 악을 후회하지 않으면서
  - 자기 악을 돌이키지 않으면서
  lexicon: HALOT
  rationale: נחם은 단순 감정보다 죄에 대한 방향 전환을 포함하므로, 여기서는 ‘회개하다’가 가장 직접적으로 대응합니다.
- source_word: בְּמַרְצוֹתָם
  english_pob_choice: in his own course
  chosen_korean: 자기 길로 돌아서기를
  alternatives_korean:
  - 자기 달리는 길로
  - 자기 행로로
  lexicon: HALOT
  rationale: 명사의 뜻은 ‘달림/코스’이지만, 문맥상 무모하게 끝까지 치닫는 진행을 가리키므로 한국어로는 ‘자기 길로 돌아서다’가 그 방향성을 잘 드러냅니다.
- source_word: כְּסוּס שׁוֹטֵף בַּמִּלְחָמָה
  english_pob_choice: like a horse rushing into battle
  chosen_korean: 전쟁 속으로 돌진하는 말처럼
  alternatives_korean:
  - 전쟁으로 내달리는 말처럼
  - 전쟁터로 돌진하는 말처럼
  lexicon: HALOT
  rationale: שוטף는 단순히 달리는 것보다 거세게 밀려드는 역동성을 가지므로 ‘돌진하는 말처럼’이 비유의 힘을 살립니다.
theological_decisions:
- issue: אִישׁ의 대표적 단수 표현
  chosen_reading: ‘아무도’로 뜻을 살리되, 문장 전체는 대표적 단수의 보편성을 유지했습니다.
  alternative_readings:
  - 아무 사람도
  - 어느 누구도
  rationale: 히브리어는 남성 단수 אִישׁ을 쓰지만, 한국어에서는 반복되는 ‘아무도’가 대표성은 유지하면서도 문맥의 자연스러움을 해치지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4 (Gender-accurate over gender-neutral)
- issue: 회개와 자기 성찰의 결합
  chosen_reading: ‘회개하지 않으면서, “내가 무슨 짓을 한 것인가?”라고 말하지 않습니다’로 연결했습니다.
  alternative_readings:
  - ‘후회하지 않으면서’
  - ‘돌이키지 않으면서’
  rationale: 원문의 핵심은 죄에 대한 인정과 방향 전환의 부재이므로, 질문문은 그 결여를 드러내는 자기 고발로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 2 (Source-led sense over ecclesial smoothing)
