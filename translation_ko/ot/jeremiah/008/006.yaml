  source_fidelity: 원문의 화자는 1인칭 단수이며, 두 동사는 ‘주의 깊게 귀 기울여 듣다’라는 뜻입니다. 초안의 ‘제가 … 보아도’는 존칭 주격과 ‘보다’, 양보의 의미를 더합니다. 또한 ‘무슨 짓’은 히브리어의 중립적인 ‘무엇을 하였는가’보다 비난의 뉘앙스가 강합니다. 마지막 절은 각자가 자신의 달림/행로로 되돌아가는 모습을 말하며, 이를 자연스럽게 보존할 필요가 있습니다.
  naturalness: 합쇼체 성경 문체에서는 화자의 1인칭을 ‘내가’로 두고 ‘귀 기울여 들어 보니’로 잇는 것이 자연스럽습니다. ‘회개하지 않으면서 … 말하지 않습니다’보다 ‘회개하며 … 말하는 사람이 없습니다’가 원문의 부정과 발화의 관계를 더 명료하게 드러냅니다.
  terminology: ‘회개하다’는 נִחָם עַל־רָעָתוֹ의 도덕적 후회와 돌이킴의 문맥에 적절합니다. אישׁ의 대표적 남성 단수에 관한 주석은 ‘아무도’에 붙여야 하며, בְּמַרְצוֹתָם의 달림/행로 주석은 ‘자기 길로’에 붙여야 합니다.
