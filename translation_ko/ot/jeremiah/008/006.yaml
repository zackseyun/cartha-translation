revisions:
- from: 제가 주의 깊게 살펴듣고 보아도, 그들은 바르게 말하지 않습니다[a]. 아무도 자기 악에 대해 회개하지 않으면서, ‘내가 무슨 짓을 한 것인가?’라고 말하지 않습니다. 모두가 자기 길로 돌아서기를, 전쟁 속으로 돌진하는 말처럼 합니다[c][b].
  to: 내가 귀 기울여 들어 보니, 그들은 바르게 말하지 않습니다[a]. 자기 악을 회개하며 ‘내가 무엇을 하였는가?’라고 말하는 사람은 아무도[b] 없습니다. 저마다 전쟁터로 돌진하는 말처럼 자기 길로[c] 되돌아갑니다.
  rationale: 원문의 1인칭 화자, 주의 깊은 청취, 회개와 자기 질문의 결여, 그리고 각자의 완고하고 돌진하는 행로라는 흐름을 현대 표준 한국어 합쇼체로 보존했습니다. ‘바르게’는 לוֹא כֵן יְדַבֵּרוּ의 문맥상 평가를 유지하되, 직역 가능성은 각주에 남겼습니다. 각주 표지는 설명 대상 표현에 직접 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:35Z'
