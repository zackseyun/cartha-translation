id: JER.8.21
reference: Jeremiah 8:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל שֶׁ֥בֶר בַּת עַמִּ֖/י הָשְׁבָּ֑רְתִּי קָדַ֕רְתִּי שַׁמָּ֖ה הֶחֱזִקָֽתְ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/008/021.yaml
  text: For the brokenness of the daughter of my people I am broken[a]; I mourn[c][b]; horror has seized me.
  footnotes:
  - marker: a
    text: Or 'Because of the fracture of the daughter of my people, I am shattered.' The Hebrew uses the same root for 'brokenness' and 'I am broken,' creating a deliberate wordplay.
    reason: lexical_alternative
  - marker: b
    text: '''The daughter of my people'' is a prophetic personification of the people of Judah/Israel, preserved here rather than paraphrased away.'
    reason: cultural_note
  - marker: c
    text: Or 'I am darkened' / 'I go about in mourning.' The Hebrew verb carries imagery of darkness associated with grief.
    reason: lexical_alternative
translation:
  language: ko
  text: 백성의 딸의 부서짐 때문에 나도 부서졌습니다[a]; 나는 애통합니다[b][c]; 공포가 나를 사로잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 백성의 딸의 파괴 때문에 나는 산산이 부서졌습니다.’ 히브리어는 ‘부서짐’과 ‘부서졌습니다’에 같은 어근을 사용해 의도적인 말놀이를 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: ‘백성의 딸’은 유다/이스라엘 백성을 가리키는 예언적 의인화 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나는 어두워졌습니다’ / ‘슬픔 속에 다닙니다.’ 히브리어 동사는 비탄과 연결된 어둠의 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל שֶׁבֶר
  english_pob_choice: For the brokenness
  chosen_korean: ~의 부서짐 때문에
  alternatives_korean:
  - ~의 깨어짐 때문에
  - ~의 파괴 때문에
  - ~의 상처 때문에
  lexicon: HALOT
  rationale: עַל은 여기서 원인·계기로 읽히며, שֶׁבֶר의 ‘깨짐/부서짐’ 어근을 살려 원문의 상응어 반복을 한국어에서도 드러내는 표현이 적절합니다.
- source_word: בַּת עַמִּי
  english_pob_choice: the daughter of my people
  chosen_korean: 백성의 딸
  alternatives_korean:
  - 내 백성의 딸
  - 내 백성의 딸이라는 표현
  - 백성의 딸(내 백성)
  lexicon: HALOT
  rationale: 예언서의 의인화 표현을 그대로 보존하되, 한국어에서 자연스럽고 간결하게 들리도록 ‘백성의 딸’로 옮겼습니다.
- source_word: הָשְׁבָּרְתִּי
  english_pob_choice: I am broken
  chosen_korean: 나도 부서졌습니다
  alternatives_korean:
  - 나는 부서졌습니다
  - 나는 산산이 부서졌습니다
  - 나는 깨어졌습니다
  lexicon: HALOT
  rationale: 앞의 שֶׁבֶר과 같은 어근 계열의 말놀이를 살리기 위해 ‘부서졌습니다’를 반복했고, ‘나도’로 원인에 대한 반응성을 드러냈습니다.
- source_word: קָדַרְתִּי
  english_pob_choice: I mourn
  chosen_korean: 나는 애통합니다
  alternatives_korean:
  - 나는 슬퍼합니다
  - 나는 우울합니다
  - 나는 어둡게 됩니다
  lexicon: HALOT
  rationale: 직역 가능한 ‘어두워지다’보다 애가 문맥의 정서를 더 직접적으로 드러내는 ‘애통하다’를 택하되, 비탄의 강도를 유지했습니다.
- source_word: שַׁמָּה הֶחֱזִקַתְנִי
  english_pob_choice: horror has seized me
  chosen_korean: 공포가 나를 사로잡았습니다
  alternatives_korean:
  - 두려움이 나를 붙들었습니다
  - 경악이 나를 덮쳤습니다
  - 공포가 나를 압도했습니다
  lexicon: HALOT
  rationale: שַׁמָּה의 충격적 정서와 חזק의 ‘붙잡다/사로잡다’ 힘을 함께 살리기 위해 ‘사로잡았습니다’를 선택했습니다.
theological_decisions:
- issue: 예언적 의인화 표현 בַּת עַמִּי의 처리
  chosen_reading: ‘백성의 딸’로 직역하여 비유를 보존합니다.
  alternative_readings:
  - ‘내 백성’으로 의역
  - ‘내 백성의 딸’로 더 풀어 옮김
  rationale: 이 표현은 유다/이스라엘 공동체를 딸로 의인화한 시적·예언적 수사이므로, 평범한 집단명으로 풀어버리면 원문의 정서와 상징이 약해집니다.
  doctrine_reference: 예언서의 수사와 공동체 의인화
- issue: 상응어 반복(שֶׁבֶר / הָשְׁבָּרְתִּי)의 보존
  chosen_reading: ‘부서짐 / 부서졌습니다’로 같은 어근을 반복해 말놀이를 드러냅니다.
  alternative_readings:
  - 의미만 살려 ‘깨어짐 / 상처받았습니다’로 다양화
  - 문장 흐름을 위해 반복을 완화
  rationale: 원문은 같은 뿌리의 반복으로 공동체의 파괴와 화자의 동참적 고통을 함께 강조하므로, 한국어에서도 반복을 유지하는 편이 신학적·문학적 힘을 보존합니다.
  doctrine_reference: 예언적 애가의 수사와 공감적 고통
