base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/001.yaml
  text: Yahweh showed me[a], and behold, two baskets of figs were set before the temple of Yahweh, after Nebuchadrezzar king of Babylon had taken into exile Jeconiah son of Jehoiakim, king of Judah, along with the officials of Judah, the craftsmen, and the smiths from Jerusalem[c][b], and had brought them to Babylon.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar''; many English versions use the more familiar spelling ''Nebuchadnezzar.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'the princes of Judah' for 'the officials of Judah.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the metalworkers'; the Hebrew terms likely denote skilled workers taken into exile.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 저에게 보이시니, 보소서, 두 광주리의 좋은 무화과가 여호와의 성전 앞에 놓였나니, 이는 바벨론 왕 느부갓네살이 유다 왕 여고냐의 아들 여고냐와 유다의 관리들과 장인들과 대장장이들을 예루살렘에서 사로잡아 바벨론으로 데려간 후의 일이라.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: ''느부갓네살''; 많은 영어 역본들은 더 익숙한 철자 ''느부카드네자르''를 사용한다.'
    reason: alternative_reading
  - marker: b
    text: 또는 '유다의 왕자들'을 '유다의 관리들'로 번역할 수 있다.
    reason: alternative_reading
  - marker: c
    text: 또는 '금속가공자'; 히브리어 용어는 사로잡혀 간 숙련된 노동자들을 가리키는 것으로 보인다.
    reason: alternative_reading
