revisions:
- from: 야훼께서 이스라엘의 하나님이 이렇게 말씀하십니다. 「이 좋은 무화과들처럼, 내가 유다의 포로들 — 내가 이곳에서 갈대아인의 땅으로 보낸 사람들 — 을 좋게 여기겠습니다.」[a][b]
  to: 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 「이 좋은 무화과들처럼, 내가 이곳에서 갈대아 사람들의 땅으로 보낸 유다의 유배민들을[a] 선을 위하여[b] 좋게 여기겠습니다.」
  rationale: 유배민들을 좋은 무화과에 견주는 비교와 하나님의 호의적 평가를 유지하면서, לְטוֹבָה를 별도로 ‘선을 위하여’로 옮겨 원문의 간결함과 수혜자에 관한 비명시성을 보존했습니다. 각주 표지는 각각 ‘유다의 유배민들’과 ‘선을 위하여’에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
