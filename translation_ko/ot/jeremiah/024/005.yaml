  source_fidelity: 핵심 비교 구조와 유다의 유배민이라는 인격적 지시 대상은 적절합니다. 그러나 לְטוֹבָה(‘선을 위하여/좋게’)를 ‘좋게 여기겠습니다’에 흡수하여, 원문의 별도 목적·결과 표현이 번역문에서 드러나지 않습니다. 또한 이 표현의 수혜자는 히브리어에서 명시되지 않으므로 번역에서도 명시하지 않는 것이 안전합니다.
  naturalness: ‘야훼께서 이스라엘의 하나님이 이렇게 말씀하십니다’는 주격 관계가 어색하므로 ‘야훼, 이스라엘의 하나님께서’로 고쳤습니다. 직접 인용문 안의 긴 삽입 대시는 제거하고 관계절을 자연스러운 한국어 어순으로 재배치했습니다.
  terminology: ‘유다의 유배민들’은 גָּלוּת יְהוּדָה의 집단적·인격적 용법을 현대 한국어에서 ‘포로들’보다 정확하게 나타냅니다. ‘갈대아 사람들의 땅’은 원문의 민족·지리 표지를 보존합니다. 야훼와 하나님은 초안의 용어 선택을 유지했습니다.
