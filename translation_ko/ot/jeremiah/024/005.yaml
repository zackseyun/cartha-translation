source:
  edition: WLC
  text: כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/תְּאֵנִ֥ים הַ/טֹּב֖וֹת הָ/אֵ֑לֶּה כֵּֽן אַכִּ֞יר אֶת גָּל֣וּת יְהוּדָ֗ה אֲשֶׁ֨ר שִׁלַּ֜חְתִּי מִן הַ/מָּק֥וֹם הַ/זֶּ֛ה אֶ֥רֶץ כַּשְׂדִּ֖ים לְ/טוֹבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/005.yaml
  text: 'Thus says Yahweh[a], the God of Israel: Like these good figs, so I will regard the exiles of Judah, whom I sent away from this place to the land of the Chaldeans[b], for good.'
  footnotes:
  - marker: a
    text: Or 'the exile of Judah' or 'the captivity of Judah.' The Hebrew can denote either the exiled people or the state/event of exile; here the personal sense best fits 'whom I sent away.'
    reason: alternative_reading
  - marker: b
    text: Or 'for their good.' The Hebrew simply says 'for good,' leaving the beneficiary implicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 「이 좋은 무화과들처럼, 내가 이곳에서 갈대아 사람들의 땅으로 보낸 유다의 유배민들을[a] 선을 위하여[b] 좋게 여기겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유다의 유배민들’뿐 아니라 ‘유다의 유배’ 또는 ‘유다의 포로 상태’를 뜻할 수도 있습니다. 그러나 뒤따르는 ‘내가 보낸’이라는 관계절은 여기서 사람들을 가리키는 해석에 잘 맞습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘선을 위하여’입니다. 누구의 유익인지는 명시하지 않습니다. 문맥상 ‘그들의 유익을 위하여’로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 영어 POB가 하나님의 이름을 Yahweh로 처리한 점을 따라, 한국어에서도 학술적 음역인 ‘야훼’를 사용해 언약적 신명 표지를 보존했습니다.
- source_word: כַּתְּאֵנִים הַטֹּבוֹת הָאֵלֶּה
  english_pob_choice: Like these good figs
  chosen_korean: 이 좋은 무화과들처럼
  alternatives_korean:
  - 이 좋은 무화과처럼
  - 이 무화과들처럼, 곧 좋은 것들처럼
  lexicon: HALOT
  rationale: 비교 구조를 자연스럽게 살리면서, 지시어 ‘이’와 복수성 ‘들’을 통해 환상 속 무화과들을 구체적으로 드러냈습니다.
- source_word: אַכִּיר
  english_pob_choice: I will regard
  chosen_korean: 좋게 여기겠습니다
  alternatives_korean:
  - 살펴보겠습니다
  - 인정하겠습니다
  - 여기겠습니다
  lexicon: HALOT
  rationale: 단순한 인지보다 평가적·관계적 의미가 강하므로, 하나님이 유다의 포로들을 호의적으로 평가하고 돌보신다는 뉘앙스를 살렸습니다.
- source_word: גָּלוּת יְהוּדָה
  english_pob_choice: the exiles of Judah
  chosen_korean: 유다의 포로들
  alternatives_korean:
  - 유다의 포로 상태
  - 유다의 포로됨
  - 유다의 포로된 사람들
  lexicon: HALOT
  rationale: 영어 POB의 문맥상 인격적 대상 해석을 따르되, 한국어에서는 ‘포로들’이 더 직접적으로 귀환 이전의 강제 이주 공동체를 가리킵니다.
- source_word: שִׁלַּחְתִּי
  english_pob_choice: I sent away
  chosen_korean: 보낸 사람들
  alternatives_korean:
  - 떠나보낸 사람들
  - 쫓아낸 사람들
  - 내가 보낸 사람들
  lexicon: HALOT
  rationale: 히브리어가 하나님의 주권적 파견/내보냄을 나타내므로, 원인 행위를 유지하면서도 한국어 문맥상 자연스럽게 옮겼습니다.
- source_word: אֶרֶץ כַּשְׂדִּים
  english_pob_choice: the land of the Chaldeans
  chosen_korean: 갈대아인의 땅
  alternatives_korean:
  - 갈대아 땅
  - 바벨론 땅
  lexicon: HALOT
  rationale: 출발어의 민족·지리 명칭을 그대로 살려, 본문이 말하는 역사적 장소 표지를 유지했습니다.
- source_word: לְטוֹבָה
  english_pob_choice: for good
  chosen_korean: 좋게
  alternatives_korean:
  - 선을 위해
  - 유익하게
  - 그들의 유익을 위해
  lexicon: HALOT
  rationale: 히브리어의 간결한 목적/결과 표현을 한국어에서 과도하게 풀지 않고, 문맥상 ‘좋은 의도로 대하겠다’는 의미를 살렸습니다.
theological_decisions:
- issue: גָּלוּת יְהוּדָה의 해석
  chosen_reading: 유다의 포로들, 즉 사람들로 이해했습니다.
  alternative_readings:
  - 유다의 포로 상태
  - 유다의 포로됨
  rationale: 바로 뒤의 관계절 ‘내가 이곳에서 … 보낸 사람들’이 인격적 대상을 가리키므로, 추상명사보다 사람을 지칭하는 번역이 문맥에 더 맞습니다.
  doctrine_reference: 문맥 우선의 서술 해석
- issue: לְטוֹבָה의 의미
  chosen_reading: 하나님이 그들을 ‘좋게 여기고’ 선의로 대하신다는 방향으로 옮겼습니다.
  alternative_readings:
  - 그들을 위하여
  - 그들의 유익을 위해
  - 선을 위해
  rationale: 히브리어는 수혜자를 명시하지 않고 간결하게 말하므로, 한국어에서도 목적의 여지를 남기되 하나님이 그들을 선하게 보신다는 점을 드러냈습니다.
  doctrine_reference: 하나님의 주권적 섭리
