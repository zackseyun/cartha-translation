  text: Then Yahweh said to me[a], “What do you see, Jeremiah?” And I said, “Figs—the good figs are very good, and the bad figs are very bad, so bad that they cannot be eaten.”
  footnotes:
  - marker: a
    text: Or, “which cannot be eaten because of their badness.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 제게 말씀하셨습니다. “예레미야야, 네가 무엇을 보느냐?” 제가 대답했습니다. “무화과입니다. 좋은 무화과들은 아주 좋고, 나쁜 무화과들은 아주 나쁘며, 너무 나빠서 먹을 수 없습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너무 나빠서’는 ‘그들의 나쁨 때문에 먹을 수 없다’는 의미를 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
