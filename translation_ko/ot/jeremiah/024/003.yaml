    issue: 인용된 야훼의 질문이 해라체(‘보느냐’)입니다.
    rationale: 지정된 목표 문체가 현대 표준어 합쇼체이므로, 인용문 안의 질문도 ‘보고 있습니까?’로 맞추어 문체 일관성을 확보해야 합니다.
  - severity: low
    issue: 각주가 본문의 대안 독법이 아니라 번역 과정을 설명합니다.
    rationale: 영어 POB의 각주는 ‘나쁨 때문에 먹을 수 없다’라는 보다 직역적인 인과 표현을 대안으로 제시합니다. 한국어 각주도 그 대안을 직접 제시해야 합니다.
  revised_text: 그러자 야훼께서 나에게 말씀하셨습니다. “예레미야야, 네가 무엇을 보고 있습니까?” 내가 대답했습니다. “무화과들입니다. 좋은 무화과들은 아주 좋고, 나쁜 무화과들은 아주 나쁘며, 너무 나빠서 먹을 수 없습니다.”[a]
