id: JER.24.7
reference: Jeremiah 24:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּי֩ לָ/הֶ֨ם לֵ֜ב לָ/דַ֣עַת אֹתִ֗/י כִּ֚י אֲנִ֣י יְהוָ֔ה וְ/הָיוּ לִ֣/י לְ/עָ֔ם וְ/אָ֣נֹכִ֔י אֶהְיֶ֥ה לָ/הֶ֖ם לֵ/אלֹהִ֑ים כִּֽי יָשֻׁ֥בוּ אֵלַ֖/י בְּ/כָל לִבָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/007.yaml
  text: And I will give them a heart to know me[a], that I am Yahweh; and they will be my people, and I will be their God[b], for they will return to me with all their heart.
  footnotes:
  - marker: a
    text: Or 'that I am Yahweh.' The divine name יְהוָה is rendered 'the LORD' in the main text according to project style.
    reason: alternative_reading
  - marker: b
    text: Or 'for they will turn back to me with their whole heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 나를 알 마음, 곧 내가 야훼인 줄 아는 마음을 주겠습니다. 그들은 내 백성이 되고, 나는 그들의 하나님이 되겠습니다. 그들이 온 마음을 다해 내게 돌아올 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתִּי
  english_pob_choice: And I will give
  chosen_korean: 내가 ... 마음을 주겠으니
  alternatives_korean:
  - 내가 ... 주겠고
  - 내가 ... 주겠습니다
  lexicon: HALOT
  rationale: 예언적 약속의 미래 의미를 살리면서, 뒤의 결과절과 자연스럽게 이어지도록 한국어에서는 '마음을 주다'로 옮겼습니다.
- source_word: לֵב
  english_pob_choice: a heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 생각
  lexicon: HALOT
  rationale: 히브리어 לֵב의 내면 전체를 가리키는 의미를 표준적인 한국어 성경 표현인 '마음'으로 옮겨, 인지와 의지의 중심을 함께 드러냈습니다.
- source_word: לָדַעַת אֹתִי
  english_pob_choice: to know me
  chosen_korean: 나를 알도록
  alternatives_korean:
  - 나를 알게 하도록
  - 나를 인식하도록
  lexicon: HALOT
  rationale: 단순 정보 인지가 아니라 언약적·관계적 앎을 나타내므로, 목적을 드러내는 '-도록' 형태로 자연스럽게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본어휘에 따라 신적 고유명은 '야훼'로 옮겨, 호칭 '주'와 구별했습니다.
theological_decisions:
- issue: 언약 공식의 보존
  chosen_reading: '''그들은 내 백성이 되고 나는 그들의 하나님이 될 것입니다''라는 상호 언약 공식을 그대로 유지했습니다.'
  alternative_readings:
  - 소속 관계만 드러내는 풀어쓴 표현
  rationale: 예레미야의 핵심 신학인 언약 귀속을 보존해야 하므로, 익숙한 공식 자체를 유지하는 것이 본문의 뜻을 가장 분명하게 전달합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: '''야훼인 줄 알게''의 지시 내용'
  chosen_reading: '''곧 내가 야훼인 줄 알게''로 옮겨, 앎의 내용이 여호와 하나님의 자기계시임을 분명히 했습니다.'
  alternative_readings:
  - '''내가 주님인 줄 알게'''
  - '''내가 야훼라는 것을 알게'''
  rationale: כִּי אֲנִי יְהוָה는 무엇을 아는지의 내용을 제시하므로, 고유명 '야훼'를 유지해 본문의 직접성을 살렸습니다.
  doctrine_reference: Translation philosophy §1, §3
