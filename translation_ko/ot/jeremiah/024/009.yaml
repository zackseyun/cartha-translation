    rationale: לְזַוֲעָה는 그들 자신이 공포를 느낀다는 뜻보다 다른 이들이 경악하고 떨 대상이 된다는 뜻입니다. ‘경악거리’가 이 객관적 의미를 자연스럽게 드러냅니다.
  revised_text: 내가 그들을 땅의 모든 나라에게 경악거리와 재앙이 되게 하고, 내가 그들을 쫓아내는 모든 곳에서 수치와 속담과 조롱과 저주가 되게 하겠습니다.
