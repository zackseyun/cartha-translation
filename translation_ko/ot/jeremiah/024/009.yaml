    rationale: 원문은 ‘내가 그들을 쫓아내는 모든 곳에서’라는 뜻입니다. שָׁם은 관계절이 가리키는 장소에서의 상태를 나타내며, ‘그곳으로’처럼 추방의 목적지로 옮기지 않습니다.
  - severity: medium
    issue: ‘…되게 하리니 — …될 것이며, …그러할 것입니다’의 혼합 구조
    rationale: 원문의 나열 구조를 불명료하게 만들고 현대 합쇼체 종결을 일관되게 지키지 못합니다.
  - severity: medium
