revisions:
- from: 내가 그들을 땅의 모든 나라들에게 공포와 재앙이 되게 하리니 — 수치와 속담과 조롱과 저주가 될 것이며, 내가 그들을 그곳으로 쫓아낼 모든 곳에서 그러할 것입니다.
  to: 내가 그들을 땅의 모든 나라에게 경악거리와 재앙이 되게 하고, 내가 그들을 쫓아내는 모든 곳에서 수치와 속담과 조롱과 저주가 되게 하겠습니다.
  rationale: ‘그곳으로’와 중복된 결론 표현을 제거하여 원문의 장소 관계절과 병렬 목록을 보존했습니다. ‘경악거리’는 לְזַוֲעָה의 ‘경악의 대상’이라는 의미를 자연스러운 현대 한국어로 드러내며, 나머지 판단 용어는 초안의 대응을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:23:46Z'
