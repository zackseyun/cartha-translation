id: JER.24.9
reference: Jeremiah 24:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְתַתִּי/ם֙ ל/זועה לְ/רָעָ֔ה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ לְ/חֶרְפָּ֤ה וּ/לְ/מָשָׁל֙ לִ/שְׁנִינָ֣ה וְ/לִ/קְלָלָ֔ה בְּ/כָל הַ/מְּקֹמ֖וֹת אֲשֶֽׁר אַדִּיחֵ֥/ם שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/009.yaml
  text: I will make them a horror[a], a calamity, to all the kingdoms of the earth—a reproach, a proverb, a taunt[c][b], and a curse in all the places where I drive them.
  footnotes:
  - marker: a
    text: Or 'an object of horror' for 'a horror.'
    reason: lexical_alternative
  - marker: b
    text: '''A proverb'' may also be rendered ''a byword'' here, since the sense is a saying repeated about them in scorn.'
    reason: lexical_alternative
  - marker: c
    text: Or 'where I banish them.' The verb can mean 'drive away' or 'banish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 땅의 모든 나라에게 경악거리와 재앙이 되게 하고, 내가 그들을 쫓아내는 모든 곳에서 수치와 속담과 조롱과 저주가 되게 하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתַתִּים
  english_pob_choice: I will make them
  chosen_korean: 내가 그들을 … 되게 하리니
  alternatives_korean:
  - 내가 그들을 …로 주리니
  - 내가 그들을 …로 삼으리니
  lexicon: WLC/표준 히브리어 용례
  rationale: נתן의 이 구문은 단순한 ‘주다’가 아니라 어떤 상태나 성격으로 만들어 놓는 뜻이므로, ‘되게 하다’로 원문의 사역적 의미를 살렸습니다.
- source_word: לְזַוֲעָה לְרָעָה
  english_pob_choice: a horror, a calamity
  chosen_korean: 공포와 재앙
  alternatives_korean:
  - 공포와 악
  - 경악거리와 재앙
  lexicon: HALOT
  rationale: 첫 명사는 사람들이 떨며 피하는 대상이라는 점을 살려 ‘공포’로, 둘째는 상황의 파괴성과 재난성을 살려 ‘재앙’으로 옮겼습니다. 영어의 ‘calamity’ 판단을 반영하면서도 히브리어의 병렬 명사구를 자연스럽게 유지합니다.
- source_word: לְחֶרְפָּה וּלְמָשָׁל לִשְׁנִינָה וְלִקְלָלָה
  english_pob_choice: a reproach, a proverb, a taunt, and a curse
  chosen_korean: 수치와 속담과 조롱과 저주
  alternatives_korean:
  - 치욕과 비유와 조롱과 저주
  - 수모와 속담과 비웃음과 저주
  lexicon: HALOT
  rationale: חרפה는 공동체적 수치라는 뜻을 살려 ‘수치’로, משל은 경멸적으로 회자되는 ‘속담/표어’의 뜻을 반영해 ‘속담’으로, שנינה는 조롱 섞인 되풀이 말을 가리키므로 ‘조롱’으로, קללה는 ‘저주’로 옮겼습니다.
- source_word: בְּכָל הַמְּקֹמוֹת אֲשֶׁר אַדִּיחֵם שָׁם
  english_pob_choice: in all the places where I drive them
  chosen_korean: 내가 그들을 그곳으로 쫓아낼 모든 곳에서
  alternatives_korean:
  - 내가 그들을 몰아낼 모든 곳에서
  - 내가 그들을 쫓아보낼 모든 곳에서
  lexicon: HALOT
  rationale: נדח의 사역형은 밀어내고 추방하는 강한 동작을 가리키므로 ‘쫓아내다’로 옮겼습니다. ‘그곳으로’는 장소 지시를 살려 원문의 반복적 공간성을 반영합니다.
theological_decisions:
- issue: 예언적 심판 목록의 형식
  chosen_reading: ‘공포와 재앙… 수치와 속담과 조롱과 저주’처럼 상태·결과를 나열하는 구조를 유지했습니다.
  alternative_readings:
  - ‘공포와 재앙으로 만들겠다’처럼 한 문장으로 풀어 쓰는 방식
  - ‘사람들 사이에서 조롱거리가 되게 하겠다’처럼 의미를 묶는 방식
  rationale: 히브리어는 반복되는 ל-구문으로 수치와 공공연한 오명을 누적합니다. 이를 하나의 설명문으로 평탄화하면 심판의 누적적 수사 효과가 약해지므로, 목록 구조를 그대로 살렸습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
