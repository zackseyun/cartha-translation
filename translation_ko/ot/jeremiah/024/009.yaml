  verdict: revise
  source_fidelity: 원문의 두 병렬 심판 목록과 ‘내가 그들을 쫓아내는’ 하나님의 행위를 유지해야 합니다. 초안의 ‘그곳으로’는 히브리어 שָׁם(그곳에서)의 위치 부사를 목적지처럼 바꾸므로 삭제하는 것이 정확합니다.
  naturalness: 초안은 ‘되게 하리니—될 것이며… 그러할 것입니다’가 한 문장 안에서 시제와 종결법을 혼용하고, ‘그러할 것입니다’의 지시 대상도 불분명합니다. 합쇼체의 한 종결형으로 정리할 필요가 있습니다.
  terminology: לְזַוֲעָה는 단순한 추상명사 ‘공포’보다 사람들이 경악하는 대상이라는 뜻이 드러나는 ‘경악거리’가 더 적절합니다. חרפה, משל, שנינה, קללה는 각각 ‘수치, 속담, 조롱, 저주’로 유지할 수 있습니다.
  issues:
