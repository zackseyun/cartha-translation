  to: 그러나 너무 나빠서 먹을 수 없는 나쁜 무화과들처럼, 야훼께서 말씀하십니다. “내가 유다 왕 시드기야와 그의 관리들, 이 땅에 남아 있는 예루살렘의 남은 자, 그리고 이집트 땅에 거주하는 자들에게 그렇게 하겠습니다.”[a]
