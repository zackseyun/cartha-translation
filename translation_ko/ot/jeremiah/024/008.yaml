source:
  edition: WLC
  text: וְ/כַ/תְּאֵנִים֙ הָֽ/רָע֔וֹת אֲשֶׁ֥ר לֹא תֵאָכַ֖לְנָה מֵ/רֹ֑עַ כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה כֵּ֣ן אֶ֠תֵּן אֶת צִדְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֤ה וְ/אֶת שָׂרָי/ו֙ וְ/אֵ֣ת שְׁאֵרִ֣ית יְרוּשָׁלִַ֗ם הַ/נִּשְׁאָרִים֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/הַ/יֹּשְׁבִ֖ים בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/008.yaml
  text: 'But like the bad figs that cannot be eaten because they are so bad[a], thus says Yahweh: so I will make Zedekiah king of Judah, his officials, the remnant of Jerusalem who remain in this land, and those who dwell in the land of Egypt.'
  footnotes:
  - marker: a
    text: Or, more literally, 'so I will give Zedekiah ...' The Hebrew uses 'give,' with the comparison to the bad figs supplying the sense of being handed over or treated accordingly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너무 나빠서 먹을 수 없는 나쁜 무화과들처럼, 야훼께서 말씀하십니다. “내가 유다 왕 시드기야와 그의 관리들, 이 땅에 남아 있는 예루살렘의 남은 자, 그리고 이집트 땅에 거주하는 자들에게 그렇게 하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내가 시드기야와 …에게 주겠다’에 가깝습니다. 비교 문맥에서는 그들이 그 나쁜 무화과들과 같이 처분될 것이라는 뜻이 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַתְּאֵנִים הָרָעוֹת
  english_pob_choice: But like the bad figs
  chosen_korean: 그러나 먹을 수 없을 만큼 너무 나쁜 무화과들처럼
  alternatives_korean:
  - 그리고 나쁜 무화과들처럼
  - 하지만 나쁜 무화과들처럼
  lexicon: HALOT
  rationale: 앞선 좋은 무화과들과의 대비를 살리기 위해 ‘그러나’로 시작했고, רָעוֹת은 과일의 상태를 가리키므로 도덕화하지 않고 ‘나쁜’으로 옮겼습니다.
- source_word: לֹא תֵאָכַלְנָה מֵרֹעַ
  english_pob_choice: cannot be eaten because they are so bad
  chosen_korean: 먹을 수 없을 만큼 너무 나쁜
  alternatives_korean:
  - 먹을 수 없으므로 너무 나쁜
  - 악해서 먹을 수 없는
  lexicon: HALOT
  rationale: 히브리어는 ‘먹히지 않는다’는 불가식성의 이유를 붙이므로, 자연스러운 한국어로 원인 관계를 살려 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신적 고유명사를 직역 관행이 아닌 음역으로 유지해, 제목인 ‘주’와 구별되는 이름으로 드러냈습니다.
- source_word: כֵּן אֶתֵּן
  english_pob_choice: so I will make
  chosen_korean: 내가 ... 그렇게 하겠습니다
  alternatives_korean:
  - 내가 ... 주겠습니다
  - 내가 ... 넘기겠습니다
  lexicon: HALOT
  rationale: 단순한 ‘주다’보다 심판적 처분의 뜻이 강하므로, 비교절의 함의를 살려 ‘그렇게 하겠습니다’로 자연스럽게 처리했습니다.
- source_word: שָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 방백들
  - 그의 지도자들
  lexicon: HALOT
  rationale: שָׂרִים은 왕궁/국가의 통치 인물들을 가리키므로, 현대 독자가 이해하기 쉬운 ‘관리들’을 선택했습니다.
- source_word: שְׁאֵרִית יְרוּשָׁלִַם
  english_pob_choice: the remnant of Jerusalem
  chosen_korean: 예루살렘의 남은 자
  alternatives_korean:
  - 예루살렘의 남은 무리
  - 예루살렘의 잔존자
  lexicon: HALOT
  rationale: 예언서의 정형 표현인 ‘남은 자’는 종말론적·신학적 울림을 유지하면서도 한국어에서 충분히 통용됩니다.
- source_word: בְּאֶרֶץ מִצְרָיִם
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에 거주하는 자들
  alternatives_korean:
  - 이집트 땅에 사는 자들
  - 이집트에 사는 자들
  lexicon: HALOT
  rationale: ‘거주하는’은 히브리어 분사의 지속적 상태를 살리며, ‘땅’은 원문 지리 표현을 보존합니다.
theological_decisions:
- issue: 야훼의 직접 화법 표지와 문장 흐름
  chosen_reading: 직접 인용 앞뒤를 쉼표와 대시로 나누어 ‘야훼께서 말씀하십니다’가 예언적 선언의 화자 전환을 분명히 드러내게 했습니다.
  alternative_readings:
