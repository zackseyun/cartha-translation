source:
  edition: WLC
  text: וְ/שִׁלַּ֣חְתִּי בָ֔/ם אֶת הַ/חֶ֖רֶב אֶת הָ/רָעָ֣ב וְ/אֶת הַ/דָּ֑בֶר עַד תֻּמָּ/ם֙ מֵ/עַ֣ל הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/הֶ֖ם וְ/לַ/אֲבוֹתֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/010.yaml
  text: And I will send against them the sword[a], the famine, and the pestilence, until they are consumed from the land that I gave to them and to their fathers.
  footnotes:
  - marker: a
    text: Or 'the plague.' The Hebrew term can denote epidemic disease more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들에게 칼과 기근과 전염병을 보내어, 그들이 내가 그들과 그들의 조상들에게 준 땅에서 소멸되게 하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역병’. 히브리어는 더 넓게 유행성 질병을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּחְתִּי
  english_pob_choice: And I will send
  chosen_korean: 내가 … 보내어
  alternatives_korean:
  - 내가 … 보내겠습니다
  - 내가 … 파견하겠습니다
  lexicon: HALOT
  rationale: 심판 문맥의 שׁלח는 대상을 ‘보내다/보내어’로 옮기는 것이 가장 자연스럽고, 주어인 하나님의 능동적 행위를 분명히 드러냅니다.
- source_word: בָם
  english_pob_choice: against them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들에게
  - 그들 가운데
  lexicon: HALOT
  rationale: 전쟁·심판 동사와 함께 쓰인 בָם의 적대적 방향성을 한국어에서는 ‘~위에’로 살리면 ‘against’의 압박감이 유지됩니다.
- source_word: הַחֶרֶב / הָרָעָב / הַדָּבֶר
  english_pob_choice: the sword / the famine / the pestilence
  chosen_korean: 칼 / 기근 / 전염병
  alternatives_korean:
  - 칼 / 굶주림 / 역병
  - 전쟁 / 기근 / 역병
  lexicon: HALOT
  rationale: 예언서의 정형화된 심판 삼중항을 따르되, חֶרֶב은 관용적 ‘전쟁’보다 직역에 가까운 ‘칼’로, דָּבֶר은 POB의 주석 취지를 반영해 광범위한 질병을 뜻하는 ‘전염병’으로 옮겼습니다.
- source_word: עַד תֻּמָּם
  english_pob_choice: until they are consumed
  chosen_korean: 그들이 소멸될 때까지
  alternatives_korean:
  - 그들이 다할 때까지
  - 그들이 끝날 때까지
  lexicon: HALOT
  rationale: תָּמַם의 완료·소진 의미를 심판 문맥에 맞게 ‘소멸되다’로 옮겨, 단순한 종료보다 파괴적 종결을 드러냅니다.
- source_word: מֵעַל הָאֲדָמָה
  english_pob_choice: from the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅 위에서
  - 땅 위로부터
  lexicon: HALOT
  rationale: מֵעַל의 문자적 ‘위에서/로부터’는 한국어에서 자연스럽게 ‘땅에서’로 풀어도 원문의 방향성은 유지되며, 과도한 직역 어색함을 피합니다.
theological_decisions:
- issue: 조상에게 준 땅이라는 언약적 표현
  chosen_reading: 내가 그들과 그들의 조상들에게 준 땅
  alternative_readings:
  - 내가 그들과 그들의 조상들에게 주신 땅
  - 내가 그들과 그들의 선조들에게 준 땅
  rationale: אֲבוֹתֵיהֶם은 언약사 속 ‘조상들’을 가리키는 표준적 표현이므로, 성별 중립화보다 원문의 역사적·언약적 구체성을 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§4–5
