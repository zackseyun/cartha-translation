    rationale: לְטוֹבָה는 여기서 그들에게 유익이 되도록 하는 호의적 목적을 나타냅니다. 초안 표현은 ‘눈’이 복이 된다는 듯이 읽힐 수 있고, ‘눈을 … 위에 두다’도 현대 한국어에서 부자연스럽습니다.
  - severity: low
    issue: 각주 b의 위치
    rationale: ‘이 땅에 회복시키겠습니다’라는 대안은 귀환 동사구에 붙이는 것이 독자의 이해와 앵커 기능에 더 정확합니다.
