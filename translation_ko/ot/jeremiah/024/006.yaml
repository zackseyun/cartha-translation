- from: 내가 그들에게 복이 되도록 내 눈을 그들 위에 두고, 그들을 이 땅으로 돌아오게 하며, 그들을 세워 무너지게 하지 않고, 그들을 심어 뽑아버리지 않겠습니다.[a][b][c]
  to: 내가 그들의 유익을 위하여[a] 그들에게 내 눈을 두겠습니다. 내가 그들을 이 땅으로 돌아오게 하겠습니다.[b] 내가 그들을 세우고 허물지 않으며, 심고 뽑지 않겠습니다.[c]
  rationale: 히브리어 관용구 ‘그들에게 내 눈을 두다’의 이미지는 보존하되, לְטוֹבָה의 목적을 ‘그들의 유익을 위하여’로 명료하게 했습니다. 또한 ‘세우다/허물다’와 ‘심다/뽑다’의 능동적이고 대칭적인 회복 은유를 원문에 맞게 바로잡았습니다. 역사적 귀환과 ‘이 땅’의 지시도 유지했으며, 교리적 해석을 추가하지 않았습니다.
