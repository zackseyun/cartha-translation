source:
  edition: WLC
  text: וְ/שַׂמְתִּ֨י עֵינִ֤/י עֲלֵי/הֶם֙ לְ/טוֹבָ֔ה וַ/הֲשִׁבֹתִ֖י/ם עַל הָ/אָ֣רֶץ הַ/זֹּ֑את וּ/בְנִיתִי/ם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וּ/נְטַעְתִּ֖י/ם וְ/לֹ֥א אֶתּֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/024/006.yaml
  text: I will set my eyes on them for good[a], and I will bring them back to this land. I will build them up and not tear them down[c][b]; I will plant them and not uproot them.
  footnotes:
  - marker: a
    text: Or 'for their good.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will restore them to this land.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew uses paired restoration metaphors: ''build ... not tear down'' and ''plant ... not uproot.'''
    reason: cross_reference
translation:
  language: ko
  text: 내가 그들에게 복이 되도록 내 눈을 그들 위에 두고, 그들을 이 땅으로 돌아오게 하며, 그들을 세워 무너지게 하지 않고, 그들을 심어 뽑아버리지 않겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 선을 위해’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그들을 이 땅에 회복시키겠습니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘세우다 … 허물지 않다’와 ‘심다 … 뽑지 않다’라는 짝을 이룬 회복 은유를 사용합니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְשַׂמְתִּי עֵינִי עֲלֵיהֶם
  english_pob_choice: I will set my eyes on them
  chosen_korean: 내가 … 내 눈을 그들 위에 두고
  alternatives_korean:
  - 그들을 주목하고
  - 그들을 살피고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 관찰보다 보호와 호의의 시선을 뜻하므로, ‘눈을 … 위에 두다’라는 이미지를 살리면서 자연스럽게 옮겼습니다.
- source_word: לְטוֹבָה
  english_pob_choice: for good
  chosen_korean: 복이 되도록
  alternatives_korean:
  - 선을 위해
  - 그들의 유익을 위해
  lexicon: HALOT
  rationale: 전치사 לְ와 טוֹבָה는 유익·선의 목적을 나타내므로, 단순한 결과 진술보다 하나님의 호의적 의도를 드러내는 표현을 택했습니다.
- source_word: וַהֲשִׁבֹתִים עַל הָאָרֶץ הַזֹּאת
  english_pob_choice: I will bring them back to this land
  chosen_korean: 그들을 이 땅으로 돌아오게 하며
  alternatives_korean:
  - 그들을 이 땅으로 되돌리며
  - 그들을 이 땅에 회복시키며
  lexicon: HALOT
  rationale: שוב의 히필은 ‘돌아오게 하다’의 사역형이므로, 포로 귀환의 공간적 의미를 분명히 하는 ‘돌아오게 하다’를 사용했습니다.
- source_word: וּבְנִיתִים וְלֹא אֶהֱרֹס
  english_pob_choice: I will build them up and not tear them down
  chosen_korean: 그들을 세워 무너지게 하지 않고
  alternatives_korean:
  - 그들을 세우고 허물지 않고
  - 그들을 세워 무너뜨리지 않고
  lexicon: HALOT
  rationale: בנה/הרס의 예언적 대조를 한국어에서도 살리기 위해 ‘세우다/무너지게 하다’의 대응을 선택했습니다. ‘무너뜨리다’보다 수동적 결과를 포함하는 ‘무너지게 하다’가 본문의 완곡한 대조에 더 가깝습니다.
- source_word: וּנְטַעְתִּים וְלֹא אֶתּוֹשׁ
  english_pob_choice: I will plant them and not uproot them
  chosen_korean: 그들을 심어 뽑아버리지 않겠습니다
  alternatives_korean:
  - 그들을 심고 뽑지 않겠습니다
  - 그들을 심어 뿌리째 뽑지 않겠습니다
  lexicon: HALOT
  rationale: 농업 은유를 그대로 유지하기 위해 ‘심다/뽑아버리다’를 사용했고, נתש의 강한 제거 의미를 살리기 위해 단순한 ‘뽑다’보다 ‘뽑아버리다’를 택했습니다.
theological_decisions:
- issue: 회복 약속의 범위
  chosen_reading: 이 절을 포로 귀환과 땅의 회복에 대한 구체적 약속으로 읽고, 영적·교회론적 의미를 본문에 직접 덧씌우지 않았습니다.
  alternative_readings:
  - 일반적인 번영 약속
  - 순전히 영적인 회복
  rationale: 문맥상 대상은 유배된 자들이며, ‘이 땅’과 ‘돌아오게 하다’가 역사적·지리적 회복을 분명히 가리킵니다. 그래서 본문의 1차 의미를 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
