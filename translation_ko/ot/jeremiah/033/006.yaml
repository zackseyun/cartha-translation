id: JER.33.6
reference: Jeremiah 33:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֧י מַעֲלֶה לָּ֛/הּ אֲרֻכָ֥ה וּ/מַרְפֵּ֖א וּ/רְפָאתִ֑י/ם וְ/גִלֵּיתִ֣י לָ/הֶ֔ם עֲתֶ֥רֶת שָׁל֖וֹם וֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/006.yaml
  text: Behold[a], I am bringing her healing and cure, and I will heal them, and I will reveal to them an abundance of peace and truth.
  footnotes:
  - marker: a
    text: Or 'faithfulness' for 'truth' (אֱמֶת); the term can denote truthfulness, reliability, or faithfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 그 성읍에 치료와 치유를 가져오며, 그들을 고치고 평강과 진리의 풍성함을 그들에게 드러내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘신실함’; 히브리어 אֱמֶת은 진리, 신실함, 신뢰성을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 예언적 선포의 엄숙한 도입을 살리기 위해 감탄적 호명보다 공적이고 문어적인 ‘보십시오’를 택했습니다.
- source_word: מַעֲלֶה לָּהּ
  english_pob_choice: I am bringing her
  chosen_korean: 그 성읍에 … 가져오며
  alternatives_korean:
  - 그녀에게 … 가져오며
  - 그 성읍에게 … 올리며
  lexicon: HALOT
  rationale: 여성 단수 대명사는 문맥상 예루살렘을 가리키는 의인화된 성읍이므로, 한국어에서는 자연스럽게 ‘그 성읍’으로 풀어 그 지시 대상을 드러냈습니다.
- source_word: אֲרֻכָה וּמַרְפֵּא
  english_pob_choice: healing and cure
  chosen_korean: 치료와 치유
  alternatives_korean:
  - 회복과 치료
  - 고침과 치료
  lexicon: HALOT
  rationale: 두 명사가 가까운 의미이지만 병치된 어감을 살리기 위해 중복을 완전히 피하기보다 의료적 어휘쌍인 ‘치료와 치유’를 선택했습니다.
- source_word: וּרְפָאתִים
  english_pob_choice: and I will heal them
  chosen_korean: 그들을 고치고
  alternatives_korean:
  - 그들을 치유하고
  - 그들을 회복시키고
  lexicon: HALOT
  rationale: 3인칭 복수 목적어는 성읍이 아니라 그 안의 사람들을 가리키므로 ‘그들을’로 유지했고, 동사는 한국어에서 가장 직접적인 ‘고치다’로 옮겼습니다.
- source_word: עֲתֶרֶת שָׁלוֹם וֶאֱמֶת
  english_pob_choice: an abundance of peace and truth
  chosen_korean: 평강과 진리의 풍성함
  alternatives_korean:
  - 평화와 진리의 풍성함
  - 평강과 진실의 풍성함
  lexicon: HALOT
  rationale: ‘עֲתֶרֶת’를 단순 형용사로 펴기보다 ‘풍성함’으로 옮겨 ‘peace and truth’에 걸리는 명사의 힘을 살렸고, ‘truth’는 기본값인 ‘진리’로 두었습니다.
theological_decisions:
- issue: 도시(여성 단수)에서 사람들(복수)로의 지시 대상 전환
  chosen_reading: ‘그 성읍’과 ‘그들을’의 차이를 유지해, 의인화된 도시와 그 주민들을 구분했습니다.
  alternative_readings:
  - 모두를 성읍 하나로 평준화하여 옮김
  - 모두를 주민들로 풀어 의인화를 약화함
  rationale: 히브리어는 여성 단수 도시를 말하다가 복수 주민으로 전환하므로, 이 전환을 한국어에서도 드러내는 편이 본문 이미지를 보존합니다.
  doctrine_reference: Translation philosophy §5 (일관성 및 문맥상 예외 허용)
- issue: אֱמֶת의 의미 범위
  chosen_reading: 본문에서는 ‘진리’를 유지하고, 대안적 뉘앙스는 각주로 남깁니다.
  alternative_readings:
  - 신실함
  - 신뢰성
  rationale: 이 단어는 진리, 신실함, 신뢰성을 모두 가질 수 있으므로, 본문에서는 가장 직접적인 ‘진리’를 택하되 의미의 긴장을 없애지 않기 위해 각주를 달았습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장 보존)
