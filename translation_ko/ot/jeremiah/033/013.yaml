id: JER.33.13
reference: Jeremiah 33:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/עָרֵ֨י הָ/הָ֜ר בְּ/עָרֵ֤י הַ/שְּׁפֵלָה֙ וּ/בְ/עָרֵ֣י הַ/נֶּ֔גֶב וּ/בְ/אֶ֧רֶץ בִּנְיָמִ֛ן וּ/בִ/סְבִיבֵ֥י יְרוּשָׁלִַ֖ם וּ/בְ/עָרֵ֣י יְהוּדָ֑ה עֹ֣ד תַּעֲבֹ֧רְנָה הַ/צֹּ֛אן עַל יְדֵ֥י מוֹנֶ֖ה אָמַ֥ר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/013.yaml
  text: In the cities of the hill country[a], in the cities of the lowland, and in the cities of the Negeb, and in the land of Benjamin, and around Jerusalem, and in the cities of Judah, the flocks will again pass under the hands of the one who counts them[c][b], says Yahweh.
  footnotes:
  - marker: a
    text: Or 'the Shephelah,' the Judean foothill region.
    reason: lexical_alternative
  - marker: b
    text: Or 'the South'; Hebrew 'the Negeb,' a southern region of Judah.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew literally says 'under the hands of the one who counts,' preserving the image of a shepherd counting livestock as they pass by.
    reason: cultural_note
translation:
  language: ko
  text: 산지의 여러 성읍들, 저지대의 여러 성읍들, 네겝의 여러 성읍들, 베냐민의 땅과 예루살렘 주변과 유다의 여러 성읍들에서, 양 떼가 다시 그것들을 세는 자의 손 아래를 지나가게 될 것입니다. 야훼께서 말씀하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산지’는 유다의 산지/고지대 지역을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘네겝’은 유다 남부의 지역명이며, 문자적으로는 ‘남쪽’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘세는 자의 손 아래’를 말해, 목자가 가축을 세거나 점검하는 이미지를 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בְּעָרֵי הָהָר
  english_pob_choice: in the cities of the hill country
  chosen_korean: 산지의 여러 성읍들
  alternatives_korean:
  - 산악 지역의 성읍들
  - 산지 성읍들
  lexicon: HALOT
  rationale: הָהָר는 단일 산이 아니라 유다의 산지/고지대를 가리키므로, ‘산지’로 지역성을 살렸습니다. עָרִים는 반복되는 지리 공식의 흐름을 따라 ‘성읍들’로 옮겼습니다.
- source_word: הַשְּׁפֵלָה
  english_pob_choice: the lowland
  chosen_korean: 저지대
  alternatives_korean:
  - 세펠라
  - 평지
  lexicon: HALOT
  rationale: 유다의 저지대 지역을 가리키므로, 독자가 바로 이해할 수 있는 ‘저지대’를 택했습니다. 음역형 ‘세펠라’도 가능하지만 본문 가독성은 떨어집니다.
- source_word: הַנֶּגֶב
  english_pob_choice: the Negeb
  chosen_korean: 네겝
  alternatives_korean:
  - 남방
  - 남쪽 지역
  lexicon: HALOT
  rationale: 고유한 지명으로서 지역명 힘을 보존하기 위해 ‘네겝’을 음역했습니다. 문맥상 단순한 방향어보다 지리적 명칭이 더 적절합니다.
- source_word: עַל יְדֵי מוֹנֶה
  english_pob_choice: under the hands of the one who counts them
  chosen_korean: 그것들을 세는 자의 손 아래를
  alternatives_korean:
  - 세는 자의 손에 의해
  - 세는 자 앞을
  lexicon: HALOT
  rationale: ‘손 아래’라는 신체적 이미지를 유지해 목자가 양을 세는 장면을 드러냈습니다. 영어 POB가 보존한 관용구의 구체성을 한국어에서도 살렸습니다.
theological_decisions:
- issue: 여호와 이름의 표기
  chosen_reading: יהוה를 야훼로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 칭호가 아니라 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 표기해 언약 이름을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
