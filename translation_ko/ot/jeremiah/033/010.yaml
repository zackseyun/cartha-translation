base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/010.yaml
  text: 'Thus says the LORD: Yet in this place, of which you say, ‘It is a waste, without man or beast,’ in the cities of Judah and in the streets of Jerusalem that are desolate, without man or inhabitant or beast, there shall again be heard'
translation:
  language: ko
  text: 여호와께서 이와 같이 말씀하십니다. “너희가 ‘이곳은 사람도 짐승도 없는 황폐한 곳이다’라고 말하는 바로 이곳과, 유다의 성읍들과 예루살렘 거리들 가운데 다시 사람도 거주자도 짐승도 없이 황폐해진 곳에서, 다시 한 번 소리가 들릴 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חָרֵב는 ‘황폐한/폐허가 된’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거주자’는 히브리어 יוֹשֵׁב(거주하는 사람)를 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says the LORD
  chosen_korean: 여호와께서 이와 같이 말씀하십니다
  alternatives_korean:
  - 주께서 이와 같이 말씀하십니다
  - 야훼께서 이와 같이 말씀하십니다
  lexicon: יהוה
  rationale: 본문의 신명(יהוה)은 예언 공식으로서 한국어 본문에서는 직접 호칭을 드러내되, 구약 서술의 관용을 고려해 본문은 통용성이 높은 ‘여호와’를 택했습니다.
- source_word: חָרֵב הוּא
  english_pob_choice: It is a waste
  chosen_korean: 황폐한 곳이다
  alternatives_korean:
  - 폐허다
  - 버려진 땅이다
  - 황무지다
  lexicon: חרב
  rationale: 문맥상 인적·가축적 부재를 가리키는 ‘황폐함’을 살리되, POB의 ‘a waste’보다 한국어에서는 자연스러운 명사구로 풀었습니다.
- source_word: מֵאֵין אָדָם וּמֵאֵין בְּהֵמָה ... מֵאֵין יוֹשֵׁב
  english_pob_choice: without man or beast ... without man or inhabitant or beast
  chosen_korean: 사람도 짐승도 없이 ... 사람도 거주자도 짐승도 없이
  alternatives_korean:
  - 사람도 가축도 없이 ... 사람도 주민도 가축도 없이
  - 인간도 짐승도 없이 ... 인간도 거주민도 짐승도 없이
  lexicon: מֵאֵין + noun
  rationale: 반복되는 부정 표현을 한국어의 나열 구조로 옮겨, ‘없는’ 상태의 총체성을 유지했습니다. ‘거주자’는 יוֹשֵׁב의 동사성 뉘앙스를 살린 번역입니다.
theological_decisions:
- issue: 여호와 신명 표기
  chosen_reading: 본문에는 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 구약 예언 공식에서 독자가 즉시 인식할 수 있는 전통적 표기를 우선하되, 본문 의미를 흐리지 않도록 직접 호칭을 유지했습니다.
  doctrine_reference: YHWH proper name rendering policy
