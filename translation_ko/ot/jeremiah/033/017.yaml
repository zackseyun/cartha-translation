base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/017.yaml
  text: 'For thus says Yahweh: David shall never lack a man to sit on the throne of the house of Israel[a][b].'
  footnotes:
  - marker: a
    text: Literally, 'there shall not be cut off for David a man sitting on the throne of the house of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or simply, 'on the throne of Israel.' The Hebrew reads 'the house of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼께서 이렇게 말씀하시기 때문입니다. “다윗에게는 이스라엘 집의 왕좌에 앉을 사람이 결코 끊어지지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘다윗을 위하여 이스라엘 집의 왕좌에 앉아 있는 사람이 끊어지지 않을 것이다’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר יְהוָה
  english_pob_choice: For thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 야훼께서 이렇게 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 선포 공식을 한국어 합쇼체로 자연스럽게 옮기되, יְהוָה는 프로젝트 기본값에 따라 야훼로 유지했습니다.
- source_word: לֹא יִכָּרֵת
  english_pob_choice: shall never lack
  chosen_korean: 결코 … 끊어지지 않을 것입니다
  alternatives_korean:
  - 결코 … 없어지지 않을 것입니다
  - 결코 … 잘려 나가지 않을 것입니다
  lexicon: HALOT
  rationale: 직역의 ‘끊어지다/잘려 나가다’ 의미를 살리면서도, 다윗의 계보적 지속이라는 관용적 뜻이 드러나도록 한국어 자연성을 함께 고려했습니다.
- source_word: אִישׁ יֹשֵׁב
  english_pob_choice: a man to sit
  chosen_korean: 한 사람이 앉을
  alternatives_korean:
  - 한 남자가 앉을
  - 앉아 있을 한 사람이
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 אישׁ을 ‘사람’으로 옮기되, 왕위에 앉는다는 왕적 기능을 한국어 서술로 분명히 했습니다.
- source_word: עַל כִּסֵּא בֵית יִשְׂרָאֵל
  english_pob_choice: on the throne of the house of Israel
  chosen_korean: 이스라엘의 왕좌에
  alternatives_korean:
  - 이스라엘 집의 왕좌에
  - 이스라엘 가문의 왕좌에
  lexicon: HALOT
  rationale: ‘집/가문’(בית)을 한국어 왕조 표현인 ‘왕좌’ 문맥으로 풀어 읽기 쉽게 했고, 본문의 ‘house of Israel’은 주석 없이 과도하게 직역하지 않았습니다.
theological_decisions:
- issue: 다윗 왕조의 지속성과 메시아적 함의
  chosen_reading: 본문의 약속을 다윗 계열의 지속적 왕권으로 그대로 두어, 즉각적 역사적 계승과 궁극적 메시아 성취 중 어느 한쪽으로 본문을 과도하게 한정하지 않았습니다.
  alternative_readings:
  - 이르러질 최종 메시아 한 분만을 가리킨다는 독법
  - 순수한 역사적 왕조 보장으로만 보는 독법
  rationale: 히브리어는 ‘다윗에게 한 사람이 끊어지지 않는다’는 왕조적 진술을 하고 있으므로, 번역문은 그 긴장을 보존하는 것이 가장 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
