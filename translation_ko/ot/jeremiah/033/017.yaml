revisions:
- from: 야훼께서 이렇게 말씀하십니다. “다윗에게는 결코 이스라엘의 왕좌에 앉을 한 사람이 끊어지지 않을 것입니다.”[a][b]
  to: 이는 야훼께서 이렇게 말씀하시기 때문입니다. “다윗에게는 이스라엘 집의 왕좌에 앉을 사람이 결코 끊어지지 않을 것입니다.”[a]
  rationale: 수정문은 כִּי의 논리적 연결을 ‘이는’으로 반영하고, לֹא יִכָּרֵת לְדָוִד אִישׁ의 관용구를 ‘다윗에게는 … 사람이 결코 끊어지지 않을 것입니다’로 자연스럽게 옮겼습니다. אִישׁ은 해석적으로 ‘후손’이나 ‘메시아’로 좁히지 않고 ‘사람’으로 유지했으며, בֵּית יִשְׂרָאֵל도 ‘이스라엘 집’으로 보존했습니다. 기존 b 각주는 본문이 더 이상 해당 표현을 축약하지 않으므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:20Z'
