translation:
  language: ko
  text: 보십시오, 날들이 옵니다 — 야훼의 말씀입니다 — 내가 이스라엘 집과 유다 집에 말한 그 좋은 말씀[a]을 이루겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 좋은 말씀’입니다. 문맥상 ‘좋은 약속’으로도 옮길 수 있습니다.
    reason: lexical_alternative
