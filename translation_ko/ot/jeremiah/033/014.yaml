  - 이스라엘 집과 유다 집을 향해
  lexicon: HALOT
  rationale: 두 수신 대상을 병렬로 살리면서, 한국어에서는 간결하게 여격으로 처리해 예언적 진술의 흐름을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명 사전을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다. 이는 서술자의 발화에서 하나님의 언약 이름을 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: הַדָּבָר הַטּוֹב의 의미 범위
  chosen_reading: 말씀을 이루겠습니다
  alternative_readings:
  - 약속을 이루겠습니다
  - 좋은 말을 이루겠습니다
  rationale: 히브리어는 ‘말씀’과 그 성취를 직접 연결하지만, ‘약속’으로 완전히 치환하면 어휘적 긴장이 약해집니다. 한국어 본문도 ‘말씀’을 유지해 원문 구조를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
