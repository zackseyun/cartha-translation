source:
  edition: WLC
  text: הִנֵּ֛ה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וַ/הֲקִֽמֹתִי֙ אֶת הַ/דָּבָ֣ר הַ/טּ֔וֹב אֲשֶׁ֥ר דִּבַּ֛רְתִּי אֶל בֵּ֥ית יִשְׂרָאֵ֖ל וְ/עַל בֵּ֥ית יְהוּדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/014.yaml
  text: Look[a], days are coming, declares Yahweh, when I will fulfill the good word that I spoke to the house of Israel and the house of Judah.
  footnotes:
  - marker: a
    text: Or 'the good promise.' Hebrew literally, 'the good word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 날들이 옵니다 — 야훼의 말씀입니다 — 내가 이스라엘 집과 유다 집에 말한 그 좋은 말씀을 이루겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그 좋은 말씀’입니다. 문맥상 ‘좋은 약속’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 감탄사로서, 현대 문어체에서 자연스럽고 직접적인 호소를 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 날들이 옵니다
  alternatives_korean:
  - 그 날들이 옵니다
  - 날들이 다가옵니다
  lexicon: HALOT
  rationale: 미래 도래를 알리는 관용구를 한국어로 간결하게 옮겨, 예언적 긴박감을 살렸습니다.
- source_word: הַדָּבָר הַטּוֹב
  english_pob_choice: the good word
  chosen_korean: 그 좋은 말씀
  alternatives_korean:
  - 그 좋은 말씀
  - 그 좋은 말
  - 그 좋은 약속
  lexicon: HALOT
  rationale: 직역상 ‘말/말씀’의 어휘를 유지하되, 하나님의 발화라는 문맥을 반영해 ‘말씀’을 사용했습니다. ‘약속’은 해석을 앞서 정리하므로 본문에는 두지 않았습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언서의 공식 서식을 한국어로 자연스럽게 옮기면서, 하나님의 이름을 프로젝트 기본값인 ‘야훼’로 반영했습니다.
- source_word: וַהֲקִמֹתִי
  english_pob_choice: I will fulfill
  chosen_korean: 이루겠습니다
  alternatives_korean:
  - 확립하겠습니다
  - 성취하겠습니다
  - 실현하겠습니다
  lexicon: HALOT
  rationale: 말한 ‘좋은 말씀’을 실제로 성립시키는 뜻을 살려, 한국어에서 약속 성취에 자연한 ‘이루겠습니다’를 선택했습니다.
- source_word: אֶל בֵּית יִשְׂרָאֵל וְעַל בֵּית יְהוּדָה
  english_pob_choice: to the house of Israel and the house of Judah
  chosen_korean: 이스라엘 집과 유다 집에
  alternatives_korean:
  - 이스라엘 집과 유다 집에게
  - 이스라엘 집과 유다 집을 향해
  lexicon: HALOT
  rationale: 두 수신 대상을 병렬로 살리면서, 한국어에서는 간결하게 여격으로 처리해 예언적 진술의 흐름을 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나타난 신명 사전을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다. 이는 서술자의 발화에서 하나님의 언약 이름을 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: הַדָּבָר הַטּוֹב의 의미 범위
  chosen_reading: 말씀을 이루겠습니다
  alternative_readings:
  - 약속을 이루겠습니다
  - 좋은 말을 이루겠습니다
  rationale: 히브리어는 ‘말씀’과 그 성취를 직접 연결하지만, ‘약속’으로 완전히 치환하면 어휘적 긴장이 약해집니다. 한국어 본문도 ‘말씀’을 유지해 원문 구조를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve theological tension rather than resolve it'
