  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ֣יְתָה לִּ֗/י לְ/שֵׁ֤ם שָׂשׂוֹן֙ לִ/תְהִלָּ֣ה וּ/לְ/תִפְאֶ֔רֶת לְ/כֹ֖ל גּוֹיֵ֣י הָ/אָ֑רֶץ אֲשֶׁ֨ר יִשְׁמְע֜וּ אֶת כָּל הַ/טּוֹבָ֗ה אֲשֶׁ֤ר אָֽנֹכִי֙ עֹשֶׂ֣ה אֹתָ֔/ם וּ/פָחֲד֣וּ וְ/רָֽגְז֗וּ עַ֤ל כָּל הַ/טּוֹבָה֙ וְ/עַ֣ל כָּל הַ/שָּׁל֔וֹם אֲשֶׁ֥ר אָֽנֹכִ֖י עֹ֥שֶׂה לָּֽ/הּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/009.yaml
  text: And she will be to me a name of joy[a], a praise and a glory before all the nations of the earth, who will hear of all the good that I am doing for them. And they will fear and tremble because of all the good and because of all the peace that I am bringing to her.
  footnotes:
  - marker: a
    text: Or 'all the prosperity' or 'all the well-being'; Hebrew shalom includes peace, welfare, and wholeness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그것은 나에게 기쁨의 이름, 곧 칭송과 영광이 되어 땅의 모든 민족들 앞에서 그렇게 될 것입니다. 그들은 내가 그들에게 행하는 모든 좋은 것과 내가 그에게 주는 모든 평안 때문에 두려워하며 떨 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평안’은 평화, 복리, 온전함을 포함하는 셈어적 개념입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה לִּי
  english_pob_choice: And she will be to me
  chosen_korean: 그것은 나에게 …가 되어
  alternatives_korean:
  - 그 여인은 나에게 …가 되어
  - 그것은 내게 …가 될 것입니다
  lexicon: WLC; HALOT
  rationale: 히브리어는 3인칭 여성 단수이지만 한국어에서는 대상이 성을 드러내지 않으므로, 본문 이미지와 문장 자연성을 함께 살려 ‘그것은’으로 두었습니다.
- source_word: לְשֵׁם שָׂשׂוֹן לִתְהִלָּה וּלְתִפְאֶרֶת
  english_pob_choice: a name of joy, a praise and a glory
  chosen_korean: 기쁨의 이름, 곧 칭송과 영광
  alternatives_korean:
  - 기쁨의 이름, 찬양과 영광
  - 기쁨의 이름, 찬사와 아름다움
  lexicon: HALOT
  rationale: שָׂשׂוֹן을 단순 감정보다 ‘기쁨’으로, תְהִלָּה를 행위성 있는 ‘칭송’으로, תִפְאֶרֶת를 높임의 뜻을 살린 ‘영광’으로 옮겨 공적 명예의 뉘앙스를 유지했습니다.
- source_word: לְכֹל גּוֹיֵי הָאָרֶץ אֲשֶׁר יִשְׁמְעוּ
  english_pob_choice: before all the nations of the earth, who will hear of
  chosen_korean: 땅의 모든 민족들 앞에서
  alternatives_korean:
  - 땅의 모든 민족들에게
  - 땅의 모든 민족들 눈앞에서
  lexicon: HALOT
  rationale: לְ + ‘모든 민족들’은 단순 수혜보다 공개적 관찰의 장면을 드러내므로 ‘앞에서’로 처리해 열방 앞의 공적 성격을 살렸습니다.
- source_word: אֶת כָּל הַטּוֹבָה אֲשֶׁר אָנֹכִי עֹשֶׂה אֹתָם
  english_pob_choice: all the good that I am doing for them
  chosen_korean: 내가 그들에게 행하는 모든 좋은 것
  alternatives_korean:
  - 내가 그들을 위하여 행하는 모든 선
  - 내가 그들에게 하는 모든 선한 일
  lexicon: HALOT
  rationale: טוֹבָה는 추상명사 ‘선함’보다 실제로 주어지는 복리·유익을 가리키기에, 문맥에 맞게 ‘모든 좋은 것’으로 옮겼습니다.
- source_word: וּפָחֲדוּ וְרָגְזוּ
  english_pob_choice: And they will fear and tremble
  chosen_korean: 두려워하며 떨 것입니다
  alternatives_korean:
  - 두려워하며 흔들릴 것입니다
  - 무서워하며 떨 것입니다
  lexicon: HALOT
  rationale: פחד와 רגז의 병렬을 한국어의 자연스러운 관용인 ‘두려워하며 떨다’로 옮겨, 경외와 놀라움이 섞인 반응을 살렸습니다.
theological_decisions:
- issue: וְהָיְתָה and לָּהּ in the verse's city-personification
  chosen_reading: 예루살렘/도성에 대한 여성 인격화를 한국어에서는 비인칭 대명사로 완화하되, 대상은 동일하게 유지했습니다.
  alternative_readings:
  - 여성 인칭을 드러내어 ‘그 여인은’으로 옮기기
  - 완전히 의인화를 버리고 ‘그것’으로만 처리하기
  rationale: 히브리어 문맥은 도성을 여성으로 의인화하지만, 한국어는 성 구별이 없으므로 과도한 의인화를 피하면서도 문맥 지시를 보존하는 쪽이 가장 정확합니다.
  doctrine_reference: 문학적 의인화 보존
- issue: כָּל הַשָּׁלוֹם
  chosen_reading: ‘평안’의 넓은 의미를 살리되 본문에서는 공적 언어에 맞춰 ‘좋은 것’과 병렬된 결과로 이해하게 했습니다.
  alternative_readings:
  - 평화
  - 형통
  - 복리
  rationale: English POB도 shalom의 폭을 주석으로 남겼듯, 한국어 본문은 지나치게 해설적이지 않게 두고 의미 범위는 열어 두는 것이 적절합니다.
  doctrine_reference: shalom의 의미 범위 유지
