id: JER.33.18
reference: Jeremiah 33:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לַ/כֹּהֲנִים֙ הַ/לְוִיִּ֔ם לֹֽא יִכָּרֵ֥ת אִ֖ישׁ מִ/לְּ/פָנָ֑/י מַעֲלֶ֨ה עוֹלָ֜ה וּ/מַקְטִ֥יר מִנְחָ֛ה וְ/עֹ֥שֶׂה זֶּ֖בַח כָּל הַ/יָּמִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/018.yaml
  text: And for the Levitical priests[a], a man shall not be cut off from before me who offers up a burnt offering, who burns a grain offering[c][b], and who makes a sacrifice all the days.
  footnotes:
  - marker: a
    text: Or, 'a man shall not be lacking before me.' The Hebrew idiom is literally 'shall not be cut off.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'all the days,' that is, continually or perpetually.
    reason: lexical_alternative
  - marker: c
    text: Or 'to offer up a burnt offering, to burn a grain offering, and to make sacrifice'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 레위 계통의 제사장들에게는, 내 앞에서 끊어질 사람이 없을 것이며, 그는 번제를 드리고, 곡식 제물을 피워 올리고, 제사를 드리며, 항상 그렇게 할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끊어질’은 히브리어 관용구 ‘잘려 나가다/끊어지다’를 살린 표현입니다. 직역상 ‘없어지다/부족하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘항상 그렇게 할 것입니다’는 히브리어 ‘모든 날들’의 지속·항구성을 자연스럽게 옮긴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘곡식 제물’은 מִנְחָה의 문맥적 의미를 반영한 번역입니다. 전통적 ‘소제’보다 현대 독자에게 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַכֹּהֲנִים הַלְוִיִּם
  english_pob_choice: And for the Levitical priests
  chosen_korean: 레위 계통의 제사장들에게는
  alternatives_korean:
  - 레위 사람 제사장들에게는
  - 레위인 제사장들에게는
  - 레위 제사장들에게는
  lexicon: HALOT
  rationale: כהנים הלויים는 제사장직이 레위 지파와 결속된 집단을 가리키므로, ‘레위 계통의 제사장들’이 관계를 자연스럽게 드러내면서도 apposition을 보존합니다.
- source_word: לֹא יִכָּרֵת אִישׁ
  english_pob_choice: a man shall not be cut off
  chosen_korean: 끊어질 사람이 없을 것이며
  alternatives_korean:
  - 끊어질 사람이 없을 것이며
  - 잘려 나갈 사람이 없을 것이며
  - 없어질 사람이 없을 것이며
  lexicon: HALOT
  rationale: כרת의 관용적 의미를 직역하면 ‘끊어지다/잘리다’이며, 언약적·계보적 지속성을 살리기 위해 ‘끊어질’로 옮겼습니다. ‘없을 것이며’는 뒤의 주어를 자연스럽게 받게 합니다.
- source_word: מִלְּפָנַי
  english_pob_choice: from before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 앞에서
  - 내 임재 앞에서
  - 내 얼굴 앞에서
  lexicon: HALOT
  rationale: ‘from before me’의 히브리 관용을 과도하게 풀지 않고, 제사장 봉사의 장소성을 드러내는 가장 직접적인 표현으로 옮겼습니다.
- source_word: מַעֲלֶה עוֹלָה / וּמַקְטִיר מִנְחָה / וְעֹשֶׂה זֶּבַח
  english_pob_choice: who offers up a burnt offering, who burns a grain offering, and who makes a sacrifice
  chosen_korean: 번제를 드리고, 곡식 제물을 피워 올리고, 제사를 드리며
  alternatives_korean:
  - 번제를 드리고, 곡식 제물을 피워 올리고, 제사를 드리며
  - 번제를 바치고, 곡식 제물을 태우고, 제사를 드리며
  - 번제를 올리고, 곡식 제물을 피워 올리고, 제사를 행하며
  lexicon: HALOT
  rationale: 세 분사구문을 행위의 연속으로 살려 ‘드리고/피워 올리고/드리며’로 대응했습니다. מִנְחָה는 문맥상 곡식 제물이며, הקטיר의 제의적 ‘연기 올림’을 살리기 위해 ‘피워 올리고’를 택했습니다.
- source_word: כָּל הַיָּמִים
  english_pob_choice: all the days
  chosen_korean: 항상 그렇게 할 것입니다
  alternatives_korean:
  - 항상 그렇게 할 것입니다
  - 모든 날에
  - 모든 날 동안
  lexicon: HALOT
  rationale: 직역인 ‘모든 날들’은 한국어에서 부자연스러워, ‘all the days’의 지속성을 드러내는 자연스러운 합쇼체 표현으로 옮겼습니다.
theological_decisions:
- issue: כרת idiom을 ‘없다’로 완화할지, ‘끊어지다’의 언약적 긴장을 살릴지
  chosen_reading: ‘끊어질 사람이 없을 것’으로 유지하되, 문장 전체는 현대 한국어로 자연화했습니다.
  alternative_readings:
  - ‘사람이 부족하지 않을 것이다’
  - ‘한 사람도 없어지지 않을 것이다’
  rationale: 이 절은 다윗 왕가 약속과 병렬을 이루며 제사장 계열의 지속성을 말하므로, 단순한 부재보다 ‘끊어짐’의 언약적 뉘앙스가 중요합니다. 다만 한국어 가독성을 위해 뒤는 매끄럽게 처리했습니다.
  doctrine_reference: Translation philosophy §3, §4, §5
- issue: 분사들의 기능을 목적절로 볼지, 제사장에 대한 설명으로 볼지
  chosen_reading: 제사장을 꾸미는 관계절적/서술적 표현으로 읽었습니다.
  alternative_readings:
  - ‘번제를 드리기 위해…’
  - ‘번제를 드리는 자로서…’
  rationale: 히브리어 분사 מַעֲלֶה, מַקְטִיר, וְעֹשֶׂה는 목적이 아니라 지속적 행위를 묘사합니다. 따라서 ‘하는 사람’의 성격을 살리는 방향이 원문 구조에 더 가깝습니다.
  doctrine_reference: Translation philosophy §1, §6
