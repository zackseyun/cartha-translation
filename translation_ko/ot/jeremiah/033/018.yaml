revisions:
- from: 그리고 레위 계통의 제사장들에게는, 내 앞에서 끊어질 사람이 없을 것이며, 그는 번제를 드리고, 곡식 제물을 피워 올리고, 제사를 드리며, 항상 그렇게 할 것입니다.[a][b][c]
  to: 또 레위 사람 제사장들에게도 내 앞에서 번제를 드리고 곡식 제물을 살라 연기로 올리며 제사를 드릴 사람이 모든 날 동안 끊어지지 않을 것입니다.[a][b][c]
  rationale: 원문의 ‘레위 사람 제사장들’과 ‘내 앞에서’의 배치를 유지하면서, 세 분사를 ‘사람’을 수식하는 연속된 관형절로 재구성했습니다. 그 결과 제사 행위를 수행할 제사장 계열이 끊어지지 않는다는 약속이 한국어에서 명료해집니다. ‘모든 날 동안’을 유지해 원문의 시간적 지속성도 보존했습니다.
