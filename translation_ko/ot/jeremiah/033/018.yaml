  source_fidelity: 현 초안은 제의 행위와 지속성을 대체로 충실히 반영합니다. 그러나 ‘끊어질 사람이 없을 것이며, 그는 … 할 것입니다’는 히브리어의 분사들이 ‘사람’을 수식하는 구조를 한국어에서 두 문장 성분으로 분리하여, ‘그’의 선행사가 불명확해지고 ‘항상’의 범위도 흐려집니다. 분사구를 ‘사람’에 직접 연결하고 כָּל־הַיָּמִים를 ‘모든 날 동안’으로 보존하는 편이 안전합니다.
  naturalness: ‘레위 계통의 제사장들’보다 성경 및 현대 한국어에서 더 통용되는 ‘레위 사람 제사장들’이 자연스럽습니다. ‘곡식 제물을 피워 올리다’도 이해되지만, הקטיר의 제의적 연기 올림을 ‘살라 연기로 올리다’로 명시하면 더 정확하고 자연스럽습니다.
  terminology: ‘번제’, ‘곡식 제물’, ‘제사’는 적절합니다. הַכֹּהֲנִים הַלְוִיִּם는 ‘레위 사람 제사장들’로, מִלְּפָנַי는 ‘내 앞에서’로 유지합니다. ‘끊어지다’는 원문의 כרת 관용구와 문맥의 지속성 모두를 보존합니다.
