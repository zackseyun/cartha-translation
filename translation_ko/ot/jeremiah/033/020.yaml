source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה אִם תָּפֵ֨רוּ֙ אֶת בְּרִיתִ֣/י הַ/יּ֔וֹם וְ/אֶת בְּרִיתִ֖/י הַ/לָּ֑יְלָה וּ/לְ/בִלְתִּ֛י הֱי֥וֹת יֽוֹמָם וָ/לַ֖יְלָה בְּ/עִתָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/020.yaml
  text: 'Thus says Yahweh: If you can break my covenant with the day and my covenant with the night[a], so that day and night will not be at their appointed time[b],'
  footnotes:
  - marker: a
    text: Or, 'If you break my covenant with the day and my covenant with the night.' The Hebrew conditional can be rendered more formally without 'can'; the main text brings out the rhetorical sense of impossibility in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'so that there will not be day and night at their appointed time.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이같이 말씀하십니다. “너희가 낮과 맺은 내 언약과 밤과 맺은 내 언약을 깨뜨릴 수 있다면[a], 곧 낮과 밤이 정한 때에 있지 못하게 할 수 있다면[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “너희가 낮과 맺은 내 언약과 밤과 맺은 내 언약을 깨뜨린다면.” 히브리어 조건문은 ‘할 수 있다면’ 없이 더 형식적으로 옮길 수도 있지만, 본문은 문맥상 그 불가능성을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, “그리하여 낮과 밤이 정한 때에 있지 않게 된다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이같이 말씀하십니다
  alternatives_korean:
  - 주님께서 이렇게 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식은 한국어에서 ‘이같이 말씀하십니다’로 자연스럽게 살리고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אִם תָּפֵרוּ
  english_pob_choice: If you can break
  chosen_korean: 너희가 ... 깨뜨릴 수 있다면
  alternatives_korean:
  - 너희가 ... 깨뜨린다면
  - 너희가 ... 무효로 만들 수 있다면
  lexicon: HALOT
  rationale: הפר의 언약 파기 의미를 살려 ‘깨뜨리다’로 옮겼고, 영어 POB의 가능성/불가능성 뉘앙스를 반영해 ‘~할 수 있다면’으로 렌더링했습니다.
- source_word: בְּרִיתִי הַיּוֹם / בְּרִיתִי הַלָּיְלָה
  english_pob_choice: my covenant with the day / my covenant with the night
  chosen_korean: 내 낮의 언약 / 내 밤의 언약
  alternatives_korean:
  - 내가 낮과 맺은 언약 / 내가 밤과 맺은 언약
  - 낮과의 내 언약 / 밤과의 내 언약
  lexicon: HALOT
  rationale: 히브리어의 목적격적 관계를 한국어에서는 속격 구조로 자연스럽게 풀어 ‘낮의 언약’, ‘밤의 언약’으로 옮겨 원문의 대구를 유지했습니다.
- source_word: בְּעִתָּם
  english_pob_choice: at their appointed time
  chosen_korean: 그 정한 때에
  alternatives_korean:
  - 그 정해진 때에
  - 그들의 정한 때에
  lexicon: HALOT
  rationale: ‘עֵת’의 정해진/지정된 시간을 간결하게 살리면서, 한국어에서 자연스러운 표현인 ‘정한 때’로 옮겼습니다.
theological_decisions:
- issue: 여호와 신명 표현
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 יְהוָה를 직접 사용하므로 프로젝트 기본값을 따라 ‘야훼’로 옮겨 언약적 신명성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 수사적 조건문의 강도
  chosen_reading: 깨뜨릴 수 있다면
  alternative_readings:
  - 깨뜨린다면
  - 깨뜨릴 수 있거든
  rationale: 문맥상 실제 가능성을 묻기보다 불가능성을 전제하는 수사적 조건이므로, ‘~할 수 있다면’으로 그 긴장을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: optimal equivalence'
