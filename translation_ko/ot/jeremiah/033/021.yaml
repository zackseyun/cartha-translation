  source_fidelity: 수정이 필요합니다. 초안은 עַבְדִּי(‘나의 종’)를 본문에서 빠뜨렸고, 두 번째 대격구를 ‘레위 사람 제사장들이 그러할 것’으로 처리하여 원문의 병렬 구조, 곧 ‘레위계 제사장들과 맺은 [나의 언약]’을 깨뜨렸습니다. 또한 ‘자기 왕좌’는 한국어에서 아들을 가리키는 것으로도 읽힐 수 있어 다윗을 가리키는 히브리어 소유접미사의 지시를 흐립니다.
  naturalness: 수정문은 앞 절의 조건을 받는 ‘그렇다면’과 가정적 귀결인 ‘깨질 것입니다’를 사용하여 현대 표준어 합쇼체로 자연스럽게 옮겼습니다. 한국어 문장 구조상 두 번째 ‘언약’을 보충하여 병렬 관계를 분명히 했습니다.
  terminology: בְּרִית는 ‘언약’, עַבְדִּי는 호칭을 보존한 ‘나의 종’, מְשָׁרְתָי는 제의적 봉사의 의미를 담은 ‘나를 섬기는 이들’로 옮겼습니다. הַלְוִיִּם הַכֹּהֲנִים는 본문에서 관용적인 ‘레위인 제사장들’로 처리하고, 동격적 표현 가능성은 각주에 보존했습니다.
