revisions:
- from: 그러면 나의 다윗에 대한 언약도 깨질 것이며, 그에게 자기 왕좌에 앉아 다스릴 아들이 없게 되고, 레위 사람 제사장들, 곧 나의 섬기는 이들도 그러할 것입니다.[a]
  to: 그렇다면 나의 종 다윗과 맺은 나의 언약도 깨져서, 그에게 그의 왕좌에서 다스릴 아들이 없게 될 것이며, 레위인 제사장들, 곧 나를 섬기는 이들과 맺은 나의 언약도 깨질 것입니다.[a]
  rationale: 원문의 ‘나의 종’ 호칭을 복원하고, 다윗과의 언약 및 레위계 제사장들과의 언약이라는 병렬 구조를 한국어에서 명확히 했습니다. ‘그의 왕좌’로 소유 관계를 분명히 했으며, 레위계 집단 표현의 동격적 가능성은 각주에 보존했습니다.
