id: JER.33.21
reference: Jeremiah 33:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם בְּרִיתִ֤/י תֻפַר֙ אֶת דָּוִ֣ד עַבְדִּ֔/י מִ/הְיֽוֹת ל֥/וֹ בֵ֖ן מֹלֵ֣ךְ עַל כִּסְא֑/וֹ וְ/אֶת הַ/לְוִיִּ֥ם הַ/כֹּהֲנִ֖ים מְשָׁרְתָֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/021.yaml
  text: then my covenant with David my servant may also be broken[a], so that he would not have a son reigning on his throne, and with the Levitical priests, my ministers.
  footnotes:
  - marker: a
    text: Or, more literally, 'and with the Levites, the priests, my ministers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 나의 종 다윗과 맺은 나의 언약도 깨져서, 그에게 그의 왕좌에서 다스릴 아들이 없게 될 것이며, 레위인 제사장들, 곧 나를 섬기는 이들과 맺은 나의 언약도 깨질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘그리고 레위 사람들, 곧 제사장들, 나를 섬기는 이들과 [맺은 나의 언약도].’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: also
  chosen_korean: 그러면
  alternatives_korean:
  - 또한
  - 더욱이
  - 심지어
  lexicon: HALOT
  rationale: 앞절의 불가능한 경우를 이어 주는 결과적 연결을 한국어에서는 ‘그러면’으로 자연스럽게 드러내어, 언약이 깨진다면 뒤의 결과도 성립한다는 논리를 살렸습니다.
- source_word: בְּרִיתִי
  english_pob_choice: my covenant
  chosen_korean: 나의 언약
  alternatives_korean:
  - 내 언약
  - 나의 계약
  lexicon: HALOT
  rationale: בְּרִית의 언약적 무게를 살려 ‘언약’으로 옮겼고, 1인칭 소유를 분명히 했습니다.
- source_word: דָּוִד עַבְדִּי
  english_pob_choice: David my servant
  chosen_korean: 다윗에 대한 언약
  alternatives_korean:
  - 나의 종 다윗과의 언약
  - 다윗, 나의 종과의 언약
  lexicon: HALOT
  rationale: 여기서 다윗은 언약의 상대자로 제시되므로 관계를 드러내는 표현을 택했으며, עַבְדִּי는 ‘나의 종’이라는 언약적 호칭으로 이해되어 본문 의미에 반영했습니다.
- source_word: בֵן מֹלֵךְ עַל כִּסְאוֹ
  english_pob_choice: a son reigning on his throne
  chosen_korean: 자기 왕좌에 앉아 다스릴 아들
  alternatives_korean:
  - 그의 왕좌에서 다스릴 아들
  - 왕좌에 앉아 통치할 아들
  lexicon: HALOT
  rationale: 히브리어의 직역적 ‘아들’과 왕권의 지속을 함께 살리기 위해 ‘다스릴 아들’로 옮겼고, 왕좌는 관계대명사보다 자연스러운 한국어 소유 구조로 정리했습니다.
- source_word: וְאֶת הַלְוִיִּם הַכֹּהֲנִים מְשָׁרְתָי
  english_pob_choice: and with the Levitical priests, my ministers
  chosen_korean: 레위 사람 제사장들, 곧 나의 섬기는 이들
  alternatives_korean:
  - 레위인 제사장들, 나의 직무자들
  - 레위 사람들, 제사장들, 나의 일꾼들
  lexicon: HALOT
  rationale: הַלְוִיִּם הַכֹּהֲנִים의 결합을 ‘레위 사람 제사장들’로 옮겨 레위계 제사직을 드러냈고, מְשָׁרְתָי는 제의적 봉사의 뜻을 살려 ‘나의 섬기는 이들’로 번역했습니다.
theological_decisions:
- issue: 다윗 언약의 동적 보존
  chosen_reading: ‘나의 다윗에 대한 언약도 깨질 것이며’로 옮겨, 왕조 약속의 구체성을 유지했습니다.
  alternative_readings:
  - 다윗과의 언약도 깨질 것이며
  - 다윗에 관한 언약도 깨질 것이며
  rationale: 본문은 추상적 일반론이 아니라 다윗 왕조의 지속 여부를 말하므로, 언약의 상대를 분명히 드러내되 메시아적 확장을 이 절 안에 미리 넣지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 4, 5
- issue: 제사장 집단의 정체성
  chosen_reading: ‘레위 사람 제사장들’로 본문을 두고, ‘나의 섬기는 이들’로 봉사 기능을 덧붙였습니다.
  alternative_readings:
  - 레위인 제사장들
  - 레위 사람들, 제사장들
  rationale: 히브리어의 병렬·동격 가능성을 유지하면서도, 문맥상 성전 봉사 집단이라는 점을 한국어 독자가 바로 이해하도록 했습니다.
  doctrine_reference: Translation philosophy §6
