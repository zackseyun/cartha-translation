  text: וַ/הֲשִֽׁבֹתִי֙ אֶת שְׁב֣וּת יְהוּדָ֔ה וְ/אֵ֖ת שְׁב֣וּת יִשְׂרָאֵ֑ל וּ/בְנִתִ֖י/ם כְּ/בָ/רִֽאשֹׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/007.yaml
  text: And I will restore the fortunes of Judah and the fortunes of Israel[a], and I will rebuild them as at the first.
  footnotes:
  - marker: a
    text: Or, more literally, 'restore the captivity' or 'bring back the captives' of Judah and Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 유다의 형편과 이스라엘의 형편을 회복시키고[a], 그들을 처음과 같이 다시 세우겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘유다와 이스라엘의 포로 상태를 되돌리다’ 또는 ‘유다와 이스라엘의 포로들을 돌아오게 하다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁבֹתִי / שְׁבוּת
  english_pob_choice: I will restore the fortunes
  chosen_korean: “유다의 번영과 이스라엘의 번영을 회복하다”
  alternatives_korean:
  - “유다와 이스라엘의 포로 상태를 되돌리다”
  - “유다와 이스라엘의 포로들을 돌아오게 하다”
  lexicon: HALOT
  rationale: 히필형 הֵשִׁיב + שְׁבוּת의 관용구는 단순한 귀환보다 회복 전반을 가리킬 수 있어, POB의 ‘fortunes’에 맞춰 ‘번영을 회복하다’로 옮겼습니다.
- source_word: יְהוּדָה / יִשְׂרָאֵל
  english_pob_choice: Judah / Israel
  chosen_korean: 유다 / 이스라엘
  alternatives_korean:
  - 유다 지파 / 이스라엘 지파
  lexicon: 고유명사 표준 음역
  rationale: 유다와 이스라엘은 문맥상 남북 왕국 전체를 가리키는 표준 고유명사이므로 현대 표준 음역을 유지했습니다.
- source_word: וּבְנִתִים
  english_pob_choice: and I will rebuild them
  chosen_korean: 그들을 다시 세우겠습니다
  alternatives_korean:
  - 그들을 다시 지으겠습니다
  - 그들을 다시 건축하겠습니다
  lexicon: HALOT
  rationale: בנה는 기본적으로 ‘짓다’이지만, 폐허 이후의 회복 문맥에서는 ‘다시 세우다’가 복원 의미를 가장 자연스럽게 드러냅니다.
- source_word: כְּבָרִאשֹׁנָה
  english_pob_choice: as at the first
  chosen_korean: 처음과 같이
  alternatives_korean:
  - 옛날처럼
  - 전처럼
  lexicon: HALOT
  rationale: ‘as at the first’의 비교 감각을 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: שְׁבוּת의 의미 범위
  chosen_reading: 포로 귀환만이 아니라 국가적·경제적 회복까지 포괄하는 ‘번영의 회복’으로 읽었습니다.
  alternative_readings:
  - 포로 상태의 회복
  - 포로들의 귀환
  rationale: 문맥은 포로 귀환을 넘어 ‘다시 세움’과 연결되므로, 의미 범위를 좁히지 않고 회복의 폭을 드러내는 번역이 본문의 약속을 더 잘 전달합니다.
  doctrine_reference: 번역 원칙 §1, §3, §5
