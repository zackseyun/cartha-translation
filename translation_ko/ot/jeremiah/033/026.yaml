revisions:
- from: 그때에도 내가 야곱의 씨와 내 종 다윗의 씨를 버려서, 그들의 씨에서 아브라함, 이삭, 야곱의 씨를 다스릴 통치자들을 뽑아내지 않겠습니다. 왜냐하면 내가 그들의 운명을 회복하고 그들에게 긍휼을 베풀 것이기 때문입니다.[a][b]
  to: 그렇다면 나도 야곱의 자손[a]과 내 종 다윗을 버리고, 그의 자손 가운데서 아브라함과 이삭과 야곱의 자손을 다스릴 통치자들을 뽑지 않을 것입니다. 내가 그들의 형편을 회복하고[b] 그들에게 자비를 베풀 것이기 때문입니다.
  rationale: 원문이 열거하는 두 대상, 곧 ‘야곱의 씨’와 ‘내 종 다윗’을 그대로 유지하고, 이어지는 ‘그의 자손’은 다윗을 가리키도록 번역했습니다. 앞절에서 이어지는 가정적 귀결은 ‘그렇다면 … 않을 것입니다’로 나타냈습니다. 회복 관용구는 넓은 의미를 보존하는 ‘형편을 회복하다’로 고쳤으며, 각주 표지를 해당 본문 어구에 배치했습니다.
