id: JER.33.26
reference: Jeremiah 33:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גַּם זֶ֣רַע יַעֲקוֹב֩ וְ/דָוִ֨ד עַבְדִּ֜/י אֶמְאַ֗ס מִ/קַּ֤חַת מִ/זַּרְע/וֹ֙ מֹֽשְׁלִ֔ים אֶל זֶ֥רַע אַבְרָהָ֖ם יִשְׂחָ֣ק וְ/יַעֲקֹ֑ב כִּֽי אשוב אֶת שְׁבוּתָ֖/ם וְ/רִחַמְתִּֽי/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/026.yaml
  text: then I would also reject the offspring of Jacob and of David my servant[a], not taking from his offspring rulers over the offspring of Abraham, Isaac, and Jacob[b]. For I will restore their fortunes and have compassion on them.
  footnotes:
  - marker: a
    text: Or 'the seed of Jacob' and throughout the verse 'seed' instead of 'offspring.' The Hebrew זֶרַע is a collective singular.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will restore their captivity' / 'I will bring back their exiles.' The Hebrew idiom can refer specifically to return from exile or more broadly to restoration of fortunes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇다면 나도 야곱의 자손[a]과 내 종 다윗을 버리고, 그의 자손 가운데서 아브라함과 이삭과 야곱의 자손을 다스릴 통치자들을 뽑지 않을 것입니다. 내가 그들의 형편을 회복하고[b] 그들에게 자비를 베풀 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자손’은 히브리어 זֶרַע의 번역입니다. 이 말은 집합적 단수이며, 이 절 전체에서 ‘씨’로 직역할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 포로 상태를 돌이키다’입니다. 이 히브리어 관용구는 포로 귀환을 가리킬 수도 있고, 더 넓게는 곤경에 처한 형편의 회복을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  english_pob_choice: then ... also
  chosen_korean: 그때에도
  alternatives_korean:
  - 또
  - 심지어
  lexicon: HALOT
  rationale: 앞절의 조건에 이어지는 결과 구문이므로 단순한 부사적 ‘또’보다 문맥적 연결을 드러내는 ‘그때에도’가 더 적절합니다.
- source_word: זֶרַע יַעֲקוֹב
  english_pob_choice: the offspring of Jacob
  chosen_korean: 야곱의 씨
  alternatives_korean:
  - 야곱의 후손
  - 야곱의 자손
  lexicon: HALOT
  rationale: זֶרַע의 집합적 단수성을 살리기 위해 ‘후손/자손’보다 ‘씨’를 택했습니다. 한국어에서도 성경적·직역적 울림을 유지합니다.
- source_word: וְדָוִד עַבְדִּי
  english_pob_choice: and of David my servant
  chosen_korean: 내 종 다윗
  alternatives_korean:
  - 다윗 내 종
  - 내 종인 다윗
  lexicon: HALOT
  rationale: ‘내 종’은 다윗에게 붙은 언약적 칭호이므로 자연스러운 수식 순서로 옮겼습니다. 개역식의 관용을 그대로 따르기보다 현대 한국어 어순을 따랐습니다.
- source_word: מֹשְׁלִים
  english_pob_choice: rulers
  chosen_korean: 통치자들
  alternatives_korean:
  - 다스리는 이들
  - 지도자들
  lexicon: HALOT
  rationale: 동사적 분사이지만 여기서는 실제 지배 권한을 가진 사람들을 가리키므로 ‘통치자들’이 가장 직접적입니다.
- source_word: אֶל זֶרַע אַבְרָהָם יִשְׂחָק וְיַעֲקֹב
  english_pob_choice: over the offspring of Abraham, Isaac, and Jacob
  chosen_korean: 아브라함, 이삭, 야곱의 씨를 다스릴
  alternatives_korean:
  - 아브라함, 이삭, 야곱의 씨 위에
  - 아브라함, 이삭, 야곱의 씨를 다스리는
  lexicon: HALOT
  rationale: אֶל이 통치의 대상/영역을 나타내는 문맥이므로 한국어에서는 ‘다스릴’로 풀어 관계를 분명히 했습니다. ‘씨’는 앞의 זֶרַע와 같은 집합적 의미를 유지합니다.
- source_word: אשוב את שְׁבוּתָם
  english_pob_choice: I will restore their fortunes
  chosen_korean: 그들의 운명을 회복하고
  alternatives_korean:
  - 그들의 포로 상태를 돌이키고
  - 그들의 포로 생활을 돌아오게 하고
  lexicon: HALOT
  rationale: 관용구는 단순 귀환보다 더 넓은 회복을 포함하므로, 영어 POB의 취지를 따라 ‘운명을 회복하다’로 옮겼습니다.
- source_word: וְרִחַמְתִּים
  english_pob_choice: and have compassion on them
  chosen_korean: 그들에게 긍휼을 베풀 것입니다
  alternatives_korean:
  - 그들을 불쌍히 여기겠습니다
  - 그들에게 자비를 보이겠습니다
  lexicon: HALOT
  rationale: רחם의 자비·연민을 한국어 성경 문체에서 자연스럽게 드러내는 표현으로 ‘긍휼을 베풀다’를 택했습니다.
theological_decisions:
- issue: 조건절의 결과로서의 부정과 하나님의 언약 신실성
  chosen_reading: ‘버려서’와 ‘...하지 않겠습니다’로 조건의 결과를 모달하게 처리해, 앞절의 가정법 흐름 속에서 하나님의 거절 불가능성을 드러냈습니다.
  alternative_readings:
  - 단순 미래형으로 ‘버릴 것입니다’라고 옮김
  rationale: 히브리어 문맥은 가정된 조건의 결과를 말하며, 하나님이 실제로는 그렇게 하지 않으신다는 점을 강조합니다. 한국어에서도 이 논리를 보존해야 합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 다윗 언약의 특수성
  chosen_reading: ‘내 종 다윗’으로 옮겨 다윗에게 붙은 언약적 호칭을 살렸습니다.
  alternative_readings:
  - 그냥 ‘다윗’으로만 옮김
  rationale: 이 표현은 단순한 역사 인물이 아니라 하나님께 속한 종, 곧 언약적 인물을 가리키므로 호칭을 유지하는 것이 본문의 신학적 무게를 보존합니다.
  doctrine_reference: Translation philosophy §1, §5
