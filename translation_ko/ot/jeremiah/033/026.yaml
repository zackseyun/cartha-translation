  source_fidelity: 현 초안은 וְדָוִד עַבְדִּי를 ‘내 종 다윗의 씨’로 옮겨 원문에 없는 ‘씨’를 다윗에게 직접 보충합니다. 히브리어는 ‘야곱의 씨와 내 종 다윗’을 거절한다고 하고, 뒤의 ‘그의 씨’가 다윗을 가리킵니다. 또한 두 각주는 해당 어구에 직접 붙어야 합니다.
  naturalness: ‘그들의 운명을 회복하다’는 한국어에서 다소 부자연스럽고 히브리어 관용구의 의미도 정확히 드러내지 못합니다. ‘그들의 형편을 회복하다’가 현대 표준어에서 자연스럽고, 포로 귀환을 포함할 수 있는 더 넓은 회복의 의미를 보존합니다. ‘자비를 베풀다’는 합쇼체 문맥에서 자연스럽습니다.
  terminology: זֶרַע는 현대 한국어 본문에서는 ‘자손’이 자연스럽습니다. 집합적 단수라는 특징과 ‘씨’라는 직역 가능성은 각주로 보존합니다. ‘내 종 다윗’, ‘통치자들’, ‘자비’는 원문의 언약적·통치적·연민의 의미를 무리 없이 전달합니다.
