  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֧י דְבַר יְהוָ֛ה אֶֽל יִרְמְיָ֖הוּ שֵׁנִ֑ית וְ/הוּא֙ עוֹדֶ֣/נּוּ עָצ֔וּר בַּ/חֲצַ֥ר הַ/מַּטָּרָ֖ה לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/001.yaml
  text: And the word of Yahweh came to Jeremiah a second time while he was still confined in the court of the guard[a], saying,
  footnotes:
  - marker: a
    text: Or 'in the court of the prison.' The Hebrew likely refers to a guarded detention court or guardhouse enclosure.
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 여전히 경비대 뜰에 구금되어 있을 때, 야훼의 말씀이 그에게 두 번째로 임했습니다.[a] 야훼께서 이렇게 말씀하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "구금 시설의 뜰". 히브리어는 경비가 지키는 구금 뜰 또는 경비 시설의 뜰을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 여호와의 말씀
  alternatives_korean:
  - 야훼의 말씀
  - 주의 말씀
  lexicon: HALOT
  rationale: 예언 문맥의 정형구로서 דְבַר יְהוָה는 '말씀'으로 옮겨야 하며, 본문이 여호와의 직접적 발화를 가리키므로 소유격으로 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: DOCTRINE.md contested terms / Korean ecclesial usage
  rationale: 이 구절의 본문 감수와 프로젝트 기본어 목록 사이에 긴장이 있으므로, 한국어 교회 독자가 즉시 알아볼 수 있는 표기를 택했습니다. 다만 source가 가진 고유명을 의식해 번역 근거는 '여호와의 말씀'으로 유지했습니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 거듭
  lexicon: HALOT
  rationale: 시간적 순서를 분명히 하는 수치적 표현을 살려, 단순한 반복의 '다시'보다 '두 번째로'가 원문의 정확성을 더 잘 드러냅니다.
- source_word: עָצוּר בַּחֲצַר הַמַּטָּרָה
  english_pob_choice: confined in the court of the guard
  chosen_korean: 경비대 뜰에 갇혀 있을 때에
  alternatives_korean:
  - 경비대 뜰에 구금되어 있을 때에
  - 경비대 뜰에 갇혀 있는 동안
  - 경비실 뜰에 갇혀 있을 때에
  lexicon: HALOT
  rationale: חֲצַר הַמַּטָּרָה는 단순한 '감옥'보다 경비가 붙은 구금 장소를 가리키므로, POB의 'court of the guard' 취지를 살려 '경비대 뜰'로 옮겼습니다. עָצוּר은 법적 형벌보다 상태를 나타내므로 '갇혀 있을 때에'가 가장 무리 없습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르셨습니다
  - 말하여 이르셨습니다
  lexicon: HALOT
  rationale: 한국어에서는 direct speech 도입을 굳이 '말하여'로 반복하지 않고, 바로 뒤의 인용을 염두에 둔 서술로 자연화하는 것이 읽기 좋습니다. 다만 원문의 발화 연결은 '말씀'과 종결로 유지했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기 선택
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 절은 예언 공식의 첫 머리이므로, 한국어 수용성과 전통적 인지 가능성을 고려해 '여호와'를 택했습니다. 원어 고유명의 긴장은 lexical_decisions에서 밝혔습니다.
  doctrine_reference: DOCTRINE.md contested terms — יְהוָה YHWH
- issue: 직접화법 도입형식의 처리
  chosen_reading: '''임하여 말씀하셨습니다''로 마무리해 다음 직접인용을 예고하는 형식'
  alternative_readings:
  - '''말하여 이르셨습니다'''
  - '''이르시되'''
  rationale: 히브리어 לֵאמֹר가 다음 발화를 소개하는 기능을 하므로, 한국어에서도 문장 끝을 열어 두는 방식으로 그 기능을 보존했습니다.
  doctrine_reference: Hebrew narrative quotation marker
