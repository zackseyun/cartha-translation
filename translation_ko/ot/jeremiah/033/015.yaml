  to: 그 날들과 그 때에 내가 다윗을 위하여 의로운 가지를 돋아나게 하겠습니다. 그가 이 땅에서 정의와 의를 실행할 것입니다.[a][b]
  rationale: ‘다윗을 위하여’로 לְדָוִד의 관계적·수혜적 의미를 자연스럽게 반영하고, ‘돋아나게 하겠습니다’로 히필의 사역성과 식물 은유를 보존했습니다. ‘정의와 의’ 및 ‘이 땅에서’는 각각 מִשְׁפָּט וּצְדָקָה와 בָּאָרֶץ에 충실합니다. 각주 a의 중복을 실제 번역 대안으로 수정했습니다.
