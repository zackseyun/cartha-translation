    rationale: 여기서 לְ는 다윗을 위한 약속 및 다윗과의 관련을 나타냅니다. ‘다윗을 위하여’는 원문의 범위를 확대하지 않으면서 한국어 문장 결합을 개선합니다.
  - severity: low
