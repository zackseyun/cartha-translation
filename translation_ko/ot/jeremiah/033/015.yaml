  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֤ים הָ/הֵם֙ וּ/בָ/עֵ֣ת הַ/הִ֔יא אַצְמִ֥יחַ לְ/דָוִ֖ד צֶ֣מַח צְדָקָ֑ה וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/015.yaml
  text: In those days and at that time I will cause a righteous Branch to sprout for David[b][a], and he will execute justice and righteousness in the land.
  footnotes:
  - marker: a
    text: 'Or ''a Branch of righteousness''; also possible: ''a just Branch.'''
    reason: lexical_alternative
  - marker: b
    text: '''Branch'' likely echoes the promised Davidic ruler in Jeremiah 23:5.'
    reason: cross_reference
translation:
  language: ko
  text: 그날들과 그때에 내가 다윗에게 의로운 가지를 돋아나게 하겠으며, 그가 이 땅에서 정의와 의를 실행할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의로운 가지’; ‘의로운 가지’보다 ‘공의로운 가지’ 또는 ‘정의로운 가지’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘가지’는 예레미야 23:5의 다윗계 약속을 연상시키는 표현일 가능성이 큽니다.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם וּבָעֵת הַהִיא
  english_pob_choice: In those days and at that time
  chosen_korean: 그날들과 그때에
  alternatives_korean:
  - 그날들에 그때에
  - 그때 그날들에
  lexicon: HALOT
  rationale: 평행된 시간 표지를 자연스러운 한국어로 유지하되, 두 표현을 함께 살려 종말론적 시점을 강조했습니다.
- source_word: אַצְמִיחַ
  english_pob_choice: I will cause ... to sprout
  chosen_korean: 돋아나게 하겠으며
  alternatives_korean:
  - 자라게 하겠으며
  - 싹트게 하겠으며
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서 식물 이미지도 보존하기 위해 ‘돋아나게 하다’를 택했습니다.
- source_word: צֶמַח
  english_pob_choice: Branch
  chosen_korean: 가지
  alternatives_korean:
  - 싹
  - 순
  lexicon: HALOT
  rationale: 문맥상 다윗 계열의 왕적 인물을 가리키는 은유를 한국어로 직접 살리되, 과도한 해설어를 피했습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 정의와 공의
  lexicon: HALOT
  rationale: מִשְׁפָּט는 사회·통치 맥락에서 ‘정의’가 자연스럽고, צְדָקָה는 프로젝트 기본값대로 ‘의’로 옮겼습니다.
theological_decisions:
- issue: צֶמַח의 메시아적 함의
  chosen_reading: ‘가지’를 단순 식물 묘사로만 축소하지 않고, 다윗에게 주어지는 왕적 약속의 표지로 읽었습니다.
  alternative_readings:
  - 일반적인 ‘나뭇가지/싹’으로만 읽음
  rationale: 예레미야 23:5와의 강한 연관을 고려하면, 본절의 צֶמַח은 다윗 왕조의 약속된 통치자를 암시합니다. 한국어 본문에서는 과잉 설명 없이 은유를 유지했습니다.
  doctrine_reference: '예레미야 23:5 평행 본문; 번역 원칙 #1, #5'
