    rationale: 영어 감사 기록의 ‘a Branch of righteousness’ 및 ‘a just Branch’에 대응하도록 ‘의의 가지’, ‘정의로운 가지’ 등의 실제 대안을 제시해야 합니다.
  - severity: low
