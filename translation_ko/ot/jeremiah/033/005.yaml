id: JER.33.5
reference: Jeremiah 33:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּאִ֗ים לְ/הִלָּחֵם֙ אֶת הַ/כַּשְׂדִּ֔ים וּ/לְ/מַלְאָ/ם֙ אֶת פִּגְרֵ֣י הָ/אָדָ֔ם אֲשֶׁר הִכֵּ֥יתִי בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את עַ֖ל כָּל רָעָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/005.yaml
  text: They are coming to fight against the Chaldeans but only to fill them with the corpses of the men whom I struck down in my anger and in my wrath[c][b][a], and from this city I have hidden my face because of all their evil.
  footnotes:
  - marker: a
    text: Or 'the Babylonians.' The Hebrew reads 'the Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to fill them,' likely referring to the houses or fortifications mentioned in the previous verse.
    reason: cross_reference
  - marker: c
    text: Or 'the corpses of humankind' / 'human corpses.' Hebrew 'adam' can denote man or humankind depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 갈대아인들과 싸우러 오지만, 내가 내 분노와 진노 가운데 쳐 죽인 사람들의 시체로 그들을 채우려는 것일 뿐이며, 내가 이 성읍에서 그들의 모든 악 때문에 내 얼굴을 숨겼습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바벨론 사람들.’ 히브리어는 ‘갈대아인들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들을 채우려는 것’으로, 앞 절에 언급된 집들 또는 성벽을 가리킬 가능성이 있습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘인간의 시체들’ / ‘사람의 시체들.’ 히브리어 ‘아담’은 문맥에 따라 사람 또는 인류를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאִ֗ים
  english_pob_choice: They are coming
  chosen_korean: 그들은 … 오지만
  alternatives_korean:
  - 그들은 옵니다
  - 그들이 오고 있습니다
  lexicon: HALOT
  rationale: 분사형의 진행·임박성을 한국어 현재 진행/현재형으로 자연스럽게 살렸습니다.
- source_word: לְהִלָּחֵם אֶת הַכַּשְׂדִּים
  english_pob_choice: to fight against the Chaldeans
  chosen_korean: 갈대아인들과 싸우러
  alternatives_korean:
  - 갈대아인들과 싸우기 위해
  - 갈대아인들과 전쟁하러
  lexicon: HALOT
  rationale: אֶת가 붙은 대적 관계를 한국어의 ‘~와 싸우다’로 직역성 있게 반영했습니다.
- source_word: וּ/לְ/מַלְאָ/ם
  english_pob_choice: but only to fill them
  chosen_korean: … 채우려는 것일 뿐이며
  alternatives_korean:
  - … 채우려는 것이며
  - … 채우기 위함이며
  lexicon: HALOT
  rationale: 평이한 ‘그리고’보다, 문맥상 전투 목적이 역설적으로 시체로 채우는 결과가 된다는 해석을 살려 POB의 결과적 뉘앙스를 반영했습니다.
- source_word: פִּגְרֵ֣י הָ/אָדָ֔ם
  english_pob_choice: the corpses of the men
  chosen_korean: 사람들의 시체
  alternatives_korean:
  - 사람들의 주검
  - 인간의 시체
  lexicon: HALOT
  rationale: פגר의 강한 ‘주검/시체’ 의미를 유지하되, אָדָם은 여기서 전쟁으로 죽은 구체적 사람들을 가리키므로 ‘사람들’로 옮겼습니다.
- source_word: בְ/אַפִּ֖/י וּ/בַ/חֲמָתִ֑/י
  english_pob_choice: in my anger and in my wrath
  chosen_korean: 내 분노와 진노 가운데
  alternatives_korean:
  - 내 노와 진노 가운데
  - 내 분노와 격노 가운데
  lexicon: HALOT
  rationale: אַף와 חֵמָה의 중첩된 심판 정서를 ‘분노/진노’로 구분해 살렸습니다.
- source_word: וַ/אֲשֶׁ֨ר הִסְתַּ֤רְתִּי פָנַ/י֙ מֵ/הָ/עִ֣יר הַ/זֹּ֔את
  english_pob_choice: and from this city I have hidden my face
  chosen_korean: 내가 이 성읍에서 내 얼굴을 숨겼습니다
  alternatives_korean:
  - 내가 이 성읍에서 내 얼굴을 가렸습니다
  - 내가 이 성읍으로부터 내 얼굴을 숨겼습니다
  lexicon: HALOT
  rationale: 하나님의 임재/호의를 거두는 관용구를 직설적으로 보존하기 위해 ‘얼굴을 숨기다’를 유지했습니다.
theological_decisions:
- issue: 신적 심판과 얼굴을 숨김의 직설성
  chosen_reading: ‘내가 내 분노와 진노 가운데 쳐 죽인’과 ‘내 얼굴을 숨겼습니다’를 그대로 살렸습니다.
  alternative_readings:
  - 재난을 비인격적으로 완화해서 표현함
  - ‘얼굴을 숨기다’를 단순한 거리두기로 완화함
  rationale: 본문은 하나님 자신이 심판하셨고, 언약적 관용구로서 얼굴을 숨기셨다고 말하므로 그 신학적 무게를 약화하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: 와우 접속과 결과 진술의 한국어 처리
  chosen_reading: 전투 목적이 오히려 시체로 채우는 결과가 된다는 역설을 ‘채우려는 것일 뿐이며’로 반영했습니다.
  alternative_readings:
  - 단순히 ‘그리고 채우려는’으로 직역함
  - 해석을 덜어내고 결과성을 약화함
  rationale: 히브리어의 종속/결과 관계와 POB의 audit trail을 따라, 전쟁 행위의 역설적 종결을 한국어에서 읽히게 했습니다.
  doctrine_reference: Translation philosophy §§2, 5
