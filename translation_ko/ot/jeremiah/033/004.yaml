  text: כִּי֩ כֹ֨ה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל עַל בָּתֵּי֙ הָ/עִ֣יר הַ/זֹּ֔את וְ/עַל בָּתֵּ֖י מַלְכֵ֣י יְהוּדָ֑ה הַ/נְּתֻצִ֕ים אֶל הַ/סֹּלְל֖וֹת וְ/אֶל הֶ/חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/004.yaml
  text: 'For thus says Yahweh, the God of Israel, concerning the houses of this city and the houses of the kings of Judah that are being torn down for the siege ramps and for the sword:'
  footnotes:
  - marker: a
    text: Or 'the palaces of the kings of Judah.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the siege mounds' or 'the siegeworks.'
    reason: lexical_alternative
  - marker: c
    text: '''The sword'' is a Hebrew figure for warfare or slaughter.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 야훼, 곧 이스라엘의 하나님께서 말씀하신 것입니다. 이 성읍의 집들과 유다 왕들의 집들이 포위 진지와 칼을 위하여 무너지고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다 왕들의 궁전들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포위 성벽’이나 ‘공성 진지’.
    reason: lexical_alternative
  - marker: c
    text: ‘칼’은 히브리어에서 전쟁이나 학살을 가리키는 비유적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: 이는 …께서 말씀하신 것입니다
  alternatives_korean:
  - 이는 …께서 이렇게 말씀하십니다
  - 곧 …께서 말씀하신 바입니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식을 한국어 합쇼체로 자연스럽게 옮기되, 앞선 문맥을 받는 설명의 힘을 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학술적 표기인 야훼로 옮겨 언약적 고유성을 보존했습니다.
- source_word: בָּתֵּי הָעִיר הַזֹּאת
  english_pob_choice: the houses of this city
  chosen_korean: 이 성읍의 집들
  alternatives_korean:
  - 이 도시의 집들
  - 이 성읍 안의 집들
  lexicon: HALOT
  rationale: 히브리어의 집합적 표현을 살리면서도 한국어에서 자연스러운 ‘성읍’으로 옮겼습니다.
- source_word: הַנְּתֻצִים
  english_pob_choice: that are being torn down
  chosen_korean: 무너지고 있습니다
  alternatives_korean:
  - 허물어지고 있습니다
  - 무너져 있습니다
  lexicon: HALOT
  rationale: 분사형의 진행적 상태를 반영해 현재 진행형으로 옮겼고, 전시 파괴의 장면을 자연스럽게 드러냈습니다.
- source_word: הַסֹּלְלוֹת
  english_pob_choice: the siege ramps
  chosen_korean: 포위 진지
  alternatives_korean:
  - 공성 토성
  - 포위용 둑
  lexicon: HALOT
  rationale: 문맥상 공성 장비/진지를 가리키므로, 한국어 독자에게도 이해되는 군사 용어로 전달했습니다.
theological_decisions:
