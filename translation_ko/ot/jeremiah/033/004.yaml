    issue: ‘포위 성벽’ 각주는 סֹלְלוֹת의 통상적 의미와 맞지 않습니다.
    rationale: 이 말은 일반적으로 포위용 둑·토루·공성 시설을 가리키며, 성벽 자체를 뜻하지 않습니다.
