    rationale: 원문은 야훼의 발화가 집들에 ‘관하여’ 이루어진다고 말합니다. 초안은 이를 두 문장으로 분리해 발화의 대상이 사라졌습니다.
  - severity: medium
    issue: 분사 הַנְּתֻצִים의 수식 범위가 불명확합니다.
    rationale: 히브리어에서 이 분사는 앞의 두 종류의 집들을 함께 수식합니다. 이를 ‘곧 … 집들’로 풀어 두 대상을 함께 받도록 해야 합니다.
