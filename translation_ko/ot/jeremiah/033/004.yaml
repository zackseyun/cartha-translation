  rationale: 원문 신명 יְהוָה를 직접 드러내어 예언 화자의 권위를 보존하고, 프로젝트의 표준 표기를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
