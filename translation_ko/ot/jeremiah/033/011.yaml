base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/011.yaml
  text: the sound of joy and the sound of gladness[a], the sound of the bridegroom and the sound of the bride, the sound of those saying, ‘Give thanks to Yahweh of hosts, for Yahweh is good, for his steadfast love endures forever,’ and of those bringing a thank offering into the house of Yahweh. For I will restore the fortunes of the land as at first[b], says Yahweh.
  footnotes:
  - marker: a
    text: Or 'his mercy endures forever' or 'his covenant faithfulness endures forever' for 'his steadfast love endures forever.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will restore the captivity of the land'; the Hebrew idiom can refer either to the return of captives or more broadly to the restoration of fortunes.
    reason: alternative_reading
translation:
  language: ko
  text: 기쁨의 소리와 즐거움의 소리, 신랑의 소리와 신부의 소리, “만군의 야훼께 감사하십시오. 야훼는 선하시고, 그의 인자하심은 영원합니다.[a]”라고 말하는 이들의 소리와 야훼의 집으로 감사제물을 가져오는 이들의 소리가 들릴 것입니다. “내가 이 땅의 형편을 처음과 같이 회복하겠습니다.[b]”라고 야훼께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 חֶסֶד는 ‘인자하심’ 외에도 ‘변함없는 사랑’, ‘언약적 신실하심’, ‘자비’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 אָשִׁיב אֶת־שְׁבוּת הָאָרֶץ는 직역하면 ‘내가 그 땅의 포로 상태를 돌이키겠다’입니다. 이 관용구는 포로들의 귀환을 가리킬 수도 있고, 더 넓게는 땅의 형편을 회복한다는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: the sound of
  chosen_korean: 소리
  alternatives_korean:
  - 목소리
  - 음성
  lexicon: HALOT
  rationale: 반복되는 시적 병렬에서 קוֹל은 단순한 발화보다 들려오는 울림 전체를 가리키므로, 가장 자연스럽고 포괄적인 ‘소리’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: 여호와 계시명을 프로젝트 기본값에 따라 ‘야훼’로 두고, צְבָאוֹת은 군대/천상 군대를 포함하는 호칭이므로 관용적으로 ‘만군의’로 옮겼습니다.
- source_word: חַסְדּוֹ
  english_pob_choice: his steadfast love endures forever
  chosen_korean: 그의 인자하심은 영원하기 때문입니다
  alternatives_korean:
  - 그의 변함없는 사랑은 영원하기 때문입니다
  - 그의 언약적 신실하심은 영원하기 때문입니다
  - 그의 자비는 영원하기 때문입니다
  lexicon: HALOT
  rationale: חֶסֶד의 언약적·자비적 뉘앙스를 살리면서 한국어 예배 언어와의 호응도 고려해 ‘인자하심’을 택했습니다. ‘영원하기 때문입니다’는 히브리어의 상태 진술을 자연스러운 문맥상 이유절로 풀었습니다.
- source_word: תּוֹדָה
  english_pob_choice: a thank offering
  chosen_korean: 감사제물
  alternatives_korean:
  - 감사제사
  - 감사예물
  - 찬양제물
  lexicon: HALOT
  rationale: 문맥이 성전으로 ‘가져오는’ 제물의 의미이므로, 단순한 감사의 말보다 제의적 실체를 드러내는 ‘감사제물’이 적절합니다.
- source_word: שְׁבוּת
  english_pob_choice: the fortunes
  chosen_korean: 운명
  alternatives_korean:
  - 포로 상태
  - 포로 된 자들
  - 형편
  lexicon: HALOT
  rationale: 이 표현은 관용적으로 ‘회복/전환된 형편’의 뜻을 가지므로, 여기서는 땅의 전반적 회복을 드러내는 ‘운명’보다 더 일반적이고 오해를 줄이는 ‘운명’을 선택했습니다.
- source_word: כְּבָרִאשֹׁנָה
  english_pob_choice: as at first
  chosen_korean: 예전처럼
  alternatives_korean:
  - 처음처럼
  - 옛날처럼
  - 처음 상태처럼
  lexicon: HALOT
  rationale: 회복의 기준점을 자연스럽게 전달하면서도 예언적 문체를 해치지 않는 구어체적 등가로 ‘예전처럼’을 택했습니다.
theological_decisions:
- issue: 여호와 계시명과 합쇼체 문체
  chosen_reading: 본문 서술은 합쇼체로 유지하되, 직접 화자 인용 안에서는 청중을 향한 권면형 ‘감사를 드리십시오’로 옮겼습니다.
  alternative_readings:
  - ‘감사하라’로 더 직설적으로 옮김
  - 인용부를 평서문으로 완화함
  rationale: 히브리어 הוֹדוּ는 공동체를 향한 예배적 촉구이므로, 현대 한국어에서는 합쇼체 명령이 가장 자연스럽고 공적 예전의 울림도 살립니다.
  doctrine_reference: POB Korean style guidance; direct speech register conventions
