id: JER.33.22
reference: Jeremiah 33:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֲשֶׁ֤ר לֹֽא יִסָּפֵר֙ צְבָ֣א הַ/שָּׁמַ֔יִם וְ/לֹ֥א יִמַּ֖ד ח֣וֹל הַ/יָּ֑ם כֵּ֣ן אַרְבֶּ֗ה אֶת זֶ֨רַע֙ דָּוִ֣ד עַבְדִּ֔/י וְ/אֶת הַ/לְוִיִּ֖ם מְשָׁרְתֵ֥י אֹתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/022.yaml
  text: As the host of heaven cannot be counted and the sand of the sea cannot be measured[d][c][b][a], so I will multiply the offspring of David my servant and the Levites who minister to me.
  footnotes:
  - marker: a
    text: Or 'cannot be numbered' for 'cannot be counted.'
    reason: lexical_alternative
  - marker: b
    text: '''Host of heaven'' is a Hebrew idiom for the heavenly multitude, often including the stars.'
    reason: cultural_note
  - marker: c
    text: Or 'the seed of David' or 'the descendants of David.'
    reason: lexical_alternative
  - marker: d
    text: Or 'who serve me'; the Hebrew can denote ongoing cultic service.
    reason: lexical_alternative
translation:
  language: ko
  text: 하늘의 군대는 셀 수 없고 바다의 모래는 헤아릴 수 없는 것처럼, 내가 내 종 다윗의 자손과 나를 섬기는 레위 사람들을 번성하게 하겠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 군대’는 히브리어 관용구로, 종종 별들을 포함한 천상의 무리를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘셀 수 없다’는 ‘번호를 매길 수 없다/헤아릴 수 없다’는 뜻의 자연스러운 현대어 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘다윗의 자손’ 또는 ‘다윗의 씨’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘나를 섬기는’은 ‘나를 섬기다/봉사하다’의 지속적 성전 봉사를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְבָא הַשָּׁמַיִם
  english_pob_choice: the host of heaven
  chosen_korean: 하늘의 군대
  alternatives_korean:
  - 하늘의 군세
  - 하늘의 군대들
  - 하늘의 천상 무리
  lexicon: HALOT
  rationale: צָבָא의 기본 의미는 군대/군세이며, 영어 POB의 idiom을 한국어로 자연스럽게 옮기되 천체를 과도하게 특정하지 않기 위해 ‘하늘의 군대’를 택했습니다.
- source_word: יִסָּפֵר / יִמַּד
  english_pob_choice: cannot be counted / cannot be measured
  chosen_korean: 셀 수 없고 … 헤아릴 수 없는
  alternatives_korean:
  - 헤아릴 수 없고 … 잴 수 없는
  - 수효를 셀 수 없고 … 측량할 수 없는
  - 계산할 수 없고 … 측정할 수 없는
  lexicon: HALOT
  rationale: 동사의 병렬 구조를 살려 ‘셀 수 없고 / 헤아릴 수 없는’으로 옮겼습니다. ‘헤아리다’는 수량의 불가산성과 크기의 불가측성을 모두 자연스럽게 담습니다.
- source_word: זֶרַע דָּוִד עַבְדִּי
  english_pob_choice: the offspring of David my servant
  chosen_korean: 내 종 다윗의 자손
  alternatives_korean:
  - 내 종 다윗의 씨
  - 다윗 내 종의 후손
  - 다윗의 후손
  lexicon: HALOT
  rationale: זֶרַע는 집합적 의미의 ‘자손/후손’을 가리키므로, 현대 한국어에서 자연스럽고 집합성을 보존하는 ‘자손’을 택했습니다. עַבְדִּי는 왕적-언약적 호칭이므로 ‘종’으로 옮겼습니다.
- source_word: מְשָׁרְתֵי אֹתִי
  english_pob_choice: who minister to me
  chosen_korean: 나를 섬기는
  alternatives_korean:
  - 내게 봉사하는
  - 내게 예배를 드리는
  - 내 앞에서 섬기는
  lexicon: HALOT
  rationale: 분사형은 지속적 성격의 성전 봉사를 가리키므로, 영어 POB의 ‘minister’에 맞춰 단순한 일반 봉사보다 예배·성전적 뉘앙스가 남는 ‘섬기는’으로 처리했습니다.
theological_decisions:
- issue: 다윗의 자손과 레위 사람들의 병렬 약속
  chosen_reading: 이 절은 다윗의 자손과 레위 사람들을 각각 무수히 번성시키겠다는 약속을 병렬로 제시하며, 그 성취의 구체적 방식은 본문에서 해명하지 않습니다.
  alternative_readings:
  - 레위 사람들을 역사적 성전 봉사자들로 한정하여 읽을 수 있음
  - 후대의 메시아적 성취와 연결해 읽을 수 있으나 본절은 이를 명시하지 않음
  rationale: 히브리어는 두 대상을 직접목적으로 병렬 제시하므로, 본문이 가진 긴장을 유지하고 후대 신학을 본문 본문에 미리 주입하지 않도록 했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
