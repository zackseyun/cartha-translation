  terminology: ‘내 종 다윗’, ‘레위 사람들’, ‘나를 섬기는’은 문맥과 한국어 성서 문체에 적절합니다. ‘하늘의 군대’는 별들만으로 한정하지 않아 원문의 폭을 보존합니다.
