id: JER.33.12
reference: Jeremiah 33:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַר֮ יְהוָ֣ה צְבָאוֹת֒ ע֞וֹד יִֽהְיֶ֣ה בַּ/מָּק֣וֹם הַ/זֶּ֗ה הֶ/חָרֵ֛ב מֵֽ/אֵין אָדָ֥ם וְ/עַד בְּהֵמָ֖ה וּ/בְ/כָל עָרָ֑י/ו נְוֵ֣ה רֹעִ֔ים מַרְבִּצִ֖ים צֹֽאן־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/012.yaml
  text: 'Thus says Yahweh of hosts: Yet again there will be in this place[a], which is desolate, without man or beast, and in all its cities, a pasture of shepherds[c][b], where they make flocks lie down.'
  footnotes:
  - marker: a
    text: Or 'again' or 'once more' for 'Yet again.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'without man or beast,' a stock expression for total desolation.
    reason: cultural_note
  - marker: c
    text: Or 'a habitation of shepherds' or 'a fold for shepherds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. “사람도 짐승도 없이[b] 황폐한 이곳과 그 모든 성읍에, 목자들이 양 떼를 쉬게 하는 목초지[c]가 다시[a] 생길 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘또다시’ 또는 ‘한번 더’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘사람도 짐승도 없이’는 완전한 황폐를 나타내는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘목자들의 거처’ 혹은 ‘목자들의 우리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 하나님
  lexicon: HALOT
  rationale: צְבָאוֹת의 군대/천상 군대를 포괄하는 관용을 살려 ‘만군의’로 옮기고, 신명은 프로젝트 기본값대로 ‘야훼’로 유지했습니다.
- source_word: עוֹד יִהְיֶה
  english_pob_choice: Yet again there will be
  chosen_korean: 여전히 … 다시 생길 것입니다
  alternatives_korean:
  - 또다시 있을 것입니다
  - 한번 더 있을 것입니다
  lexicon: HALOT
  rationale: עוֹד의 반복·회복 뉘앙스를 살리되, 한국어에서는 예언적 미래를 자연스럽게 드러내기 위해 ‘다시 생길 것입니다’로 옮겼습니다.
- source_word: נְוֵה רֹעִים
  english_pob_choice: a pasture of shepherds
  chosen_korean: 목자들의 풀밭
  alternatives_korean:
  - 목자들의 거처
  - 목자들의 우리
  - 목자들의 목초지
  lexicon: HALOT
  rationale: נְוֵה는 문맥상 목자와 양 떼가 함께하는 목축 공간이므로 ‘풀밭’으로 풀어 자연스럽게 옮기되, 소유 관계는 ‘목자들의’로 반영했습니다.
- source_word: מַרְבִּצִים צֹאן
  english_pob_choice: where they make flocks lie down
  chosen_korean: 그들이 양 떼를 쉬게 하는 곳
  alternatives_korean:
  - 그들이 양 떼를 눕히는 곳
  - 그들이 양 떼를 눕혀 쉬게 하는 곳
  lexicon: HALOT
  rationale: 히필 분사의 사역 의미를 살려 ‘쉬게 하다’로 옮겼으며, ‘양 떼’는 집합명사의 자연스러운 한국어 대응입니다.
theological_decisions:
- issue: ‘without man or beast’의 depopulation 관용구 처리
  chosen_reading: ‘사람도 짐승도 없고’로 옮겨 총체적 황폐를 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘사람이나 짐승도 없이’
  - ‘인간도 가축도 없이’
  rationale: אָדָם/בְּהֵמָה의 대구는 완전한 무인·무축 상태를 뜻하는 관용구이므로, 이를 완곡하게 바꾸지 않고 예언의 황폐 이미지를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md §Translation philosophy 4; Contested terms: אָדָם'
