- from: 내가 그들의 모든 죄악에서 그들을 정결하게 하겠습니다. 그들이 나에게 범죄했기 때문입니다. 또한 내가 그들의 모든 죄악을 용서하겠습니다. 그들이 나에게 범죄하고 나에게 반역했기 때문입니다.
  to: 내가 그들이 내게 죄를 지은 모든 죄악에서 그들을 정결하게 하겠습니다. 또 내가 그들이 내게 죄를 짓고 나를 거역한 모든 죄악을 용서하겠습니다.
