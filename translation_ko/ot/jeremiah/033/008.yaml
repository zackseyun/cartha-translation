id: JER.33.8
reference: Jeremiah 33:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/טִ֣הַרְתִּ֔י/ם מִ/כָּל עֲוֺנָ֖/ם אֲשֶׁ֣ר חָֽטְאוּ לִ֑/י וְ/סָלַחְתִּ֗י ל/כול עֲוֺנֽוֹתֵי/הֶם֙ אֲשֶׁ֣ר חָֽטְאוּ לִ֔/י וַ/אֲשֶׁ֖ר פָּ֥שְׁעוּ בִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/008.yaml
  text: And I will cleanse them from all their guilt by which they have sinned against me[b][a], and I will forgive all their guilty deeds by which they have sinned against me and by which they have rebelled against me.
  footnotes:
  - marker: a
    text: Or 'from all their iniquity.' The Hebrew עָוֹן can denote both wrongdoing and the guilt that comes from it.
    reason: lexical_alternative
  - marker: b
    text: Or 'all their iniquities.' The Hebrew again uses עָוֹן, here in the plural, emphasizing their many culpable offenses.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들이 내게 죄를 지은 모든 죄악에서 그들을 정결하게 하겠습니다. 또 내가 그들이 내게 죄를 짓고 나를 거역한 모든 죄악을 용서하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטִהַרְתִּים
  english_pob_choice: And I will cleanse them
  chosen_korean: 내가 그들을 정결하게 하겠습니다
  alternatives_korean:
  - 내가 그들을 깨끗하게 하겠습니다
  - 내가 그들을 씻어 정결하게 하겠습니다
  lexicon: HALOT
  rationale: טהר의 피엘은 정결/정화의 의미를 가지며, 현대 한국어에서는 ‘정결하게 하다’가 도덕적·언약적 정화를 모두 무리 없이 드러냅니다.
- source_word: מִכָּל עֲוֺנָם
  english_pob_choice: from all their guilt
  chosen_korean: 그들의 모든 죄악에서
  alternatives_korean:
  - 그들의 모든 죄책에서
  - 그들의 모든 불의에서
  lexicon: HALOT
  rationale: עָוֹן은 죄악 자체와 그로 인한 책임을 함께 담을 수 있으므로, ‘죄악’이 본문의 도덕적 오염과 책임성을 함께 가장 자연스럽게 드러냅니다.
- source_word: ל/כול עֲוֺנֽוֹתֵיהֶם
  english_pob_choice: all their guilty deeds
  chosen_korean: 그들의 모든 죄악을
  alternatives_korean:
  - 그들의 모든 죄들
  - 그들의 모든 죄책들을
  lexicon: HALOT
  rationale: 복수형 עֲוֺנוֹת는 구체적이고 반복된 culpable acts를 가리키므로, 앞절과 같은 ‘죄악’을 유지하되 복수 맥락은 문장 전체와 연결된 반복적 열거로 반영했습니다.
- source_word: וַ/אֲשֶׁר פָּ֥שְׁעוּ בִֽ/י
  english_pob_choice: and by which they have rebelled against me
  chosen_korean: 그들이 나에게 반역했기 때문입니다
  alternatives_korean:
  - 그들이 나에게 저항했기 때문입니다
  - 그들이 나에게 반역한 일로
  lexicon: HALOT
  rationale: פָּשַׁע는 단순한 위반보다 권위에 대한 반역/배반의 뉘앙스가 강하므로, 관계적·언약적 긴장을 보존하는 ‘반역’이 적절합니다.
theological_decisions:
- issue: כָּל-עָוֹן / עֲוֺנוֹתֵיהֶם의 반복과 분화
  chosen_reading: 두 번의 עָוֹן 계열 표현을 모두 ‘죄악’으로 유지하되, 첫째는 정결의 대상, 둘째는 용서의 대상이라는 문맥적 차이를 살렸습니다.
  alternative_readings:
  - 첫째를 ‘죄책’, 둘째를 ‘죄들’로 구분하기
  - 둘 다 ‘불의’로 옮기기
  rationale: 히브리어는 죄의 오염성과 다발성을 함께 쌓아 보여 주므로, 한국어에서도 동일 어휘를 반복해 본문의 누적 효과를 유지하는 편이 더 충실합니다.
  doctrine_reference: Jeremiah 33:8의 죄·정결·용서 어휘 대비
- issue: חָטְאוּ לִי / פָּשְׁעוּ בִי의 죄 진술
  chosen_reading: ‘나에게 범죄하다’와 ‘나에게 반역하다’를 구분해, 일반적 죄와 언약적 반역의 층위를 함께 드러냈습니다.
  alternative_readings:
  - 모두 ‘죄를 짓다’로 평준화하기
  - ‘거역하다’로만 처리하기
  rationale: 본문은 동일한 대상을 향한 죄를 여러 방식으로 누적하므로, 평준화하면 히브리어가 의도한 도덕적·언약적 긴장이 약해집니다.
  doctrine_reference: 'Translation philosophy: preserve lexical and covenantal tensions'
