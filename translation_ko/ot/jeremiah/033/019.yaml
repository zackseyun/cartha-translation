- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 여호와의 말씀
  alternatives_korean:
  - 야훼의 말씀
  - 하나님의 말씀
  lexicon: HALOT
  rationale: 원문은 예언자적 관용구인 ‘여호와의 말씀’이며, 한국어 성경 전통에서 널리 통용되는 형태로 계시 발화의 공적·공식적 성격을 분명히 드러냅니다.
- source_word: אֶל יִרְמְיָהוּ
  english_pob_choice: to Jeremiah
  chosen_korean: 예레미야에게
  alternatives_korean:
  - 예레미야를 향하여
  - 예레미야에게로
  lexicon: HALOT
  rationale: 목적어 표지는 수신자를 나타내므로 한국어 조사 ‘에게’로 자연스럽게 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하시기를
  alternatives_korean:
  - 이르시되
  - 말하여 이르시기를
  lexicon: HALOT
  rationale: 뒤에 이어질 직접 발화를 여는 표현으로, 예언적 전달을 살리면서 한국어 문장 연결에 맞는 ‘말씀하시기를’을 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 본문에는 전통적 예언 관용구에 맞추어 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절은 독립적 신학 논쟁보다 공식 문구의 반복성이 중요하므로, 한국어 독자에게 즉시 인식되는 예언 공식 ‘여호와의 말씀’을 유지했습니다. 다만 원어상의 신명성은 그대로 보존됩니다.
