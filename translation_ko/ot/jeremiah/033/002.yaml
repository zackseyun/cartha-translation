id: JER.33.2
reference: Jeremiah 33:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֥ר יְהוָ֖ה עֹשָׂ֑/הּ יְהוָ֗ה יוֹצֵ֥ר אוֹתָ֛/הּ לַ/הֲכִינָ֖/הּ יְהוָ֥ה שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/002.yaml
  text: 'Thus says Yahweh[a], who made it[c][b], Yahweh who formed it to establish it—Yahweh is his name:'
  footnotes:
  - marker: a
    text: Or 'who does it ... who forms it to establish it.' The Hebrew participles can be rendered with a more present, ongoing sense.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'the LORD' renders the divine name YHWH each time; alternatively, some translations use 'Yahweh.'
    reason: alternative_reading
  - marker: c
    text: The feminine suffixes in 'made it ... formed it ... establish it' could also be rendered 'her,' but the verse does not explicitly identify the referent.
    reason: lexical_alternative
translation:
  language: ko
  text: 「야훼께서 이와 같이 말씀하십니다. 그분이 그것을 만드셨고, 야훼께서 그것을 지어 그것을 견고하게 하시며, 야훼가 그 이름입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 분사는 ‘만드시는/짓는’처럼 현재적·진행적 뉘앙스로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 ‘야훼’는 히브리어 신적 이름 YHWH를 옮긴 것입니다. 일부 번역은 전통적으로 ‘주’로 번역합니다.
    reason: alternative_reading
  - marker: c
    text: ‘만드셨고 / 지어 / 견고하게’의 여성형 접미사는 히브리어상 여성형 지시를 보이지만, 이 절만으로 그 대상이 명시되지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 「이와 같이 말씀하십니다」
  alternatives_korean:
  - 「이와 같이 말씀하셨습니다」
  - 「이와 같이 말씀하십니다」
  lexicon: HALOT
  rationale: 예언 선포 공식이므로 현재형 선언으로 옮겨 현장감을 살렸습니다. 한국어에서는 ‘이와 같이 말씀하십니다’가 격식을 유지하면서도 예언적 공시를 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 편집 기준에 따라 하나님의 고유명사는 대체 칭호가 아니라 음역형 ‘야훼’로 옮겼습니다.
- source_word: עֹשָׂהּ / יוֹצֵר אוֹתָהּ / לַהֲכִינָהּ
  english_pob_choice: who made it / who formed it / to establish it
  chosen_korean: 그분이 그것을 만드셨고 … 그것을 지어 그것을 견고하게 하시며
  alternatives_korean:
  - 그것을 지으시고 그것을 견고하게 하시며
  - 그분이 그것을 만드시고 그것을 형성하여 세우시며
  lexicon: HALOT
  rationale: 연속된 분사들을 ‘만드셨고, 지어 … 견고하게 하시며’로 살려 창조-형성-견고화의 점층을 보존했습니다. ‘견고하게 하다’는 כון의 ‘establish’ 의미를 가장 직접적으로 반영합니다.
- source_word: שְׁמוֹ
  english_pob_choice: his name
  chosen_korean: 그 이름입니다
  alternatives_korean:
  - 그분의 이름입니다
  - 이름은 그분의 것입니다
  lexicon: HALOT
  rationale: 히브리어의 식별 절구조를 살려 마지막에 신적 자기표명을 결론처럼 배치했습니다. 한국어에서는 ‘그 이름입니다’가 짧고 단정하게 이름 선언을 전달합니다.
theological_decisions:
- issue: 창조 대상의 지시어를 특정하지 않음
  chosen_reading: ‘그것’을 유지하여 히브리어의 암시적 대상을 그대로 두었습니다
  alternative_readings:
  - ‘그 땅’을 넣어 구체화
  - ‘그 성읍’을 넣어 구체화
  - ‘그녀’를 반영하여 번역
  rationale: 본문은 여성 어미 접미사를 사용하지만 바로 앞 절만으로는 지시 대상이 명시되지 않습니다. 한국어 번역에서도 대상을 특정하지 않아 원문의 긴장과 모호성을 유지했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it; original-language primacy'
