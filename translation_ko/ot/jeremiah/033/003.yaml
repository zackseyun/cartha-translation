    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֵלַי
  english_pob_choice: Call to me
  chosen_korean: 나에게 부르짖으십시오
  alternatives_korean:
  - 나에게 부르십시오
  - 나에게 외치십시오
  lexicon: WLC/HALOT
  rationale: 히브리어 קרא의 직설적 명령은 단순한 호출보다 하나님께 직접 호소하는 뉘앙스를 담을 수 있어, 문맥상 기도적 부름을 드러내는 ‘부르짖다’로 옮겼습니다.
- source_word: וְאֶעֱנֶךָּ
  english_pob_choice: and I will answer you
  chosen_korean: 그러면 내가 응답하고
  alternatives_korean:
  - 그리고 내가 대답하고
  - 내가 너에게 응답하고
  lexicon: WLC/HALOT
  rationale: ענה는 여기서 하나님의 응답 약속이므로 ‘응답하다’가 가장 직접적입니다. 앞절의 명령과 자연스럽게 이어지도록 ‘그러면’을 보탰습니다.
- source_word: וְאַגִּידָה לְּךָ
  english_pob_choice: and I will tell you
  chosen_korean: 당신에게 말해 주겠습니다
  alternatives_korean:
  - 당신에게 알려 주겠습니다
  - 당신에게 선언하겠습니다
  lexicon: WLC/Hiphil of נגד
  rationale: נגד의 히필은 ‘말하다/알리다/선언하다’의 범위가 있어, 인격적이고 직접적인 약속을 살리는 ‘말해 주다’가 적절합니다.
- source_word: וּבְצֻרוֹת
  english_pob_choice: hidden things
  chosen_korean: 숨겨진 일들
  alternatives_korean:
  - 접근할 수 없는 일들
  - 견고한 일들
  - 비밀스러운 일들
  lexicon: HALOT
  rationale: 문자적으로는 ‘견고한/막힌/접근하기 어려운’ 뜻의 폭이 있으나, 계시 문맥에서는 일반 지식 밖에 있는 것으로 드러나는 내용을 가리키므로 ‘숨겨진 일들’이 의미를 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: ‘크고 숨겨진 일들’의 계시적 성격
  chosen_reading: 하나님이 기도에 응답하여 알려 주시는, 인간이 스스로 알 수 없는 계시의 내용으로 읽었습니다.
  alternative_readings:
  - 단순한 정보 전달
  - 난해하지만 결국 인간이 추론 가능한 내용
  rationale: 본문의 약속은 기도의 응답과 연결된 하나님의 주권적 계시를 말하므로, 인간의 탐구 결과가 아니라 하나님이 열어 주시는 지식이라는 점을 분명히 해야 합니다.
  doctrine_reference: 계시론
