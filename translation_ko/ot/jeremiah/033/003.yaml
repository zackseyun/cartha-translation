  source_fidelity: ‘부르짖으십시오’는 קְרָא의 기본 명령형 ‘부르다/외치다’보다 강한 절박함을 덧붙입니다. 이 문맥에서 그러한 강도는 필수적으로 명시되지 않았으므로, 본문은 ‘나를 부르십시오’로 옮기는 편이 더 직접적입니다. 나머지 문장은 응답과 계시의 약속, 그리고 미지의 ‘크고 … 일들’이라는 구조를 충실히 반영합니다.
  naturalness: ‘나를 부르십시오’와 ‘알려 주겠습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘숨겨진 일들’도 계시 문맥에서 이해하기 쉽습니다.
