id: JER.33.16
reference: Jeremiah 33:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֤ים הָ/הֵם֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וִ/ירוּשָׁלִַ֖ם תִּשְׁכּ֣וֹן לָ/בֶ֑טַח וְ/זֶ֥ה אֲשֶׁר יִקְרָא לָ֖/הּ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/016.yaml
  text: 'In those days Judah will be saved[a], and Jerusalem will dwell securely[b]; and this is what she will be called: ‘Yahweh is our righteousness.’'
  footnotes:
  - marker: a
    text: Or, more formally, 'and this is the name by which she will be called.'
    reason: lexical_alternative
  - marker: b
    text: Jeremiah 23:6 applies the closely related title 'The LORD is our righteousness' to the coming Davidic king; here the grammar applies it to Jerusalem, likely echoing that earlier promise.
    reason: cross_reference
translation:
  language: ko
  text: '그때에 유다는 구원을 받고, 예루살렘은 안전히 살 것입니다. 그리고 예루살렘은 이렇게 불릴 것입니다[a]: “야훼는 우리의 의이십니다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 더 직역하면 “그리고 이것이 그녀에게 불릴 것입니다”입니다. 여성형 대명사는 예루살렘을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 예레미야 23:6은 가까이 관련된 칭호 “야훼는 우리의 의이십니다”를 장차 올 다윗 왕에게 적용합니다. 여기서는 문법상 이 칭호가 예루살렘에 적용되며, 앞선 약속을 반향하는 것으로 보입니다.
    reason: cross_reference
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그 날들에
  alternatives_korean:
  - 그 날에
  - 그때에
  lexicon: HALOT
  rationale: 예언서의 전형적인 미래 구원 시기 도입 표현을 한국어로 자연스럽게 옮기되, 시제의 거리감을 유지했습니다.
- source_word: תִּוָּשַׁע
  english_pob_choice: will be saved
  chosen_korean: 구원을 받을 것이며
  alternatives_korean:
  - 구원받을 것이며
  - 구출될 것이며
  lexicon: HALOT
  rationale: 니팔형의 수동적 구원 의미를 살리면서, 한국어에서 덜 기계적인 표현으로 옮겼습니다.
- source_word: תִּשְׁכּוֹן לָבֶטַח
  english_pob_choice: will dwell securely
  chosen_korean: 안전하게 살 것입니다
  alternatives_korean:
  - 안전하게 거할 것입니다
  - 평안히 살 것입니다
  lexicon: HALOT
  rationale: שׁכן의 ‘거하다/살다’ 의미와 לָבֶטַח의 안전성을 함께 담되, 현대 한국어에서 자연스러운 서술로 정리했습니다.
- source_word: יִקְרָא לָהּ
  english_pob_choice: she will be called
  chosen_korean: 그녀가 불릴 이름입니다
  alternatives_korean:
  - 그녀가 불릴 것입니다
  - 사람들이 그녀를 부를 이름입니다
  lexicon: HALOT
  rationale: 문법상 예루살렘을 가리키는 여성형 대명사를 살려, 명명 공식의 수동적 의미를 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: YHWH의 고유명사를 제목화하지 않고 음역하여, 본문의 언약적 이름을 보존했습니다.
- source_word: צִדְקֵנוּ
  english_pob_choice: is our righteousness
  chosen_korean: 우리의 의
  alternatives_korean:
  - 우리의 의로움
  - 우리의 정의
  lexicon: HALOT
  rationale: צדק 계열의 핵심 개념을 프로젝트 기본어인 ‘의’로 일관되게 옮겼고, 명명구조상 서술어 ‘이다’를 앞 문장에 두어 뜻을 분명히 했습니다.
theological_decisions:
- issue: 예루살렘에 적용되는 명명 공식과 예레미야 23:6의 왕적 칭호 사이의 관계
  chosen_reading: 본문은 문법적으로 예루살렘이 “야훼는 우리의 의”라는 이름으로 불리는 것으로 옮기고, 23:6과의 연결은 해석으로 강요하지 않습니다.
  alternative_readings:
  - 메시아적 칭호를 예루살렘에 직접 적용하는 번역
  - 두 본문을 하나의 칭호로 합쳐 번역하는 방식
  rationale: 여성형 대명사 לָהּ가 예루살렘을 가리키므로, 본문 문법을 우선해 번역하고 상호본문적 울림은 주석적 범위에 남기는 것이 원문에 충실합니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
- issue: 야훼의 이름을 명명 공식 안에서 어떻게 표시할 것인가
  chosen_reading: ‘야훼’로 옮겨 고유한 신적 이름을 드러냅니다.
  alternative_readings:
  - ‘주’로 대체
  - ‘여호와’로 음역
  rationale: 본문이 직접적으로 테트라그람마톤을 사용하므로, 제목화된 대체어보다 고유명 자체를 드러내는 것이 स्रोत भाषական 의미를 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
