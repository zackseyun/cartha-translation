id: JER.33.24
reference: Jeremiah 33:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֣וֹא רָאִ֗יתָ מָֽה הָ/עָ֤ם הַ/זֶּה֙ דִּבְּר֣וּ לֵ/אמֹ֔ר שְׁתֵּ֣י הַ/מִּשְׁפָּח֗וֹת אֲשֶׁ֨ר בָּחַ֧ר יְהוָ֛ה בָּ/הֶ֖ם וַ/יִּמְאָסֵ֑/ם וְ/אֶת עַמִּ/י֙ יִנְאָצ֔וּ/ן מִֽ/הְי֥וֹת ע֖וֹד גּ֥וֹי לִ/פְנֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/024.yaml
  text: Have you not seen what this people have spoken[a], saying, ‘The two families that Yahweh chose—he has rejected them’? Thus they despise my people[c][b], so that they should no longer be a nation before them.
  footnotes:
  - marker: a
    text: Or 'the two clans' or 'the two houses.' The Hebrew does not explicitly identify which two are meant.
    reason: lexical_alternative
  - marker: b
    text: Or 'he rejected them' / 'he cast them off.'
    reason: lexical_alternative
  - marker: c
    text: The final clause is literally 'from being still a nation before them,' likely meaning 'in their sight' or 'in their estimation.'
    reason: lexical_alternative
translation:
  language: ko
  text: “이 백성이 말한 것을 보지 못하셨습니까? 곧 ‘야훼께서 택하신 그 두 가족을 그가 버리셨다’고 말합니다. 그러므로 그들은 내 백성을 멸시하여, 자기들 앞에서 더 이상 한 민족이 되지 못하게 하려 합니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 두 가족’은 히브리어상 ‘그 두 씨족/가문/집안’으로도 옮길 수 있으며, 본문은 그 둘이 누구인지 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘버리셨다’는 ‘거절하셨다’ 또는 ‘내치셨다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 문자적으로는 ‘그들 앞에서 여전히 민족이 되는 것에서’에 가깝고, 문맥상 ‘그들 눈에/그들 평가에’라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא רָאִיתָ
  english_pob_choice: Have you not seen
  chosen_korean: 보지 못하셨습니까?
  alternatives_korean:
  - 보지 않으셨습니까?
  - 보셨지 않습니까?
  lexicon: HALOT
  rationale: 수사 의문문으로서 상대의 인지를 강하게 요구하므로, 한국어에서는 자연스러운 반문형으로 옮겼습니다.
- source_word: שְׁתֵּי הַמִּשְׁפָּחוֹת
  english_pob_choice: the two families
  chosen_korean: 그 두 가족
  alternatives_korean:
  - 그 두 집안
  - 그 두 가문
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת는 기본적으로 가족/가문/씨족을 가리키므로, 본문이 특정 대상을 명시하지 않는 긴장을 살려 ‘가족’으로 넓게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 음역해 고유성을 보존했습니다.
- source_word: וַיִּמְאָסֵם
  english_pob_choice: he has rejected them
  chosen_korean: 그가 버리셨다
  alternatives_korean:
  - 그가 거절하셨다
  - 그가 내치셨다
  lexicon: HALOT
  rationale: מָאַס는 단순한 거절보다 강한 배척/버림의 뜻이 있어, 한국어에서는 그 뉘앙스를 직접적으로 드러내는 ‘버리셨다’가 적절합니다.
- source_word: וְאֶת עַמִּי יִנְאָצוּן
  english_pob_choice: Thus they despise my people
  chosen_korean: 그러므로 그들은 내 백성을 멸시하여
  alternatives_korean:
  - 그리고 그들은 내 백성을 업신여겨
  - 그들은 내 백성을 깔보아
  lexicon: HALOT
  rationale: נָאַץ는 멸시/경멸을 뜻하므로, 예언적 비난의 강도를 유지하는 ‘멸시하다’로 옮겼습니다.
- source_word: מִהְיוֹת עוֹד גּוֹי לִפְנֵיהֶם
  english_pob_choice: so that they should no longer be a nation before them
  chosen_korean: 자기들 앞에서 더 이상 한 민족이 되지 못하게 하려 합니다
  alternatives_korean:
  - 자기들 앞에서 더 이상 민족으로 서지 못하게 하려 합니다
  - 그들 눈앞에서 더 이상 민족이 아니게 하려 합니다
  lexicon: HALOT
  rationale: 결과절과 관계적 표현을 한국어로 풀어, ‘before them’의 대면/평가의 뉘앙스를 살리면서도 자연스러운 문장으로 구성했습니다.
theological_decisions:
- issue: ‘the two families’의 특정 대상 미지정
  chosen_reading: 본문이 특정 두 집단을 명시하지 않으므로, ‘그 두 가족’으로 일반적으로 유지했습니다.
  alternative_readings:
  - 유다와 이스라엘
  - 다윗 왕가와 레위 가문
  rationale: 즉각 문맥과 해석 전통에는 후보가 있지만, 본문 자체는 명시하지 않으므로 해석을 앞서지 않고 모호성을 보존했습니다.
  doctrine_reference: 본문 우선, 불확정 referent는 해석으로 고정하지 않음
- issue: 마지막 절의 의미 범위
  chosen_reading: ‘더 이상 한 민족이 되지 못하게 하려 합니다’로, 원문의 수치적/평가적 배제를 모두 열어 두었습니다.
  alternative_readings:
  - 실제로 민족성이 소멸되게 하려 합니다
  - 그들 보기에 더 이상 민족이 아니게 하려 합니다
  rationale: 히브리어의 부정 부정사구는 존재론적 소멸보다 적대자들의 배제 의도를 드러내므로, 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: 원문 의미의 긴장 보존
