revisions:
- from: “이 백성이 말한 것을 보지 못하셨습니까? 곧 ‘야훼께서 택하신 그 두 가족을 그가 버리셨다’고 말합니다. 그러므로 그들은 내 백성을 멸시하여, 자기들 앞에서 더 이상 한 민족이 되지 못하게 하려 합니다.”[a][b][c]
  to: “이 백성이 한 말을 보지 못하셨습니까? 곧 ‘야훼께서 택하신 두 가문을 그분이 버리셨다’라고 한 말입니다. 그들은 내 백성을 멸시하여, 그들 보기에 내 백성이 더 이상 민족이 아니라고 여깁니다.”[a][b][c]
  rationale: 원문의 수사 의문, ‘말하여 이르되’의 인용 구조, 그리고 마지막 부정사구의 관점적·평가적 여지를 보존했습니다. 원문이 명시하지 않는 두 가문의 정체는 특정하지 않았으며, 마지막 절을 적대자들의 평가로 표현하여 객관적 민족 소멸이나 그들이 이를 일으키려는 의도를 본문에 추가하지 않았습니다.
