base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/033/025.yaml
  text: 'Thus says Yahweh: If I have not established my covenant with day and night[a], the fixed order of heaven and earth—'
  footnotes:
  - marker: a
    text: Or 'the statutes/ordinances of heaven and earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “내가 낮과 밤과 맺은 내 언약과 하늘과 땅의 정한 질서를 세우지 않았다면—”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘과 땅의 규례/법령들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이같이 말씀하십니다
  alternatives_korean:
  - 주님께서 이같이 말씀하십니다
  - 야훼께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 사자 공식은 ‘이같이 말씀하십니다’로 자연스럽게 살리고, יְהוָה는 프로젝트 기본어휘에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְרִיתִי יוֹמָם וָלָיְלָה
  english_pob_choice: my covenant with day and night
  chosen_korean: 낮과 밤에 대한 내 언약
  alternatives_korean:
  - 낮과 밤과 맺은 내 언약
  - 낮과 밤과의 내 언약
  lexicon: HALOT
  rationale: 히브리어는 ‘낮과 밤’을 언약의 관계 범위로 제시하므로, 한국어에서는 ‘~에 대한’으로 관계성을 드러내면서도 ‘언약’의 본뜻을 유지했습니다.
- source_word: חֻקּוֹת שָׁמַיִם וָאָרֶץ
  english_pob_choice: the fixed order of heaven and earth
  chosen_korean: 하늘과 땅의 정한 질서
  alternatives_korean:
  - 하늘과 땅의 규례
  - 하늘과 땅의 고정된 질서
  lexicon: HALOT
  rationale: 문맥상 법규가 아니라 창조 질서의 규칙성을 말하므로, ‘정한 질서’로 옮겨 POB의 ‘fixed order’를 자연스럽게 반영했습니다.
- source_word: לֹא שָׂמְתִּי
  english_pob_choice: I have not established
  chosen_korean: 세우지 않았다면
  alternatives_korean:
  - 정하지 않았다면
  - 설정하지 않았다면
  - 두지 않았다면
  lexicon: HALOT
  rationale: שׂוּם의 문자적 ‘두다/놓다’보다, 본문이 가리키는 창조 질서의 제정 의미를 살려 ‘세우다’로 옮겼습니다.
theological_decisions:
- issue: 예언자적 선언의 종결 형태
  chosen_reading: 한국어에서는 조건절이 열려 있는 채로 마치도록 하여, 뒤이어 이어질 본문의 선언적 논지를 예고하게 했습니다.
  alternative_readings:
  - 문장부호를 더 강하게 닫아 완결된 진술처럼 처리
  - 조건절을 평서문으로 매끈하게 풀어쓰기
  rationale: 히브리어 본문은 ‘만약 내가 … 세우지 않았다면’으로 끝나며, 뒤 문맥과 맞물리는 수사적 긴장을 유지하는 것이 중요합니다.
  doctrine_reference: 문맥 수사 구조
