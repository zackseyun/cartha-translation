base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/025.yaml
  text: Let us lie down in our shame[a], and let our disgrace cover us, for we have sinned against Yahweh our God—we and our fathers—from our youth even to this day, and we have not obeyed the voice of Yahweh our God.
  footnotes:
  - marker: a
    text: Or 'we and our ancestors.' The Hebrew reads 'we and our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리의 수치 속에 눕고, 우리의 치욕에 덮이게 합시다. 이는 우리와 우리 아버지들이 어릴 때부터 오늘까지 야훼 우리 하나님께 죄를 지었고, 야훼 우리 하나님의 말씀에 순종하지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리와 우리 조상들이’로도 옮길 수 있습니다. 히브리어는 ‘우리와 우리 아버지들’이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁכְּבָה
  english_pob_choice: Let us lie down
  chosen_korean: 누워 있으십시오
  alternatives_korean:
  - 누워 있읍시다
  - 엎드립시다
  - 드러눕게 하십시오
  lexicon: HALOT
  rationale: 회개 탄원문에서 cohortative의 자발적·자기비하적 뉘앙스를 살리되, 한국어에서는 대상화된 권고형보다 공동체를 향한 청유/기원형이 자연스러워 ‘누워 있으십시오’로 옮겼습니다.
- source_word: בְּבָשְׁתֵּנוּ
  english_pob_choice: in our shame
  chosen_korean: 우리의 수치 속에
  alternatives_korean:
  - 우리의 부끄러움 속에
  - 우리의 치욕 속에
  lexicon: HALOT
  rationale: ב + 명사는 상태/영역을 나타내므로 ‘속에’로 처리했고, בֹּשֶׁת의 수치·부끄러움 범위를 고려해 ‘수치’를 택했습니다.
- source_word: כְּלִמָּתֵנוּ
  english_pob_choice: our disgrace
  chosen_korean: 우리의 치욕
  alternatives_korean:
  - 우리의 수치
  - 우리의 모욕
  lexicon: HALOT
  rationale: 앞선 בֹּשֶׁת과 동일어 반복을 피하면서도 강도를 유지해야 하므로, 더 강한 사회적 낙인감이 있는 ‘치욕’으로 구분했습니다.
- source_word: וּתְכַסֵּנוּ
  english_pob_choice: and let ... cover us
  chosen_korean: 우리를 덮게 하십시오
  alternatives_korean:
  - 우리 위에 덮게 하십시오
  - 우리를 덮으십시오
  lexicon: HALOT
  rationale: 주어가 생략된 3인칭 여성 단수(우리의 치욕)가 앞선 청유와 평행을 이루므로, 한국어에서도 원인 주어를 살리되 기원형으로 처리했습니다.
- source_word: לַיהוָה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼 우리 하나님께
  alternatives_korean:
  - 야훼께
  - 주님께
  lexicon: HALOT
  rationale: ל는 חטא와 결합해 ‘~에게/against’의 오역 가능성이 있지만, 한국어에서는 뒤의 죄의 대상을 격조사로 직접 드러내기보다 ‘~께 죄를 짓다’ 관용으로 자연스럽게 반영했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신명기를 포함한 구약에서 사해문서 계열의 מקור과 대응하는 신명는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: חָטָאנוּ
  english_pob_choice: we have sinned
  chosen_korean: 죄를 지었고
  alternatives_korean:
  - 죄를 범했고
  - 죄를 지었으며
  lexicon: HALOT
  rationale: 완료형 고백을 한국어에서는 현재 관련성을 유지하는 과거 서술로 옮기되, 다음 절과의 연속성을 위해 연결 어미 ‘-고’를 사용했습니다.
- source_word: אֲנַחְנוּ וַאֲבוֹתֵינוּ
  english_pob_choice: we and our fathers
  chosen_korean: 우리와 우리 조상들이
  alternatives_korean:
  - 우리와 우리의 아버지들이
  - 우리와 우리의 선조들이
  lexicon: HALOT
  rationale: 히브리어의 문자적 ‘fathers’를 기본으로 하되, 한국어에서는 가족적 의미를 넓게 보존하는 ‘조상들’이 본문 취지를 더 분명히 전달합니다.
- source_word: וְלֹא שָׁמַעְנוּ בְּקוֹל
  english_pob_choice: and we have not obeyed the voice of
  chosen_korean: 야훼 우리 하나님의 목소리를 듣지 않았습니다
  alternatives_korean:
  - 야훼 우리 하나님의 목소리에 순종하지 않았습니다
  - 야훼 우리 하나님의 말씀을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע בְּקוֹל은 단순 청각이 아니라 순종의 불이행을 뜻하지만, 본문은 ‘목소리’를 유지하는 반복 구조가 중요하므로 직역적 표현을 택했습니다.
theological_decisions:
- issue: 회개 기도의 청유형 어조
  chosen_reading: 공동체가 스스로를 낮추며 하나님 앞에 엎드리는 탄원형 청유로 처리했습니다.
  alternative_readings:
  - 직설형 ‘우리는 누워 있습니다’
  - 명령형 ‘누워라’
  rationale: 원문의 cohortative와 병렬 구문은 단순 진술보다 자책과 회개의 공동체적 결단을 드러내므로, 한국어에서도 기원·청유의 힘을 살리는 것이 적절합니다.
  doctrine_reference: Penitential discourse in prophetic confession
- issue: אֲבוֹתֵינוּ의 범위
  chosen_reading: ‘우리 조상들’로 옮겨 세대적·언약적 연속성을 드러냈습니다.
  alternative_readings:
  - ‘우리 아버지들’
  - ‘우리 선조들’
  rationale: 원문의 남성 복수 명사를 지나치게 가정화하지 않으면서도, 본절의 국가적 회개 맥락에서 혈연 조상보다 더 넓은 역사적 책임을 살리는 번역이 필요합니다.
  doctrine_reference: Corporate responsibility in prophetic confession
