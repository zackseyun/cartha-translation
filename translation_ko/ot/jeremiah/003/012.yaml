source:
  edition: WLC
  text: הָלֹ֡ךְ וְ/קָֽרָאתָ֩ אֶת הַ/דְּבָרִ֨ים הָ/אֵ֜לֶּה צָפ֗וֹנָ/ה וְ֠/אָמַרְתָּ שׁ֣וּבָ/ה מְשֻׁבָ֤ה יִשְׂרָאֵל֙ נְאֻם יְהוָ֔ה לֽוֹא אַפִּ֥יל פָּנַ֖/י בָּ/כֶ֑ם כִּֽי חָסִ֤יד אֲנִי֙ נְאֻם יְהוָ֔ה לֹ֥א אֶטּ֖וֹר לְ/עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/012.yaml
  text: 'Go and proclaim these words toward the north[a], and say: Return, faithless Israel, declares Yahweh. I will not look on you in anger, for I am faithful, declares Yahweh; I will not stay angry forever.'
  footnotes:
  - marker: a
    text: Or 'merciful.' The Hebrew term can denote covenant loyalty, kindness, or mercy.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 이 말들을 북쪽을 향하여 선포하고 말하십시오. “돌아오라, 신실하지 못한 이스라엘아. 야훼의 말씀이니라. 나는 너희에게 분노한 얼굴을 하지 않을 것이다. 나는 신실하므로, 야훼의 말씀이니라. 나는 영원히 분을 품지 않을 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신실하지 못한’은 히브리어의 언약 불충실을 드러냅니다. 영어 본문 주석처럼 이 어휘는 ‘자비로운’이라는 뜻의 가능성도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלֹךְ וְקָרָאתָ
  english_pob_choice: Go and proclaim
  chosen_korean: 가서 … 선포하고 말하십시오
  alternatives_korean:
  - 가서 외치고 말하십시오
  - 가서 이 말을 선포하십시오
  lexicon: HALOT
  rationale: 히브리어의 명령적 진행형과 예언자적 공적 선포를 함께 살려, 단순한 ‘말하다’보다 공적이고 권위 있는 ‘선포하다’로 옮겼습니다.
- source_word: צָפוֹנָה
  english_pob_choice: toward the north
  chosen_korean: 북쪽을 향하여
  alternatives_korean:
  - 북쪽으로
  - 북향하여
  lexicon: HALOT
  rationale: 방향성을 분명히 하되 현대 한국어에서 자연스러운 표현으로 정리했습니다.
- source_word: מְשֻׁבָה
  english_pob_choice: faithless
  chosen_korean: 신실하지 못한
  alternatives_korean:
  - 배역한
  - 배신한
  - 타락한
  lexicon: HALOT
  rationale: 언약적 불충실을 드러내되, ‘backsliding’ 같은 교회식 관용보다 본문의 질감을 더 직접적으로 살렸습니다.
- source_word: לֹא אַפִּיל פָּנַי בָּכֶם
  english_pob_choice: I will not look on you in anger
  chosen_korean: 나는 너희에게 분노한 얼굴을 하지 않을 것이다
  alternatives_korean:
  - 나는 너희에게서 얼굴을 돌리지 않을 것이다
  - 나는 너희를 향해 얼굴을 떨어뜨리지 않을 것이다
  - 나는 너희를 향해 분노로 얼굴을 돌리지 않을 것이다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도 ‘얼굴’ 이미지와 분노의 표정을 함께 보존했습니다.
- source_word: חָסִיד אֲנִי
  english_pob_choice: for I am faithful
  chosen_korean: 나는 신실하므로
  alternatives_korean:
  - 나는 자비로우므로
  - 나는 인자하므로
  - 나는 신실한 분이므로
  lexicon: HALOT
  rationale: 문맥상 언약적 충실성을 가리키는 표현으로 보아 ‘신실하다’가 가장 직접적입니다. 영어 POB의 대안 ‘merciful’도 의미 범위 안에 있으나, 본문은 야훼의 언약적 성품을 근거로 제시합니다.
- source_word: לֹא אֶטּוֹר לְעוֹלָם
  english_pob_choice: I will not stay angry forever
  chosen_korean: 나는 영원히 분을 품지 않을 것이다
  alternatives_korean:
  - 나는 영원히 화를 내지 않을 것이다
  - 나는 영원히 원한을 품지 않을 것이다
  - 나는 영원히 노하지 않을 것이다
  lexicon: HALOT
  rationale: נטר의 관용적 의미를 살려, 단순한 감정 지속이 아니라 분노를 간직하지 않는다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문의 신명 표기를 직접 반영하는 프로젝트 기본값을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: חָסִיד의 신학적 뉘앙스
  chosen_reading: 신실하므로
  alternative_readings:
  - 자비로우므로
  - 인자하므로
  - 충실하므로
  rationale: 본문은 이스라엘의 회복 요청을 야훼의 언약적 성품에 근거시키므로, ‘신실하다’가 자비의 정서보다 충실성과 언약성을 더 직접적으로 드러냅니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
