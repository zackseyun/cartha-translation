revisions:
- from: 그러나 수치가 우리 조상들의 수고를, 곧 우리의 젊은 시절부터 그들의 양 떼와 소 떼, 그들의 아들과 그들의 딸들을 삼켜 버렸습니다.[a]
  to: 그러나 수치가 우리 조상들이 우리가 어릴 때부터 애써 얻은 것, 곧 그들의 작은 가축 떼와 소 떼와 그들의 아들들과 딸들을 삼켜 버렸습니다.[a]
  rationale: 본문의 ‘수치’라는 모호한 표현은 유지했습니다. 그러나 יְגִיעַ가 문맥상 조상들의 수고로 얻은 재산·소유를 가리키므로, 한국어에서 시간 표현과 뒤따르는 가축·자녀의 열거가 자연스럽게 연결되도록 ‘애써 얻은 것’으로 풀었습니다. 각주는 해석 가능성만 제시하며 본문에 바알 또는 우상숭배를 확정적으로 삽입하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:17:09Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 주어인 ‘수치’와 ‘삼키다’의 파괴적 비유는 잘 보존되었습니다. 다만 현 번역의 ‘우리 조상들의 수고를, 곧 우리의 젊은 시절부터 그들의…’은 시간 표현의 수식 관계가 불분명하고, 열거가 ‘수고’와 문법적으로 매끄럽게 이어지지 않습니다. 또한 צֹאן은 양뿐 아니라 염소를 포함하는 작은 가축을 가리킬 수 있으므로 ‘양 떼’만으로는 다소 좁아집니다.
  naturalness: 수정문은 ‘우리 조상들이 우리가 어릴 때부터 애써 얻은 것’으로 시간 범위와 ‘수고의 산물’이라는 뜻을 자연스럽게 드러내며, 뒤의 동격 열거도 명료하게 연결합니다. 합쇼체 문체도 일관됩니다.
  terminology: ‘수치’는 הַבֹּשֶׁת의 의도적인 모호성과 인격화된 표현을 보존합니다. 각주에서 우상숭배 또는 바알을 가리키는 멸칭일 가능성을 제시하되 본문에서 특정하지 않습니다. ‘작은 가축 떼와 소 떼’는 צֹאן/בָּקָר의 구별을 유지합니다.
  issues:
  - severity: medium
    issue: 시간 표현과 열거의 문장 구조가 불명료함
    rationale: ‘우리 조상들의 수고를, 곧 우리의 젊은 시절부터 그들의…’에서는 ‘우리의 젊은 시절부터’가 무엇을 수식하는지 불분명하며, 가축과 자녀의 목록이 ‘수고’ 자체와 부자연스럽게 동격을 이룹니다. יְגִיעַ는 수고의 산물/획득물을 뜻할 수 있으므로 이를 드러내야 합니다.
  - severity: low
    issue: צֹאן을 ‘양 떼’로만 한정함
    rationale: צֹאן은 통상 양과 염소를 포함하는 작은 가축의 집합 명사입니다. ‘작은 가축 떼’는 불필요한 구체화 없이 범위를 보존합니다.
  - severity: low
