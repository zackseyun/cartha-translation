id: JER.3.24
reference: Jeremiah 3:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/בֹּ֗שֶׁת אָֽכְלָ֛ה אֶת יְגִ֥יעַ אֲבוֹתֵ֖י/נוּ מִ/נְּעוּרֵ֑י/נוּ אֶת צֹאנָ/ם֙ וְ/אֶת בְּקָרָ֔/ם אֶת בְּנֵי/הֶ֖ם וְ/אֶת בְּנוֹתֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/024.yaml
  text: But shame has devoured the labor of our fathers from our youth—their flocks and their herds[a], their sons and their daughters.
  footnotes:
  - marker: a
    text: Or "the shameful thing," likely a contemptuous reference to Baal or to idolatry.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 수치가 우리 조상들의 수고를, 곧 우리의 젊은 시절부터 그들의 양 떼와 소 떼, 그들의 아들과 그들의 딸들을 삼켜 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘수치’는 멸시적 우상 또는 바알을 가리키는 말일 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: וְהַבֹּשֶׁת
  english_pob_choice: But shame
  chosen_korean: 그러나 수치가
  alternatives_korean:
  - 그리고 수치가
  - 수치스러운 것이
  lexicon: HALOT
  rationale: 문맥상 고백의 전환을 살리기 위해 역접인 ‘그러나’를 사용했고, הַבֹּשֶׁת는 추상명사 ‘수치’로 옮겨 히브리어의 비유적 표현을 유지했습니다.
- source_word: אָכְלָה
  english_pob_choice: has devoured
  chosen_korean: 삼켜 버렸습니다
  alternatives_korean:
  - 먹어 치웠습니다
  - 삼켰습니다
  lexicon: HALOT
  rationale: ‘먹다’의 직역보다 소유물을 상대로 한 파괴적 섭취라는 관용적 힘을 살려 ‘삼켜 버렸습니다’로 옮겼습니다.
- source_word: יְגִיעַ
  english_pob_choice: the labor
  chosen_korean: 수고를
  alternatives_korean:
  - 노고를
  - 노력의 결실을
  - 수확을
  lexicon: HALOT
  rationale: יְגִיעַ는 ‘수고/노고의 산물’ 또는 그로 인한 얻은 것을 가리킬 수 있어, 문맥에 맞게 ‘수고’로 간결하게 살렸습니다.
- source_word: צֹאנָם / בְּקָרָם
  english_pob_choice: their flocks, their herds
  chosen_korean: 그들의 양 떼와 소 떼
  alternatives_korean:
  - 그들의 양과 염소 떼와 소 떼
  - 그들의 가축 떼
  lexicon: HALOT
  rationale: צֹאן과 בקר의 병렬을 한국어의 익숙한 대응쌍인 ‘양 떼와 소 떼’로 옮겨, 두 종류의 가축이 모두 포함된다는 점을 분명히 했습니다.
- source_word: בְּנֵיהֶם / בְּנוֹתֵיהֶם
  english_pob_choice: their sons and their daughters
  chosen_korean: 그들의 아들과 그들의 딸들
  alternatives_korean:
  - 그들의 아들들과 딸들
  - 그들의 자녀들
  lexicon: HALOT
  rationale: 히브리어가 구체적으로 ‘아들’과 ‘딸’을 병렬로 말하므로, 성별 구분을 유지해 가족 전체의 상실을 드러냈습니다.
theological_decisions:
- issue: הַבֹּשֶׁת의 잠재적 우상/바알 지시
  chosen_reading: 본문은 ‘수치’로 직역하되, 대상이 우상숭배 또는 바알을 가리킬 수 있는 긴장을 그대로 둡니다.
  alternative_readings:
  - ‘수치스러운 것’으로 풀어 쓰기
  - 해석적으로 ‘바알’로 특정하기
  rationale: 예레미야의 용법상 ‘수치’는 멸시적 우상 지칭일 수 있으나, 본문 자체는 그 지시 대상을 명시하지 않으므로 번역 본문에서는 히브리어의 여지를 보존했습니다.
  doctrine_reference: Translation philosophy §3 — 해석적 긴장을 평준화하지 말고 보존
