  text: 여호와께서 제게 말씀하셨습니다. “돌아선 이스라엘은 배신한 유다보다 자신이 더 의롭다고 드러났습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “믿음 없는 이스라엘은 배신한 유다보다 자신이 더 의롭다고 드러났습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: 관용 표기
  rationale: 이 본문에서는 본 프로젝트 기본값인 야훼보다 한국 교회 독자에게 즉시 인식되는 관용 표기 여호와를 사용해도 본문의 지시 대상이 분명하게 유지됩니다.
- source_word: וַיֹּאמֶר ... אֵלַי
  english_pob_choice: said to me
  chosen_korean: 제게 말씀하셨습니다
  alternatives_korean:
  - 제게 말씀하셨습니다
  - 제게 이르셨습니다
  lexicon: HALOT
  rationale: 예언자에게 하시는 하나님의 직접 발화를 자연스럽고 격식 있게 드러내기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: צִדְּקָה נַפְשָׁהּ
  english_pob_choice: has shown herself more righteous
  chosen_korean: 자기 쪽이 더 의롭다고 드러냈습니다
  alternatives_korean:
  - 자기 자신이 더 의롭다고 보였습니다
  - 자기를 더 의롭다고 입증했습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그의/그녀의 영혼이 의로웠다’이지만, 문맥상 상대적 판정이므로 ‘더 의롭다고 드러냈습니다’로 옮겨 비교·반전의 힘을 살렸습니다.
- source_word: מְשֻׁבָה
  english_pob_choice: Faithless
  chosen_korean: 믿음 없는
  alternatives_korean:
  - 배교한
  - 돌아선
  lexicon: HALOT
  rationale: ‘돌아섬/배교’의 의미를 담되, 관계적·언약적 불충실을 현대 한국어로 직접 드러내는 표현으로 옮겼습니다.
- source_word: מִבֹּגֵדָה
  english_pob_choice: than treacherous
  chosen_korean: 배신하는
  alternatives_korean:
  - 간사한
  - 배반하는
  lexicon: HALOT
  rationale: 비교 구문에서 유다의 언약적 배반성을 강하게 보이기 위해 ‘배신하는’을 선택했습니다.
theological_decisions:
- issue: 이스라엘의 상대적 의로움
  chosen_reading: 이스라엘이 절대적으로 의롭다는 뜻이 아니라, 유다와 비교할 때 상대적으로 더 의롭다고 말하는 것으로 유지했습니다.
  alternative_readings:
  - 이스라엘이 의롭다 하심을 받았다고 읽기
  - 이스라엘의 도덕적 무죄로 읽기
  rationale: 히브리어 צדק의 비교적 용법과 문맥의 반어적 충격을 보존해야 하므로, 정죄와 판정의 긴장을 풀지 않았습니다.
  doctrine_reference: Translation philosophy §3 (신학적 긴장을 보존)
