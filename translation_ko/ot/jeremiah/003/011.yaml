revisions:
- from: 여호와께서 제게 말씀하셨습니다[a]. “믿음 없는 이스라엘이 배신하는 유다보다 자기 쪽이 더 의롭다고 드러냈습니다.”
  to: 여호와께서 제게 말씀하셨습니다. “돌아선 이스라엘은 배신한 유다보다 자신이 더 의롭다고 드러났습니다[a].”
  rationale: 수정은 מְשֻׁבָה의 ‘돌아섬/이탈’ 의미를 본문에 더 가깝게 반영하고, צִדְּקָה נַפְשָׁהּ의 상대적·반어적 판정을 자연스러운 한국어로 명료화합니다. 이스라엘이 절대적으로 무죄하거나 의롭다는 뜻은 추가하지 않았으며, 유다와의 비교라는 원문의 긴장을 유지했습니다. 각주의 대안은 실제로 대체되는 표현에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:46Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 비교 구문(‘유다보다 더’)과 이스라엘의 상대적 의로움이라는 핵심은 초안에 반영되어 있습니다. 그러나 מְשֻׁבָה를 ‘믿음 없는’으로 옮기면 단순한 신앙·신뢰의 결여로 이해될 수 있어, ‘돌아섬/배반’의 어근 및 언약적 이탈의 뜻이 약해집니다. 또한 ‘자기 쪽이 더 의롭다고 드러냈습니다’는 한국어에서 다소 부자연스럽고, 본문의 관용적 ‘자신을 의롭다고 하다/더 의롭게 드러나다’의 판단적 뉘앙스를 불명확하게 합니다.
  naturalness: ‘이스라엘은 … 유다보다 자신이 더 의롭다고 드러났습니다’는 비교와 상대적 판정을 현대 표준 한국어로 자연스럽게 전달합니다. 직접 인용 앞 문장도 마침표 뒤에 인용부호를 두어 문장부호를 바로잡았습니다.
  terminology: ‘여호와’, ‘이스라엘’, ‘유다’는 한국어 성서 문맥에서 통용되는 표기입니다. מְשֻׁבָה는 본문 문맥에 맞게 ‘돌아선’으로, בּוֹגֵדָה는 적극적 배반의 뜻을 살려 ‘배신한’으로 옮겼습니다. 각주 표지는 실제 어휘 대안이 걸리는 ‘돌아선 이스라엘’에 두었습니다.
  issues:
  - severity: medium
    issue: מְשֻׁבָה를 ‘믿음 없는’으로 번역
    rationale: 이 표현은 현대 한국어에서 신념이나 신앙의 부재를 주로 뜻할 수 있습니다. 본문의 명사는 돌아섬, 이탈, 배교적 불충실을 가리키므로 ‘돌아선’이 어근과 문맥을 더 직접적으로 보존합니다.
  - severity: medium
    issue: ‘자기 쪽이 더 의롭다고 드러냈습니다’의 어색함과 의미 불선명
    rationale: ‘자기 쪽’은 원문에 없는 편 가르기식 표현이며, 주어가 무엇을 드러냈다는 것인지도 매끄럽지 않습니다. 이 구절은 두 공동체의 상대적 의로움을 판정하는 말이므로 ‘자신이 더 의롭다고 드러났습니다’가 자연스럽습니다.
  - severity: low
    issue: 각주 표지 위치 및 인용 전 문장부호
    rationale: 현 각주는 이스라엘의 수식어에 관한 어휘 대안인데 표지가 ‘제게’에 붙어 있습니다. 표지를 해당 어휘에 붙이고, 서술문 뒤에는 마침표를 써서 직접 인용을 시작하는 것이 적절합니다.
