  naturalness: 초안은 ‘너희가’와 ‘네가/네’가 섞여 있고, 명령문 ‘보아라’와 종결 ‘더럽혔습니다’가 혼용되어 대상 변이와 합쇼체 요구에 맞지 않습니다. 이를 여성 단수에 맞는 ‘네’와 일관된 합쇼체로 바로잡았습니다. ‘민둥한 산등성이’는 현대 한국어에서 자연스럽게 지형적 의미를 전달합니다.
