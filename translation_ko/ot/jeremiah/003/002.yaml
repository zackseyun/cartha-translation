  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׂאִֽי עֵינַ֨יִ/ךְ עַל שְׁפָיִ֜ם וּ/רְאִ֗י אֵיפֹה֙ לֹ֣א שגלת עַל דְּרָכִים֙ יָשַׁ֣בְתְּ לָ/הֶ֔ם כַּ/עֲרָבִ֖י בַּ/מִּדְבָּ֑ר וַ/תַּחֲנִ֣יפִי אֶ֔רֶץ בִּ/זְנוּתַ֖יִ/ךְ וּ/בְ/רָעָתֵֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/002.yaml
  text: 'Lift up your eyes to the bare heights and see: where have you not been lain with? By the roads you sat waiting for them[a], like an Arab in the wilderness[b], and you have polluted the land with your prostitution and with your wickedness.'
  footnotes:
  - marker: a
    text: Or, more literally, “where have you not been lain with?” The Hebrew uses a blunt sexual verb in a metaphor for covenant unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: “Like an Arab in the wilderness” likely evokes someone lying in wait along desert routes, highlighting deliberate, public pursuit rather than ethnicity as such.
    reason: cultural_note
translation:
  language: ko
  text: 네 눈을 들어 민둥한 산등성이들을 보십시오. 어디에서 네가 동침을 당하지 않았습니까?[a] 길가에 앉아 그들을 기다렸습니다. 광야의 아라비아 사람처럼[b] 네 음행과 네 악으로 땅을 더럽혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “어디에서 네가 동침을 당하지 않았느냐?”입니다. 히브리어는 언약 불신실함을 비유하는 거친 성적 동사를 수동형으로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: “광야의 아라비아 사람처럼”은 특정 민족 자체를 평가하는 말이라기보다, 광야의 길목에서 숨어 기다리는 사람의 모습을 떠올리게 하는 비유일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: שְׂאִי עֵינַיִךְ
  english_pob_choice: Lift up your eyes
  chosen_korean: 눈을 들어 보아라
  alternatives_korean:
  - 눈을 들어라
  - 눈을 치켜들어 보아라
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘눈을 들다’로 자연스럽게 옮기되, 여성 단수 명령의 호소성을 살려 ‘보아라’를 덧붙였습니다.
- source_word: שְׁפָיִם
  english_pob_choice: the bare heights
  chosen_korean: 높은 언덕
  alternatives_korean:
  - 민둥한 언덕
  - 벌거벗은 산들
  - 황량한 높은 곳
  lexicon: HALOT
  rationale: 지형적 의미를 살리면서도 한국어에서 어색하지 않게 옮겼고, 예언서의 음란/우상숭배 연상을 과도하게 해석하지 않도록 했습니다.
- source_word: שגלת
  english_pob_choice: been lain with
  chosen_korean: 눕지 않았느냐
  alternatives_korean:
  - 강간당하지 않았느냐
  - 성적으로 더럽혀지지 않았느냐
  - 몸을 허락받지 않았느냐
  lexicon: HALOT
  rationale: 히브리어의 노골적인 성적 표현을 직접 반영하되, 강제성(coercion)을 과잉 주입하지 않도록 ‘눕다’ 계열로 옮겼습니다.
- source_word: וּרְאִי ... בִּזְנוּתַיִךְ
  english_pob_choice: and with your prostitution
  chosen_korean: 네 음행
  alternatives_korean:
  - 네 매춘
  - 네 창녀짓
  - 네 음란
  lexicon: HALOT
  rationale: זנות의 비유적·도덕적 뉘앙스를 살리면서도 현대 한국어에서 이해 가능한 표준어로 옮겼습니다.
theological_decisions:
- issue: 예언적 성적 은유의 보존
  chosen_reading: 본문의 수치스럽고 노골적인 성적 이미지를 완화하지 않고 유지했습니다.
  alternative_readings:
  - 우상숭배로만 풀어써서 성적 표현을 약화함
  - ‘더럽혔다’만 남기고 성적 은유를 삭제함
  rationale: 이 구절은 언약 불신실함을 충격적인 성적 언어로 드러내므로, 해석적 완화보다 수사적 힘을 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
