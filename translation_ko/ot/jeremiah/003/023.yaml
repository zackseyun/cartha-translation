base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/023.yaml
  text: Surely[a], from the hills comes only falsehood, the tumult on the mountains; surely in Yahweh our God is the salvation of Israel.
  footnotes:
  - marker: a
    text: Or 'the noise on the mountains'; Hebrew 'the tumult of the mountains.'
    reason: lexical_alternative
translation:
  language: ko
  text: 참으로 산들에서 나오는 것은 거짓이며, 산들 위의 소란도 그러합니다.[a] 참으로 이스라엘의 구원은 우리 하나님 야훼께 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산들 위의 소리’. 히브리어는 ‘산들의 소란’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  english_pob_choice: Surely
  chosen_korean: 참으로
  alternatives_korean:
  - 확실히
  - 실로
  lexicon: HALOT
  rationale: 강한 확증과 대조를 나타내는 담화 표지로, 두 번 반복되는 구조를 한국어에서 자연스럽게 살리기에 ‘참으로’가 가장 적절합니다.
- source_word: לַשֶּׁקֶר
  english_pob_choice: only falsehood
  chosen_korean: 오직 거짓뿐
  alternatives_korean:
  - 거짓을 위하여
  - 거짓으로
  - 오직 속임수
  lexicon: HALOT
  rationale: ל + שׁקר의 압축된 표현을 한국어에서 판정적 의미로 풀어, 산에서 기대되는 것이 실제로는 ‘거짓’뿐이라는 뜻을 분명하게 전달했습니다.
- source_word: הָמוֹן הָרִים
  english_pob_choice: the tumult on the mountains
  chosen_korean: 산들 위의 소란
  alternatives_korean:
  - 산들의 소리
  - 산 위의 떠들썩함
  - 산들의 요란
  lexicon: HALOT
  rationale: הָמוֹן은 소리·소란·소동의 범위를 가지므로, 문맥상 산지 제의의 소란스러운 분위기를 살린 ‘소란’이 적절합니다.
- source_word: בַּיהוָה אֱלֹהֵינוּ
  english_pob_choice: in Yahweh our God
  chosen_korean: 야훼 우리 하나님 안에
  alternatives_korean:
  - 야훼 우리 하나님에게서
  - 야훼 우리 하나님에게는
  lexicon: HALOT
  rationale: בְּ는 여기서 구원의 근거/영역을 나타내는 방향이 강하므로, 한국어에서는 ‘안에’로 옮겨 대조 구조를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 여호와 대체어 처리
  chosen_reading: יהוה를 ‘야훼’로 음역하여 하나님의 고유명을 직접 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 번역본의 원칙에 따라 텍스트의 신명(神名)을 가리는 관습적 대체어보다 원어의 고유성을 우선했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the divine name distinction.'
- issue: 산과 거짓의 대비
  chosen_reading: 산들에서 나오는 것이 ‘거짓’이며, 참된 구원은 야훼께 있다는 대조를 유지했습니다.
  alternative_readings:
  - 산들에 대한 언급을 단순한 지형 묘사로 처리하는 읽기
  rationale: 예레미야서의 문맥에서 산과 높은 곳은 우상숭배와 자주 연결되므로, 본문의 대조를 완화하지 않고 살렸습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it unnecessarily.'
