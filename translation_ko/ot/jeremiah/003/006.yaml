source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י בִּ/ימֵי֙ יֹאשִׁיָּ֣הוּ הַ/מֶּ֔לֶךְ הֲֽ/רָאִ֔יתָ אֲשֶׁ֥ר עָשְׂתָ֖ה מְשֻׁבָ֣ה יִשְׂרָאֵ֑ל הֹלְכָ֨ה הִ֜יא עַל כָּל הַ֣ר גָּבֹ֗הַּ וְ/אֶל תַּ֛חַת כָּל עֵ֥ץ רַעֲנָ֖ן וַ/תִּזְנִי שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/006.yaml
  text: And the LORD said to me in the days of King Josiah, “Have you seen what faithless Israel has done? She went up on every high hill and under every green tree, and there she prostituted herself.”
translation:
  language: ko
  text: 여호와께서 요시야 왕의 시대에 내게 말씀하셨습니다. “네가 보았느냐? 배역한 이스라엘이 한 일을 보았느냐? 그녀는 모든 높은 산에 올라가고 모든 푸른 나무 아래로 가서, 거기서 몸을 팔았습니다.”
  philosophy: formal
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  - 주
  lexicon: יהוה / YHWH
  rationale: 본문은 WLC의 여호와를 가리키며, 영문 POB가 "the LORD"로 처리했으므로 한국어에서는 전통적 표기인 여호와를 사용해 직접 대응시켰습니다.
- source_word: מְשֻׁבָה
  english_pob_choice: faithless
  chosen_korean: 배역한
  alternatives_korean:
  - 불성실한
  - 믿음 없는
  - 타락한
  lexicon: מְשׁוּבָה
  rationale: 명사형 뉘앙스를 살리기보다, 영문 POB의 형용사적 선택인 "faithless"에 맞춰 언약에서 돌아선 상태를 드러내는 배역한으로 옮겼습니다.
- source_word: וַתִּזְנִי
  english_pob_choice: she prostituted herself
  chosen_korean: 몸을 팔았습니다
  alternatives_korean:
  - 음행했습니다
  - 창녀가 되었습니다
  - 간음을 범했습니다
  lexicon: זנה
  rationale: 히브리어 זנה의 성적·우상숭배적 은유를 직역적으로 완화하지 않으면서도 한국어로 자연스럽게 전달하는 표현으로 선택했습니다.
- source_word: עַל כָּל הַר גָּבֹהַּ וְאֶל תַּחַת כָּל עֵץ רַעֲנָן
  english_pob_choice: on every high hill and under every green tree
  chosen_korean: 모든 높은 산에 올라가고 모든 푸른 나무 아래로 가서
  alternatives_korean:
  - 모든 높은 언덕 위와 모든 푸른 나무 아래에서
  - 모든 높은 산과 모든 푸른 나무 아래로
  lexicon: 표현 관용구
  rationale: 예언서에서 반복되는 우상숭배 장소 관용구를 보존하되, 한국어 어순에 맞게 이동 동작을 분명히 드러내는 방식으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기 선택
  chosen_reading: 본문의 יהוה는 여호와로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절에는 문맥상 NT 인용의 야훼 환원이 아니라 히브리어 본문 직접 대응이 핵심이므로, 프로젝트 기본값 가운데 한국 교회 독자에게 가장 즉시 식별되는 여호와를 채택했습니다.
  doctrine_reference: YHWH 표기 원칙
