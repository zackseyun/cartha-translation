source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא יִקְרְא֤וּ לִ/ירוּשָׁלִַ֨ם֙ כִּסֵּ֣א יְהוָ֔ה וְ/נִקְוּ֨וּ אֵלֶ֧י/הָ כָֽל הַ/גּוֹיִ֛ם לְ/שֵׁ֥ם יְהוָ֖ה לִ/ירוּשָׁלִָ֑ם וְ/לֹא יֵלְכ֣וּ ע֔וֹד אַחֲרֵ֕י שְׁרִר֖וּת לִבָּ֥/ם הָ/רָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/017.yaml
  text: At that time they will call Jerusalem ‘the throne of Yahweh,’ and all the nations will gather to it[a], to Jerusalem, for the name of Yahweh[b]. They will no longer walk after the stubbornness of their evil heart.
  footnotes:
  - marker: a
    text: Or 'will be gathered to her' or 'will stream to her.' The Hebrew verb here is difficult; in context it describes the nations assembling toward Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the throne of the LORD.' The image identifies Jerusalem as the place of the LORD's royal rule.
    reason: cultural_note
translation:
  language: ko
  text: 그때에 그들은 예루살렘을 「야훼의 보좌」라 부를 것이며, 모든 민족이 그것과 예루살렘으로 모여들어 야훼의 이름을 위해 올 것입니다. 그들은 다시는 자기 악한 마음의 고집을 따라 걷지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 어렵지만, 문맥상 민족들이 예루살렘을 향해 모여드는 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 이름을 위해’를 뜻하며, 예루살렘이 야훼의 왕적 통치와 연결된 장소임을 드러냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그때
  lexicon: HALOT
  rationale: 예언 문맥의 미래 표지를 자연스러운 현대 한국어 시간 부사구로 옮기되, 선언적 분위기를 유지했습니다.
- source_word: יִקְרְאוּ לִירוּשָׁלַם כִּסֵּא יְהוָה
  english_pob_choice: they will call Jerusalem ‘the throne of Yahweh,’
  chosen_korean: 예루살렘을 「야훼의 보좌」라 부를 것이며
  alternatives_korean:
  - 예루살렘이 「야훼의 보좌」라 불릴 것이며
  - 예루살렘을 「야훼의 왕좌」라 부를 것이며
  lexicon: HALOT
  rationale: 히브리어의 능동형 ‘그들이 부를 것이다’를 살렸고, כִּסֵּא는 ‘보좌’가 가장 직접적이며 왕권 이미지를 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭 대체가 아니라 이름 자체를 드러냈습니다.
- source_word: וְנִקְוּוּ אֵלֶיהָ כָל הַגּוֹיִם
  english_pob_choice: and all the nations will gather to it
  chosen_korean: 모든 민족이 그것과 예루살렘으로 모여들어
  alternatives_korean:
  - 모든 민족이 그곳으로 모여들어
  - 모든 민족이 예루살렘으로 모여들어
  lexicon: HALOT
  rationale: נִקְוּוּ는 문맥상 ‘모이다/모여들다’로 이해하는 것이 가장 자연스럽고, ‘민족들’은 גּוֹיִם의 기본 의미를 살렸습니다. ‘그것’은 예루살렘을 가리키는 지시를 유지합니다.
- source_word: לְשֵׁם יְהוָה
  english_pob_choice: for the name of Yahweh
  chosen_korean: 야훼의 이름을 위해
  alternatives_korean:
  - 야훼의 이름을 위하여
  - 야훼의 이름을 향하여
  lexicon: HALOT
  rationale: לְ + שֵׁם은 목적·지향을 함께 담을 수 있어, 군더더기 없이 ‘이름을 위해’로 옮겼습니다.
- source_word: שְׁרִר֖וּת לִבָּ֥ם הָרָע
  english_pob_choice: the stubbornness of their evil heart
  chosen_korean: 자기 악한 마음의 고집
  alternatives_korean:
  - 악한 마음의 완고함
  - 악한 마음의 완고한 성향
  lexicon: HALOT
  rationale: שְׁרִרוּת는 단순한 감정이 아니라 완고함·고집을 뜻하므로, 한국어에서 즉각 이해되는 ‘고집’을 택해 내적 저항의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: Jerusalem의 신적 왕권 표상
  chosen_reading: ‘야훼의 보좌’라는 이미지를 직접 살려, 예루살렘이 야훼의 통치가 드러나는 자리라는 표상을 번역에서 약화하지 않았습니다.
  alternative_readings:
  - 상징적 통치 중심지로 의역
  - 미래 종말론적 성취로 명시
  rationale: 본문은 예루살렘을 야훼의 보좌와 연결하는 강한 이미지 자체를 제시하므로, 해석을 좁히지 않고 그대로 보존하는 것이 원문에 충실합니다.
  doctrine_reference: 예언적 표상을 유지하고 신학적 체계를 번역문에 선반영하지 않음.
- issue: 민족들의 예루살렘으로의 움직임
  chosen_reading: 민족들이 예루살렘을 향해 모여드는 집합적 움직임으로 번역하되, 순례·개종·정치적 복종 중 어느 하나로 단정하지 않았습니다.
  alternative_readings:
  - 예배를 위한 순례
  - 여호와께로의 비유적 전환
  rationale: 히브리어는 예루살렘을 향한 집합을 분명히 말하지만, 그 신학적 성격까지 확정하진 않으므로 문장의 수준에서 멈추는 것이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 번역에서 해석적 결론을 유보.
