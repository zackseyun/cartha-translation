  rationale: 원문의 능동 복수형 ‘그들은 부를 것이다’, 예루살렘을 향한 모든 민족의 집결, ‘야훼의 이름을 위하여’라는 목적·지향 표현, 그리고 악한 마음의 완고함을 따르지 않는다는 진술을 보존했습니다. 초안의 중복되고 비문인 장소 표현과 원문에 없는 ‘오다’를 제거했으며, 각주 표지를 해당 어구에 맞게 재배치했습니다. 예루살렘의 반복은 히브리어에 있으나, 한국어에서는 앞선 ‘예루살렘으로’가 여성 단수 대명사의 지시 대상을 충분히 전달하므로 반복 번역이 오히려 부자연스럽고 혼란을 낳습니다.
