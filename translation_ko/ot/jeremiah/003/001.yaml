revisions:
- from: ‘만일 한 사람이 자기 아내를 보내어 떠나게 하고 그 여인이 그에게서 떠나 다른 사람의 아내가 되었다면, 그가 다시 그녀에게 돌아가겠습니까? 그런 땅이 크게 더럽혀지지 않겠습니까? 그런데 너는 많은 연인들과 음행하였으니, 어찌 내게로 돌아오겠느냐?’라고 야훼께서 말씀하십니다.[a][b]
  to: 이런 말이 있습니다. ‘한 사람이 자기 아내를 내보내고 그 여인이 그에게서 떠나 다른 남자의 아내가 되었다면[b], 그가 다시 그 여인에게 돌아가겠습니까? 그런 땅이 크게 더럽혀지지 않겠습니까? 그런데 너는 많은 연인들과 음행하고서도 내게로 돌아오겠느냐?’[a] 야훼의 말씀입니다.
  rationale: 사역적 뉘앙스를 제거하여 히브리어의 절 구조를 보존하고, לֵאמֹר 및 נְאֻם יְהוָה를 현대적이면서도 격식 있는 한국어로 반영했습니다. 마지막 절은 본문 흐름에 따라 수사 의문문으로 유지하되, 명령형으로 읽을 가능성은 해당 위치의 각주로 보존했습니다. 각주 b는 원문의 생략된 혼인 표현을 정확히 설명하고 관련 어구에 앵커를 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:14:37Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘보내어 떠나게 하고’는 남편이 아내를 떠나게 한다는 인과를 더하지만, 히브리어는 ‘아내를 내보내고, 그 여인이 그에게서 떠나’라는 연속 동작입니다. 또한 לֵאמֹר의 인용 도입과 마지막 ‘야훼의 말씀’ 공식을 함께 자연스럽게 드러내는 편이 낫습니다.
  naturalness: 합쇼체와 예언서의 격식은 대체로 적절하나, ‘그런데 너는 … 음행하였으니, 어찌’보다 ‘그런데 너는 … 음행하고서도 … 하겠느냐’가 현대 한국어의 수사 의문문으로 더 자연스럽습니다.
  terminology: ‘야훼’, ‘음행하다’, ‘연인들’은 본문과 프로젝트의 용어 선택에 부합합니다. 다만 각주 b는 히브리어가 문자적으로 ‘다른 사람의 아내가 되다’라고 말한다는 듯 서술하여, 원문의 생략된 표현을 충분히 반영하지 못합니다.
  issues:
  - severity: medium
    issue: 첫 조건절에 ‘떠나게 하고’가 추가됨
    rationale: וְהָלְכָה מֵאִתּוֹ는 여인이 ‘그에게서 떠나는’ 절이며, 남편이 떠나게 한다는 사역 의미가 아닙니다.
  - severity: low
    issue: 인용 도입구와 신탁 공식의 연결이 불분명함
    rationale: 처음의 ‘…라고’는 그것을 받는 서술어가 뒤에 놓여 어색합니다. ‘이런 말이 있습니다’와 ‘야훼의 말씀입니다’로 인용의 틀을 분명히 할 수 있습니다.
