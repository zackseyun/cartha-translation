source:
  edition: WLC
  text: לֵ/אמֹ֡ר הֵ֣ן יְשַׁלַּ֣ח אִ֣ישׁ אֶת אִשְׁתּ/וֹ֩ וְ/הָלְכָ֨ה מֵ/אִתּ֜/וֹ וְ/הָיְתָ֣ה לְ/אִישׁ אַחֵ֗ר הֲ/יָשׁ֤וּב אֵלֶ֨י/הָ֙ ע֔וֹד הֲ/ל֛וֹא חָנ֥וֹף תֶּחֱנַ֖ף הָ/אָ֣רֶץ הַ/הִ֑יא וְ/אַ֗תְּ זָנִית֙ רֵעִ֣ים רַבִּ֔ים וְ/שׁ֥וֹב אֵלַ֖/י נְאֻם יְהֹוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/001.yaml
  text: It is said[a], ‘If a man sends away his wife, and she goes from him and becomes another man’s, will he return to her again? Would not that land be utterly polluted? But you have prostituted yourself with many lovers[b], and would you return to me?’ declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'and yet return to me,' taking the final clause as an imperative invitation rather than a rhetorical question.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'becomes another man's,' that is, becomes another man's wife.
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 말이 있습니다. ‘한 사람이 자기 아내를 내보내고 그 여인이 그에게서 떠나 다른 남자의 아내가 되었다면[b], 그가 다시 그 여인에게 돌아가겠습니까? 그런 땅이 크게 더럽혀지지 않겠습니까? 그런데 너는 많은 연인들과 음행하고서도 내게로 돌아오겠느냐?’[a] 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 내게로 돌아오라.’ 마지막 절을 수사 의문문이 아니라 명령형의 초청으로 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 직역하면 ‘다른 남자에게/를 위하여 되다’이며, 문맥상 다른 남자의 아내가 되는 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  english_pob_choice: It is said
  chosen_korean: ‘…라고’
  alternatives_korean:
  - ‘말하기를’
  - ‘이르기를’
  lexicon: HALOT
  rationale: 서문형 לֵאמֹר는 인용 도입구로 기능하므로, 한국어에서는 별도의 서술어를 과잉 번역하기보다 인용 표지 ‘…라고’로 자연스럽게 처리했습니다.
- source_word: יְשַׁלַּח ... אֶת אִשְׁתּוֹ
  english_pob_choice: sends away his wife
  chosen_korean: 자기 아내를 보내어 떠나게 하고
  alternatives_korean:
  - 자기 아내를 내쫓고
  - 자기 아내를 이혼시키고
  lexicon: HALOT
  rationale: 이 문맥의 שׁלח는 혼인 관계에서 아내를 ‘보내다/떠나게 하다’는 표현이므로, 법적 함의를 드러내되 원문의 동작 이미지를 살려 옮겼습니다.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  english_pob_choice: and becomes another man’s
  chosen_korean: 다른 사람의 아내가 되었다면
  alternatives_korean:
  - 다른 남자의 것이 되었다면
  - 다른 사람에게 속하게 되었다면
  lexicon: HALOT
  rationale: 히브리어는 ‘다른 사람에게 속하다’는 생략된 혼인 표현이므로, 한국어에서는 의미를 분명히 하되 본문의 혼인 맥락을 과도하게 확장하지 않도록 ‘다른 사람의 아내’로 풀었습니다.
- source_word: וְאַתְּ זָנִית רֵעִים רַבִּים
  english_pob_choice: But you have prostituted yourself with many lovers
  chosen_korean: 그런데 너는 많은 연인들과 음행하였으니
  alternatives_korean:
  - 그런데 너는 많은 애인들과 창녀처럼 행하였으니
  - 그런데 너는 많은 사랑하는 이들과 음행하였으니
  lexicon: HALOT
  rationale: זנה는 예언서의 언약적 불신실함을 성적 은유로 드러내는 핵심 동사이므로, 완곡한 ‘배신’보다 본문의 강도를 살리는 ‘음행하다’로 옮겼습니다. רֵעִים는 여기서 성적 은유에 맞는 ‘연인들’이 가장 자연스럽습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언자적 공식 נְאֻם יְהוָה는 한국어에서 장중한 종결로 처리하는 것이 자연스럽고, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 'וְשׁוֹב אֵלַי의 문법적 긴장: 질문인가, 초청인가'
  chosen_reading: ‘어찌 내게로 돌아오겠느냐?’라는 수사 의문문으로 유지했습니다.
  alternative_readings:
  - ‘그러나 내게로 돌아오라’라는 명령/초청으로 이해
  - ‘그런데 다시 내게로 돌아올 수 있겠느냐’라는 반어적 질문
  rationale: 앞선 연속된 수사 의문문 흐름을 유지해야 본문의 날카로운 고발과 언약적 긴장이 흐려지지 않습니다. 다만 초청 가능성은 주석 없이 삭제하지 않도록 번역 자체는 질문형으로 남겼습니다.
  doctrine_reference: '번역 원칙: theological tension을 평탄화하지 않고 보존한다.'
