    rationale: לְאִישׁ אַחֵר는 직역상 ‘다른 남자에게/를 위하여 되다’이며 문맥상 혼인 관계를 뜻합니다. 해당 본문 표현 바로 뒤에 앵커를 두어야 합니다.
