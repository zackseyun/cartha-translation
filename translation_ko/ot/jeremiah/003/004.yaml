id: JER.3.4
reference: Jeremiah 3:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֣וֹא מֵ/עַ֔תָּה קראתי לִ֖/י אָבִ֑/י אַלּ֥וּף נְעֻרַ֖/י אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/004.yaml
  text: Have you not just now called to me[a], ‘My Father[b], you are the friend of my youth’?”
  footnotes:
  - marker: a
    text: Or 'guide of my youth.' The Hebrew אַלּוּף can denote a close associate, companion, or leader depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'from now on.' Here the phrase is taken to mean a recent appeal ('just now') rather than a future-oriented sense.
    reason: lexical_alternative
translation:
  language: ko
  text: “너는 바로 지금 내게 ‘내 아버지여, 당신은 내 청년 시절의 친구입니다’라고 부르지 않았느냐?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게’. 히브리어 לִי는 이곳에서 수신자를 나타내는 직접 호소로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지금부터’. 여기서는 미래 지향보다 최근의 호소를 가리키는 것으로 보았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Have you not
  chosen_korean: “너는 … 않느냐?”
  alternatives_korean:
  - “네가 … 아니냐?”
  - “너는 … 하지 않았느냐?”
  lexicon: HALOT
  rationale: 수사적 질문으로서 기대하는 답을 살리기 위해 반문형으로 옮겼습니다.
- source_word: מֵעַתָּה
  english_pob_choice: just now
  chosen_korean: “바로 지금”
  alternatives_korean:
  - “지금부터”
  - “방금”
  - “막”
  lexicon: HALOT
  rationale: 문맥상 미래 지시가 아니라 최근의 호소를 가리키므로, 시간상 긴박함과 최근성을 함께 드러내는 표현을 택했습니다.
- source_word: קראתי לִי
  english_pob_choice: called to me
  chosen_korean: “내게 … 부르지 않았느냐”
  alternatives_korean:
  - “내게 … 불렀느냐”
  - “내게 … 외치지 않았느냐”
  lexicon: HALOT
  rationale: לִי가 수신자를 분명히 가리키므로 ‘내게’로 옮기고, 호소의 직접성을 살리기 위해 ‘부르다’를 사용했습니다.
- source_word: אַלּוּף נְעֻרַי
  english_pob_choice: the friend of my youth
  chosen_korean: “내 청년 시절의 친구”
  alternatives_korean:
  - “내 젊은 시절의 동무”
  - “내 어릴 적의 동반자”
  - “내 젊은 시절의 인도자”
  lexicon: HALOT
  rationale: אַלּוּף가 이 문맥에서는 친밀한 관계를 나타내므로, 위계적 의미를 앞세우지 않는 ‘친구’로 옮겼습니다. ‘청년 시절’은 נְעֻרַי의 유년/젊은 시절 뉘앙스를 자연스럽게 반영합니다.
theological_decisions:
- issue: 인용된 호칭의 정서와 문맥적 긴장
  chosen_reading: 유다/이스라엘이 하나님께 다가가며 드린 최근의 호칭을 그대로 옮기되, 그것이 진심인지 형식적 회개인지 단정하지 않았습니다.
  alternative_readings:
  - 풍자적 비난으로만 읽는 해석
  - 진정한 회개의 고백으로만 읽는 해석
  rationale: 본문과 주변 문맥은 발화의 실제 정서를 완전히 고정하지 않으므로, 인용의 힘은 살리되 신학적 판정을 유보하는 것이 더 충실합니다.
  doctrine_reference: 문맥적 긴장을 보존하고 해석을 과잉 확정하지 않음.
