  naturalness: ‘오 신실하지 못한 자식들아’보다 ‘배역한 아들들아’가 예언서 문맥에서 더 자연스럽고 간결합니다. 각주는 해당 표현 바로 뒤에 두어 독자가 무엇에 관한 각주인지 분명히 알 수 있게 해야 합니다. ‘야훼의 말씀입니다’는 נְאֻם יְהוָה에 대한 자연스러운 현대 한국어 예언자 공식입니다.
