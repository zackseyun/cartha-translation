id: JER.3.14
reference: Jeremiah 3:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שׁ֣וּבוּ בָנִ֤ים שׁוֹבָבִים֙ נְאֻם יְהוָ֔ה כִּ֥י אָנֹכִ֖י בָּעַ֣לְתִּי בָ/כֶ֑ם וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶחָ֣ד מֵ/עִ֗יר וּ/שְׁנַ֨יִם֙ מִ/מִּשְׁפָּחָ֔ה וְ/הֵבֵאתִ֥י אֶתְ/כֶ֖ם צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/014.yaml
  text: Return[a], O faithless children, declares Yahweh, for I am your master; and I will take you, one from a city and two from a clan, and I will bring you to Zion.
  footnotes:
  - marker: a
    text: Or, 'for I am your husband,' or 'for I have married you.' The Hebrew verb can express both lordship and marital relationship.
    reason: alternative_reading
translation:
  language: ko
  text: 돌아오십시오, 배역한 아들들아. 야훼의 말씀입니다. 내가 너희의 주인입니다[a]. 내가 한 성읍에서 한 사람, 한 가문에서 두 사람을 데려오고, 너희를 시온으로 데려오겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 너희의 남편이다’ 또는 ‘내가 너희와 혼인하였다.’ 히브리어 동사는 주인됨과 혼인 관계를 모두 나타낼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: שׁוּבוּ
  english_pob_choice: Return
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌아오라
  - 회개하십시오
  lexicon: HALOT
  rationale: שׁוּב의 핵심은 관계와 방향의 전환이므로, 현대 합쇼체에서 명령의 힘을 살리면서도 '회개'처럼 해석을 과도하게 좁히지 않는 '돌아오십시오'를 택했습니다.
- source_word: בָנִים שׁוֹבָבִים
  english_pob_choice: faithless children
  chosen_korean: 오 신실하지 못한 자식들아
  alternatives_korean:
  - 오 배역한 자식들아
  - 오 돌아서버린 자식들아
  - 오 불충한 아들들아
  lexicon: HALOT
  rationale: בָנִים의 남성 복수와 שׁוֹבָבִים의 언약적 불충성을 함께 살리기 위해, 직설적이면서도 현대 한국어로 자연스러운 '신실하지 못한 자식들'을 사용했습니다.
- source_word: בָּעַלְתִּי בָכֶם
  english_pob_choice: I am your master
  chosen_korean: 내가 너희의 주인이기 때문입니다
  alternatives_korean:
  - 내가 너희의 남편이기 때문입니다
  - 내가 너희와 혼인하였기 때문입니다
  - 내가 너희를 다스리기 때문입니다
  lexicon: HALOT
  rationale: בעל의 주권/소유 의미를 본문에서 우선 살리되, 결혼적 뉘앙스는 본문이 아니라 각주에서 보존하는 English POB의 긴장을 따라 '주인'으로 옮겼습니다.
- source_word: אֶחָד מֵעִיר וּשְׁנַיִם מִמִּשְׁפָּחָה
  english_pob_choice: one from a city and two from a clan
  chosen_korean: 한 성읍에서 한 사람, 한 가문에서 두 사람
  alternatives_korean:
  - 한 성읍에서 하나, 한 족속에서 둘
  - 한 마을에서 한 사람, 한 가문에서 두 사람
  lexicon: HALOT
  rationale: 분배적 표현을 자연스러운 한국어로 풀되, מִשְׁפָּחָה를 혈연 단위인 '가문'으로 옮겨 'clan'의 사회적 규모를 반영했습니다.
- source_word: צִיּוֹן
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 시온 산
  - 예루살렘
  lexicon: HALOT
  rationale: 고유 지명과 신학적 상징을 유지하기 위해 관용적 음역인 '시온'을 사용했습니다.
theological_decisions:
- issue: בָּעַלְתִּי의 주인/남편 이중 의미를 어떻게 보존할지
  chosen_reading: 본문에는 '주인'을 두고, 남편/혼인 의미는 각주로 분리해 보존했습니다.
  alternative_readings:
  - 너희의 남편이다
  - 너희와 혼인하였다
  rationale: 직접 호소 대상이 '자식들'이므로 본문에서 결혼 이미지를 전면화하면 한국어에서 어색해질 수 있습니다. 그러나 히브리어의 의도적 중의성을 지우지 않기 위해 주권 의미를 본문에, 혼인 의미를 각주에 남겼습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it; Gender-accurate over gender-neutral'
