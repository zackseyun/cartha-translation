- from: 돌아오십시오, 오 신실하지 못한 자식들아—야훼의 선언입니다. 내가 너희의 주인이기 때문입니다. 내가 한 성읍에서 한 사람, 한 가문에서 두 사람을 데려오고, 너희를 시온으로 데려오겠습니다.[a][b]
  to: 돌아오십시오, 배역한 아들들아. 야훼의 말씀입니다. 내가 너희의 주인입니다[a]. 내가 한 성읍에서 한 사람, 한 가문에서 두 사람을 데려오고, 너희를 시온으로 데려오겠습니다.
  rationale: 원문의 남성 복수 호칭과 שׁוֹבָבִים의 언약적 반역 의미를 더 직접적으로 반영하도록 ‘배역한 아들들아’로 수정했습니다. בָּעַלְתִּי의 중의성은 본문의 ‘주인’과 바로 뒤의 각주로 보존했습니다. 불필요해진 ‘아들들’ 대안 각주는 삭제하고, 남은 각주 표지를 해당 표현 뒤로 옮겼습니다.
