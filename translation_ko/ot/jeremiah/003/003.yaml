id: JER.3.3
reference: Jeremiah 3:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּמָּנְע֣וּ רְבִבִ֔ים וּ/מַלְק֖וֹשׁ ל֣וֹא הָיָ֑ה וּ/מֵ֨צַח אִשָּׁ֤ה זוֹנָה֙ הָ֣יָה לָ֔/ךְ מֵאַ֖נְתְּ הִכָּלֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/003.yaml
  text: Therefore the showers were withheld[a], and there was no spring rain; yet you had the forehead of a prostitute—you refused to be ashamed.
  footnotes:
  - marker: a
    text: Or 'the latter rain.' The Hebrew term refers to the late seasonal rain, here rendered 'spring rain' for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 소낙비가 막혔고[a], 늦은 비도 없었습니다. 그런데도 네게는 창녀의 이마가 있었습니다. 너는 부끄러워하기를 거절하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘늦은 비’. 히브리어 용어는 계절의 뒤늦은 비를 가리키며, 여기서는 의미를 분명히 하기 위해 ‘소낙비’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּנְעוּ רְבִבִים
  english_pob_choice: were withheld / showers
  chosen_korean: 소낙비가 막혔고
  alternatives_korean:
  - 비가 거두어졌고
  - 소낙비가 금지되었고
  lexicon: HALOT
  rationale: נָמַע의 니팔형은 비가 능동적으로 ‘막힌’ 상태를 나타내므로, 한국어에서는 자연스럽고 판단적 맥락을 살리는 ‘막혔다’가 적절합니다.
- source_word: מַלְקוֹשׁ
  english_pob_choice: spring rain
  chosen_korean: 늦은 비
  alternatives_korean:
  - 가을비
  - 이른 여름비
  lexicon: HALOT
  rationale: 표준적 성서 용례에 맞게 ‘늦은 비’로 옮기되, 농경 주기상의 계절비라는 의미를 유지합니다. 영어 주석의 설명적 처리와 달리 본문에서는 전통적 대응어가 가장 직접적입니다.
- source_word: מֵצַח אִשָּׁה זוֹנָה
  english_pob_choice: the forehead of a prostitute
  chosen_korean: 창녀의 이마
  alternatives_korean:
  - 음녀의 이마
  - 창기의 이마
  lexicon: HALOT
  rationale: 직역적 이미지를 유지해야 예언자의 수치 비유가 약화되지 않습니다. ‘창녀’는 본문의 성적·비유적 충격을 현대 한국어에서 분명히 드러냅니다.
- source_word: מֵאַנְתְּ הִכָּלֵם
  english_pob_choice: you refused to be ashamed
  chosen_korean: 부끄러워하기를 거절하였습니다
  alternatives_korean:
  - 수치를 당하기를 거절하였습니다
  - 부끄러움을 느끼기를 거절하였습니다
  lexicon: HALOT
  rationale: מאן은 강한 거절을 뜻하므로 ‘거절하였습니다’로 옮기고, כלם은 결과적으로 수치를 느끼는 상태를 가리켜 ‘부끄러워하다’로 자연스럽게 표현합니다.
theological_decisions:
- issue: 예언적 성적 은유의 유지
  chosen_reading: ‘창녀의 이마’라는 직접적 은유를 그대로 유지했습니다.
  alternative_readings:
  - ‘완고한 얼굴’
  - ‘뻔뻔한 태도’
  rationale: 본문은 유다의 언약 불성실을 간음/음행 이미지로 폭로하므로, 이를 완화하면 본문의 신학적 압력이 약해집니다.
  doctrine_reference: 예언서의 언약 배반 비유는 우상숭배와 영적 음행의 연관을 드러냅니다.
