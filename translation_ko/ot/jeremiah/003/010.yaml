id: JER.3.10
reference: Jeremiah 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם בְּ/כָל זֹ֗את לֹא שָׁ֨בָה אֵלַ֜/י בָּגוֹדָ֧ה אֲחוֹתָ֛/הּ יְהוּדָ֖ה בְּ/כָל לִבָּ֑/הּ כִּ֥י אִם בְּ/שֶׁ֖קֶר נְאֻם יְהוָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/010.yaml
  text: Yet in spite of all this[a], faithless Judah, her sister did not return to me with all her heart, but only in falsehood[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'treacherous Judah, her sister.' The Hebrew adjective can emphasize betrayal or unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'but in falsehood' / 'but falsely,' indicating that Judah's return was insincere rather than wholehearted.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데도 이 모든 일 가운데서도[a] 배신한 유다, 그녀의 자매가 마음을 다해 내게 돌아오지 않았고, 오직 거짓으로만[b] 돌아왔습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배신한 유다, 그녀의 자매’. 히브리어 형용사는 배반이나 불충실을 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거짓으로만’ / ‘거짓되게만’. 유다가 진심이 아니라 겉으로만 돌아왔다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם בְּכָל זֹאת
  english_pob_choice: Yet in spite of all this
  chosen_korean: 그런데도 이 모든 일 가운데서도
  alternatives_korean:
  - 그러나 이 모든 것에도 불구하고
  - 또한 이 모든 일 가운데서도
  lexicon: HALOT
  rationale: 앞선 경고와 징계 맥락을 가리키는 양보·대조를 자연스럽게 살리기 위해 ‘그런데도’와 ‘이 모든 일 가운데서도’를 함께 사용했습니다.
- source_word: בָּגוֹדָה
  english_pob_choice: faithless
  chosen_korean: 배신한
  alternatives_korean:
  - 신실하지 않은
  - 불성실한
  - 간악한
  lexicon: HALOT
  rationale: כּ/בָּגַד 계열은 언약적 불충실과 배신의 뉘앙스를 가지므로, 단순한 감정적 표현보다 관계적 배반을 드러내는 ‘배신한’이 적절합니다.
- source_word: אֲחוֹתָהּ יְהוּדָה
  english_pob_choice: Judah, her sister
  chosen_korean: 유다, 그녀의 자매가
  alternatives_korean:
  - 그녀의 자매 유다
  - 유다 그 자매가
  lexicon: HALOT
  rationale: 히브리어의 동격 구조와 예언적 비유를 유지하면서 한국어 문장 흐름을 살리기 위해 ‘유다, 그녀의 자매가’로 옮겼습니다.
- source_word: בְּשֶׁקֶר
  english_pob_choice: in falsehood
  chosen_korean: 오직 거짓으로만
  alternatives_korean:
  - 거짓으로
  - 속임수로만
  - 가식으로만
  lexicon: HALOT
  rationale: ‘כִּי אִם’의 제한적 의미를 함께 반영하여, 돌아옴이 진실한 회심이 아니라 외형적·거짓된 행위였음을 ‘오직 …으로만’으로 분명히 했습니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: הוה/יהוה를 ‘야훼’로 음역해 고유한 신적 이름을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 역본의 원칙에 따라 신명 4자 이름을 칭호로 대체하지 않고, 원문이 드러내는 언약적 고유명을 보존했습니다.
  doctrine_reference: translation policy / divine name convention
- issue: ‘돌아오다’의 회개적 함의
  chosen_reading: ‘내게 돌아오지 않았습니다’로 옮겨 언약적 회복과 회개의 함의를 살렸습니다.
  alternative_readings:
  - 내게 돌아서지 않았습니다
  - 내게 다시 오지 않았습니다
  rationale: שׁוּב는 단순 이동보다 관계 회복과 회개의 맥락을 띠므로, 본문의 비난을 약화시키지 않으면서도 그 의미를 보존했습니다.
  doctrine_reference: translation policy / covenantal return
