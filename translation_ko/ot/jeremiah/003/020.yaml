id: JER.3.20
reference: Jeremiah 3:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'as a wife betrays her husband.' The Hebrew says literally 'a woman' and 'her companion,' but the broader context uses marital imagery for Israel's unfaithfulness.
    reason: alternative_reading
translation:
  language: ko
  text: 확실히, 한 여자가 자기 동반자를 배신하는 것처럼 — 이스라엘 집이여, 너희도 나를 배신하였습니다. 야훼의 말씀이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 아내가 자기 남편을 배신하는 것처럼’. 히브리어는 문자적으로 ‘한 여자’와 ‘자기 동반자’라고 말하지만, 더 넓은 문맥은 이 불신실함을 혼인 이미지로 그리고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  english_pob_choice: Surely
  chosen_korean: 확실히
  alternatives_korean:
  - 정녕
  - 참으로
  lexicon: HALOT
  rationale: 문맥의 강한 서두 감탄을 살리면서도 현대 한국어에서 자연스러운 강조 표현으로 옮겼습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 한 여자
  alternatives_korean:
  - 한 아내
  - 한 여인
  lexicon: HALOT
  rationale: 히브리어는 명시적으로 ‘아내’가 아니라 ‘여자’이므로, 본문 수준에서는 더 좁히지 않고 번역했습니다.
- source_word: מֵרֵעָהּ
  english_pob_choice: her companion
  chosen_korean: 자기 동반자
  alternatives_korean:
  - 자기 친구
  - 자기 남편
  lexicon: HALOT
  rationale: רֵעַ의 기본 범위인 동반자/동료/친구를 살려, 관계를 좁혀 규정하지 않도록 했습니다.
- source_word: בָּגְדָה / בְּגַדְתֶּם
  english_pob_choice: betrays / have betrayed
  chosen_korean: 배신하는 / 배신하였습니다
  alternatives_korean:
  - 간음을 저지르는 / 간음을 저질렀습니다
  - 불성실하게 대하는 / 불성실하게 대하였습니다
  lexicon: HALOT
  rationale: בגד의 핵심인 관계적·언약적 배반을 한국어에서 직접적으로 드러내는 ‘배신하다’를 선택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 공식문구를 살리되, POB의 야훼 표기를 유지하고 한국어 문맥에 맞는 종결형으로 옮겼습니다.
theological_decisions:
- issue: 비교절의 관계 규정
  chosen_reading: 본문은 ‘여자’와 ‘동반자’라는 넓은 표현을 유지하고, 남편-아내 관계를 본문 본문에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 한 아내가 자기 남편을 배신하는 것처럼
  rationale: 예레미야 3장의 문맥상 혼인 이미지는 분명하지만, 여기의 히브리어 단어 자체는 더 넓은 관계를 가리킵니다. 해석을 본문에 앞질러 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 범위를 넘는 해석의 조기 확정 방지
