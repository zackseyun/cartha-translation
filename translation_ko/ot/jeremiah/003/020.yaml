  - 한 여인
  lexicon: HALOT
  rationale: 히브리어는 명시적으로 ‘아내’가 아니라 ‘여자’이므로, 본문 수준에서는 더 좁히지 않고 번역했습니다.
- source_word: מֵרֵעָהּ
  english_pob_choice: her companion
  chosen_korean: 자기 동반자
  alternatives_korean:
  - 자기 친구
  - 자기 남편
  lexicon: HALOT
  rationale: רֵעַ의 기본 범위인 동반자/동료/친구를 살려, 관계를 좁혀 규정하지 않도록 했습니다.
- source_word: בָּגְדָה / בְּגַדְתֶּם
  english_pob_choice: betrays / have betrayed
  chosen_korean: 배신하는 / 배신하였습니다
  alternatives_korean:
  - 간음을 저지르는 / 간음을 저질렀습니다
  - 불성실하게 대하는 / 불성실하게 대하였습니다
  lexicon: HALOT
  rationale: בגד의 핵심인 관계적·언약적 배반을 한국어에서 직접적으로 드러내는 ‘배신하다’를 선택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 공식문구를 살리되, POB의 야훼 표기를 유지하고 한국어 문맥에 맞는 종결형으로 옮겼습니다.
theological_decisions:
- issue: 비교절의 관계 규정
  chosen_reading: 본문은 ‘여자’와 ‘동반자’라는 넓은 표현을 유지하고, 남편-아내 관계를 본문 본문에 직접 삽입하지 않았습니다.
  alternative_readings:
  - 한 아내가 자기 남편을 배신하는 것처럼
  rationale: 예레미야 3장의 문맥상 혼인 이미지는 분명하지만, 여기의 히브리어 단어 자체는 더 넓은 관계를 가리킵니다. 해석을 본문에 앞질러 넣지 않고 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 본문이 허용하는 범위를 넘는 해석의 조기 확정 방지
