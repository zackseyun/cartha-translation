revisions:
- from: 확실히, 한 여자가 자기 동반자를 배신하는 것처럼 — 이스라엘 집이여, 너희도 나를 배신하였습니다. 야훼의 말씀이십니다.[a]
  to: 참으로 한 여인이 자기 짝을 배신하듯이, 이스라엘 집아, 너희가 나를 배신하였다. 이는 야훼의 말씀입니다.[a]
  rationale: 본문의 관계를 ‘남편’으로 확정하지 않는 원칙은 유지하되, 번역투인 ‘동반자’를 자연스러운 ‘짝’으로 바꾸었습니다. 예언자적 종결 공식은 히브리어 נְאֻם의 선언 기능과 현대 합쇼체에 맞게 ‘이는 야훼의 말씀입니다’로 바로잡았습니다. 각주는 원문의 문자적 표현과 문맥상 가능한 혼인 읽기를 계속 구별합니다.
