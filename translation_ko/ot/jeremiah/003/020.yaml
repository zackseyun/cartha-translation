source:
  edition: WLC
  text: אָכֵ֛ן בָּגְדָ֥ה אִשָּׁ֖ה מֵ/רֵעָ֑/הּ כֵּ֣ן בְּגַדְתֶּ֥ם בִּ֛/י בֵּ֥ית יִשְׂרָאֵ֖ל נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/020.yaml
  text: Surely[a], as a woman betrays her companion, so you have betrayed me, O house of Israel, declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'as a wife betrays her husband.' The Hebrew says literally 'a woman' and 'her companion,' but the broader context uses marital imagery for Israel's unfaithfulness.
    reason: alternative_reading
translation:
  language: ko
  text: 참으로 한 여인이 자기 짝을 배신하듯이, 이스라엘 집아, 너희가 나를 배신하였다. 이는 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 아내가 자기 남편을 배신하듯이’. 히브리어는 문자적으로 ‘한 여자’와 ‘자기 동반자’라고 말하지만, 더 넓은 문맥은 이 불신실함을 혼인 이미지로 그리고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  english_pob_choice: Surely
  chosen_korean: 확실히
  alternatives_korean:
  - 정녕
  - 참으로
  lexicon: HALOT
  rationale: 문맥의 강한 서두 감탄을 살리면서도 현대 한국어에서 자연스러운 강조 표현으로 옮겼습니다.
- source_word: אִשָּׁה
  english_pob_choice: a woman
  chosen_korean: 한 여자
  alternatives_korean:
