  source_fidelity: 히브리어의 강조(אָכֵן), 비교 구조, ‘여자’와 관계를 특정하지 않는 רֵעַ의 표현, 이스라엘 집을 향한 복수 2인칭, 그리고 נְאֻם יְהוָה의 예언자적 공식문구는 모두 대체로 잘 반영되었습니다. 다만 ‘동반자’는 이 관계적 비유에서 현대 한국어로 다소 부자연스럽고, ‘야훼의 말씀이십니다’는 נְאֻם의 선언 공식 및 비인격 명사에 대한 높임 표현을 정확하고 자연스럽게 처리하지 못합니다.
  naturalness: ‘한 여인이 자기 짝을 배신하듯이’가 문맥상 자연스러우면서도 남편이라고 단정하지 않습니다. ‘이스라엘 집아’는 직접 호격을 자연스럽게 보존하며, ‘이는 야훼의 말씀입니다’는 현대 합쇼체의 예언자적 공식문구로 적절합니다.
  terminology: ‘배신하다’는 בגד의 관계적·언약적 배반을 적절히 전달합니다. ‘여인’은 אִשָּׁה의 넓은 의미를 유지합니다. ‘짝’은 ‘동반자’보다 자연스러우며, 각주를 통해 가능한 혼인 관계의 구체화를 보존합니다. 야훼 표기는 초안의 명명 정책과 일관됩니다.
