base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
  footnotes:
  - marker: a
    text: Or, more broadly, 'among the children'; Hebrew literally 'among the sons.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase here is difficult; it may mean 'the most splendid heritage of the nations' or 'a glorious inheritance among the nations.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 말했습니다. “내가 어찌 너를 아들들[a] 가운데에 두고, 너에게 사모할 만한 땅, 곧 민족들의 무리 가운데 가장 아름다운 기업[b]을 주려 하였는가?” 또 내가 말했습니다. “너희가 나를 ‘나의 아버지’라고 부르며, 나를 따르는 데서 돌아서지 않을 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 넓게는 ‘자녀들 가운데’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘아들들 가운데’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 구문은 난해합니다. ‘민족들 가운데 가장 빼어난 기업’, ‘민족들의 영광스러운 기업’ 또는 ‘민족들의 군대의 가장 아름다운 기업’으로 이해할 수도 있습니다.
    reason: alternative_reading
