  - 너는 내게 ‘내 아버지’라고 부를 것이며
  lexicon: HALOT
  rationale: ‘부르다’가 가장 직접적으로 호칭 관계를 드러내므로 채택했습니다. 단수/복수의 흔들림은 한국어에서 문맥상 자연스럽게 단수로 처리했습니다.
