base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/019.yaml
  text: And I said[a], ‘How I would set you among the sons and give you a desirable land, the most beautiful inheritance of the nations' armies.’ And I said, ‘You will call me[b], “My Father,” and you will not turn away from following me.’
  footnotes:
  - marker: a
    text: Or, more broadly, 'among the children'; Hebrew literally 'among the sons.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase here is difficult; it may mean 'the most splendid heritage of the nations' or 'a glorious inheritance among the nations.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 말했습니다[a], “내가 어떻게 너를 아들들 가운데에 두고, 너에게 아름다운 땅을 주며, 민족들의 군대 가운데 가장 아름다운 기업을 주겠느냐.” 또 내가 말했습니다. “너는 나를 ‘내 아버지’라고 부를 것이며, 나를 따르다가 돌아서지 않을 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 넓게는 ‘자녀들 가운데’라는 뜻일 수 있습니다. 히브리어는 문자적으로 ‘아들들 가운데’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How I would
  chosen_korean: 내가 어떻게
  alternatives_korean:
  - 내가 얼마나
  - 내가 어찌
  lexicon: HALOT
  rationale: 반성적·감탄적 뉘앙스를 살리되, 하나님의 의도를 회상하는 문맥에 맞게 자연스러운 합쇼체로 옮겼습니다.
- source_word: בַּבָּנִים
  english_pob_choice: among the sons
  chosen_korean: 아들들 가운데에
  alternatives_korean:
  - 자녀들 가운데에
  - 아이들 가운데에
  lexicon: HALOT
  rationale: 히브리어의 남성 복수형을 보존해 언어적 표지를 드러냈고, POB의 성별-정확성 방침을 따랐습니다.
- source_word: אֶרֶץ חֶמְדָּה
  english_pob_choice: a desirable land
  chosen_korean: 아름다운 땅
  alternatives_korean:
  - 기쁜 땅
  - 바람직한 땅
  lexicon: HALOT
  rationale: חמדה의 ‘바람직함/사랑스러움/귀함’ 범위를 한국어에서 가장 자연스럽게 살릴 수 있는 표현으로 옮겼습니다.
- source_word: נַחֲלַת צְבִי צִבְא֣וֹת גּוֹיִם
  english_pob_choice: the most beautiful inheritance of the nations’ armies
  chosen_korean: 민족들의 군대 가운데 가장 아름다운 기업
  alternatives_korean:
  - 민족들 가운데의 영광스러운 기업
  - 민족들의 가장 빼어난 유산
  lexicon: HALOT
  rationale: 난해한 압축 구문이므로 어휘 요소를 가급적 보존해 옮겼습니다. צְבִי/צִבְאוֹת를 ‘아름다운/군대’로 분해해 드러내되, 한국어에서는 의미가 통하도록 ‘가장 아름다운 기업’으로 정리했습니다.
- source_word: אָבִי תקראו לִי
  english_pob_choice: You will call me, “My Father,”
  chosen_korean: 너는 나를 ‘내 아버지’라고 부를 것이며
  alternatives_korean:
  - 너희는 나를 ‘내 아버지’라고 부를 것이며
  - 너는 내게 ‘내 아버지’라고 부를 것이며
  lexicon: HALOT
  rationale: ‘부르다’가 가장 직접적으로 호칭 관계를 드러내므로 채택했습니다. 단수/복수의 흔들림은 한국어에서 문맥상 자연스럽게 단수로 처리했습니다.
theological_decisions:
- issue: 가족적 입양/친자 관계를 암시하는 בַּבָּנִים의 처리
  chosen_reading: 아들들 가운데에
  alternative_readings:
  - 자녀들 가운데에
  rationale: 본문의 남성 복수형을 지키는 것이 원문의 표지를 더 정확히 드러냅니다. 다만 한국어에서는 포괄적 가족 의미가 떠오를 수 있어, 본문은 성별 표지를 유지하되 별도 주석은 두지 않았습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: 난해한 ‘נַחֲלַת צְבִי צִבְאוֹת גּוֹיִם’의 처리
  chosen_reading: 민족들의 군대 가운데 가장 아름다운 기업
  alternative_readings:
  - 민족들 가운데의 영광스러운 기업
  - 민족들의 가장 빼어난 유산
  rationale: 히브리어가 매우 압축적이어서 한 가지 해석으로 과도하게 정리하지 않았습니다. 어휘의 긴장을 살리면서도 한국어 독자가 읽을 수 있는 형태로 최소한의 매끈함만 부여했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 3
