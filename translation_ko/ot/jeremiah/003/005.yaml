    issue: ‘그것을 지키시겠습니까?’가 שׁמר의 문맥적 목적어인 분노를 충분히 드러내지 못하고, ‘지키다’가 보호한다는 의미로 오해될 수 있습니다.
    rationale: נטר와 שׁמר는 여기서 하나님이 분노·원한을 계속 간직하시는지를 묻는 병행 표현입니다. ‘그 노를 끝까지 간직하시겠습니까?’는 생략된 목적어를 명료하게 보충하면서도 뜻을 과도하게 해석하지 않습니다.
  - severity: high
