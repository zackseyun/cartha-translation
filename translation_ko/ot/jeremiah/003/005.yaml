source:
  edition: WLC
  text: הֲ/יִנְטֹ֣ר לְ/עוֹלָ֔ם אִם יִשְׁמֹ֖ר לָ/נֶ֑צַח הִנֵּ֥ה דברתי וַ/תַּעֲשִׂ֥י הָ/רָע֖וֹת וַ/תּוּכָֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/005.yaml
  text: Will he be angry forever? Will he keep it to the end? Look[a], you have spoken, and you have done evil things[c][b], and you have prevailed.
  footnotes:
  - marker: a
    text: Or, more literally, 'Will he keep anger forever? Will he guard it perpetually?'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew consonants of 'you have spoken' can also be read 'I have spoken'; the context favors addressing Judah's own words.
    reason: textual_variant
  - marker: c
    text: Or 'and you were able,' with the sense that Judah persisted successfully in doing evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 영원히 노를 품으시겠습니까? 그 노를 끝까지 간직하시겠습니까? 보십시오, 당신은 말하였고[a], 악한 일들을 행하였으며[b], 또 해냈습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 기록형(케티브)은 ‘내가 말하였다’로 읽힐 수 있습니다. 그러나 읽기 전통(케레)과 문맥은 유다를 직접 꾸짖는 ‘당신은 말하였다’를 지지합니다.
    reason: textual_variant
  - marker: b
    text: ‘악한 일들’은 히브리어의 정관사와 복수형을 반영한 표현입니다.
    reason: source_note
  - marker: c
    text: 직역하면 ‘또 능하였다’ 또는 ‘또 이겼다’입니다. 여기서는 유다가 악을 행하는 일을 성공적으로 지속했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִנְטֹר
  english_pob_choice: Will he be angry
  chosen_korean: 그가 영원히 노를 품으시겠습니까?
  alternatives_korean:
  - 그가 영원히 분노를 간직하시겠습니까?
  - 그가 원한을 품으시겠습니까?
  lexicon: HALOT
  rationale: נטר는 여기서 분노나 원한을 오래 간직하는 뜻이므로, 한국어로는 자연스럽게 ‘노를 품다’로 옮겨 수사적 질문의 힘을 살렸습니다.
- source_word: יִשְׁמֹר לָנֶצַח
  english_pob_choice: Will he keep it to the end
  chosen_korean: 끝까지 그것을 지키시겠습니까?
  alternatives_korean:
  - 영원히 그것을 지키시겠습니까?
  - 끝내 그것을 붙들고 계시겠습니까?
  lexicon: HALOT
  rationale: שׁמר의 ‘지키다/간직하다’와 לָנֶצַח의 지속성을 살리되, 앞의 ‘영원히’와 중복을 피하기 위해 ‘끝까지’로 조정했습니다.
- source_word: דברתי
  english_pob_choice: you have spoken
  chosen_korean: 당신은 말하였고
  alternatives_korean:
  - 내가 말하였고
  - 당신이 말하였고
  lexicon: HALOT
  rationale: 자음본문은 ‘내가 말하였다’로도 읽을 수 있지만, 문맥상 유다를 직접 책망하는 흐름이 더 자연스러우므로 ‘당신은’으로 옮겼습니다.
- source_word: הָרָעוֹת
  english_pob_choice: the evil things
  chosen_korean: 악한 일들을
  alternatives_korean:
  - 그 악한 일들을
  - 악행들을
  lexicon: HALOT
  rationale: 정관사와 복수형이 가리키는 구체적 행위를 살려 ‘악한 일들’로 옮겼으며, 전형적 교회어보다 원문의 개별 행위 뉘앙스를 보존했습니다.
- source_word: וַתּוּכָל
  english_pob_choice: and you have prevailed
  chosen_korean: 또 능하였습니다
  alternatives_korean:
  - 그리고 이겼습니다
  - 또 성공하였습니다
  - 그리고 계속할 수 있었습니다
  lexicon: HALOT
  rationale: יכל은 ‘능하다, 이기다, 해내다’의 뜻이므로, 악을 지속적으로 해낸다는 뉘앙스를 담아 ‘능하였습니다’로 옮겼습니다.
theological_decisions:
- issue: 직접 꾸짖는 화자의 흐름
  chosen_reading: 마지막 절은 여호와의 책망이 유다를 직접 향하는 말로 읽었습니다.
  alternative_readings:
