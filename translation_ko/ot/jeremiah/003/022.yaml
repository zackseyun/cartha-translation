  text: שׁ֚וּבוּ בָּנִ֣ים שׁוֹבָבִ֔ים אֶרְפָּ֖ה מְשׁוּבֹֽתֵי/כֶ֑ם הִנְ/נוּ֙ אָתָ֣נוּ לָ֔/ךְ כִּ֥י אַתָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/022.yaml
  text: Return[a], O backsliding children; I will heal your backslidings. Behold, we come to you[b], for you are Yahweh our God.
  footnotes:
  - marker: a
    text: Or 'wayward sons' or 'faithless children.' The Hebrew repeats the root idea of turning away and returning.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will heal your apostasies' or 'your turning away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 돌아오십시오, 떠나간 아들들아[a]. 내가 너희의 떠나감을 고쳐 주겠습니다[b]. 보십시오, 우리가 주님께 왔습니다. 주님은 우리의 하나님이신 야훼이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘변절한 아들들’ 또는 ‘신실하지 않은 자녀들’. 히브리어는 ‘돌아오다’와 하나님에게서 ‘떠나다’라는 관련 어근을 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘너희의 배반들을 치유하겠다’ 또는 ‘너희가 돌아선 것을 고치겠다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבוּ
  english_pob_choice: Return
  chosen_korean: 돌아오십시오
  alternatives_korean:
  - 돌아가십시오
  - 회개하십시오
  lexicon: HALOT
  rationale: 명령형 복수의 שוב를 관계 회복을 향한 초대로 살리기 위해 ‘돌아오십시오’를 썼고, 단순한 내적 회개로만 좁히지 않았습니다.
- source_word: בָּנִים שׁוֹבָבִים
  english_pob_choice: backsliding children
  chosen_korean: 반역하는 아들들
  alternatives_korean:
  - 방황하는 자녀들
  - 배교한 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 형식을 살려 ‘아들들’로 옮기되, שׁוֹבָבִים의 이탈·반역 뉘앙스를 ‘반역하는’으로 드러냈습니다.
- source_word: מְשׁוּבֹתֵיכֶם
  english_pob_choice: your backslidings
  chosen_korean: 너희의 등짐
  alternatives_korean:
  - 너희의 등짐을 져버림
  - 너희의 돌아섬
  lexicon: HALOT
  rationale: 본문은 שוב 어근의 반복으로 ‘돌아섬/이탈’의 완치 이미지를 형성하므로, 히브리어의 반복 효과를 살리려 했습니다. 다만 한국어에서는 ‘등짐’이 부자연스러워 본문을 더 직접적으로 드러내는 표현으로 조정했습니다.
- source_word: יְהֹוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼, 우리의 하나님
  alternatives_korean:
  - 여호와, 우리의 하나님
  - 주님, 우리의 하나님
  lexicon: HALOT
  rationale: 여호와 이름 יהוה를 소리값에 가깝게 ‘야훼’로 옮겨 언약의 이름을 보존했고, 소유격은 관계를 분명히 하는 ‘우리의 하나님’으로 처리했습니다.
theological_decisions:
- issue: 예언자적 회복 초청의 어조
  chosen_reading: 명령형 ‘돌아오십시오’와 하나님의 치유 약속을 한 문장 안에 함께 살렸습니다.
  alternative_readings:
  - ‘회개하십시오’로 도덕적 명령을 강조
  - ‘돌아가십시오’로 더 중립적으로 처리
  rationale: 본문은 단순한 정죄가 아니라 언약 백성에게 다시 오라고 부르시는 초청이므로, 초청성과 회복성을 동시에 드러내는 어조가 필요합니다.
  doctrine_reference: Jeremiah 3:22 source rhetoric
