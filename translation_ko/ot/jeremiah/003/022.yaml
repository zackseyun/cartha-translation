- from: 돌아오십시오, 반역하는 아들들아. 내가 너희의 등짐을 고쳐 주겠습니다. 보십시오, 우리가 주님께로 옵니다. 당신은 야훼, 우리의 하나님이시기 때문입니다.[a][b]
  to: 돌아오십시오, 떠나간 아들들아[a]. 내가 너희의 떠나감을 고쳐 주겠습니다[b]. 보십시오, 우리가 주님께 왔습니다. 주님은 우리의 하나님이신 야훼이시기 때문입니다.
