  source_fidelity: 현 초안의 ‘너희의 등짐을’은 מְשׁוּבוֹתֵיכֶם(너희의 돌아섬/이탈/배반들)를 전혀 반영하지 못하므로 교정이 필요합니다. 또한 הִנְנוּ אָתָנוּ는 ‘보십시오, 우리가 … 왔습니다’라는 응답의 선언으로 옮기는 것이 좋습니다.
