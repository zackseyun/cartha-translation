id: JER.3.18
reference: Jeremiah 3:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔מָּה יֵלְכ֥וּ בֵית יְהוּדָ֖ה עַל בֵּ֣ית יִשְׂרָאֵ֑ל וְ/יָבֹ֤אוּ יַחְדָּו֙ מֵ/אֶ֣רֶץ צָפ֔וֹן עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר הִנְחַ֖לְתִּי אֶת אֲבוֹתֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/018.yaml
  text: In those days the house of Judah will go with the house of Israel[b][a], and they will come together from the land of the north to the land that I gave as an inheritance to your fathers.
  footnotes:
  - marker: a
    text: Or 'the house of Judah will go to the house of Israel.' The Hebrew preposition can be rendered more literally, but here likely expresses Judah joining Israel in restored unity.
    reason: alternative_reading
  - marker: b
    text: Or 'your ancestors.' The Hebrew reads 'your fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날들에 유다의 집은 이스라엘의 집과 함께 북쪽 땅에서 와서, 내가 너희 조상들에게 유산으로 준 땅으로 함께 오게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘너희 아버지들’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘to/against/upon the house of Israel’로도 옮길 수 있으나, 여기서는 회복된 연합을 드러내기 위해 ‘함께’로 풀어 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה
  english_pob_choice: In those days
  chosen_korean: 그날들에
  alternatives_korean:
  - 그때에
  - 그러한 날들에
  lexicon: HALOT
  rationale: 예언적 미래를 여는 관용구로서, 문맥의 회복 약속을 자연스럽게 살리면서도 시상(時相)을 유지합니다.
- source_word: בֵית יְהוּדָה / בֵית יִשְׂרָאֵל
  english_pob_choice: the house of Judah / the house of Israel
  chosen_korean: 유다의 집 / 이스라엘의 집
  alternatives_korean:
  - 유다 / 이스라엘
  - 유다 가문 / 이스라엘 가문
  lexicon: HALOT
  rationale: ‘집’이라는 언약적·공동체적 표현을 유지해 분열된 두 공동체의 회복이라는 예언적 의미를 보존합니다.
- source_word: מֵאֶרֶץ צָפוֹן
  english_pob_choice: from the land of the north
  chosen_korean: 북쪽 땅에서
  alternatives_korean:
  - 북쪽 나라에서
  - 북방 땅에서
  lexicon: HALOT
  rationale: 지리적 표지를 직역에 가깝게 옮기되, 한국어에서 자연스러운 표현으로 다듬었습니다.
- source_word: אֲשֶׁר הִנְחַלְתִּי
  english_pob_choice: that I gave as an inheritance
  chosen_korean: 내가 … 유산으로 준
  alternatives_korean:
  - 내가 … 상속으로 준
  - 내가 … 분깃으로 준
  lexicon: HALOT
  rationale: נחל의 ‘유업/상속으로 주다’는 뜻을 살리되, 한국어에서는 ‘유산으로 주다’가 소유 부여와 계승의 뉘앙스를 함께 전달합니다.
- source_word: אֶת אֲבוֹתֵיכֶם
  english_pob_choice: to your fathers
  chosen_korean: 너희 조상들에게
  alternatives_korean:
  - 너희 아버지들에게
  - 너희 선조들에게
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘너희 아버지들’이지만, 여기서는 족장적/조상적 대상을 가리키므로 한국어에서는 오해를 줄이는 ‘조상들’을 택했습니다.
theological_decisions:
- issue: 유다와 이스라엘의 관계 표상
  chosen_reading: ‘유다의 집은 이스라엘의 집과 함께… 함께 오게 될 것입니다’로 옮겨, 어느 한쪽이 մյուս쪽으로 지배적으로 가는 장면이 아니라 회복된 연합을 드러냈습니다.
  alternative_readings:
  - ‘유다의 집은 이스라엘의 집에게/로 갈 것입니다’
  - ‘유다의 집은 이스라엘의 집 위로 갈 것입니다’
  rationale: עַל의 방향성을 그대로 기계적으로 살리면 위협적·공격적으로 들릴 수 있어, 문맥상 분열된 백성의 재결합이라는 예언의 흐름을 반영했습니다.
  doctrine_reference: 예언서의 회복과 연합에 대한 문맥 해석
- issue: 조상/아버지의 번역
  chosen_reading: ‘너희 조상들’로 옮겨 성별-직역보다 의미 중심을 취했습니다.
  alternative_readings:
  - ‘너희 아버지들’
  rationale: 원문은 남성 복수형이지만, 한국어에서는 이 표현이 현대 독자에게 부자 관계로 오해될 수 있어 공동체의 선조를 가리키는 의미를 분명히 했습니다.
  doctrine_reference: 번역 철학상 의미 전달과 성별 표지의 관계
