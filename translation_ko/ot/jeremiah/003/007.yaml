id: JER.3.7
reference: Jeremiah 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אַחֲרֵ֨י עֲשׂוֹתָ֧/הּ אֶת כָּל אֵ֛לֶּה אֵלַ֥/י תָּשׁ֖וּב וְ/לֹא שָׁ֑בָה ו/תראה בָּגוֹדָ֥ה אֲחוֹתָ֖/הּ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/007.yaml
  text: And I said[a], ‘After she had done all these things, she will return to me,’ but she did not return[c][b]; and her treacherous sister Judah saw it.
  footnotes:
  - marker: a
    text: Or “she would return to me.” The Hebrew imperfect can express expected future from a past point of view.
    reason: lexical_alternative
  - marker: b
    text: “Return” can also be rendered “turn back” or, in covenant context, “repent.”
    reason: lexical_alternative
  - marker: c
    text: Or “faithless sister Judah.” The Hebrew adjective can emphasize faithlessness or treachery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 말했습니다[a], ‘그가 이 모든 일을 한 뒤에 나에게 돌아올 것이다.’ 그러나 그는 돌아오지 않았습니다[b]. 그의 배신한 자매 유다가 그것을 보았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 나에게 돌아올 것이었다.” 히브리어 미완료형은 과거 시점에서 기대된 미래를 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “돌아오다”는 “되돌아오다” 또는 문맥상 “회개하다”로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 “배신한 자매 유다.” 히브리어 형용사는 불성실함이나 배신성을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: And I said
  chosen_korean: 그리고 내가 말했습니다
  alternatives_korean:
  - 그때 내가 말했습니다
  - 내가 말했습니다
  lexicon: HALOT
  rationale: 과거 서술의 연결을 자연스럽게 살리면서, 예언자적 보고체의 흐름을 한국어 합쇼체로 무리 없이 옮겼습니다.
- source_word: אֲחֲרֵי עֲשׂוֹתָהּ אֶת כָּל אֵלֶּה
  english_pob_choice: After she had done all these things
  chosen_korean: 그가 이 모든 일을 한 뒤에
  alternatives_korean:
  - 그가 이 모든 일을 한 후에
  - 그가 이 모든 일을 하고 난 뒤에
  lexicon: HALOT
  rationale: אַחֲרֵי + 동사구의 시간 관계를 한국어의 ‘한 뒤에’로 자연스럽게 풀어, 뒤따르는 기대를 위한 선행 완료를 드러냈습니다.
- source_word: אֵלַי תָּשׁוּב / וְלֹא שָׁבָה
  english_pob_choice: she will return to me / but she did not return
  chosen_korean: 나에게 돌아올 것이다 … 그러나 그는 돌아오지 않았습니다
  alternatives_korean:
  - 나에게 돌아올 것입니다 … 그러나 돌아오지 않았습니다
  - 나에게 돌아와야 할 것입니다 … 그러나 돌아오지 않았습니다
  - 나에게 돌아올 것이다 … 그러나 돌아오지 않았다
  lexicon: HALOT
  rationale: שׁוּב의 반복을 ‘돌아오다’로 일관되게 살려, 단순 이동이 아니라 관계적·언약적 귀환의 긴장을 유지했습니다.
- source_word: בָּגוֹדָה
  english_pob_choice: treacherous
  chosen_korean: 배신한
  alternatives_korean:
  - 불성실한
  - 신의를 저버린
  - 배반한
  lexicon: HALOT
  rationale: בגד의 핵심 의미인 배신·배반의 뉘앙스를 한국어의 ‘배신한’으로 직접적으로 반영했습니다.
theological_decisions:
- issue: שׁוּב의 언약적 의미
  chosen_reading: ‘돌아오다’로 번역해 물리적 귀환과 언약적 회심의 긴장을 함께 남겼습니다.
  alternative_readings:
  - ‘회개하다’
  - ‘돌이키다’
  rationale: 예레미야 문맥에서 שׁוּב는 단순 복귀와 언약적 돌이킴을 함께 함의하므로, 한쪽으로 좁히지 않고 ‘돌아오다’로 보존하는 편이 원문 긴장을 더 잘 살립니다.
  doctrine_reference: Translation philosophy §3 (preserve theological tension rather than resolve it)
