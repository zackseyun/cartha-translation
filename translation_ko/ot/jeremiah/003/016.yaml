  text: וְ/הָיָ֡ה כִּ֣י תִרְבּוּ֩ וּ/פְרִיתֶ֨ם בָּ/אָ֜רֶץ בַּ/יָּמִ֤ים הָ/הֵ֨מָּה֙ נְאֻם יְהוָ֔ה לֹא יֹ֣אמְרוּ ע֗וֹד אֲרוֹן֙ בְּרִית יְהוָ֔ה וְ/לֹ֥א יַעֲלֶ֖ה עַל לֵ֑ב וְ/לֹ֤א יִזְכְּרוּ ב/וֹ֙ וְ/לֹ֣א יִפְקֹ֔דוּ וְ/לֹ֥א יֵעָשֶׂ֖ה עֽוֹד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/016.yaml
  text: And it shall be[a], when you have multiplied and been fruitful in the land in those days, declares Yahweh, they will no longer say, ‘The ark of the covenant of Yahweh.’ It will not come to mind, and they will not remember it or miss it[b], nor will it be made again.
  footnotes:
  - marker: a
    text: Or, 'or attend to it,' 'or seek it out.' The Hebrew verb can carry several related senses; here it likely means they will no longer feel the need for the ark or note its absence.
    reason: lexical_alternative
  - marker: b
    text: Or, 'nor will another one be made.' The Hebrew is passive and leaves the object implicit; the sense is that no replacement ark will be constructed.
    reason: alternative_reading
translation:
  language: ko
  text: 그 때에 너희가 그 땅에서 많아지고 번성할 때, 야훼의 말씀입니다. 사람들은 다시는 「야훼의 언약궤」라고 말하지 않을 것입니다. 그것은 마음에 떠오르지 않을 것이며, 그들은 그것을 기억하지도 찾지도 않을 것이며[a], 다시는 그것이 만들어지지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 살피지도 않을 것이며’, ‘그것의 부재를 더 이상 의식하지 않을 것이며’로 옮길 수 있습니다. 히브리어 פקד는 여기서 언약궤를 찾거나 살피고, 그 필요 또는 부재를 의식하는 뜻을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘다시는 다른 하나가 만들어지지 않을 것입니다.’ 히브리어는 수동형이며, 만들어지는 대상은 문맥상 언약궤이지만 문장 안에서는 명시되지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And it shall be, when
  chosen_korean: 그 날에, …하면
  alternatives_korean:
  - 그리고 …할 때
  - 그 때에, …하면
  lexicon: HALOT
  rationale: 예언적 도입 공식의 시간 조건을 자연스러운 한국어로 옮기되, 미래적·선언적 분위기를 유지했습니다.
- source_word: תִרְבּוּ וּפְרִיתֶם
  english_pob_choice: you have multiplied and been fruitful
  chosen_korean: 너희가 그 땅에서 많아지고 번성하면
  alternatives_korean:
  - 너희가 번성하고 결실하면
  - 너희가 증가하고 열매 맺으면
  lexicon: HALOT
  rationale: ‘많아지다’와 ‘번성하다’로 번역해 רבה/פרה의 중첩된 증가·생산성 의미를 살렸습니다.
- source_word: אֲרוֹן בְּרִית יְהוָה
  english_pob_choice: The ark of the covenant of Yahweh
  chosen_korean: 「야훼의 언약궤」
  alternatives_korean:
  - 「야훼의 언약궤」
  - 「야훼의 계약궤」
  lexicon: HALOT
  rationale: הארון־ברית는 관용적으로 ‘언약궤’가 가장 직접적이며, 소유격 구조를 한국어 어순에 맞게 정리했습니다.
- source_word: לֹא יִפְקֹדוּ
  english_pob_choice: or miss it
  chosen_korean: 그리워하지도 않을 것이며
  alternatives_korean:
  - 찾지도 않을 것이며
  - 찾아보지도 않을 것이며
  lexicon: HALOT
  rationale: פקד는 문맥상 단순한 ‘기억’보다 ‘찾아 찾음/필요로 함/결핍을 느낌’의 뉘앙스를 가지므로, POB의 ‘miss it’를 따라 ‘그리워하다’로 옮겨 존재 의미의 상실감을 드러냈습니다.
- source_word: וְלֹא יֵעָשֶׂה עוֹד
  english_pob_choice: nor will it be made again
  chosen_korean: 다시는 만들지 않을 것입니다
  alternatives_korean:
  - 다시는 만들어지지 않을 것입니다
  - 다시는 제작되지 않을 것입니다
  lexicon: HALOT
  rationale: 수동형의 암시된 목적물을 한국어에서는 자연스럽게 ‘언약궤’를 지시하는 표현으로 풀어, 반복 제작의 부재를 분명히 했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: ‘야훼’로 옮겼습니다.
  alternative_readings:
  - ‘주님’으로 옮김
  - ‘여호와’로 옮김
  rationale: 본문에 신명기적 언약명 יְהוָה가 직접 나오므로, 프로젝트 기본 원칙에 따라 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 언약궤의 미래적 비중
  chosen_reading: 언약궤가 더 이상 언약생활의 중심 표지가 되지 않는다는 뜻을 그대로 살렸습니다.
  alternative_readings:
  - 언약궤의 물리적 상실만을 예고함
  - 언약 전통 전체의 폐기를 뜻함
  rationale: 연속된 부정문(말하지 않음, 마음에 오르지 않음, 기억/그리워하지 않음, 다시 만들지 않음)을 그대로 반영해, 본문이 말하는 범위를 넘어서지 않도록 했습니다.
  doctrine_reference: Jeremiah 3:16 context
