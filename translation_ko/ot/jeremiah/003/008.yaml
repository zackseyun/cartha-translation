revisions:
- from: 내가 보니, 배교한 이스라엘이 이 모든 일로 간음하였기 때문에 내가 그를 내쫓고 이혼 증서를 주었는데도, 그의 배신한 자매 유다는 두려워하지 않았습니다. 그러나 그녀도 가서 몸을 팔았습니다.[a][b][c]
  to: 내가 보니, 배교한 이스라엘[a]이 이 모든 일로 간음하였기 때문에, 내가 그녀를 내보내고 그녀에게 이혼 증서[b]를 주었습니다. 그러나 그 자매인 배신한 유다는 두려워하지 않고, 자신도 가서 음행하였습니다.[c]
  rationale: 수정문은 원문의 법적·혼인 비유와 이스라엘/유다의 상이한 책망을 유지합니다. ‘음행하였습니다’는 זנה의 비유적 성격을 보존하면서 현대 한국어에서 ‘몸을 팔다’가 유발하는 지나치게 구체적인 상업 성매매의 함의를 피합니다. 또한 대명사와 자매 관계를 분명히 하고, 각주를 실제 대안과 적절한 위치로 바로잡았습니다.
