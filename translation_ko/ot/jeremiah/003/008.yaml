review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal marital, divorce, and sexual-infidelity metaphor, but ‘몸을 팔았습니다’ narrows זנה to literal prostitution and is less suitable for this figurative prophetic context. The Korean possessive wording also obscures the feminine personification and the sister relationship.
  naturalness: The proposed revision is natural modern formal-polite Korean. It removes the awkward ‘그의 배신한 자매 유다’ and makes the contrast between Israel and Judah clear without unnecessarily repeating pronouns.
  terminology: ‘배교한’ and ‘배신한’ appropriately retain the distinction between מְשֻׁבָה and בֹּגֵדָה. ‘이혼 증서’ accurately conveys סֵפֶר כְּרִיתֻתֶיהָ. ‘음행하였습니다’ preserves the prophetic sexual metaphor without asserting the more specific notion of commercial sex implied by ‘몸을 팔다.’
  issues:
  - severity: medium
    issue: ‘몸을 팔았습니다’ is overly specific for וַתִּזֶן.
    rationale: The verb זנה can denote prostitution, but in this context it continues the chapter’s figurative accusation of covenantal sexual infidelity. ‘몸을 팔다’ readily suggests literal commercial sex in modern Korean and reduces the broader metaphor.
  - severity: medium
    issue: ‘그의 배신한 자매 유다’ is unclear and mismatched to the feminine personification.
    rationale: Israel is personified as a woman and Judah as her sister. ‘그의’ can be read as masculine and makes the relationship less clear. ‘그 자매인 배신한 유다’ expresses the Hebrew apposition naturally.
  - severity: low
    issue: All three supplied footnotes repeat the adopted wording rather than provide genuine alternatives.
    rationale: A lexical-alternative footnote should state an actual alternative and should be anchored at the relevant expression.
  revised_text: 내가 보니, 배교한 이스라엘[a]이 이 모든 일로 간음하였기 때문에, 내가 그녀를 내보내고 그녀에게 이혼 증서[b]를 주었습니다. 그러나 그 자매인 배신한 유다는 두려워하지 않고, 자신도 가서 음행하였습니다.[c]
