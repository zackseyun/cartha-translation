id: JER.3.8
reference: Jeremiah 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֵ֗רֶא כִּ֤י עַל כָּל אֹדוֹת֙ אֲשֶׁ֤ר נִֽאֲפָה֙ מְשֻׁבָ֣ה יִשְׂרָאֵ֔ל שִׁלַּחְתִּ֕י/הָ וָ/אֶתֵּ֛ן אֶת סֵ֥פֶר כְּרִיתֻתֶ֖י/הָ אֵלֶ֑י/הָ וְ/לֹ֨א יָֽרְאָ֜ה בֹּֽגֵדָ֤ה יְהוּדָה֙ אֲחוֹתָ֔/הּ וַ/תֵּ֖לֶךְ וַ/תִּ֥זֶן גַּם הִֽיא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/008.yaml
  text: And I saw that because backsliding Israel had committed adultery in all these matters[a], I had sent her away and given her a certificate of divorce. Yet her treacherous sister Judah did not fear[c][b], but she too went and prostituted herself.
  footnotes:
  - marker: a
    text: Or 'faithless Israel' for 'backsliding Israel.' The Hebrew term emphasizes turning away or apostasy.
    reason: lexical_alternative
  - marker: b
    text: Or 'a bill of divorce.' The Hebrew refers to the formal legal document of divorce.
    reason: lexical_alternative
  - marker: c
    text: Or 'went and played the prostitute.' The phrase continues the chapter's metaphor of covenant unfaithfulness as sexual infidelity.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 보니, 배교한 이스라엘이 이 모든 일로 간음하였기 때문에 내가 그를 내쫓고 이혼 증서를 주었는데도, 그의 배신한 자매 유다는 두려워하지 않았습니다. 그러나 그녀도 가서 몸을 팔았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배교한 이스라엘’. 히브리어는 돌아섬과 배교의 뉘앙스를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이혼 증서’. 히브리어는 공식적인 이혼 문서를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘가서 몸을 팔았다’. 이 표현은 언약 불성실을 성적 배신의 비유로 이어 갑니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשֻׁבָה יִשְׂרָאֵל
  english_pob_choice: backsliding Israel
  chosen_korean: 배교한 이스라엘
  alternatives_korean:
  - 등을 돌린 이스라엘
  - 타락한 이스라엘
  - 믿음에서 돌아선 이스라엘
  lexicon: HALOT
  rationale: מְשֻׁבָה는 돌아섬/배교의 의미를 가지므로, 예언서의 책망 뉘앙스를 살려 ‘배교한’으로 옮겼습니다.
- source_word: עַל כָּל אֹדוֹת אֲשֶׁר
  english_pob_choice: in all these matters
  chosen_korean: 이 모든 일로
  alternatives_korean:
  - 이 모든 사유로
  - 이 모든 이유 때문에
  - 그 모든 일로
  lexicon: HALOT
  rationale: אֹדוֹת עם עַל은 ‘~때문에/~로 말미암아’의 관용구이므로, 원인의 누적성과 포괄성을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: סֵפֶר כְּרִיתֻתֶיהָ
  english_pob_choice: a certificate of divorce
  chosen_korean: 이혼 증서
  alternatives_korean:
  - 이혼 서류
  - 이혼 증명서
  - 이혼장
  lexicon: HALOT
  rationale: 이는 공식적인 이혼 문서이므로, 현대 한국어에서 법적 문서감을 유지하는 ‘이혼 증서’가 가장 직접적입니다.
- source_word: בֹּגֵדָה יְהוּדָה
  english_pob_choice: treacherous ... Judah
  chosen_korean: 배신한 자매 유다
  alternatives_korean:
  - 배반한 자매 유다
  - 간사한 자매 유다
  - 불충한 자매 유다
  lexicon: HALOT
  rationale: בגד는 단순 불성실보다 ‘배신/배반’의 뉘앙스가 강하므로, 이스라엘과의 대구를 살리면서도 윤리적 강도를 유지했습니다.
- source_word: וַתִּזֶן
  english_pob_choice: prostituted herself
  chosen_korean: 몸을 팔았습니다
  alternatives_korean:
  - 창녀처럼 행했습니다
  - 음행했습니다
  - 음란을 저질렀습니다
  lexicon: HALOT
  rationale: 예언적 비유의 성적·관계적 충격을 지나치게 약화시키지 않으면서도, 오늘날 한국어에서 자연스럽고 직설적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 언약 파기의 혼합 비유 유지
  chosen_reading: 간음, 내쫓고, 이혼 증서, 몸을 팔다의 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 언약에 불충실했다로 완화
  - 우상숭배했다로 해석적 대체
  rationale: 히브리어 본문은 언약 파괴를 결혼/이혼/성적 배신의 비유로 강하게 말하므로, 이를 완화하면 본문의 예언적 고발이 약해집니다.
  doctrine_reference: 예언서 비유 해석 원칙
- issue: 이스라엘과 유다의 구별된 책망 유지
  chosen_reading: 이스라엘은 ‘배교한’, 유다는 ‘배신한’으로 구별했습니다.
  alternative_readings:
  - 둘 다 ‘불신실한’으로 통일
  - 둘 다 ‘믿음 없는’으로 통일
  rationale: 서로 다른 히브리어 형용사(מְשֻׁבָה / בֹּגֵדָה)를 구별해 옮겨, 선지자의 수사적 대비를 보존했습니다.
  doctrine_reference: 문맥 충실 번역 원칙
