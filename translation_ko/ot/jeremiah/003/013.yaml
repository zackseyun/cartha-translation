  terminology: יהוה는 프로젝트 방침대로 ‘야훼’로 유지했습니다. לַזָּרִים은 본문에서 ‘낯선 자들에게’로 보존하고, ‘낯선 신들’이라는 문맥적 해석은 각주에만 제시했습니다.
