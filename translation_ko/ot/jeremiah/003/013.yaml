  to: 오직 네 죄를 인정하십시오. 이는 네가 네 하나님 야훼께 반역하고, 낯선 자들에게[a] 네 길을 흩어 놓았으며, 모든 푸른 나무 아래에서[b] 너희가 내 목소리에 순종하지 않았기 때문입니다. 야훼의 말씀입니다.
  rationale: 문장의 논리적 연결을 바로잡고, 죄의 인정이라는 명령과 반역·분산·불순종이라는 근거를 원문의 구조에 가깝게 옮겼습니다. 원문의 단수에서 복수로의 전환은 한국어에서도 ‘네가’와 ‘너희가’로 보존했습니다. ‘낯선 자들’이라는 의도적으로 열려 있는 표현은 본문에 유지하고, 우상 숭배적 해석은 각주에 한정했습니다.
  reviewer_model: gpt-5.6-terra
