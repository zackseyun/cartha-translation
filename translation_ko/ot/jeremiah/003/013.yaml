  verdict: revise
  source_fidelity: 원문의 명령(‘네 죄를 인정하라’)과 그 근거를 이루는 두 죄목을 더 정확히 반영했습니다. 특히 히브리어의 마지막 2인칭 복수형 ‘너희가’와 ‘목소리를 듣다’의 순종 의미를 살렸습니다.
