id: JER.3.13
reference: Jeremiah 3:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֚ךְ דְּעִ֣י עֲוֺנֵ֔/ךְ כִּ֛י בַּ/יהוָ֥ה אֱלֹהַ֖יִ/ךְ פָּשָׁ֑עַתְּ וַ/תְּפַזְּרִ֨י אֶת דְּרָכַ֜יִ/ךְ לַ/זָּרִ֗ים תַּ֚חַת כָּל עֵ֣ץ רַעֲנָ֔ן וּ/בְ/קוֹלִ֥/י לֹא שְׁמַעְתֶּ֖ם נְאֻם יְהֹוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/013.yaml
  text: Only acknowledge your guilt[a], that you have rebelled against Yahweh your God and scattered your ways among strangers under every green tree, and you have not obeyed my voice[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'spread your ways to strange gods.' The Hebrew says 'to strangers,' likely within the metaphor of adultery and idolatry, but does not explicitly supply 'gods.'
    reason: alternative_reading
  - marker: b
    text: '''Under every green tree'' is a recurring expression for places of illicit worship.'
    reason: cultural_note
translation:
  language: ko
  text: 오직 네 죄를 깨달으십시오[a]. 네가 너의 하나님 야훼께 반역하여 네 길을 낯선 자들에게 흩어 버렸고, 모든 푸른 나무 아래에서 내 목소리를 듣지 않았기 때문입니다[b] — 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 길을 낯선 신들에게 흩어 버렸고’로 옮길 수도 있습니다. 히브리어는 문자적으로 ‘낯선 자들’이라고 말하지만, 문맥상 우상 숭배를 가리키는 비유일 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: ‘모든 푸른 나무 아래’는 불법한 예배 장소를 가리키는 반복적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 단지
  - 오직 이것만
  lexicon: HALOT
  rationale: 제한·강조의 입자라서, 회개의 요구를 한 가지로 좁히는 힘을 살리는 ‘오직’이 가장 자연스럽습니다.
- source_word: דְּעִי עֲוֺנֵךְ
  english_pob_choice: acknowledge your guilt
  chosen_korean: 네 죄를 깨달으십시오
  alternatives_korean:
  - 네 죄를 인정하십시오
  - 네 죄악을 아십시오
  - 네 죄를 자백하십시오
  lexicon: HALOT
  rationale: 직역상 ‘알라’는 뜻이지만, 여기서는 죄를 직면하여 인정하라는 회개의 명령이므로 공손한 합쇼체로 ‘깨달으십시오’가 문맥과 어감 모두를 잘 살립니다.
- source_word: לַזָּרִים
  english_pob_choice: to strangers
  chosen_korean: 낯선 자들에게
  alternatives_korean:
  - 외인들에게
  - 낯선 신들에게
  - 이방인들에게
  lexicon: HALOT
  rationale: 본문은 ‘신들’이 아니라 ‘낯선 자들’이라고 말하므로, 우상 숭배를 암시하되 그 해석을 본문보다 앞서지 않게 하는 표현으로 옮겼습니다.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  english_pob_choice: under every green tree
  chosen_korean: 모든 푸른 나무 아래에서
  alternatives_korean:
  - 모든 무성한 나무 아래에서
  - 모든 푸른 나무 밑에서
  lexicon: HALOT
  rationale: 예언서에서 반복되는 불법 예배 장소의 관용구이므로, 상징을 풀기보다 본문의 이미지를 그대로 유지했습니다.
- source_word: וּבְקוֹלִי לֹא שְׁמַעְתֶּם
  english_pob_choice: you have not obeyed my voice
  chosen_korean: 내 목소리를 듣지 않았기 때문입니다
  alternatives_korean:
  - 내 목소리에 순종하지 않았기 때문입니다
  - 내 음성을 듣지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 ‘듣다’는 여기서 순종을 뜻하지만, 한국어에서는 ‘목소리를 듣지 않았다’가 더 직접적이고 자연스러워 그 의미를 담아 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본문이 신명기적 언약명인 יהוה를 직접 사용하므로, 프로젝트 기본값에 따라 음역형 ‘야훼’를 유지해 원문 고유성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → 야훼'
- issue: לַזָּרִים의 의미 범위
  chosen_reading: 낯선 자들에게
  alternative_readings:
  - 낯선 신들에게
  - 외국인들에게
  - 이방 신들에게
  rationale: 문맥상 우상 숭배를 암시하지만 히브리어는 ‘신들’이라고 명시하지 않으므로, 본문이 가진 해석적 긴장을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
