id: JER.3.15
reference: Jeremiah 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָתַתִּ֥י לָ/כֶ֛ם רֹעִ֖ים כְּ/לִבִּ֑/י וְ/רָע֥וּ אֶתְ/כֶ֖ם דֵּעָ֥ה וְ/הַשְׂכֵּֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/015.yaml
  text: And I will give you shepherds after my own heart[c][b][a], and they will shepherd you with knowledge and understanding.
  footnotes:
  - marker: a
    text: Or 'according to my heart.' The Hebrew expression means in accord with God's own will or desire.
    reason: lexical_alternative
  - marker: b
    text: '''Shepherds'' may also be rendered ''pastors,'' but the Hebrew image is the broader metaphor of those who tend God''s people.'
    reason: lexical_alternative
  - marker: c
    text: Or 'with knowledge and insight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 내 마음에 맞는 목자들을 주겠습니다. 그들은 지식과 깨달음으로 너희를 돌볼 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음에 따라.’ 이 히브리어 표현은 하나님의 뜻이나 소망에 합치된다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목자들’은 ‘목사들’로도 옮길 수 있으나, 히브리어 이미지는 하나님의 백성을 돌보는 더 넓은 비유입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘지식과 통찰로.’
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעִים
  english_pob_choice: shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 목양자들
  - 목사들
  lexicon: HALOT
  rationale: 히브리어 רֹעִים은 문자적으로 ‘목자들’이며, 본문은 교회 직분보다 하나님의 백성을 돌보는 비유를 유지하므로 ‘목자들’이 가장 직접적입니다.
- source_word: כְּלִבִּי
  english_pob_choice: after my own heart
  chosen_korean: 내 마음에 맞는
  alternatives_korean:
  - 내 마음을 따른
  - 내 뜻에 맞는
  lexicon: HALOT
  rationale: 관용구는 하나님의 마음/뜻과 합치됨을 뜻하므로, 한국어에서는 자연스럽게 ‘내 마음에 맞는’으로 옮겨 원문의 평가적·관계적 의미를 살렸습니다.
- source_word: דֵּעָה
  english_pob_choice: knowledge
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 인식
  lexicon: HALOT
  rationale: 앞의 ‘깨달음’과 구분되는 첫 번째 항목으로는 ‘지식’이 가장 간결하고, 실제로 백성을 이끄는 내용 지식을 드러냅니다.
- source_word: וְהַשְׂכֵּיל
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 분별
  - 통찰
  lexicon: HALOT
  rationale: 두 번째 항목은 사려 깊은 분별과 통찰을 가리키므로, 현대 한국어에서 자연스럽고 앞의 ‘지식’과 병렬을 이루는 ‘깨달음’을 택했습니다.
theological_decisions:
- issue: 목자들의 성격
  chosen_reading: 하나님이 주시는 인간 지도자들을 가리키는 목양 비유로 읽었습니다.
  alternative_readings:
  - 교회적 의미의 목사들로 한정하는 읽기
  - 왕이나 통치자만을 가리키는 좁은 읽기
  rationale: 예레미야 문맥에서 회복될 지도력을 약속하는 말이므로, 후대 교회 직분을 도입하지 않고 본문의 목양 이미지를 그대로 살리는 것이 더 충실합니다.
  doctrine_reference: 예레미야 3:15 문맥
- issue: ‘내 마음에 맞는’의 의미
  chosen_reading: 하나님이 기뻐하시는 뜻과 성품에 합치되는 지도자라는 뜻으로 옮겼습니다.
  alternative_readings:
  - 하나님이 감정적으로 좋아하시는 지도자
  - 단순히 하나님께 선택받은 지도자
  rationale: 히브리어 관용구는 정서적 호감보다 하나님의 뜻과 일치함을 뜻하므로, 한국어 표현도 그 신학적 긴장을 보존해야 합니다.
  doctrine_reference: 시편 132:11; 사무엘상 13:14의 관련 관용구
