id: JER.3.21
reference: Jeremiah 3:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ק֚וֹל עַל שְׁפָיִ֣ים נִשְׁמָ֔ע בְּכִ֥י תַחֲנוּנֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֤י הֶעֱוּוּ֙ אֶת דַּרְכָּ֔/ם שָׁכְח֖וּ אֶת יְהֹוָ֥ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/021.yaml
  text: A voice is heard on the bare heights[a], the weeping and pleas for mercy of the sons of Israel, because they have made their way crooked[c][b]; they have forgotten Yahweh their God.
  footnotes:
  - marker: a
    text: Or 'the children of Israel' or 'the people of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'have perverted their way' or 'have twisted their path.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'YHWH'; traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 민둥한 언덕들[a]에서 소리가 들립니다. 이스라엘 자손의 울음과 자비를 구하는 간구입니다. 그들이 그들의 길을 비뚤어지게 했기[b] 때문입니다. 그들은 자기 하나님 야훼[c]를 잊었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높은 곳들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 길을 굽게 했기’ 또는 ‘그들의 길을 비틀어 놓았기’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהֹוָה는 야훼입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ק֚וֹל
  english_pob_choice: A voice
  chosen_korean: 소리가
  alternatives_korean:
  - 목소리가
  - 외침이
  lexicon: HALOT
  rationale: קול은 기본적으로 ‘소리/목소리’를 뜻하므로, 여기서는 이어지는 ‘울음과 호소’에 자연스럽게 걸리는 ‘소리’로 옮겨 시각적·청각적 긴장을 살렸습니다.
- source_word: עַל שְׁפָיִים
  english_pob_choice: on the bare heights
  chosen_korean: 빈 들언덕들에서
  alternatives_korean:
  - 민둥한 높은 곳에서
  - 벌거벗은 언덕들에서
  lexicon: HALOT
  rationale: שׁפיים은 나무가 없는 드러난 높은 지대를 가리키므로, ‘빈 들언덕들’로 옮겨 높이와 황량함을 함께 살렸습니다. ‘높은 곳’은 우상숭배의 기술적 용어로만 들릴 수 있어 본문 의미를 덜 직접적으로 드러냅니다.
- source_word: הֶעֱוּוּ אֶת דַּרְכָּם
  english_pob_choice: have made their way crooked
  chosen_korean: 자기 길을 굽게 만들었기
  alternatives_korean:
  - 자기 길을 비뚤게 했기
  - 자기 길을 굽혔기
  lexicon: HALOT
  rationale: עוה의 사역형은 ‘굽게 만들다/비틀다’의 구체적 이미지를 갖기 때문에, 추상적인 ‘그릇되다’보다 동작성이 살아 있는 표현을 택했습니다. ‘길’은 דרך의 비유적 삶의 행로를 보존합니다.
- source_word: יְהֹוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본 프로젝트의 기본값에 따라 신명기적 언약명을 ‘야훼’로 옮겼습니다. 이는 본문의 예언적 비탄이 단순한 일반 신 개념이 아니라 언약 하나님을 잊은 죄를 가리킨다는 점을 드러냅니다.
theological_decisions:
- issue: 히브리어 복수 남성형 בְּנֵי יִשְׂרָאֵל의 처리
  chosen_reading: ‘이스라엘 자손’으로 직역하되, 한국어에서는 집합적 복수로 자연스럽게 읽히게 했습니다.
  alternative_readings:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  rationale: 원문은 문법적으로 남성 복수이며, 이에 따라 ‘자손’을 유지했습니다. 다만 한국어 문맥에서는 집합명사처럼 읽혀도 의미가 유지되므로 과도한 중성화나 설명적 확대는 피했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
- issue: 하나님의 이름 יְהֹוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 직접 Tetragrammaton을 사용하므로, 본문에서 언약명을 보존하는 번역을 택했습니다. 이는 ‘잊었습니다’라는 고발이 단지 종교적 기억 상실이 아니라 언약 상대를 망각한 행위임을 강조합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
