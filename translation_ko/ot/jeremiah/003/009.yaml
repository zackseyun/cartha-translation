id: JER.3.9
reference: Jeremiah 3:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָה֙ מִ/קֹּ֣ל זְנוּתָ֔/הּ וַ/תֶּחֱנַ֖ף אֶת הָ/אָ֑רֶץ וַ/תִּנְאַ֥ף אֶת הָ/אֶ֖בֶן וְ/אֶת הָ/עֵֽץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/003/009.yaml
  text: And because of the lightness of her prostitution[b][a], she polluted the land and committed adultery with stone and wood.
  footnotes:
  - marker: a
    text: Or 'because of the noise/report of her prostitution.' The Hebrew idiom is difficult; the sense may be that her prostitution became so notorious—or so trivialized—that it led to the land's defilement.
    reason: lexical_alternative
  - marker: b
    text: '''Stone and wood'' refers to idols made from such materials.'
    reason: cultural_note
translation:
  language: ko
  text: 그녀의 음행이 대수롭지 않게 여겨진 탓에, 그녀는 그 땅을 더럽히고 돌과 나무와 간음했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어렵습니다. ‘그녀의 음행의 소문(또는 악명) 때문에’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌과 나무’는 돌과 나무로 만든 우상을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל זְנוּתָהּ
  english_pob_choice: because of the lightness of her prostitution
  chosen_korean: 그녀의 음행이 가벼워진 탓에
  alternatives_korean:
  - 그녀의 음행의 소리 때문에
  - 그녀의 음행의 소문 때문에
  - 그녀의 음행의 악명이 퍼졌기 때문에
  lexicon: HALOT
  rationale: מִקּוֹל은 문자적으로 ‘소리/소문’이지만, 문맥상 음행이 경시되거나 가벼이 여겨진 결과로 이어지는 뜻을 살려 한국어에서는 ‘가벼워진 탓에’로 자연스럽게 옮겼습니다.
- source_word: וַתֶּחֱנַף
  english_pob_choice: she polluted
  chosen_korean: 이 땅을 더럽혔고
  alternatives_korean:
  - 이 땅을 부정하게 했고
  - 이 땅을 속되게 했고
  - 이 땅을 오염시켰고
  lexicon: HALOT
  rationale: חנף는 여기서 땅을 훼손하고 부정하게 만드는 결과를 가리키므로, 문맥에 맞는 현대적 표현인 ‘더럽혔고’가 가장 직관적입니다.
- source_word: וַתִּנְאַף אֶת הָאֶבֶן וְאֶת הָעֵץ
  english_pob_choice: committed adultery with stone and wood
  chosen_korean: 돌과 나무와 간음하였습니다
  alternatives_korean:
  - 돌과 나무와 간음하였습니다
  - 돌과 나무와 음행하였습니다
  - 돌과 나무로 된 것들과 간음하였습니다
  lexicon: HALOT
  rationale: נאף는 언약적 배신을 포함한 ‘간음’의 표준 동사이므로 그대로 살렸고, ‘돌과 나무’는 우상 숭배의 재료를 가리키는 메토님으로 유지해 본문의 날카로움을 보존했습니다.
theological_decisions:
- issue: 음행/간음의 예언적 은유 보존
  chosen_reading: 주석적으로 완화하지 않고 ‘음행’과 ‘간음’을 본문에서 그대로 유지했습니다.
  alternative_readings:
  - 단순히 ‘불신실함’이나 ‘우상숭배’로만 순화하기
  rationale: 예레미야는 언약 파기를 성적 은유로 강하게 드러내므로, 이를 약화하면 본문의 신학적 충격과 수사적 힘이 줄어듭니다.
  doctrine_reference: 번역 원칙 §§1, 3, 6
- issue: ‘돌과 나무’의 직접 유지
  chosen_reading: 본문에는 ‘우상’이라는 말을 덧붙이지 않고 ‘돌과 나무’를 그대로 두었습니다.
  alternative_readings:
  - 돌과 나무로 된 우상들과
  - 돌과 나무로 만든 신상들과
  rationale: 히브리어는 재료를 제시하고 독자가 우상을 추론하게 하므로, 메토님을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 번역 원칙 §§1, 5
