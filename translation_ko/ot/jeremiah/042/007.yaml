translation:
  language: ko
  text: 십 일이 끝났을 때, 야훼의 말씀이 예레미야에게 임했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘십 일의 끝으로부터/뒤에’이며, 즉 십 일이 완전히 지난 시점이라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: ~했을 때 / 임했습니다로 이어지는 서술
  alternatives_korean:
  - 그리고 그것이 일어났습니다
  - 그 일이 있었습니다
  lexicon: HALOT
  rationale: 히브리어 서사 도입 공식의 시간 전환을 한국어에서는 불필요하게 반복하지 않고 자연스럽게 풀어, 뒤이어 오는 계시 도착 구문이 중심이 되게 했습니다.
- source_word: מִקֵּץ עֲשֶׂרֶת יָמִים
  english_pob_choice: at the end of ten days
  chosen_korean: 십 일이 끝났을 때
  alternatives_korean:
  - 열흘이 지난 뒤
  - 십 일의 끝에
  lexicon: HALOT
  rationale: מִקֵּץ는 단순한 ‘이후’보다 기간이 완결된 시점을 가리키므로, ‘십 일이 끝났을 때’로 번역해 경계 의미를 드러냈습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 여호와의 말씀
  lexicon: HALOT
  rationale: 예언자적 정형구인 ‘말씀’을 유지하고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겨 신적 고유명을 보존했습니다.
- source_word: אֶל יִרְמְיָהוּ
  english_pob_choice: to Jeremiah
  chosen_korean: 예레미야에게
  alternatives_korean:
  - 예레미야에게로
  - 예레미야를 향해
  lexicon: HALOT
  rationale: אֶל의 방향성을 한국어 여격 조사 ‘-에게’로 자연스럽게 표현해, 계시가 예레미야에게 도달한 것을 분명히 했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
