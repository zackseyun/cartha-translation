  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם יִרְמְיָ֤הוּ הַ/נָּבִיא֙ שָׁמַ֔עְתִּי הִנְ/נִ֧י מִתְפַּלֵּ֛ל אֶל יְהוָ֥ה אֱלֹהֵי/כֶ֖ם כְּ/דִבְרֵי/כֶ֑ם וְֽ/הָיָ֡ה כָּֽל הַ/דָּבָר֩ אֲשֶׁר יַעֲנֶ֨ה יְהוָ֤ה אֶתְ/כֶם֙ אַגִּ֣יד לָ/כֶ֔ם לֹֽא אֶמְנַ֥ע מִ/כֶּ֖ם דָּבָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/004.yaml
  text: Then Jeremiah the prophet said to them[a], “I have heard. Behold, I am praying to Yahweh your God according to your words, and whatever Yahweh answers you, I will tell you[b]. I will not withhold a word from you.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''according to your words''; that is, in keeping with what you have asked.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''I will withhold nothing from you.'' Hebrew: ''I will not withhold a word from you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예레미야 선지자가 그들에게 말했습니다. “내가 들었습니다. 보십시오, 나는 여러분의 말대로[a] 여러분의 하나님 야훼께 기도하고 있습니다. 야훼께서 여러분에게 무엇이라고 응답하시든지, 내가 여러분에게 말하겠습니다. 여러분에게서 한마디도 숨기지 않겠습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘여러분의 말에 따라’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘여러분에게서 한 말을 숨기지 않겠습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְמְיָהוּ הַנָּבִיא
  english_pob_choice: Jeremiah the prophet
  chosen_korean: 예레미야 선지자
  alternatives_korean:
  - 예레미야 예언자
  - 예레미야, 그 선지자
  lexicon: HALOT
  rationale: 고유명사와 직함을 자연스러운 현대 한국어로 옮기되, המקרא의 서술 기능을 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold / Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 있습니다
  lexicon: HALOT
  rationale: 화자의 즉각적 응답을 드러내는 담화 표지로 이해하여, 현대 합쇼체에서 자연스러운 주의 환기 표현을 사용했습니다.
- source_word: כְּדִבְרֵיכֶם
  english_pob_choice: according to your words
  chosen_korean: 여러분의 말대로
  alternatives_korean:
  - 여러분의 말에 따라
  - 여러분의 요청대로
  lexicon: HALOT
  rationale: 직역의 ‘말들’보다, 사람들이 방금 요청한 내용에 맞춘다는 뜻을 한국어로 더 자연스럽게 드러냈습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 여호와 여러분의 하나님
  - 주 여러분의 하나님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명(神名)을 그대로 드러내기 위해 ‘야훼’를 유지했고, 2인칭 복수 소유격은 ‘여러분의’로 옮겼습니다.
- source_word: לֹא אֶמְנַע מִכֶּם דָּבָר
  english_pob_choice: I will not withhold a word from you
  chosen_korean: 여러분에게서 한 말씀도 숨기지 않겠습니다
  alternatives_korean:
  - 여러분에게서 한마디도 감추지 않겠습니다
  - 여러분에게서 아무 말도 아끼지 않겠습니다
  lexicon: HALOT
  rationale: ‘withhold’의 의미를 자연스럽게 살리면서, ‘דָבָר’를 단순히 ‘말’이 아니라 계시된 응답의 전달로 이해하게 하는 ‘한 말씀’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 절은 여호와의 이름을 직접 사용하므로, 본문이 지닌 언약적 고유성을 유지하기 위해 일반 대체어보다 음역형을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘여러분의 하나님’의 복수성
  chosen_reading: 복수 مخاطَب을 반영해 ‘여러분의 하나님’으로 옮겼습니다.
  alternative_readings:
  - 네 하나님
  - 당신들의 하나님
  rationale: 예레미야가 공동체 전체에게 말하는 맥락이므로, 한국어 인칭 대명사도 집단성을 분명히 드러내야 합니다.
  doctrine_reference: Hebrew second-person plural suffix
