  text: וְ/עַתָּ֕ה לָ/כֵ֛ן שִׁמְע֥וּ דְבַר יְהוָ֖ה שְׁאֵרִ֣ית יְהוּדָ֑ה כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם אַ֠תֶּם שׂ֣וֹם תְּשִׂמ֤וּ/ן פְּנֵי/כֶם֙ לָ/בֹ֣א מִצְרַ֔יִם וּ/בָאתֶ֖ם לָ/ג֥וּר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/015.yaml
  text: 'Now therefore hear the word of Yahweh[a], O remnant of Judah. Thus says Yahweh of hosts, the God of Israel: If you are determined to go to Egypt and to go to sojourn there,'
  footnotes:
  - marker: a
    text: 'Hebrew: ''if you indeed set your faces to go to Egypt''—an idiom expressing firm resolve.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 야훼의 말씀을 들으십시오. 유다의 남은 자들아. 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “너희가 정말로 마음을 정하여 이집트로 가서 거기에서 거주하려 한다면,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어: “이집트로 가겠다고 얼굴을 굳게 정하면” — 결연한 의지를 나타내는 관용구입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לָכֵן
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 그러니 이제
  lexicon: HALOT
  rationale: 예언적 권면의 결론을 여는 접속사 둘이 함께 쓰여 논리적 귀결과 시간 전환을 모두 드러내므로, 한국어에서도 ‘그러므로 이제’로 두 힘을 함께 살렸습니다.
- source_word: שִׁמְעוּ דְבַר יְהוָה
  english_pob_choice: hear the word of Yahweh
  chosen_korean: 야훼의 말씀을 들으십시오
  alternatives_korean:
  - 야훼의 말을 들으십시오
  - 야훼의 말씀에 귀를 기울이십시오
  lexicon: HALOT
  rationale: 예언서의 공식적 소명 표현이라 ‘듣다’보다 더 강한 언약적 청종을 드러내는 ‘들으십시오’를 택했고, דְבַר יְהוָה는 단순한 ‘말’이 아니라 예언적 ‘말씀’으로 옮겼습니다.
- source_word: שְׁאֵרִית יְהוּדָה
  english_pob_choice: O remnant of Judah
  chosen_korean: 유다의 남은 자들아
  alternatives_korean:
  - 유다의 남은 무리여
  - 유다의 남은 자들
  lexicon: HALOT
  rationale: שְׁאֵרִית는 ‘남은 자/남은 무리’의 언약적 용법을 살려 ‘남은 자들’로 옮기고, 호격은 한국어 자연성을 위해 종결 보조 없이 드러냈습니다.
- source_word: אִם אַתֶּם שׂוֹם תְּשִׂמ֤וּן פְּנֵי/כֶם֙
  english_pob_choice: If you are determined
  chosen_korean: 너희가 정말로 마음을 정하여
  alternatives_korean:
  - 너희가 얼굴을 굳게 하여
  - 너희가 결심하고
  lexicon: HALOT
  rationale: ‘얼굴을 세우다/향하다’의 관용구를 직역하면 한국어에서 어색하므로, 결연한 의지의 핵심을 살리는 ‘마음을 정하여’로 옮기되, 중첩 강조를 ‘정말로’로 반영했습니다.
- source_word: לָגּוּר שָׁם
  english_pob_choice: to sojourn there
  chosen_korean: 거기에서 거주하려 한다면
  alternatives_korean:
  - 거기에서 나그네로 살려 한다면
  - 거기에서 머물려 한다면
  lexicon: HALOT
  rationale: גּוּר는 일시적 거주/이방인 체류를 뜻하지만, 한국어에서는 ‘거주하다’가 가장 직접적이면서도 지나치게 일상화되지 않아 문맥상 안정적으로 전달합니다.
theological_decisions:
- issue: 예언자적 전령 공식에서의 직접 화법과 존칭
  chosen_reading: 공적 청중에게는 합쇼체를 유지하고, 하나님의 직접 말씀은 인용부호 안에서 선포 형식으로 처리했습니다.
  alternative_readings:
  - 전체를 평서형으로 통일
  - 인용부호 없이 서술형으로 흡수
  rationale: 예언자의 전달문은 청중을 향한 공적 소명과 하나님의 직접 발화가 겹치므로, 현대 한국어에서는 존중의 명령형과 인용문을 통해 그 긴장을 보존하는 것이 가장 적절합니다.
  doctrine_reference: 'POB Korean style policy: formal-polite register; quoted divine speech may shift register'
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원어의 고유 신명을 보존하는 POB 방침에 따라 ‘야훼’로 옮겨, 호칭적 대체어보다 언약적 고유명을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
