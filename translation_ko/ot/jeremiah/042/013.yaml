id: JER.42.13
reference: Jeremiah 42:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם אֹמְרִ֣ים אַתֶּ֔ם לֹ֥א נֵשֵׁ֖ב בָּ/אָ֣רֶץ הַ/זֹּ֑את לְ/בִלְתִּ֣י שְׁמֹ֔עַ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/013.yaml
  text: But if you say[a], ‘We will not stay in this land,’ not obeying the voice of Yahweh your God—
  footnotes:
  - marker: a
    text: Or 'listen to the voice of the LORD your God.' The Hebrew idiom 'hear/listen to the voice' often means responsive obedience.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 여러분이 「우리는 이 땅에 머물지 않겠습니다」라고 말하며, 야훼 여러분의 하나님께 순종하지 않으려고 한다면—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼 여러분의 하나님께 순종하는 소리를 듣지 않으려고 한다면’이라고도 옮길 수 있습니다. 히브리어 관용구 ‘목소리를 듣다’는 흔히 응답적 순종을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그런데 … 라면
  alternatives_korean:
  - 그리고 만일 … 라면
  - 만일 … 라면
  lexicon: HALOT
  rationale: 앞선 문맥과 대비되는 조건을 자연스럽게 살려, 단순 조건문보다 전환·대조의 뉘앙스가 있는 ‘그런데 … 라면’으로 옮겼습니다.
- source_word: אֹמְרִים אַתֶּם
  english_pob_choice: you say
  chosen_korean: 여러분이 … 라고 말하며
  alternatives_korean:
  - 여러분이 … 라고 말하면
  - 너희가 … 라고 말하면
  lexicon: HALOT
  rationale: 복수 청중에게 직접 말하는 예언적 خطاب을 표준어 합쇼체로 살리되, 조건부 발화 동사를 자연스럽게 표현했습니다.
- source_word: לֹא נֵשֵׁב בָּאָרֶץ הַזֹּאת
  english_pob_choice: We will not stay in this land
  chosen_korean: 우리는 이 땅에 머물지 않겠습니다
  alternatives_korean:
  - 우리는 이 땅에 살지 않겠습니다
  - 우리는 이 땅에 거하지 않겠습니다
  lexicon: HALOT
  rationale: יָשַׁב의 ‘정착/거주’ 의미를 살리면서도 현대 한국어에서 자연스러운 ‘머물다’를 택해, 단순한 임시 체류가 아니라 이 땅에 남지 않겠다는 결정을 드러냈습니다.
- source_word: לְבִלְתִּי שְׁמֹעַ בְּקוֹל
  english_pob_choice: not obeying the voice of
  chosen_korean: … 에 순종하지 않으려고 한다면
  alternatives_korean:
  - …의 목소리를 듣지 않으려고 한다면
  - …의 말씀에 귀 기울이지 않으려고 한다면
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘목소리를 듣다’는 여기서 반응적 순종을 뜻하므로, 이를 한국어의 직접적 대응인 ‘순종하다’로 풀어 의미를 분명히 했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 여러분의 하나님
  alternatives_korean:
  - 야훼 너희의 하나님
  - 야훼, 여러분의 하나님
  lexicon: HALOT
  rationale: 본문의 신명칭 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 언약적 호칭인 ‘여러분의 하나님’을 유지해 청중과의 관계를 드러냈습니다.
theological_decisions:
- issue: ‘듣다’ 관용구의 신학적 의미
  chosen_reading: 순종하지 않으려고 한다면
  alternative_readings:
  - 듣지 않으려고 한다면
  - 말씀을 듣지 않으려고 한다면
  rationale: 예언서의 ‘야훼의 목소리를 듣다’는 단순 청취가 아니라 응답적 순종을 뜻하므로, 의미를 약화시키지 않도록 ‘순종’으로 번역했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 신명칭 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 문서화된 프로젝트 원칙에 따라 Tetragrammaton을 고유명사로 드러내어 언약적 자기계시를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
