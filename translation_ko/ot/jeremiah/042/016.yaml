  rationale: 예언적 심판 문맥에서 חֶרֶב은 실제 무기이면서도 전쟁과 죽음의 메타포를 담지만, 한국어에서는 현대적이고 직접적인 ‘칼’이 가장 자연스럽게 그 이미지를 전달합니다.
- source_word: תַּשִּׂיג אֶתְכֶם
  english_pob_choice: will overtake you
  chosen_korean: 너희를 따라잡을 것이고
  alternatives_korean:
  - 너희를 덮칠 것이고
  - 너희에게 이르게 될 것이고
  lexicon: HALOT
  rationale: הִשִּׂיג는 추격하여 따라잡는 뜻이므로, 단순 도달보다 위협적이고 인격적인 추적감을 살린 ‘따라잡다’가 적절합니다.
- source_word: דֹּאֲגִים מִמֶּנּוּ
  english_pob_choice: you dread
  chosen_korean: 염려하는
  alternatives_korean:
  - 두려워하는
  - 걱정하는
  lexicon: HALOT
  rationale: דאג는 ‘염려하다/걱정하다’의 뜻이 핵심이어서, 영어 POB의 ‘you dread’와 같은 강도의 불안감을 현대 한국어로 무리 없이 옮겼습니다.
- source_word: יִדְבַּק אַחֲרֵיכֶם
  english_pob_choice: will follow close after you
  chosen_korean: 뒤를 바짝 따라붙을 것이며
  alternatives_korean:
  - 뒤에 달라붙을 것이며
  - 바짝 뒤따를 것이며
  lexicon: HALOT
  rationale: דבק는 ‘붙다/달라붙다’의 물리적 이미지를 지니므로, ‘바짝 따라붙다’로 옮겨 relentless pursuit의 압박을 살렸습니다.
