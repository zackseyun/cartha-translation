id: JER.42.16
reference: Jeremiah 42:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
  footnotes:
  - marker: a
    text: Or 'you are anxious about' for 'you dread' (Hebrew דֹּאֲגִים).
    reason: lexical_alternative
  - marker: b
    text: Literally 'will cling behind you,' an image of relentless pursuit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 너희가 두려워하는 칼이 이집트 땅에서 너희를 따라잡을 것이고, 너희가 염려하는 기근이 거기서 너희 뒤를 바짝 따라붙을 것이며, 너희는 거기서 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘따라잡다/덮치다’의 의미를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘뒤에 달라붙다’라는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 전쟁
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 חֶרֶב은 실제 무기이면서도 전쟁과 죽음의 메타포를 담지만, 한국어에서는 현대적이고 직접적인 ‘칼’이 가장 자연스럽게 그 이미지를 전달합니다.
- source_word: תַּשִּׂיג אֶתְכֶם
  english_pob_choice: will overtake you
  chosen_korean: 너희를 따라잡을 것이고
  alternatives_korean:
  - 너희를 덮칠 것이고
  - 너희에게 이르게 될 것이고
  lexicon: HALOT
  rationale: הִשִּׂיג는 추격하여 따라잡는 뜻이므로, 단순 도달보다 위협적이고 인격적인 추적감을 살린 ‘따라잡다’가 적절합니다.
- source_word: דֹּאֲגִים מִמֶּנּוּ
  english_pob_choice: you dread
  chosen_korean: 염려하는
  alternatives_korean:
  - 두려워하는
  - 걱정하는
  lexicon: HALOT
  rationale: דאג는 ‘염려하다/걱정하다’의 뜻이 핵심이어서, 영어 POB의 ‘you dread’와 같은 강도의 불안감을 현대 한국어로 무리 없이 옮겼습니다.
- source_word: יִדְבַּק אַחֲרֵיכֶם
  english_pob_choice: will follow close after you
  chosen_korean: 뒤를 바짝 따라붙을 것이며
  alternatives_korean:
  - 뒤에 달라붙을 것이며
  - 바짝 뒤따를 것이며
  lexicon: HALOT
  rationale: דבק는 ‘붙다/달라붙다’의 물리적 이미지를 지니므로, ‘바짝 따라붙다’로 옮겨 relentless pursuit의 압박을 살렸습니다.
theological_decisions:
- issue: 심판 표현의 구체성
  chosen_reading: ‘칼’과 ‘기근’을 추상화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 전쟁과 굶주림
  - 폭력과 식량 부족
  rationale: 본문은 언약적 심판의 전형적 이미지들을 구체적으로 제시하므로, 해석적으로 풀어 쓰기보다 원문의 긴장과 경고를 그대로 보존하는 편이 더 충실합니다.
  doctrine_reference: Original-language primacy; preserve prophetic judgment imagery without domestication.
