  text: וְ/הָיְתָ֣ה הַ/חֶ֗רֶב אֲשֶׁ֤ר אַתֶּם֙ יְרֵאִ֣ים מִמֶּ֔/נָּה שָׁ֛ם תַּשִּׂ֥יג אֶתְ/כֶ֖ם בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/הָ/רָעָ֞ב אֲשֶׁר אַתֶּ֣ם דֹּאֲגִ֣ים מִמֶּ֗/נּוּ שָׁ֣ם יִדְבַּ֧ק אַחֲרֵי/כֶ֛ם מִצְרַ֖יִם וְ/שָׁ֥ם תָּמֻֽתוּ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/016.yaml
  text: Then the sword that you fear will overtake you there in the land of Egypt[a], and the famine that you dread will follow close after you there in Egypt[b], and there you will die.
  footnotes:
  - marker: a
    text: Or 'you are anxious about' for 'you dread' (Hebrew דֹּאֲגִים).
    reason: lexical_alternative
  - marker: b
    text: Literally 'will cling behind you,' an image of relentless pursuit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희가 두려워하는 칼이 그곳 이집트 땅에서 너희를 따라잡을 것입니다[a]. 너희가 염려하는 기근이 이집트에서 너희 뒤에 바짝 달라붙을 것이고[b], 너희는 거기서 죽을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘따라잡다’ 또는 ‘덮치다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘너희 뒤에 달라붙을 것이다’라는 이미지를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֶרֶב
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 전쟁
