id: JER.42.2
reference: Jeremiah 42:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אֶֽל יִרְמְיָ֣הוּ הַ/נָּבִ֗יא תִּפָּל נָ֤א תְחִנָּתֵ֨/נוּ֙ לְ/פָנֶ֔י/ךָ וְ/הִתְפַּלֵּ֤ל בַּעֲדֵ֨/נוּ֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּעַ֖ד כָּל הַ/שְּׁאֵרִ֣ית הַ/זֹּ֑את כִּֽי נִשְׁאַ֤רְנוּ מְעַט֙ מֵֽ/הַרְבֵּ֔ה כַּ/אֲשֶׁ֥ר עֵינֶ֖י/ךָ רֹא֥וֹת אֹתָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/002.yaml
  text: And they said to Jeremiah the prophet[a], “Please let our plea come before you, and pray for us to Yahweh your God, for all this remnant, for we are left as few out of many[b], as your eyes see us.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''let our plea fall before you,'' an idiom for presenting an earnest petition.'
    reason: lexical_alternative
  - marker: b
    text: Or 'for this whole remnant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예언자 예레미야에게 말했습니다. “부디 우리의 간구가 당신 앞에 이르기를 바라오니[a], 이 모든 남은 무리[b], 곧 우리를 위하여 야훼 당신의 하나님께 기도해 주십시오. 우리는 많은 이들 가운데서 적은 수만 남았습니다. 당신께서 보시는 그대로입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하면 ‘우리의 간구가 당신 앞에 떨어지게 하소서’입니다. 간절한 청원을 드린다는 뜻의 관용 표현입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘이 남은 무리 전체’를 위하여.
    reason: alternative_reading
lexical_decisions:
- source_word: תִּפָּל / תְּחִנָּתֵנוּ לְפָנֶיךָ
  english_pob_choice: let our plea come before you
  chosen_korean: 우리의 간구가 당신 앞에 이르게 하시고
  alternatives_korean:
  - 우리의 청이 당신 앞에 떨어지게 하시고
  - 우리의 간구를 당신 앞에 드리게 하시고
  lexicon: HALOT
  rationale: 히브리어는 ‘간구가 당신 앞에 이르다/떨어지다’라는 관용구이므로, 한국어에서는 자연스럽게 ‘당신 앞에 이르게 하시고’로 옮기되 요청의 긴박함은 ‘간구’로 살렸습니다.
- source_word: וְהִתְפַּלֵּל בַּעֲדֵנוּ
  english_pob_choice: and pray for us
  chosen_korean: 우리를 위해 … 기도해 주십시오
  alternatives_korean:
  - 우리를 위하여 간구해 주십시오
  - 우리를 대신하여 기도해 주십시오
  lexicon: HALOT
  rationale: hitpael פלל의 기본 뜻을 따라 ‘기도하다’로 옮기되, 청원문 맥락을 반영해 ‘~해 주십시오’로 공손한 요청을 유지했습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 너의 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 기준에 따라 ‘야훼’로 옮겼고, ירמיהו를 향한 직접 청원이라 ‘당신의 하나님’이 가장 자연스럽습니다.
- source_word: הַשְּׁאֵרִית הַזֹּאת
  english_pob_choice: this remnant
  chosen_korean: 이 남은 모든 무리
  alternatives_korean:
  - 이 남은 자들
  - 이 남은 사람들
  lexicon: HALOT
  rationale: ‘שְׁאֵרִית’의 언약사적 용어성을 살리면서도 한국어에서는 ‘남은 자’보다 문맥상 더 자연스러운 ‘남은 무리’로 처리했습니다. ‘모든’은 전체 잔존 집단을 가리키는 כוח를 반영합니다.
- source_word: נִשְׁאַ֤רְנוּ מְעַט֙ מֵֽהַרְבֵּ֔ה
  english_pob_choice: we are left as few out of many
  chosen_korean: 우리는 많은 사람 가운데서 적은 수만 남았으니
  alternatives_korean:
  - 우리는 많던 가운데 적게 남았으니
  - 우리는 많은 것 중에 소수만 남았으니
  lexicon: HALOT
  rationale: 히브리어의 대비 구조를 한국어로 분명히 드러내기 위해 ‘많은 사람 가운데서 적은 수만 남았다’로 옮겼습니다.
- source_word: כַּאֲשֶׁר עֵינֶיךָ רֹאוֹת אֹתָנוּ
  english_pob_choice: as your eyes see us
  chosen_korean: 당신의 눈이 우리를 보고 계신 그대로입니다
  alternatives_korean:
  - 당신의 눈이 우리를 보고 있는 대로입니다
  - 당신의 눈으로 우리를 보시는 그대로입니다
  lexicon: HALOT
  rationale: 히브리어의 직접적 관찰 표현을 유지하되, 한국어에서는 ‘보고 계신 그대로’로 자연스럽게 다듬어 간청의 호소력을 살렸습니다.
theological_decisions:
- issue: YHWH divine-name rendering
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: POB의 원칙에 따라 신적 고유명은 대체 호칭이 아니라 음역으로 보존해, 언약 이름의 식별성을 유지했습니다.
  doctrine_reference: 'POB terminology: יְהוָה / YHWH → 야훼'
- issue: remnant vocabulary
  chosen_reading: ‘שְׁאֵרִית’을 ‘남은 무리’로 옮겨 예언서의 잔존 공동체 어휘를 유지했습니다.
  alternative_readings:
  - 남은 자들
  - 생존자들
  rationale: ‘생존자들’은 생존 사실을 강조하지만, 예레미야의 반복되는 신학적 어휘인 ‘remnant’를 살리기 위해 ‘남은 무리’를 택했습니다.
  doctrine_reference: POB consistency of key prophetic terms
