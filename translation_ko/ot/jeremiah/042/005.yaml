source:
  edition: WLC
  text: וְ/הֵ֨מָּה֙ אָמְר֣וּ אֶֽל יִרְמְיָ֔הוּ יְהִ֤י יְהוָה֙ בָּ֔/נוּ לְ/עֵ֖ד אֱמֶ֣ת וְ/נֶאֱמָ֑ן אִם לֹ֡א כְּֽ/כָל הַ֠/דָּבָר אֲשֶׁ֨ר יִֽשְׁלָחֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֵלֵ֖י/נוּ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/005.yaml
  text: And they said to Jeremiah[b][a], “May Yahweh be a true and faithful witness against us if we do not act according to all the word that Yahweh your God sends to us through you.”
  footnotes:
  - marker: a
    text: Or 'May the LORD be among us a true and faithful witness.' The Hebrew phrase can be taken more literally as 'in/among us,' but in this oath context it likely carries the sense of witness against the speakers if they fail to obey.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'that the LORD your God sends you to us.' The English 'sends to us through you' makes explicit the implied message-bearing sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예레미야에게 말했습니다. “야훼께서 우리 가운데 참되고 신실한 증인이 되십시오. 우리가 당신에게로 우리에게 보내시는 야훼 당신의 말씀대로 다 행하지 않는다면 말입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 가운데/우리 안에’에 가깝지만, 맹세 문맥에서는 약속을 어길 경우 그들에 대하여 증인이 되신다는 뜻이 더 강합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘야훼 당신의 하나님께서 당신을 우리에게 보내시는’입니다. 한국어에서는 선지자를 통한 전달 행위를 분명히 했습니다.
    reason: source_note
lexical_decisions:
- source_word: יְהִי יְהוָה
  english_pob_choice: May Yahweh be
  chosen_korean: 야훼께서 … 되십시오
  alternatives_korean:
  - 야훼께서 … 되시기 바랍니다
  - 야훼께서 … 되게 하십시오
  lexicon: HALOT
  rationale: 히브리어 희망/선언형 יְהִי를 한국어 오어체로 살려 맹세문의 간구적 성격을 보존했습니다.
- source_word: בָּנוּ לְעֵד
  english_pob_choice: a true and faithful witness against us
  chosen_korean: 우리 가운데 참되고 신실한 증인
  alternatives_korean:
  - 우리에게 불리한 참되고 신실한 증인
  - 우리 가운데 증인이 되시는 분
  lexicon: HALOT
  rationale: 부정적인 법정적 힘이 있지만, 본문 자체는 ‘증인’ 표현을 먼저 세우므로 이를 살리고, ‘against us’의 뉘앙스는 문맥 전체에서 전달되도록 했습니다.
- source_word: אֱמֶת וְנֶאֱמָן
  english_pob_choice: true and faithful
  chosen_korean: 참되고 신실한
  alternatives_korean:
  - 진실하고 신실한
  - 참되며 믿을 만한
  lexicon: HALOT
  rationale: 두 형용사의 병렬을 자연스러운 한국어로 유지했습니다.
- source_word: כְּכָל הַדָּבָר
  english_pob_choice: according to all the word
  chosen_korean: … 말씀대로 다 행하지 않는다면
  alternatives_korean:
  - … 모든 말씀대로 하지 않는다면
  - … 그 말씀 전체대로 하지 않는다면
  lexicon: HALOT
  rationale: דָּבָר를 여기서는 야훼의 전달된 ‘말씀’으로 이해해 한국어에서 가장 자연스러운 법적·예언적 표현으로 옮겼습니다.
- source_word: יִשְׁלָחֲךָ יְהוָה אֱלֹהֶיךָ אֵלֵינוּ
  english_pob_choice: that Yahweh your God sends to us through you
  chosen_korean: 당신에게로 우리에게 보내시는 야훼 당신의 말씀
  alternatives_korean:
  - 당신을 통해 우리에게 보내시는 야훼 당신의 말씀
  - 야훼 당신의 하나님께서 당신을 통해 우리에게 보내시는 말씀
  lexicon: HALOT
  rationale: 히브리어의 ‘너를 우리에게 보내다’라는 축약된 표현을 한국어에서는 전달 행위가 분명해지도록 풀어, 예언자의 중개성을 드러냈습니다.
