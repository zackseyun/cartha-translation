  to: 그러므로 이제 너희는 분명히 알아 두십시오. 너희가 가서 그곳에 거류하려고 원했던 바로 그곳에서 칼과 기근과 전염병으로 죽을 것입니다.[a]
  rationale: 결론적 전환을 자연스러운 “그러므로 이제”로 옮기고, 강조된 앎의 요구는 “분명히 알아 두십시오”로 표현했습니다. 원문의 핵심 경고인 ‘그들이 거류하려고 원한 바로 그곳에서 칼과 기근과 전염병으로 죽는다’를 직접적으로 복원했습니다. 각 재앙의 삼중구와 דבר의 어휘적 대안은 유지했습니다.
