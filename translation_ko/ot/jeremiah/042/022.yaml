source:
  edition: WLC
  text: וְ/עַתָּה֙ יָדֹ֣עַ תֵּֽדְע֔וּ כִּ֗י בַּ/חֶ֛רֶב בָּ/רָעָ֥ב וּ/בַ/דֶּ֖בֶר תָּמ֑וּתוּ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר חֲפַצְתֶּ֔ם לָ/ב֖וֹא לָ/ג֥וּר שָֽׁם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/022.yaml
  text: Now therefore[a], know for certain that you will die by the sword, by famine, and by pestilence in the place where you desired to go to sojourn there.
  footnotes:
  - marker: a
    text: Or 'and by plague.' The Hebrew term can denote epidemic disease more generally.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 그러므로 너희는 확실히 알게 될 것입니다. 칼과 기근과 전염병으로 죽을 것이며, 너희가 가서 거기에 거류하기를 원했던 그곳에서 그렇게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘역병으로’. 히브리어는 전염병성 질환 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now therefore
  chosen_korean: 이제 그러므로
  alternatives_korean:
  - 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 전후 문맥의 경고를 잇는 결론적 전환을 살리기 위해 ‘그러므로’를 넣되, 원문의 시간 부사도 함께 보존했습니다.
- source_word: יָדֹעַ תֵּדְעוּ
  english_pob_choice: know for certain
  chosen_korean: 확실히 알게 될 것입니다
  alternatives_korean:
  - 반드시 알게 될 것입니다
  - 분명히 알게 될 것입니다
  lexicon: HALOT
  rationale: 부정형 절대사 + 미완료형의 강한 강조를 한국어의 ‘확실히’로 자연스럽게 옮겼습니다.
- source_word: וּבַדֶּבֶר
  english_pob_choice: and by pestilence
  chosen_korean: 그리고 전염병으로
  alternatives_korean:
  - 그리고 역병으로
  - 그리고 재앙성 질병으로
  lexicon: HALOT
  rationale: 예언적 심판 공식에서 דבר는 단순한 일반병보다 집단적 재난성 질병을 가리키므로, 현대 한국어에서 뜻이 분명한 ‘전염병’으로 옮겼습니다.
- source_word: לָגוּר
  english_pob_choice: to sojourn
  chosen_korean: 거류하기를
  alternatives_korean:
  - 머물기를
  - 잠시 살기를
  lexicon: HALOT
  rationale: גור의 외국인/임시 거주 뉘앙스를 살리기 위해 ‘거류하다’를 사용해, 단순 체류보다 더 정확한 의미를 유지했습니다.
theological_decisions:
- issue: 재앙 삼중구(칼/기근/전염병)의 예언적 심판 공식 보존
  chosen_reading: 칼과 기근과 전염병으로 죽을 것입니다
  alternative_readings:
  - 칼과 기근과 역병으로 죽을 것입니다
  - 칼, 기근, 그리고 전염병으로 죽을 것입니다
  rationale: 예레미야에 반복되는 언약 심판 공식을 그대로 드러내어, 개별 재앙의 나열이 아니라 하나의 경고 패턴임을 유지했습니다.
  doctrine_reference: 예언서의 언약적 심판 선포
