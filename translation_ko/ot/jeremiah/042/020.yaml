revisions:
- from: “여러분은 자기 생명을 걸고 스스로를 속였습니다[a]. 여러분이 나를 보내어 ‘우리 하나님 야훼께 가서 우리를 위하여 기도해 주십시오. 그리고 우리 하나님 야훼께서 말씀하시는 것은 무엇이든 우리에게 알려 주십시오. 그러면 우리가 그대로 행하겠습니다’라고 하였기 때문입니다.”
  to: “여러분은 스스로를 속였습니다[a]. 여러분이 나를 여러분의 하나님 야훼께 보내며 ‘우리 하나님 야훼께 우리를 위하여 기도해 주십시오. 우리 하나님 야훼께서 말씀하시는 모든 것을 우리에게 알려 주십시오. 그러면 우리가 그대로 행하겠습니다’라고 하였기 때문입니다.”
  rationale: 첫 번째 ‘하나님’의 소유 표현을 원문대로 ‘여러분의 하나님’으로 바로잡았습니다. 난해한 התעיתם בְּנַפְשׁוֹתֵיכֶם은 영어 POB의 주된 선택 및 문맥에 따라 ‘스스로를 속했습니다’로 번역하고, 생명에 대한 위해라는 가능한 대안은 중립적으로 각주에 남겼습니다. 인용문의 정중한 요청·약속 형식과 야훼 표기는 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:27:39Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 번째 신명구가 원문의 ‘너희의 하나님’(אֱלֹהֵיכֶם)이 아니라 ‘우리 하나님’으로 바뀌어 있습니다. 또한 ‘자기 생명을 걸고’는 בְּנַפְשׁוֹתֵיכֶם의 가능한 생명-위험의 함의를 지나치게 특정한 방식으로 풀어, 본문의 주된 자기기만 표현과 자연스럽게 결합되지 않습니다. 본문은 ‘스스로를 속였습니다’로 옮기고, 생명에 관련된 대안은 각주에 보존하는 것이 안전합니다.
  naturalness: ‘스스로를 속했습니다’는 현대 표준 한국어에서 자연스럽고, 예레미야의 책망이라는 문맥에도 맞습니다. 인용문 안의 ‘기도해 주십시오’와 ‘행하겠습니다’는 요청과 약속에 알맞은 합쇼체입니다. ‘말씀하시는 것은 무엇이든’보다 ‘말씀하시는 모든 것을’이 원문의 포괄성을 더 매끄럽게 드러냅니다.
  terminology: יהוה는 지침에 따라 ‘야훼’로 유지했습니다. ‘여러분의 하나님 야훼’와 ‘우리 하나님 야훼’의 서로 다른 인칭 소유 접미사를 구별했습니다. ‘기도하다’와 ‘행하다’도 원문의 의미 범위 및 정중한 인용체에 적절합니다.
  issues:
  - severity: high
    issue: 첫 번째 ‘야훼’ 구문에서 소유자가 바뀜
    rationale: 원문은 ‘여러분의 하나님 야훼께’(יְהוָה אֱלֹהֵיכֶם)인데, 초안은 ‘우리 하나님 야훼께’로 옮겼습니다. 뒤의 인용된 요청 안에서는 ‘우리 하나님’(אֱלֹהֵינוּ)이 맞지만, 예레미야가 그 요청을 도입하며 말하는 첫 구문에서는 ‘여러분의 하나님’이어야 합니다.
  - severity: medium
    issue: ‘자기 생명을 걸고’가 난해한 히브리어 관용구를 과도하게 특정함
    rationale: בְּנַפְשׁוֹתֵיכֶם은 ‘자신/생명’을 포함하는 어려운 표현이며, ‘목숨을 걸고’라는 자발적 위험 감수의 뜻이 본문에 명시되어 있지는 않습니다. 주본문은 자기기만을 따르고, 생명에 해가 되는 결과라는 가능한 이해는 각주로 남기는 편이 충실합니다.
  - severity: low
    issue: 각주의 ‘자기 목숨을 걸고 길을 잘못 들었습니다’도 ‘목숨을 걸고’라는 해석을 반복함
    rationale: 대안 번역은 생명에 관한 함의를 보존하되, 원문에 없는 자발적 결단의 뉘앙스를 피해야 합니다.
