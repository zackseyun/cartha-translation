  yaml_path: translation/ot/jeremiah/042/020.yaml
  text: For you have deceived yourselves[a], because you sent me to Yahweh your God, saying, ‘Pray for us to Yahweh our God, and whatever Yahweh our God says, tell us, and we will do it.’
  footnotes:
  - marker: a
    text: Or, 'you have gone astray at the cost of your lives,' highlighting the self-destructive force of the Hebrew expression.
    reason: lexical_alternative
translation:
  language: ko
  text: “여러분은 스스로를 속였습니다[a]. 여러분이 나를 여러분의 하나님 야훼께 보내며 ‘우리 하나님 야훼께 우리를 위하여 기도해 주십시오. 우리 하나님 야훼께서 말씀하시는 모든 것을 우리에게 알려 주십시오. 그러면 우리가 그대로 행하겠습니다’라고 하였기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분 자신의 생명에 해가 되게 길을 잘못 들었습니다.’ 히브리어 표현은 자기기만뿐 아니라 생명을 해치는 결과를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: התעיתם בְּנַפְשׁוֹתֵיכֶם
  english_pob_choice: you deceived yourselves
  chosen_korean: 자기 생명을 걸고 스스로를 속였습니다
  alternatives_korean:
  - 스스로 길을 잘못 들었습니다
  - 자기 목숨을 걸고 잘못되었습니다
  - 자기 생명에 해가 되게 길을 잃었습니다
  lexicon: HALOT
  rationale: 히필 동사 תעה와 בְּנַפְשׁוֹתֵיכֶם의 결합은 단순한 ‘오해’보다 자기기만과 자기파괴의 뉘앙스를 함께 가집니다. 본문 문맥상 불순종을 전제로 한 자기기만을 살리되, footnote로 생명-위험의 뜻도 보존했습니다.
- source_word: יְהוָה אֱלֹהֵיכֶם / יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh your God / Yahweh our God
  chosen_korean: 우리 하나님 야훼 / 우리 하나님 야훼
  alternatives_korean:
  - 주 너희 하나님 / 주 우리 하나님
  - 여호와 너희 하나님 / 여호와 우리 하나님
  lexicon: DOCTRINE.md
  rationale: 테트라그람마톤은 직함이 아닌 고유명으로서 야훼를 유지했습니다. 문맥상 청중의 소속을 드러내기 위해 ‘우리/여러분의 하나님’ 구조도 함께 보존했습니다.
- source_word: הִתְפַּלֵּל בַּעֲדֵנוּ
  english_pob_choice: Pray for us
  chosen_korean: 우리를 위하여 기도해 주십시오
  alternatives_korean:
  - 우리를 위해 기도하십시오
  - 우리를 대신하여 기도해 주십시오
  - 우리를 위하여 간구해 주십시오
  lexicon: HALOT
  rationale: 히트파엘 פלל은 여기서 타인을 위하여 기도하는 뜻이므로, 현대 한국어에서 자연스러운 공손 표현인 ‘기도해 주십시오’로 옮겼습니다. ‘간구’도 가능하지만 요청의 직접성을 살리기 위해 ‘기도’로 했습니다.
- source_word: וְעָשִׂינוּ
  english_pob_choice: and we will do it
  chosen_korean: 그러면 우리가 그대로 행하겠습니다
  alternatives_korean:
  - 그리고 우리가 행하겠습니다
  - 그러면 우리가 하겠습니다
  - 그리하면 우리가 순종하겠습니다
  lexicon: HALOT
  rationale: 동사는 앞선 ‘말씀’에 대한 응답이므로, 한국어에서는 목적어를 풀어 주고 약속의 결과를 드러내는 ‘그대로 행하겠습니다’가 가장 자연스럽습니다. ‘순종하겠습니다’는 의미는 맞지만 원문보다 해석을 더 앞세울 수 있습니다.
theological_decisions:
- issue: ‘자기 생명을 걸고’의 자기파괴성 표현 유지
  chosen_reading: 본문의 도덕적 비난과 자해적 결과를 동시에 드러내는 표현으로 처리했습니다.
  alternative_readings:
  - 단순히 ‘스스로를 속였습니다’로만 옮김
  - ‘자기 목숨에 해가 되게 잘못했습니다’로 직역
  rationale: 히브리어 표현은 자기기만과 생명에 대한 위험을 함께 암시합니다. 한국어 본문에는 자기기만을 중심에 두되, 문맥의 엄중함이 약해지지 않도록 ‘자기 생명을 걸고’로 강도를 유지했습니다.
  doctrine_reference: Jer 42:20; HALOT תעה + נפש
- issue: 직접 인용의 공손체 유지
  chosen_reading: 예레미야의 보고 문장 안에 들어 있는 청중의 요청은 공손체로 유지했습니다.
  alternative_readings:
  - 명령형에 가까운 반말로 재구성
  - 평서문으로 완전히 평준화
  rationale: 이 절은 예레미야가 백성의 요청을 인용하는 장면이므로, 한국어에서도 인용문 내부의 요청체를 그대로 드러내는 것이 화용론적으로 더 정확합니다.
  doctrine_reference: Narrative discourse pragmatics
