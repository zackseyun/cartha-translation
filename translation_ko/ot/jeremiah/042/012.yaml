source:
  edition: WLC
  text: וְ/אֶתֵּ֥ן לָ/כֶ֛ם רַחֲמִ֖ים וְ/רִחַ֣ם אֶתְ/כֶ֑ם וְ/הֵשִׁ֥יב אֶתְ/כֶ֖ם אֶל אַדְמַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/012.yaml
  text: And I will show you mercy[a], and he will have mercy on you and restore you to your own land.
  footnotes:
  - marker: a
    text: Or, 'And I will give you mercy, and he will show you mercy and bring you back to your land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 긍휼을 베풀 것이며, 그가 너희에게 긍휼을 베풀어 너희를 너희의 땅으로 돌려보낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희에게 긍휼을 줄 것이며, 그가 너희에게 긍휼을 베풀어 너희를 너희의 땅으로 데려올 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶתֵּן
  english_pob_choice: I will grant
  chosen_korean: 내가 ... 베풀 것이며
  alternatives_korean:
  - 내가 ... 줄 것이며
  - 내가 ... 허락할 것이며
  lexicon: HALOT
  rationale: נתן의 기본값은 ‘주다’이지만, 여기서는 추상명사 רַחֲמִים과 결합하므로 한국어에서는 ‘베풀다’가 자연스럽고 ‘은혜/긍휼을 베풀다’의 성경적 용례도 살릴 수 있습니다.
- source_word: רַחֲמִים
  english_pob_choice: compassion
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 연민
  - 동정
  lexicon: HALOT
  rationale: רַחֲמִים은 정서적 동정 이상으로 구원적이고 언약적인 ‘긍휼’의 뉘앙스가 강하므로, 이어지는 רחם과의 어근 연결을 해치지 않으면서도 한국어 성경 어휘에 맞는 ‘긍휼’을 택했습니다.
- source_word: וְ/רִחַם
  english_pob_choice: and he will have compassion
  chosen_korean: 그가 너희에게 긍휼을 베풀어
  alternatives_korean:
  - 그가 너희를 불쌍히 여겨
  - 그가 너희에게 자비를 베풀어
  lexicon: HALOT
  rationale: 히브리어의 רַחַם은 רַחֲמִים과의 어근 반복을 이루므로, 한국어에서도 같은 ‘긍휼’ 표현을 반복해 원문의 수사적 연결을 드러냈습니다.
- source_word: וְ/הֵשִׁיב
  english_pob_choice: and restore
  chosen_korean: 돌려보낼 것입니다
  alternatives_korean:
  - 회복시킬 것입니다
  - 돌아오게 할 것입니다
  lexicon: HALOT
  rationale: הֵשִׁיב는 ‘돌아오게 하다/돌려보내다’의 사역형으로, 여기서는 목적지가 ‘너희의 땅’이므로 ‘돌려보내다’가 가장 직접적으로 원문을 반영합니다.
theological_decisions:
- issue: '주어 전환: 하나님 1인칭과 바벨론 왕을 가리키는 3인칭'
  chosen_reading: 하나님이 ‘내가 ... 긍휼을 베풀 것이며’라고 말씀한 뒤, ‘그가 ... 긍휼을 베풀어 ... 돌려보낼 것입니다’로 주어 전환을 그대로 유지했습니다.
  alternative_readings:
  - 모든 동사를 하나님 1인칭으로 통일하여 ‘내가 ... 긍휼을 베풀어 ... 돌려보낼 것이다’로 옮김
  rationale: 히브리어 본문이 1인칭에서 3인칭으로 분명히 전환하므로, 이를 평탄화하지 않고 유지해야 하나님이 바벨론 왕을 도구로 사용해 귀환을 이루신다는 긴장이 보존됩니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통에 의한 주어 통일 금지
