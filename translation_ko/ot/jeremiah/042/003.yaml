  lexicon: HALOT
  rationale: 행위의 방식이라는 비유적 의미를 한국어에서 가장 자연스럽게 살리기 위해 '길'로 옮겼습니다.
- source_word: הַדָּבָר
  english_pob_choice: the thing
  chosen_korean: 해야 할 일
  alternatives_korean:
