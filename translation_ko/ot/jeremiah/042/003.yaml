    text: 또는 ‘우리가 해야 할 사안’.
    reason: הַדָּבָר는 여기서 해야 할 ‘일’ 또는 ‘사안’을 뜻할 수 있습니다.
lexical_decisions:
- source_word: וְיַגֶּד / may tell
  english_pob_choice: may tell
  chosen_korean: 말씀해 주시기를 바랍니다
  alternatives_korean:
  - 알려 주시기를 바랍니다
  - 말해 주시기를 바랍니다
  lexicon: HALOT
  rationale: 청원문 맥락에서 단순 미래보다 요청의 뉘앙스를 살리기 위해 공손한 소망형으로 옮겼습니다. '말씀하다'는 공식적이고 예언자적/신적 발화에도 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 기존 POB의 원칙에 따라 여호와 대용어 대신 신명기적 고유명사로 처리했습니다.
- source_word: הַדֶּרֶךְ
  english_pob_choice: the way
  chosen_korean: 길
  alternatives_korean:
  - 길
  - 행로
  - 도로
  lexicon: HALOT
  rationale: 행위의 방식이라는 비유적 의미를 한국어에서 가장 자연스럽게 살리기 위해 '길'로 옮겼습니다.
- source_word: הַדָּבָר
  english_pob_choice: the thing
  chosen_korean: 해야 할 일
  alternatives_korean:
  - 일
  - 일거리
  - 사안
  lexicon: HALOT
  rationale: 병행구절에서 추상적 '말/사건'보다 실제로 취할 행동을 가리키므로 문맥상 '해야 할 일'이 가장 정확합니다.
theological_decisions:
- issue: 하나님께 드리는 청원문의 한국어 높임말 수준
  chosen_reading: 직접 호칭은 '당신의 하나님', 동사와 종결은 공손한 청원형으로 처리했습니다.
  alternative_readings:
  - '''주 우리의 하나님''처럼 전형적 교회식 표현'
