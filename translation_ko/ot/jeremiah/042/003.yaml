  chosen_korean: 말씀해 주시기를 바랍니다
  alternatives_korean:
  - 알려 주시기를 바랍니다
  - 말해 주시기를 바랍니다
  lexicon: HALOT
  rationale: 청원문 맥락에서 단순 미래보다 요청의 뉘앙스를 살리기 위해 공손한 소망형으로 옮겼습니다. '말씀하다'는 공식적이고 예언자적/신적 발화에도 자연스럽습니다.
