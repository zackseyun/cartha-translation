  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבֶּ֨ר יְהוָ֤ה עֲלֵי/כֶם֙ שְׁאֵרִ֣ית יְהוּדָ֔ה אַל תָּבֹ֖אוּ מִצְרָ֑יִם יָדֹ֨עַ֙ תֵּֽדְע֔וּ כִּי הַעִידֹ֥תִי בָ/כֶ֖ם הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/019.yaml
  text: 'Yahweh has spoken concerning you[a], remnant of Judah: Do not go to Egypt. Know for certain that I have warned you today.'
  footnotes:
  - marker: a
    text: Or, 'I have solemnly testified against you today.' The Hebrew verb can carry the sense of giving formal witness or warning.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 너희에게, 유다의 남은 자들아, 말씀하셨습니다. 애굽으로 가지 마십시오. 오늘 내가 너희에게 엄숙히 경고한 것을 분명히 알아 두십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 오늘 너희에게 엄숙히 증언하였다.” 히브리어 동사는 공식적인 증언이나 경고의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבֶּר יְהוָה
  english_pob_choice: Yahweh has spoken
  chosen_korean: 야훼께서 … 말씀하셨습니다
  alternatives_korean:
  - 야훼께서 … 말하셨습니다
  - 야훼께서 … 이르셨습니다
  lexicon: HALOT
  rationale: דִּבֶּר는 선포된 발화의 완료상을 나타내므로, 현대 한국어에서 자연스럽고 위엄 있는 ‘말씀하셨습니다’로 옮겼습니다. יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 렌더링했습니다.
- source_word: שְׁאֵרִית יְהוּדָה
  english_pob_choice: remnant of Judah
  chosen_korean: 유다의 남은 자들
  alternatives_korean:
  - 유다의 남은 무리
  - 유다의 남은 사람들
  lexicon: HALOT
  rationale: שְׁאֵרִית의 예언서적 함의는 ‘남은 자’로 살리고, 호격이므로 복수 호칭형 ‘남은 자들아’로 자연스럽게 처리했습니다.
- source_word: אַל תָּבֹאוּ
  english_pob_choice: Do not go
  chosen_korean: 애굽으로 가지 마십시오
  alternatives_korean:
  - 애굽으로 들어가지 마십시오
  - 애굽에 가지 마십시오
  lexicon: HALOT
  rationale: 부정 명령은 이동 금지의 맥락이므로 ‘가다’가 가장 자연스럽습니다. 목적지를 드러내기 위해 ‘애굽으로’로 풀었습니다.
- source_word: יָדֹעַ תֵּדְעוּ
  english_pob_choice: Know for certain
  chosen_korean: 분명히 알아 두십시오
  alternatives_korean:
  - 반드시 아십시오
  - 확실히 아십시오
  lexicon: HALOT
  rationale: 부정사 절대형+동사 반복의 강한 강조를 현대 한국어의 명령형 강조로 옮겼습니다. ‘알아 두십시오’는 단순 지식이 아니라 경고를 받아들이고 기억하라는 뉘앙스를 살립니다.
- source_word: הַעִידֹתִי בָכֶם
  english_pob_choice: I have warned you
  chosen_korean: 내가 너희에게 엄숙히 경고한 것
  alternatives_korean:
  - 내가 너희에게 증언한 것
  - 내가 너희에게 엄숙히 증언한 것
  lexicon: HALOT
  rationale: עוּד의 의미 범위는 ‘증언하다/엄숙히 증언하다/경고하다’까지 포함하므로, 문맥상 경고 기능을 살린 ‘엄숙히 경고한 것’으로 번역했습니다. EN POB의 대안적 ‘testified against you’ 뉘앙스는 주석 없이 본문에는 과도하게 드러내지 않았습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: ‘야훼’로 고정하고, 주어 위치에서 존칭 종결 ‘말씀하셨습니다’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주께서 말씀하셨습니다
  rationale: 본문은 하나님의 이름 자체를 지칭하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지하는 것이 원문 및 감사층과 가장 잘 맞습니다. ‘주께서’는 대체 신학적 표현이지만 כאן은 이름 보존이 우선입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘경고하다’와 ‘증언하다’의 긴장
  chosen_reading: 본문에는 ‘엄숙히 경고하다’를 두고, 해석 가능성은 문맥상 함의로 남겼습니다.
  alternative_readings:
  - 엄숙히 증언하다
  - 엄숙히 증언하여 경고하다
  rationale: 히브리어 עוּד는 법정적 ‘증언’과 경고의 기능을 함께 가질 수 있으나, 이 절의 직접 목적은 출애굽 경고이므로 독자가 즉시 이해할 수 있는 경고 표현을 채택했습니다. 감사층의 lexical alternative는 주석 역할로 충분합니다.
  doctrine_reference: Translation philosophy §3, §5
