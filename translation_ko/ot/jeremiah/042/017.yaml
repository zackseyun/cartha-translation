    issue: 하나님의 재앙을 가져오시는 직접적 행위가 본문에서 누락됨
    rationale: מִפְּנֵי הָרָעָה אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם는 단순히 ‘재앙에서’가 아니라, 하나님께서 그들에게 내리시는 재앙임을 명시합니다. 이는 내용상 필수 요소입니다.
