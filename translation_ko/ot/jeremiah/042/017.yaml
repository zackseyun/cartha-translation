revisions:
- from: 그리하여 애굽으로 가서 거기서 거류하려고 얼굴을 향한 모든 사람은 칼과 기근과 전염병으로 죽을 것입니다. 그들 가운데는 재앙에서 살아남는 사람도, 도망치는 사람도 없을 것입니다.[a][b]
  to: 그러므로 애굽으로 가서 거기에 거류하려고 얼굴을 애굽 쪽으로 굳게 향한 모든 사람은 칼과 기근과 전염병으로 죽을 것입니다. 그들에게는 내가 내리는 재앙에서 살아남을 자도 피할 자도 하나 없을 것입니다.[a][b]
  rationale: 원문의 누락된 하나님의 직접적 심판 행위를 복원했습니다. 또한 히브리어 ‘얼굴을 두다’ 관용구는 결연한 방향 설정을 나타내도록 다듬었고, 각주 b를 실제 병렬어와 연결되는 설명으로 수정했습니다. 재앙의 성격이나 심판의 범위에 해석을 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:27:46Z'
review_pass:
  verdict: revise
  source_fidelity: 수정 전 본문은 히브리어의 핵심 종결절인 ‘내가 그들에게 가져오는 재앙’(אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם)을 번역문에서 빠뜨렸습니다. 또한 ‘얼굴을 향한’은 히브리어 관용구의 결연한 의지를 자연스러운 한국어로 전달하지 못합니다. 수정문은 하나님의 직접적이고 진행/임박한 심판 행위를 명시하고, 해당 관용구의 의미를 보존합니다.
  naturalness: ‘얼굴을 애굽 쪽으로 굳게 향한’은 직역적 이미지를 유지하면서도 ‘얼굴을 향한’보다 자연스럽습니다. ‘거류하려고’는 다소 문어적이지만 현대 격식체 성경 번역에서 이해 가능하며, 타국 거주의 뉘앙스를 보존합니다. ‘살아남을 자도 피할 자도 하나’는 병렬 강조를 자연스럽게 드러냅니다.
  terminology: ‘애굽’, ‘칼’, ‘기근’, ‘전염병’, ‘재앙’은 예레미야의 예언 및 심판 문맥에 적절합니다. שָׂרִיד וּפָלִיט는 ‘살아남을 자’와 ‘피할 자’로 구별해, 남은 자와 탈출자의 총체적 부정을 보존했습니다. 각주 b는 기존처럼 재앙 어휘만 설명하기보다 실제 히브리어 병렬어에 맞추어 정정했습니다.
  issues:
