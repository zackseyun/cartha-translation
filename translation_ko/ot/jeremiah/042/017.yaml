    rationale: שָׂמוּ אֶת־פְּנֵיהֶם는 방향을 정하고 단호히 결심했다는 관용구입니다. 목적지를 보충하고 ‘굳게’를 더하여 이미지와 의미를 함께 보존했습니다.
