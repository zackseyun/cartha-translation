  edition: WLC
  text: וְ/יִֽהְי֣וּ כָל הָ/אֲנָשִׁ֗ים אֲשֶׁר שָׂ֨מוּ אֶת פְּנֵי/הֶ֜ם לָ/ב֤וֹא מִצְרַ֨יִם֙ לָ/ג֣וּר שָׁ֔ם יָמ֕וּתוּ בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/לֹֽא יִהְיֶ֤ה לָ/הֶם֙ שָׂרִ֣יד וּ/פָלִ֔יט מִ/פְּנֵי֙ הָֽ/רָעָ֔ה אֲשֶׁ֥ר אֲנִ֖י מֵבִ֥יא עֲלֵי/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/017.yaml
  text: Then all the men who have set their faces to go to Egypt to sojourn there shall die by the sword[a], by famine, and by pestilence[b]. None of them shall have a survivor or an escapee from the disaster that I am bringing on them.
  footnotes:
  - marker: a
    text: Or 'to sojourn there.' The Hebrew verb can emphasize residing as a foreigner.
    reason: lexical_alternative
  - marker: b
    text: Or 'remnant or fugitive.' The Hebrew pair stresses that none will remain alive and none will escape.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 애굽으로 가서 거기서 거류하려고 얼굴을 향한 모든 사람은 칼과 기근과 전염병으로 죽을 것입니다. 그들 가운데는 재앙에서 살아남는 사람도, 도망치는 사람도 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거류하다’는 여기서 히브리어 לָגוּר의 외국인으로서 거주한다는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재앙’은 히브리어 רָעָה가 이 문맥에서 뜻하는 심판성 재난을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִהְיוּ
  english_pob_choice: Then ... shall
  chosen_korean: 그리하여 ... -할 것입니다
  alternatives_korean:
  - 그리고 ... 입니다
  - 그리하여 ... -할 것입니다
  lexicon: HALOT
  rationale: 앞선 경고의 결과를 나타내는 연결을 한국어에서 자연스럽게 살리되, 예언적 선언의 단호함도 유지했습니다.
- source_word: אֲשֶׁר שָׂמוּ אֶת פְּנֵיהֶם
  english_pob_choice: who have set their faces
  chosen_korean: 얼굴을 향한
  alternatives_korean:
  - 결심한
  - 얼굴을 돌린
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역적으로 살려 ‘얼굴을 향하다’로 옮겨, 결연한 의지라는 이미지를 보존했습니다.
- source_word: לָבוֹא מִצְרַיִם ... לָגוּר שָׁם
  english_pob_choice: to go to Egypt ... to sojourn there
  chosen_korean: 애굽으로 가서 거기서 거류하려고
  alternatives_korean:
  - 애굽으로 들어가서 거기 머물려고
  - 애굽으로 가서 거기서 살려고
  lexicon: HALOT
  rationale: לָגוּר의 외국인 거주/거류 뉘앙스를 살리기 위해 ‘거류하다’를 선택했고, 문장 전체는 현대 한국어 문법에 맞게 정리했습니다.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  english_pob_choice: by the sword, by famine, and by pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 기근과 역병으로
  - 전쟁과 기근과 전염병으로
  lexicon: HALOT
  rationale: 예레미야의 대표적 심판 삼중구를 그대로 유지하되, דֶּבֶר는 예언문맥에서의 재난성 질병을 드러내는 ‘전염병’으로 옮겼습니다.
- source_word: שָׂרִיד וּפָלִיט
  english_pob_choice: a survivor or an escapee
  chosen_korean: 살아남는 사람도, 도망치는 사람도
  alternatives_korean:
  - 남은 자도, 도망자도
  - 생존자도, 탈출자도
  lexicon: HALOT
  rationale: 두 명사의 병렬이 ‘남아 있는 자’와 ‘빠져나간 자’의 부정적 총체성을 강조하므로, 현대 독자가 이해하기 쉬운 방식으로 분리해 표현했습니다.
- source_word: מִפְּנֵי הָרָעָה אֲשֶׁר אֲנִי מֵבִיא עֲלֵיהֶם
  english_pob_choice: from the disaster that I am bringing on them
  chosen_korean: 재앙에서 ...
  alternatives_korean:
  - 재난에서 ...
  - 내가 그들 위에 가져오는 재앙에서 ...
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 심판의 재앙이므로 ‘재앙’으로 옮겼고, 하나님이 직접 가져오시는 심판임을 본문 흐름대로 유지했습니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위
  chosen_reading: 내가 그들 위에 가져오는 재앙
  alternative_readings:
  - 내가 그들에게 내리는 재난
  - 내가 그들 위에 가져올 재앙
  rationale: 히브리어 현재분사 מֵבִיא의 진행/임박 감각을 살려, 심판의 주체가 하나님이심을 완화 없이 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 거류(sojourn) 뉘앙스의 보존
  chosen_reading: 거기서 거류하려고
  alternative_readings:
  - 거기서 살려고
  - 거기서 머무르려고
  rationale: לָגוּר는 단순한 체류보다 ‘타지에서 거류함’의 의미가 있어, 이 단어를 선택해 본문의 이방 체류 의도를 살렸습니다.
  doctrine_reference: Translation philosophy §2
