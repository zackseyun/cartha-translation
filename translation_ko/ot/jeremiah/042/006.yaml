  edition: WLC
  text: אִם ט֣וֹב וְ/אִם רָ֔ע בְּ/ק֣וֹל יְהוָ֣ה אֱלֹהֵ֗י/נוּ אֲשֶׁ֨ר אנו שֹׁלְחִ֥ים אֹתְ/ךָ֛ אֵלָ֖י/ו נִשְׁמָ֑ע לְמַ֨עַן֙ אֲשֶׁ֣ר יִֽיטַב לָ֔/נוּ כִּ֣י נִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֵֽי/נוּ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/006.yaml
  text: Whether it is good or whether it is bad, we will obey the voice of the LORD our God, to whom we are sending you, so that it may go well with us when we obey the voice of the LORD our God.
translation:
  language: ko
  text: 좋든지 나쁘든지, 우리는 당신을 그에게 보내는 주 우리 하나님의 목소리에 순종하겠습니다. 그래서 우리가 주 우리 하나님의 목소리에 순종할 때 우리에게 잘되게 하실 것입니다.
  philosophy: formal
lexical_decisions:
- source_word: אִם טוֹב וְאִם רָע
  english_pob_choice: Whether it is good or whether it is bad
  chosen_korean: 좋든지 나쁘든지
  alternatives_korean:
  - 좋든지 나쁘든지 간에
  - 좋든 좋지 않든
  lexicon: אִם…וְאִם…
  rationale: 대구 구조를 살려 조건의 양극을 그대로 드러내는 가장 직접적인 한국어 표현으로 옮겼습니다.
- source_word: בְּקוֹל יְהוָה אֱלֹהֵינוּ
  english_pob_choice: the voice of the LORD our God
  chosen_korean: 주 우리 하나님의 목소리
  alternatives_korean:
  - 주 우리 하나님의 음성
  - 여호와 우리 하나님의 목소리
  lexicon: בְּקוֹל + יְהוָה אֱלֹהֵינוּ
  rationale: 기존 POB의 LORD 표기를 반영하되, מקור의 ‘목소리/음성’ 의미를 살려 순종의 대상이 되는 말 자체를 분명히 했습니다.
- source_word: נִשְׁמָע
  english_pob_choice: we will obey
  chosen_korean: 순종하겠습니다
  alternatives_korean:
  - 듣겠습니다
  - 말씀을 따르겠습니다
  lexicon: שׁמע
  rationale: 히브리어 ‘듣다’가 단순 청취가 아니라 복종을 포함하는 문맥이므로, 한국어에서는 그 함의를 가장 분명히 드러내는 ‘순종하다’를 택했습니다.
- source_word: לְמַעַן אֲשֶׁר יִיטַב לָנוּ
  english_pob_choice: so that it may go well with us
  chosen_korean: 그래서 우리가 … 잘되게 하실 것입니다
  alternatives_korean:
  - 그래서 우리에게 복이 되게 하실 것입니다
  - 그래서 우리에게 잘되도록 하겠습니다
  lexicon: לְמַעַן + ייטב
  rationale: 결과 목적을 나타내는 구조를 자연스럽게 살리되, ‘잘되다’의 복지적 결과를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기 문제
  chosen_reading: 본문에는 POB 관행에 따라 ‘주’로 옮기고, 이미 익숙한 ‘주 우리 하나님’ 구문을 유지했습니다.
  alternative_readings:
  - 야훼 우리 하나님
  - 여호와 우리 하나님
  rationale: 제공된 영어 POB가 LORD를 사용하고 있으며, 이 절은 직접적인 야훼-본문 강조보다 서원적 순종 진술이 중심이므로 본문 가독성을 우선했습니다.
  doctrine_reference: POB name-rendering policy for YHWH
- issue: ‘when we obey’의 시점/조건 관계
  chosen_reading: ‘우리가 … 순종할 때’의 의미를 반영하지 않고, 결과 절로서 자연스럽게 ‘그래서 … 잘되게 하실 것입니다’로 처리했습니다.
  alternative_readings:
  - 우리가 순종할 때 우리에게 잘되게 하실 것입니다
  - 우리가 순종하므로 우리에게 잘되게 하실 것입니다
  rationale: 히브리어는 목적/결과를 나타내는 לְמַעַן과 그 뒤의 결과 진술을 갖고 있으므로, 한국어에서는 중복된 조건문보다 결과 관계를 분명하게 했습니다.
  doctrine_reference: Hebrew clause relation in Jeremiah 42:6
