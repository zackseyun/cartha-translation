id: JER.42.1
reference: Jeremiah 42:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּגְּשׁוּ֙ כָּל שָׂרֵ֣י הַ/חֲיָלִ֔ים וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וִֽ/יזַנְיָ֖ה בֶּן הוֹשַֽׁעְיָ֑ה וְ/כָל הָ/עָ֖ם מִ/קָּטֹ֥ן וְ/עַד גָּדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/001.yaml
  text: Then all the commanders of the forces approached[a], along with Yohanan son of Kareah and Yizaniah son of Hoshaiah[b], and all the people from the least to the greatest.
  footnotes:
  - marker: a
    text: Or 'all the captains of the forces' or 'all the officers of the army.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the least to the greatest,' an idiom meaning everyone across the whole community.
    reason: cultural_note
translation:
  language: ko
  text: 그때 군대의 모든 지휘관들과 가레아의 아들 요하난과 호사야의 아들 이사냐와, 작은 자부터 큰 자까지 모든 백성이 나아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘작은 자부터 큰 자까지’는 히브리어 관용구로, 공동체의 모든 계층을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  english_pob_choice: approached
  chosen_korean: 나아왔습니다
  alternatives_korean:
  - 다가왔습니다
  - 접근했습니다
  lexicon: HALOT
  rationale: 서술문 흐름에서 단순한 이동보다 어떤 인물에게로 모여드는 뉘앙스를 살려 ‘나아오다’로 옮겼습니다.
- source_word: כָּל שָׂרֵי הַחֲיָלִים
  english_pob_choice: all the commanders of the forces
  chosen_korean: 군대의 지휘관들 모두
  alternatives_korean:
  - 군대의 모든 지휘관들
  - 군대의 모든 대장들
  lexicon: HALOT
  rationale: שָׂרֵי는 지휘관/지도자 계열이고 חֲיָלִים은 군사력 전체를 가리키므로, 현대 한국어에서 자연스러운 ‘군대의 지휘관들’로 옮겼습니다.
- source_word: וִיזַנְיָה בֶּן־הוֹשַׁעְיָה
  english_pob_choice: Yizaniah son of Hoshaiah
  chosen_korean: 이사냐의 아들 호사야
  alternatives_korean:
  - 이사냐의 아들 이사냐
  - 예사냐의 아들 호사야
  lexicon: HALOT
  rationale: 히브리어 자음형을 따라 고유명사를 음역했고, 전통형 ‘여아냐/예사냐’보다 원형에 가까운 표기를 택했습니다.
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  english_pob_choice: from the least to the greatest
  chosen_korean: 가장 작은 사람부터 가장 큰 사람까지
  alternatives_korean:
  - 가장 낮은 사람부터 가장 높은 사람까지
  - 작은 사람부터 큰 사람까지
  lexicon: HALOT
  rationale: 이 관용구는 공동체 전체를 포괄하는 대구법이므로, 신분·규모의 전 범위를 드러내는 한국어 관용으로 살렸습니다.
theological_decisions:
- issue: ‘모든 백성’과 관용구의 범위 표현
  chosen_reading: 특정 계층만이 아니라 공동체 전체가 대표성 있게 나아왔다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 연령의 양극을 뜻하는 표현
  - 수사적 과장으로만 읽는 표현
  rationale: ‘가장 작은 사람부터 가장 큰 사람까지’는 히브리어 관용구로서 공동체의 총체성을 드러내므로, 범위 표지를 유지하는 것이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: 본문의 사회적 총체성 표현에 대한 문법-의미적 해석
- issue: 고유명사 음역
  chosen_reading: 전통 교회형보다 히브리어 자음형에 더 가까운 음역을 택했습니다.
  alternative_readings:
  - 전통형 이름 사용
  - 한국어 성서의 익숙한 음역 유지
  rationale: 이 단락은 인물 목록이 핵심이므로, 원문 대응성을 높이는 음역이 본문의 식별성을 더 잘 보존합니다.
  doctrine_reference: 원문 근접 번역 원칙
