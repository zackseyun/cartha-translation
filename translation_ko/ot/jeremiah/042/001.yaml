    rationale: 히브리어 וִיזַנְיָה בֶּן־הוֹשַׁעְיָה는 ‘호사야의 아들 이사냐’입니다. 번역문은 올바르나, 개정문에서도 이 관계를 분명히 유지해야 합니다.
