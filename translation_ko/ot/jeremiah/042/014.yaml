  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֵ/אמֹ֗ר לֹ֚א כִּ֣י אֶ֤רֶץ מִצְרַ֨יִם֙ נָב֔וֹא אֲשֶׁ֤ר לֹֽא נִרְאֶה֙ מִלְחָמָ֔ה וְ/ק֥וֹל שׁוֹפָ֖ר לֹ֣א נִשְׁמָ֑ע וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב וְ/שָׁ֥ם נֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/014.yaml
  text: saying[a], ‘No, but we will go into the land of Egypt, where we will not see war, and we will not hear the sound of the trumpet, and we will not be hungry for bread; and there we will live.’
  footnotes:
  - marker: a
    text: Or 'and there we will dwell.' The Hebrew verb can denote settled residence as well as simply remaining somewhere.
    reason: lexical_alternative
translation:
  language: ko
  text: “아니오, 그러나 우리는 이집트 땅으로 들어갈 것입니다. 그곳에서는 전쟁을 보지 않을 것이고, 나팔 소리도 듣지 않을 것이며, 양식이 없어 굶주리지도 않을 것이고, 거기에서 살 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘거주하다’라는 정착의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: “아니오, 그러나 …”로 이어지는 인용 도입
  alternatives_korean:
  - 말하며
  - 이르되
  lexicon: HALOT
  rationale: 히브리어 לֵאמֹר는 앞 문맥의 발화를 잇는 표지이므로, 한국어에서는 자연스러운 직접인용 도입으로 처리했습니다.
- source_word: לֹא כִּי
  english_pob_choice: No, but
  chosen_korean: 아니오, 그러나
  alternatives_korean:
  - 아니요, 아니라
  - 아니오, 오히려
  lexicon: HALOT
  rationale: 강한 거절 뒤에 반대 방향의 결의를 잇는 구조이므로, 단순 부정보다 대조를 살리는 ‘아니오, 그러나’가 적절합니다.
- source_word: וְ/לַ/לֶּ֥חֶם לֹֽא נִרְעָ֖ב
  english_pob_choice: we will not be hungry for bread
  chosen_korean: 양식이 없어 굶주리지도 않을 것이고
  alternatives_korean:
  - 빵을 두고 굶주리지도 않을 것이고
  - 먹을 것이 없어 굶주리지도 않을 것이고
  lexicon: HALOT
  rationale: 히브리어는 ‘빵/양식’에 대해 굶주리지 않는다는 구체적 이미지를 담고 있어, ‘양식’으로 보존하면서 한국어에서는 자연스럽게 ‘굶주리지 않다’로 옮겼습니다.
- source_word: וְשָׁ֥ם נֵשֵֽׁב
  english_pob_choice: and there we will live
  chosen_korean: 거기에서 살 것입니다
  alternatives_korean:
  - 거기에서 거주할 것입니다
  - 거기에서 머물 것입니다
  lexicon: HALOT
  rationale: נֵשֵׁב는 정착하여 사는 뜻을 가질 수 있으므로, 현대 독자가 이해하기 쉬운 ‘살다’로 옮기되 정착의 의미를 유지했습니다.
theological_decisions:
- issue: 예레미야 42:14의 화자 어조와 직접인용 처리
  chosen_reading: 백성이 단호하게 거절하는 말투를 그대로 드러내기 위해 직접인용을 사용했고, 전체 문장은 서술체 합쇼체로 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰기
  - 더 완곡한 선언형으로 바꾸기
  rationale: 본문은 협상적 설명이 아니라 결연한 거절과 결심의 인용이므로, 직설적 인용 구조가 문맥의 긴장을 잘 보존합니다.
  doctrine_reference: 본문 문맥 이해
