  terminology: ‘재앙’은 הָרָעָה의 문맥상 재난·심판을 적절히 나타내며, ‘뜻을 돌리다’는 נחם의 방향 전환을 보존하면서 도덕적 회개라는 오해를 피합니다. ‘뽑아내다’는 심다의 대조 은유로 적절합니다.
