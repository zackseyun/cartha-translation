id: JER.42.10
reference: Jeremiah 42:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם שׁ֤וֹב תֵּֽשְׁבוּ֙ בָּ/אָ֣רֶץ הַ/זֹּ֔את וּ/בָנִ֤יתִי אֶתְ/כֶם֙ וְ/לֹ֣א אֶהֱרֹ֔ס וְ/נָטַעְתִּ֥י אֶתְ/כֶ֖ם וְ/לֹ֣א אֶתּ֑וֹשׁ כִּ֤י נִחַ֨מְתִּי֙ אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר עָשִׂ֖יתִי לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/010.yaml
  text: If you will indeed remain in this land[a], then I will build you up and not tear you down, and I will plant you and not uproot you[c][b]; for I relent concerning the harm that I did to you.
  footnotes:
  - marker: a
    text: Or 'If you truly stay in this land.' The Hebrew uses an infinitive absolute before the finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will plant you and not pluck you up.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says 'I relent concerning the harm/disaster.' Older English versions often have 'repent of the evil,' where 'evil' means calamity, not moral wrongdoing.
    reason: lexical_alternative
translation:
  language: ko
  text: 만일 여러분이 정말로 이 땅에 계속 머문다면, 내가 여러분을 세워 무너뜨리지 않을 것이며, 여러분을 심고 뽑아내지 않을 것입니다. 이는 내가 여러분에게 행한 그 재앙에 대하여 뜻을 돌렸기 때문입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘정말로’는 히브리어의 부정사 절대형이 finite verb를 강조하는 효과를 반영합니다.
    reason: source_note
  - marker: b
    text: ‘뽑아내지’는 직역적 ‘뽑아내다’보다 현대 한국어에서 더 자연스러운 반대 동작 표현입니다.
    reason: korean_style_note
  - marker: c
    text: ‘뜻을 돌리다’는 כאן의 נחם을 하나님께 도덕적 회개로 오해하지 않게 하면서, 심판을 거두는 방향 전환을 살립니다.
    reason: theological_note
lexical_decisions:
- source_word: אִם שׁוֹב תֵּשְׁבוּ
  english_pob_choice: If you will indeed remain
  chosen_korean: 만일 여러분이 정말로 이 땅에 계속 머문다면
  alternatives_korean:
  - 만일 여러분이 이 땅에 진정 머문다면
  - 만일 여러분이 이 땅에 반드시 머문다면
  lexicon: HALOT
  rationale: אִם의 조건문과 infinitive absolute + finite verb의 강조를 함께 살려, 단순한 조건이 아니라 ‘정말로/계속’의 강조로 옮겼습니다.
- source_word: וּבָנִיתִי אֶתְכֶם / וְלֹא אֶהֱרֹס
  english_pob_choice: I will build you up and not tear you down
  chosen_korean: 내가 여러분을 세워 무너뜨리지 않을 것이며
  alternatives_korean:
  - 내가 여러분을 세우고 허물지 않을 것이며
  - 내가 여러분을 다시 세워주고 무너뜨리지 않을 것이며
  lexicon: HALOT
  rationale: 건축 은유를 그대로 살리되 현대 한국어에서 자연스러운 ‘세우다/무너뜨리다’로 대응해 회복과 심판의 대비를 유지했습니다.
- source_word: וְנָטַעְתִּי אֶתְכֶם / וְלֹא אֶתּוֹשׁ
  english_pob_choice: and I will plant you and not uproot you
  chosen_korean: 여러분을 심고 뽑아내지 않을 것입니다
  alternatives_korean:
  - 여러분을 심고 뿌리째 뽑지 않을 것입니다
  - 여러분을 심고 뽑아버리지 않을 것입니다
  lexicon: HALOT
  rationale: ‘plant’와 대구를 이루는 농경 은유를 살리면서, נטשׁ의 반대 개념을 현대적으로 ‘뽑아내다’로 옮겼습니다.
- source_word: נִחַמְתִּי אֶל הָרָעָה
  english_pob_choice: I relent concerning the harm
  chosen_korean: 뜻을 돌렸기 때문입니다
  alternatives_korean:
  - 재앙에 대하여 돌이켰기 때문입니다
  - 재난에 관하여 뜻을 바꾸었기 때문입니다
  lexicon: HALOT
  rationale: 하나님을 주어로 한 נחם은 도덕적 ‘회개’가 아니라 심판을 거두는 방향 전환이므로, 한국어에서는 직접적인 ‘회개하다’ 대신 ‘뜻을 돌리다’로 신학적 오해를 피했습니다.
- source_word: הָרָעָה
  english_pob_choice: the harm / disaster
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 해악
  - 그 재난
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 악이 아니라 심판으로 임한 재앙을 뜻하므로, 한국어 독자가 즉시 이해할 수 있는 ‘재앙’을 택했습니다.
theological_decisions:
- issue: 하나님의 נחם(뜻을 돌림)의 표현
  chosen_reading: ‘뜻을 돌렸기 때문입니다’
  alternative_readings:
  - ‘회개했기 때문입니다’
  - ‘유감스럽게 여기기 때문입니다’
  rationale: 본문은 하나님이 이전에 선언하신 심판에 대해 방향을 바꾸시는 것을 말하며, 한국어 ‘회개하다’는 하나님께 도덕적 잘못을 암시할 수 있어 피했습니다. 동시에 본문의 감정적·관계적 긴장도 유지했습니다.
  doctrine_reference: Translation philosophy §3; divine anthropopathic language
- issue: הָרָעָה의 의미
  chosen_reading: ‘재앙’
  alternative_readings:
  - ‘악’
  - ‘해악’
  - ‘재난’
  rationale: 여기서 ‘악’은 도덕적 악으로 오해될 수 있으므로, 문맥상 심판의 결과인 재앙이라는 의미를 분명히 했습니다.
  doctrine_reference: 원문 어휘의 문맥 의미 보존
