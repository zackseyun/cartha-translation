  source_fidelity: 조건절의 강조, 건축·식재 은유, 그리고 재앙에 관한 하나님의 נחם을 전반적으로 잘 반영합니다. 다만 각주 b는 ‘뽑아내지’와 ‘뽑아내다’를 대조하는 듯하여 설명 자체가 성립하지 않으며, 각주 표지도 해당 표현 가까이에 배치하는 것이 적절합니다. ‘내가 여러분에게 행한 그 재앙’보다 재앙을 ‘내리다’로 표현하는 편이 한국어 관용과 문맥에 더 맞습니다.
