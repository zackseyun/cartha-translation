- from: 바벨론 왕을 두려워하지 마십시오. 그를 두려워하고 있는 당신들을 두려워하지 마십시오. 야훼의 말씀입니다. 내가 당신들과 함께 있어 당신들을 구원하고 그의 손에서 건져 내리기 때문입니다.[a]
  to: 여러분이 두려워하는 바벨론 왕을 두려워하지 마십시오. 그를 두려워하지 마십시오. 야훼의 말씀입니다. 내가 여러분과 함께 있어 여러분을 구원하고 그의 손에서 건져 내기 때문입니다.
  rationale: 핵심적으로 히브리어의 ‘바벨론 왕, 곧 여러분이 그를 두려워하는 그 왕’이라는 관계절을 ‘여러분이 두려워하는 바벨론 왕’으로 바로잡았습니다. 두 차례의 금지 명령, 야훼의 예언 선언, 함께하심을 근거로 한 구원과 건짐의 약속을 유지했습니다. 의미 없는 신명 각주는 삭제했습니다.
