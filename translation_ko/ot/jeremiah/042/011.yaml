source:
  edition: WLC
  text: אַל תִּֽירְא֗וּ מִ/פְּנֵי֙ מֶ֣לֶךְ בָּבֶ֔ל אֲשֶׁר אַתֶּ֥ם יְרֵאִ֖ים מִ/פָּנָ֑י/ו אַל תִּֽירְא֤וּ מִמֶּ֨/נּוּ֙ נְאֻם יְהוָ֔ה כִּֽי אִתְּ/כֶ֣ם אָ֔נִי לְ/הוֹשִׁ֧יעַ אֶתְ/כֶ֛ם וּ/לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/011.yaml
  text: Do not fear the king of Babylon[a], before whom you are afraid. Do not fear him, declares Yahweh[b], for I am with you to save you and to deliver you from his hand.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Yahweh.'' The main text follows the project''s standard rendering ''the LORD'' for the divine name יְהוָה.'
    reason: alternative_reading
  - marker: b
    text: Or 'whom you are fearing'.
    reason: previous_rendering
translation:
  language: ko
  text: 바벨론 왕을 두려워하지 마십시오. 그를 두려워하고 있는 당신들을 두려워하지 마십시오. 야훼의 말씀입니다. 내가 당신들과 함께 있어 당신들을 구원하고 그의 손에서 건져 내리기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼’입니다. 본문은 신명 표기 정책에 따라 야훼로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: תִּירְאוּ / יְרֵאִים
  english_pob_choice: do not fear / you are afraid
  chosen_korean: 두려워하지 마십시오 / 두려워하고 있는
  alternatives_korean:
  - 무서워하지 마십시오 / 무서워하고 있는
  - 두려워하지 마십시오 / 두려워하는
  lexicon: HALOT
  rationale: יַרֵא의 반복을 살려 첫 명령과 현재적 상태를 분리해 옮겼습니다. 한국어에서는 ‘두려워하다’가 가장 자연스럽고, 진행형 표현으로 반복된 פחד의 지속성을 드러낼 수 있습니다.
- source_word: מִפְּנֵי ... מִפָּנָיו
  english_pob_choice: the king of Babylon, before whom you are afraid
  chosen_korean: 바벨론 왕을 두려워하지 마십시오. 그를 두려워하고 있는 당신들을 두려워하지 마십시오.
  alternatives_korean:
  - 바벨론 왕 앞에서
  - 바벨론 왕 때문에
  lexicon: HALOT
  rationale: ‘~의 얼굴 앞에서’라는 관용을 한국어에서 직역하기보다, 대상에 대한 두려움이라는 뜻을 자연스럽게 살리되 반복 구조를 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다.
  alternatives_korean:
  - 야훼께서 말씀하십니다.
  - 여호와의 말씀이니라.
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 한국어에서 예언자적 선언을 나타내는 표지로 자연스럽게 옮겼습니다. 본 프로젝트의 통상 규범에 따라 신명은 야훼로 렌더링했습니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서 건져 내리기
  alternatives_korean:
  - 그의 손에서 구해 내리기
  - 그의 손아귀에서 건져 내리기
  lexicon: HALOT
  rationale: ‘손’은 권세와 통제의 비유이므로 관용을 유지했습니다. 뒤의 ‘구원하다’와 구별되도록 ‘건져 내리다’를 택했습니다.
theological_decisions:
- issue: 하나님의 임재와 구원 약속의 어조
  chosen_reading: 하나님이 함께 계신다는 약속을 명령의 근거로 분명히 드러내고, 직설적 위로를 살렸습니다.
  alternative_readings:
  - 함께하실 것이니
  - 동행하셔서
  rationale: 히브리어 כִּי אִתְּכֶם אָנִי가 두려움 금지의 근거를 제시하므로, ‘내가 당신들과 함께 있어’로 인과를 분명히 했습니다.
  doctrine_reference: Jer 42:11 문맥상 야훼의 보호와 구원 약속
