  text: 그는 가레아의 아들 요하난과, 그와 함께 있던 모든 군대 지휘관과, 낮은 사람부터 높은 사람까지 모든 백성을 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: Then he called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러 모았습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 호출이 아니라 여러 집단을 불러 모으는 행위이므로, 자연스러운 서술체로 ‘불렀습니다’가 가장 무난합니다.
- source_word: יוֹחָנָן
  english_pob_choice: Johanan
  chosen_korean: 여호하난
  alternatives_korean:
  - 요하난
  - 요한난
  lexicon: 표준 음역 관행
  rationale: 히브리어 고유명사 יוֹחָנָן을 한국어 음역으로 옮겼습니다. 기존 관행상 성경 인명으로 굳어진 형태가 없으므로 음가를 반영해 표기했습니다.
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: all the commanders of the forces
  chosen_korean: 군대의 모든 지휘관들
  alternatives_korean:
  - 군대의 모든 사령관들
  - 군사들의 모든 우두머리들
  lexicon: HALOT
  rationale: שָׂרִים는 ‘통치자들’보다 군사 문맥에서는 지휘관들이 적절하고, חֲיָלִים은 단순 병사보다 조직된 군대/병력을 가리키므로 ‘군대’로 옮겼습니다.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  english_pob_choice: from the least to the greatest
  chosen_korean: 가장 작은 자부터 가장 큰 자까지
  alternatives_korean:
  - 가장 작은 이부터 가장 큰 이까지
  - 가난한 자부터 부유한 자까지
  lexicon: HALOT
  rationale: 사회적 전 범위를 나타내는 관용구이므로, 영어 POB의 의미를 따라 ‘작은/큰’의 대조를 살리되 한국어에서 자연스럽게 이해되도록 표현했습니다.
theological_decisions:
- issue: 호명 대상의 총체성
  chosen_reading: ‘모든 백성—곧 가장 작은 자부터 가장 큰 자까지—’로 옮겨, 신분과 지위의 전 범위를 포괄하는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘백성 전체’
  - ‘낮은 자부터 높은 자까지’
  rationale: 히브리어 관용구는 단순한 인원 수가 아니라 공동체 전체를 포괄하는 효과를 가지므로, 계층적 범위를 분명히 드러내는 번역이 본문의 힘을 보존합니다.
  doctrine_reference: 본문 관찰(사회적 총체성)
