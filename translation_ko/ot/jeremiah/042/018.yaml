  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֣ה צְבָאוֹת֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ כַּ/אֲשֶׁר֩ נִתַּ֨ךְ אַפִּ֜/י וַ/חֲמָתִ֗/י עַל יֹֽשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם כֵּ֣ן תִּתַּ֤ךְ חֲמָתִ/י֙ עֲלֵי/כֶ֔ם בְּ/בֹאֲ/כֶ֖ם מִצְרָ֑יִם וִ/הְיִיתֶ֞ם לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/קְלָלָ֣ה וּ/לְ/חֶרְפָּ֔ה וְ/לֹֽא תִרְא֣וּ ע֔וֹד אֶת הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/042/018.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Just as my anger and my wrath were poured out on the inhabitants of Jerusalem, so my wrath will be poured out on you when you enter Egypt, and you will become an oath, a horror, a curse, and a reproach, and you will never again see this place.'
  footnotes:
  - marker: a
    text: Or 'an object of cursing' or 'a curse-oath'; the Hebrew term can refer to an oath that invokes a curse.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 내가 내 진노와 내 분노를 예루살렘 주민들에게 쏟아부은 것처럼, 너희가 이집트에 들어갈 때 내 분노도 너희에게 쏟아부어질 것입니다. 너희는 저주의 맹세가 되고, 공포가 되고, 저주가 되고, 수치가 될 것이며, 다시는 이곳을 보지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אָלָה는 저주를 불러오는 맹세를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값대로 야훼로 옮기고, צְבָאוֹת은 천상·지상의 군대를 포괄하는 칭호이므로 만군으로 옮겼습니다.
- source_word: נִתַּךְ ... תִּתַּךְ
  english_pob_choice: were poured out ... will be poured out
  chosen_korean: 쏟아부은 ... 쏟아부어질 것입니다
  alternatives_korean:
  - 부어졌습니다 ... 부어질 것입니다
  - 내려진 ... 내려질 것입니다
  lexicon: HALOT
  rationale: 심판이 액체처럼 ‘쏟아짐’이라는 은유를 살려 과거와 미래의 병행을 자연스럽게 보존했습니다.
- source_word: אַפִּי / חֲמָתִי
  english_pob_choice: my anger and my wrath
  chosen_korean: 내 진노와 내 분노
  alternatives_korean:
  - 내 노여움과 내 분노
  - 내 진노와 내 노여움
  lexicon: HALOT
  rationale: 두 동의어를 한국어에서도 서로 다른 강도의 표현으로 나누어, 겹쳐지는 심판의 강도를 유지했습니다.
- source_word: בְּבֹאֲכֶם מִצְרָיִם
  english_pob_choice: when you enter Egypt
  chosen_korean: 이집트에 들어갈 때
  alternatives_korean:
  - 이집트로 들어갈 때
  - 이집트에 갈 때
  lexicon: HALOT
  rationale: 전치사+부정사구의 시간적 용법을 ‘-할 때’로 풀되, מקור의 이동 동사를 살려 ‘들어갈 때’로 옮겼습니다.
- source_word: לְאָלָה וּלְשַׁמָּה וְלִקְלָלָה וּלְחֶרְפָּה
  english_pob_choice: an oath, a horror, a curse, and a reproach
  chosen_korean: 저주의 맹세가 되고, 공포가 되고, 저주가 되고, 수치가 될 것이며
  alternatives_korean:
  - 저주 맹세가 되고, 놀라움이 되고, 저주가 되고, 치욕이 될 것이며
  - 저주받는 대상이 되고, 공포가 되고, 저주가 되고, 수치가 될 것이며
  lexicon: HALOT
  rationale: אָלָה는 문맥상 단순한 ‘맹세’라기보다 저주를 불러오는 맹세이므로 ‘저주의 맹세’로 옮겨 주석의 의미를 본문에 반영했습니다. שַׁמָּה는 폐허의 대상이자 공포를 자아내는 상태를 함께 담아 ‘공포’로, חֶרְפָּה는 공개적 수치를 뜻해 ‘수치’로 옮겼습니다.
theological_decisions:
- issue: אָלָה의 의미를 ‘맹세’로 둘지 ‘저주받는 대상’으로 풀지
  chosen_reading: ‘저주의 맹세’로 두고, 나머지 सूची와 함께 심판의 공적 표지가 되게 했습니다.
  alternative_readings:
  - ‘저주받는 대상’
  - ‘저주의 말’
  rationale: 영문 POB가 본문에서 oath를 유지하면서 각주로 curse-oath 가능성을 열어 두었으므로, 한국어 본문도 오해를 줄이되 저주적 맹세의 뉘앙스를 함께 보존했습니다.
  doctrine_reference: Jer 42:18 lexical-theological note
- issue: ‘아래그’류의 전통적 교회어 대신 현대어 수치를 선택할지
  chosen_reading: ‘수치’
  alternative_readings:
  - 치욕
  - 모욕
  rationale: חֶרְפָּה는 공동체적 망신과 수치를 가리키므로, 현대 독자가 즉시 이해할 수 있는 ‘수치’를 택했습니다.
  doctrine_reference: Jer 42:18 rhetorical judgment language
