id: JER.1.12
reference: Jeremiah 1:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֵלַ֖/י הֵיטַ֣בְתָּ לִ/רְא֑וֹת כִּֽי שֹׁקֵ֥ד אֲנִ֛י עַל דְּבָרִ֖/י לַ/עֲשֹׂתֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/012.yaml
  text: Then Yahweh said to me[a], “You have seen well[c][b], for I am watching over my word to perform it.”
  footnotes:
  - marker: a
    text: The Hebrew uses a wordplay between the 'almond' branch in the previous verse (שָׁקֵד, shaqed) and 'watching' here (שֹׁקֵד, shoqed).
    reason: lexical_alternative
  - marker: b
    text: Or 'You have seen correctly' / 'You have seen rightly.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to perform it' or 'to carry it out.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 제게 말씀하셨습니다. “네가 잘 보았구나. 이는 내가 내 말을 이루기까지 지켜보고 있기 때문이다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞절의 ‘아몬드’(שָׁקֵד)와 여기의 ‘지켜보다’(שֹׁקֵד) 사이에 말장난을 이룹니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정확히 보았다’ / ‘올바르게 보았다’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이루다’ / ‘수행하다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유한 신명사 טetragrammaton을 관습적 대체어로 바꾸지 않고, POB 기준에 따라 음역형 ‘야훼’를 사용했습니다.
- source_word: הֵיטַבְתָּ לִרְאוֹת
  english_pob_choice: You have seen well
  chosen_korean: 네가 잘 보았구나
  alternatives_korean:
  - 네가 올바르게 보았구나
  - 네가 정확히 보았구나
  lexicon: HALOT
  rationale: 히브리어의 ‘잘/좋게 + 보다’ 관용구를 자연스러운 한국어로 옮기되, 단순히 ‘맞게’로 축소하지 않고 시각적 판정의 의미를 살렸습니다.
- source_word: שֹׁקֵד
  english_pob_choice: watching over
  chosen_korean: 지켜보고 있기
  alternatives_korean:
  - 깨어 지켜보고 있기
  - 감찰하고 있기
  lexicon: HALOT
  rationale: 문맥상 ‘깨어 있음/주의 깊게 지켜봄’의 뜻을 살려 ‘지켜보고 있다’로 옮겼으며, 직전 절의 שָׁקֵד/שֹׁקֵד 말장난은 한국어에서 완전 재현하기 어려워 과도한 인공어를 피했습니다.
- source_word: דְּבָרִי
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 언약의 말씀
  - 내 말들
  lexicon: HALOT
  rationale: 예언적 맥락의 דָּבָר는 단순한 ‘말’보다 넓지만, 한국어에서 하나님이 선포하신 내용을 자연스럽게 가리키는 표현으로 ‘내 말’을 택해 ‘말씀’의 교회적 고정 어감을 피했습니다.
theological_decisions:
- issue: לַעֲשֹׂתוֹ의 목적/결과 의미
  chosen_reading: ‘이루기까지’로 목적성을 드러내고, 뒤에 ‘지켜보고 있기 때문이다’로 동작의 지속성을 살렸습니다.
  alternative_readings:
  - 그것을 행하기 위해
  - 그것을 수행하기 위해
  rationale: 히브리어는 단순 행위보다 ‘말씀이 실제로 성취되게 함’의 뉘앙스를 가지므로, 한국어에서도 단지 실행이 아니라 성취 완료를 향한 지속적 감시를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
