  rationale: 문법적으로 충돌하는 도입부를 원문의 예언 공식에 맞게 고치고, סִיר의 의미에 맞는 ‘솥’을 사용했습니다. 어려운 방향 표현은 한국어에서 이해 가능한 환상 이미지로 옮겼으며, 본문만으로 정확한 공간 관계를 확정하지 않도록 각주에서 문자적 표현과 해석상의 불확실성을 명시했습니다.
