  source_fidelity: ‘야훼의 말씀이 … 임하여 말씀하셨습니다’는 ‘말씀’이 주어인 문장과 존대 발화 동사가 충돌합니다. 또한 ‘가마’는 סִיר의 일반적인 조리 용기보다 가마(窯)의 뜻이 강하며, ‘그것의 얼굴이 북쪽에서 옵니다’는 한국어로 자연스럽지 않고 원문의 공간적 표현을 잘 전달하지 못합니다. ‘북쪽에서부터 기울어져 있습니다’는 원문의 ‘북쪽으로부터’라는 연관을 유지하면서 환상의 용기 방향을 한국어로 표현합니다. 다만 정확한 기하학은 불확실하므로 각주에서 직역과 불확실성을 밝혔습니다.
  naturalness: 현대 표준어 합쇼체 서술로 ‘임했습니다’, ‘대답했습니다’, ‘봅니다’를 사용했습니다. 직접 인용문의 ‘네가 무엇을 보느냐?’는 예언서의 문체에 자연스러운 높임 없는 질문으로 유지했습니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로, דְבַר יְהוָה는 예언 공식에 맞게 ‘야훼의 말씀’으로 옮겼습니다. סִיר는 ‘솥’으로, נָפוּחַ는 끓어오르는 모습으로 옮기고 불어 끓게 하는 뉘앙스는 각주에 남겼습니다.
