  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
  footnotes:
  - marker: a
    text: Or “a seething pot”; the Hebrew participle can suggest a pot being blown upon or fanned into a boil.
    reason: lexical_alternative
  - marker: b
    text: Literally “its face is from the face of the north.” The expression likely refers to the pot’s exposed side or opening being oriented with reference to the north.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀이 내게 두 번째로 임하여 말씀하셨습니다. “네가 무엇을 보느냐?” 내가 대답하였습니다. “나는 끓는 가마를 봅니다. 그것의 얼굴이 북쪽에서 옵니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘끓는’ 또는 ‘부푼/날려 끓게 된’ 정도를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그것의 얼굴이 북쪽의 얼굴로부터”입니다. 여기서는 방향 관계를 보존해 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  lexicon: HALOT
  rationale: 예언 공식인 דְבַר יְהוָה를 한국어에서도 관용적으로 ‘말씀’으로 옮겨, 형식성과 상징성을 함께 유지했습니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 또 한 번
  lexicon: HALOT
  rationale: 단순한 재발이 아니라 순서를 표시하므로, ‘두 번째로’가 가장 정확합니다.
- source_word: סִיר נָפוּחַ
  english_pob_choice: a boiling pot
  chosen_korean: 끓는 가마
  alternatives_korean:
  - 끓고 있는 냄비
  - 달아오른 가마솥
  lexicon: HALOT
  rationale: סִיר은 주방용 그릇보다 큰 조리 용기를 가리킬 수 있어 ‘가마’가 이미지와 규모를 더 잘 살립니다.
- source_word: וּפָנָיו מִפְּנֵי צָפוֹנָה
  english_pob_choice: its face is from the north
  chosen_korean: 그것의 얼굴이 북쪽에서 옵니다
  alternatives_korean:
  - 그것의 얼굴이 북쪽을 향합니다
  - 그것의 앞면이 북쪽에서 있습니다
  lexicon: HALOT
  rationale: פָּנִים을 직역한 ‘얼굴’을 유지해 히브리어 이미지를 살리고, 방향 표현도 원문의 공간적 긴장을 보존했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 규정에 따라 신명은 ‘야훼’로 옮겨, 예언서의 신적 발화를 직접적으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
- issue: 북쪽 방향 표현의 모호성 보존
  chosen_reading: 북쪽에서 옵니다
  alternative_readings:
  - 북쪽을 향합니다
  - 북쪽으로부터 보입니다
  rationale: 원문은 가마의 정확한 기하학을 해명하기보다 북쪽과의 연관성을 제시하므로, 과도하게 정리하지 않고 모호성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
