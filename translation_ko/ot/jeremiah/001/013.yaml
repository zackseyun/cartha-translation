source:
  edition: WLC
  text: וַ/יְהִ֨י דְבַר יְהוָ֤ה אֵלַ/י֙ שֵׁנִ֣ית לֵ/אמֹ֔ר מָ֥ה אַתָּ֖ה רֹאֶ֑ה וָ/אֹמַ֗ר סִ֤יר נָפ֨וּחַ֙ אֲנִ֣י רֹאֶ֔ה וּ/פָנָ֖י/ו מִ/פְּנֵ֥י צָפֽוֹנָ/ה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/013.yaml
  text: And the word of Yahweh came to me a second time[a], saying, “What do you see?” And I said, “I see a boiling pot[b], and its face is from the north.”
  footnotes:
  - marker: a
    text: Or “a seething pot”; the Hebrew participle can suggest a pot being blown upon or fanned into a boil.
    reason: lexical_alternative
  - marker: b
    text: Literally “its face is from the face of the north.” The expression likely refers to the pot’s exposed side or opening being oriented with reference to the north.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 말씀이 두 번째로 내게 임했습니다. “네가 무엇을 보느냐?” 내가 대답했습니다. “저는 끓어오르는 솥을 봅니다.[a] 그 앞면은 북쪽에서부터 기울어져 있습니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “펄펄 끓는 솥.” 히브리어는 불을 불어 넣거나 부채질하여 끓게 한 상태를 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “그 앞면은 북쪽의 앞면으로부터 [있다]”입니다. 이 표현은 솥의 드러난 면이나 아가리가 북쪽과 어떤 관계에 놓여 있음을 가리키지만, 정확한 방향이나 기울기는 불확실합니다.
    reason: alternative_reading
