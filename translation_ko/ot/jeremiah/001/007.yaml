source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אַל תֹּאמַ֖ר נַ֣עַר אָנֹ֑כִי כִּ֠י עַֽל כָּל אֲשֶׁ֤ר אֶֽשְׁלָחֲ/ךָ֙ תֵּלֵ֔ךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר אֲצַוְּ/ךָ֖ תְּדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/007.yaml
  text: But Yahweh said to me[a], “Do not say, ‘I am a youth,’ for to all to whom I send you, you shall go, and all that I command you[b], you shall speak.”
  footnotes:
  - marker: a
    text: Or “I am a young man,” “I am a boy.” The Hebrew נַעַר can denote a range of youthfulness or inexperience.
    reason: lexical_alternative
  - marker: b
    text: Or “wherever I send you, you shall go.” The Hebrew expression can be understood more generally of every destination or assignment to which the LORD sends Jeremiah.
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 야훼께서 제게 말씀하셨습니다. “‘나는 아직 젊습니다’라고 말하지 마라. 내가 너를 보내는 곳마다 너는 가야 하고, 내가 너에게 명하는 것은 모두 너는 말해야 한다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젊습니다’는 히브리어 נַעַר의 넓은 의미 범위 가운데, 여기서 예레미야가 스스로를 미숙하고 어린 처지로 낮추는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘곳마다’는 직역보다 자연스럽게 풀어 옮긴 것으로, 히브리어 표현은 ‘내가 보내는 모든 대상/장소’까지 포괄할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: WLC
  rationale: 본문의 여호와 이름을 일반 대체어가 아니라 고유한 신명으로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 따랐습니다.
- source_word: נַעַר
  english_pob_choice: youth
  chosen_korean: 젊습니다
  alternatives_korean:
  - 어립니다
  - 청년입니다
  - 소년입니다
  lexicon: HALOT
  rationale: 문맥상 연령 자체보다 미숙함과 젊음을 함께 드러내는 표현이어서, 합쇼체 내부 발화로 자연스럽게 ‘젊습니다’로 옮겼습니다.
- source_word: אֲשֶׁר אֶשְׁלָחֲךָ / תֵּלֵךְ
  english_pob_choice: to all to whom I send you, you shall go
  chosen_korean: 내가 너를 보내는 곳마다 너는 가야 하고
  alternatives_korean:
  - 내가 너를 보내는 모든 곳에 너는 가야 하고
  - 내가 너를 보내는 모든 이에게 너는 가야 하고
  lexicon: HALOT
  rationale: 히브리어의 범위 표현을 한국어에서 가장 자연스럽게 풀어, 파견되는 장소·임무의 포괄성을 유지했습니다.
- source_word: אֲצַוְּךָ / תְּדַבֵּר
  english_pob_choice: all that I command you, you shall speak
  chosen_korean: 내가 너에게 명하는 것은 모두 너는 말해야 한다
  alternatives_korean:
  - 내가 너에게 명하는 모든 것을 너는 말해야 한다
  - 내가 너에게 명하는 것은 모두 너는 전해야 한다
  lexicon: HALOT
  rationale: ‘명하다’의 명령성을 살리고, דבר의 기본 의미를 따라 ‘말하다’를 유지했습니다. ‘전하다’는 해석을 덧씌울 수 있어 피했습니다.
- source_word: אַל תֹּאמַר
  english_pob_choice: Do not say
  chosen_korean: ‘…라고 말하지 마라’
  alternatives_korean:
  - ‘…라고 하지 마라’
  - ‘…라고 말해서는 안 된다’
  lexicon: HALOT
  rationale: 직접화법 안의 부정을 한국어 관용에 맞게 처리해, 자기 규정적 발화를 금하는 뉘앙스를 분명히 했습니다.
theological_decisions:
- issue: 직접 인용 안에서의 화자 등록
  chosen_reading: 하나님의 직접 말씀을 현대 문어체 합쇼체로 유지하되, 인용 안의 금지명령은 반말 명령형 ‘말하지 마라’로 두었습니다.
  alternative_readings:
  - 인용 전체를 합쇼체로 평준화
  - ‘말해서는 안 됩니다’로 완화
  rationale: 예레미야를 향한 신적 명령의 직설성과 긴박성을 보존하기 위해, 한국어에서도 인용 내부의 명령형을 직접적이고 강하게 유지했습니다.
  doctrine_reference: Narrative speech register / divine direct address
- issue: ‘내가 너를 보내는 곳마다’의 범위 표현
  chosen_reading: 지명된 장소와 사역 범위를 포괄하는 것으로 읽고, ‘곳마다’로 옮겼습니다.
  alternative_readings:
  - ‘어디로든지’
  - ‘내가 보내는 모든 곳’
  rationale: 히브리어 전치사구의 기능은 특정 지점 나열보다 파견의 총체성을 나타내므로, 한국어에서 가장 응축된 포괄 표현을 선택했습니다.
  doctrine_reference: Source semantic range
