  lexicon: WLC; HALOT
  rationale: 히브리어 직설 질문을 자연스러운 한국어로 옮기되, 소명 장면의 직접성과 호명 효과를 살리기 위해 이름을 두 번 부르는 형태로 처리했습니다.
- source_word: מַקֵּל שָׁקֵד
  english_pob_choice: a branch of an almond tree
  chosen_korean: 아몬드나무 가지
  alternatives_korean:
  - 아몬드나무 막대기
