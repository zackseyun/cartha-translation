  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
  footnotes:
  - marker: a
    text: Or “a rod of almond wood.” The Hebrew may denote a staff/rod as well as a branch; the vision's wordplay continues in the next verse between “almond” (shaqed) and “watching” (shoqed).
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀이 제게 임하여 이르셨습니다. “예레미야, 무엇을 보고 있습니까?” 제가 대답했습니다. “저는 아몬드나무 가지를 보고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아몬드나무 막대기”로 옮길 수 있습니다. 히브리어는 지팡이 또는 막대기를 가리킬 수도 있고 가지를 가리킬 수도 있습니다. 다음 절에서는 “아몬드”(샤케드)와 “깨어 살피는”(쇼케드) 사이의 말장난이 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
