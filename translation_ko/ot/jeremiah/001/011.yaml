  lexicon: HALOT
  rationale: מַקֵּל은 문맥상 나무에서 나온 가지/지팡이 둘 다 가능하지만, 환상 속 사물의 자연스러운 형상을 우선해 ‘가지’로 옮겼습니다. ‘아몬드나무’는 이어지는 말장난(שָׁקֵד/שֹׁקֵד)을 준비합니다.
