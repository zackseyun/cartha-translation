  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֤י דְבַר יְהוָה֙ אֵלַ֣/י לֵ/אמֹ֔ר מָה אַתָּ֥ה רֹאֶ֖ה יִרְמְיָ֑הוּ וָ/אֹמַ֕ר מַקֵּ֥ל שָׁקֵ֖ד אֲנִ֥י רֹאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/011.yaml
  text: And the word of Yahweh came to me[a], saying, “What do you see, Jeremiah?” And I said, “I see a branch of an almond tree.”
  footnotes:
  - marker: a
    text: Or “a rod of almond wood.” The Hebrew may denote a staff/rod as well as a branch; the vision's wordplay continues in the next verse between “almond” (shaqed) and “watching” (shoqed).
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀이 제게 임하여 말씀하셨습니다. “예레미야야, 무엇을 보느냐?” 제가 대답했습니다. “저는 아몬드나무 가지를 보고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아몬드나무 막대기”로도 옮길 수 있습니다. 히브리어는 지팡이/막대기뿐 아니라 가지를 가리킬 수도 있으며, 다음 절에서 “아몬드”(shaqed)와 “깨어 살피는”(shoqed) 사이의 말장난이 이어집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי דְבַר יְהוָה אֵלַי
  english_pob_choice: And the word of Yahweh came to me
  chosen_korean: 야훼의 말씀이 제게 임하여
  alternatives_korean:
  - 야훼의 말씀이 제게 왔습니다
  - 야훼의 말씀이 저에게 있었습니다
  lexicon: WLC; HALOT
  rationale: 예언자 소명/계시 공식인 ‘말씀이 …에게 임하다’를 살려, מקור의 서술적 전개와 계시 개시 감각을 함께 보존했습니다.
- source_word: מָה אַתָּה רֹאֶה יִרְמְיָהוּ
  english_pob_choice: What do you see, Jeremiah?
  chosen_korean: “예레미야야, 무엇을 보느냐?”
  alternatives_korean:
  - “예레미야야, 네가 무엇을 보느냐?”
  - “예레미야야, 무엇을 보고 있느냐?”
  lexicon: WLC; HALOT
  rationale: 히브리어 직설 질문을 자연스러운 한국어로 옮기되, 소명 장면의 직접성과 호명 효과를 살리기 위해 이름을 두 번 부르는 형태로 처리했습니다.
- source_word: מַקֵּל שָׁקֵד
  english_pob_choice: a branch of an almond tree
  chosen_korean: 아몬드나무 가지
  alternatives_korean:
  - 아몬드나무 막대기
  - 아몬드나무 몽둥이
  lexicon: HALOT
  rationale: מַקֵּל은 문맥상 나무에서 나온 가지/지팡이 둘 다 가능하지만, 환상 속 사물의 자연스러운 형상을 우선해 ‘가지’로 옮겼습니다. ‘아몬드나무’는 이어지는 말장난(שָׁקֵד/שֹׁקֵד)을 준비합니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접적으로 언약 სახელ인 יהוה를 쓰므로, 칭호인 ‘주님’ 대신 고유명사 ‘야훼’를 사용해 원문 식별성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
