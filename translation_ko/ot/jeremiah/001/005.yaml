translation:
  language: ko
  text: 내가 너를 모태에서 빚기 전에 너를 알았고[a], 네가 태에서 나오기 전에 너를 거룩하게 구별하였으며[b], 너를 여러 민족에게 예언자로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너를 알았다’는 개인적인 돌봄이나 선택의 뜻을 내포할 수도 있으나, 본문은 더 넓은 표현을 그대로 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “너를 성별하였다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  english_pob_choice: Before
  chosen_korean: ~하기 전에
  alternatives_korean:
  - 이전에
  - ~보다 먼저
  lexicon: HALOT
  rationale: 시간 순서를 자연스럽게 나타내면서 히브리어의 선행 관계를 그대로 보존합니다.
- source_word: אצור/ך בַּבֶּטֶן
  english_pob_choice: I formed you in the womb
  chosen_korean: 배 속에 짓기 전에
  alternatives_korean:
  - 태중에 만들기 전에
  - 배 속에서 빚기 전에
  lexicon: HALOT
  rationale: יצר의 구체적 형상화 이미지를 살리기 위해 '짓다'를 택했고, בטן은 임신 전후 문맥에서 자연스러운 '배 속'으로 옮겼습니다.
- source_word: יְדַעְתִּיךָ
  english_pob_choice: I knew you
  chosen_korean: 너를 알았고
  alternatives_korean:
  - 너를 선택했고
  - 너를 인정했고
  lexicon: HALOT
  rationale: ידע의 기본 의미를 유지하여, 본문이 지닌 관계적·선택적 함의를 한국어 본문에서 미리 좁히지 않도록 했습니다.
- source_word: הִקְדַּשְׁתִּיךָ
  english_pob_choice: I set you apart
  chosen_korean: 구별하여 거룩하게 하였으며
  alternatives_korean:
  - 성별하였으며
  - 거룩하게 구별하였으며
  lexicon: HALOT
  rationale: קדש의 성별/성화 의미를 함께 드러내되, 현대 한국어에서 지나치게 제의적이거나 낯선 표현을 피하면서도 'set apart'의 목적을 분명히 했습니다.
- source_word: נָבִיא לַגּוֹיִם
  english_pob_choice: a prophet to the nations
  chosen_korean: 여러 민족을 위한 예언자로
  alternatives_korean:
  - 민족들에게 예언자로
  - 열방을 향한 예언자로
  lexicon: HALOT
  rationale: גוים의 범위를 '여러 민족'으로 풀어, 유다를 넘어서는 대상 범위를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ידעתיך의 의미를 '알다'로 유지할지, '선택하다'로 명시할지
  chosen_reading: 본문에는 '너를 알았고'를 유지했습니다.
  alternative_readings:
  - 너를 선택했고
  - 너를 택했고
  rationale: 히브리어 ידע는 관계적 앎과 선택의 뉘앙스를 모두 가질 수 있으므로, 신학적 해석을 본문 자체에서 과도하게 확정하지 않고 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
- issue: הִקְדַּשְׁתִּיךָ의 번역을 '거룩하게 하다'로 할지 '구별하다'로 할지
  chosen_reading: '''구별하여 거룩하게 하였다''로 두 요소를 함께 살렸습니다.'
  alternative_readings:
  - 너를 구별하였다
  - 너를 거룩하게 하였다
  rationale: קדש에는 성별과 거룩하게 함의 두 측면이 함께 있으므로, 한쪽만 택하면 의미가 줄어들 수 있어 병렬적으로 표현했습니다.
  doctrine_reference: Translation philosophy §3 Preserve theological tension rather than resolve it
