- from: 그러나 나는 오늘 너를 견고한 성읍과 쇠기둥과 놋성벽으로 세워, 온 땅—유다의 왕들과 그 지도자들과 그 제사장들과 그 땅의 백성에게—맞서게 하겠다.[a]
  to: 보십시오, 내가 오늘 너를 온 땅, 곧 유다의 왕들과 그 관리들과 그 제사장들과 그 땅의 백성에 맞서는 견고한 성읍과 쇠기둥과 놋 성벽으로 세웠습니다.[a]
  rationale: 원문의 강조 표지 ‘보십시오’를 복원하고, ‘그리고/그러나 나는’의 선택은 한국어 문장 안에서 과도한 접속 표지 없이 화자 ‘내가’로 자연스럽게 반영했습니다. 완료형은 ‘세웠습니다’로 유지했으며, ‘온 땅’과 뒤따르는 유다의 왕들·관리들·제사장들·백성이 대항 대상임을 ‘곧’과 ‘맞서는’으로 명확히 했습니다. 금속 및 방어 구조물의 복수·병렬 비유는 그대로 보존했습니다.
