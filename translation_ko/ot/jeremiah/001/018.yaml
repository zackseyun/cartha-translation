reference: Jeremiah 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נְתַתִּ֣י/ךָ הַ/יּ֗וֹם לְ/עִ֨יר מִבְצָ֜ר וּ/לְ/עַמּ֥וּד בַּרְזֶ֛ל וּ/לְ/חֹמ֥וֹת נְחֹ֖שֶׁת עַל כָּל הָ/אָ֑רֶץ לְ/מַלְכֵ֤י יְהוּדָה֙ לְ/שָׂרֶ֔י/הָ לְ/כֹהֲנֶ֖י/הָ וּ/לְ/עַ֥ם הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/018.yaml
  text: And I—behold[a], I have made you today a fortified city, an iron pillar, and bronze walls against the whole land—against the kings of Judah, its officials, its priests[b], and the people of the land.
  footnotes:
  - marker: a
    text: Or 'I have set you today as a fortified city.' The Hebrew verb literally means 'given/set,' but here carries the sense of appointing or making Jeremiah into a fortified presence.
    reason: lexical_alternative
  - marker: b
    text: '''The people of the land'' can in some contexts mean the common people in contrast to rulers, but here it may also function more broadly for the populace as a whole.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 오늘 너를 온 땅, 곧 유다의 왕들과 그 관리들과 그 제사장들과 그 땅의 백성에 맞서는 견고한 성읍과 쇠기둥과 놋 성벽으로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘주다/두다’라는 동사는 여기서 이어지는 표현들과 함께 예레미야를 견고한 방어물과 같은 존재로 세우거나 임명하셨다는 뜻을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 그리고 나는
  - 나는
  lexicon: HALOT
  rationale: 문맥상 예레미야에 대한 소명 선언을 시작하는 대조적 전환이므로, 단순 접속보다 ‘그러나’가 앞선 부르심과 현재의 위임 사이의 긴장을 더 분명히 드러냅니다.
- source_word: נְתַתִּיךָ
  english_pob_choice: I have made you
  chosen_korean: 너를 … 세워
  alternatives_korean:
  - 너를 … 만들었다
  - 너에게 … 주었다
  lexicon: HALOT
  rationale: נתן은 직역상 ‘주다/두다’이지만, 이어지는 ל- 구문과 함께 예레미야를 상징적 존재로 ‘세우는’ 의미가 자연스럽고, 한국어에서도 기능적 대응이 가장 선명합니다.
- source_word: לְעִיר מִבְצָר
  english_pob_choice: a fortified city
  chosen_korean: 견고한 성읍
  alternatives_korean:
  - 요새화된 성읍
  - 방어된 성읍
  lexicon: HALOT
  rationale: מִבְצָר의 방어적·요새적 이미지를 살리면서도 한국어 성경 문체에서 자연스러운 표현으로 ‘견고한 성읍’을 택했습니다.
- source_word: וּלְעַמּוּד בַּרְזֶל
  english_pob_choice: an iron pillar
  chosen_korean: 쇠기둥
  alternatives_korean:
  - 철기둥
  - 철로 된 기둥
  lexicon: HALOT
  rationale: ‘쇠’는 고전적이면서도 현대 한국어에서 강도 높은 금속 이미지를 자연스럽게 전달하며, 상징적 견고함을 간결하게 보존합니다.
- source_word: וּלְחֹמוֹת נְחֹשֶׁת
  english_pob_choice: bronze walls
  chosen_korean: 놋성벽
  alternatives_korean:
  - 청동 성벽
  - 놋벽
  lexicon: HALOT
  rationale: נְחֹשֶׁת는 문맥상 ‘놋/청동’이 가능하나, 한국어 성경 전통의 금속 이미지와 본문의 병렬성을 살려 ‘놋성벽’으로 옮겼습니다.
- source_word: עַל כָּל הָאָרֶץ
  english_pob_choice: against the whole land
  chosen_korean: 온 땅—…—맞서게 하겠다
  alternatives_korean:
  - 온 땅에
  - 온 땅을 향해
  lexicon: HALOT
  rationale: עַל은 여기서 단순 위치보다 대항의 뜻을 가지므로 ‘맞서게 하겠다’로 풀어 문맥적 적대 관계를 드러냈습니다. ‘땅’은 이어지는 유다의 통치자·제사장·백성에 의해 유다 지역을 가리키는 것으로 이해했습니다.
- source_word: שָׂרֶיהָ
  english_pob_choice: its officials
  chosen_korean: 그 지도자들
  alternatives_korean:
  - 그 방백들
  - 그 관리들
  lexicon: HALOT
  rationale: שָׂרִים는 통치 엘리트를 가리키므로, 현대 독자에게 의미가 분명한 ‘지도자들’을 택하되 위계적·행정적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 예레미야의 ‘성읍/기둥/성벽’ 비유를 어떻게 보존할 것인가
  chosen_reading: 예레미야 자신을 방어적 상징물로 ‘세워’ 주시는 하나님의 위임으로 옮겼습니다.
  alternative_readings:
  - 예레미야를 요새로 ‘만들어’ 주겠다
  - 예레미야를 성읍처럼 두겠다
  rationale: 원문은 인격을 요새 이미지로 재구성하는 강한 소명 선언이므로, 한국어에서도 이 은유를 약화하지 않고 유지하는 것이 신학적·수사적으로 중요합니다.
  doctrine_reference: 예언자 소명과 하나님의 주권적 위임
