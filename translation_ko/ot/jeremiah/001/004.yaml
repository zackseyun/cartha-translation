    reason: ot_citation
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now ... came
  chosen_korean: 이제 ... 임하여
  alternatives_korean:
  - 그리고 ... 이르러
  - 그때 ... 임하여
  - 일어났습니다
  lexicon: HALOT
  rationale: 서두의 וַיְהִי는 서술 전환을 여는 관용식이므로, 한국어에서는 자연스러운 담화 전환 표지인 “이제”와 도착·도래의 동작성을 살린 “임하여”로 옮겼습니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 공식 דְבַר יְהוָה는 단순한 정보가 아니라 계시로 주어지는 하나님의 말씀을 가리키므로, 한국어 관용과 문맥을 함께 살려 “말씀”으로 번역했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사 YHWH를 전통적 호칭인 “주”로 바꾸지 않고, 프로젝트 기본값에 따라 고유명적 표기인 “야훼”를 사용해 원문의 인칭성과 언약명을 보존했습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 제게
  lexicon: HALOT
  rationale: 1인칭 단수 여격은 현대 한국어에서 가장 자연스럽고 문체에 맞는 “내게”로 옮겨, 예언자에게 직접 임한 계시의 방향성을 분명히 했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하며
  lexicon: HALOT
  rationale: 히브리어의 לֵאמֹר는 뒤따르는 직접 인용을 여는 공식을 이루므로, 한국어에서는 반복을 줄이면서도 발화 도입 기능을 살리는 “말씀하셨습니다”로 처리했습니다.
theological_decisions:
- issue: 예언 공식에서 하나님의 이름을 어떻게 드러낼 것인가
  chosen_reading: “야훼”를 본문에 직접 두어, 예언자에게 임한 말씀이 특정한 언약의 하나님에게서 온 것임을 드러냈습니다.
  alternative_readings:
  - “주님”으로 바꾸어 전통 교회 용례를 따르는 읽기
  - “하나님의 말씀이”로 일반화하는 읽기
  rationale: 원문은 일반적 신적 발화가 아니라 YHWH의 직접적 말씀을 표지하는 공식을 사용하므로, 이름을 가리거나 일반화하면 본문의 계시적·언약적 뉘앙스가 약해집니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
