id: JER.1.10
reference: Jeremiah 1:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רְאֵ֞ה הִפְקַדְתִּ֣י/ךָ הַ/יּ֣וֹם הַ/זֶּ֗ה עַל הַ/גּוֹיִם֙ וְ/עַל הַ/מַּמְלָכ֔וֹת לִ/נְת֥וֹשׁ וְ/לִ/נְת֖וֹץ וּ/לְ/הַאֲבִ֣יד וְ/לַ/הֲר֑וֹס לִ/בְנ֖וֹת וְ/לִ/נְטֽוֹעַ׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/010.yaml
  text: See[a], today I have appointed you over the nations and over the kingdoms, to uproot and to tear down, and to destroy and to demolish[c][b], to build and to plant.
  footnotes:
  - marker: a
    text: Or 'this day.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to pluck up.'
    reason: lexical_alternative
  - marker: c
    text: The phrase 'over nations and over kingdoms' refers to Jeremiah's prophetic commission concerning them, not to direct political rule.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 오늘 내가 당신을 여러 민족과 여러 왕국 위에 세워서, 뿌리 뽑고 무너뜨리며, 파괴하고 허물고, 세우며 심게 하였습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이날.’
    reason: alternative_reading
  - marker: b
    text: 또는 ‘뿌리째 뽑다.’
    reason: lexical_alternative
  - marker: c
    text: ‘여러 민족과 여러 왕국 위에’는 예레미야의 예언적 사명을 가리키며, 직접적인 정치 통치를 뜻하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: רְאֵה
  english_pob_choice: See
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 예언자에게 주의를 환기하는 명령형으로 이해하여, 현대 합쇼체에서 직접성과 공손함을 함께 살릴 수 있는 ‘보십시오’를 택했습니다.
- source_word: הִפְקַדְתִּיךָ
  english_pob_choice: I have appointed you
  chosen_korean: 당신을 ... 위에 세워서
  alternatives_korean:
  - 당신을 ... 위에 임명해서
  - 당신을 ... 위에 맡겨서
  lexicon: HALOT
  rationale: פקד의 위임·임명 의미를 살리되, 한국어에서는 ‘세우다’가 직분 부여와 책임 부여를 자연스럽게 드러내므로 이 표현을 사용했습니다.
- source_word: לִנְתוֹשׁ / לִנְתּוֹץ / וּלְהַאֲבִיד / וְלַהֲרוֹס
  english_pob_choice: to uproot / to tear down / to destroy / to demolish
  chosen_korean: 뿌리 뽑고 무너뜨리며, 파괴하고 허물고
  alternatives_korean:
  - 뽑아내고 허물며, 멸하고 헐고
  - 뿌리째 뽑고 부수며, 멸망시키고 전복하고
  lexicon: HALOT
  rationale: 네 개의 파괴 동사를 가능한 한 구분해 살렸습니다. 특히 הַהֲרֹס는 앞의 ‘무너뜨리다’와 겹치지 않도록 ‘허물다’로 옮겨 누적적 강도를 유지했습니다.
- source_word: לִבְנוֹת וְלִנְטוֹעַ
  english_pob_choice: to build and to plant
  chosen_korean: 세우며 심게
  alternatives_korean:
  - 건축하며 심게
  - 짓고 심게
  lexicon: HALOT
  rationale: 파괴 동사군과 대응하는 회복의 농경·건축 이미지를 살려, ‘세우다 / 심다’로 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: ‘여러 민족과 여러 왕국 위에’의 의미
  chosen_reading: 예레미야가 그 위에 직접 정치 권력을 행사한다는 뜻이 아니라, 그들을 향한 예언적 사명과 선포의 권위를 받은 것으로 읽었습니다.
  alternative_readings:
  - 그 민족들과 왕국들을 대적하여
  - 그 민족들과 왕국들에 대하여
  rationale: 히브리어 עַל + פקד는 이 문맥에서 통치권보다 위임받은 관할/사명을 가리키는 것이 자연스럽습니다. 따라서 문장의 힘은 유지하되 정치적 지배로 오해되지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §3
