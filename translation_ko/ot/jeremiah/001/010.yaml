    rationale: 각주 b는 לִנְתוֹשׁ(‘뿌리 뽑다’)의 대안인데 현재 문장 끝의 ‘허물고’ 뒤에 붙어 있습니다. 해당 표현 바로 뒤로 옮겨야 합니다.
