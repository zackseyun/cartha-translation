revisions:
- from: 요시야의 아들 유다 왕 여호야김 시대부터, 요시야의 아들 유다 왕 시드기야의 제십일 년이 끝날 때까지, 곧 예루살렘이 다섯째 달에 포로로 잡혀 갈 때까지였습니다.[a]
  to: 그 말씀은 요시야의 아들 유다 왕 여호야김 시대부터 요시야의 아들 유다 왕 시드기야 제십일 년이 끝날 때까지, 곧 예루살렘 주민이 포로로 끌려가던 다섯째 달까지 계속되었습니다.[a]
  rationale: 앞 절에서 언급된 ‘여호와의 말씀’을 가리키는 ‘그 말씀’을 보충하여 וַיְהִי의 문맥상 연속성을 한국어에서 명확히 했습니다. 두 ‘עד’의 시간적 종점을 ‘…부터 …까지, 곧 …까지’로 보존했습니다. 예루살렘의 포로됨이라는 원문의 지명 환유는 본문에서 주민을 명시하고 각주로 직역을 제시하여, 역사적 의미를 분명히 하면서도 원문의 표현을 투명하게 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:43Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 두 왕의 재위 기간과 다섯째 달의 예루살렘 포로됨을 대체로 충실히 옮겼습니다. 그러나 문두의 וַיְהִי가 앞 절의 ‘여호와의 말씀’을 이어 받는 기능이 한국어 본문에서 지나치게 소거되어, 단독으로 읽을 때 무엇이 ‘있었습니다’인지 불분명합니다. 또한 ‘예루살렘이 포로로 잡혀 가다’는 도시 자체가 포로가 되는 듯한 표현이므로, 히브리어의 지명 환유를 한국어에서 명료하게 처리할 필요가 있습니다.
  naturalness: ‘…시대부터 …때까지였습니다’는 문법상 가능하지만 주어가 빠져 문장이 불완전하게 들립니다. ‘그 말씀은 … 계속되었습니다’는 앞 절과의 연결 및 현대 한국어의 자연스러움을 함께 살립니다. ‘제십일 년’과 ‘다섯째 달’은 격식 있는 성경 문체로 자연스럽습니다.
  terminology: 여호야김, 시드기야, 유다, 예루살렘의 표기는 표준적인 성경 고유명사 표기입니다. גְּלוֹת의 역사적 의미는 ‘예루살렘 주민이 포로로 끌려감’으로 옮기되, 지명 환유에 관한 짧은 각주를 두어 원문의 표현을 확인할 수 있게 했습니다.
