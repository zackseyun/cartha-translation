base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/003.yaml
  text: And it continued in the days of Jehoiakim son of Josiah[a], king of Judah, until the completion of the eleventh year of Zedekiah son of Josiah, king of Judah[b], until the exile of Jerusalem in the fifth month.
  footnotes:
  - marker: a
    text: Or 'until the end of the eleventh year of Zedekiah son of Josiah, king of Judah.'
    reason: lexical_alternative
  - marker: b
    text: That is, the deportation of Jerusalem's people when the city fell.
    reason: cultural_note
translation:
  language: ko
  text: 그 말씀은 요시야의 아들 유다 왕 여호야김 시대부터 요시야의 아들 유다 왕 시드기야 제십일 년이 끝날 때까지, 곧 예루살렘 주민이 포로로 끌려가던 다섯째 달까지 계속되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예루살렘의 포로됨’입니다. 여기서 ‘예루살렘’은 그 주민들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it continued
  chosen_korean: …였습니다
  alternatives_korean:
  - …있었습니다
  - …있게 되었습니다
  lexicon: HALOT
  rationale: 히브리어 וַיְהִי는 여기서 서술을 이어 주는 시간표지로 기능하므로, 한국어에서는 별도의 사건동사보다 문맥을 이어 주는 평서형으로 처리했습니다.
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: …시대부터
  alternatives_korean:
  - …날들에
  - …재위 동안
  lexicon: HALOT
  rationale: 직역인 '날들에'보다 한국어 성경문체에서 자연스러운 역사적 시기 표지인 '…시대부터'로 옮겼습니다.
- source_word: עַד תֹּם
  english_pob_choice: until the completion of
  chosen_korean: …이 끝날 때까지
  alternatives_korean:
  - …의 완성까지
  - …의 끝까지
  lexicon: HALOT
  rationale: תֹּם은 단순한 종료보다 '끝남/완료'의 뉘앙스를 가지므로, 자연스러운 한국어로 '끝날 때까지'를 택해 시간의 종결을 드러냈습니다.
- source_word: גְּלוֹת
  english_pob_choice: the exile
  chosen_korean: 포로로 잡혀 갈 때까지
  alternatives_korean:
  - 포로 됨까지
  - 유배될 때까지
  lexicon: HALOT
  rationale: 예루살렘의 함락과 주민 추방을 가리키는 역사적 사건이므로, '포로로 잡혀 가다'로 구체화해 의미를 분명히 했습니다.
