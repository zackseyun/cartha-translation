    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: HALOT
  rationale: 히브리어 금지문은 단순한 금지보다 두려움의 상태를 멈추라는 뜻이므로, 현대 한국어에서 자연스럽고 공손한 명령인 ‘두려워하지 마십시오’로 옮겼습니다.
- source_word: מִפְּנֵיהֶם
