  alternatives_korean:
  - 그들에게서
  - 그들 앞에서
  - 그들로 인해
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 앞에서’이지만, פחד/ירא와 함께 쓰인 관용적으로 두려움의 원인을 나타내므로 한국어에서는 ‘그들 때문에’가 의미를 가장 분명하게 전달합니다.
- source_word: לְהַצִּלְךָ
  english_pob_choice: to deliver you
  chosen_korean: 당신을 건져 내겠다고
  alternatives_korean:
  - 당신을 구해 내겠다고
  - 당신을 구원하겠다고
  - 당신을 구출하겠다고
  lexicon: HALOT
  rationale: נצל의 히필은 ‘빼내다, 구해내다, 건지다’의 넓은 뜻이어서, 예레미야의 직접적 위기 상황을 살리면서도 지나치게 신학화하지 않는 ‘건져 내다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 본문의 ముగემ적 발화 주체는 여호와 하나님의 직접 인용이므로, 본 프로젝트 기본 원칙에 따라 고유명사 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 하나님의 이름 표기
  chosen_reading: ‘야훼께서 말씀하십니다’로 처리하여 예언 공식과 신적 고유명을 함께 드러냈습니다.
  alternative_readings:
  - ‘주님께서 말씀하십니다’
  - ‘야훼의 말씀이니라’
  rationale: נְאֻם יְהוָה는 예언적 선언 공식이므로, 단순한 서술보다 화자의 권위를 드러내는 종결 표현이 필요합니다. 동시에 יְהוָה를 ‘야훼’로 옮겨 고유한 언약 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
