id: JER.1.16
reference: Jeremiah 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/דִבַּרְתִּ֤י מִשְׁפָּטַ/י֙ אוֹתָ֔/ם עַ֖ל כָּל רָעָתָ֑/ם אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לְ/מַעֲשֵׂ֥י יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/016.yaml
  text: And I will pronounce my judgments against them for all their evil[a], because they have forsaken me, burned incense to other gods[b], and bowed down to the works of their own hands.
  footnotes:
  - marker: a
    text: Or 'I will speak my judgments against them concerning all their evil.' The Hebrew verb is literally 'speak,' but here likely carries the sense of formally pronouncing judgment.
    reason: lexical_alternative
  - marker: b
    text: '''The works of their own hands'' refers to idols they themselves made.'
    reason: cultural_note
translation:
  language: ko
  text: 내가 그들에게 그들의 모든 악에 대하여 내 심판을 선포하겠습니다. 그들이 나를 버리고, 다른 신들에게 향을 피우며, 자기 손으로 만든 것들 앞에 엎드려 절하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내 심판을 선포하겠습니다’는 문자적으로는 ‘내 말을 하겠습니다’에 가깝지만, משפטים와 결합한 법정적 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘자기 손으로 만든 것들’은 우상들을 가리키는 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְדִבַּרְתִּי
  english_pob_choice: I will pronounce
  chosen_korean: 내가 … 선포하겠습니다
  alternatives_korean:
  - 내가 … 말하겠습니다
  - 내가 … 선언하겠습니다
  lexicon: HALOT
  rationale: דבר이 משפטים와 결합해 법정적 선고를 뜻하므로, 단순한 ‘말하다’보다 심판의 공적 발표를 드러내는 ‘선포하다’가 적절합니다.
- source_word: מִשְׁפָּטַי
  english_pob_choice: my judgments
  chosen_korean: 내 심판
  alternatives_korean:
  - 내 판단
  - 내 판결
  - 내 의
  lexicon: HALOT
  rationale: 여기서는 משפטים가 하나님의 법정적 판결을 가리키므로, 한국어에서는 문맥상 가장 자연스럽고 강한 ‘심판’으로 옮겼습니다.
- source_word: עַל כָּל רָעָתָם
  english_pob_choice: for all their evil
  chosen_korean: 그들의 모든 악에 대하여
  alternatives_korean:
  - 그들의 모든 악 때문에
  - 그들의 모든 악을 두고
  - 그들의 모든 악에 관하여
  lexicon: HALOT
  rationale: עַל이 여기서는 심판의 근거를 나타내므로 ‘대하여’로 유지해 원인과 대상의 관계를 함께 드러냈습니다.
- source_word: לֵאלֹהִים אֲחֵרִים
  english_pob_choice: to other gods
  chosen_korean: 다른 신들에게
  alternatives_korean:
  - 다른 하나님들에게
  - 이방 신들에게
  lexicon: HALOT
  rationale: 히브리어의 대조적 표현을 그대로 살려, 유일신 신앙을 배반한 대상이 ‘다른 신들’임을 직설적으로 드러냈습니다.
theological_decisions:
- issue: 우상 숭배 행위의 구체성 유지
  chosen_reading: 번역에서 ‘향을 피우다’와 ‘엎드려 절하다’를 분리해, 예레미야가 열거한 두 가지 우상 숭배 행위를 구체적으로 보존했습니다.
  alternative_readings:
  - 둘을 묶어 ‘우상에게 경배하다’로 일반화할 수 있음
  rationale: 본문은 단순한 총괄 표현이 아니라 구체적 배교 행위를 나열하므로, 죄의 성격과 강도를 흐리지 않기 위해 세부 동작을 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 5
