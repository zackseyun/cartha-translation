    rationale: 원문에서 ‘베냐민 땅에’는 ‘아나돗에 있던 제사장들’을 한정하며, 아나돗의 위치를 밝혀 줍니다. 이를 한 명사구 안에 두어 수식 범위를 분명히 해야 합니다.
