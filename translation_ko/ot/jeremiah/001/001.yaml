id: JER.1.1
reference: Jeremiah 1:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: דִּבְרֵ֥י יִרְמְיָ֖הוּ בֶּן חִלְקִיָּ֑הוּ מִן הַ/כֹּֽהֲנִים֙ אֲשֶׁ֣ר בַּ/עֲנָת֔וֹת בְּ/אֶ֖רֶץ בִּנְיָמִֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/001.yaml
  text: The words of Yirmeyahu son of Hilqiyahu[a], one of the priests who were in Anathoth, in the land of Benjamin.
  footnotes:
  - marker: a
    text: Traditional English versions usually read 'Jeremiah son of Hilkiah.' This draft transliterates the Hebrew names more directly as 'Yirmeyahu' and 'Hilqiyahu' in keeping with the project's policy for personal names.
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야의 말들입니다. 그는 힐기야의 아들로서, 아나돗에 있던 제사장들 가운데 한 사람이었으며, 베냐민 땅에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 고유명사 표기를 더 직접적으로 따를 수도 있으나, 이 초안은 한국어 성경의 통용형을 사용했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: דִּבְרֵי
  english_pob_choice: The words of
  chosen_korean: 말들입니다
  alternatives_korean:
  - 말입니다
  - 말씀입니다
  - 기록입니다
  lexicon: HALOT
  rationale: 책 서두의 표제문으로서 ‘דִּבְרֵי’의 넓은 의미를 살리면서도, 예레미야서 전체를 시작하는 문장으로 자연스럽게 들리도록 ‘말들입니다’로 옮겼습니다.
- source_word: יִרְמְיָהוּ
  english_pob_choice: Yirmeyahu
  chosen_korean: 예레미야
  alternatives_korean:
  - 예레미야후
  - 예레미야우
  lexicon: HALOT
  rationale: 한국어 성경에서 널리 정착된 인명형을 따랐습니다. 이 절은 표제문이므로 통용형을 쓰는 것이 식별성과 가독성에 유리합니다.
- source_word: מִן הַכֹּהֲנִים
  english_pob_choice: one of the priests
  chosen_korean: 제사장들 가운데 한 사람이었으며
  alternatives_korean:
  - 제사장들 중 한 사람이었으며
  - 제사장들에 속한 사람이었으며
  - 제사장들 가운데서 왔으며
  lexicon: HALOT
  rationale: מִן + 집합명사는 부분적 소속을 뜻하므로, 단순한 출신지가 아니라 제사장 집단에 속한 사람임을 분명히 하는 표현으로 옮겼습니다.
- source_word: בְּאֶרֶץ בִּנְיָמִן
  english_pob_choice: in the land of Benjamin
  chosen_korean: 베냐민 땅에
  alternatives_korean:
  - 베냐민 땅에서
  - 베냐민의 땅에
  - 베냐민 지파의 땅에
  lexicon: HALOT
  rationale: אֶרֶץ의 지역·영토적 의미를 반영해 ‘땅’으로 옮겼고, 히브리어의 지파 명칭 결합을 한국어 관용에 맞게 간결하게 표현했습니다.
theological_decisions:
- issue: 본문의 첫 문장 형식과 책 제목 역할
  chosen_reading: 이 절은 예레미야서의 표제문으로 읽고, ‘말들입니다’라는 평서형으로 본문의 개시를 유지했습니다.
  alternative_readings:
  - 직역에 가깝게 ‘예레미야의 말들’로만 둘 수도 있음
  - ‘예레미야가 말한 것들’처럼 풀어 쓸 수도 있음
  rationale: 원문은 서사 시작이 아니라 책의 서두 표제이므로, 과도한 설명을 더하지 않으면서도 한국어로 책 머리말 기능이 드러나도록 했습니다.
  doctrine_reference: 문맥/장르 판단
- issue: 인명 표기
  chosen_reading: 예레미야와 힐기야는 한국어 성경의 통용형을 따랐습니다.
  alternative_readings:
  - Yirmeyahu, Hilqiyahu처럼 히브리어 음역을 그대로 따를 수 있음
  rationale: 이 절은 고유명사 두 개가 표제와 계보 식별 기능을 하므로, 독자 인지도를 우선해 정착형을 사용했습니다.
  doctrine_reference: 번역 관행/고유명사 처리
