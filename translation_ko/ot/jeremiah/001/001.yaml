revisions:
- from: 예레미야의 말들입니다. 그는 힐기야의 아들로서, 아나돗에 있던 제사장들 가운데 한 사람이었으며, 베냐민 땅에 있었습니다.[a]
  to: 베냐민 땅 아나돗에 있던 제사장들 가운데 한 사람인 힐기야의 아들 예레미야의 말입니다.
  rationale: 원문의 표제 구조를 따라 예레미야를 힐기야의 아들이며 아나돗의 제사장 집단에 속한 사람으로 식별했습니다. ‘베냐민 땅’이 아나돗과 제사장들을 수식하도록 어순을 조정했으며, 한국어 표제문에 맞게 ‘말’을 사용했습니다. 고유명사는 한국어 통용형을 유지하므로 별도 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:17:06Z'
