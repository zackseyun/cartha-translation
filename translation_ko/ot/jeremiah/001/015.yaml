id: JER.1.15
reference: Jeremiah 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י הִנְ/נִ֣י קֹרֵ֗א לְ/כָֽל מִשְׁפְּח֛וֹת מַמְלְכ֥וֹת צָפ֖וֹנָ/ה נְאֻם יְהוָ֑ה וּ/בָ֡אוּ וְֽ/נָתְנוּ֩ אִ֨ישׁ כִּסְא֜/וֹ פֶּ֣תַח שַׁעֲרֵ֣י יְרוּשָׁלִַ֗ם וְ/עַ֤ל כָּל חוֹמֹתֶ֨י/הָ֙ סָבִ֔יב וְ/עַ֖ל כָּל עָרֵ֥י יְהוּדָֽה׀־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/015.yaml
  text: For behold[a], I am calling all the clans of the kingdoms of the north, declares Yahweh, and they will come, and each will set his throne at the entrance of the gates of Jerusalem, against all her walls all around[b], and against all the cities of Judah.
  footnotes:
  - marker: a
    text: Or 'all the families of the kingdoms of the north.' The Hebrew term can denote extended family groups, clans, or similar social units.
    reason: lexical_alternative
  - marker: b
    text: '''Each will set his throne'' pictures invading rulers taking up positions of authority and judgment at Jerusalem''s gates.'
    reason: cultural_note
translation:
  language: ko
  text: 보십시오[a], 내가 북방의 나라들의 모든 종족을 불러오고 있습니다 — 야훼의 선언입니다 — 그들이 와서, 예루살렘 성문의 어귀에 각기 자기 왕좌를 두고, 그 사방의 모든 성벽과 유다의 모든 성읍을 향할 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북방의 나라들의 모든 가족들/종족들’. 히브리어 מִשְׁפְּחוֹת는 확대된 친족 집단이나 씨족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “각기 자기 왕좌를 둘 것이다”는 침략자들이 예루살렘 성문에서 권위와 재판의 자리를 차지하는 모습을 그립니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 내가 지금
  lexicon: HALOT
  rationale: 주의를 끄는 강조 표지로서의 הִנְנִי를 한국어 합쇼체 명령형 관형이 아니라 직접 호소형인 “보십시오”로 살려, 이어지는 신적 발화의 즉시성과 긴급성을 드러냈습니다.
- source_word: מִשְׁפְּחוֹת
  english_pob_choice: all the clans
  chosen_korean: 모든 종족
  alternatives_korean:
  - 모든 씨족
  - 모든 가족들
  lexicon: HALOT
  rationale: 이 단어는 단순한 핵가족보다 확장된 친족 단위를 가리키므로, “종족”을 택해 사회적 규모를 유지했습니다. “씨족”도 가능하지만 현대 한국어에서는 다소 민속적 뉘앙스가 강합니다.
- source_word: מַמְלְכ֥וֹת צָפוֹנָה
  english_pob_choice: the kingdoms of the north
  chosen_korean: 북방의 나라들
  alternatives_korean:
  - 북쪽의 왕국들
  - 북방의 왕국들
  lexicon: HALOT
  rationale: 히브리어 복수 “왕국들”의 뉘앙스를 살리되, 한국어에서 자연스러운 역사·예언 문맥을 위해 “나라들”로 옮겼습니다. “북방”은 단순 방향보다 침략 세력의 관념적 표현을 더 잘 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언 공식의 선언성을 유지하면서, 프로젝트 기본값에 따라 신명은 “야훼”로 옮겼습니다. “선언입니다”는 예언자적 권위를 간결하게 전달합니다.
- source_word: וְנָתְנוּ אִישׁ כִּסְאוֹ
  english_pob_choice: each will set his throne
  chosen_korean: 각기 자기 왕좌를 두고
  alternatives_korean:
  - 각 사람은 자기 왕좌를 놓고
  - 각기 자기 옥좌를 두고
  lexicon: HALOT
  rationale: 지배자들의 권위와 재판의 자리를 뜻하는 이미지를 살려 “왕좌”를 택했습니다. 동사 “두다”는 히브리어의 단순 배치 동작을 자연스럽게 옮깁니다.
- source_word: פֶּתַח שַׁעֲרֵי יְרוּשָׁלִַם
  english_pob_choice: at the entrance of the gates of Jerusalem
  chosen_korean: 예루살렘 성문의 어귀에
  alternatives_korean:
  - 예루살렘 성문들의 입구에
  - 예루살렘 성문 앞에
  lexicon: HALOT
  rationale: “어귀”는 פֶּתַח의 ‘입구/문턱’ 의미를 간결하게 살리며, 성문이라는 공적 재판·통치 공간을 암시합니다.
theological_decisions:
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 신명 자체를 유지했습니다. 일반적 교회 번역어인 “주”는 여기서는 고유한 언약 სახელ을 가립니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 침략자들의 왕좌 배치라는 이미지
  chosen_reading: 각기 자기 왕좌를 두고
  alternative_readings:
  - 각기 자기 자리를 두고
  - 각기 자기 보좌를 두고
  rationale: 이 표현은 점령 세력의 권력 행사와 재판 장면을 그리는 은유이므로, 단순한 ‘자리’보다 왕권·심판의 뉘앙스를 지닌 “왕좌”를 유지했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
