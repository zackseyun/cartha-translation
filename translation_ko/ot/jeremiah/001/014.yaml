  - 악
  - 해악
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’이 아니라 심판으로 닥치는 재앙/재난을 가리키므로, 오해를 피하는 한국어로 옮겼습니다.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the inhabitants of the land
  chosen_korean: 모든 이 땅의 주민들
  alternatives_korean:
  - 그 땅의 모든 주민들
  - 온 땅의 주민들
  lexicon: HALOT
  rationale: ‘הָאָרֶץ’를 예루살렘 문맥에 맞게 ‘이 땅’으로 처리해 유다 지역을 가리키는 뜻을 살렸습니다.
theological_decisions:
- issue: הָרָעָה의 신학적 함의
  chosen_reading: 재앙으로 번역하여, 하나님이 도덕적 악 자체를 일으킨다는 인상을 피했습니다.
  alternative_readings:
  - 악
  - 재난
  rationale: 예언 본문에서 מדובר하는 것은 심판으로 임하는 재앙이며, 본문은 하나님의 거룩성과 심판을 함께 유지합니다.
  doctrine_reference: 원문 우선 번역; 본문의 의미와 신학적 긴장을 보존함
