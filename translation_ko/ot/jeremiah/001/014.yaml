id: JER.1.14
reference: Jeremiah 1:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלָ֑/י מִ/צָּפוֹן֙ תִּפָּתַ֣ח הָ/רָעָ֔ה עַ֥ל כָּל יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
  footnotes:
  - marker: a
    text: Or 'the calamity will break forth' or more literally 'the evil will be opened.'
    reason: lexical_alternative
  - marker: b
    text: '''The land'' likely refers to the land of Judah here; alternatively, ''the earth.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “북쪽에서 재앙이 모든 이 땅의 주민들 위에 터져 나올 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난이’ 혹은 더 문자적으로는 ‘악이 열릴 것이다’.
    reason: lexical_alternative
  - marker: b
    text: ‘이 땅’은 여기서 유다 땅을 가리킬 가능성이 큽니다. 다른 가능성으로는 ‘땅 전체’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: —
  rationale: 본문의 고유한 신명(神名)을 제목으로 바꾸지 않고, POB의 원칙에 따라 음역된 고유명사로 살렸습니다.
- source_word: מִצָּפוֹן
  english_pob_choice: From the north
  chosen_korean: 북쪽에서
  alternatives_korean:
  - 북에서
  - 북방에서
  lexicon: HALOT
  rationale: צָפוֹן의 기본적 공간 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: תִּפָּתַח
  english_pob_choice: will be unleashed / will break forth
  chosen_korean: 터져 나올 것이다
  alternatives_korean:
  - 열릴 것이다
  - 풀려날 것이다
  - 터질 것이다
  lexicon: HALOT
  rationale: 직역하면 ‘열리다’이지만, 재앙이 갑자기 분출하는 뉘앙스가 문맥에서 더 분명하므로 ‘터져 나올 것이다’로 옮겼습니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 악
  - 해악
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’이 아니라 심판으로 닥치는 재앙/재난을 가리키므로, 오해를 피하는 한국어로 옮겼습니다.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ
  english_pob_choice: all the inhabitants of the land
  chosen_korean: 모든 이 땅의 주민들
  alternatives_korean:
  - 그 땅의 모든 주민들
  - 온 땅의 주민들
  lexicon: HALOT
  rationale: ‘הָאָרֶץ’를 예루살렘 문맥에 맞게 ‘이 땅’으로 처리해 유다 지역을 가리키는 뜻을 살렸습니다.
theological_decisions:
- issue: הָרָעָה의 신학적 함의
  chosen_reading: 재앙으로 번역하여, 하나님이 도덕적 악 자체를 일으킨다는 인상을 피했습니다.
  alternative_readings:
  - 악
  - 재난
  rationale: 예언 본문에서 מדובר하는 것은 심판으로 임하는 재앙이며, 본문은 하나님의 거룩성과 심판을 함께 유지합니다.
  doctrine_reference: 원문 우선 번역; 본문의 의미와 신학적 긴장을 보존함
