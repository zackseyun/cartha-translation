base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/014.yaml
  text: And Yahweh said to me[b][a], “From the north the disaster will break forth against all the inhabitants of the land.”
  footnotes:
  - marker: a
    text: Or 'the calamity will break forth' or more literally 'the evil will be opened.'
    reason: lexical_alternative
  - marker: b
    text: '''The land'' likely refers to the land of Judah here; alternatively, ''the earth.'''
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 제게 말씀하셨습니다. “북쪽에서 재앙이[a] 그 땅[b]의 모든 주민들을 향해 터져 나올 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘재난이 터져 나올 것이다’. 더 문자적으로는 ‘악이 열릴 것이다’.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅’은 여기서 유다 땅을 가리킬 가능성이 큽니다. 다른 가능성으로는 ‘온 땅’입니다.
    reason: alternative_reading
