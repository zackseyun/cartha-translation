  rationale: 직역하면 ‘열리다’이지만, 재앙이 갑자기 분출하는 뉘앙스가 문맥에서 더 분명하므로 ‘터져 나올 것이다’로 옮겼습니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: 재앙
  alternatives_korean:
