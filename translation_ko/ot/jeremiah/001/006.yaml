id: JER.1.6
reference: Jeremiah 1:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֹמַ֗ר אֲהָהּ֙ אֲדֹנָ֣/י יְהֹוִ֔ה הִנֵּ֥ה לֹא יָדַ֖עְתִּי דַּבֵּ֑ר כִּי נַ֖עַר אָנֹֽכִי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/006.yaml
  text: Then I said[a], “Ah, Lord Yahweh! Look, I do not know how to speak[c][b], for I am a youth.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Ah, Lord GOD''; the divine title is אֲדֹנָי יְהוִה, traditionally rendered ''Lord GOD'' to represent both ''Lord'' and the divine name YHWH. Alternatively, ''Lord Yahweh.'''
    reason: alternative_reading
  - marker: b
    text: Or 'I do not know to speak'—a Hebrew idiom meaning 'I do not know how to speak.'
    reason: lexical_alternative
  - marker: c
    text: Or 'young man' or 'boy'; Hebrew נַעַר can refer broadly to a youth, from childhood to young adulthood depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 제가 말했습니다. 「아, 주 야훼여[a]! 보십시오, 저는 말하는 법을 알지 못합니다[b]. 저는 젊은이입니다[c].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֲדֹנָי יְהוִה는 ‘주’와 신적 이름 야훼가 결합된 복합 호칭입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘말을 알지 못합니다’이지만, 히브리어 관용으로 ‘어떻게 말해야 할지 알지 못합니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 나아르(נַעַר)는 문맥에 따라 아동부터 젊은 성인까지 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  english_pob_choice: Then I said
  chosen_korean: 그때 제가 말했습니다
  alternatives_korean:
  - 그리고 제가 말했습니다
  - 그때 제가 말하였습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행을 한국어 자연문으로 옮기되, 예레미야의 응답이 이어지는 장면 전개를 살렸습니다.
- source_word: אֲהָהּ
  english_pob_choice: Ah
  chosen_korean: 아
  alternatives_korean:
  - 아아
  - 슬프도다
  lexicon: HALOT
  rationale: 당혹과 항변의 감탄사로, 현대 한국어에서 가장 직접적이고 간결한 감탄 표현을 택했습니다.
- source_word: אֲדֹנָי יְהוִה
  english_pob_choice: Lord Yahweh
  chosen_korean: 주 야훼
  alternatives_korean:
  - 주 여호와
  - 주님 야훼
  lexicon: HALOT
  rationale: 복합 호칭의 두 요소를 모두 살리기 위해 אֲדֹנָי는 ‘주’, יְהוִה는 본 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: לֹא יָדַעְתִּי דַּבֵּר
  english_pob_choice: I do not know how to speak
  chosen_korean: 말하는 법을 알지 못합니다
  alternatives_korean:
  - 말할 줄 알지 못합니다
  - 말할 줄 모릅니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 뜻인 ‘말할 능력/방법이 없음’을 자연스럽게 풀어, 단순한 지식 부재보다 말의 미숙함을 드러냈습니다.
- source_word: נַעַר
  english_pob_choice: youth
  chosen_korean: 젊은이
  alternatives_korean:
  - 소년
  - 청년
  - 어린아이
  lexicon: HALOT
  rationale: 문맥상 어린아이보다는 미성숙한 젊은 상태를 가리키므로, 연령 범위를 비교적 넓게 품는 ‘젊은이’가 가장 무난합니다.
theological_decisions:
- issue: יהוה(YHWH)와 אֲדֹנָי가 결합된 신적 호칭의 한국어 처리
  chosen_reading: ‘주 야훼’로 옮겨 두 칭호와 언약 이름을 함께 보이게 했습니다.
  alternative_readings:
  - 주님 야훼
  - 주 여호와
  rationale: 본문의 핵심은 단순한 호칭이 아니라 예언자 소명 장면에서 하나님의 언약 이름이 직접 불린다는 점이므로, 프로젝트 기본값인 ‘야훼’를 유지하고 ‘주’를 병기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
