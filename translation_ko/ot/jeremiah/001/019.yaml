id: JER.1.19
reference: Jeremiah 1:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י נְאֻם יְהוָ֖ה לְ/הַצִּילֶֽ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/019.yaml
  text: They will fight against you[a], but they will not prevail against you, for I am with you, declares Yahweh[c][b], to deliver you.
  footnotes:
  - marker: a
    text: Or 'they will not overcome you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'declares the LORD'; the divine name is YHWH.
    reason: alternative_reading
  - marker: c
    text: Or 'to rescue you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 당신과 싸울 것이나, 당신을 이기지 못할 것입니다.[a] 내가 당신과 함께 있어 당신을 구해 낼 것이기 때문입니다. 야훼의 선언입니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 이겨 내지 못할 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘야훼의 선언’. 신적 이름은 YHWH입니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘당신을 건져 내기 위하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְחֲמוּ אֵלֶיךָ
  english_pob_choice: they will fight against you
  chosen_korean: 그들이 당신을 향하여 싸울 것이나
  alternatives_korean:
  - 그들이 당신을 대적하여 싸울 것이나
  - 그들이 당신에게 싸움을 걸 것이나
  lexicon: HALOT
  rationale: נלחם + אל은 적대적 대결을 뜻하므로, 한국어에서는 ‘향하여 싸우다’로 공격 방향을 살리되 과도하게 문어화하지 않았습니다.
- source_word: וְלֹא יוּכְלוּ לָךְ
  english_pob_choice: they will not prevail against you
  chosen_korean: 당신을 이기지 못할 것입니다
  alternatives_korean:
  - 당신에게 이기지 못할 것입니다
  - 당신을 이겨 내지 못할 것입니다
  lexicon: HALOT
  rationale: יכל + ל의 불능 의미를 한국어에서 자연스럽게 드러내는 표현으로, 단순한 힘의 부족이 아니라 상대적 실패를 나타내는 ‘이기지 못하다’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 선언하십니다
  alternatives_korean:
  - 야훼의 말씀입니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 예언자적 선언 공식 נְאֻם을 현대 한국어의 공적·예언적 문체로 옮기되, 문장 안에서 직접 화자를 분명히 하기 위해 ‘선언하십니다’를 사용했습니다.
- source_word: לְהַצִּילֶךָ
  english_pob_choice: to deliver you
  chosen_korean: 당신을 구해 내겠다고
  alternatives_korean:
  - 당신을 건져 내겠다고
  - 당신을 구원하시겠다고
  lexicon: HALOT
  rationale: נצל의 핵심은 위험에서 건져 내는 구출이므로, 구원론적 의미를 과도하게 불러오는 ‘구원’보다 ‘구해 내다’를 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: יהוה를 야훼로 옮겨, 예언자적 발화의 인격적 이름을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신적 칭호가 아니라 고유한 언약 이름 יהוה를 사용하므로, POB 원칙에 따라 대체 칭호 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 보호 약속의 긴장 보존
  chosen_reading: 공격은 실제로 있으나, 최종적으로는 이기지 못한다는 식으로 옮겼습니다.
  alternative_readings:
  - 아예 해칠 수 없다
  - 전혀 대적하지 못한다
  rationale: 본문은 환난의 부재가 아니라 적의 실패와 야훼의 임재를 약속하므로, ‘이기지 못할 것입니다’로 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
