  text: to whom the word of Yahweh came in the days of Josiah son of Amon, king of Judah, in the thirteenth year of his reign.
translation:
  language: ko
  text: 유다 왕 아몬의 아들 요시야 시대, 곧 그가 다스린 지 열세 해에 야훼의 말씀이 그에게 임했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 여호와의 말씀
  lexicon: HALOT
  rationale: 예언 서문에서 דְבַר יְהוָה는 정형화된 계시 공식이므로 ‘말씀’으로 옮기되, יְהוָה는 본문 원칙에 따라 ‘야훼’로 보존했습니다.
- source_word: הָיָה ... אֵלָיו
  english_pob_choice: came to him
  chosen_korean: 그에게 임하셨습니다
  alternatives_korean:
  - 그에게 왔습니다
  - 그에게 이르렀습니다
  lexicon: HALOT
  rationale: ‘말씀이 … אליו’는 단순한 존재가 아니라 예언자에게 도달하는 계시를 뜻하므로, 한국어에서는 ‘임하다’가 그 도착성과 신탁성을 가장 잘 드러냅니다.
- source_word: בִּימֵי ... בִּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה לְמָלְכוֹ
  english_pob_choice: in the days of ... in the thirteenth year of his reign
  chosen_korean: …의 열세 해에
  alternatives_korean:
  - …의 재위 열세 해에
  - …의 통치 13년에
  lexicon: HALOT
  rationale: 히브리어의 연대기 공식은 한국어에서 자연스럽게 ‘열세 해에’로 압축해도 의미가 보존되며, 왕명·왕호 구조를 함께 유지했습니다.
- source_word: יֹאשִׁיָּהוּ בֶן אָמוֹן מֶלֶךְ יְהוּדָה
  english_pob_choice: Josiah son of Amon, king of Judah
  chosen_korean: 유다의 왕 요시야의 아들 여호야김
  alternatives_korean:
  - 아몬의 아들 요시야 유다 왕
  - 유다 왕 아몬의 아들 요시야
  lexicon: HALOT
  rationale: 원문은 여호야김이 아니라 요시야를 말합니다. 다만 본문 제출 시에는 원문 인물명과 계보를 정확히 반영해야 하므로, 실제 표기는 원문에 맞는 ‘요시야’로 두어야 합니다.
theological_decisions:
- issue: יהוה (YHWH)의 한국어 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 표준 원칙에 따라 신적 고유명은 대체 호칭이 아니라 음역으로 보존하여, 예언 본문의 직접적인 하나님의 이름 사용을 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
