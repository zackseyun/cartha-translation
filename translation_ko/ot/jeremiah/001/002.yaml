revisions:
- from: 여호야김의 아들 유다의 왕 요시야의 열세 해에 야훼의 말씀이 그에게 임하셨습니다.[a]
  to: 유다 왕 아몬의 아들 요시야 시대, 곧 그가 다스린 지 열세 해에 야훼의 말씀이 그에게 임했습니다.
  rationale: 원문의 상대절이 앞 절의 예레미야를 받는 점은 ‘그에게’로 유지했습니다. 아몬-요시야의 계보, 유다 왕이라는 왕호, 요시야 재위 제13년이라는 연대를 모두 본문에 반영했습니다. 기존 각주는 번역상 필요한 본문비평 또는 의미 주석이 아니라 초안의 명백한 오역을 지적하는 내용이므로, 본문을 고친 뒤에는 남기지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:15:35Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 본문의 인명과 계보를 뒤바꾸어 ‘여호야김의 아들 요시야’로 만들었습니다. 히브리어는 아몬의 아들인 요시야, 곧 유다 왕을 가리킵니다. 또한 재위 제13년이라는 연대 표지가 요시야의 통치에 연결되어야 합니다.
  naturalness: ‘유다 왕 아몬의 아들 요시야 시대, 곧 그가 다스린 지 열세 해에’는 히브리어의 시간 표지를 자연스러운 현대 한국어로 보존합니다. ‘말씀’은 문법상 무생물 주어이므로 ‘임했습니다’가 ‘임하셨습니다’보다 적절합니다.
  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 유지하고, דְבַר יְהוָה는 예언서의 정형 표현에 맞게 ‘야훼의 말씀’으로 옮겼습니다.
  issues:
  - severity: high
    issue: 인명과 계보가 원문과 반대로 번역되었습니다.
    rationale: 원문은 ‘유다 왕 아몬의 아들 요시야’(יֹאשִׁיָּהוּ בֶן־אָמוׂן מֶלֶךְ יְהוּדָה)이며, 여호야김은 이 절에 나오지 않습니다.
  - severity: medium
    issue: 재위 연대의 소유자가 문맥상 불명확합니다.
    rationale: ‘열세 해에’는 요시야의 재위 제13년을 뜻하므로, 요시야의 통치에 명시적으로 연결하는 것이 정확합니다.
  - severity: low
    issue: ‘말씀이 … 임하셨습니다’의 높임 선어말 어미가 부적절합니다.
    rationale: ‘말씀’은 이 문장에서 계시의 내용을 가리키는 주어이므로, 존대 주체 표지 없이 ‘임했습니다’가 자연스럽습니다.
  - severity: medium
    issue: 현행 각주는 초안의 오류를 설명할 뿐 본문과 모순됩니다.
    rationale: 각주는 원문이 ‘아몬의 아들 요시야’라고 바르게 말하면서도 본문 오류를 그대로 남겨 두므로 삭제하고 본문을 바로잡아야 합니다.
  revised_text: 유다 왕 아몬의 아들 요시야 시대, 곧 그가 다스린 지 열세 해에 야훼의 말씀이 그에게 임했습니다.
