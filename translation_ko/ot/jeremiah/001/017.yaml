base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/001/017.yaml
  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''gird up your loins,'' that is, prepare yourself for action.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너는 허리를 동이고 일어나 그들에게 내가 네게 명하는 모든 것을 말하여라. 그들 앞에서 두려워하지 말아라. 그렇지 않으면 내가 너를 그들 앞에서 두렵게 할 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 곧 행동을 위해 몸가짐을 갖추라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  english_pob_choice: But you
  chosen_korean: 그러나 너는
  alternatives_korean:
  - 그리고 너는
  - 너는
  lexicon: HALOT
  rationale: 문맥상 앞선 소명 재확인에 대한 강한 전환과 대조를 나타내므로, 단순한 연결보다 역접을 살린 「그러나 너는」이 적절합니다.
- source_word: תֶּאְזֹר מָתְנֶיךָ
  english_pob_choice: gird up your loins
  chosen_korean: 허리를 동이고
  alternatives_korean:
  - 준비하고
  - 옷자락을 여미고
  lexicon: HALOT
  rationale: 히브리어 관용구의 신체적 이미지를 살리면서도 한국어에서 자연스럽게 이해되도록 「허리를 동이다」로 옮겼습니다.
- source_word: וְקַמְתָּ
  english_pob_choice: arise
  chosen_korean: 일어나
  alternatives_korean:
  - 일어서
  - 일어서서
  lexicon: HALOT
  rationale: 예언적 파송의 연속 동작을 자연스러운 명령형으로 살리되, 지나치게 고어적인 「일어나라」보다 현대 문장 흐름에 맞게 처리했습니다.
- source_word: פֶּן אֲחִתְּךָ
  english_pob_choice: lest I dismay you
  chosen_korean: 그렇지 않으면 내가 너를 그들 앞에서 두렵게 할 것이다
  alternatives_korean:
  - 내가 너를 그들 앞에서 두렵게 하지 않도록
  - 내가 너를 그들 앞에서 놀라게 할 것이다
  lexicon: HALOT
  rationale: 히브리어의 경고와 앞 절의 「두려워하지 말아라」 사이의 어휘적 대응을 살리기 위해, 약화된 단순 가능성보다 경고의 결과를 분명히 드러냈습니다.
theological_decisions:
- issue: 예언자 파송에서 신체적 관용구를 유지할지 여부
  chosen_reading: 문자적 이미지를 완전히 풀지 않고 「허리를 동이고」로 유지했습니다.
  alternative_readings:
  - 준비하고
  - 각오를 다지고
  rationale: 이 구절은 준비와 담대함을 몸의 동작으로 형상화하므로, 이미지를 보존해야 소명의 긴박감과 예언자의 긴장이 살아납니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; 원어 우선 원칙'
