  source_fidelity: 히브리어의 연속된 명령, ‘허리를 동이다’라는 관용적 이미지, 명령 내용의 총체성, 그리고 חתת 어근의 반복은 대체로 충실히 반영되었습니다. 다만 현 초안의 문체는 요구된 합쇼체와 일치하지 않으며, 각주 표지가 설명 대상인 ‘허리를 동이고’가 아니라 절 끝에 놓여 있습니다.
  naturalness: ‘허리를 동이고 일어나서’는 현대 표준어에서 자연스럽고 원문의 준비·행동 이미지를 유지합니다. 명령을 ‘-십시오’로 통일하면 지정된 현대 formal-polite register에 맞습니다. ‘두려워하지 마십시오 / 두렵게 하겠습니다’는 한국어에서 다소 엄중하게 들리지만 원문의 경고와 어휘적 반향을 보존하는 안전한 표현입니다.
  terminology: ‘명하다’는 צוה의 명령·위임 문맥에 적절합니다. ‘그들 앞에서’는 מִפְּנֵיהֶם의 대면·위협 상황을 보존합니다. 각주는 ‘허리를 동이고’의 히브리어 관용을 직접 설명하도록 표지를 옮겨야 합니다.
