  text: But you[a], gird up your loins, and arise and speak to them all that I command you. Do not be dismayed before them, lest I dismay you before them.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''gird up your loins,'' that is, prepare yourself for action.'
