  lexicon: 고유명사 음역
  rationale: 히브리어 본문의 더 긴 형태를 반영해 음역했고, 영어 주석의 Jonadab 변이 가능성은 이름의 다른 축약형으로 이해할 수 있습니다.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  english_pob_choice: not to drink wine
  chosen_korean: 포도주를 마시지 않는 것입니다
