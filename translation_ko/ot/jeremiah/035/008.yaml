base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
  footnotes:
  - marker: a
    text: Hebrew 'obeyed the voice of' is an idiom meaning to heed or obey someone's command.
    reason: lexical_alternative
  - marker: b
    text: Jehonadab is also spelled 'Jonadab' in some English translations, reflecting a shortened form of the same name.
    reason: alternative_reading
translation:
  language: ko
  text: 우리는 레갑의 아들이며 우리의 조상인 여호나답의 말에 순종하여[a], 그가 우리에게 명한 모든 것을 지켜 왔습니다. 곧 우리와 우리의 아내들과 아들들과 딸들이 모두 평생 포도주를 마시지 않는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 직역하여 ‘여호나답의 목소리를 들었다’이며, 이는 그의 말이나 명령에 순종했다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  english_pob_choice: we have obeyed the voice of
  chosen_korean: 목소리를 따라 … 지켜 왔습니다
  alternatives_korean:
  - 말을 들어 왔습니다
  - 명령을 따라 왔습니다
  lexicon: HALOT
  rationale: בְּקוֹל과 שׁמע의 관용적 결합은 단순 청취가 아니라 ‘따라 순종하다’의 뜻이므로, 한국어에서는 ‘목소리’를 유지하되 의미를 자연스럽게 풀어 옮겼습니다.
- source_word: יְהוֹנָדָב
  english_pob_choice: Jehonadab
  chosen_korean: 여호나답
  alternatives_korean:
