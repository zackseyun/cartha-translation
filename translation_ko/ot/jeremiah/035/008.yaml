  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נִּשְׁמַ֗ע בְּ/ק֨וֹל יְהוֹנָדָ֤ב בֶּן רֵכָב֙ אָבִ֔י/נוּ לְ/כֹ֖ל אֲשֶׁ֣ר צִוָּ֑/נוּ לְ/בִלְתִּ֤י שְׁתֽוֹת יַ֨יִן֙ כָּל יָמֵ֔י/נוּ אֲנַ֣חְנוּ נָשֵׁ֔י/נוּ בָּנֵ֖י/נוּ וּ/בְנֹתֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/008.yaml
  text: 'So we have obeyed the voice of Jehonadab son of Rechab[a], our father, in everything that he commanded us: not to drink wine all our days—we, our wives, our sons[b], and our daughters.'
  footnotes:
  - marker: a
    text: Hebrew 'obeyed the voice of' is an idiom meaning to heed or obey someone's command.
    reason: lexical_alternative
  - marker: b
    text: Jehonadab is also spelled 'Jonadab' in some English translations, reflecting a shortened form of the same name.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 우리는 우리 조상 여호나답의 목소리를 따라 그가 우리에게 명한 모든 것을 지켜 왔습니다. 곧 우리 평생 동안 포도주를 마시지 않는 것입니다—우리와 우리 아내들, 우리 아들들, 우리 딸들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘목소리를 듣다’는 관용적으로 ‘순종하다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּשְׁמַע בְּקוֹל
  english_pob_choice: we have obeyed the voice of
  chosen_korean: 목소리를 따라 … 지켜 왔습니다
  alternatives_korean:
  - 말을 들어 왔습니다
  - 명령을 따라 왔습니다
  lexicon: HALOT
  rationale: בְּקוֹל과 שׁמע의 관용적 결합은 단순 청취가 아니라 ‘따라 순종하다’의 뜻이므로, 한국어에서는 ‘목소리’를 유지하되 의미를 자연스럽게 풀어 옮겼습니다.
- source_word: יְהוֹנָדָב
  english_pob_choice: Jehonadab
  chosen_korean: 여호나답
  alternatives_korean:
  - 요나답
  lexicon: 고유명사 음역
  rationale: 히브리어 본문의 더 긴 형태를 반영해 음역했고, 영어 주석의 Jonadab 변이 가능성은 이름의 다른 축약형으로 이해할 수 있습니다.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  english_pob_choice: not to drink wine
  chosen_korean: 포도주를 마시지 않는 것입니다
  alternatives_korean:
  - 포도주를 마시지 않도록 하는 것입니다
  - 포도주를 마시지 않는 것
  lexicon: HALOT
  rationale: 부정 목적의 구문을 한국어 명사절로 자연스럽게 옮기되, 금지의 내용이 ‘포도주를 마시지 않음’임을 분명히 했습니다.
- source_word: אֲנַחְנוּ נָשֵׁינוּ בָּנֵינוּ וּבְנֹתֵינוּ
  english_pob_choice: we, our wives, our sons, and our daughters
  chosen_korean: 우리와 우리 아내들, 우리 아들들, 우리 딸들입니다
  alternatives_korean:
  - 우리와 우리 아내들, 아들들, 딸들입니다
  - 우리 자신과 아내들과 아들들과 딸들입니다
  lexicon: HALOT
  rationale: 가족 구성원을 하나씩 병렬로 드러내는 히브리어의 포괄성을 살려, 집안 전체가 포함된다는 점을 유지했습니다.
theological_decisions:
- issue: ‘목소리를 듣다’ 관용구의 처리
  chosen_reading: ‘목소리를 따라 … 지켜 왔습니다’로 옮겨, 단순 청각이 아니라 권위를 인정하고 순종하는 의미를 드러냈습니다.
  alternative_readings:
  - ‘목소리에 순종했습니다’
  - ‘말을 들었습니다’
  rationale: 본문의 שׁמע בְּקוֹל은 언약적 충성과 복종을 함축하므로, 한국어에서도 그 순종성을 분명히 하는 쪽이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 신명기적 순종 어법, 렘 35장의 레갑 사람 전승
