  text: כִּ֣י הֵקִ֗ימוּ בְּנֵי֙ יְהוֹנָדָ֣ב בֶּן רֵכָ֔ב אֶת מִצְוַ֥ת אֲבִי/הֶ֖ם אֲשֶׁ֣ר צִוָּ֑/ם וְ/הָ/עָ֣ם הַ/זֶּ֔ה לֹ֥א שָׁמְע֖וּ אֵלָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/016.yaml
  text: For the sons of Jehonadab son of Rechab have kept the command of their father that he commanded them[b][a], but this people have not listened to me.
  footnotes:
  - marker: a
    text: Or 'their ancestor'; Hebrew 'their father.'
    reason: lexical_alternative
  - marker: b
    text: '''Listened to me'' can also carry the sense ''obeyed me.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 레갑의 아들 여호나답의 아들들이 그들의 아버지[a]가 그들에게 내린 명령을 지켰지만, 이 백성은 내 말을 듣지[b] 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아버지’는 여기서 실제 아버지라기보다 가문을 세운 선조를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 말을 듣지’는 문맥상 ‘순종하지’의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוֹנָדָב בֶּן רֵכָב
  english_pob_choice: the sons of Jehonadab son of Rechab
  chosen_korean: 레갑의 아들 여호나답의 아들들
  alternatives_korean:
  - 여호나답의 아들 레갑의 자손들
  - 레갑 사람 여호나답의 아들들
  lexicon: HALOT
  rationale: 히브리어의 직계 계보 표현을 살려 ‘아들들’로 옮기되, 문맥상 집단을 가리키므로 자연스러운 한국어 어순으로 정리했습니다.
- source_word: מִצְוַת
  english_pob_choice: the command
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 지시
  - 명령하신 말씀
  lexicon: HALOT
  rationale: מִצְוָה는 여기서 규범적 권위를 가진 지시를 뜻하므로, 교회적 색채가 강한 ‘계명’보다 중립적이고 직접적인 ‘명령’이 원문의 힘을 잘 드러냅니다.
- source_word: אֲבִיהֶם
  english_pob_choice: their father
  chosen_korean: 아버지가
  alternatives_korean:
  - 그들의 아버지가
  - 조상(선조)이
  lexicon: HALOT
  rationale: 히브리어가 실제로 ‘아버지’를 쓰므로 이를 유지했습니다. 이 표현은 단순한 혈연보다 가문/조상에 대한 순종의 수사를 함께 살립니다.
- source_word: לֹא שָׁמְעוּ אֵלַי
  english_pob_choice: have not listened to me
  chosen_korean: 나에게 듣지 않았습니다
  alternatives_korean:
  - 나에게 순종하지 않았습니다
  - 내 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: שׁמע עם אֶל의 기본 뜻을 살려 ‘듣다’로 옮기되, 한국어에서 자연스럽게 반응하도록 했습니다. ‘순종하다’는 해석을 지나치게 전면화할 수 있어 본문 어휘를 우선했습니다.
theological_decisions:
- issue: ‘듣다’의 함축적 순종 의미
  chosen_reading: ‘나에게 듣지 않았습니다’로 직역하되, 순종의 뉘앙스는 문맥에서 드러나게 했습니다.
  alternative_readings:
  - 나에게 순종하지 않았습니다
  - 내 말을 듣지 않았습니다
  rationale: 이 절은 레갑 사람들의 순종과 유다의 불순종을 대비하므로, 히브리어 동사 자체는 ‘듣다’로 유지하고 신학적 함의는 문맥이 부담하도록 두는 편이 원문에 더 가깝습니다.
  doctrine_reference: Translation philosophy §3 (source transparency) and §5 (lexical/theological tension should remain visible)
