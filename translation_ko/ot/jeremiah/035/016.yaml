    issue: ‘나에게 듣지 않았습니다’는 현대 한국어에서 목적어 결합이 부자연스럽습니다.
    rationale: 히브리어 שָׁמְעוּ אֵלַי는 직역하면 ‘내게 들었다’ 계열이지만, 한국어에서는 ‘내 말을 듣다’가 자연스러운 대응입니다. 이는 불순종의 함의를 과도하게 해석하지 않으면서도 원문의 청종 언어를 보존합니다.
