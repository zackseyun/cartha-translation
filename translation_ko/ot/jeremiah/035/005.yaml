translation:
  language: ko
  text: 내가 레갑 사람들의 집의 아들들 앞에 포도주로 가득 찬 대접들과 잔들을 놓고, 그들에게 말했습니다. “포도주를 마시십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
