  terminology: ‘레갑’, ‘포도주’, ‘대접들’, ‘잔들’은 적절합니다. ‘레갑 가문의 자손들’은 ‘레갑 사람들’보다 בְּנֵי בֵית의 가문/집안 관계를 더 잘 드러냅니다. 합쇼체 직접 명령 ‘마시십시오’도 본문 전체의 목표 문체에 맞습니다.
