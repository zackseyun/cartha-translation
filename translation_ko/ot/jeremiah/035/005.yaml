    text: ‘레갑 사람들’은 히브리어 집단명 רֵכָבִים의 의미를 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתֵּן
  english_pob_choice: Then I set
  chosen_korean: 놓고
  alternatives_korean:
  - 두고
  - 내어놓고
  - 설치하고
  lexicon: HALOT
  rationale: נתן은 문맥상 물건을 ‘두다/놓다’는 뜻으로 쓰였으므로, ‘포도주와 잔을 앞에 놓다’가 자연스럽고 직접적입니다. ‘Then’의 순차성은 한국어의 서술 흐름으로 충분히 드러납니다.
- source_word: לִפְנֵי בְּנֵי בֵית
  english_pob_choice: before the sons of the house of
  chosen_korean: … 앞에
  alternatives_korean:
  - … 앞에서
  - … 면전에서
  - … 앞에 두고
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞에/면전에’라는 공간적·대면적 의미이므로, 사물 배치의 문맥에서 ‘앞에’가 가장 간결하고 정확합니다.
- source_word: הָרֵכָבִים
  english_pob_choice: the Rekabites
  chosen_korean: 레갑 사람들
  alternatives_korean:
  - 레갑인들
  - 레카빗 사람들
  - 레갑족
  lexicon: HALOT
  rationale: 집합명사적 표현을 한국어에서 자연스럽게 살리기 위해 ‘사람들’로 옮겼습니다. 본문은 혈통/가문 집단을 가리키므로 ‘레갑 사람들’이 이해하기 쉽고 과도하게 교회 용어화하지 않습니다.
- source_word: גְּבִעִים
  english_pob_choice: bowls
  chosen_korean: 대접들
  alternatives_korean:
  - 그릇들
  - 사발들
  - 보울들
  lexicon: HALOT
  rationale: מִלֵאִים יַיִן과 함께 놓인 음용기라서 단순한 ‘그릇’보다 ‘대접’이 더 구체적입니다. ‘bowls’의 형태적 넓이를 살리면서 한국어 성경 문맥에도 자연스럽습니다.
- source_word: וְכֹסוֹת
  english_pob_choice: and cups
  chosen_korean: 잔들
  alternatives_korean:
  - 컵들
  - 술잔들
  - 컵과 잔들
  lexicon: HALOT
  rationale: כּוֹס는 일반적으로 ‘잔/술잔’에 해당하므로, 앞의 ‘대접들’과 병렬을 이루도록 ‘잔들’로 옮겼습니다.
theological_decisions:
- issue: 명령형의 공손도와 직접 화행
  chosen_reading: “포도주를 마시십시오.”
  alternative_readings:
  - “포도주를 마시라.”
  - “포도주를 마시세요.”
  rationale: 예언자적 서술 속 직접 인용이지만, 본문 전체의 현대 표준어·합쇼체 기준에 맞추어 공손한 명령형을 사용했습니다. 이는 화행의 직접성을 유지하면서도 한국어 공예배/성경 문체에 적합합니다.
  doctrine_reference: Korean register alignment / direct speech preservation
