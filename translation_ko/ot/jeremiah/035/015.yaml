reference: Jeremiah 35:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶשְׁלַ֣ח אֲלֵי/כֶ֣ם אֶת כָּל עֲבָדַ֣/י הַ/נְּבִאִ֣ים הַשְׁכֵּ֣ים וְ/שָׁלֹ֣חַ לֵ/אמֹ֡ר שֻׁבוּ נָ֡א אִישׁ֩ מִ/דַּרְכּ֨/וֹ הָ/רָעָ֜ה וְ/הֵיטִ֣יבוּ מַֽעַלְלֵי/כֶ֗ם וְ/אַל תֵּ֨לְכ֜וּ אַחֲרֵ֨י אֱלֹהִ֤ים אֲחֵרִים֙ לְ/עָבְדָ֔/ם וּ/שְׁבוּ֙ אֶל הָ֣/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תִּי לָ/כֶ֖ם וְ/לַ/אֲבֹֽתֵי/כֶ֑ם וְ/לֹ֤א הִטִּיתֶם֙ אֶֽת אָזְנְ/כֶ֔ם וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/015.yaml
  text: And I sent to you all my servants the prophets[a], rising early and sending them, saying, ‘Please turn back, each man from his evil way, and make your deeds good, and do not go after other gods to serve them[d][c][b]. Then dwell in the land that I gave to you and to your fathers.’ But you did not incline your ear or listen to me.
  footnotes:
  - marker: a
    text: Or “Please return,” or more interpretively, “Repent.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “each man from his evil way,” a distributive expression meaning each person individually.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew idiom: “rising early and sending,” expressing persistent, earnest sending.'
    reason: cultural_note
  - marker: d
    text: Or “amend your deeds.”
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 내 종들인 예언자들을 모두 일찍 일어나 거듭 보내면서 이렇게 말했습니다. ‘부디 너희는 각자 자기 악한 길에서 돌아서십시오.[a][b] 너희 행실을 고치십시오.[d] 다른 신들을 따라가 그들을 섬기지 말고, 내가 너희와 너희 조상들에게 준 땅에 거주하십시오.’ 그러나 너희는 귀를 기울이지도 않았고 내 말을 듣지도 않았습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “돌아오십시오.” 더 해석적으로는 “회개하십시오.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “각 사람이 자기 악한 길에서”라는 분배적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 관용구 “일찍 일어나 보내며”는 간절하고 지속적인 파송을 뜻합니다.
    reason: cultural_note
  - marker: d
    text: 또는 “너희 행실을 좋게 하십시오.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדַי הַנְּבִאִים
  english_pob_choice: my servants the prophets
  chosen_korean: 내 종들인 예언자들
  alternatives_korean:
  - 내 종들, 예언자들
  - 내 예언자들
  lexicon: HALOT
  rationale: ‘종들’로 예언자들이 야훼의 소속된 사자라는 점을 살리고, ‘예언자들’은 מקור의 직함을 직역해 apposition을 유지했습니다.
- source_word: הַשְׁכֵּים וְשָׁלֹחַ
  english_pob_choice: rising early and sending them
  chosen_korean: 일찍 일어나 보내며
  alternatives_korean:
  - 부지런히 보내며
  - 거듭 보내며
  lexicon: HALOT
  rationale: 히브리어 관용구의 성실하고 간절한 반복적 파송을 한국어에서 자연스럽게 살리되, 의미를 과도하게 풀어 쓰지 않았습니다.
- source_word: שֻׁבוּ נָא
  english_pob_choice: Please turn back
  chosen_korean: 제발 ... 돌아서서
  alternatives_korean:
  - 제발 ... 돌아오라
  - 회개하라
  lexicon: HALOT
  rationale: שׁוּב의 기본적 물리적/도덕적 전환 이미지를 살려 ‘돌아서서’로 옮기고, נָא는 ‘제발’로 반영했습니다.
- source_word: וְהֵיטִיבוּ מַעַלְלֵיכֶם
  english_pob_choice: and make your deeds good
  chosen_korean: 너희 행실을 좋게 하라
  alternatives_korean:
  - 너희 행동을 고치라
  - 너희 행위를 개선하라
  lexicon: HALOT
  rationale: 마עַלְלֵיכֶם의 행위 전반을 ‘행실’로 자연스럽게 옮기면서, 히필의 ‘좋게 하다/개선하다’ 의미를 직설적으로 반영했습니다.
- source_word: וְלֹא הִטִּיתֶם אֶת אָזְנְכֶם וְלֹא שְׁמַעְתֶּם אֵלָי
  english_pob_choice: But you did not incline your ear or listen to me
  chosen_korean: 그러나 너희는 너희 귀를 기울이지도 않았고 내 말을 듣지도 않았습니다
  alternatives_korean:
  - 그러나 너희는 귀를 기울이지도 않았고 내 말을 듣지도 않았습니다
  - 그러나 너희는 내게 귀를 기울이지도 않았고 듣지도 않았습니다
  lexicon: HALOT
  rationale: ‘귀를 기울이다’는 히브리 관용구를 살리고, 뒤의 ‘듣다’를 병렬로 유지해 불순종의 중첩을 드러냈습니다.
theological_decisions:
- issue: שׁוּב(돌아오다/돌아서다)의 회개 의미
  chosen_reading: ‘돌아서서’로 번역하되 ‘회개하다’는 직접 쓰지 않았습니다.
  alternative_readings:
  - 회개하라
  - 돌아오라
  rationale: 본문은 우선 행위의 방향 전환을 요구하므로, 신학적으로 더 체계화된 회개 어휘를 강제하지 않고 히브리어 이미지 자체를 보존했습니다.
  doctrine_reference: Translation philosophy 1, 3
- issue: אִישׁ의 분배적 의미
  chosen_reading: ‘너희 각자’
  alternative_readings:
  - 각 사람
  - 사람마다
  rationale: 히브리어 단수형의 분배적 힘을 한국어에서 자연스럽게 드러내면서, 남성 중심의 표면형을 현대 독자에게 과도하게 낯설지 않게 옮겼습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
