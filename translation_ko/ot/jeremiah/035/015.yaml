- from: 내가 너희에게 내 종들인 예언자들을 보내되, 일찍 일어나 보내며 말하기를, ‘제발 너희 각자 악한 길에서 돌아서서 너희 행실을 좋게 하라. 또 다른 신들을 따라 그들을 섬기지 말고, 내가 너희와 너희 조상들에게 준 땅에 거주하라.’ 그러나 너희는 너희 귀를 기울이지도 않았고 내 말을 듣지도 않았습니다.[a][b][c][d]
  to: 내가 너희에게 내 종들인 예언자들을 모두 일찍 일어나 거듭 보내면서 이렇게 말했습니다. ‘부디 너희는 각자 자기 악한 길에서 돌아서십시오.[a][b] 너희 행실을 고치십시오.[d] 다른 신들을 따라가 그들을 섬기지 말고, 내가 너희와 너희 조상들에게 준 땅에 거주하십시오.’ 그러나 너희는 귀를 기울이지도 않았고 내 말을 듣지도 않았습니다.[c]
  rationale: 합쇼체로 문체를 통일하고, 히브리어의 ‘일찍 일어나 보내다’ 관용구를 ‘일찍 일어나 거듭 보내면서’로 자연화했습니다. 명령의 순서와 의미, 즉 악한 길에서 돌이킴, 행실의 개선, 다른 신 섬김의 금지, 땅에 거주함을 보존했습니다. 각주 c는 해당 관용구 뒤로 옮기고, 각주 b의 표현을 원문 문법에 맞게 바로잡았습니다.
