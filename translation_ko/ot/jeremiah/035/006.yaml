id: JER.35.6
reference: Jeremiah 35:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֖וּ לֹ֣א נִשְׁתֶּה יָּ֑יִן כִּי֩ יוֹנָדָ֨ב בֶּן רֵכָ֜ב אָבִ֗י/נוּ צִוָּ֤ה עָלֵ֨י/נוּ֙ לֵ/אמֹ֔ר לֹ֧א תִשְׁתּוּ יַ֛יִן אַתֶּ֥ם וּ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/006.yaml
  text: But they said[a], “We will not drink wine, for Jonadab son of Rechab, our father, commanded us, saying, ‘You shall not drink wine, you or your sons[c][b], forever.’”
  footnotes:
  - marker: a
    text: Or “And they said.” The Hebrew narrative conjunction can be rendered either way; “But” reflects the contrast with the preceding invitation to drink wine.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “our father,” meaning their forefather or ancestor Jonadab.
    reason: cultural_note
  - marker: c
    text: Hebrew “your sons,” specifically male descendants, not the more general “children.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 대답했습니다. 「우리는 포도주를 마시지 않겠습니다. 우리 조상 요나답, 레갑의 아들이 우리에게 명령하여 말씀하기를, ‘너희는, 너희와 너희 자손이, 영원히 포도주를 마시지 말라’ 하였기 때문입니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 앞선 초청에 대한 응답이므로, 히브리어 접속사는 ‘그리고’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 ‘우리 아버지’는 여기서 직계 아버지라기보다 조상 또는 선조를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 일반적인 ‘자녀’가 아니라 남자 후손을 뜻하는 ‘아들들’을 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  english_pob_choice: But they said
  chosen_korean: 그들이 대답했습니다
  alternatives_korean:
  - 그리고 그들이 말했습니다
  - 그러나 그들이 말했습니다
  lexicon: HALOT
  rationale: 서술 전환 기능은 살리되, 앞선 초청에 대한 응답이라는 문맥을 한국어에서 자연스럽게 드러내기 위해 ‘대답했습니다’를 선택했습니다.
- source_word: לֹא נִשְׁתֶּה יָּיִן
  english_pob_choice: We will not drink wine
  chosen_korean: 우리는 포도주를 마시지 않겠습니다
  alternatives_korean:
  - 우리는 포도주를 마시지 않습니다
  - 우리는 포도주를 마시지 않을 것입니다
  lexicon: HALOT
  rationale: 직접 화법의 결의를 나타내는 미완료형을 한국어 미래·의지 표현으로 옮겼고, יַיִן은 일반적인 ‘포도주’로 렌더링했습니다.
- source_word: אָבִינוּ
  english_pob_choice: our father
  chosen_korean: 우리 조상
  alternatives_korean:
  - 우리 아버지
  - 우리 선조
  lexicon: HALOT
  rationale: 요나답이 현세의 아버지가 아니라 가문적 선조라는 점을 드러내기 위해 ‘조상’을 택했습니다.
- source_word: אַתֶּם וּבְנֵיכֶם
  english_pob_choice: you or your sons
  chosen_korean: 너희는, 너희와 너희 자손이
  alternatives_korean:
  - 너희와 너희 아들들이
  - 너희와 너희 자녀가
  lexicon: HALOT
  rationale: 히브리어의 병렬 금지 대상을 살려 ‘너희’와 ‘너희 자손’을 함께 보이되, 반복을 줄이기 위해 한국어 어순을 조정했습니다.
- source_word: עַד עוֹלָם
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 끝까지
  - 영구히
  lexicon: HALOT
  rationale: 지속 기간의 절대성을 간결하게 전달하는 현대 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: 요나답의 호칭을 친부가 아닌 선조로 이해할지 여부
  chosen_reading: ‘우리 조상 요나답’으로 번역해 씨족적/언약적 권위를 드러냈습니다.
  alternative_readings:
  - ‘우리 아버지 요나답’으로 직역
  - ‘우리 선조 요나답’으로 의역
  rationale: 본문의 אָבִינוּ는 직역상 ‘우리 아버지’이지만, 문맥상 레갑 족속의 시조를 가리키므로 청자 오해를 줄이면서도 혈통적 권위를 보존하는 번역이 필요합니다.
  doctrine_reference: 언약 공동체와 족장적 권위의 언어
- issue: 직접 명령문의 반복 대상 표현
  chosen_reading: ‘너희는, 너희와 너희 자손이, 영원히 포도주를 마시지 말라’로 두 대상을 모두 분명히 했습니다.
  alternative_readings:
  - ‘너희와 너희 자손은 영원히 포도주를 마시지 말라’
  - ‘너희는 너희 자손과 함께 영원히 포도주를 마시지 말라’
  rationale: 히브리어의 병렬 금지가 두 차례의 대상을 모두 포함하므로, 어느 쪽도 누락되지 않도록 한국어에서 병렬성을 유지했습니다.
  doctrine_reference: 본문의 문법적 병렬성 보존
