source:
  edition: WLC
  text: וַ/יְהִ֗י בַּ/עֲל֨וֹת נְבוּכַדְרֶאצַּ֥ר מֶֽלֶךְ בָּבֶל֮ אֶל הָ/אָרֶץ֒ וַ/נֹּ֗אמֶר בֹּ֚אוּ וְ/נָב֣וֹא יְרוּשָׁלִַ֔ם מִ/פְּנֵי֙ חֵ֣יל הַ/כַּשְׂדִּ֔ים וּ/מִ/פְּנֵ֖י חֵ֣יל אֲרָ֑ם וַ/נֵּ֖שֶׁב בִּ/ירוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/011.yaml
  text: But when Nebuchadnezzar king of Babylon came up against the land[a], we said, ‘Come[b], and let us go to Jerusalem because of the army of the Chaldeans and because of the army of Aram.’ So we settled in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'the Babylonians' for 'the Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' is traditionally rendered ''Syria.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 바벨의 왕 느부갓네살이 그 땅으로 올라왔을 때, 우리는 말했습니다. “오너라. 그리고 갈대아인의 군대와 아람의 군대를 피하여 예루살렘으로 가자.” 그래서 우리는 예루살렘에 머물렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아인’은 ‘바벨론 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 전통적으로 ‘시리아’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִ֗י בַּ/עֲל֨וֹת
  english_pob_choice: But when ... came up against
  chosen_korean: 그러나 ...이 그 땅으로 올라왔을 때
  alternatives_korean:
  - 그리고 ...이 그 땅에 올라왔을 때
  - '...이 그 땅을 향해 올라왔을 때'
  lexicon: HALOT
  rationale: וַיְהִי + בַּעֲלוֹת은 서술의 배경이 되는 시간 절을 이루므로, 자연스러운 한국어로 ‘...했을 때’로 풀어 연결했습니다. 앞문맥의 거처 명령과 대비되는 전환을 살려 ‘그러나’를 두었습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 그 나라
  - 그 지역
  lexicon: HALOT
  rationale: 예레미야의 הארץ는 통상 유다의 영토를 가리키므로, 본문 관용을 살려 ‘그 땅’으로 옮겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아인
  alternatives_korean:
  - 바벨론 사람들
  lexicon: HALOT
  rationale: 본문의 민족·정치적 표지를 유지하기 위해 직역적 음역인 ‘갈대아인’을 택했습니다. 영어 본문이 제시한 ‘Babylonians’ 대안은 각주로만 남기는 편이 더 분명합니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  lexicon: HALOT
  rationale: 고유명사는 원문 형태를 보존하는 것이 적절하므로 ‘아람’으로 옮겼습니다. 전통적 ‘시리아’는 의미는 통하지만 후대 관용이어서 본문보다 각주에 더 적합합니다.
- source_word: וַנֵּשֶׁב
  english_pob_choice: So we settled
  chosen_korean: 그래서 우리는 예루살렘에 머물렀습니다
  alternatives_korean:
  - 그래서 우리는 예루살렘에 정착했습니다
  - 그래서 우리는 예루살렘에 살게 되었습니다
  lexicon: HALOT
  rationale: ישב는 여기서 단순 거주 사실을 말하므로 ‘머물렀습니다’가 가장 무난하면서도 지속된 거주 상태를 자연스럽게 전달합니다.
theological_decisions:
- issue: 아람의 지칭을 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘아람’을 두고, 전통적 대응어 ‘시리아’는 각주로만 제시합니다.
  alternative_readings:
  - 본문에 ‘시리아’로 번역
  - 본문과 각주 모두 생략
  rationale: 히브리어 고유명사의 역사적·지리적 표지를 유지하는 것이 원문 추적성에 유리하며, 전통 번역어는 의미는 전달하지만 원문 고유성을 약화시킬 수 있습니다.
  doctrine_reference: source transparency / proper-name fidelity
