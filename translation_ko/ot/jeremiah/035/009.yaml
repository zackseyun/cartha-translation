  source_fidelity: ‘우리를 위해 집들을 짓지 않고’는 לְשִׁבְתֵּנוּ(‘우리가 거주하기 위해/우리의 거처로’)를 ‘우리의 유익을 위해’라는 뜻으로 바꾸어, 거주 목적을 충분히 반영하지 못합니다. 또한 이 문맥은 레갑 자손이 지켜 온 생활 규범을 회고하는 것이므로 ‘짓지 않았으며’가 자연스럽습니다.
  naturalness: ‘우리가 살 집을 짓지 않았으며’는 현대 표준 한국어에서 자연스럽고, 집을 짓는 목적도 명확히 드러냅니다. 농경 자산의 열거와 소유 부정은 현행 표현이 자연스럽습니다.
  terminology: ‘포도원’, ‘밭’, ‘씨앗’은 כֶּרֶם, שָׂדֶה, זֶרַע의 기본 의미를 충실히 보존합니다. ‘우리 것이 아니었습니다’도 לֹא יִהְיֶה לָנוּ의 소유 부정을 적절히 옮깁니다.
  issues:
