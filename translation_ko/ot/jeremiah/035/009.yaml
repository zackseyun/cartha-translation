  text: and not to build houses for us to live in[a]; and vineyard and field and seed have not been ours.
  footnotes:
  - marker: a
    text: Or, more literally, 'and vineyard and field and seed have not been ours' / 'there has not been for us vineyard, field, or seed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 우리를 위해 집들을 짓지 않고, 포도원과 밭과 씨앗도 우리 것이 아니었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘포도원과 밭과 씨앗이 우리 것이 아니었습니다’ 또는 ‘우리에게 포도원이나 밭이나 씨앗이 없었습니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבִלְתִּי
  english_pob_choice: and not to
  chosen_korean: 그리고 ... 않고
  alternatives_korean:
  - 그리고 ... 하지 않고
  - '...하지 않도록'
  lexicon: HALOT
  rationale: 부정 목적 구문을 한국어 자연문으로 옮기되, 열거된 금지/비회피의 뉘앙스를 살려 ‘... 않고’로 처리했습니다.
- source_word: בְּנוֹת בָּתִּים
  english_pob_choice: build houses
  chosen_korean: 집들을 짓지
  alternatives_korean:
  - 집을 세우지
  - 건물들을 짓지
  lexicon: HALOT
  rationale: בנה의 기본 뜻을 따라 ‘짓다’를 쓰고, בָּתִּים의 복수를 살려 ‘집들을’로 옮겼습니다.
- source_word: לְשִׁבְתֵּנוּ
  english_pob_choice: for us to live in
  chosen_korean: 우리를 위해 ...
  alternatives_korean:
  - 우리가 살 집으로
  - 우리가 거주할
  lexicon: HALOT
  rationale: 문맥상 목적을 나타내지만 한국어에서는 ‘우리를 위해 집들을 짓다’가 가장 자연스럽고, 거주 목적이 드러납니다.
- source_word: וְכֶרֶם וְשָׂדֶה וָזֶרַע
  english_pob_choice: vineyard and field and seed
  chosen_korean: 포도원과 밭과 씨앗
  alternatives_korean:
  - 포도원과 들과 씨
  - 포도원과 농지와 씨앗
  lexicon: HALOT
  rationale: 열거된 농경 자산을 가능한 한 문자적으로 유지했습니다. ‘씨앗’은 종자/파종용 씨의 기본 뜻을 보존합니다.
- source_word: לֹא יִהְיֶה לָּנוּ
  english_pob_choice: have not been ours
  chosen_korean: 우리 것이 아니었습니다
  alternatives_korean:
  - 우리에게 있지 않았습니다
  - 우리 소유가 아니었습니다
  lexicon: HALOT
  rationale: 히브리어 소유 표현 ‘우리에게 있지 않다’를 한국어의 소유 부정으로 자연스럽게 풀어, POB의 ‘have not been ours’를 반영했습니다.
theological_decisions:
- issue: 문장 마지막 소유 부정의 해석
  chosen_reading: 재산·생계 기반이 전혀 없었다는 집단적 금욕/이주 상황의 진술로 읽고, 과장 없이 소유 부정으로만 옮겼습니다.
  alternative_readings:
  - 우리가 아무것도 소유하지 않았다는 강한 빈곤 진술
  - 미래적 약속 부정으로 읽는 해석
  rationale: 본문은 과거/현재의 생활 조건을 열거하는 서술이므로, 추가 의미를 덧붙이지 않고 소유 부정 자체를 드러내는 것이 적절합니다.
  doctrine_reference: 본문 맥락 주해
