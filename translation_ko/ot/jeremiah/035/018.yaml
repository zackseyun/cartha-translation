  text: וּ/לְ/בֵ֨ית הָ/רֵכָבִ֜ים אָמַ֣ר יִרְמְיָ֗הוּ כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל יַ֚עַן אֲשֶׁ֣ר שְׁמַעְתֶּ֔ם עַל מִצְוַ֖ת יְהוֹנָדָ֣ב אֲבִי/כֶ֑ם וַֽ/תִּשְׁמְרוּ֙ אֶת כָּל מִצְוֺתָ֔י/ו וַֽ/תַּעֲשׂ֔וּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה אֶתְ/כֶֽם־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/018.yaml
  text: 'And to the house of the Rechabites Jeremiah said[a], “Thus says Yahweh of hosts, the God of Israel: Because you have obeyed the command of Jehonadab your father, and have kept all his commands, and have done according to all that he commanded you,”'
  footnotes:
  - marker: a
    text: Hebrew Jehonadab; elsewhere often spelled Jonadab in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 레갑 사람들의 가문에게 예레미야가 말했습니다. 「만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. ‘너희가 너희 아버지 여호나답의 명령에 순종하고, 그의 모든 명령을 지키며, 그가 너희에게 명령한 모든 대로 행하였으므로,’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 여호나답(יְהוֹנָדָב)입니다. 영어에서는 Jehonadab으로 음역하며, 다른 곳에서는 Jonadab으로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְבֵית הָרֵכָבִים
  english_pob_choice: And to the house of the Rechabites
  chosen_korean: 레갑 사람들의 집에
  alternatives_korean:
  - 레갑 사람들의 가문에
  - 레갑 사람들의 가족에게
  lexicon: HALOT
  rationale: בַּיִת는 이 문맥에서 단순한 건물이 아니라 혈연·가문 공동체를 가리키므로, POB의 'house'에 맞춰 '집'을 유지하되 한국어에서는 소속을 분명히 하려고 '사람들의 집'으로 옮겼습니다.
- source_word: אָמַר יִרְמְיָהוּ
  english_pob_choice: Jeremiah said
  chosen_korean: 예레미야가 말했습니다
  alternatives_korean:
  - 예레미야가 말하였습니다
  - 예레미야가 이르렀습니다
  lexicon: HALOT
  rationale: 서술형 보고 동사로는 '말했습니다'가 가장 자연스럽고, 예언자 발화의 직접성을 유지합니다.
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Thus says Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼 만군의 하나님, 이스라엘의 하나님께서 이렇게 말씀하십니다
  - 만군의 야훼, 이스라엘의 하나님께서 이같이 말씀하시기를
  lexicon: HALOT
  rationale: כֹּה אָמַר의 예언자 공식을 '이렇게 말씀하십니다'로 옮겨 현대적이되 격식을 유지했고, יְהוָה는 본문 원칙에 따라 '야훼'로, צְבָאוֹת은 '만군의'로 옮겼습니다.
- source_word: שְׁמַעְתֶּם עַל מִצְוַת יְהוֹנָדָב אֲבִיכֶם
  english_pob_choice: Because you have obeyed the command of Jehonadab your father
  chosen_korean: 너희가 너희 아버지 여호나답의 명령에 순종하여
  alternatives_korean:
  - 너희가 너희 아버지 여호나답의 명령을 들었기에
  - 너희가 너희 아버지 요나답의 명령에 순종하여
  lexicon: HALOT
  rationale: שׁמע עם עַל은 단순 청취가 아니라 순종의 의미이므로 '순종하다'를 택했고, 인명은 본문의 형태를 반영해 '여호나답'으로 옮겼습니다.
- source_word: וַתִּשְׁמְרוּ אֶת כָּל מִצְוֺתָיו וַתַּעֲשׂוּ כְּכֹל אֲשֶׁר צִוָּה אֶתְכֶם
  english_pob_choice: and have kept all his commands, and have done according to all that he commanded you
  chosen_korean: 그의 모든 명령을 지키고, 그가 너희에게 명령한 모든 것을 그대로 행했기 때문입니다
  alternatives_korean:
  - 그의 모든 명령을 지키고, 그가 너희에게 명령한 모든 대로 행했기 때문입니다
  - 그의 모든 명령을 지키며, 그가 너희에게 명령한 바를 다 행했기 때문입니다
  lexicon: HALOT
  rationale: שׁמר는 '지키다'로, צוה는 반복되는 '명령하다'로 살려서 명령-순종의 대응을 분명히 했고, כְּכֹל은 '그대로/모든 것을'로 반영해 'according to'의 기준성을 유지했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: וְהָיָה / יְהוָה를 '야훼'로 표기하고 титул '만군의'와 결합했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 신명기를 대체하는 칭호가 아니라 언약 이름을 직접 사용하므로, POB 원칙에 따라 고유명 '야훼'를 유지하는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 예언자 공식의 직접화법
  chosen_reading: כֹּה אָמַר를 현대 한국어의 직접 화법으로 처리해 “이렇게 말씀하십니다”로 옮겼습니다.
  alternative_readings:
  - 이와 같이 말씀하십니다
  - 주께서 이같이 말씀하시기를
  rationale: 이 구절은 신탁 도입부이므로, 완곡한 간접체보다 직접화법이 권위와 선언성을 더 잘 드러냅니다.
  doctrine_reference: Jeremiah prophetic formula
