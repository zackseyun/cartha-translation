  terminology: 야훼, 만군, 이스라엘의 하나님, 여호나답은 일관되고 적절합니다. יְהוֹנָדָב의 한국어 음역 ‘여호나답’은 히브리어 형태를 반영하며, 요나답이라는 축약형과 혼동하지 않습니다.
