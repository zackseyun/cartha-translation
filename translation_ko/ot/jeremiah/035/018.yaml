  source_fidelity: 원문의 לְבֵית는 레갑 사람들의 물리적 ‘집’이 아니라 가문/집단을 가리키며, 수신자는 ‘가문에게’로 옮기는 것이 정확합니다. 또한 이 절의 כי 절은 다음 절의 결론으로 이어지므로, 종결형 ‘때문입니다’가 아니라 미완결의 인과 연결을 보존해야 합니다.
