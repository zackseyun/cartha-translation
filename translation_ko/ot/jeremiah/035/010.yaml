id: JER.35.10
reference: Jeremiah 35:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נֵּ֖שֶׁב בָּֽ/אֳהָלִ֑ים וַ/נִּשְׁמַ֣ע וַ/נַּ֔עַשׂ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יוֹנָדָ֥ב אָבִֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/010.yaml
  text: So we have lived in tents[b][a], and we have obeyed and done all that Jonadab our father commanded us.
  footnotes:
  - marker: a
    text: Or 'we listened and did'; Hebrew 'heard' often carries the sense of obedient response.
    reason: lexical_alternative
  - marker: b
    text: Jonadab can also be spelled 'Jehonadab' in English.
    reason: alternative_reading
translation:
  language: ko
  text: 우리는 천막에서 살았고, 우리 아버지 요나답[b]이 우리에게 명령한 모든 것을 듣고[a] 행하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁמע는 명령과 함께 쓰일 때 ‘듣다’를 넘어 ‘순종하다’의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 요나답은 영어 성경에서 ‘Jehonadab’으로도 표기됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַנֵּשֶׁב בָּאֳהָלִים
  english_pob_choice: we have lived in tents
  chosen_korean: 우리는 천막 안에 살았고
  alternatives_korean:
  - 우리는 장막에 살았고
  - 우리는 텐트들 안에 살았고
  lexicon: HALOT
  rationale: ישׁב는 이 문맥에서 거주를 뜻하므로 '살았고'로 옮겼고, בָּאֳהָלִים은 관용적으로 복수의 거처 방식을 가리키므로 '천막 안에'로 자연스럽게 처리했습니다.
- source_word: וַנִּשְׁמַע
  english_pob_choice: we have obeyed
  chosen_korean: 듣고 행하였습니다
  alternatives_korean:
  - 순종하였습니다
  - 들었습니다
  lexicon: HALOT
  rationale: שׁמע가 명령과 함께 쓰일 때는 단순 청취보다 복종의 응답을 뜻하므로, 한국어에서는 본문 속 병렬 구조를 살려 '듣고 행하였습니다'로 옮겼습니다.
- source_word: וַנַּעַשׂ
  english_pob_choice: and done
  chosen_korean: 행하였습니다
  alternatives_korean:
  - 하였습니다
  - 실행하였습니다
  lexicon: HALOT
  rationale: עשה는 앞의 '듣다'와 짝을 이루며 실제 이행을 나타내므로, '행하다'를 사용해 명령 준수의 완결성을 드러냈습니다.
- source_word: יוֹנָדָב אָבִינוּ
  english_pob_choice: Jonadab our father
  chosen_korean: 요나답 우리 아버지
  alternatives_korean:
  - 여호나답 우리 아버지
  - 요나답 우리 조상
  lexicon: 표준 음역 및 문맥
  rationale: 이름은 히브리어 자음형에 맞춰 '요나답'으로 옮겼고, אָבִינוּ는 혈연적 호칭을 유지해 '우리 아버지'로 직역했습니다.
theological_decisions:
- issue: שׁמע의 의미를 '듣다'와 '순종하다' 중 어떻게 표현할지
  chosen_reading: '''듣고 행하였습니다''로 옮겨, 들음이 곧 순종의 응답임을 드러냈습니다.'
  alternative_readings:
  - '''순종하였습니다'''
  - '''들었습니다'''
  rationale: 이 구절은 언약적 충성의 자기진술이므로, 단순 청각보다 명령에 대한 응답을 나타내는 히브리어 관용을 한국어에서 보존하는 것이 더 적절합니다.
  doctrine_reference: 히브리어 שׁמע의 관용적 용법
- issue: 관계 호칭 אָבִינוּ의 범위
  chosen_reading: 문맥상 씨족의 선조를 가리키지만, 본문 표면형을 따라 '우리 아버지'를 유지했습니다.
  alternative_readings:
  - 우리 조상
  - 우리 선조
  rationale: 의미 확장은 가능하지만, 원문이 가족-권위 구조를 직접적으로 말하므로 해석을 덧붙이지 않고 직역적 표현을 유지했습니다.
  doctrine_reference: 본문-문맥 우선 원칙
