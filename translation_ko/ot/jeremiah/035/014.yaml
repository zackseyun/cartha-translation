revisions:
- from: 레갑의 아들 여호나답이 자기 아들들에게 포도주를 마시지 말라고 명령한 그 말들은 지켜져서, 그들은 오늘날까지 포도주를 마시지 않았습니다. 이는 그들이 아버지의 명령을 따랐기 때문입니다. 그러나 나는 너희에게 일찍부터 일어나 말했으나, 너희는 내 말을 듣지 않았습니다.[a][b]
  to: 레갑의 아들 여호나답[a]이 자기 아들들에게 포도주를 마시지 말라고 한 명령은 지켜졌습니다. 그들은 오늘날까지 포도주를 마시지 않았습니다. 이는 그들이 아버지의 명령에 순종하였기 때문입니다. 그러나 나는 일찍 일어나 너희에게 말하였으나[b], 너희는 내 말을 듣지 않았습니다.
  rationale: 문장 주어를 원문의 명령 내용에 맞게 명료화하고, 수동 연결 표현을 자연스러운 완결문으로 고쳤습니다. ‘일찍 일어나 말하다’라는 원문의 표현은 보존하되 각주를 해당 관용구에 직접 연결했습니다. 하나님의 말씀을 듣지 않은 행위를 별도의 교리적 표현으로 확대하지 않았습니다.
  reviewer_model: gpt-5.6-terra
