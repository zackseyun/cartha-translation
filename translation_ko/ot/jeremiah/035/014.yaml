source:
  edition: WLC
  text: הוּקַ֡ם אֶת דִּבְרֵ֣י יְהוֹנָדָ֣ב בֶּן רֵ֠כָב אֲשֶׁר צִוָּ֨ה אֶת בָּנָ֜י/ו לְ/בִלְתִּ֣י שְׁתֽוֹת יַ֗יִן וְ/לֹ֤א שָׁתוּ֙ עַד הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י שָֽׁמְע֔וּ אֵ֖ת מִצְוַ֣ת אֲבִי/הֶ֑ם וְ/אָ֨נֹכִ֜י דִּבַּ֤רְתִּי אֲלֵי/כֶם֙ הַשְׁכֵּ֣ם וְ/דַבֵּ֔ר וְ/לֹ֥א שְׁמַעְתֶּ֖ם אֵלָֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/014.yaml
  text: The words of Jehonadab son of Rechab[a], which he commanded his sons—not to drink wine—have been upheld, and they have not drunk wine to this day, because they have obeyed the command of their father. But I have spoken to you, rising early and speaking[b], and you have not listened to me.
  footnotes:
  - marker: a
    text: Or 'Jonadab' for 'Jehonadab.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''rising early and speaking,'' expressing persistent, diligent address.'
    reason: cultural_note
translation:
  language: ko
  text: 레갑의 아들 여호나답[a]이 자기 아들들에게 포도주를 마시지 말라고 한 명령은 지켜졌습니다. 그들은 오늘날까지 포도주를 마시지 않았습니다. 이는 그들이 아버지의 명령에 순종하였기 때문입니다. 그러나 나는 일찍 일어나 너희에게 말하였으나[b], 너희는 내 말을 듣지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요나답’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘일찍 일어나 말하다’는 끈질기고 성실하게 거듭 말함을 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: הוּקַם
  english_pob_choice: have been upheld
  chosen_korean: 지켜져서
  alternatives_korean:
  - 지켜졌습니다
  - 유지되어 왔습니다
  - 실행되어 왔습니다
  lexicon: HALOT
  rationale: 완료·수동의 뉘앙스를 살리되, 이어지는 순종의 문맥에 맞게 한국어로는 ‘지켜지다’가 가장 자연스럽습니다.
- source_word: דִּבְרֵי יְהוֹנָדָב
  english_pob_choice: the words of Jehonadab
  chosen_korean: 레갑의 아들 여호나답이
  alternatives_korean:
  - 여호나답의 말
  - 여호나답의 명령
  lexicon: HALOT
  rationale: 히브리어의 ‘말들’은 뒤의 명령 내용으로 구체화되므로, 한국어에서는 인물 소개를 앞세우고 본문의 권위 관계를 자연스럽게 드러냈습니다.
- source_word: לְבִלְתִּי שְׁתוֹת יַיִן
  english_pob_choice: not to drink wine
  chosen_korean: 포도주를 마시지 말라고
  alternatives_korean:
  - 포도주를 마시지 않도록
  - 술을 마시지 말라고
  lexicon: HALOT
  rationale: 금지 표현을 직접적으로 살리기 위해 ‘마시지 말라고’로 옮겼고, יַיִן은 전통적으로 ‘포도주’가 더 정확합니다.
- source_word: שָׁמְעוּ אֵת מִצְוַת אֲבִי/הֶם
  english_pob_choice: have obeyed the command of their father
  chosen_korean: 아버지의 명령을 따랐기 때문입니다
  alternatives_korean:
  - 아버지의 명령에 순종했기 때문입니다
  - 아버지의 명령을 들었기 때문입니다
  lexicon: HALOT
  rationale: שמע는 여기서 단순 청취가 아니라 순종의 뜻이므로 ‘따르다’로 자연스럽게 풀되, 원문의 인과관계를 보존했습니다.
- source_word: הַשְׁכֵּם וְדַבֵּר
  english_pob_choice: rising early and speaking
  chosen_korean: 일찍부터 일어나 말했으나
  alternatives_korean:
  - 일찍 일어나 말했으나
  - 새벽부터 일어나 말했으나
  - 부지런히 말했으나
  lexicon: HALOT
  rationale: 히브리어 관용구의 반복적·부지런한 어조를 유지하면서도 한국어 문장 흐름에 맞게 압축했습니다.
- source_word: וְלֹא שְׁמַעְתֶּם אֵלָי
  english_pob_choice: and you have not listened to me
  chosen_korean: 너희는 내 말을 듣지 않았습니다
  alternatives_korean:
  - 너희는 내게 귀를 기울이지 않았습니다
  - 너희는 내 말을 듣지 않았습니다
  lexicon: HALOT
  rationale: 여기서는 하나님의 말씀에 대한 불순종을 ‘내 말을 듣다’로 가장 सीधे하게 드러내는 것이 원문 대조를 살립니다.
theological_decisions:
- issue: 레갑 사람의 아버지 명령과 하나님의 지속적 말씀 사이의 대조
  chosen_reading: 아들의 순종은 ‘아버지의 명령을 따름’으로, 하나님의 권면 거절은 ‘내 말을 듣지 않음’으로 대조해, 본문이 세우는 윤리적 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 명시적으로 ‘불순종’이라고 풀어 쓰기
  - ‘하나님의 경고를 거부했다’로 확장하기
  rationale: 본문은 설명을 덧붙이기보다 두 순종의 대비를 통해 독자를 설득하므로, 해석을 과잉하지 않고 대비 구조를 보존하는 것이 더 충실합니다.
  doctrine_reference: 본문 중심 번역 원칙; 해석의 과잉 확장 금지
