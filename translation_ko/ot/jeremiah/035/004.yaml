  text: וָ/אָבִ֤א אֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל לִשְׁכַּ֗ת בְּנֵ֛י חָנָ֥ן בֶּן יִגְדַּלְיָ֖הוּ אִ֣ישׁ הָ/אֱלֹהִ֑ים אֲשֶׁר אֵ֨צֶל֙ לִשְׁכַּ֣ת הַ/שָּׂרִ֔ים אֲשֶׁ֣ר מִ/מַּ֗עַל לְ/לִשְׁכַּ֛ת מַעֲשֵׂיָ֥הוּ בֶן שַׁלֻּ֖ם שֹׁמֵ֥ר הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/004.yaml
  text: So I brought them into the house of Yahweh[a], into the chamber of the sons of Hanan son of Igdaliah, the man of God, which was beside the chamber of the officials, which was above the chamber of Maaseiah son of Shallum[c][b], the keeper of the threshold.
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''The sons of Hanan'' may refer to Hanan''s descendants, household, or associated group.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the doorkeeper.' Literally, 'the keeper of the threshold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 제가 그들을 야훼의 집으로 데리고 갔습니다. 곧 한 사람은 학난의 아들 이그달랴후의 아들들의 방으로 — 그는 하나님의 사람이었는데 — 갔고, 그 방은 관리들의 방 곁에 있었으며, 그곳은 문지기의 방 위쪽에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘학난의 아들들’은 학난의 후손, 집안, 또는 관련 집단을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되, POB의 야훼 표기를 따라 ‘야훼의 집’으로 옮겼습니다. ‘성전’은 의미는 맞지만 원문 표현을 덜 직접적으로 드러냅니다.
- source_word: לִשְׁכַּת בְּנֵי חָנָן
  english_pob_choice: the chamber of the sons of Hanan
  chosen_korean: 학난의 아들들의 방
  alternatives_korean:
  - 학난의 아들들의 방
  - 학난 가문의 방
  - 학난의 집안 사람들의 방
  lexicon: HALOT
  rationale: לִשְׁכָּה를 건축적 용례에 맞게 ‘방’으로 옮기고, בְּנֵי חָנָן은 POB 주해대로 혈통일 수도, 집안/무리일 수도 있어 가장 문자적인 ‘아들들’을 유지했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 사람
  - 하나님 사람
  - 하나님의 종
  lexicon: HALOT
  rationale: 이 관용구는 예언자적 존칭으로 굳어져 있으므로, 한국어에서도 자연스럽고 문맥상 명확한 ‘하나님의 사람’으로 옮겼습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들의 방
  alternatives_korean:
  - 관리들의 방
  - 지도자들의 방
  - 고관들의 방
  lexicon: HALOT
  rationale: שרים은 문맥상 왕자보다 행정·궁정 관계의 ‘관리들’이 더 자연스러워, 현대 한국어에서 기능을 드러내는 표현을 택했습니다.
- source_word: שֹׁמֵר הַסַּף
  english_pob_choice: the keeper of the threshold
  chosen_korean: 문지기
  alternatives_korean:
  - 문지기
  - 문간을 지키는 사람
  - 문턱을 지키는 사람
  lexicon: HALOT
  rationale: POB가 문자적으로는 ‘threshold keeper’를 유지했지만, 한국어에서는 직역의 어색함을 줄이면서도 직분을 드러내는 ‘문지기’가 가장 읽기 자연합니다.
theological_decisions:
- issue: 야훼 신명 표기
  chosen_reading: 원문의 יְהוָה를 그대로 반영해 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 신명 원칙을 따르며, 본문이 가리키는 언약 이름을 가려버리지 않기 위해 관용적 대체어보다 고유 신명 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
