revisions:
- from: 그래서 제가 그들을 야훼의 집으로 데리고 갔습니다. 곧 한 사람은 학난의 아들 이그달랴후의 아들들의 방으로 — 그는 하나님의 사람이었는데 — 갔고, 그 방은 관리들의 방 곁에 있었으며, 그곳은 문지기의 방 위쪽에 있었습니다.[a]
  to: 그래서 저는 그들을 야훼의 집으로, 곧 하나님의 사람 이그달랴후의 아들 하난의 아들들의 방으로 데리고 갔습니다. 그 방은 관리들의 방 곁에 있었고, 그 관리들의 방은 문지기 살룸의 아들 마아세야의 방 위에 있었습니다.[a]
  rationale: 원문의 화자와 동작을 회복하고, 누락·오역된 인명 및 건축 공간 관계를 모두 보완했습니다. ‘하난의 아들들’의 범위가 혈통상 후손에 한정되는지 여부는 확정하지 않고 각주로 열어 두었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:33Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 ‘학난’을 잘못 표기했고, ‘한 사람은 … 갔고’라는 내용을 원문에 없이 삽입하여 화자(‘저’)가 그들을 데리고 갔다는 핵심 서술을 훼손합니다. 또한 방들의 위치 관계와 마아세야의 이름이 빠져 있습니다. 수정문은 하난─이그달랴후의 부자 관계, 관리들의 방과 마아세야의 방의 위치 관계를 원문 순서대로 반영합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽게 읽히도록 긴 수식 연쇄를 두 문장으로 나누었습니다. 두 번째 ‘그 방’이 관리들의 방을 가리키도록 ‘그 관리들의 방’으로 명시하여 공간 관계의 지시 대상이 흐려지지 않게 했습니다.
  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로, אִישׁ הָאֱלֹהִים은 ‘하나님의 사람’으로 옮겼습니다. לִשְׁכָּה는 성전 건물의 방이라는 건축적 의미를 보존해 ‘방’으로, שֹׁמֵר הַסַּף는 자연스러운 직무명인 ‘문지기’로 옮겼습니다. 인명은 하난, 이그달랴후, 마아세야, 살룸으로 바로잡았습니다.
  issues:
  - severity: high
    issue: 원문에 없는 ‘한 사람은 … 갔고’가 삽입되어 서술의 주체와 사건이 바뀌었습니다.
    rationale: וָאָבִא אֹתָם은 ‘그래서/그리고 내가 그들을 데리고 갔다’이며, 이 절에는 별도의 인물이 이동했다는 내용이 없습니다.
  - severity: high
    issue: ‘학난’은 חָנָן(Hanan)의 부정확한 음역이며, 마아세야의 이름과 해당 방의 언급이 누락되었습니다.
    rationale: 인명은 본문의 식별 정보이고, מַעֲשֵׂיָהוּ בֶן־שַׁלֻּם은 공간 관계를 설명하는 필수 구성 요소입니다.
  - severity: high
    issue: 방들의 공간 관계가 불완전하고 지시 대상이 불명확합니다.
    rationale: 하난의 아들들의 방은 관리들의 방 ‘곁’에 있고, 관리들의 방은 마아세야의 방 ‘위’에 있다는 두 관계를 모두 보존해야 합니다.
  revised_text: 그래서 저는 그들을 야훼의 집으로, 곧 하나님의 사람 이그달랴후의 아들 하난의 아들들의 방으로 데리고 갔습니다. 그 방은 관리들의 방 곁에 있었고, 그 관리들의 방은 문지기 살룸의 아들 마아세야의 방 위에 있었습니다.[a]
