    rationale: אֲשֶׁר דִּבַּרְתִּי עֲלֵיהֶם은 이 문맥에서 그들에게 임할 재앙을 그들을 향하여 선포했다는 뜻입니다. ‘그들에게 내리겠다고 말한’은 이를 자연스럽게 명시하면서 의미를 과도하게 확장하지 않습니다.
