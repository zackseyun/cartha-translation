revisions:
- from: 그러므로 야훼, 만군의 하나님, 이스라엘의 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 유다와 예루살렘의 모든 주민에게, 내가 그들에 대하여 말한 모든 재앙을 가져오고 있습니다. 이는 내가 그들에게 말하였으나 그들이 듣지 않았고, 내가 불렀으나 그들이 대답하지 않았기 때문입니다.[a]
  to: 그러므로 만군의 하나님, 이스라엘의 하나님이신 야훼께서 이렇게 말씀하십니다. “보십시오, 내가 유다와 예루살렘의 모든 주민에게, 내가 그들에게 내리겠다고 말한 모든 재앙[a]을 내리겠다. 이는 내가 그들에게 말하였으나 그들이 듣지 않았고, 내가 그들을 불렀으나 그들이 대답하지 않았기 때문이다.”
  rationale: 심판의 재앙이 ‘그들에게’ 임하도록 이미 선포되었다는 원문의 의미를 명료하게 하고, 한국어 신적 칭호의 연결을 다듬었으며, 어휘 각주 표지를 해당 단어에 붙였습니다. 원문의 인과 관계와 반복되는 ‘말함/듣지 않음, 부름/대답하지 않음’ 구조는 유지했습니다.
  reviewer_model: gpt-5.6-terra
