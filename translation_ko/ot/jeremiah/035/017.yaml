id: JER.35.17
reference: Jeremiah 35:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֤י צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֧י מֵבִ֣יא אֶל יְהוּדָ֗ה וְ/אֶ֤ל כָּל יֽוֹשְׁבֵי֙ יְר֣וּשָׁלִַ֔ם אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתִּי עֲלֵי/הֶ֑ם יַ֣עַן דִּבַּ֤רְתִּי אֲלֵי/הֶם֙ וְ/לֹ֣א שָׁמֵ֔עוּ וָ/אֶקְרָ֥א לָ/הֶ֖ם וְ/לֹ֥א עָנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/017.yaml
  text: 'Therefore[a], thus says Yahweh, the God of hosts, the God of Israel: Behold, I am bringing on Judah and on all the inhabitants of Jerusalem all the disaster that I have spoken against them, because I spoke to them and they did not listen, and I called to them and they did not answer.'
  footnotes:
  - marker: a
    text: Or 'all the calamity.' The Hebrew word can also be rendered 'evil' in other contexts, but here it refers to announced judgment coming upon Judah and Jerusalem.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼, 만군의 하나님, 이스라엘의 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 유다와 예루살렘의 모든 주민에게, 내가 그들에 대하여 말한 모든 재앙을 가져오고 있습니다. 이는 내가 그들에게 말하였으나 그들이 듣지 않았고, 내가 불렀으나 그들이 대답하지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הָרָעָה는 다른 문맥에서는 '악'으로도 옮길 수 있지만, 여기서는 유다와 예루살렘 위에 내릴 선포된 심판, 곧 '재앙'을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 앞선 문맥의 결론을 잇는 접속어이므로, 예언적 논리 관계를 살리는 가장 자연스러운 한국어로 옮겼습니다.
- source_word: כֹּה אָמַר
  english_pob_choice: thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 선포 공식을 현대 합쇼체로 살리되, 직설적 인용의 무게를 유지했습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of hosts, the God of Israel
  chosen_korean: 야훼, 만군의 하나님, 이스라엘의 하나님
  alternatives_korean:
  - 야훼, 천군의 하나님, 이스라엘의 하나님
  - 야훼, 만군의 주 하나님, 이스라엘의 하나님
  lexicon: HALOT
  rationale: 하나님의 이름은 프로젝트 기본값에 따라 야훼로 두고, 나머지 두 수식은 מקור의 병렬 호칭 구조를 그대로 유지했습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 주의하십시오, 내가
  lexicon: HALOT
  rationale: 선언의 긴박성과 주목 요청을 살리면서도, 현대 한국어에서 자연스러운 예언적 도입으로 조정했습니다.
- source_word: כָּל הָרָעָה
  english_pob_choice: all the disaster
  chosen_korean: 모든 재앙
  alternatives_korean:
  - 모든 재난
  - 모든 화
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 רָעָה는 도덕적 악보다 임박한 징벌/재난을 뜻하므로, 신학적 오해를 피하는 한국어로 옮겼습니다.
- source_word: דִּבַּרְתִּי עֲלֵיהֶם
  english_pob_choice: I have spoken against them
  chosen_korean: 내가 그들에 대하여 말한
  alternatives_korean:
  - 내가 그들을 향하여 말한
  - 내가 그들에 관해 말한
  lexicon: HALOT
  rationale: judgment 선포의 대상을 가리키는 전치사적 의미를 반영하되, 한국어에서는 과도한 대립 어감을 피하고 원문의 문법 관계를 드러냈습니다.
- source_word: וְלֹא שָׁמֵעוּ וָאֶקְרָא לָהֶם וְלֹא עָנוּ
  english_pob_choice: and they did not listen... and they did not answer
  chosen_korean: 그들이 듣지 않았고, 내가 불렀으나 그들이 대답하지 않았기 때문입니다
  alternatives_korean:
  - 그들이 듣지 않았고, 내가 불러도 응답하지 않았기 때문입니다
  - 그들이 듣지 않았고, 내가 불렀는데도 대답하지 않았기 때문입니다
  lexicon: HALOT
  rationale: 반복되는 청각-응답 구조를 유지하여, 하나님 말씀에 대한 거절과 부르심에 대한 무응답의 대조를 분명히 했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 '야훼'를 써서 언약적 고유명과 번역상의 투명성을 보존했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: הָרָעָה의 의미 범위
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 여기서는 도덕적 악이 아니라 유다와 예루살렘 위에 임하는 선포된 심판을 가리키므로, 하나님이 '악'을 행하신다는 오해를 피하면서도 심판의 무게를 전달했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
