source:
  edition: WLC
  text: וָ/אֶקַּ֞ח אֶת יַאֲזַנְיָ֤ה בֶֽן יִרְמְיָ֨הוּ֙ בֶּן חֲבַצִּנְיָ֔ה וְ/אֶת אֶחָ֖י/ו וְ/אֶת כָּל בָּנָ֑י/ו וְ/אֵ֖ת כָּל בֵּ֥ית הָ/רֵכָבִֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/003.yaml
  text: So I took Jaazaniah son of Jeremiah[a], son of Habazziniah, and his brothers, and all his sons[b], and the whole house of the Rechabites.
  footnotes:
  - marker: a
    text: Or “Then I took” or “And I took.” The Hebrew narrative form can be rendered in several natural English ways.
    reason: lexical_alternative
  - marker: b
    text: “House” here means the household or clan of the Rechabites, not merely a physical building.
    reason: cultural_note
translation:
  language: ko
  text: 그래서 내가 하바찌냐의 아들 예레미야의 아들 야아사냐와 그의 형제들과 그의 모든 아들들과 레갑 사람들의 온 집안을 데려왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶקַּח
  english_pob_choice: So I took
  chosen_korean: 그래서 내가 데려왔습니다
  alternatives_korean:
  - 그리하여 내가 취했습니다
  - 그리고 내가 데려왔습니다
  - 그때 내가 데려왔습니다
  lexicon: HALOT
  rationale: 서술 연결을 살리면서 한국어에서는 사람을 ‘취하다’보다 ‘데려오다/데려왔습니다’가 더 자연스럽고, 이어지는 명령 이행 문맥에도 잘 맞습니다.
- source_word: בֶּן / בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 자손
  - 후손
  lexicon: HALOT
  rationale: 족보 구조를 직접적으로 드러내는 기본 의미를 따라 ‘아들’로 옮겼습니다.
- source_word: אֶחָיו
  english_pob_choice: his brothers
  chosen_korean: 그의 형제들
  alternatives_korean:
  - 그의 친족들
  - 그의 동족들
  lexicon: HALOT
  rationale: 문맥상 הרחב한 친족보다 직접적인 혈족 관계를 가리키는 ‘형제들’이 가장 투명합니다.
- source_word: כָּל בֵּית הָרֵכָבִים
  english_pob_choice: the whole house of the Rechabites
  chosen_korean: 레갑 사람들의 온 집안
  alternatives_korean:
  - 레갑 사람들의 온 가문
  - 레갑 사람들의 모든 집안
  lexicon: HALOT
  rationale: ‘집’은 여기서 건물이 아니라 가문/가계의 집합을 뜻하므로, 한국어에서는 오해를 줄이기 위해 ‘집안’으로 풀었습니다.
