  naturalness: 수정문은 한국어 계보 표현의 자연스러운 어순을 따르며, 사람들을 목적어로 하는 לקח를 ‘데려왔습니다’로 자연스럽게 옮깁니다.
  terminology: ‘형제들’, ‘모든 아들’, ‘레갑 사람들의 온 집안’은 각각 원문의 직접적 친족 관계, 남성 복수 표현, 레갑 사람들의 공동체적 ‘집/가문’을 적절히 반영합니다. 하바찌냐는 히브리어 חבצניה의 자음 중첩을 반영한 음역입니다.
