  - 그들에게 포도주를 드십시오
  lexicon: HALOT
  rationale: שׁקה의 사역적 의미를 살려 ‘마시게 하다’로 옮겼고, ‘포도주’는 יָיִן의 가장 직접적인 대응입니다.
