  lexicon: HALOT
  rationale: 문자가 ‘집’(בֵּית)이라고 말하므로 해석적 대체어인 ‘성전’보다, 본문의 구조를 보존하는 ‘야훼의 집’을 택했습니다.
- source_word: אַחַת הַלְּשָׁכוֹת
  english_pob_choice: one of the chambers
  chosen_korean: 방들 가운데 하나로
  alternatives_korean:
  - 방들 가운데 하나로
  - 방 하나로
  - 골방들 가운데 하나로
  lexicon: HALOT
  rationale: לְשָׁכוֹת는 성전 구역의 방/방들로 쓰이므로, 현대 한국어에서는 ‘방들 가운데 하나’가 과도한 고어화 없이 의미를 전달합니다.
- source_word: וְהִשְׁקִיתָ אוֹתָם יָיִן
  english_pob_choice: give them wine to drink
  chosen_korean: 그들에게 포도주를 마시게 하십시오
  alternatives_korean:
