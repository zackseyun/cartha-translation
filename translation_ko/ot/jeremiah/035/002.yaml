source:
  edition: WLC
  text: הָלוֹךְ֮ אֶל בֵּ֣ית הָ/רֵכָבִים֒ וְ/דִבַּרְתָּ֣ אוֹתָ֔/ם וַ/הֲבִֽאוֹתָ/ם֙ בֵּ֣ית יְהוָ֔ה אֶל אַחַ֖ת הַ/לְּשָׁכ֑וֹת וְ/הִשְׁקִיתָ֥ אוֹתָ֖/ם יָֽיִן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레갑 사람들의 집으로 가서 그들에게 말하고, 그들을 야훼의 집으로 데려다가, 방들 가운데 하나로 들어가게 한 뒤, 그들에게 포도주를 마시게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָלוֹךְ
  english_pob_choice: Go
  chosen_korean: 가십시오
  alternatives_korean:
  - 가세요
  - 가십시오
  lexicon: HALOT
  rationale: 히브리어 명령형 הלך의 직접적 명령을 자연스러운 합쇼체로 옮겼습니다.
- source_word: בֵּית הָרֵכָבִים
  english_pob_choice: the house of the Rechabites
  chosen_korean: 레갑 사람들의 집
  alternatives_korean:
  - 레갑 사람들의 가문
  - 레갑 사람들의 가족
  lexicon: HALOT
  rationale: בֵּית는 문맥상 혈연 집단/가문을 가리키므로, 한국어에서는 소속 집단을 드러내는 ‘레갑 사람들의 집’이 가장 직역적이면서도 이해 가능합니다.
- source_word: וְדִבַּרְתָּ אוֹתָם
  english_pob_choice: speak to them
  chosen_korean: 그들에게 말하고
  alternatives_korean:
  - 그들과 말하고
  - 그들에게 말하여
  lexicon: HALOT
  rationale: דבר + אֵת/אֹתָם의 단순한 ‘말하다’ 의미를 살려, 과도한 격식 없이 자연스러운 서술형 명령으로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: 문자가 ‘집’(בֵּית)이라고 말하므로 해석적 대체어인 ‘성전’보다, 본문의 구조를 보존하는 ‘야훼의 집’을 택했습니다.
- source_word: אַחַת הַלְּשָׁכוֹת
  english_pob_choice: one of the chambers
  chosen_korean: 방들 가운데 하나로
  alternatives_korean:
  - 방들 가운데 하나로
  - 방 하나로
  - 골방들 가운데 하나로
  lexicon: HALOT
  rationale: לְשָׁכוֹת는 성전 구역의 방/방들로 쓰이므로, 현대 한국어에서는 ‘방들 가운데 하나’가 과도한 고어화 없이 의미를 전달합니다.
- source_word: וְהִשְׁקִיתָ אוֹתָם יָיִן
  english_pob_choice: give them wine to drink
  chosen_korean: 그들에게 포도주를 마시게 하십시오
  alternatives_korean:
  - 그들에게 포도주를 주어 마시게 하십시오
  - 그들에게 포도주를 드십시오
  lexicon: HALOT
  rationale: שׁקה의 사역적 의미를 살려 ‘마시게 하다’로 옮겼고, ‘포도주’는 יָיִן의 가장 직접적인 대응입니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 역본의 기본 원칙에 따라 신적 고유명사를 칭호로 바꾸지 않고 음역형 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
