base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/002.yaml
  text: Go to the house of the Rechabites[a], and speak to them, and bring them to the house of Yahweh, into one of the chambers, and give them wine to drink.
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 레갑 사람들의 집안에 가서 그들에게 말하고, 그들을 야훼의 집[a] 안에 있는 방들 가운데 하나로 데려가 포도주를 마시게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전’. 직역하면 ‘야훼의 집’입니다.
    reason: בֵּית יְהוָה의 문자적 표현을 본문에 보존하면서, 문맥상 성전을 가리키는 일반적 이해를 대안으로 제시합니다.
lexical_decisions:
