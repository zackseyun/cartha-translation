base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/019.yaml
  text: 'Therefore thus says Yahweh of hosts[b][a], the God of Israel: Jonadab the son of Rechab shall never lack a man standing before me all the days.'
  footnotes:
  - marker: a
    text: Or, more literally, 'shall not be cut off from Jonadab son of Rechab a man standing before me all the days.'
    reason: lexical_alternative
  - marker: b
    text: '''Standing before me'' may denote service in God''s presence; the text does not specify a particular office.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. “레갑의 아들 여호나답에게는 내 앞에 서 있는 사람[b]이 모든 날 동안 끊어지지 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘레갑의 아들 여호나답에게서 내 앞에 서 있는 사람이 모든 날 동안 끊어지지 않을 것이다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 앞에 서 있는’은 하나님 앞에서의 섬김을 가리킬 수 있지만, 본문은 특정 직분을 밝히지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 이러므로
  lexicon: HALOT
  rationale: 앞 문맥의 결론을 이끄는 인과 접속사로 자연스럽고 문어적인 한국어를 선택했습니다.
- source_word: יְהוָה צְבָא֖וֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 기본 용례에 따라 יהוה는 야훼로, צְבָאוֹת은 만군의 관용적 표현으로 옮겨 신적 칭호의 장엄함을 유지했습니다.
- source_word: עֹמֵד לְפָנַי
  english_pob_choice: standing before me
  chosen_korean: 내 앞에 서 있는
  alternatives_korean:
  - 내 앞에 서서 섬기는
  - 내 앞에 서 있는 자
  lexicon: HALOT
  rationale: ‘서 있다’는 직역을 살리되, 특정 직분으로 좁히지 않도록 현재분사적 표현으로 자연스럽게 옮겼습니다.
- source_word: לֹא יִכָּרֵת אִישׁ
  english_pob_choice: shall never lack a man
  chosen_korean: 사람이 … 끊어지지 않을 것입니다
  alternatives_korean:
  - 사람이 … 없지 않을 것입니다
  - 남자가 … 끊어지지 않을 것입니다
  lexicon: HALOT
  rationale: ‘끊어지다’는 כרת의 문자적 이미지를 살리면서도, 문맥상 후손/대표의 지속을 뜻하는 관용을 한국어로 전달합니다.
theological_decisions:
- issue: ‘내 앞에 서 있는’의 의미 범위
  chosen_reading: 특정한 제도적 직분으로 한정하지 않고, 하나님 앞에서 섬기는 지속적 존재를 뜻하는 표현으로 유지했습니다.
  alternative_readings:
  - 레갑 자손의 제사장적 지속 봉사
  - 단순한 후손 보존 약속
  rationale: 본문은 ‘서 있는’의 의미를 확정하지 않으므로, 해석을 과도하게 좁히지 않고 원문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
