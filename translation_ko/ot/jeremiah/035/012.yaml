  lexicon: HALOT
  rationale: 예언서의 공식 도입구에서 wayyiqtol은 사건 전환과 개시를 알리므로, 현대 한국어에서는 ‘그때’와 ‘임하여’로 자연스럽게 살리되 문어체의 격식을 유지했습니다.
