  rationale: 이 구절은 직접화법 내용보다 발화 도입 공식이 핵심이므로, ‘말씀하셨습니다’로 자연스럽게 마무리해 뒤따를 인용을 예고했습니다.
theological_decisions:
- issue: 예언 공식에서 하나님의 발화 동사 처리
  chosen_reading: ‘말씀’과 ‘말씀하셨습니다’로 연결해 야훼의 직접적 계시 행위를 드러냈습니다.
  alternative_readings:
  - ‘말이 임하여’
  - ‘말씀이 왔습니다’
  rationale: דְּבַר יְהוָה는 단순 정보 전달이 아니라 예언적 계시의 도래를 뜻하므로, 한국어에서도 인격적·계시적 성격이 살아나도록 옮겼습니다.
  doctrine_reference: 예언서의 ‘여호와의 말씀’ 공식에 대한 계시 이해
