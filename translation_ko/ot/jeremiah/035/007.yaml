  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בַ֣יִת לֹֽא תִבְנ֗וּ וְ/זֶ֤רַע לֹֽא תִזְרָ֨עוּ֙ וְ/כֶ֣רֶם לֹֽא תִטָּ֔עוּ וְ/לֹ֥א יִֽהְיֶ֖ה לָ/כֶ֑ם כִּ֠י בָּ/אֳהָלִ֤ים תֵּֽשְׁבוּ֙ כָּל יְמֵי/כֶ֔ם לְמַ֨עַן תִּֽחְי֜וּ יָמִ֤ים רַבִּים֙ עַל פְּנֵ֣י הָ/אֲדָמָ֔ה אֲשֶׁ֥ר אַתֶּ֖ם גָּרִ֥ים שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/007.yaml
  text: You must not build a house[a], and you must not sow seed, and you must not plant a vineyard, nor shall you have one; but you shall live in tents all your days, so that you may live many days on the face of the land where you are residing there.
  footnotes:
  - marker: a
    text: Or 'where you are sojourning' / 'where you are living as temporary residents.' The Hebrew verb carries the sense of residing as a non-permanent resident.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희는 집을 짓지 말며, 씨를 뿌리지 말며, 포도원을 심지 말고, 너희에게 그것이 있어도 안 됩니다. 그러나 너희는 평생 천막에서 살아야 하며, 이는 너희가 살고 있는 그 땅 위에서 오래 살게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희가 나그네로 머무는 곳’ / ‘임시 거주자로 사는 곳’의 뜻입니다. 히브리어 동사는 비정착적 체류의 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיִת
  english_pob_choice: a house
  chosen_korean: 집
  alternatives_korean:
  - 가옥
  - 집 한 채
  lexicon: HALOT
  rationale: 여기서는 천막 생활과 대조되는 물리적 거주 공간이므로 ‘집’이 가장 자연스럽고 직접적입니다.
- source_word: תִבְנוּ
  english_pob_choice: you must not build
  chosen_korean: 짓지 말며
  alternatives_korean:
  - 건축하지 말며
  - 세우지 말며
  lexicon: HALOT
  rationale: 주거용 건물을 짓는 금지를 현대 한국어로 자연스럽게 풀어 옮겼습니다.
- source_word: וְזֶרַע / תִזְרָעוּ
  english_pob_choice: seed / you must not sow
  chosen_korean: 씨를 뿌리지 말며
  alternatives_korean:
  - 종자를 뿌리지 말며
  - 씨앗을 뿌리지 말며
  lexicon: HALOT
  rationale: 히브리어의 구체적 농경 표현을 살려 ‘씨를 뿌리다’로 옮겼습니다.
- source_word: וְכֶרֶם / תִטָּעוּ
  english_pob_choice: a vineyard / you must not plant
  chosen_korean: 포도원을 심지 말고
  alternatives_korean:
  - 포도나무 밭을 조성하지 말고
  - 포도원을 심지 말며
  lexicon: HALOT
  rationale: כֶּרֶם은 통상 ‘포도원’이므로 이를 유지했고, נטע의 농경적 의미를 ‘심다’로 옮겼습니다.
- source_word: וְלֹא יִהְיֶה לָכֶם
  english_pob_choice: nor shall you have one
  chosen_korean: 너희에게 그것이 있어도 안 됩니다
  alternatives_korean:
  - 너희에게 그것이 없어야 합니다
  - 너희는 그것을 가져도 안 됩니다
  lexicon: HALOT
  rationale: 앞의 금지를 단순히 행위가 아니라 소유 금지까지 넓혀 요약하는 표현이므로, 한국어에서는 ‘있다’로 소유 관계를 드러냈습니다.
- source_word: בָּאֳהָלִים תֵּשְׁבוּ
  english_pob_choice: you shall live in tents
  chosen_korean: 평생 천막에서 살아야 하며
  alternatives_korean:
  - 평생 천막에 거해야 하며
  - 평생 천막에서 거주해야 하며
  lexicon: HALOT
  rationale: תֵּשְׁבוּ는 거주/생활의 뜻이므로 자연스러운 현대어인 ‘살다’를 사용했고, אַהֳלִים은 ‘천막’으로 옮겨 유목적 생활을 드러냈습니다.
- source_word: אֲשֶׁר אַתֶּם גָּרִים שָׁם
  english_pob_choice: where you are residing there
  chosen_korean: 너희가 살고 있는 그 땅 위에서
  alternatives_korean:
  - 너희가 머물고 있는 그곳에서
  - 너희가 거류하고 있는 그 땅에서
  lexicon: HALOT
  rationale: גָּרִים는 단순 거주보다 일시적 체류의 뉘앙스가 있어, 본문 흐름에 맞게 ‘살고 있는’과 ‘그 땅’으로 풀었습니다.
theological_decisions:
- issue: 레갑 자손의 비정착적 삶의 방식
  chosen_reading: ‘천막에서 살아야 하며’와 ‘그 땅 위에서 오래 살게 하려는 것’으로, 정착과 소유를 거부하는 삶의 규범을 분명히 드러냄
  alternative_readings:
  - ‘천막에 거해야 하며’
  - ‘그 땅에서 너희가 잠시 사는 곳’
  rationale: 본문의 핵심은 단순한 생활양식이 아니라 정착·소유를 유보한 순종의 표지이므로, 이를 희석하지 않는 방향으로 옮겼습니다.
  doctrine_reference: Jeremiah 35장의 레갑 자손 전승과 언약적 순종의 서사
