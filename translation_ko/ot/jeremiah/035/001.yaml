    text: 히브리어 본문은 하나님의 이름 YHWH를 사용합니다.
    reason: source_note
  revision_rationale: 정형적인 예언서 표제 표현을 따라 말씀의 출처(여호와)와 수령자(예레미야)를 명확히 했습니다. 또한 ‘여호와께서 말씀하셨습니다:’를 보충하여 לֵאמֹר가 다음 절의 직접 발화를 도입하는 기능을 한국어에서 자연스럽게 구현했습니다. 고유명과 신명 표기는 초안대로 유지했습니다.
