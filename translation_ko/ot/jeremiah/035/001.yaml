  text: הַ/דָּבָ֛ר אֲשֶׁר הָיָ֥ה אֶֽל יִרְמְיָ֖הוּ מֵ/אֵ֣ת יְהוָ֑ה בִּ/ימֵ֨י יְהוֹיָקִ֧ים בֶּן יֹאשִׁיָּ֛הוּ מֶ֥לֶךְ יְהוּדָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/035/001.yaml
  text: The word that came to Jeremiah from Yahweh in the days of Jehoiakim son of Josiah[a], king of Judah, saying,
  footnotes:
  - marker: a
    text: Or "Yahweh." The Hebrew has the divine name YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 여호와께서 유다 왕 요시야의 아들 여호야김 시대에 예레미야에게 이르신 말씀은 이러합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 하나님의 이름 YHWH를 사용합니다.
    reason: source_note
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언적 서문에서 דָּבָר는 단순한 정보가 아니라 여호와로부터 온 계시를 가리키므로, 한국어에서는 자연스럽고도 계시성을 살리는 ‘말씀’이 가장 적절합니다.
- source_word: אֲשֶׁר הָיָה אֶל
  english_pob_choice: that came to
  chosen_korean: 이르신
  alternatives_korean:
  - 임한
  - 다가온
  lexicon: HALOT
  rationale: 히브리어 관용구는 예언자에게 ‘도달한/전달된’ 계시를 뜻하므로, 한국어에서 문어체로 자연스러운 ‘이르신’으로 옮겨 도착·전달의 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 본문은 여호와의 이름을 지시하므로, 한국어 성경 독자에게 가장 널리 인식되는 고유명 ‘여호와’를 사용했습니다. 이곳은 서문 서술에서의 명명 문제이므로 전통적 표기를 유지해도 본문의 의미가 흐려지지 않습니다.
- source_word: בִּימֵי
  english_pob_choice: in the days of
  chosen_korean: 시대에
  alternatives_korean:
  - 때에
  - 날들에
  lexicon: HALOT
  rationale: 왕의 재위 문맥에서 בִּימֵי는 연대 표지 기능을 하므로, 한국어에서는 자연스러운 역사 서술 표현인 ‘시대에’로 풀어 썼습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 본문의 יְהוָה는 한국어에서 ‘여호와’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 영문 POB는 절의 핵심 신학적 표지를 드러내기 위해 Yahweh를 택했으나, 한국어 본문은 문맥상 이름의 직접 표기보다 독자 가독성과 수용도를 우선해 ‘여호와’를 사용했습니다. 이 절은 인용문이 아니라 서문이므로 야훼 표기의 신학적 긴장보다 통용성을 택했습니다.
  doctrine_reference: POB Korean style decision for YHWH rendering
