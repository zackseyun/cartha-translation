  doctrine_reference: Jeremiah prophetic formula; source-language discourse force
- issue: ‘from the mouth of Jeremiah’의 해석
  chosen_reading: 직역을 유지하되, 한국어 문맥상 구술-필사 관계를 드러내는 표현으로 처리함
  alternative_readings:
  - ‘예레미야의 지시로’
  - ‘예레미야가 불러 주는 대로’
  rationale: 본문은 단순한 저자 표기가 아니라 예언적 구술의 매개를 말합니다. 직역을 유지하면 원문의 구체성과 신학적 긴장을 보존할 수 있습니다.
