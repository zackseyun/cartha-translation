reference: Jeremiah 36:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַל יְהֽוֹיָקִים֙ מֶ֣לֶךְ יְהוּדָ֔ה לֹא יִֽהְיֶה לּ֥/וֹ יוֹשֵׁ֖ב עַל כִּסֵּ֣א דָוִ֑ד וְ/נִבְלָת/וֹ֙ תִּֽהְיֶ֣ה מֻשְׁלֶ֔כֶת לַ/חֹ֥רֶב בַּ/יּ֖וֹם וְ/לַ/קֶּ֥רַח בַּ/לָּֽיְלָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/030.yaml
  text: 'Therefore this is what Yahweh says concerning Jehoiakim king of Judah: He will have no one to sit on the throne of David[a], and his dead body will be thrown out to the heat by day and to the frost by night.'
  footnotes:
  - marker: a
    text: Or 'his corpse will be cast out to the drought by day and to the frost by night.' The Hebrew word for 'heat' can also carry the sense of dryness or drought.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 유다 왕 여호야김에 대하여 이렇게 말씀하십니다. 그에게는 다윗의 왕좌에 앉을 사람이 없을 것이며, 그의 시체는 낮에는 더위[a]에, 밤에는 서리에 내던져질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘더위’로 번역한 히브리어는 건조함 또는 가뭄을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이 때문에
  lexicon: HALOT
  rationale: 앞선 문맥의 심판 선언을 이어 주는 결론 표지이므로, 인과와 귀결을 함께 살리는 ‘그러므로’가 가장 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신성명은 ‘야훼’로 옮겨, 언약적 고유성을 유지했습니다.
- source_word: לֹא יִהְיֶה לּוֹ יוֹשֵׁב עַל כִּסֵּא דָוִד
  english_pob_choice: He will have no one to sit on the throne of David
  chosen_korean: 다윗의 왕좌에 앉을 사람이 하나도 없을
  alternatives_korean:
  - 다윗의 왕좌에 앉는 사람이 하나도 없을
  - 다윗의 왕좌에 앉을 후손이 하나도 없을
  lexicon: HALOT
  rationale: 히브리어의 ‘그에게 앉아 있을 사람(yošev)’ 구조를 살리되, 한국어에서 자연스러운 미래 부정 표현으로 처리했습니다. ‘후손’은 해석을 덧붙이므로 본문에는 넣지 않았습니다.
- source_word: נִבְלָתוֹ
  english_pob_choice: his dead body
  chosen_korean: 그의 시체
  alternatives_korean:
  - 그의 주검
  - 그의 사체
  lexicon: HALOT
  rationale: 비인격적이고 수치스러운 방치를 나타내는 말로서, 본문의 강한 모욕감을 분명하게 드러내는 ‘시체’를 택했습니다.
- source_word: מֻשְׁלֶכֶת
  english_pob_choice: will be thrown out
  chosen_korean: 내던져질 것입니다
  alternatives_korean:
  - 던져질 것입니다
  - 버려질 것입니다
  lexicon: HALOT
  rationale: 수동적 배척과 무참한 유기를 강조하는 동사로, 단순한 ‘던지다’보다 더 거칠고 버림받는 뉘앙스가 있는 ‘내던지다’를 사용했습니다.
- source_word: לַחֹרֶב בַּיּוֹם
  english_pob_choice: to the heat by day
  chosen_korean: 낮에는 더위에
  alternatives_korean:
  - 낮에는 열기에
  - 낮에는 건조함에
  lexicon: HALOT
  rationale: חֹרֶב의 범위(더위/건조/가뭄) 가운데, 밤의 ‘서리’와 대구를 이루며 노출된 시신의 환경적 고통을 자연스럽게 전달하는 ‘더위’로 옮겼습니다.
- source_word: לַקֶּרַח בַּלָּיְלָה
  english_pob_choice: to the frost by night
  chosen_korean: 밤에는 서리에
  alternatives_korean:
  - 밤에는 추위에
  - 밤에는 얼음에
  lexicon: HALOT
  rationale: קֶרַח의 구체적 이미지인 ‘서리’를 유지해 낮/밤의 대조와 차가운 노출감을 살렸습니다.
