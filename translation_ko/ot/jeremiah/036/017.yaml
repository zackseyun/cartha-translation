    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲלוּ
  english_pob_choice: asked
  chosen_korean: 말했습니다
  alternatives_korean:
  - 물었습니다
  - 물어보았습니다
  lexicon: HALOT
  rationale: 질문 행위이지만, 한국어에서는 뒤의 직접 인용을 자연스럽게 이끄는 ‘말했습니다’가 가장 매끄럽고 문맥에 맞습니다.
- source_word: הַגֶּד נָא לָנוּ
  english_pob_choice: Please tell us
  chosen_korean: 부디 우리에게 말해 주십시오
