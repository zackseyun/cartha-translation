  lexicon: HALOT
  rationale: הגּד의 명령성과 נָא의 공손한 요청을 함께 살리되, 현대 한국어에서 과도하게 딱딱하지 않은 공손한 요청으로 옮겼습니다.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 말씀
  - 이 모든 일
  lexicon: HALOT
  rationale: 예언의 구술 내용을 가리키므로 ‘말씀’보다 보다 직접적인 ‘말’이 문맥을 잘 드러냅니다.
- source_word: מִפִּיו
  english_pob_choice: from his mouth
  chosen_korean: 그의 입에서
  alternatives_korean:
  - 그의 입으로
  - 그의 말로
  lexicon: HALOT
  rationale: 직역 성격을 유지해 원문의 생생한 구어적 표현을 살렸으며, 바룩이 예레미야의 구술을 받아 적었음을 드러냅니다.
theological_decisions:
- issue: 예언 기록의 방식
  chosen_reading: 본문의 초점은 바룩이 예레미야의 입에서 나온 말을 그대로 받아 적었다는 점에 있습니다.
  alternative_readings:
  - 단순히 내용을 요약해 기록했다는 읽기
  - 예레미야의 개인적 의견을 정리했다는 읽기
  rationale: ‘그의 입에서’라는 표현은 구술-필기의 관계를 강조하므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 성경 영감과 예언 전달의 구술적 매개에 대한 본문 자체의 서술
