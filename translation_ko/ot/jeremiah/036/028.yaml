base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/028.yaml
  text: Take for yourself another scroll and write on it all the former words that were on the first scroll[a], which Jehoiakim king of Judah burned.
  footnotes:
  - marker: a
    text: Or, 'Take again for yourself another scroll.' The Hebrew opens with an imperative meaning 'return/again,' which functions idiomatically with 'take.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다른 두루마리를 하나 가져다가, 그 첫 번째 두루마리에 있던 전의 모든 말을 그 위에 기록하십시오. 유다 왕 여호야김이 그것을 불태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘전의’는 히브리어 הָרִאשֹׁנִים의 ‘먼저의/이전의’라는 뜻을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב קַח
  english_pob_choice: Take for yourself another scroll
  chosen_korean: 다른 두루마리를 하나 가져다가
  alternatives_korean:
  - 다시 두루마리를 하나 가져다가
  - 또 다른 두루마리를 하나 받으십시오
  lexicon: HALOT
  rationale: שׁוּב은 여기서 단순한 ‘돌아가다’보다 다음 명령 קַח과 결합해 ‘다시/또’의 기능을 하므로, 한국어에서는 반복을 자연스럽게 살린 ‘다른 … 하나 가져다가’로 옮겼습니다.
- source_word: מְגִלָּה
  english_pob_choice: scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 책
  - 스크롤
  lexicon: HALOT
  rationale: 문서용 고대 필기 재료를 가리키므로 현대 한국어 성경 문맥에서 가장 자연스럽고 구체적인 ‘두루마리’가 적절합니다.
- source_word: כָּל הַדְּבָרִים הָרִאשֹׁנִים
  english_pob_choice: all the former words
  chosen_korean: 전의 모든 말
  alternatives_korean:
  - 먼저의 모든 말
  - 이전의 모든 말
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 두루마리에 기록된 내용/말들을 뜻하므로 ‘말’로 옮기고, הָרִאשֹׁנִים은 대조되는 옛 기록이라는 점을 살려 ‘전의’로 렌더링했습니다.
- source_word: עַל הַמְּגִלָּה הָרִאשֹׁנָה
  english_pob_choice: that were on the first scroll
  chosen_korean: 그 첫 번째 두루마리에 있던
  alternatives_korean:
  - 그 첫 두루마리에 있던
  - 그 처음 두루마리에 있던
  lexicon: HALOT
  rationale: 원문은 이전에 쓰여 있던 동일한 내용의 위치를 가리키므로 ‘있던’으로 자연스럽게 관계절을 처리했습니다.
- source_word: שָׂרַף
  english_pob_choice: burned
  chosen_korean: 불태웠습니다
  alternatives_korean:
  - 태웠습니다
  - 불살랐습니다
  lexicon: HALOT
  rationale: 단순 소각이 아니라 문서를 파괴하려는 행위를 분명히 드러내는 동사이므로, 한국어에서도 ‘불태우다’가 가장 정확합니다.
theological_decisions:
- issue: 예언 기록의 반복 명령을 어떻게 전달할지
  chosen_reading: 하나님께서 이전에 기록된 예언 말씀을 다시 적게 하시는 명령으로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 의미를 완화하여 ‘다시 써 두십시오’로 옮김
  - 설명적으로 ‘같은 내용을 다시 기록하십시오’로 확장
  rationale: 본문은 멸망한 두루마리의 내용이 소실되지 않고 동일하게 보존되어야 함을 강조하므로, 반복성과 동일성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성경의 보존과 예언 말씀의 지속성
- issue: 유다 왕 여호야김의 행위 묘사
  chosen_reading: 여호야김이 두루마리를 ‘불태웠습니다’라고 직접 서술해 행위의 책임을 분명히 했습니다.
  alternative_readings:
  - ‘불살랐습니다’로 더 강하게 표현
  - ‘태워 버렸습니다’로 구어적으로 완화
  rationale: 원문의 서술은 왕의 파괴 행위를 사실대로 진술하며, 이를 약화시키거나 미화하지 않는 것이 문맥에 맞습니다.
  doctrine_reference: 본문의 역사적·윤리적 책임 진술
