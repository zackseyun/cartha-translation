source:
  edition: WLC
  text: וְ/עַל יְהוֹיָקִ֤ים מֶֽלֶךְ יְהוּדָה֙ תֹּאמַ֔ר כֹּ֖ה אָמַ֣ר יְהוָ֑ה אַ֠תָּה שָׂרַ֜פְתָּ אֶת הַ/מְּגִלָּ֤ה הַ/זֹּאת֙ לֵ/אמֹ֔ר מַדּוּעַ֩ כָּתַ֨בְתָּ עָלֶ֜י/הָ לֵ/אמֹ֗ר בֹּֽא יָב֤וֹא מֶֽלֶךְ בָּבֶל֙ וְ/הִשְׁחִית֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/הִשְׁבִּ֥ית מִמֶּ֖/נָּה אָדָ֥ם וּ/בְהֵמָֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/029.yaml
  text: 'And concerning Jehoiakim king of Judah[a], you shall say, ‘Thus says Yahweh: You have burned this scroll, saying, “Why have you written on it, saying, ‘The king of Babylon will surely come and destroy this land, and cut off from it man and beast’?”’'
  footnotes:
  - marker: a
    text: Or, 'humankind and animals.' Hebrew 'man and beast' is a stock expression for total devastation.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 여호야김에 대하여는 이렇게 말하십시오. “야훼께서 이렇게 말씀하십니다. 너는 이 두루마리를 불태웠다. ‘바빌론 왕이 반드시 와서 이 땅을 멸하고, 사람과 가축을 거기서 끊어 버릴 것이다’라고 말하며, 왜 네가 그것을 두고 이렇게 썼느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘사람과 짐승’은 전면적 황폐를 나타내는 상투적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל ... תֹּאמַר
  english_pob_choice: And concerning ... you shall say
  chosen_korean: “유다 왕 여호야김에 대하여는 이렇게 말하십시오”
  alternatives_korean:
  - “유다 왕 여호야김을 거슬러 이렇게 말하십시오”
  - “여호야김에 관하여 이렇게 말하십시오”
  lexicon: HALOT
  rationale: עַל + 말하다 계열은 여기서 대상을 두고 말하라는 지시이므로, 한국어로는 ‘대하여’가 가장 자연스럽고 원문의 발화 지시를 살립니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: “야훼께서 이렇게 말씀하십니다”
  alternatives_korean:
  - “여호와께서 이렇게 말씀하십니다”
  - “주께서 이렇게 말씀하십니다”
  lexicon: HALOT
  rationale: 예언자 전언 공식은 현대 한국어에서 자연스러운 보고문으로 옮기되, 본 프로젝트 기본값에 따라 신명은 ‘야훼’로 렌더링했습니다.
- source_word: שָׂרַפְתָּ אֶת הַמְּגִלָּה הַזֹּאת
  english_pob_choice: You have burned this scroll
  chosen_korean: “너는 이 두루마리를 불태웠다”
  alternatives_korean:
  - “너는 이 두루마리를 태웠다”
  - “너는 이 문서를 불태웠다”
  lexicon: HALOT
  rationale: מְגִלָּה는 말아 놓은 문서이므로 ‘두루마리’가 직접적이며, שׂרף의 파괴성을 살리기 위해 ‘불태우다’를 택했습니다.
- source_word: בֹּא יָבֹא ... וְהִשְׁבִּית מִמֶּנָּה אָדָם וּבְהֵמָה
  english_pob_choice: will surely come ... and cut off from it man and beast
  chosen_korean: “바빌론 왕이 반드시 와서 이 땅을 멸하고, 사람과 가축을 거기서 끊어 버릴 것이다”
  alternatives_korean:
  - “바빌론 왕이 반드시 와서 이 땅을 파괴하고, 사람과 짐승을 거기서 없앨 것이다”
  - “바빌론 왕이 꼭 와서 이 땅을 황폐하게 하고, 사람과 짐승을 거기서 끊을 것이다”
  lexicon: HALOT
  rationale: 부정사 절대형+미완료형의 강조를 ‘반드시’로 살렸고, ‘사람과 가축’은 אָדָם וּבְהֵמָה의 총체적 황폐를 한국어 관용 안에서 드러냅니다.
theological_decisions:
- issue: 예언자 전언 공식 안의 신명 렌더링
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 יְהוָה를 직접 사용하므로 프로젝트 기본값대로 신명 고유성을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אָדָם וּבְהֵמָה의 총체적 파괴 관용구
  chosen_reading: 사람과 가축
  alternative_readings:
  - 사람과 짐승
  - 인류와 가축
  rationale: 이 결합은 예언서에서 전면적 황폐를 나타내는 상투구이므로, 의미는 살리되 한국어에서 자연스러운 ‘사람과 가축’으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #4; Contested terms: אָדָם → man / humankind (context)'
