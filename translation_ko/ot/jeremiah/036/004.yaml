  source_fidelity: 수정이 필요합니다. 초안은 מִפִּי יִרְמְיָהוּ를 ‘예레미야의 입에서 나온’으로 대체로 적절히 반영하지만, אֲשֶׁר דִּבֶּר אֵלָיו(‘야훼께서 예레미야에게 말씀하신’) 관계절을 번역에서 빠뜨렸습니다. 또한 ‘예레미야의 입에서 나온 야훼의 모든 말씀’은 한국어에서 야훼의 말씀이 예레미야에게서 유래한다는 인상을 줄 수 있습니다.
  naturalness: ‘예레미야의 입에서 나오는 대로’는 구술·받아쓰기의 의미를 자연스럽게 전달하면서 원문의 ‘입에서’ 비유를 보존합니다. 두 절로 나누어 현대 한국어 합쇼체 문장으로 명료하게 다듬었습니다.
