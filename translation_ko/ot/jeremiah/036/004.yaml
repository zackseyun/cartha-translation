base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/004.yaml
  text: So Jeremiah called Baruch son of Neriah[a], and Baruch wrote on a scroll all the words of Yahweh from Jeremiah’s mouth[b], which he had spoken to him.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from the mouth of Jeremiah,'' that is, as Jeremiah dictated.'
    reason: lexical_alternative
  - marker: b
    text: Or more literally, 'on a scroll of a book.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 네리야의 아들 바룩을 불렀습니다. 바룩은 예레미야의 입에서 나오는 대로[a] 야훼께서 예레미야에게 말씀하신 모든 말씀을 두루마리에[b] 기록했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘예레미야의 입에서’입니다. 이는 예레미야가 말한 것을 바룩이 받아 적었음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 더 직역하면 ‘책의 두루마리’ 또는 ‘두루마리 책’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소집했습니다
  - 불러냈습니다
  lexicon: HALOT
  rationale: 문맥상 예레미야가 바룩을 불러 작업을 맡긴 의미이므로, 자연스럽고 과도하게 강하지 않은 ‘불렀습니다’가 적절합니다.
- source_word: בָּרוּךְ בֶּן נֵרִיָּה
  english_pob_choice: Baruch son of Neriah
  chosen_korean: 네리야의 아들 바룩
  alternatives_korean:
  - 바룩, 네리야의 아들
  - 바룩 네리야의 아들
  lexicon: HALOT
  rationale: 고유명사는 음역하되 히브리어 족보 표현을 한국어 관용에 맞게 ‘네리야의 아들’로 옮겼습니다.
- source_word: מִפִּי יִרְמְיָהוּ
  english_pob_choice: from Jeremiah’s mouth
  chosen_korean: 예레미야의 입에서 나온
  alternatives_korean:
  - 예레미야의 입에서
  - 예레미야의 입으로부터 나온
  lexicon: HALOT
  rationale: 직역의 이미지를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘입에서 나온’으로 옮겨, 입술/구술을 통한 받아쓰기 의미를 드러냈습니다.
- source_word: עַל מְגִלַּת סֵפֶר
  english_pob_choice: on a scroll
  chosen_korean: 한 두루마리에
  alternatives_korean:
  - 두루마리 책에
  - 책 두루마리에
  lexicon: HALOT
  rationale: 문맥상 기록 매체를 가리키므로 현대 독자가 이해하기 쉬운 ‘두루마리’로 옮겼고, 불필요한 확장 없이 간결하게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: POB 기본 원칙에 따라 여호와 대신 고유명사 음역 ‘야훼’를 사용하여, 본문의 언약적 신명 사용을 보존했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 יְהוָה는 제목어가 아니라 신적 고유명사이므로 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 직접 신명 테트라그라마톤을 사용하므로, 대체 호칭보다 고유명사성을 드러내는 번역이 원문 의미를 더 분명하게 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
