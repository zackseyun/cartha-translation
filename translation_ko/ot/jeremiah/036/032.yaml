revisions:
- from: 예레미야가 또 다른 두루마리를 가져다가 그것을 네리야의 아들 바룩에게, 곧 서기관에게 주니, 그가 예레미야의 입에서 나온 대로 그 위에 유다 왕 여호야김이 불에 태워버린 그 두루마리의 모든 말을 기록하였고, 그밖에도 그와 같은 많은 말이 더해졌습니다.[a]
  to: 예레미야가 다른 두루마리를 가져다가 네리야의 아들인 서기관 바룩에게 주었고, 바룩은 예레미야의 구술에 따라[a] 그 위에 유다 왕 여호야김이 불에 태운 그 두루마리의 모든 말을 기록하였습니다. 그 밖에도 그와 같은 많은 말들이 더해졌습니다.
  rationale: 히브리어 관용구 מִפִּי를 문맥상 분명한 ‘예레미야의 구술에 따라’로 옮기고, 직역과 구술의 매개 관계는 해당 위치의 각주로 보존했습니다. 또한 바룩의 직무를 자연스러운 동격 구조로 정리하고, 기록 주체를 명시하여 문장의 흐름과 지시 대상을 분명히 했습니다. ‘다른 두루마리’는 אַחֶרֶת의 의미를 충분히 담으며, 끝 절의 ‘그와 같은 많은 말들’은 כָּהֵמָּה의 유사성 의미를 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:18Z'
