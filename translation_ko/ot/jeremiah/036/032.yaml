  text: וְ/יִרְמְיָ֜הוּ לָקַ֣ח מְגִלָּ֣ה אַחֶ֗רֶת וַֽ/יִּתְּנָ/הּ֮ אֶל בָּר֣וּךְ בֶּן נֵרִיָּהוּ֮ הַ/סֹּפֵר֒ וַ/יִּכְתֹּ֤ב עָלֶ֨י/הָ֙ מִ/פִּ֣י יִרְמְיָ֔הוּ אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׂרַ֛ף יְהוֹיָקִ֥ים מֶֽלֶךְ יְהוּדָ֖ה בָּ/אֵ֑שׁ וְ/ע֨וֹד נוֹסַ֧ף עֲלֵי/הֶ֛ם דְּבָרִ֥ים רַבִּ֖ים כָּ/הֵֽמָּה׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/032.yaml
  text: Then Jeremiah took another scroll and gave it to Baruch son of Neriah[a], the scribe, and he wrote on it from the mouth of Jeremiah all the words of the scroll that Jehoiakim king of Judah had burned in the fire; and many similar words were added to them besides.
  footnotes:
  - marker: a
    text: Or, 'at Jeremiah’s dictation.' Literally, 'from the mouth of Jeremiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 다른 두루마리를 가져다가 네리야의 아들인 서기관 바룩에게 주었고, 바룩은 예레미야의 구술에 따라[a] 그 위에 유다 왕 여호야김이 불에 태운 그 두루마리의 모든 말을 기록하였습니다. 그 밖에도 그와 같은 많은 말들이 더해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예레미야의 입에서’입니다. 예레미야가 구술하고 바룩이 받아 기록했음을 나타내는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגִלָּה אַחֶרֶת
  english_pob_choice: another scroll
  chosen_korean: 또 다른 두루마리
  alternatives_korean:
  - 다른 두루마리
  - 또 하나의 두루마리
  lexicon: HALOT
  rationale: מְגִלָּה는 문맥상 기록용 두루마리를 가리키므로 ‘두루마리’가 자연스럽고, אַחֶרֶת의 ‘another’는 ‘또 다른’으로 옮기는 것이 정확합니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 서기
  lexicon: HALOT
  rationale: סֹפֵר는 단순한 비서보다 고대의 문서 작성자/기록자를 가리키므로, 역사적 직무를 살리는 ‘서기관’이 적절합니다.
- source_word: מִפִּי יִרְמְיָהוּ
  english_pob_choice: from the mouth of Jeremiah
  chosen_korean: 예레미야의 입에서 나온 대로
  alternatives_korean:
  - 예레미야의 입에서
  - 예레미야가 구술한 대로
  lexicon: HALOT
  rationale: 직역하면 ‘예레미야의 입으로부터’이지만, 한국어에서는 구술·받아쓰기를 드러내는 ‘입에서 나온 대로’가 본문의 생생한 표현과 이해 가능성을 함께 살립니다.
- source_word: דְּבָרִים רַבִּים כָּהֵמָּה
  english_pob_choice: many similar words
  chosen_korean: 그와 같은 많은 말
  alternatives_korean:
  - 비슷한 많은 말
  - 이와 같은 많은 말
  lexicon: HALOT
  rationale: כָהֵמָּה는 ‘그들과 같은/그런’의 뜻이므로, 문맥에 맞게 ‘그와 같은’으로 옮겨 유사성의 의미를 살렸습니다.
theological_decisions:
- issue: 예레미야의 구술 전달 방식
  chosen_reading: 본문은 바룩이 예레미야의 말을 문서에 받아 적은 것을 강조하므로, ‘입에서 나온 대로’로 구술의 매개성을 드러냈습니다.
  alternative_readings:
  - ‘예레미야가 말한 대로’
  - ‘예레미야의 지시에 따라’
  rationale: 히브리어 관용구를 완만하게 풀되, 단순한 요약으로 바꿔 예언 전달의 매체성을 약화시키지 않기 위해서입니다.
  doctrine_reference: 예언의 전달과 기록에 관한 본문 내 서술적 강조
