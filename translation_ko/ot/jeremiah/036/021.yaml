reference: Jeremiah 36:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח הַ/מֶּ֜לֶךְ אֶת יְהוּדִ֗י לָ/קַ֨חַת֙ אֶת הַ/מְּגִלָּ֔ה וַ/יִּ֨קָּחֶ֔/הָ מִ/לִּשְׁכַּ֖ת אֱלִישָׁמָ֣ע הַ/סֹּפֵ֑ר וַ/יִּקְרָאֶ֤/הָ יְהוּדִי֙ בְּ/אָזְנֵ֣י הַ/מֶּ֔לֶךְ וּ/בְ/אָזְנֵי֙ כָּל הַ/שָּׂרִ֔ים הָ/עֹמְדִ֖ים מֵ/עַ֥ל הַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/021.yaml
  text: Then the king sent Jehudi to get the scroll[a], and he took it from the chamber of Elishama the scribe[d][c][b]. And Jehudi read it in the hearing of the king and in the hearing of all the officials standing beside the king.
  footnotes:
  - marker: a
    text: Or 'to take the scroll.'
    reason: lexical_alternative
  - marker: b
    text: '''The scribe'' could also be rendered ''the secretary'' in a royal administrative context.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'in the ears of.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'standing over the king,' likely meaning those attending or standing beside him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 유디를 보내어 그 두루마리를 가져오게 하였습니다.[a] 유디는 그것을 서기관 엘리사마의 방에서 가져와,[b] 왕과 왕 곁에 서 있는 모든 고관들이 듣는 가운데 읽었습니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가져오게 하였습니다’는 목적을 나타내는 부정사 לָקַחַת(‘가져가다/취하다’)를 문맥에 맞게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: הַסֹּפֵר는 궁정 문맥에서 ‘서기관’ 또는 ‘서기/비서’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘왕의 귀에, 모든 고관들의 귀에’라고 말하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: d
    text: ‘왕 곁에 서 있는’은 문자적으로 ‘왕 위에/왕을 향하여 서 있는’이라는 표현을 궁정의 대기자라는 문맥에 따라 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח הַמֶּלֶךְ אֶת יְהוּדִי
  english_pob_choice: Then the king sent Jehudi
  chosen_korean: 그때 왕은 유디를 보내어
  alternatives_korean:
  - 왕이 유디를 보냈습니다
  - 그때 왕이 유디를 파견하여
  lexicon: HALOT
  rationale: וַיִּשְׁלַח은 서사적 ‘보내다’의 기본 의미를 가지므로 자연스러운 현대 한국어로 옮겼습니다. 이름 יְהוּדִי는 음역을 따르되, 통용되는 영어식 Jehudi를 반영해 유디로 옮겼습니다.
- source_word: הַמְּגִלָּה
  english_pob_choice: the scroll
  chosen_korean: 그 두루마리
  alternatives_korean:
  - 그 책
  - 그 서卷
  lexicon: HALOT
  rationale: מְגִלָּה는 기록된 두루마리를 가리키므로 ‘두루마리’가 가장 직접적입니다. ‘책’은 현대적이지만 대상의 형상을 덜 드러냅니다.
- source_word: מִלִּשְׁכַּת אֱלִישָׁמָע הַסֹּפֵר
  english_pob_choice: from the chamber of Elishama the scribe
  chosen_korean: 서기관 엘리사마의 방에서
  alternatives_korean:
  - 서기관 엘리사마의 관청에서
  - 서기관 엘리사마의 방 안에서
  lexicon: HALOT
  rationale: לִשְׁכָּה는 궁정 맥락에서 공식 공간이지만, 여기서는 사적인 ‘방’보다 넓은 의미의 실내 공간으로 보이므로 ‘방’으로 옮겼습니다. הַסֹּפֵר는 직역하여 ‘서기관’으로 유지했습니다.
- source_word: וַיִּקְרָאֶהָ בְּאָזְנֵי
  english_pob_choice: read it in the hearing of
  chosen_korean: 왕의 귀와 …의 귀에 그것을 읽었습니다
  alternatives_korean:
  - 왕이 듣는 가운데 그것을 읽었습니다
  - 왕의 귀에 들리도록 그것을 읽었습니다
  lexicon: HALOT
  rationale: בְּאָזְנֵי의 문자적 이미지를 살리면서도 한국어에서는 자연스럽게 ‘귀에’로 풀었습니다. 반복되는 구조를 유지해 왕과 고관들 양쪽을 모두 분명히 했습니다.
- source_word: הָעֹמְדִים מֵעַל הַמֶּלֶךְ
  english_pob_choice: standing beside the king
  chosen_korean: 왕 곁에 서 있는 모든 고관들
  alternatives_korean:
  - 왕 위에 서 있는 모든 고관들
  - 왕 가까이에 서 있는 모든 고관들
  lexicon: HALOT
  rationale: 직역하면 ‘왕 위에 서 있는’이지만, 이는 궁정 관용구로 왕 곁에 시종하던 자들을 뜻하므로 ‘왕 곁에 서 있는’으로 옮겼습니다. הַשָּׂרִים는 궁정 맥락에 맞게 ‘고관들’로 번역했습니다.
theological_decisions:
- issue: 궁정 관용구 הָעֹמְדִים מֵעַל הַמֶּלֶךְ의 의미
  chosen_reading: 지위 우위를 뜻하는 ‘위에’의 문자성을 버리고, 왕을 시중드는 궁정 인물들을 가리키는 관용적 의미를 반영했습니다.
  alternative_readings:
  - 왕 위에 서 있는
  - 왕 곁에 서 있는
  rationale: 문자적 표현은 한국어 독자에게 오해를 낳을 수 있어, 본문의 의도인 궁정 대기자들을 분명히 드러내는 해석을 택했습니다.
  doctrine_reference: 문맥 기반 관용구 번역 원칙
