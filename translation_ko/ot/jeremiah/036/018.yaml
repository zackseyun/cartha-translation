  - severity: low
    issue: ‘낭독하다’의 의미 범위
    rationale: קרא는 기본적으로 ‘읽다/소리 내어 읽다’이며, 문맥상 받아쓰기를 위한 구두 전달을 뜻할 수 있습니다. ‘낭독하다’만을 본문으로 택하면 기존 문서에서 읽는 행위를 다소 강하게 암시하므로, 기본문은 ‘읽어 주다’로 하고 구두 전달의 해석은 각주에서 제시하는 편이 좋습니다.
