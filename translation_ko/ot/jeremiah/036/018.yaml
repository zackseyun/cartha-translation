revisions:
- from: 그러자 바룩이 그들에게 말했습니다. “그가 자기 입으로 이 모든 말을 내게 낭독하면, 나는 그것들을 두루마리에 먹으로 적고 있었습니다.”[a]
  to: 그러자 바룩이 그들에게 말했습니다. “그가 자기 입으로 이 모든 말을 내게 읽어 주면, 나는 그것들을 두루마리에 먹으로 적었습니다.”[a]
  rationale: 조건문처럼 들릴 수 있는 표현과 과거 진행형의 부조화를 바로잡고, קרא의 기본 의미인 ‘읽다’를 본문에 유지했습니다. 동시에 예레미야 36장의 받아쓰기 문맥에서 가능한 구두 전달의 의미는 각주로 밝혀 본문의 어휘적 모호성을 보존했습니다.
