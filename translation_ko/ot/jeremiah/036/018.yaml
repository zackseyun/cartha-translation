  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ בָּר֔וּךְ מִ/פִּי/ו֙ יִקְרָ֣א אֵלַ֔/י אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/אֲנִ֛י כֹּתֵ֥ב עַל הַ/סֵּ֖פֶר בַּ/דְּיֽוֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/018.yaml
  text: Then Baruch said to them[a], “He would recite all these words to me with his mouth, and I was writing them on the scroll with ink.”
  footnotes:
  - marker: a
    text: Or “He would read to me all these words from his mouth, and I wrote them on the scroll in ink.” The Hebrew verb often means “read,” but here the context favors the sense of dictation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 바룩이 그들에게 말했습니다. “그가 자기 입으로 이 모든 말을 내게 낭독하면, 나는 그것들을 두루마리에 먹으로 적고 있었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 자기 입으로 이 모든 말을 내게 읽으면, 나는 그것들을 두루마리에 먹으로 적고 있었습니다.” 히브리어 동사는 흔히 ‘읽다’를 뜻하지만, 여기서는 문맥상 구두 전달, 곧 낭독/전달의 뜻이 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  english_pob_choice: Baruch
  chosen_korean: 바룩
  alternatives_korean:
  - 바루크
  - 바룩스
  lexicon: 고유명사
  rationale: 예레미야서의 인물명은 통용되는 음역인 ‘바룩’을 따랐습니다.
- source_word: מִפִּיו יִקְרָא אֵלַי
  english_pob_choice: He would recite all these words to me with his mouth
  chosen_korean: 자기 입으로 이 모든 말을 내게 낭독하면
  alternatives_korean:
  - 자기 입에서 이 모든 말을 내게 읽으면
  - 자기 입으로 이 모든 말을 내게 말하면
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘읽다’보다 입으로 소리 내어 전하는 행위가 강조되므로, 한국어에서는 ‘낭독하다’가 가장 자연스럽고 기능적으로도 가깝습니다.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 말씀
  - 이 모든 것들
  lexicon: HALOT
  rationale: 히브리어 דְּבָרִים는 여기서 예언적 발화를 가리키므로 ‘말’이 가장 직접적입니다.
- source_word: הַסֵּפֶר
  english_pob_choice: the scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 책
  - 문서
  lexicon: HALOT
  rationale: 예레미야 36장의 סֵפֶר는 근대적 ‘책’이 아니라 기록용 두루마리를 뜻하므로 이를 반영했습니다.
- source_word: בַּדְּיוֹ
  english_pob_choice: with ink
  chosen_korean: 먹으로
  alternatives_korean:
  - 잉크로
  - 먹물로
  lexicon: HALOT
  rationale: 고대 문서 기록의 재료를 한국어 성경 문체에 맞게 ‘먹’으로 옮겨, 재료적 의미를 간결하게 살렸습니다.
theological_decisions:
- issue: יִקְרָא의 의미를 ‘읽다’와 ‘낭독하다’ 중 어떻게 살릴지
  chosen_reading: ‘낭독하면’으로 옮겨, 입으로 소리 내어 전하는 행위와 필사자의 기록 상황을 함께 드러냈습니다.
  alternative_readings:
  - ‘읽으면’
  - ‘암송하면’
  rationale: 이 절은 예레미야가 바룩에게 구두로 내용을 전달하고 바룩이 기록하는 장면이므로, 단순 독서보다 구두 전달의 뉘앙스가 더 적절합니다.
  doctrine_reference: 본문 문맥 해석
- issue: וַאֲנִי כֹּתֵב의 시제를 어떻게 처리할지
  chosen_reading: ‘나는 그것들을 … 적고 있었습니다’로 옮겨 진행 중인 필사 동작을 드러냈습니다.
  alternative_readings:
  - ‘나는 그것들을 … 적었습니다’
  - ‘내가 그것들을 … 적고 있습니다’
  rationale: 히브리어의 서술 흐름상 동시 진행을 보여 주는 것이 자연스럽고, 장면의 생동감을 유지합니다.
  doctrine_reference: 히브리어 서술상 배경 동작
