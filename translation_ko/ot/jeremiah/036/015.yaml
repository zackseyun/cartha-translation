language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו שֵׁ֣ב נָ֔א וּ/קְרָאֶ֖/נָּה בְּ/אָזְנֵ֑י/נוּ וַ/יִּקְרָ֥א בָר֖וּךְ בְּ/אָזְנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/015.yaml
  text: And they said to him[a], “Please sit down and read it in our hearing.” So Baruch read it in their hearing.
  footnotes:
  - marker: a
    text: Literally, 'in our ears' ... 'in their ears,' a Hebrew idiom meaning 'so as to be heard by us/them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말하기를, 「부디 앉아서 우리 귀에 읽어 주십시오」 하였습니다. 그래서 바룩이 그들의 귀에 읽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘우리 귀에 / 그들의 귀에’는 단순한 신체 부위 언급이 아니라, ‘우리가 들을 수 있도록 / 그들이 들을 수 있도록’이라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁב נָא
  english_pob_choice: Please sit down
  chosen_korean: 부디 앉아서
  alternatives_korean:
  - 앉아 주십시오
  - 앉으십시오
  lexicon: HALOT
  rationale: 명령형 שֵׁב에 나(נא)의 간청 뉘앙스를 살리되, 현대 한국어에서 자연스럽고 공손한 요청으로 옮겼습니다.
- source_word: וּקְרָאֶנָּה
  english_pob_choice: and read it
  chosen_korean: 읽어 주십시오
  alternatives_korean:
  - 읽으십시오
  - 그것을 읽으십시오
  lexicon: HALOT
  rationale: 대상은 앞서 언급된 두루마리/문서이므로 ‘그것’으로도 가능하지만, 요청형 대화에서 한국어 자연성을 위해 목적어를 드러내지 않고 ‘읽어 주십시오’로 옮겼습니다.
- source_word: בְּאָזְנֵינוּ / בְּאָזְנֵיהֶם
  english_pob_choice: in our hearing / in their hearing
  chosen_korean: 우리 귀에 / 그들의 귀에
  alternatives_korean:
  - 우리의 들음 속에 / 그들의 들음 속에
  - 우리에게 들리도록 / 그들에게 들리도록
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 반복 구조를 살렸습니다. 한국어에서는 ‘귀에 읽다’가 다소 생경하지만, 원문의 청각 중심 표현을 보존하는 편이 본문 성격에 더 가깝습니다.
- source_word: וַיִּקְרָא בָרוּךְ
  english_pob_choice: So Baruch read
  chosen_korean: 그래서 바룩이 ... 읽었습니다
  alternatives_korean:
  - 그리고 바룩이 ... 읽었습니다
  - 그러자 바룩이 ... 읽었습니다
  lexicon: HALOT
  rationale: 결과/응답의 흐름을 나타내는 וַ-연속을 ‘그래서’로 자연스럽게 살렸습니다.
