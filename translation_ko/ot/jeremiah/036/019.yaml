  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ אֶל בָּר֔וּךְ לֵ֥ךְ הִסָּתֵ֖ר אַתָּ֣ה וְ/יִרְמְיָ֑הוּ וְ/אִ֥ישׁ אַל יֵדַ֖ע אֵיפֹ֥ה אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/019.yaml
  text: Then the officials said to Baruch, “Go, hide yourself, you and Jeremiah, and let no one know where you are.”
translation:
  language: ko
  text: 그때 관리들이 바룩에게 말했습니다. "가서 숨어라. 너와 예레미야는 숨어 있어라. 아무도 너희가 어디 있는지 알지 못하게 하라."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관리들’은 שָׂרִים의 행정·통치 엘리트를 가리키는 현대적 대응입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 방백들
  lexicon: HALOT
  rationale: 왕실·행정 맥락의 שָׂרִים은 현대 한국어에서 지위와 기능을 분명히 드러내는 ‘관리들’이 가장 자연스럽습니다.
- source_word: לֵךְ הִסָּתֵר
  english_pob_choice: Go, hide yourself
  chosen_korean: 가서 숨어라
  alternatives_korean:
  - 가서 몸을 숨기라
  - 가서 자신을 숨겨라
  lexicon: HALOT
  rationale: 히필/니팔 명령의 연속은 한국어에서 간결한 명령형 ‘가서 숨어라’로 옮기면 자연스럽고, 숨김의 지시가 분명하게 드러납니다.
- source_word: אַתָּה וְיִרְמְיָהוּ
  english_pob_choice: you and Jeremiah
  chosen_korean: 너와 예레미야는
  alternatives_korean:
  - 너와 예레미야를
  - 너와 함께 있는 예레미야는
  lexicon: HALOT
  rationale: 명시된 2인 구조를 살리되, 한국어 어순에 맞게 앞에 배치해 바룩과 예레미야가 함께 숨으라는 뜻을 분명히 했습니다.
- source_word: וְאִישׁ אַל יֵדַע אֵיפֹה אַתֶּם
  english_pob_choice: and let no one know where you are
  chosen_korean: 아무도 너희가 어디 있는지 알지 못하게 하라
  alternatives_korean:
  - 아무도 너희의 행방을 알지 못하게 하라
  - 사람들로 하여금 너희가 어디 있는지 알지 못하게 하라
  lexicon: HALOT
  rationale: אִישׁ의 관용적 부정은 ‘아무도’로, 위치 질문은 ‘어디 있는지’로 옮겨 현재형 한국어에서 가장 자연스럽게 보존했습니다.
theological_decisions:
- issue: 직접 화법의 명령조
  chosen_reading: 군사·행정적 긴박함을 살려 명령형을 평이하게 유지했습니다.
  alternative_readings:
  - 더 완곡한 권고형
  - 높임말을 섞은 공손한 표현
  rationale: 원문은 바룩에게 즉각적인 은닉 지시를 내리는 장면이므로, 의미를 약화시키지 않도록 직접적인 명령조를 유지하는 것이 적절합니다.
  doctrine_reference: 본문 서술의 긴급성과 인물 간 권고/지시의 화행 보존
