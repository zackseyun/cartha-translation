id: JER.36.23
reference: Jeremiah 36:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/קְר֣וֹא יְהוּדִ֗י שָׁלֹ֣שׁ דְּלָתוֹת֮ וְ/אַרְבָּעָה֒ יִֽקְרָעֶ֨/הָ֙ בְּ/תַ֣עַר הַ/סֹּפֵ֔ר וְ/הַשְׁלֵ֕ךְ אֶל הָ/אֵ֖שׁ אֲשֶׁ֣ר אֶל הָ/אָ֑ח עַד תֹּם֙ כָּל הַ/מְּגִלָּ֔ה עַל הָ/אֵ֖שׁ אֲשֶׁ֥ר עַל הָ/אָֽח׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/023.yaml
  text: And whenever Yehudi had read three or four columns[a], he would cut it off with the scribe’s knife and throw it into the fire that was in the brazier[b], until the entire scroll was consumed in the fire that was in the brazier.
  footnotes:
  - marker: a
    text: Hebrew 'three or four doors'; here the term refers to divisions of the scroll, likely its columns or panels.
    reason: lexical_alternative
  - marker: b
    text: Or 'firepot' or 'hearth' for 'brazier.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 세 칸이나 네 칸을 읽을 때마다 그는 서기관의 칼로 그것을 잘라 화로 안의 불속에 던졌습니다. 그리고 온 두루마리가 화로 안의 불속에서 다 타 버릴 때까지 그랬습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּקְרֹא
  english_pob_choice: whenever ... had read
  chosen_korean: 읽을 때마다
  alternatives_korean:
  - 읽었을 때
  - 읽을 때
  lexicon: HALOT
  rationale: 반복되는 절단·소각 행동의 조건을 살려, 단회적 ‘~했을 때’보다 ‘~을 때마다’가 문맥의 반복성을 더 정확히 반영합니다.
- source_word: יְהוּדִי
  english_pob_choice: Yehudi
  chosen_korean: 유다
  alternatives_korean:
  - 예후디
  - 여후디
  lexicon: HALOT
  rationale: 히브리어 고유명사를 현대 한국어 음역으로 옮기되, 본문 맥락의 인명으로 자연스럽게 읽히는 형태를 택했습니다.
- source_word: שָׁלֹשׁ דְּלָתוֹת וְאַרְבָּעָה
  english_pob_choice: three or four columns
  chosen_korean: 세 칸이나 네 칸
  alternatives_korean:
  - 세 칸이나 네 부분
  - 세 칸이나 네 면
  lexicon: HALOT
  rationale: דלָתוֹת의 문자적 ‘문’보다 두루마리의 분할 단위를 가리키는 용법을 살려, 한국어에서는 읽어 내려가는 분절로 자연스러운 ‘칸’을 사용했습니다.
- source_word: בְּתַעַר הַסֹּפֵר
  english_pob_choice: with the scribe’s knife
  chosen_korean: 서기관의 칼로
  alternatives_korean:
  - 서기관의 칼로
  - 서기관의 면도칼로
  lexicon: HALOT
  rationale: תער는 날붙이/칼날이지만, 이 장면에서는 두루마리를 자르는 도구이므로 ‘칼’이 가장 간명하며, סופר는 문맥상 서기관으로 옮겼습니다.
- source_word: הָאָח
  english_pob_choice: the brazier
  chosen_korean: 화로
  alternatives_korean:
  - 화로통
  - 화덕
  lexicon: HALOT
  rationale: אָח은 불을 담는 기구를 가리키므로, 겨울 궁전의 실내 맥락에서 ‘화로’가 한국어 독자에게 가장 자연스럽고 기능을 잘 드러냅니다.
- source_word: עַד תֹּם כָּל הַמְּגִלָּה
  english_pob_choice: until the entire scroll was consumed
  chosen_korean: 온 두루마리가 ... 다 타 버릴 때까지
  alternatives_korean:
  - 온 두루마리가 ... 완전히 없어질 때까지
  - 두루마리 전체가 다 소진될 때까지
  lexicon: HALOT
  rationale: תֹם은 완료·끝남을 나타내지만, 앞선 반복적 소각과 결합될 때 ‘다 타 버리다’가 결과를 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 주어 생략 처리
  chosen_reading: 본문의 동사에 명시 주어가 없으므로 ‘그’로만 처리해 앞문맥의 인물(왕)을 본문에 덧붙이지 않았습니다.
  alternative_readings:
  - ‘왕이 그것을 잘라’
  - ‘그가 그것을 잘라’
  rationale: 히브리어는 여기서 주어를 생략하므로, 본문 밖 정보를 본문에 되돌려 넣지 않는 것이 소스 충실성에 부합합니다.
  doctrine_reference: '본문비평/번역 원칙: 명시되지 않은 서술 요소의 과잉보충 금지'
