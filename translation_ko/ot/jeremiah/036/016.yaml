id: JER.36.16
reference: Jeremiah 36:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/שָׁמְעָ/ם֙ אֶת כָּל הַ/דְּבָרִ֔ים פָּחֲד֖וּ אִ֣ישׁ אֶל רֵעֵ֑/הוּ וַ/יֹּֽאמְרוּ֙ אֶל בָּר֔וּךְ הַגֵּ֤יד נַגִּיד֙ לַ/מֶּ֔לֶךְ אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/016.yaml
  text: And when they heard all the words[a], each man turned in fear to his companion, and they said to Baruch, “We must surely tell the king all these words.”
  footnotes:
  - marker: a
    text: Or, “each man looked in fear to his companion.” The Hebrew idiom literally reads “they feared, each man to his companion,” expressing a mutual fearful reaction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그 모든 말을 들었을 때, 각 사람이 자기 동료를 향해 두려워하며 돌아보았습니다. 그리고 바룩에게 말하기를, "우리는 반드시 이 모든 말을 왕에게 알려야 합니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워하며 돌아보았습니다’는 히브리어 관용구를 풀어 옮긴 것으로, 직역하면 ‘각 사람이 자기 동료에게 두려워했습니다/두려워했습니다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעָם
  english_pob_choice: And when they heard
  chosen_korean: 그들이 그 모든 말을 들었을 때
  alternatives_korean:
  - 그들이 들었을 때
  - 그리고 그들이 들으니
  lexicon: HALOT
  rationale: 시간 전환을 자연스럽게 살리되, 히브리어 서술 전개를 한국어에서 무리 없이 표현했습니다.
- source_word: פָּחֲדוּ אִישׁ אֶל רֵעֵהוּ
  english_pob_choice: turned in fear to his companion
  chosen_korean: 각 사람이 자기 동료를 향해 두려워하며 돌아보았습니다
  alternatives_korean:
  - 각 사람이 자기 동료를 두려워했습니다
  - 서로 두려워했습니다
  - 각 사람이 자기 이웃을 향해 두려워했습니다
  lexicon: HALOT
  rationale: פָּחֲדוּ의 두려움과 אִישׁ אֶל רֵעֵהוּ의 상호 지향을 함께 살리기 위해, 단순히 ‘두려워했습니다’보다 ‘두려워하며 돌아보았습니다’를 택했습니다.
- source_word: הַגֵּיד נַגִּיד
  english_pob_choice: We must surely tell
  chosen_korean: 우리는 반드시 … 알려야 합니다
  alternatives_korean:
  - 우리는 반드시 … 말해야 합니다
  - 우리는 틀림없이 … 전해야 합니다
  - 우리는 꼭 … 알려야 합니다
  lexicon: HALOT
  rationale: 강조형 구성은 한국어에서 당위와 결심을 함께 드러내는 ‘반드시 … 해야 합니다’로 옮기는 것이 가장 자연스럽습니다.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: all these words
  chosen_korean: 이 모든 말
  alternatives_korean:
  - 이 모든 말씀
  - 이 모든 것
  lexicon: HALOT
  rationale: 문맥이 두루마리의 내용이므로 דְּבָרִים를 ‘말’로 유지해 반복을 살리고, 한국어에서는 앞의 ‘그 모든 말’과 뒤의 ‘이 모든 말’의 대조를 분명히 했습니다.
theological_decisions:
- issue: 두려움의 집단 반응을 어떻게 드러낼지
  chosen_reading: 개별 인물들의 내적 감정과 함께 서로를 향한 즉각적인 반응을 드러내는 표현을 택했습니다.
  alternative_readings:
  - 그들은 모두 두려워했습니다
  - 각 사람이 서로를 두려워했습니다
  rationale: 이 절은 단순 감정 묘사보다, 듣는 즉시 나타난 공동체적 동요를 보여주므로 양쪽 의미를 함께 보존하는 것이 본문 의도에 가깝습니다.
  doctrine_reference: 서사 본문의 정서적·공동체적 묘사 보존
