  source_fidelity: 핵심 의미는 대체로 잘 반영했습니다. 다만 פָּחֲדוּ אִישׁ אֶל־רֵעֵהוּ는 그들이 서로를 두려워했다기보다, 두려움에 사로잡혀 서로를 향한 공동 반응을 보였다는 관용적 표현입니다. ‘돌아보았습니다’는 원문에 명시되지 않은 회고·뒤돌아봄의 뉘앙스를 낼 수 있으므로 피하는 편이 안전합니다.
  naturalness: ‘그들이 … 들었을 때’와 ‘우리는 반드시 … 알려야 합니다’는 자연스럽고 합쇼체 문체에도 맞습니다. ‘바룩에게 말하기를’보다 ‘바룩에게 말했습니다’가 현대 표준 한국어 서술에서 더 자연스럽습니다.
  terminology: 바룩, 왕, 말의 번역은 적절합니다. 두루마리의 내용을 가리키는 דְּבָרִים를 ‘말’로 일관되게 옮긴 점도 적절합니다.
