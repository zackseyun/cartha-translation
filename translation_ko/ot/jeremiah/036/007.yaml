  source_fidelity: 수정이 필요합니다. 초안의 ‘그러면’은 히브리어 접속사 וְ를 결과 관계로 다소 강하게 한정합니다. 또한 ‘이 백성에게 말씀하신 분노와 진노’는 한국어에서 ‘분노와 진노’를 말씀의 수신자로 오해하게 할 수 있습니다. ‘이 백성을 향하여 선언하신’은 אֶל의 기본 방향성을 보존하면서 심판 문맥에 맞고 자연스럽습니다.
  naturalness: ‘간구가 야훼 앞에 떨어질지 모릅니다’는 원문의 관용구를 직역한 표현으로 현대 표준 한국어 본문에서는 부자연스럽습니다. 본문은 ‘드려지다’로 자연스럽게 옮기고, 문자적 ‘떨어지다’는 각주에서 밝히는 것이 적절합니다. 두 동사는 ‘…드려지고, …돌이킬지도 모릅니다’로 함께 가능성의 범위에 두는 편이 자연스럽습니다.
  terminology: ‘야훼’, ‘간구’, ‘각 사람’, ‘악한 길’, ‘돌이키다’, ‘분노와 진노’는 원문의 어휘와 현대 공적 성경 문체에 적절합니다. אִישׁ의 분배적 단수는 ‘각 사람’으로 보존합니다.
  issues:
