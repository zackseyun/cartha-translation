source:
  edition: WLC
  text: אוּלַ֞י תִּפֹּ֤ל תְּחִנָּתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה כִּֽי גָד֤וֹל הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל הָ/עָ֥ם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/007.yaml
  text: Perhaps their plea will fall before Yahweh[a], and each man will turn from his evil way[c][b], for great is the anger and the wrath that Yahweh has spoken against this people.
  footnotes:
  - marker: a
    text: Or 'their supplication will come before the LORD' or 'their petition will be presented before the LORD.' The Hebrew literally says 'their plea will fall before the LORD,' an idiom for an appeal being laid before him.
    reason: lexical_alternative
  - marker: b
    text: Or 'each one will turn.' The Hebrew reads 'each man,' using a masculine singular distributive form.
    reason: lexical_alternative
  - marker: c
    text: Or 'the LORD has spoken to this people.' The translation 'against this people' brings out the judgment context of the statement.
    reason: lexical_alternative
translation:
  language: ko
  text: 어쩌면 그들의 간구가 야훼 앞에 떨어질지 모릅니다[a]. 그러면 각 사람은 자기의 악한 길에서 돌아설 것입니다[b]. 왜냐하면 야훼께서 이 백성에게 말씀하신 분노와 진노가 크기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 간구가 야훼 앞에 떨어질’이라고 말하지만, 이는 간구가 하나님 앞에 받아들여지도록 제시된다는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어 אִישׁ은 남성 단수형이지만 여기서는 분배적으로 ‘각 사람’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 문자적으로 ‘야훼께서 이 백성에게 말씀하신’이라고 되어 있으나, 문맥상 심판의 내용이므로 ‘이 백성에게’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  english_pob_choice: Perhaps
  chosen_korean: 어쩌면
  alternatives_korean:
  - 혹시
  - 아마
  lexicon: HALOT
  rationale: 불확실하지만 가능성을 여는 어조를 살리되, 문어체로 자연스러운 표현을 택했습니다.
- source_word: תִּפֹּל תְּחִנָּתָם לִפְנֵי יְהוָה
  english_pob_choice: their plea will fall before Yahweh
  chosen_korean: 그들의 간구가 야훼 앞에 떨어질
  alternatives_korean:
  - 그들의 간청이 야훼 앞에 이르를
  - 그들의 탄원이 야훼 앞에 제시될
  lexicon: HALOT
  rationale: ‘떨어지다’의 히브리어 관용구를 살리면서, ‘간구’로 현대 한국어에서도 읽히는 간청의 뉘앙스를 유지했습니다.
- source_word: וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה
  english_pob_choice: each man will turn from his evil way
  chosen_korean: 각 사람은 자기의 악한 길에서 돌아설 것입니다
  alternatives_korean:
  - 각 사람은 자기의 악한 길에서 돌이킬 것입니다
  - 사람마다 자기의 악한 길에서 돌아설 것입니다
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각 사람’으로 살리고, שׁוּב는 회개를 과잉설명하지 않는 ‘돌아서다’로 옮겼습니다.
- source_word: גָדוֹל הָאַף וְהַחֵמָה
  english_pob_choice: great is the anger and the wrath
  chosen_korean: 분노와 진노가 크기 때문입니다
  alternatives_korean:
  - 노여움과 분노가 크기 때문입니다
  - 진노와 격분이 크기 때문입니다
  lexicon: HALOT
  rationale: אַף와 חֵמָה의 겹치는 분노 표현을 둘 다 살리되, 한국어에서 중복이 과도하지 않도록 ‘분노와 진노’로 자연스럽게 재현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 표준어휘 지침에 따라 신명기적 고유명사를 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 예언적 판단 맥락에서의 전치사 אֶל
  chosen_reading: ‘이 백성에게 말씀하신’으로 두되, 문맥상 심판 예고의 긴장을 본문 안에서 유지했습니다.
  alternative_readings:
  - ‘이 백성에게 말씀하신’
  - ‘이 백성을 향해 말씀하신’
  - ‘이 백성을 대적하여 말씀하신’
  rationale: 히브리어는 문자적으로 ‘~에게’이지만, 바로 앞뒤 문맥이 심판 선언이므로 과도한 해설 없이 한국어 문장 내부에서 분노·진노의 이유로 자연스럽게 읽히도록 했습니다.
  doctrine_reference: Jer 36 문맥의 심판 예고; source-contextual rendering
- issue: 문장 내 의미 연결의 명시화
  chosen_reading: ‘왜냐하면’으로 이유를 드러냈습니다.
  alternative_readings:
  - ‘이는’
  - ‘즉’
  rationale: 히브리어 כִּי의 원인 설명을 한국어 문장 구조에 맞게 분명히 하여, 앞절의 희망적 가능성과 뒤절의 심판 이유가 논리적으로 연결되도록 했습니다.
  doctrine_reference: Hebrew discourse connective כִּי
