  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤אוּ אֶל הַ/מֶּ֨לֶךְ֙ חָצֵ֔רָ/ה וְ/אֶת הַ/מְּגִלָּ֣ה הִפְקִ֔דוּ בְּ/לִשְׁכַּ֖ת אֱלִישָׁמָ֣ע הַ/סֹּפֵ֑ר וַ/יַּגִּ֨ידוּ֙ בְּ/אָזְנֵ֣י הַ/מֶּ֔לֶךְ אֵ֖ת כָּל הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/020.yaml
  text: Then they went to the king in the court[a], and they deposited the scroll in the chamber of Elishama the scribe[b], and they reported all the words in the hearing of the king.
  footnotes:
  - marker: a
    text: Or 'they left the scroll in safekeeping in the chamber of Elishama the scribe.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''in the ears of the king,'' an idiom meaning ''in the hearing of the king.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 왕에게, 곧 뜰로 갔습니다. 그리고 그 두루마리를 서기관 엘리사마의 방에 맡겨 두었으며, 왕의 귀에 그 모든 말을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “왕의 귀에”입니다. 히브리어 관용구로서 “왕이 듣는 자리에서/왕의 들음 속에”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל הַמֶּלֶךְ חָצֵרָה
  english_pob_choice: Then they went to the king in the court
  chosen_korean: 왕에게, 곧 뜰로 갔습니다
  alternatives_korean:
  - 왕의 뜰로 갔습니다
  - 왕이 있는 뜰로 갔습니다
  - 왕에게 갔습니다
  lexicon: HALOT
  rationale: 히브리어는 왕에게 가는 이동과 뜰 방향성을 함께 보여 주므로, 한국어에서는 ‘왕에게, 곧 뜰로’로 자연스럽게 살려 둘 다 드러냈습니다.
- source_word: וְאֶת הַמְּגִלָּה הִפְקִדוּ
  english_pob_choice: and they deposited the scroll
  chosen_korean: 그 두루마리를 서기관 엘리사마의 방에 맡겨 두었으며
  alternatives_korean:
  - 그 두루마리를 맡겨 두었으며
  - 그 두루마리를 보관해 두었으며
  - 그 두루마리를 맡겼으며
  lexicon: HALOT
  rationale: הִפְקִדוּ는 단순 ‘두다’보다 ‘맡기다/보관해 두다’의 의미가 강해, 공식적 보관이라는 뉘앙스를 살려 ‘맡겨 두다’로 옮겼습니다.
- source_word: בְּלִשְׁכַּת אֱלִישָׁמָע הַסֹּפֵר
  english_pob_choice: in the chamber of Elishama the scribe
  chosen_korean: 서기관 엘리사마의 방에
  alternatives_korean:
  - 서기관 엘리사마의 방에
  - 서기관 엘리사마의 방으로
  - 서기관 엘리사마의 실에
  lexicon: HALOT
  rationale: לִשְׁכָּה는 궁정 맥락에서 공식적인 방/실을 가리킬 수 있지만, 현대 한국어에서는 ‘방’이 가장 자연스럽고 이해하기 쉬워 선택했습니다.
- source_word: בְּאָזְנֵי הַמֶּלֶךְ
  english_pob_choice: in the hearing of the king
  chosen_korean: 왕의 귀에
  alternatives_korean:
  - 왕이 들을 수 있도록
  - 왕의 들음 앞에서
  - 왕이 듣는 데
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘왕의 귀에’이지만, 한국어에서는 대상에게 직접 전하는 느낌이 자연스러워도 원문 이미지를 살려 유지했습니다.
