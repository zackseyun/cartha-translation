base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/026.yaml
  text: Then the king commanded Jerahmeel the king’s son[a], and Seraiah son of Azriel, and Shelemiah son of Abdeel, to seize Baruch the scribe and Jeremiah the prophet[b], but Yahweh hid them.
  footnotes:
  - marker: a
    text: 'Hebrew: ''to take.'' The sense here is to apprehend or seize them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Yahweh hid them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 왕이 왕의 아들 여라므엘과 아스리엘의 아들 스라야와 아브디엘의 아들 스렘야를 보내어 서기관 바룩과 예언자 예레미야를 붙잡게 했습니다. 그러나 야훼께서 그들을 숨기셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘붙잡게 했습니다’는 히브리어 לָקַחַת의 문맥상 뜻을 풀어 옮긴 것입니다. 기본 뜻은 ‘가져가다/취하다’이지만, 여기서는 체포·연행 시도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼께서 그들을 숨기셨습니다’는 ‘야훼께서 그들을 숨기셨다’라는 본문 읽기를 따른 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֶּה
  english_pob_choice: commanded
  chosen_korean: 보내어 … 붙잡게 했습니다
  alternatives_korean:
  - 명령했습니다
  - 지시했습니다
  lexicon: HALOT
  rationale: 히브리어 צוה의 권위 있는 명령을 살리되, 한국어에서는 뒤의 לָקַחַת와 함께 ‘붙잡게 하다’로 풀어 왕의 명령이 체포 시도를 지시했다는 점을 분명히 했습니다.
- source_word: יְרַחְמְאֵל בֶּן הַמֶּלֶךְ
  english_pob_choice: Jerahmeel the king’s son
  chosen_korean: 왕의 아들 여라므엘
  alternatives_korean:
  - 여라므엘, 왕의 아들
  - 여라므엘 왕자
  lexicon: HALOT
  rationale: בן־המלך의 직역인 ‘왕의 아들’을 유지했고, ‘왕자’는 관직적 뉘앙스를 더하므로 피했습니다.
- source_word: לָקַחַת
  english_pob_choice: to seize
  chosen_korean: 붙잡게
  alternatives_korean:
  - 잡게
  - 체포하게
  lexicon: HALOT
  rationale: 문맥상 적대적 사로잡음을 나타내므로 ‘붙잡다’가 가장 자연스럽고, ‘체포하다’는 현대 법률 절차를 너무 강하게 떠올리게 합니다.
- source_word: בָּרוּךְ הַסֹּפֵר
  english_pob_choice: Baruch the scribe
  chosen_korean: 서기관 바룩
  alternatives_korean:
  - 바룩 서기관
  - 서기 바룩
  lexicon: HALOT
  rationale: סֹפֵר는 여기서 예언서와 관련된 필경/기록 담당을 가리키므로, 전통적이면서도 명확한 ‘서기관’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문자화된 신명 YHWH를 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 호칭 대체 없이 고유명을 드러냈습니다.
theological_decisions:
- issue: 왕의 명령과 하나님의 보호가 대비되는 구조
  chosen_reading: 왕이 붙잡게 하려 했지만, 야훼께서 그들을 숨기셨습니다
  alternative_readings:
  - 왕이 잡으라고 명령했지만 야훼께서 숨기셨습니다
  - 왕의 시도에도 불구하고 야훼께서 그들을 감추셨습니다
  rationale: 히브리어 본문은 인간 권력의 시도와 야훼의 보호 행위를 대조합니다. ‘숨기셨습니다’는 신적 주어의 능동적 보호를 보존합니다.
  doctrine_reference: 섭리와 보호에 관한 본문 내러티브
