lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 전하였습니다
  alternatives_korean:
  - 말하였습니다
  - 알렸습니다
  lexicon: HALOT
  rationale: נגד의 히필은 정보를 알려 주는 뜻이므로, 공식적이지만 자연스러운 ‘전하였습니다’로 보고의 성격을 살렸습니다.
- source_word: אֵת כָּל הַדְּבָרִים
  english_pob_choice: all the words
  chosen_korean: 그 모든 말
  alternatives_korean:
  - 모든 말
  - 그 모든 말씀
  lexicon: HALOT
  rationale: 히브리어 ‘말들/말씀들’의 반복성과 내용 전체성을 살리면서, 한국어에서는 문맥상 자연한 ‘그 모든 말’로 옮겼습니다.
- source_word: בִּקְרֹא
  english_pob_choice: when Baruch read
  chosen_korean: 바룩이 … 읽을 때
  alternatives_korean:
  - 바룩이 … 읽는 동안
  - 바룩이 … 읽을 때에
  lexicon: HALOT
  rationale: 부정사구의 시간적 상황을 한국어의 ‘-을 때’로 자연스럽게 옮겼습니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: the scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 책
  - 기록문
  lexicon: HALOT
  rationale: 예레미야 36장의 문맥에서 סֵפֶר는 책보다 문서/두루마리를 가리키므로, 본문의 물질적 형식을 드러내는 ‘두루마리’가 가장 적절합니다.
- source_word: בְּאָזְנֵי הָעָם
  english_pob_choice: in the hearing of the people
  chosen_korean: 백성의 들으는 데서
  alternatives_korean:
  - 백성이 듣는 데서
  - 백성 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 공적 청취 상황을 보존하려 했고, 직역에 가까운 표현으로 문면을 반영했습니다.
