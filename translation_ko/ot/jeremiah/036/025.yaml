base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/025.yaml
  text: Yet even Elnathan[a], Delaiah, and Gemariah urged the king not to burn the scroll, but he did not listen to them.
  footnotes:
  - marker: a
    text: Or 'pleaded with the king not to burn the scroll.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 엘르아난과 들라야와 그마랴도 왕에게 그 두루마리를 태우지 말라고 간청했지만, 왕은 그들의 말을 듣지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕에게 그 두루마리를 태우지 말라고 간청했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Yet even
  chosen_korean: 그러나 …도
  alternatives_korean:
  - 또한
  - 더욱이
  - 게다가
  lexicon: HALOT
  rationale: 문맥상 앞선 거절에도 불구하고 이들도 개입했다는 양보·대조의 뉘앙스가 있어, 단순한 덧셈보다 ‘그러나 …도’가 자연스럽고 원문의 강조를 살립니다.
- source_word: הִפְגִּעוּ בַּמֶּלֶךְ
  english_pob_choice: urged the king
  chosen_korean: 왕에게 … 간청했습니다
  alternatives_korean:
  - 왕에게 … 호소했습니다
  - 왕에게 … 부탁했습니다
  - 왕을 설득했습니다
  lexicon: HALOT
  rationale: פגע의 히필은 상대에게 간절히 요청하거나 매달리는 뜻이므로, 한국어에서는 ‘간청하다’가 어조와 긴급성을 가장 잘 드러냅니다.
- source_word: לְבִלְתִּי שְׂרֹף
  english_pob_choice: not to burn
  chosen_korean: 태우지 말라고
  alternatives_korean:
  - 태우지 않도록
  - 태우지 말라며
  - 불태우지 말라고
  lexicon: HALOT
  rationale: 이 부정 목적절은 왕의 행동을 막는 요청이므로, 현대 한국어에서 직접명령 인용형인 ‘-지 말라고’가 가장 분명합니다.
- source_word: הַמְּגִלָּה
  english_pob_choice: the scroll
  chosen_korean: 그 두루마리
  alternatives_korean:
  - 그 책
  - 그 문서
  - 그 두루마기
  lexicon: HALOT
  rationale: מְגִלָּה는 문맥상 기록된 두루마리를 가리키므로, 표준적이고 구체적인 ‘두루마리’가 적합합니다.
- source_word: וְלֹא שָׁמַע אֲלֵיהֶם
  english_pob_choice: but he did not listen to them
  chosen_korean: 왕은 그들의 말을 듣지 않았습니다
  alternatives_korean:
  - 왕은 그들에게 귀 기울이지 않았습니다
  - 왕은 그들을 듣지 않았습니다
  - 왕은 그들의 말을 따르지 않았습니다
  lexicon: HALOT
  rationale: שׁמע אֶל은 요청에 응해 듣는 의미이므로, 한국어에서는 관용적으로 ‘그들의 말을 듣지 않았다’가 가장 자연스럽고 원문의 거부를 분명히 전합니다.
