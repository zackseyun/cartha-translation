  - severity: low
    issue: 각주가 본문과 동일한 표현을 반복함
    rationale: 본문의 '간청했습니다'와 각주의 '간청했습니다'는 실질적인 번역 대안이 아닙니다. 히필 פגע의 가능한 어휘 대안인 '호소했습니다'를 제시하는 편이 각주의 lexical_alternative 목적에 맞습니다.
  revised_text: 그러나 엘라단과 들라야와 그마랴도 왕에게 그 두루마리를 태우지 말라고 간청했으나, 왕은 그들의 말을 듣지 않았습니다.[a]
