language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א בָר֥וּךְ בַּ/סֵּ֛פֶר אֶת דִּבְרֵ֥י יִרְמְיָ֖הוּ בֵּ֣ית יְהוָ֑ה בְּ/לִשְׁכַּ֡ת גְּמַרְיָהוּ֩ בֶן שָׁפָ֨ן הַ/סֹּפֵ֜ר בֶּ/חָצֵ֣ר הָ/עֶלְי֗וֹן פֶּ֣תַח שַׁ֤עַר בֵּית יְהוָה֙ הֶֽ/חָדָ֔שׁ בְּ/אָזְנֵ֖י כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/010.yaml
  text: And Baruch read from the scroll the words of Jeremiah in the house of Yahweh[a], in the chamber of Gemariah son of Shaphan the scribe, in the upper court, at the entrance of the new gate of the house of Yahweh, in the hearing of all the people.
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD' for 'the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바룩은 야훼의 집,[a] 곧 윗뜰에 있는 서기관 사반의 아들 그마랴의 방에서, 야훼의 집 새 문 어귀에서 온 백성이 듣는 가운데 두루마리에 적힌 예레미야의 말씀을 읽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 집’은 성전을 가리키는 원문의 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독했습니다
  - 선포했습니다
  lexicon: HALOT
  rationale: 문맥상 문서를 소리 내어 읽는 행위이므로 단순한 ‘읽다’가 가장 자연스럽고, 공개 낭독의 성격은 뒤의 ‘듣는 데서’가 보완합니다.
- source_word: בַּסֵּפֶר
  english_pob_choice: from the scroll
  chosen_korean: 두루마리에서
  alternatives_korean:
  - 책에서
  - 두루마리 안에서
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 기록문서/두루마리를 가리키므로 역사적 배경에 맞춰 ‘두루마리’로 옮겼습니다. 한국어에서는 ‘에서’가 קרא와 결합한 출처 의미를 자연스럽게 살립니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 성전
  lexicon: HALOT
  rationale: 원문 직역형을 살리되, 이 역본의 기본 표기인 ‘여호와’를 사용했습니다. ‘성전’은 의미상 설명이지만 원문의 표현을 대체하므로 본문에는 두지 않았습니다.
- source_word: בְּלִשְׁכַּת ... בֶּחָצֵר הָעֶלְיוֹן
  english_pob_choice: in the chamber ... in the upper court
  chosen_korean: 그마랴의 방에 있는 윗뜰
  alternatives_korean:
  - 그마랴의 방에 있는 위 뜰
  - 그마랴의 방이 있는 윗뜰
  lexicon: HALOT
  rationale: לִשְׁכָּה는 공식 공간의 ‘방/전실’에 가까우므로 ‘방’으로 옮기고, בֶּחָצֵר הָעֶלְיוֹן은 성전 공간의 위계가 드러나게 ‘윗뜰’로 간명하게 처리했습니다.
- source_word: בְּאָזְנֵי כָּל הָעָם
  english_pob_choice: in the hearing of all the people
  chosen_korean: 온 백성이 듣는 데서
  alternatives_korean:
  - 모든 백성이 듣는 가운데
  - 온 백성의 귀에
  lexicon: HALOT
  rationale: 직역하면 ‘온 백성의 귀에’이지만 한국어에서는 어색하므로, 공적 낭독의 관용적 의미를 살려 ‘듣는 데서’로 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문에는 ‘여호와’로 옮기고, 본문의 직설적 반복을 유지했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 프로젝트의 기본 표기는 학술적 음역 ‘야훼’이지만, 제공된 영어 POB가 이 절에서 ‘the LORD’ 대신 주석을 통해 경로를 표시하므로, 한국어 본문은 기존 POB 전통과 출판 가독성을 고려해 ‘여호와’로 처리했습니다. 다만 이는 본문 선택의 차이로, 원문의 신명 재현이라는 긴장은 유지됩니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
