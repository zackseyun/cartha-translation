- from: 바룩은 여호와의 집에서, 곧 서기관 사반의 아들 그마랴의 방에 있는 윗뜰, 여호와의 집의 새 문 입구에서, 온 백성이 듣는 데서 두루마리에서 예레미야의 말씀을 읽었습니다.[a]
  to: 바룩은 야훼의 집,[a] 곧 윗뜰에 있는 서기관 사반의 아들 그마랴의 방에서, 야훼의 집 새 문 어귀에서 온 백성이 듣는 가운데 두루마리에 적힌 예레미야의 말씀을 읽었습니다.
