source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
  footnotes:
  - marker: a
    text: Or 'all the calamity'; Hebrew 'all the evil/disaster.' In this context it refers to the judgment God threatens to bring on Judah, not moral evil in God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man.' The singular masculine form is used representatively for the members of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 아마도 유다의 집이 내가 그들에게 내리려고 계획하는 모든 재앙에 관한 말을 듣고,[a] 각 사람이[b] 자기의 악한 길에서 돌이키면, 나는 그들의 죄악과 죄를 용서할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 רָעָה는 이 문맥에서 도덕적 악이 아니라 유다에 내릴 재앙이나 심판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 남성 ‘사람’을 사용하지만, 문맥상 유다 공동체의 구성원들을 대표적으로 가리킵니다.
    reason: lexical_alternative
