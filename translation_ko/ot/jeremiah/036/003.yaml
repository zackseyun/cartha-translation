  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוּלַ֤י יִשְׁמְעוּ֙ בֵּ֣ית יְהוּדָ֔ה אֵ֚ת כָּל הָ֣/רָעָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י חֹשֵׁ֖ב לַ/עֲשׂ֣וֹת לָ/הֶ֑ם לְמַ֣עַן יָשׁ֗וּבוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֔ה וְ/סָלַחְתִּ֥י לַ/עֲוֺנָ֖/ם וּ/לְ/חַטָּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/003.yaml
  text: Perhaps the house of Judah will hear of all the disaster that I am planning to bring on them[a], so that each man may turn from his evil way[b], and I will forgive their iniquity and their sin.
  footnotes:
  - marker: a
    text: Or 'all the calamity'; Hebrew 'all the evil/disaster.' In this context it refers to the judgment God threatens to bring on Judah, not moral evil in God.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man.' The singular masculine form is used representatively for the members of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 아마도 유다의 집은 내가 그들에게 가져오려고 계획하는 모든 재앙을 듣고, 각 사람이 자기의 악한 길에서 돌이키게 될 것이며, 나는 그들의 죄악과 그들의 죄를 용서할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 רָעָה는 이 문맥에서 도덕적 악이 아니라 유다에 내릴 재앙이나 심판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 단수 남성 ‘사람’을 사용하지만, 문맥상 유다 공동체의 구성원들을 대표적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  english_pob_choice: Perhaps
  chosen_korean: 아마도
  alternatives_korean:
  - 혹시
  - 어쩌면
  lexicon: HALOT
  rationale: 불확실성과 기대를 함께 나타내는 אפשר성 표현으로, 예언 문맥의 조심스러운 가능성을 자연스럽게 살립니다.
- source_word: בֵּית יְהוּדָה
  english_pob_choice: the house of Judah
  chosen_korean: 유다의 집
  alternatives_korean:
  - 유다 집안
  - 유다 백성
  lexicon: HALOT
  rationale: 히브리어의 관용적 공동체 표현을 살리되 한국어에서 지나치게 직역투가 되지 않도록 간결하게 옮겼습니다.
- source_word: אֵת כָּל הָרָעָה
  english_pob_choice: all the disaster
  chosen_korean: 모든 재앙
  alternatives_korean:
  - 모든 악
  - 모든 재난
  - 모든 불행
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 하나님의 도덕적 악이 아니라 심판으로 임할 재난을 가리키므로, 오해를 피하는 ‘재앙’을 채택했습니다.
- source_word: לְמַעַן יָשׁוּבוּ אִישׁ מִדַּרְכּוֹ הָרָעָה
  english_pob_choice: so that each man may turn from his evil way
  chosen_korean: 각 사람이 자기의 악한 길에서 돌이키게 될 것이며
  alternatives_korean:
  - 각 사람이 자기의 악한 길에서 돌아서게 될 것이며
  - 각 사람이 자기의 악한 길에서 회개하게 될 것이며
  lexicon: HALOT
  rationale: יָשׁוּבוּ는 예언서에서 반복되는 ‘돌이키다/돌아오다’의 핵심 의미를 살리고, אִישׁ의 단수 남성 형식을 ‘각 사람’으로 대표적으로 반영했습니다.
- source_word: וְסָלַחְתִּי
  english_pob_choice: and I will forgive
  chosen_korean: 나는 ... 용서할 것입니다
  alternatives_korean:
  - 나는 ... 사할 것입니다
  - 내가 ... 용서하겠습니다
  lexicon: HALOT
  rationale: 미래형의 단순한 결과 진술을 살리면서, 한국어에서 문맥상 자연스러운 공손한 미래 표현을 사용했습니다.
theological_decisions:
- issue: 재앙/재난으로서의 רָעָה를 하나님의 행위로 표현하는 문제
  chosen_reading: ‘재앙’으로 번역해 하나님이 도덕적 악을 행하신다는 오해를 피했습니다.
  alternative_readings:
  - 악
  - 재난
  - 불행
  rationale: 본절은 하나님이 유다에 내리려는 심판을 말하므로, רָעָה를 도덕적 악이 아닌 심판의 재앙으로 읽는 것이 문맥에 충실합니다.
  doctrine_reference: 예언서 심판 언어의 문맥적 해석
- issue: אִישׁ의 대표적 단수 형식
  chosen_reading: ‘각 사람’으로 옮겨 공동체 전체를 대표하는 단수 남성 형식을 반영했습니다.
  alternative_readings:
  - 각자
  - 모든 사람
  rationale: 히브리어의 단수 남성 표현을 무성별 일반화로 완전히 지우지 않되, 한국어에서는 의미상 공동체 전체를 가리키는 표현으로 자연스럽게 전달했습니다.
  doctrine_reference: 번역 원칙상 대표적 남성 단수 형식 보존
