    rationale: 히브리어 본문은 바룩이 야훼의 말씀을 기록했다고 말하지 않고, 두루마리에서 그 말씀을 읽었다고 말합니다.
  - severity: high
    issue: ‘읽게 하였습니다’가 행위 주체를 바꿈
    rationale: לִקְרֹא는 바룩이 예레미야의 명령에 따라 수행한 목적 행위입니다. 사역/허용 표현은 원문에 없습니다.
  - severity: medium
    issue: 각주에 히브리어가 아닌 ‘כאן’이 포함됨
    rationale: 각주는 ‘여기’를 뜻하는 히브리어 단어를 부적절하게 삽입했으며, 본문 수정 후에는 해당 문화 주석도 필수적이지 않습니다.
