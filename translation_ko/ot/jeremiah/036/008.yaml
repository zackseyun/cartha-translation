  text: וַ/יַּ֗עַשׂ בָּרוּךְ֙ בֶּן נֵ֣רִיָּ֔ה כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יִרְמְיָ֣הוּ הַ/נָּבִ֑יא לִ/קְרֹ֥א בַ/סֵּ֛פֶר דִּבְרֵ֥י יְהוָ֖ה בֵּ֥ית יְהֹוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/008.yaml
  text: And Baruch son of Neriah did according to all that Jeremiah the prophet had commanded him, to read from the scroll the words of the LORD in the house of the LORD.
translation:
  language: ko
  text: 네리야의 아들 바룩은 예레미야 선지자가 그에게 명령한 모든 대로 행하여, 야훼의 말씀들을 책에 기록하고 야훼의 집에서 읽게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책’은 כאן의 סֵפֶר를 현대 한국어에서 이해하기 쉬운 형태로 옮긴 것으로, 두루마리/서책의 기능을 함께 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ
  english_pob_choice: according to all that ... had commanded him
  chosen_korean: 그에게 명령한 모든 대로
  alternatives_korean:
  - 명령한 그대로
  - 그가 명령한 모든 것을 따라
  lexicon: צוה
  rationale: 명령의 전면적 준수를 나타내는 구문이므로, 행위의 완전한 순종을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: לִ/קְרֹ֥א
  english_pob_choice: to read
  chosen_korean: 읽게 하였습니다
  alternatives_korean:
  - 읽도록 하였습니다
  - 낭독하게 하였습니다
  lexicon: קרא
  rationale: 본문이 서책에서의 공개 낭독을 가리키므로, 목적의 불변사로 ‘읽게 하였습니다’를 사용해 서술 흐름을 살렸습니다.
- source_word: בַּ/סֵּ֛פֶר דִּבְרֵ֥י יְהוָ֖ה
  english_pob_choice: from the scroll the words of the LORD
  chosen_korean: 야훼의 말씀들을 책에
  alternatives_korean:
  - 야훼의 말씀들이 적힌 두루마리에서
  - 야훼의 말씀을 두루마리에서
  lexicon: ספר / דברי
  rationale: סֵפֶר은 두루마리/책의 물질적 매체를 가리키므로 ‘책에’로만 두지 않고, 내용과 매체를 함께 살릴 수 있도록 본문 흐름 안에서 자연스럽게 풀었습니다. ‘말씀들’은 히브리어 복수형 דִּבְרֵי를 반영합니다.
- source_word: בֵּ֥ית יְהֹוָֽה
  english_pob_choice: in the house of the LORD
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 여호와의 성전에서
  - 주님의 집에서
  lexicon: בית + יהוה
  rationale: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, 성전 문맥의 관용적 의미를 유지하면서도 원문 표현을 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: יהוה의 번역과 예레미야의 선지자 권위
  chosen_reading: 하나님의 언약 이름을 ‘야훼’로 유지하고, 예레미야를 ‘선지자’로 옮겨 본문이 바룩의 순종이 예언자적 명령에 대한 순종임을 분명히 했습니다.
  alternative_readings:
  - 여호와로 표기
  - 예언자 대신 ‘대언자’ 또는 ‘예언자’
  rationale: 본문은 야훼의 말씀을 선포/낭독하는 맥락이므로, 신명기적 언약 명칭을 가리는 관습 번역보다 원문 호명성을 살리는 것이 적절합니다.
  doctrine_reference: Divine name transliteration policy; prophetic office terminology
