revisions:
- from: 네리야의 아들 바룩은 예레미야 선지자가 그에게 명령한 모든 대로 행하여, 야훼의 말씀들을 책에 기록하고 야훼의 집에서 읽게 하였습니다.[a]
  to: 네리야의 아들 바룩은 예언자 예레미야가 그에게 명령한 모든 대로 행하여, 야훼의 집에서 두루마리에 적힌 야훼의 말씀을 읽었습니다.
  rationale: ‘기록하고’와 사역형 ‘읽게 하였습니다’를 제거하고, 바룩이 직접 두루마리에서 야훼의 말씀을 읽었다는 원문의 통사와 의미를 회복했습니다. ‘두루마리에 적힌’은 בַּסֵּפֶר의 매체 기능을 자연스러운 한국어로 드러내되, 기록 행위의 주체를 바룩으로 추가하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:15Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 לִקְרֹא(‘읽다’)를 ‘읽게 하였습니다’로 옮겨 바룩이 읽도록 다른 사람에게 시킨 것처럼 만들며, 원문에 없는 ‘기록하고’를 추가했습니다. 또한 בַּסֵּפֶר는 말씀을 기록하는 행위가 아니라 말씀을 읽는 매체/출처를 나타냅니다.
  naturalness: 수정문은 한국어의 자연스러운 합쇼체 서술을 유지하면서, 바룩이 명령에 따라 직접 낭독했다는 문장 구조를 분명히 합니다.
  terminology: ‘예언자’는 현대 표준어에서 자연스럽고 원문의 הַנָּבִיא에 충실합니다. 신명은 프로젝트의 선택을 따라 ‘야훼’로 유지했습니다. סֵפֶר는 이 문맥에서 ‘두루마리’로 옮겼습니다.
  issues:
