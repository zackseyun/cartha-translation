  source_fidelity: ‘이제’는 히브리어 접속사 וְ의 가능한 담화 기능을 과도하게 시간 부사로 특정하며, 제공된 영어 감사 이력도 이를 제거했습니다. 또한 ‘겨울 궁’은 בֵּית הַחֹרֶף(겨울철 거처/집)를 궁전으로 과도하게 구체화합니다. ‘겨울 거처’는 계절용 거주 공간이라는 뜻을 보존합니다.
