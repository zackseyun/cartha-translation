base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/022.yaml
  text: Now the king was sitting in the winter house in the ninth month[a], with the brazier burning before him.
  footnotes:
  - marker: a
    text: Or 'the fire pot'; the Hebrew term refers to a container for coals or fire used for warmth.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 아홉째 달에 겨울 거처에 앉아 있었으며, 그의 앞에서는 화로[a]가 타고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불그릇’. 히브리어는 따뜻하게 하기 위해 숯이나 불을 담아 쓰는 용기를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  english_pob_choice: Now the king
  chosen_korean: 이제 왕은
  alternatives_korean:
  - 그리고 왕은
  - 그 왕은
  lexicon: HALOT
  rationale: 서두의 ו는 서술 전환을 자연스럽게 여는 용법으로 보아 ‘이제’로 옮겨 장면 설정을 살렸습니다. 히브리어의 정관성도 ‘왕은’으로 반영했습니다.
- source_word: יוֹשֵׁב
  english_pob_choice: was sitting
  chosen_korean: 앉아 있었고
  alternatives_korean:
  - 앉아 있었는데
  - 앉아 있었습니다
  lexicon: HALOT
  rationale: 분사형이 지속적 상황을 나타내므로 단순 과거 ‘앉았다’보다 진행·지속을 드러내는 표현을 택했습니다.
- source_word: בֵּית הַחֹרֶף
  english_pob_choice: the winter house
  chosen_korean: 겨울 궁
  alternatives_korean:
  - 겨울 집
  - 겨울 거처
  lexicon: HALOT
  rationale: 직역인 ‘겨울 집’도 가능하지만, 문맥상 왕의 거처이므로 한국어에서 자연스러운 ‘궁’으로 옮기되 계절용 별궁이라는 의미를 유지했습니다.
- source_word: הָאָח
  english_pob_choice: the brazier
  chosen_korean: 화로
  alternatives_korean:
  - 화기
  - 불그릇
  lexicon: HALOT
  rationale: 포터블한 열원 용기를 가리키므로 ‘화로’가 가장 간결하고 이해하기 쉬운 대응어입니다. 전통적 교회어휘보다 사물 의미를 직접 드러내는 쪽을 택했습니다.
theological_decisions:
- issue: 상황 서술의 톤과 왕의 상태 표현
  chosen_reading: 장면을 설명하는 서술문으로 처리해 특별한 강조나 평가를 덧붙이지 않았습니다.
  alternative_readings:
  - ‘왕은 앉아 있었습니다’처럼 완결된 서술
  - ‘왕이 앉아 있더라’ 같은 문어적 종결
  rationale: 본문은 역사적 배경 설명이므로 원문의 담담한 서술 기능을 유지하는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
