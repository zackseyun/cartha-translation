  text: וַ/יֵּ֤רֶד בֵּית הַ/מֶּ֨לֶךְ֙ עַל לִשְׁכַּ֣ת הַ/סֹּפֵ֔ר וְ/הִ֨נֵּה שָׁ֔ם כָּל הַ/שָּׂרִ֖ים יֽוֹשְׁבִ֑ים אֱלִישָׁמָ֣ע הַ/סֹּפֵ֡ר וּ/דְלָיָ֣הוּ בֶן שְׁ֠מַעְיָהוּ וְ/אֶלְנָתָ֨ן בֶּן עַכְבּ֜וֹר וּ/גְמַרְיָ֧הוּ בֶן שָׁפָ֛ן וְ/צִדְקִיָּ֥הוּ בֶן חֲנַנְיָ֖הוּ וְ/כָל הַ/שָּׂרִֽים־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/012.yaml
  text: 'he went down to the king''s house, to the scribe''s chamber, and behold, all the officials were sitting there: Elishama the scribe, Delaiah son of Shemaiah, Elnathan son of Achbor, Gemariah son of Shaphan, Zedekiah son of Hananiah, and all the officials.'
translation:
  language: ko
  text: 그가 왕궁으로 내려가 서기관의 방으로 갔는데, 보니 모든 고관들이 거기에 앉아 있었습니다. 엘리사마는 서기관이었고, 들라야는 스마야의 아들이며, 엘르아낫은 악볼의 아들, 그마랴는 사반의 아들, 시드기야는 하나냐의 아들이었고, 모든 고관들이 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּ֤רֶד / he went down
  english_pob_choice: he went down
  chosen_korean: 내려가
  alternatives_korean:
  - 갔습니다
  - 내려왔습니다
  lexicon: ירד
  rationale: 히브리어 ירד의 기본 동작은 ‘내려가다’이므로, 지형·층위 이동을 드러내는 직역을 유지했습니다.
- source_word: בֵּית הַמֶּלֶךְ / the king's house
  english_pob_choice: the king's house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 왕실
  lexicon: בַּיִת
  rationale: 문맥상 단순한 주택보다 왕의 거처/궁정을 가리키는 표현이 자연스러워, 한국어에서 통용되는 ‘왕궁’으로 옮겼습니다.
- source_word: לִשְׁכַּת הַסֹּפֵר / the scribe's chamber
  english_pob_choice: the scribe's chamber
  chosen_korean: 서기관의 방
  alternatives_korean:
  - 서기관의 서재
  - 기록관의 방
  lexicon: לִשְׁכָּה
  rationale: לִשְׁכָּה는 공적 업무 공간을 뜻하지만, 현대 한국어에서는 가장 직접적이고 오해가 적은 ‘방’으로 처리했습니다.
- source_word: הַשָּׂרִים / all the officials
  english_pob_choice: all the officials
  chosen_korean: 모든 고관들
  alternatives_korean:
  - 모든 관원들
  - 모든 관리들
  lexicon: שַׂר
  rationale: שָׂר은 단순한 일반 관리보다 지위가 있는 고위 인물을 가리키므로, 위계감을 살리는 ‘고관들’을 택했습니다.
theological_decisions:
- issue: 서술의 반복 구조("all the officials"의 앞뒤 반복)
  chosen_reading: 마지막의 ‘모든 고관들이 있었습니다’도 본문 구조대로 유지했습니다.
  alternative_readings:
  - 뒤의 반복을 생략하고 문장을 매끈하게 다듬기
  - 앞의 ‘모든 고관들’만 남기기
  rationale: 히브리어 본문은 명단 앞뒤를 반복해 장면의 완결성과 집합성을 강조하므로, 한국어에서도 중복을 의도된 강조로 보존했습니다.
  doctrine_reference: textual fidelity / discourse emphasis
