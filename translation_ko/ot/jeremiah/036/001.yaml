  yaml_path: translation/ot/jeremiah/036/001.yaml
  text: Now in the fourth year of Jehoiakim son of Josiah[a], king of Judah, this word came to Jeremiah from Yahweh, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''from Yahweh.'' The divine name יְהוָה is rendered ''the LORD'' in keeping with the project''s stated convention.'
