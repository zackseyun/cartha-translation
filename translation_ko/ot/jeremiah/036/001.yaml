translation:
  language: ko
  text: 요시야의 아들 유다 왕 여호야김의 넷째 해에 야훼로부터 이 말씀이 예레미야에게 임하셨습니다. 말하자면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘야훼로부터’. 본문에서는 परियोजना 기본어에 따라 하나님의 이름 יְהוָה를 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִת
  english_pob_choice: in the fourth year
  chosen_korean: 넷째 해에
  alternatives_korean:
  - 네 번째 해에
  - 4년에
  lexicon: HALOT
  rationale: 연대 표시는 한국어에서 자연스러운 왕정 연대 표현인 ‘넷째 해’를 쓰는 것이 간결하고 문맥에 맞습니다.
- source_word: לִיהוֹיָקִים בֶּן יֹאשִׁיָּהוּ מֶלֶךְ יְהוּדָה
  english_pob_choice: of Jehoiakim son of Josiah, king of Judah
  chosen_korean: 요시야의 아들 유다 왕 여호야김의
  alternatives_korean:
  - 유다 왕 요시야의 아들 여호야김의
  - 여호야김, 요시야의 아들, 유다 왕의
  lexicon: HALOT
  rationale: 히브리어의 소유·계보 관계를 한국어 소유격으로 자연스럽게 옮기고, ‘유다 왕’은 수식어로 붙여 인물 식별을 분명히 했습니다.
- source_word: הָיָה הַדָּבָר הַזֶּה אֶל יִרְמְיָהוּ
  english_pob_choice: this word came to Jeremiah
  chosen_korean: 이 말씀이 예레미야에게 임하셨습니다
  alternatives_korean:
  - 이 말씀이 예레미야에게 왔습니다
  - 이 말이 예레미야에게 임했습니다
  lexicon: HALOT
  rationale: 예언 공식의 דבר를 ‘말씀’으로 옮겨 계시의 중량감을 살렸고, ‘임하셨습니다’는 한국어 성서 문체에서 목적어가 인격적 계시를 받는 뉘앙스를 자연스럽게 전달합니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼로부터
  alternatives_korean:
  - 여호와로부터
  - 주로부터
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 יְהוָה는 ‘야훼’로 옮기며, 출처를 나타내는 מֵאֵת는 ‘-로부터’로 분명히 했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말하자면,
  alternatives_korean:
  - 이르시되,
  - 말하여 이르시되,
  lexicon: HALOT
  rationale: 다음 절로 이어지는 직접 화법 도입부를 한국어에서 과도하게 경직되지 않게 표시했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
