  source_fidelity: 핵심 시간·계보·왕호·계시 공식·발화 도입은 옮겼으나, 무생물 주어인 ‘말씀’에 높임 선어말어미를 쓴 ‘임하셨습니다’는 문법적으로 맞지 않습니다. ‘말하자면’은 לֵאמֹר의 직접화법 도입 기능을 나타내지 못하고 ‘즉’이라는 설명·정정의 뜻이므로 교정이 필요합니다.
  naturalness: ‘유다 왕 요시야의 아들 여호야김’이 한국어에서 왕호와 계보를 가장 명료하게 연결합니다. ‘말씀하시기를’은 다음 절의 야훼의 직접 발화를 자연스럽고 격식 있게 도입합니다.
  terminology: יְהוָה는 프로젝트 방침과 원문의 고유명에 따라 ‘야훼’로 유지했습니다. דָּבָר는 예언 계시 공식에서 ‘말씀’으로 옮길 수 있으나, 그 주어에는 높임법을 적용하지 않았습니다.
