    rationale: ‘말하자면’은 앞말을 풀이하거나 고쳐 말할 때 쓰는 표현입니다. 여기서 לֵאמֹר는 다음 절의 직접 인용을 도입하므로 ‘말씀하시기를,’이 적절합니다.
  - severity: medium
    issue: 각주 내용과 표지 위치
    rationale: 각주는 야훼라는 이름의 번역을 설명하지만 표지는 문장 끝의 ‘말하자면’에 붙어 있어 연결 대상이 불명확합니다. 또한 본문 자체가 이미 ‘야훼’를 사용하므로 이 절에서 별도 각주는 필수적이지 않습니다.
