  rationale: 이 프로젝트 기본 규칙에 따라 יְהוָה는 고유한 언약 이름으로서 ‘야훼’로 유지해, 일반 호칭인 ‘주’와 구별했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
