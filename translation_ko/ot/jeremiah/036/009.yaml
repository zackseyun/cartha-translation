base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/009.yaml
  text: And it happened in the fifth year of Jehoiakim son of Josiah[a], king of Judah, in the ninth month, that they proclaimed a fast before Yahweh for all the people in Jerusalem and all the people coming from the cities of Judah into Jerusalem.
  footnotes:
  - marker: a
    text: 'Hebrew: ''before Yahweh.'' The main text follows the project''s default rendering of the divine name as ''the LORD.'''
    reason: alternative_reading
translation:
  language: ko
  text: 유다 왕 요시야의 아들 여호야김의 다섯째 해, 곧 아홉째 달에, 그들이 예루살렘에 있는 온 백성과 유다의 여러 성읍에서 예루살렘으로 오는 온 백성을 위하여 야훼 앞에서 금식을 선포하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그 일이 있었습니다
  alternatives_korean:
  - 그리고 일어난 일은
  - 그때
  lexicon: HALOT
  rationale: 서사 전환을 알리는 wayyiqtol의 기능을 살리면서도, 현대 한국어에서 자연스럽고 구어체로 흐르지 않게 옮겼습니다.
- source_word: קָרְאוּ צוֹם
  english_pob_choice: they proclaimed a fast
  chosen_korean: 금식을 선포하였는데
  alternatives_korean:
  - 금식을 알렸는데
  - 금식을 공포하였는데
  lexicon: HALOT
  rationale: צוֹם은 금식 ‘행위’보다 공적으로 정해진 ‘금식 제도’를 가리키므로, 단순히 ‘하였다’보다 ‘선포하다’가 더 정확합니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 주 앞에서
  lexicon: HALOT
  rationale: 예배적 방향성을 나타내는 לִפְנֵי를 직역에 가깝게 살리면서, 본 프로젝트의 기본 원칙에 따라 신명은 야훼로 옮겼습니다.
- source_word: וְכָל הָעָם הַבָּאִים מֵעָרֵי יְהוּדָה בִּירוּשָׁלָם
  english_pob_choice: and all the people coming from the cities of Judah into Jerusalem
  chosen_korean: 유다의 여러 성읍에서 예루살렘으로 올라오는 모든 백성
  alternatives_korean:
  - 유다의 성읍들에서 예루살렘으로 오는 모든 백성
  - 유다 여러 도시에서 예루살렘으로 올라온 모든 백성
  lexicon: HALOT
  rationale: הַבָּאִים의 현재분사성을 ‘올라오는’으로 살려 이동 중인 집단임을 드러냈고, 예루살렘 순례 문맥에 맞게 ‘올라오다’를 택했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 주님
  rationale: 본문이 직접 신명기적인 이름을 사용하므로, 언약적 고유성을 보존하기 위해 일반 호칭이 아니라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
