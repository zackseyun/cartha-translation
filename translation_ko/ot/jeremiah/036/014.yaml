review_pass:
  verdict: revise
  source_fidelity: 초안은 인명·행위자·목적어를 중대하게 뒤바꾸었습니다. 히브리어는 관리들이 ‘느다냐의 아들 … 구시의 아들인 여후디’를 바룩에게 보내는 내용인데, 초안은 바룩을 유디에게 보내며 여후디의 계보에 ‘여호야긴’을 삽입합니다. 수정문은 여후디의 계보, 파견 대상, 바룩의 계보와 두루마리 소지를 모두 본문에 맞게 회복합니다. וָלֵךְ의 문자적 ‘가라’는 소환 상황에서 자연스러운 한국어 ‘오너라’로 옮기되 각주로 보존했습니다.
  naturalness: ‘모든 관리들은’보다 집합적 주어에 맞는 ‘모든 관리가’가 자연스럽고, 반복되는 계보는 ‘…이며 …이고 …인’으로 연결해 현대 표준어 문장 흐름을 유지했습니다. ‘백성이 듣는 가운데’는 공적 낭독을 뜻하는 בְּאָזְנֵי הָעָם을 자연스럽게 전달합니다. 전체 문장은 현대적 합쇼체로 통일했습니다.
  terminology: הַשָּׂרִים은 궁정·행정 문맥에 맞게 ‘관리들’로, מְגִלָּה는 ‘두루마리’로 유지했습니다. 인명은 여후디, 느다냐, 셀레먀, 구시, 바룩, 네리야로 음역했습니다. ‘여호야긴’은 원문에 전혀 없으므로 제거해야 합니다.
  issues:
  - severity: high
    issue: 파견의 주체·전달자·목적지가 뒤바뀜
    rationale: 원문은 모든 관리가 여후디를 바룩에게 보낸다고 말합니다(וישלחו ... את יהודי ... אל ברוך). 초안은 ‘유디에게 바꾸를 보내어’라고 하여 바룩과 여후디의 역할 및 목적지를 반대로 만들었습니다.
  - severity: high
    issue: 여후디의 계보에 원문에 없는 ‘여호야긴’을 삽입함
    rationale: 원문은 ‘느다냐의 아들, 셀레먀의 아들, 구시의 아들인 여후디’입니다. ‘여호야긴의 아들’은 원문에 없고, 느다냐와의 관계도 잘못되었습니다.
  - severity: medium
    issue: 명령의 방향성에 대한 각주 부재
    rationale: וָלֵךְ는 문자적으로 ‘가라’이지만 소환하는 화자의 관점에서는 한국어 ‘오너라’가 자연스럽습니다. 이 조정은 본문상 가능하나, 원문의 어휘를 보존하는 각주가 필요합니다.
  revised_text: 그때 모든 관리가 느다냐의 아들이며 셀레먀의 아들이고 구시의 아들인 여후디를 바룩에게 보내어 말했습니다. “네가 백성이 듣는 가운데 읽은 그 두루마리를 손에 들고 오너라.”a 네리야의 아들 바룩은 그 두루마리를 손에 들고 그들에게 왔습니다.
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘손에 들고 가라’입니다. 히브리어는 ‘가라’를 사용하지만, 관리들이 자신들이 있는 곳으로 바룩을 부르는 상황이므로 본문에서는 자연스럽게 ‘오너라’로 옮겼습니다.
    reason: lexical_alternative
  revision_rationale: 원문의 통사 구조에 따라 관리들을 파견 주체로, 여후디를 파견된 사람으로, 바룩을 목적지로 바로잡았습니다. 여후디의 세 단계 부계 계보를 정확히 복원하고 원문에 없는 여호야긴을 삭제했습니다. 두루마리, 공적 낭독, 바룩의 두루마리 소지와 도착을 보존했으며, ‘가라/오너라’의 화용론적 조정은 각주로 투명하게 밝혔습니다.
