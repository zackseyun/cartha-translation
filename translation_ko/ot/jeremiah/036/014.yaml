id: JER.36.14
reference: Jeremiah 36:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֨וּ כָל הַ/שָּׂרִ֜ים אֶל בָּר֗וּךְ אֶת יְהוּדִ֡י בֶּן נְ֠תַנְיָהוּ בֶּן שֶׁלֶמְיָ֣הוּ בֶן כּוּשִׁי֮ לֵ/אמֹר֒ הַ/מְּגִלָּ֗ה אֲשֶׁ֨ר קָרָ֤אתָ בָּ/הּ֙ בְּ/אָזְנֵ֣י הָ/עָ֔ם קָחֶ֥/נָּה בְ/יָדְ/ךָ֖ וָ/לֵ֑ךְ וַ֠/יִּקַּח בָּר֨וּךְ בֶּן נֵרִיָּ֤הוּ אֶת הַ/מְּגִלָּה֙ בְּ/יָד֔/וֹ וַ/יָּבֹ֖א אֲלֵי/הֶֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/014.yaml
  text: Then all the officials sent Jehudi son of Nethaniah[a], son of Shelemiah, son of Cushi, to Baruch, saying, “Take in your hand the scroll from which you read in the hearing of the people, and come.” So Baruch son of Neriah took the scroll in his hand and came to them.
  footnotes:
  - marker: a
    text: Or, more literally, 'and go.' The Hebrew uses 'go,' but English commonly says 'come' when someone is summoned to the speaker's location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모든 관리들은 여호야긴의 아들 느다냐의 아들, 셀레먀의 아들, 구시의 아들 유디에게 바꾸를 보내어 말했습니다. 「네가 백성의 귀에 읽어 준 그 두루마리를 네 손에 가지고 오너라.」 바룩은 네리야의 아들로서 그 두루마리를 손에 들고 그들에게 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 관리들
  - 지도자들
  - 방백들
  lexicon: HALOT
  rationale: 왕궁·행정 문맥의 שַׂר를 한국어에서 자연스럽고 현대적으로 살리기 위해 ‘관리들’을 택했습니다.
- source_word: יְהוּדִי
  english_pob_choice: Jehudi
  chosen_korean: 유디
  alternatives_korean:
  - 예후디
  - 유대인
  lexicon: HALOT
  rationale: 여기서는 계보가 붙은 인명이라 민족명으로 옮기지 않고 음역했습니다.
- source_word: הַמְּגִלָּה
  english_pob_choice: the scroll
  chosen_korean: 두루마리
  alternatives_korean:
  - 두루마리
  - 문서
  - 책
  lexicon: HALOT
  rationale: מְגִלָּה는 말아 놓은 기록물을 가리키므로, 한국어에서는 ‘두루마리’가 가장 직접적입니다.
- source_word: בְּאָזְנֵי הָעָם
  english_pob_choice: in the hearing of the people
  chosen_korean: 백성의 귀에
  alternatives_korean:
  - 백성의 들음 속에서
  - 백성이 듣는 가운데
  - 백성의 귀에
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 공적 낭독의 ‘들리는’ 측면을 살렸습니다.
theological_decisions:
- issue: וָלֵךְ / וַיָּבֹא אֲלֵיהֶם의 방향성
  chosen_reading: 명령은 ‘오너라’, 서술은 ‘그들에게 왔습니다’로 옮겼습니다.
  alternative_readings:
  - ‘가라’와 ‘그들에게 갔다’로 일관
  - 모두 ‘가다’로 직역
  rationale: 히브리어는 문자적으로 ‘가라’이지만, 화자 위치를 기준으로 한 초청·소환의 방향성이므로 한국어에서는 ‘오너라’가 의미를 더 정확히 전달합니다.
  doctrine_reference: 번역학적 화용론
- issue: בָּרוּךְ בֶּן נֵרִיָּהוּ
  chosen_reading: ‘바룩은 네리야의 아들로서’로 보조절을 넣어 계보를 분명히 했습니다.
  alternative_readings:
  - ‘바룩, 네리야의 아들’
  - ‘바룩 네리야의 아들’
  rationale: 히브리어 계보 구조를 유지하되 한국어 문장 흐름을 해치지 않도록 서술적으로 풀었습니다.
  doctrine_reference: 문맥 충실 번역
