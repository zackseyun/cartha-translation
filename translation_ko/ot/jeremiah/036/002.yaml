reference: Jeremiah 36:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קַח לְ/ךָ֮ מְגִלַּת סֵפֶר֒ וְ/כָתַבְתָּ֣ אֵלֶ֗י/הָ אֵ֣ת כָּל הַ/דְּבָרִ֞ים אֲשֶׁר דִּבַּ֧רְתִּי אֵלֶ֛י/ךָ עַל יִשְׂרָאֵ֥ל וְ/עַל יְהוּדָ֖ה וְ/עַל כָּל הַ/גּוֹיִ֑ם מִ/יּ֞וֹם דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ מִ/ימֵ֣י יֹאשִׁיָּ֔הוּ וְ/עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/002.yaml
  text: Take for yourself a scroll[a], and write on it all the words that I have spoken to you concerning Israel and concerning Judah and concerning all the nations, from the day I spoke to you, from the days of Josiah until this day.
  footnotes:
  - marker: a
    text: Or, 'against Israel and against Judah and against all the nations.' The Hebrew preposition can carry either sense in prophetic contexts.
    reason: alternative_reading
translation:
  language: ko
  text: 너를 위하여 두루마리 책을 가져다가, 내가 너에게 이스라엘과 유다와 모든 나라들에 대해 말한 모든 말을 그 위에 기록하라. 곧 내가 너에게 말하기 시작한 날부터, 요시야의 날들로부터 오늘날까지입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עַל은 예언 문맥에서 ‘~에 대해/관하여’뿐 아니라 ‘~을 향하여/against’의 뜻도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קַח לְךָ
  english_pob_choice: Take for yourself
  chosen_korean: 너를 위하여 … 가져다가
  alternatives_korean:
  - 가져가라
  - 스스로 가져라
  lexicon: HALOT
  rationale: לְךָ가 주는 ‘자기 관련성/자기 몫’의 뉘앙스를 살려, 단순 명령보다 ‘너를 위하여’로 옮겼습니다. 한국어에서는 ‘가져다가’가 이어지는 기록 명령과도 자연스럽습니다.
- source_word: מְגִלַּת סֵפֶר
  english_pob_choice: a scroll
  chosen_korean: 두루마리 책
  alternatives_korean:
  - 두루마리
  - 책 두루마리
  lexicon: HALOT
  rationale: 히브리어는 기록된 말씀이 말려 있는 문서 형식을 가리키므로, ‘책’보다 ‘두루마리’가 핵심입니다. 다만 한국어 성경 독자에게는 ‘두루마리 책’이 형식을 분명히 드러내면서도 지나치게 낯설지 않습니다.
- source_word: עַל יִשְׂרָאֵל וְעַל יְהוּדָה וְעַל כָּל הַגּוֹיִם
  english_pob_choice: concerning Israel and concerning Judah and concerning all the nations
  chosen_korean: 이스라엘과 유다와 모든 나라들에 대해
  alternatives_korean:
  - 이스라엘과 유다와 모든 나라들에 관하여
  - 이스라엘과 유다와 모든 민족들에 대해
  - 이스라엘과 유다와 모든 나라들을 향하여
  lexicon: HALOT
  rationale: עַל은 이 문맥에서 ‘~에 대해/관하여’가 가장 덜 해석을 끼워 넣는 표현입니다. ‘against’의 심판 뉘앙스도 가능하지만, 본절은 예레미야가 받은 말씀의 총량을 가리키므로 더 넓은 ‘~에 대해’를 택했습니다.
- source_word: כָּל הַדְּבָרִים
  english_pob_choice: all the words
  chosen_korean: 모든 말
  alternatives_korean:
  - 모든 말씀
  - 모든 일들
  - 모든 내용
  lexicon: HALOT
  rationale: 여기서 דְּבָרִים는 예언적 계시의 ‘말들’이라는 점이 중요하므로, 내용만 순화한 ‘내용’보다 직접적인 ‘말’이 맞습니다. 한국어에서는 복수성을 자연스럽게 드러내기 위해 ‘모든 말’로 옮겼습니다.
- source_word: מִיּוֹם ... מִימֵי ... וְעַד הַיּוֹם הַזֶּה
  english_pob_choice: from the day ... from the days ... until this day
  chosen_korean: 곧 내가 너에게 말하기 시작한 날부터, 요시야의 날들로부터 오늘날까지입니다
  alternatives_korean:
  - 내가 너에게 말한 날부터, 요시야의 날들부터 오늘날까지입니다
  - 요시야의 날들로부터 오늘날까지, 내가 너에게 말한 날부터입니다
  lexicon: HALOT
  rationale: 두 개의 시작점과 하나의 종결점을 한국어 시간 표현으로 살리기 위해 ‘부터 …까지’ 구조를 반복했습니다. ‘오늘날까지’는 הַיּוֹם הַזֶּה의 끝점을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 'עַל의 방향성: 심판의 ‘against’인가, 범위의 ‘concerning/about’인가'
  chosen_reading: ‘~에 대해’로 넓게 처리하되, 문맥상 심판 예언도 포함 가능한 여지를 남겼습니다.
  alternative_readings:
  - ~을/를 향하여
  - ~에 대하여(심판적 뉘앙스를 강하게 반영)
  rationale: 이 절은 예레미야가 지금까지 받은 모든 말씀을 요약하는 서술이므로, 특정 심판 방향으로 좁히면 범위가 과도하게 축소됩니다. 따라서 독자가 뒤따르는 예언 내용 속에서 심판적 용례를 확인할 수 있도록 넓은 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §3
