  source_fidelity: 히브리어의 심판 동사 פקד, 죄악(עון), 재앙(רעה), 그리고 유다의 ‘각 사람’이라는 분배적 단수 표현을 대체로 충실히 반영했습니다. 다만 현행 문장의 쉼표 배치는 심판 대상들의 병렬 관계를 불명확하게 만들고, ‘내리겠으나’는 하나님이 재앙을 내리는 일과 백성이 듣지 않은 일을 직접 대조하는 듯하여 원문의 연결을 부정확하게 처리합니다.
  naturalness: ‘내가 그들, 예루살렘 주민들과 유다의 각 사람에게’는 현대 한국어에서 부자연스럽고 수식 관계가 흔들립니다. 병렬 대상을 조사로 분명히 연결하고, 마지막 절은 독립된 역접 문장으로 처리하는 것이 자연스럽습니다.
  terminology: ‘벌하다’, ‘자손’, ‘신하들’, ‘죄악’, ‘재앙’은 문맥과 현대적 성서 문체에 적절합니다. 왕궁 문맥의 עבדיו는 ‘종들’보다 ‘신하들’이 소속된 관리·수행원을 더 자연스럽게 나타냅니다.
