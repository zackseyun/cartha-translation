source:
  edition: WLC
  text: וּ/פָקַדְתִּ֨י עָלָ֧י/ו וְ/עַל זַרְע֛/וֹ וְ/עַל עֲבָדָ֖י/ו אֶת עֲוֺנָ֑/ם וְ/הֵבֵאתִ֣י עֲ֠לֵי/הֶם וְ/עַל יֹשְׁבֵ֨י יְרוּשָׁלִַ֜ם וְ/אֶל אִ֣ישׁ יְהוּדָ֗ה אֵ֧ת כָּל הָ/רָעָ֛ה אֲשֶׁר דִּבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/לֹ֥א שָׁמֵֽעוּ־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/031.yaml
  text: And I will punish him and his offspring and his servants for their iniquity[a], and I will bring on them, on the inhabitants of Jerusalem, and on the men of Judah all the disaster that I spoke against them, but they did not listen.
  footnotes:
  - marker: a
    text: Hebrew 'each man of Judah.' The phrase is distributive singular and masculine in form; some translations generalize it as 'everyone in Judah' or 'the people of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그를, 그의 자손과 그의 종들을 그들의 죄악 때문에 벌할 것이며, 내가 그들, 예루살렘 주민들과 유다의 각 사람에게, 내가 그들에 대하여 말한 온갖 재앙을 내리겠으나, 그들은 듣지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘유다의 각 사람’이라는 분배적 남성 단수 표현을 사용합니다. 일부 번역은 이를 ‘유다의 모든 사람들’처럼 공동체 전체로 일반화합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  english_pob_choice: I will punish
  chosen_korean: 벌할 것이며
  alternatives_korean:
  - 찾아갈 것이며
  - 방문할 것이며
  - 책임을 물을 것이며
  lexicon: HALOT
  rationale: פּקד는 이 문맥에서 심판의 의미이므로, 한국어에서는 ‘벌하다’가 가장 직접적으로 그 판결적 뉘앙스를 드러냅니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 노예들
  - 그의 하인들
  lexicon: HALOT
  rationale: 이 구절에서는 왕의 소속 인원을 가리키는 일반적 ‘종’이 가장 자연스럽고, 본문이 노예 신분을 특별히 부각하지 않으므로 ‘노예들’은 피했습니다.
- source_word: אֶת עֲוֺנָם
  english_pob_choice: for their iniquity
  chosen_korean: 그들의 죄악 때문에
  alternatives_korean:
  - 그들의 죄악으로
  - 그들의 불의 때문에
  - 그들의 죄책 때문에
  lexicon: HALOT
  rationale: עָוֹן은 단순한 실수보다 도덕적 책임을 지닌 죄악/죄책을 가리키므로, ‘때문에’로 처벌의 근거를 드러내되 의미를 약화시키지 않았습니다.
- source_word: כָּל הָרָעָה
  english_pob_choice: all the disaster
  chosen_korean: 온갖 재앙
  alternatives_korean:
  - 모든 재난
  - 모든 재앙
  - 온갖 화
  lexicon: HALOT
  rationale: 예언서의 심판 맥락에서 רָעָה는 도덕적 ‘악’보다 임박한 ‘재앙/재난’의 뜻이 강하므로, 현대 한국어에서 그 뜻을 살리는 ‘재앙’을 택했습니다.
theological_decisions:
- issue: אֶל אִישׁ יְהוּדָה의 distributive singular 처리
  chosen_reading: 유다의 각 사람
  alternative_readings:
  - 유다의 남자들
  - 유다의 모든 사람들
  rationale: 히브리어의 남성 단수 분배 표현을 유지하되, 한국어에서는 공동체 전체를 향한 심판 선언으로 자연스럽게 읽히도록 ‘각 사람’으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
