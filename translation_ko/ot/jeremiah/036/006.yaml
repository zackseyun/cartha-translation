    issue: 접속사 ‘그러므로’
    rationale: וּבָאתָ의 וְ는 이 명령 연속에서 인과를 명시하지 않습니다. ‘그러므로’는 원문에 없는 논리 관계를 더합니다.
  - severity: medium
    issue: ‘그 두루마리 곧 여호와의 말씀’의 관계
    rationale: 히브리어는 ‘내 입에서 네가 기록한 여호와의 말씀’을 읽을 두루마리의 내용으로 제시합니다. 초안의 동격 표현은 두루마리 자체가 곧 말씀이라는 관계로 읽힐 여지가 있습니다.
  - severity: low
    issue: 청중 표현과 수식 범위
    rationale: ‘자기 성읍들에서 오는 모든 유다 사람’보다 ‘각 성읍에서 오는 모든 유다 사람’이 הַבָּאִים מֵעָרֵיהֶם의 집합적 의미를 현대 한국어에서 더 분명히 드러냅니다.
