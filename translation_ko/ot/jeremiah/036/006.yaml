  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָאתָ֣ אַתָּ֡ה וְ/קָרָ֣אתָ בַ/מְּגִלָּ֣ה אֲשֶׁר כָּתַֽבְתָּ מִ/פִּ/י֩ אֶת דִּבְרֵ֨י יְהוָ֜ה בְּ/אָזְנֵ֥י הָ/עָ֛ם בֵּ֥ית יְהוָ֖ה בְּ/י֣וֹם צ֑וֹם וְ/גַ֨ם בְּ/אָזְנֵ֧י כָל יְהוּדָ֛ה הַ/בָּאִ֥ים מֵ/עָרֵי/הֶ֖ם תִּקְרָאֵֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/036/006.yaml
  text: So you yourself must go and read from the scroll that you wrote from my mouth—the words of Yahweh—in the hearing of the people in the house of Yahweh on a day of fasting[b][a]; and you must also read them in the hearing of all Judah who come from their cities.
  footnotes:
  - marker: a
    text: Or 'that you wrote at my dictation'; literally, 'that you wrote from my mouth.'
    reason: lexical_alternative
  - marker: b
    text: '''The house of the LORD'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 당신이 직접 가서, 내가 말해 준 대로 네가 받아 적은 여호와의 말씀이 기록된 그 두루마리를 금식하는 날에 여호와의 집에서 백성이 듣는 자리에서 낭독하십시오. 또 각 성읍에서 오는 모든 유다 사람이 듣는 자리에서도 그것을 낭독하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여호와의 집’은 곧 성전을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘내가 말해 준 대로 네가 받아 적은’은 직역하면 ‘내 입에서 네가 기록한’입니다. 이는 바룩이 예레미야가 말한 내용을 기록했음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ אַתָּה
  english_pob_choice: So you yourself must go
  chosen_korean: 그러므로 너 자신이 가서
  alternatives_korean:
  - 그리고 너는 가야 한다
  - 그러니 네가 직접 가서
  lexicon: HALOT
  rationale: 문맥상 예레미야의 명령이 계속되므로 강한 명령형으로 옮겼고, אַתָּה의 강조를 ‘너 자신이’로 살렸습니다.
- source_word: וְקָרָאתָ
  english_pob_choice: and read
  chosen_korean: 낭독하고
  alternatives_korean:
  - 읽고
  - 선포하고
  lexicon: HALOT
  rationale: 두루마리를 회중 앞에서 읽는 공개 행위이므로 단순한 묵독이 아니라 공개 낭독의 뜻을 살렸습니다.
- source_word: מִפִּי
  english_pob_choice: from my mouth
  chosen_korean: 내 입에서 받아 쓴
  alternatives_korean:
  - 내 입에서
  - 내 말대로 쓴
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 ‘내 입에서’이지만, 한국어에서는 의미가 분명하게 드러나도록 ‘받아 쓴’으로 풀어 표현하되 출처성은 유지했습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: 귀에 낭독하고
  alternatives_korean:
  - 듣는 가운데
  - 들리는 데서
  lexicon: HALOT
  rationale: ‘귀에’라는 히브리어 관용을 한국어 자연어로 옮기되, 청각적 공개성을 보존하기 위해 ‘낭독하다’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 기존 POB 영어는 Yahweh를 사용하지만, 한국어 본문에서는 가독성과 교회 독자 인지도를 고려해 통상 표기 ‘여호와’를 채택했습니다. 본문 내 일관성과 문맥의 직접성은 유지됩니다.
theological_decisions:
- issue: 공적 낭독의 대상과 장소 표현
  chosen_reading: ‘여호와의 집’과 ‘백성의 귀’/‘모든 유다 사람의 귀’의 이중 청중 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘성전’으로 풀어쓰기
  - ‘사람들 앞에서’로 단순화
  rationale: 본문은 단순한 장소 정보보다 예배 공간 안에서의 공적 선포와, 이어지는 전국적 청중을 대비시키므로 두 청중 구조를 유지하는 것이 문맥상 중요합니다.
  doctrine_reference: 'Jeremiah 36: public proclamation of Yahweh’s words'
- issue: 금식일의 표기
  chosen_reading: ‘금식하는 날에’로 옮겨, 특정 절기명으로 단정하지 않고 사건의 시점을 살렸습니다.
  alternative_readings:
  - ‘금식일에’
  - ‘금식하는 날’
  rationale: 본문 자체는 금식 행사의 일반적 시점을 말하며, 특정한 제도명으로 제한할 근거가 약합니다.
  doctrine_reference: Historical-literal context of Jeremiah 36
