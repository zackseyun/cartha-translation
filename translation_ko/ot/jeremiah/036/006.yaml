revisions:
- from: 그러므로 너 자신이 가서, 네가 내 입에서 받아 쓴 그 두루마리 곧 여호와의 말씀을—금식하는 날에—여호와의 집에서 백성의 귀에 낭독하고, 또 자기 성읍들에서 오는 모든 유다 사람의 귀에도 낭독해야 합니다.[a][b]
  to: 그리고 당신이 직접 가서, 내가 말해 준 대로 네가 받아 적은 여호와의 말씀이 기록된 그 두루마리를 금식하는 날에 여호와의 집에서 백성이 듣는 자리에서 낭독하십시오. 또 각 성읍에서 오는 모든 유다 사람이 듣는 자리에서도 그것을 낭독하십시오.[a][b]
  rationale: 원문의 명령 연속, 강조된 2인칭, 두루마리에 기록된 말씀의 관계, 성전의 백성과 각 성읍에서 오는 온 유다라는 두 청중을 보존했습니다. ‘당신이 직접 … 낭독하십시오’로 현대 표준어 합쇼체를 일관되게 적용했으며, ‘내 입에서’의 관용적 의미는 본문에서 자연스럽게 풀고 각주에서 직역을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:20Z'
review_pass:
  verdict: revise
  source_fidelity: ‘그러므로’는 히브리어의 단순 접속 וְ를 인과로 좁히므로 ‘그리고’로 고쳐야 합니다. 또한 ‘그 두루마리 곧 여호와의 말씀’은 두루마리와 말씀의 관계를 다소 불명확하게 하므로, 두루마리에 여호와의 말씀이 기록되어 있음을 분명히 해야 합니다. 두 청중과 ‘각 성읍에서 오는’ 수식 관계도 더 명료하게 옮기는 것이 좋습니다.
  naturalness: 초안의 ‘금식하는 날에’ 삽입 위치와 ‘귀에 낭독하다’의 반복은 다소 부자연스럽습니다. 현대 표준어 합쇼체로 ‘…듣는 자리에서 낭독하십시오’라고 하면 공개 낭독의 뜻과 문장 흐름을 함께 살릴 수 있습니다.
  terminology: ‘여호와’, ‘두루마리’, ‘금식하는 날’, ‘낭독’은 적절합니다. ‘내 입에서 받아 쓴’은 말한 이가 예레미야임을 문맥상 보존하면서도 자연스럽게 ‘내가 말해 준 대로 받아 적은’으로 풀 수 있습니다.
  issues:
