  naturalness: ‘그들의 목숨을 노리는 자들’, ‘그들에게 재앙을 내리겠습니다’, ‘칼을 그들의 뒤로 보내겠습니다’, ‘그들을 다 멸할 때까지’가 현대 표준어 합쇼체에서 더 자연스럽고 의미도 정확합니다. ‘다 소비할 때까지’는 사람을 목적어로 할 때 부자연스럽고 한국어에서 물질적 소비로 읽힐 수 있습니다.
  terminology: 엘람과 야훼는 적절합니다. רָעָה는 ‘재앙’, חֲרוֹן אַפִּי는 ‘타오르는 분노’로 옮길 수 있습니다. מְבַקְשֵׁי נַפְשָׁם는 관용적 함의를 본문에서 ‘목숨을 노리는 자들’로 명료하게 옮기는 것이 좋습니다. 기존 각주 표지는 모두 문장 끝에 몰려 있어 각주 연결이 불명확하므로 해당 어구 뒤에 각각 배치해야 합니다.
