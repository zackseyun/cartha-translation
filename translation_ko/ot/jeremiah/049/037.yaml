  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַחְתַּתִּ֣י אֶת עֵ֠ילָם לִ/פְנֵ֨י אֹיְבֵי/הֶ֜ם וְ/לִ/פְנֵ֣י מְבַקְשֵׁ֣י נַפְשָׁ֗/ם וְ/הֵבֵאתִ֨י עֲלֵי/הֶ֧ם רָעָ֛ה אֶת חֲר֥וֹן אַפִּ֖/י נְאֻם יְהוָ֑ה וְ/שִׁלַּחְתִּ֤י אַֽחֲרֵי/הֶם֙ אֶת הַ/חֶ֔רֶב עַ֥ד כַּלּוֹתִ֖/י אוֹתָֽ/ם־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/037.yaml
  text: I will shatter Elam before their enemies and before those who seek their life[a]. I will bring disaster on them, my burning anger, declares Yahweh[c][b], and I will send the sword after them until I have consumed them.
  footnotes:
  - marker: a
    text: Or “I will terrify Elam” or “I will dismay Elam”; the Hebrew verb can emphasize causing panic or causing collapse.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “those who seek their life,” an idiom for those seeking to kill them.
    reason: lexical_alternative
  - marker: c
    text: Or “calamity”; Hebrew רָעָה here refers to disaster/judgment, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 엘람을 그들의 원수들 앞과 그들의 생명을 찾는 자들 앞에서 무너뜨리겠습니다. 내가 그들 위에 재앙, 곧 나의 타오르는 분노를 가져오겠습니다.” 야훼의 말씀입니다. “그리고 내가 그들 뒤로 칼을 보내어 그들을 내가 다 소비할 때까지 따르게 하겠습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 여기서 ‘무너뜨리다’ 외에도 ‘두렵게 하다’, ‘당황하게 하다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘그들의 생명을 찾는 자들’이며, 곧 그들을 죽이려는 자들을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 רָעָה는 여기서 도덕적 악이 아니라 심판으로서의 재앙을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחְתַּתִּי
  english_pob_choice: I will shatter
  chosen_korean: 무너뜨리겠습니다
  alternatives_korean:
  - 두렵게 하겠습니다
  - 겁나게 하겠습니다
  - 부수겠습니다
  lexicon: HALOT
  rationale: 히필 חתת는 단순한 감정 유발을 넘어 붕괴·동요·패배를 뜻할 수 있으므로, 군사적 심판 문맥에서 ‘무너뜨리겠습니다’가 심리적 공포와 국가적 붕괴를 함께 살립니다.
- source_word: לִפְנֵי אֹיְבֵיהֶם / לִפְנֵי מְבַקְשֵׁי נַפְשָׁם
  english_pob_choice: before their enemies / before those who seek their life
  chosen_korean: 그들의 원수들 앞과 그들의 생명을 찾는 자들 앞
  alternatives_korean:
  - 그들의 적들 앞과 그들의 목숨을 찾는 자들 앞
  - 그들의 원수들 면전에서와 그들의 목숨을 노리는 자들 앞
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞/면전에서’라는 노출의 뜻을 가지며, מְבַקְשֵׁי נַפְשָׁם는 직역하면 ‘그들의 생명을 찾는 자들’이어서, 원문 이미지를 보존하되 한국어로 자연스럽게 다듬었습니다.
- source_word: וְהֵבֵאתִי עֲלֵיהֶם רָעָה
  english_pob_choice: I will bring disaster on them
  chosen_korean: 그들 위에 재앙을 가져오겠습니다
  alternatives_korean:
  - 그들 위에 재난을 가져오겠습니다
  - 그들 위에 악을 가져오겠습니다
  - 그들 위에 환난을 가져오겠습니다
  lexicon: HALOT
  rationale: 예언서의 심판 문맥에서 רָעָה는 도덕적 ‘악’이 아니라 임박한 심판 재앙을 뜻하므로, ‘재앙’으로 옮겨 신학적 오해를 피했습니다.
- source_word: אֶת חֲרוֹן אַפִּי
  english_pob_choice: my burning anger
  chosen_korean: 나의 타오르는 분노
  alternatives_korean:
  - 나의 불타는 분노
  - 나의 격렬한 분노
  - 나의 맹렬한 분노
  lexicon: HALOT
  rationale: חֲרוֹן אַף의 불의 이미지를 살리기 위해, 익숙한 ‘진노’보다 ‘타오르는 분노’를 택해 열기의 비유를 보존했습니다.
- source_word: וְשִׁלַּחְתִּי אַחֲרֵיהֶם אֶת הַחֶרֶב
  english_pob_choice: I will send the sword after them
  chosen_korean: 칼을 보내어 그들을 뒤따르게 하겠습니다
  alternatives_korean:
  - 칼을 그들 뒤로 보내겠습니다
  - 칼을 보내어 그들을 추격하게 하겠습니다
  - 칼을 그들 뒤에 보내겠습니다
  lexicon: HALOT
  rationale: אַחֲרֵי의 방향성을 살려 칼이 ‘뒤따르게’ 한다는 의인화 이미지를 유지했습니다. ‘칼을 보내다’는 예언적 전쟁 심판의 관용 표현도 반영합니다.
- source_word: עַד כַּלּוֹתִי אוֹתָם
  english_pob_choice: until I have consumed them
  chosen_korean: 내가 다 소비할 때까지
  alternatives_korean:
  - 내가 그들을 다 멸할 때까지
  - 내가 그들을 다 끝장낼 때까지
  - 내가 그들을 다 소멸할 때까지
  lexicon: HALOT
  rationale: כּלה는 심판 맥락에서 ‘완전히 끝내다/소비하다’의 총체성을 띠므로, 원문의 종결성을 살리기 위해 ‘다 소비할 때까지’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 문맥은 예언적 신탁의 종결 공식이 아니라 신적 발화 표지이므로, 본문에 나타난 고유한 언약명을 그대로 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 예언적 인용부 내 화행과 어조
  chosen_reading: 신적 선언을 따옴표 안에서 직접 화법으로 유지하고, 종결 표지는 ‘야훼의 말씀입니다’로 분리함
  alternative_readings:
  - ‘야훼께서 말씀하십니다’로 통합
  - 종결 표지를 생략
  rationale: נְאֻם יְהוָה는 예언서의 공식 선언문이므로, 한국어에서도 신적 직접 화법의 긴장감을 유지하면서 서술자 표지를 별도로 두었습니다.
  doctrine_reference: Translation philosophy §1, §6
