- from: “내가 엘람을 그들의 원수들 앞과 그들의 생명을 찾는 자들 앞에서 무너뜨리겠습니다. 내가 그들 위에 재앙, 곧 나의 타오르는 분노를 가져오겠습니다.” 야훼의 말씀입니다. “그리고 내가 그들 뒤로 칼을 보내어 그들을 내가 다 소비할 때까지 따르게 하겠습니다.”[a][b][c]
  to: “내가 엘람을 그들의 원수들 앞에서, 그들의 목숨을 노리는 자들 앞에서 무너뜨리겠습니다.[a] 내가 그들에게 재앙을 내리겠습니다.[c] 곧 나의 타오르는 분노를 내리겠습니다. 야훼의 말씀입니다. 내가 칼을 그들의 뒤로 보내어 그들을 다 멸할 때까지 하겠습니다.”[b]
  rationale: '직접 발화의 연속성과 ‘야훼의 말씀입니다’의 원문상 위치를 보존하도록 문장과 인용부를 하나로 정리했습니다. 다만 각주 b는 본문에서 ‘목숨을 노리는 자들’ 뒤에 붙어야 하나, 위 개정문에는 표기가 문장 끝에 잘못 배치되어 있습니다. 이를 바로잡아 안전한 완성 본문은 다음과 같습니다: “내가 엘람을 그들의 원수들 앞에서, 그들의 목숨을 노리는 자들[b] 앞에서 무너뜨리겠습니다.[a] 내가 그들에게 재앙을 내리겠습니다.[c] 곧 나의 타오르는 분노를 내리겠습니다. 야훼의 말씀입니다. 내가 칼을 그들의 뒤로 보내어 그들을 다 멸할 때까지 하겠습니다.” 이 문구를 revised_text로 적용해야 합니다.'
