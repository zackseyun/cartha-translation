    rationale: 히브리어에서 ‘야훼의 말씀이다’는 ‘나의 타오르는 분노’ 뒤에 놓이고, 그 뒤의 ‘내가 칼을 보내겠다’도 동일한 야훼의 발화가 계속됩니다. 초안은 인용을 그 공식 앞에서 닫고 새 인용을 시작하여 구조를 인위적으로 분절합니다.
  - severity: medium
