revisions:
- from: 암몬 자손에게 말씀하신 것입니다. 야훼께서 말씀하십니다. "이스라엘에는 아들들이 없습니까? 그에게 상속자가 없습니까? 그런데 왜 밀곰이 갓을 차지했고, 그의 백성이 그 성읍들에 거주하고 있습니까?"[a]
  to: 암몬 자손에 관하여. 야훼께서 이렇게 말씀하십니다. “이스라엘에는 아들들이 없습니까? 그에게 상속자가 없습니까? 그런데 왜 밀곰이 갓을 차지하고, 그의 백성이 그 성읍들에 자리 잡았습니까?”[a]
  rationale: 예언 표제의 용법을 ‘…에 관하여’로 바로잡고, 정착을 나타내는 완료형을 자연스러운 한국어 완료상으로 옮겼습니다. מַלְכָּם의 본문 독법 ‘밀곰’과 ‘그들의 왕’이라는 대안 독법은 모두 유지했습니다.
