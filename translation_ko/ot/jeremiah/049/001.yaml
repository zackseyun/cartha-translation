id: JER.49.1
reference: Jeremiah 49:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לִ/בְנֵ֣י עַמּ֗וֹן כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/בָנִ֥ים אֵין֙ לְ/יִשְׂרָאֵ֔ל אִם יוֹרֵ֖שׁ אֵ֣ין ל֑/וֹ מַדּ֗וּעַ יָרַ֤שׁ מַלְכָּ/ם֙ אֶת גָּ֔ד וְ/עַמּ֖/וֹ בְּ/עָרָ֥י/ו יָשָֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/001.yaml
  text: 'Concerning the sons of Ammon[a], thus says Yahweh: Does Israel have no sons? Does he have no heir? Why then has Milcom taken possession of Gad, and his people settled in its cities?'
  footnotes:
  - marker: a
    text: 'Hebrew Malcam/Milcom can also be read ''their king'': ''Why then has their king taken possession of Gad...?'''
    reason: alternative_reading
translation:
  language: ko
  text: 암몬 자손에게 말씀하신 것입니다. 야훼께서 말씀하십니다. "이스라엘에는 아들들이 없습니까? 그에게 상속자가 없습니까? 그런데 왜 밀곰이 갓을 차지했고, 그의 백성이 그 성읍들에 거주하고 있습니까?"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 מַלְכָּם은 ''밀곰''으로도 읽을 수 있고, ''그들의 왕''으로도 읽을 수 있습니다: ''왜 그들의 왕이 갓을 차지했고…'''
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי עַמּוֹן
  english_pob_choice: Concerning the sons of Ammon
  chosen_korean: 암몬 자손에게 말씀하신 것입니다
  alternatives_korean:
  - 암몬의 아들들에게
  - 암몬 자손에 관하여
  lexicon: HALOT
  rationale: ל 접두사는 예언 표제에서 대상 표시로 읽을 수 있으므로, 자연스러운 표제형으로 옮겼습니다. '암몬 자손'은 히브리어 표현을 투명하게 보존합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 언약명 יהוה는 본 프로젝트 기본값에 따라 '야훼'로 음역해, 제목이 아니라 고유한 신적 이름임을 드러냈습니다.
- source_word: הֲבָנִים ... לְיִשְׂרָאֵל / אִם יוֹרֵשׁ אֵין לוֹ
  english_pob_choice: Does Israel have no sons? Does he have no heir?
  chosen_korean: 이스라엘에는 아들들이 없습니까? 그에게 상속자가 없습니까?
  alternatives_korean:
  - 이스라엘에는 자녀가 없습니까?
  - 이스라엘에게 후사가 없습니까?
  lexicon: HALOT
  rationale: בנים과 יוֹרֵשׁ의 상속 논리를 살리기 위해 '아들들'과 '상속자'를 선택했습니다. 문맥상 재산/땅 상속의 문제이므로 더 일반적인 '자녀'보다 구체적입니다.
- source_word: מַדּוּעַ יָרַשׁ מַלְכָּם אֶת גָּד
  english_pob_choice: Why then has Milcom taken possession of Gad
  chosen_korean: 그런데 왜 밀곰이 갓을 차지했고
  alternatives_korean:
  - 그런데 왜 그들의 왕이 갓을 차지했고
  - 그런데 왜 밀곰이 갓을 상속했고
  lexicon: HALOT
  rationale: ירש는 여기서 법적 상속보다 영토 점유·장악의 의미가 강하므로 '차지하다'로 옮겼습니다. מַלְכָּם은 문맥상 암몬의 신 이름 '밀곰'을 우선 반영하되, 대안 독법은 각주로 남깁니다.
theological_decisions:
- issue: מַלְכָּם의 해석
  chosen_reading: 주본문에는 암몬의 신 이름 '밀곰'을 두고, 대안인 '그들의 왕' 독법은 각주로 보존합니다.
  alternative_readings:
  - 그들의 왕
  rationale: 자음 표기는 신명과 '그들의 왕' 두 방향 모두 가능하지만, 문맥상 암몬의 영토 점유를 신격과 연결하는 예언적 폴레미크가 자연스럽습니다. 그러나 본문에서 모호성을 지워 버리지 않기 위해 대안 독법을 각주로 남깁니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 해결하지 말고 보존할 것
