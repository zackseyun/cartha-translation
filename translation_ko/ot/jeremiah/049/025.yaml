  text: אֵ֥יךְ לֹֽא עֻזְּבָ֖ה עִ֣יר תהלה קִרְיַ֖ת מְשׂוֹשִֽׂ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/025.yaml
  text: How is the city of praise not abandoned[b][a], the city of my joy?
  footnotes:
  - marker: a
    text: Or 'How is the city of praise not abandoned, the city of my delight?'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the city of my joy'; the first-person suffix is retained, though interpreters differ on whose voice is represented in the lament.
