translation:
  language: ko
  text: 어찌하여 칭송의 성읍이, 나의 즐거움의 성읍이 버려지지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תהלה는 문자적으로는 ‘칭송/찬양’이지만, 문맥상 ‘명성/영예’의 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘나의 즐거움’이라고 되어 있으며, 화자가 누구인지에 대해서는 주석가들 사이에 견해가 갈립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 왜
  lexicon: HALOT
  rationale: 놀람과 탄식을 여는 수사적 질문이므로, 원문의 감정을 살리면서도 현대 한국어에서 자연스러운 「어찌하여」를 선택했습니다.
- source_word: עֻזְּבָה
  english_pob_choice: been abandoned
  chosen_korean: 버려지지 않았습니까
  alternatives_korean:
  - 버림받지 않았습니까
  - 황폐해지지 않았습니까
  lexicon: HALOT
  rationale: 여성 단수 수동형의 ‘버려지다/버림받다’ 의미를 살리되, 예언적 탄식의 현재적 울림을 위해 한국어 의문형으로 옮겼습니다.
- source_word: תהלה
  english_pob_choice: of praise
  chosen_korean: 칭송의
  alternatives_korean:
  - 찬양의
  - 명성의
  - 영예의
  lexicon: HALOT
  rationale: 문맥상 ‘유명하고 칭송받는 성읍’의 성격을 나타내므로, 직역에 가깝게 「칭송의」를 택해 원문의 수식 관계를 유지했습니다.
- source_word: מְשׂוֹשִׂי
  english_pob_choice: my joy
  chosen_korean: 나의 즐거움의
  alternatives_korean:
  - 나의 기쁨의
  - 내 즐거움의
  - 나의 기쁨
  lexicon: HALOT
  rationale: 히브리어 1인칭 접미사를 드러내기 위해 소유격을 유지했고, 한국어에서는 「나의 즐거움의 성읍」으로 받아 첫인칭 결속을 보존했습니다.
theological_decisions:
- issue: 수사적 질문의 정서와 화자 불명확성
  chosen_reading: 직역적 설명보다 탄식의 어조를 살린 수사적 질문으로 처리하고, ‘나의 즐거움’의 1인칭 소유격은 그대로 남겨 화자 정체의 모호함을 보존했습니다.
  alternative_readings:
  - ‘왜…’로 옮겨 인과 질문처럼 읽는 방식
  - 화자를 암시적으로 다윗/예레미야로 특정하는 방식
  rationale: 히브리어 본문은 예레미야적 탄식의 정서와 함께 화자 귀속이 문맥적으로 열려 있으므로, 해석을 닫지 않고 독자가 그 긴장을 느끼게 하는 것이 본문에 충실합니다.
  doctrine_reference: 성서 해석의 본문 우선성과 저자의 의도 보존
