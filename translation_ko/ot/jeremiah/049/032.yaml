  - 노략거리 / 전리품
  lexicon: HALOT
  rationale: 두 전쟁 용어를 모두 살리되, 첫 번째는 ‘노략물’, 두 번째는 ‘전리품’으로 약간의 차이를 두어 반복을 무디게 하지 않았습니다.
- source_word: הֲמוֹן מִקְנֵיהֶם
  english_pob_choice: their many livestock
  chosen_korean: 그들의 많은 가축
  alternatives_korean:
  - 그들의 가축의 많은 무리
  - 그들의 가축이 많은 것
  lexicon: HALOT
  rationale: הֲמוֹן의 ‘많은/무리’와 מִקְנֶה의 ‘가축’을 직역에 가깝게 살려, 소유물 일반이 아니라 실제 가축 무리임을 분명히 했습니다.
- source_word: קְצוּצֵי פֵאָה
  english_pob_choice: those who cut the corners of their hair
  chosen_korean: 머리의 양옆을 깎는 자들
  alternatives_korean:
  - 머리 가장자리를 자르는 자들
  - 귀밑머리를 깎는 자들
  lexicon: HALOT
  rationale: 정체된 종교 관습을 단정적으로 풀기보다, 히브리어의 신체 부위 이미지를 살려 ‘머리의 양옆’을 유지했습니다.
- source_word: מִכָּל עֲבָרָיו
  english_pob_choice: from all sides of them
  chosen_korean: 그들 각처에서
  alternatives_korean:
  - 그들 사방에서
  - 그들 모든 주변에서
  lexicon: HALOT
  rationale: 히브리어의 ‘사방/각처’ 의미를 자연스러운 한국어 부사구로 옮겼고, 이어지는 목적어 ‘그들의 재앙’을 부드럽게 받게 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: POB의 신명 표기를 따라 ‘야훼’를 유지하고, 예언 공식은 한국어 예언서 문맥에서 자연스러운 종결 표현으로 처리했습니다.
