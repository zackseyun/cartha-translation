  source_fidelity: 대체로 원문을 충실히 반영합니다. 그러나 לְכָל רוּחַ는 한국어에서 ‘모든 바람으로’보다 관용적으로 ‘사방으로’라고 옮기는 편이 자연스럽고 의미도 정확합니다. 또한 מִכָּל עֲבָרָיו ... אֶת אֵידָם은 재앙이 그들에게 모든 방향에서 닥친다는 뜻이므로, ‘그들 각처에서 그들의 재앙을’은 어색하고 관계가 불분명합니다.
  naturalness: ‘그들 각처에서 그들의 재앙을 가져오겠습니다’는 현대 표준 한국어에서 부자연스럽고, ‘각처’가 누구의 지역인지도 모호합니다. ‘그들 사방에서 그들에게 재앙을 가져오겠습니다’로 하면 원문의 방향성과 목적어 관계가 분명해집니다. 각주 표지도 해당 표현 바로 뒤에 배치하는 것이 독자 친화적입니다.
  terminology: ‘낙타’, ‘노략물’, ‘전리품’, ‘가축’, ‘야훼’는 모두 적절합니다. קְצוּצֵי פֵאָה의 번역도 특정 관습이나 신체 부위를 지나치게 단정하지 않아 적절합니다. נְאֻם יְהוָה는 ‘야훼의 말씀입니다’로 자연스럽게 처리되었습니다.
