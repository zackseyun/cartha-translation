  - 산고에 있는 여인의 마음처럼
  lexicon: HALOT
  rationale: מְצֵרָה의 산고/진통 이미지를 한국어 관용 표현인 '해산하는 여인'으로 옮겨, 공포와 고통의 비유를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 예언적 심판 이미지의 주체를 한국어 문장에서 얼마나 특정할지
  chosen_reading: 주체를 밝히지 않고 원문의 수동적·간접적 예언 이미지를 유지했습니다.
  alternative_readings:
  - 바벨론 왕을 명시하기
  - 여호와의 심판 행위로 풀어쓰기
  rationale: 본문 자체가 공격자의 정체를 직접 밝히지 않으므로, 해석을 앞서서 특정하기보다 원문의 열린 상태를 유지하는 편이 더 충실합니다.
  doctrine_reference: 예언 본문의 문학적·신학적 긴장 보존
