  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: HALOT
  rationale: 예언적 주의를 환기하는 감탄사를 현대 합쇼체로 자연스럽게 옮겨, 호소성과 긴박감을 살렸습니다.
- source_word: כַנֶּשֶׁר
