  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
  footnotes:
  - marker: a
    text: Or 'like a vulture'; the Hebrew word can refer more broadly to a large bird of prey, though 'eagle' is the conventional rendering here.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 독수리처럼 올라와 날아오르고 날개를 보스라 위에 펼칠 것이며, 그날 에돔의 용사들의 마음은 산고를 겪는 여인의 마음처럼 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶשֶׁר은 ‘독수리’로 번역되지만, 더 넓게는 독수리를 포함한 큰 맹금류를 가리킬 수도 있습니다.
    reason: lexical_alternative
