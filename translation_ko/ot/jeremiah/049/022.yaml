  text: הִנֵּ֤ה כַ/נֶּ֨שֶׁר֙ יַעֲלֶ֣ה וְ/יִדְאֶ֔ה וְ/יִפְרֹ֥שׂ כְּנָפָ֖י/ו עַל בָּצְרָ֑ה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י אֱדוֹם֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/022.yaml
  text: Behold[a], like an eagle he will rise up and swoop down and spread his wings over Bozrah, and the heart of Edom’s warriors on that day will become like the heart of a woman in labor.
  footnotes:
  - marker: a
    text: Or 'like a vulture'; the Hebrew word can refer more broadly to a large bird of prey, though 'eagle' is the conventional rendering here.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 독수리처럼 그것이 올라가고 그 날개를 보스라 위에 펼칠 것이며, 그날 에돔의 용사들의 마음은 해산하는 여인의 마음처럼 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נֶשֶׁר은 더 넓게는 큰 맹금류를 가리킬 수 있어 '독수리' 외에 '수리'나 '독수리류 맹금'으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
