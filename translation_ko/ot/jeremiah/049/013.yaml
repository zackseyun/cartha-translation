source:
  edition: WLC
  text: כִּ֣י בִ֤/י נִשְׁבַּ֨עְתִּי֙ נְאֻם יְהוָ֔ה כִּֽי לְ/שַׁמָּ֧ה לְ/חֶרְפָּ֛ה לְ/חֹ֥רֶב וְ/לִ/קְלָלָ֖ה תִּֽהְיֶ֣ה בָצְרָ֑ה וְ/כָל עָרֶ֥י/הָ תִהְיֶ֖ינָה לְ/חָרְב֥וֹת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/013.yaml
  text: For I have sworn by myself, declares the LORD, that Bozrah will become a horror, a reproach, a ruin, and a curse, and all her cities will become everlasting ruins.
translation:
  language: ko
  text: 「내가 나 자신으로 맹세합니다」라고 야훼께서 말씀하십니다. 「보스라는 공포와 치욕과 폐허와 저주가 될 것이며, 그 성읍들은 모두 영원한 황폐가 될 것입니다」.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 “나 자신으로”라는 자기 맹세입니다.
    reason: source_note
  - marker: b
    text: 히브리어 שַׁמָּה는 여기서 재난적 ‘공포/황폐’의 결과를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 영어 POB는 ‘a ruin’으로 조정했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares the LORD
  chosen_korean: “야훼께서 말씀하십니다”
  alternatives_korean:
  - “주님께서 선언하십니다”
  - “주께서 말씀하십니다”
  lexicon: יהוה
  rationale: 예언자적 선언식 표현을 현대 합쇼체로 살리되, 본문 표제어에 따라 יהוה는 ‘야훼’로 옮기고 ‘말씀하십니다’로 선언문 어조를 자연스럽게 반영했습니다.
- source_word: לְשַׁמָּה / לְחֶרְפָּה / לְחֹרֶב / לִקְלָלָה
  english_pob_choice: a horror, a reproach, a ruin, and a curse
  chosen_korean: “공포와 치욕과 폐허와 저주”
  alternatives_korean:
  - “놀람과 수치와 황폐와 저주”
  - “경악과 모욕과 폐허와 저주”
  lexicon: שׁממה / חרפה / חרב / קללה
  rationale: 네 개의 결과를 병렬로 유지하되, שׁממה는 문맥상 ‘공포’로, חרפה는 공적 수치인 ‘치욕’으로, חרב는 단순한 붕괴가 아니라 황폐해진 상태를 드러내는 ‘폐허’로 옮겼습니다.
- source_word: בָצְרָה
  english_pob_choice: Bozrah
  chosen_korean: “보스라”
  alternatives_korean:
  - “보즈라”
  - “보츠라”
  lexicon: בצרה
  rationale: 지명은 현대 외래어 표기 원칙에 따라 음역했고, 본문 고유명사로서 한국어 성경에서 과도하게 익숙한 전통형을 임의 채택하지 않았습니다.
- source_word: חָרְבוֹת עוֹלָם
  english_pob_choice: everlasting ruins
  chosen_korean: “영원한 황폐”
  alternatives_korean:
  - “영원한 폐허”
  - “영구한 황폐”
  lexicon: חרבות עולם
  rationale: ‘함몰된 상태’보다 지속성을 강조하는 עוֹלָם을 ‘영원한’으로, 폐허 상태를 뜻하는 복수형 표현을 자연스러운 단수 개념명사 ‘황폐’로 압축했습니다.
theological_decisions:
- issue: 하나님의 자기 맹세 표현
  chosen_reading: “내가 나 자신으로 맹세합니다”
  alternative_readings:
  - “내 자신으로 맹세하였습니다”
  - “나로 말미암아 맹세합니다”
  rationale: 히브리어 בִּי 는 ‘나로/나 자신으로’의 자기 맹세를 뜻하므로, 하나님의 절대적 진정성을 드러내는 직접 표현을 유지했습니다.
  doctrine_reference: divine self-oath
- issue: 예언 인용문의 화자 표지와 등록
  chosen_reading: 서술문 밖의 화자 표지는 ‘야훼께서 말씀하십니다’로 두고, 인용문 내부는 선언적 미래 진술로 처리했습니다.
  alternative_readings:
  - 인용부 안에 화자 표지를 섞는 방식
  - 더 구어적인 예언문 재구성
  rationale: 예언자 본문의 화자 전환을 보존하여, 본문이 야훼의 직접 선언으로 이해되도록 했습니다.
  doctrine_reference: prophetic discourse
