  source_fidelity: 본문은 히브리어의 명령 연쇄, 아이의 황폐, 라빠의 딸들에 대한 호칭, 왕과 제사장·관리들의 유배를 대체로 충실히 반영합니다. 다만 וְהִתְשׁוֹטַטְנָה는 불안하고 목적 없이 이리저리 다니는 모습을 뜻하므로, 다소 여유로운 느낌의 ‘거닐다’보다 ‘헤매다’가 더 적절합니다. בַּגּוֹלָה יֵלֵךְ는 본문에서 ‘포로로 끌려가다’로 옮길 수 있으나, ‘유배를 가다’보다 강제적 추방의 함의가 있는 현 번역도 문맥상 허용됩니다.
