reference: Jeremiah 49:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֵילִ֨ילִי חֶשְׁבּ֜וֹן כִּ֣י שֻׁדְּדָה עַ֗י צְעַקְנָה֮ בְּנ֣וֹת רַבָּה֒ חֲגֹ֣רְנָה שַׂקִּ֔ים סְפֹ֕דְנָה וְ/הִתְשׁוֹטַ֖טְנָה בַּ/גְּדֵר֑וֹת כִּ֤י מַלְכָּ/ם֙ בַּ/גּוֹלָ֣ה יֵלֵ֔ךְ כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יַחְדָּֽיו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/003.yaml
  text: Wail[a], Heshbon, for Ai is devastated! Cry out, daughters of Rabbah! Put on sackcloth, mourn, and wander about among the walls, for their king will go into exile, together with his priests and his officials.
  footnotes:
  - marker: a
    text: Or 'Milcom will go into exile' (also spelled 'Malcam'), taking the Hebrew as the name of the Ammonite god rather than 'their king.'
    reason: alternative_reading
translation:
  language: ko
  text: 헤스본아, 통곡하십시오. 아이가 황폐해졌습니다! 라빠의 딸들아, 외치십시오! 베옷을 두르고, 슬퍼하며, 성벽들 사이를 이리저리 거닐십시오. 그들의 왕이 제사장들과 그의 관리들과 함께 포로로 끌려갈 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘밀곰(말감)이 포로로 끌려갈 것이다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵילִילִי
  english_pob_choice: Wail
  chosen_korean: 통곡하십시오
  alternatives_korean:
  - 울부짖으십시오
  - 애곡하십시오
  lexicon: HALOT
  rationale: 여성 단수 명령형의 애도 어조를 살리면서도, 현대 한국어에서 자연스럽고 강한 슬픔의 표현으로 옮겼습니다.
- source_word: צְעַקְנָה
  english_pob_choice: Cry out
  chosen_korean: 외치십시오
  alternatives_korean:
  - 부르짖으십시오
  - 소리치십시오
  lexicon: HALOT
  rationale: 복수 여성 명령의 강한 호소를 전달하되, 애가 문맥에 맞게 과격하지 않은 표준어로 처리했습니다.
- source_word: בְּנוֹת רַבָּה
  english_pob_choice: daughters of Rabbah
  chosen_korean: 라빠의 딸들
  alternatives_korean:
  - 라빠의 여자들
  - 라빠의 주민들
  lexicon: HALOT
  rationale: ‘딸들’의 히브리어 관용을 유지해 여성 복수의 직접 호칭과 도시의 의인화를 보존했습니다.
- source_word: וְהִתְשׁוֹטַטְנָה בַּגְּדֵרוֹת
  english_pob_choice: wander about among the walls
  chosen_korean: 성벽들 사이를 이리저리 거닐십시오
  alternatives_korean:
  - 성벽들 사이를 헤매십시오
  - 울타리들 사이를 이리저리 다니십시오
  lexicon: HALOT
  rationale: 지리적 이미지인 גדרות를 도시의 성벽 맥락으로 살리면서, 불안하게 움직이는 동작을 자연스러운 한국어로 옮겼습니다.
- source_word: מַלְכָּם
  english_pob_choice: their king
  chosen_korean: 그들의 왕
  alternatives_korean:
  - 밀곰
  - 말감
  lexicon: HALOT
  rationale: 마소라 모음에 따른 기본 뜻을 본문에 유지하고, 고유명사 가능성은 주석으로 처리할 수 있도록 했습니다.
- source_word: בַּגּוֹלָה יֵלֵךְ
  english_pob_choice: will go into exile
  chosen_korean: 포로로 끌려갈 것이기 때문입니다
  alternatives_korean:
  - 포로로 가게 될 것이기 때문입니다
  - 유배로 갈 것이기 때문입니다
  lexicon: HALOT
  rationale: ‘포로’는 추방·유배의 결과를 현대 한국어로 가장 분명하게 드러내며, 예언적 심판 문맥에 적합합니다.
theological_decisions:
- issue: מַלְכָּם를 인간 왕으로 읽을지, 암몬의 신 밀곰/말감을 가리키는지
  chosen_reading: 본문에는 ‘그들의 왕’으로 두고, 대안 독법은 각주로 남깁니다.
  alternative_readings:
  - 밀곰
  - 말감
  rationale: 마소라 모음은 인간 왕을 지지하지만, 자음 형태상 신명 독법도 가능하므로 해석 충돌을 지우지 않고 보존했습니다.
  doctrine_reference: Translation philosophy §3 — 신학적 긴장을 해소하지 말고 드러낼 것
