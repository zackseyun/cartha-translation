revisions:
- from: 그러므로 야훼께서 에돔을 상대로 세우신 계획과 데만 주민들을 상대로 구상하신 생각을 들으십시오. 분명히 양 떼의 가장 작은 자들이 그들을 끌어갈 것이며, 분명히 그분이 그들 위에 그들의 목장을 황폐하게 하실 것입니다.[a][b]
  to: 그러므로 야훼께서 에돔을 치려고 세우신 계획과 데만 주민들을 향하여 품으신 뜻을 들으십시오. 분명히 양 떼의 가장 작은 것들이[a] 그들을 끌어갈 것이며, 분명히 그분이 그들을 두고 그들의 목초지를[b] 황폐하게 하실 것입니다.
  rationale: 원문의 두 병렬 표현(야훼의 계획/뜻)과 두 차례의 강한 확언을 유지했습니다. 마지막 구절은 논쟁적·압축적인 히브리어 구문을 교파적 또는 과도한 해석 없이 자연스러운 한국어로 옮겼으며, עֲלֵיהֶם을 ‘그들 때문에’로 확정하지 않았습니다. 주석 표지도 각각 해당 어휘에 직접 붙였습니다.
