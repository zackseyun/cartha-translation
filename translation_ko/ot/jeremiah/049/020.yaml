- source_word: עֲצַת יְהוָה
  english_pob_choice: the counsel of Yahweh
  chosen_korean: 야훼께서 세우신 계획
  alternatives_korean:
  - 야훼의 상담
  - 야훼의 뜻
  lexicon: HALOT
  rationale: עֵצָה의 ‘조언’보다 이 문맥의 작정된 의도를 드러내는 ‘계획’이 더 자연스럽고, 예언적 심판 문맥과도 잘 맞습니다.
- source_word: יֹשְׁבֵי תֵימָן
  english_pob_choice: the inhabitants of Teman
  chosen_korean: 데만 주민들
  alternatives_korean:
  - 데만의 거주자들
  - 데만에 사는 사람들
  lexicon: HALOT
  rationale: 지명구를 간결하게 살리되, 예언체의 직접성을 유지하도록 ‘주민들’로 옮겼습니다.
- source_word: צְעִירֵי הַצֹּאן
  english_pob_choice: the little ones of the flock
  chosen_korean: 양 떼의 가장 작은 자들
  alternatives_korean:
  - 양 떼의 어린 것들
  - 양 떼의 가장 어린 자들
  - 양 떼의 가장 작은 무리
  lexicon: HALOT
  rationale: 직역적 양 이미지와 비유적 함의를 함께 보존하려고 했습니다. 여기서는 약하고 보잘것없는 공격자라는 뉘앙스를 너무 풀어 쓰지 않았습니다.
- source_word: נְוֵהֶם
  english_pob_choice: their pasture
  chosen_korean: 그들의 목장
  alternatives_korean:
  - 그들의 목초지
  - 그들의 거처
  - 그들의 우리
  lexicon: HALOT
  rationale: 양 떼 이미지와의 연결을 유지하면서도 한국어에서 자연스러운 결과 상태를 나타내는 말로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위로
  - 그들 위에서
  lexicon: HALOT
  rationale: 전치사의 공간적·부가적 뉘앙스를 그대로 살려, 원문의 ‘위에/위로’라는 관계를 유지했습니다.
