id: JER.49.20
reference: Jeremiah 49:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
  footnotes:
  - marker: a
    text: Or 'the youngest of the flock' or 'the least of the flock.' The phrase likely functions metaphorically for the weakest or least significant attackers, but the flock imagery is retained in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'their habitation' or 'their fold' for 'their pasture.' The Hebrew noun can refer to a dwelling place or pastureland; the main text preserves the flock imagery of the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 에돔을 치려고 세우신 계획과 데만 주민들을 향하여 품으신 뜻을 들으십시오. 분명히 양 떼의 가장 작은 것들이[a] 그들을 끌어갈 것이며, 분명히 그분이 그들을 두고 그들의 목초지를[b] 황폐하게 하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘양 떼의 가장 작은 것들’은 문자적으로 ‘양 떼의 어린 것들’ 또는 ‘양 떼의 작은 것들’입니다. 문맥상 약한 공격자나 보잘것없는 존재를 가리키는 비유일 가능성이 크지만, 본문에서는 양 떼의 이미지를 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목초지’는 문맥에 따라 ‘거처’, ‘우리’, 또는 ‘목장’으로도 옮길 수 있습니다. 본문은 양 떼 이미지와의 연결을 살려 ‘목초지’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
