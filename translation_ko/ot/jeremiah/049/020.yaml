source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל אֱד֔וֹם וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל יֹשְׁבֵ֣י תֵימָ֑ן אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נְוֵ/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/020.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Edom[a], and his thoughts that he has devised against the inhabitants of Teman: Surely the little ones of the flock will drag them away[b]; surely he will make their pasture desolate over them.'
  footnotes:
  - marker: a
    text: Or 'the youngest of the flock' or 'the least of the flock.' The phrase likely functions metaphorically for the weakest or least significant attackers, but the flock imagery is retained in the main text.
    reason: lexical_alternative
  - marker: b
    text: Or 'their habitation' or 'their fold' for 'their pasture.' The Hebrew noun can refer to a dwelling place or pastureland; the main text preserves the flock imagery of the verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 에돔을 상대로 세우신 계획과 데만 주민들을 상대로 구상하신 생각을 들으십시오. 분명히 양 떼의 가장 작은 자들이 그들을 끌어갈 것이며, 분명히 그분이 그들 위에 그들의 목장을 황폐하게 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘양 떼의 가장 작은 자들’은 문자적으로는 ‘양 떼의 어린/작은 자들’이며, 문맥상 약한 공격자나 하찮은 존재를 가리키는 비유일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 목장’은 문맥에 따라 ‘거처’, ‘우리’, 또는 ‘목초지’로도 옮길 수 있습니다. 본문은 양 떼 이미지의 연속성을 살려 ‘목장’을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그러니
  - 그렇기에
  lexicon: HALOT
  rationale: 예언 단락을 이어 주는 결론적 연결어로, 합쇼체 문맥에서 가장 자연스럽고 공식적인 대응입니다.
- source_word: עֲצַת יְהוָה
  english_pob_choice: the counsel of Yahweh
  chosen_korean: 야훼께서 세우신 계획
  alternatives_korean:
  - 야훼의 상담
  - 야훼의 뜻
  lexicon: HALOT
  rationale: עֵצָה의 ‘조언’보다 이 문맥의 작정된 의도를 드러내는 ‘계획’이 더 자연스럽고, 예언적 심판 문맥과도 잘 맞습니다.
- source_word: יֹשְׁבֵי תֵימָן
  english_pob_choice: the inhabitants of Teman
  chosen_korean: 데만 주민들
  alternatives_korean:
  - 데만의 거주자들
  - 데만에 사는 사람들
  lexicon: HALOT
  rationale: 지명구를 간결하게 살리되, 예언체의 직접성을 유지하도록 ‘주민들’로 옮겼습니다.
- source_word: צְעִירֵי הַצֹּאן
  english_pob_choice: the little ones of the flock
  chosen_korean: 양 떼의 가장 작은 자들
  alternatives_korean:
  - 양 떼의 어린 것들
  - 양 떼의 가장 어린 자들
  - 양 떼의 가장 작은 무리
  lexicon: HALOT
  rationale: 직역적 양 이미지와 비유적 함의를 함께 보존하려고 했습니다. 여기서는 약하고 보잘것없는 공격자라는 뉘앙스를 너무 풀어 쓰지 않았습니다.
- source_word: נְוֵהֶם
  english_pob_choice: their pasture
  chosen_korean: 그들의 목장
  alternatives_korean:
  - 그들의 목초지
  - 그들의 거처
  - 그들의 우리
  lexicon: HALOT
  rationale: 양 떼 이미지와의 연결을 유지하면서도 한국어에서 자연스러운 결과 상태를 나타내는 말로 옮겼습니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: over them
  chosen_korean: 그들 위에
  alternatives_korean:
  - 그들 위로
  - 그들 위에서
  lexicon: HALOT
  rationale: 전치사의 공간적·부가적 뉘앙스를 그대로 살려, 원문의 ‘위에/위로’라는 관계를 유지했습니다.
