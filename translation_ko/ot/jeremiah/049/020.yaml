  timestamp: '2026-07-13T17:25:02Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하나, 마지막 절의 ‘그들 위에 그들의 목장을 황폐하게 하실 것입니다’는 עֲלֵיהֶם의 관계를 한국어에서 부자연스럽고 공간적으로 오해되게 표현합니다. 또한 ‘구상하신 생각’은 מַחְשְׁבוֹתָיו/חָשַׁב의 의도성을 살리지만 한국어 결합이 어색합니다.
  naturalness: 현대 표준어 합쇼체의 예언문으로 자연스럽게 다듬을 필요가 있습니다. 특히 마지막 절은 ‘그들을 두고’로 옮겨 원문의 ‘그들 위에/그들에 관하여’라는 관계를 인위적인 인과관계로 단정하지 않고 보존했습니다.
  terminology: ‘야훼’, ‘에돔’, ‘데만’, ‘양 떼’, ‘목초지’는 적절합니다. צְעִירֵי הַצֹּאן은 비유를 본문에서 해석하지 않고 ‘양 떼의 가장 작은 것들’로 유지했습니다. נְוֵהֶם은 ‘목초지’로 택하고 대안을 주석에 남겼습니다.
  issues:
  - severity: medium
    issue: 마지막 절의 ‘그들 위에 그들의 목장을 황폐하게 하실 것입니다’
    rationale: 한국어에서 ‘목장을 그들 위에 황폐하게 하다’는 공간적 배치처럼 읽혀 의미가 성립하기 어렵습니다. עֲלֵיהֶם의 폭넓은 관계적 용법을 ‘그들을 두고’로 옮겨, ‘때문에’라는 인과 해석을 추가하지 않았습니다.
  - severity: low
    issue: ‘데만 주민들을 상대로 구상하신 생각’
    rationale: ‘구상하신 생각’은 중복적이고 어색합니다. ‘데만 주민들을 향하여 품으신 뜻’이 מחשבות와 חשב의 숙고된 의도를 자연스럽게 전달합니다.
  - severity: low
    issue: 각주 표지 위치
