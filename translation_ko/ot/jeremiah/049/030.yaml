revisions:
- from: 도망하십시오! 멀리 떠나십시오! 깊은 곳에 머무르십시오[a], 하솔 주민들아. 야훼께서 말씀하십니다[b]. 바빌론 왕 느부갓네살이 너희를 향해 계책을 세웠고, 너희를 향해 계획을 꾸몄기 때문입니다.
  to: 도망하십시오! 아주 멀리 떠나십시오! 깊숙한 곳에 숨어 지내십시오[a], 하솔 주민들아. 야훼의 말씀입니다. 바빌론 왕 느부갓네살이 너희를 거슬러 계책을 세우고 그들을 거슬러 계획을 꾸몄기 때문입니다[b].
  rationale: 마소라 본문의 2인칭에서 3인칭으로의 대명사 전환을 본문과 각주에서 보존했습니다. 예언 선포 공식은 현대 한국어 성서 문체에 맞춰 ‘야훼의 말씀입니다’로 다듬었고, ‘깊이 거주하다’의 은신·후퇴 의미는 본문의 자연스러운 명령문과 각주를 통해 전달했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:02Z'
review_pass:
  verdict: revise
  source_fidelity: 마소라 본문의 마지막 대명사는 앞선 2인칭 복수 ‘너희’에서 3인칭 복수 ‘그들’로 전환됩니다(עֲלֵיכֶם → עֲלֵיהֶם). 초안은 두 번 모두 ‘너희’로 번역하여 이 전환을 평준화했습니다. 또한 이에 관한 영어 POB 주석의 핵심 정보가 한국어 주석에 반영되지 않았습니다.
  naturalness: 명령형과 합쇼체는 전반적으로 자연스럽습니다. 다만 예언 선포 공식은 ‘야훼께서 말씀하십니다’보다 ‘야훼의 말씀입니다’가 현대 한국어 성서 문체에서 간결하고 자연스러우며, נְאֻם יְהוָה의 공식성을 잘 드러냅니다. ‘깊숙한 곳에 숨어 지내십시오’는 관용적 의미를 본문에서 과도하게 설명하지 않으면서 자연스럽게 전달합니다.
  terminology: ‘야훼’, ‘하솔’, ‘느부갓네살’, ‘바빌론’은 적절합니다. 적대적 문맥의 עַל은 ‘~을 거슬러’로 옮겨 계획의 대상과 적대성을 명확히 했습니다.
  issues:
  - severity: high
    issue: 마지막 עֲלֵיהֶם의 3인칭 복수를 ‘너희’로 번역함
    rationale: WLC는 ‘너희를 거슬러’ 다음에 ‘그들을 거슬러’라고 대명사를 전환합니다. 번역도 이 문법적 긴장을 보존해야 하며, 독자의 혼동 가능성은 각주로 설명하는 것이 적절합니다.
  - severity: medium
    issue: 대명사 전환을 설명하는 각주가 없음
    rationale: 영어 POB 감사 기록의 b 주석은 본문의 중요한 텍스트적 특징을 지적합니다. 현 초안의 b 주석은 신명 표기 정책만 설명하므로, 원문 충실성에 필요한 대명사 전환 주석으로 교체하는 것이 좋습니다.
  - severity: low
