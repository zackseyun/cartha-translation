id: JER.49.30
reference: Jeremiah 49:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נֻסוּ֩ נֻּ֨דוּ מְאֹ֜ד הֶעְמִ֧יקוּ לָ/שֶׁ֛בֶת יֹשְׁבֵ֥י חָצ֖וֹר נְאֻם יְהוָ֑ה כִּֽי יָעַ֨ץ עֲלֵי/כֶ֜ם נְבוּכַדְרֶאצַּ֤ר מֶֽלֶךְ בָּבֶל֙ עֵצָ֔ה וְ/חָשַׁ֥ב עלי/הם מַחֲשָׁבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/030.yaml
  text: Flee! Wander far away! Dwell deep[a], inhabitants of Hazor, declares Yahweh[b], for Nebuchadnezzar king of Babylon has taken counsel against you and devised a plan against you.
  footnotes:
  - marker: a
    text: 'Hebrew: ''dwell deep,'' an idiom for retreating to remote or hidden places.'
    reason: cultural_note
  - marker: b
    text: The Hebrew shifts from 'against you' to 'against them' at the end of the verse; the translation preserves this change.
    reason: textual_variant
translation:
  language: ko
  text: 도망하십시오! 아주 멀리 떠나십시오! 깊숙한 곳에 숨어 지내십시오[a], 하솔 주민들아. 야훼의 말씀입니다. 바빌론 왕 느부갓네살이 너희를 거슬러 계책을 세우고 그들을 거슬러 계획을 꾸몄기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘깊이 거주하다’라는 관용적 표현으로, 외딴 곳이나 숨을 곳으로 물러나라는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 절 앞부분의 ‘너희를 거슬러’에서 마지막의 ‘그들을 거슬러’로 대명사를 전환합니다. 번역은 이 전환을 보존했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: נֻסוּ
  english_pob_choice: Flee!
  chosen_korean: 도망하십시오!
  alternatives_korean:
  - 달아나십시오!
  - 피하십시오!
  lexicon: HALOT
  rationale: נוס의 명령형으로 급박한 피난 명령이므로, 현대 합쇼체에서 직접적이고 분명한 ‘도망하십시오’가 가장 자연스럽습니다.
- source_word: נֻּדוּ מְאֹד
  english_pob_choice: Wander far away!
  chosen_korean: 멀리 떠나십시오!
  alternatives_korean:
  - 아주 멀리 떠나십시오!
  - 한참 떨어지십시오!
  lexicon: HALOT
  rationale: נוד와 מְאֹד의 결합은 단순 이동보다 ‘아주 멀리 떨어져 나가라’는 강한 거리두기를 뜻하므로, ‘멀리 떠나십시오’로 압축해 그 긴박함을 살렸습니다.
- source_word: הֶעְמִיקוּ לָשֶׁבֶת
  english_pob_choice: Dwell deep
  chosen_korean: 깊은 곳에 머무르십시오
  alternatives_korean:
  - 깊숙한 곳에 거주하십시오
  - 은밀한 곳에 숨어 지내십시오
  lexicon: HALOT
  rationale: 직역하면 ‘깊게 살게 하다/깊게 거주하다’라는 관용구이므로, 은신·퇴각의 이미지를 살려 ‘깊은 곳에 머무르십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용어
  rationale: 문맥상 예언 선포 공식의 신명으로, 프로젝트 기본값에 따라 ‘야훼’로 표기해 원문 고유명을 보존했습니다.
- source_word: יָעַץ עֵצָה
  english_pob_choice: has taken counsel
  chosen_korean: 계책을 세웠고
  alternatives_korean:
  - 상의를 했고
  - 조언을 했고
  lexicon: HALOT
  rationale: 동사-명사 결합이 의도적이고 적대적인 책략을 강조하므로, 군사적 맥락에 맞는 ‘계책을 세웠고’로 자연스럽게 옮겼습니다.
- source_word: וְחָשַׁב מַחֲשָׁבָה
  english_pob_choice: devised a plan
  chosen_korean: 계획을 꾸몄기 때문입니다
  alternatives_korean:
  - 음모를 꾸몄기 때문입니다
  - 계략을 생각해 냈기 때문입니다
  lexicon: HALOT
  rationale: 같은 어근의 반복이 의도적 계획·모의의 강도를 높이므로, 뒤의 절에서는 ‘꾸몄다’로 변화를 주되 적대적 설계를 유지했습니다.
theological_decisions:
- issue: 예언 선포 공식에서의 신명 표기
  chosen_reading: ‘야훼께서 말씀하십니다’로 직접 옮겨, 예언자의 권위가 아닌 야훼의 직접 발화를 드러냅니다.
  alternative_readings:
  - ‘주께서 말씀하십니다’
  - ‘여호와의 말씀이니라’
  rationale: 히브리어 נְאֻם יְהוָה는 예언적 공식이지만, 프로젝트 기본 용어에 따라 신명을 ‘야훼’로 유지하는 것이 원문 고유성을 가장 잘 보존합니다.
  doctrine_reference: '프로젝트 용어 정책: יְהוָה / YHWH → 야훼'
