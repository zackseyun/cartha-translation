  text: וְ/שַׂמְתִּ֥י כִסְאִ֖/י בְּ/עֵילָ֑ם וְ/הַאֲבַדְתִּ֥י מִ/שָּׁ֛ם מֶ֥לֶךְ וְ/שָׂרִ֖ים נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/038.yaml
  text: And I will set my throne in Elam[a], and I will destroy from there king and officials[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'I will place my throne in Elam.' The Hebrew verb can mean 'set,' 'place,' or 'establish.'
    reason: lexical_alternative
  - marker: b
    text: Or 'king and princes.' The Hebrew term for 'officials' can also refer to rulers or nobles.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 내 보좌를 엘람에 두고, 거기에서 왕과 관원들을 멸하겠습니다. 야훼의 말씀이십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 보좌를 엘람에 두겠습니다.’ 히브리어 동사는 ‘두다’, ‘놓다’, ‘세우다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕과 방백들.’ 히브리어 ‘관원들’에 해당하는 말은 통치자나 귀족을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  english_pob_choice: And I will set
  chosen_korean: 내가 … 두고
  alternatives_korean:
  - 내가 … 놓고
  - 내가 … 세우고
  lexicon: HALOT
  rationale: שׂוּם의 ‘set/place’ 의미를 살려 보좌를 특정 장소에 ‘두다’로 옮겼습니다. ‘세우다’도 가능하지만, 여기서는 위치를 지정하는 직접 동작이 더 자연스럽습니다.
- source_word: כִסְאִי
  english_pob_choice: my throne
  chosen_korean: 내 보좌
  alternatives_korean:
  - 내 왕좌
  - 내 자리
  lexicon: HALOT
  rationale: כִּסֵּא는 왕권과 재판권을 함께 드러내는 보좌를 뜻하므로 ‘보좌’가 이미지와 위엄을 가장 잘 보존합니다.
- source_word: שָׂרִים
  english_pob_choice: officials
  chosen_korean: 관원들
  alternatives_korean:
  - 방백들
  - 통치자들
  - 귀족들
  lexicon: HALOT
  rationale: שָׂרִים은 고위 지도자층을 가리키므로, 현대 한국어에서 행정·지배 엘리트를 자연스럽게 드러내는 ‘관원들’이 적절합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언서의 전형적 종결 공식을 살리되, 본문 표준 용례에 맞춰 하나님의 이름을 ‘야훼’로 옮겼습니다. 한국어에서는 문장 종결을 자연스럽게 만들기 위해 ‘말씀이십니다’를 택했습니다.
theological_decisions:
- issue: 야훼의 보좌를 ‘엘람에’ 둔다는 표현의 보존
  chosen_reading: 주권적 심판의 상징으로서 구체적 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 내가 엘람을 다스리겠습니다
  - 내가 엘람에 임재하겠습니다
  rationale: 본문은 하나님의 통치와 심판을 보좌 이미지로 제시하므로, 이를 추상화하지 않고 그대로 옮겨 독자가 긴장을 읽게 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; prophetic imagery preservation'
