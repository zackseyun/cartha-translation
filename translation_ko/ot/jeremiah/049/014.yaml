  source_fidelity: 원문의 화자 1인칭은 겸양형 ‘제가’가 아니라 중립적인 ‘나는’으로 옮겨야 합니다. 여성 단수 목적격 עָלֶיהָ는 에돔의 여성 의인화를 유지하므로 ‘그녀를’로 번역하는 것이 적절합니다. צִיר는 ‘사절’이 문맥상 자연스럽고, שָׁלוּחַ의 수동성을 ‘파견되었습니다’로 드러냈습니다. ‘전쟁을 위해’는 לַמִּלְחָמָה를 충실히 반영합니다.
  naturalness: ‘나라들 사이에 보내졌습니다’보다 ‘나라들 가운데 파견되었습니다’가 파견된 사절과 국제적 소집이라는 문맥에서 더 자연스럽고 격식 있는 현대 표준어입니다. 인용문 안의 명령은 합쇼체 서술 환경에서도 예언적 직접 인용에 알맞게 ‘모여라’로 유지할 수 있습니다.
  terminology: יְהוָה는 제공된 프로젝트 결정 및 영어 POB에 따라 ‘야훼’로 통일했습니다. ‘사절’은 צִיר의 전령·외교 사절 양쪽 가능성을 무리 없이 포괄합니다.
