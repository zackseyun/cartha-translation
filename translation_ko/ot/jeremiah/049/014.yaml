  - severity: medium
    issue: 신명 표기가 프로젝트 결정과 영어 POB의 ‘Yahweh’에 맞지 않게 ‘여호와’로 되어 있습니다.
    rationale: 제시된 신학 용어 결정은 יְהוָה를 ‘Yahweh’로 옮기도록 명시하므로 한국어에서는 ‘야훼’가 일관된 대응입니다.
