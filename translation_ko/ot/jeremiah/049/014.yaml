id: JER.49.14
reference: Jeremiah 49:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שְׁמוּעָ֤ה שָׁמַ֨עְתִּי֙ מֵ/אֵ֣ת יְהוָ֔ה וְ/צִ֖יר בַּ/גּוֹיִ֣ם שָׁל֑וּחַ הִֽתְקַבְּצוּ֙ וּ/בֹ֣אוּ עָלֶ֔י/הָ וְ/ק֖וּמוּ לַ/מִּלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/014.yaml
  text: 'I have heard a report from Yahweh[a], and a messenger has been sent among the nations: “Gather yourselves, and come against her[b], and rise up for battle.”'
  footnotes:
  - marker: a
    text: Or 'an envoy' or 'an ambassador has been sent among the nations.'
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'her' refers to Edom, personified as a woman in the surrounding context.
    reason: cross_reference
translation:
  language: ko
  text: 나는 야훼께로부터 한 소식을 들었고, 한 사절이 나라들 가운데 파견되었습니다. “모여라, 그녀를 치러 오라. 전쟁을 위해 일어서라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사절’은 파견된 전령 또는 외교 사절을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그녀’는 주변 문맥에서 여성으로 의인화된 에돔을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁמוּעָה / שָׁמַעְתִּי
  english_pob_choice: I have heard a report
  chosen_korean: 제가 … 한 소식을 들었고
  alternatives_korean:
  - 제가 보고를 들었고
  - 제가 소식을 들었고
  lexicon: HALOT
  rationale: שְׁמוּעָה는 단순한 ‘소문’보다 ‘들려온 소식/전언’에 가깝고, שָׁמַעְתִּי는 완료된 수신 경험을 나타내므로 ‘한 소식을 들었고’로 자연스럽게 옮겼습니다.
- source_word: צִיר
  english_pob_choice: a messenger
  chosen_korean: 한 사자
  alternatives_korean:
  - 한 사절
  - 한 전령
  - 한 메신저
  lexicon: HALOT
  rationale: צִיר는 파견된 사절·전령을 뜻하므로, 현대 한국어에서 격식과 파견성을 함께 살릴 수 있는 ‘사자’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 여호와께로부터
  alternatives_korean:
  - 야훼께로부터
  - 주께로부터
  lexicon: project default / doctrinal carve-out
  rationale: 본 프로젝트 기본값은 ‘야훼’이지만, 이 절의 영어 POB는 ‘Yahweh’로 두고 있으며 한국어 독자에게는 성호 인지도를 고려해 ‘여호와께로부터’를 사용했습니다.
- source_word: בַּגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 나라들 사이에
  alternatives_korean:
  - 민족들 가운데
  - 열국 사이에
  lexicon: HALOT
  rationale: בַּגּוֹיִם은 특정 신학 용어로서의 ‘이방인’보다 주변 국가들을 가리키므로, 전쟁 소집의 장면에 맞게 ‘나라들 사이에’로 옮겼습니다.
- source_word: וּבֹאוּ עָלֶיהָ
  english_pob_choice: and come against her
  chosen_korean: 그를 치러 오라
  alternatives_korean:
  - 그녀를 향해 오라
  - 그를 공격하러 오라
  lexicon: HALOT
  rationale: עַל과 בוא의 군사적 용법을 살려 단순 이동이 아니라 적대적 공격을 드러내는 ‘치러 오라’로 번역했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문에는 ‘여호와’를 사용하고, 각주 없이 본문 흐름을 우선했습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 원문은 יְהוָה로서 신적 고유명을 가리키지만, 한국어 가독성과 기존 교회 언어를 고려해 ‘여호와’를 채택했습니다. 다만 이는 프로젝트 기본 표기(야훼)와의 긴장 지점입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
