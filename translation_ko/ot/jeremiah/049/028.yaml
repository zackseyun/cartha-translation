id: JER.49.28
reference: Jeremiah 49:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/קֵדָ֣ר וּֽ/לְ/מַמְלְכ֣וֹת חָצ֗וֹר אֲשֶׁ֤ר הִכָּה֙ נבוכדראצור מֶֽלֶךְ בָּבֶ֔ל כֹּ֖ה אָמַ֣ר יְהוָ֑ה ק֚וּמוּ עֲל֣וּ אֶל קֵדָ֔ר וְ/שָׁדְד֖וּ אֶת בְּנֵי קֶֽדֶם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/028.yaml
  text: 'Concerning Kedar and the kingdoms of Hazor[a], which Nebuchadnezzar king of Babylon struck down: Thus says Yahweh: Rise up, go up against Kedar[b], and plunder the people of the east.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''sons of the east,'' an idiom for eastern desert peoples.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew spelling here is closer to 'Nebuchadrezzar'; English convention usually writes 'Nebuchadnezzar.'
    reason: lexical_alternative
translation:
  language: ko
  text: “게달과 하솔의 여러 왕국에 대하여—바빌론 왕 느부갓네살이 그들을 쳐부쉈습니다—야훼께서 이렇게 말씀하십니다. ‘일어나라, 게달을 치러 올라가서 동쪽 사람들을 약탈하라.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘동쪽의 아들들’은 동방 사막 민족을 가리키는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 철자는 영어 관습형 ‘Nebuchadnezzar’보다 ‘Nebuchadrezzar’에 더 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקֵדָר
  english_pob_choice: Concerning Kedar
  chosen_korean: “게달과 …에 대하여”
  alternatives_korean:
  - “게달에 대하여”
  - “게달을 향하여”
  lexicon: HALOT
  rationale: 예언 표제의 ל는 방향보다 주제 표지를 이루는 경우가 많으므로, ‘대하여’로 옮겨 말씀의 대상임을 드러냈습니다.
- source_word: וּלְמַמְלְכֹות חָצֹור
  english_pob_choice: and the kingdoms of Hazor
  chosen_korean: “하솔의 여러 왕국”
  alternatives_korean:
  - “하솔의 왕국들”
  - “하솔의 나라들”
  lexicon: HALOT
  rationale: מַמְלָכוֹת의 복수를 살려 ‘여러 왕국’으로 옮기고, 하솔을 고유명사로 유지했습니다.
- source_word: נבוכדראצור
  english_pob_choice: Nebuchadnezzar
  chosen_korean: “느부갓네살”
  alternatives_korean:
  - “네부카드네자르”
  - “느부갓레살”
  lexicon: HALOT
  rationale: 한국어 성경의 확립된 인명형을 따르되, 히브리어 철자가 영어 관습형 Nebuchadnezzar와 가깝다는 점은 굳이 드러내지 않았습니다.
- source_word: בְּנֵי קֶדֶם
  english_pob_choice: the people of the east
  chosen_korean: “동쪽 사람들”
  alternatives_korean:
  - “동방의 사람들”
  - “동쪽의 아들들”
  lexicon: HALOT
  rationale: 직역하면 ‘동쪽의 아들들’이지만, 영어 POB의 주석처럼 동방 사막 민족을 가리키는 관용구이므로 한국어에서는 자연스럽고 의미를 살리는 ‘동쪽 사람들’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 이 본문의 원문은 신명칭을 직접 사용하므로, 프로젝트 기본값에 따라 이름을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼'
- issue: 직접 인용문의 명령형 어조
  chosen_reading: “일어나라… 치러 올라가서… 약탈하라”
  alternative_readings:
  - “일어나십시오… 올라가십시오… 약탈하십시오”
  - “일어나세요… 올라가세요… 약탈하세요”
  rationale: 야훼의 심판 선포 안에서 군사 명령이 직접 발화되므로, 한국어에서 자연스러운 명령형을 유지했습니다.
  doctrine_reference: Source speech register and prophetic oracle force
