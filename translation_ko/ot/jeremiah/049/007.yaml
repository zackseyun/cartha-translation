  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֶ/אֱד֗וֹם כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת הַ/אֵ֥ין ע֛וֹד חָכְמָ֖ה בְּ/תֵימָ֑ן אָבְדָ֤ה עֵצָה֙ מִ/בָּנִ֔ים נִסְרְחָ֖ה חָכְמָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/007.yaml
  text: 'Concerning Edom: Thus says Yahweh of hosts: Is there no longer wisdom in Teman? Has counsel perished from the prudent? Has their wisdom become corrupted?[a][b]'
  footnotes:
  - marker: a
    text: Or 'from those with understanding'; the Hebrew term refers to discerning people, not biological 'sons.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Has their wisdom become corrupt?' The Hebrew verb suggests something spoiled, tainted, or gone bad.
    reason: lexical_alternative
translation:
  language: ko
  text: '에돔에 대하여: 만군의 야훼께서 이렇게 말씀하십니다. "더 이상 테만에 지혜가 없습니까? 분별 있는 자들에게서 조언이 사라졌습니까? 그들의 지혜가 썩어 버렸습니까?"[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분별 있는 자들’은 문자적으로 ‘아들들’처럼 보이는 히브리어 표현을 의미에 따라 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘썩어 버렸습니까’는 히브리어 동사가 암시하는 ‘썩다, 상하다, 부패하다’의 감각을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאֱדוֹם
  english_pob_choice: Concerning Edom
  chosen_korean: 에돔에 대하여
  alternatives_korean:
  - 에돔을 향하여
  - 에돔에 관하여
  lexicon: HALOT
  rationale: 예언 서문의 주제 표지로서 ‘대하여’가 가장 자연스럽고, 공격 방향을 과도하게 단정하지 않으면서도 대상성을 분명히 드러냅니다.
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주
  - 만군의 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, צְבָאֹות은 군사적·우주적 이미지를 살려 ‘만군의’로 처리했습니다.
- source_word: מִבָּנִים
  english_pob_choice: from the prudent
  chosen_korean: 분별 있는 자들
  alternatives_korean:
  - 아들들
  - 깨닫는 자들
  - 지각 있는 자들
  lexicon: HALOT
  rationale: 히브리어 형태는 문자적으로 ‘아들들’처럼 보이지만 문맥상 ‘분별하는 사람들’을 가리키므로, POB의 의도를 따라 인격적 의미를 살려 옮겼습니다.
- source_word: נִסְרְחָה
  english_pob_choice: Has their wisdom become corrupted
  chosen_korean: 그들의 지혜가 썩어 버렸습니까
  alternatives_korean:
  - 그들의 지혜가 부패했습니까
  - 그들의 지혜가 상했습니까
  - 그들의 지혜가 썩었습니까
  lexicon: HALOT
  rationale: 동사는 ‘썩다/상하다/부패하다’의 감각을 가지므로, 지혜의 쇠퇴를 단순 소실이 아니라 변질·부패의 이미지로 살리는 ‘썩어 버렸습니까’를 선택했습니다.
theological_decisions:
- issue: 예언 수사문의 연속 의문문 톤
  chosen_reading: 세 개의 수사 의문문을 그대로 유지하여 에돔의 자랑스러운 지혜가 무너졌다는 조롱과 반전을 살렸습니다.
  alternative_readings:
  - 평서문으로 완화하기
  - 의문문 일부를 설명문으로 바꾸기
  rationale: 본문은 정보 전달보다 심판 선언의 풍자적 수사에 무게가 있으므로, 의문형을 보존해야 독자가 원문 효과를 이해할 수 있습니다.
  doctrine_reference: Jeremiah 49장의 심판 예언 수사 구조
