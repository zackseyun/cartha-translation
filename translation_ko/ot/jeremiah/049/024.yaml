id: JER.49.24
reference: Jeremiah 49:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: רָפְתָ֥ה דַמֶּ֛שֶׂק הִפְנְתָ֥ה לָ/נ֖וּס וְ/רֶ֣טֶט הֶחֱזִ֑יקָה צָרָ֧ה וַ/חֲבָלִ֛ים אֲחָזַ֖תָּ/ה כַּ/יּוֹלֵדָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/024.yaml
  text: Damascus has become feeble[a]; she has turned to flee, and trembling has seized her. Distress and labor pains have taken hold of her[c][b], like a woman giving birth.
  footnotes:
  - marker: a
    text: Or 'has grown weak' / 'has become fainthearted' for 'has become feeble.' The Hebrew verb can denote weakening or loss of courage.
    reason: lexical_alternative
  - marker: b
    text: Or 'terror has seized her' for 'trembling has seized her.' The noun more literally denotes trembling or quaking, likely from fear.
    reason: lexical_alternative
  - marker: c
    text: Or 'pangs' / 'birth pains' for 'labor pains.' The context of childbirth in the next phrase supports the obstetric sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 다마스쿠스가 약해졌습니다[a]. 그는 도망치려고 몸을 돌렸고, 떨림이 그를 사로잡았습니다[b]. 고통과 해산의 진통이 그를 붙잡아, 마치 해산하는 여인 같았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘쇠약해졌습니다’ / ‘기운이 꺾였습니다’로도 옮길 수 있습니다. 히브리어 동사는 힘의 약화뿐 아니라 용기 상실도 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공포가 그를 사로잡았습니다’로도 옮길 수 있습니다. 이 명사는 문자적으로는 떨림이나 전율을 가리키지만, 두려움에서 비롯된 떨림일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘산고’ / ‘해산의 고통’으로도 옮길 수 있습니다. 바로 뒤의 출산 비유가 이 표현의 산과적 의미를 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָפְתָה
  english_pob_choice: has become feeble
  chosen_korean: 약해졌습니다
  alternatives_korean:
  - 기운이 꺾였습니다
  - 쇠약해졌습니다
  - 힘이 빠졌습니다
  lexicon: HALOT
  rationale: רפה의 의미인 약화, 힘의 이완, 기력 상실을 간결하게 살려 다마스쿠스의 붕괴 상태를 자연스럽게 드러냈습니다.
- source_word: הִפְנְתָה לָנוּס
  english_pob_choice: has turned to flee
  chosen_korean: 도망치려고 몸을 돌렸고
  alternatives_korean:
  - 도망치기 위해 돌아섰고
  - 달아나려고 방향을 틀었고
  lexicon: HALOT
  rationale: ‘돌다/몸을 돌리다’와 ‘도망치다’의 결합을 한국어 관용으로 옮겨, 단순한 방향 전환이 아니라 도주 의도를 드러냈습니다.
- source_word: וְרֶטֶט
  english_pob_choice: and trembling
  chosen_korean: 떨림
  alternatives_korean:
  - 전율
  - 떨림과 공포
  lexicon: HALOT
  rationale: רטט는 두려움에서 오는 떨림, 떨림 자체를 뜻하므로 본문에는 해석을 덧붙이지 않고 ‘떨림’으로 두었습니다.
- source_word: צָרָה וַחֲבָלִים
  english_pob_choice: Distress and labor pains
  chosen_korean: 고통과 해산의 진통
  alternatives_korean:
  - 환난과 산고
  - 고뇌와 출산의 고통
  lexicon: HALOT
  rationale: 후속 비유가 출산을 분명히 가리키므로 חבלים을 단순한 ‘고통’보다 ‘해산의 진통’으로 구체화해 병렬과 이미지를 모두 살렸습니다.
- source_word: כַּיּוֹלֵדָה
  english_pob_choice: like a woman giving birth
  chosen_korean: 마치 해산하는 여인 같았습니다
  alternatives_korean:
  - 마치 아이를 낳는 여인 같았습니다
  - 마치 진통하는 여인 같았습니다
  lexicon: HALOT
  rationale: יולדה는 출산 중인 여인을 가리키므로, 현대 한국어에서 가장 자연스럽고 선명한 ‘해산하는 여인’으로 옮겼습니다.
theological_decisions:
- issue: 의인화된 다마스쿠스에 대한 동사 시제와 주어 처리
  chosen_reading: 다마스쿠스를 여성 인칭처럼 이어 받아 ‘그를’로 반복하지 않고, 전장의 도시가 무너지는 의인화된 이미지를 자연스럽게 한국어 문장으로 재현했습니다.
  alternative_readings:
  - ‘그녀를’로 일관되게 옮김
  - 도시명 반복을 피하지 않고 매번 ‘다마스쿠스’를 재진술함
  rationale: 히브리어는 도시를 여성형으로 인칭화하므로, 한국어에서는 의미 전달이 우선이지만 과도한 성별 표시는 피하면서도 의인화 효과를 보존하는 것이 적절합니다.
  doctrine_reference: 시적 예언문에서의 의인화와 수사적 인칭
