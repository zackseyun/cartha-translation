id: JER.49.15
reference: Jeremiah 49:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי הִנֵּ֥ה קָטֹ֛ן נְתַתִּ֖י/ךָ בַּ/גּוֹיִ֑ם בָּז֖וּי בָּ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/015.yaml
  text: For look, I have made you small among the nations, despised among men.
translation:
  language: ko
  text: 보십시오, 내가 너를 민족들 가운데서 작게 만들고, 사람들 가운데서 멸시받게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּֽי הִנֵּ֥ה
  english_pob_choice: For look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: כִּי + הִנֵּה
  rationale: 호소문으로서의 주의 환기를 살리되, 현대 한국어에서 자연스럽고 합쇼체에 맞는 직접적 호출로 옮겼습니다.
- source_word: קָטֹ֛ן נְתַתִּ֖י/ךָ
  english_pob_choice: I have made you small
  chosen_korean: 내가 너를 … 작게 만들고
  alternatives_korean:
  - 내가 너를 작게 하였고
  - 내가 너를 작게 만들었습니다
  lexicon: קָטֹן + נתן
  rationale: ‘작게 하다’의 상태 변화와 축소를 살리기 위해 ‘작게 만들다’로 옮겼습니다. 예언적 선언의 현재적 효력을 반영해 자연스럽게 표현했습니다.
- source_word: בַּ/גּוֹיִ֑ם
  english_pob_choice: among the nations
  chosen_korean: 민족들 가운데서
  alternatives_korean:
  - 나라들 가운데서
  - 열국 가운데서
  lexicon: גּוֹיִם
  rationale: 히브리어 גּוֹיִם의 기본 의미를 따라 ‘민족들’로 번역하되, 문맥상 ‘가운데서’로 집단 내 위치를 분명히 했습니다.
- source_word: בָּז֖וּי בָּ/אָדָם
  english_pob_choice: despised among men
  chosen_korean: 사람들 가운데서 멸시받게 하였습니다
  alternatives_korean:
  - 사람들 가운데서 업신여김을 받게 하였습니다
  - 인간들 사이에서 멸시당하게 하였습니다
  lexicon: בָּזוּי + אָדָם
  rationale: בָּזוּי의 수동적 멸시 상태를 한국어의 ‘멸시받다’로 직역성 있게 재현했습니다. ‘사람들’은 אָדָם의 일반 인간 집단 의미를 반영합니다.
theological_decisions:
- issue: 예언적 선언의 시제와 담화 방식
  chosen_reading: 하나님의 선언을 한국어 현재-완료형 서술로 처리하여, 이미 정해진 수치를 단정적으로 전합니다.
  alternative_readings:
  - ‘내가 너를 작게 둘 것이다’ 같은 미래형
  - ‘내가 너를 작게 하였다’ 같은 완료형만의 경직된 표현
  rationale: 히브리어 예언문은 선언적 완료의 뉘앙스를 가지므로, 한국어에서는 ‘만들었습니다/하였습니다’ 계열로 현재적 효력을 드러내는 것이 적절합니다.
  doctrine_reference: 예언적 확정성
- issue: 직접 호소문 ‘הִנֵּה’의 호칭 강도
  chosen_reading: ‘보십시오’로 옮겨, 독자에게 장면을 즉시 보게 하는 강한 주의를 유지했습니다.
  alternative_readings:
  - ‘보라’
  - ‘자, 보십시오’
  rationale: 합쇼체 본문에서 고전적 ‘보라’보다 현대 독자에게 직접적이고 공손한 경고/주목의 효과가 있습니다.
  doctrine_reference: 수사학적 강조
