base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/011.yaml
  text: Leave your fatherless children; I will keep them alive[a]. And let your widows trust in me.
  footnotes:
  - marker: a
    text: Or 'your orphans.' The Hebrew term specifically denotes the fatherless.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 아비 없는 자녀들을 내버려 두어라. 내가 그들을 살려 두겠습니다[a]. 너희의 과부들도 내게 의지하게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 고아들’. 히브리어는 특히 ‘아비 없는 자녀들’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְבָה
  english_pob_choice: Leave
  chosen_korean: 내버려 두어라
  alternatives_korean:
  - 떠나게 하십시오
  - 버려 두십시오
  lexicon: HALOT
  rationale: 2인칭 남성 단수 명령의 직접성을 살리면서도, 한국어에서 자연스럽고 문맥의 냉정한 어조를 담을 수 있는 표현으로 옮겼습니다.
- source_word: יְתֹמֶיךָ
  english_pob_choice: your fatherless children
  chosen_korean: 너희의 아비 없는 자녀들
  alternatives_korean:
  - 너희의 고아들
  - 너희의 아비 없는 아이들
  lexicon: HALOT
  rationale: 히브리어 יָתוֹם의 핵심 의미는 ‘아비 없는’ 상태이므로, 단순히 ‘고아들’로 일반화하지 않고 사회적 표지를 드러냈습니다.
- source_word: אֲחַיֶּה
  english_pob_choice: will keep them alive
  chosen_korean: 그들을 살려 두겠습니다
  alternatives_korean:
  - 그들을 살게 하겠습니다
  - 그들의 생명을 보존하겠습니다
  lexicon: HALOT
  rationale: 피엘의 ‘살게 하다/생명을 유지시키다’는 능동적 보전의 뜻을 자연스러운 한국어로 옮겼습니다.
- source_word: וְאַלְמְנֹתֶיךָ ... תִּבְטָחוּ
  english_pob_choice: And let your widows trust in me
  chosen_korean: 너희의 과부들도 내게 의지하게 하십시오
  alternatives_korean:
  - 너희의 과부들도 내게 신뢰하게 하십시오
  - 너희의 과부들도 내 안에서 믿게 하십시오
  lexicon: HALOT
  rationale: בּטח의 대상 표지 עַל־י는 한국어에서 ‘~에게 의지하다/신뢰하다’가 가장 자연스럽고, 여기서는 권면형 어조를 살려 옮겼습니다.
theological_decisions:
- issue: 화자와 약속의 성격
  chosen_reading: 여호와께서 에돔의 남은 약자들, 곧 아비 없는 자녀들과 과부들을 향해 보호를 약속하시는 말씀으로 읽었습니다.
  alternative_readings:
  - 일반적인 돌봄 원리로 완화하는 읽기
  - 비인격적 위로의 진술로 처리하는 읽기
  rationale: 예레미야 49장의 예언적 맥락상 직접적인 신적 발화로 보아야 하므로, 구체적 보호 약속과 심판 맥락의 긴장을 그대로 유지했습니다.
  doctrine_reference: 예언서의 직접 화법과 신적 연설의 문맥 유지
