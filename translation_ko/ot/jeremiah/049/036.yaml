id: JER.49.36
reference: Jeremiah 49:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֵבֵאתִ֨י אֶל עֵילָ֜ם אַרְבַּ֣ע רוּח֗וֹת מֵֽ/אַרְבַּע֙ קְצ֣וֹת הַ/שָּׁמַ֔יִם וְ/זֵ֣רִתִ֔י/ם לְ/כֹ֖ל הָ/רֻח֣וֹת הָ/אֵ֑לֶּה וְ/לֹֽא יִהְיֶ֣ה הַ/גּ֔וֹי אֲשֶׁ֛ר לֹֽא יָב֥וֹא שָׁ֖ם נִדְּחֵ֥י עולם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/036.yaml
  text: I will bring against Elam the four winds from the four ends of the heavens[a], and I will scatter them to all these winds[b]. There will be no nation to which the outcasts of Elam will not go.
  footnotes:
  - marker: a
    text: Or 'from the four corners of heaven.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the dispersed of Elam' or 'the banished of Elam.'
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 엘람에 하늘의 네 모퉁이에서 네 바람을 불러오고, 그들을 이 모든 바람으로 흩을 것이다. 엘람의 쫓겨난 자들이 가지 않는 나라가 없을 것이다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘의 네 모퉁이에서’입니다.
    reason: source_note
  - marker: b
    text: ‘쫓겨난 자들’은 ‘흩어진 자들’ 또는 ‘내쫓긴 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבֵאתִי אֶל
  english_pob_choice: I will bring against
  chosen_korean: 내가 …에 불러오고
  alternatives_korean:
  - 내가 …에 대하여 데려오고
  - 내가 …에 가져오고
  lexicon: HALOT
  rationale: 히필의 ‘가져오다/데려오다’에다 심판 문맥의 방향성을 살려 한국어로는 ‘불러오다’로 자연스럽게 옮겼습니다. ‘대하여’는 호전성을 더 분명히 하지만 원문보다 해석적입니다.
- source_word: אַרְבַּע רוּחוֹת / קְצוֹת הַשָּׁמַיִם
  english_pob_choice: the four winds from the four ends of the heavens
  chosen_korean: 하늘의 네 모퉁이에서 네 바람
  alternatives_korean:
  - 하늘의 네 끝에서 네 바람
  - 하늘의 네 귀퉁이에서 네 바람
  lexicon: HALOT
  rationale: ‘네 바람’과 ‘하늘의 끝/모퉁이’의 병행을 살려 방향성 이미지를 유지했습니다. ‘모퉁이’는 영어 POB의 ‘corners’와도 잘 맞는 한국어입니다.
- source_word: וְזֵרִתִים
  english_pob_choice: and I will scatter them
  chosen_korean: 그들을 … 흩을 것이다
  alternatives_korean:
  - 그들을 … 분산시킬 것이다
  - 그들을 … 까부를 것이다
  lexicon: HALOT
  rationale: זרה는 심판 맥락에서 흩어짐/분산을 뜻하므로 가장 자연스럽고 직관적인 ‘흩다’를 택했습니다. ‘까부르다’는 타작 이미지가 강해 직설적이지만 현대어 문맥에서는 다소 거칠 수 있습니다.
- source_word: נִדְּחֵי עֵילָם
  english_pob_choice: the outcasts of Elam
  chosen_korean: 엘람의 쫓겨난 자들
  alternatives_korean:
  - 엘람의 유배된 자들
  - 엘람의 흩어진 자들
  - 엘람의 내쫓긴 자들
  lexicon: HALOT
  rationale: נדחי는 밀려나고 쫓겨난 사람들을 가리키므로 ‘쫓겨난 자들’이 가장 직접적입니다. ‘유배된’은 역사적 맥락을 덧씌울 수 있어 피했습니다.
theological_decisions:
- issue: 문맥상 심판의 주체성과 방향성
  chosen_reading: 여호와께서 엘람을 향해 심판의 바람을 불러오시는 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 자연현상 묘사로 읽기
  - ‘불러오고’를 중립적 이동으로 약화시키기
  rationale: 예언 문맥 전체가 징계 선언이므로, 동사 선택에서 하나님의 주도적 심판 행위를 드러내야 합니다. ‘불러오다’는 원문의 이동 의미를 유지하면서도 심판의 방향성을 보존합니다.
  doctrine_reference: 예언서의 심판 신탁
- issue: ‘네 바람’과 ‘흩다’의 상호작용
  chosen_reading: 바람은 방향을 가리키는 동시에 분산의 수단이 되는 시적 표현으로 유지했습니다.
  alternative_readings:
  - ‘바람’을 ‘영들’로 해석하기
  - ‘방향들’로 완전히 풀어쓰기
  rationale: 원문은 기상적 이미지와 방향성 이미지를 함께 사용하므로, 둘 중 하나로 환원하지 않고 시적 긴장을 보존했습니다.
  doctrine_reference: 히브리어 시적 병행법
