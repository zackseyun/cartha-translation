revisions:
- from: “내가 엘람에 하늘의 네 모퉁이에서 네 바람을 불러오고, 그들을 이 모든 바람으로 흩을 것이다. 엘람의 쫓겨난 자들이 가지 않는 나라가 없을 것이다.”[a][b]
  to: “내가 엘람을 향하여 하늘의 네 끝에서 네 바람을 가져오고,[a] 그들을 이 모든 바람이 부는 방향으로 흩어 버리겠다. 엘람의 쫓겨난 자들이[b] 이르지 않을 나라는 없을 것이다.”
  rationale: 원문의 심판 방향성(אֶל)과 ‘가져오다’의 의미를 보존하도록 첫 절을 고쳤습니다. קְצוֹת는 본문에서 ‘끝’으로 번역하고 ‘모퉁이’는 유효한 대안으로 각주에 옮겼습니다. 바람과 사방으로의 흩어짐이라는 비유를 유지하면서 한국어 문장 관계를 명료하게 다듬었습니다. 이 수정은 영어 POB의 ‘against,’ ‘ends,’ ‘all these winds,’ 및 ‘outcasts’와도 일치합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:26:08Z'
review_pass:
  verdict: revise
  source_fidelity: ‘엘람에’는 אֶל의 적대적 방향성을 충분히 드러내지 못하고, ‘불러오다’는 원문에 없는 소환의 뉘앙스를 더합니다. 또한 본문의 קְצוֹת는 우선 ‘끝’으로 옮기는 편이 정확하며, 기존 각주 a는 본문과 같은 표현을 ‘직역’이라고 하여 기능하지 않습니다. ‘이 모든 바람으로 흩을’도 현대 한국어에서 다소 부자연스럽고 방향성 관계가 불분명합니다.
  naturalness: ‘엘람을 향하여’, ‘하늘의 네 끝에서’, ‘이 모든 바람이 부는 방향으로 흩어 버리겠다’는 현대적이면서도 예언 선포에 어울리는 합쇼체입니다. 마지막 절은 ‘이르지 않을 나라는 없을 것이다’로 자연스럽게 전체적 흩어짐을 표현합니다.
  terminology: 고유명사 ‘엘람’, 심판 맥락의 ‘네 바람’, נִדְּחֵי의 ‘쫓겨난 자들’을 유지합니다. ‘바람이 부는 방향’은 רוּחוֹת의 바람 이미지와 문맥상의 사방/방향 의미를 함께 보존하는 최소한의 명시화입니다.
  issues:
  - severity: medium
    issue: ‘엘람에 … 네 바람을 불러오고’
    rationale: אֶל은 이 심판 문맥에서 엘람을 향한 방향성을 나타냅니다. ‘에’는 단순 도착지처럼 들리며, ‘불러오다’는 ‘가져오다’보다 소환의 의미를 첨가합니다.
  - severity: medium
    issue: ‘하늘의 네 모퉁이’ 및 각주 a
    rationale: קְצוֹת의 기본 뜻은 ‘끝/극점’입니다. ‘모퉁이’는 가능한 대안이지만 본문 기본 번역으로는 ‘끝’이 더 가깝습니다. 기존 각주 a는 본문과 동일한 문구를 반복해 대안 각주 역할을 하지 못합니다.
  - severity: low
    issue: ‘그들을 이 모든 바람으로 흩을 것이다’
    rationale: 한국어의 ‘바람으로 흩다’는 바람을 수단으로 읽게 하며 ‘모든 바람/방향으로’라는 분산의 목적·방향 관계가 불명확합니다.
