revisions:
- from: 그러므로[a] 보십시오, 야훼의 말씀입니다. 한 날들이 올 것이니, 내가 암몬 자손의 라빠에 전쟁의 함성을 들리게 하겠습니다. 그 성은 황폐한 언덕더미가 되고, 그 딸 성읍들은 불에 타 버릴 것입니다. 그때 이스라엘이 자기 것을 빼앗았던 자들을 빼앗을 것입니다[c][b]. 야훼의 말입니다.
