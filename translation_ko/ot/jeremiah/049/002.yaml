id: JER.49.2
reference: Jeremiah 49:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֡ן הִנֵּה֩ יָמִ֨ים בָּאִ֜ים נְאֻם יְהוָ֗ה וְ֠/הִשְׁמַעְתִּי אֶל רַבַּ֨ת בְּנֵי עַמּ֜וֹן תְּרוּעַ֣ת מִלְחָמָ֗ה וְ/הָֽיְתָה֙ לְ/תֵ֣ל שְׁמָמָ֔ה וּ/בְנֹתֶ֖י/הָ בָּ/אֵ֣שׁ תִּצַּ֑תְנָה וְ/יָרַ֧שׁ יִשְׂרָאֵ֛ל אֶת יֹרְשָׁ֖י/ו אָמַ֥ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/002.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when I will cause the battle cry to be heard against Rabbah of the Ammonites, and it will become a desolate mound, and its daughter towns will be set on fire. Then Israel will dispossess those who dispossessed him[c][b], says Yahweh.
  footnotes:
  - marker: a
    text: Or 'the shout of war' or 'the alarm of war.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'its daughters,' an idiom for the smaller towns or villages dependent on a main city.
    reason: cultural_note
  - marker: c
    text: 'The Hebrew uses a wordplay on the same verb: Israel will ''dispossess'' those who had ''dispossessed'' him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 보십시오, 야훼의 말씀입니다. 한 날들이 올 것이니, 내가 암몬 자손의 라빠에 전쟁의 함성을 들리게 하겠습니다. 그 성은 황폐한 언덕더미가 되고, 그 딸 성읍들은 불에 타 버릴 것입니다. 그때 이스라엘이 자기 것을 빼앗았던 자들을 빼앗을 것입니다[c][b]. 야훼의 말입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전쟁의 함성’이나 ‘전쟁의 경보’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그의 딸들’은 मुख्य 성읍에 종속된 작은 성읍이나 마을을 가리키는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 같은 어근을 반복해, 이스라엘이 자신을 빼앗았던 자들을 ‘빼앗는다’는 역전의 말놀이를 만듭니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그런 까닭에
  lexicon: HALOT
  rationale: 앞 절의 심판 선언에서 이어지는 인과·추론 관계를 분명히 살리기 위해 ‘그러므로’를 선택했습니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 한 날들이 올 것이니
  alternatives_korean:
  - 날들이 오고 있으니
  - 앞으로 날들이 올 것이니
  lexicon: HALOT
  rationale: 예언적 상투어의 미래 도래성을 살리면서 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: תְּרוּעַת מִלְחָמָה
  english_pob_choice: the battle cry
  chosen_korean: 전쟁의 함성
  alternatives_korean:
  - 전쟁의 외침
  - 전쟁의 경보
  lexicon: HALOT
  rationale: 군사적 소리라는 핵심을 유지하되, 한국어에서 가장 직관적인 표현인 ‘함성’을 택했습니다.
- source_word: לְתֵל שְׁמָמָה
  english_pob_choice: a desolate mound
  chosen_korean: 황폐한 언덕더미
  alternatives_korean:
  - 황폐한 폐허더미
  - 황무한 무더기
  lexicon: HALOT
  rationale: תֵל의 ‘언덕/유적 더미’ 이미지를 살리면서, 문맥상 완전한 파괴를 드러내는 ‘황폐한’으로 옮겼습니다.
- source_word: וְיָרַשׁ יִשְׂרָאֵל אֶת יֹרְשָׁיו
  english_pob_choice: Then Israel will dispossess those who dispossessed him
  chosen_korean: 그때 이스라엘이 자기 것을 빼앗았던 자들을 빼앗을 것입니다
  alternatives_korean:
  - 그때 이스라엘이 자신을 차지했던 자들을 차지할 것입니다
  - 그때 이스라엘이 자기의 소유를 빼앗은 자들을 빼앗을 것입니다
  lexicon: HALOT
  rationale: 같은 어근의 반복이 만드는 역전의 말놀이를 한국어에서도 살리기 위해 두 번 모두 ‘빼앗다’로 대응했습니다.
theological_decisions:
- issue: 야훼의 직접 발화 공식(נְאֻם יְהוָה / אָמַר יְהוָה)
  chosen_reading: 앞뒤 모두 ‘야훼의 말씀입니다’ / ‘야훼의 말입니다’로 번역해 예언 선포의 권위를 살렸습니다.
  alternative_readings:
  - ‘여호와의 말씀입니다’
  - ‘주께서 말씀하십니다’
  rationale: 본문이 하나님의 직접 선언 형식을 두 번 사용하므로, 한국어에서도 반복을 유지해 구약 예언문의 공적 선포성을 분명히 했습니다.
  doctrine_reference: POB divine-name convention
