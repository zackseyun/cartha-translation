id: JER.49.4
reference: Jeremiah 49:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תִּתְהַֽלְלִי֙ בָּֽ/עֲמָקִ֔ים זָ֣ב עִמְקֵ֔/ךְ הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה הַ/בֹּֽטְחָה֙ בְּ/אֹ֣צְרֹתֶ֔י/הָ מִ֖י יָב֥וֹא אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/004.yaml
  text: Why do you boast in the valleys[a], your valley flowing away, O faithless daughter, who trusts in her treasures, saying, ‘Who will come against me?’
  footnotes:
  - marker: a
    text: Or 'your valley flowing with water,' 'your overflowing valley,' or 'your fertile valley.' The Hebrew phrase is difficult and may refer to the natural richness or defensibility of the valley.
    reason: lexical_alternative
translation:
  language: ko
  text: 왜 너는 골짜기들에서 자랑합니까? 네 골짜기는 흘러가 버리는데, 믿음 없는 딸아, 자기 보물들을 의지하며 “누가 내게로 오겠느냐?” 하고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 구절은 어렵습니다. ‘네 골짜기는 물이 흐르는 골짜기’, ‘네 넘쳐흐르는 골짜기’, ‘네 비옥한 골짜기’로도 옮길 수 있습니다. 이 표현은 지형의 비옥함이나 방어력을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְהַֽלְלִי
  english_pob_choice: do you boast
  chosen_korean: 자랑합니까
  alternatives_korean:
  - 스스로를 뽐냅니까
  - 스스로를 자랑합니까
  - 자기를 뽐냅니까
  lexicon: HALOT
  rationale: 히트파엘형의 자기 과시·자기 자랑의 뉘앙스를 현대 한국어의 ‘자랑하다’로 자연스럽게 살렸습니다.
- source_word: בָּעֲמָקִים
  english_pob_choice: in the valleys
  chosen_korean: 골짜기들에서
  alternatives_korean:
  - 골짜기들 안에서
  - 계곡들에서
  lexicon: HALOT
  rationale: 지리적 이미지를 구체적으로 유지하기 위해 복수형 ‘골짜기들’을 직역에 가깝게 옮겼습니다.
- source_word: זָב עִמְקֵךְ
  english_pob_choice: your valley flowing away
  chosen_korean: 네 골짜기는 흘러가 버리는데
  alternatives_korean:
  - 네 골짜기는 물이 흐르고 있는데
  - 네 골짜기는 넘쳐흐르는데
  - 네 골짜기는 비옥한데
  lexicon: HALOT
  rationale: 어려운 히브리어 구절의 흐름 이미지를 보존하면서, 조롱의 문맥에 맞도록 ‘흘러가 버리다’로 옮겼습니다. 다만 원문은 풍요나 수세의 암시로도 읽힐 수 있습니다.
- source_word: הַ/בַּ֖ת הַ/שּֽׁוֹבֵבָ֑ה
  english_pob_choice: O faithless daughter
  chosen_korean: 믿음 없는 딸아
  alternatives_korean:
  - 배교한 딸아
  - 반역하는 딸아
  - 되돌아선 딸아
  lexicon: HALOT
  rationale: נשים/도시를 ‘딸’로 부르는 예언자적 호칭을 살리면서, שׁוֹבֵבָה의 언약적 불충실성을 한국어의 ‘믿음 없는’으로 자연스럽게 표현했습니다.
- source_word: הַ/בֹּֽטְחָה֙ בְּ/אֹ֣צְרֹתֶ֔י/הָ
  english_pob_choice: who trusts in her treasures
  chosen_korean: 자기 보물들을 의지하며
  alternatives_korean:
  - 자기 곳간들을 의지하며
  - 자기 재물을 의지하며
  - 자기 창고들을 의지하며
  lexicon: HALOT
  rationale: אֹצָר의 의미 범위는 보물·창고·저장고까지 넓지만, 여기서는 허세 섞인 안전감의 대상이 되는 ‘보물들’이 가장 자연스럽습니다.
- source_word: מִ֖י יָב֥וֹא אֵלָֽ/י־
  english_pob_choice: Who will come against me?
  chosen_korean: 누가 내게로 오겠느냐?
  alternatives_korean:
  - 누가 내게 맞서 오겠느냐?
  - 누가 나를 치러 오겠느냐?
  - 누가 내게로 올 수 있겠느냐?
  lexicon: HALOT
  rationale: אֶל은 문자상 ‘~에게/로’이지만, 자만의 도전문맥에서는 적대적 접근을 뜻하므로 한국어도 그 뉘앙스를 살리되, 짧고 도발적인 질문형으로 유지했습니다.
theological_decisions:
- issue: 의인화된 여성 단수 호칭 유지
  chosen_reading: 도시/민족을 ‘딸’로 부르는 예언자적 수사와 여성 단수 대명사(‘네’, ‘자기 보물들’)를 그대로 유지했습니다.
  alternative_readings:
  - 중성적으로 ‘믿음 없는 백성’으로 바꾸기
  - 여성 호칭을 제거하고 단순한 집합명사로 번역하기
  rationale: 히브리어 본문이 직접 지닌 수사적 장치를 보존해야 예언의 조롱과 책망이 약화되지 않습니다.
  doctrine_reference: Translation philosophy §4 (gender-accurate over gender-neutral)
