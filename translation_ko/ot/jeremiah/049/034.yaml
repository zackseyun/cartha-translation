  text: 'The word of Yahweh that came to Jeremiah the prophet concerning Elam[a], at the beginning of the reign of Zedekiah king of Judah, saying:'
  footnotes:
  - marker: a
    text: Or 'against Elam.' The Hebrew preposition can introduce an oracle directed toward a nation and may be rendered either 'concerning' or 'against' depending on context.
    reason: alternative_reading
translation:
  language: ko
  text: 「야훼의 말씀이 유다 왕 시드기야의 통치가 시작될 때에 예언자 예레미야에게 임하여, 엘람에 관하여 말씀하셨습니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘람을 향하여’. 히브리어 전치사는 국가를 향한 신탁에서 ‘관하여’ 또는 ‘대하여’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: דְבַר יְהוָה
