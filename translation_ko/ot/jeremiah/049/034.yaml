  lexicon: HALOT
  rationale: הַנָּבִיא를 직역한 '예언자'를 사용해 호칭을 분명히 했고, 수신 대상을 한국어 어순에 맞게 자연스럽게 배치했습니다.
- source_word: אֶל עֵילָם
  english_pob_choice: concerning Elam
  chosen_korean: 엘람에 관하여
  alternatives_korean:
  - 엘람에 대하여
  - 엘람을 향하여
  lexicon: HALOT
  rationale: 국가를 향한 신탁 서문에서 אֶל은 '관하여' 또는 '대하여'로도 옮길 수 있어, POB의 신중한 선택을 따라 중립적인 '관하여'를 택했습니다.
