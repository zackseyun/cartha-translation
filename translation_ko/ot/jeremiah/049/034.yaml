translation:
  language: ko
  text: '유다 왕 시드기야의 통치 초기, 엘람에 관하여 예언자 예레미야에게 임한 야훼의 말씀입니다.[a] 야훼께서 이렇게 말씀하셨습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘람을 향하여’ 또는 ‘엘람을 치는’. 히브리어 전치사는 나라를 대상으로 한 신탁의 표제에서 ‘관하여’로도, 적대적 방향을 나타내는 말로도 옮길 수 있습니다.
    reason: alternative_reading
