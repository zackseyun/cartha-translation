  lexicon: HALOT
  rationale: 예언 서문의 관용구인 דְבַר־יְהוָה를 한국어 성경 문체에 맞게 '말씀'으로 옮겨, 신탁의 권위를 살렸습니다.
- source_word: הָיָה
