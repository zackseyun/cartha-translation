base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/006.yaml
  text: But afterward I will restore the fortunes of the people of Ammon[a], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'restore the captivity of the people of Ammon.' The Hebrew idiom can refer to reversal of captivity or, more broadly, restoration of fortunes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 뒤에 내가 암몬 자손의 운명을 회복시킬 것입니다[a]. 야훼의 말씀이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘암몬 자손의 포로 됨을 회복시킬 것이다.’ 히브리어 관용구는 포로 상태의 반전이나 더 넓게는 형편의 회복을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחֲרֵי כֵן
  english_pob_choice: But afterward
  chosen_korean: 그러나 그 뒤에
  alternatives_korean:
  - 그리고 그 뒤에
  - 그 후에
  lexicon: HALOT
  rationale: 앞선 심판 맥락에서 전환되는 대조를 살리기 위해 앞의 접속 감각은 ‘그러나’로, 시간 순서는 ‘그 뒤에’로 옮겼습니다.
- source_word: אָשִׁיב אֶת שְׁב֥וּת
  english_pob_choice: I will restore the fortunes
  chosen_korean: 운명을 회복시킬 것입니다
  alternatives_korean:
  - 포로 됨을 회복시킬 것입니다
  - 포로 생활을 돌이킬 것입니다
  - 형편을 회복시킬 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 귀환보다 더 넓은 ‘회복’의 뜻을 가지므로, 현대 한국어에서 자연스럽고 의미를 보존하는 ‘운명을 회복하다’를 택했습니다. 필요시 문자적으로는 ‘포로 됨’을 생각할 수 있지만 본문은 그보다 넓습니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the people of Ammon
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  - 암몬의 아들들
  lexicon: HALOT
  rationale: 직역 구조를 살리되 한국어 성서 문맥에서 자연스러운 집단 명칭으로 옮겼습니다. ‘암몬 자손’은 원문의 종족적 표현을 비교적 직접적으로 반영합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼께서 선언하십니다
  - 야훼께서 말씀하십니다
  - 야훼의 말씀이옵니다
  lexicon: HALOT
  rationale: 예언자적 선포 공식은 한국어에서 ‘말씀’ 표현이 가장 안정적이며, 문체를 합쇼체로 맞추어 ‘말씀이십니다’로 처리했습니다. 본문은 신적 발화의 종결 공식을 분명히 유지합니다.
theological_decisions:
- issue: 회복 약속의 범위
  chosen_reading: 본문이 말하는 미래의 회복 약속을 그대로 유지하고, 그 방식이나 범위를 더 좁히지 않았습니다.
  alternative_readings:
  - 순전히 정치적 회복으로 한정
  - 영적 의미로만 재해석
  rationale: 히브리어는 암몬 자손에 대한 회복을 선언하지만 그 구체적 형식을 규정하지 않으므로, 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 번역은 본문의 범위를 넘어 해석을 닫지 말아야 합니다.
