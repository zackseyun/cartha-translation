review_pass:
  verdict: revise
  source_fidelity: 주문의 ‘암몬 자손의 운명을 회복시키다’는 שׁוּב/הֵשִׁיב אֶת־שְׁבוּת의 회복 관용구를 대체로 반영하지만, ‘운명’은 한국어에서 정해진 숙명이라는 뜻이 강하여 원문의 포로 상태 및 전반적 형편의 회복이라는 범위를 충분히 전달하지 못합니다. ‘암몬 백성’은 בְּנֵי עַמּוֹן의 집단적 민족 지시를 자연스럽게 반영합니다.
  naturalness: ‘암몬 백성의 형편을 회복시키다’가 현대 표준 한국어에서 자연스럽고, 미래 약속 및 합쇼체 문체도 유지합니다. 예언자적 종결 공식은 ‘야훼의 말씀입니다’로 간결하고 자연스럽게 옮길 수 있습니다.
  terminology: 하나님의 이름은 제공된 영어 POB의 ‘Yahweh’에 맞추어 ‘야훼’로 유지했습니다. ‘형편의 회복’은 포로 귀환에만 한정하지 않으면서 שְׁבוּת 관용구의 넓은 회복 의미를 보존합니다. 각주의 대안은 포로 생활이라는 전통적·문자적 이해 가능성을 남깁니다.
  issues:
  - severity: medium
    issue: ‘운명을 회복시키다’
    rationale: ‘운명’은 보통 숙명 또는 삶의 정해진 방향을 뜻하므로, 재산·안녕·처지의 회복을 포함할 수 있는 히브리어 관용구의 의미와 자연스러운 한국어 용례에 맞지 않습니다.
  - severity: low
    issue: 각주의 ‘포로 됨을 회복시킬 것이다’
    rationale: 한국어에서는 포로 상태 자체를 다시 회복시킨다는 뜻으로도 읽힐 수 있어, 관용구의 문자적 대안을 설명하는 표현으로 부정확하거나 어색합니다. ‘포로 생활을 회복시켜 줄 것이다’와 이어지는 관용구 설명이 더 명료합니다.
  revised_text: 그러나 그 뒤에 내가 암몬 백성의 형편을 회복시킬 것입니다. 야훼의 말씀입니다.
  revised_footnotes:
  - marker: a
    text: 또는 ‘암몬 백성의 포로 생활을 회복시켜 줄 것이다.’ 히브리어 관용구는 포로 상태의 반전이나, 더 넓게는 형편의 회복을 가리킬 수 있습니다.
    reason: lexical_alternative
  revision_rationale: 주문의 ‘형편을 회복시키다’는 히브리어 회복 관용구를 현대 한국어로 자연스럽게 옮기며, 실제 포로 귀환만을 뜻한다고 범위를 좁히지 않습니다. ‘암몬 백성’은 원문의 민족 집단을 분명히 합니다. 원문의 ‘그 뒤에’와 앞선 심판으로부터의 전환을 나타내는 ‘그러나’, 미래 1인칭 약속, 그리고 야훼의 선언 공식도 모두 유지했습니다.
