id: JER.49.10
reference: Jeremiah 49:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי אֲנִ֞י חָשַׂ֣פְתִּי אֶת עֵשָׂ֗ו גִּלֵּ֨יתִי֙ אֶת מִסְתָּרָ֔י/ו וְ/נֶחְבָּ֖ה לֹ֣א יוּכָ֑ל שֻׁדַּ֥ד זַרְע֛/וֹ וְ/אֶחָ֥י/ו וּ/שְׁכֵנָ֖י/ו וְ/אֵינֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/010.yaml
  text: For I have stripped Esau bare[a]; I have uncovered his hiding places, and he will not be able to hide himself. His offspring, his brothers, and his neighbors are destroyed[b], and he is no more.
  footnotes:
  - marker: a
    text: Hebrew 'Esau,' used here for the nation descended from Esau, that is, Edom.
    reason: cross_reference
  - marker: b
    text: Or 'is plundered' / 'is devastated' for 'is destroyed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 에서를 벌거벗기고[a] 그의 은신처들을 드러냈기 때문입니다. 그는 숨을 수 없을 것입니다. 그의 자손과 형제들과 이웃들은 멸망하였고[b], 그는 더 이상 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에서’는 여기서 에돔 민족을 가리키는 이름으로 쓰였습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘약탈되었다’, ‘황폐해졌다’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָשַׂפְתִּי
  english_pob_choice: have stripped ... bare
  chosen_korean: 벌거벗기고
  alternatives_korean:
  - 벗겨내고
  - 드러내고
  lexicon: HALOT
  rationale: 노출과 수치의 이미지를 함께 살리기 위해 단순히 ‘드러내다’보다 ‘벌거벗기다’가 원문의 강한 노출성을 더 잘 전달합니다.
- source_word: עֵשָׂו
  english_pob_choice: Esau
  chosen_korean: 에서
  alternatives_korean:
  - 에돔
  lexicon: HALOT
  rationale: 히브리어 원문이 인명 ‘에서’를 사용하므로 이를 그대로 옮기되, 나라를 가리키는 메타포라는 의미는 문맥이 드러내게 합니다.
- source_word: מִסְתָּרָיו
  english_pob_choice: his hiding places
  chosen_korean: 그의 은밀한 곳들
  alternatives_korean:
  - 그의 숨는 곳들
  - 그의 은신처들
  lexicon: HALOT
  rationale: 단순한 추상적 ‘비밀’보다 장소성을 가진 ‘은밀한 곳들’이 원문의 공간적 감각과 ‘드러내다’와의 대비를 살립니다.
- source_word: שֻׁדַּד
  english_pob_choice: is destroyed
  chosen_korean: 멸망하였고
  alternatives_korean:
  - 약탈되었고
  - 황폐해졌고
  - 파괴되었고
  lexicon: HALOT
  rationale: 영어 POB가 ‘destroyed’를 택했으므로, 열거된 대상 전체에 미치는 심판의 총체성을 한국어에서도 ‘멸망’으로 강하게 드러냅니다.
theological_decisions:
- issue: ‘에서’의 지시 대상
  chosen_reading: 인명 ‘에서’를 그대로 유지하여 에돔을 가리키는 예언적 용법을 문맥으로 읽게 했습니다.
  alternative_readings:
  - 의미를 풀어 ‘에돔’으로 번역
  rationale: 원문은 분명히 אישי명 ‘에서’를 쓰며, 본절의 예언적 표지는 그 이름을 보존할 때 더 잘 드러납니다.
  doctrine_reference: 원어 우선 원칙; 고유명사 음역 보존
- issue: 마지막 절의 복수 주어와 동사 관계
  chosen_reading: ‘그의 자손과 그의 형제들과 그의 이웃들이 멸망하였고’로 묶어 집합적으로 번역했습니다.
  alternative_readings:
  - ‘그의 자손은 멸망하였고, 그의 형제들과 그의 이웃들도 …’
  - ‘그의 자손, 그의 형제들, 그의 이웃들이 약탈당하였고’
  rationale: 히브리어의 열거 구조가 한 번의 파멸 진술을 여러 관계 범주에 걸쳐 적용하므로, 한국어에서도 한 덩어리로 받쳐 총체적 멸망을 살리는 편이 자연스럽습니다.
  doctrine_reference: 본문 수사 구조 보존
