  terminology: ‘에서’는 원문 인명을 보존하며, 각주로 에돔을 가리키는 용법을 설명하는 것이 적절합니다. ‘벌거벗기다’는 חָשַׂפְתִּי의 강한 노출 이미지를 유지합니다. שֻׁדַּד에는 ‘멸망하다’를 유지하되, 대안 역어를 각주에 남깁니다.
