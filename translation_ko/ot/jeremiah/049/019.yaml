  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
  footnotes:
  - marker: a
    text: Or 'from the pride/majesty of the Jordan,' a Hebrew idiom likely referring to the dense growth along the Jordan.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''who will appoint a time for me?'' with a possible legal sense: ''who will summon/arraign me?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 마치 사자처럼 그는 요단의 우거진 숲[a]에서 안전한 목초지로 올라올 것입니다. 내가 순식간에 그를 거기서 달아나게 하겠고, 내가 그 위에 택한 이를 임명하겠습니다. 나와 같은 이가 누구입니까? 나를 소환할[b] 이가 누구입니까? 내 앞에 설 수 있는 목자는 누구입니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단의 자랑/위엄에서’. 히브리어 관용구로, 요단 강가의 울창한 식생을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘나를 위해 기한을 정할 이가 누구입니까?’ 곧 ‘나를 소환하거나 고소할 이가 누구입니까?’라는 법정적 의미일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
