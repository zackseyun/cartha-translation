id: JER.49.19
reference: Jeremiah 49:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤יעָה אֲרִיצֶ֨/נּוּ מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יֹעִידֶ֔/נִּי וּ/מִי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/019.yaml
  text: Look[a], like a lion he will come up from the thicket of the Jordan against a secure pasture; for in an instant I will make him run from it, and I will appoint over it whomever is chosen. For who is like me[b], and who will summon me? And who is the shepherd who can stand before me?
  footnotes:
  - marker: a
    text: Or 'from the pride/majesty of the Jordan,' a Hebrew idiom likely referring to the dense growth along the Jordan.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''who will appoint a time for me?'' with a possible legal sense: ''who will summon/arraign me?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오. 마치 사자처럼 그는 요단의 우거진 숲에서 안전한 목초지로 올라올 것입니다. 그러나 내가 순식간에 그를 거기서 달아나게 하겠고, 내가 그 위에 택한 이를 임명하겠습니다. 나와 같은 이가 누구입니까? 나를 소환할 이가 누구입니까? 내 앞에 설 수 있는 목자는 누구입니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘요단의 자랑/위엄에서’. 히브리어 관용구로, 요단 강가의 울창한 식생을 가리킬 가능성이 큽니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘나를 위해 기한을 정할 이가 누구입니까?’ 곧 ‘나를 소환/소송할 이가 누구입니까?’라는 법정적 의미일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  - 이것을 보십시오
  lexicon: HALOT
  rationale: 현대 한국어 합쇼체에서 즉각적인 주목을 유도하는 명령형으로, 경고·선언의 돌출성을 살리면서도 자연스럽게 읽힙니다.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  english_pob_choice: from the thicket of the Jordan
  chosen_korean: 요단의 우거진 숲에서
  alternatives_korean:
  - 요단의 자랑에서
  - 요단의 위엄에서
  - 요단의 덤불에서
  lexicon: HALOT
  rationale: 문맥상 사자가 숨어 있는 요단 강변의 빽빽한 식생을 가리키므로, 문자적이되 현대 독자가 이해 가능한 ‘우거진 숲’으로 옮겼습니다.
- source_word: נְוֵה אֵיתָן
  english_pob_choice: a secure pasture
  chosen_korean: 안전한 목초지
  alternatives_korean:
  - 견고한 목초지
  - 영속하는 거처
  - 견고한 거주지
  lexicon: HALOT
  rationale: נוה의 목초/거처 이미지를 살리면서 איתן의 ‘견고함, 안전성’을 반영해 목가적이면서도 방어된 장소로 표현했습니다.
- source_word: וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  english_pob_choice: and I will appoint over it whomever is chosen
  chosen_korean: 내가 그 위에 택한 이를 임명하겠습니다
  alternatives_korean:
  - 내가 그 위에 선택된 이를 세우겠습니다
  - 내가 그 위에 택한 자를 맡기겠습니다
  - 내가 그 위에 선택된 이를 नियुक्त하겠습니다
  lexicon: HALOT
  rationale: בחר의 ‘선택된 자’와 פקד의 ‘임명하다/맡기다’ 의미를 함께 살리되, 한국어 행정·위임 표현으로 압축했습니다.
- source_word: וּמִי יוֹעִידֶנִּי
  english_pob_choice: who will summon me
  chosen_korean: 나를 소환할 이가 누구입니까
  alternatives_korean:
  - 나를 소환하여 대질할 이가 누구입니까
  - 나를 기일에 불러낼 이가 누구입니까
  - 나를 심문할 이가 누구입니까
  lexicon: HALOT
  rationale: יעד의 소환·기일 지정·법정 호출의 뉘앙스를 반영해, 본문이 던지는 도전의 강도를 살리는 ‘소환하다’로 옮겼습니다.
- source_word: רֹעֶה
  english_pob_choice: the shepherd
  chosen_korean: 목자
  alternatives_korean:
  - 목동
  - 지도자
  - 통치자
  lexicon: HALOT
  rationale: 원뜻인 목자 이미지를 유지해야 뒤의 ‘내 앞에 설 수 있는’ 수사적 질문과 결합된 비유가 살아납니다.
theological_decisions:
- issue: 하나님의 절대적 도전 질문의 수사성
  chosen_reading: ‘나와 같은 이가 누구입니까? 나를 소환할 이가 누구입니까?’로 옮겨, 하나님을 재판관처럼 불러 세우려는 시도가 무력하다는 수사적 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 나와 같은 이가 누구겠습니까?
  - 누가 나를 고소하겠습니까?
  - 누가 나를 법정에 세우겠습니까?
  rationale: 히브리어의 מי ... וּמִי יוֹעִידֶנִּי는 단순 비교를 넘어 소환·법정적 도전을 내포하므로, 완곡하게 누그러뜨리지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 하나님의 유일성 및 심판 앞에서의 절대적 우월성에 대한 예언자적 수사
