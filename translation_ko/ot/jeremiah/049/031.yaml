source:
  edition: WLC
  text: ק֣וּמוּ עֲל֗וּ אֶל גּ֥וֹי שְׁלֵ֛יו יוֹשֵׁ֥ב לָ/בֶ֖טַח נְאֻם יְהוָ֑ה לֹא דְלָתַ֧יִם וְ/לֹֽא בְרִ֛יחַ ל֖/וֹ בָּדָ֥ד יִשְׁכֹּֽנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
  footnotes:
  - marker: a
    text: Or 'tranquil' or 'complacent' for 'at ease.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'no doors and no bar to it'; the sense is that they are unfortified and feel secure.
    reason: cultural_note
translation:
  language: ko
  text: 일어나, 태평하고 안전하게 사는 민족을 치러 올라가십시오. 야훼의 말씀입니다. 그 민족에게는 문도 없고 빗장도 없으며, 그들은 홀로 삽니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘태평하고’는 히브리어 שְׁלֵיו의 번역으로, ‘평온한’, ‘안일한’이라는 뉘앙스도 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그에게 문들이 없고 빗장이 없다’고 말합니다. 이는 그들이 방비 없이 안전하다고 여기는 상태를 가리킵니다.
    reason: cultural_note
