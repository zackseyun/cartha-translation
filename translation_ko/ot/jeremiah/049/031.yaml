base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/031.yaml
  text: Rise up[a], go up against a nation at ease, dwelling securely, declares Yahweh, that has no doors or bars[b]; they dwell alone.
  footnotes:
  - marker: a
    text: Or 'tranquil' or 'complacent' for 'at ease.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'no doors and no bar to it'; the sense is that they are unfortified and feel secure.
    reason: cultural_note
translation:
  language: ko
  text: 일어나 올라가서, 태평하고 안전하게 살며 문도 없고 빗장도 없는 민족을 치십시오. 야훼의 말씀이십니다. 그들은 홀로 거주합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘태평하다’는 כאן의 שְׁלֵיו에 대한 번역으로, ‘안일하다/평온하다’의 뉘앙스를 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘문도 없고 빗장도 없다’는 뜻으로, 방비되지 않은 상태를 가리킵니다.
    reason: cultural_note
