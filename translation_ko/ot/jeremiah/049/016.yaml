id: JER.49.16
reference: Jeremiah 49:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תִּֽפְלַצְתְּ/ךָ֞ הִשִּׁ֤יא אֹתָ/ךְ֙ זְד֣וֹן לִבֶּ֔/ךָ שֹֽׁכְנִי֙ בְּ/חַגְוֵ֣י הַ/סֶּ֔לַע תֹּפְשִׂ֖י מְר֣וֹם גִּבְעָ֑ה כִּֽי תַגְבִּ֤יהַ כַּ/נֶּ֨שֶׁר֙ קִנֶּ֔/ךָ מִ/שָּׁ֥ם אֽוֹרִידְ/ךָ֖ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/016.yaml
  text: The terror you inspire has deceived you[a], the arrogance of your heart— you who dwell in the clefts of the rock, who occupy the height of the hill. Though you make your nest as high as the eagle, from there I will bring you down[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'your terror' or 'your horror'; the Hebrew may refer either to the terror Edom inspires or to its dreadfulness/reputation.
    reason: lexical_alternative
  - marker: b
    text: Or 'the pride of your heart.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'in the clefts of the rock,' evoking Edom's seemingly impregnable mountain strongholds.
    reason: cultural_note
translation:
  language: ko
  text: 네가 일으킨 공포가 너를 속였고, 네 마음의 교만도 너를 속였도다 — 바위 틈에 거하며 산봉우리의 높은 곳을 차지하는 자여, 네가 독수리처럼 둥지를 높여도 거기서 내가 너를 끌어내리리라. 야훼의 말씀이니라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תִּפְלַצְתְּךָ는 ‘네 공포’ 또는 ‘네가 일으킨 공포’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 חַגְוֵי הַסֶּלַע는 문자적으로 ‘바위의 틈들’이며, 난공불락처럼 보이는 산성의 이미지를 불러일으킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: תִּפְלַצְתְּךָ
  english_pob_choice: the terror you inspire
  chosen_korean: 네가 일으킨 공포
  alternatives_korean:
  - 네 공포
  - 네가 불러일으킨 두려움
  lexicon: HALOT
  rationale: 문맥상 에돔의 ‘안에서의 공포’보다 타인에게 끼친 공포/위압이 스스로를 속이는 힘으로 작동하므로, 관계적 방향을 살려 옮겼습니다.
- source_word: הִשִּׁיא אֹתָךְ
  english_pob_choice: has deceived you
  chosen_korean: 너를 속였고
  alternatives_korean:
  - 너를 미혹했고
  - 너를 잘못 이끌었고
  lexicon: HALOT
  rationale: 히필형 נשׁא의 여기서의 의미는 단순한 안내가 아니라 속임/오도이므로, 가장 직접적인 ‘속였다’를 택했습니다.
- source_word: זְדוֹן לִבֶּךָ
  english_pob_choice: the arrogance of your heart
  chosen_korean: 네 마음의 교만
  alternatives_korean:
  - 네 마음의 자만
  - 네 마음의 오만
  lexicon: HALOT
  rationale: זָדוֹן의 핵심은 교만하고 무례한 자기확신이므로 ‘교만’이 적절하며, ‘마음의’로 히브리식 표현을 보존했습니다.
- source_word: שֹׁכְנִי בְּחַגְוֵי הַסֶּלַע / תֹּפְשִׂי מְרוֹם גִּבְעָה
  english_pob_choice: you who dwell in the clefts of the rock / who occupy the height of the hill
  chosen_korean: 바위 틈에 거하며 산봉우리의 높은 곳을 차지하는 자여
  alternatives_korean:
  - 바위 틈에 사는 자여, 언덕의 높은 곳을 차지하는 자여
  - 바위 갈라진 곳에 거하며 산의 높은 곳을 차지하는 자여
  lexicon: HALOT
  rationale: 거처의 안전함을 드러내는 ‘바위 틈’과 높은 요새 이미지를 함께 살리되, 한국어에서는 호칭형 구조로 자연스럽게 정리했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼의 말씀이니라
  lexicon: HALOT
  rationale: 예언 공식은 한국어 예언체에서 낯설지 않은 ‘말씀이니라’로 옮기고, 신명은 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 히브리어 יְהוָה를 음역해 언약적 고유명을 드러내되, 전통적 대체어로 희석하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 공격적·교만한 에돔의 자기안전 이미지
  chosen_reading: 지형적 요새감과 교만이 결합된 심판 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 심리적 두려움의 묘사
  - 추상적 교만 비판만을 강조하는 읽기
  rationale: 바위 틈, 산봉우리, 독수리 둥지는 에돔의 난공불락 같은 지형적 안전을 가리키므로, 그 역사적-예언적 긴장을 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Prophetic judgment and historical oracle context'
