  to: 네가 일으킨 공포가, 곧 네 마음의 교만이 너를 속였습니다. 바위 틈에 사는 자여[b], 언덕의 높은 곳을 차지하는 자여, 네가 독수리처럼 네 둥지를 높이 세운다 해도, 내가 거기에서 너를 끌어내리겠습니다. 야훼의 선언입니다.[a]
