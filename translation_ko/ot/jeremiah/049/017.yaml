id: JER.49.17
reference: Jeremiah 49:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיְתָ֥ה אֱד֖וֹם לְ/שַׁמָּ֑ה כֹּ֚ל עֹבֵ֣ר עָלֶ֔י/הָ יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽ/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/017.yaml
  text: Edom will become a desolation[b][a]; everyone who passes by her will be appalled and will whistle at all her wounds.
  footnotes:
  - marker: a
    text: Or 'a desolation' or 'an object of horror.' The Hebrew term includes both ruin and the appalled reaction it evokes.
    reason: lexical_alternative
  - marker: b
    text: Or 'will hiss.' The Hebrew verb denotes a sharp sound of astonishment or derision; 'whistle' is used here as the clearer modern English equivalent.
    reason: lexical_alternative
translation:
  language: ko
  text: 에돔은 황무지가 될 것입니다[a][b]. 그곳을 지나는 사람마다 그 광경에 놀라고, 그 모든 상처를 보고 휘파람을 불 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공포의 대상이 될 것입니다’. 히브리어는 황폐함과 그것이 불러일으키는 경악의 반응을 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘휘파람을 불다’보다 직역하면 ‘쉿 소리를 내다’입니다. 여기서는 현대 한국어에서 더 분명한 대응을 택했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה / לְשַׁמָּה
  english_pob_choice: will become a desolation
  chosen_korean: 황무지가 될 것입니다
  alternatives_korean:
  - 폐허가 될 것입니다
  - 황폐한 곳이 될 것입니다
  - 공포의 대상이 될 것입니다
  lexicon: HALOT
  rationale: לְשַׁמָּה는 단순한 ‘폐허’보다 황폐함과 비어 있음이 함께 드러나므로, 한국어로는 자연스럽고 직관적인 ‘황무지’가 적절합니다.
- source_word: כֹּל עֹבֵר עָלֶיהָ
  english_pob_choice: everyone who passes by her
  chosen_korean: 그곳을 지나는 사람마다
  alternatives_korean:
  - 그녀를 지나가는 모든 사람은
  - 지나가는 모든 이가
  - 그곳을 스쳐 가는 자마다
  lexicon: HALOT
  rationale: 히브리어의 여성형 접미사는 땅/도성을 가리키는 의인화이지만, 한국어에서는 ‘그곳’으로 풀어 자연스러운 의미를 살렸습니다.
- source_word: יִשֹּׁם
  english_pob_choice: will be appalled
  chosen_korean: 그 광경에 놀라고
  alternatives_korean:
  - 놀라게 될 것입니다
  - 충격을 받을 것입니다
  - 아연실색할 것입니다
  lexicon: HALOT
  rationale: 문맥상 멸망의 모습 앞에서의 경악을 뜻하므로, 현대 한국어에서 가장 직접적인 반응인 ‘놀라다’로 옮겼습니다.
- source_word: וְיִשְׁרֹק
  english_pob_choice: will whistle
  chosen_korean: 휘파람을 불 것입니다
  alternatives_korean:
  - 쉿 소리를 낼 것입니다
  - 야유할 것입니다
  - 휘파람을 불며 조롱할 것입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 놀람이나 조롱의 날카로운 소리를 가리키며, POB의 ‘whistle’을 따라 한국어의 표준적 대응인 ‘휘파람을 불다’로 옮겼습니다.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  english_pob_choice: at all her wounds
  chosen_korean: 그 모든 상처를 보고
  alternatives_korean:
  - 그 모든 상처를 향해
  - 그 모든 타격을 보고
  - 그 모든 재앙을 보고
  lexicon: HALOT
  rationale: מַכּוֹת는 문자적으로는 ‘때림/상처’이므로, 보이는 결과를 드러내는 ‘상처’가 적절합니다. 전치사 עַל은 여기서 반응의 계기를 나타내어 ‘보고’로 자연스럽게 풀었습니다.
