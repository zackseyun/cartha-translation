revisions:
- from: 에돔은 황무지가 될 것입니다[a][b]. 그곳을 지나는 사람마다 그 광경에 놀라고, 그 모든 상처를 보고 휘파람을 불 것입니다.
  to: 에돔은 폐허가 될 것입니다[a]. 그곳을 지나는 사람마다 그 모든 상처를 보고 놀라며 휘파람을 불 것입니다[b].
  rationale: 심판으로 인한 황폐를 더 정확히 나타내도록 ‘황무지’를 ‘폐허’로 고쳤습니다. 원문의 병렬적인 반응과 마지막 전치사구를 자연스럽게 반영하도록 문장을 재구성했으며, 휘파람 동사를 설명하는 각주 b를 해당 동사 뒤로 옮겼습니다.
