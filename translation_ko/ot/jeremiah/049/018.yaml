  rationale: 본문에 직접 יְהוָה가 나오므로 프로젝트 기본값에 따라 고유한 언약명 ‘야훼’를 본문에 반영했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: 인칭 시점과 성별 표지
  chosen_reading: 아무 남자도 ... 아무 인자도
