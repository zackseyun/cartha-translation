  rationale: 히브리어의 אישׁ과 בן־אדם이 가진 대표성/남성형 표지를 희석하지 않기 위해, 의미상 일반성을 유지하면서도 형식을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4; Anthropological terms
