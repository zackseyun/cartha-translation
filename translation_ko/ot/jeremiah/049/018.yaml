review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the comparative force of כְּמַהְפֵּכַת, the surrounding settlements, Yahweh’s prophetic speech formula, and the distinct habitation/sojourn verbs. However, ‘아무 남자’ makes the generic אִישׁ sound exclusively male in modern Korean, while ‘인자’ is an established Christological title in Korean and is unsuitable here for the ordinary idiom בֶּן־אָדָם. ‘뒤집힘을 당한’ is also unnatural Korean for a city’s catastrophic overthrow.
  naturalness: The proposed revision uses idiomatic modern formal-polite Korean. ‘뒤엎어진’ conveys the catastrophic overturning without the awkward nominal passive construction, and ‘아무도/어떤 사람도’ reads naturally in the desolation formula.
  terminology: ‘야훼’ appropriately renders יהוה under the supplied project convention. ‘사람’ for בֶּן־אָדָם avoids the misleading messianic resonance of ‘인자’; the footnote preserves the literal Hebrew form and explains its non-titular sense. The two negated clauses retain the source’s contrast between settled dwelling and temporary residence.
  issues:
  - severity: medium
    issue: ‘아무 남자’ for אִישׁ
    rationale: In this desolation formula אִישׁ is generic (‘a person/anyone’), not a restriction to male inhabitants. In contemporary Korean, ‘남자’ normally denotes an adult male and therefore narrows the sense.
  - severity: high
    issue: ‘아무 인자’ for בֶּן־אָדָם
    rationale: Although literally defensible at the morpheme level, ‘인자’ is a conventional Korean biblical title with strong messianic associations and is not natural for the generic human idiom in this context. It risks precisely the misunderstanding the footnote seeks to prevent.
  - severity: medium
    issue: ‘뒤집힘을 당한’ is unnatural
    rationale: This nominal passive expression is stilted and does not idiomatically describe the destruction of cities in modern Korean. ‘뒤엎어진’ retains the overturning image more naturally.
  - severity: low
    issue: Footnote anchors are placed only at the sentence end
    rationale: The lexical-alternative note should be attached to the overthrow phrase, and the בן־אדם explanation should be attached to its Korean rendering, so that each note has an unambiguous anchor.
  revised_text: 소돔과 고모라와 그 주변 마을들이 뒤엎어진 것처럼[a]—야훼께서 말씀하십니다—아무도 거기에 살지 못하고, 어떤 사람도[b] 그곳에 머물지 못할 것입니다.
