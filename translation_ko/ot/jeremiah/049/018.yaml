  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
  footnotes:
  - marker: a
    text: Or, 'Like the overthrow of Sodom and Gomorrah and the towns around them.'
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' here is a Hebrew idiom meaning a human being or mortal, not a messianic title.'
    reason: lexical_alternative
translation:
  language: ko
  text: 소돔과 고모라와 그 주변 마을들이 뒤엎어진 것처럼[a]—야훼께서 말씀하십니다—아무도 거기에 살지 못하고, 어떤 사람도[b] 그곳에 머물지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소돔과 고모라와 그 주변 마을들의 전복처럼’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘사람의 아들’입니다. 여기서는 메시아 칭호가 아니라 인간 또는 필멸자를 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  english_pob_choice: As when ... were overthrown
  chosen_korean: 뒤집힘을 당한 것처럼
  alternatives_korean:
