base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/018.yaml
  text: As when Sodom and Gomorrah and their neighboring towns were overthrown[a], says Yahweh, no man will dwell there[b], and no son of man will sojourn in her.
  footnotes:
  - marker: a
    text: Or, 'Like the overthrow of Sodom and Gomorrah and the towns around them.'
    reason: lexical_alternative
  - marker: b
    text: '''Son of man'' here is a Hebrew idiom meaning a human being or mortal, not a messianic title.'
    reason: lexical_alternative
translation:
  language: ko
  text: 소돔과 고모라와 그 주변 마을이 뒤집힘을 당한 것처럼—야훼께서 말씀하십니다—거기에는 아무 남자도 살지 못하고, 아무 인자도 그곳에 머물지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘소돔과 고모라와 그 주변의 도시들이 뒤집힘을 당한 것처럼’.
    reason: alternative_reading
  - marker: b
    text: ‘인자’는 여기서 메시아 칭호가 아니라 인간이나 필멸자를 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַהְפֵּכַת
  english_pob_choice: As when ... were overthrown
  chosen_korean: 뒤집힘을 당한 것처럼
  alternatives_korean:
  - 멸망한 것처럼
  - 전복된 것처럼
  - 뒤집어진 것처럼
  lexicon: HALOT
  rationale: מַהְפֵּכָה의 핵심은 catastrophic overturning/overthrow이므로, 현대 한국어에서 자연스럽고 의미를 선명하게 드러내는 ‘뒤집힘을 당하다’로 옮겼습니다.
- source_word: סְדֹם וַעֲמֹרָה וּשְׁכֵנֶיהָ
  english_pob_choice: Sodom and Gomorrah and their neighboring towns
  chosen_korean: 소돔과 고모라와 그 주변 마을
  alternatives_korean:
  - 소돔과 고모라와 그 이웃 마을들
  - 소돔과 고모라와 그 주변 도시들
  lexicon: HALOT
  rationale: 복수의 동반 정착지를 가리키는 뜻을 자연스러운 현대어로 풀어 ‘주변 마을’로 옮겼고, 인칭소유를 유지해 ‘그’로 연결했습니다.
- source_word: יֵשֵׁב / יָגוּר
  english_pob_choice: will dwell ... will sojourn
  chosen_korean: 살지 못하고 ... 머물지 못할 것입니다
  alternatives_korean:
  - 거주하지 못하고 ... 체류하지 못할 것입니다
  - 살지 못하고 ... 거주자로 지내지 못할 것입니다
  - 살지 못하고 ... 나그네로 머물지 못할 것입니다
  lexicon: HALOT
  rationale: יֵשֵׁב와 יָגוּר의 병렬을 한국어에서 과도하게 반복하지 않으면서도, 정주와 임시 거주의 두 겹의 의미를 ‘살다/머물다’로 구분했습니다.
- source_word: בֶּן אָדָם
  english_pob_choice: son of man
  chosen_korean: 아무 인자
  alternatives_korean:
  - 아무 사람
  - 아무 인간
  - 어떤 사람도
  lexicon: HALOT
  rationale: 문맥상 메시아 호칭이 아니라 인간 일반을 뜻하므로, 직역의 투명성을 살리되 관용적으로 읽히는 방식으로 ‘인자’를 유지했습니다.
theological_decisions:
