base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/008.yaml
  text: Flee[a], turn back, dwell deep, inhabitants of Dedan, for I have brought Esau’s calamity upon him[c][b], the time when I punish him.
  footnotes:
  - marker: a
    text: Or 'hide yourselves deep to dwell'; the Hebrew idiom conveys withdrawing to remote or inaccessible places.
    reason: lexical_alternative
  - marker: b
    text: '''Esau'' stands for Edom, Esau’s descendants.'
    reason: cultural_note
  - marker: c
    text: Or 'the time of my visitation upon him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 도망하십시오, 돌아서십시오, 깊은 곳에 거처를 정하십시오[a], 드단 주민들이여. 내가 에서의 재앙을 그에게 내렸으니[b], 내가 그를 벌할 때가 이르렀습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘깊이 숨어 거처를 정하십시오.’ 히브리어 관용구는 멀리 떨어져 있거나 접근하기 어려운 곳으로 물러가 사는 것을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘에서’는 에돔, 곧 에서의 후손들을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘내가 그를 찾아갈 때.’ 여기서 ‘찾아가다’는 심판을 위해 방문한다는 뜻입니다.
    reason: lexical_alternative
