  text: 도망치[a]고, 뒤로 물러가며, 깊숙이 거처를 삼으라, 데단[a]의 거류자들이여. 내가 에사[b]의 재앙을 그에게 가져왔기 때문이니, 내가 그를 심판할 때가 이르렀다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '깊이 숨어 거처를 삼으라'는 뜻으로, 히브리어 관용구는 멀리 혹은 접근하기 어려운 곳으로 물러감을 나타낸다.
    reason: alternative_reading
  - marker: b
    text: '''에사''는 에돔, 즉 에사의 후손들을 가리킨다.'
    reason: alternative_reading
  - marker: c
    text: 또는 '내가 그를 심판할 때'.
    reason: alternative_reading
