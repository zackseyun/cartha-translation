id: JER.49.29
reference: Jeremiah 49:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָהֳלֵי/הֶ֤ם וְ/צֹאנָ/ם֙ יִקָּ֔חוּ יְרִיעוֹתֵי/הֶ֧ם וְ/כָל כְּלֵי/הֶ֛ם וּ/גְמַלֵּי/הֶ֖ם יִשְׂא֣וּ לָ/הֶ֑ם וְ/קָרְא֧וּ עֲלֵי/הֶ֛ם מָג֖וֹר מִ/סָּבִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/029.yaml
  text: They will take their tents and their flocks; they will carry off their tent curtains and all their goods and their camels[a], and they will cry out against them, “Terror on every side!”
  footnotes:
  - marker: a
    text: Or, “they will call out against them, ‘Terror on every side!’” The Hebrew construction can be understood as a cry directed over, concerning, or against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 장막과 양 떼를 빼앗을 것입니다. 그들은 자기들의 장막 휘장과 모든 물품과 낙타들을 빼앗아 갈 것이며, 그들 위에 「사방에 두려움이 있습니다!」라고 외칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들에 대해 “사방에 두려움이 있습니다!”라고 외칠 것입니다.’ 히브리어 구문은 그들 위에, 그들에 관해, 또는 그들을 향해 외치는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָהֳלֵיהֶם
  english_pob_choice: their tents
  chosen_korean: 그들의 장막
  alternatives_korean:
  - 그들의 텐트
  - 그들의 천막
  lexicon: HALOT
  rationale: אֹהֶל은 유목민의 거처를 가리키므로, 현대 한국어에서는 의미를 분명히 하면서도 성경적 문맥을 살리는 ‘장막’이 적절합니다.
- source_word: צֹאנָם
  english_pob_choice: their flocks
  chosen_korean: 양 떼
  alternatives_korean:
  - 그들의 양 떼
  - 그들의 가축 떼
  lexicon: HALOT
  rationale: צֹאן은 작은 가축의 집합을 뜻하므로, 전리품 목록의 목축적 뉘앙스를 살리는 ‘양 떼’가 자연스럽습니다.
- source_word: יְרִיעוֹתֵיהֶם
  english_pob_choice: their tent curtains
  chosen_korean: 장막 휘장
  alternatives_korean:
  - 장막 덮개
  - 천막 휘장
  lexicon: HALOT
  rationale: יְרִיעָה는 휘장이나 덮개를 뜻하지만, 여기서는 장막과 짝을 이루는 유목 재산이므로 ‘장막 휘장’으로 구체화했습니다.
- source_word: כָּל־כְּלֵיהֶם
  english_pob_choice: all their goods
  chosen_korean: 모든 물품
  alternatives_korean:
  - 모든 살림
  - 모든 소지품
  - 모든 기물
  lexicon: HALOT
  rationale: כְּלִי의 범위가 넓어 ‘그릇’이나 ‘기구’로 좁히기보다, 약탈 목록에서 포괄적으로 쓰이는 ‘물품’이 가장 무난합니다.
- source_word: מָגוֹר מִסָּבִיב
  english_pob_choice: Terror on every side!
  chosen_korean: 사방에 두려움이 있습니다!
  alternatives_korean:
  - 사방에 공포가 있습니다!
  - 사방에 두려움이!
  lexicon: HALOT
  rationale: 예레미야에 반복되는 관용구를 한국어로 옮기되, 직역의 낯섦과 관용구의 힘을 함께 살리기 위해 ‘사방에 두려움이 있습니다!’로 표현했습니다.
theological_decisions:
- issue: 포로/약탈의 서술에서 주어와 대상 관계를 어떻게 한국어로 드러낼지
  chosen_reading: ‘그들 위에 …라고 외칠 것입니다’로 옮겨, 전리품을 빼앗는 행위와 포획자들이 희생자 위에 전쟁의 구호를 외치는 장면을 함께 드러냈습니다.
  alternative_readings:
  - ‘그들에 대해 …라고 외칠 것입니다’
  - ‘그들에게 …라고 외칠 것입니다’
  rationale: 히브리어 עֲלֵיהֶם은 ‘위에/대하여/against’의 범위를 가지므로, 한국어에서는 축약된 단일 표현보다 ‘위에’가 문맥의 압박감과 선언성을 잘 살립니다.
  doctrine_reference: Jeremiah 49장의 심판 선언과 전쟁 포고의 수사
