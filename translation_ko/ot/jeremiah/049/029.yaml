revisions:
- from: 그들은 자기들의 장막과 양 떼를 빼앗을 것입니다. 그들은 자기들의 장막 휘장과 모든 물품과 낙타들을 빼앗아 갈 것이며, 그들 위에 「사방에 두려움이 있습니다!」라고 외칠 것입니다.[a]
  to: 그들은 그들의 장막과 양 떼를 가져갈 것이며, 그들의 장막 휘장과 모든 물품과 낙타를 빼앗아 갈 것입니다. 그리고 그들을 향해 “사방에 공포가 있다!”라고 외칠 것입니다.[a]
  rationale: 약탈의 두 동사를 한국어에서 구별하고, 마지막 전치사구의 논쟁 가능한 범위는 각주에 보존했습니다. 반복되는 예레미야의 심판 표어는 현대 한국어에서 자연스러우면서도 강도를 유지하도록 ‘사방에 공포가 있다!’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:12Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 약탈 열거와 마지막 선언은 대체로 반영되었으나, 본문의 ‘그들 위에’는 현대 한국어로 부자연스럽고 עֲלֵיהֶם의 방향·대상 관계를 본문에서 불필요하게 문자적으로 고정합니다. 또한 מָגוֹר는 단순한 ‘두려움’보다 재앙적·압도적인 ‘공포/공포의 위협’에 가깝습니다.
  naturalness: ‘그들 위에 … 외칠 것입니다’와 인용문 ‘사방에 두려움이 있습니다!’는 현대 한국어의 전쟁 선포/비탄의 외침으로는 어색합니다. ‘그들을 향해’ 및 ‘사방에 공포가 있다!’가 자연스럽고 문맥의 긴박성을 살립니다.
  terminology: ‘장막’, ‘양 떼’, ‘장막 휘장’, ‘모든 물품’, ‘낙타’는 적절합니다. מָגוֹר מִסָּבִיב은 예레미야에서 반복되는 심판의 표어이므로 ‘사방에 공포가 있다!’로 강도를 보존하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: עֲלֵיהֶם을 ‘그들 위에’로 본문에 직역함
    rationale: 문법적으로 가능한 이미지이지만 현대 한국어에서는 외침의 대상 관계가 부자연스럽습니다. ‘그들을 향해’를 본문으로 택하고, ‘대하여/위에’ 등의 범위는 각주에서 보존하는 편이 안전합니다.
  - severity: medium
    issue: מָגוֹר를 ‘두려움’으로 약화하고 존댓말 서술문으로 처리함
    rationale: מָגוֹר는 여기서 포위된 공포·공황이라는 심판 표어입니다. 인용된 외침에는 ‘공포’와 비존댓말 선언형이 더 자연스럽고 원문의 압축성과 힘을 반영합니다.
  - severity: low
    issue: יִקָּחוּ를 ‘빼앗을 것입니다’로 번역함
    rationale: 문맥상 약탈이므로 가능하나, 동사의 기본 뜻은 ‘가져가다/취하다’입니다. 뒤의 ‘빼앗아 가다’와 구별하여 첫 동사는 ‘가져갈 것입니다’로 두면 원문의 어휘적 차이를 더 잘 살립니다.
