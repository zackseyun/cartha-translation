  source_fidelity: 개정이 필요합니다. וְנִדַּחְתֶּם은 2인칭 복수의 피동으로 ‘너희는 쫓겨날 것이다/내쫓길 것이다’라는 강제적 축출을 뜻합니다. 초안의 ‘각 사람은 자기 앞에서 흩어질 것이고’는 주어를 3인칭으로 바꾸고 피동의 강도를 약화하며, ‘자기 앞에서’도 한국어로 부자연스럽습니다. מִכָּל־סְבִיבַיִךְ는 공포가 ‘네 사방에서’ 닥침을 나타내므로 이를 명시하는 편이 충실합니다.
  naturalness: ‘만군의 주 야훼의 말씀입니다’는 현대 표준어 합쇼체에서 예언 선언 공식으로 자연스럽습니다. ‘각자 앞을 향해 쫓겨날 것이며’는 난해한 אִישׁ לְפָנָיו의 방향·분산 의미를 본문에서 절제하여 드러내고, 각주로 가능한 직역을 보존합니다.
  terminology: 야훼는 제공된 프로젝트 표기 원칙에 맞추어 유지했습니다. אֲדֹנָי יְהוִה צְבָאוֹת는 ‘만군의 주 야훼’로, 아도나이(주), 고유명 야훼, צבאות(만군)를 모두 반영했습니다. לַנֹּדֵד는 문맥상 ‘도망자’로 옮기되 ‘떠도는 이’의 가능성을 각주에 남겼습니다.
