  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִי֩ מֵבִ֨יא עָלַ֜יִ/ךְ פַּ֗חַד נְאֻם אֲדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת מִ/כָּל סְבִיבָ֑יִ/ךְ וְ/נִדַּחְתֶּם֙ אִ֣ישׁ לְ/פָנָ֔י/ו וְ/אֵ֥ין מְקַבֵּ֖ץ לַ/נֹּדֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/005.yaml
  text: Behold[a], I am bringing terror upon you from all around you, declares the Lord GOD of hosts, and each man will be driven out before him[b], with no one to gather the fugitive.
  footnotes:
  - marker: a
    text: Or 'each one straight ahead' / 'each man before him.' The Hebrew phrase is terse and may describe panicked flight in which each person rushes on without regard for others.
    reason: lexical_alternative
  - marker: b
    text: Or 'the wanderer' or 'the one fleeing.'
    reason: alternative_reading
translation:
  language: ko
  text: 보십시오, 내가 사방에서 너에게 공포를 가져오겠습니다. 만군의 주 야훼의 말씀이며, 각 사람은 자기 앞에서 흩어질 것이고 — 도망하는 이를 모을 사람도 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 앞에서’ 혹은 ‘곧장 앞쪽으로’입니다. 여기서는 공황 속에 제각기 흩어져 달아나는 모습을 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘도망하는 이’는 ‘방황하는 자’ 또는 ‘달아나는 자’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 환기하는 감탄을 현대 한국어의 공손한 명령형으로 살려, 단순한 정보 전달보다 선포의 긴박함을 드러냈습니다.
- source_word: פַּחַד
  english_pob_choice: terror
  chosen_korean: 공포
  alternatives_korean:
  - 두려움
  - 전율
  lexicon: HALOT
  rationale: 여기서는 하나님이 가져오시는 심판의 압도적 भय를 가리키므로, ‘두려움’보다 강한 ‘공포’가 문맥에 더 가깝습니다.
- source_word: נְאֻם אֲדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: declares the Lord GOD of hosts
  chosen_korean: 만군의 주 야훼의 말씀이며
  alternatives_korean:
  - 만군의 주 하나님의 말씀이며
  - 만군의 주 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: נְאֻם은 예언 공식의 ‘말씀’으로 옮기고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 살렸습니다. ‘만군의 주’는 צְבָאוֹת의 전통적 의미를 압축적으로 반영합니다.
- source_word: אִישׁ לְפָנָיו
  english_pob_choice: each man before him
  chosen_korean: 각 사람은 자기 앞에서 흩어질 것이고
  alternatives_korean:
  - 각 사람은 자기 앞을 향해 달아날 것이고
  - 각 사람은 자기 앞쪽으로 밀려날 것이고
  lexicon: HALOT
  rationale: 히브리어는 간결하고 난해한 분산·도주 표현이므로, ‘자기 앞에서’라는 방향성을 살리면서도 한국어에서는 ‘흩어질 것이고’로 자연스럽게 풀었습니다.
- source_word: לַנֹּדֵד
  english_pob_choice: the fugitive
  chosen_korean: 도망하는 이
  alternatives_korean:
  - 도망자
  - 떠도는 이
  lexicon: HALOT
  rationale: 문맥상 강제 이동과 도주를 가리키므로 ‘도망하는 이’가 심판 뒤의 피난 상태를 잘 드러냅니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 יהוה가 직접 나오므로, 프로젝트 기본 원칙에 따라 고유한 언약 이름을 ‘야훼’로 드러냈습니다. '주'는 뒤의 아도나이와 결합된 호칭과 구별이 약해질 수 있습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה YHWH → Yahweh'
- issue: 여호와/주 결합 호칭의 한국어 재현
  chosen_reading: 만군의 주 야훼
  alternative_readings:
  - 주 하나님 만군의 야훼
  - 만군의 주 하나님
  rationale: אֲדֹנָי와 צְבָאוֹת의 결합은 위엄 있는 신적 호칭이므로, 한국어에서도 ‘만군의 주’로 유지해 예언 선포의 중량을 보존했습니다.
  doctrine_reference: 프로젝트 호칭 일관성 지침
