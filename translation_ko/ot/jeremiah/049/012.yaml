id: JER.49.12
reference: Jeremiah 49:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה הִ֠נֵּה אֲשֶׁר אֵ֨ין מִשְׁפָּטָ֜/ם לִ/שְׁתּ֤וֹת הַ/כּוֹס֙ שָׁת֣וֹ יִשְׁתּ֔וּ וְ/אַתָּ֣ה ה֔וּא נָקֹ֖ה תִּנָּקֶ֑ה לֹ֣א תִנָּקֶ֔ה כִּ֥י שָׁתֹ֖ה תִּשְׁתֶּֽה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/012.yaml
  text: 'For thus says Yahweh: Behold[a], those who were not sentenced to drink the cup will surely drink, and are you the one who will go unpunished? You will not go unpunished[c][b], for you will surely drink.'
  footnotes:
  - marker: a
    text: Or, 'those for whom it was not their due to drink the cup.' The Hebrew phrase uses משפט ('judgment,' 'justice,' 'legal due').
    reason: lexical_alternative
  - marker: b
    text: '''The cup'' is a prophetic image for the judgment God gives nations to drink.'
    reason: cross_reference
  - marker: c
    text: Or, 'shall you indeed be acquitted? You shall not be acquitted.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 보십시오, 그 잔을 마시도록 판결받지 않은 사람들도 반드시 마시게 될 것인데[a] 당신이 처벌을 면하겠습니까?[c] 당신은 처벌을 면하지 못할 것입니다. 반드시 마시게 될 것이기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 잔을 마시는 것이 그들에게 법적으로 마땅한 몫이 아닌 사람들.’ 히브리어 משפט은 ‘판결’, ‘정의’, ‘법적으로 마땅한 몫’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 잔’은 하나님께서 나라들에게 마시게 하시는 심판을 가리키는 예언적 이미지입니다.
    reason: cross_reference
  - marker: c
    text: 또는, ‘정말로 무죄 선고를 받겠습니까? 당신은 무죄 선고를 받지 못할 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC/HALOT
  rationale: POB의 기본 원칙에 따라 신성명을 학술적 음역인 ‘야훼’로 옮겨 본문과 주석의 일관성을 유지했습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: WLC/HALOT
  rationale: 예언적 주의 환기 기능을 살리면서 현대 한국어에서 자연스러운 호명형으로 옮겼습니다.
- source_word: אֲשֶׁר אֵין מִשְׁפָּטָם לִשְׁתּוֹת הַכּוֹס
  english_pob_choice: those who were not sentenced to drink the cup
  chosen_korean: 마땅히 마시지 않을 사람들이 그 잔을 반드시 마시게 될 것이며
  alternatives_korean:
  - 그 잔을 마시는 것이 그들의 마땅한 일이 아니었던 사람들이
  - 그 잔을 마시도록 판결받지 않은 사람들이
  lexicon: HALOT
  rationale: מִשְׁפָּט의 법정적·판결적 뉘앙스를 ‘마땅히’와 ‘마시게 될 것’으로 풀어, 단순한 도덕 판단이 아니라 판결된 몫이라는 의미를 드러냈습니다.
- source_word: הַכּוֹס
  english_pob_choice: the cup
  chosen_korean: 그 잔
  alternatives_korean:
  - 잔
  - 그 컵
  lexicon: HALOT
  rationale: 예언서에서 널리 쓰이는 심판의 상징을 그대로 유지해, 본문의 이미지와 신학적 긴장을 보존했습니다.
- source_word: נָקֹה תִּנָּקֶה / לֹא תִנָּקֶה
  english_pob_choice: who will go unpunished? You will not go unpunished
  chosen_korean: 무죄를 선고받겠습니까? 당신은 무죄를 선고받지 못할 것입니다
  alternatives_korean:
  - 벌을 면하겠습니까? 당신은 벌을 면하지 못할 것입니다
  - 무죄함을 인정받겠습니까? 당신은 무죄함을 인정받지 못할 것입니다
  lexicon: HALOT
  rationale: נקה의 법정적 의미를 살려 ‘무죄를 선고받다’로 번역해, 본문의 반문과 부정을 동일한 사법적 틀 안에서 대응시켰습니다.
theological_decisions:
- issue: ‘그 잔’의 해석을 본문에 풀어 쓸 것인가
  chosen_reading: 주석 없이 본문에는 ‘그 잔’만 유지했습니다.
  alternative_readings:
  - ‘진노의 잔’
  - ‘심판의 잔’
  rationale: 히브리어 본문은 단지 ‘그 잔’이라고 말하므로, 문맥상 의미가 분명하더라도 본문 자체에 없는 해석어를 추가하지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 허용하는 범위를 넘어 해설을 본문에 삽입하지 않습니다.'
