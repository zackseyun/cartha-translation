revisions:
- from: 야훼께서 이렇게 말씀하십니다. 보십시오, 마땅히 마시지 않을 사람들이 그 잔을 반드시 마시게 될 것이며, 그런데 당신이 무죄를 선고받겠습니까? 당신은 무죄를 선고받지 못할 것입니다. 반드시 마시게 될 것이기 때문입니다.[a][b][c]
  to: 야훼께서 이렇게 말씀하십니다. 보십시오, 그 잔을 마시도록 판결받지 않은 사람들도 반드시 마시게 될 것인데[a] 당신이 처벌을 면하겠습니까?[c] 당신은 처벌을 면하지 못할 것입니다. 반드시 마시게 될 것이기 때문입니다.[b]
  rationale: 법적·당위적 의미를 지닌 משפט을 ‘마시도록 판결받지 않은’으로 옮겨 원문과 영어 POB의 선택을 반영했습니다. נקה는 심판 문맥에 맞는 ‘처벌을 면하다’로 번역하되, 법정적 ‘무죄 선고’ 가능성은 주석에 보존했습니다. ‘그 잔’은 본문에서 그대로 유지하고 그 예언적 기능은 주석에서만 밝혔습니다.
  reviewer_model: gpt-5.6-terra
