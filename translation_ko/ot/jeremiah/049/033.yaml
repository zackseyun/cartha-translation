  rationale: 문맥상 폐허가 된 성읍에 야생 동물이 자리 잡는 이미지를 살리기 위해, 비교적 관용적인 ‘소굴’을 택했습니다. ‘jackals’는 한국어에서 직역하면 어색할 수 있어 ‘승냥이들’로 옮겼습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 영원한 황무지
  alternatives_korean:
  - 황폐함
  - 폐허
  - 황무지
  lexicon: HALOT
  rationale: 명사적 파괴 상태를 살리면서도 앞의 야생동물 이미지와 연결되도록 ‘황무지’로 옮겼고, ‘영원한’으로 עַד עוֹלָם의 지속성을 자연스럽게 반영했습니다.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  english_pob_choice: no man will dwell there
  chosen_korean: 거기에는 사람이 살지 못하고
  alternatives_korean:
