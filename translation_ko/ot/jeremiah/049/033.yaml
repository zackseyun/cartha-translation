base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/033.yaml
  text: Hazor will become a haunt of jackals[a], a desolation forever; no man will dwell there[b], and no son of man will sojourn in it.
  footnotes:
  - marker: a
    text: Or 'a dwelling for jackals.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'no man ... no son of man'; that is, no human being will live there.
    reason: lexical_alternative
translation:
  language: ko
  text: 하솔은 승냥이들의 소굴이 되며, 영원한 황무지가 될 것입니다. 거기에는 사람이 살지 못하고, 어떤 인자도 머물지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘승냥이들의 거처’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘사람’과 ‘인자’는 여기서 인간 일반을 가리키는 병렬 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  english_pob_choice: will become
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 되겠습니다
  - 이 될 것입니다
  lexicon: HALOT
  rationale: 예언적 결과를 나타내는 상태 변화로 옮기되, 한국어에서는 자연스러운 미래형으로 처리했습니다.
- source_word: לִמְעוֹן תַּנִּים
  english_pob_choice: a haunt of jackals
  chosen_korean: 승냥이들의 소굴
  alternatives_korean:
  - 승냥이들의 거처
  - 승냥이들의 보금자리
  - 승냥이들의 서식지
  lexicon: HALOT
  rationale: 문맥상 폐허가 된 성읍에 야생 동물이 자리 잡는 이미지를 살리기 위해, 비교적 관용적인 ‘소굴’을 택했습니다. ‘jackals’는 한국어에서 직역하면 어색할 수 있어 ‘승냥이들’로 옮겼습니다.
- source_word: שְׁמָמָה
  english_pob_choice: a desolation
  chosen_korean: 영원한 황무지
  alternatives_korean:
  - 황폐함
  - 폐허
  - 황무지
  lexicon: HALOT
  rationale: 명사적 파괴 상태를 살리면서도 앞의 야생동물 이미지와 연결되도록 ‘황무지’로 옮겼고, ‘영원한’으로 עַד עוֹלָם의 지속성을 자연스럽게 반영했습니다.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ
  english_pob_choice: no man will dwell there
  chosen_korean: 거기에는 사람이 살지 못하고
  alternatives_korean:
  - 거기에는 남자가 살지 않고
  - 거기에는 어떤 사람도 거주하지 않고
  lexicon: HALOT
  rationale: 히브리어의 보편적 부정과 거주 의미를 한국어로 자연스럽게 풀어, ‘dwell’를 ‘살다’로 옮겼습니다.
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  english_pob_choice: and no son of man will sojourn in it
  chosen_korean: 어떤 인자도 머물지 못할 것입니다
  alternatives_korean:
  - 어떤 사람의 자식도 그 안에 나그네처럼 머물지 못할 것입니다
  - 어떤 인간도 그 안에 체류하지 못할 것입니다
  lexicon: HALOT
  rationale: בֶּן אָדָם의 문자적 구조를 살리면서도 한국어로는 부자연스러운 ‘사람의 아들’ 대신, 본문의 병렬 부정이 강조하는 ‘어떤 인자도’로 옮겼습니다. ‘sojourn’을 ‘머물다’로 처리해 잠시 머무는 의미를 구분했습니다.
theological_decisions:
- issue: 비유적 심판 예언의 동물 이미지
  chosen_reading: ‘jackals’를 문맥에 맞게 승냥이들로 옮겼습니다.
  alternative_readings:
  - 자칼들
  - 들개들
  rationale: 폐허가 된 도시가 들짐승의 거처가 된다는 예언적 관용구를 한국어로 즉시 이해되게 하면서, 파괴의 성격을 약화시키지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §2: source-directed imagery should remain vivid and auditable.'
- issue: generic masculine human-reference
  chosen_reading: ‘사람’과 ‘어떤 인자도’로 일반 인간 부재를 표현했습니다.
  alternative_readings:
  - 남자
  - 어떤 인간도
  rationale: 히브리어의 אִישׁ, בֶּן אָדָם이 대표적/일반적 인간을 가리키는 점을 살리되, 한국어에서는 중복된 남성 표지를 피하면서도 본문의 전면적 부정을 분명하게 드러냈습니다.
  doctrine_reference: Translation philosophy §4; generic masculine renderings in narrative/judgment texts
