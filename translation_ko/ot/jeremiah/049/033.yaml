  - 거기에는 어떤 사람도 거주하지 않고
  lexicon: HALOT
  rationale: 히브리어의 보편적 부정과 거주 의미를 한국어로 자연스럽게 풀어, ‘dwell’를 ‘살다’로 옮겼습니다.
- source_word: וְלֹא יָגוּר בָּהּ בֶּן אָדָם
  english_pob_choice: and no son of man will sojourn in it
  chosen_korean: 어떤 인자도 머물지 못할 것입니다
  alternatives_korean:
  - 어떤 사람의 자식도 그 안에 나그네처럼 머물지 못할 것입니다
