  doctrine_reference: 'Translation philosophy §2: source-directed imagery should remain vivid and auditable.'
- issue: generic masculine human-reference
  chosen_reading: ‘사람’과 ‘어떤 인자도’로 일반 인간 부재를 표현했습니다.
  alternative_readings:
  - 남자
