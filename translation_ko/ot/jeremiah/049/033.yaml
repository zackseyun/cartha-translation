  rationale: 히브리어의 אִישׁ, בֶּן אָדָם이 대표적/일반적 인간을 가리키는 점을 살리되, 한국어에서는 중복된 남성 표지를 피하면서도 본문의 전면적 부정을 분명하게 드러냈습니다.
