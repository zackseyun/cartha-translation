  lexicon: HALOT
  rationale: בֶּן אָדָם의 문자적 구조를 살리면서도 한국어로는 부자연스러운 ‘사람의 아들’ 대신, 본문의 병렬 부정이 강조하는 ‘어떤 인자도’로 옮겼습니다. ‘sojourn’을 ‘머물다’로 처리해 잠시 머무는 의미를 구분했습니다.
theological_decisions:
