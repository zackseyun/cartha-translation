revisions:
- from: 하솔은 승냥이들의 소굴이 되며, 영원한 황무지가 될 것입니다. 거기에는 사람이 살지 못하고, 어떤 인자도 머물지 못할 것입니다.[a][b]
  to: 하솔은 자칼들의 소굴, 영원히 황폐한 곳이 될 것입니다.[a] 그곳에는 아무도 살지 않으며, 어떤 인간도 그 안에 머물지 않을 것입니다.[b]
  rationale: 하솔의 미래 황폐 예언과 거주자 전무라는 병렬을 유지했습니다. תַּנִּים은 문맥상 ‘자칼’로 바로잡고, בֶּן־אָדָם은 본문의 일반적 의미를 본문에서 자연스럽게 표현하되 문자적 표현과 병렬성은 주석으로 밝혔습니다. 두 부정문은 능력 부정이 아닌 미래의 사실 부정으로 수정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:05Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안의 ‘사람이 살지 못하고’와 ‘머물지 못할 것입니다’는 단순한 미래의 전면 부정을 능력·가능의 부정으로 바꾸며, ‘인자’는 בֶּן־אָדָם의 여기서의 일반 인간이라는 관용적 용법을 한국어의 신학적 호칭처럼 오해하게 할 수 있습니다. 또한 תַּנִּים은 이 폐허 공식에서 일반적으로 자칼을 가리키므로 ‘승냥이’보다 ‘자칼’이 더 정확합니다.
  naturalness: ‘자칼들의 소굴’과 ‘영원히 황폐한 곳’은 현대 표준어 합쇼체에서 자연스럽습니다. ‘아무도 … 어떤 인간도’는 히브리어의 병렬적 전면 부정을 자연스럽게 재현하며, ‘그 안에 머물다’는 גוּר의 체류·거류 뉘앙스를 ‘살다’와 구별합니다.
  terminology: 하솔은 통용되는 지명 음역입니다. ‘인자’는 본절에서 피해야 합니다. 한국어 성경 문맥에서 특정 종교적 호칭으로 읽힐 가능성이 크고, 본문의 일반적 인간 지시를 흐립니다. ‘자칼’은 승냥이와 구별되는 동물 명칭이므로 채택합니다.
  issues:
  - severity: high
    issue: ‘어떤 인자도’라는 번역
    rationale: בֶּן־אָדָם은 이 문맥에서 앞선 אִישׁ과 병렬을 이루는 일반적 인간 지시입니다. ‘인자’는 한국어에서 특정 신학적 호칭으로 굳어져 있어 의미를 왜곡하거나 불필요한 연상을 일으킵니다.
  - severity: medium
    issue: ‘살지 못하고/머물지 못할 것입니다’의 양태
    rationale: לֹא יֵשֵׁב 및 לֹא יָגוּר은 미래적 사실의 부정입니다. ‘못하다’는 능력 또는 허용의 부정으로 들릴 수 있으므로 ‘않다’가 더 충실합니다.
  - severity: medium
    issue: תַּנִּים을 ‘승냥이들’로 번역
    rationale: 예언서의 황폐 공식에서 תַּנִּים은 자칼로 이해하는 것이 가장 적절합니다. 승냥이는 자칼과 다른 동물이므로 현대 동물명으로는 부정확합니다.
