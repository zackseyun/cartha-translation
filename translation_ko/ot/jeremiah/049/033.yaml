translation:
  language: ko
  text: 하솔은 자칼들의 소굴, 영원히 황폐한 곳이 될 것입니다.[a] 그곳에는 아무도 살지 않으며, 어떤 인간도 그 안에 머물지 않을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자칼들의 거처’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람’과 ‘사람의 아들’이라고 하며, 여기서는 둘 다 인간 일반을 가리키는 병렬 표현입니다.
    reason: lexical_alternative
