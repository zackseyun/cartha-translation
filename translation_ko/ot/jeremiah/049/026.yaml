base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/026.yaml
  text: Therefore her young men will fall in her streets[a], and all the men of war will be silenced on that day[c][b], declares Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or 'in her squares' or 'in her open places.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will perish' or 'will be cut off.' The Hebrew verb can denote being silenced, stilled, or brought to ruin.
    reason: lexical_alternative
  - marker: c
    text: 'Traditional rendering: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 성읍의 젊은이들은 그 거리들에서 쓰러지고, 모든 전사들은 그날에 침묵하게 될 것입니다 — 만군의 야훼의 말씀입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''거리들''은 רחובות의 기본적 의미를 따른 번역이며, ''광장들'' 또는 ''열린 곳들''도 가능합니다.'
    reason: lexical_alternative
  - marker: b
    text: יִדַּמּוּ는 '침묵하게 되다' 외에 '멸망하다', '끊어지다'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: '전통 번역: ''만군의 여호와''.'
    reason: previous_rendering
