  yaml_path: translation/ot/jeremiah/049/039.yaml
  text: But in the latter days I will restore the fortunes of Elam[a], declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'I will bring back the captivity/captives of Elam.' The Hebrew restoration formula can refer specifically to return from captivity or more broadly to restored fortunes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 마지막 날들에 내가 엘람의 형편을 회복시킬 것입니다.[a] 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘엘람의 포로들을 돌아오게 하겠다’ 또는 ‘엘람의 포로 상태를 되돌리겠다’라는 뜻일 수 있습니다. 히브리어의 회복 관용구는 포로 귀환을 가리킬 수도 있고, 더 넓게는 형편의 회복을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 말세에
  - 훗날에
  lexicon: HALOT
  rationale: 예언적 관용구의 미래성을 살리면서도, 지나치게 교리화하지 않고 시간적 전환을 자연스럽게 드러내기 위해 ‘마지막 날들에’로 옮겼습니다.
- source_word: אשוב אֶת שבית
  english_pob_choice: I will restore the fortunes
  chosen_korean: 내가 엘람의 fortunes를 회복시킬 것입니다
  alternatives_korean:
  - 내가 엘람의 포로 상태를 돌이킬 것입니다
  - 내가 엘람의 포로들을 돌아오게 할 것입니다
  lexicon: HALOT
  rationale: 본문의 회복 공식은 포로 귀환만이 아니라 상태의 반전을 포함할 수 있어, 한국어에서는 ‘회복시키다’로 넓게 살리되 footnote로 다른 가능성을 남겼습니다.
- source_word: עֵילָם
  english_pob_choice: Elam
  chosen_korean: 엘람
  alternatives_korean:
  - 엘라ם
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 현대 한국어 음역 관행에 따라 ‘엘람’으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언문 종결 공식을 한국어에서 자연스럽게 살리면서, 신명기적 고유명 표기 원칙에 따라 יְהוָה를 ‘야훼’로 유지했습니다.
theological_decisions:
- issue: 회복 공식의 범위
  chosen_reading: ‘회복시키다’로 번역해 포로 귀환보다 넓은 회복의 의미를 열어 두었습니다.
  alternative_readings:
  - 포로들을 돌아오게 하다
  - 포로 상태를 되돌리다
  rationale: 히브리어 관용구는 심판의 반전, 귀환, 번영 회복을 함께 포괄할 수 있으므로, 특정 신학 틀로 좁히지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 원문 우선 원칙; 번역 전통보다 원어의 범위 보존
- issue: ‘마지막 날들’의 종말론적 뉘앙스
  chosen_reading: 시간적 미래성을 드러내되, 상세한 종말 도식을 덧씌우지 않았습니다.
  alternative_readings:
  - 말세에
  - 훗날에
  rationale: 히브리어 관용구는 종말론적 울림을 가질 수 있으나, 본문만으로 특정 교리를 단정하지 않기 위해 여운을 남겼습니다.
  doctrine_reference: 신학적 긴장 보존
