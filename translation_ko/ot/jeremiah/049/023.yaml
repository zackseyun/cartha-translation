  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/דַמֶּ֗שֶׂק בּ֤וֹשָֽׁה חֲמָת֙ וְ/אַרְפָּ֔ד כִּי שְׁמֻעָ֥ה רָעָ֛ה שָׁמְע֖וּ נָמֹ֑גוּ בַּ/יָּ֣ם דְּאָגָ֔ה הַשְׁקֵ֖ט לֹ֥א יוּכָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/023.yaml
  text: 'Concerning Damascus: Hamath and Arpad are put to shame[a], for they have heard bad news; they melt away. There is anxiety like the sea; it cannot be quiet.'
  footnotes:
  - marker: a
    text: 'Hebrew is difficult: literally, ''in/like the sea, anxiety; to be quiet it cannot.'' The line may mean either that their anxiety is like the restless sea, or that there is anxiety at the sea and it cannot be calmed.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「다메섹에 대하여」 — 하맛과 아르밧은 수치를 당했습니다. 그들이 나쁜 소식을 들었으니, 녹아 내렸습니다. 바다 같은 불안이 있으니, 잠잠할 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 난해합니다. 문자적으로는 “바다 안/같이, 불안; 잠잠하기에 그것은 능하지 못하다”에 가깝습니다. 이 행은 그들의 불안이 잔잔하지 않은 바다와 같다는 뜻일 수도 있고, 바다에서 불안이 일어나 잠잠해질 수 없다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדַמֶּשֶׂק
  english_pob_choice: Concerning Damascus
  chosen_korean: 「다메섹에 대하여」
  alternatives_korean:
  - 다메섹에 관하여
  - 다메섹을 향하여
  lexicon: HALOT
  rationale: 예언 표제의 לְ를 한국어에서는 “~에 대하여”로 옮겨, 심판의 대상으로서의 뉘앙스를 유지하면서도 형식 자체를 살렸습니다.
- source_word: בּוֹשָׁה
  english_pob_choice: are put to shame
  chosen_korean: 수치를 당했습니다
  alternatives_korean:
  - 부끄러움을 당했습니다
  - 수치를 입었습니다
  lexicon: HALOT
  rationale: 공적 굴욕과 수치의 의미를 분명히 살리기 위해, 내면 상태보다 외부에서 당하는 수치의 느낌을 주는 표현을 택했습니다.
- source_word: שְׁמֻעָה רָעָה
  english_pob_choice: bad news
  chosen_korean: 나쁜 소식
  alternatives_korean:
  - 재앙의 소식
  - 악한 소식
  lexicon: HALOT
  rationale: שְׁמֻעָה רָעָה를 현대 한국어의 자연스러운 말로 옮기되, 소식의 내용이 재난임을 과도하게 특정하지 않도록 했습니다.
- source_word: נָמֹגוּ
  english_pob_choice: they melt away
  chosen_korean: 녹아 내렸습니다
  alternatives_korean:
  - 녹아 없어졌습니다
  - 기운이 꺾였습니다
  lexicon: HALOT
  rationale: 동사의 비유적 이미지를 살려, 두려움 앞에서 힘이 풀리고 무너지는 모습을 직역에 가깝게 표현했습니다.
- source_word: בַּיָּם דְּאָגָה הַשְׁקֵט לֹא יוּכָל
  english_pob_choice: There is anxiety like the sea; it cannot be quiet.
  chosen_korean: 바다 같은 불안이 있으니, 잠잠할 수 없습니다.
  alternatives_korean:
  - 바다 같은 불안이 있어, 잠잠해질 수 없습니다
  - 바다처럼 불안하여, 잠잠하지 못합니다
  lexicon: HALOT
  rationale: 난해한 구절은 EN POB의 해석을 따라 ‘바다 같은’ 비교와 ‘잠잠할 수 없음’을 살리되, 한국어로 가장 자연스럽게 읽히도록 정리했습니다.
theological_decisions:
- issue: 예언 표제의 방향성(‘대하여’ vs ‘against’)
  chosen_reading: 심판 예언의 표제를 한국어로는 중립적이면서도 대상 지정이 드러나는 「다메섹에 대하여」로 처리했습니다.
  alternative_readings:
  - 「다메섹을 향하여」
  - 「다메섹을 쳐서」
  rationale: 히브리어 לְ는 전치사 자체로는 폭이 넓지만, 이 문맥은 멸망 선언의 표제이므로 한국어에서 과도하게 공격적이거나 불필요하게 설명적인 표현은 피했습니다.
  doctrine_reference: 예언서 서문/표제의 문맥 기능에 대한 번역 원칙
- issue: ‘바다 같은 불안’의 해석
  chosen_reading: 바다의 요동을 불안의 비유로 읽는 해석을 본문에 반영했습니다.
  alternative_readings:
  - 바다에서의 불안
  - 바다 근처의 불안
  rationale: 히브리어가 난해하므로 본문이 허용하는 범위 안에서 POB의 비유적 이해를 따라, 정서적 동요와 잠잠하지 못함을 한 문장으로 묶었습니다.
  doctrine_reference: 시적 병행과 비유 언어의 보존 원칙
