id: JER.49.21
reference: Jeremiah 49:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קּ֣וֹל נִפְלָ֔/ם רָעֲשָׁ֖ה הָ/אָ֑רֶץ צְעָקָ֕ה בְּ/יַם ס֖וּף נִשְׁמַ֥ע קוֹלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/021.yaml
  text: At the sound of their fall the earth quakes[a]; their cry is heard at the Red Sea.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Sea of Reeds.'' Traditionally rendered ''Red Sea.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들의 몰락하는 소리에 땅이 흔들립니다. 그들의 부르짖음이 홍해에서 들립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘갈대바다(Sea of Reeds)’입니다. 전통적으로는 ‘홍해’로 번역합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  english_pob_choice: At the sound of
  chosen_korean: …하는 소리에
  alternatives_korean:
  - …의 소리로
  - 소리를 듣고
  lexicon: HALOT
  rationale: מִן + קוֹל은 원인/계기의 뜻을 띨 수 있으므로, 한국어에서는 ‘…하는 소리에’로 자연스럽게 옮겨 사태의 발단을 드러냈습니다.
- source_word: נִפְלָם
  english_pob_choice: their fall
  chosen_korean: 그들의 몰락
  alternatives_korean:
  - 그들의 떨어짐
  - 그들의 سقوط
  lexicon: HALOT
  rationale: נפל의 ‘떨어지다/넘어지다’ 의미를 판단 문맥에 맞게 한국어의 ‘몰락’으로 압축해, 단순 낙상보다 심판적 붕괴의 뉘앙스를 살렸습니다.
- source_word: רָעֲשָׁה הָאָרֶץ
  english_pob_choice: the earth quakes
  chosen_korean: 땅이 흔들립니다
  alternatives_korean:
  - 땅이 진동합니다
  - 땅이 떱니다
  lexicon: HALOT
  rationale: רעשׁ의 물리적 요동을 현대 한국어의 자연스러운 표현인 ‘흔들립니다’로 옮겨, 과장 없이 강한 충격을 전달했습니다.
- source_word: צְעָקָה / קוֹלָהּ
  english_pob_choice: their cry is heard
  chosen_korean: 그들의 부르짖음이 들립니다
  alternatives_korean:
  - 그들의 외침이 들립니다
  - 그들의 울부짖음이 들립니다
  lexicon: HALOT
  rationale: 뒤의 קוֹלָהּ가 앞의 צְעָקָה를 되받는 구조이므로, 둘을 한국어에서 하나의 자연스러운 ‘부르짖음’으로 통합해 반복을 줄이면서 의미를 보존했습니다.
- source_word: בְּיַם סוּף
  english_pob_choice: at the Red Sea
  chosen_korean: 홍해에서
  alternatives_korean:
  - 갈대바다에서
  - 홍해 곁에서
  lexicon: HALOT
  rationale: 본문은 지명으로서의 관용적 이름을 사용하므로, POB의 영어 관행에 따라 한국어 본문에는 ‘홍해’로 두고, 히브리어 투명성은 각주로 보완했습니다.
theological_decisions:
- issue: יַם סוּף의 지명 처리
  chosen_reading: 본문에는 ‘홍해’를 쓰되, 각주에서 ‘갈대바다(Sea of Reeds)’라는 히브리어 직역 가능성을 밝혔습니다.
  alternative_readings:
  - 본문에 ‘갈대바다’로 직접 번역
  - 본문에 ‘홍해’만 두고 각주 생략
  rationale: 이 구절의 핵심은 장소의 관용명보다 심판의 소리가 멀리 퍼지는 이미지이므로, 독자 친화적인 관용명과 원어 투명성을 함께 유지하는 편이 본문 기능에 더 적합합니다.
  doctrine_reference: 번역/지명 용례
- issue: 시적 평행법의 압축
  chosen_reading: ‘그들의 몰락… 그들의 부르짖음…’으로 두 행의 대응을 한국어에서 간결하게 살렸습니다.
  alternative_readings:
  - 두 절을 더 직역하여 반복을 그대로 유지
  - ‘그들이 떨어지는 소리’처럼 문자적 반복을 강조
  rationale: 히브리어의 반복은 그대로 두면 한국어에서는 어색해질 수 있어, 의미 중심으로 압축하되 심판과 원거리 전파라는 핵심 이미지는 유지했습니다.
  doctrine_reference: 시적 평행법
