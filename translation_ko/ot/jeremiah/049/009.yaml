source:
  edition: WLC
  text: אִם בֹּֽצְרִים֙ בָּ֣אוּ לָ֔/ךְ לֹ֥א יַשְׁאִ֖רוּ עֽוֹלֵל֑וֹת אִם גַּנָּבִ֥ים בַּ/לַּ֖יְלָה הִשְׁחִ֥יתוּ דַיָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/049/009.yaml
  text: If grape gatherers came to you[a], would they not leave gleanings? If thieves came by night, they would destroy only enough for themselves.
  footnotes:
  - marker: a
    text: Or, 'If thieves came by night, would they not steal only until they had enough?' The Hebrew phrase at the end is idiomatic, literally 'their enough.'
    reason: lexical_alternative
translation:
  language: ko
  text: 포도 거두는 사람들이 네게 왔다면, 남은 이삭을 남기지 않겠습니까? 도둑들이 밤에 온다면, 자기들에게 필요한 만큼만 파괴할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 끝의 דַיָּם은 문자적으로는 ‘그들의 충분함’이라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: If
  chosen_korean: -다면
  alternatives_korean:
  - 만일
  - 만약
  lexicon: HALOT
  rationale: 두 절의 가정적 비교 구조를 살리기 위해 조건형 '-다면'으로 옮겼습니다.
- source_word: בֹּצְרִים
  english_pob_choice: grape gatherers
  chosen_korean: 포도 거두는 사람들
  alternatives_korean:
  - 포도 수확자들
  - 포도 따는 사람들
  - 포도 따는 일꾼들
  lexicon: HALOT
  rationale: 포도원에서 포도를 거두는 사람들을 가리키므로, 현대 한국어에서 자연스럽고 구체적인 '포도 거두는 사람들'을 택했습니다.
- source_word: עֹלֵלוֹת
  english_pob_choice: gleanings
  chosen_korean: 남은 이삭
  alternatives_korean:
  - 남은 포도
  - 이삭 줍는 몫
  - 남은 열매
  lexicon: HALOT
  rationale: 농경 문맥의 '남겨진 잔여분'을 살리되, 한국어에서 익숙한 추수 이미지인 '남은 이삭'으로 옮겨 의미를 전달했습니다.
- source_word: דַיָּם
  english_pob_choice: only enough for themselves
  chosen_korean: 자기들에게 필요한 만큼만
  alternatives_korean:
  - 그들 몫의 충분한 만큼만
  - 자기들의 충분함만큼만
  lexicon: HALOT
  rationale: 히브리어 관용구의 '그들의 충분함'을 직역하면 어색하므로, 도둑이 자기 필요분만 취한다는 뜻을 드러내는 표현으로 풀었습니다.
theological_decisions:
- issue: 비유적 질문의 수사적 힘
  chosen_reading: 두 질문을 반어적 비교로 살려, 에돔에 대한 완전한 파괴가 도둑의 제한된 훼손과 대비된다는 점을 드러냈습니다.
  alternative_readings:
  - 단순한 정보 질문으로 옮김
  - 보다 완곡한 비유로 약화
  rationale: 예언적 조롱문의 논리적 압박은 수사적 기대답을 통해 생기므로, 한국어에서도 질문 형식을 유지해야 합니다.
  doctrine_reference: 예언 문학의 심판 선언과 수사적 반문
