source:
  edition: WLC
  text: וְ/כִ֤י תֹאמְרִי֙ בִּ/לְבָבֵ֔/ךְ מַדּ֖וּעַ קְרָאֻ֣/נִי אֵ֑לֶּה בְּ/רֹ֧ב עֲוֺנֵ֛/ךְ נִגְל֥וּ שׁוּלַ֖יִ/ךְ נֶחְמְס֥וּ עֲקֵבָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/022.yaml
  text: And if you say in your heart[a], ‘Why have these things happened to me?’—because of the greatness of your iniquity your skirts have been uncovered[b], your heels have been violated.
  footnotes:
  - marker: a
    text: Or, 'Why have these things come upon me?'
    reason: lexical_alternative
  - marker: b
    text: '''Your heels have been violated'' continues the imagery of humiliating exposure; the Hebrew may also be understood more generally as violent mistreatment.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 만일 여러분이 마음속으로 말한다면, ‘어찌하여 이런 일들이 내게 일어났습니까?’—그것은 여러분의 죄악이 너무 크기 때문입니다. 여러분의 치마자락이 벗겨지고, 여러분의 발뒤꿈치가 짓밟혔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘어찌하여 이런 일들이 내게 닥쳤습니까?’
    reason: alternative_reading
  - marker: b
    text: ‘발뒤꿈치가 짓밟혔다’는 수치스러운 노출과 폭력의 이미지를 잇는 표현입니다. 히브리어는 보다 일반적으로 폭력적 학대를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי תֹאמְרִי בִּלְבָבֵךְ
  english_pob_choice: And if you say in your heart
  chosen_korean: 마음속으로 말한다면
  alternatives_korean:
  - 마음속으로 생각한다면
  - 속으로 말한다면
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘마음속으로 말하다’를 자연스러운 한국어로 옮기되, 반문을 예고하는 조건문 구조는 ‘말한다면’으로 살렸습니다.
- source_word: קְרָאֻנִי אֵלֶּה
  english_pob_choice: have these things happened to me
  chosen_korean: 이런 일들이 내게 일어났습니까
  alternatives_korean:
  - 이런 일들이 내게 닥쳤습니까
  - 이런 일들이 내게 왔습니까
  lexicon: HALOT
  rationale: 동사 קרא의 이 구문은 ‘불행이 닥치다/일어나다’의 뜻이므로, 직역의 ‘불려오다’보다 현대 한국어의 자연스러운 ‘일어났습니다’ 계열이 더 분명합니다.
- source_word: נִגְלוּ שׁוּלַיִךְ
  english_pob_choice: your skirts have been uncovered
  chosen_korean: 여러분의 치마자락이 벗겨지고
  alternatives_korean:
  - 여러분의 치마단이 드러나고
  - 여러분의 옷자락이 벗겨지고
  lexicon: HALOT
  rationale: שׁוּלַיִם은 옷의 아래 가장자리로, 수치와 노출의 이미지를 살리기 위해 ‘치마자락’으로 옮겼습니다. 동사 נִגְלוּ는 노출된 상태를 보이므로 수동형 연결로 처리했습니다.
- source_word: נֶחְמְסוּ עֲקֵבָיִךְ
  english_pob_choice: your heels have been violated
  chosen_korean: 여러분의 발뒤꿈치가 짓밟혔습니다
  alternatives_korean:
  - 여러분의 발뒤꿈치가 폭행당했습니다
  - 여러분의 발뒤꿈치가 짓밟히고 학대받았습니다
  lexicon: HALOT
  rationale: חמס는 ‘폭력적으로 해하다/짓밟다’의 강한 뜻을 가지며, 여기서는 수치스러운 노출의 연장선에서 신체적 모욕과 폭력을 함께 드러내는 표현으로 ‘짓밟혔습니다’를 택했습니다.
theological_decisions:
- issue: 예언적 수치 이미지의 강도
  chosen_reading: 노출과 모욕의 이미지를 유지하되, 본문에 명시되지 않은 성적 행위로 과도하게 특정하지 않았습니다.
  alternative_readings:
  - ‘벌거벗음이 드러났다’로 완곡화하기
  - 성폭력 이미지로 더 구체화하기
  rationale: 이 절은 시온/예루살렘을 향한 언약 심판의 강한 수치 이미지이므로, 완곡하게 약화시키지 않으면서도 히브리어가 직접 말하지 않는 세부를 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
