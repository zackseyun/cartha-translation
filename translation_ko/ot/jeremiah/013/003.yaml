translation:
  language: ko
  text: 야훼의 말씀이 두 번째로 내게 임하여 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 יְהוָה는 전통적으로 ‘주’로 옮겨지기도 합니다.
