lexical_decisions:
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언자적 관용구 ‘야훼의 말씀’에서 דְבַר는 단순한 ‘말’보다 하나님의 계시 행위를 드러내는 ‘말씀’이 가장 자연스럽고 स्रोत에 충실합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명사표기 יְהוָה를 전통적 대체어 대신 음역 ‘야훼’로 옮겨, 고유한 언약명을 보존합니다.
- source_word: שֵׁנִית
  english_pob_choice: a second time
  chosen_korean: 두 번째로
  alternatives_korean:
  - 다시
  - 둘째로
  lexicon: HALOT
  rationale: 반복을 표시하는 부사로서 ‘두 번째로’가 히브리어의 순서 감각을 분명하게 반영합니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하며
  - 이르며
  lexicon: HALOT
  rationale: 한국어에서는 뒤따르는 직접 화법을 여는 표지로 단순 ‘말씀하셨습니다’가 가장 자연스럽고, 장황한 ‘말하며’보다 문장 흐름을 잘 살립니다.
theological_decisions:
- issue: 예언 공식의 주어와 종결 방식
  chosen_reading: ‘야훼의 말씀이 … 내게 임하여 말씀하셨습니다’로 예언적 소명 공식의 구조를 유지했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 내게 두 번째로 왔습니다’
  - ‘야훼께서 내게 두 번째로 말씀하셨습니다’
  rationale: 히브리어의 ‘말씀-임함-말하다’ 구조를 살려, 계시가 단순 정보 전달이 아니라 하나님의 주도적 발화를 드러내도록 했습니다.
  doctrine_reference: 예언서의 계시 공식과 야훼의 직접 발화
