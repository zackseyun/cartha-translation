id: JER.13.9
reference: Jeremiah 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֖ה אָמַ֣ר יְהוָ֑ה כָּ֠כָה אַשְׁחִ֞ית אֶת גְּא֧וֹן יְהוּדָ֛ה וְ/אֶת גְּא֥וֹן יְרוּשָׁלִַ֖ם הָ/רָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/009.yaml
  text: 'Thus says Yahweh: In this way I will ruin the pride of Judah and the great pride of Jerusalem[a][b].'
  footnotes:
  - marker: a
    text: Or 'I will destroy' or 'I will mar.' The Hebrew verb can denote ruining, spoiling, or destroying; 'ruin' best fits the immediate imagery of the spoiled waistband in this chapter.
    reason: lexical_alternative
  - marker: b
    text: '''Pride'' may also be understood as ''arrogance'' or, less likely here, ''majesty.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 「야훼께서 이렇게 말씀하십니다. 이와 같이 내가 유다의 교만과 예루살렘의 큰 교만을 훼손하겠습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 파괴하겠다’ 또는 ‘내가 망가뜨리겠다’. 히브리어 동사는 망치기, 훼손하기, 파괴하기의 뜻을 가질 수 있으며, 이 장의 망가진 띠 표징과 가장 잘 맞는 것은 ‘훼손하다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘교만’은 ‘자만’ 또는, 여기서는 가능성이 더 낮지만, ‘위엄’으로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 「야훼께서 이렇게 말씀하십니다」
  alternatives_korean:
  - 「야훼께서 이렇게 말씀하십니다」
  - 「야훼께서 이같이 말씀하십니다」
  - 「주님께서 이렇게 말씀하십니다」
  lexicon: WLC / POB audit trail
  rationale: 예언자적 선포 공식을 현대 합쇼체로 옮기되, יְהוָה는 POB 기준에 따라 야훼로 유지했습니다. '이렇게'는 뒤의 כָּכָה와 구분되도록 첫 공식은 말하는 형식, 다음 절은 행위의 방식으로 살렸습니다.
- source_word: כָּכָה אַשְׁחִית
  english_pob_choice: In this way I will ruin
  chosen_korean: 이와 같이 내가 … 망가뜨리겠습니다
  alternatives_korean:
  - 이와 같이 내가 … 망치겠습니다
  - 이와 같이 내가 … 파괴하겠습니다
  - 이처럼 내가 … 무너뜨리겠습니다
  lexicon: HALOT
  rationale: אַשְׁחִית는 'ruin / destroy / mar'의 폭이 있으나, 문맥상 띠를 망가뜨리는 표징행위와 맞닿아 있어 '망가뜨리다'가 손상·훼손의 뜻을 가장 자연스럽게 살립니다.
- source_word: גְּאוֹן
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 자만
  - 자긍
  - 위세
  lexicon: HALOT
  rationale: 이 문맥에서는 긍정적 '위엄'보다 심판 대상이 되는 부정적 자기과시가 두드러지므로 '교만'이 적절합니다. 'pride'의 양가성을 완전히 제거하지 않되, 예언적 책망의 뉘앙스를 분명히 했습니다.
- source_word: גְּאוֹן יְהוּדָה ... גְּאוֹן יְרוּשָׁלִַם הָרָב
  english_pob_choice: the pride of Judah and the great pride of Jerusalem
  chosen_korean: 유다의 교만과 예루살렘의 큰 교만
  alternatives_korean:
  - 유다의 교만과 예루살렘의 큰 교만
  - 유다의 교만과 예루살렘의 매우 큰 교만
  - 유다의 교만과 예루살렘의 큰 자만
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조와 수식어 הָרָב의 강조를 살려 직역에 가깝게 옮겼습니다. '큰 교만'은 'great pride'의 중첩 강조를 보존합니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
