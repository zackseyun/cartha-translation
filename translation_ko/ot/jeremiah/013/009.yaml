  - 주님
  rationale: 본문이 יְהוָה를 직접 사용하므로, POB 방침에 따라 고유명사로서 '야훼'를 유지했습니다. 이는 호칭으로 바꾸지 않고 언약적 이름을 드러내는 선택입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
