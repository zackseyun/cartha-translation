  - 귀를 기울이십시오
  - 주의 깊게 들으십시오
  lexicon: HALOT
  rationale: 두 번째 동사는 단순 반복보다 주의 깊게 듣는 강화를 나타내므로, 관용적이고 자연한 한국어 표현인 '귀를 기울이십시오'로 옮겼습니다.
- source_word: תִּגְבָּהוּ
  english_pob_choice: be proud
  chosen_korean: 교만하지 마십시오
  alternatives_korean:
