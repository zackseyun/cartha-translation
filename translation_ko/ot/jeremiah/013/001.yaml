base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
  footnotes:
  - marker: a
    text: Or “a linen belt,” “a linen sash,” or possibly “a linen loincloth.” The Hebrew אֵזוֹר refers to a garment worn around the waist.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 이렇게 말씀하셨습니다. 「가서 아마로 만든 허리띠[a]를 하나 사서 네 허리에 두르십시오. 그러나 그것을 물에 넣지는 마십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아마포 띠”, “린넨 허리띠”, “허리 두르는 띠”로 옮길 수 있으며, 문맥상 “샅바나 속옷 같은 허리 두르는 옷”을 가리킬 가능성도 있습니다. 히브리어 אֵזוֹר는 허리에 두르는 의복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
