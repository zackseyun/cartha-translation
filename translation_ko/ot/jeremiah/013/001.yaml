source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה אֵלַ֗/י הָל֞וֹךְ וְ/קָנִ֤יתָ לְּ/ךָ֙ אֵז֣וֹר פִּשְׁתִּ֔ים וְ/שַׂמְתּ֖/וֹ עַל מָתְנֶ֑י/ךָ וּ/בַ/מַּ֖יִם לֹ֥א תְבִאֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/001.yaml
  text: 'Thus Yahweh said to me: “Go and buy yourself a linen waistband[a], and put it on your waist, but do not put it in water.”'
  footnotes:
  - marker: a
    text: Or “a linen belt,” “a linen sash,” or possibly “a linen loincloth.” The Hebrew אֵזוֹר refers to a garment worn around the waist.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 제게 이렇게 말씀하셨습니다. 「가서 너를 위해 아마로 된 허리띠를 하나 사서 네 허리에 두르되, 물에는 넣지 말아라」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “린넨 허리띠”, “린넨 띠”, 혹은 “아마포 허리띠”로 옮길 수 있습니다. 히브리어 אֵזוֹר는 허리에 두르는 의복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문의 신명은 여호와나 주님이 아니라 가리키는 고유명사형으로 처리하는 것이 원문과 POB 감각에 가장 직접적이므로, 프로젝트 기본값대로 야훼를 사용했습니다.
- source_word: אֵזוֹר
  english_pob_choice: waistband
  chosen_korean: 허리띠
  alternatives_korean:
  - 띠
  - 띠끈
  - 허리띠
  - 허리 두르는 띠
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 의복을 가리키므로, 현대 한국어에서 가장 자연스럽고 넓게 받아들여지는 허리띠로 옮겼습니다.
- source_word: פִּשְׁתִּים
  english_pob_choice: linen
  chosen_korean: 아마로 된
  alternatives_korean:
  - 린넨의
  - 삼베로 된
  - 아마포의
  lexicon: HALOT
  rationale: פִּשְׁתִּים은 아마/아마포 재료를 가리키므로, 의복 재질임을 드러내면서도 직역에 가까운 아마로 된을 택했습니다.
- source_word: וּבַמַּיִם לֹא תְבִאֵהוּ
  english_pob_choice: but do not put it in water
  chosen_korean: 물에는 넣지 말아라
  alternatives_korean:
  - 물에 적시지 말아라
  - 물속에 넣지 말아라
  - 물에 담그지 말아라
  lexicon: HALOT
  rationale: 히필 형태의 ‘들어가게 하다’는 의도를 한국어에서는 ‘넣다’로 간결하게 살리고, 금지의 초점을 보존했습니다.
theological_decisions:
- issue: 예언 공식과 직접 명령의 말투
  chosen_reading: 본문 서술은 합쇼체로 두되, 야훼의 직접 명령은 인용문 안에서 반말 명령형으로 유지했습니다.
  alternative_readings:
  - 인용문 안까지 모두 합쇼체로 완화
  - 직접 명령을 청유형으로 바꾸기
  rationale: 예언 본문은 하나님이 예레미야에게 직접 지시하는 장면이므로, 원문의 명령 강도를 약화시키지 않기 위해 인용문 내부의 명령형을 보존했습니다.
  doctrine_reference: 예언서의 직접 계시와 명령 전달 방식
