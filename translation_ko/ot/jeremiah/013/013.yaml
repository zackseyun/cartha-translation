id: JER.13.13
reference: Jeremiah 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֣י מְמַלֵּ֣א אֶת כָּל יֹשְׁבֵ֣י הָ/אָ֪רֶץ הַ/זֹּ֟את וְ/אֶת הַ/מְּלָכִ֣ים הַ/יֹּשְׁבִים֩ לְ/דָוִ֨ד עַל כִּסְא֜/וֹ וְ/אֶת הַ/כֹּהֲנִ֣ים וְ/אֶת הַ/נְּבִיאִ֗ים וְ/אֵ֛ת כָּל יֹשְׁבֵ֥י יְרוּשָׁלִָ֖ם שִׁכָּרֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/013.yaml
  text: 'Then you shall say to them[a], ‘Thus says Yahweh: Behold, I am about to fill all the inhabitants of this land—and the kings who sit on David’s throne, and the priests, and the prophets[b], and all the inhabitants of Jerusalem—with drunkenness.’'
  footnotes:
  - marker: a
    text: Or “the kings who sit on David’s throne.” The Hebrew more literally says “the kings who sit for David on his throne,” highlighting their dynastic succession to David.
    reason: lexical_alternative
  - marker: b
    text: “Drunkenness” is likely metaphorical for divinely imposed disorientation and judgment, though the image is intentionally left concrete.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. 「야훼께서 이렇게 말씀하십니다. 보십시오, 내가 이 땅의 모든 주민과 다윗의 왕좌에 앉아 있는 왕들[a], 제사장들, 예언자들, 그리고 예루살렘의 모든 주민을 술취함으로 가득 채우려 합니다[b].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 “다윗을 위하여 그의 왕좌에 앉아 있는 왕들”이라고 더 직역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘술취함’은 야훼께서 내리시는 혼미와 판단 상실을 가리키는 비유일 가능성이 크지만, 본문은 그 구체적인 이미지를 그대로 유지합니다.
    reason: theological_note
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: Then you shall say to them
  chosen_korean: 그들에게 이렇게 말하십시오
  alternatives_korean:
  - 그리고 그들에게 말하십시오
  - 그들에게 말하십시오
  lexicon: HALOT
  rationale: 예언자에게 주어진 지시문의 순차적 흐름을 살리되, 한국어에서는 ‘그들에게 이렇게 말하십시오’가 가장 자연스럽고 직관적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / POB doctrine glossary
  rationale: 계약적 신명 YHWH를 공문체적으로 음역해, 본문이 드러내는 고유한 하나님의 이름을 보존합니다.
- source_word: הִנְנִי מְמַלֵּא
  english_pob_choice: Behold, I am about to fill
  chosen_korean: 보십시오, 내가 … 가득 채우려 합니다
  alternatives_korean:
  - 보십시오, 내가 채웁니다
  - 보십시오, 내가 채울 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조와 임박한 행위를 함께 살리기 위해 ‘보십시오’와 ‘가득 채우려 합니다’를 사용했습니다.
- source_word: כָּל יֹשְׁבֵי הָאָרֶץ הַזֹּאת
  english_pob_choice: all the inhabitants of this land
  chosen_korean: 이 땅의 모든 주민
  alternatives_korean:
  - 이 땅의 모든 거주자
  - 이 땅에 사는 모든 사람
  lexicon: HALOT
  rationale: יֹשְׁבֵי는 ‘거주하는 사람들/주민들’의 관용 표현이므로, 문맥상 ‘이 땅’과 결합한 ‘주민’이 가장 자연스럽습니다.
- source_word: שִׁכָּרוֹן
  english_pob_choice: drunkenness
  chosen_korean: 술취함
  alternatives_korean:
  - 취함
  - 술에 취한 상태
  lexicon: HALOT
  rationale: 형벌로 주어지는 혼미와 비틀림의 이미지를 보존하기 위해, 추상화보다 직접적인 ‘술취함’을 택했습니다.
theological_decisions:
- issue: 야훼의 심판 이미지로서 ‘술취함’ 유지
  chosen_reading: ‘술취함’은 문자적 주취를 넘어 하나님이 주시는 혼미와 판단 상실의 심판 이미지를 그대로 유지합니다.
  alternative_readings:
  - 혼미
  - 어리둥절함
  - 취한 상태
  rationale: 예언자적 비유의 충격과 구체성을 약화시키지 않기 위해, 본문의 강한 이미지 자체를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
