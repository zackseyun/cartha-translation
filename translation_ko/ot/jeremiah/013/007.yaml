  - 대님
  - 허리끈
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 의복을 가리키므로, 현대 한국어에서 가장 자연스럽고 구체적인 ‘허리띠’가 적절합니다.
- source_word: טְמַנְתִּיו
  english_pob_choice: I had hidden it
  chosen_korean: 내가 숨겨 두었던
  alternatives_korean:
  - 내가 감추었던
  - 내가 묻어 두었던
  lexicon: HALOT
  rationale: טמן은 숨기다/감추다의 뜻이 기본이므로, 앞의 ‘파고’와 함께 나오더라도 ‘묻다’로 과도하게 좁히지 않고 ‘숨겨 두다’로 옮기는 것이 좋습니다.
