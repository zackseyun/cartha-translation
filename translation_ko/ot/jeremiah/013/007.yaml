base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/007.yaml
  text: So I went to Perath[a], and dug, and took the waistband from the place where I had hidden it. And behold, the waistband was ruined[b]; it was good for nothing.
  footnotes:
  - marker: a
    text: Perath may refer to the Euphrates; the Hebrew reads the place name 'Perath.'
    reason: alternative_reading
  - marker: b
    text: Or 'belt,' 'loincloth,' or 'sash.' The Hebrew denotes a garment worn around the waist.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 내가 프라트까지 가서 파고, 내가 숨겨 두었던 곳에서 허리띠를 가져왔습니다. 그런데 보십시오, 그 허리띠는 망가져서 아무 쓸모도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘프라트’는 히브리어 지명 형태를 따른 음역이며, 유프라테스를 가리킬 가능성도 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 허리에 두르는 의복을 가리키며, ‘띠’, ‘허리띠’, ‘대님’, ‘띠끈’ 등으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרָתָה
  english_pob_choice: Perath
  chosen_korean: 프라트
  alternatives_korean:
  - 유프라테스로
  - 유프라테스 강으로
  lexicon: HALOT
  rationale: 히브리어는 지명 형태를 사용하므로 본문에는 음역을 두고, 유프라테스 강과의 연관 가능성은 주석으로 남기는 것이 원문과 POB의 처리에 맞습니다.
- source_word: אֵזוֹר
  english_pob_choice: waistband
  chosen_korean: 허리띠
  alternatives_korean:
  - 띠
  - 대님
  - 허리끈
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 의복을 가리키므로, 현대 한국어에서 가장 자연스럽고 구체적인 ‘허리띠’가 적절합니다.
- source_word: טְמַנְתִּיו
  english_pob_choice: I had hidden it
  chosen_korean: 내가 숨겨 두었던
  alternatives_korean:
  - 내가 감추었던
  - 내가 묻어 두었던
  lexicon: HALOT
  rationale: טמן은 숨기다/감추다의 뜻이 기본이므로, 앞의 ‘파고’와 함께 나오더라도 ‘묻다’로 과도하게 좁히지 않고 ‘숨겨 두다’로 옮기는 것이 좋습니다.
- source_word: נִשְׁחַת
  english_pob_choice: was ruined
  chosen_korean: 망가져서
  alternatives_korean:
  - 망가져
  - 훼손되어
  - 상해
  lexicon: HALOT
  rationale: 수동형으로 상태 변화를 나타내므로, 현대 한국어에서 자연스럽게 읽히는 ‘망가져서’가 원문의 손상 상태를 잘 드러냅니다.
- source_word: לֹא יִצְלַח לַכֹּל
  english_pob_choice: it was good for nothing
  chosen_korean: 아무 쓸모도 없었습니다
  alternatives_korean:
  - 아무 쓸모가 없었습니다
  - 전혀 쓸모가 없었습니다
  - 아무 데도 쓰지 못했습니다
  lexicon: HALOT
  rationale: 관용구로서 완전한 무용함을 뜻하므로, ‘좋지 않다’보다 ‘아무 쓸모도 없다’가 의미를 정확하고 자연스럽게 전달합니다.
