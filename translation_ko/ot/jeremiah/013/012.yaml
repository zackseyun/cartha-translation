  yaml_path: translation/ot/jeremiah/013/012.yaml
  text: 'So you shall say to them this word: Thus says the LORD, the God of Israel, ‘Every jar will be filled with wine.’ And they will say to you, ‘Do we not certainly know that every jar will be filled with wine?’'
translation:
  language: ko
  text: 너는 그들에게 이 말을 전해야 합니다. “야훼, 이스라엘의 하나님이 이렇게 말씀하십니다. ‘모든 항아리는 포도주로 가득 차게 될 것이다.’” 그들이 너에게 이렇게 말할 것입니다. “모든 항아리가 포도주로 가득 차게 된다는 것은 우리가 정말 잘 알고 있지 않습니까?”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘항아리’(נֵבֶל)라고만 말하며, 여기서는 포도주를 담는 도기 용기를 가리킵니다.
    reason: source_note
