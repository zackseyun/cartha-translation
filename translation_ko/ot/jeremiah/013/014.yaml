revisions:
- from: 내가 그들을 서로 부딪치게 하겠습니다[a], 곧 사람마다 그의 형제와, 아버지들과 아들들이 함께 그러할 것입니다. 야훼의 말씀입니다. 나는 아끼지 않겠고, 불쌍히 여기지 않겠으며, 동정하지도 않겠습니다[b], 그들을 멸망시키는 일에서.
  to: 내가 그들을 서로 맞부딪치게 하여 산산이 부수겠습니다[a]. 각 사람을 자기 형제와 맞부딪치게 하고[b], 아버지들과 아들들도 함께 맞부딪치게 하겠습니다. 야훼의 말씀입니다. 나는 그들을 멸망시키지 않으려고 아껴 두지도 않고, 불쌍히 여기지도 않으며, 자비를 베풀지도 않겠습니다.
  rationale: נפץ의 폭력적 파괴를 ‘서로 맞부딪치게 하여 산산이 부수다’로 드러내고, איש אל־אחיו 및 아버지들과 아들들의 병렬을 각각 명시했습니다. 마지막 מֵהַשְׁחִיתָם은 한국어에서 자연스러운 부정 목적 표현인 ‘그들을 멸망시키지 않으려고’로 옮겨, 세 겹의 부정이 멸망을 피하려는 자비로운 억제를 거부한다는 뜻을 보존했습니다. 각주 b도 설명 대상 표현에 붙였습니다.
  reviewer_model: gpt-5.6-terra
