id: JER.13.14
reference: Jeremiah 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נִפַּצְתִּי/ם֩ אִ֨ישׁ אֶל אָחִ֜י/ו וְ/הָ/אָב֧וֹת וְ/הַ/בָּנִ֛ים יַחְדָּ֖ו נְאֻם יְהוָ֑ה לֹֽא אֶחְמ֧וֹל וְ/לֹֽא אָח֛וּס וְ/לֹ֥א אֲרַחֵ֖ם מֵ/הַשְׁחִיתָֽ/ם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/014.yaml
  text: And I will smash them against each other[a], man against his brother, fathers and sons together, declares Yahweh. I will not spare, nor will I pity, nor will I have compassion[b], from destroying them.
  footnotes:
  - marker: a
    text: Or 'dash them against each other' or 'shatter them against each other.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'man against his brother,' preserving the masculine singular and kinship language.
    reason: cultural_note
translation:
  language: ko
  text: 내가 그들을 서로 부딪치게 하겠습니다[a], 곧 사람마다 그의 형제와, 아버지들과 아들들이 함께 그러할 것입니다. 야훼의 말씀입니다. 나는 아끼지 않겠고, 불쌍히 여기지 않겠으며, 동정하지도 않겠습니다[b], 그들을 멸망시키는 일에서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘서로 내리치게 하다’, ‘서로 산산이 부수다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘사람마다 그의 형제와’라는 남성 단수 친족 표현을 유지합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְנִפַּצְתִּים
  english_pob_choice: And I will smash them
  chosen_korean: 내가 그들을 서로 부딪치게 하겠습니다
  alternatives_korean:
  - 내가 그들을 서로 산산이 부수겠습니다
  - 내가 그들을 서로 내리치겠습니다
  lexicon: HALOT
  rationale: נפץ의 폭력적 파괴 이미지를 살리면서도, 사람들을 향한 표현으로는 한국어에서 자연스럽게 읽히는 ‘서로 부딪치게 하다’가 원문의 충격을 유지합니다.
- source_word: אִישׁ אֶל אָחִיו
  english_pob_choice: man against his brother
  chosen_korean: 곧 사람마다 그의 형제와
  alternatives_korean:
  - 곧 각 사람이 그의 형제와
  - 곧 한 사람씩 그의 형제와
  lexicon: HALOT
  rationale: 히브리어의 남성 단수와 친족 언어를 살리기 위해 ‘사람마다 그의 형제와’로 옮기고, 관계의 붕괴를 드러내는 방식으로 처리했습니다.
- source_word: וְהָאָבוֹת וְהַבָּנִים יַחְדָּו
  english_pob_choice: fathers and sons together
  chosen_korean: 아버지들과 아들들이 함께
  alternatives_korean:
  - 아버지들과 아들들이 함께
  - 부모와 자녀가 함께
  lexicon: HALOT
  rationale: 원문이 성별이 명시된 친족 관계를 사용하므로, 일반화하지 않고 ‘아버지들과 아들들’로 구체성을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식 נְאֻם יְהוָה는 현대 한국어에서 자연스러운 종결 공식인 ‘야훼의 말씀입니다’로 옮겨, 신탁의 어조를 보존했습니다.
- source_word: לֹא אֶחְמֹל וְלֹא אָחוּס וְלֹא אֲרַחֵם
  english_pob_choice: I will not spare, nor will I pity, nor will I have compassion
  chosen_korean: 나는 아끼지 않겠고, 불쌍히 여기지 않겠으며, 동정하지도 않겠습니다
  alternatives_korean:
  - 나는 아끼지 않겠고, 불쌍히 여기지 않겠으며, 긍휼을 베풀지 않겠습니다
  - 나는 용서하지 않겠고, 불쌍히 여기지 않겠으며, 동정하지도 않겠습니다
  lexicon: HALOT
  rationale: 세 동사의 의미적 겹침을 한국어에서도 세 단계의 누적 부정으로 살리되, 각각을 완전히 같은 말로 평평하게 만들지 않도록 구분했습니다.
- source_word: מֵהַשְׁחִיתָם
  english_pob_choice: from destroying them
  chosen_korean: 그들을 멸망시키는 일에서
  alternatives_korean:
  - 그들을 멸망시키는 것에서
  - 그들을 파괴하는 일에서
  lexicon: HALOT
  rationale: מִן+부정사 구조의 출발점을 살려 직역에 가깝게 처리하되, 한국어에서는 ‘일에서’가 가장 자연스럽게 부정된 행위의 범위를 드러냅니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명(יהוה)을 직접 드러내기 위해 전통적 대체어 ‘주’ 대신 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언적 심판의 삼중 부정
  chosen_reading: 아끼지 않겠고, 불쌍히 여기지 않겠으며, 동정하지도 않겠습니다
  alternative_readings:
  - 아끼지 않겠습니다, 불쌍히 여기지 않겠습니다, 동정하지 않겠습니다
  - 용서하지 않겠습니다, 긍휼을 베풀지 않겠습니다
  rationale: 원문의 수사적 누적을 보존하기 위해 세 동사의 병렬 구조를 그대로 살렸으며, 심판 선언의 냉혹함을 완화하지 않았습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
