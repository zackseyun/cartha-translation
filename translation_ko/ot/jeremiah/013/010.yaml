  source_fidelity: 히브리어의 핵심 요소—‘악한 백성’, 듣기를 의도적으로 거부함, 마음의 완고함을 따르는 지속적 행위, 다른 신들을 따르며 섬기고 절함, 그리고 띠처럼 전혀 쓸모없게 되는 결과—가 모두 보존되어 있습니다. 다만 원문의 복수 분사들이 가리키는 백성을 한국어에서 ‘자들이니’로 연결한 현 문장은 어색하고, 집단 명사와 복수 인칭의 호응도 다듬는 편이 정확하고 자연스럽습니다.
  naturalness: ‘이 악한 백성은 … 자들이니’는 현대 표준어 합쇼체 성경 문장으로 다소 부자연스럽습니다. ‘이 악한 백성, 곧 … 자들은’으로 동격 관계를 명시하면 원문의 수식 구조와 한국어 문장 구조가 모두 명료해집니다. ‘아무 데도’는 부정문과 함께 쓰일 때 자연스러우므로 ‘아무 데에도 쓸모없게’로 고쳤습니다.
  terminology: ‘백성’, ‘악한’, ‘섬기고’, ‘절하는’은 적절합니다. 특히 עבד와 השתחוה를 각각 ‘섬기다’와 ‘절하다’로 구별한 것은 본문의 두 동사를 보존합니다. אֵזוֹר는 본문에서 ‘띠’로 번역할 수 있으며, 각주에서는 허리띠·띠·허리천이라는 범위를 간결하고 정확하게 제시하는 것이 좋습니다.
