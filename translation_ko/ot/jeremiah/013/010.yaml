base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/010.yaml
  text: This evil people[a], who refuse to hear my words, who walk in the stubbornness of their heart, and who go after other gods to serve them and to bow down to them, will become like this waistband, which is good for nothing.
  footnotes:
  - marker: a
    text: Or 'belt' or 'sash'; the Hebrew אֵזוֹר refers to a garment worn around the waist. In the sign-act context of Jeremiah 13, English versions vary among 'waistband,' 'belt,' and 'loincloth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 악한 백성은 내 말을 듣기를 거부하고, 자기 마음의 완고함대로 걸으며, 다른 신들을 따라가 그들을 섬기고 그들에게 절하는 자들이니, 이 띠처럼 아무 데도 쓸모없게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֵזוֹר는 허리띠, 띠, 허리천 등으로 옮길 수 있는 옷의 허리 부분에 두르는 용어입니다. 예레미야 13장의 표징 행위 문맥에서는 ‘띠’가 가장 간결하지만, 영어 POB의 대안 노트처럼 ‘허리띠’도 가능한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם הַזֶּה הָרָע
  english_pob_choice: This evil people
  chosen_korean: 이 악한 백성
  alternatives_korean:
  - 이 악한 사람들
  - 이 악한 민족
  lexicon: HALOT
  rationale: עָם은 여기서 집단 전체를 가리키므로 ‘백성’이 자연스럽고, רָע는 예언자적 질책의 강도를 살려 ‘악한’으로 옮겼습니다.
- source_word: הַמֵּאֲנִים לִשְׁמוֹעַ אֶת דְּבָרַי
  english_pob_choice: who refuse to hear my words
  chosen_korean: 내 말을 듣기를 거부하고
  alternatives_korean:
  - 내 말을 들으려 하지 않고
  - 내 말을 듣기를 원치 않고
  lexicon: HALOT
  rationale: מָאֵן은 단순한 불능이 아니라 의도적 거부를 뜻하므로 ‘거부하고’로 살렸고, ‘내 말들’보다 ‘내 말’이 한국어에서는 자연스럽습니다.
- source_word: בִּשְׁרִרוּת לִבָּם
  english_pob_choice: who walk in the stubbornness of their heart
  chosen_korean: 자기 마음의 완고함대로 걸으며
  alternatives_korean:
  - 자기 마음의 완고함 가운데 걸으며
  - 마음의 완고함을 따라 걸으며
  lexicon: HALOT
  rationale: שְׁרִרוּת는 고집과 완강함의 뉘앙스를 가지므로 ‘완고함’으로 옮겼고, 관용구의 방향성을 살려 ‘-대로’로 처리했습니다.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים לְעָבְדָם וּלְהִשְׁתַּחֲוֺת לָהֶם
  english_pob_choice: and who go after other gods to serve them and to bow down to them
  chosen_korean: 다른 신들을 따라가 그들을 섬기고 그들에게 절하는
  alternatives_korean:
  - 다른 신들을 따라가 그들을 섬기고 그들에게 엎드리는
  - 다른 신들을 따라가 그들을 예배하고 그들에게 절하는
  lexicon: HALOT
  rationale: עבד와 השתחוה를 한국어에서 분리해 ‘섬기고’와 ‘절하는’으로 옮겨, 두 가지 우상숭배 행위를 구분했습니다.
- source_word: כָּאֵזוֹר הַזֶּה אֲשֶׁר לֹא יִצְלַח לַכֹּל
  english_pob_choice: like this waistband, which is good for nothing
  chosen_korean: 이 띠처럼 아무 데도 쓸모없게 될 것입니다
  alternatives_korean:
  - 이 허리띠처럼 아무 데도 쓸모없게 될 것입니다
  - 이 띠처럼 쓸모없는 존재가 될 것입니다
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 띠/허리띠를 가리키며, 사역문맥의 구체성을 살리되 현대 한국어에서 자연한 ‘띠’를 택했습니다. לֹא יִצְלַח לַכֹּל은 관용적으로 ‘아무 데도 쓸모없다’로 옮겼습니다.
theological_decisions:
- issue: 우상숭배 동사의 이중성 보존
  chosen_reading: ‘섬기고’와 ‘절하는’으로 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 ‘예배하다’로 통합한다
  - 둘 다 ‘경배하다’로 통합한다
  rationale: 히브리어는 ‘섬기다’(עבד)와 ‘엎드리다/절하다’(השתחוה)를 구분해 사용하므로, 이를 평면화하지 않고 각각의 행동을 드러내는 것이 본문의 고발을 더 정확히 전달합니다.
  doctrine_reference: Translation philosophy §5 (key-term consistency with documented exceptions)
