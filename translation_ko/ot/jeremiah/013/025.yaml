source:
  edition: WLC
  text: זֶ֣ה גוֹרָלֵ֧/ךְ מְנָת מִדַּ֛יִ/ךְ מֵֽ/אִתִּ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֙ שָׁכַ֣חַתְּ אוֹתִ֔/י וַֽ/תִּבְטְחִ֖י בַּ/שָּֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/025.yaml
  text: This is your lot[a], the portion measured out to you from me, declares Yahweh[b], because you have forgotten me and trusted in falsehood.
  footnotes:
  - marker: a
    text: Or 'your fate' or 'your allotted share.' The Hebrew combines terms for 'lot' and 'portion,' emphasizing what has been assigned to her.
    reason: lexical_alternative
  - marker: b
    text: Or 'trusted in lies.' The Hebrew שֶׁקֶר can mean 'falsehood,' 'lie,' or 'deception.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 너의 몫이며, 내게서 네게 재어 주어진 분깃입니다. 야훼의 말씀이니, 네가 나를 잊고 거짓을 신뢰하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘몫’은 여기서 단순한 소유가 아니라, 심판으로 배정된 할당분의 의미를 함께 담습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거짓’은 ‘허위’, ‘속임수’, ‘헛것’의 의미 범위를 포괄합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גוֹרָלֵךְ / מְנָת מִדַּיִךְ
  english_pob_choice: your lot / the portion measured out to you
  chosen_korean: 너의 몫이며, 내게서 네게 재어 주어진 분깃
  alternatives_korean:
  - 너의 운명이며, 네게 할당된 몫
  - 너의 분깃이며, 네게 정해진 몫
  lexicon: HALOT
  rationale: גוֹרָל과 מְנָה/מִדָּה의 이중 표현을 살려, 단순한 ‘운명’보다 할당·배분된 몫이라는 판단적 의미를 드러냈습니다.
- source_word: מֵאִתִּי
  english_pob_choice: from me
  chosen_korean: 내게서
  alternatives_korean:
  - 나로부터
  - 내 편에서
  lexicon: HALOT
  rationale: 심판의 몫이 야훼에게서 온다는 출처 관계를 한국어로 자연스럽게 압축해 표현했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언 공식을 한국어 성경체에서 자연스러운 종결로 옮기되, 신적 발화를 표지하는 공시적 문구로 처리했습니다.
- source_word: בַּשָּׁקֶר
  english_pob_choice: in falsehood
  chosen_korean: 거짓을 신뢰하였기 때문입니다
  alternatives_korean:
  - 거짓 안에서 신뢰하였기 때문입니다
  - 속임수를 믿었기 때문입니다
  lexicon: HALOT
  rationale: שֶׁקֶר의 범위를 ‘거짓/허위/속임’ 중 과도하게 특정하지 않고, 신뢰의 대상이 허위였음을 한국어에서 직접적으로 드러냈습니다.
theological_decisions:
- issue: 야훼(YHWH) 표기
  chosen_reading: 고유명사 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - the LORD에 해당하는 ‘주님’
  - ‘여호와’ 표기
  rationale: 본문이 יְהוָה를 직접 사용하므로, 번역어를 대체 칭호로 숨기지 않고 신적 고유명을 보존하는 프로젝트 원칙을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 2인칭 여성 단수의 집합적 대상
  chosen_reading: ‘너’로 유지해 유다/예루살렘을 의인화한 집합적 주소를 보존했습니다.
  alternative_readings:
  - 유다야/예루살렘아를 명시
  - 복수적 표현으로 풀어쓰기
  rationale: 히브리어의 여성 단수 호칭을 문맥상 공동체에 대한 직접 경고로 유지해야 하므로, 원문에 없는 명시적 명사를 덧붙이지 않았습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy'
