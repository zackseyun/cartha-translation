    rationale: ‘겨’는 이 본문의 히브리어 단어와 정확히 일치하는 등가어로 단정하기 어렵습니다. 짚·그루터기 및 바람에 날리는 마른 식물 조각이라는 범위로 설명하는 것이 안전합니다.
