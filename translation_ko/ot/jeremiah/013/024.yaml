    issue: ‘광야의 바람 앞에 지나가는 지푸라기’의 수식 관계가 한국어에서 부자연스럽습니다.
    rationale: 이 표현은 ‘지푸라기’가 바람 앞을 스스로 지나가는 듯 들릴 수 있습니다. 히브리어의 비유는 광야의 바람에 의해 날려 가는 마른 식물을 가리키므로, 바람과의 관계를 ‘바람에 날려 가는’으로 명시하는 편이 충실합니다.
