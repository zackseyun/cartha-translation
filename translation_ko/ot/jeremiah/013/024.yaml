  rationale: 원문의 심판 선언과 ‘바람에 휩쓸리는 마른 식물’ 비유를 보존하면서, 기존 한국어 표현에서 생기는 수식 관계의 어색함을 바로잡았습니다. ‘검불’은 문맥에 맞는 자연스러운 번역어이며, 각주에서 קַשׁ의 더 넓은 어휘 범위를 밝혔습니다.
