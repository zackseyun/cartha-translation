translation:
  language: ko
  text: 그러므로 내가 그들을 광야 바람에 날려 가는 검불처럼 흩어 버리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘검불’로 옮긴 히브리어 קַשׁ은 짚이나 그루터기, 또는 바람에 날리는 마른 식물 조각을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲפִיצֵם
  english_pob_choice: So I will scatter them
  chosen_korean: 내가 그들을 흩어 버리겠습니다
  alternatives_korean:
  - 내가 그들을 흩겠습니다
  - 내가 그들을 흩어 놓겠습니다
  lexicon: WLC/HALOT
  rationale: 1인칭 단수의 Hiphil 완료형에 이어지는 예언적 확언으로, 한국어에서는 미래의 단호한 행위로 자연스럽게 옮기는 것이 좋습니다. '흩어 버리겠습니다'는 심판의 파괴적 뉘앙스를 담습니다.
- source_word: כקש
  english_pob_choice: like chaff
  chosen_korean: 지푸라기처럼
  alternatives_korean:
  - 겨처럼
  - 짚부스러기처럼
  lexicon: HALOT
  rationale: קַשׁ은 문맥상 바람에 쉽게 날리는 마른 짚/겨 같은 물건을 가리키므로, 한국어에서는 독자가 즉시 상상할 수 있는 '지푸라기'를 택했습니다. POB의 'chaff'와도 동일한 무상함의 이미지를 전달합니다.
- source_word: עובר
  english_pob_choice: passing away
  chosen_korean: 지나가는
  alternatives_korean:
  - 스쳐 지나가는
  - 사라져 가는
  lexicon: HALOT
  rationale: 분사 עֹבֵר는 '지나가는/통과하는'의 지속적 이미지를 주므로, 한국어에서도 현재분사적 형용사로 처리했습니다. '사라져 가는'은 해석이 더 강해져서 피했습니다.
- source_word: לְרוּחַ מִדְבָּר
  english_pob_choice: before the desert wind
  chosen_korean: 광야의 바람 앞에
  alternatives_korean:
  - 광야 바람에
  - 광야의 바람에
  lexicon: HALOT
  rationale: לְרוּחַ는 단순한 수단보다 바람 앞에 놓여 휩쓸리는 방향성을 나타내므로, '앞에'로 옮겨 원문의 장면성을 살렸습니다. מִדְבָּר은 여기서 '광야'와 '사막'이 모두 가능하지만, 예언문학의 관용적 배경을 고려해 '광야'를 택했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 시제 처리
  chosen_reading: 미래형 청유가 아니라 하나님이 실제로 하실 심판 행위로 '흩어 버리겠습니다'라고 옮겼습니다.
  alternative_readings:
  - 흩겠습니다
  - 흩어 놓겠습니다
  rationale: 본문은 예언자적 화법으로 하나님의 확정된 심판을 말하므로, 단순 명령이나 서술 과거가 아니라 단호한 미래형으로 재현하는 것이 원문 기능에 가장 가깝습니다.
  doctrine_reference: 예언서의 심판 선언 화법
- issue: '''광야/사막'' 이미지 선택'
  chosen_reading: '''광야''를 택해 황량하고 바람 센 심판 이미지를 살렸습니다.'
  alternative_readings:
  - 사막
  - 황야
  rationale: מִדְבָּר의 기본 범위는 넓지만, 한국어 성경에서 '광야'는 하나님의 심판과 시험, 황량함을 함께 환기하는 전형적 표현입니다.
  doctrine_reference: 예언적 상징 언어
