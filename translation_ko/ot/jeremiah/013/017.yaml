id: JER.13.17
reference: Jeremiah 13:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִם֙ לֹ֣א תִשְׁמָע֔וּ/הָ בְּ/מִסְתָּרִ֥ים תִּבְכֶּֽה נַפְשִׁ֖/י מִ/פְּנֵ֣י גֵוָ֑ה וְ/דָמֹ֨עַ תִּדְמַ֜ע וְ/תֵרַ֤ד עֵינִ/י֙ דִּמְעָ֔ה כִּ֥י נִשְׁבָּ֖ה עֵ֥דֶר יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/017.yaml
  text: But if you will not listen[a], my soul will weep in secret because of pride; my eyes will weep bitterly and run down with tears[e][d][c][b], because the flock of Yahweh has been taken captive.
  footnotes:
  - marker: a
    text: Or 'hear it' or 'obey it'; the Hebrew verb can carry both the sense of hearing and heeding.
    reason: lexical_alternative
  - marker: b
    text: Literally 'in hidden places.'
    reason: lexical_alternative
  - marker: c
    text: Or 'because of arrogance.'
    reason: lexical_alternative
  - marker: d
    text: 'The Hebrew intensifies the verb: ''weeping, it will weep.'''
    reason: lexical_alternative
  - marker: e
    text: Or 'the LORD's flock.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여러분이 그것을 듣지 않으시면[a], 내 영혼은 은밀한 곳에서[b] 교만 때문에[c] 울 것이며, 내 눈은 울고 또 울며[d] 눈물을 흘릴 것입니다. 야훼의 양 떼가[e] 포로로 잡혀 갔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣다’는 여기서 ‘들어 받아들이다’ 또는 ‘순종하다’라는 뜻까지 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘숨은 곳들에서’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘교만으로 인해’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 히브리어는 동사를 겹쳐 써서 울음의 강도를 강조합니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 ‘주님의 양 떼’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁמָעוּהָ
  english_pob_choice: you will not listen
  chosen_korean: 여러분이 듣지 않으시면
  alternatives_korean:
  - 여러분이 그 말을 듣지 않으시면
  - 여러분이 순종하지 않으시면
  lexicon: HALOT
  rationale: שׁמע는 문맥에 따라 ‘듣다’와 ‘순종하다’를 아우르므로, 직전의 경고를 받아들이라는 요청의 흐름을 살려 기본 의미인 ‘듣다’를 쓰되, 조건문으로 불순종의 뉘앙스도 함께 드러냈습니다.
- source_word: בְּמִסְתָּרִים
  english_pob_choice: in secret
  chosen_korean: 은밀한 곳에서
  alternatives_korean:
  - 비밀리에
  - 숨은 곳에서
  lexicon: HALOT
  rationale: 직역하면 ‘숨은 곳들’이지만, 예언자의 숨겨진 애곡을 자연스러운 현대 한국어로 옮기기 위해 ‘은밀한 곳에서’로 풀었습니다.
- source_word: תִּבְכֶּה נַפְשִׁי
  english_pob_choice: my soul will weep
  chosen_korean: 내 영혼은 … 울 것이며
  alternatives_korean:
  - 내 혼은 … 울 것이며
  - 내가 … 울 것이며
  lexicon: HALOT
  rationale: נפשׁ를 단순한 ‘나’로 평탄화하지 않고, 내면의 고통을 살리는 ‘영혼’을 택해 주체가 울고 있는 정서를 보존했습니다.
- source_word: מִפְּנֵי גֵוָה
  english_pob_choice: because of pride
  chosen_korean: 교만으로 인해
  alternatives_korean:
  - 오만으로 인해
  - 교만 때문에
  lexicon: HALOT
  rationale: 문맥상 원인은 백성의 태도이므로 ‘because of’의 인과를 분명히 하고, גֵוָה는 가장 직접적인 대응어인 ‘교만’으로 옮겼습니다.
- source_word: וְדָמֹעַ תִּדְמַע וְתֵרַד עֵינִי דִּמְעָה
  english_pob_choice: will weep bitterly and run down with tears
  chosen_korean: 쓰라리게 울며 눈물을 흘릴 것입니다
  alternatives_korean:
  - 한없이 울며 눈물을 흘릴 것입니다
  - 울고 또 울며 눈물을 흘릴 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조 구조(‘울어, 울다’)와 ‘눈물이 흐르다’는 이미지를 한국어의 자연스러운 중첩 표현으로 압축해, 강한 통곡과 흐르는 눈물을 함께 살렸습니다.
- source_word: נִשְׁבָּה עֵדֶר יְהוָה
  english_pob_choice: the flock of Yahweh has been taken captive
  chosen_korean: 야훼의 양 떼가 사로잡혀 갔기 때문입니다
  alternatives_korean:
  - 야훼의 양 떼가 포로로 잡혀 갔기 때문입니다
  - 야훼의 양 떼가 끌려갔기 때문입니다
  lexicon: HALOT
  rationale: נִשְׁבָּה는 ‘사로잡히다/포로가 되다’의 수동형이므로 ‘사로잡혀 갔다’로 옮겨 포로 상태를 분명히 했고, עֵדֶר는 목자-양 무리의 이미지를 살려 ‘양 떼’로 번역했습니다.
theological_decisions:
- issue: 본문의 1인칭 애곡이 누구의 슬픔인가
  chosen_reading: 예레미야가 유다의 교만과 포로됨을 두고 개인적으로 애통하는 말씀으로 읽습니다.
  alternative_readings:
  - 야훼께서 예언자를 통해 자신의 슬픔을 드러내시는 것으로도 읽을 수 있습니다.
  - 예언자와 하나님의 애통이 겹쳐 있는 예언적 슬픔으로 볼 수 있습니다.
  rationale: 본문은 1인칭 화자의 애곡을 직접 제시하므로 번역은 그 주체를 흐리지 않되, 예언자적 대변 특유의 신학적 긴장은 해소하지 않고 남겨 둡니다.
  doctrine_reference: 예언자적 발화의 1인칭을 보존하면서, 하나님의 감정이 매개될 수 있는 긴장을 유지합니다.
