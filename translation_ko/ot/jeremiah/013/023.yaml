reference: Jeremiah 13:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יַהֲפֹ֤ךְ כּוּשִׁי֙ עוֹר֔/וֹ וְ/נָמֵ֖ר חֲבַרְבֻּרֹתָ֑י/ו גַּם אַתֶּם֙ תּוּכְל֣וּ לְ/הֵיטִ֔יב לִמֻּדֵ֖י הָרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/023.yaml
  text: Can a Cushite change his skin[b][a], or a leopard its spots? Then you also can do good—you who are trained in evil.
  footnotes:
  - marker: a
    text: Or 'Ethiopian.' The Hebrew says 'Cushite,' referring to a person from Cush.
    reason: lexical_alternative
  - marker: b
    text: Literally 'learned/taught of evil,' that is, habituated or trained in doing evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 구스 사람이 그의 피부를 바꿀 수 있겠습니까, 표범이 자기 얼룩을 바꿀 수 있겠습니까? 그러면 악에 익숙해진 너희도 선을 행할 수 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구스 사람’은 히브리어 כּוּשִׁי를 직역한 것으로, 전통적 한국어 번역의 ‘에티오피아 사람’보다 원어의 민족명을 더 직접적으로 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악에 익숙해진’은 직역하면 ‘악을 배운/가르침 받은’에 가깝고, 반복된 습관으로 굳어진 상태를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוּשִׁי
  english_pob_choice: Cushite
  chosen_korean: 구스 사람
  alternatives_korean:
  - 구스인
  - 에티오피아 사람
  lexicon: HALOT
  rationale: 히브리어 민족명 כּוּשִׁי를 직접 반영하되, 한국어에서는 이해를 돕기 위해 ‘사람’으로 풀어 자연스럽게 옮겼습니다.
- source_word: עוֹרוֹ
  english_pob_choice: his skin
  chosen_korean: 그의 피부
  alternatives_korean:
  - 그의 살갗
  - 그의 가죽
  lexicon: HALOT
  rationale: 비교 대상이 사람인 점을 살려 동물적 뉘앙스의 ‘가죽’보다 ‘피부’가 더 정확합니다.
- source_word: חֲבַרְבֻּרֹתָיו
  english_pob_choice: its spots
  chosen_korean: 자기 얼룩
  alternatives_korean:
  - 자기 반점
  - 자기 점무늬
  lexicon: HALOT
  rationale: 표범의 특징적 무늬를 뜻하므로 ‘얼룩’이 가장 자연스럽고 간결합니다.
- source_word: לִמֻּדֵי הָרֵעַ
  english_pob_choice: trained in evil
  chosen_korean: 악에 익숙해진
  alternatives_korean:
  - 악을 배운
  - 악으로 훈련된
  - 악에 길든
  lexicon: HALOT
  rationale: 문맥상 단순한 학습이 아니라 습관화·훈련된 상태를 가리키므로 ‘익숙해진’이 POB의 의미를 가장 잘 드러냅니다.
theological_decisions:
- issue: 수사적 불가능성으로 드러내는 유다의 도덕적 경직성
  chosen_reading: 이 절은 자연적 특성의 변경 불가능성을 빌려, 악에 길든/익숙해진 상태의 심각한 고착성을 드러냅니다.
  alternative_readings:
  - 보편적 인간 무능에 대한 교리적 진술
  - 단순한 과장법에 불과한 진술
  rationale: 히브리어의 비교 구조를 그대로 살려, 본문이 직접 말하는 범위를 넘어서지 않으면서도 도덕적 불가능성의 힘을 보존했습니다.
  doctrine_reference: 본문의 비유적 불가능성은 보존하되, 체계신학적 확장은 유보합니다.
