revisions:
- from: 네가 산 허리띠를 — 네 허리에 있는 것을 — 가져다가 일어나서, 포랏으로 가서, 그것을 그곳 바위의 틈에 숨기십시오.[a]
  to: 네가 사서 허리에 두르고 있는 허리띠를 가져가십시오. 일어나 포랏으로 가서 그것을 այնտեղ 바위의 틈에 숨기십시오.[a]
  rationale: 현대 표준 한국어 합쇼체에 맞추어 2인칭 대명사를 삭제하고 명령형을 일관되게 유지했습니다. 히브리어의 ‘네가 산’과 ‘네 허리에 있는’이라는 관계절은 ‘네가 사서 허리에 두르고 있는’으로 결합했습니다. 지명은 음역으로 보존하고, 논쟁 가능한 전통적 지리 식별은 중립적인 각주로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:25Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 명령 연쇄(가져가라, 일어나라, 가라, 숨겨라), 허리에 착용한 띠, 포랏, 바위의 틈을 대체로 충실히 옮겼습니다. 다만 관계절 두 개가 가리키는 바를 한국어에서 더 자연스럽게 결합하여 ‘사서 허리에 두르고 있는 허리띠’로 표현하는 편이 분명합니다.
  naturalness: 초안의 ‘네가’와 종결형 ‘-십시오’는 현대 합쇼체 안에서 높임의 균형이 맞지 않으며, 대시로 삽입한 ‘네 허리에 있는 것을’도 다소 번역투입니다. 주어를 생략하고 관계절을 명사구 안에 통합하면 자연스러운 현대 공적 문체가 됩니다.
  terminology: ‘허리띠’, ‘포랏’, ‘바위의 틈’은 적절합니다. 포랏을 본문에서 음역하고 유프라테스 식별을 각주에 남기는 방식도 원문의 지명 형태와 논쟁 가능성을 보존합니다. 각주의 ‘식별되므로’는 전통적 식별을 확정적 근거처럼 들리게 할 수 있으므로 중립적으로 고칩니다.
  issues:
