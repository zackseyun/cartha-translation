base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/004.yaml
  text: Take the waistband that you bought[a], which is on your waist, and arise, go to Perath, and hide it there in a crevice of the rock.
  footnotes:
  - marker: a
    text: Perath is traditionally identified with the Euphrates; many translations therefore read 'the Euphrates.'
    reason: alternative_reading
translation:
  language: ko
  text: 네가 사서 허리에 두르고 있는 허리띠를 가져가십시오. 일어나 포랏으로 가서 그것을 այնտեղ 바위의 틈에 숨기십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 포랏은 전통적으로 유프라테스로 여겨지며, 많은 번역본은 이를 ‘유프라테스’로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵזוֹר
  english_pob_choice: waistband
  chosen_korean: 허리띠
  alternatives_korean:
  - 띠
  - 띠끈
  - 요대
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 띠류를 가리키므로, 한국어로는 자연스럽고 신체 부위와의 연결이 분명한 ‘허리띠’가 가장 무난합니다.
- source_word: קָנִיתָ
  english_pob_choice: you bought
  chosen_korean: 네가 산
  alternatives_korean:
  - 네가 구한
  - 네가 획득한
  lexicon: HALOT
  rationale: 동사는 여기서 단순히 ‘사다/구하다’의 뜻이므로, 본문의 구체성을 살려 ‘산’으로 옮겼습니다.
- source_word: פְּרָתָה
  english_pob_choice: Perath
  chosen_korean: 포랏
  alternatives_korean:
  - 유프라테스
  - 페라트
  lexicon: HALOT
  rationale: 지명은 원칙적으로 음역하되, 본문은 전통적 식별보다 히브리어 형태를 보존하는 편이 적합하므로 ‘포랏’으로 옮겼습니다.
- source_word: נְקִיק הַסָּלַע
  english_pob_choice: a crevice of the rock
  chosen_korean: 바위의 틈
  alternatives_korean:
  - 바위의 갈라진 틈
  - 바위 틈새
  lexicon: HALOT
  rationale: נְקִיק은 바위의 갈라진 틈/틈새를 뜻하므로, 현대 한국어에서 자연스러운 ‘바위의 틈’이 의미를 과장하지 않으면서도 충분히 구체적입니다.
theological_decisions:
- issue: פְּרָתָה 지명의 처리
  chosen_reading: 본문에는 ‘포랏’으로 두고, 전통적 식별인 ‘유프라테스’는 각주로 처리합니다.
  alternative_readings:
  - 본문을 ‘유프라테스’로 번역
  - 본문에 설명을 덧붙여 식별을 확정
  rationale: 이 구절은 지명 식별이 번역 전통상 논의되는 지점이므로, 본문은 히브리어 형태를 보존하고 독자 참고용으로만 대안을 제시하는 것이 원문과 주석의 균형에 맞습니다.
  doctrine_reference: Translation philosophy §2; §3
