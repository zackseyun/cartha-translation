  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָרֵ֥י הַ/נֶּ֛גֶב סֻגְּר֖וּ וְ/אֵ֣ין פֹּתֵ֑חַ הָגְלָ֧ת יְהוּדָ֛ה כֻּלָּ֖/הּ הָגְלָ֥ת שְׁלוֹמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/019.yaml
  text: The cities of the Negev are shut up[a], with no one to open them; all Judah has been carried away into exile[c][b], wholly carried away into exile.
  footnotes:
  - marker: a
    text: Or 'the cities of the south.' 'Negev' may refer specifically to Judah's southern region.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Judah has been exiled, all of it; it has been exiled completely.'
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'carried away into exile in peace,' though the context more likely emphasizes completeness rather than peacefulness.
    reason: alternative_reading
translation:
  language: ko
  text: 네겝[a]의 성읍들은 닫혀 있어 그것들을 열 사람이 없으며, 유다 전체가 포로로 끌려갔고[b], 완전히 포로로 끌려갔습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네겝’은 유다의 남부 지역을 가리킬 수 있으며, 일반적으로 ‘남쪽’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유다가 모두 유배되었다’입니다. 강제적인 유배 또는 추방을 가리킵니다.
    reason: source_note
  - marker: c
    text: ‘평안히’ 또는 ‘평화롭게’로도 이해될 수 있으나, 문맥과 반복 표현은 유배의 완전성을 강조하는 뜻으로 이해될 가능성이 더 큽니다.
    reason: alternative_reading
lexical_decisions:
- source_word: עָרֵי הַנֶּגֶב
  english_pob_choice: the cities of the Negev
  chosen_korean: 네겝의 성읍들
  alternatives_korean:
  - 남방의 성읍들
  - 네겝의 도시들
  lexicon: HALOT
  rationale: נֶגֶב은 일반적인 ‘남쪽’보다 유다 남부의 지리적 지역을 가리키므로, 고유 지명을 살린 ‘네겝’이 원문의 지리 감각을 더 정확히 보존합니다.
- source_word: סֻגְּרוּ וְאֵין פֹּתֵחַ
  english_pob_choice: are shut up, with no one to open them
  chosen_korean: 닫혀서 여는 이가 없으며
  alternatives_korean:
  - 닫혀 있고 여는 이가 없으며
  - 닫혀 열 사람도 없으며
  lexicon: HALOT
  rationale: 완료된 폐쇄 상태와 이를 되돌릴 사람이 없다는 뜻을 자연스러운 한국어로 옮기기 위해 ‘닫혀서 여는 이가 없으며’로 처리했습니다.
- source_word: הָגְלָת יְהוּדָה כֻּלָּהּ הָגְלָת שְׁלוֹמִים
  english_pob_choice: all Judah has been carried away into exile, wholly carried away into exile
  chosen_korean: 온 유다가 포로로 끌려가고, 전부 포로로 끌려갔습니다
  alternatives_korean:
  - 온 유다가 사로잡혀 끌려가고, 완전히 사로잡혀 끌려갔습니다
  - 유다 전체가 포로로 잡혀갔고, 완전히 포로로 잡혀갔습니다
  lexicon: HALOT
  rationale: הָגְלָת은 강제 이주/유배를 뜻하므로 ‘포로로 끌려가다’로 옮겼고, שְׁלוֹמִים은 ‘평안히’가 아니라 반복을 통한 총체성을 강조하는 말이므로 ‘전부’로 처리해 완전성을 살렸습니다.
theological_decisions:
- issue: שְׁלוֹמִים의 의미
  chosen_reading: ‘평안히’보다 ‘전부/완전히’라는 총체적 강조로 이해했습니다.
  alternative_readings:
  - 평안히 포로로 끌려갔습니다
  - 평화롭게 끌려갔습니다
  rationale: 문맥은 평온한 이송이 아니라 예루살렘과 유다에 임한 전면적 심판을 강조하므로, שְׁלוֹמִים을 평화의 의미로 풀면 반복 구조가 약해집니다.
  doctrine_reference: 예레미야 13장의 심판 예언과 טוטال성(전면성) 강조
