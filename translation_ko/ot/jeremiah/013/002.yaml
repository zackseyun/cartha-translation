  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶקְנֶ֥ה אֶת הָ/אֵז֖וֹר כִּ/דְבַ֣ר יְהוָ֑ה וָ/אָשִׂ֖ם עַל מָתְנָֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/002.yaml
  text: So I bought the loincloth according to the word of Yahweh[a], and put it on my waist.
  footnotes:
  - marker: a
    text: Or 'belt' or 'sash'; the Hebrew refers to a waist garment worn close to the body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 나는 여호와의 말씀대로 그 허리띠를 사서, 내 허리에 둘렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '띠'나 '허리띠'로도 옮길 수 있습니다. 히브리어는 몸에 밀착해 허리에 두르는 의복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָ/אֶקְנֶ֥ה
  english_pob_choice: So I bought
  chosen_korean: 그래서 나는 ... 사서
  alternatives_korean:
  - 그리고 나는 ... 샀습니다
  - 그리하여 나는 ... 샀습니다
  lexicon: HALOT
  rationale: 이어지는 명령에 순종해 실행한 다음 동작을 자연스럽게 나타내기 위해 원인·결과 뉘앙스가 있는 '그래서'와 동사 연결형 '사서'를 택했습니다.
- source_word: הָ/אֵז֖וֹר
  english_pob_choice: the loincloth
  chosen_korean: 그 허리띠
  alternatives_korean:
  - 그 긴 천
  - 그 띠
  - 그 띠천
  lexicon: HALOT
  rationale: 히브리어 אֵזוֹר는 허리에 두르는 띠류를 가리키며, 본문 맥락상 몸에 밀착해 착용하는 허리 장식/의복이므로 너무 특정한 현대 의복명보다 '허리띠'가 의미를 안정적으로 전달합니다.
- source_word: כִּ/דְבַ֣ר יְהוָ֑ה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 여호와의 말씀대로
  alternatives_korean:
  - 여호와의 말씀을 따라
  - 여호와의 말씀에 따라
  lexicon: HALOT
  rationale: 직역의 '말씀에 따라'도 가능하지만, כאן의 관용구는 곧바로 신적 명령에 대한 순종을 뜻하므로 한국어 성경체에서 자연스러운 '말씀대로'로 옮겼습니다.
- source_word: עַל מָתְנָֽי
  english_pob_choice: on my waist
  chosen_korean: 내 허리에 둘렀습니다
  alternatives_korean:
  - 내 허리 위에 놓았습니다
  - 내 허리둘레에 매었습니다
  lexicon: HALOT
  rationale: מָתְנַיִם은 허리/요부를 가리키며, 옷을 입는 동작이므로 단순 위치 표현보다 착용 동작을 드러내는 '둘렀습니다'가 자연스럽습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 음역
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 POB는 Yahweh를 채택하지만, 한국어 출판 가독성과 기존 POB 한국어 관행을 고려해 본문에는 널리 인지된 '여호와'를 사용했습니다. 본 절은 직접 인용이나 신학적 대비가 아니라 서술문이므로 이 선택이 의미를 훼손하지 않습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
