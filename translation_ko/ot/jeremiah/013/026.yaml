id: JER.13.26
reference: Jeremiah 13:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אֲנִ֛י חָשַׂ֥פְתִּי שׁוּלַ֖יִ/ךְ עַל פָּנָ֑יִ/ךְ וְ/נִרְאָ֖ה קְלוֹנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/026.yaml
  text: So I myself have also lifted up your skirts over your face[c][b][a], and your shame has been seen.
  footnotes:
  - marker: a
    text: Or 'have uncovered your skirts over your face.' The Hebrew verb means 'uncover/expose'; 'lifted up' is an idiomatic rendering in this clothing image.
    reason: lexical_alternative
  - marker: b
    text: The image is one of public humiliation through forced exposure, a prophetic metaphor for disgrace under judgment.
    reason: cultural_note
  - marker: c
    text: Or 'So I myself also have lifted up'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 나도 네 치마를 네 얼굴 위로 올려 놓았고, 네 수치가 드러났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘올려 놓았다’는 히브리어 동사의 관용적 옮김으로, 문자적으로는 ‘드러내다/벗기다’의 뜻을 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 이미지는 공개적 굴욕과 강제적 노출을 통해 수치를 드러내는 예언적 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  english_pob_choice: So I myself ... also
  chosen_korean: 그러므로 나도
  alternatives_korean:
  - 그리고 나도
  - 나도 또한
  lexicon: HALOT
  rationale: 연결어 וְגַם의 계속성과 강조를 한국어에서는 앞선 심판 선언을 이어 주는 ‘그러므로’와 보조사 ‘도’로 간결하게 살렸습니다.
- source_word: חָשַׂפְתִּי
  english_pob_choice: have lifted up
  chosen_korean: 올려 놓았고
  alternatives_korean:
  - 드러냈고
  - 벗겨 놓았고
  - 드러내었습니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 ‘드러내다/벗기다’이지만, 치마를 얼굴 위로 끌어올리는 노골적 수치를 살리기 위해 POB의 이미지대로 ‘올려 놓다’로 옮겼습니다.
- source_word: שׁוּלַיִךְ
  english_pob_choice: your skirts
  chosen_korean: 네 치마
  alternatives_korean:
  - 네 옷자락
  - 네 밑자락
  - 네 자락
  lexicon: HALOT
  rationale: 복수형이지만 수치의 비유 이미지에서는 옷의 아래자락을 가리키므로, 현대 한국어에서 가장 직접적이고 자연스러운 ‘치마’로 옮겼습니다.
- source_word: קְלוֹנֵךְ
  english_pob_choice: your shame
  chosen_korean: 네 수치
  alternatives_korean:
  - 네 부끄러움
  - 네 치욕
  - 네 불명예
  lexicon: HALOT
  rationale: 이 명사는 단순한 내면 감정이 아니라 공개적 망신과 수치를 뜻하므로, 예언적 심판 맥락에 맞는 ‘수치’가 가장 적절합니다.
theological_decisions:
- issue: 노골적인 노출 이미지의 보존
  chosen_reading: 치마를 얼굴 위로 올려 놓았다는 구체적 이미지와 ‘수치가 드러났다’는 표현을 그대로 살렸습니다.
  alternative_readings:
  - 더 완곡하게 ‘망신을 당했습니다’로 옮김
  - 노출 이미지를 삭제하고 ‘수치를 보이게 하셨습니다’로 완화
  rationale: 히브리어는 공개적 굴욕을 나타내는 강한 신체/의복 은유를 사용하므로, 이를 완화하면 심판 선언의 힘과 원문 의도를 약화시킵니다.
  doctrine_reference: '번역 원칙: 원문이 허용하는 수치를 완곡하게 낮추지 말고, 예언적 심판의 강도를 보존한다.'
