source:
  edition: WLC
  text: כִּ֡י כַּ/אֲשֶׁר֩ יִדְבַּ֨ק הָ/אֵז֜וֹר אֶל מָתְנֵי אִ֗ישׁ כֵּ֣ן הִדְבַּ֣קְתִּי אֵ֠לַ/י אֶת כָּל בֵּ֨ית יִשְׂרָאֵ֜ל וְ/אֶת כָּל בֵּ֤ית יְהוּדָה֙ נְאֻם יְהוָ֔ה לִֽ/הְי֥וֹת לִ/י֙ לְ/עָ֔ם וּ/לְ/שֵׁ֥ם וְ/לִ/תְהִלָּ֖ה וּ/לְ/תִפְאָ֑רֶת וְ/לֹ֖א שָׁמֵֽעוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/011.yaml
  text: For as the waistband clings to a man's waist[a], so I made the whole house of Israel and the whole house of Judah cling to me, declares Yahweh, to be for me a people, a name, a praise, and a glory[c][b], but they did not listen.
  footnotes:
  - marker: a
    text: Or 'belt,' 'sash,' or possibly 'loincloth' for the garment worn around the waist.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a man's waist'; the singular masculine is used in a representative comparison.
    reason: cultural_note
  - marker: c
    text: '''Did not listen'' can also carry the sense ''did not obey.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 허리띠[a]가 한 남자의 허리[b]에 달라붙듯이, 내가 이스라엘의 온 집과 유다의 온 집을 내게 달라붙게 하였습니다. 야훼의 선언입니다. 이는 그들이 나에게 백성이 되고, 이름과 찬양과 영광이 되게 하려는 것이었으나, 그들은 듣지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘띠’, ‘장식 띠’; 허리에 두르는 의복을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘한 남자의 허리’라고 말하며, 대표적인 비교에 단수 남성형을 사용합니다.
    reason: cultural_note
  - marker: c
    text: ‘듣지 않았다’는 문맥상 ‘순종하지 않았다’라는 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵזוֹר
  english_pob_choice: the waistband
  chosen_korean: 허리띠
  alternatives_korean:
  - 띠
  - 허리끈
  - 사시
  lexicon: HALOT
  rationale: 문맥상 허리에 두르는 실제 의복을 가리키므로, 현대 한국어에서 자연스러운 ‘허리띠’가 이미지와 기능을 가장 잘 살립니다.
- source_word: יִדְבַּק / הִדְבַּקְתִּי
  english_pob_choice: clings / made ... cling
  chosen_korean: 꼭 달라붙다 / 꼭 달라붙게 하다
  alternatives_korean:
  - 붙다 / 붙게 하다
  - 밀착되다 / 밀착되게 하다
  - 매달리다 / 매달리게 하다
  lexicon: HALOT
  rationale: דבק의 핵심은 단순 접촉이 아니라 밀착·부착의 강한 결속이어서, ‘꼭 달라붙다’가 물리적 비유와 관계적 함의를 함께 전달합니다.
- source_word: מָתְנֵי אִישׁ
  english_pob_choice: a man's waist
  chosen_korean: 한 사람의 허리
  alternatives_korean:
  - 한 남자의 허리
  - 사람의 허리
  - 남자의 허리
  lexicon: HALOT
  rationale: 히브리어의 대표적 남성형 비교를 살리되, 한국어에서는 ‘한 사람의 허리’가 오늘날 독자에게 더 자연스럽고 비유의 일반성을 유지합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 선언하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼의 말씀이십니다
  lexicon: HALOT
  rationale: 예언문 공식에 맞춰 직접 화자 표지를 살리면서, 프로젝트 기본값에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
- source_word: לִהְיוֹת לִי לְעָם וּלְשֵׁם וְלִתְהִלָּה וּלְתִפְאָרֶת
  english_pob_choice: to be for me a people, a name, a praise, and a glory
  chosen_korean: 나를 위한 한 백성이 되고, 한 이름이 되고, 한 찬양이 되고, 한 영광이 되게 하려는 것
  alternatives_korean:
  - 내 백성이 되고, 명성과 찬양과 영광이 되게 하려는 것
  - 나의 백성, 이름, 찬양, 영광이 되게 하려는 것
  lexicon: HALOT
  rationale: 히브리어의 명사 연속구조를 유지하기 위해 각각을 평행적으로 살렸고, ‘한’은 목적과 정체성의 단일성을 드러냅니다.
theological_decisions:
- issue: 예언 공식의 화자 표지와 하나님의 이름
  chosen_reading: ‘야훼께서 선언하십니다’로 옮겨 예언적 권위와 언약적 신명을 함께 드러냄
  alternative_readings:
  - ‘여호와의 말씀입니다’
  - ‘주님께서 말씀하십니다’
  rationale: 본문은 יְהוָה를 직접 사용하므로, 본 프로젝트의 기본 원칙에 따라 이름을 가리지 않고 드러내는 것이 원문 효과를 가장 잘 보존합니다.
  doctrine_reference: DOCTRINE.md Contested terms — יְהוָה YHWH → Yahweh
- issue: ‘듣지 않았다’의 의미
  chosen_reading: ‘그들은 듣지 않았습니다’
  alternative_readings:
  - 그들은 순종하지 않았습니다
  - 그들은 들으려 하지 않았습니다
  rationale: שׁמע는 문맥상 청취와 순종을 함께 포함하지만, 예언적 책망의 직접성을 살리기 위해 기본 의미인 ‘듣다’를 유지하고 불순종의 함의를 남깁니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
