revisions:
- from: 허리띠가 한 사람의 허리에 꼭 달라붙듯이, 내가 이스라엘 온 집과 유다 온 집을 내게 꼭 달라붙게 하였다고 야훼께서 선언하십니다. 그것은 그들이 나를 위한 한 백성이 되고, 한 이름이 되고, 한 찬양이 되고, 한 영광이 되게 하려는 것이었으나, 그들은 듣지 않았습니다.[a][b][c]
  to: 허리띠[a]가 한 남자의 허리[b]에 달라붙듯이, 내가 이스라엘의 온 집과 유다의 온 집을 내게 달라붙게 하였습니다. 야훼의 선언입니다. 이는 그들이 나에게 백성이 되고, 이름과 찬양과 영광이 되게 하려는 것이었으나, 그들은 듣지 않았습니다[c].
  rationale: 원문의 문법적 관계와 예언 공식의 위치를 더 분명히 하고, 대표적 남성 단수를 보존했습니다. 목적절에서는 한국어에 없는 부정관사적 ‘한’을 제거하고 לִי를 ‘나에게’로 옮겨 귀속 관계를 살렸습니다. 신명 ‘야훼’와 ‘듣지 않았다’의 의도적인 의미 폭은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:34Z'
