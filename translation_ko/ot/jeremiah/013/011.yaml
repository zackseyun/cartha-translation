  source_fidelity: 원문의 비유(허리띠가 남자의 허리에 달라붙음), 사역형 ‘달라붙게 하였다’, 이스라엘과 유다의 ‘온 집’, 그리고 목적절과 마지막의 불청종을 보존해야 합니다. 초안의 ‘한 사람’은 원문의 단수 남성 명사 אִישׁ를 중화하므로, 대표적 비교라는 점을 유지하여 ‘한 남자’로 고쳤습니다. 또한 לִי는 ‘나를 위한’보다 ‘나에게’가 원문의 관계·귀속 표현을 더 직접적으로 반영합니다.
  naturalness: 초안은 ‘…하게 하였다고 야훼께서 선언하십니다’와 뒤이은 ‘그것은’의 연결이 다소 어색합니다. 예언 공식은 독립된 ‘야훼의 선언입니다’로 처리하고, 목적절은 ‘이는’으로 자연스럽게 연결했습니다. ‘한 이름, 한 찬양, 한 영광’에서 ‘한’은 한국어에서 불필요하게 수량을 부각하므로 제거했습니다.
