id: JER.13.27
reference: Jeremiah 13:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: נִֽאֻפַ֤יִ/ךְ וּ/מִצְהֲלוֹתַ֨יִ/ךְ֙ זִמַּ֣ת זְנוּתֵ֔/ךְ עַל גְּבָעוֹת֙ בַּ/שָּׂדֶ֔ה רָאִ֖יתִי שִׁקּוּצָ֑יִ/ךְ א֥וֹי לָ/ךְ֙ יְר֣וּשָׁלִַ֔ם לֹ֣א תִטְהֲרִ֔י אַחֲרֵ֥י מָתַ֖י עֹֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/027.yaml
  text: Your adulteries[a], your lustful neighings, the depravity of your prostitution on the hills in the field—I have seen your abominations. Woe to you, Jerusalem! Will you not be made clean?[d][c][b] How long will it still be?
  footnotes:
  - marker: a
    text: Or 'the lewdness of your whoredom.' The Hebrew combines terms for depravity/lewdness and prostitution.
    reason: lexical_alternative
  - marker: b
    text: '''Lustful neighings'' echoes the horse imagery of sexual craving used elsewhere in Jeremiah.'
    reason: cross_reference
  - marker: c
    text: Or 'Will you not become clean?' The Hebrew may also be understood less passively.
    reason: alternative_reading
  - marker: d
    text: 'Hebrew is elliptical: literally, ''after when/still?'' meaning ''How much longer?'''
    reason: lexical_alternative
translation:
  language: ko
  text: 너의 간음 행위들과 음욕에 찬 말 울음소리들, 들판의 언덕들에서 저지른 너의 음행의 타락과 너의 가증한 것들을 내가 보았습니다. 예루살렘아, 너에게 화가 있습니다! 너는 정결하게 되지 않겠습니까? 얼마나 더 오래겠습니까?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘타락/음란함’이라는 뜻의 말과 ‘음행’을 함께 써서, 음행에 수반된 도덕적 부패를 강하게 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘음욕에 찬 말 울음소리들’은 예레미야서의 다른 곳에서도 나타나는, 성적 갈망을 말의 울음에 비유한 이미지를 반영합니다.
    reason: cross_reference
  - marker: c
    text: ‘정결하게 되다’는 히브리어의 형태를 수동적으로 또는 상태 변화로 이해한 번역입니다. ‘깨끗해지다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: d
    text: 히브리어는 문자적으로 ‘언제 후에 아직?’에 가까운 생략적 표현입니다. ‘얼마나 더 오래?’라는 시간적 탄식을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִאֻפַיִךְ
  english_pob_choice: your adulteries
  chosen_korean: 네의 간음
  alternatives_korean:
  - 네의 간음들
  - 네의 간음 행위
  lexicon: HALOT
  rationale: 복수형 뉘앙스를 살리되, 예언자적 비유인 언약 파기를 한국어에서 직접 드러내는 가장 간결한 표현으로 옮겼습니다.
- source_word: וּמִצְהֲלוֹתַיִךְ
  english_pob_choice: your lustful neighings
  chosen_korean: 네의 음욕에 찬 울음소리
  alternatives_korean:
  - 네의 음란한 울음소리
  - 네의 욕정 어린 울음소리
  lexicon: HALOT
  rationale: 말(馬)의 울음에 빗댄 성적 갈망의 이미지를 살리기 위해 직역에 가깝게 유지하되, 한국어 독자가 의미를 파악할 수 있도록 '음욕에 찬'으로 풀었습니다.
- source_word: זִמַּת זְנוּתֵךְ
  english_pob_choice: the depravity of your prostitution
  chosen_korean: 네의 음행의 패륜
  alternatives_korean:
  - 네의 음행의 타락
  - 네의 음행의 사악함
  lexicon: HALOT
  rationale: זִמָּה의 도덕적 타락성과 זְנוּת의 성적 배반을 함께 보이기 위해, '패륜'을 택해 강한 예언적 비난을 유지했습니다.
- source_word: שִׁקּוּצַיִךְ
  english_pob_choice: your abominations
  chosen_korean: 그것
  alternatives_korean:
  - 네의 가증한 것들
  - 네의 가증한 행실
  lexicon: HALOT
  rationale: 문맥상 'I have seen your abominations'의 대상은 앞 절 전체의 행위 묶음이므로, 한국어에서는 지시어 '그것'으로 받되 본문에서 직접적인 중복을 피했습니다.
- source_word: לֹא תִטְהֲרִי
  english_pob_choice: Will you not be made clean?
  chosen_korean: 네는 정결하게 되지 못하겠느냐?
  alternatives_korean:
  - 네는 깨끗해지지 못하겠느냐?
  - 정결하게 되지 않겠느냐?
  lexicon: HALOT
  rationale: 수동/상태적 의미를 살려 '정결하게 되다'로 옮겼고, 영어 POB가 유지한 수사적 질문을 반영했습니다.
- source_word: אַחֲרֵי מָתַי עוֹד
  english_pob_choice: How long will it still be?
  chosen_korean: 얼마나 더 있어야 하느냐?
  alternatives_korean:
  - 얼마나 더 오래냐?
  - 언제까지 더냐?
  lexicon: HALOT
  rationale: 히브리어의 생략된 시간 탄식을 현대 한국어의 자연스러운 수사 의문으로 옮겼습니다.
theological_decisions:
- issue: Jeremiah의 성적 은유를 완화할지 여부
  chosen_reading: 주본문에서 '간음, 음욕에 찬 울음소리, 음행의 패륜'처럼 구체적인 성적 이미지를 그대로 드러냈습니다.
  alternative_readings:
  - '''불성실''이나 ''우상숭배'' 같은 추상어로 완화하기'
  rationale: 본문은 유다/예루살렘의 언약 불신실과 우상숭배를 충격적인 성적 은유로 고발하므로, 완화하면 예언적 압박감이 약해집니다.
  doctrine_reference: Translation philosophy §§1, 6
- issue: לֹא תִטְהֲרִי의 수사적 힘
  chosen_reading: '''네는 정결하게 되지 못하겠느냐?''로 질문형을 유지했습니다.'
  alternative_readings:
  - '''네는 정결하게 되지 못할 것이다'' 같은 서술형'
  rationale: 앞뒤 문맥의 탄식과 호소를 살리기 위해, 단정적 예언보다 절규에 가까운 질문으로 읽는 해석을 반영했습니다.
  doctrine_reference: Translation philosophy §3
