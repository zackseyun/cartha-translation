  text: So I went and hid it by the Euphrates[a], as Yahweh had commanded me.
  footnotes:
  - marker: a
    text: Hebrew Perath, usually understood as the Euphrates; some take it as a local place-name 'Perath.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리하여 저는 야훼께서 제게 명령하신 대로 가서 그것을 유프라테스 강가에 숨겼습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 페라트(Perath). 일반적으로 유프라테스 강으로 이해되지만, 일부는 이를 지역 지명 ‘페라트’로 봅니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וָ/אֵלֵךְ
  english_pob_choice: So I went
  chosen_korean: 그래서 제가 가서
  alternatives_korean:
  - 그리고 제가 갔습니다
  - 그때 제가 갔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서술 진행과 순차성을 자연스러운 한국어 연결어 ‘그래서’로 살렸습니다.
- source_word: וָ/אֶטְמְנֵ֖/הוּ
  english_pob_choice: hid it
  chosen_korean: 그것을 숨겼습니다
  alternatives_korean:
  - 그것을 묻었습니다
  - 그것을 감추었습니다
  lexicon: HALOT
  rationale: טמן은 ‘숨기다/감추다’의 뜻이 기본이므로, 매장까지 시사하는 ‘묻다’보다 의미 범위가 넓은 ‘숨기다’가 적절합니다.
- source_word: בִּ/פְרָ֑ת
  english_pob_choice: by the Euphrates
  chosen_korean: 유프라테스 강가에
  alternatives_korean:
  - 페라스에
  - 페라스 강가에
  lexicon: HALOT
  rationale: 통상적 지리명 해석을 따라 ‘유프라테스’로 옮기되, 위치 감각을 살리기 위해 ‘강가에’를 붙였습니다.
- source_word: צִוָּ֥ה
  english_pob_choice: had commanded
  chosen_korean: 명령하신 대로였습니다
  alternatives_korean:
  - 명령하셨습니다
  - 명령하신 대로 하였습니다
  lexicon: HALOT
  rationale: 히브리어의 결과적·순응적 의미를 한국어 관용구 ‘-하신 대로’로 자연스럽게 표현했습니다.
- source_word: יְהוָ֖ה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 YHWH는 학술적 표기 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: פְרָת의 지명 해석
  chosen_reading: 유프라테스 강으로 읽었습니다.
  alternative_readings:
  - 페라스라는 지역 지명으로 읽는 해석
  rationale: POB의 영어 본문이 유프라테스를 기본값으로 택한 점을 따라, 본문에는 표준 지리명으로 반영하고 대안 해석은 각주로 남겼습니다.
  doctrine_reference: translation philosophy §1, §3
