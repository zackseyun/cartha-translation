id: JER.13.18
reference: Jeremiah 13:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֱמֹ֥ר לַ/מֶּ֛לֶךְ וְ/לַ/גְּבִירָ֖ה הַשְׁפִּ֣ילוּ שֵׁ֑בוּ כִּ֤י יָרַד֙ מַרְאֲשׁ֣וֹתֵי/כֶ֔ם עֲטֶ֖רֶת תִּֽפְאַרְתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/018.yaml
  text: Say to the king and to the queen mother[a], ‘Humble yourselves; sit down[b], for your glorious crown has come down from your heads.’
  footnotes:
  - marker: a
    text: Or, more formally, 'the crown of your glory has come down from your heads.'
    reason: lexical_alternative
  - marker: b
    text: '''Queen mother'' renders Hebrew גְּבִירָה, a royal title that can denote the king''s mother rather than his wife.'
    reason: cultural_note
translation:
  language: ko
  text: 왕에게와 왕의 어머니에게 말하십시오. “스스로 낮아지십시오. 앉으십시오. 너희의 영광의 관이 너희의 머리에서 내려왔기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕의 어머니’는 히브리어 גְּבִירָה가 이 문맥에서 가리킬 수 있는 왕실 직함을 드러낸 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמֹר
  english_pob_choice: Say
  chosen_korean: 말하십시오
  alternatives_korean:
  - 말하시오
  - 이르십시오
  lexicon: HALOT
  rationale: 예언적 전달 명령으로서 직접화법을 여는 동사입니다. 현대 합쇼체의 명령형인 ‘말하십시오’가 가장 자연스럽고 공적입니다.
- source_word: וְלַגְּבִירָה
  english_pob_choice: and to the queen mother
  chosen_korean: 왕의 어머니에게
  alternatives_korean:
  - 왕후에게
  - 대비에게
  lexicon: HALOT
  rationale: גְּבִירָה는 궁정 맥락에서 단순한 ‘왕비’보다 왕의 어머니를 가리키는 경우가 많으므로, 본문이 시사하는 왕실 직함을 직접 살려 옮겼습니다.
- source_word: הַשְׁפִּילוּ
  english_pob_choice: Humble yourselves
  chosen_korean: 스스로 낮아지십시오
  alternatives_korean:
  - 낮추십시오
  - 겸손해지십시오
  lexicon: HALOT
  rationale: שׁפל의 사역형 명령은 지위의 하강과 굴복을 함께 담습니다. ‘스스로 낮아지십시오’가 수동적 굴욕이 아니라 의도적 자기 낮춤을 함께 드러냅니다.
- source_word: יָרַד מַרְאֲשׁוֹתֵיכֶם
  english_pob_choice: has come down from your heads
  chosen_korean: 너희의 머리에서 내려왔기 때문입니다
  alternatives_korean:
  - 너희 머리에서 떨어졌기 때문입니다
  - 너희 머리 위에서 내려갔기 때문입니다
  lexicon: HALOT
  rationale: 관이 머리에서 ‘내려왔다’는 이미지를 그대로 살려, 왕권 상실의 시각적 감각을 보존했습니다.
- source_word: עֲטֶרֶת תִּפְאַרְתְּכֶם
  english_pob_choice: your glorious crown
  chosen_korean: 너희의 영광의 관
  alternatives_korean:
  - 너희의 영광스러운 관
  - 너희의 영화로운 왕관
  lexicon: HALOT
  rationale: 구성형 ‘영광의 관’을 직역에 가깝게 유지해, 왕실의 영예가 사라진 상태를 분명하게 드러냈습니다.
theological_decisions:
- issue: גְּבִירָה의 궁정 직함 번역
  chosen_reading: ‘왕의 어머니’로 번역해 왕의 배우자와 구별되는 궁정 직함을 드러냈습니다.
  alternative_readings:
  - ‘왕후’로 번역하는 읽기
  - ‘대비’로 번역하는 읽기
  rationale: 이 절의 문맥은 왕실 권위의 하강을 말하며, גְּבִירָה는 종종 모후를 가리키므로, 현대 독자가 오해하지 않도록 혈연·궁정 기능을 분명히 했습니다.
  doctrine_reference: 역사-문법적 해석, 왕실 직함 이해
