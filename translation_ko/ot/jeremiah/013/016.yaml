  to: 너희의 하나님 야훼께 영광을 드리십시오. 그가 어둠을 가져오시기 전에, 너희 발이 해질녘의 산들에서 비틀거리기 전에 그렇게 하십시오. 너희가 빛을 바라겠지만, 그가 그것을 짙은 어둠으로 만드시고 짙은 암흑으로 바꾸실 것입니다.[a]
  rationale: 명령의 시간적 긴급성을 한국어에서 자연스럽게 드러내기 위해 두 번째 ‘전에’ 절에 ‘그렇게 하십시오’를 보충했습니다. 이는 새 명령을 추가하지 않고, 두 בטרם 절이 ‘영광을 드리라’는 명령을 수식한다는 히브리어 구문을 명확히 합니다. 하나님의 능동적 행위와 빛이 어둠으로 바뀌는 심판의 이미지는 유지했으며, 각주는 צלמות의 전통적 및 현대적 어휘 가능성을 결과 의미를 첨가하지 않고 제시하도록 바로잡았습니다.
