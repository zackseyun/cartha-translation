id: JER.13.16
reference: Jeremiah 13:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תְּנוּ֩ לַ/יהוָ֨ה אֱלֹהֵי/כֶ֤ם כָּבוֹד֙ בְּ/טֶ֣רֶם יַחְשִׁ֔ךְ וּ/בְ/טֶ֛רֶם יִֽתְנַגְּפ֥וּ רַגְלֵי/כֶ֖ם עַל הָ֣רֵי נָ֑שֶׁף וְ/קִוִּיתֶ֤ם לְ/אוֹר֙ וְ/שָׂמָ֣/הּ לְ/צַלְמָ֔וֶת ישית לַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/016.yaml
  text: Give glory to Yahweh your God before he brings darkness[a], and before your feet stumble on the mountains at twilight. Then you will hope for light, but he will make it deep darkness; he will turn it into gloom.
  footnotes:
  - marker: a
    text: Or, more traditionally, 'he will make it the shadow of death.' The Hebrew term can denote either deathly darkness or very deep darkness.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희의 하나님 야훼께 영광을 드리십시오. 그가 어둠을 가져오시기 전에, 너희 발이 해질녘의 산들에서 비틀거리기 전에 그렇게 하십시오. 너희가 빛을 바라겠지만, 그가 그것을 짙은 어둠으로 만드시고 짙은 암흑으로 바꾸실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 ‘사망의 그늘’로 옮길 수 있습니다. 히브리어는 죽음 같은 어둠 또는 매우 짙은 어둠을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ לַיהוָה כָּבוֹד
  english_pob_choice: Give glory to Yahweh
  chosen_korean: 야훼 너희 하나님께 영광을 드리십시오
  alternatives_korean:
  - 야훼께 영광을 돌리십시오
  - 주께 영광을 드리십시오
  lexicon: HALOT
  rationale: נתן + כבוד의 관용구를 한국어로는 ‘영광을 드리다’로 자연스럽게 옮기되, מקור의 언약적 호칭을 살려 ‘야훼’와 ‘너희 하나님’을 함께 유지했습니다.
- source_word: בְּטֶרֶם יַחְשִׁךְ
  english_pob_choice: before he brings darkness
  chosen_korean: 그가 어둠을 가져오기 전에
  alternatives_korean:
  - 어두워지기 전에
  - 그가 어둡게 하기 전에
  lexicon: HALOT
  rationale: 히필의 원인적 뉘앙스를 살려 단순한 자연적 어둠이 아니라 하나님이 가져오시는 어둠으로 분명히 표현했습니다.
- source_word: הָרֵי נָשֶׁף
  english_pob_choice: the mountains at twilight
  chosen_korean: 해질녘의 산들
  alternatives_korean:
  - 황혼의 산들
  - 저무는 빛의 산들
  lexicon: HALOT
  rationale: נָשֶׁף의 ‘해질녘/황혼’ 의미를 살리면서, 위험한 길 위의 이미지를 한국어로 가장 자연스럽게 전달하는 표현을 택했습니다.
- source_word: וְקִוִּיתֶם לְאוֹר
  english_pob_choice: you will hope for light
  chosen_korean: 너희는 빛을 바라겠지만
  alternatives_korean:
  - 너희는 빛을 기다리겠지만
  - 너희는 빛을 소망하겠지만
  lexicon: HALOT
  rationale: קוה의 ‘기대하다/바라다’ 의미를 살리되, 심판 문맥에서 절박한 기대를 드러내는 ‘바라다’로 옮겼습니다.
- source_word: וְשָׂמָהּ לְצַלְמָוֶת ישית לַעֲרָפֶל
  english_pob_choice: he will make it deep darkness; he will turn it into gloom
  chosen_korean: 그가 그것을 짙은 어둠으로 만들고, 그것을 캄캄한 흑암으로 바꾸실 것입니다
  alternatives_korean:
  - 그가 그것을 사망의 그늘로 만들고, 그것을 짙은 흑암으로 바꾸실 것입니다
  - 그가 그것을 깊은 어둠으로 만들고, 그것을 흑암으로 바꾸실 것입니다
  lexicon: HALOT
  rationale: צַלְמָוֶת은 전통적 ‘사망의 그늘’이 가능하지만 여기서는 ‘매우 짙은 어둠’의 의미가 더 직접적이므로 본문에는 ‘짙은 어둠’으로, 어휘의 강도를 유지하기 위해 ‘캄캄한 흑암’으로 한 번 더 강화했습니다.
theological_decisions:
- issue: 야훼의 직접적 심판 행위
  chosen_reading: 어둠은 단순한 자연현상이 아니라 야훼께서 가져오시는 심판으로 제시됩니다.
  alternative_readings:
  - 그냥 해가 저무는 자연스러운 상황으로 볼 수 있습니다.
  rationale: 히필 동사와 뒤따르는 동사들이 일관되게 주어를 하나님 쪽으로 향하게 하므로, 예언적 경고의 심판성을 약화시키지 않도록 직접 행위로 옮겼습니다.
  doctrine_reference: 예언서의 심판 신학
