base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/020.yaml
  text: Lift up your eyes and see those who are coming from the north. Where is the flock that was given to you[a], your beautiful sheep?
  footnotes:
  - marker: a
    text: Or 'your glorious sheep.' The Hebrew expression can denote beauty, splendor, or glory.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 눈을 들어 보아라. 북쪽에서 오는 자들을 보아라. 너에게 주어진 양 떼, 너의 아름다운 양 떼는 어디에 있느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너의 영광스러운 양 떼.’ 히브리어 표현은 아름다움, 광채, 영광을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאִי עֵינֵיכֶם
  english_pob_choice: Lift up your eyes
  chosen_korean: 네 눈을 들어 보아라
  alternatives_korean:
  - 너희 눈을 들어 보아라
  - 눈을 들어 보아라
  lexicon: HALOT
  rationale: 히브리어는 눈을 들어 시선을 돌리라는 관용적 명령이므로, 한국어에서는 자연스럽게 ‘눈을 들어 보아라’로 옮기되, 주변 호칭을 문맥상 단수로 정리해 문장의 수사적 흐름을 살렸습니다.
- source_word: וּרְאִי הַבָּאִים מִצָּפוֹן
  english_pob_choice: see those who are coming from the north
  chosen_korean: 북쪽에서 오는 자들을 보아라
  alternatives_korean:
  - 북쪽에서 오는 사람들을 보아라
  - 북쪽에서 다가오는 이들을 보아라
  lexicon: HALOT
  rationale: 현재분사형 ‘오는 자들’을 주어화해 재난의 접근성을 살렸고, ‘from the north’는 예레미야에서 반복되는 침략 방향성을 그대로 드러내도록 직역했습니다.
- source_word: הָעֵדֶר נִתַּן לָךְ צֹאן תִּפְאַרְתֵּךְ
  english_pob_choice: the flock that was given to you, your beautiful sheep
  chosen_korean: 너에게 주어진 양 떼, 너의 아름다운 양 떼
  alternatives_korean:
  - 너에게 주어진 무리, 너의 영광스러운 양 떼
  - 너에게 맡겨진 양 떼, 너의 빛나는 양 떼
  lexicon: HALOT
  rationale: ‘עֵדֶר’와 ‘צֹאן’을 모두 살리되 한국어에서는 중복을 피하기 어려워 ‘양 떼’로 통일해 병렬 수식을 자연스럽게 처리했습니다. ‘תִּפְאַרְתֵּךְ’의 의미 범위는 beauty/splendor/glory이므로, 본문에는 가장 직접적인 ‘아름다운’을 두고 대안으로 ‘영광스러운’ 가능성을 남겼습니다.
theological_decisions:
- issue: 목양 은유의 유지
  chosen_reading: 양 떼를 누구인지 본문에서 풀어 쓰지 않고 은유를 그대로 유지했습니다.
  alternative_readings:
  - 양 떼를 유다/예루살렘 백성으로 명시하는 번역
  - 왕권 아래 있는 백성으로 좁혀 해석하는 번역
  rationale: 히브리어는 비유를 설명하지 않고 던지므로, 본문이 주는 수사적 긴장과 빈자리를 그대로 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
