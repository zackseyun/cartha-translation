  to: 많은 날이 지난 뒤에 야훼께서 내게 말씀하셨습니다. “일어나 페라트[a]로 가서, 내가 네게 그곳에 숨기라고[c] 명령한 허리띠[b]를 그곳에서 가져오십시오.”
