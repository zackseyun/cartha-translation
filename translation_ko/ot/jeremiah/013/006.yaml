id: JER.13.6
reference: Jeremiah 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֕י מִ/קֵּ֖ץ יָמִ֣ים רַבִּ֑ים וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֚וּם לֵ֣ךְ פְּרָ֔תָ/ה וְ/קַ֤ח מִ/שָּׁם֙ אֶת הָ֣/אֵז֔וֹר אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/טָמְנ/וֹ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/006.yaml
  text: And it happened after many days that Yahweh said to me[a], “Arise, go to Perath[c][b], and take from there the waistband that I commanded you to hide there.”
  footnotes:
  - marker: a
    text: Perath may refer to the Euphrates; the Hebrew name is transliterated here rather than resolved in the main text.
    reason: alternative_reading
  - marker: b
    text: Or 'loincloth,' 'belt,' or 'sash' for 'waistband.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to bury there'; the Hebrew verb can mean to hide or conceal, sometimes by burying.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 많은 날이 지난 뒤에 야훼께서 내게 말씀하셨습니다. 「일어나서, 페라스로 가서, 내가 네게 거기에서 숨기라고 명령한 허리띠를 거기에서 가져오너라」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: פְּרָתָה는 유브라테스강을 가리킬 수 있으나, 본문에서는 음역으로 두었습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 אֵזוֹר는 '허리띠' 외에도 '속옷', '띠', '띠끈'으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 לְטָמְנוֹ는 '숨기다' 또는 '파묻다'의 뜻이 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ יָמִים רַבִּים
  english_pob_choice: And it happened after many days
  chosen_korean: 그리고 많은 날이 지난 뒤에
  alternatives_korean:
  - 오랜 날이 지난 뒤에
  - 많은 날이 지난 후에
  lexicon: HALOT
  rationale: 히브리어 서두의 새 사건 도입을 자연스러운 서술로 옮기되, 'after many days'의 시간 경과를 간결하게 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유명사를 대체 칭호가 아니라 음역으로 보존해, 영어 POB의 'Yahweh' 선택과 일치시켰습니다.
- source_word: פְּרָתָה
  english_pob_choice: Perath
  chosen_korean: 페라스
  alternatives_korean:
  - 페라트
  - 유브라데
  - 유프라테스
  lexicon: HALOT
  rationale: 본문의 지명을 주 텍스트에서는 음역으로 유지하고, 가능한 식별은 주석 없이 본문에서 확정하지 않았습니다.
- source_word: הָאֵזוֹר
  english_pob_choice: the waistband
  chosen_korean: 허리띠
  alternatives_korean:
  - 띠
  - 허리끈
  - 띠끈
  lexicon: HALOT
  rationale: אֵזוֹר는 허리에 두르는 물건을 가리키므로, 한국어에서 가장 자연스럽고 넓은 의미를 지닌 '허리띠'를 택했습니다.
- source_word: לְטָמְנוֹ שָׁם
  english_pob_choice: to hide there
  chosen_korean: 거기에서 숨기라고
  alternatives_korean:
  - 거기에서 감추라고
  - 거기 파묻으라고
  lexicon: HALOT
  rationale: '''טמן''의 기본 의미를 따라 ''숨기다''를 사용하고, 영어 POB처럼 매장 가능성은 본문이 아니라 주석에서만 열어 두었습니다.'
theological_decisions:
- issue: 주어가 말한 명령문의 직접화법 톤
  chosen_reading: 야훼의 직접 명령을 한국어 명령형으로 옮기되, 예언자에게 주어진 지시의 긴박감을 살렸습니다.
  alternative_readings:
  - 완곡한 서술형 지시
  - 더 부드러운 청유형
  rationale: 히브리어의 연속 명령형 קוּם לֵךְ וְקַח은 강한 수행 명령이므로, 이를 약화하지 않고 직접 명령으로 재현했습니다.
  doctrine_reference: 서사적 예언 명령의 문체 보존
- issue: 지명 פְּרָתָה의 확정 여부
  chosen_reading: 본문에서는 지명을 '페라스'로 음역만 하고, 유브라테스 강과의 동일시는 본문 밖으로 유보했습니다.
  alternative_readings:
  - 유브라테스로 해석
  - 페라트로 음역
  rationale: 영어 POB가 본문에서 해석을 확정하지 않고 주석으로 남긴 결정을 따라, 한국어도 본문에서 의미를 단정하지 않았습니다.
  doctrine_reference: 본문-주석 구분 원칙
