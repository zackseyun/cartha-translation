id: JER.13.21
reference: Jeremiah 13:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַה תֹּֽאמְרִי֙ כִּֽי יִפְקֹ֣ד עָלַ֔יִ/ךְ וְ֠/אַתְּ לִמַּ֨דְתְּ אֹתָ֥/ם עָלַ֛יִ/ךְ אַלֻּפִ֖ים לְ/רֹ֑אשׁ הֲ/ל֤וֹא חֲבָלִים֙ יֹאחֱז֔וּ/ךְ כְּמ֖וֹ אֵ֥שֶׁת לֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/013/021.yaml
  text: What will you say when he appoints over you those whom you yourself taught to be leaders over you? Will not labor pains seize you like a woman giving birth?[a][b]
  footnotes:
  - marker: a
    text: Or 'when he visits/punishes you'; the Hebrew verb can mean 'attend to, visit, punish,' but here likely carries the sense of appointing rulers over Judah.
    reason: lexical_alternative
  - marker: b
    text: Or 'chiefs' or 'close companions.' The Hebrew term can refer to clan leaders or familiar associates; in this context it likely points to those Judah had cultivated who now become her rulers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 당신 위에, 당신이 친히 당신 위의 우두머리[b]가 되도록 가르친 자들을 세울[a] 때에, 당신은 무엇이라고 말하겠습니까? 산고가 해산하는 여인처럼 당신을 사로잡지 않겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 당신을 방문하거나 벌할 때에’. 히브리어 동사는 ‘돌보다, 방문하다, 벌하다’ 등 폭넓은 뜻을 지닐 수 있으나, 여기서는 통치자들을 세우는 뜻으로 읽는 것이 문맥상 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우두머리들’이나 ‘가까운 동료들’. 이 히브리어 단어는 씨족 지도자나 친밀한 동료를 가리킬 수 있으나, 여기서는 유다 위에 세워질 통치자들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה תֹּאמְרִי
  english_pob_choice: What will you say
  chosen_korean: 당신은 무엇이라고 말하겠습니까?
  alternatives_korean:
  - 무엇이라고 말할 수 있겠습니까?
  - 당신은 무엇이라고 말하겠습니까
  lexicon: HALOT
  rationale: 여성 단수 مخاطبة를 현대 한국어의 합쇼체 질문으로 옮기되, 수사적 질문의 압박감을 살리기 위해 직설형으로 처리했습니다.
- source_word: כִּי יִפְקֹד עָלַיִךְ
  english_pob_choice: when he appoints over you
  chosen_korean: 그가 당신 위에 … 세울 때에
  alternatives_korean:
  - 그가 당신 위에 임할 때에
  - 그가 당신 위에 벌하실 때에
  - 그가 당신을 돌보실 때에
  lexicon: HALOT
  rationale: פקד의 의미 범위는 넓지만, 뒤따르는 ‘우두머리들’이 정치적/행정적 임명을 요구하므로 ‘세우다’로 옮겨 문맥을 반영했습니다.
- source_word: וְאַתְּ לִמַּדְתְּ אֹתָם
  english_pob_choice: those whom you yourself taught
  chosen_korean: 당신이 스스로 … 가르친 사람들을
  alternatives_korean:
  - 당신이 그들을 훈련한
  - 당신이 그들을 길들인
  lexicon: HALOT
  rationale: למד의 사역적 의미를 살려 ‘가르치다’로 옮기고, 독립 인칭대명사의 강조를 ‘스스로’로 반영했습니다.
- source_word: עָלַיִךְ אַלֻּפִים לְרֹאשׁ
  english_pob_choice: to be leaders over you
  chosen_korean: 당신 위에 우두머리들이
  alternatives_korean:
  - 당신 위에 지도자들이
  - 당신 위에 추장들이
  - 당신 위에 친밀한 벗들이
  lexicon: HALOT
  rationale: אַלּוּף는 ‘우두머리/지도자/추장’의 뜻이 가능하며, כאן에서는 ‘머리’ 표현과 결합해 지배적 지위를 나타내므로 ‘우두머리들’이 가장 직접적입니다.
- source_word: חֲבָלִים
  english_pob_choice: labor pains
  chosen_korean: 산고
  alternatives_korean:
  - 해산통
  - 진통
  - 산통
  lexicon: HALOT
  rationale: 출산 고통의 비유를 간결하고 문어적으로 살리기 위해 ‘산고’를 택했습니다.
- source_word: כְּמוֹ אֵשֶׁת לֵדָה
  english_pob_choice: like a woman giving birth
  chosen_korean: 해산하는 여인처럼
  alternatives_korean:
  - 출산하는 여인처럼
  - 해산 중인 여인처럼
  - 아이를 낳는 여인처럼
  lexicon: HALOT
  rationale: לֵדָה의 출산 장면을 한국어 관용에 맞게 압축해, 비교 구문으로 자연스럽고 엄숙하게 표현했습니다.
theological_decisions:
- issue: יִפְקֹד의 주어와 의미의 개방성
  chosen_reading: 주어를 ‘그’로 유지하고, 동사는 ‘세우다’로 번역해 본문의 해석 여지를 크게 좁히지 않았습니다.
  alternative_readings:
  - 여호와께서 당신 위에 세우실 때에
  - 그가 당신을 벌하실 때에
  - 그가 당신을 방문하실 때에
  rationale: 본문은 주어를 명시하지 않고 פקד의 의미도 다의적이어서, POB의 보존적 처리처럼 해석 결정을 과도하게 단정하지 않는 것이 적절합니다.
  doctrine_reference: 해석상의 긴장 보존
- issue: 문장 끝 질문의 수사적 강도
  chosen_reading: 반문형을 유지해 임박한 심판과 수치의 압박을 드러냈습니다.
  alternative_readings:
  - 평서형으로 완화
  - 완곡한 경고문으로 조정
  rationale: 예언 문맥에서 반문은 청중의 무력함을 드러내는 장치이므로, 한국어에서도 질문의 긴장을 그대로 살려야 합니다.
  doctrine_reference: 예언 수사 보존
