  lexicon: HALOT
  rationale: 서사 전개를 나타내는 와우 연속의 기능을 살리면서, 예언서의 관용구인 ‘말씀이 ... 임하다’를 한국어로 자연스럽게 옮겼습니다.
- source_word: דְבַר יְהוָה
