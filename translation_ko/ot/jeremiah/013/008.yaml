  rationale: 서사 전개를 나타내는 와우 연속의 기능을 살리면서, 예언서의 관용구인 ‘말씀이 ... 임하다’를 한국어로 자연스럽게 옮겼습니다.
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 하나님의 말씀
  lexicon: HALOT
  rationale: דָּבָר의 예언자적 관용구를 ‘말씀’으로 유지했고, 신명기적 고유명사 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 저에게
  - 나에게
  lexicon: HALOT
  rationale: 1인칭 목적격을 현대 한국어의 자연스러운 구어·문어 중립형인 ‘내게’로 옮겨 직접성과 간결성을 살렸습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 이르시기를
  - 말하며
  lexicon: HALOT
  rationale: 직역상 ‘말하며’에 가깝지만, 한국어에서는 다음 발화를 여는 표지로 종결적 서술을 한 번 더 자연스럽게 풀어 주는 것이 예언문 공식의 기능을 더 분명히 드러냅니다.
