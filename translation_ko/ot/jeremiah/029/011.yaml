id: JER.29.11
reference: Jeremiah 29:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ אָנֹכִ֨י יָדַ֜עְתִּי אֶת הַ/מַּחֲשָׁבֹ֗ת אֲשֶׁ֧ר אָנֹכִ֛י חֹשֵׁ֥ב עֲלֵי/כֶ֖ם נְאֻם יְהוָ֑ה מַחְשְׁב֤וֹת שָׁלוֹם֙ וְ/לֹ֣א לְ/רָעָ֔ה לָ/תֵ֥ת לָ/כֶ֖ם אַחֲרִ֥ית וְ/תִקְוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/011.yaml
  text: For I know the plans that I have for you[a], declares Yahweh, plans for peace and not for harm[b], to give you a future and a hope.
  footnotes:
  - marker: a
    text: Or 'plans for welfare' or 'plans for well-being'; Hebrew shalom can include peace, wholeness, and flourishing.
    reason: lexical_alternative
  - marker: b
    text: Or 'not for disaster' or 'not for calamity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 내가 너희를 위하여 품고 있는 계획을 알고 있기 때문입니다. 야훼의 말씀입니다. 그 계획은 평안을 위한 것이며[a], 해를 위한 것이 아닙니다[b]. 나는 너희에게 미래와 희망을 주려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평화’ 또는 ‘안녕’으로 옮길 수 있습니다. 히브리어 שָׁלוֹם은 평안, 온전함, 번영을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘재앙을 위한 것이 아니다’ 또는 ‘불행을 위한 것이 아니다’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחֲשָׁבֹת / מַחְשְׁבוֹת
  english_pob_choice: the plans / plans
  chosen_korean: 생각
  alternatives_korean:
  - 계획
  - 뜻
  - 의도
  lexicon: HALOT
  rationale: 히브리어 מַחֲשָׁבוֹת는 여기서 단순한 ‘생각’보다 목적을 지닌 내적 의도에 가깝지만, 한국어에서는 ‘생각’이 반복 구조(‘내가 아는 생각… 내가 생각하는…’)를 자연스럽게 살리면서도 하나님의 의도를 충분히 전달합니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평화
  - 안녕
  - 복
  lexicon: HALOT
  rationale: שָׁלוֹם의 범위는 평화보다 넓어 평안, 온전함, 번영까지 포함할 수 있으므로, 한국어 성경의 문맥에서 의미 범위를 비교적 잘 담는 ‘평강’을 채택했습니다.
- source_word: לְרָעָה
  english_pob_choice: not for harm
  chosen_korean: 재앙
  alternatives_korean:
  - 해
  - 악
  - 불행
  - 파멸
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악보다 ‘해로운 재난/불운’의 뜻이 강하므로, 본문의 대조 구조에서 ‘평강’과 짝을 이루는 경험적 বিপ면을 분명히 하는 ‘재앙’이 적절합니다.
- source_word: אַחֲרִית
  english_pob_choice: a future
  chosen_korean: 미래
  alternatives_korean:
  - 끝
  - 결말
  - 나중
  - 장래
  lexicon: HALOT
  rationale: 이 문맥에서는 종말이 아니라 장차 주어질 긍정적 앞날을 가리키므로, 현대 한국어에서 가장 직관적인 ‘미래’로 옮겼습니다.
- source_word: תִקְוָה
  english_pob_choice: a hope
  chosen_korean: 희망
  alternatives_korean:
  - 소망
  - 기대
  - 바람
  lexicon: HALOT
  rationale: תִקְוָה는 기대되는 좋은 앞날을 뜻하므로, ‘미래’와 병렬을 이루는 자연스러운 한국어 명사 ‘희망’이 가장 적합합니다.
theological_decisions:
- issue: יְהוָה의 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문에 여호와의 고유명이 직접 나오므로, POB 원칙에 따라 이를 제목적 대체어가 아니라 고유명사 ‘야훼’로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예언자적 선언 формула נְאֻם יְהוָה의 한국어 어조
  chosen_reading: 야훼의 말씀이니라
  alternative_readings:
  - 야훼께서 선언하십니다
  - 야훼께서 말씀하십니다
  rationale: 예언 공식의 선언성을 유지하면서도 현대 한국어 합쇼체에 맞게 매끄럽게 옮기기 위해, 단정적이고 공적 어조의 ‘말씀이니라’를 채택했습니다. 이는 서술 본문 내부의 인용된 예언 발화로서 문체적 긴장을 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
