  source_fidelity: 수정안은 כִּי의 근거·설명 기능을 ‘이는’으로, 반복되는 מַחֲשָׁבוֹת/חֹשֵׁב를 ‘계획’과 ‘품고 있는’으로, נְאֻם יְהוָה를 ‘야훼의 말씀입니다’로 충실히 반영합니다. שָׁלוֹם과 רָעָה의 대조는 각각 ‘평안’과 포괄적인 ‘해’로 옮겨, ‘재앙’으로 한정하는 것보다 원문의 의미 범위를 보존합니다. 마지막 부정사구도 야훼의 목적을 명시한 ‘나는 … 주려 합니다’로 자연스럽게 드러냈습니다.
  naturalness: 초안의 ‘말씀이니라’와 ‘아니니’는 요청된 현대 표준어 합쇼체와 맞지 않습니다. 수정안은 문장 전체를 현대적인 합쇼체로 통일하고, 각주 표지를 해당 어휘 바로 뒤에 배치했습니다.
  terminology: יְהוָה는 POB 방침에 따라 ‘야훼’로 유지했습니다. מַחֲשָׁבוֹת는 이 문맥에서 목적성 있는 ‘계획’이 적절하며, שָׁלוֹם의 넓은 뜻은 ‘평안’을 본문에 두고 각주에서 보완했습니다. אַחֲרִית와 תִקְוָה는 ‘미래와 희망’으로 유지할 수 있습니다.
