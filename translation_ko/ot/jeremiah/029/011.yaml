revisions:
- from: 내가 너희를 향하여 품은 생각을 내가 알고 있기 때문입니다. 야훼의 말씀이니라. 그것은 평강을 위한 생각이지 재앙을 위한 것이 아니니, 너희에게 미래와 희망을 주려는 것입니다.[a][b]
  to: 이는 내가 너희를 위하여 품고 있는 계획을 알고 있기 때문입니다. 야훼의 말씀입니다. 그 계획은 평안을 위한 것이며[a], 해를 위한 것이 아닙니다[b]. 나는 너희에게 미래와 희망을 주려 합니다.
  rationale: 현대 합쇼체로 문체를 통일하고, 원문의 반복적 계획 어휘와 야훼의 선언 공식을 유지했습니다. ‘해’는 רָעָה의 문맥상 비도덕적·경험적 의미를 포괄하면서도, ‘재앙’이라는 가능한 구체화는 각주에 보존합니다. 각주 표지는 설명 대상 낱말에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:02Z'
