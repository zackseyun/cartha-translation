  yaml_path: translation/ot/jeremiah/029/012.yaml
  text: Then you will call on me and come and pray to me[b][a], and I will hear you.
  footnotes:
  - marker: a
    text: Or 'go and pray to me'; the Hebrew verb is literally 'go/walk,' but here likely means approaching in order to pray.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will listen to you' or 'I will heed you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 너희가 나를 부르고 와서[a] 나에게 기도할 것이며, 내가 너희의 말을 들을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 ‘הלך’는 문자적으로는 ‘가다/걷다’이지만, 여기서는 기도하러 하나님께 나아가는 뜻으로 쓰인 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘שמע’는 여기서 ‘듣다’뿐 아니라 ‘귀 기울이다/응답하다’의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/קְרָאתֶם אֹתִי
  english_pob_choice: you will call on me
  chosen_korean: 너희가 나를 부르고
  alternatives_korean:
  - 너희가 나를 부르며
  - 너희가 나를 호출하고
  lexicon: HALOT
  rationale: קרא는 여기서 하나님을 향해 부르짖어 찾는 뜻이므로, 한국어는 자연스럽고 성경적인 ‘부르다’를 택해 ‘call on’의 호소적 뉘앙스를 살렸습니다.
- source_word: וַֽ/הֲלַכְתֶּ֔ם
  english_pob_choice: come
  chosen_korean: 와서
  alternatives_korean:
  - 가서
  - 걸어가서
  lexicon: HALOT
  rationale: הלך는 문자적으로는 ‘가다/걷다’이지만, 이어지는 ‘나에게 기도하다’와 결합할 때 하나님께 나아오는 동작을 뜻하므로 ‘와서’가 문맥상 가장 자연스럽습니다.
- source_word: וְ/שָׁמַעְתִּ֖י אֲלֵי/כֶֽם
  english_pob_choice: I will hear you
  chosen_korean: 내가 너희의 말을 들을 것입니다
  alternatives_korean:
  - 내가 너희를 들을 것입니다
  - 내가 너희에게 귀를 기울일 것입니다
  lexicon: HALOT
  rationale: שמע는 ‘듣다/귀 기울이다/응답하다’의 폭을 가지므로, ‘너희의 말을 들을 것입니다’로 직역성을 유지하면서도 관계적 응답 가능성을 열어 두었습니다.
theological_decisions:
- issue: 하나님의 응답을 어떻게 표현할 것인가
  chosen_reading: ‘내가 너희의 말을 들을 것입니다’로 옮겨, 단순 청취와 응답의 긴장을 그대로 남깁니다.
  alternative_readings:
  - ‘내가 너희에게 귀를 기울일 것입니다’
  - ‘내가 너희를 들어줄 것입니다’
  rationale: 히브리어는 하나님이 exiles의 부르짖음과 기도를 ‘듣는다’고 말하며, 그 듣기는 곧 응답을 함축하지만 그 범위를 과도하게 좁히지는 않습니다. 따라서 한국어도 해석을 한쪽으로 고정하지 않도록 했습니다.
  doctrine_reference: 하나님의 기도 응답의 실재를 말하되, 응답 방식의 세부는 본문이 허용하는 긴장대로 둠.
