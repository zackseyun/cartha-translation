  source_fidelity: 히브리어의 연속된 미래 행위(‘나를 부르고, 가서/와서 나에게 기도하고, 내가 너희에게 들을 것이다’)가 대체로 충실히 반영되었습니다. 다만 ‘기도하면’은 히브리어의 단순 접속·연쇄를 조건절로 읽히게 할 수 있으므로, 미래의 병렬적 전개로 옮기는 편이 더 정확합니다. ‘너희의 말을 들을 것입니다’는 אֲלֵיכֶם(‘너희에게/너희를’)의 의미를 자연스러운 한국어로 표현하며, 응답을 과도하게 단정하지 않습니다.
  naturalness: ‘너희가 나를 부르고 와서 나에게 기도하면’도 이해되지만, 현대 표준어 합쇼체의 성경 문체에서는 ‘기도할 것이며’가 원문의 연속성을 더 자연스럽고 분명하게 드러냅니다. 각주 표지는 해당 어휘 또는 절 바로 뒤에 두어야 독자가 무엇을 설명하는지 명확히 알 수 있습니다.
