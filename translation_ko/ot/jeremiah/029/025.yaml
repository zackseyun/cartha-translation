  rationale: 마아세야와 스바냐의 부자 관계 및 제사장 직분의 수식 대상을 원문대로 바로잡았습니다. 복수 ‘편지들’과 다음 절의 편지 내용을 도입하는 표현을 반영했으며, ‘네 이름으로’의 문맥적 함의는 본문에 과도하게 풀어넣지 않고 각주로 처리했습니다.
