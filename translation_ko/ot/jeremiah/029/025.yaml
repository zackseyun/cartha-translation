  source_fidelity: 수신자인 제사장 스바냐와 그의 부친 마아세야의 관계가 초안에서 반대로 번역되었습니다. 히브리어 צְפַנְיָה בֶן־מַעֲשֵׂיָה הַכֹּהֵן은 ‘마아세야의 아들인 제사장 스바냐’입니다. 또한 סְפָרִים는 복수이므로 ‘편지들’이 적절하며, 마지막 לֵאמֹר은 다음 절에 이어지는 편지의 내용을 도입하므로 ‘이렇게 말하였다’로 옮기는 것이 충실합니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 성경 문체를 유지합니다. ‘그 내용은 이러하다’도 가능하지만, 원문의 발화 도입을 더 직접적으로 반영하는 ‘이렇게 말하였다’를 채택했습니다.
  terminology: ‘만군의 야훼’, ‘이스라엘의 하나님’, ‘제사장’은 원문 및 POB 용어 원칙에 맞습니다. ‘네 이름으로’는 직역을 보존하고, 각주는 무단의 자기 권위라는 문맥적 함의를 신중하게 설명합니다.
