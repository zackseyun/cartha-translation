  text: כֹּֽה אָמַ֞ר יְהוָ֧ה צְבָא֛וֹת אֱלֹהֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר יַ֡עַן אֲשֶׁ֣ר אַתָּה֩ שָׁלַ֨חְתָּ בְ/שִׁמְ/כָ֜ה סְפָרִ֗ים אֶל כָּל הָ/עָם֙ אֲשֶׁ֣ר בִּ/ירוּשָׁלִַ֔ם וְ/אֶל צְפַנְיָ֤ה בֶן מַֽעֲשֵׂיָה֙ הַ/כֹּהֵ֔ן וְ/אֶ֥ל כָּל הַ/כֹּהֲנִ֖ים לֵ/אמֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/025.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel: Because you have sent letters in your own name to all the people who are in Jerusalem, and to Zephaniah son of Maaseiah the priest, and to all the priests, saying,'
  footnotes:
  - marker: a
    text: Or 'in your name.' The phrase likely highlights that Shemaiah acted on his own authority rather than by the LORD's authority.
    reason: lexical_alternative
translation:
  language: ko
  text: “만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 네가 네 이름으로[a] 예루살렘에 있는 모든 백성과 마아세야의 아들인 제사장 스바냐와 모든 제사장에게 편지들을 보내어 이렇게 말하였다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네 이름으로’는 스마야가 야훼의 권위가 아니라 자신의 권위로 행동했음을 암시할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: “...이렇게 말씀하십니다”
  alternatives_korean:
  - “...말씀하십니다”
  - “이와 같이 말씀하십니다”
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 격식을 살리면서도 현대 한국어에서는 자연스럽게 들리도록 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: “만군의 야훼”
  alternatives_korean:
  - “야훼 만군의 하나님”
  - “만군의 주 야훼”
  lexicon: HALOT
  rationale: POB의 신명은 야훼로 두고, צְבָאוֹת은 전통적이면서도 의미를 보존하는 ‘만군의’로 옮겼습니다.
- source_word: בְשִׁמְךָ
  english_pob_choice: in your own name
  chosen_korean: “네 이름으로”
  alternatives_korean:
  - “네 이름으로 스스로”
  - “네 권위로”
  lexicon: HALOT
  rationale: 문맥상 자기 권위로 보낸 편지라는 대비가 핵심이므로, 과잉 해설 없이 ‘네 이름으로’로 유지했습니다.
- source_word: סְפָרִים
  english_pob_choice: letters
  chosen_korean: “편지”
  alternatives_korean:
  - “서신”
  - “글”
  lexicon: HALOT
  rationale: 수신자에게 보낸 문서라는 문맥에 가장 직접적인 현대어입니다.
- source_word: צְפַנְיָה בֶן מַעֲשֵׂיָה הַכֹּהֵן
  english_pob_choice: Zephaniah son of Maaseiah the priest
  chosen_korean: “제사장 스바냐의 아들 마아세야”
  alternatives_korean:
  - “스바냐의 아들 마아세야 제사장”
  - “제사장 스바냐, 마아세야의 아들”
  lexicon: HALOT
  rationale: 히브리어의 소유·직분 결합을 한국어에서 자연스럽게 풀어, 인명과 직분을 분명히 했습니다.
theological_decisions:
- issue: 여호와를 ‘야훼’로 음역하는 문제
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 원문 고유명을 보존하는 POB 원칙을 따르며, 대체 титulus가 아니라 언약 이름 자체를 드러내기 위해서입니다.
  doctrine_reference: 'POB terminology: יְהוָה → 야훼'
