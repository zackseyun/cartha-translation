source:
  edition: WLC
  text: כֹּ֥ה אָמַ֛ר יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל לְ/כָל הַ֨/גּוֹלָ֔ה אֲשֶׁר הִגְלֵ֥יתִי מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/004.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, to all the exiles whom I have sent into exile from Jerusalem to Babylon:'
  footnotes:
  - marker: a
    text: 'Or, ''whom I have exiled from Jerusalem to Babylon.'' The Hebrew verb is causative: ''cause to go into exile/deport.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 예루살렘에서 바빌론으로 내가 유배시킨 모든 유배민에게 이렇게 말씀하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 이와 같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전령 공식의 격식을 살리면서도 현대 한국어에서 자연스럽게 들리도록 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 하나님 이름은 프로젝트 기본값에 따라 야훼로 두고, צְבָאוֹת은 관용적이면서도 군대/천상 군대의 총칭을 담는 '만군'으로 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하느님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: ייכל/construct 관계를 한국어 소유격으로 자연스럽게 풀어, 언약적 정체성을 분명히 했습니다.
- source_word: הִגְלֵיתִי
  english_pob_choice: I have sent into exile
  chosen_korean: 사로잡아 보낸
  alternatives_korean:
  - 포로로 보내신
  - 유배시킨
  lexicon: HALOT
  rationale: 히필의 원인성을 살리면서, POB의 'sent into exile/deport'에 맞게 강제 이주·포로화의 의미를 드러냈습니다. '사로잡아 보낸'은 동작과 결과를 함께 보여 줍니다.
- source_word: הַגּוֹלָה
  english_pob_choice: the exiles
  chosen_korean: 모든 포로
  alternatives_korean:
  - 모든 유배민
  - 포로 공동체
  lexicon: HALOT
  rationale: 집단 명사로서의 대상을 한국어에서 가장 직접적으로 드러내는 말로 옮겼습니다. '포로'는 단순한 상태보다 유배된 사람들을 가리키는 집합적 용법을 유지합니다.
theological_decisions:
- issue: 야훼의 직접적 행위 진술
  chosen_reading: '''내가 ... 사로잡아 보낸''으로 번역해, 포로가 바빌론의 우연한 승리만이 아니라 야훼의 주권 아래 있음을 드러냈습니다.'
  alternative_readings:
  - '''허락하신'''
  - '''바빌론이 끌고 간'''
  rationale: 히브리어가 명시하는 신적 주체성을 약화하지 않기 위해 직접적 원인을 유지했습니다. 이는 본문의 심판 신학과 일치합니다.
  doctrine_reference: Translation philosophy §1, §3
