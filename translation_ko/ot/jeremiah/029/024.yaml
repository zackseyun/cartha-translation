  - ‘말하십시오’만 번역
  rationale: 원문은 단순 중복이 아니라 명령 동사 뒤에 인용 도입 표지가 붙는 형식이므로, 구조적 긴장을 지우지 않기 위해 중첩을 유지했습니다.
