base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
  footnotes:
  - marker: a
    text: Or 'bad figs' or 'spoiled figs'; the Hebrew adjective denotes figs so poor that they are inedible.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. 「보십시오, 내가 그들에게 칼과 기근과 전염병을 보내고, 썩은 무화과처럼 만들어서 먹을 수 없게 하겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘썩은’은 히브리어 형용사의 핵심 의미를 풀어 옮긴 것으로, ‘못 먹을 정도로 나쁜/상한’ 무화과를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 만군의 주
  lexicon: HALOT
  rationale: צְבָאוֹת의 통상적 의미를 살려 ‘만군의’로 옮기고, 프로젝트 기본값에 따라 신적 이름은 ‘야훼’로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 예언적 주목 환기 기능을 한국어에서 자연스럽게 살리면서도, 현대 문체의 격식을 유지하는 표현으로 옮겼습니다.
- source_word: הַחֶרֶב הָרָעָב הַדָּבֶר
  english_pob_choice: the sword, the famine, and the pestilence
  chosen_korean: 칼과 기근과 전염병
  alternatives_korean:
  - 칼과 흉년과 역병
  - 전쟁과 기근과 염병
  lexicon: HALOT
  rationale: 예언서의 심판 삼중구를 직역에 가깝게 유지했습니다. ‘전염병’은 דָּבֶר의 재앙적 질병 의미를 현대 한국어에서 분명하게 전달합니다.
- source_word: וְנָתַתִּי ... כַּתְּאֵנִים ... אֲשֶׁר לֹא תֵאָכַ֖לְנָה מֵרֹעַ
  english_pob_choice: I will make them like rotten figs that cannot be eaten because of their badness
  chosen_korean: 썩은 무화과처럼 만들어서 먹을 수 없게 하겠습니다
  alternatives_korean:
  - 못 먹을 무화과처럼 만들겠습니다
  - 썩어 못 먹는 무화과처럼 만들겠습니다
  lexicon: HALOT
  rationale: 비교 구문을 그대로 살려 ‘무화과’ 이미지를 유지했고, ‘먹을 수 없게’로 열매의 실질적 비가식성을 자연스럽게 표현했습니다.
