  yaml_path: translation/ot/jeremiah/029/017.yaml
  text: 'Thus says Yahweh of hosts: Behold[a], I am sending against them the sword, the famine, and the pestilence, and I will make them like rotten figs that cannot be eaten because of their badness.'
  footnotes:
  - marker: a
    text: Or 'bad figs' or 'spoiled figs'; the Hebrew adjective denotes figs so poor that they are inedible.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. 「보십시오, 내가 그들에게 칼과 기근과 전염병을 보내고, 그들을 먹을 수 없을 만큼 나쁜[a] 무화과처럼 만들겠습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나쁜’은 히브리어 형용사의 핵심 의미를 옮긴 것입니다. 문맥상 먹을 수 없을 정도로 나쁘거나 상한 무화과를 가리키며, ‘상한’ 또는 ‘썩은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
