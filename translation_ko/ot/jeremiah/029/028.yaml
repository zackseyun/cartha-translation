  source_fidelity: The causal opening and the sequence of imperatives are preserved. However, ‘편지’를 본문에 넣는 것은 히브리어 שָׁלַח(‘보내다’)에 명시되지 않은 전달 매체를 특정합니다. Also, the elliptical אֲרֻכָּה הִיא is better represented with a note that retains its concise, context-dependent force.
  naturalness: The draft is generally fluent in modern formal-polite Korean. ‘이렇게 전해 보냈습니다’ is natural Korean for sending a quoted communication without asserting that it was a letter. ‘오래 걸릴 것입니다’ is concise and idiomatic in this context.
  terminology: ‘바빌론,’ ‘집,’ ‘정원,’ and ‘열매’ are appropriate. ‘거기서 사십시오’ suitably renders the contextual sense of וְשֵׁבוּ without imposing a more technical term such as ‘거주하십시오.’
