source:
  edition: WLC
  text: כִּ֣י עַל כֵּ֞ן שָׁלַ֥ח אֵלֵ֛י/נוּ בָּבֶ֥ל לֵ/אמֹ֖ר אֲרֻכָּ֣ה הִ֑יא בְּנ֤וּ בָתִּים֙ וְ/שֵׁ֔בוּ וְ/נִטְע֣וּ גַנּ֔וֹת וְ/אִכְל֖וּ אֶת פְּרִי/הֶֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/028.yaml
  text: For this reason he sent to us in Babylon[a], saying, ‘It will be a long time. Build houses and live in them[b], and plant gardens and eat their fruit.’
  footnotes:
  - marker: a
    text: Or, more literally, 'It is long.' The Hebrew is elliptical, with the sense that the stay/exile in Babylon will be prolonged.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and dwell'; rendered 'live in them' because the verb follows 'Build houses' and the object is implied in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 때문에 그가 바빌론에 있는 우리에게 이렇게 전해 보냈습니다. “오래 걸릴 것입니다[a]. 집들을 짓고 거기서 사십시오[b]. 정원들을 심고 그 열매를 먹으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그것은 길다’입니다. 무엇이 긴지는 생략되어 있으며, 문맥상 바빌론에서의 체류 기간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그리고 거하라/살라’입니다. 앞의 ‘집들을 짓다’와 결합되어 있어 한국어에서는 ‘거기서 사십시오’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַל כֵּן
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 그러므로
  - 이 때문에
  lexicon: HALOT
  rationale: 이유를 앞문맥에 연결하는 인과 표현을 자연스러운 현대 한국어로 옮기되, 단순한 결론 표지보다 원문의 사유 제시 기능을 살렸습니다.
- source_word: שָׁלַח אֵלֵינוּ בָּבֶל
  english_pob_choice: he sent to us in Babylon
  chosen_korean: 그가 바빌론에 있는 우리에게 편지를 보내어
  alternatives_korean:
  - 그가 바빌론에 있는 우리에게 보내어
  - 그가 바빌론에서 우리에게 소식을 보내어
  lexicon: HALOT
  rationale: 히브리어의 ‘보내다’와 수신 대상의 위치를 살리면서, 한국어에서는 문맥상 ‘편지를 보내어’가 가장 분명하게 전달됩니다.
- source_word: אֲרֻכָּה הִיא
  english_pob_choice: It will be a long time
  chosen_korean: 때가 오래 갈 것입니다
  alternatives_korean:
  - 오랜 시간이 될 것입니다
  - 오래 지속될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 생략된 뜻이 포로/체류 기간을 가리키므로, 한국어에서는 자연스럽게 ‘때’로 풀어 주되 원문의 간결함을 유지했습니다.
- source_word: וְשֵׁבוּ
  english_pob_choice: and live in them
  chosen_korean: 거기서 사십시오
  alternatives_korean:
  - 그 안에서 거주하십시오
  - 그 안에 사십시오
  lexicon: HALOT
  rationale: ‘집들을 짓고’와 짝을 이루는 문맥에서 ‘거기서 사십시오’가 가장 매끄럽고, 원문의 ‘거하다/살다’ 뜻을 과도하게 해석하지 않습니다.
theological_decisions:
- issue: 포로 생활의 기간을 직접 명시할지 여부
  chosen_reading: 원문의 생략된 표현을 한국어에서 ‘때가 오래 갈 것입니다’로 완화 없이 드러냈습니다.
  alternative_readings:
  - ‘오래될 것입니다’처럼 더 축약된 번역
  - ‘포로 생활이 길 것입니다’처럼 대상 명시
  rationale: 본문은 바빌론 체류가 장기화됨을 암시하지만 대상을 직접 추가하지는 않습니다. 한국어에서는 의미를 분명히 하되, 원문이 말하지 않은 ‘포로 생활’을 본문에 삽입하지 않도록 조정했습니다.
  doctrine_reference: 본문 의미 보존과 과잉해석 방지
- issue: ‘집들을 짓고 거기서 사십시오’의 명령체 수위
  chosen_reading: 평서형 안내가 아니라 직접 명령으로 옮겼습니다.
  alternative_readings:
  - ‘집들을 짓고 거기 살 것입니다’처럼 미래형으로 완화
  - ‘집들을 짓고 그 안에 거주하라’처럼 문어체 명령
  rationale: 히브리어 연속 명령의 기능을 살리기 위해 한국어에서도 직접적인 명령으로 표현했습니다. 이는 포로들에게 현재 행동 지침을 주는 문맥과도 맞습니다.
  doctrine_reference: 원문 명령법 보존
