id: JER.29.32
reference: Jeremiah 29:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה הִנְ/נִ֨י פֹקֵ֜ד עַל שְׁמַעְיָ֣ה הַ/נֶּחֱלָמִי֮ וְ/עַל זַרְע/וֹ֒ לֹא יִהְיֶ֨ה ל֜/וֹ אִ֣ישׁ יוֹשֵׁ֣ב בְּ/תוֹךְ הָ/עָ֣ם הַ/זֶּ֗ה וְ/לֹֽא יִרְאֶ֥ה בַ/טּ֛וֹב אֲשֶׁר אֲנִ֥י עֹשֶֽׂה לְ/עַמִּ֖/י נְאֻם יְהוָ֑ה כִּֽי סָרָ֥ה דִבֶּ֖ר עַל יְהוָֽה־־־־׀׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/032.yaml
  text: 'Therefore thus says Yahweh: Behold[a], I am about to punish Shemaiah the Nehelamite and his offspring. He will not have a man dwelling among this people, nor will he see the good that I am doing for my people, declares Yahweh[b], because he has spoken rebellion against Yahweh.'
  footnotes:
  - marker: a
    text: Or possibly 'Shemaiah the dreamer'; the epithet הַנֶּחֱלָמִי may be connected with dreaming, but its exact force here is uncertain, so the main text preserves it as a proper designation.
    reason: lexical_alternative
  - marker: b
    text: Or 'apostasy' or 'revolt' against the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 세마야 곧 느헬람 사람과 그의 자손을 벌하겠습니다. 그에게는 이 백성 가운데 사는 사람이 하나도 없을 것이며, 내가 내 백성을 위해 행하는 좋은 것을 그가 보지 못할 것입니다. 야훼의 말씀입니다. 이는 그가 야훼를 거슬러 반역을 말했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 ‘느헬람 사람’이 아니라 ‘꿈꾸는 사람’이라는 뜻일 가능성이 있습니다. אולם 본문은 그 정확한 의미가 분명하지 않아 본문에서는 고유한 지칭으로 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 혹은 ‘배반’ 또는 ‘배교’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן / Therefore
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그리하여
  lexicon: HALOT
  rationale: 선행 맥락의 심판 선언을 이어 주는 인과적 접속사로, 현대 한국어에서 가장 자연스럽고 문맥을 살리는 표현입니다.
- source_word: הִנְנִי פֹקֵד עַל / Behold, I am about to punish
  english_pob_choice: Behold, I am about to punish
  chosen_korean: 보십시오, 내가 … 벌하겠습니다
  alternatives_korean:
  - 보라, 내가 … 징벌하겠습니다
  - 내가 … 심판하겠습니다
  lexicon: HALOT
  rationale: 히브리어 הִנְנִי의 지시적·임박성 뉘앙스를 ‘보십시오’로 살리고, פקד על의 심판적 용례는 ‘벌하다’로 자연스럽게 옮겼습니다.
- source_word: הַנֶּחֱלָמִי / the Nehelamite
  english_pob_choice: the Nehelamite
  chosen_korean: 느헬람 사람
  alternatives_korean:
  - 느헬람인
  - 꿈꾸는 사람
  lexicon: HALOT
  rationale: 형태상 고유 지명/별칭으로 처리하는 본문 흐름을 따라 음역했고, 의미가 ‘꿈꾸는 사람’일 가능성은 본문 각주로만 남겼습니다.
- source_word: וְעַל זַרְעוֹ / and his offspring
  english_pob_choice: and his offspring
  chosen_korean: 그의 자손
  alternatives_korean:
  - 그의 후손
  - 그의 씨
  lexicon: HALOT
  rationale: 집합적 후손 개념을 한국어에서 가장 분명하게 전달하는 표준 표현으로 옮겼습니다.
- source_word: לֹא יִהְיֶה לוֹ אִישׁ יוֹשֵׁב / He will not have a man dwelling
  english_pob_choice: He will not have a man dwelling
  chosen_korean: 그에게는 … 사는 사람이 하나도 없을 것
  alternatives_korean:
  - 그에게는 … 거주하는 사람이 없을 것
  - 그의 계보를 잇는 사람이 없을 것
  lexicon: HALOT
  rationale: 히브리어의 ‘그에게 속한 남자 하나도 없음’이라는 관용을 살리되, 현대 독자에게는 ‘사는 사람’으로 풀어 자연스럽게 표현했습니다.
- source_word: כִּי סָרָה דִבֶּר עַל יְהוָה / because he has spoken rebellion against Yahweh
  english_pob_choice: because he has spoken rebellion against the LORD
  chosen_korean: 이는 그가 야훼를 거슬러 반역을 말했기 때문입니다
  alternatives_korean:
  - 이는 그가 야훼를 거슬러 배반을 말했기 때문입니다
  - 이는 그가 야훼에 대해 반역적인 말을 했기 때문입니다
  lexicon: HALOT
  rationale: סָרָה의 핵심은 단순한 말실수보다 언약적 반역이므로, 명사를 그대로 살린 ‘반역을 말하다’로 옮겨 평가를 약화하지 않았습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 יְהוָה를 사용하므로 프로젝트 기본값에 따라 고유한 언약명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md contested terms: יְהוָה YHWH'
- issue: ‘반역’의 신학적 강도
  chosen_reading: 야훼를 거슬러 반역을 말하다
  alternative_readings:
  - 야훼를 거슬러 배반을 말하다
  - 야훼에 대해 거만하게 말하다
  rationale: 예언자적 고발의 초점은 단순한 불손함이 아니라 야훼께 대한 언약적 반역이므로, 그 긴장을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 예언서의 언약 위반/반역 어휘 사용
