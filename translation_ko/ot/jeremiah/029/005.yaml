  chosen_reading: 포로 공동체에게 주어진 실제 생활 지침으로, 한국어에서도 경구체가 아니라 직접적 명령형으로 옮겼습니다.
  alternative_readings:
  - 완곡한 권고문체
  - 서술형으로 완화한 번역
  rationale: 본문은 바벨론 포로에게 내려진 구체적 지시이므로, 원문의 실천적 강도를 보존하는 것이 독자 이해에 중요합니다.
  doctrine_reference: 예레미야 29장 포로 공동체를 향한 언약적 섭리와 순종의 요청
