- source_word: בָתִּ֖ים
  english_pob_choice: houses
  chosen_korean: 집을
  alternatives_korean:
  - 가옥을
  - 주택을
  lexicon: HALOT
  rationale: בַּיִת의 복수는 문자적으로 ‘집들’이지만, 한국어에서는 문맥상 복수 표지 없이도 자연스럽게 읽히므로 ‘집을’로 옮기되 구체적 건조물의 뜻을 유지했습니다.
- source_word: וְשֵׁבוּ
  english_pob_choice: live in them
  chosen_korean: 거기에서 사십시오
  alternatives_korean:
  - 거기에서 거주하십시오
  - 거기에서 머무르십시오
  lexicon: HALOT
  rationale: ישב는 ‘앉다/거주하다/살다’의 범위를 가지며, 문맥상 집과 연결되므로 단순하고 현대적인 ‘사십시오’가 거주 의미를 가장 자연스럽게 드러냅니다.
- source_word: גַנּוֹת
  english_pob_choice: gardens
  chosen_korean: 동산을
  alternatives_korean:
  - 정원을
  - 과수원을
  lexicon: HALOT
  rationale: גן은 넓게는 ‘정원/동산’을 뜻하지만, 뒤의 ‘열매’와 결합될 때 단순한 장식용 정원보다 먹을 수 있는 식재 공간의 뉘앙스가 살아나므로 ‘동산’을 택했습니다.
