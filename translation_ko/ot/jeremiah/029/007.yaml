    rationale: הִגְלֵיתִי는 하나님이 ‘너희를 포로/유배로 보내셨다’는 사역적 표현입니다. ‘내가 너희를 포로로 보낸’이 현대 한국어에서 더 직접적이고 자연스럽습니다.
