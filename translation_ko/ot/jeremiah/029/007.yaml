  source_fidelity: 히브리어의 명령 두 개, 야훼께 드리는 도시를 위한 기도, 그리고 도시의 שָׁלוֹם과 포로 공동체의 שָׁלוֹם을 연결하는 반복을 대체로 충실히 옮겼습니다. 다만 ‘사로잡혀 가게 한’은 הִגְלֵיתִי(‘유배/포로로 보내다’)를 자연스럽게 표현하지 못하고, 문장 구조도 다듬을 필요가 있습니다.
  naturalness: ‘구하고, … 기도하십시오’는 앞 절의 명령성이 연결형에 묻혀 다소 불균형합니다. 두 명령을 각각 합쇼체 종결로 명확히 제시하고, ‘사로잡혀 가게 한’ 대신 현대 한국어에 자연스러운 ‘포로로 보낸’을 쓰는 것이 좋습니다.
  terminology: ‘야훼’는 프로젝트의 YHWH 표기 원칙과 일치합니다. ‘평안’은 שָׁלוֹם의 반복을 유지하는 적절한 선택이지만, 폭넓은 의미는 각주로 밝혀야 합니다. ‘도시’는 자연스럽고 적절합니다.
  issues:
