  text: וְ/דִרְשׁ֞וּ אֶת שְׁל֣וֹם הָ/עִ֗יר אֲשֶׁ֨ר הִגְלֵ֤יתִי אֶתְ/כֶם֙ שָׁ֔מָּ/ה וְ/הִתְפַּֽלְל֥וּ בַעֲדָ֖/הּ אֶל יְהוָ֑ה כִּ֣י בִ/שְׁלוֹמָ֔/הּ יִהְיֶ֥ה לָ/כֶ֖ם שָׁלֽוֹם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/007.yaml
  text: Seek the welfare of the city where I have sent you into exile[a], and pray to Yahweh on its behalf, for in its welfare you will have welfare.
  footnotes:
  - marker: a
    text: Or 'peace' / 'well-being' throughout the verse; the Hebrew word shalom is repeated for both the city and the exiles.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희를 포로로 보낸 그 도시의 평안을 구하십시오. 그 도시를 위하여 야훼께 기도하십시오. 그 도시가 평안하면 너희도 평안을 누릴 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 샬롬(שָׁלוֹם)은 이 절에서 도시와 포로 공동체에 대하여 반복되며, 평안뿐 아니라 평화, 안녕, 복지를 포함하는 넓은 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִרְשׁוּ
  english_pob_choice: Seek
  chosen_korean: 구하고
  alternatives_korean:
  - 찾고
  - 추구하고
  - 힘써 구하고
  lexicon: HALOT
  rationale: דָּרַשׁ의 명령형은 단순한 탐색보다 적극적인 추구를 뜻하므로, 한국어에서는 자연스럽고 행위 지향적인 ‘구하다’로 옮겼습니다.
- source_word: שְׁלוֹם
  english_pob_choice: welfare
  chosen_korean: 평안
  alternatives_korean:
  - 평화
  - 복지
  - 안녕
  lexicon: HALOT
  rationale: 이 절의 שָׁלוֹם은 도시의 총체적 안녕과 번영을 가리키므로, 한국어에서는 문맥상 넓은 의미를 살릴 수 있는 ‘평안’을 택했습니다. 같은 어근의 반복도 유지했습니다.
- source_word: הִגְלֵיתִי
  english_pob_choice: have sent you into exile
  chosen_korean: 사로잡혀 가게 한
  alternatives_korean:
  - 포로로 보내신
  - 유배시킨
  - 사로잡혀 가게 하신
  lexicon: HALOT
  rationale: 하필형은 하나님이 그들을 포로 상태로 보내신 주체임을 분명히 하므로, 전통적이면서도 본문의 역사적 현실을 드러내는 ‘사로잡혀 가게 한’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유 신명성을 유지하고 호칭 대체를 피했습니다.
theological_decisions:
- issue: 포로지의 도시를 위한 기도 명령의 뉘앙스
  chosen_reading: 포로로 끌려온 제국 도시에 대해서도 그 복리와 질서를 구하며, 그 도시에 대해 하나님께 중보하도록 요구하는 명령으로 읽었습니다.
  alternative_readings:
  - 단순한 개인적 안위를 구하는 권고
  - 점령 권력에 대한 순응 요구
  rationale: 문맥의 핵심은 바벨론 도시의 평안을 위해 기도하라는 명령이며, 이는 신앙 공동체가 포로 상태에서도 공동선에 책임을 지는 태도를 뜻합니다. 다만 본문은 제국을 미화하지 않고, 하나님의 섭리 아래에서의 현실적 순복을 말합니다.
  doctrine_reference: 'Jer 29:7의 포로기 신학: 심판 아래에서도 공동체적 선을 구하고 기도하는 소명'
