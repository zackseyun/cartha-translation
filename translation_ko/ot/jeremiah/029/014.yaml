  to: 나는 너희가 나를 찾을 수 있게 하겠다—야훼의 말씀이다. 나는 너희의 처지를 회복시키고[a], 내가 너희를 그곳으로 쫓아낸 모든 나라와 모든 곳에서 너희를 모아, 너희를 내가 너희를 유배 보냈던 그곳으로 다시 데려오겠다—내가 너희를 그곳으로 쫓아낸 야훼의 말씀이다.
