  naturalness: ‘나는 너희에게서 나를 찾을 수 있게 하겠고’는 ‘너희에게서’의 쓰임이 현대 표준어에서 다소 어색합니다. ‘너희가 나를 찾을 수 있게 하겠다’가 자연스럽고, 하나님의 주도성도 유지합니다. 예언 공식은 ‘야훼의 말씀이다’가 현대적이면서 엄숙한 합쇼체 문맥에 알맞습니다.
