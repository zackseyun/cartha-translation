base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/014.yaml
  text: And I will let myself be found by you[a], declares Yahweh, and I will restore your fortunes and gather you from all the nations and from all the places where I have driven you, declares Yahweh, and I will bring you back to the place from which I sent you into exile.
  footnotes:
  - marker: a
    text: Or, more literally, 'I will restore your captivity' or 'I will bring back your captives.' The Hebrew expression is an idiom for reversing a condition of exile and distress.
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 너희가 나를 찾을 수 있게 하겠다—야훼의 말씀이다. 나는 너희의 처지를 회복시키고[a], 내가 너희를 그곳으로 쫓아낸 모든 나라와 모든 곳에서 너희를 모아, 너희를 내가 너희를 유배 보냈던 그곳으로 다시 데려오겠다—내가 너희를 그곳으로 쫓아낸 야훼의 말씀이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘너희의 포로 상태를 회복시키겠다’ 또는 ‘너희의 포로들을 돌아오게 하겠다.’ 이 히브리어 표현은 유배와 고통의 상태가 역전됨을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִמְצֵאתִי לָכֶם
  english_pob_choice: I will let myself be found by you
  chosen_korean: 나는 너희에게서 나를 찾을 수 있게 하겠고
  alternatives_korean:
  - 내가 너희에게서 발견되겠다
  - 내가 너희에게 나타나겠다
  lexicon: HALOT
  rationale: 니팔형의 수동·상호적 뉘앙스를 살리되, 한국어에서는 ‘찾을 수 있게 하다’가 하나님의 주도적 자기현현과 인칭 목적어를 자연스럽게 담아냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼의 선언이니라
  - 야훼께서 말씀하신다
  lexicon: HALOT
  rationale: 예언 공식의 엄숙한 결론을 살리면서, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וְשַׁבְתִּי אֶת שביתכם
  english_pob_choice: I will restore your fortunes
  chosen_korean: 너희의 포로 신세를 회복시키고
  alternatives_korean:
  - 너희의 운명을 회복시키고
  - 너희의 포로 상태를 되돌리고
  lexicon: HALOT
  rationale: 히브리어 관용구를 단순한 ‘재산/형편’보다 포로·유배의 상태를 드러내는 한국어로 풀어, 뒤따르는 모음과 귀환 문맥과의 연결을 살렸습니다.
- source_word: וְקִבַּצְתִּי אֶתְכֶם מִכָּל הַגּוֹיִם וּמִכָּל הַמְּקוֹמוֹת
  english_pob_choice: and gather you from all the nations and from all the places
  chosen_korean: 모든 나라와 모든 곳에서 너희를 모아
  alternatives_korean:
  - 모든 나라와 모든 장소에서 너희를 모아
  - 열국과 여러 곳에서 너희를 모아
  lexicon: HALOT
  rationale: ‘나라’와 ‘곳’을 병렬로 유지해 포로 분산의 범위를 그대로 드러냈고, ‘모아’로 קבץ의 집결 이미지를 살렸습니다.
- source_word: אֲשֶׁר הִדַּחְתִּי אֶתְכֶם שָׁם
  english_pob_choice: where I have driven you
  chosen_korean: 내가 너희를 그리로 쫓아낸
  alternatives_korean:
  - 내가 너희를 거기서 내쫓은
  - 내가 너희를 그곳으로 흩어 보낸
  lexicon: HALOT
  rationale: 하느님의 심판 행위로서의 ‘몰아냄/추방’의 강도를 유지하기 위해, 부드러운 ‘흩어 보낸’보다 ‘쫓아낸’을 택했습니다.
- source_word: אֶל הַמָּקוֹם אֲשֶׁר הִגְלֵיתִי אֶתְכֶם מִשָּׁם
  english_pob_choice: to the place from which I sent you into exile
  chosen_korean: 내가 너희를 유배 보냈던 그 땅으로 다시 데려오겠다
  alternatives_korean:
  - 내가 너희를 유배시켰던 그곳으로 다시 데려오겠다
  - 내가 너희를 추방했던 곳으로 다시 데려오겠다
  lexicon: HALOT
  rationale: הגלה의 ‘유배시키다’ 의미를 분명히 드러내면서, 반복되는 ‘장소’보다 ‘그 땅’이 귀환의 대조를 더 선명하게 만들기 때문에 이를 택했습니다.
theological_decisions:
- issue: שׁוּב אֶת־שְׁבִית/שְׁבוּת의 관용구 처리
  chosen_reading: ‘너희의 포로 신세를 회복시키고’로 옮겨, 단순한 재산 회복이 아니라 유배와 포로 상태의 역전이라는 문맥적 의미를 드러냈습니다.
  alternative_readings:
  - ‘너희의 포로를 되돌리고’
  - ‘너희의 운명을 회복시키고’
  rationale: 뒤이어 나오는 ‘모아… 다시 데려오겠다’가 실제 귀환을 충분히 설명하므로, 관용구는 상태의 회복으로 풀되 유배 맥락을 잃지 않게 했습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
- issue: 예언 공식에서의 하나님의 이름 표기
  chosen_reading: יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 본 프로젝트의 기본 원칙에 따라 신적 고유명은 대체 칭호가 아니라 음역으로 보존하여, 본문의 직접성과 언약적 개별성을 유지했습니다.
  doctrine_reference: Project glossary — YHWH
