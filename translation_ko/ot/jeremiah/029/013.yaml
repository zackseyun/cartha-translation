translation:
  language: ko
  text: 여러분은 나를 찾고 나를 만나게 될 것입니다. 여러분이 온 마음을 다해 나를 찾을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분이 온 마음을 다해 나를 찾을 때, 나를 찾고 나를 만나게 될 것입니다.’ 히브리어 ‘키’는 여기서 ‘왜냐하면’, ‘때에’, 또는 ‘만일’과 같이 서로 관련된 뜻으로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  english_pob_choice: you will seek
  chosen_korean: 찾으면 / 찾을 것이며
  alternatives_korean:
  - 구하면 / 구할 것이며
  - 찾게 되면
  lexicon: HALOT
  rationale: בקשׁ는 하나님을 향한 적극적 탐구를 뜻하므로, 한국어에서는 자연스럽게 ‘찾다’로 옮겨 반복되는 동사를 살렸습니다.
- source_word: וּמְצָאתֶם
  english_pob_choice: and find me
  chosen_korean: 나를 만나게 될 것입니다
  alternatives_korean:
  - 나를 찾게 될 것입니다
  - 나를 발견하게 될 것입니다
  lexicon: HALOT
  rationale: ‘find me’는 단순 발견보다 관계적 도달을 담아, 한국어에서는 ‘만나게 되다’로 옮겨 인격적 만남의 뉘앙스를 살렸습니다.
- source_word: תִדְרְשֻׁנִי
  english_pob_choice: you seek me
  chosen_korean: 나를 찾으면
  alternatives_korean:
  - 나를 구하면
  - 나를 간절히 찾으면
  lexicon: HALOT
  rationale: דרשׁ는 하나님을 향한 간구·탐구를 포함하므로, 첫 절의 ‘찾다’와 어휘를 맞추되 중복을 허용해 의미의 강도를 유지했습니다.
- source_word: בְּכָל לְבַבְכֶם
  english_pob_choice: with all your heart
  chosen_korean: 온 마음을 다해
  alternatives_korean:
  - 마음을 다해
  - 온 마음으로
  lexicon: HALOT
  rationale: ‘heart’는 성경 히브리어의 내면 전체를 가리키므로, 현대 한국어에서 자연스럽고 포괄적인 ‘온 마음을 다해’로 옮겼습니다.
theological_decisions:
- issue: כִּי의 관계를 어떻게 표시할지
  chosen_reading: ‘찾으면’으로 조건 관계를 드러내되, 본문의 약속성과 조건성을 함께 살렸습니다.
  alternative_readings:
  - ‘왜냐하면’으로 원인 관계를 드러내는 읽기
  - ‘때에/그때’로 시간 관계를 드러내는 읽기
  rationale: 히브리어 כי가 여기서 조건·시점·이유를 모두 열어 두므로, 한국어는 한 가지로 단정하지 않고 문맥상 자연스러운 조건형으로 처리했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
