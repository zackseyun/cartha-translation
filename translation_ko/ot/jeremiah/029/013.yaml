  source_fidelity: 개정이 필요합니다. 초안은 첫 번째 וּבִקַּשְׁתֶּם(‘너희가 나를 찾을 것이다’)를 ‘온 마음을 다해 나를 찾으면’이라는 종속 조건절로 옮기고, 이어지는 וּמְצָאתֶם(‘너희가 나를 찾을/발견할 것이다’)를 다시 ‘나를 찾게 될 것이며’로 번역하여 동사의 순서와 기능을 혼동합니다. 또한 ‘찾게 될 것이며 나를 만나게 될 것입니다’는 불필요하게 우회적입니다. כִּי의 인과적 독법을 본문에 채택하되, 조건적·시간적 가능성은 각주에서 보존할 수 있습니다.
  naturalness: ‘여러분은 나를 찾고 나를 만나게 될 것입니다’는 현대 표준어 합쇼체로 자연스럽고, 하나님을 대상으로 한 ‘find me’를 관계적으로 ‘나를 만나게 되다’로 옮긴 선택도 안전합니다. ‘온 마음을 다해’도 자연스럽습니다.
  terminology: ‘여러분’은 현대적인 복수 호칭이며 합쇼체와 조화됩니다. ‘온 마음을 다해’는 בְּכָל־לְבַבְכֶם의 전인적 헌신을 자연스럽게 전달합니다. ‘만나게 되다’는 מָצָא의 관계적 결과를 과도한 교리화 없이 표현합니다.
