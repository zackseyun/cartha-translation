  to: 여러분은 나를 찾고 나를 만나게 될 것입니다. 여러분이 온 마음을 다해 나를 찾을 것이기 때문입니다.[a]
  rationale: 개정문은 두 개의 ‘찾다’ 동사와 그 사이의 ‘발견하다/만나다’라는 히브리어 전개를 보존합니다. כִּי는 본문에서 자연스러운 인과 관계로 옮겼으며, 논쟁 가능한 시간적·조건적 관계는 각주에서 유지했습니다. ‘만나게 되다’는 하나님을 ‘찾아 발견함’의 인격적 성격을 한국어로 자연스럽게 드러내되, 본문 이상의 신학적 결론을 덧붙이지 않습니다.
