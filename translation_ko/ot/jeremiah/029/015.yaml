lexical_decisions:
- source_word: כִּי
  english_pob_choice: Because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 …
  - … 때문에
  lexicon: HALOT
  rationale: 문맥상 뒤따르는 심판 선언의 이유를 제시하므로, 현대 한국어에서는 인과를 분명히 하는 ‘… 때문입니다’가 가장 자연스럽습니다.
- source_word: אֲמַרְתֶּם
  english_pob_choice: you have said
  chosen_korean: 말했기
  alternatives_korean:
  - 말하였기
  - 말했으므로
  lexicon: HALOT
  rationale: 완료형 보고를 한국어에서는 과거 행위로 자연스럽게 처리하되, 앞 절과의 연결을 유지하기 위해 이유절로 옮겼습니다.
- source_word: הֵקִים
  english_pob_choice: has raised up
  chosen_korean: 세우셨다
  alternatives_korean:
  - 일으키셨다
  - 임명하셨다
  lexicon: HALOT
  rationale: 예언자를 ‘세우다’는 한국어가 소명·임명 모두를 포함해 가장 자연스럽고, 하나님의 주도적 행위를 살릴 수 있습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 고유명사인 언약 이름을 직역 관습어로 가리지 않고, POB 원칙에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 바빌론 포로지에서도 예언자들이 ‘세워졌다’는 주장에 대한 거리감 표현
  chosen_reading: 인용된 발언을 그대로 옮겨, 그 진술의 내용이 사실인지 여부는 본문이 여기서 직접 판정하지 않도록 했습니다.
  alternative_readings:
  - ‘바빌론에서 예언자들이 우리에게 임했다’처럼 더 중립적으로 조정
  - ‘예언자들을 우리에게 보내셨다’로 완화
  rationale: 히브리어는 청중의 발언을 직접 인용하므로, 본문이 가진 아이러니와 비판적 긴장을 지우지 않기 위해 주장 내용을 그대로 재현했습니다.
  doctrine_reference: '본문 맥락 주해 원칙: 인용문은 화자의 주장으로 유지'
