  - 여고니야 왕
  lexicon: HALOT
  rationale: 이 인물은 한국어 성경에서 널리 알려진 여호야긴으로 옮겨 역사적 인물 식별성을 살렸습니다.
- source_word: הַגְּבִירָה
  english_pob_choice: the queen mother
  chosen_korean: 왕비
  alternatives_korean:
  - 태후
  - 왕대비
  lexicon: HALOT
  rationale: 원문은 왕실의 여성 고위 인물을 가리키지만, 본문 내 기능상 여왕보다 왕의 모친 계열의 궁정 직함이므로 한국어에서 가장 무리 없는 왕실 직함으로 처리했습니다. 다만 정확한 관직 뉘앙스는 각주가 없으면 단정하기 어려워 본문은 간결하게 유지했습니다.
- source_word: הַסָּרִיסִים
  english_pob_choice: the court officials
  chosen_korean: 내시들
  alternatives_korean:
  - 궁정 관리들
  - 시종들
  lexicon: HALOT
  rationale: 히브리어 사리스는 성적 거세된 내시를 뜻할 수도 있고 궁정 관료를 넓게 가리킬 수도 있지만, POB의 기본 선택이 그 이중성을 보존하므로 한국어 본문에서는 직접 대응어인 내시들을 택했습니다.
- source_word: שָׂרֵי יְהוּדָה וִירוּשָׁלַם
  english_pob_choice: the officials of Judah and Jerusalem
  chosen_korean: 유다와 예루살렘의 고관들
  alternatives_korean:
  - 유다와 예루살렘의 지도자들
  - 유다와 예루살렘의 방백들
  lexicon: HALOT
  rationale: שׂרים는 단순한 귀족보다 행정·통치 책임이 있는 지도층을 가리키므로, 현대 한국어에서 그 기능을 살리는 고관들이 적절합니다.
- source_word: הֶחָרָשׁ וְהַמַּסְגֵּר
  english_pob_choice: the craftsmen and the metalworkers
  chosen_korean: 장인들과 쇠를 다루는 이들
  alternatives_korean:
  - 기술자들과 금속공들
  - 장인들과 대장장이들
  lexicon: HALOT
  rationale: חרש와 מסגר의 짝을 유지하면서, חרש는 폭넓은 장인으로, מסגר는 금속 가공 기술자로 풀어 한국어 독자가 두 직종의 병렬을 읽을 수 있게 했습니다.
