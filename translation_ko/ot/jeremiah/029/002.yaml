translation:
  language: ko
  text: 여호야긴 왕과 왕비와 내시들과 유다와 예루살렘의 고관들과 장인들과 쇠를 다루는 이들이 예루살렘에서 떠난 뒤에—[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 혹은 “내시들”로도 번역할 수 있습니다. 히브리어 사리스는 내시를 뜻할 수도 있고 궁정 관료를 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 혹은 “유다와 예루살렘의 방백들”입니다.
    reason: lexical_alternative
  - marker: c
    text: 혹은 “쇠공들” 또는 “대장장이들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי צֵאת
  english_pob_choice: after ... had gone out
  chosen_korean: '... 떠난 뒤에'
  alternatives_korean:
