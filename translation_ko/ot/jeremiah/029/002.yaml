  text: 여고냐 왕과 왕태후와 궁정 관리들[a]과 유다와 예루살렘의 고관들[b]과 장인들과 금속 기술자들[c]이 예루살렘에서 떠난 뒤에—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내시들”. 히브리어 ‘사리스’는 내시를 뜻할 수도 있고, 더 넓게는 궁정 관리들을 가리킬 수도 있습니다.
