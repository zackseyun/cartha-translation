  lexicon: HALOT
  rationale: אחרי צאת의 시간 관계를 한국어의 관용적 연결 표현으로 옮겨, 바로 앞 사건 이후라는 의미를 자연스럽게 드러냈습니다.
- source_word: יְכָנְיָה הַמֶּלֶךְ
