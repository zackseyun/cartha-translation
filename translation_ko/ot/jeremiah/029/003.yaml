translation:
  language: ko
  text: '사반의 아들 엘라사와 힐기야의 아들 그마랴를 통해[a] 전하였습니다. 유다 왕 시드기야가 그들을 바벨론 왕 느부갓네살에게 바벨론으로[b] 보냈습니다. 이렇게 말하였습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘손으로’라는 표현은 여기서 이 사람들이 전달을 맡은 매개자였다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 지명에는 방향을 나타내는 어미가 붙어 있어, ‘바벨론으로’라는 뜻입니다.
    reason: source_note
