  rationale: 이 절의 히브리어 형태는 Jeremiah 문맥에서 흔히 ‘Nebuchadnezzar’로 알려진 표기와 맞닿아 있으므로, 한국어 독자 가독성을 위해 표준적으로 통용되는 이름을 택했습니다.
  doctrine_reference: proper-name convention
- issue: 지명 반복 보존
  chosen_reading: ‘바벨론 왕 … 바벨론에’의 반복을 그대로 살렸습니다.
  alternative_readings:
