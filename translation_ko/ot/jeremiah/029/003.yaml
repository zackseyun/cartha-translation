  naturalness: 원문의 ‘보낸’ 관계절을 한국어에서 자연스럽게 풀되, 두 사자가 시드기야가 보낸 사람이라는 관계를 명료하게 밝혔습니다. ‘말하였는데’는 인용을 여는 표현으로 어색하므로 ‘이렇게 말하였습니다:’로 고쳤습니다.
  terminology: 엘라사, 사반, 그마랴, 힐기야, 시드기야, 느부갓네살, 바벨론은 통용되는 성경 인명·지명 표기를 유지했습니다. בְּיַד는 ‘…을 통해’로, בבלה는 목적·방향을 드러내는 ‘바벨론으로’로 옮겼습니다.
