  text: '엘라사와 사반의 아들 그마랴와, 유다 왕 시드기야가 바벨론 왕 느부갓네살에게 바벨론에 보내면서, 말하였는데[a][b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְּיָד는 여기서 ‘손’ 자체보다 ‘~을 통해/매개로’라는 관용적 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 지명은 방향형 어미로 ‘바벨론에’의 뜻을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: בְּיָד
  english_pob_choice: by the hand of
  chosen_korean: …을 통해
  alternatives_korean:
  - …의 손으로
  - …으로 말미암아
  - …을 거쳐
  lexicon: HALOT
  rationale: 히브리어 관용구 בְּיָד는 전달 수단/매개자를 나타내므로, 한국어에서는 뜻을 드러내는 ‘…을 통해’로 옮겨 관용구의 기능을 살리면서도 자연스럽게 표현했습니다.
- source_word: אֲשֶׁר שָׁלַח
  english_pob_choice: whom ... sent
  chosen_korean: …가 보낸
  alternatives_korean:
  - …을 보냈습니다
  - …가 파견한
  - …가 보낸 사람들
  lexicon: HALOT
  rationale: 관계절을 간결하게 풀어 두 사람의 신분을 드러내는 한국어 수식으로 처리했습니다. ‘보낸’이 가장 직접적으로 source의 파송 의미를 반영합니다.
- source_word: בָּבֶלָה
  english_pob_choice: in Babylon
  chosen_korean: 바벨론에
  alternatives_korean:
  - 바벨론에서
  - 바벨론 안에서
  lexicon: HALOT
  rationale: 어미 ה가 나타내는 방향성을 한국어 조사 ‘-에’로 옮겨, ‘바벨론으로/바벨론에’의 도착·목적지를 드러냈습니다.
- source_word: לֵאמֹר
  english_pob_choice: 'saying:'
  chosen_korean: 말하였는데
  alternatives_korean:
  - 이르며
  - 말하여
  - '말하였다:'
  lexicon: HALOT
  rationale: 다음 절의 인용을 여는 공식구로서, 문장 연결이 자연스러운 ‘말하였는데’로 처리했습니다.
theological_decisions:
- issue: 느부갓네살 이름 표기
