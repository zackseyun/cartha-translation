  - 중복을 줄여 의역
  rationale: 히브리어 본문은 같은 지명을 반복합니다. 이를 매끈하게 줄이면 원문의 강조와 문장 리듬이 약해지므로 반복을 보존했습니다.
  doctrine_reference: source transparency
