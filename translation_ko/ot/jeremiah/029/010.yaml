id: JER.29.10
reference: Jeremiah 29:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי כֹה֙ אָמַ֣ר יְהוָ֔ה כִּ֠י לְ/פִ֞י מְלֹ֧את לְ/בָבֶ֛ל שִׁבְעִ֥ים שָׁנָ֖ה אֶפְקֹ֣ד אֶתְ/כֶ֑ם וַ/הֲקִמֹתִ֤י עֲלֵי/כֶם֙ אֶת דְּבָרִ֣/י הַ/טּ֔וֹב לְ/הָשִׁ֣יב אֶתְ/כֶ֔ם אֶל הַ/מָּק֖וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/010.yaml
  text: 'For this is what Yahweh says: When seventy years for Babylon are completed[a], I will attend to you and fulfill my good word to you[c][b], to bring you back to this place.'
  footnotes:
  - marker: a
    text: Or 'I will visit you.' The Hebrew verb can mean to turn attention toward someone, whether for judgment or for care; here the context is favorable.
    reason: lexical_alternative
  - marker: b
    text: Or 'and confirm/establish my good word to you.' The expression refers to carrying out what the LORD had promised.
    reason: lexical_alternative
  - marker: c
    text: Literally 'when seventy years for Babylon are completed.' This may refer to the period appointed in connection with Babylon.
    reason: alternative_reading
translation:
  language: ko
  text: “이는 야훼께서 이렇게 말씀하셨기 때문입니다. 바빌론을 위한 칠십 년이 끝나면[c] 내가 너희를 돌보고[a] 너희에게 한 내 선한 말씀을 이루어[b] 너희를 이곳으로 돌아오게 하겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희를 방문하겠다.’ 히브리어 동사는 누군가에게 주의를 돌리다는 뜻을 가질 수 있으며, 심판을 위해서나 돌보기 위해서 그렇게 할 수 있습니다. 여기서는 호의적인 문맥입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 선한 말씀을 너희에게 확정하겠다/세우겠다.’ 이 표현은 야훼께서 약속하신 것을 이루신다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘바빌론을 위한 칠십 년이 끝날 때’입니다. 이는 바빌론과 관련하여 정해진 기간을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: POB의 기본 원칙에 따라 언약적 신명은 학술적 음역인 ‘야훼’로 옮겨, 전통적 교회어인 ‘여호와’나 일반 호칭 ‘주님’으로 바꾸지 않았습니다.
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For this is what ... says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 곧 ...께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 선포의 관용구를 한국어로 자연스럽게 살리되, 신적 발화의 공식성을 유지하기 위해 ‘이렇게 말씀하십니다’로 옮겼습니다.
- source_word: אֶפְקֹד אֶתְכֶם
  english_pob_choice: I will attend to you
  chosen_korean: 내가 너희를 돌보고
  alternatives_korean:
  - 내가 너희를 방문하고
  - 내가 너희를 찾아보고
  lexicon: HALOT
  rationale: פקד의 핵심인 ‘주의를 돌리다/돌보다’의 뜻을 살려, 회복의 문맥에서 ‘돌보다’로 옮겨 긍정적 개입을 드러냈습니다.
- source_word: וַהֲקִמֹתִי עֲלֵיכֶם אֶת דְּבָרִי הַטּוֹב
  english_pob_choice: and fulfill my good word to you
  chosen_korean: 너희에게 한 내 선한 말씀을 이루어
  alternatives_korean:
  - 너희에게 한 내 선한 약속을 확정하여
  - 너희 위에 내 선한 말씀을 세워
  lexicon: HALOT
  rationale: ‘말씀’을 유지해 히브리어 דבר의 표현을 보존하고, הקים의 관용적 의미는 ‘이루다’로 자연스럽게 풀었습니다.
- source_word: לְהָשִׁיב אֶתְכֶם
  english_pob_choice: to bring you back
  chosen_korean: 너희를 이곳으로 돌아오게 하겠습니다
  alternatives_korean:
  - 너희를 되돌려 보내겠습니다
  - 너희를 회복시켜 돌아오게 하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 반영해 단순한 ‘돌아오다’보다 ‘돌아오게 하다’로 옮겼고, 귀환의 목적지를 문맥상 분명하게 했습니다.
theological_decisions:
- issue: ‘바빌론을 위한 칠십 년’의 의미 범위
  chosen_reading: 주석 없이 본문에서는 ‘바빌론을 위한 칠십 년’으로 두어, 바빌론과 연결된 기간이라는 점만 드러냈습니다.
  alternative_readings:
  - ‘바빌론에서 칠십 년이 끝나면’
  - ‘바빌론의 칠십 년이 끝나면’
  rationale: 히브리어는 기간이 바빌론과 관련됨을 말하지만, 그것이 바빌론 지배 기간인지 포로 기간인지 본문에서 단정하지 않으므로 그 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy: source ambiguity should be preserved unless the context requires resolution.'
