  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י בְ/שֶׁ֔קֶר הֵ֛ם נִבְּאִ֥ים לָ/כֶ֖ם בִּ/שְׁמִ֑/י לֹ֥א שְׁלַחְתִּ֖י/ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/009.yaml
  text: For they are prophesying falsely to you in my name[a]; I did not send them[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in falsehood'' or ''in a lie''; rendered ''falsely'' for natural English.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Because they are prophesying to you falsely in my name.'
    reason: alternative_reading
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD'; alternatively 'Yahweh.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 내 이름으로 거짓되게 예언하고 있습니다[a]; 내가 그들을 보내지 않았습니다[b][c]—야훼의 말씀이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘거짓 안에서/거짓으로’에 가깝습니다. 한국어에서는 자연스러운 부사 ‘거짓되게’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 ‘내가 그들을 보내지 않았다’가 독립 진술이지만, 일부 해석은 앞절과 이어 ‘그들이 내 이름으로 거짓되게 예언하고 있으므로 내가 그들을 보내지 않았다’로도 읽습니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어 יְהוָה. 본문에서는 고유명 ‘야훼’로 옮겼습니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּשֶׁקֶר
  english_pob_choice: falsely
  chosen_korean: 거짓되게
  alternatives_korean:
  - 거짓으로
  - 속여서
  lexicon: HALOT
  rationale: 히브리어의 ‘falsehood/lie 안에서’라는 의미를 한국어에서는 부사적으로 자연스럽게 옮겨, 예언 행위 자체가 거짓의 성격을 띤다는 점을 살렸습니다.
- source_word: נִבְּאִים
  english_pob_choice: are prophesying
  chosen_korean: 예언하고 있습니다
  alternatives_korean:
  - 예언합니다
  - 예언하고 있습나다
  lexicon: HALOT
  rationale: 진행·상태를 나타내는 분사이므로, 단순 현재보다 ‘-고 있습니다’가 동작의 지속성을 더 분명히 드러냅니다.
- source_word: לָכֶם
  english_pob_choice: to you
  chosen_korean: 그들은 … 예언하고 있습니다
  alternatives_korean:
  - 너희에게
  - 여러분에게
  lexicon: HALOT
  rationale: 여기서 여격은 예언의 수신자를 가리키므로 직접 호칭보다 문장 구조 안에서 자연스럽게 처리했습니다.
- source_word: בִּשְׁמִי
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름을 내세워
  lexicon: HALOT
  rationale: 하나님 권위를 주장하며 말하는 관용구이므로, 한국어에서도 관용 표현을 살려 ‘내 이름으로’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 말씀이옵니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식의 종결 표현을 한국어 성경체로 자연스럽게 옮기되, 공적 선언의 무게를 보존하기 위해 ‘말씀이십니다’를 선택했습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 처리
  chosen_reading: יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 예언자들의 거짓 선포와 대비되는 하나님의 직접 발화를 담고 있으므로, 전통적 대체어보다 신적 고유명을 드러내는 번역이 더 충실합니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 거짓 예언과 신적 파송의 대조
  chosen_reading: 그들이 야훼의 이름으로 말하지만, 야훼는 자신이 그들을 보내지 않았다고 단언하십니다.
  alternative_readings:
  - 그들은 실수로 예언한 것입니다
  - 그들의 메시지는 단지 부정확합니다
  rationale: 본문은 단순한 오류가 아니라, 하나님의 이름을 내세운 거짓 예언과 파송 부인의 긴장을 유지합니다. 이를 완화하지 않고 그대로 드러내야 합니다.
  doctrine_reference: Translation philosophy §3
