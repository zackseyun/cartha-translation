id: JER.29.16
reference: Jeremiah 29:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי כֹ֣ה אָמַ֣ר יְהוָ֗ה אֶל הַ/מֶּ֨לֶךְ֙ הַ/יּוֹשֵׁב֙ אֶל כִּסֵּ֣א דָוִ֔ד וְ/אֶל כָּל הָ/עָ֔ם הַ/יּוֹשֵׁ֖ב בָּ/עִ֣יר הַ/זֹּ֑את אֲחֵי/כֶ֕ם אֲשֶׁ֛ר לֹֽא יָצְא֥וּ אִתְּ/כֶ֖ם בַּ/גּוֹלָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/016.yaml
  text: For thus says Yahweh concerning the king who sits on the throne of David[a], and concerning all the people who dwell in this city—your brothers who did not go out with you into exile—
  footnotes:
  - marker: a
    text: Or 'your kinsmen'; the Hebrew reads 'your brothers,' a masculine plural kinship term that may refer broadly to fellow Judeans.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 다윗의 왕좌에 앉아 있는 왕과 이 성에 사는 모든 백성, 곧 여러분과 함께 포로로 끌려가지 않은 여러분의 형제들에 대하여 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 남성 복수 친족어 ‘당신들의 형제들’을 사용하며, 문맥상 유다인 동족 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이와 같이 말씀하십니다
  - 주께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식의 반복성과 장엄함을 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘이렇게 말씀하십니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신적 고유명사를 제목형 표현으로 대체하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 음역했습니다.
- source_word: אֲחֵיכֶם
  english_pob_choice: your brothers
  chosen_korean: 여러분의 형제들
  alternatives_korean:
  - 여러분의 친족들
  - 여러분의 형제자매들
  lexicon: HALOT
  rationale: 히브리어 남성 복수 친족어를 그대로 반영하되, 한국어에서는 공동체적 지시를 유지하기 위해 ‘형제들’로 옮겼습니다.
- source_word: בַּגּוֹלָה
  english_pob_choice: into exile
  chosen_korean: 포로로 끌려가지 않은
  alternatives_korean:
  - 유배로 가지 않은
  - 포로 생활로 나가지 않은
  lexicon: HALOT
  rationale: 문맥상 단순 상태가 아니라 강제 이주를 포함한 역사적 사건을 가리키므로, ‘포로로 끌려가다’로 구체화했습니다.
theological_decisions:
- issue: 다윗 왕좌에 대한 왕조적 언급
  chosen_reading: ‘다윗의 왕좌에 앉아 있는 왕’으로 유지했습니다.
  alternative_readings:
  - ‘다윗의 보좌에 앉은 왕’
  - ‘다윗 왕조의 왕’
  rationale: 히브리어의 직설적 왕조 표현을 보존해, 단순한 관직이 아니라 다윗 언약의 계승성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §2: source-directed transparency'
- issue: 남성 복수 친족어의 성별 표지
  chosen_reading: ‘여러분의 형제들’로 번역했습니다.
  alternative_readings:
  - ‘여러분의 친족들’
  - ‘여러분의 형제자매들’
  rationale: 원문의 남성 복수 형식을 중화하지 않고 유지하되, 문맥상 유다 공동체 전체를 가리키는 점은 독자가 이해할 수 있도록 본문 흐름에 맡겼습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
