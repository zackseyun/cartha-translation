  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֛חַת אֲשֶֽׁר לֹא שָׁמְע֥וּ אֶל דְּבָרַ֖/י נְאֻם יְהוָ֑ה אֲשֶׁר֩ שָׁלַ֨חְתִּי אֲלֵי/הֶ֜ם אֶת עֲבָדַ֤/י הַ/נְּבִאִים֙ הַשְׁכֵּ֣ם וְ/שָׁלֹ֔חַ וְ/לֹ֥א שְׁמַעְתֶּ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/019.yaml
  text: because they did not listen to my words[a], declares Yahweh, which I sent to them by my servants the prophets, rising early and sending them, and you did not listen[b], declares Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''rising early and sending them,'' an idiom expressing persistent, eager repetition; alternatively, ''persistently sending them.'''
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shifts from 'they did not listen' to 'you did not listen,' likely for rhetorical effect; the translation preserves this shift.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 내 말씀을 듣지 않았기 때문입니다. 야훼의 말씀입니다. 내가 내 종들인 예언자들을 그들에게 보냈고, 이른 아침부터 보내었는데도, 너희는 듣지 않았습니다. 야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘이른 아침부터 보내며’는 계속적이고 간절한 반복을 뜻합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 3인칭 복수 ‘그들이’에서 2인칭 복수 ‘너희’로 바뀌며, 수사적으로 청중을 직접 겨냥합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  english_pob_choice: because
  chosen_korean: 때문입니다
  alternatives_korean:
  - 그래서입니다
  - 이유는
  lexicon: HALOT
  rationale: 원문의 인과 관계를 자연스러운 한국어로 살리되, 문맥상 앞절의 심판 이유를 분명히 드러내기 위해 ‘때문입니다’로 옮겼습니다.
- source_word: שָׁמְעוּ / שְׁמַעְתֶּם
  english_pob_choice: did not listen / did not listen
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 듣지 않았습니다
  - 들으려 하지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שמע의 ‘듣다/귀 기울이다’ 의미를 기본으로 유지하면서, ‘순종하다’로 과도하게 해석하지 않도록 ‘듣지 않았습니다’로 옮겼습니다.
- source_word: אֶת עֲבָדַי הַנְּבִיאִים
  english_pob_choice: my servants the prophets
  chosen_korean: 내 종들인 예언자들을
  alternatives_korean:
  - 내 종들인 선지자들을
  - 내 종 예언자들을
  lexicon: HALOT
  rationale: עבדים은 여기서 신분보다 파송된 봉사자라는 기능이 핵심이므로 POB 기본어휘에 맞춰 ‘종들’로 두고, נביאים은 현대 한국어에 자연스러운 ‘예언자’로 옮겼습니다.
- source_word: הַשְׁכֵּם וְשָׁלֹחַ
  english_pob_choice: rising early and sending them
  chosen_korean: 이른 아침부터 보내었는데도
  alternatives_korean:
  - 이른 아침부터 보내며
  - 부지런히 보내었는데도
  - 거듭 보내었는데도
  lexicon: HALOT
  rationale: 히브리어 관용구가 반복적이고 간절한 파송을 나타내므로, 직역의 이미지와 반복적 뉘앙스를 함께 살릴 수 있도록 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 야훼의 말씀입니다의 반복과 화자 표지
  chosen_reading: נְאֻם יְהוָה를 본문에서 ‘야훼의 말씀입니다’로 두 번 옮겨 예언적 선언의 경계와 권위를 드러냅니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’로 평서형화
  - 한 번만 반복하고 생략
  rationale: 히브리어의 공식 선포문은 단순 정보 전달이 아니라 심판 선언의 권위 표지이므로, 한국어에서도 반복을 유지하는 편이 원문의 수사와 신학적 무게를 더 잘 드러냅니다.
  doctrine_reference: 'POB translation philosophy: preserve prophetic register and repeated oracle markers'
- issue: 3인칭에서 2인칭으로의 전환 보존
  chosen_reading: ‘그들이…’에서 ‘너희는…’으로 바뀌는 수사적 전환을 그대로 살렸습니다.
  alternative_readings:
  - 둘 다 3인칭으로 통일
  - 둘 다 2인칭으로 통일
  rationale: 원문은 듣지 않은 ‘그들’을 말하다가 곧바로 청중인 ‘너희’를 직접 책망하므로, 이 긴장을 완화하지 않고 유지해야 경고의 직접성이 살아납니다.
  doctrine_reference: 'POB translation philosophy #3: Preserve theological tension rather than resolve it'
