  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֞ה נְתָנְ/ךָ֣ כֹהֵ֗ן תַּ֚חַת יְהוֹיָדָ֣ע הַ/כֹּהֵ֔ן לִֽ/הְי֤וֹת פְּקִדִים֙ בֵּ֣ית יְהוָ֔ה לְ/כָל אִ֥ישׁ מְשֻׁגָּ֖ע וּ/מִתְנַבֵּ֑א וְ/נָתַתָּ֥ה אֹת֛/וֹ אֶל הַ/מַּהְפֶּ֖כֶת וְ/אֶל הַ/צִּינֹֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/026.yaml
  text: Yahweh has made you priest in place of Jehoiada the priest[a], to be overseers in the house of Yahweh over every man who is mad and acts as a prophet[c][b], and you should put him into the stocks and the neck iron.
  footnotes:
  - marker: a
    text: Or 'to be officers' or 'to be supervisors'; the Hebrew has a plural noun ('overseers/officers') even though the addressee is singular.
    reason: lexical_alternative
  - marker: b
    text: Or 'prophesies'; the Hebrew participle can be rendered more neutrally, but the main text reflects the hostile tone of the speaker.
    reason: alternative_reading
  - marker: c
    text: The exact meaning of 'the neck iron' is uncertain; it likely refers to an iron restraint or collar used with the stocks.
    reason: cultural_note
translation:
  language: ko
  text: 야훼께서 너를 제사장으로 세우셔서 여호야다 제사장 대신에, 야훼의 집에서 감독이 되게 하셨으니, 미친 사람이며 예언하는 사람마다 관할하게 하였고, 너는 그를 차꼬와 목쇠에 넣으라.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감독’은 히브리어 복수 명사 פְּקִדִים의 기능을 한국어에서 간명하게 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘목쇠’는 הַצִּינֹק의 정확한 기구 형태가 불확실하다는 점을 반영한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC 표기 관례
  rationale: 본문의 신명사표기는 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 고유 이름을 보존했습니다.
- source_word: נְתָנְךָ
  english_pob_choice: has made you
  chosen_korean: 너를 … 세우셔서
  alternatives_korean:
  - 너를 … 만들고
  - 너를 … 주셔서
  lexicon: HALOT
  rationale: ‘주다’의 관용적 용법이므로, 직무 부여의 뜻을 살려 ‘세우셔서’로 자연스럽게 옮겼습니다.
- source_word: פְּקִדִים
  english_pob_choice: overseers / officers
  chosen_korean: 감독
  alternatives_korean:
  - 관리들
  - 관리자들
  - 감독들
  lexicon: HALOT
  rationale: 제사장 직무와 성전 맥락에서 감독·감찰의 의미가 두드러져, 일반적 ‘관리’보다 ‘감독’이 원문 기능을 더 잘 드러냅니다.
- source_word: מְשֻׁגָּע וּמִתְנַבֵּא
  english_pob_choice: mad and acts as a prophet
  chosen_korean: 미친 사람이며 예언하는 사람
  alternatives_korean:
  - 미친 자이며 예언자처럼 행동하는 사람
  - 광증이 있는 사람이며 예언하는 사람
  lexicon: HALOT
  rationale: 비방하는 말투를 유지하되, ‘예언하는 사람’으로 옮겨 히브리어 분사형의 현재적 동작을 살렸습니다.
- source_word: הַמַּהְפֶּכֶת
  english_pob_choice: the stocks
  chosen_korean: 차꼬
  alternatives_korean:
  - 족쇄
  - 형틀
  - 곤장틀
  lexicon: HALOT
  rationale: 신체를 묶는 형벌 도구를 가리키는 말로, 한국어에서 가장 직접적으로 대응되는 ‘차꼬’를 선택했습니다.
- source_word: הַצִּינֹק
  english_pob_choice: the neck iron
  chosen_korean: 목쇠
  alternatives_korean:
  - 목걸쇠
  - 쇠목걸이
  - 목칼
  lexicon: HALOT
  rationale: 정확한 기구 형상이 확정되지 않으므로, 목을 죄는 쇠붙이의 의미를 드러내는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: נְתָנְךָ + 제사장 직분의 직무 부여를 어떻게 표현할지
  chosen_reading: ‘세우셔서 … 감독이 되게 하셨으니’로 직분 임명을 드러냄
  alternative_readings:
  - ‘만들어 … 감독으로 삼으셨으니’
  - ‘임명하셔서 … 감독이 되게 하셨으니’
  rationale: ‘주다’의 단순 전달보다 직분 수여의 결과를 분명히 하는 것이 문맥상 정확합니다.
  doctrine_reference: 직분 임명/부여의 문맥 보존
- issue: וּמִתְנַבֵּא의 조롱조를 어떻게 다룰지
  chosen_reading: ‘예언하는 사람’
  alternative_readings:
  - ‘예언자처럼 행동하는 사람’
  - ‘예언하는 자’
  rationale: 원문의 적대적 화자를 미화하지 않으면서도, 실제 예언 행위를 완전히 부정하는 식으로 신학적 판단을 앞서지 않도록 했습니다.
  doctrine_reference: 번역에서의 신학적 긴장 보존
