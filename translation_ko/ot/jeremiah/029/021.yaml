source:
  edition: WLC
  text: כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אֶל אַחְאָ֤ב בֶּן קֽוֹלָיָה֙ וְ/אֶל צִדְקִיָּ֣הוּ בֶן מַֽעֲשֵׂיָ֔ה הַֽ/נִּבְּאִ֥ים לָ/כֶ֛ם בִּ/שְׁמִ֖/י שָׁ֑קֶר הִנְ/נִ֣י נֹתֵ֣ן אֹתָ֗/ם בְּ/יַד֙ נְבֽוּכַדְרֶאצַּ֣ר מֶֽלֶךְ בָּבֶ֔ל וְ/הִכָּ֖/ם לְ/עֵינֵי/כֶֽם־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/021.yaml
  text: 'Thus says Yahweh of hosts[a], the God of Israel, concerning Ahab son of Kolaiah and Zedekiah son of Maaseiah, who are prophesying a lie to you in my name: Behold, I am giving them into the hand of Nebuchadnezzar king of Babylon, and he will strike them down before your eyes.'
  footnotes:
  - marker: a
    text: 'Hebrew spelling: ''Nebuchadrezzar''; English convention commonly renders the name as ''Nebuchadnezzar.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 콜라야의 아들 아합과 마아세야의 아들 시드기야에 관하여 이렇게 말씀하십니다. 그들은 너희에게 내 이름으로 거짓을 예언하고 있습니다. 보십시오, 내가 그들을 바빌론 왕 느부갓네살[a]의 손에 넘겨줄 것이며, 그가 너희 눈앞에서 그들을 칠 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문의 철자는 ‘느부갓레살’이지만, 한국어 본문에는 통용 표기인 ‘느부갓네살’을 사용했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה צְבָאוֹת
  english_pob_choice: Thus says Yahweh of hosts
  chosen_korean: 만군의 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 만군의 야훼가 이렇게 말씀하십니다
  - 만군의 야훼, 이르시기를
  lexicon: HALOT
  rationale: 예언자적 선포 공식을 한국어 합쇼체로 자연스럽게 옮기면서, יְהוָה는 관용적 대체어가 아니라 이름 자체를 드러내는 ‘야훼’로 유지했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘 하나님
  - 이스라엘의 하느님
  lexicon: HALOT
  rationale: 소유·관계 구문을 자연스럽게 살려, 언약적 정체성을 지닌 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: הַנִּבְּאִים לָכֶם בִּשְׁמִי שָׁקֶר
  english_pob_choice: who are prophesying a lie to you in my name
  chosen_korean: 너희에게 내 이름으로 거짓을 예언하고 있습니다
  alternatives_korean:
  - 너희에게 내 이름으로 거짓말을 예언하고 있습니다
  - 너희에게 내 이름을 빌려 거짓을 예언하고 있습니다
  lexicon: HALOT
  rationale: ‘שָׁקֶר’는 예언의 내용이 거짓임을 가리키므로 ‘거짓을 예언하다’로 간결하게 반영했습니다. ‘내 이름으로’는 신적 권위를 사칭하는 관용구를 유지합니다.
- source_word: הִנְנִי נֹתֵן אֹתָם בְּיַד
  english_pob_choice: Behold, I am giving them into the hand of
  chosen_korean: 보십시오, 내가 그들을 ...의 손에 넘겨 주겠으니
  alternatives_korean:
  - 보십시오, 내가 그들을 ...의 손에 맡기겠으니
  - 보십시오, 내가 그들을 ...의 손에 넘겨 주겠습니다
  lexicon: HALOT
  rationale: ‘손에 넘기다’는 כוח/권세 아래로 넘겨 주는 히브리어 관용을 살리면서 현대 한국어로도 분명하게 전달합니다.
- source_word: וְהִכָּם לְעֵינֵיכֶם
  english_pob_choice: and he will strike them down before your eyes
  chosen_korean: 그가 너희 눈앞에서 그들을 칠 것입니다
  alternatives_korean:
  - 그가 너희 눈앞에서 그들을 치실 것입니다
  - 그가 너희 눈앞에서 그들을 쓰러뜨릴 것입니다
  lexicon: HALOT
  rationale: נכה의 기본 의미를 따라 ‘치다’로 옮기되, 공개 처벌의 장면성을 드러내기 위해 ‘너희 눈앞에서’를 유지했습니다.
theological_decisions:
- issue: 예언 공식에서의 신명(神名) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה를 제목적 대체어로 돌리지 않고, POB 원칙에 따라 신명 자체를 드러내는 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 공개적 심판의 강도 표현
  chosen_reading: 그가 너희 눈앞에서 그들을 칠 것입니다
  alternative_readings:
  - 그가 너희 눈앞에서 그들을 죽일 것입니다
  - 그가 너희 눈앞에서 그들을 치실 것입니다
  rationale: 동사 נכה는 여기서 치명적 심판을 암시하지만, 히브리어 동사 자체가 반드시 ‘죽이다’를 요구하지는 않으므로 원문 강도를 보존하면서 과잉 특정화를 피했습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; do not import more specificity than the verb demands'
