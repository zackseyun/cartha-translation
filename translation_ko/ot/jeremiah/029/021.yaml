  source_fidelity: 원문은 이 말씀의 대상이 아합과 시드기야에 관한 것임을 אֶל로 표시합니다. 초안은 ‘관하여’를 빠뜨려 이 담화 기능이 명시되지 않았습니다. 또한 קוֹלָיָה의 음역 ‘코랴’는 원문 자음과 맞지 않습니다. 나머지 ‘내 이름으로 거짓을 예언하고 있다’, ‘손에 넘기다’, ‘너희 눈앞에서 치다’는 원문의 의미와 불필요한 과잉 해석을 잘 보존합니다.
  naturalness: 합쇼체는 전반적으로 자연스럽습니다. 다만 ‘...에게 내 이름으로’보다 ‘...에게 내 이름을 내세워’도 가능하지만, 원문의 בִּשְׁמִי를 직접 보존하는 현행 표현이 더 적절합니다. ‘관하여’를 넣고 이름 음역을 바로잡으면 문장 흐름도 자연스럽습니다.
  terminology: 야훼, 만군, 이스라엘의 하나님, 바빌론, 느부갓네살은 POB의 명칭 및 용어 선택과 조화됩니다. קוֹלָיָה는 ‘콜라야’로 고쳐야 합니다. 본문의 느부갓네살에는 히브리어 본문 철자와 통용 표기의 차이를 설명하는 각주를 직접 붙이는 것이 적절합니다.
