  to: 만군의 야훼, 이스라엘의 하나님께서 콜라야의 아들 아합과 마아세야의 아들 시드기야에 관하여 이렇게 말씀하십니다. 그들은 너희에게 내 이름으로 거짓을 예언하고 있습니다. 보십시오, 내가 그들을 바빌론 왕 느부갓네살[a]의 손에 넘겨줄 것이며, 그가 너희 눈앞에서 그들을 칠 것입니다.
