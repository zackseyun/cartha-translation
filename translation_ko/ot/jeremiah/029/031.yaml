  lexicon: HALOT
  rationale: שְׁלַח의 명령형을 자연스러운 전달 동사로 살리고, הַגּוֹלָה는 집단 전체를 가리키므로 ‘포로들’이 가장 간결하게 대응합니다.
- source_word: כֹּה אָמַר יְהוָה
