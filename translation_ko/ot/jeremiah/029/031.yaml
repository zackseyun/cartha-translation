  - 야훼께서 말씀하시되
  lexicon: HALOT
  rationale: 예언자 공식을 현대 한국어 합쇼체로 옮기되, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  english_pob_choice: concerning Shemaiah the Nehelamite
  chosen_korean: 스마야 느헬라미 사람에 관하여
  alternatives_korean:
  - 스마야 느헬라미에 관하여
