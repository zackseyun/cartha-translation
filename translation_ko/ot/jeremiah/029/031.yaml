  text: שְׁלַ֤ח עַל כָּל הַ/גּוֹלָה֙ לֵ/אמֹ֔ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה אֶל שְׁמַעְיָ֖ה הַ/נֶּחֱלָמִ֑י יַ֡עַן אֲשֶׁר֩ נִבָּ֨א לָ/כֶ֜ם שְׁמַעְיָ֗ה וַֽ/אֲנִי֙ לֹ֣א שְׁלַחְתִּ֔י/ו וַ/יַּבְטַ֥ח אֶתְ/כֶ֖ם עַל שָֽׁקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/031.yaml
  text: 'Send to all the exiles[a], saying, ‘Thus says Yahweh concerning Shemaiah the Nehelamite: Because Shemaiah has prophesied to you, though I did not send him, and has made you trust in a lie,’'
  footnotes:
  - marker: a
    text: Or possibly “Shemaiah the dreamer,” if the title is derived from a word related to dreaming rather than a place-name or clan designation.
    reason: lexical_alternative
translation:
  language: ko
  text: 모든 포로들에게 보내어 이렇게 말하게 하십시오. “야훼께서 스마야 느헬라미 사람에 관하여 이렇게 말씀하십니다. 스마야가 너희에게 예언하였으나 내가 그를 보내지 않았고, 거짓을 믿게 하였습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘느헬라미’는 전통적으로 지명형/계통형으로 보지만, 어근이 ‘꿈’과 관련된 말에서 왔을 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח עַל כָּל הַגּוֹלָה
  english_pob_choice: Send to all the exiles
  chosen_korean: 모든 포로들에게 보내어
  alternatives_korean:
  - 모든 유배민들에게 보내어
  - 모든 포로 공동체에게 보내어
  lexicon: HALOT
  rationale: שְׁלַח의 명령형을 자연스러운 전달 동사로 살리고, הַגּוֹלָה는 집단 전체를 가리키므로 ‘포로들’이 가장 간결하게 대응합니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 여호와께서 이렇게 말씀하십니다
  - 야훼께서 말씀하시되
  lexicon: HALOT
  rationale: 예언자 공식을 현대 한국어 합쇼체로 옮기되, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֶל שְׁמַעְיָה הַנֶּחֱלָמִי
  english_pob_choice: concerning Shemaiah the Nehelamite
  chosen_korean: 스마야 느헬라미 사람에 관하여
  alternatives_korean:
  - 스마야 느헬라미에 관하여
  - 스마야 꿈꾸는 자에 관하여
  lexicon: HALOT
  rationale: אֶל은 여기서 대상으로서의 ‘~에 관하여’가 자연스럽고, הַנֶּחֱלָמִי는 의미가 확정되지 않아 지명/계통 표지를 보존하는 쪽으로 옮겼습니다.
- source_word: נִבָּא לָכֶם ... וַיַּבְטַח אֶתְכֶם עַל שָׁקֶר
  english_pob_choice: has prophesied to you ... and has made you trust in a lie
  chosen_korean: 너희에게 예언하였으나 ... 거짓을 믿게 하였습니다
  alternatives_korean:
  - 너희에게 예언하였으나 ... 거짓 위에 너희를 의지하게 하였습니다
  - 너희에게 예언하였으나 ... 거짓을 신뢰하게 하였습니다
  lexicon: HALOT
  rationale: נבא는 예언 행위로, 히필 בטח의 사역적 의미는 ‘믿게 하다’로 풀어 한국어에서 가장 직접적으로 드러냈습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 합쇼체 예언문 안에서도 신명은 ‘야훼’로 유지했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신명을 직접 사용하므로, 통상적 대체 호칭보다 고유 이름을 보존하는 것이 원문 감각과 공적 독해에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
