  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּי֩ כֹ֨ה אָמַ֜ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אַל יַשִּׁ֧יאוּ לָ/כֶ֛ם נְבִֽיאֵי/כֶ֥ם אֲשֶׁר בְּ/קִרְבְּ/כֶ֖ם וְ/קֹֽסְמֵי/כֶ֑ם וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חֲלֹמֹ֣תֵי/כֶ֔ם אֲשֶׁ֥ר אַתֶּ֖ם מַחְלְמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/008.yaml
  text: 'For thus says Yahweh of hosts[a], the God of Israel: Do not let your prophets who are among you and your diviners deceive you, and do not listen to your dreams that you are causing to be dreamed.'
  footnotes:
  - marker: a
    text: Or 'the dreams that you dream'; the Hebrew expression is difficult and may reflect either dreams the people themselves are dreaming or dreams they are in some sense fostering or causing.
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 「너희 가운데 있는 너희 예언자들과 너희 점쟁이들이 너희를 속이지 못하게 하며, 너희가 꾸는 꿈에 귀 기울이지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 어렵습니다. ‘너희가 꾸는 꿈’ 또는 ‘너희가 꾸게 되는 꿈’으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 여호와
  lexicon: HALOT
  rationale: Tetragrammaton은 기본 원칙에 따라 야훼로 옮기고, צְבָאוֹת는 관용적으로 만군으로 옮겨 직함의 군사·천상적 뉘앙스를 보존했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘의 하나님이신 분
  lexicon: HALOT
  rationale: 언약적 소유격 구조를 자연스러운 한국어로 옮기되, 고유한 신적 호칭은 하나님으로 유지했습니다.
- source_word: אַל יַשִּׁיאוּ לָכֶם
  english_pob_choice: Do not let ... deceive you
  chosen_korean: 너희를 속이지 못하게 하며
  alternatives_korean:
  - 너희를 미혹하지 못하게 하며
  - 너희를 현혹하지 못하게 하며
  lexicon: HALOT
  rationale: Hiphil의 사역적 의미를 간명하게 살려 ‘속이다’로 옮겼고, 금지문맥에 맞게 ‘못하게 하며’로 표현했습니다.
- source_word: חֲלֹמֹתֵיכֶם אֲשֶׁר אַתֶּם מַחְלְמִים
  english_pob_choice: your dreams that you are causing to be dreamed
  chosen_korean: 너희가 꾸는 꿈
  alternatives_korean:
  - 너희가 꾸게 되는 꿈
  - 너희가 꾸고 있는 꿈
  lexicon: HALOT
  rationale: 히브리어의 어려운 Hiphil형은 한국어에서 직역 시 부자연스러워, POB의 최신 조정처럼 의미 중심으로 ‘너희가 꾸는 꿈’으로 옮기되 꿈의 주체가 청중에게 있음을 유지했습니다.
theological_decisions:
- issue: 야훼의 직함과 경고문체
  chosen_reading: 야훼의 직접 발화로서 권위 있는 경고를 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - 전통적 예언체 어투
  - 평서형으로 완화된 경고
  rationale: 본문은 예언적 금지 명령이므로, 현대 문어 합쇼체로 옮기되 명령의 강도를 약화시키지 않았습니다.
  doctrine_reference: '문체 원칙: 예언서의 직접 발화는 권면/경고의 강도를 보존'
- issue: 꿈의 난해한 히브리어 표현
  chosen_reading: 의미상 ‘너희가 꾸는 꿈’으로 처리했습니다.
  alternative_readings:
  - ‘너희가 꿈꾸게 하는 꿈’
  - ‘너희가 꾸고 있는 꿈’
  rationale: 히브리어 표현은 난해하지만, 문맥상 백성 내부의 거짓 확신을 경고하는 흐름이 분명하므로 과도한 어색함을 피하면서도 의미의 핵심을 보존했습니다.
  doctrine_reference: '해석 원칙: 난해한 동사형은 문맥에 따라 최소한으로 매끈하게 처리'
