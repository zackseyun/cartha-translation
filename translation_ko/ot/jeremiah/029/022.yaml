source:
  edition: WLC
  text: וְ/לֻקַּ֤ח מֵ/הֶם֙ קְלָלָ֔ה לְ/כֹל֙ גָּל֣וּת יְהוּדָ֔ה אֲשֶׁ֥ר בְּ/בָבֶ֖ל לֵ/אמֹ֑ר יְשִֽׂמְ/ךָ֤ יְהוָה֙ כְּ/צִדְקִיָּ֣הוּ וּ/כְ/אֶחָ֔ב אֲשֶׁר קָלָ֥/ם מֶֽלֶךְ בָּבֶ֖ל בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/022.yaml
  text: And from them a curse will be taken up by all the exiles of Judah who are in Babylon[a], saying, “May Yahweh make you like Zedekiah and like Ahab, whom the king of Babylon roasted in the fire.”
  footnotes:
  - marker: a
    text: Or 'burned them in the fire.' The Hebrew verb can be rendered more generally as 'burned,' though 'roasted' preserves its vivid force.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론에 있는 유다의 모든 유배민이 그들을 두고 저주의 말로 삼아 이렇게 말할 것입니다. 「야훼께서 너를 바벨론 왕이 불에 구운 시드기야와 아합처럼 되게 하시기를 바랍니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바벨론 왕이 불에 태운 시드기야와 아합처럼.’ 히브리어 동사는 더 일반적으로 ‘태우다’로 옮길 수 있으나, ‘굽다’는 그 생생하고 가혹한 어감을 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֻקַּח
  english_pob_choice: will be taken up
  chosen_korean: 사용되게 될 것입니다
  alternatives_korean:
  - 불려지게 될 것입니다
  - 취해지게 될 것입니다
  lexicon: HALOT
  rationale: 수동형으로 새겨진 관용구가 공동체 안에서 저주문으로 채택되는 뜻이므로, 한국어에서는 자연스럽게 ‘사용되다’로 풀어 그 기능을 드러냈습니다.
- source_word: קְלָלָה
  english_pob_choice: a curse
  chosen_korean: 하나의 저주
  alternatives_korean:
  - 저주문 하나
  - 저주 한 마디
  lexicon: HALOT
  rationale: 문맥상 단순한 저주가 아니라 예식적·관용구적 저주 표현이지만, 과도한 설명을 피하고 본문의 형식을 살려 ‘하나의 저주’로 옮겼습니다.
- source_word: יְשִׂמְךָ יְהוָה
  english_pob_choice: May Yahweh make you
  chosen_korean: 야훼께서 너를 … 되게 하시기를
  alternatives_korean:
  - 야훼께서 너를 … 만들기를
  - 야훼께서 너를 … 되게 하소서
  lexicon: HALOT
  rationale: 저주 공식의 소원형을 한국어에서 자연스러운 기원문으로 옮기되, 직접화법의 긴장감을 유지하기 위해 ‘되게 하시기를’을 택했습니다.
- source_word: קָלָם ... בָּאֵשׁ
  english_pob_choice: roasted them in the fire
  chosen_korean: 그들을 불에 구웠습니다
  alternatives_korean:
  - 그들을 불에 태웠습니다
  - 그들을 불로 구웠습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 POB의 판단대로 ‘roasted’가 더 근접하므로, 잔혹한 비유적 생생함을 살려 ‘불에 구웠습니다’로 옮겼습니다.
theological_decisions:
- issue: יהוה(יְהוָה)의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 관용구가 아닌 직접적인 신명 표기를 사용하므로, 프로젝트 기준에 따라 고유신명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
