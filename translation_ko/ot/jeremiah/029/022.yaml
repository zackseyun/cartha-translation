revisions:
- from: 그리고 그들로부터, 바벨론에 있는 유다의 모든 포로들 가운데서 하나의 저주가 사용되게 될 것입니다[a]. 곧, 「야훼께서 너를 시드기야와 아합처럼 되게 하시기를 — 바벨론 왕이 그들을 불에 구웠습니다」라고 말할 것입니다.
  to: 바벨론에 있는 유다의 모든 유배민이 그들을 두고 저주의 말로 삼아 이렇게 말할 것입니다. 「야훼께서 너를 바벨론 왕이 불에 구운 시드기야와 아합처럼 되게 하시기를 바랍니다[a].」
  rationale: 원문의 저주 공식과 관계절 구조를 회복하고, 수동적으로 ‘저주를 취하다’라는 관용적 표현을 한국어에서 자연스러운 ‘저주의 말로 삼다’로 옮겼습니다. 저주의 소원형, 신명 ‘야훼’, 그리고 קלה의 강한 어감은 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:32Z'
review_pass:
  verdict: revise
  source_fidelity: 직접 인용문 끝의 ‘바벨론 왕이 그들을 불에 구웠습니다’는 히브리어 אֲשֶׁר 관계절을 독립된 과거 서술로 처리하여, 저주 공식 안에서 시드기야와 아합을 수식하는 구조가 흐려집니다. 이를 ‘바벨론 왕이 불에 구운 시드기야와 아합처럼’으로 고쳐야 합니다. 또한 גָּלוּת יְהוּדָה는 이 문맥에서 ‘포로들’보다 ‘유다의 유배민’이 더 정확하고 자연스럽습니다.
  naturalness: ‘그들로부터 … 하나의 저주가 사용되게 될 것입니다’는 직역 흔적이 강하고 ‘하나의 저주’도 한국어 성경 문체에서 부자연스럽습니다. ‘그들을 두고 저주의 말로 삼아’는 저주 공식으로 채택한다는 뜻을 자연스럽게 전달합니다. 인용문에는 과거 사실을 별도 문장으로 끝내지 않고 관계절로 결속했습니다.
  terminology: 야훼, 시드기야, 아합은 유지합니다. קָלָם의 생생한 어감을 반영한 ‘불에 구운’을 유지하되, 더 일반적인 ‘불에 태운’이라는 대안을 각주로 제시합니다.
  issues:
  - severity: high
    issue: 인용문 안의 관계절이 독립 과거문으로 번역됨
    rationale: אֲשֶׁר קָלָם מֶלֶךְ בָּבֶל בָּאֵשׁ는 시드기야와 아합을 수식합니다. 현 번역의 ‘그들을 불에 구웠습니다’는 저주문의 문법적 결속과 발화 형식을 훼손합니다.
  - severity: medium
    issue: גָּלוּת יְהוּדָה를 ‘유다의 모든 포로들’로 번역함
    rationale: 집합적 표현은 바벨론에 있는 유다의 유배 공동체를 가리킵니다. ‘유배민’이 포로 신분만을 지나치게 전면화하지 않으면서 원문의 대상을 더 잘 반영합니다.
