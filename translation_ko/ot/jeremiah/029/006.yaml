source:
  edition: WLC
  text: קְח֣וּ נָשִׁ֗ים וְ/הוֹלִידוּ֮ בָּנִ֣ים וּ/בָנוֹת֒ וּ/קְח֨וּ לִ/בְנֵי/כֶ֜ם נָשִׁ֗ים וְ/אֶת בְּנֽוֹתֵי/כֶם֙ תְּנ֣וּ לַֽ/אֲנָשִׁ֔ים וְ/תֵלַ֖דְנָה בָּנִ֣ים וּ/בָנ֑וֹת וּ/רְבוּ שָׁ֖ם וְ/אַל תִּמְעָֽטוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
  footnotes:
  - marker: a
    text: Or, more formally, 'beget sons and daughters.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'give your daughters to men'; in context this means giving them in marriage.
    reason: lexical_alternative
  - marker: c
    text: Or 'do not become few.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아내들을 맞아들이고, 아들들과 딸들을 낳으십시오[a]. 또 여러분의 아들들을 위해 아내들을 맞아들이고, 여러분의 딸들을 남자들에게 주십시오[b]. 그들이 아들들과 딸들을 낳게 하십시오. 그곳에서 번성하십시오[c]. 줄어들지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아들들과 딸들을 낳으십시오’입니다. 여기서는 남성 주어에 대한 ילד의 관용적 용법을 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분의 딸들을 남자들에게 주십시오’입니다. 문맥상 이는 결혼을 염두에 둔 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘적어지지 마십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְחוּ נָשִׁים
  english_pob_choice: Take wives
  chosen_korean: 아내들을 맞아들이고
  alternatives_korean:
  - 아내들을 취하고
  - 아내들을 데려가고
  lexicon: HALOT
  rationale: 히브리어의 결혼 관용구를 자연스럽게 살리되, 단순 소유가 아니라 혼인 관계 형성을 뜻함을 드러내기 위해 ‘맞아들이고’로 옮겼습니다.
- source_word: וְהוֹלִידוּ
  english_pob_choice: father
  chosen_korean: 아들들과 딸들을 낳으십시오
  alternatives_korean:
  - 아들들과 딸들을 아버지 되십시오
  - 아들들과 딸들을 자녀 낳으십시오
  lexicon: HALOT
  rationale: 남성 주어의 ילד 히필은 ‘낳다/자식의 아버지가 되다’의 뜻이므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘낳다’로 처리했습니다.
- source_word: וְאֶת בְּנוֹתֵיכֶם תְּנוּ לַאֲנָשִׁים
  english_pob_choice: and give your daughters to men
  chosen_korean: 여러분의 딸들을 남자들에게 주십시오
  alternatives_korean:
  - 여러분의 딸들을 남편들에게 주십시오
  - 여러분의 딸들을 결혼시키십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘남자들에게’이므로 이를 그대로 살리되, 혼인 맥락이 분명하므로 주석에서 결혼 의미를 밝혔습니다.
- source_word: וּרְבוּ
  english_pob_choice: multiply
  chosen_korean: 번성하십시오
  alternatives_korean:
  - 번식하십시오
  - 번창하십시오
  - 많아지십시오
  lexicon: HALOT
  rationale: 인구 증가의 명령을 한국어에서 너무 생물학적으로만 들리지 않게 하면서도 ‘multiply’의 확장 의미를 살리기 위해 ‘번성하다’를 선택했습니다.
