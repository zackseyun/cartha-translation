base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/006.yaml
  text: Take wives and father sons and daughters[a]; and take wives for your sons, and give your daughters to men, so that they may bear sons and daughters; multiply there[c][b], and do not decrease.
  footnotes:
  - marker: a
    text: Or, more formally, 'beget sons and daughters.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'give your daughters to men'; in context this means giving them in marriage.
    reason: lexical_alternative
  - marker: c
    text: Or 'do not become few.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아내를 맞이하여 아들과 딸을 두십시오[a]. 또 아들들에게 아내를 얻어 주고, 딸들을 남자들에게 시집보내십시오[b]. 그 딸들이 아들과 딸을 낳도록 하십시오. 그곳에서 번성하고, 줄어들지 마십시오[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아들과 딸의 아버지가 되십시오’. 히브리어는 남성 주어가 자녀를 두는 것을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여러분의 딸들을 남자들에게 주십시오’입니다. 문맥상 결혼시키는 것을 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘적어지지 마십시오’ 또는 ‘수적으로 줄지 마십시오’입니다.
    reason: lexical_alternative
lexical_decisions:
