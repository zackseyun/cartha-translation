translation:
  language: ko
  text: 그때 제사장 스바냐가 예언자 예레미야가 듣도록 이 책을 읽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: read
  chosen_korean: 읽었습니다
  alternatives_korean:
  - 낭독했습니다
  - 소리 내어 읽었습니다
  lexicon: HALOT
  rationale: כתב된 문서를 소리 내어 읽는 뜻으로 자연스럽게 살리되, 서사 진행을 나타내는 완료형으로 옮겼습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 사제
  - 성직자
  lexicon: HALOT
  rationale: כהן의 기본 직분 명칭을 한국어 성경에서 일반적인 ‘제사장’으로 옮겼습니다.
- source_word: הַסֵּפֶר הַזֶּה
  english_pob_choice: this scroll
  chosen_korean: 이 책
  alternatives_korean:
  - 이 두루마리
  - 이 문서
  - 이 편지
  lexicon: HALOT
  rationale: סֵפֶר는 여기서 기록된 문서를 가리키지만, 한국어에서는 문맥상 자연스러운 ‘이 책’이 가장 직접적인 대응입니다. 영어 POB의 ‘scroll/letter’ 흔적은 주석 없이 본문에 과도하게 드러내지 않았습니다.
- source_word: בְּאָזְנֵי
  english_pob_choice: in the hearing of
  chosen_korean: 들을 수 있는 곳에서
  alternatives_korean:
  - 듣는 앞에서
  - 그의 귀에
  - 듣는 가운데
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘귀들 안에/앞에서’의 의미를 한국어에서 자연스럽고 분명하게 풀어, 공개 낭독의 상황을 전달했습니다.
