  source_fidelity: 초안은 편지, 예레미야, 예루살렘, 수신자 집단, 느부갓네살의 강제 이송, 바벨론이라는 핵심 요소를 대체로 충실히 옮겼습니다. 그러나 둘째 문장의 ‘곧 … 이들입니다’는 히브리어 관계절이 직접 수식하는 ‘모든 백성’뿐 아니라 앞선 모든 수신자를 가리키는 듯하게 읽힐 수 있습니다. 원문에서는 ‘느부갓네살이 … 끌고 간’이 ‘모든 백성’을 수식합니다.
