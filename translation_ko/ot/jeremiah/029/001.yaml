source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר שָׁלַ֛ח יִרְמְיָ֥ה הַ/נָּבִ֖יא מִ/ירוּשָׁלִָ֑ם אֶל יֶ֜תֶר זִקְנֵ֣י הַ/גּוֹלָ֗ה וְ/אֶל הַ/כֹּהֲנִ֤ים וְ/אֶל הַ/נְּבִיאִים֙ וְ/אֶל כָּל הָ/עָ֔ם אֲשֶׁ֨ר הֶגְלָ֧ה נְבֽוּכַדְנֶאצַּ֛ר מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/001.yaml
  text: Now these are the words of the letter that Jeremiah the prophet sent from Jerusalem to the remaining elders of the exiles[a], and to the priests, the prophets[d][c][b], and all the people whom Nebuchadnezzar had carried away from Jerusalem to Babylon.
  footnotes:
  - marker: a
    text: Or 'the words of the scroll.' The Hebrew סֵפֶר can denote a written document more broadly; 'letter' is chosen because Jeremiah sent it to specific recipients.
    reason: lexical_alternative
  - marker: b
    text: Or 'the rest of the elders of the exile.' The Hebrew may refer either to the remaining elders among the deported community or, more abstractly, to the exile community itself.
    reason: lexical_alternative
  - marker: c
    text: Or 'whom Nebuchadnezzar had exiled' / 'had deported.'
    reason: lexical_alternative
  - marker: d
    text: 'Hebrew: ''Nebuchadnezzar''; some English traditions use ''Nebuchadrezzar'' in Jeremiah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 예언자 예레미야가 예루살렘에서 바벨론으로 끌려간 포로들 중 남은 장로들과 제사장들과 예언자들과 모든 백성에게 보낸 편지의 말씀입니다. 곧 느부갓네살이 예루살렘에서 바벨론으로 끌어간 이들입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두루마리의 말씀’. 히브리어 סֵפֶר는 더 넓게는 기록 문서를 뜻할 수 있으나, 여기서는 특정 수신자에게 보내진 글이므로 ‘편지’가 가장 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘포로의 남은 장로들’. 히브리어는 포로 공동체 전체를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘느부갓네살이 … 유배시킨’.
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי הַסֵּפֶר
  english_pob_choice: the words of the letter
  chosen_korean: 편지의 말씀
  alternatives_korean:
  - 두루마리의 말씀
  - 문서의 말씀
  lexicon: HALOT
  rationale: סֵפֶר는 문맥상 단순한 ‘책’보다 특정 수신자에게 보내진 서면 통신문을 가리키므로, POB의 ‘letter’를 따라 ‘편지’로 옮기고 ‘말씀’을 유지해 히브리어 구성 표현을 살렸습니다.
- source_word: יֶתֶר זִקְנֵי הַגּוֹלָה
  english_pob_choice: the remaining elders of the exiles
  chosen_korean: 포로들 중 남은 장로들
  alternatives_korean:
  - 포로의 남은 장로들
  - 포로 귀환 전까지 남아 있던 장로들
  lexicon: HALOT
  rationale: יֶתֶר의 ‘남은/남은 자’와 הַגּוֹלָה의 포로 공동체 지시를 함께 살리기 위해 ‘포로들 중 남은 장로들’로 옮겼습니다.
- source_word: הֶגְלָה
  english_pob_choice: had carried away
  chosen_korean: 끌어간
  alternatives_korean:
  - 포로로 끌고 간
  - 유배시킨
  lexicon: HALOT
  rationale: הִפְעִיל형의 강제 이송 의미를 보존하면서 한국어에서 자연스럽고 서술적인 ‘끌어간’으로 옮겼습니다.
- source_word: נְבוּכַדְנֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓네차르
  - 느부캇네살
  lexicon: HALOT
  rationale: 성경 한국어에서 널리 정착된 고유명사 표기를 따랐습니다.
theological_decisions:
- issue: 포로 공동체를 가리키는 표현
  chosen_reading: ‘포로들 중 남은 장로들’로 구체화해, 단지 추상적 ‘포로 상태’가 아니라 실제로 바벨론으로 이송된 공동체 안의 수신자들을 가리키는 것으로 드러냈습니다.
  alternative_readings:
  - ‘포로의 장로들’
  - ‘유배의 장로들’
  rationale: 문맥상 편지는 특정 사람들에게 보내진 문서이므로, 공동체 내 인물들을 직접 지칭하는 표현이 독자에게 더 분명합니다.
  doctrine_reference: 역사서술/예언서 문맥의 수신자 식별
