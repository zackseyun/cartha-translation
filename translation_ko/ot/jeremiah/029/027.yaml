id: JER.29.27
reference: Jeremiah 29:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה לָ֚/מָּה לֹ֣א גָעַ֔רְתָּ בְּ/יִרְמְיָ֖הוּ הָֽ/עֲנְּתֹתִ֑י הַ/מִּתְנַבֵּ֖א לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/027.yaml
  text: And now[a], why have you not rebuked Jeremiah the Anathothite, who is prophesying to you?
  footnotes:
  - marker: a
    text: Or 'from Anathoth.' The Hebrew uses a gentilic, literally 'the Anathothite.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 왜 너희가 예레미야—아나돗 사람—을 책망하지 않았습니까? 그는 너희에게 예언하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아나돗에서 나온 사람’입니다. 히브리어는 민족·출신을 나타내는 형용사형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그런데 이제
  lexicon: HALOT
  rationale: 전환 접속사 ו와 시간 부사 עתה의 흐름을 한국어에서 자연스럽게 압축해, 논쟁적 발화의 국면 전환을 살렸습니다.
- source_word: גָעַרְתָּ
  english_pob_choice: have you not rebuked
  chosen_korean: 책망하지 않았습니까
  alternatives_korean:
  - 꾸짖지 않았습니까
  - 질책하지 않았습니까
  lexicon: HALOT
  rationale: גער의 강한 질책 의미를 반영하되, 현대 한국어에서 가장 직접적이고 공적 책임 추궁의 뉘앙스가 살아 있는 ‘책망하다’를 택했습니다.
- source_word: הָעֲנְּתֹתִי
  english_pob_choice: the Anathothite
  chosen_korean: 아나돗 사람
  alternatives_korean:
  - 아나돗인
  - 아나돗 출신 사람
  lexicon: HALOT
  rationale: 히브리어 gentilic 형식을 살리면서도 한국어 독자가 즉시 이해할 수 있도록 ‘-사람’ 구성을 사용했습니다.
- source_word: הַמִּתְנַבֵּא
  english_pob_choice: who is prophesying
  chosen_korean: 예언하고 있습니다
  alternatives_korean:
  - 예언하는
  - 예언하고 있느냐
  lexicon: HALOT
  rationale: 현재 진행의 분사적 성격을 한국어 진행형으로 옮겨, 예레미야의 계속되는 예언 행위를 드러냈습니다.
theological_decisions:
- issue: 예언하다/예언하는 자의 현재성
  chosen_reading: ‘예언하고 있습니다’로 현재 진행을 살려 예레미야가 지금 이 순간에도 하나님의 메시지를 선포하는 상황을 드러냈습니다.
  alternative_readings:
  - ‘예언합니다’
  - ‘예언하는’
  rationale: 분사 הַמִּתְנַבֵּא의 지속적 행위를 자연스럽게 반영하면서, 문맥의 대립 구조를 선명하게 유지합니다.
  doctrine_reference: 예언자적 발화의 현재성
