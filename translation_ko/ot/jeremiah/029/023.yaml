id: JER.29.23
reference: Jeremiah 29:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יַ֡עַן אֲשֶׁר֩ עָשׂ֨וּ נְבָלָ֜ה בְּ/יִשְׂרָאֵ֗ל וַ/יְנַֽאֲפוּ֙ אֶת נְשֵׁ֣י רֵֽעֵי/הֶ֔ם וַ/יְדַבְּר֨וּ דָבָ֤ר בִּ/שְׁמִ/י֙ שֶׁ֔קֶר אֲשֶׁ֖ר ל֣וֹא צִוִּיתִ֑/ם וְ/אָנֹכִ֛י הו ידע וָ/עֵ֖ד נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/023.yaml
  text: because they have committed an outrageous act in Israel[a], and have committed adultery with their neighbors’ wives, and have spoken in my name a lie that I did not command them. And I am the one who knows and is a witness[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'have done a disgraceful thing' or 'have committed folly.' The Hebrew נְבָלָה denotes a morally outrageous, disgraceful act.
    reason: lexical_alternative
  - marker: b
    text: Or 'among Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''And I know, and I am witness.'' The Hebrew is emphatic: ''And I, I am he who knows and is witness.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이스라엘[a]에서 부끄러운 일을 저지르고, 자기 이웃의 아내들과 간음하였으며, 내가 그들에게 명령하지 않은 거짓을 내 이름으로 말하였기 때문입니다. 보라, 내가 아는 자요 증인입니다[c][b]—야훼의 말씀이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 가운데’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들 가운데’라는 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘내가 알고, 내가 증인이다’로 옮길 수 있습니다. 히브리어는 ‘내가, 내가 아는 자요 증인이다’라는 강한 강조를 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבָלָה
  english_pob_choice: have committed an outrageous act
  chosen_korean: 부끄러운 일
  alternatives_korean:
  - 수치스러운 일
  - 망령된 일
  - 가증한 짓
  lexicon: HALOT
  rationale: נְבָלָה는 단순한 실수보다 도덕적으로 수치스럽고 충격적인 행위를 가리키므로, 한국어에서는 과도한 해설 없이도 수치성과 비난의 강도를 살리는 표현을 택했습니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: in Israel
  chosen_korean: 이스라엘에서
  alternatives_korean:
  - 이스라엘 가운데
  - 이스라엘 안에서
  lexicon: HALOT
  rationale: 전치사 ב의 기본적인 장소 의미를 살려, 공동체 내부라는 뉘앙스를 자연스럽게 담는 가장 직설적인 표현으로 옮겼습니다.
- source_word: וַיְנַאֲפוּ אֶת נְשֵׁי רֵעֵיהֶם
  english_pob_choice: have committed adultery with their neighbors’ wives
  chosen_korean: 자기 이웃의 아내들과 간음하였으며
  alternatives_korean:
  - 자기 이웃의 아내들과 간음하였으며
  - 이웃들의 아내들과 간음하였으며
  - 자기 동료의 아내들과 간음하였으며
  lexicon: HALOT
  rationale: נאף는 명시적으로 간음을 뜻하므로 ‘간음하다’를 사용했고, רֵעַ는 친밀한 친구보다 공동체 내의 이웃/동료를 가리키는 경우가 많아 자연스러운 ‘이웃’으로 옮겼습니다.
- source_word: וַיְדַבְּרוּ דָבָר בִּשְׁמִי שֶׁקֶר
  english_pob_choice: have spoken in my name a lie
  chosen_korean: 내 이름으로 거짓을 말하였으며
  alternatives_korean:
  - 내 이름으로 거짓말을 하였으며
  - 내 이름으로 거짓을 말하였으며
  - 내 이름을 빙자하여 거짓을 말하였으며
  lexicon: HALOT
  rationale: ‘내 이름으로’는 신적 권위를 사칭한 발화를 뜻하므로 그대로 살렸고, דָבָר שֶׁקֶר는 자연스러운 한국어로 ‘거짓을 말하다’가 가장 직접적입니다.
- source_word: וְאָנֹכִי הוּא יֹדֵעַ וָעֵד
  english_pob_choice: And I am the one who knows and is a witness
  chosen_korean: 보라, 내가 아는 자요 증인입니다
  alternatives_korean:
  - 내가 아는 자요 증인입니다
  - 내가 알며 증언하는 자입니다
  - 내가 아는 자이며 증인입니다
  lexicon: HALOT
  rationale: אָנֹכִי הוּא의 강조를 살리기 위해 주어를 분명히 드러냈고, forensic한 ‘증인’의 역할을 유지하면서 문맥상 자연스러운 자기선언형으로 다듬었습니다.
theological_decisions:
- issue: יהוה의 표기와 예언 공식의 톤
  chosen_reading: 야훼의 말씀이십니다
  alternative_readings:
  - 주의 말씀입니다
  - 야훼께서 말씀하십니다
  rationale: 본문 말미의 נְאֻם יְהוָה는 예언적 결말 공식이므로, 본문에서는 하나님의 고유명 ‘야훼’를 유지하고 한국어 합쇼체에 맞게 선언형 종결로 처리했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה YHWH'
- issue: 증언 진술의 문법적 압축
  chosen_reading: 보라, 내가 아는 자요 증인입니다
  alternative_readings:
  - 내가 아는 자이며 증인입니다
  - 내가 알고 증언합니다
  rationale: 히브리어의 강한 자기지시와 법정적 증언성을 유지하려면 단순한 ‘증언합니다’보다 ‘증인입니다’가 더 직접적이며, ‘보라’는 앞선 고발에 대한 신적 강조를 살립니다.
  doctrine_reference: 히브리어 수사와 예언자적 법정 어조
