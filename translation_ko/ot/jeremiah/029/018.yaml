revisions:
- from: 내가 그들을 칼과 기근과 전염병으로 추적하겠습니다. 나는 그들을 땅의 모든 왕국들 가운데 공포가 되게 하며, 저주와 황폐와 비웃음의 대상과 수치가 되게 하겠습니다. 이는 내가 그들을 그곳으로 내몬 모든 민족들 가운데서입니다.[a][b]
  to: 내가 칼과 기근과 전염병으로 그들을 뒤쫓겠습니다. 내가 그들을 땅의 모든 왕국에 공포의 대상이 되게 하고[a], 내가 그들을 그곳으로 내쫓은 모든 민족 가운데서 저주와 황폐와 조롱거리[b]와 수치거리가 되게 하겠습니다.
  rationale: 원문의 두 개의 범위 표현, 곧 ‘땅의 모든 왕국에’와 ‘내가 그들을 그곳으로 내쫓은 모든 민족 가운데서’를 각각 해당 수치 표현에 자연스럽게 연결했습니다. 하나님의 심판과 흩으심에 대한 1인칭 직접 행위, 심판 삼중구, 그리고 공개적 수치의 누적 목록은 유지했습니다.
