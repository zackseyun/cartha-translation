source:
  edition: WLC
  text: וְ/רָֽדַפְתִּי֙ אַֽחֲרֵי/הֶ֔ם בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וּ/נְתַתִּ֨י/ם ל/זועה לְ/כֹ֣ל מַמְלְכ֣וֹת הָ/אָ֗רֶץ לְ/אָלָ֤ה וּ/לְ/שַׁמָּה֙ וְ/לִ/שְׁרֵקָ֣ה וּ/לְ/חֶרְפָּ֔ה בְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁר הִדַּחְתִּ֥י/ם שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/029/018.yaml
  text: And I will pursue them with the sword[a], with famine, and with pestilence, and I will make them a horror to all the kingdoms of the earth, a curse, a desolation, an object of hissing[b], and a reproach among all the nations where I have driven them.
  footnotes:
  - marker: a
    text: Or 'a terror.' The Hebrew term can denote horror, terror, or trembling; here it describes becoming an object of dread before the kingdoms.
    reason: lexical_alternative
  - marker: b
    text: Or 'a hissing'—that is, an object of derision marked by scornful hissing or whistling.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 칼과 기근과 전염병으로 추적하겠습니다. 나는 그들을 땅의 모든 왕국들 가운데 공포가 되게 하며, 저주와 황폐와 비웃음의 대상과 수치가 되게 하겠습니다. 이는 내가 그들을 그곳으로 내몬 모든 민족들 가운데서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공포’. 히브리어는 공포, 두려움, 떨림의 뉘앙스를 가질 수 있으며, 여기서는 여러 왕국 앞에서 두려움의 대상이 되는 상태를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘휘파람 소리’—곧 조롱과 경멸의 표시로 내는 소리입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָדַפְתִּי אַחֲרֵיהֶם
  english_pob_choice: And I will pursue them
  chosen_korean: 내가 그들을 추적하겠습니다
  alternatives_korean:
  - 내가 그들을 뒤쫓겠습니다
  - 내가 그들을 추격하겠습니다
  lexicon: HALOT
  rationale: רדף+אַחֲרֵי의 적극적 추적 의미를 살리되, 한국어에서는 ‘추적하다’가 문맥의 집요한 पीछ적성을 비교적 자연스럽게 전달합니다.
- source_word: בַּחֶרֶב בָּרָעָב וּבַדָּבֶר
  english_pob_choice: with the sword, with famine, and with pestilence
  chosen_korean: 칼과 기근과 전염병으로
  alternatives_korean:
  - 칼과 기근과 역병으로
  - 칼과 기아와 질병으로
  lexicon: HALOT
  rationale: 예언서의 심판 삼중구를 한국어의 병렬 형태로 간결하게 옮기되, דֶּבֶר은 공적 재앙의 뉘앙스를 유지하기 위해 ‘전염병’으로 옮겼습니다.
- source_word: וּנְתַתִּים לְזַוֲעָה
  english_pob_choice: I will make them a horror
  chosen_korean: 공포가 되게 하며
  alternatives_korean:
  - 소름끼치는 존재가 되게 하며
  - 두려움의 대상이 되게 하며
  lexicon: HALOT
  rationale: לְזַוֲעָה의 ‘경악/공포의 대상’ 의미를 살리면서, 뒤따르는 수치·비웃음 목록과도 어울리는 자연스러운 한국어로 옮겼습니다.
- source_word: וְלִשְׁרֵקָה
  english_pob_choice: an object of hissing
  chosen_korean: 비웃음의 대상
  alternatives_korean:
  - 휘파람질의 대상
  - 빈정거림의 대상
  lexicon: HALOT
  rationale: שְׁרֵקָה는 조롱 섞인 휘파람/쉿소리를 가리키므로, 한국어 관용에서는 그 결과인 ‘비웃음의 대상’이 의미를 가장 분명히 전달합니다.
theological_decisions:
- issue: 하나님의 직접적 심판 행위와 유배의 원인성
  chosen_reading: ‘내가 그들을 … 추적하겠습니다’와 ‘내가 그들을 그곳으로 내몄다’처럼 하나님의 1인칭 행위를 그대로 유지했습니다.
  alternative_readings:
  - 수동태로 완화하여 ‘그들이 … 당하게 하겠습니다’로 옮김
  - 인과를 흐려 ‘그들이 그곳에 있게 된 곳’으로 옮김
  rationale: 본문은 심판과 흩으심을 하나님께 직접 귀속하므로, 이를 완화하지 않고 원문의 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3
