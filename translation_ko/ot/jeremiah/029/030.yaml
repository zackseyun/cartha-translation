lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 임하여
  alternatives_korean:
  - 그리고 ... 이르러
  - 그리하여 ... 되었습니다
  - 그리고 ... 있었습니다
  lexicon: HALOT
  rationale: 서술 전환을 알리는 הבא עמה의 روایت형 सूत्र를 현대 한국어에서 자연스럽게 살리기 위해 ‘그때’와 ‘임하여’를 사용해, 단순한 발생보다 말씀이 예레미야에게 다가오는 गतिशील성을 드러냈습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 메시지
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언문 서두의 관용구인 ‘the word of Yahweh’를 한국어 성경체에서 가장 직접적으로 반영하는 표현으로 ‘말씀’을 택했고, 신학적 이름은 관례적 대체어가 아닌 ‘야훼’로 옮겼습니다.
- source_word: אֶל יִרְמְיָהוּ
  english_pob_choice: to Jeremiah
  chosen_korean: 예레미야에게
  alternatives_korean:
  - 예레미야에게로
  - 예레미야한테
  lexicon: HALOT
  rationale: 전치사 אֶל은 단순한 방향 표지를 가지므로, 현대 문어체에서 가장 자연스럽고 간결한 여격 ‘-에게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르시기를
  - 이르시며
  lexicon: HALOT
  rationale: 히브리어의 인용 표지 לֵאמֹר은 한국어에서 중복적 ‘말씀하여’보다 바로 뒤의 직접화법을 여는 종결 동사로 처리하는 것이 자연스러워, 전체 문장을 매끈한 서술형으로 구성했습니다.
theological_decisions:
- issue: 예언 공식에서 יְהוָה의 표기
  chosen_reading: ‘야훼’로 직접 옮겨, 본문이 지닌 언약명 사용을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본 절은 예언 서두의 표준 공식으로, 히브리어의 신명자 יְהוָה를 대체 호칭으로 완화하지 않고 직접 음역하는 것이 원문이 드러내는 인격적이고 언약적인 호칭을 가장 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
