  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִצַּלְתִּ֖י/ךָ מִ/יַּ֣ד רָעִ֑ים וּ/פְדִתִ֖י/ךָ מִ/כַּ֥ף עָרִצִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/021.yaml
  text: And I will deliver you from the hand of evil men[c][b][a], and I will redeem you from the grasp of the ruthless.
  footnotes:
  - marker: a
    text: Or 'rescue you' for 'deliver you.'
    reason: lexical_alternative
  - marker: b
    text: Or 'ransom you' for 'redeem you.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the violent' for 'the ruthless.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 너를 악한 사람들의 손에서 건져 내며, 무자비한 자들의 손아귀에서 너를 속량하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘건져 내다’는 כאן의 נצל에 대한 번역상의 대안입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘속량하다’는 פדה의 대안으로 ‘구해 내다’보다 값 치름의 뉘앙스를 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: ‘무자비한 자들’은 עָרִצִים의 대안인 ‘폭력적인 자들/잔혹한 자들’과 같은 의미 범위를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצַּלְתִּיךָ
  english_pob_choice: And I will deliver you
  chosen_korean: 내가 너를 건져 내며
  alternatives_korean:
  - 내가 너를 구해 내며
  - 내가 너를 구원하며
  lexicon: HALOT
  rationale: נצל의 핵심 의미는 위험에서 건져 내는 것이며, 예언 문맥에서 자연스러운 합쇼체 표현으로 ‘건져 내다’를 택했습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: 손에서
  alternatives_korean:
  - 손아귀에서
  - 권세에서
  lexicon: HALOT
  rationale: ‘손’의 직역 이미지를 살리되 한국어에서는 ‘~의 손에서’가 위험한 통제 아래서의 구출을 자연스럽게 전달합니다.
- source_word: רָעִים
  english_pob_choice: evil men
  chosen_korean: 악한 사람들
  alternatives_korean:
  - 악인들
  - 악한 자들
  lexicon: HALOT
  rationale: 남성 복수의 인간 विरोध자를 가리키므로 ‘사람들’로 풀어 자연스럽게 옮기되, 도덕적 성격은 ‘악한’으로 보존했습니다.
- source_word: וּפְדִתִיךָ
  english_pob_choice: and I will redeem you
  chosen_korean: 너를 속량하겠습니다
  alternatives_korean:
  - 너를 구속하겠습니다
  - 너를 대속하겠습니다
  lexicon: HALOT
  rationale: פדה는 단순한 구출보다 값 치름의 뉘앙스를 지니므로, 구원·해방의 배경을 살리는 ‘속량하다’를 선택했습니다.
- source_word: מִכַּף
  english_pob_choice: from the grasp of
  chosen_korean: 손아귀에서
  alternatives_korean:
  - 손바닥에서
  - 손에서
  lexicon: HALOT
  rationale: כַּף의 문자적 이미지를 유지하면서도 적대적 지배를 더 강하게 드러내는 한국어 표현으로 ‘손아귀’가 적절합니다.
- source_word: עָרִצִים
  english_pob_choice: the ruthless
  chosen_korean: 무자비한 자들
  alternatives_korean:
  - 잔혹한 자들
  - 포악한 자들
  - 무서운 자들
  lexicon: HALOT
  rationale: עָרִיץ는 폭력적이고 압제적인 인물을 뜻하므로, 과도하게 정치화하지 않으면서도 성격을 분명히 하는 ‘무자비한 자들’을 택했습니다.
theological_decisions:
- issue: פדה의 구속/속량 어휘 선택
  chosen_reading: ‘속량하다’로 번역해 단순한 탈출이 아니라 값 치름이 포함된 구원 이미지를 보존했습니다.
  alternative_readings:
  - ‘구해 내다’로 완화할 수 있습니다.
  - ‘구속하다’로 옮길 수 있습니다.
  rationale: 본문은 야훼의 구원이 단순 보호를 넘어 해방과 회복의 행위임을 드러내므로, 그 신학적 밀도를 유지하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §2; OT redemption motif
- issue: 남성 복수 মানব 지시의 처리
  chosen_reading: ‘악한 사람들’과 ‘무자비한 자들’로 남성 복수의 인간 विरोध자를 가리키는 점을 살리되 한국어에서는 자연스럽게 풀었습니다.
  alternative_readings:
  - 중립적으로 ‘악한 이들’/‘무자비한 이들’로 옮길 수 있습니다.
  rationale: 히브리어 형태는 남성 복수를 유지하지만, 한국어에서는 성별 표시보다 인간 विरोध자의 성격 전달이 더 중요하므로 과도한 어색함 없이 반영했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
