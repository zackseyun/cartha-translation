  text: וּ/נְתַתִּ֣י/ם ל/זועה לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ בִּ֠/גְלַל מְנַשֶּׁ֤ה בֶן יְחִזְקִיָּ֨הוּ֙ מֶ֣לֶךְ יְהוּדָ֔ה עַ֥ל אֲשֶׁר עָשָׂ֖ה בִּ/ירוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/004.yaml
  text: And I will make them a horror to all the kingdoms of the earth[a], because of Manasseh son of Hezekiah, king of Judah, because of what he did in Jerusalem.
  footnotes:
  - marker: a
    text: Or 'an object of horror' or 'a terror.' The Hebrew noun conveys something that causes shuddering, dread, or horror.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들을 땅의 모든 나라들에게 공포가 되게 하겠으며[a], 이는 유다 왕 히스기야의 아들 므낫세 때문이고, 또 그가 예루살렘에서 행한 일 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '공포의 대상'이나 '두려움'으로도 옮길 수 있습니다. 히브리어 명사는 떨림, 공포, 전율을 일으키는 것을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּים
  english_pob_choice: And I will make them
  chosen_korean: 내가 그들을 ... 되게 하겠으며
  alternatives_korean:
  - 내가 그들을 주겠으며
  - 내가 그들을 넘겨주겠으며
  lexicon: HALOT
  rationale: נתן이 כאן에서는 단순한 '주다'보다 결과 상태를 만들어 내는 뜻이므로, 한국어에서는 '되게 하겠다'로 그 상태 변화를 살렸습니다.
- source_word: לְזַוֲעָה
  english_pob_choice: a horror
  chosen_korean: 공포
  alternatives_korean:
  - 전율의 대상
  - 두려움의 대상
  - 경악
  lexicon: HALOT
  rationale: 히브리어는 사람들에게 전율과 공포를 불러일으키는 '대상'을 가리키므로, 간결하면서도 강한 반응을 살리는 '공포'를 택했습니다.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  english_pob_choice: to all the kingdoms of the earth
  chosen_korean: 땅의 모든 나라들에게
  alternatives_korean:
  - 땅의 모든 왕국들에게
  - 세상의 모든 나라들에게
  lexicon: HALOT
  rationale: 관찰자 범위를 드러내는 방향성을 살리되, 현대 한국어에서 자연스러운 복수 표현으로 옮겼습니다.
- source_word: עַל אֲשֶׁר עָשָׂה
  english_pob_choice: for what he did
  chosen_korean: 그가 예루살렘에서 행한 일 때문입니다
  alternatives_korean:
  - 그가 한 일 때문입니다
  - 그가 예루살렘에서 저지른 일 때문입니다
  lexicon: HALOT
  rationale: 행위의 원인을 분명히 하면서도, '행하다'의 직접성을 유지해 본문의 책임 귀속을 약화시키지 않았습니다.
theological_decisions:
- issue: 므낫세의 죄와 유다에 대한 공동체적 심판의 인과관계
  chosen_reading: 원문의 명시적 인과를 그대로 유지했습니다.
  alternative_readings:
  - 단순한 역사적 배경으로 완화해서 읽기
  - 므낫세 개인의 책임만 강조하고 유다의 심판 연결은 약화하기
  rationale: 본문은 유다의 장차 올 수치를 므낫세와 그의 예루살렘 행위 '때문'이라고 직접 말하므로, 이 긴장을 해소하지 않고 보존하는 것이 사본의 의미에 충실합니다.
  doctrine_reference: 공동체적 심판의 긴장을 보존
