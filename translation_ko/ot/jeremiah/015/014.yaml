  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַֽעֲבַרְתִּי֙ אֶת אֹ֣יְבֶ֔י/ךָ בְּ/אֶ֖רֶץ לֹ֣א יָדָ֑עְתָּ כִּֽי אֵ֛שׁ קָדְחָ֥ה בְ/אַפִּ֖/י עֲלֵי/כֶ֥ם תּוּקָֽד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/014.yaml
  text: And I will make your enemies pass into a land you have not known[a], for a fire has been kindled in my anger; it will burn against you.
  footnotes:
  - marker: a
    text: Or, following some ancient versions and the parallel in Jeremiah 17:4, 'And I will make you serve your enemies in a land you have not known.' The Hebrew consonantal text here reads 'your enemies,' but a different vocalization or Vorlage may underlie the alternate reading.
    reason: textual_variant
translation:
  language: ko
  text: 내가 너의 원수들을 네가 알지 못한 땅으로 넘기리라[a]. 이는 내 분노에 불이 붙었기 때문이니, 그 불이 너희를 향해 타오를 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 고대 역본들과 예레미야 17:4의 평행구를 따르면 ‘네가 네 원수들을 알지 못한 땅에서 섬기게 하리라’로 읽을 수 있습니다. 여기의 히브리 자음본문은 ‘너의 원수들’을 가리키지만, 다른 모음화나 저본이 대안 독법의 배경일 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וְהַעֲבַרְתִּי
  english_pob_choice: I will make ... pass / pass into
  chosen_korean: 넘기리라
  alternatives_korean:
  - 보내리라
  - 건너가게 하리라
  - 넘기게 하리라
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도, 대상이 사람(원수들)이고 목적지가 땅이므로 한국어에서는 ‘넘기다’가 가장 자연스럽게 이동·이송의 힘을 드러냅니다.
- source_word: אֹיְבֶיךָ
  english_pob_choice: your enemies
  chosen_korean: 너의 원수들
  alternatives_korean:
  - 네 원수들
  - 너의 적들
  - 원수들
  lexicon: HALOT
  rationale: 직접적인 소유격과 복수 의미를 보존하기 위해 ‘너의 원수들’로 옮겼습니다.
- source_word: בְּאֶרֶץ לֹא יָדָעְתָּ
  english_pob_choice: into a land you have not known
  chosen_korean: 네가 알지 못한 땅으로
  alternatives_korean:
  - 네가 알지 못하는 땅으로
  - 네가 전에 알지 못했던 땅으로
  - 네가 알지 못한 나라로
  lexicon: HALOT
  rationale: 동작 동사와 결합된 ב를 한국어의 방향격 ‘-으로’로 풀었고, יָדַע의 경험적 완료를 ‘알지 못한’으로 자연스럽게 반영했습니다.
- source_word: בְאַפִּי
  english_pob_choice: in my anger
  chosen_korean: 내 분노에
  alternatives_korean:
  - 내 진노에
  - 내 노에
  - 내 격노에
  lexicon: HALOT
  rationale: אַף의 관용적 의미인 ‘분노/진노’를 살리되, 현대 한국어에서 과도하게 교회화된 어휘보다 직설적인 ‘분노’를 택했습니다.
- source_word: תּוּקָד
  english_pob_choice: it will burn
  chosen_korean: 타오를 것이다
  alternatives_korean:
  - 탈 것이다
  - 불타게 될 것이다
  - 활활 탈 것이다
  lexicon: HALOT
  rationale: 앞절의 ‘불이 붙음’과 연결되는 지속적·강한 연소 이미지를 살리기 위해 ‘타오르다’를 사용했습니다.
theological_decisions:
- issue: 경고의 대상을 가리키는 2인칭과 원수들의 이동을 어떻게 유지할지
  chosen_reading: 첫 절은 ‘너의 원수들’로 두어 대상의 소유격을 살리고, 끝절의 복수 2인칭은 ‘너희’를 유지해 개인/공동체 지시의 긴장을 보존했습니다.
  alternative_readings:
  - 전부 단수로 정리하기
  - 전부 복수로 정리하기
  rationale: 히브리어는 단수 소유격과 복수 목적어/대상을 혼용하므로, 이를 매끈하게 평준화하기보다 본문이 가진 긴장을 그대로 드러내는 편이 source-grounded합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
