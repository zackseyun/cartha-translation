  source_fidelity: 첫 절의 ‘넘기리라’는 한국어에서 흔히 ‘인도하다/넘겨주다’로 이해되어, 히브리어 הִפְעִיל עָבַר의 이동 사역 의미를 충분히 드러내지 못합니다. ‘가게 하겠다’는 원문의 사역성과 목적지 구문을 자연스럽게 보존합니다. 후반부는 불과 분노의 관계를 보다 직접적으로 표현하도록 다듬었습니다.
  naturalness: ‘네가 알지 못한 땅으로 가게 하겠다’는 현대 표준어로 자연스럽고, 단수 ‘네’와 마지막 복수 ‘너희’를 유지하여 원문의 수 변화도 드러냅니다. ‘내 분노 속에서 불이 붙었으니’는 기존의 ‘내 분노에 불이 붙었기 때문이니’보다 한국어 문맥상 명료합니다.
  terminology: ‘원수들’, ‘분노’, ‘불’은 원문의 어휘와 심판 이미지를 무리 없이 반영합니다. 각주에서는 ‘일부 고대 역본’이라고 하여 영어 감사 기록의 some ancient versions를 정확히 반영하고, 대안 독법의 주어와 목적어 관계를 명료하게 유지했습니다.
