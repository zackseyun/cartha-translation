id: JER.15.7
reference: Jeremiah 15:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וָ/אֶזְרֵ֥/ם בְּ/מִזְרֶ֖ה בְּ/שַׁעֲרֵ֣י הָ/אָ֑רֶץ שִׁכַּ֤לְתִּי אִבַּ֨דְתִּי֙ אֶת עַמִּ֔/י מִ/דַּרְכֵי/הֶ֖ם לוֹא שָֽׁבוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/007.yaml
  text: I winnowed them with a winnowing fork at the gates of the land[a]; I bereaved, I destroyed my people[b]; they did not turn back from their ways.
  footnotes:
  - marker: a
    text: Or 'they did not repent of their ways.' The Hebrew says 'turn back/return,' which can carry the sense of repentance in prophetic contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the gates of the earth.' The Hebrew word can mean either 'land' or 'earth'; here 'land' fits the immediate context of judgment on Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 키질 도구로 땅의 성문들에서 그들을 키질하였습니다[a]. 내가 내 백성을 자식 잃게 하였고 멸망시켰습니다[b]. 그들은 자기들의 길에서 돌이키지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라의 성문들에서’. 히브리어 ‘땅’은 ‘나라’ 또는 ‘땅’을 뜻할 수 있습니다. 여기서는 유다에 대한 심판의 문맥상 ‘땅’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 자식 잃게 하였고, 멸망시켰습니다.’ 첫 동사는 자녀를 잃게 하거나 사별하게 하는 것을 뜻합니다.
    reason: lexical_clarification
lexical_decisions:
- source_word: וָאֶזְרֵם
  english_pob_choice: I winnowed them
  chosen_korean: 내가 타작하는 도구로 그들을 … 키질하였고
  alternatives_korean:
  - 내가 그들을 흩었고
  - 내가 그들을 체질하였고
  lexicon: HALOT
  rationale: זרה의 농업적 이미지를 살려 ‘키질하다’로 옮기되, 한국어에서 더 자연스러운 동작 표현을 위해 도구와 함께 제시했습니다.
- source_word: בְּמִזְרֶה
  english_pob_choice: with a winnowing fork
  chosen_korean: 타작하는 도구로
  alternatives_korean:
  - 키질하는 갈퀴로
  - 바람질하는 도구로
  lexicon: HALOT
  rationale: מִזְרֶה는 까부르는/키질하는 도구를 가리키므로, 현대 한국어에서 이해 가능한 일반 표현을 택했습니다.
- source_word: בְּשַׁעֲרֵי הָאָרֶץ
  english_pob_choice: at the gates of the land
  chosen_korean: 땅의 성문들에서
  alternatives_korean:
  - 땅의 성문에서
  - 나라의 성문에서
  lexicon: HALOT
  rationale: הָאָרֶץ를 이 문맥의 심판 대상에 맞게 ‘땅’으로 옮기고, שַׁעֲרֵי는 장소를 나타내는 ‘~에서’로 자연스럽게 처리했습니다.
- source_word: שִׁכַּלְתִּי אִבַּדְתִּי
  english_pob_choice: I bereaved, I destroyed
  chosen_korean: 내가 내 백성을 잃게 하고 멸망시켰습니다
  alternatives_korean:
  - 내가 내 백성을 자식 잃게 하고 파멸시켰습니다
  - 내가 내 백성을 상실하게 하고 없애 버렸습니다
  lexicon: HALOT
  rationale: שׁכל의 ‘상실/자녀 잃음’과 אבד의 멸망 의미를 함께 살리되, 한국어에서 문맥상 가장 압축적으로 전달되는 심판 표현으로 정리했습니다.
- source_word: לֹא שָׁבוּ
  english_pob_choice: they did not turn back
  chosen_korean: 그들은 자기들의 길에서 돌이키지 않았습니다
  alternatives_korean:
  - 그들은 자기들의 길에서 돌아오지 않았습니다
  - 그들은 자기들의 길에서 회개하지 않았습니다
  lexicon: HALOT
  rationale: שׁוּב의 기본 의미인 ‘돌이키다/되돌아오다’를 유지하여, 회개의 함의를 열어 두되 본문이 가진 직접적 이미지를 보존했습니다.
theological_decisions:
- issue: שׁוּב의 회개 의미를 본문에 명시할지 여부
  chosen_reading: ‘돌이키지 않았습니다’로 유지했습니다.
  alternative_readings:
  - ‘회개하지 않았습니다’
  - ‘돌아오지 않았습니다’
  rationale: 예언서 문맥에서 회개의 의미가 가능하지만, 본문은 먼저 ‘길에서 돌아서는’ 이미지를 사용하므로 이를 직역에 가깝게 살려 신학적 함의를 과잉 확정하지 않았습니다.
  doctrine_reference: '번역 원칙: 해석을 본문보다 앞세우지 말고, 가능한 긴장을 보존합니다.'
