id: JER.15.17
reference: Jeremiah 15:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹֽא יָשַׁ֥בְתִּי בְ/סוֹד מְשַׂחֲקִ֖ים וָֽ/אֶעְלֹ֑ז מִ/פְּנֵ֤י יָֽדְ/ךָ֙ בָּדָ֣ד יָשַׁ֔בְתִּי כִּֽי זַ֖עַם מִלֵּאתָֽ/נִי־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/017.yaml
  text: I did not sit in the company of those who laugh[a], nor did I rejoice; because of your hand I sat alone[c][b], for you filled me with indignation.
  footnotes:
  - marker: a
    text: Or 'in the council of merrymakers' or 'in the circle of those who make merry.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'from before your hand'; the phrase likely means 'because of your hand' or 'under the pressure of your hand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'wrath' or 'anger' for 'indignation.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 웃는 자들의 모임에 앉지 않았고, 기뻐하지도 않았습니다. 주님의 손 때문에 나는 홀로 앉았습니다[a][b], 주님께서 저를 분노로 채우셨기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘웃는 자들의 모임’은 직역이며, 문맥상 ‘흥겨워하는 자들의 회중/무리’ 또는 ‘즐거워하는 자들의 모임’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘주님의 손 때문에’는 문자적으로는 ‘주님의 손 앞에서’이며, 문맥상 ‘주님의 손 아래서’ 또는 ‘주님의 손의 압력 때문에’라는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘분노’는 ‘진노’ 또는 ‘격노’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשַׁבְתִּי
  english_pob_choice: I did not sit / I sat
  chosen_korean: 앉지 않았고 … 앉았습니다
  alternatives_korean:
  - 거하지 않았고 … 거했습니다
  - 머물지 않았고 … 머물렀습니다
  - 살지 않았고 … 살았습니다
  lexicon: HALOT
  rationale: 히브리어 ישׁב의 기본 뜻인 ‘앉다/거하다/머물다’ 중, 시적 병행에서 구체적인 동작성을 살리기 위해 ‘앉다’를 택했습니다.
- source_word: בְּסוֹד מְשַׂחֲקִים
  english_pob_choice: in the company of those who laugh
  chosen_korean: 웃는 자들의 모임
  alternatives_korean:
  - 흥겨워하는 자들의 모임
  - 즐거워하는 자들의 모임
  - 조롱하는 자들의 모임
  lexicon: HALOT
  rationale: סוֹד는 친밀한 무리, 모임, 회합을 가리킬 수 있으므로, 여기서는 공식적 ‘회의’보다 사회적 ‘모임’으로 옮기고 מְשַׂחֲקִים은 문맥상 ‘웃는 자들’로 자연스럽게 반영했습니다.
- source_word: מִפְּנֵי יָדְךָ
  english_pob_choice: because of your hand
  chosen_korean: 주님의 손 때문에
  alternatives_korean:
  - 주님의 손 앞에서
  - 주님의 손 아래서
  - 주님의 손으로 인하여
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 손 앞에서’이지만, 예언문맥에서 ‘손’은 하나님의 압박과 작용을 가리키므로 원상을 살리되 한국어에서는 원인 관계가 분명한 ‘때문에’로 표현했습니다.
- source_word: זַעַם
  english_pob_choice: indignation
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 격노
  - 의분
  lexicon: HALOT
  rationale: זַעַם은 분노/진노를 가리키며 때로 하나님의 심판적 분노를 내포하므로, 본문의 강한 정서를 살리되 과도하게 해석을 좁히지 않는 ‘분노’를 택했습니다.
theological_decisions:
- issue: ‘주님의 손’의 의미
  chosen_reading: 하나님의 손을 보호가 아니라 예언자를 압박하고 움직이게 하는 신적 작용의 은유로 그대로 유지했습니다.
  alternative_readings:
  - 보호의 손
  - 단순한 임재
  rationale: 본문은 예레미야의 고립이 하나님의 부르심과 압박에서 비롯됨을 보여 주므로, 이미지를 풀어 쓰지 않고 ‘손’을 유지해 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
- issue: זַעַם의 강도
  chosen_reading: ‘분노’로 옮겨 심판적 뉘앙스를 열어 두었습니다.
  alternative_readings:
  - 진노
  - 의분
  rationale: 본문은 하나님이 예레미야를 그 분노로 채우셨다고 말하므로, 이를 지나치게 완곡하게 만들지 않으면서도 심리적·심판적 뉘앙스를 함께 남기기 위해 ‘분노’를 사용했습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
