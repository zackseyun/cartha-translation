id: JER.15.18
reference: Jeremiah 15:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֣/מָּה הָיָ֤ה כְאֵבִ/י֙ נֶ֔צַח וּ/מַכָּתִ֖/י אֲנוּשָׁ֑ה֙ מֵֽאֲנָה֙ הֵֽרָפֵ֔א הָי֨וֹ תִֽהְיֶ֥ה לִ/י֙ כְּמ֣וֹ אַכְזָ֔ב מַ֖יִם לֹ֥א נֶאֱמָֽנוּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/018.yaml
  text: Why has my pain become perpetual[a], and my wound incurable, refusing to be healed? Will you indeed be to me like a deceptive brook, like waters that are not reliable?
  footnotes:
  - marker: a
    text: Or 'like a failing brook'—the Hebrew image is of a streambed that promises water but proves unreliable.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 내 고통은 끝이 없고 내 상처는 고칠 수 없으며, 낫기를 거부합니까? 정말로 저에게 속이는 시내, 곧 믿을 수 없는 물과 같아지시렵니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘속이는 시내’는 물이 있을 듯하다가 실제로는 마르는 하천 바닥의 이미지를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְאֵבִי
  english_pob_choice: my pain
  chosen_korean: 내 고통
  alternatives_korean:
  - 내 아픔
  - 내 통증
  lexicon: HALOT
  rationale: כאב은 육체적 고통과 내적 고통을 아우를 수 있어, 현대 한국어에서 자연스럽고 폭넓은 ‘고통’으로 옮겼습니다.
- source_word: נֶצַח
  english_pob_choice: perpetual
  chosen_korean: 끝이 없고
  alternatives_korean:
  - 영원한
  - 끊이지 않는
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘영원’보다 계속되는 상태를 가리키므로, ‘끝이 없고’로 지속성을 살렸습니다.
- source_word: אֲנוּשָׁה / מֵאֲנָה הֵרָפֵא
  english_pob_choice: incurable / refusing to be healed
  chosen_korean: 고칠 수 없으며, 낫기를 거부합니다
  alternatives_korean:
  - 치료 불가능하며, 치유되기를 거부합니다
  - 낫지 않으며, 치료를 거부합니다
  lexicon: HALOT
  rationale: 상처를 의인화한 표현을 살려 ‘고칠 수 없으며’와 ‘낫기를 거부합니다’로 병행하여, 불치성과 치료 거부의 긴장을 함께 드러냈습니다.
- source_word: אַכְזָב
  english_pob_choice: deceptive brook
  chosen_korean: 속이는 시내
  alternatives_korean:
  - 속이는 개울
  - 믿을 수 없는 시내
  lexicon: HALOT
  rationale: אַכזב은 기대를 저버리는 마른 물줄기 이미지를 지니므로, ‘속이는 시내’로 물을 약속하나 배반하는 감각을 직설적으로 옮겼습니다.
- source_word: מַיִם לֹא נֶאֱמָנוּ
  english_pob_choice: waters that are not reliable
  chosen_korean: 믿을 수 없는 물
  alternatives_korean:
  - 신뢰할 수 없는 물
  - 의지할 수 없는 물
  lexicon: HALOT
  rationale: נֶאֱמָנוּ는 ‘신실하지 않은/믿을 수 없는’의 의미로, 시내 이미지의 핵심인 신뢰 불가를 간명하게 살렸습니다.
theological_decisions:
- issue: 예레미야의 하나님께 대한 직접적 항의와 수사적 질문의 강도
  chosen_reading: 질문을 완화하지 않고, 하나님께 직접 묻는 불평의 어조를 그대로 유지했습니다.
  alternative_readings:
  - 더 공손하고 완곡한 탄원형으로 완화하는 읽기
  - 하나님의 신뢰성을 암시하지 않도록 질문의 날을 약화하는 읽기
  rationale: 히브리어 본문은 관계적 긴장을 숨기지 않으며, 번역도 그 항의적 탄식을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3, Preserve theological tension rather than resolve it.
