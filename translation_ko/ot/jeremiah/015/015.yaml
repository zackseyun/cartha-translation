source:
  edition: WLC
  text: אַתָּ֧ה יָדַ֣עְתָּ יְהוָ֗ה זָכְרֵ֤/נִי וּ/פָקְדֵ֨/נִי֙ וְ/הִנָּ֤קֶם לִ/י֙ מֵ/רֹ֣דְפַ֔/י אַל לְ/אֶ֥רֶךְ אַפְּ/ךָ֖ תִּקָּחֵ֑/נִי דַּ֕ע שְׂאֵתִ֥/י עָלֶ֖י/ךָ חֶרְפָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/015.yaml
  text: You know[a], O Yahweh; remember me and attend to me, and take vengeance for me on my persecutors. In your patience do not take me away[d][c][b]; know that for your sake I bear reproach.
  footnotes:
  - marker: a
    text: Or 'visit me,' 'take note of me,' or 'care for me' for 'attend to me' (וּפָקְדֵנִי).
    reason: lexical_alternative
  - marker: b
    text: Or 'avenge me against my pursuers' for 'take vengeance for me on my persecutors.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'Do not take me in/for the length of your anger,' an idiom meaning 'in your patience/long-suffering do not take me away.'
    reason: lexical_alternative
  - marker: d
    text: Or 'know that I bear reproach on your account.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 주님께서는 아십니다. 저를 기억하시고 저를 살펴 주시며[a], 저를 핍박하는 자들에게[b] 저를 위하여 보복해 주십시오. 주님께서 오래 참으시는 동안[c] 저를 데려가지 마시고, 제가 주님 때문에 치욕을 당하고 있음을 알아 주십시오.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘살펴 주시며’(וּפָקְדֵנִי)는 ‘방문하시며’, ‘돌보시며’, 또는 ‘주의를 기울이시며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘핍박하는 자들’은 직역하면 ‘나를 추적하는 자들’이며, 문맥에서는 적대적으로 뒤쫓는 이들을 가리킵니다. 이 구절 전체는 ‘나를 위하여 나의 추적자들에게 보복해 주십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘주님의 노하기 더디심 가운데서’입니다. ‘노하기 더디심’은 오래 참으심을 뜻하는 히브리어 관용구입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘제가 주님으로 말미암아 치욕을 당하고 있음을 알아 주십시오’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  lexicon: HALOT
  rationale: 이 절의 기도문에서 직접 하나님께 드리는 호칭이므로 한국어 합쇼체의 자연스러운 기도체인 ‘주님’을 택했습니다. 본 프로젝트의 기본값인 ‘야훼’도 가능하지만, 직설적 기도문에서는 한국어 독자에게 더 자연스러운 호칭이 됩니다.
- source_word: וּפָקְדֵנִי
  english_pob_choice: attend to me
  chosen_korean: 저를 살피시며
  alternatives_korean:
  - 저를 방문하시며
  - 저를 돌보시며
  - 저를 기억하여 주시며
  lexicon: HALOT
  rationale: פָּקַד은 ‘방문하다/살피다/돌보다/돌아보다’까지 넓은 의미가 있어 단순한 인지보다 개입을 요청하는 맥락입니다. ‘살피시며’는 이 능동적 관심과 개입성을 비교적 간결하게 살립니다.
- source_word: וְהִנָּקֶם לִי מֵרֹדְפַי
  english_pob_choice: take vengeance for me on my persecutors
  chosen_korean: 저를 핍박하는 이들에게 제 원수를 갚아 주십시오
  alternatives_korean:
  - 저를 핍박하는 이들에게 보복해 주십시오
  - 저를 핍박하는 자들에게 제 억울함을 풀어 주십시오
  lexicon: HALOT
  rationale: נקם의 사법적·응보적 힘을 살려 ‘원수를 갚다’로 옮겼습니다. ‘핍박하는 이들’은 רֹדְפַי의 단순한 추적보다 적대적 박해의 뉘앙스를 더 정확히 전달합니다.
- source_word: אַל לְאֶרֶךְ אַפְּךָ תִּקָּחֵנִי
  english_pob_choice: In your patience do not take me away
  chosen_korean: 주님의 오래 참으심 안에서 저를 거두어 가지 마시고
  alternatives_korean:
  - 주님의 오래 참으심 때문에 저를 거두어 가지 마시고
  - 주님의 더딘 분노 중에 저를 데려가지 마시고
  lexicon: HALOT
  rationale: אֶרֶךְ אַף는 ‘노하기를 더딤/오래 참음’이라는 관용구이므로 이를 풀어 ‘오래 참으심’으로 옮겼습니다. תִּקָּחֵנִי는 여기서 생명을 거두어 가는 뉘앙스를 자연스럽게 담아 ‘거두어 가지 마시고’로 처리했습니다.
theological_decisions:
- issue: 하나님께 드리는 응보 요청의 표현 강도
  chosen_reading: ‘제 원수를 갚아 주십시오’로 옮겨, 문맥의 정의/응보 요청을 희석하지 않았습니다.
  alternative_readings:
  - 저를 변호해 주십시오
  - 저를 옹호해 주십시오
  rationale: 히브리어 נקם은 실제적인 응보와 변호를 함께 함축할 수 있지만, 본문은 적대자들에 대한 하나님의 न्याय 행위를 정면으로 요청합니다. 한국어도 그 긴장을 유지하는 쪽이 본문에 더 충실합니다.
  doctrine_reference: 본문의 응보 언어를 완화하지 않고 유지
- issue: ‘주님의 오래 참으심 안에서’의 문법 처리
  chosen_reading: 시간/상태를 나타내는 관용구로 처리하여, 주님의 인내가 지연된 심판의 배경이라는 점을 반영했습니다.
  alternative_readings:
  - 주님의 느린 진노 때문에
  - 주님의 오래 참으심으로 인하여
  rationale: 히브리어는 직역하면 다소 낯설지만, 고통 속 탄원의 어조를 해치지 않으면서도 신학적 긴장—하나님의 인내와 선지자의 절박함—을 함께 살려야 합니다.
  doctrine_reference: 하나님의 오래 참으심과 탄원의 긴장 유지
