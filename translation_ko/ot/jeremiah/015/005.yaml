base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/005.yaml
  text: For who will have compassion on you[a], Jerusalem? And who will mourn for you? And who will turn aside to ask about your welfare?
  footnotes:
  - marker: a
    text: Or 'who will pity you ... who will show sympathy for you ... who will stop to ask about your well-being?'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 예루살렘아, 누가 너를 불쌍히 여기겠습니까? 누가 너를 위하여 애통해하겠습니까? 누가 네 안부를 물으려고 들르겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 너를 긍휼히 여기겠습니까 … 누가 너의 안녕을 물으려고 길을 돌리겠습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 왜냐하면
  alternatives_korean:
  - 이는
  - 곧
  lexicon: HALOT
  rationale: 이 절은 앞선 심판 선언의 이유를 설명하므로, 한국어에서는 인과를 분명히 드러내는 연결어가 적절합니다.
- source_word: יַחְמֹל
  english_pob_choice: will have compassion
  chosen_korean: 긍휼을 베풀겠습니까
  alternatives_korean:
