  source_fidelity: The threefold rhetorical interrogation is retained, and the draft generally conveys compassion, sympathetic mourning, and inquiry concerning Jerusalem's well-being. However, "돌이켜 가서" can mean returning or going back, whereas יָסוּר depicts turning aside from one's course in order to inquire. "들르다" expresses this purpose more idiomatically and accurately.
  naturalness: '"왜냐하면" is somewhat conversational and heavy at the opening of this prophetic rhetorical question. "이는" is a more natural formal connective in this setting. Addressing the personified city as "너" is idiomatic Korean biblical style; the interrogative endings remain modern formal-polite 합쇼체.'
  terminology: '"불쌍히 여기다" is a clear, natural rendering of חמל here. "애통해하다" communicates the sympathetic lament of נוד without reducing it to a literal head gesture. "안부를 묻다" naturally renders the idiom of asking after someone''s שָׁלוֹם, understood as well-being rather than merely peace.'
  issues:
  - severity: medium
    issue: '"돌이켜 가서" for יָסוּר'
    rationale: This wording can imply going back/returning rather than interrupting one's course or stopping by. The Hebrew construction presents someone turning aside in order to ask after Jerusalem's welfare.
  - severity: low
    issue: Opening connective "왜냐하면"
    rationale: Though causally defensible, it is more conversational than the formal prophetic register. "이는" preserves the explanatory force with smoother Korean style.
