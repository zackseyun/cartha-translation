  lexicon: HALOT
  rationale: חמל의 핵심 의미인 연민/긍휼을 살리되, 심판 맥락에서 자연스러운 물음형으로 옮겼습니다.
- source_word: יָנוּד
  english_pob_choice: will mourn
  chosen_korean: 애통하겠습니까
  alternatives_korean:
  - 슬퍼하겠습니까
  - 동정하겠습니까
  - 머리를 흔들겠습니까
  lexicon: HALOT
  rationale: 문맥상 ירושלים의 황폐함 앞에서 보이는 애도·동조의 의미이므로, 보다 직접적인 ‘애통하다’로 옮겼습니다.
- source_word: לְשָׁלוֹם
  english_pob_choice: about your welfare
  chosen_korean: 당신의 평안을
  alternatives_korean:
  - 당신의 평강을
  - 당신의 복을
  lexicon: HALOT
  rationale: שָׁלוֹם의 이 문맥상 의미는 단순한 ‘평화’보다 안녕·복지에 가까우나, 한국어에서는 ‘평안’을 써서 관용적 질문 표현을 살렸습니다.
theological_decisions:
- issue: 예루살렘에 대한 삼중 반문의 수사적 강도
  chosen_reading: 직역보다 수사적 절박함이 드러나도록 세 번의 질문을 연속된 의문문으로 유지했습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘아무도 긍휼을 베풀지 않을 것이다’처럼 옮김
  - 한 문장으로 압축해 반복을 약화함
  rationale: 히브리어의 반복된 מִי는 예루살렘의 버림받음과 고립을 강조하므로, 한국어에서도 반복 구조를 보존하는 것이 의미를 더 잘 전달합니다.
  doctrine_reference: 예레미야의 심판 신탁과 언약적 고립의 강조
