translation:
  language: ko
  text: 왜냐하면 누가 당신에게 긍휼을 베풀겠습니까, 예루살렘아? 누가 당신을 위해 애통하겠습니까? 누가 돌이켜 가서 당신의 평안을 묻겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
