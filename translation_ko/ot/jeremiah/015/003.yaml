base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/003.yaml
  text: 'And I will appoint over them four kinds[a], declares Yahweh: the sword to kill, the dogs to drag away[b], and the birds of the heavens and the beasts of the earth to devour and destroy.'
  footnotes:
  - marker: a
    text: Hebrew 'four families/clans'; here the word is used figuratively for four categories of agents of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'the birds of the sky.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들 위에 네 부류를 임명하겠습니다. 야훼의 말씀입니다. 칼은 죽이기 위한 것이고, 개들은 끌어가게 할 것이며, 하늘의 새들과 땅의 짐승들은 먹고 멸하게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפָּחוֹת는 기본적으로 ‘가족/씨족’이지만, 여기서는 네 가지 심판의 매개를 가리키는 비유적 범주로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עֲלֵיהֶם
  english_pob_choice: I will appoint over them
  chosen_korean: 내가 그들 위에 … 임명하겠습니다
  alternatives_korean:
  - 내가 그들 위에 … 정하겠습니다
  - 내가 그들 위에 … 배치하겠습니다
  - 내가 그들 위에 … 벌을 내리겠습니다
  lexicon: HALOT
  rationale: פקד는 ‘돌보다/방문하다’부터 ‘임명하다/소집하다’, ‘벌하다’까지 넓은 의미를 가지므로, כאן의 통치적·배정적 뉘앙스를 살려 ‘임명하다’로 옮겼습니다.
- source_word: אַרְבַּע מִשְׁפָּחוֹת
  english_pob_choice: four kinds
  chosen_korean: 네 부류
  alternatives_korean:
  - 네 가족
  - 네 씨족
  - 네 종류
  lexicon: HALOT
  rationale: מִשְׁפָּחוֹת의 기본뜻은 ‘가족/씨족’이지만, 문맥상 심판의 매개들로 네 범주를 가리키므로 비유적 분류를 드러내는 ‘부류’를 택했습니다.
- source_word: הַחֶרֶב לַהֲרֹג
  english_pob_choice: the sword to kill
  chosen_korean: 칼은 죽이기 위한 것이고
  alternatives_korean:
  - 칼은 죽이도록 하고
  - 칼은 죽일 것이고
  - 칼은 죽이게 할 것이고
  lexicon: HALOT
  rationale: לַהֲרֹג은 목적의 부정사이므로 기능을 분명히 하기 위해 ‘죽이기 위한’으로 풀었습니다. ‘칼’은 현대 한국어에서 자연스럽고 직접적인 무기 표현입니다.
- source_word: הַכְּלָבִים לִסְחֹב
  english_pob_choice: the dogs to drag away
  chosen_korean: 개들은 끌어가게 할 것이며
  alternatives_korean:
  - 개들은 끌고 가게 할 것이며
  - 개들은 끌어가도록 할 것이며
  - 개들은 끌어가게 하겠습니다
  lexicon: HALOT
  rationale: סחב은 ‘끌다, 끌어가다, 운반하다’의 뜻이므로 시체를 사후에 처리하는 이미지에 맞게 ‘끌어가다’로 옮겼습니다. 동사의 강한 행위성을 살리기 위해 주어-목적어 구조를 유지했습니다.
- source_word: עוֹף הַשָּׁמַיִם וְאֶת בֶּהֱמַת הָאָרֶץ
  english_pob_choice: the birds of the heavens and the beasts of the earth
  chosen_korean: 하늘의 새들과 땅의 짐승들
  alternatives_korean:
  - 하늘의 새들과 땅의 동물들
  - 하늘의 새와 땅의 짐승들
  - 하늘의 새들과 땅의 들짐승들
  lexicon: HALOT
  rationale: ל하늘/땅의 병렬 구조를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘새들’과 ‘짐승들’로 옮겼습니다. 심판 문맥의 포식자·사체처리자 이미지를 과도하게 설명하지 않고 유지합니다.
theological_decisions:
- issue: 예언 공식 נְאֻם יְהוָה의 한국어 처리와 신명기명 표기
  chosen_reading: ‘야훼의 말씀입니다’로 옮겨 예언 공식의 권위를 살리고, יְהוָה는 야훼로 표기했습니다.
  alternative_readings:
  - ‘주님의 말씀입니다’
  - ‘여호와의 말씀입니다’
  - ‘야훼의 선포입니다’
  rationale: 본문은 직접 신명기명을 사용하므로 이를 제목적 칭호로 대체하지 않고 고유명으로 드러냈습니다. 예언체의 종결 공식은 현대 문어체에서 가장 자연스럽게 ‘말씀입니다’로 처리했습니다.
