id: JER.15.9
reference: Jeremiah 15:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֻמְלְלָ֞ה יֹלֶ֣דֶת הַ/שִּׁבְעָ֗ה נָפְחָ֥ה נַפְשָׁ֛/הּ באה שִׁמְשָׁ֛/הּ בְּ/עֹ֥ד יוֹמָ֖ם בּ֣וֹשָׁה וְ/חָפֵ֑רָה וּ/שְׁאֵֽרִיתָ֗/ם לַ/חֶ֧רֶב אֶתֵּ֛ן לִ/פְנֵ֥י אֹיְבֵי/הֶ֖ם נְאֻם יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/009.yaml
  text: She who bore seven has withered away[a]; she has breathed out her life. Her sun has gone down while it was still day. She is ashamed and humiliated. And the remnant of them I will give to the sword before their enemies[c][b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the mother of seven.' The Hebrew idiom evokes a woman once considered fully fruitful and blessed.
    reason: lexical_alternative
  - marker: b
    text: Literally 'has breathed out her soul/life.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'her sun has gone down while it was still day,' a poetic image of a premature end.
    reason: cultural_note
translation:
  language: ko
  text: 일곱을 낳은 여인이 쇠약해졌습니다[a]. 그녀는 숨을 내쉬었습니다[b]. 그녀의 해가 아직 대낮에 졌습니다[c]. 그녀는 부끄러워하고 수치를 당했습니다. 그리고 그들의 남은 자를 나는 그들의 원수들 앞에서 칼에 넘기겠습니다. 야훼의 말씀이니라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '일곱 자녀의 어머니'. 이 히브리어 관용구는 한때 매우 풍성하고 복된 여인을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 '그녀의 혼/생명을 내쉬었습니다'입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 '아직 낮이었는데 그녀의 해가 졌다'로, 때 이른 종말을 그린 시적 이미지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֻמְלְלָה
  english_pob_choice: has withered away
  chosen_korean: 쇠약해졌습니다
  alternatives_korean:
  - 시들어 버렸습니다
  - 기운이 빠져 버렸습니다
  lexicon: HALOT
  rationale: 문맥상 애가에서 쓰인 쇠잔·소진의 이미지를 살리면서도 한국어로 자연스럽게 읽히는 표현을 택했습니다.
- source_word: יֹלֶדֶת הַשִּׁבְעָה
  english_pob_choice: she who bore seven
  chosen_korean: 일곱을 낳은 여인
  alternatives_korean:
  - 일곱을 낳은 자
  - 일곱 자녀를 낳은 여인
  lexicon: HALOT
  rationale: 히브리어 관용구의 축복받은 다산 이미지를 보존하되, 한국어에서 가장 직접적이고 간결하게 전달했습니다.
- source_word: נָפְחָה נַפְשָׁהּ
  english_pob_choice: has breathed out her life
  chosen_korean: 숨을 내쉬었습니다
  alternatives_korean:
  - 생명을 내쉬었습니다
  - 혼을 내쉬었습니다
  lexicon: HALOT
  rationale: 영혼보다 생명/숨의 이탈이라는 구체적 이미지를 살려, POB의 'breathed out her life'와 같은 방향으로 옮겼습니다.
- source_word: בָּאָה שִׁמְשָׁהּ בְּעוֹד יוֹמָם
  english_pob_choice: Her sun has gone down while it was still day
  chosen_korean: 그녀의 해가 아직 대낮에 졌습니다
  alternatives_korean:
  - 그녀의 해가 아직 낮인데 졌습니다
  - 그녀의 해가 한낮에 저물었습니다
  lexicon: HALOT
  rationale: 시적 은유를 직역에 가깝게 유지하면서도 현대 한국어 어순에 맞게 다듬었습니다.
- source_word: בּוֹשָׁה וְחָפֵרָה
  english_pob_choice: is ashamed and humiliated
  chosen_korean: 부끄러워하고 수치를 당했습니다
  alternatives_korean:
  - 부끄러워하고 굴욕을 당했습니다
  - 부끄러워하며 치욕을 입었습니다
  lexicon: HALOT
  rationale: 두 동사의 점층적 수치 이미지를 분리해 살리면서, 현대 한국어의 자연스러운 표현으로 옮겼습니다.
- source_word: וּשְׁאֵרִיתָם לַחֶרֶב אֶתֵּן לִפְנֵי אֹיְבֵיהֶם
  english_pob_choice: And the remnant of them I will give to the sword before their enemies
  chosen_korean: 그리고 그들의 남은 자를 나는 그들의 원수들 앞에서 칼에 넘기겠습니다
  alternatives_korean:
  - 그리고 그들의 남은 자를 나는 원수들 앞에서 칼에 주겠습니다
  - 그리고 그들의 남은 자를 나는 원수들 앞에 칼로 넘기겠습니다
  lexicon: HALOT
  rationale: '''give to the sword''의 심판 공식과 ''before their enemies''의 노출된 처지를 함께 보존했습니다.'
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 본문의 예언자적 종결 공식을 한국어 성경 문체로 옮기되, POB의 고유명 처리에 맞춰 야훼를 유지했습니다.
theological_decisions:
- issue: יְהוָה의 음역
  chosen_reading: 본문의 언약적 신명은 '야훼'로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: PB OBE audit trail이 Yahweh를 택하고 있으므로, 원문 신명과의 가시적 대응을 살려 한국어 본문에도 반영했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
