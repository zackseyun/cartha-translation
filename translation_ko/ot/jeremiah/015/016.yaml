  yaml_path: translation/ot/jeremiah/015/016.yaml
  text: Your words were found[a], and I ate them, and your words became for me a joy and the delight of my heart, for your name is called over me, O Yahweh, God of hosts.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “I am called by your name.”
    reason: lexical_alternative
translation:
  language: ko
  text: 주님의 말씀이 발견되었고, 제가 그것을 먹었더니, 주님의 말씀은 제게 기쁨이 되고 제 마음의 즐거움이 되었습니다. 이는 주님의 이름이 제 위에 일컬어졌기 때문입니다.[a] 야훼, 만군의 하나님이시여.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 자연스럽게, ‘제가 주님의 이름으로 불렸기 때문입니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְצְאוּ דְבָרֶיךָ
  english_pob_choice: Your words were found
  chosen_korean: 주님의 말씀을 발견하여
  alternatives_korean:
  - 주님의 말씀들이 발견되어
  - 주님의 말씀을 찾게 되어
  lexicon: HALOT
  rationale: נִמְצְאוּ는 ‘발견되다/찾아지다’의 수동·반수동 뉘앙스를 가지므로, 주어가 말씀을 ‘발견하다’는 서술로 옮겨 원문의 사건성을 살렸습니다.
- source_word: וָאֹכְלֵם
  english_pob_choice: and I ate them
  chosen_korean: 제가 그것을 먹었더니
  alternatives_korean:
  - 제가 그것들을 먹었더니
  - 제가 삼켰더니
  lexicon: HALOT
  rationale: 말씀을 먹는 은유를 그대로 보존하되, 한국어에서는 목적어를 자연스럽게 단수 지시어 ‘그것’으로 받아 전체를 포괄하게 했습니다.
- source_word: וַיְהִי ... לְשָׂשׂוֹן וּלְשִׂמְחַת לְבָבִי
  english_pob_choice: and your words became for me a joy and the delight of my heart
  chosen_korean: 주님의 말씀은 제게 기쁨이 되고 제 마음의 즐거움이 되었습니다
  alternatives_korean:
  - 제 마음의 기쁨이 되었습니다
  - 제 마음의 즐거움이 되었습니다
  lexicon: HALOT
  rationale: שָׂשׂוֹן과 שִׂמְחָה의 감정 중첩을 한국어의 ‘기쁨’과 ‘즐거움’으로 나누어, 반복을 피하면서도 감정의 강도를 유지했습니다.
- source_word: נִקְרָא שִׁמְךָ עָלַי
  english_pob_choice: your name is called over me
  chosen_korean: 주님의 이름이 제 위에 불리고 있기 때문입니다
  alternatives_korean:
  - 제가 주님의 이름으로 불리고 있기 때문입니다
  - 주님의 이름이 제게 불렸기 때문입니다
  lexicon: HALOT
  rationale: ‘이름이 … 위에 불리다’는 히브리어 관용구를 직역해 소속·귀속의 의미를 보존했습니다. 한국어 관용 표현인 ‘이름으로 불리다’는 각주로 보완할 수 있습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת
  english_pob_choice: O Yahweh, God of hosts
  chosen_korean: 오 야훼, 만군의 하나님이시여
  alternatives_korean:
  - 오 야훼, 군대의 하나님이시여
  - 오 야훼, 하늘 군대의 하나님이시여
  lexicon: HALOT
  rationale: יהוה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, צְבָאוֹת는 전통적이면서도 의미 폭이 넓은 ‘만군’으로 유지했습니다.
theological_decisions:
- issue: 언약적 소속을 나타내는 ‘이름이 … 위에 불리다’ 관용구의 처리
  chosen_reading: 주님의 이름이 제 위에 불리고 있기 때문입니다
  alternative_readings:
  - 제가 주님의 이름으로 불리고 있기 때문입니다
  rationale: 본문은 예레미야가 야훼께 속했음을 드러내는 언약적 표현이므로, 직역을 본문에 두고 자연스러운 한국어 해석은 각주나 대안으로 남겨 의미의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
