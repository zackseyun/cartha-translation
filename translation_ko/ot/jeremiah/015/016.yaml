  naturalness: ‘주님의 말씀이 발견되었고’는 다소 문어적이지만 원문의 수동성을 자연스럽게 유지하는 안전한 표현입니다. ‘제 위에 일컬어졌기’는 현대 구어로는 낯설 수 있으나, 원문의 공간적·언약적 관용구를 보존하는 격조 있는 성서 한국어입니다. 자연스러운 관용적 뜻은 각주에 제시했습니다.
