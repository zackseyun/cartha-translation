id: JER.15.13
reference: Jeremiah 15:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֵילְ/ךָ֧ וְ/אוֹצְרוֹתֶ֛י/ךָ לָ/בַ֥ז אֶתֵּ֖ן לֹ֣א בִ/מְחִ֑יר וּ/בְ/כָל חַטֹּאותֶ֖י/ךָ וּ/בְ/כָל גְּבוּלֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
  footnotes:
  - marker: a
    text: Or 'not for a price'—that is, without compensation or payment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in/with all your sins and in all your borders'; the translation renders the sense as causal and distributive in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 재산과 당신의 보물을 나는 약탈물로 넘기겠습니다. 값 없이, 당신의 모든 죄 때문에, 당신의 온 지역에 걸쳐서입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '값을 치르지 않고'입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '당신의 모든 죄와 당신의 모든 경계 안에'에 가깝지만, 문맥상 심판의 이유와 범위를 드러내도록 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  english_pob_choice: your wealth
  chosen_korean: 당신의 재산
  alternatives_korean:
  - 당신의 부
  - 당신의 재물
  - 당신의 재산과 군대
  lexicon: HALOT
  rationale: 문맥상 전쟁력보다 몰수될 경제적 자원이 중심이므로, '재산'이 POB의 'wealth'를 자연스럽게 반영합니다.
- source_word: וְאוֹצְרוֹתֶיךָ
  english_pob_choice: and your treasures
  chosen_korean: 당신의 보물
  alternatives_korean:
  - 당신의 저장물
  - 당신의 금고들
  - 당신의 창고들
  lexicon: HALOT
  rationale: '''오츠로트''는 저장된 귀중품을 가리키므로, 한국어에서는 ''보물''이 가장 간결하고 읽기 자연스럽습니다.'
- source_word: לָבַז אֶתֵּן
  english_pob_choice: I will give as plunder
  chosen_korean: 나는 약탈물로 넘기겠습니다
  alternatives_korean:
  - 나는 노략물로 주겠습니다
  - 나는 약탈물로 주겠습니다
  - 나는 노획물로 넘기겠습니다
  lexicon: HALOT
  rationale: '''주다''보다 ''넘기다''가 심판으로 인도하여 적의 손에 들어가게 하는 동작을 더 잘 드러내며, ''약탈물''이 לָבַז의 의미를 직접 반영합니다.'
- source_word: לֹא בִמְחִיר
  english_pob_choice: without price
  chosen_korean: 값 없이
  alternatives_korean:
  - 대가 없이
  - 값을 치르지 않고
  - 돈을 받지 않고
  lexicon: HALOT
  rationale: 히브리어의 직역인 'not for a price'를 짧고 분명하게 살리되, 한국어에서 자연스러운 무상성 표현으로 옮겼습니다.
- source_word: וּבְכָל חַטֹּאותֶיךָ
  english_pob_choice: because of all your sins
  chosen_korean: 당신의 모든 죄 때문에
  alternatives_korean:
  - 당신의 모든 죄로 인해
  - 당신의 모든 죄로 말미암아
  - 당신의 모든 죄와 함께
  lexicon: HALOT
  rationale: 전치사 ב의 심판 맥락상 인과 의미를 살려, 결과의 이유가 분명히 드러나도록 옮겼습니다.
- source_word: וּבְכָל גְּבוּלֶיךָ
  english_pob_choice: throughout all your territory
  chosen_korean: 당신의 온 지역에 걸쳐서입니다
  alternatives_korean:
  - 당신의 모든 경계 안에
  - 당신의 온 영토에 두루
  - 당신의 모든 국경 지역에
  lexicon: HALOT
  rationale: '''경계''의 문자성을 그대로 두기보다, 포로·약탈의 범위가 전역에 미친다는 뜻을 살려 ''온 지역에 걸쳐서''로 자연스럽게 번역했습니다.'
theological_decisions:
- issue: 마지막 구문의 ב 전치사 의미를 어떻게 드러낼지
  chosen_reading: 이 구절은 재산 몰수가 죄에 대한 심판이라는 인과를 분명히 드러냅니다.
  alternative_readings:
  - 더 문자적으로 '당신의 모든 죄와 당신의 모든 경계 안에'라고 옮길 수 있습니다.
  rationale: 예레미야의 심판 선언이라는 문맥에서, 인과적 의미를 드러내는 번역이 독자가 본문의 판단 논리를 즉시 이해하게 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
