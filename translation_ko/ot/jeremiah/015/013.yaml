base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/013.yaml
  text: Your wealth and your treasures I will give as plunder[a], without price, because of all your sins[b], throughout all your territory.
  footnotes:
  - marker: a
    text: Or 'not for a price'—that is, without compensation or payment.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in/with all your sins and in all your borders'; the translation renders the sense as causal and distributive in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 재산과 보물을 값도 받지 않고, 네 모든 죄 때문에 네 온 영토에 걸쳐 약탈물로 넘기겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘값을 받고가 아니라’입니다. 곧 대가나 보상 없이 넘긴다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘네 모든 죄와 네 모든 경계 안에서’에 가깝습니다. 여기서는 심판의 이유와 그 범위를 드러내어 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילְךָ
  english_pob_choice: your wealth
