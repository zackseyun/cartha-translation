  lexicon: HALOT
  rationale: '''오츠로트''는 저장된 귀중품을 가리키므로, 한국어에서는 ''보물''이 가장 간결하고 읽기 자연스럽습니다.'
- source_word: לָבַז אֶתֵּן
  english_pob_choice: I will give as plunder
  chosen_korean: 나는 약탈물로 넘기겠습니다
  alternatives_korean:
  - 나는 노략물로 주겠습니다
  - 나는 약탈물로 주겠습니다
  - 나는 노획물로 넘기겠습니다
  lexicon: HALOT
  rationale: '''주다''보다 ''넘기다''가 심판으로 인도하여 적의 손에 들어가게 하는 동작을 더 잘 드러내며, ''약탈물''이 לָבַז의 의미를 직접 반영합니다.'
- source_word: לֹא בִמְחִיר
  english_pob_choice: without price
  chosen_korean: 값 없이
  alternatives_korean:
  - 대가 없이
  - 값을 치르지 않고
  - 돈을 받지 않고
  lexicon: HALOT
  rationale: 히브리어의 직역인 'not for a price'를 짧고 분명하게 살리되, 한국어에서 자연스러운 무상성 표현으로 옮겼습니다.
- source_word: וּבְכָל חַטֹּאותֶיךָ
  english_pob_choice: because of all your sins
  chosen_korean: 당신의 모든 죄 때문에
  alternatives_korean:
  - 당신의 모든 죄로 인해
  - 당신의 모든 죄로 말미암아
  - 당신의 모든 죄와 함께
  lexicon: HALOT
  rationale: 전치사 ב의 심판 맥락상 인과 의미를 살려, 결과의 이유가 분명히 드러나도록 옮겼습니다.
- source_word: וּבְכָל גְּבוּלֶיךָ
  english_pob_choice: throughout all your territory
  chosen_korean: 당신의 온 지역에 걸쳐서입니다
  alternatives_korean:
  - 당신의 모든 경계 안에
  - 당신의 온 영토에 두루
  - 당신의 모든 국경 지역에
  lexicon: HALOT
  rationale: '''경계''의 문자성을 그대로 두기보다, 포로·약탈의 범위가 전역에 미친다는 뜻을 살려 ''온 지역에 걸쳐서''로 자연스럽게 번역했습니다.'
theological_decisions:
- issue: 마지막 구문의 ב 전치사 의미를 어떻게 드러낼지
  chosen_reading: 이 구절은 재산 몰수가 죄에 대한 심판이라는 인과를 분명히 드러냅니다.
  alternative_readings:
  - 더 문자적으로 '당신의 모든 죄와 당신의 모든 경계 안에'라고 옮길 수 있습니다.
  rationale: 예레미야의 심판 선언이라는 문맥에서, 인과적 의미를 드러내는 번역이 독자가 본문의 판단 논리를 즉시 이해하게 합니다.
  doctrine_reference: Translation philosophy §1, §3, §6
