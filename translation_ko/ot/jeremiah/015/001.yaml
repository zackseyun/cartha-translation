id: JER.15.1
reference: Jeremiah 15:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י אִם יַעֲמֹ֨ד מֹשֶׁ֤ה וּ/שְׁמוּאֵל֙ לְ/פָנַ֔/י אֵ֥ין נַפְשִׁ֖/י אֶל הָ/עָ֣ם הַ/זֶּ֑ה שַׁלַּ֥ח מֵֽ/עַל פָּנַ֖/י וְ/יֵצֵֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/001.yaml
  text: Then Yahweh said to me[a], “Even if Moses and Samuel were to stand before me, my soul would not be toward this people. Send them away from before me[b], and let them go out.”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “my heart would not be toward this people” or “I would have no regard for this people.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “from before me”; that is, “out of my presence.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼께서 내게 말씀하셨습니다. “비록 모세와 사무엘이 내 앞에 선다 해도, 내 마음[a]은 이 백성을 향하지 않을 것입니다. 내 앞에서 그들을 내보내십시오[b]. 그들이 떠나게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 영혼” 또는 “나 자신”입니다. 이 표현은 이 백성에 대한 야훼의 마음이나 태도를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 “내 앞에서”입니다. 곧 “내 임재에서 밖으로”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명(神名)을 대체 호칭이 아니라 고유명으로 드러내기 위해, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אִם יַעֲמֹד ... לְפָנַי
  english_pob_choice: Even if Moses and Samuel were to stand before me
  chosen_korean: 비록 모세와 사무엘이 내 앞에 서 있다 하더라도
  alternatives_korean:
  - 모세와 사무엘이 내 앞에 선다 해도
  - 모세와 사무엘이 내 앞에 서 있었더라도
  lexicon: HALOT
  rationale: 가정적·양보적 뉘앙스를 살리기 위해 ‘비록 ... 하더라도’로 옮겼고, ‘서 있다’는 표현으로 ‘stand before me’의 예배·중보적 이미지를 보존했습니다.
- source_word: אֵין נַפְשִׁי אֶל הָעָם הַזֶּה
  english_pob_choice: my soul would not be toward this people
  chosen_korean: 내 마음은 이 백성을 향하지 않을 것입니다
  alternatives_korean:
  - 내 영혼은 이 백성을 향하지 않을 것입니다
  - 나는 이 백성에게 마음을 두지 않을 것입니다
  - 내 마음이 이 백성을 좋게 여기지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘נֶפֶשׁ’는 직역하면 ‘영혼/생명/자기’이지만, 여기서는 태도와 향함을 말하는 관용구이므로 한국어에서는 의미를 지나치게 해치지 않는 범위에서 ‘내 마음’으로 자연스럽게 살렸습니다.
- source_word: מֵעַל פָּנַי
  english_pob_choice: away from before me
  chosen_korean: 내 앞에서 쫓아내어
  alternatives_korean:
  - 내 앞에서 떠나게 하여
  - 내 앞에서 내보내어
  - 내 앞에서 몰아내어
  lexicon: HALOT
  rationale: 히브리어의 직역 가능성은 있지만, 문맥상 심판적 배척을 분명히 하기 위해 ‘쫓아내어’로 옮겼습니다. POB의 주석이 가리키는 ‘out of my presence’의 뜻도 이 표현이 충분히 담습니다.
theological_decisions:
- issue: ‘나의 마음/영혼’에 담긴 야훼의 인격적 거절 표현
  chosen_reading: 직접적이고 인격적인 거절의 어조를 유지하여 ‘내 마음은 이 백성을 향하지 않을 것입니다’로 옮겼습니다.
  alternative_readings:
  - 나는 이 백성을 용납하지 않을 것입니다
  - 나는 이 백성을 긍휼히 여기지 않을 것입니다
  rationale: 본문은 하나님의 태도를 추상적으로 풀어 설명하기보다, 강한 인격적·수사적 표현으로 전합니다. 이를 완화하면 원문의 긴장과 경고성이 약해집니다.
  doctrine_reference: Translation philosophy §3
- issue: ‘내 앞에 서다’의 중보적 함의
  chosen_reading: ‘내 앞에 서 있다’는 표현을 본문에 유지해 중보의 뉘앙스를 독자가 문맥에서 읽게 했습니다.
  alternative_readings:
  - 내게 간구하다
  - 나를 위해 중재하다
  rationale: 모세와 사무엘은 대표적 중보자이지만, 히브리어는 명시적으로 ‘중보하다’가 아니라 ‘서다’라고 말합니다. 본문을 과도하게 해석해 풀어 쓰지 않기 위해 직역적 이미지를 보존했습니다.
  doctrine_reference: original-language primacy over translation tradition
