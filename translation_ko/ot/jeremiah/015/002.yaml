  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֛ה כִּֽי יֹאמְר֥וּ אֵלֶ֖י/ךָ אָ֣נָה נֵצֵ֑א וְ/אָמַרְתָּ֨ אֲלֵי/הֶ֜ם כֹּֽה אָמַ֣ר יְהוָ֗ה אֲשֶׁ֨ר לַ/מָּ֤וֶת לַ/מָּ֨וֶת֙ וַ/אֲשֶׁ֤ר לַ/חֶ֨רֶב֙ לַ/חֶ֔רֶב וַ/אֲשֶׁ֤ר לָֽ/רָעָב֙ לָֽ/רָעָ֔ב וַ/אֲשֶׁ֥ר לַ/שְּׁבִ֖י לַ/שֶּֽׁבִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/002.yaml
  text: 'And it shall be[a], when they say to you, ‘Where shall we go?’ then you shall say to them, ‘Thus says Yahweh: Those for death, to death; and those for the sword, to the sword; and those for famine, to famine; and those for captivity[b], to captivity.’'
  footnotes:
  - marker: a
    text: Or, 'Whoever is for death, to death.' The Hebrew is terse and repetitive, preserving the fixed categories of judgment.
    reason: lexical_alternative
  - marker: b
    text: Or, 'captivity' may be rendered 'exile' in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 일이 일어날 것입니다[a]. 그들이 당신에게 “우리가 어디로 가야 합니까?”라고 말하면, 당신은 그들에게 이렇게 말해야 합니다. “야훼께서 이렇게 말씀하십니다. 죽음에 속한 자는 죽음으로, 칼에 속한 자는 칼로, 기근에 속한 자는 기근으로, 포로됨에 속한 자는 포로됨으로.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘누가 죽음에 속한 자든, 죽음으로.’ 히브리어는 매우 간결하고 반복적이어서, 정해진 심판 범주를 그대로 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  english_pob_choice: And it shall be, when
  chosen_korean: 그리고 그 일이 일어날 것입니다
  alternatives_korean:
  - 그때가 되면
  - 그 일이 있을 것입니다
  lexicon: HALOT
  rationale: 예언적 전개를 드러내되, 한국어에서는 자연스럽게 미래 사건의 도입으로 처리했습니다. ‘그리고’와 ‘일어날 것입니다’는 원문의 서두 기능을 살리면서도 합쇼체 문체에 맞습니다.
- source_word: אָנָה נֵצֵא
  english_pob_choice: Where shall we go?
  chosen_korean: 우리가 어디로 가야 합니까?
  alternatives_korean:
  - 우리가 어디로 나가야 합니까?
  - 어디로 가야 합니까?
  lexicon: HALOT
  rationale: אָנָה의 ‘어디로’와 출발/이동의 의미를 한국어 질문으로 자연스럽게 옮겼습니다. ‘나가다’를 넣으면 히브리어 동사의 질감은 남지만, 문맥상 더 직접적인 목적지 질문이므로 ‘가다’를 택했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자 전령 공식의 엄숙함을 유지하면서도 현대 한국어에서 자연스러운 선포문으로 옮겼습니다. divine name은 프로젝트 기본값에 따라 ‘야훼’로 처리했습니다.
- source_word: אֲשֶׁר לַמָּוֶת לַמָּוֶת ...
  english_pob_choice: Those for death, to death; ...
  chosen_korean: 죽음에 속한 자는 죽음으로, 칼에 속한 자는 칼로, 기근에 속한 자는 기근으로, 포로됨에 속한 자는 포로됨으로
  alternatives_korean:
  - 죽을 자는 죽음으로,
  - 죽음에 정해진 자는 죽음으로, 칼에 정해진 자는 칼로, 기근에 정해진 자는 기근으로, 포로된 자는 포로됨으로
  lexicon: HALOT
  rationale: 히브리어의 반복적이고 단호한 판결 구조를 살리기 위해 ‘속한 자는 …으로’라는 대응을 사용했습니다. ‘정해진’은 해석을 앞서 넣을 수 있어 피했고, ‘포로됨’은 명사형을 유지해 병렬성을 보존했습니다.
- source_word: שְׁבִי
  english_pob_choice: captivity
  chosen_korean: 포로됨
  alternatives_korean:
  - 포로
  - 유수
  - 포로 생활
  lexicon: HALOT
  rationale: 문맥상 ‘포로됨/포로 신세’가 결과 상태를 드러내며, ‘포로 생활’보다 원문의 압축성과 병렬 구조를 더 잘 보존합니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 나타난 신명은 번역상 제목이 아니라 고유명으로 드러내야 하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 심판 선언의 압축성과 반복을 보존
  chosen_reading: 죽음에 속한 자는 죽음으로, 칼에 속한 자는 칼로, 기근에 속한 자는 기근으로, 포로됨에 속한 자는 포로됨으로
  alternative_readings:
  - 죽을 자는 죽음으로…
  - 죽음에 정해진 자는 죽음으로…
  rationale: 히브리어의 짧고 반복적인 판결문을 풀어 쓰면 심판의 냉엄함이 약해집니다. 본문이 의도하는 단정성과 긴장을 그대로 전달하도록 압축적 구조를 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: theological tension should be preserved rather than resolved'
