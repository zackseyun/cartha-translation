review_pass:
  verdict: revise
  source_fidelity: 본문의 ‘그 일이 일어날 것입니다’는 וְהָיָה כִּי의 관용적 미래 상황 도입을 ‘그 일’이라는 별도 지시 대상으로 풀어 다소 첨가적이며, 심판 항목의 ‘~에 속한 자’는 לְ의 운명·배정의 뜻을 충분히 드러내지 못합니다. 또한 שְׁבִי의 대안을 위한 각주 표지가 빠져 있습니다.
  naturalness: ‘그 일이 일어날 것입니다. 그들이 … 말하면’의 분절은 한국어에서 다소 부자연스럽습니다. ‘그들이 … 말하게 될 때’로 예언적 상황을 자연스럽게 연결하고, ‘정해진 자’로 판결문 구조를 명료하게 하는 편이 현대 표준 한국어에 적합합니다. ‘포로됨’은 병렬을 위해 유지할 수 있으나 현대어로는 다소 명사화된 표현입니다.
  terminology: יְהוָה는 프로젝트 방침에 맞게 ‘야훼’로 유지합니다. חֶרֶב, רָעָב은 각각 ‘칼’, ‘기근’으로 유지합니다. שְׁבִי는 본문에서 ‘포로됨’으로 옮기되, 문맥상 가능한 ‘유배’ 대안을 각주에 제시합니다.
  issues:
  - severity: medium
    issue: וְהָיָה כִּי를 ‘그리고 그 일이 일어날 것입니다’로 번역함
    rationale: 히브리어는 뒤따르는 발화 상황을 도입하는 예언적 공식입니다. ‘그 일’이라는 독립된 지시어를 넣으면 원문에 없는 대상이 생기고 문장 연결도 어색해집니다.
  - severity: medium
    issue: ‘죽음에 속한 자’ 등 ‘속한 자’ 표현
    rationale: 이 표현은 한국어에서 죽음·칼·기근에 소속된다는 뜻으로 들릴 수 있습니다. 문맥의 운명/배정 의미를 ‘정해진 자’로 드러내는 것이 더 정확하고 자연스럽습니다.
  - severity: low
    issue: 포로/유배 대안 각주의 표지 및 각주 누락
    rationale: 영어 POB의 captivity/exile 어휘 대안이 한국어 본문에는 반영되지 않았습니다. ‘포로됨’ 뒤에 [b]를 두고 해당 대안을 제시해야 합니다.
  - severity: low
    issue: 각주 a의 한국어 문구가 비문에 가까움
    rationale: ‘누가 죽음에 속한 자든’은 자연스러운 한국어 문장이 아닙니다. 원문의 간결한 대안적 해석을 문법적인 한국어로 고쳐야 합니다.
  revised_text: 그들이 네게 “우리가 어디로 가야 합니까?” 하고 말하게 될 때, 너는 그들에게 이렇게 말해야 합니다. “야훼께서 이렇게 말씀하십니다. 죽음에 정해진 자는 죽음으로, 칼에 정해진 자는 칼로, 기근에 정해진 자는 기근으로, 포로됨에 정해진 자는 포로됨으로[b].”
  revised_footnotes:
  - marker: a
    text: 또는 “죽음에 해당하는 자는 죽음으로.” 히브리어는 매우 간결하고 반복적이며, 정해진 심판의 범주들을 보존합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “유배”. 문맥상 포로됨은 유배로 옮길 수도 있습니다.
    reason: lexical_alternative
  revision_rationale: 예언적 상황을 도입하는 히브리어 관용구를 한국어의 조건적 미래 구문으로 자연스럽게 옮겼습니다. 반복되는 לְ… לְ… 구조의 판결성과 병렬은 유지하되, ‘속한’이 유발하는 소속 의미를 피하기 위해 ‘정해진 자’로 운명적 용례를 드러냈습니다. 누락된 포로/유배 어휘 대안의 표지와 각주를 보완했고, 각주 a의 비문을 바로잡았습니다.
