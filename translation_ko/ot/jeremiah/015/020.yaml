  to: 내가 너를 이 백성에게 견고한 놋 성벽으로 세우겠습니다. 그들이 너와 싸우겠지만, 너를 이기지 못할 것입니다. 내가 너와 함께 있어 너를 구원하고 건져 내겠기 때문입니다. 야훼의 말씀입니다.[a]
