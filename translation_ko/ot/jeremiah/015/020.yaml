id: JER.15.20
reference: Jeremiah 15:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/נְתַתִּ֜י/ךָ לָ/עָ֣ם הַ/זֶּ֗ה לְ/חוֹמַ֤ת נְחֹ֨שֶׁת֙ בְּצוּרָ֔ה וְ/נִלְחֲמ֥וּ אֵלֶ֖י/ךָ וְ/לֹא י֣וּכְלוּ לָ֑/ךְ כִּֽי אִתְּ/ךָ֥ אֲנִ֛י לְ/הוֹשִֽׁיעֲ/ךָ֥ וּ/לְ/הַצִּילֶ֖/ךָ נְאֻם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/020.yaml
  text: And I will make you to this people a fortified wall of bronze; they will fight against you[a], but they will not prevail over you, for I am with you to save you and to deliver you, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'a fortified bronze wall.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너를 이 백성에게 견고한 놋 성벽으로 세우겠습니다. 그들이 너와 싸우겠지만, 너를 이기지 못할 것입니다. 내가 너와 함께 있어 너를 구원하고 건져 내겠기 때문입니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘놋으로 만든 견고한 성벽’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתַתִּיךָ
  english_pob_choice: And I will make you
  chosen_korean: 내가 ... 너를 ... 세울 것이다
  alternatives_korean:
  - 내가 ... 너를 만들 것이다
  - 내가 ... 너를 두겠다
  lexicon: HALOT
  rationale: נתן은 여기서 단순한 ‘주다’보다 어떤 상태로 ‘세우다/만들다’의 뜻이므로, 문맥상 예레미야를 방어적 존재로 세우는 표현이 자연스럽습니다.
- source_word: לְחוֹמַת נְחֹשֶׁת בְּצוּרָה
  english_pob_choice: a fortified wall of bronze
  chosen_korean: 놋으로 만든 견고한 성벽
  alternatives_korean:
  - 견고한 놋 성벽
  - 놋 성벽으로서 견고한 것
  lexicon: HALOT
  rationale: חוֹמָה는 단순한 ‘벽’보다 성을 둘러 지키는 ‘성벽’이 적절하고, נְחֹשֶׁת은 한국어 성경 관용에 따라 ‘놋’으로 옮기되, בָּצוּר의 ‘fortified’는 ‘견고한’으로 살렸습니다.
- source_word: וְלֹא יוּכְלוּ לָךְ
  english_pob_choice: but they will not prevail over you
  chosen_korean: 너를 이기지 못할 것이다
  alternatives_korean:
  - 너를 이기지 못하고 말 것이다
  - 너를 압도하지 못할 것이다
  lexicon: HALOT
  rationale: יָכֹל은 여기서 상대를 상대로 ‘성공하다/당해내다’의 뜻이므로, 전투적 맥락에서 가장 직접적인 ‘이기다’가 힘과 긴장을 잘 드러냅니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언이다
  alternatives_korean:
  - 야훼의 말씀이다
  - 야훼의 말씀이시다
  lexicon: HALOT
  rationale: 예언문 종결 공식 נְאֻם은 단순한 ‘말이다’보다 공적 선언을 나타내므로 ‘선언이다’가 어조를 보존합니다. יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 옮깁니다.
theological_decisions:
- issue: 하나님이 예레미야를 적대 세력 앞의 방벽으로 세우는 은유
  chosen_reading: 예레미야를 물리적 방어물처럼 세워 주시는 보호 약속으로 읽었습니다.
  alternative_readings:
  - 단순한 격려 표현으로 완화하여 읽기
  - 비유를 약화시켜 일반적 보호 약속으로만 읽기
  rationale: 본문은 ‘놋 성벽’이라는 강한 은유와 ‘그들이 싸우나 이기지 못함’을 함께 제시하므로, 보호의 강도를 약화하지 않고 그대로 살려야 합니다.
  doctrine_reference: Jeremiah 15:20의 문맥상 소명자 보호 약속
