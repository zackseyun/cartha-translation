id: JER.15.10
reference: Jeremiah 15:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֽוֹי לִ֣/י אִמִּ֔/י כִּ֣י יְלִדְתִּ֗/נִי אִ֥ישׁ רִ֛יב וְ/אִ֥ישׁ מָד֖וֹן לְ/כָל הָ/אָ֑רֶץ לֹֽא נָשִׁ֥יתִי וְ/לֹא נָֽשׁוּ בִ֖/י כֻּלֹּ֥/ה מְקַלְלַֽו/נִי־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/010.yaml
  text: Woe to me[a], my mother, because you bore me, a man of strife and a man of contention to all the land. I have not lent, nor have they lent to me[b], yet every one of them curses me.
  footnotes:
  - marker: a
    text: Or "to the whole earth."
    reason: alternative_reading
  - marker: b
    text: The Hebrew likely refers to lending and borrowing in the context of debt; Jeremiah says he has given no ordinary social cause for such hostility.
    reason: cultural_note
translation:
  language: ko
  text: 아, 내 어머니여, 내가 태어난 것은 화가 납니다. 나는 온 땅에 다툼의 사람, 분쟁의 사람입니다. 나는 빌려준 적도 없고, 그들도 내게 빌려준 적이 없는데, 모두가 나를 저주합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 땅 전체에”.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 빚을 둘러싼 대부·차용 관계를 가리키는 것으로 보이며, 예레미야는 일반적인 사회적 적대의 원인을 제공한 적이 없다고 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹי
  english_pob_choice: Woe
  chosen_korean: 아
  alternatives_korean:
  - 슬프도다
  - 화가 납니다
  - 아아
  lexicon: HALOT
  rationale: 탄식의 감탄사로서 고전적인 종교어투보다 현대 합쇼체에 맞는 직접적 탄식을 살렸습니다.
- source_word: אִמִּי
  english_pob_choice: my mother
  chosen_korean: 내 어머니여
  alternatives_korean:
  - 어머니여
  - 나의 어머니여
  lexicon: HALOT
  rationale: 예레미야의 탄식에서 어머니를 직접 호격으로 부르는 힘을 살리기 위해 호격 형태로 옮겼습니다.
- source_word: אִישׁ רִיב וְאִישׁ מָדוֹן
  english_pob_choice: a man of strife and a man of contention
  chosen_korean: 다툼의 사람, 분쟁의 사람
  alternatives_korean:
  - 다툼의 사람과 분쟁의 사람
  - 다투는 사람, 분쟁하는 사람
  - 쟁론의 사람, 분쟁의 사람
  lexicon: HALOT
  rationale: 두 명사구의 병렬과 강조를 살리면서, 형용사화보다 명사적 성격을 유지하는 표현을 택했습니다.
- source_word: לְכָל הָאָרֶץ
  english_pob_choice: to all the land
  chosen_korean: 온 땅에
  alternatives_korean:
  - 그 땅에
  - 온 땅에게
  - 땅 전체에
  lexicon: HALOT
  rationale: 예레미야서의 ‘땅’이 주로 유다/그 지역 전체를 가리키는 점을 반영하되, 한국어에서는 자연스러운 범위를 위해 ‘온 땅에’로 옮겼습니다.
- source_word: לֹא נָשִׁיתִי וְלֹא נָשׁוּ בִי
  english_pob_choice: I have not lent, nor have they lent to me
  chosen_korean: 나는 빌려준 적도 없고, 그들도 내게 빌려준 적이 없는데
  alternatives_korean:
  - 나는 빌려준 적이 없고 그들도 내게 빌려주지 않았는데
  - 나는 채권자도 채무자도 아니었는데
  - 나는 꾸어준 일도, 꾸어온 일도 없는데
  lexicon: HALOT
  rationale: 대부·차용의 사회적 맥락을 살리면서, 한국어에서 가장 자연스럽게 빚 관계의 부재를 드러내는 동사구로 번역했습니다.
- source_word: מְקַלְלַו/נִי
  english_pob_choice: curses me
  chosen_korean: 나를 저주합니다
  alternatives_korean:
  - 나를 저주하고 있습니다
  - 나를 욕합니다
  - 나를 저주하니
  lexicon: HALOT
  rationale: 분사적 지속성을 현대 한국어 현재형으로 자연스럽게 옮기되, המקרא의 강한 저주 의미를 약화시키지 않았습니다.
theological_decisions:
- issue: ‘온 땅’의 범위
  chosen_reading: 예레미야의 विरोध 관계를 이스라엘/유다의 전 지역적 적대감으로 이해하고 ‘온 땅’으로 옮깁니다.
  alternative_readings:
  - ‘그 땅’
  - ‘세상’
  - ‘온 세상’
  rationale: 문맥상 보편적 세계보다 예언자 공동체가 속한 땅 전체를 가리키는 것으로 읽는 것이 더 정확하며, 과장된 세계화도 피할 수 있습니다.
  doctrine_reference: 예언서 문맥 해석 원칙
