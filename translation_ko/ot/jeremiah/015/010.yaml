  to: 아, 내 어머니여! 어머니께서 저를 낳으셨으니, 저는 비참합니다. 저는 온 땅을 상대로 다툼과 분쟁을 벌이는 사람이 되었습니다.[a] 나는 빌려준 적도 없고, 그들도 내게 빌려준 적이 없는데,[b] 모두가 나를 저주합니다.
