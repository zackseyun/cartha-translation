    reason: lexical_alternative
translation:
  language: ko
  text: 철이 북방의 철[a]과 청동[b]을 부술 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 압축되어 있습니다. ‘북방의 철’은 특히 강한 철을 가리키는 하나의 표현으로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘청동’은 ‘구리’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָרֹעַ
  english_pob_choice: Can … break
  chosen_korean: 부술 수 있습니까
  alternatives_korean:
  - 깨뜨릴 수 있습니까
  - 꺾을 수 있습니까
  lexicon: HALOT
  rationale: 의문형 הֲ와 רעע의 결합은 수사적 질문으로, 여기서는 도덕적 의미가 아니라 금속을 부수는 물리적 뜻입니다. 현대 한국어에서는 ‘부수다’가 가장 자연스럽고 힘 있는 대응입니다.
- source_word: בַּרְזֶל
  english_pob_choice: iron
  chosen_korean: 쇠
  alternatives_korean:
  - 철
  - 쇠붙이
  lexicon: HALOT
  rationale: 히브리어 금속명은 문맥상 일반적인 ‘쇠’가 가장 간결하고 직접적인 대응입니다. 본절의 압축된 표현을 살리기에 적합합니다.
- source_word: בַּרְזֶל מִצָּפוֹן
  english_pob_choice: iron from the north
  chosen_korean: 북방의 쇠
  alternatives_korean:
  - 북쪽의 쇠
  - 북방에서 온 쇠
  - 북쪽 쇠
  lexicon: HALOT
  rationale: 영문 POB의 주석처럼 이 표현은 ‘특히 단단한 북방의 쇠’라는 관용적 압축일 수 있으므로, 분석적으로 풀기보다 한국어에서도 수식구로 유지했습니다.
- source_word: וּנְחֹשֶׁת
  english_pob_choice: and bronze
  chosen_korean: 그리고 놋쇠
  alternatives_korean:
  - 그리고 청동
  - 그리고 구리
  lexicon: HALOT
  rationale: נְחֹשֶׁת는 문맥상 ‘bronze’가 가장 일반적이므로 한국어 성서 관용어인 ‘놋쇠’를 택했습니다. 마지막 접속도 히브리어의 압축을 반영해 살렸습니다.
theological_decisions:
- issue: 수사적 질문의 압박감 유지
  chosen_reading: 문장 전체를 해석적 서술이 아니라 실제로 대답을 요구하지 않는 수사적 질문으로 옮겼습니다.
  alternative_readings:
  - 평서문처럼 완화해 옮김
  - 단정적 선언으로 풀어씀
  rationale: 문맥상 예레미야의 탄식과 심판 선포 속에서 ‘아무것도 쇠를 부술 수 없다’는 강한 비유가 핵심이므로, 질문 형식을 그대로 유지해야 독자가 원문의 긴장감을 이해할 수 있습니다.
  doctrine_reference: 예레미야서의 예언적 수사와 심판 비유
