  naturalness: ‘내가 반드시 … 하였으며, 내가 반드시 … 하였습니다’는 합쇼체의 직접 인용 안에서도 자연스럽습니다. ‘너의 유익을 위해 풀어 주었다’는 다소 직역적이나, 난해한 원문의 의미를 과도하게 매끈하게 해석하지 않으면서 현대 한국어로 이해 가능합니다.
  terminology: ‘야훼’, ‘원수’, ‘재앙’, ‘환난’은 일관되고 적절합니다. 첫 각주의 ‘첫 절구’는 현대 한국어에서 더 명료한 ‘첫 구절’로 고치고, 둘째 각주의 ‘원수와 함께’는 영어 POB의 ‘with the enemy’가 뜻하는 중재의 상대를 분명히 하도록 ‘원수에게’로 고칩니다.
