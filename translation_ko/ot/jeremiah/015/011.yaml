id: JER.15.11
reference: Jeremiah 15:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָמַ֣ר יְהוָ֔ה אִם לֹ֥א שרות/ך לְ/ט֑וֹב אִם ל֣וֹא הִפְגַּ֣עְתִּֽי בְ/ךָ֗ בְּ/עֵ֥ת רָעָ֛ה וּ/בְ/עֵ֥ת צָרָ֖ה אֶת הָ/אֹיֵֽב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/011.yaml
  text: Yahweh said[a], “Surely I have set you free for good[b]; surely I have made the enemy plead with you in a time of disaster and in a time of distress.”
  footnotes:
  - marker: a
    text: Hebrew uncertain in the first clause; alternatively, 'Surely I have released you for good,' or with a different understanding of the form, 'Surely I have strengthened the remnant for good.'
    reason: textual_variant
  - marker: b
    text: Or, 'surely I have interceded for you with the enemy in a time of disaster and in a time of distress.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다[a]. “내가 반드시 너를 너의 유익을 위해 풀어 주었으며[b], 내가 반드시 재앙의 때와 환난의 때에 원수로 하여금 너에게 간청하게 하였습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 첫 구절은 불확실하며, ‘내가 반드시 너를 너의 유익을 위해 풀어 주었다’로도 옮길 수 있습니다. 다른 이해로는 ‘내가 반드시 남은 자를 강하게 하였다’로 읽을 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘내가 재앙의 때와 환난의 때에 원수에게 너를 위해 중재하였다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본어휘
  rationale: 언약적 하나님의 이름을 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 본문의 고유한 신명성을 보존했습니다.
- source_word: אִם לֹא ... אִם לוא
  english_pob_choice: surely ... surely
  chosen_korean: 분명히 ... 하였습니다
  alternatives_korean:
  - 참으로 ... 하였습니다
  - 정녕 ... 하였습니다
  lexicon: HALOT
  rationale: 조건문이 아니라 강한 확언으로 기능하므로, 한국어에서도 단정적·서술적 표현으로 옮겨 문장의 힘을 살렸습니다.
- source_word: שרותך לְטוֹב
  english_pob_choice: I have set you free for good
  chosen_korean: 너를 분명히 잘되게 하였습니다
  alternatives_korean:
  - 너를 풀어 주었습니다
  - 너를 선하게 두었습니다
  - 너를 잘되게 하였습니다
  lexicon: HALOT
  rationale: 이 형태는 본문상 난해하여 ‘풀어 주다/놓아 주다’ 계열의 해석 가능성을 유지해야 하지만, POB의 읽기처럼 결과와 혜택을 강조하는 뜻을 살려 한국어에서는 ‘잘되게 하다’로 옮겼습니다.
- source_word: הִפְגַּעְתִּי בְךָ ... אֶת הָאֹיֵב
  english_pob_choice: I have made the enemy plead with you
  chosen_korean: 원수로 하여금 너에게 간청하게 하였습니다
  alternatives_korean:
  - 원수가 너에게 간청하게 하였습니다
  - 원수와 너를 위해 중재하였습니다
  lexicon: HALOT
  rationale: 피엘/힢힐 계열 동사의 ‘간청하다/중재하다’ 가능성을 반영하되, 뒤따르는 ‘원수’와의 결합을 살려 ‘원수로 하여금 너에게 간청하게 하다’로 번역했습니다.
- source_word: בְּעֵת רָעָה וּבְעֵת צָרָה
  english_pob_choice: in a time of disaster and in a time of distress
  chosen_korean: 재앙의 때와 환난의 때
  alternatives_korean:
  - 재난의 때와 곤고의 때
  - 재앙의 때와 고통의 때
  lexicon: HALOT
  rationale: רָעָה는 도덕적 악이 아니라 상황적 재난이므로 ‘재앙’, צָרָה는 압박과 곤란을 나타내므로 ‘환난’으로 옮겨 평행구를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 난해한 첫 절구의 의미를 어떻게 유지할 것인가
  chosen_reading: 하나님이 예레미야를 ‘잘되게’ 하시고, 해악의 때에도 그의 편이 되게 하셨다는 약속으로 읽었습니다.
  alternative_readings:
  - ‘너를 풀어 주었다’로 읽기
  - ‘남은 자를 강하게 하였다’로 읽기
  rationale: 히브리어가 문헌상 불확실하므로 한 해석으로 단정하지 않고, 본문의 축복/보호 약속이라는 큰 방향만 한국어에서 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
- issue: 두 번째 절구의 주체를 어떻게 이해할 것인가
  chosen_reading: ‘원수로 하여금 너에게 간청하게 하였다’는 POB의 읽기를 따라, 예레미야가 적대자들 앞에서 오히려 우위에 서게 되는 장면으로 옮겼습니다.
  alternative_readings:
  - 하나님이 원수와 함께/앞에서 예레미야를 위해 중재하셨다는 읽기
  rationale: 문맥상 예레미야의 변호와 입증이 강조되며, 대상을 ‘원수’로 두는 읽기가 더 직접적으로 문법과 서술 흐름을 반영합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
