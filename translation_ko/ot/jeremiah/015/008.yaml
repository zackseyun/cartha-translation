  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עָֽצְמוּ לִ֤/י אַלְמְנֹתָ/ו֙ מֵ/ח֣וֹל יַמִּ֔ים הֵבֵ֨אתִי לָ/הֶ֥ם עַל אֵ֛ם בָּח֖וּר שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם הִפַּ֤לְתִּי עָלֶ֨י/הָ֙ פִּתְאֹ֔ם עִ֖יר וּ/בֶהָלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/008.yaml
  text: Their widows have become more numerous to me than the sand of the seas. I have brought against them, against the mother of a young man, a destroyer at noon; I have suddenly made city and terrors fall upon her.
translation:
  language: ko
  text: 과부들이 나에게는 바다의 모래보다 더 많아졌습니다. 내가 그들 위에, 곧 젊은 사람의 어머니 위에, 대낮에 약탈하는 파괴자를 보내었습니다. 내가 갑자기 그 위에 성읍과 공포를 떨어뜨렸습니다.
  philosophy: formal
lexical_decisions:
- source_word: עָֽצְמוּ לִ֤י אַלְמְנֹתָ/ו֙
  english_pob_choice: Their widows have become more numerous to me
  chosen_korean: 과부들이 나에게는 … 더 많아졌습니다
  alternatives_korean:
  - 그의 과부들이 나에게 더 많아졌습니다
  - 그들의 과부가 내게 더욱 불어났습니다
  lexicon: אַלְמָנָה → 과부
  rationale: 히브리어는 ‘과부들’의 수적 증대를 말하므로, ‘많아졌습니다’로 자연스럽게 옮기되 대상의 확대를 분명히 하기 위해 ‘나에게는’을 살렸습니다.
- source_word: מֵ/ח֣וֹל יַמִּ֔ים
  english_pob_choice: than the sand of the seas
  chosen_korean: 바다의 모래보다
  alternatives_korean:
  - 바닷가의 모래보다
  - 바다 모래보다
  lexicon: חוֹל יָם → 바다의 모래
  rationale: 관용적 비유를 그대로 유지해 셈하기 어려운 다수성을 드러냈습니다.
- source_word: שֹׁדֵ֣ד בַּֽ/צָּהֳרָ֑יִם
  english_pob_choice: a destroyer at noon
  chosen_korean: 대낮에 약탈하는 파괴자
  alternatives_korean:
  - 한낮에 멸망시키는 자
  - 대낮의 멸망자
  lexicon: שֹׁדֵד → 약탈하는 파괴자
  rationale: שׁדד의 파괴·약탈 뉘앙스를 함께 살려, 단순히 ‘멸망자’로 약화시키지 않았습니다.
- source_word: עִ֖יר וּ/בֶהָלֽוֹת
  english_pob_choice: city and terrors
  chosen_korean: 성읍과 공포
  alternatives_korean:
  - 도성과 공포
  - 성읍과 두려움
  lexicon: עִיר / בֶּהָלוֹת
  rationale: 원문의 병렬을 유지하되, בֶּהָלוֹת의 충격·공포의 효과를 ‘공포’로 옮겼습니다.
theological_decisions:
- issue: 1인칭 주어와 ‘그들/그 위에’의 지시 관계
  chosen_reading: 화자가 야훼이므로, 심판 행위의 주체를 분명히 하여 ‘내가’와 ‘나에게는’을 유지했습니다.
  alternative_readings:
  - 문장 전체를 서술적으로 완화하여 주체를 덜 두드러지게 옮김
  rationale: 예레미야의 신탁은 하나님의 직접 발화를 보존하는 것이 중요하므로, 심판의 주체성과 긴장을 흐리지 않도록 했습니다.
  doctrine_reference: 예언적 신탁의 직접 화법 보존
