id: JER.15.6
reference: Jeremiah 15:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣תְּ נָטַ֥שְׁתְּ אֹתִ֛/י נְאֻם יְהוָ֖ה אָח֣וֹר תֵּלֵ֑כִי וָ/אַ֨ט אֶת יָדִ֤/י עָלַ֨יִ/ךְ֙ וָֽ/אַשְׁחִיתֵ֔/ךְ נִלְאֵ֖יתִי הִנָּחֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/006.yaml
  text: You have forsaken me[a], declares Yahweh; you keep going backward. So I have stretched out my hand against you and destroyed you[b]; I am weary of relenting.
  footnotes:
  - marker: a
    text: Or 'you keep turning back' / 'you go backward.' The Hebrew is literally 'backward you go,' using movement imagery for apostasy.
    reason: lexical_alternative
  - marker: b
    text: Or 'I am weary of changing my mind.' The Hebrew verb can denote relenting from judgment; 'relenting' is used here to avoid suggesting moral repentance in God.
    reason: alternative_reading
translation:
  language: ko
  text: “당신은 나를 버렸습니다[a].” 야훼의 말씀입니다. “당신은 뒤로 물러갑니다. 그러므로 내가 내 손을 당신에게 펴서 당신을 멸하였습니다[b]. 내가 뜻을 돌이키는 것에 지쳤습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신은 계속 뒤로 갑니다’로도 옮길 수 있습니다. 히브리어는 문자적으로 ‘뒤로 당신이 갑니다’라는 이동 이미지를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 뜻을 바꾸는 것에 지쳤습니다’로도 옮길 수 있습니다. 이 동사는 여기서 선포한 심판을 거두는 뜻을 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נָטַשְׁתְּ
  english_pob_choice: have forsaken
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 떠났습니다
  - 버려 두었습니다
  - 포기했습니다
  lexicon: HALOT
  rationale: 예언자적 고발에서 관계적·언약적 단절을 드러내는 동사이므로, 단순한 ‘떠나다’보다 ‘버리다’가 더 직접적으로 대응합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 선언하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언문 공식인 נְאֻם은 선언적 발화 표지로 기능하므로, 문장 흐름에 맞게 ‘말씀입니다’로 처리해 예언적 화자를 분명히 했습니다.
- source_word: אָחוֹר תֵּלֵכִי
  english_pob_choice: you keep going backward
  chosen_korean: 뒤로 물러갑니다
  alternatives_korean:
  - 뒤로 갑니다
  - 거꾸로 갑니다
  - 돌아서 갑니다
  lexicon: HALOT
  rationale: 직역의 공간 이미지를 유지하되 한국어로는 자연스럽게 ‘뒤로 물러가다’가 후퇴와 배교의 함의를 함께 드러냅니다.
- source_word: וָאַשְׁחִיתֵךְ
  english_pob_choice: and destroyed you
  chosen_korean: 당신을 멸하였습니다
  alternatives_korean:
  - 당신을 파괴하였습니다
  - 당신을 망하게 하였습니다
  - 당신을 무너뜨렸습니다
  lexicon: HALOT
  rationale: שׁחת의 강한 심판 의미를 약화하지 않기 위해, 결과의 중대성을 살리는 ‘멸하다’를 선택했습니다.
- source_word: הִנָּחֵם
  english_pob_choice: relenting
  chosen_korean: 뜻을 돌이키는 것
  alternatives_korean:
  - 유예하는 것
  - 뜻을 거두는 것
  - 마음을 바꾸는 것
  lexicon: HALOT
  rationale: 하나님의 도덕적 회개처럼 들리지 않도록, 심판을 거두는 의미를 살리는 중립적 표현으로 옮겼습니다.
theological_decisions:
- issue: 예언자 발화의 종결 공식과 하나님의 직접 인용 구분
  chosen_reading: ‘야훼의 말씀입니다’로 예언 공식은 바깥틀에서 처리하고, 이어지는 문장은 하나님의 직접 말씀으로 따옴표 안에 배치했습니다.
  alternative_readings:
  - ‘야훼께서 말씀하십니다’로 전면 재서술
  - 예언 공식 없이 직접 인용만 제시
  rationale: נְאֻם יְהוָה의 예언자적 공식성과 이후 직접 화자의 전환을 함께 드러내기 위한 구조입니다.
  doctrine_reference: 'DOCTRINE.md: 예언문 공식과 직접발화 구분'
- issue: הִנָּחֵם의 신학적 긴장 보존
  chosen_reading: ‘뜻을 돌이키는 것’으로 옮겨, 하나님이 도덕적으로 후회하신다는 뉘앙스는 피하면서 심판을 거두는 긴장을 살렸습니다.
  alternative_readings:
  - ‘후회하는 것’
  - ‘마음을 바꾸는 것’
  - ‘뉘우치는 것’
  rationale: 문맥상 심판 선포를 거두는 의미가 핵심이므로, 신학적 오해를 피하면서도 본문의 긴장을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
