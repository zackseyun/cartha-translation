  lexicon: HALOT
  rationale: 예언자적 고발에서 관계적·언약적 단절을 드러내는 동사이므로, 단순한 ‘떠나다’보다 ‘버리다’가 더 직접적으로 대응합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
