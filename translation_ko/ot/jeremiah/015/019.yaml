theological_decisions:
- issue: 예언자에게 주어진 '돌아오라'와 '돌이켜 세우다'의 관계
  chosen_reading: 이 문장은 예레미야의 태도와 소명을 다시 세우는 부르심으로 읽되, 회개와 재위임 중 어느 하나로만 좁히지 않습니다.
  alternative_readings:
  - 주로 예레미야의 회개를 뜻함
  - 주로 예언 사역의 재위임을 뜻함
  rationale: 히브리어 שׁוּב의 반복과 '내 앞에 서다', '내 입'이라는 표현이 둘 다를 열어 두므로, 번역도 긴장을 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
