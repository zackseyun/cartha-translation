base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/015/019.yaml
  text: 'Therefore[a], this is what Yahweh says: If you return, I will restore you, and you will stand before me. If you bring out the precious from the worthless, you will be as my mouth. They will turn to you[c][b], but you must not turn to them.'
  footnotes:
  - marker: a
    text: Or 'If you repent, I will restore you' or 'If you turn back, I will bring you back.' The Hebrew repeats the verb 'return/turn back' for both Jeremiah's response and the LORD's restoring action.
    reason: lexical_alternative
  - marker: b
    text: '''Bring out the precious from the worthless'' likely refers to separating worthy speech from unworthy speech; compare the following phrase, ''you will be as my mouth.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'you will be my spokesman.' Literally, 'you will be as my mouth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “네가 돌아오면[a] 내가 너를 회복시켜 내 앞에 서게 하겠다. 네가 귀한 것을 무가치한 것에서 꺼내면[b], 너는 내 입과 같게 될 것이다[c]. 그들은 네게로 돌아올 것이나, 너는 그들에게로 돌아가서는 안 된다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아오다’는 여기서 회개와 방향 전환을 함께 가리킬 수 있습니다. 히브리어는 예레미야의 응답과 야훼께서 그를 회복시키시는 행위에 같은 동사 שׁוּב(‘돌아오다/돌이키다’)를 사용합니다. 또는 ‘네가 돌이키면 내가 너를 돌아오게 하겠다.’
    reason: lexical_alternative
  - marker: b
    text: ‘귀한 것’을 ‘무가치한 것’에서 꺼내는 것은 문맥상 가치 있는 말과 가치 없는 말을 가르는 뜻일 가능성이 큽니다. 이어지는 ‘내 입과 같게 될 것이다’가 이를 뒷받침합니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘내 입과 같게 될 것이다’입니다. 이는 ‘내 대변자(말씀을 전하는 사람)가 될 것이다’라는 뜻을 함축할 수 있습니다.
    reason: lexical_alternative
