  lexicon: HALOT
  rationale: 직역 이미지를 유지하면서도 한국어에서 자연스럽게 이해되도록 '같이 될 것이다'로 옮겼습니다. 해석적 의역인 '대변자'는 본문에서 보류했습니다.
- source_word: יָשֻׁבוּ הֵמָּה אֵלֶיךָ
  english_pob_choice: They will turn to you
  chosen_korean: 그들이 네게로 돌아오겠지만
