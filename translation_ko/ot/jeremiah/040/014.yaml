language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֗י/ו הֲ/יָדֹ֤עַ תֵּדַע֙ כִּ֞י בַּעֲלִ֣יס מֶ֣לֶךְ בְּנֵֽי עַמּ֗וֹן שָׁלַח֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה לְ/הַכֹּתְ/ךָ֖ נָ֑פֶשׁ וְ/לֹא הֶאֱמִ֣ין לָ/הֶ֔ם גְּדַלְיָ֖הוּ בֶּן אֲחִיקָֽם׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/014.yaml
  text: And they said to him[b][a], “Do you really know that Baalis king of the Ammonites has sent Ishmael son of Nethaniah to strike you down?” But Gedaliah son of Ahikam did not believe them.
  footnotes:
  - marker: a
    text: Or “Do you know for certain…?” The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Literally “to strike you in life/soul,” an idiom meaning to kill or take someone’s life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. “바알리스, 곧 암몬 사람들의 왕이 느다냐의 아들 이스마엘을 보내어 당신을 죽이려 한다는 것을 정말로 알고 있습니까?” 그러나 그달랴는 아히감의 아들로서 그들을 믿지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “정말로 알고 있습니까?”로, 히브리어의 강조를 나타내는 부정사 절대형과 동사의 결합입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “당신의 생명을 치다”이지만, 여기서는 죽이려는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיָדֹעַ תֵּדַע
  english_pob_choice: Do you really know
  chosen_korean: 정말로 알고 있습니까
  alternatives_korean:
  - 확실히 알고 있습니까
  - 정녕 알고 있습니까
  lexicon: HALOT
  rationale: ידע의 강조형(부정사 절대형 + 동사)을 한국어에서는 의문문 안의 부사 ‘정말로’로 자연스럽게 살려, 단순 정보 문의가 아니라 강한 확인 요구임을 드러냈습니다.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  english_pob_choice: king of the Ammonites
  chosen_korean: 암몬 사람들의 왕
  alternatives_korean:
  - 암몬 사람들의 임금
  - 암몬 족속의 왕
  lexicon: HALOT
  rationale: ‘בְּנֵי עַמּוֹן’을 직역해도 되지만, 현대 한국어에서는 민족/집단을 가리키는 ‘암몬 사람들’이 가장 자연스럽고 원문의 집단성을 잘 살립니다.
- source_word: לְהַכֹּתְךָ נָפֶשׁ
  english_pob_choice: to take your life
  chosen_korean: 당신을 죽이려 한다
  alternatives_korean:
  - 당신의 생명을 빼앗으려 한다
  - 당신을 치어 죽이려 한다
  lexicon: HALOT
  rationale: ‘생명/목숨을 치다’는 관용구를 한국어에서는 결과 의미를 분명히 하는 ‘죽이려 하다’로 옮기되, 과도한 의역은 피했습니다.
- source_word: הֶאֱמִין לָהֶם
  english_pob_choice: did not believe them
  chosen_korean: 그들을 믿지 않았습니다
  alternatives_korean:
  - 그들의 말을 믿지 않았습니다
  - 그들을 신뢰하지 않았습니다
  lexicon: HALOT
  rationale: 여기서는 ‘믿다/믿지 않다’가 보고의 진위를 받아들이지 않았다는 의미를 가장 직접적으로 전달합니다.
