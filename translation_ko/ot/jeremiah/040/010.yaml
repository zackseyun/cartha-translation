  text: וַ/אֲנִ֗י הִנְ/נִ֤י יֹשֵׁב֙ בַּ/מִּצְפָּ֔ה לַֽ/עֲמֹד֙ לִ/פְנֵ֣י הַ/כַּשְׂדִּ֔ים אֲשֶׁ֥ר יָבֹ֖אוּ אֵלֵ֑י/נוּ וְ/אַתֶּ֡ם אִסְפוּ֩ יַ֨יִן וְ/קַ֜יִץ וְ/שֶׁ֗מֶן וְ/שִׂ֨מוּ֙ בִּ/כְלֵי/כֶ֔ם וּ/שְׁב֖וּ בְּ/עָרֵי/כֶ֥ם אֲשֶׁר תְּפַשְׂתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/010.yaml
  text: As for me[a], behold, I am staying at Mizpah to stand before the Chaldeans who come to us. But you, gather wine, summer fruit, and oil, put them in your containers[b], and dwell in your cities that you have taken.
  footnotes:
  - marker: a
    text: Or 'the Babylonians' for 'the Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: '''To stand before'' may also imply attending or representing them in an official capacity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 「나로 말하면, 보십시오, 나는 우리에게 올 갈대아 사람들[a] 앞에 서기 위해 미스바에 머물러 있습니다[b]. 그러나 여러분은 포도주와 여름 과실과 기름을 모아 여러분의 그릇들에 담고, 여러분이 차지한 성읍들에 거주하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈대아 사람들’은 여기서 바빌론 제국을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘앞에 서다’는 그들을 섬기거나 공식적으로 대표한다는 뜻을 내포할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: here I am / behold
  chosen_korean: 보십시오, 나는
  alternatives_korean:
  - 나는 여기 있습니다
  - 보십시오, 저는
  lexicon: HALOT
  rationale: 히네니는 자기 제시의 관용구이므로, 한국어에서는 ‘보십시오’로 화용적 주의를 살리고 뒤에 주어를 직접 두어 자연스럽게 옮겼습니다.
- source_word: יֹשֵׁב
  english_pob_choice: staying
  chosen_korean: 머물러 있으면서
  alternatives_korean:
  - 살고 있으면서
  - 거주하면서
  - 있으면서
  lexicon: HALOT
  rationale: 이 분사형은 단순한 앉아 있음이 아니라 미스바에 계속 머무는 상태를 가리키므로, 행정적·상황적 뉘앙스를 살려 번역했습니다.
- source_word: לִפְנֵי הַכַּשְׂדִּים
  english_pob_choice: before the Chaldeans
  chosen_korean: 갈대아 사람들 앞에
  alternatives_korean:
  - 갈대아 사람들 앞에서
  - 갈대아 사람들을 대하여
  lexicon: HALOT
  rationale: ‘앞에 서다’의 관용을 살리기 위해 직역에 가깝게 유지했으며, POB의 표기처럼 ‘갈대아 사람들’을 본문에 반영했습니다.
- source_word: כְּלֵיכֶם
  english_pob_choice: your containers
  chosen_korean: 그릇에
  alternatives_korean:
  - 용기에
  - 항아리에
  - 그릇들에
  lexicon: HALOT
  rationale: כְּלִי는 매우 넓은 ‘용기/그릇’ 계열의 말이므로, 한국어에서는 지나치게 기술적이지 않은 ‘그릇’으로 포괄적으로 옮겼습니다.
- source_word: תְּפַשְׂתֶּם
  english_pob_choice: have taken
  chosen_korean: 차지한
  alternatives_korean:
  - 점령한
  - 붙잡은
  - 획득한
  lexicon: HALOT
  rationale: 이 동사는 점유·취득의 뜻을 가지므로, 도시를 실제로 소유하게 된 상태를 드러내는 ‘차지한’이 문맥상 가장 자연스럽습니다.
theological_decisions:
- issue: 갈대아 사람들/바빌론 사람들 표기
  chosen_reading: 본문에는 ‘갈대아 사람들’을 두고, 주해적 동일시를 본문 밖으로 넘기지 않았습니다.
  alternative_readings:
  - 바빌론 사람들
  - 갈대아인
  rationale: 히브리어는 실제로 ‘갈대아 사람들’을 말하며, 동의적 역사 해석은 영어 POB의 각주처럼 별도로 처리하는 편이 본문 충실도를 높입니다.
  doctrine_reference: 본문-주해 구분 원칙
