revisions:
- from: 「나로 말하면, 보십시오, 나는 미스바에 머물러 있으면서 우리에게 오는 갈대아 사람들 앞에 설 준비를 하고 있습니다. 그러나 당신들은 포도주와 여름 과실과 기름을 모아 그릇에 담고, 여러분이 차지한 성읍들에 거주하십시오.」[a][b]
  to: 「나로 말하면, 보십시오, 나는 우리에게 올 갈대아 사람들[a] 앞에 서기 위해 미스바에 머물러 있습니다[b]. 그러나 여러분은 포도주와 여름 과실과 기름을 모아 여러분의 그릇들에 담고, 여러분이 차지한 성읍들에 거주하십시오.」
  rationale: ‘설 준비를 하다’를 원문의 목적 표현인 ‘앞에 서기 위해’로 고쳐 의미 첨가를 제거했습니다. 각주 b를 해당 관용구가 포함된 절에 연결했으며, 청자 호칭과 용기의 수를 정리했습니다. ‘올’은 יָבֹאוּ의 예상되는 미래적 뉘앙스를 자연스럽게 반영합니다.
