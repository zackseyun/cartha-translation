source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ כָל הַ/יְּהוּדִ֗ים מִ/כָּל הַ/מְּקֹמוֹת֙ אֲשֶׁ֣ר נִדְּחוּ שָׁ֔ם וַ/יָּבֹ֧אוּ אֶֽרֶץ יְהוּדָ֛ה אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑תָ/ה וַ/יַּאַסְפ֛וּ יַ֥יִן וָ/קַ֖יִץ הַרְבֵּ֥ה מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/012.yaml
  text: Then all the Judeans returned from all the places where they had been driven[a], and they came to the land of Judah, to Gedaliah at Mizpah[c][b], and gathered a very great abundance of wine and summer fruit.
  footnotes:
  - marker: a
    text: Or 'all the Jews.' The Hebrew term can denote the people of Judah and, by extension, Jews; here 'Judeans' highlights the historical setting in the land of Judah.
    reason: lexical_alternative
  - marker: b
    text: Or 'where they had been banished' or 'where they had been scattered.'
    reason: lexical_alternative
  - marker: c
    text: '''Summer fruit'' refers to seasonal produce gathered in late summer or at harvest time.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 모든 유다 사람들이 자신들이 쫓겨났던 모든 곳에서 돌아와, 유다 땅의 미스바에 있는 그달리야에게 가서 포도주와 여름 과일을 매우 많이 거두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל הַיְּהוּדִים
  english_pob_choice: all the Judeans
  chosen_korean: 모든 유다 사람들
  alternatives_korean:
  - 모든 유대인들
  - 모든 유다인들
  lexicon: HALOT
  rationale: 이 문맥은 유다 땅의 주민/출신 집단을 가리키므로, 시대착오를 줄이면서도 역사적 배경을 살릴 수 있는 '유다 사람들'을 택했습니다.
- source_word: נִדְּחוּ
  english_pob_choice: where they had been driven
  chosen_korean: 쫓겨났던
  alternatives_korean:
  - 내쫓겼던
  - 흩어졌던
  - 추방되었던
  lexicon: HALOT
  rationale: נִדְּחוּ는 수동적으로 '몰려나가다/쫓겨나다'의 뉘앙스가 강하므로, 본문 상황에 맞게 '쫓겨났던'으로 옮겼습니다.
- source_word: הַמִּצְפָּתָה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바의
  alternatives_korean:
  - 미스바에서
  - 미스바에 있는
  lexicon: HALOT
  rationale: 히브리어 방향형은 장소 부속/귀속을 나타내므로, '미스바의 그달리야'로 두어 그달리야의 거처를 자연스럽게 드러냈습니다.
- source_word: וַיַּאַסְפוּ יַיִן וָקַיִץ
  english_pob_choice: gathered a very great abundance of wine and summer fruit
  chosen_korean: 포도주와 여름 과일을 매우 많이 거두었습니다
  alternatives_korean:
  - 포도주와 여름 열매를 매우 많이 모았습니다
  - 포도주와 여름 과실을 매우 많이 수확했습니다
  lexicon: HALOT
  rationale: אסף는 '모으다/거두다'의 넓은 뜻을 가지며, 농산물 문맥에서는 '거두다'가 가장 자연스럽습니다. קַיִץ는 계절성 산물을 가리키므로 '여름 과일'을 유지했습니다.
