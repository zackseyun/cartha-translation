  text: וְ/יֽוֹחָנָן֙ בֶּן קָרֵ֔חַ וְ/כָל שָׂרֵ֥י הַ/חֲיָלִ֖ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֑ה בָּ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/013.yaml
  text: And Johanan son of Kareah[a], and all the commanders of the forces who were in the open country, came to Gedaliah at Mizpah.
  footnotes:
  - marker: a
    text: Or 'who were in the field.' The Hebrew expression can refer more literally to the field/fields, or more broadly to the open country/countryside.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 가레아의 아들 요하난과 들에 있던 모든 군대 지휘관들이 미스바에 있는 그달리야에게 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘들’이며, 더 넓게는 성읍 밖의 열린 지역이나 시골을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יֽוֹחָנָן
  english_pob_choice: And Johanan
  chosen_korean: 그리하여 요하난
  alternatives_korean:
  - 그리고 요하난
  - 그런데 요하난
  lexicon: HALOT
  rationale: 문맥상 단순 연결을 넘어 앞절의 상황에서 이어지는 서술 흐름이 자연스러워서, 합쇼체 서술문에 맞는 ‘그리하여’를 택했습니다. 이름은 음역했습니다.
- source_word: בֶּן קָרֵ֔חַ
  english_pob_choice: son of Kareah
  chosen_korean: 가레아의 아들
  alternatives_korean:
  - 가레아의 아들인
  - 카레아의 아들
  lexicon: HALOT
  rationale: 히브리어의 친족 관계 표현을 한국어 관용에 맞게 ‘A의 아들’로 옮겼습니다. 고유명사는 널리 쓰이는 음역형을 따랐습니다.
- source_word: שָׂרֵ֥י הַ/חֲיָלִ֖ים
  english_pob_choice: the commanders of the forces
  chosen_korean: 군대 지휘관들
  alternatives_korean:
  - 부대의 지휘관들
  - 군사들의 지휘관들
  - 군대의 장관들
  lexicon: HALOT
  rationale: שָׂרֵי는 ‘지휘관들/지도자들’이고, 여기서 חֲיָלִים은 군사력·군대의 집합을 가리키므로 ‘군대 지휘관들’이 가장 자연스럽고 직역성을 유지합니다.
- source_word: אֲשֶׁ֣ר בַּ/שָּׂדֶ֑ה
  english_pob_choice: who were in the open country
  chosen_korean: 들에 있던
  alternatives_korean:
  - 들판에 있던
  - 시골에 있던
  - 야외에 있던
  lexicon: HALOT
  rationale: 영어 POB의 주석처럼 직역상 ‘field/fields’이지만, 여기서는 성곽 밖의 넓은 지역을 뜻하므로 한국어에서 ‘들’이 가장 간결하게 그 대비를 살립니다.
- source_word: הַ/מִּצְפָּתָ/ה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바의
  alternatives_korean:
  - 미스바에서
  - 미스바에 있는
  lexicon: HALOT
  rationale: 히브리어의 방향성 표지가 있지만, 한국어에서는 ‘그달리야에게 왔습니다’와 결합될 때 ‘미스바의 그달리야’가 가장 매끄럽고 본문의 도착 지점을 분명히 드러냅니다.
theological_decisions:
- issue: 서술 연결사의 뉘앙스
  chosen_reading: ‘그리하여’로 사건의 연속성과 전개를 드러냈습니다.
  alternative_readings:
  - 그리고
  - 그런데
  - 그 후
  rationale: 이 구절은 단순 병렬보다 앞선 정황에서 이어지는 행동의 결과를 보여 주므로, 한국어 서술 흐름에서 원문의 연속성을 가장 잘 전달하는 표현을 선택했습니다.
  doctrine_reference: 서사 문맥 보존
