  edition: WLC
  text: וְ/יוֹחָנָ֣ן בֶּן קָרֵ֡חַ אָמַ֣ר אֶל גְּדַלְיָהוּ֩ בַ/סֵּ֨תֶר בַּ/מִּצְפָּ֜ה לֵ/אמֹ֗ר אֵ֤לְכָה נָּא֙ וְ/אַכֶּה֙ אֶת יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וְ/אִ֖ישׁ לֹ֣א יֵדָ֑ע לָ֧/מָּה יַכֶּ֣/כָּה נֶּ֗פֶשׁ וְ/נָפֹ֨צוּ֙ כָּל יְהוּדָ֔ה הַ/נִּקְבָּצִ֣ים אֵלֶ֔י/ךָ וְ/אָבְדָ֖ה שְׁאֵרִ֥ית יְהוּדָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/015.yaml
  text: Then Johanan son of Kareah said privately to Gedaliah at Mizpah[a], saying, “Please let me go and strike down Ishmael son of Nethaniah, and no one will know. Why should he take your life, so that all the Judahites who are gathered to you would be scattered[c][b], and the remnant of Judah would perish?”
  footnotes:
  - marker: a
    text: Or 'in secret' / 'secretly.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew ''no man will know''; the sense is generic: ''no one will know.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'Why should he kill you?' Literally, 'Why should he strike you—life?'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 요하난, 가레아의 아들, 이 비밀리에 미스바에서 그달리야에게 말했습니다[a]. “부디 제가 가서 느다냐의 아들 이스마엘을 치게 하십시오. 아무도 알지 못할 것입니다. 그가 어찌 당신의 생명을 빼앗아, 당신에게 모인 모든 유다 사람들이 흩어지고, 유다의 남은 자가 멸망하게 하겠습니까?”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘비밀리에’는 ‘in secret/secretly’의 의미를 반영한 것입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘아무 사람도 알지 못할 것이다’이며, 여기서는 일반적 의미로 ‘아무도 알지 못할 것입니다’라고 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘어찌 그가 당신을—생명’을 치겠습니까?’로, כאן의 נֶפֶשׁ는 ‘생명/목숨’을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַסֵּתֶר
  english_pob_choice: privately
  chosen_korean: 비밀리에
  alternatives_korean:
  - 사적으로
  - 은밀히
  lexicon: HALOT
  rationale: 부사적으로 쓰인 ‘secret/in private’의 의미를 자연스러운 현대 한국어로 살리되, 대화가 공공장소가 아닌 은밀한 상황임을 분명히 했습니다.
- source_word: אֵלְכָה נָּא
  english_pob_choice: Please let me go
  chosen_korean: 부디 제가 가서
  alternatives_korean:
  - 제가 가게 해 주십시오
  - 제가 가도록 허락해 주십시오
  lexicon: HALOT
  rationale: 코호르타티브와 נָא의 공손한 요청을 반영해, 한국어에서는 ‘부디’와 ‘가서’로 자연스럽게 옮겼습니다.
- source_word: וְאַכֶּה
  english_pob_choice: and strike down
  chosen_korean: 치게 하십시오
  alternatives_korean:
  - 쳐 죽이게 하십시오
  - 공격하게 하십시오
  lexicon: HALOT
  rationale: נכה의 기본 의미인 ‘치다/치다’와 여기서의 암살 의도를 함께 살리기 위해, 직접적이되 과도하게 해석하지 않는 ‘치게 하십시오’를 선택했습니다.
- source_word: שְׁאֵרִית יְהוּדָה
  english_pob_choice: the remnant of Judah
  chosen_korean: 유다의 남은 자
  alternatives_korean:
  - 유다의 남은 백성
  - 유다의 남은 무리
  lexicon: HALOT
  rationale: שְׁאֵרִית의 관용적 신학 용어를 ‘남은 자’로 보존해, 심판 뒤에도 남은 공동체라는 문맥을 드러냈습니다.
theological_decisions:
- issue: 요하난의 제안에 담긴 암살 의도와 ‘치다’의 표현 방식
  chosen_reading: 원문의 직접적 폭력 표현을 완화하지 않고, ‘치게 하십시오’로 두어 살해 의도를 문맥 속에서 드러냈습니다.
  alternative_readings:
  - 쳐 죽이게 하십시오
  - 죽이게 하십시오
  rationale: 히브리어 נכה는 문자적으로 ‘치다’이지만, 여기서는 치명적 공격을 뜻합니다. 본문이 실제 암살 계획을 말하므로 그 긴장을 보존하는 번역이 필요합니다.
  doctrine_reference: 본문 문맥의 사실성 보존
- issue: ‘그가 어찌 당신의 생명을 빼앗아’의 수사적 질문
  chosen_reading: 직역을 피하지 않되 한국어 자연성을 위해 수사적 질문 형태로 옮겼습니다.
  alternative_readings:
  - 왜 그가 당신을 죽이겠습니까
  - 어찌 그가 당신의 생명을 치겠습니까
  rationale: נֶפֶשׁ가 여기서는 ‘생명/목숨’을 뜻하므로, 단순한 ‘죽이다’보다 ‘생명을 빼앗다’가 원문의 압축된 표현과 위협성을 함께 반영합니다.
  doctrine_reference: 문학적·서술적 충실성
