    rationale: 주어 구성이 문법적으로 성립하지 않아 독해를 방해합니다. ‘가레아의 아들 요하난’으로 수정해야 합니다.
  - severity: medium
    issue: 요청 표현 ‘치게 하십시오’가 다소 부자연스럽고 허가 요청의 뉘앙스가 약합니다.
