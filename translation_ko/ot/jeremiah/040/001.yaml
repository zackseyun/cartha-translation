base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
  footnotes:
  - marker: a
    text: Or 'the chief of the executioners'; the Hebrew title literally refers to the chief over the slaughterers, likely a royal guard official with execution duties.
    reason: lexical_alternative
translation:
  language: ko
  text: '느부사라단[a] 경호대장이 라마에서 예레미야를 놓아준 뒤에, 여호와께서 예레미야에게 내리신 말씀입니다. 느부사라단이 예레미야를 데려갈 때, 예레미야는 쇠사슬에 묶인 채 예루살렘과 유다의 모든 포로들 가운데서 바빌론으로 끌려가고 있었습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처형 집행자들의 우두머리’. 히브리어 직함은 문자적으로 ‘도살자들’의 우두머리를 가리키며, 처형 임무도 맡았을 가능성이 있는 왕실 경호 관리였을 수 있습니다.
    reason: lexical_alternative
