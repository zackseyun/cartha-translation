base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/001.yaml
  text: 'The word that came to Jeremiah from Yahweh after Nebuzaradan[a], the captain of the guard, had sent him away from Ramah, when he had taken him while he was bound in chains among all the exiles of Jerusalem and Judah who were being exiled to Babylon:'
  footnotes:
  - marker: a
    text: Or 'the chief of the executioners'; the Hebrew title literally refers to the chief over the slaughterers, likely a royal guard official with execution duties.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와에게서 예레미야에게 임한 말씀은 이러합니다. 느부사라단[a], 곧 경호대장의장이 라마에서 그를 풀어 주었고, 그가 예레미야를 붙잡았을 때 그는 쇠사슬에 묶인 채 예루살렘과 유다의 모든 포로들 가운데서 바빌론으로 끌려가고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘처형 집행자들의 우두머리’; 히브리어 직함은 문자적으로 ‘도살자들’의 우두머리를 가리키며, 아마도 처형 임무를 겸한 왕실 경호 관리였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר אֲשֶׁר הָיָה אֶל יִרְמְיָהוּ
  english_pob_choice: The word that came to Jeremiah
  chosen_korean: 예레미야에게 임한 말씀
  alternatives_korean:
  - 예레미야에게 온 말씀
  - 예레미야에게 이른 말씀
  lexicon: HALOT
  rationale: 예언서의 상투적 개시문을 한국어로 자연스럽게 옮기되, דבר의 예언적 성격을 살려 ‘말씀’으로 유지했습니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 여호와에게서
  alternatives_korean:
  - 야훼에게서
  - 주님에게서
  lexicon: HALOT
  rationale: 본문의 신명 표기를 한국어 번역 관행에 맞춰 ‘여호와’로 옮기되, מקור 관계를 드러내는 ‘-에게서’를 사용했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장의장
  alternatives_korean:
  - 경호대장
  - 처형 집행관의 우두머리
  lexicon: HALOT
  rationale: 문자적으로는 ‘도살자들/집행자들’의 우두머리지만, 영어 POB의 판단처럼 바빌로니아 궁정 직함으로서의 기능을 살려 설명적으로 옮겼습니다.
- source_word: שַׁלַּח אֹתוֹ
  english_pob_choice: had sent him away
  chosen_korean: 그를 풀어 주었고
  alternatives_korean:
  - 그를 보내었고
  - 그를 떠나보냈고
  lexicon: HALOT
  rationale: 이 문맥에서는 단순 파송보다 구금 해제를 뜻하므로, 구속 상태를 풀어 준 뜻을 분명히 했습니다.
- source_word: אָסוּר בָּאזִקִּים
  english_pob_choice: while he was bound in chains
  chosen_korean: 쇠사슬에 묶인 채
  alternatives_korean:
  - 사슬에 묶인 채
  - 족쇄에 매인 채
  lexicon: HALOT
  rationale: ‘아시르’의 수동 상태를 살리고, ‘바아지킴’을 현대 한국어로 분명한 구속 표현인 ‘쇠사슬’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문은 고유명 신명 יְהוָה를 한국어로 ‘여호와’로 음역해 제시했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 제공된 영어 POB는 이 절에서 Yahweh를 사용하지만, 한국어 본문은 교회 독자에게 즉시 인식되는 신명 표기를 택하되, מקור 표시는 각주와 함께 추적 가능하게 하려는 선택입니다.
  doctrine_reference: 'POB Korean glossary: יְהוָה / YHWH'
