  - 주님
  rationale: 제공된 영어 POB는 이 절에서 Yahweh를 사용하지만, 한국어 본문은 교회 독자에게 즉시 인식되는 신명 표기를 택하되, מקור 표시는 각주와 함께 추적 가능하게 하려는 선택입니다.
