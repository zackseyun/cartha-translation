source:
  edition: WLC
  text: וְ/עַתָּ֞ה הִנֵּ֧ה פִתַּחְתִּ֣י/ךָ הַ/יּ֗וֹם מִֽן הָ/אזִקִּים֮ אֲשֶׁ֣ר עַל יָדֶ/ךָ֒ אִם ט֨וֹב בְּ/עֵינֶ֜י/ךָ לָ/ב֧וֹא אִתִּ֣/י בָבֶ֗ל בֹּ֚א וְ/אָשִׂ֤ים אֶת עֵינִ/י֙ עָלֶ֔י/ךָ וְ/אִם רַ֧ע בְּ/עֵינֶ֛י/ךָ לָ/בֽוֹא אִתִּ֥/י בָבֶ֖ל חֲדָ֑ל רְאֵה֙ כָּל הָ/אָ֣רֶץ לְ/פָנֶ֔י/ךָ אֶל ט֨וֹב וְ/אֶל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֥כֶת שָׁ֖מָּ/ה לֵֽךְ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/004.yaml
  text: And now[a], look, I have freed you today from the chains that were on your hands. If it is good in your eyes to come with me to Babylon, come, and I will look after you. But if it is bad in your eyes to come with me to Babylon, then do not. See[b], the whole land is before you[c]; go wherever it is good and right in your eyes to go.
  footnotes:
  - marker: a
    text: Literally, 'I will set my eye on you,' an idiom here expressing favorable care or protection.
    reason: lexical_alternative
  - marker: b
    text: Or, more literally, 'If it is good in your eyes ... if it is bad in your eyes.' This Hebrew idiom means 'if it seems good/right to you ... if it seems bad/wrong to you.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'go there, go' at the end of the verse, a Hebrew way of giving emphatic permission.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 보십시오. 제가 오늘 당신의 손을 묶고 있던 사슬에서 당신을 풀어 주었습니다. 나와 함께 바벨론으로 가는 것이 당신이 보기에 좋다면[a], 오십시오. 제가 당신을 돌보겠습니다. 그러나 나와 함께 바벨론으로 가는 것이 당신이 보기에 좋지 않다면, 가지 마십시오. 보십시오, 온 땅이 당신 앞에 있습니다. 당신이 보기에 좋고 옳은 곳이면 어디로든 가십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘당신의 눈에 좋다’와 ‘당신의 눈에 나쁘다’입니다. 여기서는 ‘당신이 보기에 좋다면/좋지 않다면’이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문 끝부분은 직역하면 ‘그리로 가라, 가라’처럼 명령을 거듭하여 허락을 강조합니다. 한국어에서는 ‘어디로든 가십시오’로 그 강조를 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה / הִנֵּה
  english_pob_choice: And now, behold
  chosen_korean: 그때에 보십시오
  alternatives_korean:
  - 그리고 지금 보십시오
  - 이제 보십시오
  lexicon: HALOT
  rationale: פתח된 상황 전환과 주의 환기를 함께 살리되, 현대 한국어에서는 중복된 접속을 줄여 자연스럽게 옮겼습니다. הִנֵּה의 감탄·지시 기능은 ‘보십시오’로 반영했습니다.
- source_word: פִתַּחְתִּיךָ / הָאזִקִּים
  english_pob_choice: I have freed you ... from the chains
  chosen_korean: 쇠사슬에서 당신을 풀어 주었습니다
  alternatives_korean:
  - 사슬에서 당신을 풀어 주었습니다
  - 족쇄에서 당신을 풀어 주었습니다
  lexicon: HALOT
  rationale: פִתַּחְתִּיךָ는 단순한 ‘열다’가 아니라 속박에서의 해방이므로 ‘풀어 주었습니다’로 옮겼고, הָאזִקִּים은 포박 도구를 분명히 드러내는 ‘쇠사슬’로 번역했습니다.
- source_word: אִם טוֹב בְּעֵינֶיךָ / אִם רַע בְּעֵינֶיךָ
  english_pob_choice: If it is good in your eyes ... if it is bad in your eyes
  chosen_korean: 당신 눈에 ... 좋다면 / 당신 눈에 ... 나쁘다면
  alternatives_korean:
  - 당신 보기에 ... 좋다면 / 당신 보기에 ... 나쁘다면
  - 당신이 좋게/나쁘게 여기신다면
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역 성향으로 유지해 평가 기준이 ‘눈에’ 있다는 구조를 살렸습니다. POB가 보존한 대조를 한국어에서도 그대로 드러냈습니다.
- source_word: וְאָשִׂים אֶת־עֵינִי עָלֶיךָ
  english_pob_choice: I will look after you
  chosen_korean: 당신을 잘 돌보겠습니다
  alternatives_korean:
  - 당신을 보살피겠습니다
  - 당신에게 눈을 두겠습니다
  lexicon: HALOT
  rationale: 직역하면 ‘내 눈을 당신 위에 두다’이지만, 이 문맥에서는 감시가 아니라 호의적 보호·배려를 뜻하므로 자연스러운 한국어로 ‘잘 돌보다’로 옮겼습니다.
- source_word: חֲדָל
  english_pob_choice: then do not
  chosen_korean: 그만두십시오
  alternatives_korean:
  - 하지 마십시오
  - 멈추십시오
  - 중지하십시오
  lexicon: HALOT
  rationale: 명령형 חֲדָל은 제안된 행동을 중단하라는 뜻이므로, 한국어에서는 대상 행위를 생략해도 되는 자연스러운 금지·중지 표현인 ‘그만두십시오’로 처리했습니다.
- source_word: כָּל־הָאָרֶץ לְפָנֶיךָ
  english_pob_choice: the whole land is before you
  chosen_korean: 온 땅이 당신 앞에 있습니다
  alternatives_korean:
  - 모든 땅이 당신 앞에 있습니다
  - 온 הארץ가 당신 앞에 있습니다
  lexicon: HALOT
  rationale: ‘before you’의 개방된 선택지를 한국어의 공간 이미지로 살리기 위해 ‘당신 앞에 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 예레미야에게 주어지는 선택의 성격
  chosen_reading: 네부사라단은 예레미야에게 바벨론 동행 또는 자유로운 거처 선택을 실제로 허락합니다.
  alternative_readings:
  - 단순한 형식적 허락
  - 암묵적 압박이 섞인 허락
  rationale: 본문의 반복된 조건문과 ‘온 땅이 당신 앞에 있습니다’는 실제 선택권 부여를 강조하므로, 이를 약화시키지 않고 그대로 살렸습니다.
  doctrine_reference: '본문 주해 원칙: 서술된 역사적 행위와 화자의 의도를 우선 반영'
