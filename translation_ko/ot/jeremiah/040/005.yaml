  text: וְ/עוֹדֶ֣/נּוּ לֹֽא יָשׁ֗וּב וְ/שֻׁ֡בָ/ה אֶל גְּדַלְיָ֣ה בֶן אֲחִיקָ֣ם בֶּן שָׁפָ֡ן אֲשֶׁר֩ הִפְקִ֨יד מֶֽלֶךְ בָּבֶ֜ל בְּ/עָרֵ֣י יְהוּדָ֗ה וְ/שֵׁ֤ב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם א֠וֹ אֶל כָּל הַ/יָּשָׁ֧ר בְּ/עֵינֶ֛י/ךָ לָ/לֶ֖כֶת לֵ֑ךְ וַ/יִּתֶּן ל֧/וֹ רַב טַבָּחִ֛ים אֲרֻחָ֥ה וּ/מַשְׂאֵ֖ת וַֽ/יְשַׁלְּחֵֽ/הוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
  footnotes:
  - marker: a
    text: Hebrew is difficult at the start of the verse; it may also be understood, “While he had not yet returned, ‘Return to Gedaliah…’”
    reason: alternative_reading
  - marker: b
    text: Or “rations” for “provisions.”
    reason: lexical_alternative
  - marker: c
    text: Or “a present,” “an allowance,” or “a portion” for “a gift.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아직 돌아가지 않았기 때문에[a] 그에게 말했습니다. 「돌아가서 아히감의 아들, 사반의 손자 그달리야에게 가십시오. 바빌론 왕이 유다의 여러 성읍 위에 세운 사람입니다. 그와 함께 백성 가운데서 사십시오. 또는 당신 눈에 옳게 보이는 곳으로 어디든지 가십시오」. 그러자 경호대장이 그에게 양식과 선물을 주고 그를 보내었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문장 시작이 난해합니다. ‘그가 아직 돌아오지 않았을 때, “그달리야에게 돌아가라…”’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  english_pob_choice: But since he still had not gone back
  chosen_korean: 그가 아직 돌아가지 않았기 때문에
  alternatives_korean:
  - 아직 돌아오지 않았는데
  - 그가 아직 돌아가지 않은 상태에서
  lexicon: HALOT
  rationale: 어두의 난해한 시간/상태 절을 한국어에서 자연스러운 이유 표현으로 옮기되, ‘아직’과 ‘돌아가지 않았기 때문에’로 미완료 상태를 살렸습니다.
- source_word: וְשֻׁבָה
  english_pob_choice: Go back
  chosen_korean: 돌아가서
  alternatives_korean:
  - 돌아가십시오
  - 돌아가라
  lexicon: HALOT
  rationale: 히브리어 명령형 שוב를 직접 반영하되, 서술문 속 직접화법에 맞게 간결한 명령 연결형으로 처리했습니다.
- source_word: הִפְקִיד מֶלֶךְ בָּבֶל
  english_pob_choice: the king of Babylon has appointed
  chosen_korean: 바빌론 왕이 … 세운
  alternatives_korean:
  - 바빌론 왕이 … 임명한
  - 바빌론 왕이 … 맡긴
  lexicon: HALOT
  rationale: הִפְקִיד는 단순 임명보다 ‘맡겨 세우다/임명하다’의 행정적 어감을 가지므로, 문맥상 통치권 부여를 드러내는 ‘세운’을 택했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 수비대장
  - 친위대장
  lexicon: HALOT
  rationale: 관직명은 한국어 독자가 즉시 이해할 수 있는 군사·호위 맥락을 살리기 위해 ‘경호대장’으로 옮겼습니다.
- source_word: אֲרֻחָה וּמַשְׂאֵת
  english_pob_choice: provisions and a gift
  chosen_korean: 양식과 선물
  alternatives_korean:
  - 식량과 선물
  - 식량과 증정품
  lexicon: HALOT
  rationale: 아루카는 여행/출발에 필요한 식량 공급, 마사트는 추가로 주어진 증여를 가리키므로 POB의 구분을 따라 ‘양식과 선물’로 나눴습니다.
theological_decisions:
- issue: 직접화법 안의 높임말 수준
  chosen_reading: 공손한 명령형 ‘돌아가십시오’가 아니라, 상급자의 지시를 담은 서술적 명령 ‘돌아가서 … 사십시오’로 처리했습니다.
  alternative_readings:
  - 직접 명령형 ‘돌아가십시오’
  - 더 평이한 ‘돌아가라’
  rationale: 원문의 명령은 바빌론 측 장교가 예레미야에게 하는 지시이며, 한국어에서는 지나친 예절화가 관계의 긴장을 약화시킬 수 있어 지시의 성격을 유지했습니다.
  doctrine_reference: 본문 화법 및 서술 맥락
