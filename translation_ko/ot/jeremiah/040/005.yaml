  source_fidelity: 어두의 난해한 절을 각주로 보존한 점은 적절합니다. 다만 본문의 ‘그가 아직 돌아가지 않았기 때문에 그에게 말했습니다’는 인과관계가 지나치게 확정적으로 들리고, 두 대명사의 지시 대상도 불분명합니다. 문맥상 예레미야와 경호대장을 밝혀 자연스럽게 옮기되, 난해성은 각주에 남기는 것이 안전합니다. 또한 הִפְקִיד의 행정적 위임과 בְּעָרֵי יְהוּדָה의 범위를 더 분명히 반영하는 편이 좋습니다.
