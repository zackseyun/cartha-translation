base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/005.yaml
  text: But since he still had not gone back[a], he said, “Go back to Gedaliah son of Ahikam, son of Shaphan, whom the king of Babylon has appointed over the cities of Judah, and live with him among the people[c][b]; or go wherever it seems right in your eyes to go.” Then the captain of the guard gave him provisions and a gift and sent him away.
  footnotes:
  - marker: a
    text: Hebrew is difficult at the start of the verse; it may also be understood, “While he had not yet returned, ‘Return to Gedaliah…’”
    reason: alternative_reading
  - marker: b
    text: Or “rations” for “provisions.”
    reason: lexical_alternative
  - marker: c
    text: Or “a present,” “an allowance,” or “a portion” for “a gift.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 예레미야가 아직 돌아가지 않자[a], 경호대장이 그에게 말했습니다. 「아히감의 아들이며 사반의 손자인 그달리야에게 돌아가십시오. 바빌론 왕이 그를 유다의 성읍들을 맡기도록 세웠습니다. 그와 함께 백성 가운데서 사십시오. 또는 당신이 좋다고 여기는 곳이면 어디든지 가십시오.」 그러자 경호대장이 그에게 양식과 선물을 주고 그를 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이 절의 시작 부분이 난해합니다. ‘예레미야가 아직 돌아가지 않았을 때, “그달리야에게 돌아가라…”’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעוֹדֶנּוּ לֹא יָשׁוּב
  english_pob_choice: But since he still had not gone back
  chosen_korean: 그가 아직 돌아가지 않았기 때문에
  alternatives_korean:
