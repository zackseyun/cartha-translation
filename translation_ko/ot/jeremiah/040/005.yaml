  - 그가 아직 돌아가지 않은 상태에서
  lexicon: HALOT
  rationale: 어두의 난해한 시간/상태 절을 한국어에서 자연스러운 이유 표현으로 옮기되, ‘아직’과 ‘돌아가지 않았기 때문에’로 미완료 상태를 살렸습니다.
- source_word: וְשֻׁבָה
  english_pob_choice: Go back
  chosen_korean: 돌아가서
  alternatives_korean:
  - 돌아가십시오
  - 돌아가라
  lexicon: HALOT
  rationale: 히브리어 명령형 שוב를 직접 반영하되, 서술문 속 직접화법에 맞게 간결한 명령 연결형으로 처리했습니다.
- source_word: הִפְקִיד מֶלֶךְ בָּבֶל
  english_pob_choice: the king of Babylon has appointed
  chosen_korean: 바빌론 왕이 … 세운
  alternatives_korean:
  - 바빌론 왕이 … 임명한
  - 바빌론 왕이 … 맡긴
  lexicon: HALOT
  rationale: הִפְקִיד는 단순 임명보다 ‘맡겨 세우다/임명하다’의 행정적 어감을 가지므로, 문맥상 통치권 부여를 드러내는 ‘세운’을 택했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 수비대장
  - 친위대장
  lexicon: HALOT
  rationale: 관직명은 한국어 독자가 즉시 이해할 수 있는 군사·호위 맥락을 살리기 위해 ‘경호대장’으로 옮겼습니다.
- source_word: אֲרֻחָה וּמַשְׂאֵת
  english_pob_choice: provisions and a gift
  chosen_korean: 양식과 선물
  alternatives_korean:
  - 식량과 선물
  - 식량과 증정품
  lexicon: HALOT
  rationale: 아루카는 여행/출발에 필요한 식량 공급, 마사트는 추가로 주어진 증여를 가리키므로 POB의 구분을 따라 ‘양식과 선물’로 나눴습니다.
theological_decisions:
- issue: 직접화법 안의 높임말 수준
  chosen_reading: 공손한 명령형 ‘돌아가십시오’가 아니라, 상급자의 지시를 담은 서술적 명령 ‘돌아가서 … 사십시오’로 처리했습니다.
  alternative_readings:
  - 직접 명령형 ‘돌아가십시오’
  - 더 평이한 ‘돌아가라’
  rationale: 원문의 명령은 바빌론 측 장교가 예레미야에게 하는 지시이며, 한국어에서는 지나친 예절화가 관계의 긴장을 약화시킬 수 있어 지시의 성격을 유지했습니다.
  doctrine_reference: 본문 화법 및 서술 맥락
