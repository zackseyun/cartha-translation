  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֜ם גְּדַלְיָ֨הוּ בֶן אֲחִיקָ֤ם בֶּן שָׁפָן֙ וּ/לְ/אַנְשֵׁי/הֶ֣ם לֵ/אמֹ֔ר אַל תִּֽירְא֖וּ מֵ/עֲב֣וֹד הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִיטַ֥ב לָ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/009.yaml
  text: Gedaliah son of Ahikam[a], son of Shaphan, swore to them and to their men, saying, “Do not be afraid to serve the Chaldeans. Live in the land and serve the king of Babylon, and it will go well for you.”
  footnotes:
  - marker: a
    text: Or, 'the Babylonians.' The Hebrew reads 'the Chaldeans,' a term often used for the Babylonian ruling power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그다랴는 아히감의 아들, 사반의 손자로서 그들과 그들의 사람들에게 맹세하며 말했습니다. "갈대아 사람을 섬기는 것을 두려워하지 마십시오. 이 땅에 머물러, 바빌론 왕을 섬기십시오. 그러면 여러분에게 잘될 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌로니아 사람들’. 히브리어 본문은 ‘갈대아 사람들’이라고 읽으며, 이 표현은 바빌론의 통치 세력을 가리키는 경우가 많습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하며
  alternatives_korean:
  - 맹세했습니다
  - 맹세하여
  lexicon: HALOT
  rationale: 히브리어 동사는 단순한 발화가 아니라 서약 행위를 가리키므로, 서술을 자연스럽게 살리면서도 의례적 무게를 유지하는 ‘맹세하며’를 택했습니다.
- source_word: לָהֶם ... וּלְאַנְשֵׁיהֶם
  english_pob_choice: to them and to their men
  chosen_korean: 그들과 그들의 사람들에게
  alternatives_korean:
  - 그들과 그들의 군사들에게
  - 그들과 그들의 무리에게
  lexicon: HALOT
  rationale: אַנְשֵׁי는 문맥상 특정 군인만을 뜻한다고 단정하기 어려워, 관계를 드러내면서도 과도하게 해석하지 않는 ‘사람들’로 옮겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람
  alternatives_korean:
  - 갈대아인
  - 바빌로니아 사람
  lexicon: HALOT
  rationale: 본문은 역사적-민족적 호칭인 ‘갈대아 사람들’을 사용하므로, 본문에는 이를 유지하고 해석적 대체어는 피했습니다.
- source_word: שְׁבוּ בָאָרֶץ
  english_pob_choice: Live in the land
  chosen_korean: 이 땅에 머물러
  alternatives_korean:
  - 이 땅에 거주하십시오
  - 이 땅에 살십시오
  lexicon: HALOT
  rationale: 여기서는 정착·잔류를 권하는 뉘앙스가 강하므로, 현대 한국어에서 가장 자연스러운 ‘머물러’를 사용했습니다.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  english_pob_choice: and serve the king of Babylon
  chosen_korean: 바빌론 왕을 섬기십시오
  alternatives_korean:
  - 바빌론 왕에게 복종하십시오
  - 바빌론 왕을 섬기며
  lexicon: HALOT
  rationale: עבד는 여기서 정치적 예속 아래의 섬김을 뜻하므로, 그 관계를 그대로 살리는 ‘섬기십시오’를 택했습니다.
theological_decisions:
- issue: 갈대아 사람과 바빌론 왕에 대한 예언적 권면의 어조
  chosen_reading: 두려움 대신 현실적 순종과 생존을 권하는 직접 화법으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡한 권면
  - 단순한 정치적 조언
  rationale: 본문은 예언자적 지시가 아니라 포로 상황에서의 생존을 위한 실제적 권면을 전달하므로, 명령형의 강도를 유지해야 합니다.
  doctrine_reference: 예레미야 40장 문맥의 역사적-언약적 심판 이해
- issue: ‘갈대아 사람’의 번역 유지
  chosen_reading: 주해적 치환 없이 본문 표지어를 유지했습니다.
  alternative_readings:
  - ‘바빌로니아 사람’으로 본문에 반영
  rationale: 히브리어의 민족-정치 용어를 보존하여 본문 수준에서의 표현을 흐리지 않도록 했습니다.
  doctrine_reference: 본문 충실성과 역사적 문맥 보존 원칙
