  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים אֲשֶׁ֣ר בַּ/שָּׂדֶ֗ה הֵ֚מָּה וְ/אַנְשֵׁי/הֶ֔ם כִּֽי הִפְקִ֧יד מֶֽלֶךְ בָּבֶ֛ל אֶת גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם בָּ/אָ֑רֶץ וְ/כִ֣י הִפְקִ֣יד אִתּ֗/וֹ אֲנָשִׁ֤ים וְ/נָשִׁים֙ וָ/טָ֔ף וּ/מִ/דַּלַּ֣ת הָ/אָ֔רֶץ מֵ/אֲשֶׁ֥ר לֹֽא הָגְל֖וּ בָּבֶֽלָ/ה־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/007.yaml
  text: Now when all the commanders of the forces who were in the open country[a], they and their men, heard that the king of Babylon had appointed Gedaliah son of Ahikam over the land, and that he had entrusted to him men, women, children, and some of the poorest of the land, from those who had not been exiled to Babylon[c][b],
  footnotes:
  - marker: a
    text: Or 'in the field' for 'in the open country.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the lowly/poor of the land' for 'some of the poorest of the land.'
    reason: lexical_alternative
  - marker: c
    text: Or 'who had not been deported to Babylon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 들에 있던 모든 군대 지휘관들과 그들의 부하들은 바벨론 왕이 아히감의 아들 그달리야를 그 땅을 다스리도록 임명하였으며, 또 그에게 바벨론으로 끌려가지 않은 사람들 가운데서 남자들과 여자들과 아이들과 그 땅의 가장 가난한 사람들 중 일부를 맡겼다는 것을 들었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들에’는 ‘들판에’ 또는 ‘도시 밖의 들에’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅의 가장 가난한 사람들 중 일부’는 ‘그 땅의 가난한 사람들 중 일부’ 또는 ‘그 땅의 낮은 사람들 중 일부’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘바벨론으로 끌려가지 않은’은 ‘바벨론으로 포로로 끌려가지 않은’ 또는 ‘바벨론으로 강제 이주되지 않은’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of the forces
  chosen_korean: 군대 지휘관들
  alternatives_korean:
  - 군 지휘관들
  - 부대 지휘관들
  - 군대의 지휘관들
  lexicon: HALOT
  rationale: שָׂרִים은 지도자/지휘관을 가리키고, חֲיָלִים은 여기서 군사 집단을 뜻하므로, ‘군대 지휘관들’이 현대 한국어로 자연스럽고 의미를 충분히 보존합니다.
- source_word: בַּשָּׂדֶה
  english_pob_choice: in the open country
  chosen_korean: 들에
  alternatives_korean:
  - 들판에
  - 시골에
  - 야외에
  lexicon: HALOT
  rationale: 직역하면 ‘들/밭’이지만, 문맥상 도시 통제 밖에 있던 곳을 가리키므로 간결하게 ‘들에’라고 옮기되, 너무 해석적으로 좁히지는 않았습니다.
- source_word: הִפְקִיד ... בָּאָרֶץ
  english_pob_choice: had appointed ... over the land
  chosen_korean: 그 땅 위에 세웠고
  alternatives_korean:
  - 그 땅을 다스리게 했고
  - 그 땅 위에 임명했고
  - 그 땅에 세웠고
  lexicon: HALOT
  rationale: הִפְקִיד은 공식적 임명/배치를 뜻하므로, 행정적 권한을 드러내는 ‘세웠고’가 자연스럽고, ‘위에’로 관할권의 뉘앙스를 살렸습니다.
- source_word: הִפְקִיד אִתּוֹ
  english_pob_choice: had entrusted to him
  chosen_korean: 그에게 ... 맡겼다는
  alternatives_korean:
  - 그에게 ... 맡겨 두었다는
  - 그의 책임 아래 두었다는
  - 그에게 ... 넘겨주었다는
  lexicon: HALOT
  rationale: 두 번째 הִפְקִיד은 사람들을 그달리야의 돌봄/책임 아래 두는 뜻이므로, 단순한 임명 반복보다 ‘맡겼다’가 source-direct입니다.
- source_word: מִדַּלַּת הָאָרֶץ
  english_pob_choice: some of the poorest of the land
  chosen_korean: 그 땅의 가장 가난한 사람들 중 일부
  alternatives_korean:
  - 그 땅의 가난한 사람들 중 일부
  - 그 땅의 가장 천한 사람들 중 일부
  - 그 땅의 가장 가난한 자들 중 일부
  lexicon: HALOT
  rationale: דלָּה는 사회·경제적으로 낮은 상태를 가리키므로, 신학적으로 중립적이면서도 계층적 낮음이 드러나도록 ‘가장 가난한 사람들 중 일부’로 옮겼습니다.
- source_word: מֵאֲשֶׁר לֹא הָגְלוּ בָּבֶלָה
  english_pob_choice: from those who had not been exiled to Babylon
  chosen_korean: 바벨론으로 끌려가지 않았던 사람들
  alternatives_korean:
  - 바벨론으로 포로로 끌려가지 않았던 사람들
  - 바벨론으로 사로잡혀 가지 않았던 사람들
  - 바벨론으로 잡혀가지 않았던 사람들
  lexicon: HALOT
  rationale: הגלה는 강제 이주시킴/유배를 뜻하므로, 문맥에 맞게 ‘끌려가지 않았다’로 자연스럽게 풀되 강제성을 유지했습니다.
theological_decisions:
- issue: 그달리야의 지위 표현
  chosen_reading: ‘그 땅 위에 세웠고’로 번역해 바벨론 왕의 위임 통치를 드러냈습니다.
  alternative_readings:
  - 그 땅을 다스리게 했고
  - 그 땅에 임명했고
  rationale: 본문은 단순한 임명보다 정복 후 행정 권한 부여를 말하므로, 권위의 위임과 관할의 뉘앙스를 함께 살리는 표현이 필요합니다.
  doctrine_reference: 역사 서술의 정치적 위임 의미
- issue: 가난한 사람들에 대한 표현
  chosen_reading: ‘그 땅의 가장 가난한 사람들 중 일부’로 옮겨 사회적 낮음과 부분성을 함께 보였습니다.
  alternative_readings:
  - 그 땅의 가난한 사람들
  - 그 땅의 가장 천한 사람들
  rationale: 히브리어는 단순한 빈곤 묘사 이상으로 남겨진 공동체 안의 낮은 지위를 가리키므로, 과도한 완화 없이 문맥의 사회적 긴장을 보존했습니다.
  doctrine_reference: 본문의 사회사적 의미
- issue: 이동/포로화 표현
  chosen_reading: ‘바벨론으로 끌려가지 않았던 사람들’로 옮겨 강제 유배의 성격을 드러냈습니다.
  alternative_readings:
  - 바벨론으로 포로로 끌려가지 않았던 사람들
  - 바벨론으로 잡혀가지 않았던 사람들
  rationale: 본절의 마지막 절은 남겨진 자들의 신분을 규정하므로, 단순한 ‘이동’이 아니라 강제 이주시킴의 뉘앙스를 유지해야 합니다.
  doctrine_reference: 포로기 역사 서술
