base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
  footnotes:
  - marker: a
    text: Or possibly, 'the sons of Ophi'; the Hebrew personal name is textually/translationally uncertain in English representation.
    reason: lexical_alternative
  - marker: b
    text: Jezaniah may also be rendered 'Jezaniahu'; some relate the name to forms elsewhere translated 'Jaazaniah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 느다냐의 아들 이스마엘, 가레아의 아들들인 요하난과 요나단, 다후멧의 아들 스라야, 느도바 사람 에배의 아들들[a], 그리고 마아가 사람의 아들 야아사냐[b]와 그들의 사람들이 미스바에 있는 그달랴에게 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에배’는 히브리어 고유명의 음역입니다. 이를 ‘오피’로 옮길 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야아사냐’는 ‘야아사냐후’로도 옮길 수 있습니다. 다른 곳의 ‘아사냐’ 계열 이름과 관련된 형태로 보는 견해도 있습니다.
    reason: lexical_alternative
