theological_decisions:
- issue: 집합 강조 표현 ‘הֵמָּה וְאַנְשֵׁיהֶם’의 처리
  chosen_reading: ‘그들의 사람들은 모두’로 옮겨, 단순한 열거가 아니라 우두머리들과 수행 무리가 함께 왔다는 점을 드러냈습니다.
  alternative_readings:
  - 그들과 그 사람들
  - 그들 및 그들의 부하들
  rationale: 히브리어의 총괄적 강조를 보존하되, 한국어에서 위계적·군사적 뉘앙스를 과도하게 덧씌우지 않도록 했습니다.
  doctrine_reference: 본문 문맥의 서사적 강조
