id: JER.40.8
reference: Jeremiah 40:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖ה הַ/מִּצְפָּ֑תָ/ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡הוּ וְ/יוֹחָנָ֣ן וְ/יוֹנָתָ֣ן בְּנֵֽי קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת וּ/בְנֵ֣י עופי הַ/נְּטֹפָתִ֗י וִֽ/יזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/008.yaml
  text: Then Ishmael son of Nethaniah[a], and Johanan and Jonathan the sons of Kareah, and Seraiah son of Tanhumeth, and the sons of Ephai the Netophathite[b], and Jezaniah son of the Maacathite—they and their men—came to Gedaliah at Mizpah.
  footnotes:
  - marker: a
    text: Or possibly, 'the sons of Ophi'; the Hebrew personal name is textually/translationally uncertain in English representation.
    reason: lexical_alternative
  - marker: b
    text: Jezaniah may also be rendered 'Jezaniahu'; some relate the name to forms elsewhere translated 'Jaazaniah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 넷냐후의 아들 이스마엘과, 그리고 카레아의 아들들인 요하난과 요나단과, 탄후멧의 아들 스랴와, 네도바 사람 에파이의 아들들[a]과, 마아가 사람의 아들 여사냐와 그들의 사람들은 모두 미스바의 그달랴에게 왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘에파이’는 영어 POB의 본문 선택을 따른 것이며, 히브리어 자음 배열상 ‘오피’로도 옮길 수 있는 불확실성이 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: came
  chosen_korean: 왔습니다
  alternatives_korean:
  - 도착했습니다
  - 갔습니다
  lexicon: HALOT
  rationale: 서사의 단순 진행을 살리면서, 그달랴를 향한 도착 의미를 자연스럽게 반영했습니다.
- source_word: הַמִּצְפָּתָה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바의 그달랴에게
  alternatives_korean:
  - 미스바로
  - 미스바에 있는 그달랴에게
  lexicon: HALOT
  rationale: 히브리어의 방향형을 한국어에서는 ‘미스바의 그달랴’로 풀어, 장소와 인물을 함께 연결한 영어 POB의 의미를 매끄럽게 옮겼습니다.
- source_word: בְּנֵי עופי
  english_pob_choice: the sons of Ephai
  chosen_korean: 네도바 사람 에파이의 아들들
  alternatives_korean:
  - 에파이의 아들들
  - 오피의 아들들
  lexicon: HALOT
  rationale: 영어 POB가 각주로 남긴 본문상의 불확실성을 따라, 통상적 독법인 ‘에파이’를 본문에 두고 ‘네도바 사람’을 붙여 원문의 민족/지리 표지를 살렸습니다.
- source_word: וִיזַנְיָהוּ
  english_pob_choice: Jezaniah
  chosen_korean: 여사냐
  alternatives_korean:
  - 예사냐
  - 여자냐
  lexicon: HALOT
  rationale: 고유명사는 한국어 성서용례에 맞춰 음역하되, 영어 POB의 표준형을 반영해 읽기 쉬운 형태로 옮겼습니다.
theological_decisions:
- issue: 집합 강조 표현 ‘הֵמָּה וְאַנְשֵׁיהֶם’의 처리
  chosen_reading: ‘그들의 사람들은 모두’로 옮겨, 단순한 열거가 아니라 우두머리들과 수행 무리가 함께 왔다는 점을 드러냈습니다.
  alternative_readings:
  - 그들과 그 사람들
  - 그들 및 그들의 부하들
  rationale: 히브리어의 총괄적 강조를 보존하되, 한국어에서 위계적·군사적 뉘앙스를 과도하게 덧씌우지 않도록 했습니다.
  doctrine_reference: 본문 문맥의 서사적 강조
