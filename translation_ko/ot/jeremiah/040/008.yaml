  source_fidelity: 수정이 필요합니다. 본문의 ‘그들과 그들의 사람들’(הֵמָּה וְאַנְשֵׁיהֶם)은 열거된 지도자들과 그들의 일행이 함께 왔다는 병렬 주어인데, 초안의 ‘그들의 사람들은 모두’는 지도자들 자신이 주어에서 빠진 것처럼 들립니다. 또한 고유명사의 통상적인 한국어 성서 음역을 정비하고, 여사냐 관련 대안 음역도 각주로 보존하는 편이 영어 POB 감사 기록과 히브리어의 불확실성을 더 충실히 반영합니다.
  naturalness: 초안의 쉼표 뒤 ‘그리고’의 반복은 한국어 문장 흐름에 불필요하며, 긴 인명 열거에서는 ‘곧’과 ‘그리고’를 절제하여 쓰는 편이 자연스럽습니다. ‘미스바의 그달랴’보다 ‘미스바에 있는 그달랴’가 그달랴의 위치를 분명히 하면서도 자연스럽습니다.
  terminology: 느다냐, 가레아, 스라야, 다후멧, 느도바, 에배, 야아사냐, 미스바, 그달랴는 한국어 성서에서 널리 쓰이는 음역에 맞추었습니다. 에배/오피 및 야아사냐/야아사냐후의 음역상 불확실성은 각주로 남겼습니다.
