id: JER.40.3
reference: Jeremiah 40:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֵ֥א וַ/יַּ֛עַשׂ יְהוָ֖ה כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר כִּֽי חֲטָאתֶ֤ם לַֽ/יהוָה֙ וְ/לֹֽא שְׁמַעְתֶּ֣ם בְּ/קוֹל֔/וֹ וְ/הָיָ֥ה לָ/כֶ֖ם דבר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/003.yaml
  text: And Yahweh has brought it about and has done just as he said[a], because you sinned against Yahweh and did not listen to his voice[b]; therefore this thing has happened to you.
  footnotes:
  - marker: a
    text: Or, 'did not obey his voice.' The Hebrew idiom 'listen to his voice' often carries the sense of obedience.
    reason: lexical_alternative
  - marker: b
    text: Or, 'this disaster has come upon you.' Hebrew 'this thing' can refer more specifically to the calamity just described.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그 일이 일어나게 하셨고, 말씀하신 대로 행하셨습니다. 이는 여러분이 야훼께 죄를 지었고 그의 음성에 귀를 기울이지 않았기 때문입니다[a]. 그러므로 이 일이 여러분에게 일어난 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 음성에 순종하지 않았습니다.’ 히브리어 관용구 ‘그의 음성에 귀를 기울이다’는 흔히 순종의 뜻을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이 재앙이 여러분에게 닥친 것입니다.’ 히브리어 ‘이 일’은 앞서 언급된 재앙을 더 구체적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא וַיַּעַשׂ
  english_pob_choice: has brought it about / has done
  chosen_korean: 그렇게 하셨고
  alternatives_korean:
  - 그것을 이루셨고
  - 그 일이 일어나게 하셨고
  - 행하셨고
  lexicon: HALOT
  rationale: 두 동사가 연속해 나오는 히브리어의 결과 실현 표현을 자연스럽게 묶되, 원문의 행위-성취 감각을 유지하기 위해 포괄적으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 관례적 대체어가 아니라 고유명사로 드러내야 하므로, 프로젝트 기본값에 따라 야훼로 옮겼습니다.
- source_word: שְׁמַע בְּקוֹל
  english_pob_choice: did not listen to his voice
  chosen_korean: 그의 음성에 귀를 기울이지 않았습니다
  alternatives_korean:
  - 그의 음성을 듣지 않았습니다
  - 그의 음성에 순종하지 않았습니다
  - 그의 말씀을 듣지 않았습니다
  lexicon: HALOT
  rationale: ‘듣다’보다 ‘귀를 기울이다’가 히브리어 관용구의 청종·순종의 뉘앙스를 살리면서도 한국어로 자연스럽습니다.
- source_word: דבר הַזֶּה
  english_pob_choice: this thing
  chosen_korean: 이 일
  alternatives_korean:
  - 이것
  - 이 재앙
  - 이 사건
  lexicon: HALOT
  rationale: 문맥상 앞서 선포된 징벌의 결과를 가리키므로, 직역의 딱딱함을 피하면서도 범위를 과도하게 좁히지 않도록 ‘이 일’로 옮겼습니다.
theological_decisions:
- issue: שׁמע בקולו의 순종 뉘앙스 처리
  chosen_reading: 그의 음성에 귀를 기울이지 않았습니다
  alternative_readings:
  - 그의 음성을 듣지 않았습니다
  - 그의 음성에 순종하지 않았습니다
  rationale: 히브리어 관용구의 의미에는 순종이 포함되지만, 본문은 원문 이미지인 ‘음성’과 ‘귀를 기울이다’로 유지해 독자가 경고를 거절한 관계를 직접 읽게 하는 편이 더 적절합니다.
  doctrine_reference: 'Translation philosophy #3, #5'
- issue: וְהָיָה לָכֶם דבר הַזֶּה의 결과성
  chosen_reading: 그러므로 이 일이 여러분에게 일어난 것입니다
  alternative_readings:
  - 그러므로 이 재앙이 여러분에게 닥친 것입니다
  - 그래서 이 일이 여러분에게 생겼습니다
  rationale: 히브리어의 결과적 진술을 한국어에서 명시적으로 연결해, 앞선 죄와 불순종이 현재의 사태로 이어졌음을 분명히 했습니다.
  doctrine_reference: Source-sense preservation
