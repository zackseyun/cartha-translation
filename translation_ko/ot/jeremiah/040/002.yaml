  naturalness: The draft's '-되 ... 나이다' construction is archaic and does not meet the requested modern formal-polite 합쇼체. Direct speech with '-했습니다' is natural modern formal Korean.
  terminology: Use '야훼' for יהוה, consistently reflecting the project’s stated rendering. '경호대 대장' is preferable to '감옥장장'; the literal sense of the title is retained in a note. The footnote for רָעָה must offer a real alternative rather than repeat the translated wording.
