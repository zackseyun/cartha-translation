id: JER.40.6
reference: Jeremiah 40:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֧א יִרְמְיָ֛הוּ אֶל גְּדַלְיָ֥ה בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֵּ֤שֶׁב אִתּ/וֹ֙ בְּ/ת֣וֹךְ הָ/עָ֔ם הַ/נִּשְׁאָרִ֖ים בָּ/אָֽרֶץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/006.yaml
  text: So Jeremiah went to Gedaliah son of Ahikam at Mizpah[a], and he lived with him among the people who were left in the land.
  footnotes:
  - marker: a
    text: Or 'who remained'; literally 'the ones left/remaining in the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야는 미스바의 아히감의 아들 그달랴에게로 가서, 그 땅에 남겨진 백성 가운데서 그와 함께 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '남은 사람들'; 직역하면 '그 땅에 남겨진/남아 있는 자들'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 왔습니다
  - 갔습니다
  lexicon: HALOT
  rationale: 서술 흐름에서 예레미야의 이동을 자연스럽게 나타내는 동사로 '가서'를 택했습니다. 영어 POB의 'went'와 같은 방향성을 유지합니다.
- source_word: הַמִּצְפָּתָה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바의
  alternatives_korean:
  - 미스바에서의
  - 미스바로
  lexicon: HALOT
  rationale: 지명 뒤의 방향/장소 표지를 한국어에서는 소유격처럼 이어 주어 '미스바의 그달랴'가 아니라 '미스바의 아히감의 아들 그달랴'로, 곧 그가 있던 장소를 자연스럽게 수식하게 했습니다.
- source_word: וַיֵּשֶׁב
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 거하였습니다
  - 머물렀습니다
  lexicon: HALOT
  rationale: ישב의 정착·거주 의미를 반영해 일시적 체류보다 지속적 동거를 드러내는 '살았습니다'를 선택했습니다.
- source_word: הַנִּשְׁאָרִים
  english_pob_choice: who were left
  chosen_korean: 남겨진
  alternatives_korean:
  - 남은
  - 남아 있는
  - 남은 자들
  lexicon: HALOT
  rationale: 히브리어 분사구문을 설명적으로 옮겨 '남은 자들'처럼 기술적 용어로 굳히지 않고, 영어 POB의 판단대로 'who were left'의 서술적 의미를 살렸습니다.
theological_decisions:
- issue: הַנִּשְׁאָרִים를 '남은 자/남은 자들'이라는 신학적 용어로 고정할지 여부
  chosen_reading: 그 땅에 남겨진 백성
  alternative_readings:
  - 그 땅의 남은 자
  - 그 땅에 남은 사람들
  rationale: 이 구절은 남은 자 개념을 암시할 수는 있지만, 본문 자체는 기술적 명사보다 현재 분사적 묘사를 사용합니다. 따라서 신학적 용어를 앞세우지 않고 본문의 직접 의미를 보존했습니다.
  doctrine_reference: 본문이 말하는 것을 본문이 말하는 방식대로 보존
