id: JER.40.11
reference: Jeremiah 40:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַ֣ם כָּֽל הַ/יְּהוּדִ֡ים אֲשֶׁר בְּ/מוֹאָ֣ב וּ/בִ/בְנֵֽי עַמּ֨וֹן וּ/בֶ/אֱד֜וֹם וַ/אֲשֶׁ֤ר בְּ/כָל הָֽ/אֲרָצוֹת֙ שָֽׁמְע֔וּ כִּֽי נָתַ֧ן מֶֽלֶךְ בָּבֶ֛ל שְׁאֵרִ֖ית לִֽ/יהוּדָ֑ה וְ/כִי֙ הִפְקִ֣יד עֲלֵי/הֶ֔ם אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֥ם בֶּן שָׁפָֽן־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/040/011.yaml
  text: Also[a], all the Judeans who were in Moab, among the Ammonites, in Edom, and in all the other lands heard that the king of Babylon had left a remnant for Judah and had appointed Gedaliah son of Ahikam, son of Shaphan, over them.
  footnotes:
  - marker: a
    text: Or 'survivors for Judah.' The Hebrew term can refer more generally to those left alive after disaster.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 모압에, 암몬 사람들 가운데, 에돔에, 그리고 모든 땅에 있던 모든 유다 사람이 바벨론 왕이 유다에 남은 자[a]를 남겨 두고 그들을 맡도록 아히감의 아들이며 사반의 아들인 그달랴를 세웠다는 소식을 들었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유다를 위한 생존자들’. 이 히브리어는 재앙 뒤 살아남은 사람들을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 더욱이
  lexicon: HALOT
  rationale: 이전 서술에 내용을 덧붙이는 접속·첨가 표지이므로, 현대 한국어에서 자연스러운 ‘또한’으로 옮겨 추가 정보의 성격을 살렸습니다.
- source_word: כָּל הַיְּהוּדִים
  english_pob_choice: all the Judeans
  chosen_korean: 모든 유다 사람들
  alternatives_korean:
  - 모든 유대인들
  - 유다의 모든 사람들
  lexicon: HALOT
  rationale: 이 문맥의 집단은 후대의 종교적 범주보다 유다 지역/정체성에 속한 사람들을 가리키므로, ‘유다 사람들’로 옮겨 지역적·역사적 의미를 살렸습니다.
- source_word: שְׁאֵרִית
  english_pob_choice: remnant
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남은 무리
  - 남은 자
  - 남은 생존자들
  lexicon: HALOT
  rationale: POB의 각주처럼 이 단어는 재앙 후 살아남은 이들을 넓게 가리킬 수 있으므로, 본문에서는 ‘남은 자들’로 옮겨 어휘의 범위를 보존했습니다.
- source_word: וְכִי הִפְקִיד עֲלֵיהֶם
  english_pob_choice: and had appointed ... over them
  chosen_korean: 그들 위에 …를 세웠다는
  alternatives_korean:
  - 그들 위에 …를 임명했다는
  - 그들 위에 …를 맡겼다는
  lexicon: HALOT
  rationale: הִפְקִיד은 사람을 맡은 자로 세워 권한을 부여하는 뜻이므로, 행정적 권위를 드러내는 ‘세웠다’로 옮겼습니다.
- source_word: אֶת גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  english_pob_choice: Gedaliah son of Ahikam, son of Shaphan
  chosen_korean: 그달랴를 스알랴후의 아들 아히감의 아들 그달랴를
  alternatives_korean:
  - 그달랴를 아히감의 아들, 사반의 손자 그달랴를
  - 그달랴를 아히감의 아들 그달랴를
  lexicon: HALOT
  rationale: 고유명사는 현대 음역 원칙에 따라 옮기되, 계보 관계는 본문이 제공하는 그대로 보존했습니다.
theological_decisions:
- issue: שְׁאֵרִית의 번역이 문맥상 단순 생존자 집단인지, 예언서의 신학적 ‘남은 자’ 개념까지 지시하는지
  chosen_reading: 본문에서는 역사적 의미를 우선해 ‘남은 자들’로 두되, 예언서적 공명을 완전히 지우지는 않았습니다.
  alternative_readings:
  - 남은 생존자들
  - 남은 무리
  rationale: 이 구절 자체는 남은 자 신학을 전개하지 않지만, שְׁאֵרִית는 예언서 전반에서 중요한 어휘이므로 표준적 대응어를 유지해 의미의 층위를 열어 두었습니다.
  doctrine_reference: Translation philosophy §5 (consistency of key terms, or documented exception)
