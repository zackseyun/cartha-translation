id: JER.50.17
reference: Jeremiah 50:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֶׂ֧ה פְזוּרָ֛ה יִשְׂרָאֵ֖ל אֲרָי֣וֹת הִדִּ֑יחוּ הָ/רִאשׁ֤וֹן אֲכָל/וֹ֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/זֶ֤ה הָ/אַחֲרוֹן֙ עִצְּמ֔/וֹ נְבוּכַדְרֶאצַּ֖ר מֶ֥לֶךְ בָּבֶֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/017.yaml
  text: Israel is a scattered sheep[a]; lions have driven him away. First the king of Assyria devoured him[c][b], and this last one—Nebuchadnezzar king of Babylon—has gnawed his bones.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Nebuchadrezzar,'' a form closer to the Hebrew spelling here; English traditionally uses ''Nebuchadnezzar.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'a scattered lamb.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew verb may mean 'has gnawed his bones,' 'has stripped his bones,' or more generally 'has crushed him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘은 흩어진 양[a]입니다. 사자들이 그를 쫓아냈습니다. 먼저 앗수르 왕이 그를 삼켰고, 이 마지막 자, 곧 바벨론 왕 느부갓네살이 그의 뼈를 갉아먹었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린양’으로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 동사는 ‘그의 뼈를 갉아먹다’, ‘그의 뼈만 남기다’, 또는 더 일반적으로 ‘그의 뼈를 부수다’라는 뜻일 수 있습니다. ‘느부갓네살’은 일반적인 한국어 표기이며, 히브리어 본문의 철자에 더 가까운 형태는 ‘느부갓레살’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה פְזוּרָה
  english_pob_choice: scattered sheep
  chosen_korean: 흩어진 양
  alternatives_korean:
  - 흩어진 어린양
  - 흩어진 양떼
  lexicon: HALOT
  rationale: שֶׂה는 양/어린양 범주를 가리키며, פְזוּרָה는 흩어진 상태를 나타냅니다. 한국어에서는 단수 집합 이미지를 살리면서도 자연스러운 ‘흩어진 양’이 가장 직접적입니다.
- source_word: הִדִּיחוּ
  english_pob_choice: have driven him away
  chosen_korean: 그를 쫓아냈습니다
  alternatives_korean:
  - 그를 몰아냈습니다
  - 그를 쫓아버렸습니다
  lexicon: HALOT
  rationale: 사자들이 먹잇감을 몰아내는 그림을 한국어에서 생생하게 살리기 위해 ‘쫓아냈습니다’를 택했습니다.
- source_word: אֲכָלוֹ
  english_pob_choice: devoured him
  chosen_korean: 그를 삼켰고
  alternatives_korean:
  - 그를 잡아먹었고
  - 그를 먹어치웠고
  lexicon: HALOT
  rationale: 문자적 ‘먹다’보다 제국적 포식의 폭력을 드러내는 ‘삼키다’가 문맥상 더 강하고 자연스럽습니다.
- source_word: עִצְּמוֹ
  english_pob_choice: has gnawed his bones
  chosen_korean: 그의 뼈를 갉아먹었습니다
  alternatives_korean:
  - 그의 뼈를 씹어 먹었습니다
  - 그의 뼈를 긁어냈습니다
  - 그의 뼈를 부러뜨렸습니다
  lexicon: HALOT
  rationale: 히브리어는 뼈를 갉아 남김없이 해치는 이미지를 주므로, ‘갉아먹다’가 최종 단계의 훼손을 비교적 직역적으로 살립니다.
- source_word: נְבוּכַדְרֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓레살
  alternatives_korean:
  - 느부갓네살
  - 네부카드네자르
  lexicon: proper_name
  rationale: 히브리어 철자에 더 가까운 형태를 본문에 반영하고, 영어 POB의 각주 처리 취지를 따라 한국어에서도 이 음역을 유지했습니다.
theological_decisions:
- issue: 이스라엘의 집합명사와 단수 인칭 유지
  chosen_reading: 이스라엘을 한 마리의 흩어진 양으로 의인화하고, 뒤의 대명사도 단수로 처리했습니다.
  alternative_readings:
  - 이스라엘을 양떼로 보고 복수적으로 옮김
  rationale: 본문은 집합명사 이스라엘을 단수 이미지로 다루며, 이어지는 동사·대명사도 단수적 감각을 유지합니다. 이는 포로와 몰락의 비극성을 더 강하게 드러냅니다.
  doctrine_reference: 예언서의 수사와 집합명사 처리
- issue: ‘삼켰고’와 ‘갉아먹었습니다’로 강화된 포식 이미지
  chosen_reading: 정복을 단순 점령이 아니라 살을 먹어 치우는 포식의 은유로 옮겼습니다.
  alternative_readings:
  - 점령했습니다
  - 파괴했습니다
  - 훼손했습니다
  rationale: 히브리어 동사들은 제국의 폭력을 먹이 사냥 이미지로 묘사합니다. 한국어도 이 긴장을 약화하지 않도록 강한 동사를 유지했습니다.
  doctrine_reference: 예언적 심판 비유
