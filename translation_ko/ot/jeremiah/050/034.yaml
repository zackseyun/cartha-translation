id: JER.50.34
reference: Jeremiah 50:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: גֹּאֲלָ֣/ם חָזָ֗ק יְהוָ֤ה צְבָאוֹת֙ שְׁמ֔/וֹ רִ֥יב יָרִ֖יב אֶת רִיבָ֑/ם לְמַ֨עַן֙ הִרְגִּ֣יעַ אֶת הָ/אָ֔רֶץ וְ/הִרְגִּ֖יז לְ/יֹשְׁבֵ֥י בָבֶֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/034.yaml
  text: Their Redeemer is strong[a]; Yahweh of Armies is his name. He will surely plead their case[d][c][b], so that he may give rest to the earth and bring unrest to the inhabitants of Babylon.
  footnotes:
  - marker: a
    text: Or 'their kinsman-redeemer is strong.' The Hebrew term carries familial-legal overtones of one who redeems or vindicates a relative.
    reason: lexical_alternative
  - marker: b
    text: 'Traditional rendering: ''the LORD of Hosts.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'He will surely contend for their cause.' The Hebrew uses a legal-dispute term repeated for emphasis.
    reason: lexical_alternative
  - marker: d
    text: '''The earth'' may also be rendered ''the land.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그들의 구속자는 강하십니다[a] — 야훼 만군의 이름이십니다[b]. 그분은 반드시 그들의 사건을 변론하셔서[c], 땅에 안식을 주시고 바빌론의 주민들에게는 불안을 일으키실 것입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 친족구속자는 강하십니다.’ 히브리어 גאל은 친족을 대신해 구속하고 변호하는 법적·가족적 함의를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: '전통 번역: ‘만군의 여호와.’'
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 사건을 반드시 다투실 것입니다.’ 히브리어는 משפט쟁송의 뉘앙스가 있는 법정적 동사를 반복하여 강조합니다.
    reason: lexical_alternative
  - marker: d
    text: ‘땅’은 ‘지면/세상’으로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּאֲלָם
  english_pob_choice: their Redeemer
  chosen_korean: 그들의 구속자
  alternatives_korean:
  - 그들의 속량자
  - 그들의 친족구속자
  lexicon: HALOT
  rationale: 가אל은 법적·가족적 구속 행위를 가리키므로, ‘구속자’가 본문 의미를 간결하게 살리며 문맥상 ‘친족구속자’보다 덜 특정적이어서 적절합니다.
- source_word: חָזָק
  english_pob_choice: strong
  chosen_korean: 강하십니다
  alternatives_korean:
  - 힘이 있으십니다
  - 능하십니다
  lexicon: HALOT
  rationale: 형용사 ‘강하다’를 직접 살려 구속자의 힘을 평이하고 단정하게 표현했습니다.
- source_word: רִיב יָרִיב אֶת רִיבָם
  english_pob_choice: He will surely plead their case
  chosen_korean: 반드시 그들의 사건을 변론하셔서
  alternatives_korean:
  - 반드시 그들의 송사를 변론하셔서
  - 반드시 그들의 사안을 다투셔서
  lexicon: HALOT
  rationale: 반복형으로 강조된 ריב의 법정적 의미를 살리기 위해 ‘변론하다’를 택했고, ‘사건/송사’ 중에서는 현대 한국어에서 이해가 쉬운 ‘사건’을 사용했습니다.
- source_word: הָאָרֶץ
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 세상
  lexicon: HALOT
  rationale: ‘땅’은 הארץ의 넓은 의미를 과도하게 해석하지 않으면서도 한국어에서 자연스럽게 읽히는 표현입니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 있는 여호와 이름을 직접 드러내는 프로젝트 기준에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: צְבָאוֹת의 번역
  chosen_reading: 만군
  alternative_readings:
  - 군대
  - 군대의 여호와
  rationale: צְבָאוֹת는 하나님의 전쟁-왕권적 칭호로서 한국어 성경 전통과 학술적 직역 사이를 조화시키는 ‘만군’이 적절합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: צְבָאוֹת'
