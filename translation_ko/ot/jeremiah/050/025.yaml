id: JER.50.25
reference: Jeremiah 50:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: פָּתַ֤ח יְהוָה֙ אֶת א֣וֹצָר֔/וֹ וַ/יּוֹצֵ֖א אֶת כְּלֵ֣י זַעְמ֑/וֹ כִּי מְלָאכָ֣ה הִ֗יא לַֽ/אדֹנָ֧/י יְהוִ֛ה צְבָא֖וֹת בְּ/אֶ֥רֶץ כַּשְׂדִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/025.yaml
  text: Yahweh has opened his storehouse and brought out the weapons of his wrath[d][c][b][a], for this is a work of the Lord GOD of Armies in the land of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'his treasury' or 'his armory' for 'his storehouse.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the implements/instruments of his wrath'; the Hebrew term can refer broadly to articles or equipment, but here likely has a military sense.
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'the Lord GOD of hosts.'
    reason: lexical_alternative
  - marker: d
    text: Or 'in the land of Chaldea.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그의 창고[a]를 여시고 그의 진노의 무기들[b]을 꺼내셨습니다. 이는 갈대아인의 땅[d]에서 주 야훼 만군[c]께서 하실 일이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘창고’는 ‘보물창고’ 또는 ‘무기고’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘무기들’은 문자적으로 ‘진노의 기구들’ 또는 ‘진노의 도구들’로도 옮길 수 있으나, 문맥상 군사적 의미가 강합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘만군’은 히브리어 ‘체바오트’를 옮긴 말로, 전통적으로 ‘만군의 주’로 번역됩니다.
    reason: lexical_alternative
  - marker: d
    text: ‘갈대아인의 땅’은 ‘갈대아 땅’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 본문의 고유한 언약 이름을 보존하기 위해 POB의 기본 원칙대로 ‘야훼’로 옮겼습니다.
- source_word: אֹצָרוֹ
  english_pob_choice: his storehouse
  chosen_korean: 그의 창고
  alternatives_korean:
  - 그의 보물창고
  - 그의 창고/저장고
  - 그의 금고
  lexicon: HALOT
  rationale: אוֹצָר는 저장된 것을 두는 장소를 가리킬 수 있으므로, 군사적 문맥을 과도하게 좁히지 않는 ‘창고’가 가장 무난합니다.
- source_word: כְּלֵי זַעְמוֹ
  english_pob_choice: the weapons of his wrath
  chosen_korean: 그의 진노의 무기들
  alternatives_korean:
  - 그의 분노의 그릇들
  - 그의 진노의 도구들
  - 그의 진노의 기구들
  lexicon: HALOT
  rationale: כְּלֵי는 일반적으로 ‘그릇/도구’이지만, 심판과 전쟁의 맥락에서는 ‘무기들’이 본문의 군사적 뜻을 가장 분명하게 드러냅니다.
- source_word: לַאדֹנָי יְהוִה צְבָאוֹת
  english_pob_choice: the Lord GOD of Armies
  chosen_korean: 주 여호와 만군
  alternatives_korean:
  - 주 여호와 만군의 하나님
  - 주 여호와 군대들의
  - 주 여호와 만군의 주
  lexicon: HALOT
  rationale: 아도나이+여호와의 결합은 한국어에서 통상 ‘주 여호와’로 구분하고, צְבָאוֹת은 교회적 관용과 의미를 함께 살릴 수 있는 ‘만군’으로 옮겼습니다.
- source_word: בְּאֶרֶץ כַּשְׂדִּים
  english_pob_choice: in the land of the Chaldeans
  chosen_korean: 갈대아인의 땅에서
  alternatives_korean:
  - 갈대아 땅에서
  - 갈대아 사람들의 땅에서
  lexicon: HALOT
  rationale: 히브리어의 민족표현을 그대로 살려 ‘갈대아인의 땅’으로 옮겼습니다.
theological_decisions:
- issue: אָמַר/서술의 시제와 심판 선언의 확정성
  chosen_reading: 완료된 행동으로서의 선언을 한국어 과거형으로 옮기되, 예언적 선포의 확정성을 유지했습니다.
  alternative_readings:
  - 현재형으로 옮김
  - 미래형/예언형으로 옮김
  rationale: 히브리어 완료형은 예언적 맥락에서 완료된 사건처럼 선포되므로, 한국어 과거형이 단정성과 현장감을 함께 살립니다.
  doctrine_reference: 예언문 헬라어/히브리어 완료형의 예언적 용법
- issue: צְבָאוֹת의 번역
  chosen_reading: ‘만군’으로 옮겼습니다.
  alternative_readings:
  - ‘군대들’
  - ‘천군’
  - ‘hosts’의 음역
  rationale: 전통적으로 널리 알려진 ‘만군’은 군사적 총체성을 전달하면서도 본문이 가리키는 주권적 심판의 뉘앙스를 유지합니다.
  doctrine_reference: 구약 신명칭 번역 관행
