  source_fidelity: 대체로 히브리어의 동작과 어휘를 충실히 반영합니다. 다만 יְהוָה를 본문 앞에서는 ‘야훼’로, 아도나이 יְהוִה 결합에서는 ‘여호와’로 달리 옮긴 것은 고유명사의 일관성을 해칩니다. לַאדֹנָי יְהוִה צְבָאוֹת는 하나님께 속한/하나님께서 하실 일을 나타내므로 ‘주 야훼 만군께서 하실 일’로 자연스럽고 충실하게 표현할 수 있습니다.
  naturalness: ‘그의 진노의 무기들’과 ‘갈대아인의 땅’은 현대 격식체에서 자연스럽습니다. 그러나 ‘주 여호와 만군의 일’은 소유 관계가 다소 모호하게 들릴 수 있어, 행위 주체를 드러낸 ‘주 야훼 만군께서 하실 일’이 더 명료합니다. 각주 표지도 해당 어휘 바로 뒤에 배치하는 편이 독해와 주석 연결에 적절합니다.
  terminology: 야훼를 יְהוָה의 일관된 표기로 유지하고, אֲדֹנָי יְהוִה는 ‘주 야훼’로 옮깁니다. צְבָאוֹת의 ‘만군’은 한국어 성서 문체에서 정착된 적절한 번역입니다. ‘무기들’은 이 심판·군사 문맥에서 כְּלֵי의 의미를 잘 전달합니다.
