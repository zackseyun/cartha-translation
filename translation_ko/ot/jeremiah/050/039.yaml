theological_decisions:
- issue: 도시의 의인화와 성별 표지
  chosen_reading: 히브리어의 여성형 어미를 그대로 의인화로 드러내기보다, 한국어에서는 '그곳'으로 처리해 도시 자체가 황폐해진다는 뜻을 유지했습니다.
  alternative_readings:
  - 그녀 안에
  - 그 안에서
  rationale: 한국어에서 도시를 '그녀'로 일관되게 옮기면 문장이 부자연스러워질 수 있으므로, 의미 손실 없이 독해 가능성을 우선했습니다.
  doctrine_reference: 예언 문학의 수사적 의인화
