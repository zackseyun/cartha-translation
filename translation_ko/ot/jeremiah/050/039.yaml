revisions:
- from: 그러므로 광야의 짐승들이 그곳에서 이리와 함께 살고, 타조들도 그 안에 살 것입니다. 그는 다시는 영원히 사람이 살지 못할 것이며, 대대로 거기에 살지 못할 것입니다.[a][b][c]
  to: 그러므로 광야의 짐승들이 하이에나와 함께 그곳에 살고[a], 타조들도 그 안에 살 것입니다[b]. 그 도성에는[c] 다시는 영원히 사람이 살지 않을 것이며, 대대로 사람이 거주하지 않을 것입니다.
  rationale: 남성 대명사와 ‘살지 못하다’의 의미 변질을 바로잡고, 동물 명칭의 불확실성을 영어 POB 감사 기록 및 히브리어 어휘 판단에 맞게 반영했습니다. 도시의 여성형 의인화는 한국어 본문에서 ‘그 도성’으로 자연스럽게 처리하고 주석으로 보존했습니다.
  reviewer_model: gpt-5.6-terra
