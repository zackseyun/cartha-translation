- from: 내가 이스라엘을 그의 초원으로 다시 데려오겠습니다. 그는 갈멜과 바산에서, 그리고 에브라임의 산지와 길르앗에서 풀을 뜯을 것이며, 그의 기쁨이 채워질 것입니다.[a]
  to: 내가 이스라엘을 그의 초원으로 다시 데려오겠습니다. 그는 갈멜과 바산에서, 그리고 에브라임의 산지와 길르앗에서 풀을 뜯을 것이며, 그의 욕구가 충족될 것입니다.[a]
  rationale: ‘기쁨’을 원문의 먹이·목초 문맥에 부합하는 ‘욕구’로 바로잡았습니다. 직역 각주는 נֶפֶשׁ의 전통적이고 투명한 번역 가능성을 제시하되, 본문은 이를 비물질적 영혼이라는 한정된 의미로 해석하지 않도록 유지합니다.
