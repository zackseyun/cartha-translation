  yaml_path: translation/ot/jeremiah/050/019.yaml
  text: And I will bring Israel back to his pasture[a], and he will graze on Carmel and Bashan; and on the hill country of Ephraim and Gilead his appetite will be satisfied.
  footnotes:
  - marker: a
    text: Or, more literally, 'his soul will be satisfied.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이스라엘을 그의 초원으로 다시 데려오겠습니다. 그는 갈멜과 바산에서, 그리고 에브라임의 산지와 길르앗에서 풀을 뜯을 것이며, 그의 기쁨이 채워질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 혼이 만족할 것입니다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֹׁבַבְתִּי
  english_pob_choice: I will bring ... back
  chosen_korean: 다시 데려오겠습니다
  alternatives_korean:
  - 회복시키겠습니다
  - 돌려보내겠습니다
  lexicon: HALOT
  rationale: שׁוּב의 사역적 의미를 살리면서, 뒤따르는 ‘그의 초원으로’와 자연스럽게 이어지는 이동·귀환의 뉘앙스를 간결하게 표현했습니다.
- source_word: נָוֵהוּ
  english_pob_choice: his pasture
  chosen_korean: 그의 초원
  alternatives_korean:
  - 그의 거처
  - 그의 우리
  - 그의 목초지
  lexicon: HALOT
  rationale: 뒤의 ‘풀을 뜯을 것이다’와 어울리는 목자 이미지이므로, 거처보다 초원/목초지 계열이 더 직접적입니다.
- source_word: וְרָעָה
  english_pob_choice: and he will graze
  chosen_korean: 풀을 뜯을 것이며
  alternatives_korean:
  - 먹을 것이며
  - 목초할 것이며
  lexicon: HALOT
  rationale: כְּבֶשׂ/양 떼의 목축 이미지를 현대 한국어에서 가장 자연스럽게 살리는 동사로, ‘먹다’보다 목가적 장면이 분명합니다.
- source_word: תִּשְׂבַּע נַפְשׁוֹ
  english_pob_choice: his appetite will be satisfied
  chosen_korean: 그의 기쁨이 채워질 것입니다
  alternatives_korean:
  - 그의 목숨이 만족할 것입니다
  - 그의 영혼이 만족할 것입니다
  - 그의 욕구가 채워질 것입니다
  lexicon: HALOT
  rationale: 이 구절은 목축과 먹이의 문맥이므로 נֶפֶשׁ를 추상적 ‘영혼’보다 살아 있는 내적 충족감으로 옮기는 것이 적절합니다. 다만 한국어에서 ‘기쁨’은 원뜻을 너무 멀리할 수 있어, 본문에는 자연성을 우선하되 다른 가능한 해석을 남길 여지를 고려했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 한국어 처리
  chosen_reading: ‘그의 기쁨이 채워질 것입니다’로 자연스러운 충족의 의미를 살렸습니다.
  alternative_readings:
  - ‘그의 영혼이 만족할 것입니다’
  - ‘그의 목숨이 만족할 것입니다’
  rationale: 히브리어는 ‘생명/자아/욕구’가 걸린 구체적 충족을 말합니다. 한국어 ‘영혼’은 후대의 영적 개념을 강하게 불러와 문맥을 좁힐 수 있어, 본문에서는 충족의 결과를 중심으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
