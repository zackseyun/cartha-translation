id: JER.50.26
reference: Jeremiah 50:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֹּֽאוּ לָ֤/הּ מִ/קֵּץ֙ פִּתְח֣וּ מַאֲבֻסֶ֔י/הָ סָלּ֥וּ/הָ כְמוֹ עֲרֵמִ֖ים וְ/הַחֲרִימ֑וּ/הָ אַל תְּהִי לָ֖/הּ שְׁאֵרִֽית־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/026.yaml
  text: Come against her from the farthest border[a]; open her storehouses; pile her up like heaps, and devote her to destruction[c][b]; let no remnant remain to her.
  footnotes:
  - marker: a
    text: Or 'from the end' / 'from the extremity.' The Hebrew expression may mean from the farthest reaches of the land.
    reason: lexical_alternative
  - marker: b
    text: Or 'granaries' or 'barns.' The Hebrew term can refer literally to feeding places or, by extension in this context, storage places for provisions.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'devote her to destruction,' a term associated with putting something under the ban for total destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 들어오라[a] — 가장 먼 경계에서. 그녀의 창고를 열라[b]. 그녀를 무더기처럼 쌓아 올리고, 그녀를 멸망에 바치라[c]. 그녀에게 남은 것이 하나도 없게 하라.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘끝에서’, ‘극단에서’. 히브리어 표현은 그 땅의 가장 먼 곳을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘곡물창’이나 ‘곳간’. 이 히브리어는 문자적으로는 먹이를 두는 곳을 가리키며, 여기서는 저장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘그녀를 멸망에 바치라’는, 어떤 것을 완전한 파멸을 위해 ‘금지 아래 두다’는 뜻과 연관된 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ לָהּ
  english_pob_choice: Come against her
  chosen_korean: 들어오라 — …
  alternatives_korean:
  - 달려오라
  - 그녀를 치러 오라
  lexicon: HALOT
  rationale: 명령형 בוא는 여기서 침공하는 무리에게 주어진 소집이므로, 한국어에서는 군사적 움직임을 직접 살리되 문맥상 ‘~을 치러 오라’의 뜻이 드러나도록 처리했습니다.
- source_word: מִקֵּץ
  english_pob_choice: from the farthest border
  chosen_korean: 가장 먼 경계에서
  alternatives_korean:
  - 끝에서
  - 극단에서
  lexicon: HALOT
  rationale: ‘끝/극단’의 직역보다, 전쟁 소집에서 자연스럽게 읽히는 ‘가장 먼 경계’가 원문의 지리적·총동원적 뉘앙스를 더 잘 드러냅니다.
- source_word: מַאֲבֻסֶיהָ
  english_pob_choice: her storehouses
  chosen_korean: 그녀의 창고
  alternatives_korean:
  - 그녀의 곳간
  - 그녀의 곡물창
  lexicon: HALOT
  rationale: 말 그대로는 먹이를 두는 곳이지만, 바빌론 약탈 문맥에서는 저장 시설을 가리키는 메타포로 기능하므로 ‘창고’가 가장 무난하고 의미를 보존합니다.
- source_word: וְהַחֲרִימוּהָ
  english_pob_choice: devote her to destruction
  chosen_korean: 그녀를 멸망에 바치라
  alternatives_korean:
  - 그녀를 완전히 멸하라
  - 그녀를 진멸하라
  lexicon: HALOT
  rationale: חרם의 언약적·전면적 심판 의미를 단순한 파괴로 약화시키지 않기 위해, POB의 ‘devote to destruction’을 한국어로도 ‘바치다’의 제의적·판결적 뉘앙스가 살아 있게 옮겼습니다.
theological_decisions:
- issue: חרם(헤렘) 동사의 심판적 의미
  chosen_reading: ‘멸망에 바치라’로 옮겨, 단순 파괴가 아니라 하나님께 속한 심판 행위의 의미를 유지했습니다.
  alternative_readings:
  - 그녀를 완전히 멸하라
  - 그녀를 진멸하라
  rationale: 예언서의 החרים는 전쟁의 잔혹성만이 아니라 금지된 것에 대한 전면적 봉헌/처분이라는 신학적 무게를 지니므로, 이를 드러내는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §5 (key terms consistency)
