  text: אֵ֤יךְ נִגְדַּע֙ וַ/יִּשָּׁבֵ֔ר פַּטִּ֖ישׁ כָּל הָ/אָ֑רֶץ אֵ֣יךְ הָיְתָ֧ה לְ/שַׁמָּ֛ה בָּבֶ֖ל בַּ/גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/023.yaml
  text: How the hammer of the whole earth has been cut down and broken! How Babylon has become a desolation among the nations![a][b]
  footnotes:
  - marker: a
    text: Or 'the war hammer of the whole earth.' The Hebrew metaphor presents Babylon as the crushing instrument used against the nations.
    reason: lexical_alternative
  - marker: b
    text: Or 'has become an object of horror among the nations.' The Hebrew term can emphasize both desolation and appalled astonishment at the ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 온 땅의 망치가 이처럼 잘려 부서지다니! 바벨이 민족들 가운데서 이처럼 폐허가 되다니![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅의 전쟁 망치.’ 히브리어 은유는 바벨을 민족들을 짓누르던 도구로 제시합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘민족들 가운데서 경악의 대상이 되었습니다.’ 히브리어 표현은 폐허의 상태와 그 폐허가 불러일으키는 경악의 뉘앙스를 함께 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 어찌하여
  alternatives_korean:
  - 어떻게
  - 어찌하여 이다니
  lexicon: HALOT
  rationale: 탄식과 경악의 수사적 질문이므로 정보 질문처럼 들리는 '어떻게'보다, 감정이 드러나는 '어찌하여'가 원문의 어조를 더 잘 살립니다.
- source_word: פַּטִּישׁ כָּל הָאָרֶץ
  english_pob_choice: the hammer of the whole earth
  chosen_korean: 온 땅의 망치
  alternatives_korean:
  - 온 세상의 망치
  - 전쟁 망치
  lexicon: HALOT
  rationale: 히브리어의 은유를 그대로 살려 바벨을 '망치'로 번역했습니다. '전쟁 망치'는 해석을 덧붙이므로 본문에 없는 성격 규정을 피했습니다.
- source_word: נִגְדַּע ... וַיִּשָּׁבֵר
  english_pob_choice: has been cut down and broken
  chosen_korean: 잘려 부러졌습니다
  alternatives_korean:
  - 잘려 꺾였습니다
  - 찍혀 부서졌습니다
  lexicon: HALOT
  rationale: נגדע의 '잘리다'와 שבר의 '부러지다'를 모두 반영하면서도, 현대 한국어에서 자연스럽고 압축된 병렬 표현으로 옮겼습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: has become a desolation
  chosen_korean: 황무지가 되었습니다
  alternatives_korean:
  - 폐허가 되었습니다
  - 황폐함이 되었습니다
  lexicon: HALOT
  rationale: לְשַׁמָּה는 단순한 파괴를 넘어 사람이 살지 않는 황폐한 상태를 가리키므로, 예언서 문맥에서 자연스러운 '황무지'를 선택했습니다.
theological_decisions:
- issue: '''온 땅의 망치''라는 바벨의 은유를 유지할지 여부'
  chosen_reading: 은유를 풀어 설명하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 온 땅을 무너뜨리던 자
  - 온 땅을 치던 전쟁 망치
  rationale: 원문은 바벨을 심판 도구로 묘사한 뒤 그 도구가 꺾이는 역전을 강조합니다. 해석적 재진술보다 은유 보존이 문학적·신학적 대비를 더 분명하게 드러냅니다.
  doctrine_reference: Translation philosophy §1, §5
