  to: 온 땅의 망치가 이처럼 잘려 부서지다니! 바벨이 민족들 가운데서 이처럼 폐허가 되다니![a][b]
  rationale: 감탄사 אֵיךְ의 수사적 기능을 ‘이처럼 …다니!’로 옮겨 원인 질문으로 오해될 가능성을 피했습니다. ‘망치’ 은유와 ‘온 땅’의 범위는 유지했습니다. לְשַׁמָּה는 본문에서 ‘폐허’로, 대안 의미는 각주에서 ‘경악의 대상’으로 밝혀 의미 범위를 보존했습니다. 각주 표지는 기존처럼 해당 절 끝에 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:46Z'
