  verdict: revise
  source_fidelity: 본문의 ‘어찌하여 …습니까?’는 히브리어 אֵיךְ의 탄식·경악의 감탄을 원인에 대한 질문처럼 들리게 할 수 있습니다. 또한 לְשַׁמָּה는 ‘황무지’보다 폐허와 경악의 대상이라는 폭넓은 의미를 지니므로, 본문에서는 ‘폐허’가 더 적절합니다.
  naturalness: ‘이처럼 …다니!’의 병렬 감탄문은 현대 표준 한국어에서 원문의 애가적 놀라움과 수사적 힘을 자연스럽게 전달합니다. ‘잘려 부서지다’도 망치 은유의 파괴 이미지를 무리 없이 보존합니다.
  terminology: ‘바벨’, ‘온 땅’, ‘망치’, ‘민족들’은 적절합니다. 각주 b의 ‘공포의 대상’은 두려움의 의미로 좁혀질 수 있으므로 ‘경악의 대상’으로 고칩니다.
