  - severity: low
    issue: ‘황무지’는 לְשַׁמָּה의 의미를 다소 지형적으로 한정합니다.
    rationale: 이 말은 황폐한 폐허 및 그 광경이 불러일으키는 경악을 포함할 수 있으므로 ‘폐허’가 본문 문맥에 더 넓고 자연스럽게 맞습니다.
  - severity: medium
    issue: 각주 b의 ‘공포의 대상’은 ‘object of horror’의 의미를 두려움으로 치우치게 번역합니다.
    rationale: 해당 표현은 공포를 느끼는 대상이라기보다 참혹한 폐허를 보고 느끼는 경악·소스라침의 대상이라는 뜻으로도 쓰입니다.
