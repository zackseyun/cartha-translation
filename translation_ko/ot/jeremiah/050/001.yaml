base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/001.yaml
  text: 'The word that Yahweh spoke concerning Babylon[a], concerning the land of the Chaldeans[b], by the hand of Jeremiah the prophet:'
  footnotes:
  - marker: a
    text: Or 'against Babylon, against the land of the Chaldeans.' The Hebrew preposition can introduce an oracle directed against a nation, though here it is rendered more broadly as 'concerning' in the heading.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'by the hand of Jeremiah,' an idiom meaning 'through Jeremiah' or 'by Jeremiah as the agent.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 바벨론과 갈대아 사람들의 땅에 대하여[a] 예레미야 예언자를 통하여[b] 말씀하신 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אֶל은 예언의 대상이나 관련 범위를 나타낼 수 있습니다. 이곳에서는 그 의미를 넓게 보존하여 ‘…에 대하여’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 בְּיַד는 문자적으로 ‘손으로’이지만, 여기서는 예레미야를 매개자 또는 대리자로 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  english_pob_choice: The word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  - 일
  lexicon: HALOT
  rationale: 예언 서문에서 דָּבָר는 단순한 ‘말’보다 선포된 하나님의 말씀이라는 공적 뉘앙스를 살리기 위해 ‘말씀’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 테트라그라마톤을 관습적 대체어 ‘주님’이 아니라 고유명사 음역 ‘야훼’로 옮겨, 본문이 직접 제시하는 하나님의 이름을 보존했습니다.
- source_word: אֶל
  english_pob_choice: concerning
  chosen_korean: '...에 대하여'
  alternatives_korean:
  - '...을/를 향하여'
  - '...에 대해'
  - '...을/를 נגד해'
  lexicon: HALOT
  rationale: 예언 머리말의 אֶל은 심판의 방향성을 함축할 수 있지만, 여기서는 POB의 판단을 따라 본문 자체의 범위를 드러내는 ‘...에 대하여’로 처리했습니다.
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: ~을 통해
  alternatives_korean:
  - ~의 손으로
  - ~을 거쳐
  - ~에 의해
  lexicon: HALOT
  rationale: 히브리어 관용구의 대리·매개 의미를 현대 한국어에서 자연스럽게 드러내기 위해 ‘예레미야 선지자를 통해’로 풀어 옮겼습니다.
theological_decisions:
- issue: אָורקל 머리말에서 אֶל의 방향성을 어떻게 처리할 것인가
  chosen_reading: ‘바벨론과 갈대아인의 땅에 대하여’로 중립적으로 유지했습니다.
  alternative_readings:
  - ‘바벨론과 갈대아인의 땅을 향하여’
  - ‘바벨론과 갈대아인의 땅을 대하여’
  rationale: 이 표제문은 뒤이어 나올 심판 예언을 예고하지만, 접속 전치사 자체를 미리 ‘against’류로 해석해 공격성을 덧씌우기보다 원문이 말하는 범위를 먼저 보존하는 편이 소스 충실도에 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve the source text''s plain sense; do not paraphrase beyond what the source warrants'
