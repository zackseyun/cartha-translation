reference: Jeremiah 50:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַגִּ֨ידוּ בַ/גּוֹיִ֤ם וְ/הַשְׁמִ֨יעוּ֙ וּֽ/שְׂאוּ נֵ֔ס הַשְׁמִ֖יעוּ אַל תְּכַחֵ֑דוּ אִמְרוּ֩ נִלְכְּדָ֨ה בָבֶ֜ל הֹבִ֥ישׁ בֵּל֙ חַ֣ת מְרֹדָ֔ךְ הֹבִ֣ישׁוּ עֲצַבֶּ֔י/הָ חַ֖תּוּ גִּלּוּלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/002.yaml
  text: Declare among the nations and proclaim[a]; lift up a banner. Proclaim; do not hide it. Say, “Babylon is captured; Bel is put to shame; Merodach is shattered. Her images are put to shame[b]; her idols are shattered.”
  footnotes:
  - marker: a
    text: Merodach is the Hebrew form of the Babylonian god more commonly known as Marduk.
    reason: alternative_reading
  - marker: b
    text: The Hebrew term translated “idols” is strongly pejorative, carrying the sense of something filthy or contemptible.
    reason: lexical_alternative
translation:
  language: ko
  text: “열방 가운데 알리고 선포하십시오. 깃발을 세우십시오. 선포하고 숨기지 마십시오. 이렇게 말하십시오. ‘바벨론이 함락되었습니다. 벨은 수치를 당했고, 메로닥은 산산이 부서졌습니다[a]. 그 우상 형상들은 수치를 당했고, 그 우상들은 산산이 부서졌습니다[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메로닥’은 바벨론의 신으로 더 널리 알려진 ‘마르둑’의 히브리어 형태입니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘우상들’로 번역한 히브리어 표현은 경멸적 뉘앙스가 강하며, 더럽고 하찮은 것을 가리키는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידוּ / וְהַשְׁמִיעוּ
  english_pob_choice: Declare / proclaim
  chosen_korean: 선포하다
  alternatives_korean:
  - 선언하다
  - 알리다
  lexicon: HALOT
  rationale: 공적이고 전령적인 명령형의 힘을 살리기 위해 두 동사를 모두 ‘선포하다’로 옮기되, 반복을 유지해 공개적 발표의 긴박함을 드러냈습니다.
- source_word: בַגּוֹיִם
  english_pob_choice: among the nations
  chosen_korean: 열방 가운데서
  alternatives_korean:
  - 민족들 가운데서
  - 나라들 가운데서
  lexicon: HALOT
  rationale: 가볍게 ‘민족들’로 낮추기보다 국제적 범위를 드러내는 성경적 표현인 ‘열방’을 택했습니다.
- source_word: וּשְׂאוּ נֵס
  english_pob_choice: lift up a banner
  chosen_korean: 깃발을 세우십시오
  alternatives_korean:
  - 신호를 높이십시오
  - 기치를 드십시오
  lexicon: HALOT
  rationale: נֵס의 공적 신호 이미지를 한국어에서 자연스럽고 가시성 있게 전달하는 표현으로 ‘깃발을 세우다’를 선택했습니다.
- source_word: אַל תְּכַחֵדוּ
  english_pob_choice: do not hide it
  chosen_korean: 숨기지 마십시오
  alternatives_korean:
  - 감추지 마십시오
  - 은폐하지 마십시오
  lexicon: HALOT
  rationale: 공적 선포의 흐름에 맞는 직접적이고 현대적인 금지 표현으로 옮겼습니다.
- source_word: הֹבִישׁ / חַת / חַתּוּ
  english_pob_choice: is put to shame / is shattered
  chosen_korean: 수치를 당했습니다 / 무너졌습니다
  alternatives_korean:
  - 부끄러움을 당했습니다 / 두려워 떨었습니다
  - 굴욕을 당했습니다 / 산산이 부서졌습니다
  lexicon: HALOT
  rationale: הֹבִישׁ의 ‘수치’를 유지하면서, חַת의 의미를 문맥상 단순 공포보다 우상 권능의 붕괴를 포함하는 ‘무너졌다’로 옮겨 본문 대비와 병행을 살렸습니다.
- source_word: עֲצַבֶּיהָ / גִּלּוּלֶיהָ
  english_pob_choice: her images / her idols
  chosen_korean: 그들의 우상들
  alternatives_korean:
  - 그들의 형상들
  - 그들의 우상 형상들
  lexicon: HALOT
  rationale: 두 히브리어 단어가 모두 우상숭배 대상을 가리키므로 본문에서는 의미를 중복하지 않도록 일반적 ‘우상들’로 정리했습니다.
theological_decisions:
- issue: 벨과 메로닥의 고유명 표기
  chosen_reading: 고유명사는 음역하여 ‘벨’, ‘메로닥’으로 유지했습니다.
  alternative_readings:
  - ‘마르둑’으로 표기
  - 설명적으로 풀어 번역
  rationale: 원문 고유명칭의 역사성을 보존하고, 본문 안에서 외래신들의 실체를 직접 드러내기 위해 음역을 유지했습니다.
  doctrine_reference: Translation philosophy §2
- issue: ‘무너졌다’의 의미 범위
  chosen_reading: חַת의 결과를 우상 권능의 붕괴까지 포함하는 ‘무너졌다’로 옮겼습니다.
  alternative_readings:
  - ‘당황했다’
  - ‘두려워 떨었다’
  rationale: 문맥은 개인 감정 상태보다 바벨론 신들의 패배와 우상 체계의 붕괴를 선포하는 것이므로, 더 큰 파괴 이미지를 유지하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §§5–6
