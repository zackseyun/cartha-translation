    rationale: 원문은 바벨론의 형상들(עֲצַבֶּיהָ)과 바벨론의 경멸적으로 지칭된 우상들(גִּלּוּלֶיהָ)을 병렬합니다. 소유 지시와 어휘적 구별을 보존해야 합니다.
