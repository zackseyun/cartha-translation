revisions:
- from: “열방 가운데서 선포하고[a], 깃발을 세우십시오. 선포하고, 숨기지 마십시오. 말하십시오. ‘바벨론이 사로잡혔고, 벨은 수치를 당했으며, 메로닥은 무너졌습니다. 그들의 우상들은 수치를 당했고[b], 그들의 우상들은 무너졌습니다.’”
  to: “열방 가운데 알리고 선포하십시오. 깃발을 세우십시오. 선포하고 숨기지 마십시오. 이렇게 말하십시오. ‘바벨론이 함락되었습니다. 벨은 수치를 당했고, 메로닥은 산산이 부서졌습니다[a]. 그 우상 형상들은 수치를 당했고, 그 우상들은 산산이 부서졌습니다[b].’”
  rationale: 주석 앵커를 해당 고유명에 옮기고, 바벨론을 가리키는 여성 단수 소유를 ‘그’로 보존했습니다. 또한 ‘우상 형상들’과 경멸적 어휘인 ‘우상들’을 구별하여 원문의 병렬과 어휘 차이를 반영했습니다. חַת/חַתּוּ는 이 문맥에서 파괴·붕괴의 이미지를 지닐 수 있으므로, 영어 POB의 ‘shattered’와 조응하는 ‘산산이 부서졌습니다’를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:07Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 연속된 공적 선포 명령, 깃발을 드는 표상, 바벨론의 함락, 벨과 메로닥 및 우상들의 수치와 파괴를 충실히 반영해야 합니다. 초안의 ‘그들의’는 여성 단수 접미사 -הָ(바벨론을 가리킴)를 복수 소유자로 바꾸므로 수정이 필요합니다. 또한 עֲצַבֶּיהָ와 גִּלּוּלֶיהָ라는 두 표현을 모두 ‘우상들’로 평준화하지 않는 것이 바람직합니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽습니다. 다만 첫 명령군은 ‘알리고 선포하십시오’로, 직접화법을 여는 말은 ‘이렇게 말하십시오’로 다듬으면 현대 표준어에서 더 매끄럽고 원문의 명령 연쇄도 살아납니다.
  terminology: ‘벨’과 ‘메로닥’은 히브리어 본문의 고유명 음역으로 적절합니다. עֲצַבִּים은 ‘우상 형상들’, 경멸적인 גִּלּוּלִים은 ‘우상들’로 구별하고, 후자에 어휘 주석을 연결합니다. 메로닥 관련 주석은 ‘메로닥’에 직접 붙여야 합니다.
  issues:
  - severity: medium
    issue: 각주 a의 앵커가 ‘선포하고’에 붙어 있으나, 주석 내용은 메로닥/마르둑의 이름에 관한 것입니다.
    rationale: 각주 앵커는 주석의 대상어인 ‘메로닥’에 붙어야 독자가 주석의 참조 대상을 정확히 알 수 있습니다.
  - severity: medium
