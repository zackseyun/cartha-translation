review_pass:
  verdict: revise
  source_fidelity: 히브리어 מִקּוֹל은 ‘~의 소리에/그 소식에’를 뜻하며, נִתְפְּשָׂה는 완료형으로 바빌론이 이미 ‘붙잡힘/함락됨’을 가리킵니다. 초안의 ‘사로잡히는 소리가 들리자’는 진행 중인 사건처럼 들리고 ‘소리’의 주체도 다소 어색합니다. נִרְעֲשָׁה와 נִשְׁמָע의 병렬은 땅의 진동과 열방 가운데 들리는 부르짖음을 충실히 전달해야 합니다.
  naturalness: ‘바빌론이 함락되었다는 소리에’는 한국어에서 사건 소식이 미치는 충격을 자연스럽게 표현합니다. ‘진동하고’와 ‘부르짖음’은 예언적·시적 문맥에 어울리면서도 현대 표준어로 무리 없이 읽힙니다. 종결을 ‘들립니다’로 유지하여 합쇼체를 따릅니다.
  terminology: ‘바빌론’은 통용되는 성경 지명 표기입니다. 이 구절에서 נתפש는 도시의 정복·점령 문맥이므로 ‘함락되었다’가 ‘사로잡혔다’보다 자연스럽고 정확합니다. זְעָקָה는 단순한 중립적 ‘외침’보다 고통과 절박함을 담은 ‘부르짖음’이 적절합니다.
  issues:
  - severity: medium
    issue: ‘바빌론이 사로잡히는 소리가 들리자’
    rationale: 원문의 완료형 ‘바빌론이 붙잡혔다/함락되었다’와 달리 진행 중인 사건으로 읽히며, ‘사로잡히는 소리’라는 결합도 자연스럽지 않습니다.
  - severity: low
    issue: ‘여러 민족’
    rationale: הַגּוֹיִם은 정관사가 있는 ‘민족들/열방’을 가리킵니다. ‘여러’는 원문에 없는 불특정 수량의 뉘앙스를 더합니다.
  revised_text: 바빌론이 함락되었다는 소리에 땅이 진동하고, 여러 민족 가운데서 부르짖음이 들립니다.
