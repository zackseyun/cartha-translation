  text: מִ/קּוֹל֙ נִתְפְּשָׂ֣ה בָבֶ֔ל נִרְעֲשָׁ֖ה הָ/אָ֑רֶץ וּ/זְעָקָ֖ה בַּ/גּוֹיִ֥ם נִשְׁמָֽע׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/046.yaml
  text: At the sound of Babylon being captured, the earth quakes, and a cry is heard among the nations.
translation:
  language: ko
  text: 바빌론이 사로잡히는 소리가 들리자 땅이 흔들리고, 여러 민족 가운데서 외침이 들립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקּוֹל
  english_pob_choice: At the sound of
  chosen_korean: ~이 들리자
  alternatives_korean:
  - ~의 소리에
  - 소리가 나자
  lexicon: מִן + קוֹל
  rationale: 원문은 ‘소리로부터/소리 때문에’라는 개시 구문이므로, 한국어에서는 사건이 들려오는 순간을 자연스럽게 드러내는 ‘~이 들리자’로 옮겼습니다.
- source_word: נִתְפְּשָׂה בָבֶל
  english_pob_choice: Babylon being captured
  chosen_korean: 바빌론이 사로잡히는
  alternatives_korean:
  - 바빌론이 붙잡히는
  - 바빌론이 함락되는
  lexicon: נתפש
  rationale: 직역상 ‘붙잡히다/사로잡히다’가 맞지만, 문맥상 도시의 함락을 뜻하므로 ‘사로잡히는’으로 하여 포로가 됨과 점령의 이미지를 함께 살렸습니다.
- source_word: נִרְעֲשָׁה הָאָרֶץ
  english_pob_choice: the earth quakes
  chosen_korean: 땅이 흔들리고
  alternatives_korean:
  - 땅이 떨리고
  - 땅이 진동하고
  lexicon: רעש
  rationale: English POB의 ‘quakes’를 따라, 자연스러운 현대 한국어로 ‘흔들리다’를 택해 지진적 동요를 간결하게 전달했습니다.
- source_word: וּזְעָקָה ... נִשְׁמָע
  english_pob_choice: a cry is heard among the nations
  chosen_korean: 여러 민족 가운데서 외침이 들립니다
  alternatives_korean:
  - 민족들 가운데 외침이 들립니다
  - 나라들 사이에 부르짖음이 들립니다
  lexicon: זעק + נשמע
  rationale: ‘부르짖음/외침’ 가운데 원문의 감정적 강도를 유지하면서, ‘여러 민족 가운데서’로 보편적 파급을 드러냈습니다.
theological_decisions:
- issue: 바빌론 심판의 공적 파급을 어떻게 드러낼지
  chosen_reading: 단순한 지역 사건이 아니라 열방 전체에 들리는 심판의 소식으로 옮겼습니다.
  alternative_readings:
  - 바빌론의 정치적 함락으로만 축소하는 번역
  - 감정적 표현을 완화하는 번역
  rationale: 원문은 바빌론의 함락 소식이 땅과 열방에 미치는 충격을 병렬적으로 제시하므로, 심판의 공적·우주적 울림을 살리는 쪽이 본문 의도에 가깝습니다.
  doctrine_reference: 예언서의 열방 심판 모티프
