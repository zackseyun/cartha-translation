id: JER.50.36
reference: Jeremiah 50:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶ֥רֶב אֶל הַ/בַּדִּ֖ים וְ/נֹאָ֑לוּ חֶ֥רֶב אֶל גִּבּוֹרֶ֖י/הָ וָ/חָֽתּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/036.yaml
  text: A sword is against the diviners[a], and they will become fools; a sword is against her warriors[b], and they will be dismayed.
  footnotes:
  - marker: a
    text: Or 'the liars.' The Hebrew בַּדִּים can refer more broadly to false talkers or deceivers; here 'diviners' is chosen because Jeremiah often targets Babylon's deceptive prognosticators.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will be dismayed.' The Hebrew verb can denote terror or collapse as well as being shattered.
    reason: lexical_alternative
translation:
  language: ko
  text: 칼이 점쟁이들에게 임하니, 그들이 어리석어질 것이며; 칼이 그 여전사들에게 임하니, 그들이 겁에 질릴 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거짓말하는 자들’. 히브리어 בַּדִּים은 더 넓게는 거짓말하는 사람이나 속이는 자를 가리킬 수 있으나, 여기서는 예레미야가 자주 겨냥하는 바벨론의 점술가들을 가리키는 것으로 보아 ‘점쟁이들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들이 겁에 질릴 것입니다’. 히브리어 동사는 두려움, 붕괴, 산산이 부서짐까지도 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב אֶל
  english_pob_choice: A sword is against
  chosen_korean: 칼이 ... 임하니
  alternatives_korean:
  - 칼이 ... 대하여
  - 칼이 ... 맞서
  lexicon: HALOT
  rationale: 히브리어의 짧은 심판 선언을 한국어에서 자연스럽게 살리기 위해 ‘임하니’를 사용해 판결·재앙의 도래를 표현했습니다.
- source_word: הַבַּדִּים
  english_pob_choice: the diviners
  chosen_korean: 점쟁이들
  alternatives_korean:
  - 거짓말하는 자들
  - 예언자들
  - 점술가들
  lexicon: HALOT
  rationale: 본문 주석의 ‘diviners’ 선택을 따라, 예언/점술로 기만하는 집단을 가리키는 현대 한국어로 ‘점쟁이들’을 택했습니다.
- source_word: וְנֹאָלוּ
  english_pob_choice: and they will become fools
  chosen_korean: 그들이 어리석어질 것이며
  alternatives_korean:
  - 그들이 어리석은 자가 될 것이며
  - 그들이 바보가 될 것이며
  lexicon: HALOT
  rationale: 단순한 행동의 어리석음이 아니라 심판으로 인해 ‘어리석어진 상태’가 되는 결과를 살리기 위해 상태 변화를 드러냈습니다.
- source_word: גִּבּוֹרֶיהָ
  english_pob_choice: her warriors
  chosen_korean: 그 여전사들
  alternatives_korean:
  - 그 용사들
  - 그 전사들
  - 그 군사들
  lexicon: HALOT
  rationale: 복수 여성 접미사 -הָ를 반영해 ‘그 여전사들’로 옮겨, 바벨론을 의인화한 문맥과 여성형 소유를 보존했습니다.
- source_word: וָחָתּוּ
  english_pob_choice: and they will be dismayed
  chosen_korean: 그들이 겁에 질릴 것입니다
  alternatives_korean:
  - 그들이 두려워할 것입니다
  - 그들이 부서질 것입니다
  - 그들이 당황할 것입니다
  lexicon: HALOT
  rationale: חתת의 심리적 붕괴 의미를 살리되, 전투 심판 문맥에 맞는 강한 표현으로 옮겼습니다.
theological_decisions:
- issue: 바벨론의 무속적 지혜에 대한 심판 표현
  chosen_reading: ‘점쟁이들’과 ‘어리석어질 것’은 바벨론의 거짓 예지와 그 허망함이 심판으로 드러난다는 뜻으로 유지했습니다.
  alternative_readings:
  - ‘거짓말쟁이들’로 일반화하여 읽는 방식
  - ‘예언자들’로 완화하는 방식
  rationale: 문맥상 이 구절은 바벨론의 점술·예언 체계를 겨냥한 조롱과 심판이므로, 그 종교적·예언적 함의를 희석하지 않는 번역이 필요합니다.
  doctrine_reference: 예언의 참됨과 거짓 예언의 심판
