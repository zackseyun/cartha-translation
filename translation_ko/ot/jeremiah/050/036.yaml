  source_fidelity: 히브리어 הַבַּדִּים는 문맥상 ‘점술가들’로 옮길 수 있으며, וְנֹאָלוּ와 וָחָתּוּ의 미래 심판 선언도 유지되어 있습니다. 그러나 גִּבּוֹרֶיהָ의 여성형은 ‘그녀의/그 성의 용사들’이라는 소유 대상인 바벨론을 가리킬 뿐, 용사들 자체가 여성이라는 뜻이 아닙니다. 따라서 ‘여전사들’은 원문 의미를 좁히는 오류입니다.
  naturalness: 초안은 한 문장 안에서 ‘것이며’와 ‘것입니다’를 섞고 세미콜론을 사용하여 현대 한국어 합쇼체 문장으로 다소 부자연스럽습니다. 평행되는 심판 선언을 짧은 완결문으로 제시하는 편이 자연스럽습니다.
