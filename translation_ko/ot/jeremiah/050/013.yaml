id: JER.50.13
reference: Jeremiah 50:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/קֶּ֤צֶף יְהוָה֙ לֹ֣א תֵשֵׁ֔ב וְ/הָיְתָ֥ה שְׁמָמָ֖ה כֻּלָּ֑/הּ כֹּ֚ל עֹבֵ֣ר עַל בָּבֶ֔ל יִשֹּׁ֥ם וְ/יִשְׁרֹ֖ק עַל כָּל מַכּוֹתֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/013.yaml
  text: Because of the wrath of Yahweh[a], it will not be inhabited, but will become a complete desolation. Everyone who passes by Babylon will be appalled and will hiss over all her wounds.
  footnotes:
  - marker: a
    text: Or 'will whistle'; the Hebrew verb can denote either hissing or whistling, here likely an expression of scorn at Babylon's ruin.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 진노 때문에 그곳은 사람이 살지 않게 되고, 완전히 황폐한 곳이 될 것입니다. 바빌론을 지나는 모든 사람은 놀라고, 그 모든 상처를 두고 쉿 소리를 낼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘쉿 소리를 내다’ 또는 ‘휘파람을 불다’로도 옮길 수 있으며, 여기서는 바빌론의 파멸에 대한 경악이나 조롱의 반응을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֶּצֶף יְהוָה
  english_pob_choice: Because of the wrath of Yahweh
  chosen_korean: 야훼의 진노 때문에
  alternatives_korean:
  - 야훼의 분노 때문에
  - 야훼의 노여움 때문에
  lexicon: HALOT
  rationale: מִן + קֶצֶף는 원인/근거를 나타내므로 ‘때문에’로 옮겼고, קֶצֶף의 강한 심판 뉘앙스를 살리기 위해 ‘진노’를 택했습니다.
- source_word: לֹא תֵשֵׁב
  english_pob_choice: it will not be inhabited
  chosen_korean: 더 이상 사람이 살지 못하고
  alternatives_korean:
  - 거주되지 않고
  - 사람이 살지 않게 되고
  lexicon: HALOT
  rationale: 도시를 대상화한 예언 문맥에서 ‘거주되다’보다 한국어 자연성을 살린 수동적 결과 표현이 적절하여 ‘사람이 살지 못하고’로 옮겼습니다.
- source_word: וְהָיְתָה שְׁמָמָה כֻּלָּהּ
  english_pob_choice: but will become a complete desolation
  chosen_korean: 완전한 황무지가 될 것입니다
  alternatives_korean:
  - 완전한 폐허가 될 것입니다
  - 온전히 황폐해질 것입니다
  lexicon: HALOT
  rationale: שְׁמָמָה는 단순한 빈터가 아니라 황폐한 폐허 상태를 가리키므로 ‘황무지’가 문맥의 파괴성을 잘 드러내며, כֻּלָּהּ의 강화는 ‘완전한’으로 반영했습니다.
- source_word: וְיִשְׁרֹק
  english_pob_choice: will hiss
  chosen_korean: 야유할 것입니다
  alternatives_korean:
  - 쉿 소리를 낼 것입니다
  - 휘파람을 불 것입니다
  lexicon: HALOT
  rationale: שרק은 문자적으로는 ‘휘파람/쉿 소리’이지만 예언 문맥에서는 멸시와 조롱의 반응을 나타내므로, 한국어에서 그 기능을 가장 분명히 드러내는 ‘야유하다’로 옮겼습니다.
- source_word: עַל כָּל מַכּוֹתֶיהָ
  english_pob_choice: over all her wounds
  chosen_korean: 그 모든 상처를
  alternatives_korean:
  - 그 모든 상처 위에
  - 그 모든 타격을
  lexicon: HALOT
  rationale: מַכָּה는 여기서 입은 타격의 결과를 가리키므로, 인격화된 바빌론에 대한 표현을 살려 ‘그 모든 상처’를 선택했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할지
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’으로 대체
  - ‘여호와’로 표기
  rationale: 본문은 יְהוָה를 직접 사용하므로, POB의 번역 원칙에 따라 신적 칭호로 대체하지 않고 고유 이름의 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
