revisions:
- from: 만군의 야훼께서 이렇게 말씀하십니다. 이스라엘의 아들들과 유다의 아들들이 함께 압제당하고 있습니다[a]. 그들을 사로잡은 자들은 모두 그들을 굳게 붙잡고 있으며[b], 놓아주기를 거부합니다.
  to: 만군의 야훼께서 이렇게 말씀하십니다. 이스라엘 자손과 유다 자손은 모두 압제를 받고 있습니다[a][b]. 그들을 사로잡은 자들이 모두 그들을 굳게 붙들고 있으며, 그들을 놓아주기를 거부합니다.
  rationale: 공동체를 가리키는 בְּנֵי를 ‘자손’으로 옮겨 원문의 계보적 표현을 보존하면서도 현대 한국어의 자연스러움을 확보했습니다. יַחְדָּו는 두 집단이 같은 처지에 있음을 나타내는 ‘모두’로 옮겼습니다. 각주 b는 영어 감사 기록에 제시된 이전 병렬 번역을 한국어로 정확히 반영하도록 수정하고, 관련 본문절에 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:26:50Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 בְּנֵי는 이 문맥에서 민족 공동체를 가리키는 관용적 계보 표현이므로, 한국어의 문자적 복수형 ‘아들들’은 실제 남성들만을 뜻하는 듯하여 부정확하고 부자연스럽습니다. ‘자손’이 원문의 계보적 표현과 공동체적 지시를 함께 보존합니다. יַחְדָּו는 두 집단이 동일하게 처한 상태를 나타내므로 ‘모두’가 여기서는 ‘함께’보다 더 분명합니다.
  naturalness: ‘이스라엘의 아들들과 유다의 아들들’은 현대 표준 한국어 성서 문체에서 어색합니다. ‘이스라엘 자손과 유다 자손’ 및 ‘모두 압제를 받고 있습니다’는 합쇼체를 유지하면서 자연스럽습니다. ‘그들을 사로잡은 자들이 모두’는 원문의 כָּל을 자연스럽게 반영합니다.
  terminology: ‘만군의 야훼’와 ‘압제’, ‘사로잡은 자들’, ‘붙들고 있으며’, ‘놓아주기를 거부합니다’는 적절합니다. ‘자손’은 בְּנֵי의 계보·집단 용법을 한국어에서 가장 무리 없이 반영합니다.
  issues:
  - severity: medium
    issue: ‘이스라엘의 아들들과 유다의 아들들’
    rationale: בְּנֵי는 여기서 개별 남성 자녀가 아니라 이스라엘과 유다의 후손들, 곧 각 공동체를 가리킵니다. 한국어 ‘아들들’은 이 의미를 충분히 전달하지 못하고 부자연스럽습니다.
  - severity: low
    issue: 각주 b의 내용과 표지 위치
    rationale: 현 각주 b는 본문 ‘그들을 굳게 붙잡고 있습니다’를 사실상 반복할 뿐 대안 독법을 제시하지 않습니다. 영어 감사 기록의 이전 번역은 앞 절반의 병렬 구조에 관한 것이므로, 그에 맞는 대안 문구와 표지 위치로 바로잡는 것이 좋습니다.
