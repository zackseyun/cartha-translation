source:
  edition: WLC
  text: כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת עֲשׁוּקִ֛ים בְּנֵי יִשְׂרָאֵ֥ל וּ/בְנֵי יְהוּדָ֖ה יַחְדָּ֑ו וְ/כָל שֹֽׁבֵי/הֶם֙ הֶחֱזִ֣יקוּ בָ֔/ם מֵאֲנ֖וּ שַׁלְּחָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/033.yaml
  text: 'Thus says Yahweh of hosts: The sons of Israel and the sons of Judah alike are oppressed[a]; all their captors hold them fast[b]; they refuse to let them go.'
  footnotes:
  - marker: a
    text: Or 'The Israelites and the people of Judah alike are oppressed.'
    reason: lexical_alternative
  - marker: b
    text: Or 'The sons of Israel are oppressed, and the sons of Judah together with them'.
    reason: previous_rendering
translation:
  language: ko
  text: 만군의 야훼께서 이렇게 말씀하십니다. 이스라엘 자손과 유다 자손은 모두 압제를 받고 있습니다[a][b]. 그들을 사로잡은 자들이 모두 그들을 굳게 붙들고 있으며, 그들을 놓아주기를 거부합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 백성과 유다 백성이 모두 압제를 받고 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 자손은 압제를 받고 있으며, 유다 자손도 그들과 함께 그러합니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 야훼 만군
  lexicon: HALOT
  rationale: צְבָאוֹת의 관용적 의미를 살려 '만군의'로 옮기고, 하나님의 이름 יְהוָה는 프로젝트 기본값에 따라 '야훼'로 번역했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל וּבְנֵי יְהוּדָה
  english_pob_choice: The sons of Israel and the sons of Judah
  chosen_korean: 이스라엘의 아들들과 유다의 아들들
  alternatives_korean:
  - 이스라엘 사람들과 유다 사람들
  - 이스라엘 자손들과 유다 자손들
  lexicon: HALOT
  rationale: בְּנֵי의 문자적 형식을 살려 '아들들'로 옮겨, 영어 POB가 보존한 친족적 표현과 원문의 병렬 구조를 반영했습니다.
- source_word: יַחְדָּו
  english_pob_choice: alike
  chosen_korean: 함께
  alternatives_korean:
  - 똑같이
  - 나란히
  lexicon: HALOT
  rationale: 두 집단이 같은 상태에 있다는 뜻이므로, 한국어에서는 자연스러운 '함께'로 처리해 결합된 고통의 상태를 드러냈습니다.
- source_word: הֶחֱזִיקוּ בָם
  english_pob_choice: hold them fast
  chosen_korean: 굳게 붙잡고 있습니다
  alternatives_korean:
  - 단단히 붙들고 있습니다
  - 그들을 놓지 않고 있습니다
  lexicon: HALOT
  rationale: 단순한 접촉이 아니라 포박하듯 붙들어 두는 의미를 살려 '굳게 붙잡다'로 옮겼습니다.
- source_word: שַׁלְּחָם
  english_pob_choice: let them go
  chosen_korean: 놓아주다
  alternatives_korean:
  - 풀어주다
  - 보내다
  lexicon: HALOT
  rationale: 포로의 문맥에서 '보내다'보다 해방의 의미가 분명한 '놓아주다'가 더 직접적입니다.
theological_decisions:
- issue: 예언 선포 서두의 화법
  chosen_reading: ‘이렇게 말씀하십니다’로 시작하는 직접 화법을 유지했습니다.
  alternative_readings:
  - ‘말씀하신다’
  - ‘이르시되’
  rationale: 예언 공식 כֹּה אָמַר의 엄숙한 선언성을 살리되, 현대 한국어 합쇼체에 맞게 자연스럽게 들리도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4
