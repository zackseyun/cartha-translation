id: JER.50.32
reference: Jeremiah 50:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָשַׁ֤ל זָדוֹן֙ וְ/נָפַ֔ל וְ/אֵ֥ין ל֖/וֹ מֵקִ֑ים וְ/הִצַּ֤תִּי אֵשׁ֙ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה כָּל סְבִיבֹתָֽי/ו־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/032.yaml
  text: And the arrogant one will stumble and fall[a], with no one to raise him up; and I will kindle a fire in his cities[b], and it will consume all around him.
  footnotes:
  - marker: a
    text: Or 'pride' or 'insolence'; the Hebrew זָדוֹן is often abstract, but here it is rendered personally as 'the arrogant one' because the surrounding verbs and pronouns are masculine singular.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'his cities.' The verse personifies Babylon as a singular male figure.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 오만한 자는 넘어져 쓰러질 것이며[a], 그를 일으켜 줄 사람이 아무도 없을 것입니다. 나는 그의 성읍들에 불을 지필 것이며[b], 그 불은 그의 사방을 모두 삼킬 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 זָדוֹן은 ‘교만’, ‘오만’, ‘불손함’ 등으로도 옮길 수 있지만, 여기서는 뒤의 단수 남성형 동사와 대명사 때문에 인격화된 표현으로 읽는 것이 자연합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 성읍들’이라고 말하며, 바벨론을 하나의 남성 단수 인물처럼 다룹니다.
    reason: cultural_note
lexical_decisions:
- source_word: זָדוֹן
  english_pob_choice: the arrogant one
  chosen_korean: 오만한 자
  alternatives_korean:
  - 교만
  - 오만
  - 거만한 자
  lexicon: HALOT
  rationale: 추상명사로도 쓰이지만, 여기서는 뒤따르는 단수 남성형 동사·대명사에 맞춰 인격화된 표현으로 읽히므로 ‘오만한 자’가 가장 자연스럽고 원문 의도를 잘 드러냅니다.
- source_word: כָשַׁל וְנָפַל
  english_pob_choice: will stumble and fall
  chosen_korean: 넘어져 쓰러질 것입니다
  alternatives_korean:
  - 비틀거리고 넘어질 것입니다
  - 걸려 넘어지고 쓰러질 것입니다
  - 비틀거리며 넘어질 것입니다
  lexicon: HALOT
  rationale: ‘비틀거리다/넘어지다’의 이미지를 살리되 한국어에서는 중복을 줄여 ‘넘어져 쓰러지다’로 옮기면 심판의 붕괴를 간결하게 전달할 수 있습니다.
- source_word: מֵקִים
  english_pob_choice: to raise him up
  chosen_korean: 그를 일으켜 줄
  alternatives_korean:
  - 그를 일으킬
  - 그를 세워 줄
  - 그를 다시 일으킬
  lexicon: HALOT
  rationale: 넘어진 뒤 다시 세우는 뜻을 살려 ‘일으켜 줄’로 번역했고, 단순한 정치적 회복으로 좁히지 않기 위해 ‘세우다’보다 물리적 이미지가 분명한 표현을 택했습니다.
- source_word: בְּעָרָיו / כָּל סְבִיבֹתָיו
  english_pob_choice: in his cities / all around him
  chosen_korean: 그의 성읍들 / 그의 사방을 모두
  alternatives_korean:
  - 그의 도시들 / 그 둘레를 모두
  - 그의 성읍들 / 그 주변을 모두
  - 그의 성읍들 / 그를 둘러싼 모든 것
  lexicon: HALOT
  rationale: 히브리어의 남성 단수 소유격을 따라 바벨론을 인격화한 표지를 유지했고, ‘사방을 모두’로 불의 파괴 범위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 바벨론의 인격화와 남성 단수 지시를 유지할지 여부
  chosen_reading: 바벨론을 ‘오만한 자’로 인격화하고 ‘그를/그의’라는 남성 단수 지시를 유지했습니다.
  alternative_readings:
  - 무인칭적으로 ‘교만이 넘어질 것이며, 그것을 일으켜 줄 사람이 없을 것입니다’로 옮기기
  - ‘그 성읍들’과 ‘그 주변’에서 중성적 지시로 바꾸기
  rationale: 히브리어는 일관되게 남성 단수형을 사용하여 바벨론을 한 인물처럼 묘사하므로, 이를 평탄화하지 않고 보존하는 것이 본문의 수사와 심판 이미지를 더 투명하게 전달합니다.
  doctrine_reference: 예언서의 의인화 수사와 원문 문법 보존
