  naturalness: ‘화 있을진저, 그들이여’와 ‘왔도다’는 현대 표준어 합쇼체에 맞지 않습니다. 현대적이면서도 예언적 엄숙함을 유지하도록 ‘그들에게 화가 있습니다!’ 및 ‘왔습니다’로 고쳤습니다.
