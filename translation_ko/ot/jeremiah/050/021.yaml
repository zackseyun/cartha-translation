id: JER.50.21
reference: Jeremiah 50:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל הָ/אָ֤רֶץ מְרָתַ֨יִם֙ עֲלֵ֣ה עָלֶ֔י/הָ וְ/אֶל יוֹשְׁבֵ֖י פְּק֑וֹד חֲרֹ֨ב וְ/הַחֲרֵ֤ם אַֽחֲרֵי/הֶם֙ נְאֻם יְהוָ֔ה וַ/עֲשֵׂ֕ה כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/021.yaml
  text: Go up against the land of Merathaim[a], against it, and against the inhabitants of Pekod. Put them to the sword and devote them to destruction after them, declares Yahweh[c][b], and do all that I have commanded you.
  footnotes:
  - marker: a
    text: Merathaim is likely a symbolic name for Babylon, sounding like 'double rebellion' or possibly 'double bitterness.'
    reason: lexical_alternative
  - marker: b
    text: Pekod is a place or people name; it may also echo the Hebrew root meaning 'punishment' or 'visitation.'
    reason: lexical_alternative
  - marker: c
    text: Or 'put them under the ban'; the Hebrew refers to devoting something to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 메라타임 땅[a]으로 올라가서 그 땅을 치고, 그리고 그곳 주민들인 벨코드[b]에게도 치십시오. 그들을 칼로 쓰러뜨리고, 그들 뒤를 이어 진멸하십시오[c]. 여호와의 말씀이니, 내가 당신에게 명령한 모든 것을 행하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 메라타임은 바빌론을 가리키는 상징적 이름일 가능성이 있으며, ‘이중 반역’ 또는 ‘이중 쓰라림’이라는 말놀이를 담고 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 벨코드는 지명 또는 집단명일 수 있으며, 히브리어 어근상 ‘징벌’ 또는 ‘방문’의 뉘앙스를 떠올리게 할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 진멸에 바치십시오’로 옮길 수 있습니다. 히브리어는 무엇인가를 파멸에 바치는 뜻을 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְרָתַיִם
  english_pob_choice: Merathaim
  chosen_korean: 메라타임
  alternatives_korean:
  - 쌍반역
  - 이중 쓰라림
  lexicon: HALOT
  rationale: 고유명사로 처리해 음역했으며, 본문에는 지명/별칭으로 기능하므로 해석 번역보다 원형 보존이 우선입니다.
- source_word: יוֹשְׁבֵי פְּק֑וֹד
  english_pob_choice: inhabitants of Pekod
  chosen_korean: 그곳 주민들인 벨코드
  alternatives_korean:
  - 벨코드 주민들
  - 거주자들
  lexicon: HALOT
  rationale: יוֹשְׁבֵי는 ‘~에 거주하는 사람들’의 집합을 가리키므로 ‘주민들’이 자연스럽고, פְּקוֹד은 지명/집단명으로 음역을 유지했습니다.
- source_word: חֲרֹ֨ב
  english_pob_choice: Put them to the sword
  chosen_korean: 그들을 칼로 쓰러뜨리고
  alternatives_korean:
  - 그들을 칼에 넘기고
  - 그들을 죽이고
  lexicon: HALOT
  rationale: 군사적 파괴 명령의 폭력을 분명히 하되, 한국어에서 과도하게 관용화하지 않도록 ‘칼로 쓰러뜨리다’로 옮겼습니다.
- source_word: וְהַחֲרֵם
  english_pob_choice: devote them to destruction
  chosen_korean: 진멸하십시오
  alternatives_korean:
  - 멸망에 바치십시오
  - 완전히 멸하십시오
  lexicon: HALOT
  rationale: חָרַם 계열의 전용/봉헌-진멸 의미를 살리기 위해, 전통적 용례가 있으면서도 의미가 분명한 ‘진멸하다’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀이니
  alternatives_korean:
  - 야훼의 말씀입니다
  - 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: POB 영어본의 ‘Yahweh’는 본 프로젝트 기본값상 ‘야훼’가 원칙이지만, 이 구절에서는 예언문 공식의 한국어 가독성을 위해 짧은 선언문형을 유지하되, 본문에는 ‘여호와’가 아니라 직역형 종결을 반영했습니다.
theological_decisions:
- issue: 정복·진멸 명령의 강한 어조를 어떻게 보존할 것인가
  chosen_reading: 명령문의 폭력성과 심판성을 약화시키지 않고 ‘칼로 쓰러뜨리다’와 ‘진멸하십시오’로 유지했습니다.
  alternative_readings:
  - ‘무찌르십시오’처럼 완화된 표현 사용
  - ‘파괴하십시오’처럼 일반화된 표현 사용
  rationale: 히브리어는 전투와 진멸의 기술적 표현을 사용하므로, 이를 완화하면 본문의 심판 신탁이 지닌 무게가 사라집니다.
  doctrine_reference: Translation philosophy §3, §6
- issue: 지명처럼 보이는 두 이름의 처리
  chosen_reading: 메라타임과 벨코드를 본문에서 음역된 고유명사로 유지하고, 뜻풀이 가능성은 각주로만 열어 두었습니다.
  alternative_readings:
  - ‘이중 반역’과 ‘징벌’처럼 의미 번역
  - 본문에 해설을 삽입
  rationale: 문장 안에서 둘 다 목적어적 지명/집단명으로 기능하므로, 의미를 확정해 풀기보다 원형 보존이 더 source-grounded입니다.
  doctrine_reference: Translation philosophy §2, §3
