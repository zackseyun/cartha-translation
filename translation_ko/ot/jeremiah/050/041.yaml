id: JER.50.41
reference: Jeremiah 50:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֛ה עַ֥ם בָּ֖א מִ/צָּפ֑וֹן וְ/ג֤וֹי גָּדוֹל֙ וּ/מְלָכִ֣ים רַבִּ֔ים יֵעֹ֖רוּ מִ/יַּרְכְּתֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/041.yaml
  text: Behold[a], a people is coming from the north[b], and a great nation and many kings will be stirred up from the farthest parts of the earth.
  footnotes:
  - marker: a
    text: Or 'will be roused' or 'will awake'; the Hebrew verb suggests being aroused or mobilized for action.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the remote parts of the earth' or 'from the ends of the earth.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 북쪽에서 한 백성이 오고 있습니다. 큰 나라와 많은 왕들이 땅의 가장 먼 곳에서[b] 일어나게 될 것입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일으켜지게 될 것입니다’, ‘깨어나게 될 것입니다’. 히브리어 동사는 자극을 받아 행동하도록 동원되는 뉘앙스를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅끝에서’, ‘땅의 먼 끝에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: HALOT
  rationale: 예언적 주목 표지로서 문어적이면서도 현대 한국어에서 자연스럽게 독자의 시선을 끄는 표현입니다.
- source_word: עַם
  english_pob_choice: a people
  chosen_korean: 한 백성
  alternatives_korean:
  - 한 민족
  - 한 사람들
  lexicon: HALOT
  rationale: 뒤의 גּוֹי גָּדוֹל과 구별되도록 ‘백성’으로 옮겨 사람 집단의 총칭을 살렸습니다.
- source_word: יֵעֹרוּ
  english_pob_choice: will be stirred up
  chosen_korean: 일어나게 될 것입니다
  alternatives_korean:
  - 일으켜질 것입니다
  - 깨어나게 될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 ‘동원되다/자극받아 움직이다’는 뉘앙스를 한국어의 ‘일어나다’로 자연스럽게 옮기되, 미래형으로 예언적 진행을 드러냈습니다.
- source_word: מִיַּרְכְּתֵי אָרֶץ
  english_pob_choice: from the farthest parts of the earth
  chosen_korean: 땅의 가장 먼 곳에서
  alternatives_korean:
  - 땅끝에서
  - 땅의 먼 끝에서
  lexicon: HALOT
  rationale: ‘가장 먼 곳’으로 원문의 최상적 거리감을 살리면서, ‘땅끝’보다 덜 관용적이고 본문의 범위를 분명히 했습니다.
theological_decisions:
- issue: 예언적 현재/미래 감각의 처리
  chosen_reading: ‘오고 있습니다’와 ‘일어나게 될 것입니다’를 함께 써서, 이미 임박한 도래와 장차의 동원을 함께 드러냈습니다.
  alternative_readings:
  - 모여옵니다
  - 일어납니다
  rationale: 히브리어에서 현재적 생동감과 미래 예고가 함께 느껴지므로, 한국어에서도 두 층위를 모두 보존하는 편이 원문 충실도에 유리합니다.
  doctrine_reference: 예언문체의 시제/상 처리
- issue: ‘북쪽’과 ‘땅의 가장 먼 곳’의 긴장
  chosen_reading: 두 지리 표현을 모두 유지해, 특정 역사적 방향성과 보편적 원근감을 동시에 살렸습니다.
  alternative_readings:
  - 북쪽에서 오는 큰 군대
  - 세상의 먼 곳에서
  rationale: 본문은 단순한 지리정보를 넘어 위협의 범위와 규모를 겹쳐 강조하므로, 한쪽으로 평준화하지 않았습니다.
  doctrine_reference: 본문의 수사적 중첩
