id: JER.50.9
reference: Jeremiah 50:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י הִנֵּ֣ה אָנֹכִ֡י מֵעִיר֩ וּ/מַעֲלֶ֨ה עַל בָּבֶ֜ל קְהַל גּוֹיִ֤ם גְּדֹלִים֙ מֵ/אֶ֣רֶץ צָפ֔וֹן וְ/עָ֣רְכוּ לָ֔/הּ מִ/שָּׁ֖ם תִּלָּכֵ֑ד חִצָּי/ו֙ כְּ/גִבּ֣וֹר מַשְׁכִּ֔יל לֹ֥א יָשׁ֖וּב רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/009.yaml
  text: For behold[a], I am stirring up and bringing against Babylon an assembly of great nations from the land of the north. They will array themselves against her; from there she will be captured. Their arrows are like those of a skilled warrior[b]; none returns empty-handed.
  footnotes:
  - marker: a
    text: Or 'Its arrows are like a skilled warrior who does not return empty'; the Hebrew comparison is compressed, and the exact relation between 'arrows' and 'skilled warrior' may be rendered more literally.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from there,' likely referring to the place where the attacking nations draw up against Babylon.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오. 내가 북쪽 땅에서 큰 나라들의 무리를 일으켜 바빌론을 치러 오게 할 것입니다. 그들이 바빌론을 향해 전열을 갖출 것이며, 그곳에서[a] 바빌론은 함락될 것입니다. 그들의 화살은 노련한 용사처럼[b] 헛되이 돌아오지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그곳에서’는 공격하는 나라들이 바빌론을 향해 전열을 갖추는 곳을 가리키는 것으로 보입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 ‘화살’과 ‘노련한 용사’의 비교 관계를 압축하여 표현합니다. 직역에 가깝게는 ‘그들의 화살은 노련한 용사 같아서 헛되이 돌아오지 않는다’라고 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעִיר וּמַעֲלֶה
  english_pob_choice: stirring up and bringing
  chosen_korean: 일으키고 끌어올리고 있습니다
  alternatives_korean:
  - 불러일으키고 데려오고 있습니다
  - 깨우고 올려보내고 있습니다
  lexicon: HALOT
  rationale: 두 히필 분사형은 야훼께서 열방을 전쟁 행위로 동원하시는 인과를 함께 드러내므로, 하나는 ‘일으키고’, 다른 하나는 ‘끌어올리고 있습니다’로 살려 군사적 상승/진군 뉘앙스를 유지했습니다.
- source_word: קְהַל גּוֹיִם גְּדֹלִים
  english_pob_choice: an assembly of great nations
  chosen_korean: 큰 나라들의 회중
  alternatives_korean:
  - 큰 나라들의 모임
  - 강한 나라들의 연합
  lexicon: HALOT
  rationale: קהל의 핵심은 단순한 ‘연합’보다 모인 집단이므로 ‘회중’으로 직역했고, גּוֹיִם גְּדֹלִים은 힘을 덧붙인 해석보다 ‘큰 나라들’로 더 가깝게 옮겼습니다.
- source_word: וְעָרְכוּ לָהּ
  english_pob_choice: They will array themselves against her
  chosen_korean: 그들이 바벨을 향해 진을 칠 것이며
  alternatives_korean:
  - 그들이 그녀를 향해 전열을 갖출 것이며
  - 그들이 바벨에 맞서 전열을 펼칠 것이며
  lexicon: HALOT
  rationale: ערך는 전쟁 문맥에서 진을 치다/전열을 갖추다의 뜻이므로, 현대 한국어에서 자연스럽고 군사적 이미지를 분명히 하는 ‘진을 치다’를 택했습니다.
- source_word: חִצָּיו כְּגִבּוֹר מַשְׁכִּיל לֹא יָשׁוּב רֵיקָם
  english_pob_choice: Their arrows are like those of a skilled warrior; none returns empty-handed
  chosen_korean: 그들의 화살은 능숙한 용사의 화살 같아서, 아무도 빈손으로 돌아오지 않을 것입니다
  alternatives_korean:
  - 그들의 화살은 지혜로운 용사의 화살 같아서, 헛되이 돌아오지 않을 것입니다
  - 그들의 화살은 숙련된 용사의 화살 같아서, 아무도 헛되이 돌아오지 않을 것입니다
  lexicon: HALOT
  rationale: כְּגִבּוֹר מַשְׁכִּיל은 ‘지혜로운/숙련된/능숙한’의 범위가 있으나, 화살이 명중한다는 맥락에서 ‘능숙한 용사’가 가장 자연스럽습니다. רֵיקָם은 ‘빈손으로’라는 관용으로 결과의 성취를 살렸습니다.
theological_decisions:
- issue: 야훼의 주권적 개입
  chosen_reading: 문장은 바벨을 치러 오는 열방의 동원이 야훼의 직접적 행위임을 분명히 드러낸다고 보았습니다.
  alternative_readings:
  - 단순한 예언적 예고로만 읽는 해석
  rationale: 1인칭 ‘내가’와 두 개의 히필 분사가 결합되어 있어, 전쟁의 배후에 있는 하나님의 주권적 주동성을 본문 자체가 강조합니다.
  doctrine_reference: 섭리와 심판의 주권
- issue: 화살과 용사의 비교
  chosen_reading: 화살을 주어로 살리되, ‘능숙한 용사의 화살’로 비교 구조를 자연스럽게 풀었습니다.
  alternative_readings:
  - ‘그의 화살은 능숙한 용사처럼’처럼 화살과 인물을 직접 동일시하는 번역
  rationale: 히브리어는 압축된 비교를 사용하므로, 화살의 효력을 중심으로 한국어에서 비교 관계를 명확히 드러내는 편이 본문의 군사적 긴장을 더 잘 보존합니다.
  doctrine_reference: 문학적 압축과 비유의 보존
