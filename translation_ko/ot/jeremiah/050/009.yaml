revisions:
- from: 보십시오. 내가 바벨에 북쪽 땅에서 온 큰 나라들의 회중을 일으키고 그들을 끌어올리고 있습니다. 그들이 바벨을 향해 진을 칠 것이며, 그곳에서 바벨은 사로잡힐 것입니다. 그들의 화살은 능숙한 용사의 화살 같아서, 아무도 빈손으로 돌아오지 않을 것입니다.[a][b]
  to: 보십시오. 내가 북쪽 땅에서 큰 나라들의 무리를 일으켜 바빌론을 치러 오게 할 것입니다. 그들이 바빌론을 향해 전열을 갖출 것이며, 그곳에서[a] 바빌론은 함락될 것입니다. 그들의 화살은 노련한 용사처럼[b] 헛되이 돌아오지 않을 것입니다.
  rationale: 하나님이 북방의 여러 나라를 동원하여 바빌론을 공격하게 하신다는 히브리어의 사역적·군사적 의미를 자연스러운 합쇼체로 옮겼습니다. 마지막 절은 화살과 용사의 문법적 관계가 압축되어 있는 원문의 모호성을 보존하고, ‘아무도’처럼 원문에 없는 일반적 인물을 넣지 않았습니다. 각주는 관련 어구 뒤에 각각 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:27Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. ‘끌어올리고 있습니다’는 כאן의 군사적 사역 의미를 한국어에서 부자연스럽게 만들며, ‘바벨에’는 ‘바벨을 향하여/바벨을 치러’라는 대적 관계를 충분히 나타내지 못합니다. 또한 마지막 절의 ‘아무도 빈손으로’는 화살/용사의 압축된 비유를 불필요하게 사람 일반으로 바꿉니다.
  naturalness: ‘큰 나라들의 회중’은 현대 한국어에서 교회적·종교적 집단을 먼저 연상시키므로 ‘큰 나라들의 무리’가 자연스럽습니다. ‘노련한 용사처럼 헛되이 돌아오지 않을 것입니다’는 히브리어의 의도적인 압축을 유지하면서도 한국어 문장으로 읽힙니다.
  terminology: ‘바빌론’, ‘북쪽 땅’, ‘전열을 갖추다’, ‘함락되다’는 현대 표준어의 예언·군사 문맥에 적절합니다. ‘회중’은 כאן에서 피하는 것이 좋습니다. 각주 표지는 해당 본문 요소 바로 뒤에 배치하고, 영어 감사 기록의 뒤바뀐 표지 관계를 따르지 않습니다.
  issues:
  - severity: medium
    issue: ‘바벨에 북쪽 땅에서 온 … 끌어올리고 있습니다’
    rationale: מֵעִיר וּמַעֲלֶה는 하나님이 북방의 여러 나라를 일으켜 바빌론을 치도록 오게 하시는 사역을 말합니다. ‘끌어올리다’는 한국어 군사 문맥에서 목적지와 대적 방향을 모호하게 하며, 현재진행형도 예언적 선언에 덜 자연스럽습니다.
  - severity: medium
    issue: ‘큰 나라들의 회중’
    rationale: קְהַל은 집결한 무리를 뜻하지만, ‘회중’은 현대 한국어에서 종교 공동체의 고정적 용례가 강합니다. 의미를 좁히지 않는 ‘무리’가 적절합니다.
  - severity: medium
    issue: ‘아무도 빈손으로 돌아오지 않을 것입니다’
    rationale: 히브리어의 단수형은 화살과 노련한 용사의 관계를 압축하여 표현합니다. ‘아무도’는 본문에 없는 사람 일반을 도입합니다. 화살의 성공적 효과를 가리키는 비유를 유지해야 합니다.
  - severity: low
    issue: 각주 표지의 위치 및 내용
    rationale: 현 초안은 두 표지를 문장 끝에 함께 두어 어느 표현에 대한 주석인지 불명확합니다. ‘그곳에서’와 화살-용사 비교에 각각 직접 붙여야 하며, 각주 내용도 그 표지에 맞춰야 합니다.
