revisions:
- from: 칼이 그의 말들과 그의 병거들과 그의 가운데 있는 모든 혼합 민족에게 닥칠 것이며, 그들은 여자들이 될 것입니다. 칼이 그의 곳간들을 치면, 그것들은 약탈될 것입니다.[a][b]
  to: 칼이 그의 말들과 병거들, 그녀 안에 있는 여러 민족으로 섞여 있는 모든 무리를 대적할 것이며, 그들은 여자들이 될 것입니다.[a] 칼이 그녀의 보물 창고들을 대적할 것이며, 그것들은 약탈될 것입니다.[b]
  rationale: 원문의 두 병렬 심판 선언을 조건절 없이 유지하고, 바벨론을 가리키는 여성형 접미사를 ‘그녀 안에’와 ‘그녀의’로 반영했습니다. 혼합 집단은 용병으로 단정하지 않으면서도 한국어에서 자연스럽게 표현했으며, 각주 표지를 해당 표현 바로 뒤로 옮겼습니다.
