review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복되는 ‘칼이 … 대적한다’라는 심판 선언과 수동태 ‘약탈될 것이다’는 대체로 반영되었으나, 둘째 선언을 조건절 ‘치면’으로 바꾼 것은 원문의 병렬적 선언을 약화합니다. 또한 בְּתוֹכָהּ 및 אוֹצְרֹתֶיהָ의 여성 단수 접미사는 바벨론을 가리키는데 초안의 ‘그의 가운데’와 ‘그의 곳간들’은 이를 일관되게 반영하지 못합니다.
  naturalness: ‘그의 가운데 있는’은 현대 한국어에서 부자연스럽고 지시 대상도 불분명합니다. ‘그 안에 있는’ 및 ‘그녀의 보물 창고들’로 하면 원문의 인칭·성별 표지와 한국어 문장이 모두 더 자연스럽습니다. ‘혼합 민족’보다 ‘섞여 있는 모든 무리’가 한국어로 자연스럽지만, 원문의 집단적 의미를 유지하도록 ‘여러 민족으로 섞여 있는 모든 무리’로 번역할 수 있습니다.
  terminology: חֶרֶב은 두 차례 모두 ‘칼이 … 대적할 것입니다’로 병렬시키는 것이 적절합니다. עֵרֶב은 용병으로 한정하지 않고 혼합된 주민 또는 보조 집단이라는 범위를 보존해야 합니다. אוֹצְרוֹת는 단순한 식량 ‘곳간’보다 부의 저장처를 뜻하는 ‘보물 창고들’이 문맥에 맞습니다. לְנָשִׁים은 본문에서 문자적으로 유지하되, 고대 전쟁 관용 표현에 관한 설명을 각주로 한정하는 것이 적절합니다.
  issues:
  - severity: medium
    issue: 둘째 ‘칼’ 선언을 조건절로 번역함
    rationale: ‘칼이 그의 곳간들을 치면’은 원문에 없는 조건 관계를 도입합니다. 히브리어는 앞 절과 병렬된 독립 심판 선언입니다.
  - severity: medium
    issue: 바벨론을 가리키는 여성 접미사의 불일치
    rationale: בְּתוֹכָהּ(그녀의/그 안에)와 אוֹצְרֹתֶיהָ(그녀의 보물 창고들)는 여성형입니다. 초안의 ‘그의 가운데’와 ‘그의 곳간들’은 원문의 표지 및 같은 절 안의 지시 관계를 흐립니다.
  - severity: low
    issue: 각주 표지가 관련 어구에 붙어 있지 않음
    rationale: ‘여자들이 될 것입니다’의 문화 설명과 ‘곳간들’의 어휘 설명이 모두 문장 끝에 붙어 있어 각각의 참조 대상이 불명확합니다. 해당 어구 바로 뒤에 표지를 두어야 합니다.
  - severity: low
