  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶ֜רֶב אֶל סוּסָ֣י/ו וְ/אֶל רִכְבּ֗/וֹ וְ/אֶל כָּל הָ/עֶ֛רֶב אֲשֶׁ֥ר בְּ/תוֹכָ֖/הּ וְ/הָי֣וּ לְ/נָשִׁ֑ים חֶ֥רֶב אֶל אוֹצְרֹתֶ֖י/הָ וּ/בֻזָּֽזוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/037.yaml
  text: A sword against his horses and against his chariots[a], and against all the mixed people in her midst, and they will become women. A sword against her treasuries[b], and they will be plundered.
  footnotes:
  - marker: a
    text: Or 'all the foreign mercenaries' or 'all the mixed multitude.' The Hebrew likely refers to a mixed population or auxiliary forces within Babylon.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'and they will become women,' an ancient idiom for becoming fearful or losing courage in battle.
    reason: cultural_note
translation:
  language: ko
  text: 칼이 그의 말들과 그의 병거들과 그의 가운데 있는 모든 혼합 민족에게 닥칠 것이며, 그들은 여자들이 될 것입니다. 칼이 그의 곳간들을 치면, 그것들은 약탈될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그들은 여자들이 될 것입니다’는 고대 전쟁 관용구로, 전투에서 겁을 먹거나 용기를 잃는다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: ‘곳간들’은 히브리어 복수형 저장소를 살린 번역입니다. 문맥상 바벨론의 재산과 축적물을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב
  english_pob_choice: A sword against
  chosen_korean: 칼이 … 닥칠 것이며 / 칼이 … 치면
  alternatives_korean:
  - 칼이 … 대적하여
  - 칼이 … 임할 것입니다
  lexicon: HALOT
  rationale: 예언적 심판 선언문의 압축된 어법을 살리되, 한국어에서는 자연스럽게 공격의 도래를 드러내는 동사를 보완했습니다.
- source_word: כָּל הָעֶרֶב
  english_pob_choice: all the mixed people
  chosen_korean: 모든 혼합 민족
  alternatives_korean:
  - 모든 섞인 무리
  - 모든 외국 용병들
  - 모든 혼합된 사람들
  lexicon: HALOT
  rationale: 어근의 ‘섞인/혼합된’ 뜻을 보존하면서도, 문맥상 바벨론 내부의 혼합 집단을 무리하게 용병으로 한정하지 않도록 했습니다.
- source_word: וְהָיוּ לְנָשִׁים
  english_pob_choice: and they will become women
  chosen_korean: 그들은 여자들이 될 것입니다
  alternatives_korean:
  - 그들은 여자들처럼 될 것입니다
  - 그들은 겁쟁이가 될 것입니다
  lexicon: HALOT
  rationale: 본문의 문자적 표현을 본문에 유지해 성별 표지를 지우지 않았습니다. 전쟁 맥락의 관용구라는 해석은 본문이 아니라 주석으로만 보완하는 편이 원문에 충실합니다.
- source_word: אוֹצְרֹתֶיהָ
  english_pob_choice: her treasuries
  chosen_korean: 그의 곳간들
  alternatives_korean:
  - 그의 보물창고들
  - 그의 창고들
  - 그의 재물
  lexicon: HALOT
  rationale: 바벨론의 부를 저장하는 장소라는 점을 살리면서, 개인화된 대명사에 맞춰 복수형 저장소의 이미지를 자연스럽게 옮겼습니다.
- source_word: וּבֻזָּזוּ
  english_pob_choice: and they will be plundered
  chosen_korean: 약탈될 것입니다
  alternatives_korean:
  - 노략질될 것입니다
  - 빼앗길 것입니다
  lexicon: HALOT
  rationale: 수동적 결과를 간명하게 표현하는 전형적 심판 어휘이므로 ‘약탈되다’가 가장 직접적입니다.
theological_decisions:
- issue: ‘여자들이 될 것입니다’라는 전쟁 관용구의 처리
  chosen_reading: 문자적 표현을 본문에 유지하고, 의미 해설은 본문 밖에서만 다룰 수 있도록 했습니다.
  alternative_readings:
  - ‘겁을 먹을 것입니다’
  - ‘여자들처럼 될 것입니다’
  rationale: 히브리어는 실제로 ‘여자들’이라고 말하며, 남성 중심 고대 전쟁 수사라는 긴장을 지우지 않는 것이 원문을 더 정직하게 드러냅니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §4
