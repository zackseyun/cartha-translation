  yaml_path: translation/ot/jeremiah/050/003.yaml
  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
  footnotes:
  - marker: a
    text: Or 'From human to beast.' The Hebrew idiom means that every living inhabitant, human and animal alike, has departed.
    reason: lexical_alternative
translation:
  language: ko
  text: 북쪽에서 한 나라가 그곳을 치러 올라왔으므로, 그 땅을 황폐하게 만들 것이며 그 안에는 주민이 없을 것입니다. 사람에서 짐승에 이르기까지 그들은 도망쳐 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람에서 짐승에 이르기까지’는 사람과 짐승 모두, 곧 모든 생명체가 떠났음을 뜻하는 히브리어 관용구입니다.
    reason: source_note
