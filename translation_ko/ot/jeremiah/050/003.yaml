  text: For a nation has come up against her from the north; it will make her land a desolation[a], and there will be no inhabitant in it. From man to beast, they have fled; they have gone away.
  footnotes:
  - marker: a
    text: Or 'From human to beast.' The Hebrew idiom means that every living inhabitant, human and animal alike, has departed.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 나라가 북쪽에서 올라와 그를 치겠으니, 그의 땅을 황무지로 만들 것이며 그 안에는 주민이 없을 것입니다. 사람에서 짐승에 이르기까지 그들은 도망쳐 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람에서 짐승에 이르기까지’는 모든 생명체가 떠났다는 히브리어 관용구를 옮긴 것입니다.
    reason: source_note
