id: JER.50.30
reference: Jeremiah 50:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן יִפְּל֥וּ בַחוּרֶ֖י/הָ בִּ/רְחֹבֹתֶ֑י/הָ וְ/כָל אַנְשֵׁ֨י מִלְחַמְתָּ֥/הּ יִדַּ֛מּוּ בַּ/יּ֥וֹם הַ/ה֖וּא נְאֻם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/030.yaml
  text: Therefore her young men will fall in her streets[a], and all her warriors will be silenced on that day, declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'all her warriors will perish.' The Hebrew verb can mean 'be silenced' or, in context, imply being stilled in death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그 성읍의 젊은 남자들은 그 거리에서 쓰러질 것이며, 그의 모든 전사들은 그날에 잠잠해질 것입니다. 야훼의 말씀이니라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 전사들은 죽을 것이다.’ 히브리어 동사는 ‘잠잠해지다’의 뜻도 있고, 문맥상 죽음으로 인한 정지를 함의할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이 때문에
  lexicon: HALOT
  rationale: 앞선 심판 예언과의 인과 관계를 분명히 잇는 접속사로 ‘그러므로’가 가장 자연스럽고 형식도 유지합니다.
- source_word: בַחוּרֶיהָ
  english_pob_choice: her young men
  chosen_korean: 그 성읍의 젊은 남자들
  alternatives_korean:
  - 그 성읍의 청년들
  - 그의 젊은 전사들
  lexicon: HALOT
  rationale: בחור는 단순한 ‘청년’보다 전투 가능 연령의 젊은 남성을 가리킬 수 있어, 군사적 문맥을 살리되 과도하게 군사화하지 않도록 옮겼습니다.
- source_word: יִדַּמּוּ
  english_pob_choice: will be silenced
  chosen_korean: 잠잠해질 것입니다
  alternatives_korean:
  - 침묵하게 될 것입니다
  - 사라질 것입니다
  - 죽임을 당할 것입니다
  lexicon: HALOT
  rationale: 동사의 기본 의미인 ‘잠잠해지다/침묵하다’를 살리면서, 전쟁 심판 문맥에서 죽음의 함의를 문맥으로 들리게 했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 문학적 예언 공식은 현대 한국어에서 ‘~의 말씀이니라’로 간결하게 전달할 수 있으며, יְהוָה는 본문 기준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה(야훼) 이름 표기
  chosen_reading: 본문의 신적 고유명사는 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 титուլ이 아니라 언약적 신명(יהוה)을 사용하므로, 이름 자체를 드러내는 번역이 स्रोत의 구분을 가장 분명히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: יִדַּמּוּ의 죽음 함의 처리
  chosen_reading: ‘잠잠해질 것입니다’로 번역해 침묵 이미지와 심판의 결과를 함께 살렸습니다.
  alternative_readings:
  - 죽을 것입니다
  - 전멸될 것입니다
  rationale: 히브리어는 ‘침묵하다/고요해지다’의 어휘 이미지를 유지하면서도 전쟁 심판에서는 죽음까지 함의할 수 있어, 모호성을 과도하게 해소하지 않는 방향을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
