  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
  footnotes:
  - marker: a
    text: Or 'the people of Israel ... and the people of Judah together.' The Hebrew literally says 'the children of Israel' and 'the children of Judah.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats the idea of going: literally, ''going and weeping, they will go,'' expressing ongoing movement accompanied by tears.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날들과 그때에[a], 야훼의 말씀입니다. 이스라엘 자손, 그들과 유다 자손이 함께[b] 올 것입니다. 그들은 가면서 울며 갈 것이며[c], 그들의 하나님이신 야훼를 찾을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그 날들’과 ‘그때’라는 두 시간 표현을 함께 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘이스라엘 자손’과 ‘유다 자손’을 구별하여 말하며, ‘그들’은 이스라엘 자손을 강조하여 다시 가리킵니다.
    reason: source_note
  - marker: c
    text: 원문은 ‘가다’라는 말을 반복하여, 울음과 함께 계속 움직이는 모습을 강조합니다.
    reason: lexical_alternative
