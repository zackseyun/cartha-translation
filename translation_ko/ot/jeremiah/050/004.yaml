  rationale: 직설적 예언 구문을 살리기 위해 관형적 번역보다 독립된 선포문으로 옮겼고, יְהוָה는 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  english_pob_choice: the children of Israel ... and the children of Judah
  chosen_korean: 이스라엘 자손이, 곧 유다 자손과 함께
  alternatives_korean:
  - 이스라엘의 자손이, 그리고 유다의 자손이
