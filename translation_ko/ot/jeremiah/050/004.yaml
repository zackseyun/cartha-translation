  lexicon: HALOT
  rationale: 히브리어의 동작 반복과 지속성을 한국어에서는 자연스러운 부사구로 압축해, ‘가다’의 반복과 ‘울다’를 모두 보존했습니다.
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  english_pob_choice: and they will seek Yahweh their God
  chosen_korean: 야훼 그들의 하나님을 찾을 것입니다
  alternatives_korean:
  - 야훼 그들의 하나님을 구할 것입니다
  - 야훼 그들의 하나님을 찾고자 할 것입니다
  lexicon: HALOT
  rationale: בקש의 종교적 의미를 한국어의 ‘찾다’로 옮겨, 단순 탐색이 아니라 관계 회복을 향한 추구를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼로 직접 옮겨, 인용된 예언 구문에서도 고유한 신명을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 יְהוָה를 직접 사용하므로, 제목이나 호칭으로 완화하지 않고 고유명사를 유지하는 것이 소스-직역 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘과 유다의 동시 회복
  chosen_reading: 두 집단을 구별한 채 함께 돌아오게 했습니다.
  alternative_readings:
  - ‘이스라엘’로 일반화
  - 교회론적으로 재해석
  rationale: 본문은 역사적 언약 공동체의 분리와 재결합을 함께 말하므로, 그 긴장을 풀지 않고 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
