source:
  edition: WLC
  text: בַּ/יָּמִ֨ים הָ/הֵ֜מָּה וּ/בָ/עֵ֤ת הַ/הִיא֙ נְאֻם יְהוָ֔ה יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל הֵ֥מָּה וּ/בְנֵֽי יְהוּדָ֖ה יַחְדָּ֑ו הָל֤וֹךְ וּ/בָכוֹ֙ יֵלֵ֔כוּ וְ/אֶת יְהוָ֥ה אֱלֹהֵי/הֶ֖ם יְבַקֵּֽשׁוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/004.yaml
  text: In those days and at that time[a], declares Yahweh, the children of Israel will come, they and the children of Judah together. Going and weeping, they will go[b], and they will seek Yahweh their God.
  footnotes:
  - marker: a
    text: Or 'the people of Israel ... and the people of Judah together.' The Hebrew literally says 'the children of Israel' and 'the children of Judah.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats the idea of going: literally, ''going and weeping, they will go,'' expressing ongoing movement accompanied by tears.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그날들과 그때에[a] — 야훼의 말씀이니라 — 이스라엘 자손이, 곧 유다 자손과 함께[b] 돌아오리니, 울며 가면서 야훼 그들의 하나님을 찾을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘그날들과 그때’라는 이중 시간표현을 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘이스라엘 자손’과 ‘유다 자손’을 별도로 말하며, 여기서는 함께 돌아오는 것으로 제시합니다.
    reason: source_note
lexical_decisions:
- source_word: בַּיָּמִים הָהֵמָּה וּבָעֵת הַהִיא
  english_pob_choice: In those days and at that time
  chosen_korean: 그날들과 그때에
  alternatives_korean:
  - 그날들과 그 시기에
  - 그때와 그 시기에
  lexicon: HALOT
  rationale: 예언문에서 자주 나오는 이중 시간표현을 한국어에서도 둘로 살려, 종말론적·회복적 분위기를 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: — 야훼의 말씀이니라 —
  alternatives_korean:
  - — 야훼께서 말씀하십니다 —
  - — 야훼의 선언입니다 —
  lexicon: HALOT
  rationale: 직설적 예언 구문을 살리기 위해 관형적 번역보다 독립된 선포문으로 옮겼고, יְהוָה는 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל ... וּבְנֵי יְהוּדָה
  english_pob_choice: the children of Israel ... and the children of Judah
  chosen_korean: 이스라엘 자손이, 곧 유다 자손과 함께
  alternatives_korean:
  - 이스라엘의 자손이, 그리고 유다의 자손이
  - 이스라엘 백성이며 유다 백성과 함께
  lexicon: HALOT
  rationale: ‘자손’은 בְּנֵי의 혈연·공동체적 이미지를 보존하며, ‘곧 …와 함께’로 두 집단의 병렬과 재결합을 드러냈습니다.
- source_word: הָלוֹךְ וּבָכוֹ יֵלֵכוּ
  english_pob_choice: Going and weeping, they will go
  chosen_korean: 울며 가면서
  alternatives_korean:
  - 울며 계속 가리니
  - 가면서 울고
  lexicon: HALOT
  rationale: 히브리어의 동작 반복과 지속성을 한국어에서는 자연스러운 부사구로 압축해, ‘가다’의 반복과 ‘울다’를 모두 보존했습니다.
- source_word: וְאֶת יְהוָה אֱלֹהֵיהֶם יְבַקֵּשׁוּ
  english_pob_choice: and they will seek Yahweh their God
  chosen_korean: 야훼 그들의 하나님을 찾을 것입니다
  alternatives_korean:
  - 야훼 그들의 하나님을 구할 것입니다
  - 야훼 그들의 하나님을 찾고자 할 것입니다
  lexicon: HALOT
  rationale: בקש의 종교적 의미를 한국어의 ‘찾다’로 옮겨, 단순 탐색이 아니라 관계 회복을 향한 추구를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼로 직접 옮겨, 인용된 예언 구문에서도 고유한 신명을 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 יְהוָה를 직접 사용하므로, 제목이나 호칭으로 완화하지 않고 고유명사를 유지하는 것이 소스-직역 원칙에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 이스라엘과 유다의 동시 회복
  chosen_reading: 두 집단을 구별한 채 함께 돌아오게 했습니다.
  alternative_readings:
  - ‘이스라엘’로 일반화
  - 교회론적으로 재해석
  rationale: 본문은 역사적 언약 공동체의 분리와 재결합을 함께 말하므로, 그 긴장을 풀지 않고 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
