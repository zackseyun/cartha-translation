id: JER.50.7
reference: Jeremiah 50:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כָּל מוֹצְאֵי/הֶ֣ם אֲכָל֔וּ/ם וְ/צָרֵי/הֶ֥ם אָמְר֖וּ לֹ֣א נֶאְשָׁ֑ם תַּ֗חַת אֲשֶׁ֨ר חָטְא֤וּ לַֽ/יהוָה֙ נְוֵה צֶ֔דֶק וּ/מִקְוֵ֥ה אֲבֽוֹתֵי/הֶ֖ם יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/007.yaml
  text: All who found them devoured them[a], and their adversaries said, “We are not guilty, because they sinned against Yahweh, the habitation of righteousness[b], the hope of their fathers—Yahweh.”
  footnotes:
  - marker: a
    text: Or “the habitation of righteousness.” The Hebrew נְוֵה can denote a pasture, abode, or dwelling place.
    reason: lexical_alternative
  - marker: b
    text: Or “the expectation of their fathers.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들을 찾아낸 모든 자들은 그들을 집어삼켰습니다[a]. 그들의 대적들은 말했습니다. “우리는 죄가 없습니다. 그들이 의의 거처이시며[b] 그들의 조상들의 소망이신 야훼께 죄를 지었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들을 찾아낸 자들’입니다. ‘그들을 만난 자들’ 또는 ‘그들을 발견한 자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문 נְוֵה는 ‘거처, 처소’ 또는 ‘목장, 풀밭’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מוֹצְאֵיהֶם אֲכָלוּם
  english_pob_choice: All who found them devoured them
  chosen_korean: 그들을 만난 자들은 모두 그들을 집어삼켰고
  alternatives_korean:
  - 그들을 찾은 자들은 모두 그들을 먹어 삼켰고
  - 그들을 발견한 자들은 모두 그들을 삼켰고
  lexicon: WLC; HALOT
  rationale: מוֹצְאֵיהם은 ‘그들을 찾아낸/만난 자들’이라는 뜻의 실질적 명사구이며, אֲכָלוּם의 파괴적 비유를 한국어 ‘집어삼키다’로 살려 자연스럽게 옮겼습니다.
- source_word: וְצָרֵיהֶם אָמְרוּ לֹא נֶאְשָׁם
  english_pob_choice: and their adversaries said, “We are not guilty”
  chosen_korean: 그들의 적들은 「우리는 죄가 없습니다」라고 말했습니다
  alternatives_korean:
  - 그들의 대적들은 「우리는 죄가 없습니다」라고 말했습니다
  - 그들의 원수들은 「우리는 죄책이 없습니다」라고 말했습니다
  lexicon: WLC; HALOT
  rationale: צָרֵיהֶם은 단순한 적대 관계를 가리키므로 ‘적들’이 가장 직접적입니다. לֹא נֶאְשָׁם은 책임 부인으로, 한국어에서는 ‘죄가 없습니다’가 가장 간명합니다.
- source_word: חָטְאוּ לַיהוָה
  english_pob_choice: they sinned against Yahweh
  chosen_korean: 그들이 야훼께 죄를 지었기 때문입니다
  alternatives_korean:
  - 그들이 야훼께 죄를 범했기 때문입니다
  - 그들이 야훼를 거슬러 죄를 지었기 때문입니다
  lexicon: WLC; HALOT
  rationale: חטא + ל는 ‘~에게/을 향해 죄짓다’의 관용구이므로, ‘야훼께 죄를 지었다’가 가장 직접적입니다.
- source_word: נְוֵה צֶדֶק
  english_pob_choice: the habitation of righteousness
  chosen_korean: 의의 풀밭이시며
  alternatives_korean:
  - 의의 거처이시며
  - 의의 주거이시며
  lexicon: WLC; HALOT
  rationale: נְוֵה는 목축 이미지가 강한 ‘풀밭/목장’까지 포괄할 수 있어, 본문 맥락과 English audit의 최종 회귀를 따라 ‘풀밭’으로 살렸습니다. 다만 자연스러운 문장성을 위해 주격 서술형으로 옮겼습니다.
- source_word: מִקְוֵה אֲבוֹתֵיהֶם
  english_pob_choice: the hope of their fathers
  chosen_korean: 그들의 조상들의 희망이신
  alternatives_korean:
  - 그들의 조상들의 소망이신
  - 그들의 조상들의 기대이신
  lexicon: WLC; HALOT
  rationale: מִקְוֶה는 ‘희망/소망’의 뜻이 가능하며, 여기서는 뒤의 יהוה와 함께 야훼의 호칭으로 기능하므로 한국어도 형용사적 호칭으로 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC; HALOT
  rationale: 테트라그람마톤은 프로젝트 기본값에 따라 ‘야훼’로 옮겨, 신명 자체를 가리는 전통적 대체어를 피했습니다.
theological_decisions:
- issue: 문장 끝의 연쇄 호칭 נְוֵה צֶדֶק וּמִקְוֵה אֲבוֹתֵיהֶם יְהוָה의 처리
  chosen_reading: 두 표현은 모두 야훼를 가리키는 호칭으로 읽고, 마지막 ‘야훼’로 종결되는 구조를 살렸습니다.
  alternative_readings:
  - ‘의의 풀밭’과 ‘조상들의 희망’이 서로 다른 대상에 대한 별칭일 수 있음
  - 지리적·상징적 표현으로만 처리할 수 있음
  rationale: 구문상 ‘그들이 야훼께 죄를 지었다’ 뒤에 이어지는 병렬 구문이며, 절의 종결이 שוב יהוה로 닫히므로, 두 명사를 야훼의 호칭으로 보는 것이 가장 자연스럽습니다.
  doctrine_reference: Jeremiah 50:7 syntactic apposition; divine-name rendering policy
- issue: 직접화법의 인용부호 안에서의 담화체
  chosen_reading: 적들의 자기변호는 직접화법으로 처리하고, 본문 인용은 평서체 합쇼체를 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓸 수 있음
  - 인용부호 없이 문장화할 수 있음
  rationale: 히브리어의 אָמְרוּ와 이어지는 말은 발화 내용이 분명하므로 직접 인용이 본문의 긴장을 가장 잘 보존합니다.
  doctrine_reference: Korean style/register policy
