source:
  edition: WLC
  text: וְ/הָיְתָ֥ה כַשְׂדִּ֖ים לְ/שָׁלָ֑ל כָּל שֹׁלְלֶ֥י/הָ יִשְׂבָּ֖עוּ נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/010.yaml
  text: And Chaldea will become plunder[a]; all who plunder her will have their fill[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the Chaldeans'; the Hebrew form is plural, but here it likely stands for the land/power of Chaldea, as suggested by the following 'her.'
    reason: lexical_alternative
  - marker: b
    text: Or 'will be satisfied.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 갈대아는 노략물이 될 것입니다[a]. 그를 노략하는 자마다 모두 배부를 것입니다[b] — 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갈대아인들’. 히브리어 형태는 복수이지만, 여기서는 뒤의 ‘그를’이 보여 주듯 갈대아의 땅/정권을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘만족할 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  english_pob_choice: And ... will become
  chosen_korean: 그리고 ... 될 것입니다
  alternatives_korean:
  - 그리고 ... 되겠습니다
  - 그리고 ... 입니다
  lexicon: HALOT
  rationale: 예언적 미래를 자연스럽게 살리면서, 상태 전환을 나타내는 문맥상 ‘될 것입니다’가 ‘노략물이 될’이라는 결과를 가장 분명하게 드러냅니다.
- source_word: כַשְׂדִּים
  english_pob_choice: Chaldea
  chosen_korean: 갈대아
  alternatives_korean:
  - 갈대아인들
  - 바벨론
  lexicon: HALOT
  rationale: 영어 POB의 판단처럼 여기서는 민족명보다 땅/정권을 가리키는 용법이므로, 한국어도 지리·정치 실체를 드러내는 ‘갈대아’로 옮겼습니다.
- source_word: יִשְׂבָּעוּ
  english_pob_choice: will have their fill
  chosen_korean: 배부를 것입니다
  alternatives_korean:
  - 만족할 것입니다
  - 흡족할 것입니다
  lexicon: HALOT
  rationale: 노략의 문맥에서 ‘배부를 것입니다’가 단순한 심리적 만족보다 약탈로 얻는 충족을 더 직접적으로 전달합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언문 공식어의 선언성을 살리되, 본문에 직접 드러난 신적 화행을 한국어 관용에 맞게 ‘말씀입니다’로 압축했습니다.
theological_decisions:
- issue: יהוה(YHWH)의 음역
  chosen_reading: 야훼
  alternative_readings:
