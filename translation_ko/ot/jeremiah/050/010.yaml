  rationale: 본 프로젝트의 표준에 따라 언약적 신명은 ‘야훼’로 일관되게 드러내어, 본문이 직접 사용하는 고유 신명성을 보존합니다.
  doctrine_reference: 'POB doctrine: יְהוָה YHWH'
