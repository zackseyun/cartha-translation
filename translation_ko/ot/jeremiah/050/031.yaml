base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/031.yaml
  text: Behold[a], I am against you, O arrogant one, declares the Lord GOD of hosts, for your day has come[b], the time when I will punish you.
  footnotes:
  - marker: a
    text: Or 'O proud one' or 'O insolent one.' The Hebrew זָדוֹן names Babylon by its arrogance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the time I visited you'; here 'visited' carries the sense of calling to account in judgment, hence 'punish you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 내가 너를 대적한다, 교만한 자야[a]. 만군의 주 여호와의 말씀입니다. 네 날이 왔으니, 내가 너를 벌할 때가 되었다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교만한 자’ 또는 ‘거만한 자’. 히브리어 זָדוֹן은 교만을 뜻하며, 여기서는 바벨론을 가리키는 호칭입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 ‘내가 너를 찾아간 때’라고 합니다. 여기서 ‘찾아가다’는 심판을 위해 책임을 묻는다는 뜻이므로, ‘너를 벌할 때’로 옮겼습니다.
    reason: lexical_alternative
