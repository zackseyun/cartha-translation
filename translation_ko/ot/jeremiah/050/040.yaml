  text: As when God overthrew Sodom and Gomorrah and their neighboring towns[a], declares Yahweh, no man will live there[b], and no son of man will dwell in her.
  footnotes:
  - marker: a
    text: 'Hebrew: ''her neighbors''; that is, the neighboring towns or settlements associated with Sodom and Gomorrah.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''no human being will dwell in her.'' Hebrew: ''no son of man will dwell in her.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님이 소돔과 고모라와 그 이웃 도시들을 무너뜨리신 것처럼[a], 야훼의 선언입니다. 그곳에는 아무 남자도 살지 않을 것이며[b], 아무 인자도 그곳에 머물지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그 이웃들’입니다. 여기서는 소돔과 고모라에 속하거나 인접했던 도시들, 곧 주변 정착지를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아무 인간도 그곳에 살지 않을 것이다.’ 히브리어는 직역하면 ‘아무 인자도 그곳에 머물지 않을 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּ/מַהְפֵּכַת אֱלֹהִים
  english_pob_choice: As when God overthrew
  chosen_korean: 하나님이 ... 무너뜨리신 것처럼
  alternatives_korean:
  - 하나님이 ... 뒤엎으신 것처럼
  - 하나님이 ... 전복하신 것처럼
  lexicon: HALOT
  rationale: 비교 표지 כְּ를 살려 ‘...처럼’으로 옮기고, מַהְפֵּכָה의 재난적 ‘뒤집음/전복’ 의미를 한국어에서 자연스러운 심판 서술인 ‘무너뜨리다’로 표현했습니다.
- source_word: שְׁכֵנֶיהָ
  english_pob_choice: their neighboring towns
  chosen_korean: 그 이웃 도시들
  alternatives_korean:
  - 그 이웃들
  - 그 주변 마을들
  lexicon: HALOT
  rationale: 직역하면 ‘그의 이웃들’이지만 문맥상 소돔과 고모라 주변의 정착지/도시들을 가리키므로, 영어 POB의 해석을 따라 집합적 의미를 드러냈습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 선언입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 말씀입니다
  lexicon: HALOT
  rationale: 예언서의 공식 구문을 한국어에서 단정적인 선포로 살리기 위해 ‘선언입니다’를 택했고, 신명은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: לֹא יֵשֵׁב שָׁם אִישׁ ... לֹא יָגוּר בָּהּ בֶּן אָדָם
  english_pob_choice: no man will live there ... no son of man will dwell in her
  chosen_korean: 그곳에는 아무 남자도 살지 않을 것이며[b], 아무 인자도 그곳에 머물지 않을 것입니다.
  alternatives_korean:
  - 그곳에는 아무도 살지 않을 것이며
  - 그곳에는 아무 사람도 거주하지 않을 것이며
  lexicon: HALOT
  rationale: אִישׁ과 בֶּן אָדָם의 남성 일반어를 보존하여 POB의 성별-정확한 구성을 따랐고, יֵשֵׁב/יָגוּר는 심판의 황폐 구문에 맞게 ‘살다/머물다’로 구분했습니다.
