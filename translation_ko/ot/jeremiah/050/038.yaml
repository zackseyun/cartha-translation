  naturalness: ‘그분의 물들’, ‘두려운 것들에 대하여 미쳐 날뜁니다’는 현대 표준 한국어로 부자연스럽거나 지시 대상이 불명확합니다. ‘그 물에 가뭄이 닥쳐’ 및 ‘무서운 것들 때문에 광란합니다’가 합쇼체 문장으로 자연스럽습니다.
  terminology: פְּסִלִים은 ‘조각한 우상들’로 옮겨 구체성을 보존했습니다. אֵימִים은 ‘무서운 것들’로 두어 공포의 대상 일반과 두려운 우상이라는 문맥적 가능성을 모두 열어 두었습니다. יִתְהֹלָלוּ는 비이성적 광분을 나타내는 ‘광란합니다’로 번역했습니다.
