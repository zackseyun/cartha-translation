- from: 그분의 물들에 대한 칼이 임하고, 그것들이 마를 것입니다. 그것은 새긴 우상들의 땅이기 때문입니다. 그리고 그들은 두려운 것들에 대하여 미쳐 날뜁니다.[a][b]
