id: JER.50.38
reference: Jeremiah 50:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֹ֥רֶב אֶל מֵימֶ֖י/הָ וְ/יָבֵ֑שׁוּ כִּ֣י אֶ֤רֶץ פְּסִלִים֙ הִ֔יא וּ/בָ/אֵימִ֖ים יִתְהֹלָֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/038.yaml
  text: A drought is against her waters[a], and they will dry up, for it is a land of carved idols[b], and they are mad over terrifying things.
  footnotes:
  - marker: a
    text: Or, 'A drought is against her waters, and they will dry up.' The Hebrew חֹרֶב can mean 'sword' or 'drought/dryness,' and the verse may intentionally echo both ideas.
    reason: alternative_reading
  - marker: b
    text: Or, 'they act mad over terrors' / 'they rave over dreadful idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그분의 물들에 대한 칼이 임하고, 그것들이 마를 것입니다. 그것은 새긴 우상들의 땅이기 때문입니다. 그리고 그들은 두려운 것들에 대하여 미쳐 날뜁니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가뭄이 그분의 물들에 임하고 그것들이 마를 것입니다.’ 히브리어 חֹרֶב은 ‘칼’ 또는 ‘가뭄/건조함’을 뜻할 수 있으며, 이 절은 두 의미를 의도적으로 함께 울릴 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그들은 두려움들에 대해 미쳐 날뜁니다’ / ‘두려운 우상들에 대해 광란합니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹרֶב
  english_pob_choice: A sword
  chosen_korean: 칼
  alternatives_korean:
  - 가뭄
  - 건조함
  lexicon: HALOT
  rationale: 문맥상 심판의 도구를 가리키는 표현으로 읽어 ‘칼’로 옮기되, 히브리어의 ‘가뭄/건조함’ 가능성은 본문 어휘의 긴장을 훼손하지 않도록 각주로 보존했습니다.
- source_word: מֵימֶיהָ
  english_pob_choice: her waters
  chosen_korean: 그분의 물들
  alternatives_korean:
  - 그 땅의 물들
  - 그 도시의 물들
  lexicon: HALOT
  rationale: 히브리어 여성형 소유격을 한국어에서 직접적으로 살리기 어려워, 인칭 지시를 유지하면서도 대상의 의인화를 드러내는 표현을 택했습니다.
- source_word: פְּסִלִים
  english_pob_choice: carved idols
  chosen_korean: 새긴 우상들
  alternatives_korean:
  - 새긴 형상들
  - 조각한 우상들
  lexicon: HALOT
  rationale: פְּסִלִים의 구체적 의미인 ‘새긴/깎은 우상’을 살려, 전통적이지만 다소 낡은 ‘조각상’보다 직접적인 ‘새긴 우상들’로 옮겼습니다.
- source_word: יִתְהֹלָלוּ
  english_pob_choice: they rave
  chosen_korean: 미쳐 날뜁니다
  alternatives_korean:
  - 광란합니다
  - 미쳐 날뛰며 떠듭니다
  lexicon: HALOT
  rationale: 히브리어의 격렬하고 비이성적인 행동을 현대 한국어의 강한 동사로 옮겨, 우상숭배의 광분이라는 뉘앙스를 드러냈습니다.
theological_decisions:
- issue: חֹרֶב의 이중 가능성(칼/가뭄) 보존
  chosen_reading: 본문에는 심판의 도구로 읽히는 ‘칼’을 두되, 히브리어가 ‘가뭄/건조함’도 뜻할 수 있는 긴장은 각주로 남겼습니다.
  alternative_readings:
  - 가뭄
  - 건조함
  rationale: 예레미야의 심판 어법에서는 ‘칼’이 자연스럽고, 바로 뒤의 ‘마를 것입니다’와도 의미상의 울림을 이룹니다. 동시에 물이 마르는 결과가 곧바로 제시되므로, 어휘적 중의성은 보존할 가치가 있습니다.
  doctrine_reference: '번역 원칙 §3: 실제로 존재하는 해석상의 긴장은 본문과 주석에서 함께 유지한다.'
