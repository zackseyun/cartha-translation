  rationale: 히브리어 복수 명령형 כִּרְתוּ의 촉박하고 단호한 심판 톤을 보존하기 위해, 예언서의 선포체를 그대로 살렸습니다.
  doctrine_reference: 'POB translation philosophy: source-directed force preservation'
