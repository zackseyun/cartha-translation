  text: כִּרְת֤וּ זוֹרֵ֨עַ֙ מִ/בָּבֶ֔ל וְ/תֹפֵ֥שׂ מַגָּ֖ל בְּ/עֵ֣ת קָצִ֑יר מִ/פְּנֵי֙ חֶ֣רֶב הַ/יּוֹנָ֔ה אִ֤ישׁ אֶל עַמּ/וֹ֙ יִפְנ֔וּ וְ/אִ֥ישׁ לְ/אַרְצ֖/וֹ יָנֻֽסוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/016.yaml
  text: Cut off from Babylon the sower[a], and the one who handles the sickle at the time of harvest. Because of the sword of the oppressor, each man will turn to his own people, and each will flee to his own land.
  footnotes:
  - marker: a
    text: Or, “the sword of the oppressing one.” The Hebrew expression has also been taken by some as “the cruel sword,” and less likely, more literally, “the sword of the dove.”
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론에서 파종하는 자와 추수 때에 낫을 잡는 자를 끊어 내십시오. 압제자의 칼 때문에 각 사람은 자기 백성에게로 돌아가고, 각자 자기 땅으로 도망할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “압제하는 자의 칼”로 볼 수 있습니다. 이 히브리어 표현은 “잔인한 칼”로 이해되기도 하며, 덜 유력하지만 더 문자적으로는 “비둘기의 칼”로도 옮겨집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְתוּ
  english_pob_choice: Cut off
  chosen_korean: 끊어 내십시오
  alternatives_korean:
  - 끊으십시오
  - 제거하십시오
  - 끊어 버리십시오
  lexicon: HALOT
  rationale: 심판 맥락의 כרת를 한국어 명령형으로 옮기되, 단순히 ‘죽이다’로 과도하게 구체화하지 않고 제거/제외의 강한 의미를 살렸습니다.
- source_word: זוֹרֵעַ / וְתֹפֵשׂ מַגָּל
  english_pob_choice: the sower / the one who handles the sickle
  chosen_korean: 파종하는 자와 추수 때에 낫을 잡는 자
  alternatives_korean:
  - 씨 뿌리는 자와 낫을 잡는 자
  - 파종자와 추수꾼
  - 씨 뿌리는 자와 거둠에 낫을 잡는 자
  lexicon: HALOT
  rationale: 두 분사구를 직역하되, ‘낫을 잡는 자’로 수확 노동자의 이미지와 히브리어의 손에 쥠(תפשׂ)을 함께 살렸습니다.
- source_word: מִפְּנֵי חֶרֶב הַיּוֹנָה
  english_pob_choice: Because of the sword of the oppressor
  chosen_korean: 압제자의 칼 때문에
  alternatives_korean:
  - 압제하는 자의 칼 때문에
  - 압제자의 칼로 말미암아
  - 포학한 칼 때문에
  lexicon: HALOT
  rationale: POB의 해석대로 יונה를 ‘압제하는 자’로 이해해, 동사의 의미를 살린 소유격 표현으로 옮겼습니다. ‘칼 때문에’는 מִפְּנֵי의 인과를 자연스럽게 드러냅니다.
- source_word: אִישׁ אֶל עַמּוֹ / וְאִישׁ לְאַרְצוֹ
  english_pob_choice: each man will turn to his own people / and each will flee to his own land
  chosen_korean: 각 사람은 자기 백성에게로 돌아가고, 각자 자기 땅으로 도망할 것입니다
  alternatives_korean:
  - 각 사람은 자기 백성에게로 돌아서고, 각자 자기 땅으로 달아날 것입니다
  - 사람마다 자기 백성에게로 돌아가고, 각각 자기 땅으로 도망할 것입니다
  - 각 사람은 자기 백성에게로 돌아가고, 각 사람은 자기 땅으로 피할 것입니다
  lexicon: HALOT
  rationale: איש의 분배적 용법을 ‘각 사람/각자’로 살리되, ‘turn’은 귀환의 방향 전환으로 보고 ‘돌아가다’로 자연스럽게 옮겼습니다. ‘flee’는 ‘도망하다’로 강한 탈주 의미를 유지했습니다.
theological_decisions:
- issue: 명령형의 대상과 등록
  chosen_reading: 예언적 심판 선언으로서 복수 명령형을 현대 한국어 공적 어조의 명령문으로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화
  - 간청형으로 조정
  rationale: 히브리어 복수 명령형 כִּרְתוּ의 촉박하고 단호한 심판 톤을 보존하기 위해, 예언서의 선포체를 그대로 살렸습니다.
  doctrine_reference: 'POB translation philosophy: source-directed force preservation'
