  source_fidelity: 수정이 필요합니다. 초안은 כידון을 넓은 의미의 ‘창’으로 옮긴 점은 가능하지만, ‘투창’이 활과 구별되는 이 무기의 성격을 더 잘 드러냅니다. 또한 עָרוּךְ는 옷차림이 아니라 군사적 배치·정렬을 뜻하므로 ‘차려입은’은 부정확합니다. עָלַיִךְ의 적대적 방향은 ‘너를 향해’로 보존했습니다.
  naturalness: 초안의 ‘전투를 위해 차려입은 한 사람처럼’은 한국어에서 수식 관계가 어색하고 군사 장면으로 이해되기 어렵습니다. ‘전투를 위하여 한 사람처럼 전열을 갖추고’는 현대 표준어 합쇼체에서 자연스럽고 원문의 집단적 군사 배치도 전달합니다.
  terminology: ‘바빌론의 딸’은 시적 의인화와 직접 호칭을 보존하므로 유지했습니다. ‘자비를 베풀지 않습니다’는 לֹא יְרַחֵמוּ를 자연스럽고 격식 있게 옮깁니다. 각주 표지는 ‘한 사람처럼’에 붙여야 하며, 바다의 포효에 붙어 있던 기존 표지는 잘못된 위치였습니다.
