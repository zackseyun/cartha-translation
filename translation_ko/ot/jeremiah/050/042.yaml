id: JER.50.42
reference: Jeremiah 50:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: קֶ֣שֶׁת וְ/כִידֹ֞ן יַחֲזִ֗יקוּ אַכְזָרִ֥י הֵ֨מָּה֙ וְ/לֹ֣א יְרַחֵ֔מוּ קוֹלָ/ם֙ כַּ/יָּ֣ם יֶהֱמֶ֔ה וְ/עַל סוּסִ֖ים יִרְכָּ֑בוּ עָר֗וּךְ כְּ/אִישׁ֙ לַ/מִּלְחָמָ֔ה עָלַ֖יִ/ךְ בַּת בָּבֶֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/042.yaml
  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
  footnotes:
  - marker: a
    text: Or 'like one man,' emphasizing the army's unified formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 활과 창을 잡습니다. 그들은 잔인하며 자비를 보이지 않습니다. 그들의 소리는 바다처럼 울려 퍼지고[a], 말들을 타고 전투를 위해 차려입은 한 사람처럼[b] 바빌론의 딸을 향해 나아갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사람처럼’이라는 뜻으로, 군대의 일사불란한 진형을 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘전투를 위해 한 사람처럼’입니다. 히브리어의 단수 형식을 보존한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  english_pob_choice: bow
  chosen_korean: 활
  alternatives_korean:
  - 활들
  lexicon: HALOT
  rationale: 무기명사로서 단수형이 집합적으로 쓰였으므로 한국어도 자연스러운 단수형 ‘활’로 옮겼습니다.
- source_word: כִידֹן
  english_pob_choice: javelin
  chosen_korean: 창
  alternatives_korean:
  - 창날
  - 투창
  lexicon: HALOT
  rationale: 활과 짝을 이루는 투척·찌르기 무기이므로, 한국어에서는 가장 직접적인 대응인 ‘창’으로 옮겼습니다.
- source_word: יֶהֱמֶה
  english_pob_choice: roars like the sea
  chosen_korean: 바다처럼 울려 퍼지고
  alternatives_korean:
  - 바다처럼 요란하게 울리고
  - 바다처럼 으르렁거리고
  lexicon: HALOT
  rationale: 군대의 소리를 바다의 큰 울림에 비유하는 동사를 한국어의 자연스러운 청각 이미지로 살렸습니다.
- source_word: עָרוּךְ כְּ/אִישׁ לַ/מִּלְחָמָה
  english_pob_choice: arrayed like a man for battle
  chosen_korean: 전투를 위해 차려입은 한 사람처럼
  alternatives_korean:
  - 전투를 위해 정렬된 한 사람처럼
  - 전쟁을 위해 준비된 한 사람처럼
  lexicon: HALOT
  rationale: ‘עָרוּךְ’의 군사적 ‘정렬/차림’과 ‘כְּאִישׁ’의 단수 형식을 함께 보이기 위해 ‘차려입은 한 사람처럼’으로 옮겨 형식과 이미지 둘 다 보존했습니다.
- source_word: בַּת בָּבֶל
  english_pob_choice: daughter Babylon
  chosen_korean: 바빌론의 딸
  alternatives_korean:
  - 바빌론 딸
  - 오 바빌론의 딸
  lexicon: HALOT
  rationale: 도시/백성에 대한 시적 의인화와 직접 호칭을 살리되, 한국어에서는 소유격 구조가 가장 자연스러워 ‘바빌론의 딸’로 옮겼습니다.
theological_decisions:
- issue: כְּאִישׁ의 단수 형식과 군대의 집단적 움직임
  chosen_reading: ‘한 사람처럼’을 본문에 반영하되, 집단적 정렬 뉘앙스는 문맥으로 드러나게 했습니다.
  alternative_readings:
  - ‘한 사람처럼’
  - ‘한 몸처럼’
  - ‘한 사람씩’
  rationale: 히브리어는 문법적으로 단수형 ‘사람’을 유지하므로 이를 지우지 않고, 군대의 일사불란한 움직임은 ‘전투를 위해 차려입은’과 문맥으로 전달했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy, point 4
