  text: They seize bow and javelin; they are cruel and will show no mercy. Their sound roars like the sea[a], and they ride on horses, arrayed like a man for battle against you, daughter Babylon.
  footnotes:
  - marker: a
    text: Or 'like one man,' emphasizing the army's unified formation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 활과 투창을 들고 있습니다. 그들은 잔인하고 자비를 베풀지 않습니다. 그들의 소리는 바다처럼 포효하며, 그들은 말을 타고 전투를 위하여 한 사람처럼[a] 전열을 갖추고 바빌론의 딸아, 너를 향해 나아옵니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 몸처럼’. 군대가 일사불란하게 전열을 갖춘 모습을 뜻할 수 있습니다.
    reason: lexical_alternative
