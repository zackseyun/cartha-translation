id: JER.50.11
reference: Jeremiah 50:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י תשמחי כִּ֣י תעלזי שֹׁסֵ֖י נַחֲלָתִ֑/י כִּ֤י תפושי כְּ/עֶגְלָ֣ה דָשָׁ֔ה ו/תצהלי כָּ/אֲבִּרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/011.yaml
  text: Because you rejoice[a], because you exult, plunderers of my inheritance, because you frolic like a threshing heifer and neigh like stallions[b],
  footnotes:
  - marker: a
    text: Or 'Because you rejoice, because you exult.' The Hebrew particle כִּי can be read causally, but here it is rendered concessively ('though') to fit the taunting flow into the announcement of judgment.
    reason: lexical_alternative
  - marker: b
    text: '''My inheritance'' may also be rendered ''my heritage,'' referring to the people and/or land belonging to the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 너희가 기뻐하고[a] 환희에 차며, 내 기업[b]을 약탈하는 자들아, 타작하는 암송아지처럼 날뛰고 수말들처럼 울어 대기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כִּי는 이 절에서 세 차례 반복됩니다. 문맥상 약탈자들의 행동을 뒤따르는 심판 선언의 근거로 제시하므로, 본문에서는 전체를 ‘-기 때문입니다’라는 인과 표현으로 옮겼습니다. 양보적으로 ‘비록 …할지라도’로 이해할 가능성도 제기됩니다.
    reason: alternative_reading
  - marker: b
    text: ‘내 기업’은 ‘내 유산’ 또는 ‘내 소유’로도 옮길 수 있습니다. 히브리어는 하나님께 속한 백성과 땅을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תשמחי / תעלזי
  english_pob_choice: you rejoice / you exult
  chosen_korean: 기뻐하고 / 흥청거리며
  alternatives_korean:
  - 즐거워하고 / 환희하며
  - 기뻐하며 / 크게 기뻐하며
  lexicon: HALOT
  rationale: 두 동사는 반복된 기쁨을 나타내므로, 첫째는 기본 감정인 '기뻐하다'로, 둘째는 더 들뜬 동작성을 살린 '흥청거리다'로 옮겨 히브리어의 격한 반복을 살렸습니다.
- source_word: שֹׁסֵי
  english_pob_choice: plunderers
  chosen_korean: 노략질하는 자들
  alternatives_korean:
  - 약탈하는 자들
  - 노략군들
  lexicon: HALOT
  rationale: פּעל 동사의 분사형은 단순한 파괴보다 약탈 행위를 가리키므로, 문맥상 가장 직접적인 '노략질하는 자들'이 적절합니다.
- source_word: נַחֲלָתִי
  english_pob_choice: my inheritance
  chosen_korean: 내 기업
  alternatives_korean:
  - 내 상속
  - 내 유산
  lexicon: HALOT
  rationale: 히브리어 נחלה는 언약적 소유, 곧 백성과 땅을 포함한 '기업'의 의미를 가지므로 한국어 성경에서 널리 쓰이는 '기업'이 원문의 함의를 잘 보존합니다.
- source_word: כְּעֶגְלָה דָשָׁה
  english_pob_choice: like a threshing heifer
  chosen_korean: 타작하는 암송아지처럼
  alternatives_korean:
  - 곡식을 밟는 암송아지처럼
  - 타작마당의 암송아지처럼
  lexicon: HALOT
  rationale: 타작의 농경 이미지를 직접 드러내기 위해 '타작하는 암송아지'로 옮겼으며, 동작성과 비유가 한국어에서도 자연스럽게 읽히도록 했습니다.
- source_word: וְתַצְהֲלִי כָּאַבִּירִים
  english_pob_choice: and neigh like stallions
  chosen_korean: 수말들처럼 울어대는구나
  alternatives_korean:
  - 종마처럼 울부짖는구나
  - 준마들처럼 히히거리느니라
  lexicon: HALOT
  rationale: צהל은 말의 울음소리를 가리키므로 '울어대다'로 옮겨 소리를 직접 살렸고, אַבִּירִים은 힘센 수말로 이해해 '수말들'로 구체화했습니다.
theological_decisions:
- issue: 죄의 대상화와 심판의 조롱 어조
  chosen_reading: 예루살렘/유다를 멸망시킨 바빌론을 향한 조롱 섞인 심판 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 역사 서술
  - 일반적 교만에 대한 교훈
  rationale: 연속된 2인칭 여성 단수와 동물 비유는 실제 가해자에 대한 예언자적 조롱을 형성하므로, 심판 선언의 공격적 수사를 약화시키지 않았습니다.
  doctrine_reference: 예언서의 심판 신탁과 보복의 수사
- issue: 직설적 감탄을 보존하는 종결
  chosen_reading: 마지막을 '-는구나'로 처리해 히브리어의 조롱/탄식 톤을 살렸습니다.
  alternative_readings:
  - '''-합니다''로 중화'
  - '''-하도다''의 고전식 표현'
  rationale: 본문은 단순 묘사가 아니라 상대를 겨냥한 예언적 조롱이므로, 현대 합쇼체 안에서 감탄적 종결을 유지하는 편이 원문 효과를 잘 전달합니다.
  doctrine_reference: 예언 시의 수사와 담화 기능
