  source_fidelity: 히브리어의 반복된 כִּי는 이 문맥에서 뒤따르는 심판 선언의 근거를 제시하는 인과적 연결로 보는 것이 가장 자연스럽습니다. 초안의 ‘그렇지만’은 반복된 인과 표지와 맞지 않으며, 양보로 보더라도 ‘그렇지만’ 하나로 처리하면 구문의 대응이 불분명해집니다. ‘타작하는 암송아지’, 약탈자라는 호칭, 말의 울음 비유는 유지할 수 있습니다.
  naturalness: ‘흥청거리며’는 현대어이지만 다소 구어적·유흥적 연상이 강하여 예언시의 격식 있는 조롱 어조에는 ‘환희에 차며’가 더 적합합니다. 또한 ‘-는구나’는 합쇼체 종결이 아니므로, 인과 구문을 완결하는 ‘-기 때문입니다’로 고쳤습니다.
  terminology: ‘내 기업’은 נחלה의 언약적 소유·유산 의미를 한국어 성경 어휘로 적절히 전달합니다. ‘수말들’은 אַבִּירִים의 힘센 말이라는 문맥적 의미를 무리 없이 반영합니다.
