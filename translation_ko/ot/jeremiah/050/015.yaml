id: JER.50.15
reference: Jeremiah 50:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הָרִ֨יעוּ עָלֶ֤י/הָ סָבִיב֙ נָתְנָ֣ה יָדָ֔/הּ נָֽפְלוּ֙ אשויתי/ה נֶהֶרְס֖וּ חֽוֹמוֹתֶ֑י/הָ כִּי֩ נִקְמַ֨ת יְהוָ֥ה הִיא֙ הִנָּ֣קְמוּ בָ֔/הּ כַּ/אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/015.yaml
  text: Raise a shout against her all around[a]; she has given her hand; her foundations have fallen, her walls are torn down. For it is the vengeance of Yahweh—take vengeance on her; as she has done[b], do to her.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'she has surrendered.' Literally, 'she has given her hand.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term may refer to defensive structures such as buttresses, bulwarks, or foundations.
    reason: lexical_alternative
translation:
  language: ko
  text: 사방에서 그녀를 향해 함성을 지르십시오. 그녀가 손을 내주었습니다[a]. 그녀의 기초들이 무너지고[b], 그녀의 성벽이 허물어졌습니다. 이는 야훼의 복수이기 때문입니다. 그녀에게 복수하십시오. 그녀가 행한 대로 그녀에게 행하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그녀가 손을 내주었습니다’입니다. 이 관용구는 문맥상 항복 또는 복종을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 이 표현은 뜻이 불확실하며, 기초들, 버팀 구조물들, 보루들 등 성벽과 관련된 구조물을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִיעוּ עָלֶיהָ סָבִיב
  english_pob_choice: Raise a shout against her all around
  chosen_korean: 사방에서 그에게 함성을 지르십시오
  alternatives_korean:
  - 그에게 사방으로 외치십시오
  - 사방에서 그에게 전쟁 함성을 올리십시오
  lexicon: HALOT
  rationale: 군사적 포위 맥락의 명령형을 살려 ‘함성을 지르다’로 옮기고, סָבִיב의 둘러싼 느낌은 ‘사방에서’로 표현했습니다.
- source_word: נָתְנָה יָדָהּ
  english_pob_choice: she has given her hand
  chosen_korean: 그가 손을 내밀었습니다
  alternatives_korean:
  - 그가 항복했습니다
  - 그가 손을 내주었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자성을 완전히 지우지 않으면서도, 문맥상 항복·복종을 드러내도록 ‘손을 내밀다’로 옮겼습니다.
- source_word: אשויתיה
  english_pob_choice: her buttresses
  chosen_korean: 그의 버팀목
  alternatives_korean:
  - 그의 기초들
  - 그의 보루들
  - 그의 성루들
  lexicon: HALOT
  rationale: 어휘가 불확실하므로 단정적인 건축 용어보다, 성벽과 병렬되는 방어 구조를 폭넓게 가리킬 수 있는 ‘버팀목’을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 고유 신명사 יְהוָה는 본문 원어를 드러내는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: נִקְמַת יְהוָה הִיא / הִנָּקְמוּ בָהּ
  english_pob_choice: For it is the vengeance of Yahweh—take vengeance on her
  chosen_korean: 이는 야훼의 복수이기 때문입니다. 그에게 복수하십시오
  alternatives_korean:
  - 이는 야훼의 보복이기 때문입니다. 그에게 보복하십시오
  - 이는 야훼께서 복수하시는 일이기 때문입니다. 그에게 복수하십시오
  lexicon: HALOT
  rationale: נִקְמָה 계열의 보응·응징 의미를 ‘복수’로 유지해, 개인 감정의 보복이 아니라 신적 न्याय적 응징이라는 긴장을 살렸습니다.
theological_decisions:
- issue: 해당 구절의 명령문이 누구를 향하는지
  chosen_reading: 본문의 3인칭 여성 대상은 바빌론을 가리키므로, 한국어에서도 동일하게 3인칭 ‘그/그에게’로 유지했습니다.
  alternative_readings:
  - 그녀/그녀에게
  - 바빌론을 향해
  rationale: 히브리어는 도시를 여성형으로 의인화합니다. 이를 노골적으로 ‘그녀’로만 고정하기보다, 한국어에서는 도시를 지시하는 3인칭으로 유지해 의인화와 지시 대상을 함께 보존했습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘손을 내밀다’ 관용구 처리
  chosen_reading: 주석 없이 본문에서는 ‘손을 내밀었습니다’로 두고, 항복의 함의를 문맥으로 드러냈습니다.
  alternative_readings:
  - 그가 항복했습니다
  - 그가 항복의 표시로 손을 내밀었습니다
  rationale: 히브리어 표현의 문자성과 문맥적 의미 사이의 긴장을 보존하기 위해, 의미를 과도하게 평준화하지 않는 쪽을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
