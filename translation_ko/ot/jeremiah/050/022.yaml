  text: ק֥וֹל מִלְחָמָ֖ה בָּ/אָ֑רֶץ וְ/שֶׁ֖בֶר גָּדֽוֹל׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/022.yaml
  text: The sound of war is in the land[a], and great destruction.
  footnotes:
  - marker: a
    text: Or 'A sound of war in the land, and a great crash.' The Hebrew noun שֶׁבֶר can carry the sense of 'breaking,' 'crash,' or 'ruin,' depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 전쟁의 소리가 이 땅에 있고, 큰 파멸이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “전쟁의 소리가 이 땅에 있고, 큰 붕괴가 있습니다.” 히브리어 명사 שֶׁבֶר은 문맥에 따라 ‘깨짐’, ‘붕괴’, ‘파멸’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל
  english_pob_choice: The sound of
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 울림
  - 소리
  lexicon: HALOT
  rationale: 전투 상황에서 קוֹל은 사람의 ‘목소리’보다 들려오는 ‘소리’로 옮기는 것이 자연스럽습니다.
- source_word: מִלְחָמָה
  english_pob_choice: war
  chosen_korean: 전쟁
  alternatives_korean:
  - 전투
  - 전쟁
  - 전쟁 상태
  lexicon: HALOT
  rationale: מִלְחָמָה의 넓은 의미를 살려, 대규모 충돌을 뜻하는 ‘전쟁’이 가장 직접적입니다.
- source_word: בָּאָרֶץ
  english_pob_choice: in the land
  chosen_korean: 이 땅에
  alternatives_korean:
  - 그 땅에
  - 이 나라에
  - 땅에
  lexicon: HALOT
  rationale: 문맥상 특정한 지역/영역을 가리키므로, 한국어에서는 ‘이 땅에’가 가장 자연스럽고 범위를 과도하게 좁히지 않습니다.
- source_word: וְשֶׁבֶר גָּדוֹל
  english_pob_choice: and great destruction
  chosen_korean: 큰 파멸
  alternatives_korean:
  - 큰 붕괴
  - 큰 파괴
  - 큰 파멸
  lexicon: HALOT
  rationale: שֶׁבֶר은 문자적으로는 ‘깨짐’이지만, 심판 맥락에서는 ‘파멸/파괴’의 뜻이 강하므로 결과를 분명히 드러내는 ‘파멸’이 적절합니다.
theological_decisions:
- issue: שֶׁבֶר의 의미 범위
  chosen_reading: 단순한 물리적 ‘깨짐’보다 전쟁이 낳는 심판적 ‘파멸’로 옮겼습니다.
  alternative_readings:
  - 큰 붕괴
  - 큰 파괴
  - 큰 깨짐
  rationale: 예언 문맥에서 이 어휘는 재난의 결과를 강조하므로, 한국어에서도 심판의 무게가 드러나게 해야 합니다.
  doctrine_reference: 예언서의 심판 언어
