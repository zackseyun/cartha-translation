source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֞ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִ֥י פֹקֵ֛ד אֶל מֶ֥לֶךְ בָּבֶ֖ל וְ/אֶל אַרְצ֑/וֹ כַּ/אֲשֶׁ֥ר פָּקַ֖דְתִּי אֶל מֶ֥לֶךְ אַשּֽׁוּר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/018.yaml
  text: 'Therefore thus says Yahweh of hosts[a], the God of Israel: Behold, I am about to punish the king of Babylon and his land, just as I punished the king of Assyria.'
  footnotes:
  - marker: a
    text: Or 'I will visit/call to account the king of Babylon and his land ... as I visited/called to account the king of Assyria.' The Hebrew verb פקד can mean 'visit,' 'attend to,' or 'call to account'; here it carries a punitive sense in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. "보십시오, 내가 바빌론 왕과 그의 땅을 벌하겠습니다. 내가 앗시리아 왕을 벌한 것과 같이 말입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פקד는 ‘방문하다’, ‘돌보다’, ‘책임을 묻다/벌하다’의 뜻을 가질 수 있으며, 이 구절에서는 문맥상 심판의 의미를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이에
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 문맥에서 이어지는 결론을 나타내므로, 현대 한국어에서 가장 자연스러운 인과 연결어인 ‘그러므로’로 옮겼습니다.
- source_word: יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh of hosts, the God of Israel
  chosen_korean: 만군의 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 야훼 하나님, 이스라엘의 하나님
  - 만군의 주, 이스라엘의 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값대로 ‘야훼’로, צְבָאוֹת은 관용적이면서도 의미를 살리는 ‘만군의’로, אֱלֹהֵי יִשְׂרָאֵל은 직역하여 ‘이스라엘의 하나님’으로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold, I am about to
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 내가 이제
  lexicon: HALOT
  rationale: הִנְנִי의 주의를 끄는 기능과 임박한 행동의 뉘앙스를 살리기 위해 ‘보십시오’로 시작해 곧 이어지는 ‘내가’와 결합했습니다.
- source_word: פֹקֵד
  english_pob_choice: punish
  chosen_korean: 벌하겠습니다
  alternatives_korean:
  - 징벌하겠습니다
  - 문책하겠습니다
  - 벌을 내리겠습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘방문’이 아니라 심판적 처분이므로, 현대어에서 자연스럽고 판정적인 ‘벌하다’를 사용했습니다.
- source_word: כַּאֲשֶׁר פָּקַדְתִּי
  english_pob_choice: just as I punished
  chosen_korean: 벌한 것과 같이 말입니다
  alternatives_korean:
  - 벌한 것처럼 말입니다
  - 문책한 것과 같이 말입니다
  lexicon: HALOT
  rationale: 앞의 פֹקֵד와 같은 어근을 반복해 심판의 대응 관계를 드러내되, 한국어에서는 과도한 반복을 피하면서도 비교 구조를 분명히 했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 신명기 이름 יְהוָה를 ‘야훼’로 음역했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 하나님의 고유 이름을 대체 칭호로 바꾸지 않고, 예언문맥의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: פֹקֵד의 심판적 의미
  chosen_reading: ‘벌하다’로 옮겨 심판 선언의 성격을 분명히 했습니다.
  alternative_readings:
  - 방문하다
  - 불러 계산하다
  - 책임을 묻다
  rationale: 바빌론과 앗시리아를 병행해 언급하는 문맥에서 פקד는 구원적 방문이 아니라 징벌적 개입을 뜻하므로, 독자가 예언의 경고성을 바로 이해하도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
