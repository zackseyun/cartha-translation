id: JER.50.29
reference: Jeremiah 50:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַשְׁמִ֣יעוּ אֶל בָּבֶ֣ל רַ֠בִּים כָּל דֹּ֨רְכֵי קֶ֜שֶׁת חֲנ֧וּ עָלֶ֣י/הָ סָבִ֗יב אַל יְהִי פְּלֵטָ֔ה שַׁלְּמוּ לָ֣/הּ כְּ/פָעֳלָ֔/הּ כְּ/כֹ֛ל אֲשֶׁ֥ר עָשְׂתָ֖ה עֲשׂוּ לָ֑/הּ כִּ֧י אֶל יְהוָ֛ה זָ֖דָה אֶל קְד֥וֹשׁ יִשְׂרָאֵֽל־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/029.yaml
  text: Summon many against Babylon[a], all who bend the bow; encamp around her on every side; let there be no escape. Repay her according to her work; according to all that she has done, do to her. For she has acted arrogantly against Yahweh, against the Holy One of Israel.
  footnotes:
  - marker: a
    text: Or 'let there be no survivor' / 'let there be no escaped remnant.' The Hebrew פְּלֵטָה can denote escape or those who escape.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨에 맞서 많은 무리를 불러모으고, 활 쏘는 자들 모두를 부르십시오. 그 사방에 진을 치고, 빠져나갈 길이 없게 하십시오. 그녀가 한 일에 따라 갚아 주고, 그녀가 행한 모든 것에 따라 그녀에게 행하십시오. 이는 그녀가 야훼를 거슬러, 이스라엘의 거룩하신 분을 향해 교만했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빠져나갈 길이 없게’는 פְּלֵטָה의 의미를 포위 상황에 맞게 풀어 옮긴 것입니다. 이 말은 ‘탈출’ 또는 ‘탈출한 자/남은 자’의 뉘앙스를 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁמִיעוּ
  english_pob_choice: Summon
  chosen_korean: 불러모으고
  alternatives_korean:
  - 소집하고
  - 부르십시오
  - 선포하십시오
  lexicon: HALOT
  rationale: 전쟁 동원 맥락의 히필 명령형으로, 단순히 ‘소리내어 알리다’보다 무리를 모아 집결시키는 뜻이 강하므로 자연스러운 동사 ‘불러모으다’를 택했습니다.
- source_word: דֹּרְכֵי קֶשֶׁת
  english_pob_choice: all who bend the bow
  chosen_korean: 활 쏘는 자들 모두
  alternatives_korean:
  - 활을 당기는 자들 모두
  - 활잡이들 모두
  lexicon: HALOT
  rationale: 직역인 ‘활을 당기는 자들’도 가능하지만, 한국어에서는 전투 병종을 드러내는 ‘활 쏘는 자들’이 의미를 더 자연스럽게 전달합니다.
- source_word: חֲנוּ עָלֶיהָ סָבִיב
  english_pob_choice: encamp around her on every side
  chosen_korean: 그 사방에 진을 치고
  alternatives_korean:
  - 그녀를 둘러 사방에 진을 치고
  - 사방으로 둘러 진을 치고
  lexicon: HALOT
  rationale: ‘사방(סָבִיב)’의 포위 이미지를 살리면서 군사적 어법인 ‘진을 치다’로 옮겼습니다.
- source_word: פְּלֵטָה
  english_pob_choice: let there be no escape
  chosen_korean: 빠져나갈 길이 없게 하십시오
  alternatives_korean:
  - 도망칠 길이 없게 하십시오
  - 피할 자가 없게 하십시오
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 생존 여부보다 포위로 인한 탈출 불가가 핵심이므로, ‘escape’의 뜻을 한국어 관용으로 풀어 옮겼습니다.
- source_word: שַׁלְּמוּ לָהּ
  english_pob_choice: Repay her
  chosen_korean: 갚아 주고
  alternatives_korean:
  - 보응하고
  - 되갚아 주고
  - 갚으십시오
  lexicon: HALOT
  rationale: 보복·상응의 משפט적 뉘앙스를 유지하면서도 현대 한국어에서 자연스러운 ‘갚다’를 사용했습니다.
- source_word: זָדָה
  english_pob_choice: has acted arrogantly
  chosen_korean: 교만했기 때문입니다
  alternatives_korean:
  - 거만했기 때문입니다
  - 오만하게 행했기 때문입니다
  - 무례하게 굴었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 동사는 presumptuous arrogance를 가리키므로, 결과보다 태도를 드러내는 ‘교만하다’가 가장 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 여호와 대신 학술적 음역인 ‘야훼’를 사용하여 고유한 신명성을 보존했습니다.
theological_decisions:
- issue: 보응 명령의 강도와 한국어 표현
  chosen_reading: ‘빠져나갈 길이 없게 하십시오’로 포위와 심판의 긴박성을 유지했습니다.
  alternative_readings:
  - ‘한 사람도 남기지 마십시오’
  - ‘도망치는 자가 없게 하십시오’
  rationale: פְּלֵטָה를 단순한 학살 명령으로 좁히지 않고, 성문의 군사적 포위·탈출 불가라는 문맥을 그대로 드러내는 쪽이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: Jeremiah 50의 심판 신탁 문맥 — lex talionis와 포위 이미지 유지
- issue: 인용 대상인 신명 표현
  chosen_reading: ‘야훼’를 본문에 직접 두었습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 히브리어 본문에 직접 יְהוָה가 나오므로, 제목어로 완화하지 않고 고유명으로 옮겨 신명과 언약적 대상성을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
