revisions:
- from: 바벨에 맞서 많은 무리를 불러모으고, 활 쏘는 자들 모두를 부르십시오. 그 사방에 진을 치고, 빠져나갈 길이 없게 하십시오. 그녀가 한 일에 따라 갚아 주고, 그녀가 행한 모든 것에 따라 그녀에게 행하십시오. 이는 그녀가 야훼를 거슬러, 이스라엘의 거룩하신 분을 향해 교만했기 때문입니다.[a]
  to: 바벨론을 치도록 많은 이들, 곧 활을 당기는 모든 이들을 소집하십시오. 바벨론을 사방에서 포위하여 진을 치십시오. 빠져나갈 자가 없게 하십시오.[a] 바벨론이 한 일대로 갚으십시오. 그가 행한 모든 대로 그에게 행하십시오. 그가 야훼를 거슬러, 이스라엘의 거룩하신 분을 거슬러 오만하게 행동했기 때문입니다.
  rationale: 첫 절의 동원 대상과 포위 대상을 명확히 하되, 명령형의 강도와 보응의 반복을 유지했습니다. פְּלֵטָה는 본문에서 포위 상황에 맞춰 ‘빠져나갈 자’로 옮기고, ‘탈출’ 및 ‘탈출한 자/살아남은 자’라는 논쟁 가능한 의미 범위는 각주로 보존했습니다. זָדָה의 행동성과 오만함은 ‘오만하게 행동했기 때문입니다’로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:31Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 포위·보응·야훼를 향한 오만이라는 핵심 뜻을 대체로 충실히 옮겼습니다. 그러나 첫 명령에서 ‘많은 무리’와 ‘활 쏘는 자들 모두’가 별개의 두 집단처럼 연결되어, 히브리어의 ‘많은 이들, 곧 활을 당기는 모든 이들’이라는 동원 대상을 덜 정확하게 드러냅니다. 또한 ‘그 사방’은 바벨론을 가리키지만 지시 대상이 즉시 분명하지 않습니다.
  naturalness: ‘바벨론을 치도록 많은 이들, 곧 활을 당기는 모든 이들을 소집하십시오’와 ‘바벨론을 사방에서 포위하여 진을 치십시오’가 현대 표준 한국어의 군사적 문맥에서 더 자연스럽고 명료합니다. ‘그녀’의 반복은 한국어에서 다소 부자연스러우므로, 필요한 곳에서는 ‘바벨론’으로 밝혀 주는 편이 좋습니다.
  terminology: יַהוֶה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. קְדוֹשׁ יִשְׂרָאֵל은 관용적이고 존칭을 갖춘 ‘이스라엘의 거룩하신 분’으로 유지했습니다. פְּלֵטָה의 ‘탈출’과 ‘탈출한 자/남은 자’ 사이의 의미 범위는 각주에서 보존했습니다.
