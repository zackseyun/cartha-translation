id: JER.50.20
reference: Jeremiah 50:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵם֩ וּ/בָ/עֵ֨ת הַ/הִ֜יא נְאֻם יְהוָ֗ה יְבֻקַּ֞שׁ אֶת עֲוֺ֤ן יִשְׂרָאֵל֙ וְ/אֵינֶ֔/נּוּ וְ/אֶת חַטֹּ֥את יְהוּדָ֖ה וְ/לֹ֣א תִמָּצֶ֑אינָה כִּ֥י אֶסְלַ֖ח לַ/אֲשֶׁ֥ר אַשְׁאִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/020.yaml
  text: In those days and at that time, declares the LORD, the guilt of Israel will be sought, but there will be none, and the sins of Judah, but they will not be found; for I will forgive those whom I leave as a remnant.
translation:
  language: ko
  text: 그 날들과 그 때에, 야훼께서 말씀하십니다. 이스라엘의 죄악은 찾아도 없고, 유다의 죄들도 발견되지 않을 것입니다. 내가 남겨 두는 이들을 용서할 것이기 때문입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: 예언 서두의 고정 공식으로, 원문은 ‘이르시되’에 해당하는 הנאם/declares를 포함합니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘죄들’(복수)을 사용하여 유다의 여러 죄목을 병렬적으로 보여 줍니다.
    reason: source_note
lexical_decisions:
- source_word: יְהוָה / declares the LORD
  english_pob_choice: declares the LORD
  chosen_korean: 야훼께서 말씀하십니다
  alternatives_korean:
  - 주께서 말씀하십니다
  - 여호와께서 말씀하십니다
  lexicon: YHWH
  rationale: 원문은 신탁 서두의 표준 예언 공식이므로, 본문 텍스트에는 학술적 음역인 야훼를 두고 예언 발화로 자연스럽게 옮겼습니다.
- source_word: עֲוֺן יִשְׂרָאֵל
  english_pob_choice: the guilt of Israel
  chosen_korean: 이스라엘의 죄악
  alternatives_korean:
  - 이스라엘의 죄책
  - 이스라엘의 불의
  lexicon: עָוֹן
  rationale: עָוֹן은 단순한 행위 하나보다 죄책/죄악의 누적된 상태를 가리킬 수 있어, POB의 guilt를 한국어 성서문맥에 맞게 죄악으로 옮겼습니다.
- source_word: חַטֹּאת יְהוּדָה
  english_pob_choice: the sins of Judah
  chosen_korean: 유다의 죄들
  alternatives_korean:
  - 유다의 죄
  - 유다의 허물
  lexicon: חַטָּאת
  rationale: 복수형을 살려 죄들로 옮겨, 유다의 여러 죄목이 더 이상 발견되지 않는다는 병렬 구조를 보존했습니다.
- source_word: כִּי אֶסְלַח לַאֲשֶׁר אַשְׁאִיר
  english_pob_choice: for I will forgive those whom I leave as a remnant
  chosen_korean: 내가 남겨 두는 이들을 용서할 것이기 때문입니다
  alternatives_korean:
  - 내가 남겨 두는 자들을 용서할 것이기 때문입니다
  - 내가 남겨 두는 남은 자들을 사할 것이기 때문입니다
  lexicon: שָׁאַר / סָלַח
  rationale: אַשְׁאִיר의 남겨 두다와 סלח의 용서하다를 그대로 살려, 남은 자 사상의 신학적 연결을 드러냈습니다.
theological_decisions:
- issue: ‘guilt’와 ‘sins’의 이중 표현
  chosen_reading: 이스라엘의 죄악 / 유다의 죄들
  alternative_readings:
  - 이스라엘의 죄책 / 유다의 죄들
  - 이스라엘의 죄악 / 유다의 허물들
  rationale: 원문은 עֲוֺן과 חַטֹּאת을 병렬로 두어 서로 다른 죄의 표현을 유지하므로, 한국어도 같은 이중 구조를 보존했습니다.
  doctrine_reference: 예레미야 50:20의 심판-용서 신탁
- issue: ‘forgive those whom I leave as a remnant’의 종말론적 남은 자 함의
  chosen_reading: 내가 남겨 두는 이들을 용서할 것이기 때문입니다
  alternative_readings:
  - 내가 남겨 두는 남은 자들을 용서할 것이기 때문입니다
  - 내가 남겨 두는 자들에게 용서가 있을 것이기 때문입니다
  rationale: אֲשִׁיר는 단순히 남아 있는 자가 아니라 하나님이 남겨 두신 자들을 가리키므로, 문맥의 남은 자 신학을 직접 드러내되 과도한 설명은 덧붙이지 않았습니다.
  doctrine_reference: 남은 자(remnant) 사상
