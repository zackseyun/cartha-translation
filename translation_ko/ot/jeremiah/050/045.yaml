  doctrine_reference: 'DOCTRINE.md: יְהוָה / YHWH → 야훼'
- issue: 은유 보존
  chosen_reading: ‘양 떼의 가장 작은 것들’과 ‘목장’ 이미지를 본문에 그대로 유지했습니다.
  alternative_readings:
