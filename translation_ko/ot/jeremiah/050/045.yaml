  naturalness: 기존의 ‘마련하신 생각’과 ‘양 떼의 가장 작은 것들’은 현대 표준 한국어에서 다소 어색합니다. ‘품으신 생각’ 및 ‘양 떼의 어린 것들’로 고치고, 병렬되는 두 목적어의 조사를 정돈했습니다. 합쇼체 종결을 유지했습니다.
