id: JER.50.45
reference: Jeremiah 50:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן שִׁמְע֣וּ עֲצַת יְהוָ֗ה אֲשֶׁ֤ר יָעַץ֙ אֶל בָּבֶ֔ל וּ/מַ֨חְשְׁבוֹתָ֔י/ו אֲשֶׁ֥ר חָשַׁ֖ב אֶל אֶ֣רֶץ כַּשְׂדִּ֑ים אִם לֹ֤א יִסְחָבוּ/ם֙ צְעִירֵ֣י הַ/צֹּ֔אן אִם לֹ֥א יַשִּׁ֛ים עֲלֵי/הֶ֖ם נָוֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/045.yaml
  text: 'Therefore hear the counsel of Yahweh that he has planned against Babylon[a], and his thoughts that he has devised against the land of the Chaldeans: Surely the little ones of the flock will drag them away[c][b]; surely he will make their pasture desolate.'
  footnotes:
  - marker: a
    text: Or 'the least of the flock'; the phrase likely refers metaphorically to the weakest or least significant of Babylon's attackers.
    reason: lexical_alternative
  - marker: b
    text: Or 'their habitation.' The Hebrew word can mean 'pasture,' 'abode,' or 'dwelling place.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he will make their pasture desolate because of them'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 야훼께서 바빌론에 대하여 세우신 계획과, 갈대아 땅에 대하여 마련하신 생각을 들으십시오: 반드시 양 떼의 가장 작은 것들이 그들을 끌어갈 것이며, 반드시 그분이 그들의 목장을 황폐하게 하실 것입니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이러므로
  - 따라서
  lexicon: HALOT
  rationale: 앞선 예언의 결과를 잇는 결론 표지로 자연스럽고 공문체에 어울립니다.
- source_word: עֲצַת יְהוָה
  english_pob_choice: the counsel of Yahweh
  chosen_korean: 야훼께서 세우신 계획
  alternatives_korean:
  - 야훼의 권고
  - 야훼의 뜻
  lexicon: HALOT
  rationale: עצה의 ‘상담/권고’보다 여기서는 목적과 의도의 확정된 ‘계획’이 문맥에 더 잘 맞지만, 동사 ‘세우신’과 함께 원문의 의도적 결정을 살렸습니다.
- source_word: מַחְשְׁבוֹתָיו
  english_pob_choice: his thoughts
  chosen_korean: 마련하신 생각
  alternatives_korean:
  - 그의 계획
  - 그의 궁리
  lexicon: HALOT
  rationale: ‘생각/계획’의 어휘적 긴장을 살려 עֲצָה와 중복되지 않게 하면서도, 이어지는 חָשַׁב와의 평행성을 유지했습니다.
- source_word: צְעִירֵי הַצֹּאן
  english_pob_choice: the little ones of the flock
  chosen_korean: 양 떼의 가장 작은 것들
  alternatives_korean:
  - 양 떼의 어린 것들
  - 양 떼의 작은 자들
  lexicon: HALOT
  rationale: 직역된 목축 이미지를 보존하여, 본문이 암시하는 비유적 강도를 독자가 판단할 수 있게 했습니다.
- source_word: נָוֶה
  english_pob_choice: their pasture
  chosen_korean: 그들의 목장
  alternatives_korean:
  - 그들의 거처
  - 그들의 목초지
  lexicon: HALOT
  rationale: 뒤의 양 떼 이미지와의 연결을 살리면서도, ‘목장’이 문맥상 파괴 대상이 되는 장소를 간결하게 드러냅니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명기적 고유명사를 제목이 아니라 고유이름으로 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה / YHWH → 야훼'
- issue: 은유 보존
  chosen_reading: ‘양 떼의 가장 작은 것들’과 ‘목장’ 이미지를 본문에 그대로 유지했습니다.
  alternative_readings:
  - ‘가장 약한 자들’로 해석
  - ‘거처’로 일반화
  rationale: 원문이 의도적으로 비유를 사용하므로, 해석을 앞서기보다 이미지 자체를 보존하는 것이 출처 충실성에 더 맞습니다.
  doctrine_reference: 'Translation philosophy: preserve source-text sense without paraphrase beyond what the text warrants'
