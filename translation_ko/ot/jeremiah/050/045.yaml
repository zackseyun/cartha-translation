  chosen_korean: 그들의 목장
  alternatives_korean:
  - 그들의 거처
  - 그들의 목초지
  lexicon: HALOT
  rationale: 뒤의 양 떼 이미지와의 연결을 살리면서도, ‘목장’이 문맥상 파괴 대상이 되는 장소를 간결하게 드러냅니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
