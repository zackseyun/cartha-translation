  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בּ֤וֹשָׁה אִמְּ/כֶם֙ מְאֹ֔ד חָפְרָ֖ה יֽוֹלַדְתְּ/כֶ֑ם הִנֵּה֙ אַחֲרִ֣ית גּוֹיִ֔ם מִדְבָּ֖ר צִיָּ֥ה וַ/עֲרָבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/012.yaml
  text: Your mother will be utterly ashamed; she who gave birth to you will be disgraced. Behold[a], she will be the last of the nations, a wilderness, a dry land, and a desert.
  footnotes:
  - marker: a
    text: Or 'the least of the nations.' The Hebrew expression can denote Babylon's final, reduced status among the nations.
    reason: lexical_alternative
translation:
  language: ko
  text: 너희 어머니는 몹시 부끄러워할 것이며, 너희를 낳은 이는 수치를 당할 것입니다. 보십시오[a], 그 어머니는 민족들 가운데 가장 마지막이 되어 광야, 메마른 땅, 사막이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘민족들 가운데 가장 작은 자.’ 히브리어 표현은 바빌론이 민족들 가운데서 최종적으로 낮아지고 축소된 상태를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹשָׁה
  english_pob_choice: will be ... ashamed
  chosen_korean: 부끄러워할 것이며
  alternatives_korean:
  - 부끄러움을 당할 것이며
  - 부끄럽게 될 것이며
  - 수치를 당할 것이며
  lexicon: HALOT
  rationale: 예언적 완료형의 미래적 효과를 살려 미래형으로 옮기되, 뒤의 '수치'와 어울리는 자연스러운 표준어 표현을 택했습니다.
- source_word: אִמְּכֶם
  english_pob_choice: your mother
  chosen_korean: 너희 어머니
  alternatives_korean:
  - 너희의 어머니
  - 너희 어머니-도시
  - 너희의 모국
  lexicon: HALOT
  rationale: 문자적으로는 '너희 어머니'이며, 바빌론을 어머니로 의인화한 표현을 본문에서 그대로 살렸습니다.
- source_word: חָפְרָה
  english_pob_choice: will be disgraced
  chosen_korean: 수치를 당할 것입니다
  alternatives_korean:
  - 굴욕을 당할 것입니다
  - 모욕을 당할 것입니다
  - 굴욕스럽게 될 것입니다
  lexicon: HALOT
  rationale: 여기서는 외적 모욕이라기보다 수치와 굴욕의 상태를 가리키므로, 앞의 '부끄러워할'과 구분되면서도 자연스러운 표현을 택했습니다.
- source_word: אַחֲרִית גּוֹיִם
  english_pob_choice: the last of the nations
  chosen_korean: 여러 민족 가운데서 가장 마지막이 되어
  alternatives_korean:
  - 민족들 가운데 가장 뒤처져
  - 민족들 가운데서 가장 적은 자가 되어
  - 민족들의 마지막이 되어
  lexicon: HALOT
  rationale: '''אַחֲרִית''의 ''마지막/최후 상태''를 살리면서, 영어 주석이 지적한 ''least''의 뉘앙스는 본문보다 자연스러운 한국어 해석을 넘지 않도록 우회적으로 반영했습니다.'
theological_decisions:
- issue: 바빌론을 어머니로 묘사하는 의인화
  chosen_reading: '''너희 어머니''와 ''너희를 낳은 이''를 본문에서 그대로 유지했습니다.'
  alternative_readings:
  - '''어머니 도시''로 풀어 설명하기'
  - '''모국''으로 해석하기'
  rationale: 히브리어의 시적 의인화를 해설로 바꾸지 않고, 독자가 본문의 충격과 풍자를 직접 받도록 두는 것이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 예언적 완료형의 미래 의미
  chosen_reading: 두 동사를 미래형으로 옮겼습니다.
  alternative_readings:
  - 현재형으로 옮기기
  - 완료 결과형으로 옮기기
  rationale: 심판 예언에서 완료형은 확정된 미래를 나타내는 경우가 많으므로, 현대 한국어 독자에게도 그 기능이 분명히 전달되도록 했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
