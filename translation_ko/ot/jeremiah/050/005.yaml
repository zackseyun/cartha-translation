source:
  edition: WLC
  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
  footnotes:
  - marker: a
    text: Or 'Come, and let us be joined to the LORD'; the Hebrew verb can be rendered either with a reflexive nuance ('join ourselves') or more simply as 'be joined.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'an everlasting covenant that will not be forgotten,' emphasizing a lasting covenant loyalty in contrast to past unfaithfulness.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 시온으로 가는 길을 물으며, 얼굴을 그리로 향합니다. 「오십시오. 우리가 야훼께 영원한 언약으로 결합합시다. 그 언약은 잊히지 않을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘우리가 스스로 합류하다’는 재귀적 뉘앙스도, 단순히 ‘합류되다’는 뜻도 가능하므로, 여기서는 문맥상 초청과 결단을 살려 ‘결합합시다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 직역은 ‘잊히지 않을 영원한 언약’이며, 이는 과거의 불충실함과 대비되는 지속적 언약 충성을 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: צִיּוֹן
  english_pob_choice: Zion
  chosen_korean: 시온
  alternatives_korean:
  - 지온
  - 시온 산
  lexicon: HALOT
  rationale: 고유 지명은 음역하는 것이 원문의 지시 대상을 가장 직접적으로 보존합니다.
- source_word: יִשְׁאָלוּ דֶּרֶךְ
  english_pob_choice: they will ask the way
  chosen_korean: 길을 물으며
  alternatives_korean:
  - 길을 물을 것입니다
  - 길을 묻습니다
  - 길을 찾습니다
  lexicon: HALOT
  rationale: 예언적 미래를 살리되 한국어에서는 자연스럽게 진행형적 서술로 옮겨, ‘묻다/알아보다’의 뜻을 간결히 보존했습니다.
- source_word: פְנֵי/הֶם בֹּאוּ וְנִלְוּוּ
  english_pob_choice: 'with their faces turned toward it: ‘Come, let us join ourselves’'
  chosen_korean: 얼굴을 그리로 향합니다. 「오십시오. 우리가 … 결합합시다」
  alternatives_korean:
  - 그것을 향해 얼굴을 돌립니다. 「오십시오. 우리가 … 함께합시다」
  - 그쪽을 바라보며 옵니다. 「오십시오. 우리가 … 붙어 있읍시다」
  lexicon: HALOT
  rationale: ‘얼굴을 향하다’의 이미지와 이어지는 초청형을 살리되, 한국어 어법상 자연스럽게 풀었습니다. לוה의 ‘자기 몸을 붙이다/합류하다’는 의미는 문맥상 ‘결합하다’로 옮겼습니다.
- source_word: בְּרִית עוֹלָם לֹא תִשָּׁכֵחַ
  english_pob_choice: an everlasting covenant that will not be forgotten
  chosen_korean: 영원한 언약으로 … 그 언약은 잊히지 않을 것입니다
  alternatives_korean:
  - 영원한 언약으로 … 그것은 잊히지 않을 것입니다
  - 영속하는 언약으로 … 잊혀지지 않을 언약
  lexicon: HALOT
  rationale: בְּרִית עוֹלָם의 지속성을 ‘영원한 언약’으로 옮기고, 여성형 동사형의 ‘잊히지 않다’를 명시해 언약이 주어인 문장 구조를 드러냈습니다.
theological_decisions:
