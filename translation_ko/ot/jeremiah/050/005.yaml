  text: צִיּ֣וֹן יִשְׁאָ֔לוּ דֶּ֖רֶךְ הֵ֣נָּה פְנֵי/הֶ֑ם בֹּ֚אוּ וְ/נִלְו֣וּ אֶל יְהוָ֔ה בְּרִ֥ית עוֹלָ֖ם לֹ֥א תִשָּׁכֵֽחַ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/005.yaml
  text: 'They will ask the way to Zion[a], with their faces turned toward it: ‘Come[b], let us join ourselves to Yahweh in an everlasting covenant that will not be forgotten.’'
  footnotes:
  - marker: a
    text: Or 'Come, and let us be joined to the LORD'; the Hebrew verb can be rendered either with a reflexive nuance ('join ourselves') or more simply as 'be joined.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'an everlasting covenant that will not be forgotten,' emphasizing a lasting covenant loyalty in contrast to past unfaithfulness.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 시온으로 가는 길을 물을 것이며, 얼굴을 그쪽으로 향할 것입니다. 「오십시오. 우리가 영원한 언약으로 야훼께 연합합시다.[a] 그 언약은 잊히지 않을 것입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘우리가 스스로 연합하다’라는 재귀적 뉘앙스로도, 단순히 ‘연합되다’로도 옮길 수 있습니다. 여기서는 앞선 ‘오십시오’와 이어지는 권유를 살려 ‘연합합시다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘잊히지 않을 영원한 언약’이라고 합니다. 이는 과거의 불충실함과 대조되는 지속적인 언약 충성을 강조합니다.
    reason: cultural_note
