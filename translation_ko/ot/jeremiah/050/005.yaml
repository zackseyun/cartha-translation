- source_word: פְנֵי/הֶם בֹּאוּ וְנִלְוּוּ
  english_pob_choice: 'with their faces turned toward it: ‘Come, let us join ourselves’'
  chosen_korean: 얼굴을 그리로 향합니다. 「오십시오. 우리가 … 결합합시다」
  alternatives_korean:
  - 그것을 향해 얼굴을 돌립니다. 「오십시오. 우리가 … 함께합시다」
  - 그쪽을 바라보며 옵니다. 「오십시오. 우리가 … 붙어 있읍시다」
  lexicon: HALOT
  rationale: ‘얼굴을 향하다’의 이미지와 이어지는 초청형을 살리되, 한국어 어법상 자연스럽게 풀었습니다. לוה의 ‘자기 몸을 붙이다/합류하다’는 의미는 문맥상 ‘결합하다’로 옮겼습니다.
- source_word: בְּרִית עוֹלָם לֹא תִשָּׁכֵחַ
  english_pob_choice: an everlasting covenant that will not be forgotten
  chosen_korean: 영원한 언약으로 … 그 언약은 잊히지 않을 것입니다
  alternatives_korean:
  - 영원한 언약으로 … 그것은 잊히지 않을 것입니다
  - 영속하는 언약으로 … 잊혀지지 않을 언약
  lexicon: HALOT
  rationale: בְּרִית עוֹלָם의 지속성을 ‘영원한 언약’으로 옮기고, 여성형 동사형의 ‘잊히지 않다’를 명시해 언약이 주어인 문장 구조를 드러냈습니다.
