source:
  edition: WLC
  text: עִרְכ֨וּ עַל בָּבֶ֤ל סָבִיב֙ כָּל דֹּ֣רְכֵי קֶ֔שֶׁת יְד֣וּ אֵלֶ֔י/הָ אַֽל תַּחְמְל֖וּ אֶל חֵ֑ץ כִּ֥י לַֽ/יהוָ֖ה חָטָֽאָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/014.yaml
  text: Draw up against Babylon all around, all you who bend the bow; shoot at her; do not spare an arrow, for she has sinned against Yahweh.
translation:
  language: ko
  text: 바빌론을 사방에서 둘러서십시오. 활을 당기는 자들아, 모두 그를 향해 쏘십시오. 화살을 아끼지 마십시오. 그가 야훼께 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִרְכ֨וּ
  english_pob_choice: Draw up
  chosen_korean: 둘러서십시오
  alternatives_korean:
  - 진을 치십시오
  - 배열을 갖추십시오
  lexicon: HALOT
  rationale: 군사적 배치를 명하는 복수 명령으로 이해하여, 현대 한국어에서 자연스럽고 공격적 대열 형성을 드러내는 표현을 택했습니다.
- source_word: סָבִיב
  english_pob_choice: all around
  chosen_korean: 사방에서
  alternatives_korean:
  - 둘레에
  - 온 사방에서
  lexicon: HALOT
  rationale: 바빌론을 완전히 포위하는 의미를 간결하게 살리기 위해 ‘사방에서’로 옮겼습니다.
- source_word: כָּל דֹּרְכֵי קֶשֶׁת
  english_pob_choice: all you who bend the bow
  chosen_korean: 활을 당기는 자들아, 모두
  alternatives_korean:
  - 활을 쏘는 자들아
  - 활잡이들아
  lexicon: HALOT
  rationale: 직역의 이미지를 유지하면서도 한국어에서 자연스러운 호격으로 처리했습니다.
- source_word: יְדוּ אֵלֶי/הָ
  english_pob_choice: shoot at her
  chosen_korean: 그를 향해 쏘십시오
  alternatives_korean:
  - 그녀에게 쏘십시오
  - 그쪽을 향해 쏘십시오
  lexicon: HALOT
  rationale: 히브리어의 바빌론 의인화(여성 단수)를 반영하되, 한국어 문장에서는 대상 지시가 분명하도록 ‘그’를 사용했습니다.
- source_word: אַל תַּחְמְל֖וּ אֶל חֵץ
  english_pob_choice: do not spare an arrow
  chosen_korean: 화살을 아끼지 마십시오
  alternatives_korean:
  - 화살 하나도 남기지 마십시오
  - 화살을 조금도 아끼지 마십시오
  lexicon: HALOT
  rationale: ‘חמל’의 핵심은 아끼거나 봐주지 말라는 뜻이므로, 한국어 관용으로 전투 맥락의 강도를 살렸습니다.
- source_word: לַֽ/יהוָ֖ה
  english_pob_choice: against Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주께
  - 여호와께
  lexicon: HALOT
  rationale: 문맥상 ‘죄를 짓다’와 결합하여 행위의 대상이 되는 분을 표시하며, 본 프로젝트의 기본 용례에 따라 신명은 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 바빌론의 인칭 처리
  chosen_reading: 의인화된 바빌론을 한국어에서는 주어 ‘그’로 단순화했습니다.
  alternative_readings:
  - 그녀
  - 바빌론
  rationale: 히브리어는 바빌론을 여성 단수로 의인화하지만, 한국어에서는 도시를 가리키는 지시를 우선해 성별 표지를 과도하게 드러내지 않았습니다.
  doctrine_reference: 원문 의인화와 한국어 지시 체계의 균형
