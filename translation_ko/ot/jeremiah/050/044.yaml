  edition: WLC
  text: הִ֠נֵּה כְּ/אַרְיֵ֞ה יַעֲלֶ֨ה מִ/גְּא֣וֹן הַ/יַּרְדֵּן֮ אֶל נְוֵ֣ה אֵיתָן֒ כִּֽי אַרְגִּ֤עָה ארוצ/ם מֵֽ/עָלֶ֔י/הָ וּ/מִ֥י בָח֖וּר אֵלֶ֣י/הָ אֶפְקֹ֑ד כִּ֣י מִ֤י כָמ֨וֹ/נִי֙ וּ/מִ֣י יוֹעִדֶ֔/נִּי וּ/מִֽי זֶ֣ה רֹעֶ֔ה אֲשֶׁ֥ר יַעֲמֹ֖ד לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/044.yaml
  text: Look[a], like a lion he comes up from the thicket of the Jordan against a secure pasture; for in an instant I will make them run from it, and I will appoint over it whoever is chosen. For who is like me[c][b], and who can summon me? What shepherd can stand before me?
  footnotes:
  - marker: a
    text: Hebrew 'from the pride of the Jordan'; the expression likely refers to the Jordan's dense, luxuriant thickets.
    reason: lexical_alternative
  - marker: b
    text: Or 'I will chase them away from it.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and who can appoint me a time?' The Hebrew may carry the sense of setting a time for meeting or summoning to account.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 사자가 요단의 덤불에서 올라와 안전한 목초지를 향합니다.[a] 순식간에 내가 그들을 그곳에서 쫓아내고, 택함 받은 사람은 누구든지 그곳 위에 세우겠습니다.[b] 이는 누가 나와 같겠으며, 누가 나를 소환할 수 있겠습니까?[c] 어떤 목자가 내 앞에 설 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘요단의 자랑’입니다. 이 표현은 문맥상 요단 강변의 무성한 덤불이나 수풀을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내가 그들을 그곳에서 달아나게 하겠다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘누가 나를 만날 때를 정할 수 있겠습니까?’ 히브리어 동사는 만남의 시간을 정하거나 소환한다는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자 보십시오
  lexicon: HALOT
  rationale: 예언적 장면 전환을 드러내는 감탄사로, 현대 합쇼체에서는 ‘보십시오’가 즉각성과 주목성을 가장 자연스럽게 전달합니다.
- source_word: מִגְּאוֹן הַיַּרְדֵּן
  english_pob_choice: from the thicket of the Jordan
  chosen_korean: 요단의 덤불에서
  alternatives_korean:
  - 요단의 자랑에서
  - 요단의 위엄에서
  - 요단의 수풀에서
  lexicon: HALOT
  rationale: 문맥상 추상적 ‘자랑/위엄’보다 요단 강변의 무성한 덤불·수풀을 가리키는 구체적 지형 이미지가 우선되어 ‘덤불’로 옮겼습니다.
- source_word: אַרְגִּעָה ... וּמִי בָחוּר אֵלֶיהָ אֶפְקֹד
  english_pob_choice: for in an instant I will make them run from it, and I will appoint over it whoever is chosen
  chosen_korean: 그 순간에 내가 그들을 거기에서 쫓아내고, 누가 선택되었든 그것을 맡기겠습니다
  alternatives_korean:
  - 잠깐 사이에 내가 그들을 거기서 몰아내고, 선택된 이를 그 위에 세우겠습니다
  - 한순간에 내가 그들을 거기서 달아나게 하고, 택함 받은 자를 그것에 임명하겠습니다
  lexicon: HALOT
  rationale: ‘ארגּיעָה’의 순간성은 ‘그 순간에’로, ‘ארוץם’의 강제적 이탈은 ‘쫓아내고’로 풀어 자연스러운 한국어 동사를 살렸습니다. ‘바후르’는 ‘선택되었든’으로 수동성을 보존했습니다.
- source_word: וּמִי יוֹעִדֶנִּי
  english_pob_choice: and who can summon me
  chosen_korean: 누가 나를 불러낼 수 있겠습니까
  alternatives_korean:
  - 누가 나를 소환할 수 있겠습니까
  - 누가 나를 만나도록 정할 수 있겠습니까
  - 누가 나와 만날 시간을 정할 수 있겠습니까
  lexicon: HALOT
  rationale: 이 동사는 단순 ‘임명’보다 하나님을 불러 책임을 묻거나 소환하는 चुनौती를 포함할 수 있어, 문맥상 ‘불러내다’가 가장 압축적이고 힘 있게 대응합니다.
- source_word: וּמִי זֶה רֹעֶה אֲשֶׁר יַעֲמֹד לְפָנָי
  english_pob_choice: What shepherd can stand before me
  chosen_korean: 어떤 목자가 내 앞에 설 수 있겠습니까
  alternatives_korean:
  - 어떤 목자가 내 앞에 버틸 수 있겠습니까
  - 어떤 목자가 나를 대적해 설 수 있겠습니까
  lexicon: HALOT
  rationale: ‘רֹעֶה’의 목자 이미지를 유지하고, 관용구 ‘내 앞에 서다’를 한국어로 자연스럽게 살려 대항/버팀의 의미를 드러냈습니다.
theological_decisions:
- issue: 1인칭 신적 발화와 포효하는 사자 이미지의 관계
  chosen_reading: 사자 이미지는 침략의 형상으로 제시되지만, 곧바로 이어지는 1인칭 선언이 그 배후의 주권적 행위자를 하나님 자신으로 드러냅니다.
  alternative_readings:
  - 사자는 단지 인간 침략자를 가리키고, 뒤의 1인칭은 그 사건을 해설하는 말이다
  - 사자와 1인칭은 동일시되지 않고 병렬적 이미지로만 제시된다
  rationale: 히브리어는 3인칭 묘사에서 1인칭 신적 발언으로 전환하므로, 이를 해소하지 않고 그대로 살려야 본문의 예언적 긴장과 주권 선언이 보존됩니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
