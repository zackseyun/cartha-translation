id: JER.50.6
reference: Jeremiah 50:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: צֹ֤אן אֹֽבְדוֹת֙ היה עַמִּ֔/י רֹעֵי/הֶ֣ם הִתְע֔וּ/ם הָרִ֖ים שובבים מֵ/הַ֤ר אֶל גִּבְעָה֙ הָלָ֔כוּ שָׁכְח֖וּ רִבְצָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/006.yaml
  text: My people have been lost sheep[a]; their shepherds have led them astray, turning them away on the mountains. They have gone from mountain to hill[b]; they have forgotten their resting place.
  footnotes:
  - marker: a
    text: Or, more formally, 'their shepherds led them astray; the mountains made them wayward,' reflecting the difficult Hebrew word translated 'have made them wander.'
    reason: lexical_alternative
  - marker: b
    text: '''From mountain to hill'' may also echo Israel''s movement among the high places, a common image of apostasy in Jeremiah.'
    reason: cross_reference
translation:
  language: ko
  text: 내 백성은 길 잃은 양들입니다[a]. 그들의 목자들이 그들을 산에서 떠나 헤매게 했습니다. 그들은 산에서 언덕으로 다녔고[b], 자기들의 눕는 곳을 잊어버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 형식적으로, ‘그들의 목자들이 그들을 잘못 인도했다; 산들이 그들을 방황하게 했다’로도 옮길 수 있습니다. 히브리어의 קשה한 표현을 반영한 대안입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산에서 언덕으로’는 이사야/예레미야에 자주 나타나는 높은 곳을 오가며 배교하는 이미지와도 울림을 가질 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: צֹאן אֹבְדוֹת
  english_pob_choice: lost sheep
  chosen_korean: 길 잃은 양들
  alternatives_korean:
  - 잃어버린 양떼
  - 길 잃은 양떼
  lexicon: HALOT
  rationale: צֹאן은 집합명사이지만 여기서는 목자-양 비유가 선명하므로 ‘양들’로 풀고, אֹבְדוֹת의 상실/방황 의미는 ‘길 잃은’으로 자연스럽게 살렸습니다.
- source_word: רֹעֵיהֶם
  english_pob_choice: their shepherds
  chosen_korean: 그들의 목자들이
  alternatives_korean:
  - 그들의 목자들
  - 그들의 지도자들이
  lexicon: HALOT
  rationale: 비유를 보존하기 위해 일반화된 ‘지도자들’보다 목축 이미지인 ‘목자들’을 유지했습니다.
- source_word: הִתְעוּם
  english_pob_choice: have led them astray
  chosen_korean: 그들을 산에서 떠나 헤매게 했습니다
  alternatives_korean:
  - 그들을 잘못 인도했습니다
  - 그들을 길에서 벗어나게 했습니다
  lexicon: HALOT
  rationale: Hiphil의 인과성을 살려 목자들의 책임을 분명히 하면서, ישועה/방황의 맥락을 한국어로는 ‘헤매게 했다’로 전달했습니다.
- source_word: מֵהַר אֶל גִּבְעָה
  english_pob_choice: from mountain to hill
  chosen_korean: 산에서 언덕으로
  alternatives_korean:
  - 산에서 산으로
  - 산에서 높은 언덕으로
  lexicon: HALOT
  rationale: 반복 이동의 이미지를 간결하게 살리고, 지리적 표현을 과도하게 해석하지 않기 위해 직역에 가깝게 옮겼습니다.
- source_word: שָׁכְחוּ רִבְצָם
  english_pob_choice: they have forgotten their resting place
  chosen_korean: 자기들의 눕는 곳을 잊어버렸습니다
  alternatives_korean:
  - 자기들의 안식처를 잊었습니다
  - 자기들의 거처를 잊었습니다
  lexicon: HALOT
  rationale: רִבְצָם은 짐승이 눕는 자리라는 뜻이어서, ‘안식처’보다 목양적·구체적 의미가 살아 있는 ‘눕는 곳’을 택했습니다.
theological_decisions:
- issue: ‘산’과 ‘언덕’의 고지 이미지가 우상숭배의 높은 곳을 암시하는가
  chosen_reading: 본문의 직접적 비유는 길 잃은 양과 잘못 인도한 목자이며, 암시는 본문에 드러내기보다 여백으로 남겼습니다.
  alternative_readings:
  - ‘높은 곳’의 우상숭배를 노골적으로 드러내는 해석적 번역
  rationale: 예레미야의 관용적 배경은 인정되지만, 본문 자체는 우선 방랑하는 양의 이미지로 읽히므로 지리적 표현을 유지하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: שובבים의 난해한 용법을 어떻게 처리할 것인가
  chosen_reading: ‘산에서 떠나 헤매게 했습니다’로 옮겨 목자들의 원인 제공과 방랑의 결과를 함께 드러냈습니다.
  alternative_readings:
  - ‘방황하게 했습니다’
  - ‘더럽혀진/반역적인 산들’처럼 형용사적으로 옮김
  rationale: 히브리어의 난점을 한국어 본문에 그대로 끌어오면 불명료해지므로, 문맥상 확실한 의미를 살려 읽히도록 했습니다.
  doctrine_reference: Translation philosophy §5
