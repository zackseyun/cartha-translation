revisions:
- from: 내 백성은 길 잃은 양들입니다[a]. 그들의 목자들이 그들을 산에서 떠나 헤매게 했습니다. 그들은 산에서 언덕으로 다녔고[b], 자기들의 눕는 곳을 잊어버렸습니다.
  to: 내 백성은 길 잃은 양들입니다[a]. 그들의 목자들이 그들을 잘못 인도하여 산에서 헤매게 하였습니다. 그들은 산에서 언덕으로 다녔으며[b], 자기들이 쉴 곳을 잊어버렸습니다.
  rationale: ‘떠나’를 삭제하여 원문에 없는 방향성을 제거하고, 목자들이 양들을 미혹하여 산에서 헤매게 한다는 문맥적 의미를 유지했습니다. 난해한 히브리어 구문의 대안은 각주에 보존하되, 본문에는 과도하게 특정 해석을 강요하지 않았습니다. 각주 a의 언어 혼입을 바로잡고, 각주 b를 제공된 감사 기록의 범위에 맞추었습니다.
