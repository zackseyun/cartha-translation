id: JER.50.43
reference: Jeremiah 50:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֧ע מֶֽלֶךְ בָּבֶ֛ל אֶת שִׁמְעָ֖/ם וְ/רָפ֣וּ יָדָ֑י/ו צָרָה֙ הֶחֱזִיקַ֔תְ/הוּ חִ֖יל כַּ/יּוֹלֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/043.yaml
  text: The king of Babylon has heard the report about them[a], and his hands have gone limp; distress has seized him, anguish like a woman in labor.
  footnotes:
  - marker: a
    text: Or 'the news concerning them.' The Hebrew phrase can be rendered more literally as 'their report,' but in context it refers to the report about the invading force.
    reason: lexical_alternative
translation:
  language: ko
  text: 바벨론 왕이 그들에 대한 소식을 들었습니다. 그의 손은 힘이 빠졌고, 그에게는 고통이 덮쳤으며, 해산하는 여인 같은 진통이 그를 사로잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들에 대한 소식’은 히브리어 שִׁמְעָם의 직역 가능성을 반영한 것입니다. 문맥상 침략해 오는 세력에 관한 보고를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: שָׁמַע / שִׁמְעָם
  english_pob_choice: has heard / the report about them
  chosen_korean: 그들에 대한 소식을 들었습니다
  alternatives_korean:
  - 그들에 대한 보고를 들었습니다
  - 그들에 관한 소식을 들었습니다
  - 그들의 소식을 들었습니다
  lexicon: HALOT
  rationale: שׁמע와 그 명사형 שִׁמְעָם의 ‘소식/보고’ 의미를 살리되, 3인칭 복수 접미사가 가리키는 대상이 ‘그들’에 관한 소식임을 한국어로 분명하게 했습니다.
- source_word: וְרָפוּ יָדָיו
  english_pob_choice: his hands have gone limp
  chosen_korean: 그의 손은 힘이 빠졌고
  alternatives_korean:
  - 그의 손은 축 늘어졌고
  - 그의 손은 무력해졌고
  - 그의 손은 약해졌고
  lexicon: HALOT
  rationale: ‘손이 약해지다/늘어지다’는 관용을 자연스러운 현대 한국어로 옮기면서, 신체적 힘의 상실과 두려움의 반응을 함께 드러냈습니다.
- source_word: צָרָה / חִיל
  english_pob_choice: distress ... anguish
  chosen_korean: 그에게는 고통이 덮쳤으며, 해산하는 여인 같은 진통이 그를 사로잡았습니다
  alternatives_korean:
  - 환난이 그를 붙들었으며, 해산하는 여인 같은 고통이 그를 사로잡았습니다
  - 고통이 그를 덮쳤으며, 해산하는 여자 같은 산고가 그를 사로잡았습니다
  lexicon: HALOT
  rationale: צָרָה는 포괄적인 ‘고통/환난’으로, חִיל은 해산 비유와 결합될 때의 격렬한 진통으로 옮겼습니다. ‘진통’은 비유의 강도를 살리면서 중복을 줄입니다.
- source_word: כַּיּוֹלֵדָה
  english_pob_choice: like a woman in labor
  chosen_korean: 해산하는 여인 같은
  alternatives_korean:
  - 산고를 겪는 여인 같은
  - 아이를 낳는 여인 같은
  - 진통하는 여인 같은
  lexicon: HALOT
  rationale: 비유 표현을 직역에 가깝게 유지하여, 원문의 출산 고통 이미지를 훼손하지 않도록 했습니다.
theological_decisions:
- issue: 예언 시의 격정적 이미지와 평서문 종결
  chosen_reading: 예언적 서술을 현대 한국어 평서문으로 옮기되, 원문의 급박한 연쇄 동작을 유지했습니다.
  alternative_readings:
  - 더 문학적으로 풀어 쓴 번역
  - 더 완곡한 정서어 중심 번역
  rationale: 이 절은 바벨론 왕의 공포와 무력화를 직접적으로 묘사하므로, 완곡화보다 원문의 압박감을 보존하는 것이 본문의 의도에 더 충실합니다.
  doctrine_reference: 예언 문맥의 수사와 심판 선언의 직접성
- issue: ‘진통’ 표현의 신체적 비유 유지
  chosen_reading: 해산 비유를 도덕적·상징적으로 약화시키지 않고 신체적 고통의 생생함으로 유지했습니다.
  alternative_readings:
  - 상징적 두려움으로만 처리
  - 단순히 ‘고통’으로 평준화
  rationale: 원문은 실제 출산의 고통을 표준적 비교 대상으로 삼아 공포의 강도를 극대화하므로, 한국어에서도 그 육체성을 보존해야 합니다.
  doctrine_reference: 예언적 심판 묘사의 비유적 강도
