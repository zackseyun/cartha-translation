id: JER.50.35
reference: Jeremiah 50:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: חֶ֥רֶב עַל כַּשְׂדִּ֖ים נְאֻם יְהוָ֑ה וְ/אֶל יֹשְׁבֵ֣י בָבֶ֔ל וְ/אֶל שָׂרֶ֖י/הָ וְ/אֶל חֲכָמֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/050/035.yaml
  text: A sword is against the Chaldeans[a], declares Yahweh, and against the inhabitants of Babylon, and against her officials[b], and against her wise men.
  footnotes:
  - marker: a
    text: Or 'the Babylonians' for 'the Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: Or 'her princes' for 'her officials.'
    reason: lexical_alternative
translation:
  language: ko
  text: 칼이 갈대아인들[a]과 바벨론의 주민들과 그녀의 관리들[b]과 그녀의 지혜자들 위에 있습니다. 야훼의 말씀이십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바벨론 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그녀의 방백들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב
  english_pob_choice: A sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 한 칼
  lexicon: HALOT
  rationale: 예언적 심판 선언에서 무기 표지로 쓰인 무관사 명사라서, 한국어에서는 자연스럽고 압축적인 ‘칼’이 가장 직접적입니다.
- source_word: עַל
  english_pob_choice: is against
  chosen_korean: 위에 있습니다
  alternatives_korean:
  - 대항합니다
  - 에게 있습니다
  lexicon: HALOT
  rationale: 히브리어의 대적·심판 방향을 살리되, 한국어에서는 ‘~위에 있습니다’가 선언적이고 이미지적인 표현을 유지합니다.
- source_word: כַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아인들
  alternatives_korean:
  - 바벨론 사람들
  lexicon: HALOT
  rationale: 본문의 민족명은 분명히 ‘갈대아인들’이므로, 문맥의 바벨론 세력과의 관련성보다 원어의 역사적·민족적 뉘앙스를 우선했습니다.
- source_word: שָׂרֶי/הָ
  english_pob_choice: her officials
  chosen_korean: 그녀의 관리들
  alternatives_korean:
  - 그녀의 방백들
  - 그녀의 통치자들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥에 따라 방백, 관원, 관리를 가리킬 수 있는데, 바벨론의 행정·통치 계층을 현대 한국어로 가장 분명하게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 표기와 종결 공식
  chosen_reading: 이 절에서는 하나님의 이름을 ‘야훼’로 옮기고, 예언자식 종결 문구는 ‘야훼의 말씀이십니다’로 처리했습니다.
  alternative_readings:
  - 여호와의 말씀입니다
  - 야훼께서 말씀하십니다
  rationale: 번역 원칙상 יְהוָה는 고유명사 ‘야훼’로 보존해야 하며, נְאֻם יְהוָה는 예언서의 공적 선포를 나타내는 공식 문구이므로 한국어에서는 격식 있는 선언형으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
