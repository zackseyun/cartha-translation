- source_word: כַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아인들
  alternatives_korean:
  - 바벨론 사람들
  lexicon: HALOT
  rationale: 본문의 민족명은 분명히 ‘갈대아인들’이므로, 문맥의 바벨론 세력과의 관련성보다 원어의 역사적·민족적 뉘앙스를 우선했습니다.
- source_word: שָׂרֶי/הָ
  english_pob_choice: her officials
  chosen_korean: 그녀의 관리들
  alternatives_korean:
  - 그녀의 방백들
  - 그녀의 통치자들
  lexicon: HALOT
  rationale: שָׂרִים은 문맥에 따라 방백, 관원, 관리를 가리킬 수 있는데, 바벨론의 행정·통치 계층을 현대 한국어로 가장 분명하게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 표기와 종결 공식
  chosen_reading: 이 절에서는 하나님의 이름을 ‘야훼’로 옮기고, 예언자식 종결 문구는 ‘야훼의 말씀이십니다’로 처리했습니다.
  alternative_readings:
  - 여호와의 말씀입니다
  - 야훼께서 말씀하십니다
  rationale: 번역 원칙상 יְהוָה는 고유명사 ‘야훼’로 보존해야 하며, נְאֻם יְהוָה는 예언서의 공적 선포를 나타내는 공식 문구이므로 한국어에서는 격식 있는 선언형으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
