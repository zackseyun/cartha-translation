  source_fidelity: 히브리어는 갈대아인, 바벨론 주민, 그 관리, 그 지혜자에게 임하는 ‘칼’이라는 심판 선언을 열거하며, 신탁 공식 נְאֻם יְהוָה는 첫 대상 뒤에 놓입니다. 초안의 ‘~위에 있습니다’는 עַל의 적대적·심판적 용법을 한국어에서 부자연스럽고 불명확하게 만들며, ‘그녀의’는 바벨론을 여성 인칭으로 받는 한국어 표현으로 어색합니다.
