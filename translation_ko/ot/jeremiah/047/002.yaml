id: JER.47.2
reference: Jeremiah 47:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה הִנֵּה מַ֜יִם עֹלִ֤ים מִ/צָּפוֹן֙ וְ/הָיוּ֙ לְ/נַ֣חַל שׁוֹטֵ֔ף וְ/יִשְׁטְפוּ֙ אֶ֣רֶץ וּ/מְלוֹאָ֔/הּ עִ֖יר וְ/יֹ֣שְׁבֵי בָ֑/הּ וְ/זָֽעֲקוּ֙ הָֽ/אָדָ֔ם וְ/הֵילִ֕ל כֹּ֖ל יוֹשֵׁ֥ב הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/002.yaml
  text: 'Thus says the LORD: Behold, waters are rising from the north, and they will become an overflowing torrent; they will overflow the land and its fullness, the city and those who dwell in it. Then mankind will cry out, and every inhabitant of the land will wail.'
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 보십시오, 북쪽에서 물이 올라와 넘쳐흐르는 시내가 될 것이며, 그 물이 땅과 그 충만함, 그 성읍과 그 안에 사는 자들을 뒤덮을 것입니다. 그러면 사람들은 부르짖고, 그 땅의 모든 주민은 통곡할 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘보십시오’는 הִנֵּה의 경고·주의 환기 기능을 살리기 위한 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 본문의 신명 표기는 POB 기본값에 따라 학술 음역인 ‘야훼’로 옮겨, 영어 POB의 ‘the LORD’가 가리는 원어 표지를 드러냈습니다.
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: הִנֵּה
  rationale: 예언적 주의를 환기하는 감탄을 현대 한국어에서 자연스럽고 격식을 유지하는 명령형으로 옮겼습니다.
- source_word: מַיִם עֹלִים מִצָּפוֹן
  english_pob_choice: waters are rising from the north
  chosen_korean: 북쪽에서 물이 올라와
  alternatives_korean:
  - 북쪽에서 물이 솟아오르고
  - 북쪽에서 물이 올라오고
  lexicon: מַיִם / עֹלִים / צָפוֹן
  rationale: ‘올라오다’는 상승·침입의 동시 함의를 살리며, 북방에서 오는 재앙의 이미지도 직접적으로 전달합니다.
- source_word: לְנַחַל שׁוֹטֵף ... וְיִשְׁטְפוּ
  english_pob_choice: an overflowing torrent ... they will overflow
  chosen_korean: 넘쳐흐르는 시내가 될 것이며, 그 물이 ... 뒤덮을 것입니다
  alternatives_korean:
  - 범람하는 급류가 될 것이며, ... 범람할 것입니다
  - 넘치는 홍수가 되어 ... 휩쓸 것입니다
  lexicon: נַחַל / שׁוטף / שטף
  rationale: ‘시내’와 ‘넘쳐흐르는’으로 물길의 성격과 범람의 동사를 살려, POB의 ‘overflowing torrent’와 원문의 급격한 홍수 이미지를 함께 반영했습니다.
- source_word: וּמְלוֹאָהּ ... וְזָעֲקוּ הָאָדָם ... וְהֵילִל
  english_pob_choice: the land and its fullness ... mankind will cry out ... every inhabitant ... will wail
  chosen_korean: 땅과 그 충만함, 그 성읍과 그 안에 사는 자들 ... 사람들은 부르짖고, 그 땅의 모든 주민은 통곡할 것입니다
  alternatives_korean:
  - 땅과 그 모든 것, 성읍과 그 주민들 ... 인류가 울부짖고 ...
  - 땅과 그 가득 찬 것, 도시와 그 안의 거주자들 ...
  lexicon: מְלוֹאָהּ / עִיר / יוֹשְׁבֵי
  rationale: ‘충만함’은 땅의 채움과 소유 전체를 포괄하는 히브리어 명사를 살리기 위한 선택이며, ‘성읍/주민’은 도시와 거주자를 평행적으로 드러냅니다.
theological_decisions:
- issue: 예언 도입부의 신명 처리
  chosen_reading: ‘야훼께서 이렇게 말씀하십니다’로 시작해, 예언의 권위를 유지하면서도 본문에 나타난 YHWH를 직접 드러냈습니다.
  alternative_readings:
  - ‘주님께서 말씀하십니다’
  - ‘여호와께서 말씀하십니다’
  rationale: POB의 신명 기준에 맞춰 본문 주체를 명시하고, 독자가 원문 신명 표지를 인지하도록 했습니다.
  doctrine_reference: 출 3:15; 예언서의 YHWH 발화 공식
- issue: ‘mankind’와 ‘every inhabitant’의 인류/거주자 구분
  chosen_reading: ‘사람들’과 ‘그 땅의 모든 주민’으로 나누어, 보편적 반응과 지역적 거주자 반응을 모두 보존했습니다.
  alternative_readings:
  - ‘인류는 부르짖고’
  - ‘모든 사람이 부르짖고’
  rationale: 영어 POB가 ‘mankind’로 일반화한 보편성을 유지하되, 뒤의 ‘every inhabitant’와 중복되지 않도록 한국어에서 자연스럽게 구분했습니다.
  doctrine_reference: 예언적 심판의 보편성
