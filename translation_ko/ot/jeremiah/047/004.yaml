translation:
  language: ko
  text: 모든 블레셋 사람을 황폐하게 하고 두로와 시돈에서 남아 있는 모든 조력자를 끊어 버릴 날이 다가오고 있기 때문입니다. 야훼께서 블레셋 사람들, 곧 갑돌 섬의 남은 자들을 황폐하게 하고 계십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘갑돌 해안 지역의 남은 자들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל הַיּוֹם הַבָּא
  english_pob_choice: because of the day that is coming
  chosen_korean: 다가오는 그 날 때문에
  alternatives_korean:
  - 오는 그 날 때문에
  - 다가올 그 날을 두고
  lexicon: HALOT
  rationale: עַל은 여기서 원인을 나타내는 용법으로 읽히므로 ‘때문에’로 옮겼고, הַבָּא의 진행성은 ‘다가오는’으로 자연스럽게 살렸습니다.
- source_word: לִשְׁדֹד
  english_pob_choice: to devastate
  chosen_korean: 황폐하게 하고
  alternatives_korean:
  - 짓밟고
  - 파괴하고
  lexicon: HALOT
  rationale: שׁדד의 폭력적 파멸/유린 뉘앙스를 한국어의 ‘황폐하게 하다’로 옮겨, 단순 파괴보다 더 강한 심판적 의미를 살렸습니다.
- source_word: לְצֹר וּלְצִידוֹן כֹּל שָׂרִיד עֹזֵר
  english_pob_choice: to cut off from Tyre and Sidon every surviving helper
  chosen_korean: 두로와 시돈에서 살아남은 모든 도움을 끊어 버릴
  alternatives_korean:
  - 두로와 시돈에서 남은 모든 도우미를 끊어 버릴
  - 두로와 시돈의 남은 모든 원조를 끊어 버릴
  lexicon: HALOT
  rationale: לְהַכְרִית의 ‘끊다/잘라 내다’ 이미지를 살려 ‘끊어 버리다’로 옮겼고, שָׂרִיד עֹזֵר는 ‘남은 도움’보다 사람을 가리키는 ‘살아남은 모든 도움’으로 풀어 원문의 구조를 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 여기서는 신명기적 고유명사 יְהוָה를 제목어가 아닌 고유명으로 드러내는 것이 원문에 더 직접적이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: שְׁאֵרִית אִי כַפְתּוֹר
  english_pob_choice: the remnant of the island of Caphtor
  chosen_korean: 갑돌의 해안 지역에 남은 자
  alternatives_korean:
  - 갑돌의 섬에 남은 자
  - 갑돌의 해안 지방의 남은 자
  lexicon: HALOT
  rationale: אִי는 ‘섬’과 ‘해안 지역/해안지방’ 모두 가능하지만, 지리적 과잉확정을 피하면서도 시적·예언적 맥락을 살리기 위해 ‘해안 지역’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 표기할지
  chosen_reading: 고유명사 ‘야훼’로 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 יְהוָה는 대체 칭호가 아니라 언약적 고유명사이므로, 독자가 본문이 실제로 하나님의 이름을 사용하고 있음을 알 수 있도록 ‘야훼’를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
