  lexicon: HALOT
  rationale: 시드가 personified된 칼을 향한 정지/침묵의 의미이므로 ‘잠잠하다’가 문맥상 가장 적절합니다.
- source_word: צִוָּה לָהּ
  english_pob_choice: has commanded it
  chosen_korean: 그것을 명령하셨는데
  alternatives_korean:
  - 그것에게 명령하셨는데
