  lexicon: HALOT
  rationale: 수사적 불가능을 묻는 표현이므로 현대 한국어에서는 ‘어찌 … 수 있겠습니까?’가 자연스럽고 긴박한 뉘앙스를 잘 살립니다.
- source_word: תִּשְׁקֹטִי
  english_pob_choice: you be quiet
