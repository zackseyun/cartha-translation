  lexicon: HALOT
  rationale: 히브리어의 여성 단수 목적어를 ‘그것’으로 살리되, 한국어에서는 자연스러운 서술을 위해 ‘명령하셨는데’로 옮겼습니다.
- source_word: אֶל אַשְׁקְלוֹן / חוֹף הַיָּם
  english_pob_choice: Against Ashkelon and against the seacoast
  chosen_korean: 아스글론을 향하여, 바닷가를 향하여
  alternatives_korean:
  - 아스글론을 향하여, 바닷가를 향하여
  - 아스글론에 대하여, 바닷가에 대하여
