source:
  edition: WLC
  text: אֵ֣יךְ תִּשְׁקֹ֔טִי וַֽ/יהוָ֖ה צִוָּה לָ֑/הּ אֶֽל אַשְׁקְל֛וֹן וְ/אֶל ח֥וֹף הַ/יָּ֖ם שָׁ֥ם יְעָדָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/007.yaml
  text: How can you be quiet when Yahweh has commanded it? Against Ashkelon and against the seacoast—there he has appointed it[a][b].
  footnotes:
  - marker: a
    text: 'Hebrew: ''has commanded her/it'' and ''he has appointed her/it,'' referring to the sword personified in the previous verse.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to Ashkelon and to the shore of the sea'; the preposition can be rendered more literally, though here it implies the sword's hostile commission against them.
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌 잠잠할 수 있겠습니까? 야훼께서 그것을 명령하셨는데 말입니다. 아스글론을 향하여, 바닷가를 향하여—거기서 그분이 그것을 정하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그것을 명령하셨다’와 ‘그것을 정하셨다’로, 직전 절의 의인화된 칼을 가리킵니다.
    reason: source_note
  - marker: b
    text: אֶל은 문자적으로는 ‘~에게/~을 향하여’이지만, 여기서는 아스글론과 바닷가를 향한 심판의 목표를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How can
  chosen_korean: 어찌 … 수 있겠습니까?
  alternatives_korean:
  - 어떻게 … 수 있겠습니까?
  - 어찌 … 하겠습니까?
  lexicon: HALOT
  rationale: 수사적 불가능을 묻는 표현이므로 현대 한국어에서는 ‘어찌 … 수 있겠습니까?’가 자연스럽고 긴박한 뉘앙스를 잘 살립니다.
- source_word: תִּשְׁקֹטִי
  english_pob_choice: you be quiet
  chosen_korean: 잠잠할 수 있겠습니까
  alternatives_korean:
  - 조용할 수 있겠습니까
  - 가만있을 수 있겠습니까
  - 고요할 수 있겠습니까
  lexicon: HALOT
  rationale: 시드가 personified된 칼을 향한 정지/침묵의 의미이므로 ‘잠잠하다’가 문맥상 가장 적절합니다.
- source_word: צִוָּה לָהּ
  english_pob_choice: has commanded it
  chosen_korean: 그것을 명령하셨는데
  alternatives_korean:
  - 그것에게 명령하셨는데
  - 그것을 지시하셨는데
  - 그것에게 명하셨는데
  lexicon: HALOT
  rationale: 히브리어의 여성 단수 목적어를 ‘그것’으로 살리되, 한국어에서는 자연스러운 서술을 위해 ‘명령하셨는데’로 옮겼습니다.
- source_word: אֶל אַשְׁקְלוֹן / חוֹף הַיָּם
  english_pob_choice: Against Ashkelon and against the seacoast
  chosen_korean: 아스글론을 향하여, 바닷가를 향하여
  alternatives_korean:
  - 아스글론을 향하여, 바닷가를 향하여
  - 아스글론에 대하여, 바닷가에 대하여
  - 아스글론을 향해, 바다 해안가를 향해
  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘~을 향하여’이지만 여기서는 심판의 표적을 가리키므로 방향성과 적대적 긴장을 함께 살렸습니다.
- source_word: יְעָדָהּ
  english_pob_choice: he has appointed it
  chosen_korean: 거기서 그분이 그것을 정하셨습니다
  alternatives_korean:
  - 거기서 그분이 그것을 임명하셨습니다
  - 거기서 그분이 그것을 지정하셨습니다
  - 그곳에 그분이 그것을 정하셨습니다
  lexicon: HALOT
  rationale: יעד의 ‘정하다/지정하다’ 의미를 살려, 칼의 사명을 하나님이 정하셨다는 점을 분명히 했습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 인격적 언약 이름이므로 POB 기준에 따라 ‘야훼’로 음역해 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 여성 단수 지시 대상
  chosen_reading: 문맥상 직전 절의 의인화된 칼을 가리키며, 한국어에서는 ‘그것’으로 일관해 과도한 성별화 없이 연결을 유지했습니다.
  alternative_readings:
  - 그녀
  - 칼
  - 그분
  rationale: 히브리어는 여성 단수 형태를 유지하지만 한국어에서는 반복적 ‘그녀’가 어색하므로, personification은 유지하되 지시 대명사는 중성적으로 처리했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
