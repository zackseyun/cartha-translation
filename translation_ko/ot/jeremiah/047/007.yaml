  lexicon: HALOT
  rationale: אֶל은 기본적으로 ‘~을 향하여’이지만 여기서는 심판의 표적을 가리키므로 방향성과 적대적 긴장을 함께 살렸습니다.
- source_word: יְעָדָהּ
  english_pob_choice: he has appointed it
  chosen_korean: 거기서 그분이 그것을 정하셨습니다
  alternatives_korean:
  - 거기서 그분이 그것을 임명하셨습니다
  - 거기서 그분이 그것을 지정하셨습니다
  - 그곳에 그분이 그것을 정하셨습니다
  lexicon: HALOT
  rationale: יעד의 ‘정하다/지정하다’ 의미를 살려, 칼의 사명을 하나님이 정하셨다는 점을 분명히 했습니다.
theological_decisions:
- issue: 여호와 이름의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 יְהוָה는 인격적 언약 이름이므로 POB 기준에 따라 ‘야훼’로 음역해 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 여성 단수 지시 대상
  chosen_reading: 문맥상 직전 절의 의인화된 칼을 가리키며, 한국어에서는 ‘그것’으로 일관해 과도한 성별화 없이 연결을 유지했습니다.
  alternative_readings:
  - 그녀
  - 칼
  - 그분
  rationale: 히브리어는 여성 단수 형태를 유지하지만 한국어에서는 반복적 ‘그녀’가 어색하므로, personification은 유지하되 지시 대명사는 중성적으로 처리했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
