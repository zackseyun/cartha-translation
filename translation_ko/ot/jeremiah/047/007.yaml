  source_fidelity: 히브리어 לָהּ는 ‘그것을 명령하다’가 아니라 의인화된 여성 단수 대상인 칼에게 ‘명령하다’라는 여격 목적어입니다. 또한 שָׁם은 아스글론과 해안이라는 앞선 목적지를 가리키며, יְעָדָהּ은 그 칼을 그곳을 향하도록 지정하셨다는 뜻입니다.
