- from: 야훼의 말씀이 예언자 예레미야에게 블레셋 사람들에 관하여 임했습니다. 이는 바로 파라오가 가사를 치기 전의 일입니다.[a][b]
  to: 파라오가 가자를 치기 전에 블레셋 사람들에 관하여[b] 예언자 예레미야에게 임한 야훼의 말씀입니다.[a]
  rationale: 관계절 표제의 기능을 한국어의 완결된 표제 문장으로 옮기고, ‘파라오가 가자를 치기 전에’를 ‘임한’에 직접 연결했습니다. 이로써 시간 관계를 명확히 하면서도 원문의 표제적 성격과 אֶל의 해석상 여지를 보존했습니다. ‘가사’를 표준 지명 ‘가자’로 바로잡고 각주 b의 불필요한 영어 혼입을 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:39Z'
