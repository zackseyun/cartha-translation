source:
  edition: WLC
  text: אֲשֶׁ֨ר הָיָ֧ה דְבַר יְהוָ֛ה אֶל יִרְמְיָ֥הוּ הַ/נָּבִ֖יא אֶל פְּלִשְׁתִּ֑ים בְּ/טֶ֛רֶם יַכֶּ֥ה פַרְעֹ֖ה אֶת עַזָּֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/001.yaml
  text: This is the word of Yahweh that came to Jeremiah the prophet concerning the Philistines[b][a], before Pharaoh struck Gaza.
  footnotes:
  - marker: a
    text: Or 'which came to Jeremiah the prophet concerning the Philistines.' The Hebrew opens with a relative construction functioning as a heading.
    reason: lexical_alternative
  - marker: b
    text: Or 'against the Philistines.' The preposition can introduce the subject of an oracle and, in judgment contexts, may be understood adversatively.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 말씀이 예언자 예레미야에게 블레셋 사람들에 관하여 임했습니다. 이는 바로 파라오가 가사를 치기 전의 일입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자 예레미야에게 블레셋 사람들에 관하여 임한 말씀입니다.’ 히브리어는 표제처럼 기능하는 관계절로 시작합니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘블레셋 사람들을 향하여.’ 전치사 אֶל은 예언 심판문맥에서 ‘against’의 뉘앙스를 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר הָיָה דְבַר יְהוָה
  english_pob_choice: This is the word of Yahweh ... that came
  chosen_korean: 「야훼의 말씀이 … 임했습니다」
  alternatives_korean:
  - 「야훼의 말씀이 … 있었습니다」
  - 「야훼의 말씀이 … 왔습니다」
  lexicon: HALOT
  rationale: 예언서 머리말의 관용구로서 ‘임하다’가 말씀의 도래와 계시적 성격을 가장 자연스럽게 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본 프로젝트 기본값에 따라 여호와 대용어 대신 신명기적 고유명 ‘야훼’를 유지합니다.
- source_word: אֶל יִרְמְיָהוּ הַנָּבִיא
  english_pob_choice: to Jeremiah the prophet
  chosen_korean: 예언자 예레미야에게
  alternatives_korean:
  - 예언자 예레미야에게로
  - 예언자 예레미야에게 이르러
  lexicon: HALOT
  rationale: 수신자를 나타내는 אֶל을 ‘-에게’로 옮기고, הַנָּבִיא는 관형어보다 직함으로 풀어 한국어 문장 흐름을 살렸습니다.
- source_word: אֶל פְּלִשְׁתִּים
  english_pob_choice: concerning the Philistines
  chosen_korean: 블레셋 사람들에 관하여
  alternatives_korean:
  - 블레셋 사람들을 향하여
  - 블레셋 사람들에 대한
  lexicon: HALOT
  rationale: 이 문맥의 אֶל은 심판적 ‘against’로도 읽힐 수 있지만, 본문 표제를 따라 우선 주제 표지인 ‘-에 관하여’로 옮겼습니다.
- source_word: פַרְעֹה
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  - 애굽 왕
  lexicon: HALOT
  rationale: 고유한 왕호를 현대 음역으로 유지해 원문의 역사적 지칭을 살렸습니다.
theological_decisions:
- issue: אֶל פְּלִשְׁתִּים의 방향성
  chosen_reading: 표제 기능을 살려 ‘블레셋 사람들에 관하여’로 두고, 직접적인 적대성은 본문 전개에 맡겼습니다.
  alternative_readings:
  - ‘블레셋 사람들을 향하여’
  - ‘블레셋 사람들에 대하여/against’
  rationale: 히브리어 전치사 אֶל은 예언문 표제에서 대상/주제를 가리킬 수 있으므로, 본절 단독에서는 과도한 해석을 피하는 편이 적절합니다.
  doctrine_reference: 예언서 표제의 수신/대상 표기 관행
