id: JER.47.5
reference: Jeremiah 47:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בָּ֤אָה קָרְחָה֙ אֶל עַזָּ֔ה נִדְמְתָ֥ה אַשְׁקְל֖וֹן שְׁאֵרִ֣ית עִמְקָ֑/ם עַד מָתַ֖י תִּתְגּוֹדָֽדִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/047/005.yaml
  text: Baldness has come upon Gaza[a]; Ashkelon has been silenced, the remnant of their valley[c][b]. How long will you gash yourself?
  footnotes:
  - marker: a
    text: Or 'Ashkelon is cut off' / 'Ashkelon has perished.' The Hebrew verb can carry the sense of being silenced, stilled, or destroyed.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the remnant of their valley.' Some interpreters, following ancient versions or a different vocalization, understand this phrase differently, including 'the remnant of the Anakim.'
    reason: alternative_reading
  - marker: c
    text: Self-gashing was a customary act of mourning in the ancient Near East.
    reason: cultural_note
translation:
  language: ko
  text: 대머리가 가자에 닥쳤고[a], 아스글론, 곧 그들의 골짜기에 남은 것이 잠잠해졌습니다[b]. 너는 언제까지 네 몸을 베겠습니까?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 카르하(קָרְחָה)는 ‘대머리’ 또는 ‘머리를 민 상태’를 뜻합니다. 여기서는 애곡과 재앙의 표지입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 본문은 ‘그들의 골짜기의 남은 것’입니다. 일부 고대 번역본이나 다른 모음화에 따른 해석은 이를 다르게 이해하며, ‘아낙 사람들의 남은 자’라는 읽기도 제시합니다.
    reason: textual_variant
  - marker: c
    text: 몸을 베는 것은 고대 근동에서 애곡할 때 행하던 관습이었습니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּאָה קָרְחָה֙ אֶל עַזָּ֔ה
  english_pob_choice: Baldness has come upon Gaza
  chosen_korean: 고자가 가자에 임하였고
  alternatives_korean:
  - 고자 상태가 가자에 임하였고
  - 대머리가 가자에 찾아왔고
  lexicon: HALOT
  rationale: קָרְחָה는 문자적으로 '대머리/고자'보다 문맥상 애곡과 재앙의 표징으로 쓰인 '고자'를 살려, 재앙이 덮친 이미지를 한국어로 자연스럽게 옮겼습니다.
- source_word: נִדְמְתָה אַשְׁקְל֖וֹן
  english_pob_choice: Ashkelon has been silenced
  chosen_korean: 아스글론이 잠잠해졌으며
  alternatives_korean:
  - 아스글론이 끊어졌으며
  - 아스글론이 멸망했으며
  - 아스글론이 침묵하게 되었으며
  lexicon: HALOT
  rationale: נִדְמְתָה의 '잠잠해지다/멎다' 의미를 따라, 파괴의 결과를 직접 단정하기보다 침묵과 정지의 이미지를 보존했습니다.
- source_word: שְׁאֵרִ֣ית עִמְקָ֑ם
  english_pob_choice: the remnant of their valley
  chosen_korean: 그들의 골짜기의 남은 자가 되었습니다
  alternatives_korean:
  - 그들의 골짜기의 남은 것이 되었습니다
  - 그들의 골짜기의 남은 자들
  lexicon: HALOT
  rationale: שְׁאֵרִית를 '남은 자'로 옮겨 심판 후에 남은 존재를 드러냈고, MT의 עִמְקָם은 '그들의 골짜기'로 반영했습니다.
- source_word: תִּתְגּוֹדָדִי
  english_pob_choice: How long will you gash yourself?
  chosen_korean: 너는 언제까지 너 자신을 가르겠느냐?
  alternatives_korean:
  - 너는 언제까지 너를 베겠느냐?
  - 너는 언제까지 너 자신을 상처내겠느냐?
  lexicon: HALOT
  rationale: Hitpolel의 자기 절개 의미를 살리되, 한국어에서 과도하게 생경하지 않은 '가르다'를 사용해 자해적 애곡 행위를 드러냈습니다.
theological_decisions:
- issue: 예언적 심판 선언의 수사 강도
  chosen_reading: '''고자가 가자에 임하였고''처럼 재앙의 도래를 직접적으로 표현해, 본문의 경고성과 비탄의 이미지를 약화시키지 않았습니다.'
  alternative_readings:
  - '''수치가 가자에 임하였고''처럼 완곡하게 표현'
  - '''대머리''를 문자적으로만 옮김'
  rationale: 이 구절은 전쟁 심판의 징조와 애곡의 표지를 병치하므로, 본문의 충격을 유지하는 것이 중요합니다.
  doctrine_reference: 예언서의 심판 선언과 언약적 경고의 수사
- issue: 자해 행위의 묘사
  chosen_reading: '''너 자신을 가르겠느냐?''로 관습적 애곡의 자해를 드러내되, 명령이 아니라 책망적 질문으로 유지했습니다.'
  alternative_readings:
  - '''너는 언제까지 너를 베겠느냐?'''
  - '''너는 언제까지 몸을 상하게 하겠느냐?'''
  rationale: 히브리어 질문형을 보존하여, 애곡의 관습을 묘사하는 동시에 그 행위를 금지하는 직접적 교훈으로 바꾸지 않았습니다.
  doctrine_reference: 본문의 화행과 예언적 책망의 수사
