source:
  edition: WLC
  text: אִם יָצָ֣אתִי הַ/שָּׂדֶ֗ה וְ/הִנֵּה֙ חַלְלֵי חֶ֔רֶב וְ/אִם֙ בָּ֣אתִי הָ/עִ֔יר וְ/הִנֵּ֖ה תַּחֲלוּאֵ֣י רָעָ֑ב כִּֽי גַם נָבִ֧יא גַם כֹּהֵ֛ן סָחֲר֥וּ אֶל אֶ֖רֶץ וְ/לֹ֥א יָדָֽעוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/018.yaml
  text: If I go out into the field[a], look—those slain by the sword! And if I enter the city[b], look—those sick with famine! For both prophet and priest wander through the land and do not know what to do.
  footnotes:
  - marker: a
    text: Or, 'both prophet and priest go about trading in the land and do not understand,' since the Hebrew verb can carry a commercial sense as well as movement.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult Hebrew. It may also mean 'they have gone into a land they do not know' or simply 'they do not understand.'
    reason: alternative_reading
translation:
  language: ko
  text: 내가 들로 나가면, 보십시오—칼에 죽임을 당한 이들이 있습니다! 내가 성읍에 들어가면, 보십시오—기근으로 병든 이들이 있습니다! 예언자와 제사장도 그 땅을 두루 다니며 알지 못합니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘예언자와 제사장이 그 땅에서 장사하며 다니는데도 알지 못한다’로 옮길 수 있습니다. 히브리어 동사는 이동뿐 아니라 상업 활동을 뜻할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절의 히브리어는 해석하기 어렵습니다. ‘그들이 알지 못하는 땅으로 들어갔다’ 또는 단순히 ‘그들이 알지 못한다’라는 뜻일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם יָצָאתִי
  english_pob_choice: If I go out
  chosen_korean: 내가 들에 나가면
  alternatives_korean:
  - 내가 들로 나가면
  - 내가 들판으로 나가면
  lexicon: HALOT
  rationale: 조건적·가정적 문맥을 살려 ‘-면’으로 처리하고, שָׂדֶה는 성읍과 대비되는 열린 지역이므로 ‘들’이 가장 간결하고 자연스럽습니다.
- source_word: וְהִנֵּה
  english_pob_choice: look—
  chosen_korean: 보십시오—
  alternatives_korean:
  - 보라—
  - 여기—
  lexicon: HALOT
  rationale: 주의 환기 기능을 살리면서 현대 한국어 합쇼체에 맞게 직접적이고 즉각적인 표현으로 옮겼습니다.
- source_word: חַלְלֵי חֶרֶב
  english_pob_choice: those slain by the sword
  chosen_korean: 칼에 죽임을 당한 이들
  alternatives_korean:
  - 칼에 쓰러진 이들
  - 칼에 죽은 이들
  lexicon: HALOT
  rationale: ‘חֶרֶב’의 전쟁·폭력적 죽음을 한국어에서 가장 분명하게 드러내도록 ‘칼’과 피동 표현을 썼습니다.
- source_word: תַּחֲלוּאֵי רָעָב
  english_pob_choice: those sick with famine
  chosen_korean: 기근으로 병든 이들
  alternatives_korean:
  - 기근의 병들
  - 기근에 시달리는 이들
  lexicon: HALOT
  rationale: 추상명사보다 사람을 가리키는 병든 자들의 모습이 평행구조에 더 잘 맞아, 기근이 초래한 질병 상태로 풀었습니다.
- source_word: סָחֲרוּ אֶל אֶרֶץ
  english_pob_choice: wander through the land
  chosen_korean: 그 땅에 두루 다니면서도
  alternatives_korean:
  - 그 땅을 배회하면서도
  - 그 땅에서 이리저리 다니면서도
  lexicon: HALOT
  rationale: EN POB의 ‘wander through’에 대응하되, סחר의 이동·순회 이미지를 살려 ‘두루 다니다’로 옮겼습니다.
- source_word: וְלֹא יָדָעוּ
  english_pob_choice: and do not know what to do
  chosen_korean: 알지 못합니다
  alternatives_korean:
  - 무엇을 해야 할지 알지 못합니다
  - 깨닫지 못합니다
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘알지 못하다’이므로, 해석적 보충을 최소화해 본문의 모호성을 그대로 남겼습니다.
theological_decisions:
- issue: 마지막 절의 모호한 진술(예언자와 제사장이 ‘어디로/무엇을’ 알지 못하는가)
  chosen_reading: 한국어 본문은 ‘알지 못합니다’로 마감하여, 히브리어의 생략과 긴장을 그대로 보존했습니다.
  alternative_readings:
  - 무엇을 해야 할지 알지 못합니다
  - 어디로 가야 할지 알지 못합니다
  rationale: 원문은 목적어가 분명하지 않아 해석을 좁히면 의미를 과도하게 고정할 수 있습니다. 따라서 판독 불확실성을 드러내는 쪽이 본문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
