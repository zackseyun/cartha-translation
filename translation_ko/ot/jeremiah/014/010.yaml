id: JER.14.10
reference: Jeremiah 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּֽה אָמַ֨ר יְהוָ֜ה לָ/עָ֣ם הַ/זֶּ֗ה כֵּ֤ן אָֽהֲבוּ֙ לָ/נ֔וּעַ רַגְלֵי/הֶ֖ם לֹ֣א חָשָׂ֑כוּ וַ/יהוָה֙ לֹ֣א רָצָ֔/ם עַתָּה֙ יִזְכֹּ֣ר עֲוֺנָ֔/ם וְ/יִפְקֹ֖ד חַטֹּאתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/010.yaml
  text: 'Thus says Yahweh concerning this people: Thus they have loved to wander[a]; they have not restrained their feet. Therefore Yahweh does not accept them[c][b]. Now he will remember their iniquity and punish their sins.'
  footnotes:
  - marker: a
    text: Or, more literally, 'they loved to wander' or 'they loved to roam.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'the LORD is not pleased with them.'
    reason: lexical_alternative
  - marker: c
    text: Literally, 'he will remember their iniquity and visit their sins upon them,' a Hebrew idiom for calling sin to account in judgment.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 이 백성에 대하여 이렇게 말씀하십니다. “이처럼 그들은 떠돌아다니기를 좋아하였고[a], 자기 발을 붙들어 두지 않았습니다. 그러므로 야훼께서는 그들을 받아들이지 않으십니다[b]. 이제 그들의 죄악을 기억하시고 그들의 죄를 벌하실 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 אָהַב + 부정사 구조로, 단순한 이동이 아니라 ‘떠돌아다니기를 좋아하다’ 또는 ‘방랑하기를 즐기다’라는 뉘앙스를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼께서 그들을 기뻐하지 않으십니다.’
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그들의 죄악을 기억하시고 그들의 죄를 찾아 책임을 물으실 것’이라는 뜻으로, 죄를 심판하신다는 히브리어 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 언약 이름인 יְהוָה는 통상적 대치어보다 고유명사성을 살린 음역이 요구되므로, POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: לָעָם הַזֶּה
  english_pob_choice: concerning this people
  chosen_korean: 이 백성에 대하여
  alternatives_korean:
  - 이 백성에게
  - 이 백성을 위하여
  lexicon: HALOT
  rationale: ל는 예언적 선포에서 ‘~에 대하여/관하여’의 대상 표지를 이루므로, 발화의 대상으로 지시하는 한국어 표현을 택했습니다.
- source_word: אָהֲבוּ לָנוּעַ
  english_pob_choice: they have loved to wander
  chosen_korean: 떠돌아다니기를 좋아하였고
  alternatives_korean:
  - 떠돌기를 좋아하였고
  - 방황하기를 좋아하였고
  - 유랑하기를 좋아하였고
  lexicon: HALOT
  rationale: אָהַב + 부정사 구조의 선호/애호 뉘앙스를 살리면서, נוּעַ의 불안정한 이탈과 방랑적 움직임을 한국어로 자연스럽게 드러냈습니다.
- source_word: רַגְלֵיהֶם לֹא חָשָׂכוּ
  english_pob_choice: they have not restrained their feet
  chosen_korean: 자기 발을 억제하지 않았습니다
  alternatives_korean:
  - 자기 발을 붙들지 않았습니다
  - 자기 발을 멈추지 않았습니다
  - 자기 발을 제어하지 않았습니다
  lexicon: HALOT
  rationale: 직역 이미지를 보존하되 현대 한국어에서 이해되도록 ‘발’을 유지하면서, 행위의 방종성을 드러내는 동사 ‘억제하다’를 택했습니다.
- source_word: לֹא רָצָם
  english_pob_choice: does not accept them
  chosen_korean: 그들을 받아들이지 않으십니다
  alternatives_korean:
  - 그들을 기뻐하지 않으십니다
  - 그들을 기쁘게 여기지 않으십니다
  - 그들을 기꺼워하지 않으십니다
  lexicon: HALOT
  rationale: רצה는 단순 감정이 아니라 관계적 수납/호의의 부정을 나타낼 수 있으므로, 문맥상 ‘받아들이지 않다’가 가장 직접적입니다.
- source_word: יִזְכֹּר עֲוֺנָם
  english_pob_choice: he will remember their iniquity
  chosen_korean: 그들의 죄악을 기억하시고
  alternatives_korean:
  - 그들의 불의를 기억하시고
  - 그들의 악을 기억하시고
  - 그들의 죄책을 기억하시고
  lexicon: HALOT
  rationale: ‘기억하다’는 단순 회상이 아니라 심판적 기억의 관용구이므로 유지했고, עָוֺן의 도덕적·법적 무게를 살려 ‘죄악’으로 옮겼습니다.
- source_word: וְיִפְקֹד חַטֹּאתָם
  english_pob_choice: and punish their sins
  chosen_korean: 그들의 죄를 벌하실 것입니다
  alternatives_korean:
  - 그들의 죄를 찾아 징벌하실 것입니다
  - 그들의 죄를 물으실 것입니다
  - 그들의 죄를 심판하실 것입니다
  lexicon: HALOT
  rationale: פקד의 심판 문맥상 뜻을 한국어에서 분명하게 드러내되, ‘기억하시고…벌하실’의 병렬로 문장의 판결성을 유지했습니다.
theological_decisions:
- issue: 로마서식 교리어 대신 예언서의 심판 관용구를 어떻게 옮길지
  chosen_reading: ‘기억하시고 그들의 죄를 벌하실 것입니다’로 옮겨, 언약적 심판 선언의 직접성을 살렸습니다.
  alternative_readings:
  - ‘그들의 죄를 그들에게 돌리실 것입니다’
  - ‘그들의 죄를 방문하실 것입니다’
  rationale: 본문은 회상과 처벌을 함께 묶는 히브리어 법정 관용구를 사용하므로, 교리적 설명을 덧붙이기보다 예언적 선포의 날카로움을 보존하는 편이 더 충실합니다.
  doctrine_reference: 예언적 심판 선언과 언약적 책임 추궁의 표현 유지
