source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שֶׁ֚קֶר הַ/נְּבִאִים֙ נִבְּאִ֣ים בִּ/שְׁמִ֔/י לֹ֤א שְׁלַחְתִּי/ם֙ וְ/לֹ֣א צִוִּיתִ֔י/ם וְ/לֹ֥א דִבַּ֖רְתִּי אֲלֵי/הֶ֑ם חֲז֨וֹן שֶׁ֜קֶר וְ/קֶ֤סֶם ו/אלול ו/תרמות לִבָּ֔/ם הֵ֖מָּה מִֽתְנַבְּאִ֥ים לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/014.yaml
  text: And Yahweh said to me[a], “The prophets are prophesying lies in my name. I did not send them, nor did I command them, nor did I speak to them. They are prophesying to you a false vision, divination, emptiness, and the deceit of their own heart.”
  footnotes:
  - marker: a
    text: Or possibly “worthlessness” or “idol”; the Hebrew term can carry those senses in other contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 저에게 말씀하셨습니다. “예언자들이 내 이름으로 거짓을 예언하고 있습니다. 나는 그들을 보내지 않았고, 그들에게 명령하지도 않았으며, 그들에게 말하지도 않았습니다. 그들은 너희에게 거짓 환상과 점술과 헛된 것[a]과 그들 마음의 기만을 예언하고 있습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘헛됨’이나 ‘우상’으로도 옮길 수 있습니다. 히브리어는 다른 문맥에서 그런 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 프로젝트 기본 용례
  rationale: 고유신명은 프로젝트 기본값대로 야훼를 사용해 מקור भाष्या와의 대응을 유지했습니다.
- source_word: שֶׁקֶר
  english_pob_choice: lies / false
  chosen_korean: 거짓을
  alternatives_korean:
  - 거짓말을
  - 허위로
  lexicon: HALOT
  rationale: 예언 행위의 내용이 ‘거짓’이라는 점을 한국어 동사구로 자연스럽게 드러내기 위해 ‘거짓을 예언하다’로 옮겼습니다.
- source_word: חֲזוֹן שֶׁקֶר וְקֶסֶם ואלול
  english_pob_choice: a false vision, divination, emptiness
  chosen_korean: 거짓 환상과 점술과 허무
  alternatives_korean:
  - 거짓 환상과 점복과 공허
  - 거짓 환상과 주술과 헛됨
  lexicon: HALOT
  rationale: ‘חֲזוֹן’은 환상, ‘קֶסֶם’은 금지된 점술/점복 계열로 옮기되, POB의 ‘emptiness’에 해당하는 어휘는 문맥상 실체 없는 공허함을 살려 ‘허무’로 번역했습니다.
- source_word: תַּרְמוּת לִבָּם
  english_pob_choice: the deceit of their own heart
  chosen_korean: 자기 마음의 속임
  alternatives_korean:
  - 자기 마음의 기만
  - 그들 마음의 속임
  lexicon: HALOT
  rationale: ‘לִבָּם’의 소유성을 살려 ‘자기 마음의’로 옮기고, 내적 기만의 성격을 간결하게 ‘속임’으로 표현했습니다.
theological_decisions:
- issue: 거짓 예언의 출처
  chosen_reading: 이 구절은 예언자들의 발화가 야훼의 파송·명령·발화가 아니라 그들 자신의 내적 기만에서 나온 것임을 부정합니다.
  alternative_readings:
  - 네 개의 표현을 모두 단순한 동의 반복으로 볼 수 있습니다.
  rationale: 원문의 삼중 부정과 마지막 내적 기원 진술을 그대로 살려, 신적 권위 부재와 인간적 기만이라는 신학적 대비를 유지했습니다.
  doctrine_reference: 예언의 참됨은 야훼의 위임과 일치해야 합니다.
