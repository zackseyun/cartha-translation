base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/013.yaml
  text: Then I said, “Ah, Lord GOD, look, the prophets are saying to them, ‘You will not see the sword, and famine will not come upon you, for I will give you true peace in this place.’”
translation:
  language: ko
  text: 그때 내가 말했습니다. “아, 주 야훼여, 보십시오. 예언자들이 그들에게 ‘너희는 칼을 보지 않을 것이며 기근도 너희에게 닥치지 않을 것이다. 내가 이곳에서 너희에게 참된 평안을 주겠다’라고 말합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוִה / אֲדֹנָי
  english_pob_choice: Lord GOD
  chosen_korean: 주 야훼님
  alternatives_korean:
  - 주 하나님님
  - 주 여호와님
  lexicon: 야훼
  rationale: WLC의 אֲדֹנָי יְהוִה를 POB의 Lord GOD에 맞추되, 본문 속 신명은 프로젝트 기본값에 따라 야훼로 옮기고, 호격은 합쇼체로 자연스럽게 처리했습니다.
- source_word: וְרָעָב לֹא יִהְיֶה לָכֶם
  english_pob_choice: and famine will not come upon you
  chosen_korean: 기근도 너희에게 닥치지 않을 것이다
  alternatives_korean:
  - 기근이 너희에게 없을 것이다
  - 기근이 너희에게 일어나지 않을 것이다
  lexicon: 기근
  rationale: יִהְיֶה לָכֶם는 단순 존재보다 ‘너희에게 닥치다/미치다’의 충돌감을 잘 드러내므로, POB의 come upon you를 반영해 재앙의 도래를 살렸습니다.
- source_word: שְׁלוֹם אֱמֶת
  english_pob_choice: true peace
  chosen_korean: 참된 평안
  alternatives_korean:
  - 진정한 평화
  - 진실한 평안
  lexicon: 평강
  rationale: שָׁלוֹם의 어근적 평화를 한국어의 ‘평안’으로 자연스럽게 옮기고, אֱמֶת은 ‘참된’으로 처리해 허위 약속과 대비되는 의미를 보존했습니다.
- source_word: הַנְּבִאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들이
  alternatives_korean:
  - 선지자들이
  - 예언자들
  lexicon: 예언자
  rationale: 예언 행위 중심의 직능을 드러내기 위해 ‘예언자’를 택했으며, 전통 교회어 ‘선지자’보다 원어적 기능을 더 직접적으로 반영했습니다.
theological_decisions:
- issue: 야훼 호칭과 다성적 직설화
  chosen_reading: 문장 첫 호격은 ‘아, 주 야훼님’으로 두어 예레미야의 탄식과 직접 기도를 현대 한국어에서 자연스럽게 보이게 했습니다.
  alternative_readings:
  - 아, 주 하나님
  - 아, 주 여호와님
  rationale: 본문의 אֲהָהּ는 탄식/하소연의 감탄사이므로, 단순 진술보다 기도적 호격으로 옮기는 것이 문맥에 충실합니다.
  doctrine_reference: 예레미야 14:13의 선지자 탄원 장면
