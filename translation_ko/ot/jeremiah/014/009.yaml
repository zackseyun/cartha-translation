  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֤/מָּה תִֽהְיֶה֙ כְּ/אִ֣ישׁ נִדְהָ֔ם כְּ/גִבּ֖וֹר לֹא יוּכַ֣ל לְ/הוֹשִׁ֑יעַ וְ/אַתָּ֧ה בְ/קִרְבֵּ֣/נוּ יְהוָ֗ה וְ/שִׁמְ/ךָ֛ עָלֵ֥י/נוּ נִקְרָ֖א אַל תַּנִּחֵֽ/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/009.yaml
  text: Why should you be like a stunned man[a], like a warrior who cannot save? Yet you are in our midst, O Yahweh, and your name is called over us; do not forsake us.
  footnotes:
  - marker: a
    text: Or, more idiomatically, “we are called by your name.” Literally, “your name is called over us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 어찌하여 주께서는 놀란 사람[a]처럼, 구원할 수 없는 용사처럼 되셔야 합니까? 그러나 주께서는 우리 가운데 계시고, 야훼여, 주의 이름이 우리 위에 불리고 있으니 우리를 버리지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 관용적으로는 “우리가 주의 이름으로 불립니다”라고도 옮길 수 있습니다. 직역하면 “주의 이름이 우리 위에 불리고 있습니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה תִהְיֶה
  english_pob_choice: Why should you be
  chosen_korean: 어찌하여 주께서는 … 되셔야 합니까?
  alternatives_korean:
  - 왜 주께서는 … 되십니까?
  - 어찌하여 주께서는 … 되시겠습니까?
  lexicon: HALOT
  rationale: 수사적 항의가 담긴 שאלת־תהייה이므로 단순 미래보다 ‘되셔야 합니까?’가 원문의 항변 뉘앙스를 자연스럽게 살립니다.
- source_word: כְאִישׁ נִדְהָם
  english_pob_choice: like a stunned man
  chosen_korean: 놀란 사람
  alternatives_korean:
  - 멍해진 사람
  - 당황한 사람
  - 기절한 사람
  lexicon: HALOT
  rationale: נִדְהָם은 충격으로 얼어붙거나 말문이 막힌 상태를 가리키므로, ‘놀란 사람’이 과도한 해석 없이 현대 한국어로 가장 자연스럽습니다.
- source_word: כְגִבּוֹר לֹא יוּכַל לְהוֹשִׁיעַ
  english_pob_choice: like a warrior who cannot save
  chosen_korean: 구원할 수 없는 용사처럼
  alternatives_korean:
  - 구원하지 못하는 전사처럼
  - 도와줄 수 없는 용사처럼
  lexicon: HALOT
  rationale: גִּבּוֹר은 단순한 강자가 아니라 전투적 맥락의 용사/전사이므로 ‘용사’가 문맥에 맞고, הוֹשִׁיעַ는 구원/건짐의 뜻을 살려 ‘구원할 수 없는’으로 옮겼습니다.
- source_word: וְשִׁמְךָ עָלֵינוּ נִקְרָא
  english_pob_choice: your name is called over us
  chosen_korean: 주의 이름이 우리 위에 불리고 있으니
  alternatives_korean:
  - 우리가 주의 이름으로 불리니
  - 주의 이름이 우리에게 불려지니
  lexicon: HALOT
  rationale: 히브리어 관용구의 문자적 이미지를 살리기 위해 ‘우리 위에 불리고 있으니’로 두어, 소속·언약적 표지를 드러내면서도 과도한 의역을 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 개인적 언약 이름인 יהוה를 관습적 대치어인 ‘주’로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’로 음역했습니다.
theological_decisions:
- issue: 언약적 소속을 나타내는 ‘주의 이름이 우리 위에 불리고 있으니’의 표현 유지
  chosen_reading: 문자적 이미지를 유지해 소속과 보호를 암시하는 언약 문구로 읽었습니다.
  alternative_readings:
  - 우리가 주의 이름으로 불립니다
  - 주의 이름이 우리에게 속해 있습니다
  rationale: 본문은 단순한 명명보다 하나님의 소유권·언약적 귀속을 말하므로, 한국어에서도 그 긴장을 보존하는 것이 본문의 힘을 더 잘 드러냅니다.
  doctrine_reference: Translation philosophy — source-text texture preservation
