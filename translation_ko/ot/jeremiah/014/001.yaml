  text: אֲשֶׁ֨ר הָיָ֤ה דְבַר יְהוָה֙ אֶֽל יִרְמְיָ֔הוּ עַל דִּבְרֵ֖י הַ/בַּצָּרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/001.yaml
  text: The word of Yahweh that came to Jeremiah concerning the droughts[a].
  footnotes:
  - marker: a
    text: Or 'concerning the matters of the drought' or 'concerning the drought.' The Hebrew uses a plural form, which may refer to repeated drought conditions or to drought-related crises.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께로부터 예레미야에게 임한 말씀은 가뭄들에 관한 것이었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘가뭄의 일들에 관하여’ 또는 ‘가뭄에 관하여’. 히브리어는 복수형을 쓰며, 반복된 가뭄 상황이나 가뭄과 관련된 위기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼께로부터 … 말씀
  alternatives_korean:
  - 야훼의 말씀
  - 야훼의 말씀이
  lexicon: HALOT
  rationale: 예언 서문의 정형구를 살리되, יְהוָה는 관용적 ‘주’로 돌리지 않고 ‘야훼’로 옮겨 고유명을 보존했습니다.
- source_word: הָיָה … אֶל יִרְמְיָהוּ
  english_pob_choice: came to Jeremiah
  chosen_korean: 예레미야에게 임한
  alternatives_korean:
  - 예레미야에게 온
  - 예레미야에게 이른
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘…이 임하다/오다’의 예언 문맥을 한국어로 자연스럽게 재현했습니다.
- source_word: עַל דִּבְרֵי הַבַּצָּרוֹת
  english_pob_choice: concerning the droughts
  chosen_korean: 가뭄들에 관한
  alternatives_korean:
  - 가뭄에 관한
  - 가뭄의 일들에 관한
  - 가뭄들의 문제에 관한
  lexicon: HALOT
  rationale: 복수형 דִּבְרֵי הַבַּצָּרוֹת를 반영해 단수로 평준화하지 않고, ‘가뭄들’로 옮겨 반복적·복합적 가뭄 상황의 여지를 살렸습니다.
theological_decisions:
- issue: 여호와/주(主) 대신 יְהוָה를 어떻게 처리할지
  chosen_reading: 본문에는 ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 출처 본문이 신명기적 제목이 아니라 여호와의 고유명을 직접 사용하므로, 대체 호칭을 쓰지 않고 표준 학술 음역을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
