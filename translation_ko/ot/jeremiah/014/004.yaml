id: JER.14.4
reference: Jeremiah 14:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/עֲב֤וּר הָ/אֲדָמָה֙ חַ֔תָּה כִּ֛י לֹא הָיָ֥ה גֶ֖שֶׁם בָּ/אָ֑רֶץ בֹּ֥שׁוּ אִכָּרִ֖ים חָפ֥וּ רֹאשָֽׁ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/004.yaml
  text: Because the ground is dismayed[a], since there has been no rain in the land, the farmers are ashamed[b]; they cover their heads.
  footnotes:
  - marker: a
    text: Or 'the ground is shattered/broken.' The Hebrew verb can denote being broken or dismayed; in this drought context it likely refers to the earth being cracked open.
    reason: lexical_alternative
  - marker: b
    text: Covering the head is a cultural sign of shame, grief, or mourning.
    reason: cultural_note
translation:
  language: ko
  text: 땅이 갈라졌기 때문입니다[a], 땅에는 비가 오지 않았으므로 농부들은 수치를 당합니다[b]. 그들은 머리를 가립니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅이 부서졌다/깨졌다.’ 히브리어 동사는 ‘깨지다’와 ‘낙담하다’를 모두 뜻할 수 있으나, 이 가뭄 문맥에서는 땅이 갈라져 열린 상태를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 머리를 가리는 행위는 수치, 슬픔, 애도의 문화적 표지입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בַּעֲבוּר הָאֲדָמָה
  english_pob_choice: Because the ground is dismayed / cracked
  chosen_korean: 땅이 갈라졌기 때문입니다
  alternatives_korean:
  - 땅이 몹시 상했기 때문입니다
  - 땅이 갈라져 있기 때문입니다
  lexicon: HALOT
  rationale: ‘הָאֲדָמָה’는 여기서 가뭄으로 피해를 입은 땅을 가리키므로 ‘땅’이 자연스럽고, ‘חַתָּה’는 문맥상 갈라짐·균열의 상태를 드러내므로 ‘갈라졌기 때문입니다’가 의미를 가장 직접적으로 반영합니다.
- source_word: כִּי לֹא הָיָה גֶשֶׁם בָּאָרֶץ
  english_pob_choice: since there has been no rain in the land
  chosen_korean: 땅에는 비가 오지 않았으므로
  alternatives_korean:
  - 그 땅에 비가 내리지 않았으므로
  - 그 땅에 비가 없었으므로
  lexicon: HALOT
  rationale: ‘גֶשֶׁם’은 단순히 ‘비’로 옮기는 것이 가장 자연스럽고, 반복되는 인과를 한국어의 종속절로 압축해도 원문의 이유 제시를 충분히 보존합니다.
- source_word: בֹּשׁוּ
  english_pob_choice: are ashamed
  chosen_korean: 수치를 당합니다
  alternatives_korean:
  - 부끄러워합니다
  - 수치스럽습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 감정이라기보다 공개적 수치와 굴욕을 뜻하므로, 사회적·예언적 맥락을 살리는 ‘수치를 당합니다’가 ‘부끄러워합니다’보다 더 강합니다.
- source_word: חָפוּ רֹאשָׁם
  english_pob_choice: they cover their heads
  chosen_korean: 그들은 머리를 가립니다
  alternatives_korean:
  - 그들은 머리에 가리개를 씁니다
  - 그들은 머리를 덮습니다
  lexicon: HALOT
  rationale: 머리를 가리는 행위는 수치·애통의 문화적 표지이므로, 의미를 설명하기보다 행위 자체를 간결하게 옮겼습니다.
theological_decisions:
- issue: 가뭄으로 인한 땅의 상태를 형상화하는 표현의 강도
  chosen_reading: ‘땅이 갈라졌기 때문입니다’로 옮겨, 단순한 감정 표현이 아니라 가뭄의 물리적 결과를 드러냈습니다.
  alternative_readings:
  - ‘땅이 수심에 잠겼기 때문입니다’
  - ‘땅이 황폐해졌기 때문입니다’
  rationale: 문맥은 비가 없음으로 인한 지면의 균열을 말하므로, 한국어에서도 땅의 물리적 손상을 직접 보이게 하는 것이 원문의 예언적 생동감을 더 잘 전달합니다.
  doctrine_reference: Creation and judgment imagery in prophetic literature
