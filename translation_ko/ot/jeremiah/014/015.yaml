source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֣ר יְהוָ֗ה עַֽל הַ/נְּבִאִ֞ים הַ/נִּבְּאִ֣ים בִּ/שְׁמִ/י֮ וַ/אֲנִ֣י לֹֽא שְׁלַחְתִּי/ם֒ וְ/הֵ֨מָּה֙ אֹֽמְרִ֔ים חֶ֣רֶב וְ/רָעָ֔ב לֹ֥א יִהְיֶ֖ה בָּ/אָ֣רֶץ הַ/זֹּ֑את בַּ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִתַּ֔מּוּ הַ/נְּבִאִ֖ים הָ/הֵֽמָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/015.yaml
  text: 'Therefore thus says Yahweh concerning the prophets who prophesy in my name though I did not send them[a], and who say, ‘Sword and famine will not be in this land’: by sword and by famine those prophets will be consumed.'
  footnotes:
  - marker: a
    text: Or, 'war and famine will not come upon this land.' The Hebrew reads literally, 'sword and famine will not be in this land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. 내 이름으로 예언하면서 내가 보내지 않은 그 예언자들, 곧 「칼과 기근이 이 땅에 없을 것이다」라고 말하는 그 예언자들에 대하여 말씀하십니다. 그 예언자들은 칼과 기근으로 끝장나게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '전쟁과 기근이 이 땅에 닥치지 않을 것이다'. 히브리어는 문자적으로 '칼과 기근이 이 땅에 없을 것이다'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 그런 까닭에
  lexicon: HALOT
  rationale: 앞뒤 문맥의 결론을 이끄는 접속으로서, 현대 한국어에서 가장 자연스럽고 분명한 대응은 '그러므로'입니다.
- source_word: הַנְּבִאִים הַנִּבְּאִים
  english_pob_choice: the prophets who prophesy
  chosen_korean: 예언자들, 곧 예언하면서
  alternatives_korean:
  - 예언하는 예언자들
  - 예언자들
  lexicon: HALOT
  rationale: 명사와 동사의 반복을 살려 예언자라는 직함과 실제 행위를 함께 드러내었습니다.
- source_word: בִּשְׁמִי
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름을 빙자하여
  - 내 이름 안에서
  lexicon: HALOT
  rationale: 자기 권위의 근거를 주장하는 관용구로서, 한국어에서는 '내 이름으로'가 가장 직접적입니다.
- source_word: חֶרֶב וְרָעָב
  english_pob_choice: Sword and famine
  chosen_korean: 칼과 기근
  alternatives_korean:
  - 전쟁과 기근
  - 칼과 굶주림
  lexicon: HALOT
  rationale: 히브리어의 '칼'은 전쟁 심판의 상징적 표현이므로, 본문 이미지를 살려 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
