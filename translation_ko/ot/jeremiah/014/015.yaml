  - 주님
  rationale: 본문의 신명사를 고유명사로 드러내는 프로젝트 기본 원칙을 따랐습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: 거짓 예언자에 대한 심판 표현
  chosen_reading: 칼과 기근으로 끝장나게 될 것입니다
  alternative_readings:
  - 칼과 기근으로 망할 것입니다
  - 칼과 기근으로 죽을 것입니다
  rationale: יִתַּמּוּ의 '완결/소멸' 의미를 심판 문맥에서 살리되, 과도하게 완곡하거나 설명적으로 만들지 않았습니다.
  doctrine_reference: Jeremiah judgment oracle wording
