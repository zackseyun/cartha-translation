  source_fidelity: 히브리어의 들나귀, 초목 없는 높은 지대, 자칼 같은 헐떡임, 눈의 쇠진, 풀의 부재를 대체로 충실히 반영합니다. 다만 שְׁפָיִם은 복수의 드러난 높은 지대를 가리키므로 ‘벌거벗은 산꼭대기’보다 ‘민둥한 산등성이’가 더 자연스럽고 정확합니다.
