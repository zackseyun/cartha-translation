id: JER.14.6
reference: Jeremiah 14:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/פְרָאִים֙ עָמְד֣וּ עַל שְׁפָיִ֔ם שָׁאֲפ֥וּ ר֖וּחַ כַּ/תַּנִּ֑ים כָּל֥וּ עֵינֵי/הֶ֖ם כִּי אֵ֥ין עֵֽשֶׂב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/006.yaml
  text: And the wild donkeys stand on the bare heights[a]; they pant for air like jackals. Their eyes fail[c][b], because there is no grass.
  footnotes:
  - marker: a
    text: Or 'wild asses.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they gasp for breath' or more literally 'they draw in wind.'
    reason: lexical_alternative
  - marker: c
    text: Or 'like jackals'; older translations sometimes have 'like dragons,' but the Hebrew here most likely refers to a desert scavenger animal in this context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 들나귀들이 민둥한 산등성이에 서서[a] 자칼처럼[c] 숨을 헐떡입니다[b]. 그 눈이 쇠해 갑니다. 풀이 없기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황량한 높은 곳에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘바람을 들이마십니다’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여기서 자칼을 가리키는 것으로 가장 잘 이해됩니다. 일부 오래된 번역은 ‘용들’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פְרָאִים
  english_pob_choice: the wild donkeys
  chosen_korean: 들나귀들
  alternatives_korean:
  - 야생 당나귀들
  - 들당나귀들
  lexicon: HALOT
  rationale: פְרָאִים은 들나귀/야생 당나귀를 가리키므로, 현대 한국어에서 자연스럽고 의미가 분명한 ‘들나귀들’로 옮겼습니다.
- source_word: עַל שְׁפָיִם
  english_pob_choice: on the bare heights
  chosen_korean: 벌거벗은 산꼭대기에
  alternatives_korean:
  - 메마른 산들에
  - 드러난 높은 곳에
  lexicon: HALOT
  rationale: שְׁפָיִם은 나무나 초목이 없는 드러난 높은 지대를 뜻하므로, 지형의 높이와 황폐함을 함께 살리는 ‘벌거벗은 산꼭대기’로 옮겼습니다.
- source_word: שָׁאֲפוּ רוּחַ
  english_pob_choice: they pant for air
  chosen_korean: 숨을 헐떡입니다
  alternatives_korean:
  - 공기를 들이마십니다
  - 바람을 들이마십니다
  lexicon: HALOT
  rationale: 직역하면 ‘바람/공기를 들이마시다’이지만, 사막 같은 가뭄 상황의 고통스러운 호흡을 한국어로 가장 자연스럽게 드러내는 표현은 ‘숨을 헐떡입니다’입니다.
- source_word: כַּ/תַּנִּים
  english_pob_choice: like jackals
  chosen_korean: 자칼처럼
  alternatives_korean:
  - 승냥이처럼
  - 용들처럼
  lexicon: HALOT
  rationale: 이 문맥의 תַּנִּים은 황폐한 곳의 사냥·먹잇감 동물인 자칼을 가리키므로, POB의 판단을 따라 ‘자칼처럼’으로 옮겼습니다.
- source_word: כָּלוּ עֵינֵיהֶם
  english_pob_choice: their eyes fail
  chosen_korean: 그들의 눈은 시들어 갑니다
  alternatives_korean:
  - 그들의 눈은 희미해집니다
  - 그들의 눈은 쇠합니다
  lexicon: HALOT
  rationale: ‘눈이 다하다/시들다’는 지친 상태로 시력과 기력이 꺼져 가는 뜻이므로, 감각적 쇠락을 살리는 ‘시들어 갑니다’로 옮겼습니다.
- source_word: כִּי אֵין עֵשֶׂב
  english_pob_choice: because there is no grass
  chosen_korean: 풀이 없기 때문입니다
  alternatives_korean:
  - 목초가 없기 때문입니다
  - 초목이 없기 때문입니다
  lexicon: HALOT
  rationale: עֵשֶׂב은 가축이 뜯는 풀/목초를 가리키므로, 문맥상 가장 직접적이고 간결한 ‘풀이 없다’로 옮겼습니다.
theological_decisions:
- issue: 재난의 생생한 현재형 묘사
  chosen_reading: 현재형으로 ‘서 있습니다’, ‘헐떡입니다’, ‘시들어 갑니다’라고 옮겨, 예언적 장면의 눈앞에 펼쳐지는 긴박함을 살렸습니다.
  alternative_readings:
  - 과거형으로 일관해 ‘섰습니다’, ‘헐떡였습니다’, ‘시들었습니다’로 옮길 수 있습니다.
  rationale: 히브리어 완료형이지만, 예언적·묘사적 문맥에서는 현재형이 장면의 생동감과 지속성을 더 잘 드러냅니다.
  doctrine_reference: 예언 문체와 한국어 서술 시점의 적합성
