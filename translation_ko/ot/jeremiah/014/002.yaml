id: JER.14.2
reference: Jeremiah 14:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָבְלָ֣ה יְהוּדָ֔ה וּ/שְׁעָרֶ֥י/הָ אֻמְלְל֖וּ קָדְר֣וּ לָ/אָ֑רֶץ וְ/צִוְחַ֥ת יְרוּשָׁלִַ֖ם עָלָֽתָה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/002.yaml
  text: Judah mourns[a], and her gates languish; they grow dark on the ground, and the cry of Jerusalem goes up.
  footnotes:
  - marker: a
    text: Or 'are dark to the ground' / 'grow black on the ground.' The Hebrew verb can denote becoming dark, often in mourning imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다는 애도하고, 그 성문들은 쇠잔하며 땅 위에서 어두워지며[a], 예루살렘의 부르짖음은 올라갑니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어두워지며’는 히브리어 동사가 애도 장면에서 ‘검게 되다’ 또는 ‘어두워지다’를 뜻할 수 있음을 반영한 표현입니다. ‘땅 위에서’는 ‘땅으로/땅에’라는 원문의 표현을 따른 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבְלָה
  english_pob_choice: mourns
  chosen_korean: 애도합니다
  alternatives_korean:
  - 슬퍼합니다
  - 통곡합니다
  - 애통합니다
  lexicon: HALOT
  rationale: 완료형 동사지만 예언적 시적 문맥에서 현재형으로 옮기는 것이 자연스럽고, '애도하다'는 mourning의 공적·집단적 뉘앙스를 비교적 정확히 살립니다.
- source_word: שְׁעָרֶיהָ
  english_pob_choice: her gates
  chosen_korean: 그 성문들은
  alternatives_korean:
  - 그 문들은
  - 그 도시의 문들은
  - 그 성문들
  lexicon: HALOT
  rationale: 문맥상 성문의 쇠잔은 도시 전체의 붕괴를 상징하므로, 구체적 이미지인 '성문'을 유지하되 한국어 문장 흐름상 주어를 명확히 했습니다.
- source_word: אֻמְלְל֖וּ
  english_pob_choice: languish
  chosen_korean: 쇠잔하며
  alternatives_korean:
  - 시들며
  - 쇠약해지며
  - 기운을 잃으며
  lexicon: HALOT
  rationale: 생명력의 소진과 무력함을 나타내는 결과상태를 '쇠잔하다'로 옮기면, 식물적 '시들다'보다 도시 성문의 비참한 상태를 더 잘 드러냅니다.
- source_word: קָדְרוּ
  english_pob_choice: grow dark
  chosen_korean: 어둡게 되고
  alternatives_korean:
  - 검게 되고
  - 어둠 속에 있고
  - 침울해지고
  lexicon: HALOT
  rationale: 문맥상 애도 이미지와 낮아짐이 함께 있으므로, 단순히 색을 말하는 '검게'보다 상태 변화인 '어둡게 되다'가 원문의 중의성을 더 잘 살립니다.
- source_word: לָאָרֶץ
  english_pob_choice: on the ground
  chosen_korean: 땅에 드리운 채
  alternatives_korean:
  - 땅바닥에
  - 땅에
  - 땅 위에
  lexicon: HALOT
  rationale: 직역된 장소표현을 넘어서 굴복·수치의 자세를 반영하되, 원문의 구체적 '땅' 이미지는 유지했습니다.
- source_word: צִוְחַת
  english_pob_choice: the cry
  chosen_korean: 부르짖음
  alternatives_korean:
  - 울부짖음
  - 외침
  - 통곡
  lexicon: HALOT
  rationale: 고통과 절규의 소리를 가리키므로, 단순 '외침'보다 더 강한 '부르짖음'이 적절합니다.
- source_word: עָלָתָה
  english_pob_choice: goes up
  chosen_korean: 올라갑니다
  alternatives_korean:
  - 상승합니다
  - 올려집니다
  - 치솟습니다
  lexicon: HALOT
  rationale: עלה의 기본 동작인 '올라가다'를 그대로 살려, 예루살렘의 부르짖음이 위로 향한다는 시적 이미지를 보존했습니다.
theological_decisions:
- issue: 애도와 어둠의 병렬적 이미지
  chosen_reading: 도시의 쇠잔과 어둠을 단순한 풍경 묘사가 아니라 심판 아래 놓인 공동체의 상태로 읽고, 한국어도 그 비탄의 공적 성격을 드러내도록 옮겼습니다.
  alternative_readings:
  - 단순한 자연 풍경 묘사로 약화해 읽는 방식
  - 개인의 감정으로 축소하는 방식
  rationale: 문맥상 유다와 예루살렘 전체에 대한 예언적 애가이므로, 공동체적 붕괴와 애도의 무게를 보존하는 것이 본문의 의도에 부합합니다.
  doctrine_reference: 예언서의 심판-애가 문맥
