  text: מִקְוֵה֙ יִשְׂרָאֵ֔ל מֽוֹשִׁיע֖/וֹ בְּ/עֵ֣ת צָרָ֑ה לָ֤/מָּה תִֽהְיֶה֙ כְּ/גֵ֣ר בָּ/אָ֔רֶץ וּ/כְ/אֹרֵ֖חַ נָטָ֥ה לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/008.yaml
  text: O Hope of Israel[a], his Savior in time of distress, why should you be like a foreigner in the land[b], like a traveler who turns aside to spend the night?
  footnotes:
  - marker: a
    text: Or 'like a stranger in the land' or 'like a sojourner in the land.'
    reason: lexical_alternative
  - marker: b
    text: Or 'like a wayfarer who stops only to lodge.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘의 소망이시며 환난 때에 이스라엘을 구원하시는 주님이여, 어찌하여 이 땅의 외지인[a] 같으시며, 하룻밤 묵으려고 잠시 들른 길손[b] 같으십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 땅의 외지인’은 ‘이 땅에 사는 나그네’ 또는 ‘이 땅의 거류민’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하룻밤 묵으려고 잠시 들른 길손’은 ‘묵으려고 길을 돌린 여행자’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְוֵה
  english_pob_choice: Hope
  chosen_korean: 소망
  alternatives_korean:
  - 희망
  - 소망의 근원
  lexicon: HALOT
  rationale: 희망보다 소망이 시편·예언서의 기도 문맥에서 더 자연스럽고, 하나님을 향한 신앙적 기대를 잘 드러냅니다. '소망의 근원'은 의미를 덧붙이므로 본문을 좁히지 않는 쪽을 택했습니다.
- source_word: מוֹשִׁיעוֹ
  english_pob_choice: his Savior
  chosen_korean: 그의 구원자
  alternatives_korean:
  - 그를 구원하시는 분
  - 그의 구원자이신 분
  lexicon: HALOT
  rationale: 히브리어의 3인칭 단수 소유격을 살려 '그의 구원자'로 옮겼고, 하나님께 대한 호칭이므로 문맥상 주님께 직접 호격을 붙였습니다.
- source_word: בְּעֵת צָרָה
  english_pob_choice: in time of distress
  chosen_korean: 환난 때
  alternatives_korean:
  - 고통의 때에
  - 곤경의 때에
  lexicon: HALOT
  rationale: צָרָה는 단순한 불편이 아니라 압박과 재난이 있는 위기 상황을 가리키므로, 예언문맥에 어울리는 '환난'을 택했습니다.
- source_word: כְּגֵר בָּאָרֶץ / וּכְאֹרֵחַ נָטָה לָלוּן
  english_pob_choice: like a foreigner in the land, like a traveler who turns aside to spend the night
  chosen_korean: 이 땅에서 나그네 같으시며, 하룻밤 묵으려고 발길을 돌린 여행자 같으십니까
  alternatives_korean:
  - 그 땅에서 외국인 같으시며, 밤을 묵으려 들른 길손 같으십니까
  - 이 땅의 외지인 같으시며, 묵으려고 잠시 멈춘 나그네 같으십니까
  lexicon: HALOT
  rationale: גֵר는 단순한 관광객이 아니라 땅 안에 있으면서도 완전히 속하지 않은 체류 외인에 가깝기 때문에, 한국어 성경에서 널리 이해되는 '나그네'를 선택했습니다. אֹרֵחַ과 נָטָה לָלוּן은 잠깐 머무르기 위한 이동을 함께 보여 주므로 '하룻밤 묵으려고 발길을 돌린 여행자'로 옮겼습니다.
theological_decisions:
- issue: 기도체의 직접 호격과 존칭
  chosen_reading: 본문을 야훼께 드리는 탄원으로 보고 '주님이여'를 사용해 직접 호격을 살렸습니다.
  alternative_readings:
  - '''이스라엘의 소망이시며…''를 서술형으로 평평하게 처리하는 방식'
  - '''하나님이시여''로 일반화하는 방식'
  rationale: 본문은 예레미야의 탄식 기도이며, 수사적 질문 앞의 호격이 핵심이므로 직접 부름의 긴장을 유지해야 합니다. '주님'은 야훼를 가리키는 기도체 호칭으로 자연스럽고, 합쇼체와도 조화를 이룹니다.
  doctrine_reference: Jeremiah 14:8 prayer context; Translation philosophy §§1, 6
