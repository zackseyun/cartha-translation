id: JER.14.19
reference: Jeremiah 14:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/מָאֹ֨ס מָאַ֜סְתָּ אֶת יְהוּדָ֗ה אִם בְּ/צִיּוֹן֙ גָּעֲלָ֣ה נַפְשֶׁ֔/ךָ מַדּ֨וּעַ֙ הִכִּיתָ֔/נוּ וְ/אֵ֥ין לָ֖/נוּ מַרְפֵּ֑א קַוֵּ֤ה לְ/שָׁלוֹם֙ וְ/אֵ֣ין ט֔וֹב וּ/לְ/עֵ֥ת מַרְפֵּ֖א וְ/הִנֵּ֥ה בְעָתָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/019.yaml
  text: Have you utterly rejected Judah? Does your soul loathe Zion? Why have you struck us so that there is no healing for us? We hoped for peace[a], but there was no good, and for a time of healing, but behold[b], terror.
  footnotes:
  - marker: a
    text: Or, 'Or does your soul loathe Zion?' The Hebrew particle can introduce the second question in a disjunctive sense.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your soul,' a vivid expression for the inner self or whole person.
    reason: lexical_alternative
translation:
  language: ko
  text: 주께서 유다를 완전히 버리셨습니까? 시온을 주의 영혼이 미워하십니까[a]? 어찌하여 주께서 우리를 치셔서 우리에게는 치유가 없습니까? 우리는 평강을 기다렸으나 좋은 것은 없었고, 치유의 때를 기다렸으나 보십시오[b], 공포가 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “시온을 주의 영혼이 미워하십니까?” 히브리어 입자는 둘째 질문을 분리된 물음으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 “주의 영혼”은 내면 또는 온 존재를 가리키는 생생한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/מָאֹס מָאַסְתָּ
  english_pob_choice: Have you utterly rejected
  chosen_korean: 완전히 버리셨습니까
  alternatives_korean:
  - 완전히 거절하셨습니까
  - 정말 버리셨습니까
  lexicon: HALOT
  rationale: מאס의 강조형은 단순한 거절보다 강한 배척을 나타내므로, ‘완전히 버리다’로 그 강도를 살렸습니다.
- source_word: גָּעֲלָה נַפְשֶׁךָ
  english_pob_choice: Does your soul loathe
  chosen_korean: 주의 영혼이 미워하십니까
  alternatives_korean:
  - 주께서 싫어하십니까
  - 주께서 혐오하십니까
  lexicon: HALOT
  rationale: נפשך를 직역해 ‘영혼’으로 두어 히브리어의 생생한 인격 표현을 보존했고, געל은 강한 혐오를 뜻하므로 ‘미워하다’로 옮겼습니다.
- source_word: הִכִּיתָנוּ
  english_pob_choice: have you struck us
  chosen_korean: 우리를 치셔서
  alternatives_korean:
  - 우리에게 상처를 주셔서
  - 우리를 치셨기에
  lexicon: HALOT
  rationale: נכה의 구체적 동작 이미지를 살려 ‘치다’로 옮기고, 결과절로 이어지는 구조를 자연스럽게 반영했습니다.
- source_word: מַרְפֵּא
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 회복
  - 낫게 함
  lexicon: HALOT
  rationale: 두 번 반복되는 מַרְפֵּא를 현대 한국어에서 자연스러운 명사인 ‘치유’로 일관되게 옮겨, 회복의 뜻을 유지했습니다.
- source_word: קַוֵּה לְ/שָׁלוֹם
  english_pob_choice: We hoped for peace
  chosen_korean: 우리는 평강을 기다렸으나
  alternatives_korean:
  - 우리는 평화를 바랐으나
  - 우리는 평안을 기다렸으나
  lexicon: HALOT
  rationale: שָׁלוֹם을 관례적이면서도 본문의 신학적 울림을 살리는 ‘평강’으로 옮기고, קוה의 기대를 ‘기다리다’로 표현했습니다.
- source_word: בְעָתָה
  english_pob_choice: terror
  chosen_korean: 공포
  alternatives_korean:
  - 두려움
  - 갑작스런 공포
  lexicon: HALOT
  rationale: 문장 끝의 충격을 압축적으로 전달하는 말로 ‘공포’를 택해, 예기치 못한 재난의 느낌을 살렸습니다.
theological_decisions:
- issue: 예언자적 탄식에서 하나님께 직접 묻는 표현
  chosen_reading: 질문의 날카로움을 그대로 살려, 심판 속에서 드리는 탄식이자 기도라는 긴장을 유지했습니다.
  alternative_readings:
  - 심판의 징계라는 설명을 덧붙여 완화하기
  - 문장을 선언문처럼 바꾸기
  rationale: 본문은 하나님의 거절과 시온에 대한 혐오를 직접 묻는 애통의 언어이므로, 이를 완화하지 않고 그대로 드러내는 것이 문맥과 신학적 긴장을 보존합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
