  terminology: ‘굶주림과 칼’, ‘내던져질’, ‘묻어 줄 사람’, ‘쏟아부을’은 본문의 심판 어휘와 현대 한국어 합쇼체에 적절합니다. רָעָתָם의 ‘악/재앙’ 양의성은 본문과 각주에서 유지했습니다.
