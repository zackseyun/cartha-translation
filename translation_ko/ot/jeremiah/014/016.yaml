id: JER.14.16
reference: Jeremiah 14:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָ/עָ֣ם אֲשֶׁר הֵ֣מָּה נִבְּאִ֣ים לָ/הֶ֡ם יִֽהְי֣וּ מֻשְׁלָכִים֩ בְּ/חֻצ֨וֹת יְרוּשָׁלִַ֜ם מִ/פְּנֵ֣י הָ/רָעָ֣ב וְ/הַ/חֶ֗רֶב וְ/אֵ֤ין מְקַבֵּר֙ לָ/הֵ֔מָּה הֵ֣מָּה נְשֵׁי/הֶ֔ם וּ/בְנֵי/הֶ֖ם וּ/בְנֹֽתֵי/הֶ֑ם וְ/שָׁפַכְתִּ֥י עֲלֵי/הֶ֖ם אֶת רָעָתָֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/016.yaml
  text: And the people to whom they are prophesying will be thrown out into the streets of Jerusalem because of the famine and the sword[a], with no one to bury them—them, their wives, their sons, and their daughters. And I will pour out on them their evil.
  footnotes:
  - marker: a
    text: Or 'their wickedness,' or 'the disaster due to them / their calamity.' The Hebrew word can refer either to moral evil or to the resulting disaster.
    reason: alternative_reading
translation:
  language: ko
  text: 그들에게 예언하는 자들이 예언하는 백성은 굶주림과 칼 때문에 예루살렘의 거리들에 내던져질 것이며, 그들 자신과 그들의 아내와 아들들과 딸들을 묻어 줄 사람도 없을 것입니다. 나는 그들 위에 그들의 악을 쏟아부을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 악’은 ‘그들의 악행’ 또는 ‘그들에게 닥칠 재앙/그들의 재앙’으로도 옮길 수 있습니다. 히브리어는 도덕적 악과 그 결과로서의 재앙을 모두 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעָם ... יִהְיוּ מֻשְׁלָכִים
  english_pob_choice: the people ... will be thrown out / cast out
  chosen_korean: 내던져질 것입니다
  alternatives_korean:
  - 던져질 것입니다
  - 쫓겨나 길에 버려질 것입니다
  lexicon: HALOT
  rationale: מֻשְׁלָכִים는 ‘던져지다/내던져지다’의 수동적 결과를 나타내며, 시체가 수치스럽게 노출되는 장면을 한국어에서 자연스럽게 드러내기 위해 ‘내던져질’로 옮겼습니다.
- source_word: בְּחֻצוֹת יְרוּשָׁלִַם
  english_pob_choice: into the streets of Jerusalem
  chosen_korean: 예루살렘의 거리로
  alternatives_korean:
  - 예루살렘 거리에서
  - 예루살렘의 거리들로
  lexicon: HALOT
  rationale: חֻצוֹת은 공공의 거리/광장을 가리키므로, 수동 표현과 함께 결과 지점인 ‘-로’ 구문을 써서 ‘던져져 들어가는 곳’을 분명히 했습니다.
- source_word: וְאֵין מְקַבֵּר לָהֵמָּה
  english_pob_choice: with no one to bury them
  chosen_korean: 그들을 묻어 줄 사람도 없을 것입니다
  alternatives_korean:
  - 그들을 장사할 사람도 없을 것입니다
  - 그들을 묻는 이도 없을 것입니다
  lexicon: HALOT
  rationale: אין + 분사는 ‘그런 사람이 전혀 없음’을 뜻하므로, 문맥에 맞게 ‘-해 줄 사람도 없을 것입니다’로 옮겨 부재의 강도를 살렸습니다.
- source_word: וְשָׁפַכְתִּי עֲלֵיהֶם אֶת רָעָתָם
  english_pob_choice: And I will pour out on them their evil
  chosen_korean: 나는 그들 위에 그들의 악을 쏟아부을 것입니다
  alternatives_korean:
  - 나는 그들 위에 그들의 재앙을 쏟아부을 것입니다
  - 나는 그들 위에 그들에게 닥칠 재난을 쏟아부을 것입니다
  lexicon: HALOT
  rationale: רָעָה는 ‘악’과 ‘재앙/재난’ 모두 가능하지만, 영어 POB처럼 본문은 의미의 긴장을 열어 두는 쪽이므로 기본적으로 ‘그들의 악’을 유지하고, 한국어에서는 심판의 폭포적 이미지를 살려 ‘쏟아부을’로 옮겼습니다.
theological_decisions:
- issue: רָעָתָם의 의미 범위 유지
  chosen_reading: ‘그들의 악’으로 두되, 심판의 결과라는 뉘앙스를 문맥에서 함께 느끼게 했습니다.
  alternative_readings:
  - ‘그들의 재앙’
  - ‘그들에게 닥칠 재난’
  - ‘그들의 악행’
  rationale: 히브리어는 도덕적 악과 그에 따른 재앙을 모두 가리킬 수 있으므로, 본문이 가진 해석적 긴장을 단일 의미로 좁히지 않는 것이 POB의 원칙에 맞습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
