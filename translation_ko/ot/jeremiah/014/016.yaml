revisions:
- from: 그들에게 예언하고 있는 그 백성은 굶주림과 칼 때문에 예루살렘의 거리로 내던져질 것이며, 그들을 묻어 줄 사람도 없을 것입니다. 그들, 곧 그들의 아내와 아들들과 딸들도 그러할 것입니다. 나는 그들 위에 그들의 악을 쏟아부을 것입니다.[a]
  to: 그들에게 예언하는 자들이 예언하는 백성은 굶주림과 칼 때문에 예루살렘의 거리들에 내던져질 것이며, 그들 자신과 그들의 아내와 아들들과 딸들을 묻어 줄 사람도 없을 것입니다. 나는 그들 위에 그들의 악을 쏟아부을 것입니다.[a]
  rationale: 관계절을 ‘그들에게 예언하는 자들이 예언하는 백성’으로 고쳐 예언의 주체인 예언자들과 수혜/대상인 백성의 관계를 보존했습니다. 가족 목록을 ‘묻어 줄 사람도 없을’ 대상 안에 포함하여 히브리어의 동격적 나열을 반영했습니다. רָעָתָם의 의미상 양의성은 본문의 ‘그들의 악’과 각주로 유지했습니다.
  reviewer_model: gpt-5.6-terra
