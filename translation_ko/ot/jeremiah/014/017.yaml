id: JER.14.17
reference: Jeremiah 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֤ אֲלֵי/הֶם֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה תֵּרַ֨דְנָה עֵינַ֥/י דִּמְעָ֛ה לַ֥יְלָה וְ/יוֹמָ֖ם וְ/אַל תִּדְמֶ֑ינָה כִּי֩ שֶׁ֨בֶר גָּד֜וֹל נִשְׁבְּרָ֗ה בְּתוּלַת֙ בַּת עַמִּ֔/י מַכָּ֖ה נַחְלָ֥ה מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/017.yaml
  text: 'And you shall say to them this word: ‘Let my eyes run down with tears night and day[a], and let them not cease, for the virgin daughter of my people is broken with a great breaking[c][b], with a very grievous wound.’'
  footnotes:
  - marker: a
    text: Or 'and let them not be silent' / 'and let them not rest'; the Hebrew verb can carry the sense of becoming still or ceasing.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the virgin daughter of my people,' a poetic personification of the people as a young woman.
    reason: cultural_note
  - marker: c
    text: Hebrew literally uses a cognate expression, 'a great breaking is broken,' for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들에게 이 말을 하십시오. “내 눈에서 밤낮으로 눈물이 흘러내리게 하고[a], 그치지 않게 하십시오. 이는 내 백성의 처녀 딸이 큰 파괴를 당해 부서졌으며[c][b], 매우 심한 상처를 입었기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “잠잠하지 않게 하라”, “쉬지 않게 하라”. 히브리어 동사는 멈추다, 조용해지다, 그치다의 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “내 백성의 처녀 딸”이라고 하며, 백성을 젊은 여인으로 의인화한 시적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 “큰 깨짐으로 깨졌다”와 같은 동족어 반복을 사용하여 강세를 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵיהֶם
  english_pob_choice: And you shall say to them
  chosen_korean: 그리고 그들에게 이 말을 하십시오
  alternatives_korean:
  - 그리고 그들에게 이렇게 말하십시오
  - 그러고는 그들에게 이 말을 하십시오
  lexicon: HALOT
  rationale: 예언적 지시문의 명령/미래적 명령 기능을 살리면서, 한국어에서는 자연스러운 공손 명령형으로 옮겼습니다.
- source_word: אֶת הַדָּבָר הַזֶּה
  english_pob_choice: this word
  chosen_korean: 이 말
  alternatives_korean:
  - 이 말씀
  - 이 메시지
  lexicon: HALOT
  rationale: דָּבָר는 여기서 한 단락의 선포를 가리키므로, 직역적인 "말"을 사용해 간결성과 מקור 밀착성을 유지했습니다.
- source_word: תֵּרַדְנָה עֵינַי דִּמְעָה לַיְלָה וְיוֹמָם
  english_pob_choice: Let my eyes run down with tears night and day
  chosen_korean: 내 눈이 밤낮으로 눈물로 흘러내리게 하되
  alternatives_korean:
  - 내 눈에서 밤낮으로 눈물이 흐르게 하되
  - 내 눈이 밤낮으로 눈물을 흘리게 하되
  lexicon: HALOT
  rationale: 눈이 "흘러내리다"는 이미지를 살려 히브리어의 생생한 관용구를 보존했고, "밤낮"으로 마리즘을 자연스럽게 옮겼습니다.
- source_word: וְאַל תִּדְמֶינָה
  english_pob_choice: and let them not cease
  chosen_korean: 그치지 않게 하십시오
  alternatives_korean:
  - 잠잠하지 않게 하십시오
  - 쉬지 않게 하십시오
  lexicon: HALOT
  rationale: 이 문맥에서 דמה는 눈물의 중지를 뜻하므로, 한국어로는 가장 직접적인 "그치다"를 택해 의미를 분명히 했습니다.
- source_word: שֶׁבֶר גָּדוֹל נִשְׁבְּרָה
  english_pob_choice: is broken with a great breaking
  chosen_korean: 큰 파멸로 부서졌고
  alternatives_korean:
  - 큰 깨짐으로 깨졌고
  - 큰 붕괴로 무너졌고
  lexicon: HALOT
  rationale: 히브리어의 어근 중복으로 된 강조를 한국어에서 "큰 파멸"과 "부서졌고"로 살려, 단순한 손상보다 강한 파괴성을 드러냈습니다.
- source_word: בְּתוּלַת בַּת עַמִּי
  english_pob_choice: the virgin daughter of my people
  chosen_korean: 내 백성의 처녀 딸
  alternatives_korean:
  - 내 백성의 처녀인 딸
  - 내 백성의 젊은 딸
  lexicon: HALOT
  rationale: 예언적 의인화 표현을 그대로 유지해, 민족을 젊은 여성으로 부르는 비유적이고 애가적인 톤을 보존했습니다.
- source_word: מַכָּה נַחְלָה מְאֹד
  english_pob_choice: with a very grievous wound
  chosen_korean: 매우 심한 상처를 입었기 때문입니다
  alternatives_korean:
  - 심각한 상처를 입었기 때문입니다
  - 몹시 아픈 상처를 입었기 때문입니다
  lexicon: HALOT
  rationale: נַחְלָה는 중증·심각함을 나타내므로 "심한 상처"로 옮겨 과도한 의학화 없이 강도를 전달했습니다.
theological_decisions:
- issue: 예언적 애가에서 1인칭 화자의 지속적 눈물 명령
  chosen_reading: 하나님이 선포하시는 애가 형식을 살려, 명령형의 공적 선언으로 옮겼습니다.
  alternative_readings:
  - 직설법으로 "내 눈은 눈물로 흐릅니다"라고 옮김
  - 완곡하게 "눈물을 흘리게 하라"로 바꿈
  rationale: 본문은 단순한 감정 묘사가 아니라 예언자가 전달해야 하는 공적 애가이므로, 원문의 지시적·선언적 성격을 유지하는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: '"내 백성의 처녀 딸"의 의인화'
  chosen_reading: 이스라엘/유다를 처녀 딸로 부르는 시적 의인화로 그대로 유지했습니다.
  alternative_readings:
  - 내 백성(유다)
  - 예루살렘
  rationale: 이 표현은 수사적 비탄을 강화하는 표어이므로, 평이한 설명어로 풀어 쓰지 않고 메타포를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 6
