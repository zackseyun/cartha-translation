    rationale: 히브리어는 ‘눈’이 눈물과 함께 흘러내리는 시적 표현이지만, 한국어에서는 눈 자체가 눈물로 흘러내린다고 하면 의미 관계가 불분명합니다. ‘내 눈에서 … 눈물이 흘러내리게’가 자연스럽게 같은 시상을 전달합니다.
