id: JER.14.20
reference: Jeremiah 14:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יָדַ֧עְנוּ יְהוָ֛ה רִשְׁעֵ֖/נוּ עֲוֺ֣ן אֲבוֹתֵ֑י/נוּ כִּ֥י חָטָ֖אנוּ לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/020.yaml
  text: We acknowledge[a], O Yahweh, our wickedness, the iniquity of our fathers, for we have sinned against you.
  footnotes:
  - marker: a
    text: Or 'our ancestors.' The Hebrew reads 'our fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 우리는 우리의 악과 우리 조상들[a]의 죄악을 인정합니다. 우리가 야훼께 죄를 지었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘우리 아버지들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְנוּ
  english_pob_choice: We acknowledge
  chosen_korean: 인정합니다
  alternatives_korean:
  - 압니다
  - 고백합니다
  lexicon: HALOT
  rationale: ידע의 기본 뜻은 ‘알다’이지만, 이 회개적 문맥에서는 죄를 사실대로 받아들이고 시인하는 뜻이 강하므로 ‘인정합니다’가 가장 자연스럽고 공손한 합쇼체 표현입니다.
- source_word: רִשְׁעֵנוּ
  english_pob_choice: our wickedness
  chosen_korean: 우리의 악
  alternatives_korean:
  - 우리의 악함
  - 우리의 죄악
  lexicon: HALOT
  rationale: רֶשַׁע는 단순한 행위 하나보다 불의하고 악한 상태를 가리킬 수 있어, 한국어에서는 명사형 ‘악’으로 간결하게 옮겨 그 무게를 살렸습니다.
- source_word: עֲוֺן אֲבוֹתֵינוּ
  english_pob_choice: the iniquity of our fathers
  chosen_korean: 우리 조상들의 죄악
  alternatives_korean:
  - 우리 조상들의 죄책
  - 우리 아버지들의 죄악
  lexicon: HALOT
  rationale: עָוֹן은 ‘죄악/죄책’/‘불의’의 뜻을 담을 수 있으며, 여기서는 앞의 ‘악’과 평행을 이루도록 ‘죄악’으로 번역했습니다. 또한 אֲבוֹתֵינוּ는 문자적으로 ‘우리의 아버지들’이지만, 한국어 독자에게는 세대적 의미를 살린 ‘조상들’이 더 자연스럽습니다.
- source_word: לָךְ
  english_pob_choice: against you
  chosen_korean: 주님께
  alternatives_korean:
  - 주님을 향해
  - 주님에게
  lexicon: HALOT
  rationale: חָטָא with the object marker can indicate the offended party; 한국어에서는 ‘죄를 짓다’가 이미 대상 손상을 내포하므로 ‘주님께 죄를 지었습니다’로 자연스럽게 나타냈습니다.
theological_decisions:
- issue: 야훼의 호칭을 한국어로 어떻게 옮길지
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절의 직설적 탄원문에서는 한국어 예배 언어의 수용성을 고려해 ‘주님’으로 옮겼습니다. 다만 원문은 여호와/주가 아니라 יהוה의 직접 표기이므로, 본문 번역에서는 일반 독자가 기도문으로 읽기 자연스러운 경어를 우선했습니다.
  doctrine_reference: 'POB Korean style policy: direct-source rendering with Korean liturgical readability'
- issue: 아버지들/조상들의 처리
  chosen_reading: 우리 조상들의 죄악
  alternative_readings:
  - 우리 아버지들의 죄악
  rationale: 히브리어는 남성 복수형 ‘우리의 아버지들’이지만, 예레미야의 회개 기도에서는 세대적 집단 책임이 강조되므로 한국어에서는 의미를 분명히 하는 ‘조상들’이 적절합니다.
  doctrine_reference: 'Translation philosophy: gender-accurate source preservation with readable Korean equivalent'
