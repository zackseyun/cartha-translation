  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י יָצֻ֗מוּ אֵינֶ֤/נִּי שֹׁמֵ֨עַ֙ אֶל רִנָּתָ֔/ם וְ/כִ֧י יַעֲל֛וּ עֹלָ֥ה וּ/מִנְחָ֖ה אֵינֶ֣/נִּי רֹצָ֑/ם כִּ֗י בַּ/חֶ֨רֶב֙ וּ/בָ/רָעָ֣ב וּ/בַ/דֶּ֔בֶר אָנֹכִ֖י מְכַלֶּ֥ה אוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/012.yaml
  text: Though they fast[a], I do not hear their cry; and though they offer up burnt offering and grain offering, I do not accept them. Rather, by the sword, by famine[d][c][b], and by pestilence I am consuming them.
  footnotes:
  - marker: a
    text: Or 'I do not hear their cry.'
    reason: lexical_alternative
  - marker: b
    text: Or 'grain offering' may also be understood more broadly as a 'tribute offering,' but in sacrificial context it usually refers to the grain offering.
    reason: lexical_alternative
  - marker: c
    text: Or 'I do not delight in them' or 'I do not favor them.'
    reason: lexical_alternative
  - marker: d
    text: '''Pestilence'' may also be rendered ''plague.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 금식할지라도 나는 그들의 부르짖음을 듣지 않습니다. 그들이 번제와 소제[a]를 드릴지라도 나는 그것들을 받지 않습니다. 오히려 칼과 기근과 전염병으로 나는 그들을 소멸하고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소제’는 제의적 맥락에서의 מִנְחָה를 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצֻמוּ
  english_pob_choice: they fast
  chosen_korean: 금식할지라도
  alternatives_korean:
  - 금식하면
  - 그들이 금식해도
  lexicon: HALOT
  rationale: 히브리어의 양보적 조건을 한국어에서 ‘-할지라도’로 자연스럽게 살려, 단순한 시간 진술보다 거절의 뉘앙스를 분명히 했습니다.
- source_word: אֵינֶנִּי שֹׁמֵעַ אֶל רִנָּתָם
  english_pob_choice: I do not hear their cry
  chosen_korean: 나는 그들의 부르짖음을 듣지 않습니다
  alternatives_korean:
  - 나는 그들의 외침을 듣지 않습니다
  - 나는 그들의 호소를 듣지 않습니다
  lexicon: HALOT
  rationale: רִנָּה의 호소·부르짖음 성격을 살리되, 예배적·감정적 맥락을 과장하지 않도록 ‘부르짖음’으로 옮겼습니다.
- source_word: עֹלָה וּמִנְחָה
  english_pob_choice: burnt offering and grain offering
  chosen_korean: 번제와 소제
  alternatives_korean:
  - 번제와 곡식제물
  - 번제와 곡식 제물
  lexicon: HALOT
  rationale: 제의 용어는 한국어 성경 전통에서 널리 쓰이는 정식 용례를 따르되, מִנְחָה는 문맥상 일반 ‘헌물’보다 ‘소제’가 더 정확합니다.
- source_word: אֵינֶנִּי רֹצָם
  english_pob_choice: I do not accept them
  chosen_korean: 나는 그것들을 받지 않습니다
  alternatives_korean:
  - 나는 그것들을 기뻐하지 않습니다
  - 나는 그것들을 받아들이지 않습니다
  lexicon: HALOT
  rationale: רצה의 제의적 의미인 ‘호의적으로 받아들이다’를 한국어에서 간결하게 표현하는 기본값으로 ‘받지 않습니다’를 택했습니다.
- source_word: אָנֹכִי מְכַלֶּה אוֹתָם
  english_pob_choice: I am consuming them
  chosen_korean: 나는 그들을 소멸하고 있습니다
  alternatives_korean:
  - 나는 그들을 끝내고 있습니다
  - 나는 그들을 멸하고 있습니다
  lexicon: HALOT
  rationale: כלה의 진행형적 강세를 살리면서, 심판의 지속적 소진·파괴를 드러내는 ‘소멸하고 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 금식과 제사의 거절 범위
  chosen_reading: 이 절은 금식과 제사 모두가 하나님께 받아들여지지 않는다고 말하며, 그 이유를 칼·기근·전염병의 심판으로 제시합니다.
  alternative_readings:
  - 거절은 기도만을 향하고 제사는 포함하지 않을 수 있음
  - 거절은 일시적일 뿐 심판적 의미는 약함
  rationale: 평행 구조가 금식과 제사를 함께 거절하며, 마지막 절이 그 이유를 분명히 심판으로 설명하므로 이를 약화하지 않았습니다.
  doctrine_reference: 예레미야 14:12의 문맥상 심판 선언
