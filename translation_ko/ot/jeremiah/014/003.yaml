id: JER.14.3
reference: Jeremiah 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַדִּ֣רֵי/הֶ֔ם שָׁלְח֥וּ צעורי/הם לַ/מָּ֑יִם בָּ֣אוּ עַל גֵּבִ֞ים לֹא מָ֣צְאוּ מַ֗יִם שָׁ֤בוּ כְלֵי/הֶם֙ רֵיקָ֔ם בֹּ֥שׁוּ וְ/הָכְלְמ֖וּ וְ/חָפ֥וּ רֹאשָֽׁ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/003.yaml
  text: Their nobles send their servants for water[a]; they come to the cisterns and find no water. They return with their containers empty; they are ashamed and humiliated[c][b], and they cover their heads.
  footnotes:
  - marker: a
    text: Or 'their youths' or 'their little ones' for 'their servants' (צְעוּרֵיהֶם); the context of nobles sending subordinates for water favors a social rather than age-based sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'pits' or 'pools' for 'cisterns.'
    reason: lexical_alternative
  - marker: c
    text: Covering the head was a cultural sign of shame, mourning, or distress.
    reason: cultural_note
translation:
  language: ko
  text: 그들의 귀족들은 물을 구하러 종들을 보냅니다[a]. 그들은 저수조들에 갔으나 물을 찾지 못합니다[b]. 그들은 그릇을 빈 채로 가지고 돌아옵니다. 그들은 부끄러워하고 수치를 당하며, 머리를 가립니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 젊은이들’ 또는 ‘그들의 어린이들’로도 옮길 수 있습니다. 여기서는 귀족이 부하를 파견하는 사회적 문맥이므로 ‘종들’로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘구덩이들’ 또는 ‘연못들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 머리를 가리는 행위는 수치, 애도, 혹은 깊은 곤경을 나타내는 문화적 표지였습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אַדִּירֵיהֶם
  english_pob_choice: their nobles
  chosen_korean: 그들의 귀족들
  alternatives_korean:
  - 그들의 권세자들
  - 그들의 높은 이들
  - 그들의 세력가들
  lexicon: HALOT
  rationale: 문맥상 우두머리·유력자를 가리키므로, 신분 위계를 드러내는 ‘귀족들’이 자연스럽고 간결합니다.
- source_word: צְעוּרֵיהֶם
  english_pob_choice: their servants
  chosen_korean: 종들
  alternatives_korean:
  - 하인들
  - 젊은이들
  - 어린아이들
  lexicon: HALOT
  rationale: 물 긷는 일에 파견되는 하급 종속자를 가리키는 사회적 관계가 핵심이므로 ‘종들’로 옮겼습니다.
- source_word: גֵּבִים
  english_pob_choice: the cisterns
  chosen_korean: 웅덩이들
  alternatives_korean:
  - 물웅덩이들
  - 저수 구덩이들
  - 저장 웅덩이들
  lexicon: HALOT
  rationale: 가뭄 문맥에서 물이 고일 수 있는 파임을 가리키며, 한국어에서는 ‘웅덩이들’이 본문의 넓은 의미를 무리 없이 담습니다.
- source_word: וְחָפוּ רֹאשָׁם
  english_pob_choice: and they cover their heads
  chosen_korean: 머리를 가립니다
  alternatives_korean:
  - 머리를 덮습니다
  - 머리를 가리고 있습니다
  - 머리를 숙입니다
  lexicon: HALOT
  rationale: 수치와 애도의 문화적 표지를 직역에 가깝게 유지하되, 한국어에서도 이해되는 행동 묘사로 ‘머리를 가립니다’라고 옮겼습니다.
theological_decisions:
- issue: 수치와 애도의 제스처를 어떻게 드러낼지
  chosen_reading: ‘부끄러워하며 수치를 당하고, 머리를 가립니다’로 두 동사를 살려 수치의 중첩과 문화적 제스처를 함께 보이게 했습니다.
  alternative_readings:
  - ‘부끄럽고 당황하여 머리를 숙입니다’
  - ‘수치를 당해 머리를 가립니다’
  rationale: 히브리어의 병렬은 단순한 감정 표현을 넘어 공개적 망신과 상실감을 강조하므로, 이를 약화하지 않도록 했습니다.
  doctrine_reference: 문맥적 묘사; 예레미야 14장의 가뭄과 수치 서술
