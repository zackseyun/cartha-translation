    issue: ‘헛것들 가운데 비를 내리게 하는 이’의 지시 표현
    rationale: ‘헛것들’은 비인격적 복수 명사인데 ‘이’는 사람을 가리키는 말이라 결합이 부자연스럽습니다. 히브리어 분사는 해당 대상들의 강우 유발 여부를 묻는 것이므로 ‘비를 내리게 하는 것이’가 자연스럽고 의미를 보존합니다.
