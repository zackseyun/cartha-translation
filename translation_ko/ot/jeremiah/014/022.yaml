id: JER.14.22
reference: Jeremiah 14:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יֵ֨שׁ בְּ/הַבְלֵ֤י הַ/גּוֹיִם֙ מַגְשִׁמִ֔ים וְ/אִם הַ/שָּׁמַ֖יִם יִתְּנ֣וּ רְבִבִ֑ים הֲ/לֹ֨א אַתָּה ה֜וּא יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ וּ֨/נְקַוֶּה לָּ֔/ךְ כִּֽי אַתָּ֥ה עָשִׂ֖יתָ אֶת כָּל אֵֽלֶּה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/022.yaml
  text: Are there any among the idols of the nations that bring rain? Or can the heavens give showers? Is it not you[a], O Yahweh our God? And we wait for you[c][b], for you have made all these things.
  footnotes:
  - marker: a
    text: Hebrew 'the vanities of the nations'; that is, the nations' idols or worthless gods.
    reason: lexical_alternative
  - marker: b
    text: Or 'And we hope in you' / 'Therefore we put our hope in you.' The Hebrew verb can express waiting with expectant hope.
    reason: lexical_alternative
  - marker: c
    text: Or 'you have done all these things.'
    reason: alternative_reading
translation:
  language: ko
  text: 민족들의 헛것들[a] 가운데 비를 내리게 하는 것이 있습니까? 아니면 하늘이 소나기를 내릴 수 있습니까? 야훼, 우리 하나님, 바로 당신이 아니십니까? 우리는 당신을 기다립니다[b]. 당신이 이 모든 것을 지으셨기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족들의 헛것들’은 히브리어 ‘민족들의 허무한 것들’을 옮긴 것으로, 문맥상 우상들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘기다립니다’는 ‘희망합니다/소망합니다’로도 옮길 수 있습니다. 히브리어 동사는 기대를 품고 기다리는 뜻을 함께 가집니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘이 모든 것을 하셨기 때문입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְלֵי הַגּוֹיִם
  english_pob_choice: the idols of the nations
  chosen_korean: 민족들의 헛것들
  alternatives_korean:
  - 민족들의 우상들
  - 열방의 헛것들
  lexicon: HALOT
  rationale: הֶבֶל은 문자적으로 ‘헛됨/허무’이지만, 예언서의 우상 비판 맥락에서는 실재 없는 우상 숭배 대상을 가리킵니다. 한국어에서는 ‘헛것들’이 원문의 폄하와 우상 비판을 함께 살립니다.
- source_word: מַגְשִׁמִים
  english_pob_choice: that bring rain
  chosen_korean: 비를 내리게 하는
  alternatives_korean:
  - 비를 주는
  - 비를 내리는
  lexicon: HALOT
  rationale: הִגְשִׁים 계열의 사역 의미를 살려, 우상이 비를 ‘만들어 내는’ 능력이 없다는 점을 드러내는 표현으로 옮겼습니다.
- source_word: הַשָּׁמַיִם יִתְּנוּ רְבִבִים
  english_pob_choice: can the heavens give showers
  chosen_korean: 하늘이 소나기를 줄 수 있습니까
  alternatives_korean:
  - 하늘이 비를 내릴 수 있습니까
  - 하늘이 소낙비를 줄 수 있습니까
  lexicon: HALOT
  rationale: רְבִבִים은 ‘소나기/소낙비’에 가까워서, 단순한 비보다 강한 강수 이미지를 살렸습니다. 의문문 구조도 그대로 유지했습니다.
- source_word: הֲלֹא אַתָּה הוּא יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Is it not you, O Yahweh our God?
  chosen_korean: 야훼 우리 하나님, 바로 당신이 아니십니까
  alternatives_korean:
  - 야훼 우리 하나님, 당신이 아니십니까
  - 우리 하나님 야훼, 바로 당신이 아니십니까
  lexicon: HALOT
  rationale: יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮기고, אַתָּה הוּא의 강한 식별문은 ‘바로 당신이 아니십니까’로 살렸습니다. 직접 호칭이므로 합쇼체를 유지했습니다.
- source_word: וּנְקַוֶּה לָּךְ
  english_pob_choice: And we wait for you
  chosen_korean: 우리는 당신을 기다립니다
  alternatives_korean:
  - 우리는 당신을 소망합니다
  - 우리는 당신을 기다리며 소망합니다
  lexicon: HALOT
  rationale: קוה는 ‘기다리다/기대하다/소망하다’를 모두 가질 수 있지만, 이 문맥에서는 비를 구하며 하나님께 매달리는 기대를 드러냅니다. 본문 흐름을 자연스럽게 살리되 너무 해석적으로 확장하지 않도록 ‘기다립니다’를 택했습니다.
- source_word: עָשִׂיתָ אֶת כָּל אֵלֶּה
  english_pob_choice: you have made all these things
  chosen_korean: 당신이 이 모든 것을 지으셨기 때문입니다
  alternatives_korean:
  - 당신이 이 모든 것을 하셨기 때문입니다
  - 당신이 이 모든 것을 만드셨기 때문입니다
  lexicon: HALOT
  rationale: עָשָׂה는 ‘하다/만들다’ 둘 다 가능하지만, 여기서는 비와 하늘과 자연 현상 전체에 대한 창조주적 주권을 근거로 제시하므로 ‘지으셨다’가 가장 적절합니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 직접 가리키는 자리이므로, 번역 제목이나 대체 칭호가 아니라 신적 고유명사 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 문장의 종결과 직접 호칭의 경어
  chosen_reading: 하나님께 직접 묻는 반문은 합쇼체로 유지
  alternative_readings:
  - 평서체로 완화
  - 전통적 하옵나이다체
  rationale: 본문은 예언적 탄원/고백의 문맥에서 하나님께 직접 호소하는 말이므로, 현대 표준어 합쇼체를 쓰되 하나님께 드리는 직접 호칭의 경어성을 보존했습니다.
  doctrine_reference: Translation style and register guideline
