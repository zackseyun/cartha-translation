  verdict: revise
  source_fidelity: 개정이 필요합니다. תִּתְפַּלֵּל은 ‘기도하다’이며, 현행 ‘복을 구하다’는 기도 행위를 ‘복을 구함’으로 바꾸어 원문의 핵심 동사를 충분히 드러내지 못합니다. לְטוֹבָה는 이 백성의 유익·안녕을 목적으로 한다는 뜻이므로 ‘잘되도록’이 자연스럽고 충실합니다.
  naturalness: ‘그때 야훼께서 저에게 말씀하셨습니다’와 합쇼체 서술은 자연스럽습니다. ‘이 백성이 잘되도록 기도하지 마십시오’는 현대 표준 한국어에서 자연스러우면서도 금지와 중보 기도의 목적을 분명히 합니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. ‘기도하다’는 תִּתְפַּלֵּל의 기본 의미를 보존하며, ‘안녕’은 לְטוֹבָה의 가능한 문맥적 대안으로 각주에 제시합니다.
  issues:
