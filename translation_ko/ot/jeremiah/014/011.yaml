    rationale: 원문은 ‘이 백성을 위하여, 그들의 유익을 목적으로 기도하지 말라’고 금합니다. ‘복을 구하다’는 결과물인 복에 초점을 옮기며 기도 행위를 약화하고, ‘복’은 원문의 넓은 ‘좋음·유익·안녕’보다 다소 좁거나 종교적으로 특정된 뉘앙스를 낼 수 있습니다.
