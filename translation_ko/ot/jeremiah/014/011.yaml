lexical_decisions:
- source_word: וַיֹּאמֶר יְהוָה אֵלַי
  english_pob_choice: Then Yahweh said to me
  chosen_korean: 그때 야훼께서 저에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 야훼께서 저에게 말씀하셨습니다
  - 그러자 야훼께서 저에게 말씀하셨습니다
  lexicon: WLC; HALOT
  rationale: 와우 연속의 서술 진행은 한국어에서 자연스러운 시간 전환인 ‘그때’로 살리고, יְהוָה는 본문 그대로 고유명사 ‘야훼’로 옮겼습니다.
- source_word: אַל תִּתְפַּלֵּל
  english_pob_choice: Do not pray
  chosen_korean: 복을 구하지 마십시오
  alternatives_korean:
  - 기도하지 마십시오
  - 그들을 위해 기도하지 마십시오
  lexicon: HALOT
  rationale: תִּתְפַּלֵּל의 핵심은 중보적 간구이므로 ‘기도하다’보다 ‘구하다’가 목적어와 결합해 더 직접적으로 금지의 의미를 드러냅니다. POB의 ‘pray for the good/welfare’도 한국어에서는 자연스럽게 ‘복을 구하다’로 압축할 수 있습니다.
- source_word: בְּעַד הָעָם הַזֶּה לְטוֹבָה
  english_pob_choice: for the welfare/good of this people
  chosen_korean: 이 백성을 위해 복을 구하지 마십시오
  alternatives_korean:
  - 이 백성의 안녕을 위해 구하지 마십시오
  - 이 백성의 복을 위해 기도하지 마십시오
  lexicon: HALOT
  rationale: בְּעַד은 ‘~을 위해/대신에’의 중보 목적을 나타내므로 ‘이 백성을 위해’로 살렸고, לְטוֹבָה는 ‘좋은 것, 복, 유익’의 방향성을 가진 표현이므로 ‘복’이 가장 간결합니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 전통적 대체어인 ‘주님’ 대신 본문 고유명사 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원문이 יהוה를 직접 사용하므로, 본문이 드러내는 언약적 신명성을 유지하기 위해 이름 자체를 옮기는 방식을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
