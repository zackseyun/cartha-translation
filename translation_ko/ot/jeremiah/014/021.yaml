id: JER.14.21
reference: Jeremiah 14:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַל תִּנְאַץ֙ לְמַ֣עַן שִׁמְ/ךָ֔ אַל תְּנַבֵּ֖ל כִּסֵּ֣א כְבוֹדֶ֑/ךָ זְכֹ֕ר אַל תָּפֵ֥ר בְּרִֽיתְ/ךָ֖ אִתָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/021.yaml
  text: Do not spurn us for the sake of your name; do not dishonor your glorious throne[a]. Remember; do not break your covenant with us.
  footnotes:
  - marker: a
    text: Or more literally, 'the throne of your glory.'
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 이름을 위하여 우리를 물리치지 마소서. 당신의 영광스러운 보좌를 욕되게 하지 마소서[a]. 기억하소서. 우리와 맺으신 당신의 언약을 깨뜨리지 마소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 영광의 보좌’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנאַץ
  english_pob_choice: spurn
  chosen_korean: 물리치지 마소서
  alternatives_korean:
  - 버리지 마소서
  - 업신여기지 마소서
  - 거절하지 마소서
  lexicon: HALOT
  rationale: נאץ의 강한 경멸적 거부를 반영하기 위해 단순한 ‘거절’보다 강한 표현을 택했습니다. 간구체에 맞게 하나님께 드리는 직접 호소로 처리했습니다.
- source_word: לְמַעַן שִׁמְךָ
  english_pob_choice: for the sake of your name
  chosen_korean: 당신의 이름을 위하여
  alternatives_korean:
  - 당신의 이름 때문에
  - 당신의 이름을 위해
  lexicon: HALOT
  rationale: 하나님의 이름이 곧 그분의 명성과 언약적 성품을 가리키는 관용구이므로, 그 신학적 무게를 살리는 자연스러운 한국어로 옮겼습니다.
- source_word: תְּנַבֵּל כִּסֵּא כְבוֹדֶךָ
  english_pob_choice: do not dishonor your glorious throne
  chosen_korean: 당신의 영광스러운 보좌를 욕되게 하지 마소서
  alternatives_korean:
  - 당신의 영광의 보좌를 수치스럽게 하지 마소서
  - 당신의 영광의 보좌를 더럽히지 마소서
  lexicon: HALOT
  rationale: נבל의 ‘수치스럽게 하다/욕되게 하다’는 뜻을 살려 ‘욕되게 하다’를 택했습니다. ‘보좌’는 כִּסֵּא의 기본 대응으로, 왕권과 영광의 이미지를 자연스럽게 전달합니다.
- source_word: בְּרִיתְךָ אִתָּנוּ
  english_pob_choice: your covenant with us
  chosen_korean: 우리와 맺으신 당신의 언약
  alternatives_korean:
  - 우리와의 당신의 언약
  - 우리와 함께하신 당신의 언약
  lexicon: HALOT
  rationale: בְּרִית를 ‘언약’으로 유지하고, אִתָּנוּ는 관계성을 분명히 하기 위해 ‘우리와 맺으신’으로 풀었습니다. ‘맺으신’은 해석을 약간 보태지만 한국어 관용에 부합하며 의미를 분명히 합니다.
theological_decisions:
- issue: ‘당신의 영광스러운 보좌’의 지시 대상
  chosen_reading: 본문은 보좌의 지시 대상을 특정하지 않고, 하나님의 영광과 그 임재의 자리라는 중첩된 가능성을 열어 둔 채 유지했습니다.
  alternative_readings:
  - 성전/시온을 가리키는 지상적 보좌
  - 하늘에 있는 하나님의 보좌
  rationale: 히브리어 표현의 함축성을 본문에서 해결하지 않고 남겨 두어, 원문의 신학적 긴장을 보존했습니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
