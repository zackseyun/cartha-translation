id: JER.14.7
reference: Jeremiah 14:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אִם עֲוֺנֵ֨י/נוּ֙ עָ֣נוּ בָ֔/נוּ יְהוָ֕ה עֲשֵׂ֖ה לְמַ֣עַן שְׁמֶ֑/ךָ כִּֽי רַבּ֥וּ מְשׁוּבֹתֵ֖י/נוּ לְ/ךָ֥ חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/014/007.yaml
  text: Though our iniquities testify against us[a], O Yahweh, act for your name’s sake; for our apostasies are many[b]; against you we have sinned.
  footnotes:
  - marker: a
    text: Or 'If our iniquities testify against us.' The Hebrew אִם can be read conditionally ('if') or concessively ('though'); the context favors a concessive sense in this prayer.
    reason: lexical_alternative
  - marker: b
    text: Or 'our backslidings.' The Hebrew term refers to acts of turning away or unfaithfulness toward the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 비록 우리의 죄악들이 우리에게 불리하게 증언한다 해도,[a] 야훼여, 주의 이름을 위하여 행해 주십시오. 우리가 등을 돌린 일이 많습니다.[b] 우리가 주께 죄를 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만일 우리의 죄악들이 우리에게 불리하게 증언한다면.’ 히브리어 אִם은 조건적으로도 양보적으로도 읽을 수 있으나, 이 기도의 문맥에서는 양보적 뜻이 더 적절합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘우리의 배교들’ 또는 ‘우리의 돌아섬들.’ 히브리어는 야훼께 등을 돌리는 행위 또는 불충실을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  english_pob_choice: Though
  chosen_korean: 비록 … 해도
  alternatives_korean:
  - 만일 … 이면
  - 만약 … 이라면
  lexicon: HALOT
  rationale: 문맥상 단순 조건이 아니라 죄를 인정하면서도 간구를 이어 가는 양보 의미이므로, 한국어에서도 양보 표현으로 압축하는 것이 가장 자연스럽습니다.
- source_word: עֲוֺנֵינוּ / עָנוּ בָנוּ
  english_pob_choice: our iniquities testify against us
  chosen_korean: 우리의 죄악들이 우리를 고발한다
  alternatives_korean:
  - 우리의 죄악들이 우리에게 증언한다
  - 우리의 죄가 우리에게 불리하게 증언한다
  lexicon: HALOT
  rationale: 법정적 뉘앙스의 'testify against'를 '고발하다'로 옮겨, 죄가 단순히 존재하는 데 그치지 않고 우리를 대적해 증언하는 장면을 살렸습니다.
- source_word: עֲשֵׂה לְמַעַן שְׁמֶךָ
  english_pob_choice: act for your name’s sake
  chosen_korean: 주의 이름을 위하여 행하소서
  alternatives_korean:
  - 주의 이름을 위하여 일하소서
  - 주의 이름 때문에 행동하소서
  lexicon: HALOT
  rationale: עֲשֵׂה의 직접명령을 한국어의 간구체 '행하소서'로 옮기고, לְמַעַן שְׁמֶךָ는 관용구를 살려 '주의 이름을 위하여'로 유지했습니다.
- source_word: מְשׁוּבֹתֵינוּ
  english_pob_choice: our apostasies
  chosen_korean: 우리의 배교
  alternatives_korean:
  - 우리의 반역
  - 우리의 돌아섬
  lexicon: HALOT
  rationale: 가볍게 들릴 수 있는 '뒤로 물러섬'보다, 언약적 불충실의 무게를 드러내는 '배교'가 영어의 'apostasies'에 가장 가깝습니다.
- source_word: לְךָ חָטָאנוּ
  english_pob_choice: against you we have sinned
  chosen_korean: 주께 죄를 지었습니다
  alternatives_korean:
  - 주를 향하여 죄를 지었습니다
  - 주께 죄를 범했습니다
  lexicon: HALOT
  rationale: לְךָ의 방향성은 한국어에서 여격/대상 표지로 자연스럽게 담기며, 회개의 정형 표현인 '죄를 지었습니다'가 본문의 고백을 가장 분명하게 전달합니다.
theological_decisions:
- issue: 야훼의 직접 호명
  chosen_reading: 야훼여
  alternative_readings:
  - 주여
  - 여호와여
  rationale: 히브리어 본문이 신명기적 언약명 יְהוָה를 직접 쓰므로, POB 원칙에 따라 고유명사를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 공동체의 죄 고백과 법정적 이미지
  chosen_reading: 우리의 죄악들이 우리를 고발한다
  alternative_readings:
  - 우리의 죄악들이 우리를 증언한다
  - 우리의 죄악들이 우리에게 불리하게 증언한다
  rationale: 문맥은 단순한 도덕적 반성이 아니라, 죄가 공동체를 대적해 증언하는 법정적 고발 장면입니다. '고발한다'가 그 긴장을 가장 잘 유지합니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 5
