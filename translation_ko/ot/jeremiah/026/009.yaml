revisions:
- from: “어찌하여 네가 야훼의 이름으로 예언하여 말하기를 ‘이 집은 실로와 같이 될 것이며, 이 성은 황폐되어 거주자가 없게 될 것이다’라고 하였느냐?” 그때 모든 백성이 야훼의 집에서 예레미야에게 몰려들었습니다.[a]
  to: “어찌하여 네가 야훼의 이름으로 예언하여, ‘이 집은 실로와 같이 될 것이며, 이 성은 황폐되어 주민이 없게 될 것이다’라고 말했습니까?” 그러자 모든 백성이 야훼의 집에서 예레미야에게 몰려들었습니다.
  rationale: 원문의 직접 인용과 예언 행위를 유지하되, 중복적인 ‘말하기를 …라고 하였느냐’를 현대 표준 합쇼체의 ‘…라고 말했습니까?’로 고쳤습니다. ‘모든 백성’이 예레미야를 향해 적대적으로 집결했다는 문맥은 ‘예레미야에게 몰려들었습니다’로 보존했습니다. 본절에 꼭 필요하지 않고 본문 이상의 역사적 설명을 덧붙이는 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:49Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 요소들, 곧 여호와의 이름으로 한 예언, ‘이 집’이 실로와 같이 됨, 성읍의 황폐와 무거주, 그리고 백성이 예레미야를 향해 집결한 사실은 대체로 충실히 반영되었습니다. 다만 원문의 인용 발화 구조는 ‘예언하여 말하기를 …라고 하였느냐’보다 직접 인용 뒤에 ‘예언했습니까’로 처리하는 편이 더 정확하고 자연스럽습니다.
  naturalness: 초안의 ‘예언하여 말하기를 …라고 하였느냐’는 한국어에서 중복적이며, 서술문의 합쇼체 ‘몰려들었습니다’와 의문문의 비격식·고어적 ‘하였느냐’가 혼재합니다. 직접 질문을 합쇼체로 통일해야 합니다.
  terminology: ‘야훼’, ‘예언하다’, ‘실로’, ‘예레미야’는 원문 대응과 현대 성서 한국어 용례 면에서 적절합니다. ‘거주자’는 가능하지만, 이 문맥에서는 ‘주민’이 더 자연스럽습니다.
  issues:
