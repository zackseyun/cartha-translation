reference: Jeremiah 26:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מַדּוּעַ֩ נִבֵּ֨יתָ בְ/שֵׁם יְהוָ֜ה לֵ/אמֹ֗ר כְּ/שִׁלוֹ֙ יִֽהְיֶה֙ הַ/בַּ֣יִת הַ/זֶּ֔ה וְ/הָ/עִ֥יר הַ/זֹּ֛את תֶּחֱרַ֖ב מֵ/אֵ֣ין יוֹשֵׁ֑ב וַ/יִּקָּהֵ֧ל כָּל הָ/עָ֛ם אֶֽל יִרְמְיָ֖הוּ בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/009.yaml
  text: Why have you prophesied in the name of the LORD, saying, ‘This house will become like Shiloh, and this city will be laid waste, with no inhabitant’?” Then all the people gathered against Jeremiah in the house of the LORD.
translation:
  language: ko
  text: “어찌하여 네가 야훼의 이름으로 예언하여, ‘이 집은 실로와 같이 될 것이며, 이 성은 황폐되어 주민이 없게 될 것이다’라고 말했습니까?” 그러자 모든 백성이 야훼의 집에서 예레미야에게 몰려들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְשֵׁם יְהוָה
  english_pob_choice: in the name of the LORD
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 주님의 이름으로
  - 여호와의 이름으로
  lexicon: יהוה
  rationale: 본문의 신명은 고유한 언약명으로 처리하되, 프로젝트 기본값에 따라 ‘야훼’를 사용하여 원문 지시를 직접 드러냈습니다.
- source_word: נִבֵּיתָ
  english_pob_choice: you have prophesied
  chosen_korean: 예언하여
  alternatives_korean:
  - 선포하여
  - 말하여
  lexicon: נבא
  rationale: נבא는 단순 발화가 아니라 예언 행위를 뜻하므로, 한국어에서도 ‘예언하다’로 옮겨 원문의 행위 성격을 보존했습니다.
- source_word: כְּשִׁלוֹ יִהְיֶה הַבַּיִת הַזֶּה
  english_pob_choice: This house will become like Shiloh
  chosen_korean: 이 집은 실로와 같이 될 것이며
  alternatives_korean:
  - 이 집은 실로처럼 될 것이며
  - 이 집은 실로처럼 망할 것이며
  lexicon: כְּ + שִׁלוֹ / הַבַּיִת
  rationale: 영문 POB의 ‘become like’에 맞추되, 원문의 비교 표지를 살려 ‘실로와 같이 될 것’으로 직역성 있게 표현했습니다.
- source_word: תֶּחֱרַב מֵאֵין יוֹשֵׁב
  english_pob_choice: will be laid waste, with no inhabitant
  chosen_korean: 황폐되어 거주자가 없게 될 것이다
  alternatives_korean:
  - 황폐되어 사람이 살지 않게 될 것이다
  - 폐허가 되어 주민이 없게 될 것이다
  lexicon: חרב + אין יושב
  rationale: ‘laid waste’와 ‘with no inhabitant’를 분리해 옮겨, 파괴 상태와 무거주 상태를 각각 분명히 드러냈습니다.
- source_word: וַיִּקָּהֵל כָּל הָעָם אֶל יִרְמְיָהוּ
  english_pob_choice: Then all the people gathered against Jeremiah
  chosen_korean: 그때 모든 백성이 … 예레미야에게 몰려들었습니다
  alternatives_korean:
  - 그때 온 백성이 … 예레미야에게 모였습니다
  - 그때 모든 백성이 … 예레미야를 둘러쌌습니다
  lexicon: קהל
  rationale: 문맥상 단순 집합이 아니라 예레미야를 향한 적대적 집결이므로, ‘몰려들었습니다’로 압박감을 살렸습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문과 인용문의 두 곳 모두 ‘야훼’로 통일했습니다.
  alternative_readings:
  - 여호와로 표기
  - 주님으로 일반화
  rationale: 원문은 יהוה를 직접 사용하며, 프로젝트 기본값과 원문 대응성을 우선해 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: '사역 원칙: source-direct divine name rendering'
- issue: 예언 발화의 책임 강조
  chosen_reading: ‘야훼의 이름으로 예언하여’로 옮겨, 예레미야의 발화가 공적·언약적 권위를 전면에 두고 있음을 드러냈습니다.
  alternative_readings:
  - ‘야훼를 대신하여 말했다’
  - ‘야훼의 이름을 빌려 말했다’
  rationale: 히브리어 전치사 בְּשֵׁם은 단순한 수식이 아니라 권위 위임을 나타내므로, 예언의 책임성과 권위를 유지했습니다.
  doctrine_reference: 예언과 신적 권위
