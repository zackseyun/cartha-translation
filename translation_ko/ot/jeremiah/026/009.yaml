    rationale: ‘예언하여 말하기를 …라고 하였느냐’는 히브리어의 לאמר 도입을 기계적으로 중첩한 표현입니다. 현대 합쇼체로 ‘…라고 예언했습니까?’라고 하면 의미를 보존하면서 자연스럽고 일관된 높임말이 됩니다.
