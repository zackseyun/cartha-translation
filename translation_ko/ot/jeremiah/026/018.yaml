source:
  edition: WLC
  text: מיכיה הַ/מּ֣וֹרַשְׁתִּ֔י הָיָ֣ה נִבָּ֔א בִּ/ימֵ֖י חִזְקִיָּ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה וַ/יֹּ֣אמֶר אֶל כָּל עַם֩ יְהוּדָ֨ה לֵ/אמֹ֜ר כֹּֽה אָמַ֣ר יְהוָ֣ה צְבָא֗וֹת צִיּ֞וֹן שָׂדֶ֤ה תֵֽחָרֵשׁ֙ וִ/ירוּשָׁלַ֨יִם֙ עִיִּ֣ים תִּֽהְיֶ֔ה וְ/הַ֥ר הַ/בַּ֖יִת לְ/בָמ֥וֹת יָֽעַר־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/018.yaml
  text: 'Micah the Morashtite was prophesying in the days of Hezekiah king of Judah[a], and he said to all the people of Judah, saying, “Thus says Yahweh of Armies: Zion will be plowed as a field, and Jerusalem will become ruins[c][b], and the mountain of the house will become wooded heights.”'
  footnotes:
  - marker: a
    text: Or, “Thus says the LORD of hosts.”
    reason: lexical_alternative
  - marker: b
    text: That is, the temple mount.
    reason: cultural_note
  - marker: c
    text: Or, “will become forested high places.”
    reason: lexical_alternative
translation:
  language: ko
  text: 미가 모라셋 사람은 유다 왕 히스기야의 시대에 예언하고 있었습니다[a]. 그가 유다의 모든 백성에게 말하여 이르기를, 「만군의 야훼께서 이렇게 말씀하십니다. 시온은 밭처럼 갈려질 것이며, 예루살렘은 폐허가 될 것이고[b][c], 성전의 산은 숲이 우거진 높은 곳이 될 것입니다」라고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘만군의 주님께서 이렇게 말씀하십니다.’
    reason: lexical_alternative
  - marker: b
    text: 곧 성전산을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘숲이 우거진 높은 곳이 될 것입니다.’
    reason: lexical_alternative
lexical_decisions:
- source_word: מיכיה הַמּוֹרַשְׁתִּי
  english_pob_choice: Micah the Morashtite
  chosen_korean: 미가 모라셋 사람
  alternatives_korean:
  - 모라셋 사람 미가
  - 미가 모라스디 사람
  lexicon: HALOT
  rationale: 히브리어의 고유명사 + 출신 형용사를 살려 ‘미가’와 출신지 ‘모라셋’을 함께 드러냈습니다. 한국어에서는 -사람 구성이 가장 자연스럽고, 본문의 출신 표지를 보존합니다.
- source_word: הָיָה נִבָּא
  english_pob_choice: was prophesying
  chosen_korean: 예언하고 있었습니다
  alternatives_korean:
  - 예언했습니다
  - 예언하는 중이었습니다
  lexicon: HALOT
  rationale: היה + 분사구문이 지속적인 과거 진행을 나타내므로, 단순 과거보다 진행형에 가까운 표현을 택했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 야훼 만군의 하나님
  - 만군의 주님
  lexicon: Standard Hebrew usage
  rationale: 신명기적 고유명사 יְהוָה는 본문 지침에 따라 야훼로 옮기고, צְבָאוֹת은 관용적으로 ‘만군’으로 옮겨 군대/군세의 복수적 뉘앙스를 살렸습니다.
- source_word: וְהַר הַבַּיִת
  english_pob_choice: the mountain of the house
  chosen_korean: 성전의 산
  alternatives_korean:
  - 성전산
  - 집의 산
  lexicon: HALOT
  rationale: 직역하면 ‘집의 산’이지만, 문맥상 예루살렘 성전 산을 가리키므로 의미를 분명히 하되 본문의 지시 대상을 보존했습니다.
theological_decisions:
- issue: 야훼의 호칭을 어떻게 옮길지
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 본문은 예언 인용 속의 신적 발화로, 본문에 드러난 신명 자체를 가리는 전통적 대체어보다 מקור 언어의 식별 가능성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘시온은 밭처럼 갈려질 것’의 이미지
  chosen_reading: ‘밭처럼’으로 비교를 살려 시온이 경작지로 전환되는 파괴적 이미지를 유지했습니다.
  alternative_readings:
  - 밭이 될 것이다
  - 밭으로 갈릴 것이다
  rationale: הַשָּׂדֶה/שָׂדֶה의 비교적 구조를 너무 약화시키지 않으면서도 한국어로 자연스럽게 들리도록 했습니다.
  doctrine_reference: Jeremiah 26:18 source imagery
