revisions:
- from: 미가 모라셋 사람은 유다 왕 히스기야의 시대에 예언하고 있었습니다[a]. 그가 유다의 모든 백성에게 말하여 이르기를, 「만군의 야훼께서 이렇게 말씀하십니다. 시온은 밭처럼 갈려질 것이며, 예루살렘은 폐허가 될 것이고[b][c], 성전의 산은 숲이 우거진 높은 곳이 될 것입니다」라고 했습니다.
  to: 모레셋 사람 미가는 유다 왕 히스기야 시대에 예언하고 있었으며, 유다의 모든 백성에게 이렇게 말했습니다. “만군의 야훼께서[a] 이렇게 말씀하십니다. 시온은 밭처럼 갈아엎어질 것이며, 예루살렘은 폐허 더미가 될 것이고, 성전 산[b]은 숲이 우거진 높은 곳들이 될 것입니다[c].”
  rationale: The revision corrects every footnote anchor, replaces the duplicate c note with a genuine lexical alternative, and makes minor source-sensitive improvements to the ruin and plural-height imagery. It retains the durative force of הָיָה נִבָּא, the divine name “야훼,” and a modern formal-polite register.
