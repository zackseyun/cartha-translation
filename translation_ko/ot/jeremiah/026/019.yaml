id: JER.26.19
reference: Jeremiah 26:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֶ/הָמֵ֣ת הֱ֠מִתֻ/הוּ חִזְקִיָּ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה וְ/כָל יְהוּדָ֗ה הֲ/לֹא֮ יָרֵ֣א אֶת יְהוָה֒ וַ/יְחַל֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יִּנָּ֣חֶם יְהוָ֔ה אֶל הָ/רָעָ֖ה אֲשֶׁר דִּבֶּ֣ר עֲלֵי/הֶ֑ם וַ/אֲנַ֗חְנוּ עֹשִׂ֛ים רָעָ֥ה גְדוֹלָ֖ה עַל נַפְשׁוֹתֵֽי/נוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/019.yaml
  text: Did Hezekiah king of Judah and all Judah put him to death? Did he not fear Yahweh and seek the favor of Yahweh[c][b][a], and Yahweh relented concerning the disaster that he had spoken against them? But we are doing great evil against ourselves.
  footnotes:
  - marker: a
    text: 'Hebrew: ''softened/entreated the face of the LORD,'' an idiom for seeking his favor or pleading with him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the LORD changed his mind concerning the disaster.'
    reason: alternative_reading
  - marker: c
    text: Earlier 'disaster' translates Hebrew ra'ah in the sense of calamity/judgment; later 'evil' translates the same Hebrew word in the sense of moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 왕 히스기야와 온 유다가 정녕 그를 죽였습니까? 그가 야훼를 두려워하고 야훼의 호의를 구하지 않았습니까?[a] 그러자 야훼께서 그들에게 말씀하신 재앙[c]에 대하여 뜻을 돌이키셨습니다.[b] 그런데 우리는 우리 자신에게 큰 악[c]을 저지르고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '야훼의 얼굴을 부드럽게 하다'라는 관용구이며, 여기서는 간구하여 그의 호의를 구한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '야훼께서 그 재앙에 대하여 뜻을 바꾸셨다'로 옮길 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 앞의 '재앙'은 선고된 심판의 뜻이고, 뒤의 '악'은 도덕적 악을 뜻하므로, 같은 히브리어 단어를 문맥에 따라 달리 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶהָמֵת הֱמִתֻהוּ
  english_pob_choice: put him to death
  chosen_korean: 그를 죽였습니까
  alternatives_korean:
  - 그를 반드시 죽였습니까
  - 그를 처형했습니까
  lexicon: HALOT
  rationale: 히브리어의 강조된 살해 표현을 자연스러운 문답형으로 옮겼습니다. '처형하다'는 법적 뉘앙스를 지나치게 더하므로 피했습니다.
- source_word: הֲלֹא יָרֵא אֶת יְהוָה
  english_pob_choice: Did he not fear Yahweh
  chosen_korean: 그가 야훼를 두려워하지 않았습니까
  alternatives_korean:
  - 그가 야훼를 경외하지 않았습니까
  lexicon: HALOT
  rationale: 하나님 앞의 경외를 나타내는 관용을 직역에 가깝게 살려 '두려워하다'를 택했습니다. 질문 형식도 히브리어의 수사적 반문을 반영합니다.
- source_word: וַיְחַל אֶת פְּנֵי יְהוָה
  english_pob_choice: seek the favor of Yahweh
  chosen_korean: 야훼의 얼굴을 간구하지 않았습니까
  alternatives_korean:
  - 야훼의 호의를 구하지 않았습니까
  - 야훼께 은총을 구하지 않았습니까
  lexicon: HALOT
  rationale: 문자적으로는 '얼굴을 부드럽게 하다/간청하다'라는 관용구이므로, 이를 드러내기 위해 '얼굴을 간구하다'를 택했습니다. 본문이 담은 간청의 긴장감을 보존합니다.
- source_word: וַיִּנָּחֶם יְהוָה
  english_pob_choice: Yahweh relented
  chosen_korean: 야훼께서 뜻을 돌이키셨습니다
  alternatives_korean:
  - 야훼께서 뜻을 거두셨습니다
  - 야훼께서 재앙을 거두셨습니다
  lexicon: HALOT
  rationale: נחם의 문맥상 의미인 심판 철회를 한국어에서 자연스럽게 드러내면서도, 단순한 감정 변화로 축소하지 않기 위해 '뜻을 돌이키다'를 사용했습니다.
- source_word: אֶל הָרָעָה / רָעָה גְדוֹלָה
  english_pob_choice: the disaster / great evil
  chosen_korean: 재앙 / 큰 악
  alternatives_korean:
  - 재난 / 큰 악
  - 화 / 큰 악
  lexicon: HALOT
  rationale: 앞의 רָעָה는 선고된 심판의 '재앙'이고, 뒤의 רָעָה는 도덕적 '악'이므로 한국어에서도 구별되게 번역했습니다.
theological_decisions:
- issue: 재앙에 대한 하나님의 반응을 어떻게 표현할 것인가
  chosen_reading: '''야훼께서 뜻을 돌이키셨습니다''로 옮겨, 선고된 심판을 거두시는 서술의 힘을 살렸습니다.'
  alternative_readings:
  - 야훼께서 재앙을 거두셨습니다
  - 야훼께서 뜻을 바꾸셨습니다
  rationale: 본문은 인간적 완곡어법으로 하나님의 심판 철회를 말하므로, 신학적 긴장을 평평하게 만들지 않는 표현이 필요합니다. '뜻을 돌이키다'는 본문의 서술성과 신학적 여백을 함께 보존합니다.
  doctrine_reference: 하나님의 선언적 심판과 그 철회 사이의 긴장 보존
- issue: '''야훼의 얼굴''이라는 관용구를 직역할 것인가'
  chosen_reading: '''야훼의 얼굴을 간구하다''로 두어, 관용구의 물리적 이미지를 유지했습니다.'
  alternative_readings:
  - 야훼의 은총을 구하다
  - 야훼께 호의를 구하다
  rationale: 히브리어 관용구는 단순한 심정 표현보다 '면전에서 간청함'의 장면성을 지닙니다. 직역은 어색할 수 있으나, 본문의 중보적 간구 행위를 더 분명히 드러냅니다.
  doctrine_reference: 히브리어 관용구의 이미지와 행위성 보존
