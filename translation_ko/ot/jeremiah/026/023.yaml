  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹצִ֨יאוּ אֶת אוּרִיָּ֜הוּ מִ/מִּצְרַ֗יִם וַ/יְבִאֻ֨/הוּ֙ אֶל הַ/מֶּ֣לֶךְ יְהוֹיָקִ֔ים וַ/יַּכֵּ֖/הוּ בֶּ/חָ֑רֶב וַ/יַּשְׁלֵךְ֙ אֶת נִבְלָת֔/וֹ אֶל קִבְרֵ֖י בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/023.yaml
  text: They brought Uriah out of Egypt and brought him to King Jehoiakim[a], and he struck him down with the sword and threw his corpse into the burial places of the common people.
  footnotes:
  - marker: a
    text: Or 'graves of the people.' The Hebrew may refer more literally to the burial places belonging to ordinary people, in contrast to an honored burial.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 오리야를 이집트에서 데려다가 여호야김 왕에게로 끌고 왔습니다. 왕은 그를 칼로 쳐 죽이고, 그의 시체를 평민들의 무덤에 던져 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘백성들의 무덤.’ 히브리어는 더 문자적으로는 일반 백성에게 속한 매장지를 가리킬 수 있으며, 이는 영예로운 매장과 대비됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ / מִמִּצְרַיִם
  english_pob_choice: brought ... out of Egypt
  chosen_korean: 이집트에서 데려다가
  alternatives_korean:
  - 이집트에서 끌어내어
  - 이집트에서 데리고 나와
  lexicon: HALOT
  rationale: 히필 동사 יצא는 ‘나가게 하다, 데려오다’의 강제적/유도적 의미를 가지므로, 단순히 ‘from’만 살리기보다 ‘데려다가’로 출발점과 이동을 함께 드러냈습니다.
- source_word: וַיְבִאֻהוּ אֶל הַמֶּלֶךְ יְהוֹיָקִים
  english_pob_choice: brought him to King Jehoiakim
  chosen_korean: 여호야김 왕에게로 끌고 왔습니다
  alternatives_korean:
  - 여호야김 왕에게 데려왔습니다
  - 여호야김 왕 앞에 데려왔습니다
  lexicon: HALOT
  rationale: בוא의 히필은 ‘데려오다/이끌고 오다’의 뜻이어서, 체포된 사람을 권력자 앞으로 인도하는 상황을 살려 ‘끌고 왔습니다’로 옮겼습니다.
- source_word: וַיַּכֵּהוּ בֶּחָרֶב
  english_pob_choice: struck him down with the sword
  chosen_korean: 칼로 쳐 죽이고
  alternatives_korean:
  - 칼로 쳤고
  - 칼로 죽이고
  - 칼로 쳐서 죽이고
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/때리다’이지만, 뒤의 수단절 ‘with the sword’와 결과를 고려하면 살해 의미가 분명하므로, 원문의 타격 이미지를 유지하면서 결과를 분명히 했습니다.
- source_word: נִבְלָתוֹ אֶל קִבְרֵי בְּנֵי הָעָם
  english_pob_choice: his corpse into the burial places of the common people
  chosen_korean: 그의 시체를 평민들의 무덤에
  alternatives_korean:
  - 그의 시체를 백성들의 무덤에
  - 그의 주검을 평민들의 묘지에
  lexicon: HALOT
  rationale: נבלה는 사람에게도 ‘시체/주검’이 자연스러우며, קברי בני העם은 영예로운 매장이 아닌 일반 민간인의 매장지를 가리키므로 ‘평민들의 무덤’으로 옮겼습니다.
theological_decisions:
- issue: 복수 주어와 단수 동사의 전환
  chosen_reading: 앞부분은 복수 주어 ‘그들은’으로, 뒤의 살해와 시신 처리는 단수 주어 ‘왕은’으로 옮겼습니다.
  alternative_readings:
  - 전 구절을 계속 복수로 평탄화하기
  - 단수 주어를 아예 밝히지 않기
  rationale: 히브리어는 포로 인도 장면에서 복수 동사를 쓰다가, 살해와 폐기에서는 단수 동사로 전환합니다. 가까운 단수 선행어가 ‘여호야김 왕’이므로, 이 서술 전환을 평탄화하지 않고 유지했습니다.
  doctrine_reference: 원문이 가진 서술적 긴장과 주어 전환을 보존합니다.
