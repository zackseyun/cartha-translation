id: JER.26.10
reference: Jeremiah 26:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֣וּ שָׂרֵ֣י יְהוּדָ֗ה אֵ֚ת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יַּעֲל֥וּ מִ/בֵּית הַ/מֶּ֖לֶךְ בֵּ֣ית יְהוָ֑ה וַ/יֵּֽשְׁב֛וּ בְּ/פֶ֥תַח שַֽׁעַר יְהוָ֖ה הֶ/חָדָֽשׁ׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/010.yaml
  text: When the officials of Judah heard these words[c][b][a], they went up from the king’s house to the house of Yahweh and sat at the entrance of the New Gate of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the princes of Judah.' The Hebrew term can denote high-ranking rulers or officials.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the palace.' Literally, 'from the king’s house.'
    reason: lexical_alternative
  - marker: c
    text: That is, a gate of the temple complex known as 'the New Gate.'
    reason: cultural_note
translation:
  language: ko
  text: 유다의 관리들이 이 말들을 듣고, 왕궁에서 올라가 야훼의 집으로 가서 야훼의 새 문 입구에 앉았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉 성전 단지 안에 있는 ‘새 문’을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי יְהוּדָה
  english_pob_choice: the officials of Judah
  chosen_korean: 유다의 관리들
  alternatives_korean:
  - 유다의 귀족들
  - 유다의 지도자들
  - 유다의 방백들
  lexicon: HALOT
  rationale: שָׂרִים은 통치 권한을 가진 고위 인물을 가리킬 수 있어, 현대 한국어에서는 ‘관리들’이 왕궁 맥락의 행정·통치 책임자를 가장 자연스럽게 드러냅니다.
- source_word: הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: these words
  chosen_korean: 이 말들을
  alternatives_korean:
  - 이것들을
  - 이 사건을
  - 이 일을
  lexicon: HALOT
  rationale: 본문은 예레미야가 한 발언을 들은 상황이므로, דברים의 언어적 초점을 살려 ‘말들’로 옮겼습니다.
- source_word: מִבֵּית הַמֶּלֶךְ
  english_pob_choice: from the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕의 집무처에서
  lexicon: HALOT
  rationale: 직역하면 ‘왕의 집에서’이지만, 한국어에서는 왕의 거처이자 권력 중심지를 뜻하는 ‘왕궁’이 자연스럽고 본문의 이동 방향을 분명히 합니다.
- source_word: שַׁעַר יְהוָה הֶחָדָשׁ
  english_pob_choice: the New Gate of Yahweh
  chosen_korean: 야훼의 새 문
  alternatives_korean:
  - 야훼의 새 성문
  - 야훼의 새로운 문
  lexicon: HALOT
  rationale: שער은 성전 단지의 문/성문을 가리키며, POB의 문화 주석을 따라 고유 명칭처럼 기능하는 ‘새 문’을 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문의 신명사표기가 직접 나타나므로, 프로젝트 기본값에 따라 대체 호칭인 ‘주’보다 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
