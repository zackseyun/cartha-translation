id: JER.26.2
reference: Jeremiah 26:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֣ה אָמַ֣ר יְהוָ֗ה עֲמֹד֮ בַּ/חֲצַ֣ר בֵּית יְהוָה֒ וְ/דִבַּרְתָּ֞ עַל כָּל עָרֵ֣י יְהוּדָ֗ה הַ/בָּאִים֙ לְ/הִשְׁתַּחֲוֺ֣ת בֵּית יְהוָ֔ה אֵ֚ת כָּל הַ/דְּבָרִ֔ים אֲשֶׁ֥ר צִוִּיתִ֖י/ךָ לְ/דַבֵּ֣ר אֲלֵי/הֶ֑ם אַל תִּגְרַ֖ע דָּבָֽר׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/002.yaml
  text: 'Thus says Yahweh: Stand in the court of the house of Yahweh[a], and speak to all the cities of Judah that come to worship at the house of Yahweh all the words that I have commanded you to speak to them[c][b]; do not hold back a word.'
  footnotes:
  - marker: a
    text: Or 'courtyard of the house of the LORD'; Hebrew חָצֵר can mean 'court' or 'courtyard.'
    reason: lexical_alternative
  - marker: b
    text: Or 'to/against all the cities of Judah.' The Hebrew preposition can be understood in more than one way here; the main text takes it as addressing the people from those cities who come to worship.
    reason: lexical_alternative
  - marker: c
    text: Or 'do not omit a word' or 'do not diminish a word.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “너는 야훼의 집 뜰[a]에 서서, 야훼의 집에 예배하러 오는 유다의 모든 성읍 사람들에게[b] 내가 너에게 그들에게 말하라고 명령한 모든 말씀을 말씀하십시오. 한마디도 빼지 마십시오.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뜰’은 히브리어 חָצֵר를 옮긴 말이며, ‘마당’ 또는 ‘뜰 안’으로도 번역할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘유다의 모든 성읍들에게’입니다. 문맥상 야훼의 집에 예배하러 오는 그 성읍들의 주민들을 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘한마디도 빼지 마십시오’는 직역하면 ‘한 말도 줄이지 마십시오’이며, 어떤 말도 생략하거나 누락하지 말라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 이것이 야훼께서 말씀하시는 바입니다
  lexicon: HALOT
  rationale: 예언자 선언문의 공식 어투를 살리면서, יְהוָה는 POB 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: בַּחֲצַר בֵּית יְהוָה
  english_pob_choice: in the court of the house of Yahweh
  chosen_korean: 야훼의 집 뜰에
  alternatives_korean:
  - 야훼의 집 마당에
  - 야훼의 집 뜨락에
  lexicon: HALOT
  rationale: חָצֵר의 핵심 의미인 ‘뜰/마당’을 반영하되, 현대 한국어에서 자연스러운 ‘뜰’로 옮겼습니다.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבָּאִים לְהִשְׁתַּחֲוֺת
  english_pob_choice: to all the cities of Judah that come to worship
  chosen_korean: 유다의 모든 성읍 사람들에게… 예배하는
  alternatives_korean:
  - 유다의 모든 성읍들에
  - 유다의 모든 성읍에서 와서 예배하는 사람들에게
  lexicon: HALOT
  rationale: 문맥상 ‘성읍들’ 자체보다 그 성읍들에서 오는 사람들을 가리키므로, 영어 POB의 해석을 따라 수신자를 명시했습니다.
- source_word: אֵת כָּל הַדְּבָרִים… אַל תִּגְרַע דָּבָר
  english_pob_choice: all the words… do not hold back a word
  chosen_korean: 모든 말을… 한마디도 빼지 말라
  alternatives_korean:
  - 모든 말을… 한 말을 줄이지 말라
  - 모든 말을… 한마디도 생략하지 말라
  lexicon: HALOT
  rationale: ‘דָּבָר’의 반복을 한국어에서는 ‘말’로 살리되, 마지막 금지문은 누락 금지의 힘을 분명히 하기 위해 관용적으로 번역했습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문 전체에서 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: POB의 신학·번역 원칙에 맞춰 고유한 언약 이름을 제목화하지 않고 직접 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 예배 동사의 한국어 톤
  chosen_reading: לְהִשְׁתַּחֲוֹת를 ‘예배하다’로 자연스럽게 옮겼습니다.
  alternative_readings:
  - 엎드려 경배하다
  - 절하다
  rationale: 문맥상 단순한 신체 동작보다 성전으로 올라오는 예배 행위를 가리키므로, 현대 독자가 오해 없이 이해할 수 있는 ‘예배하다’를 택했습니다.
  doctrine_reference: 문맥상 성전 예배 표현
