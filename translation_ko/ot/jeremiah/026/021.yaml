source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע הַ/מֶּֽלֶךְ יְ֠הוֹיָקִים וְ/כָל גִּבּוֹרָ֤י/ו וְ/כָל הַ/שָּׂרִים֙ אֶת דְּבָרָ֔י/ו וַ/יְבַקֵּ֥שׁ הַ/מֶּ֖לֶךְ הֲמִית֑/וֹ וַ/יִּשְׁמַ֤ע אוּרִיָּ֨הוּ֙ וַ/יִּרָ֔א וַ/יִּבְרַ֖ח וַ/יָּבֹ֥א מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/021.yaml
  text: When King Jehoiakim[a], and all his mighty men, and all the officials heard his words, the king sought to put him to death. But when Uriah heard[b], he was afraid and fled and went to Egypt.
  footnotes:
  - marker: a
    text: Or, more formally, 'his mighty men' for 'his warriors.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'came to Egypt'; English idiom renders the movement as 'went to Egypt.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호야김 왕과 그의 모든 용사[a]와 모든 관료가 그의 말을 듣고, 왕은 그를 죽이려고 했습니다. 그러나 우리야가 듣고 두려워하여 도망쳐 이집트로 갔습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 용맹한 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이집트에 이르렀다’입니다. 한국어에서는 목적지로의 이동을 ‘이집트로 갔다’로 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다만
  - 들었습니다
  lexicon: HALOT
  rationale: 서술문에서 שׁמע는 정보를 ‘듣다’로 옮기는 것이 가장 자연스럽고, 두 번 반복되는 동사를 한국어에서도 그대로 살렸습니다.
- source_word: גִּבּוֹרָי/ו
  english_pob_choice: his mighty men
  chosen_korean: 그의 모든 용사
  alternatives_korean:
  - 그의 모든 용맹한 자들
  - 그의 모든 장사들
  lexicon: HALOT
  rationale: גִּבּוֹר은 전투적·군사적 측면이 강하므로 ‘용사’가 가장 직접적이며, 왕의 측근 무리를 가리키는 문맥도 유지합니다.
- source_word: הַ/שָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 모든 관료
  alternatives_korean:
  - 모든 관리들
  - 모든 대신들
  lexicon: HALOT
  rationale: 왕실 문맥의 שׂרים는 혈통적 ‘왕자들’보다 행정·궁정 책임자 의미가 강해 ‘관료’가 더 분명합니다.
- source_word: וַיְבַקֵּשׁ ... הֲמִיתוֹ
  english_pob_choice: sought to put him to death
  chosen_korean: 그를 죽이려고 했습니다
  alternatives_korean:
  - 그를 죽이려 했습니다
  - 그를 죽이고자 했습니다
  lexicon: HALOT
  rationale: בקש + 부정사 구조는 의도/시도를 나타내므로 ‘죽이려고 했다’가 자연스럽고, ‘죽음에 이르게 하다’ 같은 완곡한 표현보다 원문 긴박감을 잘 살립니다.
- source_word: מִצְרָיִם
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
  - 애굽
  lexicon: HALOT
  rationale: 현대 표준어 독자에게 즉시 이해되는 지명을 택했고, 본문은 지명 자체의 고유성보다 이동 방향을 전달하는 데 초점이 있습니다.
