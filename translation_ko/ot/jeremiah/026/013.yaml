id: JER.26.13
reference: Jeremiah 26:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֵיטִ֤יבוּ דַרְכֵי/כֶם֙ וּ/מַ֣עַלְלֵי/כֶ֔ם וְ/שִׁמְע֕וּ בְּ/ק֖וֹל יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יִנָּחֵ֣ם יְהוָ֔ה אֶל הָ֣/רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/013.yaml
  text: So now[a], make your ways and your deeds good, and listen to the voice of Yahweh your God[c][b], and Yahweh will relent concerning the disaster that he has spoken against you.
  footnotes:
  - marker: a
    text: Or 'amend your ways and your deeds.' The Hebrew literally means 'make your ways and your deeds good.'
    reason: lexical_alternative
  - marker: b
    text: Or 'obey the voice of the LORD your God.' The Hebrew idiom 'listen to the voice' often carries the sense of obedience.
    reason: lexical_alternative
  - marker: c
    text: Or 'the LORD will relent from the disaster' or, more literally, 'the LORD will be sorry concerning the disaster.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이제 여러분의 길과 행실을 더 좋게 고치고, 여러분의 하나님이신 야훼의 음성에 귀를 기울이십시오[a][b]. 그러면 야훼께서는 여러분에게 내리겠다고 말씀하신 그 재앙에 대하여 뜻을 돌이키실 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 길과 너희의 행실을 바로잡아라’. 히브리어는 문자적으로 ‘너희의 길과 너희의 행실을 좋게 하라’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분의 하나님 야훼의 음성에 순종하십시오’. 히브리어의 ‘음성에 듣다’라는 표현은 흔히 순종한다는 뜻을 함축합니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 재앙에서 뜻을 돌이키실 것입니다’ 또는 더 문자적으로 ‘그 재앙에 대하여 뉘우치실 것입니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: So now
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제
  - 그러므로 지금
  - 자, 이제
  lexicon: HALOT
  rationale: 전환과 긴급한 권고를 함께 드러내기 위해 인과·전환을 나타내는 ‘그러므로’와 시점 부사 ‘이제’를 함께 살렸습니다.
- source_word: הֵיטִיבוּ דַרְכֵיכֶם וּמַעַלְלֵיכֶם
  english_pob_choice: make your ways and your deeds good
  chosen_korean: 자신의 길과 행동을 좋게 고치고
  alternatives_korean:
  - 여러분의 길과 행동을 고치고
  - 여러분의 길과 행위를 좋게 하고
  - 여러분의 길과 일들을 개선하고
  lexicon: HALOT
  rationale: 직역적 ‘좋게 하다’의 causative 힘을 살리되 한국어로는 자연스럽게 ‘좋게 고치다’로 옮겨 도덕적 개정의 촉구를 분명히 했습니다.
- source_word: וְשִׁמְעוּ בְּקוֹל
  english_pob_choice: listen to the voice
  chosen_korean: 말씀에 귀를 기울이십시오
  alternatives_korean:
  - 소리에 귀를 기울이십시오
  - 음성에 귀를 기울이십시오
  - 말씀을 들으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구는 순종까지 함축하지만, 한국어에서는 ‘말씀에 귀를 기울이다’가 의미와 수사를 함께 자연스럽게 담아 줍니다.
- source_word: יְהוָה אֱלֹהֵיכֶם
  english_pob_choice: Yahweh your God
  chosen_korean: 여러분의 하나님이신 야훼
  alternatives_korean:
  - 여러분의 하나님이신 여호와
  - 여러분의 하나님 야훼
  - 야훼 여러분의 하나님
  lexicon: DOCTRINE.md
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, 소유 관계를 자연스럽게 풀어 ‘여러분의 하나님이신’으로 표기했습니다.
- source_word: וְיִנָּחֵם
  english_pob_choice: will relent
  chosen_korean: 뜻을 돌이키실 것입니다
  alternatives_korean:
  - 돌이키실 것입니다
  - 후회하실 것입니다
  - 재앙을 거두실 것입니다
  lexicon: HALOT
  rationale: 하나님께 인간적 죄책을 돌리지 않으면서도, 선언된 심판을 철회하는 의미를 한국어 동사구 ‘뜻을 돌이키다’로 표현했습니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: 그 재앙
  alternatives_korean:
  - 그 악
  - 그 재난
  - 그 화
  lexicon: HALOT
  rationale: 심판 문맥의 רָעָה는 도덕적 ‘악’보다 ‘재앙/재난’이 적절하므로, 이어지는 문맥을 따라 ‘재앙’으로 옮겼습니다.
theological_decisions:
- issue: 하나님이 말씀하신 재앙에 대한 ‘뜻을 돌이키심’
  chosen_reading: 야훼께서 ... 뜻을 돌이키실 것입니다
  alternative_readings:
  - 야훼께서 ... 후회하실 것입니다
  - 야훼께서 ... 마음을 바꾸실 것입니다
  - 야훼께서 ... 재앙을 거두실 것입니다
  rationale: 본문이 드러내는 경고-회개-철회의 긴장을 보존해야 하므로, 하나님께 도덕적 결함을 암시하지 않으면서도 선언된 심판의 유보를 나타내는 표현을 택했습니다.
  doctrine_reference: 신적 변개/후회의 언어를 인간적 유비로 읽되, 계시된 경고가 회개에 따라 철회될 수 있다는 성경의 서술 긴장을 유지
