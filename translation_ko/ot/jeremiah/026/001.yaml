id: JER.26.1
reference: Jeremiah 26:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/רֵאשִׁ֗ית מַמְלְכ֛וּת יְהוֹיָקִ֥ים בֶּן יֹאשִׁיָּ֖הוּ מֶ֣לֶךְ יְהוּדָ֑ה הָיָה֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה מֵ/אֵ֥ת יְהוָ֖ה לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/001.yaml
  text: At the beginning of the reign of Jehoiakim son of Josiah[a], king of Judah, this word came from Yahweh, saying[c][b],
  footnotes:
  - marker: a
    text: Or 'At the outset of the reign of Jehoiakim.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'this word was from the LORD'; the English 'came from the LORD' reflects the normal prophetic formula.
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 여호야김—요시야의 아들, 유다 왕—의 통치가 시작될 때에, 야훼로부터 이 말씀이 임하여 말씀하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘통치가 시작될 때에’는 ‘통치의 시작에’보다 자연스러운 현대 한국어 표현입니다.
    reason: korean_style_note
  - marker: b
    text: 히브리어는 문자적으로 ‘이 말씀이 야훼에게서 있었다’이지만, 예언 공식에서는 ‘임하다’가 그 관용적 의미를 잘 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 본문은 신명을 יְהוָה로 적습니다. 이 번역은 그 고유명을 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  english_pob_choice: At the beginning of
  chosen_korean: ~가 시작될 때에
  alternatives_korean:
  - ~의 처음에
  - ~의 시작에
  lexicon: HALOT
  rationale: 시작 시점을 자연스러운 합쇼체로 옮기면서, 단순한 ‘처음’보다 통치 개시의 시간적 경계를 분명히 드러냅니다.
- source_word: מַמְלְכוּת
  english_pob_choice: the reign of
  chosen_korean: 통치
  alternatives_korean:
  - 재위
  - 왕권
  lexicon: HALOT
  rationale: 문맥상 영토가 아니라 왕의 재위 기간과 शासन 행위를 가리키므로, ‘통치’가 가장 직접적입니다.
- source_word: הָיָה הַדָּבָר הַזֶּה
  english_pob_choice: this word came
  chosen_korean: 이 말씀이 임하여
  alternatives_korean:
  - 이 말씀이 있었습니다
  - 이 말씀이 왔습니다
  lexicon: HALOT
  rationale: 예언 서두의 관용구를 한국어로는 ‘임하다’로 살려, מקור성 있는 계시의 도착이라는 뉘앙스를 보존했습니다.
- source_word: דָּבָר
  english_pob_choice: word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언 맥락에서 하나님의 발화는 한국어 성경 관용에 맞게 ‘말씀’으로 옮기되, 단순 정보 전달이 아닌 계시적 성격을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 문서의 기본 방침에 따라 신명은 칭호가 아니라 고유명사로서 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 예언 공식에서 ‘came from Yahweh’의 한국어 표현
  chosen_reading: ‘야훼로부터 이 말씀이 임하여’로 옮겨, מקור과 도착의 구조를 함께 드러냈습니다.
  alternative_readings:
  - ‘야훼로부터 이 말씀이 있었습니다’
  - ‘야훼께로부터 이 말씀이 왔습니다’
  rationale: 히브리어는 ‘이 말씀이 야훼에게서 있었다’는 관용적 예언 서식을 사용합니다. 한국어에서는 ‘임하다’를 써서 계시의 발신자와 도착성을 함께 살리는 것이 가장 자연스럽습니다.
  doctrine_reference: 예언 서문 관용구의 계시적 성격 보존
- issue: 문장 끝의 이중 발화 구조
  chosen_reading: ‘…임하여 말씀하셨습니다’로 처리해, הָיָה הַדָּבָר הַזֶּה와 לֵאמֹר의 연쇄를 한국어로 자연스럽게 반영했습니다.
  alternative_readings:
  - ‘…임하여 이르시되’
  - ‘…임하였고, 말씀하셨습니다’
  rationale: 원문은 ‘말씀이 임함’과 ‘말함’을 분리해 서술하므로, 한국어에서도 계시의 도착과 직설 화행을 함께 보이도록 했습니다.
  doctrine_reference: 서사적-예언적 발화 구조
