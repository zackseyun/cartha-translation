- from: 혹시 그들이 들으며, 각 사람은 자기의 악한 길에서 돌이키고, 내가 그들의 행위의 악 때문에 그들에게 하려고 계획한 재앙에 대하여 뜻을 돌이킬 것입니다.[a][b][c]
  to: 혹시 그들이 듣고 각자가 자기의 악한 길에서 돌이키면, 나는 그들의 악한 행위 때문에 그들에게 내리려고 계획한 재앙에 대하여 뜻을 돌이킬 것입니다.[a][b][c]
