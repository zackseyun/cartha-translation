  text: אוּלַ֣י יִשְׁמְע֔וּ וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה וְ/נִחַמְתִּ֣י אֶל הָ/רָעָ֗ה אֲשֶׁ֨ר אָנֹכִ֤י חֹשֵׁב֙ לַ/עֲשׂ֣וֹת לָ/הֶ֔ם מִ/פְּנֵ֖י רֹ֥עַ מַעַלְלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/003.yaml
  text: Perhaps they will listen[a], and each man will turn from his evil way[c][b], and I will relent concerning the disaster that I am planning to bring on them because of the evil of their deeds.
  footnotes:
  - marker: a
    text: Or 'hear'; the Hebrew verb can mean both hearing and heeding in prophetic contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'return' or 'repent' from his evil way.
    reason: lexical_alternative
  - marker: c
    text: Or 'I will change my mind concerning the disaster'; Hebrew 'relent' uses human language for God's withholding of announced judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 혹시 그들이 듣고 각자가 자기의 악한 길에서 돌이키면, 나는 그들의 악한 행위 때문에 그들에게 내리려고 계획한 재앙에 대하여 뜻을 돌이킬 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣다’에는 단순히 소리를 듣는 것뿐 아니라 예언의 말씀을 듣고 따르는 뜻도 있을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌이키다’는 ‘돌아오다’ 또는 ‘회개하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘뜻을 돌이키다’는 하나님께서 선포하신 재앙을 거두시는 것을 인간적 언어로 표현한 것입니다.
    reason: theological_note
lexical_decisions:
- source_word: אוּלַ֣י
  english_pob_choice: Perhaps
  chosen_korean: 혹시
  alternatives_korean:
  - 아마
  - 아마도
  lexicon: HALOT
  rationale: 예언 맥락에서 가능성과 촉구의 여지를 함께 살리는 표현으로, 단정성을 지나치게 높이지 않으면서도 현대 한국어에 자연스럽습니다.
- source_word: יִשְׁמְע֔וּ
  english_pob_choice: they will listen
  chosen_korean: 들으며
  alternatives_korean:
  - 들을 것입니다
  - 귀 기울일 것입니다
  - 들을지
  lexicon: HALOT
  rationale: שׁמע의 청각적 의미와 순종적 의미를 함께 담기 위해 ‘듣다’로 옮기되, 조건적 문맥을 살려 연결형 ‘들으며’로 처리했습니다.
- source_word: וְ/יָשֻׁ֕בוּ אִ֖ישׁ מִ/דַּרְכּ֣/וֹ הָ/רָעָ֑ה
  english_pob_choice: and each man will turn from his evil way
  chosen_korean: 각 사람은 자기의 악한 길에서 돌이키고
  alternatives_korean:
  - 각 사람이 자기의 악한 길에서 돌아서고
  - 각자 자기의 악한 길에서 회개하고
  lexicon: HALOT
  rationale: שׁוב의 기본 이미지를 보존하여 ‘돌이키다’로 옮겼고, אישׁ의 분배적 의미는 ‘각 사람’으로 살렸습니다. ‘회개하다’는 해석을 더 강하게 덧씌워서 피했습니다.
- source_word: וְנִחַמְתִּ֣י אֶל הָ/רָעָ֗ה
  english_pob_choice: I will relent concerning the disaster
  chosen_korean: 내가 그들의 행위의 악 때문에 그들에게 하려고 계획한 재앙에 대하여 뜻을 돌이킬 것입니다
  alternatives_korean:
  - 내가 재앙에 대하여 뜻을 돌이킬 것입니다
  - 내가 재앙을 내리려던 일을 철회할 것입니다
  lexicon: HALOT
  rationale: נחם의 신적 사용을 인간적 회개의 의미로 오해하지 않도록 ‘뜻을 돌이키다’로 옮겼습니다. אל הָרָעָה는 문맥상 ‘재앙에 대하여’로 풀어, ‘악’이 아닌 ‘재앙’임을 분명히 했습니다.
theological_decisions:
- issue: 하나님의 נחם(뜻을 돌이키심) 표현
  chosen_reading: ‘뜻을 돌이킬 것입니다’로 유지해, 선언된 심판을 인간의 돌이킴에 따라 거두시는 조건성을 드러냈습니다.
  alternative_readings:
  - ‘변심할 것입니다’
  - ‘후회할 것입니다’
  - ‘재앙을 취소할 것입니다’
  rationale: 본문은 하나님이 잘못을 시정하는 뜻이 아니라, 선포된 심판을 유보하시는 언약적/예언적 응답을 인격적 언어로 말합니다. 한국어에서도 그 긴장을 보존해야 합니다.
  doctrine_reference: Translation philosophy §3; historic orthodoxy
- issue: 예언적 청중 응답의 문장 연결
  chosen_reading: 첫 절을 ‘혹시 그들이 들으며’로 시작해, 청종과 돌이킴의 가능성을 하나의 조건 절처럼 제시했습니다.
  alternative_readings:
  - ‘그들이 들을지도 모르며’
  - ‘그들이 듣고 돌아서면’
  rationale: 히브리어의 ו-연속 구조를 한국어에서 자연스럽게 재현하면서도, 회복 가능성의 여지를 열어 두는 예언적 어조를 살렸습니다.
  doctrine_reference: Source syntax; prophetic discourse
