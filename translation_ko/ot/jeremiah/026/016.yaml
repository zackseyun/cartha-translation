  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַ/שָּׂרִים֙ וְ/כָל הָ/עָ֔ם אֶל הַ/כֹּהֲנִ֖ים וְ/אֶל הַ/נְּבִיאִ֑ים אֵין לָ/אִ֤ישׁ הַ/זֶּה֙ מִשְׁפַּט מָ֔וֶת כִּ֗י בְּ/שֵׁ֛ם יְהוָ֥ה אֱלֹהֵ֖י/נוּ דִּבֶּ֥ר אֵלֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/016.yaml
  text: Then the officials and all the people said to the priests and the prophets[a], “This man does not deserve the sentence of death[b], for he has spoken to us in the name of Yahweh our God.”
  footnotes:
  - marker: a
    text: Or, “There is no sentence of death for this man,” or “This man is not worthy of death.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “in the name of Yahweh our God.” Main text follows the project’s standard rendering of the divine name as “the LORD.”'
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 관리들과 모든 백성이 제사장들과 예언자들에게 말했습니다. 「이 사람에게는 사형 판결이 없습니다. 그가 야훼 우리 하나님의 이름으로 우리에게 말했기 때문입니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 사람에게는 사형 판결이 없다”, 또는 “이 사람은 죽을 자격이 없다”.
    reason: lexical_alternative
  - marker: b
    text: '히브리어: “야훼 우리 하나님의 이름으로.” 본문은 신명 표기를 표준에 따라 옮긴 것입니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 고관들
  lexicon: HALOT
  rationale: שָׂרִים는 재판 장면에서 권력을 가진 행정·재판 담당자를 가리키므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘관리들’로 옮겼습니다.
- source_word: וְכָל הָעָם
  english_pob_choice: and all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 온 백성
  - 온 민중
  lexicon: HALOT
  rationale: 공적 판단에 참여하는 집단 전체를 가리키므로 ‘모든 백성’이 가장 सीधे하고 문맥을 잘 살립니다.
- source_word: מִשְׁפַּט מָוֶת
  english_pob_choice: the sentence of death
  chosen_korean: 사형 판결
  alternatives_korean:
  - 사망 판결
  - 죽음의 판결
  lexicon: HALOT
  rationale: 법정 용어인 מִשְׁפַּט의 사법적 힘을 살리기 위해, 단순한 ‘죽을 만하다’보다 재판 결과를 분명히 드러내는 ‘사형 판결’로 옮겼습니다.
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ
  english_pob_choice: in the name of Yahweh our God
  chosen_korean: 야훼 우리 하나님의 이름으로
  alternatives_korean:
  - 야훼 우리 하나님 이름으로
  - 주 우리 하나님의 이름으로
  lexicon: HALOT
  rationale: בְּשֵׁם은 ‘권위에 의하여/이름으로’라는 대리·공식성의 의미가 있으므로 ‘~의 이름으로’로 자연스럽게 살렸고, יְהוָה는 본 항목의 표준에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 재판 문맥에서의 부정 판결 표현
  chosen_reading: 이 사람에게는 사형 판결이 없습니다
  alternative_readings:
  - 이 사람은 죽을 자격이 없습니다
  - 이 사람에게는 죽음의 판결이 없습니다
  rationale: 히브리어는 도덕적 평결보다 법적 무죄/비사형 결정을 말하므로, 문맥상 가장 직접적인 사법 표현을 유지했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
- issue: 여호와/야훼 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 고유 신명으로 드러내기 위해 표준적으로 ‘야훼’를 사용했습니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
