theological_decisions:
- issue: ‘손’의 비유적 의미를 어떻게 드러낼지
  chosen_reading: 본문의 ‘손’ 이미지를 보존하면서도 보호와 지지의 의미가 드러나도록 옮겼습니다.
  alternative_readings:
  - 의역하여 ‘아히감이 예레미야를 보호했습니다’로 처리
  - ‘아히감이 예레미야 편에 섰습니다’로 처리
  rationale: 이 절은 같은 어근/이미지를 반복해 대비를 이루므로, 앞부분과 뒷부분의 ‘손’을 함께 살려 문학적 대조를 유지하는 것이 중요합니다.
  doctrine_reference: 서사적 이미지 보존 원칙
