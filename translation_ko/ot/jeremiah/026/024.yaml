  text: But the hand of Ahikam son of Shaphan was with Jeremiah[b][a], so that he was not given into the hand of the people to put him to death.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the hand of Ahikam ... was with Jeremiah.'' The expression means Ahikam supported and protected Jeremiah.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''into the hand of the people,'' an idiom meaning into their power.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 사반의 아들 아히감이 예레미야를 보호하여, 그가 백성의 손에 넘겨져 죽임을 당하지 않게 하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘아히감의 손이 예레미야와 함께하였다’입니다. 이는 아히감이 예레미야를 지지하고 보호했다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘백성의 손에’는 여기서 ‘백성의 권세 아래’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
