id: JER.26.15
reference: Jeremiah 26:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַ֣ךְ יָדֹ֣עַ תֵּדְע֗וּ כִּ֣י אִם מְמִתִ֣ים אַתֶּם֮ אֹתִ/י֒ כִּי דָ֣ם נָקִ֗י אַתֶּם֙ נֹתְנִ֣ים עֲלֵי/כֶ֔ם וְ/אֶל הָ/עִ֥יר הַ/זֹּ֖את וְ/אֶל יֹשְׁבֶ֑י/הָ כִּ֣י בֶ/אֱמֶ֗ת שְׁלָחַ֤/נִי יְהוָה֙ עֲלֵי/כֶ֔ם לְ/דַבֵּר֙ בְּ/אָזְנֵי/כֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה׀־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/015.yaml
  text: Only know for certain that if you put me to death[a], you are bringing innocent blood on yourselves, on this city, and on its inhabitants[b]; for in truth Yahweh has sent me to you to speak all these words in your hearing.
  footnotes:
  - marker: a
    text: Or 'you kill me.' The Hebrew verb is causative ('put to death'), which suits the judicial context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in your ears,' an idiom meaning 'so that you hear' or 'in your hearing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 분명히 아십시오. 만일 여러분이 저를 죽인다면[a], 여러분은 이 도성과 그 주민들 위에 무죄한 피를 얹는 것입니다[b]. 참으로 야훼께서 여러분에게 저를 보내셔서 여러분의 귀에 이 모든 말을 전하게 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '저를 죽이신다면'. 히브리어 동사는 사역적 의미라서, 법정적 맥락에서는 '죽이다'보다 '죽게 하다/죽음에 처하다'의 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 직역하면 '무죄한 피를 여러분 위와 이 도성과 그 주민들 위에 주는 것'입니다. 여기서는 혈죄가 공동체 전체에 미치는 책임을 드러내기 위해 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ יָדֹעַ תֵּדְעוּ
  english_pob_choice: Only know for certain
  chosen_korean: 다만 분명히 아십시오
  alternatives_korean:
  - 오직 반드시 아십시오
  - 정말로 아십시오
  lexicon: HALOT
  rationale: אַךְ의 강한 제한/강조와 ידע의 반복 강조를 자연스러운 합쇼체 명령으로 압축해, 단순 정보가 아니라 엄중한 경고임을 살렸습니다.
- source_word: מְמִתִים אַתֶּם אֹתִי
  english_pob_choice: if you put me to death
  chosen_korean: 여러분이 저를 죽인다면
  alternatives_korean:
  - 여러분이 저를 사형에 처한다면
  - 여러분이 저를 죽음에 넘긴다면
  lexicon: HALOT
  rationale: 히필의 사역적 의미는 '죽이다'보다 '죽게 하다/죽음에 이르게 하다'에 가깝지만, 한국어에서는 משפט적 상황을 해치지 않으면서도 자연스러운 '죽인다면'이 가장 सीधे로 대응합니다.
- source_word: דָם נָקִי ... נֹתְנִים עֲלֵיכֶם וְאֶל הָעִיר הַזֹּאת וְאֶל יֹשְׁבֶיהָ
  english_pob_choice: you are bringing innocent blood on yourselves, on this city, and on its inhabitants
  chosen_korean: 여러분은 이 도성과 그 주민들 위에 무죄한 피를 얹는 것입니다
  alternatives_korean:
  - 여러분은 이 도성과 그 주민들 위에 무죄한 피를 가져오는 것입니다
  - 여러분은 이 도성과 그 주민들에게 무죄한 피의 책임을 지우는 것입니다
  lexicon: HALOT
  rationale: '''무죄한 피''는 히브리 관용구를 직역해 살리고, נֹתְנִים עֲלֵיכֶם의 결과적 부담을 ''얹는 것''으로 옮겨 혈죄를 직접적으로 드러냈습니다.'
- source_word: בְּאָזְנֵיכֶם
  english_pob_choice: in your hearing
  chosen_korean: 여러분의 귀에
  alternatives_korean:
  - 여러분이 들을 수 있도록
  - 여러분의 귓가에
  lexicon: HALOT
  rationale: 직역하면 '여러분의 귀에'이지만, 한국어에서도 생생한 히브리어 관용을 보존하기 위해 구어적이되 과도하게 풀이하지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문헌적·비교언어학적 관례를 따라 고유명사를 '야훼'로 옮겨, 칭호 대체가 아니라 신적 이름 자체를 보존했습니다.
theological_decisions:
- issue: 예언자 발언의 법정적·공적 어조
  chosen_reading: 합쇼체로 유지하되, 직접 경고는 명령형과 조건문으로 분명히 살렸습니다.
  alternative_readings:
  - 완곡한 설명체로 낮춤
  - 더 경어적인 간접화법으로 완화
  rationale: 본절은 예레미야가 공적 심문 앞에서 무죄성과 소명을 변호하는 장면이므로, 한국어에서도 법정적 긴장과 직접성을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 예언자적 증언의 직접성
- issue: 여호와 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - the LORD
  rationale: 본문의 יְהוָה는 칭호가 아닌 언약명으로 나타나므로, 번역 본문에서도 이름의 성격을 드러내는 표기를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
