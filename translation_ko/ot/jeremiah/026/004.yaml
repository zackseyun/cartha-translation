id: JER.26.4
reference: Jeremiah 26:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם כֹּ֖ה אָמַ֣ר יְהוָ֑ה אִם לֹ֤א תִשְׁמְעוּ֙ אֵלַ֔/י לָ/לֶ֨כֶת֙ בְּ/ת֣וֹרָתִ֔/י אֲשֶׁ֥ר נָתַ֖תִּי לִ/פְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/004.yaml
  text: 'And you shall say to them, ‘Thus says the LORD: If you do not listen to me, to walk in my law that I have set before you,’'
translation:
  language: ko
  text: 그리고 그들에게 이렇게 말하십시오. 「야훼께서 이렇게 말씀하십니다. 너희가 내 말을 듣지 않고, 내가 너희 앞에 둔 나의 율법대로 걷지 않으면」
  philosophy: formal
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 이 단락의 영어 POB가 LORD로 되돌아갔더라도, 히브리어 원문 신명은 한국어 기본값인 야훼를 따라야 하며, 본문에서 야훼의 직접 발화로 유지하는 편이 원문 대응이 분명합니다.
- source_word: תִשְׁמְעוּ אֵלַי
  english_pob_choice: you do not listen to me
  chosen_korean: 너희가 내 말을 듣지 않고
  alternatives_korean:
  - 너희가 나에게 순종하지 않고
  - 너희가 내게 듣지 않고
  lexicon: שמע + ל־
  rationale: שמע + 전치사 לְ/אל의 기본은 ‘듣다/귀를 기울이다’이며, 문맥상 단순 청취보다 언약적 응답을 포함하지만 한국어에서는 과장 없이 ‘내 말을 듣지 않고’가 가장 직접적입니다.
- source_word: לָלֶכֶת בְּת֣וֹרָתִי
  english_pob_choice: to walk in my law
  chosen_korean: 나의 율법대로 걷지
  alternatives_korean:
  - 나의 율법 안에서 걷지
  - 내 율법을 따라 살지
  lexicon: הלך + בְּ + תּוֹרָה
  rationale: 히브리어 ‘걷다’는 삶의 행위를 비유하고, תּוֹרָה는 여기서 하나님의 지시 전체를 가리키므로 전통적 ‘율법’과 동사를 살린 ‘대로 걷지’가 원문 구조를 잘 드러냅니다.
- source_word: נָתַתִּי לִפְנֵיכֶם
  english_pob_choice: I have set before you
  chosen_korean: 내가 너희 앞에 둔
  alternatives_korean:
  - 내가 너희 앞에 놓은
  - 내가 너희 앞에 제시한
  lexicon: נתן + לִפְנֵי
  rationale: ‘앞에 두다/놓다’는 선택과 책임의 대상화된 제시를 나타내므로, 한국어에서는 간결한 ‘너희 앞에 둔’이 가장 자연스럽습니다.
theological_decisions:
- issue: 언약적 청종과 행위의 병렬
  chosen_reading: ‘듣지 않다’와 ‘걷지 않다’를 분리해, 말에 대한 순종과 삶의 행위를 함께 요구하는 구조를 유지했습니다.
  alternative_readings:
  - ‘듣지 않고 순종하지 않고’로 하나로 묶기
  - ‘따라 살지’로 동사를 풀어 번역하기
  rationale: 원문은 청종과 행위를 병렬로 제시하므로, 이를 하나의 일반적 ‘불순종’으로 합치면 경고의 수사적 날카로움이 약해집니다.
  doctrine_reference: 신 11:26-28; 렘 7:23
