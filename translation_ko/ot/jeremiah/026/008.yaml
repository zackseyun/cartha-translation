reference: Jeremiah 26:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/כַלּ֣וֹת יִרְמְיָ֗הוּ לְ/דַבֵּר֙ אֵ֣ת כָּל אֲשֶׁר צִוָּ֣ה יְהוָ֔ה לְ/דַבֵּ֖ר אֶל כָּל הָ/עָ֑ם וַ/יִּתְפְּשׂ֨וּ אֹת֜/וֹ הַ/כֹּהֲנִ֧ים וְ/הַ/נְּבִאִ֛ים וְ/כָל הָ/עָ֥ם לֵ/אמֹ֖ר מ֥וֹת תָּמֽוּת׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/008.yaml
  text: And it happened[a], when Yirmeyahu had finished speaking all that Yahweh had commanded him to speak to all the people, that the priests and the prophets and all the people seized him, saying, “You must surely die!”
  footnotes:
  - marker: a
    text: Or, “You shall surely die.” The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 야훼께서 그에게 온 백성에게 말하라고 명하신 모든 것을 다 말하기를 마치자, 제사장들과 예언자들과 온 백성이 그를 붙잡고 “너는 반드시 죽어야 한다!”라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너는 반드시 죽으리라.” 히브리어는 부정사 절대형과 유한 동사의 결합으로 강조를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: -자
  alternatives_korean:
  - 그리고 일이 일어났습니다
  - 그때
  lexicon: HALOT
  rationale: 서사 전환 표지로서 사건의 이어짐을 자연스럽게 살리기 위해 한국어 종결 연결로 처리했습니다.
- source_word: כְּכַלּוֹת יִרְמְיָהוּ לְדַבֵּר
  english_pob_choice: when Yirmeyahu had finished speaking
  chosen_korean: 예레미야가 … 말하기를 마치자
  alternatives_korean:
  - 예레미야가 … 말하기를 끝내자
  - 예레미야가 … 다 말한 후
  lexicon: HALOT
  rationale: כלה + infinitive의 완료 시점을 한국어의 ‘말하기를 마치다’로 옮겨 동작의 종결을 분명히 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 프로젝트 기본 용례
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겨, 본문이 드러내는 언약적 고유명을 보존했습니다.
- source_word: וַיִּתְפְּשׂוּ אֹתוֹ
  english_pob_choice: seized him
  chosen_korean: 그를 붙잡고
  alternatives_korean:
  - 그를 잡고
  - 그를 체포하고
  lexicon: HALOT
  rationale: תפשׂ는 강제적으로 붙드는 뜻이므로, 과도하게 법적 절차를 덧붙이지 않는 ‘붙잡다’로 처리했습니다.
- source_word: מוֹת תָּמוּת
  english_pob_choice: You must surely die
  chosen_korean: 너는 반드시 죽어야 한다
  alternatives_korean:
  - 너는 반드시 죽을 것이다
  - 너는 틀림없이 죽어야 한다
  lexicon: HALOT
  rationale: 부정사 절대형의 강조를 한국어의 ‘반드시’로 살리되, 위협의 직접성을 유지했습니다.
theological_decisions:
- issue: 직접 화법의 위협적 명령조
  chosen_reading: 「너는 반드시 죽어야 한다!」
  alternative_readings:
  - 「너는 반드시 죽을 것이다!」
  - 「너는 꼭 죽을 것이다!」
  rationale: 본문은 단순 예언이 아니라 강한 사형 선고형 위협이므로, 미래 진술보다 의무/필연을 띤 강한 직설을 유지했습니다.
  doctrine_reference: 본문의 משפט적·선언적 강조 보존
- issue: 예언자 호칭
  chosen_reading: 예언자들
  alternative_readings:
  - 선지자들
  rationale: 히브리어 נביאים의 현대 표준어 대응을 우선해 ‘예언자들’을 사용했습니다. 본문 기능상 전통 교회어보다 직접적입니다.
  doctrine_reference: 프로젝트 한국어 용례 정책
