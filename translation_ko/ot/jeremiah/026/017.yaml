lexical_decisions:
- source_word: וַיָּקֻמוּ
  english_pob_choice: stood up
  chosen_korean: 일어나
  alternatives_korean:
  - 자리를 박차고 일어나
  - 일어섰습니다
  lexicon: HALOT
  rationale: 공적 발언을 시작하는 문맥에서 קום의 서술 기능을 자연스럽게 살리면서, 현대 한국어에서도 무난한 동작 표지로 옮겼습니다.
- source_word: מִזִּקְנֵי הָאָרֶץ
  english_pob_choice: from the elders of the land
  chosen_korean: 그 땅의 장로들 가운데 몇 사람
  alternatives_korean:
  - 그 땅의 장로들 중 몇 사람
  - 그 땅의 장로들 가운데서 몇 사람
  lexicon: HALOT
  rationale: מן 구문은 ‘~에게서 나온/속한 일부’라는 뜻이므로, 단순한 출처보다 ‘장로들 가운데 몇 사람’이 본문의 인적 관계를 더 정확히 드러냅니다.
- source_word: קְהַל הָעָם
  english_pob_choice: the assembly of the people
  chosen_korean: 백성의 회중
  alternatives_korean:
  - 백성의 모임
  - 백성의 집회
  lexicon: HALOT
  rationale: קהל의 집합·공동체적 의미를 살려 ‘회중’으로 옮겼고, הָעָם은 ‘백성’으로 옮겨 공적인 청중을 분명히 했습니다.
- source_word: וַיֹּאמְרוּ אֶל ... לֵאמֹר
  english_pob_choice: said to ... saying,
  chosen_korean: 말하여,
  alternatives_korean:
  - 말하고,
  - 이르러,
  - 말하되,
  lexicon: HALOT
  rationale: 다음 절의 직접화법을 여는 לֵאמֹר의 기능상 한국어에서는 ‘말하여’가 가장 자연스럽고, 불필요한 중복을 피하면서 서술 구조를 보존합니다.
theological_decisions:
- issue: לֵאמֹר을 포함한 히브리어 담화 표지의 처리
  chosen_reading: 한국어에서는 ‘말하여’로 압축해 본문 흐름을 자연스럽게 했습니다.
  alternative_readings:
  - ‘말하여 이르되’
  - ‘말하며’
  rationale: 이 절은 인용문 자체보다 다음 절로 이어지는 담화 도입이 핵심이므로, 합쇼체 문체 안에서 과도한 문어체를 피하면서도 원문 구조를 드러내는 방향을 택했습니다.
  doctrine_reference: 문체/담화 구조
