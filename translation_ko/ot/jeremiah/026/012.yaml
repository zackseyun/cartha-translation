  text: Then Yirmeyahu said to all the officials and to all the people, saying, “The LORD sent me to prophesy against this house and against this city all the words that you have heard.”
translation:
  language: ko
  text: 그때 예레미야가 모든 고관과 모든 백성에게 말했습니다. “야훼께서 나를 보내셔서, 여러분이 들은 이 모든 말씀을 이 성전과 이 성읍을 거슬러 예언하게 하셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: The LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문은 신명성명 YHWH이며, POB 기준의 기본값에 따라 학술적 음역인 야훼를 사용해 원문의 고유 신명성을 드러냈습니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 모든 지도자
  alternatives_korean:
  - 모든 관리들
  - 모든 고관들
  lexicon: שַׂר
  rationale: 문맥상 예레미야를 듣는 정치·행정적 상층 인물을 가리키므로, 한국어에서는 자연스럽고 포괄적인 ‘지도자’로 옮겼습니다.
- source_word: לְהִנָּבֵא
  english_pob_choice: to prophesy
  chosen_korean: 예언하라고
  alternatives_korean:
  - 예언하도록
  - 예언하기 위해
  lexicon: נבא
  rationale: 동사형 목적구조를 한국어 사역 표현으로 살려, 파송 목적이 단순 발화가 아니라 ‘예언’ 행위임을 분명히 했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 본문의 LORD는 번역 전통형 ‘주님’이 아니라 원문 신명성명인 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 야훼의 파송 선언을 직접 전하는 문맥이므로, 원문 식별성을 유지하는 것이 본문 의미와 POB의 투명성 원칙에 더 부합합니다.
  doctrine_reference: 출애굽기 3:15; 예레미야 1:7
