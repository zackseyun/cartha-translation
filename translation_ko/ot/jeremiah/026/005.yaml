translation:
  language: ko
  text: 내 종들인 예언자들의 말을 들으려고, 내가 너희에게 보내며 — 이른 아침부터 보내고 또 보내지만 — 너희는 듣지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘일찍 일어나 보내고’라는 관용구로, 하나님의 지속적이고 반복적인 파송을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ עַל דִּבְרֵי
  english_pob_choice: to listen to the words of
  chosen_korean: “말을 들으려고”
  alternatives_korean:
  - “말씀에 귀 기울이려고”
  - “말을 듣기 위해”
  lexicon: HALOT
  rationale: לִשְׁמֹעַ는 여기서 목적을 나타내며, 이어지는 ‘듣지 않았습니다’와의 대조를 살리기 위해 ‘귀 기울이다’보다 직접적인 ‘듣다’ 계열이 적절합니다.
- source_word: עֲבָדַי הַנְּבִאִים
  english_pob_choice: my servants the prophets
  chosen_korean: “내 종들인 예언자들”
  alternatives_korean:
  - “내 종들인 선지자들”
  - “나의 종 예언자들”
  lexicon: HALOT
  rationale: עֲבָדַי는 여기서 소유적·직분적 표현으로서 하나님의 소속된 대리자라는 뜻이 강하므로, 사회적 신분을 부각하는 ‘노예’보다 문맥에 맞는 ‘종’이 적절합니다.
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחַ אֲלֵיכֶם
  english_pob_choice: whom I am sending to you
  chosen_korean: “내가 너희에게 보내며”
  alternatives_korean:
  - “내가 너희에게 보내고 있는”
  - “내가 너희에게 보내는”
  lexicon: HALOT
  rationale: 현재분사적 용법을 살려 하나님이 지금도 보내시는 सक्रिय한 행위를 나타내기 위해 ‘보내며’로 옮겼습니다.
- source_word: וְהַשְׁכֵּם וְשָׁלֹחַ
  english_pob_choice: rising early and sending
  chosen_korean: “이른 아침부터 보내고 또 보내지만”
  alternatives_korean:
  - “일찍 일어나 보내고”
  - “끊임없이 보내고”
  - “아침 일찍부터 보내며”
  lexicon: HALOT
  rationale: 직역하면 ‘일찍 일어나 보내다’이지만, 예레미야서의 관용구가 반복적·집요한 파송을 뜻하므로 본문에는 그 힘을 살린 표현을 쓰고, 원문 이미지는 후속 검토를 위해 보존합니다.
- source_word: וְלֹא שְׁמַעְתֶּם
  english_pob_choice: though you have not listened
  chosen_korean: “너희는 듣지 않았습니다”
  alternatives_korean:
  - “그러나 너희는 듣지 않았습니다”
  - “그런데도 너희는 듣지 않았습니다”
  lexicon: HALOT
  rationale: 반복적 파송에 대한 거부를 단순하고 직접적으로 진술하여, 앞절의 경고적 흐름을 자연스러운 한국어로 유지했습니다.
theological_decisions:
- issue: וְהַשְׁכֵּם וְשָׁלֹחַ의 관용성
  chosen_reading: ‘이른 아침부터 보내고 또 보내지만’으로 반복성과 긴박성을 드러냈습니다.
  alternative_readings:
  - ‘일찍 일어나 보내고’
  - ‘끊임없이 보내고’
  rationale: 표현은 문자적으로는 시간표현이지만, 문맥상 하나님의 지속적이고 열심한 선지자 파송을 강조하는 관용구이므로, 한국어 독자가 그 힘을 즉시 이해하도록 옮겼습니다.
  doctrine_reference: Translation philosophy §2, §6
- issue: עֲבָדַי의 신분 뉘앙스
  chosen_reading: ‘내 종들’로 번역했습니다.
  alternative_readings:
  - ‘내 노예들’
  - ‘내 시종들’
  rationale: 이 구절은 예언자들의 소속과 위임을 드러내는 관용적 호칭이므로, 본문이 강조하지 않는 사회적 예속을 전면화하지 않고 문맥상의 직분성을 살렸습니다.
  doctrine_reference: 'Contested terms table: δοῦλος servant/slave (context-dependent)'
