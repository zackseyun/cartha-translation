language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֛וּ הַ/כֹּהֲנִ֥ים וְ/הַ/נְּבִאִ֖ים וְ/כָל הָ/עָ֑ם אֶֽת יִרְמְיָ֔הוּ מְדַבֵּ֛ר אֶת הַ/דְּבָרִ֥ים הָ/אֵ֖לֶּה בְּ/בֵ֥ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/007.yaml
  text: And the priests and the prophets and all the people heard Jeremiah speaking these words in the house of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'in the temple of the LORD.' Literally, 'in the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장들과 예언자들과 모든 백성이 야훼의 집에서 예레미야가 이 말들을 말하는 것을 들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전에서’. 히브리어 직역은 ‘야훼의 집에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들어
  lexicon: HALOT
  rationale: 서술형 완료 과거를 자연스럽게 살리기 위해 ‘들었습니다’로 옮겼습니다. ‘듣고 있었습니다’보다 단순한 사건 진술에 맞습니다.
- source_word: הַכֹּהֲנִים וְהַנְּבִאִים וְכָל הָעָם
  english_pob_choice: the priests and the prophets and all the people
  chosen_korean: 제사장들과 예언자들과 모든 백성
  alternatives_korean:
  - 제사장들과 선지자들과 모든 백성
  - 사제들과 예언자들과 온 백성
  lexicon: HALOT
  rationale: 공동체 내 직분 명칭은 통상적인 ‘제사장들’과 ‘예언자들’로 옮기되, 대중적 교회어인 ‘선지자’는 피했습니다. ‘모든 사람들’보다 집합명사 ‘백성’이 히브리어 הָעָם의 범위를 더 잘 반영합니다.
- source_word: מְדַבֵּר אֶת הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: Jeremiah speaking these words
  chosen_korean: 예레미야가 이 말들을 말하는 것을
  alternatives_korean:
  - 예레미야가 이 말씀들을 말하는 것을
  - 예레미야가 이 말을 하는 것을
  lexicon: HALOT
  rationale: 현재분사 מְדַבֵּר의 동시 진행성을 살리기 위해 ‘말하는 것을’으로 처리했습니다. דְּבָרִים는 ‘말씀’보다 중립적인 ‘말들/말’이 원문에 더 가깝습니다.
- source_word: בְּבֵית יְהוָה
  english_pob_choice: in the house of Yahweh[a]
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 여호와의 집에서
  - 주님의 집에서
  - 야훼의 성전에서
  lexicon: HALOT
  rationale: 직역은 ‘야훼의 집’이며, 프로젝트 기본값에 따라 신명사 יְהוָה는 ‘야훼’로 옮겼습니다. ‘성전’은 문맥상 가능하지만, 본문이 쓰는 ‘집’이라는 표현을 보존했습니다.
theological_decisions:
- issue: 신명사 יְהוָה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - LORD
  rationale: 히브리어 본문에 나타난 언약명 자체를 드러내기 위해 ‘야훼’를 사용했습니다. 이는 전통적 대체어를 쓰기보다 원문 식별성을 높이려는 본 프로젝트의 기준에 맞습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
