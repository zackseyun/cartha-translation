  text: 'Then King Jehoiakim sent men to Egypt: Elnathan son of Achbor[a], and men with him, to Egypt.'
  footnotes:
  - marker: a
    text: Hebrew repeats 'to Egypt' at the end for the destination of Elnathan and the men with him; the translation preserves the repetition.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호야김 왕이 사람들을 이집트로 보냈습니다. 곧 악볼의 아들 엘나단과 그와 함께한 사람들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이집트로’를 앞과 끝에서 반복합니다. 끝의 표현은 엘나단과 그와 함께한 사람들의 목적지를 다시 밝혀 줍니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 내보냈습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 살리면서 שׁלח의 기본 뜻인 ‘보내다’를 직접 반영했습니다.
- source_word: הַמֶּלֶךְ יְהוֹיָקִים
  english_pob_choice: King Jehoiakim
  chosen_korean: 여호야김 왕
  alternatives_korean:
  - 여호야김 왕이
  - 왕 여호야김
  lexicon: HALOT
  rationale: 히브리어의 호칭+이름 결합을 한국어에서는 ‘여호야김 왕’으로 옮겨 간결하고 자연스럽게 했습니다.
- source_word: אֲנָשִׁים
  english_pob_choice: men
  chosen_korean: 사람들
  alternatives_korean:
  - 남자들
  - 인원들
  lexicon: HALOT
  rationale: 공식 사절의 구성원을 가리키지만 한국어에서는 ‘사람들’이 가장 자연스럽고, 본문이 특정 성별을 강조하지 않는 범위에서 포괄적으로 읽히도록 했습니다.
- source_word: אֶלְנָתָן בֶּן עַכְבּוֹר
  english_pob_choice: Elnathan son of Achbor
  chosen_korean: 엘나단, 악볼의 아들
  alternatives_korean:
  - 엘나단, 악볼의 아들인 사람
  - 악볼의 아들 엘나단
  lexicon: HALOT
  rationale: 고유명사는 음역하고, בן의 친족 관계는 ‘~의 아들’로 표준적으로 옮겼습니다.
- source_word: אֶל מִצְרַיִם
  english_pob_choice: to Egypt
  chosen_korean: 이집트로
  alternatives_korean:
  - 이집트에
  - 이집트까지
  lexicon: HALOT
  rationale: אֶל의 목적지 방향을 한국어 조사 ‘-로’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 문장 끝의 목적지 반복
  chosen_reading: ‘이집트로’의 반복을 본문대로 살려 두 번 옮겼습니다.
  alternative_readings:
  - 뒤의 목적지는 생략하여 한 번만 옮김
  rationale: 히브리어가 끝에서 ‘to Egypt’를 다시 말해 파견 대상의 목적지를 강조하므로, 이 반복을 제거하지 않았습니다.
  doctrine_reference: 본문 충실성 / source transparency
