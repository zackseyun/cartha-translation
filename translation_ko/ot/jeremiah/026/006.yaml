  source_fidelity: 원문의 두 משפט 모두 נתן의 사역적 용법을 잘 반영해야 합니다. ‘실로처럼 되게 하다’는 이 집이 실로와 같은 처지가 되게 한다는 비교를 자연스럽게 보존하며, לִקְלָלָה는 ‘저줏거리’로 옮겨 저주를 받을/저주에 인용될 대상이라는 관용적 의미를 살립니다.
  naturalness: 초안의 ‘실로와 같이 만들고’와 ‘저주가 되게’는 직역투로 다소 부자연스럽습니다. ‘실로처럼 되게 하고’, ‘저줏거리가 되게 하겠습니다’가 현대 표준어 합쇼체에서 더 자연스럽고 예언적 선언의 격식도 유지합니다.
  terminology: ‘집’은 성전을 가리키지만 히브리어 בַּיִת를 보존하는 적절한 번역입니다. 지명은 ‘실로’로 음역하고, ‘성읍’은 본문 문체상 유지할 수 있습니다. ‘저줏거리’는 לִקְלָלָה의 관용적 의미를 충실히 전달합니다.
  issues:
  - severity: medium
    issue: ‘이 집을 실로와 같이 만들고’는 한국어에서 비교 대상이 되는 결과 상태가 충분히 드러나지 않습니다.
    rationale: כְשִׁלֹה는 이 집이 실로와 같은 처지가 되게 된다는 비교입니다. ‘실로처럼 되게 하고’가 원문의 사역적 판단을 더 자연스럽고 정확하게 나타냅니다.
  - severity: medium
    issue: ‘이 성읍을 … 저주가 되게’는 한국어 관용상 어색하고 לִקְלָלָה의 ‘저주의 대상/저주에 인용될 본보기’라는 뜻이 흐려집니다.
    rationale: ‘저줏거리’는 해당 히브리어 관용구를 간결하게 반영합니다. 각주에서 ‘저주의 대상’이라는 설명적 대안을 제공하여 의미를 보완합니다.
