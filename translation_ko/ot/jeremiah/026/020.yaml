id: JER.26.20
reference: Jeremiah 26:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גַם אִ֗ישׁ הָיָ֤ה מִתְנַבֵּא֙ בְּ/שֵׁ֣ם יְהוָ֔ה אֽוּרִיָּ֨הוּ֙ בֶּֽן שְׁמַעְיָ֔הוּ מִ/קִּרְיַ֖ת הַיְּעָרִ֑ים וַ/יִּנָּבֵ֞א עַל הָ/עִ֤יר הַ/זֹּאת֙ וְ/עַל הָ/אָ֣רֶץ הַ/זֹּ֔את כְּ/כֹ֖ל דִּבְרֵ֥י יִרְמְיָֽהוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/020.yaml
  text: And there was also a man prophesying in the name of Yahweh[a], Uriah son of Shemaiah from Kiriath-jearim[b], and he prophesied against this city and against this land according to all the words of Jeremiah.
  footnotes:
  - marker: a
    text: 'Or, ''concerning this city and this land.'' The Hebrew preposition can introduce the topic of prophecy more generally, though here the context favors a judgment sense: ''against.'''
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Uriah'; some English versions spell the name 'Urijah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 야훼의 이름으로 예언하던 사람이 있었는데, 그는 기럇여아림 출신 스마야의 아들 우리야였습니다. 그는 예레미야의 모든 말대로 이 성과 이 땅을 거슬러 예언했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 성과 이 땅을 거슬러’로 번역한 히브리어 전치사 עַל은 더 일반적으로 ‘이 성과 이 땅에 관하여’라는 뜻으로도 쓰일 수 있습니다. 그러나 여기서는 예레미야의 심판 선포와 일치하는 문맥이므로 ‘거슬러’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: ‘우리야’는 히브리어 고유명사 אֽוּרִיָּהוּ의 일반적인 음역입니다. 영어 번역에서는 ‘Urijah’로도 표기합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם / אִישׁ
  english_pob_choice: And there was also a man
  chosen_korean: 또 한 사람도
  alternatives_korean:
  - 또 한 남자가
  - 그리고 한 사람도
  lexicon: HALOT
  rationale: 추가 사례를 나타내는 וְגַם의 누적 감각을 살리면서, אִישׁ은 여기서 특정한 남성 개인을 가리키므로 자연스러운 ‘한 사람’으로 옮겼습니다.
- source_word: מִתְנַבֵּא בְּשֵׁם יְהוָה
  english_pob_choice: prophesying in the name of Yahweh
  chosen_korean: 야훼의 이름으로 예언하고 있었는데
  alternatives_korean:
  - 야훼의 이름으로 예언하고 있었는데
  - 야훼의 이름으로 예언하는 사람이었는데
  lexicon: HALOT
  rationale: 분사형의 지속적·상태적 의미를 한국어 진행/배경 표현으로 살렸고, 하나님의 이름은 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֽוּרִיָּהוּ בֶּן שְׁמַעְיָהוּ מִקִּרְיַת הַיְּעָרִים
  english_pob_choice: Uriah son of Shemaiah from Kiriath-jearim
  chosen_korean: 기럇여아림 출신인 스마야의 아들 우리야
  alternatives_korean:
  - 기럇여아림 사람인 스마야의 아들 우리야
  - 기럇여아림에서 온 스마야의 아들 우리야
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기 관행에 따라 음역했고, מִן의 출신 표지는 ‘출신인’으로 자연스럽게 처리했습니다.
- source_word: עַל הָעִיר הַזֹּאת וְעַל הָאָרֶץ הַזֹּאת
  english_pob_choice: against this city and against this land
  chosen_korean: 이 성읍과 이 땅에 대해
  alternatives_korean:
  - 이 성읍과 이 땅을 향해
  - 이 성읍과 이 땅을 상대로
  lexicon: HALOT
  rationale: 히브리어 עַל의 기본 전치 의미를 살리면서도, 예언 내용의 주제/대상 표시를 한국어 ‘~에 대해’로 옮겨 과도한 해석 없이 문맥을 반영했습니다.
- source_word: כְּכֹל דִּבְרֵי יִרְמְיָהוּ
  english_pob_choice: according to all the words of Jeremiah
  chosen_korean: 예레미야의 모든 말과 같은 내용으로
  alternatives_korean:
  - 예레미야의 모든 말에 따라
  - 예레미야의 모든 말대로
  lexicon: HALOT
  rationale: ‘모든 말’의 단순 대응보다, 우르야의 예언이 예레미야의 선포와 본질적으로 일치한다는 점을 한국어에서 더 자연스럽게 드러내기 위해 ‘같은 내용으로’를 선택했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 고유명을 보존하기 위해 프로젝트 기준에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
- issue: עַל의 예언적 방향성
  chosen_reading: 이 성읍과 이 땅에 대해
  alternative_readings:
  - 이 성읍과 이 땅을 향해
  - 이 성읍과 이 땅을 상대로
  rationale: 이 절은 심판 예언의 문맥이지만, 히브리어 전치사의 기본값이 반드시 대적적 의미만은 아니므로 한국어 본문은 주제 표지를 유지하고, 문맥적 심판성은 독자가 자연스럽게 파악하도록 했습니다.
  doctrine_reference: 문맥적 예언 표현의 범위
