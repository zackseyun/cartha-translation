revisions:
- from: 또 한 사람도 야훼의 이름으로 예언하고 있었는데, 그 사람은 기럇여아림 출신인 스마야의 아들 우리야였습니다. 그는 이 성읍과 이 땅에 대해, 예레미야의 모든 말과 같은 내용으로 예언했습니다.[a][b]
