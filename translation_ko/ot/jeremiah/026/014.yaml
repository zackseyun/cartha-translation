id: JER.26.14
reference: Jeremiah 26:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֖י הִנְ/נִ֣י בְ/יֶדְ/כֶ֑ם עֲשׂוּ לִ֛/י כַּ/טּ֥וֹב וְ/כַ/יָּשָׁ֖ר בְּ/עֵינֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/026/014.yaml
  text: But as for me[a], here I am in your hand[b]. Do to me what is good and right in your eyes.
  footnotes:
  - marker: a
    text: Or 'in your hands'; Hebrew has the singular 'hand' in an idiomatic expression for being under someone's control.
    reason: lexical_alternative
  - marker: b
    text: Or 'as you see fit.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하지만 저는 지금 여러분의 손에 있습니다[a]. 여러분의 눈에 좋고 옳은 대로 저를 처리하십시오[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 손들 안에’. 히브리어는 관용적으로 단수 ‘손’을 사용하여 누군가의 통제 아래 있음을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분이 보기에 합당한 대로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: But as for me
  chosen_korean: 하지만 저는
  alternatives_korean:
  - 그리고 저는
  - 저는
  lexicon: HALOT
  rationale: 대조를 이루는 접속과 화행 전환을 살려, 앞선 변론 이후 자신에게 시선을 돌리는 어감을 한국어에서 자연스럽게 드러냈습니다.
- source_word: בְיֶדְכֶם
  english_pob_choice: in your hand
  chosen_korean: 여러분의 손에
  alternatives_korean:
  - 여러분의 손 안에
  - 여러분의 권세 아래에
  lexicon: HALOT
  rationale: 히브리어 단수 ‘손’의 관용적 표현을 살리되, 한국어에서는 ‘손에 있다’가 통제 아래 있음의 의미를 가장 자연스럽게 전달합니다.
- source_word: עֲשׂוּ לִי
  english_pob_choice: Do to me
  chosen_korean: 저를 처리하십시오
  alternatives_korean:
  - 저에게 행하십시오
  - 저를 대하십시오
  lexicon: HALOT
  rationale: 재판/처벌 맥락에서 상대가 자신에게 취할 조치를 직접 요청하는 말이므로, 단순한 ‘하다’보다 판단과 처분의 함의를 드러냈습니다.
- source_word: כַּטּוֹב וְכַיָּשָׁר
  english_pob_choice: what is good and right
  chosen_korean: 좋고 옳은 대로
  alternatives_korean:
  - 선하고 바른 대로
  - 좋다고 옳다고 여기는 대로
  lexicon: HALOT
  rationale: טוֹב과 יָשָׁר의 도덕·판정적 뉘앙스를 함께 살리면서, 한국어에서는 병렬적으로 간명하게 표현했습니다.
- source_word: בְּעֵינֵיכֶם
  english_pob_choice: in your eyes
  chosen_korean: 여러분의 눈에
  alternatives_korean:
  - 여러분이 보기에
  - 여러분의 판단에
  lexicon: HALOT
  rationale: ‘눈에’라는 히브리어 관용을 유지해 원문 이미지를 보존하되, 한국어 독자도 의미를 곧바로 이해할 수 있게 했습니다.
theological_decisions:
- issue: 직접화법의 공손도와 화자 태도
  chosen_reading: 예레미야가 재판관들에게 예의를 갖추되 굴복하지 않는 태도로 말하는 현대 한국어 합쇼체를 유지했습니다.
  alternative_readings:
  - 더 직설적인 평서형
  - 고어체 청유/명령형
  rationale: 원문은 항변 뒤의 최종 자기위탁에 가까우므로, 현대 공식체로 긴장과 겸손을 함께 드러내는 것이 적절합니다.
  doctrine_reference: 예언자 서사의 화행과 담화 맥락
- issue: ‘여러분의 손에’의 관용성
  chosen_reading: 통제권 아래 있음이라는 원문 관용을 한국어의 ‘손에 있다’로 옮겼습니다.
  alternative_readings:
  - 권세 아래에 있다
  - 맡겨져 있다
  rationale: 히브리어 단수 ‘손’의 이미지와 종속 상태를 보존하는 것이 본문의 어조와 법정적 상황을 더 잘 반영합니다.
  doctrine_reference: 히브리어 관용구와 서사적 이미지
