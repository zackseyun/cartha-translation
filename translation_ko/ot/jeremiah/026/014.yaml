  source_fidelity: 수정이 필요합니다. 초안의 ‘지금’은 הִנְנִי(‘보십시오/여기 제가 있습니다’)의 현재적·제시적 표현을 충분히 옮기지 못합니다. 또한 עֲשׂוּ לִי는 법정적 맥락을 함의할 수 있으나 그 자체로 ‘처리하다’로 한정되지는 않으므로, 더 포괄적인 표현이 적절합니다. ‘여러분의 손에’ 및 ‘여러분이 보기에 좋고 옳은 대로’는 원문의 단수 손 관용구와 판단의 기준을 충실히 반영합니다.
  naturalness: ‘보십시오, 저는 여러분의 손에 있습니다’는 현대 표준어 공식체에서 원문의 제시·자기위탁 어조를 자연스럽게 전달합니다. ‘저에게 하십시오’는 다소 문어적이지만 합쇼체 성경 번역의 직접화법으로 자연스럽고, ‘처리하십시오’보다 원문의 범위를 보존합니다.
  terminology: ‘손에 있다’는 통제 아래 있음을 나타내는 히브리어 관용구를 한국어로도 자연스럽게 보존합니다. טוֹב과 יָשָׁר는 각각 ‘좋고’와 ‘옳은’으로 유지하여, ‘정당한’처럼 한 가지 법률적 의미로 좁히지 않았습니다.
