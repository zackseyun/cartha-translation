id: JER.16.6
reference: Jeremiah 16:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מֵ֨תוּ גְדֹלִ֧ים וּ/קְטַנִּ֛ים בָּ/אָ֥רֶץ הַ/זֹּ֖את לֹ֣א יִקָּבֵ֑רוּ וְ/לֹֽא יִסְפְּד֣וּ לָ/הֶ֔ם וְ/לֹ֣א יִתְגֹּדַ֔ד וְ/לֹ֥א יִקָּרֵ֖חַ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/006.yaml
  text: Both great and small will die in this land[a]. They will not be buried, and no one will mourn for them, or cut himself[b], or make himself bald for them.
  footnotes:
  - marker: a
    text: That is, customary mourning practices such as self-laceration and shaving the head bald will not be performed for the dead.
    reason: cultural_note
  - marker: b
    text: Or 'they will not lament for them.' The Hebrew uses an indefinite plural verb.
    reason: lexical_alternative
translation:
  language: ko
  text: 이 땅에서 큰 자나 작은 자나 모두 죽을 것입니다. 그들은 장사되지 않을 것이며, 아무도 그들을 위해 애도하지도, 자신을 베지도, 그들을 위해 머리를 민 채로 하지도 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 죽은 자를 위해 통상 행하던 자해와 머리 밀기 같은 애도 관습이 이루어지지 않는다는 뜻입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 무정형 복수 동사를 써서 ‘그들을 위해 아무도 애도하지 않는다’는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְדֹלִים וּקְטַנִּים
  english_pob_choice: both great and small
  chosen_korean: 큰 자나 작은 자나 모두
  alternatives_korean:
  - 큰 자와 작은 자
  - 높은 사람과 낮은 사람
  lexicon: HALOT
  rationale: 사회적 지위의 전 범위를 포괄하는 대구이므로, 위아래를 함께 묶는 표현으로 전체성을 살렸습니다.
- source_word: בָּאָרֶץ הַזֹּאת
  english_pob_choice: in this land
  chosen_korean: 이 땅에서
  alternatives_korean:
  - 이 나라에서
  - 이 지역에서
  lexicon: HALOT
  rationale: 예레미야의 언약적·지리적 맥락에서 אֶרֶץ는 ‘땅’이 가장 자연스럽고 원문의 결을 잘 살립니다.
- source_word: לֹא יִסְפְּדוּ לָהֶם
  english_pob_choice: and no one will mourn for them
  chosen_korean: 아무도 그들을 위해 애도하지도
  alternatives_korean:
  - 그들을 위해 애도하지도
  - 아무도 그들을 위해 곡하지도
  lexicon: HALOT
  rationale: 히브리어의 부정 3인칭 복수는 무정형 주어로 자연스럽게 옮길 수 있어, 공적 애도 부재를 분명히 하는 ‘아무도’로 번역했습니다.
- source_word: וְלֹא יִתְגֹּדַד וְלֹא יִקָּרֵחַ
  english_pob_choice: or cut himself, or make himself bald
  chosen_korean: 자신을 베지도, 그들을 위해 머리를 민 채로 하지도
  alternatives_korean:
  - 자신을 베지도, 그들을 위해 대머리가 되지도
  - 자신의 몸에 상처를 내지도, 그들을 위해 머리를 밀지도
  lexicon: HALOT
  rationale: 장례 애곡의 구체적 행위인 자해와 삭발을 직역에 가깝게 살리되, 한국어에서 어색한 재귀 구조를 완화하여 행위 자체를 드러냈습니다.
theological_decisions:
- issue: 장례 애도 관습의 구체성 보존
  chosen_reading: 자해와 삭발을 일반적 ‘애도 의식’으로 뭉뚱그리지 않고 본문이 말하는 물리적 행위로 드러냈습니다.
  alternative_readings:
  - 애도 예식을 치르지 않다
  - 관습적 상례를 행하지 않다
  rationale: 본문은 단순한 슬픔의 부재가 아니라, 죽은 자를 위한 관습적 통곡·자해·삭발의 부재를 심판의 표지로 나열합니다.
  doctrine_reference: Translation philosophy §§1, 6
