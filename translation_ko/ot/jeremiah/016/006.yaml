revisions:
- from: 이 땅에서 큰 자나 작은 자나 모두 죽을 것입니다. 그들은 장사되지 않을 것이며, 아무도 그들을 위해 애도하지도, 자신을 베지도, 그들을 위해 머리를 민 채로 하지도 않을 것입니다.[a][b]
  to: 이 땅에서 큰 자나 작은 자나 모두 죽을 것입니다. 그들은 묻히지 않을 것이며, 아무도 그들을 위하여 애도하지도[b], 자기 몸을 베지도, 그들을 위하여 머리를 밀지도 않을 것입니다.[a]
  rationale: 원문의 수동 표현(‘묻히지 않을 것이다’)과 애도 행위의 열거를 유지하면서, 어색한 ‘민 채로 하다’를 자연스러운 ‘머리를 밀다’로 바로잡았습니다. 또한 각주가 설명하는 표현에 각각 붙도록 표지 위치를 조정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:25Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘그들을 위해 머리를 민 채로 하지도’는 히브리어의 ‘자신을 대머리로 만들다/머리를 밀다’라는 행위를 자연스럽게 전달하지 못합니다. ‘자기 몸을 베다’와 ‘머리를 밀다’로 구체적 애도 행위를 보존하는 편이 적절합니다.
  naturalness: 합쇼체와 문장 흐름은 전반적으로 적절하나, ‘민 채로 하다’는 현대 표준 한국어에서 비문에 가깝고 의미가 불명확합니다. 병렬 구조를 ‘자기 몸을 베지도, … 머리를 밀지도’로 고치면 자연스럽습니다.
  terminology: ‘이 땅’, ‘큰 자나 작은 자’, ‘애도하다’는 문맥에 적합합니다. ‘묻히다’는 수동태인 יִקָּבֵרוּ를 자연스럽고 정확하게 반영합니다. 각주 표지는 해당 설명 대상인 애도 표현 및 애도 관습 목록 가까이에 두는 것이 적절합니다.
  issues:
  - severity: medium
    issue: ‘그들을 위해 머리를 민 채로 하지도’라는 표현
    rationale: ‘-한 채로 하다’는 이 문맥에서 자연스럽지 않으며, 삭발/머리를 미는 애도 행위라는 원문의 뜻을 명료하게 전달하지 못합니다.
  - severity: low
    issue: 각주 표지의 위치
    rationale: 각주 b는 ‘애도하지 않다’의 무정형 복수 동사에 관한 설명이고, 각주 a는 자기 몸을 베고 머리를 미는 애도 관습에 관한 설명이므로 각각 해당 표현 가까이에 두는 편이 독자에게 분명합니다.
  revised_text: 이 땅에서 큰 자나 작은 자나 모두 죽을 것입니다. 그들은 묻히지 않을 것이며, 아무도 그들을 위하여 애도하지도[b], 자기 몸을 베지도, 그들을 위하여 머리를 밀지도 않을 것입니다.[a]
