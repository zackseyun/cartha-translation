review_pass:
  verdict: revise
  source_fidelity: 본문의 핵심 의미는 대체로 충실합니다. 다만 히브리어의 주된 금지는 ‘들어오다’에 걸려 있고, 뒤의 부정사들은 그 잔치 참여의 목적을 나타냅니다. 현행 ‘들어가 … 먹고 마셔서는 안 됩니다’는 금지가 주로 먹고 마시는 행위에만 걸리는 것으로 읽힐 여지가 있습니다.
  naturalness: ‘잔칫집’과 ‘그들과 함께 앉아’는 자연스럽습니다. 그러나 금지문의 범위를 문장 전체에 분명히 적용하도록 ‘들어가서 … 마시지 마십시오’로 다듬는 편이 현대 한국어 합쇼체에서 더 명료합니다.
  terminology: ‘잔칫집’은 בֵּית מִשְׁתֶּה의 장소성과 잔치의 성격을 자연스럽게 전달합니다. 각주에서는 본문과 같은 표현을 대안으로 반복하지 않고, ‘축하의 집’처럼 다소 직역적인 표현은 ‘축하를 위한 집’으로 풀어 주는 편이 자연스럽습니다.
  issues:
  - severity: medium
    issue: 금지의 문법적 범위가 다소 불명확합니다.
    rationale: לֹא תָבוֹא(‘들어오지 말라’)가 주절의 금지이며, ‘앉아 먹고 마시기 위해’는 뒤따르는 목적 표현입니다. 현행 종결부는 ‘먹고 마시는 것’만을 금하는 듯하게 읽힐 수 있으므로, 입장과 참여 전체를 금하는 한국어 문장으로 조정하는 것이 좋습니다.
  - severity: low
    issue: 각주의 첫 대안이 본문 표현과 중복되고 설명 문구가 다소 부자연스럽습니다.
    rationale: 본문이 이미 ‘잔칫집’이므로 이를 ‘또는’ 아래에 다시 제시할 필요가 없습니다. ‘축제의 식사와 음료를 함께 나누는’보다 ‘잔치에서 함께 먹고 마시는’이 한국어 관용에 맞고 원문의 의미도 직접적으로 드러냅니다.
  revised_text: 그리고 너는 잔칫집에 들어가서 그들과 함께 앉아 먹고 마시지 마십시오.[a]
