  lexicon: HALOT
  rationale: 예언적 금지 명령의 규범성을 살리면서 현대 한국어에서 가장 자연스러운 금지 표현으로 옮겼습니다.
- source_word: לָשֶׁבֶת אוֹתָם
  english_pob_choice: to sit with them
  chosen_korean: 그들과 함께 앉아
  alternatives_korean:
  - 그들과 함께 자리에 앉아
  - 그들과 함께 앉아서
  - 그들과 함께 머물러
  lexicon: HALOT
  rationale: 히브리어의 ‘앉다’는 식사 자리에 참여하는 행위를 가리키므로, 단순 위치가 아니라 공동 식사에 동참하는 의미를 드러내도록 ‘함께 앉아’로 옮겼습니다.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  english_pob_choice: to eat and to drink
  chosen_korean: 먹고 마셔서는
  alternatives_korean:
  - 먹고 마시려고
  - 먹고 마시게
  - 먹고 마시도록
  lexicon: HALOT
  rationale: 두 목적 부정사 구조를 한국어에서 자연스럽게 이어 주면서도, 금지의 범위를 공동 잔치의 식음 행위까지 분명히 하도록 표현했습니다.
theological_decisions:
