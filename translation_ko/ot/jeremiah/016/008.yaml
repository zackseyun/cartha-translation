  text: And you shall not enter a house of feasting to sit with them[a], to eat and to drink.
  footnotes:
  - marker: a
    text: Or 'a banquet house' or 'a house of celebration.' The Hebrew expression refers to a place where people gather for festive eating and drinking.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 너는 잔칫집에 들어가 그들과 함께 앉아 먹고 마셔서는 안 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘잔칫집’, ‘연회장’, ‘축하의 집’. 히브리어 표현은 사람들이 축제의 식사와 음료를 함께 나누는 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֵית מִשְׁתֶּה
  english_pob_choice: a house of feasting
  chosen_korean: 잔칫집
  alternatives_korean:
  - 잔치의 집
  - 연회장
  - 축하의 집
  lexicon: HALOT
  rationale: 히브리어의 ‘집’과 ‘잔치/연회’의 결합을 한국어에서 자연스럽고 구체적으로 살리되, 단순한 추상명사보다 장소성을 보존하기 위해 ‘잔칫집’으로 옮겼습니다.
- source_word: לֹא תָבֹוא
  english_pob_choice: you shall not enter
  chosen_korean: 들어가서는 안 됩니다
  alternatives_korean:
  - 들어가면 안 됩니다
  - 들어가서는 안 되십니다
  - 들어가지 마십시오
  lexicon: HALOT
  rationale: 예언적 금지 명령의 규범성을 살리면서 현대 한국어에서 가장 자연스러운 금지 표현으로 옮겼습니다.
- source_word: לָשֶׁבֶת אוֹתָם
  english_pob_choice: to sit with them
  chosen_korean: 그들과 함께 앉아
  alternatives_korean:
  - 그들과 함께 자리에 앉아
  - 그들과 함께 앉아서
  - 그들과 함께 머물러
  lexicon: HALOT
  rationale: 히브리어의 ‘앉다’는 식사 자리에 참여하는 행위를 가리키므로, 단순 위치가 아니라 공동 식사에 동참하는 의미를 드러내도록 ‘함께 앉아’로 옮겼습니다.
- source_word: לֶאֱכֹל וְלִשְׁתּוֹת
  english_pob_choice: to eat and to drink
  chosen_korean: 먹고 마셔서는
  alternatives_korean:
  - 먹고 마시려고
  - 먹고 마시게
  - 먹고 마시도록
  lexicon: HALOT
  rationale: 두 목적 부정사 구조를 한국어에서 자연스럽게 이어 주면서도, 금지의 범위를 공동 잔치의 식음 행위까지 분명히 하도록 표현했습니다.
theological_decisions:
- issue: 예언적 금지문의 말투
  chosen_reading: 직접 명령형 대신 현대 합쇼체 금지문으로 옮겨, 예레미야에게 주어진 하나님의 금지 명령의 권위를 보존했습니다.
  alternative_readings:
  - 들어가지 마십시오
  - 들어가면 안 됩니다
  rationale: 본문은 단순한 조언이 아니라 예언 사명의 표지이므로, 구어적 완화 없이 규범적 금지를 유지하는 번역이 적절합니다.
  doctrine_reference: 예언 소명과 순종의 권위
