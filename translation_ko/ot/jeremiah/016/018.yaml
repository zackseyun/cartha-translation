id: JER.16.18
reference: Jeremiah 16:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֣י רִֽאשׁוֹנָ֗ה מִשְׁנֵ֤ה עֲוֺנָ/ם֙ וְ/חַטָּאתָ֔/ם עַ֖ל חַלְּלָ֣/ם אֶת אַרְצִ֑/י בְּ/נִבְלַ֤ת שִׁקּֽוּצֵי/הֶם֙ וְ/תוֹעֲב֣וֹתֵי/הֶ֔ם מָלְא֖וּ אֶת נַחֲלָתִֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/018.yaml
  text: And first I will repay double their iniquity and their sin[a], because they have defiled my land with the carcasses of their detestable idols and have filled my inheritance with their abominations.
  footnotes:
  - marker: a
    text: Or 'with the carcasses of their detestable things'; the Hebrew term often refers to idols in prophetic contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 내가 먼저 그들의 죄악과 그들의 죄를 갑절로 갚을 것입니다. 이는 그들이 내 땅을 그들의 가증한 우상들의 주검[a]으로 더럽히고, 그들의 가증한 것들로 내 기업을 가득 채웠기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 가증한 것들의 주검으로’; 히브리어 용어는 예언서 문맥에서 종종 우상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי / רִאשׁוֹנָה
  english_pob_choice: I will repay / first
  chosen_korean: 내가 먼저 갚을 것입니다
  alternatives_korean:
  - 내가 첫째로 갚을 것입니다
  - 내가 먼저 보응할 것입니다
  lexicon: HALOT
  rationale: שִׁלַּמְתִּי의 보복적 의미를 '갚다'로 자연스럽게 살리고, רִאשׁוֹנָה의 우선성을 '먼저'로 간결하게 옮겼습니다.
- source_word: מִשְׁנֵה
  english_pob_choice: double
  chosen_korean: 갑절로
  alternatives_korean:
  - 두 배로
  - 배로
  lexicon: HALOT
  rationale: 형벌의 중복·배상을 나타내는 표현이므로 '갑절로'가 시적이면서도 법적 보응의 뉘앙스를 살립니다.
- source_word: עֲוֺנָם וְחַטָּאתָם
  english_pob_choice: their iniquity and their sin
  chosen_korean: 그들의 죄악과 그들의 죄
  alternatives_korean:
  - 그들의 불의와 그들의 죄
  - 그들의 악행과 그들의 죄
  lexicon: HALOT
  rationale: עָוֹן과 חַטָּאת의 이중 어휘를 한국어에서도 구분해 유지하되, 합쇼체 문맥에 맞게 과도한 신학 용어화를 피했습니다.
- source_word: חַלְּלָם אֶת־אַרְצִי
  english_pob_choice: they have defiled my land
  chosen_korean: 자기의 땅을 … 더럽히고
  alternatives_korean:
  - 내 땅을 더럽히고
  - 내 땅을 욕되게 하고
  lexicon: HALOT
  rationale: חלל의 의례적·도덕적 오염을 '더럽히다'로 옮기되, 소유격은 시구의 흐름에 맞춰 '자기의 땅'으로 처리해 대상의 책임을 드러냈습니다.
- source_word: בְּנִבְלַת שִׁקּוּצֵיהֶם
  english_pob_choice: with the carcasses of their detestable idols
  chosen_korean: 그들의 가증한 우상들의 주검으로
  alternatives_korean:
  - 그들의 가증한 것들의 주검으로
  - 그들의 혐오스러운 것들의 주검으로
  lexicon: HALOT
  rationale: שִׁקּוּצִים이 예언서 문맥에서 우상을 가리키는 경우가 많아, POB의 해설을 따라 본문에서는 '우상들'을 분명히 했고 נִבְלָה는 '주검'으로 살렸습니다.
- source_word: וְתוֹעֲבוֹתֵיהֶם
  english_pob_choice: their abominations
  chosen_korean: 그들의 가증한 것들
  alternatives_korean:
  - 그들의 가증함
  - 그들의 혐오스러운 것들
  lexicon: HALOT
  rationale: 같은 어근 계열의 중복을 피하면서도 종교적 혐오 대상을 넓게 가리키는 표현을 유지하기 위해 '가증한 것들'로 옮겼습니다.
- source_word: מָלְאוּ אֶת־נַחֲלָתִי
  english_pob_choice: have filled my inheritance
  chosen_korean: 내 기업을 가득 채웠기 때문입니다
  alternatives_korean:
  - 내 상속분을 가득 채웠기 때문입니다
  - 내 유업을 채웠기 때문입니다
  lexicon: HALOT
  rationale: נַחֲלָה의 언약적 소유 개념을 한국어 성서어휘 '기업'으로 옮기되, 현대 문체에 맞춰 서술형으로 정리했습니다.
theological_decisions:
- issue: שִׁקּוּצֵיהֶם을 본문에서 우상으로 명시할지 여부
  chosen_reading: 본문에는 '가증한 우상들'로 명시했습니다.
  alternative_readings:
  - 가증한 것들
  - 가증한 것들의 주검
  rationale: 예레미야의 우상 숭배 고발 맥락에서 독자가 대상을 즉시 파악하도록 했으며, 본문상 허용되는 해석을 과도한 해설 없이 반영했습니다.
  doctrine_reference: 예언서 우상 비판의 문맥적 명시성
