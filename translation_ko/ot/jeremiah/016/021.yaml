  lexicon: HALOT
  rationale: '''גבורה''는 힘·능력·위력을 가리키므로, ''내 손''과 짝을 이루는 자연스러운 현대 한국어로 ''내 능력''을 택했습니다.'
- source_word: יְהוָה
