  lexicon: HALOT
  rationale: 하나님의 엄숙한 선언을 드러내는 감탄·지시 표현으로 '보십시오'를 택해 현대적이면서도 호소력 있는 어조를 살렸습니다.
- source_word: מוֹדִיעָם / אוֹדִיעֵם
  english_pob_choice: I am making them know ... I will make them know
  chosen_korean: 내가 그들에게 알리고 있습니다—이제 내가 그들에게 ... 알릴 것이며
