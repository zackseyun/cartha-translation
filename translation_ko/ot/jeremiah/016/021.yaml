base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
  footnotes:
  - marker: a
    text: Or 'I am making it known to them ... I will make it known to them.' The Hebrew verb is causative ('make know') and may be rendered either with a personal object ('make them know') or with an impersonal object ('make it known to them').
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my hand,' a common figure for active power.
    reason: cultural_note
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로, 보십시오. 내가 그들에게 알리겠습니다[a]—이번에는 내 손[b]과 내 능력을 그들에게 알리겠습니다. 그들이 내 이름이 야훼[c]인 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그들에게 그것을 알리겠습니다 ... 내가 그들에게 그것을 알리겠습니다.” 히브리어 동사는 사역형이며, 사람을 목적어로 하는 번역과 비인칭 목적어를 사용하는 번역이 모두 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘내 손’은 활동하는 능력을 가리키는 흔한 비유입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 יְהוָה이며, 전통적으로는 ‘주’로 옮겨 왔습니다.
    reason: alternative_reading
