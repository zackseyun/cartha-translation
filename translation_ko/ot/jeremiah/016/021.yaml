base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/021.yaml
  text: Therefore[a], behold, I am making them know—this time I will make them know my hand and my might[c][b], and they will know that my name is Yahweh.
  footnotes:
  - marker: a
    text: Or 'I am making it known to them ... I will make it known to them.' The Hebrew verb is causative ('make know') and may be rendered either with a personal object ('make them know') or with an impersonal object ('make it known to them').
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'my hand,' a common figure for active power.
    reason: cultural_note
  - marker: c
    text: Hebrew YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로[a], 보십시오, 내가 그들에게 알리고 있습니다—이제 내가 그들에게 내 손과 내 능력을 알릴 것이며[c][b], 그들은 내 이름이 야훼인 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그들에게 그것을 알리고 있습니다 ... 내가 그들에게 그것을 알릴 것입니다.” 히브리어 동사는 사역적 표현이며, 개인 목적어를 취한 번역과 비인칭 목적어를 취한 번역이 모두 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 '내 손'은 सक्रिय한 능력을 가리키는 흔한 비유입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 יְהוָה, 전통적으로는 '주'로 옮겨 왔습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
