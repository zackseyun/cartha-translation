  - 내 힘
  lexicon: HALOT
  rationale: '''손''은 פעול 능력의 비유를 직역한 것으로, 뒤의 ''능력''이 의미를 보완하므로 이미지 자체를 유지했습니다.'
- source_word: גְּבוּרָתִי
  english_pob_choice: my might
  chosen_korean: 내 능력
  alternatives_korean:
  - 내 힘
  - 내 권능
  lexicon: HALOT
  rationale: '''גבורה''는 힘·능력·위력을 가리키므로, ''내 손''과 짝을 이루는 자연스러운 현대 한국어로 ''내 능력''을 택했습니다.'
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
