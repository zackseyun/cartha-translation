  - 이러므로
  lexicon: HALOT
  rationale: 앞선 문맥의 결과를 잇는 결론 표지이므로, 격식 있는 한국어 연결어인 '그러므로'가 가장 자연스럽습니다.
- source_word: הִנְנִי
