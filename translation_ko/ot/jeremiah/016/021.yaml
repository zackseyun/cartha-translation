  rationale: 본문은 하나님의 이름 자체를 말하므로, 칭호로 대체하지 않고 고유명 표기를 유지해야 하며 프로젝트 기준에 따라 '야훼'를 사용했습니다.
  doctrine_reference: POB glossary — יהוה / YHWH → 야훼
