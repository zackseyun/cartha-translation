source:
  edition: WLC
  text: וְ/הֵטַלְתִּ֣י אֶתְ/כֶ֗ם מֵ/עַל֙ הָ/אָ֣רֶץ הַ/זֹּ֔את עַל הָ/אָ֕רֶץ אֲשֶׁר֙ לֹ֣א יְדַעְתֶּ֔ם אַתֶּ֖ם וַ/אֲבֽוֹתֵי/כֶ֑ם וַ/עֲבַדְתֶּם שָׁ֞ם אֶת אֱלֹהִ֤ים אֲחֵרִים֙ יוֹמָ֣ם וָ/לַ֔יְלָה אֲשֶׁ֛ר לֹֽא אֶתֵּ֥ן לָ/כֶ֖ם חֲנִינָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/013.yaml
  text: So I will cast you out from this land onto a land that neither you nor your fathers have known[a], and there you will serve other gods day and night[d][c][b], for I will show you no favor.
  footnotes:
  - marker: a
    text: Or 'cast you' or 'throw you.' The Hebrew verb is forceful, describing violent expulsion from the land.
    reason: lexical_alternative
  - marker: b
    text: 'Or ''your ancestors.'' Hebrew: ''your fathers.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'worship other gods.' The Hebrew verb commonly means 'serve' and can include worshipful service.
    reason: lexical_alternative
  - marker: d
    text: Or 'for I will grant you no grace/mercy.' The Hebrew noun denotes favor or graciousness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 내가 너희를 이 땅에서 쫓아내어 너희도 너희 조상도 알지 못하던 땅으로 보내겠습니다. 거기서 너희는 낮이든 밤이든 다른 신들을 섬길 것이지만, 내가 너희에게는 은총을 베풀지 않겠습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내던지다’, ‘던져 버리다’. 히브리어 동사는 강한 폭력성과 추방의 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아버지들’, 곧 ‘조상들’. 히브리어는 직역하면 ‘너희의 아버지들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다른 신들을 예배하다’. 히브리어 동사 עבד는 ‘섬기다’뿐 아니라 예배 행위를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내가 너희에게 은혜/자비를 베풀지 않겠다’. 히브리어 명사는 호의, 은총, 자비를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵטַלְתִּי
  english_pob_choice: I will cast you out
  chosen_korean: 내가 너희를 이 땅에서 쫓아내어
  alternatives_korean:
  - 내가 너희를 내던져
  - 내가 너희를 밖으로 던져
  lexicon: HALOT
  rationale: 히필형의 강한 추방 의미를 살리기 위해 단순한 ‘보내다’보다 폭력적·단호한 ‘쫓아내다’를 택했습니다.
- source_word: מֵעַל הָאָרֶץ הַזֹּאת / עַל הָאָרֶץ
  english_pob_choice: from this land / onto a land
  chosen_korean: 이 땅에서 … 땅으로
  alternatives_korean:
  - 이 땅 위에서 … 그 땅 위로
  - 이 땅 밖에서 … 그 땅 안으로
  lexicon: HALOT
  rationale: ‘from … onto …’의 대조를 한국어로 자연스럽게 살리면서, 언약적 토지 개념을 ‘땅’으로 유지했습니다.
- source_word: וַאֲבוֹתֵיכֶם
  english_pob_choice: your fathers
  chosen_korean: 너희 조상도
  alternatives_korean:
  - 너희 아버지도
  - 너희 선조도
  lexicon: HALOT
  rationale: 히브리어의 직역은 ‘너희 아버지들’이지만, 한국어에서는 문맥상 ‘조상’이 의미를 더 분명하게 전달하므로 이를 택했습니다. 다만 남성 복수 친족 표현의 역사적 어감을 완화하지 않도록 주의했습니다.
- source_word: וַעֲבַדְתֶּם שָׁם אֶת אֱלֹהִים אֲחֵרִים
  english_pob_choice: and there you will serve other gods
  chosen_korean: 거기서 너희는 … 다른 신들을 섬길 것이지만
  alternatives_korean:
  - 거기서 너희는 … 다른 신들을 예배할 것이지만
  - 거기서 너희는 … 다른 신들을 섬기게 될 것이지만
  lexicon: HALOT
  rationale: עבד의 기본 뜻을 따라 ‘섬기다’를 유지해, 우상 숭배를 넓은 ‘봉사/예배’보다 직접적으로 드러냈습니다.
- source_word: אֲשֶׁר לֹא אֶתֵּן לָכֶם חֲנִינָה
  english_pob_choice: for I will show you no favor
  chosen_korean: 내가 너희에게는 은총을 베풀지 않겠습니다
  alternatives_korean:
  - 내가 너희에게는 호의를 보이지 않겠습니다
  - 내가 너희에게는 은혜를 주지 않겠습니다
  lexicon: HALOT
  rationale: חֲנִינָה는 ‘호의/은총/자비’ 범위를 가지므로, 한국어에서 심판 맥락에 잘 맞는 ‘은총을 베풀다’를 택했습니다.
theological_decisions:
- issue: 예언적 심판 선언의 종결 어조
  chosen_reading: ‘…베풀지 않겠습니다’처럼 미래형 종결을 유지해, 야훼의 단호한 심판 선언으로 읽히게 했습니다.
  alternative_readings:
  - ‘…베풀지 않을 것입니다’
  - ‘…베풀지 않으리라’
  rationale: 히브리어의 예언적 단언을 현대 한국어에서 직접적이고 공적 문체로 전달하기 위해 합쇼체 미래 부정으로 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
- issue: ‘섬기다’의 신학적 중의성
  chosen_reading: ‘다른 신들을 섬기다’로 유지해, 강제된 예속과 종교적 예배의 이중 가능성을 모두 남겼습니다.
  alternative_readings:
  - ‘다른 신들을 예배하다’
  - ‘다른 신들을 섬기며 살다’
  rationale: 본문은 포로지에서의 우상 숭배를 말하지만, עבד는 단순 예배보다 넓은 ‘섬김’도 포함하므로 신학적 긴장을 보존하는 쪽이 더 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
