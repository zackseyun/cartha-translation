review_pass:
  verdict: revise
  source_fidelity: 첫머리의 ‘그러므로’는 히브리어 본문에 없고, ‘것이지만’은 본문의 인과 관계를 근거 없는 역접으로 바꿉니다. 또한 וְהֵטַלְתִּי의 강제적·폭력적 추방의 뉘앙스는 ‘쫓아내어 … 보내겠습니다’보다 ‘내쫓아 … 내던지겠습니다’에서 더 잘 드러납니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘낮과 밤에’는 יוֹמָם וָלַיְלָה의 시간 표현을 직역적으로 유지하며, 마지막 절은 ‘이는’으로 자연스러운 인과 관계를 드러냅니다.
  terminology: ‘다른 신들을 섬기다’는 עבד의 폭넓은 의미를 보존합니다. ‘조상들’은 한국어에서 문맥상 자연스럽지만, 히브리어의 ‘아버지들’이라는 표현은 각주에서 밝혀야 합니다. חֲנִינָה는 신학적 전문어로 좁히지 않고 ‘은총’으로 옮기되 ‘호의/자비’의 대안을 각주로 보완합니다.
  issues:
  - severity: medium
    issue: 본문에 없는 ‘그러므로’가 추가되었습니다.
    rationale: וְהֵטַלְתִּי는 단순 접속사 וְ로 시작하며, 이 절 자체에는 ‘그러므로’라는 결론 표지가 없습니다.
  - severity: high
    issue: ‘섬길 것이지만’이 인과 관계를 역접 관계로 바꿉니다.
    rationale: 마지막 אֲשֶׁר 절은 문맥상 ‘이는/왜냐하면 내가 너희에게 호의를 베풀지 않을 것이기 때문이다’라는 인과적 설명이며, ‘하지만’은 원문에 없는 대조를 도입합니다.
  - severity: medium
    issue: ‘쫓아내어 … 보내겠습니다’는 הֵטַלְתִּי의 강한 투척·강제 추방의 어감을 약화합니다.
    rationale: ‘내쫓아 … 내던지겠습니다’는 출발지와 도착지의 방향성을 한국어로 자연스럽게 연결하면서 강제성을 보존합니다.
  - severity: low
    issue: 각주 표지가 모두 문장 끝에 몰려 있어 각주 대상이 불명확합니다.
    rationale: 각 표지는 해당 어휘 또는 구절 바로 뒤에 두어 독자가 대안 번역의 대상을 분명히 알 수 있게 해야 합니다.
  revised_text: 내가 너희를 이 땅에서 내쫓아, 너희와 너희 조상들이 알지 못한 땅으로 내던지겠습니다.[a] 거기서 너희는 낮과 밤에 다른 신들을 섬길 것이며,[c] 이는 내가 너희에게 은총을 베풀지 않겠기 때문입니다.[d]
  revised_footnotes:
  - marker: a
    text: 또는 ‘내던지다’, ‘던져 버리다’. 히브리어 동사는 강한 힘으로 내던져 추방하는 뉘앙스를 지닙니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아버지들’. 히브리어는 직역하면 ‘너희의 아버지들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다른 신들을 예배하다’. 히브리어 동사 עבד는 ‘섬기다’라는 뜻이며 예배의 행위도 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내가 너희에게 호의/은혜/자비를 베풀지 않겠다’. 히브리어 명사는 호의나 은총, 자비를 뜻합니다.
    reason: lexical_alternative
  revision_rationale: 원문에 없는 접속·역접을 제거하고, 강제적 추방, 포로지에서 다른 신들을 섬김, 그리고 신적 호의의 철회라는 원문의 흐름을 보존했습니다. 다만 ‘조상들’은 번역문에 자연스럽게 유지하되, 히브리어의 문자적 표현은 각주 b로 제시합니다. 각주 b는 본문에 별도 표지를 붙일 필요 없이 ‘조상들’에 관한 번역 대안으로 제공됩니다.
