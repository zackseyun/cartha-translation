  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언적 선포 공식은 한국어 성경 문체에서 익숙한 종결 형식을 살리되, 본문의 출처 표지를 분명히 했습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 아들들
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 남성복수 ‘아들들’을 평준화하지 않고 보존했습니다. POB의 gender-accurate 방침에 맞춥니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 이집트 땅에서
