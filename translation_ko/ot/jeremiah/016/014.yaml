theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 신명사 הווה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 고유한 언약명은 ‘야훼’로 유지하여 본문의 직접성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘야훼께서 살아 계신다’라는 맹세 공식
  chosen_reading: 현재형 맹세 표현을 그대로 살렸습니다.
  alternative_readings:
  - 야훼의 이름으로
  - 살아 계신 야훼께서
  rationale: 히브리어의 고정된 맹세 관용구를 완화하지 않고, 이전에 통용되던 출애굽 맥락의 맹세 형식을 보존했습니다.
  doctrine_reference: 출애굽 서사에 연결되는 서약/맹세 공식 보존
