  lexicon: HALOT
  rationale: 미래 임박을 알리는 관용구를 직역에 가깝게 살리되, 문장 흐름에 맞게 연결했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
