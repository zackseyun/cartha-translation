source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹֽא יֵאָמֵ֥ר עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/014.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when it will no longer be said, ‘As Yahweh lives[b], who brought up the sons of Israel from the land of Egypt,’
  footnotes:
  - marker: a
    text: Or, more idiomatically, “the Israelites” or “the people of Israel.” The Hebrew reads “the sons of Israel.”
    reason: lexical_alternative
  - marker: b
    text: “Who brought up” may also be rendered “who brought out,” referring to the exodus from Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오. 야훼의 말씀이니라. 날들이 올 것이며, 그때에는 더 이상 “야훼께서 살아 계신다, 곧 이집트 땅에서 이스라엘의 아들들을 올라오게 하신 분”이라고 말하지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “이스라엘의 아들들”입니다. 더 자연스럽게는 “이스라엘 사람들” 또는 “이스라엘 백성들”이라고 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “올라오게 하신”은 출애굽을 가리키는 표현으로, 문맥상 “이끌어 내신”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
