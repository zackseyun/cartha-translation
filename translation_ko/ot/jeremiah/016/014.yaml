  lexicon: HALOT
  rationale: ‘땅’의 포함과 출애굽 관용구의 공간감을 살렸습니다.
- source_word: הֶעֱלָה
  english_pob_choice: who brought up
  chosen_korean: 올라오게 하신 분
  alternatives_korean:
