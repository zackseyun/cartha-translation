lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And ... came
  chosen_korean: 임하여
  alternatives_korean:
  - 있었습니다
  - 오셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 예언서의 전형적인 도입 공식으로서 ‘말씀이 … 임하다’가 한국어로 가장 자연스럽고 원문의 사건 개시 기능을 잘 살립니다.
- source_word: דְבַר
  english_pob_choice: the word
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 메시지
  lexicon: HALOT
  rationale: 예언적 공식인 ‘여호와의 말씀’에 해당하므로, 원문의 정형 표현을 살려 ‘말씀’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문의 고유한 신명 יהוה를 본문에서 ‘야훼’로 옮겨, POB의 स्रोत-직역 원칙과 신명 보존을 따랐습니다.
- source_word: אֵלַי
  english_pob_choice: to me
  chosen_korean: 나에게
  alternatives_korean:
  - 내게
  - 저에게
  lexicon: HALOT
  rationale: 1인칭 단수 목적어를 현대 한국어로 자연스럽게 풀어 ‘나에게’로 옮겼습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 말씀하셨습니다
  alternatives_korean:
  - 말하여 이르시되
  - 말씀하여 이르시기를
  lexicon: HALOT
  rationale: 직접화법 도입 표지로 기능하므로, 뒤따를 발화 내용을 예고하는 형태를 살려 끝을 자연스럽게 정리했습니다.
theological_decisions:
- issue: 예언 공식을 한국어에서 어떻게 보존할 것인가
  chosen_reading: ‘야훼의 말씀이 나에게 임하여 말씀하셨습니다’로 옮겨, 신적 발화의 도입 공식을 유지했습니다.
  alternative_readings:
  - ‘야훼의 말씀이 나에게 이르러 말씀하시기를’
  - ‘야훼의 말씀이 내게 임했습니다’
  rationale: 히브리어는 여호와의 말씀 도입과 직접 발화를 결합한 예언 공식이므로, 이를 평이하게 줄이기보다 원문의 형식을 드러내는 쪽이 본문의 권위를 더 잘 보존합니다.
  doctrine_reference: 예언자적 계시의 매개와 신적 발화의 직접성
