revisions:
- from: 그러나, 「야훼께서 살아 계심을 두고 맹세합니다. 그는 이스라엘 자손을 북방의 땅과 그가 그들을 쫓아내신 모든 땅에서 올라오게 하신 분입니다. 나는 그들을 그들의 조상들에게 주었던 그들의 땅으로 다시 데려오겠습니다」라고 하십니다.[a][b]
  to: 그러나 ‘이스라엘 자손을 북쪽 땅과 그분이 그들을 쫓아내신 모든 땅에서 이끌어 올리신 야훼께서 살아 계심을 두고’라고 맹세하게 될 것입니다.[a] 내가 그들을 그들의 아버지들에게 준 그들의 땅으로 돌아오게 하겠습니다.[b]
  rationale: 인용된 맹세 공식의 구조를 회복하고, 야훼의 1인칭 회복 약속을 분리했습니다. ‘이끌어 올리신’, ‘쫓아내신’, ‘돌아오게 하겠습니다’로 원문의 동사 의미를 보존했으며, ‘아버지들’로 원문의 명시적 표현을 유지했습니다.
