  source_fidelity: 현 초안은 חַי יְהוָה를 ‘야훼께서 살아 계심을 두고 맹세합니다’로 풀면서, 인용된 맹세 공식과 뒤따르는 야훼의 1인칭 약속을 하나의 발화로 섞었습니다. 또한 ‘그는 … 분입니다’와 ‘나는 … 데려오겠습니다’의 화자 전환은 원문의 구문을 흐립니다. 원문에서 북방과 모든 땅에서 ‘이끌어 올리신’ 분은 야훼이며, ‘내가 … 돌아오게 하겠다’는 야훼의 직접 약속입니다.
  naturalness: 합쇼체에서는 인용 맹세 공식을 ‘…라고 맹세하게 될 것입니다’로 처리하고, 이어지는 신적 약속을 별문장으로 두는 것이 자연스럽고 명료합니다. ‘북방의 땅’보다 ‘북쪽 땅’이 현대 표준어에서 더 자연스럽습니다.
  terminology: 야훼는 프로젝트 방침에 맞습니다. הֶעֱלָה의 출애굽·회복 어감을 ‘이끌어 올리신’으로 보존했습니다. לַאֲבוֹתָם는 원문의 남성형 및 언약적 지시를 반영하여 ‘그들의 아버지들에게’로 옮겼습니다.
