base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/015.yaml
  text: but[a], ‘As Yahweh lives[b], who brought up the children of Israel from the land of the north and from all the lands where he had driven them.’ For I will bring them back to their own land that I gave to their fathers.
  footnotes:
  - marker: a
    text: Or 'rather' / 'but rather' at the start of the verse; the Hebrew idiom marks contrast with the preceding statement in v. 14.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their fathers'; alternatively 'their ancestors.' The main text keeps the masculine covenantal wording of the source.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 ‘이스라엘 자손을 북쪽 땅과 그분이 그들을 쫓아내신 모든 땅에서 이끌어 올리신 야훼께서 살아 계심을 두고’라고 맹세하게 될 것입니다.[a] 내가 그들을 그들의 아버지들에게 준 그들의 땅으로 돌아오게 하겠습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그러나’는 앞절과의 대비를 나타내는 히브리어 관용구 כִּי אִם을 옮긴 것입니다. 이 맹세 공식은 14절의 ‘…라고 맹세할 것이다’에 이어집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들의 아버지들’이라고 합니다. ‘그들의 조상들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: but
  chosen_korean: 그러나
  alternatives_korean:
  - 오히려
  - 그러나 오히려
  - 대신
  lexicon: HALOT
  rationale: 문맥상 14절의 부정과 대비되는 전환이므로, 한국어에서는 자연스러운 역접 접속어 ‘그러나’로 옮겨 대비를 살렸습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶으로 맹세합니다
  lexicon: HALOT
  rationale: 히브리어의 관용적인 맹세 표현을 직설적으로 살려, 단순 진술보다 맹세적 기능이 드러나도록 옮겼습니다.
- source_word: הֶעֱלָה
  english_pob_choice: brought up
  chosen_korean: 올라오게 하신
  alternatives_korean:
  - 데리고 올라오신
  - 이끌어 올리신
  lexicon: HALOT
  rationale: 출애굽·회복의 ‘올라오다’ 어감을 살리기 위해 ‘올라오게 하신’으로 번역했습니다.
- source_word: הִדִּיחָם
  english_pob_choice: he had driven them
  chosen_korean: 그들을 쫓아내신
  alternatives_korean:
  - 그들을 내쫓으신
  - 그들을 흩으신
  lexicon: HALOT
  rationale: 단순한 흩어짐보다 강제적 추방의 힘을 보존하기 위해 ‘쫓아내신’을 선택했습니다.
- source_word: וַהֲשִׁבֹתִים
  english_pob_choice: for I will bring them back
  chosen_korean: 나는 그들을 ... 다시 데려오겠습니다
  alternatives_korean:
  - 나는 그들을 다시 돌이키겠습니다
  - 나는 그들을 다시 돌아오게 하겠습니다
  lexicon: HALOT
  rationale: 반환·회복의 뜻을 한국어에서 자연스럽고 분명하게 전달하기 위해 ‘다시 데려오겠습니다’로 옮겼습니다.
- source_word: לַאֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들에게
  alternatives_korean:
  - 그들의 아버지들에게
  - 그들의 선조들에게
  lexicon: HALOT
  rationale: 직역의 ‘아버지들’보다, 언약 맥락에서 동일하게 중요하면서도 한국어에서 더 자연스러운 ‘조상들’로 옮겼습니다.
theological_decisions:
- issue: YHWH divine name rendering
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 원칙에 따라 여호와 대신 학술적 표기 ‘야훼’를 사용해 언약적 신명(神名)을 직접 드러냈습니다.
  doctrine_reference: Contested terms — יְהוָה / YHWH → 야훼
- issue: Covenantal paternal reference לַאֲבוֹתָם
  chosen_reading: 그들의 조상들에게
  alternative_readings:
  - 그들의 아버지들에게
  rationale: 본문의 남성형 혈통 언어를 완전히 지우지 않으면서도, 한국어 독자에게 언약적 조상 지시를 분명히 전달하기 위해 ‘조상들’로 옮겼습니다.
  doctrine_reference: Translation philosophy §4
