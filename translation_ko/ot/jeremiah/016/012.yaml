id: JER.16.12
reference: Jeremiah 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַתֶּ֛ם הֲרֵעֹתֶ֥ם לַ/עֲשׂ֖וֹת מֵ/אֲבֽוֹתֵי/כֶ֑ם וְ/הִנְּ/כֶ֣ם הֹלְכִ֗ים אִ֚ישׁ אַֽחֲרֵי֙ שְׁרִר֣וּת לִבּֽ/וֹ הָ/רָ֔ע לְ/בִלְתִּ֖י שְׁמֹ֥עַ אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/012.yaml
  text: But you have done worse than your fathers[a], and look, each of you is walking after the stubbornness of his evil heart[c][b], refusing to listen to me.
  footnotes:
  - marker: a
    text: Or 'have acted more wickedly than your fathers.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man,' used distributively for the people as a whole.
    reason: lexical_alternative
  - marker: c
    text: Or 'after the stubborn imagination of his evil heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희는 너희 조상들보다 더 악하게 행하였습니다[a]. 보십시오, 너희 각 사람[b]은 자기 악한 마음의 완고함[c]을 따라 걸어가면서, 나에게 듣지 않으려 합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희 조상들보다 더 악하게 행하였습니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘각 사람’은 백성 전체를 분배적으로 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘자기 악한 마음의 완고한 상상.’
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲרֵעֹתֶם לַעֲשׂוֹת
  english_pob_choice: have done worse
  chosen_korean: 더 악하게 행하였습니다
  alternatives_korean:
  - 너희 조상들보다 더 악을 행하였습니다
  - 너희 조상들보다 더 사악하게 행동하였습니다
  lexicon: HALOT
  rationale: 히필 비교 구문으로서 단순한 ‘나쁨’이 아니라 이전 세대보다 더 심한 악행을 뜻하므로, 현대 한국어에서는 ‘더 악하게 행하다’가 비교와 도덕성을 함께 살립니다.
- source_word: מֵאֲבוֹתֵיכֶם
  english_pob_choice: than your fathers
  chosen_korean: 너희 조상들보다
  alternatives_korean:
  - 너희 아버지들보다
  - 너희 선조들보다
  lexicon: HALOT
  rationale: 예언서의 관용적 비교 표현에서 אָבוֹת는 전대(前代)를 가리키므로 ‘조상들’이 자연스럽고, 성별을 과도하게 좁히지 않으면서도 원문의 혈연-역사적 뉘앙스를 유지합니다.
- source_word: וְהִנְכֶם
  english_pob_choice: and look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  - 보아라
  lexicon: HALOT
  rationale: 주의를 끄는 הנה의 감탄·지시 기능을 현대 합쇼체에서 가장 자연스럽게 살리는 표현으로 ‘보십시오’를 택했습니다.
- source_word: אִישׁ אַחֲרֵי
  english_pob_choice: each of you ... after
  chosen_korean: 너희 각 사람은 ...을 따라
  alternatives_korean:
  - 각자 ...을 따라
  - 각 사람이 ...을 따라
  lexicon: HALOT
  rationale: אִישׁ은 여기서 집합적 청중을 개별화하는 분배적 용법이므로, 남성 한정이 아니라 ‘각 사람’으로 옮겨 전체 백성을 개별적으로 겨냥하는 힘을 보존했습니다.
- source_word: שְׁרִרוּת לִבּוֹ הָרָע
  english_pob_choice: the stubbornness of his evil heart
  chosen_korean: 자기 악한 마음의 완고함
  alternatives_korean:
  - 자기 악한 마음의 고집
  - 자기 악한 심장의 완고함
  - 자기 악한 마음의 제멋대로 굳음
  lexicon: HALOT
  rationale: שְׁרִרוּת는 예레미야에서 자기 뜻을 굽히지 않는 완고함을 뜻하므로 ‘완고함’이 가장 직접적이며, ‘마음’은 히브리적 인간 이해를 보존합니다.
- source_word: לְבִלְתִּי שְׁמֹעַ אֵלַי
  english_pob_choice: refusing to listen to me
  chosen_korean: 나에게 듣지 않으려 합니다
  alternatives_korean:
  - 나에게 듣지 않으려고 합니다
  - 나에게 들으려 하지 않습니다
  - 나에게 순종하지 않으려 합니다
  lexicon: HALOT
  rationale: לְבִלְתִּי+부정 부정사 구조가 단순 비청취가 아니라 의지적 거부를 나타내므로, ‘듣지 않으려 합니다’가 원문의 거부 의도를 자연스럽게 드러냅니다.
theological_decisions:
- issue: 예언자적 책망의 직접성
  chosen_reading: ‘보십시오’와 현재진행적 ‘걸어가면서’로, 지금 이 순간 드러난 백성의 상태를 꾸짖는 어조를 살렸습니다.
  alternative_readings:
  - 더 중립적인 서술형
  - ‘보라’처럼 더 고어적인 호격
  rationale: 본문은 단순 과거 비난이 아니라 현재의 완고한 행위를 지적하는 책망이므로, 독자에게 즉시성을 느끼게 하는 표현이 본문 기능에 맞습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
