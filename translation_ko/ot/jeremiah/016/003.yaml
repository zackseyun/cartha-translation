    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 출산하는’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 사역형 동사를 사용합니다. 또는 ‘그들을 낳은 아버지들’.
