  lexicon: HALOT
  rationale: 히브리어가 남성과 여성을 분명히 병렬하므로, 일반화한 ‘자녀들’보다 성별 대칭을 드러냈습니다.
- source_word: הַיִּלּוֹדִים בַּמָּקוֹם הַזֶּה
  english_pob_choice: born in this place
  chosen_korean: 이곳에서 태어난
  alternatives_korean:
  - 이곳에서 난
  - 이곳에서 출생한
  lexicon: HALOT
  rationale: 수동적 의미를 자연스럽게 살려 ‘태어난’으로 옮겼고, ‘이곳’은 장소 지시를 간결하게 반영합니다.
- source_word: אִמֹּתָם הַיֹּלְדוֹת אוֹתָם
  english_pob_choice: their mothers who bear them
  chosen_korean: 그들의 어머니들, 곧 그들을 낳는 이들
  alternatives_korean:
