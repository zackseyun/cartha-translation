  text: '이는 야훼께서 이곳에서 태어난 아들들과 딸들[a], 그들을 낳는 그들의 어머니들[b], 그리고 이 땅에서 그들을 낳게 한 그들의 아버지들[c]에 관하여 이렇게 말씀하십니다:'
  philosophy: optimal-equivalence
  footnotes:
