base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/003.yaml
  text: 'For thus says Yahweh concerning the sons and the daughters born in this place[a], and concerning their mothers who bear them[c][b], and their fathers who father them in this land:'
  footnotes:
  - marker: a
    text: Hebrew 'sons and daughters,' explicitly naming both males and females rather than using a generic term for children.
    reason: lexical_alternative
  - marker: b
    text: Or 'who give birth to them.'
    reason: lexical_alternative
  - marker: c
    text: Or 'who beget them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이처럼 말씀하십니다. 이곳에서 태어난 아들들과 딸들과 그들의 어머니들, 곧 그들을 낳는 이들, 그리고 이 땅에서 그들을 낳는 그들의 아버지들에 관하여입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아들들과 딸들’을 분명히 병렬로 말하여, 포괄적 ‘자녀들’로 뭉개지지 않게 합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘낳는’은 어머니의 출산 행위를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 아버지에게 적용된 히필 분사는 문자적으로는 ‘낳게 하는/낳는’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이처럼 말씀하십니다
