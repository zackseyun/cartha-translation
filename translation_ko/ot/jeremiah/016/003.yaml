  - 야훼께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 격식을 살리되, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: הַבָּנִים וְהַבָּנוֹת
  english_pob_choice: the sons and the daughters
  chosen_korean: 아들들과 딸들
