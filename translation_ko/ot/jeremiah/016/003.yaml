  - 그들을 낳아 주는 그들의 어머니들
  lexicon: HALOT
  rationale: ‘낳는’으로 산모의 출산 행위를 직접 반영하되, 한국어 어순상 설명구를 덧붙여 관계를 분명히 했습니다.
- source_word: אֲבוֹתָם הַמּוֹלִדִים אוֹתָם
  english_pob_choice: their fathers who father them
  chosen_korean: 그들의 아버지들, 곧 이 땅에서 그들을 낳는
  alternatives_korean:
  - 그들의 아버지들, 곧 그들을 낳게 하는
  - 그들의 아버지들, 곧 그들을 낳은
  lexicon: HALOT
  rationale: 히필 분사의 원인적 의미를 직역하기보다, 한국어에서 자연스럽고 책임 주체를 드러내는 ‘낳는’으로 옮겼습니다.
- source_word: בָּאָרֶץ הַזֹּאת
  english_pob_choice: in this land
  chosen_korean: 이 땅에서
  alternatives_korean:
  - 이 나라에서
  - 이 땅 안에서
  lexicon: HALOT
  rationale: אָרֶץ의 언약적·지리적 의미를 살려 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 예언자 전언 공식에서의 존칭과 문체
  chosen_reading: 하나님에 대한 직접 화법은 ‘말씀하십니다’로 존중을 유지하고, 예언 인용문이 아니라 서술문 전체를 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘말씀하시느니라’의 고전적 문체
  - 인용문을 낮은 문체로 전환하는 방식
  rationale: 현대 표준어 본문으로 읽히면서도, 원문의 공식적 선포성을 약화시키지 않기 위한 선택입니다.
  doctrine_reference: POB Korean style guide; prophetic speech register
- issue: ‘아들들과 딸들’의 성별 병렬 유지
  chosen_reading: 포괄적 ‘자녀들’ 대신 성별을 분명히 드러내는 병렬을 유지했습니다.
  alternative_readings:
  - 자녀들
  - 남녀의 자녀들
  rationale: 히브리어 원문은 단순한 총칭이 아니라 남녀를 모두 명시하므로, 그 대칭성을 보존하는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: Source-text fidelity / lexical transparency
