  to: 보십시오, 내가 많은 어부들을 보내겠습니다. 야훼의 말씀입니다. 그들이 그들을 잡을 것입니다. 그 후에 내가 많은 사냥꾼들을 보내겠습니다. 그들이 모든 산에서, 모든 언덕에서, 또 바위 틈에서 그들을 사냥할 것입니다.[a][b]
  rationale: 사냥 동사를 원문의 능동 미래형에 맞추어 ‘사냥할 것입니다’로 고치고, 어부의 포획 동사는 과도한 뉘앙스를 피하여 ‘잡을 것입니다’로 옮겼습니다. 산·언덕·바위 틈의 반복된 출처 표현도 한국어에서 명시했습니다. 각주 b는 행위자와 대상의 문법적 혼동을 제거하면서, 본문의 해석상 열려 있는 부분을 유지합니다.
