id: JER.16.16
reference: Jeremiah 16:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנְ/נִ֨י שֹׁלֵ֜חַ ל/דוגים רַבִּ֛ים נְאֻם יְהוָ֖ה וְ/דִיג֑וּ/ם וְ/אַֽחֲרֵי כֵ֗ן אֶשְׁלַח֙ לְ/רַבִּ֣ים צַיָּדִ֔ים וְ/צָד֞וּ/ם מֵ/עַ֤ל כָּל הַר֙ וּ/מֵ/עַ֣ל כָּל גִּבְעָ֔ה וּ/מִ/נְּקִיקֵ֖י הַ/סְּלָעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/016.yaml
  text: Look[a], I am sending for many fishermen, declares Yahweh, and they will catch them; and after that I will send for many hunters[b], and they will hunt them from every mountain and from every hill and from the clefts of the rocks.
  footnotes:
  - marker: a
    text: Or 'many fishers.'
    reason: lexical_alternative
  - marker: b
    text: The imagery of fishermen and hunters portrays people being sought out and seized from every hiding place; the verse itself does not explicitly identify the agents beyond those sent by the LORD.
    reason: cultural_note
translation:
  language: ko
  text: 보십시오, 내가 많은 어부들을 보내겠습니다. 야훼의 말씀입니다. 그들이 그들을 낚아챌 것입니다. 그 후에 내가 많은 사냥꾼들을 보내어, 그들이 모든 산과 모든 언덕과 바위 틈에서 그들을 사냥하게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어부들’은 ‘고기잡이하는 사람들’이라는 뜻의 다른 번역도 가능합니다.
    reason: lexical_alternative
  - marker: b
    text: 어부와 사냥꾼의 이미지는 사람들을 여러 숨는 곳에서 찾아내 붙잡는 행위를 묘사하며, 본문은 그 대상을 야훼가 보낸 자들 외에 더 구체적으로 밝히지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look, I
  chosen_korean: 보십시오, 내가
  alternatives_korean:
  - 보라, 내가
  - 이제 내가
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 끄는 지시어를 현대 한국어에서 자연스럽게 살리면서도, 뒤이은 동사와 연결되는 즉시성을 유지했습니다.
- source_word: דּוֹגִים / לְדוגים רַבִּים
  english_pob_choice: many fishermen
  chosen_korean: 많은 어부들
  alternatives_korean:
  - 많은 낚시꾼들
  - 많은 고기잡이꾼들
  lexicon: HALOT
  rationale: 어부가 현대 한국어에서 가장 자연스러운 직업명이며, 히브리어의 구체적 이미지도 충분히 보존합니다.
- source_word: וְדִיגוּם
  english_pob_choice: and they will catch them
  chosen_korean: 그들이 그들을 낚아챌 것입니다
  alternatives_korean:
  - 그들이 그들을 잡을 것입니다
  - 그들이 그들을 낚을 것입니다
  lexicon: HALOT
  rationale: 단순한 '잡다'보다 어망으로 끌어오는 포획 이미지를 살리면서, 대상 인칭대명사 '그들을'을 유지해 원문의 객체를 분명히 했습니다.
- source_word: צַיָּדִים
  english_pob_choice: many hunters
  chosen_korean: 많은 사냥꾼들
  alternatives_korean:
  - 많은 추적자들
  - 많은 사냥군들
  lexicon: HALOT
  rationale: 어부와 대구를 이루는 구체적 이미지이므로 추상화하지 않고 '사냥꾼들'로 옮겼습니다.
- source_word: וְצָדוּם
  english_pob_choice: and they will hunt them
  chosen_korean: 그들이 그들을 사냥하게 하겠습니다
  alternatives_korean:
  - 그들이 그들을 잡게 하겠습니다
  - 그들이 그들을 추적하게 하겠습니다
  lexicon: HALOT
  rationale: 히브리어의 사냥 은유를 그대로 살리되, 한국어 문맥에서 목적어를 분명히 드러내기 위해 사역형으로 표현했습니다.
- source_word: מֵעַל כָּל הַר וּמֵעַל כָּל גִּבְעָה וּמִנְּקִיקֵי הַסְּלָעִים
  english_pob_choice: from every mountain and from every hill and from the clefts of the rocks
  chosen_korean: 모든 산과 모든 언덕과 바위 틈에서
  alternatives_korean:
  - 모든 산과 모든 언덕과 바위의 틈에서
  - 모든 산 위와 모든 언덕 위와 바위의 갈라진 틈에서
  lexicon: HALOT
  rationale: 반복되는 전치사 구조를 한국어에서는 장소 출처로 묶어 자연스럽게 옮기되, 숨은 곳까지 포괄하는 열거의 폭을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 직역보다 고유명 표기를 우선하는 프로젝트 원칙에 따라 '야훼'로 옮겼습니다. 예언자 발화의 권위를 유지하면서도, 번역이 본문을 주석적으로 완화하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 사냥꾼/어부 은유의 해석 범위
  chosen_reading: 구체적 이미지(어부·사냥꾼)를 유지하고 대상은 '그들'로 남겨 두었습니다.
  alternative_readings:
  - 침략자들을 뜻한다고 명시
  - 포로를 모으는 자들로 명시
  rationale: 원문은 포획의 은유를 쓰지만 그 정체를 본문 자체에서 규정하지 않으므로, 해석을 앞서지 않고 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
