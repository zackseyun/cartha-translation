    rationale: 원문 동사는 문자적으로 나누다/떼다이지만 목적어가 생략되어 있고 상례 식사 관습을 가리키는 것으로 이해됩니다. 본문에서는 ‘음식을 나누어 주다’가 자연스럽고, 문자적 이미지는 각주에 남기는 것이 안전합니다.
