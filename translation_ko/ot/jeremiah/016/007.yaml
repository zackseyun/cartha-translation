revisions:
- from: 그들이 애곡하는 중에 그들에게 떡을 떼어 주어 죽은 이를 위로하지도 않고, 그들의 아버지나 어머니를 위하여 위로의 잔을 마시게 하지도 않을 것입니다.[a][b]
  to: 상중에 그들에게 음식을 나누어 주어 죽은 이 때문에 그들을 위로하는 사람도 없고, 그들 각자의 아버지나 어머니 때문에 그들에게 위로의 잔[a]을 마시게 하는 사람도 없을 것입니다.[b]
  rationale: 죽은 이를 위로한다는 역전된 의미를 바로잡고, 원문의 단수 소유 접미사가 지닌 분배적 관계를 ‘그들 각자의’로 보존했습니다. 또한 상례 음식 관습은 본문에서 자연스럽게 번역하고, 문자적 ‘떼다/나누다’는 각주로 처리했습니다. 각주 표지는 각각 해당 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
