id: JER.16.7
reference: Jeremiah 16:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹֽא יִפְרְס֥וּ לָ/הֶ֛ם עַל אֵ֖בֶל לְ/נַחֲמ֣/וֹ עַל מֵ֑ת וְ/לֹֽא יַשְׁק֤וּ אוֹתָ/ם֙ כּ֣וֹס תַּנְחוּמִ֔ים עַל אָבִ֖י/ו וְ/עַל אִמּֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/007.yaml
  text: No one will break bread for them in mourning[a], to comfort him for the dead[b], and no one will give them the cup of consolation to drink for his father or for his mother.
  footnotes:
  - marker: a
    text: Or 'share food with them in mourning.' The Hebrew verb literally means 'break/divide' and likely refers to the customary mourning meal.
    reason: lexical_alternative
  - marker: b
    text: '''The cup of consolation'' likely refers to a customary drink offered to comfort mourners after a death.'
    reason: cultural_note
translation:
  language: ko
  text: 상중에 그들에게 음식을 나누어 주어 죽은 이 때문에 그들을 위로하는 사람도 없고, 그들 각자의 아버지나 어머니 때문에 그들에게 위로의 잔[a]을 마시게 하는 사람도 없을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떡을 떼어 나누어 주어’라고 할 수 있습니다. 히브리어 동사는 문자적으로 ‘떼다/나누다’를 뜻하며, 이 문맥에서는 상중에 나누는 음식 또는 장례 위로 식사를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘위로의 잔’은 죽은 이를 잃은 사람을 위로하려고 관습적으로 건네던 음료를 가리킬 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹֽא יִפְרְס֥וּ
  english_pob_choice: will break bread
  chosen_korean: 떡을 떼어 주어
  alternatives_korean:
  - 떡을 나누어 주어
  - 음식을 나누어 주어
  - 빵을 떼어 주어
  lexicon: HALOT
  rationale: פרס의 문자적 뜻은 ‘떼다/나누다’이지만, 애곡 자리에서 상례 음식 나눔을 가리키는 관용으로 보이므로 한국어에서는 자연스러운 ‘떡을 떼어 주어’로 옮겨 음식 나눔의 구체성을 살렸습니다.
- source_word: עַל אֵבֶל
  english_pob_choice: in mourning
  chosen_korean: 애곡하는 중에
  alternatives_korean:
  - 상중에
  - 애도하는 중에
  - 슬퍼하는 때에
  lexicon: HALOT
  rationale: 전치사 עַל이 장면·상황을 나타내므로, 현대 한국어에서는 ‘애곡하는 중에’가 상황성과 장례 분위기를 가장 자연스럽게 드러냅니다.
- source_word: לְנַחֲמוֹ
  english_pob_choice: to comfort him
  chosen_korean: 위로하지도
  alternatives_korean:
  - 위로하지도
  - 달래지도
  - 위안을 주지도
  lexicon: HALOT
  rationale: נחם의 피엘은 ‘위로하다/위안하다’의 뜻이므로, 영어 POB의 ‘comfort’에 맞추되 한국어에서는 앞뒤 문맥을 살려 서술형 부정으로 처리했습니다.
- source_word: עַל מֵת
  english_pob_choice: for the dead
  chosen_korean: 죽은 이를
  alternatives_korean:
  - 죽은 자를
  - 사망한 이를
  - 고인을
  lexicon: HALOT
  rationale: 히브리어는 죽음 자체를 애곡 위로의 대상로 제시하므로, 장례문맥을 살리되 지나치게 교회식 표현이 되지 않도록 ‘죽은 이’를 택했습니다.
- source_word: כּוֹס תַּנְחוּמִים
  english_pob_choice: the cup of consolation
  chosen_korean: 위로의 잔
  alternatives_korean:
  - 위안의 잔
  - 위로를 위한 잔
  - 위로주
  lexicon: HALOT
  rationale: 문화적 상례 표현인 ‘consolation’은 한국어에서도 직역형인 ‘위로의 잔’이 가장 투명하며, 관습적 장례 위로의 상징성을 유지합니다.
theological_decisions:
- issue: 3인칭 단수 접미사와 집단 문맥의 대응
  chosen_reading: ‘죽은 이를 위로하지도’와 ‘그들의 아버지나 어머니를 위하여’로, 히브리어의 3인칭 단수 접미사와 앞의 복수 주어를 한국어에서 각각 자연스럽게 살렸습니다.
  alternative_readings:
  - 복수로 통일해 ‘그들을 위로하지도’
  - 개인화해 ‘그의 아버지나 어머니를 위하여’
  rationale: 히브리어 לְנַחֲמוֹ와 עַל אָבִיו וְעַל אִמּוֹ는 문법상 3인칭 단수이지만, 앞의 수혜자는 복수이므로 한국어는 문맥상 복수 주어를 유지하되, 위로의 대상은 단수 접미사의 의미를 무리 없이 담아야 합니다.
  doctrine_reference: 히브리어 문법-담화 일치
- issue: 장례 상례의 문화적 재현
  chosen_reading: ‘떡을 떼어 주어’와 ‘위로의 잔’으로 장례식의 음식·음료 관습을 직접 드러냈습니다.
  alternative_readings:
  - 일반적인 ‘음식을 나누어 주어’
  - 해설적 표현을 더한 의역
  rationale: 본문은 단순한 금지문이 아니라 상중 위로 관습의 부재를 말하므로, 문화적 긴장을 지우지 않도록 관습적 상징을 보존하는 번역이 필요합니다.
  doctrine_reference: 본문의 장례 관습 묘사
