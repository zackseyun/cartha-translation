  - severity: medium
    issue: 부모 소유 관계가 복수 ‘그들의’로 평준화됨
    rationale: אָבִיו וְאִמּוֹ는 문법상 ‘그의 아버지와 그의 어머니’입니다. 문맥상 복수 대상자에게 분배되므로 ‘그들 각자의’가 한국어에서 이 관계를 가장 잘 보존합니다.
  - severity: medium
