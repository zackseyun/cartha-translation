source:
  edition: WLC
  text: כִּֽי כֹ֣ה אָמַ֣ר יְהוָ֗ה אַל תָּבוֹא֙ בֵּ֣ית מַרְזֵ֔חַ וְ/אַל תֵּלֵ֣ךְ לִ/סְפּ֔וֹד וְ/אַל תָּנֹ֖ד לָ/הֶ֑ם כִּֽי אָסַ֨פְתִּי אֶת שְׁלוֹמִ֜/י מֵ/אֵ֨ת הָ/עָ֤ם הַ/זֶּה֙ נְאֻם יְהוָ֔ה אֶת הַ/חֶ֖סֶד וְ/אֶת הָֽ/רַחֲמִֽים־׀־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/005.yaml
  text: 'For thus says Yahweh: Do not enter a house of mourning[a], and do not go to mourn or show sympathy for them, for I have taken away my peace from this people[c][b], declares Yahweh—steadfast love and compassion.'
  footnotes:
  - marker: a
    text: Or 'a house of feasting.' The Hebrew term מַרְזֵחַ can denote a banquet setting in some contexts, but here the surrounding references to lamenting and showing sympathy favor 'house of mourning.'
    reason: lexical_alternative
  - marker: b
    text: Or 'console them.' The Hebrew verb can refer to making gestures of condolence or sympathy in mourning.
    reason: lexical_alternative
  - marker: c
    text: '''Peace'' here likely includes well-being, wholeness, and welfare, not merely the absence of conflict.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호와께서 이렇게 말씀하십니다. “상가에[a] 들어가지 마십시오. 애도하러 가지도 말고, 그들에게 조의를 표하지도[b] 마십시오. 내가 이 백성에게서 내 평안[c], 곧 한결같은 사랑과 자비를 거두었기 때문입니다. 여호와의 말씀입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘상가’는 히브리어 מַרְזֵחַ의 문맥상 의미를 따른 번역입니다. 이 말은 다른 문맥에서는 잔치 자리나 연회와 관련된 곳을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘조의를 표하다’는 애도하는 이들에게 보이는 위로·조문의 표현이나 몸짓을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘평안’은 단순히 갈등이 없는 상태만이 아니라 안녕, 온전함, 복리를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
  - 야훼
  lexicon: WLC/Tetragrammaton
  rationale: 이 절의 한국어 본문은 한국 교회에서 가장 널리 인식되는 고유 신명인 여호와를 사용하되, 영어 POB의 Yahweh 선택과 대응하도록 신명이라는 사실을 분명히 드러냈습니다.
- source_word: בֵּית מַרְזֵחַ
  english_pob_choice: a house of mourning
  chosen_korean: 상가 집
  alternatives_korean:
  - 애가 집
  - 장례 집
  - 잔치 집
  lexicon: HALOT
  rationale: 문맥이 애도와 조문, 슬픔의 표시를 가리키므로, 마르제아흐를 ‘상가 집’으로 옮겨 장례·조문 상황을 자연스럽게 살렸습니다.
- source_word: לִסְפּוֹד
  english_pob_choice: to mourn
  chosen_korean: 애도하러 가다
  alternatives_korean:
  - 통곡하러 가다
  - 슬퍼하러 가다
  - 곡하다
  lexicon: HALOT
  rationale: 동사는 단순 감정이 아니라 죽은 이를 위해 애도하는 행위를 가리키므로, 목적을 드러내는 ‘애도하러 가다’로 풀었습니다.
- source_word: תָּנֹד לָהֶם
  english_pob_choice: show sympathy for them
  chosen_korean: 동정의 표시를 하다
  alternatives_korean:
  - 위로를 건네다
  - 그들에게 동정하다
  - 조문 인사를 하다
  lexicon: HALOT
  rationale: 노드의 제스처적·사회적 뉘앙스를 살려, 단순 감정이 아니라 애도자에게 보이는 공감의 표현을 뜻하는 말로 옮겼습니다.
- source_word: שְׁלוֹמִי
  english_pob_choice: my peace
  chosen_korean: 나의 평안
  alternatives_korean:
  - 나의 평화
  - 나의 복리
  - 나의 안녕
  lexicon: HALOT
  rationale: 샬롬의 언약적 넓이를 유지하면서도 한국어에서 자연스러운 ‘평안’을 택해, 단순한 전쟁 부재보다 삶의 복지와 온전함을 포함하도록 했습니다.
- source_word: הַחֶסֶד וְאֶת הָרַחֲמִים
  english_pob_choice: steadfast love and compassion
  chosen_korean: 변함없는 사랑과 긍휼
  alternatives_korean:
  - 인애와 자비
  - 언약적 사랑과 긍휼
  - 끊임없는 사랑과 자비
  lexicon: HALOT
  rationale: 하세드와 라하밈의 언약적·감정적 중첩을 한국어 성경 문체에서 이해 가능한 쌍으로 제시하되, ‘긍휼’은 전통어이지만 본문의 자비/연민 의미를 충분히 담습니다.
theological_decisions:
- issue: 문장 끝의 명시적 수식구 처리
  chosen_reading: ‘변함없는 사랑과 긍휼’을 따옴표 안에서 설명적 종결로 배치하여, 하나님이 거두신 것이 단지 추상적 평안이 아니라 샬롬을 구성하는 언약적 선물들임을 드러냈습니다.
  alternative_readings:
  - 쉼표로 연결해 단순 병렬로 옮길 수 있음
  - 별도 문장으로 분리해 해설적으로 처리할 수 있음
  rationale: 히브리어는 ‘나의 평안’을 거두셨다고 한 뒤 두 명사구를 덧붙여 그 내용물을 구체화하므로, 한국어에서도 그 긴장을 유지하는 것이 좋습니다.
  doctrine_reference: 언약적 샬롬과 하나님의 심판 선언
