id: JER.16.17
reference: Jeremiah 16:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י עֵינַ/י֙ עַל כָּל דַּרְכֵי/הֶ֔ם לֹ֥א נִסְתְּר֖וּ מִ/לְּ/פָנָ֑/י וְ/לֹֽא נִצְפַּ֥ן עֲוֺנָ֖/ם מִ/נֶּ֥גֶד עֵינָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/017.yaml
  text: For my eyes are on all their ways[a]; they are not hidden from me[c][b], and their iniquity is not concealed from before my eyes.
  footnotes:
  - marker: a
    text: Or 'Because my eyes are on all their ways.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their ways'—that is, their conduct or manner of life.
    reason: lexical_alternative
  - marker: c
    text: Or 'their guilt' for 'their iniquity.' The Hebrew עָוֹן can denote wrongdoing or the guilt associated with it.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 눈이 그들의 모든 길에 있으므로[a], 그들은 내게서 숨겨지지 않으며[b], 그들의 죄악은 내 눈앞에서 가려지지 않습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 모든 길 위에’입니다. 여기서 ‘길’은 실제 이동 경로보다 삶의 방식과 행실을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘나에게서’라는 표현으로 하나님의 임재 앞에서 숨겨지지 않는다는 뜻을 나타냅니다.
    reason: source_note
  - marker: c
    text: 원문은 ‘내 눈앞에서’입니다. 여기서는 한국어로 자연스럽게 ‘내 눈앞에서’라고 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  english_pob_choice: my eyes
  chosen_korean: 내 눈
  alternatives_korean:
  - 내 눈길
  - 내 시선
  - 내가 보는 것
  lexicon: HALOT
  rationale: 하나님의 감시와 인지의 생생한 인격적 이미지를 살리기 위해 추상화하지 않고 직접적으로 옮겼습니다.
- source_word: כָּל דַּרְכֵיהֶם
  english_pob_choice: all their ways
  chosen_korean: 그들의 모든 길
  alternatives_korean:
  - 그들의 모든 행위
  - 그들이 가는 모든 길
  - 그들의 삶의 방식
  lexicon: HALOT
  rationale: derek의 ‘길’ 이미지를 유지하면서 행위 전반을 포괄하는 의미를 드러내기 위해 직역에 가깝게 옮겼습니다.
- source_word: לֹא נִסְתְּרוּ מִלְּפָנַי
  english_pob_choice: they are not hidden from me
  chosen_korean: 그들은 내게서 숨겨지지 않으며
  alternatives_korean:
  - 그들은 내게 감추어지지 않으며
  - 그들은 내 앞에서 숨겨지지 않으며
  lexicon: HALOT
  rationale: 동사의 수를 한국어에서 자연스럽게 처리하면서, ‘from me’의 의미를 간결하고 문어적으로 살렸습니다.
- source_word: עֲוֺנָם
  english_pob_choice: their iniquity
  chosen_korean: 그들의 죄악
  alternatives_korean:
  - 그들의 불의
  - 그들의 악행
  - 그들의 죄
  lexicon: HALOT
  rationale: עון의 도덕적 무게를 살리되, 한국어에서 너무 협소한 ‘죄’보다 문맥상 무거운 ‘죄악’을 선택했습니다.
- source_word: מִנֶּגֶד עֵינַי
  english_pob_choice: from before my eyes
  chosen_korean: 내 눈앞에서
  alternatives_korean:
  - 내 눈앞으로부터
  - 내 시야에서
  - 내 앞에서
  lexicon: HALOT
  rationale: 히브리어의 ‘눈 앞/면전’ 이미지를 한국어 관용어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 인지와 심판을 나타내는 신체 비유
  chosen_reading: ‘내 눈’, ‘내 눈앞’ 같은 신체적 이미지를 그대로 살려 하나님의 전지와 도덕적 감찰을 표현했습니다.
  alternative_readings:
  - ‘나는 다 안다’로 의역
  - ‘내게서 숨겨지지 않는다’만 남기고 눈 이미지를 약화
  rationale: 예언문맥의 수사적 힘은 구체적 이미지에 있으므로, 이를 추상화하면 경고의 긴장이 약해집니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: עָוֹן의 의미 범위
  chosen_reading: ‘죄악’으로 옮겨 단순한 ‘죄’보다 더 강한 책임성과 불법성을 드러냈습니다.
  alternative_readings:
  - 죄
  - 불의
  - 죄책
  rationale: 문맥상 드러난 것은 단순한 상태가 아니라 하나님 앞에 노출된 도덕적 악이므로, 한국어에서 무게감이 있는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §5
