    reason: lexical_alternative
  revision_rationale: 이유를 나타내는 כִּי를 ‘이는’으로 바로잡고, ‘눈이 길에 있다’라는 어색한 직역을 피하면서도 하나님의 눈이 그들의 모든 길을 향하고 있다는 원문의 이미지를 보존했습니다. 첫 번째 숨김 절의 복수 선행사 ‘그들의 길’을 명시해 원문의 수 일치를 드러냈습니다. 각주는 각각의 표지 위치에 맞추어 원문 표현과 어휘 선택을 설명하도록 정리했습니다.
