id: JER.16.10
reference: Jeremiah 16:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י תַגִּיד֙ לָ/עָ֣ם הַ/זֶּ֔ה אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וְ/אָמְר֣וּ אֵלֶ֗י/ךָ עַל מֶה֩ דִבֶּ֨ר יְהוָ֤ה עָלֵ֨י/נוּ֙ אֵ֣ת כָּל הָ/רָעָ֤ה הַ/גְּדוֹלָה֙ הַ/זֹּ֔את וּ/מֶ֤ה עֲוֺנֵ֨/נוּ֙ וּ/מֶ֣ה חַטָּאתֵ֔/נוּ אֲשֶׁ֥ר חָטָ֖אנוּ לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/010.yaml
  text: And when you tell this people all these words[a], and they say to you, ‘Why has Yahweh spoken against us all this great disaster? And what is our iniquity, and what is our sin that we have sinned against Yahweh our God?’
  footnotes:
  - marker: a
    text: Or 'all this great calamity.' The Hebrew word can also be rendered 'evil,' but here it refers to disaster or judgment coming upon the people, not moral evil in the LORD.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 이 백성에게 이 모든 말을 전하면, 그들이 당신에게 ‘어찌하여 야훼께서 우리를 거슬러 이 모든 큰 재앙[a]을 선포하셨습니까? 우리의 죄악이 무엇이며, 야훼 우리 하나님께 우리가 지은 죄가 무엇입니까?’ 하고 말할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 모든 큰 재난’. 히브리어 רָעָה는 ‘악’으로도 옮길 수 있지만, 여기서는 백성에게 내릴 심판과 재앙을 가리키므로 도덕적 악이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי / תַגִּיד
  english_pob_choice: And when you tell
  chosen_korean: 당신이 이 백성에게 이 모든 말을 전하면
  alternatives_korean:
  - 당신이 이 백성에게 이 모든 말을 말하면
  - 당신이 이 백성에게 이 모든 말씀을 전하면
  lexicon: HALOT
  rationale: 조건-시간을 여는 העתיד형 관용구로 보고, 예언적 전달 행위를 자연스러운 현대 한국어의 ‘전하면’으로 옮겼습니다.
- source_word: לָעָם הַזֶּה / כָּל הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: this people / all these words
  chosen_korean: 이 백성 / 이 모든 말
  alternatives_korean:
  - 이 사람들 / 이 모든 말씀
  - 이 ժողովուրդ / 이 모든 말씀
  lexicon: HALOT
  rationale: עָם의 집합적 단수와 דברים의 ‘선포된 말’ 성격을 살려, 집단명사인 ‘이 백성’과 ‘이 모든 말’로 대응했습니다.
- source_word: כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  english_pob_choice: all this great disaster
  chosen_korean: 이 큰 재앙
  alternatives_korean:
  - 이 큰 재난
  - 이 큰 재앙과 같은 악
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 ‘악’이 아니라 심판으로 닥치는 재앙이므로, 한국어에서도 그 긴장을 유지하는 ‘재앙’을 택했습니다.
- source_word: עֲוֺנֵנוּ / חַטָּאתֵנוּ
  english_pob_choice: our iniquity / our sin
  chosen_korean: 우리의 죄악 / ... 우리의 죄
  alternatives_korean:
  - 우리의 불의 / 우리의 죄
  - 우리의 악행 / 우리의 죄
  lexicon: HALOT
  rationale: 두 어휘의 차이를 살리기 위해 앞의 עון은 더 무거운 ‘죄악’, 뒤의 חטאת은 일반적 ‘죄’로 구분해 옮겼습니다.
- source_word: לַיהוָה אֱלֹהֵינוּ
  english_pob_choice: against Yahweh our God
  chosen_korean: 야훼 우리 하나님께
  alternatives_korean:
  - 야훼 우리 하나님께 대하여
  - 야훼 우리 하나님을 상대로
  lexicon: HALOT
  rationale: חטא의 통상적 목적어 관계를 한국어에서는 ‘…께 죄를 지다’로 자연스럽게 풀어, 대립의 의미를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 여호와 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 직접 사용하는 신명을 대체하지 않고, 프로젝트 기준에 따라 고유명사인 ‘야훼’로 옮겨 언약적 이름성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רָעָה의 의미를 도덕악이 아니라 심판 재앙으로 처리
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  rationale: 예언 맥락에서 이 표현은 하나님 안의 도덕적 악이 아니라 백성 위에 임할 심판을 뜻하므로, 오해를 줄이는 ‘재앙’을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: original-language primacy; preserve the source''s plain sense'
