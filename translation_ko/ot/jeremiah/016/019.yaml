  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יְהוָ֞ה עֻזִּ֧/י וּ/מָעֻזִּ֛/י וּ/מְנוּסִ֖/י בְּ/י֣וֹם צָרָ֑ה אֵלֶ֗י/ךָ גּוֹיִ֤ם יָבֹ֨אוּ֙ מֵֽ/אַפְסֵי אָ֔רֶץ וְ/יֹאמְר֗וּ אַךְ שֶׁ֨קֶר֙ נָחֲל֣וּ אֲבוֹתֵ֔י/נוּ הֶ֖בֶל וְ/אֵֽין בָּ֥/ם מוֹעִֽיל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/019.yaml
  text: O Yahweh[a], my strength and my stronghold, my refuge in the day of distress, to you the nations will come from the ends of the earth and say, “Surely our fathers inherited only lies[b], worthless things in which there is no profit.”
  footnotes:
  - marker: a
    text: Or “our ancestors inherited only falsehood, vanity, and things with no benefit.”
    reason: lexical_alternative
  - marker: b
    text: “Worthless things” translates Hebrew hebel, often “vanity,” “emptiness,” or, by implication in some contexts, futile idols.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여[a], 주님은 나의 힘, 나의 요새, 환난의 날에 나의 피난처이십니다. 민족들이 땅 끝에서 주님께 와서 말할 것입니다. “우리 조상들은 참으로 거짓과 헛된 것들[b]을 물려받았습니다. 그것들 가운데에는 유익한 것이 하나도 없습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 하나님의 이름 יְהוָה를 음역한 것입니다.
    reason: source_note
  - marker: b
    text: ‘헛된 것들’은 히브리어 הֶבֶל을 옮긴 말로, ‘허무’, ‘공허’, ‘무가치함’을 뜻할 수 있으며 문맥에 따라 우상들을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC
  rationale: 원문이 여호와 이름인 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 고유한 신명인 야훼를 유지했습니다.
- source_word: עֻזִּי / מָעֻזִּי / מְנוּסִי
  english_pob_choice: my strength / my stronghold / my refuge
  chosen_korean: 주님의 힘과 요새, 환난의 날의 피난처
  alternatives_korean:
  - 주님의 능력과 산성, 피난처
  - 주님의 힘과 보루, 도피처
  lexicon: HALOT
  rationale: 세 표현의 병렬을 살리되, 한국어에서 자연스럽고 의미 차이를 보존하는 조합으로 힘/요새/피난처를 택했습니다.
- source_word: גּוֹיִם מֵאַפְסֵי אָרֶץ
  english_pob_choice: the nations ... from the ends of the earth
  chosen_korean: 열방이 땅끝에서
  alternatives_korean:
  - 민족들이 땅끝에서
  - 나라들이 세상 끝에서
  lexicon: HALOT
  rationale: גּוֹיִם은 국제적 범위를 드러내는 ‘열방’이 적절하고, מֵאַפְסֵי אָרֶץ는 관용적으로 ‘땅끝에서’로 옮겼습니다.
- source_word: שֶׁקֶר ... הֶבֶל ... וְאֵין בָּם מוֹעִיל
  english_pob_choice: only lies, worthless things in which there is no profit
  chosen_korean: 오직 거짓, 곧 아무 유익도 없는 헛된 것들
  alternatives_korean:
  - 오직 거짓, 곧 무익한 것들
  - 오직 거짓말, 곧 헛되고 무익한 것들
  lexicon: HALOT
  rationale: שֶׁקֶר의 기만성을 ‘거짓’으로, הֶבֶל의 공허함을 ‘헛된 것들’로, וְאֵין בָּם מוֹעִיל의 무익함을 ‘아무 유익도 없는’으로 분리해 보존했습니다.
theological_decisions:
- issue: יְהוָה의 호칭을 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문은 언약 이름을 직접 부르며, 프로젝트 기본값도 신명 표기로 야훼를 요구하므로 전통 교회식 대체어보다 원문 가시성을 우선했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: הֶבֶל을 ‘우상’으로 좁힐지 여부
  chosen_reading: 헛된 것들
  alternative_readings:
  - 우상들
  - 허무한 것들
  rationale: 문맥상 조상들이 물려받은 잘못된 종교를 가리키지만, 원문 자체는 ‘무가치/공허’의 폭넓은 의미를 가지므로 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy: Original-language primacy; Never import doctrinal claims the text does not make.'
