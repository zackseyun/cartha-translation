  naturalness: 초안의 호격 병렬은 자연스러울 수 있으나 ‘주님의 힘’은 문맥상 ‘주님의 힘’(하나님 자신의 힘)으로 읽힙니다. 현대 표준어 합쇼체로는 완결된 서술형을 사용한 수정문이 명확하고 자연스럽습니다. ‘민족들’과 ‘땅 끝’은 현대어로 무난합니다.
  terminology: 야훼는 원문의 신명을 적절히 보존합니다. מָעוֹז와 מָנוֹס의 구별을 ‘요새’와 ‘피난처’로 유지했습니다. הֶבֶל은 ‘헛된 것들’로 넓게 옮기고 ‘우상들’은 본문이 아닌 각주에서 가능한 문맥적 이해로만 제시했습니다.
