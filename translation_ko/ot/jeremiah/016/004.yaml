id: JER.16.4
reference: Jeremiah 16:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מְמוֹתֵ֨י תַחֲלֻאִ֜ים יָמֻ֗תוּ לֹ֤א יִסָּֽפְדוּ֙ וְ/לֹ֣א יִקָּבֵ֔רוּ לְ/דֹ֛מֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה יִֽהְי֑וּ וּ/בַ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִכְל֔וּ וְ/הָיְתָ֤ה נִבְלָתָ/ם֙ לְ/מַאֲכָ֔ל לְ/ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֥ת הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/004.yaml
  text: They will die of deadly diseases[a]. They will not be mourned or buried. They will become dung on the surface of the ground. They will be consumed by the sword and by famine[c][b], and their carcasses will become food for the birds of the heavens and for the beasts of the earth.
  footnotes:
  - marker: a
    text: Hebrew literally, 'deaths of diseases'; the phrase means death caused by severe disease.
    reason: lexical_alternative
  - marker: b
    text: Or 'upon the face of the ground.'
    reason: lexical_alternative
  - marker: c
    text: Or 'their corpses' instead of 'their carcasses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 치명적인 질병으로 죽을 것입니다[a]. 그들은 애도도 받지 못하고 매장도 되지 않을 것입니다. 그들은 땅의 표면 위의 거름이 될 것입니다[b]. 그들은 칼과 기근으로 소멸될 것이며[c], 그들의 시체는 하늘의 새와 땅의 짐승의 먹이가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘질병들의 죽음들’로, 심한 질병으로 인한 죽음을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅의 표면 위에’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 시체’ 대신 ‘그들의 사체’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמוֹתֵ֨י תַחֲלֻאִ֜ים
  english_pob_choice: deadly diseases
  chosen_korean: 치명적인 질병
  alternatives_korean:
  - 죽음의 질병
  - 병으로 인한 죽음
  - 죽게 하는 병
  lexicon: HALOT
  rationale: 히브리어의 직역은 '질병들의 죽음'이지만, 문맥상 치명적 질병으로 인한 죽음을 뜻하므로 자연스러우면서도 의미를 보존하는 표현으로 옮겼습니다.
- source_word: לֹ֤א יִסָּֽפְדוּ֙ וְלֹ֣א יִקָּבֵ֔רוּ
  english_pob_choice: They will not be mourned or buried
  chosen_korean: 애도도 받지 못하고 매장도 되지 않을 것입니다
  alternatives_korean:
  - 통곡도 받지 못하고 묻히지도 않을 것입니다
  - 곡도 하지 못하고 장사되지 않을 것입니다
  lexicon: HALOT
  rationale: יִסָּפְדוּ는 장례 애도 행위, יִקָּבֵרוּ는 매장을 가리키므로, 두 가지 장례 거절을 한국어에서 분명히 드러냈습니다.
- source_word: לְדֹמֶן עַל פְּנֵ֥י הָ/אֲדָמָ֖ה
  english_pob_choice: dung on the surface of the ground
  chosen_korean: 땅의 표면 위의 거름
  alternatives_korean:
  - 땅 위의 똥
  - 땅 표면의 분뇨
  - 땅의 겉면 위의 거름
  lexicon: HALOT
  rationale: דֹמֶן은 사람을 더럽고 수치스러운 잔해로 전락시킨다는 뜻의 강한 이미지이므로, 완곡한 '거름'보다 덜 속되면서도 낮춤의 의미를 살리는 표현을 택했습니다.
- source_word: וּ/בַ/חֶ֤רֶב וּ/בָֽ/רָעָב֙ יִכְל֔וּ
  english_pob_choice: They will be consumed by the sword and by famine
  chosen_korean: 그들은 칼과 기근으로 소멸될 것이며
  alternatives_korean:
  - 그들은 칼과 기근에 의해 끝날 것이며
  - 그들은 칼과 기근으로 멸망할 것이며
  lexicon: HALOT
  rationale: כלה는 단순한 죽음보다 '끝장남/소멸됨'의 의미가 강하므로, 심판의 전면성을 살려 '소멸될'로 옮겼습니다.
- source_word: נִבְלָתָ/ם
  english_pob_choice: their carcasses
  chosen_korean: 그들의 시체
  alternatives_korean:
  - 그들의 사체
  - 그들의 송장
  - 그들의 가죽 없는 몸
  lexicon: HALOT
  rationale: 문맥상 들짐승과 새의 먹이가 되는 노출된 मृत체를 뜻하지만, 한국어에서 '시체'가 가장 직접적이고 과도하게 비속하지 않으면서도 상태를 드러냅니다.
theological_decisions:
- issue: 공개적 장례 거부와 완전한 수치의 이미지
  chosen_reading: 이 절은 단순한 죽음이 아니라, 애도와 매장이 거절되고 노출된 시신이 짐승들의 먹이가 되는 언약 저주의 형식을 보여 준다고 읽었습니다.
  alternative_readings:
  - 단순한 전쟁 재난 묘사
  - 장례 관습의 부재를 말하는 사회사적 진술
  rationale: 본문의 연쇄적 표현(애도 없음, 매장 없음, 거름 됨, 새와 짐승의 먹이 됨)은 심판과 수치를 강조하는 예언적 저주 언어로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 언약 저주와 예언 심판의 수치 모티프
