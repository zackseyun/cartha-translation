reference: Jeremiah 16:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/יַעֲשֶׂה לּ֥/וֹ אָדָ֖ם אֱלֹהִ֑ים וְ/הֵ֖מָּה לֹ֥א אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/020.yaml
  text: Can a man make gods for himself? Yet they are not gods[a].
  footnotes:
  - marker: a
    text: Or, 'Does a man make gods for himself? But they are no gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 사람이 자기를 위해 신들을 만들 수 있겠습니까? 그러나 그들은 신들이 아닙니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「사람이 자기를 위해 신들을 만듭니까? 그러나 그들은 신들이 아닙니다.」
    reason: alternative_reading
lexical_decisions:
- source_word: הֲ/יַעֲשֶׂה
  english_pob_choice: Can ... make
  chosen_korean: ~할 수 있겠습니까?
  alternatives_korean:
  - ~합니까?
  - ~하겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 의문이 놀라움과 부정의 기대를 담고 있으므로, 단순한 정보 질문보다 반문에 가까운 「~할 수 있겠습니까?」로 옮겼습니다.
- source_word: לּוֹ
  english_pob_choice: for himself
  chosen_korean: 자기를 위해
  alternatives_korean:
  - 자신을 위해
  - 그를 위해
  lexicon: HALOT
  rationale: ל + 3인칭 남성 단수 접미사는 여기서 소유·반사적 의미를 띠므로, 우상 제작의 자기 지향성을 드러내는 「자기를 위해」가 적절합니다.
- source_word: אָדָם
  english_pob_choice: a man
  chosen_korean: 사람
  alternatives_korean:
  - 한 남자
  - 인간
  lexicon: HALOT
  rationale: 히브리어 단수 보편 표현을 한국어에서는 성별을 과도하게 좁히지 않으면서도 일반성을 살려 「사람」으로 옮겼습니다.
- source_word: אֱלֹהִים
  english_pob_choice: gods
  chosen_korean: 신들
  alternatives_korean:
  - 신
  - 거짓 신들
  lexicon: HALOT
  rationale: 문맥이 인간이 만든 복수의 신격/우상을 가리키므로, 복수를 분명히 보이는 「신들」이 영어 POB의 복수 처리와도 가장 잘 맞습니다.
theological_decisions:
- issue: 마지막 절의 부정 강도
  chosen_reading: 인간이 만든 신들은 실제로 신이 아니라는 부정 선언으로 옮겼습니다.
  alternative_readings:
  - 우상 제작을 조롱하는 수사로만 읽을 수 있습니다.
  rationale: 마지막 절의 לֹא אֱלֹהִים은 단순한 조롱을 넘어 그들이 참된 신성이 없음을 직접 부정하므로, 한국어도 존재론적 부정을 분명히 드러냈습니다.
  doctrine_reference: 예언서의 우상 비판과 유일신 신앙
