lexical_decisions:
- source_word: תִקַּח
  english_pob_choice: take
  chosen_korean: 맞아들이지 말며
  alternatives_korean:
  - 아내를 취하지 말며
  - 아내를 데려오지 말며
  - 장가들지 말며
  lexicon: HALOT
  rationale: לָקַח의 기본 뜻인 ‘취하다/가져오다’를 살리면서, 한국어에서는 결혼 결합의 관용적 표현인 ‘아내를 맞아들이다’가 자연스럽고 문맥의 엄숙한 금지 명령도 유지합니다.
- source_word: לְךָ
  english_pob_choice: for yourself
  chosen_korean: 당신은
  alternatives_korean:
  - 당신 자신을 위해
  - 당신에게
  - 스스로
  lexicon: HALOT
  rationale: 히브리어의 2인칭 남성 단수 소유·개인 지시를 한국어에서는 문장 주어를 드러내는 방식으로 자연스럽게 살렸습니다. ‘당신 자신을 위해’는 과도하게 반사적이어서 문맥보다 강합니다.
- source_word: בָּנִים וּבָנוֹת
  english_pob_choice: sons or daughters
  chosen_korean: 아들들과 딸들도
  alternatives_korean:
  - 자녀들도
  - 아들들와 딸들
  - 아들들이나 딸들이나
  lexicon: HALOT
  rationale: 히브리어가 남녀 자녀를 각각 명시하므로, 일반어 ‘자녀’로 뭉개지 않고 둘 다 드러냈습니다. 부정문에서 한국어는 ‘및/또한’보다 ‘-도’가 자연스럽습니다.
- source_word: בַּמָּקוֹם הַזֶּה
  english_pob_choice: in this place
  chosen_korean: 이곳에서
  alternatives_korean:
  - 이곳에서
  - 이 땅에서
  - 여기서
  lexicon: HALOT
  rationale: מָקוֹם의 기본 뜻인 ‘장소’를 보존하기 위해 ‘이곳에서’를 택했습니다. ‘이 땅’은 범위를 넓혀 해석할 수 있어 원문의 국지성을 흐릴 수 있습니다.
