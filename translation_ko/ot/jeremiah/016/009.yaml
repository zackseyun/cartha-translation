base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/016/009.yaml
  text: 'For thus says Yahweh of Armies[a], the God of Israel: Behold, I am about to put an end, from this place before your eyes and in your days, to the sound of joy and the sound of gladness, the voice of the bridegroom and the voice of the bride.'
  footnotes:
  - marker: a
    text: Or, more traditionally, 'the LORD of hosts.'
    reason: lexical_alternative
translation:
  language: ko
  text: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 보십시오, 내가 곧 이곳에서, 여러분의 눈앞에서, 그리고 여러분의 날에 기쁨의 소리와 즐거움의 소리, 신랑의 목소리와 신부의 목소리를 그치게 하겠습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 전통적으로는 ‘만군의 여호와’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 여호와
  - 하늘의 군대의 주
  lexicon: HALOT
  rationale: POB의 ‘Yahweh of Armies’를 따라 יְהוָה는 ‘야훼’로, צְבָאוֹת은 관용적으로 ‘만군의’로 옮겨 원문의 칭호를 보존했습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 신
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 히브리어 소유격 구문을 자연스러운 한국어로 직역해, 하나님의 언약적 관계를 분명히 드러냈습니다.
- source_word: הִנְנִי מַשְׁבִּית
  english_pob_choice: Behold, I am about to put an end
  chosen_korean: 보십시오, 내가 곧 … 그치게 하겠습니다
  alternatives_korean:
  - 보십시오, 내가 … 끝내겠습니다
  - 보라, 내가 … 멈추게 하겠습니다
  lexicon: HALOT
  rationale: הִנְנִי의 주의 환기와 임박성을 ‘보십시오, 내가 곧’으로 살리고, causative 동사 מַשְׁבִּית는 소리들이 멈추게 되는 의미를 살려 ‘그치게 하겠습니다’로 옮겼습니다.
- source_word: קוֹל שָׂשׂוֹן וְקוֹל שִׂמְחָה
  english_pob_choice: the sound of joy and the sound of gladness
  chosen_korean: 기쁨의 소리와 즐거움의 소리
  alternatives_korean:
  - 기쁨의 소리와 기쁜 함성
  - 즐거움의 소리와 환희의 소리
  lexicon: HALOT
  rationale: 두 명사 모두 축제의 청각적 분위기를 가리키므로 ‘소리’를 유지하되, 서로 다른 두 표현을 구별해 반복의 효과를 보존했습니다.
- source_word: קוֹל חָתָן וְקוֹל כַּלָּה
  english_pob_choice: the voice of the bridegroom and the voice of the bride
  chosen_korean: 신랑의 목소리와 신부의 목소리
  alternatives_korean:
  - 신랑의 소리와 신부의 소리
  - 신랑의 음성과 신부의 음성
  lexicon: HALOT
  rationale: 사람을 가리키는 קוֹל은 한국어에서 ‘목소리’가 가장 자연스럽고, 앞의 병렬 구조를 그대로 살릴 수 있어 선택했습니다.
theological_decisions:
- issue: 야훼의 호칭을 한국어에서 어떻게 표기할지
  chosen_reading: ‘야훼’로 표기해 언약 이름을 드러내고, 전통적 교회 용어인 ‘여호와’는 본문에서 쓰지 않았습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본 원칙에 따라 Tetragrammaton을 음역해 원문이 가진 고유한 신명성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
