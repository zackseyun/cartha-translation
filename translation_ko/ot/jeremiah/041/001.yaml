source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֣ה בֶן אֱלִישָׁמָ֣ע מִ/זֶּ֣רַע הַ֠/מְּלוּכָה וְ/רַבֵּ֨י הַ/מֶּ֜לֶךְ וַ/עֲשָׂרָ֨ה אֲנָשִׁ֥ים אִתּ֛/וֹ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָ֖ם הַ/מִּצְפָּ֑תָ/ה וַ/יֹּ֨אכְלוּ שָׁ֥ם לֶ֛חֶם יַחְדָּ֖ו בַּ/מִּצְפָּֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/001.yaml
  text: Now in the seventh month[a], Ishmael son of Nethaniah, son of Elishama, of the royal line and one of the chief officers of the king, came with ten men to Gedaliah son of Ahikam at Mizpah[c][b], and they ate bread there together in Mizpah.
  footnotes:
  - marker: a
    text: Hebrew 'ate bread,' an idiom for sharing a meal.
    reason: lexical_alternative
  - marker: b
    text: Or 'of royal seed' for 'of the royal line.'
    reason: lexical_alternative
  - marker: c
    text: Or 'one of the king's nobles' for 'one of the chief officers of the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 일곱째 달에 느다냐의 아들이며 엘리사마의 손자인 이스마엘, 곧 왕가의 후손이며 왕의 고관들 가운데 한 사람이 열 사람을 데리고 미스바에 있는 아히감의 아들 그달리야에게 왔습니다. 그들은 այնտեղ 미스바에서 함께 빵을 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘빵을 먹다’는 함께 식사한다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: in the seventh month
  chosen_korean: 제칠월에
  alternatives_korean:
  - 일곱째 달에
  - 제7월에
  lexicon: HALOT
  rationale: 히브리어의 달 표기를 한국어 성경체에 맞게 간결하게 옮겼습니다.
- source_word: מִזֶּרַע הַמְּלוּכָה
  english_pob_choice: of the royal line
  chosen_korean: 왕족의 씨에서 난 자
  alternatives_korean:
  - 왕의 혈통에서 난 자
  - 왕족의 가문에서 난 자
  lexicon: HALOT
  rationale: זֶרַע는 혈통/후손을 뜻하므로 단순한 ‘가문’보다 출생 계보를 드러내는 표현으로 옮겼습니다. POB의 대안인 ‘royal seed’의 긴장을 살리기 위해 ‘씨에서 난 자’를 사용했습니다.
- source_word: וְרַבֵּי הַמֶּלֶךְ
  english_pob_choice: one of the chief officers of the king
  chosen_korean: 왕의 고관들 가운데 한 사람
  alternatives_korean:
  - 왕의 귀인들 가운데 한 사람
  - 왕의 대신들 가운데 한 사람
  lexicon: HALOT
  rationale: 복수형이 이스마엘을 수식하지만 한국어에서는 대표적 단수 표현이 자연스러워 ‘가운데 한 사람’으로 풀었습니다. ‘고관’은 왕실 고위 관료/귀족의 의미를 비교적 직접적으로 반영합니다.
- source_word: וַיֹּאכְלוּ שָׁם לֶחֶם יַחְדָּו
  english_pob_choice: and they ate bread there together
  chosen_korean: 그들이 거기 미스바에서 함께 빵을 먹었습니다
  alternatives_korean:
  - 그들이 거기서 함께 식사했습니다
  - 그들이 거기 미스바에서 함께 먹었습니다
  lexicon: HALOT
  rationale: ‘빵을 먹다’는 식사 관용구이지만, 본문에 있는 ‘빵’을 그대로 살려 공동 식사의 사실을 드러냈습니다. POB의 직역성을 따라 의미를 완화하지 않았습니다.
theological_decisions:
- issue: 왕족의 혈통을 나타내는 זֶרַע의 번역 강도
  chosen_reading: ‘왕족의 씨에서 난 자’로 번역해 출생 계보와 신분의 긴장을 유지했습니다.
  alternative_readings:
  - ‘왕족 출신’으로 평탄화
  - ‘왕의 혈통’으로 완화
  rationale: 본문은 단순한 사회적 지위를 넘어서 다윗 왕조 계열의 출생적 배경을 강조하므로, ‘씨’라는 표현으로 계보적 뉘앙스를 보존했습니다.
  doctrine_reference: 역사 서술의 계보적 표지 보존
