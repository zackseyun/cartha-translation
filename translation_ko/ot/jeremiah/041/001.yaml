- from: 제칠월에, 느다냐의 아들, 엘리사마의 손자 이스마엘이 왕족의 씨에서 난 자이며 왕의 고관들 가운데 한 사람으로서, 자기와 함께한 열 사람과 함께 미스바에 있는 아히감의 아들 그달랴에게 와서, 그들이 거기 미스바에서 함께 빵을 먹었습니다.[a]
  to: 일곱째 달에 느다냐의 아들이며 엘리사마의 손자인 이스마엘, 곧 왕가의 후손이며 왕의 고관들 가운데 한 사람이 열 사람을 데리고 미스바에 있는 아히감의 아들 그달리야에게 왔습니다. 그들은 այնտեղ 미스바에서 함께 빵을 먹었습니다.[a]
  rationale: 직역투와 중복을 제거하면서 왕실 계보, 고위 신분, 열 명의 동행, 장소의 반복, 그리고 ‘빵’이라는 명시적 어휘를 보존했습니다. ‘왕가의 후손’은 불필요하게 문자적인 ‘씨’ 표현 없이도 원문의 혈통 표지를 충실히 전달합니다.
