source:
  edition: WLC
  text: וַ/יִּקְחוּ֙ אֶת כָּל הָ֣/אֲנָשִׁ֔ים וַ/יֵּ֣לְכ֔וּ לְ/הִלָּחֵ֖ם עִם יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֑ה וַ/יִּמְצְא֣וּ אֹת֔/וֹ אֶל מַ֥יִם רַבִּ֖ים אֲשֶׁ֥ר בְּ/גִבְעֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/012.yaml
  text: They took all the men and went to fight against Ishmael son of Nethaniah[a], and they found him by the great waters that are in Gibeon.
  footnotes:
  - marker: a
    text: Or 'by the abundant waters' or 'at the large pool in Gibeon.' The Hebrew literally says 'by the many/great waters that are in Gibeon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 모든 사람을 데리고 가서, 이스마엘 곧 느다냐의 아들을 치러 갔습니다. 그리고 기브온에 있는 큰 물가에서 그를 발견했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 물가’는 히브리어 ‘많은/큰 물들’의 직역에 가까우며, 큰 저수지나 물가를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: They took
  chosen_korean: 데리고 가서
  alternatives_korean:
  - 데려갔습니다
  - 취했습니다
  lexicon: HALOT
  rationale: 전쟁 문맥에서 뒤따르는 동작을 자연스럽게 이어 주면서, 단순한 ‘취하다’보다 동반 이동의 뜻을 살려 표현했습니다.
- source_word: כָּל הָאֲנָשִׁים
  english_pob_choice: all the men
  chosen_korean: 모든 사람을
  alternatives_korean:
  - 모든 남자들을
  - 모든 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수형을 반영하되, 한국어에서는 전투에 동원된 집단을 포괄하는 자연스러운 표현으로 옮겼습니다.
- source_word: לְהִלָּחֵם עִם
  english_pob_choice: to fight against
  chosen_korean: 치러 갔습니다
  alternatives_korean:
  - 싸우러 갔습니다
  - 맞서 싸우러 갔습니다
  lexicon: HALOT
  rationale: 히브리어의 적대적 목적을 분명히 하면서도, ‘~를 치다’라는 한국어 관용으로 전투 의도를 간결하게 드러냈습니다.
- source_word: אֶל מַיִם רַבִּים אֲשֶׁר בְּגִבְעוֹן
  english_pob_choice: by the great waters that are in Gibeon
  chosen_korean: 기브온에 있는 큰 물가에서
  alternatives_korean:
  - 기브온에 있는 많은 물에서
  - 기브온에 있는 큰 물들 곁에서
  lexicon: HALOT
  rationale: מַיִם רַבִּים의 문자적 이미지를 살리면서, 위치 부사구는 한국어에서 가장 자연스러운 ‘~에서’로 처리했습니다. ‘큰 물가’는 큰 물을 가리키는 지형적 표현으로 읽히게 합니다.
