id: JER.41.10
reference: Jeremiah 41:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֣שְׁבְּ יִ֠שְׁמָעֵאל אֶת כָּל שְׁאֵרִ֨ית הָ/עָ֜ם אֲשֶׁ֣ר בַּ/מִּצְפָּ֗ה אֶת בְּנ֤וֹת הַ/מֶּ֨לֶךְ֙ וְ/אֶת כָּל הָ/עָם֙ הַ/נִּשְׁאָרִ֣ים בַּ/מִּצְפָּ֔ה אֲשֶׁ֣ר הִפְקִ֗יד נְבֽוּזַרְאֲדָן֙ רַב טַבָּחִ֔ים אֶת גְּדַלְיָ֖הוּ בֶּן אֲחִיקָ֑ם וַ/יִּשְׁבֵּ/ם֙ יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֔ה וַ/יֵּ֕לֶךְ לַ/עֲבֹ֖ר אֶל בְּנֵ֥י עַמּֽוֹן׀־־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/010.yaml
  text: Then Ishmael took captive all the remnant of the people who were in Mizpah—the king’s daughters and all the people who were left in Mizpah[a], whom Nebuzaradan the captain of the guard had entrusted to Gedaliah son of Ahikam[b]. Ishmael son of Nethaniah took them captive and went to cross over to the Ammonites.
  footnotes:
  - marker: a
    text: Or 'carried away captive.' The Hebrew verb emphasizes seizure into captivity.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Ammon,' that is, the Ammonites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스마엘이 미스바에 있던 남은 모든 백성, 곧 왕의 딸들과 느부사라단 경호대장이 아히감의 아들 그달리야에게 맡겼던 미스바에 남아 있던 모든 백성을 사로잡았습니다[a]. 느다니야의 아들 이스마엘은 그들을 사로잡고 암몬 사람들에게로[b] 건너가려고 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로로 끌고 갔습니다’. 히브리어 동사는 포획하여 포로로 만드는 뜻을 강하게 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘암몬의 자손’이라고 되어 있으며, 곧 암몬 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּ / וַיִּשְׁבֵּם
  english_pob_choice: took captive / took them captive
  chosen_korean: 사로잡아 갔습니다
  alternatives_korean:
  - 포로로 끌고 갔습니다
  - 사로잡았습니다
  - 붙잡아 갔습니다
  lexicon: HALOT
  rationale: שׁבה의 강한 강제적 포획 의미를 살리기 위해 단순한 ‘데려갔습니다’보다 ‘사로잡아 갔습니다’를 택했습니다. 중복 동사로 히브리어의 반복 강조도 반영했습니다.
- source_word: שְׁאֵרִית הָעָם
  english_pob_choice: the remnant of the people
  chosen_korean: 남은 백성
  alternatives_korean:
  - 백성의 남은 자
  - 남아 있던 백성
  - 백성의 나머지
  lexicon: HALOT
  rationale: 예레미야서에서 שְׁאֵרִית은 단순한 ‘나머지’보다 생존한 ‘남은 자/남은 무리’의 뉘앙스가 있어 ‘남은 백성’으로 옮겼습니다.
- source_word: הִפְקִיד
  english_pob_choice: had entrusted
  chosen_korean: 맡겨 두었던
  alternatives_korean:
  - 맡겨 두었다
  - 책임지게 했던
  - 관리하게 했던
  lexicon: HALOT
  rationale: 단순 임명보다 사람들을 특정 인물에게 ‘맡기다’는 관계를 드러내는 동사로 옮기되, 이미 처리된 조치의 배경을 보여 주는 과거완료 느낌을 살렸습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 호위대장
  - 경비대장
  - 시위대장
  lexicon: HALOT
  rationale: 이 관직은 문맥상 왕실 경호/호위 책임자를 가리키므로, 한국어로는 기능을 드러내는 ‘경호대장’이 가장 자연스럽습니다. ‘집행자들의 우두머리’처럼 어원만 살린 표현은 오해를 낳을 수 있습니다.
- source_word: לַעֲבֹר אֶל
  english_pob_choice: to cross over to
  chosen_korean: 건너가려고
  alternatives_korean:
  - 가려고
  - 건너가서
  - 지나가려고
  lexicon: HALOT
  rationale: עבר + אל의 이동 방향을 살려 단순한 ‘가다’보다 ‘건너가다’를 택했습니다. 대상 방향도 문장 전체에서 암몬 쪽으로 향함을 드러냅니다.
- source_word: בְּנֵי עַמּוֹן
  english_pob_choice: the Ammonites
  chosen_korean: 암몬 자손
  alternatives_korean:
  - 암몬 사람들
  - 암몬 족속
  - 암몬인들
  lexicon: HALOT
  rationale: 히브리어의 בני는 친족/민족 집단을 가리키는 표준 표현이므로, 성경적 문체를 유지하면서도 직역성이 있는 ‘자손’을 사용했습니다.
theological_decisions:
- issue: ‘이사야엘이 … 사로잡아 갔습니다’의 폭력성과 포로화 표현
  chosen_reading: 포획 행위를 완곡하게 누그러뜨리지 않고 ‘사로잡아’로 직접 드러냈습니다.
  alternative_readings:
  - ‘데려갔습니다’처럼 중화된 표현
  - ‘붙잡았습니다’처럼 단순 체포에 가까운 표현
  rationale: 본문은 단순 이동이 아니라 전쟁/폭력 상황 속의 포로화를 말하므로, 독자가 사건의 잔혹성을 바로 이해하도록 강한 동사를 유지해야 합니다.
  doctrine_reference: 본문 서술의 사실성과 폭력성 보존 원칙
- issue: ‘느부사라단 … 사반의 아들 그달리야에게 맡겨 두었던’의 구조
  chosen_reading: 느부사라단이 그달리야에게 사람들을 위탁해 둔 행정적 질서를 한국어로 풀어 주었습니다.
  alternative_readings:
  - ‘임명한’이라고만 옮기는 방식
  - ‘지휘하게 한’으로 좁히는 방식
  rationale: hebrew הִפְקִיד은 단순 임명보다 책임 위탁을 포함하므로, 문맥의 행정적 위임과 보호 책임을 함께 드러내는 표현이 적절합니다.
  doctrine_reference: 문맥적 의미 우선 원칙
