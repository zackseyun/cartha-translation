revisions:
- from: 그때 이스마엘이 미스바에 있던 남은 백성 모두—왕의 딸들과, 느부사라단 경호대장이 사반의 아들 그달리야에게 맡겨 두었던 미스바에 남아 있던 모든 백성을—사로잡아 갔습니다. 이스마엘은 느다니야의 아들이었고, 암몬 자손에게로 건너가려고 떠났습니다.[a][b]
  to: 그때 이스마엘이 미스바에 있던 남은 모든 백성, 곧 왕의 딸들과 느부사라단 경호대장이 아히감의 아들 그달리야에게 맡겼던 미스바에 남아 있던 모든 백성을 사로잡았습니다[a]. 느다니야의 아들 이스마엘은 그들을 사로잡고 암몬 사람들에게로[b] 건너가려고 떠났습니다.
  rationale: 원문 WLC를 따라 그달리야의 부친을 ‘아히감’으로 바로잡고, 이스마엘이 ‘그들을 사로잡았다’는 후반 동사를 복원했습니다. 또한 ‘느다니야의 아들 이스마엘’을 후반 행동절의 주어로 유지하여 원문의 문장 진행을 반영했습니다. 각주는 각각 관련 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:26:46Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 히브리어 본문은 느부사라단이 사람들을 ‘아히감의 아들 그달리야’에게 맡겼다고 하는데, 초안은 이를 ‘사반의 아들 그달리야’로 잘못 옮겼습니다. 또한 וַיִּשְׁבֵּם(‘그들을 사로잡았다’)의 두 번째 반복을 빠뜨리고, 이스마엘의 부칭을 독립된 서술로 바꾸어 놓았습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽게 읽히며, 긴 수식 관계는 대시로 구분하여 원문의 열거와 관계절을 명료하게 유지합니다.
  terminology: ‘사로잡았습니다’는 שׁבה의 포로화 의미를 충실히 전달합니다. ‘경호대장’, ‘암몬 사람들’, ‘아히감의 아들 그달리야’는 문맥 및 고유명사에 적절합니다. ‘암몬 자손’도 가능한 직역이나, 본문에는 현대 한국어에서 자연스러운 민족명인 ‘암몬 사람들’을 사용했습니다.
  issues:
  - severity: high
    issue: 그달리야의 부친이 ‘사반’으로 되어 있습니다.
    rationale: 원문은 גְּדַלְיָהוּ בֶּן־אֲחִיקָם, 즉 ‘아히감의 아들 그달리야’라고 합니다. 사반은 본절의 원문에 없으므로 고유명사 및 계보의 실질적 오류입니다.
  - severity: high
    issue: 두 번째 ‘사로잡다’(וַיִּשְׁבֵּם)가 번역에서 누락되었습니다.
    rationale: 원문은 이스마엘이 남은 사람들을 사로잡았음을 두 차례 명시합니다. 후반부 동사를 보존해야 원문의 반복 강조와 사건 서술이 유지됩니다.
