    rationale: 히브리어는 ‘느다니야의 아들 이스마엘이 그들을 사로잡고, 암몬 사람들에게로 건너가려고 갔다’라고 주어를 재명시하며 행동을 계속합니다. 독립적인 신분 설명으로 바꾸지 않는 편이 더 충실합니다.
