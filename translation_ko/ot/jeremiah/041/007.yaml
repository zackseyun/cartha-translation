- from: 그들이 도시 한가운데로 들어갔을 때, 네다냐의 아들 이스마엘이 그들을 죽이고 그들을 우물 한가운데로 던졌습니다. 그와 그와 함께한 사람들도 그러했습니다.[a]
  to: 그들이 도시 한가운데로 들어갔을 때, 네다냐의 아들 이스마엘과 그와 함께 있던 사람들이 그들을 학살하여 저수조 한가운데에 던졌습니다.[a]
  rationale: The revision preserves the temporal and repeated spatial wording of the Hebrew, restores the collective and violent sense of the killing verb, renders the cistern with a contextually precise Korean term, and makes Ishmael and his accompanying men joint agents of the action. The footnote anchor remains attached to the translated term for בּוֹר and preserves the lexical ambiguity.
