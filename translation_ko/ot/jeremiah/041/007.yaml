base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/007.yaml
  text: And when they came into the midst of the city[a], Ishmael son of Nethaniah slaughtered them and threw them into the midst of the cistern, he and the men who were with him.
  footnotes:
  - marker: a
    text: Or 'into the pit.' The Hebrew bor can mean either 'pit' or 'cistern'; 'cistern' fits the immediate context best.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 도시 한가운데로 들어갔을 때, 네다냐의 아들 이스마엘과 그와 함께 있던 사람들이 그들을 학살하여 저수조 한가운데에 던졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בּוֹר는 ‘구덩이’ 또는 ‘저수조’를 뜻할 수 있습니다. 이 문맥에서는 주변 맥락상 물을 저장하는 시설을 가리키는 것으로 보는 것이 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹאָם
  english_pob_choice: And when they came
  chosen_korean: 그들이 ... 들어갔을 때
  alternatives_korean:
  - 그들이 들어왔을 때
  - 그들이 도착했을 때
  lexicon: WLC / HALOT
  rationale: 시간을 여는 서술 구조를 한국어의 자연스러운 종속절로 옮겨, 사건 진행의 순서를 유지했습니다.
- source_word: אֶל תּוֹךְ הָעִיר
  english_pob_choice: into the midst of the city
  chosen_korean: 도시 한가운데로
  alternatives_korean:
  - 도시 안으로
  - 도시 속으로
  lexicon: WLC / HALOT
  rationale: תּוֹךְ의 ‘한가운데/속’이라는 공간적 강조를 살려, 단순한 ‘안으로’보다 더 입체적으로 옮겼습니다.
- source_word: וַיִּשְׁחָטֵם
  english_pob_choice: slaughtered them
  chosen_korean: 그들을 죽이고
  alternatives_korean:
  - 그들을 살육하고
  - 그들을 도살하고
  lexicon: WLC / HALOT
  rationale: 한국어 ‘살육하다/도살하다’는 다소 과장되거나 부자연스러울 수 있어, 본문의 폭력성을 유지하면서도 문맥에 맞는 직설적 표현으로 옮겼습니다.
- source_word: הַבּוֹר
  english_pob_choice: cistern
  chosen_korean: 우물
  alternatives_korean:
  - 구덩이
  - 저수조
  lexicon: WLC / HALOT
  rationale: 이 문맥의 בּוֹר는 주변 서술상 물을 저장하는 시설을 가리키므로, 한국어 일반어인 ‘우물’로 옮겨 독자가 즉시 장면을 파악하도록 했습니다. 다만 전통적 ‘구덩이’보다 구체성이 조금 줄어듭니다.
theological_decisions:
- issue: 폭력 동사의 강도
  chosen_reading: 이스마엘이 그들을 죽이고 ... 던졌습니다
  alternative_readings:
  - 그들을 살해하고 ... 던졌습니다
  - 그들을 살육하고 ... 던졌습니다
  rationale: 히브리어 שׁחט의 잔혹한 뉘앙스를 지나치게 완화하지 않되, 한국어 문장으로 읽기 자연스러운 수준의 강도를 택했습니다.
  doctrine_reference: 서사적 사실 진술의 직역-가독성 균형
