revisions:
- from: 그때 여호야난 곧 가레아의 아들, 그리고 그와 함께 있던 군사들의 지휘관들은, 미스바에서 느다냐의 아들 이스마엘에게서, 곧 그가 사반의 아들 그달랴를 죽인 뒤에 데려가 놓았던 그 백성의 남은 자를—병사들과 전쟁하는 사람들, 여자들과 어린아이들과 궁정 관리들을—모두 데리고 갔습니다. 그들은 그가 기브온에서 데려온 사람들이었습니다.[a][b]
  to: 그때 가레아의 아들 요하난과 그와 함께 있던 군대 지휘관들은, 느다냐의 아들 이스마엘에게서 되찾은[a] 백성 가운데 남은 사람들, 곧 이스마엘이 아히감의 아들 그달랴를 죽인 뒤 미스바에서 데려간 사람들—남자들, 전사들, 여자들, 어린아이들, 그리고 궁정 관리들[b]—을 모두 데리고 갔습니다. 요하난은 그들을 기브온에서 데려왔습니다.
  rationale: 원문을 우선하여 인명 오류를 바로잡고, 요하난이 이스마엘에게서 사람들을 ‘되찾은’ 행위와 이스마엘이 미스바에서 그들을 데려간 행위를 구별했습니다. 마지막 ‘기브온에서 데려온’ 절은 히브리어 단수 동사의 선행사인 요하난을 명시했습니다. סָרִיסִים의 의미 범위는 본문과 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
