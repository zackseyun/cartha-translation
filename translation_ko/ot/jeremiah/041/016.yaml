id: JER.41.16
reference: Jeremiah 41:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֩ יוֹחָנָ֨ן בֶּן קָרֵ֜חַ וְ/כָל שָׂרֵ֧י הַ/חֲיָלִ֣ים אֲשֶׁר אִתּ֗/וֹ אֵ֣ת כָּל שְׁאֵרִ֤ית הָ/עָם֙ אֲשֶׁ֣ר הֵ֠שִׁיב מֵ/אֵ֨ת יִשְׁמָעֵ֤אל בֶּן נְתַנְיָה֙ מִן הַ/מִּצְפָּ֔ה אַחַ֣ר הִכָּ֔ה אֶת גְּדַלְיָ֖ה בֶּן אֲחִיקָ֑ם גְּבָרִ֞ים אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וְ/נָשִׁ֤ים וְ/טַף֙ וְ/סָ֣רִסִ֔ים אֲשֶׁ֥ר הֵשִׁ֖יב מִ/גִּבְעֽוֹן־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/016.yaml
  text: 'Then Yohanan son of Kareah[a], and all the commanders of the forces who were with him, took all the remnant of the people whom he had recovered from Ishmael son of Nethaniah, from Mizpah, after he had struck down Gedaliah son of Ahikam: the soldiers, the men of war, and the women, and the little children, and the court officials[b], whom he had brought back from Gibeon.'
  footnotes:
  - marker: a
    text: Or 'had brought back' for 'had recovered' (Hebrew הֵשִׁיב), emphasizing restoration rather than rescue.
    reason: lexical_alternative
  - marker: b
    text: Or 'eunuchs' for 'court officials'; the Hebrew סָרִיסִים can refer either to literal eunuchs or to royal officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호야난 곧 가레아의 아들, 그리고 그와 함께 있던 군사들의 지휘관들은, 미스바에서 느다냐의 아들 이스마엘에게서, 곧 그가 사반의 아들 그달랴를 죽인 뒤에 데려가 놓았던 그 백성의 남은 자를—병사들과 전쟁하는 사람들, 여자들과 어린아이들과 궁정 관리들을—모두 데리고 갔습니다. 그들은 그가 기브온에서 데려온 사람들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘되찾았던’으로도 옮길 수 있습니다. 히브리어 הֵשִׁיב은 ‘돌려보내다/회복하다’의 뜻을 가지며, 여기서는 사람들을 다시 확보해 온 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내시들’로도 옮길 수 있습니다. 히브리어 סָרִיסִים는 문자적 내시 또는 궁정 관리들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: Then ... took
  chosen_korean: 데리고 갔습니다
  alternatives_korean:
  - 잡아 갔습니다
  - 데려갔습니다
  lexicon: HALOT
  rationale: 이 서술은 단순한 ‘취하다’보다 사람들을 함께 옮겨 온다는 서사적 진행을 드러내므로, 현대 한국어에서 자연스럽고 장면에 맞는 ‘데리고 갔습니다’를 택했습니다.
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of the forces
  chosen_korean: 군사들의 지휘관들
  alternatives_korean:
  - 부대의 지휘관들
  - 군대의 장관들
  lexicon: HALOT
  rationale: שָׂרֵי는 ‘지휘관들/우두머리들’이고 חָיִל은 여기서 군사력의 집합을 가리키므로, ‘군사들의 지휘관들’이 가장 सीधे하게 대응합니다.
- source_word: שְׁאֵרִית הָעָם
  english_pob_choice: the remnant of the people
  chosen_korean: 그 백성의 남은 자
  alternatives_korean:
  - 그 백성의 남은 무리
  - 사람들의 남은 자
  lexicon: HALOT
  rationale: ‘남은 자’는 예언서적 문맥의 잔존·생존 뉘앙스를 살리며, ‘remnant’에 대응하는 표준적인 한국어 표현입니다.
- source_word: הֵשִׁיב
  english_pob_choice: had recovered
  chosen_korean: 데려가 놓았던
  alternatives_korean:
  - 되찾았던
  - 데려왔던
  lexicon: HALOT
  rationale: 히필 שוב는 ‘되돌리다/회복시키다’의 의미를 가지지만, 여기서는 인물들을 다시 확보해 데려온 상황이므로 ‘데려가 놓았던’이 원문의 되찾음과 운반 감각을 함께 살립니다.
- source_word: סָרִסִים
  english_pob_choice: the court officials
  chosen_korean: 궁정 관리들
  alternatives_korean:
  - 내시들
  - 환관들
  lexicon: HALOT
  rationale: סָרִיס는 문맥에 따라 내시 또는 관리를 뜻할 수 있으나, 본문은 왕실/행정 맥락이므로 신체 상태를 단정하지 않는 ‘궁정 관리들’이 적절합니다.
theological_decisions:
- issue: ‘남은 자’(שְׁאֵרִית) 보존
  chosen_reading: ‘그 백성의 남은 자’로 옮겨, 심판 이후에도 남겨진 공동체라는 예언서적 긴장을 보존했습니다.
  alternative_readings:
  - ‘그 백성의 나머지’
  - ‘그 백성의 생존자들’
  rationale: 이 절은 단순한 인원 집계를 넘어, 재앙 이후에도 남은 공동체를 가리키는 예언서의 신학적 어휘를 사용하므로 그 함의를 약화하지 않았습니다.
  doctrine_reference: 예레미야서의 ‘남은 자’ 주제
- issue: ‘궁정 관리들’의 성적 상태 비단정
  chosen_reading: סָרִיסִים을 ‘궁정 관리들’로 두어, 문자적 ‘내시’ 가능성을 배제하지 않되 본문이 요구하지 않는 신체적 단정을 피했습니다.
  alternative_readings:
  - ‘내시들’
  - ‘환관들’
  rationale: 해당 용어는 복수의 의미 범위를 가지며, 여기서는 신분/직분을 전달하는 것이 우선이므로 좁은 생물학적 해석을 확정하지 않았습니다.
  doctrine_reference: 본문의 역사·행정적 문맥
