  yaml_path: translation/ot/jeremiah/041/015.yaml
  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
  footnotes:
  - marker: a
    text: 'Hebrew: ''and Ishmael''; the conjunction may be rendered ''and,'' but ''but'' brings out the contrast with the preceding narrative context.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from before Johanan,' an idiom meaning escape from his presence or pursuit.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''to the sons of Ammon,'' that is, the Ammonites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 이스마엘은 느다냐의 아들로서 여호난의 손에서 여덟 사람과 함께 도망쳐서 암몬 사람들에게로 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그리고 이스마엘’이지만, 앞 절과의 대비를 드러내기 위해 ‘그러나’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘여호난 앞에서’이지만, 관용적으로는 그의 추격이나 존재에서 벗어났다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘암몬의 아들들’입니다. 곧 암몬 사람들, 즉 암몬 족속을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל
  english_pob_choice: But Ishmael
  chosen_korean: 그러나 이스마엘
  alternatives_korean:
  - 그리고 이스마엘
  - 그런데 이스마엘
  lexicon: WLC; HALOT
  rationale: וְ는 단순한 접속이지만 앞 절과의 대비가 분명하므로 ‘그러나’로 옮겨 서술의 반전을 살렸습니다. 인명은 음역하되 현대 한국어 성경에서 통용되는 형태인 ‘이스마엘’을 사용했습니다.
- source_word: בֶּן נְתַנְיָה
  english_pob_choice: son of Nethaniah
  chosen_korean: 느다냐의 아들
  alternatives_korean:
  - 네다냐의 아들
  - 느다냐의 아들
  lexicon: WLC; HALOT
  rationale: 히브리어 족칭 구조를 자연스러운 소유격으로 옮겼습니다. 고유명사는 한국어 성경에서 널리 쓰이는 ‘느다냐’ 형태를 따랐습니다.
- source_word: נִמְלַט
  english_pob_choice: escaped
  chosen_korean: 도망쳐서
  alternatives_korean:
  - 달아나서
  - 벗어나서
  - 탈출하여
  lexicon: WLC; HALOT
  rationale: 니팔형의 ‘피하다/벗어나다’ 의미를 이 문맥의 추격 상황에 맞게 ‘도망쳐서’로 옮겨, 단순 이동이 아니라 위기에서의 탈출을 분명히 했습니다.
- source_word: מִ/פְּנֵי יֽוֹחָנָן
  english_pob_choice: from Johanan
  chosen_korean: 여호난의 손에서
  alternatives_korean:
  - 여호난 앞에서
  - 여호난의 얼굴 앞에서
  - 여호난에게서
  lexicon: WLC; HALOT
  rationale: 직역하면 ‘여호난 앞에서’이지만, 한국어에서는 추격과 위협에서 벗어남을 나타내는 관용으로 ‘손에서’가 더 분명합니다. 이는 영어 주석이 밝힌 ‘from before Johanan’의 관용적 뜻을 한국어로 자연스럽게 드러냅니다.
- source_word: בִּ/שְׁמֹנָה אֲנָשִׁים
  english_pob_choice: with eight men
  chosen_korean: 여덟 사람과 함께
  alternatives_korean:
  - 여덟 명과 함께
  - 여덟 사람을 거느리고
  - 여덟 사람과 더불어
  lexicon: WLC; HALOT
  rationale: 부사적 동반 관계를 자연스럽게 살려 ‘함께’로 옮겼습니다. ‘사람’은 본문의 אישים에 해당하는 일반적 표현입니다.
- source_word: אֶל בְּנֵי עַמּוֹן
  english_pob_choice: to the Ammonites
  chosen_korean: 암몬 사람들에게로
  alternatives_korean:
  - 암몬 자손에게로
  - 암몬인들에게로
  - 암몬의 자손에게로
  lexicon: WLC; HALOT
  rationale: ‘암몬의 아들들’이라는 직역 대신 민족 집단을 가리키는 관용적 표현을 살려 ‘암몬 사람들’로 옮겼습니다. 방향을 나타내는 אֶל을 반영해 ‘-에게로’로 처리했습니다.
theological_decisions:
- issue: 본문의 전환 어조(וְ를 ‘그러나’로 처리)
  chosen_reading: 앞 절의 실패한 진압 이후 이스마엘의 탈주가 대비되도록 ‘그러나’로 옮겼습니다.
  alternative_readings:
