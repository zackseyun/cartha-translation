  - 또 이스마엘은
  rationale: 이 절은 단순 연속보다 서사적 반전이 핵심이므로, 한국어에서도 대비를 분명히 해야 본문의 흐름이 살아납니다.
  doctrine_reference: 서사 문맥 보존
