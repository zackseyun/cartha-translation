  text: But Ishmael son of Nethaniah escaped from Johanan with eight men and went to the Ammonites[a][b][c].
  footnotes:
  - marker: a
    text: 'Hebrew: ''and Ishmael''; the conjunction may be rendered ''and,'' but ''but'' brings out the contrast with the preceding narrative context.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from before Johanan,' an idiom meaning escape from his presence or pursuit.
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew: ''to the sons of Ammon,'' that is, the Ammonites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 느다냐의 아들 이스마엘은 여덟 사람과 함께 요하난에게서 도망쳐 암몬 사람들에게로 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그리고 이스마엘’이지만, 앞 절과의 대비를 드러내기 위해 ‘그러나’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘요하난의 앞에서’입니다. 관용적으로는 요하난에게서, 또는 그의 추격을 피해 벗어났다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘암몬의 아들들’입니다. 곧 암몬 사람들, 즉 암몬 족속을 가리킵니다.
    reason: lexical_alternative
