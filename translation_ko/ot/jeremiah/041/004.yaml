  - 사람은 아무도 그것을 알지 못했습니다
  lexicon: HALOT
  rationale: 히브리어는 목적어를 생략하지만 문맥상 방금 언급된 살해 사건을 가리키므로, 한국어에서는 지시대명사로 분명히 했습니다. ‘아직’은 사건이 알려지지 않은 상태의 지속성을 드러냅니다.
