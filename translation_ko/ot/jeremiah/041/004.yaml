  text: And it happened on the second day after he had killed Gedaliah[a], when no man yet knew it,
  footnotes:
  - marker: a
    text: 'Hebrew: ''and no man knew.'' The object (''it,'' referring to Gedaliah''s killing) is implied in the Hebrew and supplied in English for clarity.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그달리야를 죽인 지 둘째 날에 일이 있었는데, 아무도 아직 그것을 알지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “아무도 알지 못했다”입니다. 목적어는 앞에서 언급한 그달리야의 살해를 가리키며, 영어 본문처럼 이해를 위해 보충될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
