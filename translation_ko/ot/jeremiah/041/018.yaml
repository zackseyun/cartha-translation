id: JER.41.18
reference: Jeremiah 41:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/פְּנֵי֙ הַ/כַּשְׂדִּ֔ים כִּ֥י יָרְא֖וּ מִ/פְּנֵי/הֶ֑ם כִּֽי הִכָּ֞ה יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֗ה אֶת גְּדַלְיָ֨הוּ֙ בֶּן אֲחִיקָ֔ם אֲשֶׁר הִפְקִ֥יד מֶֽלֶךְ בָּבֶ֖ל בָּ/אָֽרֶץ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/018.yaml
  text: because of the Chaldeans[a], for they were afraid of them, because Ishmael son of Nethaniah had struck down Gedaliah son of Ahikam[c][b], whom the king of Babylon had appointed over the land.
  footnotes:
  - marker: a
    text: Or 'the Babylonians' for 'the Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: Or 'had killed'; the Hebrew verb is literally 'had struck,' here in a lethal context.
    reason: lexical_alternative
  - marker: c
    text: Or 'had set over the land' / 'had put in charge of the land.'
    reason: lexical_alternative
translation:
  language: ko
  text: 갈대아인들[a] 때문에, 그들을 두려워하였기 때문입니다. 이는 느다냐의 아들 이스마엘이 바빌론 왕이 그 땅 위에 세워 둔 아히감의 아들 그달랴를 쳐 죽였기[b] 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌론 사람들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘죽였기’; 히브리어 동사는 문자적으로 ‘쳤다’이지만, 여기서는 치명적인 문맥입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 땅 위에 세웠기’ / ‘그 땅을 다스리도록 세웠기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּנֵי הַכַּשְׂדִּים
  english_pob_choice: because of the Chaldeans
  chosen_korean: 갈대아인들 때문에
  alternatives_korean:
  - 바빌론 사람들 때문에
  - 갈대아인들로 말미암아
  lexicon: HALOT
  rationale: מִפְּנֵי는 여기서 공간보다 원인을 나타내며, הַכַּשְׂדִּים은 POB의 ‘Chaldeans’를 따라 ‘갈대아인들’로 옮겼습니다.
- source_word: יָרְאוּ מִפְּנֵיהֶם
  english_pob_choice: they were afraid of them
  chosen_korean: 그들을 두려워하였기 때문입니다
  alternatives_korean:
  - 그들 앞에서 두려워하였기 때문입니다
  - 그들을 무서워하였기 때문입니다
  lexicon: HALOT
  rationale: יָרֵא의 두려움 표현을 자연스러운 현대 한국어로 살리되, 앞 절의 원인을 풀어 설명하는 문맥을 반영했습니다.
- source_word: הִכָּה
  english_pob_choice: had struck down
  chosen_korean: 쳐 죽였기
  alternatives_korean:
  - 쳤기
  - 죽였기
  lexicon: HALOT
  rationale: 히브리어의 ‘치다’라는 동작성을 보존하면서, 여기서는 실제로 죽음에 이른 문맥이므로 POB의 ‘struck down’에 맞춰 ‘쳐 죽이다’로 옮겼습니다.
- source_word: הִפְקִיד
  english_pob_choice: had appointed
  chosen_korean: 세워 둔
  alternatives_korean:
  - 임명한
  - 맡겨 둔
  - 그 땅을 다스리도록 세운
  lexicon: HALOT
  rationale: הִפְקִיד은 단순 임명보다 ‘책임을 맡겨 세워 둠/세움’의 뉘앙스가 있어, POB의 행정적 맥락을 살린 ‘세워 둔’으로 옮겼습니다.
theological_decisions:
- issue: 바빌론 왕이 그달랴를 ‘어디에’ 세웠는가의 표현
  chosen_reading: ‘그 땅 위에 세워 둔’으로 행정적 관할과 배치를 함께 드러냈습니다.
  alternative_readings:
  - ‘그 땅에 세운’
  - ‘그 땅을 다스리도록 세운’
  rationale: אֶרֶץ는 단순한 장소가 아니라 통치 영역을 가리킬 수 있으므로, 문맥상 ‘over the land’의 행정적 의미를 살려 읽었습니다.
  doctrine_reference: 역사 서술의 행정적 의미 보존
- issue: ‘쳐 죽였다’의 동작성과 결과성
  chosen_reading: 동작성을 살리되 결과가 분명한 ‘쳐 죽였기’를 택했습니다.
  alternative_readings:
  - ‘죽였기’
  - ‘쳐서 죽였기’
  rationale: POB가 문맥상 lethal context에서 ‘had struck down’를 택한 이유를 따르며, 히브리어의 폭력적 행위를 희석하지 않도록 했습니다.
  doctrine_reference: 본문의 폭력 서술 보존
