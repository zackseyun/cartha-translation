base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/017.yaml
  text: So they went and stayed at Geruth Chimham[a], which is beside Bethlehem[b], intending to go on into Egypt.
  footnotes:
  - marker: a
    text: Or 'the lodging-place of Chimham.' The Hebrew בְּגֵרוּת likely functions here as a place-name ('Geruth'), but it may also denote a lodging or sojourning place associated with Chimham.
    reason: lexical_alternative
  - marker: b
    text: The written form in the provided text appears irregular; context supports the proper name 'Chimham,' known from 2 Samuel 19:37–40 and associated with a site near Bethlehem.
    reason: textual_variant
translation:
  language: ko
  text: 그들은 가서 베들레헴 곁에 있는 게룻[a] 김함[b]에 머물렀으며, 이집트로 들어가려고 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘게룻’은 이 구절에서 지명으로 읽는 것이 가장 자연스럽지만, ‘유숙하는 곳’ 또는 ‘머무는 곳’이라는 일반 명사로 이해할 가능성도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘김함’에 해당하는 본문의 자음 형태는 다소 불규칙하게 보입니다. 그러나 문맥과 베들레헴 근처의 김함 관련 장소를 언급하는 사무엘하 19:37–40에 비추어, 이를 ‘김함’으로 이해하는 것이 타당합니다.
    reason: textual_variant
