  edition: WLC
  text: וַ/יָּקָם֩ יִשְׁמָעֵ֨אל בֶּן נְתַנְיָ֜ה וַ/עֲשֶׂ֥רֶת הָ/אֲנָשִׁ֣ים אֲשֶׁר הָי֣וּ אִתּ֗/וֹ וַ֠/יַּכּוּ אֶת גְּדַלְיָ֨הוּ בֶן אֲחִיקָ֧ם בֶּן שָׁפָ֛ן בַּ/חֶ֖רֶב וַ/יָּ֣מֶת אֹת֑/וֹ אֲשֶׁר הִפְקִ֥יד מֶֽלֶךְ בָּבֶ֖ל בָּ/אָֽרֶץ־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/002.yaml
  text: Then Ishmael son of Nethaniah rose up with the ten men who were with him[a], and they struck down Gedaliah son of Ahikam, son of Shaphan, with the sword, and killed him—the one whom the king of Babylon had appointed over the land.
  footnotes:
  - marker: a
    text: Or 'struck Gedaliah ... with the sword and put him to death.' The Hebrew uses two verbs in sequence for the assault and its fatal outcome.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 네탄야의 아들 이스마엘이 자기와 함께 있던 열 명의 사람과 함께 일어나 바빌론 왕이 그 땅을 다스리도록 세운 아히감의 아들, 사판의 손자 그달랴를 칼로 쳐 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼로 그달랴를 쳐서 죽였다.’ 히브리어는 공격과 그 치명적 결과를 잇달아 표현합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: rose up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어섰습니다
  - 반역하여 일어났습니다
  lexicon: HALOT
  rationale: 호전적 행동의 개시를 나타내는 동사를 과장 없이 살리되, ‘반역하여’ 같은 해석어는 본문에 없는 의미를 덧붙일 수 있어 피했습니다.
- source_word: וַעֲשֶׂרֶת הָאֲנָשִׁים
  english_pob_choice: the ten men
  chosen_korean: 열 명의 사람
  alternatives_korean:
  - 열 사람
  - 그 열 명
  lexicon: HALOT
  rationale: 구체적으로 동행한 인원을 자연스러운 현대 한국어로 옮기되, 영어 POB의 정관사 처리처럼 특정 동인 무리를 가리키는 뉘앙스는 문맥에서 유지했습니다.
- source_word: וַיַּכּוּ ... בַּחֶרֶב וַיָּמֶת אֹתוֹ
  english_pob_choice: struck down ... with the sword, and killed him
  chosen_korean: 칼로 쳐 죽였습니다
  alternatives_korean:
  - 칼로 쳤고 죽였습니다
  - 칼로 쳐서 죽였습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 동사 구조가 ‘때림’과 ‘죽임’의 결과를 함께 말하므로, 한국어에서는 한 번의 결합 동사로 자연스럽게 재현했습니다.
- source_word: אֲשֶׁר הִפְקִיד ... בָּאָרֶץ
  english_pob_choice: whom ... had appointed over the land
  chosen_korean: 그 땅을 다스리도록 세운
  alternatives_korean:
  - 그 땅에 임명한
  - 그 땅을 맡긴
  lexicon: HALOT
  rationale: הִפְקִיד는 단순한 임명보다 ‘책임을 맡겨 관리하게 하다’의 뜻이 있어, 통치·관리의 지위를 드러내는 ‘다스리도록 세운’으로 옮겼습니다.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם בֶּן שָׁפָן
  english_pob_choice: Gedaliah son of Ahikam, son of Shaphan
  chosen_korean: 아히감의 아들, 사판의 손자 그달랴
  alternatives_korean:
  - 그달랴, 아히감의 아들이며 사판의 손자
  - 아히감과 사판의 후손인 그달랴
  lexicon: HALOT
  rationale: 히브리어 계보 순서를 그대로 따라 인물 식별 정보를 보존했고, 한국어에서는 관계를 가장 명료하게 드러내기 위해 ‘손자’를 사용했습니다.
theological_decisions:
- issue: 본문의 살해 동사 연쇄를 한국어에서 얼마나 분리해 표현할지
  chosen_reading: ‘칼로 쳐 죽였습니다’로 결합해, 공격과 치명적 결과를 모두 드러냈습니다.
  alternative_readings:
  - ‘칼로 쳤고 죽였습니다’
  - ‘칼로 쳐서 죽였습니다’
  rationale: 히브리어는 폭행과 죽음을 연속해서 말하므로, 둘 중 하나만 강조하면 본문의 급박한 폭력성과 결과가 약화될 수 있습니다.
  doctrine_reference: '서사 본문 번역 원칙: 동작의 연속성과 결과를 본문이 허락하는 범위 안에서 함께 보존'
