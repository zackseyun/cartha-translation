language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣ת כָּל הַ/יְּהוּדִ֗ים אֲשֶׁר הָי֨וּ אִתּ֤/וֹ אֶת גְּדַלְיָ֨הוּ֙ בַּ/מִּצְפָּ֔ה וְ/אֶת הַ/כַּשְׂדִּ֖ים אֲשֶׁ֣ר נִמְצְאוּ שָׁ֑ם אֵ֚ת אַנְשֵׁ֣י הַ/מִּלְחָמָ֔ה הִכָּ֖ה יִשְׁמָעֵֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/003.yaml
  text: And Ishmael struck down all the Judeans who were with Gedaliah at Mizpah[c][b][a], and the Chaldeans who were found there—the men of war.
  footnotes:
  - marker: a
    text: Or 'the Jews.' The Hebrew term can denote the people of Judah/Judea; in this context 'Judeans' highlights the historical-geographical sense.
    reason: lexical_alternative
  - marker: b
    text: Or 'the Babylonians.' The Hebrew reads 'the Chaldeans.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'the men of war'; that is, the fighting men or soldiers.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스마엘이 미스바에 있던 모든 유다 사람들, 곧 그와 함께 있던 그달리야와 거기에서 발견된 갈대아 사람들, 곧 전투원들을 쳐 죽였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘유대인들’이라고도 옮길 수 있습니다. 히브리어는 여기서 유다/유대 지방의 사람들을 가리킬 수 있으므로, ‘유다 사람들’이 역사적 뉘앙스를 더 잘 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바빌로니아 사람들’이라고도 옮길 수 있습니다. 히브리어는 ‘갈대아 사람들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘전쟁의 사람들’입니다. 곧 전투에 참여하는 사람들, 즉 군사들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְּהוּדִים
  english_pob_choice: the Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다 사람들
  lexicon: HALOT
  rationale: 예레미야의 역사적 문맥에서는 후대의 종교적 민족명보다 유다/유대 지방의 사람들을 가리키는 뜻이 강하므로, ‘유다 사람들’로 옮겨 지리·역사적 뉘앙스를 살렸습니다.
- source_word: אִתּוֹ אֶת־גְּדַלְיָהוּ
  english_pob_choice: who were with Gedaliah
  chosen_korean: 그와 함께 있던 그달리야
  alternatives_korean:
  - 그와 함께 있던 사람들, 곧 그달리야
  - 그달리야와 함께 있던 사람들
  lexicon: HALOT
  rationale: 히브리어의 대명사와 이름 병기는 관계를 강조하지만, 한국어에서는 ‘그와 함께 있던 그달리야’로 자연스럽게 풀어 원문의 연결을 유지했습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 바빌로니아 사람들
  - 갈대아인들
  lexicon: HALOT
  rationale: 원문이 구체적으로 ‘갈대아 사람들’이라 하므로 이를 보존해 역사적 표면감을 유지했습니다. 영어 POB의 대안인 ‘Babylonians’보다 원문 밀착도가 높습니다.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  english_pob_choice: the men of war
  chosen_korean: 전투원들
  alternatives_korean:
  - 전사들
  - 군인들
  - 싸움하는 사람들
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁의 사람들’이지만 현대 한국어에서는 ‘전투원들’이 의미를 비교적 정확하고 간결하게 전달합니다. 주석으로 원문의 직역성을 보완할 수 있습니다.
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳐 죽였습니다
  alternatives_korean:
  - 쳐서 쓰러뜨렸습니다
  - 내려쳤습니다
  - 죽였습니다
  lexicon: HALOT
  rationale: 서술 맥락상 치명타를 가해 살해한 뜻이므로, 단순한 ‘죽였습니다’보다 폭력성과 결과를 함께 드러내는 ‘쳐 죽였습니다’를 택했습니다.
theological_decisions:
- issue: ירמיה 41:3의 폭력 서술을 한국어에서 얼마나 직접적으로 표현할지
  chosen_reading: 사건의 잔혹성을 완화하지 않고 ‘쳐 죽였습니다’로 직접 옮겼습니다.
  alternative_readings:
  - 죽였습니다
  - 쳐서 쓰러뜨렸습니다
  rationale: 원문은 군사적 학살 장면을 담고 있으므로, 완곡어법으로 희석하지 않는 것이 본문의 서술 의도에 더 가깝습니다.
  doctrine_reference: 성경 본문의 역사 서술은 사실성과 충격성을 함께 전달해야 합니다.
