base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/014.yaml
  text: Then all the people whom Ishmael had taken captive from Mizpah turned around and went back to Johanan son of Kareah[a].
  footnotes:
  - marker: a
    text: Or 'whom Ishmael had captured' or more formally 'whom Ishmael had carried away captive.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 이스마엘이 미스바에서 사로잡아 간 모든 백성이 돌아서서, 다시 가레아의 아들 요하난에게로 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “사로잡아 간”은 또는 “포로로 끌고 간”이라고 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֹבּוּ
  english_pob_choice: turned around
  chosen_korean: 돌아서서
  alternatives_korean:
  - 되돌아서서
  - 몸을 돌려
  lexicon: HALOT
  rationale: 방향을 바꾸는 물리적 동작을 자연스럽게 살리면서, 다음 동사 ‘돌아갔습니다’와도 구별되도록 했습니다.
- source_word: אֲשֶׁר שָׁבָה יִשְׁמָעֵאל
  english_pob_choice: whom Ishmael had taken captive
  chosen_korean: 이스마엘이 사로잡아 간
  alternatives_korean:
  - 이스마엘이 포로로 잡아 간
  - 이스마엘이 사로잡은
  lexicon: HALOT
  rationale: שׁבה의 포로로 잡다라는 뜻을 반영해 ‘사로잡아 간’으로 옮겼고, 영어 POB의 과거완료 뉘앙스도 유지했습니다.
- source_word: מִן הַמִּצְפָּה
  english_pob_choice: from Mizpah
  chosen_korean: 미스바에서
  alternatives_korean:
  - 미스바로부터
  - 미스바에서부터
  lexicon: HALOT
  rationale: מן의 단순한 기점 용법을 가장 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: וַיֵּלְכוּ אֶל
  english_pob_choice: went back to
  chosen_korean: 돌아갔습니다
  alternatives_korean:
  - 갔습니다
  - 가서 합류했습니다
  lexicon: HALOT
  rationale: 앞선 ‘돌아서서’와 연결되는 귀환의 흐름을 살려, 단순 이동보다 관계적 복귀의 뉘앙스를 담았습니다.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  english_pob_choice: Johanan son of Kareah
  chosen_korean: 야아시의 아들 요하난
  alternatives_korean:
  - 요하난, 야아시의 아들
  - 카레아의 아들 요하난
  lexicon: HALOT
  rationale: 이름은 한국어 성경에서 널리 쓰이는 음역을 따르되, בֶּן은 혈통 관계를 분명히 하는 ‘아들’로 보존했습니다.
