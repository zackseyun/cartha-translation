    issue: 절을 완결된 과거 문장으로 종결함
    rationale: וַיִּשְׁמַע은 다음 절의 행동에 선행하는 서술이며, 영어 POB도 ‘When ... heard’로 이를 반영합니다. 한국어도 ‘들었을 때’로 연결하는 것이 문맥과 구문을 더 충실히 보존합니다.
  - severity: low
