  yaml_path: translation/ot/jeremiah/041/011.yaml
  text: When Johanan son of Kareah, and all the commanders of the forces who were with him, heard of all the evil that Ishmael son of Nethaniah had done,
translation:
  language: ko
  text: 가레아의 아들 요하난과 그와 함께 있던 모든 군대 지휘관들이 느다냐의 아들 이스마엘이 저지른 모든 악행을 들었을 때,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: When ... heard of
  chosen_korean: 들었습니다
  alternatives_korean:
  - 듣고는
  - 들었을 때
  - 들은 뒤
  lexicon: HALOT
  rationale: 서술 전개를 자연스럽게 살리면서도, 보고된 사건을 전해 들었다는 의미를 한국어 동사 하나로 간명하게 옮겼습니다.
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of the forces
  chosen_korean: 군대 지휘관
  alternatives_korean:
  - 군대의 지휘관들
  - 군사 지휘관
  - 부대 지휘관
  lexicon: HALOT
  rationale: שָׂרֵי는 지휘관/통솔자를 뜻하고, חֲיָלִים은 군사 ძალ력/군대를 가리키므로 현대 한국어의 군사 표현으로 분명하게 옮겼습니다.
- source_word: אֵת כָּל הָרָעָה
  english_pob_choice: of all the evil
  chosen_korean: 행한 모든 악
  alternatives_korean:
  - 저지른 모든 악
  - 행한 모든 재앙
  - 행한 모든 해악
  lexicon: HALOT
  rationale: רָעָה의 도덕적·행위적 무게를 살려 단순한 피해보다 ‘악’으로 옮겼고, 직역 느낌을 유지하기 위해 ‘행한’을 붙였습니다.
- source_word: יוֹחָנָן בֶּן קָרֵחַ
  english_pob_choice: Johanan son of Kareah
  chosen_korean: 여호하난 곧 가레아의 아들
  alternatives_korean:
  - 요하난 곧 가레아의 아들
  - 여호하난, 가레아의 아들
  lexicon: HALOT
  rationale: 히브리식 인명은 한국어 관용 표기보다 원음에 가까운 음역을 우선했고, בן은 소속 관계를 자연스럽게 드러내는 ‘의 아들’로 처리했습니다.
- source_word: יִשְׁמָעֵאל בֶּן נְתַנְיָה
  english_pob_choice: Ishmael son of Nethaniah
  chosen_korean: 느다냐의 아들 이스마엘
  alternatives_korean:
  - 네다냐의 아들 이스마엘
  - 느다냐 아들 이스마엘
  lexicon: HALOT
  rationale: 인명은 일관된 음역을 따랐고, בן의 관계를 한국어 어순상 자연스러운 ‘의 아들’로 옮겼습니다.
