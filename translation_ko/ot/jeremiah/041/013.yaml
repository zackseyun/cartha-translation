translation:
  language: ko
  text: 그리고 이스마엘과 함께 있던 모든 백성이 가레아의 아들 요하난과 그와 함께 있던 군대의 모든 지휘관을 보자 기뻐하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  english_pob_choice: And when ... saw
  chosen_korean: 그리고 ... 보자
  alternatives_korean:
  - 그리고 ... 보았을 때
  - 그리고 ... 보았더니
  lexicon: HALOT
  rationale: 서사 전환 וַיְהִי와 시간 부사구 כִּרְאוֹת의 결합을 현대 한국어의 자연스러운 동시/계기 표현으로 옮겼습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 모든 사람들
  - 온 백성
  lexicon: HALOT
  rationale: 문맥상 단순한 인류 일반이 아니라 이스마엘과 함께 있던 집단을 가리키므로, 집합명사로서의 ‘백성’을 유지했습니다.
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of the forces
  chosen_korean: 군대 지휘관들
  alternatives_korean:
  - 군사들의 지휘관들
  - 부대 지휘관들
  - 군대의 장관들
  lexicon: HALOT
  rationale: שָׂרֵי는 지휘자/지도자이고, חֲיָלִים은 이곳에서 군사 집단을 뜻하므로, 군사적 위계를 드러내는 현대어로 옮겼습니다.
- source_word: וַיִּשְׂמָחוּ
  english_pob_choice: they rejoiced
  chosen_korean: 기뻐하였습니다
  alternatives_korean:
  - 기뻐했습니다
  - 크게 기뻐하였습니다
  - 즐거워하였습니다
  lexicon: HALOT
  rationale: שׂמח의 기본 의미인 기쁨을 살리되, 서술문체에 맞는 공손한 현대 표현으로 정리했습니다.
