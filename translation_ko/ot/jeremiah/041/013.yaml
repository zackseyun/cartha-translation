  language: ko
  text: 그리고 이스마엘과 함께 있던 모든 백성이, 여호하난 곧 가레아의 아들과 그와 함께 있던 모든 군대 지휘관들을 보자, 기뻐하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “여호하난”은 표준 음역을 따랐습니다. 본절의 핵심은 집단이 구원자 편을 보고 반응하는 장면이므로, 별도의 해석적 각주는 두지 않았습니다.
    reason: source_note
