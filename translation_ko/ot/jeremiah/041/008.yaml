id: JER.41.8
reference: Jeremiah 41:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/עֲשָׂרָ֨ה אֲנָשִׁ֜ים נִמְצְאוּ בָ֗/ם וַ/יֹּאמְר֤וּ אֶל יִשְׁמָעֵאל֙ אַל תְּמִתֵ֔/נוּ כִּֽי יֶשׁ לָ֤/נוּ מַטְמֹנִים֙ בַּ/שָּׂדֶ֔ה חִטִּ֥ים וּ/שְׂעֹרִ֖ים וְ/שֶׁ֣מֶן וּ/דְבָ֑שׁ וַ/יֶּחְדַּ֕ל וְ/לֹ֥א הֱמִיתָ֖/ם בְּ/ת֥וֹךְ אֲחֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/008.yaml
  text: But ten men were found among them[a], and they said to Ishmael, “Do not put us to death, for we have hidden stores in the field—wheat and barley[b], oil and honey.” So he refrained and did not put them to death among their brothers.
  footnotes:
  - marker: a
    text: Or “treasures” for “hidden stores”; the context favors concealed provisions rather than valuables in general.
    reason: lexical_alternative
  - marker: b
    text: “Among their brothers” likely means among their fellow men who were with them and were being killed.
    reason: cultural_note
translation:
  language: ko
  text: 그들 가운데서 열 사람을 발견하자, 그들이 이스마엘에게 말했습니다. 「우리를 죽이지 마십시오. 우리가 밭에 숨겨 둔 물건이 있습니다. 곧 밀과 보리, 기름과 꿀입니다.」 그러자 그는 그만두고 그들을 그들의 형제들 가운데서 죽이지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘숨겨 둔 물건’은 일반적 보물이라기보다, 문맥상 숨겨 둔 식량 저장분을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 형제들’은 함께 죽임을 당하던 같은 무리의 사람들을 가리키는 말로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַעֲשָׂרָה אֲנָשִׁים נִמְצְאוּ בָם
  english_pob_choice: But ten men were found among them
  chosen_korean: 그들 가운데서 열 사람을 발견하자
  alternatives_korean:
  - 그리고 열 사람이 그들 가운데서 발견되자
  - 그들 가운데 열 사람이 발견되자
  lexicon: HALOT
  rationale: נִמְצְאוּ는 수동적 ‘발견되다’이고, בָם은 집단 내부를 가리키므로 ‘그들 가운데서’가 자연스럽습니다. 앞선 학살 장면에 대한 대비는 한국어 문맥상 동사로 매끄럽게 드러냈습니다.
- source_word: אַל תְּמִתֵנוּ
  english_pob_choice: Do not put us to death
  chosen_korean: 우리를 죽이지 마십시오
  alternatives_korean:
  - 우리를 사망하게 하지 마십시오
  - 우리를 죽여서는 안 됩니다
  lexicon: HALOT
  rationale: 히필 מות의 ‘죽게 하다’라는 강한 강제성을 한국어의 직접적인 청원 표현으로 옮겼습니다. 현재 장면의 절박한 호소에 가장 자연스럽습니다.
- source_word: כִּי יֶשׁ לָנוּ מַטְמֹנִים בַּשָּׂדֶה
  english_pob_choice: for we have hidden stores in the field
  chosen_korean: 우리가 밭에 숨겨 둔 물건이 있습니다
  alternatives_korean:
  - 우리가 밭에 감춰 둔 저장식품이 있습니다
  - 우리에게는 밭에 숨겨 둔 보물이 있습니다
  lexicon: HALOT
  rationale: מַטְמֹנִים은 일반적인 ‘보물’보다 문맥상 은닉한 저장물, 곧 식량을 가리키므로 ‘숨겨 둔 물건’으로 넓되 과도하게 귀중품화하지 않았습니다. ‘밭에’는 농경지에 은닉된 장소를 그대로 반영합니다.
- source_word: חִטִּים וּשְׂעֹרִים וְשֶׁמֶן וּדְבָשׁ
  english_pob_choice: wheat and barley, oil and honey
  chosen_korean: 곧 밀과 보리, 기름과 꿀입니다
  alternatives_korean:
  - 밀과 보리, 기름과 꿀입니다
  - 밀, 보리, 기름, 꿀입니다
  lexicon: HALOT
  rationale: 열거된 물품을 한국어에서도 식량 목록으로 분명하게 드러내기 위해 쉼표로 두 묶음의 병렬을 살렸습니다. ‘밀’은 חִטִּים의 통상적 대응입니다.
- source_word: בְּתוֹךְ אֲחֵיהֶם
  english_pob_choice: among their brothers
  chosen_korean: 그들의 형제들 가운데서
  alternatives_korean:
  - 그들의 형제들 한복판에서
  - 그들의 동족들 가운데서
  lexicon: HALOT
  rationale: אֲחֵיהֶם를 직역하면 ‘그들의 형제들’이지만, 여기서는 함께 살해당한 동료들을 가리키는 관계적 표현이므로 ‘가운데서’로 위치감을 살렸습니다. 전통적 ‘동족’보다 원문 친연성을 우선했습니다.
theological_decisions:
- issue: 히필 מות의 절박한 청원 표현을 한국어에서 어떻게 살릴지
  chosen_reading: 직접적으로 “우리를 죽이지 마십시오”라고 옮겨, 처형을 중지해 달라는 생명 보존의 간청을 드러냈습니다.
  alternative_readings:
  - “우리를 죽여서는 안 됩니다”처럼 금지형을 완화해 옮길 수 있음
  - “우리를 사망하게 하지 마십시오”처럼 더 직역할 수 있음
  rationale: 본문은 단순한 해명보다 즉각적인 생명 구걸의 성격이 강하므로, 한국어에서도 명령형 금지를 유지해야 장면의 긴박성이 보존됩니다.
  doctrine_reference: 본문의 문학적·서사적 명확성
- issue: אֲחֵיהֶם의 관계 표현을 ‘형제들’로 둘지 ‘동족들’로 풀지
  chosen_reading: ‘그들의 형제들’로 두되, 한국어에서는 ‘가운데서’로 문맥을 보완했습니다.
  alternative_readings:
  - ‘그들의 동족들 가운데서’
  - ‘그들의 친족들 가운데서’
  rationale: 히브리어의 친족 표현을 삭제하면 원문 어휘의 거칠고 직접적인 결을 약화시킬 수 있어, 가능한 한 직선적으로 보존했습니다.
  doctrine_reference: 원문 친연성 보존 원칙
