language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יֵּצֵא יִשְׁמָעֵ֨אל בֶּן נְתַנְיָ֤ה לִ/קְרָאתָ/ם֙ מִן הַ/מִּצְפָּ֔ה הֹלֵ֥ךְ הָלֹ֖ךְ וּ/בֹכֶ֑ה וַֽ/יְהִי֙ כִּ/פְגֹ֣שׁ אֹתָ֔/ם וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם בֹּ֖אוּ אֶל גְּדַלְיָ֥הוּ בֶן אֲחִיקָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/006.yaml
  text: Then Ishmael son of Nethaniah went out from Mizpah to meet them[a], going and weeping. When he met them, he said to them, “Come to Gedaliah son of Ahikam.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'going, going and weeping,' an idiom expressing continued action as he approached.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스마엘은 느다냐의 아들로서 미스바에서 그들을 만나러 나갔습니다. 그는 가면서 울었습니다. 그가 그들을 만나자 그들에게 말했습니다. “가달리야 곧 아히감의 아들에게로 오십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘가며, 가며 울며’라는 식의 반복 표현으로, 다가가면서 계속 울고 있었음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 떠났습니다
  - 밖으로 나갔습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리되, 출발 동작을 분명히 드러내기 위해 평이한 동사 ‘나가다’를 택했습니다.
- source_word: לִקְרָאתָם
  english_pob_choice: to meet them
  chosen_korean: 그들을 만나러
  alternatives_korean:
  - 그들과 마주하러
  - 그들에게로
  lexicon: HALOT
  rationale: 히브리어 관용구가 ‘마주 나가 만나려는’ 뜻이므로, 목적을 나타내는 ‘-러’ 구문으로 자연스럽게 옮겼습니다.
- source_word: הֹלֵךְ הָלֹךְ וּבֹכֶה
  english_pob_choice: going and weeping
  chosen_korean: 가면서 울었습니다
  alternatives_korean:
  - 계속 걸으며 울었습니다
  - 가며 또 울며
  lexicon: HALOT
  rationale: 진행을 강조하는 중첩 표현을 한국어에서는 과도한 반복 없이 ‘가면서’로 살려, 지속적 동작과 감정 상태를 함께 드러냈습니다.
- source_word: בֹּאוּ אֶל
  english_pob_choice: Come to
  chosen_korean: …에게로 오십시오
  alternatives_korean:
  - …에게로 오라
  - …에게로 오세요
  lexicon: HALOT
  rationale: 직접화법의 초청/유도 표현이므로 명령조를 유지하되, 현대 한국어의 합쇼체로 공손하게 옮겼습니다.
- source_word: גְּדַלְיָהוּ בֶן אֲחִיקָם
  english_pob_choice: Gedaliah son of Ahikam
  chosen_korean: 가달리야 곧 아히감의 아들
  alternatives_korean:
  - 게달리야 곧 아히감의 아들
  - 가달리야, 아히감의 아들
  lexicon: HALOT
  rationale: 고유명사는 현행 음역을 따르고, 히브리어의 친족 관계 표지를 ‘아들’로 직역해 계보 정보를 보존했습니다. ‘곧’은 대상 지시를 자연스럽게 받치기 위한 접속 표지입니다.
theological_decisions:
- issue: 직접 화법의 명령형 문체
  chosen_reading: 이스마엘의 말은 현대 한국어 합쇼체 명령형 ‘오십시오’로 유지했습니다.
  alternative_readings:
  - 오라
  - 오세요
  rationale: 본문은 단순 서술이 아니라 유도하는 발화이므로, 의미를 흐리지 않으면서도 한국어 문체에 맞는 공손한 직접 화법을 선택했습니다.
  doctrine_reference: 서사 텍스트의 화행 보존
- issue: 동작의 지속성 표현
  chosen_reading: ‘가면서 울었습니다’로 진행성과 병행성을 함께 나타냈습니다.
  alternative_readings:
  - 울면서 갔습니다
  - 계속 가며 울었습니다
  rationale: 히브리어 중첩형은 단순히 한 번 운 것이 아니라 지속적으로 울며 접근하는 모습을 나타내므로, 그 뉘앙스를 보존했습니다.
  doctrine_reference: 히브리어 서술상 관용구
