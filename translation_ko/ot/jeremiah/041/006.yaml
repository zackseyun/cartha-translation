  naturalness: ‘느다냐의 아들로서’와 ‘가달리야 곧 아히감의 아들’은 현대 표준 한국어 서사에서 다소 부자연스럽거나 의미가 흐려집니다. ‘느다냐의 아들 이스마엘’, ‘아히감의 아들 그달리야’가 자연스럽습니다.
  terminology: 인명은 한국어 성경에서 널리 쓰이는 ‘그달리야’를 사용하는 것이 적절합니다. ‘미스바’, ‘느다냐’, ‘아히감’, ‘이스마엘’은 유지할 수 있습니다. 직접화법의 ‘오십시오’는 요청된 현대 합쇼체에 맞습니다.
