  text: וְ/הַ/בּ֗וֹר אֲשֶׁר֩ הִשְׁלִ֨יךְ שָׁ֤ם יִשְׁמָעֵאל֙ אֵ֣ת כָּל פִּגְרֵ֣י הָ/אֲנָשִׁ֗ים אֲשֶׁ֤ר הִכָּה֙ בְּ/יַד גְּדַלְיָ֔הוּ ה֗וּא אֲשֶׁ֤ר עָשָׂה֙ הַ/מֶּ֣לֶךְ אָסָ֔א מִ/פְּנֵ֖י בַּעְשָׁ֣א מֶֽלֶךְ יִשְׂרָאֵ֑ל אֹת֗/וֹ מִלֵּ֛א יִשְׁמָעֵ֥אל בֶּן נְתַנְיָ֖הוּ חֲלָלִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/041/009.yaml
  text: Now the cistern into which Ishmael had thrown all the corpses of the men whom he had struck down because of Gedaliah was the one that King Asa had made because of Baasha king of Israel[b][a]. Ishmael son of Nethaniah filled it with the slain.
  footnotes:
  - marker: a
    text: Or 'whom he had killed because of Gedaliah,' or 'whom he had killed along with Gedaliah.' The Hebrew phrase 'by the hand/side of Gedaliah' is difficult and context-dependent.
    reason: alternative_reading
  - marker: b
    text: Or 'for fear of Baasha king of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이스마엘이 그다랴와 관련하여 죽인 사람들의 시체를 모두 그곳에 던져 넣은 저수조는, 이스라엘 왕 바아사 때문에 아사 왕이 만든 바로 그 저수조였습니다.[a][b] 느다냐의 아들 이스마엘이 그 저수조를 살해된 사람들로 가득 채웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그다랴 때문에 그가 죽인 사람들’ 또는 ‘그다랴와 함께 그가 죽인 사람들’. 히브리어 표현은 직역하면 ‘그다랴의 손/곁에서’가 되며, 의미가 어렵고 문맥에 따라 달라집니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘이스라엘 왕 바아사를 두려워하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹר
  english_pob_choice: the cistern
  chosen_korean: 구덩이
  alternatives_korean:
  - 물독
  - 저수 구덩이
  - 우물
  lexicon: HALOT
  rationale: 보통 בּוֹר는 구덩이 또는 수조를 뜻하지만, 이 문맥에서는 지하 저장공간의 기능보다 시체가 쌓인 장소라는 점이 더 두드러져 일반적이면서도 자연스러운 ‘구덩이’가 적절합니다.
- source_word: פִּגְרֵי
  english_pob_choice: corpses
  chosen_korean: 시체
  alternatives_korean:
  - 사체
  - 몸
  lexicon: HALOT
  rationale: פֶּגֶר는 죽은 몸을 가리키므로, 문맥의 잔혹함을 살리는 ‘시체’가 가장 직접적입니다.
- source_word: בְּיַד גְּדַלְיָהוּ
  english_pob_choice: because of Gedaliah
  chosen_korean: 그달랴와 관련하여
  alternatives_korean:
  - 그달랴 때문에
  - 그달랴 곁에서
  - 그달랴의 손에 의해
  lexicon: HALOT
  rationale: 직역하면 어색하고 오해를 낳을 수 있어, 본문이 가리키는 ‘그달랴 사건과 연결된 죽음’이라는 의미를 드러내는 방향으로 옮겼습니다.
- source_word: מִפְּנֵי בַּעְשָׁא
  english_pob_choice: because of Baasha
  chosen_korean: 바아사를 두려워하여
  alternatives_korean:
  - 바아사 때문에
  - 바아사에 대하여
  - 바아사를 앞에 두고
  lexicon: HALOT
  rationale: מִפְּנֵי는 ‘때문에/두려워하여’의 뜻을 모두 가질 수 있는데, 아사가 성을 보강한 역사적 배경에서는 두려움의 동기가 자연스럽게 드러납니다.
theological_decisions:
- issue: 이사야/예레미야 서사에서 충격적 폭력 표현의 직역 수준
  chosen_reading: 살해된 사람들, 시체, 구덩이처럼 본문의 잔혹한 이미지를 완화하지 않고 그대로 드러냈습니다.
