  text: וַ/יִּשְׁמַ֞ע שְׁפַטְיָ֣ה בֶן מַתָּ֗ן וּ/גְדַלְיָ֨הוּ֙ בֶּן פַּשְׁח֔וּר וְ/יוּכַל֙ בֶּן שֶׁ֣לֶמְיָ֔הוּ וּ/פַשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה אֶ֨ת הַ/דְּבָרִ֔ים אֲשֶׁ֧ר יִרְמְיָ֛הוּ מְדַבֵּ֥ר אֶל כָּל הָ/עָ֖ם לֵ/אמֹֽר־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/001.yaml
  text: Now Shephatiah son of Mattan[a], Gedaliah son of Pashhur, Jucal son of Shelemiah, and Pashhur son of Malchiah heard the words that Jeremiah was speaking to all the people, saying,
  footnotes:
  - marker: a
    text: Hebrew יוּכַל is rendered 'Jucal' here; the same figure appears elsewhere with the fuller form 'Jehucal' (Jer 37:3).
    reason: alternative_reading
translation:
  language: ko
  text: 이제 스바냐의 아들 셰마냐와 바스훌의 아들 그달랴와 셀레먀의 아들 유갈과 말기야의 아들 바스훌이, 예레미야가 온 백성에게 말하고 있는 그 말을 들었습니다. 그는 이렇게 말하고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 יוּכַל은 여기서는 ‘유갈’로 옮겼습니다. 같은 인물은 다른 본문에서 더 긴 형태 ‘여후갈/예후갈’로도 나타납니다(예: 렘 37:3).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들어 알게 되었습니다
  - 들었습니다/들으셨습니다
  lexicon: HALOT
  rationale: 단순한 사건 진행을 나타내는 wayyiqtol이므로, 과장 없이 자연스러운 과거형 ‘들었습니다’가 가장 직접적입니다.
- source_word: שְׁפַטְיָה ... גְדַלְיָהוּ ... יוּכַל ... פַשְׁחוּר
  english_pob_choice: Shephatiah ... Gedaliah ... Jucal ... Pashhur
  chosen_korean: 셰마냐 ... 그달랴 ... 유갈 ... 바스훌
  alternatives_korean:
  - 스바냐 ... 게달랴 ... 여갈 ... 파스훌
  - 셰바냐 ... 그달랴후 ... 유칼 ... 파스후르
  lexicon: 고유명사 음역
  rationale: 이 절의 인명은 현대 외래어 표기 관행에 따라 음역하되, 예레미야 37:3의 더 긴 형태와 구별되는 יוּכַל은 ‘유갈’로 옮겨 영어 POB의 Jucal 선택을 반영했습니다.
- source_word: בֶּן
  english_pob_choice: son of
  chosen_korean: 아들
  alternatives_korean:
  - 아들의
  - 자녀
  lexicon: HALOT
  rationale: 계보 표지로서의 בֶּן은 한국어에서 가장 투명한 대응인 ‘아들’로 옮기는 것이 자연스럽습니다.
- source_word: אֶת הַדְּבָרִים ... אֶל כָּל הָעָם
  english_pob_choice: the words ... to all the people
  chosen_korean: 그 말을 ... 온 백성에게
  alternatives_korean:
  - 그 말씀을 ... 모든 백성에게
  - 그 말들을 ... 모든 사람에게
  lexicon: HALOT
  rationale: דָּבָר는 여기서 예레미야의 발화 내용을 가리키므로 ‘말’이 가장 직역적이며, הָעָם은 집합적 대상인 ‘온 백성’이 문맥에 맞습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 그는 이렇게 말하고 있었습니다.
  alternatives_korean:
  - 이르되
  - 말했습니다.
  lexicon: HALOT
  rationale: 다음 절의 직접 인용을 여는 관용구이므로 한국어에서는 중복된 ‘말하여 이르되’보다 흐름이 자연스러운 연결 표현으로 처리했습니다.
theological_decisions:
- issue: 예레미야의 발화가 진행 중인 상황을 어떻게 살릴 것인가
  chosen_reading: ‘예레미야가 온 백성에게 말하고 있는 그 말’과 ‘말하고 있었습니다’로 진행성과 현장성을 살렸습니다.
  alternative_readings:
  - 예레미야가 온 백성에게 말한 말을
  - 예레미야가 온 백성에게 말했습니다
  rationale: 히브리어 분사 מְדַבֵּר는 진행 중인 발화를 나타내므로, 단순 과거로 평평하게 만들기보다 당시 상황의 생동감을 보존하는 편이 원문에 더 가깝습니다.
  doctrine_reference: 서사적 시제/상/aspect 보존
