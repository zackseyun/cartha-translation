  yaml_path: translation/ot/jeremiah/038/015.yaml
  text: Jeremiah said to Zedekiah[a], “If I tell you, will you not surely put me to death? And if I advise you[b], you will not listen to me.”
  footnotes:
  - marker: a
    text: Or, 'certainly kill me.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: '''Listen to me'' may also carry the sense ''heed me'' or ''obey me'' in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 시드기야에게 말했습니다. “제가 왕께 말씀드리면, 왕께서는 반드시[a] 저를 죽이지 않으시겠습니까? 또 제가 왕께 조언해 드리면, 왕께서는 제 말을 듣지[b] 않으실 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 동사를 함께 써서 ‘죽이다’를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘듣지’는 문맥상 단순히 듣는 것뿐 아니라 ‘귀 기울여 따르지’의 뜻도 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אַגִּיד לְךָ
  english_pob_choice: If I tell you
  chosen_korean: 제가 당신에게 말하면
  alternatives_korean:
  - 제가 당신에게 알려 드리면
  - 제가 당신에게 말씀드리면
  lexicon: HALOT
  rationale: כִּי가 조건절을 이끌고, נגד(히필)는 '말하다/알리다'의 뜻이므로, 대화체에 맞게 자연스럽게 '말하면'으로 옮겼습니다.
- source_word: הֲלוֹא הָמֵת תְּמִיתֵנִי
  english_pob_choice: will you not surely put me to death
  chosen_korean: 당신은 정말 저를 죽이지 않겠습니까
  alternatives_korean:
  - 당신은 반드시 저를 죽일 것입니다
  - 정말로 저를 죽이지 않겠습니까
  lexicon: HALOT
  rationale: הֲלוֹא의 반문성과 infinitive absolute+finite verb의 강조를 살려, 미래형 반문으로 '정말 … 않겠습니까'를 택했습니다.
- source_word: אִיעָצְךָ
  english_pob_choice: I advise you
  chosen_korean: 제가 당신에게 조언하면
  alternatives_korean:
  - 제가 당신에게 권하면
  - 제가 당신에게 충고하면
  lexicon: HALOT
  rationale: יעץ는 '조언하다/권하다'의 뜻이므로, 왕에게 하는 말의 맥락에서 현대 한국어의 '조언하다'를 사용했습니다.
- source_word: לֹא תִשְׁמַע אֵלַי
  english_pob_choice: you will not listen to me
  chosen_korean: 당신은 제 말을 듣지 않을 것입니다
  alternatives_korean:
  - 당신은 제 말을 들으려 하지 않을 것입니다
  - 당신은 제 말을 따르지 않을 것입니다
  lexicon: HALOT
  rationale: שמע + אל은 '듣다'에서 '귀 기울이다/따르다'까지 뉘앙스가 있으나, POB처럼 기본 의미를 살려 '제 말을 듣지 않을 것입니다'로 옮겼습니다.
- source_word: יִרְמְיָהוּ / צִדְקִיָּהוּ
  english_pob_choice: Jeremiah / Zedekiah
  chosen_korean: 예레미야 / 시드기야
  alternatives_korean:
  - 예레미야 / 치드기야
  - 예레미야 / 짙드기야
  lexicon: 표준 성경 고유명사
  rationale: 한국어 성경에서 널리 쓰이는 고유명사 표기를 따랐습니다.
