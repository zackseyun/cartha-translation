id: JER.38.18
reference: Jeremiah 38:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ם לֹֽא תֵצֵ֗א אֶל שָׂרֵי֙ מֶ֣לֶךְ בָּבֶ֔ל וְ/נִתְּנָ֞ה הָ/עִ֤יר הַ/זֹּאת֙ בְּ/יַ֣ד הַ/כַּשְׂדִּ֔ים וּ/שְׂרָפ֖וּ/הָ בָּ/אֵ֑שׁ וְ/אַתָּ֖ה לֹֽא תִמָּלֵ֥ט מִ/יָּדָֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/018.yaml
  text: But if you do not go out to the officials of the king of Babylon[a], then this city will be given into the hand of the Chaldeans, and they will burn it with fire[b], and you will not escape from their hand.
  footnotes:
  - marker: a
    text: Or 'to the princes of the king of Babylon' or 'to the commanders of the king of Babylon.' The Hebrew term can refer broadly to high-ranking officials.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of the Chaldeans' ... 'from their hand,' an idiom for being under another's power.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 만일 당신이 바빌론 왕의 관원들에게 나가지 않으면, 이 도성은 갈대아 사람들의 손에 넘겨질 것이고, 그들이 그것을 불로 태울 것이며, 당신은 그들의 손에서 빠져나가지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관원들’은 히브리어 שָׂרֵי의 넓은 의미를 따른 것으로, ‘왕의 방백들’ 또는 ‘왕의 지휘관들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손’은 여기서 문자적 신체 부위라기보다 권세와 지배를 뜻하는 히브리 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞절의 권면과 이어지는 조건적 대비를 살려, 단순한 조건보다 반전의 힘이 있는 ‘그러나 만일’로 옮겼습니다.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  english_pob_choice: the officials of the king of Babylon
  chosen_korean: 바빌론 왕의 관원들
  alternatives_korean:
  - 바빌론 왕의 방백들
  - 바빌론 왕의 지휘관들
  lexicon: HALOT
  rationale: שָׂרִים의 범위를 과도하게 군사화하지 않으면서도, 궁정·행정적 권세자를 자연스럽게 드러내는 ‘관원들’을 택했습니다.
- source_word: בְּיַד הַכַּשְׂדִּים / מִיָּדָם
  english_pob_choice: into the hand of the Chaldeans / from their hand
  chosen_korean: 갈대아 사람들의 손에 / 그들의 손에서
  alternatives_korean:
  - 갈대아 사람들의 권세 아래
  - 그들의 권세에서
  lexicon: HALOT
  rationale: ‘손’의 히브리 관용구를 그대로 살려, 점유·권세 아래 놓임과 탈출 불가의 대칭을 본문 구조대로 보존했습니다.
- source_word: וּשְׂרָפוּהָ בָּאֵשׁ
  english_pob_choice: and they will burn it with fire
  chosen_korean: 그들이 그것을 불로 태울 것이며
  alternatives_korean:
  - 그들이 그것을 불에 태울 것이며
  - 그들이 그것을 불로 불사를 것이며
  lexicon: HALOT
  rationale: 히브리어의 중복 강조를 크게 풀지 않고, ‘불로 태우다’로 직접적이고 문맥에 맞는 파괴 행위를 전달했습니다.
theological_decisions:
- issue: 예루살렘의 운명과 항복 권면의 직접성
  chosen_reading: 이 구절은 항복하지 않을 경우 도성이 적의 손에 넘어가고 불타며, 화자는 이를 회피 불가능한 결과로 제시합니다.
  alternative_readings:
  - 단순한 예언적 경고
  - 정치적 협상 조언
  rationale: 본문은 조건문과 결과문을 통해 심판의 필연성을 강조하므로, 권고를 약화시키지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 예레미야의 심판 선포와 언약적 징계의 맥락
