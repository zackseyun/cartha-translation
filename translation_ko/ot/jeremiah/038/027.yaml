  to: 그때 모든 고관들이 예레미야에게 와서 그에게 물었고, 그는 왕이 명령한 이 모든 말을 그들에게 전했습니다. 그러자 그들은 그에게 더 이상 아무 말도 하지 않았습니다. 그 일이 들리지 않았기 때문입니다.[a]
