source:
  edition: WLC
  text: וַ/יָּבֹ֨אוּ כָל הַ/שָּׂרִ֤ים אֶֽל יִרְמְיָ֨הוּ֙ וַ/יִּשְׁאֲל֣וּ אֹת֔/וֹ וַ/יַּגֵּ֤ד לָ/הֶם֙ כְּ/כָל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר צִוָּ֖ה הַ/מֶּ֑לֶךְ וַ/יַּחֲרִ֣שׁוּ מִמֶּ֔/נּוּ כִּ֥י לֹֽא נִשְׁמַ֖ע הַ/דָּבָֽר־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/027.yaml
  text: Then all the officials came to Jeremiah and questioned him[a], and he told them all these words that the king had commanded. So they were silent before him, for the matter had not been heard.
  footnotes:
  - marker: a
    text: Or, 'for the conversation had not been overheard.' The Hebrew literally says, 'for the matter had not been heard,' likely explaining why the officials accepted Jeremiah's answer and fell silent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모든 고관들이 예레미야에게 와서 그에게 물었고, 그는 왕이 명령한 이 모든 말을 그들에게 전했습니다. 그러자 그들은 그에게 더 이상 아무 말도 하지 않았습니다. 그 일이 들리지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그 말/일이 들리지 않았다’입니다. 문맥상 그 대화나 일이 다른 사람들에게 알려지지 않았다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 고관들
  alternatives_korean:
  - 관원들
  - 관리들
  - 관리들(공무원들)
  lexicon: HALOT
  rationale: 왕실/궁정 문맥에서 שָׂר는 단순한 일반 관리보다 지위가 있는 고위 관료를 가리키므로, 현대 한국어에서 자연스럽고 격식을 갖춘 ‘고관들’로 옮겼습니다.
- source_word: וַיִּשְׁאֲלוּ אֹתוֹ
  english_pob_choice: questioned him
  chosen_korean: 그를 심문하였고
  alternatives_korean:
  - 그에게 물었고
  - 그에게 질문하였고
  - 그에게 캐물었고
  lexicon: HALOT
  rationale: 여기서는 단순한 질문이 아니라 예레미야의 답변을 확인하려는 조사 성격이 강하므로, 영어 POB의 ‘questioned him’에 맞춰 ‘심문하다’를 선택했습니다.
- source_word: וַיַּחֲרִשׁוּ מִמֶּנּוּ
  english_pob_choice: they were silent before him
  chosen_korean: 그들은 그의 앞에서 더 이상 말하지 않았습니다
  alternatives_korean:
  - 그들은 그의 앞에서 침묵했습니다
  - 그들은 그에게 더 말하지 않았습니다
  - 그들은 그 앞에서 잠잠하였습니다
  lexicon: HALOT
  rationale: חרשׁ는 단순한 정적보다 ‘말을 멈추다’의 뜻이 강하므로, 상황상 자연스러운 한국어로 ‘더 이상 말하지 않았습니다’라고 옮겨 멈춤의 결과를 드러냈습니다.
- source_word: לֹא נִשְׁמַע הַדָּבָר
  english_pob_choice: for the matter had not been heard
  chosen_korean: 그 말이 알려지지 않았기 때문입니다
  alternatives_korean:
  - 그 일이 들리지 않았기 때문입니다
  - 그 말이 전해지지 않았기 때문입니다
  - 그 사정이 알려지지 않았기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 수동형 ‘들리다/알려지다’는 여기서 외부에 소문이나 내용이 새지 않았음을 가리키므로, 문맥상 가장 자연스러운 의미인 ‘알려지지 않았다’로 풀었습니다.
theological_decisions:
- issue: 왕의 명령과 예레미야의 응답 관계
  chosen_reading: 예레미야는 자신의 말을 직접 꾸며 내지 않고, 왕이 명령한 그대로를 전달합니다.
  alternative_readings:
  - 예레미야가 재량껏 완곡하게 답했다
  - 왕의 명령을 일부만 전했다
  rationale: 본문은 예레미야의 진술이 왕의 지시를 따른 것이었음을 강조하므로, 번역에서도 그 종속성과 사실 전달성을 분명히 했습니다.
  doctrine_reference: 본문 내 서사적 충실성
- issue: 결말의 침묵의 이유
  chosen_reading: ‘그 말이 알려지지 않았기 때문입니다’로, 외부에 누설되지 않아 고관들이 더 추궁하지 못한 상황을 드러냈습니다.
  alternative_readings:
  - ‘그 대화가 엿들리지 않았기 때문입니다’
  - ‘그 일이 누구에게도 들리지 않았기 때문입니다’
  rationale: 히브리어는 문자적으로 ‘그 일이 들리지 않았다’이지만, 문맥상 ‘외부에 알려지지 않음’이 침묵의 이유이므로, 의미를 과도하게 바꾸지 않는 범위에서 그 함의를 드러냈습니다.
  doctrine_reference: 서사 문맥
