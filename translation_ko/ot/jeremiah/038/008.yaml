  source_fidelity: 히브리어의 서술 순서와 핵심 의미는 대체로 반영되었습니다. 다만 לֵאמֹר는 다음 절의 발화를 도입하므로, ‘말하며 이르렀습니다’처럼 두 동작을 병렬·중첩시키기보다 ‘이렇게 말했습니다’로 옮기는 것이 וַיְדַבֵּר와 לֵאמֹר의 기능을 자연스럽고 충실하게 드러냅니다.
