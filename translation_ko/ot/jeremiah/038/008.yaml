  terminology: 인명은 한국어 성경에서 널리 쓰이는 표기인 ‘에벳멜렉’을 사용하는 것이 적절합니다. ‘왕궁’은 왕의 집이라는 왕실 문맥상 가능한 번역이지만 다소 해석적이므로, 해당 어구에 대안을 제시하는 각주를 붙입니다.
