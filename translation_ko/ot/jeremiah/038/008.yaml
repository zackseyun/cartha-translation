translation:
  language: ko
  text: 그러자 에벳-멜렉이 왕궁에서 나와 왕에게 말하며 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “왕의 집에서”로도 옮길 수 있습니다. 히브리어는 문자적으로 “왕의 집”이라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ
  english_pob_choice: Ebed-melech
  chosen_korean: 에벳-멜렉
  alternatives_korean:
  - 에벳멜렉
  - 에벳-메렉
  lexicon: HALOT
  rationale: 고유명사로 처리해 음역했으며, 본문 인물명으로 자연스럽게 읽히도록 하이픈을 넣었습니다.
- source_word: מִבֵּית הַמֶּלֶךְ
  english_pob_choice: from the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕의 궁에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 '왕의 집'을 한국어에서는 궁정 맥락의 자연스러운 표현인 '왕궁'으로 옮기되, 출발 지점을 분명히 했습니다.
- source_word: וַיְדַבֵּר אֶל הַמֶּלֶךְ
  english_pob_choice: and spoke to the king
  chosen_korean: 왕에게 말하며
  alternatives_korean:
  - 왕에게 말하고
  - 왕에게 이야기하며
  lexicon: HALOT
  rationale: דבר + אל의 대화 행위를 자연스럽게 살려 '말하며'로 옮겼고, 이어지는 직접화법 도입과도 맞췄습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying,
  chosen_korean: 이르렀습니다
  alternatives_korean:
  - 말했습니다
  - 이르며
  lexicon: HALOT
  rationale: 직접화법을 여는 서술 표지로서 한국어에서는 중복되는 '말하다'보다 '이르다'를 써 문장 흐름을 살렸습니다.
