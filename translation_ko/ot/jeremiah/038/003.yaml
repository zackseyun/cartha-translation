translation:
  language: ko
  text: 「야훼께서 이렇게 말씀하십니다. 이 성읍은 반드시 바벨론 왕의 군대의 손에 넘겨질 것이며, 그는 그것을 점령할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「바벨론 왕의 군대의 권세 아래」. 히브리어 관용구는 문자적으로 「손에」입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 「야훼께서 이렇게 말씀하십니다」
  alternatives_korean:
  - 「야훼께서 말씀하십니다」
  - 「야훼께서 이같이 말씀하십니다」
  lexicon: HALOT
  rationale: 예언자적 전언 공식의 높임말을 살리되, 히브리어 כֹּה의 선언성을 한국어로 자연스럽게 풀어 「이렇게」로 옮겼습니다.
- source_word: הִנָּתֹן תִּנָּתֵן
  english_pob_choice: will surely be given
  chosen_korean: 「반드시 … 넘겨질 것입니다」
  alternatives_korean:
  - 「확실히 … 넘겨질 것입니다」
  - 「틀림없이 … 넘겨질 것입니다」
  lexicon: HALOT
  rationale: 부정사 절대형+동사의 강조를 한국어의 「반드시」로 옮겨 확실성을 분명히 했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 「…의 손에」
  alternatives_korean:
  - 「…의 권세 아래」
  - 「…의 통치 아래」
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 권력 이전의 이미지를 보존하되, 한국어에서 통용되는 자연스러운 표현으로 처리했습니다.
- source_word: חֵיל מֶלֶךְ בָּבֶל
  english_pob_choice: the army of the king of Babylon
  chosen_korean: 「바벨론 왕의 군대」
  alternatives_korean:
  - 「바벨론 왕의 군사력」
  - 「바벨론 왕의 병력」
  lexicon: HALOT
  rationale: 군사적 맥락에서 חֵיל은 실제 전투 병력을 가리키므로 「군대」로 옮겼습니다.
- source_word: וּלְכָדָהּ
  english_pob_choice: and he will capture it
  chosen_korean: 「그는 그것을 점령할 것입니다」
  alternatives_korean:
  - 「그는 그것을 포로로 잡을 것입니다」
  - 「그는 그것을 함락할 것입니다」
  lexicon: HALOT
  rationale: 성읍을 대상으로 한 לכד의 결과를 한국어에서 가장 직접적으로 드러내는 동사로 「점령하다」를 택했습니다.
