source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יִרְמְיָ֖הוּ לֹ֣א יִתֵּ֑נוּ שְֽׁמַֽע נָ֣א בְּ/ק֣וֹל יְהוָ֗ה לַ/אֲשֶׁ֤ר אֲנִי֙ דֹּבֵ֣ר אֵלֶ֔י/ךָ וְ/יִ֥יטַב לְ/ךָ֖ וּ/תְחִ֥י נַפְשֶֽׁ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/020.yaml
  text: Jeremiah said[a], “They will not hand you over. Please listen to the voice of Yahweh in what I am speaking to you, so that it may go well with you and your life may be spared.”
  footnotes:
  - marker: a
    text: Or, 'They will not give you over.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'listen to the voice of the LORD,' an idiom meaning to heed what the LORD says.
    reason: lexical_alternative
  - marker: c
    text: Hebrew, 'and your soul/life will live.' Here 'life' refers to physical preservation.
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야가 말했습니다. “그들은 당신을 넘겨주지 않을 것입니다[a]. 부디 내가 당신에게 말하는 대로 야훼의 음성에 귀 기울이십시오[b]. 그러면 당신에게 일이 잘될 것이며, 당신의 생명이 보전될 것입니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그들은 당신을 내주지 않을 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서 ‘야훼의 음성을 듣다’는 관용구로, 야훼께서 말씀하시는 것을 받아들이고 따르라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어, ‘당신의 생명이 살 것이다.’ 여기서 ‘생명’은 육체적 보존을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתֵּנוּ
  english_pob_choice: They will not hand you over
  chosen_korean: 그들은 당신을 넘겨주지 않을 것입니다
  alternatives_korean:
  - 그들은 당신을 내주지 않을 것입니다
  - 그들은 당신을 건네주지 않을 것입니다
  lexicon: HALOT
  rationale: 3인칭 복수 동사는 문맥상 바빌로니아 사람들에게 넘겨지는 상황을 가리키므로, 현대 한국어에서 자연스러운 ‘넘겨주다’로 옮겨 수동적으로 위임되는 뉘앙스를 살렸습니다.
- source_word: שְׁמַע נָא בְּקוֹל יְהוָה
  english_pob_choice: Please listen to the voice of Yahweh
  chosen_korean: 부디 야훼의 음성에 귀 기울이십시오
  alternatives_korean:
  - 부디 야훼의 소리에 귀를 기울이십시오
  - 부디 야훼의 말씀에 귀 기울이십시오
  lexicon: HALOT
  rationale: ‘듣다’의 관용구를 단순히 ‘순종하다’로 평평하게 만들지 않고, 말씀을 듣고 따르라는 긴박한 간청을 살려 ‘귀 기울이십시오’로 옮겼습니다. יְהוָה는 본문 원문의 고유명으로 ‘야훼’를 유지했습니다.
- source_word: לַאֲשֶׁר אֲנִי דֹּבֵר אֵלֶיךָ
  english_pob_choice: in what I am speaking to you
  chosen_korean: 곧 내가 당신에게 말하는 이 말을 들으십시오
  alternatives_korean:
  - 내가 당신에게 말하고 있는 것을 들으십시오
  - 내가 당신에게 말하는 바를 들으십시오
  lexicon: HALOT
  rationale: 예레미야의 말을 곧바로 야훼의 음성과 연결하는 구조를 살리기 위해, 단순한 ‘순종’보다 ‘내가…말하는 이 말’로 연결성을 드러냈습니다.
- source_word: וְיִיטַב לְךָ
  english_pob_choice: so that it may go well with you
  chosen_korean: 그러면 당신에게 복이 있고
  alternatives_korean:
  - 그러면 당신에게 잘될 것이고
  - 그러면 당신이 형통할 것이고
  lexicon: HALOT
  rationale: 히브리어의 결과절을 한국어에서도 결과 관계가 분명하게 드러나도록 ‘그러면’으로 처리했습니다. ‘복이 있다’는 표현은 단순한 번영 이상의 유익을 포괄합니다.
- source_word: וּתְחִי נַפְשֶׁךָ
  english_pob_choice: and your life may be spared
  chosen_korean: 당신의 생명이 살 것입니다
  alternatives_korean:
  - 당신의 목숨이 살 것입니다
  - 당신의 생명이 보존될 것입니다
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 비물질적 ‘영혼’이 아니라 생명을 가리키므로 ‘생명’으로 옮겼습니다. ‘살 것입니다’는 본문의 직역성을 유지하면서도 생사 맥락에서 자연스럽습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 이름 יְהוָה를 직접 사용하므로, 제목어 ‘주’로 대체하지 않고 고유명 ‘야훼’를 유지해 언약적 인격성을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: נֶפֶשׁ의 의미
  chosen_reading: 생명
  alternative_readings:
  - 영혼
  - 목숨
  rationale: 이 문맥은 죽음의 위협 속에서 실제 생존을 말하므로, ‘영혼’보다 ‘생명’이 원문의 의미와 독자의 이해를 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #6'
