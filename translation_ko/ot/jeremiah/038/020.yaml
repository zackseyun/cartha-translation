  naturalness: ‘곧 내가 당신에게 말하는 이 말을 들으십시오’는 앞선 명령을 불필요하게 반복하며 연결도 부자연스럽습니다. ‘내가 당신에게 말하는 대로’로 처리하면 히브리어의 연결 관계와 현대 한국어 표현을 함께 살릴 수 있습니다. ‘당신의 생명이 살 것입니다’도 한국어에서는 어색하므로 ‘당신의 생명이 보전될 것입니다’가 자연스럽습니다.
