source:
  edition: WLC
  text: וַ/יִּמְשְׁכ֤וּ אֶֽת יִרְמְיָ֨הוּ֙ בַּֽ/חֲבָלִ֔ים וַ/יַּעֲל֥וּ אֹת֖/וֹ מִן הַ/בּ֑וֹר וַ/יֵּ֣שֶׁב יִרְמְיָ֔הוּ בַּ/חֲצַ֖ר הַ/מַּטָּרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/013.yaml
  text: So they pulled Jeremiah up with the ropes and brought him up out of the cistern[b][a], and Jeremiah remained in the court of the guard.
  footnotes:
  - marker: a
    text: Or 'out of the pit.' The Hebrew bor can denote a pit, cistern, or dungeon; here 'cistern' fits the narrative setting.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the courtyard of the guardhouse' or 'in the court of the prison.' The Hebrew expression refers to the guarded detention area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 밧줄로 예레미야를 끌어올려 그를 구덩이[a]에서 꺼내었고, 예레미야는 경비대 뜰[b]에 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘구덩이’는 히브리어 보르(בּוֹר)를 옮긴 것입니다. 이 단어는 구덩이, 물 저장 구덩이(저수조), 또는 감금 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경비대 뜰’은 히브리어 표현을 옮긴 것입니다. 경비가 붙은 구금 구역의 뜰을 가리키며, ‘경비소의 뜰’ 또는 ‘감옥 뜰’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְשְׁכוּ אֶת יִרְמְיָהוּ בַּחֲבָלִים
  english_pob_choice: pulled Jeremiah up with the ropes
  chosen_korean: 밧줄로 예레미야를 끌어 올려
  alternatives_korean:
  - 밧줄로 예레미야를 당겨
  - 줄로 예레미야를 끌어올려
  lexicon: HALOT
  rationale: משׁך의 기본 의미는 ‘끌다/당기다’이므로, 구출 장면의 물리적 동작을 자연스럽게 드러내는 ‘끌어 올려’를 택했습니다. חֲבָלִים은 ‘밧줄/줄’이 가능하지만, 한국어에서 더 구체적이고 자연스러운 ‘밧줄’이 적절합니다.
- source_word: מִן הַבּוֹר
  english_pob_choice: out of the cistern
  chosen_korean: 구덩이에서 건져 내었고
  alternatives_korean:
  - 우물에서 건져 내었고
  - 구덩이에서 꺼내었고
  - 구덩이에서 끌어 올렸고
  lexicon: HALOT
  rationale: בּוֹר는 문맥상 물 저장용 구덩이/우물을 가리킬 수 있지만, 한국어 본문에서는 장소의 성격보다 ‘거기서 끌어내는’ 결과를 살려 ‘구덩이’로 옮겼습니다. ‘건져 내다’는 단순 이동보다 구출의 뉘앙스를 잘 살립니다.
- source_word: וַיֵּשֶׁב יִרְמְיָהוּ בַּחֲצַר הַמַּטָּרָה
  english_pob_choice: Jeremiah remained in the court of the guard
  chosen_korean: 예레미야는 경비대 뜰에 머물렀습니다.
  alternatives_korean:
  - 예레미야는 경비대 뜰에 있었고
  - 예레미야는 경비병 뜰에 머물렀습니다.
  - 예레미야는 경비실 뜰에 머물렀습니다.
  lexicon: HALOT
  rationale: יָשַׁב은 여기서 ‘앉다’보다 계속 거주/체류한다는 뜻이므로 ‘머물렀습니다’가 적절합니다. הַמַּטָּרָה는 단순한 건물명보다 ‘경비대’와 연결된 감금 구역을 가리키므로 ‘경비대 뜰’로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 보르(bor)와 하차르 하마타라 표현을 한국어에서 어떻게 과도하게 시설화하지 않을지
  chosen_reading: ‘구덩이’와 ‘경비대 뜰’로 옮겨, 장소의 기능은 드러내되 특정 건물명으로 단정하지 않았습니다.
  alternative_readings:
  - ‘우물’과 ‘감옥 뜰’로 옮김
  - ‘지하 감옥’과 ‘경비실 뜰’로 옮김
  rationale: 문맥은 예레미야가 감금된 깊은 구덩이에서 건져 올려진 뒤 경비가 붙은 뜰에 남겨졌음을 말합니다. 한국어에서 시설을 지나치게 특정하면 본문의 유연한 공간 이미지를 잃을 수 있어, 서술이 허용하는 범위 안에서 중립적으로 처리했습니다.
  doctrine_reference: 본문 서술의 공간 이미지 보존
