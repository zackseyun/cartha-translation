    text: 또는 ‘구덩이’. 옛 영어 번역 전통에서는 ‘감옥’으로도 옮깁니다. 히브리어 보르(bor)는 구덩이나 저수조를 뜻할 수 있으나, 여기서는 문맥상 ‘저수조’가 알맞습니다.
