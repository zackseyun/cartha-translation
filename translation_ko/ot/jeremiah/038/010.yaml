  text: 그때 왕이 쿠시 사람 에벳멜렉[a]에게 명령하여 말하기를, '너는 여기서 삼십 명을 데리고, 예레미야 선지자가 죽기 전에 우물[b]에서 끌어 올려라.' 하셨다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '에티오피아 사람'. 히브리어는 '쿠시 사람'이라고 하여 쿠시 땅에서 온 한 사람을 가리킨다.
    reason: alternative_reading
  - marker: b
    text: 또는 '구덩이에서' 또는 구어체 전통에 따라 '감옥에서'. 히브리어 bor는 우물이나 구덩이를 의미할 수 있으나, 여기서는 서술의 배경에 따라 '우물'이 적절하다.
    reason: alternative_reading
