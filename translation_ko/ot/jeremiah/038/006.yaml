    issue: ‘경비 대기소 뜰’은 חֲצַר הַמַּטָּרָה의 자연스러운 한국어 표현이 아닙니다.
    rationale: ‘대기소’는 기다리는 장소를 우선 연상시키며, 본문의 경비·억류 구역 의미를 명료하게 전달하지 못합니다.
  - severity: medium
    issue: 본문의 ‘구덩이’와 각주의 ‘우물’은 בּוֹר의 이 문맥상 물 저장 시설이라는 의미를 충분히 드러내지 못합니다.
    rationale: 물이 없고 진흙만 있었다는 후속 설명은 특히 저수조(cistern)를 가리킵니다. ‘우물’은 샘물을 길어 올리는 시설을 주로 뜻하여 적절한 대안이 아닙니다.
  - severity: low
    issue: ‘붙잡아’는 וַיִּקְחוּ의 기본 의미보다 강한 해석입니다.
    rationale: 강제 상황은 문맥상 분명하지만, 동사 자체는 ‘데려가다/취하다’로도 충분히 번역되므로 본문의 어휘적 여지를 보존하는 편이 낫습니다.
