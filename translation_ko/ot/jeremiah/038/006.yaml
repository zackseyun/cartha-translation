  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְח֣וּ אֶֽת יִרְמְיָ֗הוּ וַ/יַּשְׁלִ֨כוּ אֹת֜/וֹ אֶל הַ/בּ֣וֹר מַלְכִּיָּ֣הוּ בֶן הַ/מֶּ֗לֶךְ אֲשֶׁר֙ בַּ/חֲצַ֣ר הַ/מַּטָּרָ֔ה וַ/יְשַׁלְּח֥וּ אֶֽת יִרְמְיָ֖הוּ בַּ/חֲבָלִ֑ים וּ/בַ/בּ֤וֹר אֵֽין מַ֨יִם֙ כִּ֣י אִם טִ֔יט וַ/יִּטְבַּ֥ע יִרְמְיָ֖הוּ בַּ/טִּֽיט־־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/006.yaml
  text: So they took Jeremiah and threw him into the cistern of Malkijah the king’s son[a], which was in the court of the guard, and they lowered Jeremiah with ropes. Now there was no water in the cistern, but only mud[c][b], and Jeremiah sank into the mud.
  footnotes:
  - marker: a
    text: Or 'pit' for 'cistern' (Hebrew bor); the context of there being no water but only mud suggests a water cistern specifically.
    reason: lexical_alternative
  - marker: b
    text: Or 'court of the prison.' The Hebrew term likely refers to a guarded detention area.
    reason: lexical_alternative
  - marker: c
    text: Or 'mire' for 'mud.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 예레미야를 데려다가 왕의 아들 말기야의 저수조[a]에 던져 넣었습니다. 그 저수조는 경비대 뜰[b]에 있었습니다. 그들은 줄[c]로 예레미야를 내려보냈습니다. 그 저수조에는 물이 없고 진흙뿐이었으며, 예레미야는 진흙 속에 가라앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구덩이’. 히브리어 בּוֹר는 ‘구덩이’ 또는 물을 저장하는 시설을 뜻할 수 있습니다. 물은 없고 진흙만 있었다는 뒤의 설명은 여기서 저수조를 가리킴을 시사합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘감옥 뜰’. 히브리어 חֲצַר הַמַּטָּרָה는 경비가 있는 억류 구역의 뜰을 가리키는 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘밧줄로’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: they took
  chosen_korean: 붙잡아
  alternatives_korean:
  - 데려가
  - 잡아
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘데려감’보다 강제성을 드러내야 하므로, ‘붙잡아’가 ‘took’의 기본 의미를 살리면서도 상황의 폭력을 반영합니다.
- source_word: וַיַּשְׁלִכוּ אֹתוֹ אֶל־הַבּוֹר
  english_pob_choice: threw him into the cistern
  chosen_korean: 구덩이
  alternatives_korean:
  - 웅덩이
  - 물저장고
  lexicon: HALOT
  rationale: בּוֹר는 기본적으로 ‘구덩이/물통 구덩이/감옥 구덩이’로 폭이 넓지만, 뒤의 ‘물이 없고 진흙뿐’이라는 설명을 반영해 물 저장용 공간의 성격을 살리면서도 한국어로는 자연스러운 ‘구덩이’로 옮겼습니다.
- source_word: מַלְכִּיָּהוּ בֶן־הַמֶּלֶךְ
  english_pob_choice: Malkijah the king’s son
  chosen_korean: 왕의 아들 말기야
  alternatives_korean:
  - 말기야 왕자
  - 왕의 아들 마르기야
  lexicon: HALOT
  rationale: 고유명사는 음역하되, בֶן־הַמֶּלֶךְ는 왕위 계승 칭호를 뜻하는 것이 아니라 신분 표시이므로 ‘왕자’보다 직역에 가까운 ‘왕의 아들’이 더 정확합니다.
- source_word: וַיְשַׁלְּחוּ אֶת־יִרְמְיָהוּ בַּחֲבָלִים
  english_pob_choice: they lowered Jeremiah with ropes
  chosen_korean: 줄로 내려 보냈습니다
  alternatives_korean:
  - 줄로 내려주었습니다
  - 줄에 매달아 내렸습니다
  lexicon: HALOT
  rationale: שלח는 보통 ‘보내다’이지만 여기서는 밧줄을 사용해 아래로 내려보내는 상황이므로, 한국어에서는 동작의 방향을 살린 ‘내려 보냈습니다’가 가장 자연스럽습니다.
- source_word: טִיט
  english_pob_choice: mud
  chosen_korean: 진흙
  alternatives_korean:
  - 흙탕
  - 진펄
  lexicon: HALOT
  rationale: טִיט는 끈적한 진흙/진펄을 가리키지만, 현대 한국어 성경 문맥에서는 ‘진흙’이 가장 분명하고 읽기 쉽습니다.
theological_decisions:
- issue: 폭력적 체포와 투하 동사의 강도
  chosen_reading: 예레미야가 단순히 ‘이동’된 것이 아니라 강제로 붙잡혀 구덩이에 던져졌다는 점을 드러냈습니다.
  alternative_readings:
  - 예레미야를 데려갔다
  - 예레미야를 옮겼다
  rationale: 히브리어 연속 동사는 상황의 폭력성과 절박함을 강화하므로, 이를 완화하지 않고 직접적으로 표현하는 편이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: 예언자 박해 본문
- issue: ‘경비 대기소’의 채택
  chosen_reading: חֲצַר הַמַּטָּרָה는 일반적인 ‘감옥 뜰’보다, 경비가 붙은 구금 구역이라는 뉘앙스를 살린 ‘경비 대기소 뜰’로 옮겼습니다.
  alternative_readings:
  - 감옥 뜰
  - 경비 뜰
  rationale: 본문은 예레미야가 공식 감옥의 법정 절차 안이 아니라 경비가 지키는 억류 공간에 있었음을 보여 주므로, 너무 제도화된 ‘감옥’보다 기능을 드러내는 표현이 더 적절합니다.
  doctrine_reference: 역사-서술 맥락
