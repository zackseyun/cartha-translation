- from: 그들이 예레미야를 붙잡아 왕의 아들 말기야의 구덩이[a]에 던져 넣었습니다. 그 구덩이는 경비 대기소[b] 뜰에 있었고, 그들은 예레미야를 줄[c]로 내려 보냈습니다. 그 구덩이에는 물이 없고 진흙뿐이었으며, 예레미야는 진흙 속으로 가라앉았습니다.
  to: 그들은 예레미야를 데려다가 왕의 아들 말기야의 저수조[a]에 던져 넣었습니다. 그 저수조는 경비대 뜰[b]에 있었습니다. 그들은 줄[c]로 예레미야를 내려보냈습니다. 그 저수조에는 물이 없고 진흙뿐이었으며, 예레미야는 진흙 속에 가라앉았습니다.
  rationale: 저수조라는 공간의 성격, 경비·억류 구역의 의미, 그리고 예레미야가 진흙 속으로 가라앉은 결과를 원문에 맞게 더 분명하고 자연스러운 현대 합쇼체로 다듬었습니다. 각주 표지는 해당 어구 바로 뒤에 유지했으며, 불필요하게 강한 해석이나 부정확한 ‘우물’ 대안은 제거했습니다.
  reviewer_model: gpt-5.6-terra
