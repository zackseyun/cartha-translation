  alternatives_korean:
  - 점령된
  - 사로잡힌
  - 빼앗긴
  lexicon: HALOT
  rationale: 도시가 적에게 넘어지는 군사적 상황에서는 ‘함락되다’가 가장 직접적이며, POB의 ‘was captured’와도 잘 대응합니다.
- source_word: וְהָיָה כַּאֲשֶׁר
  english_pob_choice: And it happened when
  chosen_korean: 그리고 … 때—
  alternatives_korean:
  - 그때 … 일어났습니다
  - 그리고 … 때였습니다
  - 그러고 나서 …
  lexicon: HALOT
  rationale: 히브리어 문장이 다음 단락으로 이어지는 전이표현으로 끝나므로, 한국어에서도 미완의 연결감을 살려 서술을 닫지 않았습니다.
theological_decisions:
- issue: 절의 종결이 다음 단락을 예고하는 미완성 형식인지 여부
  chosen_reading: 마지막 절을 완결된 진술로 닫지 않고, 다음 본문으로 이어지는 절단된 연결로 반영했습니다.
  alternative_readings:
  - 완결된 문장으로 매끈하게 정리함
  - 다음 절 내용을 보충해 완성함
  rationale: 원문은 ‘그리고 예루살렘이 함락되었을 때—’에서 끊기며, POB 주석도 이것이 다음 단락으로 넘어가는 전이일 가능성을 밝힙니다. 이를 평탄화하면 원문의 긴장과 문학적 절단이 사라집니다.
  doctrine_reference: 문학적-본문비평적 보존 원칙
