  text: And Jeremiah remained in the court of the guard until the day Jerusalem was captured[b][a]. And it happened when Jerusalem was captured—
  footnotes:
  - marker: a
    text: 'The Hebrew ends abruptly: ''And it happened when Jerusalem was captured—'' This likely functions as a transition into the following material rather than a complete sentence by itself.'
    reason: textual_variant
  - marker: b
    text: Or 'was taken' for 'was captured.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예레미야는 예루살렘이 함락된 날까지 경호대 뜰에 머물러 있었습니다. 그리고 예루살렘이 함락되었을 때—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기서 갑자기 끝납니다. ‘그리고 예루살렘이 함락되었을 때—’는 아마도 다음 단락으로 이어지는 전이 구문일 가능성이 큽니다.
    reason: textual_variant
  - marker: b
    text: ‘함락되었을 때’는 ‘포로로 잡혔을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
