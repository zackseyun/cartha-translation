  text: 예레미야는 예루살렘이 함락된 날까지 경비대 뜰에 머물러 있었습니다. 그리고 예루살렘이 함락되었을 때—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 여기서 갑자기 끝납니다. ‘그리고 예루살렘이 함락되었을 때—’는 아마도 다음 단락으로 이어지는 전이 구문일 가능성이 큽니다.
    reason: textual_variant
  - marker: b
    text: ‘함락되었을 때’는 ‘점령되었을 때’로도 옮길 수 있습니다.
    reason: lexical_alternative
