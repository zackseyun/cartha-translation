  source_fidelity: 마지막 절의 주어·목적어 관계를 바로잡아야 합니다. וְאֶת הָעִיר הַזֹּאת תִּשְׂרֹף בָּאֵשׁ에서 목적표지 אֶת이 ‘이 성읍’을 표시하므로, תִּשְׂרֹף는 문맥상 2인칭 남성 단수 ‘당신이 불태울 것입니다’입니다. 성읍이 저절로 ‘불에 타 없어질 것’이라는 번역은 행위 주체를 바꿉니다. 나머지 절들은 아내들과 아들들이 갈대아인들에게 넘겨지고, 수신자가 그들의 손에서 벗어나지 못해 바빌론 왕의 손에 사로잡히게 된다는 뜻을 충실히 전달합니다.
  naturalness: ‘끌려 나와 … 넘겨질 것입니다’는 수동 강제 이동과 목적지/인계 대상을 자연스럽게 드러냅니다. ‘손아귀’는 한국어에서 권세·지배의 관용적 뜻을 자연스럽게 전달하며, 두 번째 ‘손’은 원문의 반복 이미지를 따라 유지했습니다.
  terminology: ‘갈대아인들’, ‘바빌론 왕’, ‘성읍’은 적절합니다. ‘아내들’과 ‘아들들’은 각각의 성별을 특정하는 원문을 보존합니다. 기존 c 각주는 동사 분석을 잘못 설명하므로, 2인칭 남성 단수 및 목적표지에 따른 구문으로 수정해야 합니다.
