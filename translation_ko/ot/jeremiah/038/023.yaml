  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유형은 왕의 가문을 가리키며, 문맥상 ‘아내들’과 ‘아들들’이 가장 직접적이고 구체적입니다.
- source_word: מֹוצִאִים
  english_pob_choice: will be brought out
  chosen_korean: 끌려갈 것입니다
  alternatives_korean:
  - 밖으로 끌려나갈 것입니다
  - 데려나가질 것입니다
  lexicon: HALOT
  rationale: 수동적 강제 이동을 자연스러운 한국어로 옮기되, 단순한 자발적 ‘나감’이 아니라 포로로 끌려감의 뉘앙스를 살렸습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아인들
  alternatives_korean:
  - 바빌로니아인들
  lexicon: HALOT
  rationale: 히브리어 민족명 자체를 살려 ‘갈대아인들’로 옮겼고, ‘바빌로니아인들’은 해석적 동의어이므로 본문에는 두지 않았습니다.
- source_word: מִיָּדָם / בְיַד מֶלֶךְ בָּבֶל
  english_pob_choice: from their hand / by the hand of the king of Babylon
  chosen_korean: 그들의 손에서 / 바빌론 왕의 손에
  alternatives_korean:
  - 그들의 권세에서 / 바빌론 왕에게
  lexicon: HALOT
  rationale: ‘손’은 히브리어의 권세·통제의 관용구를 보존하는 핵심 이미지이므로, 의미를 풀기보다 본문 이미지를 유지했습니다.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  english_pob_choice: will be burned with fire
  chosen_korean: 불에 타 없어질 것입니다
  alternatives_korean:
  - 불로 타게 될 것입니다
  - 불에 의해 불살라질 것입니다
  lexicon: HALOT
  rationale: 도시가 스스로 타는 것이 아니라 소멸되는 결과를 강조하는 수동적 의미를 한국어 자연문으로 표현했습니다.
