  text: וְ/אֶת כָּל נָשֶׁ֣י/ךָ וְ/אֶת בָּנֶ֗י/ךָ מֽוֹצִאִים֙ אֶל הַ/כַּשְׂדִּ֔ים וְ/אַתָּ֖ה לֹא תִמָּלֵ֣ט מִ/יָּדָ֑/ם כִּ֣י בְ/יַ֤ד מֶֽלֶךְ בָּבֶל֙ תִּתָּפֵ֔שׂ וְ/אֶת הָ/עִ֥יר הַ/זֹּ֖את תִּשְׂרֹ֥ף בָּ/אֵֽשׁ־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/023.yaml
  text: And all your wives and your sons will be brought out to the Chaldeans[a], and you yourself will not escape from their hand, for you will be seized by the hand of the king of Babylon[c][b], and this city will be burned with fire.
  footnotes:
  - marker: a
    text: Or 'the Babylonians' for 'the Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from their hand' and 'by the hand of the king of Babylon' are idioms for power or control.
    reason: cultural_note
  - marker: c
    text: The Hebrew verb is feminine singular, agreeing with 'city'; the sense is that the city will be burned.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 아내들과 아들들은 갈대아인들[a]에게 끌려갈 것입니다. 당신은 그들의 손에서 결코 벗어나지 못할 것이며, 바빌론 왕의 손[b]에 사로잡힐 것입니다. 이 성읍은 불에 타 없어질 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌로니아인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손’은 여기서 실제 신체 일부가 아니라 권세와 통제를 뜻하는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 동사는 여성 단수형으로 ‘성읍’에 호응합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֶׁיךָ / בָּנֶיךָ
  english_pob_choice: your wives / your sons
  chosen_korean: 당신의 아내들과 아들들
  alternatives_korean:
  - 당신의 여자들과 아들들
  - 당신의 아내들과 자녀들
  lexicon: HALOT
  rationale: 2인칭 남성 단수 소유형은 왕의 가문을 가리키며, 문맥상 ‘아내들’과 ‘아들들’이 가장 직접적이고 구체적입니다.
- source_word: מֹוצִאִים
  english_pob_choice: will be brought out
  chosen_korean: 끌려갈 것입니다
  alternatives_korean:
  - 밖으로 끌려나갈 것입니다
  - 데려나가질 것입니다
  lexicon: HALOT
  rationale: 수동적 강제 이동을 자연스러운 한국어로 옮기되, 단순한 자발적 ‘나감’이 아니라 포로로 끌려감의 뉘앙스를 살렸습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아인들
  alternatives_korean:
  - 바빌로니아인들
  lexicon: HALOT
  rationale: 히브리어 민족명 자체를 살려 ‘갈대아인들’로 옮겼고, ‘바빌로니아인들’은 해석적 동의어이므로 본문에는 두지 않았습니다.
- source_word: מִיָּדָם / בְיַד מֶלֶךְ בָּבֶל
  english_pob_choice: from their hand / by the hand of the king of Babylon
  chosen_korean: 그들의 손에서 / 바빌론 왕의 손에
  alternatives_korean:
  - 그들의 권세에서 / 바빌론 왕에게
  lexicon: HALOT
  rationale: ‘손’은 히브리어의 권세·통제의 관용구를 보존하는 핵심 이미지이므로, 의미를 풀기보다 본문 이미지를 유지했습니다.
- source_word: תִּשְׂרֹף בָּאֵשׁ
  english_pob_choice: will be burned with fire
  chosen_korean: 불에 타 없어질 것입니다
  alternatives_korean:
  - 불로 타게 될 것입니다
  - 불에 의해 불살라질 것입니다
  lexicon: HALOT
  rationale: 도시가 스스로 타는 것이 아니라 소멸되는 결과를 강조하는 수동적 의미를 한국어 자연문으로 표현했습니다.
theological_decisions:
