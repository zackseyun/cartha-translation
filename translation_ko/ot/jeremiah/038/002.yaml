  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּה֮ אָמַ֣ר יְהוָה֒ הַ/יֹּשֵׁב֙ בָּ/עִ֣יר הַ/זֹּ֔את יָמ֕וּת בַּ/חֶ֖רֶב בָּ/רָעָ֣ב וּ/בַ/דָּ֑בֶר וְ/הַ/יֹּצֵ֤א אֶל הַ/כַּשְׂדִּים֙ יחיה וְ/הָיְתָה לּ֥/וֹ נַפְשׁ֛/וֹ לְ/שָׁלָ֖ל וָ/חָֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/002.yaml
  text: 'Thus says Yahweh: He who remains in this city will die by the sword[a], by famine, and by pestilence; but he who goes out to the Chaldeans will live, and his life will be to him as spoil, and he will live.'
  footnotes:
  - marker: a
    text: Or, 'and he will have his life as plunder/booty'—a Hebrew idiom meaning he will escape with his life.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. “이 성에 머무르는 자는 칼과 기근과 전염병으로 죽을 것이지만, 갈대아 사람들에게 나가는 자는 살고, 자기의 생명을 노획물로 얻을 것이며[a], 그는 살 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘목숨을 건지다’ 또는 ‘생명을 건져 나오다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문에 직접 있는 언약 이름을 살리기 위해 프로젝트 기본값대로 ‘야훼’를 사용했습니다.
- source_word: הַיֹּשֵׁב
  english_pob_choice: He who remains
  chosen_korean: 머무르는 자
  alternatives_korean:
  - 사는 자
  - 거하는 자
  - 남아 있는 자
  lexicon: HALOT
  rationale: יָשַׁב의 분사형은 여기서 성 안에 계속 머무는 사람을 가리키므로, 현대 한국어에서 자연스럽고 문맥에 맞는 ‘머무르는 자’로 옮겼습니다.
- source_word: וְהָיְתָה לוֹ נַפְשׁוֹ לְשָׁלָל
  english_pob_choice: and his life will be to him as spoil
  chosen_korean: 그의 생명은 그에게 노획물이 될 것이며
  alternatives_korean:
  - 그의 생명은 그에게 전리품이 될 것이며
  - 그는 목숨을 건질 것이며
  - 그의 생명은 그에게 탈취물처럼 될 것이며
  lexicon: HALOT
  rationale: נֶפֶשׁ는 이 관용구에서 ‘생명/목숨’의 뜻이므로 ‘생명’으로 옮겼고, לְשָׁלָל은 전쟁 이미지인 ‘노획물’로 살려 ‘목숨만 건지는’ 의미를 너무 풀지 않게 했습니다.
- source_word: כַּשְׂדִּים
  english_pob_choice: Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 바빌로니아 사람들
  - 갈대아인들
  lexicon: HALOT
  rationale: 영어 POB의 원문 대응을 따라 고유 집단명 ‘갈대아 사람들’을 유지해, 본문의 정치·역사적 지시를 보존했습니다.
theological_decisions:
- issue: 직접 화자 표지로서의 야훼 이름 처리
  chosen_reading: ‘야훼께서 이렇게 말씀하십니다’로 직접 화자를 드러냈습니다.
  alternative_readings:
  - ‘주께서 이렇게 말씀하십니다’
  - ‘여호와께서 이같이 말씀하셨습니다’
  rationale: 원문은 יְהוָה를 직접 사용하므로, 일반적인 ‘주’로 완화하지 않고 고유 이름을 보존하는 것이 source-direct합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: נֶפֶשׁ의 의미
  chosen_reading: ‘생명’
  alternative_readings:
  - ‘목숨’
  - ‘혼’
  rationale: 이 문맥은 포위 상황에서의 생존을 말하므로, 영혼론적 함의를 피하고 육체적 생존을 가리키는 ‘생명’이 가장 정확합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
