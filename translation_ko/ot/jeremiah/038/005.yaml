base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/005.yaml
  text: Then King Zedekiah said[a], “Look, he is in your hands, for the king can do nothing against you.”
  footnotes:
  - marker: a
    text: Or, more literally, 'the king is not able [to do] a thing with respect to you.' The sense in context is that he cannot act against or overrule them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 시드기야 왕이 말했습니다. 「보십시오, 그가 당신들 손에 있습니다. 왕은 당신들을 상대로 아무것도 할 수 없습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕은 당신들에 관하여/당신들을 상대로 한 일을 할 수 없습니다’에 가깝습니다. 문맥상 그는 그들을 제압하거나 판결을 뒤집을 수 없다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 연결어로, 현대 한국어에서 자연스러운 순차성을 살리면서도 원문의 진행력을 유지합니다.
- source_word: הַמֶּלֶךְ צִדְקִיָּהוּ
  english_pob_choice: King Zedekiah
  chosen_korean: 시드기야 왕
  alternatives_korean:
  - 시드기야
  - 왕 시드기야
  lexicon: HALOT
  rationale: 왕호-이름 결합을 한국어 자연어 순서로 옮겼고, 고유명사는 현대 음역을 따랐습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 주의하십시오
  lexicon: HALOT
  rationale: 주의를 끄는 지시어로서 구어체적이되 공손한 합쇼체 명령형을 사용해 현대 독자에게 자연스럽게 전달합니다.
- source_word: בְּיֶדְכֶם
  english_pob_choice: in your hands
  chosen_korean: 당신들 손에
  alternatives_korean:
  - 당신들의 손에
  - 당신들 권세 아래
  lexicon: HALOT
  rationale: ‘손’의 비유를 그대로 살려 권세/통제의 뜻을 드러내되, 문맥상 복수 상대를 분명히 하기 위해 ‘당신들’로 옮겼습니다.
- source_word: אֶתְכֶם דָּבָר
  english_pob_choice: against you
  chosen_korean: 당신들을 상대로 아무것도
  alternatives_korean:
  - 당신들에게 아무것도
  - 당신들을 반대하여 아무 일도
  lexicon: HALOT
  rationale: 히브리어의 생략된 관용구를 문맥상 ‘대항해 아무것도 할 수 없다’는 뜻으로 풀어, POB의 해석을 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 왕의 자기 지칭 방식(‘the king can do nothing’)
  chosen_reading: ‘왕은 ... 할 수 없습니다’로 3인칭 자기 지칭을 유지했습니다.
  alternative_readings:
  - ‘나는 ... 할 수 없습니다’로 1인칭화
  - ‘제가 왕이라도 ... 할 수 없습니다’로 의역
  rationale: 히브리어가 왕을 3인칭으로 지칭하는 형태를 보존해, 왕실적/수사적 거리를 유지합니다. 문맥의 의미는 분명하므로 현대어화는 최소한으로만 적용했습니다.
  doctrine_reference: 역사서의 화법 보존 원칙
- issue: ‘손에 있다’는 표현
  chosen_reading: 권력/통제의 관용구를 직역에 가깝게 살렸습니다.
  alternative_readings:
  - ‘통제 아래에 있다’
  - ‘맘대로 할 수 있다’
  rationale: 원문의 이미지가 권세의 귀속을 보여 주므로, 의미를 풀어 쓰되 핵심 비유는 보존했습니다.
  doctrine_reference: 원문 이미지 보존
