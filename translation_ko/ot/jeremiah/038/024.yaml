  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
  footnotes:
  - marker: a
    text: Or “Let no one know of these matters.” The Hebrew uses “man” generically.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may imply result or purpose: “so that you will not die.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시드기야가 예레미야에게 말했습니다. 「이 일들에 대해서는 아무도[a] 알지 못하게 하시오. 그리고 당신은 죽지 않을 것입니다.[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ는 여기서 특정 성별을 강조하기보다 ‘아무도’에 해당하는 일반적 표현으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: '마지막 절은 단순한 연결로 옮길 수도 있으나, 문맥상 결과나 목적을 나타내는 뜻으로도 읽을 수 있습니다: “그러면 당신은 죽지 않을 것입니다.”'
    reason: lexical_alternative
