language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר צִדְקִיָּ֜הוּ אֶֽל יִרְמְיָ֗הוּ אִ֛ישׁ אַל יֵדַ֥ע בַּ/דְּבָֽרִים הָ/אֵ֖לֶּה וְ/לֹ֥א תָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/024.yaml
  text: Then Zedekiah said to Jeremiah[a], “Let no one know about these things[b], and you will not die.”
  footnotes:
  - marker: a
    text: Or “Let no one know of these matters.” The Hebrew uses “man” generically.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause may imply result or purpose: “so that you will not die.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시드기야가 예레미야에게 말했습니다. 「아무도 이 일들을 알지 못하게 하시오. 그러면 당신은 죽지 않을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 אִישׁ는 여기서 특정 성별을 강조하기보다 ‘아무도’에 해당하는 일반적 표현으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: '마지막 절은 단순한 연결보다 결과를 나타내는 뜻으로도 읽을 수 있습니다: “그러면 당신은 죽지 않을 것입니다.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그때 ...가 말했습니다
  alternatives_korean:
  - 그리고 ...가 말했습니다
  - 그런 다음 ...가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 진행을 한국어 자연문으로 옮기되, 사건의 순차성을 살려 ‘그때’로 시작했습니다.
- source_word: צִדְקִיָּהוּ
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 세드기야
  - 시드키야
  lexicon: 표준 음역 관행
  rationale: 히브리어 인명을 현대 한국어 성경 관행에 맞춰 음역했습니다.
- source_word: אִישׁ אַל יֵדַע
  english_pob_choice: Let no man know
  chosen_korean: 아무도 ... 알지 못하게 하시오
  alternatives_korean:
  - 어떤 사람도 ... 알지 못하게 하시오
  - 사람 하나도 ... 알지 못하게 하시오
  lexicon: HALOT
  rationale: אִישׁ의 일반적 남성형을 한국어에서는 자연스러운 총칭 표현 ‘아무도’로 옮겨, 문맥의 금지 명령을 분명하게 했습니다.
- source_word: בַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: about these things
  chosen_korean: 이 일들을
  alternatives_korean:
  - 이런 일들을
  - 이 일에 대해
  lexicon: HALOT
  rationale: דְּבָרִים는 여기서 방금 말한 ‘사정/일들’을 가리키므로, 한국어에서는 간결하게 ‘이 일들’로 옮겼습니다.
- source_word: וְלֹא תָמוּת
  english_pob_choice: and you will not die
  chosen_korean: 그러면 당신은 죽지 않을 것입니다
  alternatives_korean:
  - 그리고 당신은 죽지 않을 것입니다
  - 그래서 당신은 죽지 않을 것입니다
  lexicon: HALOT
  rationale: 마지막 절은 결과를 나타낼 수 있으므로, POB의 주석 가능성을 반영해 한국어에서는 결과 뉘앙스가 드러나도록 ‘그러면’으로 자연스럽게 풀었습니다.
