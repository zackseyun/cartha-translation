- source_word: וְלֹא תָמוּת
  english_pob_choice: and you will not die
  chosen_korean: 그러면 당신은 죽지 않을 것입니다
  alternatives_korean:
  - 그리고 당신은 죽지 않을 것입니다
  - 그래서 당신은 죽지 않을 것입니다
  lexicon: HALOT
  rationale: 마지막 절은 결과를 나타낼 수 있으므로, POB의 주석 가능성을 반영해 한국어에서는 결과 뉘앙스가 드러나도록 ‘그러면’으로 자연스럽게 풀었습니다.
