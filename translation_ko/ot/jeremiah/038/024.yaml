- source_word: אִישׁ אַל יֵדַע
  english_pob_choice: Let no man know
  chosen_korean: 아무도 ... 알지 못하게 하시오
  alternatives_korean:
  - 어떤 사람도 ... 알지 못하게 하시오
  - 사람 하나도 ... 알지 못하게 하시오
  lexicon: HALOT
  rationale: אִישׁ의 일반적 남성형을 한국어에서는 자연스러운 총칭 표현 ‘아무도’로 옮겨, 문맥의 금지 명령을 분명하게 했습니다.
- source_word: בַּדְּבָרִים הָאֵלֶּה
  english_pob_choice: about these things
