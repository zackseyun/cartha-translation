lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 또 만일
  lexicon: HALOT
  rationale: 조건절이 앞선 진술과 대조를 이루므로, 한국어에서는 연결보다 역접 뉘앙스를 살린 ‘그러나 만일’이 자연스럽습니다.
- source_word: מָאֵן
  english_pob_choice: refuse
  chosen_korean: 거부하시면
  alternatives_korean:
  - 마지않으시면
  - 마음을 바꾸지 않으시면
  lexicon: HALOT
  rationale: 단순한 불능이 아니라 의지적인 거절을 가리키므로 ‘거부하시면’이 원문의 강한 거부 뜻을 살립니다.
- source_word: לָצֵאת
  english_pob_choice: to go out
  chosen_korean: 나가기를
  alternatives_korean:
  - 나서는 것을
  - 나아가기를
  lexicon: HALOT
  rationale: 직역상 ‘나가다’이지만, 문맥상 성 밖으로 나가 바벨론 군대 쪽으로 나아가는 행위를 가리키므로 과도한 해석인 ‘항복하다’는 피하고 동작을 그대로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: POB의 기준에 따라 여호와 대신 ‘야훼’를 사용하여 고유명으로서의 신적 이름을 보존합니다.
theological_decisions:
- issue: ‘나가다’의 맥락적 의미
  chosen_reading: 본문은 ‘항복하다’를 명시하지 않고 ‘나가다’를 유지합니다.
  alternative_readings:
  - 항복하다
  - 성 밖으로 나가 항복하다
  rationale: 히브리어 본문은 출행 동사를 사용하며, 본문의 직접 표현을 넘어서 항복을 명시하면 의미를 좁히거나 추가하게 됩니다.
  doctrine_reference: Source fidelity / non-expansion principle
- issue: 신적 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 계시 발화에서 고유한 언약 이름을 제목어로 바꾸지 않고 직접 표기해 원문 효과를 유지합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
