translation:
  language: ko
  text: 그러나 만일 당신이 나가기를 거부하시면, 이것이 야훼께서 저에게 보여 주신 말씀입니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 야훼께서 저에게 보여 주신 사안입니다.’
