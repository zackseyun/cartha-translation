base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/019.yaml
  text: Then King Zedekiah said to Jeremiah[a], “I am afraid of the Judeans who have defected to the Chaldeans[e][d][c][b], lest they hand me over to them and they mistreat me.”
  footnotes:
  - marker: a
    text: Or “the Jews.” The Hebrew term here refers specifically to people of Judah in this historical setting, so “Judeans” is used for precision.
    reason: lexical_alternative
  - marker: b
    text: Or “have gone over to” or “have surrendered to.”
    reason: lexical_alternative
  - marker: c
    text: 'Or “the Babylonians.” Hebrew: “the Chaldeans.”'
    reason: lexical_alternative
  - marker: d
    text: Literally “give me into their hand.”
    reason: lexical_alternative
  - marker: e
    text: Or “mistreat me” or “deal cruelly with me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시드기야 왕이 예레미야에게 말했습니다. “나는 바빌론 사람들에게[c] 넘어간[b] 유다 사람들[a]이 두렵습니다. 그들이 나를 바빌론 사람들에게 넘겨주면[d], 바빌론 사람들이 나를 학대할까[e] 두렵습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유대인들.” 이 히브리어 표현은 이 역사적 문맥에서 유다의 사람들을 가리키므로, 정확성을 위해 “유다 사람들”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “넘어가 버린”, “항복한” 또는 “편을 바꾼.”
    reason: lexical_alternative
  - marker: c
    text: 또는 “갈대아 사람들.” 히브리어는 “갈대아 사람들”입니다.
    reason: lexical_alternative
  - marker: d
    text: 문자적으로는 “나를 그들의 손에 주면”입니다.
    reason: lexical_alternative
  - marker: e
    text: 또는 “나를 괴롭힐까” 또는 “나를 가혹하게 다룰까.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְהוּדִים
  english_pob_choice: the Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 이 절의 역사적 문맥에서는 후대의 종교·민족 일반 명칭보다 유다 지역의 사람들을 가리키므로, ‘유다 사람들’로 옮겨 구체성을 살렸습니다.
- source_word: נָפְלוּ אֶל
  english_pob_choice: have defected to
  chosen_korean: 돌아간
  alternatives_korean:
  - 항복한
  - 배신하여 넘어간
  - 편을 바꾼
  lexicon: HALOT
  rationale: 군사·정치 문맥의 idiom으로서 ‘~쪽으로 넘어가다/가다’의 의미를 담되, 현대 한국어에서 자연스럽게 들리는 ‘돌아간’으로 처리했습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 바빌론 사람들
  alternatives_korean:
  - 갈대아 사람들
  - 갈대아인들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘갈대아 사람들’이지만, 예레미야에서 가리키는 정치·군사 세력이 바빌론 제국이므로 독자가 즉시 이해하도록 본문은 ‘바빌론 사람들’로 옮기고, 원어 표지는 각주로 보완했습니다.
- source_word: יִתְּנוּ אֹתִי בְּיָדָם
  english_pob_choice: they hand me over to them
  chosen_korean: 나를 그들에게 넘겨 주면
  alternatives_korean:
  - 나를 그들 손에 넘기면
  - 나를 그들의 손에 내주면
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 손에 나를 주다’이지만, 한국어에서는 ‘넘겨 주다’가 같은 수동적 인계의 뜻을 가장 자연스럽게 전달합니다.
- source_word: וְהִתְעַלְּלוּ בִי
  english_pob_choice: and they mistreat me
  chosen_korean: 나를 학대할까
  alternatives_korean:
  - 나를 괴롭힐까
  - 나를 학대하고 조롱할까
  - 나를 심하게 다룰까
  lexicon: HALOT
  rationale: 히브리어는 단순한 조롱보다 더 강한 가혹한 대우를 뜻하므로, 본문의 두려움의 강도를 살리는 ‘학대하다’를 택했습니다.
theological_decisions:
- issue: 예레미야 38:19의 ‘갈대아 사람들’ 표현을 한국어 본문에서 어떻게 처리할지
  chosen_reading: 본문은 이해도를 위해 ‘바빌론 사람들’로 옮기고, 각주로 원문 ‘갈대아 사람들’을 밝힙니다.
  alternative_readings:
  - 본문에 ‘갈대아 사람들’ 유지
  - 본문에 ‘갈대아인들’ 유지
  rationale: 예레미야서에서 ‘갈대아 사람들’은 바빌론 제국군을 가리키는 역사적 명칭이므로, 의미 전달을 우선하되 원문 특수성은 각주로 보존하는 것이 가장 균형적입니다.
  doctrine_reference: 역사서술의 지시 대상 보존과 가독성 균형
- issue: ‘학대하다’의 강도
  chosen_reading: ‘학대하다’로 옮겨 פן 이 문장에 내포된 공포와 וְהִתְעַלְּלוּ בִי의 가혹함을 드러냅니다.
  alternative_readings:
  - ‘괴롭히다’
  - ‘못살게 굴다’
  - ‘미워하다’
  rationale: 이 동사는 단순 불편함이 아니라 실제적 가혹 행위를 암시하므로, 약화된 표현보다 강한 표현이 문맥에 더 충실합니다.
  doctrine_reference: 본문의 감정·폭력적 뉘앙스 보존
