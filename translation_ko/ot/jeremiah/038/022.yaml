source:
  edition: WLC
  text: וְ/הִנֵּ֣ה כָל הַ/נָּשִׁ֗ים אֲשֶׁ֤ר נִשְׁאֲרוּ֙ בְּ/בֵ֣ית מֶֽלֶךְ יְהוּדָ֔ה מוּצָא֕וֹת אֶל שָׂרֵ֖י מֶ֣לֶךְ בָּבֶ֑ל וְ/הֵ֣נָּה אֹמְר֗וֹת הִסִּית֜וּ/ךָ וְ/יָכְל֤וּ לְ/ךָ֙ אַנְשֵׁ֣י שְׁלֹמֶ֔/ךָ הָטְבְּע֥וּ בַ/בֹּ֛ץ רַגְלֶ֖/ךָ נָסֹ֥גוּ אָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/022.yaml
  text: And behold[a], all the women who remain in the house of the king of Judah are being brought out to the officials of the king of Babylon, and they are saying, ‘The men at peace with you have misled you and overcome you; your feet have sunk into the mud[b]; they have turned back.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''the men of your peace,'' an idiom for those on friendly terms with you, that is, your allies or close associates.'
    reason: lexical_alternative
  - marker: b
    text: Or 'your feet have sunk into the mire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 유다 왕의 궁전에 남아 있는 모든 여인들이 바빌론 왕의 고관들 앞에 끌려나오고 있으며, 그들은 이렇게 말하고 있습니다. “당신과 친분이 있던 사람들이 당신을 속이고 당신을 이겼습니다. 당신의 발은 진흙에 빠졌고[b], 그들은 뒤로 물러났습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘당신의 평화의 사람들’이라는 관용구로, 당신과 우호 관계에 있던 동맹자나 가까운 측근을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 발은 진흙탕에 빠졌고’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 화용 표지를 자연스러운 현대 한국어 명령형으로 옮기되, 예언적 장면 전환의 긴박함을 유지했습니다.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  english_pob_choice: the officials of the king of Babylon
  chosen_korean: 바빌론 왕의 고관들
  alternatives_korean:
  - 바빌론 왕의 관리들
  - 바빌론 왕의 방백들
  lexicon: HALOT
  rationale: שָׂרִים의 넓은 의미를 살려 신분을 과도하게 특정하지 않는 ‘고관들’을 선택했습니다.
- source_word: הִסִּיתוּךָ
  english_pob_choice: have misled you
  chosen_korean: 당신을 속이고
  alternatives_korean:
  - 당신을 미혹하고
  - 당신을 선동하고
  - 당신을 유혹하고
  lexicon: HALOT
  rationale: 히필의 שׂוּת 계열이 지닌 ‘부추기다/유인하다/그릇 인도하다’의 폭을 한국어로 압축해, 이 정치적 조롱에서 자연스럽게 드러나는 기만성을 살렸습니다.
- source_word: וְיָכְלוּ לְךָ
  english_pob_choice: and overcome you
  chosen_korean: 당신을 이겼습니다
  alternatives_korean:
  - 당신을 압도했습니다
  - 당신을 제압했습니다
  - 당신을 이겨 냈습니다
  lexicon: HALOT
  rationale: יָכַל + ל의 ‘대항하여 이기다/능가하다’의 뜻을 간결하게 전달하면서, 여성들의 조롱어투에 맞는 직접성을 유지했습니다.
- source_word: הָטְבְּעוּ בַבֹּץ רַגְלֶךָ
  english_pob_choice: your feet have sunk into the mud
  chosen_korean: 당신의 발은 진흙에 빠졌고
  alternatives_korean:
  - 당신의 발은 진흙 속에 잠겼고
  - 당신의 발은 늪에 빠졌고
  - 당신의 발은 진흙탕에 빠졌고
  lexicon: HALOT
  rationale: 이미지를 그대로 살리되, ‘빠졌고’로 동작 완료와 함정을 동시에 전달해 본문의 조롱적 시각성을 유지했습니다.
theological_decisions:
- issue: 히브리어 관용구 אַנְשֵׁי שְׁלֹמֶךָ의 처리
  chosen_reading: ‘당신과 친분이 있던 사람들이’로 옮겨, 단순한 친구보다 넓은 동맹·우호 관계를 드러냈습니다.
  alternative_readings:
  - 당신의 친구들
  - 당신과 평화로운 사람들이
  - 당신의 동맹자들
  rationale: 직역인 ‘평화의 사람들’은 한국어에서 의미가 불투명하므로, 주석 없이도 관용적 의미가 드러나도록 했습니다.
  doctrine_reference: 관용구의 역사-문맥적 의미 보존
- issue: 직접 인용 속 조롱의 화법
  chosen_reading: 여인들의 발화는 그대로 따옴표 안에 두고, 현대 한국어의 직설적 조롱조로 유지했습니다.
  alternative_readings:
  - 더 완곡한 서술체로 완화
  - ‘이겼습니다’ 대신 ‘제압했습니다’ 사용
  rationale: 본문은 패배를 조롱하는 생생한 수사를 담고 있으므로, 의미를 약화하지 않도록 직설성을 살렸습니다.
  doctrine_reference: 예언문학의 수사적 강도 보존
