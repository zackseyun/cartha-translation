  text: וְ/כִֽי יִשְׁמְע֣וּ הַ/שָּׂרִים֮ כִּֽי דִבַּ֣רְתִּי אִתָּ/ךְ֒ וּ/בָ֣אוּ אֵלֶ֣י/ךָ וְֽ/אָמְר֪וּ אֵלֶ֟י/ךָ הַגִּֽידָ/ה נָּ֨א לָ֜/נוּ מַה דִּבַּ֧רְתָּ אֶל הַ/מֶּ֛לֶךְ אַל תְּכַחֵ֥ד מִמֶּ֖/נּוּ וְ/לֹ֣א נְמִיתֶ֑/ךָ וּ/מַה דִּבֶּ֥ר אֵלֶ֖י/ךָ הַ/מֶּֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/025.yaml
  text: But if the officials hear that I have spoken with you[a], and they come to you and say to you, ‘Please tell us what you said to the king; do not hide it from us, and we will not put you to death, and what the king said to you,’
  footnotes:
  - marker: a
    text: Or, 'the princes,' referring to the royal or governing leaders.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 만일 관리들이 내가 당신과 이야기한 것을 듣고 당신에게 와서, 당신에게 ‘부디 왕에게 무엇을 말했는지 우리에게 알려 주십시오. 우리에게 숨기지 마십시오. 우리는 당신을 죽이지 않겠습니다. 그리고 왕이 당신에게 무엇을 말했는지도,’라고 말한다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관리들’은 히브리어 שָׂרִים의 문맥상 번역입니다. ‘고관들’ 또는 ‘방백들’로도 옮길 수 있으며, 왕궁의 통치·행정 지도자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  english_pob_choice: But if
  chosen_korean: 만일
  alternatives_korean:
  - 그리고 만일
  - 그런데 만일
  lexicon: HALOT
  rationale: 조건을 여는 כי의 기능을 한국어의 자연스러운 조건 접속어로 옮겼습니다. 앞 문맥과 이어지지만, 여기서는 조건절이므로 ‘만일’이 가장 직접적입니다.
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 고관들
  - 방백들
  lexicon: HALOT
  rationale: 왕궁/행정 권력층을 가리키는 말로서, 문맥상 ‘공무자들’보다 넓은 ‘관리들’이 현대 한국어에서 가장 자연스럽고 중립적입니다.
- source_word: הַגִּידָה נָּא לָנוּ
  english_pob_choice: Please tell us
  chosen_korean: 부디 … 알려 주십시오
  alternatives_korean:
  - 부디 … 말해 주십시오
  - 제발 … 알려 주십시오
  lexicon: HALOT
  rationale: נָא의 간청을 ‘부디’로 살리고, נגד의 ‘알리다/말해 주다’는 ‘알려 주십시오’로 옮겨 청유의 정중함과 압박감을 함께 나타냈습니다.
- source_word: וְלֹא נְמִיתֶךָ
  english_pob_choice: and we will not put you to death
  chosen_korean: 그러면 우리가 당신을 죽이지 않겠습니다
  alternatives_korean:
  - 그러면 우리가 당신을 사형시키지 않겠습니다
  - 그러면 우리가 당신을 죽이지 않을 것입니다
  lexicon: HALOT
  rationale: Hiphil של מות의 사역적 의미를 한국어에서 가장 직설적인 ‘죽이지 않겠습니다’로 옮겼습니다. 법정적 협박의 뉘앙스를 유지하기 위해 ‘사형시키다’보다 덜 제도적 표현을 택했습니다.
