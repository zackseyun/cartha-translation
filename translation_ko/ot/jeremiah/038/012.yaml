  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר עֶבֶד מֶ֨לֶךְ הַ/כּוּשִׁ֜י אֶֽל יִרְמְיָ֗הוּ שִׂ֣ים נָ֠א בְּלוֹאֵ֨י הַ/סְּחָב֤וֹת וְ/הַ/מְּלָחִים֙ תַּ֚חַת אַצִּל֣וֹת יָדֶ֔י/ךָ מִ/תַּ֖חַת לַ/חֲבָלִ֑ים וַ/יַּ֥עַשׂ יִרְמְיָ֖הוּ כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/012.yaml
  text: Then Ebed-melech the Cushite said to Jeremiah[a], “Please put these worn-out rags and torn clothes under your armpits[c][b], under the ropes.” And Jeremiah did so.
  footnotes:
  - marker: a
    text: Or 'the Ethiopian.' The Hebrew says 'the Cushite,' referring to a man from Cush.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew terms for the materials are rare and likely refer to worn-out cloth items used as padding between Jeremiah's body and the ropes.
    reason: lexical_alternative
  - marker: c
    text: Literally 'under the joints of your hands/arms'; the sense here is the area under the arms where the ropes would press during lifting.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 구스 사람[a] 에벳멜렉이 예레미야에게 말했습니다. “부디 이 낡아 해진 헝겊과 낡은 옷[b]을 당신의 겨드랑이 밑[c], 밧줄 아래에 받치십시오.” 그러자 예레미야가 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에티오피아 사람’. 히브리어는 ‘구스 사람’이라 하며, 구스 출신의 사람을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 두 재료 명칭은 희귀하며, 문맥상 예레미야의 몸과 밧줄 사이에 넣는 낡은 천이나 옷감을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘당신의 팔의 관절 아래’입니다. 여기서는 밧줄이 눌리는 겨드랑이 부위를 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶבֶד מֶלֶךְ הַכּוּשִׁי
  english_pob_choice: Ebed-melech the Cushite
  chosen_korean: 구스 사람 에벳멜렉
  alternatives_korean:
  - 에벳멜렉 구스 사람
  - 구스인 에벳멜렉
  - 에티오피아 사람 에벳멜렉
  lexicon: HALOT
  rationale: 고유명사는 음역하고, הַכּוּשִׁי는 지명적 종족표지인 ‘구스 사람’으로 옮겨 원문 민족·지리 정보를 살렸습니다.
- source_word: שִׂים נָא
  english_pob_choice: Please put
  chosen_korean: 부디 ... 받쳐 두십시오
  alternatives_korean:
  - 부디 ... 놓으십시오
  - 청컨대 ... 넣으십시오
  - 제발 ... 두십시오
  lexicon: HALOT
  rationale: נָא의 간청 뉘앙스를 ‘부디’로 살리고, 여기서는 몸과 밧줄 사이에 끼워 넣는 동작이므로 ‘받쳐 두십시오’가 가장 자연스럽습니다.
- source_word: בְּלוֹאֵי הַסְּחָבוֹת וְהַמְּלָחִים
  english_pob_choice: worn-out rags and torn clothes
  chosen_korean: 해어진 누더기와 찢어진 옷
  alternatives_korean:
  - 낡아 해진 누더기와 천조각
  - 헤진 걸레와 헌옷
  - 해어진 헝겊과 찢어진 옷
  lexicon: HALOT
  rationale: 두 희귀어의 정확한 품목은 불확실하지만, 문맥상 예레미야의 몸과 밧줄 사이에 넣는 낡은 천조각류이므로 ‘해어진 누더기와 찢어진 옷’이 과도한 추정을 피하면서도 의미를 전달합니다.
- source_word: תַּחַת אַצִּלוֹת יָדֶיךָ מִתַּחַת לַחֲבָלִים
  english_pob_choice: under your armpits, under the ropes
  chosen_korean: 밧줄 아래, 곧 당신의 겨드랑이 아래
  alternatives_korean:
  - 겨드랑이 아래, 밧줄 아래
  - 팔관절 아래, 밧줄 아래
  - 겨드랑이 아래에, 밧줄 밑에
  lexicon: HALOT
  rationale: אַצִּלוֹת יָדִים은 문자적으로 팔의 아래쪽/관절 부위를 가리키며, 이 문맥에서는 밧줄이 닿는 겨드랑이 부위로 이해하는 것이 가장 분명합니다. ‘밧줄 아래, 곧 당신의 겨드랑이 아래’로 두 표현의 관계를 풀어 주었습니다.
- source_word: וַיַּעַשׂ יִרְמְיָהוּ כֵּן
  english_pob_choice: And Jeremiah did so
  chosen_korean: 그러자 예레미야가 그렇게 했습니다
  alternatives_korean:
  - 예레미야가 그대로 했습니다
  - 예레미야가 그렇게 하였습니다
  - 예레미야가 그리했습니다
  lexicon: HALOT
  rationale: 서술적 순응 공식은 현대 한국어에서 ‘그렇게 했습니다’가 가장 자연스럽고, 원문의 결과 진행을 간결하게 반영합니다.
theological_decisions:
- issue: 구스/에티오피아 표기 선택
  chosen_reading: 본문에는 ‘구스 사람’으로 두고, 영어 POB 주석이 제시한 ‘에티오피아 사람’은 각주로 보조했습니다.
  alternative_readings:
  - 에티오피아 사람
  - 쿠시 사람
  rationale: 원문 הַכּוּשִׁי의 직접 대응은 지명적 민족표지인 ‘구스 사람’이므로 본문은 원어 밀착형으로 두고, 전통적 역사 대응어는 보조 정보로 처리했습니다.
  doctrine_reference: source transparency / ethnogeographic precision
- issue: 희귀어 두 쌍의 천 재질 표현
  chosen_reading: 의미 범위가 넓은 ‘해어진 누더기와 찢어진 옷’으로 처리했습니다.
  alternative_readings:
  - 낡은 헝겊과 헌옷
  - 걸레와 옷조각
  rationale: 두 희귀어는 정확한 실물을 단정하기보다, 포박 밧줄에 대한 완충재라는 문맥 기능을 드러내는 번역이 더 충실합니다.
  doctrine_reference: lexical uncertainty handling
