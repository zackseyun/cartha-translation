source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יִרְמְיָ֣הוּ אֶל צִדְקִיָּ֡הוּ כֹּֽה אָמַ֣ר יְהוָה֩ אֱלֹהֵ֨י צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אִם יָצֹ֨א תֵצֵ֜א אֶל שָׂרֵ֤י מֶֽלֶךְ בָּבֶל֙ וְ/חָיְתָ֣ה נַפְשֶׁ֔/ךָ וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ וְ/חָיִ֖תָה אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/017.yaml
  text: 'Then Jeremiah said to Zedekiah[a], “Thus says Yahweh, the God of hosts, the God of Israel: If you indeed go out to the officials of the king of Babylon, your life will be spared, and this city will not be burned with fire[c][b]; and you and your household will live.”'
  footnotes:
  - marker: a
    text: Or, more literally, 'If you surely go out.' The Hebrew uses an infinitive absolute with a finite verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: Or 'your soul will live.' Here 'soul' refers to your life or self, that is, your survival.
    reason: lexical_alternative
  - marker: c
    text: Or 'you and your house will live.' 'Household' conveys the sense of family and dependents, not merely the building.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예레미야가 시드기야에게 말했습니다. "만군의 하나님이신 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 당신이 정말로 바벨론 왕의 고관들에게 나가면, 당신의 생명이 보전될 것이고, 이 성은 불에 타지 않을 것입니다[c][b]. 그리고 당신과 당신의 집안이 살 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 부정사 절대형과 동사형을 함께 써서, 단순한 ‘가면’보다 ‘정말로 나가면’이라는 강조를 담습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘당신의 혼/목숨이 살 것이다’이지만, 여기서는 ‘생명’ 또는 ‘목숨’이 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘집’은 건물만이 아니라 가족과 종속 인원을 포함한 ‘집안/가정’의 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִרְמְיָהוּ אֶל צִדְקִיָּהוּ
  english_pob_choice: Then Jeremiah said to Zedekiah
  chosen_korean: 그때 예레미야가 시드기야에게 말했습니다
  alternatives_korean:
  - 그리고 예레미야가 시드기야에게 말했습니다
  - 예레미야가 시드기야에게 말했습니다
  lexicon: WLC / 표준 한국어 인명 표기
  rationale: 서술 흐름의 와우 연속을 자연스러운 한국어의 순차 표현인 ‘그때’로 옮기고, 왕 이름 צִדְקִיָּהוּ는 통용 표기인 ‘시드기야’로 옮겼습니다.
- source_word: יְהוָה אֱלֹהֵי צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Yahweh, the God of hosts, the God of Israel
  chosen_korean: 만군의 하나님이신 야훼, 이스라엘의 하나님
  alternatives_korean:
  - 만군의 하나님 야훼, 이스라엘의 하나님
  - 만군의 야훼, 이스라엘의 하나님
  lexicon: HALOT
  rationale: יהוה는 프로젝트 기본값에 따라 ‘야훼’로, אֱלֹהֵי צְבָאוֹת는 소유격 구조를 살려 ‘만군의 하나님’으로 옮겨 원문의 호칭 층위를 유지했습니다.
- source_word: אִם יָצֹא תֵצֵא
  english_pob_choice: If you indeed go out
  chosen_korean: 당신이 정말로 나가면
  alternatives_korean:
  - 당신이 꼭 나가면
  - 당신이 확실히 나가면
  lexicon: HALOT
  rationale: 부정사 절대형+완료형의 강조를 한국어의 ‘정말로’로 간결하게 반영해, 단순 조건문보다 강한 촉구/강조를 드러냈습니다.
- source_word: שָׂרֵי מֶלֶךְ בָּבֶל
  english_pob_choice: the officials of the king of Babylon
  chosen_korean: 바벨론 왕의 고관들
  alternatives_korean:
  - 바벨론 왕의 관리들
  - 바벨론 왕의 지휘관들
  lexicon: HALOT
  rationale: שָׂרִים는 문맥상 군사 지휘관으로만 한정하기보다 왕의 측근 권력층을 가리키므로, 한국어에서 가장 무난한 ‘고관들’로 옮겼습니다.
- source_word: וְחָיְתָה נַפְשֶׁךָ
  english_pob_choice: your life will be spared
  chosen_korean: 당신의 생명이 보전될 것이고
  alternatives_korean:
  - 당신의 목숨이 살아 있을 것이고
  - 당신의 영혼이 살 것이고
  lexicon: HALOT
  rationale: נֶפֶשׁ는 여기서 비물질적 ‘영혼’이 아니라 생존하는 사람 자신의 삶을 뜻하므로, ‘생명이 보전되다’로 자연스럽게 옮겼습니다.
- source_word: וְ/הָ/עִ֣יר הַ/זֹּ֔את לֹ֥א תִשָּׂרֵ֖ף בָּ/אֵ֑שׁ
  english_pob_choice: this city will not be burned with fire
  chosen_korean: 이 성은 불에 타지 않을 것입니다
  alternatives_korean:
  - 이 성은 불로 타지 않을 것입니다
  - 이 성은 불에 불타지 않을 것입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘불로/불에’ 표현을 한국어에서 중복 없이 자연스럽게 처리하되, 파괴의 수단이 ‘불’임을 유지했습니다.
- source_word: וְחָיִתָה אַתָּה וּבֵיתֶךָ
  english_pob_choice: and you and your household will live
  chosen_korean: 그리고 당신과 당신의 집안이 살 것입니다
  alternatives_korean:
  - 그리고 당신과 당신의 가정이 살 것입니다
  - 그리고 당신과 당신의 집이 살 것입니다
  lexicon: HALOT
  rationale: בַּיִת는 단순 건물이 아니라 가족과 종속 인원을 포함한 집안/가정의 의미이므로 ‘집안’으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 호칭과 복합 칭호 보존
  chosen_reading: ‘만군의 하나님이신 야훼, 이스라엘의 하나님’으로 옮겨, יהוה를 야훼로 드러내고 호칭의 연쇄를 유지했습니다.
  alternative_readings:
  - ‘여호와, 만군의 하나님, 이스라엘의 하나님’
  - ‘야훼, 만군의 주, 이스라엘의 하나님’
  rationale: 원문은 하나님의 이름과 두 개의 명칭이 연쇄로 붙어 있으므로, 전통적 치환어로 평탄화하지 않고 구조를 살려 독자가 예언 선포의 권위를 직접 듣게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נֶפֶשׁ의 의미를 생명/존재 보존으로 처리
  chosen_reading: ‘당신의 생명이 보전될 것이고’로 옮겨, جسم적 생존의 맥락을 드러냈습니다.
  alternative_readings:
  - ‘당신의 영혼이 살 것이고’
  - ‘당신이 살 것이고’
  rationale: 예레미야 38:17의 조건은 성의 멸망과 개인의 생존에 관한 것이므로, נֶפֶשׁ를 후대적 이분법이 아니라 히브리어 관용적 의미인 생명으로 이해하는 것이 본문에 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it'
