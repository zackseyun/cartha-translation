base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/016.yaml
  text: Then King Zedekiah swore secretly to Jeremiah[a], saying, “As Yahweh lives, who made this life for us, I will not put you to death, nor will I give you into the hand of these men who are seeking your life.”
  footnotes:
  - marker: a
    text: Or, “who gave us this life.” The Hebrew more literally says, “who made for us this life/soul.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 시드기야 왕은 예레미야에게 몰래 맹세하며 말했습니다. “야훼께서 살아 계십니다. 우리에게 이 생명을 지으신 분이시니, 나는 당신을 죽이지도 않겠고, 당신을 이 사람들, 곧 당신의 생명을 찾는 사람들의 손에 넘기지도 않겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리에게 이 생명을 주신 분이시니.” 히브리어는 문자적으로 “우리에게 이 생명을 만드신 분”이라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하며
  alternatives_korean:
  - 맹세했습니다
  - 서약하며
  lexicon: HALOT
  rationale: 왕의 공식 발화에서 oath-taking의 행위를 자연스럽게 드러내되, 뒤의 직접 인용과 어울리도록 동사구로 옮겼습니다.
- source_word: בַּסֵּתֶר
  english_pob_choice: secretly
  chosen_korean: 몰래
  alternatives_korean:
  - 비밀리에
  - 은밀히
  lexicon: HALOT
  rationale: 행위가 공개되지 않았음을 간결하게 드러내는 현대 한국어 표현입니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계십니다
  alternatives_korean:
  - 야훼의 삶으로 맹세합니다
  - 야훼께서 사십니다
  lexicon: HALOT
  rationale: 히브리어의 표준 맹세 형식을 살리면서도 한국어에서는 서약의 힘이 분명한 종결형으로 자연스럽게 옮겼습니다.
- source_word: אֵת אֲשֶׁר עָשָׂה לָנוּ אֶת הַנֶּפֶשׁ הַזֹּאת
  english_pob_choice: who made this life for us
  chosen_korean: 우리에게 이 생명을 지으신 분이시니
  alternatives_korean:
  - 우리에게 이 생명을 주신 분이시니
  - 우리를 위해 이 생명을 만드신 분이시니
  lexicon: HALOT
  rationale: נֶפֶשׁ을 여기서는 '생명'으로 보되, POB의 생성어감('made')을 살려 '지으신'으로 옮겼습니다. '주신'은 의미는 통하지만 원문의 제작/형성 뉘앙스가 약합니다.
- source_word: מְבַקְשִׁים אֶת נַפְשֶׁךָ
  english_pob_choice: are seeking your life
  chosen_korean: 당신의 생명을 찾는 사람들
  alternatives_korean:
  - 당신의 생명을 찾고 있는 사람들
  - 당신의 목숨을 노리는 사람들
  lexicon: HALOT
  rationale: 직역상의 'seek your life'를 보존하되 한국어에서 자연스럽고 문맥상 살해 의도를 드러내는 표현으로 옮겼습니다. '목숨을 노리는'은 해설적이어서 원문 표상을 덜 살립니다.
theological_decisions:
- issue: 야훼 맹세 공식의 존칭과 직접 인용 내부 어조
  chosen_reading: 서술문은 합쇼체를 유지하고, 왕의 직접 맹세 인용은 공적 선언의 힘을 살리는 평서형으로 두었습니다.
  alternative_readings:
  - 직접 인용 전체를 더 강한 서약체로 조정
  - 서술문까지 구어체로 완화
  rationale: 원문의 왕실 맹세와 서술자의 거리감을 함께 보존하기 위한 선택입니다. 직접 인용 안에서는 맹세의 확정성과 엄숙함이 우선합니다.
  doctrine_reference: 서술체 합쇼체와 인용 내부 어조의 구분 원칙
