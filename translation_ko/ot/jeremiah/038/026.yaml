source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֲלֵי/הֶ֔ם מַפִּיל אֲנִ֥י תְחִנָּתִ֖/י לִ/פְנֵ֣י הַ/מֶּ֑לֶךְ לְ/בִלְתִּ֧י הֲשִׁיבֵ֛/נִי בֵּ֥ית יְהוֹנָתָ֖ן לָ/מ֥וּת שָֽׁם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/026.yaml
  text: Then you shall say to them[a], ‘I was presenting my plea before the king, that he should not send me back to the house of Jonathan to die there.’
  footnotes:
  - marker: a
    text: Or, more literally, 'I am laying my supplication before the king.' The Hebrew idiom is 'causing my plea to fall before' someone, meaning to make an earnest request.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 이렇게 말하십시오. ‘나는 왕께 간청을 드리고 있습니다. 나를 요나단의 집으로 돌려보내어 그곳에서 죽게 하지 말아 달라고요.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현을 더 직역하면 ‘나는 왕 앞에 나의 간청을 떨어뜨리고 있습니다’입니다. 이는 간절히 청원한다는 뜻의 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵי/הֶם
  english_pob_choice: Then you shall say to them
  chosen_korean: 그들에게 이렇게 말하십시오
  alternatives_korean:
  - 그리고 그들에게 말하십시오
  - 그들에게 말하세요
  lexicon: HALOT
  rationale: 직전 맥락에 이어지는 지시문이므로 ‘그리고’보다 순서를 드러내는 ‘이렇게’가 자연스럽고, 합쇼체 명령으로 처리했습니다.
- source_word: מַפִּיל אֲנִי תְחִנָּתִי לִפְנֵי הַ/מֶּלֶךְ
  english_pob_choice: I was presenting my plea before the king
  chosen_korean: 나는 왕 앞에 나의 간구를 드리고 있습니다
  alternatives_korean:
  - 나는 왕 앞에 나의 호소를 드리고 있습니다
  - 나는 왕 앞에 나의 청원을 올리고 있습니다
  lexicon: HALOT
  rationale: ‘causing my plea to fall before’라는 히브리어 관용구를 한국어로 풀어 ‘간구를 드리다’로 옮겨, 형식성과 긴박함을 함께 살렸습니다.
- source_word: לְ/בִלְתִּי הֲשִׁיבֵ/נִי
  english_pob_choice: that he should not send me back
  chosen_korean: 그래서 그가 나를 다시 … 돌려보내 … 하지 않도록
  alternatives_korean:
  - 그가 나를 다시 보내지 않도록
  - 나를 다시 돌려보내지 말도록
  lexicon: HALOT
  rationale: 목적/내용을 나타내는 לְבִלְתִּי를 한국어의 부정 목적절로 옮겼고, ‘send me back’는 반복적 회귀를 드러내는 ‘돌려보내다’로 처리했습니다.
- source_word: בֵּית יְהוֹנָתָן
  english_pob_choice: the house of Jonathan
  chosen_korean: 요나단의 집
  alternatives_korean:
  - 요나단의 집안
  - 요나단의 집터
  lexicon: HALOT
  rationale: 지명화된 구문이지만 한국어에서는 자연스럽게 소유격 구조로 옮기는 것이 가장 명료합니다.
theological_decisions:
- issue: 직접 인용 속의 요청 표현과 화자 태도
  chosen_reading: ‘나는 왕 앞에 나의 간구를 드리고 있습니다’로 현재진행형의 겸손한 항변을 살렸습니다.
  alternative_readings:
  - ‘나는 왕 앞에 나의 간구를 드렸습니다’
  - ‘나는 왕 앞에 나의 간구를 올립니다’
  rationale: 히브리어 분사 מַפִּיל은 행위의 진행성을 띠며, 문맥상 예레미야가 왕에게 전할 변명을 구성하므로 한국어도 진행형으로 옮겨 긴박한 상황을 유지했습니다.
  doctrine_reference: 서술 시제와 담화 맥락 보존
- issue: 죽음의 결과를 나타내는 목적절의 처리
  chosen_reading: ‘그곳에서 죽게 하지 않도록’으로 결과를 노골적으로 드러냈습니다.
  alternative_readings:
  - ‘그곳에서 죽지 않도록’
  - ‘그곳에서 죽게 될까 봐’
  rationale: 원문은 ‘거기서 죽기 위하여/죽게 되다’의 결과를 분명히 말하므로, 완곡화보다 직접적 결과 표현이 원문 긴장을 더 잘 반영합니다.
  doctrine_reference: 원문 결과절 보존
