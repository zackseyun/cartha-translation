  to: 그들에게 이렇게 말하십시오. ‘나는 왕께 간청을 드리고 있습니다. 나를 요나단의 집으로 돌려보내어 그곳에서 죽게 하지 말아 달라고요.’[a]
  rationale: 청원의 내용을 ‘…하지 말아 달라고요’로 명확히 하여 לְבִלְתִּי הֲשִׁיבֵנִי의 의미를 보존했습니다. ‘돌려보내어 그곳에서 죽게’는 원문의 장소 이동과 그에 따른 죽음의 결과를 그대로 반영합니다. 각주는 히브리어 관용구와 분사 표현의 현재적 번역을 더 분명히 설명하도록 다듬었습니다.
