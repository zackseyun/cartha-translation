    issue: The divine name is rendered ‘여호와.’
    rationale: The source contains יהוה, and the supplied POB theological decision explicitly chooses ‘Yahweh,’ not ‘Jehovah.’ In Korean this should be transliterated ‘야훼.’
  - severity: medium
    issue: The footnote anchors are structurally and semantically misplaced.
    rationale: Marker a is attached to the command to conceal nothing although its note concerns ‘house of Yahweh’; marker b is attached after the narrative sentence although its note concerns the command. Each marker must follow the expression it annotates.
