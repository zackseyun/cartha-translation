  terminology: Render יהוה as ‘야훼,’ the standard Korean transliteration corresponding to the project’s chosen ‘Yahweh.’ Render בית יהוה literally as ‘야훼의 집,’ with ‘야훼의 성전’ supplied as a contextual alternative in a footnote. ‘예언자’ and ‘출입구’ are appropriate here.
