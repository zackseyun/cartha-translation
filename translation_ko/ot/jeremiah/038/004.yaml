  text: וַ/יֹּאמְר֨וּ הַ/שָּׂרִ֜ים אֶל הַ/מֶּ֗לֶךְ י֣וּמַת נָא֮ אֶת הָ/אִ֣ישׁ הַ/זֶּה֒ כִּֽי עַל כֵּ֡ן הֽוּא מְרַפֵּ֡א אֶת יְדֵי֩ אַנְשֵׁ֨י הַ/מִּלְחָמָ֜ה הַֽ/נִּשְׁאָרִ֣ים בָּ/עִ֣יר הַ/זֹּ֗את וְ/אֵת֙ יְדֵ֣י כָל הָ/עָ֔ם לְ/דַבֵּ֣ר אֲלֵי/הֶ֔ם כַּ/דְּבָרִ֖ים הָ/אֵ֑לֶּה כִּ֣י הָ/אִ֣ישׁ הַ/זֶּ֗ה אֵינֶ֨/נּוּ דֹרֵ֧שׁ לְ/שָׁל֛וֹם לָ/עָ֥ם הַ/זֶּ֖ה כִּ֥י אִם לְ/רָעָֽה־־־־־־׀־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/004.yaml
  text: Then the officials said to the king[a], “Please let this man be put to death, for in this way he is weakening the hands of the men of war who remain in this city, and the hands of all the people, by speaking to them words like these. For this man is not seeking the welfare of this people[c][b], but their harm.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''weakening the hands of.'' This idiom means discouraging or demoralizing.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the soldiers' for 'the men of war.'
    reason: lexical_alternative
  - marker: c
    text: Or 'seeking peace' instead of 'seeking the welfare'; Hebrew shalom can include peace, well-being, and prosperity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 관리들이 왕에게 말했습니다. “부디 이 사람을 처형해 주십시오. 이 사람이 이런 말을 하여 이 성에 남아 있는 군사들과 온 백성의 사기를 꺾고 있기 때문입니다. 이 사람은 이 백성의 안녕을 구하는 것이 아니라, 그들에게 해를 끼치는 것을 구하고 있습니다.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 ‘손을 약하게 하다’라는 관용구이며, 낙담시키거나 사기를 꺾는다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘군사들’은 직역하면 ‘전쟁의 사람들’이며, ‘전사들’ 또는 ‘군인들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 샬롬은 ‘평화’뿐 아니라 ‘안녕’, ‘복리’, ‘번영’의 뜻도 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂרִים
  english_pob_choice: the officials
  chosen_korean: 관리들
  alternatives_korean:
  - 지도자들
  - 방백들
  lexicon: HALOT
  rationale: שָׂרִים는 문맥상 왕에게 말하는 궁정·행정 책임자들이므로, 현대 한국어에서 자연스럽고 과도하게 군사 계급을 특정하지 않는 ‘관리들’로 옮겼습니다.
- source_word: יּוּמַת נָא
  english_pob_choice: Please let this man be put to death
  chosen_korean: 부디 이 사람을 죽이게 하소서
  alternatives_korean:
  - 이 사람을 죽이게 해 주십시오
  - 이 사람을 처형하게 하소서
  lexicon: HALOT
  rationale: נא의 청원적 완곡함을 살려 ‘부디’로 표현했고, מות의 사법적 처분 맥락은 ‘죽이게 하소서’로 간결하게 반영했습니다.
- source_word: מְרַפֵּא אֶת יְדֵי
  english_pob_choice: he is weakening the hands of
  chosen_korean: 손을 약하게 만들고 있습니다
  alternatives_korean:
  - 기운을 꺾고 있습니다
  - 사기를 떨어뜨리고 있습니다
  lexicon: HALOT
  rationale: ‘손을 약하게 하다’는 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서 이해 가능하도록 ‘약하게 만들고 있습니다’로 옮겼습니다.
- source_word: דֹרֵשׁ לְשָׁלוֹם
  english_pob_choice: seeking the welfare
  chosen_korean: 평강을 구하는
  alternatives_korean:
  - 복지를 구하는
  - 평화를 구하는
  lexicon: HALOT
  rationale: שָׁלוֹם의 범위가 평화보다 넓어, POB의 ‘welfare’에 맞춰 ‘평강을 구하는’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 대조구의 의미
  chosen_reading: ‘해를 구하고 있습니다’로 옮겨, 평강/복리와 해악의 대조를 분명히 했습니다.
  alternative_readings:
  - ‘악을 구하고 있습니다’
  - ‘재앙을 구하고 있습니다’
  rationale: 히브리어 לְרָעָה는 단순한 도덕적 악보다 백성에게 돌아갈 해악·재앙의 방향을 가리키므로, 본문 대조를 살려 ‘해’로 정리했습니다.
  doctrine_reference: 본문의 언약적·정치적 경고 문맥
- issue: ‘평강’의 번역
  chosen_reading: ‘평강’으로 유지해 샬롬의 넓은 의미를 살렸습니다.
  alternative_readings:
  - ‘평화’
  - ‘복지’
  rationale: שָׁלוֹם은 전쟁 부재만이 아니라 공동체의 안녕과 번영까지 포함하므로, 교회적 상투어보다 원문 범위를 더 잘 드러내는 ‘평강’이 적절합니다.
  doctrine_reference: 구약 어휘의 의미 범위 보존
