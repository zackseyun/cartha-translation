source:
  edition: WLC
  text: אֲדֹנִ֣/י הַ/מֶּ֗לֶךְ הֵרֵ֜עוּ הָ/אֲנָשִׁ֤ים הָ/אֵ֨לֶּה֙ אֵ֣ת כָּל אֲשֶׁ֤ר עָשׂוּ֙ לְ/יִרְמְיָ֣הוּ הַ/נָּבִ֔יא אֵ֥ת אֲשֶׁר הִשְׁלִ֖יכוּ אֶל הַ/בּ֑וֹר וַ/יָּ֤מָת תַּחְתָּי/ו֙ מִ/פְּנֵ֣י הָֽ/רָעָ֔ב כִּ֣י אֵ֥ין הַ/לֶּ֛חֶם ע֖וֹד בָּ/עִֽיר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/038/009.yaml
  text: My lord the king[a], these men have done evil in all that they did to Jeremiah the prophet, whom they threw into the cistern, and he will die there because of the famine, for there is no bread left in the city.
  footnotes:
  - marker: a
    text: Or 'pit.' The Hebrew bor can denote a pit, dungeon, or cistern; here 'cistern' fits the immediate context best.
    reason: lexical_alternative
translation:
  language: ko
  text: “임금님, 이 사람들이 예레미야 예언자에게 저지른 모든 일은 악했습니다. 그들은 그를 저수조[a]에 던져 넣었고, 그는 기근 때문에 그 안에서 죽을 것입니다. 성 안에는 더 이상 빵이 없기 때문입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 보르(bor)는 구덩이, 감옥, 또는 물 저장용 저수조를 가리킬 수 있습니다. 이 문맥에서는 저수조가 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: My lord the king
  chosen_korean: “임금님”
  alternatives_korean:
  - “주군이시여, 임금님”
  - “주인님, 임금님”
  lexicon: HALOT
  rationale: 궁정 예의가 있는 직접 호칭이므로, 한국어에서는 호격으로 간결하게 “임금님”이 가장 자연스럽고 존칭을 유지합니다.
- source_word: הֵרֵעוּ
  english_pob_choice: have done evil
  chosen_korean: 악을 행했습니다
  alternatives_korean:
  - 악하게 행했습니다
  - 나쁘게 행했습니다
  lexicon: HALOT
  rationale: 히필 רעע의 도덕적 강도를 살려 단순한 ‘잘못’보다 ‘악’을 택했습니다.
- source_word: הַבּוֹר
  english_pob_choice: the cistern
  chosen_korean: 구덩이
  alternatives_korean:
  - 우물
  - 감옥
  lexicon: HALOT
  rationale: 이 단락에서 bor는 물 저장용 cistern의 뜻을 가질 수 있지만, 한국어 본문은 문맥상 기능보다 즉각적 장면을 드러내는 ‘구덩이’가 가장 무난합니다. 주석 없이도 본문의 비참함이 전달됩니다.
- source_word: וַיָּמָת תַּחְתָּיו מִפְּנֵי הָרָעָב
  english_pob_choice: and he will die there because of the famine
  chosen_korean: “굶주림 때문에 거기서 죽을 것입니다”
  alternatives_korean:
  - “기근 때문에 그곳에서 죽을 것입니다”
  - “거기서 굶어 죽을 것입니다”
  lexicon: HALOT
  rationale: 장차 일어날 결과를 경고하는 문맥이므로 미래형으로 옮겼고, ‘굶주림’은 기근 상황을 직접 드러내면서 한국어로 자연스럽습니다.
- source_word: כִּי אֵין הַלֶּחֶם עוֹד בָּעִיר
  english_pob_choice: for there is no bread left in the city
  chosen_korean: “성 안에는 더 이상 빵이 없기 때문입니다”
  alternatives_korean:
  - “성 안에 더는 양식이 없기 때문입니다”
  - “도성 안에는 빵이 더 남아 있지 않기 때문입니다”
  lexicon: HALOT
  rationale: leḥem의 구체적 표현을 살리기 위해 ‘빵’을 유지했고, עוֹד의 의미는 ‘더 이상’으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 예레미야의 처지가 즉각적인 사망 위험으로 제시되는 방식
  chosen_reading: “죽을 것입니다”로 미래적 경고를 살렸습니다.
  alternative_readings:
  - “죽어 가고 있습니다”
  - “죽었습니다”
  rationale: 히브리어 wayyiqtol 형태이지만, 발화 기능은 현재의 비상 상황에 대한 예측이므로 결과적 미래로 옮기는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 서사 문맥의 담화 기능 우선 원칙
