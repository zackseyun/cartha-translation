id: JER.23.10
reference: Jeremiah 23:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י מְנָֽאֲפִים֙ מָלְאָ֣ה הָ/אָ֔רֶץ כִּֽי מִ/פְּנֵ֤י אָלָה֙ אָבְלָ֣ה הָ/אָ֔רֶץ יָבְשׁ֖וּ נְא֣וֹת מִדְבָּ֑ר וַ/תְּהִ֤י מְרֽוּצָתָ/ם֙ רָעָ֔ה וּ/גְבוּרָתָ֖/ם לֹא כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/010.yaml
  text: For the land is full of adulterers[a]; because of the curse the land mourns, and the pastures of the wilderness are dried up. Their course is evil[c][b], and their might is not right.
  footnotes:
  - marker: a
    text: Or 'because of the oath'; Hebrew אָלָה can denote an oath, especially one invoking a curse.
    reason: lexical_alternative
  - marker: b
    text: Or 'their running' or 'their way'; the Hebrew term is metaphorical for the course of their conduct.
    reason: lexical_alternative
  - marker: c
    text: Or 'their might is not so'/'not upright'; the Hebrew is terse and elliptical.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 온 땅이 간음하는 자들로 가득하기 때문입니다[a]; 저주 때문에 그 땅이 애통하며, 광야의 목초지들이 마르고 있습니다. 그들의 행로는 악하며[b], 그들의 힘은 바르지 않습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘맹세 때문에’. 히브리어 אָלָה는 맹세, 특히 저주를 포함한 맹세를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 달음질’ 혹은 ‘그들의 길’. 히브리어는 비유적으로 삶의 행로를 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 힘은 그렇지 않습니다’/‘바르지 않습니다’. 히브리어는 매우 간결하게 표현됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנָאֲפִים
  english_pob_choice: adulterers
  chosen_korean: 간음하는 자들
  alternatives_korean:
  - 간음한 자들
  - 음행하는 자들
  lexicon: HALOT
  rationale: 히브리어 분사는 행위자를 직접 가리키므로 ‘간음하는 자들’이 본문 형식을 가장 잘 살리고, 예언적 정죄의 어조도 유지합니다.
- source_word: מִפְּנֵי אָלָה
  english_pob_choice: because of the curse
  chosen_korean: 저주 때문에
  alternatives_korean:
  - 맹세 때문에
  - 맹세의 저주 때문에
  lexicon: HALOT
  rationale: אָלָה는 맥락상 저주를 가리키며, 이어지는 땅의 애통과 메마름이 언약적 심판의 결과임을 보여 주므로 한국어에서는 ‘저주’가 가장 자연스럽습니다.
- source_word: מְרֻצָתָם
  english_pob_choice: their course
  chosen_korean: 그들의 행로
  alternatives_korean:
  - 그들의 달음질
  - 그들의 길
  lexicon: HALOT
  rationale: 직역하면 ‘달음질’에 가깝지만, 비유적으로 삶의 진행과 행위를 가리키므로 ‘행로’가 은유를 살리면서도 의미를 분명하게 전달합니다.
- source_word: לֹא כֵן
  english_pob_choice: is not right
  chosen_korean: 바르지 않습니다
  alternatives_korean:
  - 그렇지 않습니다
  - 옳지 않습니다
  lexicon: HALOT
  rationale: 히브리어의 간결한 부정 구문을 한국어로 너무 풀이하지 않으면서도, 도덕적·규범적 부정을 자연스럽게 드러내기 위해 ‘바르지 않습니다’를 택했습니다.
theological_decisions:
- issue: ‘간음하는 자들’을 문자적 행위로 유지할지, 언약적 불신실함으로 풀어 쓸지
  chosen_reading: 본문의 직접 의미를 살려 ‘간음하는 자들’로 두고, 예언서적 맥락이 불신실함의 함의를 드러내도록 했습니다.
  alternative_readings:
  - 불신실한 자들
  - 배반자들
  rationale: 히브리어 어휘 자체는 문자적으로 간음을 뜻하므로, 본문이 허용하는 범위 안에서 원어의 정죄 강도를 보존하는 편이 더 정확합니다.
  doctrine_reference: 원문 우선 원칙; 예언적 함의를 번역이 과잉 해석으로 대체하지 않음
- issue: ‘그들의 힘은 바르지 않습니다’의 압축된 결말 처리
  chosen_reading: ‘바르지 않습니다’로 번역해 히브리어의 생략적·단정적 표현을 살렸습니다.
  alternative_readings:
  - 옳지 않습니다
  - 그들의 능력은 그렇지 않습니다
  rationale: 원문은 매우 간결하여 무엇이 ‘그렇지 않은지’를 과도하게 보충하지 않습니다. 한국어도 판단을 유지하되 설명을 덧붙이지 않는 것이 더 충실합니다.
  doctrine_reference: 의도된 긴장 보존; 해석적 확정 최소화
