id: JER.23.14
reference: Jeremiah 23:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בִ/נְבִאֵ֨י יְרוּשָׁלִַ֜ם רָאִ֣יתִי שַׁעֲרוּרָ֗ה נָא֞וֹף וְ/הָלֹ֤ךְ בַּ/שֶּׁ֨קֶר֙ וְ/חִזְּקוּ֙ יְדֵ֣י מְרֵעִ֔ים לְ/בִ֨לְתִּי שָׁ֔בוּ אִ֖ישׁ מֵ/רָֽעָת֑/וֹ הָֽיוּ לִ֤/י כֻלָּ/ם֙ כִּ/סְדֹ֔ם וְ/יֹשְׁבֶ֖י/הָ כַּ/עֲמֹרָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/014.yaml
  text: 'And among the prophets of Jerusalem I have seen a horrible thing: committing adultery and walking in falsehood[a]; they have strengthened the hands of evildoers, so that no man turns back from his evil. All of them are to me like Sodom[b], and her inhabitants like Gomorrah.'
  footnotes:
  - marker: a
    text: Or 'no one turns back from his evil.' The Hebrew has the distributive singular 'man,' used representatively.
    reason: lexical_alternative
  - marker: b
    text: '''Turns back'' can also be rendered ''repents,'' since the Hebrew verb often carries the sense of turning from evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예루살렘의 예언자들 가운데서 내가 무서운 일을 보았습니다. 간음하고 거짓 속에서 걸으며, 악한 자들의 손을 강하게 하여 아무도 자기의 악에서 돌아서지 않게 하였습니다. 그들 모두가 내게는 소돔 같고, 그 성읍의 주민들은 고모라 같습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 분배적 단수 ‘사람’을 써서, ‘아무도’ 또는 ‘어느 누구도’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘돌아서다’는 여기서 ‘회개하다’의 뜻까지 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְבִיאֵי יְרוּשָׁלִַם
  english_pob_choice: among the prophets of Jerusalem
  chosen_korean: 예루살렘의 예언자들 가운데서
  alternatives_korean:
  - 예루살렘의 예언자들 안에서
  - 예루살렘의 예언자들 속에서
  lexicon: HALOT
  rationale: ב의 영역/범위 용법을 한국어의 ‘가운데서’로 자연스럽게 살리고, 초기 접속 waw는 단순한 서술 연결로 처리했습니다.
- source_word: שַׁעֲרוּרָה
  english_pob_choice: a horrible thing
  chosen_korean: 무서운 일
  alternatives_korean:
  - 끔찍한 일
  - 소름 끼치는 일
  lexicon: HALOT
  rationale: 이 명사는 도덕적으로 충격적이고 혐오스러운 행위를 가리키므로, 현대 한국어에서 자연스럽고 강한 비난을 담는 표현으로 옮겼습니다.
- source_word: וְהָלֹךְ בַּשֶּׁקֶר
  english_pob_choice: and walking in falsehood
  chosen_korean: 거짓 속에서 걸으며
  alternatives_korean:
  - 거짓 가운데 걸으며
  - 거짓으로 살아가며
  lexicon: HALOT
  rationale: הלך + ב의 행위·삶의 방식 비유를 보존했고, שקר의 추상성을 살려 ‘거짓 속에서’로 옮겼습니다.
- source_word: וְחִזְּקוּ יְדֵי מְרֵעִים
  english_pob_choice: they have strengthened the hands of evildoers
  chosen_korean: 악한 자들의 손을 강하게 하여
  alternatives_korean:
  - 악을 행하는 자들을 격려하여
  - 악인들을 힘나게 하여
  lexicon: HALOT
  rationale: ‘손을 강하게 하다’는 관용구를 직역에 가깝게 보존하여, 악인들을 조장·고무한 의미를 드러냈습니다.
- source_word: לְבִלְתִּי שָׁבוּ אִישׁ מֵרָעָתוֹ
  english_pob_choice: so that no man turns back from his evil
  chosen_korean: 아무도 자기의 악에서 돌아서지 않게 하였습니다
  alternatives_korean:
  - 아무도 그의 악에서 돌이키지 않게 하였습니다
  - 아무도 자기 악에서 회개하지 않게 하였습니다
  lexicon: HALOT
  rationale: לבלתי의 부정 결과를 ‘…않게 하였습니다’로 풀었고, שוב의 회개 뉘앙스는 살리되 원문보다 더 신학적으로 좁혀지지 않도록 ‘돌아서다’로 옮겼습니다.
- source_word: הָיוּ לִי כֻלָּם כִּסְדֹם
  english_pob_choice: All of them are to me like Sodom
  chosen_korean: 그들 모두가 내게는 소돔 같고
  alternatives_korean:
  - 그들 모두가 내게는 소돔과 같고
  - 그들 모두는 내게 소돔 같습니다
  lexicon: HALOT
  rationale: לִי의 평가 주체를 ‘내게는’으로 살렸고, העירונה적 단정은 간결한 비교문으로 유지했습니다.
- source_word: וְיֹשְׁבֶיהָ כַּעֲמֹרָה
  english_pob_choice: and her inhabitants like Gomorrah
  chosen_korean: 그 성읍의 주민들은 고모라 같습니다
  alternatives_korean:
  - 그의 주민들은 고모라 같습니다
  - 그 주민들은 고모라 같습니다
  lexicon: HALOT
  rationale: 예루살렘이 여성형 도시명이라는 점을 한국어에서 자연스럽게 풀어 ‘그 성읍’으로 지칭했고, 주민들의 비교를 병렬 구조로 맞췄습니다.
theological_decisions:
- issue: אִישׁ의 분배적 단수와 성중립화
  chosen_reading: 아무도 자기의 악에서 돌아서지 않게 하였습니다
  alternative_readings:
  - 아무 사람도 자기의 악에서 돌아서지 않게 하였습니다
  - 사람이 자기의 악에서 돌아서지 않게 하였습니다
  rationale: 원문의 분배적 단수 의미는 유지하되 한국어에서는 어색한 ‘한 사람’ 형식보다 자연스러운 ‘아무도’로 옮겨 대표성을 살렸습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
- issue: שׁוּב의 회개 뉘앙스
  chosen_reading: 돌아서다
  alternative_readings:
  - 돌이키다
  - 회개하다
  rationale: 이 절에서는 도덕적 전환의 뉘앙스가 있으나, 원문보다 더 직접적인 교회어인 ‘회개하다’는 피하고 동작 이미지가 살아 있는 ‘돌아서다’를 택했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 1, 3
