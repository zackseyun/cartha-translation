base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/038.yaml
  text: 'But if you say[a], ‘The burden of Yahweh,’ therefore this is what Yahweh says: Because you have said this word, ‘The burden of Yahweh,’ though I sent to you, saying, ‘You shall not say, “The burden of Yahweh,”’'
  footnotes:
  - marker: a
    text: Or 'oracle of the LORD.' Hebrew massa can denote a prophetic utterance, but 'burden' is retained here to preserve the repeated wordplay in this passage.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 너희가 말하기를 '여호와께서 말씀하신 바' 하거든, 여호와께서 이같이 말씀하시되, '너희가 이 말을 말하였으니, 곧 여호와께서 말씀하신 바라 함이로다. 내가 너희에게 보내어 말하기를, 여호와께서 말씀하신 바를 말하지 말라 하였으나'[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여호와께서 하신 말씀'. 히브리어 massa 는 예언적 선언을 나타낼 수 있으나, 이 구절의 반복되는 말장난을 보존하기 위해 '말씀하신 바'로 유지하였다.
    reason: alternative_reading
