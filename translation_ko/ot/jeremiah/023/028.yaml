id: JER.23.28
reference: Jeremiah 23:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/נָּבִ֞יא אֲשֶׁר אִתּ֤/וֹ חֲלוֹם֙ יְסַפֵּ֣ר חֲל֔וֹם וַ/אֲשֶׁ֤ר דְּבָרִ/י֙ אִתּ֔/וֹ יְדַבֵּ֥ר דְּבָרִ֖/י אֱמֶ֑ת מַה לַ/תֶּ֥בֶן אֶת הַ/בָּ֖ר נְאֻם יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/028.yaml
  text: Let the prophet who has a dream tell the dream[a], but let the one who has my word speak my word truthfully[b]. What is straw to grain? declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'speak my word in truth' or 'speak my true word.' The Hebrew may emphasize either the truthful manner of speaking or the truthfulness of the word itself.
    reason: lexical_alternative
  - marker: b
    text: Or, 'What has straw in common with grain?'
    reason: lexical_alternative
translation:
  language: ko
  text: 꿈을 꾼 예언자는 그 꿈을 말하게 하십시오. 그러나 내 말이 있는 자는 내 말을 진실하게[a] 말해야 합니다. 짚이 곡식과 무슨 상관이 있습니까?[b] 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 말을 진실한 방식으로 말하라’ 혹은 ‘내 참된 말을 말하라’. 히브리어는 말하는 방식의 진실성과 말 자체의 참됨을 둘 다 강조할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘짚과 곡식이 서로 무슨 공통점이 있습니까?’
    reason: alternative_reading
lexical_decisions:
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 그 예언자
  - 선지자
  lexicon: HALOT
  rationale: 정관사가 붙었지만 여기서는 범주 일반을 가리키므로 한국어에서는 자연스럽게 직설적 호칭인 ‘예언자’로 옮겼습니다.
- source_word: אֲשֶׁר אִתּוֹ חֲלוֹם
  english_pob_choice: who has a dream
  chosen_korean: 꿈이 있는
  alternatives_korean:
  - 꿈을 가진
  - 꿈을 받은
  lexicon: HALOT
  rationale: 직역하면 ‘그와 함께 꿈이 있는’에 가깝지만, 한국어에서는 소유·동반 의미를 살려 간결하게 ‘꿈이 있는’으로 옮기는 것이 자연합니다.
- source_word: יְדַבֵּר דְּבָרִי אֱמֶת
  english_pob_choice: speak my word faithfully
  chosen_korean: 내 말을 진실하게 말해야 합니다
  alternatives_korean:
  - 내 말을 참되게 말해야 합니다
  - 내 말을 성실하게 말해야 합니다
  lexicon: HALOT
  rationale: אֱמֶת는 단순한 ‘참/진리’뿐 아니라 말하는 방식의 진실성을 수식할 수 있으므로, 동사구 전체를 ‘진실하게 말하다’로 옮겨 어조와 의미를 함께 살렸습니다.
- source_word: מַה לַתֶּבֶן אֶת הַבָּר
  english_pob_choice: What is straw to grain?
  chosen_korean: 짚이 곡식과 무슨 상관이 있습니까?
  alternatives_korean:
  - 짚과 곡식이 무슨 상관이 있습니까?
  - 짚이 곡식과 무엇이 같습니까?
  lexicon: HALOT
  rationale: הַבָּר를 특정 곡물명으로 좁히지 않고 ‘곡식’으로 넓게 살려, 두 전혀 다른 것을 대비하는 수사적 질문을 한국어 관용으로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 하나님의 이름은 학술적 음역인 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 꿈 기반 예언과 참된 말씀의 대조
  chosen_reading: 꿈을 말하는 예언자와 야훼의 말씀을 가진 자를 강하게 대조하는 문장 구조를 그대로 살렸습니다.
  alternative_readings:
  - 두 절을 더 완곡하게 연결하는 읽기
  rationale: 본문은 거짓 꿈과 참된 계시의 대비를 날카롭게 세우므로, 그 긴장을 약화하지 않고 드러내는 것이 원문에 충실합니다.
  doctrine_reference: 번역 철학 §3 (긴장을 해소하기보다 보존)
