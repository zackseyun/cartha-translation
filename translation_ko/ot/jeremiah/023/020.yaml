revisions:
- from: 야훼의 분노는 그가 그것을 행하시고 그의 마음의 목적들을 세우실 때까지 돌아서지 않을 것입니다[a][b]. 마지막 날들에 너희는 그것을 분명히 이해하게 될 것입니다[c].
  to: 야훼의 분노는 그가 그 일을 행하시고 그의 마음에 품으신 뜻들[b]을 이루실 때까지 되돌아가지 않을 것입니다[a]. 마지막 날들에[c] 너희는 그것을 분명히 이해하게 될 것입니다.
  rationale: 문장의 의미를 바꾸지 않고, 히브리어의 ‘그가 행하고 … 마음의 뜻들을 확립할 때까지’라는 병렬 구조를 자연스러운 한국어로 다듬었습니다. ‘마음에 품으신 뜻들’은 לִבּוֹ의 관용적 의미와 מְזִמּוֹת의 복수형을 살리며, ‘이루실’은 הֵקִים의 실행·성취 문맥을 한국어답게 전달합니다. 각주 내용도 수정 본문과 표지 위치에 맞추었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:23:49Z'
