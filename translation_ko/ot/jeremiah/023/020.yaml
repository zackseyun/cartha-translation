  source_fidelity: 핵심 의미는 대체로 충실합니다. אַף를 ‘분노’로, יְהוָה를 ‘야훼’로, בְּאַחֲרִית הַיָּמִים를 ‘마지막 날들에’로 옮긴 선택은 원문과 영어 POB의 결정을 잘 반영합니다. 다만 עֲשׂוֹתוֹ와 הֲקִימוֹ가 가리키는 행위의 완결성을 더 자연스럽게 연결하고, ‘마음의 목적들을 세우다’라는 직역투를 고칠 필요가 있습니다.
  naturalness: ‘그의 마음의 목적들을 세우실’은 현대 표준 한국어에서 부자연스럽고 의미 관계도 불명확합니다. ‘그의 마음에 품으신 뜻들을 이루실’이 자연스러우며, 히브리어의 ‘마음’이 뜻과 의도의 자리라는 관용도 적절히 전달합니다. 각주 표지는 해당 어구 가까이 옮기는 편이 독자에게 명확합니다.
  terminology: ‘야훼’, ‘분노’, ‘마지막 날들’은 일관되고 적절합니다. מְזִמּוֹת는 여기서 부정적 ‘계교’보다 신적 의도·계획을 뜻하므로 ‘뜻들’이 ‘목적들’보다 자연스럽습니다. ‘마음에 품으신’은 לִבּוֹ의 관용적 의미를 풀어 주되 신학적 해석을 과도하게 추가하지 않습니다.
