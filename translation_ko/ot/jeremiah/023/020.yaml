id: JER.23.20
reference: Jeremiah 23:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
  footnotes:
  - marker: a
    text: Or 'will not return'; the Hebrew image is of the LORD's anger not turning back until his purpose is completed.
    reason: lexical_alternative
  - marker: b
    text: Or 'the plans of his heart.'
    reason: lexical_alternative
  - marker: c
    text: Or 'In days to come'; Hebrew 'In the latter days.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 분노는 그가 그것을 행하시고 그의 마음의 목적들을 세우실 때까지 돌아서지 않을 것입니다[a][b]. 마지막 날들에 너희는 그것을 분명히 이해하게 될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아가지 않을 것입니다’; 히브리어는 야훼의 분노가 목적이 이루어질 때까지 되돌아가지 않는 모습을 그립니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 마음의 계획들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다가오는 날들에’. 히브리어는 ‘마지막 날들에’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC; POB lexical default
  rationale: 고유신명에 해당하므로 본문에서는 보편적 호칭인 ‘주님’ 대신 음역형 ‘야훼’를 유지해 POB의 원칙을 따랐습니다.
- source_word: אַף
  english_pob_choice: anger
  chosen_korean: 분노
  alternatives_korean:
  - 노여움
  - 진노
  lexicon: HALOT
  rationale: 문맥상 야훼의 심판적 감정을 가리키므로 문자적 ‘코/콧구멍’이 아니라 한국어에서 자연스럽고 강한 ‘분노’로 옮겼습니다.
- source_word: לֹא יָשׁוּב
  english_pob_choice: will not turn back
  chosen_korean: 돌아서지 않을 것입니다
  alternatives_korean:
  - 돌아오지 않을 것입니다
  - 거두지 않을 것입니다
  - 물러서지 않을 것입니다
  lexicon: HALOT
  rationale: 분노가 ‘되돌아가지 않는다’는 이미지를 살리기 위해 ‘돌아서다’를 선택했고, 지나친 의역인 ‘거두다/물러서다’는 피했습니다.
- source_word: מְזִמּוֹת לִבּוֹ
  english_pob_choice: the purposes of his heart
  chosen_korean: 그의 마음의 목적들
  alternatives_korean:
  - 그의 마음의 계획들
  - 그의 마음의 의도들
  - 그의 마음의 속셈들
  lexicon: HALOT
  rationale: ‘מְזִמּוֹת’는 여기서 부정적 ‘계교’보다 신적 의도에 가까우므로 ‘목적들’로, ‘לִבּוֹ’는 히브리 관용을 살려 ‘마음’으로 옮겼습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: In the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 후일에
  - 끝날에
  - 다가오는 날들에
  lexicon: HALOT
  rationale: 예언적 종말-지평을 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘마지막 날들에’로 옮겼습니다.
- source_word: תִּתְבּוֹנְנוּ בָהּ בִּינָה
  english_pob_choice: you will understand it clearly
  chosen_korean: 그것을 분명히 이해하게 될 것입니다
  alternatives_korean:
  - 그것을 명확히 깨닫게 될 것입니다
  - 그것을 자세히 이해하게 될 것입니다
  - 그것을 분별하게 될 것입니다
  lexicon: HALOT
  rationale: 분별의 뉘앙스를 유지하되 한국어에서 중복감이 적은 ‘분명히 이해하다’로 지혜의 강조를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 예언적 시간표현 בְּאַחֲרִית הַיָּמִים의 처리
  chosen_reading: ‘마지막 날들에’로 옮겨 미래성과 종말론적 긴장을 함께 보존했습니다.
  alternative_readings:
  - ‘후일에’로 완화
  - ‘종말에’로 단정
  rationale: 본문은 단순한 ‘나중’보다 예언적·종말론적 울림을 가지므로, 그 긴장을 유지하되 교리적으로 과잉 해석하지 않는 표현을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
