source:
  edition: WLC
  text: לֹ֤א יָשׁוּב֙ אַף יְהוָ֔ה עַד עֲשֹׂת֥/וֹ וְ/עַד הֲקִימ֖/וֹ מְזִמּ֣וֹת לִבּ֑/וֹ בְּ/אַֽחֲרִית֙ הַ/יָּמִ֔ים תִּתְבּ֥וֹנְנוּ בָ֖/הּ בִּינָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/020.yaml
  text: The anger of Yahweh will not turn back until he has done it[a], and until he has established the purposes of his heart[c][b]. In the latter days you will understand it clearly.
  footnotes:
  - marker: a
    text: Or 'will not return'; the Hebrew image is of the LORD's anger not turning back until his purpose is completed.
    reason: lexical_alternative
  - marker: b
    text: Or 'the plans of his heart.'
    reason: lexical_alternative
  - marker: c
    text: Or 'In days to come'; Hebrew 'In the latter days.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼의 분노는 그가 그 일을 행하시고 그의 마음에 품으신 뜻들[b]을 이루실 때까지 되돌아가지 않을 것입니다[a]. 마지막 날들에[c] 너희는 그것을 분명히 이해하게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘돌아오지 않을 것입니다’. 히브리어는 야훼의 분노가 그 뜻이 이루어질 때까지 되돌아가지 않는 모습을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 마음에 품으신 계획들’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘다가오는 날들에’. 히브리어는 ‘마지막 날들에’입니다.
    reason: alternative_reading
