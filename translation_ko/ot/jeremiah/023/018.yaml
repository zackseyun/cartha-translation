id: JER.23.18
reference: Jeremiah 23:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י מִ֤י עָמַד֙ בְּ/ס֣וֹד יְהוָ֔ה וְ/יֵ֖רֶא וְ/יִשְׁמַ֣ע אֶת דְּבָר֑/וֹ מִֽי הִקְשִׁ֥יב דבר/י וַ/יִּשְׁמָֽע־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/018.yaml
  text: For who has stood in the council of Yahweh[a], that he should see and hear his word? Who has paid attention to my word and heard it?
  footnotes:
  - marker: a
    text: Or 'in the secret/intimate counsel of the LORD.' The Hebrew סוֹד can denote confidential counsel as well as a council or assembly.
    reason: lexical_alternative
translation:
  language: ko
  text: “누가 야훼의 회의에 서서 그분의 말씀을 보고 듣겠습니까? 누가 내 말을 귀 기울여 듣고 들었습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 비밀/친밀한 의논’으로 옮길 수 있습니다. 히브리어 סוֹד는 비밀뿐 아니라 상담, 회의, 집회도 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּסוֹד יְהוָה
  english_pob_choice: in the council of Yahweh
  chosen_korean: 야훼의 회의에
  alternatives_korean:
  - 야훼의 비밀에
  - 야훼의 은밀한 회의에
  - 야훼의 상담에
  lexicon: HALOT
  rationale: סוֹד는 단순한 ‘비밀’보다 신적 의논의 자리인 ‘회의/원로회의’에 가깝기 때문에, 예언적 문맥의 공적·법정적 이미지를 살려 ‘회의’로 옮겼습니다.
- source_word: עָמַד
  english_pob_choice: has stood
  chosen_korean: 서
  alternatives_korean:
  - 서서
  - 자리를 지켜
  - 선
  lexicon: HALOT
  rationale: 히브리어 완료형의 참여 여부를 한국어에서는 자연스럽게 현재-결과적 의미로 풀어, ‘회의에 서다’라는 참여 표현을 유지했습니다.
- source_word: דְּבָר/וֹ
  english_pob_choice: his word
  chosen_korean: 그분의 말씀
  alternatives_korean:
  - 그분의 말
  - 그의 말씀
  - 그의 말
  lexicon: HALOT
  rationale: דָּבָר는 단순한 말보다 계시적·예언적 말씀의 힘을 갖기 때문에, 한국어에서도 경외적이고 공적 뉘앙스가 살아 있는 ‘말씀’을 택했습니다.
- source_word: דְבָרִי
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 나의 말
  lexicon: HALOT
  rationale: 여기서는 화자가 직접 하는 신적 발화이지만, 한국어에서는 앞의 ‘그분의 말씀’과 구별되도록 더 직접적인 ‘내 말’이 자연스럽습니다.
theological_decisions:
- issue: 예언자적 정당성의 핵심 이미지인 ‘여호와의 비밀/회의’ 표현
  chosen_reading: 야훼의 회의
  alternative_readings:
  - 야훼의 비밀
  - 야훼의 은밀한 회의
  - 야훼의 친밀한 상담
  rationale: 이 절의 논지는 참된 예언자가 하나님의 의논 자리에 참여하여 보고 듣는다는 점이므로, 사적 은밀성보다 신적 회의의 이미지가 더 분명하게 드러나도록 했습니다.
  doctrine_reference: 예언과 계시의 진정성
