base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/008.yaml
  text: but[a], ‘As Yahweh lives[d][c][b], who brought up and who brought in the offspring of the house of Israel from the land of the north and from all the lands where I had driven them,’ and they shall dwell on their own soil.
  footnotes:
  - marker: a
    text: Or 'rather, “As the LORD lives …”' The Hebrew idiom marks a replacement of the former oath formula in the previous verse.
    reason: lexical_alternative
  - marker: b
    text: '''The LORD'' renders the divine name YHWH. Alternative: ''Yahweh.'''
    reason: alternative_reading
  - marker: c
    text: Or 'the descendants of the house of Israel.'
    reason: lexical_alternative
  - marker: d
    text: Or 'on their own land.' The Hebrew specifically uses a word meaning 'soil/ground.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 「야훼께서 살아 계십니다.」 곧 이스라엘 집의 씨를 북쪽 땅과 내가 그들을 쫓아보냈던 모든 땅에서 끌어올리시고 데려오신 분께서 말씀하십니다. 그들은 자기 땅에 살게 될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼’는 히브리어 신명기호 YHWH를 음역한 표기입니다.
    reason: alternative_reading
  - marker: b
    text: ‘이스라엘 집의 씨’는 ‘이스라엘 집의 후손’ 또는 ‘자손’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기 땅’은 히브리어의 ‘흙/토지’(אַדְמָה) 뉘앙스를 간명하게 풀어쓴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: but
  chosen_korean: 그러나
  alternatives_korean:
  - 오히려
  - 대신
  lexicon: HALOT
  rationale: 앞절의 맹세 형식을 교체하는 대조를 한국어 담화에서 가장 자연스럽게 드러내기 위해 ‘그러나’를 택했습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 「야훼께서 살아 계십니다.」
  alternatives_korean:
  - ‘야훼는 살아 계십니다.’
  - ‘살아 계신 야훼를 두고’
  lexicon: HALOT
  rationale: 히브리어의 표준 맹세 공식이라서, 직설적인 서술로 옮기되 한국어에서는 인용문 안에서 엄숙한 선언으로 처리했습니다.
- source_word: זֶרַע בֵּית יִשְׂרָאֵל
  english_pob_choice: the offspring of the house of Israel
  chosen_korean: 이스라엘 집의 씨
  alternatives_korean:
  - 이스라엘 집의 후손
  - 이스라엘 집의 자손
  lexicon: HALOT
  rationale: זֶרַע의 ‘씨/후손’ 의미를 살리면서, POB의 ‘offspring’처럼 집단적 후손을 가리키는 표현으로 간결하게 옮겼습니다.
- source_word: מֵאֶרֶץ צָפוֹנָה וּמִכֹּל הָאֲרָצוֹת
  english_pob_choice: from the land of the north and from all the lands
  chosen_korean: 북쪽 땅과 … 모든 땅에서
  alternatives_korean:
  - 북방 땅과 … 모든 나라에서
  - 북쪽 나라와 … 모든 나라에서
  lexicon: HALOT
  rationale: ‘북쪽 땅’은 예레미야의 포로·심판 방향성을 유지하고, ‘땅들’의 복수감도 ‘모든 땅’으로 반영했습니다.
- source_word: אֲשֶׁר הִדַּחְתִּים שָׁם
  english_pob_choice: where I had driven them
  chosen_korean: 내가 그들을 쫓아보냈던
  alternatives_korean:
  - 내가 그들을 몰아냈던
  - 내가 그들을 흩어보냈던
  lexicon: HALOT
  rationale: הדח의 강한 추방/몰아냄을 살리되, 한국어에서 문맥상 가장 자연스러운 동사로 ‘쫓아보내다’를 선택했습니다.
- source_word: עַל אַדְמָתָם
  english_pob_choice: on their own soil
  chosen_korean: 자기 땅에
  alternatives_korean:
  - 자기 토양에
  - 자기 소유의 땅에
  lexicon: HALOT
  rationale: אַדְמָה의 ‘흙/토지’ 뉘앙스를 반영하되 한국어에서는 의미가 분명한 ‘자기 땅’으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 신명기적 맹세 공식 안에서 여호와 이름을 직접 쓰므로, 본문에서는 전통적 대체어 대신 원칙적으로 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 맹세문과 인용문 처리
  chosen_reading: 직접 발화형으로 옮기되 맹세 공식을 인용문으로 표시
  alternative_readings:
  - 그저 진술문으로 평탄화
  - ‘야훼의 말씀’으로 풀어쓰기
  rationale: 문맥상 앞절의 잘못된 맹세를 교체하는 새 맹세 공식이므로, 선언의 긴장감과 구어적 호소력을 유지하기 위해 인용부호를 사용했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§1, 3, 5
