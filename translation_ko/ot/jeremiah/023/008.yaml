  to: 오히려 「북쪽 땅과 내가 그들을 쫓아 보낸 모든 땅에서 이스라엘 집의 자손[b]을 이끌어 올리시고 데려오신 야훼[a]께서 살아 계심을 두고 맹세합니다.」라고 할 것이며, 그들은 자기 땅[c]에서 살게 될 것입니다.
  rationale: 원문에 없는 발화 동사를 삭제하고, 앞절에서 계속되는 대체 맹세 공식의 기능을 ‘오히려 …라고 할 것이며’로 반영했습니다. ‘이끌어 올리시고’와 ‘데려오신’으로 두 히브리어 동사를 구별했으며, 현대적 자연스러움을 위해 ‘씨’를 ‘자손’으로 고쳤습니다. 각주 표지도 해당 단어에 직접 배치했습니다.
