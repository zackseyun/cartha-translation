  naturalness: ‘이스라엘 집의 씨’는 현대 표준 한국어 성경 문맥에서 부자연스럽고 오해의 소지가 있어 ‘이스라엘 집의 자손’이 자연스럽습니다. 인용문을 ‘…라고 할 것이며’로 받으면 앞절과의 문법적 연결을 자연스럽게 보완하면서도 의미를 바꾸지 않습니다.
