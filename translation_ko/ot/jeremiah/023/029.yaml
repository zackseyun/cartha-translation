reference: Jeremiah 23:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/ל֨וֹא כֹ֧ה דְבָרִ֛/י כָּ/אֵ֖שׁ נְאֻם יְהוָ֑ה וּ/כְ/פַטִּ֖ישׁ יְפֹ֥צֵֽץ סָֽלַע־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/029.yaml
  text: Is not my word like fire—oracle of Yahweh—and like a hammer that shatters rock?[a]
  footnotes:
  - marker: a
    text: Or 'declares the LORD.' The Hebrew prophetic formula is literally 'oracle of the LORD' or 'utterance of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내 말이 불이 아니냐? —야훼의 말씀이니라— 그리고 바위를 산산이 부수는 망치 같지 않으냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '야훼께서 말씀하신다'로 옮길 수 있습니다. 히브리어 예언 공식 נְאֻם יְהוָה는 문자적으로 '야훼의 신탁/말씀'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹוא
  english_pob_choice: Is not
  chosen_korean: 아니냐?
  alternatives_korean:
  - 아닙니까?
  - 그렇지 않으냐?
  lexicon: HALOT
  rationale: 예상되는 긍정 답을 끌어내는 수사 의문문이므로, 평서형보다 의문형으로 유지하고 구어체가 아니라 합쇼체의 직접성을 살린 표현을 택했습니다.
- source_word: דְבָרִי
  english_pob_choice: my word
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 말씀들
  lexicon: HALOT
  rationale: 예언자적 발화의 단일한 권위를 살리되, 한국어에서는 '말'이 불과 망치의 비유와 더 자연스럽게 결합합니다. 다만 '내 말씀'보다 직접성을 우선했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: oracle of Yahweh
  chosen_korean: —야훼의 말씀이니라—
  alternatives_korean:
  - —야훼의 신탁이니라—
  - —야훼께서 말씀하신다—
  lexicon: HALOT
  rationale: 예언 공식의 명사형 직역인 'oracle'의 의미를 살리되, 한국어에서는 '말씀이니라'가 문맥상 자연스럽고 예언적 공식성을 유지합니다. 또한 יְהוָה는 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
- source_word: וּכְפַטִּישׁ יְפֹצֵץ סָלַע
  english_pob_choice: and like a hammer that shatters rock
  chosen_korean: 그리고 바위를 산산이 부수는 망치 같지 않으냐
  alternatives_korean:
  - 그리고 바위를 부수는 망치 같지 않으냐
  - 그리고 돌을 깨뜨리는 망치 같지 않으냐
  lexicon: HALOT
  rationale: '''hammer''와 ''shatters''의 폭력적 이미지를 한국어에서 과장 없이 강하게 전달하기 위해 ''산산이 부수는''을 택했습니다. ''rock''은 이 비유에서 ''바위''가 가장 자연스럽습니다.'
theological_decisions:
- issue: יְהוָה의 번역과 예언 공식의 보존
  chosen_reading: 본문에 '야훼'를 직접 쓰고, 예언 공식은 '말씀이니라'로 옮겨 하나님의 이름과 예언적 권위를 모두 드러냈습니다.
  alternative_readings:
  - 전통적으로 '여호와'를 쓰는 방식
  - '''주님께서 말씀하신다''로 바꾸는 방식'
  rationale: 출처 본문이 신명기적 예언 공식 'oracle of Yahweh'를 사용하므로, 이름 대체보다 고유명 유지가 원문 가시성을 높입니다. 동시에 한국어 독자가 예언적 선언으로 바로 인식할 수 있게 했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
