revisions:
- from: 이것이 언제까지 선지자들의 마음에 있겠습니까? 그들은 거짓을 예언하며, 자기 마음의 속임수를 예언합니다.[a][b]
  to: 거짓을 예언하는 예언자들[b]과 자기 마음의 속임수를 예언하는 예언자들의 마음에 이런 일이 언제까지 있겠습니까?[a]
  rationale: 히브리어의 병렬 명사구 구조를 회복하고, 생략된 존재문의 의미를 한국어에서 최소한으로 명료화했습니다. 각주 표지는 해당 표현 뒤에 배치했으며, 영어 감사 기록의 생략문 및 ‘거짓 예언자들’ 대안도 의미를 바꾸지 않고 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:37Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어의 두 병렬 표현은 첫째 ‘거짓을 예언하는 자들’, 둘째 ‘자기 마음의 속임수의 예언자들’이라는 예언자 집단을 가리킵니다. 초안의 ‘그들은 … 예언합니다’는 둘째 명사구를 독립된 서술절로 재분석하여 병렬 구조와 주어의 범위를 다소 흐립니다.
  naturalness: ‘이것이 언제까지 선지자들의 마음에 있겠습니까?’도 이해되지만, ‘이것’의 지시 대상이 한국어 본문 안에서 불분명합니다. 생략된 존재문의 내용을 ‘이런 일이’로 최소한 보충하고, 수식어가 긴 병렬 명사구를 자연스럽게 정리하는 것이 좋습니다. ‘예언자’는 현대 표준어 문체에 더 적합합니다.
  terminology: נְבִיאִים은 ‘예언자’, שֶׁקֶר는 ‘거짓’, תַּרְמִת לִבָּם은 ‘자기 마음의 속임수’로 옮기는 것이 적절합니다. 둘째 표현은 ‘자기 마음의 속임수를 예언하는 예언자들’로 번역하여 מקור의 ‘속임수의 예언자들’이라는 의미와 한국어의 자연스러움을 함께 살렸습니다.
  issues:
  - severity: medium
    issue: 둘째 병렬 명사구를 서술절로 전환함
    rationale: וּנְבִיאֵי תַּרְמִת לִבָּם은 문자적으로 ‘그들의 마음의 속임수의 예언자들’이라는 명사구입니다. ‘그들은 … 예언합니다’는 뜻은 유사하지만 첫 병렬구와 함께 의문문의 ‘마음에’에 연결되는 구조를 약화합니다.
  - severity: low
    issue: ‘이것’의 지시 대상이 본문 내에서 불명확함
    rationale: 히브리어는 문맥상 보충되는 존재문이지만, 한국어에서는 ‘이런 일’을 보충하면 수사적 질문의 의미가 더 명료해집니다.
  - severity: low
    issue: ‘선지자’의 문체
    rationale: 오류는 아니지만, 요청된 현대 표준어 합쇼체에서는 ‘예언자’가 더 자연스럽고 중립적입니다.
