id: JER.23.26
reference: Jeremiah 23:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַד מָתַ֗י הֲ/יֵ֛שׁ בְּ/לֵ֥ב הַ/נְּבִאִ֖ים נִבְּאֵ֣י הַ/שָּׁ֑קֶר וּ/נְבִיאֵ֖י תַּרְמִ֥ת לִבָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/026.yaml
  text: How long will this be in the heart of the prophets who prophesy falsehood[b][a], and who prophesy the deceit of their own heart?
  footnotes:
  - marker: a
    text: Or, more literally, 'Is there in the heart of the prophets...?' The Hebrew is elliptical, and the translation makes the implied sense explicit in English.
    reason: lexical_alternative
  - marker: b
    text: '''Those who prophesy falsehood'' could be rendered more compactly as ''false prophets.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이것이 언제까지 선지자들의 마음에 있겠습니까? 그들은 거짓을 예언하며, 자기 마음의 속임수를 예언합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 생략된 존재문이어서, 직역하면 “선지자들의 마음에 있습니까?”에 가깝습니다. 본문은 그 뜻을 드러내어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: “거짓을 예언하는 자들”은 더 간결하게 “거짓 선지자들”로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  english_pob_choice: How long
  chosen_korean: 이것이 언제까지
  alternatives_korean:
  - 언제까지
  - 도대체 언제까지
  lexicon: HALOT
  rationale: 히브리어의 시간적 질문 관용구를 한국어의 자연스러운 탄식형 질문으로 옮겼습니다.
- source_word: הֲיֵשׁ בְּלֵב
  english_pob_choice: will this be in the heart
  chosen_korean: 마음에 있겠습니까
  alternatives_korean:
  - 마음속에 있습니까
  - 마음에 남아 있습니까
  lexicon: HALOT
  rationale: 엘립시스된 존재 질문을 한국어에서는 문맥상 드러나는 상태를 보충해 자연스럽게 표현했습니다.
- source_word: נִבְּאֵי הַשָּׁקֶר
  english_pob_choice: those who prophesy falsehood
  chosen_korean: 거짓을 예언하며
  alternatives_korean:
  - 거짓을 예언하는 자들
  - 거짓 예언을 하는
  lexicon: HALOT
  rationale: 명사화된 칭호보다 예언 행위의 동사적 성격을 살려, 본문의 비판이 ‘거짓 예언’ 그 자체에 있음을 드러냈습니다.
- source_word: תַּרְמִת לִבָּם
  english_pob_choice: the deceit of their own heart
  chosen_korean: 자기 마음의 속임수
  alternatives_korean:
  - 자기 마음의 기만
  - 자기 마음에서 나온 속임수
  lexicon: HALOT
  rationale: תַּרְמִת의 핵심 의미를 ‘속임수’로 압축해, 출처가 자기 내면이라는 점을 ‘자기 마음의’로 분명히 했습니다.
theological_decisions:
- issue: 수사적 질문의 강도
  chosen_reading: 이것이 언제까지 선지자들의 마음에 있겠습니까?
  alternative_readings:
  - 선지자들의 마음에 이것이 있습니까?
  - 언제까지 이것이 선지자들의 마음에 있겠습니까?
  rationale: 예언자들에 대한 야훼의 책망적 탄식이므로, 한국어에서도 단순 정보 질문이 아니라 심판 선언의 어조를 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §4
- issue: ‘마음’의 의미 범위
  chosen_reading: 마음
  alternative_readings:
  - 생각
  - 내면
  - 속사람
  rationale: 히브리어 לֵב는 생각과 의지를 포함하는 중심이므로, 현대 한국어에서도 ‘마음’을 유지해 성서적 인간 이해를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §4, §6
