revisions:
- from: 그러므로, 보십시오. 내가 너희를 반드시 들어 올려 내던지고, 너희와 너희 조상들에게 내가 준 그 성읍을 내 얼굴 앞에서 치워 버리겠습니다.[a][b]
  to: 그러므로 보십시오, 내가 너희를 반드시 들어 올려[a] 내던지고, 너희와 너희 조상에게 내가 준 그 성읍도 너희와 함께 내 앞에서 쫓아내겠습니다.[b]
  rationale: 수정문은 MT의 ‘반드시 들어 올려’라는 난해한 강조 표현과 그 대안 독법을 보존합니다. 이어지는 נטשׁ는 ‘내던지다’와 ‘내 앞에서 쫓아내다’로 심판적 제거·추방의 이미지를 자연스러운 한국어로 드러냈습니다. ‘그 성읍도 너희와 함께’라고 하여 하나님께서 백성과 성읍을 모두 자신의 앞에서 제거하신다는 원문의 병렬 목적어 구조를 명확히 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:40Z'
