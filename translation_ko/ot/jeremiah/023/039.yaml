id: JER.23.39
reference: Jeremiah 23:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֣ן הִנְ/נִ֔י וְ/נָשִׁ֥יתִי אֶתְ/כֶ֖ם נָשֹׁ֑א וְ/נָטַשְׁתִּ֣י אֶתְ/כֶ֗ם וְ/אֶת הָ/עִיר֙ אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם וְ/לַ/אֲבוֹתֵי/כֶ֖ם מֵ/עַ֥ל פָּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/039.yaml
  text: Therefore[a], behold, I will surely lift you up and cast you away, you and the city that I gave to you and to your fathers[b], from before my face.
  footnotes:
  - marker: a
    text: Or, 'I will utterly forget you'; the Hebrew here is difficult, and some understand a different verbal sense than 'lift/carry away.'
    reason: alternative_reading
  - marker: b
    text: Or, 'out of my presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 보십시오. 내가 너희를 반드시 들어 올려 내던지고, 너희와 너희 조상들에게 내가 준 그 성읍을 내 얼굴 앞에서 치워 버리겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘내가 너희를 완전히 잊어버리겠다.’ 여기서는 히브리어가 난해하며, 어떤 이들은 ‘들어 올리다/옮기다’와 다른 동사 의미로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 또는, ‘내 임재에서.’
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 책망의 결과를 잇는 인과 접속사로, 예언 문맥에 자연스러운 공손체 형식인 ‘그러므로’를 택했습니다.
- source_word: הִנְנִי
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 내가
  lexicon: HALOT
  rationale: 예언적 지시어의 긴박함과 청자 호소를 살리면서도 현대 한국어 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: וְנָשִׁיתִי אֶתְכֶם נָשֹׂא
  english_pob_choice: I will surely lift you up
  chosen_korean: 내가 너희를 반드시 들어 올려
  alternatives_korean:
  - 내가 너희를 반드시 들어 내며
  - 내가 너희를 반드시 들어올려
  lexicon: HALOT
  rationale: 히브리어의 נשׂא 중의적·강조적 용법과 POB가 보존한 ‘lift up’의 긴장을 살리되, 한국어에서는 심판적 이동/제거의 뉘앙스를 드러내도록 ‘들어 올려’로 옮겼습니다.
- source_word: וְנָטַשְׁתִּי
  english_pob_choice: and cast you away
  chosen_korean: 내던지고
  alternatives_korean:
  - 버리고
  - 내치고
  lexicon: HALOT
  rationale: נטשׁ의 버림/방치보다 여기서는 판결에 따른 추방 이미지를 살리는 ‘내던지다’가 더 직접적이어서 채택했습니다.
- source_word: מֵעַל פָּנָי
  english_pob_choice: from before my face
  chosen_korean: 내 얼굴 앞에서 치워 버리겠습니다
  alternatives_korean:
  - 내 앞에서
  - 내 임재에서
  lexicon: HALOT
  rationale: 직역의 ‘얼굴 앞에서’를 한국어로는 어색하지 않게 풀되, 하나님의 면전/임재에서 제거된다는 신체적·언약적 이미지를 유지했습니다.
theological_decisions:
- issue: וְנָשִׁיתִי ... נָשֹׂא의 난해한 의미와 대안 번역
  chosen_reading: ‘내가 너희를 반드시 들어 올려’로 옮겨, 뒤이은 ‘내던지고’와 함께 추방적 심판의 역설을 드러냅니다.
  alternative_readings:
  - ‘내가 너희를 완전히 잊어버리겠다’
  - ‘내가 너희를 반드시 끌어가겠다’
  rationale: MT의 נשׂא 반복과 POB가 보존한 단어놀이를 살리면, 단순한 망각보다 심판적 ‘들어 올림/내던짐’의 아이러니가 보존됩니다. 다만 학계의 널리 알려진 다른 이해도 있으므로 본문에 암묵적으로 흡수하지 않고 번역 선택으로만 드러냅니다.
  doctrine_reference: 번역 원칙 §3 — 실제 의미가 불확실한 경우 신학적·해석학적 긴장을 보존
