id: JER.23.25
reference: Jeremiah 23:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֵ֤ת אֲשֶׁר אָֽמְרוּ֙ הַ/נְּבִאִ֔ים הַֽ/נִּבְּאִ֥ים בִּ/שְׁמִ֛/י שֶׁ֖קֶר לֵ/אמֹ֑ר חָלַ֖מְתִּי חָלָֽמְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/025.yaml
  text: I have heard what the prophets have said[a], those who prophesy lies in my name, saying, ‘I have dreamed! I have dreamed!’
  footnotes:
  - marker: a
    text: Or, “those who prophesy falsely in my name.”
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 내 이름으로 거짓을 예언하는 그 예언자들이 말한 것을 들었습니다. 그들이 말하기를 ‘내가 꿈을 꾸었다! 내가 꿈을 꾸었다!’ 합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 이름으로 거짓되게 예언하는 자들”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  english_pob_choice: I have heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었습니다만
  - 들었습니다
  lexicon: HALOT
  rationale: 완료된 인식을 현재적 효력과 함께 전하는 문맥이므로 단순 과거보다 한국어 공손체의 자연스러운 완료형 ‘들었습니다’가 맞습니다.
- source_word: הַנְּבִאִים / הַנִּבְּאִים
  english_pob_choice: the prophets / those who prophesy
  chosen_korean: 그 예언자들 / 거짓을 예언하는
  alternatives_korean:
  - 그 선지자들
  - 거짓되게 예언하는
  lexicon: HALOT
  rationale: 예언자(נביאים)는 직역의 ‘선지자’보다 현대 한국어에서 더 투명하며, 반복되는 분사형은 POB의 취지를 따라 ‘거짓을 예언하는’으로 풀어 상술했습니다.
- source_word: שֶׁקֶר
  english_pob_choice: lies
  chosen_korean: 거짓을
  alternatives_korean:
  - 거짓말을
  - 거짓되게
  lexicon: HALOT
  rationale: שקר의 핵심은 내용 자체의 ‘거짓’이므로, 부사적으로 약화시키지 않고 목적어형 ‘거짓을’로 옮겨 예언 내용의 허위를 드러냈습니다.
- source_word: חָלַמְתִּי חָלָמְתִּי
  english_pob_choice: I have dreamed! I have dreamed!
  chosen_korean: 내가 꿈을 꾸었다! 내가 꿈을 꾸었다!
  alternatives_korean:
  - 꿈을 꾸었습니다! 꿈을 꾸었습니다!
  - 내가 꿈을 꾸었노라! 내가 꿈을 꾸었노라!
  lexicon: HALOT
  rationale: 반복과 강조를 보존해야 하므로 같은 말을 두 번 반복했고, 히브리어 완결형의 강한 진술성을 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름 표현
  chosen_reading: 내 이름으로
  alternative_readings:
  - 야훼의 이름으로
  - 주님의 이름으로
  rationale: 본문은 1인칭 신적 발화로, 본문 내부에서는 직접적인 1인칭 ‘내 이름’이 원문의 효과를 가장 정확히 전달합니다. NT의 야훼 인용 문제가 아니므로 본문에 ‘야훼’를 삽입하지 않았습니다.
  doctrine_reference: 본문 직접화법과 신명기적 예언 비판의 문맥
