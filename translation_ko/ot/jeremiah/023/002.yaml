id: JER.23.2
reference: Jeremiah 23:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ֠/כֵן כֹּֽה אָמַ֨ר יְהוָ֜ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל עַֽל הָ/רֹעִים֮ הָ/רֹעִ֣ים אֶת עַמִּ/י֒ אַתֶּ֞ם הֲפִצֹתֶ֤ם אֶת צֹאנִ/י֙ וַ/תַּדִּח֔וּ/ם וְ/לֹ֥א פְקַדְתֶּ֖ם אֹתָ֑/ם הִנְ/נִ֨י פֹקֵ֧ד עֲלֵי/כֶ֛ם אֶת רֹ֥עַ מַעַלְלֵי/כֶ֖ם נְאֻם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/002.yaml
  text: 'Therefore this is what Yahweh[a], the God of Israel, says concerning the shepherds who shepherd my people: You have scattered my flock and driven them away, and you have not attended to them. Behold, I am about to attend to you for the evil of your deeds[b], declares Yahweh.'
  footnotes:
  - marker: a
    text: Or 'against the shepherds'; the preposition can introduce an oracle directed hostilely toward them.
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew repeats the verb ''attend to/visit'' in both clauses: ''you have not attended to them ... I am attending to you,'' creating a deliberate reversal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼, 곧 이스라엘의 하나님께서 말씀하십니다. “내 백성을 치는 목자들아, 너희가 내 양 떼를 흩어 놓고 쫓아내었으며 그들을 돌보지 않았습니다. 보십시오, 나는 이제 너희의 악한 행위 때문에 너희를 돌보려고 합니다. 야훼의 말씀이니라.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘목자들을 향하여’. 전치사 עַל은 이곳에서 그들을 향한 적대적 신탁 서두로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘돌보다/방문하다’(פקד)를 두 절에서 반복해, ‘너희가 그들을 돌보지 않았다 … 내가 너희를 돌보려 한다’는 의도적 역전을 이룹니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: '원문 고유명사를 보존하기 위해 영어 POB의 Yahweh에 맞춰 야훼로 옮겼습니다. '
- source_word: עַל
  english_pob_choice: concerning
  chosen_korean: ~에 관하여
  alternatives_korean:
  - ~을/를 대하여
  - ~을/를 향하여
  lexicon: HALOT
  rationale: 예언 서두의 전치사는 여기서 심판 발언의 대상 소개로 기능하므로, 직접적인 ‘against’보다 자연스러운 ‘~에 관하여/대하여’ 계열을 택했습니다.
- source_word: הָרֹעִים הָרֹעִים אֶת עַמִּי
  english_pob_choice: the shepherds who shepherd my people
  chosen_korean: 내 백성을 치는 목자들
  alternatives_korean:
  - 내 백성을 돌보는 목자들
  - 내 백성의 목자들
  lexicon: HALOT
  rationale: ‘목자’ 비유를 유지하면서 반복 어형의 강조를 한국어에서는 동사 ‘치다’로 살려, 목자 직무의 실제 실패를 드러냈습니다.
- source_word: וְלֹא פְקַדְתֶּם אֹתָם / פֹקֵד עֲלֵיכֶם
  english_pob_choice: you have not attended to them / I am about to attend to you
  chosen_korean: 그들을 돌보지 않았습니다 / 너희를 돌보려고 합니다
  alternatives_korean:
  - 그들에게 주의를 기울이지 않았습니다 / 너희를 주목하려 합니다
  - 그들을 방문하지 않았습니다 / 너희를 방문하려 합니다
  lexicon: HALOT
  rationale: פקד의 반복되는 말장난을 한국어에서 가장 자연스럽게 살리기 위해 ‘돌보다’를 양쪽 절에 공유했습니다. 첫 절은 방치, 둘째 절은 심판을 포함한 책임 추궁이라는 역전이 문맥상 분명합니다.
- source_word: אֶת רֹעַ מַעַלְלֵיכֶם
  english_pob_choice: for the evil of your deeds
  chosen_korean: 너희의 악한 행위 때문에
  alternatives_korean:
  - 너희의 행위의 악함 때문에
  - 너희 악행 때문에
  lexicon: HALOT
  rationale: ‘악한 행위’로 옮겨 רֹעַ와 מַעַלְלִים의 결합을 한국어에서 분명하게 하면서도, 판단 근거를 나타내는 ‘때문에’로 משפט의 형식을 자연스럽게 했습니다.
theological_decisions:
- issue: פקד의 반복을 통한 경고-심판의 역전
  chosen_reading: 첫 절은 ‘돌보다’의 부재로, 둘째 절은 하나님이 그들에게 ‘돌보려 합니다’라는 심판적 응답으로 번역했습니다.
  alternative_readings:
  - 첫 절 ‘방문하지 않았습니다’ / 둘째 절 ‘방문하겠습니다’
  - 첫 절 ‘주의를 기울이지 않았습니다’ / 둘째 절 ‘주의를 기울이겠습니다’
  rationale: 원문은 같은 동사를 반복해 책임 방기와 징벌적 응답을 연결합니다. 한국어에서도 같은 동사를 반복해 이 신학적 반전을 보존하는 것이 중요합니다.
  doctrine_reference: 예언서의 언어유희와 책임 추궁의 심판 신학
- issue: 목자 은유의 보존
  chosen_reading: ‘목자들’과 ‘양 떼’를 그대로 유지했습니다.
  alternative_readings:
  - 지도자들 / 백성
  - 통치자들 / 백성
  rationale: 문맥상 인간 지도자를 가리키지만, 성경의 목자-양 은유가 핵심이므로 해석어로 대체하지 않고 원비유를 보존했습니다.
  doctrine_reference: 예레미야 23장의 목자 비유
