revisions:
- from: 그러므로 야훼, 곧 이스라엘의 하나님께서 말씀하십니다. “내 백성을 치는 목자들아, 너희가 내 양 떼를 흩어 놓고 쫓아내었으며 그들을 돌보지 않았습니다. 보십시오, 나는 이제 너희의 악한 행위 때문에 너희를 돌보려고 합니다. 야훼의 말씀이니라.”[a][b]
  to: 그러므로 야훼, 이스라엘의 하나님께서 내 백성을 돌보는 목자들에 대하여[a] 이렇게 말씀하십니다. “너희가 내 양 떼를 흩어 버리고 쫓아냈으며, 그들을 살피지 않았습니다. 보십시오, 이제 내가 너희의 악한 행위에 대하여 너희를 살피겠습니다.[b] 야훼의 말씀입니다.”
  rationale: 원문 구문에 따라 목자들을 호격으로 부르지 않고 신탁의 대상으로 제시했습니다. ‘돌보는 목자들’로 목자 은유와 참여형의 기능을 보존했으며, פקד의 반복은 ‘살피다’로 일관되게 옮겼습니다. 둘째 절의 문맥상 심판 의미는 ‘악한 행위에 대하여’와 각주로 드러내어, 반복을 삭제하거나 교리적으로 특정하지 않았습니다. 각주 앵커도 해당 표현 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:22:42Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 예언 신탁 서두(‘…목자들에 대하여’)는 호격이 아니라 발언의 대상 소개입니다. 또한 רֹעִים의 반복과 פקד의 의도적인 반복·역전을 한국어에서도 보존하는 것이 필요합니다.
  naturalness: 초안의 ‘내 백성을 치는 목자들아’는 현대 한국어에서 ‘백성을 때리는 목자들아’로 쉽게 이해되어 목양 동사의 뜻과 문장 구조를 모두 훼손합니다. ‘목자들에 대하여 이렇게 말씀하십니다’가 자연스럽고 원문에도 충실합니다. ‘야훼의 말씀입니다’는 현대 합쇼체에 맞습니다.
  terminology: ‘야훼’, ‘이스라엘의 하나님’, ‘목자’, ‘양 떼’는 적절합니다. פקד는 양 절에서 ‘살피다’로 반복하여 보존하되, 둘째 용례의 심판적 의미는 각주로 밝혀야 합니다.
  issues:
  - severity: high
    issue: ‘내 백성을 치는 목자들아’
    rationale: הָרֹעִים אֶת־עַמִּי는 ‘내 백성을 목양하는/돌보는 목자들’이며, עַל הָרֹעִים은 이들을 향한 신탁의 대상 소개이지 호격이 아닙니다. ‘치다’는 현대어에서 폭행의 뜻으로 우선 이해됩니다.
  - severity: medium
    issue: 전치사 עַל에 관한 각주 앵커와 본문의 불일치
    rationale: 본문에는 ‘~에 관하여/대하여’에 해당하는 표현이 없는데 각주 a는 그 표현의 대안을 설명합니다. 해당 표현 바로 뒤에 각주를 배치해야 합니다.
