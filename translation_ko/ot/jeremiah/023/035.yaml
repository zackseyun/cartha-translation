id: JER.23.35
reference: Jeremiah 23:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֥ה תֹאמְר֛וּ אִ֥ישׁ עַל רֵעֵ֖/הוּ וְ/אִ֣ישׁ אֶל אָחִ֑י/ו מֶה עָנָ֣ה יְהוָ֔ה וּ/מַה דִּבֶּ֖ר יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/035.yaml
  text: Thus each man shall say to his neighbor[a], and each man to his brother, ‘What has Yahweh answered?’ and[b], ‘What has Yahweh spoken?’
  footnotes:
  - marker: a
    text: 'Hebrew: ''What has Yahweh answered?'' The divine name is rendered ''the LORD'' in the main text per project style.'
    reason: alternative_reading
  - marker: b
    text: Or 'What has the LORD said?'
    reason: lexical_alternative
translation:
  language: ko
  text: 「이같이 너희는 각 사람이 자기 이웃과 각 사람이 자기 형제에게 말하여야 합니다. ‘야훼께서 무엇이라고 대답하셨습니까?’ 하고, ‘야훼께서 무엇이라고 말씀하셨습니까?’ 하십시오。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘여호와께서 무엇이라고 대답하셨습니까?’의 형태입니다. 본문에서는 프로젝트 스타일에 따라 하나님의 이름을 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘야훼께서 무엇이라고 말씀하셨습니까?’
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּ
  english_pob_choice: Thus each man shall say
  chosen_korean: 「이같이 너희는 ... 말하여야 합니다」
  alternatives_korean:
  - 이렇게 너희는 ... 말해야 합니다
  - 그리하여 너희는 ... 말하여야 합니다
  lexicon: HALOT
  rationale: 예언적 지시문을 자연스러운 현대 한국어 명령/지시문으로 옮기되, 단순 서술보다 규범적 뉘앙스가 드러나도록 했습니다.
- source_word: אִישׁ עַל רֵעֵהוּ / וְאִישׁ אֶל אָחִיו
  english_pob_choice: each man to his neighbor / and each man to his brother
  chosen_korean: 각 사람이 자기 이웃과 각 사람이 자기 형제에게
  alternatives_korean:
  - 각 사람이 자기 이웃에게와 자기 형제에게
  - 각 사람은 자기 이웃과 자기 형제에게
  lexicon: HALOT
  rationale: 반복되는 אִישׁ의 분배적 힘을 살리면서, עַל/אֶל의 말하기 맥락을 한국어에서 자연스럽게 재구성했습니다. אָח를 ‘형제’로 유지해 평행 구조를 보존했습니다.
- source_word: מֶה עָנָה יְהוָה
  english_pob_choice: What has Yahweh answered?
  chosen_korean: ‘야훼께서 무엇이라고 대답하셨습니까?’
  alternatives_korean:
  - ‘야훼께서 무엇이라 응답하셨습니까?’
  - ‘야훼께서 무엇이라고 답하셨습니까?’
  lexicon: HALOT
  rationale: עָנָה는 ‘대답하다/응답하다’의 의미이므로 ‘대답하셨습니까’로 옮겼습니다. 질문형 어조를 살려 예언적 응답을 묻는 표현으로 유지했습니다.
- source_word: וּמַה דִּבֶּר יְהוָה
  english_pob_choice: and, ‘What has Yahweh spoken?’
  chosen_korean: ‘야훼께서 무엇이라고 말씀하셨습니까?’
  alternatives_korean:
  - ‘야훼께서 무엇이라 말씀하셨습니까?’
  - ‘야훼께서 무엇이라고 선포하셨습니까?’
  lexicon: HALOT
  rationale: דִּבֶּר는 일반적으로 ‘말하다/말씀하다’의 뜻이므로 과도하게 격상된 ‘선포하다’보다 직접적인 ‘말씀하셨습니까’를 택했습니다. 앞 질문과 평행을 이루도록 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 프로젝트 기본값에 따라 신적 고유명사 יְהוָה는 ‘야훼’로 옮겨, 호칭이 아니라 고유한 언약 이름임을 드러냈습니다.
theological_decisions:
- issue: 예언적 대화문의 한국어 높임과 인용부 처리
  chosen_reading: 본문 서술은 합쇼체로 유지하고, 인용문 안에서는 하나님을 향한 질문이므로 ‘-십니까’ 높임을 사용했습니다.
  alternative_readings:
  - 인용문까지 평서형으로 처리
  - 더 전통적인 종결 어미(-옵니까)를 사용
  rationale: 청자에게 전달되는 예언적 지시와, 야훼를 직접 가리키는 질문의 공손성을 함께 보존하기 위한 선택입니다.
  doctrine_reference: Korean style and register policy for direct address to God
