- from: 「이같이 너희는 각 사람이 자기 이웃과 각 사람이 자기 형제에게 말하여야 합니다. ‘야훼께서 무엇이라고 대답하셨습니까?’ 하고, ‘야훼께서 무엇이라고 말씀하셨습니까?’ 하십시오。」[a][b]
  to: 너희는 각자 자기 이웃과 자기 형제에게 이렇게 말하십시오. ‘야훼[a]께서 무엇이라고 대답하셨습니까?’ 그리고 ‘야훼께서 무엇이라고 말씀하셨습니까?’[b]
  rationale: 수신자 복수 명령과 אִישׁ의 분배적 의미를 ‘너희는 각자’로 자연스럽게 옮기고, 두 대화 상대는 ‘자기 이웃과 자기 형제에게’로 보존했습니다. 두 질문의 병행 구조와 עָנָה/דִּבֶּר의 ‘대답하다/말씀하다’ 구별을 유지했습니다. 각주 표지는 각각 신명과 두 번째 질문에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
