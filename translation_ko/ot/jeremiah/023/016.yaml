  text: 만군의 여호와께서 이렇게 말씀하십니다. “너희에게 예언하는 예언자들의 말을 듣지 마십시오. 그들은 너희를 헛되게 합니다.[a] 그들은 자기 마음의 환상을 말하며, 여호와의 입에서 나온 것은 말하지 않습니다.”
  philosophy: optimal-equivalence
  footnotes:
