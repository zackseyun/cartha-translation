reference: Jeremiah 23:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֞ן כֹּֽה אָמַ֨ר יְהוָ֤ה צְבָאוֹת֙ עַל הַ/נְּבִאִ֔ים הִנְ/נִ֨י מַאֲכִ֤יל אוֹתָ/ם֙ לַֽעֲנָ֔ה וְ/הִשְׁקִתִ֖י/ם מֵי רֹ֑אשׁ כִּ֗י מֵ/אֵת֙ נְבִיאֵ֣י יְרוּשָׁלִַ֔ם יָצְאָ֥ה חֲנֻפָּ֖ה לְ/כָל הָ/אָֽרֶץ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/015.yaml
  text: 'Therefore this is what Yahweh of Armies says concerning the prophets: ‘Look[a], I am feeding them wormwood and making them drink poisoned water, because from the prophets of Jerusalem ungodliness has gone out into all the land.’'
  footnotes:
  - marker: a
    text: Or 'water of gall.' The Hebrew expression is literally 'waters of rosh,' referring to a bitter or poisonous substance.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 만군의 야훼께서 예언자들에 대하여 이렇게 말씀하십니다. 「보십시오, 나는 그들에게 쑥을 먹이고 독이 든 물을 마시게 하겠습니다. 이는 예루살렘의 예언자들로부터 불경건이 온 땅으로 퍼져 나갔기 때문입니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 야훼 만군의 하나님
  lexicon: HALOT
  rationale: יהוה는 본명인 야훼로 옮기고, צבאות는 군사적 뉘앙스를 살려 만군으로 옮겼습니다.
- source_word: עַל הַנְּבִיאִים
  english_pob_choice: concerning the prophets
  chosen_korean: 예언자들에 대하여
  alternatives_korean:
  - 예언자들을 향하여
  - 예언자들에 관하여
  lexicon: HALOT
  rationale: עַל은 여기서 심판 발화의 대상에 대한 언급으로 쓰였으므로, 공격적 뉘앙스를 과도하게 좁히지 않으면서도 문맥상 대상을 분명히 하는 표현을 택했습니다.
- source_word: לַעֲנָה
  english_pob_choice: wormwood
  chosen_korean: 쑥
  alternatives_korean:
  - 쓸개풀
  - 쓴쑥
  lexicon: HALOT
  rationale: ישראל의 예언문맥에서 לענה는 쓴 식물을 가리키는 관용적 심판 이미지이므로, 한국어에서 같은 상징성을 갖는 쑥으로 옮겼습니다.
- source_word: מֵי רֹאשׁ
  english_pob_choice: poisoned water
  chosen_korean: 독이 든 물
  alternatives_korean:
  - 쓸개물
  - 중독된 물
  lexicon: HALOT
  rationale: רֹאשׁ은 여기서 문자적 '머리'가 아니라 쓴/유독한 물질을 가리키므로, 현대 한국어에서 즉시 이해되는 독이 든 물로 옮기되 원문 이미지를 유지했습니다.
- source_word: חֲנֻפָּה
  english_pob_choice: ungodliness
  chosen_korean: 불경건
  alternatives_korean:
  - 불의
  - 경건 없음
  - 타락
  lexicon: HALOT
  rationale: חנופה는 단순 도덕 결함보다 하나님을 향한 불경건과 신앙적 부패를 포함하므로, 불경건이 가장 근접합니다.
- source_word: יָצְאָה ... לְכָל הָאָרֶץ
  english_pob_choice: has gone out ... into all the land
  chosen_korean: 퍼져 나갔기 때문입니다
  alternatives_korean:
  - 나가서 온 땅에 이르렀기 때문입니다
  - 전역으로 퍼졌기 때문입니다
  lexicon: HALOT
  rationale: '''나갔다''의 직역을 살리되 한국어에서 자연스러운 확산 동사를 사용해, 예루살렘의 예언자들로부터 온 땅으로 번진 이미지를 전달했습니다.'
theological_decisions:
- issue: 여호와 이름의 한국어 처리
  chosen_reading: 본문에는 전통적 대치어 '주님'이 아니라 고유명사 '야훼'를 사용했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 원어의 신명기적 고유성을 보존해, המקרא의 신적 자기계시와 심판 발화의 직접성을 드러내기 위한 선택입니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; divine name transparency'
