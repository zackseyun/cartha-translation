revisions:
- from: 그러므로, 보십시오. 내가 예언자들에 대하여 있나니 — 여호와의 말씀입니다 — 그들은 내 말을 훔쳐 서로에게서 빼앗습니다.[a]
  to: 그러므로 보십시오, 내가 예언자들을 대적합니다. 야훼의 말씀입니다. 그들은 저마다 자기 이웃에게서 내 말을 훔칩니다.[a]
  rationale: 심판을 위한 적대 관계를 ‘대적합니다’로 명확히 하고, 분배 표현을 ‘저마다 자기 이웃에게서’로 옮겨 상호성을 덧붙이지 않았습니다. 히브리어 분사의 지속적·특징적 성격은 ‘훔칩니다’로 자연스럽게 유지했습니다. 신명은 영어 POB의 음역 방침에 맞추어 ‘야훼’로 통일했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:21:37Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 심판 선언 ‘내가 예언자들을 대적한다’(הִנְנִי עַל־הַנְּבִאִים)를 ‘예언자들에 대하여 있나니’로 옮긴 것은 한국어로 의미가 불명확합니다. 또한 אִישׁ מֵאֵת רֵעֵהוּ는 상호성을 뜻하는 ‘서로에게서’가 아니라 각 예언자가 자기 이웃에게서 훔친다는 분배 표현입니다.
  naturalness: ‘그러므로, 보십시오. 내가 … 있나니’는 현대 표준 한국어 합쇼체에서 부자연스럽습니다. ‘그러므로 보십시오, 내가 예언자들을 대적합니다’가 예언적 엄중함과 현대적 명료성을 함께 유지합니다.
  terminology: 영어 POB의 יְהוָה 방침인 ‘Yahweh’를 한국어 음역 ‘야훼’로 반영했습니다. ‘내 말’은 복수형 דְבָרַי를 한국어에서 자연스럽게 집합적으로 표현하며, 문맥상 충분히 충실합니다.
  issues:
