id: JER.23.30
reference: Jeremiah 23:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנְ/נִ֥י עַל הַ/נְּבִאִ֖ים נְאֻם יְהוָ֑ה מְגַנְּבֵ֣י דְבָרַ֔/י אִ֖ישׁ מֵ/אֵ֥ת רֵעֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/030.yaml
  text: Therefore[a], behold, I am against the prophets, declares Yahweh, who steal my words, each from his neighbor.
  footnotes:
  - marker: a
    text: Or, more formally, 'stealing my words, each man from his neighbor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로, 보십시오. 내가 예언자들에 대하여 있나니 — 여호와의 말씀입니다 — 그들은 내 말을 훔쳐 서로에게서 빼앗습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 말을 훔치며, 각 사람이 그의 이웃에게서(훔친다)”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니까
  lexicon: HALOT
  rationale: 이전 문맥의 심판 선언을 잇는 결론 표지이므로, 한국어에서는 ‘그러므로’가 가장 자연스럽게 인과적 전환을 살립니다.
- source_word: הִנְנִי
  english_pob_choice: behold, I am
  chosen_korean: 보십시오. 내가 있나니
  alternatives_korean:
  - 보라, 내가 있습니다
  - 여기 내가 있습니다
  lexicon: HALOT
  rationale: 예언적 선언의 주의를 끄는 감탄과 자기-현현의 강조를 함께 살리기 위해 ‘보십시오’와 ‘내가 있나니’를 결합했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 여호와께서 선언하십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어 성경에서 익숙한 형식으로 옮기되, 원문의 발화 표지를 명확히 하기 위해 종결형으로 처리했습니다.
- source_word: מְגַנְּבֵי דְבָרַי
  english_pob_choice: who steal my words
  chosen_korean: 그들은 내 말을 훔쳐
  alternatives_korean:
  - 내 말을 훔치는 자들
  - 내 말을 도둑질하는 자들
  lexicon: HALOT
  rationale: 분사구는 지속적·특징적 행위를 나타내므로 ‘그들은…훔쳐’로 옮겨, 예언자들의 상습적 행위를 직접적으로 드러냈습니다.
- source_word: אִישׁ מֵאֵת רֵעֵהוּ
  english_pob_choice: each from his neighbor
  chosen_korean: 서로에게서 빼앗습니다
  alternatives_korean:
  - 각자 자기 이웃에게서 빼앗습니다
  - 각 사람이 이웃에게서 빼앗습니다
  lexicon: HALOT
  rationale: 히브리어의 분배적 표현은 한국어에서 ‘서로에게서’가 가장 자연스럽고, 반복적 상호 표절의 뉘앙스를 살리기에 적절합니다.
theological_decisions:
- issue: YHWH(יְהוָה) 인명 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 제공된 영어 본문이 'Yahweh'를 택했지만, 한국어 본문은 프로젝트의 기존 정렬과 가독성을 고려해 전통적 독자 친화 표기를 유지했습니다. 본문 발화 표지는 ‘여호와의 말씀입니다’로 처리했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH'
- issue: 예언적 심판 선언의 문체
  chosen_reading: 직설적 선언문체와 주의 환기 표현을 유지함
  alternative_readings:
  - 완곡한 경고문체
  - 단순 서술문체
  rationale: 본문은 단순 정보 전달이 아니라 심판을 선포하는 신탁이므로, ‘보십시오’와 ‘말씀입니다’로 예언적 긴장을 유지했습니다.
  doctrine_reference: Prophetic discourse register
