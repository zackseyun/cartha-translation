  - severity: medium
    issue: ‘서로에게서 빼앗습니다’
    rationale: אִישׁ ... רֵעֵהוּ는 ‘각 사람이 자기 이웃에게서’라는 분배적 표현입니다. ‘서로’는 상호 행위를 암시하여 원문보다 관계를 강하게 규정합니다.
  - severity: low
    issue: 여호와 표기
    rationale: 한국어 성경의 관습적 표기이기는 하나, 제공된 POB 감사 기록은 신명을 Yahweh로 음역하는 결정을 명시합니다. 한국어에서도 ‘야훼’가 그 결정을 더 직접적으로 반영합니다.
  revised_text: 그러므로 보십시오, 내가 예언자들을 대적합니다. 야훼의 말씀입니다. 그들은 저마다 자기 이웃에게서 내 말을 훔칩니다.[a]
