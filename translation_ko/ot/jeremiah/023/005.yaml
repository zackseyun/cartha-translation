id: JER.23.5
reference: Jeremiah 23:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּ֨ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וַ/הֲקִמֹתִ֥י לְ/דָוִ֖ד צֶ֣מַח צַדִּ֑יק וּ/מָ֤לַךְ מֶ֨לֶךְ֙ וְ/הִשְׂכִּ֔יל וְ/עָשָׂ֛ה מִשְׁפָּ֥ט וּ/צְדָקָ֖ה בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/005.yaml
  text: Behold[a], days are coming, declares Yahweh, when I will raise up for David a righteous Branch, and he will reign as king and act wisely[b], and he will do justice and righteousness in the land.
  footnotes:
  - marker: a
    text: Or 'a righteous shoot' or 'a righteous sprout.' The Hebrew metaphor denotes a Davidic offshoot arising from David's line.
    reason: lexical_alternative
  - marker: b
    text: Or 'deal wisely' or 'prosper.' The Hebrew verb can include both wise action and resulting success.
    reason: lexical_alternative
translation:
  language: ko
  text: '보십시오, 날들이 오고 있습니다. 야훼의 말씀입니다: 내가 다윗을 위하여 의로운 가지를 일으키겠습니다. 그가 왕으로 다스리며 지혜롭게 행하고[a], 그 땅에서 정의와 의를 행할 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지혜롭게 다스리고’, ‘형통할 것이다’로도 옮길 수 있습니다. 히브리어 동사는 지혜로운 행위와 그에 따른 성공을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 예언적 선포의 주의를 끄는 감탄사를 현대 합쇼체로 옮기되, 너무 구어적인 표현은 피했습니다.
- source_word: צֶמַח
  english_pob_choice: Branch
  chosen_korean: 가지
  alternatives_korean:
  - 싹
  - 순
  - 새순
  lexicon: HALOT
  rationale: 메시아적 왕조 가지를 자연스럽게 드러내는 기본어로 ‘가지’를 택해, 상징성과 가시성을 함께 살렸습니다.
- source_word: וְהִשְׂכִּיל
  english_pob_choice: act wisely
  chosen_korean: 지혜롭게 행하고
  alternatives_korean:
  - 지혜롭게 행동하고
  - 지혜롭게 되고
  - 형통하고
  lexicon: HALOT
  rationale: 본문의 동사가 지혜로운 처신과 그에 따른 성공 가능성을 함께 담지만, 여기서는 왕의 통치 방식에 초점을 둔 ‘지혜롭게 행하다’가 가장 자연스럽습니다.
- source_word: מִשְׁפָּט וּצְדָקָה
  english_pob_choice: justice and righteousness
  chosen_korean: 정의와 의
  alternatives_korean:
  - 공의와 의
  - 재판과 의
  - 정의와 공의
  lexicon: HALOT
  rationale: 왕의 통치 문맥에서 מִשְׁפָּט은 사회적·통치적 ‘정의’, צְדָקָה는 언약적·도덕적 ‘의’를 드러내므로 둘을 구분해 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름과 예언 공식
  chosen_reading: יהוה를 본문에서 ‘야훼’로 유지하고, 예언 공식은 ‘야훼께서 말씀하십니다’로 옮겼습니다.
  alternative_readings:
  - 주께서 말씀하십니다
  - 여호와께서 말씀하십니다
  rationale: 이 항목의 출처는 WLC의 직접적인 신명 사용이며, 프로젝트 기본값에 따라 고유한 언약명을 가리는 관용적 번역보다 ‘야훼’를 유지했습니다.
  doctrine_reference: 'Contested terms table: יְהוָה YHWH'
- issue: 다윗적 ‘가지’의 메시아적 함의
  chosen_reading: 본문에 ‘메시아’라는 해설어를 덧붙이지 않고, 왕조적-예언적 이미지인 ‘의로운 가지’를 그대로 살렸습니다.
  alternative_readings:
  - 메시아적 가지
  - 의로운 메시아
  rationale: 원문은 다윗 계보의 왕적 후손을 예언적으로 묘사하지만, 여기서는 명시적 칭호를 추가하지 않고 본문의 상징을 보존하는 것이 더 엄밀합니다.
  doctrine_reference: Affirmations; Translation philosophy §§1, 3
