id: JER.23.3
reference: Jeremiah 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲנִ֗י אֲקַבֵּץ֙ אֶת שְׁאֵרִ֣ית צֹאנִ֔/י מִ/כֹּל֙ הָ/אֲרָצ֔וֹת אֲשֶׁר הִדַּ֥חְתִּי אֹתָ֖/ם שָׁ֑ם וַ/הֲשִׁבֹתִ֥י אֶתְ/הֶ֛ן עַל נְוֵ/הֶ֖ן וּ/פָר֥וּ וְ/רָבֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/003.yaml
  text: And I myself will gather the remnant of my flock out of all the lands where I have driven them[a], and I will bring them back to their pasture[b], and they will be fruitful and multiply.
  footnotes:
  - marker: a
    text: Or 'where I have scattered them.' The Hebrew verb can denote causing to be driven away or dispersed; 'driven' was chosen to preserve the force of divine judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'to their fold' or 'to their habitation.' The Hebrew term can refer to a pasture, dwelling place, or resting place; 'pasture' fits the flock imagery here.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 친히 나의 양 떼의 남은 자들을 내가 그들을 몰아낸 모든 땅에서 모으고[a], 그들을 그들의 초장[b]으로 다시 데려오겠습니다. 그러면 그들은 번성하고 많아질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 그들을 흩어 놓은 곳에서’로도 옮길 수 있습니다. 히브리어 동사는 몰아내거나 흩어지게 하는 뜻을 가질 수 있으므로, 여기서는 하나님의 심판에 따른 추방의 힘을 드러내기 위해 ‘몰아낸’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들의 우리’ 또는 ‘그들의 거처’로도 옮길 수 있습니다. 이 말은 초장, 거처, 또는 쉼터를 가리킬 수 있으며, 목자와 양의 이미지에서는 ‘초장’이 문맥에 가장 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  english_pob_choice: And I myself
  chosen_korean: 내가
  alternatives_korean:
  - 나도
  - 그리고 내가
  lexicon: HALOT
  rationale: 히브리어 독립 인칭대명사의 강조를 한국어에서는 주어를 앞세워 자연스럽게 살리되, ‘나 자신이’처럼 과도하게 중복하지 않도록 했습니다.
- source_word: אֲקַבֵּץ
  english_pob_choice: will gather
  chosen_korean: 모으고
  alternatives_korean:
  - 모아들이고
  - 거두어들이고
  lexicon: HALOT
  rationale: 포로 귀환 문맥의 קבץ를 ‘모으다’로 옮겨 집합의 의미를 살렸고, 뒤의 ‘데려오겠습니다’와 짝지어 흐름을 자연스럽게 했습니다.
- source_word: הִדַּחְתִּי / נְוֵיהֶן
  english_pob_choice: I have driven / their pasture
  chosen_korean: 몰아낸 / 초장
  alternatives_korean:
  - 흩어 놓은 / 목장
  - 내쫓은 / 거처
  lexicon: HALOT
  rationale: הִדַּחְתִּי의 능동적 심판 뉘앙스를 ‘몰아내다’로 살렸고, flock 이미지의 נָוֶה는 문맥상 ‘초장’이 가장 적절하여 POB의 ‘pasture’와 대응시켰습니다.
- source_word: וּפָרוּ וְרָבוּ
  english_pob_choice: they will be fruitful and multiply
  chosen_korean: 번성하여 불어날 것입니다
  alternatives_korean:
  - 열매를 맺고 크게 늘어날 것입니다
  - 생육하고 번성할 것입니다
  lexicon: HALOT
  rationale: 두 동사의 결합이 창조/언약적 번성 공식을 이루므로, 한국어에서도 중복을 피하면서도 증가와 확장의 의미를 함께 드러냈습니다.
theological_decisions:
- issue: 심판과 회복의 병행
  chosen_reading: 하나님이 그들을 ‘몰아내신’ 심판과 다시 ‘모으고’ ‘데려오시는’ 회복을 함께 보존했습니다.
  alternative_readings:
  - ‘몰아내다’를 약화하여 단순한 분산으로만 옮기기
  rationale: 원문은 추방의 원인에 하나님의 주권을 직접 귀속시키므로, 심판과 회복의 긴장을 완화하지 않고 그대로 드러내는 것이 필요합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
