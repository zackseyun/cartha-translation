  terminology: ‘양 떼’, ‘남은 자들’, ‘초장’, ‘몰아낸’은 문맥과 예언서 용례에 적합합니다. 각주 a의 ‘흩으신’은 본문 화자와의 인칭 일치를 위해 ‘내가 그들을 흩어 놓은’으로 고치는 것이 바람직합니다.
