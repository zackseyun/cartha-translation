id: JER.23.21
reference: Jeremiah 23:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לֹא שָׁלַ֥חְתִּי אֶת הַ/נְּבִאִ֖ים וְ/הֵ֣ם רָ֑צוּ לֹא דִבַּ֥רְתִּי אֲלֵי/הֶ֖ם וְ/הֵ֥ם נִבָּֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/021.yaml
  text: I did not send the prophets[a], yet they ran; I did not speak to them, yet they prophesied.
  footnotes:
  - marker: a
    text: Or 'but they ran.' The Hebrew conjunction can be rendered simply 'and,' but here it carries a strong contrast.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 예언자들을 보내지 않았는데도 그들이 달려갔으며, 내가 그들에게 말하지 않았는데도 그들이 예언했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 달려갔지만’으로도 옮길 수 있습니다. 히브리어 접속사는 단순한 ‘그리고’일 수 있으나, 여기서는 강한 대조를 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא שָׁלַחְתִּי
  english_pob_choice: I did not send
  chosen_korean: 내가 … 보내지 않았는데도
  alternatives_korean:
  - 내가 … 파견하지 않았는데도
  - 내가 … 위임하지 않았는데도
  lexicon: WLC; HALOT
  rationale: שׁלח의 기본 의미인 ‘보내다’를 살리되, 뒤의 대조를 자연스럽게 드러내기 위해 ‘않았는데도’로 옮겼습니다.
- source_word: הַנְּבִאִים
  english_pob_choice: the prophets
  chosen_korean: 예언자들을
  alternatives_korean:
  - 그 예언자들을
  - 선지자들을
  lexicon: WLC; HALOT
  rationale: 히브리어 관사 있는 복수형을 문맥상 ‘그 예언자들’로 특정할 수 있으나, 한국어에서는 자연스럽게 짧게 ‘예언자들’로 옮겼습니다.
- source_word: רָצוּ
  english_pob_choice: they ran
  chosen_korean: 그들이 달려갔으며
  alternatives_korean:
  - 그들이 달렸으며
  - 그들이 서둘렀으며
  lexicon: WLC; HALOT
  rationale: רץ의 직역인 ‘달리다’를 유지해 하나님께서 보내지 않으셨는데도 앞다투어 나선 이미지를 보존했습니다.
- source_word: דִבַּרְתִּי אֲלֵיהֶם
  english_pob_choice: I did not speak to them
  chosen_korean: 내가 그들에게 말하지 않았는데도
  alternatives_korean:
  - 내가 그들에게 말씀하지 않았는데도
  - 내가 그들과 이야기하지 않았는데도
  lexicon: WLC; HALOT
  rationale: דבר אל의 직접적 의미를 따라 ‘말하다’로 옮겼고, 예언의 권위가 곧바로 부정된다는 점을 드러냈습니다.
- source_word: נִבָּאוּ
  english_pob_choice: they prophesied
  chosen_korean: 그들이 예언했습니다
  alternatives_korean:
  - 그들이 예언하였습니다
  - 그들이 선포했습니다
  lexicon: WLC; HALOT
  rationale: נבא의 표준적 의미를 따라 ‘예언하다’로 옮겨, 승인되지 않은 예언 행위를 분명히 했습니다.
theological_decisions:
- issue: 부정된 예언의 성격
  chosen_reading: 이 절은 그 예언자들이 하나님의 보내심도, 말씀도 없이 움직였다고 말합니다.
  alternative_readings:
  - 단지 성급하게 나아갔다는 비판으로 약화해서 읽을 수 있습니다.
  rationale: 두 개의 평행 부정절(‘보내지 않았다’/‘말하지 않았다’)이 모두 부재를 강조하므로, 단순한 성급함보다 ‘권위 없는 예언’이라는 문맥을 유지하는 편이 원문에 더 가깝습니다.
  doctrine_reference: '번역 원칙: 본문이 지닌 신학적 긴장을 완화하지 않고 보존'
