reference: Jeremiah 23:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִֽם עָמְד֖וּ בְּ/סוֹדִ֑/י וְ/יַשְׁמִ֤עוּ דְבָרַ/י֙ אֶת עַמִּ֔/י וִֽ/ישִׁבוּ/ם֙ מִ/דַּרְכָּ֣/ם הָ/רָ֔ע וּ/מֵ/רֹ֖עַ מַֽעַלְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/022.yaml
  text: But if they had stood in my council[a], then they would have caused my people to hear my words, and they would have turned them from their evil way and from the evil of their deeds.
  footnotes:
  - marker: a
    text: Or 'in my secret council' or 'in my counsel.' The Hebrew סוֹד can refer to a confidential council, intimate circle, or counsel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 만일 내 회의에 섰더라면[a], 내 백성에게 내 말을 들려주어 그들이 자기의 악한 길과 자기 행위의 악에서 돌이키게 했을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 비밀 회의’나 ‘내 조언’으로 옮길 수 있습니다. 히브리어 סוֹד는 비밀스러운 회의, 친밀한 모임, 또는 조언을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  english_pob_choice: But if
  chosen_korean: 그러나 만일
  alternatives_korean:
  - 그리고 만일
  - 만일
  lexicon: HALOT
  rationale: 앞선 거짓 예언자 비난과 대비되는 역접을 살려 ‘그러나’로 옮겼습니다.
- source_word: בְּסוֹדִי
  english_pob_choice: in my council
  chosen_korean: 내 회의
  alternatives_korean:
  - 내 비밀 회의
  - 내 조언
  lexicon: HALOT
  rationale: סוֹד는 은밀한 내밀한 모임이나 회의를 뜻할 수 있으므로, 예언적 문맥의 ‘하나님의 회의’ 이미지를 살리는 ‘회의’가 가장 직접적입니다.
- source_word: וְיַשְׁמִעוּ דְבָרַי
  english_pob_choice: they would have caused my people to hear my words
  chosen_korean: 내 백성에게 내 말을 들려주어
  alternatives_korean:
  - 내 백성으로 하여금 내 말을 듣게 하여
  - 내 말을 선포하여
  lexicon: HALOT
  rationale: הִפְעִיל형의 사역적 의미를 살리면서도 한국어로 자연스럽게 ‘들려주다’로 옮겼습니다.
- source_word: וִישִׁבוּם
  english_pob_choice: they would have turned them
  chosen_korean: 돌이키게 했을 것입니다
  alternatives_korean:
  - 돌아오게 했을 것입니다
  - 돌이키도록 했을 것입니다
  lexicon: HALOT
  rationale: שׁוב의 사역적 의미를 유지하면서, 도덕적 전환을 가리키는 문맥에 맞게 ‘돌이키다’로 옮겼습니다.
theological_decisions:
- issue: סוֹד의 신학적 이미지
  chosen_reading: ‘내 회의’로 번역해 야훼의 비밀한 통치/의논의 자리에 참여하는 예언적 특권을 드러냈습니다.
  alternative_readings:
  - 내 조언
  - 내 비밀 회의
  rationale: 이 구절은 참 예언자와 거짓 예언자를 대비하며, 예언자가 하나님의 의논 자리에서 말씀을 받아 전하는 이미지를 강조합니다.
  doctrine_reference: Translation philosophy §1, §3
