  text: Am I a God who is near[a], declares Yahweh, and not a God who is far away?
  footnotes:
  - marker: a
    text: Or, 'Am I only a nearby God ... and not also a God far away?' The verse is a rhetorical question denying that the LORD is limited to what is near.
    reason: lexical_alternative
translation:
  language: ko
  text: “내가 가까이 계신 하나님이고, 멀리 계신 하나님은 아닙니까?” 여호와께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 가까이에만 계신 하나님이고, 멀리 계신 하나님은 아니겠습니까?” 이는 여호와께서 가까운 곳에만 제한되시는 분이 아니심을 부정하는 수사적 질문입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/אֱלֹהֵי מִ/קָּרֹב
  english_pob_choice: Am I a God who is near
  chosen_korean: 내가 가까운 하나님이냐
  alternatives_korean:
  - 내가 가까이 계신 하나님이냐
  - 내가 가까운 분이냐
  lexicon: HALOT
  rationale: 히브리어는 관계적 소유격보다 ‘가까운/먼’의 대조를 이루는 서술적 표현이므로, 한국어도 ‘가까운 하나님’으로 간결하게 살리고 질문형으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 선언이니라
  alternatives_korean:
  - 여호와께서 말씀하십니다
  - 여호와의 말씀이니라
  lexicon: HALOT
  rationale: 예언 공식의 엄중한 어조를 살리되, 본문 전승의 Tetragrammaton을 그대로 드러내기 위해 ‘여호와’가 아니라 ‘여호와의 선언’으로 처리했습니다.
- source_word: וְ/לֹא אֱלֹהֵי מֵ/רָחֹק
  english_pob_choice: and not a God who is far away
  chosen_korean: 그리고 먼 하나님은 아니냐
  alternatives_korean:
  - 그리고 멀리 계신 하나님은 아니냐
  - 그리고 먼 데에 있는 하나님은 아니냐
  lexicon: HALOT
  rationale: 평행 구조를 유지하기 위해 ‘가까운/먼’의 대응을 살렸고, ‘아니냐’로 영어의 수사적 질문이 지닌 부정 기대를 자연스럽게 반영했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 기록은 기존 한국어 성경 전통과의 가독성을 우선하면서도, 본문 아래의 audited English가 이름-표지를 유지한 점을 따라 여호와를 사용합니다.
  doctrine_reference: Theological name rendering
- issue: 수사적 질문의 의미
  chosen_reading: 하나님이 가까움에만 제한된 분이 아니라, 멀리 계신 분도 아니시라는 뜻을 드러내는 질문으로 번역했습니다.
  alternative_readings:
  - 단순히 거리의 대비를 말하는 질문
  - 감정적 거리감을 말하는 질문
  rationale: 원문은 신적 임재의 지리적 제한을 부정하는 반어적 질문이므로, 신학적 긴장을 풀지 않고 그대로 보존해야 합니다.
  doctrine_reference: Preserve theological tension rather than resolve it
