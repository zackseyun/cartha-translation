id: JER.23.12
reference: Jeremiah 23:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵן֩ יִֽהְיֶ֨ה דַרְכָּ֜/ם לָ/הֶ֗ם כַּ/חֲלַקְלַקּוֹת֙ בָּֽ/אֲפֵלָ֔ה יִדַּ֖חוּ וְ/נָ֣פְלוּ בָ֑/הּ כִּֽי אָבִ֨יא עֲלֵי/הֶ֥ם רָעָ֛ה שְׁנַ֥ת פְּקֻדָּתָ֖/ם נְאֻם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/012.yaml
  text: Therefore their way will be to them like slippery places in the darkness; they will be driven along and fall in it[a], for I will bring disaster on them in the year of their punishment, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'in the year of their visitation.' The Hebrew phrase can mean a time when God visits them for judgment or reckoning.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들의 길은 어둠 속의 미끄러운 곳들 같을 것이며, 그들은 그곳에서 떠밀려 넘어질 것입니다. 이는 내가 그들이 벌을 받을 해에[a] 그들에게 재앙을 내릴 것이기 때문입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 방문하시는 해’. 히브리어 표현은 하나님께서 심판과 결산을 위해 그들에게 개입하시는 때를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 그러니
  lexicon: HALOT
  rationale: 앞선 책망과 이어지는 결론·판결의 연결을 한국어에서도 분명히 드러내는 가장 자연스러운 접속어입니다.
- source_word: כַּחֲלַקְלַקּוֹת בָּאֲפֵלָה
  english_pob_choice: like slippery places in the darkness
  chosen_korean: 캄캄한 곳의 미끄러운 곳들 같을 것이며
  alternatives_korean:
  - 어둠 속의 미끄러운 곳들 같을 것이며
  - 캄캄한 곳의 미끄러운 지면 같을 것이며
  lexicon: HALOT
  rationale: 복수형 이미지와 위험한 장소의 감각을 살리기 위해 '곳들'을 유지했고, '캄캄한 곳'으로 어둠의 분위기를 자연스럽게 옮겼습니다.
- source_word: יִדַּחוּ וְנָפְלוּ בָהּ
  english_pob_choice: they will be driven along and fall in it
  chosen_korean: 그들은 거기에서 밀려 나가 넘어질 것입니다
  alternatives_korean:
  - 그들은 그 안에서 밀려가 넘어질 것입니다
  - 그들은 거기서 몰려가 넘어질 것입니다
  lexicon: HALOT
  rationale: יִדַּחוּ의 외부에 의한 밀어냄을 '밀려 나가'로 살리고, '거기에서'는 앞의 장소 이미지와 뒤의 '넘어질 것'을 자연스럽게 잇습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 불행
  - 화
  lexicon: HALOT
  rationale: 심판 문맥에서 도덕적 악이 아니라 징벌적 재난을 뜻하므로, 신학적 오해 없이 강한 심판성을 드러내는 '재앙'을 택했습니다.
- source_word: שְׁנַת פְּקֻדָּתָם
  english_pob_choice: in the year of their punishment
  chosen_korean: 그들이 벌받을 해
  alternatives_korean:
  - 그들의 벌받는 해
  - 그들의 징벌의 해
  lexicon: HALOT
  rationale: 여기서는 '방문/돌보심'의 일반 뜻보다 심판적 결과가 분명하므로, 한국어로 가장 직접적인 의미인 '벌받을 해'로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이십니다
  alternatives_korean:
  - 야훼의 말씀이니라
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 기록체의 예언 공식은 현대 합쇼체로 자연스럽게 마무리하되, 본문에 직접 나타난 신성 호칭은 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
theological_decisions:
