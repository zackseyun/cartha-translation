  source_fidelity: 히브리어의 נתן עַל(‘~ 위에 두다/부과하다’), 두 수치 명사, עוֹלָם의 지속성, 그리고 단수 관계절 ‘잊히지 않을’의 뜻은 대체로 충실히 반영되었습니다. 다만 ‘두겠으니’는 원문의 단순한 미래 진술을 한국어에서 이유·근거의 연결로 들리게 할 수 있으므로 수정하는 편이 정확합니다.
