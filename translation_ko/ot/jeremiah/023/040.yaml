  terminology: ‘치욕’(חֶרְפָּה)과 ‘수치’(כְּלִמּוּת)는 서로 가까우나 구별 가능한 적절한 대응입니다. ‘영원한’은 이 문맥에서 עוֹלָם의 강한 지속성을 잘 살립니다. 각주도 본문의 어휘적 범위를 적절히 보존합니다.
