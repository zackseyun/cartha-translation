  edition: WLC
  text: וְ/נָתַתִּ֥י עֲלֵי/כֶ֖ם חֶרְפַּ֣ת עוֹלָ֑ם וּ/כְלִמּ֣וּת עוֹלָ֔ם אֲשֶׁ֖ר לֹ֥א תִשָּׁכֵֽחַ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/040.yaml
  text: And I will put on you everlasting reproach and everlasting disgrace[a], which will not be forgotten.
  footnotes:
  - marker: a
    text: Or 'perpetual reproach and perpetual disgrace.' The Hebrew עוֹלָם can denote enduring or indefinite perpetuity depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 너희에게 영원한 치욕과 영원한 수치를 안겨 주겠으며, 그것은 잊히지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘항구한 치욕과 항구한 수치’. 히브리어 עוֹלָם은 문맥에 따라 지속적이거나 무기한적인 영속을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי עֲלֵיכֶם
  english_pob_choice: And I will put on you
  chosen_korean: 내가 너희 위에 ... 두겠으니
  alternatives_korean:
  - 너희 위에 ... 주겠으니
  - 너희 위에 ... 놓겠으니
  lexicon: HALOT
  rationale: נתן은 여기서 ‘주다’보다 ‘위에 두다/놓다’의 부담 부과 의미가 강하므로, עֲלֵיכֶם을 살려 ‘너희 위에 두다’로 옮기는 것이 자연스럽습니다.
- source_word: חֶרְפַּת
  english_pob_choice: reproach
  chosen_korean: 치욕
  alternatives_korean:
  - 모욕
  - 수치
  - 책망
  lexicon: HALOT
  rationale: חֶרְפָּה는 सार्वजनिक한 수치와 조롱을 포함한 ‘reproach’의 의미이므로, 한국어에서는 지속적 공개 수치를 잘 드러내는 ‘치욕’이 적절합니다.
- source_word: וּכְלִמּוּת
  english_pob_choice: and everlasting disgrace
  chosen_korean: 영원한 수치
  alternatives_korean:
  - 영원한 부끄러움
  - 영원한 불명예
  - 영원한 치욕
  lexicon: HALOT
  rationale: כְּלִמּוּת는 ‘disgrace, humiliation, shame’의 범위를 가지므로, 앞의 חֶרְפָּה와 구별되도록 ‘수치’로 옮겼습니다.
- source_word: עוֹלָם
  english_pob_choice: everlasting
  chosen_korean: 영원한
  alternatives_korean:
  - 항구한
  - 영속적인
  - 끝없는
  lexicon: HALOT
  rationale: 심판 맥락에서 עוֹלָם은 지속적·무기한적 영속성을 뜻하므로, 한국어의 자연스러운 종결감과 엄중함을 살리는 ‘영원한’이 적절합니다.
- source_word: לֹא תִשָּׁכֵחַ
  english_pob_choice: which will not be forgotten
  chosen_korean: 그것은 잊히지 않을 것입니다
  alternatives_korean:
  - 그것은 잊히지 않을 것입니다
  - 결코 잊히지 않을 것입니다
  - 잊혀지지 않을 것입니다
  lexicon: HALOT
  rationale: נשכח의 니팔형은 ‘잊히다’이므로, 현대 표준어의 자연스러운 수동 표현으로 옮겼습니다.
theological_decisions:
- issue: עוֹלָם의 심판 맥락에서의 강도
  chosen_reading: ‘영원한’으로 옮겨 지속적이고 무거운 심판의 성격을 드러냅니다.
  alternative_readings:
  - ‘영속적인’
  - ‘항구한’
  - ‘세세한’
  rationale: 본문은 포로 이전 유다의 완고함에 대한 최종적 선언으로, 독자에게 반복 불가한 수치의 지속성을 강하게 전달합니다. ‘영원한’은 본문의 경고성을 약화하지 않으면서도 한국어에서 가장 직접적입니다.
  doctrine_reference: 번역 원칙 §1, §5
