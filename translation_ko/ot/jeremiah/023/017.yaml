id: JER.23.17
reference: Jeremiah 23:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֹמְרִ֤ים אָמוֹר֙ לִֽ/מְנַאֲצַ֔/י דִּבֶּ֣ר יְהוָ֔ה שָׁל֖וֹם יִֽהְיֶ֣ה לָ/כֶ֑ם וְ֠/כֹל הֹלֵ֞ךְ בִּ/שְׁרִר֤וּת לִבּ/וֹ֙ אָֽמְר֔וּ לֹֽא תָב֥וֹא עֲלֵי/כֶ֖ם רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/017.yaml
  text: 'They keep saying to those who despise me[a], ‘Yahweh has spoken: You will have peace’; and to everyone who walks in the stubbornness of his own heart they say[c][b], ‘No disaster will come upon you.’'
  footnotes:
  - marker: a
    text: Or 'to my despisers' or 'to those who spurn me.' The Hebrew has 'those who despise me.'
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' can also carry the sense of well-being or prosperity.'
    reason: lexical_alternative
  - marker: c
    text: Or 'No evil will come upon you'; here 'evil' refers to calamity or disaster, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 나를 멸시하는 자들에게 계속 이렇게 말합니다. 「야훼께서 말씀하셨다. 너희에게 평강이 있을 것이다」 — 또 자기 마음의 완고함대로 걷는 모든 사람에게는 「너희에게 재앙이 닥치지 않을 것이다」라고 말합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘멸시하는’은 히브리어 נאץ의 기본 뜻을 따른 번역입니다. ‘업신여기는’이나 ‘경멸하는’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘평강’은 이 문맥에서 평안, 안전, 복리까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘재앙’은 여기서 도덕적 악이 아니라 심판적 재난을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמְרִים אָמוֹר
  english_pob_choice: They keep saying
  chosen_korean: 계속 이렇게 말합니다
  alternatives_korean:
  - 계속 말합니다
  - 끊임없이 말합니다
  lexicon: HALOT
  rationale: 분사와 동사의 강조적 결합이 반복·지속의 뉘앙스를 주므로, 자연스러운 합쇼체로 ‘계속 이렇게 말합니다’라고 옮겼습니다.
- source_word: לִמְנַאֲצַי
  english_pob_choice: to those who despise me
  chosen_korean: 나를 멸시하는 자들에게
  alternatives_korean:
  - 나를 업신여기는 자들에게
  - 나를 경멸하는 자들에게
  lexicon: HALOT
  rationale: נאץ의 핵심은 하나님에 대한 의도적 경멸이므로, ‘멸시하다’로 옮겨 개인적 모욕성과 죄책을 함께 살렸습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평강
  alternatives_korean:
  - 평안
  - 안녕
  lexicon: HALOT
  rationale: 예언 문맥의 שָׁלוֹם은 단순한 심리적 평안보다 안전과 복리를 포함하는 말이므로, POB 용례에 맞춰 ‘평강’으로 옮겼습니다.
- source_word: רָעָה
  english_pob_choice: No disaster will come upon you
  chosen_korean: 재앙이 닥치지 않을 것이다
  alternatives_korean:
  - 재난이 닥치지 않을 것이다
  - 악이 너희에게 임하지 않을 것이다
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악이 아니라 심판적 재난을 가리키므로 ‘재앙’으로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 예언자적 경고를 가장한 거짓 확신의 화법
  chosen_reading: ‘야훼께서 말씀하셨다’는 거짓 예언자들이 하나님의 이름을 빌려 평강을 선포하는 인용문으로 처리했습니다.
  alternative_readings:
  - 직역하여 단순한 서술문으로 처리하기
  - ‘주께서 말씀하셨다’로 바꾸기
  rationale: 원문은 하나님의 이름을 호출해 안전을 보장하는 거짓 선포를 고발하므로, 인용부호와 직접화법을 유지해 위장을 드러냈습니다.
  doctrine_reference: '예레미야서의 거짓 예언자 비판(예: 렘 23장 문맥)'
