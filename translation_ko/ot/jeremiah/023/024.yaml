  - 내가 그를 볼 수 없겠느냐
  lexicon: HALOT
  rationale: 원문의 도전적 수사와 목적/결과 관계를 한국어 반문으로 압축해, 하나님이 숨은 이를 보지 못하실 수 없다는 뜻을 유지했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이시다
  alternatives_korean:
  - 야훼께서 말씀하신다
  - 야훼의 선언이시다
  lexicon: HALOT
  rationale: 예언적 공식을 한국어 성경체에서 자연스러운 종결 표현으로 옮기되, POB의 하나님의 이름 표기 원칙에 따라 야훼를 유지했습니다.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  english_pob_choice: heaven and earth
  chosen_korean: 하늘과 땅
  alternatives_korean:
  - 하늘들과 땅
  - 하늘과 온 땅
  lexicon: HALOT
  rationale: 히브리어의 전형적인 총칭적 병렬구를 한국어 관용에 맞게 옮겼습니다.
- source_word: מָלֵא
  english_pob_choice: fill
  chosen_korean: 가득 채우지 않느냐
  alternatives_korean:
  - 채우지 않느냐
  - 가득하다 않느냐
  lexicon: HALOT
  rationale: ‘가득 채우다’로 표현해 단순한 존재 확언이 아니라 하늘과 땅 전체를 충만하게 채우는 적극적 의미를 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
