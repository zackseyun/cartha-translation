  - 주
  rationale: 원문에 מופיע하는 여호와 이름을 직역 관습어 ‘주’로 대체하지 않고, POB 원칙에 따라 고유명으로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 하늘과 땅을 ‘가득 채우다’의 신학적 강도
  chosen_reading: 하늘과 땅을 내가 가득 채우지 않느냐?
  alternative_readings:
  - 내가 하늘과 땅에 두루 있지 않느냐?
  - 내가 하늘과 땅에 충만하지 않느냐?
  rationale: 본문의 ‘채움’ 이미지를 추상적 무편재 진술로 완화하지 않고 그대로 살려, 하나님의 임재와 주권의 강한 표현을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; original-language primacy over translation tradition.
