lexical_decisions:
- source_word: אִם יִסָּתֵר אִישׁ
  english_pob_choice: Can a man hide himself
  chosen_korean: 사람이 비밀한 곳에 숨는다고 해서
  alternatives_korean:
  - 사람이 숨을 수 있느냐
  - 한 남자가 자신을 숨기겠느냐
  lexicon: HALOT
  rationale: 히브리어의 수사적 질문을 한국어에서 자연스러운 가능성 질문보다 결과를 내포한 도전문으로 옮겨, ‘숨는다’는 행위와 그 의도를 함께 드러냈습니다.
- source_word: בַּמִּסְתָּרִים
  english_pob_choice: in secret places
  chosen_korean: 비밀한 곳에
  alternatives_korean:
  - 숨은 곳에
  - 은밀한 곳에
  lexicon: HALOT
  rationale: 복수형 뉘앙스를 과도하게 살리기보다, 문맥상 하나님 눈을 피하려는 ‘숨는 곳’의 성격을 간결하게 드러냈습니다.
- source_word: וַאֲנִי לֹא אֶרְאֶנּוּ
  english_pob_choice: so that I do not see him
  chosen_korean: 내가 그를 보지 못하겠느냐
  alternatives_korean:
