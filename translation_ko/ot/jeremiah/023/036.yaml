revisions:
- from: 그러므로 너희는 다시는 ‘야훼의 짐’이라고 말하지 말라. 왜냐하면 각 사람의 말이 그 사람의 짐이 될 것이기 때문이다[a]. 너희는 살아 계신 하나님의 말씀, 곧 만군의 야훼 우리 하나님의 말씀을 왜곡하였기 때문이다.
  to: 너희는 다시는 ‘야훼의 짐’이라는 말을 입에 올리지 마십시오. 이는 각 사람에게는 자기 말이 짐이 될 것이며, 너희가 살아 계신 하나님, 곧 만군의 야훼, 우리 하나님의 말씀을 왜곡하였기 때문입니다[a].
  rationale: 불필요한 ‘그러므로’를 제거하고, 원문의 כִּי와 접속된 וַהֲפַכְתֶּם의 관계를 하나의 자연스러운 이유절로 재구성했습니다. ‘짐’의 반복, 야훼의 이름, ‘살아 계신 하나님’ 및 ‘만군의 야훼, 우리 하나님’이라는 호칭은 유지했습니다. 각주는 מַשָּׂא의 의도된 이중 의미를 직접 설명하도록 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:23:49Z'
