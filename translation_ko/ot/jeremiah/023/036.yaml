  source_fidelity: 수정이 필요합니다. 초안의 ‘그러므로’는 본문의 접속사 וְ가 지닌 단순한 연결을 근거-결과의 ‘그러므로’로 과도하게 한정합니다. 또한 두 번째 ‘왜곡하였기 때문이다’는 히브리어의 접속된 서술(‘그리고/또한 너희가 왜곡하였다’)을 앞 절과 별개의 이유절처럼 만들고, 두 번의 ‘때문이다’가 문장 관계를 흐립니다. מַשָּׂא를 두 번 모두 ‘짐’으로 옮긴 점과 ‘야훼’, ‘만군의 야훼’의 처리는 원문 및 프로젝트 방침에 충실합니다.
  naturalness: 합쇼체의 금지 표현 ‘말하지 마십시오’와, 이유를 자연스럽게 잇는 ‘이는 … 때문입니다’로 다듬었습니다. ‘각 사람에게는 자기 말이 짐이 될 것’은 압축된 히브리어 구문을 자연스럽게 풀면서도 귀속과 말장난을 보존합니다.
