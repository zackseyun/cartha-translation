  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מַשָּׂ֥א יְהוָ֖ה לֹ֣א תִזְכְּרוּ ע֑וֹד כִּ֣י הַ/מַּשָּׂ֗א יִֽהְיֶה֙ לְ/אִ֣ישׁ דְּבָר֔/וֹ וַ/הֲפַכְתֶּ֗ם אֶת דִּבְרֵי֙ אֱלֹהִ֣ים חַיִּ֔ים יְהוָ֥ה צְבָא֖וֹת אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/036.yaml
  text: But you shall no longer mention ‘the burden of Yahweh,’ for each man's own word will become his burden[a], and you have twisted the words of the living God, Yahweh of hosts[b], our God.
  footnotes:
  - marker: a
    text: Or 'oracle of the LORD.' The Hebrew word מַשָּׂא can mean 'burden' or, in prophetic contexts, an 'oracle/message'; here the prophet appears to exploit both senses.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man’s word will be his burden,' likely meaning that what each person says will recoil on him rather than being a true word from the LORD.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 너희는 다시는 ‘야훼의 짐’이라고 말하지 말라. 왜냐하면 각 사람의 말이 그 사람의 짐이 될 것이기 때문이다[a]. 너희는 살아 계신 하나님의 말씀, 곧 만군의 야훼 우리 하나님의 말씀을 왜곡하였기 때문이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 사람의 말이 그의 짐이 될 것이다.’ 히브리어 מַשָּׂא는 ‘짐’ 또는 예언 문맥에서 ‘신탁/말씀’을 뜻할 수 있으며, 여기서는 두 뜻을 함께 비틀어 사용하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשָּׂא
  english_pob_choice: burden
  chosen_korean: 짐
  alternatives_korean:
  - 예언
  - 신탁
  - 말씀
  lexicon: HALOT, BDB
  rationale: 문맥상 מַשָּׂא의 ‘짐/부담’과 예언적 ‘신탁’의 이중 의미가 걸려 있으므로, 한국어에서는 ‘짐’이 반복되어 말장난과 경고의 날카로움을 가장 잘 살립니다.
- source_word: תִזְכְּרוּ
  english_pob_choice: you shall no longer mention
  chosen_korean: 다시는 … 말하지 말라
  alternatives_korean:
  - 더 이상 기억하지 말라
  - 언급하지 말라
  lexicon: HALOT, BDB
  rationale: 뒤따르는 정형어 ‘야훼의 짐’을 입에 올리지 말라는 금지로 이해되므로, ‘말하지 말라’가 자연스럽고 ‘언급하다’보다 구어적 압박을 잘 드러냅니다.
- source_word: וַהֲפַכְתֶּם
  english_pob_choice: you have twisted
  chosen_korean: 왜곡하였기 때문이다
  alternatives_korean:
  - 뒤틀어 놓았기 때문이다
  - 비틀어 놓았기 때문이다
  - 뒤집어 버렸기 때문이다
  lexicon: HALOT, BDB
  rationale: 히브리어의 הפך는 단순한 회전이 아니라 말과 뜻을 비틀어 훼손하는 행위를 가리키므로, ‘왜곡하다’가 한국어로 가장 정확하고 문어적인 대응입니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: the LORD of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT, BDB
  rationale: 본 프로젝트 기본어는 야훼이며, צְבָאוֹת는 ‘hosts’의 군대적 이미지를 살려 관용적으로 ‘만군’으로 옮기는 것이 가장 투명합니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼로 음역하여 하나님의 고유명을 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 יְהוָה는 고유명인 ‘야훼’로 옮겨, 제목어 ‘주’로 대체하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: מַשָּׂא의 이중 의미
  chosen_reading: ‘짐’을 두 차례 유지해 예언어를 되돌려 비판하는 수사적 긴장을 살렸습니다.
  alternative_readings:
  - 신탁
  - 말씀
  rationale: 예언 공식의 남용을 꾸짖는 맥락이므로, 첫 번째와 두 번째 מַשָּׂא를 같은 한국어로 연결해 말장난과 심판의 반전을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5 (consistency of key terms, or documented exception)
