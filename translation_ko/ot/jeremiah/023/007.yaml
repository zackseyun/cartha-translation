id: JER.23.7
reference: Jeremiah 23:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לָ/כֵ֛ן הִנֵּֽה יָמִ֥ים בָּאִ֖ים נְאֻם יְהוָ֑ה וְ/לֹא יֹ֤אמְרוּ עוֹד֙ חַי יְהוָ֔ה אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/007.yaml
  text: Therefore[a], behold, days are coming, declares Yahweh, when they will no longer say, ‘As Yahweh lives, who brought up the sons of Israel from the land of Egypt,’
  footnotes:
  - marker: a
    text: Or more idiomatically, “the Israelites.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로[a] 보십시오. 야훼의 말씀이니라. “그들이 다시는 ‘애굽 땅에서 이스라엘 자손을 올라오게 하신 야훼께서 살아 계신다’고 말하지 않을 날들이 올 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로는 ‘이스라엘 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן / הִנֵּה
  english_pob_choice: Therefore / behold
  chosen_korean: 그러므로… 보십시오
  alternatives_korean:
  - 그러니
  - 보라
  lexicon: HALOT
  rationale: 인과 관계를 드러내는 לָכֵן은 ‘그러므로’로, 예언적 강조를 띠는 הִנֵּה는 ‘보십시오’로 옮겨 문맥의 엄숙한 주의를 살렸습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀이니라
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼께서 선언하십니다
  lexicon: HALOT
  rationale: 예언자적 공식을 한국어로 자연스럽게 드러내면서도, 고유명사 יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: ‘야훼께서 살아 계신다’
  alternatives_korean:
  - ‘야훼의 삶을 두고’
  - ‘야훼는 살아 계신다’
  lexicon: HALOT
  rationale: 히브리어의 맹세 관용구를 직접적으로 반영하기 위해 ‘살아 계신다’로 옮기되, 인용부호 안에서 맹세 표현임을 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 관형 구조를 직역성 있게 반영하되, 한국어 성서 관용에 따라 ‘이스라엘 자손’을 채택했습니다.
- source_word: מֵאֶרֶץ מִצְרַיִם
  english_pob_choice: from the land of Egypt
  chosen_korean: 애굽 땅에서
  alternatives_korean:
  - 이집트 땅에서
  - 애굽에서
  lexicon: HALOT
  rationale: 문맥상 출애굽의 역사적 회상을 가리키므로 전통적 성서 지명 ‘애굽’을 유지했고, ‘땅에서’로 원문의 지역 표현을 보존했습니다.
theological_decisions:
- issue: 예언적 맹세 공식의 어조
  chosen_reading: 직접 인용 안에서 맹세 문구를 유지해, 단순한 서술보다 더 강한 선포성과 엄숙함을 드러냈습니다.
  alternative_readings:
  - ‘야훼께서 살아 계신다’로 평서문화
  - ‘야훼의 삶을 두고’로 현대화
  rationale: 원문은 भविष्य의 관행 변화에 대한 선언이므로, 맹세 공식의 종교적·수사적 강도를 약화하지 않는 것이 중요합니다.
  doctrine_reference: '예언서 번역 원칙: 수사적 형식과 신학적 중량감 보존'
