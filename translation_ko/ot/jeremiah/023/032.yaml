id: JER.23.32
reference: Jeremiah 23:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִ֠נְ/נִי עַֽל נִבְּאֵ֞י חֲלֹמ֥וֹת שֶׁ֨קֶר֙ נְאֻם יְהוָ֔ה וַֽ/יְסַפְּרוּ/ם֙ וַ/יַּתְע֣וּ אֶת עַמִּ֔/י בְּ/שִׁקְרֵי/הֶ֖ם וּ/בְ/פַחֲזוּתָ֑/ם וְ/אָנֹכִ֨י לֹֽא שְׁלַחְתִּ֜י/ם וְ/לֹ֣א צִוִּיתִ֗י/ם וְ/הוֹעֵ֛יל לֹֽא יוֹעִ֥ילוּ לָֽ/עָם הַ/זֶּ֖ה נְאֻם יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/032.yaml
  text: Behold[a], I am against those who prophesy lying dreams, declares Yahweh, and who tell them and lead my people astray by their lies and by their recklessness, though I did not send them or command them. They do not profit this people at all[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'those who prophesy false dreams.' The Hebrew literally has 'lying dreams,' using the noun 'lie/falsehood' attributively.
    reason: lexical_alternative
  - marker: b
    text: Or 'their boastfulness,' 'their rashness,' or 'their frivolity' for 'their recklessness.' The Hebrew term is difficult and conveys irresponsible, presumptuous conduct.
    reason: lexical_alternative
translation:
  language: ko
  text: 「보라, 나는 거짓 꿈을 예언하는 자들 — 주님의 말씀이다 — 에게 맞서 있습니다. 그들은 그 꿈을 말하여 내 백성을 자기들의 거짓과 자기들의 경솔함으로 잘못 인도하였으나, 나는 그들을 보내지도 않았고 명령하지도 않았습니다. 그들은 이 백성에게 아무 유익도 주지 못합니다 — 주님의 말씀이다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거짓 꿈을 예언하는 자들’은 히브리어의 문자적 표현을 따른 것으로, ‘거짓된 꿈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘경솔함’은 פַחֲזוּת의 핵심 뉘앙스를 살린 번역이며, 문맥에 따라 ‘무모함’, ‘방자함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי / עַל
  english_pob_choice: Behold, I am against
  chosen_korean: 보라, 나는 …에게 맞서 있습니다
  alternatives_korean:
  - 보라, 나는 …에 대항합니다
  - 보라, 나는 …을/를 반대합니다
  lexicon: HALOT
  rationale: הִנְנִי의 선포적 긴장과 עַל의 적대적 방향성을 함께 살려, 단순한 반대보다 심판적 대치를 드러내는 표현으로 옮겼습니다.
- source_word: נִבְּאֵי חֲלֹמוֹת שֶׁקֶר
  english_pob_choice: those who prophesy lying dreams
  chosen_korean: 거짓 꿈을 예언하는 자들
  alternatives_korean:
  - 거짓된 꿈을 예언하는 자들
  - 거짓 꿈들의 예언자들
  lexicon: HALOT
  rationale: 분사구문을 직역하되, שֶׁקֶר의 명사적 뉘앙스를 ‘거짓 꿈’으로 살려 ‘거짓된 꿈’보다 원문의 결속을 더 직접적으로 반영했습니다.
- source_word: וַיְסַפְּרוּם / וַיַּתְעוּ
  english_pob_choice: tell them and lead my people astray
  chosen_korean: 그들은 그 꿈을 말하여 내 백성을 … 잘못 인도하였으나
  alternatives_korean:
  - 그것들을 말하고 내 백성을 길에서 벗어나게 하였으나
  - 그것들을 전하고 내 백성을 속여 빗나가게 하였으나
  lexicon: HALOT
  rationale: ‘말하다’는 꿈을 전달하는 동사를 자연스럽게 옮기면서, תעה의 인과성을 ‘잘못 인도하다’로 표현해 deception과 방향 상실을 함께 드러냈습니다.
- source_word: בְּשִׁקְרֵיהֶם וּבְפַחֲזוּתָם
  english_pob_choice: by their lies and by their recklessness
  chosen_korean: 자기들의 거짓과 자기들의 경솔함으로
  alternatives_korean:
  - 자기들의 거짓과 자기들의 무모함으로
  - 자기들의 거짓과 자기들의 방자함으로
  lexicon: HALOT
  rationale: 반복된 בְ를 한국어에서는 조사보다 ‘…으로’로 대응시켜 두 원인을 병렬적으로 유지했고, פַחֲזוּת는 문맥상 ‘경솔함’이 가장 균형 있게 들립니다.
- source_word: לֹא שְׁלַחְתִּי/ם וְלֹא צִוִּיתִי/ם
  english_pob_choice: though I did not send them or command them
  chosen_korean: 나는 그들을 보내지도 않았고 명령하지도 않았습니다
  alternatives_korean:
  - 나는 그들을 보내지 않았고 지시하지도 않았습니다
  - 나는 그들을 파견하지도 않았고 명하지도 않았습니다
  lexicon: HALOT
  rationale: 신적 파견과 위임의 부재를 평이한 현대 한국어로 분명히 옮겼으며, ‘명령하다’로 צוה의 직접적 권위를 살렸습니다.
- source_word: לֹא יוֹעִילוּ
  english_pob_choice: They do not profit this people at all
  chosen_korean: 그들은 이 백성에게 아무 유익도 주지 못합니다
  alternatives_korean:
  - 그들은 이 백성에게 전혀 이롭지 못합니다
  - 그들은 이 백성에게 아무 소용이 없습니다
  lexicon: HALOT
  rationale: יוֹעִיל의 ‘유익하다/도움이 되다’ 의미를 살려, 결과적 무익성을 현대 문체로 분명하게 표현했습니다.
theological_decisions:
- issue: 예언 선포문 끝의 נְאֻם יְהוָה 처리
  chosen_reading: ‘주님의 말씀이다’로 옮기되 본문 안에서 선포적 인용표지를 유지했습니다.
  alternative_readings:
  - ‘야훼의 말씀이다’
  - ‘주께서 말씀하신다’
  rationale: 본문의 심판 선언 구조를 살리기 위해 예언자적 공식어를 분리해 표기했고, 본문 전체의 합쇼체 흐름과 충돌하지 않도록 짧은 선언형으로 처리했습니다.
  doctrine_reference: YHWH 표기는 본문 저본에서 직접 확인되며, 한국어 본문은 현재 합쇼체 출판 스타일과의 균형을 고려해 선언 공식을 유지합니다.
