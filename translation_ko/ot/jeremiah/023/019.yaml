  lexicon: HALOT
  rationale: 예언 선언의 주의를 끄는 감각을 살리면서도 현대 한국어에서 자연스럽고 공손한 호소로 옮겼습니다.
- source_word: סַעֲרַת יְהוָה / יְהוָה
  english_pob_choice: the storm of Yahweh
  chosen_korean: 야훼의 폭풍
