  rationale: 지명적·언약적 고유명사인 יְהוָה는 프로젝트 기본값에 따라 야훼로 옮기고, סַעֲרָה는 ‘폭풍’이 현대 한국어에서 가장 직접적이고 강한 대응어이므로 선택했습니다.
- source_word: חֵמָה
  english_pob_choice: in wrath
  chosen_korean: 진노 가운데
  alternatives_korean:
  - 분노 가운데
  - 진노로
  - 분노로
  lexicon: HALOT
  rationale: 원문의 진노/격노 어감을 유지하면서 한국어에서 자연스러운 부사적 표현으로 옮겼습니다.
- source_word: מִתְחוֹלֵל / יָחוּל
  english_pob_choice: whirling / it will whirl down
  chosen_korean: 소용돌이치는 … 휘몰아칠 것입니다
  alternatives_korean:
  - 휘몰아치는 … 휘돌아칠 것입니다
  - 소용돌이치는 … 휩쓸어 내릴 것입니다
  - 소용돌이치는 … 떨어질 것입니다
  lexicon: HALOT
  rationale: 두 동사가 같은 어근 חול의 격렬한 회전·소용돌이 이미지를 공유하므로, 한국어에서도 어근 연결감을 살려 ‘소용돌이치는’과 ‘휘몰아칠’로 대응했습니다.
- source_word: עַל רֹאשׁ רְשָׁעִים
  english_pob_choice: on the head of the wicked
  chosen_korean: 악인들의 머리 위로
