  source_fidelity: ‘자기 목장’은 1인칭 단수 접미사(‘나의’)를 3인칭 재귀 표현으로 바꾸므로 원문에 충실하지 않습니다. 또한 ‘흩어지게 하는’보다 사역형 분사에 맞는 ‘흩어 버리는’이 직접적입니다.
  naturalness: 현대 표준 한국어 합쇼체에서는 ‘목자들아’보다 ‘목자들에게 화가 있습니다’가 자연스럽고, 예언적 선언의 강도도 유지합니다.
  terminology: ‘목자’, ‘양’, ‘야훼’는 원문의 목자 비유와 신명을 적절히 보존합니다. ‘내 목장의 양’은 מַרְעִיתִי의 1인칭 소유를 반영하며, 대안 독법은 각주로 제시합니다.
