lexical_decisions:
- source_word: הוֹי
  english_pob_choice: Woe
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 슬프다
  - 아아
  - 재앙이 있도다
  lexicon: HALOT
  rationale: 예언자적 책망과 심판 선언의 강한 어조를 한국어에서 가장 자연스럽게 살립니다.
- source_word: רֹעִים
  english_pob_choice: shepherds
  chosen_korean: 목자들
  alternatives_korean:
  - 지도자들
  - 목동들
  lexicon: HALOT
  rationale: 본문의 목자-양 비유를 그대로 살려, 원문의 은유를 해석으로 바꾸지 않도록 했습니다.
- source_word: מַרְעִיתִי
  english_pob_choice: my pasture
  chosen_korean: 자기 목장
  alternatives_korean:
  - 내 목장
  - 내 풀밭
  - 내 목초지
  lexicon: HALOT
  rationale: 직역하면 '내 목장/목초지'이지만, 한국어에서 '양을 멸하고 흩어지게 하는' 대상이 되는 공간과 소유 관계를 함께 드러내기 위해 문맥상 자연한 '자기 목장'으로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언서의 정형 공식으로서 선포적 문체를 살리면서, 본 프로젝트의 기준에 따라 신명은 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 예언적 경고의 어조
  chosen_reading: '''화 있을진저''로 시작해 심판 선언의 경고성을 분명히 드러냈습니다.'
  alternative_readings:
  - '''슬프다''로 완화'
  - '''재앙이 있도다''로 번역'
  rationale: 히브리어 הוֹי는 단순한 탄식보다 책망과 심판을 동반하는 예언적 경고이므로, 그 신학적 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 예언서 수사와 심판 선언의 보존
