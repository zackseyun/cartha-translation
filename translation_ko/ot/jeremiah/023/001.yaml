    rationale: מַרְעִיתִי는 ‘나의 목초지/나의 pasture’이며, 화자는 야훼입니다. ‘자기’는 목자들의 소유로 읽힐 수 있어 의미가 달라집니다.
  - severity: medium
    issue: ‘흩어지게 하는’이 사역 동작을 다소 완화함
    rationale: וּמְפִצִים은 양 떼를 흩어지게 만든다는 적극적 사역을 뜻하므로 ‘흩어 버리는’이 더 직접적입니다.
  revised_text: 내 목장의 양을 멸하며 흩어 버리는 목자들에게 화가 있습니다. 야훼의 말씀입니다.[a]
