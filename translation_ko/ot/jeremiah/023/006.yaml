  - severity: medium
    issue: 각주가 ‘칭의’라는 해석적 신학 용어를 추가합니다.
    rationale: צִדְקֵנוּ의 의미 범위는 ‘의/의로움’ 및 문맥에 따른 ‘공의’로 설명할 수 있으나, ‘칭의’는 본문 어휘 자체가 명시하지 않는 특정 신학적 체계의 표현입니다.
