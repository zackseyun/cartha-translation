id: JER.23.6
reference: Jeremiah 23:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בְּ/יָמָי/ו֙ תִּוָּשַׁ֣ע יְהוּדָ֔ה וְ/יִשְׂרָאֵ֖ל יִשְׁכֹּ֣ן לָ/בֶ֑טַח וְ/זֶה שְּׁמ֥/וֹ אֲֽשֶׁר יִקְרְא֖/וֹ יְהוָ֥ה צִדְקֵֽ/נוּ־־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/006.yaml
  text: 'In his days Judah will be saved[a], and Israel will dwell securely[b]; and this is the name by which he will be called: Yahweh Is Our Righteousness.'
  footnotes:
  - marker: a
    text: Or, 'The LORD our righteousness.' The Hebrew title may be read as a verbless name formula.
    reason: lexical_alternative
  - marker: b
    text: '''Righteousness'' could also be rendered ''justice,'' since the Hebrew term can carry both senses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 날들에는 유다가 구원을 받을 것이며, 이스라엘은 안전하게 거주할 것입니다. 그리고 이것은 그가 불릴 이름입니다. 곧, 「야훼는 우리의 의이십니다」입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의’는 여기서 ‘공의’로도 옮길 수 있지만, 이름 공식 전체에서는 언약적 의로움과 칭의의 뉘앙스를 함께 담는 표현이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 날들에는
  alternatives_korean:
  - 그때에는
  - 그의 시대에는
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서 자연스럽게 들리도록 복수형 표현을 유지했습니다.
- source_word: תִּוָּשַׁע
  english_pob_choice: will be saved
  chosen_korean: 구원을 받을 것입니다
  alternatives_korean:
  - 구원될 것입니다
  - 구출될 것입니다
  lexicon: HALOT
  rationale: 니팔형의 수동/피동 의미를 살려 '구원을 받다'로 옮겼습니다. 군사적 해방으로만 좁히지 않으면서도 본문의 구원 뉘앙스를 보존합니다.
- source_word: יִשְׁכֹּן לָבֶטַח
  english_pob_choice: will dwell securely
  chosen_korean: 안전하게 거주할 것입니다
  alternatives_korean:
  - 안전히 살 것입니다
  - 평안히 거주할 것입니다
  lexicon: HALOT
  rationale: שׁכן의 '거주하다'와 לָבֶטַח의 '안전하게/안심하고'를 함께 살려, 정착된 안전의 뉘앙스를 현대 한국어로 표현했습니다.
- source_word: יְהוָה צִדְקֵנוּ
  english_pob_choice: Yahweh Is Our Righteousness
  chosen_korean: 야훼는 우리의 의이십니다
  alternatives_korean:
  - 야훼는 우리의 의입니다
  - 야훼는 우리의 공의이십니다
  lexicon: HALOT
  rationale: YHWH는 프로젝트 기준에 따라 '야훼'로 옮기고, צֶדֶק/צְדָקָה 계열은 문맥상 '의'를 기본값으로 유지했습니다. 이름 공식의 서술적 힘을 살리기 위해 '이십니다'를 사용했습니다.
theological_decisions:
- issue: 유다/이스라엘의 구원과 안전, 그리고 마지막 이름 공식의 관계
  chosen_reading: 본문의 마지막 이름을 메시아적 칭호로 읽되, 이름 자체를 문장 안에서 그대로 재현했습니다.
  alternative_readings:
  - 이 이름을 설명적 문장으로 풀어 쓰는 방식
  - 주석적으로만 '주님의 의'라고 옮기는 방식
  rationale: 히브리어는 명명 공식으로 제시하므로, 번역문에서도 이름의 형태를 보존하는 편이 본문의 힘을 더 잘 전달합니다. 동시에 '야훼는 우리의 의'라는 진술이 다윗 왕조의 회복과 연결된다는 신학적 긴장을 유지했습니다.
  doctrine_reference: Jeremiah 23:5-6 messianic naming formula; YHWH divine-name rendering policy
