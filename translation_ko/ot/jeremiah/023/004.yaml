  to: 내가 그들을 맡을 목자들을 세울 것이며, 그 목자들은 그들을 목양할 것입니다[a]. 그들은 다시는 두려워하지 않고 낙담하지 않으며, 하나도 빠지지 않을 것입니다. 야훼의 선언입니다.
  rationale: 미래 약속의 문법을 일관된 합쇼체로 정리하고, 목자 비유와 명사·동사의 연관성을 ‘목자들/목양하다’로 유지했습니다. ‘그들을 맡을’은 עַל의 지도력·책임 관계를 자연스럽게 전달하며, ‘낙담하지 않으며’와 ‘하나도 빠지지 않을 것입니다’는 각각 חתת와 פקד의 문맥적 의미를 더 정확히 반영합니다. 하나님의 이름은 영어 POB 감사 추적과 프로젝트 기본값에 따라 ‘야훼’로 통일했습니다.
  reviewer_model: gpt-5.6-terra
