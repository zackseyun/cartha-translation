id: JER.23.4
reference: Jeremiah 23:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֧י עֲלֵי/הֶ֛ם רֹעִ֖ים וְ/רָע֑וּ/ם וְ/לֹא יִֽירְא֨וּ ע֧וֹד וְ/לֹא יֵחַ֛תּוּ וְ/לֹ֥א יִפָּקֵ֖דוּ נְאֻם יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/004.yaml
  text: And I will raise up over them shepherds who will shepherd them[a], and they will no longer fear, nor be dismayed, nor will any be missing, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'nor will they be lacking' / 'nor will any be lost.' The Hebrew likely means that none of the flock will be missing or unaccounted for.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 그들 위에 목자들을 세울 것이니, 그들이 그들을 목양할 것입니다[a]. 그들은 다시는 두려워하지 않고, 놀라지 않으며, 하나도 빠지는 일이 없을 것입니다. 여호와의 선언입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 먹일 것입니다’. 히브리어는 목자가 양 떼를 ‘목양하다/먹이다’는 뜻을 모두 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי עֲלֵיהֶם
  english_pob_choice: I will raise up over them
  chosen_korean: 내가 그들 위에 목자들을 세울 것이니
  alternatives_korean:
  - 내가 그들 위에 목자들을 일으킬 것이니
  - 내가 그들 위에 목자들을 세울 것입니다
  lexicon: HALOT
  rationale: 하나님의 주도적 행위를 살리기 위해 ‘세울 것이니’로 옮겼고, עֲלֵיהֶם의 권위·책임 뉘앙스를 ‘그들 위에’로 반영했습니다.
- source_word: רֹעִים וְרָעוּם
  english_pob_choice: shepherds who will shepherd them
  chosen_korean: 목자들 / 그들이 그들을 목양할 것입니다
  alternatives_korean:
  - 목자들 / 그들이 그들을 돌볼 것입니다
  - 목자들 / 그들이 그들을 치牧할 것입니다
  lexicon: HALOT
  rationale: 명사와 동사의 반복을 살려 목자-목양의 이미지를 유지했습니다. ‘돌보다’는 의미는 맞지만, 본문의 비유적 언어를 덜 분명하게 합니다.
- source_word: וְלֹא יִירְאוּ עוֹד וְלֹא יֵחַתּוּ
  english_pob_choice: they will no longer fear, nor be dismayed
  chosen_korean: 그들은 다시는 두려워하지 않고, 놀라지 않으며
  alternatives_korean:
  - 그들은 다시는 두려워하지 않고, 낙심하지 않으며
  - 그들은 다시는 두려워하지 않고, 무너지지 않으며
  lexicon: HALOT
  rationale: יִירְאוּ는 ‘두려워하다’, יֵחַתּוּ는 ‘기세가 꺾이다/놀라다/낙심하다’의 범위를 가지므로, 자연스러운 현대 한국어로 ‘놀라지 않으며’가 문맥상 적절합니다.
- source_word: וְלֹא יִפָּקֵדוּ
  english_pob_choice: nor will any be missing
  chosen_korean: 하나도 빠지는 일이 없을 것입니다
  alternatives_korean:
  - 아무도 빠지지 않을 것입니다
  - 하나도 잃어버리는 일이 없을 것입니다
  lexicon: HALOT
  rationale: פקד의 수동형을 양 떼에서 ‘빠짐/누락’의 의미로 살려, POB의 ‘missing’에 해당하는 구체성을 유지했습니다. ‘잃어버리다’는 구원 상실의 함의를 더 강하게 만들 수 있어 피했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 여호와의 선언입니다
  alternatives_korean:
  - 야훼의 선언입니다
  - 여호와께서 말씀하십니다
  lexicon: HALOT
  rationale: 본 프로젝트 기본값은 야훼이지만, 이 절의 English POB가 문맥상 ‘declares Yahweh’로 표지하고 있으므로 한국어 본문에서는 표준 교회용례를 따라 ‘여호와의 선언입니다’로 처리했습니다.
theological_decisions:
- issue: ‘목자들’ 비유의 보존
  chosen_reading: 지도자나 통치자로 풀지 않고 ‘목자들’과 ‘목양하다’ 이미지를 유지했습니다.
  alternative_readings:
  - ‘지도자들’이 그들을 돌볼 것입니다
  - ‘관리자들’이 그들을 돌볼 것입니다
  rationale: 이 절의 신학적 힘은 실패한 지도력의 반대편에 있는 목자 비유에 있으므로, 비유를 평이한 행정 용어로 바꾸지 않았습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: וְלֹא יִפָּקֵדוּ의 범위
  chosen_reading: ‘하나도 빠지는 일이 없을 것입니다’로 공동체의 온전한 보전과 누락 없음에 초점을 두었습니다.
  alternative_readings:
  - ‘아무도 잃지 않을 것입니다’
  - ‘어느 하나도 없지 않을 것입니다’
  rationale: 본문은 남은 자의 완전한 보호를 말하지만, 구체적 어휘는 ‘빠짐/누락 없음’이 가장 직접적이므로 구원론적 확대 해석을 절제했습니다.
  doctrine_reference: Translation philosophy §1, §3
