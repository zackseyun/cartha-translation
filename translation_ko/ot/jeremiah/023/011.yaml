  source_fidelity: 초안은 חָנֵפוּ를 ‘불경합니다’로, בְּבֵיתִי를 ‘내 집’으로, רָעָתָם을 ‘그들의 악’으로 옮겨 핵심 어휘를 대체로 충실히 반영합니다. 그러나 ‘내가 발견하였다고 야훼께서 선언하십니다’는 원문의 1인칭 발화를 간접 인용으로 바꾸고, ‘내가’를 불필요하게 중복합니다. נְאֻם יְהוָה는 한국어 예언 공식으로 ‘야훼의 말씀입니다’라고 독립적으로 처리하는 것이 원문의 발화 구조를 더 정확히 보존합니다.
  naturalness: ‘선지자와 제사장 둘 다 불경합니다’보다 ‘선지자와 제사장 모두가 불경합니다’가 현대 표준 한국어 문장으로 더 자연스럽습니다. 수정문은 합쇼체를 유지하면서도 야훼의 직접 발화와 엄숙한 예언 선언 공식을 명료하게 드러냅니다.
  terminology: ‘선지자’, ‘제사장’, ‘불경하다’, ‘야훼’는 문맥과 프로젝트의 명명 방침에 부합합니다. ‘내 집’은 성전을 직접 대체하지 않고 유지하며 각주로 설명합니다. 어휘 각주는 본문과 같은 ‘불경합니다’를 대안으로 중복 제시하지 않도록 조정했습니다.
