id: JER.23.11
reference: Jeremiah 23:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּֽי גַם נָבִ֥יא גַם כֹּהֵ֖ן חָנֵ֑פוּ גַּם בְּ/בֵיתִ֛/י מָצָ֥אתִי רָעָתָ֖/ם נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/011.yaml
  text: For both prophet and priest are ungodly[a]; even in my house I have found their evil[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'are profane,' 'are polluted,' or 'are hypocritical.' The Hebrew verb carries the sense of moral-religious corruption or godlessness.
    reason: lexical_alternative
  - marker: b
    text: '''My house'' refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 이는 선지자와 제사장 둘 다 불경합니다[a]. 심지어 내 집에서 그들의 악을 내가 발견하였다고 야훼께서 선언하십니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘더럽혀졌습니다’, ‘불경합니다’, ‘위선적입니다’. 히브리어 동사는 도덕적·종교적 타락이나 불경함의 뜻을 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 집’은 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: גַּם ... גַם
  english_pob_choice: both ... and
  chosen_korean: 둘 다
  alternatives_korean:
  - 선지자와 제사장 모두
  - 선지자도 제사장도
  lexicon: HALOT
  rationale: 반복된 גַּם의 병렬 강조를 한국어에서는 자연스럽게 ‘둘 다’로 옮겨, 두 집단 모두가 동일하게 포괄된다는 점을 분명히 했습니다.
- source_word: חָנֵפוּ
  english_pob_choice: are ungodly
  chosen_korean: 불경합니다
  alternatives_korean:
  - 경건하지 않습니다
  - 더럽혀졌습니다
  - 위선적입니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 위선보다 도덕·종교적 타락과 불경을 가리키므로, 현대 한국어에서 그 긴장을 가장 직접적으로 드러내는 ‘불경합니다’를 선택했습니다.
- source_word: בְּבֵיתִי
  english_pob_choice: in my house
  chosen_korean: 내 집에서
  alternatives_korean:
  - 내 성전에서
  - 내 집 안에서
  lexicon: HALOT
  rationale: 직역하면 ‘내 집’이지만, 문맥상 성전을 가리키는 표현이므로 본문에는 원문 표현을 살리되 각주로 문화적 의미를 밝혔습니다.
- source_word: רָעָתָם
  english_pob_choice: their evil
  chosen_korean: 그들의 악
  alternatives_korean:
  - 그들의 악행
  - 그들의 악함
  - 그들의 죄악
  lexicon: HALOT
  rationale: רָעָה의 기본적 도덕 악의 의미를 살려, 원문의 직접성을 유지하는 ‘그들의 악’을 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼께서 선언하십니다
  alternatives_korean:
  - 야훼의 말씀이십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언 공식의 선포성을 살리기 위해 ‘선언하십니다’를 선택했고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 טetragrammaton을 사용하므로, 프로젝트 기본값에 따라 번역어 ‘야훼’를 유지해 고유한 언약 নাম을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘내 집’의 의미
  chosen_reading: 성전을 가리키는 표현으로 유지
  alternative_readings:
  - 직접적으로 성전으로 번역
  - 내 집이라는 표현만 유지
  rationale: 원문은 ‘내 집’이라고 말하지만 문맥상 성전을 뜻하므로, 본문에서는 원문 이미지를 살리고 각주로 그 문화적 의미를 밝혔습니다.
  doctrine_reference: English audit trail cultural note on בְּבֵיתִי
