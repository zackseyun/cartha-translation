id: JER.23.9
reference: Jeremiah 23:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לַ/נְּבִאִ֞ים נִשְׁבַּ֧ר לִבִּ֣/י בְ/קִרְבִּ֗/י רָֽחֲפוּ֙ כָּל עַצְמוֹתַ֔/י הָיִ֨יתִי֙ כְּ/אִ֣ישׁ שִׁכּ֔וֹר וּ/כְ/גֶ֖בֶר עֲבָ֣ר/וֹ יָ֑יִן מִ/פְּנֵ֣י יְהוָ֔ה וּ/מִ/פְּנֵ֖י דִּבְרֵ֥י קָדְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/009.yaml
  text: 'Concerning the prophets: my heart is broken within me[a]; all my bones tremble. I have become like a drunken man, like a strong man overcome by wine[c][b], because of Yahweh and because of his holy words.'
  footnotes:
  - marker: a
    text: Or 'Against the prophets'; the Hebrew preposition can introduce the subject matter of the oracle or, more interpretively, its adversative force.
    reason: alternative_reading
  - marker: b
    text: Or 'all my bones shake' or 'quiver.'
    reason: lexical_alternative
  - marker: c
    text: Or 'before the LORD and before his holy words'; here 'because of' is taken as expressing the cause of the prophet's overwhelmed condition.
    reason: lexical_alternative
translation:
  language: ko
  text: 「예언자들에 대하여」 내 마음이 내 속에서 깨졌고 내 모든 뼈가 떨립니다. 나는 술에 취한 사람 같고, 포도주에 제압된 용사 같아졌습니다. 야훼와 그의 거룩한 말씀들 때문에 그렇습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예언자들을 대하여”; 히브리어 전치사 ל는 이곳에서 화제 표지로도, 보다 해석적으로는 반대의 뉘앙스로도 읽힐 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 “내 모든 뼈가 흔들립니다” 혹은 “전율합니다”.
    reason: lexical_alternative
  - marker: c
    text: 또는 “야훼 앞에서와 그의 거룩한 말씀들 앞에서”; 여기서는 그의 압도적 임재가 이 상태의 원인이라는 뜻으로 ‘때문에’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַנְּבִאִים
  english_pob_choice: Concerning the prophets
  chosen_korean: 「예언자들에 대하여」
  alternatives_korean:
  - 「예언자들을 향하여」
  - 「예언자들에 관하여」
  lexicon: HALOT
  rationale: ל + 명사는 여기서 화제 표지를 이루므로, 영어 POB의 ‘Concerning’에 맞추어 한국어에서는 ‘…에 대하여’로 옮기는 것이 가장 자연스럽습니다.
- source_word: נִשְׁבַּר לִבִּי בְקִרְבִּי
  english_pob_choice: my heart is broken within me
  chosen_korean: 내 마음이 내 속에서 깨졌고
  alternatives_korean:
  - 내 마음이 내 속에서 부서졌고
  - 내 마음이 내 가운데서 상했습니다
  lexicon: HALOT
  rationale: נשבר의 수동 결과 상태를 살려 ‘깨졌고’로 옮기고, בְקִרְבִּי의 공간성을 ‘내 속에서’로 보존했습니다.
- source_word: רָחֲפוּ כָּל עַצְמוֹתַי
  english_pob_choice: all my bones tremble
  chosen_korean: 내 모든 뼈가 떨립니다
  alternatives_korean:
  - 내 모든 뼈가 흔들립니다
  - 내 모든 뼈가 벌벌 떱니다
  lexicon: HALOT
  rationale: רחף의 몸 떨림/흔들림의 뜻을 현대 한국어에서 가장 자연스럽게 드러내는 동사로 ‘떨립니다’를 택했습니다.
- source_word: וּכְגֶבֶר עֲבָר/וֹ יָיִן
  english_pob_choice: like a strong man overcome by wine
  chosen_korean: 포도주에 제압된 용사 같아졌습니다
  alternatives_korean:
  - 포도주에 눌린 강한 사람 같아졌습니다
  - 포도주에 이긴 것을 당한 용사 같아졌습니다
  lexicon: HALOT
  rationale: גבר는 단순한 ‘남자’보다 힘센 인물을 가리키므로 ‘용사’로 살리고, עבר + wine의 압도당함을 ‘제압된’으로 옮겼습니다.
theological_decisions:
- issue: YHWH(יְהוָה) 인명 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 신명기적 예언 맥락에서 신명사 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
