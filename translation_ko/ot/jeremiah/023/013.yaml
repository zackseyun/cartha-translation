    rationale: ‘불의한 것’도 문맥상 가능하지만, תפלה는 부정의 일반보다 종교적·도덕적으로 망령되고 혐오스러운 일을 가리킵니다. ‘망령된 일’이 평가적 힘과 사건성을 더 잘 보존합니다.
  revised_text: 사마리아의 예언자들 가운데서 나는 망령된 일을 보았습니다[a]. 그들은 바알의 이름으로 예언하여[b] 내 백성 이스라엘을 그릇된 길로 이끌었습니다.
