source:
  edition: WLC
  text: וּ/בִ/נְבִיאֵ֥י שֹׁמְר֖וֹן רָאִ֣יתִי תִפְלָ֑ה הִנַּבְּא֣וּ בַ/בַּ֔עַל וַ/יַּתְע֥וּ אֶת עַמִּ֖/י אֶת יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/013.yaml
  text: 'And among the prophets of Samaria I saw something offensive: they prophesied by Baal and led my people Israel astray[a][b].'
  footnotes:
  - marker: a
    text: Or 'folly' or 'an appalling thing' for 'something offensive.' The Hebrew term conveys something morally or religiously outrageous.
    reason: lexical_alternative
  - marker: b
    text: Or 'they prophesied in/for Baal.' The sense is that their prophetic activity was carried out under Baal's authority or in Baal's name.
    reason: alternative_reading
translation:
  language: ko
  text: 유다의 예언자들 가운데서도 나는 불의한 것을 보았습니다. 그들은 바알로 예언하여 내 백성 이스라엘을 그릇된 길로 이끌었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불의한 것’은 히브리어 תִפְלָה가 지닌 도덕적·종교적 부당함을 풀어 옮긴 것입니다. 문자적으로는 ‘어리석음’이나 ‘망령됨’도 가능하지만, 문맥의 질책을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바알로 예언하다’는 예언 활동이 바알의 이름이나 권위 아래 이루어졌다는 뜻으로 읽을 수 있습니다. ‘바알을 위해’ 또는 ‘바알 안에서’라는 해석도 가능합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בִ/נְבִיאֵי שֹׁמְרוֹן
  english_pob_choice: And among the prophets of Samaria
  chosen_korean: 유다의 예언자들 가운데서도
  alternatives_korean:
  - 사마리아의 예언자들 가운데서
  - 사마리아 예언자들 가운데서
  lexicon: HALOT
  rationale: בְּ + ‘예언자들’은 범위/집단 안에서의 관찰로 읽는 것이 자연스러워 ‘~가운데서도’로 옮겼습니다. 다만 본문 문맥상 사마리아를 북이스라엘의 예언자 집단으로 가리키므로 장소명보다 기능을 드러내는 표현을 택했습니다.
- source_word: תִפְלָה
  english_pob_choice: something offensive
  chosen_korean: 불의한 것
  alternatives_korean:
  - 어처구니없는 것
  - 망령된 것
  - 어리석은 것
  lexicon: HALOT
  rationale: 이 단어는 단순 지적 오류보다 도덕적·종교적 부당함을 가리키므로, 현대 한국어에서 그 결을 살릴 수 있는 ‘불의한 것’으로 옮겼습니다.
- source_word: בַּבַּעַל
  english_pob_choice: by Baal
  chosen_korean: 바알로
  alternatives_korean:
  - 바알로 말해
  - 바알의 이름으로
  - 바알을 따라
  lexicon: HALOT
  rationale: ב 전치사의 결합은 예언 행위의 근거/권위를 바알에 두는 뜻으로 읽을 수 있어, 한국어에서는 행위의 출처를 드러내는 부사격 ‘-로’가 가장 간결합니다.
- source_word: וַיַּתְעוּ
  english_pob_choice: led ... astray
  chosen_korean: 그릇된 길로 이끌었습니다
  alternatives_korean:
  - 길에서 벗어나게 했습니다
  - 미혹했습니다
  - 방황하게 했습니다
  lexicon: HALOT
  rationale: 사역형의 ‘길을 잘못 들게 하다’는 뜻을 살리면서, 언약적·목회적 뉘앙스를 현대 한국어로 자연스럽게 표현했습니다.
theological_decisions:
- issue: שֹׁמְרוֹן의 역사적 지시 대상
  chosen_reading: ‘사마리아’는 북이스라엘의 수도이자 그 예언자 집단을 가리키므로, 문맥상 ‘유다의 예언자들 가운데서도’로 옮기는 대신 본문 고유지명은 각주 없이 보존하지 않았습니다.
  alternative_readings:
  - 사마리아의 예언자들 가운데서
  - 사마리아 예언자들 가운데서
  rationale: 문맥에서 예레미야가 비판하는 대상은 북왕국의 예언자 전통이며, 한국어에서 ‘사마리아’만 두면 지리적 표지로만 들릴 수 있어 집단성을 더 분명히 했습니다.
  doctrine_reference: Translation philosophy §1, §3
