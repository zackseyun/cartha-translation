    issue: שֹׁמְרוֹן(사마리아)을 ‘유다’로 번역함
    rationale: 사마리아와 유다는 별개의 지명·정치적 실체입니다. 문맥적 해설을 이유로 고유지명을 다른 지명으로 대체할 수 없으며, 이는 원문의 역사적 지시 대상을 변경합니다.
  - severity: medium
