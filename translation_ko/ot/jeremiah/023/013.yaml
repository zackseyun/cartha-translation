revisions:
- from: 유다의 예언자들 가운데서도 나는 불의한 것을 보았습니다. 그들은 바알로 예언하여 내 백성 이스라엘을 그릇된 길로 이끌었습니다[a][b].
  to: 사마리아의 예언자들 가운데서 나는 망령된 일을 보았습니다[a]. 그들은 바알의 이름으로 예언하여[b] 내 백성 이스라엘을 그릇된 길로 이끌었습니다.
  rationale: 원문의 고유지명 ‘사마리아’를 복원했습니다. 또한 תפלה의 종교적·도덕적 고발을 ‘망령된 일’로 옮기고, 바알과 관련된 전치사구는 한국어에서 자연스러운 ‘바알의 이름으로’로 표현하되 가능한 해석 범위를 각주에 보존했습니다.
