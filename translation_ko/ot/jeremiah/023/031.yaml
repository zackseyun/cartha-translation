- from: 보십시오[a], 내가 예언자들을 거슬러 있습니다. 야훼의 선언입니다. 그들은 자기들의 혀를 잡아 가지고는, ‘선언!’이라고 예언합니다.
  to: 보십시오[a], 내가 예언자들을 대적합니다. 야훼의 선언입니다. 그들은 자기 혀를 놀려, ‘선언!’이라고 말합니다.
