source:
  edition: WLC
  text: הִנְ/נִ֥י עַל הַ/נְּבִיאִ֖ם נְאֻם יְהוָ֑ה הַ/לֹּקְחִ֣ים לְשׁוֹנָ֔/ם וַֽ/יִּנְאֲמ֖וּ נְאֻֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/031.yaml
  text: Behold[a], I am against the prophets, declares Yahweh, who take their own tongues and declare, ‘Declaration!’
  footnotes:
  - marker: a
    text: Or, “who use their tongues and say, ‘Oracle!’” The Hebrew is terse and likely ironic, portraying prophets who manufacture authoritative-sounding speech from their own mouths.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 예언자들을 대적합니다. 야훼의 선언입니다. 그들은 자기 혀를 놀려, ‘선언!’이라고 말합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기들의 혀를 사용하여, ‘신탁!’이라고 말합니다.” 히브리어는 매우 압축적이며, 자기 입에서 권위 있어 보이는 말을 만들어 내는 예언자들을 비꼬는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Behold, I am
  chosen_korean: 보십시오, 내가 있습니다
  alternatives_korean:
  - 보십시오, 내가
  - 보라, 내가
  lexicon: HALOT
  rationale: 예언적 엄숙한 선언을 살리기 위해 감탄사적 호소를 넣었고, 현대 한국어에서는 ‘보십시오’가 합쇼체의 공적 어조와 잘 맞습니다.
- source_word: עַל
  english_pob_choice: against
  chosen_korean: 거슬러
  alternatives_korean:
  - 대하여
  - against
  lexicon: HALOT
  rationale: 이 표현은 단순한 위치가 아니라 विरोध/심판의 방향을 가리키므로, 한국어에서는 ‘거슬러’로 적대의 뉘앙스를 드러냈습니다.
- source_word: הַלֹּקְחִים לְשׁוֹנָם
  english_pob_choice: who take their own tongues
  chosen_korean: 자기들의 혀를 잡아 가지고는
  alternatives_korean:
  - 자기들의 혀를 사용하고는
  - 자기들의 혀를 취하고는
  lexicon: HALOT
  rationale: לקח의 구체적 ‘잡다/취하다’ 이미지를 살리되, 한국어에서 자연스럽게 ‘혀를 잡아 가지고는’으로 옮겨 기만적으로 꾸며 내는 동작을 드러냈습니다.
- source_word: וַיִּנְאֲמוּ נְאֻם
  english_pob_choice: and declare, ‘Declaration!’
  chosen_korean: ‘선언!’이라고 예언합니다
  alternatives_korean:
  - ‘신탁!’이라고 예언합니다
  - ‘야훼의 선언!’이라고 예언합니다
  lexicon: HALOT
  rationale: 같은 어근의 말장난과 아이러니를 살리기 위해, 끝의 bare נְאֻם을 직접 인용된 외침으로 처리했고 한국어에서는 ‘예언합니다’가 가장 자연스럽게 화자의 권위 주장과 어울립니다.
theological_decisions:
- issue: 야훼의 직접 인용을 한국어에서 어떻게 표기할지
  chosen_reading: 본문에서는 ‘야훼’로 표기하고, 예언자들의 거짓 권위 주장도 ‘선언!’으로 남겨 아이러니를 보존했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 이 절은 하나님의 이름과 예언 공식의 모방이 함께 있는 구절이므로, 용어를 바꾸어 긴장을 누그러뜨리지 않고 स्रोत-직역적 표현을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
