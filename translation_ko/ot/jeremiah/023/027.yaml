id: JER.23.27
reference: Jeremiah 23:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַ/חֹשְׁבִ֗ים לְ/הַשְׁכִּ֤יחַ אֶת עַמִּ/י֙ שְׁמִ֔/י בַּ/חֲל֣וֹמֹתָ֔/ם אֲשֶׁ֥ר יְסַפְּר֖וּ אִ֣ישׁ לְ/רֵעֵ֑/הוּ כַּ/אֲשֶׁ֨ר שָׁכְח֧וּ אֲבוֹתָ֛/ם אֶת שְׁמִ֖/י בַּ/בָּֽעַל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/023/027.yaml
  text: who plan to make my people forget my name by their dreams that they tell[a], each man to his neighbor[b], just as their fathers forgot my name because of Baal.
  footnotes:
  - marker: a
    text: Or 'through their dreams.' The Hebrew preposition can mark means or sphere.
    reason: lexical_alternative
  - marker: b
    text: Or 'for Baal' or 'through Baal.' The Hebrew likely means that devotion to Baal led them to forget the LORD's name.
    reason: lexical_alternative
translation:
  language: ko
  text: 각자가 이웃에게 들려주는 자기들의 꿈으로 내 백성이 내 이름을 잊게 하려고 꾀하는 자들입니다. 그들의 조상들이 바알 때문에 내 이름을 잊은 것과 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹשְׁבִים
  english_pob_choice: who plan
  chosen_korean: 계획하는 자들
  alternatives_korean:
  - 생각하는 자들
  - 의도하는 자들
  lexicon: HALOT
  rationale: חשׁב의 분사형은 단순한 사고보다 의도적 계획과 꾀함을 나타내므로, 문맥의 거짓 예언자 비판에 맞게 '계획하는 자들'로 옮겼습니다.
- source_word: לְהַשְׁכִּיחַ
  english_pob_choice: to make ... forget
  chosen_korean: 잊게 하려고
  alternatives_korean:
  - 잊도록 하려고
  - 잊게 만들려고
  lexicon: HALOT
  rationale: 히필의 사역 의미를 살리되 한국어에서는 자연스러운 사역 표현인 '잊게 하려고'로 압축해 전달했습니다.
- source_word: בַּחֲלֹמוֹתָם
  english_pob_choice: by their dreams
  chosen_korean: 자기들의 꿈으로
  alternatives_korean:
  - 그들의 꿈으로
  - 그들의 꿈을 통해
  lexicon: HALOT
  rationale: 전치사 בְּ는 수단/영역 모두 가능하므로, 본문이 꿈을 매개로 백성을 미혹한다는 뜻을 살려 '자기들의 꿈으로'로 번역했습니다.
- source_word: אִישׁ לְרֵעֵהוּ
  english_pob_choice: each man to his neighbor
  chosen_korean: 각기 자기 이웃에게
  alternatives_korean:
  - 서로에게
  - 각 사람에게
  lexicon: HALOT
  rationale: 분배적 표현과 남성 단수 형태를 살리면서도 현대 한국어에서 성별을 과도하게 드러내지 않도록 '각기 자기 이웃에게'로 옮겼습니다.
- source_word: בַּבָּעַל
  english_pob_choice: because of Baal
  chosen_korean: 바알 때문에
  alternatives_korean:
  - 바알로 말미암아
  - 바알을 따라
  lexicon: HALOT
  rationale: 문맥상 조상들이 바알 숭배에 연루되어 야훼의 이름을 잊었다는 인과/연관을 한국어에서 가장 분명하게 드러내는 표현으로 '때문에'를 택했습니다.
theological_decisions:
- issue: 야훼의 '이름' 언어 보존
  chosen_reading: 두 번의 שְׁמִי를 모두 '내 이름'으로 직역했습니다.
  alternative_readings:
  - 내 명성
  - 내가 누구인지
  rationale: 예언문맥의 언약적 책임 추궁에서 '이름'은 단순한 평판이 아니라 계시된 존재와 언약적 पहचान을 가리키므로, 해석 확장 없이 직역을 유지했습니다.
  doctrine_reference: 예언서의 언약 신학 및 하나님의 이름 계시
- issue: 이사형 비교절의 연속성
  chosen_reading: '''—그들의 조상들이 바알 때문에 내 이름을 잊은 것과 같습니다''로 비교를 명시했습니다.'
  alternative_readings:
  - '''…와 같이''로 더 완곡하게 처리'
  - 비교절을 단독 문장으로 분리
  rationale: כַּאֲשֶׁר의 비교 기능을 분명히 드러내어, 현재의 거짓 꿈과 조상들의 우상숭배를 직접 연결하는 예언적 논지를 보존했습니다.
  doctrine_reference: 본문의 수사 구조와 우상숭배 비판
