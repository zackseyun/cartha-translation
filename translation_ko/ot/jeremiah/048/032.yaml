  lexicon: HALOT
  rationale: 예언적 탄식의 현재적 애도 성격을 살리면서도, 히브리어 미완료형의 미래/의지성을 반영해 한국어에서는 ‘울겠습니다’로 옮겼습니다.
- source_word: נְטִישֹׁתַיִךְ
  english_pob_choice: your branches
  chosen_korean: 네 가지는
  alternatives_korean:
  - 네 가지들은
  - 네 새순은
  lexicon: HALOT
  rationale: 포도나무 비유에서 נְטִישֹׁתַיִךְ는 퍼져 나간 가지/돋은 가지들을 가리키므로, 가장 자연스럽고 시각적인 ‘가지’로 옮겼습니다.
- source_word: עָבְרוּ יָם עַד יָם יַעְזֵר נָגָעוּ
  english_pob_choice: crossed the sea; they reached as far as Jazer
  chosen_korean: 바다를 건넜고, 야제르까지 이르렀습니다
  alternatives_korean:
  - 바다를 건넜고, 야제르의 바다까지 이르렀습니다
  - 바다를 지나 야제르까지 닿았습니다
  lexicon: HALOT
  rationale: MT의 과장된 시적 이미지를 유지하되, 한국어에서는 중복된 ‘sea of Jazer’ 표현보다 본문이 의도하는 확장성 자체를 선명하게 드러내는 쪽이 자연스럽습니다.
- source_word: שֹׁדֵד נָפָל
  english_pob_choice: the destroyer has fallen
  chosen_korean: 파괴자가 떨어졌습니다
  alternatives_korean:
  - 파괴자가 내렸습니다
  - 파멸자가 덮쳤습니다
  lexicon: HALOT
  rationale: שֹׁדֵד는 파괴·유린의 행위를 하는 자를 가리키므로, 문맥상 ‘파괴자’가 가장 직접적입니다. נָפָל은 재앙이 ‘떨어지다’는 이미지를 살려 재난의 급습을 표현했습니다.
theological_decisions:
- issue: 원문 말미의 재앙 이미지(‘파괴자가 떨어졌습니다’)를 완화할지 여부
  chosen_reading: 재앙이 위에서 ‘떨어지는’ 수동적 심판 이미지를 그대로 보존했습니다.
  alternative_readings:
  - ‘파괴자가 닥쳤습니다’로 완화
  - ‘파괴자가 내려왔습니다’로 순화
  rationale: 본문은 포도 수확 위에 갑자기 임한 심판을 시각적으로 그리므로, 한국어에서도 우연한 불행이 아니라 하나님의 심판 아래 놓인 붕괴라는 긴장을 유지하는 것이 좋습니다.
  doctrine_reference: Jeremiah 48의 심판-애가 구조
