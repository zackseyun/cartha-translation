  naturalness: ‘네 가지는’보다 집합적 주어에 맞는 ‘네 가지가’가 자연스럽습니다. ‘파괴자가 떨어졌습니다’는 한국어에서 파괴자 자신이 추락한 뜻으로 쉽게 읽히므로 ‘파괴자가 덮쳤습니다’로 고쳤습니다. ‘야제르의 바다’는 한국어로 다소 낯설지만, 본문 난점을 평탄화하지 않고 보존하는 표현입니다.
  terminology: 야제르, 시브마는 음역을 유지했습니다. נְטִישֹׁתַיִךְ의 가능한 뜻(싹/덩굴손)은 별도 어휘 각주로 제시했습니다. ‘여름 열매’, ‘포도 수확’, ‘파괴자’는 문맥과 원어의 의미 영역에 적절합니다.
