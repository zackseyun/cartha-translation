source:
  edition: WLC
  text: מִ/בְּכִ֨י יַעְזֵ֤ר אֶבְכֶּה לָּ/ךְ֙ הַ/גֶּ֣פֶן שִׂבְמָ֔ה נְטִֽישֹׁתַ֨יִ/ךְ֙ עָ֣בְרוּ יָ֔ם עַ֛ד יָ֥ם יַעְזֵ֖ר נָגָ֑עוּ עַל קֵיצֵ֥/ךְ וְ/עַל בְּצִירֵ֖/ךְ שֹׁדֵ֥ד נָפָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/032.yaml
  text: With the weeping of Jazer I weep for you[a], vine of Sibmah; your branches crossed the sea; they reached as far as Jazer[c][b]. Upon your summer fruit and upon your grape harvest the destroyer has fallen.
  footnotes:
  - marker: a
    text: Or 'More than the weeping of Jazer I weep for you'; the opening preposition may carry a comparative nuance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your shoots' or 'your tendrils.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew reads 'they reached as far as the sea of Jazer.' Because Jazer was inland, some understand this as poetic hyperbole, while others propose a textual adjustment such as 'they reached as far as Jazer.'
    reason: textual_variant
translation:
  language: ko
  text: 야제르의 울음과 함께 내가 너를 위해 울겠습니다, 시브마의 포도나무여. 네 가지는 바다를 건넜고, 야제르까지 이르렀습니다. 네 여름 열매와 네 포도 수확 위에 파괴자가 떨어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 비교적 뉘앙스를 가질 수 있어 ‘~보다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야제르의 바다’로도 읽힐 수 있으나, 야제르가 내륙지방이라는 점에서 시적 과장으로 이해하거나 본문을 조금 다르게 보는 견해가 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: מִבְּכִי יַעְזֵר
  english_pob_choice: With the weeping of Jazer
  chosen_korean: 야제르의 울음과 함께
  alternatives_korean:
  - 야제르의 울음으로
  - 야제르의 울음보다
  lexicon: HALOT
  rationale: מִבְּכִי는 비교·동반의 뉘앙스를 띨 수 있어, 한국어에서는 자연스럽게 ‘~와 함께’로 처리해 울음의 연관성을 살리되 비교성을 과도하게 단정하지 않았습니다.
- source_word: אֶבְכֶּה לָּךְ
  english_pob_choice: I weep for you
  chosen_korean: 내가 너를 위해 울겠습니다
  alternatives_korean:
  - 내가 너를 위해 웁니다
  - 내가 너를 애도하겠습니다
  lexicon: HALOT
  rationale: 예언적 탄식의 현재적 애도 성격을 살리면서도, 히브리어 미완료형의 미래/의지성을 반영해 한국어에서는 ‘울겠습니다’로 옮겼습니다.
- source_word: נְטִישֹׁתַיִךְ
  english_pob_choice: your branches
  chosen_korean: 네 가지는
  alternatives_korean:
  - 네 가지들은
  - 네 새순은
  lexicon: HALOT
  rationale: 포도나무 비유에서 נְטִישֹׁתַיִךְ는 퍼져 나간 가지/돋은 가지들을 가리키므로, 가장 자연스럽고 시각적인 ‘가지’로 옮겼습니다.
- source_word: עָבְרוּ יָם עַד יָם יַעְזֵר נָגָעוּ
  english_pob_choice: crossed the sea; they reached as far as Jazer
  chosen_korean: 바다를 건넜고, 야제르까지 이르렀습니다
  alternatives_korean:
  - 바다를 건넜고, 야제르의 바다까지 이르렀습니다
  - 바다를 지나 야제르까지 닿았습니다
  lexicon: HALOT
  rationale: MT의 과장된 시적 이미지를 유지하되, 한국어에서는 중복된 ‘sea of Jazer’ 표현보다 본문이 의도하는 확장성 자체를 선명하게 드러내는 쪽이 자연스럽습니다.
- source_word: שֹׁדֵד נָפָל
  english_pob_choice: the destroyer has fallen
  chosen_korean: 파괴자가 떨어졌습니다
  alternatives_korean:
  - 파괴자가 내렸습니다
  - 파멸자가 덮쳤습니다
  lexicon: HALOT
  rationale: שֹׁדֵד는 파괴·유린의 행위를 하는 자를 가리키므로, 문맥상 ‘파괴자’가 가장 직접적입니다. נָפָל은 재앙이 ‘떨어지다’는 이미지를 살려 재난의 급습을 표현했습니다.
theological_decisions:
- issue: 원문 말미의 재앙 이미지(‘파괴자가 떨어졌습니다’)를 완화할지 여부
  chosen_reading: 재앙이 위에서 ‘떨어지는’ 수동적 심판 이미지를 그대로 보존했습니다.
  alternative_readings:
  - ‘파괴자가 닥쳤습니다’로 완화
  - ‘파괴자가 내려왔습니다’로 순화
  rationale: 본문은 포도 수확 위에 갑자기 임한 심판을 시각적으로 그리므로, 한국어에서도 우연한 불행이 아니라 하나님의 심판 아래 놓인 붕괴라는 긴장을 유지하는 것이 좋습니다.
  doctrine_reference: Jeremiah 48의 심판-애가 구조
