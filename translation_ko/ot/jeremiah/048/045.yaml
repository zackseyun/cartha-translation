source:
  edition: WLC
  text: בְּ/צֵ֥ל חֶשְׁבּ֛וֹן עָמְד֖וּ מִ/כֹּ֣חַ נָסִ֑ים כִּֽי אֵ֞שׁ יָצָ֣א מֵ/חֶשְׁבּ֗וֹן וְ/לֶֽהָבָה֙ מִ/בֵּ֣ין סִיח֔וֹן וַ/תֹּ֨אכַל֙ פְּאַ֣ת מוֹאָ֔ב וְ/קָדְקֹ֖ד בְּנֵ֥י שָׁאֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/045.yaml
  text: In the shadow of Heshbon the fugitives stand without strength[a], for a fire has gone out from Heshbon, and a flame from the midst of Sihon[d][c][b]; it has consumed the corner of Moab and the crown of the head of the sons of tumult.
  footnotes:
  - marker: a
    text: Or 'stood, lacking strength'; the Hebrew perfect may be rendered as a past tense, and the phrase מִכֹּחַ can mean 'for lack of strength.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from between Sihon.' 'Sihon' may stand metonymically for the city or realm associated with him.
    reason: lexical_alternative
  - marker: c
    text: Or 'the edge of Moab.' The Hebrew 'corner' is a poetic image for an extremity or border.
    reason: lexical_alternative
  - marker: d
    text: Or 'the crown of the head of the noisy ones' / 'the sons of uproar.'
    reason: lexical_alternative
translation:
  language: ko
  text: 헤스본의 그늘 아래에서 도망자들이 기운이 빠진 채 서 있습니다[a]. 이는 불이 헤스본에서 나오고, 화염이 시혼의 한가운데서 나와 Moab의 모퉁이와 소란의 아들들의 머리 꼭대기를 삼켜 버렸기 때문입니다[b][c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기운이 없어 섰다’로 옮길 수 있습니다. 히브리어 מִכֹּחַ는 ‘힘의 부재’ 또는 ‘무기력’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시혼의 사이에서’/‘시혼에서’. 시혼은 그의 도시나 영역을 가리키는 환유일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘Moab의 가장자리’. 히브리어 ‘모퉁이’는 시적 비유로서 끝단이나 변두리를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘소란의 아들들’의 ‘머리 꼭대기’. 히브리어 표현은 ‘소란/떠들썩함의 사람들’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
