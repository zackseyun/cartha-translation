theological_decisions:
- issue: 시혼과 Moab에 대한 의인화된 심판 이미지
  chosen_reading: 불과 화염이 한 도시/영역에서 나와 Moab 전체를 소멸시키는 예언적 비유로 유지했습니다.
  alternative_readings:
  - 역사적 전투 묘사로 축소
  - 수사적 과장으로 완화
  rationale: 본문의 심판 시적 언어를 약화하지 않고, 불의 근원이 시혼/헤스본 쪽에 있다는 원문 이미지를 그대로 보존하는 것이 필요합니다.
  doctrine_reference: 예언서의 심판 상징 언어
- issue: ‘도망자들이… 서 있습니다’의 시제
  chosen_reading: 현재형으로 옮겨 예언적 현재와 장면의 긴박함을 살렸습니다.
  alternative_readings:
  - ‘서 있었다’로 과거화
  - ‘서 있게 됩니다’로 미래화
  rationale: 히브리어 완료형은 시적·예언적 문맥에서 생생한 현재로 기능할 수 있으므로, 한국어도 그 즉시성을 반영했습니다.
  doctrine_reference: 히브리어 예언 시의 시제 용법
