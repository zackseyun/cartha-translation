source:
  edition: WLC
  text: לָ/כֵ֞ן הִנֵּ֖ה יָמִ֤ים בָּאִים֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּחְתִּי ל֥/וֹ צֹעִ֖ים וְ/צֵעֻ֑/הוּ וְ/כֵלָ֣י/ו יָרִ֔יקוּ וְ/נִבְלֵי/הֶ֖ם יְנַפֵּֽצוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/012.yaml
  text: Therefore behold[a], days are coming, declares Yahweh, when I will send to him pourers, and they will pour him out[c][b]; they will empty his vessels and shatter their jars.
  footnotes:
  - marker: a
    text: Or 'tilters' / 'decanters'; the Hebrew term is rare. The context of pouring, emptying vessels, and smashing containers supports the sense of those who pour out wine.
    reason: lexical_alternative
  - marker: b
    text: Or 'they will make him wander.' The Hebrew verb can be understood differently, but the surrounding wine-vessel imagery favors 'pour him out.'
    reason: alternative_reading
  - marker: c
    text: Hebrew 'their jars.' Some interpreters expect 'his jars' by sense, referring to Moab; the received text reads 'their.'
    reason: textual_variant
translation:
  language: ko
  text: 그러므로 보십시오. 날들이 오고 있습니다—야훼의 말씀입니다—내가 그에게 따르는 자들을 보내면 그들이 그를 쏟아 내고, 그의 그릇들을 비우며, 그들의 항아리들을 산산이 부술 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 희귀어로, 문맥상 포도주를 다른 그릇으로 붓는 사람들, 곧 ‘붓는 자들’ 또는 ‘따르는 자들’의 뜻으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 다른 번역 가능성으로는 ‘그들이 그를 떠돌게 할 것이다’가 있습니다. 그러나 여기서는 그릇과 포도주를 비우는 이미지가 더 강합니다.
    reason: alternative_reading
  - marker: c
    text: 히브리어는 문자적으로 ‘그들의 항아리들’입니다. 뜻상 ‘그의 항아리들’로 이해하는 해석도 있으나, 본문 표기를 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: לָכֵן הִנֵּה יָמִים בָּאִים
  english_pob_choice: Therefore behold, days are coming
  chosen_korean: 그러므로 보십시오. 날들이 오고 있습니다
  alternatives_korean:
  - 그러므로 보라. 날들이 올 것입니다
  - 그러므로 보십시오. 다가오는 날이 있습니다
  lexicon: HALOT
  rationale: 예언적 전환을 드러내는 인과·주의 환기·미래 공식을 각각 살렸습니다. ‘보십시오’와 ‘날들이 오고 있습니다’는 현대적이면서도 원문의 긴박함을 유지합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언서의 공식 구문을 한국어 공문체로 자연스럽게 옮기되, 주어적 표현인 ‘말씀입니다’로 단정성을 살렸습니다.
- source_word: צֹעִים
  english_pob_choice: pourers
  chosen_korean: 따르는 자들
  alternatives_korean:
  - 붓는 자들
  - 따라 붓는 자들
  - 술을 따르는 자들
  lexicon: HALOT
  rationale: 희귀어의 핵심 이미지를 ‘붓는’ 행위로 잡으면서, 수신자에게 자연스러운 한국어로 풀었습니다. 문맥의 포도주/그릇 이미지에 맞춰 단순한 ‘붓는 자들’보다 다소 구체화했습니다.
- source_word: וְצֵעֻהוּ וְכֵלָיו יָרִיקוּ וְנִבְלֵיהֶם יְנַפֵּצוּ
  english_pob_choice: they will pour him out; they will empty his vessels and smash their jars
  chosen_korean: 그들이 그를 쏟아 내고, 그의 그릇들을 비우며, 그들의 항아리들을 산산이 부술 것입니다
  alternatives_korean:
  - 그를 따라 쏟아 내고, 그의 그릇들을 비우며, 그들의 항아리들을 깨뜨릴 것입니다
  - 그를 비워 내고, 그의 그릇들을 비우며, 그들의 항아리들을 부술 것입니다
  lexicon: HALOT
  rationale: 수동적/파괴적 포도주 용기 이미지를 따라 ‘쏟아 내다, 비우다, 산산이 부수다’의 연쇄를 유지했습니다. POB의 ‘their jars’도 본문 읽기를 따라 그대로 살렸습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. 예언자적 직접 발화의 권위를 보존합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 예언 공식의 한국어 어조
  chosen_reading: ‘야훼의 말씀입니다’와 존대형 서술
  alternative_readings:
  - ‘야훼께서 말씀하십니다’
  - ‘야훼의 선언입니다’
  rationale: 본문이 신탁 전달 형식이므로 한국어에서도 선포체를 유지했습니다. 독자에게 직접 들려주는 예언의 긴급성을 살리기 위해 합쇼체를 일관되게 사용했습니다.
  doctrine_reference: Jeremiah prophetic oracle register
