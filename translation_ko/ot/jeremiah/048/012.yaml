  naturalness: ‘그러므로 보십시오, 날들이 오고 있습니다’는 현대 표준어 합쇼체에서 자연스럽고 예언적 주의 환기 기능을 보존합니다. ‘쏟아 붓는 자들’은 문맥상 명확하며, 문장 전체도 병렬 동작을 자연스럽게 전달합니다.
  terminology: 야훼는 제공된 프로젝트 방침과 일치합니다. ‘그릇들’과 ‘항아리들’은 원문의 용기 이미지를 구별하여 보존합니다. 각주 표지는 해당 어구 바로 뒤에 배치하여 독자가 난해어, 대안 독법, 대명사 문제를 정확히 확인할 수 있게 해야 합니다.
