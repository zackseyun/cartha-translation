  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 각 지명 앞에 ‘그리고/또한 ~을 향해’에 해당하는 표현을 반복해 심판 선언의 리듬을 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: and against
  chosen_korean: 그리고 …을 치겠습니다
  alternatives_korean:
  - 그리고 …을 향해
  - 그리고 …에 대하여
  lexicon: HALOT
  rationale: 문맥이 심판 선언이므로 עַל의 방향성을 한국어에서는 ‘치다’로 자연스럽게 풀어 공격·대적의 뜻을 드러냈습니다. 첫 도시 이름 앞의 접속은 ‘그리고’로 옮겨 히브리어의 반복 구조를 살렸습니다.
- source_word: קִרְיָתַיִם
  english_pob_choice: Kiriathaim
  chosen_korean: 기랴타임
  alternatives_korean:
  - 키랴타임
  - 기랴따임
  lexicon: HALOT
  rationale: 지명은 음역이 원칙이므로 영어 표기를 중개하지 않고 히브리어 소리를 반영해 옮겼습니다. 현대 한국어 성서 표기에서 무리 없는 외래어식 음역을 택했습니다.
- source_word: בֵּית גָּמוּל
  english_pob_choice: Beth-gamul
  chosen_korean: 벳-가물
  alternatives_korean:
  - 벧-가물
  - 벳 가물
  - 벧가물
  lexicon: HALOT
  rationale: ‘베이트/벳’으로 시작하는 고유 지명은 한국어 성서 음역에서 ‘벳-’ 형태가 읽기와 인식 면에서 안정적입니다. 접미 요소는 번역하지 않고 음역해 지명성을 유지했습니다.
- source_word: בֵּית מְעוֹן
  english_pob_choice: Beth-meon
  chosen_korean: 벳-므온
  alternatives_korean:
  - 벧-므온
  - 벳 메온
  - 벧메온
  lexicon: HALOT
  rationale: 앞의 지명과 같은 원리로, 합성 지명 전체를 음역해 본문의 병렬성과 고유명사성을 보존했습니다.
theological_decisions:
- issue: 심판 오라클의 반복 구조
  chosen_reading: 각 도시 앞의 접속과 동사를 통해 연속되는 심판 선언으로 읽고, 한국어에서도 ‘그리고 …을 치겠습니다’로 반복성을 드러냈습니다.
  alternative_readings:
  - 그리고 …에 임하겠습니다
  - …을 대적하겠습니다
  rationale: 본문은 단순한 지리 표지가 아니라 예언적 심판 선포입니다. 한국어에서는 ‘치다’가 직접적인 공격·심판의 뉘앙스를 가장 분명하게 전달합니다.
  doctrine_reference: 예언서의 신적 심판 선언
- issue: 지명 음역의 범위
  chosen_reading: 지명은 번역어(‘가물의 집’, ‘메온의 집’)로 풀지 않고 음역을 유지했습니다.
  alternative_readings:
  - 가물의 집
  - 메온의 집
  rationale: ‘벳/베이트’가 ‘집’을 뜻하지만, 여기서는 실제 정착지명으로 기능하므로 번역하면 고유명사 인식이 약해집니다. POB의 지명 처리 원칙에 따라 음역이 더 स्रोत-충실합니다.
  doctrine_reference: 고유명사 처리 원칙
