  lexicon: HALOT
  rationale: ‘베이트/벳’으로 시작하는 고유 지명은 한국어 성서 음역에서 ‘벳-’ 형태가 읽기와 인식 면에서 안정적입니다. 접미 요소는 번역하지 않고 음역해 지명성을 유지했습니다.
- source_word: בֵּית מְעוֹן
  english_pob_choice: Beth-meon
  chosen_korean: 벳-므온
  alternatives_korean:
  - 벧-므온
  - 벳 메온
  - 벧메온
  lexicon: HALOT
  rationale: 앞의 지명과 같은 원리로, 합성 지명 전체를 음역해 본문의 병렬성과 고유명사성을 보존했습니다.
theological_decisions:
- issue: 심판 오라클의 반복 구조
  chosen_reading: 각 도시 앞의 접속과 동사를 통해 연속되는 심판 선언으로 읽고, 한국어에서도 ‘그리고 …을 치겠습니다’로 반복성을 드러냈습니다.
  alternative_readings:
  - 그리고 …에 임하겠습니다
  - …을 대적하겠습니다
  rationale: 본문은 단순한 지리 표지가 아니라 예언적 심판 선포입니다. 한국어에서는 ‘치다’가 직접적인 공격·심판의 뉘앙스를 가장 분명하게 전달합니다.
  doctrine_reference: 예언서의 신적 심판 선언
- issue: 지명 음역의 범위
  chosen_reading: 지명은 번역어(‘가물의 집’, ‘메온의 집’)로 풀지 않고 음역을 유지했습니다.
  alternative_readings:
  - 가물의 집
  - 메온의 집
  rationale: ‘벳/베이트’가 ‘집’을 뜻하지만, 여기서는 실제 정착지명으로 기능하므로 번역하면 고유명사 인식이 약해집니다. POB의 지명 처리 원칙에 따라 음역이 더 स्रोत-충실합니다.
  doctrine_reference: 고유명사 처리 원칙
