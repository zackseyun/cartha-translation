lexical_decisions:
- source_word: וְ/עַל
  english_pob_choice: and against
  chosen_korean: 그리고 …을 치겠습니다
  alternatives_korean:
  - 그리고 …을 향해
  - 그리고 …에 대하여
  lexicon: HALOT
  rationale: 문맥이 심판 선언이므로 עַל의 방향성을 한국어에서는 ‘치다’로 자연스럽게 풀어 공격·대적의 뜻을 드러냈습니다. 첫 도시 이름 앞의 접속은 ‘그리고’로 옮겨 히브리어의 반복 구조를 살렸습니다.
- source_word: קִרְיָתַיִם
  english_pob_choice: Kiriathaim
  chosen_korean: 기랴타임
  alternatives_korean:
