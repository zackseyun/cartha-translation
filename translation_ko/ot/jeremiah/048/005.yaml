source:
  edition: WLC
  text: כִּ֚י מַעֲלֵ֣ה ה/לחות בִּ/בְכִ֖י יַֽעֲלֶה בֶּ֑כִי כִּ֚י בְּ/מוֹרַ֣ד חוֹרֹנַ֔יִם צָרֵ֥י צַֽעֲקַת שֶׁ֖בֶר שָׁמֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/005.yaml
  text: For on the ascent of Luhith they go up with weeping[b][a]; for on the descent of Horonaim they have heard the distressing cry of destruction.
  footnotes:
  - marker: a
    text: 'Hebrew repeats the noun ''weeping'' in this line for emphasis: literally, ''with weeping he/one goes up—weeping.'''
    reason: lexical_alternative
  - marker: b
    text: The Hebrew of the second line is difficult. Some understand it more literally as 'the enemies have heard a cry of destruction,' while others construe it as a 'distressing cry of destruction.'
    reason: alternative_reading
translation:
  language: ko
  text: 이는 루히스의 오름길에서 사람들이 울며 올라가기 때문입니다. 이는 호로나임의 내리막에서 그들이 파멸의 고통스러운 부르짖음을 들었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 첫 행에 ‘울음/우는 것’이라는 명사를 반복해 강조합니다. 한국어는 ‘울며’로 옮겨 그 반복 효과를 자연스럽게 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 둘째 행은 난해합니다. 어떤 해석은 ‘원수들이 파멸의 부르짖음을 들었다’로, 다른 해석은 ‘파멸의 고통스러운 부르짖음’으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַעֲלֵה / הַלֻּחוֹת
  english_pob_choice: the ascent of Luhith
  chosen_korean: 루히스의 오름길
  alternatives_korean:
  - 루히스의 상승로
  - 루히스의 산길
  lexicon: HALOT
  rationale: 지명 ‘루히스’를 음역하고, מַעֲלֵה의 지형적 뜻은 ‘오름길’로 옮겨 ‘ascent’의 대비를 살렸습니다.
- source_word: בִּבְכִי ... בֶּכִי
  english_pob_choice: with weeping
  chosen_korean: 울며
  alternatives_korean:
  - 눈물로
  - 울음과 함께
  lexicon: HALOT
  rationale: 히브리어의 반복된 ‘우는 것/울음’은 한국어에서 동사형 ‘울며’가 가장 자연스럽게 반복의 강조를 살립니다.
- source_word: בְּמוֹרַד חוֹרֹנַיִם
  english_pob_choice: on the descent of Horonaim
  chosen_korean: 호로나임의 내리막
  alternatives_korean:
  - 호로나임의 내리막길
  - 호로나임의 내려가는 길
  lexicon: HALOT
  rationale: מוֹרַד의 하향 지형 의미를 ‘내리막’으로 간단히 살려, 앞의 ‘오름길’과 대구를 이루게 했습니다.
- source_word: צָרֵי צַעֲקַת שֶׁבֶר
  english_pob_choice: the distressing cry of destruction
  chosen_korean: 파멸의 고통스러운 부르짖음
  alternatives_korean:
  - 파멸의 처절한 외침
  - 멸망의 애끓는 부르짖음
  lexicon: HALOT
  rationale: צָרֵי를 별도 주어로 두기보다 POB의 해석처럼 ‘부르짖음’을 수식하는 말로 이해해, 문맥상의 비통함과 재난의 의미를 함께 드러냈습니다.
theological_decisions:
- issue: 히브리어 반복과 시적 압축을 한국어에서 어떻게 처리할지
  chosen_reading: 직역식 반복을 그대로 유지하기보다 ‘울며’와 ‘부르짖음’으로 자연스럽게 살려, 애곡의 강도를 보존했습니다.
  alternative_readings:
  - ‘울음으로 올라갑니다’처럼 더 직설적으로 반복을 반영
  - ‘울며 울며’처럼 중첩을 보존
  rationale: 시적 평행법은 보존하되 한국어 문장성을 해치지 않도록 조정해야 하므로, 반복의 효과를 의미적으로 전달하는 쪽이 적절합니다.
  doctrine_reference: 시가/예언 문체의 평행법과 수사적 반복
- issue: צָרֵי의 난해한 구문 처리
  chosen_reading: 별도의 ‘적들’ 주어를 세우지 않고, ‘파멸의 고통스러운 부르짖음’으로 이해했습니다.
  alternative_readings:
  - ‘원수들이 파멸의 부르짖음을 들었습니다’
  - ‘환난의 부르짖음을 들었습니다’
  rationale: 영어 POB의 주석처럼 히브리어는 난해하므로, 문맥과 병행구를 따라 ‘부르짖음’의 성격을 규정하는 해석을 택했습니다.
  doctrine_reference: 예언서 본문 해석의 문맥 우선 원칙
