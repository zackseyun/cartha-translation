  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַל כֵּ֞ן לִבִּ֤/י לְ/מוֹאָב֙ כַּ/חֲלִלִ֣ים יֶהֱמֶ֔ה וְ/לִבִּ/י֙ אֶל אַנְשֵׁ֣י קִֽיר חֶ֔רֶשׂ כַּ/חֲלִילִ֖ים יֶהֱמֶ֑ה עַל כֵּ֛ן יִתְרַ֥ת עָשָׂ֖ה אָבָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/036.yaml
  text: Therefore my heart moans for Moab like flutes, and my heart moans like flutes for the men of Kir-heres, because the abundance he made has perished.
translation:
  language: ko
  text: 그러므로 내 마음이 모압을 위해 피리들처럼 신음하고, 내 마음이 기르-헤레스의 남자들을 위해 피리들처럼 신음합니다. 이는 그가 지은 풍성함이 사라졌기 때문입니다.
  philosophy: formal
lexical_decisions:
- source_word: לִבִּי ... יֶהֱמֶה כַּחֲלִלִים
  english_pob_choice: my heart moans ... like flutes
  chosen_korean: 내 마음이 ... 피리들처럼 신음합니다
  alternatives_korean:
  - 내 마음이 ... 피리 소리처럼 울립니다
  - 내 마음이 ... 피리처럼 탄식합니다
  lexicon: לֵב / כָּלַל־המה
  rationale: 모압과 기르-헤레스에 대한 깊은 애곡을 원문의 반복과 소리 이미지를 살려 ‘신음합니다’로 옮기고, כַּחֲלִלִים은 악기 자체를 분명히 드러내는 ‘피리들처럼’으로 표현했습니다.
- source_word: עַל אַנְשֵׁי קִיר חֶרֶשׂ
  english_pob_choice: for the men of Kir-heres
  chosen_korean: 기르-헤레스의 남자들을 위해
  alternatives_korean:
  - 기르-헤레스 사람들을 위해
  - 기르-헤레스의 사람들을 위해
  lexicon: אַנְשֵׁי
  rationale: אַנְשֵׁי는 문자적으로 ‘남자들’이지만 공동체를 가리키는 집단명사적 용법이므로, 본문의 직설성을 유지하되 한국어에서 자연스럽게 읽히도록 ‘남자들을 위해’로 옮겼습니다.
- source_word: יִתְרַת עָשָׂה אָבָדוּ
  english_pob_choice: because the abundance he made has perished
  chosen_korean: 이는 그가 지은 풍성함이 사라졌기 때문입니다
  alternatives_korean:
  - 이는 그가 만든 풍요가 없어졌기 때문입니다
  - 이는 그가 얻은 풍성함이 사라졌기 때문입니다
  lexicon: עָשָׂה / יִתְרָה
  rationale: PBO의 ‘he made’를 따르되, עָשָׂה를 단순한 소유가 아니라 ‘지어/이룬’ 결과로 보아 ‘지은 풍성함’으로 옮겨 생성·형성의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 예언자적 애가의 정서와 화자의 심정 표현
  chosen_reading: 예레미야의 내적 애통을 직접적으로 드러내는 서술로 유지했습니다.
  alternative_readings:
  - 중립적인 슬픔 표현으로 완화
  - 비유적 표현을 평이하게 정리
  rationale: 원문은 화자의 심장이 모압과 기르-헤레스에 대해 반복적으로 울부짖는 이미지를 통해 심판의 비극성을 드러내므로, 이를 약화하지 않고 유지하는 것이 본문의 정서와 예언적 호소를 보존합니다.
  doctrine_reference: 예언서의 심판-애가 문맥
