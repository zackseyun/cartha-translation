source:
  edition: WLC
  text: אֵ֥יךְ חַ֨תָּה֙ הֵילִ֔ילוּ אֵ֛יךְ הִפְנָה עֹ֥רֶף מוֹאָ֖ב בּ֑וֹשׁ וְ/הָיָ֥ה מוֹאָ֛ב לִ/שְׂחֹ֥ק וְ/לִ/מְחִתָּ֖ה לְ/כָל סְבִיבָֽי/ו־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/039.yaml
  text: How shattered she is! Wail! How Moab has turned her back in shame! So Moab has become a laughingstock and a horror to all around her[a][b].
  footnotes:
  - marker: a
    text: Or 'a horror' or 'an object of dismay' for 'a terror.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'has turned the back/neck'; the Hebrew idiom expresses retreat or withdrawal in shame.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 얼마나 산산이 부서졌습니까! 울부짖으십시오! 모압이 어떻게 수치를 당한 채 등 돌렸는지 보십시오! 모압은 이제 사방에 있는 모든 이들에게 웃음거리가 되고 공포가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘목/등을 돌리다’라는 뜻이며, 수치와 패퇴를 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: לִמְחִתָּה는 ‘공포’ 외에도 ‘경악거리’, ‘전율’, ‘두려움의 대상’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  english_pob_choice: How
  chosen_korean: 얼마나
  alternatives_korean:
  - 어찌나
  - 아, 얼마나
  lexicon: HALOT
  rationale: 애가(哀歌)적 감탄사로서 놀람과 탄식을 함께 드러내는 표현이므로, 현대 한국어에서도 자연스럽고 감정 강도가 살아 있는 ‘얼마나’로 옮겼습니다.
- source_word: חַתָּה
  english_pob_choice: shattered
  chosen_korean: 산산이 부서졌습니다
  alternatives_korean:
  - 무너졌습니다
  - 깨어졌습니다
  - 산산조각 났습니다
  lexicon: HALOT
  rationale: 국가의 붕괴를 그린 강한 파괴 이미지를 살리기 위해 심리적 ‘낙심’보다 물리적 파손감을 주는 표현을 택했습니다.
- source_word: הֵילִילוּ
  english_pob_choice: Wail
  chosen_korean: 울부짖으십시오
  alternatives_korean:
  - 애곡하십시오
  - 통곡하십시오
  lexicon: HALOT
  rationale: 복수 명령형의 애통한 외침을 살리면서도 현대 합쇼체에 맞게 직접적인 애도 명령으로 옮겼습니다.
- source_word: הִפְנָה עֹרֶף ... בּוֹשׁ
  english_pob_choice: has turned her back in shame
  chosen_korean: 수치를 당한 채 등 돌렸는지
  alternatives_korean:
  - 부끄러움 속에 등을 돌렸는지
  - 수치 속에 돌아섰는지
  lexicon: HALOT
  rationale: ‘등/목을 돌리다’라는 히브리어 관용구를 자연스러운 한국어로 풀되, ‘수치’와 ‘등 돌림’의 결합을 보존하여 패퇴와 굴욕의 이미지를 유지했습니다.
- source_word: לִשְׂחֹק
  english_pob_choice: a laughingstock
  chosen_korean: 웃음거리가
  alternatives_korean:
  - 조롱거리가
  - 비웃음거리가
  lexicon: HALOT
  rationale: ‘비웃음의 대상’이라는 뜻을 현대 한국어에서 가장 직관적으로 전달하는 표현으로 선택했습니다.
- source_word: לִמְחִתָּה
  english_pob_choice: a horror
  chosen_korean: 공포가
  alternatives_korean:
  - 전율이
  - 경악거리가
  - 두려움거리가
  lexicon: HALOT
  rationale: POB가 ‘horror’로 고정한 결과를 따라, 단순한 감정 상태보다 주변 민족들에게 주는 경악과 두려움의 대상을 압축적으로 드러내는 ‘공포’로 옮겼습니다.
theological_decisions:
- issue: 예언문체의 미래형/완료형 처리
  chosen_reading: ‘모압은 이제 … 되었습니다’처럼 이미 성취된 심판의 결과를 현재적 실현으로 진술했습니다.
  alternative_readings:
  - ‘모압은 … 될 것입니다’
  - ‘모압은 … 되었습니다’
  rationale: 히브리어 완료형과 예언적 선언의 효과를 함께 반영하여, 단순한 미래 예고보다 심판이 확정된 상태를 드러내는 현재 완료 감각을 살렸습니다.
  doctrine_reference: 예언적 완료(proleptic perfect)
