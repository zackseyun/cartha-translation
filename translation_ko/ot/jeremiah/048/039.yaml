  to: 어찌 그리 산산이 부서졌습니까! 울부짖으십시오! 모압이 어찌하여 부끄러워하며 등을 돌렸습니까![b] 모압은 주변의 모든 이에게 웃음거리와 경악거리가 되었습니다.[a]
