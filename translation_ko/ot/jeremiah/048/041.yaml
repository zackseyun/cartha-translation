  text: נִלְכְּדָה֙ הַ/קְּרִיּ֔וֹת וְ/הַ/מְּצָד֖וֹת נִתְפָּ֑שָׂה וְֽ֠/הָיָה לֵ֞ב גִּבּוֹרֵ֤י מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא כְּ/לֵ֖ב אִשָּׁ֥ה מְצֵרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/041.yaml
  text: Kerioth has been captured[a], and the strongholds have been seized; and the heart of Moab’s warriors will be on that day like the heart of a woman in labor.
  footnotes:
  - marker: a
    text: Or possibly, “The cities have been captured,” if הַקְּרִיּוֹת is taken as a common noun rather than the place name Kerioth.
    reason: alternative_reading
translation:
  language: ko
  text: 그리욧이 함락되었고, 요새들도 점령되었습니다. 그날 모압의 용사들의 마음은 해산하는 여인의 마음과 같을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, הַקְּרִיּוֹת을 고유명사 Kerioth이 아니라 보통명사로 보면 ‘그 도시들이 함락되었다’로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַקְּרִיּוֹת
  english_pob_choice: Kerioth
  chosen_korean: 그리욧
  alternatives_korean:
  - 그리오트
  - 여러 도시들
  lexicon: HALOT
  rationale: 문맥상 일반 명사보다 모압의 특정 지명 Kerioth로 보는 해석을 따르며, 한국어 음역은 고유명사로 처리했습니다.
- source_word: נִלְכְּדָה
  english_pob_choice: has been captured
  chosen_korean: 함락되었고
  alternatives_korean:
  - 포로가 되었고
  - 점령되었고
  - 사로잡혔고
  lexicon: HALOT
  rationale: 성읍의 군사적 함락을 자연스럽게 드러내는 말로, 수동 완료의 선포적 어조를 살렸습니다.
- source_word: הַמְּצָדוֹת נִתְפָּשָׂה
  english_pob_choice: the strongholds have been seized
  chosen_korean: 요새들도 점령되었습니다
  alternatives_korean:
  - 요새들도 붙잡혔습니다
  - 산성들도 빼앗겼습니다
  lexicon: HALOT
  rationale: מְצָדוֹת의 군사적 의미를 한국어의 ‘요새’로 옮기고, נִתְפָּשָׂה는 ‘점령되었습니다’로 전쟁 맥락의 결과를 분명히 했습니다.
- source_word: לֵב גִּבּוֹרֵי מוֹאָב
  english_pob_choice: the heart of Moab’s warriors
  chosen_korean: 모압의 용사들의 마음
  alternatives_korean:
  - 모압의 용맹한 자들의 마음
  - 모압의 장사들의 마음
  lexicon: HALOT
  rationale: גִּבּוֹרִים은 전투 맥락에서 ‘용사’가 가장 자연스럽고, לֵב는 단순한 감정이 아니라 내적 용기와 두려움을 포괄하는 ‘마음’으로 유지했습니다.
- source_word: כְּלֵב אִשָּׁה מְצֵרָה
  english_pob_choice: like the heart of a woman in labor
  chosen_korean: 해산하는 여인의 마음과 같을 것입니다
  alternatives_korean:
  - 진통하는 여인의 마음과 같을 것입니다
  - 해산의 고통을 겪는 여인의 마음과 같을 것입니다
  lexicon: HALOT
  rationale: מְצֵרָה는 출산의 고통/진통을 가리키는 표현으로 이해하여, 한국어 관용에 맞는 ‘해산하는 여인’으로 옮기되 공포와 고통의 비유를 유지했습니다.
theological_decisions:
- issue: 예언적 완료형의 한국어 시제 처리
  chosen_reading: 앞의 두 동사는 이미 이루어진 사건처럼 ‘함락되었고… 점령되었습니다’로 옮기고, 뒤의 비유는 미래 선언 ‘~것입니다’로 처리했습니다.
  alternative_readings:
  - 모두 현재형 예언으로 옮김
  - 모두 과거형으로 통일
  rationale: 히브리어 예언 시제의 선언적 완료와 후반부의 미래 예고를 한국어에서 자연스럽게 구분해, 심판 선포의 확정성과 진행성을 함께 드러냈습니다.
  doctrine_reference: 예언서의 선포적 완료(선언된 심판의 확정성)
