  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: שֻׁדַּ֤ד מוֹאָב֙ וְ/עָרֶ֣י/הָ עָלָ֔ה וּ/מִבְחַ֥ר בַּֽחוּרָ֖י/ו יָרְד֣וּ לַ/טָּ֑בַח נְאֻ֨ם הַ/מֶּ֔לֶךְ יְהוָ֥ה צְבָא֖וֹת שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/015.yaml
  text: Moab is devastated[a], and her cities have gone up; the choicest of her young men have gone down to the slaughter, declares the King[b], whose name is Yahweh of Armies.
  footnotes:
  - marker: a
    text: Or, 'and one has gone up against her cities'; the Hebrew is terse and may refer to an attacking force advancing against Moab's cities.
    reason: alternative_reading
  - marker: b
    text: 'Traditional English: ''the LORD of hosts.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 모압이 황폐해졌으며[a], 그 성읍들이 올라갔고, 그 젊은 용사들 가운데서 가장 뛰어난 자들이 도살로 내려갔습니다. 왕[b], 곧 그 이름이 야훼 만군이신 분의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 성읍들을 치러 올라갔다’라는 뜻일 수 있습니다. 히브리어가 매우 압축되어 있어 공격하는 무리가 모압의 성읍들 쪽으로 진격하는 장면을 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: '전통적 한국어 성경: ‘만군의 여호와’.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁדַּד
  english_pob_choice: is devastated
  chosen_korean: 황폐해졌으며
  alternatives_korean:
  - 무너졌으며
  - 멸망했으며
  - 약탈당했으며
  lexicon: HALOT
  rationale: פֻּ알형의 수동적 파괴·유린 의미를 살리면서, 현대 한국어에서 자연스럽고 포괄적으로 읽히는 표현을 택했습니다.
- source_word: וְעָרֶיהָ עָלָה
  english_pob_choice: and her cities have gone up
  chosen_korean: 그 성읍들이 올라갔고
  alternatives_korean:
  - 그 성읍들 위로 올라갔고
  - 그 성읍들을 치러 올라갔고
  - 그 성읍들에 맞서 올라갔고
  lexicon: HALOT
  rationale: 히브리어의 압축된 전투 관용을 그대로 드러내되, 한국어에서는 어색한 직역을 피하기 위해 ‘올라갔고’로 보존했습니다. 영어 POB가 남겨 둔 난해성을 과도하게 해소하지 않도록 했습니다.
- source_word: מִבְחַר בַּחוּרָיו
  english_pob_choice: the choicest of her young men
  chosen_korean: 그 젊은 용사들 가운데서 가장 뛰어난 자들
  alternatives_korean:
  - 그 젊은이들 가운데 가장 좋은 자들
  - 그 젊은 남자들 가운데서 선택된 자들
  - 그 젊은 용사들
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘젊은이’보다 전투에 동원되는 최선의 청년층을 가리키므로, 선택된/최상급의 뉘앙스를 살려 ‘가장 뛰어난 자들’로 옮겼습니다.
- source_word: יָרְדוּ לַטָּבַח
  english_pob_choice: have gone down to the slaughter
  chosen_korean: 도살로 내려갔습니다
  alternatives_korean:
  - 도살로 내려갔습니다
  - 도살당하러 내려갔습니다
  - 학살로 내려갔습니다
  lexicon: HALOT
  rationale: ‘내려가다’의 동작 이미지를 유지하면서, טבח의 직접적이고 거친 뜻을 한국어에서 분명히 전달했습니다.
- source_word: יְהוָה צְבָאוֹת
  english_pob_choice: Yahweh of Armies
  chosen_korean: 야훼 만군이신 분
  alternatives_korean:
  - 야훼 만군의 하나님
  - 야훼 만군의 주
  - 만군의 야훼
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 ‘야훼’로, צְבָאוֹת는 전통적 ‘만군’으로 옮기되, 한국어 문장 안에서 자연스러운 서술격 구조를 위해 ‘이신 분’을 보탰습니다.
theological_decisions:
- issue: YHWH의 음역과 예언적 선언 공식
  chosen_reading: ‘야훼’로 고유명을 보존하고, נְאֻם הַמֶּלֶךְ를 ‘왕…의 말씀입니다’로 옮겨 예언 선포의 권위를 드러냈습니다.
  alternative_readings:
  - ‘여호와’로 음역
  - ‘말씀하신다’로 평이하게 처리
  rationale: 본문은 하나님의 개인 이름과 왕적 칭호를 함께 제시하므로, 대체 칭호보다 고유명 보존이 본문의 신학적 밀도를 더 잘 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: הַמֶּלֶךְ의 해석
  chosen_reading: ‘왕’은 일반 왕이 아니라 앞의 야훼를 가리키는 신적 칭호로 읽었습니다.
  alternative_readings:
  - 그 왕
  - 왕
  rationale: 문맥상 ‘야훼 만군이신 분’이 뒤따르므로, ‘왕’을 별도의 지상의 통치자로 읽지 않고 신적 칭호로 처리하는 것이 타당합니다.
  doctrine_reference: 예언서의 신적 칭호 사용 및 본문 문맥
