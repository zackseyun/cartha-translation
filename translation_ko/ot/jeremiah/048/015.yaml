    issue: ‘야훼 만군이신 분’은 יְהוָה צְבָאוֹת의 어순과 관계를 잘못 반영합니다.
    rationale: צְבָאוֹת는 야훼를 수식하는 속격으로, ‘만군의 야훼’가 되어야 합니다. ‘야훼 만군’은 한국어에서 ‘야훼의 군대’ 또는 별개의 명칭처럼 읽힐 수 있습니다.
  - severity: medium
    issue: ‘왕…의 말씀입니다’는 נְאֻם의 선언 공식을 명사구로 바꾸어 화자 표지를 약화합니다.
    rationale: נְאֻם은 예언적 선언 표지이므로 ‘왕께서 선언하십니다’가 현대 합쇼체에서 더 직접적이고 충실합니다.
  - severity: medium
    issue: ‘젊은 용사들’은 בַּחוּרָיו에 없는 군사적 한정을 더합니다.
    rationale: 문맥상 전투 가능한 청년일 가능성은 높지만, 원문의 기본 의미인 ‘젊은이들/청년들’을 유지하는 편이 안전합니다.
  - severity: medium
    issue: ‘도살로 내려갔습니다’는 한국어 결합이 부자연스럽습니다.
    rationale: לַטָּבַח의 살육의 결과·목적을 자연스럽게 나타내기 위해 ‘도살당하러 내려갔습니다’로 옮깁니다.
  - severity: low
    issue: ‘그 성읍들이 올라갔고’는 원문의 난해성을 보존하려 하나 한국어로 다소 돌출됩니다.
