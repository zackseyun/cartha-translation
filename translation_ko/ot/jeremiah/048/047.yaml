base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/047.yaml
  text: Yet I will restore the fortunes of Moab in the latter days[a], declares Yahweh. Thus far is the judgment of Moab.
  footnotes:
  - marker: a
    text: Or 'bring back the captivity of Moab'; the Hebrew idiom can denote restoration from captivity or, more broadly, the restoring of fortunes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 훗날에 모압의 형편을 회복시키겠습니다[a]. 야훼의 말씀입니다. 모압에 대한 심판은 여기까지입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압의 포로 상태를 돌이키겠다’. 이 히브리어 관용구는 포로 상태에서의 회복을 뜻할 수도 있고, 더 넓게는 형편의 회복을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי שְׁבוּת
  english_pob_choice: I will restore the fortunes
  chosen_korean: 포로 상태를 다시 돌려 주겠으며
  alternatives_korean:
  - 복을 회복하겠으며
  - 운명을 회복하겠으며
  - 포로를 다시 데려오겠으며
  lexicon: HALOT
  rationale: 히브리어 관용구 שׁוּב שְׁבוּת는 단순히 ‘포로를 데려오다’보다 ‘상태를 회복하다/돌이키다’는 뜻까지 담을 수 있어, 모압에 대한 회복 약속을 살리면서도 문자적 포로귀환으로만 좁히지 않기 위해 이렇게 옮겼습니다.
- source_word: בְּאַחֲרִית הַיָּמִים
  english_pob_choice: in the latter days
  chosen_korean: 마지막 날들에
  alternatives_korean:
  - 후일에
  - 말일에
  - 장차 오는 날들에
  lexicon: HALOT
  rationale: 종말론적 울림을 유지하면서도 한국어에서 자연스러운 표현으로 옮기기 위해 ‘마지막 날들에’를 택했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  - 야훼의 말씀이니라
  lexicon: HALOT
  rationale: 예언서의 공식 선언문을 현대 한국어 합쇼체로 처리하되, 본문 전통에 맞춰 신적 이름은 ‘야훼’로 유지했습니다.
- source_word: מִשְׁפַּט
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  - 정의
  lexicon: HALOT
  rationale: 여기서는 추상적 ‘의’가 아니라 모압에 대한 예언적 심판 선언이므로 ‘심판’이 가장 직접적입니다.
theological_decisions:
- issue: 모압에 대한 회복 약속의 범위
  chosen_reading: 본문이 말하는 미래의 회복 약속을 그대로 살리되, 그 방식이 역사적 귀환인지 더 넓은 회복인지 단정하지 않았습니다.
  alternative_readings:
  - 단순한 정치적 반전으로 한정
  - 종말론적 민족 구원으로 확대
  rationale: 히브리어는 분명한 회복을 약속하지만, 그 신학적 메커니즘은 본문 자체가 규정하지 않으므로 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 본문이 허용하는 범위를 넘어서지 않기
