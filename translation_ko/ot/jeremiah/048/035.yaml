id: JER.48.35
reference: Jeremiah 48:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִשְׁבַּתִּ֥י לְ/מוֹאָ֖ב נְאֻם יְהוָ֑ה מַעֲלֶ֣ה בָמָ֔ה וּ/מַקְטִ֖יר לֵ/אלֹהָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/035.yaml
  text: And I will put an end in Moab—oracle of Yahweh—to the one who goes up to the high place and burns incense to his god[a].
  footnotes:
  - marker: a
    text: Or, 'And I will cause high-place worship to cease in Moab …' The Hebrew uses singular participles ('the one who goes up … and burns incense'), which may represent worshipers generically.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나는 모압에서 산당에 올라가 그의 신에게 향을 피우는 자가 더는 없게 하겠습니다—야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압에서 산당 예배가 그치게 하겠습니다…’ 히브리어는 단수 분사(‘올라가고 … 향을 피우는 자’)를 사용하므로, 대표적인 예배자를 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  english_pob_choice: I will put an end
  chosen_korean: 끊어 버리겠습니다
  alternatives_korean:
  - 그치게 하겠습니다
  - 끝내겠습니다
  - 사라지게 하겠습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서, 현대 한국어에서 자연스럽고 강한 종결 표현으로 ‘끊어 버리겠습니다’를 택했습니다.
- source_word: לְמוֹאָב
  english_pob_choice: in Moab
  chosen_korean: 모압에서
  alternatives_korean:
  - 모압 안에서
  - 모압에
  lexicon: HALOT
  rationale: 문맥상 끊어질 영역이 모압 내부이므로, 장소 범위를 드러내는 ‘모압에서’가 가장 분명합니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: oracle of Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼의 신탁입니다
  - 야훼의 말씀이라고 하십니다
  lexicon: HALOT
  rationale: 예언 공식의 명사적 격식을 살리되, 한국어 본문에서는 자연스럽게 들리는 종결 표현으로 옮겼습니다. ‘야훼’는 본 프로젝트의 יְהוָה 기본 대응어를 따릅니다.
- source_word: מַעֲלֶה בָמָה
  english_pob_choice: the one who goes up to the high place
  chosen_korean: 산당으로 올라가고
  alternatives_korean:
  - 산당에 올라가고
  - 높은 곳으로 올라가고
  lexicon: HALOT
  rationale: 단순히 ‘올라가는 자’로만 두기보다, 산당 숭배의 행위를 드러내기 위해 동작과 대상을 함께 살렸습니다. ‘산당’은 בָּמָה의 표준적 문화-종교 대응어입니다.
- source_word: וּמַקְטִיר לֵאלֹהָיו
  english_pob_choice: and burns incense to his god
  chosen_korean: 그의 신에게 향을 피우는 자를
  alternatives_korean:
  - 그의 신에게 분향하는 자를
  - 그의 신에게 향을 올리는 자를
  lexicon: HALOT
  rationale: קטר의 제의적 의미를 한국어 성경 독자에게 분명하게 전달하는 표현으로 ‘향을 피우다’를 선택했습니다. singular participle의 대표적 인물을 한국어에서도 ‘자’로 유지했습니다.
theological_decisions:
- issue: 예언 공식에서 여호와의 이름을 어떻게 표기할지
  chosen_reading: 본문에는 ‘야훼’를 사용하고, 예언 선언은 ‘야훼의 말씀입니다’로 옮겼습니다.
  alternative_readings:
  - 여호와의 말씀입니다
  - 주님의 말씀입니다
  rationale: 히브리어 본문이 יְהוָה를 직접 사용하므로, 이름 자체를 보존하는 프로젝트 원칙에 따라 ‘야훼’를 택했습니다. 예언 공식의 권위를 유지하면서도 현대 한국어 문장에 자연스럽게 맞춥니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 단수 분사구를 추상명사로 바꿀지 여부
  chosen_reading: ‘산당으로 올라가고 그의 신에게 향을 피우는 자’라는 대표적 단수 인물을 유지했습니다.
  alternative_readings:
  - 모압의 산당 예배를 끊어 버리겠습니다
  - 산당 제의를 끊어 버리겠습니다
  rationale: 히브리어는 단수 분사를 사용해 대표적 예배자를 그리므로, 추상화하지 않고 인격적·행위적 이미지를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §§3, 4, 5
