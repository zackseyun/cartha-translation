  text: פַּ֥חַד וָ/פַ֖חַת וָ/פָ֑ח עָלֶ֛י/ךָ יוֹשֵׁ֥ב מוֹאָ֖ב נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/043.yaml
  text: Terror and the pit and the snare are upon you[a], inhabitant of Moab[b], declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'Fear and the pit and the snare are upon you.'
    reason: lexical_alternative
  - marker: b
    text: 'This triad echoes Isaiah 24:17: ''terror, pit, and snare.'''
    reason: cross_reference
translation:
  language: ko
  text: 두려움과 구덩이와 덫이 네 위에 있나니, 모압의 주민아, 야훼의 말씀입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘두려움과 구덩이와 덫이 네 위에 있습니다.’
    reason: lexical_alternative
  - marker: b
    text: 이 삼중 표현은 이사야 24:17의 ‘두려움, 구덩이, 덫’을 떠올리게 합니다.
    reason: cross_reference
lexical_decisions:
- source_word: פַּחַד
  english_pob_choice: Terror
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 전율
  lexicon: HALOT
  rationale: 문맥상 심판이 임하는 압도적 두려움을 가리키므로, 영어 POB의 'Terror'에 대응하되 한국어에서는 자연스러운 표준어 '두려움'으로 옮겼습니다.
- source_word: פַחַת
  english_pob_choice: the pit
  chosen_korean: 구덩이
  alternatives_korean:
  - 웅덩이
  - 구렁
  lexicon: HALOT
  rationale: 히브리어의 고정된 심판 공식에서 함정성 있는 'pit'을 뜻하므로, 현대 한국어에서 가장 분명한 '구덩이'를 택했습니다.
- source_word: פָח
  english_pob_choice: the snare
  chosen_korean: 덫
  alternatives_korean:
  - 올무
  - 함정
  lexicon: HALOT
  rationale: 앞의 '구덩이'와 구별되는 포획 도구를 가리키므로, 한국어에서도 짧고 대구가 살아 있는 '덫'으로 옮겼습니다.
- source_word: יוֹשֵׁב מוֹאָב
  english_pob_choice: inhabitant of Moab
  chosen_korean: 모압의 주민아
  alternatives_korean:
  - 모압에 거주하는 자여
  - 모압의 거주자여
  lexicon: HALOT
  rationale: 단수 분사가 대표적 호격으로 쓰인 구조를 살려, 대상 집단을 대표하는 직접 호칭으로 '모압의 주민아'를 사용했습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선포입니다
  lexicon: HALOT
  rationale: 예언 공식의 엄숙함을 살리면서도 합쇼체에 맞게 자연스럽게 마무리하기 위해 '야훼의 말씀입니다'로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יהוה를 '야훼'로 음역했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기적 고유명사로서의 하나님의 이름을 제목어 '주'로 대체하지 않고, 음역 형태 '야훼'를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
