id: JER.48.34
reference: Jeremiah 48:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: מִ/זַּעֲקַ֨ת חֶשְׁבּ֜וֹן עַד אֶלְעָלֵ֗ה עַד יַ֨הַץ֙ נָתְנ֣וּ קוֹלָ֔/ם מִ/צֹּ֨עַר֙ עַד חֹ֣רֹנַ֔יִם עֶגְלַ֖ת שְׁלִֽשִׁיָּ֑ה כִּ֚י גַּם מֵ֣י נִמְרִ֔ים לִ/מְשַׁמּ֖וֹת יִהְיֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/034.yaml
  text: From the cry of Heshbon to Elealeh[a], as far as Jahaz, they raise their voice; from Zoar to Horonaim, to Eglath-shelishiyah. For even the waters of Nimrim will become desolations.
  footnotes:
  - marker: a
    text: Or possibly, 'a three-year-old heifer.' The Hebrew phrase עֶגְלַת שְׁלִשִׁיָּה may be understood descriptively, but here it is likely a place name in the sequence of locations.
    reason: lexical_alternative
translation:
  language: ko
  text: 헤스본의 부르짖음에서 엘르알레까지, 야핫까지 그들의 소리가 들립니다. 소알에서 호로나임까지, 에글랏-셀리시야까지입니다. 참으로 님림의 물마저도 황폐함이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세 살 된 암송아지’로도 이해할 수 있습니다. 히브리어 표현 עֶגְלַת שְׁלִשִׁיָּה는 설명적 표현일 수 있지만, 여기서는 지명으로 보는 것이 더 가능성이 높습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזַּעֲקַת
  english_pob_choice: From the cry of
  chosen_korean: …의 부르짖음에서
  alternatives_korean:
  - …의 외침에서
  - …의 탄식에서
  lexicon: HALOT
  rationale: 지명들을 따라 확장되는 시적 문맥에서 זַעֲקָה는 단순한 소리보다 고통의 부르짖음을 가리키므로, 한국어는 자연스러운 ‘부르짖음’으로 옮겼습니다.
- source_word: נָתְנוּ קוֹלָם
  english_pob_choice: they raise their voice
  chosen_korean: 그들의 소리가 들립니다
  alternatives_korean:
  - 그들이 소리를 높입니다
  - 그들이 목소리를 냅니다
  - 그들이 외칩니다
  lexicon: HALOT
  rationale: 직역하면 ‘그들의 소리를 주다’이지만, 시적 맥락에서 거리 전체에 울려 퍼지는 소리를 가리키므로 ‘들립니다’로 소리의 확산을 살렸습니다.
- source_word: עֶגְלַת שְׁלִשִׁיָּה
  english_pob_choice: Eglath-shelishiyah
  chosen_korean: 에글랏-셀리시야
  alternatives_korean:
  - 세 살 된 암송아지
  - 에글랏-세째
  lexicon: HALOT
  rationale: 여기서는 지명으로 읽는 것이 문맥상 가장 가능성이 높아 음역을 본문에 두었고, 동물 표현 가능성은 주석으로 보존하는 편이 더 정확합니다.
- source_word: לִמְשַׁמּוֹת יִהְיוּ
  english_pob_choice: will become desolations
  chosen_korean: 황폐함이 될 것입니다
  alternatives_korean:
  - 황폐한 곳이 될 것입니다
  - 폐허가 될 것입니다
  - 황무지가 될 것입니다
  lexicon: HALOT
  rationale: מְשַׁמּוֹת의 결과 상태를 한국어로 자연스럽게 드러내기 위해 ‘~이 될 것입니다’ 구조를 유지하되, 복수 뉘앙스는 한국어에서 묶어 ‘황폐함’으로 옮겼습니다.
theological_decisions:
- issue: 시적 지명 열거와 ‘소리가 들립니다’의 처리
  chosen_reading: 본문은 모압 전역에 퍼지는 애가를 묘사하는 시적 진술로 읽고, 동작을 ‘들립니다’로 옮겨 소리의 확산과 심판의 분위기를 드러냈습니다.
  alternative_readings:
  - 각 지명마다 누군가가 실제로 소리를 높인다는 직역
  - ‘그들의 목소리를 냈습니다’처럼 더 문자적인 표현
  rationale: 히브리어의 공간적 확장과 애가의 울림을 한국어에서 자연스럽게 재현하기 위한 선택입니다.
  doctrine_reference: 예언시의 수사와 심판 선언의 문학적 형식
