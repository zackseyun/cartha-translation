  text: שָׁמַ֥עְנוּ גְאוֹן מוֹאָ֖ב גֵּאֶ֣ה מְאֹ֑ד גָּבְה֧/וֹ וּ/גְאוֹנ֛/וֹ וְ/גַאֲוָת֖/וֹ וְ/רֻ֥ם לִבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/029.yaml
  text: We have heard of the pride of Moab—he is exceedingly proud—of his haughtiness[a], his pride, his arrogance, and the loftiness of his heart.
  footnotes:
  - marker: a
    text: Or 'We heard of the pride of Moab—very proud indeed—his loftiness, his pride, his arrogance, and his proud heart.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리는 모압의 교만을 들었습니다—그는 매우 교만합니다—곧 그의 높음, 그의 교만, 그의 오만, 그리고 그의 마음의 높음입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리는 모압의 교만을 들었습니다—그는 매우 교만합니다—그의 높음, 그의 교만, 그의 오만, 그리고 그의 교만한 마음입니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְנוּ
  english_pob_choice: We have heard
  chosen_korean: 우리는 들었습니다
  alternatives_korean:
  - 우리는 들었습니다
  - 우리가 들었습니다
  lexicon: HALOT
  rationale: 완결된 보고를 나타내는 완료형을 살리면서도, 예언적 선언에 맞는 자연스러운 한국어 과거 경험 표현으로 옮겼습니다.
- source_word: גְאוֹן
  english_pob_choice: pride
  chosen_korean: 교만
  alternatives_korean:
  - 자랑
  - 위엄
  lexicon: HALOT
  rationale: 모압에 대한 심판 문맥이므로 중립적 ‘위엄’이 아니라 부정적 의미의 ‘교만’이 본문 취지에 맞습니다.
- source_word: גָּבְהוֹ
  english_pob_choice: his haughtiness
  chosen_korean: 그의 높음
  alternatives_korean:
  - 그의 높아짐
  - 그의 거만함
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘높음’을 살려 반복되는 자만의 목록을 보존했습니다. 한국어에서는 다소 추상적이지만 원문의 고양 이미지와 대응됩니다.
- source_word: וּגְאוֹנוֹ
  english_pob_choice: his pride
  chosen_korean: 그의 교만
  alternatives_korean:
  - 그의 자만
  - 그의 위세
  lexicon: HALOT
  rationale: 앞의 גאון과 같은 어근 계열의 반복을 살리기 위해 동일 계열의 ‘교만’을 유지했습니다.
- source_word: וְגַאֲוָתוֹ
  english_pob_choice: his arrogance
  chosen_korean: 그의 오만
  alternatives_korean:
  - 그의 자만심
  - 그의 건방짐
  lexicon: HALOT
  rationale: 누적되는 동의어 목록의 리듬을 보존하면서, 한국어에서 ‘교만’과 구별되는 다음 단계의 부정적 태도로 ‘오만’을 택했습니다.
- source_word: וְרֻם לִבּוֹ
  english_pob_choice: the loftiness of his heart
  chosen_korean: 그의 마음의 높음
  alternatives_korean:
  - 그의 마음의 교만
  - 그의 높은 마음
  lexicon: HALOT
  rationale: ‘마음’(לב)과 ‘높음’(רום)의 비유를 그대로 살려, 도덕적 해석을 과하게 덧씌우지 않고 원문의 심장-고양 은유를 보존했습니다.
theological_decisions:
- issue: 자기고양의 누적 표현을 어떻게 처리할지
  chosen_reading: 동의어들을 압축하지 않고 반복 구조를 유지했습니다.
  alternative_readings:
  - ‘교만’을 한 번만 쓰고 나머지를 일반화함
  - ‘오만함’으로 통합함
  rationale: 본문은 모압의 자기고양을 다중 어휘로 겹쳐 강조하므로, 한국어에서도 각 항목을 분리해 누적된 비난의 수위를 드러내는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: 예언서의 수사학적 증폭과 심판 선언의 강조
- issue: ‘마음’의 표현을 도덕화할지 여부
  chosen_reading: ‘마음의 높음’으로 유지했습니다.
  alternative_readings:
  - ‘교만한 마음’
  - ‘마음의 오만함’
  rationale: 원문은 לב를 통해 내적 중심을 가리키지만, 명시적으로 ‘교만한’이라고 해석어를 덧붙이지 않고 높이-은유를 보존하는 것이 더 직접적입니다.
  doctrine_reference: 히브리어 인간 이해에서의 לב(마음/내면)
