  rationale: 직역에 가깝게 ‘높음’을 살려 반복되는 자만의 목록을 보존했습니다. 한국어에서는 다소 추상적이지만 원문의 고양 이미지와 대응됩니다.
- source_word: וּגְאוֹנוֹ
  english_pob_choice: his pride
  chosen_korean: 그의 교만
  alternatives_korean:
  - 그의 자만
  - 그의 위세
  lexicon: HALOT
  rationale: 앞의 גאון과 같은 어근 계열의 반복을 살리기 위해 동일 계열의 ‘교만’을 유지했습니다.
- source_word: וְגַאֲוָתוֹ
  english_pob_choice: his arrogance
  chosen_korean: 그의 오만
  alternatives_korean:
  - 그의 자만심
  - 그의 건방짐
  lexicon: HALOT
  rationale: 누적되는 동의어 목록의 리듬을 보존하면서, 한국어에서 ‘교만’과 구별되는 다음 단계의 부정적 태도로 ‘오만’을 택했습니다.
- source_word: וְרֻם לִבּוֹ
  english_pob_choice: the loftiness of his heart
  chosen_korean: 그의 마음의 높음
  alternatives_korean:
  - 그의 마음의 교만
  - 그의 높은 마음
  lexicon: HALOT
  rationale: ‘마음’(לב)과 ‘높음’(רום)의 비유를 그대로 살려, 도덕적 해석을 과하게 덧씌우지 않고 원문의 심장-고양 은유를 보존했습니다.
theological_decisions:
- issue: 자기고양의 누적 표현을 어떻게 처리할지
  chosen_reading: 동의어들을 압축하지 않고 반복 구조를 유지했습니다.
  alternative_readings:
  - ‘교만’을 한 번만 쓰고 나머지를 일반화함
  - ‘오만함’으로 통합함
  rationale: 본문은 모압의 자기고양을 다중 어휘로 겹쳐 강조하므로, 한국어에서도 각 항목을 분리해 누적된 비난의 수위를 드러내는 것이 원문 충실도에 더 적합합니다.
  doctrine_reference: 예언서의 수사학적 증폭과 심판 선언의 강조
- issue: ‘마음’의 표현을 도덕화할지 여부
  chosen_reading: ‘마음의 높음’으로 유지했습니다.
  alternative_readings:
  - ‘교만한 마음’
  - ‘마음의 오만함’
  rationale: 원문은 לב를 통해 내적 중심을 가리키지만, 명시적으로 ‘교만한’이라고 해석어를 덧붙이지 않고 높이-은유를 보존하는 것이 더 직접적입니다.
  doctrine_reference: 히브리어 인간 이해에서의 לב(마음/내면)
