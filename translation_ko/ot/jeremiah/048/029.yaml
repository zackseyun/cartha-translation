- from: 우리는 모압의 교만을 들었습니다—그는 매우 교만합니다—곧 그의 높음, 그의 교만, 그의 오만, 그리고 그의 마음의 높음입니다.[a]
  to: 우리는 매우 교만한 모압의 교만, 곧 그의 거만함[a]과 그의 교만과 그의 오만과 그의 마음의 높음에 대하여 들었습니다.
  rationale: ‘그의 높음’을 문맥상 더 정확하고 자연스러운 ‘그의 거만함’으로 고치고, 모압의 교만을 반복적으로 열거하는 히브리어 구문을 한국어의 병렬 명사구로 옮겼습니다. 마지막 항목은 ‘마음의 높음’으로 유지하여 רֻם לִבּוֹ의 심장/마음 및 높이 은유를 보존했습니다. 각주도 해당 어휘 바로 뒤에 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:52Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복적 교만 어휘와 ‘마음의 높음’ 은유를 대체로 충실히 보존했습니다. 다만 גָּבְהוֹ는 이 문맥에서 단순한 물리적 ‘높음’보다는 거만한 자기고양을 가리키므로 ‘거만함’이 더 정확합니다. 또한 원문의 나열 구조는 ‘곧 …입니다’라는 한국어 서술문보다 명사구 나열로 처리하는 편이 낫습니다.
  naturalness: 초안의 ‘그는 매우 교만합니다—곧 그의 높음 …입니다’는 지시 대상과 문장 종결이 어색하고, ‘그의 높음’도 현대 한국어에서 부자연스럽습니다. 모압을 직접 다시 언급하고 나열을 매끄럽게 연결하도록 고쳤습니다.
  terminology: ‘교만’, ‘거만함’, ‘오만’은 원문의 누적된 비난 어휘를 자연스럽게 드러냅니다. רֻם לִבּוֹ의 ‘마음의 높음’은 다소 문어적이지만, ‘마음’과 높이의 은유를 보존하는 안전한 표현입니다.
