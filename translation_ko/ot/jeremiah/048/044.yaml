- from: 두려움에서 도망하는 자는 함정에 떨어지고, 함정에서 올라오는 자는 올무에 걸릴 것입니다. 이는 내가 모압 위에, 그들의 벌의 해를 가져올 것이기 때문입니다. 야훼의 말씀입니다.[a]
  to: 공포를 피해 달아나는 자는 구덩이에 빠지고, 구덩이에서 올라오는 자는 올무에 걸릴 것입니다. 내가 모압에 그들을 벌할 해[a]를 닥치게 할 것이기 때문입니다. 야훼의 말씀입니다.
  rationale: 구덩이와 올무를 구별하여 원문의 재난 비유를 보존하고, 심판 문맥의 פְּקֻדָּה를 자연스러운 한국어로 옮겼습니다. 동시에 ‘찾아오심’ 및 ‘결산’이라는 더 넓은 의미 가능성은 각주로 남겼습니다. 야훼의 선언 공식과 미래의 심판 어조는 유지했습니다.
