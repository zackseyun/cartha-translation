  source_fidelity: 원문의 세 가지 재난 이미지(공포, 구덩이, 올무)와 분사형의 일반적 진술은 대체로 반영되어 있습니다. 그러나 פַּחַת는 일반적인 ‘함정’보다 ‘구덩이’로 옮겨야 뒤의 פַּח ‘올무’와 구별됩니다. 또한 ‘그들의 벌의 해’는 한국어로 부자연스럽고, 모압을 여성 단수로 가리킨 뒤 그 주민들을 복수로 가리키는 원문의 관계를 더 분명히 드러낼 수 있습니다.
  naturalness: ‘두려움에서 도망하는’과 ‘그들의 벌의 해를 가져오다’는 다소 직역투입니다. ‘공포를 피해 달아나는’, ‘그들을 벌할 해를 닥치게 하다’가 현대 표준 한국어 합쇼체에서 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두는 것이 적절합니다.
  terminology: ‘야훼’, ‘모압’, ‘올무’는 적절합니다. פַּחַת/פַּח의 구별을 위해 각각 ‘구덩이/올무’로 통일합니다. פְּקֻדָּה는 문맥상 ‘벌할 해’로 번역하되, ‘찾아오심’과 ‘결산’의 가능성은 각주에 보존합니다.
