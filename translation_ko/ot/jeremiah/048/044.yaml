base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/044.yaml
  text: He who flees from the terror will fall into the pit[a], and he who comes up from the pit will be caught in the snare; for I will bring upon her, upon Moab, the year of their punishment, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'the year of their visitation' or 'the year of their reckoning.'
    reason: lexical_alternative
translation:
  language: ko
  text: 공포를 피해 달아나는 자는 구덩이에 빠지고, 구덩이에서 올라오는 자는 올무에 걸릴 것입니다. 내가 모압에 그들을 벌할 해[a]를 닥치게 할 것이기 때문입니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 찾아오실 해’ 또는 ‘그들을 결산하실 해’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הניס
  english_pob_choice: he who flees
  chosen_korean: 도망하는 자
  alternatives_korean:
  - 피하는 자
  - 달아나는 자
  lexicon: HALOT
  rationale: 분사적 일반주어를 한국어에서 자연스럽게 살리기 위해 ‘도망하는 자’로 옮겼습니다.
- source_word: הפחד
  english_pob_choice: the terror
  chosen_korean: 두려움
  alternatives_korean:
  - 공포
  - 떨림
  lexicon: HALOT
  rationale: 문맥상 심판의 압박을 가리키므로 ‘두려움’이 가장 자연스럽고, 한국어 독자가 즉시 이해할 수 있습니다.
- source_word: הפחת / בפח
  english_pob_choice: the pit / the snare
  chosen_korean: 함정 / 올무
  alternatives_korean:
  - 구덩이 / 덫
  - 웅덩이 / 덫
  lexicon: HALOT
  rationale: 반복되는 함정 이미지를 살리면서도 서로 다른 두 장치를 구분하기 위해 ‘함정’과 ‘올무’를 대응시켰습니다.
- source_word: שנת פקדתם
  english_pob_choice: the year of their punishment
  chosen_korean: 그들의 벌의 해
  alternatives_korean:
  - 그들의 징벌의 해
  - 그들의 벌하심의 해
  - 그들의 방문의 해
  lexicon: HALOT
  rationale: 심판 문맥에서 פְּקֻדָּה의 징벌적 의미를 드러내되, 원문의 시간 표현인 ‘해’를 그대로 유지했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 여호와의 언약 নাম을 직접 사용하므로, 본 프로젝트 기준에 따라 고유 이름을 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: פְּקֻדָּה의 의미 범위
  chosen_reading: 벌
  alternative_readings:
  - 방문
  - 계산
  - 징벌
  rationale: 직전 절부터 이어지는 모압 심판 예언이므로, ‘방문’의 넓은 의미를 문맥상 징벌로 특정해 읽었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
