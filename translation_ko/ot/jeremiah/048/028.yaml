id: JER.48.28
reference: Jeremiah 48:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עִזְב֤וּ עָרִים֙ וְ/שִׁכְנ֣וּ בַּ/סֶּ֔לַע יֹשְׁבֵ֖י מוֹאָ֑ב וִֽ/הְי֣וּ כְ/יוֹנָ֔ה תְּקַנֵּ֖ן בְּ/עֶבְרֵ֥י פִי פָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/028.yaml
  text: Leave the cities and dwell in the rock[a], inhabitants of Moab, and be like a dove that nests on the sides of the mouth of a pit.
  footnotes:
  - marker: a
    text: Or 'a trap-pit' or 'pitfall'; the Hebrew term can carry the sense of a pit used as a trap, heightening the image of precarious refuge.
    reason: lexical_alternative
translation:
  language: ko
  text: 도시들을 버리고 바위 속에 거주하십시오. 모압의 주민들아, 구덩이의 입 가장자리에서 둥지를 트는 비둘기처럼 되십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘함정 구덩이’나 ‘함정’; 히브리어는 위험한 피난처를 암시하는 구덩이의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִזְבוּ
  english_pob_choice: Leave
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 버리십시오
  lexicon: HALOT
  rationale: 도시를 떠나라는 급박한 명령을 자연스러운 현대 한국어로 살리기 위해 ‘버리고’를 택했습니다. ‘떠나고’보다 절박함이 더 드러납니다.
- source_word: עָרִים
  english_pob_choice: the cities
  chosen_korean: 도시들을
  alternatives_korean:
  - 성읍들을
  - 읍들을
  lexicon: HALOT
  rationale: 일반적인 복수 명사로서 모압의 거주지들을 가리키므로 ‘도시들’이 가장 명료합니다.
- source_word: בַּסֶּלַע
  english_pob_choice: in the rock
  chosen_korean: 바위 속에
  alternatives_korean:
  - 바위에
  - 바위 틈에
  - 암석 속에
  lexicon: HALOT
  rationale: סֶלַע의 물리적 피난처 이미지를 살리되, 뒤의 ‘둥지를 트는’ 이미지와 자연스럽게 맞물리도록 ‘속에’를 사용했습니다.
- source_word: יֹשְׁבֵי מוֹאָב
  english_pob_choice: inhabitants of Moab
  chosen_korean: 모압의 주민들아
  alternatives_korean:
  - 모압 주민들이여
  - 모압의 거주자들아
  lexicon: HALOT
  rationale: 호격으로 직접 부르는 표현이므로 ‘주민들아’로 옮겨 예언적 경고의 직접성을 살렸습니다.
- source_word: כְּיוֹנָה תְּקַנֵּן
  english_pob_choice: like a dove that nests
  chosen_korean: 둥지를 트는 비둘기처럼
  alternatives_korean:
  - 둥지 짓는 비둘기처럼
  - 깃드는 비둘기처럼
  lexicon: HALOT
  rationale: יוֹנָה를 비둘기로 옮기고, תְּקַנֵּן의 둥지 틀기 이미지를 ‘둥지를 트는’으로 살려 동작을 분명히 했습니다.
- source_word: פִי פָּחַת
  english_pob_choice: the mouth of a pit
  chosen_korean: 구덩이의 입
  alternatives_korean:
  - 함정 구덩이의 입
  - 구덩이의 가장자리
  lexicon: HALOT
  rationale: פִי의 직역인 ‘입’을 유지해 비유의 생생함을 살렸고, פָּחַת는 여기서 단순한 구덩이/함정 구덩이의 위험한 개구부를 가리키므로 ‘구덩이의 입’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 명령형과 호격의 긴박한 예언 경고를 한국어에서 어떻게 살릴지
  chosen_reading: 명령형을 유지하고 대상 호칭을 ‘모압의 주민들아’로 직접 처리했습니다.
  alternative_readings:
  - 부드러운 권고형으로 완화
  - 서술형으로 전환
  rationale: 본문은 피난의 시급함을 드러내는 연속 명령이므로, 한국어에서도 명령성을 약화시키지 않는 것이 स्रोत의 의도를 더 잘 전달합니다.
  doctrine_reference: 예언서의 경고문체와 심판 선포의 직접성
- issue: פָּחַת의 함정 뉘앙스를 본문에 본문 내에 얼마나 드러낼지
  chosen_reading: 본문은 ‘구덩이’로 유지하고, 위험성은 문맥과 표현 자체로 전달되게 했습니다.
  alternative_readings:
  - 본문에 ‘함정 구덩이’라고 명시
  - 본문을 ‘함정’으로만 번역
  rationale: 영어 POB도 본문에서는 ‘pit’로 두고 각주에서 함정 가능성을 밝혔으므로, 한국어도 본문은 과잉 해석을 피하고 각주에서 보완하는 편이 균형적입니다.
  doctrine_reference: 소스 구분과 주석 처리의 투명성
