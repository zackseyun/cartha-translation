base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
  footnotes:
  - marker: a
    text: Or 'Moab shall clap/strike with his hands in his vomit.' The Hebrew verb can be understood more literally, but in context the sense 'wallow' best fits the image of drunken disgrace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 취하게 하십시오. 그가 야훼를 대적하여 스스로 높였기 때문입니다. 모압은 자기 토사물 속에서 뒹굴[a] 것이며, 그도 웃음거리가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압이 자기 토사물 속에서 손뼉을 칠 것이다’로도 옮길 수 있습니다. 히브리어 동사는 더 문자적으로 이해될 수 있지만, 문맥에서는 ‘뒹굴다’가 수치와 취함의 이미지를 가장 잘 살립니다.
    reason: lexical_alternative
