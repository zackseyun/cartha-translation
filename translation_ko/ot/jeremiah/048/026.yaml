  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַשְׁכִּירֻ֕/הוּ כִּ֥י עַל יְהוָ֖ה הִגְדִּ֑יל וְ/סָפַ֤ק מוֹאָב֙ בְּ/קִיא֔/וֹ וְ/הָיָ֥ה לִ/שְׂחֹ֖ק גַּם הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/026.yaml
  text: Make him drunk[a], because he has magnified himself against Yahweh; and Moab shall wallow in his vomit, and he too shall become a laughingstock.
  footnotes:
  - marker: a
    text: Or 'Moab shall clap/strike with his hands in his vomit.' The Hebrew verb can be understood more literally, but in context the sense 'wallow' best fits the image of drunken disgrace.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 취하게 하십시오[a]. 그가 야훼를 대적하여 스스로 높였기 때문입니다. 모압은 자기 토사물 속에서 뒹굴 것이며, 그도 웃음거리가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압이 자기 토사물 속에서 손뼉을 칠 것이다’로도 옮길 수 있습니다. 히브리어 동사는 더 문자적으로 이해될 수 있지만, 문맥에서는 ‘뒹굴다’가 수치와 취함의 이미지를 가장 잘 살립니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁכִּירֻהוּ
  english_pob_choice: Make him drunk
  chosen_korean: 그를 취하게 하십시오
  alternatives_korean:
  - 그를 술 취하게 하십시오
  - 그를 술에 취하게 하십시오
  lexicon: HALOT
  rationale: 사역형 명령으로서 심판의 이미지를 살리면서도, 현대 한국어에서 자연스럽고 간결한 표현을 택했습니다.
- source_word: עַל יְהוָה הִגְדִּיל
  english_pob_choice: has magnified himself against Yahweh
  chosen_korean: 야훼를 대적하여 스스로 높였기 때문입니다
  alternatives_korean:
  - 야훼를 거슬러 스스로 높였기 때문입니다
  - 야훼 앞에서 교만했기 때문입니다
  lexicon: HALOT
  rationale: הִגְדִּיל의 ‘스스로 크게 함’이라는 의미와 עַל의 적대성을 함께 살리기 위해 ‘대적하여 스스로 높이다’로 옮겼습니다.
- source_word: וְסָפַק מוֹאָב בְּקִיאוֹ
  english_pob_choice: Moab shall wallow in his vomit
  chosen_korean: 모압은 자기 토사물 속에서 뒹굴 것이며
  alternatives_korean:
  - 모압은 자기 토사물 속에서 칠 것이며
  - 모압은 자기 토사물 속에서 몸부림칠 것이며
  lexicon: HALOT
  rationale: 문맥상 술 취함과 수치의 장면이므로, 문자적 ‘손뼉치다’보다 POB의 해석을 따라 ‘뒹굴다’로 형상화했습니다.
- source_word: לִשְׂחֹק
  english_pob_choice: a laughingstock
  chosen_korean: 웃음거리가 될 것입니다
  alternatives_korean:
  - 조롱거리가 될 것입니다
  - 비웃음거리가 될 것입니다
  lexicon: HALOT
  rationale: 공적 수치와 조롱의 결과 상태를 자연스러운 현대 한국어로 표현했습니다.
theological_decisions:
