translation:
  language: ko
  text: 모압은 수치를 당했습니다. 이는 산산이 부서졌기 때문입니다[c]. 통곡하고 부르짖으십시오[a]! 아르논에서 알리십시오[b]. 모압이 황폐해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘울부짖고 외치십시오!’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아르논 곁에서’ 또는 ‘아르논 안에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모압이 약탈당했습니다’ 또는 ‘황폐하게 되었습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִ֥ישׁ
  english_pob_choice: is put to shame
  chosen_korean: 수치를 당합니다
  alternatives_korean:
  - 부끄러움을 당합니다
  - 수치를 입습니다
