id: JER.48.20
reference: Jeremiah 48:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֹבִ֥ישׁ מוֹאָ֛ב כִּֽי חַ֖תָּה הילילי ו/זעקי הַגִּ֣ידוּ בְ/אַרְנ֔וֹן כִּ֥י שֻׁדַּ֖ד מוֹאָֽב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/020.yaml
  text: 'Moab is put to shame[a], for she is shattered[c][b]. Wail and cry out! Declare it by the Arnon: Moab is devastated.'
  footnotes:
  - marker: a
    text: Or 'Howl and cry out!'
    reason: lexical_alternative
  - marker: b
    text: Or 'at the Arnon' or 'in Arnon.'
    reason: lexical_alternative
  - marker: c
    text: Or 'Moab is plundered' / 'laid waste.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모압이 수치를 당합니다[a]. 이는 부서졌기 때문입니다[c]. 「통곡하고 부르짖으십시오!」 아르논에서 알리십시오[b]. 모압이 황폐해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘통곡하고 부르짖으십시오!’
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘아르논에서’ / ‘아르논 안에서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘모압이 약탈당합니다’ / ‘황폐해집니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִ֥ישׁ
  english_pob_choice: is put to shame
  chosen_korean: 수치를 당합니다
  alternatives_korean:
  - 부끄러움을 당합니다
  - 수치를 입습니다
  - 수치를 당했습니다
  lexicon: HALOT
  rationale: 히필의 결과적 의미를 살려 모압이 ‘부끄러워졌다’기보다 ‘수치를 당했다’는 수동적 결과를 자연스럽게 드러냅니다.
- source_word: חַ֖תָּה
  english_pob_choice: is shattered
  chosen_korean: 부서졌기 때문입니다
  alternatives_korean:
  - 산산이 부서졌기 때문입니다
  - 무너졌기 때문입니다
  - 낙심했기 때문입니다
  lexicon: HALOT
  rationale: 심판 문맥과 뒤의 ‘황폐해졌습니다’와의 평행을 따라, 감정적 ‘낙심’보다 실제 붕괴를 드러내는 표현을 택했습니다.
- source_word: הילילי ו/זעקי
  english_pob_choice: Wail and cry out
  chosen_korean: 통곡하고 부르짖으십시오
  alternatives_korean:
  - 애곡하고 부르짖으십시오
  - 울부짖고 외치십시오
  - 통곡하고 외치십시오
  lexicon: HALOT
  rationale: 두 명령형을 한국어의 병렬 명령으로 살리되, 예언적 탄식의 강도를 유지하는 ‘통곡하다 / 부르짖다’를 사용했습니다.
- source_word: בְ/אַרְנֹון
  english_pob_choice: by the Arnon
  chosen_korean: 아르논에서
  alternatives_korean:
  - 아르논 곁에서
  - 아르논 강가에서
  - 아르논 옆에서
  lexicon: HALOT
  rationale: 지명·경계 표지로서의 장소성을 간결하게 전달하기 위해 ‘~에서’로 옮겼습니다.
- source_word: שֻׁדַּ֖ד
  english_pob_choice: is devastated
  chosen_korean: 황폐해졌습니다
  alternatives_korean:
  - 파괴되었습니다
  - 유린당했습니다
  - 폐허가 되었습니다
  lexicon: HALOT
  rationale: ‘devastated’의 포괄적 의미를 살리면서, 약탈에만 좁혀지지 않도록 ‘황폐해지다’를 택했습니다.
theological_decisions:
- issue: 예언적 탄식과 공적 선포의 어조
  chosen_reading: “통곡하고 부르짖으십시오!”와 “알리십시오”를 함께 두어, 애도와 선포가 동시에 일어나는 예언문체를 보존했습니다.
  alternative_readings:
  - ‘울고 외치십시오’처럼 완화된 표현
  - 명령형을 서술형으로 바꾸는 표현
  rationale: 본문은 단순한 감정 표출이 아니라 심판 소식을 공적으로 전하라는 명령이므로, 탄식과 전파의 긴장을 함께 드러내는 것이 본문의 힘을 유지합니다.
  doctrine_reference: 예언서의 심판 선포 문체
- issue: אָמַר/명령형의 청자 처리
  chosen_reading: 한국어는 복수 명령이지만 공적 예언 خطاب으로서 정중한 명령형 ‘하십시오’를 사용했습니다.
  alternative_readings:
  - 해라체
  - 청유형
  rationale: 합쇼체 본문 규격을 따르면서도, 군중·전령에게 주는 공적 명령의 성격을 보존합니다.
  doctrine_reference: 표준어 합쇼체 스타일 가이드
