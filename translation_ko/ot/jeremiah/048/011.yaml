- source_word: טַעְמוֹ
  english_pob_choice: his taste
  chosen_korean: 그 맛
  alternatives_korean:
  - 그 풍미
  - 그 맛의 기운
  lexicon: HALOT
  rationale: 포도주 비유의 감각적 의미를 직접 살려 ‘맛’으로 옮겼습니다.
- source_word: רֵיחוֹ
