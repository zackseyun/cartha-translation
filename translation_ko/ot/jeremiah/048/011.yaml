source:
  edition: WLC
  text: שַׁאֲנַ֨ן מוֹאָ֜ב מִ/נְּעוּרָ֗י/ו וְ/שֹׁקֵ֥ט הוּא֙ אֶל שְׁמָרָ֔י/ו וְ/לֹֽא הוּרַ֤ק מִ/כְּלִי֙ אֶל כֶּ֔לִי וּ/בַ/גּוֹלָ֖ה לֹ֣א הָלָ֑ךְ עַל כֵּ֗ן עָמַ֤ד טַעְמ/וֹ֙ בּ֔/וֹ וְ/רֵיח֖/וֹ לֹ֥א נָמָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
  footnotes:
  - marker: a
    text: 'Or ''on his lees.'' The Hebrew uses a wine-making image: wine left sitting on its sediment without being poured off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모압은 어려서부터 안일하였고, 자기 찌꺼기 위에 고요히 앉아 있었으며, 그릇에서 그릇으로 옮겨 붓지 않았고 포로로도 가지 않았습니다. 그러므로 그 맛이 그 안에 그대로 남아 있고, 그 향도 변하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 찌꺼기 위에.’ 히브리어는 포도주를 침전물 위에 오래 두고 다른 그릇으로 옮기지 않는 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁאֲנַן
  english_pob_choice: has been at ease
  chosen_korean: 안일하였고
  alternatives_korean:
  - 평안하였고
  - 편안하였고
  - 태평하였고
  lexicon: HALOT
  rationale: 모압의 지속된 ‘ease/secure’ 상태를 한국어에서 간결하게 살리면서, 단순한 감정적 평온보다 풍자적·예언적 뉘앙스가 있는 ‘안일하다’로 옮겼습니다.
- source_word: מִנְּעוּרָיו
  english_pob_choice: from his youth
  chosen_korean: 어려서부터
  alternatives_korean:
  - 그의 젊은 시절부터
  - 젊은 때부터
  lexicon: HALOT
  rationale: 시간의 시작점이라는 의미를 자연스러운 현대 한국어로 옮기되, 모압을 단수 남성으로 의인화한 원문의 흐름을 유지했습니다.
- source_word: אֶל שְׁמָרָיו
  english_pob_choice: on his dregs
  chosen_korean: 자기 찌꺼기 위에 고요히 앉아 있었으며
  alternatives_korean:
  - 자기 찌꺼기 위에 있었으며
  - 자기 찌꺼기 위에 놓여 있었으며
  lexicon: HALOT
  rationale: 포도주가 앙금 위에 가만히 놓여 있는 비유를 살리기 위해 ‘찌꺼기’와 ‘고요히 앉아 있다’를 결합했습니다. ‘앉아 있다’는 원문의 정지 상태를 잘 드러냅니다.
- source_word: מִכְּלִי אֶל כֶּלִי
  english_pob_choice: from vessel to vessel
  chosen_korean: 그릇에서 그릇으로 옮겨 붓지 않았고
  alternatives_korean:
  - 용기에서 용기로 옮기지 않았고
  - 항아리에서 항아리로 옮기지 않았고
  lexicon: HALOT
  rationale: 포도주 제조 비유의 이동성을 드러내기 위해 ‘옮겨 붓다’를 사용했습니다. ‘그릇’은 지나치게 전문적이지 않으면서도 비유를 충분히 전달합니다.
- source_word: וּבַגּוֹלָה
  english_pob_choice: into exile
  chosen_korean: 포로로도 가지 않았습니다
  alternatives_korean:
  - 유배로도 가지 않았습니다
  - 포로됨도 겪지 않았습니다
  lexicon: HALOT
  rationale: 예레미야의 역사적 맥락에서는 단순한 공간 이동이 아니라 강제 이주를 가리키므로, 한국어 성경에서 익숙한 ‘포로로 가다’로 옮겼습니다.
- source_word: טַעְמוֹ
  english_pob_choice: his taste
  chosen_korean: 그 맛
  alternatives_korean:
  - 그 풍미
  - 그 맛의 기운
  lexicon: HALOT
  rationale: 포도주 비유의 감각적 의미를 직접 살려 ‘맛’으로 옮겼습니다.
- source_word: רֵיחוֹ
  english_pob_choice: his scent
  chosen_korean: 그 향
  alternatives_korean:
  - 그 냄새
  - 그 향기
  lexicon: HALOT
  rationale: ‘향’은 후각적 의미를 자연스럽게 전달하면서도, ‘향기’보다 중립적이고 ‘냄새’보다 덜 부정적입니다.
theological_decisions:
- issue: 모압의 지속된 안정 상태를 풍자적으로 드러내는 어조
  chosen_reading: ‘안일하였다… 고요히 앉아 있었다’로 옮겨, 단순한 평온이 아니라 심판을 앞둔 자기만족의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘평안하였다’로 중립적으로 번역
  - ‘편안하였다’로 부드럽게 번역
  rationale: 문맥상 이 절은 모압의 장기간 변화 없음이 오히려 정체와 교만의 징표가 되므로, 예언적 비평의 뉘앙스를 보존하는 표현이 필요합니다.
  doctrine_reference: 예언서의 풍자적 심판 어조 보존
