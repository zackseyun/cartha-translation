  yaml_path: translation/ot/jeremiah/048/011.yaml
  text: Moab has been at ease from his youth[a], and he has been undisturbed on his dregs; he has not been poured from vessel to vessel, and he has not gone into exile. Therefore his taste has remained in him, and his scent has not changed.
  footnotes:
  - marker: a
    text: 'Or ''on his lees.'' The Hebrew uses a wine-making image: wine left sitting on its sediment without being poured off.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모압은 어려서부터 안일하게 지내 왔고, 자기 앙금 위에 가만히 놓여 있었으며[a], 그릇에서 그릇으로 옮겨 부어지지 않았고 포로로 끌려간 적도 없습니다. 그러므로 그 맛은 그 안에 그대로 남아 있고, 그 향도 변하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 찌꺼기 위에.’ 히브리어는 포도주를 침전물 위에 오래 두고 다른 그릇으로 옮기지 않는 이미지를 사용합니다.
    reason: lexical_alternative
