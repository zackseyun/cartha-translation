  lexicon: HALOT
  rationale: אַנְשֵׁי의 직역은 ‘남자들’이지만 한국어에서는 지명 + ‘사람들’이 더 자연스럽고, 동시에 성별 표지의 과잉을 피하지 않도록 문맥을 유지했습니다.
- source_word: יֶהְגֶּה
  english_pob_choice: one moans
  chosen_korean: 한 사람이 탄식하기 때문입니다
  alternatives_korean:
  - 누군가 탄식하기 때문입니다
  - 그가 탄식하기 때문입니다
  lexicon: HALOT
  rationale: 주어가 모호한 절의 난점을 한국어에서도 특정하지 않고, POB의 ‘one moans’에 맞춰 비인칭적으로 처리했습니다.
theological_decisions:
- issue: 애가의 1인칭 예언자 발화의 정서 강도
  chosen_reading: 예언자가 모압을 향해 실제로 애도와 울부짖음을 표하는 직접적 탄식으로 옮겼습니다.
  alternative_readings:
