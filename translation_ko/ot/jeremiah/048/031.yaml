  text: עַל כֵּן֙ עַל מוֹאָ֣ב אֲיֵלִ֔יל וּ/לְ/מוֹאָ֥ב כֻּלֹּ֖/ה אֶזְעָ֑ק אֶל אַנְשֵׁ֥י קִֽיר חֶ֖רֶשׂ יֶהְגֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
  footnotes:
  - marker: a
    text: Or 'the men of Kir-hareseth.' The Hebrew place name here is rendered as Kir-heres, while a related fuller form appears in parallel contexts.
    reason: alternative_reading
  - marker: b
    text: The final clause is difficult. It may also be understood, 'for the men of Kir-heres I moan' or 'he moans for the men of Kir-heres.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 모압 때문에 슬퍼하며, 온 모압을 위해 부르짖겠습니다[a]. 이는 기르헤레스의 사람들 때문에 한 사람이 탄식하기 때문입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기르헤레스의 남자들’로도 옮길 수 있습니다. 히브리어 지명은 여기서 기르헤레스로 옮기며, 관련 병행 구절에는 더 긴 형태가 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 난해합니다. ‘기르헤레스의 남자들 때문에 내가 탄식한다’ 또는 ‘그가 기르헤레스의 남자들을 위해 탄식한다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
  english_pob_choice: I will wail
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 통곡하며
  - 애곡하며
  lexicon: HALOT
  rationale: 힐렐의 격한 애도 동사를 한국어 합쇼체로 자연스럽게 살리되, 지나치게 고어적인 표현은 피했습니다.
- source_word: אֶזְעָק
  english_pob_choice: I will cry out
  chosen_korean: 부르짖겠습니다
  alternatives_korean:
  - 외치겠습니다
  - 소리치겠습니다
  lexicon: HALOT
  rationale: 애통의 맥락에서 큰 소리의 호소를 나타내는 ‘부르짖다’가 원문의 절박함을 가장 잘 드러냅니다.
- source_word: אַנְשֵׁי קִיר חֶרֶשׂ
  english_pob_choice: the men of Kir-heres
  chosen_korean: 기르헤레스의 사람들
  alternatives_korean:
  - 기르헤레스의 남자들
  - 기르헤레스 사람들
  lexicon: HALOT
  rationale: אַנְשֵׁי의 직역은 ‘남자들’이지만 한국어에서는 지명 + ‘사람들’이 더 자연스럽고, 동시에 성별 표지의 과잉을 피하지 않도록 문맥을 유지했습니다.
- source_word: יֶהְגֶּה
  english_pob_choice: one moans
  chosen_korean: 한 사람이 탄식하기 때문입니다
  alternatives_korean:
  - 누군가 탄식하기 때문입니다
  - 그가 탄식하기 때문입니다
  lexicon: HALOT
  rationale: 주어가 모호한 절의 난점을 한국어에서도 특정하지 않고, POB의 ‘one moans’에 맞춰 비인칭적으로 처리했습니다.
theological_decisions:
- issue: 애가의 1인칭 예언자 발화의 정서 강도
  chosen_reading: 예언자가 모압을 향해 실제로 애도와 울부짖음을 표하는 직접적 탄식으로 옮겼습니다.
  alternative_readings:
  - 보다 완곡한 ‘슬퍼합니다’
  - 해설적으로 풀어쓴 문장
  rationale: 본문은 단순한 정보 전달이 아니라 심판 대상에 대한 예언적 애가를 드러내므로, 정서적 강도를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 예언서의 애가와 심판 선포의 수사
