revisions:
- from: 그러므로 나는 모압 때문에 슬퍼하며, 온 모압을 위해 부르짖겠습니다[a]. 이는 기르헤레스의 사람들 때문에 한 사람이 탄식하기 때문입니다[b].
  to: 그러므로 나는 모압을 두고 통곡하며, 온 모압을 향해 부르짖겠습니다. 기르헤레스[a]의 남자들을 두고 누군가 탄식합니다[b].
  rationale: 격한 애도의 동사를 ‘통곡하다’로 바로잡고, 애도의 대상 관계를 ‘…을/를 두고’로 표현했습니다. 마지막 절은 히브리어의 불확정적인 3인칭 단수 주어를 ‘누군가’로 보존했으며, 대안 해석은 각주에 남겼습니다. 지명 이형 각주는 해당 지명에 배치하고, אַנְשֵׁי는 ‘남자들’로 번역했습니다.
