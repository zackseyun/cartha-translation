  text: עַל כֵּן֙ עַל מוֹאָ֣ב אֲיֵלִ֔יל וּ/לְ/מוֹאָ֥ב כֻּלֹּ֖/ה אֶזְעָ֑ק אֶל אַנְשֵׁ֥י קִֽיר חֶ֖רֶשׂ יֶהְגֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/031.yaml
  text: Therefore I will wail over Moab[a], and I will cry out for all Moab[b]; for the men of Kir-heres one moans.
  footnotes:
  - marker: a
    text: Or 'the men of Kir-hareseth.' The Hebrew place name here is rendered as Kir-heres, while a related fuller form appears in parallel contexts.
    reason: alternative_reading
  - marker: b
    text: The final clause is difficult. It may also be understood, 'for the men of Kir-heres I moan' or 'he moans for the men of Kir-heres.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 나는 모압을 두고 통곡하며, 온 모압을 향해 부르짖겠습니다. 기르헤레스[a]의 남자들을 두고 누군가 탄식합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기르하레셋’. 여기의 히브리어 지명은 ‘기르헤레스’이며, 관련 병행 구절들에는 더 긴 형태가 나옵니다.
    reason: alternative_reading
  - marker: b
    text: 마지막 절은 난해합니다. ‘기르헤레스의 남자들을 두고 내가 탄식하겠습니다’ 또는 ‘그가 기르헤레스의 남자들을 두고 탄식합니다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲיֵלִיל
