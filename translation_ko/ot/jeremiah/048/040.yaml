  lexicon: הִנֵּה
  rationale: 청자를 향한 주목 유도 표현이므로 현대 합쇼체에 맞게 자연스럽고 직접적인 "보십시오"로 옮겼습니다.
- source_word: נֶשֶׁר
  english_pob_choice: eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 매
  - 수리
  lexicon: נֶשֶׁר
  rationale: 히브리어 נֶשֶׁר의 일반적인 한국어 성경 대응을 따르되, 비유적 급강하 이미지가 살아나도록 "독수리"를 유지했습니다.
- source_word: פָּרַשׂ כְּנָפָיו אֶל
  english_pob_choice: spreads his wings over
  chosen_korean: 자기 날개를 펼칩니다
  alternatives_korean:
  - 날개를 펴서 덮습니다
  - 날개를 펴 모압을 덮습니다
  lexicon: פָּרַשׂ כְּנָפָיו
  rationale: 문맥상 보호보다 위협적 확장/덮임의 동작이므로, 영어 POB의 "spreads his wings over"를 살려 "자기 날개를 펼칩니다"로 간결하게 옮겼습니다.
- source_word: מוֹאָב
  english_pob_choice: Moab
  chosen_korean: 모압
  alternatives_korean:
  - 모아브
  lexicon: מוֹאָב
  rationale: 성경 고유명사는 통용되는 한국어 음역 "모압"을 사용했습니다.
theological_decisions:
- issue: 야훼 신명칭의 표기
  chosen_reading: 본문에서 야훼를 사용해 원문 신명칭을 직접 드러냈습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: POB의 LORD는 원문 יהוה를 가리키므로, 독자가 대상 화자를 분명히 알 수 있도록 야훼를 택했습니다.
  doctrine_reference: OT divine name rendering policy
- issue: 모압을 향한 독수리 이미지
  chosen_reading: 이미지는 심판의 급강하와 장악을 드러내는 비유로 유지했습니다.
  alternative_readings:
  - 보호의 날개 이미지로 완화
  - 단순한 빠른 이동으로 축소
  rationale: 문맥상 이 상징은 위협적이고 심판적인 행위를 가리키므로, 그 긴장을 약화하지 않도록 직역에 가깝게 보존했습니다.
  doctrine_reference: Jeremiah oracle of judgment
