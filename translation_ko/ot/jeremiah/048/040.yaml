  text: 야훼께서 이렇게 말씀하십니다. "보십시오, 독수리처럼 그것이 날아내려와 모압 위에 자기 날개를 펼칩니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הִנֵּה는 주의를 끄는 감탄사로, 여기서는 "보십시오"로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: YHWH
  rationale: 원문 고유명사 יהוה를 한국어 기본값인 야훼로 옮겨, 영어 POB의 LORD가 가리는 신명칭을 투명하게 드러냈습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
