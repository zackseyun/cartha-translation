theological_decisions:
- issue: 모압의 의인화된 여성 소유격과 집단적 호칭
  chosen_reading: '''her little ones''를 문자적으로 ''그 작은 자들''로 옮기고, 한국어에서는 소유격을 드러내지 않았습니다.'
  alternative_readings:
  - '''그녀의 작은 자들'''
  - '''그 어린 자녀들'''
  rationale: 히브리어의 여성형 소유 개념은 모압이라는 나라를 의인화한 표현이므로, 한국어에서는 불필요한 인칭성보다 집단의 파괴와 절규를 드러내는 쪽이 본문의 효과를 더 잘 전달합니다.
