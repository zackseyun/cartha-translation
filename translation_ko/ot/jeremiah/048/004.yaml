  yaml_path: translation/ot/jeremiah/048/004.yaml
  text: Moab is shattered; her little ones have made a cry heard.
translation:
  language: ko
  text: 모압이 산산이 부서졌습니다. 그 작은 자들이 울부짖는 소리를 냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그 작은 자들” 또는 “그 어린 자들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבְּרָה
  english_pob_choice: is shattered
  chosen_korean: 산산이 부서졌습니다
  alternatives_korean:
  - 부서졌습니다
  - 깨어졌습니다
  lexicon: שׁבר
  rationale: 형용사적 수동 의미를 살려 단순히 '부서졌다'보다 파괴의 강도를 드러내기 위해 '산산이'를 보탰습니다.
- source_word: מוֹאָב
  english_pob_choice: Moab
  chosen_korean: 모압
  alternatives_korean:
  - 모아브
  lexicon: Moab
  rationale: 성경 인명 표기 관례에 따라 '모압'으로 옮겼습니다.
- source_word: זְּעָקָה
  english_pob_choice: a cry
  chosen_korean: 울부짖는 소리
  alternatives_korean:
  - 부르짖음
  - 외침
  lexicon: זעק
  rationale: 명사형 '부르짖음'도 가능하지만, 이 문맥에서는 고통의 울부짖음을 드러내는 표현이 더 자연스럽고 소리의 발생을 분명히 하기 위해 '소리'를 살렸습니다.
- source_word: צעורי/ה
  english_pob_choice: her little ones
  chosen_korean: 그 작은 자들
  alternatives_korean:
  - 그 어린 자들
  - 그 자녀들
  lexicon: צער
  rationale: 문맥상 모압의 연약한 이들을 가리키므로 직역에 가깝게 '작은 자들'로 두되, 소유격 'her'는 한국어 문장 흐름상 자연스럽게 생략했습니다.
theological_decisions:
- issue: 모압의 의인화된 여성 소유격과 집단적 호칭
  chosen_reading: '''her little ones''를 문자적으로 ''그 작은 자들''로 옮기고, 한국어에서는 소유격을 드러내지 않았습니다.'
  alternative_readings:
  - '''그녀의 작은 자들'''
  - '''그 어린 자녀들'''
  rationale: 히브리어의 여성형 소유 개념은 모압이라는 나라를 의인화한 표현이므로, 한국어에서는 불필요한 인칭성보다 집단의 파괴와 절규를 드러내는 쪽이 본문의 효과를 더 잘 전달합니다.
  doctrine_reference: 예언서의 시적 의인화 처리
