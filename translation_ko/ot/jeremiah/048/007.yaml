  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֠י יַ֣עַן בִּטְחֵ֤/ךְ בְּ/מַעֲשַׂ֨יִ/ךְ֙ וּ/בְ/א֣וֹצְרוֹתַ֔יִ/ךְ גַּם אַ֖תְּ תִּלָּכֵ֑דִי וְ/יָצָ֤א כמיש בַּ/גּוֹלָ֔ה כֹּהֲנָ֥י/ו וְ/שָׂרָ֖י/ו יחד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/007.yaml
  text: Because you trusted in your works and in your treasures[a], you also will be captured; and Chemosh will go out into exile[e][d][c][b], his priests and his officials together.
  footnotes:
  - marker: a
    text: Or 'in your deeds.' The Hebrew word can refer broadly to works, acts, or what one has made.
    reason: lexical_alternative
  - marker: b
    text: Or 'in your wealth' or 'in your storehouses.'
    reason: lexical_alternative
  - marker: c
    text: Chemosh was the national god of Moab.
    reason: cultural_note
  - marker: d
    text: Or 'into captivity.'
    reason: lexical_alternative
  - marker: e
    text: Or 'his princes.'
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 네 행위와 네 보물을 신뢰하였으므로, 너 또한 사로잡힐 것입니다. 그모스는 그의 제사장들과 그의 관리들과 함께 유배를 떠나게 될 것입니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘행위’는 ‘일들’, ‘행동들’, 또는 ‘만든 것들’까지 포함할 수 있는 넓은 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보물’은 ‘재물’이나 ‘창고들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 그모스는 모압의 민족신입니다.
    reason: cultural_note
  - marker: d
    text: ‘유배’는 ‘포로 생활’ 또는 ‘포로로 끌려감’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: ‘관리들’은 ‘방백들’ 또는 ‘통치자들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּטְחֵךְ
  english_pob_choice: you trusted
  chosen_korean: 네가 ... 신뢰하였으므로
  alternatives_korean:
  - 네가 ... 믿었으므로
  - 네가 ... 의지하였으므로
  lexicon: HALOT
  rationale: בטח는 단순 지식보다 의탁과 신뢰의 뉘앙스를 가지므로, 원인 절에서 ‘신뢰하다’로 옮기는 것이 가장 직접적입니다.
- source_word: בְּמַעֲשַׂיִךְ
  english_pob_choice: in your works
  chosen_korean: 네 행위
  alternatives_korean:
  - 네 작품들
  - 네가 한 일들
  lexicon: HALOT
  rationale: מַעֲשֶׂה는 일, 행위, 성취를 넓게 가리키므로, 한국어에서는 ‘행위’로 두어 의미 범위를 과도하게 좁히지 않았습니다.
- source_word: וּבְאֹצְרוֹתַיִךְ
  english_pob_choice: and in your treasures
  chosen_korean: 네 보물들
  alternatives_korean:
  - 네 창고들
  - 네 재물
  lexicon: HALOT
  rationale: אֹצָר는 보물, 재물, 창고를 뜻할 수 있으나, 신뢰의 대상이라는 문맥에서는 축적된 재화를 가리키는 ‘보물들’이 가장 자연스럽습니다.
- source_word: בַּגּוֹלָה
  english_pob_choice: into exile
  chosen_korean: 포로로 나가게 될 것이다
  alternatives_korean:
  - 유배로 가게 될 것이다
  - 사로잡혀 가게 될 것이다
  lexicon: HALOT
  rationale: גּוֹלָה는 추방·유배의 상태를 가리키지만, 바로 앞의 ‘사로잡히다’와 이어지는 병행성을 살리기 위해 결과를 드러내는 동사구로 풀었습니다.
- source_word: כֹּהֲנָיו
  english_pob_choice: his priests
  chosen_korean: 그의 제사장들
  alternatives_korean:
  - 그의 사제들
  lexicon: HALOT
  rationale: כֹּהֵן은 제사장 직분을 가리키므로, 표준적인 ‘제사장’이 가장 정확합니다.
- source_word: וְשָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 방백들
  - 그의 통치자들
  lexicon: HALOT
  rationale: שַׂר는 군왕, 방백, 관리, 통치자를 폭넓게 뜻하므로, 문맥상 제사장들과 나란히 묶이는 공적 인사로서 ‘관리들’이 가장 무난합니다.
theological_decisions:
- issue: 그모스를 어떻게 처리할 것인가
  chosen_reading: 그모스를 모압의 신으로 이해하고, 본문이 그 신도 패배 속에 함께 포로로 끌려가는 것으로 표현한다고 보았습니다.
  alternative_readings:
  - 그모스를 단순한 지명이나 상징적 이름으로 보는 읽기
  rationale: 본문의 인칭 대명사와 제사장·관리의 병렬은 그모스를 모압의 قومی 신으로 의인화하는 해석을 강하게 지지합니다.
  doctrine_reference: 본문 맥락에 따른 역사-문법적 해석
