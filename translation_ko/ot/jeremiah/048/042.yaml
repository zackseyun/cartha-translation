  text: וְ/נִשְׁמַ֥ד מוֹאָ֖ב מֵ/עָ֑ם כִּ֥י עַל יְהוָ֖ה הִגְדִּֽיל־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/042.yaml
  text: And Moab will be destroyed as a people[a], because he magnified himself against Yahweh.
  footnotes:
  - marker: a
    text: Or, 'because he made himself great against the LORD,' that is, he exalted himself arrogantly against him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 모압은 한 백성으로서 멸망할 것입니다[a]. 이는 그가 야훼를 거슬러 스스로를 높였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 야훼를 거슬러 자신을 크게 하였기 때문에’, 곧 그에게 교만하게 맞섰기 때문에.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַד
  english_pob_choice: will be destroyed
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 파괴될 것입니다
  - 멸절될 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: נשׁמד의 수동적 종말 선언을 자연스러운 현대 한국어로 옮기되, 단순한 물리적 파괴보다 공동체의 소멸을 암시하도록 했습니다.
- source_word: מוֹאָב
  english_pob_choice: Moab
  chosen_korean: 모압
  alternatives_korean:
  - 모압 족속
  - 모아브
  lexicon: 표준 외래어 표기
  rationale: 고유명사는 통용되는 성경식 음역인 모압을 사용했습니다.
- source_word: מֵעָם
  english_pob_choice: as a people
  chosen_korean: 한 백성으로서
  alternatives_korean:
  - 백성으로서
  - 한 민족으로서
  - 백성에서
  lexicon: HALOT
  rationale: מִן + עַם이 모압이 독립된 공동체로 남지 못함을 뜻하므로, '한 백성으로서'로 옮겨 존재 범주의 상실을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 정본 프로젝트 용례
  rationale: יהוה는 직역 관례에 따라 신적 호칭 '주님'이 아니라 고유명 '야훼'로 옮겨, 본문이 하나님의 이름을 직접 지칭함을 보존했습니다.
theological_decisions:
- issue: ‘스스로를 높였다’는 הִגְדִּיל의 자의적 확대 뉘앙스
  chosen_reading: 그가 야훼를 거슬러 스스로를 높였기 때문입니다
  alternative_readings:
  - 그가 야훼 앞에서 자신을 크게 했기 때문입니다
  - 그가 야훼를 대적하여 자신을 크게 했기 때문입니다
  rationale: 문맥상 הִגְדִּיל은 단순한 성장보다 교만한 자고를 뜻하므로, 대적 관계를 분명히 하면서도 본문의 직접성을 유지했습니다.
  doctrine_reference: 예언서의 교만-심판 도식
