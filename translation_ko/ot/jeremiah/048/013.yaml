  rationale: 원문의 예언적 수치와 과거 이스라엘의 수치를 비교하는 구조를 유지하면서, 합쇼체 문장을 자연스럽게 다듬었습니다. ‘자기들의 신뢰처’로 벧엘이 이스라엘이 의지한 대상임을 분명히 했고, 각주 표지를 해당 명사에 직접 연결했습니다. 벧엘 주석은 지명 및 제의적 역사성을 보존하되 ‘산당’이라는 지나치게 협소한 규정은 피했습니다.
