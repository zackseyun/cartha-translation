id: JER.48.13
reference: Jeremiah 48:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בֹ֥שׁ מוֹאָ֖ב מִ/כְּמ֑וֹשׁ כַּ/אֲשֶׁר בֹּ֨שׁוּ֙ בֵּ֣ית יִשְׂרָאֵ֔ל מִ/בֵּ֥ית אֵ֖ל מִבְטֶחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/013.yaml
  text: And Moab will be put to shame because of Chemosh[a], just as the house of Israel was put to shame because of Bethel[b], their confidence.
  footnotes:
  - marker: a
    text: Or 'will be ashamed of Chemosh.' The Hebrew can be rendered more literally with 'ashamed of/from Chemosh,' but the sense is that Moab's reliance on Chemosh will end in disgrace.
    reason: lexical_alternative
  - marker: b
    text: Bethel was the northern Israelite sanctuary associated with calf worship; the phrase could be translated more literally, 'from Bethel, their confidence.'
    reason: cultural_note
translation:
  language: ko
  text: 모압은 그모스[a] 때문에 수치를 당할 것이며, 이는 이스라엘 집이 자기들의 신뢰처인 벧엘[b] 때문에 수치를 당했던 것과 같습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그모스 때문에’는 히브리어 전치사 מן의 관계를 원인 또는 대상으로 이해한 번역입니다. 더 문자적으로는 ‘그모스로부터’ 또는 ‘그모스에 대하여 수치를 당하다’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 벧엘은 문자적으로 ‘하나님의 집’이라는 뜻이지만, 여기서는 송아지 숭배와 연관된 북이스라엘의 제의 중심지인 벧엘을 가리킵니다. 더 문자적으로는 ‘벧엘, 곧 그들의 신뢰처로부터’라고 옮길 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּבֹשׁ
  english_pob_choice: will be put to shame
  chosen_korean: 수치를 당할 것이니
  alternatives_korean:
  - 부끄러움을 당할 것이니
  - 수치를 입을 것이니
  - 부끄러워할 것이니
  lexicon: HALOT
  rationale: 예언적 심판 문맥에서 단순한 내적 감정보다 공개적 굴욕과 실패의 결과를 드러내기 위해 수동적 뉘앙스의 ‘수치를 당하다’를 선택했습니다.
- source_word: מִכְּמוֹשׁ
  english_pob_choice: because of Chemosh
  chosen_korean: 그모스 때문에
  alternatives_korean:
  - 그모스 때문에
  - 그모스로 인해
  - 그모스에 대하여
  lexicon: HALOT
  rationale: מן이 ‘수치의 원인/대상’을 가리키는 용법으로 이해되므로, 모압이 의지한 신 그모스 때문에 수치를 당한다는 뜻을 자연스럽게 살렸습니다.
- source_word: בֵּית יִשְׂרָאֵל
  english_pob_choice: the house of Israel
  chosen_korean: 이스라엘 집
  alternatives_korean:
  - 이스라엘의 집
  - 이스라엘
  lexicon: HALOT
  rationale: 히브리어의 공동체적·언약적 표현을 보존하기 위해 ‘이스라엘 집’을 유지했습니다.
- source_word: מִבֵּית אֵל
  english_pob_choice: because of Bethel
  chosen_korean: 벧엘 때문에
  alternatives_korean:
  - 벧엘 때문에
  - 벧엘로 인해
  - 하나님의 집 때문에
  lexicon: HALOT
  rationale: 문맥상 일반명사 ‘하나님의 집’이 아니라 북이스라엘의 산당/성소인 지명 벧엘을 가리키므로, 역사적·풍자적 대상을 드러내는 지명형을 택했습니다.
- source_word: מִבְטֶחָם
  english_pob_choice: their confidence
  chosen_korean: 그들의 신뢰처인
  alternatives_korean:
  - 그들의 신뢰인
  - 그들이 의지한
  - 그들의 의지처인
  lexicon: HALOT
  rationale: 명사형 ‘신뢰’보다 대상이 되는 의지처를 드러내는 표현이 더 자연스러워, 벧엘이 ‘그들이 의지한 대상’이라는 아이러니를 살렸습니다.
theological_decisions:
- issue: 벧엘의 의미 범위
  chosen_reading: 벧엘을 ‘하나님의 집’으로 일반화하지 않고, 우상 숭배와 연결된 북이스라엘의 제의 중심지로 읽어야 합니다.
  alternative_readings:
  - 문자적으로 ‘하나님의 집’으로 번역하는 해석
  rationale: 본문의 비교 대상은 그모스를 신뢰한 모압과 벧엘을 신뢰한 이스라엘의 대조이므로, 지명과 역사적 비판의 날카로움을 유지하는 것이 중요합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve prophetic polemic and historical allusion.'
