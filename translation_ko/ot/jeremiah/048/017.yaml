base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
  footnotes:
  - marker: a
    text: Or 'Shake your heads over him' / 'Lament for him'; the Hebrew verb can denote mourning, often with a physical gesture.
    reason: lexical_alternative
  - marker: b
    text: '''Know his name'' may also imply ''know his fame'' or reputation.'
    reason: lexical_alternative
  - marker: c
    text: Both 'scepter' and 'staff/rod' are possible for the Hebrew terms; the imagery likely conveys Moab's power and honor now broken.
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 두고 애도하십시오[a], 그의 주변에 있는 모든 이들아. 그의 이름을 아는 모든 이들아[b], 이렇게 말하십시오. “권능의 막대기가[c] 어찌하여 부러졌는가, 영광의 지팡이가!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그를 두고 애도하십시오’는 ‘그를 향해 머리를 흔드십시오’ 또는 ‘그를 두고 슬퍼하십시오’로도 번역할 수 있습니다. 히브리어 동사는 애도를 뜻할 수 있으며, 흔히 몸짓으로 표현되기도 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘그의 이름을 아는 이들’은 ‘그의 명성 또는 평판을 아는 이들’을 뜻할 수도 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘막대기’와 ‘지팡이’에 해당하는 두 히브리어 단어는 모두 막대기, 지팡이, 또는 홀로 번역될 수 있습니다. 이 이미지는 부러진 모압의 권능과 영광을 나타내는 것으로 보입니다.
    reason: alternative_reading
