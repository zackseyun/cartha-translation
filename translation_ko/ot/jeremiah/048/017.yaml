base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/017.yaml
  text: 'Mourn for him[a], all you around him, and all who know his name, say: “How the mighty scepter is broken[c][b], the staff of splendor!”'
  footnotes:
  - marker: a
    text: Or 'Shake your heads over him' / 'Lament for him'; the Hebrew verb can denote mourning, often with a physical gesture.
    reason: lexical_alternative
  - marker: b
    text: '''Know his name'' may also imply ''know his fame'' or reputation.'
    reason: lexical_alternative
  - marker: c
    text: Both 'scepter' and 'staff/rod' are possible for the Hebrew terms; the imagery likely conveys Moab's power and honor now broken.
    reason: lexical_alternative
translation:
  language: ko
  text: '그를 위해 애도하라[a], 그 주위에 있는 모든 자여, 그리고 그 이름을 아는 모든 자여, 말하라: ''강력한 지팡이[c][b]가 어떻게 부러졌는가, 영광의 지팡이가!'''
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''그를 위해 애도하라''는 ''그를 향해 머리를 흔들라'' 또는 ''그를 위해 슬퍼하라''로 번역될 수 있습니다. 히브리어 동사는 애도를 의미하며, 종종 신체적 제수를 동반합니다.'
    reason: alternative_reading
  - marker: b
    text: '''그 이름을 아는 자''는 ''그의 명성을 아는 자''를 의미할 수도 있습니다.'
    reason: alternative_reading
  - marker: c
    text: '''지팡이''와 ''지팡이/막대기''는 히브리어 용어로 모두 가능할 수 있으며, 이 이미지는 모압의 권위와 영광이 이제 부러졌음을 나타냅니다.'
    reason: alternative_reading
