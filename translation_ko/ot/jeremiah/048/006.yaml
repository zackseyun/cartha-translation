source:
  edition: WLC
  text: נֻ֖סוּ מַלְּט֣וּ נַפְשְׁ/כֶ֑ם וְ/תִֽהְיֶ֕ינָה כַּ/עֲרוֹעֵ֖ר בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/006.yaml
  text: Flee! Escape with your lives[b][a], and be like a juniper in the wilderness.
  footnotes:
  - marker: a
    text: Or possibly, 'and be like Aroer in the wilderness.' The Hebrew עֲרוֹעֵר can be taken either as a place-name or as the name of a desert shrub; the simile with 'in the wilderness' favors the plant image here.
    reason: alternative_reading
  - marker: b
    text: The exact plant denoted by עֲרוֹעֵר is uncertain; possible renderings include 'juniper,' 'tamarisk,' or more generally 'desert shrub.'
    reason: lexical_alternative
translation:
  language: ko
  text: 도망하십시오! 목숨을 건져 피하십시오. 그리고 광야의 노간주나무처럼 되십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '광야의 아로엘처럼'으로도 볼 수 있습니다. 히브리어 עֲרוֹעֵר는 지명일 수도, 광야 관목의 이름일 수도 있는데, 뒤의 '광야에서'가 식물 비유를 더 강하게 시사합니다.
    reason: alternative_reading
  - marker: b
    text: עֲרוֹעֵר가 가리키는 식물은 정확히 확정하기 어렵습니다. 노간주나무, 타마리스크, 또는 더 일반적으로 '광야 관목'으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֻסוּ
  english_pob_choice: Flee!
  chosen_korean: 도망하십시오!
  alternatives_korean:
  - 달아나십시오!
  - 피하십시오!
  lexicon: HALOT
  rationale: 복수 명령형의 긴박한 도피 명령을 합쇼체로 자연스럽게 옮겼습니다. '도망하다'가 재난 앞의 즉각적 탈출을 가장 분명하게 드러냅니다.
- source_word: מַלְּטוּ נַפְשְׁכֶם
  english_pob_choice: Escape with your lives
  chosen_korean: 목숨을 건져 피하십시오
  alternatives_korean:
  - 생명을 구하십시오
  - 자신의 생명을 구하십시오
  lexicon: HALOT
  rationale: נֶפֶשׁ를 이 절의 도피 문맥에 맞게 '목숨'으로 옮겨 생명 보존의 의미를 살렸습니다. '건져 피하다'는 מלט의 구출/탈출 뉘앙스를 함께 담습니다.
- source_word: כַּעֲרוֹעֵר
  english_pob_choice: like a juniper
  chosen_korean: 광야의 노간주나무처럼
  alternatives_korean:
  - 광야의 아로엘처럼
  - 광야의 관목처럼
  - 광야의 타마리스크처럼
  lexicon: HALOT
  rationale: 문맥의 '광야'가 식물 이미지에 더 잘 맞으므로 지명 '아로엘'보다 수목/관목 이해를 따랐습니다. 정확한 종은 불확실하므로 한국어에서는 통용되는 나무 이름을 사용하되, 관습적 번역의 한계를 주석으로 남깁니다.
theological_decisions:
- issue: עֲרוֹעֵר의 이중 가능성(지명/식물)
  chosen_reading: 본문의 비유는 광야에 홀로 선 식물 이미지로 읽었습니다.
  alternative_readings:
  - '''광야의 아로엘처럼''으로 지명 이해'
  - 보다 일반적인 '광야의 관목처럼'
  rationale: 뒤의 '광야에서'가 이어져 있으므로 장소명보다 비유적 식물 읽기가 더 자연스럽고, 영어 POB의 주석 판단과도 일치합니다.
  doctrine_reference: 본문-문맥 우선 원칙; 시적 비유의 자연스러운 독법
- issue: נַפְשְׁכֶם의 의미
  chosen_reading: '''목숨''으로 옮겨 실제 생명 보존의 긴급성을 드러냈습니다.'
  alternative_readings:
  - '''영혼'''
  - '''자기 자신'''
  rationale: 이 절은 전투/재난 속 탈출 명령이므로 נֶפֶשׁ를 '영혼'보다 '목숨'으로 읽는 것이 מקור의 긴박함을 가장 잘 보존합니다.
  doctrine_reference: 히브리어 נֶפֶשׁ의 생명-자기 자신 용법
