id: JER.48.46
reference: Jeremiah 48:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖ד עַם כְּמ֑וֹשׁ כִּֽי לֻקְּח֤וּ בָנֶ֨י/ךָ֙ בַּ/שֶּׁ֔בִי וּ/בְנֹתֶ֖י/ךָ בַּ/שִּׁבְיָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/046.yaml
  text: Woe to you[a], Moab! The people of Chemosh have perished, for your sons have been taken captive, and your daughters into captivity.
  footnotes:
  - marker: a
    text: Or 'into captivity' for 'into exile'; the two Hebrew terms are near-synonyms and form a poetic parallel.
    reason: lexical_alternative
translation:
  language: ko
  text: 오, 너에게 화가 있나니, 모압아! 그모스의 백성이 멸망하였습니다. 이는 네 아들들이 포로로 잡혀가고 네 딸들도 포로가 되었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘포로로 잡혀가고’와 ‘포로가 되다’는 둘 다 히브리어의 포로/포로됨 표현을 옮긴 것으로, 시적 평행을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  english_pob_choice: Woe
  chosen_korean: 오, 너에게 화가 있나니
  alternatives_korean:
  - 슬프다, 너에게
  - 아아, 너에게 화가 있다
  lexicon: HALOT
  rationale: 예언적 탄식과 심판 선언의 강도를 살리기 위해 ‘화가 있나니’를 택했고, ‘오’는 절규성을 보완합니다.
- source_word: עַם כְּמוֹשׁ
  english_pob_choice: the people of Chemosh
  chosen_korean: 그모스의 백성
  alternatives_korean:
  - 그모스 백성
  - 그모스에게 속한 백성
  lexicon: HALOT
  rationale: 히브리어의 속격 구조를 자연스럽게 옮기되, 모압의 민족신과 결부된 표현이라는 점을 드러내기 위해 직역에 가깝게 번역했습니다.
- source_word: לֻקְּחוּ ... בַּשֶּׁבִי / בַּשִּׁבְיָה
  english_pob_choice: have been taken captive / into captivity
  chosen_korean: 포로로 잡혀가고 ... 포로가 되었기 때문입니다
  alternatives_korean:
  - 사로잡혀 가고 ... 사로잡혔기 때문입니다
  - 포로로 끌려가고 ... 포로 신세가 되었기 때문입니다
  lexicon: HALOT
  rationale: 두 표현 모두 포로 상태를 가리키므로 한국어에서는 반복을 살리면서도 자연스럽게 ‘포로로 잡혀가다’와 ‘포로가 되다’로 옮겼습니다.
- source_word: בָּנֶיךָ / וּבְנֹתֶיךָ
  english_pob_choice: your sons / your daughters
  chosen_korean: 네 아들들 / 네 딸들
  alternatives_korean:
  - 네 자녀들(남자) / 네 딸들
  - 네 아들 / 네 딸
  lexicon: HALOT
  rationale: 히브리어의 남성·여성 대구를 보존하기 위해 ‘아들들/딸들’을 유지했습니다.
theological_decisions:
- issue: 모압과 그모스의 관계를 어떻게 드러낼지
  chosen_reading: ‘그모스의 백성’으로 옮겨 모압 민족이 그들의 신과 결부된다는 본문의 암시를 그대로 남겼습니다.
  alternative_readings:
  - ‘그모스에게 속한 백성’으로 풀이해 관계를 더 설명적으로 드러냄
  - ‘그모스의 사람들’로 더 직역
  rationale: 본문은 민족 정체성과 우상 숭배의 결속을 간결하게 드러내므로, 해설을 덧붙여 완화하지 않고 속격 관계를 유지하는 편이 적절합니다.
  doctrine_reference: 본문의 신학적 긴장을 보존하고, 우상 신명과 민족 정체성의 연결을 설명 없이 드러냄
