  philosophy: formal
lexical_decisions:
- source_word: ק֥וֹל צְעָקָ֖ה
  english_pob_choice: A sound of a cry
  chosen_korean: 비명이 들립니다
  alternatives_korean:
  - 울부짖는 소리가 들립니다
  - 부르짖는 소리가 들립니다
  - 외침의 소리가 들립니다
  lexicon: קול / צעקה
  rationale: 히브리어의 ‘소리’와 ‘비명/부르짖음’의 결합을 자연스러운 한국어로 압축해, 단순한 음향이 아니라 들려오는 절박한 절규를 살렸습니다.
- source_word: מֵחֹרוֹנָיִם
  english_pob_choice: from Horonaim
  chosen_korean: 호로나임에서
  alternatives_korean:
  - 호로나임으로부터
  - 호로나임 곳에서
  lexicon: 지명 חורונַיִם
  rationale: 전치사 מִן의 출발점 의미를 한국어 조사 ‘-에서’로 간결하게 옮기고, 지명은 음역을 유지했습니다.
- source_word: שֹׁד וָשֶׁבֶר גָּדוֹל
  english_pob_choice: devastation and great destruction
  chosen_korean: 황폐와 큰 파괴
  alternatives_korean:
  - 파괴와 큰 붕괴
  - 멸망과 큰 파멸
  - 황폐와 큰 멸절
  lexicon: שֹׁד / שֶׁבֶר / גָּדוֹל
  rationale: 두 명사 모두 재앙적 파괴를 가리키므로 의미를 분리해 ‘황폐’와 ‘파괴’로 옮겼고, ‘큰’으로 גָּדוֹל의 강도를 반영했습니다.
theological_decisions:
- issue: 예언적 재난 선언의 어조
  chosen_reading: 이 구절은 감정적 해설 없이, 들려오는 비명과 재난의 실상을 짧고 직접적으로 제시하는 예언문으로 처리했습니다.
  alternative_readings:
  - 설명형으로 풀어 ‘호로나임에서 큰 재앙이 닥칩니다’로 옮길 수 있음
  - 의역해 ‘호로나임이 완전히 무너집니다’로 강화할 수 있음
  rationale: 히브리어 원문은 병렬 명사구로 파괴의 실체를 제시하므로, 예언적 긴박함을 유지하기 위해 서술을 과도하게 풀지 않았습니다.
  doctrine_reference: 예언서의 심판 선언 형식 보존
- issue: ‘비명’과 ‘소리’의 긴장
  chosen_reading: ‘A sound of a cry’의 이중 표현을 완전히 평준화하지 않고, 들리는 절규라는 효과를 살리되 한국어로는 한 문장으로 자연화했습니다.
  alternative_readings:
  - ‘부르짖는 소리’처럼 보다 직역적으로 옮길 수 있음
  - ‘외침의 소리’로 더 문자적으로 유지할 수 있음
  rationale: 원문의 קול과 צעקה가 함께 만들어 내는 청각적 긴장을 보존하면서도, 한국어에서 중복 어색함을 피했습니다.
  doctrine_reference: 원문 수사 보존
