id: JER.48.8
reference: Jeremiah 48:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יָבֹ֨א שֹׁדֵ֜ד אֶל כָּל עִ֗יר וְ/עִיר֙ לֹ֣א תִמָּלֵ֔ט וְ/אָבַ֥ד הָ/עֵ֖מֶק וְ/נִשְׁמַ֣ד הַ/מִּישֹׁ֑ר אֲשֶׁ֖ר אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/008.yaml
  text: And the destroyer will come against every city[a], and no city will escape; the valley will perish, and the plain will be destroyed, as Yahweh has said.
  footnotes:
  - marker: a
    text: Or 'the plain' or 'the tableland' for 'the plateau.' The Hebrew term refers to level land and in Moab may denote the elevated tableland region.
    reason: lexical_alternative
translation:
  language: ko
  text: 파괴자가 모든 성읍을 향해 오며, 어떤 성읍도 피하지 못할 것입니다. 골짜기는 사라지고, 평지는 황폐될 것입니다. 야훼께서 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִישׁוֹר는 평탄한 땅을 뜻하며, 모압에서는 고원 지대를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁדֵד
  english_pob_choice: the destroyer
  chosen_korean: 파괴자
  alternatives_korean:
  - 멸망시키는 자
  - 약탈자
  - 훼파자
  lexicon: HALOT
  rationale: 심판 문맥에서 פעיל 분사형 명사로서 ‘파괴자’가 가장 자연스럽고, 단순한 ‘약탈자’보다 파멸의 방향을 더 잘 드러냅니다.
- source_word: אֶל כָּל עִיר
  english_pob_choice: against every city
  chosen_korean: 모든 성읍을 향해
  alternatives_korean:
  - 모든 성읍에 대하여
  - 모든 성읍을 치러
  lexicon: HALOT
  rationale: אֶל은 문자적으로 ‘~로/~에게’이지만 침입하는 파괴자의 움직임에서는 적대적 접근을 뜻하므로, 한국어에서는 ‘향해’로 옮겨 공격성을 살렸습니다.
- source_word: הָעֵמֶק
  english_pob_choice: the valley
  chosen_korean: 골짜기
  alternatives_korean:
  - 계곡
  - 골짜기 지역
  lexicon: HALOT
  rationale: עֵמֶק의 기본 의미를 따라 ‘골짜기’로 옮기되, 지리적 지역성을 과도하게 해석하지 않았습니다.
- source_word: הַמִּישֹׁר
  english_pob_choice: the plain
  chosen_korean: 평지
  alternatives_korean:
  - 평야
  - 고원 평지
  - 테이블랜드
  lexicon: HALOT
  rationale: 해당 어휘는 평탄한 땅을 가리키며, 영어 POB의 마지막 판독처럼 이 문맥에서는 ‘plain’이 가장 자연스럽습니다. 한국어에서는 통용성이 높은 ‘평지’를 사용했습니다.
- source_word: וְנִשְׁמַד
  english_pob_choice: will be destroyed
  chosen_korean: 황폐될 것입니다
  alternatives_korean:
  - 파괴될 것입니다
  - 멸절될 것입니다
  - 무너질 것입니다
  lexicon: HALOT
  rationale: Niphal의 ‘파괴되다/멸망하다’ 의미를 살리면서, 도시·지역의 심판을 함께 포괄하는 현대 한국어 표현으로 ‘황폐될 것입니다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 프로젝트 기본어에 따라 여호와 대신 야훼를 사용해, 본문의 언약명과 직접성을 보존했습니다.
theological_decisions:
- issue: 예언 종결 공식의 인용 방식
  chosen_reading: ‘야훼께서 말씀하셨습니다’로 마무리해 예언의 권위를 직접적으로 표지했습니다.
  alternative_readings:
  - ‘야훼의 말씀이니라’
  - ‘야훼께서 이르셨습니다’
  rationale: 히브리어의 종결 공식을 현대 합쇼체로 옮기되, 단정적 선언의 무게를 유지했습니다.
  doctrine_reference: 예언서 종결 공식의 직접 인용
