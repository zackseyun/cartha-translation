  lexicon: HALOT
  rationale: 여기서는 고유명사 갈멜이 아니라 경작된 비옥한 땅을 가리키므로, 포도 수확 문맥에 맞는 간결한 ‘밭’으로 옮겼습니다.
- source_word: יְקָבִים
  english_pob_choice: winepresses
  chosen_korean: 포도즙 틀
  alternatives_korean:
