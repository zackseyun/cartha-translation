id: JER.48.33
reference: Jeremiah 48:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
  footnotes:
  - marker: a
    text: Or 'fruitful field.' The Hebrew karmel here refers to fertile, cultivated land, not the proper name Carmel.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shout here is the cry associated with grape-treading or harvest celebration.
    reason: cultural_note
  - marker: c
    text: 'The final clause is elliptical in Hebrew: literally, ''shout, shout—not shout,'' meaning the expected joyful vintage cry has ceased.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기쁨과 즐거움이 밭에서, 모압 땅에서 거두어졌습니다[a]. 나는 포도즙 틀에서 포도주가 그치게 하였으니, 누구도 함성을 지르며 포도를 밟지 못할 것입니다[b]. 함성, 함성이 아니라 함성입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열매 맺는 들’. כאן의 karmel은 갈멜산이 아니라 비옥하게 경작된 땅을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 함성은 포도 밟기나 수확 축제에 동반되는 외침을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 마지막 절을 매우 압축적으로 구성합니다. 직역하면 ‘함성, 함성—아니라 함성’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶאֶסְפָה
  english_pob_choice: have been gathered
  chosen_korean: 거두어졌습니다
  alternatives_korean:
  - 거둬졌습니다
  - 사라졌습니다
  lexicon: HALOT
  rationale: נאסף의 피동은 ‘모아지다/거두어지다’의 뜻을 살릴 수 있어, 제거의 의미를 담되 원문의 수확·수집 이미지를 보존합니다.
- source_word: כַּרְמֶל
  english_pob_choice: orchard land
  chosen_korean: 밭
  alternatives_korean:
  - 열매 맺는 땅
  - 비옥한 들
  lexicon: HALOT
  rationale: 여기서는 고유명사 갈멜이 아니라 경작된 비옥한 땅을 가리키므로, 포도 수확 문맥에 맞는 간결한 ‘밭’으로 옮겼습니다.
- source_word: יְקָבִים
  english_pob_choice: winepresses
  chosen_korean: 포도즙 틀
  alternatives_korean:
  - 포도틀
  - 포도압착틀
  lexicon: HALOT
  rationale: 포도를 밟아 즙을 내는 설비를 가리키므로, 한국어로 직관적인 ‘포도즙 틀’이 문맥상 분명합니다.
- source_word: הֵידָד
  english_pob_choice: shout
  chosen_korean: 함성
  alternatives_korean:
  - 외침
  - 수확의 함성
  lexicon: HALOT
  rationale: 이 단어는 포도 밟기와 수확 축하에 동반되는 외침을 뜻하므로, 본문에서는 짧은 본문을 살리고 주석에서 수확 의미를 보완할 수 있는 ‘함성’이 적절합니다.
theological_decisions:
- issue: 첫인칭 단수 ‘나는’의 화자
  chosen_reading: 예언적 심판 선언 속에서 야훼께서 직접 말씀하시는 것으로 이해해 ‘나는’으로 옮겼습니다.
  alternative_readings:
  - 불특정 예언자의 1인칭
  - 서술적 1인칭
  rationale: 문맥 전체가 모압에 대한 심판 신탁이므로, 히브리어 1인칭 단수는 하나님의 직접 발화로 읽는 것이 가장 자연스럽습니다.
  doctrine_reference: 예언문 맥락에서의 화자 식별; 번역은 본문이 말하는 주체를 보존해야 합니다.
