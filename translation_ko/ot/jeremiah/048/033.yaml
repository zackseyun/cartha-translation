  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נֶאֶסְפָ֨ה שִׂמְחָ֥ה וָ/גִ֛יל מִ/כַּרְמֶ֖ל וּ/מֵ/אֶ֣רֶץ מוֹאָ֑ב וְ/יַ֨יִן֙ מִ/יקָבִ֣ים הִשְׁבַּ֔תִּי לֹֽא יִדְרֹ֣ךְ הֵידָ֔ד הֵידָ֖ד לֹ֥א הֵידָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/033.yaml
  text: Joy and gladness have been gathered from the orchard land and from the land of Moab[a]; I have made wine cease from the winepresses. No one will tread with a shout[c][b]; the shout is no shout.
  footnotes:
  - marker: a
    text: Or 'fruitful field.' The Hebrew karmel here refers to fertile, cultivated land, not the proper name Carmel.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew shout here is the cry associated with grape-treading or harvest celebration.
    reason: cultural_note
  - marker: c
    text: 'The final clause is elliptical in Hebrew: literally, ''shout, shout—not shout,'' meaning the expected joyful vintage cry has ceased.'
    reason: lexical_alternative
translation:
  language: ko
  text: 기쁨과 즐거움이 비옥한 경작지와 모압 땅에서 거두어졌습니다[a]. 내가 포도주 짜는 틀에서 포도주가 그치게 하였습니다. 아무도 함성을 지르며 포도를 밟지 않을 것입니다[b]. 함성이 있어도 그것은 함성이 아닙니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘열매 맺는 들’. 여기서 카르멜은 갈멜산이 아니라 비옥하게 경작된 땅을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘함성’은 포도를 밟거나 수확을 축하할 때 내는 외침을 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 히브리어의 마지막 절은 매우 압축적인 표현입니다. 직역하면 ‘함성, 함성—함성이 아니다’에 가깝습니다. 이는 포도 수확 때의 기쁜 함성이 더 이상 들리지 않음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
