  rationale: 원문은 וְעַל을 반복해 대상을 차례로 쌓아 올리므로, 한국어도 그 누적감을 보존하는 편이 본문의 힘을 잘 전달합니다.
  doctrine_reference: 예레미야 48장의 모압에 대한 심판 예언
