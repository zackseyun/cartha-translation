translation:
  language: ko
  text: 그리고 기리옷과, 보스라와, 모압 땅의 모든 성읍들 — 먼 곳과 가까운 곳에 있는 것들까지 — 을 향하여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘먼 곳과 가까운 곳’, 곧 모압의 모든 성읍을 빠짐없이 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  english_pob_choice: and against
  chosen_korean: ~을 향하여
  alternatives_korean:
  - ~에 대하여
  - ~을 거슬러
  - ~을 향해
  lexicon: HALOT
  rationale: 여기서 עַל은 심판 선언의 대상 표지를 이루므로 한국어에서는 단순한 위치 관계보다 적대적 방향성을 드러내는 ‘~을 향하여’로 옮겼습니다.
- source_word: קְרִיּוֹת
  english_pob_choice: Kerioth
  chosen_korean: 기리옷
  alternatives_korean:
  - 케리옷
  - 기리오트
  lexicon: HALOT
  rationale: 고유지명으로 보아 음역했으며, 한국어 성서 용례와 음가를 고려해 ‘기리옷’으로 적었습니다.
- source_word: בָּצְרָה
  english_pob_choice: Bozrah
  chosen_korean: 보스라
  alternatives_korean:
  - 보즈라
  - 봇스라
  lexicon: HALOT
  rationale: 모압 지역의 지명으로서 고유명사 음역을 유지했습니다.
- source_word: הָרְחֹקוֹת וְהַקְּרֹבוֹת
  english_pob_choice: the far and the near
  chosen_korean: 먼 곳과 가까운 곳에 있는 것들
  alternatives_korean:
  - 먼 것과 가까운 것
  - 먼 곳과 가까운 곳
  lexicon: HALOT
  rationale: 형용사적 병렬이 앞의 ‘모압 땅의 모든 성읍들’을 받는다는 점을 한국어에서 분명히 드러내기 위해, 생략된 수식 대상을 풀어 ‘곳에 있는 것들’로 옮겼습니다.
theological_decisions:
- issue: 심판 선언의 반복 구조 표현
  chosen_reading: ‘그리고 …과 …과 …을 향하여’라는 반복을 유지해, 예언자의 누적적 심판 선포를 드러냈습니다.
  alternative_readings:
  - 세 도시와 모든 성읍에 대해
  - 기리옷과 보스라 및 모든 성읍에 대해
  rationale: 원문은 וְעַל을 반복해 대상을 차례로 쌓아 올리므로, 한국어도 그 누적감을 보존하는 편이 본문의 힘을 잘 전달합니다.
  doctrine_reference: 예레미야 48장의 모압에 대한 심판 예언
