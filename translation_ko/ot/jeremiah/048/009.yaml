  source_fidelity: 히브리어의 명령형, 강조된 부정사 절대형+동사(‘반드시 …할 것이다’), 성읍들의 황폐와 무주 상태를 전반적으로 잘 반영합니다. 다만 모압을 가리키는 ‘그는’은 한국어에서 남성 인칭으로 들려 의인화된 지명과의 연결이 부자연스럽고, צִיץ와 강조형에 관한 각주 표지가 해당 표현이 아니라 문장 끝에 함께 놓여 있어 옮기는 것이 좋습니다.
  naturalness: ‘황폐가 되어’는 현대 한국어에서 다소 명사적이고 어색합니다. ‘황폐하게 되어’가 자연스럽고 원문의 결과 상태를 충실히 전달합니다. ‘모압은’과 ‘그 성읍들’의 연결도 ‘그는/그의’보다 자연스럽습니다.
  terminology: ‘모압’, ‘성읍’, ‘날개’, ‘황폐’는 예언서 문맥에 적절합니다. ‘달아나다’는 원문의 기본 의미인 ‘나가다/떠나다’보다 구체적이지만, 날개 이미지 및 영어 POB의 ‘flee away’와 조화되며 각주가 그 문맥적 선택을 설명하므로 유지할 수 있습니다.
