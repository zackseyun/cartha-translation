source:
  edition: WLC
  text: תְּנוּ צִ֣יץ לְ/מוֹאָ֔ב כִּ֥י נָצֹ֖א תֵּצֵ֑א וְ/עָרֶ֨י/הָ֙ לְ/שַׁמָּ֣ה תִֽהְיֶ֔ינָה מֵ/אֵ֥ין יוֹשֵׁ֖ב בָּ/הֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/009.yaml
  text: Give a wing to Moab[a], for she will surely flee away; and her cities will become a desolation[b], with no inhabitant in them.
  footnotes:
  - marker: a
    text: Or 'Give a blossom/rosette to Moab'; the Hebrew noun צִיץ more commonly has senses related to a blossom or ornament, but the immediate context favors 'wings' because the next clause speaks of Moab flying away.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''going out she will go out,'' an intensified form meaning ''she will surely depart'' or, in context, ''she will surely fly away.'''
    reason: lexical_alternative
translation:
  language: ko
  text: “모압에게 날개를 주십시오. 그는 반드시 달아날 것이며, 그의 성읍들은 황폐가 되어 그 안에 사는 사람이 없을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צִיץ는 일반적으로 ‘꽃봉오리/장식’의 뜻이 있지만, 바로 뒤의 ‘반드시 달아날 것’이라는 문맥은 ‘날개’라는 비유를 더 강하게 지지합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 “나가고 또 나갈 것이다”라는 강조형으로, 문맥상 “반드시 달아날 것이다”로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ צִיץ
  english_pob_choice: Give a wing
  chosen_korean: “날개를 주십시오”
  alternatives_korean:
  - 꽃봉오리를 주십시오
  - 장식을 주십시오
  lexicon: HALOT
  rationale: צִיץ는 보통 꽃봉오리나 장식물을 뜻하지만, 바로 뒤의 ‘반드시 달아날 것’이라는 문맥이 비행 이미지를 강하게 요구하므로 ‘날개’를 택해 시적 연결을 살렸습니다.
- source_word: נָצֹא תֵּצֵא
  english_pob_choice: she will surely flee away
  chosen_korean: “반드시 달아날 것이며”
  alternatives_korean:
  - 반드시 나갈 것이며
  - 확실히 떠날 것이며
  lexicon: HALOT
  rationale: 부정절대형과 동사의 결합이 강한 강조를 나타내므로 ‘반드시’로 그 강세를 살렸고, 문맥상 도피·탈출의 뉘앙스를 ‘달아나다’로 옮겼습니다.
- source_word: לְשַׁמָּה
  english_pob_choice: a desolation
  chosen_korean: “황폐가 되어”
  alternatives_korean:
  - 폐허가 되어
  - 황무지가 되어
  lexicon: HALOT
  rationale: 예언서의 심판 공식에 해당하는 파괴 상태를 한국어에서 자연스럽고 엄중하게 드러내기 위해 ‘황폐가 되다’를 사용했습니다.
- source_word: מֵאֵין יוֹשֵׁב בָּהֵן
  english_pob_choice: with no inhabitant in them
  chosen_korean: “그 안에 사는 사람이 없을 것입니다”
  alternatives_korean:
  - 그 안에 거주하는 자가 없을 것입니다
  - 그 안에 주민이 없을 것입니다
  lexicon: HALOT
  rationale: 총체적 무주(無住) 상태를 분명히 하되, 현대 한국어에서 너무 직역적으로 어색하지 않도록 ‘사는 사람’으로 풀어 옮겼습니다.
