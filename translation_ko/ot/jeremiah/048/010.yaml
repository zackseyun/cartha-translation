base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/010.yaml
  text: Cursed is the one who does the work of Yahweh negligently[a], and cursed is the one who holds back his sword from blood.
  footnotes:
  - marker: a
    text: Or 'deceitfully.' The Hebrew רְמִיָּה can denote deceit or treachery, but in this context it likely carries the sense of slackness or negligent performance.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼의 일을 느슨하게 하는 자는 저주를 받을 것이며, 자기 칼을 피에서 거두는 자도 저주를 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘속임수로.’ 히브리어 רְמִיָּה는 ‘속임수’나 ‘배신’을 뜻할 수 있으나, 이 문맥에서는 느슨함이나 태만의 뜻이 더 적절할 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  english_pob_choice: Cursed
  chosen_korean: 저주를 받을 것이며
  alternatives_korean:
