  - 저주를 받을 자입니다
  lexicon: HALOT
  rationale: 선언문형 저주의 힘을 살리되, 현대 한국어에서 자연스러운 합쇼체 미래형으로 옮겼습니다.
- source_word: מְלֶאכֶת יְהוָה
  english_pob_choice: the work of Yahweh
  chosen_korean: 야훼의 일
