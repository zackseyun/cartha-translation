  - 속임수로
  lexicon: HALOT
  rationale: 이 문맥에서는 ‘속임수’보다 ‘느슨함/태만함’이 더 적절하므로, 행위의 부실함을 드러내는 현대적 표현을 택했습니다. 영어 주석의 대안 의미는 footnote로 보존합니다.
- source_word: מֹנֵעַ ... מִדָּם
  english_pob_choice: holds back his sword from blood
  chosen_korean: 자기 칼을 피에서 거두는 자
  alternatives_korean:
  - 자기 칼을 피에서 멈추는 자
  - 자기 칼로 피를 흘리게 하지 않는 자
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘칼을 피에서 거두다’로 옮겨, 심판 수행을 중단하거나 유보하는 구체적 이미지를 유지했습니다.
