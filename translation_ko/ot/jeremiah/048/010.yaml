  source_fidelity: 두 저주 선언의 병렬 구조와 ‘야훼의 일’, ‘칼을 피에서 거두다’라는 구체적 이미지는 대체로 원문에 충실합니다. 다만 אָרוּר는 미래의 결과를 예측하는 표현이라기보다 현재형의 저주/심판 선언이므로, ‘저주를 받을 것입니다’보다 ‘저주받습니다’가 원문의 선언적 힘과 두 절의 병행을 더 정확히 반영합니다.
  naturalness: ‘느슨하게 하는’은 이 문맥에서 다소 구어적이고 의미 범위가 넓습니다. ‘태만하게 하는’이 맡겨진 일을 해이하게 수행한다는 רְמִיָּה의 문맥상 의미를 현대 표준어로 더 자연스럽고 명확하게 전달합니다. 두 절을 각각 ‘저주받습니다’로 종결하면 현대 합쇼체의 문체와 병렬도 일관됩니다.
  terminology: ‘야훼’는 제시된 번역 원칙 및 יְהוָה에 적절합니다. ‘야훼의 일’은 מְלֶאכֶת יְהוָה를 과도하게 신학화하지 않는 적절한 번역입니다. ‘자기 칼을 피에서 거두는’은 원문의 직설적이고 불편한 전쟁 심판 이미지를 보존합니다.
