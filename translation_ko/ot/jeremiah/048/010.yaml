  lexicon: HALOT
  rationale: מְלָאכָה의 기본 의미인 ‘일/작업’을 살리면서, 본문이 말하는 야훼의 위임된 심판 행위를 간결하게 드러냈습니다.
- source_word: רְמִיָּה
  english_pob_choice: negligently
  chosen_korean: 느슨하게
  alternatives_korean:
