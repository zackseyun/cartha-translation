    text: 또는 ‘마른 곳에 앉아 있으라’ 또는 ‘마른 땅에 거하라.’ 히브리어 표현은 목마름 자체를 가리킬 수도 있고, 디본이 처하게 될 건조한 장소를 가리킬 수도 있습니다.
    reason: lexical_alternative
