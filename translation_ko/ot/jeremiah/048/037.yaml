id: JER.48.37
reference: Jeremiah 48:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֤י כָל רֹאשׁ֙ קָרְחָ֔ה וְ/כָל זָקָ֖ן גְּרֻעָ֑ה עַ֤ל כָּל יָדַ֨יִם֙ גְּדֻדֹ֔ת וְ/עַל מָתְנַ֖יִם שָֽׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/037.yaml
  text: For every head is bald[a], and every beard is cut off; on all the hands are gashes[b], and on the waist is sackcloth.
  footnotes:
  - marker: a
    text: Or 'on every hand are cuts.' The Hebrew idiom may refer broadly to the hands/arms marked by mourning gashes.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'loins'; rendered 'waist' for readable modern English while preserving the sense of sackcloth worn around the midsection.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 모든 머리가 대머리가 되고 모든 수염이 깎이며, 모든 손에 상처가 나고 허리에는 굵은 베를 두르기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용으로, 손/팔에 난 자해의 상처를 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘허리/허리둘레’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: For
  chosen_korean: 이는 ... 때문입니다
  alternatives_korean:
  - 왜냐하면 ...
  - '...이므로'
  lexicon: HALOT
  rationale: 문맥상 앞의 탄식 상태를 설명하는 인과·설명 용법이므로, 현대 한국어에서는 ‘이는 ... 때문입니다’가 가장 자연스럽고 원문의 이유 제시 기능을 잘 살립니다.
- source_word: כָל רֹאשׁ קָרְחָה
  english_pob_choice: every head is bald
  chosen_korean: 모든 머리가 대머리가 되고
  alternatives_korean:
  - 모든 머리에 대머리가 생기고
  - 모든 머리가 삭발되고
  lexicon: HALOT
  rationale: קָרְחָה는 머리의 대머리 상태를 가리키므로 ‘대머리가 되고’로 옮겨 결과 상태를 살렸습니다.
- source_word: וְכָל זָקָן גְּרֻעָה
  english_pob_choice: every beard is cut off
  chosen_korean: 모든 수염이 깎이며
  alternatives_korean:
  - 모든 수염이 잘려 나가며
  - 모든 수염이 끊기며
  lexicon: HALOT
  rationale: גְּרֻעָה는 깎이거나 잘려 줄어드는 뜻이므로, 수염을 제거하는 애도 행위를 자연스럽게 드러내는 ‘깎이며’를 택했습니다.
- source_word: עַל כָּל יָדַיִם גְּדֻדֹת
  english_pob_choice: on all the hands are gashes
  chosen_korean: 모든 손에 상처가 나고
  alternatives_korean:
  - 모든 손에 베인 자국이 있고
  - 모든 손과 팔에 상처가 나고
  lexicon: HALOT
  rationale: גְּדֻדֹת는 애도와 관련된 자해적 상처를 뜻하므로, 한국어에서는 직역보다 의미가 분명한 ‘상처가 나고’로 처리하되 손/팔을 포괄할 수 있는 여지를 남겼습니다.
- source_word: וְעַל מָתְנַיִם שָׂק
  english_pob_choice: and on the waist is sackcloth
  chosen_korean: 허리에는 굵은 베를 두르기 때문입니다
  alternatives_korean:
  - 허리에는 베옷을 입기 때문입니다
  - 허리에는 삼베를 두르기 때문입니다
  lexicon: HALOT
  rationale: מָתְנַיִם은 허리·허리둘레를 가리키며, שָׂק은 애도용 자루천이므로 현대 독자가 이해하기 쉬운 ‘굵은 베를 두르다’로 옮겼습니다.
theological_decisions:
- issue: 애도 풍습의 직접적 표기
  chosen_reading: 수염을 깎고, 손에 상처를 내며, 허리에 베를 두르는 애도 행위를 그대로 드러냈습니다.
  alternative_readings:
  - 완화하여 ‘슬퍼하며’로만 옮길 수 있음
  - 문화적 설명을 본문에 덧붙일 수 있음
  rationale: 예레미야 48:37은 모압의 애도 표지를 열거하는 시적 예언으로, 상징을 완화하면 원문의 충격과 역사적 관습이 약해집니다.
  doctrine_reference: 예언문맥의 표상성과 고대 근동 애도 관습
- issue: ‘대머리’와 ‘깎이다’의 병렬 유지
  chosen_reading: 머리의 대머리 상태와 수염의 제거를 병렬로 살렸습니다.
  alternative_readings:
  - 둘 다 ‘삭발하다’로 통일
  - 둘 다 비유적으로 처리
  rationale: 히브리어 평행법이 머리와 수염을 별도로 제시하므로, 한국어에서도 서로 다른 표현으로 병렬감을 유지하는 것이 원문 구조에 더 충실합니다.
  doctrine_reference: 히브리 시적 평행법
