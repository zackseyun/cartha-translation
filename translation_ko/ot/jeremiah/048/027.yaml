  to: 이스라엘이 너에게 웃음거리였습니까? 그가 도둑들 가운데서 발견되었습니까? 네가 그에 대하여 말할 때마다 너는 머리를 흔들었습니다.[a]
  rationale: 마지막 절에서 부당한 인과 표현을 제거하고, 반복을 나타내는 ‘-할 때마다’에 대응하는 주절을 직접 연결했습니다. 이스라엘을 의인화한 히브리어의 단수 지시를 한국어에서도 ‘그가’로 드러냈습니다. 각주는 동사의 가능한 대안을 보존하면서 본문의 문맥상 번역을 설명합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:25:46Z'
