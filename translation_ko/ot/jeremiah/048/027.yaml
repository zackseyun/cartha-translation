id: JER.48.27
reference: Jeremiah 48:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אִ֣ם ל֣וֹא הַ/שְּׂחֹ֗ק הָיָ֤ה לְ/ךָ֙ יִשְׂרָאֵ֔ל אִם בְּ/גַנָּבִ֖ים נמצאה כִּֽי מִ/דֵּ֧י דְבָרֶ֥י/ךָ בּ֖/וֹ תִּתְנוֹדָֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/027.yaml
  text: Was Israel not a laughingstock to you? Was he found among thieves[a], that whenever you spoke of him, you shook your head?
  footnotes:
  - marker: a
    text: Or 'you wagged your head.' The Hebrew verb can denote shaking or tossing oneself, here likely a gesture of scorn.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘이 너에게 웃음거리였습니까? 그가 도둑들 가운데서 발견되었습니까? 네가 그에 대하여 말할 때마다 너는 머리를 흔들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘머리를 흔들었습니다’는 경멸의 몸짓을 가리킵니다. 히브리어 동사는 ‘몸을 흔들다’ 또는 ‘몸을 비틀다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׂחֹק
  english_pob_choice: a laughingstock
  chosen_korean: 웃음거리
  alternatives_korean:
  - 조롱거리
  - 비웃음거리
  lexicon: HALOT
  rationale: ‘웃음거리’는 모욕과 조롱의 대상이 되었다는 뜻을 자연스럽게 살리며, 단순한 ‘웃음’보다 문맥상 더 정확합니다.
- source_word: הָיָה לְךָ
  english_pob_choice: was ... to you
  chosen_korean: 너에게 …였습니까
  alternatives_korean:
  - 네게 …이 되었습니까
  - 너에게 …로 여겨졌습니까
  lexicon: HALOT
  rationale: 히브리어의 관계적 관용구를 살려, 모압의 시각에서 이스라엘이 무엇이었는지 직접 묻는 구조로 옮겼습니다.
- source_word: בְּגַנָּבִים
  english_pob_choice: among thieves
  chosen_korean: 도둑들 가운데서
  alternatives_korean:
  - 도둑들 틈에
  - 도둑들 무리 가운데서
  lexicon: HALOT
  rationale: ‘가운데서’는 위치 표현을 가장 직역에 가깝게 살리면서도 한국어로 자연스럽습니다.
- source_word: דְבָרֶיךָ בּוֹ
  english_pob_choice: you spoke of him
  chosen_korean: 네가 그에 대해 말할 때마다
  alternatives_korean:
  - 네가 그를 말할 때마다
  - 그에 대해 네가 말할 때마다
  lexicon: HALOT
  rationale: 히브리어의 ‘그에 대한 말함’이라는 관용을 한국어로 풀어, 반복적 발화를 나타내는 ‘-할 때마다’로 반복성을 반영했습니다.
- source_word: תִּתְנוֹדָד
  english_pob_choice: you shook your head
  chosen_korean: 머리를 흔들었기 때문입니다
  alternatives_korean:
  - 고개를 흔들었기 때문입니다
  - 머리를 젓기 때문입니다
  lexicon: HALOT
  rationale: 경멸의 몸짓을 드러내는 동작을 한국어 관용인 ‘머리를 흔들다’로 옮겨, 조롱의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 모압의 조롱을 직접 인용하는 수사 구조
  chosen_reading: 질문 형식을 유지해, 모압이 이스라엘을 경멸한 태도를 독자가 그대로 듣게 했습니다.
  alternative_readings:
  - 평서문으로 완화해 ‘이스라엘은 너에게 웃음거리였습니다’라고 옮기는 방식
  - 조롱의 의미를 설명문처럼 덧붙이는 방식
  rationale: 예언 본문의 비난 수사는 수사적 질문 자체가 의미를 전달하므로, 이를 평서로 평탄화하지 않고 보존했습니다.
  doctrine_reference: 예레미야 48장의 심판 신탁과 조롱의 반전 구조
