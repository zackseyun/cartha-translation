id: JER.48.1
reference: Jeremiah 48:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְ/מוֹאָ֡ב כֹּֽה אָמַר֩ יְהוָ֨ה צְבָא֜וֹת אֱלֹהֵ֣י יִשְׂרָאֵ֗ל ה֤וֹי אֶל נְבוֹ֙ כִּ֣י שֻׁדָּ֔דָה הֹבִ֥ישָׁה נִלְכְּדָ֖ה קִרְיָתָ֑יִם הֹבִ֥ישָׁה הַ/מִּשְׂגָּ֖ב וָ/חָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/001.yaml
  text: 'Concerning Moab: Thus says Yahweh of hosts[a], the God of Israel: Woe to Nebo, for it is devastated. Kiriathaim is put to shame; it is captured[b]. The stronghold is put to shame and shattered.'
  footnotes:
  - marker: a
    text: Or 'Against Moab' at the heading.
    reason: alternative_reading
  - marker: b
    text: Or 'Misgab,' if taken as a place name rather than 'the stronghold.'
    reason: alternative_reading
translation:
  language: ko
  text: '모압에 대하여[a]: 이스라엘의 하나님이신 만군의 야훼께서 이렇게 말씀하십니다. “네보에 화가 있습니다! 네보가 황폐되었기 때문입니다. 기랴다임은 수치를 당하였으며 함락되었습니다. 요새[b]는 수치를 당하고 부서졌습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 제목에서 ‘모압을 거슬러’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘미스갑’이라는 지명으로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: לְמוֹאָב
  english_pob_choice: Concerning Moab
  chosen_korean: 모압에 대하여
  alternatives_korean:
  - 모압을 향하여
  - 모압에 대해
  - 모압을 거슬러
  lexicon: HALOT
  rationale: 예언 서문의 לְ는 문맥상 심판을 포함할 수 있지만, 전치사 자체는 넓은 범위를 가지므로 ‘대하여’로 옮겨 헤딩의 형식을 보존했습니다.
- source_word: יְהוָה צְבָאֹות
  english_pob_choice: Yahweh of hosts
  chosen_korean: 만군의 야훼
  alternatives_korean:
  - 만군의 주님
  - 만군의 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮기고, צְבָאוֹת는 군대/천상 권세를 포괄하는 관용적 칭호로서 ‘만군의’로 반영했습니다.
- source_word: הוֹי
  english_pob_choice: Woe to
  chosen_korean: 화가 있을 것입니다
  alternatives_korean:
  - 슬프다
  - 오호라
  - 재앙이 있을 것입니다
  lexicon: HALOT
  rationale: 예언적 경고·애가의 탄식을 현대 한국어의 자연스러운 심판 선포로 옮기되, 단순 감탄사보다 경고의 힘이 드러나도록 했습니다.
- source_word: שֻׁדָּדָה
  english_pob_choice: it is devastated
  chosen_korean: 황폐되었기 때문입니다
  alternatives_korean:
  - 파괴되었기 때문입니다
  - 멸망했기 때문입니다
  - 약탈당했기 때문입니다
  lexicon: HALOT
  rationale: שׁדד의 결과를 ‘황폐’로 넓게 잡아, 약탈·파괴를 모두 포함하는 심판의 상태를 반영했습니다.
- source_word: הֹבִישָׁה
  english_pob_choice: is put to shame
  chosen_korean: 수치를 당하였고
  alternatives_korean:
  - 부끄러움을 당하였고
  - 망신을 당하였고
  - 수치스러워졌고
  lexicon: HALOT
  rationale: 히필/사역형의 ‘수치에 떨어뜨림’은 내적 감정보다 외적 굴욕 상태를 가리키므로, 수동적으로 ‘수치를 당하다’로 옮겼습니다.
- source_word: הַמִּשְׂגָּב
  english_pob_choice: The stronghold
  chosen_korean: 요새는
  alternatives_korean:
  - 산성은
  - 피난처는
  - 미스갑은
  lexicon: HALOT
  rationale: 정관사와 일반 명사 용법을 따라 지명보다 보통명사로 보고 ‘요새’로 번역했습니다.
- source_word: וָחָתָּה
  english_pob_choice: and shattered
  chosen_korean: 부서졌습니다
  alternatives_korean:
  - 산산이 깨졌습니다
  - 무너졌습니다
  - 두려움에 떨었습니다
  lexicon: HALOT
  rationale: 문맥의 평행구조상 ‘황폐/수치/함락’에 이어지는 결말을 물리적 붕괴로 살려 ‘부서지다’로 옮겼습니다.
theological_decisions:
- issue: 예언 서문의 לְ를 어떻게 처리할지
  chosen_reading: ‘모압에 대하여’로 옮겨, 본문이 특정 대상에 관한 심판 신탁임을 드러내되 전치사 자체의 폭은 유지했습니다.
  alternative_readings:
  - ‘모압을 거슬러’
  - ‘모압에 대해’
  rationale: 본문은 분명 심판 맥락이지만, 서문 전치사만으로 공격성을 과도하게 단정하지 않도록 했습니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: הַמִּשְׂגָּב의 이해
  chosen_reading: 지명보다 일반 명사 ‘요새’로 읽었습니다.
  alternative_readings:
  - 지명 ‘미스갑’
  rationale: 정관사와 어휘적 사용이 장소명보다 성채/요새의 의미를 더 자연스럽게 지지하므로, 본문이 묘사하는 방어 거점의 붕괴를 직접 드러냈습니다.
  doctrine_reference: Translation philosophy §3, §5
