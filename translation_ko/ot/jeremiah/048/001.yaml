revisions:
- from: '모압에 대하여: 만군의 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 「네보에 화가 있을 것입니다. 그것이 황폐되었기 때문입니다. 기랴다임은 수치를 당하였고, 함락되었습니다. 요새는 수치를 당하고 부서졌습니다.」[a][b]'
  to: '모압에 대하여[a]: 이스라엘의 하나님이신 만군의 야훼께서 이렇게 말씀하십니다. “네보에 화가 있습니다! 네보가 황폐되었기 때문입니다. 기랴다임은 수치를 당하였으며 함락되었습니다. 요새[b]는 수치를 당하고 부서졌습니다.”'
  rationale: 원문의 서문, 신명 칭호, 지명 음역 및 ‘요새’의 일반명사 해석은 유지했습니다. 다만 הוֹי의 선포성과 완료형 심판 동사의 양상을 더 충실하게 반영하고, 한국어 문장 연결을 자연스럽게 다듬었으며, 각주 표지를 해당 어구에 정확히 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T17:24:40Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 히브리어의 전치사 לְ는 ‘모압에 대하여’로 적절히 보존되었고, 신명 및 ‘만군’ 칭호도 충실합니다. 다만 הוֹי와 완료형 수동 동사들의 심판 선언은 미래형 ‘화가 있을 것입니다’보다 현재의 선포와 완료된(예언적 완료를 포함하는) 상태로 옮기는 편이 더 가깝습니다. הַמִּשְׂגָּב는 본문에서 일반명사 ‘요새’로 옮기고 지명 해석을 각주로 남기는 것이 타당합니다.
  naturalness: 현대 표준어 합쇼체로 문장을 다듬었습니다. ‘이스라엘의 하나님이신 만군의 야훼’는 원문의 동격 관계를 자연스럽게 드러내며, 각주 표지는 해당 단어·구절 바로 뒤에 배치했습니다.
  terminology: ‘야훼’, ‘만군’, ‘수치를 당하다’, ‘함락되다’, ‘요새’는 본문의 신명·군사적 심판 어휘와 한국어 성경 문체에 모두 적절합니다. ‘미스갑’은 본문에 단정적으로 채택하지 않고 대안 독법으로 각주 처리했습니다.
  issues:
  - severity: medium
    issue: ‘화가 있을 것입니다’가 הוֹי의 직접적 선언과 뒤따르는 완료형 심판 묘사를 미래 예측으로 약화합니다.
    rationale: הוֹי는 ‘화가 있다’라는 탄식·고발의 선포이며, שֻׁדָּדָה 등은 완료형입니다. 예언 문맥에서 그 완료형은 확실한 심판을 나타낼 수 있으므로 한국어도 ‘화가 있습니다’ 및 ‘황폐되었습니다’로 옮기는 것이 더 충실합니다.
  - severity: low
    issue: 각주 표지 [a], [b]가 본문 끝에 함께 놓여 있어 각각의 대안 독법이 가리키는 위치가 불명확합니다.
    rationale: '[a]는 제목의 ‘모압에 대하여’에, [b]는 ‘요새’에 붙여야 독자가 대안 독법의 적용 대상을 즉시 알 수 있습니다.'
  - severity: low
    issue: ‘만군의 야훼, 이스라엘의 하나님께서’는 동격 구조가 다소 불안정하게 읽힙니다.
    rationale: ‘이스라엘의 하나님이신 만군의 야훼께서’로 정리하면 원문의 ‘만군의 야훼, 이스라엘의 하나님’이라는 동격을 자연스럽고 명확하게 전달합니다.
