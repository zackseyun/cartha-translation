source:
  edition: WLC
  text: נִגְדְּעָה֙ קֶ֣רֶן מוֹאָ֔ב וּ/זְרֹע֖/וֹ נִשְׁבָּ֑רָה נְאֻ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/025.yaml
  text: The horn of Moab is cut off[a], and his arm is broken, declares Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'horn' and 'arm' are metaphors for strength and power.
    reason: lexical_alternative
translation:
  language: ko
  text: 모압의 뿔이 잘려 나가고[a], 그의 팔이 부러졌습니다. 야훼의 말씀입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿔’과 ‘팔’은 여기서 힘과 권세를 가리키는 비유입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגְדְּעָה / קֶרֶן
  english_pob_choice: is cut off / horn
  chosen_korean: 뿔이 잘려 나가고
  alternatives_korean:
  - 뿔이 꺾이고
  - 뿔이 잘리고
  lexicon: HALOT
  rationale: קֶרֶן은 문자적으로 ‘뿔’이지만, 예언시에서 힘과 권세의 상징으로 쓰입니다. 본문은 상징을 살리되 한국어로는 ‘잘려 나가다’가 패배와 상실의 이미지를 자연스럽게 드러냅니다.
- source_word: וּזְרֹעוֹ
  english_pob_choice: and his arm
  chosen_korean: 그의 팔이
  alternatives_korean:
  - 그의 힘이
  - 그 팔이
  lexicon: HALOT
  rationale: זְרוֹעַ는 문자적 ‘팔’이면서 군사력과 힘을 뜻하는 은유이므로, 본문에서는 은유를 유지해 직역했습니다.
- source_word: נִשְׁבָּרָה
  english_pob_choice: is broken
  chosen_korean: 부러졌습니다
  alternatives_korean:
  - 깨졌습니다
  - 산산이 부서졌습니다
  lexicon: HALOT
  rationale: שבר의 피동은 ‘부러지다/깨지다’의 의미인데, 팔과의 결합에서는 ‘부러지다’가 가장 자연스럽고 평행구조도 잘 살립니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: נְאֻם은 예언적 공식을 이루는 종결 표지이므로, 현대 한국어에서는 ‘말씀입니다’가 간결하면서도 엄숙한 어조를 유지합니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 신명기적 예언 화법의 하나님 이름을 직접 사용하므로, POB 기준에 따라 가리킴을 약화하는 ‘주님’ 대신 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: ‘뿔’과 ‘팔’의 상징성 보존
  chosen_reading: 문자적 표현을 유지하되 권세/힘의 은유로 읽히도록 둡니다.
  alternative_readings:
  - 의미를 풀어 ‘권세’와 ‘힘’으로 번역
  - 주석 없이 문자 그대로만 옮김
  rationale: 문맥상 모압의 군사적·정치적 힘이 꺾였다는 뜻이지만, מקור의 시적 이미지를 평탄화하지 않고 독자가 은유를 인지할 수 있게 유지하는 것이 더 충실합니다.
  doctrine_reference: 'POB translation principle: preserve source imagery when the metaphor is clear'
