source:
  edition: WLC
  text: עַ֣ל כָּל גַּגּ֥וֹת מוֹאָ֛ב וּ/בִ/רְחֹבֹתֶ֖י/הָ כֻּלֹּ֣/ה מִסְפֵּ֑ד כִּֽי שָׁבַ֣רְתִּי אֶת מוֹאָ֗ב כִּ/כְלִ֛י אֵֽין חֵ֥פֶץ בּ֖/וֹ נְאֻם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jeremiah/048/038.yaml
  text: On all the rooftops of Moab and in her squares[a], everywhere there is mourning; for I have broken Moab like a vessel in which there is no delight, declares Yahweh.
  footnotes:
  - marker: a
    text: Or, 'like a vessel that no one wants.' The Hebrew literally says, 'like a vessel in which there is no delight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 모압의 모든 지붕 위와 그 광장들에는 어디에나 애곡이 있습니다. 내가 모압을 아무도 원하지 않는 그릇처럼 깨뜨렸기 때문입니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘광장들’은 넓은 공적 공간을 가리키는 רְחוֹבֹת를 따른 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: גַּגּוֹת
  english_pob_choice: rooftops
  chosen_korean: 지붕 위
  alternatives_korean:
  - 옥상들
  - 지붕들
  lexicon: HALOT
  rationale: 복수형 ‘지붕들’의 물리적 이미지를 살리되, 한국어에서는 ‘지붕 위’가 공중의 공개적 장소라는 느낌을 자연스럽게 전달합니다.
- source_word: רְחֹבֹתֶיהָ
  english_pob_choice: her squares
  chosen_korean: 그녀의 광장들
  alternatives_korean:
  - 그녀의 거리들
  - 그녀의 열린 공간들
  lexicon: HALOT
  rationale: רְחוֹב은 좁은 ‘거리’보다 넓은 공적 공간을 가리키므로, POB의 ‘squares’를 따라 ‘광장들’로 옮기는 것이 장면을 더 잘 보존합니다.
- source_word: כֻּלֹּה מִסְפֵּד
  english_pob_choice: everywhere there is mourning
  chosen_korean: 온통 슬픔만 가득합니다
  alternatives_korean:
  - 어디나 애곡뿐입니다
  - 사방이 애통입니다
  lexicon: HALOT
  rationale: 총체성을 강조하는 표현이므로, 장소 전체가 애도에 잠겼다는 의미를 한국어 관용에 맞게 압축했습니다.
- source_word: שָׁבַרְתִּי
  english_pob_choice: I have broken
  chosen_korean: 내가 ... 깨어
  alternatives_korean:
  - 내가 ... 부서뜨렸습니다
  - 내가 ... 산산조각냈습니다
  lexicon: HALOT
  rationale: 완료형의 단정성을 살리면서, כלי 비유와 연결되는 ‘깨어’가 무용화된 그릇 이미지를 자연스럽게 전달합니다.
- source_word: כִּכְלִי אֵין חֵפֶץ בּוֹ
  english_pob_choice: like a vessel in which there is no delight
  chosen_korean: 아무도 기뻐하지 않는 그릇처럼
  alternatives_korean:
  - 기쁨이 없는 그릇처럼
  - 아무도 원하지 않는 그릇처럼
  lexicon: HALOT
  rationale: POB의 주해에 따르면 직역은 ‘그 안에 기쁨/기쁨의 대상이 없는 그릇’이지만, 한국어에서는 ‘아무도 기뻐하지 않는’이 버려진 물건의 무가치함을 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 문서의 기본 원칙에 따라 신적 고유명사는 ‘야훼’로 옮겨, 칭호 ‘주’로 대체하지 않고 신명 자체를 보존합니다.
theological_decisions:
- issue: 파괴 비유의 강도와 하나님의 행위
  chosen_reading: 하나님이 모압을 의도적으로 무용한 그릇처럼 깨뜨리시는 심판의 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 전쟁 피해의 묘사로 약화하는 읽기
  - 비유를 완화해 ‘손상하다’ 정도로 읽는 방식
  rationale: 히브리어 완료형과 ‘그릇’ 비유는 단순 손상이 아니라 사용 불가능한 상태로 만드는 심판을 가리키므로, 그 강도를 유지했습니다.
  doctrine_reference: 예언서의 심판 언어와 하나님의 주권적 행위
