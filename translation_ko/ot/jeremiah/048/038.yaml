  source_fidelity: ‘그녀의 광장들’은 한국어에서 무생물 국가명에 부자연스러운 인칭 대명사를 사용합니다. 또한 ‘아무도 기뻐하지 않는’은 חֵפֶץ의 ‘원함/좋아함’의 뜻을 다소 어색하게 옮깁니다. ‘애곡’과 ‘아무도 원하지 않는 그릇’은 원문의 공적 애도와 무가치한 그릇 비유를 더 정확히 전달합니다.
