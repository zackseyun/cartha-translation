id: 2KI.6.11
reference: 2 Kings 6:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּסָּעֵר֙ לֵ֣ב מֶֽלֶךְ אֲרָ֔ם עַל הַ/דָּבָ֖ר הַ/זֶּ֑ה וַ/יִּקְרָ֤א אֶל עֲבָדָי/ו֙ וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם הֲ/לוֹא֙ תַּגִּ֣ידוּ לִ֔/י מִ֥י מִ/שֶּׁ/לָּ֖/נוּ אֶל מֶ֥לֶךְ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/011.yaml
  text: The heart of the king of Aram was greatly troubled over this matter[a], and he called his servants and said to them, “Will you not tell me who among us is for the king of Israel?”
  footnotes:
  - marker: a
    text: Or “is on the side of the king of Israel.” The Hebrew expression is terse and implies allegiance or collusion.
    reason: lexical_alternative
translation:
  language: ko
  text: 아람 왕의 마음이 이 일로 크게 동요하였고, 그는 자기 종들을 불러 그들에게 말하였습니다. 「너희가 우리 가운데서 누가 이스라엘 왕 편에 있느냐를 내게 말하지 않겠느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이스라엘 왕 편에 있는 것이냐.” 히브리어 표현은 짧아서, 충성이나 공모의 뉘앙스를 암시합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּעֵר לֵב
  english_pob_choice: was greatly troubled
  chosen_korean: 마음이 … 크게 동요하였고
  alternatives_korean:
  - 마음이 크게 괴로워하였고
  - 마음이 심히 흔들렸고
  - 마음이 크게 격분하였고
  lexicon: HALOT
  rationale: לֵב을 ‘마음’으로 살리고, וַיִּסָּעֵר의 내적 소란을 ‘동요하다’로 옮겨 분노만이 아니라 심리적 동요까지 반영했습니다.
- source_word: עַל הַדָּבָר הַזֶּה
  english_pob_choice: over this matter
  chosen_korean: 이 일로
  alternatives_korean:
  - 이 문제 때문에
  - 이 사건 때문에
  - 이 일에 관하여
  lexicon: HALOT
  rationale: דָּבָר를 여기서는 구어적 ‘일’로 옮기면 자연스럽고, 원문의 원인-대상 관계도 충분히 드러납니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 종들
  alternatives_korean:
  - 자기 신하들
  - 자기 시종들
  - 자기 관리들
  lexicon: HALOT
  rationale: 궁정 맥락이지만 עֲבָדִים의 기본값인 ‘종’을 유지해 원문의 어휘 연결을 살렸습니다.
- source_word: מִי מִשֶּׁלָּנוּ אֶל מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: who among us is for the king of Israel
  chosen_korean: 우리 가운데서 누가 이스라엘 왕 편에 있느냐
  alternatives_korean:
  - 우리 편 가운데 누가 이스라엘 왕 쪽이냐
  - 우리 중 누가 이스라엘 왕과 내통하느냐
  - 우리 가운데 누가 이스라엘 왕을 돕고 있느냐
  lexicon: HALOT
  rationale: מִשֶּׁלָּנוּ의 ‘우리 가운데서’와, אֶל מֶלֶךְ יִשְׂרָאֵל의 암시된 충성/가담을 ‘편에 있느냐’로 옮겨 영어 POB의 해석을 반영했습니다.
theological_decisions:
- issue: 아람 왕의 추궁이 ‘배신자’ 색채를 띠는 표현의 강도
  chosen_reading: 직설적 고발보다 ‘편에 있느냐’로 옮겨, 본문이 암시하는 충성 문제를 드러내되 본문의 간접성을 유지했습니다.
  alternative_readings:
  - ‘이스라엘 왕과 내통하느냐’
  - ‘이스라엘 왕 편을 드느냐’
  rationale: 히브리어는 짧고 생략적인 질문이므로, 해석을 과도하게 확대하지 않으면서도 실제 의미인 편가름/가담을 전달하는 것이 적절합니다.
  doctrine_reference: 본문 해석과 어조의 절제
