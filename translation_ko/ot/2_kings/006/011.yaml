  to: 아람 왕의 마음이 이 일로 크게 동요하였습니다. 그는 자기 신하들을 불러 그들에게 말하였습니다. 「우리 가운데 누가 이스라엘 왕 편인가[a]를 내게 말하지 않겠느냐?」
  rationale: 문장의 의미와 원문의 절제된 의심을 유지하면서, 왕궁 맥락에 맞게 ‘종들’을 ‘신하들’로 다듬고 인용문의 의문절을 자연스럽게 고쳤습니다. 각주 표지도 설명 대상인 ‘이스라엘 왕 편’에 붙여 참조 범위를 분명히 했습니다.
