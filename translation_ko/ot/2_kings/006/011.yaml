    rationale: עֲבָדָיו는 문자적으로 ‘그의 종들’이지만, 왕궁 문맥에서는 왕에게 봉사하는 신하·관리들을 가리킬 수 있습니다. ‘신하들’이 현대 한국어에서 자연스럽고 의미를 좁히지 않습니다.
  - severity: low
    issue: 인용문 의문절의 표현
    rationale: “누가 … 있느냐를”보다 “누가 … 편인가를”이 더 간결하고 자연스럽습니다. 양쪽 모두 원문의 생략된 소속·충성 관계를 보존합니다.
  - severity: low
    issue: 각주 표지의 범위
    rationale: 각주는 ‘이스라엘 왕 편’이라는 해석적 표현에 직접 붙이는 편이, 해당 히브리어 구절의 충성/공모 뉘앙스를 설명한다는 점을 명확히 합니다.
