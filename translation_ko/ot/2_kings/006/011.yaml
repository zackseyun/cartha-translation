review_pass:
  verdict: revise
  source_fidelity: 히브리어의 내적 동요, 왕의 측근 소집, 그리고 내부자가 이스라엘 왕에게 기울었다는 의심을 전반적으로 충실히 반영합니다. 다만 왕궁 문맥의 עֲבָדָיו는 단순한 노예 신분의 ‘종들’보다 ‘신하들’이 더 자연스럽고 문맥상 정확합니다.
  naturalness: 초안의 “누가 이스라엘 왕 편에 있느냐를 내게 말하지 않겠느냐”는 이해되지만, 의문절 명사화와 ‘편에 있다’의 결합이 다소 무겁습니다. “누가 이스라엘 왕 편인가를 내게 말하지 않겠느냐”가 현대 표준어 합쇼체 문장으로 더 자연스럽습니다.
  terminology: ‘마음’, ‘동요하다’, ‘아람 왕’, ‘이스라엘 왕’은 적절합니다. 왕의 궁정 구성원인 עֲבָדָיו는 이 문맥에서 ‘신하들’로 옮기는 것이 한국어의 역사적·사회적 용례에 맞으며 원문의 왕실 봉신/관리 의미를 잘 전달합니다.
  issues:
