  text: 한 사람이 통나무를 베고 있을 때에, 쇠[a]가 물에 떨어졌습니다. 그가 소리쳐 말했습니다. 「아, 주인님! 이것은 빌린 것입니다!」
  philosophy: optimal-equivalence
  footnotes:
