  yaml_path: translation/ot/2_kings/006/005.yaml
  text: But as one was felling a beam[a], the iron fell into the water, and he cried out and said, “Alas, my master! It was borrowed.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'the iron fell into the water.' The phrase refers to the iron part of the tool, that is, the axe head.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 들보를 찍어 내리고 있었는데, 쇠붙이가 물에 떨어졌습니다. 그가 소리쳐 말했습니다. 「아, 내 주인이여! 빌려온 것입니다!」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘쇠가 물에 떨어졌다’라고 말합니다. 여기서는 도구의 쇠 부분, 곧 도끼날을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַפִּיל הַקּוֹרָה
  english_pob_choice: was felling a beam
  chosen_korean: 들보를 찍어 내리고 있었는데
  alternatives_korean:
  - 나무를 베고 있었는데
  - 들보를 떨어뜨리고 있었는데
  - 보를 베고 있었는데
  lexicon: HALOT
  rationale: חִ필형 분사 מַפִּיל은 여기서 단순한 ‘떨어뜨리다’보다 나무를 베어 넘어뜨리는 작업을 가리키므로, 문맥을 살려 ‘찍어 내리다’로 옮겼습니다.
- source_word: הַבַּרְזֶל
  english_pob_choice: the iron
  chosen_korean: 쇠붙이
  alternatives_korean:
  - 쇠
  - 철
  - 도끼날
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘그 쇠’라고 하지만, 맥락상 도구의 쇠 부분을 가리키는 메토님이므로 한국어에서는 의미를 드러내는 ‘쇠붙이’로 옮겼습니다.
- source_word: אֲהָהּ
  english_pob_choice: Alas
  chosen_korean: 아
  alternatives_korean:
  - 아이고
  - 슬프도다
  - 오
  lexicon: HALOT
  rationale: 감탄사 아ֲהָהּ의 놀람과 절박함을 살리면서도 현대 한국어에서 지나치게 구어적이지 않은 짧은 탄식으로 처리했습니다.
- source_word: שָׁאוּל
  english_pob_choice: borrowed
  chosen_korean: 빌려온 것입니다
  alternatives_korean:
  - 빌린 것입니다
  - 빌려 쓰던 것입니다
  - 빌렸습니다
  lexicon: HALOT
  rationale: שָׁאוּל은 소유권이 없는 상태를 강조하므로, 잃어버린 물건이 자기 것이 아님을 분명히 하는 ‘빌려온 것입니다’가 문맥에 가장 자연스럽습니다.
theological_decisions:
- issue: 엘리사에 대한 호칭
  chosen_reading: 내 주인이여
  alternative_readings:
  - 내 주님이여
  - 선생님이여
  - 주여
  rationale: 본문의 אֲדֹנִי는 예언자에 대한 예의 있는 상위 호칭으로, 신적 호칭과 구별되도록 ‘내 주인이여’로 옮겼습니다.
  doctrine_reference: 서술 문맥에서의 인간 상전/주인 호칭과 주님 호칭의 구별
- issue: 도구의 상실에 대한 절박한 외침
  chosen_reading: 소리쳐 말했습니다
  alternative_readings:
  - 외쳤습니다
  - 부르짖었습니다
  rationale: 단순한 감탄이 아니라 잃어버린 물건에 대한 즉각적이고 절박한 반응임을 드러내되, 과도한 종교적 어휘로 확대하지 않았습니다.
  doctrine_reference: 본문 서사 문맥
