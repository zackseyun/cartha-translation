source:
  edition: WLC
  text: נֵֽלְכָה נָּ֣א עַד הַ/יַּרְדֵּ֗ן וְ/נִקְחָ֤ה מִ/שָּׁם֙ אִ֚ישׁ קוֹרָ֣ה אֶחָ֔ת וְ/נַעֲשֶׂה לָּ֥/נוּ שָׁ֛ם מָק֖וֹם לָ/שֶׁ֣בֶת שָׁ֑ם וַ/יֹּ֖אמֶר לֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/002.yaml
  text: Please let us go to the Jordan[a], and let each man take from there one beam, and let us make a place for ourselves there to dwell there." And he said[c][b], "Go."
  footnotes:
  - marker: a
    text: Or 'Come, let us go to the Jordan.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'each man one beam,' that is, each person would take a single timber.
    reason: lexical_alternative
  - marker: c
    text: Or 'to dwell there.'
    reason: lexical_alternative
translation:
  language: ko
  text: “부디 우리가 요단까지 가게 해 주십시오. 그리고 거기서 각 사람이 한 개씩 들보를 가져다가, 거기에 우리가 머물 장소를 만들게 합시다.” 그가 말했습니다. “가라.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֵלְכָה נָּא
  english_pob_choice: Please let us go
  chosen_korean: 부디 우리가 가게 해 주십시오
  alternatives_korean:
  - 우리가 가게 해 주십시오
  - 제발 우리가 가게 해 주십시오
  lexicon: HALOT
  rationale: 청유형 1인칭 복수에 나(נא)의 공손한 요청 뉘앙스를 살려 현대 한국어의 정중한 부탁으로 옮겼습니다.
- source_word: עַד הַיַּרְדֵּן
  english_pob_choice: to the Jordan
  chosen_korean: 요단까지
  alternatives_korean:
  - 요단강까지
  - 요단으로
  lexicon: HALOT
  rationale: 여행 맥락의 עַד는 도착 지점을 나타내므로, 자연스러운 한국어로 ‘까지’로 처리했습니다.
- source_word: אִישׁ קוֹרָה אֶחָת
  english_pob_choice: each man ... one beam
  chosen_korean: 각 사람이 한 개씩 들보를
  alternatives_korean:
  - 각 사람마다 한 들보를
  - 사람마다 한 개의 들보를
  lexicon: HALOT
  rationale: 아יש의 분배적 용법을 ‘각 사람’으로 풀고, קוֹרָה는 건축용 재목이라는 점을 살려 ‘들보’로 옮겼습니다.
- source_word: לָשֶׁבֶת שָׁם
  english_pob_choice: to dwell there
  chosen_korean: 거기에 우리가 머물
  alternatives_korean:
  - 거기서 우리가 거주할
  - 거기서 우리가 살
  lexicon: HALOT
  rationale: ישב의 거주/체류 의미를 살리되, 현대 한국어에서는 ‘머물다’가 가장 자연스럽고 문체도 맞습니다.
