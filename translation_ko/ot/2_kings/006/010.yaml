theological_decisions:
- issue: 왕의 행동이 단순한 정보 수신인지 군사적 경계인지
  chosen_reading: 본문은 왕이 경고를 받은 뒤 해당 장소에 대해 지속적으로 경계 태세를 유지했음을 말합니다.
  alternative_readings:
  - 단순히 조심했다는 일반적 주의
  - 그곳을 수색하거나 감시했다는 강한 군사적 읽기
  rationale: 히브리어 ונשמר의 반사적 의미와 문맥상 반복성은 단순한 심리 상태보다 실제 경계/주의 조치를 가리키지만, 본문이 구체적 행위를 명시하지 않으므로 ‘경계하고 있었습니다’로 절제해 옮겼습니다.
  doctrine_reference: 문맥 기반 서술 이해
