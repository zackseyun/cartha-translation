base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/010.yaml
  text: So the king of Israel sent to the place about which the man of God had spoken to him and warned him[c][b][a], and he kept himself on guard there—not once or twice.
  footnotes:
  - marker: a
    text: Or, 'sent to the place'; the Hebrew verb is simply 'sent,' and the exact object is implicit in context.
    reason: lexical_alternative
  - marker: b
    text: Or, 'he was on his guard there.' The Hebrew may emphasize either the king's guardedness or his taking precautions at that place.
    reason: lexical_alternative
  - marker: c
    text: Or 'sent word to the place'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘 왕은 하나님의 사람이 그에게 말하며 경고한 그곳으로 보냈습니다. 그리고 그는 거기서 한 번도 두 번도 아니라 늘 경계하고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보냈습니다’는 히브리어 동사만 옮긴 것으로, 대상은 문맥상 보충됩니다.
    reason: source_note
  - marker: b
    text: ‘경계하고 있었습니다’는 ‘스스로 경계하다/주의하다’라는 반사적 뉘앙스를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘한 번도 두 번도 아니라’는 ‘not once or twice’의 히브리어 관용구로, 반복됨을 뜻합니다.
    reason: source_note
lexical_decisions:
