base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/017.yaml
  text: Then Elisha prayed and said[a], “Yahweh, please open his eyes so that he may see.” So Yahweh opened the young man’s eyes, and he saw; and behold[b], the mountain was full of horses and chariots of fire all around Elisha.
  footnotes:
  - marker: a
    text: Or, “the servant” for “the young man”; Hebrew naʿar can denote a youth or an attendant/servant depending on context.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “LORD” represents the divine name YHWH; alternatively transliterated “Yahweh.”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 엘리사가 기도하고 말했습니다. “야훼여[a], 부디 그의 눈을 열어 그가 보게 해 주십시오.” 그러자 야훼께서 그 청년[b]의 눈을 여셨고, 그가 보니, 보라, 산은 엘리사 주위에 있는 말들과 불병거로 가득했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 하나님의 이름 יְהוָה는 전통적 번역 관례 대신 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어 נַעַר는 문맥에 따라 ‘청년’, ‘소년’, ‘종’, ‘수행원’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  lexicon: HALOT
  rationale: 히트파엘 פלל은 여기서 하나님께 드리는 기도를 뜻하므로, 서술문에 자연스러운 ‘기도하며’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름(YHWH)을 직역 관습 대신 고유명사 ‘야훼’로 옮겨, 본문의 신적 이름을 보존했습니다.
- source_word: פְּקַח נָא אֶת עֵינָיו
  english_pob_choice: please open his eyes
  chosen_korean: 그의 눈을 열어 주셔서
  alternatives_korean:
  - 부디 그의 눈을 여셔서
  - 지금 그의 눈을 열어
  lexicon: HALOT
  rationale: פְּקַח은 눈을 ‘열다’이고, נָא는 시간부사보다 간청의 완곡 표현이어서 한국어에서는 ‘열어 주셔서’로 부드럽고 정확하게 살렸습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 그 청년
  alternatives_korean:
  - 그 젊은이
  - 그 종
  lexicon: HALOT
  rationale: נַעַר는 문맥상 수행원/종도 가능하지만, 이 절 자체는 나이 어린 남성을 가리키는 기본 뜻을 유지하는 편이 안전하여 ‘청년’으로 옮겼습니다.
theological_decisions:
- issue: 눈이 열려 보게 되는 장면의 성격
  chosen_reading: 하나님이 실제로 시야를 열어 주셔서 보게 되는 장면으로 번역하되, 그 대상이 물리적 현현인지 환상인지 단정하지 않았습니다.
  alternative_readings:
  - 완전한 환상 체험으로 단정
  - 물리적으로 이미 배치된 천상 군대로 단정
  rationale: 히브리어는 ‘눈이 열렸다’와 ‘보았다’를 말할 뿐, 장면의 존재론적 성격은 설명하지 않으므로 번역도 그 긴장을 그대로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Preserve theological tension rather than resolve it'
