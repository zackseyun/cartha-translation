  naturalness: ‘그것을 직접 들어 올리십시오’와 ‘그러자 그 사람이 손을 내밀어 그것을 집었습니다’는 현대 표준어 합쇼체로 자연스럽습니다. ‘그 사람’은 앞 문장의 명령을 수행하는 사람이 손을 내민다는 문맥을 한국어에서 분명히 해 줍니다.
