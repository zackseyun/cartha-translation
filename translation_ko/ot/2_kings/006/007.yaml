  yaml_path: translation/ot/2_kings/006/007.yaml
  text: And he said, “Pick it up for yourself.” So he reached out his hand and took it.
  footnotes:
  - marker: a
    text: Or “Lift it up for yourself.” The Hebrew imperative can be rendered more literally as “lift up.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「그것을 직접[a] 들어 올리십시오.」 그러자 그 사람이 손을 내밀어 그것을 집었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것을 당신 자신을 위해 들어 올리십시오.” 히브리어는 직역하면 “너를 위해 들어 올려라”이며, 수령자 자신의 관여 또는 이익을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 대답했습니다
  lexicon: WLC narrative wayyiqtol
  rationale: 서술 진행을 자연스럽게 살리되, 불필요한 해석을 더하지 않고 기본적인 발화 동사로 옮겼습니다.
- source_word: הָרֶם
  english_pob_choice: Pick it up for yourself
  chosen_korean: 그것을 들어 올리십시오
  alternatives_korean:
  - 그것을 올리십시오
  - 그것을 집어 올리십시오
  lexicon: HALOT
  rationale: 히브리어 명령형은 물에서 물건을 ‘들어 올리다’는 뜻이므로, 문맥상 대상이 분명하다는 점을 살려 자연스러운 직접 명령으로 옮겼습니다.
- source_word: לָךְ
  english_pob_choice: for yourself
  chosen_korean: -십시오
  alternatives_korean:
  - 스스로
  - 자기 자신을 위해
  lexicon: HALOT
  rationale: 전치사+대명사 접미사의 자기 관련/이익 뉘앙스는 한국어 명령형에서 보통 자연스럽게 드러나므로 별도 표현 없이 반영했습니다.
- source_word: וַיִּשְׁלַח יָדוֹ
  english_pob_choice: he reached out his hand
  chosen_korean: 손을 뻗어
  alternatives_korean:
  - 손을 내밀어
  - 손을 뻗었습니다
  lexicon: HALOT
  rationale: 손을 내밀어 무언가를 잡는 관용적 동작을 간결하게 살렸습니다.
- source_word: וַיִּקָּחֵהוּ
  english_pob_choice: and took it
  chosen_korean: 그것을 잡았습니다
  alternatives_korean:
  - 그것을 집었습니다
  - 그것을 가져갔습니다
  lexicon: HALOT
  rationale: 직전 동작이 이미 ‘들어 올리다’이므로, כאן의 לָקַח은 단순 소유 취득의 마무리 동작으로 이해하여 ‘잡다’로 자연스럽게 마무리했습니다.
