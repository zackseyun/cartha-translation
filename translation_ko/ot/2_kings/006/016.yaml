  english_pob_choice: those who are with us are more than those who are with them
  chosen_korean: 우리와 함께 있는 이들이 그들과 함께 있는 이들보다 더 많습니다
  alternatives_korean:
  - 우리와 함께 있는 이들은 그들과 함께 있는 이들보다 많습니다
  - 우리 편이 그들 편보다 많습니다
  lexicon: HALOT
  rationale: 히브리어의 비교 구문을 자연스러운 한국어로 풀되, 원문의 ‘우리와 함께 있는 이들 / 그들과 함께 있는 이들’ 대구를 유지했습니다.
theological_decisions:
- issue: 보이지 않는 ‘우리와 함께 있는 이들’의 정체
  chosen_reading: 본문에는 그 정체를 밝히지 않고, 비교 진술 자체만 살렸습니다.
  alternative_readings:
  - 천상의 군대나 하나님의 군대로 구체화하기
  rationale: 주변 문맥이 배경을 설명하더라도, 본절 자체는 그 존재를 명시하지 않으므로 번역문에 설명을 덧붙이지 않았습니다.
