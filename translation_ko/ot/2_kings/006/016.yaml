translation:
  language: ko
  text: 그가 말했습니다. 「두려워하지 마십시오. 우리와 함께 있는 이들이 그들과 함께 있는 이들보다 더 많습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면, 「우리와 함께 있는 이들은 그들과 함께 있는 이들보다 많은 이들입니다」입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: He said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 말하였습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 서술의 진행을 자연스럽게 살리면서도 원문의 단순한 발화 동사를 그대로 옮겼습니다.
- source_word: אַל תִּירָא
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: HALOT
  rationale: אַל + 금지형의 의미를 표준적이고 직접적인 금지 표현으로 옮겼습니다.
- source_word: רַבִּים אֲשֶׁר אִתָּנוּ מֵאֲשֶׁר אוֹתָם
  english_pob_choice: those who are with us are more than those who are with them
  chosen_korean: 우리와 함께 있는 이들이 그들과 함께 있는 이들보다 더 많습니다
  alternatives_korean:
  - 우리와 함께 있는 이들은 그들과 함께 있는 이들보다 많습니다
  - 우리 편이 그들 편보다 많습니다
  lexicon: HALOT
  rationale: 히브리어의 비교 구문을 자연스러운 한국어로 풀되, 원문의 ‘우리와 함께 있는 이들 / 그들과 함께 있는 이들’ 대구를 유지했습니다.
theological_decisions:
- issue: 보이지 않는 ‘우리와 함께 있는 이들’의 정체
  chosen_reading: 본문에는 그 정체를 밝히지 않고, 비교 진술 자체만 살렸습니다.
  alternative_readings:
  - 천상의 군대나 하나님의 군대로 구체화하기
  rationale: 주변 문맥이 배경을 설명하더라도, 본절 자체는 그 존재를 명시하지 않으므로 번역문에 설명을 덧붙이지 않았습니다.
  doctrine_reference: Translation philosophy §1, §3
