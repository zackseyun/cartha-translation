  lexicon: HALOT
  rationale: אָרַב/סבב 계열의 포위 동작을 자연스럽게 전달하면서, 전면적 군사 포위의 느낌을 분명히 했습니다.
theological_decisions:
- issue: 전쟁 서술의 어조와 해석적 절제
  chosen_reading: 본문의 단순한 역사 서술로 유지하고, 군사력의 과장이나 영적 의미 부여를 추가하지 않았습니다.
  alternative_readings:
  - 상징적 심판 언어로 확대 해석
