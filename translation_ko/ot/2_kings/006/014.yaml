  rationale: 히브리어 본문은 왕이 보낸 군사력과 포위를 사실적으로 기록하므로, 한국어도 서술의 직접성을 보존하는 것이 적절합니다.
  doctrine_reference: 서술 본문의 문자적-역사적 의미 보존
