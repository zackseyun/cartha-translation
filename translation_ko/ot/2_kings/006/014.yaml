  yaml_path: translation/ot/2_kings/006/014.yaml
  text: So he sent horses and chariots there[a], and a great army; they came by night and surrounded the city.
  footnotes:
  - marker: a
    text: Or 'a great force.' The Hebrew expression is literally 'a heavy force,' an idiom for a substantial military contingent.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그는 말과 병거와 큰 군대를[a] 그곳으로 보냈습니다. 그들은 밤에 와서 그 도시를 에워쌌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “큰 병력”. 히브리어 표현은 문자적으로 “무거운 병력”이며, 상당한 규모의 군사력을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 파견했습니다
  - 냈습니다
  lexicon: HALOT
