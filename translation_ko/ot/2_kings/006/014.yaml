  rationale: חַיִל과 כָּבֵד의 관용적 결합을 한국어로는 규모와 압도성을 함께 담는 '큰 군대'로 풀었습니다.
- source_word: וַיַּקִּפוּ עַל הָעִיר
  english_pob_choice: and surrounded the city
  chosen_korean: 그 도시를 에워쌌습니다
