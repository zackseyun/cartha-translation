revisions:
- from: 이때 엘리사는 자기 집에 앉아 있었고, 장로들도 그와 함께 앉아 있었습니다. 왕이 사람을 자기 앞에서 보냈는데, 사자가 자기에게 이르기 전에 그가 장로들에게 말했습니다. “이 살인자의 아들이 자기 머리를 빼앗으려고 사람을 보낸 것을 보십니까? 보십시오, 사자가 오거든 문을 닫고 그를 문에서 밀어내십시오. 그의 주인의 발소리가 그 뒤에 나지 않습니까?”[a][b]
  to: 엘리사는 자기 집에 앉아 있었고, 장로들도 그와 함께 앉아 있었습니다. 왕은 자기보다 앞서 한 사람을 보냈습니다. 그러나 그 전령이 엘리사에게 이르기 전에, 엘리사가 장로들에게 말했습니다. “이 살인자의 아들이 내 목을 베려고[a] 사람을 보낸 것을 보십니까? 보십시오, 전령이 오거든 문을 닫고 그를 문 앞에서 붙잡아 두십시오. 그의 주인의 발소리가 그 뒤에서 들리지 않습니까?”[b]
  rationale: 원문의 시간적·공간적 관계와 대명사 지시 대상을 바로잡고, 현대 표준 한국어 합쇼체로 자연스럽게 다듬었습니다. ‘전령’의 인간적 성격은 본문과 각주에서 분명히 했으며, 각주 표지를 각각의 주석 대상에 직접 연결했습니다.
