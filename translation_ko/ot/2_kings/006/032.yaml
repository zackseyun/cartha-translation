  text: וֶ/אֱלִישָׁע֙ יֹשֵׁ֣ב בְּ/בֵית֔/וֹ וְ/הַ/זְּקֵנִ֖ים יֹשְׁבִ֣ים אִתּ֑/וֹ וַ/יִּשְׁלַ֨ח אִ֜ישׁ מִ/לְּ/פָנָ֗י/ו בְּ/טֶ֣רֶם יָבֹא֩ הַ/מַּלְאָ֨ךְ אֵלָ֜י/ו וְ/ה֣וּא אָמַ֣ר אֶל הַ/זְּקֵנִ֗ים הַ/רְּאִיתֶם֙ כִּֽי שָׁלַ֞ח בֶּן הַֽ/מְרַצֵּ֤חַ הַ/זֶּה֙ לְ/הָסִ֣יר אֶת רֹאשִׁ֔/י רְא֣וּ כְּ/בֹ֣א הַ/מַּלְאָ֗ךְ סִגְר֤וּ הַ/דֶּ֨לֶת֙ וּ/לְחַצְתֶּ֤ם אֹת/וֹ֙ בַּ/דֶּ֔לֶת הֲ/ל֗וֹא ק֛וֹל רַגְלֵ֥י אֲדֹנָ֖י/ו אַחֲרָֽי/ו׀־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Now Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
  footnotes:
  - marker: a
    text: Or “to cut off my head.” The Hebrew literally says “to take away my head,” an idiom for execution by beheading.
    reason: lexical_alternative
  - marker: b
    text: “Messenger” here refers to a human royal envoy, not an angel.
    reason: cultural_note
translation:
  language: ko
  text: 이때 엘리사는 자기 집에 앉아 있었고, 장로들도 그와 함께 앉아 있었습니다. 왕이 사람을 자기 앞에서 보냈는데, 사자가 자기에게 이르기 전에 그가 장로들에게 말했습니다. “이 살인자의 아들이 자기 머리를 빼앗으려고 사람을 보낸 것을 보십니까? 보십시오, 사자가 오거든 문을 닫고 그를 문에서 밀어내십시오. 그의 주인의 발소리가 그 뒤에 나지 않습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 머리를 빼앗다”라고 하며, 참수를 뜻하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘사자’는 천사가 아니라 왕이 보낸 인간 심부름꾼입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב / יֹשְׁבִים
  english_pob_choice: was sitting / were sitting
  chosen_korean: 앉아 있었고 / 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었으며
  - 앉아 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 장면을 나타내는 분사형을 한국어의 진행상으로 살려, 상황의 지속성을 자연스럽게 드러냈습니다.
- source_word: מִלְּפָנָיו
  english_pob_choice: a man ahead of him
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 자기 앞쪽으로
  - 자기 앞에
  lexicon: HALOT
  rationale: 문맥상 왕이 사자를 자기 앞쪽으로 보낸 뜻이므로, ‘자기 앞에서’로 간결하게 옮겼습니다.
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 사자
  alternatives_korean:
  - 사절
  - 전령
  lexicon: HALOT
  rationale: 왕의 심부름꾼을 가리키는 মানব적 사자이므로, 천사로 오해되지 않도록 ‘사자’로 옮겼습니다.
- source_word: לְהָסִיר אֶת רֹאשִׁי
  english_pob_choice: to take away my head
  chosen_korean: 자기 머리를 빼앗으려고
  alternatives_korean:
  - 자기 머리를 없애려고
  - 자기 머리를 잘라 내려고
  lexicon: HALOT
  rationale: 직역적 표현이지만 처형, 특히 참수를 가리키는 관용구이므로 의미를 살려 ‘머리를 빼앗다’로 옮겼습니다.
- source_word: וּלְחַצְתֶּם אֹתוֹ בַּדֶּלֶת
  english_pob_choice: hold him fast at the door
  chosen_korean: 그를 문에서 밀어내십시오
  alternatives_korean:
  - 그를 문에서 막으십시오
  - 그를 문에 붙잡아 두십시오
  lexicon: HALOT
  rationale: לחץ의 핵심은 문턱에서 밀어붙여 들어오지 못하게 하는 것이므로, 행동의 긴박함이 드러나도록 옮겼습니다.
theological_decisions:
- issue: 왕의 신하를 가리키는 הַמַּלְאָךְ의 번역
  chosen_reading: 사자
  alternative_readings:
  - 천사
  - 전령
  rationale: 이 장면은 왕실 서사로서 인간 사자가 분명하므로, 독자가 천사로 오해하지 않도록 인간 사자 표지를 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
