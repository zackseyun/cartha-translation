base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/032.yaml
  text: Now Elisha was sitting in his house[a], and the elders were sitting with him. And the king sent a man ahead of him, but before the messenger came to him, he said to the elders, “Do you see how this son of a murderer has sent to take away my head? Look, when the messenger comes, shut the door and hold him fast at the door[b]. Is not the sound of his master’s feet behind him?”
  footnotes:
  - marker: a
    text: Or “to cut off my head.” The Hebrew literally says “to take away my head,” an idiom for execution by beheading.
    reason: lexical_alternative
  - marker: b
    text: “Messenger” here refers to a human royal envoy, not an angel.
    reason: cultural_note
translation:
  language: ko
  text: 엘리사는 자기 집에 앉아 있었고, 장로들도 그와 함께 앉아 있었습니다. 왕은 자기보다 앞서 한 사람을 보냈습니다. 그러나 그 전령이 엘리사에게 이르기 전에, 엘리사가 장로들에게 말했습니다. “이 살인자의 아들이 내 목을 베려고[a] 사람을 보낸 것을 보십니까? 보십시오, 전령이 오거든 문을 닫고 그를 문 앞에서 붙잡아 두십시오. 그의 주인의 발소리가 그 뒤에서 들리지 않습니까?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “내 머리를 없애다”라고 하며, 참수를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘전령’은 천사가 아니라 왕이 보낸 인간 사절입니다.
    reason: cultural_note
