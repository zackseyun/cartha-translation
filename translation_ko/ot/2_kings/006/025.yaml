  source_fidelity: ‘그래서’는 히브리어 עַד הֱיוֹת의 결과·정도 표현을 단순 인과 접속으로 바꾸므로, 포위가 계속된 결과 물가가 이 극단에 이르렀다는 관계가 더 분명하게 드러나도록 고쳤습니다. 가격의 ‘은’은 원문이 명시하지 않은 세겔을 덧붙이지 않고 유지했습니다.
  naturalness: ‘보십시오’와 진행형 포위 묘사는 합쇼체 서술에서 수용 가능하지만, ‘그래서’ 뒤의 가격 나열은 원문의 결과 강도를 충분히 드러내지 못합니다. ‘~에 이를 정도였습니다’가 현대 한국어에서 자연스럽고 정확합니다.
