id: 2KI.6.25
reference: 2 Kings 6:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֨י רָעָ֤ב גָּדוֹל֙ בְּ/שֹׁ֣מְר֔וֹן וְ/הִנֵּ֖ה צָרִ֣ים עָלֶ֑י/הָ עַ֣ד הֱי֤וֹת רֹאשׁ חֲמוֹר֙ בִּ/שְׁמֹנִ֣ים כֶּ֔סֶף וְ/רֹ֛בַע הַ/קַּ֥ב חרי יונים בַּ/חֲמִשָּׁה כָֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/025.yaml
  text: And there was a great famine in Samaria; and behold[a], they were besieging it until a donkey’s head was eighty pieces of silver, and a fourth of a kab of dove’s dung was five pieces of silver.
  footnotes:
  - marker: a
    text: Or 'pigeon dung.' Some interpreters understand 'dove’s dung' as the literal substance; others take it as the name of a cheap food item or plant product sold during the famine.
    reason: lexical_alternative
translation:
  language: ko
  text: 사마리아에 큰 기근이 있었고, 보십시오, 그들이 그 성을 포위하고 있었습니다. 그래서 나귀의 머리 하나가 은 팔십 개에 이르고, 비둘기 똥 사분의 일 갑이 은 다섯 개에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘비둘기 배설물.’ 어떤 해석자들은 이를 문자적 배설물로 이해하고, 다른 이들은 기근 때 팔리던 값싼 식품이나 식물의 이름으로 이해합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב גָּדוֹל
  english_pob_choice: And there was a great famine
  chosen_korean: 사마리아에 큰 기근이 있었고
  alternatives_korean:
  - 사마리아에 심한 기근이 있었고
  - 사마리아에 대기근이 있었고
  lexicon: HALOT
  rationale: רָעָב גָּדוֹל의 직설적 상황 진술을 살려, 자연스러운 현대 한국어로 ‘큰 기근’이라 옮겼습니다.
- source_word: וְהִנֵּה
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보니
  lexicon: HALOT
  rationale: 서술 흐름을 멈추고 독자의 주의를 끄는 감탄/지시 표현을 한국어 구어형 명령으로 살렸습니다.
- source_word: צָרִים עָלֶיהָ
  english_pob_choice: they were besieging it
  chosen_korean: 그들이 그 성을 포위하고 있었습니다
  alternatives_korean:
  - 그들이 그 성을 에워싸고 있었습니다
  - 그들이 그 성에 포위를 가하고 있었습니다
  lexicon: HALOT
  rationale: 동사 צור의 지속적 포위 상태를 ‘포위하고 있었습니다’로 옮겨 진행 중인 전쟁 상황을 분명히 했습니다.
- source_word: רֹאשׁ חֲמוֹר בִּשְׁמֹנִים כֶּסֶף / רֹבַע הַקַּב חרי יונים בַּחֲמִשָּׁה כָסֶף
  english_pob_choice: a donkey’s head was eighty pieces of silver ... a fourth of a kab of dove’s dung was five pieces of silver
  chosen_korean: 나귀의 머리 하나가 은 팔십 개에 이르고, 비둘기 똥 사분의 일 갑이 은 다섯 개에 이르렀습니다
  alternatives_korean:
  - 나귀의 머리 하나가 은 팔십 세겔에 이르고, 비둘기 똥 사분의 일 갑이 은 다섯 세겔에 이르렀습니다
  - 나귀 머리 하나가 은 팔십에 이르고, 비둘기 똥 사분의 일 갑이 은 다섯에 이르렀습니다
  lexicon: HALOT
  rationale: 가격 구문은 원문의 ‘~에 이르다’ 구조를 살리되, כסֶף를 ‘은’으로 두어 화폐 단위를 과도하게 특정하지 않았습니다. קַב은 현대 단위로 환산하지 않고 ‘갑’으로 음역해 고대 계량감을 유지했습니다.
theological_decisions:
- issue: 비둘기 똥(חרי יונים)의 의미가 문자적 배설물인지, 혹은 식물명/값싼 식품명인지
  chosen_reading: 본문에는 가장 직접적인 의미를 따라 ‘비둘기 똥’으로 두고, 해석의 여지는 본문 밖에서 검토하도록 남겼습니다.
  alternative_readings:
  - ‘비둘기 똥’ 대신 값싼 식용 식물명으로 이해
  - ‘비둘기 똥’이 아니라 ‘비둘기 먹이’로 완화
  rationale: 히브리어 표현의 표면 의미를 지우면 기근의 극단성을 약화시킬 수 있으므로, 본문 자체는 직설적으로 유지했습니다.
  doctrine_reference: 본문 해석과 역사적 현실성
- issue: 보라/보십시오의 문체 선택
  chosen_reading: 서술 속 전환 표지로 ‘보십시오’를 사용했습니다.
  alternative_readings:
  - ‘보라’
  - 생략
  rationale: 히브리어 הִנֵּה의 주의 환기 기능을 현대 합쇼체에서 자연스럽게 살리기 위한 선택입니다.
  doctrine_reference: 서사 담화 표지
