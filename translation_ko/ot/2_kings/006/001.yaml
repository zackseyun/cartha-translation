base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/001.yaml
  text: Now the sons of the prophets said to Elisha[a], “Please see[b], the place where we dwell before you is too cramped for us.”
  footnotes:
  - marker: a
    text: Or 'the disciples/company of the prophets.' The Hebrew idiom 'sons of the prophets' likely refers to a prophetic community under instruction or oversight.
    reason: lexical_alternative
  - marker: b
    text: Or 'in your presence.' The phrase 'before you' may indicate that they lived under Elisha's supervision rather than merely in front of him physically.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예언자들의 아들들이 엘리사에게 말했습니다. 「보십시오, 우리가 당신 앞에서 거주하는 이곳이 우리에게는 너무 비좁습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘예언자들의 아들들’입니다. 히브리어 관용구로서 예언자 공동체를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: ‘당신 앞에서’는 단순한 물리적 위치뿐 아니라 엘리사의 감독 아래 있다는 뜻일 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  english_pob_choice: the sons of the prophets
  chosen_korean: 예언자들의 아들들
  alternatives_korean:
  - 예언자들의 무리
  - 예언자들의 제자들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 공동체적·소속적 뉘앙스를 살리면서, ‘제자들’처럼 관계를 좁혀 해석하지 않았습니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Please see
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 부디
  - 보십시오, 지금
  lexicon: HALOT
  rationale: 지시어의 주의 환기와 나의 정중한 요청을 한국어 합쇼체 명령형으로 간결하게 살렸습니다.
- source_word: יֹשְׁבִים שָׁם לְפָנֶיךָ
  english_pob_choice: we dwell before you
  chosen_korean: 우리가 당신 앞에서 거주하는
  alternatives_korean:
  - 우리가 당신 앞에서 살고 있는
  - 우리가 당신의 감독 아래 거주하는
  lexicon: HALOT
  rationale: יֹשְׁבִים을 ‘거주하는’으로 옮겨 주거 상태를 드러내고, לְפָנֶיךָ는 문자적으로 ‘당신 앞에서’로 유지해 감독/면전의 중의성을 보존했습니다.
- source_word: צַר מִמֶּנּוּ
  english_pob_choice: is too cramped for us
  chosen_korean: 우리에게는 너무 비좁습니다
  alternatives_korean:
  - 우리에게는 너무 좁습니다
  - 우리에게는 너무 협소합니다
  lexicon: HALOT
  rationale: 공간 부족의 압박을 ‘비좁다’로 자연스럽게 옮겨 히브리어의 좁고 답답한 공간감을 전달했습니다.
theological_decisions:
- issue: לְפָנֶיךָ의 관계성
  chosen_reading: 엘리사의 단순한 물리적 ‘앞’이라기보다, 그 앞/면전에서의 존재와 책임 아래 있음을 함께 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - 당신의 면전에서
  - 당신의 감독 아래
  rationale: 본문은 공간적 위치와 권위 관계를 모두 열어 두므로, 한국어도 한쪽으로 과도하게 좁히지 않고 직역성을 유지했습니다.
  doctrine_reference: prophetic authority / discourse context
