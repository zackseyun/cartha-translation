  text: וַ֠/יַּשְׁכֵּם מְשָׁרֵ֨ת אִ֥ישׁ הָֽ/אֱלֹהִים֮ לָ/קוּם֒ וַ/יֵּצֵ֕א וְ/הִנֵּה חַ֛יִל סוֹבֵ֥ב אֶת הָ/עִ֖יר וְ/ס֣וּס וָ/רָ֑כֶב וַ/יֹּ֨אמֶר נַעֲר֥/וֹ אֵלָ֛י/ו אֲהָ֥הּ אֲדֹנִ֖/י אֵיכָ֥ה נַֽעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/015.yaml
  text: When the servant of the man of God rose early and went out[a], behold, an army with horses and chariots was surrounding the city. And his servant said to him, “Alas[b], my master! What shall we do?”
  footnotes:
  - marker: a
    text: Or 'his servant said to him.' The Hebrew נַעַר can mean 'young man,' 'servant,' or 'attendant'; here 'young servant' preserves both the age-related and service-related nuance.
    reason: lexical_alternative
  - marker: b
    text: Or 'the servant of the man of God'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님의 사람을 섬기는 종이 일찍 일어나 나가 보니, 보십시오, 말과 병거를 거느린 군대가 성을 에워싸고 있었습니다. 그 종이 그에게 말했습니다. “아, 주인님! 우리가 어떻게 해야 합니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשָׁרֵת / נַעַר
  english_pob_choice: servant / his servant
  chosen_korean: 종
  alternatives_korean:
  - 젊은 종
  - 시종
  - 하인
  lexicon: HALOT
  rationale: 두 표지가 같은 인물을 가리키므로, 본문의 사회적 관계를 드러내는 기본어 ‘종’으로 통일해 자연스럽고 일관되게 옮겼습니다.
- source_word: חַיִל
  english_pob_choice: an army
  chosen_korean: 군대
  alternatives_korean:
  - 무리
  - 병력
  - 군세
  lexicon: HALOT
  rationale: 전투적 맥락에서 단순한 ‘무리’보다 ‘군대’가 원문의 무장 집단을 가장 분명하게 전달합니다.
- source_word: סוֹבֵב
  english_pob_choice: was surrounding
  chosen_korean: 에워싸고 있었습니다
  alternatives_korean:
  - 둘러싸고 있었습니다
  - 포위하고 있었습니다
  lexicon: HALOT
  rationale: 진행 중인 포위 상황을 살리면서도, 현대 한국어에서 자연스러운 동적 표현인 ‘에워싸다’를 선택했습니다.
- source_word: אֲהָהּ
  english_pob_choice: Alas
  chosen_korean: 아이고
  alternatives_korean:
  - 아아
  - 아하
  - 오
  lexicon: HALOT
  rationale: 놀람과 절망이 섞인 탄식을 한국어 감탄사로 옮기되, 지나치게 구어적이지 않게 처리했습니다.
