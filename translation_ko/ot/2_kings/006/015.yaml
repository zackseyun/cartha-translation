  source_fidelity: 초안은 אִישׁ הָאֱלֹהִים(‘하나님의 사람’)을 ‘그 사람’으로 약화·누락하고, 원문에 없는 ‘보병’을 첨가했습니다. 또한 מְשָׁרֵת와 뒤의 נַעֲרוֹ의 관계를 번역에서 적절히 드러낼 수 있습니다. 수정문은 ‘하나님의 사람을 섬기는 종’과 ‘그 종’을 사용하여 원문의 서술을 충실히 반영합니다.
  naturalness: ‘하나님의 사람을 섬기는 종이 일찍 일어나 나가 보니’와 ‘아, 주인님!’은 현대 표준 한국어의 격식 있는 성경 서술 및 합쇼체 직접화법에 자연스럽습니다. ‘아이고’는 이 문맥에서는 다소 구어적이어서 피했습니다.
  terminology: אִישׁ הָאֱלֹהִים은 정착된 예언자적 호칭인 ‘하나님의 사람’으로, מְשָׁרֵת/נַעַר는 문맥상 ‘종’으로 옮겼습니다. חַיִל은 ‘군대’, סוּס וָרֶכֶב은 ‘말과 병거’로 번역하여 보병을 별도로 암시하지 않았습니다.
