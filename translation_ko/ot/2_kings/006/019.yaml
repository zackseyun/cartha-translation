  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם אֱלִישָׁ֗ע לֹ֣א זֶ֣ה הַ/דֶּרֶךְ֮ וְ/לֹ֣א זֹ֣ה הָ/עִיר֒ לְכ֣וּ אַחֲרַ֔/י וְ/אוֹלִ֣יכָה אֶתְ/כֶ֔ם אֶל הָ/אִ֖ישׁ אֲשֶׁ֣ר תְּבַקֵּשׁ֑וּ/ן וַ/יֹּ֥לֶךְ אוֹתָ֖/ם שֹׁמְרֽוֹנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/019.yaml
  text: And Elisha said to them[a], “This is not the way, and this is not the city. Follow me, and I will lead you to the man whom you seek.” And he led them to Samaria.
  footnotes:
  - marker: a
    text: Or, more literally, 'go after me.'
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사가 그들에게 말했습니다. “이 길이 아닙니다. 이 성읍도 아닙니다. 나를 따라오십시오.[a] 내가 여러분이 찾는 그 사람에게 여러분을 인도하겠습니다.” 그리고 그는 그들을 사마리아로 이끌었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내 뒤를 따라가라”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא זֶה הַדֶּרֶךְ
  english_pob_choice: This is not the way
  chosen_korean: 이 길이 아닙니다
  alternatives_korean:
  - 이 도로가 아닙니다
  - 이 길이 아닙니다
  lexicon: HALOT
  rationale: דֶּרֶךְ는 문맥상 물리적 길을 가리키며, 한국어에서는 ‘길’이 가장 자연스럽고 ‘이’와의 지시 대비도 잘 살아납니다.
- source_word: לֹא זֹה הָעִיר
  english_pob_choice: this is not the city
  chosen_korean: 이 성읍도 아닙니다
  alternatives_korean:
  - 이 도시도 아닙니다
  - 이 성읍이 아닙니다
  lexicon: HALOT
  rationale: עִיר를 ‘도시’로 옮길 수도 있으나, 왕하의 역사서 문맥에서 ‘성읍’이 더 직접적이고 고전적 지리 단위 감각을 살립니다.
- source_word: לְכוּ אַחֲרַי
  english_pob_choice: Follow me
  chosen_korean: 나를 따라오십시오
  alternatives_korean:
  - 제 뒤를 따라오십시오
  - 나를 따르십시오
  lexicon: HALOT
  rationale: 히브리어의 직역인 ‘가서 내 뒤를 따르라’보다, 한국어 명령형으로는 ‘따라오십시오’가 자연스럽고 공손한 합쇼체에 맞습니다.
- source_word: וְאוֹלִיכָה אֶתְכֶם
  english_pob_choice: and I will lead you
  chosen_korean: 내가 당신들이 찾는 그 사람에게 여러분을 인도하겠습니다
  alternatives_korean:
  - 내가 당신들을 그 사람에게 데려가겠습니다
  - 내가 그 사람에게 여러분을 이끌겠습니다
  lexicon: HALOT
  rationale: הלך의 히필형은 ‘인도하다/이끌다’의 원인적 뉘앙스를 가지므로, 본문 흐름상 ‘인도하겠습니다’가 가장 적합합니다.
- source_word: שֹׁמְרֹנָה
  english_pob_choice: to Samaria
  chosen_korean: 사마리아로
  alternatives_korean:
  - 사마리아로
  - 사마리아 쪽으로
  lexicon: HALOT
  rationale: 목적지는 한국어에서 조사 ‘-로’로 간결하게 표현하는 것이 자연스럽고, 지명 음역 ‘사마리아’는 표준적인 성경 지명입니다.
theological_decisions:
- issue: 엘리사의 말이 적어도 표면상 사실과 다른 안내처럼 들리는 문제
  chosen_reading: 본문의 표현을 완곡하게 해석해 윤리 판단을 미리 덧씌우지 않고, 서술된 말 자체를 그대로 옮겼습니다.
  alternative_readings:
  - 명시적으로 ‘속이면서’로 옮기는 방식
  - 사실상 참말이었다는 뉘앙스로 풀어 쓰는 방식
  rationale: 본문은 대화의 실제 진행을 기록할 뿐이므로, 번역은 긴장을 지우지 않고 독자가 본문과 해석을 분리해 보도록 두는 것이 적절합니다.
  doctrine_reference: 본문의 서사적 긴장 보존
- issue: 화자 존칭과 명령형의 등록 차이
  chosen_reading: 엘리사의 대사는 합쇼체를 유지하되, 직접 명령 ‘나를 따라오십시오’는 자연스러운 공손 명령으로 처리했습니다.
  alternative_readings:
  - 더 구어적인 ‘따라오세요’
  - 더 격식 있는 ‘저를 따르십시오’
  rationale: 원문은 단호한 안내문처럼 진행되므로, 현대 한국어에서도 공손하지만 단정한 합쇼체가 가장 잘 대응합니다.
  doctrine_reference: 현대 한국어 문체 일관성
