  text: 그때 하나님의 사람은 이스라엘 왕에게 사람을 보내어 말했습니다. “이곳을 지나지 않도록 조심하십시오. 아람 사람들이 거기로 내려오고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아람 사람들이 거기로 내려오고 있습니다.”
