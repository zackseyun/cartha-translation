base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/009.yaml
  text: Then the man of God sent word to the king of Israel[a], saying, “Be careful not to pass by this place, because the Arameans are coming down there.”
  footnotes:
  - marker: a
    text: Or “the Arameans are descending there.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님의 사람은 이스라엘 왕에게 전갈을 보내어 이렇게 말했습니다. “이곳을 지나지 않도록 조심하십시오. 그곳에 아람 사람들이 내려오고 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아람 사람들이 그곳으로 내려가고 있습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 선지자
  lexicon: HALOT
  rationale: 히브리어의 표준 칭호를 그대로 살리되, 한국어에서는 관용적으로도 자연스러운 ‘하나님의 사람’이 가장 직접적입니다.
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent word
  chosen_korean: 사람을 보내어 말했습니다
  alternatives_korean:
  - 사람을 보내어 전했습니다
  - 보내어 알렸습니다
  lexicon: HALOT
  rationale: 문맥상 엘리사가 왕에게 메시지를 전달하는 것이므로, 단순한 ‘보내다’보다 전달 행위를 분명히 드러내는 표현을 택했습니다.
- source_word: הִשָּׁמֶר מֵעֲבֹר
  english_pob_choice: Be careful not to pass by
  chosen_korean: 이곳을 지나지 않도록 조심하십시오
  alternatives_korean:
  - 이곳을 지나가지 마십시오
  - 지나가는 일을 조심하십시오
  lexicon: HALOT
  rationale: 히브리어 경고형의 강한 주의 촉구를 현대 한국어의 자연스러운 금지/경계 표현으로 옮겼습니다.
- source_word: אֲרָם
  english_pob_choice: the Arameans
  chosen_korean: 아람 사람들
  alternatives_korean:
  - 아람인들
  - 아람 군대
  lexicon: HALOT
  rationale: 지명 아람이 여기서는 적대 집단을 가리키므로, 역사적·민족적 의미를 살린 ‘아람 사람들’이 적절합니다.
- source_word: נְחִתִּים
  english_pob_choice: are coming down
  chosen_korean: 내려오고 있습니다
  alternatives_korean:
  - 내려오고 있습니다
  - 내려오고 있습니다
  lexicon: HALOT
  rationale: 현재 진행형의 경고 뉘앙스를 살려, 이동/배치를 자연스럽게 나타내는 ‘내려오고 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 경고문의 어조
  chosen_reading: 직접적 금지보다 ‘이곳을 지나지 않도록 조심하십시오’로 경고의 긴박함을 유지했습니다.
  alternative_readings:
  - 이곳을 지나지 마십시오
  - 이곳을 통과하지 마십시오
  rationale: 히브리어 הִשָּׁמֶר는 단순 정보 전달이 아니라 주의를 강하게 촉구하는 경고이므로, 한국어에서도 그 긴장감을 보존했습니다.
  doctrine_reference: 본문의 서사적 경고 어조 보존
