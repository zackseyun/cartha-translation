source:
  edition: WLC
  text: עוֹדֶ֨/נּוּ֙ מְדַבֵּ֣ר עִמָּ֔/ם וְ/הִנֵּ֥ה הַ/מַּלְאָ֖ךְ יֹרֵ֣ד אֵלָ֑י/ו וַ/יֹּ֗אמֶר הִנֵּֽה זֹ֤את הָֽ/רָעָה֙ מֵ/אֵ֣ת יְהוָ֔ה מָֽה אוֹחִ֥יל לַ/יהוָ֖ה עֽוֹד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/033.yaml
  text: While he was still speaking with them[a], behold, the messenger came down to him and said, “Behold, this evil is from Yahweh. Why should I wait for Yahweh any longer?”
  footnotes:
  - marker: a
    text: Or, “What should I hope for from the LORD any longer?” The Hebrew verb can mean either “wait” or “hope.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아직 그들과 말하고 있을 때, 보라, 그 사자가 그에게 내려와 말했습니다. 「보라, 이 재앙은 야훼에게서 나온 것이다. 내가 왜 더 오래 야훼를 기다려야 하느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 왜 더 오래 야훼를 바라야 하느냐?” 히브리어 동사는 “기다리다”와 “바라다” 둘 다 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹדֶנּוּ מְדַבֵּר עִמָּם
  english_pob_choice: While he was still speaking with them
  chosen_korean: 그가 아직 그들과 말하고 있을 때
  alternatives_korean:
  - 그가 그들과 아직 말하는 동안
  - 그가 그들과 말하고 있는 참에
  lexicon: HALOT
  rationale: עוֹדֶנּוּ와 분사 מְדַבֵּר의 지속상을 자연스러운 한국어 진행 표현으로 살렸습니다.
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 그 사자
  alternatives_korean:
  - 그 메신저
  - 그 천사
  lexicon: HALOT
  rationale: 문맥상 하늘의 천사보다 파견된 전달자를 가리키므로, 본문 맥락에 맞게 ‘사자’로 옮겼습니다.
- source_word: הָרָעָה
  english_pob_choice: this evil
  chosen_korean: 이 재앙
  alternatives_korean:
  - 이 악
  - 이 불행
  - 이 화
  lexicon: HALOT
  rationale: 여기서 רָעָה는 도덕적 악보다 닥친 재난의 뜻이 강하므로, 한국어에서 자연스럽고 상황을 드러내는 ‘재앙’을 택했습니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼에게서 나온
  alternatives_korean:
  - 야훼로부터 온
  - 야훼에게서
  lexicon: HALOT
  rationale: 출처와 원인을 드러내는 표현으로 옮겨, 재앙의 기원을 야훼에게 돌리는 화자의 발화를 분명히 했습니다.
- source_word: מָה אוֹחִיל לַיהוָה עוֹד
  english_pob_choice: Why should I wait for Yahweh any longer?
  chosen_korean: 내가 왜 더 오래 야훼를 기다려야 하느냐?
  alternatives_korean:
  - 내가 왜 더 야훼를 바라야 하느냐?
  - 내가 왜 아직도 야훼를 기다려야 하느냐?
  lexicon: HALOT
  rationale: אוֹחִיל의 ‘기다리다/바라다’ 중 문맥상 절망과 불만이 드러나는 ‘기다리다’를 기본으로 살리고, עוֹד를 ‘더 오래’로 반영했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명 사칭을 직접 드러내는 POB 원칙에 따라, 여기서는 ‘야훼’로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אוֹחִיל의 의미 긴장
  chosen_reading: 기다려야 하느냐
  alternative_readings:
  - 바라야 하느냐
  - 희망해야 하느냐
  rationale: 화자의 불만과 단념에 가까운 뉘앙스를 살리되, ‘바라다/희망하다’의 가능성은 직역으로 소거하지 않고 의미 범위만 열어 두었습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
