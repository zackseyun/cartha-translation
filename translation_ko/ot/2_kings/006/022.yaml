reference: 2 Kings 6:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לֹ֣א תַכֶּ֔ה הַ/אֲשֶׁ֥ר שָׁבִ֛יתָ בְּ/חַרְבְּ/ךָ֥ וּֽ/בְ/קַשְׁתְּ/ךָ֖ אַתָּ֣ה מַכֶּ֑ה שִׂים֩ לֶ֨חֶם וָ/מַ֜יִם לִ/פְנֵי/הֶ֗ם וְ/יֹֽאכְלוּ֙ וְ/יִשְׁתּ֔וּ וְ/יֵלְכ֖וּ אֶל אֲדֹנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/022.yaml
  text: But he said[a], “You shall not strike them down. Would you strike down those whom you have taken captive with your sword and with your bow? Set bread and water before them[b], so that they may eat and drink and go to their master.”
  footnotes:
  - marker: a
    text: Or, 'Do you strike down those whom you have captured with your sword and your bow?' The Hebrew wording is rhetorical, reinforcing the command not to kill them.
    reason: alternative_reading
  - marker: b
    text: '''Bread and water'' may function idiomatically for basic provisions, but the Hebrew names these items explicitly.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그가 말했습니다. 「그들을 쳐서는 안 됩니다. 당신이 칼과 활로 사로잡은 자들을 정말 치겠습니까? 빵과 물을 그들 앞에 차려 주어 그들이 먹고 마신 뒤 자기 주인에게 가게 하십시오」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 문장은 금지 뒤에 이어지는 수사적 질문으로 이해할 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘빵과 물’은 기본적인 먹을거리를 가리키는 관용적 표현일 수 있지만, 히브리어는 이 항목을 구체적으로 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַכֶּה / מַכֶּה
  english_pob_choice: You shall not strike them down / Would you strike down
  chosen_korean: 그들을 쳐서는 안 됩니다 / 정말 치겠습니까
  alternatives_korean:
  - 그들을 죽이지 마십시오 / 죽이겠습니까
  - 그들을 치지 마십시오 / 치겠습니까
  lexicon: HALOT
  rationale: נכה는 문맥에 따라 '치다, 치명타를 가하다, 죽이다'까지 가리킬 수 있어, 금지와 수사적 질문의 힘을 살리면서도 문맥상 처형 의미를 드러내도록 '쳐서는 안 됩니다'와 '정말 치겠습니까'로 옮겼습니다.
- source_word: הַאֲשֶׁר שָׁבִיתָ
  english_pob_choice: those whom you have taken captive
  chosen_korean: 사로잡은 자들
  alternatives_korean:
  - 포로로 잡은 자들
  - 붙잡아 온 자들
  - 사로잡은 사람들
  lexicon: HALOT
  rationale: שבה는 단순히 붙잡는 것이 아니라 전쟁 포로로 '사로잡다'는 뜻이므로, 전투 맥락이 드러나는 '사로잡은 자들'을 선택했습니다.
- source_word: בְּחַרְבְּךָ וּבְקַשְׁתְּךָ
  english_pob_choice: with your sword and with your bow
  chosen_korean: 칼과 활로
  alternatives_korean:
  - 당신의 칼과 당신의 활로
  - 칼과 활로써
  lexicon: HALOT
  rationale: 히브리어의 무기 병렬을 한국어에서도 간결하게 살리되, 소유 격식을 과도하게 늘리지 않도록 '칼과 활로'로 자연스럽게 옮겼습니다.
- source_word: שִׂים לֶחֶם וָמַיִם לִפְנֵיהֶם
  english_pob_choice: Set bread and water before them
  chosen_korean: 빵과 물을 그들 앞에 차려 주어
  alternatives_korean:
  - 빵과 물을 그들 앞에 두어
  - 빵과 물을 그들 앞에 놓아
  - 빵과 물을 그들 앞에 차리십시오
  lexicon: HALOT
  rationale: 밥상 어법의 '차려 주다'는 לִפְנֵיהֶם의 '앞에 놓다'를 자연스럽게 풀면서도, 식사 제공이라는 구체적 행위를 잘 드러냅니다.
- source_word: אֶל אֲדֹנֵיהֶם
  english_pob_choice: to their master
  chosen_korean: 자기 주인에게
  alternatives_korean:
  - 그들의 주인에게
  - 주인들에게
  - 그들의 상전에게
  lexicon: HALOT
  rationale: 본문 말미는 יחיד형과 복수형 사이의 해석 쟁점이 있으나, 여기서는 POB의 최신 정리처럼 한국어 본문은 단수 의미를 따라 '자기 주인'으로 옮겨 포로들의 귀환 목적을 분명히 했습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 엘리사가 금지를 먼저 말한 뒤, 이어지는 질문으로 포로를 죽이지 말아야 할 이유를 강조하는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 사실 질문으로 읽기
  - 전쟁 윤리의 일반 원리로 확장해 읽기
  rationale: 히브리어 문형은 금지 뒤에 붙는 반문으로 자연스럽고, 서술의 논리를 살리되 본문이 말하는 범위를 넘겨 일반 원리로 확대하지 않도록 했습니다.
  doctrine_reference: 본문 문맥과 수사법
- issue: 포로 대우의 실제성
  chosen_reading: 빵과 물은 관용적 '기본 생계'를 넘어서 실제 식사 제공으로 읽어, 적대자를 살려 돌려보내는 행동의 급진성을 드러냈습니다.
  alternative_readings:
  - 단순한 최소 배급의 관용구로만 읽기
  rationale: 히브리어는 구체적으로 '빵과 물'을 말하므로, 이를 추상화하지 않고 그대로 살리는 편이 서사의 도덕적 긴장을 잘 보존합니다.
  doctrine_reference: 본문 직역성 및 서사 윤리
