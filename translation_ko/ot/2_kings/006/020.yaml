base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/020.yaml
  text: And when they came into Samaria[a], Elisha said, “O Yahweh, open the eyes of these men so that they may see.” So Yahweh opened their eyes, and they saw; and behold, they were in the midst of Samaria.
  footnotes:
  - marker: a
    text: 'Hebrew: ''these''; ''men'' is supplied in English for clarity, referring to the Aramean soldiers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 사마리아에 이르렀을 때, 엘리사가 말했습니다. “야훼여, 이 사람들의 눈을 열어 보게 하소서.” 그러자 야훼께서 그들의 눈을 여시니 그들이 보았고, 보라, 그들은 사마리아 한가운데에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘이 사람들’을 뜻합니다. 본문 맥락상 아람 군사들을 가리키므로 한국어에서는 이해를 돕기 위해 ‘사람들’로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבֹאָם
  english_pob_choice: And when they came
  chosen_korean: 그들이 …에 이르렀을 때
  alternatives_korean:
  - 그들이 …에 왔을 때
  - 그들이 …로 들어갔을 때
  lexicon: HALOT
  rationale: 히브리어의 시간적 전개를 자연스러운 현대 한국어로 살리기 위해 ‘이르렀을 때’를 택했습니다. 본문은 단순한 도착이 아니라 다음 사건의 배경을 여는 표현입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신성호칭은 전통적 대체어가 아니라 고유명사로 처리해야 하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: פְּקַח אֶת עֵינֵי
  english_pob_choice: open the eyes
  chosen_korean: 눈을 열어 보게 하소서
  alternatives_korean:
  - 눈을 여소서
  - 눈을 뜨게 하소서
  - 눈을 열어 주십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하되, 단순한 생리적 ‘뜨기’보다 인지·분별의 회복을 드러내는 한국어로 ‘열어 보게 하소서’를 택했습니다.
- source_word: בְּתוֹךְ שֹׁמְרוֹן
  english_pob_choice: in the midst of Samaria
  chosen_korean: 사마리아 한가운데
  alternatives_korean:
  - 사마리아 한복판
  - 사마리아 가운데
  - 사마리아 안에
  lexicon: HALOT
  rationale: ‘בְּתוֹךְ’의 중심·한가운데라는 공간적 긴장을 살려, 그들이 도시 한가운데 놓여 있음을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 응답이 즉각적이고 주권적인 행위로 제시됨
  chosen_reading: 엘리사의 기도 직후, 야훼께서 직접 그들의 눈을 여시고 그들이 보게 하시는 장면으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘볼 수 있게 하셨다’로 풀어 쓰는 방식
  - 수동적으로 ‘눈이 열렸다’로만 처리하는 방식
  rationale: 본문은 하나님의 직접적 행위와 기도의 응답을 분명히 연결합니다. 이를 약화하지 않도록 능동 표현을 유지했습니다.
  doctrine_reference: 내러티브의 신적 주권과 기도 응답
- issue: 직접 화법 안에서 엘리사의 간구체 유지
  chosen_reading: “야훼여, … 하소서”의 기도체를 유지했습니다.
  alternative_readings:
  - “야훼여, … 하십시오”로 평서적 명령에 가깝게 처리
  - “야훼여, … 열어 주십시오”로 중립화
  rationale: 히브리어 명령형-목적형 구조는 간구의 뉘앙스를 가지므로, 한국어에서도 하나님께 드리는 청원의 호소성을 보존했습니다.
  doctrine_reference: 기도문 번역의 화행 보존
