base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/006.yaml
  text: Then the man of God said[a], “Where did it fall?” And he showed him the place. Then he cut off a stick and threw it there, and the iron floated.
  footnotes:
  - marker: a
    text: Literally, “the iron.” In context, this refers to the iron axe head mentioned in the previous verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 하나님의 사람이 말했습니다. “어디에 떨어졌습니까?” 그 사람이 그곳을 하나님의 사람에게 보여 주었습니다. 그러자 하나님의 사람은 막대 하나를 잘라 그곳에 던졌습니다. 그러자 쇠가 떠올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그 쇠”라고 되어 있습니다. 문맥상 앞절에서 언급된 도끼머리를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 예언자
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 인물의 신적 소속을 드러내며, 문맥상 예언자를 가리키는 해석은 덧붙이지 않았습니다.
- source_word: אָ֣נָה נָפָ֑ל
  english_pob_choice: Where did it fall?
  chosen_korean: 어디에 떨어졌습니까?
  alternatives_korean:
  - 어디로 떨어졌습니까?
  - 어디에 그것이 떨어졌습니까?
  lexicon: HALOT
  rationale: 장소를 묻는 אָנה의 기능을 자연스러운 한국어 질문으로 옮겼고, 완료 동사는 과거 사건으로서 간결하게 처리했습니다.
- source_word: וַיַּרְאֵ֨הוּ אֶת הַמָּק֔וֹם
  english_pob_choice: And he showed him the place.
  chosen_korean: 그가 그곳을 그에게 보여 주자
  alternatives_korean:
  - 그리고 그가 그에게 그곳을 보여 주었습니다
  - 그가 그 장소를 그에게 보였습니다
  lexicon: HALOT
  rationale: Hiphil의 ‘보게 하다/보여 주다’를 살리되, 히브리어의 연속 동작을 한국어의 종속적 시간표현으로 무리 없이 반영했습니다.
- source_word: וַיָּצֶף הַבַּרְזֶל
  english_pob_choice: and the iron floated
  chosen_korean: 쇠가 떠올랐습니다
  alternatives_korean:
  - 쇠가 떠 있었습니다
  - 쇠가 물 위로 떠올랐습니다
  lexicon: HALOT
  rationale: 문맥상 도끼머리를 가리키지만 히브리어가 문자적으로는 ‘쇠’라고만 하므로 그 표현을 유지했습니다. 한국어에서는 ‘떠올랐습니다’가 기적적 부상을 자연스럽고 분명하게 전합니다.
theological_decisions:
- issue: 기적의 표현을 얼마나 자연화할 것인가
  chosen_reading: ‘쇠가 떠올랐습니다’로 직설적으로 옮겨, 사건의 기적성을 약화하지 않았습니다.
  alternative_readings:
  - ‘쇠가 물 위로 올라왔습니다’
  - ‘쇠가 떠 있었습니다’
  rationale: 본문은 설명이나 비유보다 놀라운 사건 자체를 진술하므로, 완곡한 해석보다 직접 진술이 स्रोत의 힘을 더 잘 보존합니다.
  doctrine_reference: Translation philosophy §1, §3
