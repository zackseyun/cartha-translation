  to: 그때 하나님의 사람이 말했습니다. “어디에 떨어졌습니까?” 그 사람이 그곳을 하나님의 사람에게 보여 주었습니다. 그러자 하나님의 사람은 막대 하나를 잘라 그곳에 던졌습니다. 그러자 쇠가 떠올랐습니다.[a]
