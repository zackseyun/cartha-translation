id: 2KI.6.29
reference: 2 Kings 6:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/נְּבַשֵּׁ֥ל אֶת בְּנִ֖/י וַ/נֹּֽאכְלֵ֑/הוּ וָ/אֹמַ֨ר אֵלֶ֜י/הָ בַּ/יּ֣וֹם הָ/אַחֵ֗ר תְּנִ֤י אֶת בְּנֵ/ךְ֙ וְ/נֹ֣אכְלֶ֔/נּוּ וַ/תַּחְבִּ֖א אֶת בְּנָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/029.yaml
  text: So we boiled my son and ate him[a]. Then I said to her on the next day, ‘Give your son[b], so that we may eat him,’ but she hid her son.
  footnotes:
  - marker: a
    text: Or 'we cooked my son and ate him.'
    reason: lexical_alternative
  - marker: b
    text: Or 'and we will eat him'; the Hebrew form may be taken more simply as a future, though the context supports a purpose/result sense after 'Give your son.'
    reason: lexical_alternative
translation:
  language: ko
  text: 우리가 내 아들을 삶아 먹었습니다[a]. 그리고 나는 다음 날 그녀에게 말했습니다. ‘당신의 아들을 내주십시오[b], 우리가 그를 먹게 하십시오.’ 그러나 그녀는 자기 아들을 숨겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아들을 요리해서 먹었습니다.’ 히브리어 동사는 이 문맥에서 ‘삶다/끓이다’보다 넓게 ‘요리하다’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그를 먹게 하려고’; 히브리어 형태는 단순한 미래로도 볼 수 있지만, ‘아들을 내주십시오’ 뒤에서는 목적/결과 의미가 문맥상 더 잘 맞습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנְּבַשֵּׁל
  english_pob_choice: we boiled
  chosen_korean: 삶아 먹었습니다
  alternatives_korean:
  - 끓여서 먹었습니다
  - 요리해서 먹었습니다
  lexicon: HALOT
  rationale: בשל은 여기서 단순한 조리가 아니라 끓이거나 삶는 행위를 가리키므로, 공포감을 살리는 ‘삶다’를 택했습니다.
- source_word: בְּנִי / בְּנֵךְ / בְּנָהּ
  english_pob_choice: my son / your son / her son
  chosen_korean: 내 아들 / 당신의 아들 / 자기 아들
  alternatives_korean:
  - 내 아이 / 당신의 아이 / 그녀의 아이
  lexicon: HALOT
  rationale: 히브리어는 בן ‘아들’을 반복하며 소유격을 분명히 하므로, 한국어에서도 친족 관계를 구체적으로 살렸습니다.
- source_word: וְנֹאכְלֶנּוּ
  english_pob_choice: so that we may eat him
  chosen_korean: 우리가 그를 먹게 하십시오
  alternatives_korean:
  - 우리가 그를 먹을 것입니다
  - 그를 먹도록 하십시오
  lexicon: HALOT
  rationale: 명령 뒤에 오는 미완료형은 목적/결과를 나타내므로, 단순 미래보다 목적을 드러내는 표현이 더 자연스럽고 원문에 가깝습니다.
- source_word: וַתַּחְבִּא
  english_pob_choice: but she hid
  chosen_korean: 그러나 그녀는 자기 아들을 숨겼습니다
  alternatives_korean:
  - 그리고 그녀는 자기 아들을 숨겼습니다
  lexicon: HALOT
  rationale: 문맥상 앞선 요구에 응하지 않고 반대로 행동한 대비가 있으므로, 접속을 ‘그러나’로 옮겨 의미 관계를 분명히 했습니다.
theological_decisions:
- issue: 이 본문은 극단적 기근 속 식인 서술을 얼마나 직접적으로 드러낼지의 문제입니다.
  chosen_reading: 완곡하게 돌리지 않고 ‘삶아 먹었습니다’처럼 직접적으로 옮겼습니다.
  alternative_readings:
  - ‘끓여서 먹었습니다’처럼 더 완곡하게 옮김
  - ‘먹었습니다’로 조리 방식을 약화시킴
  rationale: 본문의 충격성과 심판 내러티브의 의도를 약화하지 않도록, 히브리어의 구체성과 잔혹성을 그대로 전달하는 것이 필요합니다.
  doctrine_reference: 신명기 28장의 언약 저주와 열왕기하의 심판 서술
