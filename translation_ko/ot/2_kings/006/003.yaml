    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֶחָד
  english_pob_choice: one
  chosen_korean: 한 사람
  alternatives_korean:
  - 한 명
  - 그들 중 하나
  lexicon: HALOT
  rationale: 문맥상 엘리사에게 말하는 집단의 한 사람을 가리키므로, 간결하고 자연스러운 ‘한 사람’이 원문의 ‘그 한 사람’이라는 지시성을 잘 살립니다.
- source_word: הוֹאֶל נָא
  english_pob_choice: Please be willing
  chosen_korean: 부디 기꺼이
  alternatives_korean:
  - 부디 동의해
  - 부디 허락해
  - 부디 응해
  lexicon: HALOT
  rationale: 호의적이고 공손한 청유를 나타내므로, ‘부디’와 ‘기꺼이’로 정중한 요청과 자발적 의사를 함께 살렸습니다.
- source_word: וְלֵךְ אֶת עֲבָדֶיךָ
  english_pob_choice: go with your servants
  chosen_korean: 당신의 종들과 함께 가 주십시오
  alternatives_korean:
  - 당신의 종들과 함께 동행해 주십시오
  - 당신의 종들과 같이 가 주십시오
  - 당신의 하인들과 함께 가 주십시오
  lexicon: HALOT
  rationale: אֶת은 이동 동사와 함께 ‘~와 함께’의 동반 의미로 쓰였고, עֲבָדֶיךָ는 여기서 봉사자/수종자들의 뜻이 자연스러우므로 ‘종들’로 옮겼습니다.
- source_word: אֲנִי אֵלֵךְ
  english_pob_choice: I will go
  chosen_korean: 가겠습니다
  alternatives_korean:
  - 제가 가겠습니다
  - 내가 가겠습니다
  lexicon: HALOT
  rationale: 직역보다 한국어 대화체에 자연스러운 응답으로, 주어의 강조는 동사 어미로 충분히 드러나므로 ‘가겠습니다’로 간결하게 옮겼습니다.
