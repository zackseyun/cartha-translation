base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/028.yaml
  text: And the king said to her, “What is the matter with you?” And she said, “This woman said to me, ‘Give your son, so that we may eat him today, and tomorrow we will eat my son.’”
translation:
  language: ko
  text: 왕이 그녀에게 말했습니다. “무슨 일이십니까?” 그러자 그 여인이 말했습니다. “이 여자가 내게 말하기를, ‘네 아들을 내게 주어라. 오늘 우리가 그것을 먹고, 내일은 내 아들을 먹자.’고 했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מַה לָּךְ는 문자적으로는 ‘네게 무엇이 있느냐/무슨 일이 있느냐’의 뜻으로, 여기서는 왕이 상황을 묻는 관용적 질문입니다.
    reason: source_note
lexical_decisions:
- source_word: מַה לָּךְ
  english_pob_choice: What is the matter with you?
  chosen_korean: 무슨 일이십니까?
  alternatives_korean:
  - 무슨 일이 있습니까?
  - 당신에게 무슨 문제가 있습니까?
  lexicon: מה + לך
  rationale: 직접적인 상황 질문으로 옮기되, 영어 POB의 ‘What is the matter with you?’가 가진 곤란/상태 문의를 자연스러운 현대 한국어로 살렸습니다.
- source_word: אֵלַי / תְּנִי
  english_pob_choice: said to me, ‘Give your son
  chosen_korean: 내게 말하기를, ‘네 아들을 내게 주어라’
  alternatives_korean:
  - 내게 말하기를, ‘네 아들을 달라’
  - 내게 말하기를, ‘네 아들을 넘겨라’
  lexicon: אמר + נתן
  rationale: 동사 ‘주다’는 원문의 직접 명령 תְּנִי를 가장 곧게 반영하면서도, 한국어에서 자연스러운 대화체 명령으로 유지합니다.
- source_word: וְנֹאכְלֶנּוּ ... וְאֶת בְּנִי נֹאכַל
  english_pob_choice: so that we may eat him today, and tomorrow we will eat my son
  chosen_korean: 오늘 우리가 그것을 먹고, 내일은 내 아들을 먹자
  alternatives_korean:
  - 오늘 우리가 그를 먹고, 내일은 내 아들을 먹자
  - 오늘 그것을 먹고, 내일은 내 아들을 먹자
  lexicon: אכל
  rationale: ‘먹다’로 직역하되, 한국어에서 대명사 ‘그를’보다 대상이 지시된 직전 명사 ‘아들’을 받아 ‘그것을’로 처리하면 문장이 더 자연스럽고, 잔혹한 행위를 완곡화하지 않습니다.
theological_decisions:
- issue: 극단적 기근 속 식인 발언의 표현 수위
  chosen_reading: 원문의 충격을 약화하지 않고, 서사적 보고로서 담담하게 직역했습니다.
  alternative_readings:
  - 보다 완곡한 표현으로 옮김
  - 암시적으로 처리함
  rationale: 본문은 사건의 비극성과 절망을 드러내는 서술이므로, 현대적 불편함을 이유로 의미를 누그러뜨리면 저자 의도가 손상됩니다.
  doctrine_reference: 본문 서사 보존 원칙
