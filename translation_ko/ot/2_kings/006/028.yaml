  source_fidelity: 히브리어의 질문 מַה־לָּךְ는 상황을 묻는 관용적 표현이므로 ‘무슨 일이 있습니까?’가 충실합니다. 인용문에서 아들을 가리키는 남성 단수 목적어를 ‘그것’으로 받으면 사람을 사물처럼 지시하는 부자연스러운 한국어가 되므로 ‘그 아이’를 사용했습니다. 또한 תְּנִי에는 ‘내게’가 명시되어 있지 않아 이를 보태지 않았습니다.
  naturalness: ‘무슨 일이십니까?’도 가능하지만, ‘무슨 일이 있습니까?’가 현대 한국어에서 더 자연스럽고 질문의 초점도 상황에 둡니다. ‘오늘은 … 먹고, 내일은 … 먹자’는 원문의 오늘/내일 대조와 복수 화자의 제안을 자연스럽게 보존합니다.
  terminology: ‘왕’, ‘여인’, ‘아들’, ‘먹다’는 문맥과 서사적 격식에 적절합니다. 식인 행위는 완곡화하지 않았습니다.
