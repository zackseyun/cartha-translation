    rationale: 히브리어의 אִם은 앞선 자기저주 공식과 결합하여 ‘오늘 엘리사의 머리가 남아 있다면 하나님이 내게 그렇게 하시고 더하시기를’이라는 위협적 맹세를 이룹니다. 현 문장은 미완결적이며 맹세의 논리적 결속을 훼손합니다.
