  text: And he said[a], “May God do so to me, and more also, if the head of Elisha son of Shaphat remains on him today.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'if the head of Elisha son of Shaphat stands on him today'—that is, if Elisha's head remains on his body today.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. 「하나님께서 나에게 그렇게 하시고도 더 하시기를 바랍니다. 만일 오늘 엘리사, 곧 사밧의 아들의 머리가 그의 몸에 붙어 있으면요.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘엘리사의 아들 사밧의 머리가 오늘 그 위에 서 있으면’이라는 뜻입니다. 즉, 엘리사의 머리가 오늘 그의 몸에 붙어 있으면이라는 의미입니다.
    reason: lexical_alternative
