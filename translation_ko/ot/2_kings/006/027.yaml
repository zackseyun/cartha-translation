  lexicon: HALOT
  rationale: 둘 다 식량·생산의 근원을 가리키는 구체적 장소이므로, 관용적이되 대상이 분명한 ‘타작마당’과 ‘포도즙 틀’을 사용해 병렬 구조를 보존했습니다.
