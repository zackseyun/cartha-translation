  rationale: 출처나 근원을 묻는 반문이므로 현대 한국어의 자연스러운 질문형 ‘어디서’가 가장 직접적입니다.
- source_word: הַגֹּרֶן / הַיָּקֶב
  english_pob_choice: the threshing floor / the winepress
  chosen_korean: 타작마당 / 포도즙 틀
  alternatives_korean:
