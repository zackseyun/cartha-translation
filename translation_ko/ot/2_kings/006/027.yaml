  text: And he said[a], “If Yahweh does not help you, from where can I help you? From the threshing floor, or from the winepress?”
  footnotes:
  - marker: a
    text: Or “If the LORD does not save you, from where can I save you?” The Hebrew verb in both clauses can mean help, save, or deliver.
