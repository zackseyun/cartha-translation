  lexicon: HALOT
  rationale: 히브리어 יָשַׁע는 ‘구원하다/구하다/돕다’의 범위를 가지지만, 여기서는 기근 속의 실질적 조력 맥락이므로 첫 절은 ‘돕지 않으시면’으로, 둘째 절은 대응되는 질문형으로 ‘도울 수 있겠습니까’로 옮겼습니다.
