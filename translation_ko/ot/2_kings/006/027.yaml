translation:
  language: ko
  text: 그가 말했습니다[a], 「야훼께서 당신을 돕지 않으시면, 내가 어디서 당신을 도울 수 있겠습니까? 타작마당에서입니까, 포도주 틀에서입니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼께서 당신을 구원하지 않으시면, 내가 어디서 당신을 구원할 수 있겠습니까?” 히브리어 동사는 두 절 모두에서 돕다, 구원하다, 건지다를 뜻할 수 있습니다.
    reason: lexical_alternative
