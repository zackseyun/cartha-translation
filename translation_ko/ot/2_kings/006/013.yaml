source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכ֤וּ וּ/רְאוּ֙ אֵיכֹ֣ה ה֔וּא וְ/אֶשְׁלַ֖ח וְ/אֶקָּחֵ֑/הוּ וַ/יֻּגַּד ל֥/וֹ לֵ/אמֹ֖ר הִנֵּ֥ה בְ/דֹתָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/013.yaml
  text: And he said[a], “Go and see where he is, that I may send and seize him.” And it was reported to him, saying, “Behold[b], he is in Dothan.”
  footnotes:
  - marker: a
    text: 'Or “and I will send and take him”; the Hebrew sequence can be rendered more formally, but here it likely expresses purpose: “so that I may send and seize him.”'
    reason: lexical_alternative
  - marker: b
    text: Dothan was a town north of Samaria; it is also associated with the Joseph narrative (Gen 37:17).
    reason: cross_reference
translation:
  language: ko
  text: 그가 말했습니다. “가서 그가 어디 있는지 보십시오. 내가 사람들을 보내 그를 붙잡게 하겠습니다.[a]” 그러자 그에게 “보십시오, 그가 도단에 있습니다.[b]”라고 보고되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형식상 “내가 보내고 그를 붙잡겠다”로도 옮길 수 있습니다. 여기서는 앞선 명령의 목적을 나타내는 것으로 이해하여 “내가 사람들을 보내 그를 붙잡게 하겠습니다”로 번역했습니다.
    reason: lexical_alternative
  - marker: b
    text: 도단은 사마리아 북쪽의 성읍이며, 창세기 37:17의 요셉 이야기와도 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 이르렀습니다
  lexicon: HALOT
  rationale: 서사 전개의 기본 동사를 자연스러운 현대 한국어로 옮겼고, 직접화법 도입 기능을 유지했습니다.
- source_word: לְכוּ וּרְאוּ אֵיכֹה הוּא
  english_pob_choice: Go and see where he is
  chosen_korean: 가서 그가 어디 있는지 보십시오
  alternatives_korean:
  - 가서 그가 어디 있는지 확인하십시오
  - 가서 어디 있는지 보십시오
  lexicon: HALOT
  rationale: 복수 명령의 연속을 살리되, 'see'는 과도한 해석 없이 조사·탐색의 뜻을 담는 '보십시오'로 옮겼습니다.
- source_word: וְאֶשְׁלַח וְאֶקָּחֵהוּ
  english_pob_choice: so that I may send and seize him
  chosen_korean: 내가 사람을 보내어 그를 붙잡게 하겠습니다
  alternatives_korean:
  - 내가 보내어 그를 잡겠습니다
  - 내가 보내어 그를 사로잡겠습니다
  lexicon: HALOT
  rationale: 이 연속은 목적을 나타내므로 목적구조로 옮겼고, לקח는 적대적 체포의 맥락을 반영해 '붙잡다'로 번역했습니다.
- source_word: וַיֻּגַּד לוֹ
  english_pob_choice: And it was reported to him
  chosen_korean: 그리고 그에게 보고하기를
  alternatives_korean:
  - 그리고 그에게 전해졌습니다
  - 그리고 그에게 알려졌습니다
  lexicon: HALOT
  rationale: 수동형의 공식적인 전달 뉘앙스를 살리기 위해 '보고하다' 계열을 사용했습니다.
- source_word: הִנֵּה בְדֹתָן
  english_pob_choice: Behold, he is in Dothan
  chosen_korean: 보십시오, 그가 도단에 있습니다
  alternatives_korean:
  - 보라, 그가 도단에 있습니다
  - 보십시오, 도단에 있습니다
  lexicon: HALOT
  rationale: הִנֵּה의 지시 기능을 현대적인 명령형 호소로 살렸고, 지명은 음역해 '도단'으로 처리했습니다.
theological_decisions:
- issue: 직접화법에서 הִנֵּה의 등록 처리
  chosen_reading: '''보십시오''로 옮겨 문맥상 보고·지시의 긴급성을 살렸습니다.'
  alternative_readings:
  - '''보라'''
  - '''보십시오'''
  rationale: 본절은 예언적 선언이 아니라 보고문이므로, 고어적 '보라'보다 현대적이면서도 주의를 환기하는 표현이 적절합니다.
  doctrine_reference: 서사 문맥의 화자 의도와 담화 기능
