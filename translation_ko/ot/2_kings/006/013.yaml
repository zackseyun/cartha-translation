revisions:
- from: 그가 말했습니다. “가서 그가 어디 있는지 보십시오. 내가 사람을 보내어 그를 붙잡게 하겠습니다.” 그리고 그에게 보고하기를, “보십시오, 그가 도단에 있습니다”라고 했습니다.[a][b]
  to: 그가 말했습니다. “가서 그가 어디 있는지 보십시오. 내가 사람들을 보내 그를 붙잡게 하겠습니다.[a]” 그러자 그에게 “보십시오, 그가 도단에 있습니다.[b]”라고 보고되었습니다.
  rationale: 수동 보고 형식을 ‘그에게 …라고 보고되었습니다’로 바로잡아 원문의 태와 한국어 문법을 모두 반영했습니다. 체포를 위한 파견이라는 문맥을 자연스럽게 표현하되, 각주에서 원문의 보다 형식적인 ‘보내고 붙잡겠다’ 번역 가능성을 밝혀 해석상의 여지를 보존했습니다. 각주 표지도 관련 어구 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:59Z'
