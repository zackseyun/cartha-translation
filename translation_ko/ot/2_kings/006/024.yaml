  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יִּקְבֹּ֛ץ בֶּן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם אֶת כָּל מַחֲנֵ֑/הוּ וַ/יַּ֕עַל וַ/יָּ֖צַר עַל שֹׁמְרֽוֹן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/024.yaml
  text: And it happened after this that Ben-hadad king of Aram gathered all his army[b][a], and he went up and besieged Samaria.
  footnotes:
  - marker: a
    text: Or "all his forces"; Hebrew "all his camp/army."
    reason: lexical_alternative
  - marker: b
    text: Hebrew "king of Aram"; traditionally "king of Syria."
    reason: alternative_reading
translation:
  language: ko
  text: 그 후에 벤하닷, 아람 왕이 자기의 온 군대를 모으고 올라와 사마리아를 에워쌌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 모든 군대들”; 히브리어는 문자적으로 “그의 진영/군대 전체”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “아람 왕”입니다. 전통적으로는 “시리아 왕”으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: And it happened after this
  chosen_korean: 그 후에
  alternatives_korean:
  - 그 뒤에
  - 그 후에 이런 일이 일어났습니다
  - 이후에
  lexicon: HALOT
  rationale: 서사 전환 공식의 순서를 살리되, 한국어에서는 과도한 직역보다 간결한 시간 연결어로 자연스럽게 옮겼습니다.
- source_word: וַיִּקְבֹּץ
  english_pob_choice: gathered
  chosen_korean: 모으고
  alternatives_korean:
  - 집결시키고
  - 소집하고
  - 모았고
  lexicon: HALOT
  rationale: 군사적 문맥이지만 히브리어 자체는 ‘모으다/모집하다’의 기본 의미를 가지므로, 과도하게 기술적인 ‘소집하다’보다 중립적인 ‘모으다’가 더 직접적입니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 아람의 왕
  - 시리아 왕
  lexicon: HALOT
  rationale: 원문 지명 아람을 따랐고, 전통적이지만 해석적인 ‘시리아 왕’은 채택하지 않았습니다.
- source_word: כָּל מַחֲנֵהוּ
  english_pob_choice: all his army
  chosen_korean: 자기의 온 군대
  alternatives_korean:
  - 그의 모든 군대
  - 자기의 모든 진영
  - 자기의 온 진영
  lexicon: HALOT
  rationale: מַחֲנֶה의 문자적 ‘진영’ 가능성은 있으나, 이 문맥에서는 실제 군사력을 가리키므로 ‘군대’가 가장 분명합니다.
- source_word: וַיָּצַר עַל
  english_pob_choice: besieged
  chosen_korean: 에워쌌습니다
  alternatives_korean:
  - 포위했습니다
  - 포위 공격했습니다
  - 성루를 둘러쌌습니다
  lexicon: HALOT
  rationale: ‘포위하다’도 가능하지만, 한국어에서 성읍을 둘러 군사 압박을 가하는 상황을 자연스럽게 드러내는 ‘에워싸다’가 문맥에 잘 맞습니다.
theological_decisions:
- issue: 아람(Aram)과 전통 번역 ‘시리아’의 선택
  chosen_reading: 원문 지명 ‘아람’으로 유지했습니다.
  alternative_readings:
  - 시리아
  - 아람/시리아 병기
  rationale: 이 절은 역사 서술이며, 원문 지명 보존이 독자에게 더 직접적인 출처 인식을 줍니다. 전통 번역어는 주석 없이 본문에 넣지 않았습니다.
  doctrine_reference: 원어 우선 원칙
