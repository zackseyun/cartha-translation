  lexicon: HALOT
  rationale: מַחֲנֶה의 문자적 ‘진영’ 가능성은 있으나, 이 문맥에서는 실제 군사력을 가리키므로 ‘군대’가 가장 분명합니다.
- source_word: וַיָּצַר עַל
  english_pob_choice: besieged
  chosen_korean: 에워쌌습니다
  alternatives_korean:
  - 포위했습니다
  - 포위 공격했습니다
  - 성루를 둘러쌌습니다
  lexicon: HALOT
  rationale: ‘포위하다’도 가능하지만, 한국어에서 성읍을 둘러 군사 압박을 가하는 상황을 자연스럽게 드러내는 ‘에워싸다’가 문맥에 잘 맞습니다.
theological_decisions:
