translation:
  language: ko
  text: 그 후에 이런 일이 있었습니다. 아람 왕 벤하닷이 그의 온 군대[a]를 모아 올라와 사마리아를 포위했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 모든 군대”; 히브리어는 문자적으로 “그의 온 진영/군대”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “아람 왕”입니다. 전통적으로는 “시리아 왕”으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  english_pob_choice: And it happened after this
