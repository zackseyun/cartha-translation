  rationale: 이 절은 역사 서술이며, 원문 지명 보존이 독자에게 더 직접적인 출처 인식을 줍니다. 전통 번역어는 주석 없이 본문에 넣지 않았습니다.
  doctrine_reference: 원어 우선 원칙
