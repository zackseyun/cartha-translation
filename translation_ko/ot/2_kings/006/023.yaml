  text: וַ/יִּכְרֶ֨ה לָ/הֶ֜ם כֵּרָ֣ה גְדוֹלָ֗ה וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְשַׁלְּחֵ֔/ם וַ/יֵּלְכ֖וּ אֶל אֲדֹֽנֵי/הֶ֑ם וְ/לֹֽא יָ֤סְפוּ עוֹד֙ גְּדוּדֵ֣י אֲרָ֔ם לָ/ב֖וֹא בְּ/אֶ֥רֶץ יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/023.yaml
  text: So he prepared a great feast for them[a], and they ate and drank. Then he sent them away, and they went to their master[c][b]. And the raiding bands of Aram did not come again into the land of Israel.
  footnotes:
  - marker: a
    text: Or 'a great banquet.' The Hebrew idiom uses a verb-noun pairing for preparing a substantial meal.
    reason: lexical_alternative
  - marker: b
    text: Or 'to their lord.' The expression likely refers to the king of Aram.
    reason: lexical_alternative
  - marker: c
    text: '''Aram'' is the Hebrew name often rendered ''Syria'' in older English translations.'
    reason: alternative_reading
translation:
  language: ko
  text: 그래서 그는 그들에게 큰 잔치를 베풀어 주었습니다[a]. 그들은 먹고 마셨고, 그는 그들을 보내어 그들의 주인에게 돌아가게 했습니다[b]. 그 뒤로 아람의 약탈대는 다시는 이스라엘 땅으로 들어오지 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘큰 연회’도 가능하지만, 히브리어는 동사-명사 결합으로 성대한 식사를 준비했다는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 주인’은 문맥상 아람 왕을 가리키는 말로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아람’은 오래된 번역본에서 ‘시리아’로 옮겨지기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֶה ... כֵּרָה גְדוֹלָה
  english_pob_choice: he prepared a great feast
  chosen_korean: 큰 잔치를 베풀어 주었습니다
  alternatives_korean:
  - 큰 잔치를 차려 주었습니다
  - 큰 잔치를 마련해 주었습니다
  lexicon: HALOT
  rationale: כֵּרָה와 כרה의 결합은 단순한 식사가 아니라 잔치를 준비하는 관용적 표현이므로, 한국어에서는 자연스럽고 서술적인 ‘잔치를 베풀다’로 옮겼습니다.
- source_word: וַיְשַׁלְּחֵם
  english_pob_choice: he sent them away
  chosen_korean: 그들을 보내어 그들의 주인에게 돌아가게 했습니다
  alternatives_korean:
  - 그들을 보내었습니다
  - 그들을 떠나가게 했습니다
  lexicon: HALOT
  rationale: 단순히 ‘보내다’만 쓰면 출발의 방향이 약해질 수 있어, 문맥상 풀려나 자기 주인에게 돌아가는 동작을 드러내는 표현으로 옮겼습니다.
- source_word: אֶל אֲדֹנֵיהֶם
  english_pob_choice: to their master
  chosen_korean: 그들의 주인에게
  alternatives_korean:
  - 그들의 주님에게
  - 그들의 왕에게
  lexicon: HALOT
  rationale: 여기서는 언약적 ‘주님’보다 상위 권력자를 가리키는 일반적 ‘주인’이 더 적절하며, 문맥상 아람 왕을 가리키는 가능성을 열어 둡니다.
- source_word: וְלֹא יָסְפוּ עוֹד ... לָבוֹא
  english_pob_choice: did not come again
  chosen_korean: 다시는 ... 들어오지 않았습니다
  alternatives_korean:
  - 더는 ... 오지 않았습니다
  - 계속 ... 오지 않았습니다
  lexicon: HALOT
  rationale: יסף עוֹד + 부정사구는 ‘다시 ~하지 않다’라는 반복 중단의 관용구이므로, 한국어에서도 그 반복 금지를 직접적으로 드러냈습니다.
- source_word: גְּדוּדֵי אֲרָם
  english_pob_choice: the raiding bands of Aram
  chosen_korean: 아람의 약탈대
  alternatives_korean:
  - 아람의 습격대
  - 아람의 부대
  lexicon: HALOT
  rationale: גְּדוּד는 정규군보다 약탈·습격의 무리를 가리키는 경우가 많아, 전투 집단보다 약탈 성격을 살린 ‘약탈대’로 옮겼습니다.
theological_decisions:
- issue: ‘아람’의 지명 표기
  chosen_reading: 원어 음역인 ‘아람’을 본문에 유지했습니다.
  alternative_readings:
  - ‘시리아’로 옮김
  rationale: POB의 원어 우선 원칙에 따라 히브리어 ארם을 ‘아람’으로 유지하는 편이 원문 추적성과 역사적 배경을 더 잘 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙
