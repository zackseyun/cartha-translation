  text: So he went with them[a], and they came to the Jordan and cut down the trees.
  footnotes:
  - marker: a
    text: Or 'and they cut the wood.' The Hebrew noun can refer broadly to trees or wood, but in this context of felling timber, 'trees' is more precise.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그들과 함께 갔습니다. 그들은 요르단에 이르러 나무들을 베었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나무를 베었습니다”로 옮길 수도 있습니다. 히브리어 명사는 넓게는 나무나 목재를 가리킬 수 있지만, 여기서는 벌채 장면이므로 “나무들”이 더 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אִתָּם
  english_pob_choice: So he went with them
  chosen_korean: 그는 그들과 함께 가서
  alternatives_korean:
  - 그는 그들과 함께 갔습니다
  - 그래서 그는 그들과 함께 갔습니다
  lexicon: HALOT
  rationale: 이동의 연속을 자연스럽게 살리되, אִתָּם의 동반 의미를 분명히 반영했습니다.
- source_word: וַיָּבֹאוּ הַיַּרְדֵּנָה
  english_pob_choice: and they came to the Jordan
  chosen_korean: 요르단에 이르러
  alternatives_korean:
  - 요르단에 도착하여
  - 요르단으로 갔으며
  lexicon: HALOT
  rationale: 방향 표지 הַיַּרְדֵּנָה를 한국어의 자연스러운 도착 표현으로 옮기되, 구체적 지명인 요르단을 유지했습니다.
- source_word: וַיִּגְזְרוּ הָעֵצִים
  english_pob_choice: cut down the trees
  chosen_korean: 나무들을 베었습니다
  alternatives_korean:
  - 나무들을 잘랐습니다
  - 나무들을 베어 냈습니다
  lexicon: HALOT
  rationale: 문맥상 단순 절단이 아니라 벌채를 뜻하므로 ‘베다’로 옮겼고, הָעֵצִים는 이곳의 서 있는 나무들을 가리키므로 ‘나무들’로 렌더링했습니다.
