    text: 또는 “나무를 베었습니다”로 옮길 수도 있습니다. 히브리어 명사는 넓게는 나무나 목재를 가리킬 수 있지만, 여기서는 벌채 장면이므로 “나무들”이 더 분명합니다.
    reason: lexical_alternative
