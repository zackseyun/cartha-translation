  to: 이스라엘 왕이 그들을 보았을 때 엘리사에게 말했습니다. “제가 그들을 쳐 죽일까요?[a] 제가 그들을 쳐 죽일까요, 내 아버지?”[b]
  rationale: 의문문의 양태를 ‘-ㄹ까요?’로 바로잡아 왕이 엘리사에게 살해 여부를 묻는 원문의 의미를 보존했습니다. 반복과 ‘내 아버지’는 유지했으며, 각주 위치와 문구를 원문의 반복에 더 직접 연결되도록 정리했습니다.
