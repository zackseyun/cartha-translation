base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/021.yaml
  text: Then the king of Israel said to Elisha when he saw them[a], “Shall I strike them down? Shall I strike them down[b], my father?”
  footnotes:
  - marker: a
    text: Or, “Should I strike them? Should I strike them?” The Hebrew repeats the verb for emphasis.
    reason: lexical_alternative
  - marker: b
    text: “My father” is a respectful form of address to Elisha.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 왕이 그들을 보았을 때 엘리사에게 말했습니다. “제가 그들을 쳐 죽일까요?[a] 제가 그들을 쳐 죽일까요, 내 아버지?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘치다’라는 동사를 반복하여 강조합니다.
    reason: source_note
  - marker: b
    text: ‘내 아버지’는 엘리사에 대한 존칭적 호칭입니다.
    reason: cultural_note
lexical_decisions:
- source_word: מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the king of Israel
  chosen_korean: 이스라엘 왕
  alternatives_korean:
  - 이스라엘의 왕
  - 이스라엘 임금
  lexicon: HALOT
  rationale: 히브리어의 관형구를 자연스러운 현대 한국어 어순으로 옮겼습니다. ‘임금’은 현대 문체에서 지나치게 고어적이어서 제외했습니다.
- source_word: כִּרְאֹתוֹ אֹתָם
  english_pob_choice: when he saw them
  chosen_korean: 그들을 보았을 때
  alternatives_korean:
  - 그들을 보자마자
  - 그들을 볼 때
  lexicon: HALOT
  rationale: 부사절의 시간 관계를 한국어로 자연스럽게 나타냈습니다. 문맥상 왕이 적군을 본 순간이라는 점은 유지하되, 영어처럼 과도하게 해석하지 않았습니다.
- source_word: הַאַכֶּה אַכֶּה
  english_pob_choice: Shall I strike them down? Shall I strike them down?
  chosen_korean: 내가 그들을 쳐 죽이겠습니다? 내가 그들을 쳐 죽이겠습니다?
  alternatives_korean:
  - 제가 그들을 칠까요? 제가 그들을 칠까요?
  - 내가 그들을 치겠습니다? 내가 그들을 치겠습니다?
  lexicon: HALOT
  rationale: 반복된 동사로 이루어진 강조형 질문을 한국어에서도 반복으로 살렸습니다. 문맥상 단순 타격이 아니라 살상 의도가 드러나므로 ‘쳐 죽이다’로 옮겼습니다.
- source_word: אָבִי
  english_pob_choice: my father
  chosen_korean: 내 아버지
  alternatives_korean:
  - 아버지
  - 저의 아버지
  lexicon: HALOT
  rationale: 히브리어의 직역을 유지해 엘리사를 향한 존칭적 호칭을 드러냈습니다. 문맥상 생물학적 아버지가 아니라 예언자 상관에 대한 존칭이지만, 본문 표현 자체를 보존했습니다.
theological_decisions:
- issue: 엘리사에 대한 호칭의 존칭성
  chosen_reading: ‘내 아버지’를 그대로 살려, 엘리사를 향한 예우와 권위 인정을 나타내도록 했습니다.
  alternative_readings:
  - ‘내 주인님’처럼 해석적으로 옮기기
  - 단순히 ‘아버지’로 자연화하기
  rationale: 본문은 가족관계가 아니라 존중의 언어를 사용합니다. 직역을 유지하면 독자가 그 긴장과 예우를 함께 보게 됩니다.
  doctrine_reference: Translation philosophy §1, §5
