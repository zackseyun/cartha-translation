source:
  edition: WLC
  text: וַֽ/יְהִי֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל עֹבֵ֖ר עַל הַ/חֹמָ֑ה וְ/אִשָּׁ֗ה צָעֲקָ֤ה אֵלָי/ו֙ לֵ/אמֹ֔ר הוֹשִׁ֖יעָ/ה אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/026.yaml
  text: And as the king of Israel was passing by on the wall[a], a woman cried out to him, saying, “Help, my lord the king!”
  footnotes:
  - marker: a
    text: Or “Save me, my lord the king!” The Hebrew imperative is literally “save,” but here functions as an urgent plea for help.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 왕이 성벽 위를 지나가고 있었는데, 한 여인이 그에게 소리쳐 말했습니다. “구해 주십시오, 내 주 왕이여!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “구해 주십시오”는 히브리어 동사 ‘구원하다’의 문자적 의미를 살렸지만, 이 문맥에서는 절박한 도움 요청으로 기능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי / עֹבֵר
  english_pob_choice: And as ... was passing by
  chosen_korean: “~하고 있었는데”
  alternatives_korean:
  - “~하던 때에”
  - “~지나가고 있었고”
  lexicon: HALOT
  rationale: 서술 도입과 진행 중인 동작을 함께 살리기 위해, 자연스러운 한국어 진행 배경 표현으로 옮겼습니다.
- source_word: עַל הַחֹמָה
  english_pob_choice: on the wall
  chosen_korean: “성벽 위를”
  alternatives_korean:
  - “벽 위에서”
  - “성곽 위를”
  lexicon: HALOT
  rationale: 전장/포위 상황에서의 성벽을 가리키므로, 단순한 ‘벽’보다 ‘성벽’이 문맥을 더 정확히 드러냅니다.
- source_word: הוֹשִׁיעָה
  english_pob_choice: Help
  chosen_korean: “구해 주십시오”
  alternatives_korean:
  - “도와주십시오”
  - “저를 구원해 주십시오”
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘구원하다’이지만, 여기서는 왕에게 즉각적인 개입을 요청하는 절박한 호소이므로 한국어에서는 ‘구해 주십시오’가 가장 자연스럽습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: my lord the king
  chosen_korean: “내 주 왕이여”
  alternatives_korean:
  - “내 주군 왕이여”
  - “나의 주 왕이여”
  lexicon: HALOT
  rationale: 왕에게 드리는 공손한 호칭을 유지하되, 한국어에서 과도하게 경직되지 않도록 ‘내 주 왕이여’로 옮겼습니다.
