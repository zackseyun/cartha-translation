  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 적대적 접근(‘그를 향해 내려오다’)과 야훼가 기도에 응답하신 마지막 절의 주어를 한국어에서 더 분명하고 자연스럽게 드러내는 것이 좋습니다. ‘눈멀게 하십시오’는 נכה와 סַנְוֵרִים가 함께 표현하는 재앙의 결과를 적절히 전달합니다.
  naturalness: ‘그러자 그가 … 하셨습니다’는 존칭 서술어와 비존칭 대명사가 결합되어 현대 표준 한국어 합쇼체 문장으로 어색하며, ‘그’가 누구인지도 불필요하게 모호합니다. ‘야훼께서’로 명시하면 자연스럽고 문맥상 주어도 분명해집니다.
  terminology: ‘야훼’, ‘엘리사’, ‘민족’, ‘눈멀게’는 적절합니다. סַנְוֵרִים의 의미 범위를 설명하는 각주는 유지하되, 해당 표현이 처음 나오는 곳에 붙이는 편이 독자에게 더 명료합니다.
