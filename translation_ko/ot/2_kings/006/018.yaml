  text: וַ/יֵּרְדוּ֮ אֵלָי/ו֒ וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙ וַ/יֹּאמַ֔ר הַךְ נָ֥א אֶת הַ/גּוֹי הַ/זֶּ֖ה בַּ/סַּנְוֵרִ֑ים וַ/יַּכֵּ֥/ם בַּ/סַּנְוֵרִ֖ים כִּ/דְבַ֥ר אֱלִישָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/006/018.yaml
  text: When they came down against him[a], Elisha prayed to Yahweh and said, “Please strike this nation with blindness.” So he struck them with blindness, according to the word of Elisha.
  footnotes:
  - marker: a
    text: Or 'with a blinding confusion.' The Hebrew term can denote a divinely caused visual impairment that leaves people unable to perceive rightly, not necessarily total or permanent blindness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그를 향해 내려왔을 때, 엘리사는 야훼께 기도하며 말했습니다. “부디 이 민족을 눈멀게 하십시오.”[a] 그러자 야훼께서 엘리사의 말대로 그들을 눈멀게 하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בַּסַּנְוֵרִים는 단순한 영구적 실명보다, 신적으로 일으켜진 시각적 혼란이나 지각 장애를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ אֵלָיו
  english_pob_choice: When they came down against him
  chosen_korean: 그들이 그에게로 내려왔을 때
  alternatives_korean:
  - 그들이 그에게로 내려왔을 때 그를 향해 내려왔을 때
  - 그들이 그에게 내려왔을 때
  lexicon: HALOT
  rationale: ירד의 기본 의미는 ‘내려오다’이지만, 전쟁/적대 맥락에서 אֶל과 함께 쓰였으므로 단순한 접근보다 ‘그에게로 내려왔을 때’가 문맥을 더 자연스럽게 드러냅니다.
- source_word: וַ/יִּתְפַּלֵּ֨ל אֱלִישָׁ֤ע אֶל יְהוָה֙
  english_pob_choice: Elisha prayed to Yahweh
  chosen_korean: 엘리사는 야훼께 기도하며
  alternatives_korean:
  - 엘리사는 야훼께 기도했고
  - 엘리사는 야훼께 간구하며
  lexicon: HALOT
  rationale: התפלל은 일반적인 ‘기도하다’로 옮기되, לשון תפילה의 간청성을 살려 동사 연결을 사용했습니다. יְהוָה는 본문 지침에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַךְ נָא
  english_pob_choice: Please strike
  chosen_korean: 부디 … 눈멀게 하십시오
  alternatives_korean:
  - 부디 치십시오
  - 부디 내리쳐 주십시오
  lexicon: HALOT
  rationale: נכה는 여기서 하나님의 직접 개입을 구하는 ‘치다/내리치다’의 뜻이지만, 목적어가 사람들의 시각 장애이므로 한국어에서는 결과를 드러내는 ‘눈멀게 하십시오’가 더 정확하게 기능을 전달합니다. נָא는 공손한 간청을 살려 ‘부디’로 옮겼습니다.
- source_word: בַּ/סַּנְוֵרִים
  english_pob_choice: with blindness
  chosen_korean: 눈멀게
  alternatives_korean:
  - 맹목하게
  - 시각 장애에 빠지게
  lexicon: HALOT
  rationale: סַנְוֵרִים는 단순한 영구적 실명보다 신적 개입으로 인한 지각 불능을 가리킬 수 있지만, 한국어 본문에서는 가장 직접적인 의미인 ‘눈멀게’로 옮기고, 의미 범위는 주석 없이도 본문 흐름이 드러내도록 했습니다.
- source_word: כִּדְבַ֥ר אֱלִישָֽׁע
  english_pob_choice: according to the word of Elisha
  chosen_korean: 엘리사의 말대로
  alternatives_korean:
  - 엘리사의 말에 따라
  - 엘리사가 말한 대로
  lexicon: HALOT
  rationale: דבר의 ‘말/말씀’ 의미를 살리면서도 한국어에서는 ‘말대로’가 예언적 발화와 성취의 대응을 가장 간결하게 드러냅니다.
theological_decisions:
- issue: 주어 생략과 하나님의 행위 표현
  chosen_reading: 그러자 그가 엘리사의 말대로 그들을 눈멀게 하셨습니다.
  alternative_readings:
  - 그러자 야훼께서 엘리사의 말대로 그들을 눈멀게 하셨습니다.
  - 그러자 그들을 눈멀게 하셨습니다.
  rationale: 히브리어 শেষ절의 동사는 문맥상 야훼의 행위이지만, 본문은 주어를 생략합니다. 한국어는 문맥상 하나님으로 이해되더라도 과도한 명시를 피하고, ‘그가 … 하셨습니다’로 원문의 간결함과 지시 대상을 함께 보존했습니다.
  doctrine_reference: 문맥 주어 보충 원리; 히브리어 서술의 경제성
