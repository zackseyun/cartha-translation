  - 안에
  lexicon: HALOT
  rationale: 문자적으로는 ‘안쪽에서/속으로부터’의 뜻이므로, 옷을 찢었을 때 드러난 위치를 한국어로 자연스럽게 ‘몸 아래에’로 표현했습니다.
theological_decisions:
- issue: 왕의 베옷이 겉옷 아래에 있었다는 점의 표현
  chosen_reading: 베옷이 겉옷 아래에 숨어 있다가 옷이 찢어지며 드러난 것으로 읽었습니다.
  alternative_readings:
  - 단순히 몸에 입은 베옷으로 볼 수 있음
  - ‘몸 아래’ 대신 ‘몸에’로 완화할 수 있음
  rationale: 히브리어 מִבָּיִת과 영어 POB의 주석이 모두 안쪽에 입은 상태를 지시하므로, 회개/애통의 표지라는 긴장을 유지하기 위해 그 은폐성을 드러냈습니다.
  doctrine_reference: 왕하 6:30 문맥의 애통·수치 표지
- issue: ‘보라’의 담화 기능
  chosen_reading: ‘보라’는 시각적 놀라움을 강조하는 감탄 표지로 유지했습니다.
  alternative_readings:
  - 생략 가능
  - ‘보니’만으로 처리 가능
  rationale: הִנֵּה의 갑작스러운 주목을 보존하기 위해 한국어에서도 감탄 표지를 살렸습니다.
  doctrine_reference: 서사 담화 표지
