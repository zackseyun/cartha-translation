  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리면서 현대 한국어 문장 흐름에 맞게 ‘자기 옷’으로 분명히 했습니다.
- source_word: הַשַּׂק
  english_pob_choice: sackcloth
  chosen_korean: 베옷
  alternatives_korean:
  - 굵은 베옷
  - 자루천
  lexicon: HALOT
  rationale: 문맥상 애곡의 옷을 가리키므로 한국어 성경에서 널리 쓰이는 ‘베옷’을 택했습니다. 다만 이는 재질과 용도를 함께 드러내는 표현입니다.
- source_word: מִבָּיִת
  english_pob_choice: underneath
