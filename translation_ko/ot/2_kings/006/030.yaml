  text: And when the king heard the words of the woman[a], he tore his clothes as he was passing by on the wall, and the people looked, and behold, sackcloth was on his body underneath.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from inside,' indicating that the sackcloth was worn beneath his outer clothing.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 그 여인의 말을 듣고 성벽 위를 지나가다가 자기 옷을 찢었습니다. 백성이 보니, 보라, 그가 겉옷 안에 베옷을 입고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘안쪽으로부터’라고 하며, 베옷이 겉옷 안에 입혀져 있었음을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִשְׁמֹעַ
  english_pob_choice: when ... heard
  chosen_korean: '...을 들었을 때'
  alternatives_korean:
