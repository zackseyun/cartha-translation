theological_decisions:
- issue: 군사적 계획 진술의 직설성
  chosen_reading: 왕이 실제로 이스라엘을 상대로 전쟁을 수행하며 특정 장소에 진영을 둘 계획을 말하는 직설적 진술로 유지했습니다.
  alternative_readings:
  - ‘진을 칠 것이다’로 더 관용적으로 완화
  - ‘내가 진을 치겠다’로 화자의 직접행동 강조
  rationale: 본문은 전쟁 중인 왕의 구체적 작전 발언을 담고 있으므로, 의미를 약화하지 않고 군사적 의도를 드러내는 쪽이 원문에 충실합니다.
  doctrine_reference: 본문 역사서의 서술적 사실 진술
