  text: Now the king of Aram was warring against Israel, and he consulted with his servants, saying, “At such-and-such a place shall be my camp.”
  footnotes:
  - marker: a
    text: Or, more literally, “At such-and-such a place is my encampment.” The Hebrew uses an idiom for an unspecified location.
