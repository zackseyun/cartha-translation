translation:
  language: ko
  text: 이제 아람 왕은 이스라엘과 전쟁하고 있었고, 그의 종들과 상의하며 말했습니다. “어느 어느 곳에 내 진영이 있을 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어느 어느 곳’은 히브리어의 불특정 장소 관용구를 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  english_pob_choice: Now the king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 시리아 왕
  - 아람의 왕
  lexicon: HALOT
  rationale: 아람은 지명을 음역한 표준적 본문 흐름을 따르는 것이 적절하며, 한국어에서는 소유격보다 ‘아람 왕’이 더 자연스럽습니다.
- source_word: הָיָה נִלְחָם בְּיִשְׂרָאֵל
  english_pob_choice: was warring against Israel
  chosen_korean: 이스라엘과 전쟁하고 있었고
  alternatives_korean:
  - 이스라엘과 싸우고 있었고
  - 이스라엘과 전쟁하였고
  lexicon: HALOT
  rationale: 진행·반복의 의미를 살리기 위해 단순 과거보다 ‘전쟁하고 있었고’로 옮겼습니다. בְּ와 נִלְחָם의 충돌 관계는 한국어에서 ‘~과 전쟁하다’가 가장 자연스럽습니다.
- source_word: אֶל מְקוֹם פְּלֹנִי אַלְמֹנִי
  english_pob_choice: At such-and-such a place
  chosen_korean: 어느 어느 곳
  alternatives_korean:
  - 어느 곳
  - 이러저러한 곳
  lexicon: HALOT
  rationale: פְּלֹנִי אַלְמֹנִי의 관용적 불특정성을 살리기 위해, 특정 장소를 지시하지 않는 한국어 관용구로 옮겼습니다.
- source_word: תַּחֲנֹתִי
  english_pob_choice: shall be my camp
  chosen_korean: 내 진영이 있을 것이다
  alternatives_korean:
  - 내 진영이 될 것이다
  - 내 진영이 머물 것이다
  lexicon: HALOT
  rationale: 명사형 ‘진영’으로 군사적 배치를 살리고, 히브리어의 간결한 진술을 한국어 미래 서술로 풀어 자연스럽게 표현했습니다.
theological_decisions:
- issue: 군사적 계획 진술의 직설성
  chosen_reading: 왕이 실제로 이스라엘을 상대로 전쟁을 수행하며 특정 장소에 진영을 둘 계획을 말하는 직설적 진술로 유지했습니다.
  alternative_readings:
  - ‘진을 칠 것이다’로 더 관용적으로 완화
  - ‘내가 진을 치겠다’로 화자의 직접행동 강조
  rationale: 본문은 전쟁 중인 왕의 구체적 작전 발언을 담고 있으므로, 의미를 약화하지 않고 군사적 의도를 드러내는 쪽이 원문에 충실합니다.
  doctrine_reference: 본문 역사서의 서술적 사실 진술
