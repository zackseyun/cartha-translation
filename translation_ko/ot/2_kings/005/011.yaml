revisions:
- from: 그러자 나아만은 화를 내며 떠나가며 말했습니다. “보십시오, 나는 속으로 ‘틀림없이 그가 내게로 나와 서서 그의 하나님 야훼의 이름을 부르고, 그 자리 위로 손을 흔들어, 나병 환자를 고쳐 주리라’고 생각했습니다.”[a][b]
  to: 그러자 나아만은 화를 내고 떠나갔습니다. 그는 말했습니다. “보십시오, 나는 속으로 이렇게 말했습니다. ‘그가 반드시 내게 나와 서서 그의 하나님 야훼의 이름을 부르고, 그 부위를 향해 손을 흔들어 나병성 피부병에 걸린 사람을 낫게 해 줄 것이다.’”[a][b]
  rationale: 동사의 순차적 진행을 자연스럽게 바로잡고, ‘속으로 말하다’라는 히브리어 관용구를 보존했습니다. 또한 병에 걸린 사람을 가리키는 히브리어 형태를 반영하되, 현대 의학적 ‘나병’ 진단으로 단정하는 표현은 피했습니다. 두 각주는 모두 마지막 치료 동작의 어휘적·해석적 대안에 관한 것이므로 해당 구절 뒤에 함께 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:02Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어 הַמְּצֹרָע는 기본적으로 ‘나병성 피부병에 걸린 사람/피부병 환자’를 가리키므로, 사람을 목적어로 한 치료 표현은 유지할 수 있습니다. 다만 ‘나병 환자’만으로는 현대의 한센병 진단을 다소 강하게 연상시킬 수 있습니다. וַיִּקְצֹף וַיֵּלַךְ는 순차 사건이므로 ‘화를 내며 떠나가며’보다 ‘화를 내고 떠나갔습니다’가 더 정확합니다. אָמַרְתִּי אֵלַי는 ‘속으로 이렇게 말했습니다’로 옮겨 직역적 의미를 보존했습니다.
  naturalness: 초안의 ‘화를 내며 떠나가며’는 동일한 연결 어미의 반복으로 현대 표준 한국어에서 부자연스럽습니다. 또한 인용문 안의 ‘생각했습니다’는 אָמַרְתִּי אֵלַי의 발화 표지를 약화합니다. 수정문은 현대적 합쇼체를 유지하면서도 자연스럽습니다.
  terminology: יְהוָה는 프로젝트 방침에 따라 ‘야훼’로 유지했습니다. צָרַעַת 계열을 현대 의학의 ‘나병’으로 단정하지 않기 위해 본문에는 ‘나병성 피부병에 걸린 사람’을 사용하고, 각주에서 전통적 ‘나병’ 번역 및 ‘질병을 제거하다’라는 해석 가능성을 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘화를 내며 떠나가며’가 두 사건의 순차성을 흐리고 문체상 어색합니다.
    rationale: 두 wayyiqtol은 ‘화를 내고 떠나갔습니다’처럼 순차적으로 옮기는 것이 자연스럽고 충실합니다.
  - severity: medium
    issue: ‘나병 환자’는 צָרַעַת 계열을 현대 한센병으로 오해하게 할 수 있습니다.
    rationale: 본문의 הַמְּצֹרָע는 병에 걸린 사람을 뜻하지만, 그 질병 범주는 현대의 특정 진단명과 동일시할 수 없습니다.
