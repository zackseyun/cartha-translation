base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/011.yaml
  text: But Naaman became angry and went away[a], and he said, “Look, I said to myself, ‘Surely he will come out to me and stand and call on the name of Yahweh his God[b], and wave his hand over the place and heal the leprous person.’”
  footnotes:
  - marker: a
    text: Or, more traditionally, “and cure the leprosy” or “and heal the leper.” The Hebrew verb literally means “gather in/remove,” and the final term refers to a leprous condition or the one afflicted by it.
    reason: lexical_alternative
  - marker: b
    text: Or 'gather in the leprous skin disease'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 나아만은 화를 내며 떠나가며 말했습니다. “보십시오, 나는 속으로 ‘틀림없이 그가 내게로 나와 서서 그의 하나님 야훼의 이름을 부르고, 그 자리 위로 손을 흔들어, 나병 환자를 고쳐 주리라’고 생각했습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 전통적으로, “나병을 고치다” 혹은 “나병 환자를 고치다”라고 옮길 수 있습니다. 히브리어 동사는 문자적으로는 “모으다/거두어 들이다/제거하다”를 뜻하며, 마지막 말은 나병의 상태 또는 그 병에 걸린 사람을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나병성 피부병을 거두어 들이다”라고도 볼 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְצֹף
  english_pob_choice: became angry
  chosen_korean: 화를 내며
  alternatives_korean:
  - 격분하며
  - 노하여
  lexicon: HALOT
  rationale: wayyiqtol의 진행을 살려 감정이 격해지는 순간을 자연스럽게 표현하되, 과도한 강도는 피했습니다.
- source_word: וַיֵּלַךְ
  english_pob_choice: went away
  chosen_korean: 떠나가며
  alternatives_korean:
  - 가며
  - 물러가며
  lexicon: HALOT
  rationale: 엘리사 집에서 분노하며 자리를 뜨는 흐름을 드러내는 자연스러운 현대 한국어로 옮겼습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기
  lexicon: HALOT
  rationale: 직설적이고 주의를 끄는 담화 표지를 한국어 구어적 명령형으로 살렸습니다.
- source_word: וְאָסַף הַמְּצֹרָע
  english_pob_choice: heal the leprous person
  chosen_korean: 나병 환자를 고쳐 주리라
  alternatives_korean:
  - 나병을 없애 주리라
  - 나병 환자를 제거해 주리라
  lexicon: HALOT
  rationale: 문맥상 제거되는 것은 질병이지만, 히브리어의 지시 대상은 병을 지닌 사람을 포함하므로 ‘나병 환자’를 주어로 살리고 치료 동사를 사용했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문의 신명기적 표지를 유지하기 위해 고유명사로 옮겼습니다. 나아만의 발화 안에서도 신적 이름 자체가 드러나야 하므로 관용적 대체어보다 직접 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 질병 표현의 범위
  chosen_reading: 나병 환자
  alternative_readings:
  - 나병
  - 문둥병자
  rationale: 현대 의학적 진단을 단정하지 않으면서도 본문이 가리키는 피부병/부정결 범주를 독자가 즉시 이해하도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §6
