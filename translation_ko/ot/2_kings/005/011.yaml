    issue: ‘속으로 … 생각했습니다’는 ‘내게 말하였다’라는 히브리어 관용구의 발화성을 약화합니다.
    rationale: ‘속으로 이렇게 말했습니다’가 직역적 의미와 한국어 자연스러움을 함께 살립니다.
