  rationale: 문맥상 제거되는 것은 질병이지만, 히브리어의 지시 대상은 병을 지닌 사람을 포함하므로 ‘나병 환자’를 주어로 살리고 치료 동사를 사용했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
