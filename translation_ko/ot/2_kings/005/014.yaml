  - 잠수했습니다
  lexicon: WLC/HALOT
  rationale: טבל의 핵심 의미인 ‘담그다/잠그다’를 현대 한국어에서 자연스럽고 과도하게 해석하지 않는 표현으로 옮겼습니다.
- source_word: כִּ/דְבַ֖ר אִ֣ישׁ הָ/אֱלֹהִ֑ים
  english_pob_choice: according to the word of the man of God
  chosen_korean: 야훼의 사람의 말대로
  alternatives_korean:
  - 하나님의 사람의 말대로
  - 하나님의 사람의 지시에 따라
  lexicon: WLC/HALOT
  rationale: אישׁ האלהים는 예언자적 호칭이므로 ‘하나님의 사람’이 직역에 가깝지만, 본문이 엘리사를 가리키는 문맥과 이 절 전체의 구약적 관용을 반영해 ‘야훼의 사람’으로 옮겼습니다.
- source_word: בְּשָׂר/וֹ כִּ/בְשַׂ֛ר נַ֥עַר קָטֹ֖ן
  english_pob_choice: his flesh was restored like the flesh of a little boy
  chosen_korean: 그의 살이 어린아이의 살처럼 회복되었고
  alternatives_korean:
  - 그의 피부가 어린아이의 피부처럼 되돌아왔고
  - 그의 몸이 어린아이의 몸처럼 회복되었고
  lexicon: WLC/HALOT
  rationale: בשר을 ‘살’로 유지해 육체적 회복의 생생한 이미지를 보존했고, נער קטן은 문맥상 ‘어린아이’가 자연스럽습니다.
- source_word: וַ/יִּטְהָֽר
  english_pob_choice: he was cleansed
  chosen_korean: 깨끗하게 되었습니다
  alternatives_korean:
  - 정결하게 되었습니다
  - 깨끗해졌습니다
  lexicon: WLC/HALOT
  rationale: טהר는 문맥상 질병에서의 회복과 정결을 함께 담을 수 있어, 결과 상태를 자연스럽게 드러내는 ‘깨끗하게 되었습니다’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 טהר를 어떻게 드러낼지
  chosen_reading: ‘깨끗하게 되었습니다’로 번역해 신체 회복과 정결의 의미를 함께 유지했습니다.
  alternative_readings:
  - ‘정결하게 되었습니다’로 더 의례적 의미를 강조
  - ‘깨끗해졌습니다’로 더 간명하게 처리
  rationale: 이 절은 살의 회복과 깨끗해짐을 병렬로 말하므로, 한쪽만 좁히지 않고 두 의미가 함께 들리도록 했습니다.
  doctrine_reference: 정결/치유의 중첩 의미를 본문 수준에서 보존
- issue: 야훼의 사람이라는 호칭
  chosen_reading: איש האלהים을 ‘야훼의 사람’으로 옮겨 예언자적 권위를 보존했습니다.
  alternative_readings:
  - ‘하나님의 사람’
  - ‘하나님의 종’
  rationale: 한국 교회어에서 익숙한 표현보다 히브리어 관용의 직접성을 살려, 본문의 예언자 정체성을 분명히 했습니다.
  doctrine_reference: 구약 예언자 호칭의 직접 번역
