base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/014.yaml
  text: So he went down and dipped himself in the Jordan seven times[a], according to the word of the man of God; and his flesh was restored like the flesh of a little boy[b], and he was cleansed.
  footnotes:
  - marker: a
    text: Or 'immersed himself.' The Hebrew verb can denote dipping or immersing.
    reason: lexical_alternative
  - marker: b
    text: Or 'he was cleansed.' The Hebrew can be rendered either as a state ('he was clean') or as the result of cleansing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 내려가서 야훼의 사람의 말대로 요단강에서 일곱 번 몸을 담갔습니다[a]. 그러자 그의 살이 어린아이의 살처럼 회복되었고[b], 그는 깨끗하게 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘몸을 잠갔습니다.’ 히브리어 동사는 담그다/잠그다의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘깨끗하게 되었습니다.’ 히브리어는 상태로도, 정결의 결과로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/יֵּ֗רֶד
