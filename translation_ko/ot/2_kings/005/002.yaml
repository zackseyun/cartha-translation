base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/002.yaml
  text: Now bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
  footnotes:
  - marker: a
    text: Or 'a little girl.' The Hebrew phrase נַעֲרָה קְטַנָּה emphasizes her youth and smallness.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and she was before Naaman’s wife,' that is, she attended or served her.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 아람의 무리들이 나가서 이스라엘 땅에서 작은 소녀 하나를 사로잡았고, 그 소녀는 나아만의 아내를 모시고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘작은 소녀’는 히브리어 נַעֲרָה קְטַנָּה의 젊음과 작음을 함께 반영한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모시고 있었습니다’는 히브리어의 문자적 표현 ‘나아만의 아내 앞에 있었다’를 한국어 관용으로 풀어 옮긴 것입니다.
    reason: lexical_alternative
