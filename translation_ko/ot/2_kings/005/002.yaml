  text: Now bands of Arameans had gone out and taken captive from the land of Israel a small girl[b][a], and she served before Naaman’s wife.
  footnotes:
  - marker: a
    text: Or 'a little girl.' The Hebrew phrase נַעֲרָה קְטַנָּה emphasizes her youth and smallness.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'and she was before Naaman’s wife,' that is, she attended or served her.
    reason: lexical_alternative
translation:
  language: ko
  text: 아람의 습격대들이 나가서 이스라엘 땅에서 어린 소녀 한 명을[a] 사로잡아 왔는데, 그 소녀는 나아만의 아내 곁에서 시중들고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어린 소녀’는 히브리어 נַעֲרָה קְטַנָּה를 옮긴 말로, 어린 나이와 작음을 함께 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘나아만의 아내 앞에 있었다’입니다. 이 표현은 그 아내 곁에서 시중들거나 섬겼다는 뜻입니다.
    reason: lexical_alternative
