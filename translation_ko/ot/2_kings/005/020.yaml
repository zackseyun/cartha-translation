  text: וַ/יֹּ֣אמֶר גֵּיחֲזִ֗י נַעַר֮ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִים֒ הִנֵּ֣ה חָשַׂ֣ךְ אֲדֹנִ֗/י אֶֽת נַעֲמָ֤ן הָֽ/אֲרַמִּי֙ הַ/זֶּ֔ה מִ/קַּ֥חַת מִ/יָּד֖/וֹ אֵ֣ת אֲשֶׁר הֵבִ֑יא חַי יְהוָה֙ כִּֽי אִם רַ֣צְתִּי אַחֲרָ֔י/ו וְ/לָקַחְתִּ֥י מֵ/אִתּ֖/וֹ מְאֽוּמָה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/020.yaml
  text: But Gehazi[a], the servant of Elisha the man of God, said, “Look, my master has spared Naaman this Aramean by not taking from his hand what he brought. As Yahweh lives[d][c][b], I will run after him and take something from him.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''this Aramean, Naaman''; the appositional order is retained in sense but smoothed in English.'
    reason: lexical_alternative
  - marker: b
    text: Or 'has held back from taking from his hand what he brought.'
    reason: alternative_reading
  - marker: c
    text: 'Hebrew oath formula: ''As the LORD lives.'''
    reason: cultural_note
  - marker: d
    text: Or 'has spared this Aramean, Naaman, by not taking from his hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 게하시, 곧 하나님의 사람 엘리사의 종이 말했습니다. “보십시오, 나의 주인께서 이 아람 사람 나아만의 손에서 그가 가져온 것을 받지 않으심으로써 그를 아끼셨습니다. 야훼께서 살아 계심을 두고 맹세하건대, 내가 그를 뒤쫓아가서 그에게서 무언가를 받겠습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 히브리어 맹세 공식 ‘야훼께서 살아 계심을 두고’를 옮긴 것입니다.
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 시종
  - 젊은이
  - 수종
  lexicon: HALOT
  rationale: 엘리사 아래에서의 가사·하인 역할을 가리키므로, 나이를 앞세우는 ‘젊은이’보다 기능과 신분을 드러내는 ‘종’이 더 적절합니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 사내
  - 하나님 사람
  lexicon: HALOT
  rationale: 예언자 칭호를 관용적으로 옮겨, 독자가 인물의 소명을 즉시 알아보게 했습니다.
- source_word: הָאֲרַמִּי
  english_pob_choice: Aramean
  chosen_korean: 아람 사람
  alternatives_korean:
  - 시리아 사람
  - 아람인
  lexicon: HALOT
  rationale: 히브리어의 민족·지리적 표현을 직접 살려 ‘아람 사람’으로 옮겼습니다.
- source_word: חָשַׂךְ… מִקַּחַת
  english_pob_choice: has spared… by not taking
  chosen_korean: 받지 않음으로써 그를 아끼셨습니다
  alternatives_korean:
  - 받는 것을 삼가셨습니다
  - 받아들이지 않으셔서 그를 놓아주셨습니다
  lexicon: HALOT
  rationale: ‘삼가다/아끼다’의 뉘앙스를 함께 살려, 엘리사가 나아만에게서 보상을 거절한 행위를 ‘아끼셨습니다’로 자연스럽게 표현했습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계심을 두고 맹세합니다
  alternatives_korean:
  - 야훼께서 살아 계십니다
  - 야훼의 삶을 두고
  lexicon: HALOT
  rationale: 히브리어 맹세 공식의 힘을 살리되, 한국어에서는 맹세 행위가 분명하도록 ‘살아 계심을 두고 맹세합니다’로 풀었습니다.
theological_decisions:
- issue: יהוה의 번역과 맹세 공식의 예배적 뉘앙스
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기고, 맹세 공식을 ‘야훼께서 살아 계심을 두고 맹세합니다’로 표현했습니다.
  alternative_readings:
  - 여호와께서 살아 계심을 두고
  - 주님께서 살아 계심을 두고
  rationale: POB의 본문 정책에 따라 하나님의 고유명을 보존해야 하며, 이 구절의 맹세는 단순 서술이 아니라 신적 증언을 호출하는 공식이므로 그 긴장을 드러내는 표현이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
