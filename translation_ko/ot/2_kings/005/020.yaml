revisions:
- from: 게하시, 곧 하나님의 사람 엘리사의 종이 말했습니다. “보십시오, 나의 주인이 나아만 이 아람 사람에게서 그가 가져온 것을 그의 손에서 받지 않음으로써 그를 아끼셨습니다. 야훼께서 살아 계심을 두고 맹세합니다. 내가 곧 그를 뒤쫓아 가서 그에게서 무엇이든 받아 오겠습니다.”[a][b]
  to: 게하시, 곧 하나님의 사람 엘리사의 종이 말했습니다. “보십시오, 나의 주인께서 이 아람 사람 나아만의 손에서 그가 가져온 것을 받지 않으심으로써 그를 아끼셨습니다. 야훼께서 살아 계심을 두고 맹세하건대, 내가 그를 뒤쫓아가서 그에게서 무언가를 받겠습니다.”[b]
  rationale: 원문의 맹세 공식과 그에 뒤따르는 결의를 한 문장으로 연결하고, 반복되는 대명사를 ‘나아만의 손에서’로 명확히 했습니다. 또한 원문에 없는 ‘가져오다’의 의미를 제거하고 מְאוּמָה를 문맥에 맞게 ‘무언가’로 조정했습니다. 불필요한 어순 주석은 삭제했습니다.
