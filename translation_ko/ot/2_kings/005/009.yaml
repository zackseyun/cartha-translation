translation:
  language: ko
  text: 나아만은 그의 말과 병거를 거느리고 와서 엘리사의 집 문 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 말과 그의 병거와 함께’입니다. 두 단수형은 문맥상 집합적으로, 곧 말들과 병거들을 가리킬 수 있습니다.
    reason: lexical_alternative
