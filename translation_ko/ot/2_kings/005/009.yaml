    text: 히브리어는 문자적으로 ‘그의 말과 그의 병거와 함께’이지만, 여기서는 집합적 의미가 분명하므로 한국어에서는 자연스럽게 ‘말과 병거를 거느리고’로 옮겼습니다.
    reason: lexical_alternative
