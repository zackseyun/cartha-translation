  text: So Naaman came with his horses and chariots[a], and stood at the entrance of Elisha’s house.
  footnotes:
  - marker: a
    text: Hebrew literally, 'with his horse and with his chariot'; the singular forms likely function collectively, hence 'horses and chariots.'
