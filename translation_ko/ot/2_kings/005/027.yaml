    text: Traditionally, 'Naaman’s leprosy will cling to you ... and he went out leprous, white as snow.' The Hebrew terms צָרַעַת / מְצֹרָע refer more broadly to a serious skin disease or condition, not necessarily modern leprosy.
    reason: lexical_alternative
