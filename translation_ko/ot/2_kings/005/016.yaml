  lexicon: HALOT
  rationale: ‘서 있다’는 예언자적/궁정적 관용구를 살려, ‘섬기는’으로 의미를 풀어버리지 않고 직역에 가깝게 유지했습니다.
- source_word: אִם אֶקָּח
  english_pob_choice: I will not take it
  chosen_korean: 저는 그것을 받지 않겠습니다
  alternatives_korean:
