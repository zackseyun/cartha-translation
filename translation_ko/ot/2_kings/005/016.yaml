  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: literally, ''As the LORD lives ... if I take [it],'' where ''if'' expresses a strong negation: ''I will certainly not take it.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'in whose presence I stand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “내가 그분 앞에 서 있는 야훼께서 살아 계심을 두고 맹세합니다.[a] 나는 그것을 받지 않겠습니다.” 나아만이 그에게 그것을 받으라고 강권했지만, 엘리사는 거절했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 공식은 직역하면 ‘야훼께서 살아 계심을 두고 … 내가 받는다면’입니다. 여기서 ‘만일’은 강한 부정을 나타내므로, ‘나는 결코 받지 않겠습니다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘내가 그분 앞에 서 있는’입니다. 이는 야훼의 앞에 서서 섬긴다는 예언자적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
