  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר חַי יְהוָ֛ה אֲשֶׁר עָמַ֥דְתִּי לְ/פָנָ֖י/ו אִם אֶקָּ֑ח וַ/יִּפְצַר בּ֥/וֹ לָ/קַ֖חַת וַ/יְמָאֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/016.yaml
  text: But he said[a], “As Yahweh lives, before whom I stand, I will not take it.” And he urged him to take it[b], but he refused.
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: literally, ''As the LORD lives ... if I take [it],'' where ''if'' expresses a strong negation: ''I will certainly not take it.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'in whose presence I stand.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “야훼께서 살아 계신 것처럼, 제가 그분 앞에 서 있는 만큼 저는 그것을 받지 않겠습니다.” 그러나 그는 그것을 받으라고 그를 간절히 권했으나, 그는 거절했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 맹세 공식에서는 ‘if’가 강한 부정을 나타내므로, 뜻은 ‘나는 결코 그것을 받지 않겠습니다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘제가 서 있는 그분의 앞에서’ 또는 ‘제가 그분의 면전에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계신 것처럼
  alternatives_korean:
  - 야훼의 삶을 두고
  - 야훼께서 살아 계십니다
  lexicon: HALOT
  rationale: 히브리어 맹세 공식의 관용적 힘을 살리되, ‘살아 계신 것처럼’으로 한국어 맹세 표현을 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 POB 기준에 따라 ‘야훼’로 직접 옮겨, 고유 이름과 맹세의 엄숙성을 보존했습니다.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  english_pob_choice: before whom I stand
  chosen_korean: 제가 그분 앞에 서 있는
  alternatives_korean:
  - 제가 그분 앞에 서 있습니다
  - 제가 섬기는
  lexicon: HALOT
  rationale: ‘서 있다’는 예언자적/궁정적 관용구를 살려, ‘섬기는’으로 의미를 풀어버리지 않고 직역에 가깝게 유지했습니다.
- source_word: אִם אֶקָּח
  english_pob_choice: I will not take it
  chosen_korean: 저는 그것을 받지 않겠습니다
  alternatives_korean:
  - 저는 그것을 취하지 않겠습니다
  - 제가 그것을 받지 않을 것입니다
  lexicon: HALOT
  rationale: 맹세 문맥의 ‘if’가 강한 부정을 뜻하므로, 한국어에서는 문맥상 생략된 부정을 분명히 하여 ‘받지 않겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문에 야훼의 이름(יהוה)이 직접 나오므로, 제목적 표현 ‘주’로 대체하지 않고 프로젝트 기본값대로 고유명 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
