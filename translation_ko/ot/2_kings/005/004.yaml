translation:
  language: ko
  text: 그래서 그는 들어가 자기 주인에게 이렇게 보고했습니다. “이스라엘 땅에서 온 그 소녀가 이러이러하게[a] 말했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘이렇게 이렇게’ 또는 ‘이러이러하게’라는 뜻이며, 그 말을 그대로 반복하지 않고 요약하여 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: he went in
  chosen_korean: 들어가서
  alternatives_korean:
  - 가서
  - 가서 들어가
  lexicon: HALOT
  rationale: 문맥상 상관에게 보고하려고 안으로 들어가는 동작이므로, 단순한 ‘가다’보다 ‘들어가다’가 장면을 더 정확히 드러냅니다.
- source_word: לַאדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 주군
  - 그의 주님
  lexicon: HALOT
  rationale: 나아만의 상하 관계를 나타내는 אָדוֹן은 여기서 주군보다 주인/상관에 가까우므로, ‘그의 주인’이 가장 자연스럽고 정확합니다.
- source_word: כָּזֹאת וְכָזֹאת
  english_pob_choice: Thus and thus
  chosen_korean: 이렇게 이렇게
  alternatives_korean:
  - 이러이러하게
  - 이러쿵저러쿵
  lexicon: HALOT
  rationale: 히브리어 관용구로 구체적 내용을 반복하지 않고 요약하는 표현이므로, 한국어에서는 의미를 살리면서도 보고체에 맞는 ‘이렇게 이렇게’로 옮겼습니다.
- source_word: הַנַּעֲרָה
  english_pob_choice: the girl
  chosen_korean: 그 여인
  alternatives_korean:
  - 그 소녀
  - 그 젊은 여자
  - 그 여자 아이
  lexicon: HALOT
  rationale: 문자적으로는 ‘소녀/여자아이’ 쪽이 가능하지만, 여기서는 노예 신분의 어린 여자라는 맥락보다 발화 주체를 가리키는 호칭이 중요하므로 너무 유치하게 들리지 않는 ‘여인’을 택했습니다.
theological_decisions:
- issue: 지명 표현의 범위
  chosen_reading: ‘이스라엘 땅에서 온’으로 옮겨, 단순한 출신지보다 ‘땅/지역’의 뉘앙스를 유지했습니다.
  alternative_readings:
  - ‘이스라엘에서 온’
  - ‘이스라엘 사람인’
  rationale: אֶרֶץ는 ‘땅/나라’의 의미를 갖기 때문에, 지역적 출처를 분명히 하는 번역이 원문에 더 가깝습니다.
  doctrine_reference: none
