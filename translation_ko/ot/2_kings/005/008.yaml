source:
  edition: WLC
  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ אֱלִישָׁ֣ע אִישׁ הָ/אֱלֹהִ֗ים כִּֽי קָרַ֤ע מֶֽלֶךְ יִשְׂרָאֵל֙ אֶת בְּגָדָ֔י/ו וַ/יִּשְׁלַח֙ אֶל הַ/מֶּ֣לֶךְ לֵ/אמֹ֔ר לָ֥/מָּה קָרַ֖עְתָּ בְּגָדֶ֑י/ךָ יָבֹֽא נָ֣א אֵלַ֔/י וְ/יֵדַ֕ע כִּ֛י יֵ֥שׁ נָבִ֖יא בְּ/יִשְׂרָאֵֽל׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/008.yaml
  text: Now when Elisha[a], the man of God, heard that the king of Israel had torn his clothes, he sent to the king, saying, “Why have you torn your clothes? Please let him come to me[b], and he will know that there is a prophet in Israel.”
  footnotes:
  - marker: a
    text: Or 'tore his garments.' The Hebrew refers to the customary act of tearing one's clothing as a sign of distress or mourning.
    reason: lexical_alternative
  - marker: b
    text: '''Please let him come to me'' refers to Naaman, not the king of Israel.'
    reason: cross_reference
translation:
  language: ko
  text: 하나님의 사람 엘리사가 이스라엘 왕이 자기 옷을 찢었다는 말을 듣고 왕에게 전갈을 보내어 말했습니다. “어찌하여 옷을 찢으셨습니까? 그가 내게로 오게 하십시오. 그러면 그가 이스라엘에 예언자가 있음을 알게 될 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 내게로 오게 하십시오’와 이어지는 ‘그가 … 알게 될 것입니다’의 ‘그’는 이스라엘 왕이 아니라 나아만을 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님께 속한 사람
  - 하나님의 사람인 엘리사
  lexicon: HALOT
  rationale: 엘리사의 직함으로 기능하는 관용구이므로, 단순한 경건함보다 하나님의 대표라는 표지를 살리는 표현을 택했습니다.
- source_word: קָרַע ... אֶת בְּגָדָיו
  english_pob_choice: had torn his clothes
  chosen_korean: 자기 옷을 찢었다
  alternatives_korean:
  - 자기 겉옷을 찢었다
  - 자기 의복을 찢었다
  lexicon: HALOT
  rationale: 고통이나 애도의 표시로 옷을 찢는 관습을 드러내되, 현대 한국어에서 자연스러운 ‘옷을 찢다’를 사용했습니다.
- source_word: יָבֹא נָא אֵלַי
  english_pob_choice: Please let him come to me
  chosen_korean: 그가 나에게로 오게 하십시오
  alternatives_korean:
  - 그를 내게로 오게 하십시오
  - 그가 오게 해 주십시오
  lexicon: HALOT
  rationale: 주어가 나아마임을 가리키는 3인칭 요청이므로, 왕에게 직접 오라는 말이 아니라 ‘그가’ 오게 하라는 뜻을 분명히 했습니다.
- source_word: נָבִיא
  english_pob_choice: prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자
  lexicon: HALOT
  rationale: 공적 발화와 현대 가독성을 고려해 ‘예언자’를 택했고, 이는 히브리어 נָבִיא의 기본 의미를 직접 반영합니다.
theological_decisions:
- issue: 왕의 옷 찢음과 엘리사의 반응에 담긴 의미
  chosen_reading: 엘리사는 왕의 절망적 행동을 책망하기보다, 야훼의 예언자적 권위를 드러내기 위해 나아마임의 방문을 요청합니다.
  alternative_readings:
  - 단순한 정보 전달로 볼 수 있음
  - 엘리사가 왕을 직접 질책하는 장면으로 읽을 수 있음
  rationale: 문맥상 엘리사의 말은 왕의 행위를 비난하기보다, 이스라엘 안에 예언자가 있음을 알게 하려는 선포적 대응입니다.
  doctrine_reference: 본문 문맥의 예언자적 권위 보존
- issue: 예언자 표지로서의 ‘있음’
  chosen_reading: ‘이스라엘에 예언자가 있음을’으로 존재 선언을 살렸습니다.
  alternative_readings:
  - ‘이스라엘에 예언자가 있다’
  - ‘이스라엘은 예언자를 가진다’
  rationale: 히브리어 יֵשׁ의 존재 강조를 살려, 이스라엘 가운데 실제로 예언자가 있음을 분명히 하였습니다.
  doctrine_reference: 히브리어 קיימ/יֵשׁ의 존재 진술
