revisions:
- from: 엘리사가—하나님의 사람—이스라엘 왕이 자기 옷을 찢었다는 말을 듣고 왕에게 사람을 보내어 말했습니다. "어찌하여 당신은 옷을 찢었습니까? 그가 나에게로 오게 하십시오. 그러면 이스라엘에 예언자가 있음을 알게 될 것입니다."[a]
  to: 하나님의 사람 엘리사가 이스라엘 왕이 자기 옷을 찢었다는 말을 듣고 왕에게 전갈을 보내어 말했습니다. “어찌하여 옷을 찢으셨습니까? 그가 내게로 오게 하십시오. 그러면 그가 이스라엘에 예언자가 있음을 알게 될 것입니다.”[a]
  rationale: 본문이 명시하지 않는 ‘사람’을 보내었다는 특정은 피하고, 직접화법이 뒤따르는 문맥에 맞게 ‘전갈을 보내어’로 다듬었습니다. 또한 동격 삽입을 자연스러운 한국어 어순으로 조정하고, 마지막 절의 주어가 나아만임을 본문과 각주에서 일관되게 밝혔습니다.
