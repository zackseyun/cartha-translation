base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת can refer more broadly to a serious skin disease, not necessarily Hansen’s disease specifically.
    reason: lexical_alternative
  - marker: b
    text: Or “he is seeking an occasion against me” / “he is looking for a pretext against me.”
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 왕이 그 편지를 읽자 자기 옷을 찢고 말했습니다. “내가 하나님이어서 죽이기도 하고 살리기도 한단 말입니까? 이 사람이 한 사람을 나병[a]에서 낫게 해 달라고 내게 편지를 보내다니! 그러니 부디 잘 살펴보십시오. 그가 나에게 시비를 걸 구실을 찾고 있음을 보십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת는 한센병만이 아니라 더 넓은 범위의 심각한 피부 질환을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “그가 나에게 시비를 걸고 있음을 보십시오” 또는 “그가 나를 대적할 구실을 찾고 있음을 보십시오.”
    reason: alternative_reading
lexical_decisions:
