  source_fidelity: 초안은 편지, 옷을 찢는 행위, 하나님만이 생사를 주관하신다는 수사적 질문, 그리고 상대의 적대적 의심이라는 주요 의미를 대체로 반영합니다. 그러나 ‘자기의 나병 환자를 고쳐 달라고 사람을 보내다니’는 원문의 ‘한 사람을 그의 나병에서 낫게 해 달라고 나에게 보내다/요구하다’라는 구문을 어색하게 바꾸며, 마치 환자를 보내는 것으로 읽힐 수 있습니다. 각주 표지도 내용과 맞지 않게 배치되었습니다.
  naturalness: ‘오직, 부디 알아보고 보십시오’는 현대 표준어 합쇼체로 다소 부자연스럽고 ‘알아보고’와 ‘보십시오’가 중복됩니다. ‘그러니 부디 잘 살펴보십시오’가 자연스럽고 원문의 촉구를 보존합니다. ‘트집을 잡으려는’은 가능하지만, 여기서는 적대적 구실을 찾는다는 뜻을 더 분명히 하는 표현이 좋습니다.
  terminology: ‘하나님’, ‘나병’, ‘옷을 찢고’는 문맥과 한국어 성경 문체에 적절합니다. 다만 צָרַעַת의 의학적 범위는 ‘나병’보다 넓을 수 있으므로 해당 단어에 각주를 직접 연결해야 합니다. ‘나병 환자’라는 표현은 원문에 없는 명사구를 만들고, 앵커도 잘못 연결되어 있으므로 피합니다.
