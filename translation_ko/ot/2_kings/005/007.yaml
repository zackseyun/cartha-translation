  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֡י כִּ/קְרֹא֩ מֶֽלֶךְ יִשְׂרָאֵ֨ל אֶת הַ/סֵּ֜פֶר וַ/יִּקְרַ֣ע בְּגָדָ֗י/ו וַ/יֹּ֨אמֶר֙ הַ/אֱלֹהִ֥ים אָ֨נִי֙ לְ/הָמִ֣ית וּֽ/לְ/הַחֲי֔וֹת כִּֽי זֶה֙ שֹׁלֵ֣חַ אֵלַ֔/י לֶ/אֱסֹ֥ף אִ֖ישׁ מִ/צָּֽרַעְתּ֑/וֹ כִּ֤י אַךְ דְּעֽוּ נָא֙ וּ/רְא֔וּ כִּֽי מִתְאַנֶּ֥ה ה֖וּא לִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/007.yaml
  text: And when the king of Israel read the letter[a], he tore his clothes and said, “Am I God, to put to death and to make alive, that this man sends word to me to cure a man of his leprosy? Only take note, please[b], and see how he is seeking a quarrel with me.”
  footnotes:
  - marker: a
    text: Hebrew צָרַעַת can refer more broadly to a serious skin disease, not necessarily Hansen’s disease specifically.
    reason: lexical_alternative
  - marker: b
    text: Or “he is seeking an occasion against me” / “he is looking for a pretext against me.”
    reason: alternative_reading
translation:
  language: ko
  text: 이스라엘 왕이 그 편지를 읽자[a] 자기 옷을 찢고 말했습니다. 「내가 하나님이어서 죽이기도 하고 살리기도 한단 말입니까? 이 사람이 나에게 자기의 나병[b] 환자를 고쳐 달라고 사람을 보내다니! 오직, 부디 알아보고 보십시오. 그는 나에게 트집을 잡으려는 것입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 צָרַעַת는 단순히 한센병만이 아니라 더 넓은 피부 질환을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “피부병”.
    reason: alternative_reading
lexical_decisions:
- source_word: הַסֵּפֶר
  english_pob_choice: the letter
  chosen_korean: 그 편지
  alternatives_korean:
  - 그 문서
  - 그 두루마리
  lexicon: HALOT
  rationale: 이 문맥에서는 ארam 왕이 보낸 서면 통신문이므로, 일반적인 한국어 독자는 '편지'가 가장 자연스럽고 원문의 기능도 잘 드러냅니다.
- source_word: וַיִּקְרַע בְּגָדָיו
  english_pob_choice: he tore his clothes
  chosen_korean: 자기 옷을 찢고
  alternatives_korean:
  - 자기 의복을 찢고
  - 옷을 찢고
  lexicon: HALOT
  rationale: 슬픔과 충격을 나타내는 관용적 행위를 현대 한국어로 직역에 가깝게 옮겼습니다.
- source_word: הַאֱלֹהִים אָנִי
  english_pob_choice: Am I God
  chosen_korean: 내가 하나님이어서
  alternatives_korean:
  - 내가 신이어서
  - 내가 하나님입니까
  lexicon: HALOT
  rationale: 이 수사적 질문은 생사에 대한 하나님의 고유 권한을 가리키므로, 한국어 성경 용례에 맞는 '하나님'을 유지하되 질문의 논리 구조를 살렸습니다.
- source_word: צָּרַעַת
  english_pob_choice: leprosy
  chosen_korean: 나병
  alternatives_korean:
  - 피부병
  - 문둥병
  lexicon: HALOT
  rationale: 이 이야기의 익숙한 전승 용어를 따라 '나병'으로 옮기되, 영어 주석처럼 이 히브리어가 더 넓은 피부 질환을 가리킬 수 있음을 각주로 보완합니다.
theological_decisions:
- issue: 생사 권한에 대한 수사적 부인
  chosen_reading: ‘내가 하나님이어서 죽이기도 하고 살리기도 한단 말입니까?’로 옮겨, 왕이 하나님의 고유 권한을 자기에게 부인하는 말로 읽었습니다.
  alternative_readings:
  - ‘내가 신이란 말입니까?’
  - ‘내가 사람을 죽이고 살릴 수 있단 말입니까?’
  rationale: 본문은 왕의 무능을 일반적으로 말하는 것이 아니라, 생사에 대한 하나님의 주권을 전제한 수사적 질문입니다. 이 점이 약해지지 않도록 직역적 구조를 유지했습니다.
  doctrine_reference: 창조주-피조물 구별, 하나님의 주권
