- from: 이스라엘 왕이 그 편지를 읽자[a] 자기 옷을 찢고 말했습니다. 「내가 하나님이어서 죽이기도 하고 살리기도 한단 말입니까? 이 사람이 나에게 자기의 나병[b] 환자를 고쳐 달라고 사람을 보내다니! 오직, 부디 알아보고 보십시오. 그는 나에게 트집을 잡으려는 것입니다」.
  to: 이스라엘 왕이 그 편지를 읽자 자기 옷을 찢고 말했습니다. “내가 하나님이어서 죽이기도 하고 살리기도 한단 말입니까? 이 사람이 한 사람을 나병[a]에서 낫게 해 달라고 내게 편지를 보내다니! 그러니 부디 잘 살펴보십시오. 그가 나에게 시비를 걸 구실을 찾고 있음을 보십시오[b].”
  rationale: 원문의 ‘편지를 읽자’와 ‘편지를 보내다’의 서신 문맥을 자연스럽게 유지하면서, 치유의 대상이 ‘나병 환자’가 아니라 ‘나병에서 낫게 될 한 사람’임을 분명히 했습니다. 수사적 질문의 생사 대조와 왕의 적대적 의심은 보존했습니다. 또한 모든 각주 표지를 해당 어휘·구문에 재배치하고, 영어 POB 감사 기록에 있는 두 주석의 기능을 정확히 반영했습니다.
