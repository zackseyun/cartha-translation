  naturalness: ‘그의 피부병에서 건져 내십시오’는 현대 한국어에서 질병 치료의 표현으로 부자연스럽고 의미가 다소 흔들립니다. 수신자인 이스라엘 왕을 ‘왕께’로 지칭하고 ‘고쳐 주십시오’라고 하는 것이 왕실 서신의 격식과 현대 합쇼체에 자연스럽습니다.
