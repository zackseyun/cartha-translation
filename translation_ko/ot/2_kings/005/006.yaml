source:
  edition: WLC
  text: וַ/יָּבֵ֣א הַ/סֵּ֔פֶר אֶל מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר וְ/עַתָּ֗ה כְּ/ב֨וֹא הַ/סֵּ֤פֶר הַ/זֶּה֙ אֵלֶ֔י/ךָ הִנֵּ֨ה שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ אֶת נַעֲמָ֣ן עַבְדִּ֔/י וַ/אֲסַפְתּ֖/וֹ מִ/צָּרַעְתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/006.yaml
  text: And he brought the letter to the king of Israel[a], saying, “And now, when this letter comes to you, behold, I have sent Naaman my servant to you, so that you may gather him in from his skin disease.”
  footnotes:
  - marker: a
    text: Or “cure him of his leprosy.” The Hebrew literally says “gather him in from his skin disease,” using an unusual expression for removing the affliction.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 편지를 이스라엘 왕에게 가져와서 말했습니다. “이제 이 편지가 왕께 이르면, 보십시오, 제가 제 종 나아만을 왕께 보냈으니, 그의 피부병을 고쳐 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 나병을 고쳐 주십시오.” 히브리어는 문자적으로는 “그를 그의 피부병에서 거두어들이십시오”라는 이례적인 표현을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא הַסֵּפֶר
  english_pob_choice: And he brought the letter
  chosen_korean: 그가 그 편지를 ... 가져와서
  alternatives_korean:
  - 그가 그 문서를 ... 가져와서
  - 그가 그 서신을 ... 전달하여
  lexicon: HALOT
  rationale: סֵפֶר는 이 문맥에서 왕실 간의 서면 통신문이므로 한국어로는 자연스럽게 ‘편지’가 가장 적절합니다. וַיָּבֵא의 사역적 뉘앙스도 ‘가져오다’로 살렸습니다.
- source_word: הִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보게
  lexicon: HALOT
  rationale: 왕의 서신에서 주의를 환기하는 형식어로서, 현대 한국어에서는 ‘보십시오’가 격식과 직접성을 함께 유지합니다.
- source_word: עַבְדִּי
  english_pob_choice: my servant
  chosen_korean: 내 종
  alternatives_korean:
  - 내 신하
  - 내 부하
  lexicon: HALOT
  rationale: עבד는 넓게는 종/종복/신하를 뜻하지만, 본문은 왕의 서신이면서도 신분표지를 드러내므로 기본 항목인 ‘종’을 유지했습니다.
- source_word: וַאֲסַפְתּוֹ מִצָּרַעְתּוֹ
  english_pob_choice: so that you may gather him in from his skin disease
  chosen_korean: 그러니 당신이 그를 그의 피부병에서 건져 내십시오
  alternatives_korean:
  - 그러니 당신이 그를 그의 피부병에서 거두어들이십시오
  - 그러니 당신이 그를 그의 나병에서 낫게 하십시오
  lexicon: HALOT
  rationale: אסף의 기본 뜻인 ‘모으다/거두다/안으로 들이다’를 한국어 동사 ‘건져 내다’로 옮겨, 본문의 이례적인 표현을 지나치게 평탄화하지 않으면서도 문맥상 의도를 드러냈습니다. צָרַעַת은 현대 의학명 ‘나병’보다 넓은 범주이므로 ‘피부병’으로 옮겼습니다.
theological_decisions:
- issue: צָרַעַת의 번역 범위
  chosen_reading: ‘피부병’으로 본문을 옮기고, 전통적 병명인 ‘나병’은 본문 밖 대안으로 남깁니다.
  alternative_readings:
  - 나병
  - 문둥병
  rationale: 히브리어 צָרַעַת은 현대의 특정 질환명과 정확히 일치하지 않으므로, 본문에서는 더 넓고 오해가 적은 표현을 택했습니다. 이는 교리 문제가 아니라 역사-언어적 정밀성의 문제입니다.
  doctrine_reference: 원문 우선 번역 원칙; 시대착오적 의학명 회피
