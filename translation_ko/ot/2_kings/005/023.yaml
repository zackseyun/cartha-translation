  to: 나아만이 말했습니다. “부디 두 달란트를 받으십시오.” 나아만은 그에게 강권했습니다[a]. 그는 은 두 달란트를 두 자루[b]에 싸고 옷 두 벌을 함께 묶어 자기 종 두 사람에게 주었습니다. 그들은 그것들을 게하시보다 앞서 지고 갔습니다[c].
