  source_fidelity: 히브리어의 정중한 권유, 이어지는 강권, 은 두 달란트, 두 자루, 옷 두 벌, 나아만의 종 두 사람, 그리고 게하시보다 앞서 운반한 상황을 충실히 반영하도록 다듬을 필요가 있습니다. 특히 לְפָנָיו는 문맥상 게하시를 가리키므로 대명사로 남기면 한국어에서 나아만을 가리키는 것으로 오해될 수 있습니다.
  naturalness: 초안의 ‘그의 앞에 메고 갔습니다’는 선행사가 불분명하고, ‘메고 가다’는 자루와 옷을 통틀어 운반하는 장면에 다소 부자연스럽습니다. ‘게하시보다 앞서 지고 갔습니다’가 문맥과 현대 표준 한국어에 더 자연스럽습니다.
  terminology: ‘달란트’, ‘은 두 달란트’, ‘옷 두 벌’, ‘종 두 사람’은 적절합니다. חֲרִטִים는 ‘자루’로 유지할 수 있습니다. וַיִּפְרָץ בּוֹ는 단순한 시간적 재촉보다는 수락하도록 강하게 권한 뜻이므로 ‘강권했습니다’가 더 정확합니다.
