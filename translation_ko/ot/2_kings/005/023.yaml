source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר נַעֲמָ֔ן הוֹאֵ֖ל קַ֣ח כִּכָּרָ֑יִם וַ/יִּפְרָץ בּ֗/וֹ וַ/יָּצַר֩ כִּכְּרַ֨יִם כֶּ֜סֶף בִּ/שְׁנֵ֣י חֲרִטִ֗ים וּ/שְׁתֵּי֙ חֲלִפ֣וֹת בְּגָדִ֔ים וַ/יִּתֵּן֙ אֶל שְׁנֵ֣י נְעָרָ֔י/ו וַ/יִּשְׂא֖וּ לְ/פָנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/023.yaml
  text: Naaman said[a], “Please, take two talents.” And he urged him, and tied up two talents of silver in two bags, with two changes of clothes, and gave them to two of his servants[c][b], and they carried them before him.
  footnotes:
  - marker: a
    text: Or “he pressed him” / “he insisted with him.”
    reason: lexical_alternative
  - marker: b
    text: That is, two bags or purses containing the silver.
    reason: cultural_note
  - marker: c
    text: Or “ahead of him.” The sense is that Naaman’s servants carried the gifts in front of Gehazi.
    reason: lexical_alternative
translation:
  language: ko
  text: 나아만이 말했습니다[a]. “부디, 두 달란트를 받으십시오.” 그리고 그는 그를 재촉하여 은 두 달란트를 두 자루에 담고, 옷 두 벌과 함께 자기의 두 종에게 주었으며, 그들이 그것을 그의 앞에 메고 갔습니다[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 그에게 강권했습니다” / “그는 그에게 간청하듯 밀어붙였습니다.”
    reason: lexical_alternative
  - marker: b
    text: 즉, 은을 담은 두 자루 또는 주머니를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 “그의 앞쪽으로.” 뜻은 나아만의 종들이 그 선물을 게하시 앞에 들고 갔다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹאֵל
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 청컨대
  lexicon: HALOT
  rationale: 수령을 정중하게 요청하는 뉘앙스를 자연스러운 현대 한국어로 살리되, 과도하게 구어적이지 않게 했습니다.
- source_word: כִּכָּרָיִם / כִּכְּרַיִם כֶּסֶף
  english_pob_choice: two talents / two talents of silver
  chosen_korean: 두 달란트 / 은 두 달란트
  alternatives_korean:
  - 두 재능 단위
  - 은 두 달란트
  lexicon: HALOT
  rationale: 고정된 무게 단위인 ‘달란트’를 유지해 본문의 단위감을 보존하고, 은을 함께 밝혀 문맥을 분명히 했습니다.
- source_word: וַיִּפְרָץ בּוֹ
  english_pob_choice: he urged him
  chosen_korean: 그를 재촉하여
  alternatives_korean:
  - 그를 강권하여
  - 그를 몰아붙여
  lexicon: HALOT
  rationale: 히브리어 관용구의 압박감을 살리되, ‘재촉하다’로 현대 한국어에서 자연스럽고 비교적 중립적인 압박 표현을 택했습니다.
- source_word: חֲרִטִים
  english_pob_choice: bags
  chosen_korean: 두 자루
  alternatives_korean:
  - 두 주머니
  - 두 자루의 자루
  lexicon: HALOT
  rationale: 화폐를 담는 용기를 가리키므로, 본문 맥락상 ‘자루’가 가장 자연스럽고 크기감도 무리 없이 전달합니다.
- source_word: שְׁתֵּי חֲלִפוֹת בְּגָדִים
  english_pob_choice: two changes of clothes
  chosen_korean: 옷 두 벌
  alternatives_korean:
  - 두 벌의 옷
  - 두 갈아입을 옷
  lexicon: HALOT
  rationale: 완전한 의복 한 벌씩의 수량을 간결하게 전달하되, 한국어에서 관용적인 수량 표현을 사용했습니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그의 앞에
  alternatives_korean:
  - 그 앞을 향해
  - 그 앞에서
  lexicon: HALOT
  rationale: 종들이 물건을 들고 앞서 간다는 공간적 관계를 그대로 살렸습니다.
theological_decisions:
- issue: 나아만의 말투와 요구를 어떻게 옮길지
  chosen_reading: 정중한 청유를 ‘부디’로, 압박을 ‘재촉하여’로 옮겨 나아만의 친절하지만 강한 권유를 함께 드러냈습니다.
  alternative_readings:
  - ‘청컨대’로 더 고전적으로 옮김
  - ‘강권하여’로 더 강한 압박을 표시함
  rationale: 본문은 단순한 부탁이 아니라 실제로 수령을 밀어붙이는 상황이므로, 예의와 압박을 동시에 보이도록 했습니다.
  doctrine_reference: 본문 해석의 서술적 정확성
