    text: Or “some distance.” The Hebrew expression denotes a span of travel without specifying an exact measure.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「평안히 가십시오.」 그러자 그는 그에게서 떠나 얼마쯤 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 정확한 길이 단위를 밝히지 않고, ‘어느 정도의 거리’ 정도를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ל֖/וֹ
  english_pob_choice: And he said to him
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그에게 말했습니다
  - 그가 그에게 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어 서술형 wayyiqtol의 이야기 진행을 자연스러운 현대 한국어로 옮기되, 직접화법을 여는 단순한 서술로 유지했습니다.
- source_word: לֵ֣ךְ לְ/שָׁל֑וֹם
  english_pob_choice: Go in peace
  chosen_korean: 평안히 가십시오
  alternatives_korean:
  - 평안 가운데 가십시오
  - 평안히 가라
  lexicon: HALOT
  rationale: לְשָׁלוֹם은 단순한 상태 묘사보다 작별 인사/축복의 관용구이므로, 합쇼체로 그 공손한 파견의 힘을 살렸습니다.
- source_word: וַ/יֵּ֥לֶךְ מֵ/אִתּ֖/וֹ
  english_pob_choice: So he went from him
  chosen_korean: 그러자 그는 그에게서
  alternatives_korean:
  - 그리고 그는 그에게서
  - 그리하여 그는 그에게서
  lexicon: HALOT
  rationale: מֵאִתּוֹ는 ‘그의 곁/그로부터’의 이탈을 나타내므로, 단순한 위치 이동이 아니라 관계적 분리를 드러내도록 번역했습니다.
- source_word: כִּבְרַת אָֽרֶץ־
  english_pob_choice: some distance
  chosen_korean: 어느 정도 떨어진 곳까지
  alternatives_korean:
  - 상당한 거리를
  - 일정한 거리까지
  lexicon: HALOT
  rationale: כִּבְרַת אָרֶץ는 정확한 거리 단위가 아니라 ‘일정한/어느 정도의 거리’를 뜻하므로, 수치를 덧붙이지 않고 범위를 열어 두었습니다.
theological_decisions:
- issue: 엘리사가 나아만에게 한 말의 성격
  chosen_reading: 문장 자체를 단순한 작별/축복 관용구로 유지하고, 명시적 승인이나 비난을 덧붙이지 않았습니다.
  alternative_readings:
  - 나아만의 이후 행동을 승인하는 말로 해석
  - 단순한 예의상 작별 인사로만 해석
  rationale: 히브리어 본문은 רק 관용적 표현만 제시하므로, 본문이 말하지 않는 윤리적 판정을 번역문에 미리 확정하지 않았습니다.
  doctrine_reference: '번역 원칙: 본문이 남겨 둔 긴장을 번역에서 해소하지 않는다.'
