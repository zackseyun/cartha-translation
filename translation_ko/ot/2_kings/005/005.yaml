base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/005.yaml
  text: Then the king of Aram said, “Go, come, and I will send a letter to the king of Israel.” So he went and took in his hand ten talents of silver, six thousand pieces of gold, and ten changes of clothing.
  footnotes:
  - marker: a
    text: Or 'Go ahead'; the Hebrew preserves two imperatives, literally 'Go, come,' likely expressing prompt permission or encouragement.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'six thousand gold'; the specific counted unit is not stated explicitly, so 'pieces of gold' is supplied for natural English.
    reason: lexical_alternative
  - marker: c
    text: '''Aram'' is the Hebrew name; traditionally rendered ''Syria'' in some English versions.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 아람 왕이 말했습니다. 「가서, 내가 이스라엘 왕에게 편지를 보내겠다.」 그래서 그는 가서, 은 열 달란트와 금 육천 개와 옷 열 벌을 손에 들고 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 두 동사는 관용적으로 겹쳐 쓰인 명령형이어서, 한국어에서는 한 번의 재촉/허락으로 자연스럽게 풀었습니다.
    reason: korean_style_note
