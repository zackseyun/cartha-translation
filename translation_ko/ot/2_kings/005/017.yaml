  naturalness: 합쇼체는 대체로 자연스럽지만, 나아만의 겸양적 자기 지칭은 ‘제 종’보다 직접화법 안에서 ‘이 종’이 자연스럽습니다. ‘두 노새가 실을 만큼입니다’는 앞 문장의 ‘한 수레 분’과 중복되고 문장 단절도 부자연스럽습니다.
  terminology: ‘야훼’, ‘번제’, ‘제사’는 적절합니다. 다만 각주 b는 히브리어가 ‘야훼’라고 쓰였다는 듯이 표현해서는 안 되며, 히브리어 자음형 YHWH를 한국어로 ‘야훼’로 옮긴 것임을 밝혀야 합니다.
