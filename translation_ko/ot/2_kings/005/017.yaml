  edition: WLC
  text: וַ/יֹּאמֶר֮ נַעֲמָן֒ וָ/לֹ֕א יֻתַּן נָ֣א לְ/עַבְדְּ/ךָ֔ מַשָּׂ֥א צֶֽמֶד פְּרָדִ֖ים אֲדָמָ֑ה כִּ֡י לֽוֹא יַעֲשֶׂה֩ ע֨וֹד עַבְדְּ/ךָ֜ עֹלָ֤ה וָ/זֶ֨בַח֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים כִּ֖י אִם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/017.yaml
  text: Then Naaman said[a], “If not, please let your servant be given a load of soil, a pair of mules' burden; for your servant will no longer offer burnt offering or sacrifice to other gods[c][b], but only to Yahweh.”
  footnotes:
  - marker: a
    text: Or “the load of a pair of mules” or “two mules’ load.” The Hebrew phrase refers to as much soil as a pair of mules could carry.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the LORD” represents the divine name YHWH; alternatively transliterated “Yahweh.”
    reason: alternative_reading
  - marker: c
    text: Naaman’s request for Israelite soil may reflect the ancient association of a deity with a land, or a desire to worship the LORD on Israelite earth; the text does not state the reason explicitly.
    reason: cultural_note
translation:
  language: ko
  text: 그때 나아만이 말했습니다. "그렇지 않다면, 제 종에게 한 수레 분의 흙을 주십시오. 두 노새가 실을 만큼입니다. 이는 제 종이 다시는 다른 신들에게 번제나 희생제를 드리지 않고, 오직 야훼께만 드리려는 것입니다."[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “노새 두 마리가 실을 수 있는 양의 흙”으로도 옮길 수 있습니다. 히브리어 표현은 두 노새가 운반할 수 있는 만큼의 흙을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 “야훼”는 신적 이름 YHWH를 가리키며, 전통적으로는 “주”로 옮겨지기도 합니다.
    reason: alternative_reading
  - marker: c
    text: 나아만의 이스라엘 흙 요청은 고대의 신-땅 연관 관념이나 이스라엘 땅에서의 예배 의지를 반영할 수 있지만, 본문은 그 이유를 명시하지 않습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וָלֹא
  english_pob_choice: If not
  chosen_korean: 그렇지 않다면
  alternatives_korean:
  - 그렇지 않으면
  - 만일 아니라면
  lexicon: HALOT
  rationale: 앞선 엘리사의 거절에 대한 응답으로 이어지는 조건적·생략적 반응이므로, 단순한 접속보다 자연스러운 조건 표현으로 옮겼습니다.
- source_word: יֻתַּן נָא לְעַבְדְּךָ
  english_pob_choice: please let your servant be given
  chosen_korean: 제 종에게 … 주십시오
  alternatives_korean:
  - 제 종에게 … 주시기를 바랍니다
  - 제 종에게 … 있게 하십시오
  lexicon: HALOT
  rationale: 히브리어 수동·정중 요청을 한국어에서는 공손한 청유형으로 살려, 원문의 겸손한 부탁을 자연스럽게 반영했습니다.
- source_word: מַשָּׂא צֶמֶד פְּרָדִים אֲדָמָה
  english_pob_choice: a load of soil, a pair of mules' burden
  chosen_korean: 한 수레 분의 흙 … 두 노새가 실을 만큼
  alternatives_korean:
  - 흙 한 짐 … 두 노새의 짐만큼
  - 노새 두 마리가 지는 흙 한 짐
  lexicon: HALOT
  rationale: מַשָּׂא와 צֶמֶד פְּרָדִים의 양을 한국어 관용으로 풀어, ‘실을 만큼’이라는 설명적 표현으로 중량감을 전달했습니다.
- source_word: עֹלָה וָזֶבַח
  english_pob_choice: burnt offering or sacrifice
  chosen_korean: 번제나 희생제
  alternatives_korean:
  - 번제나 제물
  - 번제나 제사
  lexicon: HALOT
  rationale: עֹלָה는 제의 용어로서 번제, זֶבַח은 일반 희생제/희생제물을 가리키므로, 두 항목의 구분을 살려 번제와 희생제를 병기했습니다.
- source_word: לֵאלֹהִים אֲחֵרִים כִּי אִם לַיהוָה
  english_pob_choice: to other gods ... but only to Yahweh
  chosen_korean: 다른 신들에게 ... 오직 야훼께만
  alternatives_korean:
  - 다른 신들에게 ... 오직 주님께만
  - 다른 신들에게 ... 야훼께만
  lexicon: HALOT
  rationale: יהוה는 본 문맥에서 언약 이름이므로 기본값대로 ‘야훼’로 옮겼고, כִּי אִם의 배타성을 ‘오직 …께만’으로 분명히 했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신적 고유명사를 ‘야훼’로 옮겨, 본문이 강조하는 배타적 충성을 가리키는 언약 이름을 드러냈습니다.
  doctrine_reference: 'project glossary: יהוה / YHWH → 야훼'
- issue: 나아만의 흙 요청 의미
  chosen_reading: 본문은 요청 사실만 제시하고, 이유는 본문 밖으로 확정하지 않았습니다.
  alternative_readings:
  - 이스라엘 땅에서만 예배할 수 있다는 믿음
  - 그 흙을 제단 바닥으로 쓰려는 의도
  rationale: 본문이 직접 말하지 않는 동기를 번역문에 덧붙이지 않고, 요청과 야훼께만 드리겠다는 고백을 그대로 유지해 신학적 긴장을 보존했습니다.
  doctrine_reference: 'translation philosophy: preserve theological tension'
