  source_fidelity: 히브리어의 전개(종들이 가까이 와서 말함), 존중의 호칭 אָבִי, 큰 요구와 단순한 명령을 대조하는 수사 질문, 그리고 ‘씻고 깨끗해지라’는 명령을 전반적으로 충실히 반영합니다. 다만 ‘큰 일을 말했더라면’은 히브리어의 ‘큰 일을 [하라고] 말하다’라는 문맥상 요구의 뜻을 한국어에서 충분히 드러내지 못하며, ‘말할 때는’은 이미 주어진 명령을 회고하는 장면에서는 과거형이 더 자연스럽습니다.
  naturalness: ‘말하며 이렇게 말했습니다’는 같은 발화 행위를 중복하여 문장이 다소 부자연스럽습니다. 이를 ‘말했습니다’로 간결하게 하고, 인용문 안의 논증을 ‘하물며 … 하셨으니’로 정리하면 현대 한국어 합쇼체의 공적·서사적 문체에 더 잘 맞습니다.
