source:
  edition: WLC
  text: וַ/יִּגְּשׁ֣וּ עֲבָדָי/ו֮ וַ/יְדַבְּר֣וּ אֵלָי/ו֒ וַ/יֹּאמְר֗וּ אָבִי֙ דָּבָ֣ר גָּד֗וֹל הַ/נָּבִ֛יא דִּבֶּ֥ר אֵלֶ֖י/ךָ הֲ/ל֣וֹא תַעֲשֶׂ֑ה וְ/אַ֛ף כִּֽי אָמַ֥ר אֵלֶ֖י/ךָ רְחַ֥ץ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/013.yaml
  text: Then his servants came near and spoke to him and said[a], “My father, if the prophet had spoken to you some great thing, would you not do it? How much more, then, when he says to you, ‘Wash, and be clean’?”
  footnotes:
  - marker: a
    text: Or “and be cleansed.” The Hebrew can denote becoming clean or purified.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 종들이 가까이 와서 그에게 말하며 이렇게 말했습니다. 「아버님, 만일 예언자가 당신에게 큰 일을 말했더라면 당신은 하지 않으셨겠습니까? 하물며 그가 당신에게 『씻으십시오, 그러면 깨끗해지실 것입니다』라고 말할 때는 더욱 그렇지 않겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정결해지실 것입니다.” 히브리어는 깨끗해짐과 정결해짐을 모두 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 하인들
  - 그의 시종들
  lexicon: HALOT
  rationale: עבד는 문맥에 따라 종/노예/하인을 뜻할 수 있는데, 여기서는 나아만에게 예의를 갖춰 말하는 부하들이므로 기본값인 ‘종들’이 자연스럽고 원문의 위계도 살립니다.
- source_word: אָבִי
  english_pob_choice: My father
  chosen_korean: 아버님
  alternatives_korean:
  - 아버지
  - 주인님
  lexicon: HALOT
  rationale: 직역형 ‘제 아버지’보다, 아랫사람이 윗사람을 높여 부르는 호칭으로 쓰인 존칭을 한국어 관용에 맞게 ‘아버님’으로 옮기는 것이 원문의 존중과 비유적 호칭을 함께 보존합니다.
- source_word: דָּבָר גָּדוֹל
  english_pob_choice: some great thing
  chosen_korean: 큰 일
  alternatives_korean:
  - 위대한 일
  - 어려운 일
  lexicon: HALOT
  rationale: 이 표현은 단순한 크기보다 ‘중대한/대단한 요구’를 가리키므로, 한국어에서는 과장 없이도 대비를 살리는 ‘큰 일’이 가장 자연스럽습니다.
- source_word: וּטְהָר
  english_pob_choice: and be clean
  chosen_korean: 그러면 깨끗해지실 것입니다
  alternatives_korean:
  - 그러면 깨끗해지실 것입니다
  - 그러면 정결해지실 것입니다
  - 그러면 깨끗하게 되실 것입니다
  lexicon: HALOT
  rationale: טהר는 여기서 치유와 정결의 겹침을 지니지만, POB의 ‘be clean’에 맞춰 ‘깨끗해지실 것입니다’로 옮겨 신체적 회복과 정결의 여운을 함께 살렸습니다.
theological_decisions:
- issue: 마지막 명령문의 결과절을 어떻게 처리할 것인가
  chosen_reading: ‘씻으십시오, 그러면 깨끗해지실 것입니다’처럼 결과를 분명히 하되, 정결/치유의 중첩은 열어 둡니다.
  alternative_readings:
  - ‘씻으십시오, 그러면 정결해지실 것입니다’
  - ‘씻으십시오, 그러면 깨끗하게 되실 것입니다’
  rationale: 이 장면은 나병성 질환의 치유와 정결 언어가 겹치므로, 특정한 제의적 용어로 고정하기보다 원문이 허용하는 물리적·의례적 의미를 함께 남기는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §3, §6
