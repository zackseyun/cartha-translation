- from: 그의 종들이 가까이 와서 그에게 말하며 이렇게 말했습니다. 「아버님, 만일 예언자가 당신에게 큰 일을 말했더라면 당신은 하지 않으셨겠습니까? 하물며 그가 당신에게 『씻으십시오, 그러면 깨끗해지실 것입니다』라고 말할 때는 더욱 그렇지 않겠습니까?」[a]
  to: 그의 종들이 가까이 와서 그에게 말했습니다. 「아버님, 만일 예언자가 당신에게 큰 일을 하라고 말씀하셨더라면, 당신은 하지 않으셨겠습니까? 하물며 그가 당신에게 ‘씻으십시오. 그러면 깨끗해지실 것입니다’라고 말씀하셨으니, 더욱 하지 않으시겠습니까?」[a]
  rationale: 문맥상 요구의 의미를 ‘큰 일을 하라고’로 명료하게 하였고, 중복된 서술을 정리했습니다. 예언자의 명령은 이미 내려진 것이므로 과거형 ‘말씀하셨으니’를 사용하되, טהר의 의미 범위와 명령의 결과적 뉘앙스는 기존 번역 및 각주대로 유지했습니다.
