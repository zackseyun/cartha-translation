  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ֠/נַעֲמָן שַׂר צְבָ֨א מֶֽלֶךְ אֲרָ֜ם הָיָ֣ה אִישׁ֩ גָּד֨וֹל לִ/פְנֵ֤י אֲדֹנָי/ו֙ וּ/נְשֻׂ֣א פָנִ֔ים כִּֽי ב֛/וֹ נָֽתַן יְהוָ֥ה תְּשׁוּעָ֖ה לַ/אֲרָ֑ם וְ/הָ/אִ֗ישׁ הָיָ֛ה גִּבּ֥וֹר חַ֖יִל מְצֹרָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/001.yaml
  text: Now Naaman[a], commander of the army of the king of Aram, was a great man before his master and highly esteemed, because through him Yahweh had given victory to Aram. The man was a mighty warrior[c][b], but he was leprous.
  footnotes:
  - marker: a
    text: Or 'deliverance' or 'salvation' for 'victory'; the Hebrew term can carry a broader sense, but here it refers to military success.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'leprous.' The term refers to a serious skin affliction in the ancient context and may not correspond exactly to modern clinical leprosy.
    reason: cultural_note
  - marker: c
    text: Traditionally 'Syria'; Hebrew 'Aram.'
    reason: alternative_reading
translation:
  language: ko
  text: 아람 왕의 군대 사령관 나아만은 그의 주인 앞에서 크게 존귀한 사람이었습니다. 이는 야훼께서 그를 통해 아람에 승리를 주셨기 때문입니다. 그 사람은 용맹한 전사였으나 나병환자였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 תְּשׁוּעָה는 여기서 ‘승리’의 뜻이지만, 문맥에 따라 ‘구원’이나 ‘건짐’도 될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘나병환자’는 고대의 심각한 피부 질환을 가리키는 표현이며, 현대의 임상적 나병과 정확히 일치하지 않을 수 있습니다.
    reason: cultural_note
  - marker: c
    text: 전통적으로는 ‘시리아’로 번역되기도 하지만, 히브리어는 ‘아람’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַעֲמָן
  english_pob_choice: Now Naaman
  chosen_korean: 나아만은
  alternatives_korean:
  - 그리고 나아만은
  - 이제 나아만은
  lexicon: HALOT
  rationale: וְ는 서사의 전환을 여는 기능이므로 한국어에서는 자연스러운 도입 없이 주어를 바로 제시해도 의미가 유지됩니다. 고유명사는 통용 표기인 나아만을 사용했습니다.
- source_word: שַׂר צְבָא
  english_pob_choice: commander of the army
  chosen_korean: 군대 사령관
  alternatives_korean:
  - 군대의 지휘관
  - 군대 대장
  lexicon: HALOT
  rationale: שַׂר과 צָבָא의 결합은 군사적 직위를 가리키므로, 현대 한국어에서 바로 이해되는 ‘군대 사령관’으로 옮겼습니다.
- source_word: לִפְנֵי אֲדֹנָיו וּנְשֻׂא פָנִים
  english_pob_choice: before his master and highly esteemed
  chosen_korean: 그의 주인 앞에서 크게 존귀한 사람이었습니다
  alternatives_korean:
  - 그의 주인 앞에서 높이 여김을 받았습니다
  - 그의 주인 앞에서 매우 귀한 사람이었습니다
  lexicon: HALOT
  rationale: לִפְנֵי는 ‘앞에서/면전에서’의 뜻이므로 관계를 살려 ‘앞에서’로 옮겼고, וּנְשֻׂא פָנִים의 관용구는 직역보다 ‘존귀한’으로 옮겨 본문의 사회적 명예를 드러냈습니다.
- source_word: יְהוָה תְּשׁוּעָה
  english_pob_choice: Yahweh had given victory
  chosen_korean: 야훼께서 ... 승리를 주셨기 때문입니다
  alternatives_korean:
  - 야훼께서 ... 구원을 주셨기 때문입니다
  - 야훼께서 ... 건져 주셨기 때문입니다
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 넓게는 구원/구출이지만, 여기서는 군사적 문맥이므로 ‘승리’가 가장 직접적입니다. יְהוָה는 프로젝트 기준에 따라 야훼로 옮겼습니다.
- source_word: מְצֹרָע
  english_pob_choice: leprous
  chosen_korean: 나병환자였습니다
  alternatives_korean:
  - 문둥병에 걸려 있었습니다
  - 피부병을 앓고 있었습니다
  lexicon: HALOT
  rationale: מְצֹרָע는 고대의 गंभीर한 피부 질환 상태를 가리키며, 현대 의학적 진단명과 1:1 대응은 아니지만 한국어 관용 표현상 ‘나병환자’가 본문 연결을 가장 잘 살립니다.
theological_decisions:
- issue: 아람의 승리를 야훼의 행위로 귀속시키는 표현
  chosen_reading: 아람에 승리를 주셨기 때문입니다
  alternative_readings:
  - 아람에 구원을 주셨기 때문입니다
  - 아람을 위해 승리를 베푸셨기 때문입니다
  rationale: 본문은 이스라엘 밖의 아람의 군사적 성과도 야훼의 주권 아래 있음을 직접 진술하므로, 그 긴장을 완화하지 않고 그대로 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
