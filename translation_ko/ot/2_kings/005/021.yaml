id: 2KI.5.21
reference: 2 Kings 5:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְדֹּ֥ף גֵּיחֲזִ֖י אַחֲרֵ֣י נַֽעֲמָ֑ן וַ/יִּרְאֶ֤ה נַֽעֲמָן֙ רָ֣ץ אַחֲרָ֔י/ו וַ/יִּפֹּ֞ל מֵ/עַ֧ל הַ/מֶּרְכָּבָ֛ה לִ/קְרָאת֖/וֹ וַ/יֹּ֥אמֶר הֲ/שָׁלֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/021.yaml
  text: So Gehazi pursued Naaman. When Naaman saw him running after him[a], he got down from the chariot to meet him and said, “Is all well?”
  footnotes:
  - marker: a
    text: 'Hebrew: ''Is all well?'' The expression uses shalom as a greeting or inquiry about well-being.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 게하시가 나아만을 뒤쫓았습니다. 나아만은 게하시가 자기 뒤를 따라 달려오는 것을 보고, 병거에서 내려 게하시를 맞으러 가서 말했습니다. “모든 일이 잘되었습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדֹּף
  english_pob_choice: pursued
  chosen_korean: 뒤쫓았습니다
  alternatives_korean:
  - 추격했습니다
  - 쫓아갔습니다
  lexicon: HALOT
  rationale: רדף의 핵심은 의도적인 추적이므로, 문맥상 자연스럽고 ‘pursued’의 긴박감을 살리는 ‘뒤쫓다’로 옮겼습니다.
- source_word: וַיִּרְאֶה ... רָץ אַחֲרָיו
  english_pob_choice: saw him running after him
  chosen_korean: 자기를 뒤쫓아 달려오는 것을 보고
  alternatives_korean:
  - 자기 뒤에서 달려오는 것을 보고
  - 그가 자기를 뒤쫓아 달려오는 것을 보고
  lexicon: HALOT
  rationale: 히브리어의 압축된 시각적 표현을 한국어에서도 ‘보고’와 현재 진행적 동작으로 살려, 나아만이 달려오는 상황을 즉시 인지하는 장면을 전달했습니다.
- source_word: וַיִּפֹּל מֵעַל הַמֶּרְכָּבָה
  english_pob_choice: got down from the chariot
  chosen_korean: 병거에서 내려
  alternatives_korean:
  - 병거에서 내려왔습니다
  - 병거에서 몸을 낮추고
  lexicon: HALOT
  rationale: נפל이 여기서는 ‘떨어지다’가 아니라 신속히 하차하는 관용법이므로, 오해를 피하면서도 동작을 자연스럽게 드러내는 ‘내려’로 옮겼습니다.
- source_word: הֲשָׁלוֹם
  english_pob_choice: Is all well?
  chosen_korean: 모든 일이 잘되었습니까?
  alternatives_korean:
  - 잘 있습니까?
  - 모든 것이 괜찮습니까?
  lexicon: HALOT
  rationale: שלום이 인사/안부 확인의 관용 표현이므로 단순한 ‘평안’보다 안부를 묻는 질문으로 풀어, 한국어에서 자연스럽고 격식 있는 표현을 택했습니다.
theological_decisions:
- issue: 안부 확인 표현 הֲשָׁלוֹם의 처리
  chosen_reading: 본문의 질문을 ‘모든 일이 잘되었습니까?’로 옮겨, ‘평강’의 선언이 아니라 상대의 상태를 묻는 안부 확인임을 분명히 했습니다.
  alternative_readings:
  - 평안하십니까?
  - 잘 있습니까?
  rationale: 이 표현은 히브리어 관용구로서 화자의 질문 의도를 드러내므로, 한국어 독자에게도 그 기능이 분명히 전달되도록 했습니다.
  doctrine_reference: 문맥상 인사/안부 표현의 관용법
- issue: 서술문과 직접화법의 문체
  chosen_reading: 서술은 합쇼체로 유지하고, 인용문은 공손한 질문형으로 처리했습니다.
  alternative_readings:
  - 모든 일이 잘되었소?
  - 모든 것이 평안합니까?
  rationale: 본문은 내러티브와 대화가 이어지는 장면이므로, 표준적인 현대 문어체를 유지하면서 등장인물의 직접 발화를 자연스럽게 살렸습니다.
  doctrine_reference: 한국어 성경 번역 문체 일관성
