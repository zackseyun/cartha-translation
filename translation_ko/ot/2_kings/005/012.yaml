    issue: 파르파르 지명이 ‘바르바르’로 표기됨
    rationale: פַרְפַּר는 한국어로 ‘바르발’로 옮기는 것이 음역과 한국어 성경의 통용 표기에 부합합니다.
  - severity: medium
    issue: ‘씻어도’가 원문의 관계를 양보로 변경함
    rationale: אֶרְחַץ ... וְטָהָרְתִּי는 ‘씻고/씻어서 깨끗해지다’라는 연속 또는 결과를 말합니다. ‘씻어도’는 ‘비록 씻더라도’라는 양보의 뉘앙스를 더합니다.
  - severity: low
    issue: 두 강의 병렬 및 다마스쿠스와의 관계가 불명확함
    rationale: ‘아바나와 바르발, 곧 다마스쿠스의 강들’로 하면 두 이름 모두 다마스쿠스의 강이라는 원문의 동격 관계가 명확해집니다.
  - severity: high
