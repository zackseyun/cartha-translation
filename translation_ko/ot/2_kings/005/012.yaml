source:
  edition: WLC
  text: הֲ/לֹ֡א טוֹב֩ אבנה וּ/פַרְפַּ֜ר נַהֲר֣וֹת דַּמֶּ֗שֶׂק מִ/כֹּל֙ מֵימֵ֣י יִשְׂרָאֵ֔ל הֲ/לֹֽא אֶרְחַ֥ץ בָּ/הֶ֖ם וְ/טָהָ֑רְתִּי וַ/יִּ֖פֶן וַ/יֵּ֥לֶךְ בְּ/חֵמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/012.yaml
  text: Are not Abanah and Pharpar[a], the rivers of Damascus[b], better than all the waters of Israel? Could I not wash in them and be clean?” So he turned and went away in a rage.
  footnotes:
  - marker: a
    text: Abanah is rendered by some as 'Amana,' following an alternative traditional form of the river's name.
    reason: alternative_reading
  - marker: b
    text: Or 'and become clean' / 'and be purified'; the Hebrew can express both physical cleansing and a broader notion of cleanness.
    reason: lexical_alternative
translation:
  language: ko
  text: “아바나와 바르발[a], 곧 다마스쿠스의 강들이 이스라엘의 모든 물보다 낫지 않습니까? 내가 그 강들에서 씻어서 깨끗해질 수 없습니까?[b]” 그러고서 그는 격분하여 돌아서서 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아바나는 다른 전통적 형태에 따라 ‘아마나’로도 옮깁니다.
    reason: alternative_reading
  - marker: b
    text: ‘깨끗해지다’는 물리적으로 씻기는 것뿐 아니라 더 넓은 의미의 깨끗함 또는 정결함을 함께 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  english_pob_choice: Are not / Could I not
  chosen_korean: ~하지 않습니까? / ~할 수 없습니까?
  alternatives_korean:
  - ~아닙니까?
  - ~할 수 없지 않습니까?
  lexicon: HALOT
  rationale: 예상되는 긍정 답변을 끌어내는 수사 의문으로, 앞의 비교 질문과 뒤의 가능성 질문을 한국어에서도 자연스럽게 분리해 살렸습니다.
- source_word: טוֹב
  english_pob_choice: better
  chosen_korean: 낫지 않습니까
  alternatives_korean:
  - 더 좋지 않습니까
  - 더 낫지 않습니까
  lexicon: HALOT
  rationale: מִכֹּל과 결합한 비교 표현이므로 단순한 ‘좋다’보다 비교급 ‘낫다’가 더 직접적입니다.
- source_word: וְטָהָרְתִּי
  english_pob_choice: and be clean
  chosen_korean: 깨끗해질 수 없습니까
  alternatives_korean:
  - 깨끗해지지 않겠습니까
  - 정결해질 수 없습니까
  - 깨끗해질 수 없습니까
  lexicon: HALOT
  rationale: 히브리어는 물리적 씻음과 상태의 깨끗함을 모두 담을 수 있어, 문맥상 가장 직접적인 ‘깨끗해지다’를 택하되 정결의 가능성도 배제하지 않도록 했습니다.
- source_word: בְּחֵמָה
  english_pob_choice: in a rage
  chosen_korean: 분노하며
  alternatives_korean:
  - 격분하여
  - 성내어
  - 화가 나서
  lexicon: HALOT
  rationale: חֵמָה의 강한 분노를 살리되, 한국어 서술 흐름에서 자연스러운 상태 부사로 옮겼습니다.
theological_decisions:
- issue: 씻음과 깨끗함의 중첩 의미
  chosen_reading: ‘씻다’와 ‘깨끗해지다’를 함께 유지하여 물리적 씻음과 상태의 깨끗함이 겹치는 긴장을 보존했습니다.
  alternative_readings:
  - 정결해지다
  - 깨끗하게 되다
  rationale: 문맥은 나아만의 질병과 엘리사의 지시를 가리키지만, 히브리어는 단순 위생을 넘어 더 넓은 깨끗함도 허용합니다. 이를 하나로 평탄화하지 않고 함께 드러내는 편이 원문에 가깝습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
