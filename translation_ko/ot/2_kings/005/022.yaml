  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁל֗וֹם אֲדֹנִ/י֮ שְׁלָחַ֣/נִי לֵ/אמֹר֒ הִנֵּ֣ה עַתָּ֡ה זֶ֠ה בָּ֣אוּ אֵלַ֧/י שְׁנֵֽי נְעָרִ֛ים מֵ/הַ֥ר אֶפְרַ֖יִם מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים תְּנָ/ה נָּ֤א לָ/הֶם֙ כִּכַּר כֶּ֔סֶף וּ/שְׁתֵּ֖י חֲלִפ֥וֹת בְּגָדִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/022.yaml
  text: And he said[a], “All is well. My master has sent me to say, ‘Look, just now two young men from the hill country of Ephraim, from among the sons of the prophets, have come to me[c][b]. Please give them a talent of silver and two changes of clothes.’”
  footnotes:
  - marker: a
    text: Or “Peace” / “It is well.” The Hebrew shalom here functions idiomatically as reassurance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “sons of the prophets,” a standard expression for members of a prophetic community or guild.
    reason: cultural_note
  - marker: c
    text: A “talent” was a large unit of weight for precious metal.
    reason: cultural_note
translation:
  language: ko
  text: 그가 말했습니다. 「평안합니다. 주인님께서 저를 보내시며 말씀하시기를, ‘보십시오, 지금 에브라임 산지에서 온 선지자들의 아들들 가운데서 두 젊은이가 제게 왔습니다. 부디 그들에게 은 한 달란트와 옷 두 벌을 주십시오.’」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «평안합니다»는 כאן의 שָׁלוֹם이 인사말이 아니라 ‘문제가 없습니다/괜찮습니다’라는 관용적 안심 표현으로 쓰인 것을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: 「선지자들의 아들들」은 열왕기서에서 예언자 집단이나 제자 공동체를 가리키는 기술적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 「달란트」는 귀금속의 무게를 재던 큰 단위입니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׁלוֹם
  english_pob_choice: All is well
  chosen_korean: 평안합니다
  alternatives_korean:
  - 평안합니다
  - 아무 일 없습니다
  - 괜찮습니다
  lexicon: HALOT
  rationale: 이 문맥의 שָׁלוֹם은 인사보다 상황 안부 확인의 관용구이므로, 자연스러운 현대 한국어로 현재 상태가 문제 없음을 전달하는 「평안합니다」를 택했습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my master
  chosen_korean: 주인님
  alternatives_korean:
  - 주인님
  - 내 주여
  - 주여
  lexicon: HALOT
  rationale: 종-주인 맥락에서 엘리사를 가리키는 소유적 호칭이므로, 교회적·예배적 뉘앙스가 강한 「주여」보다 서술 상황에 맞는 「주인님」이 더 정확합니다.
- source_word: מִבְּנֵי הַנְּבִיאִים
  english_pob_choice: from among the sons of the prophets
  chosen_korean: 선지자들의 아들들 가운데서
  alternatives_korean:
  - 선지자들의 아들들 가운데서
  - 선지자 공동체의 사람들 가운데서
  - 예언자 제자들 가운데서
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 직역해 기술적 표현을 보존했습니다. 「선지자들」은 본문 흐름에 맞는 예언자 집단을 가리키며, 「아들들」도 관계표현을 유지합니다.
- source_word: כִּכַּר כֶּסֶף
  english_pob_choice: a talent of silver
  chosen_korean: 은 한 달란트
  alternatives_korean:
  - 은 한 달란트
  - 은 달란트 하나
  - 은 한 덩이
  lexicon: HALOT
  rationale: כִּכַּר은 전통적인 도량형인 「달란트」로 옮기고, כסף는 금속 재질을 분명히 하도록 「은」을 앞에 두었습니다.
theological_decisions:
- issue: 직접화법 안의 호칭과 청원 표현의 문체
  chosen_reading: 인물 간 대화이므로 본문 전체는 합쇼체를 유지하되, 부탁 표현은 「부디 … 주십시오」로 공손성을 살렸습니다.
  alternative_readings:
  - 더 평이한 반말 체계
  - 전면적인 고어체
  rationale: 히브리어 청원문 תְּנָה נָּא의 공손한 요청을 현대 한국어에서 가장 자연스럽게 재현하려면 공손한 명령형이 적절합니다.
  doctrine_reference: 문체는 의미 전달의 일부라는 번역 원칙
