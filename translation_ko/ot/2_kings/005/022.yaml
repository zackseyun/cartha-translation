revisions:
- from: 그가 말했습니다. 「평안합니다. 주인님께서 저를 보내시며 말씀하시기를, ‘보십시오, 지금 에브라임 산지에서 온 선지자들의 아들들 가운데서 두 젊은이가 제게 왔습니다. 부디 그들에게 은 한 달란트와 옷 두 벌을 주십시오.’」[a][b][c]
  to: 그가 말했습니다. “아무 일 없습니다.[a] 주인님께서 저를 보내어 이렇게 말씀하셨습니다. ‘보십시오, 바로 지금 에브라임 산지에서 온 예언자들의 제자들[b] 가운데 두 젊은이가 제게 왔습니다. 부디 그들에게 은 한 달란트[c]와 옷 두 벌을 주십시오.’”
  rationale: The revision preserves the Hebrew sense and narrative ambiguity while using idiomatic modern formal-polite Korean. It corrects the editorial error in footnote a, renders the prophetic-community idiom intelligibly with a note preserving its literal form, improves the reporting syntax, and relocates note anchors to the words they explain.
