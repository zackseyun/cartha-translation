base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/024.yaml
  text: When he came to the hill[a], he took them from their hands and deposited them in the house. Then he sent the men away[c][b], and they went.
  footnotes:
  - marker: a
    text: Or 'the mound' or 'the fortified hill'; Hebrew 'the Ophel.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew literally 'from their hand.'
    reason: lexical_alternative
  - marker: c
    text: Or 'stored them' or 'put them away in the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 언덕[a]에 이르자, 그들의 손에서 그것들을 받아 집 안에 두었습니다. 그리고 그 사람들을 돌려보냈습니다. 그러자 그들은 떠났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둔덕’ 또는 ‘요새화된 높은 곳’. 히브리어 ‘오펠’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹפֶל
  english_pob_choice: the hill
  chosen_korean: 언덕
  alternatives_korean:
  - 그 언덕
  - 성루
  lexicon: HALOT
  rationale: עֹפֶל은 높은 곳이나 언덕을 가리킬 수 있으므로, 문맥에 맞는 일반적인 지형어인 ‘언덕’으로 옮겨 본문을 자연스럽게 살렸습니다.
- source_word: מִיָּדָם
  english_pob_choice: from their hands
  chosen_korean: 그들의 손에서
  alternatives_korean:
  - 그들로부터
  - 그들의 손으로부터
  lexicon: HALOT
  rationale: 히브리어의 ‘손’ 관용을 살려 ‘그들의 손에서’로 옮겨, 직접 건네받는 이미지를 보존했습니다.
- source_word: וַיִּפְקֹד
  english_pob_choice: deposited
  chosen_korean: 두었습니다
  alternatives_korean:
  - 보관했습니다
  - 넣어 두었습니다
  - 저장했습니다
  lexicon: HALOT
  rationale: 여기서는 단순히 ‘안치하다/보관하다’는 뜻으로 쓰였으므로, 집 안에 안전하게 두었다는 의미가 드러나는 ‘두었습니다’가 가장 자연스럽습니다.
- source_word: הָאֲנָשִׁים
  english_pob_choice: the men
  chosen_korean: 그 사람들
  alternatives_korean:
  - 그 남자들
  - 그들
  lexicon: HALOT
  rationale: 히브리어는 일반 명사 ‘사람들/남자들’을 쓰지만, 한국어에서는 성별 정보를 굳이 강조하지 않는 ‘그 사람들’이 문맥상 자연스럽습니다.
