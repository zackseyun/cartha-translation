translation:
  language: ko
  text: 그가 들어와 그의 주인 앞에 서자, 엘리사가 그에게 말했습니다. “게하시야, 어디에서 왔습니까?”[a] 그러자 그가 대답했습니다. “이 종은 아무 데도 가지 않았습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “게하시야, 어디서(어디로부터)?”에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 “이 종은 여기저기 가지 않았습니다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  english_pob_choice: stood before his master
  chosen_korean: 자기 주인 앞에 서자
  alternatives_korean:
