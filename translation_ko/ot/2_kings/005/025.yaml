translation:
  language: ko
  text: 그가 들어와 자기 주인 앞에 서자, 엘리사가 그에게 말했습니다. “게하시야, 어디에서 왔느냐?” 그러자 그가 대답했습니다. “당신의 종은 아무 데도 가지 않았습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “게하시야, 어디서(어디로부터)?”에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구는 “당신의 종은 여기저기(아무 데도) 가지 않았습니다”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד אֶל אֲדֹנָיו
  english_pob_choice: stood before his master
  chosen_korean: 자기 주인 앞에 서자
  alternatives_korean:
  - 주인 앞에 섰을 때
  - 주인 앞에 나아가 서자
  - 주인 앞에 서서
  lexicon: HALOT
  rationale: ‘서다’의 대면·출석 의미를 살려, 엘리사 앞에 정식으로 나아와 선 상황을 자연스럽게 나타냈습니다.
- source_word: מֵאָן
  english_pob_choice: Where have you been
  chosen_korean: 어디에서 왔느냐
  alternatives_korean:
  - 어디에 있었느냐
  - 어디서 왔느냐
  - 어디 갔었느냐
  lexicon: HALOT
  rationale: 직역의 ‘어디에서’보다 한국어 대화에서는 ‘어디에서 왔느냐’가 출처/행적을 묻는 질문을 더 자연스럽게 드러냅니다. 본문의 출발지보다 최근 행적을 캐묻는 뉘앙스를 유지했습니다.
- source_word: לֹא הָלַךְ עַבְדְּךָ אָנֶה וָאָנָה
  english_pob_choice: Your servant did not go anywhere
  chosen_korean: 당신의 종은 아무 데도 가지 않았습니다
  alternatives_korean:
  - 당신의 종은 이리저리 가지 않았습니다
  - 당신의 종은 여기저기 가지 않았습니다
  - 당신의 종은 어디에도 가지 않았습니다
  lexicon: HALOT
  rationale: 자기 비칭 ‘당신의 종’을 보존했고, אָנֶה וָאָנָה의 관용적 부정을 한국어의 ‘아무 데도’로 간결하게 옮겼습니다.
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 자기 주인
  alternatives_korean:
  - 그의 주인
  - 그의 상전
  - 주인
  lexicon: HALOT
  rationale: 이 문맥의 אֲדֹנָיו는 신적 호칭이 아니라 종과 상전의 관계를 가리키므로, 한국어에서도 사회적 관계가 분명한 ‘주인’으로 옮겼습니다.
theological_decisions:
- issue: 엘리사의 질문 형식
  chosen_reading: “어디에서 왔느냐?”로 옮겨, 책망보다 행적 추궁의 성격을 유지했습니다.
  alternative_readings:
  - “어디 갔느냐?”
  - “어디 있었느냐?”
  rationale: 히브리어 מֵאָן은 출처를 묻는 말이지만, 이야기 문맥상 게하시의 은밀한 행동을 드러내는 추궁으로 기능합니다. 질문을 과도하게 도덕화하지 않고 긴장을 살렸습니다.
  doctrine_reference: 서사 문맥과 화행의 보존
- issue: 게하시의 자칭
  chosen_reading: ‘당신의 종’으로 유지해, 종-주인 관계의 위계와 위선을 함께 드러냈습니다.
  alternative_readings:
  - ‘저는’
  - ‘이 종은’
  rationale: 히브리어의 겸양적 자기호칭을 평면적인 1인칭으로 바꾸지 않아, 게하시의 말투가 지닌 사회적·서사적 의미를 살렸습니다.
  doctrine_reference: 서사적 인물표현 보존
