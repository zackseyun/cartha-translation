- from: 그녀가 자기 여주인에게 말했습니다. “아, 내 주인이 사마리아에 있는 예언자 앞에만 계셨더라면! 그러면 그가 그의 나병에서 그를 건져 내셨을 것입니다.”[a][b]
  to: 그녀는 자기 여주인에게 말했습니다. “아, 우리 주인께서 사마리아에 있는 예언자 앞에 계시기만 한다면, 그 예언자가 우리 주인의 나병[b]을 고쳐[a] 줄 텐데요.”
  rationale: 원문의 소망·가정 표현(אַחֲלֵי)과 예언자가 나아만의 질병을 제거할 것이라는 의미를 현대 한국어로 명료하게 옮겼습니다. ‘우리 주인’은 여종이 여주인에게 남성 상급자를 가리키는 상황에서 자연스러우며, ‘고쳐 주다’는 יֶאֱסֹף의 이 문맥상 치유 의미를 반영합니다. 동사의 문자적 어감과 צָרַעַת의 범위는 각주에서 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:52:01Z'
