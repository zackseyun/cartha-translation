  text: וַ/תֹּ֨אמֶר֙ אֶל גְּבִרְתָּ֔/הּ אַחֲלֵ֣י אֲדֹנִ֔/י לִ/פְנֵ֥י הַ/נָּבִ֖יא אֲשֶׁ֣ר בְּ/שֹׁמְר֑וֹן אָ֛ז יֶאֱסֹ֥ף אֹת֖/וֹ מִ/צָּרַעְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/003.yaml
  text: She said to her mistress[b][a], “If only my lord were before the prophet who is in Samaria! Then he would gather him in from his leprosy.”
  footnotes:
  - marker: a
    text: Or more idiomatically, “Then he would cure him of his leprosy.” The Hebrew verb is literally “gather in,” used here for recovery/removal from disease.
    reason: lexical_alternative
  - marker: b
    text: “Leprosy” renders Hebrew צָרַעַת, a traditional term that may refer more broadly to a serious skin disease.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 자기 여주인에게 말했습니다. “아, 내 주인이 사마리아에 있는 예언자 앞에만 계셨더라면! 그러면 그가 그의 나병에서 그를 건져 내셨을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 אַסֹף는 문자적으로는 “거두어 들이다/모으다”에 가까우나, 여기서는 병을 제거하거나 회복시키는 뜻으로 쓰입니다. 그래서 본문은 그 이미지를 살린 채 “건져 내다”로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: צָרַעַת은 전통적으로 “나병”으로 옮기지만, 현대 의학의 한 질병명과 정확히 일치하지 않을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִרְתָּהּ
  english_pob_choice: her mistress
  chosen_korean: 자기 여주인
  alternatives_korean:
  - 그녀의 주인 부인
  - 여주인
  lexicon: HALOT
  rationale: 가정 내에서의 여성 상급자 관계를 자연스러운 현대 한국어로 살리기 위해 ‘여주인’을 택했습니다. 대명사 수식어 ‘자기’는 원문의 소유관계를 분명히 합니다.
- source_word: אַחֲלֵי
  english_pob_choice: If only
  chosen_korean: 아, …만 …더라면
  alternatives_korean:
  - 오, …더라면
  - 부디 …라면
  lexicon: HALOT
  rationale: 소망과 탄식을 함께 담는 הנחיות적 표현으로, 한국어의 ‘아, …만 …더라면’이 가장 자연스럽게 optative 뉘앙스를 전달합니다.
- source_word: אֲדֹנִי
  english_pob_choice: my lord
  chosen_korean: 내 주인
  alternatives_korean:
  - 내 주님
  - 내 임금
  lexicon: HALOT
  rationale: 여기서는 나아만을 향한 공손한 호칭이므로 ‘주님’보다는 신적 호칭이 아닌 ‘주인’이 적합합니다. 문맥상 소유적·예우적 주소를 유지합니다.
- source_word: יֶאֱסֹף
  english_pob_choice: would gather him in
  chosen_korean: 그를 건져 내셨을 것입니다
  alternatives_korean:
  - 그를 거두어 들이셨을 것입니다
  - 그를 모아 들이셨을 것입니다
  - 그를 고치셨을 것입니다
  lexicon: HALOT
  rationale: POB가 보존한 ‘gather him in’의 어색한 직역보다, 히브리어 אסף의 회복/제거 뉘앙스를 한국어로 드러내는 동적 대응으로 ‘건져 내다’를 선택했습니다. 병에서 벗어나게 하는 결과를 자연스럽게 전달합니다.
- source_word: מִצָּרַעְתּוֹ
  english_pob_choice: from his leprosy
  chosen_korean: 그의 나병에서
  alternatives_korean:
  - 그의 피부병에서
  - 그의 문둥병에서
  lexicon: HALOT
  rationale: צָרַעַת은 전통적으로 ‘나병’으로 옮겨 온 표현이므로, POB의 기본 용례를 따라 표준적인 성경 한국어인 ‘나병’을 사용했습니다. 'from'의 분리 의미는 조사 ‘에서’로 보존했습니다.
theological_decisions:
- issue: 직접 인용 속 존칭과 화자의 사회적 위치
  chosen_reading: 시녀가 나아만을 직접 ‘내 주인’으로 높이고, 이스라엘 소녀의 낮은 사회적 위치를 반영했습니다.
  alternative_readings:
  - 내 주님
  - 주인님
  rationale: 원문은 왕이나 하나님이 아니라 가정 내 상급자에게 하는 예우적 호칭입니다. 한국어에서도 종교적 호칭으로 오해되지 않도록 사회적 관계를 그대로 드러내는 쪽이 본문의 힘을 보존합니다.
  doctrine_reference: 사회적 호칭과 신적 호칭의 구분
