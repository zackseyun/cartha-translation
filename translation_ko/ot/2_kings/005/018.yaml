base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/018.yaml
  text: 'In this matter[a], may Yahweh pardon your servant: when my master goes into the house of Rimmon to bow down there, and he is leaning on my hand, so that I also bow down in the house of Rimmon—when I bow down in the house of Rimmon[b], may Yahweh please pardon your servant in this matter.'
  footnotes:
  - marker: a
    text: Or 'to worship there'; the Hebrew verb can denote both the bodily act of bowing and the act of worship.
    reason: lexical_alternative
  - marker: b
    text: '''House of Rimmon'' refers to the temple or shrine of the Syrian god Rimmon.'
    reason: cultural_note
translation:
  language: ko
  text: 이 일에 대하여 야훼께서 당신의 종을 용서해 주시기를 바랍니다. 내 주가 림몬의 집에 들어가 그곳에서 몸을 굽히려 할 때에, 그가 내 손에 기대고 있어서 나도 림몬의 집에서 몸을 굽히게 될 것입니다. 내가 림몬의 집에서 몸을 굽힐 때에, 부디 야훼께서 당신의 종을 이 일에 대하여 용서해 주시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에서 예배하다’. 히브리어 동사는 몸을 굽히는 동작과 예배 행위를 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘림몬의 집’은 아람 신 림몬의 신전 또는 제단을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: יִסְלַח / נָא
  english_pob_choice: may ... pardon / please
  chosen_korean: 용서해 주시기를 바랍니다 / 부디
  alternatives_korean:
  - 용서하시기를 바랍니다
  - 사하여 주시기를 바랍니다
  lexicon: HALOT
  rationale: 청원형의 동사와 נא의 공손한 뉘앙스를 살리기 위해, 현대 합쇼체 청원 표현으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본어휘에 따라 신성명 יהוה는 경칭 대체어가 아니라 음역형 ‘야훼’로 유지했습니다.
- source_word: לְעַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 하인
  lexicon: HALOT
  rationale: 궁정적 자기호칭으로서 문맥상 ‘종’이 자연스럽고, 영어 POB처럼 bonded status를 전면화할 필요는 없습니다.
- source_word: לְהִשְׁתַּחֲוֹת / וְהִשְׁתַּחֲוֵיתִי / בְּהִשְׁתַּחֲוָיָתִי
  english_pob_choice: to bow down / so that I also bow down / when I bow down
  chosen_korean: 몸을 굽히려 할 때 / 나도 ... 몸을 굽히게 될 것입니다 / 몸을 굽힐 때
  alternatives_korean:
  - 엎드려 절하려 할 때
  - 예배하려 할 때
  lexicon: HALOT
  rationale: 히브리어 동사는 신체적 굽힘과 예배를 모두 가리킬 수 있으므로, POB의 판단을 따라 ‘몸을 굽히다’로 두어 외적 행위와 내적 숭배를 구분하지 않았습니다.
- source_word: בֵית רִמּוֹן
  english_pob_choice: the house of Rimmon
  chosen_korean: 림몬의 집
  alternatives_korean:
  - 림몬 신전
  - 림몬의 성전
  lexicon: HALOT
  rationale: 직역 형태를 유지해 히브리어 표현의 완곡성과 이방 신당 맥락을 함께 드러냈습니다.
theological_decisions:
- issue: הִשְׁתַּחֲוָה를 ‘예배하다’로 풀지 않고 ‘몸을 굽히다’로 유지할지 여부
  chosen_reading: 외적 몸짓을 가리키는 ‘몸을 굽히다’로 유지했습니다.
  alternative_readings:
  - 예배하다
  - 엎드려 절하다
  rationale: 나아만의 내적 충성 문제를 번역자가 단정하지 않도록, 본문이 말하는 강제된 행위의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
