  - severity: low
    issue: 각주 표지가 해당 어휘에서 멀리 떨어져 있습니다.
    rationale: ‘예배하다’라는 대안은 첫 번째 ‘몸을 굽히다’에, 림몬의 집에 관한 문화 주석은 첫 번째 ‘림몬의 집’에 붙이는 편이 독자가 각주의 대상을 명확히 알 수 있습니다.
