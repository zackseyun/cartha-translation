  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו אֱלִישָׁ֖ע מַלְאָ֣ךְ לֵ/אמֹ֑ר הָל֗וֹךְ וְ/רָחַצְתָּ֤ שֶֽׁבַע פְּעָמִים֙ בַּ/יַּרְדֵּ֔ן וְ/יָשֹׁ֧ב בְּשָׂרְ/ךָ֛ לְ/ךָ֖ וּ/טְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/010.yaml
  text: So Elisha sent a messenger to him[a], saying, “Go and wash in the Jordan seven times, and your flesh will be restored to you[b], and you will be clean.”
  footnotes:
  - marker: a
    text: Or 'your flesh will return to you.' The Hebrew idiom expresses restoration to a former healthy condition.
    reason: lexical_alternative
  - marker: b
    text: Or 'you will be cleansed.' The verb can denote becoming clean or pure, with both physical and ritual overtones.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사가 그에게 전령을 보내어 말했습니다. “가서 요단강에서 일곱 번 씻으십시오. 그러면 당신의 살이 당신에게 회복되고, 깨끗해질 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 살이 당신에게 돌아올 것이다.’ 히브리어 관용구는 이전의 건강한 상태로의 회복을 나타낼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘정결해질 것입니다.’ 이 동사는 깨끗해짐과 정결함을 모두 가리킬 수 있으며, 물리적·의례적 함의를 함께 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָךְ
  english_pob_choice: messenger
  chosen_korean: 전령
  alternatives_korean:
  - 사자
  - 메신저
  - 천사
  lexicon: HALOT
  rationale: 문맥상 하늘 존재가 아니라 엘리사의 심부름을 맡은 사람을 가리키므로, 이를 분명히 하면서도 현대 한국어에서 자연스러운 ‘전령’으로 옮겼습니다.
- source_word: הָלוֹךְ וְרָחַצְתָּ
  english_pob_choice: Go and wash
  chosen_korean: 가서 … 씻으십시오
  alternatives_korean:
  - 가서 몸을 씻으십시오
  - 가서 씻으십시오
  - 가서 씻으세요
  lexicon: HALOT
  rationale: 연속된 명령의 힘을 살리되 한국어에서 가장 자연스러운 공손 명령형으로 처리했습니다.
- source_word: בְּשָׂרְךָ לְךָ
  english_pob_choice: your flesh will be restored to you
  chosen_korean: 당신의 살이 당신에게 회복되고
  alternatives_korean:
  - 당신의 살이 당신에게 돌아오고
  - 당신의 몸이 당신에게 회복되고
  lexicon: HALOT
  rationale: 히브리어의 구체적인 ‘살’을 유지하여 육체적 회복의 생생함을 보존했고, לְךָ의 방향성을 ‘당신에게’로 드러냈습니다.
- source_word: וּטְהָר
  english_pob_choice: you will be clean
  chosen_korean: 깨끗해질 것입니다
  alternatives_korean:
  - 깨끗해질 것입니다
  - 정결해질 것입니다
  - 깨끗하게 될 것입니다
  lexicon: HALOT
  rationale: 문맥상 치유 결과를 말하지만, 정결의 함의도 남아 있으므로 ‘깨끗해질 것입니다’로 두어 물리적·정결적 의미를 함께 열어 두었습니다.
theological_decisions:
- issue: בְּשָׂרְךָ לְךָ의 ‘flesh’와 정결 동사의 이중 뉘앙스를 한국어에서 얼마나 유지할 것인가
  chosen_reading: 구체적 신체어 ‘살’을 유지하고, טהר는 ‘깨끗해질 것입니다’로 번역했습니다.
  alternative_readings:
  - ‘몸’으로 완화하기
  - ‘정결해질 것입니다’로 좁히기
  rationale: 본문은 단순한 의학적 회복만이 아니라 육체의 회복과 깨끗함을 함께 말하므로, 어느 한쪽으로 좁히지 않고 두 층위를 모두 보존하는 쪽이 소스에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §3, §5, §6
