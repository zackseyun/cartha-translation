- from: 그가 하나님의 사람에게로 돌아왔습니다. 그와 그의 모든 수행원도 함께 왔습니다. 그는 그 앞에 서서 말했습니다. "보십시오, 이제 저는 온 땅에 하나님이 없고 다만 이스라엘에만 계시다는 것을 알게 되었습니다. 그러니 이제 제 종에게서 선물을 받아 주십시오."[a]
  to: 그는 모든 수행원과 함께 하나님의 사람에게로 돌아와 그 앞에 서서 말했습니다. “보십시오, 이제 저는 온 땅 어디에도 하나님이 계시지 않고 오직 이스라엘에만 계신다는 것을 알았습니다. 이제 이 종에게서 선물을 받아 주십시오.”[a]
