source:
  edition: WLC
  text: וַ/יָּשָׁב֩ אֶל אִ֨ישׁ הָ/אֱלֹהִ֜ים ה֣וּא וְ/כָֽל מַחֲנֵ֗/הוּ וַ/יָּבֹא֮ וַ/יַּעֲמֹ֣ד לְ/פָנָי/ו֒ וַ/יֹּ֗אמֶר הִנֵּה נָ֤א יָדַ֨עְתִּי֙ כִּ֣י אֵ֤ין אֱלֹהִים֙ בְּ/כָל הָ/אָ֔רֶץ כִּ֖י אִם בְּ/יִשְׂרָאֵ֑ל וְ/עַתָּ֛ה קַח נָ֥א בְרָכָ֖ה מֵ/אֵ֥ת עַבְדֶּֽ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/005/015.yaml
  text: Then he returned to the man of God[a], he and all his company, and came and stood before him and said, “See now, I know that there is no God in all the earth except in Israel. And now, please accept a gift from your servant.”
  footnotes:
  - marker: a
    text: Or more literally, 'a blessing.' Here the Hebrew term refers to a gift or present.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 모든 수행원과 함께 하나님의 사람에게로 돌아와 그 앞에 서서 말했습니다. “보십시오, 이제 저는 온 땅 어디에도 하나님이 계시지 않고 오직 이스라엘에만 계신다는 것을 알았습니다. 이제 이 종에게서 선물을 받아 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선물’로 옮긴 히브리어 בְרָכָה는 문자적으로는 ‘축복’이지만, 여기서는 예물이나 증정품을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 사람된 선지자
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 직역하면 ‘하나님의 사람’이며, 본문의 문학적 호칭을 유지하는 것이 좋습니다.
- source_word: מַחֲנֵהוּ
  english_pob_choice: his company
  chosen_korean: 그의 모든 수행원
  alternatives_korean:
  - 그의 진영
  - 그의 호위대
  lexicon: HALOT
  rationale: 여기서는 군사적 진영보다 동행 인원 전체를 가리키므로, 자연스럽고 문맥에 맞는 ‘수행원’이 적절합니다.
- source_word: הִנֵּה נָא
  english_pob_choice: See now
  chosen_korean: 보십시오, 이제
  alternatives_korean:
  - 보소서, 이제
  - 이제 보십시오
  lexicon: HALOT
  rationale: 상대의 주의를 끄는 담화 표지를 현대 한국어로 옮기되, 지나치게 고어적으로 만들지 않기 위해 ‘보십시오, 이제’로 처리했습니다.
- source_word: בְרָכָה
  english_pob_choice: a gift
  chosen_korean: 선물
  alternatives_korean:
  - 예물
  - 축복
  lexicon: HALOT
  rationale: 문자적으로는 ‘축복’이지만, 여기서는 제시한 물품을 뜻하는 관용적 용법이므로 ‘선물’이 자연스럽습니다.
- source_word: עַבְדֶּךָ
  english_pob_choice: your servant
  chosen_korean: 제 종
  alternatives_korean:
  - 당신의 종
  - 당신의 노예
  lexicon: HALOT
  rationale: 정중한 자칭 표현이지만 문맥상 신분적 예속을 완전히 지우지 않기 위해 ‘종’을 유지했습니다. 화자의 1인칭이므로 ‘제’로 옮겼습니다.
theological_decisions:
- issue: “온 땅에 하나님이 없고 다만 이스라엘에만”이라는 고백의 강도
  chosen_reading: 이스라엘의 하나님이 유일하다는 고백을 약화하지 않고, 본문 그대로의 배타적 진술로 옮겼습니다.
  alternative_readings:
  - ‘온 땅에 하나님이 없다’를 완화하여 해석적으로 번역
  - ‘이스라엘의 하나님만’으로 풀어 쓰기
  rationale: 히브리어는 강한 배타적 선언을 담고 있으므로, 설명을 덧붙여 희석하지 않고 문면의 힘을 유지하는 것이 타당합니다.
  doctrine_reference: 하나님의 유일성; 번역 원칙
