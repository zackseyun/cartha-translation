base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/023.yaml
  text: And they said[a], “This is blood! The kings have surely fought one another and struck down one another. Now then, Moab[b], to the spoil!”
  footnotes:
  - marker: a
    text: Or, “The kings have utterly destroyed one another.” The Hebrew uses an emphatic form of 'be destroyed/devastated'; in context it refers to the kings apparently turning on each other.
    reason: lexical_alternative
  - marker: b
    text: Or, “Moabites, to the plunder!”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 말했습니다. 「이것은 피입니다! 왕들이 서로 전멸할 만큼 싸우고 서로를 쳐 죽였습니다[a]. 이제 모압 사람들아[b], 전리품을 차지하러 갑시다!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「왕들이 서로 완전히 멸망했습니다」. 히브리어는 ‘멸망하다/황폐해지다’라는 뜻의 강조형을 사용합니다. 문맥상 왕들이 서로에게 맞서 싸운 결과를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는, 「모압아, 전리품을 차지하러 가자!」
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּם זֶה
  english_pob_choice: This is blood!
  chosen_korean: 이것은 피입니다!
  alternatives_korean:
  - 피입니다!
  - 이 피다!
  lexicon: HALOT
  rationale: 짧은 감탄문 구조와 지시대명사 זֶה의 지시성을 살리되, 현대 한국어에서 자연스러운 합쇼체로 옮겼습니다.
- source_word: הָחֳרֵב נֶחֶרְבוּ
  english_pob_choice: have surely fought one another
  chosen_korean: 분명히 서로 싸워
  alternatives_korean:
  - 서로를 완전히 멸망시켰습니다
  - 서로를 철저히 파멸시켰습니다
  lexicon: HALOT
  rationale: 히브리어의 강조형을 한국어에서 과도하게 직역하기보다, 문맥상 ‘서로 죽고 죽이는 전투’라는 추론을 자연스럽게 전달했습니다.
- source_word: וַיַּכּוּ אִישׁ אֶת רֵעֵהוּ
  english_pob_choice: and struck down one another
  chosen_korean: 서로를 쳐 죽였습니다
  alternatives_korean:
  - 각자 자기 동료를 쳤습니다
  - 서로를 쳐서 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: אישׁ את־רעהו의 상호적 의미를 살리면서 군사적 맥락에 맞게 ‘쳐 죽이다’로 강하게 옮겼습니다.
- source_word: וְעַתָּה לַשָּׁלָל
  english_pob_choice: Now then, ... to the spoil!
  chosen_korean: 이제, 모압이여, 약탈하러 갑시다!
  alternatives_korean:
  - 이제, 모압이여, 전리품을 향해!
  - 이제, 모압이여, 노략질하러 갑시다!
  lexicon: HALOT
  rationale: 전투 함성의 명령적 뉘앙스를 한국어 군중 호흡에 맞게 살리되, ‘to the spoil’의 방향성을 ‘약탈하러’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: מוֹאָב의 호격 처리
  chosen_reading: ‘모압이여’로 직접 부르는 호격을 살렸습니다.
  alternative_readings:
