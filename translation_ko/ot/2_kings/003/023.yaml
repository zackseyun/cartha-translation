  source_fidelity: 핵심 의미는 대체로 잘 전달합니다. 다만 הָחֳרֵב נֶחֶרְבוּ는 חרב의 니팔 강조구문으로, 문맥상 상호 전투의 결과를 가리키지만 ‘서로 싸워’만으로는 ‘완전히 파멸하였다/전멸하였다’라는 강조를 충분히 드러내지 못합니다. 또한 לַשָּׁלָל은 약탈 행위 자체보다 전리품을 향한 출동 또는 전리품 획득을 외치는 표현입니다.
  naturalness: ‘왕들이 분명히 서로 싸워 서로를 쳐 죽였습니다’는 ‘서로’가 연속되어 다소 무겁습니다. ‘모압 사람들아’는 나라 이름을 집단에게 외치는 히브리어의 호격을 현대 한국어로 자연스럽게 재현합니다. 각주 표지는 해당 어구에 붙이는 편이 독자의 이해와 표지 기능에 적절합니다.
  terminology: ‘쳐 죽였습니다’는 군사 문맥에서 가능하지만, 앞선 חרב의 강조와 뒤따르는 היכה의 상호 공격을 함께 살려 ‘서로 전멸할 만큼 싸우고 서로를 쳐 죽였습니다’로 옮겼습니다. לַשָּׁלָל은 ‘전리품을 차지하러’로 처리하여 전쟁 문맥의 목적어를 명확히 했습니다.
