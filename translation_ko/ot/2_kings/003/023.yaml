  - ‘모압이여, 전리품을 향하여!’
  rationale: 본문은 국가명을 전투 함성의 대상처럼 부르므로, 한국어에서도 호격을 명시해 외침의 긴박감을 유지했습니다.
  doctrine_reference: 문맥/화용
