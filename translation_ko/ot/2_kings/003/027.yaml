id: 2KI.3.27
reference: 2 Kings 3:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקַּח֩ אֶת בְּנ֨/וֹ הַ/בְּכ֜וֹר אֲשֶׁר יִמְלֹ֣ךְ תַּחְתָּ֗י/ו וַ/יַּעֲלֵ֤/הוּ עֹלָה֙ עַל הַ֣/חֹמָ֔ה וַ/יְהִ֥י קֶצֶף גָּד֖וֹל עַל יִשְׂרָאֵ֑ל וַ/יִּסְעוּ֙ מֵֽ/עָלָ֔י/ו וַ/יָּשֻׁ֖בוּ לָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/027.yaml
  text: Then he took his firstborn son[a], who was to reign in his place, and offered him up as a burnt offering on the wall. And there came great wrath against Israel, so they withdrew from him and returned to their land.
  footnotes:
  - marker: a
    text: Or 'great indignation/anger against Israel.' The Hebrew does not specify whose wrath this was; interpreters differ on whether it refers to divine wrath, Moab's fury, or Israel's demoralization after the sacrifice.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그를 이어 왕이 될 자기의 맏아들을 데려다가 성벽 위에서 번제로 바쳤습니다. 그러자 이스라엘을 향해 큰 진노가 일어나자[a], 그들은 그에게서 물러가 자기들의 땅으로 돌아갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 진노’는 하나님의 진노, 모압의 분노, 또는 제사 사건이 초래한 이스라엘의 동요를 가리킬 수 있습니다. 히브리어는 그 주체를 명시하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנוֹ הַבְּכוֹר
  english_pob_choice: his firstborn son
  chosen_korean: 자기의 맏아들
  alternatives_korean:
  - 자기의 첫째 아들
  - 자기의 첫아들
  lexicon: HALOT
  rationale: בְּכוֹר는 단순한 연장자가 아니라 ‘맏아들/첫째 아들’의 의미이므로, 한국어에서는 가장 자연스럽고 의미가 정확한 ‘맏아들’을 택했습니다.
- source_word: אֲשֶׁר יִמְלֹךְ תַּחְתָּיו
  english_pob_choice: who was to reign in his place
  chosen_korean: 곧 자기 대신 왕이 될 아들
  alternatives_korean:
  - 자기 뒤를 이어 다스릴 아들
  - 자기 대신 통치할 아들
  lexicon: HALOT
  rationale: תַּחְתָּיו의 대체와 계승 의미를 살리기 위해 ‘자기 대신’으로 옮기고, ‘왕이 될’로 왕위 승계의 뜻을 분명히 했습니다.
- source_word: וַיַּעֲלֵהוּ עֹלָה
  english_pob_choice: offered him up as a burnt offering
  chosen_korean: 번제로 바쳤습니다
  alternatives_korean:
  - 번제물로 바쳤습니다
  - 불태워 번제로 드렸습니다
  lexicon: HALOT
  rationale: עֹלָה의 제의적 용례를 반영하되, 한국어에서 ‘바치다’가 희생 제의의 행위를 가장 직접적으로 드러내므로 선택했습니다.
- source_word: קֶצֶף גָּדוֹל עַל יִשְׂרָאֵל
  english_pob_choice: there came great wrath against Israel
  chosen_korean: 이스라엘에 큰 진노가 임하니
  alternatives_korean:
  - 이스라엘을 향해 큰 진노가 일어나니
  - 이스라엘 위에 큰 분노가 내리니
  lexicon: HALOT
  rationale: קֶצֶף는 ‘진노/분노’의 강한 감정을 가리키며, POB가 유지한 주체 미확정의 긴장을 한국어에서도 살리기 위해 원인을 특정하지 않고 ‘큰 진노가 임하다’로 번역했습니다.
- source_word: וַיִּסְעוּ מֵעָלָיו
  english_pob_choice: they withdrew from him
  chosen_korean: 그들이 그에게서 물러가
  alternatives_korean:
  - 그에게서 철수하여
  - 그에게서 떠나
  lexicon: HALOT
  rationale: 전투 문맥의 נסע는 단순한 이동보다 공세 중단과 후퇴의 뉘앙스가 있으므로 ‘물러가’로 옮겼습니다.
theological_decisions:
- issue: ‘큰 진노’의 주체를 특정하지 않는 표현
  chosen_reading: 본문은 진노의 주체를 밝히지 않으므로, 한국어 본문도 ‘이스라엘에 큰 진노가 임하니’로 두어 주체를 특정하지 않았습니다.
  alternative_readings:
  - 하나님의 큰 진노
  - 모압의 큰 분노
  - 이스라엘의 큰 충격
  rationale: 히브리어는 누구의 진노인지 명시하지 않으며, POB도 이 모호성을 유지합니다. 본문에서 이를 해소하지 않는 것이 번역 충실성과 해석의 개방성을 지키는 길입니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
