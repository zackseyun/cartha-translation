  text: וַ/יֹּ֨אמֶר אֱלִישָׁ֜ע אֶל מֶ֤לֶךְ יִשְׂרָאֵל֙ מַה לִּ֣/י וָ/לָ֔/ךְ לֵ֚ךְ אֶל נְבִיאֵ֣י אָבִ֔י/ךָ וְ/אֶל נְבִיאֵ֖י אִמֶּ֑/ךָ וַ/יֹּ֤אמֶר ל/וֹ֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אַ֗ל כִּֽי קָרָ֤א יְהוָה֙ לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/013.yaml
  text: And Elisha said to the king of Israel, “What do I have to do with you? Go to the prophets of your father and to the prophets of your mother.” But the king of Israel said to him, “No, for Yahweh has called these three kings to give them into the hand of Moab.”
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''What is there to me and to you?''—a formula expressing distance or rejection.'
    reason: lexical_alternative
  - marker: b
    text: Or 'Please do not, for the LORD has called these three kings to give them into the hand of Moab.' The Hebrew expression is difficult and may be read as a plea rather than a blunt objection.
    reason: alternative_reading
translation:
  language: ko
  text: 엘리사는 이스라엘 왕에게 말했습니다. “내가 당신과 무슨 상관이 있습니까?[a] 당신 아버지의 예언자들과 당신 어머니의 예언자들에게 가십시오.” 그러자 이스라엘 왕이 그에게 말했습니다. “아닙니다.[b] 야훼께서 이 세 왕을 모압의 손에 넘기시려고 부르셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘나와 당신 사이에 무엇이 있습니까?’라는 뜻이며 거리감이나 거절을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 난해하여 ‘아닙니다, …’처럼 항의로도, ‘부디 그러지 마십시오, …’처럼 간청으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַה לִּי וָלָךְ
  english_pob_choice: What do I have to do with you?
  chosen_korean: 내가 당신과 무슨 상관이 있습니까?
  alternatives_korean:
  - 내가 당신과 무슨 일이 있습니까?
  - 나와 당신이 무슨 관계가 있습니까?
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 질문이 아니라 거리감이나 거절을 드러내므로, 한국어에서도 자연스러운 반발 표현으로 옮겼습니다.
- source_word: נְבִיאֵי אָבִיךָ ... נְבִיאֵי אִמֶּךָ
  english_pob_choice: the prophets of your father and ... the prophets of your mother
  chosen_korean: 당신 아버지의 예언자들과 당신 어머니의 예언자들
  alternatives_korean:
  - 아버지의 예언자들과 어머니의 예언자들
  - 당신 아버지와 어머니의 예언자들
  lexicon: HALOT
  rationale: 왕실의 우상 숭배와 연결된 대상을 드러내기 위해 소유격 구조를 비교적 직접적으로 유지했습니다.
- source_word: קָרָא יְהוָה
  english_pob_choice: Yahweh has called
  chosen_korean: 야훼께서 ... 부르셨습니다
  alternatives_korean:
  - 야훼께서 ... 소집하셨습니다
  - 주님께서 ... 부르셨습니다
  lexicon: HALOT
  rationale: YHWH는 이 프로젝트 기본어인 야훼로 옮기고, קָרָא는 여기서 소집/부름의 뜻을 포함하지만 한국어에서는 문맥상 단순히 ‘부르다’가 가장 직접적입니다.
- source_word: בְּיַד מוֹאָב
  english_pob_choice: into the hand of Moab
  chosen_korean: 모압의 손에
  alternatives_korean:
  - 모압의 권세 아래
  - 모압에게
  lexicon: HALOT
  rationale: ‘손’의 히브리어 이미지를 보존해, 전달된 권력 관계를 드러내는 표현을 유지했습니다.
- source_word: אַל כִּי
  english_pob_choice: No, for
  chosen_korean: 아닙니다.
  alternatives_korean:
  - 아닙니다, 왜냐하면
  - 아니, 야훼께서...
  lexicon: HALOT
  rationale: 히브리어의 짧고 난해한 응답을 한국어에서 무리하게 확장하지 않고, 왕의 항의/부정을 간결하게 살렸습니다.
theological_decisions:
- issue: YHWH(יְהוָה)의 번역
