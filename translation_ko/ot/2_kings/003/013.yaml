  rationale: 문맥상 엘리사의 배척에 대한 왕의 긴급한 반응으로 읽는 것이 가장 자연스럽고, 본문의 축약성을 과도하게 풀지 않습니다.
  doctrine_reference: 'English audit trail: force of the king''s reply'
