base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/007.yaml
  text: So he went and sent word to Jehoshaphat king of Judah[a], saying, “The king of Moab has rebelled against me. Will you go with me against Moab for battle?” And he said, “I will go. I am as you are, my people as your people[b], my horses as your horses.”
  footnotes:
  - marker: a
    text: Or, “has broken away from me.” The Hebrew verb can denote political revolt or breach of allegiance; here it refers to Moab’s rebellion against Israelite rule.
    reason: lexical_alternative
  - marker: b
    text: Hebrew, “I will go up.” The verb often reflects movement into battle or toward higher terrain.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 가서 유다 왕 여호사밧에게 사람을 보내 말했습니다. “모압의 왕이 나에게 반역했습니다. 당신은 나와 함께 모압과 싸우러 가시겠습니까?” 그가 대답했습니다. “제가 가겠습니다. 나는 당신과 같고, 내 백성은 당신의 백성과 같으며, 내 말들은 당신의 말들과 같습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח אֶל
  english_pob_choice: sent word to
  chosen_korean: 사람을 보내 말했습니다
  alternatives_korean:
  - 전갈을 보내 말했습니다
  - 소식을 보내 말했습니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 물리적 ‘보냄’이 아니라 메시지 전달을 뜻하므로, 한국어에서도 자연스러운 ‘사람을 보내 말했습니다’로 옮겼습니다.
- source_word: פָּשַׁע בִּי
  english_pob_choice: has rebelled against me
  chosen_korean: 나에게 반역했습니다
  alternatives_korean:
  - 나를 배반했습니다
  - 나에게서 떨어져 나갔습니다
  lexicon: HALOT
  rationale: 정치·종주권 문맥에서 פשע는 단순한 위반보다 봉기/반역의 뜻이 강하므로 ‘반역했습니다’가 가장 직접적입니다.
- source_word: הֲתֵלֵךְ אִתִּי אֶל מוֹאָב לַמִּלְחָמָה
  english_pob_choice: Will you go with me against Moab for battle?
  chosen_korean: 당신은 나와 함께 모압과 싸우러 가시겠습니까?
  alternatives_korean:
  - 당신은 나와 함께 모압에 대하여 전쟁하러 가시겠습니까?
  - 당신은 나와 함께 모압을 향해 전투하러 가시겠습니까?
  lexicon: HALOT
  rationale: לַמִּלְחָמָה는 ‘전쟁을 위해’라는 목적을 나타내지만, 한국어에서는 자연스럽게 전투 행위를 드러내는 ‘싸우러’로 옮기면서 대상이 모압임을 유지했습니다.
- source_word: אֶעֱלֶה
  english_pob_choice: I will go
  chosen_korean: 제가 가겠습니다
  alternatives_korean:
  - 제가 올라가겠습니다
  - 제가 출정하겠습니다
  lexicon: HALOT
  rationale: עלה의 직역 ‘올라가겠습니다’는 군사적 뉘앙스는 살지만 한국어에서는 다소 경직될 수 있어, 약속의 응답으로 자연스러운 ‘가겠습니다’를 택했습니다.
- source_word: כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְּעַמֶּךָ כְּסוּסַי כְּסוּסֶיךָ
  english_pob_choice: I am as you are, my people as your people, my horses as your horses
  chosen_korean: 나는 당신과 같고, 내 백성은 당신의 백성과 같으며, 내 말들은 당신의 말들과 같습니다
  alternatives_korean:
  - 나는 당신과 같으며, 내 백성도 당신의 백성과 같고, 내 말들도 당신의 말들과 같습니다
  - 나는 당신과 같고, 내 백성도 당신의 백성과 같고, 내 말들도 당신의 말들과 같습니다
  lexicon: HALOT
  rationale: 히브리어의 병렬적, 생략적 서약 표현을 한국어에서도 그대로 살려 상호 동일시와 군사적 연대를 드러냈습니다.
theological_decisions:
- issue: 요단 동쪽 전쟁 요청에 대한 동맹 표명
  chosen_reading: 여호사밧의 응답을 단순한 호의가 아니라 군사 동맹과 동일시의 약속으로 번역했습니다.
  alternative_readings:
  - 부드러운 협력 요청 정도로 완화할 수 있음
  - ‘가겠습니다’를 단순 이동으로 처리할 수 있음
  rationale: 문맥상 ‘내 백성/내 말들’의 병렬은 실제 전쟁 동참과 자원 공유를 뜻하므로, 그 강도를 흐리지 않도록 했습니다.
  doctrine_reference: 본문 문맥 및 왕정사 역사 서술
