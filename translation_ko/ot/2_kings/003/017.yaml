  - 그 시내바닥
  lexicon: HALOT
  rationale: נחל은 이 사막적 문맥에서 계절성 물길을 가리키므로, 지형적·수문학적 의미를 살리는 ‘와디’를 채택했습니다.
- source_word: מִקְנֵיכֶם / בְהֶמְתְּכֶם
