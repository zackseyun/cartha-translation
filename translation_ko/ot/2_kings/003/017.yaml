base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/017.yaml
  text: 'For thus says Yahweh: You will not see wind[a], nor will you see rain, yet that wadi will be filled with water, and you and your livestock and your animals will drink.'
  footnotes:
  - marker: a
    text: Or 'that valley' or 'that streambed.' The Hebrew נחל often refers to a wadi, a seasonal watercourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 바람도 보지 못하고 비도 보지 못하겠지만, 그 와디에는 물이 가득 찰 것이며, 너희와 너희 가축과 너희 짐승이 마시게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 골짜기’, ‘그 시내바닥’. 히브리어 נחל은 흔히 계절성 물길인 와디를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 신성명은 일반 호칭이 아니라 언약 이름이므로, POB의 원칙에 따라 한국어도 ‘야훼’로 옮겨 개인명을 보존했습니다.
- source_word: כִּי כֹה אָמַר
  english_pob_choice: For thus says
  chosen_korean: 이렇게 말씀하십니다
  alternatives_korean:
  - 이것이 바로 …께서 말씀하시는 것입니다
  - 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언적 선언 공식을 현대 한국어에서 자연스럽고 격식 있게 살리기 위해 직설적인 발표문형으로 옮겼습니다.
- source_word: הַנַּחַל הַהוּא
  english_pob_choice: that wadi
  chosen_korean: 그 와디
  alternatives_korean:
  - 그 골짜기
  - 그 시내바닥
  lexicon: HALOT
  rationale: נחל은 이 사막적 문맥에서 계절성 물길을 가리키므로, 지형적·수문학적 의미를 살리는 ‘와디’를 채택했습니다.
- source_word: מִקְנֵיכֶם / בְהֶמְתְּכֶם
  english_pob_choice: your livestock and your animals
  chosen_korean: 너희 가축과 너희 짐승
  alternatives_korean:
  - 너희 가축과 너희 동물들
  - 너희 소떼와 너희 짐승
  lexicon: HALOT
  rationale: 두 명사가 나란히 있어 소유한 가축과 보다 넓은 짐승류를 구분해 주므로, 한국어에서도 반복을 살려 별개 항목으로 유지했습니다.
theological_decisions:
- issue: 예언 선언의 신적 주체와 인칭
  chosen_reading: ‘야훼께서 이렇게 말씀하십니다’로 시작해 신적 선언의 직접성을 보존했습니다.
  alternative_readings:
  - ‘주님께서 이렇게 말씀하십니다’
  - ‘야훼가 이같이 말하십니다’
  rationale: 히브리어 직설 공식은 단순 정보 전달이 아니라 신적 권위의 선포이므로, 한국어도 구어적 완화 없이 선언형으로 재현했습니다.
  doctrine_reference: 'DOCTRINE.md: divine name and prophetic speech register'
