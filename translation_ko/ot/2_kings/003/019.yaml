id: 2KI.3.19
reference: 2 Kings 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִכִּיתֶ֞ם כָּל עִ֤יר מִבְצָר֙ וְ/כָל עִ֣יר מִבְח֔וֹר וְ/כָל עֵ֥ץ טוֹב֙ תַּפִּ֔ילוּ וְ/כָל מַעְיְנֵי מַ֖יִם תִּסְתֹּ֑מוּ וְ/כֹל֙ הַ/חֶלְקָ֣ה הַ/טּוֹבָ֔ה תַּכְאִ֖בוּ בָּ/אֲבָנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/019.yaml
  text: And you shall strike every fortified city and every choice city[a], and you shall fell every good tree, and stop up all springs of water[b], and ruin every good field with stones.
  footnotes:
  - marker: a
    text: Or 'every select city' or 'every best city' for 'every choice city.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'make painful with stones'; the Hebrew idiom refers to ruining farmland by throwing stones over it.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 너희는 모든 요새화된 성읍과 모든 빼어난 성읍을 치고, 모든 좋은 나무를 베어 넘어뜨리고, 모든 샘물을 막고, 모든 좋은 밭을 돌로 훼손하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모든 선택된 성읍’ 혹은 ‘가장 좋은 성읍’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘돌로 아프게 하다’입니다. 여기서는 돌을 던져 농토를 못 쓰게 만드는 관용적 표현을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכִּיתֶם
  english_pob_choice: you shall strike
  chosen_korean: 치고
  alternatives_korean:
  - 쳐서
  - 공격하여
  lexicon: HALOT
  rationale: 군사적 행위로서의 נכה를 한국어에서 가장 직접적으로 드러내면서도, 뒤따르는 목적어들(성읍, 나무, 샘, 밭)과 자연스럽게 이어지도록 ‘치다’로 옮겼습니다.
- source_word: עִיר מִבְצָר / עִיר מִבְחוֹר
  english_pob_choice: fortified city / choice city
  chosen_korean: 요새화된 성읍 / 좋은 성읍
  alternatives_korean:
  - 요새 성읍 / 선택된 성읍
  - 튼튼한 성읍 / 수려한 성읍
  lexicon: HALOT
  rationale: מִבְצָר는 방어 시설이 갖춰진 성읍을, מִבְחוֹר는 선택된 우수한 성읍을 가리키므로 각각 기능을 살려 옮겼습니다. 두 번째 항목의 ‘좋은’은 POB의 ‘choice’에 대응하면서도 과도한 해석을 피합니다.
- source_word: תַּכְאִבוּ בָּאֲבָנִים
  english_pob_choice: ruin ... with stones
  chosen_korean: 돌로 망쳐 놓으십시오
  alternatives_korean:
  - 돌을 뿌려 황폐하게 하십시오
  - 돌로 해치십시오
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘돌로 아프게 하다’이지만, 관용적으로는 돌을 던져 농토를 못 쓰게 만드는 뜻이므로 결과를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 전쟁 명령의 직설성
  chosen_reading: 본문의 파괴 명령을 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘점령하십시오’로 옮김
  - 해석적으로 ‘무력화하십시오’로 옮김
  rationale: 히브리어 동사와 대상들이 모두 파괴적 행동을 구체적으로 제시하므로, 본문의 충격과 의도된 군사 전략을 보존하는 편이 원문에 더 충실합니다.
  doctrine_reference: 본문-충실성 원칙
