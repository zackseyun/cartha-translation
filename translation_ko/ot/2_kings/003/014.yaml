source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלִישָׁ֗ע חַי יְהוָ֤ה צְבָאוֹת֙ אֲשֶׁ֣ר עָמַ֣דְתִּי לְ/פָנָ֔י/ו כִּ֗י לוּלֵ֛י פְּנֵ֛י יְהוֹשָׁפָ֥ט מֶֽלֶךְ יְהוּדָ֖ה אֲנִ֣י נֹשֵׂ֑א אִם אַבִּ֥יט אֵלֶ֖י/ךָ וְ/אִם אֶרְאֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/014.yaml
  text: And Elisha said[a], "As Yahweh of hosts lives, before whom I stand, were it not that I regard the presence of Jehoshaphat king of Judah[b], I would not look at you or see you."
  footnotes:
  - marker: a
    text: 'Hebrew ''before whose face I stood''; the idiom can also imply prophetic service: ''whom I serve.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'if it were not for Jehoshaphat king of Judah, whom I regard.' The Hebrew uses an idiom involving 'lifting up the face,' meaning to show favor or regard.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사가 말했습니다. “만군의 야훼께서 살아 계심을 두고 맹세합니다. 내가 그분 앞에 서 있습니다.[a] 내가 유다 왕 여호사밧을 존중하지 않았다면,[b] 당신을 바라보지도, 보지도 않았을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내가 그의 앞에 섰다’입니다. 이 표현은 예언자가 하나님 앞에 서서 섬긴다는 뜻을 암시할 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘여호사밧의 얼굴을 들다’라는 관용 표현입니다. 이는 그에게 호의나 배려를 보인다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַי יְהוָה צְבָאוֹת
  english_pob_choice: As Yahweh of hosts lives
  chosen_korean: ‘야훼 만군의 하나님’께서 살아 계심을 두고
  alternatives_korean:
  - ‘야훼 만군의 주님’께서 살아 계심을 두고
  - ‘야훼 만군의 여호와’께서 살아 계심을 두고
  lexicon: HALOT
  rationale: 히브리어 맹세 관용구를 한국어의 자연스러운 맹세 형식으로 옮기되, יְהוָה는 본문 원어의 고유명으로 ‘야훼’를 유지했습니다. צְבָאוֹת은 ‘만군’으로 옮겨 전통적 제목의 폭을 보존했습니다.
- source_word: אֲשֶׁר עָמַדְתִּי לְפָנָיו
  english_pob_choice: before whom I stand
  chosen_korean: 내가 그분 앞에 서 있습니다
  alternatives_korean:
  - 내가 그분을 섬깁니다
  - 내가 그분 앞에 섰습니다
  lexicon: HALOT
  rationale: ‘서 있다’라는 직유를 살리면서, 선지자적 봉사의 뉘앙스를 지나치게 해설하지 않았습니다. 한국어에서는 현재형으로도 관용적 맹세 문맥이 자연스럽습니다.
- source_word: פְּנֵי יְהוֹשָׁפָט
  english_pob_choice: the presence of Jehoshaphat
  chosen_korean: 여호사밧의 얼굴을 보아 주지 않았더라면
  alternatives_korean:
  - 여호사밧의 앞모습을 보지 않았더라면
  - 여호사밧의 얼굴을 들어 주지 않았더라면
  lexicon: HALOT
  rationale: פָּנִים의 문자적 ‘얼굴’과 관용적 ‘호의/고려’의 의미를 함께 살리기 위해 ‘얼굴을 보아 주다’로 옮겼습니다. 이는 단순 감각적 시선이 아니라 호의를 보인다는 관용적 의미를 드러냅니다.
- source_word: אִם אַבִּיט אֵלֶיךָ וְאִם אֶרְאֶךָּ
  english_pob_choice: I would not look at you or see you
  chosen_korean: 내가 당신을 보지도, 바라보지도 않았을 것입니다
  alternatives_korean:
  - 내가 당신을 쳐다보지도, 보지도 않았을 것입니다
  - 내가 당신을 보거나 알아보지도 않았을 것입니다
  lexicon: HALOT
  rationale: 두 동사의 병렬을 유지하되, 한국어에서는 의미 중복이 과도하지 않도록 ‘보다/바라보다’로 구분했습니다. 조건절의 생략된 부정을 한국어 문장에서는 명시적으로 풀었습니다.
- source_word: יְהוֹשָׁפָט
  english_pob_choice: Jehoshaphat
  chosen_korean: 여호사밧
  alternatives_korean:
  - 여호샤팟
  lexicon: standard transliteration
  rationale: 한국어 성서권에서 널리 알려진 표준 음역을 따랐습니다.
- source_word: יְהוּדָה
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유대
  lexicon: standard transliteration
  rationale: 왕국 이름으로서의 표준 표기를 따랐습니다.
