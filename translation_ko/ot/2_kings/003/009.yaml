  yaml_path: translation/ot/2_kings/003/009.yaml
  text: So the king of Israel went[a], along with the king of Judah and the king of Edom, and they went around by a route of seven days; but there was no water for the camp or for the livestock that followed them.
  footnotes:
  - marker: a
    text: Literally, 'the livestock that was at their feet,' an idiom for animals accompanying them.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 이스라엘 왕이 유다 왕과 에돔 왕과 함께 나아가서, 칠일 길로 우회하였으나, 진영과 그들을 따르던 가축을 위해서는 물이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 발치에 있던 가축’인데, 여기서는 그들을 따라다닌 동물들을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: went
  chosen_korean: 나아가서
  alternatives_korean:
  - 갔습니다
  - 진군하였습니다
  lexicon: HALOT
  rationale: 단순 이동을 뜻하는 기본 서술이지만, 앞뒤의 동맹 원정 문맥을 살려 현대 한국어에서 자연스러운 ‘나아가서’로 옮겼습니다.
- source_word: וַיָּסֹבּוּ דֶּרֶךְ שִׁבְעַת יָמִים
  english_pob_choice: they went around by a route of seven days
  chosen_korean: 칠일 길로 우회하였으나
  alternatives_korean:
  - 칠 일의 길을 돌아갔으나
  - 칠일 동안 돌아가자
  lexicon: HALOT
  rationale: סבב의 ‘둘러가다/우회하다’와 דֶּרֶךְ의 ‘길/경로’ 감각을 함께 살려, ‘칠일 길로 우회하다’로 압축해 표현했습니다.
- source_word: לַמַּחֲנֶה
  english_pob_choice: for the camp
  chosen_korean: 진영
  alternatives_korean:
  - 캠프
  - 군영
  lexicon: HALOT
  rationale: מַחֲנֶה는 여기서 군사적 집결지를 가리키므로 ‘진영’이 가장 자연스럽고, 과도하게 교회적이거나 현대화된 표현도 피합니다.
- source_word: וְלַבְּהֵמָה ... אֲשֶׁר בְּרַגְלֵיהֶם
  english_pob_choice: for the livestock that followed them
  chosen_korean: 그들을 따르던 가축
  alternatives_korean:
  - 그들의 발치에 있던 가축
  - 그들과 함께한 가축
  lexicon: HALOT
  rationale: 직역인 ‘발치에 있던’은 한국어에서 어색하므로, 관용적 의미를 살려 ‘따르던 가축’으로 옮기되 POB의 본문 취지를 유지했습니다.
