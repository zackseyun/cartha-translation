id: 2KI.3.15
reference: 2 Kings 3:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/עַתָּ֖ה קְחוּ לִ֣/י מְנַגֵּ֑ן וְ/הָיָה֙ כְּ/נַגֵּ֣ן הַֽ/מְנַגֵּ֔ן וַ/תְּהִ֥י עָלָ֖י/ו יַד יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/015.yaml
  text: But now[a], bring me a musician. And as the musician played[b], the hand of Yahweh came upon him.
  footnotes:
  - marker: a
    text: Or, 'a minstrel' or 'an instrumental player.' The Hebrew refers generally to one who plays music, without specifying the instrument.
    reason: lexical_alternative
  - marker: b
    text: '''The hand of the LORD'' is a Hebrew idiom for divine power or prophetic influence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 지금은 저에게 악사 하나를 데려오십시오. 악사가 연주하는 동안 야훼의 손이 그에게 임하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘악사’는 악기 종류를 특정하지 않는 일반적 표현입니다. 히브리어는 단지 ‘연주하는 사람’을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼의 손’은 성경 히브리어에서 하나님의 능력이나 예언적 영향력을 나타내는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: But now
  chosen_korean: 그러나 지금은
  alternatives_korean:
  - 지금은
  - 그리고 지금은
  lexicon: HALOT
  rationale: 이 문구는 앞선 상황에서 화제를 전환하며 즉각적인 행동을 요구하므로, 단순한 시간 표시보다 역접 뉘앙스를 살려 ‘그러나 지금은’으로 옮겼습니다.
- source_word: קְחוּ לִי
  english_pob_choice: bring me
  chosen_korean: 저에게 … 데려오십시오
  alternatives_korean:
  - 저를 위해 … 가져오십시오
  - 저에게 … 가져다주십시오
  lexicon: HALOT
  rationale: 명령형과 여격 대명사는 문맥상 사람을 ‘데려오다/데려오게 하다’의 뜻이 자연스러우므로, 직접적이고 현대적인 표현을 택했습니다.
- source_word: מְנַגֵּן
  english_pob_choice: a musician
  chosen_korean: 악사 하나
  alternatives_korean:
  - 음악가 하나
  - 연주자 하나
  - 한 사람의 연주자
  lexicon: HALOT
  rationale: 히브리어는 특정 악기를 밝히지 않고 ‘연주하는 사람’을 가리키므로, 범위를 넓게 유지하는 ‘악사’가 원문의 일반성을 잘 살립니다.
- source_word: יַד יְהוָה
  english_pob_choice: the hand of Yahweh
  chosen_korean: 야훼의 손
  alternatives_korean:
  - 야훼의 능력
  - 야훼의 권능
  lexicon: HALOT
  rationale: ‘손’은 하나님의 능력이나 예언적 영향력을 나타내는 관용구이므로, 의미를 풀이하기보다 이미지 자체를 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문은 신명기적 전승의 고유 이름 יְהוָה를 직접 사용하므로, 주석적·학술적 일관성을 위해 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘야훼의 손’ 관용구의 처리
  chosen_reading: 야훼의 손이 그에게 임하였습니다
  alternative_readings:
  - 야훼의 능력이 그에게 임하였습니다
  - 야훼의 손이 그 위에 있었습니다
  rationale: 예언적 영감/능력의 개시를 암시하지만, 그 신학적 작용을 지나치게 풀어 쓰지 않고 히브리어 관용구를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
