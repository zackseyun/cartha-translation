  yaml_path: translation/ot/2_kings/003/006.yaml
  text: So King Jehoram went out from Samaria that day and mustered all Israel[a].
  footnotes:
  - marker: a
    text: Or 'numbered all Israel' or 'reviewed all Israel.' The Hebrew verb can refer to taking a count or conducting a military muster; here the context favors a military sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그날 왕 여호람이 사마리아에서 나가서 온 이스라엘을 소집했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 פקד는 ‘계수하다’, ‘검열하다’, ‘소집하다’ 등으로 옮길 수 있으나, 여기서는 전쟁 준비 문맥이므로 군사적 의미를 반영했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나가서
  alternatives_korean:
  - 떠나서
  - 출발해서
  - 진군해서
  lexicon: HALOT
  rationale: 출애굽이 아니라 단순한 이동 동작을 나타내므로, 과도한 군사적 해석을 덧붙이지 않는 ‘나가서’가 원문의 기본 의미를 가장 자연스럽게 살립니다.
- source_word: הַמֶּלֶךְ יְהוֹרָם
  english_pob_choice: King Jehoram
  chosen_korean: 왕 여호람
  alternatives_korean:
  - 여호람 왕
  - 왕이신 여호람
  lexicon: HALOT
  rationale: 히브리어의 관사+명사+이름 구조를 한국어에서는 호칭을 앞세워 옮기는 것이 가장 직설적이며, 본문이 강조하는 인물 식별을 유지합니다.
- source_word: וַיִּפְקֹד אֶת כָּל יִשְׂרָאֵל
  english_pob_choice: mustered all Israel
  chosen_korean: 온 이스라엘을 소집했습니다
  alternatives_korean:
  - 온 이스라엘을 계수했습니다
  - 온 이스라엘을 검열했습니다
  - 온 이스라엘을 동원했습니다
  lexicon: HALOT
  rationale: פקד는 ‘계수하다’보다 군사적 문맥에서 ‘소집하다/동원하다’가 더 적절합니다. 영어 POB가 ‘mustered’를 택한 점을 따라, 병력을 모아 점검하는 뉘앙스를 살렸습니다.
