reference: 2 Kings 3:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶ/עָרִ֣ים יַהֲרֹ֡סוּ וְ/כָל חֶלְקָ֣ה ט֠וֹבָה יַשְׁלִ֨יכוּ אִישׁ אַבְנ֜/וֹ וּ/מִלְא֗וּ/הָ וְ/כָל מַעְיַן מַ֤יִם יִסְתֹּ֨מוּ֙ וְ/כָל עֵֽץ ט֣וֹב יַפִּ֔ילוּ עַד הִשְׁאִ֧יר אֲבָנֶ֛י/הָ בַּ/קִּ֖יר חֲרָ֑שֶׂת וַ/יָּסֹ֥בּוּ הַ/קַּלָּעִ֖ים וַ/יַּכּֽוּ/הָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/025.yaml
  text: They demolished the cities[a], and on every good piece of land each man threw his stone until they had filled it. They stopped up every spring of water and felled every good tree, until only its stones were left in Kir-hareseth[d][c][b]; then the slingers surrounded it and attacked it.
  footnotes:
  - marker: a
    text: Or 'every good field.' The Hebrew חֶלְקָה refers to a parcel or portion of land.
    reason: lexical_alternative
  - marker: b
    text: Literally 'every good tree'; this may refer more specifically to valuable or productive trees.
    reason: lexical_alternative
  - marker: c
    text: Kir-hareseth is a place name, likely the principal fortified city of Moab in this context.
    reason: cultural_note
  - marker: d
    text: Or 'struck it.' The Hebrew verb is literally 'hit/strike,' here used for military assault on the city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 성읍들을 무너뜨리고, 좋은 땅마다 사람마다 자기 돌을 던져 그것을 가득 채웠습니다. 그들은 물의 모든 샘을 막고, 좋은 나무마다 모두 베어 버렸으며, 그 돌들만 남을 때까지 키르-하레셋에서 그랬습니다. 그러자 물매꾼들이 그 성을 에워싸고 쳤습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘좋은 밭들’입니다. 히브리어 חֶלְקָה는 토지의 구획이나 몫을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘좋은 나무마다’입니다. 여기서는 값지거나 생산적인 나무들을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 키르-하레셋은 지명으로, 이 문맥에서 모압의 주요 요새 도시로 보입니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘쳤습니다.’ 히브리어 동사는 문자적으로 ‘치다/때리다’이며, 여기서는 성을 향한 군사적 공격을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעָרִים
  english_pob_choice: the cities
  chosen_korean: 성읍들
  alternatives_korean:
  - 도시들
  - 읍성들
  lexicon: HALOT
  rationale: 전쟁 문맥에서 עִיר는 방어된 거점들을 가리키므로, 현대 한국어에서는 ‘성읍들’이 도시 일반보다 더 군사적·역사적 뉘앙스를 살립니다.
- source_word: יַהֲרֹסוּ
  english_pob_choice: they demolished
  chosen_korean: 무너뜨리고
  alternatives_korean:
  - 헐어 버리고
  - 파괴하고
  lexicon: HALOT
  rationale: הרס는 구조물을 허물어뜨리는 뜻이므로, ‘무너뜨리고’가 구체성을 유지하면서도 자연스럽습니다.
- source_word: חֶלְקָה טוֹבָה
  english_pob_choice: good piece of land
  chosen_korean: 좋은 땅
  alternatives_korean:
  - 좋은 밭
  - 좋은 토지
  lexicon: HALOT
  rationale: חֶלְקָה는 땅의 구획을 뜻하지만, 이 구절에서는 농업 생산지를 가리키므로 ‘좋은 땅’이 과도한 세부화를 피하면서 뜻을 살립니다.
- source_word: וַיַּכּוּהָ
  english_pob_choice: attacked it
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 공격했습니다
  - 내리쳤습니다
  lexicon: HALOT
  rationale: 마지막 동사 נכה는 기본적으로 ‘치다/때리다’이므로, 군사적 문맥을 유지하면서도 원문에 가까운 ‘쳤습니다’로 옮겼습니다.
