  rationale: 전쟁 문맥에서 עִיר는 방어된 거점들을 가리키므로, 현대 한국어에서는 ‘성읍들’이 도시 일반보다 더 군사적·역사적 뉘앙스를 살립니다.
- source_word: יַהֲרֹסוּ
