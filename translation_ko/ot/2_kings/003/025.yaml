  lexicon: HALOT
  rationale: הרס는 구조물을 허물어뜨리는 뜻이므로, ‘무너뜨리고’가 구체성을 유지하면서도 자연스럽습니다.
- source_word: חֶלְקָה טוֹבָה
  english_pob_choice: good piece of land
  chosen_korean: 좋은 땅
  alternatives_korean:
  - 좋은 밭
  - 좋은 토지
  lexicon: HALOT
  rationale: חֶלְקָה는 땅의 구획을 뜻하지만, 이 구절에서는 농업 생산지를 가리키므로 ‘좋은 땅’이 과도한 세부화를 피하면서 뜻을 살립니다.
- source_word: וַיַּכּוּהָ
  english_pob_choice: attacked it
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 공격했습니다
  - 내리쳤습니다
  lexicon: HALOT
  rationale: 마지막 동사 נכה는 기본적으로 ‘치다/때리다’이므로, 군사적 문맥을 유지하면서도 원문에 가까운 ‘쳤습니다’로 옮겼습니다.
