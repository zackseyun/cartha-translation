  text: וַ/יַּעֲשֶׂ֤ה הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֥א כְ/אָבִ֖י/ו וּ/כְ/אִמּ֑/וֹ וַ/יָּ֨סַר֙ אֶת מַצְּבַ֣ת הַ/בַּ֔עַל אֲשֶׁ֥ר עָשָׂ֖ה אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], though not like his father and his mother[b], for he removed the pillar of Baal that his father had made.
  footnotes:
  - marker: a
    text: 'Or ''only, not like his father and his mother.'' The Hebrew particle introduces a qualification: he was evil, but not to the same extent as his parents.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the sacred pillar of Baal' or 'the standing stone of Baal.' The Hebrew refers to a cultic pillar associated with Baal worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 보시기에 악을 행했습니다. 그러나 그의 아버지와 어머니만큼은 아니었는데, 이는 그가 그의 아버지가 만든 바알의 기둥을 치웠기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 아버지와 어머니만큼은 아니었다’. 히브리어의 입자는 자질을 제한하는 뜻을 더해, 그는 악했지만 그의 부모만큼 심하지는 않았다는 의미를 나타낼 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘바알의 거룩한 기둥’ 혹은 ‘바알의 서 있는 돌’. 히브리어는 바알 숭배와 관련된 제의적 기둥을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악을 행했습니다
  alternatives_korean:
  - 악한 일을 했습니다
  - 악을 저질렀습니다
  lexicon: HALOT
  rationale: 히브리어의 관용구로서 단순히 ‘나쁘다’가 아니라 하나님 앞에서 도덕적으로 악한 행위를 했다는 평가를 담으므로, 현대 한국어에서 자연스럽고 압축적인 ‘악을 행했습니다’로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈에/보시기에’는 히브리어 관용구의 평가적 의미를 잘 살리며, POB의 야훼 표기를 그대로 반영해 주어를 분명히 했습니다.
- source_word: רַק לֹא כְאָבִיו וּכְאִמּוֹ
  english_pob_choice: though not like his father and his mother
  chosen_korean: 그러나 그의 아버지와 어머니만큼은 아니었는데
  alternatives_korean:
  - 다만 그의 아버지와 어머니와 같지는 않았는데
  - 그의 아버지와 어머니처럼은 아니었는데
  lexicon: HALOT
  rationale: רַק의 제한·대조 뉘앙스를 살리면서, 본문의 평가는 악이지만 정도가 더 심하지 않다는 점을 한국어 문장으로 자연스럽게 표현했습니다.
- source_word: מַצְּבַת הַבַּעַל
  english_pob_choice: the pillar of Baal
  chosen_korean: 바알의 기둥
  alternatives_korean:
  - 바알의 제의 기둥
  - 바알의 석상
  lexicon: HALOT
  rationale: מַצֵּבָה는 제의적 ‘서 있는 돌/기둥’을 가리키므로, POB의 ‘pillar’를 따라 ‘기둥’으로 옮겼습니다. 이 단어는 바알 숭배와 관련된 물체라는 점을 문맥이 충분히 보여 줍니다.
