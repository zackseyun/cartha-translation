  text: Jehoshaphat said[a], “The word of Yahweh is with him.” So the king of Israel, Jehoshaphat, and the king of Edom went down to him.
  footnotes:
  - marker: a
    text: Or, “He has a word from the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여호사밧이 말했습니다. 「그에게 야훼의 말씀이 있습니다.」 그래서 이스라엘 왕과 여호사밧과 에돔 왕이 그에게 내려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「그에게는 야훼의 말씀이 있습니다」.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  english_pob_choice: Jehoshaphat
  chosen_korean: 여호사밧
  alternatives_korean:
  - 여호사파트
  lexicon: 표준 음역
  rationale: 이미 널리 정착된 성경 인명 표기를 따라 여호사밧으로 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 야훼의 말씀을
  lexicon: HALOT
  rationale: 예언적 관용구 דְּבַר יְהוָה를 한국어 성경 관용어인 ‘말씀’으로 옮기되, 본문 지침에 따라 신명은 ‘야훼’로 반영했습니다.
- source_word: יֵשׁ אֹתוֹ
  english_pob_choice: is with him
  chosen_korean: 그에게 있습니다
  alternatives_korean:
  - 그와 함께 있습니다
  - 그에게서 찾을 수 있습니다
  lexicon: HALOT
  rationale: 문맥상 엘리사가 야훼의 계시를 지니고 있음을 말하는 표현이므로, 직역의 어색함을 피하면서도 존재/소유의 의미를 살려 자연스럽게 옮겼습니다.
- source_word: וַיֵּרְדוּ אֵלָי/ו
  english_pob_choice: went down to him
  chosen_korean: 그에게 내려갔습니다
  alternatives_korean:
  - 그에게로 내려갔습니다
  - 그에게 갔습니다
  lexicon: HALOT
  rationale: ירד의 하향 이동을 보존하기 위해 ‘내려갔습니다’를 선택했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문의 יהוה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 신명기적 이름을 사용하므로, 익숙한 대체어보다 स्रोत 직결 표기를 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יהוה / YHWH → 야훼'
- issue: ‘그에게 말씀’의 의미
  chosen_reading: 이 표현은 엘리사가 하나님의 계시를 소유하거나 전달하는 예언자라는 뜻으로 이해했습니다.
  alternative_readings:
  - 그에게서 한 말이 있습니다
  - 그와 관련된 말씀이 있습니다
  rationale: 문맥상 단순한 정보 소유가 아니라 예언적 계시의 현존을 가리키므로, 그 신학적 함의를 드러내되 과장하지 않았습니다.
  doctrine_reference: 예언자적 계시의 통상적 본문 이해
