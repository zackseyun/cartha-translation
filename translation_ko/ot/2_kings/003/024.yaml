  rationale: 3인칭 여성 단수 접미사의 모호성을 살려 ‘그곳’으로 옮겼고, 주석 없이 본문에서 대상을 좁히지 않았습니다.
- source_word: וְהַכּוֹת אֶת מוֹאָב
