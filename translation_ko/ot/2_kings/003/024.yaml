base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/024.yaml
  text: When they came to the camp of Israel[a], Israel rose up and struck Moab, and they fled before them. Then they went into it and kept striking Moab.
  footnotes:
  - marker: a
    text: Or 'they entered the land' or 'they advanced into Moab.' The Hebrew has 'they went into it,' with the feminine suffix likely referring to the land/territory rather than the people directly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 이스라엘 진영에 이르자, 이스라엘이 일어나 모압을 쳤고, 모압 사람들은 이스라엘 앞에서 달아났습니다. 이스라엘은 그 안으로[a] 들어가 모압을 계속 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅으로 들어갔다’ 혹은 ‘모압으로 진군했다’일 수 있습니다. 히브리어는 직역하면 ‘그 안으로 들어갔다’이며, 여성형 접미사는 사람보다 땅이나 영역을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
