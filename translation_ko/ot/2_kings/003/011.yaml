  - 주님
  rationale: 프로젝트 기본어휘와 본문 증거를 따라 여호와 번역 관습보다 מקור 이름의 음역을 우선해 언약적 고유명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
