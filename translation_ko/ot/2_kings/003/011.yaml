source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוֹשָׁפָ֗ט הַ/אֵ֨ין פֹּ֤ה נָבִיא֙ לַֽ/יהוָ֔ה וְ/נִדְרְשָׁ֥ה אֶת יְהוָ֖ה מֵ/אוֹת֑/וֹ וַ֠/יַּעַן אֶחָ֞ד מֵ/עַבְדֵ֤י מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יֹּ֔אמֶר פֹּ֚ה אֱלִישָׁ֣ע בֶּן שָׁפָ֔ט אֲשֶׁר יָ֥צַק מַ֖יִם עַל יְדֵ֥י אֵלִיָּֽהוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/011.yaml
  text: And Jehoshaphat said[a], “Is there no prophet of Yahweh here, that we may inquire of Yahweh by him?” Then one of the servants of the king of Israel answered and said, “Elisha son of Shaphat is here[b], who used to pour water on the hands of Elijah.”
  footnotes:
  - marker: a
    text: Or, more formally, “that we may seek the LORD from him.” The sense is to inquire of the LORD by means of the prophet.
    reason: lexical_alternative
  - marker: b
    text: This expression likely refers to Elisha’s personal service to Elijah, preserving the Hebrew image of pouring water for handwashing.
    reason: cultural_note
translation:
  language: ko
  text: 여호사밧이 말했습니다. “여기 야훼의 예언자가 없습니까? 우리가 그를 통해 야훼께 여쭈어 볼 수 있겠습니까?”[a] 그러자 이스라엘 왕의 신하들 중 한 사람이 대답하여 말했습니다. “여기에 사밧의 아들 엘리사가 있습니다. 그는 엘리야의 손에 물을 붓던 사람입니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “우리가 그에게서 야훼를 찾을 수 있겠습니까?” 여기서 ‘찾다’는 예언자를 통하여 야훼께 문의한다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 표현은 엘리사가 엘리야를 개인적으로 시중들었음을 가리키는 말로 보입니다. 손 씻기를 위해 물을 붓는 히브리어의 이미지를 보존했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוֹשָׁפָט / וַיֹּאמֶר
  english_pob_choice: And Jehoshaphat said
  chosen_korean: 여호사밧이 말했습니다
  alternatives_korean:
  - 여호사밧이 말하였습니다
  - 여호사밧이 이르렀습니다
  lexicon: HALOT
  rationale: 서술문 대화 도입을 자연스러운 현대 문어체로 옮기되, 고어적 ‘이르렀습니다’는 피했습니다.
- source_word: נָבִיא לַיהוָה
  english_pob_choice: prophet of Yahweh
  chosen_korean: 야훼의 예언자
  alternatives_korean:
  - 야훼의 선지자
  - 야훼의 예언자
  lexicon: HALOT
  rationale: לְ/לַ- 관계는 소유라기보다 소속·관계를 나타내므로 ‘야훼의 예언자’로 옮겨, POB의 야훼 용례를 유지했습니다.
- source_word: וְנִדְרְשָׁה אֶת־יְהוָה מֵאֹתוֹ
  english_pob_choice: that we may inquire of Yahweh through him
  chosen_korean: 우리가 그를 통해 야훼께 여쭈어 보게 하십시오
  alternatives_korean:
  - 우리가 그를 통해 야훼를 찾게 하십시오
  - 우리가 그를 통해 야훼께 문의하게 하십시오
  lexicon: HALOT
  rationale: דרשׁ는 단순한 ‘찾다’보다 신탁적 문의·조회의 뉘앙스가 있어, 한국어에서는 ‘여쭈어 보다’로 자연스럽게 풀되 매개 관계를 ‘그를 통해’로 드러냈습니다.
- source_word: עַבְדֵי מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the servants of the king of Israel
  chosen_korean: 이스라엘 왕의 신하들
  alternatives_korean:
  - 이스라엘 왕의 종들
  - 이스라엘 왕의 시종들
  lexicon: HALOT
  rationale: 궁정 맥락의 עֶבֶד는 신분적 노예보다 왕실 시종·신하를 가리키므로, 의미와 한국어 관용을 함께 살려 ‘신하들’로 옮겼습니다.
- source_word: אֲשֶׁר יָצַק מַיִם עַל יְדֵי אֵלִיָּהוּ
  english_pob_choice: who used to pour water on the hands of Elijah
  chosen_korean: 그는 엘리야의 손에 물을 붓던 사람입니다
  alternatives_korean:
  - 그는 엘리야의 손에 물을 부은 사람입니다
  - 그는 엘리야를 섬기던 사람입니다
  lexicon: HALOT
  rationale: ‘손에 물을 붓다’라는 히브리어 이미지를 유지했고, 상대적 과거·습관성을 한국어 관용 과거 관형 ‘붓던’으로 표현했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮겼습니다.
  alternative_readings:
