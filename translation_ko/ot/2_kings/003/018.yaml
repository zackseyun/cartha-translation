lexical_decisions:
- source_word: וְנָקַל
  english_pob_choice: is a small thing
  chosen_korean: 작은 일입니다
  alternatives_korean:
  - 가벼운 일입니다
  - 쉬운 일입니다
  - 하찮은 일입니다
  lexicon: HALOT
  rationale: קל의 평가적 의미를 살려, 앞선 물 공급과 대비되는 ‘별것 아닌 일’이라는 뉘앙스를 자연스러운 합쇼체로 옮겼습니다.
- source_word: בְּעֵינֵי
  english_pob_choice: in the eyes of
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼의 관점에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구의 비유적 평가 의미를 유지하면서 한국어로도 직관적인 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명사표를 직역 대신 고유명사로 보존하여, 전통적 ‘여호와/주님’으로 대체하지 않았습니다.
- source_word: בְּיֶדְכֶם
  english_pob_choice: into your hand
  chosen_korean: 여러분의 손에 넘겨주실 것입니다
  alternatives_korean:
  - 여러분의 손에 줄 것입니다
  - 여러분의 권세 아래 두실 것입니다
  - 여러분의 손 안에 둘 것입니다
  lexicon: HALOT
  rationale: ‘손에’라는 관용구의 지배·인도 의미를 살리되, 한국어에서는 결과 동사 ‘넘겨주다’로 자연스럽게 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 처리할 것인가
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 하나님의 개인적 언약 이름을 사용하므로, 칭호로 바꾸지 않고 고유명사를 보존하는 것이 본문이 드러내려는 신학적 포인트를 더 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
