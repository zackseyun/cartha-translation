  lexicon: HALOT
  rationale: 반복은 다수성과 강조를 나타내므로, ‘가득 채우십시오’로 결과 상태를 자연스럽게 살리되 복수형 ‘웅덩이들’로 반복의 효과를 반영했습니다.
