  rationale: 예언자적 사자 공식은 한국어에서 ‘이렇게 말씀하십니다’로 자연스럽게 살리고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겨 개인명을 보존했습니다.
