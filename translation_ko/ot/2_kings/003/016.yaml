base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/016.yaml
  text: 'And he said[c][b][a], “Thus says Yahweh: Make this wadi full of pits.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''wadi'' can also be rendered ''valley,'' ''streambed,'' or ''brook,'' referring to a seasonal watercourse.'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats ''pits'' for emphasis: literally, ''Make this wadi pits, pits,'' that is, many pits or pits throughout it.'
    reason: lexical_alternative
  - marker: c
    text: '''the LORD'' renders the divine name YHWH; alternatively, ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. 「야훼께서 이렇게 말씀하십니다. 이 와디를 웅덩이들로 가득 채우십시오.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נחל은 여기서 계절성 물길, 곧 와디를 뜻할 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘웅덩이들’을 반복해 강조합니다. 곧 ‘이 와디를 웅덩이들, 웅덩이들로’라는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה는 신명 ‘야훼’를 가리킵니다.
    reason: theological_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
