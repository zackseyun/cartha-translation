    text: 히브리어 נחל은 여기서 계절에 따라 물이 흐르는 물길, 곧 와디를 뜻할 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 ‘웅덩이들’을 반복하여 강조합니다. 직역하면 ‘이 와디를 웅덩이들, 웅덩이들로 만들라’는 뜻이며, 와디 곳곳에 많은 웅덩이를 만들라는 의미입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה는 신명 ‘야훼’를 가리킵니다.
    reason: theological_note
