  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָל מוֹאָב֙ שָֽׁמְע֔וּ כִּֽי עָל֥וּ הַ/מְּלָכִ֖ים לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִּצָּעֲק֗וּ מִ/כֹּ֨ל חֹגֵ֤ר חֲגֹרָה֙ וָ/מַ֔עְלָ/ה וַ/יַּעַמְד֖וּ עַֽל הַ/גְּבֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/021.yaml
  text: Now all Moab heard that the kings had come up to fight against them[a], and they were summoned together, from every man old enough to put on a belt and upward[b], and they stood at the border.
  footnotes:
  - marker: a
    text: Hebrew literally, 'from every one girding a belt and upward,' an idiom for those of military age and older.
    reason: cultural_note
  - marker: b
    text: Or 'they were called together' / 'they were mustered.' The Hebrew verb here likely refers to mobilization rather than simply crying out.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 온 모압이 왕들이 자기들을 치러 올라왔다는 것을 들었고, 그들은 벨트를 맬 수 있는 나이부터 그 위의 사람들까지 모두 함께 소집되었으며, 그들은 경계에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘허리띠를 띠는 자 하나하나와 그 위’라는 관용구로, 군사 연령대와 그 이상의 사람들을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָל מוֹאָב
  english_pob_choice: Now all Moab
  chosen_korean: 이제 온 모압
  alternatives_korean:
  - 그리고 온 모압
  - 온 모압 전체가
  lexicon: HALOT
  rationale: 모압을 집합명사로 이해해 민족 전체를 가리키는 표현을 살리고, 서술 시작의 와우는 자연스러운 서술 연결로 처리했습니다.
- source_word: וַיִּצָּעֲקוּ
  english_pob_choice: they were summoned together
  chosen_korean: 그들은 … 모두 함께 소집되었으며
  alternatives_korean:
  - 그들은 함께 불려 모였으며
  - 그들은 징집되었으며
  - 그들은 함께 모였으며
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘외침’이 아니라 전시 동원/소집의 의미가 강하므로, 군사적 동원을 드러내는 ‘소집되다’를 택했습니다.
- source_word: מִכֹּל חֹגֵר חֲגֹרָה וָמַעְלָה
  english_pob_choice: from every man old enough to put on a belt and upward
  chosen_korean: 벨트를 맬 수 있는 나이부터 그 위의 사람들까지
  alternatives_korean:
  - 허리띠를 맬 수 있는 사람부터 그 위까지
  - 허리띠를 띠는 사람부터 그 위까지
  - 전투 가능한 나이부터 그 위의 사람들까지
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지(‘허리띠를 띠는 자’)를 한국어에서 이해 가능하도록 살리되, 병역 가능 연령의 의미가 드러나게 옮겼습니다.
- source_word: וַיַּעַמְדוּ עַל הַגְּבוּל
  english_pob_choice: and they stood at the border
  chosen_korean: 그들은 경계에 섰습니다
  alternatives_korean:
  - 그들은 국경에 섰습니다
  - 그들은 변방에 섰습니다
  - 그들은 경계선에 섰습니다
  lexicon: HALOT
  rationale: ‘경계’는 גבול의 경계/국경 의미를 포괄하면서도 군사적 대치 상황을 자연스럽게 드러냅니다.
