    rationale: 히브리어 관용구가 가리키는 기준 연령과 그 이상의 범위를 ‘허리띠를 두를 수 있는 나이의 사람부터 그보다 나이가 많은 사람까지’로 옮기면 의미가 더 명료합니다.
