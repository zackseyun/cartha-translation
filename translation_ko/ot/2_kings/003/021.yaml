- from: 이제 온 모압이 왕들이 자기들을 치러 올라왔다는 것을 들었고, 그들은 벨트를 맬 수 있는 나이부터 그 위의 사람들까지 모두 함께 소집되었으며, 그들은 경계에 섰습니다.[a]
  to: 온 모압이 왕들이 그들을 치러 올라왔다는 소식을 듣고, 허리띠를 두를 수 있는 나이의 사람부터 그보다 나이가 많은 사람까지[a] 소집되어 경계에 섰습니다.
  rationale: 명시되지 않은 ‘이제’를 삭제하고, 군사 연령을 가리키는 히브리어 관용구를 현대 표준 한국어로 자연스럽게 다듬었습니다. 수동적 소집과 경계에 선 행동의 순서는 유지했으며, 각주를 해당 관용구에 직접 연결했습니다.
