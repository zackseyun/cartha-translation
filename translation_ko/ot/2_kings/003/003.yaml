source:
  edition: WLC
  text: רַ֠ק בְּ/חַטֹּ֞אות יָרָבְעָ֧ם בֶּֽן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל דָּבֵ֑ק לֹא סָ֖ר מִמֶּֽ/נָּה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/003.yaml
  text: Only[a], he clung to the sins of Jeroboam son of Nebat, with which he caused Israel to sin; he did not turn away from them.
  footnotes:
  - marker: a
    text: Or 'which made Israel sin' / 'with which he led Israel into sin.' The Hebrew causative verb means Jeroboam's actions brought Israel into sin.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 그는 느밧의 아들 여로보암이 이스라엘을 죄짓게 한[a] 그 죄들을 고수하였으며, 그것들에서 돌아서지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 죄에 빠뜨린’입니다. 히브리어 사역 동사는 여로보암의 행위가 이스라엘로 하여금 죄를 짓게 했음을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그러나
  lexicon: HALOT
  rationale: 이전의 평가를 제한하는 예외 표지로서 간결하게 처리했습니다.
- source_word: בְּחַטֹּאות
  english_pob_choice: to the sins
  chosen_korean: 죄들에
  alternatives_korean:
  - 죄들 속에
  - 죄들과 함께
  lexicon: HALOT
  rationale: דבק와 함께 ‘~에 매달리다’가 가장 자연스럽고, 단순한 위치가 아니라 지속적 집착을 드러냅니다.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: by which he caused Israel to sin
  chosen_korean: 그것으로 그가 이스라엘을 죄짓게 하였으며
  alternatives_korean:
  - 그것으로 이스라엘을 죄에 빠뜨렸으며
  - 그것으로 이스라엘을 죄로 이끌었으며
  lexicon: HALOT
  rationale: 히필 동사의 사역적 의미를 살려, 단순한 ‘실수’가 아니라 이스라엘을 실제로 죄짓게 한 행위를 분명히 했습니다.
- source_word: לֹא סָר מִמֶּנָּה
  english_pob_choice: he did not turn away from them
  chosen_korean: 거기서 돌아서지 않았습니다
  alternatives_korean:
  - 그것들에서 떠나지 않았습니다
  - 그것들로부터 물러서지 않았습니다
  lexicon: HALOT
  rationale: 관용구의 방향성을 살리되 현대 한국어에서 자연스럽게 ‘돌아서다’로 옮겼습니다. 앞의 ‘죄들’을 가리키는 반복을 피하기 위해 ‘거기서’로 받았습니다.
theological_decisions:
- issue: 여로보암의 죄에 대한 신명기적 평가를 약화하지 않을 것
  chosen_reading: ‘죄들’, ‘죄짓게 하였으며’처럼 분명한 도덕·신학적 어휘를 유지했습니다.
  alternative_readings:
  - ‘행위들’
  - ‘잘못’
  rationale: 본문은 단순한 정치적 평가가 아니라 여로보암의 우상숭배적 죄를 정면으로 규정하는 서술이므로, 이를 완화하지 않는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 신명기적 역사서의 왕 평가 공식
