  text: Now Mesha king of Moab was a sheep breeder[a], and he used to pay the king of Israel a tribute of one hundred thousand lambs and the wool of one hundred thousand rams.
  footnotes:
  - marker: a
    text: Hebrew literally, 'one hundred thousand rams, wool.' The phrase is elliptical; it may mean 'one hundred thousand rams with wool' or, more likely in context, 'the wool of one hundred thousand rams.'
