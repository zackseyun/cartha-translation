  text: 이제 모압 왕 메사는 양을 기르는 사람이었습니다[a]. 그는 이스라엘 왕에게 해마다 십만 마리의 어린 양과 십만 마리 숫양의 털을 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
