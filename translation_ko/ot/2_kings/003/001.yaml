translation:
  language: ko
  text: 아합의 아들 여호람[a]은 유다 왕 여호사밧이 유다 왕으로 있은 지 열여덟째 해에 사마리아에서 이스라엘의 왕이 되었으며, 열두 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 직역하면, “그리고 아합의 아들 여호람은 …” 히브리어 접속사는 단순히 “그리고”로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִ/יהוֹרָם
  english_pob_choice: Now Jehoram
  chosen_korean: 여호람[a]은
  alternatives_korean:
  - 그리고 여호람은
  - 이제 여호람은
  lexicon: HALOT
  rationale: 서두의 접속사 ו를 한국어에서는 자연스럽게 생략하고, 인명은 음역하여 문장 흐름을 살렸습니다.
- source_word: מָלַךְ עַל יִשְׂרָאֵל בְּ/שֹׁמְר֔וֹן
  english_pob_choice: became king over Israel in Samaria
  chosen_korean: 사마리아에서 이스라엘의 왕이 되었습니다
  alternatives_korean:
  - 이스라엘을 다스리기 시작했습니다, 사마리아에서
  - 사마리아에서 이스라엘 위에 왕이 되었습니다
  lexicon: HALOT
  rationale: מָלַךְ는 즉위 동작으로 보아 '왕이 되었습니다'로 옮겼고, בְּשֹׁמְרוֹן은 통치 중심지를 나타내므로 '사마리아에서'로 처리했습니다.
- source_word: בִּ/שְׁנַת שְׁמֹנֶ֣ה עֶשְׂרֵ֔ה לִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה
  english_pob_choice: in the eighteenth year of Jehoshaphat king of Judah
  chosen_korean: 유다 왕 여호사밧의 십팔 년에
  alternatives_korean:
  - 유다 왕 여호사밧의 제십팔 년에
  - 유다 왕 여호사밧 통치의 십팔 년에
  lexicon: HALOT
  rationale: 히브리어 왕정 연대 공식은 한국어에서도 소유격적 표현으로 자연스럽게 옮겨 연대 기준을 분명히 했습니다.
- source_word: וַ/יִּמְלֹ֖ךְ שְׁתֵּים עֶשְׂרֵ֥ה שָׁנָֽה
  english_pob_choice: and he reigned twelve years
  chosen_korean: 그는 … 십이 년 동안 다스렸습니다
  alternatives_korean:
  - 그는 십이 년 동안 통치했습니다
  - 그는 십이 년 동안 왕으로 있었습니다
  lexicon: HALOT
  rationale: משך 통치 기간을 나타내는 וַיִּמְלֹךְ는 지속적 통치를 뜻하므로 '다스렸습니다'로 옮겨 의미를 분명히 했습니다.
theological_decisions:
- issue: 연대 서술의 문장 구조
  chosen_reading: 즉위와 재위 기간을 두 절로 구분해, 첫 절은 즉위 사건, 둘째 절은 통치 기간으로 읽었습니다.
  alternative_readings:
  - 두 절을 모두 단순한 과거 서술로 합쳐 읽기
  - 첫 절의 מָלַךְ도 재위 기간으로 읽기
  rationale: 히브리어에서는 같은 동사 어근이 문맥에 따라 즉위와 재위를 구별해 쓰이므로, 본문이 전달하는 왕정 연대표를 유지하는 쪽이 더 정확합니다.
  doctrine_reference: 역사 서술의 문법적-문맥적 구분
