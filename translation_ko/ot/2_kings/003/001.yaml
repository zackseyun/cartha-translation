  text: Now Jehoram son of Ahab became king over Israel in Samaria in the eighteenth year of Jehoshaphat king of Judah[a], and he reigned twelve years.
  footnotes:
  - marker: a
    text: Or, more formally, 'And Jehoram son of Ahab became king over Israel…' The Hebrew conjunction can be rendered simply as 'and.'
