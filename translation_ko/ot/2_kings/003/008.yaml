lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그러자 그가 말했습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서도 히브리어 wayyiqtol의 단순한 연속 서술을 과장하지 않도록 평서형 과거로 옮겼습니다.
- source_word: אֵי זֶה הַדֶּרֶךְ
  english_pob_choice: Which way shall we go up?
  chosen_korean: 어느 길로 우리가 올라가겠습니까?
  alternatives_korean:
  - 어느 길을 우리가 올라가겠습니까?
  - 어느 길로 올라가겠습니까?
  lexicon: HALOT
  rationale: אֵי זֶה는 여기서 ‘어느’가 가장 자연스럽고, הַדֶּרֶךְ는 질문에서는 ‘길로’가 한국어 표현으로 더 유연하여 선택했습니다.
- source_word: נַעֲלֶה
  english_pob_choice: shall we go up
  chosen_korean: 올라가겠습니까
  alternatives_korean:
  - 올라가야 하겠습니까
  - 올라가겠습니까요
  lexicon: HALOT
  rationale: עלה의 이동/상행 의미를 직접 살려 ‘올라가다’로 옮겼고, 공동체적 질문의 뉘앙스를 위해 1인칭 복수 미래 의향형으로 처리했습니다.
- source_word: דֶּרֶךְ מִדְבַּר אֱדוֹם
  english_pob_choice: By the way of the wilderness of Edom
  chosen_korean: 에돔 광야의 길
  alternatives_korean:
  - 에돔 광야를 통한 길
  - 에돔의 광야 길
  lexicon: HALOT
  rationale: 답변은 길 자체를 지정하는 형태이므로 ‘~의 길’로 압축했고, מִדְבָּר는 이 문맥에서 ‘광야’가 한국어 성경 용례에 가장 잘 맞습니다.
