  naturalness: ‘어느 길로 우리가 올라가겠습니까?’도 이해되지만, 한국어의 주어 생략과 종결어미에 이미 포함된 1인칭 복수 의미를 따라 ‘어느 길로 올라가겠습니까?’가 현대 표준어 합쇼체로 더 자연스럽습니다. ‘에돔 광야의 길입니다’는 소유·귀속 관계가 다소 부자연스럽게 들릴 수 있습니다.
  terminology: ‘광야’와 ‘에돔’은 성경 문맥 및 고유명사 표기에 적절합니다. ‘올라가다’는 군사적 의미를 불필요하게 덧붙이지 않으면서 원문의 עלה를 보존합니다.
