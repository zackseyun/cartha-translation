  text: And in the morning[a], at the offering up of the grain offering, behold, water came from the direction of Edom[c][b], and the land was filled with water.
  footnotes:
  - marker: a
    text: Or 'when the grain offering was offered.' The Hebrew literally says 'at the going up of the grain offering,' using sacrificial language for its presentation on the altar.
    reason: lexical_alternative
  - marker: b
    text: Or 'from the way of Edom' / 'by way of Edom.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the land was filled with the water'; English may also be rendered more idiomatically, 'the land was filled with water.'
    reason: lexical_alternative
translation:
