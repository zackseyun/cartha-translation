  text: וַ/יֹּ֖אמֶר מֶ֣לֶךְ יִשְׂרָאֵ֑ל אֲהָ֕הּ כִּֽי קָרָ֣א יְהוָ֗ה לִ/שְׁלֹ֨שֶׁת֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה לָ/תֵ֥ת אוֹתָ֖/ם בְּ/יַד מוֹאָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/010.yaml
  text: Then the king of Israel said[b][a], “Alas! Yahweh has called these three kings to give them into the hand of Moab.”
  footnotes:
  - marker: a
    text: Or “has summoned”; the Hebrew verb is literally “called.”
    reason: lexical_alternative
  - marker: b
    text: “Into the hand of Moab” is a Hebrew idiom meaning “into Moab’s power.”
    reason: cultural_note
translation:
  language: ko
  text: 그러자 이스라엘 왕이 말했습니다. 「아아! 야훼께서 이 세 왕을 모압의 손에 넘기려고 부르셨구나!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘불렀다’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모압의 손에’는 ‘모압의 권세 아래에’라는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: BDB
  rationale: 와우 연속형의 서술 진행을 자연스러운 한국어 연결로 옮기되, 사건의 순서를 분명히 유지했습니다.
- source_word: אֲהָהּ
  english_pob_choice: Alas!
  chosen_korean: 아아!
  alternatives_korean:
  - 슬프도다!
  - 아!
  lexicon: BDB
  rationale: 탄식과 당혹을 나타내는 감탄사로, 문어체에서 무게를 유지하면서도 과도하게 교회적이지 않게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 고유신명사 יְהוָה를 주어 표현으로 바꾸지 않고 프로젝트 기본값인 ‘야훼’로 옮겼습니다.
- source_word: לָתֵת ... בְּיַד
  english_pob_choice: to give ... into the hand of
  chosen_korean: '...의 손에 넘기려고'
  alternatives_korean:
  - '...의 손에 주려고'
  - '...에게 넘겨주려고'
  lexicon: HALOT
  rationale: ‘손에’라는 히브리 관용구의 핵심은 유지하되, 한국어에서는 ‘넘기다’가 처분·지배 아래로 넘김의 의미를 더 분명히 드러냅니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘여호와’
  - ‘주님’
  rationale: 본문이 하나님의 언약적 고유명을 직접 사용하므로, 직함이 아니라 이름 자체를 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘부르셨다’의 의미
  chosen_reading: ‘부르셨구나’로 옮겨 왕의 해석적 탄식을 살렸습니다.
  alternative_readings:
  - ‘소집하셨구나’
  - ‘불러 모으셨구나’
  rationale: 히브리어 קָרָא의 기본 의미인 ‘부르다/호출하다’를 유지하면서, 왕이 사태를 비관적으로 해석하는 뉘앙스를 한국어 감탄형으로 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
