base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/022.yaml
  text: They rose early in the morning[a], and the sun shone on the water; and Moab saw the water opposite them, red like blood.
  footnotes:
  - marker: a
    text: Or 'the Moabites saw the water across from them.' The Hebrew uses 'Moab' collectively for the people of Moab, and the spatial phrase can be rendered 'opposite them' or 'across from them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아침 일찍 일어났습니다[a]. 해가 물 위에 비치자, 모압은 자기들 맞은편의 물이 피처럼 붉은 것을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘모압 사람들이 자기들 맞은편의 물을 보았습니다.’ 히브리어는 ‘모압’을 집합적으로 사용하며, 공간 구문은 ‘맞은편’이나 ‘건너편’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַּבֹקֶר
  english_pob_choice: They rose early in the morning
  chosen_korean: 그들은 아침 일찍 일어났습니다
  alternatives_korean:
  - 그들은 새벽에 일어났습니다
  - 그들은 아침에 일찍 일어났습니다
  lexicon: HALOT
  rationale: שׁכם의 전형적 의미인 ‘일찍 일어나다’를 자연스러운 현대 한국어로 옮겼고, בַּבֹקֶר의 시간 부사도 함께 살렸습니다.
- source_word: וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם
  english_pob_choice: and the sun shone on the water
  chosen_korean: 해가 물 위에 비치자
  alternatives_korean:
  - 해가 물 위에 빛나자
  - 해가 물 위로 떠오르자
  lexicon: HALOT
  rationale: 문맥상 단순한 일출보다 물에 닿아 시각적 효과를 내는 ‘비치다’가 더 정확하여, 결과절 흐름도 살렸습니다.
- source_word: מוֹאָב מִנֶּגֶד אֶת הַמַּיִם
  english_pob_choice: Moab saw the water opposite them
  chosen_korean: 모압은 자기들 맞은편의 물이
  alternatives_korean:
  - 모압 사람들은 맞은편의 물을
  - 모압이 그들 맞은편의 물을
  lexicon: HALOT
  rationale: מוֹאָב을 집합명사처럼 ‘모압’으로 유지했고, מִנֶּגֶד는 공간 관계를 살려 ‘맞은편’으로 옮겼습니다.
- source_word: אֲדֻמִּים כַּדָּם
  english_pob_choice: red like blood
  chosen_korean: 피처럼 붉은
  alternatives_korean:
  - 붉어 피 같았던
  - 피 같은 붉은
  lexicon: HALOT
  rationale: 색채 형용사 ‘붉은’과 비교구문 ‘피처럼’으로 히브리어의 생생한 비유를 직접적으로 보존했습니다.
theological_decisions:
- issue: מֹאָב의 집합적 용법을 어떻게 처리할지
  chosen_reading: 개별 인명처럼 보이지 않도록 ‘모압’이 집단 전체를 가리키는 것으로 읽었습니다.
  alternative_readings:
  - ‘모압 사람들’로 명시적으로 풀어 쓸 수 있습니다.
  rationale: 히브리어 원문은 민족명을 단수 형태로 집합적으로 사용하므로, 본문 감각을 살리면서도 오해를 줄이기 위해 ‘모압’을 유지했습니다.
  doctrine_reference: 서술적 집합명사 사용에 대한 번역 원칙
- issue: 시각적 묘사의 순서를 유지할지
  chosen_reading: ‘해가 물 위에 비치자’ 다음에 곧바로 ‘모압은… 보았습니다’로 이어지게 하여 원문의 장면 전개를 보존했습니다.
  alternative_readings:
  - 원인-결과를 더 풀어 설명하는 방식
  rationale: 본문의 신학적 초점은 기적의 해설보다 관찰된 장면의 선명함에 있으므로, 서술 순서를 최대한 유지하는 편이 적절합니다.
  doctrine_reference: 문맥 우선의 서사 번역 원칙
