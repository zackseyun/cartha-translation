review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 ‘에돔 왕에게 돌파하려’는 한국어에서 돌파의 방향·대상을 부자연스럽게 결합하며, אֶל의 방향성과 군사적 적대 가능성을 충분히 드러내지 못합니다. ‘전쟁이 자기보다 너무 강하다’도 원문의 압도적 전세를 한국어답게 표현하지 못합니다.
  naturalness: 합쇼체 종결은 적절합니다. 그러나 ‘전쟁이 자기보다 너무 강하다’, ‘칼을 뽑는 사람’, ‘에돔 왕에게 돌파하다’, ‘그들은 할 수 없었습니다’는 이 문맥에서 다소 직역투이거나 목적어가 생략되어 어색합니다.
  terminology: ‘모압 왕’, ‘에돔 왕’, ‘칼’, ‘돌파’는 적절합니다. שֹׁלֵף חֶרֶב은 전투 준비가 된 상태를 나타내므로 ‘칼을 뽑아 든 사람들’이 자연스럽고 충실합니다.
  issues:
  - severity: medium
    issue: ‘전쟁이 자기보다 너무 강하다’는 한국어 표현이 부자연스럽습니다.
    rationale: חָזַק מִמֶּנּוּ הַמִּלְחָמָה는 전투가 왕을 압도하거나 그에게 감당하기 어려운 상태임을 뜻합니다. ‘전투가 자신을 압도하고 있음을’은 그 의미를 자연스러운 한국어로 보존합니다.
  - severity: medium
    issue: ‘에돔 왕에게 돌파하려’는 ‘돌파하다’의 통상적 결합에 맞지 않습니다.
    rationale: לְהַבְקִיעַ אֶל은 에돔 왕의 위치 또는 진영을 향해 돌파하려는 시도를 가리킵니다. ‘에돔 왕 쪽으로 돌파하려’가 방향성을 유지하며 자연스럽습니다. 적대적 방향이라는 가능성은 각주로 보존합니다.
  - severity: low
