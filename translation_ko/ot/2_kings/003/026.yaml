id: 2KI.3.26
reference: 2 Kings 3:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּרְא֙ מֶ֣לֶךְ מוֹאָ֔ב כִּֽי חָזַ֥ק מִמֶּ֖/נּוּ הַ/מִּלְחָמָ֑ה וַ/יִּקַּ֣ח א֠וֹת/וֹ שְׁבַע מֵא֨וֹת אִ֜ישׁ שֹׁ֣לֵֽף חֶ֗רֶב לְ/הַבְקִ֛יעַ אֶל מֶ֥לֶךְ אֱד֖וֹם וְ/לֹ֥א יָכֹֽלוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/003/026.yaml
  text: When the king of Moab saw that the battle was too strong for him[a], he took with him seven hundred men who drew the sword to break through to the king of Edom, but they could not.
  footnotes:
  - marker: a
    text: Or 'to break through against the king of Edom.' The Hebrew preposition can be understood as directional ('to/toward') or hostile ('against') in this military context.
    reason: alternative_reading
translation:
  language: ko
  text: 모압 왕은 전투가 자신을 압도하고 있음을 보고, 칼을 뽑아 든 사람 칠백 명을 데리고 에돔 왕 쪽으로 돌파하려 하였으나, 그들은 돌파하지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 אֶל은 이 군사적 문맥에서 ‘~에게/향하여’라는 방향뿐 아니라 ‘~을 향해 적대적으로’라는 뜻으로도 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: חָזַק מִמֶּנּוּ הַמִּלְחָמָה
  english_pob_choice: the battle was too strong for him
  chosen_korean: 전쟁이 자기보다 너무 강하다는 것
  alternatives_korean:
  - 전쟁이 그를 압도하고 있다는 것
  - 전쟁이 그보다 더 강하다는 것
  lexicon: HALOT
  rationale: ‘חָזַק’의 강세/우세 의미를 살리되, 현대 한국어에서는 ‘너무 강하다’가 군사적 열세를 자연스럽게 드러냅니다.
- source_word: וַיִּקַּח אֹתוֹ
  english_pob_choice: he took with him
  chosen_korean: 데리고
  alternatives_korean:
  - 함께 데리고
  - 그와 함께 데리고
  lexicon: HALOT
  rationale: 히브리어의 목적어 표지는 문자적으로 ‘그것/그를’이지만, 문맥상 ‘데리고’가 동행의 의미를 가장 직접적으로 전달합니다.
- source_word: שֹׁלֵף חֶרֶב
  english_pob_choice: who drew the sword
  chosen_korean: 칼을 뽑는 사람
  alternatives_korean:
  - 칼을 뽑아 든 사람
  - 칼을 차고 있는 사람
  lexicon: HALOT
  rationale: ‘칼을 뽑다’가 히브리어의 전투 준비 이미지를 가장 가깝게 보존하며, ‘사람’은 שְׁבַע מֵאוֹת אִישׁ의 집계 명사를 반영합니다.
- source_word: לְהַבְקִיעַ אֶל מֶלֶךְ אֱדוֹם
  english_pob_choice: to break through to the king of Edom
  chosen_korean: 에돔 왕에게 돌파하려
  alternatives_korean:
  - 에돔 왕 쪽으로 돌파하려
  - 에돔 왕을 향해 뚫고 나가려
  lexicon: HALOT
  rationale: לְהַבְקִיעַ의 ‘돌파하다’ 의미를 살리고, אֶל의 방향성을 유지해 ‘에게’로 옮겼습니다.
- source_word: וְלֹא יָכֹלוּ
  english_pob_choice: but they could not
  chosen_korean: 그들은 할 수 없었습니다
  alternatives_korean:
  - 그러나 성공하지 못했습니다
  - 하지만 그들은 돌파하지 못했습니다
  lexicon: HALOT
  rationale: 짧은 실패 진술을 한국어의 자연스러운 종결형으로 옮기면서, 실패의 결과를 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: 전투의 주어와 열세 표현
  chosen_reading: ‘전쟁이 자기보다 너무 강하다’로 옮겨, מלחמה가 왕을 압도하는 상황 자체를 드러냈습니다.
  alternative_readings:
  - ‘전쟁이 그를 이겼다’
  - ‘전쟁이 그보다 강해졌다’
  rationale: 본문은 단순한 패배 선언보다 전투의 압도적 우세를 말하므로, 그 긴장을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: '서사 본문 해석 원칙: 인물의 상황을 과장 없이, 그러나 분명하게 전달해야 합니다.'
