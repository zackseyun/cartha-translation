theological_decisions:
- issue: 이 구절의 반역 행위가 단순한 외교적 독립 선언인지, 종주권에 대한 정치적 반역인지
  chosen_reading: 모압 왕의 행동을 이스라엘 왕에 대한 정치적 반역으로 번역했습니다.
  alternative_readings:
  - 독립을 선언하였습니다
  - 이스라엘에 맞서 일어났습니다
  rationale: 히브리어 פשע는 여기서 종속 관계를 깨는 정치적 반역을 가리키므로, 원문이 가진 봉신-종주 의미를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 역사 서술의 정치적·언약적 구분 유지
