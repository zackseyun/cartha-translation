  lexicon: HALOT
  rationale: 히브리어의 관용적 결합을 반영하면서, 한국어에서는 오해를 줄이기 위해 ‘조상들’로 자연스럽게 옮겼습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 통치하기 시작했습니다
  lexicon: HALOT
  rationale: 이 동사는 통치 기간보다 즉위를 가리키므로, 왕위 계승의 순간을 분명히 드러내는 표현을 선택했습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 후계자 교체를 나타내는 문맥이므로, 왕위 승계를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 죽음을 직접 서술하지 않는 관용구 처리
  chosen_reading: 본문의 관용구를 그대로 살려 ‘자고’로 번역했습니다.
  alternative_readings:
  - ‘죽었습니다’로 해석적으로 번역
  rationale: 히브리어는 전형적인 왕의 사망 공식만 사용하며, 이 절 자체는 매장 여부를 말하지 않습니다. 원문 표현의 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
