base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/006.yaml
  text: And Jehoiakim slept with his fathers[a], and Jehoiachin his son became king in his place.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'died.' The Hebrew literally says 'slept with his fathers,' a standard formula for a king's death.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야김이 그의 조상들과 함께 자고, 그의 아들 여호야긴이 그를 대신하여 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 조상들과 함께 자고’입니다. 이는 왕의 죽음을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 자고
  alternatives_korean:
  - 잠들고
  - 죽고
  lexicon: HALOT
  rationale: 왕의 죽음을 가리키는 관용구를 한국어로도 직접 살리되, ‘죽고’로 해석을 앞서지 않기 위해 ‘자고’로 옮겼습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 히브리어의 관용적 결합을 반영하면서, 한국어에서는 오해를 줄이기 위해 ‘조상들’로 자연스럽게 옮겼습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 통치하기 시작했습니다
  lexicon: HALOT
  rationale: 이 동사는 통치 기간보다 즉위를 가리키므로, 왕위 계승의 순간을 분명히 드러내는 표현을 선택했습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그의 자리에
  - 그 뒤를 이어
  lexicon: HALOT
  rationale: 후계자 교체를 나타내는 문맥이므로, 왕위 승계를 자연스럽게 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 왕의 죽음을 직접 서술하지 않는 관용구 처리
  chosen_reading: 본문의 관용구를 그대로 살려 ‘자고’로 번역했습니다.
  alternative_readings:
  - ‘죽었습니다’로 해석적으로 번역
  rationale: 히브리어는 전형적인 왕의 사망 공식만 사용하며, 이 절 자체는 매장 여부를 말하지 않습니다. 원문 표현의 긴장을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy over translation tradition; Preserve theological tension rather than resolve it.'
