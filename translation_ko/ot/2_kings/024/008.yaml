  text: Jehoiachin was eighteen years old when he began to reign[a], and he reigned three months in Jerusalem. His mother’s name was Nehushta daughter of Elnathan, from Jerusalem.
  footnotes:
  - marker: a
    text: Or “of Jerusalem” at the end, reflecting a more idiomatic genealogical expression; the Hebrew more literally says “from Jerusalem.”
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야긴은 왕이 되었을 때 열여덟 살이었고, 예루살렘에서 석 달 동안 왕으로 다스렸습니다. 그의 어머니는 엘나단의 딸 느후스다였으며, 예루살렘 출신이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘예루살렘에서’입니다. 이는 느후스다의 출신을 가리키는 것으로 이해할 수 있으나, 엘나단과 관련된 표현으로 보는 견해도 있습니다.
    reason: lexical_alternative
