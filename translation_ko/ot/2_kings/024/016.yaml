reference: 2 Kings 24:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ כָּל אַנְשֵׁ֨י הַ/חַ֜יִל שִׁבְעַ֣ת אֲלָפִ֗ים וְ/הֶ/חָרָ֤שׁ וְ/הַ/מַּסְגֵּר֙ אֶ֔לֶף הַ/כֹּ֕ל גִּבּוֹרִ֖ים עֹשֵׂ֣י מִלְחָמָ֑ה וַ/יְבִיאֵ֧/ם מֶֽלֶךְ בָּבֶ֛ל גּוֹלָ֖ה בָּבֶֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/016.yaml
  text: And all the men of valor[a], seven thousand, and the craftsmen and the smiths[b], one thousand—all of them mighty men fit for war—the king of Babylon brought into exile to Babylon.
  footnotes:
  - marker: a
    text: Or 'the artisans and the metalworkers.'
    reason: lexical_alternative
  - marker: b
    text: Literally 'doers of war,' that is, men capable of military service.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론 왕은 용맹한 자들 칠천 명과 기술자들[a]과 대장장이들 천 명, 곧 모두 전쟁을 수행할 수 있는 용사들[b]을 포로로 바빌론에 끌고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘장인들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘전쟁을 하는 자들’이며, 곧 전투를 수행할 수 있는 사람들을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הַחַיִל
  english_pob_choice: men of valor
  chosen_korean: 용맹한 자들
  alternatives_korean:
  - 용사들
  - 무용한 자들
  lexicon: HALOT
  rationale: 전투에 유능한 사람들을 가리키는 관용구이므로, 군사적 역량을 드러내는 자연스러운 표현으로 옮겼습니다.
- source_word: הֶחָרָשׁ
  english_pob_choice: the craftsmen
  chosen_korean: 기술자들
  alternatives_korean:
  - 장인들
  - 공예가들
  lexicon: HALOT
  rationale: 문맥상 특정 공정에 한정되지 않는 숙련 노동자를 가리키므로, 넓은 의미를 살린 표현을 택했습니다.
- source_word: הַמַּסְגֵּר
  english_pob_choice: the smiths
  chosen_korean: 대장장이들
  alternatives_korean:
  - 금속 세공인들
  - 금속공들
  lexicon: HALOT
  rationale: 이 어휘는 금속을 다루는 사람들을 가리키는 것으로 이해되므로, 한국어에서 가장 바로 대응되는 직능 명칭을 사용했습니다.
- source_word: עֹשֵׂי מִלְחָמָה
  english_pob_choice: fit for war
  chosen_korean: 전쟁에 능한 사람들이었습니다
  alternatives_korean:
  - 전쟁을 할 수 있는 사람들이었습니다
  - 전쟁에 익숙한 사람들이었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘전쟁을 하는 자들’이지만, 관용적 의미는 전투 수행 능력이 있으므로 그 뜻을 풀어 자연스럽게 반영했습니다.
theological_decisions:
- issue: 포로 이동의 서술 방식
  chosen_reading: ‘포로로 바빌론으로 끌고 갔습니다’라고 옮겨, 단순한 이동이 아니라 강제 이주와 포로화의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - ‘바빌론으로 데려갔습니다’
  - ‘바빌론으로 옮겼습니다’
  rationale: 본문의 וַיְבִיאֵם는 문맥상 바빌론 유수의 강제성을 담고 있으므로, 그 역사적·신학적 무게를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 역사서의 포로기 서술
- issue: ‘칠천’과 ‘천’의 합산 구조
  chosen_reading: 두 집단을 구분해 제시하고, 뒤의 총괄 표현을 ‘곧 모두…’로 풀어 합산과 설명 관계를 분명히 했습니다.
  alternative_readings:
  - 직역형으로 병렬만 두는 방식
  - ‘총 팔천 명’으로 합산하는 방식
  rationale: 히브리어는 두 집단을 나열한 뒤 전체를 요약하므로, 원문의 구조를 유지하면서 한국어 독자가 관계를 쉽게 파악하도록 했습니다.
  doctrine_reference: 본문 구조 보존 원칙
