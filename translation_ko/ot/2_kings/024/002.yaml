- from: 야훼께서 그에게 갈대아 사람들의 무리와 아람 사람들의 무리와 모압 사람들의 무리와 암몬 자손의 무리들을 보내셨습니다. 그분은 그들을 유다를 향해 보내셔서 그것을 파괴하셨으니, 이는 야훼께서 자기의 종들인 예언자들을 통해 말씀하신 야훼의 말씀대로였습니다.[a][b]
