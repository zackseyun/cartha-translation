id: 2KI.24.2
reference: 2 Kings 24:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְשַׁלַּ֣ח יְהוָ֣ה בּ֡/וֹ אֶת גְּדוּדֵ֣י כַשְׂדִּים֩ וְ/אֶת גְּדוּדֵ֨י אֲרָ֜ם וְ/אֵ֣ת גְּדוּדֵ֣י מוֹאָ֗ב וְ/אֵת֙ גְּדוּדֵ֣י בְנֵֽי עַמּ֔וֹן וַ/יְשַׁלְּחֵ֥/ם בִּֽ/יהוּדָ֖ה לְ/הַֽאֲבִיד֑/וֹ כִּ/דְבַ֣ר יְהוָ֔ה אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עֲבָדָ֥י/ו הַ/נְּבִיאִֽים׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/002.yaml
  text: And Yahweh sent against him bands of the Chaldeans[a], bands of Aram, bands of Moab, and bands of the Ammonites; he sent them against Judah to destroy it[c][b], according to the word of Yahweh that he had spoken by his servants the prophets.
  footnotes:
  - marker: a
    text: Or, 'to destroy him,' referring to Jehoiakim rather than Judah.
    reason: alternative_reading
  - marker: b
    text: Hebrew 'Aram'; traditionally 'Syria.'
    reason: lexical_alternative
  - marker: c
    text: Or 'raiding bands' for 'bands.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그에게 갈대아 사람들의 무리와 아람 사람들의 무리와 모압 사람들의 무리와 암몬 자손의 무리들을 보내셨습니다. 그분은 그들을 유다를 향해 보내셔서 그것을 파괴하셨으니, 이는 야훼께서 자기의 종들인 예언자들을 통해 말씀하신 야훼의 말씀대로였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다를 향해’는 히브리어 בִּיהוּדָה의 직역 가능성을 반영한 것입니다.
    reason: source_note
  - marker: b
    text: ‘그것을’은 유다를 가리키는 읽기이며, ‘그를’로도 읽을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본값에 따라 신명은 학술적 음역인 ‘야훼’로 옮겨, 본문과 주석에서 동일 표기를 유지했습니다.
- source_word: גְּדוּדֵי
  english_pob_choice: bands
  chosen_korean: 무리
  alternatives_korean:
  - 습격대
  - 대
  lexicon: HALOT
  rationale: 여기서는 정규 군대보다 소규모의 약탈·기동 집단을 가리키므로, 한국어로는 중립적이면서도 소규모 집단감을 살린 ‘무리’가 적절합니다.
- source_word: כַשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 바벨론 사람들
  lexicon: HALOT
  rationale: 히브리어 고유어를 따라 ‘갈대아 사람들’로 유지해, 역사적 연관은 있더라도 본문 자체의 표층을 보존했습니다.
- source_word: עֲבָדָיו הַנְּבִיאִים
  english_pob_choice: his servants the prophets
  chosen_korean: 자기의 종들인 예언자들
  alternatives_korean:
  - 자기의 종들인 선지자들
  - 예언자인 자기의 종들
  lexicon: HALOT
  rationale: עֲבָדִים은 여기서 예언자들의 소명적 종속을 가리키므로 ‘종들’을 유지했고, הַנְּבִיאִים은 현대 한국어에 맞춰 ‘예언자들’로 옮겼습니다.
- source_word: לְהַאֲבִידוֹ
  english_pob_choice: to destroy it
  chosen_korean: 그것을 파괴하셨으니
  alternatives_korean:
  - 그를 파괴하셨으니
  - 멸망시키셨으니
  lexicon: HALOT
  rationale: 영어 POB의 본문 읽기와 같이 지시 대상은 집합적 ‘유다’로 보아 ‘그것’을 사용했고, 파괴/멸망 계열 중에서는 본문의 강한 심판 의미를 드러내는 ‘파괴하다’를 택했습니다.
theological_decisions:
- issue: לְהַאֲבִידוֹ의 목적어 지시 대상
  chosen_reading: 문맥상 ‘유다’가 지시 대상이므로 ‘그것을 파괴하셨습니다’로 옮겼습니다.
  alternative_readings:
  - 여호야김을 지시하여 ‘그를 파괴하셨습니다’로 옮길 수 있습니다.
  rationale: 바로 앞에 ‘유다’가 명시되고, 이어지는 문맥 전체가 나라에 대한 심판을 강조하므로 집합명사로 이해하는 것이 가장 자연스럽습니다. 다만 히브리어 남성 단수 접미사는 인물 지시도 가능하므로, 해석의 긴장은 주석적 여지로 남겨야 합니다.
  doctrine_reference: 문법적으로 가능한 대안을 완전히 제거하지 않고, 본문 맥락이 우세한 읽기를 본문에 반영합니다.
