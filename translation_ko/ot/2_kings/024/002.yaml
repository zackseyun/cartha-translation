  rationale: 원문의 반복된 ‘보내셨습니다’를 유지하고, 군사 집단인 גדודֵי를 ‘습격대’로 구체화했습니다. בִּיהוּדָה는 ‘유다에’로 옮겨 전치사의 기본 의미를 보존하되, 앞 문장의 ‘그를 치도록’으로 적대적 방향을 자연스럽게 드러냈습니다. לְהַאֲבִידוֹ의 목적 관계는 ‘멸망시키게 하셨습니다’로 표현했으며, 목적어의 실제 문법적 모호성은 각주로 보존했습니다.
