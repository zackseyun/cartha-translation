revisions:
- from: 이는 야훼의 분노 때문이었습니다. 그래서 예루살렘과 유다에 이르러, 그분이 그들을 자기 앞에서 내쫓으실 때까지 그렇게 되었습니다. 그리고 시드기야는 바빌론 왕에게 반역했습니다.[a]
  to: 이는 야훼의 분노 때문에 예루살렘과 유다에 이런 일이 일어났고, 마침내 그분께서 그들을 그분 앞에서 내쫓으셨기 때문입니다.[a] 시드기야는 바빌론 왕에게 반역했습니다.
  rationale: ‘예루살렘과 유다에 이런 일이 일어났고’로 장소/범위 표현과 무주어 동사의 압축된 사태 묘사를 자연스러운 한국어로 옮겼습니다. ‘마침내’는 עַד(‘~할 때까지’)가 나타내는 귀결점을 드러내되, 원문의 압축된 통사 관계에 대한 단정적 해석은 피합니다. 각주 표지는 설명 대상인 첫 절 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:43Z'
