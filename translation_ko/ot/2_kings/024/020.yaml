reference: 2 Kings 24:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כִּ֣י עַל אַ֣ף יְהוָ֗ה הָיְתָ֤ה בִ/ירוּשָׁלִַ֨ם֙ וּ/בִ֣/יהוּדָ֔ה עַד הִשְׁלִכ֥/וֹ אֹתָ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו וַ/יִּמְרֹ֥ד צִדְקִיָּ֖הוּ בְּ/מֶ֥לֶךְ בָּבֶֽל׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/020.yaml
  text: For because of the anger of Yahweh it happened in Jerusalem and in Judah until he cast them out from his presence[a]. And Zedekiah rebelled against the king of Babylon.
  footnotes:
  - marker: a
    text: Or 'For the anger of the LORD was against Jerusalem and Judah, until he cast them out from before him.' The Hebrew of the first clause is compressed and may be rendered more formally this way.
    reason: alternative_reading
translation:
  language: ko
  text: 이는 야훼의 분노 때문에 예루살렘과 유다에 이런 일이 일어났고, 마침내 그분께서 그들을 그분 앞에서 내쫓으셨기 때문입니다.[a] 시드기야는 바빌론 왕에게 반역했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 압축된 첫 절은 더 형식적으로 “야훼의 분노가 예루살렘과 유다에 있었고, 그분께서 그들을 그분 앞에서 내쫓으실 때까지였다”라고도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי עַל אַף יְהוָה
  english_pob_choice: For because of the anger of Yahweh
  chosen_korean: 야훼의 분노 때문이었습니다
  alternatives_korean:
  - 야훼의 진노 때문이었습니다
  - 야훼께서 분노하신 까닭이었습니다
  lexicon: HALOT
  rationale: עַל אַף는 ‘분노/진노’의 관용구이므로, 한국어에서는 자연스러운 원인 표지인 ‘~때문’으로 옮기되 신적 분노의 강도를 살리기 위해 ‘분노’를 택했습니다.
- source_word: הָיְתָה בִירוּשָׁלִַם וּבִיהוּדָה
  english_pob_choice: it happened in Jerusalem and in Judah
  chosen_korean: 예루살렘과 유다에 이르러, ... 그렇게 되었습니다
  alternatives_korean:
  - 예루살렘과 유다에 있었습니다
  - 예루살렘과 유다에서 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 압축된 서술로 결과 상태를 말하므로, 단순한 존재 진술보다 ‘그렇게 되었습니다’로 옮겨 원문의 진행된 귀결을 살렸습니다.
- source_word: מֵעַל פָּנָיו
  english_pob_choice: from his presence
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그분의 উপস্থিত에서
  - 그분의 임재 앞에서
  lexicon: HALOT
  rationale: ‘from upon his face’는 하나님 앞에서의 추방을 가리키는 관용구이므로, 현대 한국어에서 가장 직접적인 대응인 ‘자기 앞에서’를 택했습니다.
- source_word: וַיִּמְרֹד
  english_pob_choice: rebelled
  chosen_korean: 반역했습니다
  alternatives_korean:
  - 반란을 일으켰습니다
  - 거역했습니다
  lexicon: HALOT
  rationale: מרד는 통치자에 대한 정치적·법적 반역을 뜻하므로, 단순한 불복종보다 강한 ‘반역하다’가 문맥에 맞습니다.
- source_word: צִדְקִיָּהוּ
  english_pob_choice: Zedekiah
  chosen_korean: 시드기야
  alternatives_korean:
  - 시드키야
  - 쩨드기야
  lexicon: HALOT
  rationale: 히브리어 고유명사의 통상적 한국어 음역을 따랐습니다.
theological_decisions:
- issue: יַהְוֶה의 번역
  chosen_reading: 본문의 언약명은 ‘야훼’로 직역해 신명 자체를 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 단순한 일반 호칭이 아니라 YHWH를 직접 지칭하므로, POB 표준에 따라 음역형 ‘야훼’를 유지하는 것이 स्रोत-직결적입니다.
  doctrine_reference: 'Contested terms table: יְהוָה / YHWH'
- issue: 압축된 첫 절의 인과-귀결 구조
  chosen_reading: 야훼의 분노가 예루살렘과 유다의 추방으로 귀결되었다는 뜻을 드러내되, 히브리어의 압축성을 과도하게 풀지 않았습니다.
  alternative_readings:
  - 야훼의 분노가 예루살렘과 유다에 있었다
  - 야훼의 분노가 예루살렘과 유다 위에 있었다
  rationale: 원문은 원인과 결과를 매우 압축적으로 연결하므로, ‘때문이었습니다 … 그렇게 되었습니다’로 옮겨 신적 심판의 흐름은 분명히 하되 해석을 과잉 주입하지 않았습니다.
  doctrine_reference: 'Translation philosophy #3, preserve theological tension rather than resolve it'
