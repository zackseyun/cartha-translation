  english_pob_choice: and the city came under siege
  chosen_korean: 그 성은 포위되었습니다
  alternatives_korean:
  - 그 성은 포위 상태에 들어갔습니다
  - 그 성은 포위당했습니다
  lexicon: HALOT
  rationale: 원문의 ‘포위 상태로 들어가다’라는 진입적 뉘앙스를 한국어에서 자연스럽게 살리면서도, 결과 상태를 분명히 드러내는 표현을 택했습니다.
