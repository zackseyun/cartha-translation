  rationale: 역사적 사건의 시점을 가리키는 표지로, 현대 한국어에서 자연스럽고 간결한 대응인 ‘그때에’를 선택했습니다.
- source_word: עָלָה
  english_pob_choice: came up against
  chosen_korean: 올라와서
  alternatives_korean:
