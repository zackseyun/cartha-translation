  rationale: 히브리어의 ‘올라가다/올라오다’ 관용을 살리되, 예루살렘을 향한 군사적 접근이라는 문맥을 유지하기 위해 ‘올라와서’로 옮겼습니다.
- source_word: עַבְדֵי
  english_pob_choice: servants
  chosen_korean: 종들이
