  lexicon: HALOT
  rationale: POB의 ‘servants’를 따라, 느부갓네살에게 종속된 수행자/부대를 일반화해 ‘종들’로 옮겼습니다. ‘신하들’보다 원어의 종속성을 더 직접적으로 드러냅니다.
