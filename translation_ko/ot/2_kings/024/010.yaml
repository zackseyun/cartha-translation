  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֔יא עלה עַבְדֵ֛י נְבֻכַדְנֶאצַּ֥ר מֶֽלֶךְ בָּבֶ֖ל יְרוּשָׁלִָ֑ם וַ/תָּבֹ֥א הָ/עִ֖יר בַּ/מָּצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/010.yaml
  text: At that time the servants of Nebuchadnezzar king of Babylon came up against Jerusalem[b][a], and the city came under siege.
  footnotes:
  - marker: a
    text: Or, more formally, 'went up to Jerusalem'; the Hebrew idiom 'went/came up' often reflects both elevation and military advance.
    reason: lexical_alternative
  - marker: b
    text: Or 'the city was besieged.' The Hebrew more literally says 'the city came into siege,' which may emphasize the onset of the siege.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 바빌론 왕 느부갓네살의 종들이 예루살렘으로 올라와서, 그 성은 포위되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 직역하면 ‘예루살렘으로 올라갔다’입니다. 히브리어의 ‘올라가다’는 지리적 상승과 군사적 진격을 함께 반영할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 성은 포위 상태에 들어갔다’입니다. 히브리어는 문자적으로 ‘그 성이 포위 속으로 들어갔다’라고 말하여 포위의 개시를 강조할 수 있습니다.
    reason: lexical_alternative
