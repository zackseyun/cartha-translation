source:
  edition: WLC
  text: בְּ/יָמָ֣י/ו עָלָ֔ה נְבֻכַדְנֶאצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יְהִי ל֨/וֹ יְהוֹיָקִ֥ים עֶ֨בֶד֙ שָׁלֹ֣שׁ שָׁנִ֔ים וַ/יָּ֖שָׁב וַ/יִּמְרָד בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/001.yaml
  text: In his days Nebuchadnezzar king of Babylon came up[a], and Jehoiakim became his servant for three years[b]. Then he turned and rebelled against him.
  footnotes:
  - marker: a
    text: Or 'became his vassal for three years.' The Hebrew says literally 'became to him a servant,' a political expression for subjection to an overlord.
    reason: lexical_alternative
  - marker: b
    text: Or 'turned back and rebelled against him.' The verb 'turned' likely marks Jehoiakim's reversal of allegiance before the rebellion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 시대에 바벨론 왕 느부갓네살이 올라왔습니다. 여호야김은 그에게 삼 년 동안 종이 되었습니다[a]. 그때 그는 돌아서서 그에게 반역했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘삼 년 동안 그의 봉신이 되었다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘그에게 종이 되었다’라고 하며, 상위 지배자에게 예속된 정치적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그때 그는 돌아서서 그에게 반역했다’로 옮길 수 있습니다. ‘돌아서다’는 여호야김이 충성을 바꾸어 반역한 것을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 날들에
  - 그의 때에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 왕의 재위 기간이라는 시간적 배경을 분명히 드러내기 위해 ‘그의 시대에’를 택했습니다.
- source_word: עָלָה
  english_pob_choice: came up
  chosen_korean: 올라왔습니다
  alternatives_korean:
  - 올랐습니다
  - 쳐들어왔습니다
  lexicon: HALOT
  rationale: עלה의 기본적인 ‘오르다/올라가다’ 의미를 살리면서도 군사적 진입의 문맥을 무리 없이 전달합니다.
- source_word: עֶבֶד
  english_pob_choice: servant
  chosen_korean: 종
  alternatives_korean:
  - 노예
  - 신하
  lexicon: HALOT
  rationale: 정치적 복속을 가리키지만, ‘종’이 히브리어 עבד의 기본 어휘를 가장 직접적으로 반영합니다. 여기서는 전면적 노예 상태라기보다 종주권 아래 든 종속을 나타냅니다.
- source_word: וַיָּשָׁב וַיִּמְרָד
  english_pob_choice: Then he turned and rebelled
  chosen_korean: 그때 그는 돌아서서
  alternatives_korean:
  - 그때 그는 되돌아가
  - 그때 그는 돌아서 반역하여
  lexicon: HALOT
  rationale: שוב의 ‘돌아서다/되돌아가다’와 이어지는 반역 동작을 한국어의 연결 구조로 살려, 반역 이전의 태도 전환을 드러냈습니다.
theological_decisions:
- issue: 왕의 종속 상태를 어떻게 표현할지
  chosen_reading: ‘여호야김은 그에게 삼 년 동안 종이 되었습니다’로, 정치적 복속을 과도하게 해설하지 않고 원문 표현을 유지했습니다.
  alternative_readings:
  - ‘그의 봉신이 되었습니다’
  - ‘그에게 복속되었습니다’
  rationale: 본문은 단순한 복속 사실을 서술하므로, 후대 제도명인 ‘봉신’보다 히브리어 어휘와 서술의 직설성을 보존하는 편이 더 충실합니다.
  doctrine_reference: 역사서 서술의 직역성 원칙
