translation:
  language: ko
  text: 여호야김의 나머지 행적과 그가 한 모든 일은 유다 왕들의 역대기 책에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘역대기 책’은 여기서 정경 「역대기」를 뜻한다기보다, 열왕기에서 출처로 인용되는 왕실 기록의 명칭을 가리킵니다.
    reason: source_note
