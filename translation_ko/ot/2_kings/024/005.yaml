theological_decisions:
- issue: 수사 의문문의 기능
  chosen_reading: ‘기록되어 있지 않습니까?’로 옮겨, 단순 정보 질문이 아니라 이미 알려진 왕실 기록을 상기시키는 요약문의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘기록되어 있지 않습니까?’
  - ‘기록되어 있지 않나요?’
  rationale: 히브리어 הֲלֹא는 독자를 설득하는 상투적 수사 의문문이므로, 평서형보다 확인을 요구하는 한국어로 옮기는 것이 적절합니다.
  doctrine_reference: 역사 서술의 수사적 장치
