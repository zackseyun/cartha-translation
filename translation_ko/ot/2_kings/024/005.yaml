  alternative_readings:
  - ‘기록되어 있지 않습니까?’
  - ‘기록되어 있지 않나요?’
  rationale: 히브리어 הֲלֹא는 독자를 설득하는 상투적 수사 의문문이므로, 평서형보다 확인을 요구하는 한국어로 옮기는 것이 적절합니다.
