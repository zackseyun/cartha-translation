  text: Now the rest of the acts of Jehoiakim[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'the annals of the kings of Judah.' The Hebrew title refers to a royal record source cited throughout Kings, not necessarily the canonical book of Chronicles.
