source:
  edition: WLC
  text: וַ/יּוֹצֵ֣א מִ/שָּׁ֗ם אֶת כָּל אוֹצְרוֹת֙ בֵּ֣ית יְהוָ֔ה וְ/אֽוֹצְר֖וֹת בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יְקַצֵּ֞ץ אֶת כָּל כְּלֵ֣י הַ/זָּהָ֗ב אֲשֶׁ֨ר עָשָׂ֜ה שְׁלֹמֹ֤ה מֶֽלֶךְ יִשְׂרָאֵל֙ בְּ/הֵיכַ֣ל יְהוָ֔ה כַּֽ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/013.yaml
  text: And he carried away from there all the treasures of the house of Yahweh and the treasures of the king’s house[a], and he cut in pieces all the gold vessels that Solomon king of Israel had made in the temple of Yahweh[b], just as Yahweh had spoken.
  footnotes:
  - marker: a
    text: Or 'brought out from there' or 'took out from there.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'house of the LORD' earlier in the verse; here 'temple of the LORD' renders a different Hebrew word, often referring more specifically to the temple structure or sanctuary.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 그곳에서 야훼의 집의 모든 보물과 왕궁의 보물을 가져가고[a], 솔로몬이 이스라엘의 왕으로서 야훼의 성전에서 만든 모든 금그릇을 잘라 부쉈습니다[b]. 야훼께서 말씀하신 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그곳에서 꺼내었다’, ‘그곳에서 가져내었다’.
    reason: lexical_alternative
  - marker: b
    text: 앞부분의 ‘야훼의 집’과 달리, 여기의 히브리어 הֵיכַל은 더 구체적으로 성전 건물을 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא מִשָּׁם
  english_pob_choice: he carried away from there
  chosen_korean: 그곳에서 … 가져가고
  alternatives_korean:
  - 그곳에서 … 꺼내고
  - 그곳에서 … 옮겨 내고
  lexicon: HALOT
  rationale: 히필 יצא는 ‘밖으로 내다/가져내다’의 사역적 제거를 가리키므로, 물건을 옮겨 빼내는 뜻을 살려 ‘가져가고’로 옮겼습니다.
- source_word: אוֹצְרוֹת
  english_pob_choice: treasures
  chosen_korean: 보물
  alternatives_korean:
  - 창고
  - 저장품
  lexicon: HALOT
  rationale: 여기서는 저장 공간보다 약탈되어 옮겨진 귀중한 내용물을 가리키므로, 문맥상 ‘보물’이 가장 자연스럽습니다.
- source_word: בֵּית יְהוָה / בְּהֵיכַל יְהוָה
  english_pob_choice: the house of Yahweh / the temple of Yahweh
  chosen_korean: 야훼의 집 / 야훼의 성전
  alternatives_korean:
  - 야훼의 집 / 야훼의 집
  - 야훼의 성소
  lexicon: HALOT
  rationale: 히브리어가 앞부분의 בֵּית과 뒤의 הֵיכָל을 구별하므로, 앞은 ‘집’, 뒤는 더 구체적인 ‘성전’으로 번역해 차이를 살렸습니다.
- source_word: וַיְקַצֵּץ אֶת כָּל כְּלֵי הַזָּהָב
  english_pob_choice: he cut in pieces all the gold vessels
  chosen_korean: 모든 금그릇을 잘라 부쉈습니다
  alternatives_korean:
  - 모든 금그릇을 잘게 부쉈습니다
  - 모든 금그릇을 잘라냈습니다
  lexicon: HALOT
  rationale: קצץ는 물리적으로 절단하여 훼손하는 동작이므로, 단순한 파괴보다 분절감을 드러내는 ‘잘라 부쉈습니다’로 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 처리
  chosen_reading: 본문의 두 용례 모두 ‘야훼’로 일관되게 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 표기하여 원문 고유명과 언약적 발화를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
