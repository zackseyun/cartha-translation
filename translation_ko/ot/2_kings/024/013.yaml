    rationale: וַיְקַצֵּץ는 잘라 내거나 여러 조각으로 자르는 행위를 가리킵니다. ‘부수다’는 가능하지만 절단이라는 구체적 동작을 약화하거나 추가할 수 있어 ‘잘라 조각내다’가 더 적절합니다.
  - severity: low
