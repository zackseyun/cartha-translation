source:
  edition: WLC
  text: וַ/יֵּצֵ֞א יְהוֹיָכִ֤ין מֶֽלֶךְ יְהוּדָה֙ עַל מֶ֣לֶךְ בָּבֶ֔ל ה֣וּא וְ/אִמּ֔/וֹ וַ/עֲבָדָ֖י/ו וְ/שָׂרָ֣י/ו וְ/סָֽרִיסָ֑י/ו וַ/יִּקַּ֤ח אֹת/וֹ֙ מֶ֣לֶךְ בָּבֶ֔ל בִּ/שְׁנַ֥ת שְׁמֹנֶ֖ה לְ/מָלְכֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/012.yaml
  text: Then Jehoiachin king of Judah went out to the king of Babylon[a], he and his mother and his servants and his officials and his eunuchs; and the king of Babylon took him in the eighth year of his reign.
  footnotes:
  - marker: a
    text: Or 'his eunuchs'; the Hebrew term can refer either to literal eunuchs or more broadly to royal court officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다 왕 여호야긴이 바빌론 왕에게 나아갔습니다. 그와 그의 어머니와 그의 신하들과 그의 관리들과 그의 내시들이 함께 갔습니다. 바빌론 왕은 자기 통치 제8년에 그를 사로잡았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סָרִיסָיו는 문자적으로는 ‘내시들’을 뜻하지만, 넓게는 왕궁의 고위 관료를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא ... עַל מֶלֶךְ בָּבֶל
  english_pob_choice: went out to the king of Babylon
  chosen_korean: 바빌론 왕에게 나아갔습니다
  alternatives_korean:
  - 바빌론 왕에게 나갔습니다
  - 바빌론 왕에게 나아와 항복했습니다
  lexicon: HALOT
  rationale: יצא의 기본 뜻은 ‘나가다’이지만, 이 문맥에서는 왕에게 몸을 내맡기는 이동을 가리키므로 ‘나아가다’가 과잉 해석 없이 방향성과 정중한 접근을 함께 살립니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕궁 맥락에서 עבד는 단순한 하인보다 왕의 소속 인물들을 가리킬 수 있어 ‘신하들’이 자연스럽고, 다음의 직책 용어들과도 어울립니다.
- source_word: שָׂרָיו
  english_pob_choice: his officials
  chosen_korean: 그의 관리들
  alternatives_korean:
  - 그의 방백들
  - 그의 지도자들
  lexicon: HALOT
  rationale: שׂרִים은 고위 인물들을 뜻하므로 현대 한국어에서는 ‘관리들’이 관료적·궁정적 뉘앙스를 유지하면서도 과도하게 고전적이지 않습니다.
- source_word: סָרִיסָיו
  english_pob_choice: his eunuchs
  chosen_korean: 그의 내시들
  alternatives_korean:
  - 그의 궁정 관리들
  - 그의 환관들
  lexicon: HALOT
  rationale: סָרִיס는 문맥에 따라 문자적 내시를 뜻할 수 있으므로 기본적으로 ‘내시들’로 옮기되, 용어의 역사적 의미를 흐리지 않도록 했습니다.
- source_word: בִּשְׁנַת שְׁמֹנֶה לְמָלְכוֹ
  english_pob_choice: in the eighth year of his reign
  chosen_korean: 자기 통치 제8년에
  alternatives_korean:
  - 자기 왕위 제8년에
  - 그의 통치 제8년에
  lexicon: HALOT
  rationale: מלך의 시간표현은 한국어에서 ‘통치’가 가장 직접적으로 대응하며, 대명사 ‘자기’는 바로 앞의 바빌론 왕을 가리키는 문맥을 분명히 합니다.
theological_decisions:
- issue: 문장 종결에서 ‘사로잡았습니다’의 강도
  chosen_reading: 왕이 그를 자기 앞으로 데려간 정도가 아니라, 점령자에 의해 붙잡힌 사건으로 분명히 드러내기 위해 ‘사로잡았습니다’로 옮겼습니다.
  alternative_readings:
  - 그를 데려갔습니다
  - 그를 붙잡았습니다
  rationale: 히브리어 וַיִּקַּח אֹתוֹ는 기본적으로 ‘취하다/데려가다’이지만, 이 서술은 포로화의 결과를 전제하므로 한국어에서는 사건의 역사적 함의를 분명히 하는 쪽이 더 적절합니다.
  doctrine_reference: 역사 서술의 명료성
