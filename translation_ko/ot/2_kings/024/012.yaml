  verdict: revise
  source_fidelity: ‘사로잡았습니다’는 וַיִּקַּח אֹתוֹ(‘그를 취하다/데려가다’)보다 강한 ‘포획’의 의미를 확정합니다. 문맥상 포로가 된 결과는 분명하지만, 본문은 더 직접적인 동사로 옮기는 것이 적절합니다. 또한 동반자들은 히브리어에서 여호야긴과 함께 나아간 이들로 한 문장 안에 연결되어 있으며, 각주 표지는 סָרִיסָיו에 해당하는 ‘내시들’에 붙어야 합니다.
  naturalness: 현대 표준어 합쇼체로 ‘…과 함께 … 나아갔고’와 ‘통치 제8년에’는 자연스럽고 간결합니다. ‘그와 그의 어머니와…’를 별도 문장으로 두고 ‘함께 갔습니다’를 보태는 방식보다 원문의 결속 관계를 더 잘 드러냅니다.
  terminology: 여호야긴, 바빌론, 신하들, 관리들, 내시들은 적절합니다. ‘내시들’은 סָרִיסָיו의 일차적 의미를 반영하며, 왕궁 관료라는 넓은 용례는 각주로 보존합니다.
  issues:
