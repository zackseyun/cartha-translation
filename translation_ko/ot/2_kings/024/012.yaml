- from: 그때 유다 왕 여호야긴이 바빌론 왕에게 나아갔습니다. 그와 그의 어머니와 그의 신하들과 그의 관리들과 그의 내시들이 함께 갔습니다. 바빌론 왕은 자기 통치 제8년에 그를 사로잡았습니다.[a]
  to: 그때 유다 왕 여호야긴이 그의 어머니와 신하들과 관리들과 내시들[a]과 함께 바빌론 왕에게 나아갔고, 바빌론 왕은 통치 제8년에 그를 데려갔습니다.
  rationale: 원문의 동반자 목록과 사건의 연결을 한 문장으로 회복하고, ‘취하다’라는 동사의 의미를 ‘사로잡다’로 과도하게 확정하지 않았습니다. 연대 표기는 바로 앞 주어인 바빌론 왕의 통치 연수를 가리키도록 문맥상 유지했으며, 각주 표지는 해당 어휘에 직접 연결했습니다.
