  source_fidelity: 히브리어의 두 진술, 곧 야훼의 평가와 아버지의 행위 전체에 따른 비교를 모두 반영합니다. 다만 초안의 ‘하였으니’는 원문에 없는 인과 관계를 암시하고, ‘…모든 것과 같았습니다’는 무엇이 같았는지 문법적으로 다소 불분명합니다.
