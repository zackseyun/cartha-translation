  text: 그는 야훼께서 보시기에 악을 행하였고, 그의 아버지가 행한 모든 것과 같이 행하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: And he did
  chosen_korean: 그는 … 하였습니다
  alternatives_korean:
  - 그는 … 했습니다
  - 그는 … 행하였습니다
  lexicon: HALOT
  rationale: 히브리어 wayyiqtol의 서사 진행을 살리면서도 한국어 문장 흐름에 맞게 ‘그는’으로 주어를 드러내고, 간결한 과거 서술로 옮겼습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 그 악한 것
  lexicon: HALOT
  rationale: 관사 있는 형용사의 명사적 용법을 한국어에서 자연스럽게 풀어, 관용구 ‘악한 일을 하다’로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에
  lexicon: HALOT
  rationale: 평가의 관점을 나타내는 히브리어 관용구를 직역에 가깝게 유지하되 한국어로 자연스러운 ‘~의 눈에’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  english_pob_choice: according to all that his father had done
  chosen_korean: 그의 아버지가 행한 모든 것과 같았습니다
  alternatives_korean:
  - 그의 아버지가 한 모든 것처럼
  - 그 아버지가 행한 모든 대로
  lexicon: HALOT
  rationale: כְּכֹל의 포괄적 비교를 ‘모든 것과 같았습니다’로 살리고, 선행한 아버지의 행위를 나타내기 위해 과거완료적 뉘앙스를 담았습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
