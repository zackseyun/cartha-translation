translation:
  language: ko
  text: 그는 야훼께서 보시기에 악을 행했으며, 여호야김이 행한 모든 것과 같이 행했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행하였으며
  alternatives_korean:
  - 하였으며
  - 행했습니다
  - 했습니다
  lexicon: HALOT
  rationale: עשה의 서술적 동작을 자연스러운 합쇼체로 옮기되, 문맥상 도덕적 평가와 결합되므로 다소 격식 있는 ‘행하다’를 택했습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악을
  alternatives_korean:
  - 악한 일을
  - 악한 것
  - 악
  lexicon: HALOT
  rationale: 히브리어 관용구 עשה הרע는 단순히 ‘나쁘다’가 아니라 도덕적 악행을 뜻하므로, 평가의 강도를 살려 ‘악을 행하다’로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  - 야훼께서 보시기에
  lexicon: HALOT
  rationale: ‘보시기에’가 원문의 시각적 은유를 가장 자연스럽게 살리며, divine name은 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  english_pob_choice: according to all that ... had done
  chosen_korean: 한 모든 것과 같았습니다
  alternatives_korean:
  - 행한 모든 것과 같았습니다
  - 했던 모든 것과 같았습니다
  - 모든 행실과 같았습니다
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר의 포괄적 비교를 ‘...과 같았습니다’로 자연스럽게 살렸고, 앞선 인물의 행위를 요약하는 완결된 비교문으로 만들었습니다.
- source_word: יְהוֹיָקִים
  english_pob_choice: Jehoiakim
  chosen_korean: 여호야김
  alternatives_korean:
  - 여호야킴
  - 예호야김
  lexicon: HALOT
  rationale: 히브리어 인명 יְהוֹיָקִים은 한국어 성서 관용형인 ‘여호야김’이 가장 널리 인식됩니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 본문에서 신적 고유명은 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
