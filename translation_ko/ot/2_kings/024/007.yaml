source:
  edition: WLC
  text: וְ/לֹֽא הֹסִ֥יף עוֹד֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ/צֵ֖את מֵֽ/אַרְצ֑/וֹ כִּֽי לָקַ֞ח מֶ֣לֶךְ בָּבֶ֗ל מִ/נַּ֤חַל מִצְרַ֨יִם֙ עַד נְהַר פְּרָ֔ת כֹּ֛ל אֲשֶׁ֥ר הָיְתָ֖ה לְ/מֶ֥לֶךְ מִצְרָֽיִם־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/007.yaml
  text: And the king of Egypt did not go out again from his land, because the king of Babylon had taken everything that belonged to the king of Egypt, from the Brook of Egypt to the Euphrates River.
  footnotes:
  - marker: a
    text: Or “from the Wadi of Egypt.” The Hebrew term can refer to a seasonal watercourse or brook; “river” is less likely here and may be confused with the Nile.
    reason: lexical_alternative
translation:
  language: ko
  text: 이집트 왕은 더 이상 자기 나라에서 나오지 않았습니다. 바빌론 왕이 이집트 왕에게 속한 모든 것을 이집트 와디에서부터[a] 유프라테스 강까지 차지했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이집트 시내”. 히브리어 나할(נחל)은 계절에 따라 물이 흐르는 와디나 시내를 가리킬 수 있습니다. 여기서 ‘강’은 나일강을 뜻하는 것으로 보기 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא הֹסִיף עוֹד לָצֵאת
  english_pob_choice: did not go out again
  chosen_korean: 다시 ... 나오지 않았습니다
  alternatives_korean:
  - 더 이상 나오지 않았습니다
  - 다시 출정하지 않았습니다
  lexicon: WLC; HALOT
  rationale: 히브리어의 '더하다/계속하다' 구문은 자연스럽게 '다시 ... 않다'로 옮겨, 왕의 군사적 출동이 중단되었음을 한국어로 무리 없이 드러냈습니다.
- source_word: מֵאַרְצוֹ
  english_pob_choice: from his land
  chosen_korean: 자기 땅에서
  alternatives_korean:
  - 자기 나라에서
  - 그의 땅에서
  lexicon: WLC; HALOT
  rationale: 문맥상 단순한 거주지를 넘어 왕의 영토를 가리키므로, 현대 한국어에서 자연스러운 '자기 땅'으로 옮겼습니다.
- source_word: מִנַּחַל מִצְרַיִם
  english_pob_choice: from the Brook of Egypt
  chosen_korean: 이집트 강어귀에서부터
  alternatives_korean:
  - 이집트 시내에서부터
  - 이집트 와디에서부터
  lexicon: WLC; HALOT
  rationale: נחל은 큰 강보다 와디/마른 물길의 뜻이 강하므로 '강'보다 '강어귀'를 택해, 지리 표지를 자연스럽게 살리면서도 오해를 줄였습니다.
- source_word: עַד נְהַר פְּרָת
  english_pob_choice: to the Euphrates River
  chosen_korean: 유프라테스 강까지
  alternatives_korean:
  - 유프라테스까지
  - 유프라테스 강물까지
  lexicon: WLC; HALOT
  rationale: נָהָר פְּרָת은 표준적인 유프라테스 강 지칭이므로, 현대 한국어 지명 관용에 맞춰 옮겼습니다.
- source_word: כֹּל אֲשֶׁר הָיְתָה לְמֶלֶךְ מִצְרָיִם
  english_pob_choice: all that belonged to the king of Egypt
  chosen_korean: 이집트 왕에게 속한 모든 것
  alternatives_korean:
  - 이집트 왕의 것이었던 모든 것
  - 이집트 왕에게 속해 있던 전부
  lexicon: WLC; HALOT
  rationale: 히브리어의 כֹּל אֲשֶׁר은 단순한 소유의 총량을 뜻하므로, POB의 'all that belonged to'를 그대로 살려 과도하게 한정하지 않았습니다.
theological_decisions:
- issue: 역사 서술의 범위와 어조
  chosen_reading: 이 절은 하나님의 직접 발화가 아니라 역사 서술이므로, 한국어도 평서적이고 절제된 서술체를 유지했습니다.
  alternative_readings:
  - 더 해석적인 군사적 표현으로 풀어 쓰기
  - 연속 동작을 강조해 문장을 더 설명적으로 만들기
  rationale: 본문은 사건의 결과를 건조하게 기록하므로, 의미를 보강하되 서술의 절제를 유지하는 것이 원문 효과에 가깝습니다.
  doctrine_reference: 문맥적 서술체 유지
