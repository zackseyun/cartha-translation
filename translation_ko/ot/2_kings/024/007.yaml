  source_fidelity: ‘이집트 강어귀’는 נַחַל מִצְרַיִם(이집트의 나할/와디)의 의미와 맞지 않습니다. ‘강어귀’는 강이 바다나 호수로 흘러드는 하구를 뜻하므로 지리·어휘적으로 부정확합니다. 본문은 이집트 왕이 더 이상 자신의 영토에서 나아오지 않은 이유를, 바빌론 왕이 이집트 왕의 소유·지배 아래 있던 모든 것을 이집트 와디에서 유프라테스 강까지 차지했기 때문이라고 제시합니다.
  naturalness: ‘더 이상 자기 나라에서 나오지 않았습니다’는 히브리어의 ‘더 이상 나아가/나오지 않았다’를 자연스러운 현대 합쇼체로 옮깁니다. 지명성 표현은 ‘이집트 와디’로 처리하고 각주에서 ‘시내’라는 가능한 번역을 밝혀, 본문의 지리적 모호성을 보존했습니다.
