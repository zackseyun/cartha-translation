  text: אַ֣ךְ עַל פִּ֣י יְהוָ֗ה הָֽיְתָה֙ בִּֽ/יהוּדָ֔ה לְ/הָסִ֖יר מֵ/עַ֣ל פָּנָ֑י/ו בְּ/חַטֹּ֣את מְנַשֶּׁ֔ה כְּ/כֹ֖ל אֲשֶׁ֥ר עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/003.yaml
  text: Surely this came upon Judah at the command of Yahweh[a], to remove them from before his face because of the sins of Manasseh, according to all that he had done.
  footnotes:
  - marker: a
    text: Or, 'from his presence.'
    reason: lexical_alternative
translation:
  language: ko
  text: 확실히 이 일은 야훼의 명령으로 유다에게 닥쳤으니, 곧 그를 자기 앞에서 제거하시려는 것이었습니다. 그것은 므낫세의 죄들 때문이었고, 그가 행한 모든 것에 따른 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 앞에서 제거하시려는 것’은 히브리어의 ‘얼굴/앞’ 이미지를 반영한 표현이며, 더 자연스러운 뜻은 ‘그의 임재에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Surely
  chosen_korean: 확실히
  alternatives_korean:
  - 오직
  - 참으로
  - 분명히
  lexicon: HALOT
  rationale: 여기서는 제한이 아니라 앞 문장을 강하게 확증하는 용법이므로, 현대 한국어에서 자연스럽고 단정적인 「확실히」로 옮겼습니다.
- source_word: עַל פִּי יְהוָה
  english_pob_choice: at the command of Yahweh
  chosen_korean: 야훼의 명령으로
  alternatives_korean:
  - 야훼의 말씀대로
  - 야훼의 입으로
  - 야훼의 뜻에 따라
  lexicon: HALOT
  rationale: 직역하면 ‘입에 따라’이지만, 문맥상 행위의 원인이 되는 권위 있는 명령을 뜻하므로 한국어에서는 「명령으로」가 가장 분명합니다.
- source_word: מֵעַל פָּנָיו
  english_pob_choice: from before his face
  chosen_korean: 그를 자기 앞에서 제거하시려는 것
  alternatives_korean:
  - 그의 얼굴 앞에서
  - 그의 임재 앞에서
  lexicon: HALOT
  rationale: 히브리어의 ‘얼굴/앞’ 이미지는 유지하되, 한국어에서는 자연스럽게 ‘자기 앞에서 제거하다’로 풀어 주어 추방과 배제를 분명히 했습니다.
- source_word: בְּחַטֹּאת מְנַשֶּׁה
  english_pob_choice: because of the sins of Manasseh
  chosen_korean: 므낫세의 죄들 때문이었고
  alternatives_korean:
  - 므낫세의 죄 때문에
  - 므낫세의 죄악들로 말미암아
  lexicon: HALOT
  rationale: 복수형 죄들을 그대로 반영해 집합적 죄책을 드러내되, 한국어에서는 원인 절로 자연스럽게 연결했습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  english_pob_choice: according to all that he had done
  chosen_korean: 그가 행한 모든 것에 따른 것이었습니다
  alternatives_korean:
  - 그가 한 모든 것에 따라
  - 그가 행한 모든 대로였습니다
  lexicon: HALOT
  rationale: ‘따르다/따른’으로 히브리어의 대응·비례 의미를 살리고, 심판이 그의 행위와 상응한다는 점을 드러냈습니다.
theological_decisions:
- issue: 유다에 임한 재앙의 주체와 책임
  chosen_reading: 재앙은 야훼의 명령에 따라 유다에게 닥친 것이며, 그 목적은 그들을 자기 앞에서 제거하는 것이었습니다.
  alternative_readings:
  - 중립적으로 ‘이 일은 유다에게 일어났다’로 옮길 수 있습니다.
  - ‘유다를 내쫓다’처럼 더 직접적으로 표현할 수도 있습니다.
  rationale: 히브리어의 수동/열거 구조는 야훼의 주권적 심판을 강조하므로, 원문의 책임 주체를 흐리지 않도록 명시적으로 옮겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
