lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came
  chosen_korean: 올라왔고
  alternatives_korean:
  - 왔고
  - 다가왔고
  lexicon: HALOT
  rationale: 전쟁·포위 문맥에서 단순한 ‘오다’보다 적대적으로 접근하는 뉘앙스를 살리기 위해 ‘향해 올라오다’로 옮겼습니다.
- source_word: עַל הָעִיר
  english_pob_choice: against the city
  chosen_korean: 그 성읍을 향해
  alternatives_korean:
  - 그 성읍에
  - 그 성읍을 향하여
  lexicon: HALOT
  rationale: 히브리어 עַל이 이 문맥에서는 단순한 방향보다 적대적 접근을 나타내므로, ‘향해’로 그 긴장을 반영했습니다.
- source_word: וַעֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 신하들
  - 그의 관리들
  - 그의 군대
  lexicon: HALOT
  rationale: 기본 어휘값인 ‘종들’을 유지해 원문을 보존하고, 그들이 왕의 봉사 아래 있는 존재임을 나타냈습니다.
- source_word: צָרִים
  english_pob_choice: were besieging
  chosen_korean: 포위하고 있었습니다
  alternatives_korean:
  - 공격하고 있었습니다
  - 포위전을 벌이고 있었습니다
  - 공성하고 있었습니다
  lexicon: HALOT
  rationale: 지속적 포위 행위를 나타내는 분사이므로, 한국어에서는 자연스러운 진행형으로 ‘포위하고 있었습니다’가 가장 직접적입니다.
