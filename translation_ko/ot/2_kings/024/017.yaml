base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/017.yaml
  text: And the king of Babylon made Mattaniah[a], his uncle, king in his place, and changed his name to Zedekiah.
  footnotes:
  - marker: a
    text: 'Or ''appointed Mattaniah ... as king.'' The Hebrew verb is causative: the Babylonian king installed him as ruler.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론 왕은 여호야긴의 삼촌인 마트냐를[a] 그 대신 왕으로 세우고, 마트냐의 이름을 시드기야로 바꾸었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마트냐를 … 왕으로 임명하였다.’ 히브리어 동사는 사역형으로, 바빌론 왕이 그를 통치자로 세웠다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세우고
  alternatives_korean:
  - 왕으로 만들고
  - 왕으로 임명하고
  - 다스리게 하고
  lexicon: HALOT
  rationale: 히필형은 단순 서술이 아니라 왕위에 앉히는 행위이므로, 한국어로는 자연스럽게 ‘왕으로 세우다’가 그 사역적 의미를 잘 살립니다.
- source_word: מֶלֶךְ בָּבֶל
  english_pob_choice: the king of Babylon
  chosen_korean: 바빌론 왕
  alternatives_korean:
  - 바빌론의 왕
  - 바빌론의 왕이
  lexicon: HALOT
  rationale: 히브리어의 소유격 구조를 한국어 관용에 맞게 간결하게 옮겼습니다.
- source_word: דֹדוֹ
  english_pob_choice: his uncle
  chosen_korean: 그의 삼촌
  alternatives_korean:
  - 그의 외삼촌
  - 그의 숙부
  - 그의 친족
  lexicon: HALOT
  rationale: 문맥상 마트냐와 여호야긴의 근친 관계를 가리키며, 한국어에서는 ‘삼촌’이 가장 자연스럽고 직접적입니다.
- source_word: וַיַּסֵּב אֶת שְׁמוֹ
  english_pob_choice: changed his name
  chosen_korean: 그의 이름을 … 바꾸었습니다
  alternatives_korean:
  - 그의 이름을 … 고쳤습니다
  - 그의 이름을 … 바꾸어 주었습니다
  lexicon: HALOT
  rationale: 이름 변경의 사실을 직접적으로 전달하되, 원문의 목적어 ‘그의 이름’을 분명히 살렸습니다.
theological_decisions:
- issue: 왕위 부여의 주체를 어떻게 드러낼지
  chosen_reading: 바빌론 왕이 직접 마트냐를 왕으로 세운 것으로 분명히 옮겼습니다.
  alternative_readings:
  - 마트냐가 스스로 왕이 되었다는 뉘앙스로 완화함
  - 단순히 왕이 되었다고 서술함
  rationale: 히필형은 사역적 의미를 가지므로, 본문이 강조하는 정치적 지배와 임명 관계를 흐리지 않도록 했습니다.
  doctrine_reference: 본문 역사 서술의 문법적 의미 보존
- issue: 이름 변경의 의미
  chosen_reading: 개명 사실만을 옮기고, 이름의 의미 해석은 본문에 넣지 않았습니다.
  alternative_readings:
  - 시드기야의 어원적 뜻을 덧붙임
  - 상징적 의미를 확대 설명함
  rationale: 히브리 본문은 명칭 변경 자체를 말할 뿐, 여기서 어원 설명을 요구하지 않으므로 주석적 해설을 본문에 끼워 넣지 않았습니다.
  doctrine_reference: 본문 충실성 원칙
