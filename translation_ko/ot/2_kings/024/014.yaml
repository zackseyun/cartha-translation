  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הִגְלָ֣ה אֶת כָּל יְ֠רוּשָׁלִַם וְֽ/אֶת כָּל הַ/שָּׂרִ֞ים וְ/אֵ֣ת כָּל גִּבּוֹרֵ֣י הַ/חַ֗יִל עשרה אֲלָפִים֙ גּוֹלֶ֔ה וְ/כָל הֶ/חָרָ֖שׁ וְ/הַ/מַּסְגֵּ֑ר לֹ֣א נִשְׁאַ֔ר זוּלַ֖ת דַּלַּ֥ת עַם הָ/אָֽרֶץ־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/014.yaml
  text: And he carried away all Jerusalem[a], and all the officials, and all the mighty men of valor, ten thousand captives, and all the craftsmen and the smiths; none remained except the poorest of the people of the land.
  footnotes:
  - marker: a
    text: Or 'the metalworkers'; the Hebrew term traditionally rendered 'smiths' may refer more broadly to skilled workers in metal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 예루살렘[a]과 모든 관원들과 모든 용사들, 곧 만 명의 포로들과 모든 장인들과 대장장이들을 사로잡아 갔습니다. 아무도 남지 않았고, 다만 그 땅의 가장 가난한 백성만 남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘금속 세공인들’로 옮길 수 있습니다. 히브리어는 전통적으로 ‘대장장이들’로 번역되지만, 더 넓은 금속 작업자를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְלָה
  english_pob_choice: carried away
  chosen_korean: 사로잡아 갔습니다
  alternatives_korean:
  - 끌어갔습니다
  - 포로로 끌고 갔습니다
  - 유배시켰습니다
  lexicon: HALOT
  rationale: 히필형의 강제 이주 의미를 살리되, 한국어에서는 ‘사로잡아 갔습니다’가 포획과 추방의 뉘앙스를 함께 담아 역사 서술에 자연스럽습니다.
- source_word: כָּל יְרוּשָׁלִַם
  english_pob_choice: all Jerusalem
  chosen_korean: 예루살렘[a]
  alternatives_korean:
  - 예루살렘의 모든 사람
  - 예루살렘 전체
  lexicon: HALOT
  rationale: 히브리어의 메토님이아를 따라 도시 자체를 그대로 두어, 실제로는 주민과 지도층 전체가 대상임을 독자가 문맥에서 읽게 합니다.
- source_word: הֶחָרָשׁ וְהַמַּסְגֵּר
  english_pob_choice: the craftsmen and the smiths
  chosen_korean: 모든 장인들과 대장장이들
  alternatives_korean:
  - 모든 기술자들과 금속 세공인들
  - 모든 공예가들과 금속 장인들
  lexicon: HALOT
  rationale: חָרָשׁ은 넓게 ‘장인’으로, מַסְגֵּר은 통상적 ‘대장장이’로 옮기되, 영어 POB가 제시한 금속 작업의 더 넓은 가능성은 각주로 처리했습니다.
- source_word: לֹא נִשְׁאַר זוּלַת דַּלַּת עַם הָאָרֶץ
  english_pob_choice: none remained except the poorest of the people of the land
  chosen_korean: 아무도 남지 않았고, 다만 그 땅의 가장 가난한 백성만 남았습니다
  alternatives_korean:
  - 남은 자는 없었고, 다만 그 땅의 가장 가난한 백성뿐이었습니다
  - 아무도 남지 않았습니다. 오직 그 땅의 가장 가난한 백성만 남았습니다
  lexicon: HALOT
  rationale: ‘남지 않았다’와 예외 절을 분명히 분리해, 전체 추방과 남겨진 빈곤층의 대비를 한국어에서 명료하게 전달합니다.
theological_decisions:
- issue: 역사 서술에서의 완곡어법 여부
  chosen_reading: ‘사로잡아 갔습니다’로 강제적 포로화를 분명히 드러냈습니다.
  alternative_readings:
  - 유배시켰습니다
  - 데려갔습니다
  rationale: 본문은 단순 이동이 아니라 정복자에 의한 강제 이주를 말하므로, 의미를 약화시키는 순화 표현보다 포로화의 현실을 직접 반영했습니다.
  doctrine_reference: 포로기 역사 서술의 직접성 유지
- issue: ‘예루살렘’의 지시 대상
  chosen_reading: 도시명을 그대로 두어 주민 전체를 가리키는 집합적 표현으로 처리했습니다.
  alternative_readings:
  - 예루살렘의 사람들
  - 예루살렘 주민들
  rationale: 히브리어가 도시명으로 주민과 지도층을 통칭하는 표현이므로, 이를 해설화하지 않고 본문 안에서 자연스럽게 유지했습니다.
  doctrine_reference: 히브리어 메토님이아 보존
