  source_fidelity: 전반적인 인명, 장소, 왕실 구성원의 열거와 예루살렘에서 바빌론으로의 강제 이주라는 뜻은 잘 반영되었습니다. 다만 ‘함께 붙잡아’는 원문에 명시되지 않은 체포 행위를 덧붙이며, 두 번째 동사의 ‘포로로 끌고 갔다/유배로 데려갔다’라는 사역적 의미로 충분히 표현할 수 있습니다.
  naturalness: 합쇼체는 일관되지만, ‘그리고’로 새 문장을 시작하고 ‘함께 붙잡아’라고 연결한 표현은 다소 부자연스럽고 의미를 과도하게 구체화합니다. ‘또 …을 … 포로로 끌고 갔습니다’가 현대 표준어 서사문으로 더 자연스럽습니다.
  terminology: ‘여호야긴’, ‘바빌론’, ‘궁정 관리들’, ‘왕의 어머니’, ‘그 땅의 유력한 사람들’은 적절합니다. סָרִיס의 의미 범위를 밝히는 각주는 해당 명사 바로 뒤에, ‘왕의 어머니’ 각주는 해당 표현 바로 뒤에, ‘유력한 사람들’ 각주는 해당 표현 바로 뒤에 붙여야 합니다.
