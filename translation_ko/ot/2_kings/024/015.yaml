- from: 그가 여호야긴을 바빌론으로 끌고 갔습니다[a]. 그리고 왕의 어머니와 왕의 아내들과 그의 궁정 관리들과 그 땅의 유력한 사람들도 함께 붙잡아, 예루살렘에서 바빌론으로 포로로 옮겼습니다[b][c].
  to: 그는 여호야긴을 바빌론으로 끌고 갔습니다. 또 왕의 어머니[c]와 왕의 아내들, 그의 궁정 관리들[a], 그 땅의 유력한 사람들[b]을 예루살렘에서 바빌론으로 포로로 끌고 갔습니다.
  rationale: 원문에 없는 ‘붙잡아’를 제거하여 강제 이주/포로화라는 본문의 의미에만 충실하게 했습니다. 또한 각주 표지를 해당 어휘 바로 뒤로 옮겨 어휘 대안과 본문 표지의 대응을 바로잡았고, 각주 b의 표현을 자연스럽게 다듬었습니다.
