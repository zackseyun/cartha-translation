id: 2KI.24.15
reference: 2 Kings 24:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֶּ֥גֶל אֶת יְהוֹיָכִ֖ין בָּבֶ֑לָ/ה וְ/אֶת אֵ֣ם הַ֠/מֶּלֶךְ וְ/אֶת נְשֵׁ֨י הַ/מֶּ֜לֶךְ וְ/אֶת סָרִיסָ֗י/ו וְ/אֵת֙ אולי הָ/אָ֔רֶץ הוֹלִ֛יךְ גּוֹלָ֥ה מִ/ירוּשָׁלִַ֖ם בָּבֶֽלָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/024/015.yaml
  text: And he carried Jehoiachin away to Babylon[a], along with the king’s mother, the king’s wives, his court officials, and the leading men of the land[c][b]; he took them into exile from Jerusalem to Babylon.
  footnotes:
  - marker: a
    text: Or 'his eunuchs'; the Hebrew term can refer either to eunuchs specifically or more generally to royal/court officials.
    reason: lexical_alternative
  - marker: b
    text: Or 'the mighty men of the land' or 'the nobles of the land.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the king’s mother'; this could also be expressed as 'the queen mother,' but the translation keeps the familial wording of the source text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 여호야긴을 바빌론으로 끌고 갔습니다[a]. 그리고 왕의 어머니와 왕의 아내들과 그의 궁정 관리들과 그 땅의 유력한 사람들도 함께 붙잡아, 예루살렘에서 바빌론으로 포로로 옮겼습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원어 סָרִיס는 ‘내시’ 또는 넓게는 ‘궁정 관리들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 '그 땅의 유력한 사람들' 또는 '그 땅의 용사들/귀족들'로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕의 어머니’는 ‘왕대비’로도 표현할 수 있으나, 원문의 친족적 표현을 그대로 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּגֶל
  english_pob_choice: carried ... away / took them into exile
  chosen_korean: 끌고 갔습니다 / 포로로 옮겼습니다
  alternatives_korean:
  - 데려갔습니다
  - 유배시켰습니다
  - 포로로 끌어갔습니다
  lexicon: WLC; HALOT
  rationale: גלה의 사역적 의미를 살려 강제 이주와 포로 상태를 함께 드러내되, 앞절은 이동 동작을, 뒤절은 exile 결과를 분명히 했습니다.
- source_word: סָרִיסָיו
  english_pob_choice: his court officials
  chosen_korean: 그의 궁정 관리들
  alternatives_korean:
  - 그의 내시들
  - 그의 관리들
  - 그의 환관들
  lexicon: HALOT
  rationale: 궁정 맥락에서 סָרִיס가 내시일 수도 있으나 관리라는 행정적 기능이 우선될 수 있어, POB의 해석을 따라 '궁정 관리들'로 옮겼습니다.
- source_word: אֵם הַמֶּלֶךְ
  english_pob_choice: the king’s mother
  chosen_korean: 왕의 어머니
  alternatives_korean:
  - 왕대비
  - 왕의 모친
  lexicon: HALOT
  rationale: 직역적이고 투명한 가족 관계 표현을 유지하여, 별도의 궁중 칭호를 덧붙이지 않았습니다.
- source_word: אולי הָאָרֶץ
  english_pob_choice: the leading men of the land
  chosen_korean: 그 땅의 유력한 사람들
  alternatives_korean:
  - 그 땅의 용사들
  - 그 땅의 귀족들
  - 그 땅의 지도자들
  lexicon: HALOT
  rationale: 문맥상 사회적으로 두드러진 인물들을 가리키므로, '유력한 사람들'로 옮겨 prominence의 의미를 살렸습니다.
theological_decisions:
- issue: 포로 이동의 이중 표현
  chosen_reading: 앞부분은 '끌고 갔습니다'로 강제적 이동을, 끝부분은 '포로로 옮겼습니다'로 결과 상태를 드러내어, 히브리어의 사역적·서술적 중첩을 함께 살렸습니다.
  alternative_readings:
  - 단순히 '데려갔습니다'로 평이하게 처리
  - '''유배시켰습니다''로 결과만 강조'
  rationale: 본문은 단순 동행이 아니라 강제적 추방을 말하므로, 동작성과 exile를 모두 보존하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 서사 본문의 어휘-의미 보존 원칙
