  text: Zedekiah was twenty-one years old when he became king[a], and he reigned eleven years in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah, from Libnah.
  footnotes:
  - marker: a
    text: Hamutal is also spelled Hamital in some English renderings.
    reason: lexical_alternative
translation:
  language: ko
  text: 시드기야는 왕이 되었을 때 스물한 살이었습니다[a]. 그는 예루살렘에서 열한 해 동안 다스렸습니다. 그의 어머니의 이름은 예레미야의 딸 함우달이었는데, 리브나 출신이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함우달’은 일부 영어 번역에서 Hamital로도 적습니다.
    reason: lexical_alternative
