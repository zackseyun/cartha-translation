  - severity: low
    issue: 출신지 수식의 연결과 어색한 소유격 반복
    rationale: ‘그의 어머니의 이름은 … 리브나 출신이었습니다’는 뜻은 통하지만, ‘리브나 출신’이 하무달을 수식함을 문장 안에서 명시하고 ‘그의 어머니의’를 ‘어머니의’로 간결하게 하는 편이 좋습니다.
