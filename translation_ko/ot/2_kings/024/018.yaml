  to: 시드기야는 왕이 되었을 때 스물한 살이었습니다. 그는 예루살렘에서 열한 해 동안 다스렸습니다. 그의 어머니의 이름은 예레미야의 딸이며 리브나 출신인 하무달이었습니다.
