    text: 또는 ‘무고한 자의 피’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘주님께서는 용서하지 않으셨다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: and also
  chosen_korean: 그리고 또한
  alternatives_korean:
  - 또한
  - 그리고도
  - 게다가
  lexicon: HALOT
  rationale: 앞절의 이유에 덧붙는 추가 원인을 연결하는 말이므로, 연결성과 첨가성을 함께 살리는 ‘그리고 또한’을 택했습니다.
- source_word: דַּם הַנָּקִי
  english_pob_choice: the innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 죄 없는 피
  - 무고한 피
  - 무죄한 사람의 피
  lexicon: HALOT
  rationale: 히브리어의 관용적 ‘피 흘림’과 혈죄의 뉘앙스를 살리기 위해, ‘피’를 유지한 채 ‘무죄한’으로 옮겼습니다.
- source_word: וַיְמַלֵּא אֶת יְרוּשָׁלִַם דָּם נָקִי
  english_pob_choice: for he had filled Jerusalem with innocent blood
  chosen_korean: 예루살렘에 무죄한 피를 가득 채운 일
  alternatives_korean:
  - 예루살렘을 무죄한 피로 채운 일
  - 예루살렘을 무죄한 피로 가득 채운 일
  lexicon: HALOT
  rationale: 히브리어의 ‘채우다’ 동사를 직설적으로 살리되, 한국어 문맥상 결과 사유를 자연스럽게 드러내기 위해 명사화하여 앞뒤 절과 연결했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유명사를 신학적 대체어가 아닌 음역으로 보존하는 POB 기준에 따라 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: ‘용서하시려 하지 않으셨다’의 강도 유지
  chosen_reading: 야훼께서는 그때 용서를 거부하셨다는 의미를 완화하지 않고 그대로 드러냈습니다.
  alternative_readings:
  - 야훼께서는 용서하지 않으셨습니다
  - 야훼께서는 사하지 않으셨습니다
  rationale: 히브리어 אָבָה + לִסְלֹחַ는 단순한 미지정이 아니라 ‘기꺼이 용서하려 하지 않음’의 태도를 나타내므로, 의지적 거부의 뉘앙스를 보존했습니다.
  doctrine_reference: 'Translation philosophy §3: preserve theological tension rather than resolve it.'
