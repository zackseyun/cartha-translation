  source_fidelity: 초안은 피를 흘린 일과 예루살렘을 무죄한 피로 채운 일을 심판의 추가 근거로 제시하고, 야훼께서 용서하기를 원하지 않으셨다는 의미를 대체로 충실히 옮겼습니다. 그러나 וְגַם의 첨가 의미인 ‘또한’이 본문에 빠져 있으며, 두 번째 절의 주어와 목적어 관계를 더 분명히 하는 편이 원문에 가깝습니다.
