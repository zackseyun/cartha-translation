  rationale: 본문은 단순한 패배가 아니라 철저한 군사적 소멸을 말하므로, 결과를 강하게 드러내는 표현을 택했습니다.
  doctrine_reference: 본문의 역사서술이며 교리 쟁점은 없고, 서술 강도 보존이 핵심입니다.
