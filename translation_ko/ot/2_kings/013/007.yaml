  text: כִּ֣י לֹא֩ הִשְׁאִ֨יר לִ/יהוֹאָחָ֜ז עָ֗ם כִּ֣י אִם חֲמִשִּׁ֤ים פָּֽרָשִׁים֙ וַ/עֲשָׂ֣רָה רֶ֔כֶב וַ/עֲשֶׂ֥רֶת אֲלָפִ֖ים רַגְלִ֑י כִּ֤י אִבְּדָ/ם֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יְשִׂמֵ֥/ם כֶּֽ/עָפָ֖ר לָ/דֻֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/007.yaml
  text: For he left Jehoahaz no people except fifty horsemen[a], ten chariots, and ten thousand foot soldiers, because the king of Aram had destroyed them and made them like dust at threshing.
  footnotes:
  - marker: a
    text: Or 'made them like dust for threshing.' The Hebrew verb can evoke trampling in threshing imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 요아하스에게 오십 명의 기병과 열 대의 전차와 만 명의 보병밖에 남기지 않았습니다. 이는 아람 왕이 그들을 멸하여 타작할 때의 먼지처럼 만들어 버렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘타작할 먼지처럼.’ 히브리어 동사는 타작 장면의 짓밟는 이미지를 함께 떠올리게 할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁאִיר
  english_pob_choice: left
  chosen_korean: 남기지 않았습니다
  alternatives_korean:
  - 남겨 두지 않았습니다
  - 두지 않았습니다
  lexicon: HALOT
  rationale: 히필형의 ‘남겨 두다/남기다’라는 결과를 한국어에서 자연스럽게 살렸습니다.
- source_word: עָם
  english_pob_choice: people
  chosen_korean: 보병
  alternatives_korean:
  - 군대
  - 사람들
  lexicon: HALOT
  rationale: 직접적으로는 ‘사람들’이지만, 여기서는 기병·전차와 함께 열거되는 전투 병력 전체를 가리키므로 한국어 본문에서는 마지막 항목을 ‘보병’으로 처리해 군사적 맥락을 분명히 했습니다.
- source_word: פָּרָשִׁים
  english_pob_choice: horsemen
  chosen_korean: 기병
  alternatives_korean:
  - 말 탄 자들
  - 말병
  lexicon: HALOT
  rationale: 말을 탄 전투원을 뜻하므로 현대 한국어에서는 군사 용례가 분명한 ‘기병’이 가장 자연스럽습니다.
- source_word: לָדוּשׁ
  english_pob_choice: at threshing
  chosen_korean: 타작할 때의
  alternatives_korean:
  - 타작할 때의
  - 밟아 으깰 때의
  lexicon: HALOT
  rationale: 어근 דושׁ는 ‘타작하다/짓밟다’의 이미지를 함께 지니므로, POB의 선택을 따라 ‘타작할 때의’로 옮겨 이미지의 긴장을 보존했습니다.
theological_decisions:
- issue: 전멸의 이미지와 비유의 강도
  chosen_reading: ‘먼지처럼 만들어 버렸습니다’로 강한 파괴와 비유를 모두 드러냈습니다.
  alternative_readings:
  - ‘먼지처럼 되게 하셨습니다’
  - ‘먼지처럼 만드셨습니다’
  rationale: 본문은 단순한 패배가 아니라 철저한 군사적 소멸을 말하므로, 결과를 강하게 드러내는 표현을 택했습니다.
  doctrine_reference: 본문의 역사서술이며 교리 쟁점은 없고, 서술 강도 보존이 핵심입니다.
