source:
  edition: WLC
  text: אַ֠ךְ לֹֽא סָ֜רוּ מֵ/חַטֹּ֧אות בֵּית יָרָבְעָ֛ם אֲשֶׁר החטי אֶת יִשְׂרָאֵ֖ל בָּ֣/הּ הָלָ֑ךְ וְ/גַם֙ הָ/אֲשֵׁרָ֔ה עָמְדָ֖ה בְּ/שֹׁמְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/006.yaml
  text: Yet they did not turn away from the sins of the house of Jeroboam[a], by which he caused Israel to sin; in them he walked, and even the Asherah remained standing in Samaria.
  footnotes:
  - marker: a
    text: Or 'the Asherah pole'; the Hebrew term can refer to the Canaanite goddess Asherah or, as likely here, the cult object associated with her worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 여로보암의 집의 죄들에서 떠나지 않았습니다. 그는 그것들 가운데서 걸었고, 사마리아에는 아세라가 여전히 서 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라’는 가나안 여신 아세라를 가리키거나, 여기처럼 그 숭배와 관련된 우상/기둥을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 그렇지만
  - 그런데도
  lexicon: HALOT
  rationale: 앞선 구원 서술과 대비되는 양보·전환을 자연스럽게 드러내는 현대 한국어 연결어로 옮겼습니다.
- source_word: סָרוּ מֵ/חַטֹּ֧אות
  english_pob_choice: did not turn away from the sins
  chosen_korean: 죄들에서 떠나지 않았습니다
  alternatives_korean:
  - 죄들로부터 돌아서지 않았습니다
  - 죄를 버리지 않았습니다
  lexicon: HALOT
  rationale: סור + מן의 ‘돌아서다/떠나다’ 의미를 살리되, 본문이 반복적·집합적 죄행을 가리키므로 복수형 ‘죄들’을 유지했습니다.
- source_word: בֵּית יָרָבְעָ֛ם
  english_pob_choice: the house of Jeroboam
  chosen_korean: 여로보암의 집
  alternatives_korean:
  - 여로보암의 왕조
  - 여로보암의 가문
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 해설적으로 바꾸지 않고, 본문이 말하는 정치·종교적 유산을 드러내는 직역형을 택했습니다.
- source_word: הָלָךְ בָּהּ
  english_pob_choice: he walked in them
  chosen_korean: 그는 그것들 가운데서 걸었고
  alternatives_korean:
  - 그는 그것들 안에서 행했고
  - 그는 그것들을 따랐고
  lexicon: HALOT
  rationale: הלך + ב의 삶의 방식/행위 양식을 한국어의 ‘걷다’로 최대한 보존하면서, 앞의 복수 ‘죄들’에 맞춰 ‘그것들’로 맞췄습니다.
- source_word: הָאֲשֵׁרָה
  english_pob_choice: the Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 목상
  - 아세라 상
  lexicon: HALOT
  rationale: 본문은 명시적으로 ‘기둥’이나 ‘목상’이라는 말을 쓰지 않으므로, 과도한 특정화를 피하고 POB의 주해 가능성을 살리는 음역을 유지했습니다.
- source_word: עָמְדָה בְּ/שֹׁמְרֽוֹן
  english_pob_choice: remained standing in Samaria
  chosen_korean: 사마리아에는 아세라가 여전히 서 있었습니다
  alternatives_korean:
  - 사마리아에 아세라가 계속 서 있었습니다
  - 사마리아에 아세라가 그대로 있었습니다
  lexicon: HALOT
  rationale: עָמַד의 문자적 이미지를 살리면서도 지속 상태를 나타내기 위해 ‘여전히 서 있었습니다’로 옮겼습니다.
theological_decisions:
- issue: 아세라의 지칭
  chosen_reading: 본문은 ‘아세라’로 음역해 두고, 독자가 문맥상 우상 숭배의 대상/상징물로 이해하도록 열어 두었습니다.
  alternative_readings:
  - 아세라 목상
  - 여신 아세라
  rationale: ‘서 있었습니다’라는 서술은 살아 있는 신격보다 숭배용 물체를 더 강하게 시사하지만, 히브리어 자체가 그 범위를 넓게 가지므로 본문에서는 좁히지 않았습니다.
  doctrine_reference: 역사서의 문맥적 우상 비판
