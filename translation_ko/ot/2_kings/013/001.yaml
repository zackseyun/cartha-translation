  yaml_path: translation/ot/2_kings/013/001.yaml
  text: In the twenty-third year of Joash son of Ahaziah, king of Judah, Jehoahaz son of Jehu began to reign over Israel in Samaria, and he reigned seventeen years.
translation:
  language: ko
  text: 유다 왕 아하시야의 아들 요아스의 스물세째 해에, 예후의 아들 여호아하스가 사마리아에서 이스라엘의 왕이 되어 십칠 년 동안 다스렸습니다.
  philosophy: formal
lexical_decisions:
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  english_pob_choice: In the twenty-third year
  chosen_korean: 스물세째 해에
  alternatives_korean:
  - 스물세 해에
  - 스물셋째 해에
  lexicon: 숫자 표현
  rationale: 히브리어 연대 표시는 통상적인 한국어 성경 문체에 맞게 서수로 옮겨, 사건의 시점을 간결하게 제시했습니다.
- source_word: מָלַךְ
  english_pob_choice: began to reign
  chosen_korean: 왕이 되어
  alternatives_korean:
  - 즉위하여
  - 다스리기 시작하여
  lexicon: 왕권 서술
  rationale: 영어 POB의 ‘began to reign’과 달리 히브리어 동사는 왕위에 오름과 통치를 함께 가리키므로, 문맥상 자연스럽게 ‘왕이 되어’로 옮겼습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아 안에서
  - 사마리아에
  lexicon: 지명 전치사
  rationale: 전치사 בְּ의 기본 위치 의미를 살려, 왕권이 시작된 장소를 자연스러운 조사로 표시했습니다.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  english_pob_choice: seventeen years
  chosen_korean: 십칠 년 동안
  alternatives_korean:
  - 열일곱 해 동안
  - 열일곱 년간
  lexicon: 기간 표현
  rationale: 히브리어 연수 표현을 현대 한국어의 시간 지속 표현으로 옮겨, 통치 기간을 분명하게 드러냈습니다.
