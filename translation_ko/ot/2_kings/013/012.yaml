language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י יוֹאָשׁ֙ וְ/כָל אֲשֶׁ֣ר עָשָׂ֔ה וּ/גְב֣וּרָת֔/וֹ אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣ה מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/012.yaml
  text: Now the rest of the acts of Joash[a], and all that he did[b], and his might with which he fought against Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'how he fought against Amaziah king of Judah.' The Hebrew preposition is literally 'with,' but in this military context it denotes hostile engagement.
    reason: lexical_alternative
  - marker: b
    text: This 'Book of the Chronicles of the Kings of Israel' refers to a royal annalistic source cited in Kings, not the biblical book of Chronicles.
    reason: cross_reference
translation:
  language: ko
  text: 여호아스의 남은 행적과 그가 한 모든 일, 그리고 유다 왕 아마샤와 맞서 싸운 그의 용맹[a]은 이스라엘 왕들의 연대기 책[b]에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아마샤와 맞서 싸운’은 히브리어 עִם이 이 군사 문맥에서 대항의 뜻을 띠기 때문에 자연스럽게 풀어 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이스라엘 왕들의 연대기 책’은 성경 역대기가 아니라 열왕기가 인용하는 왕실 연대기 자료를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יוֹאָשׁ
  english_pob_choice: Now the rest of the acts of Joash
  chosen_korean: 요아스의 남은 행적
  alternatives_korean:
  - 요아스의 남은 일들
  - 요아스의 나머지 행적
  lexicon: HALOT
  rationale: 왕조 연대기 공식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 왕의 행적/업적을 가리키므로, 한국어로는 자연스러운 ‘행적’이 가장 적절합니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 그가 행한 모든 것
  - 그가 이룬 모든 일
  lexicon: HALOT
  rationale: כָל אֲשֶׁר עָשָׂה의 포괄성을 살려, 업적을 좁히지 않는 일반적 표현으로 옮겼습니다.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר נִלְחַם עִם
  english_pob_choice: and his might with which he fought against
  chosen_korean: 그리고 유다 왕 아마샤와 싸운 그의 용맹
  alternatives_korean:
  - 그리고 유다 왕 아마샤와 맞서 싸운 그의 힘
  - 그리고 유다 왕 아마샤와 전투한 그의 무용
  lexicon: HALOT
  rationale: גְבוּרָה는 ‘힘’보다 전투 맥락에서 드러나는 ‘용맹’이 더 정확하고, עִם은 이 문맥에서 대항 관계를 나타내므로 ‘와 싸운’으로 자연스럽게 풀었습니다.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까?
  alternatives_korean:
  - 기록되어 있지 않습니까
  - 적혀 있지 않습니까?
  lexicon: HALOT
  rationale: 히브리어의 수사적 반문을 한국어에서도 반문으로 살려, 독자에게 이미 알려진 기록을 환기하는 어조를 유지했습니다.
theological_decisions:
- issue: 연대기 책의 성격
  chosen_reading: ‘이스라엘 왕들의 연대기 책’은 정경 역대기가 아니라 왕실 연대기 자료를 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 정경의 역대기와 연결된 표현으로 보는 읽기
  - 단순한 ‘역사책’으로 완화하는 읽기
  rationale: 본문은 왕들의 사료를 지칭하는 공식 인용문이므로, 정경 제목과 혼동되지 않도록 자료적 성격을 보존했습니다.
  doctrine_reference: 열왕기하의 사료 인용 공식
