translation:
  language: ko
  text: 그러자 그가 이스라엘 왕에게 말했습니다. “네 손을 활 위에 얹으십시오.” 그래서 왕이 손을 얹었습니다. 엘리사는 자기 두 손을 왕의 두 손 위에 얹었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לְמֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: Then he said to the king of Israel
  chosen_korean: 그러자 그가 이스라엘 왕에게 말했습니다
  alternatives_korean:
  - 그리고 그가 이스라엘 왕에게 말했습니다
  - 그가 이스라엘 왕에게 이르렀습니다
  lexicon: HALOT
  rationale: 연속 동사형으로 이어지는 서술을 한국어에서는 자연스럽게 ‘그러자’로 옮겨 사건의 진행을 드러냈습니다.
- source_word: הַרְכֵּב יָדְךָ עַל הַקֶּשֶׁת
  english_pob_choice: Put your hand on the bow
  chosen_korean: 네 손을 활 위에 얹으십시오
  alternatives_korean:
  - 손을 활 위에 두십시오
  - 손을 활 위에 올리십시오
  lexicon: HALOT
  rationale: 히필 명령형의 물리적 동작을 자연스러운 현대 한국어로 옮기되, ‘활 위에’라는 공간 관계를 분명히 살렸습니다.
- source_word: וַיַּרְכֵּב יָדוֹ
  english_pob_choice: So he put his hand on it
  chosen_korean: 그래서 왕이 손을 얹었습니다
  alternatives_korean:
  - 그래서 왕이 그것에 손을 얹었습니다
  - 그래서 왕이 손을 올렸습니다
  lexicon: HALOT
  rationale: 히브리어는 대상을 다시 반복하지 않지만, 한국어에서는 바로 앞의 ‘활’을 받아 ‘손을 얹었습니다’로 자연스럽게 처리했습니다.
- source_word: וַיָּשֶׂם אֱלִישָׁע יָדָיו עַל יְדֵי הַמֶּלֶךְ
  english_pob_choice: and Elisha laid his hands on the king’s hands
  chosen_korean: 엘리사가 자기 손들을 왕의 손들 위에 얹었습니다
  alternatives_korean:
  - 엘리사가 손들을 왕의 손들 위에 얹었습니다
  - 엘리사가 왕의 손 위에 자기 손을 얹었습니다
  lexicon: HALOT
  rationale: 원문이 복수형 ‘손들’을 사용하므로 그 형식을 보존해, 엘리사의 손이 왕의 손 위에 덮이는 장면의 물리적 이미지와 의례적 긴장을 살렸습니다.
theological_decisions:
- issue: 엘리사가 왕의 손 위에 손들을 얹는 행위의 의미
  chosen_reading: 본문에서는 상징적 의미를 해석으로 덧붙이지 않고, 행동 자체를 그대로 제시했습니다.
  alternative_readings:
  - 선지자적 권능의 전달
  - 전투에서의 하나님의 인도 표지
  rationale: 문맥이 이 행위의 뜻을 설명하지만, 이 절 자체의 표현은 단순한 동작 서술이므로 번역문에 해석을 미리 주입하지 않는 편이 원문에 더 충실합니다.
  doctrine_reference: 'Translation philosophy #1 and #3'
