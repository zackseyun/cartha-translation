- from: 그때 여호아하스가 야훼의 얼굴을 구하였고, 야훼께서 그의 말을 들으셨습니다. 이는 그가 이스라엘의 압제를 보셨기 때문입니다. 곧 아람 왕이 그들을 압제하고 있었기 때문입니다.[a][b]
  to: 그때 여호아하스가 야훼께 호의를 구하자, 야훼께서 그의 말을 들으셨습니다. 야훼께서 이스라엘이 받은 압제, 곧 아람 왕이 그들을 압제한 것을 보셨기 때문입니다.[a][b]
  rationale: 본문에서는 חלה את־פני יהוה의 관용적 의미를 ‘야훼께 호의를 구하다’로 정확하고 자연스럽게 옮기고, 직역적 ‘얼굴’ 이미지는 각주에 남겼습니다. 야훼가 보신 대상과 아람 왕의 압제를 한 문장 구조로 연결하여 원문의 인과 관계 및 반복 어근을 보존했습니다.
