  source_fidelity: 원문의 וַיְחַל אֶת־פְּנֵי יְהוָה는 ‘야훼의 얼굴을 구하다’라는 한국어 직역보다 ‘야훼께 호의를 구하다’ 또는 ‘야훼께 간청하다’로 옮겨야 관용구의 실제 의미가 정확히 전달됩니다. 또한 ‘이는 그가 … 보셨기 때문입니다’에서 ‘그’는 야훼를 가리키지만 선행 대상이 불명확하므로 ‘야훼께서’로 명시하는 편이 안전합니다. 나머지 압제와 아람 왕의 표현은 원문 및 영어 감사 기록에 충실합니다.
  naturalness: 합쇼체 문장으로 대체로 자연스럽지만, ‘야훼의 얼굴을 구하였고’는 현대 표준 한국어에서 부자연스럽고 의미가 불명확합니다. ‘이는 … 때문입니다. 곧 … 때문입니다’처럼 이유를 연달아 독립문으로 처리하면 원문의 한 인과 구조가 다소 중복되어 들립니다. 한 문장 안에서 자연스럽게 연결하는 것이 좋습니다.
  terminology: ‘야훼’, ‘여호아하스’, ‘이스라엘’, ‘아람 왕’은 일관되고 적절합니다. לַחַץ/לָחַץ의 반복은 ‘압제’/‘압제하다’로 잘 반영되었습니다. 다만 관용구의 의미는 ‘호의를 구하다’로 번역하고, 직역적 설명은 각주에 보존하는 것이 적절합니다.
