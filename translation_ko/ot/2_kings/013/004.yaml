  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחַ֥ל יְהוֹאָחָ֖ז אֶת פְּנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע אֵלָי/ו֙ יְהוָ֔ה כִּ֤י רָאָה֙ אֶת לַ֣חַץ יִשְׂרָאֵ֔ל כִּֽי לָחַ֥ץ אֹתָ֖/ם מֶ֥לֶךְ אֲרָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/004.yaml
  text: Then Jehoahaz sought the favor of Yahweh[a], and Yahweh listened to him, for he saw the oppression of Israel[b], because the king of Aram oppressed them.
  footnotes:
  - marker: a
    text: Or 'entreated the LORD'; literally, 'softened/appeased the face of the LORD,' an idiom for seeking his favor.
    reason: lexical_alternative
  - marker: b
    text: Aram is the Hebrew name often rendered 'Syria' in older English translations.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 여호아하스가 야훼의 얼굴을 구하였고, 야훼께서 그의 말을 들으셨습니다. 이는 그가 이스라엘의 압제를 보셨기 때문입니다. 곧 아람 왕이 그들을 압제하고 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문자적으로는 ‘야훼의 얼굴을 부드럽게 하다/달래다’라는 뜻이며, 여기서는 호의를 구하는 간청을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 기존 번역에서 흔히 ‘시리아’로 옮겨 온 히브리어 지명입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְחַל אֶת פְּנֵי יְהוָה
  english_pob_choice: sought the favor of Yahweh
  chosen_korean: 야훼의 얼굴을 구하였고
  alternatives_korean:
  - 야훼께 은혜를 구하였고
  - 야훼께 간구하였고
  - 야훼의 호의를 구하였고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 감정 표현이 아니라 하나님께 호의를 구하는 간청이므로, 본문의 이미지인 ‘얼굴’을 살리면서도 문맥상 이해되는 ‘구하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 원문 고유명사 יהוה를 한국어에서 직접 드러내기 위해 ‘야훼’를 사용했습니다. 이는 호칭 ‘주님’으로 대체하지 않고 신적 고유명을 보존하려는 방침에 맞습니다.
- source_word: וַיִּשְׁמַע אֵלָיו
  english_pob_choice: listened to him
  chosen_korean: 그의 말을 들으셨습니다
  alternatives_korean:
  - 그에게 귀를 기울이셨습니다
  - 그를 들으셨습니다
  lexicon: HALOT
  rationale: שמע + אל은 단순 청각이 아니라 응답적 청취를 뜻하므로, 한국어에서는 자연스럽게 ‘그의 말을 들으셨습니다’로 옮겨 인격적 응답을 드러냈습니다.
- source_word: לַחַץ / לָחַץ
  english_pob_choice: the oppression / oppressed
  chosen_korean: 압제 / 압제하고 있었습니다
  alternatives_korean:
  - 억압 / 억압하고 있었습니다
  - 학대 / 학대하고 있었습니다
  - 압박 / 압박하고 있었습니다
  lexicon: HALOT
  rationale: 명사와 동사의 어근 반복을 살리기 위해 같은 어휘군인 ‘압제’와 ‘압제하다’를 사용했습니다. 이는 정치·군사적 강제를 분명하게 드러냅니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: the king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 아람의 왕
  - 시리아 왕
  lexicon: HALOT
  rationale: אֲרָם은 성경 히브리어 지명으로, 후대의 ‘시리아’보다 원문 지명을 보존하는 ‘아람’을 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 여호와 신앙의 고유명을 직접 사용하므로, 이를 칭호로 바꾸지 않고 ‘야훼’로 옮겨 언약적 인격성을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘얼굴을 구하다’ 관용구의 번역 강도
  chosen_reading: 야훼의 얼굴을 구하였고
  alternative_readings:
  - 야훼께 은혜를 구하였고
  - 야훼께 간구하였고
  rationale: 히브리어 관용구의 직유적 이미지를 지우지 않되, 한국어 독자가 의미를 이해할 수 있도록 ‘얼굴을 구하다’로 직역과 의미를 함께 살렸습니다.
  doctrine_reference: 'Translation philosophy: preserve source plain sense over tradition'
