base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/023.yaml
  text: But Yahweh was gracious to them and had compassion on them[a], and he turned toward them because of his covenant with Abraham, Isaac, and Jacob. He was not willing to destroy them, and he did not cast them from his presence until now.
  footnotes:
  - marker: a
    text: Or, 'for the sake of his covenant with Abraham, Isaac, and Jacob.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 그들에게 은혜를 베푸시고 그들을 불쌍히 여기셨으며, 아브라함과 이삭과 야곱과 맺으신 그의 언약 때문에[a] 그들을 향해 얼굴을 돌리셨습니다. 그는 그들을 멸하려 하지 않으셨고, 지금까지도 그들을 자기 앞에서 내쫓지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아브라함과 이삭과 야곱과 맺으신 그의 언약을 위하여’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחָן יְהוָה
  english_pob_choice: Yahweh was gracious
  chosen_korean: 야훼께서는 은혜를 베푸셨습니다
  alternatives_korean:
  - 야훼께서는 호의를 베푸셨습니다
  - 야훼께서는 은총을 베푸셨습니다
  lexicon: HALOT
  rationale: חנן은 값없이 베푸는 호의와 은혜를 뜻하므로, 한국어에서는 신학적 뉘앙스를 살리는 ‘은혜를 베푸시다’가 가장 자연스럽고 충실합니다.
- source_word: וַיְרַחֲמֵם
  english_pob_choice: had compassion on them
  chosen_korean: 그들을 불쌍히 여기셨습니다
  alternatives_korean:
  - 그들에게 긍휼을 베푸셨습니다
  - 그들에게 자비를 보이셨습니다
  lexicon: HALOT
  rationale: רחם은 깊은 연민과 긍휼을 가리키므로, 감정적·관계적 뉘앙스를 직접 드러내는 ‘불쌍히 여기다’가 문맥에 맞습니다.
- source_word: וַיִּפֶן אֲלֵיהֶם
  english_pob_choice: he turned toward them
  chosen_korean: 그들을 향해 얼굴을 돌리셨습니다
  alternatives_korean:
  - 그들에게로 돌이키셨습니다
  - 그들을 향해 돌아보셨습니다
  lexicon: HALOT
  rationale: 직역하면 ‘그들에게로 향하다/돌아서다’이지만, 히브리어 관용구가 담는 호의적 주의를 살리기 위해 ‘얼굴을 돌리셨다’로 옮겼습니다.
- source_word: לְמַעַן בְּרִיתוֹ אֶת אַבְרָהָם יִצְחָק וְיַעֲקֹב
  english_pob_choice: because of his covenant with Abraham, Isaac, and Jacob
  chosen_korean: 아브라함과 이삭과 야곱과 맺으신 그의 언약 때문에
  alternatives_korean:
  - 아브라함과 이삭과 야곱과 맺으신 그의 언약을 위해
  - 아브라함과 이삭과 야곱과의 그의 언약을 위해
  lexicon: HALOT
  rationale: לְמַעַן은 여기서 원인/근거를 나타내며, בְּרִיתוֹ는 족장들과 맺으신 언약을 가리키므로 한국어에서는 ‘~때문에’가 가장 분명합니다.
- source_word: וְלֹא הִשְׁלִיכָם מֵעַל פָּנָיו
  english_pob_choice: he did not cast them from his presence
  chosen_korean: 그들을 자기 앞에서 내쫓지 않으셨습니다
  alternatives_korean:
  - 그들을 자기 앞에서 쫓아내지 않으셨습니다
  - 그들을 자기 얼굴 앞에서 던져 버리지 않으셨습니다
  lexicon: HALOT
  rationale: ‘from his presence’의 관계적·언약적 의미를 한국어에서 자연스럽게 드러내기 위해 ‘자기 앞에서 내쫓다’로 옮겼습니다.
theological_decisions:
- issue: YHWH(יהוה)의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신적 고유명 יְהוָה를 직접 사용하므로, 전통적 대체어보다 고유명을 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 문장 말미의 문맥적 결과를 ‘until now’로 유지할지 여부
  chosen_reading: 지금까지도 그들을 자기 앞에서 내쫓지 않으셨습니다
  alternative_readings:
  - 오늘날까지 그들을 자기 앞에서 내쫓지 않으셨습니다
  - 지금까지 그들을 버리지 않으셨습니다
  rationale: עַד עָתָּה는 서술자의 현재까지 지속되는 상태를 가리키므로, 시간적 지속성과 언약적 보존을 함께 살렸습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
