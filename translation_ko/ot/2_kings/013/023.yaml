  source_fidelity: 본문의 핵심 의미는 대체로 정확합니다. וַיָּחָן과 וַיְרַחֲמֵם은 각각 ‘은혜를 베푸시고’와 ‘불쌍히 여기셨으며’로 적절히 구별되었고, 언약이 야훼의 행동의 근거라는 점과 ‘멸하려 하지 않으셨고’라는 의지의 뉘앙스도 보존되었습니다. 다만 영어 감사 기록의 각주가 가리키는 대안은 לְמַעַן(‘~ 때문에/~을 위하여’)에 관한 것이므로, 현행처럼 ‘불쌍히 여기셨으며’에 각주를 붙이는 것은 앵커와 내용이 맞지 않습니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. ‘그들을 향해 얼굴을 돌리셨습니다’는 히브리어의 표상을 보존하는 가능한 표현입니다. ‘자기 앞에서 내쫓지 않으셨습니다’도 문맥상 야훼의 임재에서 내쫓지 않으셨다는 뜻을 자연스럽게 전달합니다.
