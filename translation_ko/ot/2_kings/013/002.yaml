base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/002.yaml
  text: He did what was evil in the eyes of Yahweh and walked after the sins of Jeroboam son of Nebat[a], who caused Israel to sin; he did not turn away from them.
  footnotes:
  - marker: a
    text: Or, more formally, 'he did not turn away from it.' The Hebrew has a feminine singular suffix, likely referring collectively to Jeroboam's sin-pattern.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 하였고, 느밧의 아들 여로보암의 죄들을 따라 걸었으며, 그 죄들에서 돌아서지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성 단수 접미사를 사용하지만, 문맥상 여로보암의 죄의 패턴 전체를 가리키는 집합적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע בְּעֵינֵי יְהוָה
  english_pob_choice: He did what was evil in the eyes of Yahweh
  chosen_korean: 야훼 보시기에 악한 일을 하였고
  alternatives_korean:
  - 야훼 보시기에 악을 행하였고
  - 야훼 눈에 악한 일을 하였고
  lexicon: HALOT
  rationale: 열왕기의 관용구를 살리되, 현대 한국어에서 자연스럽게 들리도록 ‘악한 일을 하다’로 옮겼습니다. ‘보시기에’는 평가의 기준이 야훼께 있음을 드러냅니다.
- source_word: וַיֵּלֶךְ אַחַר חַטֹּאת
  english_pob_choice: walked after the sins
  chosen_korean: 죄들을 따라 걸었으며
  alternatives_korean:
  - 죄들을 따랐으며
  - 죄의 길을 걸었으며
  lexicon: HALOT
  rationale: אַחַר의 추종/추구 이미지를 유지하기 위해 ‘따라 걸다’로 옮겼습니다. 복수형 ‘죄들’은 여로보암의 반복적 죄 패턴을 반영합니다.
- source_word: יָרָבְעָם בֶּן נְבָט
  english_pob_choice: Jeroboam son of Nebat
  chosen_korean: 느밧의 아들 여로보암
  alternatives_korean:
  - 느밧의 아들인 여로보암
  - 여로보암 느밧의 아들
  lexicon: HALOT
  rationale: 히브리어 친족표현을 표준적인 한국어 성경식 어순으로 옮겼습니다. 고유명사는 통용 표기를 따랐습니다.
- source_word: לֹא סָר מִמֶּנָּה
  english_pob_choice: he did not turn away from them
  chosen_korean: 그 죄들에서 돌아서지 않았습니다
  alternatives_korean:
  - 그것에서 돌아서지 않았습니다
  - 그 죄들에서 떠나지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 여성 단수 접미사는 직전의 죄 패턴을 집합적으로 가리킬 가능성이 있어, POB의 문맥 반영을 따라 복수 ‘그 죄들’로 풀었습니다. ‘돌아서지 않았다’는 סור의 의미를 자연스럽게 전달합니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
