  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
  footnotes:
  - marker: a
    text: Or possibly, “So he took for himself a bow and arrows,” though the Hebrew more naturally reads “to him,” referring to Elisha.
