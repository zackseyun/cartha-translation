  yaml_path: translation/ot/2_kings/013/015.yaml
  text: Then Elisha said to him[a], “Take a bow and arrows.” So he took a bow and arrows.
  footnotes:
  - marker: a
    text: Or possibly, “So he took for himself a bow and arrows,” though the Hebrew more naturally reads “to him,” referring to Elisha.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리사가 그에게 말했습니다. “활과 화살을 가져오십시오.” 그래서 그가 그에게 활과 화살을 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그에게”입니다. 문맥상 엘리사를 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר לּוֹ
  english_pob_choice: Then Elisha said to him
  chosen_korean: 그때 엘리사가 그에게 말했습니다
  alternatives_korean:
  - 그리고 엘리사가 그에게 말했습니다
  - 엘리사가 그에게 말했습니다
  lexicon: WLC / HALOT
  rationale: 연속 서술의 וַיֹּאמֶר는 한국어에서 자연스러운 시간 진행을 살려 ‘그때’로 옮기고, לּוֹ는 직접 대상인 ‘그에게’로 분명히 드러냈습니다.
- source_word: קַח
  english_pob_choice: Take
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 취하십시오
  - 잡으십시오
  lexicon: HALOT
  rationale: 명령형 לקח는 문맥상 단순히 ‘받다’보다 손에 들고 오게 하는 행동을 요구하므로, 한국어에서는 직접적이고 자연스러운 명령인 ‘가져오십시오’로 옮겼습니다.
- source_word: קֶשֶׁת וְחִצִּים
  english_pob_choice: a bow and arrows
  chosen_korean: 활과 화살
  alternatives_korean:
  - 활 하나와 화살들
  - 활과 화살들
  lexicon: HALOT
  rationale: 히브리어는 관사가 없지만 한국어에서는 문맥상 자연스럽게 무관사로 처리하며, 반복된 목적어를 유지해 대상 물품을 분명히 했습니다.
- source_word: וַיִּקַּח
  english_pob_choice: So he took
  chosen_korean: 그래서 그가 ... 가져왔습니다
  alternatives_korean:
  - 그리고 그가 ... 가져왔습니다
  - 그가 ... 가져왔습니다
  lexicon: HALOT
  rationale: 서술 진행의 와우 연속은 결과/응답의 흐름을 드러내는 ‘그래서’로 자연스럽게 표현했습니다.
