translation:
  language: ko
  text: 그때 엘리사가 그에게 말했습니다. “활과 화살을 가져오십시오.” 그래서 그가 활과 화살을 가져왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “그에게”이지만, 문맥상 엘리사에게 물건을 가져오는 장면입니다.
    reason: source_note
