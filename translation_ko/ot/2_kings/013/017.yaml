    rationale: ‘아람을 쳐서 그것을 멸하기까지 할 것입니다’는 ‘-기까지 하다’의 결합이 어색하고 ‘그것’의 지시 대상도 한국어에서 불필요하게 딱딱합니다. 아람을 직접 목적어로 유지하면서 종결성을 ‘마침내 멸망시키다’로 표현하는 편이 자연스럽습니다.
