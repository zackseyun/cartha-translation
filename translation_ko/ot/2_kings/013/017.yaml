    rationale: 이 소유격 번역도 가능하지만, 이 문맥의 ל는 야훼에게서 오는 승리·구원의 근원을 나타내는 것으로 이해하는 것이 더 직접적입니다. ‘야훼께서 주시는’은 신학적 해석을 과도하게 더하지 않으면서 이 관계를 자연스럽게 드러냅니다.
  - severity: medium
