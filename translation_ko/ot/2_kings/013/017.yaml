base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/017.yaml
  text: Then he said[a], “Open the window eastward,” and he opened it. Then Elisha said, “Shoot,” and he shot. And he said, “Yahweh’s arrow of victory, the arrow of victory over Aram! For you will strike Aram at Aphek until you have destroyed it.”
  footnotes:
  - marker: a
    text: Or “an arrow of salvation from the LORD, an arrow of salvation against Aram.” The Hebrew term can also mean “salvation” or “deliverance.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「동쪽을 향한 창을 여십시오」 하니 그가 열었습니다. 엘리사가 말했습니다. 「쏘십시오」 하니 그가 쏘았습니다. 그러고는 말했습니다. 「야훼의 승리의 화살, 아람에 대한 승리의 화살입니다! 당신은 아펙에서 아람을 쳐서 그것을 멸하기까지 할 것입니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼로부터 오는 구원의 화살, 아람에 대한 구원의 화살”입니다. 히브리어 תְּשׁוּעָה는 “구원” 또는 “구출”의 뜻도 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּתַח הַחַלּוֹן קֵדְמָה
  english_pob_choice: Open the window eastward
  chosen_korean: 동쪽을 향한 창을 여십시오
  alternatives_korean:
  - 동쪽 창을 여십시오
  - 동쪽으로 창을 여십시오
  lexicon: HALOT
  rationale: קֵדְמָה는 방향 부사이므로 ‘동쪽을 향한’으로 살려, 히브리어의 방향 지시를 자연스러운 한국어로 옮겼습니다.
- source_word: יְרֵה
  english_pob_choice: Shoot
  chosen_korean: 쏘십시오
  alternatives_korean:
  - 발사하십시오
  - 화살을 쏘십시오
  lexicon: HALOT
  rationale: 활쏘기 맥락의 명령형을 간결하게 살려 ‘쏘십시오’로 옮겼습니다. ‘발사하다’는 시대감이 맞지 않고, ‘화살을’은 원문에 없는 목적어를 덧붙입니다.
- source_word: חֵץ תְּשׁוּעָה לַיהוָה וְחֵץ תְּשׁוּעָה בַאֲרָם
  english_pob_choice: Yahweh’s arrow of victory ... the arrow of victory over Aram
  chosen_korean: 야훼의 승리의 화살, 아람에 대한 승리의 화살
  alternatives_korean:
  - 야훼의 구원의 화살, 아람에 대한 구원의 화살
  - 야훼의 구출의 화살, 아람을 향한 승리의 화살
  lexicon: HALOT
  rationale: תְּשׁוּעָה는 ‘구원/구출/승리’ 모두 가능하지만, 전투적 표지 행위의 맥락에서는 ‘승리’가 가장 직접적으로 의미를 전달합니다. לַיהוָה는 소유격처럼 풀어 ‘야훼의’로 옮겼습니다.
- source_word: וְהִכִּיתָ אֶת אֲרָם בַּאֲפֵק עַד כַּלֵּה
  english_pob_choice: For you will strike Aram at Aphek until you have destroyed it
  chosen_korean: 당신은 아펙에서 아람을 쳐서 그것을 멸하기까지 할 것입니다
  alternatives_korean:
  - 당신은 아펙에서 아람을 쳐부수어 끝내게 될 것입니다
  - 당신은 아펙에서 아람을 치고 그것을 다 멸할 것입니다
  lexicon: HALOT
  rationale: נכה는 기본적으로 ‘치다/치다(격파하다)’의 뜻을 살려 ‘치다’로 옮겼고, כּלה는 완전한 종결·멸망의 의미를 반영해 ‘멸하다’로 옮겼습니다. ‘그것’은 아람 군세를 가리키는 대명사로 처리했습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  lexicon: HALOT
  rationale: 고유명사는 현대 외래어 표기와 성경학적 표기를 따라 ‘아람’으로 음역했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 원칙에 따라 YHWH는 ‘야훼’로 옮겼습니다. 본문이 하나님의 직접 발화를 담고 있어 이 표기를 유지하는 것이 원문 표지성을 가장 잘 보존합니다.
  doctrine_reference: Contested terms — יְהוָה YHWH → 야훼
- issue: תְּשׁוּעָה의 의미 범위
  chosen_reading: 승리
  alternative_readings:
  - 구원
  - 구출
  - 해방
  rationale: 본문은 상징적 화살 예식과 이어지는 대아람 전쟁 예언이므로, 추상적 신학어보다 전투 승리를 가리키는 뜻이 우선합니다. 다만 ‘승리’는 야훼가 주시는 구원이라는 배경 의미를 배제하지 않습니다.
  doctrine_reference: 전쟁 서사의 신적 구원 개념과 군사적 성취의 결합
