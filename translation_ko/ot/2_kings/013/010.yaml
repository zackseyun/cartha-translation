  text: In the thirty-seventh year of Joash king of Judah[a], Jehoash son of Jehoahaz became king over Israel in Samaria, and he reigned sixteen years.
  footnotes:
  - marker: a
    text: Hebrew distinguishes the Judean king יוֹאָשׁ (Joash) from the Israelite king יְהוֹאָשׁ (Jehoash); English tradition sometimes renders both as 'Joash.'
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 요아스의 서른일곱째 해에 요아하스의 아들 여호아스가 사마리아에서 이스라엘의 왕이 되어 열여섯 해 동안 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞의 유다 왕 יוֹאָשׁ(요아스)과 뒤의 이스라엘 왕 יְהוֹאָשׁ(여호아스)을 철자상 구별합니다. 한국어 본문도 이 차이를 반영했습니다.
    reason: lexical_alternative
