  text: וַ/יָּ֥מָת אֱלִישָׁ֖ע וַֽ/יִּקְבְּרֻ֑/הוּ וּ/גְדוּדֵ֥י מוֹאָ֛ב יָבֹ֥אוּ בָ/אָ֖רֶץ בָּ֥א שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/020.yaml
  text: Then Elisha died, and they buried him. Now raiding bands of Moab used to come into the land at the coming of the year.
  footnotes:
  - marker: a
    text: Or 'in the spring of the year'; the Hebrew literally says 'at the coming of the year,' an idiom for the turn of the year, often associated with the campaigning season.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리사가 죽었고, 사람들이 그를 장사 지냈습니다. 모압의 약탈대는 해가 바뀔 무렵이면 그 땅으로 들어오곤 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘한 해가 올 때에’입니다. 이는 한 해가 바뀌는 시기를 가리키는 관용구이며, 흔히 군사 원정이 재개되는 시기와 관련된 것으로 이해됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: Then ... died
  chosen_korean: 그때 ... 죽었고
  alternatives_korean:
  - 그리고 ... 죽었습니다
  - 그리하여 ... 죽었습니다
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 연결어로, 단순한 죽음을 자연스러운 한국어 서술 순서로 옮기되 과도한 해석은 피했습니다.
- source_word: וַיִּקְבְּרֻהוּ
  english_pob_choice: and they buried him
  chosen_korean: 사람들이 그를 장사했습니다
  alternatives_korean:
  - 그를 묻었습니다
  - 그를 매장했습니다
  lexicon: HALOT
  rationale: 히브리어는 능동 복수형이므로 주어를 막연한 복수인 ‘사람들이’로 살리고, 관용적이면서도 문어체인 ‘장사했습니다’를 택했습니다.
- source_word: גְדוּדֵי מוֹאָב
  english_pob_choice: raiding bands of Moab
  chosen_korean: 모압의 습격대
  alternatives_korean:
  - 모압의 약탈 무리
  - 모압의 침입대
  lexicon: HALOT
  rationale: גְדוּד의 약탈·기습 뉘앙스를 살려 단순한 ‘군대’보다 ‘습격대’로 옮겼습니다.
- source_word: בָּא שָׁנָה
  english_pob_choice: at the coming of the year
  chosen_korean: 해가 바뀌는 때마다
  alternatives_korean:
  - 해가 바뀔 무렵
  - 연초마다
  - 해의 시작에
  lexicon: HALOT
  rationale: 직역하면 ‘해의 옴’이지만, 문맥상 군사 활동이 재개되는 연중 전환기를 가리키는 관용구로 보고 자연스러운 현대 한국어로 풀었습니다.
theological_decisions:
- issue: 연대적·관습적 부사구의 처리
  chosen_reading: ‘해가 바뀌는 때마다’로 옮겨, 단발 사건이 아니라 반복되는 관습적 행동을 드러냈습니다.
  alternative_readings:
  - ‘해가 바뀔 무렵에’
  - ‘봄이 올 때마다’
  rationale: 본문의 imperfect 동사와 관용구가 함께 만들어 내는 반복성을 보존하려 했습니다. ‘봄’은 가능한 함의이지만 원문이 직접 말하는 것은 아니므로 본문에는 넣지 않았습니다.
  doctrine_reference: 서사 문맥의 반복 행위 표지
