  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּ֖מָת חֲזָאֵ֣ל מֶֽלֶךְ אֲרָ֑ם וַ/יִּמְלֹ֛ךְ בֶּן הֲדַ֥ד בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/024.yaml
  text: Then Hazael king of Aram died[a], and Ben-hadad his son became king in his place.
  footnotes:
  - marker: a
    text: Or 'king of Syria.' The Hebrew reads 'Aram,' the name of the kingdom traditionally rendered 'Syria' in older English versions.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아람 왕 하사엘이 죽었습니다[a]. 그리고 그의 아들 벤하닷이 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시리아 왕’. 히브리어 본문은 ‘아람’이라고 읽으며, 이것은 옛 영어 역본들에서 전통적으로 ‘Syria’로 옮긴 왕국 이름입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 별세했습니다
  - 사망했습니다
  lexicon: HALOT
  rationale: 서사 과거형 מות의 직접적 의미를 자연스러운 현대 한국어로 옮겼습니다. 왕의 죽음을 완곡하게 돌리지 않고 사건 진행을 분명히 드러냅니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 시리아 왕
  - 아람의 왕
  lexicon: HALOT
  rationale: 이 절의 מקור어 אֲרָם을 따라 ‘아람’으로 옮겼습니다. 전통적 ‘시리아’는 해석이 더해진 표현이므로 본문 직역성을 위해 피했습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스리기 시작했습니다
  - 즉위했습니다
  lexicon: HALOT
  rationale: 계승 문맥의 מלך는 통치 기간보다 즉위/계승을 가리키므로, 자연스럽고 의미가 분명한 ‘왕이 되었습니다’로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그를 대신하여
  - 그의 자리에서
  lexicon: HALOT
  rationale: 왕위 계승 공식을 한국어로 자연스럽게 살리되, 단순한 시점 순서가 아니라 교체 관계를 분명히 하기 위해 ‘그의 뒤를 이어’를 선택했습니다.
theological_decisions:
- issue: אַׁרָם를 한국어 역사명으로 어떻게 처리할지
  chosen_reading: 아람
  alternative_readings:
  - 시리아
  rationale: 본문의 지리·정치적 실체를 히브리어 고유명 그대로 반영하는 것이 이 절의 역사 서술을 더 정확하게 보존합니다.
  doctrine_reference: 역사·지리 번역 원칙
