  terminology: ‘여호아하스’, ‘남은 행적’, ‘이스라엘 왕들의 역대기 책’은 문맥과 한국어 관용에 맞습니다. ‘역대기’가 여기서는 성경의 역대기가 아니라 왕들의 연대 기록을 뜻한다는 점은 대체 번역 각주로 보완합니다. 각주 표지는 각각 해당 어구 바로 뒤에 배치했습니다.
