source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֧י יְהוֹאָחָ֛ז וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וּ/גְבוּרָת֑/וֹ הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/008.yaml
  text: Now the rest of the acts of Jehoahaz[a], and all that he did[b], and his might—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'the annals of the kings of Israel.'
    reason: lexical_alternative
  - marker: b
    text: '''His might'' may also be rendered ''his power,'' ''his valor,'' or ''his mighty deeds.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 여호아하스의 남은 행적과 그가 행한 모든 일, 그리고 그의 용맹이 기록되어 있지 않습니까? 곧 이스라엘 왕들의 역대기 책에 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 왕들의 연대기’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 용맹’은 ‘그의 힘’, ‘그의 능력’, 또는 ‘그의 무용’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts
  chosen_korean: 남은 행적
  alternatives_korean:
  - 남은 일들
  - 그 남은 사건들
  - 그 남은 행위들
  lexicon: HALOT
  rationale: 왕의 통치 기록을 가리키는 관용구이므로, ‘행적’이 דִּבְרֵי의 폭넓은 역사적 의미를 자연스럽게 살리면서도 지나치게 문어적이지 않습니다.
- source_word: וּגְבוּרָתוֹ
  english_pob_choice: and his might
  chosen_korean: 그의 용맹
  alternatives_korean:
  - 그의 힘
  - 그의 능력
  - 그의 무용
  lexicon: HALOT
  rationale: גְּבוּרָה는 단순한 물리적 힘보다 전투적 용기와 업적의 뉘앙스를 가질 수 있어, 여기서는 한국어에서 자연스럽고 함의가 살아 있는 ‘용맹’을 택했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기 책
  alternatives_korean:
  - 이스라엘 왕들의 연대기 책
  - 이스라엘 왕들의 사적 기록책
  - 이스라엘 왕들의 역대록
  lexicon: HALOT
  rationale: 고대 왕실 연대기 제목으로서 관용적인 표현을 따르되, ‘역대기’로 דִּבְרֵי הַיָּמִים의 기록 문서 성격을 살렸습니다. '책'은 סֵפֶר에 대응합니다.
theological_decisions:
- issue: 수사적 질문인 הֲלוֹא의 처리
  chosen_reading: ‘기록되어 있지 않습니까?’로 옮겨, 독자가 이미 그렇다는 전제를 받아들이도록 했습니다.
  alternative_readings:
  - ‘기록되어 있지 않습니까?’
  - ‘기록되어 있지 않습니까?’보다 직설적인 ‘기록되어 있지 않습니까?’
  rationale: 이 왕정 결산 공식은 정보 요청이 아니라 독자를 설득하는 수사 의문입니다. 한국어에서도 동일한 효과를 유지해야 합니다.
  doctrine_reference: 본문의 서술 수사 유지
