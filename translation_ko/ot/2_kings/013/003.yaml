base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/003.yaml
  text: So Yahweh’s anger burned against Israel[a], and he gave them into the hand of Hazael king of Aram, and into the hand of Ben-hadad son of Hazael[c][b], all those days.
  footnotes:
  - marker: a
    text: Or 'all the days'—that is, throughout that period.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into the hand of,' an idiom meaning into the power or control of.
    reason: lexical_alternative
  - marker: c
    text: Aram is the Hebrew name often rendered 'Syria' in older English translations.
    reason: alternative_reading
translation:
  language: ko
  text: 그러므로 야훼께서 이스라엘에게 진노하셨고, 하사엘 아람 왕의 손과 하사엘의 아들 벤하닷의 손에 그들을 넘기셨습니다[a][b][c]. 그렇게 그 모든 날 동안 그러하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 모든 날’—곧 그 기간 전체를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘손에’는 여기서 누구의 통제 아래에 들어가게 되었다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 아람은 옛 번역들에서 종종 ‘시리아’로 옮겨졌습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּחַר אַף
  english_pob_choice: anger burned
  chosen_korean: 진노하셨고
  alternatives_korean:
