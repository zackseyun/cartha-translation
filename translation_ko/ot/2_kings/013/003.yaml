  rationale: 주석 기준에 따라 신적 고유명사를 대체 호칭이 아닌 ‘야훼’로 옮겨 원문 고유성을 보존했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
