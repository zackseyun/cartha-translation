revisions:
- from: 그때 요아스는 여호아하스의 아들로서 벤하닷, 곧 하사엘의 아들의 손에서 성읍들을 되찾아 왔습니다. 그 벤하닷은 전쟁 중에 요아하스 그의 아버지의 손에서 그것들을 빼앗았었습니다. 요아스가 그를 세 번 쳤고, 이스라엘의 성읍들을 회복하였습니다.[a][b]
  to: 그때 여호아하스의 아들 여호아스가 하사엘의 아들 벤하닷의 손에서, 그가 전쟁에서 그의 아버지 여호아하스에게서 빼앗았던 성읍들을 되찾았습니다. 요아스[a]가 그를 세 번 쳤습니다[b]. 그리고 이스라엘의 성읍들을 회복했습니다.
  rationale: 첫 왕명을 원문의 긴형에 따라 ‘여호아스’로 바로잡고, 후반의 짧은형 ‘요아스’와 구별했습니다. 원문의 회복·탈환 의미는 ‘되찾았습니다’로, הִכָּהוּ의 기본 의미는 ‘쳤습니다’로 보존했습니다. 문장 구조와 각주 표지를 정리했을 뿐, 승리의 원인이나 신학적 의미를 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:55:11Z'
