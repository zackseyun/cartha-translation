base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/025.yaml
  text: Then Jehoash son of Jehoahaz regained and took back the cities from the hand of Ben-hadad son of Hazael[a], which he had taken from the hand of Jehoahaz his father in war. Three times Joash struck him[b], and he restored the cities of Israel.
  footnotes:
  - marker: a
    text: 'Hebrew uses two forms of the same royal name in this verse: ''Jehoash'' earlier and ''Joash'' later.'
    reason: lexical_alternative
  - marker: b
    text: Or 'defeated him.' The Hebrew verb can denote striking in battle with the sense of military defeat.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요아스는 여호아하스의 아들로서 벤하닷, 곧 하사엘의 아들의 손에서 성읍들을 되찾아 왔습니다. 그 벤하닷은 전쟁 중에 요아하스 그의 아버지의 손에서 그것들을 빼앗았었습니다. 요아스가 그를 세 번 쳤고, 이스라엘의 성읍들을 회복하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절에서 같은 왕 이름을 두 형태로 사용합니다. 앞부분은 ‘여호아스’, 뒷부분은 ‘요아스’입니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘그를 쳤다’입니다. 전투 문맥에서는 ‘무찔렀다’ 또는 ‘패배시켰다’의 뜻이 될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: took back
  chosen_korean: 되찾아 왔습니다
  alternatives_korean:
  - 돌아왔습니다
  - 되돌렸습니다
  - 다시 차지했습니다
  lexicon: HALOT
  rationale: שוב의 회복·재획득 의미를 살려, 단순한 ‘돌아오다’보다 잃었던 것을 다시 손에 넣는 뜻을 분명히 했습니다.
- source_word: וַיִּקַּח אֶת הֶעָרִים
  english_pob_choice: took back the cities
  chosen_korean: 성읍들을 되찾아 왔습니다
  alternatives_korean:
  - 성읍들을 빼앗아 왔습니다
  - 성읍들을 취했습니다
  - 도시들을 되찾았습니다
  lexicon: HALOT
  rationale: עָרִים을 역사 문맥에 맞게 ‘성읍들’로 옮기고, 이미 잃은 것을 다시 가져오는 군사·정치적 맥락을 ‘되찾아’로 반영했습니다.
- source_word: מִיַּד
  english_pob_choice: from the hand of
  chosen_korean: ~의 손에서
  alternatives_korean:
  - ~로부터
  - ~의 권세에서
  - ~의 지배에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 투명하게 보존해, 단순한 출처가 아니라 통제권·지배권의 이전을 드러냈습니다.
- source_word: הִכָּהוּ
  english_pob_choice: struck him
  chosen_korean: 그를 세 번 쳤고
  alternatives_korean:
  - 그를 세 번 무찔렀고
  - 그를 세 번 쳤습니다
  - 그를 세 번 패배시켰고
  lexicon: HALOT
  rationale: נכה의 기본 뜻을 따라 ‘쳤고’로 옮기되, 전투 맥락을 유지하기 위해 횟수를 함께 살렸습니다. 별도의 ‘패배시켰다’는 해석적이어서 본문에는 넣지 않았습니다.
- source_word: יוֹאָשׁ
  english_pob_choice: Joash
  chosen_korean: 요아스
  alternatives_korean:
  - 여호아스
  lexicon: 표준 음역
  rationale: 본문 후반의 קצר형 יוֹאָשׁ을 반영해 ‘요아스’로 옮겼고, 앞의 יְהוֹאָשׁ는 ‘여호아스’로 구별했습니다.
theological_decisions:
- issue: 왕의 승리가 야훼의 직접 언급 없이 서술되는 방식
  chosen_reading: 본문은 왕의 군사적 회복을 역사 서술로 담담히 말하며, 승리의 원인을 직접 신학화하지 않습니다.
  alternative_readings:
  - 하나님의 개입을 암시하는 신학적 문장으로 강화하기
  - 왕의 능력에만 초점을 맞추어 번역하기
  rationale: 원문이 서술하는 범위를 넘지 않도록, 신학적 해석을 덧붙이지 않고 사건 자체의 회복 서술을 유지했습니다.
  doctrine_reference: 서술 본문 절제 원칙
- issue: 같은 왕 이름의 긴형/짧은형 구분
  chosen_reading: 앞에서는 여호아스, 뒤에서는 요아스로 구분해 옮겼습니다.
  alternative_readings:
  - 모두 여호아스로 통일하기
  - 모두 요아스로 통일하기
  rationale: 히브리어가 같은 인물을 서로 다른 형태로 표기하므로, 번역에서도 형태 차이를 보여 주되 동일 인물임을 문맥으로 식별하게 했습니다.
  doctrine_reference: 고유명사 표기 원칙
