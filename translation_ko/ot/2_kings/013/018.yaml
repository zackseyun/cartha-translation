  text: Then he said[a], “Take the arrows,” and he took them. And he said to the king of Israel, “Strike the ground,” and he struck it three times and stopped.
  footnotes:
  - marker: a
    text: Or “and stood still”; the Hebrew verb is literally “stood,” here functioning idiomatically to mean that he stopped after striking three times.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “화살들을 집으십시오.” 그러자 이스라엘 왕이 화살들을 집었습니다. 그가 이스라엘 왕에게 말했습니다. “땅을 치십시오.” 왕이 땅을 세 번 치고 멈추었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘섰다’이지만, 여기서는 세 번 친 뒤 행동을 멈추었다는 뜻으로 쓰입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח / הַחִצִּים
  english_pob_choice: Take the arrows
  chosen_korean: 「화살들을 가져오십시오」
  alternatives_korean:
  - 「화살들을 가져라」
  - 「화살을 가져오십시오」
  lexicon: HALOT
  rationale: 명령형 לקח의 직접성을 살리되, 현대 한국어에서는 복수라도 자연스럽게 ‘화살들을’로 옮기고, 대화체 명령은 합쇼체로 맞췄습니다.
- source_word: וַיִּקָּח
  english_pob_choice: and he took them
  chosen_korean: 그가 가져왔습니다
  alternatives_korean:
  - 그가 가져갔습니다
  - 그가 그것들을 가져왔습니다
  lexicon: HALOT
  rationale: 문맥상 앞의 화살들을 다시 받았다는 뜻이므로, 반복을 줄이면서도 동작을 자연스럽게 살려 ‘가져왔습니다’로 옮겼습니다.
- source_word: הַךְ אַרְצָה
  english_pob_choice: Strike the ground
  chosen_korean: 「땅을 치십시오」
  alternatives_korean:
  - 「땅을 치세요」
  - 「땅을 치라」
  - 「땅을 치십시오, 그리고 치십시오」
  lexicon: HALOT
  rationale: אַרְצָה를 ‘땅’으로 옮겨 방향성을 분명히 하고, ‘치다’로 כוח 있는 명령의 뉘앙스를 유지했습니다.
- source_word: וַיַּעֲמֹד
  english_pob_choice: and stopped
  chosen_korean: 멈췄습니다
  alternatives_korean:
  - 그쳤습니다
  - 서 있었습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 ‘섰다’이지만, 여기서는 세 번 친 뒤 행동을 중단했다는 관용적 의미이므로 POB의 판단을 따라 ‘멈췄습니다’로 옮겼습니다.
theological_decisions:
- issue: 명령 발화의 존대 수준
  chosen_reading: 왕에게 한 말은 서술은 합쇼체로, 직접 인용 명령도 합쇼체로 처리했습니다.
  alternative_readings:
  - 직접 인용을 하오체/반말로 낮추는 방식
  - 서술문과 인용문 모두 평서형으로 통일하는 방식
  rationale: 본문은 선지자/인물 간 구두 명령을 전달하므로, 현대 표준어 성경체에 맞게 직접 명령도 공손한 명령형으로 유지하는 것이 가장 자연스럽습니다.
  doctrine_reference: 문체·화용 선택
