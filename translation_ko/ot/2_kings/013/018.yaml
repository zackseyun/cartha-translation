  source_fidelity: ‘가져오십시오’는 קַח(‘취하다, 집다’)를 ‘가져오다’로 바꾸어, 화살을 들거나 집으라는 명령보다 화살을 가져오라는 뜻으로 들릴 수 있습니다. 또한 히브리어의 주어 전환은 문맥상 이스라엘 왕이 화살을 집고 땅을 친 것으로 이해되므로, 한국어에서는 왕을 밝혀 반복되는 ‘그’의 지시 대상을 분명히 하는 것이 안전합니다. ‘멈추었습니다’는 וַיַּעֲמֹד의 문맥상 의미를 충실히 전달합니다.
  naturalness: 인용문 뒤의 마침표와 서술 연결을 정리하고, ‘화살들을 집으십시오’로 명령을 자연스럽게 했습니다. ‘왕이 땅을 세 번 치고 멈추었습니다’는 불필요한 대명사 반복 없이 현대 표준어 합쇼체 서사로 자연스럽습니다.
  terminology: ‘이스라엘 왕’, ‘화살들’, ‘땅을 치다’는 본문의 기본 어휘와 서사적 격조를 유지합니다. 직접 인용의 ‘-십시오’는 요청된 현대 공손체에 맞습니다.
  issues:
