  to: 그가 말했습니다. “화살들을 집으십시오.” 그러자 이스라엘 왕이 화살들을 집었습니다. 그가 이스라엘 왕에게 말했습니다. “땅을 치십시오.” 왕이 땅을 세 번 치고 멈추었습니다.[a]
