source:
  edition: WLC
  text: וַ/יִּקְצֹ֨ף עָלָ֜י/ו אִ֣ישׁ הָ/אֱלֹהִ֗ים וַ/יֹּ֨אמֶר֙ לְ/הַכּ֨וֹת חָמֵ֤שׁ אוֹ שֵׁשׁ֙ פְּעָמִ֔ים אָ֛ז הִכִּ֥יתָ אֶת אֲרָ֖ם עַד כַּלֵּ֑ה וְ/עַתָּ֕ה שָׁלֹ֥שׁ פְּעָמִ֖ים תַּכֶּ֥ה אֶת אֲרָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/019.yaml
  text: Then the man of God was angry with him and said[a], “You should have struck the ground five or six times; then you would have struck Aram until it was finished[b]. But now you will strike Aram only three times.”
  footnotes:
  - marker: a
    text: Hebrew simply 'to strike'; 'the ground' is supplied from the immediately preceding action in verse 18.
    reason: cross_reference
  - marker: b
    text: Or 'until you had made an end of Aram' / 'until complete destruction.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 하나님의 사람이 그에게 화를 내고 말했습니다[a], “네가 땅을 다섯 번이나 여섯 번 쳤더라면, 그때 네가 아람을 완전히 멸했을 것이다[b]. 그러나 이제 너는 아람을 세 번만 칠 것이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순히 ‘치다’라고 되어 있으나, 바로 앞 절의 행동을 가리키므로 여기서는 문맥상 ‘땅을’로 보충했습니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘아람을 끝까지 쳤을 것이다’ 또는 ‘아람을 끝냈을 것이다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  english_pob_choice: was angry
  chosen_korean: 화를 내며
  alternatives_korean:
  - 분노하며
  - 성내며
  lexicon: HALOT
  rationale: קצף는 분노/노여움을 나타내며, 현대 한국어에서는 서술적으로 ‘화를 내며’가 자연스럽고 본문의 책망 어조를 잘 드러냅니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 예언자
  lexicon: HALOT
  rationale: 히브리어의 관용적 호칭을 직역에 가깝게 살려, 역할 설명으로 풀지 않고 고유한 표현을 유지했습니다.
- source_word: עַד כַּלֵּה
  english_pob_choice: until it was finished
  chosen_korean: 끝장냈을 것이다
  alternatives_korean:
  - 완전히 멸했을 것이다
  - 끝냈을 것이다
  - 소멸시켰을 것이다
  lexicon: HALOT
  rationale: כלה의 전면적 완결/종결 의미를 한국어의 강한 종결 표현으로 옮겼습니다. 문맥상 아람에 대한 군사적 종결을 가리키므로 ‘끝장내다’가 자연스럽습니다.
- source_word: שָׁלֹשׁ פְּעָמִים תַּכֶּה אֶת אֲרָם
  english_pob_choice: you will strike Aram only three times
  chosen_korean: 아람을 세 번만 치게 될 것이다
  alternatives_korean:
  - 아람을 세 번 칠 것이다
  - 아람을 세 차례만 치게 될 것이다
  lexicon: HALOT
  rationale: 예언적 미래를 한국어 미래/의지 표현으로 살리면서, 앞선 다섯·여섯 번과의 대비를 위해 ‘만’으로 제한성을 드러냈습니다.
theological_decisions:
- issue: ‘치는’ 행위와 아람에 대한 승리의 상징적 연결
  chosen_reading: 첫 번째 ‘치다’를 한국어로도 그대로 살려, 반복 동작과 아람을 치는 결과 사이의 대응을 보존했습니다.
  alternative_readings:
  - 첫 번째는 ‘때리다’, 결과는 ‘무찌르다’로 분리
  - 두 번째를 ‘공격하다’로 완화
  rationale: 본문은 예언적 표징 행위와 전쟁 결과를 같은 동사 계열로 묶어 연결합니다. 한국어에서도 동일 동사를 유지해야 그 상징적 대응이 흐려지지 않습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
