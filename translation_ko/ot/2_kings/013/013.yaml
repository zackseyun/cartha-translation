  - 그의 왕좌에 즉위했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘앉다’와 ‘왕좌’ 이미지를 보존하되, 한국어에서 왕위 승계의 의미가 자연스럽게 드러나도록 했습니다.
- source_word: וַיִּקָּבֵר
  english_pob_choice: was buried
  chosen_korean: 장사되었습니다
  alternatives_korean:
  - 묻혔습니다
  - 매장되었습니다
  lexicon: HALOT
  rationale: 수동형의 장례 공식을 한국어 성경 문체에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: 왕의 죽음 공식과 ‘잠들다’ 표현의 보존
  chosen_reading: ‘잠들었고’로 옮겨 왕의 죽음을 뜻하는 관용구를 그대로 살렸습니다.
  alternative_readings:
  - ‘죽었고’로 평이하게 처리함
  - ‘그의 조상들과 함께 누웠고’로 더 직역함
  rationale: 본문은 단순한 사망 통보가 아니라 왕조 연대기에서 쓰이는 정형적 죽음 공식을 사용하므로, 그 문체적·신학적 뉘앙스를 보존하는 것이 적절합니다.
  doctrine_reference: 성경 서술의 관용구와 왕조 공식
- issue: 왕위 승계의 연속성
  chosen_reading: ‘여로보암이 그의 왕좌에 앉았습니다’로 후계자의 즉위를 분명히 했습니다.
  alternative_readings:
  - ‘여로보암이 그 뒤를 이어 다스렸습니다’
  - ‘여로보암이 왕이 되었습니다’
  rationale: 원문은 단순한 통치 개시가 아니라 선왕의 왕좌를 계승하는 이미지를 강조하므로, 직설적 승계 표현을 유지했습니다.
  doctrine_reference: 이스라엘 왕조의 연속성과 역사 서술
