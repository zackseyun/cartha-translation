  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
  footnotes:
  - marker: a
    text: Or 'lay down with his fathers'; the Hebrew idiom is a conventional formula for a king's death.
    reason: lexical_alternative
translation:
  language: ko
  text: 요아스는 조상들과 함께 잠들었고, 여로보암이 요아스의 왕좌에 앉았습니다. 요아스는 사마리아에서 이스라엘 왕들과 함께 장사되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠들었고’는 히브리어의 관용적인 왕의 죽음 공식인 ‘그의 조상들과 함께 누웠다’를 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 왕의 죽음을 가리키는 관용적 표현을 한국어에서도 완곡하게 살려, 단순한 사실 진술인 ‘죽었습니다’보다 원문의 공식성을 유지했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
