  source_fidelity: 왕의 죽음과 매장, 여로보암의 왕위 계승이라는 본문의 순서는 충실히 반영했습니다. 다만 ‘그의 왕좌’는 한국어에서 여로보암 자신의 왕좌로 읽힐 여지가 있으므로 원문의 선행사인 요아스를 밝혀야 합니다. 또한 ‘사마리아에 있는 이스라엘의 왕들과 함께’는 왕들이 사마리아에 있다는 수식으로도 읽혀, 매장 장소와 동반 관계를 분명히 하는 편이 좋습니다.
  naturalness: 합쇼체 문체와 전반적 표현은 자연스럽습니다. ‘사마리아에서 이스라엘 왕들과 함께 장사되었습니다’가 원문의 두 전치사구 관계를 더 자연스럽고 명료하게 전달합니다.
  terminology: ‘잠들다’는 왕의 죽음을 알리는 히브리어 관용 공식을 적절히 보존하며, ‘조상들’도 현대 한국어에서 자연스럽습니다. ‘장사되었습니다’는 성경적 장례 문체로 적절합니다.
