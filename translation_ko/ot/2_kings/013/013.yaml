source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וְ/יָרָבְעָ֖ם יָשַׁ֣ב עַל כִּסְא֑/וֹ וַ/יִּקָּבֵ֤ר יוֹאָשׁ֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/013.yaml
  text: And Joash slept with his fathers[a], and Jeroboam sat on his throne. And Joash was buried in Samaria with the kings of Israel.
  footnotes:
  - marker: a
    text: Or 'lay down with his fathers'; the Hebrew idiom is a conventional formula for a king's death.
    reason: lexical_alternative
translation:
  language: ko
  text: 요아스는 그의 조상들과 함께 잠들었고, 여로보암이 그의 왕좌에 앉았습니다. 요아스는 사마리아에 있는 이스라엘의 왕들과 함께 장사되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘잠들었고’는 히브리어의 관용적 왕의 죽음 공식인 ‘그의 조상들과 함께 누웠다’를 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 왕의 죽음을 가리키는 관용적 표현을 한국어에서도 완곡하게 살려, 단순한 사실 진술인 ‘죽었습니다’보다 원문의 공식성을 유지했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 직역형 ‘아버지들’은 한국어에서 오해를 낳을 수 있어, 왕조적 계보를 드러내는 ‘조상들’로 옮기되 관계 표지를 유지했습니다.
- source_word: יָשַׁב עַל כִּסְאוֹ
  english_pob_choice: sat on his throne
  chosen_korean: 그의 왕좌에 앉았습니다
  alternatives_korean:
  - 그의 왕좌에 자리를 잡았습니다
  - 그의 왕좌에 즉위했습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘앉다’와 ‘왕좌’ 이미지를 보존하되, 한국어에서 왕위 승계의 의미가 자연스럽게 드러나도록 했습니다.
- source_word: וַיִּקָּבֵר
  english_pob_choice: was buried
  chosen_korean: 장사되었습니다
  alternatives_korean:
  - 묻혔습니다
  - 매장되었습니다
  lexicon: HALOT
  rationale: 수동형의 장례 공식을 한국어 성경 문체에 맞게 간결하게 옮겼습니다.
theological_decisions:
- issue: 왕의 죽음 공식과 ‘잠들다’ 표현의 보존
  chosen_reading: ‘잠들었고’로 옮겨 왕의 죽음을 뜻하는 관용구를 그대로 살렸습니다.
  alternative_readings:
  - ‘죽었고’로 평이하게 처리함
  - ‘그의 조상들과 함께 누웠고’로 더 직역함
  rationale: 본문은 단순한 사망 통보가 아니라 왕조 연대기에서 쓰이는 정형적 죽음 공식을 사용하므로, 그 문체적·신학적 뉘앙스를 보존하는 것이 적절합니다.
  doctrine_reference: 성경 서술의 관용구와 왕조 공식
- issue: 왕위 승계의 연속성
  chosen_reading: ‘여로보암이 그의 왕좌에 앉았습니다’로 후계자의 즉위를 분명히 했습니다.
  alternative_readings:
  - ‘여로보암이 그 뒤를 이어 다스렸습니다’
  - ‘여로보암이 왕이 되었습니다’
  rationale: 원문은 단순한 통치 개시가 아니라 선왕의 왕좌를 계승하는 이미지를 강조하므로, 직설적 승계 표현을 유지했습니다.
  doctrine_reference: 이스라엘 왕조의 연속성과 역사 서술
