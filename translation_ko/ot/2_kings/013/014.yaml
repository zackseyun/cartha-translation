id: 2KI.13.14
reference: 2 Kings 13:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וֶֽ/אֱלִישָׁע֙ חָלָ֣ה אֶת חָלְי֔/וֹ אֲשֶׁ֥ר יָמ֖וּת בּ֑/וֹ וַ/יֵּ֨רֶד אֵלָ֜י/ו יוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל וַ/יֵּ֤בְךְּ עַל פָּנָי/ו֙ וַ/יֹּאמַ֔ר אָבִ֣/י אָבִ֔/י רֶ֥כֶב יִשְׂרָאֵ֖ל וּ/פָרָשָֽׁי/ו־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/014.yaml
  text: Now Elisha had become sick with the illness from which he would die[a]. And Joash king of Israel went down to him and wept over him and said, “My father[b], my father! The chariots of Israel and its horsemen!”
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'wept over him.' The Hebrew reads literally, 'wept over his face.'
    reason: lexical_alternative
  - marker: b
    text: This cry echoes 2 Kings 2:12, where Elisha used the same words for Elijah.
    reason: cross_reference
translation:
  language: ko
  text: 엘리사는 자신이 죽게 될 병에 걸려 있었습니다. 이스라엘 왕 요아스는 그에게 내려와 그의 얼굴을 보며[a] 울고 말했습니다. 「내 아버지[b], 내 아버지! 이스라엘의 병거와 기병들이여!」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 얼굴 위에서 울었다’라고 합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 외침은 2열왕기 2:12에서 엘리사가 엘리야에게 한 같은 말과 연결됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: חָלָה / חָלְיוֹ
  english_pob_choice: had become sick / the illness
  chosen_korean: 병들어 있었습니다 / 병
  alternatives_korean:
  - 아팠습니다 / 병환
  - 병에 걸려 있었습니다 / 질병
  lexicon: HALOT
  rationale: חָלָה는 단순 상태보다 ‘병들어 감’의 진행성과 결과를 담고 있어, 서술 문맥에 맞게 ‘병들어 있었습니다’로 옮겼습니다. חָלְיוֹ는 같은 어근 명사를 살려 ‘병’으로 간결하게 처리했습니다.
- source_word: אֲשֶׁר יָמוּת בּוֹ
  english_pob_choice: from which he would die
  chosen_korean: 죽게 될
  alternatives_korean:
  - 그로 말미암아 죽을
  - 그 병으로 죽을
  lexicon: HALOT
  rationale: 미래 회상적 관점에서 죽음이 확정된 병이라는 점을 살려 ‘죽게 될’로 옮겼습니다. 한국어에서 가장 자연스럽게 원문의 예견적 뉘앙스를 전달합니다.
- source_word: וַיֵּרֶד אֵלָיו
  english_pob_choice: went down to him
  chosen_korean: 그에게 내려가서
  alternatives_korean:
  - 그에게 갔습니다
  - 그에게 찾아 내려갔습니다
  lexicon: HALOT
  rationale: ‘내려가다’는 지리적 방향성을 보존하는 직접적 표현이므로 유지했습니다. 역동성을 조금 보완해 ‘-아서’로 사건 연쇄를 자연스럽게 연결했습니다.
- source_word: וַיֵּבְךְּ עַל־פָּנָיו
  english_pob_choice: wept over him / wept over his face
  chosen_korean: 그의 얼굴 위에서 울며
  alternatives_korean:
  - 그를 향해 울며
  - 그 앞에서 울며
  lexicon: HALOT
  rationale: 본문의 문자적 표현인 ‘얼굴 위에서’의 촉감을 살리되, 한국어에서 어색하지 않도록 ‘울며’로 풀었습니다. 과도하게 의역해 ‘그를 위하여’로 바꾸지 않았습니다.
- source_word: אָבִי אָבִי
  english_pob_choice: My father, my father!
  chosen_korean: 내 아버지, 내 아버지!
  alternatives_korean:
  - 아버지, 아버지!
  - 나의 아버지, 나의 아버지!
  lexicon: HALOT
  rationale: 엘리야-엘리사 전승에 대한 호칭을 살리기 위해 직역에 가깝게 유지했습니다. 현대 한국어에서는 ‘내 아버지’가 감정과 존칭의 긴장을 가장 잘 드러냅니다.
- source_word: רֶכֶב יִשְׂרָאֵל וּפָרָשָׁיו
  english_pob_choice: The chariots of Israel and its horsemen
  chosen_korean: 이스라엘의 병거와 그 기병이여
  alternatives_korean:
  - 이스라엘의 병거와 그 기병들아
  - 이스라엘의 병거와 말 탄 군사들이여
  lexicon: HALOT
  rationale: 메타포를 풀어 설명하기보다 원문 어휘군을 보존해 엘리사가 이스라엘의 실제 방어였다는 함의를 유지했습니다. 감탄형 호격 ‘-이여’는 히브리어 외침의 호소성을 살립니다.
theological_decisions:
- issue: ‘My father, my father!’의 관계성과 직분적 의미
  chosen_reading: 엘리사를 향한 존중과 애통의 외침으로 유지하되, 영적 아버지라는 함의를 본문 안에서 과잉설명하지 않았습니다.
  alternative_readings:
  - 단순한 친부 호칭으로 축소
  - 교훈적 의미를 덧붙여 영적 아버지로 풀어씀
  rationale: 2열왕기 2:12의 반향이 분명하지만, 본문은 그 의미를 독자가 느끼도록 제시할 뿐 해설하지 않습니다. 그래서 호칭 자체를 보존하고 주석적 확장은 본문 밖으로 남겼습니다.
  doctrine_reference: Translation philosophy §3, metaphor and intertextual echo should be preserved rather than flattened.
- issue: ‘이스라엘의 병거와 그 기병’의 상징성
  chosen_reading: 엘리사가 이스라엘의 참된 방어라는 상징을 직설적 외침으로 유지했습니다.
  alternative_readings:
  - 군사력을 단순 비유하는 표현으로 완화
  - 하늘의 병거 환상으로 해석해 확정
  rationale: 본문은 상징을 설명하지 않고, 엘리사에 대한 인식의 절정을 드러냅니다. 따라서 메타포를 해석해 없애지 않고 그대로 두었습니다.
  doctrine_reference: Translation philosophy §3, preserve theological tension rather than resolve it.
