  naturalness: ‘야훼 보시기에 악한 일을 했습니다’는 현대 표준어 합쇼체로 자연스럽습니다. 그러나 ‘모든 죄에서 돌아서지 않았습니다’는 한국어에서 ‘모든 죄를 다 떠난 것은 아니다’라는 부분 부정으로도 읽힐 수 있으므로, 히브리어의 전면적 불이행을 분명히 하는 ‘어떤 죄에서도 돌아서지 않았습니다’가 더 자연스럽고 정확합니다.
  terminology: ‘야훼’, ‘느밧’, ‘여로보암’, ‘이스라엘’은 일관되게 적절합니다. ‘악한 일을 했습니다’도 왕정 평가 관용구에 적합합니다. בָּהּ는 형태상 여성 단수이나 앞선 죄의 길/방식을 집합적으로 가리키는 것으로 이해될 수 있으므로, 한국어 본문에서는 자연스러운 ‘그 죄된 길’을 사용하고 각주에서 단수 표현의 가능성을 밝혀야 합니다.
