source:
  edition: WLC
  text: וַ/יַּֽעֲשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּ֞אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל בָּ֥/הּ הָלָֽךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/011.yaml
  text: He did what was evil in the sight of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], by which he caused Israel to sin; he walked in them.
  footnotes:
  - marker: a
    text: Or, more literally, 'he walked in it,' with the singular pronoun referring collectively to Jeroboam's sinful way.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 했습니다. 그는 느밧의 아들 여로보암의 모든 죄에서 돌아서지 않았습니다[a]. 여로보암이 이스라엘을 죄짓게 한 그 죄들 가운데서 그는 그 길을 걸었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, '그가 그것 안에서 걸었다'로도 옮길 수 있습니다. 여기서 단수 대명사는 여로보암의 죄된 방식 전체를 집합적으로 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשֶׂה הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 했습니다
  alternatives_korean:
  - 악을 행했습니다
  - 악한 것을 했습니다
  lexicon: HALOT
  rationale: 히브리어 관용구 עשה הרע는 단순히 '악을 하다'보다 평가적 의미가 강하므로, 자연스러운 현대 한국어로 옮기되 도덕적 판단을 유지했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 직역의 이미지인 '눈'을 한국어 존대 표현과 결합해, 하나님의 평가라는 의미를 자연스럽게 살렸습니다.
- source_word: לֹא סָר מִכָּל חַטֹּאות
  english_pob_choice: He did not turn away from all the sins
  chosen_korean: 모든 죄에서 돌아서지 않았습니다
  alternatives_korean:
  - 모든 죄를 떠나지 않았습니다
  - 어느 죄에서도 돌아서지 않았습니다
  lexicon: HALOT
  rationale: סור는 방향 전환의 의미가 있어 '돌아서다'가 적절하며, מִכָּל은 여기서 전체 범위를 가리키므로 '모든 죄'로 옮겼습니다.
- source_word: יָרָבְעָם בֶּן נְבָט
  english_pob_choice: Jeroboam son of Nebat
  chosen_korean: 느밧의 아들 여로보암
  alternatives_korean:
  - 여로보암 느밧의 아들
  - 느밧의 아들, 여로보암
  lexicon: HALOT
  rationale: 한국어 성경의 익숙한 친족 표지를 따르되, 고유명은 표준 음역으로 유지했습니다.
theological_decisions:
