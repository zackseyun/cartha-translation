  rationale: 프로젝트 기본값에 따라 신명기적 평가 문맥의 יְהוָה를 '야훼'로 옮겨, 고유한 언약명을 드러냈습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
