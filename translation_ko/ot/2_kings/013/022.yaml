translation:
  language: ko
  text: 아람 왕 하사엘은 여호아하스의 모든 날 동안 이스라엘을 압박했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲזָאֵל
  english_pob_choice: Now Hazael
  chosen_korean: 하사엘은
  alternatives_korean:
  - 그리고 하사엘은
  - 그때 하사엘은
  lexicon: HALOT
  rationale: 서두의 וַ는 서사 전개를 잇는 기능이므로 한국어에서는 매끄러운 서술 전개로 처리하고, 고유명사는 통용 표기인 하사엘로 옮겼습니다.
- source_word: מֶלֶךְ אֲרָם
  english_pob_choice: king of Aram
  chosen_korean: 아람 왕
  alternatives_korean:
  - 아람의 왕
  - 시리아 왕
  lexicon: HALOT
  rationale: 히브리어 고유명사 아람을 우선하여 '아람 왕'으로 직역했고, 전통적이지만 원어에서 한 발 떨어진 '시리아'는 채택하지 않았습니다.
- source_word: לָחַץ
  english_pob_choice: oppressed
  chosen_korean: 압박했습니다
  alternatives_korean:
  - 억압했습니다
  - 괴롭혔습니다
  - 누르셨습니다
  lexicon: HALOT
  rationale: 지속적인 군사·정치적 압력을 나타내는 동사로 보아, 현대 한국어에서 의미가 분명한 '압박했습니다'를 택했습니다.
- source_word: כֹּל יְמֵי
  english_pob_choice: all the days of
  chosen_korean: 모든 날 동안
  alternatives_korean:
  - 평생 동안
  - 전 기간 동안
  lexicon: HALOT
  rationale: 관용구의 전체 기간을 자연스럽게 나타내기 위해 '모든 날 동안'으로 옮겼습니다.
