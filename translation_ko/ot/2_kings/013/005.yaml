  source_fidelity: 히브리어의 세 동사 연쇄(주셨습니다―벗어났습니다―살았습니다), 아람의 지배에서의 해방, 그리고 ‘이스라엘 자손’과 ‘장막’의 표현은 대체로 충실합니다. 다만 ‘아람의 손 아래에서’는 원문의 관용구를 직역했으나 현대 한국어에서는 부자연스러우므로, 지배·압제의 뜻과 손의 이미지를 함께 살리는 ‘아람의 손아귀에서’가 더 적절합니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. ‘자기 장막들에’는 한국어에서 다소 어색하므로 ‘자기 장막에서’로 다듬는 것이 자연스럽습니다. 히브리어의 복수형은 각 사람이 자기 거처에 거한 집합적 의미로 한국어 단수 집합 표현으로 충분히 전달됩니다.
  terminology: ‘야훼’, ‘구원자’, ‘이스라엘 자손’, ‘아람’은 프로젝트의 선택 및 역사적 문맥에 부합합니다. ‘구원자’는 이 문맥에서 정치적·역사적 구출자를 가리키며, ‘구주’처럼 특정한 후대 신학적 동일시를 강요하지 않습니다.
