id: 2KI.13.5
reference: 2 Kings 13:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן יְהוָ֤ה לְ/יִשְׂרָאֵל֙ מוֹשִׁ֔יעַ וַ/יֵּ֣צְא֔וּ מִ/תַּ֖חַת יַד אֲרָ֑ם וַ/יֵּשְׁב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/אָהֳלֵי/הֶ֖ם כִּ/תְמ֥וֹל שִׁלְשֽׁוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/005.yaml
  text: And Yahweh gave Israel a deliverer[a], so that they went out from under the hand of Aram[c][b]; and the sons of Israel lived in their tents as formerly.
  footnotes:
  - marker: a
    text: Or 'a savior.' The Hebrew word denotes one who brings rescue or deliverance.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from under the hand of Aram,' an idiom for release from Aram's power.
    reason: cultural_note
  - marker: c
    text: Or 'as before' / 'as in former times.' Literally, 'as yesterday, three days ago,' a Hebrew idiom for former days.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘에게 구원자를 주셨습니다[a]. 그래서 그들은 아람의 손 아래에서 벗어나[b], 이스라엘 자손은 전처럼 자기 장막들에 살았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구해 주는 이’. 히브리어는 구출과 해방을 가져오는 이를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘손 아래에서’는 아람의 권세에서 벗어났다는 관용적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘전처럼’/‘옛날처럼’. 문자적으로는 ‘어제, 사흘 전처럼’이라는 히브리어 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: WLC
  rationale: 언약의 이름을 본문 그대로 드러내기 위해 프로젝트 기본값인 ‘야훼’를 유지했습니다.
- source_word: מוֹשִׁיעַ
  english_pob_choice: a deliverer
  chosen_korean: 구원자
  alternatives_korean:
  - 구해 주는 이
  - 구원하는 이
  lexicon: HALOT
  rationale: 즉각적인 역사적 구출의 뜻을 살리면서도, 한국어에서 가장 자연스럽게 ‘구출/해방을 가져오는 인물’로 읽히는 표현을 택했습니다.
- source_word: מִתַּחַת יַד אֲרָם
  english_pob_choice: from under the hand of Aram
  chosen_korean: 아람의 손 아래에서
  alternatives_korean:
  - 아람의 권세 아래에서
  - 아람의 통제 아래에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체적 이미지를 살리되, 한국어에서도 억압적 지배를 뜻하는 말로 자연스럽게 들리도록 옮겼습니다.
- source_word: בְנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  lexicon: HALOT
  rationale: 히브리어의 가족적·계보적 표현을 유지하되, 현대 한국어에서 널리 이해되는 성경적 관용 표현을 사용했습니다.
theological_decisions:
- issue: מוֹשִׁיעַ를 ‘구원자’로 옮길지 ‘구해 주는 이’로 풀지
  chosen_reading: ‘구원자’는 하나님의 역사 속 도구가 되는 인물을 가리키되, 메시아적 함의를 직접 부여하지 않는 중립적 표현으로 유지했습니다.
  alternative_readings:
  - 구해 주는 이
  - 구원하는 이
  - 구주
  rationale: 문맥은 아람의 압제에서의 일시적 해방이므로, 종말론적·그리스도론적 색채가 강한 ‘구주’보다 역사적 구출에 적합한 표현이 필요합니다.
  doctrine_reference: 문맥 우선 원칙; 역사적 구원과 메시아적 칭호의 구분
