  text: וַ/יִּשְׁכַּ֤ב יְהֽוֹאָחָז֙ עִם אֲבֹתָ֔י/ו וַֽ/יִּקְבְּרֻ֖/הוּ בְּ/שֹׁמְר֑וֹן וַ/יִּמְלֹ֛ךְ יוֹאָ֥שׁ בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/013/009.yaml
  text: And Jehoahaz lay down with his fathers[a], and they buried him in Samaria. Then Joash his son reigned in his place.
  footnotes:
  - marker: a
    text: Joash is also rendered 'Jehoash' in some English translations.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호아하스가 그의 조상들과 함께 누웠고, 사람들이 그를 사마리아에 장사하였습니다. 그의 아들 요아스가 그를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 요아스는 일부 번역본에서 ‘여호아스’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: lay down with his fathers
  chosen_korean: 그의 조상들과 함께 누우매
  alternatives_korean:
  - 그의 아버지들과 함께 누우매
  - 그의 조상들과 함께 잠들었고
  - 그의 조상들과 함께 죽었고
  lexicon: HALOT
  rationale: 왕의 죽음을 나타내는 관용구를 한국어로는 직접적이되 완곡하게 옮기기 위해 ‘누우매’를 택했고, אֲבֹתָיו는 문맥상 ‘조상들’이 가장 자연스럽습니다.
- source_word: וַיִּקְבְּרֻהוּ
  english_pob_choice: they buried him
  chosen_korean: 사람들이 그를 ... 장사하였고
  alternatives_korean:
  - 그를 ... 장사하였고
  - 그가 ... 장사되었고
  lexicon: HALOT
  rationale: 히브리어의 3인칭 복수 동작 주어를 살려 수동형보다 ‘사람들이’로 옮겼습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에
  alternatives_korean:
  - 사마리아에서
  - 사마리아 안에
  lexicon: HALOT
  rationale: 매장 장소를 나타내는 전치사 ב의 기본 위치 의미를 자연스러운 한국어 여격으로 반영했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 자리를 이어 왕이 되었습니다
  alternatives_korean:
  - 그를 대신하여 통치하였습니다
  - 그의 뒤를 이어 다스렸습니다
  - 그의 자리에 왕이 되었습니다
  lexicon: HALOT
  rationale: 왕위 계승 공식을 한국어로는 ‘자리를 이어’가 가장 자연스럽고, תַּחְתָּיו의 대체 의미를 분명히 드러냅니다.
- source_word: יוֹאָשׁ
  english_pob_choice: Joash
  chosen_korean: 요아스
  alternatives_korean:
  - 여호아스
  - 요아시
  lexicon: Korean biblical proper-noun convention
  rationale: 히브리어 יוֹאָשׁ의 통용 한국어 음역을 따랐습니다.
theological_decisions:
- issue: 왕의 죽음 공식에서 ‘누우매’의 완곡성과 직설성
  chosen_reading: 왕의 죽음을 직접적이지만 문학적으로 유지하는 ‘누우매’를 사용했습니다.
  alternative_readings:
  - ‘죽고’로 평이하게 옮김
  - ‘잠들어’로 더 완곡하게 옮김
  rationale: 본문은 왕의 사망을 기록하는 정형 공식이므로, 원문 이미지와 기록체의 무게를 함께 살리는 표현이 적절합니다.
  doctrine_reference: 왕정사 서술의 관용구 보존
- issue: 다음 왕의 즉위와 계승 관계
  chosen_reading: ‘그의 자리를 이어 왕이 되었습니다’로 계승과 즉위를 함께 드러냈습니다.
  alternative_readings:
  - ‘그의 뒤를 이어 왕이 되었습니다’
  - ‘그를 대신하여 통치하였습니다’
  rationale: תַּחְתָּיו는 단순한 시간적 선후가 아니라 왕위의 대체를 뜻하므로, 계승성을 분명히 해야 합니다.
  doctrine_reference: 왕위 계승 공식
