  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
  footnotes:
  - marker: a
    text: Or 'the groups of fifty under them'; Hebrew literally 'their fifties.'
    reason: lexical_alternative
  - marker: b
    text: Or 'let my soul be precious in your sight'; here 'soul' refers to the speaker's life.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하늘에서 불이 내려와 앞선 두 오십부장과 그들이 거느린 오십 명씩의 부대들을[a] 삼켰습니다. 그러나 이제 제 생명을[b] 당신께서 귀하게 여겨 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 오십들’이라고 말하며, 각 오십부장이 거느린 오십인 부대들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ은 여기서 ‘영혼’이 아니라 화자의 목숨, 곧 생명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 청자의 주의를 강하게 끄는 감탄사로, 현대 표준어 합쇼체에서 가장 자연스럽게 명령적 주의를 환기합니다.
- source_word: שָׂרֵי הַחֲמִשִּׁים
  english_pob_choice: captains of fifty
  chosen_korean: 오십부장
  alternatives_korean:
  - 오십 명의 대장
