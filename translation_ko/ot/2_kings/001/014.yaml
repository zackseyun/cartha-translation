  text: הִ֠נֵּה יָ֤רְדָה אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם וַ֠/תֹּאכַל אֶת שְׁנֵ֞י שָׂרֵ֧י הַ/חֲמִשִּׁ֛ים הָ/רִאשֹׁנִ֖ים וְ/אֶת חֲמִשֵּׁי/הֶ֑ם וְ/עַתָּ֕ה תִּיקַ֥ר נַפְשִׁ֖/י בְּ/עֵינֶֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/014.yaml
  text: Look[a], fire came down from heaven and consumed the first two captains of fifty and their fifties. But now[b], let my life be precious in your sight.
  footnotes:
  - marker: a
    text: Or 'the groups of fifty under them'; Hebrew literally 'their fifties.'
    reason: lexical_alternative
  - marker: b
    text: Or 'let my soul be precious in your sight'; here 'soul' refers to the speaker's life.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 하늘에서 불이 내려와 맨 처음의 오십부장 두 사람과 그들의 부하 오십 명들을 삼켰습니다. 그런데 이제는 제 생명이 당신의 눈에 귀하게 여겨지게 해 주십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그들의 오십들’이라고 말하며, 이는 그들 아래 딸린 오십인 부대를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 נֶפֶשׁ은 여기서 ‘영혼’이 아니라 스피커의 목숨, 곧 생명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 청자의 주의를 강하게 끄는 감탄사로, 현대 표준어 합쇼체에서 가장 자연스럽게 명령적 주의를 환기합니다.
- source_word: שָׂרֵי הַחֲמִשִּׁים
  english_pob_choice: captains of fifty
  chosen_korean: 오십부장
  alternatives_korean:
  - 오십 명의 대장
  - 오십 명의 지휘관
  lexicon: HALOT
  rationale: 군사 단위를 이끄는 직책을 간결하게 살리기 위해 ‘오십부장’을 사용했습니다.
- source_word: וְאֶת חֲמִשֵּׁיהֶם
  english_pob_choice: and their fifties
  chosen_korean: 그들의 부하 오십 명들
  alternatives_korean:
  - 그들의 오십 부대들
  - 그들의 오십 명
  lexicon: HALOT
  rationale: 히브리어의 직역형 ‘그들의 오십들’을 한국어에서 이해 가능하게 풀어, 각 지휘관 아래 있던 오십인 단위를 드러냈습니다.
- source_word: תִּיקַר נַפְשִׁי
  english_pob_choice: let my life be precious
  chosen_korean: 제 생명이 … 귀하게 여겨지게 해 주십시오
  alternatives_korean:
  - 제 생명이 … 귀하게 해 주십시오
  - 제 목숨을 귀하게 여겨 주십시오
  lexicon: HALOT
  rationale: נֶפֶשׁ을 이 문맥에서 ‘생명/목숨’으로 옮기는 것이 자연스럽고, יקר의 ‘귀하다’는 의미를 살리기 위해 수동적 표현으로 처리했습니다.
theological_decisions:
- issue: נֶפֶשׁ의 번역에서 ‘영혼’ 대신 ‘생명’을 택할지 여부
  chosen_reading: 제 생명
  alternative_readings:
  - 제 영혼
  - 제 목숨
  rationale: 이 장면은 죽임을 당하지 않게 해 달라는 간청이므로, נֶפֶשׁ을 추상적 ‘영혼’이 아니라 구체적 ‘생명’으로 이해하는 것이 본문 의도에 가장 충실합니다.
  doctrine_reference: 인간을 이원론적으로 단순화하지 않는 서술적 용례
