source:
  edition: WLC
  text: וַ/יָּ֜שָׁב וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֥ים אַחֵ֖ר וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֨עַן֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָ/אֱלֹהִ֔ים כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ מְהֵרָ֥ה רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/011.yaml
  text: 'Again he sent to him another captain of fifty with his fifty. He answered and said to him[a], “Man of God, thus says the king: ‘Come down quickly.’”'
  footnotes:
  - marker: a
    text: Or “Go down quickly.” The Hebrew verb simply means “go down/descend”; “come down” reflects the command as spoken from the king’s representative to Elijah above him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다시 다른 오십부장과 그가 거느린 오십 명을 엘리야에게 보냈습니다. 그 오십부장이 엘리야에게 대답하여 말했습니다. 「하나님의 사람아, 왕이 이렇게 말합니다. ‘빨리 내려오너라.’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 “내려가다/내려오다”를 뜻합니다. 이 장면에서는 아래에 있는 왕의 대리인이 엘리야에게 말하므로, “내려오너라”가 화용론적으로 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 거듭
  lexicon: HALOT
  rationale: 이 연결어는 물리적 ‘돌아감’보다 행동의 반복을 표시하므로, 한국어에서는 자연스럽게 ‘다시’로 옮기는 것이 원문의 기능을 잘 보존합니다.
- source_word: שַׂר חֲמִשִּׁים
  english_pob_choice: captain of fifty
  chosen_korean: 오십부장
  alternatives_korean:
  - 오십 명의 대장
  - 오십 명을 거느린 장교
  lexicon: HALOT
  rationale: 본문의 군사 직함을 간결하게 살리면서도, 반복되는 문맥에서 이해하기 쉬운 전통적 행정·군사 용어로 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: Man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 사람아
  lexicon: HALOT
  rationale: 엘리야를 가리키는 호칭의 직역을 유지했고, 직접 호칭의 감각은 종결부 ‘-아’로 드러냈습니다.
- source_word: מְהֵרָה רֵדָה
  english_pob_choice: Come down quickly
  chosen_korean: 빨리 내려오너라
  alternatives_korean:
  - 어서 내려오너라
  - 급히 내려오십시오
  lexicon: HALOT
  rationale: 히브리어는 ‘내려가라/내려오라’의 동사와 긴급성을 함께 나타내므로, 왕의 대리인이 엘리야에게 내리는 명령체를 자연스러운 명령문으로 살렸습니다.
theological_decisions:
- issue: 왕의 명령을 대변하는 직설 화법의 톤
  chosen_reading: 직접 인용부에서는 신하가 왕의 권위를 대신하여 명령하는 어조를 그대로 드러내기 위해 명령형을 유지했습니다.
  alternative_readings:
  - 정중한 청유형으로 완화
  - 서술형으로 바꿔 간접화
  rationale: 본문의 핵심은 왕의 말이 엘리야에게 하달되는 권위 구조이므로, 완화하지 않고 직설적인 명령으로 옮기는 것이 स्रोत의 긴장을 보존합니다.
  doctrine_reference: 본문 해석의 권위 구조와 서사적 긴장
- issue: 하나님의 사람 호칭의 직접 주소 처리
  chosen_reading: 직접 호칭임을 드러내기 위해 ‘하나님의 사람아’로 옮겼습니다.
  alternative_readings:
  - 하나님의 사람
  - 오 하나님의 사람
  rationale: 히브리어 vocative의 기능을 살리면서도 한국어 합쇼체 서술 흐름을 해치지 않도록 했습니다.
  doctrine_reference: 호칭과 직접화법의 문법적 재현
