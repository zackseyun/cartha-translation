source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אֲחַזְיָ֖הוּ אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֽוֹא הֵ֣מָּה כְתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/018.yaml
  text: Now the rest of the acts of Ahaziah[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'recorded' for 'written'; the Hebrew says literally 'written,' using a standard royal-archive formula.
    reason: lexical_alternative
  - marker: b
    text: '''The Book of the Chronicles of the Kings of Israel'' refers to a royal annalistic source cited in Kings, not necessarily the biblical book of Chronicles.'
    reason: cultural_note
translation:
  language: ko
  text: 이제 아하시야의 나머지 행적, 곧 그가 한 일은 이스라엘 왕들의 역대기에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘역대기’는 여기서 성경의 역대기가 아니라, 열왕기 안에서 인용되는 왕실 연대기 자료를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 ‘기록되어 있다’는 관청적·사료적 표현으로, 단순히 물리적으로 ‘쓰였다’는 뜻만이 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 나머지
  alternatives_korean:
  - 그리고 나머지
  - 그 밖의
  lexicon: HALOT
  rationale: 왕들의 결어 공식에서 וְיֶתֶר는 단순 접속사보다 결론 전환의 기능이 강하므로, 한국어에서는 자연스럽게 ‘이제 나머지’로 옮겼습니다.
- source_word: דִּבְרֵי אֲחַזְיָהוּ
  english_pob_choice: acts of Ahaziah
  chosen_korean: 아하시야의 행적
  alternatives_korean:
  - 아하시야의 일들
  - 아하시야의 말들
  lexicon: HALOT
  rationale: דִּבְרֵי는 이 왕조 요약문맥에서 ‘말들’보다 넓은 ‘기록된 행적/일’의 뜻이므로, 역사 서술체에 맞는 ‘행적’을 선택했습니다.
- source_word: הֲלוֹא הֵמָּה כְתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 쓰여 있지 않습니까
  - 기록되지 않았습니까
  lexicon: HALOT
  rationale: 직역의 ‘쓰여 있다’보다 한국어 역사 문맥에서는 ‘기록되어 있다’가 원문의 관청적·사료적 뉘앙스를 더 자연스럽게 드러냅니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기
  alternatives_korean:
  - 이스라엘 왕들의 연대기
  - 이스라엘 왕들의 기록서
  lexicon: HALOT
  rationale: 이는 성경 역대기가 아니라 왕실 연대기/실록을 가리키는 사료 명칭이므로, 관용적으로 이해되는 ‘역대기’를 쓰되 소속을 ‘이스라엘 왕들의’로 보존했습니다.
theological_decisions:
- issue: 문장 끝의 수사적 질문 처리
  chosen_reading: 부정 의문형으로 옮겨 독자가 ‘예, 기록되어 있습니다’라는 암묵적 답을 읽게 했습니다.
  alternative_readings:
  - 직설형으로 옮김
  - 확정 진술로 바꿈
  rationale: הֲלוֹא는 기대하는 긍정 답을 가진 수사적 질문이므로, 한국어에서도 그 압박감과 결어 기능을 유지하는 것이 본문 의도에 부합합니다.
  doctrine_reference: 역대기 결어 공식의 수사적 관습
