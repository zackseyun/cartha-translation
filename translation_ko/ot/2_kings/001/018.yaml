- from: 이제 아하시야의 나머지 행적, 곧 그가 한 일은 이스라엘 왕들의 역대기에 기록되어 있지 않습니까?[a][b]
  to: 아하시야가 행한 나머지 일들은 이스라엘 왕들의 역대기 책에 기록되어 있지 않습니까?[a][b]
  rationale: 명시되지 않은 시간 부사 ‘이제’를 삭제하고, 히브리어의 관계절(‘그가 행한’)이 수식하는 ‘나머지 일들’을 자연스러운 한국어 어순으로 재구성했습니다. 수사 의문형과 왕실 기록 자료라는 뜻은 유지했으며, 각주는 정경 역대기와의 혼동을 막고 ‘기록되어 있다’의 번역 선택을 중립적으로 설명하도록 다듬었습니다.
