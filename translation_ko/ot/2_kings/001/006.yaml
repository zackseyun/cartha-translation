base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/006.yaml
  text: 'And they said to him[a], “A man came up to meet us and said to us, ‘Go, return to the king who sent you, and speak to him: Thus says Yahweh, “Is it because there is no God in Israel that you are sending to inquire of Baal-zebub, the god of Ekron? Therefore the bed to which you have gone up—you will not come down from it[b], for you will surely die.”’”'
  footnotes:
  - marker: a
    text: Or, “Is it for lack of a God in Israel that you are sending to inquire of Baal-zebub…?”
    reason: lexical_alternative
  - marker: b
    text: Or 'on which you have gone up there'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 그에게 말하였습니다. “한 사람이 우리를 만나러 올라와 우리에게 말하였습니다. ‘가서 너희를 보낸 왕에게 돌아가, 그에게 이렇게 말하여라. “야훼께서 이와 같이 말씀하신다. ‘이스라엘에 하나님이 없어서 네가 에그론의 신 바알-세붑에게 물어 보려고 사람들을 보내느냐?’[a] 그러므로 네가 올라간 그 침상[b]에서 내려오지 못할 것이다. 네가 반드시 죽을 것이기 때문이다.”’”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이스라엘에 하나님이 없기 때문에 네가 에그론의 신 바알-세붑에게 물어 보려고 사람들을 보내느냐?”
    reason: lexical_alternative
  - marker: b
    text: 또는, “네가 거기 올라간 그 침상”
    reason: previous_rendering
lexical_decisions:
- source_word: אִישׁ
  english_pob_choice: a man
  chosen_korean: 한 사람
  alternatives_korean:
  - 어떤 사람
  - 한 남자
  lexicon: HALOT
  rationale: 여기서는 아직 인물을 특정하지 않으므로, 신원 미상의 인물을 자연스럽게 드러내는 ‘한 사람’이 מתאים하며 성별 정보는 과도하게 전면화하지 않습니다.
- source_word: עָלָה לִקְרָאתֵנוּ
  english_pob_choice: came up to meet us
  chosen_korean: 우리를 만나러 올라와서
  alternatives_korean:
  - 우리에게 올라와서
  - 우리를 맞으러 올라와서
  lexicon: HALOT
  rationale: ‘올라오다’의 공간적 움직임을 살리면서도, 대면 목적을 드러내는 ‘만나러’로 자연스럽게 옮겼습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이와 같이 말씀하신다
  alternatives_korean:
  - 야훼께서 이렇게 말씀하신다
  - 여호와께서 이와 같이 말씀하신다
  lexicon: HALOT
  rationale: 예언 공식의 장중한 문체를 살리면서, 본 프로젝트의 기본 원칙에 따라 여호와 대신 ‘야훼’를 사용했습니다.
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  english_pob_choice: Baal-zebub, the god of Ekron
  chosen_korean: 에그론의 신 바알-세붑
  alternatives_korean:
  - 에그론의 신 바알-제붑
  - 에그론의 신 바알세붑
  lexicon: HALOT
  rationale: 고유명은 음역하고, אֱלֹהֵי עֶקְרוֹן의 속격 관계는 ‘에그론의 신’으로 분명히 하였습니다.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  english_pob_choice: the bed to which you have gone up
  chosen_korean: 네가 올라간 그 침상
  alternatives_korean:
  - 네가 올라간 그 침대
  - 네가 거기 올라간 그 침상
  lexicon: HALOT
  rationale: 침상/침대 중에서 문어적·서술적 울림이 더 큰 ‘침상’을 택해 병상 맥락을 살렸습니다.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  english_pob_choice: you will not come down from it
  chosen_korean: 내려오지 못할 것이니
  alternatives_korean:
  - 그것에서 내려오지 못할 것이니
  - 그곳에서 내려오지 못할 것이니
  lexicon: HALOT
  rationale: ‘내려오다’의 방향성을 살리되, 한국어 예언 선고 문맥에 맞게 불가능/금지를 함께 담는 표현으로 옮겼습니다.
- source_word: כִּי מוֹת תָּמוּת
  english_pob_choice: for you will surely die
  chosen_korean: 네가 반드시 죽을 것이다
  alternatives_korean:
  - 너는 반드시 죽을 것이다
  - 반드시 죽게 될 것이다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정확이 아니라 확정의 중첩)을 한국어의 ‘반드시’로 재현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 예언 공식은 고유명사를 직접 지시하므로, 제목 대체어 ‘주’보다 이름 자체를 보존하는 ‘야훼’가 원문 의도를 더 분명히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה / YHWH → 야훼'
