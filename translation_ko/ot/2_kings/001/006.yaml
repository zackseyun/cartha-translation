- from: 그들이 그에게 말하였습니다. 「한 사람이 우리를 만나러 올라와서 우리에게 말하기를, ‘가서, 너희를 보낸 왕에게 돌아가서 그에게 이렇게 말하여라. “야훼께서 이와 같이 말씀하신다. ‘이스라엘에 하나님이 없어서 네가 에그론의 신 바알-세붑에게 가서 물으려 하느냐? 그러므로 네가 올라간 그 침상에서 내려오지 못할 것이니, 네가 반드시 죽을 것이다.’”」」[a][b]
  to: 그들이 그에게 말하였습니다. “한 사람이 우리를 만나러 올라와 우리에게 말하였습니다. ‘가서 너희를 보낸 왕에게 돌아가, 그에게 이렇게 말하여라. “야훼께서 이와 같이 말씀하신다. ‘이스라엘에 하나님이 없어서 네가 에그론의 신 바알-세붑에게 물어 보려고 사람들을 보내느냐?’[a] 그러므로 네가 올라간 그 침상[b]에서 내려오지 못할 것이다. 네가 반드시 죽을 것이기 때문이다.”’”’
  rationale: 원문의 동사 שֹׁלֵחַ(‘보내다’)와 문의 목적을 ‘물어 보려고 사람들을 보내느냐’로 회복했습니다. 예언 선언의 인용 층위를 일관되게 닫았고, 침상에 관한 각주도 원문의 ‘거기’와 침상을 함께 보존하도록 고쳤습니다. 본문의 의미나 신학적 해석은 추가하지 않았습니다.
