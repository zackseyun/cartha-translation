lexical_decisions:
- source_word: וַיָּשׁוּבוּ / returned
  english_pob_choice: returned
  chosen_korean: 돌아오자
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아오자
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 살리면서도 שוב의 방향성(되돌아감)을 유지하기 위해 ‘돌아오자’로 옮겼습니다.
- source_word: הַמַּלְאָכִים / the messengers
  english_pob_choice: the messengers
  chosen_korean: 사자들
  alternatives_korean:
  - 메신저들
  - 전령들
  lexicon: HALOT
  rationale: 이 문맥의 מלאכים는 천사가 아니라 왕이 보낸 인간 사절들이므로, 한국어 성경에서 널리 쓰이면서도 인적 파견을 드러내는 ‘사자들’이 적절합니다.
- source_word: וַיֹּאמֶר אֲלֵיהֶם / and he said to them
  english_pob_choice: and he said to them
  chosen_korean: 그들에게 말했습니다
  alternatives_korean:
  - 그들에게 물었습니다
  - 그들에게 말하여
  lexicon: HALOT
  rationale: 히브리어는 일반적인 ‘말하다’ 동사를 쓰므로, 질문 내용이 뒤따르더라도 서술어는 ‘말했습니다’로 유지했습니다.
- source_word: מַה זֶּה שַׁבְתֶּם / Why have you returned?
  english_pob_choice: Why have you returned?
  chosen_korean: 왜 돌아왔습니까?
  alternatives_korean:
  - 무슨 일로 돌아왔습니까?
  - 어찌하여 돌아왔습니까?
  lexicon: HALOT
  rationale: 직역하면 ‘무엇이 이것이냐, 돌아왔느냐’의 관용 표현이므로, 한국어에서는 목적을 묻는 자연스러운 질문 ‘왜’로 기능을 살렸습니다.
