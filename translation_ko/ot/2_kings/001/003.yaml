base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
  footnotes:
  - marker: a
    text: Or, “Is it for lack of a God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼의 천사가 디셉 사람 엘리야에게 말했습니다. “일어나 올라가서 사마리아 왕의 사자들을 맞이하고, 그들에게 말하십시오. ‘이스라엘에 하나님이 없어서[a] 너희가 에그론의 신 바알세붑에게 물으러 가는 것입니까?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이스라엘에 하나님이 없기 때문에 너희가 에그론의 신 바알세붑에게 물으러 가는 것입니까?”
    reason: 히브리어의 מִבְּלִי אֵין이 이루는 수사적 ‘~이 없어서/부족해서’ 원인 표현을 한국어로 달리 풀어 쓴 대안입니다.
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: 문맥상 하늘 존재를 가리키므로 ‘천사’가 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  english_pob_choice: Elijah the Tishbite
  chosen_korean: 디셉 사람 엘리야
  alternatives_korean:
