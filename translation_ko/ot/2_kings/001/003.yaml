base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/003.yaml
  text: But the angel of Yahweh spoke to Elijah the Tishbite[a], “Get up, go up to meet the messengers of the king of Samaria, and say to them, ‘Is it because there is no God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?’”
  footnotes:
  - marker: a
    text: Or, “Is it for lack of a God in Israel that you are going to inquire of Baal-zebub, the god of Ekron?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼의 천사가 디셉 사람 엘리야에게 말했습니다. “일어나 올라가서 사마리아 왕의 사자들을 맞이하고, 그들에게 말하십시오. ‘이스라엘에 하나님이 없어서 너희가 에그론의 신 바알세붑에게 물으러 가는 것이냐?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “이스라엘에 하나님이 없기 때문에 너희가 에그론의 신 바알세붑에게 물으러 가는 것이냐?”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: 문맥상 하늘 존재를 가리키므로 ‘천사’가 자연스럽고, יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֵלִיָּה הַתִּשְׁבִּי
  english_pob_choice: Elijah the Tishbite
  chosen_korean: 디셉 사람 엘리야
  alternatives_korean:
  - 디셉 출신 엘리야
  - 디셉 사람인 엘리야
  lexicon: HALOT
  rationale: 지명형 수식 הַתִּשְׁבִּי를 현대 한국어에서 가장 익숙한 관용으로 ‘디셉 사람’이라 옮겼습니다.
- source_word: הֲמִבְּלִי אֵין אֱלֹהִים בְּיִשְׂרָאֵל
  english_pob_choice: Is it because there is no God in Israel
  chosen_korean: 이스라엘에 하나님이 없어서
  alternatives_korean:
  - 이스라엘에 하나님이 없기 때문에
  - 이스라엘에 하나님이 없는 탓에
  lexicon: HALOT
  rationale: 수사적 책망의 뉘앙스를 살리기 위해 영어 POB의 의미를 따라 원인절로 자연스럽게 풀되, ‘하나님’은 בְּיִשְׂרָאֵל의 대조를 분명히 드러냅니다.
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  english_pob_choice: Baal-zebub, the god of Ekron
  chosen_korean: 에그론의 신 바알세붑
  alternatives_korean:
  - 에그론의 하나님 바알세붑
  - 에그론의 신인 바알세붑
  lexicon: HALOT
  rationale: בַּעַל זְבוּב과 אֱלֹהֵי עֶקְרוֹן의 연결을 살려, 에그론의 우상 신을 직접 지칭하는 형태로 옮겼습니다.
theological_decisions:
- issue: 야훼의 천사 표현
  chosen_reading: ‘야훼의 천사’로 옮기고 신원 해석은 본문 밖으로 미루었습니다.
  alternative_readings:
  - ‘야훼의 사자’
  - 특정 현현으로 해석하는 번역
  rationale: 본문은 사자/천사라는 어휘를 말할 뿐이므로, 번역은 문자적 용례를 유지하고 신학적 동일시를 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 이스라엘에 하나님이 없어서
  chosen_reading: 반어적 책망으로 읽히는 질문을 한국어의 원인절 구조로 표현했습니다.
  alternative_readings:
  - ‘하나님이 없기 때문에’
  - 직역형 의문문
  rationale: 히브리어 수사문은 ‘왜 다른 신에게 묻느냐’는 비판을 드러내므로, 한국어에서도 그 책망의 힘이 분명히 드러나야 합니다.
  doctrine_reference: DOCTRINE.md Literary register and rhetorical questions
