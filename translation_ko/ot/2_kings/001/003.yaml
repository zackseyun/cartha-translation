  lexicon: HALOT
  rationale: 수사적 책망의 뉘앙스를 살리기 위해 영어 POB의 의미를 따라 원인절로 자연스럽게 풀되, ‘하나님’은 בְּיִשְׂרָאֵל의 대조를 분명히 드러냅니다.
- source_word: בַּעַל זְבוּב אֱלֹהֵי עֶקְרוֹן
  english_pob_choice: Baal-zebub, the god of Ekron
  chosen_korean: 에그론의 신 바알세붑
  alternatives_korean:
  - 에그론의 하나님 바알세붑
  - 에그론의 신인 바알세붑
  lexicon: HALOT
  rationale: בַּעַל זְבוּב과 אֱלֹהֵי עֶקְרוֹן의 연결을 살려, 에그론의 우상 신을 직접 지칭하는 형태로 옮겼습니다.
theological_decisions:
- issue: 야훼의 천사 표현
  chosen_reading: ‘야훼의 천사’로 옮기고 신원 해석은 본문 밖으로 미루었습니다.
  alternative_readings:
  - ‘야훼의 사자’
  - 특정 현현으로 해석하는 번역
  rationale: 본문은 사자/천사라는 어휘를 말할 뿐이므로, 번역은 문자적 용례를 유지하고 신학적 동일시를 덧붙이지 않는 것이 적절합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §3
- issue: 이스라엘에 하나님이 없어서
  chosen_reading: 반어적 책망으로 읽히는 질문을 한국어의 원인절 구조로 표현했습니다.
  alternative_readings:
  - ‘하나님이 없기 때문에’
  - 직역형 의문문
  rationale: 히브리어 수사문은 ‘왜 다른 신에게 묻느냐’는 비판을 드러내므로, 한국어에서도 그 책망의 힘이 분명히 드러나야 합니다.
  doctrine_reference: DOCTRINE.md Literary register and rhetorical questions
