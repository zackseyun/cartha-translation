base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/002.yaml
  text: Now Ahaziah fell through the lattice in his upper room[a], which was in Samaria, and was injured. So he sent messengers and said to them, “Go, inquire of Baal-zebub, the god of Ekron, whether I will recover from this sickness.”
  footnotes:
  - marker: a
    text: Baal-zebub is the Hebrew form of the name; the later form Beelzebub appears in Greek and in some English tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 아하시야는 사마리아에 있는 자기 다락방의 격자창을 통해 떨어져 다쳤습니다. 그래서 그는 사자들을 보내며 그들에게 말했습니다. "가서 에그론의 신 바알-즈붑에게 내가 이 병에서 회복될지 물어보아라."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 בַּעַל זְבוּב(바알-즈붑)라고 읽습니다. 뒤의 전승에서 더 익숙한 형태인 ‘베엘세붑’이 나타납니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעַד הַשְּׂבָכָה
  english_pob_choice: through the lattice
  chosen_korean: 격자창을 통해
  alternatives_korean:
  - 격자문을 통해
  - 창살을 통해
  - 격자 사이로
  lexicon: HALOT
  rationale: בְּעַד는 ‘~을 통해’의 통과 의미를 가지며, שְׂבָכָה는 격자 구조를 가리키므로 ‘격자창을 통해’가 구체성과 자연스러움을 함께 살립니다.
- source_word: עֲלִיָּתוֹ
  english_pob_choice: his upper room
  chosen_korean: 자기 다락방
  alternatives_korean:
  - 자기 위층 방
  - 자기 상층실
  - 자기 윗방
  lexicon: HALOT
  rationale: עֲלִיָּה는 집의 위층에 있는 방을 뜻하므로, 현대 한국어에서 이해하기 쉬운 ‘다락방’으로 옮기되 상층 공간이라는 의미를 유지했습니다.
- source_word: וַיָּחַל
  english_pob_choice: was injured
  chosen_korean: 다쳤습니다
  alternatives_korean:
  - 부상을 입었습니다
  - 병들었습니다
  - 앓게 되었습니다
  lexicon: HALOT
  rationale: 문맥상 낙상 직후의 상태를 나타내므로, 단순한 병발을 넘어서 사고로 인한 손상을 드러내는 ‘다쳤습니다’가 적절합니다.
- source_word: בַּעַל זְבוּב
  english_pob_choice: Baal-zebub
  chosen_korean: 바알-즈붑
  alternatives_korean:
  - 바알-제붑
  - 바알세붑
  - 베엘세붑
  lexicon: HALOT
  rationale: 히브리어 고유명사를 음역하되, 영어 전통형인 Beelzebub에 끌려가지 않도록 히브리어 자형에 가까운 ‘바알-즈붑’을 채택했습니다.
theological_decisions:
- issue: 우상 신탁을 구하는 왕의 발화 방식
  chosen_reading: 직접 인용 안에서 명령형을 그대로 살려, 왕이 이방 신에게 점을 치도록 지시하는 불경한 행위를 분명히 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘물어보아라’ 정도로 약화
  - ‘상담해 보아라’처럼 중립화
  rationale: דִרְשׁוּ는 단순한 질문이 아니라 신탁을 구하는 행위이므로, 한국어에서도 종교적 조회의 성격이 드러나야 합니다.
  doctrine_reference: 우상숭배 서술의 직설성 유지; source-direct rendering
