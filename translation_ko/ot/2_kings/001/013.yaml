revisions:
- from: 그가 다시 셋째 오십부장과 그 부하 오십 명을 보냈습니다. 그가 올라와 이르렀고, 셋째 오십부장은 엘리야 앞에서 무릎을 꿇고 그에게 간청하며 그에게 말했습니다. 「하나님의 사람님, 제 목숨과 이 오십 명 당신의 종들의 목숨을 당신 눈앞에서 귀하게 여겨 주십시오」.[a]
  to: 그가 다시 셋째 오십부장과 그의 부하 오십 명을 보냈습니다. 그 셋째 오십부장은 올라가서 이르렀습니다. 그는 엘리야 앞에서 무릎을 꿇고 그에게 간청하며 말했습니다. 「하나님의 사람이시여, 부디 제 목숨[a]과 당신의 종들인 이 오십 명의 목숨을 귀하게 여겨 주십시오.」
  rationale: 부자연스럽거나 비표준적인 호칭과 어순을 고치고, ‘눈앞’의 공간적 표현을 히브리어 관용구의 평가적 의미에 맞게 다듬었습니다. 원문의 간청, 군사적 관계, 반복되는 행동, 그리고 네페쉬의 문맥상 ‘목숨’이라는 의미는 유지했습니다.
