  text: וַ/יָּ֗שָׁב וַ/יִּשְׁלַ֛ח שַׂר חֲמִשִּׁ֥ים שְׁלִשִׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֡עַל וַ/יָּבֹא֩ שַׂר הַ/חֲמִשִּׁ֨ים הַ/שְּׁלִישִׁ֜י וַ/יִּכְרַ֥ע עַל בִּרְכָּ֣י/ו לְ/נֶ֣גֶד אֵלִיָּ֗הוּ וַ/יִּתְחַנֵּ֤ן אֵלָי/ו֙ וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים תִּֽיקַר נָ֣א נַפְשִׁ֗/י וְ/נֶ֨פֶשׁ עֲבָדֶ֥י/ךָֽ אֵ֛לֶּה חֲמִשִּׁ֖ים בְּ/עֵינֶֽי/ךָ־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/013.yaml
  text: Again he sent a third captain of fifty with his fifty[a]. He went up and came, and the third captain of fifty knelt on his knees before Elijah and pleaded with him and said to him, “Man of God[b], please let my life and the life of these fifty servants of yours be precious in your sight.”
  footnotes:
  - marker: a
    text: Or “let my soul and the soul of these fifty your servants be precious in your sight.” Hebrew nephesh can mean “life,” “self,” or “soul,” depending on context.
    reason: lexical_alternative
  - marker: b
    text: Or 'these fifty your servants'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 다시 셋째 오십부장과 그의 부하 오십 명을 보냈습니다. 그 셋째 오십부장은 올라가서 이르렀습니다. 그는 엘리야 앞에서 무릎을 꿇고 그에게 간청하며 말했습니다. 「하나님의 사람이시여, 부디 제 목숨[a]과 당신의 종들인 이 오십 명의 목숨을 귀하게 여겨 주십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제 영혼과 당신의 종들인 이 오십 명의 영혼을 귀하게 여겨 주십시오.” 히브리어 네페쉬(nephesh)는 문맥에 따라 “목숨”, “자신”, 또는 “영혼”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 거듭
  lexicon: HALOT
  rationale: 서술 흐름에서 반복 행동을 나타내는 পুন帰/재개 의미를 자연스럽게 살리되, 불필요하게 직역투가 되지 않도록 했습니다.
- source_word: שַׂר חֲמִשִּׁים שְׁלִשִׁי
  english_pob_choice: a third captain of fifty
  chosen_korean: 셋째 오십부장
  alternatives_korean:
  - 세 번째 오십부장
  - 오십부장 셋째
  lexicon: HALOT
  rationale: 지휘관의 직분과 순번을 함께 드러내는 표현으로, 군사적 호칭을 한국어로 간결하게 옮겼습니다.
- source_word: וַיִּכְרַע עַל בִּרְכָּיו
  english_pob_choice: knelt on his knees
  chosen_korean: 무릎을 꿇고
  alternatives_korean:
  - 무릎에 꿇고
  - 두 무릎을 꿇고
  lexicon: HALOT
  rationale: 히브리어의 겸손한 몸짓을 한국어 관용구로 자연스럽게 옮겼습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: Man of God
  chosen_korean: 하나님의 사람님
  alternatives_korean:
  - 하나님의 사람
  - 하나님 사람님
  lexicon: HALOT
  rationale: 고정 칭호인 '하나님의 사람'을 살리되, 직접 호칭의 뉘앙스를 문장부호로 처리하는 대신 대화체의 간청 맥락을 반영해 존대 형태로 다듬었습니다.
- source_word: תִּיקַר נָא נַפְשִׁי
  english_pob_choice: please let my life ... be precious
  chosen_korean: 제 목숨 ... 귀하게 여겨 주십시오
  alternatives_korean:
  - 제 생명 ... 귀하게 해 주십시오
  - 제 목숨 ... 소중하게 여겨 주십시오
  lexicon: HALOT
  rationale: נפש를 이 장면의 생명/목숨으로 이해하여 '목숨'으로 옮겼고, '귀하게 여기다'로 मूल्य/귀중함의 동사를 보존했습니다.
- source_word: וְנֶפֶשׁ עֲבָדֶיךָ אֵלֶּה חֲמִשִּׁים
  english_pob_choice: the life of these fifty servants of yours
  chosen_korean: 이 오십 명 당신의 종들의 목숨
  alternatives_korean:
  - 당신의 오십 명 종들의 목숨
  - 이 오십 명의 당신 종들의 목숨
  lexicon: HALOT
  rationale: 히브리어의 '당신의 종들, 이 오십 명'이라는 결합을 유지하면서도 한국어 어순에 맞게 정리했습니다. '종'은 עבדים의 기본 대응어를 따랐습니다.
- source_word: בְּעֵינֶיךָ
  english_pob_choice: in your sight
  chosen_korean: 당신 눈앞에서
  alternatives_korean:
  - 당신 보시기에
  - 당신 눈에
  lexicon: HALOT
  rationale: 평가와 배려의 관용구를 살리되, 직역투를 줄이기 위해 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: נפש의 번역
  chosen_reading: 목숨
  alternative_readings:
  - 영혼
  - 생명
  rationale: 이 본문은 생사 위협 속 간청이므로, 영혼론을 불필요하게 불러오지 않도록 문맥상 '목숨'을 택했습니다.
  doctrine_reference: 원문 우선 번역; 문맥 우선 의미 결정
- issue: 직접 호칭에서의 존대 처리
  chosen_reading: 하나님의 사람님 / 여겨 주십시오
  alternative_readings:
  - 하나님의 사람, ... 여겨 주십시오
  - 하나님의 사람이여, ... 여겨 주십시오
  rationale: 엘리야에게 극도의 공손함으로 간청하는 장면이므로, 한국어 합쇼체에 맞게 직접화법의 존대 강도를 반영했습니다.
  doctrine_reference: 화행 보존; 공손도와 긴장감 유지
