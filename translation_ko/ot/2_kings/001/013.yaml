  naturalness: ‘하나님의 사람님’은 현대 표준 한국어의 자연스러운 호칭이 아니며, ‘이 오십 명 당신의 종들’도 어순이 부자연스럽습니다. 또한 ‘그가 올라와 이르렀고’는 한국어에서 다소 어색하므로 주어를 밝혀 자연스럽게 정리했습니다.
