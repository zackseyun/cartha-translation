base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/015.yaml
  text: Then the angel of Yahweh spoke to Elijah[a], “Go down with him; do not be afraid of him.” So he arose and went down with him to the king.
  footnotes:
  - marker: a
    text: Or, more literally, “do not be afraid from before him,” that is, “do not fear because of his presence.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야훼의 천사가 엘리야에게 말했습니다. “그와 함께 내려가십시오. 그를 두려워하지 마십시오.[a]” 그래서 그는 일어나 그와 함께 왕에게 내려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그의 앞에서 두려워하지 마십시오”이며, 곧 “그의 존재 때문에 두려워하지 마십시오”라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  english_pob_choice: the angel of Yahweh
  chosen_korean: 야훼의 천사
  alternatives_korean:
  - 야훼의 사자
  - 야훼의 메신저
  lexicon: HALOT
  rationale: מַלְאַךְ은 문맥상 단순한 ‘보냄을 받은 자’보다 초자연적 존재를 가리키는 용례가 자연스러우므로 ‘천사’로 옮기고, יְהוָה는 프로젝트 기준에 따라 ‘야훼’로 유지했습니다.
- source_word: רֵד
  english_pob_choice: Go down
  chosen_korean: 내려가십시오
  alternatives_korean:
  - 가십시오
  - 내려가세요
  lexicon: HALOT
  rationale: ירד의 명령형으로서 지리적 하강과 함께 동행 명령을 나타내므로, 현대 한국어에서 자연스럽고 공손한 ‘내려가십시오’가 가장 가깝습니다.
- source_word: אַל תִּירָא מִפָּנָיו
  english_pob_choice: do not be afraid of him
  chosen_korean: 그를 두려워하지 마십시오
  alternatives_korean:
  - 그 앞에서 두려워하지 마십시오
  - 그의 얼굴 앞에서 두려워하지 마십시오
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의 얼굴/앞으로부터’이지만, 관용적으로는 ‘그를 두려워하다’의 의미이므로 자연스러운 금지 명령으로 풀어 옮겼습니다.
- source_word: וַיָּקָם וַיֵּרֶד
  english_pob_choice: So he arose and went down
  chosen_korean: 그래서 그는 일어나 … 내려갔습니다
  alternatives_korean:
  - 그리하여 그는 일어나 내려갔습니다
  - 그래서 그가 일어나 내려갔습니다
  lexicon: HALOT
  rationale: 연속 서사 동사 וַיָּקָם/וַיֵּרֶד의 순서를 살리되, 한국어에서는 ‘일어나…내려갔습니다’로 간결하게 연결하는 것이 자연스럽습니다.
theological_decisions:
- issue: 야훼의 천사의 음성 전달 방식
  chosen_reading: 직접화법으로 명령을 전달하고, 엘리야는 이에 즉각 순종합니다.
  alternative_readings:
  - 서술적으로 완화하여 단순 지시로 처리
  - 천사를 단지 전달자 수준으로 약화
  rationale: 본문은 ‘야훼의 천사’가 실제로 말하고, 엘리야가 그 말에 따라 행동하는 장면을 제시하므로, 천사의 권위와 순종의 즉시성을 약화하지 않고 보존하는 것이 좋습니다.
  doctrine_reference: 본문 내 천사/계시 서술의 서사적 표지 보존
