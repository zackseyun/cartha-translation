  - 그에게 말씀하셨습니다
  lexicon: HALOT
  rationale: 직접 화법을 여는 일반 서술동사로 ‘말했습니다’를 사용해 뒤의 예언 공식과 구별되게 했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: POB doctrine term list
  rationale: 이 프로젝트의 기본 용례에 따라 여호와 대신 ‘야훼’를 유지해 מקור의 신명 표기를 직접 드러냈습니다.
- source_word: לִדְרֹשׁ בְּבַעַל זְבוּב
  english_pob_choice: to inquire of Baal-zebub
  chosen_korean: 바알세붑에게 문의하였으니
  alternatives_korean:
  - 바알세붑을 찾으려고
  - 바알세붑에게 물으려고
  lexicon: HALOT
  rationale: דרש의 종교적·신탁적 의미를 살려 ‘문의하다’로 옮겼고, 본문 형태인 바알세붑을 음역해 보존했습니다.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  english_pob_choice: the bed on which you have gone up
  chosen_korean: 네가 올라간 침상
  alternatives_korean:
  - 네가 올라간 그 침상
  - 네가 올라가 있는 침상
  lexicon: HALOT
  rationale: מִטָּה는 침상/침대로 옮길 수 있으나, 문맥의 단단한 예언 경고를 고려해 비교적 자연스러운 ‘침상’을 택했습니다. ‘올라간’은 עלה의 직설적 이미지를 살렸습니다.
theological_decisions:
- issue: 예언적 심판 공식의 직접성
  chosen_reading: 야훼의 말씀을 직접 인용하는 형식으로, 최종 심판 선언을 완곡하게 줄이지 않고 유지했습니다.
  alternative_readings:
  - ‘야훼께서 이렇게 말씀하셨습니다’
  - ‘야훼의 뜻은 이러합니다’
  rationale: 본문은 왕의 신탁 탐문에 대한 단호한 심판 선언이므로, 예언자 문체의 직접성과 경고성을 보존하는 것이 중요합니다.
  doctrine_reference: Prophetic oracle style in OT narrative
