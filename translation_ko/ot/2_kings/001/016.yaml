  lexicon: HALOT
  rationale: דרש의 종교적·신탁적 의미를 살려 ‘문의하다’로 옮겼고, 본문 형태인 바알세붑을 음역해 보존했습니다.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  english_pob_choice: the bed on which you have gone up
  chosen_korean: 네가 올라간 침상
  alternatives_korean:
