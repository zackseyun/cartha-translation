  source_fidelity: 핵심 의미와 심판 선언은 대체로 충실합니다. 그러나 ‘그의 말씀을 문의할 하나님’은 히브리어 לִדְרֹשׁ בִּדְבָרוֹ의 신탁을 구하는 뜻을 한국어에서 다소 부자연스럽고 모호하게 만듭니다. ‘그분의 말씀을 구할 하나님’이 하나님의 신탁/응답을 찾는다는 뜻을 더 정확히 전달합니다.
  naturalness: 합쇼체의 기본 register는 유지되어 있으나, ‘문의할 하나님’은 현대 한국어에서 어색합니다. 또한 각주 표지를 모두 인용문 끝에 모아 둔 방식은 해당 어휘와의 연결을 불명확하게 합니다.
  terminology: ‘야훼’, ‘에그론’, ‘바알세붑’, ‘침상’은 적절합니다. ‘바알세붑’은 마소라 본문의 형태를 보존해야 하며, 후대의 ‘바알세불’은 본문이 아니라 각주에서만 언급하는 것이 적절합니다.
  issues:
