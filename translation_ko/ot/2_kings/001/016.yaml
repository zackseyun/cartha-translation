base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/016.yaml
  text: 'And he spoke to him[a], “Thus says Yahweh: Because you have sent messengers to inquire of Baal-zebub, the god of Ekron—is it because there is no God in Israel to inquire of his word? Therefore the bed on which you have gone up[c][b], you will not come down from it, for you shall surely die.”'
  footnotes:
  - marker: a
    text: 'Hebrew: “to inquire of his word,” likely meaning to seek a divine message or oracle from him.'
    reason: lexical_alternative
  - marker: b
    text: The name is spelled Baal-zebub in the Hebrew text; a related form, Baal-zebul, appears in later tradition.
    reason: alternative_reading
  - marker: c
    text: Or 'the bed that you have gone up on there'.
    reason: previous_rendering
translation:
  language: ko
  text: 그에게 말했습니다. 「야훼께서 이렇게 말씀하십니다. 네가 사자를 보내 에그론의 신 바알세붑에게 문의하였으니 — 이스라엘에 그의 말씀을 문의할 하나님이 없다는 말이냐? 그러므로 네가 올라간 침상에서는 내려오지 못할 것이며, 너는 반드시 죽을 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문의하다’는 כאן의 דרש가 지닌 신탁/신적 응답 탐색의 뜻을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바알세붑’은 히브리어 본문 형태를 따른 표기이며, 후대 전승의 ‘바알세불’과는 다릅니다.
    reason: alternative_reading
  - marker: c
    text: ‘침상’은 “the bed on which you have gone up”의 비교적 직역형으로, ‘올라가다’의 공간적 이미지를 보존합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְדַבֵּר אֵלָיו
