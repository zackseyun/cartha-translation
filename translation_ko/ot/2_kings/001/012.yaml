- from: 엘리야가 그들에게 대답하고 말했습니다. 「내가 하나님의 사람이라면, 하늘에서 불이 내려와 너와 네 오십 명을 삼키십시오.」 그러자 하나님의 불이 하늘에서 내려와 그와 그의 오십 명을 삼켰습니다.[a][b][c]
  to: 엘리야가 그들에게 대답하고 말했습니다. 「내가 하나님의 사람이라면[a], 하늘에서 불이 내려와 너와 네 오십 명[b]을 삼키게 하십시오.」 그러자 하나님의 불[c]이 하늘에서 내려와 그와 그의 오십 명을 삼켰습니다.
  rationale: 불을 향한 부자연스러운 존대 명령을 한국어의 자연스러운 간구형 ‘삼키게 하십시오’로 고쳐 히브리어 명령·간구법의 힘을 보존했습니다. 원문의 ‘하나님의 불’과 지휘관 및 그의 오십 명의 구별은 유지했습니다. 각주 표지를 해당 표현에 붙이고, c의 대안을 본문과 중복되지 않는 속격 해석으로 바로잡았습니다.
