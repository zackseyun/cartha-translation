base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
  footnotes:
  - marker: a
    text: Or “If I am the man of God.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your fifty,” that is, the captain’s company of fifty men.
    reason: cultural_note
  - marker: c
    text: Or “fire from God came down from heaven.”
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야가 그들에게 대답하고 말했습니다. 「내가 하나님의 사람이라면[a], 하늘에서 불이 내려와 너와 네 오십 명[b]을 삼키게 하십시오.」 그러자 하나님의 불[c]이 하늘에서 내려와 그와 그의 오십 명을 삼켰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그 하나님의 사람이라면.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “너의 오십 명”, 곧 그 지휘관이 거느린 오십 명의 부대를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “하나님에게서 온 불이 하늘에서 내려와.”
    reason: lexical_alternative
