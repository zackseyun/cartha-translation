base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/012.yaml
  text: Elijah answered and said to them[a], “If I am a man of God[c][b], let fire come down from heaven and consume you and your fifty.” Then fire came down from heaven and consumed him and his fifty.
  footnotes:
  - marker: a
    text: Or “If I am the man of God.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “your fifty,” that is, the captain’s company of fifty men.
    reason: cultural_note
  - marker: c
    text: Or “fire from God came down from heaven.”
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야가 그들에게 대답하고 말했습니다. 「내가 하나님의 사람이라면, 하늘에서 불이 내려와 너와 네 오십 명을 삼키십시오.」 그러자 하나님의 불이 하늘에서 내려와 그와 그의 오십 명을 삼켰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그 하나님의 사람이라면.”
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 “너의 오십 명”, 곧 그 지휘관의 오십 명 부대를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 “하나님의 불이 하늘에서 내려와”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן אֵלִיָּה וַיְדַבֵּר אֲלֵי/הֶם
  english_pob_choice: answered and said to them
  chosen_korean: 대답하고 말했습니다
  alternatives_korean:
  - 대답하여 말했습니다
  - 응답하여 말했습니다
  lexicon: HALOT
  rationale: 히브리어의 관용적인 반응-발화 결합을 살려, 단순한 '말하다'보다 응답의 흐름이 드러나도록 옮겼습니다.
- source_word: אִם אִישׁ הָאֱלֹהִים אָנִי
  english_pob_choice: If I am a man of God
  chosen_korean: 내가 하나님의 사람이라면
  alternatives_korean:
  - 내가 하나님의 사람이라면
  - 내가 하나님의 사람이라면요
  lexicon: HALOT
  rationale: 예언자적 칭호인 '하나님의 사람'을 유지했고, 조건절의 직설적 선언을 살려 'if'를 '...이라면'으로 옮겼습니다.
- source_word: תֵּרֶד אֵשׁ מִן הַשָּׁמַיִם
  english_pob_choice: let fire come down from heaven
  chosen_korean: 하늘에서 불이 내려와
  alternatives_korean:
  - 하늘에서 불이 내려오게 하여
  - 하늘에서 불이 내려와라
  lexicon: HALOT
  rationale: 저주의 요청/호소의 힘을 살리되, 한국어에서는 자연스럽게 명령적 결과를 빌어 말하는 구조로 옮겼습니다.
- source_word: אֵשׁ אֱלֹהִים
  english_pob_choice: the fire of God
  chosen_korean: 하나님의 불
  alternatives_korean:
  - 하나님의 불
  - 하나님으로부터 온 불
  lexicon: HALOT
  rationale: 히브리어의 속격 관계를 직역적으로 살려, 불이 하나님께 속하거나 하나님에게서 비롯됨을 함께 드러냈습니다.
- source_word: וְתֹאכַל אֹתְךָ וְאֶת חֲמִשֶּׁיךָ / וַתֹּאכַל אֹתוֹ וְאֶת חֲמִשָּׁיו
  english_pob_choice: consume you and your fifty / consumed him and his fifty
  chosen_korean: 삼키십시오 / 삼켰습니다
  alternatives_korean:
  - 삼켜버리십시오 / 삼켜버렸습니다
  - 먹어치우십시오 / 먹어치웠습니다
  lexicon: HALOT
  rationale: 불의 파괴적 소멸을 자연스럽고 강하게 전하는 동사로 '삼키다'를 택했으며, 반복되는 동사를 앞뒤에서 일관되게 처리했습니다.
theological_decisions:
- issue: אֵשׁ אֱלֹהִים의 속격 표현
  chosen_reading: 하나님의 불
  alternative_readings:
  - 하늘에서 온 불
  - 하나님으로부터 온 불
  rationale: 본문은 불의 기원을 하나님께 명시하므로, 원문의 결속을 보존하는 속격 표현을 유지했습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: 하나님의 사람이라는 예언자 칭호
  chosen_reading: 하나님의 사람
  alternative_readings:
  - 하나님의 선지자
  - 신의 사람
  rationale: 본문의 칭호를 예언자 직함으로 그대로 살려, 후대 교회어휘로 바꾸어 약화시키지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 5
