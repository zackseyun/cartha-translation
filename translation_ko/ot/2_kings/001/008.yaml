    text: 히브리어 표현은 문자적으로 ‘털의 소유자’ 또는 ‘털의 주인’에 가깝습니다. 따라서 ‘털이 많은 사람’으로도, ‘털옷을 입은 사람’으로도 이해될 수 있습니다.
    reason: lexical_alternative
