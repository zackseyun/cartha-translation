translation:
  language: ko
  text: 그들이 그에게 「그는 털이 많은 사람이었고[a], 허리에 가죽띠를 띠고 있었습니다」라고 말하였습니다. 그러자 그는 「그는 디셉 사람 엘리야입니다」라고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
