source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח אֵלָ֛י/ו שַׂר חֲמִשִּׁ֖ים וַ/חֲמִשָּׁ֑י/ו וַ/יַּ֣עַל אֵלָ֗י/ו וְ/הִנֵּה֙ יֹשֵׁב֙ עַל רֹ֣אשׁ הָ/הָ֔ר וַ/יְדַבֵּ֣ר אֵלָ֔י/ו אִ֚ישׁ הָֽ/אֱלֹהִ֔ים הַ/מֶּ֥לֶךְ דִּבֶּ֖ר רֵֽדָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/009.yaml
  text: Then he sent to him a captain of fifty with his fifty men[a]. He went up to him, and behold, he was sitting on the top of the hill. He spoke to him, “Man of God, the king says[b], ‘Come down.’”
  footnotes:
  - marker: a
    text: Or “on the top of the mountain.” The Hebrew הַר can refer to a hill or a mountain depending on context.
    reason: lexical_alternative
  - marker: b
    text: 'Literally, “the king has spoken: ‘Come down.’” The Hebrew messenger formula uses “has spoken,” which is rendered idiomatically here as “says.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 오십부장과 그 부하 오십 명을 보냈습니다[a]. 그가 그에게 올라가 보니, 보라, 그가 산꼭대기에 앉아 있었습니다. 그가 그에게 말했습니다. 「하나님의 사람이여, 왕이 말합니다[b], ‘내려오십시오.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산 꼭대기에’. 히브리어 הַר는 문맥에 따라 ‘산’이나 ‘언덕’을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '직역하면 ‘왕이 말했습니다: “내려오라.”’입니다. 히브리어의 사자 공식은 ‘말하다’로 되어 있으므로, 여기서는 한국어답게 풀어 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂר חֲמִשִּׁים
  english_pob_choice: a captain of fifty
  chosen_korean: 오십부장
  alternatives_korean:
  - 오십 명의 대장
  - 오십 명을 거느린 장교
  lexicon: HALOT
  rationale: 군사 단위의 지휘관을 가리키는 표현이므로, 한국어 군사 관용에 맞는 ‘오십부장’으로 옮겨 계급적 의미를 간결하게 살렸습니다.
- source_word: וַחֲמִשָּׁיו
  english_pob_choice: with his fifty men
  chosen_korean: 그 부하 오십 명
  alternatives_korean:
  - 그의 오십 명
  - 그 아래의 오십 명
  lexicon: HALOT
  rationale: 지휘관에게 딸린 무리를 드러내기 위해 ‘부하’와 수량을 함께 살렸습니다.
- source_word: עַל רֹאשׁ הָהָר
  english_pob_choice: on the top of the hill
  chosen_korean: 산꼭대기
  alternatives_korean:
  - 산 정상
  - 언덕 꼭대기
  lexicon: HALOT
  rationale: ראש의 ‘정상/꼭대기’와 הַר의 지형 감각을 함께 살리되, 본문 흐름에서 자연스러운 ‘산꼭대기’로 옮겼습니다.
- source_word: הַמֶּלֶךְ דִּבֶּר
  english_pob_choice: the king says
  chosen_korean: 왕이 말합니다
  alternatives_korean:
  - 왕이 말했습니다
  - 왕이 명령합니다
  lexicon: HALOT
  rationale: 히브리어 사자 공식의 직설적 인용을 살리면서, 한국어에서는 현재형으로 전달되는 명령 전달 형식을 자연스럽게 반영했습니다.
- source_word: רֵדָה
  english_pob_choice: Come down
  chosen_korean: 내려오십시오
  alternatives_korean:
  - 내려오세요
  - 내려오라
  lexicon: HALOT
  rationale: 하위자가 위에 있는 예언자를 하향 이동으로 부르는 명령이므로, 공적인 명령체인 ‘내려오십시오’가 가장 적절합니다.
theological_decisions:
- issue: 왕의 명령을 전하는 사자 공식의 문체
  chosen_reading: 직설화법은 유지하되, 한국어 본문에서는 ‘왕이 말합니다’로 옮겨 왕의 발화가 즉시 인용문으로 이어지도록 했습니다.
  alternative_readings:
  - ‘왕이 말씀하셨습니다’
  - ‘왕이 명령하십니다’
  rationale: 히브리어의 ‘왕이 말하였다’는 전언 공식을 한국어에서 지나치게 딱딱하거나 과장된 어투로 만들지 않으면서도, 왕의 권위 있는 요청/명령이라는 힘을 보존합니다.
  doctrine_reference: 서사 본문 번역의 화용론적 등가
