source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר אֲלֵ/הֶ֔ם מֶ֚ה מִשְׁפַּ֣ט הָ/אִ֔ישׁ אֲשֶׁ֥ר עָלָ֖ה לִ/קְרַאתְ/כֶ֑ם וַ/יְדַבֵּ֣ר אֲלֵי/כֶ֔ם אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/007.yaml
  text: Then he said to them[a], “What was the appearance of the man who came up to meet you and spoke these words to you?”
  footnotes:
  - marker: a
    text: Or “What kind of man was he?” Literally, “What was the mishpat of the man...?” The Hebrew term can denote manner, description, or appearance; here it likely refers to the identifying description of the man.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 말했습니다. 「그 사람의 모습이 어떠했으며, 여러분에게 올라와서 여러분에게 이 말들을 한 사람이 누구였습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 מִשְׁפַּט은 여기서 ‘판단’보다 사람의 식별 가능한 모습, 설명, 외형을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה מִשְׁפַּט הָאִישׁ
  english_pob_choice: What was the appearance of the man
  chosen_korean: 그 사람의 모습이 어떠했으며
  alternatives_korean:
  - 그 사람의 특징이 무엇이었으며
  - 그 사람의 외형이 어떠했으며
  - 그 사람의 모습은 어떠했습니까
  lexicon: HALOT
  rationale: מִשְׁפָּט은 여기서 ‘판단’이 아니라 사람을 식별하게 하는 설명이나 외양을 가리키므로, POB의 ‘appearance’에 맞춰 ‘모습’으로 옮겼습니다.
- source_word: עָלָה לִקְרַאתְכֶם
  english_pob_choice: came up to meet you
  chosen_korean: 올라와서 여러분에게
  alternatives_korean:
  - 와서 여러분을 만나고
  - 여러분을 맞으러 올라와서
  - 다가와서 여러분에게
  lexicon: HALOT
  rationale: עָלָה의 ‘올라가다/올라오다’라는 방향성을 살리고, לִקְרַאתְכֶם은 ‘맞으러/만나러’의 만남 상황으로 이해해 자연스럽게 표현했습니다.
- source_word: וַיְדַבֵּר ... אֶת הַדְּבָרִים הָאֵלֶּה
  english_pob_choice: spoke these words to you
  chosen_korean: 여러분에게 이 말들을 한
  alternatives_korean:
  - 여러분에게 이 말들을 말했다
  - 여러분에게 이 말을 전한
  - 여러분에게 이 말들을 하신
  lexicon: HALOT
  rationale: 두 번째 וַיְדַבֵּר가 뒤의 직접목적어 ‘이 말들’을 받으므로, 한국어에서는 ‘한/말한’으로 정리해 중복을 줄이되 내용은 보존했습니다.
