    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 야훼께서 이렇게 말씀하십니다. “네가 올라간 그 침상에서 내려오지 못할 것이니, 네가 반드시 죽을 것이다.” 그러고 나서 엘리야가 떠났습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘침상’은 히브리어 מִטָּה의 기본값을 따른 것으로, 문맥상 병상/누운 자리의 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 올라감/내려감 대조를 보존하기 위해 ‘올라간 … 내려오지 못할’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: וְלָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그렇기 때문에
  - 따라서
  lexicon: HALOT
  rationale: 앞선 책망과 선포의 결과를 잇는 추론 표지로 자연스러운 현대 한국어 연결어인 ‘그러므로’를 선택했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: this is what Yahweh says
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 야훼께서 이렇게 말씀하시기를
  lexicon: HALOT
  rationale: 예언자 전언 공식의 힘을 살리면서도 현대 합쇼체로 읽히도록 ‘이렇게 말씀하십니다’로 옮겼습니다.
- source_word: הַמִּטָּה אֲשֶׁר עָלִיתָ שָּׁם
  english_pob_choice: the bed that you have gone up onto
  chosen_korean: 네가 올라간 그 침상
  alternatives_korean:
  - 네가 올라간 그 침대
  - 네가 그곳에 올라간 침상
  lexicon: HALOT
  rationale: מִטָּה는 여기서 ‘침상’이 더 문맥적으로 적절하고, 올라감/내려감의 수직 대비를 살리기 위해 ‘올라간 그 침상’으로 간결하게 옮겼습니다.
- source_word: לֹא תֵרֵד מִמֶּנָּה
  english_pob_choice: You will not come down from
  chosen_korean: 내려오지 못할 것이니
  alternatives_korean:
  - 내려가지 못할 것이니
  - 그곳에서 내려오지 못할 것이니
  lexicon: HALOT
  rationale: עלה/ירד의 대조를 한국어의 ‘올라가다/내려오다’로 자연스럽게 보존했습니다.
- source_word: כִּי מוֹת תָּמוּת
  english_pob_choice: for you will surely die
  chosen_korean: 네가 반드시 죽을 것이다
  alternatives_korean:
  - 너는 반드시 죽을 것이다
  - 반드시 죽게 될 것이다
  lexicon: HALOT
  rationale: 히브리어의 강조형(부정사 절대형+동사)을 ‘반드시’로 살려 확정성과 판결성을 드러냈습니다.
- source_word: וַיֵּלֶךְ אֵלִיָּה
  english_pob_choice: And Elijah went
  chosen_korean: 그런 다음 엘리야가 떠났습니다
  alternatives_korean:
  - 그리고 엘리야가 갔습니다
  - 엘리야가 떠났습니다
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 마무리하면서 הלך의 기본 의미를 한국어에서 가장 무난한 ‘떠났습니다’로 옮겼습니다.
theological_decisions:
- issue: 예언자 전언 공식에서 야훼의 이름을 어떻게 표기할 것인가
  chosen_reading: 본문의 직접 발화 표지를 살려 ‘야훼께서 이렇게 말씀하십니다’로 번역했습니다.
  alternative_readings:
  - ‘주님께서 이렇게 말씀하십니다’
  - ‘이것이 야훼의 말씀입니다’
  rationale: 이 구절은 יְהוָה를 직접 사용하므로 프로젝트 기본값에 따라 ‘야훼’를 유지해 신명칭을 가리고 대체하지 않도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
