  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
  footnotes:
  - marker: a
    text: Or, 'And he died ... And Jehoram reigned in his place.' The Hebrew verbs are simple narrative forms; 'became king' highlights accession, while 'reigned' is a more formal alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 말씀이 엘리야를 통해 하신 대로 죽었습니다. 그리고 여호람의 둘째 해에, 유다 왕 여호사밧의 아들 여호람이 그의 뒤를 이어 왕이 되었습니다. 그에게 아들이 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순 서술형입니다. 여기서는 ‘왕이 되었습니다’로 옮겼지만, 더 형식적으로는 ‘통치했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  english_pob_choice: So he died
  chosen_korean: 그는 … 죽었습니다
  alternatives_korean:
  - 그는 … 사망했습니다
  - 그리고 그는 죽었습니다
  lexicon: HALOT
  rationale: 서술 진행의 wayyiqtol을 자연스러운 한국어 과거 서술로 옮기되, 결과를 전면에 두는 영어 POB의 흐름을 살려 간결하게 처리했습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: 원문이 יְהוָה를 직접 사용하므로 프로젝트 기본값에 따라 야훼를 유지했습니다. 문맥상 ‘말씀’은 그에 합당한 직접 대응입니다.
- source_word: אֲשֶׁר דִּבֶּר אֵלִיָּהוּ
  english_pob_choice: that Elijah had spoken
  chosen_korean: 엘리야를 통해 하신
  alternatives_korean:
  - 엘리야가 말한
  - 엘리야를 통하여 말씀하신
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘엘리야가 말한’으로도 읽히지만, 앞의 ‘야훼의 말씀’이 엘리야를 매개로 전해진 것을 한국어에서 자연스럽게 드러내기 위해 ‘엘리야를 통해 하신’으로 옮겼습니다.
- source_word: וַיִּמְלֹךְ … תַּחְתָּיו
  english_pob_choice: And Jehoram became king in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그를 대신하여 왕이 되었습니다
  - 그 자리를 이어 왕이 되었습니다
  lexicon: HALOT
  rationale: מלך의 즉위 의미를 살리면서 תַּחְתָּיו의 ‘그의 자리/뒤를 잇다’를 한국어 관용으로 풀었습니다. ‘즉위하다’도 가능하지만 서술형으로는 ‘왕이 되었습니다’가 더 자연스럽습니다.
- source_word: בִּשְׁנַת שְׁתַּיִם לִיהוֹרָם …
  english_pob_choice: in the second year of Jehoram son of Jehoshaphat, king of Judah
  chosen_korean: 여호람의 둘째 해에, 유다 왕 여호사밧의 아들 여호람
  alternatives_korean:
  - 여호람의 이년째에, 유다 왕 여호사밧의 아들 여호람
  - 유다 왕 여호사밧의 아들 여호람의 둘째 해에
  lexicon: HALOT
  rationale: 왕위 연대 표기를 한국어 성경문체에 맞게 ‘둘째 해에’로 옮겼고, 동명이인 구분을 위해 ‘유다 왕 여호사밧의 아들’이라는 동격 구조를 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
