  - 유다 왕 여호사밧의 아들 여호람의 둘째 해에
  lexicon: HALOT
  rationale: 왕위 연대 표기를 한국어 성경문체에 맞게 ‘둘째 해에’로 옮겼고, 동명이인 구분을 위해 ‘유다 왕 여호사밧의 아들’이라는 동격 구조를 유지했습니다.
