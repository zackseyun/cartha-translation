  - 주
  rationale: 원문이 야훼의 언약 নাম을 직접 사용하므로 프로젝트 기본 표기인 ‘야훼’를 유지했습니다. 이는 본문이 단순한 칭호가 아니라 고유한 신적 이름을 말한다는 점을 보존합니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
