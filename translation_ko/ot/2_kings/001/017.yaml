  text: וַ/יָּ֜מָת כִּ/דְבַ֥ר יְהוָ֣ה אֲשֶׁר דִּבֶּ֣ר אֵלִיָּ֗הוּ וַ/יִּמְלֹ֤ךְ יְהוֹרָם֙ תַּחְתָּ֔י/ו בִּ/שְׁנַ֣ת שְׁתַּ֔יִם לִ/יהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה כִּ֛י לֹֽא הָ֥יָה ל֖/וֹ בֵּֽן׀־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/001/017.yaml
  text: So he died[a], according to the word of Yahweh that Elijah had spoken. And Jehoram became king in his place in the second year of Jehoram son of Jehoshaphat, king of Judah, because he had no son.
  footnotes:
  - marker: a
    text: Or, 'And he died ... And Jehoram reigned in his place.' The Hebrew verbs are simple narrative forms; 'became king' highlights accession, while 'reigned' is a more formal alternative.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 엘리야가 말한 야훼의 말씀대로 죽었습니다. 유다 왕 여호사밧의 아들 여호람의 둘째 해에 여호람이 그의 뒤를 이어 왕이 되었습니다.[a] 그에게 아들이 없었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순 서술형입니다. 여기서는 ‘왕이 되었습니다’로 옮겼지만, 더 형식적으로는 ‘통치했습니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
