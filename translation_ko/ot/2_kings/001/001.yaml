translation:
  language: ko
  text: 아합이 죽은 후에 모압이 이스라엘에 대항하여 반역하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְשַׁע
  english_pob_choice: rebelled
  chosen_korean: 반역하였습니다
  alternatives_korean:
  - 반란을 일으켰습니다
  - 배반하였습니다
  lexicon: HALOT
  rationale: פשע는 정치적·국가적 관계에서 상전에게 맞서는 반역을 뜻하므로, 단순한 ‘배반’보다 ‘반역’이 상황을 더 정확히 드러냅니다.
- source_word: מוֹאָב
  english_pob_choice: Moab
  chosen_korean: 모압
  alternatives_korean:
  - 모압 왕국
  lexicon: 고유명사 표기
  rationale: 나라 이름은 표준 음역인 ‘모압’으로 옮겨 원문 고유명사를 유지합니다.
- source_word: בְּיִשְׂרָאֵל
  english_pob_choice: against Israel
  chosen_korean: 이스라엘에 대항하여
  alternatives_korean:
  - 이스라엘을 상대로
  - 이스라엘에게
  lexicon: HALOT
  rationale: ב와 פשע의 결합은 문맥상 ‘~에 대항하여’라는 적대적 관계를 뜻하므로, 한국어에서도 정치적 대립을 분명하게 드러냈습니다.
- source_word: אַחֲרֵי מוֹת אַחְאָב
  english_pob_choice: After the death of Ahab
  chosen_korean: 아합이 죽은 후에
  alternatives_korean:
  - 아합의 죽음 뒤에
  - 아합이 죽은 다음에
  lexicon: HALOT
  rationale: אַחֲרֵי + מות + 이름은 자연스럽게 시간 부사절로 옮기는 것이 가장 명료하므로 ‘아합이 죽은 후에’로 처리했습니다.
