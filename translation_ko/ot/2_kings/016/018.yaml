source:
  edition: WLC
  text: וְ/אֶת מיסך הַ/שַּׁבָּ֜ת אֲשֶׁר בָּנ֣וּ בַ/בַּ֗יִת וְ/אֶת מְב֤וֹא הַ/מֶּ֨לֶךְ֙ הַֽ/חִיצ֔וֹנָ/ה הֵסֵ֖ב בֵּ֣ית יְהוָ֑ה מִ/פְּנֵ֖י מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/018.yaml
  text: And the covered way for the Sabbath that they had built in the house[a], and the outer entrance of the king[d][c][b], he turned away from the house of Yahweh because of the king of Assyria.
  footnotes:
  - marker: a
    text: Or 'the Sabbath covered structure,' 'the Sabbath pavilion,' or 'the Sabbath portico.' The exact architectural sense of the Hebrew term is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'the king's outer entrance' or 'the outer entryway for the king.'
    reason: lexical_alternative
  - marker: c
    text: Or 'he altered,' 'he turned aside,' or 'he relocated.' The Hebrew verb can denote turning aside or changing the placement of something, not only outright removal.
    reason: lexical_alternative
  - marker: d
    text: Or 'on account of the king of Assyria,' possibly 'for fear of the king of Assyria.'
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 그들이 집 안에 지은 안식일용 가리개와 왕의 바깥 출입문을, 앗시리아 왕 때문에 야훼의 집에서 옮겨 버렸습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘안식일용 덮은 구조물’, ‘안식일용 누각’, ‘안식일용 차양’일 수 있습니다. 히브리어 용어의 정확한 건축적 의미는 확실하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘왕의 바깥 출입문’이나 ‘왕을 위한 바깥 진입로’일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그는 돌려 놓았다’, ‘그는 돌이켰다’, ‘그는 옮겨 배치했다’일 수 있습니다. 이 동사는 단순한 제거보다 방향 전환이나 재배치를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘앗시리아 왕을 두려워하여’일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מיסך הַשַּׁבָּת
  english_pob_choice: the covered way for the Sabbath
  chosen_korean: 안식일용 가리개
  alternatives_korean:
  - 안식일용 덮은 구조물
  - 안식일용 누각
  - 안식일용 차양
  lexicon: HALOT
  rationale: מיסך는 희귀한 건축 용어로, 정확한 구조는 불확실하지만 ‘덮개/가리개’의 기능을 가진 시설로 이해하는 것이 가장 무난합니다. 한국어에서는 ‘가리개’가 구조물의 덮인 성격을 살리면서도 과도한 해석을 피합니다.
- source_word: מְבוֹא הַמֶּלֶךְ הַחִיצוֹנָה
  english_pob_choice: the outer entrance of the king
  chosen_korean: 왕의 바깥 출입문
  alternatives_korean:
  - 왕의 바깥 प्रवेश로
  - 왕의 외부 출입구
  - 왕의 바깥 진입로
  lexicon: HALOT
  rationale: מְבוֹא는 ‘들어감/출입’의 의미를 가진 입구·출입문입니다. ‘바깥 출입문’은 왕의 외부 접근로라는 성격을 살리면서도 자연스러운 현대 한국어로 옮깁니다.
- source_word: הֵסֵב
  english_pob_choice: he turned away
  chosen_korean: 옮겨 버렸습니다
  alternatives_korean:
  - 돌려 놓았습니다
  - 치워 버렸습니다
  - 돌이켜 옮겼습니다
  lexicon: HALOT
  rationale: 이 동사는 단순히 ‘돌다’보다 위치를 바꾸거나 치우는 결과를 가리킬 수 있습니다. 문맥상 성전 구조물을 다른 데로 재배치한 효과가 드러나도록 ‘옮겨 버렸습니다’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 יהוה는 고유명사 ‘야훼’로 옮기고, בית יהוה의 히브리어 관용구는 ‘집’으로 유지해 원문 이미지를 보존했습니다.
theological_decisions:
- issue: יהוה의 번역형
  chosen_reading: 고유명사 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기적 전통과 원어의 개인적 이름성을 드러내기 위해, 여기서는 칭호가 아니라 고유명사로 처리했습니다.
  doctrine_reference: Project glossary / YHWH rendering policy
- issue: מִפְּנֵי מֶלֶךְ אַשּׁוּר의 뉘앙스
  chosen_reading: ‘앗시리아 왕 때문에’로 처리해 원인 관계를 본문에 드러냈습니다.
  alternative_readings:
  - 앗시리아 왕을 두려워하여
  - 앗시리아 왕을 인하여
  rationale: 히브리어는 원인과 동기 둘 다 열어 두지만, 본문이 강조하는 압박 상황을 과잉 해석하지 않기 위해 가장 넓은 원인 표현을 택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
