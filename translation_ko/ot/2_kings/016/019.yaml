lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts
  chosen_korean: 이제 ... 나머지 행적
  alternatives_korean:
  - 그리고 ... 나머지 일들
  - 나머지 행적들
  lexicon: HALOT
  rationale: 여기서 יֶתֶר דִּבְרֵי는 왕조 사료의 정형 공식으로, 단순한 ‘말’보다 ‘행적’이 본문 기능에 더 맞고, וְ는 서술 전환을 나타내어 ‘이제’로 옮겼습니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: which he did
  chosen_korean: 그가 행한 일들
  alternatives_korean:
  - 그가 한 일들
  - 그가 이루어낸 일들
  lexicon: HALOT
  rationale: ‘그가 행한’은 히브리어 יחס절의 직역을 살리면서도 역사 서술의 공문서적 뉘앙스를 유지합니다.
- source_word: דִּבְרֵי הַיָּמִים
  english_pob_choice: the Chronicles
  chosen_korean: 역대지략
  alternatives_korean:
  - 역대기
  - 역사 기록
  lexicon: HALOT
  rationale: 이 표현은 단순한 ‘연대기’가 아니라 왕들의 공식 기록 문서명을 가리키므로, 문서성·사료성을 살린 ‘역대지략’으로 옮겼습니다.
- source_word: הֲלֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 기록되지 않았습니까
  - 기록되어 있지 않습니까
  lexicon: HALOT
  rationale: 수사적 질문을 한국어에서 자연스럽게 살리기 위해 부정 의문형으로 옮겼고, ‘쓰여 있지 않습니까’보다 문헌 기록 맥락에 맞는 ‘기록되어’로 했습니다.
theological_decisions:
- issue: 왕실 사료 언급의 기능
  chosen_reading: 본문은 아하스의 평가를 새로 제시하기보다, 그의 나머지 행적이 더 큰 역사 기록에 남아 있음을 독자에게 상기시키는 결말 공식으로 읽었습니다.
  alternative_readings:
  - 단순한 편집자 주석으로만 읽는 것
  - 평가적 요약으로 읽는 것
  rationale: 열왕기서의 종결 공식이므로, 서술 기능을 드러내되 신학적 해설을 과잉 부가하지 않았습니다.
  doctrine_reference: 성경 역사서의 정경적 서술 기능
