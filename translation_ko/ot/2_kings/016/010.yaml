  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ הַ/מֶּ֣לֶךְ אָחָ֡ז לִ֠/קְרַאת תִּגְלַ֨ת פִּלְאֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ דּוּמֶּ֔שֶׂק וַ/יַּ֥רְא אֶת הַ/מִּזְבֵּ֖חַ אֲשֶׁ֣ר בְּ/דַמָּ֑שֶׂק וַ/יִּשְׁלַח֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶל אוּרִיָּ֣ה הַ/כֹּהֵ֗ן אֶת דְּמ֧וּת הַ/מִּזְבֵּ֛חַ וְ/אֶת תַּבְנִית֖/וֹ לְ/כָֽל מַעֲשֵֽׂ/הוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/010.yaml
  text: Then King Ahaz went to meet Tiglath-pileser king of Assyria at Damascus, and he saw the altar that was at Damascus. And King Ahaz sent to Uriah the priest a model of the altar and its pattern, according to all its workmanship.
translation:
  language: ko
  text: 그때 아하스 왕은 아시리아 왕 디글랏빌레셀을 맞으러 다마스쿠스로 갔습니다. 그는 다마스쿠스에 있던 제단을 보고, 아하스 왕은 제사장 우리야에게 그 제단의 모형과 그 양식을, 곧 그 제작 방식에 따라 보냈습니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘맞으러 갔습니다’는 히브리어 לִקְרַאת의 대면·영접 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모형’과 ‘양식’은 히브리어 דְּמוּת와 תַּבְנִית의 두 겹 표현을 각각 살린 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרַאת
  english_pob_choice: went to meet
  chosen_korean: 맞으러 갔습니다
  alternatives_korean:
  - 만나러 갔습니다
  - 마주하러 갔습니다
  lexicon: WLC
  rationale: 단순한 이동보다 ‘맞으러’가 상대를 향해 나아가 만나는 뉘앙스를 살리며, POB의 meet를 자연스럽게 반영합니다.
- source_word: תִּגְלַת פִּלְאֶסֶר
  english_pob_choice: Tiglath-pileser
  chosen_korean: 디글랏빌레셀
  alternatives_korean:
  - 틸글랏-필레셀
  - 티글랏 필레셀
  lexicon: WLC
  rationale: 히브리어 고유명사를 현대 외래어 표기 감각으로 옮기되, 성경에서 널리 알려진 통용형을 너무 어색하게 끊지 않도록 붙여 적었습니다.
- source_word: מִזְבֵּחַ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 제사단
  - 단
  lexicon: WLC
  rationale: 예배용 구조물을 가리키는 기본어로 ‘제단’이 가장 직접적이며, 문맥상 우상제의 제단이 아니라도 장소·구조를 중립적으로 드러냅니다.
- source_word: דְּמוּת / תַּבְנִית
  english_pob_choice: a model ... and its pattern
  chosen_korean: 모형과 그 양식
  alternatives_korean:
  - 모사와 그 모양
  - 형상과 그 설계
  lexicon: WLC
  rationale: 두 명사 모두 복제된 외형과 설계도를 함께 가리키므로, ‘모형’과 ‘양식’으로 구분해 중복을 피하면서 의미를 보존했습니다.
theological_decisions:
- issue: 아하스가 ‘보는 것’과 ‘보여 주는 양식’을 기록하는 서술의 기능
  chosen_reading: 본문은 아하스의 정치적·종교적 모방을 드러내는 역사 서술로 읽고, 해석적 평가어를 덧붙이지 않았습니다.
  alternative_readings:
  - 우상숭배 비판을 문장 안에 직접 강화하는 번역
  - ‘본떠 만들다’로 요약해 서술을 압축하는 번역
  rationale: 히브리어 동사와 명사 배열이 관찰→전달의 순서를 분명히 하므로, 독자가 원문이 주는 아이러니를 스스로 읽도록 보존하는 편이 적절합니다.
  doctrine_reference: 역사서 내 서술의 직접성 보존
