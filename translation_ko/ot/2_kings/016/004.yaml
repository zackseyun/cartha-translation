base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/004.yaml
  text: He sacrificed and burned incense on the high places[a], on the hills, and under every green tree.
  footnotes:
  - marker: a
    text: Or 'under every leafy tree' or 'under every luxuriant tree.' The Hebrew adjective can describe something green, fresh, or luxuriant.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 산당들[a]과 산들 위에서, 또 모든 푸른 나무 아래에서 제사를 드리고 향을 피웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘높은 곳들’입니다. 히브리어 בָּמוֹת는 여기서 산당, 곧 제의 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְזַבֵּחַ
  english_pob_choice: He sacrificed
  chosen_korean: 제사를 드리고
  alternatives_korean:
  - 희생제를 드리고
  - 희생제사를 드리고
  lexicon: HALOT
  rationale: זבח는 제사를 드리다의 뜻이므로, 한국어에서는 자연스러운 합쇼체 표현인 '제사를 드리고'로 옮겨 제의 행위를 분명하게 살렸습니다.
- source_word: וַיְקַטֵּר
  english_pob_choice: burned incense
  chosen_korean: 향을 피웠습니다
  alternatives_korean:
  - 분향했습니다
  - 향을 사르게 했습니다
  lexicon: HALOT
  rationale: 문맥상 제의적 ‘향을 피우다’의 뜻이므로, 한국어 성경에서 널리 통용되면서도 본문의 행위를 직접 드러내는 표현을 택했습니다.
- source_word: בַּבָּמוֹת
  english_pob_choice: on the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 산당에서
  lexicon: HALOT
  rationale: בָּמוֹת는 단순한 지형의 높이가 아니라 우상 숭배와 연결된 제의 장소를 가리키므로, 전통적이면서도 स्रोत 의미를 보존하는 '산당'을 사용했습니다.
- source_word: וְתַחַת כָּל עֵץ רַעֲנָן
  english_pob_choice: and under every green tree
  chosen_korean: 모든 푸른 나무 아래에서
  alternatives_korean:
  - 모든 잎이 무성한 나무 아래에서
  - 모든 울창한 나무 아래에서
  lexicon: HALOT
  rationale: רַעֲנָן은 푸르고 신선하며 무성한 상태를 가리키므로, 익숙한 성경적 어법인 '푸른 나무'를 택해 관용구와 의미를 함께 살렸습니다.
theological_decisions:
- issue: 산당의 번역
  chosen_reading: 산당들로 번역해, 단순한 지리적 '높은 곳'이 아니라 야훼 신앙에 어긋난 제의 장소라는 본문의 관용적 의미를 드러냈습니다.
  alternative_readings:
  - 높은 곳들
  - 높은 산들
  rationale: 이 용례는 열왕기서의 반복되는 제의 비판 공식이므로, 한국어 독자에게도 이미 축적된 성경적 의미를 지닌 '산당'이 가장 정확합니다.
  doctrine_reference: 열왕기하의 제의 비판 문맥; POB의 관용구 보존 원칙
