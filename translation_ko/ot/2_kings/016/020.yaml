  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
  footnotes:
  - marker: a
    text: The Hebrew idiom 'slept with his fathers' is a conventional royal death notice, meaning that Ahaz died and joined his ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스는 조상들과 함께 잠들었고[a], 다윗의 성읍에서 조상들과 함께 묻혔으며, 그의 아들 히스기야가 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현 ‘조상들과 함께 잠들다’는 왕의 죽음을 알리는 관용구로, 아하스가 죽어 조상 대열에 합류했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 잠들고
  alternatives_korean:
