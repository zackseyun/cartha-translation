base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/020.yaml
  text: And Ahaz slept with his fathers and was buried with his fathers in the city of David[a], and Hezekiah his son reigned in his place.
  footnotes:
  - marker: a
    text: The Hebrew idiom 'slept with his fathers' is a conventional royal death notice, meaning that Ahaz died and joined his ancestors.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스는 그의 조상들과 함께 잠들고, 다윗의 성읍에 그의 조상들과 함께 묻혔으며, 그의 아들 히스기야가 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현 ‘조상들과 함께 잠들다’는 왕의 죽음을 알리는 관용구로, 아하스가 죽어 조상 대열에 합류했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 잠들고
  alternatives_korean:
  - 그의 조상들과 함께 잠들었고
  - 그의 조상들과 함께 죽고
  lexicon: HALOT
  rationale: 왕의 죽음을 알리는 관용구를 그대로 살리기 위해 직역적이면서도 한국어에서 자연스러운 ‘잠들다’를 택했습니다.
- source_word: וַיִּקָּבֵר ... עִם אֲבֹתָיו
  english_pob_choice: was buried with his fathers
  chosen_korean: 그의 조상들과 함께 묻혔으며
  alternatives_korean:
  - 그의 조상들과 함께 장사되었으며
  - 그의 조상들과 함께 매장되었으며
  lexicon: HALOT
  rationale: 수동 의미를 자연스럽게 살려 ‘묻히다’로 옮겼고, 앞의 관용구와 병렬을 유지했습니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the city of David
  chosen_korean: 다윗의 성읍에
  alternatives_korean:
  - 다윗 성읍에
  - 다윗의 도시에서
  lexicon: HALOT
  rationale: 고정된 지명 표현이므로 관용적으로 널리 알려진 ‘다윗의 성읍’으로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그의 자리에
  - 그를 대신하여
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 תַּחַת의 의미를 한국어 관용인 ‘그의 뒤를 이어’로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕의 죽음 서술에서 히브리어 관용구를 얼마나 직접적으로 유지할지
  chosen_reading: ‘잠들고’와 ‘묻혔으며’로 나누어, 죽음을 해석적으로 풀지 않고 왕실 장례 공식의 반복성을 보존했습니다.
  alternative_readings:
  - ‘죽고 장사되었으며’
  - ‘세상을 떠나고 묻혔으며’
  rationale: 본문은 단순한 사망 통지가 아니라 왕조 공식문이므로, 의미는 분명히 전달하되 관용구의 형식을 유지하는 편이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 서사문 해석 원칙 / 왕실 연대기 공식
