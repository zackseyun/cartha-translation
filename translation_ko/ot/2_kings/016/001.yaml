base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/001.yaml
  text: In the seventeenth year of Pekah son of Remaliah, Ahaz son of Jotham, king of Judah, began to reign.
translation:
  language: ko
  text: '웃시야의 반차에 속한 왕들의 연대가 아니라, 아하스가 유다 왕으로 즉위한 해를 말합니다: “베가의 열일곱째 해에, 유다 왕 요담의 아들 아하스가 왕이 되었습니다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 “유다 왕 요담의 아들 아하스가 왕이 되었습니다”라고 직접 말하며, 이는 즉위 시점을 알리는 연대 공식입니다.
    reason: source_note
lexical_decisions:
- source_word: בִּ/שְׁנַת
  english_pob_choice: In the ... year of
  chosen_korean: '...의 ...째 해에'
  alternatives_korean:
  - '...의 해에'
  - '... 동안'
  lexicon: HALOT
  rationale: 연대기 공식에서 ב + שְׁנַת은 어떤 왕의 재위 연수를 기준으로 한 동시대 표지를 이루므로, 한국어도 “...의 ...째 해에”로 자연스럽게 옮겨 시점을 분명히 했습니다.
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  english_pob_choice: seventeenth year
  chosen_korean: 열일곱째 해
  alternatives_korean:
  - 열일곱 해
  - 열일곱 해째
  lexicon: HALOT
  rationale: 문맥상 기간(duration)이 아니라 서수적 연대를 가리키므로, ‘열일곱째 해’로 옮기는 것이 가장 정확합니다.
- source_word: מָלַךְ
  english_pob_choice: began to reign
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스리기 시작했습니다
  - 통치했습니다
  lexicon: HALOT
  rationale: מלך는 여기서 통치 기간 전체보다 왕위 즉위를 가리키므로, ‘왕이 되었습니다’가 임금 취임의 시작을 가장 분명하게 드러냅니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 임금
  lexicon: HALOT
  rationale: 히브리어의 관형적 결합을 한국어 역사 서술에 자연스럽게 맞추되, ‘유다 왕’으로 칭호를 간결하게 유지했습니다.
theological_decisions:
- issue: 왕위 연대기 공식의 기능
  chosen_reading: 이 절은 신학적 평가보다 역사 연대의 동시대 표지로 읽었습니다.
  alternative_readings:
  - 아하스 즉위의 신학적 의미를 강조하는 읽기
  - 베가의 연대와 비교해 정치적 함의를 부각하는 읽기
  rationale: 본문 자체는 왕들의 연대를 연결하는 공식문이므로, 의미를 과장하지 않고 역사 기록의 기능을 우선 반영했습니다.
  doctrine_reference: 성경의 역사서 서술 원칙
- issue: 직접 인용부의 어조
  chosen_reading: 직접 인용은 역사 서술에 맞게 평서형으로 제시했습니다.
  alternative_readings:
  - 더 서사적인 표현으로 재구성하는 읽기
  - 전통적인 성서체 어법을 유지하는 읽기
  rationale: 원문의 간결한 연대기 문장을 현대 한국어 역사문체로 옮기되, 내용 추가 없이 원문의 진술성을 보존했습니다.
  doctrine_reference: 본문 충실성
