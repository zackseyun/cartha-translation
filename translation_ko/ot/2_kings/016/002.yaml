  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בֶּן עֶשְׂרִ֤ים שָׁנָה֙ אָחָ֣ז בְּ/מָלְכ֔/וֹ וְ/שֵׁשׁ עֶשְׂרֵ֣ה שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/לֹא עָשָׂ֣ה הַ/יָּשָׁ֗ר בְּ/עֵינֵ֛י יְהוָ֥ה אֱלֹהָ֖י/ו כְּ/דָוִ֥ד אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/002.yaml
  text: Ahaz was twenty years old when he began to reign[a], and he reigned sixteen years in Jerusalem. He did not do what was right in the eyes of Yahweh his God[b], as David his father had done.
  footnotes:
  - marker: a
    text: Hebrew 'David his father'; in this royal context, 'father' means his forefather or dynastic ancestor, not his immediate parent.
    reason: cultural_note
  - marker: b
    text: Or 'did not do what was upright in the sight of the LORD his God.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스는 왕위에 오를 때 스무 살이었고, 예루살렘에서 열여섯 해를 다스렸습니다. 그는 그의 하나님 야훼께서 보시기에 옳은 일을 그의 아버지 다윗처럼 하지 않았습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘다윗 그의 아버지’에서 ‘아버지’는 왕실 문맥상 직접 부친이 아니라 왕조적 선조를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים שָׁנָה
  english_pob_choice: was twenty years old
  chosen_korean: 스무 살이었고
  alternatives_korean:
  - 스무 해 된 사람이었고
  - 스무 살이었습니다
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 현대 한국어의 자연스러운 연령 표현으로 옮겼습니다.
- source_word: בְּמָלְכוֹ / מָלַךְ
  english_pob_choice: when he began to reign / he reigned
  chosen_korean: 왕위에 오를 때 / 다스렸습니다
  alternatives_korean:
  - 즉위할 때 / 통치했습니다
  - 왕이 되었을 때 / 다스렸습니다
  lexicon: HALOT
  rationale: 즉위 시점과 재위 행위를 함께 살리되, 왕권 행사라는 동사를 자연스럽게 표현했습니다.
- source_word: הַיָּשָׁר בְּעֵינֵי יְהוָה
  english_pob_choice: what was right in the eyes of Yahweh
  chosen_korean: 야훼 그의 하나님 보시기에 옳은 일
  alternatives_korean:
  - 야훼 그의 하나님 눈에 옳은 일
  - 야훼 그의 하나님 앞에서 바른 일
  lexicon: HALOT
  rationale: 평가 관용구를 직역에 가깝게 살리면서 한국어에서 자연스러운 ‘보시기에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 POB 표준에 따라 ‘야훼’로 옮겼습니다.
- source_word: כְּדָוִד אָבִיו
  english_pob_choice: as David his father had done
  chosen_korean: 그의 조상 다윗이 행한 것과 같지 않았습니다
  alternatives_korean:
  - 그의 아버지 다윗이 행한 것과 같지 않았습니다
  - 다윗 그의 조상이 행한 것과 같지 않았습니다
  lexicon: HALOT
  rationale: 왕실 문맥에서 ‘아버지’는 직접 부친이 아니라 왕조적 선조를 가리킬 수 있으므로, 뜻을 분명히 하되 문맥을 과도하게 일반화하지 않도록 ‘조상’으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 평가 기준을 사람의 행위 평가로 어떻게 드러낼지
  chosen_reading: ‘야훼 그의 하나님 보시기에 옳은 일’을 부정문으로 옮겨, 왕의 행위가 하나님의 기준에 미달했음을 분명히 했습니다.
  alternative_readings:
  - ‘야훼 그의 하나님 앞에서 옳은 일을 하지 않았습니다’
  - ‘야훼 그의 하나님께서 보시기에 바르지 않았습니다’
  rationale: 열왕기의 전형적 평가 공식은 단순 도덕 판단이 아니라 언약적 평가를 담고 있으므로, 그 신학적 함의를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
