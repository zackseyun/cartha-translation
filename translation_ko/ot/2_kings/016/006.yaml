base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/006.yaml
  text: At that time Rezin king of Aram restored Elath to Aram[a], and drove the Judeans out of Elath[b]; and the Arameans came to Elath and have lived there to this day.
  footnotes:
  - marker: a
    text: 'Hebrew: ''Arameans.'' Some interpreters and ancient witnesses favor ''Edomites,'' likely because that reading fits the broader context and the parallel account in 2 Chronicles 28:17.'
    reason: textual_variant
  - marker: b
    text: Elath is also spelled 'Eloth' in one form of the place name in this verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 아람 왕 르신이 엘라트를 아람에 돌려주었고, 유다 사람들을 엘라트[b]에서 몰아냈으며, 아람 사람들이[a] 엘라트에 와서 오늘날까지 그곳에 살고 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘아람 사람들’이라고 읽습니다. 일부 해석자와 고대 증인들은 더 넓은 문맥과 역대기 병행본문(역대기하 28:17)에 맞추어 ‘에돔 사람들’을 선호합니다.
    reason: textual_variant
  - marker: b
    text: 엘라트는 이 절의 한 표기에서는 ‘엘롯’으로도 적힙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵשִׁיב
  english_pob_choice: restored
  chosen_korean: 회복시켰고
  alternatives_korean:
  - 되돌렸고
  - 다시 넘겨주었고
  lexicon: HALOT
  rationale: 히필 형태는 어떤 것을 이전 소유 상태로 되돌리게 하는 뜻이므로, 정치·군사적 통제권 회복을 자연스럽게 드러내는 ‘회복시키다’가 가장 적절합니다.
- source_word: אֵילַת / אֵילוֹת
  english_pob_choice: Elath
  chosen_korean: 엘라트
  alternatives_korean:
  - 엘롯
  lexicon: HALOT
  rationale: 지명은 음역을 따르되, 본절 안의 철자 변이를 반영할 수 있도록 각주에서 대안 표기를 처리하는 것이 적절합니다.
- source_word: הַיְהוּדִים
  english_pob_choice: the Judeans
  chosen_korean: 유다 사람들
  alternatives_korean:
  - 유대인들
  - 유다인들
  lexicon: HALOT
  rationale: 왕정 시기의 문맥에서는 후대의 종교·민족 명칭보다 유다 출신 백성을 가리키는 역사적 의미를 살려 ‘유다 사람들’로 옮기는 것이 맞습니다.
- source_word: וַאֲרָמִים
  english_pob_choice: the Arameans
  chosen_korean: 아람 사람들
  alternatives_korean:
  - 시리아 사람들
  - 에돔 사람들
  lexicon: HALOT
  rationale: 마소라 본문의 민족명은 아람 사람들을 가리키므로 음역을 유지했습니다. 역대기 병행본문과의 차이는 본문 각주로 남기는 편이 좋습니다.
theological_decisions:
- issue: 마소라 본문의 ‘아람 사람들’과 역대기 병행본문의 ‘에돔 사람들’ 사이의 본문 차이
  chosen_reading: 본문은 ‘아람 사람들’로 두고, 대안 본문을 각주로 제시합니다.
  alternative_readings:
  - ‘에돔 사람들’로 본문을 조정하는 읽기
  rationale: 원문 우선 원칙에 따라 히브리어 본문을 따르되, 잘 알려진 본문비평적 긴장을 숨기지 않기 위해 대안을 주석으로 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3
