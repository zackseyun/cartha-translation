  text: Ahaz took the silver and the gold that was found in the house of Yahweh and in the treasuries of the king’s house[a], and sent it as a bribe to the king of Assyria.
  footnotes:
  - marker: a
    text: Or 'tribute' or 'gift'; the Hebrew word commonly carries the sense of a bribe.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스는 야훼의 집과 왕궁의 보물 창고들에서 발견된 은과 금을 가져다가 앗시리아 왕에게 뇌물로 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘조공’, ‘선물’, ‘예물’로 옮길 수 있습니다. 그러나 히브리어는 보통 ‘뇌물’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  english_pob_choice: took
  chosen_korean: 가져가다
  alternatives_korean:
  - 취하다
  - 가져오다
  lexicon: HALOT
  rationale: 서술형 과거 동사로 단순히 ‘take’의 소유 이전을 자연스럽게 반영하며, 이어지는 금·은 수습과 전달의 흐름을 살립니다.
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  english_pob_choice: the silver and the gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은돈과 금
  - 은과 황금
  lexicon: HALOT
  rationale: 히브리어의 구체적 재료 표현을 그대로 살리되, 한국어에서는 관사 없이 병렬로 옮기는 것이 자연스럽습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 성전
  lexicon: HALOT
  rationale: יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮기고, ‘house’를 ‘성전’보다 직역에 가까운 ‘집’으로 유지했습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕궁의 곳간
  alternatives_korean:
  - 왕의 집
  - 왕궁
  lexicon: HALOT
  rationale: 문맥상 אָצְרוֹת(곳간들)과 결합된 왕실 재산 보관소를 가리키므로, ‘왕궁의 곳간’으로 의미를 분명하게 했습니다.
- source_word: שֹׁחַד
  english_pob_choice: bribe
  chosen_korean: 조공
  alternatives_korean:
  - 뇌물
  - 예물
  - 공물
  lexicon: HALOT
  rationale: 본문의 정치적 성격상 단순한 선물보다 ‘조공’이 아하스의 굴복과 대가 지급을 잘 드러내며, 영어 POB가 지적한 ‘bribe’의 부정적 뉘앙스를 주석으로 보완합니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명(神名)을 제목어 ‘주’로 대체하지 않고, 프로젝트 기본값에 따라 고유명사 ‘야훼’를 유지해 स्रोत의 직접성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
