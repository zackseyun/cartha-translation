theological_decisions:
- issue: 아시리아 왕의 ‘들음’이 단순 청취인지 응답적 수용인지
  chosen_reading: 문맥상 요청에 대한 호의적 응답을 내포하지만, 본문은 그 결과를 뒤의 군사 행동으로 보여 주므로 번역은 해석을 과도하게 확정하지 않았습니다.
  alternative_readings:
  - 그의 말을 들었습니다
  - 그에게 순응했습니다
  rationale: 히브리어 שׁמע + אֶל은 ‘듣다/heed하다’의 범위를 가지므로, 한국어 본문은 중립적으로 두고 의미는 서술 진행에서 드러나게 했습니다.
  doctrine_reference: 서사 문맥 우선의 의미 보존 원칙
