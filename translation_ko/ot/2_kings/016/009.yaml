    text: 히브리어 동사는 단순히 ‘듣다’뿐 아니라 ‘귀 기울여 응답하다’라는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에는 ‘그것을 길로 유배시켰다’라고 되어 있습니다. 여기서 도시는 그 주민을 가리킵니다.
    reason: lexical_alternative
