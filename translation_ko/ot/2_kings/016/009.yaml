  text: 앗수르 왕이 그의 말을 들었습니다.[a] 앗수르 왕은 다메섹을 치러 올라가 그곳을 점령하고, 그 주민을 길로 유배시켰으며,[b] 르신을 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
