base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/009.yaml
  text: So the king of Assyria listened to him[a], and the king of Assyria went up against Damascus and captured it, and he deported its people to Kir[b], and he put Rezin to death.
  footnotes:
  - marker: a
    text: Or 'heeded him.' The Hebrew verb can denote listening with responsive action.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'deported it to Kir,' with the city standing for its inhabitants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 아시리아 왕이 그를 들었고, 아시리아 왕이 올라가 다마스쿠스를 쳐서 그것을 점령하고 그 주민을 기르로 사로잡아 옮겼으며, 르신을 죽였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 단순히 ‘듣다’뿐 아니라 ‘귀 기울여 응답하다’는 뜻도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어에서는 ‘도시’를 사로잡아 유배시키는 표현이지만, 뜻은 그 주민의 추방을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
