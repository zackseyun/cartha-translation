  text: As for the bronze altar that was before Yahweh[a], he brought it from the front of the house, from between the altar and the house of Yahweh[b], and put it on the north side of the altar.
  footnotes:
  - marker: a
    text: Or 'the copper altar.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the house of the LORD'; that is, the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 구리 제단 — 곧 야훼 앞에 있던 제단을 — 그 집 앞자리에서, 제단과 야훼의 집 사이에서 옮겨다가, 제단의 북쪽에 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 구리로도 번역할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 구리 제단
  alternatives_korean:
  - 청동 제단
  - 놋 제단
  lexicon: WLC / HALOT
  rationale: נחושת는 문맥에 따라 구리 또는 청동일 수 있으므로, POB의 영어 선택( bronze )을 따라 재료 의미를 드러내되 한국어에서는 자연스럽고 직역에 가까운 ‘구리 제단’으로 옮겼습니다.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  english_pob_choice: that was before Yahweh
  chosen_korean: 야훼 앞에 있던
  alternatives_korean:
  - 야훼 앞에 있던
  - 야훼 앞에 서 있던
  - 주 앞에 있던
  lexicon: WLC
  rationale: לִפְנֵי는 단순한 ‘앞’의 공간 관계를 나타내므로, 제의적 위치를 살려 ‘야훼 앞에 있던’으로 옮겼습니다. 번역 원칙에 따라 신명기적 이름은 야훼로 유지했습니다.
- source_word: מֵאֵת פְּנֵי הַבַּיִת
  english_pob_choice: from the front of the house
  chosen_korean: 그 집 앞자리에서
  alternatives_korean:
  - 그 집 앞에서
  - 그 집 전면에서
  - 성전 앞에서
  lexicon: WLC
  rationale: פְּנֵי는 ‘얼굴’이 아니라 건물의 전면/앞면을 뜻하는 관용구이므로, 위치 이동의 출발점을 분명히 하는 ‘그 집 앞자리에서’로 번역했습니다.
- source_word: בֵּין הַמִּזְבֵּחַ וּמִבֵּין בֵּית יְהוָה
  english_pob_choice: from between the altar and the house of Yahweh
  chosen_korean: 제단과 야훼의 집 사이에서
  alternatives_korean:
  - 제단과 야훼의 집 사이에서
  - 제단과 야훼의 성전 사이에서
  lexicon: WLC
  rationale: 반복되는 מִבֵּין의 공간 관계를 그대로 살려, 이동의 출발 지점을 두 대상 사이로 명확하게 표현했습니다. ‘집’은 히브리어의 표현을 유지하는 기본 선택입니다.
- source_word: עַל יֶרֶךְ הַמִּזְבֵּחַ צָפוֹנָה
  english_pob_choice: on the north side of the altar
  chosen_korean: 제단의 북쪽에
  alternatives_korean:
  - 제단의 북쪽에
  - 제단의 북편에
  - 제단 북쪽 면에
  lexicon: WLC / HALOT
  rationale: יֶרֶךְ는 본래 ‘옆면/옆구리’이지만, 여기서는 방향 표지를 동반한 설치 위치이므로 한국어에서는 간결하게 ‘북쪽에’로 옮겨 자연스러운 위치 표현을 만들었습니다.
theological_decisions:
- issue: יְהוָה의 처리
  chosen_reading: 본문과 역주에서 모두 야훼를 사용했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 이 단락은 야훼의 집과 야훼 앞의 제단을 반복 대조하므로, 고유 신명 표기를 유지하는 것이 원문 구조와 제의적 긴장을 더 직접적으로 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
