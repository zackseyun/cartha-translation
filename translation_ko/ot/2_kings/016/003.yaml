id: 2KI.16.3
reference: 2 Kings 16:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֕לֶךְ בְּ/דֶ֖רֶךְ מַלְכֵ֣י יִשְׂרָאֵ֑ל וְ/גַ֤ם אֶת בְּנ/וֹ֙ הֶעֱבִ֣יר בָּ/אֵ֔שׁ כְּ/תֹֽעֲבוֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁ֨ר הוֹרִ֤ישׁ יְהוָה֙ אֹתָ֔/ם מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/003.yaml
  text: He walked in the way of the kings of Israel[a], and even made his son pass through the fire, according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'offered his son in the fire'; the Hebrew literally says 'made his son pass through the fire,' an idiom associated with a condemned pagan rite.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 이스라엘 왕들의 길로 걸었고, 심지어 자기 아들을 불에 지나가게 하였습니다[a]. 이는 야훼께서 이스라엘 자손 앞에서 내쫓으신 민족들의 가증한 행위와 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 아들을 불에 바쳤다’로 옮길 수 있습니다. 히브리어는 문자적으로 ‘자기 아들을 불에 지나가게 하다’라고 말하며, 저주받은 이교 의식과 연결된 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  english_pob_choice: He walked in the way of
  chosen_korean: 길로 걸었습니다
  alternatives_korean:
  - 길을 따라갔습니다
  - 행실을 따랐습니다
  lexicon: HALOT
  rationale: הלך + בדרך는 행위와 삶의 방식을 가리키는 관용구이므로, 한국어에서도 ‘길’ 이미지를 살린 표현을 택했습니다.
- source_word: מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the kings of Israel
  chosen_korean: 이스라엘 왕들
  alternatives_korean:
  - 이스라엘의 왕들
  - 이스라엘의 임금들
  lexicon: HALOT
  rationale: 북왕국의 통치자들을 가리키는 비교 표현이므로, 직역에 가까운 ‘이스라엘 왕들’이 가장 분명합니다.
- source_word: הֶעֱבִיר בָּאֵשׁ
  english_pob_choice: made his son pass through the fire
  chosen_korean: 자기 아들을 불에 지나가게 하였습니다
  alternatives_korean:
  - 자기 아들을 불속으로 지나가게 하였습니다
  - 자기 아들을 불로 태워 바쳤습니다
  lexicon: HALOT
  rationale: 히필 עבר + ‘불에’는 관용적 표현이므로, 실제 제사의 세부를 과잉 확정하지 않고 원문 이미지와 금기를 함께 살리는 표현을 택했습니다.
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: HALOT
  rationale: 문맥상 가나안 지역의 비이스라엘 민족들을 가리키므로, 현대 한국어에서 자연스러운 ‘민족들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 계약명사 יְהוָה는 본 프로젝트 기본값에 따라 개인명적 음역 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: הֶעֱבִיר בָּאֵשׁ의 해석 범위
  chosen_reading: 본문은 ‘불에 지나가게 하다’라는 관용구를 유지해, 실제로 어떤 의례적·형벌적 행위였는지를 본문 이상으로 단정하지 않았습니다.
  alternative_readings:
  - ‘불에 바치다’
  - ‘자식을 불로 태워 희생하다’
  rationale: 히브리어 표현 자체는 저주받은 이교 의식을 가리키지만, 본문은 그 세부를 완전히 설명하지 않으므로 번역에서도 해석을 과도하게 확정하지 않는 것이 적절합니다.
  doctrine_reference: 원어 우선 원칙; 해석적 긴장 보존
