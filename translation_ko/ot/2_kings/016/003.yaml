revisions:
- from: 그는 이스라엘 왕들의 길로 걸었고, 심지어 자기 아들을 불에 지나가게 하였습니다[a]. 이는 야훼께서 이스라엘 자손 앞에서 내쫓으신 민족들의 가증한 행위와 같았습니다.
  to: 그는 이스라엘 왕들의 길로 걸었으며, 야훼께서 이스라엘 자손 앞에서 쫓아내신 민족들의 가증한 행위들을 따라 심지어 자기 아들을 불 가운데로 지나가게 하였습니다[a].
  rationale: 수정문은 כְּתֹעֲבוֹת의 ‘…을 따라’라는 관계를 본문 문장 안에서 직접 반영하여, 아하스의 행위가 쫓겨난 민족들의 가증한 행위를 본뜬 것임을 분명히 합니다. ‘불 가운데로 지나가게 하다’는 הֶעֱבִיר בָּאֵשׁ의 관용적이고 논쟁적인 세부를 과도하게 확정하지 않으며, 각주에서만 ‘바쳤다’라는 해석 가능성을 보존합니다.
