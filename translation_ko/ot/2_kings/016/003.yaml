  source_fidelity: 원문의 핵심 표현들, 곧 ‘이스라엘 왕들의 길’, 아들을 ‘불에 지나가게 하다’라는 관용구, 야훼의 이름, ‘이스라엘 자손’은 대체로 충실히 반영되었습니다. 그러나 ‘이는 … 같았습니다’는 히브리어의 כְּ(…을 따라/…에 따라)를 독립된 비교 진술로 바꾸어, 아하스가 그 민족들의 가증한 행위를 본받아 행했다는 통사적 연결을 다소 약화합니다.
  naturalness: ‘길로 걸었고’와 ‘불에 지나가게 하였습니다’는 이해 가능하지만, ‘이는 … 같았습니다’는 앞 절과의 연결이 다소 부자연스럽고 의미 관계도 느슨합니다. ‘… 가증한 행위들을 따라’로 연결하면 현대 표준어 합쇼체에서 더 자연스럽고 원문의 수식 관계도 살아납니다.
  terminology: ‘야훼’, ‘이스라엘 자손’, ‘가증한 행위’는 프로젝트의 원어 우선 원칙 및 본문의 부정적 평가를 잘 반영합니다. 불 의례는 본문에서 문자적 관용구로 유지하고, 각주는 가능한 해석을 제한적으로 제시하는 것이 적절합니다.
