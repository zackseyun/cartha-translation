  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְקַצֵּץ֩ הַ/מֶּ֨לֶךְ אָחָ֜ז אֶת הַ/מִּסְגְּר֣וֹת הַ/מְּכֹנ֗וֹת וַ/יָּ֤סַר מֵֽ/עֲלֵי/הֶם֙ ו/את הַ/כִּיֹּ֔ר וְ/אֶת הַ/יָּ֣ם הוֹרִ֔ד מֵ/עַ֛ל הַ/בָּקָ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁ֣ר תַּחְתֶּ֑י/הָ וַ/יִּתֵּ֣ן אֹת֔/וֹ עַ֖ל מַרְצֶ֥פֶת אֲבָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/017.yaml
  text: Then King Ahaz cut off the frames of the stands and removed the basin from them[c][b][a], and he took down the Sea from upon the bronze oxen that were under it and put it on a stone pavement.
  footnotes:
  - marker: a
    text: Or 'removed the laver from them.' The Hebrew כִּיּוֹר refers to a wash basin used in temple service; 'laver' is the traditional rendering.
    reason: lexical_alternative
  - marker: b
    text: '''The Sea'' is the name of the large basin made for Solomon''s temple (see 1 Kings 7:23–26).'
    reason: cross_reference
  - marker: c
    text: Or 'the bronze bulls.' The Hebrew term can refer broadly to cattle; 'oxen' is the conventional rendering in this temple context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아하스 왕이 물두멍 받침의 테두리를 잘라 내고 그 위에 있던 물두멍을 치워 버렸으며, 또 그 놋쇠 소들 아래에 있던 바다를 내려 돌 포장 위에 두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘물두멍’은 성전 예배에 쓰인 씻는 그릇을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바다’는 솔로몬 성전에 있던 큰 물두멍의 이름입니다.
    reason: cross_reference
  - marker: c
    text: ‘소들’은 이 성전 장치 아래를 받치던 놋쇠 동물 형상을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַצֵּץ
  english_pob_choice: cut off
  chosen_korean: 잘라 내고
  alternatives_korean:
  - 잘라 버리고
  - 떼어 내고
  - 절단하고
  lexicon: HALOT
  rationale: קצץ는 물리적으로 잘라 없애는 뜻이므로, 성전 기구의 해체 맥락을 살려 ‘잘라 내고’로 옮겼습니다.
- source_word: הַמִּסְגְּרוֹת הַמְּכֹנוֹת
  english_pob_choice: the frames of the stands
  chosen_korean: 물두멍 받침의 테두리
  alternatives_korean:
  - 물두멍 받침의 틀
  - 받침들의 테두리
  - 받침의 프레임
  lexicon: HALOT
  rationale: מִסְגְּרוֹת과 מְכֹנוֹת은 성전 물두멍 받침의 구조적 부분을 가리키므로, 현대 한국어에서 이해되는 ‘테두리’와 ‘받침’으로 구체화했습니다.
- source_word: וַיָּסַר מֵעֲלֵיהֶם וְאֶת הַכִּיּוֹר
  english_pob_choice: removed the basin from them
  chosen_korean: 그 위에 있던 물두멍을 치워 버렸으며
  alternatives_korean:
  - 그 위의 물두멍을 제거했으며
  - 그들 위에서 물두멍을 없앴으며
  - 그 위에 있던 세숫대야를 치워 버렸으며
  lexicon: HALOT
  rationale: כִּיּוֹר는 성전 예배에 쓰이는 씻는 그릇이므로 ‘물두멍’으로 유지했고, 문맥상 완전한 철거를 드러내기 위해 ‘치워 버렸으며’로 옮겼습니다.
- source_word: הַיָּם ... הַבָּקָר הַנְּחֹשֶׁת
  english_pob_choice: the Sea ... the bronze oxen
  chosen_korean: 바다를 ... 놋쇠 소들 아래에 있던
  alternatives_korean:
  - 바다를 ... 놋쇠 황소들 아래에 있던
  - 대야를 ... 놋쇠 소들 아래에 있던
  - 바다를 ... 놋쇠 소들 밑에 있던
  lexicon: HALOT
  rationale: ‘Sea’는 솔로몬 성전의 대형 물두멍 고유명칭이므로 ‘바다’로 직역해 그 명칭성을 살렸고, הַבָּקָר는 성전 맥락에서 관례적으로 ‘소들’로 옮겼습니다.
- source_word: וַיִּתֵּן אֹתוֹ עַל מַרְצֶפֶת אֲבָנִים
  english_pob_choice: put it on a stone pavement
  chosen_korean: 돌 포장 위에 두었습니다
  alternatives_korean:
  - 돌바닥 위에 두었습니다
  - 돌 포장 위에 놓았습니다
  - 돌로 깐 바닥 위에 두었습니다
  lexicon: HALOT
  rationale: מַרְצֶפֶת אֲבָנִים는 돌로 깐 평평한 바닥을 뜻하므로, 자연스러운 현대 한국어로 ‘돌 포장’이라 옮겼습니다.
theological_decisions:
- issue: 왕이 성전 기구를 해체하는 행위의 서술 방식
  chosen_reading: 역사 서술의 사실성을 살려, 평가를 덧붙이지 않고 기구를 훼손·이동한 행위를 सीधे적으로 묘사했습니다.
  alternative_readings:
  - 비난이나 해석을 덧붙여 ‘함부로 치웠다’로 풀기
  - 완곡하게 ‘옮겼다’로만 처리하기
  rationale: 본문은 아하스가 성전 기구를 실제로 변형·철거하는 장면을 보고하므로, 서술의 강도를 유지하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: 열왕기하 16장 문맥의 성전 기물 훼손 서술
- issue: ‘바다’의 번역
  chosen_reading: 고유명칭인 ‘바다’를 유지해 일반적인 해양 의미로 희석하지 않았습니다.
  alternative_readings:
  - ‘큰 물두멍’으로 의미만 풀기
  - ‘놋바다’로 설명을 덧붙이기
  rationale: 영어 POB도 The Sea를 고유명칭으로 처리하므로, 한국어도 그 명칭성을 보존하는 것이 문맥과 평행합니다.
  doctrine_reference: 솔로몬 성전 기물 명칭(열왕기상 7:23-26)
