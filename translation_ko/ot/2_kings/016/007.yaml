source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אָחָ֜ז מַלְאָכִ֗ים אֶל תִּ֠גְלַת פְּלֶ֤סֶר מֶֽלֶךְ אַשּׁוּר֙ לֵ/אמֹ֔ר עַבְדְּ/ךָ֥ וּ/בִנְ/ךָ֖ אָ֑נִי עֲלֵ֨ה וְ/הוֹשִׁעֵ֜/נִי מִ/כַּ֣ף מֶֽלֶךְ אֲרָ֗ם וּ/מִ/כַּף֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל הַ/קּוֹמִ֖ים עָלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/007.yaml
  text: So Ahaz sent messengers to Tiglath-pileser king of Assyria[a], saying, “I am your servant and your son. Come up and save me from the hand of the king of Aram and from the hand of the king of Israel[c][b], who are rising up against me.”
  footnotes:
  - marker: a
    text: Or 'your vassal and your son'; the Hebrew uses diplomatic language of submission literally, 'your servant and your son.'
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' is traditionally rendered ''Syria.'''
    reason: alternative_reading
  - marker: c
    text: Hebrew 'from the hand of,' an idiom meaning 'from the power of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스는 아시리아 왕 디글랏빌레셀에게 사신들을 보내어 말했습니다. “나는 당신의 종이요 당신의 아들입니다. 올라오셔서 나를 대적하여 일어나고 있는 아람 왕과 이스라엘 왕의 손에서 저를 구해 주십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손’은 히브리어 관용구로서 ‘권세’ 또는 ‘힘’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 전통적으로 ‘시리아’로도 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 사절들
  lexicon: HALOT
  rationale: 정치적 맥락에서 인간 전달자를 가리키므로, 천사를 뜻할 수 있는 일반적 의미를 피하면서도 외교적 파견의 성격을 드러내는 ‘사신들’로 옮겼습니다.
- source_word: עַבְדְּךָ וּבִנְךָ
  english_pob_choice: your servant and your son
  chosen_korean: 당신의 종이요 당신의 아들입니다
  alternatives_korean:
  - 당신의 신하이요 당신의 아들입니다
  - 당신의 봉신이요 당신의 아들입니다
  lexicon: HALOT
  rationale: 본문의 복종 표현을 그대로 살려 ‘종’과 ‘아들’을 유지했습니다. ‘봉신’은 외교적 뉘앙스를 잘 잡지만, 원문이 실제로 쓰는 종속-가족 언어를 약화시킬 수 있어 본문에는 두지 않았습니다.
- source_word: עֲלֵה
  english_pob_choice: Come up
  chosen_korean: 올라오셔서
  alternatives_korean:
  - 올라오소서
  - 진군해 오셔서
  lexicon: HALOT
  rationale: עלָה의 기본 이미지인 ‘올라오다’를 유지하되, 왕에게 요청하는 공손한 명령/청유를 한국어 존대형으로 표현했습니다.
- source_word: מִכַּף
  english_pob_choice: from the hand of
  chosen_korean: …의 손에서
  alternatives_korean:
  - …의 권세에서
  - …의 힘에서
  lexicon: HALOT
  rationale: ‘손’이라는 구체적 이미지를 보존해 원문 투명성을 살렸습니다. POB의 관용구를 따라 ‘권세/힘’으로 풀지 않고, 뒤의 문맥이 의미를 분명히 하도록 했습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  lexicon: HALOT
  rationale: 전통적 ‘시리아’보다 원어 지명을 따라 ‘아람’을 유지했습니다. 이는 역사적·지리적 구분을 흐리지 않기 위한 선택입니다.
theological_decisions:
- issue: 아하스의 자기호칭이 지닌 정치적 복종의 수사
  chosen_reading: ‘당신의 종이요 당신의 아들입니다’라고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘당신의 신하입니다’로 완화해 옮김
  - ‘당신의 봉신입니다’로 정치 용어화
  rationale: 이 표현은 단순한 예의가 아니라 복종과 의존을 드러내는 외교 언어입니다. 본문이 사용하는 종속·친자 언어를 보존해야 독자가 아하스의 굴욕적 요청을 그대로 읽을 수 있습니다.
  doctrine_reference: Translation philosophy §§1, 5
- issue: ‘구해 주십시오’의 의미 범위
  chosen_reading: 군사·정치적 구원을 드러내는 ‘구해 주십시오’를 유지했습니다.
  alternative_readings:
  - ‘건져 주십시오’
  - ‘구원해 주십시오’
  rationale: 히브리어 ישׁע의 일반적 의미를 살리면서도, 이 문맥에서는 종교적 구원보다 실제 전쟁 위기에서의 구조 요청입니다. ‘구해 주십시오’는 의미를 과도하게 신학화하지 않으면서도 넓은 어휘 연계를 유지합니다.
  doctrine_reference: Translation philosophy §§1, 5
