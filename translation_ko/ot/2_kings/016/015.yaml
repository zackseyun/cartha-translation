- from: 그때 아하스 왕이 제사장 우리야에게 명령하며 말했습니다. “큰 제단 위에서 아침 번제와 저녁 곡식 제물과 왕의 번제와 그의 곡식 제물과 그 땅의 모든 백성의 번제와 그들의 곡식 제물과 그들의 부어 드리는 제물을 드리십시오. 그리고 그 위에 번제의 모든 피와 제물의 모든 피를 뿌리십시오. 그러나 놋 제단은 내가 묻는 데에 쓰이게 하십시오.”[a]
  to: 그때 아하스 왕은 제사장 우리야에게 이렇게 명령했습니다. “큰 제단 위에 아침 번제와 저녁 곡식 제물, 왕의 번제와 그의 곡식 제물, 그리고 그 땅의 모든 백성의 번제와 그들의 곡식 제물과 전제물을 드리십시오. 그 위에 번제의 모든 피와 희생 제물의 모든 피를 뿌리십시오. 그러나 놋 제단은 내가 문의하는 데에 쓸 것입니다.”[a]
  rationale: 원문의 명령 구조, 제의 용어의 구별, 큰 제단 위에 제물을 드리고 피를 뿌리는 공간 관계를 더 자연스럽고 정확하게 반영했습니다. 특히 לְבַקֵּר는 특정한 점술 행위나 신학적 해석으로 좁히지 않고, 본문에서는 절제된 ‘문의’로, 각주에서는 대안적 의미를 제시하여 불확실성을 보존했습니다.
