base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/015.yaml
  text: Then King Ahaz commanded Uriah the priest[a], saying, “On the great altar offer up the morning burnt offering and the evening grain offering, and the king’s burnt offering and his grain offering, and the burnt offering of all the people of the land and their grain offerings and their drink offerings; and throw on it all the blood of the burnt offering and all the blood of the sacrifice. But the bronze altar shall be for me to inquire by.”
  footnotes:
  - marker: a
    text: Or 'to inspect,' 'to consider,' or possibly 'to seek guidance by.' The Hebrew expression is difficult, and the exact function Ahaz assigns to the bronze altar is uncertain.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 아하스 왕이 제사장 우리야에게 명령하며 말했습니다. “큰 제단 위에서 아침 번제와 저녁 곡식 제물과 왕의 번제와 그의 곡식 제물과 그 땅의 모든 백성의 번제와 그들의 곡식 제물과 그들의 부어 드리는 제물을 드리십시오. 그리고 그 위에 번제의 모든 피와 제물의 모든 피를 뿌리십시오. 그러나 놋 제단은 내가 묻는 데에 쓰이게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 לְבַקֵּר는 뜻이 분명하지 않아 ‘살피다’, ‘묻다’, ‘분별하다’ 등으로도 옮길 수 있습니다. 본문은 놋 제단의 정확한 용도를 단정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַוֵּהוּ
  english_pob_choice: commanded
  chosen_korean: 명령하며
  alternatives_korean:
  - 명하여
  - 지시하며
  lexicon: HALOT
  rationale: כאשר 왕이 제사장에게 권위 있게 말하는 동사를 한국어에서는 ‘명령하다’로 옮기는 것이 가장 직접적이며, 서술 흐름상 ‘명령하며 말했습니다’가 자연스럽습니다.
- source_word: אֶת עֹלַת הַבֹּקֶר ... וְאֶת מִנְחַת הָעֶרֶב
  english_pob_choice: the morning burnt offering ... the evening grain offering
  chosen_korean: 아침 번제와 저녁 곡식 제물
  alternatives_korean:
  - 아침 번제와 저녁 소제
  - 아침 번제와 저녁 제물
  lexicon: HALOT
  rationale: עֹלָה는 ‘번제’로, מִנְחָה는 제의적 맥락에서 ‘곡식 제물’로 옮겨 제사의 구체성을 유지했습니다.
- source_word: וְנִסְכֵּיהֶם
  english_pob_choice: their drink offerings
  chosen_korean: 그들의 부어 드리는 제물
  alternatives_korean:
  - 그들의 전제
  - 그들의 술제물
  lexicon: HALOT
  rationale: נֶסֶךְ의 제의적 의미를 살리면서도, 독자에게 익숙한 ‘전제’보다 동작을 드러내는 ‘부어 드리는 제물’을 택했습니다.
- source_word: וְכָל דַּם זֶבַח
  english_pob_choice: all the blood of the sacrifice
  chosen_korean: 제물의 모든 피
  alternatives_korean:
  - 모든 희생제물의 피
  - 모든 제사의 피
  lexicon: HALOT
  rationale: זֶבַח를 여기서는 일반적인 ‘제물’로 옮겨 앞의 번제와 평행을 이루게 했고, ‘피’를 반복해 히브리어의 병렬 구조를 보존했습니다.
- source_word: וּמִזְבַּח הַנְּחֹשֶׁת
  english_pob_choice: the bronze altar
  chosen_korean: 놋 제단
  alternatives_korean:
  - 청동 제단
  - 구리 제단
  lexicon: HALOT
  rationale: 성경 번역에서 널리 알려진 ‘놋 제단’이 본문의 제의적 대상을 가장 자연스럽게 전달합니다.
theological_decisions:
- issue: לְבַקֵּר의 난해한 의미와 놋 제단의 기능
  chosen_reading: 내가 묻는 데에 쓰이게 하십시오
  alternative_readings:
  - 내가 살피는 데에 쓰이게 하십시오
  - 내가 문의하는 데에 쓰이게 하십시오
  - 내가 분별하는 데에 쓰이게 하십시오
  rationale: 이 동사는 해석이 어려우므로, 본문이 확정하지 않는 기술적 의미를 과도하게 단정하지 않으면서도 아하스가 놋 제단을 자기 목적의 ‘문의/질의’ 용도로 남겨 두려는 뉘앙스를 살렸습니다.
  doctrine_reference: Translation philosophy §3 (source tension is preserved rather than resolved)
