- from: 그래서 제사장 우리야가 제단을 세웠습니다[a]. 그것은 아하스 왕이 다마스쿠스에서 보낸 모든 것에 따른 것이었습니다. 곧 제사장 우리야가 그렇게 했습니다. 아하스 왕이 다마스쿠스에서 올 때까지 그렇게 했습니다.
  to: 제사장 우리야는 아하스 왕이 다마스쿠스에서 보낸 모든 것대로 제단을 세웠습니다. 제사장 우리야는 아하스 왕이 다마스쿠스에서 올 때까지 그대로 했습니다[a].
