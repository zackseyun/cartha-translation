reference: 2 Kings 16:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּ֛בֶן אוּרִיָּ֥ה הַ/כֹּהֵ֖ן אֶת הַ/מִּזְבֵּ֑חַ כְּ/כֹ֣ל אֲשֶׁר שָׁלַח֩ הַ/מֶּ֨לֶךְ אָחָ֜ז מִ/דַּמֶּ֗שֶׂק כֵּ֤ן עָשָׂה֙ אוּרִיָּ֣ה הַ/כֹּהֵ֔ן עַד בּ֥וֹא הַ/מֶּֽלֶךְ אָחָ֖ז מִ/דַּמָּֽשֶׂק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/011.yaml
  text: So Uriah the priest built the altar[a], according to all that King Ahaz had sent from Damascus; thus Uriah the priest did, until King Ahaz came from Damascus.
  footnotes:
  - marker: a
    text: Or 'did accordingly.' The Hebrew expression 'thus did' emphasizes that Uriah followed Ahaz's instructions exactly.
    reason: lexical_alternative
translation:
  language: ko
  text: 제사장 우리야는 아하스 왕이 다마스쿠스에서 보낸 모든 것대로 제단을 세웠습니다. 제사장 우리야는 아하스 왕이 다마스쿠스에서 올 때까지 그대로 했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에 따라 행했습니다’. 히브리어의 ‘그렇게 했다’는 표현은 우리야가 아하스의 지시를 정확히 따랐음을 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 지었습니다
  - 만들었습니다
  lexicon: HALOT
  rationale: מזבח를 목적어로 할 때 한국어에서는 ‘제단을 세우다’가 가장 자연스럽고, 단순 조립보다 설치·건립의 의미를 잘 살립니다.
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 제단
  - 제물단
  lexicon: HALOT
  rationale: 히브리어 מזבח는 제사 제단을 가리키므로 교회 용어보다 직역성 있는 ‘제단’이 적절합니다.
- source_word: כְּכֹל אֲשֶׁר שָׁלַח
  english_pob_choice: according to all that ... had sent
  chosen_korean: 아하스 왕이 다마스쿠스에서 보낸 모든 것에 따른 것이었습니다
  alternatives_korean:
  - 아하스 왕이 다마스쿠스에서 보낸 모든 대로였습니다
  - 아하스 왕이 다마스쿠스에서 보낸 것과 같이였습니다
  lexicon: HALOT
  rationale: כְּכֹל אֲשֶׁר는 ‘모든 것에 따라/모든 대로’의 순응을 뜻하므로, 명령·설계의 완전한 일치를 드러내는 표현으로 옮겼습니다.
- source_word: כֵּן עָשָׂה
  english_pob_choice: thus ... did
  chosen_korean: 곧 ... 그렇게 했습니다
  alternatives_korean:
  - 그리하여 ... 했습니다
  - 그렇게 ... 했습니다
  lexicon: HALOT
  rationale: 반복적 강조를 살리기 위해 ‘곧 … 그렇게 했습니다’로 옮겨, 우리야가 아하스의 지시를 정확히 따랐다는 점을 드러냈습니다.
- source_word: עַד בּוֹא
  english_pob_choice: until ... came
  chosen_korean: '... 올 때까지'
  alternatives_korean:
  - '... 오실 때까지'
  - '... 도착할 때까지'
  lexicon: HALOT
  rationale: עד + 부정사구는 종료 시점을 나타내므로, 아하스가 다마스쿠스에서 돌아오는 시점을 기준으로 한 지속을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 우리야의 순응이 서술적 묘사인지 평가적 진술인지
  chosen_reading: 본문은 우리야가 왕의 지시를 정확히 실행한 사실을 서술할 뿐, 여기서 직접적인 평가어를 추가하지 않았습니다.
  alternative_readings:
  - 우리야가 맹목적으로 순응했다는 뉘앙스를 더 강하게 드러내는 번역
  - 중립성을 약화하고 비판적 어조를 보태는 번역
  rationale: 히브리어는 행위의 일치성을 강조하지만 별도의 평가 형용사를 두지 않으므로, 독자가 본문 자체의 긴장만 읽도록 유지했습니다.
  doctrine_reference: 서술문 해석 원칙
