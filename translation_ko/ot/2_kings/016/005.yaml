  naturalness: 합쇼체 문장은 대체로 자연스럽습니다. 다만 ‘아람 왕 르신과 레말랴의 아들 베가, 곧 이스라엘 왕’보다 왕 칭호를 각 인물에게 가까이 배치하면 더 명료하고 자연스럽습니다.
