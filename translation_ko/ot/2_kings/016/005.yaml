id: 2KI.16.5
reference: 2 Kings 16:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֣ה רְצִ֣ין מֶֽלֶךְ אֲ֠רָם וּ/פֶ֨קַח בֶּן רְמַלְיָ֧הוּ מֶֽלֶךְ יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם לַ/מִּלְחָמָ֑ה וַ/יָּצֻ֨רוּ֙ עַל אָחָ֔ז וְ/לֹ֥א יָכְל֖וּ לְ/הִלָּחֵֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/005.yaml
  text: Then Rezin king of Aram and Pekah son of Remaliah[a], king of Israel, came up to Jerusalem for war, and they besieged Ahaz, but they were not able to fight against him.
  footnotes:
  - marker: a
    text: Or 'but they could not fight against it,' with 'it' referring to Jerusalem; the Hebrew does not repeat the object after 'fight.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아람 왕 르신과 이스라엘 왕 르말랴의 아들 베가가 예루살렘으로 전쟁을 하러 올라와 아하스를 포위했으나, 싸울 수 없었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘싸우다’ 뒤에 목적어를 밝히지 않습니다. 따라서 ‘예루살렘을 상대로 싸울 수 없었다’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그후
  - 그때에
  lexicon: HALOT
  rationale: 서사 전환 표지로서 시간 순서를 자연스럽게 이어 주는 한국어 표현을 택했습니다.
- source_word: יַעֲלֶה
  english_pob_choice: came up
  chosen_korean: 올라와서
  alternatives_korean:
  - 올라갔습니다
  - 진군해 와서
  lexicon: HALOT
  rationale: 예루살렘을 향한 상향 이동이라는 עלה의 관용적 의미를 살리되, 군사 이동의 뉘앙스를 과도하게 덧붙이지 않도록 했습니다.
- source_word: יְרוּשָׁלַםִ לַמִּלְחָמָה
  english_pob_choice: to Jerusalem for war
  chosen_korean: 예루살렘으로 전쟁하러
  alternatives_korean:
  - 예루살렘으로 싸우러
  - 예루살렘을 향해 전쟁하러
  lexicon: HALOT
  rationale: 목적을 나타내는 לְ + מלחמה를 한국어의 '—하러' 구조로 옮겨, ‘전쟁을 벌이려’는 의도를 분명히 했습니다.
- source_word: וַיָּצֻרוּ עַל אָחָז
  english_pob_choice: they besieged Ahaz
  chosen_korean: 아하스를 포위했으나
  alternatives_korean:
  - 아하스에게 포위를 가했으나
  - 아하스를 에워쌌으나
  lexicon: HALOT
  rationale: צור의 군사적 의미를 '포위하다'로 옮겨, 단순한 둘러섬이 아니라 공성 상황을 드러냈습니다.
- source_word: וְלֹא יָכְלוּ לְהִלָּחֵם
  english_pob_choice: but they were not able to fight against him
  chosen_korean: 그를 치지 못했습니다
  alternatives_korean:
  - 그와 싸울 수 없었습니다
  - 그를 상대로 전투를 벌이지 못했습니다
  lexicon: HALOT
  rationale: 히브리어는 이어지는 목적어를 반복하지 않지만, 문맥상 아하스를 가리키므로 한국어에서는 이를 명시해 공성 실패의 뜻을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 공격 대상의 지시 대상이 아하스인지 예루살렘인지 모호함
  chosen_reading: 문맥과 POB 수정안을 따라 최종 문장에서는 아하스를 직접 목적어로 두었습니다.
  alternative_readings:
  - 예루살렘을 치지 못했습니다
  - 그 성을 치지 못했습니다
  rationale: 히브리어는 '싸우다' 뒤에 목적어를 반복하지 않아 대상이 문맥상 열려 있지만, 앞 절의 '아하스를 포위했다'와 자연스럽게 연결되는 인물 지시를 택하는 것이 서사 흐름에 더 충실합니다.
  doctrine_reference: 본문의 문맥적 지시 대상 해석
