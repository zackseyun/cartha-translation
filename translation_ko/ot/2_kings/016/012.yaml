id: 2KI.16.12
reference: 2 Kings 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/מֶּ֨לֶךְ֙ מִ/דַּמֶּ֔שֶׂק וַ/יַּ֥רְא הַ/מֶּ֖לֶךְ אֶת הַ/מִּזְבֵּ֑חַ וַ/יִּקְרַ֥ב הַ/מֶּ֛לֶךְ עַל הַ/מִּזְבֵּ֖חַ וַ/יַּ֥עַל עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/012.yaml
  text: When the king came from Damascus[a], the king saw the altar; and the king came near to the altar and went up on it.
  footnotes:
  - marker: a
    text: Or 'approached the altar and offered on it.' Some take 'went up on it' as shorthand for beginning sacrificial action, though the Hebrew more literally describes ascent onto the altar.
    reason: alternative_reading
translation:
  language: ko
  text: 왕이 다마스쿠스에서 돌아오자, 왕은 그 제단을 보고, 그 제단에 가까이 가서 그 위로 올라갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 제단 위로 올라가는 동작을 직접 말합니다. 일부는 이를 제사를 시작하는 의미로 이해하지만, 본문 자체는 먼저 물리적 상승을 서술합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא הַמֶּלֶךְ מִדַּמֶּשֶׂק
  english_pob_choice: When the king came from Damascus
  chosen_korean: 왕이 다마스쿠스에서 돌아오자
  alternatives_korean:
  - 왕이 다마스쿠스에서 왔을 때
  - 왕이 다마스쿠스에서 도착하자
  lexicon: HALOT
  rationale: 히브리어 אָנִי/wayyiqtol 서술 흐름을 자연스러운 서사체로 옮기되, 출발지 מִן의 방향성을 살려 ‘다마스쿠스에서’로 표현했습니다.
- source_word: וַיַּרְא הַמֶּלֶךְ אֶת הַמִּזְבֵּחַ
  english_pob_choice: the king saw the altar
  chosen_korean: 왕은 그 제단을 보고
  alternatives_korean:
  - 왕이 제단을 보았고
  - 왕이 그 제단을 바라보고
  lexicon: HALOT
  rationale: ראה의 기본 의미인 ‘보다’를 그대로 살렸고, 반복된 ‘왕’은 한국어에서는 담백하게 이어 읽히도록 정리했습니다.
- source_word: וַיִּקְרַב הַמֶּלֶךְ עַל הַמִּזְבֵּחַ
  english_pob_choice: the king came near to the altar
  chosen_korean: 그 제단에 가까이 가서
  alternatives_korean:
  - 그 제단으로 다가가서
  - 그 제단 가까이 가서
  lexicon: HALOT
  rationale: קרב는 ‘가까이 가다/다가가다’의 동작을 나타내므로, 한국어에서는 중복을 줄여 자연스럽게 옮겼습니다.
- source_word: וַיַּעַל עָלָיו
  english_pob_choice: went up on it
  chosen_korean: 그 위로 올라갔습니다
  alternatives_korean:
  - 그 위에 올라갔습니다
  - 그 위로 올라섰습니다
  - 그 위로 올라가 제사를 드렸습니다
  lexicon: HALOT
  rationale: עלה + עליו의 가장 직접적인 의미는 ‘그 위로 올라가다’이므로, 영어 POB의 본문 취지를 따라 제사 행위를 덧붙이지 않고 물리적 상승을 살렸습니다.
theological_decisions:
- issue: וַיַּעַל עָלָיו를 제의적 제사행위로 넓혀 읽을지 여부
  chosen_reading: 문자적 이동 동작으로 읽어 ‘그 위로 올라갔습니다’로 옮김
  alternative_readings:
  - 그 위에 올라가 제사를 드렸습니다
  - 그 위로 올라가 제물을 바쳤습니다
  rationale: 문맥상 제의적 의미가 뒤따를 수 있으나, 이 절 자체의 히브리어 표현은 제단 위로 올라가는 동작을 직접 말하며, 제의 내용은 다음 절에서 더 분명해집니다.
  doctrine_reference: 번역 원칙 §1, §3
