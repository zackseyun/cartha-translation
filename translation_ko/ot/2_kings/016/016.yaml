  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ אוּרִיָּ֣ה הַ/כֹּהֵ֑ן כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖ה הַ/מֶּ֥לֶךְ אָחָֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/016.yaml
  text: So Uriah the priest did according to all that King Ahaz had commanded.
translation:
  language: ko
  text: 제사장 우리야는 아하스 왕이 명령한 모든 대로 행하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행하였습니다
  alternatives_korean:
  - 하였습니다
  - 했습니다
  - 했습니다만
  lexicon: HALOT
  rationale: עשה는 여기서 단순한 ‘하다/행하다’의 서술 동사로 쓰였으므로, 문맥상 자연스러운 ‘행하다’를 택해 아하스의 명령에 대한 순응을 드러냈습니다.
- source_word: אוּרִיָּה הַכֹּהֵן
  english_pob_choice: Uriah the priest
  chosen_korean: 제사장 우리야
  alternatives_korean:
  - 우리야 제사장
  - 우리야 그 제사장
  lexicon: 고유명사/직분 표기
  rationale: 히브리어의 직함을 앞세워 직분을 분명히 하되, 현대 한국어 관용에 맞게 ‘제사장 우리야’로 옮겼습니다.
- source_word: כְּכֹל אֲשֶׁר
  english_pob_choice: according to all that
  chosen_korean: 모든 대로
  alternatives_korean:
  - 모든 것을 따라
  - 전부 그대로
  lexicon: HALOT
  rationale: 전체 일치·순응의 의미를 담는 표현으로 ‘모든 대로’를 사용해, 뒤따르는 명령 내용에 정확히 맞추었다는 뜻을 살렸습니다.
- source_word: צִוָּה
  english_pob_choice: had commanded
  chosen_korean: 명령한
  alternatives_korean:
  - 명령하신
  - 분부한
  - 지시한
  lexicon: HALOT
  rationale: 이미 내려진 왕의 명령을 가리키므로 과거 관형사형 ‘명령한’이 가장 자연스럽고, 영어 POB의 시제 관계도 무리 없이 반영합니다.
theological_decisions:
- issue: 이 구절의 평가적 뉘앙스
  chosen_reading: 본문은 우르야의 행동이 아하스의 명령과 일치했다고만 서술하고, 여기서 직접적인 칭찬이나 비난은 덧붙이지 않았습니다.
  alternative_readings:
  - 아하스의 명령에 순종했다는 식으로 도덕적 평가를 앞세우는 번역
  - 반대로 불충을 암시하는 어조를 본문 자체에 넣는 번역
  rationale: 이 절 자체는 사실 보고에 머무르므로, 해석적 판단은 앞뒤 문맥에 남기고 본문은 서술적 중립성을 유지했습니다.
  doctrine_reference: '번역 원칙: 본문이 말하지 않는 신학적 평가를 덧씌우지 않기'
- issue: 왕의 명령과 제사장의 행위의 관계
  chosen_reading: ‘명령한’과 ‘모든 대로’의 결합으로, 우르야가 왕의 지시에 전적으로 맞추어 행동했음을 드러냈습니다.
  alternative_readings:
  - 관례적 협조 정도로 약화시키는 해석
  - 단순한 일회성 행위로 축소하는 해석
  rationale: 히브리어 כְּכֹל אֲשֶׁר는 포괄적 일치를 나타내므로, 관계의 강도를 약화하지 않고 그대로 옮겼습니다.
  doctrine_reference: '원문 대조: כְּכֹל אֲשֶׁר + צִוָּה의 სრული 순응 의미'
