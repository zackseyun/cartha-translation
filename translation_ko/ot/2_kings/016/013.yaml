  text: וַ/יַּקְטֵ֤ר אֶת עֹֽלָת/וֹ֙ וְ/אֶת מִנְחָת֔/וֹ וַ/יַּסֵּ֖ךְ אֶת נִסְכּ֑/וֹ וַ/יִּזְרֹ֛ק אֶת דַּֽם הַ/שְּׁלָמִ֥ים אֲשֶׁר ל֖/וֹ עַל הַ/מִּזְבֵּֽחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/016/013.yaml
  text: And he burned his burnt offering and his grain offering[a], and he poured out his drink offering, and he threw the blood of the peace offerings that were his against the altar.
  footnotes:
  - marker: a
    text: Or 'the blood of the fellowship offerings' or 'the blood of the offerings of well-being.' The Hebrew term refers to a specific sacrificial category (שְׁלָמִים).
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 자기의 번제와 자기의 곡식 제물을 태우고, 자기의 전제물을 부었으며, 자기에게 속한 화목 제물들의 피를 제단에 뿌렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘교제 제물들의 피’, ‘평안 제물들의 피’로 옮길 수 있습니다. 히브리어 שְׁלָמִים은 특정 제의 범주를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  english_pob_choice: burned
  chosen_korean: 태우고
  alternatives_korean:
  - 향을 피우고
  - 불살라 올리고
  lexicon: HALOT
  rationale: 제의적 문맥에서 קטר는 제물을 불에 올려 연기로 사르게 하는 행위이므로, 현대 한국어에서는 간결한 ‘태우고’가 자연스럽고 원문의 동작을 잘 드러냅니다.
- source_word: מִנְחָתוֹ
  english_pob_choice: his grain offering
  chosen_korean: 자기의 곡식 제물
  alternatives_korean:
  - 자기의 소제
  - 자기의 곡식 제사
  lexicon: HALOT
  rationale: מִנְחָה는 이 제의 문맥에서 일반적 ‘예물’보다 특정 제물 범주를 가리키므로, 의미를 살리되 현대 독자가 이해하기 쉬운 ‘곡식 제물’로 옮겼습니다.
- source_word: נִסְכּוֹ
  english_pob_choice: his drink offering
  chosen_korean: 전제물
  alternatives_korean:
  - 술제물
  - 붓는 제물
  lexicon: HALOT
  rationale: נֶסֶךְ은 제의적 붓는 제물인 전제를 가리키므로, 교회 용례와도 연결되는 ‘전제물’을 유지했습니다.
- source_word: דַּם הַשְּׁלָמִים
  english_pob_choice: the blood of the peace offerings
  chosen_korean: 화목제물의 피
  alternatives_korean:
  - 평화제물의 피
  - 교제제물의 피
  - 화목 제사의 피
  lexicon: HALOT
  rationale: שְׁלָמִים은 보편적으로 ‘화목제물’로 옮기는 제의 범주이므로, 의미 범주를 보존하는 표준적 한국어를 택했습니다.
- source_word: עַל הַמִּזְבֵּחַ
  english_pob_choice: against the altar
  chosen_korean: 제단 위에 던졌습니다
  alternatives_korean:
  - 제단에 던졌습니다
  - 제단을 향해 던졌습니다
  lexicon: HALOT
  rationale: זרק는 피를 제단에 ‘뿌리다/던지다’는 동작을 나타내므로, 한국어에서는 자연스러운 제의 표현인 ‘제단 위에 던졌습니다’로 옮겼습니다.
theological_decisions:
- issue: 제의 동작의 강도와 방향
  chosen_reading: זרק를 완곡하게 ‘뿌리다’로 약화시키지 않고 ‘던지다’로 유지하여, 피가 제단에 가해지는 물리적 동작을 드러냈습니다.
  alternative_readings:
  - 제단에 뿌렸습니다
  - 제단에 뿌려 바쳤습니다
  rationale: 본문은 제의적 절차의 구체성을 전달하므로, 행위의 강한 동작성을 보존하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 제의 규례와 왕의 우상화된 행위에 대한 본문 서술의 직접성
