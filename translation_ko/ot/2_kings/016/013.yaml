  - severity: medium
    issue: ‘제단 위에 던졌습니다’는 피의 제의적 처리로서 자연스럽지 않고, זָרַק의 통상적 제의 용법을 충분히 살리지 못합니다.
    rationale: זָרַק은 피를 제단에 던져 뿌리는 행위입니다. ‘제단에 뿌렸습니다’는 한국어 제의 문맥에서 관습적이면서도 이 동작을 적절히 나타냅니다. ‘위에’보다 עַל의 제단을 향한/제단에 가해지는 방향도 더 자연스럽게 처리합니다.
