  to: 히스기야는 그들의 말을 듣고 그들에게 자기의 보물창고, 곧 은과 금과 향품과 좋은 기름과 자기의 무기고와 자기의 곳간들 가운데 있는 모든 것을 다 보여 주었습니다. 그의 집과 그의 온 통치 영역에서 히스기야가 그들에게 보여 주지 않은 것은 하나도 없었습니다.[a][b][c][d]
  rationale: 의미상 안전한 수정으로, מֶמְשָׁלָה를 지리적으로 한정하는 ‘영토’ 대신 통치와 지배의 범위를 포괄하는 ‘온 통치 영역’으로 바로잡았습니다. 이에 맞추어 해당 각주도 수정하고, 마지막 병렬 구절을 현대 한국어에 더 자연스럽게 다듬었습니다. 나머지 목록과 이중 부정의 전면적 강조는 유지했습니다.
