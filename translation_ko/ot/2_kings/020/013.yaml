  text: וַ/יִּשְׁמַ֣ע עֲלֵי/הֶם֮ חִזְקִיָּהוּ֒ וַ/יַּרְאֵ֣/ם אֶת כָּל בֵּ֣ית נְכֹתֹ֡/ה אֶת הַ/כֶּסֶף֩ וְ/אֶת הַ/זָּהָ֨ב וְ/אֶת הַ/בְּשָׂמִ֜ים וְ/אֵ֣ת שֶׁ֣מֶן הַ/טּ֗וֹב וְ/אֵת֙ בֵּ֣ית כֵּלָ֔י/ו וְ/אֵ֛ת כָּל אֲשֶׁ֥ר נִמְצָ֖א בְּ/אֽוֹצְרֹתָ֑י/ו לֹֽא הָיָ֣ה דָבָ֗ר אֲ֠שֶׁר לֹֽא הֶרְאָ֧/ם חִזְקִיָּ֛הוּ בְּ/בֵית֖/וֹ וּ/בְ/כָל מֶמְשַׁלְתּֽ/וֹ־־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/013.yaml
  text: And Hezekiah listened to them and showed them all his treasure house—the silver[a], the gold, the spices, the fine oil, his armory, and everything that was found in his storehouses[d][c][b]. There was nothing in his house or in all his realm that Hezekiah did not show them.
  footnotes:
  - marker: a
    text: Or 'heard them' or 'received them favorably'; the Hebrew idiom can carry the sense of giving audience or heed.
    reason: lexical_alternative
  - marker: b
    text: Or 'his storehouse' for 'his treasure house.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his arsenal' or more literally 'the house of his equipment.'
    reason: lexical_alternative
  - marker: d
    text: Or 'in all his dominion.'
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야는 그들의 말을 듣고 그들에게 자기의 보물창고—은과 금과 향품과 좋은 기름과 자기의 무기고와 자기의 곳간들 가운데 있는 모든 것—을 다 보여 주었습니다. 그의 집 안이나 그의 모든 영토 안에 히스기야가 그들에게 보여 주지 않은 것은 하나도 없었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 말을 듣고’는 히브리어 관용구 שׁמע עַל의 뜻을 살린 것으로, ‘그들을 들었다’보다 ‘호의적으로 접견하다’의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보물창고’는 문자적으로는 ‘보물의 집/귀중품의 집’에 가까운 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘무기고’는 문자적으로는 ‘장비의 집’ 또는 ‘병기고/군수창고’에 해당할 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘영토’는 ‘통치 영역’ 또는 ‘지배권 아래 있는 전역’의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע עֲלֵיהֶם
  english_pob_choice: listened to them
  chosen_korean: 그들의 말을 듣고
  alternatives_korean:
  - 그들을 들었고
  - 그들에게 귀를 기울이고
  - 그들을 호의적으로 받아들이고
  lexicon: HALOT
  rationale: שׁמע עַל은 단순 청취보다 ‘듣고 받아들이다/상대를 받아주다’의 관용을 가질 수 있어, 문맥상 가장 자연스러운 ‘그들의 말을 듣고’로 옮겼습니다.
- source_word: בֵּית נְכֹתֹה
  english_pob_choice: his treasure house
  chosen_korean: 자기의 보물창고
  alternatives_korean:
  - 자기의 창고
  - 자기의 귀중품 보관소
  - 그의 보물의 집
  lexicon: HALOT
  rationale: 문맥이 값진 물품의 목록이므로 단순한 창고보다 ‘보물창고’가 원문의 보관 장소와 가치성을 함께 드러냅니다.
- source_word: בְּשָׂמִים / שֶׁמֶן הַטּוֹב / בֵּית כֵּלָיו
  english_pob_choice: the spices, the fine oil, his armory
  chosen_korean: 향품과 좋은 기름과 자기의 무기고
  alternatives_korean:
  - 향료와 귀한 기름과 자기의 군수품 창고
  - 향신료와 고운 기름과 자기의 병기고
  - 향품과 진귀한 기름과 자기의 병기창
  lexicon: HALOT
  rationale: בְּשָׂמִים은 값진 향료류를 넓게 가리키므로 ‘향품’이 포괄적이고, שֶׁמֶן הַטּוֹב은 품질 강조를 살려 ‘좋은 기름’으로 옮겼으며, בֵּית כֵּלָיו는 왕실 군수·장비 보관소의 뜻을 담아 ‘무기고’로 처리했습니다.
- source_word: אֹצְרֹתָיו / בְכָל מֶמְשַׁלְתּוֹ
  english_pob_choice: his storehouses / in all his realm
  chosen_korean: 그의 곳간들 / 그의 모든 영토
  alternatives_korean:
  - 그의 저장고들 / 그의 모든 통치 영역
  - 그의 창고들 / 그의 모든 나라
  lexicon: HALOT
  rationale: אֹצָר는 보물창고뿐 아니라 저장고도 가리킬 수 있어, 앞의 ‘보물창고’와 중복을 피하면서 복수형 뉘앙스를 살려 ‘곳간들’로 옮겼고, מֶמְשָׁלָה는 단순한 나라보다 통치가 미치는 범위를 드러내는 ‘영토’가 자연스럽습니다.
theological_decisions:
- issue: 왕실 재산을 전면적으로 과시한 서술의 강조
  chosen_reading: 본문은 히스기야가 자기 소유의 범위를 하나도 남기지 않고 전부 노출했음을 강조합니다.
  alternative_readings:
  - 단순히 외교적 예우로 손님을 안내한 것으로 완화하는 해석
  - 왕궁 내부를 친절히 보여 준 정도로 축소하는 해석
  rationale: 히브리어의 이중 부정 구조와 전체 목록은 ‘하나도 남기지 않음’의 전면성을 강조하므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 본문 맥락 해석; 열왕기하 20장의 서술 의도
