  - 베로닥발라단
  lexicon: HALOT
  rationale: 고유명사는 음역을 따르되, 본문 자음형에 더 직접적인 표기를 본문에 두고 영어 전통형은 각주로 보완하는 것이 원문 근접성과 검증 가능성을 함께 살립니다.
- source_word: סְפָרִים וּמִנְחָה
  english_pob_choice: letters and a gift
  chosen_korean: 편지들과 예물
  alternatives_korean:
  - 서신들과 선물
  - 문서들과 조공
  lexicon: HALOT
  rationale: סְפָרִים는 외교 문맥에서 ‘편지들’이 가장 자연스럽고, מִנְחָה는 여기서 단순한 선물보다 격식을 갖춘 ‘예물’이 원문의 외교적 뉘앙스를 더 잘 드러냅니다.
- source_word: כִּי חָלָה חִזְקִיָּהוּ
  english_pob_choice: that Hezekiah had been sick
  chosen_korean: 히스기야가 병들었다는 소식을
  alternatives_korean:
  - 히스기야가 병이 들었다는 것을
  - 히스기야가 아팠다는 소식을
  lexicon: HALOT
  rationale: שָׁמַע의 목적절을 한국어에서는 ‘소식을 들었다’로 자연스럽게 풀어, 단순 상태 진술보다 ‘듣고 반응한 이유’가 분명하게 드러나도록 했습니다.
theological_decisions:
