base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/012.yaml
  text: At that time Merodach-baladan son of Baladan[a], king of Babylon, sent letters and a gift to Hezekiah, because he had heard that Hezekiah had been sick.
  footnotes:
  - marker: a
    text: Hebrew reads 'Berodach-baladan'; many English translations render the name 'Merodach-baladan,' likely reflecting a variant form preserved in Isaiah 39:1 and ancient tradition.
    reason: alternative_reading
translation:
  language: ko
  text: 그때에 바빌론 왕 브로닥발라단[a]—발라단의 아들—이 히스기야에게 편지들과 예물을 보냈습니다. 이는 히스기야가 병들었다는 소식을 들었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘브로닥발라단’으로 읽히지만, 많은 번역은 이사야 39:1의 전승을 따라 ‘메로닥발라단’으로 옮깁니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그 시기에
  - 그때
  lexicon: HALOT
  rationale: 서술 전환을 자연스럽게 살리는 표준적 시간 표지로, 문맥을 과하게 특정하지 않으면서 원문의 흐름을 반영합니다.
- source_word: בְּרֹאדַךְ בַּלְאֲדָן
