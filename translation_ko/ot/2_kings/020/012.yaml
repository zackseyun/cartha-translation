  - 조공
  rationale: 본문은 왕에게 보내는 외교적 접촉을 말하므로, 종교적 제물 의미를 피하면서도 단순한 사적 선물보다 격식과 공적 성격을 살리는 ‘예물’이 가장 균형적입니다.
