  - 징조
  - 증거
  lexicon: HALOT
  rationale: אֹות는 여기서 하나님의 뜻이 확인되는 표지이므로, 문맥상 종교적·서사적 뉘앙스를 살리면서도 자연스러운 ‘표징’이 적절합니다.
- source_word: מֵאֵת יְהוָה
  english_pob_choice: from Yahweh
  chosen_korean: 야훼로부터
  alternatives_korean:
  - 야훼에게서
  - 여호와로부터
  - 주님으로부터
  lexicon: HALOT
  rationale: 원문은 표징의 출처를 나타내므로 ‘로부터’가 가장 직접적이며, 본 프로젝트 기본어인 ‘야훼’를 유지했습니다.
- source_word: הָלַךְ הַצֵּל ... יָשׁוּב
  english_pob_choice: shall the shadow go forward ... or shall it turn back
  chosen_korean: 그림자가 ... 앞으로 나아가겠습니까, 아니면 ... 뒤로 돌아가겠습니까
  alternatives_korean:
  - 그림자가 ... 전진하겠습니까, 아니면 ... 되돌아가겠습니까
  - 그림자가 ... 나아가겠습니까, 아니면 ... 돌아오겠습니까
  lexicon: HALOT
  rationale: ‘הלך/שוב’의 대비를 한국어로 자연스럽게 드러내기 위해 ‘앞으로 나아가다 / 뒤로 돌아가다’로 옮겼습니다.
- source_word: עֶשֶׂר מַעֲלוֹת
  english_pob_choice: ten steps
  chosen_korean: 십 계단
  alternatives_korean:
  - 열 걸음
  - 열 계단
  - 십 단계
  lexicon: HALOT
  rationale: 마눌라/계단 장치와 관련된 문맥을 반영해 전통적 해석을 따라 ‘계단’으로 옮기되, 수량은 원문의 ‘열’을 한자어 수사로 맞췄습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
