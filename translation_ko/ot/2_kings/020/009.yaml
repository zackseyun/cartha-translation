base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/009.yaml
  text: 'And Isaiah said[a], “This is the sign for you from Yahweh, that Yahweh will do the thing that he has spoken: shall the shadow go forward ten steps, or shall it turn back ten steps?”'
  footnotes:
  - marker: a
    text: Or, “ten degrees.” The Hebrew word literally means “steps” or “ascents,” but it has traditionally been rendered “degrees” in this context because of the shadow’s movement on the device associated with Ahaz.
    reason: lexical_alternative
translation:
  language: ko
  text: 이사야가 말했습니다. 「이것은 야훼로부터 받은 표징입니다. 야훼께서 말씀하신 일을 이루실 것이니, 그림자가 십 계단 앞으로 나아가겠습니까, 아니면 십 계단 뒤로 돌아가겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘십 계단’은 이 문맥의 전통적 번역인 ‘십 도’에 해당할 수 있습니다. 히브리어는 문자적으로는 ‘계단들/올라감들’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표징
  alternatives_korean:
