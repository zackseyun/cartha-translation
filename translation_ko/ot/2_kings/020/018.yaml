  naturalness: ‘당신에게서 나오는 당신의 아들들 가운데 일부 — 당신이 낳을 자들 —’은 삽입구가 앞선 명사구와 의미상 중복되고 문장 흐름을 끊습니다. 관계절을 아들들을 직접 수식하도록 정리하고, ‘바빌론 왕의 궁전’으로 옮기면 표준 현대 한국어 합쇼체 문장으로 자연스럽습니다.
  terminology: 바빌론은 한국어 성경 및 현대 한국어에서 Babylon의 통용 표기입니다. סָרִיסִים는 본문에서 ‘내시’로 유지하되, 왕실 관리라는 넓은 용례는 각주에서 보존하는 것이 적절합니다. הֵיכָל은 이 문맥에서 ‘궁전’이 적합합니다.
