revisions:
- from: 그리고 당신에게서 나오는 당신의 아들들 가운데 일부 — 당신이 낳을 자들 — 이 끌려가서 바벨의 왕의 궁에서 내시가 될 것입니다.[a]
  to: 당신에게서 나올, 곧 당신이 낳을 아들들 가운데 일부가 끌려가 바빌론 왕의 궁전에서 내시[a]가 될 것입니다.
  rationale: 부분 표현과 두 개의 혈통·부친 관계절을 보존하되, 한국어에서 두 관계절이 ‘아들들’을 수식하도록 정리했습니다. סָרִיסִים는 원문의 기본 의미에 따라 ‘내시’로 유지하고, 다른 가능한 용례는 각주에 남겼습니다. ‘바빌론 왕의 궁전’은 בְּהֵיכַל מֶלֶךְ בָּבֶל을 자연스럽고 충실하게 옮긴 표현입니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:46Z'
