base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/018.yaml
  text: And some of your sons who will come from you[a], whom you will father, will be taken, and they will become eunuchs in the palace of the king of Babylon.
  footnotes:
  - marker: a
    text: Or 'court officials' or 'palace officials'; the Hebrew term can refer either to literal eunuchs or, in some contexts, to royal officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신에게서 나올, 곧 당신이 낳을 아들들 가운데 일부가 끌려가 바빌론 왕의 궁전에서 내시[a]가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘궁정 관리들’ 또는 ‘왕실 관리들’. 히브리어 용어는 문자적인 내시를 가리키기도 하고, 어떤 문맥에서는 왕실 관리들을 뜻하기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבָּנֶיךָ
  english_pob_choice: And some of your sons
  chosen_korean: 당신의 아들들 가운데 일부
  alternatives_korean:
  - 당신의 아들들 가운데서
  - 당신의 자손들 가운데 일부
  lexicon: HALOT
  rationale: 부분을 나타내는 מן을 자연스럽게 살려 ‘가운데 일부’로 옮기고, 원문의 בנים은 ‘자손들’보다 ‘아들들’이 더 직접적입니다.
- source_word: אֲשֶׁר יֵצְאוּ מִמְּךָ / אֲשֶׁר תּוֹלִיד
  english_pob_choice: who will come from you / whom you will father
  chosen_korean: 당신에게서 나오는 — 당신이 낳을 자들
  alternatives_korean:
  - 당신에게서 나올 자들
  - 당신이 낳게 될 자들
  lexicon: HALOT
  rationale: 출생과 혈통을 함께 드러내기 위해 ‘당신에게서 나오는’과 ‘당신이 낳을’의 의미를 연결해, 출처와 부친 관계를 모두 보존했습니다.
- source_word: סָרִיסִים
  english_pob_choice: eunuchs
  chosen_korean: 내시
  alternatives_korean:
  - 궁정 관리들
  - 궁중 관리들
  lexicon: HALOT
  rationale: 문맥상 바벨 왕궁에 편입되는 왕자들의 운명을 가리키므로 기본 의미인 ‘내시’를 본문에 두고, 직책적 의미는 각주로 남깁니다.
- source_word: בְּהֵיכַל מֶלֶךְ בָּבֶל
  english_pob_choice: in the palace of the king of Babylon
  chosen_korean: 바벨의 왕의 궁에서
  alternatives_korean:
  - 바벨 왕의 궁에서
  - 바벨 왕궁에서
  lexicon: HALOT
  rationale: היכל을 왕궁의 의미로 보고, 속격 구조를 직역에 가깝게 유지하되 한국어로는 자연스럽게 ‘왕의 궁’으로 옮겼습니다.
theological_decisions:
- issue: סָרִיסִים의 의미를 ‘내시’로 둘지 ‘궁정 관리’로 완화할지
  chosen_reading: 본문에는 ‘내시’를 두고, 각주에서 ‘궁정 관리들 / 궁중 관리들’ 가능성을 밝힙니다.
  alternative_readings:
  - 궁정 관리들
  - 궁중 관리들
  rationale: 히브리어는 실제 내시를 가리킬 수도, 궁정 관료를 가리킬 수도 있으므로, 판단을 본문에서 미리 단정하지 않고 해석의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3 (Preserve theological tension rather than resolve it)
