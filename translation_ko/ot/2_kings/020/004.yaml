base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/004.yaml
  text: And it happened[a], before Isaiah had gone out into the middle court, that the word of Yahweh came to him, saying,
  footnotes:
  - marker: a
    text: 'Hebrew: ''the middle city.'' The phrase is traditionally understood here as a palace area or court; hence ''the middle court.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이런 일이 있었습니다. 이사야가 아직 안쪽 뜰로 나가기 전에, 야훼의 말씀이 그에게 임하여 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 직역은 ‘중간/한가운데의 도시’입니다. 문맥상 궁전 구역의 뜰로 이해되어 전통적으로 ‘안쪽 뜰’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 그리고 이런 일이 있었습니다
  alternatives_korean:
  - 그리고 있었습니다
  - 그때 이런 일이 있었습니다
  lexicon: HALOT
  rationale: 서사의 전개를 여는 wayyiqtol의 기능을 살리되, 현대 한국어에서 자연스럽고 문어적인 연결 표현으로 옮겼습니다.
- source_word: לֹא יָצָא הָעִיר הַתִּיכֹנָה
  english_pob_choice: before Isaiah had gone out into the middle court
  chosen_korean: 아직 안쪽 뜰로 나가기 전에
  alternatives_korean:
  - 아직 중간 뜰로 나가기 전에
  - 안쪽 궁정으로 나가기 전에
  lexicon: HALOT
  rationale: 문맥상 הָעִיר הַתִּיכֹנָה는 단순한 ‘도시’가 아니라 궁전 구역의 뜰을 가리키는 것으로 이해되므로, POB의 ‘middle court’ 취지를 살려 ‘안쪽 뜰’로 옮겼습니다.
- source_word: וּדְבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀이
  alternatives_korean:
  - 여호와의 말씀이
  - 주님의 말씀이
  lexicon: HALOT
  rationale: 본문의 하나님의 이름 יְהוָה를 프로젝트 기본값에 따라 ‘야훼’로 옮겼고, 예언 공식인 ‘the word of Yahweh’는 한국어에서 자연스러운 ‘말씀’으로 표현했습니다.
- source_word: הָיָה אֵלָיו לֵאמֹר
  english_pob_choice: came to him, saying,
  chosen_korean: 그에게 임하여 말했습니다
  alternatives_korean:
  - 그에게 왔으며 말했습니다
  - 그에게 와서 말했습니다
  lexicon: HALOT
  rationale: הָיָה אֵלָיו의 관용적 의미를 ‘임하다’로 살려, 예언적 계시가 이사야에게 도달하는 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 본절의 יְהוָה는 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본 용례에 따라 신적 고유명사를 가려지게 하지 않고 직접 드러내어, 예언 구문의 권위와 언약적 식별성을 보존했습니다.
  doctrine_reference: Project glossary — יהוה / YHWH → 야훼
