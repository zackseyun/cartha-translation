    text: 히브리어의 직역은 ‘중간/한가운데의 도시’입니다. 문맥상 궁전 구역의 뜰로 이해되어 전통적으로 ‘안쪽 뜰’로 옮길 수 있습니다.
    reason: lexical_alternative
