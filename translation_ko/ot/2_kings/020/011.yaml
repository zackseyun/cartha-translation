base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/011.yaml
  text: And Isaiah the prophet cried out to Yahweh[a], and he brought the shadow back the ten steps by which it had gone down on the steps of Ahaz.
  footnotes:
  - marker: a
    text: Or 'ten degrees.' The Hebrew says 'ten steps/ascents' (ma'alot), traditionally understood by some as part of a shadow-measuring device, hence 'dial of Ahaz.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이사야 예언자가 야훼께 부르짖자, 야훼께서 아하스의 층계 위에서 내려갔던 그림자를 열 층계만큼 뒤로 되돌리셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘열 층계/단계’(ma‘alot)라고 말합니다. 이것은 전통적으로 아하스의 해시계로 이해되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: cried out
  chosen_korean: 부르짖으니
  alternatives_korean:
  - 외치니
  - 불러 구하니
  - 기도하니
  lexicon: HALOT
  rationale: 하나님께 드리는 קרא의 뉘앙스를 살리면서, 단순한 ‘불렀다’보다 간절하고 생동감 있는 동작을 한국어로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: POB 기본 원칙에 따라 신적 이름 יהוה를 음역하여, 본문이 드러내는 언약 이름을 가리지 않았습니다.
- source_word: בַּמַּעֲלוֹת ... עֶשֶׂר מַעֲלוֹת
  english_pob_choice: the ten steps
  chosen_korean: 열 걸음
  alternatives_korean:
  - 열 계단
  - 열 층계
  - 열 단계
  lexicon: HALOT
  rationale: מַעֲלוֹת의 기본 뜻인 ‘걸음/계단’을 살리되, 현대 한국어에서 자연스럽고 중립적으로 읽히는 ‘걸음’으로 옮겼습니다.
- source_word: בְּמַעֲלוֹת אָחָז
  english_pob_choice: on the steps of Ahaz
  chosen_korean: 아하스의 층계에서
  alternatives_korean:
  - 아하스의 계단에서
  - 아하스의 계단식 장치에서
  - 아하스의 해시계에서
  lexicon: HALOT
  rationale: 본문은 본래 ‘층계/걸음’이라고 말하므로, 전통적 해석인 ‘해시계’를 본문 자체에 넣지 않고 비교적 직역에 가까운 ‘층계’를 택했습니다.
theological_decisions:
- issue: 아하스의 מַעֲלוֹת를 한국어 본문에서 어떻게 처리할지
  chosen_reading: ‘층계’로 번역해 본문이 말하는 표면적 표현을 유지했습니다.
  alternative_readings:
  - ‘해시계’로 해석하여 옮김
  - ‘계단식 장치’로 구체화
  rationale: 히브리어 본문은 ‘steps/ascents’를 직접 말할 뿐 장치의 성격을 확정하지 않으므로, 역사적 재구성을 본문에 앞세우지 않고 여지를 남겼습니다.
  doctrine_reference: Translation philosophy §1, §3, §5
