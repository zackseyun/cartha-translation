revisions:
- from: 이사야 선지자가 야훼께 부르짖으니, 야훼께서 아하스의 층계에서 내려가던 그 그림자를 열 걸음 뒤로 돌리셨습니다.[a]
  to: 이사야 예언자가 야훼께 부르짖자, 야훼께서 아하스의 층계 위에서 내려갔던 그림자를 열 층계만큼 뒤로 되돌리셨습니다.[a]
  rationale: 완료된 하강과 그에 대한 역방향 이동을 분명히 하고, 반복되는 히브리어 מַעֲלוֹת를 ‘층계’로 일관되게 옮겼습니다. 해시계라는 전통적 이해는 본문이 아니라 각주에 한정하여 역사적 불확실성을 보존했습니다.
