base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/015.yaml
  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
  footnotes:
  - marker: a
    text: Or “in your palace.” Hebrew “in your house.”
    reason: lexical_alternative
  - marker: b
    text: Or “storehouses.” The Hebrew term can refer to places where valuables or supplies are kept.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다[a]. “그들이 당신의 집에서 무엇을 보았습니까?” 히스기야가 말했습니다. “그들은 내 집에 있는 모든 것을 보았습니다[b]. 내가 내 보물창고들 가운데서 그들에게 보여 주지 않은 것은 하나도 없었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 궁전에서”. 히브리어는 “당신의 집에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “보물창고들 가운데서”. 히브리어는 왕실의 귀중품이나 물품을 보관하는 곳을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֵיתֶךָ
  english_pob_choice: in your house
  chosen_korean: 당신의 집에서
  alternatives_korean:
  - 당신의 궁전에서
  - 당신의 집 안에서
  lexicon: HALOT
  rationale: 히브리어 בַּיִת의 기본 뜻인 ‘집’을 살리고, POB의 영어 선택처럼 궁전으로 과도하게 풀지 않았습니다.
- source_word: אֵת כָּל אֲשֶׁר בְּבֵיתִי
  english_pob_choice: everything that is in my house
  chosen_korean: 내 집에 있는 모든 것
  alternatives_korean:
  - 내 집 안의 모든 것
  - 내 집에 있는 전부
  lexicon: HALOT
  rationale: 전체를 가리키는 אֵת כָּל אֲשֶׁר의 포괄성을 자연스러운 한국어로 옮겼습니다.
- source_word: הִרְאִיתִם
  english_pob_choice: did not show them
  chosen_korean: 그들에게 보여 주지 않은
  alternatives_korean:
  - 그들이 보게 하지 않은
  - 그들에게 드러내지 않은
  lexicon: HALOT
  rationale: 히필의 ‘보게 하다/보여 주다’ 의미를 반영해, 직접적이고도 자연한 ‘보여 주지 않은’으로 옮겼습니다.
- source_word: בְּאֹצְרֹתָי
  english_pob_choice: in my treasuries
  chosen_korean: 내 보물창고들 가운데서
  alternatives_korean:
  - 내 보물창고들에서
  - 내 창고들 가운데서
  lexicon: HALOT
  rationale: אֹצָר는 왕실의 보관 장소인 ‘보물창고/창고’를 가리킬 수 있어, 문맥상 재물을 드러낸 장면을 살리기 위해 ‘보물창고들’로 옮겼습니다.
