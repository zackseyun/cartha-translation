  text: And he said[a], “What did they see in your house?” And Hezekiah said, “They saw everything that is in my house[b]. There was nothing that I did not show them among my treasuries.”
  footnotes:
  - marker: a
    text: Or “in your palace.” Hebrew “in your house.”
    reason: lexical_alternative
  - marker: b
    text: Or “storehouses.” The Hebrew term can refer to places where valuables or supplies are kept.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “그들이 당신의 집에서[a] 무엇을 보았습니까?” 히스기야가 말했습니다. “그들은 내 집에 있는 모든 것을 보았습니다. 내가 내 보물창고들[b]에 있는 것 가운데 그들에게 보여 주지 않은 것은 하나도 없었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 궁전에서”. 히브리어는 “당신의 집에서”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “창고들”. 히브리어는 귀중품이나 물품을 보관하는 장소를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
