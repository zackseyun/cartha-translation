  rationale: 전체를 가리키는 אֵת כָּל אֲשֶׁר의 포괄성을 자연스러운 한국어로 옮겼습니다.
- source_word: הִרְאִיתִם
  english_pob_choice: did not show them
  chosen_korean: 그들에게 보여 주지 않은
  alternatives_korean:
