  - 내 창고들 가운데서
  lexicon: HALOT
  rationale: אֹצָר는 왕실의 보관 장소인 ‘보물창고/창고’를 가리킬 수 있어, 문맥상 재물을 드러낸 장면을 살리기 위해 ‘보물창고들’로 옮겼습니다.
