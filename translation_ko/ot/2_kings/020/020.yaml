source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֤י חִזְקִיָּ֨הוּ֙ וְ/כָל גְּב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר עָשָׂ֗ה אֶת הַ/בְּרֵכָה֙ וְ/אֶת הַ/תְּעָלָ֔ה וַ/יָּבֵ֥א אֶת הַ/מַּ֖יִם הָ/עִ֑ירָ/ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/020.yaml
  text: Now the rest of the acts of Hezekiah[a], and all his might[c][b], and how he made the pool and the conduit and brought the water into the city—are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'reservoir' for 'pool'; the Hebrew term can denote a constructed water basin.
    reason: lexical_alternative
  - marker: b
    text: Or 'channel' for 'conduit'; the Hebrew refers to a watercourse or engineered water channel.
    reason: lexical_alternative
  - marker: c
    text: This likely refers to Hezekiah's well-known waterworks in Jerusalem; compare 2 Chronicles 32:30.
    reason: cross_reference
translation:
  language: ko
  text: 히스기야의 나머지 행적과 그의 모든 능력, 그리고 그가 못[a]과 수로[b]를 만들고 물을 도시 안으로 끌어들인 일은[c] 유다 왕들의 연대기 책에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘못’은 히브리어 בְּרֵכָה의 번역입니다. 이 말은 인공으로 만든 물 저장소, 곧 저수지를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수로’는 히브리어 תְּעָלָה의 번역입니다. ‘물길’ 또는 ‘도수로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절은 히스기야와 관련된 예루살렘의 급수 공사를 가리키는 것으로 보입니다. 대하 32:30을 참조하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: the rest of the acts
  chosen_korean: 나머지 행적
  alternatives_korean:
  - 나머지 일들
  - 나머지 사건들
  - 남은 행적
  lexicon: HALOT
  rationale: 왕실 연대기 공식에서 דִּבְרֵי는 단순한 ‘말’보다 왕의 공적과 행적을 가리키므로, 현대 한국어의 역사 서술에 자연스러운 ‘행적’을 택했습니다.
- source_word: וְכָל גְּבוּרָתוֹ
  english_pob_choice: and all his might
  chosen_korean: 그의 모든 용맹
  alternatives_korean:
  - 그의 모든 힘
  - 그의 모든 능력
  - 그의 모든 위력
  lexicon: HALOT
  rationale: גְּבוּרָה는 물리적 힘만이 아니라 용기와 위업을 포함할 수 있어, 왕의 공적을 드러내는 문맥에서는 ‘용맹’이 가장 자연스럽고 의미를 넓게 살립니다.
- source_word: הַבְּרֵכָה
  english_pob_choice: the pool
  chosen_korean: 못
  alternatives_korean:
  - 연못
  - 저수지
  - 물웅덩이
  lexicon: HALOT
  rationale: 이 단어는 인공적으로 만든 물 저장소를 가리킬 수 있지만, 본문은 특정 기술 용어보다 한국어에서 널리 이해되는 물 저장시설로서의 기능을 드러내기 위해 ‘못’으로 옮겼습니다.
- source_word: הַתְּעָלָה
  english_pob_choice: the conduit
  chosen_korean: 도랑
  alternatives_korean:
  - 수로
  - 수로관
  - 도수로
  lexicon: HALOT
  rationale: תְּעָלָה는 물길·수로를 뜻하므로, 공학적 느낌을 살리면서도 너무 전문화되지 않은 ‘도랑’을 선택했습니다.
- source_word: וַיָּבֵא אֶת הַמַּיִם הָעִירָה
  english_pob_choice: and brought the water into the city
  chosen_korean: 물을 도시 안으로 끌어들인
  alternatives_korean:
  - 물을 도시로 들여온
  - 물을 성 안으로 가져온
  - 물을 도시 안으로 인도한
  lexicon: HALOT
  rationale: 동사와 방향성 어미는 단순한 이동보다 물을 도시 내부로 유도하는 공학적 동작을 나타내므로, ‘끌어들인’이 원문의 의도를 가장 잘 반영합니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 연대기 책
  alternatives_korean:
  - 유다 왕들의 역대기 책
  - 유다 왕들의 기록 책
  - 유다 왕들의 실록
  lexicon: HALOT
  rationale: 고정된 왕실 사료 제목이므로, 관용적으로 이해되는 ‘연대기 책’으로 옮기되 ‘유다 왕들’의 소유 관계를 분명히 했습니다.
