source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר חִזְקִיָּ֨הוּ֙ אֶֽל יְשַֽׁעְיָ֔הוּ ט֥וֹב דְּבַר יְהוָ֖ה אֲשֶׁ֣ר דִּבַּ֑רְתָּ וַ/יֹּ֕אמֶר הֲ/ל֛וֹא אִם שָׁל֥וֹם וֶ/אֱמֶ֖ת יִהְיֶ֥ה בְ/יָמָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/019.yaml
  text: Then Hezekiah said to Isaiah[a], “The word of Yahweh that you have spoken is good.” For he thought, “Will there not be peace and stability in my days?”
  footnotes:
  - marker: a
    text: Or 'peace and truth in my days.' The Hebrew אֱמֶת can mean 'truth,' 'faithfulness,' or, in context, dependable stability.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 이사야에게 말했습니다. 「당신이 말씀하신 야훼의 말씀은 좋습니다.」 그가 다시 말했습니다. 「내 생애 동안에는 평화와 안정[a]이 있지 않겠습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 생애 동안에는 평화와 진리가 있지 않겠습니까?’로 옮길 수 있습니다. 히브리어 אֱמֶת는 ‘진리’, ‘신실함’, 또는 문맥상 ‘안정’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  english_pob_choice: good
  chosen_korean: 좋습니다
  alternatives_korean:
  - 괜찮습니다
  - 선합니다
  lexicon: HALOT
  rationale: 히브리어 טוֹב의 직접적 평가를 간결하게 살려, 왕의 응답을 과도하게 해석하지 않으면서 자연스러운 현대 한국어로 옮겼습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 여호와의 말씀
  - 주님의 말씀
  lexicon: HALOT
  rationale: POB의 원칙에 따라 여호와 대신 야훼를 사용했고, דָּבָר는 예언 문맥에서 표준적으로 '말씀'으로 옮겨 예언 발화의 형식을 보존했습니다.
- source_word: אֱמֶת
  english_pob_choice: stability
  chosen_korean: 안정
  alternatives_korean:
  - 진리
  - 신실함
  - 평안
  lexicon: HALOT
  rationale: 이 문맥에서는 추상적 '진리'보다 왕국의 지속성과 질서를 가리키는 '안정'이 더 적절해 보이며, 영어 POB가 지적한 의미 긴장을 한국어로도 유지합니다.
- source_word: בְיָמָי
  english_pob_choice: in my days
  chosen_korean: 내 생애 동안에는
  alternatives_korean:
  - 내 날들에는
  - 내 시대에는
  lexicon: HALOT
  rationale: 직역형 '내 날들에는'도 가능하지만, 히스기야의 관심이 자신의 생애에 국한된다는 점을 현대 한국어에서 더 분명하게 전달하기 위해 자연스럽게 풀었습니다.
theological_decisions:
- issue: 히스기야의 마지막 문장은 단순한 인용이라기보다, 자기 생애 안에 재앙이 오지 않는다는 점에 대한 내적 반응을 드러냅니다.
  chosen_reading: 「그리고 그는 말했습니다.」로 시작해 뒤의 문장을 직접 화법으로 유지하되, 내용은 히스기야의 자기 시대 중심의 반응으로 읽히게 했습니다.
  alternative_readings:
  - 모두 직접 화법으로 처리하는 방식
  - 해설적 문장으로 바꾸어 '그는 속으로 생각했습니다'를 넣는 방식
  rationale: 히브리어의 간결한 구조와 영어 POB의 해석을 함께 반영하면서, 본문이 지닌 도덕적 긴장—즉 말씀을 선하다고 인정하지만 관심은 자기 생애에 머무는 태도—를 흐리지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
