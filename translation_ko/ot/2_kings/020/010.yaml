  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְחִזְקִיָּ֔הוּ נָקֵ֣ל לַ/צֵּ֔ל לִ/נְט֖וֹת עֶ֣שֶׂר מַעֲל֑וֹת לֹ֣א כִ֔י יָשׁ֥וּב הַ/צֵּ֛ל אֲחֹרַנִּ֖ית עֶ֥שֶׂר מַעֲלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/010.yaml
  text: And Hezekiah said, “It is an easy thing for the shadow to stretch forward ten steps. No, but let the shadow go back ten steps.”
  footnotes:
  - marker: a
    text: Or 'ten degrees.' The Hebrew word means 'steps' or 'ascents' and may refer to the steps or gradations of Ahaz's shadow device.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 말했습니다. 「그림자가 앞으로 십 단계 늘어나는 것은 쉬운 일입니다. 아니오, 오히려 그림자가 십 단계 뒤로 물러나게 하십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָקֵל
  english_pob_choice: it is an easy thing
  chosen_korean: 쉬운 일입니다
  alternatives_korean:
  - 가벼운 일입니다
  - 쉽습니다
  lexicon: HALOT
  rationale: ‘쉽다/쉬운 일’이 히브리어의 용이함과 평가적 뉘앙스를 현대 한국어로 자연스럽게 옮깁니다.
- source_word: לַצֵּל / הַצֵּל
  english_pob_choice: the shadow
  chosen_korean: 그림자
  alternatives_korean:
  - 해그림자
  - 그림자
  lexicon: HALOT
  rationale: 문맥상 계단/장치 위에서 움직이는 빛의 그림자를 가리키므로, 자연스러운 표준어인 ‘그림자’로 옮겼습니다.
- source_word: לִנְטוֹת
  english_pob_choice: to stretch forward
  chosen_korean: 앞으로 늘어나는
  alternatives_korean:
  - 앞으로 뻗는
  - 앞으로 길어지는
  lexicon: HALOT
  rationale: נטה의 ‘늘이다/펴다’ 의미를 살리면서, 그림자의 진행을 한국어로 가장 무리 없이 표현했습니다.
- source_word: מַעֲלוֹת
  english_pob_choice: steps
  chosen_korean: 십 단계
  alternatives_korean:
  - 열 계단
  - 열 걸음
  lexicon: HALOT
  rationale: 히브리어의 ‘steps/ascents’를 살려 본문에는 ‘단계’를 두고, 전통적 ‘degrees’ 가능성은 본문 주석으로 옮기지 않았습니다.
- source_word: לֹא כִּי
  english_pob_choice: No, but
  chosen_korean: 아니오, 오히려
  alternatives_korean:
  - 아니요, 그러나
  - 아니라
  lexicon: HALOT
  rationale: 단순한 부정이 아니라 대조적 수정 요청이므로, ‘오히려’로 문맥의 전환을 분명하게 했습니다.
- source_word: יָשׁוּב הַצֵּל אֲחֹרַנִּית
  english_pob_choice: let the shadow go back
  chosen_korean: 그림자가 십 단계 뒤로 물러나게 하십시오
  alternatives_korean:
  - 그림자가 십 단계 뒤로 가게 하십시오
  - 그림자가 십 단계 뒤로 돌아가게 하십시오
  lexicon: HALOT
  rationale: 요청형 의미를 살려 ‘~하게 하십시오’로 번역했고, ‘뒤로 물러나게’가 ‘go back/turn back’의 방향성을 가장 분명히 드러냅니다.
