base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/008.yaml
  text: And Hezekiah said to Isaiah[a], “What is the sign that Yahweh will heal me and that I will go up to the house of Yahweh on the third day?”
  footnotes:
  - marker: a
    text: Or “the temple of the LORD.” Literally, “the house of the LORD.”
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 이사야에게 말했습니다. “야훼께서 저를 고쳐 주시고, 사흘째 되는 날에 제가 야훼의 집으로 올라갈 것이라는 표적이 무엇입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전’. 문자적으로 ‘야훼의 집’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר חִזְקִיָּהוּ אֶל יְשַׁעְיָהוּ
  english_pob_choice: And Hezekiah said to Isaiah
  chosen_korean: 히스기야가 이사야에게 말했습니다
  alternatives_korean:
  - 그리고 히스기야가 이사야에게 말했습니다
  - 히스기야가 이사야에게 이르렀습니다
  lexicon: WLC; 고유명사 표준 음역
  rationale: 서사 흐름의 와우 연속형을 한국어에서는 자연스러운 서술 과거로 옮기되, 직역투를 피하면서 발화 동사를 분명히 했습니다.
- source_word: מָה אוֹת
  english_pob_choice: What is the sign
  chosen_korean: 표적이 무엇입니까
  alternatives_korean:
  - 징조가 무엇입니까
  - 증거가 무엇입니까
  lexicon: HALOT
  rationale: אוֹת는 확증을 주는 표지로서 성경 한국어에서 ‘표적’이 가장 직접적이며, ‘징조’보다 신적 확인의 뉘앙스를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: 사본의 신명사는 본문에서 인격적 고유명으로 드러나므로, 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: יִרְפָּא לִי
  english_pob_choice: will heal me
  chosen_korean: 저를 고쳐 주시고
  alternatives_korean:
  - 저를 치료하시고
  - 저를 낫게 하시고
  lexicon: HALOT
  rationale: 동사 רפא의 치유 의미를 현대 한국어의 자연스러운 존대 표현으로 살리되, 목적어 앞의 לִי를 ‘저를’로 풀어 옮겼습니다.
- source_word: וְעָלִיתִי בַּיּוֹם הַשְּׁלִישִׁי בֵּית יְהוָה
  english_pob_choice: and that I will go up to the house of Yahweh on the third day
  chosen_korean: 사흘째 되는 날에 제가 야훼의 집으로 올라가게 될 것
  alternatives_korean:
  - 삼일째에 제가 야훼의 집으로 올라가게 될 것
  - 사흘째 되는 날에 제가 야훼의 집에 올라가게 될 것
  lexicon: HALOT
  rationale: ‘올라가다’는 예루살렘 성전/성소로의 상승 관용을 보존하며, ‘야훼의 집’은 본문의 직역적 표현을 유지합니다.
theological_decisions:
- issue: ‘야훼의 집’의 번역 유지
  chosen_reading: ‘하나님의 집’이나 ‘성전’으로 풀지 않고 ‘야훼의 집’으로 직역했습니다.
  alternative_readings:
  - 성전
  - 하나님의 집
  rationale: 히브리어의 בית יהוה는 단순한 장소 명칭이 아니라 언약 სახელ의 결합 표현이므로, 본문이 가진 신명사적 강조를 보존하는 편이 더 원문충실적입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
