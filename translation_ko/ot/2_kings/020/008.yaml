translation:
  language: ko
  text: 히스기야가 이사야에게 말했습니다. “야훼께서 저를 고쳐 주시고 사흘째 되는 날에 제가 야훼의 집으로 올라가게 될 것이라는 표적이 무엇입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 집’은 문자적으로는 ‘야훼의 집’이며, 문맥상 성전/성소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר חִזְקִיָּהוּ אֶל יְשַׁעְיָהוּ
  english_pob_choice: And Hezekiah said to Isaiah
  chosen_korean: 히스기야가 이사야에게 말했습니다
  alternatives_korean:
  - 그리고 히스기야가 이사야에게 말했습니다
  - 히스기야가 이사야에게 이르렀습니다
  lexicon: WLC; 고유명사 표준 음역
  rationale: 서사 흐름의 와우 연속형을 한국어에서는 자연스러운 서술 과거로 옮기되, 직역투를 피하면서 발화 동사를 분명히 했습니다.
- source_word: מָה אוֹת
  english_pob_choice: What is the sign
  chosen_korean: 표적이 무엇입니까
  alternatives_korean:
  - 징조가 무엇입니까
  - 증거가 무엇입니까
  lexicon: HALOT
  rationale: אוֹת는 확증을 주는 표지로서 성경 한국어에서 ‘표적’이 가장 직접적이며, ‘징조’보다 신적 확인의 뉘앙스를 잘 살립니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
