  lexicon: HALOT
  rationale: דָּבָר는 예언 공식에서 단순한 ‘말’보다 선포된 신적 계시를 가리키므로, 한국어 성경 어휘로 가장 무게가 있는 ‘말씀’을 선택했습니다.
- source_word: יְהוָה
