  lexicon: HALOT
  rationale: אֶל은 발화의 도착 대상을 나타내므로 한국어의 여격 조사 ‘-에게’가 가장 자연스럽고 정확합니다.
- source_word: שְׁמַע
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으시오
