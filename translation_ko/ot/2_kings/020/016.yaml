  rationale: 소스의 신명 YHWH를 POB 기준에 따라 ‘야훼’로 직접 옮겨, 전통적 대체어를 쓰지 않고 고유 이름을 보존했습니다.
theological_decisions:
- issue: 예언적 명령문의 어조
  chosen_reading: 합쇼체 명령형 ‘들으십시오’로 예언자의 권위와 청중을 향한 직접 호소를 보존했습니다.
  alternative_readings:
  - ‘들어라’로 더 직설적으로 옮김
  - ‘들으시오’로 중간 높임을 사용
  rationale: 히브리어 명령형은 짧고 단호하지만, 한국어 본문은 현대 공용역의 품위를 유지해야 하므로 공손한 명령형을 선택했습니다.
  doctrine_reference: Korean style / prophetic register
