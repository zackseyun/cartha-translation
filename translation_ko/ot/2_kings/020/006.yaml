  text: וְ/הֹסַפְתִּ֣י עַל יָמֶ֗י/ךָ חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּ/מִ/כַּ֤ף מֶֽלֶךְ אַשּׁוּר֙ אַצִּ֣ילְ/ךָ֔ וְ/אֵ֖ת הָ/עִ֣יר הַ/זֹּ֑את וְ/גַנּוֹתִי֙ עַל הָ/עִ֣יר הַ/זֹּ֔את לְמַֽעֲנִ֔/י וּ/לְמַ֖עַן דָּוִ֥ד עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/006.yaml
  text: And I will add fifteen years to your life[a], and I will deliver you and this city from the hand of the king of Assyria[b], and I will defend this city for my own sake and for the sake of my servant David.
  footnotes:
  - marker: a
    text: Or 'from the power of the king of Assyria'; literally 'from the hand of the king of Assyria.'
    reason: lexical_alternative
  - marker: b
    text: Or 'I will protect this city.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 네 날에 열다섯 해를 더하고, 너와 이 성을 앗수르 왕의 손에서 건져 내며, 내 이름을 위하여, 또 내 종 다윗을 위하여 이 성을 보호하겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘네 날들 위에’의 관용을 살린 표현입니다.
    reason: source_note
  - marker: b
    text: ‘손’은 여기서 권세나 지배를 가리키는 히브리어 관용어입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֹסַפְתִּי עַל יָמֶיךָ
  english_pob_choice: I will add fifteen years to your life
  chosen_korean: 네 날에 열다섯 해를 더하고
  alternatives_korean:
  - 네 수명에 열다섯 해를 더하고
  - 네 생애에 열다섯 해를 더하고
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘네 날들 위에’이지만, 한국어에서는 ‘날들’보다 생애 연장의 뜻이 분명한 ‘네 날에 … 더하다’가 원문 이미지와 의미를 함께 살립니다.
- source_word: וּמִכַּף מֶלֶךְ אַשּׁוּר
  english_pob_choice: from the hand of the king of Assyria
  chosen_korean: 앗수르 왕의 손에서 건져 내며
  alternatives_korean:
  - 앗수르 왕의 손에서 구하며
  - 앗수르 왕의 권세에서 건져 내며
  lexicon: HALOT
  rationale: ‘손’은 권세·지배의 관용어이므로 이를 살리되, 한국어에서는 구출 행위를 분명히 드러내는 ‘건져 내다’를 택했습니다.
- source_word: וְגַנּוֹתִי עַל הָעִיר הַזֹּאת
  english_pob_choice: and I will defend this city
  chosen_korean: 이 성을 보호하겠습니다
  alternatives_korean:
  - 이 성을 지키겠습니다
  - 이 성을 방어하겠습니다
  lexicon: HALOT
  rationale: גנה는 덮어 보호하다의 뜻이어서, 포위 상황에 맞는 ‘보호하다’가 가장 자연스럽고 원문의 보호 행위를 잘 드러냅니다.
- source_word: לְמַעֲנִי וּלְמַעַן דָּוִד עַבְדִּי
  english_pob_choice: for my own sake and for the sake of my servant David
  chosen_korean: 내 이름을 위하여, 또 내 종 다윗을 위하여
  alternatives_korean:
  - 나를 위하여, 또 내 종 다윗을 위하여
  - 내 자신의 खातिर...
  lexicon: HALOT
  rationale: ‘내 이름을 위하여’는 하나님의 자기 관련 목적을 한국어 성경체에서 분명히 드러내며, ‘내 종 다윗’을 그대로 유지해 언약적 근거를 보존합니다.
theological_decisions:
- issue: 하나님이 성을 보호하시는 동기
  chosen_reading: 하나님은 자신의 이름을 위하여, 또 다윗과의 관계를 고려하여 예루살렘을 보호하십니다.
  alternative_readings:
  - 단순히 하나님이 성을 지키겠다고 하신 것으로만 읽기
  - 다윗 개인의 공로로 읽기
  rationale: 원문은 보호의 이유를 하나님의 자기 관련성(לְמַעֲנִי)과 ‘내 종 다윗’에 둡니다. 이를 그대로 살려 문맥의 언약적·신학적 긴장을 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
