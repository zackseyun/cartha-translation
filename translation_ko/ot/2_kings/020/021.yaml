  text: וַ/יִּשְׁכַּ֥ב חִזְקִיָּ֖הוּ עִם אֲבֹתָ֑י/ו וַ/יִּמְלֹ֛ךְ מְנַשֶּׁ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/021.yaml
  text: And Hezekiah lay down with his fathers[a], and Manasseh his son became king in his place.
  footnotes:
  - marker: a
    text: Or 'slept with his fathers.' The Hebrew uses a standard royal death formula.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 그의 조상들과 함께 누우니, 그의 아들 므낫세가 그를 대신하여 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누우니
  alternatives_korean:
  - 잠들었으니
  - 죽었으니
  lexicon: HALOT
  rationale: ‘누우다’는 왕의 죽음/장사에 쓰이는 히브리어 관용구를 비교적 직접적으로 살리면서, ‘죽다’로 평서화하는 과도한 해석을 피합니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 왕의 죽음 공식에서의 관용적 표현을 한국어에서 자연스럽게 풀어, 혈연적 ‘아버지들’보다 의미가 분명한 ‘조상들’로 옮겼습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king ... in his place
  chosen_korean: 그를 대신하여 왕이 되었습니다
  alternatives_korean:
  - 그 자리에 왕이 되었습니다
  - 그의 뒤를 이어 왕이 되었습니다
  lexicon: HALOT
  rationale: שׁכב-מלך의 계승 공식에서 תחתיו는 단순한 시간적 ‘뒤에’보다 ‘대신하여/그 자리를 대신해’의 의미가 강하므로, 즉위의 교체 관계를 분명히 했습니다.
- source_word: מְנַשֶּׁה
  english_pob_choice: Manasseh
  chosen_korean: 므낫세
  alternatives_korean:
  - 만세
  - 마나세
  lexicon: 현대 외래어 표기 관행
  rationale: 고유명사는 한국어 성경에서 널리 통용되는 ‘므낫세’를 채택했습니다.
