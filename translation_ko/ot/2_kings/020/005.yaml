  text: שׁ֣וּב וְ/אָמַרְתָּ֞ אֶל חִזְקִיָּ֣הוּ נְגִיד עַמִּ֗/י כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵי֙ דָּוִ֣ד אָבִ֔י/ךָ שָׁמַ֨עְתִּי֙ אֶת תְּפִלָּתֶ֔/ךָ רָאִ֖יתִי אֶת דִּמְעָתֶ֑/ךָ הִנְ/נִי֙ רֹ֣פֶא לָ֔/ךְ בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י תַּעֲלֶ֖ה בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/005.yaml
  text: 'Go back and say to Hezekiah[a], the leader of my people, ‘Thus says Yahweh, the God of David your father: I have heard your prayer; I have seen your tears. Look, I am healing you. On the third day you will go up to the house of Yahweh.’'
  footnotes:
  - marker: a
    text: Or, 'I will heal you.' The Hebrew reads more literally, 'Look, I am healing you,' using a participle that can express imminent action.
    reason: lexical_alternative
translation:
  language: ko
  text: 다시 돌아가 내 백성의 지도자인 히스기야에게 이렇게 말씀하십시오. ‘네 조상 다윗의 하나님 야훼께서 이렇게 말씀하십니다. 나는 네 기도를 들었고 네 눈물을 보았다. 보라, 내가 너를 낫게 한다.[a] 셋째 날에 너는 야훼의 집에 올라갈 것이다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너를 낫게 할 것이다.’ 히브리어는 직역하면 ‘보라, 내가 너를 낫게 하는 이다/낫게 하고 있다’에 가까운 분사 표현이며, 임박한 행위를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּב וְאָמַרְתָּ
  english_pob_choice: Go back and say
  chosen_korean: 다시 돌아가 … 말하십시오
  alternatives_korean:
  - 돌아가 … 말하시오
  - 돌아가 … 전하십시오
  lexicon: HALOT
  rationale: 히브리어의 연속 명령을 자연스러운 현대 한국어 명령으로 옮기되, 예언 전달 장면의 직접성을 살리기 위해 ‘말하십시오’를 택했습니다.
- source_word: נְגִיד עַמִּי
  english_pob_choice: the leader of my people
  chosen_korean: 내 백성의 지도자
  alternatives_korean:
  - 내 백성의 통치자
  - 내 백성의 군주
  lexicon: HALOT
  rationale: נָגִיד는 지배자보다 ‘지도자/통치자’의 의미가 중심이므로, 현대 독자가 이해하기 쉬운 ‘지도자’로 옮겼습니다.
- source_word: הִנְנִי רֹפֶא לָךְ
  english_pob_choice: Look, I am healing you
  chosen_korean: 보아라, 내가 너를 고치고 있다
  alternatives_korean:
  - 보아라, 내가 너를 고칠 것이다
  - 보아라, 내가 너를 낫게 한다
  lexicon: HALOT
  rationale: הִנְנִי + 분사는 임박하고 확정적인 행동을 드러내므로, POB의 문맥상 판단을 따라 현재진행형 느낌의 ‘고치고 있다’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 직역적 표현을 유지해 히브리어의 문구를 보존했고, 본 프로젝트의 기본 표기인 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: יהוה(YHWH) 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명표는 직접적으로 יהוה이므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨 언약적 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רֹפֶא לָךְ의 시제/상
  chosen_reading: 내가 너를 고치고 있다
  alternative_readings:
  - 내가 너를 고칠 것이다
  - 내가 너를 낫게 한다
  rationale: 분사형이 단순 미래보다 임박성과 진행성을 함께 띠므로, ‘고치고 있다’로 옮겨 하나님 선언의 현재적 효력을 살렸습니다.
  doctrine_reference: DOCTRINE.md §3 Preserve theological tension rather than resolve it
