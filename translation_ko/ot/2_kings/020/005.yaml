- from: 다시 돌아가 히스기야 곧 내 백성의 지도자에게 말하십시오. 「야훼께서 이렇게 말씀하십니다. ‘너의 조상 다윗의 하나님인 내가 너의 기도를 들었고, 너의 눈물을 보았다. 보아라, 내가 너를 고치고 있다. 셋째 날에 너는 야훼의 집으로 올라갈 것이다.’」[a]
  to: 다시 돌아가 내 백성의 지도자인 히스기야에게 이렇게 말씀하십시오. ‘네 조상 다윗의 하나님 야훼께서 이렇게 말씀하십니다. 나는 네 기도를 들었고 네 눈물을 보았다. 보라, 내가 너를 낫게 한다.[a] 셋째 날에 너는 야훼의 집에 올라갈 것이다.’
  rationale: 치유 약속의 분사형을 한국어 진행형으로 단정하지 않고, 현재적·임박한 선언으로 읽을 수 있는 ‘낫게 한다’로 조정했습니다. 미래적 이해는 각주에 남겨 원문의 상적 여지를 보존했습니다. 또한 하나님의 호칭을 메신저 공식 안에 자연스럽게 배치하고, 각주 표지를 해당 표현에 연결했습니다.
