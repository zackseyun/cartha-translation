source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם חָלָ֥ה חִזְקִיָּ֖הוּ לָ/מ֑וּת וַ/יָּבֹ֣א אֵ֠לָי/ו יְשַׁעְיָ֨הוּ בֶן אָמ֜וֹץ הַ/נָּבִ֗יא וַ/יֹּ֨אמֶר אֵלָ֜י/ו כֹּֽה אָמַ֤ר יְהוָה֙ צַ֣ו לְ/בֵיתֶ֔/ךָ כִּ֛י מֵ֥ת אַתָּ֖ה וְ/לֹ֥א תִֽחְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/001.yaml
  text: 'In those days Hezekiah became sick, near to death. And Isaiah son of Amoz the prophet[a] came to him and said to him, “Thus says Yahweh: Set your house in order, for you are about to die; you will not live.”'
  footnotes:
  - marker: a
    text: Or, more literally, “for you are dying” or “for you are dead”; the Hebrew expression announces certain, imminent death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 히스기야가 병들어 죽게 되었습니다. 아모스의 아들인 예언자 이사야가 그에게 와서 말했습니다. 「야훼께서 이렇게 말씀하십니다. 당신의 집안을 정리하십시오. 당신은 죽게 되어 있습니다[a]. 당신은 살지 못할 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단순한 미래가 아니라, 임박하고 확정된 죽음을 선포하는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그 무렵
  - 그 시절에
  lexicon: HALOT
  rationale: 서사 도입의 관용구로, 현대 한국어에서 자연스럽고 간결하게 시간 배경을 제시합니다.
- source_word: חָלָה לָמוּת
  english_pob_choice: became sick, near to death
  chosen_korean: 병들어 죽게 되었습니다
  alternatives_korean:
  - 병들어 거의 죽을 지경이었습니다
  - 병들어 죽을 만큼 아팠습니다
  lexicon: HALOT
  rationale: 히브리어의 병듦과 임박한 죽음을 함께 드러내면서도, 현대 합쇼체에서 직접적이고 읽기 쉬운 표현으로 옮겼습니다.
- source_word: יְשַׁעְיָהוּ בֶן אָמ֜וֹץ הַנָּבִיא
  english_pob_choice: Isaiah son of Amoz the prophet
  chosen_korean: 아모스의 아들 이사야 예언자
  alternatives_korean:
  - 예언자 이사야, 아모스의 아들
  - 아모스의 아들 예언자 이사야
  lexicon: HALOT
  rationale: 히브리어의 친족 표지와 동격 구조를 살려 ‘아모스의 아들 이사야’로 옮기고, נביא는 직함으로서 ‘예언자’를 유지했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 말씀하셨습니다
  - 야훼의 말씀이 이렇습니다
  lexicon: HALOT
  rationale: 예언자적 사자 공식으로서 현재 시제의 권위 있는 전달을 살리되, 프로젝트 기본값에 따라 신명은 ‘야훼’로 옮겼습니다.
- source_word: צַו לְבֵיתֶךָ
  english_pob_choice: Set your house in order
  chosen_korean: 당신의 집안을 정리하십시오
  alternatives_korean:
  - 집안일을 정리하십시오
  - 집안을 정돈하십시오
  lexicon: HALOT
  rationale: 임종을 앞두고 가문/가정의 일을 정리하라는 관용적 명령을 한국어로 자연스럽게 풀되, 명령의 긴급성을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주
  - 주님
  rationale: 본문의 고유신명은 직함으로 대체하지 않고 음역형 ‘야훼’를 사용하여, 언약적 이름이라는 स्रोत의 구별을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 직접 인용 안의 경고문체
  chosen_reading: 「…당신은 죽게 되어 있습니다. 당신은 살지 못할 것입니다.」
  alternative_readings:
  - 「…당신은 반드시 죽습니다. 살아남지 못합니다.」
  - 「…당신은 죽을 것입니다. 살지 못할 것입니다.」
  rationale: 히브리어의 단정적 임박성과 확정성을 살리기 위해 예언 선포를 완곡하게 누그러뜨리지 않았습니다.
  doctrine_reference: '번역 원칙: 원문의 확정적 선언(force of certainty) 보존'
