  terminology: ‘야훼’, ‘온전한 마음’, ‘주님 보시기에 선한 일’은 적절합니다. ‘신실함’은 אֱמֶת의 관계적·윤리적 의미를 자연스럽게 전달하며, ‘온전한 마음’은 שָׁלֵם을 무리하게 무죄성으로 만들지 않습니다.
