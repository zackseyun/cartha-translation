id: 2KI.20.3
reference: 2 Kings 20:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָנָּ֣ה יְהוָ֗ה זְכָר נָ֞א אֵ֣ת אֲשֶׁ֧ר הִתְהַלַּ֣כְתִּי לְ/פָנֶ֗י/ךָ בֶּֽ/אֱמֶת֙ וּ/בְ/לֵבָ֣ב שָׁלֵ֔ם וְ/הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עָשִׂ֑יתִי וַ/יֵּ֥בְךְּ חִזְקִיָּ֖הוּ בְּכִ֥י גָדֽוֹל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/003.yaml
  text: “Please[a], O Yahweh, remember, I pray, how I have walked before you in faithfulness and with a whole heart[b], and have done what is good in your eyes.” And Hezekiah wept bitterly.
  footnotes:
  - marker: a
    text: Or “in truth.” The Hebrew can denote truthfulness or faithfulness; here it refers to Hezekiah’s faithful conduct before God.
    reason: lexical_alternative
  - marker: b
    text: Or “with an undivided heart.”
    reason: lexical_alternative
translation:
  language: ko
  text: 「부디[a], 야훼여, 제가 신실함과 온전한 마음으로[b] 주님 앞에서 살아왔으며, 주님 보시기에 선한 일을 행한 것을 기억해 주십시오」라고 하였습니다. 히스기야는 몹시 울었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “간청합니다.” אָנָּה는 기도에서 드리는 간절한 청원 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “나뉘지 않은 마음으로.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָּה
  english_pob_choice: Please
  chosen_korean: 부디
  alternatives_korean:
  - 제발
  - 간청하건대
  lexicon: HALOT
  rationale: 기도문의 간청 어감을 현대 한국어로 자연스럽게 살리면서, 합쇼체 본문에 어울리는 정중한 청유로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 고유한 신명은 프로젝트 기본값대로 ‘야훼’로 옮겨, 호칭이 아니라 하나님의 이름이라는 점을 드러냈습니다.
- source_word: בֶּאֱמֶת
  english_pob_choice: in faithfulness
  chosen_korean: 진실함으로
  alternatives_korean:
  - 진리로
  - 성실함으로
  - 참되게
  lexicon: HALOT
  rationale: 이 표현은 단순한 사실적 ‘진리’보다 하나님 앞에서의 신실하고 정직한 행실을 가리키므로, POB의 해석을 따라 ‘진실함’으로 옮겼습니다.
- source_word: וּבְלֵבָב שָׁלֵם
  english_pob_choice: with a whole heart
  chosen_korean: 온전한 마음으로
  alternatives_korean:
  - 완전한 마음으로
  - 일편단심의 마음으로
  - 나뉘지 않은 마음으로
  lexicon: HALOT
  rationale: שָׁלֵם의 핵심인 온전함·분열되지 않은 충성을 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘온전한 마음’으로 옮겼습니다.
- source_word: וַיֵּבְךְּ ... בְּכִי גָדוֹל
  english_pob_choice: And Hezekiah wept bitterly
  chosen_korean: 몹시 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 격하게 울었습니다
  - 쓰라리게 울었습니다
  lexicon: HALOT
  rationale: 여기서 גָּדוֹל은 울음의 강도를 강조하므로, 영어 POB의 해석을 따르되 원문이 직접 말하지 않는 감정색을 덧붙이지 않기 위해 ‘몹시’로 강도를 살렸습니다.
theological_decisions:
- issue: 히스기야의 자기 변호적 기도에서 행위 언어를 어떻게 옮길지
  chosen_reading: “주님 보시기에 선한 일을 행했습니다”로 옮겨, 하나님이 평가의 기준이심을 드러냈습니다.
  alternative_readings:
  - “주님 눈에 좋은 일을 했습니다”
  - “주님 보시기에 옳은 일을 했습니다”
  rationale: 히브리어 관용구는 인간 기준의 선함이 아니라 하나님이 판단하시는 선을 말하므로, POB의 해석을 따라 신학적 기준점을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: ‘진실함’의 신학적 중첩
  chosen_reading: ‘진실함’은 단순 사실 진술이 아니라 언약적 신실함과 정직성을 함께 포함하는 표현으로 처리했습니다.
  alternative_readings:
  - ‘진리’
  - ‘성실함’
  rationale: 본문은 히스기야의 전인격적 충성을 강조하므로, 행위의 참됨과 신실함을 함께 드러내는 번역이 적절합니다.
  doctrine_reference: DOCTRINE.md Contested terms — אֱמֶת
