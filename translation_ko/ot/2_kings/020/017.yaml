reference: 2 Kings 20:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הִנֵּה֮ יָמִ֣ים בָּאִים֒ וְ/נִשָּׂ֣א כָּל אֲשֶׁ֣ר בְּ/בֵיתֶ֗/ךָ וַ/אֲשֶׁ֨ר אָצְר֧וּ אֲבֹתֶ֛י/ךָ עַד הַ/יּ֥וֹם הַ/זֶּ֖ה בָּבֶ֑לָ/ה לֹֽא יִוָּתֵ֥ר דָּבָ֖ר אָמַ֥ר יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/017.yaml
  text: Look, days are coming when all that is in your house, and what your fathers have stored up until this day, will be carried to Babylon. Not a thing will be left, says the LORD.
translation:
  language: ko
  text: 보십시오. 날들이 오고 있으며, 네 집에 있는 모든 것과 네 조상들이 이 날까지 저장해 둔 것이 바빌론으로 옮겨질 것입니다. 남는 것은 하나도 없을 것이라고 야훼께서 말씀하십니다.[a][b][c]
  philosophy: formal
  footnotes:
  - marker: a
    text: «Look»은 히브리어 הִנֵּה의 주의 환기 기능을 살린 POB의 관례적 대응입니다.
    reason: source_note
  - marker: b
    text: 「바빌론」은 현대 외래어 표기에 따른 지명 표기입니다.
    reason: cultural_note
  - marker: c
    text: POB는 이 절의 יְהוָה를 the LORD로 옮겼으나, 히브리어 원문 표지를 따라 본문에서는 야훼로 적었습니다.
    reason: theological_note
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: הִנֵּה
  rationale: 예언 선포의 주의를 환기하는 감탄사로 이해하여, 현대 한국어에서 공손하고 즉각적인 호명감을 주는 「보십시오」로 옮겼습니다.
- source_word: יָמִים בָּאִים
  english_pob_choice: days are coming
  chosen_korean: 날들이 오고 있으며
  alternatives_korean:
  - 날들이 올 것이며
  - 때가 오고 있으며
  lexicon: יָמִים בָּאִים
  rationale: 직역적 미래 표지를 유지하되 문장 흐름을 자연스럽게 하기 위해 진행형으로 옮겼습니다.
- source_word: וְנִשָּׂא ... בָּבֶלָה
  english_pob_choice: will be carried to Babylon
  chosen_korean: 바빌론으로 옮겨질 것입니다
  alternatives_korean:
  - 바빌론으로 끌려갈 것입니다
  - 바빌론으로 실려 갈 것입니다
  lexicon: נשא
  rationale: 수동형의 강제적 이동을 살리면서도 한국어에서 가장 무난한 결과 표현인 「옮겨지다」를 사용했습니다. 지명은 현대 표기법에 따라 바빌론으로 적었습니다.
- source_word: לֹא יִוָּתֵר דָּבָר
  english_pob_choice: Not a thing will be left
  chosen_korean: 남는 것은 하나도 없을 것
  alternatives_korean:
  - 한 가지도 남지 않을 것
  - 남을 것은 아무것도 없을 것
  lexicon: נותר
  rationale: 히브리어의 완전한 부재를 강조하는 표현을 자연스러운 한국어 부정 구조로 재현했습니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: יהוה
  rationale: 이 본문은 히브리어 מקור 텍스트의 직접 발화 종결이므로, POB 기본 규범에 따라 신명 표지를 「야훼」로 렌더링했습니다.
theological_decisions:
- issue: 예언의 확정성과 심판의 불가피성
  chosen_reading: 미래 사건을 단순한 가능성이 아니라 확정된 선언으로 읽어, 「오고 있으며」「옮겨질 것입니다」로 예언적 확실성을 유지했습니다.
  alternative_readings:
  - 완곡한 예고로 처리
  - 현재적 가능성으로 약화
  rationale: 왕하 20:17의 히브리어와 POB 영문 모두 임박한 확정성을 드러내므로, 이를 약화하지 않는 것이 본문의 경고 기능을 보존합니다.
  doctrine_reference: 예언적 선언의 확실성
