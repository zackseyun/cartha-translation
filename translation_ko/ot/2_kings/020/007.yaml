  text: וַ/יֹּ֣אמֶר יְשַֽׁעְיָ֔הוּ קְח֖וּ דְּבֶ֣לֶת תְּאֵנִ֑ים וַ/יִּקְח֛וּ וַ/יָּשִׂ֥ימוּ עַֽל הַ/שְּׁחִ֖ין וַ/יֶּֽחִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/020/007.yaml
  text: And Isaiah said[a], “Take a cake of figs.” So they took it and laid it on the boil[c][b], and he recovered.
  footnotes:
  - marker: a
    text: Or “a fig cake” or “a pressed mass of figs.”
    reason: lexical_alternative
  - marker: b
    text: Or “the inflamed sore” or “the ulcer.”
    reason: lexical_alternative
  - marker: c
    text: Literally “and he lived”; in context, this means he recovered.
    reason: lexical_alternative
translation:
  language: ko
  text: 이사야가 말했습니다[a]. “무화과로 만든 반죽을 가져오십시오.” 그들이 그것을 가져다가 부스럼[b] 위에 놓자, 그가 회복되었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무화과 떡” 또는 “무화과를 눌러 만든 덩이”입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “염증이 난 상처” 또는 “궤양”입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 “그가 살았다”입니다. 문맥상 여기서는 회복했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁעְיָהוּ
  english_pob_choice: Isaiah
  chosen_korean: 이사야
  alternatives_korean:
  - 이사야야
  lexicon: 고유명사 음역
  rationale: 예언자 이름은 한국어 성경에서 널리 알려진 표기를 따르는 것이 가장 자연스럽습니다.
- source_word: דְּבֶלֶת תְּאֵנִים
  english_pob_choice: a cake of figs
  chosen_korean: 무화과로 만든 반죽
  alternatives_korean:
  - 무화과 떡
  - 무화과 케이크
  - 무화과로 만든 덩이
  lexicon: HALOT
  rationale: דְּבֶלֶת는 눌러 만든 덩어리/반죽의 뜻이 강하므로, 단순히 과일 종류만 살린 표현보다 ‘반죽’이 압착된 질감을 더 분명하게 드러냅니다.
- source_word: הַשְּׁחִין
  english_pob_choice: the boil
  chosen_korean: 부스럼
  alternatives_korean:
  - 종기
  - 염증난 상처
  - 궤양
  lexicon: HALOT
  rationale: 문맥상 피부 병변을 가리키므로 ‘부스럼’이 간결하면서도 넓게 해당하고, POB의 ‘boil’이 가진 병변성도 잘 반영합니다.
- source_word: וַיֶּחִי
  english_pob_choice: and he recovered
  chosen_korean: 회복되었습니다
  alternatives_korean:
  - 그가 살았습니다
  - 그가 소생했습니다
  - 그가 낫게 되었습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘살다’이지만 치유 서술에서는 병에서 나아 건강을 되찾는 뜻이므로, ‘회복되었습니다’가 자연스럽고 본문 의도를 잘 전달합니다.
theological_decisions:
- issue: וַיֶּחִי의 의미를 문자적으로 옮길지, 치유 결과로 옮길지
  chosen_reading: 신체적 병에서의 회복으로 번역합니다.
  alternative_readings:
  - 그가 살았습니다
  - 그가 소생했습니다
  rationale: 문맥이 보일에 약을 바르고 난 뒤의 치유 장면이므로, 생물학적 ‘살다’보다 병이 나은 상태를 드러내는 번역이 본문의 의도를 더 정확히 전달합니다.
  doctrine_reference: '번역 원칙: optimal equivalence; 본문의 평이한 의미를 보존하되 과도한 신학적 확대는 피함.'
