  source_fidelity: 히브리어는 ‘그가 자기 얼굴을 벽을 향하여 돌리고 야훼께 기도하여 말하였다’라는 연속 서술입니다. 초안의 의미는 대체로 충실하지만, ‘벽으로’는 방향을 나타내는 אֶל의 뜻을 조금 덜 분명하게 나타내며, 명시되지 않은 고유명사 ‘히스기야’를 보충했습니다.
  naturalness: ‘얼굴을 벽 쪽으로 돌리고’와 ‘기도하며 이렇게 말했습니다’는 현대 표준 한국어 합쇼체에서 자연스럽고, 다음 절의 기도 인용을 매끄럽게 예고합니다.
  terminology: יְהוָה는 프로젝트 원칙에 따라 ‘야훼’로 옮기는 것이 적절합니다. 다만 기존 각주는 히브리어 본문 자체가 한국어 음역 ‘야훼’라고 적혀 있다는 인상을 주므로 정확하지 않으며, 이 절에서는 별도 각주가 필요하지 않습니다.
  issues:
