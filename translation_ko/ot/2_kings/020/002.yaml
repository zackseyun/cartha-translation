lexical_decisions:
- source_word: וַיַּסֵּב אֶת פָּנָיו אֶל הַקִּיר
  english_pob_choice: Then he turned his face to the wall
  chosen_korean: 얼굴을 벽으로 돌리고
  alternatives_korean:
  - 얼굴을 벽 쪽으로 돌리고
  - 얼굴을 벽을 향해 돌리고
  lexicon: HALOT
  rationale: 히브리어의 동작 묘사를 자연스러운 한국어로 옮기되, ‘얼굴’과 ‘벽’의 구체적 이미지를 살려 본문의 장면성을 유지했습니다.
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: and prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도하고
  - 기도하였고
  lexicon: HALOT
  rationale: 연속 동작을 보여 주는 서술 흐름을 한국어의 부사형으로 매끄럽게 반영했습니다.
- source_word: אֶל יְהוָה
  english_pob_choice: to Yahweh
  chosen_korean: 야훼께
  alternatives_korean:
  - 주님께
  - 여호와께
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 יהוה를 ‘야훼’로 옮기고, 전치사 אֶל은 여격 조사 ‘-께’로 자연스럽게 처리했습니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하여 이르되
  - 이르기를
  lexicon: HALOT
  rationale: 다음 절의 직접 인용을 여는 표지로 기능하므로, 현대 한국어 서술문에서는 ‘말했습니다’가 가장 읽기 자연스럽습니다.
theological_decisions:
