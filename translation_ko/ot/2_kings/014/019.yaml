  text: וַ/יִּקְשְׁר֨וּ עָלָ֥י/ו קֶ֛שֶׁר בִּ/ירוּשָׁלִַ֖ם וַ/יָּ֣נָס לָכִ֑ישָׁ/ה וַ/יִּשְׁלְח֤וּ אַֽחֲרָי/ו֙ לָכִ֔ישָׁ/ה וַ/יְמִתֻ֖/הוּ שָֽׁם׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/019.yaml
  text: And they conspired against him in Jerusalem[a], and he fled to Lachish; and they sent after him to Lachish and put him to death there.
  footnotes:
  - marker: a
    text: Or 'they sent in pursuit of him to Lachish.' The Hebrew literally says 'they sent after him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 예루살렘에서 그에게 음모를 꾸몄고, 그는 라기스로 도망했습니다. 그들은 그의 뒤를 따라 라기스로 사람을 보내어 거기에서 그를 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 뒤로’ 또는 ‘그의 뒤를 따라’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ עָלָיו קֶשֶׁר
  english_pob_choice: they conspired against him
  chosen_korean: 그에게 음모를 꾸몄고
  alternatives_korean:
  - 그를 상대로 모의를 꾸몄고
  - 그에게 반역을 꾸몄고
  lexicon: HALOT
  rationale: קשׁר/קֶשֶׁר의 정치적·적대적 결합을 살려, 자연스러운 현대 한국어의 ‘음모를 꾸미다’로 옮겼습니다.
- source_word: וַיָּנָס
  english_pob_choice: he fled
  chosen_korean: 도망했습니다
  alternatives_korean:
  - 도망갔습니다
  - 달아났습니다
  lexicon: HALOT
  rationale: 서술문 합쇼체에서 가장 직접적이고 자연스러운 동사로, 급박한 도피의 의미를 유지했습니다.
- source_word: לָכִישָׁה
  english_pob_choice: to Lachish
  chosen_korean: 라기스로
  alternatives_korean:
  - 라기시로
  - 라기스를 향해
  lexicon: standard proper noun usage
  rationale: 히브리어 방향격을 한국어 목적격·방향 부사격으로 자연스럽게 반영하고, 통용되는 성경 지명 형태인 ‘라기스’를 사용했습니다.
- source_word: וַיִּשְׁלְחוּ אַחֲרָיו
  english_pob_choice: they sent after him
  chosen_korean: 그의 뒤를 따라 라기스로 사람을 보내어
  alternatives_korean:
  - 그의 뒤를 따라 보냈고
  - 그를 추격하여 라기스로 보냈고
  lexicon: HALOT
  rationale: 히브리어의 간결한 표현을 살리되, ‘사람을 보내어’로 행위의 주체적 수단을 한국어에서 자연스럽게 보완했습니다.
- source_word: וַיְמִתֻהוּ
  english_pob_choice: put him to death
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그를 사형에 처했습니다
  - 그를 처형했습니다
  lexicon: HALOT
  rationale: 본문은 단순한 사망이 아니라 의도적 살해를 뜻하므로 ‘죽였습니다’로 직역해 행위의 직접성을 유지했습니다.
theological_decisions:
- issue: 연결 접속사와 서술 흐름
  chosen_reading: 히브리어 וְ/וַ-의 연속을 살려 ‘그리고’의 병렬 서술로 처리했습니다.
  alternative_readings:
  - 그러나로 전환하여 대비를 강조하는 읽기
  - 문장들을 분리해 사건의 긴박감을 높이는 읽기
  rationale: 원문은 대비보다 사건의 연속을 말하므로, 전승된 영어 POB의 수정 취지와 같이 중립적 병렬 흐름을 유지했습니다.
  doctrine_reference: 본문 의미 보존과 서술적 충실성
- issue: ‘사람을 보내어’의 보충 여부
  chosen_reading: 히브리어에서 생략된 목적어를 한국어에서 ‘사람을 보내어’로 최소한 보충했습니다.
  alternative_readings:
  - ‘뒤를 따라 보냈고’로 더 압축하는 읽기
  - 목적어를 드러내지 않고 ‘그의 뒤를 따라 보냈고’로 옮기는 읽기
  rationale: 한국어에서는 ‘보내다’의 목적어가 드러나지 않으면 어색할 수 있어, 원문의 의미를 넘지 않는 범위에서 최소 보충했습니다.
  doctrine_reference: 번역 투명성 및 문장 자연성
