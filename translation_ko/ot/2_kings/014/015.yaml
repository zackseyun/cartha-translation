    issue: 본문 첫머리의 ‘이제’
    rationale: וְיֶתֶר에는 접속사 ‘그리고/그런데’의 기능은 있으나 시간 부사 ‘이제’가 명시되어 있지 않습니다. 제공된 영어 POB의 최신 본문도 선행 ‘Now’를 제거했습니다.
  - severity: medium
    issue: 각주 표지 [a][b]가 문장 끝에 함께 배치됨
    rationale: '[a]는 아마샤와 ‘싸운’ 관계의 전치사 עִם에, [b]는 왕실 기록 문헌의 명칭에 각각 연결되어야 하므로 해당 어구 바로 뒤에 배치해야 합니다.'
  - severity: low
    issue: 각주 b의 내용이 대안 번역을 제시하지 않음
    rationale: ‘직역보다 관용적 뜻’을 설명하는 것만으로는 독자가 문헌 명칭의 번역 선택을 확인하기 어렵습니다. 대안 명칭을 제시하면 각주의 기능이 분명해집니다.
