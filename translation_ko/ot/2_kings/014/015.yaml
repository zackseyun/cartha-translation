reference: 2 Kings 14:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: Now the rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'fought against Amaziah king of Judah.' The Hebrew preposition is literally 'with,' but in this military context it can be rendered more explicitly as hostile opposition.
    reason: lexical_alternative
  - marker: b
    text: Or 'the book of the annals of the kings of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 여호아스의 남은 행적과 그가 행한 모든 일과 그의 힘, 그리고 그가 유다 왕 아마샤와 싸운 일은 이스라엘 왕들의 역대 기록책에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עִם은 문자적으로 ‘~와’이지만, 전투 문맥에서는 보통 ‘~을 대항하여’의 뜻이 됩니다.
    reason: lexical_alternative
  - marker: b
    text: ‘역대 기록책’은 히브리어의 직역보다 관용적 뜻을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts
  chosen_korean: 남은 행적
  alternatives_korean:
  - 나머지 행적
  - 남은 일들
  - 그 나머지 행적과 일들
  lexicon: HALOT
  rationale: 왕들의 전형적인 왕정 결산 공식이므로, ‘acts’를 자연스럽게 ‘행적’으로 옮겨 기록 요약의 성격을 살렸습니다.
- source_word: אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 행한 모든 일
  alternatives_korean:
  - 그가 한 모든 것
  - 그가 행한 일들
  lexicon: HALOT
  rationale: POB의 보완된 표현처럼, יחס절의 내용을 누락하지 않되 한국어에서는 중복을 피하고 ‘모든 일’로 담았습니다.
- source_word: וּגְבוּרָתוֹ
  english_pob_choice: and his might
  chosen_korean: 그의 힘
  alternatives_korean:
  - 그의 능력
  - 그의 용맹
  - 그의 무력
  lexicon: HALOT
  rationale: גְּבוּרָה는 단순한 근력보다 왕의 군사적 역량과 용맹을 아우르므로, 지나치게 해석하지 않는 ‘힘’을 택했습니다.
- source_word: וַאֲשֶׁר נִלְחַם עִם אֲמַצְיָהוּ מֶלֶךְ יְהוּדָה
  english_pob_choice: and how he fought with Amaziah king of Judah
  chosen_korean: 그리고 그가 유다 왕 아마샤와 싸운 일
  alternatives_korean:
  - 그리고 그가 유다 왕 아마샤와 싸운 것
  - 그리고 유다 왕 아마샤와 맞서 싸운 일
  lexicon: HALOT
  rationale: עִם을 문자적으로 ‘~와’로 살리되, 전쟁 문맥이므로 한국어에서는 대립을 분명히 하는 ‘싸운 일’로 자연스럽게 표현했습니다.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대 기록책
  alternatives_korean:
  - 이스라엘 왕들의 역대지
  - 이스라엘 왕들의 연대기책
  - 이스라엘 왕들의 사건 기록책
  lexicon: HALOT
  rationale: 문자적 ‘날들의 말들’보다 왕조 연대기라는 관용적 의미가 분명하므로, 독자가 문서 종류를 즉시 이해하도록 ‘역대 기록책’으로 옮겼습니다.
theological_decisions:
- issue: 전쟁 동사의 관계 표현
  chosen_reading: ‘그가 유다 왕 아마샤와 싸운 일’로 옮겨, 원문의 עִם을 살리면서도 실제로는 적대적 충돌임을 분명히 했습니다.
  alternative_readings:
  - ‘아마샤 왕과 함께 싸운 일’
  - ‘아마샤 왕과 맞서 싸운 일’
  rationale: 히브리어 전치사 עִם은 문자적으로 ‘~와’이지만 이 문맥에서는 적대적 대결을 가리키므로, 한국어에서 오해되지 않도록 의미를 명확히 했습니다.
  doctrine_reference: 서사 문맥의 정확한 전달과 역사 기록의 사실성
