  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יְהוֹאָ֜שׁ אֲשֶׁ֤ר עָשָׂה֙ וּ/גְב֣וּרָת֔/וֹ וַ/אֲשֶׁ֣ר נִלְחַ֔ם עִ֖ם אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/015.yaml
  text: Now the rest of the acts of Jehoash[a], and all that he did, and his might[b], and how he fought with Amaziah king of Judah—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'fought against Amaziah king of Judah.' The Hebrew preposition is literally 'with,' but in this military context it can be rendered more explicitly as hostile opposition.
    reason: lexical_alternative
  - marker: b
    text: Or 'the book of the annals of the kings of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호아스의 남은 행적과 그가 행한 모든 일과 그의 용맹, 그리고 그가 유다 왕 아마샤와 싸운 일[a]은 이스라엘 왕들의 역대 기록에 기록되어 있지 않습니까?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 전치사 עִם은 문자적으로 ‘~와’이지만, 전투 문맥에서는 ‘~을 대적하여’라는 뜻으로도 쓰입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘 왕들의 연대기 책’. 이는 이스라엘 왕들의 통치와 사건을 기록한 왕실 연대 기록을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts
  chosen_korean: 남은 행적
  alternatives_korean:
