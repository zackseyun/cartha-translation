  chosen_reading: 히브리어의 직접적인 군사적 폭력을 완화하지 않고, 본문이 말하는 정복과 살상의 현실을 그대로 드러냈습니다.
  alternative_readings:
  - 무난한 역사 서술처럼 약화하여 ‘패배시켰습니다’로 옮김
  - 의미를 넓혀 ‘정복했습니다’로만 옮김
  rationale: 본문은 왕의 군사 승리를 구체적으로 서술하므로, 결과를 흐리지 않는 번역이 더 source-direct합니다.
  doctrine_reference: 본문의 역사 서술 보존 원칙
