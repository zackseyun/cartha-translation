  text: He struck down ten thousand Edomites in the Valley of Salt, captured Sela in battle, and called its name Joktheel, to this day.
  footnotes:
  - marker: a
    text: Sela can also be understood by its lexical sense, 'the rock' or 'the crag,' though here it is likely the place-name Sela.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 소금 골짜기에서 에돔 사람 만 명을 쳐서 쓰러뜨리고, 전투 중에 셀라를 점령한 뒤 그 이름을 욱다엘이라 불렀습니다. 그것이 오늘날까지도 그렇습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘셀라’는 고유 지명으로 이해할 수 있지만, 어휘 뜻으로는 ‘바위’ 또는 ‘절벽’을 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  english_pob_choice: struck down
  chosen_korean: 쳐서 쓰러뜨리고
  alternatives_korean:
  - 무찌르고
  - 쳐 죽이고
  lexicon: HALOT
  rationale: 전투 맥락의 נכה를 자연스러운 한국어 전쟁 서술로 옮기되, 단순한 패배보다 실제 타격과 제압의 뉘앙스를 살렸습니다.
- source_word: אֱדוֹם
  english_pob_choice: Edomites
  chosen_korean: 에돔 사람
  alternatives_korean:
  - 에돔
  - 에돔인
  lexicon: HALOT
  rationale: 히브리어는 나라 이름을 쓰지만, 영어 POB처럼 전투 피해의 대상이 사람임을 분명히 하기 위해 ‘에돔 사람’으로 옮겼습니다.
- source_word: בְּגֵיא הַמֶּלַח
  english_pob_choice: in the Valley of Salt
  chosen_korean: 소금 골짜기에서
  alternatives_korean:
  - 소금 골짜기에서
  - 염곡에서
  lexicon: HALOT
  rationale: 지명으로 굳어진 표현이지만, 한국어에서는 ‘소금 골짜기’가 의미를 가장 직접적으로 전달합니다.
- source_word: וְתָפַשׂ אֶת הַסֶּלַע
  english_pob_choice: captured Sela
  chosen_korean: 셀라를 점령한
  alternatives_korean:
  - 셀라를 사로잡은
  - 셀라를 빼앗은
  lexicon: HALOT
  rationale: 성읍/요새를 군사적으로 ‘붙잡다’는 뜻을 한국어 전쟁 용례에 맞게 ‘점령하다’로 풀었습니다. 지명으로 처리한 영어 POB의 판단을 따랐습니다.
- source_word: וַיִּקְרָא אֶת שְׁמָהּ יָקְתְאֵל
  english_pob_choice: called its name Joktheel
  chosen_korean: 그 이름을 욱다엘이라 불렀습니다
  alternatives_korean:
  - 그 이름을 욱다엘이라 지었습니다
  - 그 이름을 욱다엘이라 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 이름 짓는 관용구를 보존해 ‘이라 불렀습니다’로 옮겼고, 고유명사는 음역했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지도
  alternatives_korean:
  - 지금까지도
  - 오늘날까지도
  lexicon: HALOT
  rationale: 서술 시점까지 지속됨을 나타내는 관용 표현으로 자연스럽게 옮겼습니다.
theological_decisions:
