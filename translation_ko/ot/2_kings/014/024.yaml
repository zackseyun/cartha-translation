source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֗ר מִ/כָּל חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/024.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from any of the sins of Jeroboam son of Nebat[a], which he caused Israel to commit.
  footnotes:
  - marker: a
    text: Or, 'who caused Israel to sin.' The Hebrew relative clause can be taken as referring directly to Jeroboam rather than instrumentally to his sins.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 행했습니다. 그는 느밧의 아들 여로보암의 모든 죄에서 돌이키지 않았습니다. 그것들로 여로보암이 이스라엘을 죄짓게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 죄짓게 한 자’. 히브리어 관계절은 여로보암 자신을 직접 가리키는 것으로도, 그의 죄들을 도구적으로 가리키는 것으로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 행했습니다
  alternatives_korean:
  - 악을 행했습니다
  - 야훼 보시기에 악했습니다
  lexicon: HALOT
  rationale: עשה הרע의 관용적 의미를 살려 도덕적 평가를 분명히 하되, 한국어에서는 ‘악한 일을 행하다’가 가장 자연스럽습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 옮기되, 표준 한국어에서는 ‘보시기에’가 평가의 의미를 가장 잘 전달합니다.
- source_word: לֹא סָר מִכָּל
  english_pob_choice: He did not turn away from any of
  chosen_korean: 모든 …에서 돌이키지 않았습니다
  alternatives_korean:
  - 하나도 떠나지 않았습니다
  - 전혀 벗어나지 않았습니다
  lexicon: HALOT
  rationale: סור의 ‘돌아서다/떠나다’ 의미를 살리면서, מִכָּל의 포괄성을 한국어 ‘모든 …에서’로 분명히 나타냈습니다.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: which he caused Israel to commit
  chosen_korean: 그것들로 여로보암이 이스라엘을 죄짓게 했습니다
  alternatives_korean:
  - 그 죄들로 이스라엘을 죄에 빠뜨렸습니다
  - 그것들 때문에 이스라엘이 죄를 짓게 했습니다
  lexicon: HALOT
  rationale: 히필 חטא의 인과적 의미를 유지하되, 한국어에서는 원인 도구를 드러내는 ‘그것들로’가 자연스럽고 본문의 연결도 분명합니다.
- source_word: יָרָבְעָם בֶּן נְבָט
  english_pob_choice: Jeroboam son of Nebat
  chosen_korean: 느밧의 아들 여로보암
  alternatives_korean:
  - 네밧의 아들 여로보암
  - 여로보암 느밧의 아들
  lexicon: HALOT
  rationale: 고유명사는 통용되는 한국어 성경형을 따르되, 원문의 친족관계를 자연스럽게 살렸습니다.
theological_decisions:
- issue: 여호와 신명(יהוה) 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명을 직설적으로 드러내어 고유명사성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל의 관계절 처리
  chosen_reading: ‘그것들로 여로보암이 이스라엘을 죄짓게 했습니다’로 옮겨, 여로보암의 죄행/정책이 이스라엘의 죄를 초래한 인과를 드러냈습니다.
  alternative_readings:
  - ‘이스라엘을 죄짓게 한 여로보암’으로 직접 수식
  - ‘이스라엘을 죄짓게 한 죄들’로 인과 강조
  rationale: 히브리어는 직접 화제화보다 인과적 연결을 압축적으로 표현하므로, 한국어에서도 원인-결과를 살리면서 문법적으로 자연스럽게 처리했습니다.
