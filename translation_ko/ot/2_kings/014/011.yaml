source:
  edition: WLC
  text: וְ/לֹא שָׁמַ֣ע אֲמַצְיָ֔הוּ וַ/יַּ֨עַל יְהוֹאָ֤שׁ מֶֽלֶךְ יִשְׂרָאֵל֙ וַ/יִּתְרָא֣וּ פָנִ֔ים ה֖וּא וַ/אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֑ה בְּ/בֵ֥ית שֶׁ֖מֶשׁ אֲשֶׁ֥ר לִ/יהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/011.yaml
  text: But Amaziah would not listen[a], so Jehoash king of Israel went up, and he and Amaziah king of Judah met face to face at Beth-shemesh[b], which belongs to Judah.
  footnotes:
  - marker: a
    text: Or 'did not heed' / 'did not obey.' The Hebrew verb can denote listening with responsive action, not mere hearing.
    reason: lexical_alternative
  - marker: b
    text: Literally 'saw faces,' an idiom for a direct encounter.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 아마샤는 듣지 않았습니다. 그래서 이스라엘 왕 여호아스가 올라와, 그와 유다 왕 아마샤가 유다에 속한 벳세메스에서 서로 얼굴을 마주했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שׁמע는 여기서 단순히 ‘듣다’가 아니라 경고를 받아들이거나 따르는 의미를 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘얼굴들을 보다’라는 관용구로, 두 왕의 직접 대면을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  english_pob_choice: would not listen
  chosen_korean: 듣지 않았습니다
  alternatives_korean:
  - 귀를 기울이지 않았습니다
  - 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 이 문맥에서 경고를 받아들이지 않는다는 뜻이므로, 단순 청각보다 ‘듣지 않다’로 옮겨 거절의 의미를 살렸습니다. “순종하다”는 여기서는 다소 강합니다.
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 쳐올라와
  - 출정하여 올라와
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살려, 전쟁 문맥의 함의를 과도하게 풀지 않고 간결하게 옮겼습니다.
- source_word: וַיִּתְרָאוּ פָנִים
  english_pob_choice: met face to face
  chosen_korean: 서로 얼굴을 마주했습니다
  alternatives_korean:
  - 마주 대했습니다
  - 얼굴을 맞대었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘얼굴들을 보다’라는 관용구이므로, 두 왕의 직접 대면이라는 뜻을 자연스럽게 드러내는 표현을 택했습니다.
- source_word: בֵּית שֶׁמֶשׁ אֲשֶׁר לִיהוּדָה
  english_pob_choice: Beth-shemesh, which belongs to Judah
  chosen_korean: 유다에 속한 벳세메스
  alternatives_korean:
  - 유다에 있는 벳세메스
  - 유다의 벳세메스
  lexicon: HALOT
  rationale: ל־יהודה는 단순 위치보다 소속·관할을 나타내므로, ‘속한’으로 옮겨 영문 POB의 소속 뉘앙스를 반영했습니다.
theological_decisions:
- issue: ‘듣다’의 반응적 의미와 서술의 대비
  chosen_reading: ‘듣지 않았습니다’로 옮겨, 앞선 경고를 거부한 아마샤의 태도를 드러냈습니다.
  alternative_readings:
  - ‘순종하지 않았습니다’
  - ‘귀를 기울이지 않았습니다’
  rationale: 이 절은 단순한 청취 실패가 아니라 경고에 대한 거절을 말하므로, 반응적 듣기의 뉘앙스를 유지하는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 내 서사적·윤리적 의미
- issue: 지명 표기와 관할 표지
  chosen_reading: ‘벳세메스’는 음역하고, ‘유다에 속한’으로 관할 관계를 밝혔습니다.
  alternative_readings:
  - ‘벳-세메스’
  - ‘유다에 있는’
  rationale: 지명은 현대 표기 관습에 따라 음역하되, 문맥상 핵심인 영토 소속은 본문이 가진 정치적·지리적 의미를 살리기 위해 명시했습니다.
  doctrine_reference: 본문 내 지리·역사적 의미
