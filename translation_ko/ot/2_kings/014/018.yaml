lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 나머지
  alternatives_korean:
  - 남은
  - 그 밖의
  lexicon: HALOT
  rationale: 왕조 요약 공식에서 יֶתֶר는 한 왕의 남은 행적을 가리키므로, 한국어에서는 문맥에 맞게 자연스럽고 간결한 ‘나머지’로 옮겼습니다.
- source_word: דִּבְרֵי אֲמַצְיָהוּ
  english_pob_choice: acts of Amaziah
  chosen_korean: 아마샤의 행적
  alternatives_korean:
  - 아마샤의 일들
  - 아마샤의 일과 행적
  lexicon: HALOT
  rationale: דִּבְרֵי는 단순한 ‘말’보다 왕의 기록된 행적과 사건들을 가리키므로, 역사 서술에 자연스러운 ‘행적’을 선택했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: Book of the Chronicles
  chosen_korean: 역대기
  alternatives_korean:
  - 기록책
  - 연대기
  lexicon: HALOT
  rationale: 이 왕정 기록 인용 공식에서 דִּבְרֵי הַיָּמִים는 관용적으로 ‘역대기’에 해당하므로, 한국어 성경 독자에게도 바로 이해되는 표준형을 사용했습니다.
- source_word: לְמַלְכֵי יְהוּדָה
  english_pob_choice: of the Kings of Judah
  chosen_korean: 유다 왕들의
  alternatives_korean:
  - 유다 왕들에게 속한
  - 유다 왕들에 관한
  lexicon: HALOT
  rationale: 문서 제목의 소속 관계를 한국어 소유격으로 자연스럽게 살려 ‘유다 왕들의’로 옮겼습니다.
