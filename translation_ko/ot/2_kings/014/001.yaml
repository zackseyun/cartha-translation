lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁתַּ֔יִם לְ/יוֹאָ֥שׁ
  english_pob_choice: In the second year of Joash
  chosen_korean: 요아하스의 아들 이스라엘의 왕 요아스의 제2년에
  alternatives_korean:
  - 이스라엘 왕 요아스의 둘째 해에
  - 요아스의 제2년에
  lexicon: HALOT
  rationale: 히브리어의 연대 공식은 ‘~의 제2년’이라는 관용적 의미이므로, 자연스러운 한국어로는 ‘제2년에’로 옮기되, לְ/יוֹאָשׁ가 가리키는 왕이 이스라엘의 요아스임을 문맥상 드러내기 위해 관계를 유지했습니다.
- source_word: בֶּן יוֹאָחָז
  english_pob_choice: son of Jehoahaz
  chosen_korean: 요아하스의 아들
  alternatives_korean:
  - 여호아하스의 아들
  - 여호하스의 아들
  lexicon: HALOT
  rationale: 인명은 한국어 성경에서 널리 쓰이는 음역을 따랐고, patronymic은 직역하여 혈통 관계를 분명히 했습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 통치 지속이 아니라 왕위에 오름을 나타내므로, 현대 한국어에서는 ‘왕이 되었습니다’가 가장 직접적이고 자연스럽습니다.
- source_word: אֲמַצְיָהוּ בֶן יוֹאָשׁ
  english_pob_choice: Amaziah son of Joash
  chosen_korean: 유다의 왕 요아스의 아들 아마샤
  alternatives_korean:
  - 아마샤 요아스의 아들
  - 아마샤
  lexicon: HALOT
  rationale: 인명 아마샤는 한국어 성경의 통용형을 따랐고, 최종 수식어 ‘유다의 왕’은 본문의 왕호를 자연스럽게 통합해 주어 혼동을 줄입니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다의 왕
  alternatives_korean:
  - 유다를 다스리는 왕
  - 유다 왕
  lexicon: HALOT
  rationale: 히브리어의 소유·관계 구조를 자연스러운 한국어 왕호로 옮겼습니다.
