source:
  edition: WLC
  text: וְ/אֶת בְּנֵ֥י הַ/מַּכִּ֖ים לֹ֣א הֵמִ֑ית כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה אֲשֶׁר צִוָּ֨ה יְהוָ֜ה לֵ/אמֹ֗ר לֹא יוּמְת֨וּ אָב֤וֹת עַל בָּנִים֙ וּ/בָנִים֙ לֹא יוּמְת֣וּ עַל אָב֔וֹת כִּ֛י אִם אִ֥ישׁ בְּ/חֶטְא֖/וֹ ימות־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/006.yaml
  text: But he did not put the sons of the killers to death[a], according to what is written in the Book of the Law of Moses, which Yahweh commanded, saying, “Fathers shall not be put to death for sons, and sons shall not be put to death for fathers; rather[b], each man shall die for his own sin.”
  footnotes:
  - marker: a
    text: Or, 'the children of the murderers.' The Hebrew literally says 'the sons of the killers.'
    reason: lexical_alternative
  - marker: b
    text: This quotation reflects Deuteronomy 24:16.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 그는 「살인자들」의 아들들을 죽이지 않았습니다[a]. 이는 야훼께서 명령하여 말씀하신 모세의 율법 책에 기록된 대로입니다. 「아버지는 아들들 때문에 죽임을 당해서는 안 되고, 아들들도 아버지들 때문에 죽임을 당해서는 안 된다. 오히려[b] 각 사람은 자기 죄로 죽을 것이다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘살해자들의 자녀들’. 히브리어는 문자적으로 ‘살인자들의 아들들’이라고 말합니다.
    reason: lexical_alternative
  - marker: b
    text: 이 인용은 신명기 24:16을 반영합니다.
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי הַמַּכִּים
  english_pob_choice: the sons of the killers
  chosen_korean: 「살인자들」의 아들들
  alternatives_korean:
  - 「살인자들의 자녀들」
  - 「죽인 자들의 아들들」
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘살인한 자들의 아들들’이지만, 한국어에서는 소유격 구조로 자연스럽게 옮기면서도 남성 복수의 표지를 살리기 위해 ‘아들들’을 유지했습니다.
- source_word: לֹא הֵמִית
  english_pob_choice: did not put ... to death
  chosen_korean: 죽이지 않았습니다
  alternatives_korean:
  - 죽음에 처하지 않았습니다
  - 사형에 처하지 않았습니다
  lexicon: HALOT
  rationale: 법정 문맥의 ‘put to death’는 한국어에서 가장 직접적으로 ‘죽이다/죽임을 당하다’로 드러나는 것이 자연스럽고, 문장의 역사 서술 흐름에도 맞습니다.
- source_word: כַּ/כָּת֣וּב בְּ/סֵ֣פֶר תּֽוֹרַת מֹ֠שֶׁה
  english_pob_choice: according to what is written in the Book of the Law of Moses
  chosen_korean: 모세의 율법 책에 기록된 대로
  alternatives_korean:
  - 모세 율법의 책에 기록된 대로
  - 모세의 율법서에 기록된 대로
  lexicon: HALOT
  rationale: ‘כתב’의 수동적 인용 공식을 한국어 관용으로 풀어 ‘기록된 대로’로 옮기고, ‘תורה’는 프로젝트 기본어휘에 따라 ‘율법’으로 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값대로 ‘야훼’로 옮겨, 서술 속 법의 출처가 누구에게서 비롯되는지 분명히 했습니다.
- source_word: לֹא יוּמְת֨וּ
  english_pob_choice: shall not be put to death
  chosen_korean: 죽임을 당해서는 안 되고
  alternatives_korean:
  - 죽임을 당하면 안 되고
  - 사형에 처해서는 안 되고
  lexicon: HALOT
  rationale: 히필/수동적 법정 금지 표현을 한국어에서 의무 금지형으로 살려, 타인의 죄로 형벌받지 않는다는 뜻을 분명히 했습니다.
- source_word: בְּחֶטְא֖וֹ
  english_pob_choice: for his own sin
  chosen_korean: 자기 죄로
  alternatives_korean:
  - 자기 허물로
  - 자기 범죄로
  lexicon: HALOT
  rationale: 전치사+명사의 원인/기준 관계를 한국어의 ‘-로’로 간결하게 살려, 각 사람의 책임이 자기 죄에 한정됨을 드러냈습니다.
theological_decisions:
- issue: 가문 연좌 처벌의 부정
  chosen_reading: 이 구절은 아버지와 아들 사이에 죄책과 사형을 연좌시키지 않는 법적 원칙을 말하며, 각 사람의 처벌은 자기 죄에 근거한다고 진술합니다.
  alternative_readings:
  - 공동체적 죄의 모든 결과를 부정하는 진술
  rationale: 문맥은 도덕 일반론이 아니라 형벌의 법적 기준입니다. 따라서 더 넓은 신학 명제를 덧씌우지 않고, 본문의 법정적 초점을 유지했습니다.
  doctrine_reference: 신명기 24:16의 법적 원칙을 역사 서술 속에서 보존합니다.
