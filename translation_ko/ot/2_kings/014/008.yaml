source:
  edition: WLC
  text: אָ֣ז שָׁלַ֤ח אֲמַצְיָה֙ מַלְאָכִ֔ים אֶל יְהוֹאָ֨שׁ בֶּן יְהוֹאָחָ֧ז בֶּן יֵה֛וּא מֶ֥לֶךְ יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר לְכָ֖/ה נִתְרָאֶ֥ה פָנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/008.yaml
  text: Then Amaziah sent messengers to Jehoash son of Jehoahaz[a], son of Jehu, king of Israel, saying, “Come[b], let us look one another in the face.”
  footnotes:
  - marker: a
    text: Literally, “Come, let us see faces.” The Hebrew idiom means to meet each other directly, here in the sense of military confrontation.
    reason: lexical_alternative
  - marker: b
    text: Jehoash is also commonly rendered “Joash” in English versions.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 아마샤가 이스라엘 왕 여호아하스의 아들, 예후의 아들 여호아스[b]에게 사신들을 보내어 말했습니다. “오십시오. 서로 얼굴을 봅시다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어로는 문자적으로 “서로 얼굴을 보다”입니다. 이 문맥에서는 직접 맞서는 대결을 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 여호아스는 ‘요아스’로도 표기됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그런 다음
  - 그 후
  lexicon: HALOT
  rationale: 서사 전개를 자연스럽게 이어 주는 시간 부사로 옮겼습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 전령들
  - 사자들
  lexicon: HALOT
  rationale: 왕실 간 교섭 맥락에서 사람을 보내는 뜻을 살려, 공적·외교적 뉘앙스가 있는 ‘사신들’로 옮겼습니다.
- source_word: יְהוֹאָשׁ
  english_pob_choice: Jehoash
  chosen_korean: 요아스
  alternatives_korean:
  - 여호아스
  - 여호아시
  lexicon: HALOT
  rationale: 한국어에서 널리 알려진 성경 인명형을 따르되, 영어 POB의 Jehoash에 대응하는 히브리어 이름을 반영했습니다.
- source_word: לְכָה נִתְרָאֶה פָנִים
  english_pob_choice: Come, let us look one another in the face.
  chosen_korean: 와서, 서로 얼굴을 맞대자
  alternatives_korean:
  - 와서, 서로 대면하자
  - 와서, 서로 얼굴을 보자
  lexicon: HALOT
  rationale: 직역하면 ‘서로 얼굴을 보다’이지만, 한국어에서는 대결적 대면을 자연스럽게 드러내는 ‘서로 얼굴을 맞대자’가 관용구의 힘을 더 잘 살립니다.
theological_decisions:
- issue: 왕의 도전적 발화의 뉘앙스
  chosen_reading: 직접적인 전투 선언이라기보다, 공개적으로 맞서자는 도전으로 읽히는 표현을 유지했습니다.
  alternative_readings:
  - ‘전쟁터에서 맞서자’처럼 전투를 명시하는 해석
  - 단순한 ‘대면하자’로 중립화하는 해석
  rationale: 히브리어 관용구 נִתְרָאֶה פָנִים은 문자 그대로보다 공개적 대결의 함의를 가지므로, 과도한 해석 없이 도전성을 보존했습니다.
  doctrine_reference: 서사적·문맥적 해석 원칙
