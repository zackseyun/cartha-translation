  source_fidelity: 재위 연대와 즉위·재위 기간은 대체로 충실하게 옮겼습니다. 그러나 현 번역은 '아마지야의 아들 요아스'라고 하여 히브리어의 부자 관계(아마지야는 요아스의 아들)를 역전시켰습니다.
