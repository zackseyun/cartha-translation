  text: In the fifteenth year of Amaziah son of Joash, king of Judah, Jeroboam son of Joash, king of Israel, became king in Samaria, and he reigned forty-one years.
translation:
  language: ko
  text: 유다의 왕 아마지야의 아들 요아스의 십오년째에, 이스라엘의 왕 요아스의 아들 여로보암이 사마리아에서 왕이 되어 사십일 년 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: In the fifteenth year of
  chosen_korean: 십오년째에
  alternatives_korean:
  - 열다섯 해에
  - 제십오년에
  lexicon: WLC; regnal formula
  rationale: 연대기적 즉위 공식에서 ‘~년째에’가 왕의 재위 연차를 자연스럽게 드러내며, 단순 기간 표현보다 원문의 연대 기준을 더 잘 살립니다.
- source_word: לַ/אֲמַצְיָהוּ בֶן יוֹאָשׁ מֶלֶךְ יְהוּדָה
  english_pob_choice: of Amaziah son of Joash, king of Judah
  chosen_korean: 유다의 왕 아마지야의 아들 요아스
  alternatives_korean:
  - 유다 왕 아마지야의 아들 요아스
  - 유다의 왕 요아스의 아들 아마지야
  lexicon: WLC
  rationale: 속격 연쇄를 한국어의 자연스러운 수식 순서로 풀어, 아마지야가 유다 왕이며 요아스의 아들임을 함께 보존했습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되어
  alternatives_korean:
  - 즉위하여
  - 왕이 되었습니다
  lexicon: WLC
  rationale: מלך의 즉위 의미를 살리되, 뒤의 재위 기간과 구별되도록 ‘다스렸습니다’와 분리했습니다.
- source_word: בְּ/שֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아에
  - 사마리아 안에서
  lexicon: WLC
  rationale: 지방/도시를 가리키는 ב를 한국어 조사 ‘-에서’로 옮겨 즉위 장소를 분명히 했습니다.
- source_word: אַרְבָּעִים וְאַחַת שָׁנָה
  english_pob_choice: forty-one years
  chosen_korean: 사십일 년 동안
  alternatives_korean:
  - 마흔한 해 동안
  - 41년 동안
  lexicon: WLC
  rationale: 재위 기간 표현으로서 한국어 성서문체에 맞는 ‘~년 동안’을 사용했고, 수사는 한자어 표기를 유지했습니다.
