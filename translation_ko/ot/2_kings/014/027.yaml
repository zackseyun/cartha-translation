base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/027.yaml
  text: But Yahweh had not said that he would blot out the name of Israel from under heaven[b][a], so he saved them by the hand of Jeroboam son of Joash.
  footnotes:
  - marker: a
    text: Or 'wipe out' or 'erase' the name of Israel.
    reason: lexical_alternative
  - marker: b
    text: '''By the hand of'' is a Hebrew idiom meaning ''through'' or ''by means of.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 이스라엘의 이름을 하늘 아래에서 지워 버리겠다고 말씀하지 않으셨습니다. 그래서 그들을 요아스의 아들 여로보암의 손으로 구원하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지워 버리다’는 כאן의 מחה를 따라 ‘없애다’, ‘말소하다’, ‘지우다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘손’은 히브리어 관용으로 ‘통해’ 또는 ‘매개로’의 뜻입니다.
    reason: lexical_alternative
