  rationale: 행위의 도구적 용법을 한국어에서도 직접적으로 드러내되, 인물의 매개를 보존했습니다.
theological_decisions:
- issue: 하나님의 구원과 인간 도구의 긴장
  chosen_reading: 하나님께서 이스라엘을 멸절하려는 뜻을 밝히지 않으셨고, 여로보암을 통해 그들을 구원하셨다는 서술을 그대로 살렸습니다.
  alternative_readings:
  - 구원하셨다를 약화해 단순히 ‘도와주셨다’로 옮길 수 있음
  - 하나님의 주권을 더 드러내기 위해 문장을 재구성할 수 있음
  rationale: 원문은 하나님의 비멸절 의사와 여로보암을 통한 구원을 나란히 제시하므로, 해석적으로 매끈하게 만들지 않고 그 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
