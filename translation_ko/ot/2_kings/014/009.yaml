id: 2KI.14.9
reference: 2 Kings 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יִשְׂרָאֵ֗ל אֶל אֲמַצְיָ֣הוּ מֶֽלֶךְ יְהוּדָה֮ לֵ/אמֹר֒ הַ/ח֜וֹחַ אֲשֶׁ֣ר בַּ/לְּבָנ֗וֹן שָׁ֠לַח אֶל הָ/אֶ֜רֶז אֲשֶׁ֤ר בַּ/לְּבָנוֹן֙ לֵ/אמֹ֔ר תְּנָֽ/ה אֶת בִּתְּ/ךָ֥ לִ/בְנִ֖/י לְ/אִשָּׁ֑ה וַֽ/תַּעֲבֹ֞ר חַיַּ֤ת הַ/שָּׂדֶה֙ אֲשֶׁ֣ר בַּ/לְּבָנ֔וֹן וַ/תִּרְמֹ֖ס אֶת הַ/חֽוֹחַ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/009.yaml
  text: Then Jehoash king of Israel sent to Amaziah king of Judah[a], saying, “The thornbush that was in Lebanon sent to the cedar that was in Lebanon, saying[b], ‘Give your daughter to my son as a wife.’ And a wild beast that was in Lebanon passed by and trampled the thornbush.”
  footnotes:
  - marker: a
    text: Or 'thistle' or 'briar' for the thorny plant named here.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'a beast of the field,' that is, a wild animal.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 이스라엘의 왕 요아스가 유다의 왕 아마샤에게 사람을 보내며 말했습니다. 「레바논에 있던 가시떨기가 레바논에 있던 백향목에게 사람을 보내며 말하기를 ‘당신의 딸을 내 아들에게 아내로 주십시오’ 하였는데, 레바논에 있던 들짐승이 지나가며 그 가시떨기를 짓밟았습니다」.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘가시떨기’는 여기의 히브리어 식물명을 넓게 옮긴 말로, ‘엉겅퀴’나 ‘가시나무’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘들판의 짐승’이지만, 뜻은 일반적인 들짐승입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: Then ... sent
  chosen_korean: 사람을 보내며
  alternatives_korean:
  - 보냈습니다
  - 사신을 보냈습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 이어지는 직접화를 위해 한국어에서는 단순히 ‘보내며’로 연결했습니다.
- source_word: הַחוֹחַ
  english_pob_choice: the thornbush
  chosen_korean: 가시떨기
  alternatives_korean:
  - 가시덤불
  - 엉겅퀴
  - 가시나무
  lexicon: HALOT
  rationale: 낮고 보잘것없는 가시 식물이라는 대비를 살리기 위해, 전통적이면서도 비유적 힘이 있는 ‘가시떨기’를 택했습니다.
- source_word: הָאֶרֶז
  english_pob_choice: the cedar
  chosen_korean: 백향목
  alternatives_korean:
  - 삼나무
  - 향나무
  lexicon: HALOT
  rationale: 성경적 상징성과 레바논의 웅장한 나무 이미지를 살리기 위해 ‘백향목’을 유지했습니다.
- source_word: חַיַּת הַשָּׂדֶה
  english_pob_choice: a wild beast
  chosen_korean: 들짐승
  alternatives_korean:
  - 야생동물
  - 들짐승 한 마리
  lexicon: HALOT
  rationale: 직역적이면서도 비유의 거친 느낌을 살리는 표현으로 ‘들짐승’이 가장 자연스럽습니다.
theological_decisions:
- issue: 마지막 접속사 וַ는 역접 ‘그러나’가 아니라 단순한 연결인지 여부
  chosen_reading: ‘그리고’가 아니라 서술의 단순 진행으로 처리해, ‘레바논에 있던 들짐승이 지나가며…’로 옮겼습니다.
  alternative_readings:
  - 그러나 레바논에 있던 들짐승이 지나가며…
  - 그리고 레바논에 있던 들짐승이 지나가며…
  rationale: 히브리어 본문은 여기서 명시적 대조를 만들지 않고 사건을 이어 줍니다. 그래서 역접을 덧붙이지 않았습니다.
  doctrine_reference: 본문 구조와 담화 진행
