- from: 그때 이스라엘의 왕 요아스가 유다의 왕 아마샤에게 사람을 보내며 말했습니다. 「레바논에 있던 가시떨기가 레바논에 있던 백향목에게 사람을 보내며 말하기를 ‘당신의 딸을 내 아들에게 아내로 주십시오’ 하였는데, 레바논에 있던 들짐승이 지나가며 그 가시떨기를 짓밟았습니다」.[a][b]
  to: 그때 이스라엘 왕 요아스가 유다 왕 아마샤에게 전갈을 보내어 말했습니다. “레바논에 있던 가시떨기[a]가 레바논에 있던 백향목에게 전갈을 보내어 ‘당신의 딸을 내 아들에게 아내로 주십시오’라고 하였습니다. 레바논에 있던 들짐승[b]이 지나가다가 그 가시떨기를 짓밟았습니다.”
  rationale: 전달 동사의 목적어를 ‘사람’으로 구체화하지 않고 문맥상 자연스러운 ‘전갈’로 옮겼습니다. 원문의 단순 접속은 역접으로 바꾸지 않았으며, 가시떨기·백향목·레바논의 반복과 들짐승이 지나가며 가시떨기를 짓밟는 우화의 흐름을 보존했습니다. 각주 표지는 해당 어휘 바로 뒤로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
