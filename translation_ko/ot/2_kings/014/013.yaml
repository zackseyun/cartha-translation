  text: וְ/אֵת֩ אֲמַצְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה בֶּן יְהוֹאָ֣שׁ בֶּן אֲחַזְיָ֗הוּ תָּפַ֛שׂ יְהוֹאָ֥שׁ מֶֽלֶךְ יִשְׂרָאֵ֖ל בְּ/בֵ֣ית שָׁ֑מֶשׁ ו/יבאו יְר֣וּשָׁלִַ֔ם וַ/יִּפְרֹץ֩ בְּ/חוֹמַ֨ת יְרוּשָׁלִַ֜ם בְּ/שַׁ֤עַר אֶפְרַ֨יִם֙ עַד שַׁ֣עַר הַ/פִּנָּ֔ה אַרְבַּ֥ע מֵא֖וֹת אַמָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/013.yaml
  text: And Jehoash king of Israel captured Amaziah king of Judah[a], the son of Jehoash, son of Ahaziah, at Beth-shemesh; then he came to Jerusalem and broke down the wall of Jerusalem from the Ephraim Gate to the Corner Gate, four hundred cubits.
  footnotes:
  - marker: a
    text: The Hebrew consonantal text reads 'and they came to Jerusalem,' but the context and the following singular verb support the sense 'and he came to Jerusalem,' referring to Jehoash.
    reason: textual_variant
translation:
  language: ko
  text: 유다 왕 여호아하스의 아들 아마샤를 이스라엘 왕 요아스가 벧세메스에서 사로잡고, 예루살렘으로 와서 에브라임 문에서부터 모퉁이 문까지 예루살렘 성벽을 무너뜨렸습니다. 그 길이는 사백 규빗이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 자음본문은 ‘예루살렘으로 그들이 왔다’로 읽히지만, 문맥과 뒤따르는 단수 동사가 요아스를 가리키므로 ‘그가 와서’로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: תָּפַשׂ
  english_pob_choice: captured
  chosen_korean: 사로잡고
  alternatives_korean:
  - 붙잡고
  - 포로로 잡고
  lexicon: HALOT
  rationale: 전쟁 맥락에서 왕을 사로잡는 뜻을 자연스럽게 살리되, 지나친 의역 없이 포획의 의미를 분명히 드러냅니다.
- source_word: ו/יבאו
  english_pob_choice: then he came
  chosen_korean: 와서
  alternatives_korean:
  - 그리고 그가 와서
  - 그들이 와서
  lexicon: HALOT
  rationale: 히브리어 자음본문의 복수형보다 뒤이어 오는 단수 동사와 서술 흐름을 따라 요아스를 지시하는 것으로 옮겼습니다.
- source_word: וַיִּפְרֹץ
  english_pob_choice: broke down
  chosen_korean: 무너뜨렸습니다
  alternatives_korean:
  - 헐어버렸습니다
  - 허물었습니다
  lexicon: HALOT
  rationale: 성벽에 대한 동사의 의미를 현대 한국어에서 가장 자연스럽고 직접적으로 전달합니다.
- source_word: בְּשַׁעַר אֶפְרַיִם עַד שַׁעַר הַפִּנָּה
  english_pob_choice: from the Ephraim Gate to the Corner Gate
  chosen_korean: 에브라임 문에서부터 모퉁이 문까지
  alternatives_korean:
  - 에브라임 성문에서 모퉁이 성문까지
  - 에브라임 문으로부터 모퉁이 문에 이르기까지
  lexicon: HALOT
  rationale: 파괴 범위를 나타내는 구문을 한국어의 ‘에서부터 …까지’로 옮겨 거리의 시작과 끝을 분명히 했습니다.
- source_word: אַרְבַּע מֵאוֹת אַמָּה
  english_pob_choice: four hundred cubits
  chosen_korean: 사백 규빗
  alternatives_korean:
  - 사백 큐빗
  - 사백 팔꿈치
  lexicon: HALOT
  rationale: 고대 측정 단위를 보존해 원문의 수치 표현을 그대로 드러냅니다.
