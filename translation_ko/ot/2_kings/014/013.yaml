  to: 이스라엘 왕 요아스가 유다 왕 여호아스의 아들 아마샤, 곧 아하시야의 아들을 벧세메스에서 사로잡고 예루살렘으로 와서, 에브라임 문에서 모퉁이 문까지 사백 규빗에 이르는 예루살렘 성벽을 무너뜨렸습니다.[a]
  rationale: 아마샤의 계보를 히브리어 본문에 맞게 ‘여호아스의 아들, 곧 아하시야의 아들’로 바로잡았습니다. ‘사백 규빗’을 성벽 파괴 범위에 직접 연결하여 원문의 수식 관계를 한국어에서 명확히 했습니다. 자음본문의 복수형과 문맥상 단수 독법의 차이는 각주로 보존했습니다.
