  text: וַ/יִּקְח֞וּ כָּל עַ֤ם יְהוּדָה֙ אֶת עֲזַרְיָ֔ה וְ/ה֕וּא בֶּן שֵׁ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה וַ/יַּמְלִ֣כוּ אֹת֔/וֹ תַּ֖חַת אָבִ֥י/ו אֲמַצְיָֽהוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/021.yaml
  text: Then all the people of Judah took Azariah—he was sixteen years old—and made him king in place of his father Amaziah[a].
  footnotes:
  - marker: a
    text: Azariah is also called Uzziah elsewhere; the Hebrew here reads Azariah.
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 유다의 모든 백성이 아사랴를 데려다가, 그가 열여섯 살이었을 때 그의 아버지 아마샤 대신 그를 왕으로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아사랴는 다른 곳에서 웃시야라고도 불립니다. 여기의 히브리어는 아사랴입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְחוּ
  english_pob_choice: took
  chosen_korean: 데려다가
  alternatives_korean:
  - 가져가
  - 붙들어
  lexicon: HALOT
  rationale: 왕위 계승 장면에서 단순히 ‘취하다’보다 공동체가 아사랴를 공식적으로 데려와 세우는 동작을 자연스럽게 드러내면서도, 원문의 ‘take’ 계열 의미를 유지합니다.
- source_word: כָּל עַם יְהוּדָה
  english_pob_choice: all the people of Judah
  chosen_korean: 유다의 모든 백성
  alternatives_korean:
  - 유다의 모든 사람들
  - 온 유다
  lexicon: HALOT
  rationale: 히브리어는 유다 ‘백성’ 전체의 집단적 행위를 말하므로, 정치적·공동체적 주체성을 살려 ‘유다의 모든 백성’으로 옮겼습니다.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  english_pob_choice: made him king
  chosen_korean: 그를 왕으로 세웠습니다
  alternatives_korean:
  - 그를 왕으로 삼았습니다
  - 그를 왕으로 옹립했습니다
  lexicon: HALOT
  rationale: מלך의 사역형은 단순한 선언보다 왕위에 앉히는 설치 행위를 뜻하므로, церemony를 과장하지 않으면서도 뜻을 분명히 하는 ‘왕으로 세우다’를 택했습니다.
- source_word: תַּחַת אָבִיו
  english_pob_choice: in place of his father
  chosen_korean: 그의 아버지 아마샤 대신
  alternatives_korean:
  - 그의 아버지 자리에
  - 그의 아버지를 이어
  lexicon: HALOT
  rationale: 왕위 계승 맥락의 תחת는 시간순의 ‘이후’보다 대체·승계의 뜻이 핵심이므로, ‘대신’으로 자연스럽고 직접적으로 표현했습니다.
theological_decisions:
- issue: 열여섯 살의 즉위와 왕위 계승 서술의 어조
  chosen_reading: 본문은 평가나 해설 없이 사실만 간단히 전하며, 한국어도 서술적·중립적 어조를 유지했습니다.
  alternative_readings:
  - 도덕적 의미를 암시하는 표현을 덧붙이는 것
  - 더 해석적인 역사 서술로 풀어쓰는 것
  rationale: 이 절은 왕위 계승 사실을 기록하는 문장으로, 본문이 제공하지 않는 평가를 덧붙이지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 본문 서사 충실성
- issue: 아사랴/웃시야 이름 차이
  chosen_reading: 본문의 히브리어 형태를 따라 ‘아사랴’를 본문에 두고, 다른 곳의 별칭 문제는 각주로 처리합니다.
  alternative_readings:
  - 본문을 따라 ‘웃시야’로 통일하는 것
  - 본문과 무관하게 이름을 병기하는 것
  rationale: POB 영어 주석이 지적하듯 이 절의 히브리어는 아사랴이므로, 본문은 원문형을 따르고 별칭은 각주로만 알립니다.
  doctrine_reference: 본문/이명 처리의 서지 원칙
