  source_fidelity: ‘모든 금과 은’의 포괄성(כָּל)이 초안에서 빠졌으며, הַנִּמְצְאִים은 왕이 ‘찾아낸’ 물건이라기보다 두 장소에 ‘있던/발견되는’ 기구를 수식합니다. 수정문은 두 요소와 목적어 열거의 범위를 보존합니다.
  naturalness: 초안의 쉼표 중심 열거와 ‘곳간에서 찾아낸’은 수식 범위와 행위 주체가 다소 불분명합니다. ‘…에 있던 모든 기구’ 및 마지막 목적격 조사는 현대 표준 한국어 서술문으로 자연스럽습니다.
  terminology: ‘여호와의 집’은 히브리어 בֵּית יְהוָה를 보존하는 한국어 성경 관용 표현으로 적절합니다. כֵּלִים은 ‘기구’, בְּנֵי הַתַּעֲרֻבוֹת는 문맥상 ‘인질들’로 옮기되, 난해한 직역 가능성은 각주에서 밝혀야 합니다.
