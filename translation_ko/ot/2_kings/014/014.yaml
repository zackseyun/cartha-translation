  - severity: low
    issue: 각주의 ‘약속의 아들들’은 תַּעֲרֻבוֹת의 어휘적 대안으로 부정확합니다.
    rationale: 이 말은 약속 일반보다는 보증·담보·서약의 성격을 가리킵니다. 난해성을 유지하면서 ‘보증/담보의 아들들’로 제시하는 편이 낫습니다.
