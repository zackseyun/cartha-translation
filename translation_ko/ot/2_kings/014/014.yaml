- from: 그는 금과 은과, 여호와의 집과 왕궁의 곳간에서 찾아낸 모든 기구와, 인질들을 가져갔으며, 사마리아로 돌아갔습니다.[a]
  to: 그는 모든 금과 은, 여호와의 집과 왕궁의 곳간에 있던 모든 기구, 그리고 인질들[a]을 가져가고 사마리아로 돌아갔습니다.
  rationale: 금과 은에 대한 포괄 표현을 복원하고, 기구가 두 장소에 ‘있던’ 것이라는 히브리어의 수식 관계를 반영했습니다. ‘인질들’은 문맥상 가장 자연스러운 번역으로 유지하되, 논쟁적이고 난해한 히브리어 표현의 직역 가능성은 해당 단어에 연결된 각주로 보존했습니다.
