  - 주님의 집
  rationale: 이 절은 직접 인용이 아니라 내러티브 서술이므로, 본문 독자에게 즉시 식별되는 전통적 한국어 표기를 유지하되 원어 대응은 audit trail에서 확보합니다.
  doctrine_reference: 표준 본문명 번역 관행
