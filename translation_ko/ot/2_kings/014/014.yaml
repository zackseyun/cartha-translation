base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/014.yaml
  text: He took all the gold and silver[a], and all the vessels found in the house of Yahweh and in the treasuries of the king’s house, and the hostages, and returned to Samaria.
  footnotes:
  - marker: a
    text: 'Hebrew: ''the sons of the pledges'' or ''the sons of the sureties,'' likely meaning persons taken as security—that is, hostages.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 금과 은과, 여호와의 집과 왕궁의 곳간에서 찾아낸 모든 기구와, 인질들을 가져갔으며, 사마리아로 돌아갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 “보증의 아들들” 또는 “약속의 아들들”이지만, 문맥상 인질을 뜻하는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  english_pob_choice: He took
  chosen_korean: 그는 가져갔으며
  alternatives_korean:
  - 그는 취했으며
  - 그는 가져갔고
  lexicon: HALOT
  rationale: 서술형 연속 동작을 자연스럽게 풀어, 약탈·압류의 결과를 드러내는 ‘가져가다’를 택했습니다.
- source_word: כָּל הַזָּהָב וְהַכֶּסֶף
  english_pob_choice: all the gold and the silver
  chosen_korean: 금과 은과
  alternatives_korean:
  - 모든 금과 은을
  - 금과 은을 모두
  lexicon: HALOT
  rationale: 히브리어의 총칭성을 살리되 한국어에서는 어순을 매끄럽게 하려고 목적어 앞에 ‘모든’을 뒤 기구절에 두지 않고, 물품 목록으로 처리했습니다.
- source_word: כָּל הַכֵּלִים הַנִּמְצְאִים
  english_pob_choice: all the vessels found
  chosen_korean: 찾아낸 모든 기구
  alternatives_korean:
  - 발견된 모든 기구
  - 거기서 찾은 모든 기구
  lexicon: HALOT
  rationale: כֵּלִים은 성전/왕궁 맥락에서 단순 ‘그릇’보다 넓은 ‘기구’가 더 정확하며, הַנִּמְצְאִים은 ‘거기 있던’보다 ‘찾아낸’이 소유·수거의 뉘앙스를 더 잘 드러냅니다.
- source_word: בְּנֵי הַתַּעֲרֻבוֹת
  english_pob_choice: the hostages
  chosen_korean: 인질들
  alternatives_korean:
  - 담보로 잡힌 자들
  - 보증의 아들들
  lexicon: HALOT
  rationale: 직역하면 난해하므로 문맥상 ‘안전 보장용으로 붙잡힌 사람들’이라는 의미를 반영해 ‘인질들’로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와의 집
  alternative_readings:
