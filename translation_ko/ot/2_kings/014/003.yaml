id: 2KI.14.3
reference: 2 Kings 14:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הַ/יָּשָׁר֙ בְּ/עֵינֵ֣י יְהוָ֔ה רַ֕ק לֹ֖א כְּ/דָוִ֣ד אָבִ֑י/ו כְּ/כֹ֧ל אֲשֶׁר עָשָׂ֛ה יוֹאָ֥שׁ אָבִ֖י/ו עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/003.yaml
  text: He did what was right in the eyes of Yahweh[a], yet not like David his father[c][b]; he did according to all that Joash his father had done.
  footnotes:
  - marker: a
    text: '''David his father'' uses ''father'' in the dynastic sense of ancestor, not necessarily immediate parentage.'
    reason: cultural_note
  - marker: b
    text: Or 'only, not like David his father.' The Hebrew רַק can be rendered 'only' to introduce the qualification.
    reason: lexical_alternative
  - marker: c
    text: Joash is also spelled Jehoash in English translations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 보시기에 옳은 일을 행했으나, 그의 조상 다윗과는 같지 않았습니다. 오히려 그의 아버지 요아스가 한 모든 일을 따라 했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상’은 여기서 직계 부친이 아니라 왕조적 선조를 가리키는 용례입니다.
    reason: cultural_note
  - marker: b
    text: ‘같지 않았습니다’는 רַק의 제한적·대조적 뉘앙스를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘요아스’는 영어 번역에서 Jehoash로도 표기될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 행하였습니다
  lexicon: HALOT
  rationale: 왕 평가 서술에서 동작을 간결하게 드러내는 동사로 옮겼습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은 일
  alternatives_korean:
  - 바른 일
  - 의로운 일
  lexicon: HALOT
  rationale: 히브리어의 관용적인 왕 평가 공식으로서 ‘옳은 일’을 쓰는 것이 자연스럽고 의미도 분명합니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼 앞에서
  - 야훼의 눈에
  lexicon: HALOT
  rationale: 하나님의 평가를 뜻하는 관용구를 한국어로도 그대로 살려 ‘보시기에’로 옮겼습니다.
- source_word: רַק לֹא כְּדָוִד אָבִיו
  english_pob_choice: yet not like David his father
  chosen_korean: 그러나 그의 조상 다윗과는 같지 않았습니다
  alternatives_korean:
  - 다만 그의 조상 다윗과 같지는 않았습니다
  - 오직 그의 조상 다윗과 같지 않았습니다
  lexicon: HALOT
  rationale: רַק의 제한/대조 기능을 ‘그러나’로 살렸고, ‘아버지’는 이 맥락에서 직계보다 왕조적 조상 의미가 강하므로 ‘조상’으로 풀었습니다.
- source_word: יוֹאָשׁ אָבִיו
  english_pob_choice: Joash his father
  chosen_korean: 그의 아버지 요아스
  alternatives_korean:
  - 그의 아버지 여호아스
  - 조상 요아스
  lexicon: HALOT
  rationale: 히브리어 형태 יוֹאָשׁ을 한국어 성경에서 널리 쓰이는 ‘요아스’로 옮겼고, 여기서는 즉위 전후 맥락상 직계 아버지를 뜻합니다.
theological_decisions:
- issue: 다윗과의 비교가 주는 제한적 칭찬을 어떻게 살릴지
  chosen_reading: 첫 절은 실제 칭찬이지만, 곧바로 다윗과의 불일치와 요아스의 전례를 덧붙여 그 칭찬을 제한하는 구조를 그대로 유지했습니다.
  alternative_readings:
  - 그는 야훼 보시기에 옳은 일을 했습니다. 그러나 다윗과는 달랐습니다.
  - 그는 야훼 보시기에 옳은 일을 행했지만, 다윗처럼은 아니었습니다.
  rationale: 본문은 단순 칭찬도, 단순 비난도 아니라 평가와 제한이 함께 있는 구조이므로 그 긴장을 보존해야 합니다.
  doctrine_reference: 본문의 평가적 긴장을 평준화하지 말 것
