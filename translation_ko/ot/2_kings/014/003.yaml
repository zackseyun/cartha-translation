revisions:
- from: 그는 야훼 보시기에 옳은 일을 행했으나, 그의 조상 다윗과는 같지 않았습니다. 오히려 그의 아버지 요아스가 한 모든 일을 따라 했습니다.[a][b][c]
  to: 그는 야훼 보시기에 옳은 일을 행했으나, 다만 그의 조상 다윗[a]과 같지는 않았습니다.[b] 그는 그의 아버지 요아스[c]가 한 모든 일을 따라 했습니다.
  rationale: 원문의 긍정적 왕 평가와 그에 뒤따르는 제한을 ‘했으나, 다만’으로 보존했습니다. 원문에 없는 ‘오히려’를 삭제하여 요아스의 행위를 다윗과의 배타적 선택처럼 만들지 않았으며, 각주 표지를 해당 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
