source:
  edition: WLC
  text: כִּי רָאָ֧ה יְהוָ֛ה אֶת עֳנִ֥י יִשְׂרָאֵ֖ל מֹרֶ֣ה מְאֹ֑ד וְ/אֶ֤פֶס עָצוּר֙ וְ/אֶ֣פֶס עָז֔וּב וְ/אֵ֥ין עֹזֵ֖ר לְ/יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/026.yaml
  text: For Yahweh saw that the affliction of Israel was very bitter[a], and there was neither bond nor free[b], and there was no helper for Israel.
  footnotes:
  - marker: a
    text: Or 'was very grievous' or 'was very severe.' The Hebrew expression is difficult, but it clearly intensifies Israel’s suffering.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''there was neither bond nor free.'' The expression likely means that no one at all remained to help, or that every class was exhausted.'
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서는 이스라엘의 고통이 매우 쓰라린 것을 보셨고, 묶인 자도 풀린 자도 없으며 이스라엘을 도울 자도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 난해하지만, 이스라엘의 고통이 매우 극심했다는 점을 분명히 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구로, 문자적으로는 ‘묶인 자도 풀린 자도’라는 뜻입니다. 곧 누구도 남아 있지 않았다는 의미로 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / 프로젝트 기본값
  rationale: 언약적 하나님의 이름을 본문에서 분명히 드러내기 위해 프로젝트 기본값인 ‘야훼’를 따랐습니다.
- source_word: עֳנִי
  english_pob_choice: affliction
  chosen_korean: 고통
  alternatives_korean:
  - 환난
  - 괴로움
  - 비참함
  lexicon: HALOT
  rationale: 국가적 차원의 고난과 압박을 자연스러운 현대 한국어로 옮기되, 경제적 빈곤으로 좁히지 않기 위해 ‘고통’을 택했습니다.
- source_word: מֹרֶה מְאֹד
  english_pob_choice: very bitter
  chosen_korean: 매우 쓰라린
  alternatives_korean:
  - 매우 비참한
  - 매우 심한
  - 매우 괴로운
  lexicon: HALOT
  rationale: 히브리어 표현의 난해함을 반영하면서도 본문의 고통스러운 شدت을 살리기 위해 ‘쓰라린’을 사용했습니다.
- source_word: עָצוּר וְעָזוּב
  english_pob_choice: bond nor free
  chosen_korean: 묶인 자도 풀린 자도
  alternatives_korean:
  - 노예도 자유인도
  - 가둔 자도 놓인 자도
  - 억눌린 자도 버려진 자도
  lexicon: HALOT
  rationale: 영어 POB가 지적한 관용구의 총체적 부재를 한국어로 자연스럽게 드러내기 위해, 문자적 대구를 살리면서도 관용적 의미가 보이도록 번역했습니다.
theological_decisions:
- issue: עָצוּר וְעָזוּב의 관용구 처리
  chosen_reading: ‘묶인 자도 풀린 자도’로 옮겨, 사회적 신분 대비보다 ‘아무도 남아 있지 않음’이라는 총체적 부재를 드러냈습니다.
  alternative_readings:
  - 노예도 자유인도
  - 억눌린 자도 버려진 자도
  - 아무도 남지 않았다
  rationale: 본문의 요지는 특정 계층 구분이 아니라 이스라엘을 도울 사람이 완전히 사라졌다는 점이므로, 관용구의 기능을 우선해 해석했습니다.
  doctrine_reference: Translation philosophy §3, §5
- issue: מֹרֶה מְאֹד의 난해한 의미
  chosen_reading: ‘매우 쓰라린’으로 본문에 반영하되, 과도하게 해석하지 않았습니다.
  alternative_readings:
  - 매우 비참한
  - 매우 심한
  - 매우 괴로운
  rationale: 어근의 정확한 뉘앙스가 논쟁적이므로, 고통의 강도를 살리면서도 단정적 의미 확장을 피했습니다.
  doctrine_reference: Translation philosophy §3
