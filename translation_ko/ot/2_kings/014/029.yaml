source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יָֽרָבְעָם֙ עִם אֲבֹתָ֔י/ו עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ זְכַרְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/029.yaml
  text: And Jeroboam slept with his fathers[a], with the kings of Israel[b], and Zechariah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'lay down with his fathers'; the Hebrew idiom is a conventional formula for a king's death.
    reason: lexical_alternative
  - marker: b
    text: Or 'among the kings of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여로보암이 그의 조상들과 함께 누웠고, 이스라엘의 왕들과 함께 누웠으며, 그의 아들 스가랴가 그의 뒤를 이어 왕이 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들과 함께 누웠다’; 히브리어 관용구는 왕의 죽음을 나타내는 관례적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 왕들 가운데’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 누웠고
  alternatives_korean:
  - 잠들었고
  - 죽었고
  lexicon: HALOT
  rationale: '''עם אבותיו''와 결합된 왕의 사망 관용구를 살리기 위해 직설적이면서도 완곡한 ‘누웠고’로 옮겼습니다. ‘죽었고’는 의미는 분명하지만 관용적 표현을 평평하게 만듭니다.'
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 히브리어의 관용적 왕실 사망 공식을 한국어에서 자연스럽게 살리기 위해 ‘조상들’로 옮겼습니다. ‘아버지들’은 직역이지만 현대 한국어에서는 다소 부자연스럽습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 다스렸습니다
  - 통치했습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 통치 행위보다 계승 이후의 즉위 사실이 핵심이므로, 한국어 왕실 연대기 문맥에 맞게 ‘왕이 되었습니다’로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그의 뒤를 이어
  alternatives_korean:
  - 그를 대신하여
  - 그의 자리에
  lexicon: HALOT
  rationale: 왕위 계승의 의미를 분명히 하면서도 한국어 역사 서술에서 자연스러운 표현인 ‘그의 뒤를 이어’를 택했습니다.
theological_decisions:
- issue: 왕의 죽음 관용구를 현대 한국어에서 어떻게 드러낼지
  chosen_reading: ‘누웠고’로 유지해 히브리어의 관용적 사망 공식을 드러냈습니다.
  alternative_readings:
  - 직접적으로 ‘죽었고’로 번역
  - 완곡하게 ‘잠들었고’로 번역
  rationale: 본문은 단순한 사망 통보가 아니라 왕조 연대기의 정형구를 사용하므로, 직역과 관용 사이의 긴장을 보존하는 것이 중요합니다. ‘누웠고’는 그 형식을 비교적 직접적으로 반영합니다.
  doctrine_reference: 서술 관용구와 본문 형식 보존
