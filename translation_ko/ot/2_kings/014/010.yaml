id: 2KI.14.10
reference: 2 Kings 14:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הַכֵּ֤ה הִכִּ֨יתָ֙ אֶת אֱד֔וֹם וּֽ/נְשָׂאֲ/ךָ֖ לִבֶּ֑/ךָ הִכָּבֵד֙ וְ/שֵׁ֣ב בְּ/בֵיתֶ֔/ךָ וְ/לָ֤/מָּה תִתְגָּרֶה֙ בְּ/רָעָ֔ה וְ/נָ֣פַלְתָּ֔ה אַתָּ֖ה וִ/יהוּדָ֥ה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/010.yaml
  text: You have indeed struck Edom[a], and your heart has lifted you up. Be honored, and stay at home. Why should you provoke disaster[b], so that you fall—you and Judah with you?
  footnotes:
  - marker: a
    text: Or 'your heart has become proud.' The Hebrew idiom is literally 'your heart has lifted you up.'
    reason: lexical_alternative
  - marker: b
    text: Or 'be honored' / 'boast.' The Hebrew likely means to take honor from your victory.
    reason: lexical_alternative
translation:
  language: ko
  text: “네가 에돔을 쳐서 이기고, 네 마음이 교만해졌으니, 영광을 취하고 집에 머물러 있으십시오. 왜 재앙을 불러들여, 당신과 함께 유다까지 쓰러지게 하겠습니까?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘네 마음이 너를 들어 올렸다’는 뜻이며, 여기서는 교만을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 동사는 분쟁이나 재앙을 자초하는 행동을 가리키며, 문맥상 전쟁을 더 키우지 말라는 경고입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה הִכִּיתָ
  english_pob_choice: You have indeed struck
  chosen_korean: 네가 에돔을 쳐서 이기고
  alternatives_korean:
  - 네가 에돔을 쳤습니다
  - 네가 에돔을 쳐부수었습니다
  lexicon: HALOT
  rationale: 히브리어의 강조형(절대부정사+완료형)은 단순한 행위 이상을 나타내므로, 승리의 맥락을 살려 자연스럽게 ‘쳐서 이기고’로 옮겼습니다.
- source_word: וּנְשָׂאֲךָ לִבֶּךָ
  english_pob_choice: your heart has lifted you up
  chosen_korean: 네 마음이 교만해졌으니
  alternatives_korean:
  - 네 마음이 너를 높였으니
  - 네 마음이 들떠 올랐으니
  lexicon: HALOT
  rationale: 직역하면 ‘네 마음이 너를 들어 올렸다’이지만, 관용적 의미인 교만을 드러내되 POB가 지적한 심장/마음의 이미지도 과도하게 지우지 않도록 했습니다.
- source_word: הִכָּבֵד
  english_pob_choice: Be honored
  chosen_korean: 영광을 취하고
  alternatives_korean:
  - 존귀를 받으십시오
  - 스스로 영광스럽게 여기십시오
  - 자랑하십시오
  lexicon: HALOT
  rationale: 니팔 명령형은 여기서 승리의 명예를 ‘누리라/취하라’는 뜻으로 이해되므로, 지나치게 교회적이거나 도덕화된 표현보다 원문의 반어적 권고를 살렸습니다.
- source_word: וְשֵׁב בְּבֵיתֶךָ
  english_pob_choice: and stay at home
  chosen_korean: 집에 머물러 있으십시오
  alternatives_korean:
  - 집에 앉아 있으십시오
  - 자기 집에 있으십시오
  lexicon: HALOT
  rationale: 명령형과 장소구문이 전하는 ‘더 나아가지 말고 거기 머물라’는 뜻을 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: וְלָמָּה תִתְגָּרֶה בְּרָעָה
  english_pob_choice: Why should you provoke disaster
  chosen_korean: 왜 재앙을 불러들여
  alternatives_korean:
  - 왜 싸움을 일으켜
  - 왜 화를 자초하여
  lexicon: HALOT
  rationale: תִתְגָּרֶה는 단순한 감정 자극보다 분쟁·재난을 자초하는 행동을 뜻하므로, 결과를 분명히 하는 ‘재앙을 불러들여’로 번역했습니다.
- source_word: וְנָפַלְתָּה אַתָּה וִיהוּדָה עִמָּךְ
  english_pob_choice: so that you fall—you and Judah with you
  chosen_korean: 당신과 함께 유다까지 쓰러지게 하겠습니까?
  alternatives_korean:
  - 당신과 유다가 함께 쓰러지겠습니까
  - 당신과 유다가 함께 넘어지게 하겠습니까
  lexicon: HALOT
  rationale: 결과절을 한국어 질문 구조로 자연화하되, 왕의 سقوط이 유다 전체의 몰락으로 이어진다는 점을 유지했습니다.
theological_decisions:
- issue: 아마샤에게 주어진 경고의 어조
  chosen_reading: 직접적 훈계와 경고의 어조를 유지해, 반어적 명령(‘영광을 취하고…’)을 실제 허용이 아니라 자제 촉구로 드러냈습니다.
  alternative_readings:
  - 보다 완곡한 권고문처럼 옮김
  - 단순한 조언으로 약화
  rationale: 문맥상 이것은 허락이 아니라 전쟁 확대를 막는 경고입니다. 반어를 희미하게 하면 본문의 긴장과 예언적 설득력이 약해집니다.
  doctrine_reference: 본문 주해상 경고의 수사학
- issue: הִכָּבֵד의 의미 범위
  chosen_reading: ‘영광을 취하고’로 옮겨 승전의 명예를 누리라는 반어적 뉘앙스를 살렸습니다.
  alternative_readings:
  - 존귀를 받으십시오
  - 자랑하십시오
  rationale: 영광/자랑의 양가성이 있으나, 문맥은 전쟁 승리 후 더 큰 교전을 삼가라는 뜻이므로 과도한 긍정이나 비난으로 치우치지 않게 했습니다.
  doctrine_reference: 본문 수사와 문맥
- issue: 유다의 공동 책임
  chosen_reading: 왕 개인의 교만이 왕국 전체의 재앙으로 이어질 수 있음을 ‘당신과 함께 유다까지’로 보존했습니다.
  alternative_readings:
  - 당신만 쓰러질 것이라고 축소
  - 유다를 별도로 설명
  rationale: 히브리어는 왕과 나라를 함께 묶어 سقوط을 경고하므로, 공동 파국의 범위를 유지하는 것이 본문 의미에 충실합니다.
  doctrine_reference: 역사서의 공동체적 심판
