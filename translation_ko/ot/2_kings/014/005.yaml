  yaml_path: translation/ot/2_kings/014/005.yaml
  text: And it happened[a], as soon as the kingdom was firmly in his hand[b], that he struck down his servants who had struck down the king his father.
  footnotes:
  - marker: a
    text: Or, 'when the kingdom was established in his hand.' The Hebrew idiom refers to his rule being securely consolidated.
    reason: lexical_alternative
  - marker: b
    text: 'The same Hebrew verb is used for both Amaziah''s action and the servants'' action: he ''struck down'' those who had ''struck down'' his father.'
    reason: lexical_alternative
translation:
  language: ko
  text: 왕권이 그의 손에 굳게 들어오자[a], 그는 자기 아버지인 왕을 죽인 자기 신하들을 죽였습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕권이 그의 손 안에서 확고해지자’라고 옮길 수 있습니다. 히브리어 표현은 그의 통치권이 확고히 장악되었음을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 왕이 신하들을 ‘친’ 것과 신하들이 그의 아버지인 왕을 ‘친’ 것에 같은 동사를 사용합니다. 이 문맥에서는 두 경우 모두 죽임을 가리킵니다.
    reason: lexical_alternative
