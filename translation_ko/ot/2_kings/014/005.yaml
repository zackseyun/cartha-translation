    rationale: 본문의 반복은 וַיַּךְ와 הַמַּכִּים, 곧 왕이 신하들을 친 행위와 신하들이 왕을 친 행위 사이에 있습니다. 왕권이 굳어지는 표현에는 다른 어근 חזק이 쓰였습니다.
  - severity: low
