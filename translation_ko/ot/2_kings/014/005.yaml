  rationale: 왕권이 안정적으로 장악된 상태를 한국어 관용으로 살리되, ‘손에’라는 히브리어 이미지를 유지했습니다.
- source_word: וַיַּךְ
  english_pob_choice: he struck down
  chosen_korean: 쳐죽였습니다
  alternatives_korean:
  - 쳐서 죽였습니다
  - 죽였습니다
  - 쳐서 쓰러뜨렸습니다
  lexicon: HALOT
  rationale: 이 문맥에서는 단순한 ‘치다’보다 살해 결과가 분명하므로, 앞뒤 동일 동사 반복을 살리면서도 결과를 분명히 하는 표현을 택했습니다.
