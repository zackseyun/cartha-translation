theological_decisions:
- issue: 왕권이 굳게 선 뒤의 보복 행위 묘사
  chosen_reading: 본문의 사건 순서를 그대로 따라, 왕권이 안정된 뒤 아버지를 죽인 자들을 처형한 것으로 옮겼습니다.
  alternative_readings:
  - 도덕적 평가를 덧붙여 ‘복수했다’로 옮기는 방식
  - 행동을 완화해 ‘벌했습니다’로 옮기는 방식
  rationale: 히브리어 본문은 사건 서술에 집중하며 동기의 평가를 직접 말하지 않으므로, 서술의 긴장과 냉혹함을 유지했습니다.
  doctrine_reference: 서사 본문의 기술적/서술적 진술
