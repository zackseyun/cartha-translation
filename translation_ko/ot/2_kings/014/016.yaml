id: 2KI.14.16
reference: 2 Kings 14:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יְהוֹאָשׁ֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ בְּ/שֹׁ֣מְר֔וֹן עִ֖ם מַלְכֵ֣י יִשְׂרָאֵ֑ל וַ/יִּמְלֹ֛ךְ יָרָבְעָ֥ם בְּנ֖/וֹ תַּחְתָּֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/016.yaml
  text: And Jehoash slept with his fathers and was buried in Samaria with the kings of Israel, and Jeroboam his son reigned in his place.
translation:
  language: ko
  text: 그리고 여호아스는 그의 조상들과 함께 잠들었고, 사마리아에서 이스라엘 왕들과 함께 장사되었으며, 그의 아들 여로보암이 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: slept with his fathers
  chosen_korean: 그의 조상들과 함께 잠들어
  alternatives_korean:
  - 그의 아버지들과 함께 잠들어
  - 죽어
  lexicon: HALOT
  rationale: 왕들의 죽음 공식을 한국어로도 유지하되, 직역의 어색함을 줄이기 위해 '잠들어'를 택했습니다. '조상들'은 히브리어 관용구의 포괄적 의미를 살립니다.
- source_word: וַיִּקָּבֵר ... בְּשֹׁמְרוֹן
  english_pob_choice: was buried in Samaria
  chosen_korean: 사마리아에 있는 ... 장사되었으며
  alternatives_korean:
  - 사마리아에 묻혔으며
  - 사마리아에서 장사되었으며
  lexicon: HALOT
  rationale: 수동형 매장 동사를 살리면서 한국어 성경 문체에 자연스러운 '장사되다'를 사용했습니다. 장소는 '에 있는'으로 풀어 위치 관계를 분명히 했습니다.
- source_word: עִם מַלְכֵי יִשְׂרָאֵל
  english_pob_choice: with the kings of Israel
  chosen_korean: 이스라엘 왕들과 함께
  alternatives_korean:
  - 이스라엘의 왕들 가운데
  - 이스라엘 왕들 곁에
  lexicon: HALOT
  rationale: 왕들과의 동반 매장이라는 의미를 살려 '함께'로 옮겼습니다. 이 표현은 단순한 위치보다 묘지적 연관성을 더 잘 드러냅니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그를 대신하여 통치했습니다
  - 그 자리를 이어 다스렸습니다
  lexicon: HALOT
  rationale: תַּחְתָּיו의 계승 의미를 한국어의 자연스러운 왕위 계승 표현으로 옮겼습니다. '왕이 되었습니다'는 מלך의 즉위/통치 개시를 함께 반영합니다.
theological_decisions:
- issue: 왕정 연대기 공식의 죽음 표현
  chosen_reading: '''잠들어''를 사용해 죽음을 직접적이지만 완곡한 왕정 공식으로 유지했습니다.'
  alternative_readings:
  - '''죽었습니다''로 명시적으로 번역'
  - '''돌아가셨습니다''로 보다 완곡하게 번역'
  rationale: 본문은 서술적 정보보다 연대기적 관용구를 사용하므로, 지나치게 평이한 '죽다'보다 원문의 공식성을 보존하는 편이 더 적절합니다.
  doctrine_reference: 성경 번역의 관용구 보존 원칙
- issue: 매장 장소와 동반 매장의 연결
  chosen_reading: 사마리아에서의 매장과 이스라엘 왕들과의 동반 매장을 한 문장 안에서 병렬로 유지했습니다.
  alternative_readings:
  - 두 정보를 분리해 번역
  - '''함께''를 약화시켜 단순 위치로 처리'
  rationale: 본문의 핵심은 여호아스가 왕들의 묘역에 속하는 방식으로 매장되었다는 점이므로, 장소와 동반성을 함께 드러내는 것이 स्रोत의 의미를 더 정확히 반영합니다.
  doctrine_reference: 본문 서술 충실성
