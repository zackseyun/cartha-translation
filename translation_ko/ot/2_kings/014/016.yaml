  to: 그리고 여호아스는 그의 조상들과 함께 잠들었고, 사마리아에서 이스라엘 왕들과 함께 장사되었으며, 그의 아들 여로보암이 그의 뒤를 이어 왕이 되었습니다.
  rationale: 사마리아를 매장 장소로, 이스라엘 왕들과의 관계를 동반 매장으로 명확히 구분하여 히브리어 전치사구들의 수식 관계를 보존했습니다. 그 밖의 왕실 사망 및 왕위 계승 공식은 초안의 적절한 표현을 유지했습니다.
