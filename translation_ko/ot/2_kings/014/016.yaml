review_pass:
  verdict: revise
  source_fidelity: 히브리어의 왕실 사망·매장·계승 공식의 순서와 핵심 의미는 대체로 충실합니다. 다만 ‘사마리아에 있는 이스라엘 왕들과 함께’는 수식 범위상 ‘사마리아에 있는 왕들’로 읽힐 수 있어, 사마리아가 매장 장소라는 בְּשֹׁמְרוֹן의 기능을 더 분명히 드러내는 편이 안전합니다.
  naturalness: ‘그의 조상들과 함께 잠들어’와 ‘그의 뒤를 이어 왕이 되었습니다’는 자연스럽고 현대 표준 한국어 합쇼체에 맞습니다. 매장 구절은 ‘사마리아에서 … 함께 장사되었으며’로 정리하면 수식 관계와 문장 흐름이 더 명료해집니다.
  terminology: 여호아스, 사마리아, 이스라엘, 여로보암의 표기는 적절합니다. ‘조상들과 함께 잠들다’는 원문의 관용적 사망 표현을 무리 없이 보존하며, ‘장사되다’도 왕정 서술 문맥에 적합합니다.
  issues:
  - severity: medium
    issue: ‘사마리아에 있는 이스라엘 왕들과 함께’의 수식 관계가 모호합니다.
    rationale: 원문은 ‘사마리아에’(매장 장소)와 ‘이스라엘 왕들과 함께’(동반·연관 매장)를 병렬로 제시합니다. 현 번역은 ‘사마리아에 있는’이 바로 뒤의 ‘이스라엘 왕들’을 꾸미는 것으로 해석될 여지가 있으므로, 장소 부사를 ‘장사되었으며’에 직접 연결해야 합니다.
  revised_text: 그리고 여호아스는 그의 조상들과 함께 잠들었고, 사마리아에서 이스라엘 왕들과 함께 장사되었으며, 그의 아들 여로보암이 그의 뒤를 이어 왕이 되었습니다.
