  text: And Judah was defeated before Israel[a], and each man fled to his tent.
  footnotes:
  - marker: a
    text: Or 'each one fled to his home.' The Hebrew reads literally, 'each man to his tent,' a common idiom for dispersing to one's dwelling.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다가 이스라엘 앞에서 패하였고, 각 사람이 자기 장막으로 도망하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘각 사람이 자기 집으로 도망하였습니다’라고도 옮길 수 있습니다. 히브리어는 문자적으로 ‘각 사람이 자기 장막으로’라고 하며, 자기 거처로 흩어짐을 나타내는 관용구입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּנָּגֶף
  english_pob_choice: was defeated
  chosen_korean: 패하였고
  alternatives_korean:
  - 패배하였고
  - 무찔림을 당하였고
  - 쳐졌고
  lexicon: HALOT
  rationale: נָגַף의 니팔형은 전투 맥락에서 단순히 ‘맞다’보다 ‘패하다/패배하다’의 의미가 분명하므로, 현대 한국어에서 자연스러운 군사적 패배 표현을 택했습니다.
- source_word: לִפְנֵי
  english_pob_choice: before
  chosen_korean: 앞에서
  alternatives_korean:
  - 앞에
  - 면전에서
  - 앞에 서서
  lexicon: HALOT
  rationale: 전투 문맥에서 לִפְנֵי는 상대를 상대로 열세가 되어 무너지는 관계를 나타내므로, ‘앞에서’가 원문의 공간적·대항적 감각을 간결하게 살립니다.
- source_word: אִישׁ לְאָהֳלוֹ
  english_pob_choice: each man fled to his tent
  chosen_korean: 각 사람이 자기 장막으로 도망하였습니다
  alternatives_korean:
  - 각 사람이 자기 집으로 도망하였습니다
  - 사람마다 자기 장막으로 달아났습니다
  - 각자 자기 집으로 흩어졌습니다
  lexicon: HALOT
  rationale: 직역하면 ‘각 사람은 자기 장막으로’이지만, 한국어에서는 ‘도망하다’가 전투 패주를 더 분명히 드러내며, ‘장막’은 원문의 이미지와 관용구를 보존합니다.
theological_decisions:
- issue: 전투 패배와 도주를 어떻게 옮길 것인가
  chosen_reading: 군사적 패배와 집단적 패주를 직설적으로 드러내는 표현을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘물러났습니다’로 완화
  - ‘흩어졌습니다’로 일반화
  rationale: 본문은 유다가 이스라엘 앞에서 실제로 무너졌고 개인들이 흩어져 달아난 상황을 말하므로, 서술의 강도를 낮추지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 역사 서술의 사실성 보존
- issue: ‘장막’ 관용구를 ‘집’으로 풀어쓸지 여부
  chosen_reading: 원문의 관용적 이미지인 ‘장막’을 유지했습니다.
  alternative_readings:
  - 의역하여 ‘집’으로 변경
  - 관용구를 설명적으로 확장
  rationale: 히브리어의 상투적 표현을 한국어 일반 독자에게도 보이게 하되, 의미상 낯설 수 있는 부분은 주석 없이 최소한의 직역으로 보존했습니다.
  doctrine_reference: 원문 이미지 보존
