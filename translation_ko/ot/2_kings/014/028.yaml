id: 2KI.14.28
reference: 2 Kings 14:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶתֶר֩ דִּבְרֵ֨י יָרָבְעָ֜ם וְ/כָל אֲשֶׁ֤ר עָשָׂה֙ וּ/גְבוּרָת֣/וֹ אֲשֶׁר נִלְחָ֔ם וַ/אֲשֶׁ֨ר הֵשִׁ֜יב אֶת דַּמֶּ֧שֶׂק וְ/אֶת חֲמָ֛ת לִ/יהוּדָ֖ה בְּ/יִשְׂרָאֵ֑ל הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/028.yaml
  text: Now the rest of the acts of Jeroboam[a], and all that he did, and his might, how he fought, and how he restored Damascus and Hamath to Judah in Israel—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: 'Hebrew: ''to Judah in Israel.'' The phrase is difficult. It may mean territory restored for Israel that had once belonged to Judah, or it may preserve an older geopolitical designation. The main text keeps the Hebrew wording as closely as possible without resolving the ambiguity.'
    reason: alternative_reading
translation:
  language: ko
  text: 여로보암의 남은 행적과 그가 한 모든 일, 그의 용맹과 그가 싸운 일, 그리고 그가 다마스쿠스와 하맛을 이스라엘 안의 유다에게 회복시킨 일은 이스라엘 왕들의 역대기 책에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이스라엘 안의 유다에게’라고 되어 있습니다. 이 구절은 뜻이 분명하지 않으며, 유다에 속했던 땅을 이스라엘을 위해 회복했다는 뜻일 수도 있고, 더 오래된 지리·정치적 명칭을 보존한 것일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 남은 행적
  alternatives_korean:
  - 남은 일들
  - 남은 말들
  - 남은 사건들
  lexicon: HALOT
  rationale: 왕정 연대기 공식문맥에서 דִּבְרֵי는 단순한 '말'보다 행적·사적의 뜻으로 읽히므로, 한국어에서는 자연스러운 관용인 '행적'으로 압축해 옮겼습니다.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר נִלְחָם
  english_pob_choice: and his might, how he fought
  chosen_korean: 그의 용맹과 그가 싸운 일
  alternatives_korean:
  - 그의 힘과 그가 싸운 일
  - 그의 용사다운 행위와 그가 싸운 일
  - 그의 무용과 전쟁한 일
  lexicon: HALOT
  rationale: גְּבוּרָה는 여기서 단순한 힘보다 전투적 용맹을 가리키므로 '용맹'이 문맥에 가장 가깝습니다. נִלְחָם은 전쟁 수행을 포함하는 넓은 표현이지만, 한국어에서는 과도하게 군사화하지 않고 '싸운 일'로 유지했습니다.
- source_word: וַאֲשֶׁר הֵשִׁיב אֶת דַּמֶּשֶׂק וְאֶת חֲמָת לִיהוּדָה בְּיִשְׂרָאֵל
  english_pob_choice: and how he restored Damascus and Hamath to Judah in Israel
  chosen_korean: 그리고 그가 다마스쿠스와 하맛을 이스라엘 안의 유다에게 회복시킨 일
  alternatives_korean:
  - 그리고 그가 다마스쿠스와 하맛을 유다에게 회복시킨 일
  - 그리고 그가 다마스쿠스와 하맛을 이스라엘의 유다에게 되찾아 준 일
  - 그리고 그가 다마스쿠스와 하맛을 유다에 속한 이스라엘에게 회복시킨 일
  lexicon: HALOT
  rationale: הֵשִׁיב은 '회복시키다/되돌리다'가 기본이므로 '회복시킨'을 택했습니다. הִבְחִין해야 할 난구인 לִיהוּדָה בְּיִשְׂרָאֵל은 POB의 보수적 처리에 따라 해석을 풀지 않고 '이스라엘 안의 유다에게'로 최대한 가깝게 남겼습니다.
- source_word: הֲלֹא הֵם כְּתוּבִים עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: are they not written in the Book of the Chronicles of the Kings of Israel?
  chosen_korean: 실록에 실린 이스라엘 왕들의 역대기 책에 기록되어 있지 않습니까?
  alternatives_korean:
  - 이스라엘 왕들의 역대기 책에 기록되어 있지 않습니까?
  - 이스라엘 왕들의 실록책에 기록되어 있지 않습니까?
  - 이스라엘 왕들의 역대지에 기록되어 있지 않습니까?
  lexicon: HALOT
  rationale: 직역하면 '날들의 말씀/기록의 책'이지만, 역사서 관용구로서는 '역대기 책'이 가장 투명합니다. '실록'을 함께 두어 공문서·연대기적 성격을 드러냈고, רטורिकल 질문 형식은 한국어의 정중한 의문으로 살렸습니다.
theological_decisions:
- issue: 난구 לִיהוּדָה בְּיִשְׂרָאֵל의 처리
  chosen_reading: 본문의 불확실성을 해소하지 않고 '이스라엘 안의 유다에게'로 남겨 두었습니다.
  alternative_readings:
  - '''유다를 위하여'''
  - '''이스라엘에 속한 유다에게'''
  - '''유다 땅을 이스라엘로 돌려준'''
  rationale: 이 절은 지리·정치 관계가 압축되어 있어 단정적으로 의미를 풀면 본문의 애매성을 지워 버립니다. POB의 보수적 원칙에 따라 독자가 난점을 그대로 보도록 했습니다.
  doctrine_reference: 본문 해석의 절제와 난구 보존
