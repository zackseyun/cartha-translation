id: 2KI.14.17
reference: 2 Kings 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחִ֨י אֲמַצְיָ֤הוּ בֶן יוֹאָשׁ֙ מֶ֣לֶךְ יְהוּדָ֔ה אַֽחֲרֵ֣י מ֔וֹת יְהוֹאָ֥שׁ בֶּן יְהֽוֹאָחָ֖ז מֶ֣לֶךְ יִשְׂרָאֵ֑ל חֲמֵ֥שׁ עֶשְׂרֵ֖ה שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/017.yaml
  text: Amaziah son of Joash[a], king of Judah, lived fifteen years after the death of Jehoash son of Jehoahaz, king of Israel.
  footnotes:
  - marker: a
    text: The names 'Joash' and 'Jehoash' are variant English forms reflecting different Hebrew spellings in this verse; the translation keeps them distinct to avoid confusion between the king of Judah and the king of Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 아마샤는 유다 왕 요아스의 아들로서, 이스라엘 왕 여호아하스의 아들 여호아스가 죽은 뒤 십오 년 동안 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문에는 유다 왕의 아버지 이름 יוֹאָשׁ와 이스라엘 왕의 이름 יְהוֹאָשׁ가 서로 다르게 적혀 있습니다. 한국어 본문에서는 혼동을 줄이기 위해 각각 요아스와 여호아스로 구분했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  english_pob_choice: lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 살아 있었습니다
  - 생존했습니다
  lexicon: HALOT
  rationale: 왕들의 연대기를 알리는 서술이므로, 단순한 생존보다 자연스럽고 중립적인 ‘살았습니다’가 영어 POB의 ‘lived’를 가장 잘 반영합니다.
- source_word: בֶן יוֹאָשׁ
  english_pob_choice: son of Joash
  chosen_korean: 유다 왕 요아스의 아들
  alternatives_korean:
  - 요아스의 아들
  - 요아스 왕의 아들
  lexicon: HALOT
  rationale: 본문은 아마샤를 동일한 이름의 다른 왕과 구별하기 위해 유다 왕 요아스를 가리키므로, 왕호를 함께 밝혀 혼동을 피했습니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  - 유다의 통치자
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스럽게 옮기되, 왕의 소속 왕국을 분명하게 드러내는 표준적 표현을 택했습니다.
- source_word: אַחֲרֵי מוֹת
  english_pob_choice: after the death of
  chosen_korean: 죽은 뒤
  alternatives_korean:
  - 죽은 후
  - 사망한 뒤
  lexicon: HALOT
  rationale: 명사구를 직역하기보다 한국어 연대기 문맥에 자연스러운 시간 부사절로 옮겨 의미와 흐름을 보존했습니다.
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה
  english_pob_choice: fifteen years
  chosen_korean: 십오 년
  alternatives_korean:
  - 열다섯 해
  - 15년
  lexicon: HALOT
  rationale: 기간 표현이므로 한자어 수사 ‘십오 년’이 연대기 문체에 가장 적합하며, 본문의 정밀한 수량을 유지합니다.
theological_decisions:
- issue: 두 왕의 이름이 모두 요아스 계열로 나와 혼동될 수 있는 점
  chosen_reading: 유다 왕 요아스와 이스라엘 왕 여호아하스의 아들 여호아스를 구분하여 표기했습니다.
  alternative_readings:
  - 두 이름을 모두 ‘요아스’로 단순화
  - 여호아스/요아스 구분 없이 같은 표기로 처리
  rationale: 본문의 역사적 식별 기능을 해치지 않으면서, 영어 POB의 구분 의도를 한국어에서도 보존해야 하기 때문입니다.
  doctrine_reference: 본문의 역사 서술 보존과 인명 식별의 명료성
