source:
  edition: WLC
  text: ה֗וּא הֵשִׁיב֙ אֶת גְּב֣וּל יִשְׂרָאֵ֔ל מִ/לְּב֥וֹא חֲמָ֖ת עַד יָ֣ם הָ/עֲרָבָ֑ה כִּ/דְבַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר דִּבֶּ֗ר בְּ/יַד עַבְדּ֞/וֹ יוֹנָ֤ה בֶן אֲמִתַּי֙ הַ/נָּבִ֔יא אֲשֶׁ֖ר מִ/גַּ֥ת הַחֵֽפֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/025.yaml
  text: He restored the border of Israel from Lebo-hamath as far as the Sea of the Arabah[a], according to the word of Yahweh, the God of Israel, which he had spoken by the hand of his servant Jonah son of Amittai, the prophet[b], who was from Gath-hepher.
  footnotes:
  - marker: a
    text: Or, more literally, “from the entrance of Hamath.”
    reason: lexical_alternative
  - marker: b
    text: That is, likely the Dead Sea.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼, 곧 이스라엘의 하나님이 말씀하신 대로 이스라엘의 경계를 하맛으로 들어가는 곳에서부터 아라바의 바다까지 회복하였습니다. 그 말씀은 야훼께서 그의 종이며 예언자였던 아밋대의 아들 요나를 통해 하신 것이었습니다. 그는 가드헤벨 출신이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “하맛으로 들어가는 곳에서부터”입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 아라바의 바다는 사해를 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵשִׁיב
  english_pob_choice: restored
  chosen_korean: 회복하였습니다
  alternatives_korean:
  - 되돌렸습니다
  - 다시 세웠습니다
  lexicon: HALOT
  rationale: 경계의 재설정을 뜻하는 동사로 이해하여, 단순한 이동보다 원상 회복의 뉘앙스를 살렸습니다.
- source_word: גְּבוּל
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 영토 경계
  - 국경
  lexicon: HALOT
  rationale: 국가 간 정치적 경계선의 의미를 현대 한국어로 자연스럽게 옮기되, 본문이 말하는 지리적 한계를 보존했습니다.
- source_word: מִלְּבוֹא חֲמָת
  english_pob_choice: from Lebo-hamath
  chosen_korean: 하맛으로 들어가는 곳에서부터
  alternatives_korean:
  - 레보하맛에서부터
  - 하맛의 입구에서부터
  lexicon: HALOT
  rationale: 고유지명으로 굳어진 표현을 그대로 음역하기보다, 원문의 직역 가능성을 살려 지리적 의미가 보이게 했습니다.
- source_word: יָם הָעֲרָבָה
  english_pob_choice: the Sea of the Arabah
  chosen_korean: 아라바의 바다
  alternatives_korean:
  - 아라바 바다
  - 사해
  lexicon: HALOT
  rationale: 본문의 지리 표현을 직접 반영했고, 사해로의 동일시는 본문 밖 해석이므로 본문에는 넣지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본어인 신명 ‘야훼’를 유지해 원문의 고유명을 드러냈습니다.
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: 통하여
  alternatives_korean:
  - 그의 손을 통해
  - 그의 손으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 대리·매개 의미를 한국어에서 자연스럽게 전달하면서도, 예언자 매개의 성격을 보존했습니다.
- source_word: עַבְדּוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 노예
  - 그의 종자
  lexicon: HALOT
  rationale: 예언자 소명 문맥에서 관계적·신학적 표현으로는 ‘종’이 가장 적절하며, ‘노예’는 이 구절의 어감에 과도합니다.
- source_word: הַנָּבִיא
  english_pob_choice: the prophet
  chosen_korean: 예언자
  alternatives_korean:
  - 선지자
  - 예언자이신 사람
  lexicon: HALOT
  rationale: 표준어 현대 한국어에서 기능을 직접 드러내는 ‘예언자’가 자연스럽고, 원문의 직함을 분명히 합니다.
- source_word: מִגַּת הַחֵפֶר
  english_pob_choice: from Gath-hepher
  chosen_korean: 가드헤벨 출신이었습니다
  alternatives_korean:
  - 가드헤벨에서 왔습니다
  - 가드헤벨 사람입니다
  lexicon: HALOT
  rationale: 출신지 표지를 한국어 관용에 맞게 풀어, 지명과 출신 관계를 명확히 했습니다.
theological_decisions:
- issue: 이사야/예언자 전승과 달리 여기에 나타난 야훼의 말씀을 보존하는 방식
  chosen_reading: 야훼께서 이스라엘의 하나님으로서 말씀하신 경계 회복 선언을 그대로 옮겼습니다.
  alternative_readings:
  - 주께서
  - 여호와께서
  rationale: 본문은 왕의 업적을 넘어 야훼의 선포 성취를 강조하므로, 신명과 ‘이스라엘의 하나님’ 호칭을 함께 살려 신학적 초점을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: YHWH 표기 원칙; 예언 성취 서술의 직접성'
