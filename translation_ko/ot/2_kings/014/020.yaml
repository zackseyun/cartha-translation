language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂא֥וּ אֹת֖/וֹ עַל הַ/סּוּסִ֑ים וַ/יִּקָּבֵ֧ר בִּ/ירוּשָׁלִַ֛ם עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר דָּוִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/014/020.yaml
  text: They carried him on horses[b][a], and he was buried in Jerusalem with his fathers in the city of David.
  footnotes:
  - marker: a
    text: Or 'upon horses.' The Hebrew wording is literal and may describe transport of the body by horse-borne conveyance.
    reason: lexical_alternative
  - marker: b
    text: '''With his fathers'' is a traditional burial formula, meaning he was buried with his royal ancestors.'
    reason: cultural_note
translation:
  language: ko
  text: 그들은 그를 말들 위에 실었고, 그는 예루살렘에 있는 다윗 성에서 그의 조상들과 함께 장사되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘말들 위에’입니다. 이는 시신을 말이 끄는 운송수단으로 옮겼다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 조상들과 함께’는 왕들의 장례에서 쓰이는 관용구로, 왕조의 선조들과 함께 안장되었다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ עַל הַסּוּסִים
  english_pob_choice: They carried him on horses
  chosen_korean: 그들은 그를 말들 위에 실었고
  alternatives_korean:
  - 그들은 그를 말들에 실어 옮겼고
  - 그들은 그를 말을 탄 채로 옮겼고
  lexicon: HALOT
  rationale: 히브리어는 ‘들어/실어 옮기다’(נשא)와 ‘말들 위에’라는 구체적 표현을 그대로 담고 있어, 자연스러운 한국어로 ‘말들 위에 실었다’가 가장 가깝습니다.
- source_word: וַיִּקָּבֵר
  english_pob_choice: and he was buried
  chosen_korean: 그는 … 장사되었습니다
  alternatives_korean:
  - 그는 … 묻혔습니다
  - 그는 … 매장되었습니다
  lexicon: HALOT
  rationale: 수동형을 반영하면서, 왕의 매장 맥락에서는 한국어 성경체로 ‘장사되었습니다’가 가장 적절합니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 이 표현은 직역하면 ‘그의 아버지들과 함께’이지만, 한국어에서는 왕조적 장례 관용구를 살리기 위해 ‘조상들’로 옮기는 편이 의미를 더 분명히 전달합니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the city of David
  chosen_korean: 다윗 성에서
  alternatives_korean:
  - 다윗의 성읍에서
  - 다윗 성 안에서
  lexicon: HALOT
  rationale: 고유 지명으로 굳어진 ‘다윗 성’을 사용해 장소 표지를 자연스럽게 유지했습니다.
theological_decisions:
- issue: 왕의 장례 관용구인 ‘with his fathers’의 의미
  chosen_reading: 단순한 가족 동반이 아니라 다윗 왕조의 선왕들과 함께 안장되었다는 뜻으로 이해했습니다.
  alternative_readings:
  - 그의 아버지들과 함께라는 문자적 독해
  - 조상들과 함께라는 일반적 독해
  rationale: 히브리어 장례 공식은 왕조적 연속성과 매장을 함께 시사하므로, 한국어 본문에서도 그 역사적 함의를 살리는 것이 적절합니다.
  doctrine_reference: 왕조사/장례 관용구
- issue: ‘in the city of David’의 위치 해석
  chosen_reading: 예루살렘 안의 다윗 성, 곧 왕실 묘역 맥락을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 예루살렘에서
  - 다윗의 도시에서
  rationale: 본문은 단순한 예루살렘이 아니라 예루살렘 내 특정 구역을 지시하므로, 지명 보존이 중요합니다.
  doctrine_reference: 본문 지리-역사 맥락
