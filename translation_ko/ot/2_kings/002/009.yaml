  source_fidelity: 수정이 필요합니다. בטרם אלקח은 엘리야가 ‘데려감을 당하는’ 피동 표현인데, 초안의 ‘옮겨 가기’는 피동성과 행위 주체의 비명시성을 약화합니다. 또한 שאל은 엘리사가 청할 것을 명하는 말인데, 초안은 ‘원하는 것을 말하여라’와 별도의 질문을 병렬하여 원문의 한 문장을 다소 중복·확장합니다. פּי שנים ברוחך는 ‘당신의 영 가운데 두 몫’으로 표현해야 영의 ‘두 배’라는 단순 비교와 구별되는 몫/상속의 뉘앙스를 더 충실히 보존합니다.
