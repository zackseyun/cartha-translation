base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/009.yaml
  text: And when they had crossed over[a], Elijah said to Elisha, “Ask what I should do for you before I am taken from you.” And Elisha said, “Please[b], let a double portion of your spirit be upon me.”
  footnotes:
  - marker: a
    text: Or, “let two shares of your spirit come to me.” The Hebrew idiom means “a double portion,” likely echoing the firstborn’s inheritance share.
    reason: lexical_alternative
  - marker: b
    text: “Your spirit” refers to the spirit associated with Elijah’s prophetic ministry; some understand this as a request for twice Elijah’s prophetic power.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 건너가자[a], 엘리야가 엘리사에게 말했습니다. “내가 너에게서 옮겨 가기 전에, 네가 원하는 것을 말하여라. 내가 너를 위해 무엇을 해야 하겠느냐?” 엘리사가 말했습니다. “부디, 당신의 영이 내게 두 몫으로 있게 하여 주십시오[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “건너고 있던 때에”.
    reason: alternative_reading
  - marker: b
    text: ‘당신의 영’은 엘리야의 예언 사역과 관련된 영을 가리킵니다. 어떤 이들은 이것을 엘리야의 예언적 능력을 두 배로 받게 해 달라는 요청으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: כְעָבְרָם
  english_pob_choice: when they had crossed over
  chosen_korean: 그들이 건너가자
  alternatives_korean:
  - 그들이 건넌 뒤에
  - 그들이 건너고 있을 때
  lexicon: HALOT
  rationale: עבר의 완료된 통과를 앞뒤 사건과 구분해 자연스럽게 드러내기 위해 ‘건너가자’로 옮겼습니다.
- source_word: שְׁאַל מָה אֶעֱשֶׂה לָּךְ
  english_pob_choice: Ask what I should do for you
  chosen_korean: 네가 원하는 것을 말하여라. 내가 너를 위해 무엇을 해야 하겠느냐?
  alternatives_korean:
  - 무엇을 해 주기를 원하는지 말하라
  - 내가 너를 위해 무엇을 해 주면 좋겠느냐
  lexicon: HALOT
  rationale: 직역의 명령형과 관용적 요청을 함께 살려, 엘리야의 관대하고 열린 제안을 한국어 요청문으로 자연스럽게 풀었습니다.
- source_word: בְּטֶרֶם אֶלָּקַח מֵעִמָּךְ
  english_pob_choice: before I am taken from you
  chosen_korean: 내가 너에게서 옮겨 가기 전에
  alternatives_korean:
  - 내가 너에게서 데려감을 당하기 전에
  - 내가 너에게서 떠나기 전에
  lexicon: HALOT
  rationale: נלקח의 피동성을 살리면서도 ‘from you’의 관계적 분리를 분명히 하도록 ‘옮겨 가다’로 옮겼습니다.
- source_word: פִּי שְׁנַיִם
  english_pob_choice: a double portion
  chosen_korean: 두 몫으로
  alternatives_korean:
  - 두 배로
  - 두 몫을
  lexicon: HALOT
  rationale: 상속 몫을 떠올리게 하는 관용을 살리기 위해, 풀이적이면서도 본문에 덜 과도한 ‘두 몫’으로 옮겼습니다.
- source_word: בְּרוּחֲךָ
  english_pob_choice: your spirit
  chosen_korean: 당신의 영
  alternatives_korean:
  - 당신의 성령
  - 당신의 숨결
  lexicon: HALOT
  rationale: 엘리야에게 속한 영/예언적 기질을 가리키는 말로 보아 ‘성령’으로 특정하지 않고 ‘영’으로 유지했습니다.
theological_decisions:
- issue: 엘리사의 요청인 פִּי שְׁנַיִם בְּרוּחֲךָ의 의미
  chosen_reading: 엘리사는 엘리야의 영에 속한 두 몫, 곧 상속 장자의 몫을 연상시키는 ‘두 몫’을 요청합니다.
  alternative_readings:
  - 엘리야보다 두 배의 영적 능력을 요청합니다.
  - 예언적 권능의 정확히 두 배를 요청합니다.
  rationale: 히브리어 관용구 פִּי שְׁנַיִם의 상속적 배경을 보존하고, 본문이 말하는 범위를 넘는 능력 비교로 좁히지 않기 위해서입니다.
  doctrine_reference: 본문의 긴장을 보존하고 과도한 해석을 피합니다.
- issue: ‘당신의 영’의 범주
  chosen_reading: 엘리야에게 속한 영, 곧 그의 예언 사역과 관련된 영으로 이해하고, 신학적으로 성령을 직접 지칭한다고 단정하지 않습니다.
  alternative_readings:
  - 삼위일체적 의미의 성령을 직접 가리킵니다.
  - 엘리야의 예언적 권능을 비유적으로 말합니다.
  rationale: 소유격 ‘당신의’와 문맥이 엘리야와 연결된 영을 가리키므로, 교리적 특정화를 최소화했습니다.
  doctrine_reference: 본문이 말하지 않는 교리를 번역으로 선취하지 않습니다.
