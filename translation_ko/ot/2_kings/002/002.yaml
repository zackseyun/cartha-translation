  source_fidelity: ‘선생님’은 히브리어의 2인칭 단수 접미사(‘당신의/당신을’)에 없는 호칭과 관계를 보태므로 제거해야 합니다. עַד의 종착점 의미를 ‘벧엘까지’로 옮긴 것은 적절하며, 맹세문의 부정 의미를 ‘떠나지 않겠습니다’로 명시한 것도 충실합니다.
  naturalness: ‘선생님의 생명이 살아 있는 한’은 현대 한국어에서 부자연스럽고, ‘선생님’의 반복도 문맥상 근거가 없습니다. 본문은 자연스러운 맹세 관용 표현인 ‘당신이 살아 계시는 한’으로 다듬고, 문자적 표현은 각주에서 보충하는 편이 좋습니다.
  terminology: ‘야훼’, ‘엘리야’, ‘엘리사’, ‘벧엘’은 일관되고 적절합니다. ‘당신’은 이 엄숙한 직접 화법에서 원문의 2인칭을 보존하는 데 적합하며, 특정한 사제·교사 호칭을 첨가하지 않습니다.
