  text: וַ/יֹּאמֶר֩ אֵלִיָּ֨הוּ אֶל אֱלִישָׁ֜ע שֵֽׁב נָ֣א פֹ֗ה כִּ֤י יְהוָה֙ שְׁלָחַ֣/נִי עַד בֵּֽית אֵ֔ל וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יֵּרְד֖וּ בֵּֽית אֵֽל־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/002.yaml
  text: And Elijah said to Elisha[a], “Please stay here, for Yahweh has sent me to Bethel.” But Elisha said, “As Yahweh lives, and as you live[b], I will not leave you.” So they went down to Bethel.
  footnotes:
  - marker: a
    text: 'Hebrew: ''has sent me as far as Bethel''; some translations simplify to ''has sent me to Bethel.'''
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew oath formula: ''As the LORD lives, and as your life lives, if I leave you''—that is, ''I will not leave you.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야가 엘리사에게 말했습니다. 「여기 머무르십시오. 야훼께서 나를 벧엘까지 보내셨습니다.」 그러자 엘리사가 말했습니다. 「야훼께서 살아 계시고, 선생님의 생명이 살아 있는 한 저는 선생님을 떠나지 않겠습니다.」 그래서 그들은 벧엘로 내려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘벧엘로’보다 ‘벧엘까지’에 더 가까워, 종착점 뉘앙스를 살렸습니다.
    reason: source_note
  - marker: b
    text: 히브리어 맹세식은 문자적으로 ‘당신의 생명이 살아 있는 한’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  english_pob_choice: Please stay here
  chosen_korean: 여기 머무르십시오
  alternatives_korean:
  - 여기 앉아 계십시오
  - 여기 남아 주십시오
  lexicon: HALOT
  rationale: שֵׁב은 문맥상 단순히 ‘앉다’보다 동행을 멈추고 그 자리에 남아 있으라는 뜻이므로, 자연스럽고 공손한 ‘머무르십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 본문이 여호와 이름을 직접 사용하므로, POB의 기준에 따라 제목형 대체어가 아닌 고유명사 ‘야훼’를 유지했습니다.
- source_word: עַד בֵּית אֵל
  english_pob_choice: has sent me as far as Bethel
  chosen_korean: 벧엘까지 보내셨습니다
  alternatives_korean:
  - 벧엘로 보내셨습니다
  - 벧엘에 이르도록 보내셨습니다
  lexicon: HALOT
  rationale: עַד의 종착점 뉘앙스를 살려 ‘까지’로 옮기면, 엘리야의 여정이 단계적으로 진행되는 문맥도 함께 드러납니다.
- source_word: וְחֵי נַפְשְׁךָ
  english_pob_choice: and as you yourself live
  chosen_korean: 선생님의 생명이 살아 있는 한
  alternatives_korean:
  - 선생님이 살아 계시는 한
  - 선생님의 목숨이 살아 있는 한
  lexicon: HALOT
  rationale: 맹세식 표현의 문자적 어감과 한국어의 자연스러움을 함께 살리기 위해, ‘생명이 살아 있는 한’으로 풀어 ‘당신의 생명’에 해당하는 강조를 보존했습니다.
theological_decisions:
- issue: 야훼의 직접 사용
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절은 하나님의 이름 자체를 맹세문 안에서 직접 사용하므로, 전통적 대치어보다 고유한 언약 নাম을 드러내는 번역이 소스에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
