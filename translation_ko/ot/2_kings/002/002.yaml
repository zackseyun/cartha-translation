- from: 엘리야가 엘리사에게 말했습니다. 「여기 머무르십시오. 야훼께서 나를 벧엘까지 보내셨습니다.」 그러자 엘리사가 말했습니다. 「야훼께서 살아 계시고, 선생님의 생명이 살아 있는 한 저는 선생님을 떠나지 않겠습니다.」 그래서 그들은 벧엘로 내려갔습니다.[a][b]
  to: 엘리야가 엘리사에게 말했습니다. “여기 머무르십시오. 야훼께서 나를 벧엘까지[a] 보내셨습니다.” 엘리사가 대답했습니다. “야훼께서 살아 계시고, 당신이 살아 계시는 한[b] 저는 당신을 떠나지 않겠습니다.” 그래서 그들은 벧엘로 내려갔습니다.
  rationale: 원문에 없는 ‘선생님’이라는 호칭을 제거하여 2인칭 표현의 범위를 보존했습니다. 맹세문은 현대 표준 한국어에서 자연스러운 ‘당신이 살아 계시는 한’으로 옮기되, 원문의 문자적 ‘당신의 생명’ 표현은 각주에서 밝혔습니다. 또한 두 각주를 각각 설명하는 어구 뒤로 옮기고, 각주 a를 원문의 의미 범위를 직접 제시하는 방식으로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:51:58Z'
