base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/013.yaml
  text: He picked up Elijah’s cloak[a], which had fallen from him, and returned and stood on the bank of the Jordan.
  footnotes:
  - marker: a
    text: Or 'mantle.' The Hebrew term refers to a distinctive outer garment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 엘리야의 겉옷[a]을 집어 들었습니다. 그것은 그에게서 떨어져 나온 것이었습니다. 그리고 돌아와 요단의 언덕에 섰습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘망토’. 히브리어는 엘리야의 특징적인 바깥옷을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֶם
  english_pob_choice: picked up
  chosen_korean: 집어 들었습니다
  alternatives_korean:
  - 들어 올렸습니다
  - 주워 들었습니다
  lexicon: HALOT
  rationale: 겉옷이 땅에 떨어진 상황에서 רום의 동작을 자연스럽게 살리되, 문맥상 물건을 손으로 들어 취하는 의미를 분명히 전하기 위해 선택했습니다.
- source_word: אַדֶּרֶת
  english_pob_choice: cloak
  chosen_korean: 겉옷
  alternatives_korean:
  - 외투
  - 망토
  lexicon: HALOT
  rationale: אַדֶּרֶת는 엘리야의 특징적인 바깥옷을 가리키므로, 현대 한국어에서 문맥이 가장 분명한 ‘겉옷’으로 옮겼습니다. ‘망토’는 지나치게 특정한 이미지가 생길 수 있습니다.
- source_word: וַיָּשָׁב וַיַּעֲמֹד
  english_pob_choice: returned and stood
  chosen_korean: 돌아와 … 섰습니다
  alternatives_korean:
  - 되돌아가 서 있었습니다
  - 다시 가서 섰습니다
  lexicon: HALOT
  rationale: 두 동사의 연속 동작을 한국어 서술 순서에 맞게 간결하게 살리기 위해 ‘돌아와’와 ‘섰습니다’를 연결했습니다.
- source_word: עַל שְׂפַת הַיַּרְדֵּן
  english_pob_choice: on the bank of the Jordan
  chosen_korean: 요단의 언덕에
  alternatives_korean:
  - 요단 강가에
  - 요단 강둑에
  lexicon: HALOT
  rationale: שָׂפָה의 기본 의미는 ‘가/언덕 가장자리’이지만, 강의 경우 통상적인 한국어 표현은 ‘강가’입니다. 다만 본 절의 지형적 묘사를 살려 더 직역적인 ‘언덕’으로 두었습니다.
theological_decisions:
- issue: 지형 표현 עַל שְׂפַת הַיַּרְדֵּן의 한국어 처리
  chosen_reading: ‘요단의 언덕’으로 옮겨, 강둑/강가보다 가장자리의 공간감을 살렸습니다.
  alternative_readings:
  - ‘요단 강가’
  - ‘요단 강둑’
  rationale: 이 구절은 신학적 쟁점보다 서술적 정확성이 중요하므로, 본문의 공간적 긴장을 살리는 쪽을 택했습니다.
  doctrine_reference: Narrative geography and scene setting
