  - 단순 과거 진술로 처리하는 번역
  rationale: 본문은 결과를 보고하는 서술이 아니라, 이미 준 명령을 상기시키는 책망의 말투를 담고 있으므로 그 긴장을 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 본문의 화용적 힘 보존
