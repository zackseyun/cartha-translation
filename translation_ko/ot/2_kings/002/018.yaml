lexical_decisions:
- source_word: וַיָּשֻׁבוּ אֵלָיו
  english_pob_choice: When they returned to him
  chosen_korean: 그들이 그에게 돌아오니
  alternatives_korean:
  - 그들이 그에게 돌아왔을 때
  - 그들이 그에게 돌아오자
  lexicon: HALOT
  rationale: שוב의 기본 의미를 살리되, 앞뒤 문맥의 시간적 연결을 자연스럽게 드러내기 위해 ‘돌아오니’로 옮겼습니다.
- source_word: וְהוּא יֹשֵׁב
  english_pob_choice: he was staying
  chosen_korean: 그는 여리고에 머물고 있었습니다
  alternatives_korean:
  - 그는 여리고에 앉아 있었습니다
  - 그는 여리고에 거하고 있었습니다
  lexicon: HALOT
  rationale: ישב는 문맥상 단순한 ‘앉다’보다 계속 머무름을 가리키므로, 장면의 의미를 살려 ‘머물고 있었습니다’로 옮겼습니다.
- source_word: הֲלוֹא אָמַרְתִּי אֲלֵיכֶם
  english_pob_choice: Did I not tell you
  chosen_korean: 내가 너희에게 ‘가지 말라’고 하지 않았느냐
  alternatives_korean:
  - 내가 너희에게 말하지 않았느냐
  - 내가 너희에게 분명히 말하지 않았느냐
  lexicon: HALOT
  rationale: הֲלוֹא의 반문적 책망을 한국어의 자연스러운 수사 의문형으로 살렸고, אָמַרְתִּי אֲלֵיכֶם은 ‘너희에게…말하다’의 직접성을 유지했습니다.
- source_word: אַל תֵּלֵכוּ
  english_pob_choice: Do not go
  chosen_korean: 가지 말라
  alternatives_korean:
  - 가지 마라
  - 가면 안 된다
  lexicon: HALOT
  rationale: אַל + 미완료형의 금지 명령을 간결한 직접 인용으로 살렸습니다.
