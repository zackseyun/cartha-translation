source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר קְחוּ לִ/י֙ צְלֹחִ֣ית חֲדָשָׁ֔ה וְ/שִׂ֥ימוּ שָׁ֖ם מֶ֑לַח וַ/יִּקְח֖וּ אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/020.yaml
  text: He said[a], “Bring me a new bowl, and put salt in it.” So they brought it to him.
  footnotes:
  - marker: a
    text: Or “jar” or “flask” for the vessel mentioned here; the Hebrew refers generally to a small container.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “새 그릇[a]을 내게 가져오고 그 안에 소금을 넣으십시오.” 그러자 그들이 그것을 그에게 가져왔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 작은 용기를 두루 가리킵니다. ‘항아리’나 ‘병’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: צְלֹחִית
  english_pob_choice: bowl
  chosen_korean: 그릇
  alternatives_korean:
  - 항아리
  - 병
  - 작은 그릇
  lexicon: HALOT
  rationale: 히브리어는 작은 용기를 가리키는 일반 명사이므로, 형태를 과도하게 특정하지 않는 ‘그릇’이 POB의 ‘bowl’과 가장 무리 없이 대응합니다.
- source_word: קְחוּ לִי
  english_pob_choice: Bring me
  chosen_korean: 가져다가
  alternatives_korean:
  - 가져오십시오
  - 가져오게 하십시오
  - 가져오라
  lexicon: HALOT
  rationale: 직역의 ‘취하라’보다 요청의 기능이 살아 있는 ‘가져다가’가 문맥상 자연스럽고, 이어지는 명령문과도 잘 맞습니다.
- source_word: וְשִׂימוּ שָׁם מֶלַח
  english_pob_choice: and put salt in it
  chosen_korean: 거기에 소금을 넣으십시오
  alternatives_korean:
  - 거기에 소금을 두십시오
  - 그 안에 소금을 넣으십시오
  lexicon: HALOT
  rationale: שׂים의 기본 의미를 살리면서, 장면상 그릇 내부를 가리키는 ‘거기/그 안’으로 옮겼습니다.
- source_word: וַיִּקְחוּ אֵלָיו
  english_pob_choice: So they brought it to him
  chosen_korean: 그러자 그들이 그것을 그에게 가져왔습니다
  alternatives_korean:
  - 그러자 그들이 그것을 그에게 가져갔습니다
  - 그래서 그들이 그것을 그에게 가져왔습니다
  lexicon: HALOT
  rationale: 히브리어 לקח가 여기서는 요청한 물건을 전달하는 뜻으로 쓰였으므로, 한국어에서도 ‘가져왔습니다’가 문맥에 맞습니다.
