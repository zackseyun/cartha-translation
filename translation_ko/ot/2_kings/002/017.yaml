source:
  edition: WLC
  text: וַ/יִּפְצְרוּ ב֥/וֹ עַד בֹּ֖שׁ וַ/יֹּ֣אמֶר שְׁלָ֑חוּ וַֽ/יִּשְׁלְחוּ֙ חֲמִשִּׁ֣ים אִ֔ישׁ וַ/יְבַקְשׁ֥וּ שְׁלֹשָֽׁה יָמִ֖ים וְ/לֹ֥א מְצָאֻֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/017.yaml
  text: But they urged him until he was ashamed[a], and he said, “Send them.” So they sent fifty men, and they searched for three days, but they did not find him.
  footnotes:
  - marker: a
    text: Or “until he was embarrassed.” The Hebrew says literally “until he was ashamed,” describing the social pressure created by their repeated urging.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들이 그에게 부지런히 आग्रह하여 그가 부끄러워할 지경이 되자[a] 그가 말했습니다. 「보내십시오.」 그래서 그들은 오십 명을 보냈고, 그들은 사흘 동안 찾았으나 그를 찾지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “부끄러워할 때까지”입니다. 여기서는 반복적인 간청이 만든 사회적 압박을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצְרוּ ב֥/וֹ
  english_pob_choice: they urged him
  chosen_korean: 그에게 부지런히 간청하여
  alternatives_korean:
  - 그를 거듭 재촉하여
  - 그를 집요하게 졸라
  lexicon: HALOT
  rationale: פצר의 반복적·집요한 압박을 한국어에서 자연스럽게 드러내기 위해 ‘부지런히 간청하다’로 옮겼습니다.
- source_word: עַד בֹּשׁ
  english_pob_choice: until he was ashamed
  chosen_korean: 그가 부끄러워할 지경이 되자
  alternatives_korean:
  - 그가 수치스러워질 때까지
  - 그가 부끄러움을 느낄 때까지
  lexicon: HALOT
  rationale: בוש의 핵심 의미인 수치/부끄러움을 살리되, 현대 한국어에서는 상황적 사회적 압박을 드러내는 표현이 자연스러워서 이렇게 옮겼습니다.
- source_word: שְׁלָחוּ
  english_pob_choice: Send them
  chosen_korean: 보내십시오
  alternatives_korean:
  - 보내십시오, 그들을
  - 보내라
  lexicon: HALOT
  rationale: 문맥상 허락의 뜻이므로 명령형의 직접성은 유지하되, 한국어에서는 목적어를 반복하지 않고 간결하게 ‘보내십시오’로 처리했습니다.
- source_word: וַיְבַקְשׁוּ שְׁלֹשָׁה יָמִים
  english_pob_choice: they searched for three days
  chosen_korean: 사흘 동안 찾았고
  alternatives_korean:
  - 사흘 동안 수색했고
  - 사흘 동안 찾아보았고
  lexicon: HALOT
  rationale: בקש은 ‘찾다/구하다’의 넓은 의미가 있어, 서사 흐름에 맞는 ‘찾다’로 옮기고 기간은 한국어 관용에 따라 ‘사흘 동안’으로 표현했습니다.
theological_decisions:
- issue: 엘리사가 허락하는 말의 뉘앙스
  chosen_reading: 엘리사의 말은 실제 권유가 아니라, 끈질긴 요청을 수용하는 허락으로 읽었습니다.
  alternative_readings:
  - 엘리사가 진심으로 보내라고 명령한 것
  - 엘리사가 냉소적으로 허락한 것
  rationale: 문맥상 앞선 반복적 간청에 대한 양보이므로, 허락의 성격을 드러내는 번역이 본문의 흐름을 가장 잘 반영합니다.
  doctrine_reference: 서사 문맥과 화행(허락/양보)
