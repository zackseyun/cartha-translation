review_pass:
  verdict: revise
  source_fidelity: 히브리어의 반복적·집요한 요청(וַיִּפְצְרוּ בוֹ), ‘그가 부끄러워할 때까지’라는 결과/한계 표현(עַד בֹּשׁ), 허락의 명령(שְׁלָחוּ), 오십 명, 사흘, 그리고 찾지 못했다는 결말을 모두 보존해야 합니다. 개정문은 이를 충실히 반영합니다.
  naturalness: 초안에는 ‘간청하여’ 자리에 데바나가리 문자 ‘आग्रह하여’가 혼입되어 있어 한국어 문장으로 성립하지 않습니다. 또한 ‘부지런히 간청하다’는 지속성과 압박의 뜻을 충분히 드러내지 못합니다. ‘거듭 졸라’와 ‘부끄러워할 지경에 이르자’는 현대 표준 한국어의 자연스러운 서사 문체입니다.
  terminology: ‘부끄러워하다’는 בוש의 기본 의미를 유지하며, 각주에서 문자적 표현과 사회적 압박의 뉘앙스를 설명합니다. ‘보내십시오’는 합쇼체를 유지하고, 문맥상 암시된 목적어를 ‘그들을’로 밝혀 의미를 분명히 합니다.
  issues:
  - severity: high
    issue: 본문에 비한국어 문자 ‘आग्रह하여’가 혼입되어 있습니다.
    rationale: 구조적 오류는 아니지만 표준 한국어 번역문으로 읽을 수 없으며, 원문의 פצר(끈질기게 졸라대다)의 의미도 적절히 전달하지 못합니다.
  - severity: medium
    issue: ‘부지런히 간청하여’는 פצר의 집요한 압박과 사회적 부담의 뉘앙스를 약하게 만듭니다.
    rationale: 여기서 요구되는 것은 성실히 간청하는 행위보다 반복적으로 재촉하고 조르는 행위입니다. ‘거듭 졸라’가 더 정확하고 자연스럽습니다.
  revised_text: 그러나 그들이 그를 거듭 졸라 그가 부끄러워할 지경에 이르자, 그가 말했습니다. 「그들을 보내십시오.」 그래서 그들은 오십 명을 보내어 사흘 동안 찾았으나, 그를 찾지 못했습니다.
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그가 부끄러워할 때까지”입니다. 이는 그들의 거듭된 요청이 그에게 사회적 압박을 주었음을 나타냅니다.
    reason: lexical_alternative
  revision_rationale: 혼입된 비한국어 문자를 바로잡고, פצר의 반복적이고 집요한 요청을 ‘거듭 졸라’로 옮겼습니다. עַד בֹּשׁ의 문자적 의미와 문맥상 사회적 압박의 뉘앙스는 본문과 각주에 보존했습니다. 나머지 서사 요소와 합쇼체 문체는 유지했습니다.
