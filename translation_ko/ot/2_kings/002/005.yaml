  lexicon: HALOT
  rationale: 짧고 단호한 명령의 뉘앙스를 살리면서도 현대 합쇼체에 맞는 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 엘리야의 이동을 가리키는 표현의 해석 범위
  chosen_reading: 본문의 이미지를 유지해 ‘당신의 머리 위에서 데려가시는 것’으로 옮겼습니다.
  alternative_readings:
  - 당신을 다스리던 자리를 떠나 데려가시는 것
  - 당신 위에 있던 분이 사라지시는 것
  rationale: 히브리어는 실제로 ‘머리 위에서’라고 말하며, 이는 권위자의 제거를 암시할 수 있으나 본문이 명시적으로 설명하지는 않으므로 이미지와 해석을 분리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
