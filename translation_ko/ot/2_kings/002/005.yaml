base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/005.yaml
  text: Then the sons of the prophets who were at Jericho came near to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
  footnotes:
  - marker: a
    text: Or 'from being over you'; the Hebrew literally says 'from over your head,' an idiom for the removal of one in authority over another.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예리코에 있던 예언자들의 아들들이 엘리사에게 가까이 와서 그에게 말했습니다. "오늘 야훼께서 당신의 주인을 당신의 머리 위에서 데려가시는 것을 아십니까?" 그러자 그가 말했습니다. "나도 압니다. 잠잠하십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신을 다스리던 자리에서’; 히브리어는 문자적으로 ‘당신의 머리 위에서’라고 하며, 이는 한 사람 위에 있는 권위자의 제거를 가리키는 관용구일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הַנְּבִיאִים
  english_pob_choice: the sons of the prophets
  chosen_korean: 예언자들의 아들들
  alternatives_korean:
  - 예언자 제자들
  - 예언자 단체
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문에서 그대로 살려, 집단의 정체를 과도하게 해석하지 않고 투명하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 문서의 기본 원칙에 따라 하나님의 고유 이름을 제목화된 대체어로 바꾸지 않고 음역형으로 보존했습니다.
- source_word: מֵעַל רֹאשֶׁךָ
  english_pob_choice: from over your head
  chosen_korean: 당신의 머리 위에서
  alternatives_korean:
  - 당신 위에서
  - 당신을 다스리던 자리에서
  lexicon: HALOT
  rationale: 관용적 의미를 본문에서 곧바로 풀지 않고, ‘머리 위’라는 구체 이미지를 유지해 문맥과 해석의 긴장을 남겼습니다.
- source_word: הֶחֱשׁוּ
  english_pob_choice: be silent
  chosen_korean: 잠잠하십시오
  alternatives_korean:
  - 조용히 하십시오
  - 입을 다무십시오
  lexicon: HALOT
  rationale: 짧고 단호한 명령의 뉘앙스를 살리면서도 현대 합쇼체에 맞는 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 엘리야의 이동을 가리키는 표현의 해석 범위
  chosen_reading: 본문의 이미지를 유지해 ‘당신의 머리 위에서 데려가시는 것’으로 옮겼습니다.
  alternative_readings:
  - 당신을 다스리던 자리를 떠나 데려가시는 것
  - 당신 위에 있던 분이 사라지시는 것
  rationale: 히브리어는 실제로 ‘머리 위에서’라고 말하며, 이는 권위자의 제거를 암시할 수 있으나 본문이 명시적으로 설명하지는 않으므로 이미지와 해석을 분리했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3 Preserve theological tension rather than resolve it
