  source_fidelity: 본문은 예언자들의 아들들, 예리코, 엘리사, 야훼, 그리고 ‘머리 위에서’라는 히브리어의 구체적 이미지를 충실히 보존합니다. 다만 ‘당신의 머리 위에서 데려가시는 것’은 한국어에서 수식 범위가 다소 불분명하므로, 어순을 조정하여 ‘당신의 주인을 당신의 머리 위에서 데려가신다는 것’으로 명확히 하는 것이 안전합니다.
  naturalness: 전반적으로 현대 합쇼체에 맞습니다. ‘잠잠하십시오’는 짧고 단호한 명령으로 문맥에 적절합니다. 질문문의 어순을 조정하면 한국어 문장이 더 자연스럽고 뜻이 명료해집니다.
  terminology: ‘야훼’, ‘엘리사’, ‘예언자들의 아들들’은 프로젝트의 투명한 번역 원칙과 영어 감사 기록에 부합합니다. 각주 대안은 원문의 ‘당신 위에 있음’이라는 관계를 나타내야 하며, 기존의 ‘당신을 다스리던 자리에서’는 제거되는 대상과 자리의 관계를 다소 부정확하게 바꿉니다.
