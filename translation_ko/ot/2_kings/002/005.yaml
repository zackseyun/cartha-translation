    rationale: 히브리어의 ‘당신의 머리 위에서’는 주인/권위자의 제거와 연결됩니다. 한국어에서는 목적어 ‘당신의 주인’을 그 표현 가까이에 두어 관계를 더 분명히 할 수 있습니다.
