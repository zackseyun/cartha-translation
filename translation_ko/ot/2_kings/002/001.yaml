  text: Now it happened[a], when Yahweh was about to take Elijah up into heaven by a whirlwind[b], that Elijah and Elisha went on from Gilgal.
  footnotes:
  - marker: a
    text: Or 'in a whirlwind' or 'in the stormwind.'
