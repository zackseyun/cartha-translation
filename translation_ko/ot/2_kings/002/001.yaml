translation:
  language: ko
  text: 이제 주님께서 엘리야를 회오리바람으로 하늘로 데려가시려 할 때에, 엘리야와 엘리사는 길갈에서 떠나갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘하늘들’을 뜻하는 복수형이지만, 이 문맥에서는 한국어에서 자연스러운 단수형 ‘하늘’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 סערה는 폭풍, 광풍, 회오리바람을 가리킬 수 있으며, 여기서는 문맥상 ‘회오리바람’이 가장 구체적입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: 이제
  alternatives_korean:
  - 그때
  - 일이 이렇게 되어
  lexicon: WLC narrative wayyiqtol / discourse function
  rationale: 새 사건을 여는 서술 표지로 기능하므로, 한국어에서는 과도하게 옛스러운 표현보다 자연스러운 전환어 ‘이제’로 시작해 서사 흐름을 살렸습니다.
- source_word: בְּהַעֲלוֹת יְהוָה אֶת אֵלִיָּהוּ
  english_pob_choice: when Yahweh was about to take Elijah up
  chosen_korean: 주님께서 엘리야를 ... 데려가시려 할 때에
  alternatives_korean:
  - 주님께서 엘리야를 올려 가시려 할 때에
  - 주님께서 엘리야를 들어 올리실 때에
  lexicon: HALOT
  rationale: העלה의 문맥상 ‘위로 데려가다/올려가다’의 상승과 이동을 함께 담아야 하므로, 한국어에서는 ‘데려가시려’로 자연스럽게 옮기되 주어를 능동적으로 보이게 했습니다.
- source_word: בַּסְעָרָה
  english_pob_choice: by a whirlwind
  chosen_korean: 회오리바람으로
  alternatives_korean:
  - 폭풍으로
  - 소용돌이바람으로
  lexicon: HALOT
  rationale: סערה는 폭풍, 광풍, 회오리바람의 범위를 가지지만, 이어지는 승천 장면에서는 ‘회오리바람’이 가장 구체적이고 한국어 독자에게도 장면성을 잘 전달합니다.
- source_word: הַשָּׁמָיִם
  english_pob_choice: into heaven
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘들로
  - 하늘나라로
  lexicon: HALOT
  rationale: 히브리어 복수형을 한국어에서 직역해 ‘하늘들’로 옮기기보다, 문맥상 상승의 종착점을 자연스럽게 드러내는 ‘하늘로’가 적절합니다.
- source_word: וַיֵּלֶךְ ... מִן הַגִּלְגָּל
  english_pob_choice: Elijah and Elisha went on from Gilgal
  chosen_korean: 엘리야와 엘리사는 길갈에서 떠나갔습니다
  alternatives_korean:
  - 엘리야와 엘리사는 길갈에서 갔습니다
  - 엘리야와 엘리사는 길갈을 떠났습니다
  lexicon: HALOT
  rationale: הלך와 מן의 결합은 단순한 이동보다 ‘출발하여 떠남’을 분명히 하므로, 서술체에 맞는 자연스러운 표현 ‘떠나갔습니다’를 선택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 원문은 여호와/야훼의 고유명을 가지지만, 본문 내 3인칭 서술에서 한국어 합쇼체 독자의 즉시 이해와 POB의 통용 신역 관례를 고려해 ‘주님’으로 옮겼습니다. 다만 이는 해석상 문맥적 호칭이며, 신명 표기의 신학적 쟁점은 별도 본문군에서 일관되게 다룰 수 있습니다.
  doctrine_reference: POB Korean default style for divine referents in narrative
- issue: הַשָּׁמָיִם의 번역 범위
  chosen_reading: 하늘로
  alternative_readings:
  - 하늘들로
  - 하늘로 올라가시려
  rationale: 이 구절은 우주론적 진술보다 엘리야의 승천 사건을 말하므로, ‘하늘로’는 מקור의 복수형을 과장하지 않으면서도 사건의 방향성을 충분히 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
