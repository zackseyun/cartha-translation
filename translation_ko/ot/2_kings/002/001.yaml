theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 주
  rationale: 원문은 여호와/야훼의 고유명을 가지지만, 본문 내 3인칭 서술에서 한국어 합쇼체 독자의 즉시 이해와 POB의 통용 신역 관례를 고려해 ‘주님’으로 옮겼습니다. 다만 이는 해석상 문맥적 호칭이며, 신명 표기의 신학적 쟁점은 별도 본문군에서 일관되게 다룰 수 있습니다.
  doctrine_reference: POB Korean default style for divine referents in narrative
- issue: הַשָּׁמָיִם의 번역 범위
  chosen_reading: 하늘로
  alternative_readings:
  - 하늘들로
  - 하늘로 올라가시려
  rationale: 이 구절은 우주론적 진술보다 엘리야의 승천 사건을 말하므로, ‘하늘로’는 מקור의 복수형을 과장하지 않으면서도 사건의 방향성을 충분히 드러냅니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence'
