  text: וַ/יִּקַּח֩ אֶת אַדֶּ֨רֶת אֵלִיָּ֜הוּ אֲשֶׁר נָפְלָ֤ה מֵֽ/עָלָי/ו֙ וַ/יַּכֶּ֣ה אֶת הַ/מַּ֔יִם וַ/יֹּאמַ֕ר אַיֵּ֕ה יְהוָ֖ה אֱלֹהֵ֣י אֵלִיָּ֑הוּ אַף ה֣וּא וַ/יַּכֶּ֣ה אֶת הַ/מַּ֗יִם וַ/יֵּֽחָצוּ֙ הֵ֣נָּה וָ/הֵ֔נָּה וַֽ/יַּעֲבֹ֖ר אֱלִישָֽׁע־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/014.yaml
  text: Then he took Elijah’s cloak[a], which had fallen from him, and struck the water and said, “Where is Yahweh, the God of Elijah?” Then he struck the water, and it was divided this way and that way, and Elisha crossed over.
  footnotes:
  - marker: a
    text: Or 'Where is the LORD, the God of Elijah? He also …' The Hebrew phrase 'even he' is terse and may emphasize that the same God who was with Elijah is still present.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 엘리야의 겉옷을, 곧 그에게서 떨어진 그것을 집어 들고 물을 치며 말했습니다. “야훼, 엘리야의 하나님은 어디 계십니까?” 그가 다시 물을 치자 물이 이쪽과 저쪽으로 갈라졌고, 엘리사가 건넜습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “여호와, 엘리야의 하나님은 어디 계십니까? 그분도 …”로 옮길 수 있습니다. 히브리어의 ‘그도’는 매우 압축적이며, 엘리야와 동일한 하나님이 지금도 함께하신다는 점을 강조할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַדֶּרֶת
  english_pob_choice: cloak
  chosen_korean: 겉옷
  alternatives_korean:
  - 망토
  - 외투
  lexicon: HALOT
  rationale: 엘리야의 상징적인 바깥옷을 가리키므로, 현대 한국어에서 자연스럽고 구체적인 ‘겉옷’으로 옮겨 이미지와 기능을 살렸습니다.
- source_word: וַיַּכֶּה אֶת־הַמַּיִם
  english_pob_choice: struck the water
  chosen_korean: 물을 치다
  alternatives_korean:
  - 물을 내리치다
  - 물을 때리다
  lexicon: HALOT
  rationale: 기적 이야기에서의 נכה는 단순한 ‘치다’보다 강한 행위이므로, 과도하게 해설하지 않으면서도 동작의 힘을 드러내는 표현을 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
  rationale: POB의 기본 원칙에 따라 언약 이름을 ‘야훼’로 직역해, ‘주님’으로 일반화하지 않고 고유한 신적 이름을 보존했습니다.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  english_pob_choice: it was divided this way and that way
  chosen_korean: 이쪽과 저쪽으로 갈라졌고
  alternatives_korean:
  - 이리저리 갈라졌고
  - 좌우로 갈라졌고
  lexicon: HALOT
  rationale: 히브리어의 방향쌍을 한국어로 자연스럽게 풀어, 물이 둘로 갈라지는 장면을 분명하게 전달했습니다.
theological_decisions:
- issue: אַף הוּא의 압축성과 신학적 긴장
  chosen_reading: 본문의 질문을 그대로 두고, 추가 해설 없이 하나님의 현존을 요청하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘그도 역시’로 풀어줌
  - 문맥상 생략
  - ‘그분도 여기 계십니까?’로 의역
  rationale: 히브리어는 매우 압축되어 있어 지나친 의역은 본문이 남겨 둔 긴장을 지울 수 있습니다. 따라서 엘리사의 외침이 야훼의 지속적 임재를 기대하는 장면이라는 점을 살리되, 본문 이상을 말하지 않도록 했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3
