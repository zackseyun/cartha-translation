  text: Then the sons of the prophets who were at Bethel came out to Elisha and said to him[a], “Do you know that today Yahweh is taking your master from over your head?” And he said, “I also know; be silent.”
  footnotes:
  - marker: a
    text: Or 'from being over you'; the Hebrew literally says 'from over your head,' an idiom for the removal of one in authority over another.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 베델에 있던 예언자들의 제자들이 엘리사에게 나와 그에게 말했습니다. 「오늘 야훼께서 당신의 주인을 당신의 머리 위에서[a] 데려가시는 것을 알고 있습니까?」 그러자 그가 말했습니다. 「나도 알고 있습니다. 잠잠하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 머리 위에서’입니다. 이는 당신 위에 있던 권위자가 제거된다는 뜻의 관용 표현입니다.
    reason: lexical_alternative
