base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/021.yaml
  text: 'Then he went out to the source of the water and threw salt there[a], and said, “Thus says Yahweh: I have healed this water[b]. No longer will there come from it death or miscarriage.”'
  footnotes:
  - marker: a
    text: Or “the spring of the water.”
    reason: lexical_alternative
  - marker: b
    text: Or “No longer will there come from it death or barrenness / causing miscarriage.” The Hebrew term refers to loss of offspring or unfruitfulness.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 물의 근원[a]으로 나아가 այնտեղ 소금을 던졌습니다. 그리고 말했습니다. “야훼께서 이렇게 말씀하십니다. ‘내가 이 물을 고쳐 주었다. 그 물에서 더 이상 죽음이나 유산[b]이 생기지 않을 것이다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘물의 샘’ 또는 ‘물이 흘러나오는 곳’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 유산이나 자손 상실을 가리키며, 불임 또는 불모를 뜻할 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא הַמַּיִם
  english_pob_choice: the source of the water
  chosen_korean: 물의 원천
  alternatives_korean:
  - 물의 샘
  - 물의 솟는 곳
  - 물의 유출구
  lexicon: HALOT
  rationale: 물의 공급 지점을 가리키는 표현이므로, 영어 POB의 source를 반영하면서도 한국어에서 자연스럽고 원천의 의미를 살리는 ‘물의 원천’으로 옮겼습니다.
- source_word: מֶלַח
  english_pob_choice: salt
  chosen_korean: 소금
  alternatives_korean:
  - 천일염
  - 염
  lexicon: HALOT
  rationale: 문맥상 특별한 종류의 소금이 아니라 일반적인 소금을 가리키므로 직역했습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하셨습니다
  alternatives_korean:
  - 야훼께서 말씀하시기를
  - 야훼께서 이같이 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전언 공식이므로 현재형 선포를 한국어에서 자연스럽게 살려 ‘이렇게 말씀하셨습니다’로 옮겼고, יְהוָה는 본 프로젝트 기본값대로 ‘야훼’로 유지했습니다.
- source_word: רִפִּאתִי
  english_pob_choice: I have healed
  chosen_korean: 내가 이 물을 고쳤다
  alternatives_korean:
  - 내가 이 물을 치유했다
  - 내가 이 물을 회복했다
  lexicon: HALOT
  rationale: 물에 대한 의인화된 ‘치유’ 표현이지만, 한국어에서는 물을 ‘고치다’가 기능을 바로잡아 깨끗하고 마실 수 있게 한다는 의미를 더 직접적으로 전달합니다. 동시에 해석을 지나치게 넓히지 않기 위해 ‘회복했다’보다 구체적으로 잡았습니다.
- source_word: וּמְשַׁכָּלֶת
  english_pob_choice: miscarriage
  chosen_korean: 잉태하지 못하게 하는 일
  alternatives_korean:
  - 유산
  - 불임
  - 아이를 잃게 하는 일
  lexicon: HALOT
  rationale: 이 단어는 출생·생산의 상실을 가리키므로, 문자적으로 ‘유산’만 좁혀버리기보다 본문이 말하는 해로운 생식 결과 전체를 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 직접 인용에서 한국어 어법과 신명기적 선포 형식 유지
  chosen_reading: 직접 인용 안에서는 ‘내가 이 물을 고쳤다’처럼 1인칭 선포를 살리고, 후속 결과는 ‘죽음도 잉태하지 못하게 하는 일도 나오지 않을 것이다’로 단정적으로 옮겼습니다.
  alternative_readings:
  - 평탄하게 풀어 ‘이 물이 더 이상 해를 끼치지 않을 것이다’라고 완화하는 번역
  - ‘불모’나 ‘황폐’로 추상화하는 번역
  rationale: 원문은 물의 해독과 생식 피해를 함께 금지하는 강한 선언이므로, 의미를 약화하지 않고 둘 다 드러내는 쪽이 더 충실합니다. 다만 한국어에서는 ‘미주알고주알한’ 종교어를 피하고 자연스러운 현대 문장으로 정리했습니다.
  doctrine_reference: 원문 직역 충실성 및 예언 선포의 강도 보존
