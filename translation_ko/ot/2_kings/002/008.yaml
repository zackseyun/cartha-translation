base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/008.yaml
  text: Then Elijah took his cloak[a], rolled it up, and struck the water; and it was divided here and there[b], so that the two of them crossed over on dry ground.
  footnotes:
  - marker: a
    text: Or 'his mantle.' The Hebrew refers to Elijah’s outer garment.
    reason: lexical_alternative
  - marker: b
    text: Literally 'were divided here and there,' that is, to opposite sides.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리야가 자기 겉옷을 집어 말아 물을 치니, 물이 이리저리 갈라져 두 사람이 마른 땅으로 건넜습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겉옷’은 히브리어 אַדֶּרֶת의 바깥옷/망토를 풀어 쓴 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이리저리 갈라져’는 문자적으로는 ‘이쪽저쪽으로 나뉘어’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  english_pob_choice: his cloak
  chosen_korean: 자기 겉옷
  alternatives_korean:
  - 자기 망토
  - 자기 외투
  lexicon: HALOT
  rationale: אַדֶּרֶת는 예언자의 바깥옷을 가리키므로, 현대 한국어에서는 의미가 분명한 ‘겉옷’이 본문 행동을 가장 자연스럽게 드러냅니다.
- source_word: וַיִּגְלֹם
  english_pob_choice: rolled it up
  chosen_korean: 집어 말아
  alternatives_korean:
  - 둘둘 말아
  - 말아서
  lexicon: HALOT
  rationale: 옷을 도구처럼 쓰기 위해 말아 쥐는 동작을 살리기 위해 ‘집어 말아’로 옮겼습니다.
- source_word: וַיֵּחָצוּ הֵנָּה וָהֵנָּה
  english_pob_choice: it was divided here and there
  chosen_korean: 물이 이리저리 갈라져
  alternatives_korean:
  - 물이 이쪽저쪽으로 갈라져
  - 물이 이리저리 나뉘어
  lexicon: HALOT
  rationale: 히브리어의 ‘여기저기/이쪽저쪽’ 분열 이미지를 한국어 관용에 맞게 ‘이리저리 갈라져’로 자연스럽게 옮겼습니다.
- source_word: בֶּחָרָבָה
  english_pob_choice: on dry ground
  chosen_korean: 마른 땅으로
  alternatives_korean:
  - 마른 땅 위로
  - 마른 땅에서
  lexicon: HALOT
  rationale: 출애굽 전통과 연결되는 ‘마른 땅’의 표준적 표현을 유지하되, 이동 동사를 살려 ‘마른 땅으로’라고 했습니다.
theological_decisions:
- issue: 기적의 서술을 자연화하지 않고 그대로 보존함
  chosen_reading: 엘리야가 옷을 말아 물을 치자 물이 갈라져 두 사람이 마른 땅으로 건넜다는 사건을 그대로 서술했습니다.
  alternative_readings:
  - 물결이 갈라졌다
  - 물이 길을 내주었다
  rationale: 본문은 초자연적 분리를 직접 묘사하므로, 기적성을 완화하는 해석적 표현보다 원문이 말하는 사건성을 그대로 드러내는 것이 적절합니다.
  doctrine_reference: 원문 우선 원칙과 기적 서술의 직역 보존
