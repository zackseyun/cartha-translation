  naturalness: 현대 표준 한국어 합쇼체로 자연스럽게 다듬었습니다. ‘집어 말아’는 다소 어색할 수 있어 ‘가져다가 말아서’로 고쳤고, 각주 표지는 해당 어구 바로 뒤에 배치했습니다.
  terminology: אַדֶּרֶת는 문맥상 엘리야의 특징적인 바깥옷을 가리키므로 ‘겉옷’을 유지할 수 있습니다. 각주에서 가능한 대안인 ‘망토’를 밝혔습니다. ‘마른 땅’은 기적적 물 건넘 문맥의 חָרָבָה를 적절히 보존합니다.
