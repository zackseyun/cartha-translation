translation:
  language: ko
  text: 그때 엘리야가 그의 겉옷[a]을 가져다가 말아서 물을 치자, 물이 이쪽저쪽으로 갈라졌습니다.[b] 그래서 두 사람 모두 마른 땅을 밟고 건넜습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겉옷’은 히브리어 아데렛(אַדֶּרֶת)을 옮긴 말입니다. 이 말은 특징적인 바깥옷 또는 망토를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이쪽과 저쪽으로 나뉘었다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדַּרְתּוֹ
  english_pob_choice: his cloak
  chosen_korean: 자기 겉옷
  alternatives_korean:
