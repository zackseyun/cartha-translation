source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ אֵלָ֡י/ו הִנֵּה נָ֣א יֵֽשׁ אֶת עֲבָדֶי/ךָ֩ חֲמִשִּׁ֨ים אֲנָשִׁ֜ים בְּנֵֽי חַ֗יִל יֵ֣לְכוּ נָא֮ וִ/יבַקְשׁ֣וּ אֶת אֲדֹנֶי/ךָ֒ פֶּן נְשָׂא/וֹ֙ ר֣וּחַ יְהוָ֔ה וַ/יַּשְׁלִכֵ֨/הוּ֙ בְּ/אַחַ֣ד הֶ/הָרִ֔ים א֖וֹ בְּ/אַחַ֣ת ה/גיאות וַ/יֹּ֖אמֶר לֹ֥א תִשְׁלָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/016.yaml
  text: Then they said to him[a], “Look now, there are fifty strong men among your servants. Please let them go and seek your master, lest the Spirit of Yahweh has carried him away and thrown him on one of the mountains or into one of the valleys.” But he said, “Do not send them.”
  footnotes:
  - marker: a
    text: Or, “the wind of the LORD has carried him away.” The Hebrew word רוּחַ can mean “spirit” or “wind.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 그에게 말했습니다[a]. “보십시오, 당신의 종들 가운데 강한 사람 오십 명이 있습니다. 부디 그들을 보내어 당신의 주인을 찾아보게 하십시오. 야훼의 영이 그를 데리고 가서 산 하나 위에 또는 골짜기 하나에 던져 버렸을지도 모르기 때문입니다.” 그러자 그는 말했습니다. “보내지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여호와의 바람이 그를 데리고 가서…’로도 옮길 수 있습니다. 히브리어 רוּחַ는 ‘영’과 ‘바람’을 모두 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보십시오, 지금
  - 자, 보십시오
  - 이보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄과 간청의 뉘앙스를 한국어의 공손한 제시형으로 간결하게 살렸습니다.
- source_word: בְּנֵי חַיִל
  english_pob_choice: strong men
  chosen_korean: 강한 사람 오십 명
  alternatives_korean:
  - 용맹한 사람 오십 명
  - 유능한 사람 오십 명
  - 힘센 사람 오십 명
  lexicon: HALOT
  rationale: 전투적 영웅성을 과장하지 않고, 이 문맥에서 요구되는 신체적·실행적 역량을 직접적으로 드러내는 표현을 택했습니다.
- source_word: רוּחַ יְהוָה
  english_pob_choice: the Spirit of Yahweh
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 야훼의 성령
  - 야훼의 바람
  lexicon: HALOT
  rationale: 문맥상 신적 행위의 주체이므로 기본값인 ‘야훼’를 유지하고, רוּחַ는 일반적 ‘영’으로 옮겨 ‘바람’으로만 축소되지 않도록 했습니다.
- source_word: וַיַּשְׁלִכֵהוּ
  english_pob_choice: thrown / cast
  chosen_korean: 던져 버렸을지도 모르기 때문입니다
  alternatives_korean:
  - 던졌을지도 모르기 때문입니다
  - 내던졌을지도 모르기 때문입니다
  - 내쳐 버렸을지도 모르기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘던지다/내던지다’ 의미를 살리되, 결과의 완결성과 우려를 한국어의 가능성 표현으로 자연스럽게 반영했습니다.
- source_word: בְּאַחַד הֶהָרִים ... בְּאַחַת הַגֵּאָיוֹת
  english_pob_choice: on one of the mountains ... into one of the valleys
  chosen_korean: 산 하나 위에 또는 골짜기 하나에
  alternatives_korean:
  - 산들 가운데 하나에 또는 골짜기들 가운데 하나에
  - 한 산 위에 또는 한 골짜기에
  lexicon: HALOT
  rationale: 전치사 반복과 대조를 유지하면서, ‘산/골짜기’의 대비를 한국어에서 과도하게 해설하지 않고 간결하게 옮겼습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 고유명으로서의 신명사를 투명하게 드러내기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: רוּחַ의 의미 범위
  chosen_reading: ‘영’으로 본문에 두되, 가능성 맥락에서 ‘바람’ 해석을 배제하지 않는 번역
  alternative_readings:
  - ‘바람’으로 본문에 두기
  - ‘성령’으로 특정하기
  rationale: 이 장면에서는 초자연적 이동을 둘러싼 추정이므로, 개인화된 신적 행위가 드러나지만 어휘 자체의 다의성도 남겨 두는 것이 원문 긴장을 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — רוח ruach'
