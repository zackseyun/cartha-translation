  text: And Elijah said to him, "Elisha, please stay here, for Yahweh has sent me to Jericho." But he said, "As Yahweh lives, and as you yourself live, I will not leave you." So they came to Jericho.
translation:
  language: ko
  text: 엘리야가 그에게 말했습니다. “엘리사야, 여기 머물러 있으십시오. 야훼께서 나를 여리고로 보내셨습니다.” 그러나 그는 말했습니다. “야훼께서 살아 계심과 당신의 생명이 살아 있음에 맹세합니다. 나는 당신을 떠나지 않겠습니다.” 그래서 그들은 여리고에 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נָא는 공손한 청유를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: שֵׁב נָא פֹה
  english_pob_choice: please stay here
  chosen_korean: 여기 머물러 있으십시오
  alternatives_korean:
  - 여기 계십시오
  - 여기 머물러 주십시오
  - 여기 앉아 있으십시오
  lexicon: HALOT
  rationale: שֵׁב은 이 문맥에서 단순히 ‘앉다’보다 여행을 계속하지 말고 ‘머무르다/남아 있다’는 뜻이 자연스럽고, 나는 청유의 공손함을 살려 ‘있으십시오’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 언약명 יְהוָה를 관습적 대체어가 아니라 음역으로 반영해, POB의 원칙대로 ‘야훼’를 사용했습니다.
- source_word: וְחֵי נַפְשְׁךָ
  english_pob_choice: and as you yourself live
  chosen_korean: 당신의 생명이 살아 있음에
  alternatives_korean:
  - 당신의 혼이 살아 있음에
  - 당신의 생명에 걸고
  lexicon: HALOT
  rationale: נֶפֶשׁ은 이 맹세 표현에서 ‘영혼’보다 ‘생명’의 뜻이므로, 직역보다 관용적 의미를 살려 ‘당신의 생명이 살아 있음에’로 옮겼습니다.
- source_word: אִם אֶעֶזְבֶךָּ
  english_pob_choice: I will not leave you
  chosen_korean: 나는 당신을 떠나지 않겠습니다
  alternatives_korean:
  - 나는 당신을 버리지 않겠습니다
  - 내가 당신을 떠난다면
  lexicon: HALOT
  rationale: 이 구조는 히브리어에서 생략된 부정을 가진 맹세형으로, 문맥상 ‘떠나다’가 여행 동행 상황에 가장 잘 맞아 자연스럽게 풀었습니다.
theological_decisions:
