base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/022.yaml
  text: So the waters were healed to this day[a], according to the word that Elisha spoke.
  footnotes:
  - marker: a
    text: Or 'were restored' or 'became wholesome.' The Hebrew verb is the usual word for 'heal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 물은 오늘날까지 고쳐졌습니다[a]. 엘리사가 말한 그 말씀대로입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘회복되었습니다’, ‘건강해졌습니다’로 옮길 수도 있습니다. 히브리어 동사는 보통 ‘고치다/치유하다’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָפוּ
  english_pob_choice: were healed
  chosen_korean: 고쳐졌습니다
  alternatives_korean:
  - 치유되었습니다
  - 회복되었습니다
  - 낫게 되었습니다
  lexicon: HALOT
  rationale: רפא의 기본 뜻인 ‘고치다/치유하다’를 살리면서, 물이 이전의 해로운 상태에서 정상 상태로 바뀌었다는 비유적 표현을 자연스러운 한국어로 옮겼습니다.
- source_word: הַמַּיִם
  english_pob_choice: the waters
  chosen_korean: 그 물
  alternatives_korean:
  - 그 물들
  - 그 물들이
  - 그 물은
  lexicon: HALOT
  rationale: 히브리어 복수형의 물감을 반영하되, 한국어에서는 자연스러운 집합명사 ‘그 물’이 가장 매끄럽습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: HALOT
  rationale: 서술자의 현재까지 이어지는 상태를 나타내는 관용구로, 현대 문어체에서는 ‘오늘날까지’가 가장 자연스럽습니다.
- source_word: כִּדְבַר ... אֲשֶׁר דִּבֵּר
  english_pob_choice: according to the word that Elisha spoke
  chosen_korean: 엘리사가 말한 그 말씀대로
  alternatives_korean:
  - 엘리사가 한 말대로
  - 엘리사가 선포한 말씀대로
  lexicon: HALOT
  rationale: דבר을 단순한 ‘말’이 아니라 예언적 ‘말씀’으로 연결해, 전절의 선언이 실제로 성취되었음을 드러내는 표현을 유지했습니다.
theological_decisions:
- issue: 물의 상태를 ‘healed’로 유지할지, 의미를 평탄화할지
  chosen_reading: 주요 본문은 ‘고쳐졌습니다’로 두어 물에 대한 치유 비유를 보존했습니다.
  alternative_readings:
  - 정상으로 회복되었습니다
  - 깨끗해졌습니다
  rationale: 히브리어는 רפא를 사용하므로, 단순한 정화 설명으로 환원하지 않고 예언자의 말씀이 실제로 ‘치유’처럼 효력을 보였다는 서술을 살렸습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve metaphorical force without over-explaining it.'
