  - 회복되었습니다
  - 낫게 되었습니다
  lexicon: HALOT
  rationale: רפא의 기본 뜻인 ‘고치다/치유하다’를 살리면서, 물이 이전의 해로운 상태에서 정상 상태로 바뀌었다는 비유적 표현을 자연스러운 한국어로 옮겼습니다.
