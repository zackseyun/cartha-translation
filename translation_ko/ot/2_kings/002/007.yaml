id: 2KI.2.7
reference: 2 Kings 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/חֲמִשִּׁ֨ים אִ֜ישׁ מִ/בְּנֵ֤י הַ/נְּבִיאִים֙ הָֽלְכ֔וּ וַ/יַּעַמְד֥וּ מִ/נֶּ֖גֶד מֵ/רָח֑וֹק וּ/שְׁנֵי/הֶ֖ם עָמְד֥וּ עַל הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/007.yaml
  text: And fifty men from the sons of the prophets went and stood opposite them at a distance[c][b][a], while the two of them stood by the Jordan.
  footnotes:
  - marker: a
    text: Or 'across from them' for 'opposite them.'
    reason: lexical_alternative
  - marker: b
    text: Or 'from afar' for 'at a distance.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'sons of the prophets,' a recognized group or guild associated with prophetic ministry.
    reason: cultural_note
translation:
  language: ko
  text: 예언자들의 아들들[a] 가운데 오십 명이 가서 그들 맞은편[c]에 멀찍이[b] 서 있었고, 그 둘은 요단강 가에 서 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘예언자들의 아들들’이라고 합니다. 이는 예언 사역과 관련된 집단을 가리키는 통용된 명칭입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘멀리 떨어져’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들을 마주하여’, ‘그들 건너편에서’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַחֲמִשִּׁים אִישׁ
  english_pob_choice: And fifty men
  chosen_korean: 오십 명
  alternatives_korean:
  - 오십 사람
  - 오십 남자들
  lexicon: HALOT
  rationale: 히브리어의 수사+אִישׁ은 이 문맥에서 집합적으로 ‘오십 명’을 뜻하므로, 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: מִבְּנֵי הַנְּבִיאִים
  english_pob_choice: from the sons of the prophets
  chosen_korean: 예언자들의 제자들 가운데서
  alternatives_korean:
  - 예언자들의 아들들 가운데서
  - 예언자 무리 가운데서
  lexicon: HALOT
  rationale: 직역하면 ‘예언자들의 아들들’이지만, 본문은 예언자적 훈련 집단을 가리키는 관용구이므로 한국어에서 의미를 드러내는 ‘제자들’을 택했습니다.
- source_word: מִנֶּגֶד מֵרָחוֹק
  english_pob_choice: opposite them at a distance
  chosen_korean: 그들 맞은편에 멀리
  alternatives_korean:
  - 그들 맞은편에 떨어져
  - 멀찍이 그들 맞은편에
  lexicon: HALOT
  rationale: מִנֶּגֶד와 מֵרָחוֹק의 이중 공간 표지를 살려, ‘맞은편’과 ‘멀리’를 함께 두어 거리감과 대조를 모두 보존했습니다.
- source_word: עַל הַיַּרְדֵּן
  english_pob_choice: stood by the Jordan
  chosen_korean: 요단강 가에 서 있었습니다
  alternatives_korean:
  - 요단강에 서 있었습니다
  - 요단강 곁에 서 있었습니다
  lexicon: HALOT
  rationale: 강을 뜻하는 עַל의 위치 관계를 한국어 관용에 맞게 ‘가에’로 옮겨, 실제 장면에 자연스럽게 어울리도록 했습니다.
theological_decisions:
- issue: ‘sons of the prophets’의 집단명 처리
  chosen_reading: 직역형을 완전히 고집하지 않고, 본문이 가리키는 예언자 훈련 집단이라는 점을 드러내는 ‘예언자들의 제자들’로 옮겼습니다.
  alternative_readings:
  - 예언자들의 아들들
  - 예언자들의 무리
  rationale: 이 표현은 혈연 의미보다 소속/수련 집단 의미가 강하므로, 독자가 본문 기능을 오해하지 않도록 문화적·사회적 의미를 반영했습니다.
  doctrine_reference: 열왕기하 2장의 예언자 공동체 이해
