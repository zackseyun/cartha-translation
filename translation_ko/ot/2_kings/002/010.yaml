base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/010.yaml
  text: He said[a], “You have asked a hard thing. If you see me being taken from you, it will be so for you; but if not, it will not be.”
  footnotes:
  - marker: a
    text: Or, “If you see me when I am taken from you.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “네가 어려운 것을 구했습니다. 네가 내가 네게서 데려가지는 것을 보면[a], 네게 그렇게 될 것입니다. 그러나 그렇지 않으면, 그렇게 되지 않을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘네가 내가 네게서 데려가지는 것을 보면’은 ‘내가 네게서 데려가질 때 네가 보면’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִקְשִׁיתָ לִשְׁאוֹל
  english_pob_choice: You have asked a hard thing
  chosen_korean: 네가 어려운 것을 구했도다
  alternatives_korean:
  - 네가 어려운 것을 요청했다
  - 네가 힘든 것을 물었다
  lexicon: HALOT
  rationale: 히필 קשׁה와 לִשְׁאוֹל의 관용적 결합은 단순한 ‘어렵게 하다’가 아니라 상대의 요청이 난처하고 중한 것임을 뜻하므로, 한국어는 자연스럽게 ‘어려운 것을 구하다’로 옮겼습니다.
- source_word: אִם תִּרְאֶה אֹתִי לֻקָּח מֵאִתָּךְ
  english_pob_choice: If you see me being taken from you
  chosen_korean: 네가 내가 네게서 데려감을 당하는 것을 보면
  alternatives_korean:
  - 네가 내가 네게서 데려가는 것을 보면
  - 네가 내가 네게서 옮겨지는 것을 보면
  lexicon: HALOT
  rationale: לֻקָּח의 수동성을 살리기 위해 ‘데려감을 당하다’로 옮겨, 누가 가져가는지보다 ‘옮겨짐/인수됨’이라는 사건 자체를 드러냈습니다.
- source_word: יְהִי לְךָ כֵן
  english_pob_choice: it will be so for you
  chosen_korean: 그렇게 될 것이다
  alternatives_korean:
  - 그렇게 되리라
  - 너에게 그렇게 될 것이다
  lexicon: HALOT
  rationale: 히브리어 관용구는 약속의 성취를 뜻하므로, 한국어에서는 반복을 줄여도 의미가 분명한 ‘그렇게 될 것이다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 직접 인용문 안의 발화체
  chosen_reading: 엘리야의 말을 현대 문어체 평서로 옮기되, 인용부에서는 성경 서술체에 맞게 단정적 어조를 유지했습니다.
  alternative_readings:
  - 더 회화적인 구어체
  - 더 전통적인 고어체
  rationale: 본문은 예언자 간의 응답이지만 특별한 기도문이나 왕실 어법이 아니므로, 합쇼체 서술과 단정적 인용을 유지하는 것이 원문의 긴장과 직설성을 잘 보존합니다.
  doctrine_reference: 서술체 보존
