  yaml_path: translation/ot/2_kings/002/019.yaml
  text: Then the men of the city said to Elisha[a], “Please look, the location of the city is good, as my lord sees; but the water is bad, and the land causes miscarriages.”
  footnotes:
  - marker: a
    text: Or “the site of the city is good … and the land is unfruitful.” The Hebrew for “causes miscarriages” can denote causing loss of offspring and may extend to agricultural barrenness in context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 도시 사람들이 엘리사에게 말했습니다. “보십시오, 이 도시의 위치는 내 주께서 보시는 바와 같이 좋습니다. 그러나 물은 나쁘고, 땅은 유산을 일으킵니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “도시의 자리(터)는 좋습니다 … 그리고 땅은 불모입니다.” 히브리어의 “유산을 일으킵니다”는 자손을 잃게 한다는 뜻을 지니며, 문맥상 농업적 불모성까지 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  english_pob_choice: the men of the city
  chosen_korean: 그 도시 사람들
  alternatives_korean:
  - 그 도시의 남자들
  - 그 도시의 주민들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘도시의 남자들’이지만, 한국어에서는 이 표현을 그대로 살리면 부자연스러워서 문맥상 대표성을 가진 ‘그 도시 사람들’로 옮겼습니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Please look
  chosen_korean: 부디 보십시오
  alternatives_korean:
  - 부디 보아 주십시오
  - 보십시오
  lexicon: HALOT
  rationale: 히브리어의 주의를 끄는 말과 공손한 요청을 함께 살리기 위해 ‘부디’와 명령형 ‘보십시오’를 결합했습니다.
- source_word: מוֹשַׁב הָעִיר
  english_pob_choice: the location of the city
  chosen_korean: 도시의 위치
  alternatives_korean:
  - 도시의 자리
  - 도시의 형세
  - 도시의 터
  lexicon: HALOT
  rationale: 이 구는 도시의 거주 기능보다 ‘자리/배치’에 초점이 있으므로, 자연스러운 현대어로 ‘위치’가 가장 직접적입니다.
- source_word: מְשַׁכָּלֶת
  english_pob_choice: causes miscarriages
  chosen_korean: 유산을 일으킵니다
  alternatives_korean:
  - 출산을 잃게 합니다
  - 태를 잃게 합니다
  - 불모하게 합니다
  lexicon: HALOT
  rationale: 어근 שׁכל의 사역형이 ‘자식을 잃게 하다, 유산하게 하다’의 뜻을 지니므로, 농업적 불모성보다 우선하여 생물학적 의미를 드러냈습니다.
theological_decisions:
