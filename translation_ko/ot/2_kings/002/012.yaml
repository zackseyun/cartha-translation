  source_fidelity: 히브리어의 두 분사(‘보고 있는’, ‘외치고 있는’)는 엘리야가 떠나는 장면과 동시에 진행되는 동작입니다. 초안의 ‘외쳤습니다’도 문맥상 가능하지만, 앞선 진행상 ‘보고 있었고’와의 병렬 및 원문의 지속성을 살리려면 ‘외치고 있었습니다’가 더 충실합니다. ‘이스라엘의 병거와 그 마병들’은 해석을 확정하지 않고 유지할 수 있습니다.
  naturalness: ‘엘리사가 보고 있었고, 외쳤습니다’는 상이 병렬되지 않아 다소 어색합니다. ‘엘리사는 보고 있었으며, 외치고 있었습니다’가 현대 한국어 서술로 자연스럽습니다. ‘그러고 나서’는 서사 연결로 다소 구어적이므로 ‘그 뒤에는’으로 다듬었습니다.
  terminology: ‘병거’, ‘마병’, ‘두 조각으로 찢었습니다’는 적절합니다. 다만 ‘아버님’은 히브리어의 친밀하고 탄식적인 ‘나의 아버지’를 한국어의 존칭 호칭으로 다소 구체화합니다. ‘아버지, 아버지!’가 호소의 반복을 자연스럽게 보존하면서 불필요한 존칭 해석을 피합니다. 각주에서 ‘말 장면’은 원문의 병거와 마병을 충분히 반영하지 못하므로 ‘병거와 말들의 광경’으로 고쳤습니다.
