  lexicon: HALOT
  rationale: 원문의 방향성을 자연스럽게 반영해 종착점을 ‘하늘로’로 옮겼습니다. 한국어 문맥상 뒤의 동사와 함께 ‘하늘로 올라갔습니다’가 가장 매끄럽습니다.
theological_decisions:
- issue: 엘리야가 병거를 탔는지, 아니면 회오리바람이 승천의 수단인지
  chosen_reading: 본문은 불의 병거와 불의 말들이 두 사람을 갈라놓았다고만 말하고, 엘리야의 상승은 회오리바람과 연결해 말합니다.
  alternative_readings:
  - 엘리야가 불의 병거를 타고 올라갔다
  - 불의 병거와 말들은 단지 동반 현상이었다
  rationale: 히브리어가 병거와 말의 출현과 엘리야의 승천을 구분하므로, 본문이 명시하지 않는 차량 탑승 이미지는 보태지 않았습니다.
  doctrine_reference: 본문의 긴장을 유지하고, 추정으로 해소하지 않습니다.
