  lexicon: HALOT
  rationale: 진행 중인 이동과 대화의 동시성을 한국어로 자연스럽게 살리되, 서술의 흐름을 과하게 풀지 않았습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
