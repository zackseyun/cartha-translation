  - 문득
  lexicon: HALOT
  rationale: 장면 전환의 급작스러움과 주목을 끄는 기능을 보존하기 위해 감탄적 호소를 유지했습니다.
- source_word: רֶכֶב אֵשׁ וְסוּסֵי אֵשׁ
  english_pob_choice: a chariot of fire and horses of fire
  chosen_korean: 불의 병거와 불의 말들
  alternatives_korean:
  - 불타는 병거와 불타는 말들
  - 불길한 병거와 말들
  lexicon: HALOT
  rationale: 히브리어의 소유/속격 구조를 따라 ‘불의’로 직역하되, 전통적 교회어보다 원문 이미지가 드러나도록 했습니다.
- source_word: וַיַּפְרִדוּ בֵּין שְׁנֵי הֶם
  english_pob_choice: separated the two of them
  chosen_korean: 두 사람 사이를 갈라놓았습니다
  alternatives_korean:
  - 둘을 갈라놓았습니다
  - 두 사람을 갈라놓았습니다
  lexicon: HALOT
  rationale: ‘두 사람 사이’를 유지해 히브리어의 관계적 구성을 드러내고, 분리의 순간을 서사적으로 선명하게 표현했습니다.
- source_word: בַּסְעָרָה
  english_pob_choice: by the whirlwind
  chosen_korean: 회오리바람을 타고
  alternatives_korean:
  - 회오리바람 가운데
  - 회오리바람 속에서
  lexicon: HALOT
  rationale: ב의 수단/동반 의미와 이동 동사를 함께 살리기 위해 ‘-을 타고’로 옮겼습니다. 다만 본문이 엘리야가 병거를 탔다는 뜻까지 명시하지는 않으므로 그 점은 번역에 추가하지 않았습니다.
- source_word: הַשָּׁמָיִם
  english_pob_choice: into heaven
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘로 올라가
  - 하늘로 올라갔습니다
  lexicon: HALOT
  rationale: 원문의 방향성을 자연스럽게 반영해 종착점을 ‘하늘로’로 옮겼습니다. 한국어 문맥상 뒤의 동사와 함께 ‘하늘로 올라갔습니다’가 가장 매끄럽습니다.
theological_decisions:
- issue: 엘리야가 병거를 탔는지, 아니면 회오리바람이 승천의 수단인지
  chosen_reading: 본문은 불의 병거와 불의 말들이 두 사람을 갈라놓았다고만 말하고, 엘리야의 상승은 회오리바람과 연결해 말합니다.
  alternative_readings:
  - 엘리야가 불의 병거를 타고 올라갔다
  - 불의 병거와 말들은 단지 동반 현상이었다
  rationale: 히브리어가 병거와 말의 출현과 엘리야의 승천을 구분하므로, 본문이 명시하지 않는 차량 탑승 이미지는 보태지 않았습니다.
  doctrine_reference: 본문의 긴장을 유지하고, 추정으로 해소하지 않습니다.
