base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/011.yaml
  text: And as they were going along and talking[a], behold, a chariot of fire and horses of fire separated the two of them[b], and Elijah went up by the whirlwind into heaven.
  footnotes:
  - marker: a
    text: Or, 'in the whirlwind.' The Hebrew preposition can be understood as indicating means, accompaniment, or location.
    reason: lexical_alternative
  - marker: b
    text: The text says the chariot of fire and horses of fire separated Elijah and Elisha, and that Elijah went up by/in the whirlwind; it does not explicitly say that Elijah rode in the chariot.
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 길을 가며 말하고 있을 때, 보라, 불의 병거와 불의 말들이 두 사람 사이를 갈라놓았습니다. 그러고 나서 엘리야는 회오리바람을 타고 하늘로 올라갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘회오리바람 안에서/회오리바람으로’로도 옮길 수 있습니다. 히브리어 전치사는 수단, 동반, 위치를 모두 열어 둡니다.
    reason: lexical_alternative
  - marker: b
    text: 본문은 불의 병거와 불의 말들이 두 사람을 갈라놓았다고 말할 뿐, 엘리야가 그 병거를 탔다는 사실은 직접 말하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הֵמָּה הֹלְכִים הָלוֹךְ וְדַבֵּר
  english_pob_choice: And as they were going along and talking
  chosen_korean: 그들이 길을 가며 말하고 있을 때
