reference: 2 Kings 2:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַל מִ/שָּׁ֖ם בֵּֽית אֵ֑ל וְ/ה֣וּא עֹלֶ֣ה בַ/דֶּ֗רֶךְ וּ/נְעָרִ֤ים קְטַנִּים֙ יָצְא֣וּ מִן הָ/עִ֔יר וַ/יִּתְקַלְּסוּ ב/וֹ֙ וַ/יֹּ֣אמְרוּ ל֔/וֹ עֲלֵ֥ה קֵרֵ֖חַ עֲלֵ֥ה קֵרֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/023.yaml
  text: Then he went up from there to Bethel[a]. And as he was going up on the way, small boys came out from the city and mocked him, and said to him, “Go up, baldhead! Go up[b], baldhead!”
  footnotes:
  - marker: a
    text: Or “young lads” or “youths”; the Hebrew phrase can refer to young males more broadly, not necessarily very small children.
    reason: lexical_alternative
  - marker: b
    text: The repeated “Go up” may simply be a jeer, but it may also allude to Elijah’s being taken up.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그곳에서 벧엘로 올라갔습니다. 그가 길로 올라가고 있을 때, 작은 소년들이 성에서 나와 그를 조롱하며 말했습니다. “올라가라, 대머리야! 올라가라, 대머리야!”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נְעָרִים קְטַנִּים는 나이가 어린 남자들을 가리킬 수 있으며, 반드시 아주 어린 아이들만 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 반복된 “올라가라”는 단순한 야유일 수도 있고, 엘리야가 ‘올라감’을 암시하는 말일 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל ... בֵּית אֵל
  english_pob_choice: Then he went up from there to Bethel
  chosen_korean: 그는 그곳에서 벧엘로 올라갔습니다
  alternatives_korean:
  - 그는 거기에서 벧엘로 갔습니다
  - 그는 그곳에서 벧엘로 올라갔습니다
  lexicon: WLC / HALOT
  rationale: עלה의 기본 동작을 살려 ‘올라가다’로 옮기고, 지명은 음역한 ‘벧엘’로 유지했습니다.
- source_word: נְעָרִים קְטַנִּים
  english_pob_choice: small boys
  chosen_korean: 작은 소년들이
  alternatives_korean:
  - 어린 소년들이
  - 젊은이들이
  lexicon: HALOT
  rationale: נערים קְטַנִּים의 핵심은 나이가 어린 남자아이들이라는 점이므로 직역하되, 과도하게 유아화하지 않도록 ‘작은 소년들’로 옮겼습니다.
- source_word: וַיִּתְקַלְּסוּ בּוֹ
  english_pob_choice: mocked him
  chosen_korean: 그를 조롱하며
  alternatives_korean:
  - 그를 비웃으며
  - 그를 희롱하며
  lexicon: HALOT
  rationale: קלס의 조롱/모욕 뉘앙스를 반영해, 구어적 약화가 적은 ‘조롱하다’를 선택했습니다.
- source_word: עֲלֵה ... קֵרֵחַ
  english_pob_choice: Go up, baldhead! Go up, baldhead!
  chosen_korean: “올라가라, 대머리야! 올라가라, 대머리야!”
  alternatives_korean:
  - “올라가, 대머리야! 올라가, 대머리야!”
  - “올라가라, 대머리야! 올라가라, 대머리야!”
  lexicon: HALOT
  rationale: 반복된 עֲלֵה는 원문의 조롱을 살려 그대로 ‘올라가라’로 옮기고, קֵרֵחַ는 insult로서의 직접성을 살려 ‘대머리야’로 처리했습니다.
theological_decisions:
- issue: 반복된 ‘올라가라’의 조롱 가능성과 엘리야 승천 암시
  chosen_reading: 본문에는 ‘올라가라’를 그대로 두고, 암시를 풀어 설명하지 않았습니다
  alternative_readings:
  - ‘꺼져라’처럼 기능적으로 풀어 쓰는 번역
  - ‘엘리야처럼 올라가라’로 암시를 명시하는 번역
  rationale: 히브리어는 실제로 ‘올라가라’라고 말하므로, 가능한 암시는 본문 밖으로 미루고 원문 어휘 반복을 보존했습니다.
  doctrine_reference: Translation philosophy §3, 원문이 허용하는 긴장 보존
