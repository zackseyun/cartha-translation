  yaml_path: translation/ot/2_kings/002/006.yaml
  text: Then Elijah said to him[a], “Please stay here, for Yahweh has sent me to the Jordan.” But he said, “As Yahweh lives, and as you yourself live[b], I will not leave you.” So the two of them went on.
  footnotes:
  - marker: a
    text: Or “to the Jordan River.”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew oath formula: “As the LORD lives, and as your life lives, if I leave you …,” meaning “I will certainly not leave you.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리야가 그에게 말했습니다. 「여기에서 머물러 있으십시오. 야훼께서 나를 요단으로 보내셨습니다.」 그러나 그가 말했습니다. 「야훼께서 살아 계시는 것과, 당신이 살아 있는 것처럼, 제가 당신을 떠나지 않겠습니다.」 그래서 두 사람은 함께 갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Or “to the Jordan River.”
    reason: alternative_reading
  - marker: b
    text: 'Hebrew oath formula: “As the LORD lives, and as your life lives, if I leave you …,” meaning “I will certainly not leave you.”'
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁב נָא
  english_pob_choice: Please stay
  chosen_korean: 여기에서 머물러 있으십시오
  alternatives_korean:
  - 여기에서 계십시오
  - 여기에서 앉아 계십시오
  - 여기에서 머무르십시오
  lexicon: HALOT
  rationale: שֵׁב는 문맥상 단순히 ‘앉다’보다 ‘그 자리에 머무르다/남다’의 뜻이 자연스럽고, נָא는 정중한 청유이므로 합쇼체 명령으로 옮겼습니다.
- source_word: הַיַּרְדֵּנָה
  english_pob_choice: to the Jordan
  chosen_korean: 요단으로
  alternatives_korean:
  - 요단강으로
  - 요단강에
  lexicon: HALOT
  rationale: 방향을 나타내는 ה가 붙은 이동 표현이므로 목적지 방향을 간결하게 살려 ‘요단으로’라고 옮겼습니다.
- source_word: חַי יְהוָה
  english_pob_choice: As Yahweh lives
  chosen_korean: 야훼께서 살아 계시는 것
  alternatives_korean:
  - 야훼의 살아 계심을 두고
  - 야훼의 생명을 두고
  lexicon: HALOT
  rationale: 히브리어 맹세 관용구를 한국어로는 자연스럽고도 엄숙하게 풀어, ‘살아 계시는 것’으로 서술화했습니다.
- source_word: וְחֵי נַפְשְׁךָ
  english_pob_choice: and as you yourself live
  chosen_korean: 당신이 살아 있는 것처럼
  alternatives_korean:
  - 당신의 생명을 두고
  - 당신의 혼이 살아 있는 것처럼
  lexicon: HALOT
  rationale: 직역하면 ‘당신의 נפש가 살아 있음’이지만, 한국어에서는 맹세 표현으로 ‘당신이 살아 있는 것처럼’이 오해를 줄이면서 관용구의 힘을 살립니다.
- source_word: אִם אֶעֶזְבֶךָּ
  english_pob_choice: I will not leave you
  chosen_korean: 제가 당신을 떠나지 않겠습니다
  alternatives_korean:
  - 제가 당신을 버리지 않겠습니다
  - 제가 당신을 떠날 리 없습니다
  lexicon: HALOT
  rationale: 맹세문에서의 조건절은 실제 조건이 아니라 강한 부정을 뜻하므로, 한국어에서는 의미를 드러내는 직설적 부정으로 처리했습니다.
- source_word: וַיֵּלְכוּ שְׁנֵיהֶם
  english_pob_choice: So the two of them went on
  chosen_korean: 그래서 두 사람은 함께 갔습니다
  alternatives_korean:
  - 그래서 두 사람은 계속 갔습니다
  - 그리하여 두 사람은 길을 갔습니다
  lexicon: HALOT
  rationale: שְׁנֵיהֶם의 ‘둘’이라는 강조를 살리면서, 동행의 지속을 자연스럽게 표현했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 여호와 대체어가 아닌 신적 고유명사를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 일관되게 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 히브리어 맹세 관용구의 재현
  chosen_reading: 직역보다 의미 기능을 드러내는 한국어 맹세 표현
  alternative_readings:
  - 조건절을 그대로 남긴 직역
  - 완곡한 서술로 약화한 번역
  rationale: ‘살아 계심/살아 있는 것처럼’은 실제 의미상 맹세 공식이므로, 독자가 서약의 강도를 즉시 이해하도록 한국어 관용구로 옮겼습니다.
  doctrine_reference: '번역 원칙: source-direct idiom rendering'
