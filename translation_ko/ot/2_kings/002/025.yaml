  text: 그는 그곳에서 갈멜 산으로 갔고, 그곳에서 사마리아로 돌아왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: And he went
  chosen_korean: 그는 ... 갔고
  alternatives_korean:
  - 그리고 그는 갔습니다
  - 그는 갔습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 살리되, 한국어에서는 자연스러운 과거 연결형인 ‘갔고’로 이어져 이동의 연속을 드러냅니다.
- source_word: מִשָּׁם
  english_pob_choice: from there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기서
  - 그곳으로부터
  lexicon: HALOT
  rationale: 직전 언급된 장소를 가리키는 부사이므로 ‘그곳에서’가 간결하고 현대적인 대응입니다.
- source_word: הַר הַכַּרְמֶל
  english_pob_choice: Mount Carmel
  chosen_korean: 갈멜 산
  alternatives_korean:
  - 갈멜산
  - 카르멜 산
  lexicon: HALOT
  rationale: 지명은 한국어에서 널리 쓰이는 표기 ‘갈멜 산’을 사용해 고유 지명을 분명하게 했습니다.
- source_word: שָׁב
  english_pob_choice: he returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아갔습니다
  - 다시 갔습니다
  lexicon: HALOT
  rationale: 이동 문맥의 שׁוּב는 단순한 ‘되돌아감’을 뜻하므로 ‘돌아왔습니다’가 가장 자연스럽고 의미를 정확히 전달합니다.
- source_word: שֹׁמְרוֹן
  english_pob_choice: Samaria
  chosen_korean: 사마리아
  alternatives_korean:
  - 사마리아 성
  - 사마리아로
  lexicon: HALOT
  rationale: 표준 지명은 ‘사마리아’로 옮기되, 문맥상 도착 방향을 살리기 위해 조사 ‘로’를 붙였습니다.
