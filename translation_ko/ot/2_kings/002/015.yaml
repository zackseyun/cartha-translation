  rationale: Pob의 주석처럼 공간적 대조보다 ‘먼 거리에서’라는 시각적 인지가 자연스럽고 문맥에 맞습니다.
- source_word: רוּחַ אֵלִיָּהוּ עַל אֱלִישָׁע
  english_pob_choice: The spirit of Elijah rests on Elisha
  chosen_korean: 엘리야의 영이 엘리사 위에 머물러 있습니다
  alternatives_korean:
  - 엘리야의 영이 엘리사 위에 내려 있습니다
