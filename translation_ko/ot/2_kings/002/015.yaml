  lexicon: HALOT
  rationale: רוּחַ를 ‘영’으로 옮기고, עַל의 정착·부착 이미지를 ‘위에 머물러 있습니다’로 살려 예언적 능력의 지속 상태를 표현했습니다.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אָרְצָה
  english_pob_choice: bowed down to the ground before him
  chosen_korean: 땅에 엎드려 절했습니다
  alternatives_korean:
  - 땅에 엎드렸습니다
  - 땅에 엎드려 경의를 표했습니다
  - 그 앞에 엎드려 절했습니다
  lexicon: HALOT
  rationale: 동작의 강도와 방향을 살리되, 인간에게 드리는 경의인지 신적 예배인지는 본문이 단정하지 않도록 했습니다.
theological_decisions:
- issue: ‘엘리야의 영’의 의미
  chosen_reading: 엘리야의 예언자적 영/권능이 엘리사에게 머물렀음을 알아본 표현으로 읽었습니다.
  alternative_readings:
  - 엘리야의 개인적 영혼이 엘리사에게 옮겨졌다는 뜻
  - 단순한 칭찬 표현
  rationale: 2절과 9절의 맥락에서 후계와 권능의 인정을 드러내며, 영혼 전이 같은 오해를 피해야 합니다.
  doctrine_reference: 열왕기하 2장 문맥상의 예언자 계승
- issue: 엎드려 절함의 성격
  chosen_reading: 엘리야의 예언자적 후계자에게 드리는 존중과 복종의 행위로 이해했습니다.
  alternative_readings:
  - 엘리사를 향한 종교적 숭배
  rationale: 동사는 인간에게도 사용될 수 있으며, 본문은 엘리사의 권위를 인정하는 장면으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 히브리어 שׁחה의 문맥적 용례
