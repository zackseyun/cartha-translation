  text: וַ/יִּרְאֻ֨/הוּ בְנֵֽי הַ/נְּבִיאִ֤ים אֲשֶׁר בִּֽ/ירִיחוֹ֙ מִ/נֶּ֔גֶד וַ/יֹּ֣אמְר֔וּ נָ֛חָה ר֥וּחַ אֵלִיָּ֖הוּ עַל אֱלִישָׁ֑ע וַ/יָּבֹ֨אוּ֙ לִ/קְרָאת֔/וֹ וַ/יִּשְׁתַּחֲווּ ל֖/וֹ אָֽרְצָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/002/015.yaml
  text: When the sons of the prophets who were at Jericho saw him from a distance[a], they said[c][b], “The spirit of Elijah rests on Elisha.” Then they came to meet him and bowed down to the ground before him.
  footnotes:
  - marker: a
    text: Or “at a distance” for “from across from them”; the Hebrew expression denotes being opposite or in view from across.
    reason: lexical_alternative
  - marker: b
    text: “The spirit of Elijah” refers to Elijah’s prophetic spirit or empowerment now recognized in Elisha.
    reason: cross_reference
  - marker: c
    text: Or “prostrated themselves before him.” The gesture expresses honor and submission, not necessarily worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 예리코에 있던 예언자들의 아들들이 그를 멀리서 보았을 때[a], 그들이 말했습니다. “엘리야의 영이 엘리사 위에 머물러 있습니다.”[b] 그러고 나서 그들은 그를 맞으러 와서 그의 앞에서 땅에 엎드려 절했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “맞은편에서”로도 옮길 수 있습니다. 히브리어 표현은 맞은편이나 시야에 들어오는 위치를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘엘리야의 영’은 예언자들의 아들들이 엘리사에게서 알아본 엘리야의 예언자적 영 또는 권능을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: 또는 “그 앞에 몸을 굽혀 경의를 표했습니다”로도 옮길 수 있습니다. 이 몸짓은 존경과 복종을 나타내며, 반드시 예배를 뜻하는 것은 아닙니다.
    reason: lexical_alternative
