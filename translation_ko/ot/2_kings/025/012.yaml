base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/012.yaml
  text: But from the poorest of the land[b][a], the captain of the guard left some to be vinedressers and farmers.
  footnotes:
  - marker: a
    text: Or 'and plowmen' / 'and farmers' for 'field workers.' The Hebrew term likely refers broadly to agricultural laborers who worked the soil.
    reason: lexical_alternative
  - marker: b
    text: Literally 'chief/captain of the slaughterers.' In this context the title refers to the Babylonian captain of the guard.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 경호대장[a]은 그 땅의 가장 가난한 사람들 가운데 일부를 포도원 일꾼과 밭일꾼[b]으로 남겨 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘도살자/처형자들의 우두머리’입니다. 여기서는 바빌로니아 왕실 경호대의 지휘관을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘땅을 일구는 일꾼’. 히브리어는 토양을 경작하는 농업 노동자를 넓게 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/דַּלַּת הָ/אָרֶץ
  english_pob_choice: But from the poorest of the land
  chosen_korean: 그 땅에서 가장 가난한 자들 가운데서만
  alternatives_korean:
  - 그 땅의 가난한 자들 가운데서
  - 그 땅의 가장 낮은 자들 가운데서
  lexicon: HALOT
  rationale: דל/דלה의 부정적 사회경제적 상태를 문맥상 ‘가장 가난한 자들’로 옮겼고, 부분적 선택을 드러내기 위해 ‘가운데서만’으로 한정했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 경비대장
  - 호위대장
  - 도살자들의 우두머리
  lexicon: HALOT
  rationale: 문자적으로는 ‘도살자들의 우두머리’이지만, 왕실 군사 직함으로는 경호대장/호위대장에 해당하므로 문맥상 기능을 살린 표현을 택했습니다.
- source_word: לְכֹרְמִים
  english_pob_choice: to be vinedressers
  chosen_korean: 포도원지기
  alternatives_korean:
  - 포도 재배자
  - 포도밭 일꾼
  lexicon: HALOT
  rationale: 포도원에서 일하는 직업을 나타내므로 한국어 성경어법에 잘 맞는 ‘포도원지기’를 사용했습니다.
- source_word: וּ/לְ/יֹגְבִים
  english_pob_choice: and field workers
  chosen_korean: 농사꾼
  alternatives_korean:
  - 밭일꾼
  - 농부
  - 경작자
  lexicon: HALOT
  rationale: 어근이 토지를 일구는 농업 노동을 가리키므로, 지나치게 특정 작업에 묶지 않으면서도 자연스러운 현대 한국어인 ‘농사꾼’으로 옮겼습니다.
