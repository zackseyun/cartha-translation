source:
  edition: WLC
  text: וְ/אֶת הַ/סִּירֹ֨ת וְ/אֶת הַ/יָּעִ֜ים וְ/אֶת הַֽ/מְזַמְּר֣וֹת וְ/אֶת הַ/כַּפּ֗וֹת וְ/אֵ֨ת כָּל כְּלֵ֧י הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר יְשָֽׁרְתוּ בָ֖/ם לָקָֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/014.yaml
  text: And the pots[a], the shovels, the snuffers, the dishes, and all the bronze vessels with which they ministered—they took away.
  footnotes:
  - marker: a
    text: Or 'knives' or 'pruning knives' for 'snuffers'; the Hebrew term may denote a cutting implement, but in this temple-vessel context it is commonly understood as an instrument for trimming lamps.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 냄비들과 삽들과 심지를 자르는 기구들과 접시들과, 그들이 그것들로 섬기던 모든 놋그릇을 가져갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘심지를 자르는 기구들’은 원문의 ‘snuffers’를 기능적으로 옮긴 것입니다. 문맥상 등잔 심지를 다듬는 도구를 가리키지만, 자르는 기구 일반으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסִּירֹת
  english_pob_choice: the pots
  chosen_korean: 냄비들
  alternatives_korean:
  - 솥들
  - 그릇들
  lexicon: HALOT
  rationale: סִירוֹת는 조리용 용기나 솥을 가리키므로, 성전 기물 목록에서는 기능을 너무 좁히지 않으면서도 자연스러운 ‘냄비들’이 적절합니다.
- source_word: הַיָּעִים
  english_pob_choice: the shovels
  chosen_korean: 삽들
  alternatives_korean:
  - 부삽들
  - 국자들
  lexicon: HALOT
  rationale: 제단의 재를 치우거나 숯을 다루는 도구로 이해되므로, 한국어에서는 가장 مستقیم하고 읽기 쉬운 ‘삽들’이 맞습니다.
- source_word: הַמְזַמְּרוֹת
  english_pob_choice: the snuffers
  chosen_korean: 심지를 자르는 기구들
  alternatives_korean:
  - 심지집게들
  - 가위들
  - 불집게들
  lexicon: HALOT
  rationale: 이 단어는 문맥상 등잔 심지를 손질하는 도구를 가리킬 가능성이 크므로, 단순히 ‘가위들’로 풀기보다 기능을 드러내는 표현을 택했습니다.
- source_word: כְּלֵי הַנְּחֹשֶׁת
  english_pob_choice: all the bronze vessels
  chosen_korean: 모든 놋그릇
  alternatives_korean:
  - 모든 청동 기물
  - 모든 놋기물
  lexicon: HALOT
  rationale: כְּלִים은 넓게는 기물이지만, 한국어 성경 문맥에서는 성전 용기를 ‘그릇’으로 옮기는 것이 자연스럽고, נְחֹשֶׁת는 전통적이면서도 문맥상 무난한 ‘놋’으로 옮겼습니다.
- source_word: יְשָׁרְתוּ בָם
  english_pob_choice: with which they ministered
  chosen_korean: 그들이 그것들로 섬기던
  alternatives_korean:
  - 그들이 그것들로 봉사하던
  - 그것들로 사용하던
  lexicon: HALOT
  rationale: שרת는 성전 맥락에서 단순 사용보다 예배·성전 봉사의 뉘앙스가 있어, 이를 살리되 한국어에서는 ‘섬기다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 성전 기물과 ‘섬기다’의 번역 뉘앙스
  chosen_reading: 성전에서의 봉사 행위를 단순한 일반 사용이 아니라 예배적 섬김으로 읽고 ‘섬기던’으로 옮겼습니다.
  alternative_readings:
  - ‘사용하던’으로 중립화
  - ‘봉사하던’으로 직역
  rationale: 문맥은 예루살렘 성전 기물 목록이므로, 도구의 용도를 넘어 예배 봉사의 맥락을 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 성전 봉사/예배 용어
