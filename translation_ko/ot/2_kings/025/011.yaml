id: 2KI.25.11
reference: 2 Kings 25:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵת֩ יֶ֨תֶר הָ/עָ֜ם הַ/נִּשְׁאָרִ֣ים בָּ/עִ֗יר וְ/אֶת הַ/נֹּֽפְלִים֙ אֲשֶׁ֤ר נָפְלוּ֙ עַל הַ/מֶּ֣לֶךְ בָּבֶ֔ל וְ/אֵ֖ת יֶ֣תֶר הֶ/הָמ֑וֹן הֶגְלָ֕ה נְבוּזַרְאֲדָ֖ן רַב טַבָּחִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/011.yaml
  text: Nebuzaradan the captain of the guard carried into exile the rest of the people who remained in the city[a], the deserters who had defected to the king of Babylon[c][b], and the rest of the multitude.
  footnotes:
  - marker: a
    text: Or 'the defectors who had gone over to the king of Babylon'; literally, 'the ones who had fallen to the king of Babylon.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'chief of the slaughterers'; likely an official title for the commander of the royal guard.
    reason: cultural_note
  - marker: c
    text: Or 'the rest of the crowd' or 'the rest of the population' for 'the rest of the multitude.'
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론의 왕에게로 넘어간 자들[c][b]과 성읍에 남아 있던 나머지 백성[a], 그리고 나머지 무리를 느부사라단 곧 시위대 장관이 포로로 끌고 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바로 그 성읍에 남아 있던 사람들’; 히브리어는 직역하면 ‘성읍 안에 남아 있던 사람들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘도살자들의 우두머리’로, 여기서는 왕실 경호대의 지휘관을 가리키는 직함으로 보입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘나머지 무리’보다 ‘나머지 군중’이나 ‘나머지 주민’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים בָּעִיר
  english_pob_choice: who remained in the city
  chosen_korean: 성읍에 남아 있던
  alternatives_korean:
  - 성읍 안에 남아 있던
  - 도시에 남은
  lexicon: HALOT
  rationale: נשאר의 ‘남아 있다’는 뜻을 자연스럽게 살리면서, Jerusalem의 도시 맥락을 ‘성읍’으로 간결하게 표현했습니다.
- source_word: הַנֹּפְלִים ... נָפְלוּ עַל
  english_pob_choice: the deserters who had defected to
  chosen_korean: 바빌론의 왕에게로 넘어간 자들
  alternatives_korean:
  - 바빌론 왕에게로 투항한 자들
  - 바빌론 왕에게로 떨어져 간 자들
  lexicon: HALOT
  rationale: 이 관용구는 문자적으로 ‘넘어가다’보다는 정치·군사적 맥락의 ‘전향/투항’ 의미이므로, 한국어로는 군더더기 없이 ‘넘어간’으로 옮겼습니다.
- source_word: יֶתֶר הָעָם / יֶתֶר הֶהָמוֹן
  english_pob_choice: the rest of the people / the rest of the multitude
  chosen_korean: 나머지 백성 / 나머지 무리
  alternatives_korean:
  - 남은 백성 / 남은 무리
  - 그 밖의 백성 / 그 밖의 무리
  lexicon: HALOT
  rationale: יֶתֶר의 ‘남은, 나머지’와 הָמוֹן의 집합적 뉘앙스를 각각 살리되, 한국어에서는 ‘무리’가 ‘multitude’의 넓은 집합성을 잘 보존합니다.
- source_word: הֶגְלָה
  english_pob_choice: carried into exile
  chosen_korean: 포로로 끌고 갔습니다
  alternatives_korean:
  - 포로로 잡아갔습니다
  - 유배시켰습니다
  lexicon: HALOT
  rationale: 히필형 גלה의 강제 이주·추방 성격을 분명히 하면서도, 한국어 독자가 즉시 이해할 수 있는 서술로 정리했습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 시위대 장관
  alternatives_korean:
  - 경호대 장관
  - 호위대 대장
  lexicon: HALOT
  rationale: 문자적으로는 ‘도살자들의 우두머리’이지만, 본문 맥락상 바빌론 왕실의 공식 직함이므로 전통적 기능어인 ‘시위대 장관’을 사용했습니다.
theological_decisions:
- issue: ‘넘어간 자들’의 정치·군사적 의미
  chosen_reading: 단순한 이동이 아니라 바빌론 왕에게 귀순한 자들로 이해했습니다.
  alternative_readings:
  - 그냥 바빌론으로 간 사람들
  - 전쟁 중 흩어진 사람들
  rationale: 동사 נפל על은 이 문맥에서 ‘배신/귀순’의 관용적 의미를 가지므로, 독자가 본문의 정치적 긴장을 놓치지 않도록 했습니다.
  doctrine_reference: 본문의 역사 서술과 군사적 맥락 보존
- issue: ‘포로로 끌고 갔습니다’의 강제성
  chosen_reading: 느부사라단이 이들을 강제로 이주시킨 것으로 옮겼습니다.
  alternative_readings:
  - 데려갔습니다
  - 이주시켰습니다
  rationale: הגלה는 자발적 이동이 아니라 포로·추방의 강제성을 내포하므로, 그 의미를 분명히 드러냈습니다.
  doctrine_reference: 포로기 역사 이해
