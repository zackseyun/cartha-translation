  text: וַ/יְהִי֩ בִ/שְׁלֹשִׁ֨ים וָ/שֶׁ֜בַע שָׁנָ֗ה לְ/גָלוּת֙ יְהוֹיָכִ֣ין מֶֽלֶךְ יְהוּדָ֔ה בִּ/שְׁנֵ֤ים עָשָׂר֙ חֹ֔דֶשׁ בְּ/עֶשְׂרִ֥ים וְ/שִׁבְעָ֖ה לַ/חֹ֑דֶשׁ נָשָׂ֡א אֱוִ֣יל מְרֹדַךְ֩ מֶ֨לֶךְ בָּבֶ֜ל בִּ/שְׁנַ֣ת מָלְכ֗/וֹ אֶת רֹ֛אשׁ יְהוֹיָכִ֥ין מֶֽלֶךְ יְהוּדָ֖ה מִ/בֵּ֥ית כֶּֽלֶא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/027.yaml
  text: And it happened in the thirty-seventh year of the exile of Jehoiachin king of Judah[a], in the twelfth month, on the twenty-seventh day of the month, that Evil-merodach king of Babylon, in the year of his reign[c][b], lifted up the head of Jehoiachin king of Judah out of the prison.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''lifted up the head of,'' meaning he elevated Jehoiachin''s status or showed him favor, beginning with his release from prison.'
    reason: lexical_alternative
  - marker: b
    text: Evil-merodach is also known historically as Amel-Marduk.
    reason: cultural_note
  - marker: c
    text: '''In the year of his reign'' may mean ''in the first year of his reign.'''
    reason: alternative_reading
translation:
  language: ko
  text: 유다 왕 여호야긴이 유배된 지 삼십칠 년째 되던 해, 곧 열두째 달 이십칠일에 이런 일이 있었습니다. 바벨론 왕 에윌므로닥은 그가 통치하던 해에 유다 왕 여호야긴을 감옥에서 풀어 주고 호의를 베풀어 그의 지위를 높였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “여호야긴의 머리를 감옥에서 들어 올렸다”라고 합니다. 이는 그에게 호의를 베풀어 지위를 높이고 감옥에서 풀어 주었다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 에윌므로닥은 역사적으로 아멜마르둑으로도 알려져 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어는 문자적으로 “그의 통치의 해에”라고 합니다. 이것은 그의 통치 첫해를 뜻할 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: …에
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: 히브리어 서술 도입어로서 사건 전환을 표시하는 기능을 살려, 한국어에서는 시간 부사구 뒤의 조사 처리로 자연스럽게 이어지게 했습니다.
- source_word: לְגָלוּת
  english_pob_choice: of the exile
  chosen_korean: 유배
  alternatives_korean:
  - 포로 됨
  - 포로 생활
  lexicon: HALOT
  rationale: גלות는 단순한 감금보다 추방·이주된 상태를 가리키므로, 현대 한국어에서 가장 자연스럽고 정확한 '유배'를 택했습니다.
- source_word: נָשָׂא ... אֶת רֹאשׁ
  english_pob_choice: lifted up the head of
  chosen_korean: 머리를 들어 올렸습니다
  alternatives_korean:
  - 머리를 높였습니다
  - 그의 지위를 높였습니다
  - 풀어 주었습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 본문에 보존하고, 실제 의미는 주석으로 설명할 수 있게 했습니다. 단순히 '풀어 주다'로 바꾸면 원문의 관용적 표현이 사라집니다.
- source_word: מִבֵּית כֶּלֶא
  english_pob_choice: out of the prison
  chosen_korean: 감옥에서
  alternatives_korean:
  - 감옥 밖으로
  - 구금소에서
  - 옥에서
  lexicon: HALOT
  rationale: כֶּלֶא는 구금 장소를 뜻하므로, 현대 독자가 바로 이해할 수 있는 '감옥'을 사용했습니다.
theological_decisions:
- issue: 왕의 이름 표기와 바벨론 왕의 역사적 호칭
  chosen_reading: 에윌므로닥
  alternative_readings:
  - 에빌므로닥
  - 아멜마르둑
  rationale: 본문의 전통적 성서 인명 형태를 유지하되, 본문에는 한국어 독자가 알아볼 수 있는 통용 표기를 사용했습니다. 역사 복원형은 본문이 아니라 주석 정보로 처리하는 것이 적절합니다.
  doctrine_reference: 이름 표기는 교리 쟁점이 아니라 번역 관례의 문제입니다.
- issue: '''his reign''의 시간 표현'
  chosen_reading: 자기 통치 원년
  alternative_readings:
  - 그의 통치의 해
  - 통치 첫해
  rationale: 히브리어 בִּשְׁנַת מָלְכוֹ는 통치 연도 맥락을 가리키며, 여기서는 문맥상 첫해로 이해될 수 있지만 원문 자체의 여지를 남기기 위해 '원년'으로 옮겼습니다.
  doctrine_reference: 본문의 역사적 시간 표기는 과잉 확정하지 않고 문맥적 가능성을 열어 두는 것이 적절합니다.
