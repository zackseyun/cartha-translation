  naturalness: 날짜와 인명 표기는 대체로 자연스럽습니다. 다만 ‘유배 37년’은 ‘유배된 지 삼십칠 년째 되던 해’로 풀면 현대 한국어에서 더 명료하며, 관용구는 본문에서 의미를 옮기고 각주에 직역을 밝혀야 자연스럽습니다.
  terminology: ‘여호야긴’, ‘바벨론’, ‘에윌므로닥’, ‘감옥’은 적절합니다. בִּשְׁנַת מָלְכוֹ의 불확정성을 보존하여 ‘그가 통치하던 해에’로 옮기고, 원문의 ‘머리를 들다’ 관용구는 ‘호의를 베풀어 지위를 높이다’로 번역합니다.
