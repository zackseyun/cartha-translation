translation:
  language: ko
  text: 그는 야훼의 집[a]과 왕궁과 예루살렘의 모든 집을 불태웠고, 큰 집마다[b] 불로 태웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전’. 히브리어는 ‘야훼의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘규모가 큰 집마다’ 또는 ‘중요한 집마다’. 히브리어 표현은 규모나 중요성을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  english_pob_choice: He burned
