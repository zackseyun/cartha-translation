  alternatives_korean:
  - 불태웠습니다
  - 불로 태웠습니다
  lexicon: HALOT
  rationale: 서술 동작을 자연스럽고 직접적으로 옮기되, 뒤의 בָּאֵשׁ(불로)와 겹치지 않도록 한국어에서는 ‘태우다’로 처리했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘집’을 유지해 원문 표현을 살리고, POB의 יְהוָה→야훼 원칙을 따랐습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king's house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 왕의 궁전
  lexicon: HALOT
  rationale: 문맥상 단순한 개인 주택보다 왕의 거처·궁궐을 가리키므로, 한국어에서 가장 자연스러운 ‘왕궁’을 택했습니다.
- source_word: כָּל בֵּית גָּדוֹל
  english_pob_choice: every great house
  chosen_korean: 큰 집마다
  alternatives_korean:
  - 큰 집들마다
  - 중요한 집마다
  lexicon: HALOT
  rationale: גָּדוֹל이 크기와 중요성의 여지를 함께 가지므로, 의미를 좁히지 않고 분배적 표현 ‘...마다’로 옮겼습니다.
theological_decisions:
