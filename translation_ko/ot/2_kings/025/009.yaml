id: 2KI.25.9
reference: 2 Kings 25:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׂרֹ֥ף אֶת בֵּית יְהוָ֖ה וְ/אֶת בֵּ֣ית הַ/מֶּ֑לֶךְ וְ/אֵ֨ת כָּל בָּתֵּ֧י יְרוּשָׁלִַ֛ם וְ/אֶת כָּל בֵּ֥ית גָּד֖וֹל שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/009.yaml
  text: He burned the house of Yahweh[a], the king's house, all the houses of Jerusalem[b], and every great house with fire.
  footnotes:
  - marker: a
    text: 'Or ''the temple of the LORD.'' Hebrew: ''the house of the LORD.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'every large house' or 'every important house.' The Hebrew expression may refer to houses notable for size or prominence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 집과 왕궁과 예루살렘의 모든 집과 큰 집마다 불로 태웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 성전’. 히브리어는 ‘야훼의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘중요한 집마다’ 혹은 ‘유력한 집마다’. 히브리어 표현은 크기나 지위를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂרֹף
  english_pob_choice: He burned
  chosen_korean: 태웠습니다
  alternatives_korean:
  - 불태웠습니다
  - 불로 태웠습니다
  lexicon: HALOT
  rationale: 서술 동작을 자연스럽고 직접적으로 옮기되, 뒤의 בָּאֵשׁ(불로)와 겹치지 않도록 한국어에서는 ‘태우다’로 처리했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘집’을 유지해 원문 표현을 살리고, POB의 יְהוָה→야훼 원칙을 따랐습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king's house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 왕의 궁전
  lexicon: HALOT
  rationale: 문맥상 단순한 개인 주택보다 왕의 거처·궁궐을 가리키므로, 한국어에서 가장 자연스러운 ‘왕궁’을 택했습니다.
- source_word: כָּל בֵּית גָּדוֹל
  english_pob_choice: every great house
  chosen_korean: 큰 집마다
  alternatives_korean:
  - 큰 집들마다
  - 중요한 집마다
  lexicon: HALOT
  rationale: גָּדוֹל이 크기와 중요성의 여지를 함께 가지므로, 의미를 좁히지 않고 분배적 표현 ‘...마다’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 집의 번역에서 ‘성전’ 대신 ‘집’을 유지할지 여부
  chosen_reading: ‘야훼의 집’으로 직역해 원문 표상을 보존했습니다.
  alternative_readings:
  - ‘야훼의 성전’
  - ‘주님의 성전’
  rationale: 본문은 בֵּית יְהוָה(‘야훼의 집’)를 사용하므로, 제도적 용어인 ‘성전’으로 바꾸면 원문의 직유적 표현이 약해집니다.
  doctrine_reference: 표현 보존 원칙 / YHWH 번역 원칙
