base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/005.yaml
  text: But the army of the Chaldeans pursued the king and overtook him in the plains of Jericho[b][a], and all his army was scattered from him.
  footnotes:
  - marker: a
    text: Or 'the army of the Babylonians.' The Hebrew reads 'Chaldeans,' the term used throughout this context for Babylonian forces.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the steppes of Jericho.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 갈대아 군대가 왕을 추격하여 여리고 평지에서 그를 따라잡았고, 그의 모든 군대는 그에게서 흩어졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌로니아 군대’. 히브리어는 이 문맥에서 일관되게 ‘갈대아인’(Chaldeans)을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여리고의 스텝 지역에서’. 히브리어 עֲרָבוֹת은 평지대/스텝을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל כַּשְׂדִּים
  english_pob_choice: the army of the Chaldeans
  chosen_korean: 갈대아 군대
  alternatives_korean:
  - 갈대아인의 군대
  - 갈대아 사람들의 군대
  - 바빌로니아 군대
  lexicon: HALOT
  rationale: חֵיל은 군대/군사력을 뜻하므로 ‘군대’로 옮기고, כַּשְׂדִּים은 본문 표기대로 ‘갈대아’로 유지해 POB의 사료 밀착성을 살렸습니다.
- source_word: וַיִּרְדְּפוּ אַחַר הַמֶּלֶךְ
  english_pob_choice: pursued the king
  chosen_korean: 왕을 추격하여
  alternatives_korean:
  - 왕을 뒤쫓아
  - 왕을 추격했습니다
  - 왕을 쫓았습니다
  lexicon: HALOT
  rationale: רדף는 군사 서술에서 ‘추격하다’가 가장 직접적이며, אַחַר의 추격 방향성을 한국어 어법에 맞게 자연스럽게 반영했습니다.
- source_word: וַיַּשִּׂגוּ אֹתוֹ
  english_pob_choice: overtook him
  chosen_korean: 그를 따라잡았고
  alternatives_korean:
  - 그를 따라잡았으며
  - 그를 추월했고
  - 그를 붙잡았고
  lexicon: HALOT
  rationale: נשׂג는 ‘따라잡다/추월하다’의 뜻이므로 군사적 추격 상황에 맞는 ‘따라잡다’를 선택했습니다.
- source_word: בְּעַרְבוֹת יְרֵחוֹ
  english_pob_choice: in the plains of Jericho
  chosen_korean: 여리고 평지
  alternatives_korean:
  - 여리고 들판
  - 여리고의 평원
  - 여리고 스텝
  lexicon: HALOT
  rationale: עֲרָבוֹת은 steppe/평지대의 뜻이지만 한국어에서는 ‘여리고 평지’가 가장 간결하고 자연스럽습니다.
- source_word: וְכָל חֵילוֹ נָפֹצוּ מֵעָלָיו
  english_pob_choice: and all his army was scattered from him
  chosen_korean: 그의 모든 군대는 그에게서 흩어졌습니다
  alternatives_korean:
  - 그의 모든 군대가 그에게서 흩어졌습니다
  - 그의 모든 군대는 그에게서 흩어졌습니다
  - 그의 모든 군세는 그에게서 흩어졌습니다
  lexicon: HALOT
  rationale: נפץ는 ‘흩어지다/분산되다’의 뜻을 살리고, מֵעָלָיו는 단순히 ‘그에게서’로 옮겨 분리의 결과를 분명히 했습니다.
theological_decisions:
- issue: 갈대아인과 바빌로니아인의 호칭
  chosen_reading: 본문 표기를 따라 ‘갈대아’로 번역하고, ‘바빌로니아 군대’는 본문 주석적 대안으로만 처리했습니다.
  alternative_readings:
  - 바빌로니아 군대
  - 갈대아 사람들의 군대
  rationale: 히브리어가 이 문맥에서 일관되게 כַּשְׂדִּים을 사용하므로, 고유한 본문 표지를 보존하는 것이 사료적으로 더 정확합니다.
  doctrine_reference: 본문 비평/역사서술상의 명칭 보존
