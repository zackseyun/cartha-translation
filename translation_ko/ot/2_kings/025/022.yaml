  yaml_path: translation/ot/2_kings/025/022.yaml
  text: As for the people who remained in the land of Judah[a], whom Nebuchadnezzar king of Babylon had left, he appointed Gedaliah son of Ahikam, son of Shaphan, over them.
  footnotes:
  - marker: a
    text: Or "who were left"; the Hebrew participle can be rendered either way, emphasizing those remaining in Judah after the deportations.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 땅에 남아 있던[a] 백성, 곧 바빌론 왕 느부갓네살이 남겨 둔 백성을 다스리도록 그는 사반의 아들 아히감의 아들인 그달리야를 임명했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남겨진 백성”. 히브리어 분사는 유다 땅에 남아 있던 백성을 가리키며, ‘남겨진’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעָם הַנִּשְׁאָר
  english_pob_choice: the people who remained
  chosen_korean: 유다 땅에 남아 있던 백성
