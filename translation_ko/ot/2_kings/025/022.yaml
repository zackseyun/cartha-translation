  lexicon: HALOT
  rationale: פקד + עַל은 행정적 임명/배치를 뜻하므로, 위임 통치를 자연스럽게 드러내는 ‘그들 위에 세웠습니다’를 택했습니다.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  english_pob_choice: Gedaliah son of Ahikam, son of Shaphan
  chosen_korean: 아히감의 아들, 사반의 손자 그달리야
  alternatives_korean:
