theological_decisions:
- issue: 남아 있는 백성의 지위 표현
  chosen_reading: 설명적 문맥에 맞춰 ‘남아 있던 백성’으로 옮기고, ‘남은 자’라는 신학적 용어는 주석 없이 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘남은 자’
  - ‘남은 사람들’
  rationale: 본문은 구원론적 표어보다 역사 서술에 초점이 있으므로, 원문의 묘사성을 우선해 과도한 신학적 개념화를 피했습니다.
  doctrine_reference: 역사서의 서술적 문맥 해석
