  - 그 땅에 남은 사람들
  lexicon: HALOT
  rationale: הָעָם은 집단적 민족/백성을 가리키므로 ‘백성’이 자연스럽고, הַנִּשְׁאָר는 ‘남아 있던’으로 풀어 남겨진 상태를 설명했습니다.
- source_word: בְּאֶרֶץ יְהוּדָה
