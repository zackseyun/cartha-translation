  chosen_korean: 유다 땅에
  alternatives_korean:
  - 유다의 땅에
  - 유다 지방에
  lexicon: HALOT
  rationale: אֶרֶץ의 지리적 의미를 살려 ‘땅’으로 옮겨, 포로기 이후의 영토적 배경을 유지했습니다.
- source_word: אֲשֶׁר הִשְׁאִיר נְבוּכַדְנֶאצַּר מֶלֶךְ בָּבֶל
  english_pob_choice: whom Nebuchadnezzar king of Babylon had left
  chosen_korean: 곧 바빌로니아 왕 느부갓네살이 남겨 둔 사람들을
  alternatives_korean:
  - 곧 느부갓네살 바빌론 왕이 남겨 둔 사람들을
  - 곧 바빌론 왕 느부갓네살이 남겨 둔 사람들을
  lexicon: HALOT
  rationale: הִשְׁאִיר의 사역적 의미를 살려 ‘남겨 둔’으로 옮겼고, 전치사구를 앞의 대상을 풀어 설명하는 절로 처리해 문장을 자연스럽게 했습니다.
- source_word: וַיַּפְקֵד עֲלֵיהֶם
  english_pob_choice: he appointed ... over them
  chosen_korean: 그는 ... 그들 위에 세웠습니다
  alternatives_korean:
  - 그는 ... 그들 위에 임명했습니다
  - 그는 ... 그들 위에 세웠습니다
  lexicon: HALOT
  rationale: פקד + עַל은 행정적 임명/배치를 뜻하므로, 위임 통치를 자연스럽게 드러내는 ‘그들 위에 세웠습니다’를 택했습니다.
- source_word: גְּדַלְיָהוּ בֶּן אֲחִיקָם בֶּן שָׁפָן
  english_pob_choice: Gedaliah son of Ahikam, son of Shaphan
  chosen_korean: 아히감의 아들, 사반의 손자 그달리야
  alternatives_korean:
