  to: 그때 모든 백성, 곧 가장 낮은 이부터 가장 높은 이까지, 그리고 군대의 지휘관들[a]이 일어나 이집트로 갔습니다. 이는 그들이 갈대아 사람들을 두려워했기 때문입니다.
