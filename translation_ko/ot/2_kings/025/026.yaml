base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/026.yaml
  text: Then all the people[a], from the least to the greatest, and the commanders of the forces, arose and went to Egypt, because they were afraid of the Chaldeans.
  footnotes:
  - marker: a
    text: Or 'the army officers' or 'the captains of the troops.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 모든 백성, 곧 가장 낮은 이부터 가장 높은 이까지, 그리고 군대의 지휘관들[a]이 일어나 이집트로 갔습니다. 이는 그들이 갈대아 사람들을 두려워했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘군대 장교들’ 또는 ‘부대의 대장들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל הָעָם מִקָּטֹן וְעַד גָּדוֹל
  english_pob_choice: all the people, from the least to the greatest
  chosen_korean: 모든 백성—가장 작은 자부터 가장 큰 자까지—
  alternatives_korean:
  - 온 백성—지극히 작은 자부터 지극히 큰 자까지—
  - 모든 사람—가장 낮은 자부터 가장 높은 자까지—
  lexicon: HALOT
  rationale: ‘가장 작은 자부터 가장 큰 자까지’는 신분과 영향력의 총체성을 자연스럽게 살리며, 연령으로 좁히지 않으면서도 원문의 관용구를 보존합니다.
- source_word: וְשָׂרֵי הַחֲיָלִים
  english_pob_choice: and the commanders of the forces
  chosen_korean: 군대의 지휘관들
  alternatives_korean:
  - 군대 장관들
  - 군대의 장수들
  lexicon: HALOT
  rationale: שָׂרֵי는 통치·지휘하는 자들을 가리키므로 ‘지휘관들’이 현대 한국어에서 가장 분명하며, חֲיָלִים은 여기서 군사 부대를 뜻하므로 ‘군대’로 옮겼습니다.
- source_word: וַיָּבֹאוּ מִצְרָיִם
  english_pob_choice: went to Egypt
  chosen_korean: 이집트로 갔습니다
  alternatives_korean:
  - 이집트에 이르렀습니다
  - 이집트로 떠났습니다
  lexicon: HALOT
  rationale: 서술자의 시점에서 이동의 방향을 자연스럽게 나타내기 위해 ‘갔습니다’를 택했습니다.
- source_word: כִּי יָרְאוּ מִפְּנֵי כַשְׂדִּים
  english_pob_choice: because they were afraid of the Chaldeans
  chosen_korean: 이는 그들이 갈대아 사람들을 두려워했기 때문입니다
  alternatives_korean:
  - 그들이 갈대아 사람들을 무서워했기 때문입니다
  - 갈대아 사람들 앞에서 두려워했기 때문입니다
  lexicon: HALOT
  rationale: יָרְאוּ는 단순 감정 상태의 두려움을 뜻하므로 ‘두려워했습니다’가 가장 직접적입니다. כַשְׂדִּים은 예레미야·열왕기 문맥의 역사적 민족명으로 ‘갈대아 사람들’이 적절합니다.
theological_decisions:
- issue: 야훼 이름이나 직접 신학 용어가 나타나지 않는 역사 서술의 처리
  chosen_reading: 직역보다 서술의 흐름과 역사적 긴장을 드러내는 평이한 문체를 유지했습니다.
  alternative_readings:
