id: 2KI.25.24
reference: 2 Kings 25:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשָּׁבַ֨ע לָ/הֶ֤ם גְּדַלְיָ֨הוּ֙ וּ/לְ/אַנְשֵׁי/הֶ֔ם וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַל תִּֽירְא֖וּ מֵ/עַבְדֵ֣י הַ/כַּשְׂדִּ֑ים שְׁב֣וּ בָ/אָ֗רֶץ וְ/עִבְד֛וּ אֶת מֶ֥לֶךְ בָּבֶ֖ל וְ/יִטַ֥ב לָ/כֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/024.yaml
  text: Gedaliah swore to them and to their men[a], and said to them, “Do not be afraid of the servants of the Chaldeans. Live in the land and serve the king of Babylon[b], and it will go well for you.”
  footnotes:
  - marker: a
    text: Or 'the officials of the Chaldeans.' The Hebrew reads 'the servants of the Chaldeans,' which may refer to Babylonian agents or administrators.
    reason: lexical_alternative
  - marker: b
    text: '''Chaldeans'' is the Hebrew term; it can also be rendered ''Babylonians'' in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그달리야는 그들과 그들에게 딸린 사람들에게[a] 맹세하고, 그들에게 말했습니다. “갈대아 사람들의 종들을[b] 두려워하지 마십시오. 이 땅에 머물러 살며 바벨론 왕을 섬기십시오. 그러면 여러분에게 잘될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 사람들에게’. 히브리어는 문자적으로 ‘그들의 남자들/사람들’이며, 이 지도자들과 함께한 사람들, 곧 그들의 수행원이나 부하를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 히브리어 표현이며, 이 문맥에서는 ‘바빌로니아 사람들’로도 옮길 수 있습니다. ‘종들’은 바빌로니아의 관리나 대리인을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  english_pob_choice: swore
  chosen_korean: 맹세하고
  alternatives_korean:
  - 맹세했습니다
  - 맹세를 했습니다
  lexicon: HALOT
  rationale: שׁבע는 서약하다/맹세하다의 뜻이므로, 서사 문맥에서 간결하게 ‘맹세하고’로 옮겨 행위의 성격을 분명히 했습니다.
- source_word: וּלְאַנְשֵׁיהֶם
  english_pob_choice: and to their men
  chosen_korean: 그들의 사람들에게
  alternatives_korean:
  - 그들의 부하들에게
  - 그들의 병사들에게
  lexicon: HALOT
  rationale: אַנְשִׁים은 문자적으로 ‘사람들/남자들’이지만, 여기서는 그 지도자들에게 딸린 무리를 가리킬 수 있어 원문의 넓은 의미를 살려 ‘그들의 사람들’로 두었습니다.
- source_word: מֵעַבְדֵי הַכַּשְׂדִּים
  english_pob_choice: of the servants of the Chaldeans
  chosen_korean: 갈대아 사람의 종들을
  alternatives_korean:
  - 갈대아 사람의 관리들을
  - 갈대아 사람의 신하들을
  lexicon: HALOT
  rationale: עבדי를 기본형인 ‘종들’로 옮겨 원문 표현을 유지했습니다. 문맥상 관리나 행정 대리일 수 있지만, 해석적 구체화는 본문이 요구하는 범위를 넘을 수 있어 주석적 선택으로 남겼습니다.
- source_word: הַכַּשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람
  alternatives_korean:
  - 바빌로니아 사람
  - 갈대아인
  lexicon: HALOT
  rationale: POB의 기본 선택을 따라 민족명/제국명으로서의 ‘갈대아 사람’을 사용해 원문 표지를 보존했습니다.
- source_word: וְעִבְדוּ אֶת מֶלֶךְ בָּבֶל
  english_pob_choice: and serve the king of Babylon
  chosen_korean: 바벨론 왕을 섬기십시오
  alternatives_korean:
  - 바벨론 왕에게 봉사하십시오
  - 바벨론 왕을 섬기며 살십시오
  lexicon: HALOT
  rationale: עבד는 여기서 정치적 종속을 포함한 ‘섬기다’의 뜻이므로, 현대 한국어에서 자연스럽고 직접적인 ‘섬기십시오’로 옮겼습니다.
- source_word: וְיִטַב לָכֶם
  english_pob_choice: and it will go well for you
  chosen_korean: 그러면 여러분에게 잘될 것입니다
  alternatives_korean:
  - 그러면 여러분이 잘 지내게 될 것입니다
  - 그러면 여러분에게 복이 있을 것입니다
  lexicon: HALOT
  rationale: יטב의 관용적 의미를 살려, 결과가 유익해진다는 약속을 자연스러운 현대 한국어로 표현했습니다.
theological_decisions:
- issue: 왕권에 대한 순종 권면의 어조
  chosen_reading: 본문의 명령형을 완화하지 않고, 포로 이후 현실 속에서 살아남기 위한 실제적 권고로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - 바벨론에 대한 정치적 협조 조언으로 더 강하게 의역하기
  - 도덕적 순종 일반으로 넓혀 번역하기
  rationale: 히브리어 명령형들의 연쇄(두려워하지 마십시오, 머물러 있으십시오, 섬기십시오)는 서사적 권고의 핵심이므로, 해석을 과도하게 넓히지 않고 그대로 드러내는 것이 본문의 의미를 더 정확히 전달합니다.
  doctrine_reference: 본문 주해 원칙 및 서사 문맥
- issue: 직접화법의 한국어 높임
  chosen_reading: 그다랴의 발화는 청자에게 공손한 합쇼체 명령으로 처리했습니다.
  alternative_readings:
  - 평서형으로 완화하기
  - 성경식 명령형으로 더 고정적으로 옮기기
  rationale: 히브리어 명령문의 기능을 살리면서도 현대 한국어 성경 문체에 맞추기 위해, 직접화법 안에서 ‘마십시오/하십시오’ 체를 유지했습니다.
  doctrine_reference: 한국어 번역 문체 규범
