  source_fidelity: 본문의 ‘포위된 상태에 있었습니다’는 히브리어 관용구가 나타내는 지속적인 포위 상태를 적절히 전달합니다. 다만 문두의 ‘그러므로’는 원문의 단순 서술 접속사 וַ가 지닌 인과적 의미를 과도하게 구체화하므로 ‘그리하여’로 조정하는 것이 안전합니다.
  naturalness: ‘포위되어 있었습니다’가 ‘포위된 상태에 있었습니다’보다 더 간결하고 자연스러우며, 현대 표준 한국어의 합쇼체 서술에 잘 맞습니다. ‘시드기야 왕 제십일 년’은 왕의 재위 연대를 자연스럽게 나타냅니다.
