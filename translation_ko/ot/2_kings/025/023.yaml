source:
  edition: WLC
  text: וַ/יִּשְׁמְעוּ֩ כָל שָׂרֵ֨י הַ/חֲיָלִ֜ים הֵ֣מָּה וְ/הָ/אֲנָשִׁ֗ים כִּֽי הִפְקִ֤יד מֶֽלֶךְ בָּבֶל֙ אֶת גְּדַלְיָ֔הוּ וַ/יָּבֹ֥אוּ אֶל גְּדַלְיָ֖הוּ הַ/מִּצְפָּ֑ה וְ/יִשְׁמָעֵ֣אל בֶּן נְתַנְיָ֡ה וְ/יוֹחָנָ֣ן בֶּן קָ֠רֵחַ וּ/שְׂרָיָ֨ה בֶן תַּנְחֻ֜מֶת הַ/נְּטֹפָתִ֗י וְ/יַֽאֲזַנְיָ֨הוּ֙ בֶּן הַ/מַּ֣עֲכָתִ֔י הֵ֖מָּה וְ/אַנְשֵׁי/הֶֽם־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/023.yaml
  text: 'When all the commanders of the forces[a], they and their men, heard that the king of Babylon had appointed Gedaliah, they came to Gedaliah at Mizpah: Ishmael son of Nethaniah, and Johanan son of Kareah, and Seraiah son of Tanhumeth the Netophathite, and Jaazaniah son of the Maacathite, they and their men.'
  footnotes:
  - marker: a
    text: Or 'had put Gedaliah in charge'; the Hebrew verb can denote appointing someone to oversight or administration.
    reason: lexical_alternative
translation:
  language: ko
  text: 군대의 모든 지휘관과 그들의 부하들은 바벨론 왕이 그달리야를 임명했다는 말을 듣고, 미스바에 있는 그달리야에게 왔습니다. 곧 느다냐의 아들 이스마엘, 가레아의 아들 요하난, 느도바 사람 단후멧의 아들 스라야, 마아가 사람의 아들 야아사냐와 그들의 부하들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그달리야에게 맡기셨다는’. 히브리어 동사는 누군가에게 감독이나 행정의 책임을 맡기거나 임명하는 것을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַחֲיָלִים
  english_pob_choice: the commanders of the forces
  chosen_korean: 군대의 모든 지휘관들
  alternatives_korean:
  - 군대의 지휘관들
  - 군사 부대의 지휘관들
  lexicon: HALOT
  rationale: שָׂרֵי는 지도자/지휘관을, הַחֲיָלִים은 이 문맥에서 군사력 전체를 가리키므로, 현대 한국어에서는 자연스럽고 명확한 ‘군대의 지휘관들’ 계열로 옮기는 것이 가장 적절합니다.
- source_word: הִפְקִיד
  english_pob_choice: had appointed
  chosen_korean: 세웠다는
  alternatives_korean:
  - 임명했다는
  - 맡겼다는
  lexicon: HALOT
  rationale: 이 동사는 단순히 ‘지명하다’보다 어떤 직무/감독 자리에 두는 뜻을 가지므로, 문맥상 중립적이면서도 임명 행위를 드러내는 ‘세웠다’가 맞습니다.
- source_word: הֵמָּה וְהָאֲנָשִׁים / וְאַנְשֵׁיהֶם
  english_pob_choice: they and their men
  chosen_korean: 그들과 그들의 부하들
  alternatives_korean:
  - 그들과 그 남자들
  - 그들과 그들의 군사들
  lexicon: HALOT
  rationale: 히브리어의 대명사-명사 결합은 지휘관과 그에 속한 추종자/병력의 구분을 강조하므로, 군사 맥락에 맞게 ‘부하들’로 자연스럽게 표현했습니다.
- source_word: הַמִּצְפָּה
  english_pob_choice: at Mizpah
  chosen_korean: 미스바의
  alternatives_korean:
  - 미스바에서
  - 미스바에 있는
  lexicon: HALOT
  rationale: ‘그달리야에게로’와 결합할 때 장소 표지로 기능하므로, 한국어에서는 간결하게 소속/위치 관계를 나타내는 ‘미스바의 그달리야’로 처리했습니다.
- source_word: הַנְּטֹפָתִי / הַמַּעֲכָתִי
  english_pob_choice: the Netophathite / the Maacathite
  chosen_korean: 느훔벳의 아들 / 마아가 사람의 아들
  alternatives_korean:
  - 네토바 사람의 아들 / 마아가 사람의 아들
  - 느도바 사람의 아들 / 마아가 사람의 아들
  lexicon: HALOT
  rationale: 두 형용사는 인물의 출신/소속을 표시하는 gentilics이므로, 한국어에서는 지명 유래를 살리되 통용되는 음역을 택해 ‘느훔벳’과 ‘마아가 사람’으로 옮겼습니다.
theological_decisions:
- issue: 열거 구조와 수식 관계의 보존
  chosen_reading: 본문의 인물 나열을 쉼표와 세미콜론으로 구분해, ‘그들과 그들의 부하들’이 각 인물 집단을 수식한다는 점을 드러냈습니다.
  alternative_readings:
  - 단순한 연속 나열로 처리하는 방식
  - 인물마다 반복해서 ‘그들과 그들의 부하들’을 붙이는 방식
  rationale: 히브리어의 resumptive 구조는 지휘관과 동행 병력을 함께 가리키므로, 한국어에서도 집단-부하 구분이 흐려지지 않도록 배치했습니다.
  doctrine_reference: 문법/담화 구조 보존
