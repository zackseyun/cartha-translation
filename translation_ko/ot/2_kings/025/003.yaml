  yaml_path: translation/ot/2_kings/025/003.yaml
  text: On the ninth day of the month[a], the famine became severe in the city[b], and there was no bread for the people of the land.
  footnotes:
  - marker: a
    text: Or 'there was no food,' since 'bread' can function more broadly as a term for sustenance.
    reason: lexical_alternative
  - marker: b
    text: '''People of the land'' can in some contexts refer more specifically to the common people or local populace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 달 아홉째 날에 성 안에 기근이 심해졌고, 그 땅의 백성[b]에게는 빵[a]이 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빵’은 여기서 먹을거리를 넓게 가리킬 수 있습니다. 따라서 ‘식량’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 땅의 백성’은 어떤 문맥에서는 더 구체적으로 ‘일반 백성’ 또는 ‘토착 주민’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתִשְׁעָה לַחֹדֶשׁ
  english_pob_choice: On the ninth day of the month
  chosen_korean: 그 달 아홉째 날에
  alternatives_korean:
  - 그 달의 아홉째 날에
  - 그 달 아홉째에
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘달의 아홉째’이지만, 한국어에서는 날짜를 분명히 하도록 ‘날’을 보충하는 것이 자연스럽습니다.
- source_word: וַיֶּחֱזַק הָרָעָב
  english_pob_choice: the famine became severe
  chosen_korean: 기근이 심해졌고
  alternatives_korean:
  - 기근이 강해졌고
  - 기근이 더 심해졌고
  - 기근이 강성해졌고
  lexicon: HALOT
  rationale: חזק의 기본 뜻은 ‘강해지다’이지만, 기근을 주어로 할 때는 한국어로 ‘심해지다’가 상태 악화를 가장 자연스럽게 드러냅니다.
- source_word: לֶחֶם
  english_pob_choice: bread
  chosen_korean: 빵
  alternatives_korean:
  - 빵
  - 식량
  - 음식
  lexicon: HALOT
  rationale: 히브리어 ‘lechem’은 문자적으로 빵이지만 더 넓게 먹을거리를 가리킬 수 있습니다. 본문은 원문과의 근접성을 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘빵’을 택했습니다.
- source_word: לְעַם הָאָרֶץ
  english_pob_choice: for the people of the land
  chosen_korean: 그 땅의 백성에게는
  alternatives_korean:
  - 그 땅의 사람들에게는
  - 그 땅의 민중에게는
  - 땅의 백성에게는
  lexicon: HALOT
  rationale: 이 표현은 문맥에 따라 ‘일반 백성’까지 가리킬 수 있지만, 이 절만으로 사회적 범주를 좁히기보다 원문에 가까운 ‘그 땅의 백성’으로 옮기는 편이 안전합니다.
