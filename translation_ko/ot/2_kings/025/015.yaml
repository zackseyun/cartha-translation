  rationale: מזרק은 제사에 쓰는 액체용 그릇이므로, ‘대접들’이 문맥상 가장 무난하며 예배 용기를 과도하게 구체화하지 않습니다.
- source_word: אֲשֶׁר זָהָב זָהָב
  english_pob_choice: what was gold, gold
  chosen_korean: 금은 금으로 된 것들을
  alternatives_korean:
  - 금으로 된 것들은
  - 금인 것들을
  lexicon: HALOT
  rationale: 히브리어의 반복은 재질에 따른 분류를 강조하므로, 한국어에서도 ‘금은 금으로 된 것들’로 재질 기준을 살리되 지나친 직역의 어색함은 줄였습니다.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  english_pob_choice: what was silver, silver
  chosen_korean: 은은 은으로 된 것들을
  alternatives_korean:
  - 은으로 된 것들은
  - 은인 것들을
  lexicon: HALOT
  rationale: 금 구절과 같은 방식으로 반복을 반영해, 은으로 된 물품들이 따로 분류되었음을 드러냈습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 친위대장
  alternatives_korean:
  - 시위대장
  - 호위대장
  lexicon: HALOT
  rationale: 이 직함은 직역상 ‘도살자들의 우두머리’에 가깝지만 문맥상 바벨론 고위 관직이므로, 한국어에서는 관용적으로 이해되는 ‘친위대장’으로 옮겼습니다.
