base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/015.yaml
  text: And the firepans and the bowls—what was gold[d][c][b][a], and what was silver—the captain of the guard took.
  footnotes:
  - marker: a
    text: Or 'the censers.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the basins.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew repeats the material terms: ''what was gold, gold, and what was silver, silver,'' emphasizing classification by material.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the chief of the executioners' / 'the commander of the bodyguard.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 화로들과 그 대접들—금은 금으로 된 것들과 은은 은으로 된 것들을—친위대장이 가져갔습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘분향그릇들’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘바리들’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘금인 것들은 금, 은인 것들은 은’처럼 재질을 반복해 분류를 강조합니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘친위대의 대장’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתּוֹת
  english_pob_choice: the firepans
  chosen_korean: 그 화로들
  alternatives_korean:
  - 그 분향그릇들
  - 그 향로들
  lexicon: HALOT
  rationale: 마חתּה는 제의용 불을 담는 그릇을 가리키므로, 현대 한국어에서는 기능을 살린 ‘화로들’이 자연스럽고 본문의 성격도 유지합니다.
- source_word: הַמִּזְרָקוֹת
  english_pob_choice: the bowls
  chosen_korean: 그 대접들
  alternatives_korean:
  - 그 바구니들
  - 그 바리들
  lexicon: HALOT
  rationale: מזרק은 제사에 쓰는 액체용 그릇이므로, ‘대접들’이 문맥상 가장 무난하며 예배 용기를 과도하게 구체화하지 않습니다.
- source_word: אֲשֶׁר זָהָב זָהָב
  english_pob_choice: what was gold, gold
  chosen_korean: 금은 금으로 된 것들을
  alternatives_korean:
  - 금으로 된 것들은
  - 금인 것들을
  lexicon: HALOT
  rationale: 히브리어의 반복은 재질에 따른 분류를 강조하므로, 한국어에서도 ‘금은 금으로 된 것들’로 재질 기준을 살리되 지나친 직역의 어색함은 줄였습니다.
- source_word: וַאֲשֶׁר כֶּסֶף כָּסֶף
  english_pob_choice: what was silver, silver
  chosen_korean: 은은 은으로 된 것들을
  alternatives_korean:
  - 은으로 된 것들은
  - 은인 것들을
  lexicon: HALOT
  rationale: 금 구절과 같은 방식으로 반복을 반영해, 은으로 된 물품들이 따로 분류되었음을 드러냈습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 친위대장
  alternatives_korean:
  - 시위대장
  - 호위대장
  lexicon: HALOT
  rationale: 이 직함은 직역상 ‘도살자들의 우두머리’에 가깝지만 문맥상 바벨론 고위 관직이므로, 한국어에서는 관용적으로 이해되는 ‘친위대장’으로 옮겼습니다.
