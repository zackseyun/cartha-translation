review_pass:
  verdict: revise
  source_fidelity: 히브리어는 경호대장이 사라야(수석 제사장), 스바냐(둘째 제사장), 그리고 문지방을 지키는 세 사람을 ‘데려간’ 것으로 서술합니다. 초안의 ‘붙잡았습니다’는 문맥상 가능하나 이동·연행의 의미가 약화되어 있습니다. 또한 כֹּהֵן הָרֹאשׁ와 כֹּהֵן מִשְׁנֶה의 위계는 각각 ‘수석’과 ‘둘째/차석’으로 보존하는 편이 안전합니다.
  naturalness: ‘수석 제사장 사라야와 둘째 제사장 스바냐’는 현대 표준 한국어에서 자연스럽고 직위 관계도 분명합니다. ‘문지방을 지키는 세 사람’은 원문의 구체적 표현을 보존하면서 이해 가능합니다. ‘붙잡아 갔습니다’는 강제성과 이동을 함께 자연스럽게 나타냅니다.
  terminology: ‘대제사장’과 ‘부제사장’은 가능한 해석이지만, 각각 후대적·제도적 직함으로 더 강하게 들릴 수 있습니다. 본문에는 ‘수석 제사장’과 ‘둘째 제사장’을 사용하고, 대안은 각주로 제시합니다. 영어 감사 기록의 각주 a/b는 해당 본문 어휘와 맞지 않게 배치되어 있으므로 한국어 각주는 올바른 어휘에 연결해 바로잡습니다.
  issues:
