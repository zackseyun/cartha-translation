- source_word: כֹּהֵן הָרֹאשׁ
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수석 제사장
  - 우두머리 제사장
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '제사장, 곧 머리/우두머리'이지만, 이 역사적 문맥에서 최고 책임자를 가리키므로 한국어에서 가장 바로 이해되는 직함인 '대제사장'을 채택했습니다.
- source_word: כֹּהֵן מִשְׁנֶה
  english_pob_choice: the second priest
  chosen_korean: 부제사장
  alternatives_korean:
  - 둘째 제사장
  - 차석 제사장
  lexicon: HALOT
  rationale: מִשְׁנֶה의 서열상 '둘째/차석' 의미를 살리되, 직위의 기능을 분명히 드러내는 '부제사장'으로 옮겼습니다.
- source_word: שֹׁמְרֵי הַסַּף
  english_pob_choice: keepers of the threshold
  chosen_korean: 문지방을 지키는 사람들
  alternatives_korean:
  - 문지기들
  - 성전 문턱을 지키는 사람들
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 보존하기 위해 '문지방'을 살렸고, 한국어 문장 안에서는 자연스럽게 '지키는 사람들'로 풀어 썼습니다.
