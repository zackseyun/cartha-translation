    issue: ‘대제사장’ 및 이에 연결된 각주
    rationale: כֹּהֵן הָרֹאשׁ는 직역상 ‘우두머리/수석 제사장’입니다. ‘대제사장’은 가능한 대안이지만 본문 용어로 단정하면 후대의 정식 직함을 연상시킬 수 있으며, 현 각주는 본문 표현과 같은 말을 ‘또는’이라고 하여 논리적으로도 맞지 않습니다.
  - severity: medium
    issue: ‘부제사장’
    rationale: כֹּהֵן מִשְׁנֶה는 ‘둘째 제사장’, 곧 제2위의 제사장을 뜻합니다. ‘부제사장’은 해석적으로 가능하나 한국어 교회 제도의 특정 직함처럼 들릴 수 있어 본문에서는 서열을 직접 드러내는 표현이 더 적절합니다.
  - severity: low
    issue: ‘붙잡았습니다’
    rationale: וַיִּקַּח는 기본적으로 ‘데려가다/취하다’입니다. 이 문맥의 강제성을 살리면서 후속 이동까지 나타내도록 ‘붙잡아 갔습니다’로 다듬는 것이 좋습니다.
