  text: וַ/יִּקַּ֣ח רַב טַבָּחִ֗ים אֶת שְׂרָיָה֙ כֹּהֵ֣ן הָ/רֹ֔אשׁ וְ/אֶת צְפַנְיָ֖הוּ כֹּהֵ֣ן מִשְׁנֶ֑ה וְ/אֶת שְׁלֹ֖שֶׁת שֹׁמְרֵ֥י הַ/סַּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
  footnotes:
  - marker: a
    text: Or 'doorkeepers' or 'keepers of the temple entrance.' The Hebrew is literally 'keepers of the threshold.'
    reason: lexical_alternative
  - marker: b
    text: '''Chief priest'' could also be rendered ''high priest.'' The Hebrew is literally ''the priest, the head/chief.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 경호대장은 사라야 곧 대제사장[a], 스바냐 곧 부제사장[b], 그리고 문지방을 지키는 세 사람을 붙잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '대제사장'으로도 옮길 수 있습니다. 히브리어는 문자적으로 '머리/우두머리 제사장'입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '차석 제사장', '둘째 제사장'으로도 옮길 수 있습니다. 히브리어는 문자적으로 '둘째 제사장'입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 호위대장
  - 근위대장
  lexicon: HALOT
  rationale: 왕실·군사 문맥에서 직역보다 직무를 드러내는 표현이 자연스러우며, POB의 'captain of the guard'에 대응하는 현대 한국어로는 '경호대장'이 가장 간결합니다.
- source_word: כֹּהֵן הָרֹאשׁ
  english_pob_choice: the chief priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 수석 제사장
  - 우두머리 제사장
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 '제사장, 곧 머리/우두머리'이지만, 이 역사적 문맥에서 최고 책임자를 가리키므로 한국어에서 가장 바로 이해되는 직함인 '대제사장'을 채택했습니다.
- source_word: כֹּהֵן מִשְׁנֶה
  english_pob_choice: the second priest
  chosen_korean: 부제사장
  alternatives_korean:
  - 둘째 제사장
  - 차석 제사장
  lexicon: HALOT
  rationale: מִשְׁנֶה의 서열상 '둘째/차석' 의미를 살리되, 직위의 기능을 분명히 드러내는 '부제사장'으로 옮겼습니다.
- source_word: שֹׁמְרֵי הַסַּף
  english_pob_choice: keepers of the threshold
  chosen_korean: 문지방을 지키는 사람들
  alternatives_korean:
  - 문지기들
  - 성전 문턱을 지키는 사람들
  lexicon: HALOT
  rationale: 히브리어의 문자적 이미지를 보존하기 위해 '문지방'을 살렸고, 한국어 문장 안에서는 자연스럽게 '지키는 사람들'로 풀어 썼습니다.
theological_decisions:
- issue: 성전 직분 명칭의 직역성과 이해 가능성
  chosen_reading: 대제사장, 부제사장, 문지방을 지키는 사람들
  alternative_readings:
  - 수석 제사장, 둘째 제사장, 문지기들
  rationale: 본문의 핵심은 포로로 끌려간 성전·행정 지도층의 계층 구조를 드러내는 데 있으므로, 너무 문자적인 표현보다 한국어 독자가 즉시 이해할 수 있는 직함을 택했습니다.
  doctrine_reference: 역사 서술의 직무 표지어 번역 원칙
