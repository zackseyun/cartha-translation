base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/018.yaml
  text: The captain of the guard took Seraiah the chief priest[a], Zephaniah the second priest[b], and the three keepers of the threshold.
  footnotes:
  - marker: a
    text: Or 'doorkeepers' or 'keepers of the temple entrance.' The Hebrew is literally 'keepers of the threshold.'
    reason: lexical_alternative
  - marker: b
    text: '''Chief priest'' could also be rendered ''high priest.'' The Hebrew is literally ''the priest, the head/chief.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 경호대장은 수석 제사장 사라야[a]와 둘째 제사장 스바냐[b]와 문지방을 지키는 세 사람[c]을 붙잡아 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘대제사장’. 히브리어는 문자적으로 ‘우두머리 제사장’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘차석 제사장’ 또는 ‘부제사장’. 히브리어는 문자적으로 ‘둘째 제사장’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘문지기들’ 또는 ‘성전 입구를 지키는 사람들’. 히브리어는 문자적으로 ‘문지방을 지키는 사람들’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
