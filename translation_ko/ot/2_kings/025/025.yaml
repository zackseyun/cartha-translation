revisions:
- from: 그리고 그 일은 일곱째 달에 일어났습니다. 느다냐의 아들, 엘리사마의 아들 이스마엘이 왕족의 씨에서 나와 열 명의 사람과 함께 와서 그달랴를 쳐 죽였고, 또 그와 함께 미스바에 있던 유다 사람들과 갈대아 사람들도 쳤습니다.[a][b]
  to: 일곱째 달에 왕실의 후손인 엘리사마의 아들 느다냐의 아들 이스마엘[a]이 열 사람과 함께 왔습니다. 그들이 그달리야를 쳤고, 그가 죽었습니다. 또 그들이 미스바에서 그달리야와 함께 있던 유다 사람들과 갈대아 사람들을 쳤습니다.[b]
  rationale: 서사 도입을 현대 한국어에 맞게 간결히 하고, 왕실 계보 표현을 자연화했습니다. 그달리야를 친 행위와 그의 죽음, 그리고 그와 함께 있던 유다 사람들과 갈대아 사람들을 친 행위를 원문의 순서와 구문에 따라 분리했습니다. ‘그와 함께’의 지시 대상은 문맥상 그달리야이므로 이를 명시하여 한국어의 잠재적 모호성을 줄였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:43Z'
