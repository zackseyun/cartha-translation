source:
  edition: WLC
  text: וַ/יְהִ֣י בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י בָּ֣א יִשְׁמָעֵ֣אל בֶּן נְ֠תַנְיָה בֶּן אֱלִ֨ישָׁמָ֜ע מִ/זֶּ֣רַע הַ/מְּלוּכָ֗ה וַ/עֲשָׂרָ֤ה אֲנָשִׁים֙ אִתּ֔/וֹ וַ/יַּכּ֥וּ אֶת גְּדַלְיָ֖הוּ וַ/יָּמֹ֑ת וְ/אֶת הַ/יְּהוּדִים֙ וְ/אֶת הַ/כַּשְׂדִּ֔ים אֲשֶׁר הָי֥וּ אִתּ֖/וֹ בַּ/מִּצְפָּֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/025.yaml
  text: And it happened in the seventh month that Ishmael son of Nethaniah, son of Elishama, of the royal seed, came with ten men, and they struck down Gedaliah, and he died, along with the Judeans and the Chaldeans who were with him at Mizpah.
  footnotes:
  - marker: a
    text: Or "of royal descent." The Hebrew literally says "of the royal seed," indicating Ishmael's lineage from the royal house.
    reason: lexical_alternative
  - marker: b
    text: '"Chaldeans" can also be rendered "Babylonians" in context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 일은 일곱째 달에 일어났습니다. 느다냐의 아들, 엘리사마의 아들 이스마엘이 왕족의 씨에서 나와 열 명의 사람과 함께 와서 그달랴를 쳐 죽였고, 또 그와 함께 미스바에 있던 유다 사람들과 갈대아 사람들도 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕족의 씨’는 직역에 가까운 표현으로, 왕실 계통/왕족 출신이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 문맥상 ‘바빌로니아 사람들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּחֹדֶשׁ הַשְּׁבִיעִי
  english_pob_choice: And it happened in the seventh month
  chosen_korean: 그리고 그 일은 일곱째 달에 일어났습니다
  alternatives_korean:
  - 일곱째 달에 그 일이 있었습니다
  - 그리고 일곱째 달에 그런 일이 있었습니다
  lexicon: WLC; HALOT
  rationale: 서사 도입의 wayyiqtol을 자연스럽게 옮기면서도 단순한 시간표현 이상으로 새 사건의 전개를 드러내기 위해 ‘일어났습니다’를 택했습니다.
- source_word: מִזֶּרַע הַמְּלוּכָה
  english_pob_choice: of the royal seed
  chosen_korean: 왕족의 씨에서 나와
  alternatives_korean:
  - 왕족의 혈통에서
  - 왕족의 후손으로
  lexicon: HALOT
  rationale: 히브리어의 직역성을 살리되 한국어에서 더 자연스럽게 읽히도록 ‘씨’를 유지하면서, 관계를 분명히 하기 위해 ‘에서 나와’를 붙였습니다.
- source_word: וַיַּכּוּ אֶת גְּדַלְיָהוּ וַיָּמֹת
  english_pob_choice: they struck down Gedaliah, and he died
  chosen_korean: 그달랴를 쳐 죽였고
  alternatives_korean:
  - 그달랴를 쳐서 그가 죽었고
  - 그달랴를 쳐서 죽였고
  lexicon: HALOT
  rationale: 히브리어의 ‘치다’와 뒤이은 죽음을 한국어에서 한 동작으로 자연스럽게 표현하되, 폭력성과 결과를 함께 드러내기 위해 ‘쳐 죽였다’를 사용했습니다.
- source_word: הַיְּהוּדִים וְאֶת הַכַּשְׂדִּים
  english_pob_choice: the Judeans and the Chaldeans
  chosen_korean: 유다 사람들과 갈대아 사람들도
  alternatives_korean:
  - 유다인들과 갈대아 사람들도
  - 유대 사람들과 바빌로니아 사람들도
  lexicon: HALOT
  rationale: 이 역사적 맥락에서는 ‘유다 사람들’이 더 정확하며, ‘갈대아 사람들’은 본문 용어를 그대로 살리기 위해 유지했습니다.
theological_decisions:
- issue: 왕족의 씨라는 표현의 계보적 뉘앙스
  chosen_reading: 이스마엘은 단순한 출신이 아니라 왕가 계통의 혈통적 배경을 가진 인물로 제시됩니다.
  alternative_readings:
  - 왕족 출신이라는 일반적 의미
  - 왕실 혈통이라는 완화된 표현
  rationale: 본문은 사건의 정치적·역사적 긴장을 위해 이스마엘의 왕가 연계를 강조하므로, 그 계보적 함의를 약화시키지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 역사서 본문 해석 원리; 본문 내 계보 표지의 기능
