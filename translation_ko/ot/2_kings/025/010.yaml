    text: 히브리어 직함 라브 타바힘(rab-tabbaḥim)은 문자적으로 '도살자들의 우두머리'라는 뜻이며, 문맥상 왕실 경호대장 또는 사형 집행관들의 우두머리를 가리킬 수 있습니다.
