theological_decisions:
- issue: रַב טַבָּחִים 직함의 번역에서 문자적 의미와 관용적 직함 사이의 균형
  chosen_reading: 본문에는 직함의 기능을 드러내는 '경호대장'을 사용하고, 본문 밖 주해 없이도 이해되도록 했습니다.
  alternative_readings:
  - 사형집행관의 우두머리
  - 친위대장
  rationale: 이 직함은 역사적 배경상 경호와 처형 기능을 겸한 고위 관직이므로, 현대 한국어에서는 기능 중심 번역이 오독을 줄입니다.
  doctrine_reference: 역사서 본문 해석의 관용적 직함 번역 원칙
