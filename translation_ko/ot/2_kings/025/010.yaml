translation:
  language: ko
  text: 그리고 바벨론 사람들의 온 군대, 곧 경호대장과 함께 있던 이들이 예루살렘의 성벽을 사방으로 헐어 버렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직함 rabh-tabbaḥim은 문자적으로는 '도살자들의 우두머리'에 가깝지만, 문맥상 왕실 경호대장 또는 사형집행관의 우두머리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
