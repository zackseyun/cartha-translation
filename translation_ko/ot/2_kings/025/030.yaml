id: 2KI.25.30
reference: 2 Kings 25:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/אֲרֻחָת֗/וֹ אֲרֻחַ֨ת תָּמִ֧יד נִתְּנָה לּ֛/וֹ מֵ/אֵ֥ת הַ/מֶּ֖לֶךְ דְּבַר י֣וֹם בְּ/יוֹמ֑/וֹ כֹּ֖ל יְמֵ֥י חַיָּֽ/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/030.yaml
  text: And his allowance[a], a continual allowance, was given to him from the king, the portion for each day on its day[b], all the days of his life.
  footnotes:
  - marker: a
    text: Or 'ration,' 'portion,' or 'provision' for 'allowance.' The Hebrew term refers to an allotted provision supplied to him.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the matter of a day on its day,' an idiom meaning that the provision was supplied day by day, according to each day's allotment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 양식[a], 곧 계속되는 양식이 왕에게서 그에게 주어졌습니다. 매일 그날에 맞는 분량[b]이 그의 평생 동안 주어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘배급’, ‘분량’, ‘공급’으로도 옮길 수 있습니다. 여기서는 그에게 배정되어 정기적으로 제공되는 몫이라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘날의 일, 그 날에’로, 하루하루 그날의 배정에 따라 지급되었다는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרֻחָה / אֲרֻחָתוֹ
  english_pob_choice: allowance
  chosen_korean: 양식
  alternatives_korean:
  - 배급
  - 분량
  - 공급
  lexicon: HALOT
  rationale: 이 표현은 느부갓네살이 여호야긴에게 마련해 준 지속적 제공을 가리키므로, 현대 한국어에서 자연스럽고 계속 지급되는 생활 제공을 드러내는 ‘양식’이 적절합니다.
- source_word: תָּמִיד
  english_pob_choice: continual
  chosen_korean: 계속되는
  alternatives_korean:
  - 끊임없는
  - 항구적인
  - 지속적인
  lexicon: HALOT
  rationale: 명사구를 수식하는 연속성을 살리되, 한국어에서 어색하지 않게 ‘계속되는’으로 옮겨 반복적·지속적 지급을 표현했습니다.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  english_pob_choice: the portion for each day on its day
  chosen_korean: 매일 그날에 맞는 분량
  alternatives_korean:
  - 날마다 그날의 분량
  - 그날그날의 분량
  - 매일의 배정량
  lexicon: HALOT
  rationale: 직역하면 ‘날의 일, 그 날에’라는 관용구로서 일별 할당을 뜻하므로, ‘그날에 맞는 분량’으로 풀어 하루 단위의 배정을 드러냈습니다.
- source_word: כֹּל יְמֵי חַיָּו
  english_pob_choice: all the days of his life
  chosen_korean: 그의 평생 동안
  alternatives_korean:
  - 그의 생애 동안
  - 그가 사는 모든 날 동안
  lexicon: HALOT
  rationale: 히브리어 관용구의 생애 전체 지속을 한국어로 자연스럽게 전달하는 표준적인 표현입니다.
