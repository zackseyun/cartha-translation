id: 2KI.25.19
reference: 2 Kings 25:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/מִן הָ/עִ֡יר לָקַח֩ סָרִ֨יס אֶחָ֜ד אֲֽשֶׁר ה֥וּא פָקִ֣יד עַל אַנְשֵׁ֣י הַ/מִּלְחָמָ֗ה וַ/חֲמִשָּׁ֨ה אֲנָשִׁ֜ים מֵ/רֹאֵ֤י פְנֵֽי הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר נִמְצְא֣וּ בָ/עִ֔יר וְ/אֵ֗ת הַ/סֹּפֵר֙ שַׂ֣ר הַ/צָּבָ֔א הַ/מַּצְבִּ֖א אֶת עַ֣ם הָ/אָ֑רֶץ וְ/שִׁשִּׁ֥ים אִישׁ֙ מֵ/עַ֣ם הָ/אָ֔רֶץ הַֽ/נִּמְצְאִ֖ים בָּ/עִֽיר־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/019.yaml
  text: And from the city he took one official[a], who was appointed over the men of war, and five men from those who saw the king’s face, who were found in the city, and the scribe, the commander of the army, who mustered the people of the land[c][b], and sixty men from the people of the land who were found in the city.
  footnotes:
  - marker: a
    text: Or 'eunuch'; the Hebrew term can denote either a literal eunuch or a royal court officer.
    reason: lexical_alternative
  - marker: b
    text: '''Those who saw the king’s face'' is a Hebrew idiom for those with direct access to the king, likely royal attendants or courtiers.'
    reason: cultural_note
  - marker: c
    text: Or 'enrolled' or 'conscripted' the people of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그 성읍에서, 전쟁하는 사람들을 맡도록 임명된 관원 한 명[a]과 왕의 얼굴을 보던 사람들[b] 가운데 그 성읍에서 발견된 다섯 명과, 그 땅의 백성을 소집하던 군대 지휘관의 서기관[c]과, 그 성읍에서 발견된 그 땅의 백성 가운데 육십 명을 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내시’로 옮길 수 있습니다. 히브리어 용어는 문자적인 내시일 수도, 왕실 관원일 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕의 얼굴을 보던 사람들’은 왕에게 직접 접근할 수 있던 궁정 인사들을 가리키는 히브리어 관용구입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘등록하던’ 또는 ‘징집하던’으로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סָרִיס
  english_pob_choice: one official
  chosen_korean: 한 관원
  alternatives_korean:
  - 한 내시
  - 한 궁정 관원
  - 한 관리
  lexicon: HALOT
  rationale: סָרִיס는 문맥에 따라 내시 또는 왕실 관원을 가리킬 수 있으나, 이곳은 군사·행정 맥락이므로 물리적 상태를 단정하지 않는 ‘관원’이 가장 무난합니다.
- source_word: מֵרֹאֵי פְנֵי הַמֶּלֶךְ
  english_pob_choice: those who saw the king’s face
  chosen_korean: 왕의 얼굴을 보던 사람들
  alternatives_korean:
  - 왕 앞에 나아가던 사람들
  - 왕의 면전에 드나들던 사람들
  - 왕의 친근한 시종들
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 궁정 접근권이 있던 자들을 드러내되, 해석을 과도하게 좁히지 않도록 했습니다.
- source_word: הַמַּצְבִּא אֶת עַם הָאָרֶץ
  english_pob_choice: who mustered the people of the land
  chosen_korean: 그 땅의 백성을 소집하던 자
  alternatives_korean:
  - 그 땅의 백성을 징집하던 자
  - 그 땅의 백성을 모집하던 자
  - 그 땅의 백성을 동원하던 자
  lexicon: HALOT
  rationale: המצביע는 군사적 행정으로 사람들을 불러 모으는 뜻이므로, ‘소집하다’가 강제성·행정성을 함께 비교적 중립적으로 살립니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 나라의 백성
  - 토지의 백성
  lexicon: HALOT
  rationale: 관용 표현을 가능한 한 보존하면서도 한국어에서 자연스럽게 읽히도록 ‘그 땅의 백성’으로 옮겼습니다.
- source_word: נִמְצְאוּ / הַנִּמְצְאִים
  english_pob_choice: were found
  chosen_korean: …있던
  alternatives_korean:
  - 발견된
  - 찾아낸
  - 거기에 있던
  lexicon: HALOT
  rationale: 서술 맥락상 ‘성읍에 있던’은 ‘were found in the city’를 자연스럽게 풀어 주면서도, 포위 후 성읍 안에서 찾아낸 사람들라는 의미를 유지합니다.
