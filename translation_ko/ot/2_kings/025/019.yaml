revisions:
- from: 그리고 그 성읍에서 그는 전쟁 رجال 위에 세워진 한 관원과, 왕의 얼굴을 보던 사람들 가운데서 성읍에 있던 다섯 사람과, 서기관이자 군대의 지휘관으로서 그 땅의 백성을 소집하던 자와, 성읍에 있던 그 땅의 백성 가운데서 육십 명을 잡아갔습니다.[a][b][c]
  to: 그는 그 성읍에서, 전쟁하는 사람들을 맡도록 임명된 관원 한 명[a]과 왕의 얼굴을 보던 사람들[b] 가운데 그 성읍에서 발견된 다섯 명과, 그 땅의 백성을 소집하던 군대 지휘관의 서기관[c]과, 그 성읍에서 발견된 그 땅의 백성 가운데 육십 명을 데려갔습니다.
  rationale: 아랍어 문자 혼입을 수정하고, 군사 담당 관원과 군대 지휘관의 서기관이라는 원문의 직무 관계를 한국어로 명확히 했습니다. ‘발견된’을 사용하여 두 차례 나오는 נִמְצָא의 수동 표현을 보존했으며, 각주 표지는 각각의 해당 표현에 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:43Z'
