source:
  edition: WLC
  text: וְ/אֶת בְּנֵי֙ צִדְקִיָּ֔הוּ שָׁחֲט֖וּ לְ/עֵינָ֑י/ו וְ/אֶת עֵינֵ֤י צִדְקִיָּ֨הוּ֙ עִוֵּ֔ר וַ/יַּאַסְרֵ֨/הוּ֙ בַֽ/נְחֻשְׁתַּ֔יִם וַ/יְבִאֵ֖/הוּ בָּבֶֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/007.yaml
  text: They slaughtered Zedekiah’s sons before his eyes[a], and he put out Zedekiah’s eyes, bound him with bronze fetters, and brought him to Babylon.
  footnotes:
  - marker: a
    text: Or 'blinded Zedekiah.' The Hebrew verb means 'made blind,' but the wording here likely refers to the physical act of putting out his eyes.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 시드기야의 아들들을 그의 눈앞에서 죽였고, 그는 시드기야의 눈을 멀게 하고[a] 놋 족쇄로 그를 묶어 바빌론으로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘눈을 멀게 하다’라는 뜻입니다. 이 문맥에서는 눈을 물리적으로 없애는 행위를 가리킬 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחֲטוּ
  english_pob_choice: slaughtered
  chosen_korean: 죽였고
  alternatives_korean:
  - 도살하였고
  - 학살하였고
  lexicon: HALOT
  rationale: 이 동사는 강한 폭력성을 띠지만, 한국어 본문에서는 지나치게 생경한 ‘도살하다’보다 의미를 충분히 담는 ‘죽이다’로 자연스럽게 옮기되, 문맥 전체가 잔혹성을 유지하도록 했습니다.
- source_word: לְעֵינָיו
  english_pob_choice: before his eyes
  chosen_korean: 그의 눈앞에서
  alternatives_korean:
  - 그의 눈앞에
  - 그가 보는 앞에서
  lexicon: HALOT
  rationale: 관용구는 ‘눈앞에서’가 가장 자연스럽고, 사건이 시드기야가 직접 목격한 장면임을 분명히 드러냅니다.
- source_word: עִוֵּר
  english_pob_choice: put out ... eyes
  chosen_korean: 눈을 멀게 하였으며
  alternatives_korean:
  - 눈을 뽑았으며
  - 시력을 없앴으며
  lexicon: HALOT
  rationale: 히브리어 동사는 ‘맹목하게 하다’이지만, POB의 영어 판단처럼 이 문맥에서는 신체적 행위의 결과를 가리키므로 한국어도 관용적으로 ‘눈을 멀게 하다’로 옮겼습니다.
- source_word: בַּנְחֻשְׁתַּיִם
  english_pob_choice: with bronze fetters
  chosen_korean: 놋사슬로
  alternatives_korean:
  - 놋 족쇄로
  - 놋 쇠사슬로
  lexicon: HALOT
  rationale: 쌍형/복수형의 금속 결박 도구를 한국어에서 간결하게 ‘놋사슬’로 옮겨 결박의 의미를 살렸습니다.
- source_word: וַיְבִאֵהוּ בָבֶל
  english_pob_choice: brought him to Babylon
  chosen_korean: 바빌론으로 끌고 갔습니다
  alternatives_korean:
  - 바빌론으로 데려갔습니다
  - 바빌론으로 이끌어 갔습니다
  lexicon: HALOT
  rationale: 서사적 폭력성과 강제성을 드러내기 위해 단순한 ‘데려가다’보다 ‘끌고 가다’를 택했습니다.
theological_decisions:
- issue: 히브리어 동사의 주어 전환(‘그들이 죽였고’에서 ‘그가 눈을 멀게 하였으며’)을 한국어에서 어떻게 드러낼지
  chosen_reading: 문장 안에서 주어를 명시적으로 ‘그가’로 옮겨 동사의 주체 전환을 드러냈습니다.
  alternative_readings:
  - 주어를 생략해 ‘눈을 멀게 하였으며’로 처리
  - 앞절과 연결해 모호하게 번역
  rationale: 본문은 복수 동사와 단수 동사의 전환이 분명하므로, 독자가 행위 주체의 변화와 서사적 긴장을 놓치지 않도록 주어를 밝혔습니다.
  doctrine_reference: 본문의 서사적 정확성
- issue: 죽음/절단의 폭력성을 완화하지 않을지
  chosen_reading: 폭력성을 완화하지 않고, 처형의 잔혹함이 드러나도록 구성했습니다.
  alternative_readings:
  - 완곡하게 ‘죽였다’ 중심으로 평탄화
  - 종교적 문체로 중화
  rationale: POB의 원칙에 따라 역사 서술의 잔혹성을 보존해야 하므로, 시각적·신체적 폭력을 드러내는 표현을 유지했습니다.
  doctrine_reference: 본문의 역사적 진술 보존
