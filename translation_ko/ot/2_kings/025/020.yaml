revisions:
- from: 네부사라단[a], 곧 친위대장을 맡은 자가 그들을 붙잡아 바빌론 왕에게, 리블라로 데려갔습니다.
  to: 친위대장[b] 네부사라단은 그들을 데리고 리블라에 있는 바빌론 왕에게로 갔습니다[a].
  rationale: ‘붙잡아’를 중립적인 ‘데리고’로 바꾸어 לקח의 의미를 과장하지 않았습니다. 리블라를 바빌론 왕의 소재지로 명시하고, עַל의 가능한 ‘왕 앞으로’ 해석은 해당 절 끝의 주석으로 보존했습니다. 직책은 자연스러운 현대 한국어인 ‘친위대장’으로 정리하고 문자적 의미는 주석으로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:44Z'
