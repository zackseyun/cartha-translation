base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/020.yaml
  text: Nebuzaradan[a], the captain of the guard[b], took them and brought them to the king of Babylon at Riblah.
  footnotes:
  - marker: a
    text: Or 'brought them before the king of Babylon at Riblah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'chief of the slaughterers'; likely a royal military/security title, traditionally rendered 'captain of the guard.'
    reason: cultural_note
translation:
  language: ko
  text: 네부사라단[a], 곧 친위대장을 맡은 자가 그들을 붙잡아 바빌론 왕에게, 리블라로 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바빌론 왕 앞에 리블라에서 그들을 데려갔다’로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נְבוּזַרְאֲדָן
  english_pob_choice: Nebuzaradan
  chosen_korean: 네부사라단
  alternatives_korean:
