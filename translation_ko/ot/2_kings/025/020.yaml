  lexicon: HALOT
  rationale: 직역하면 ‘도살자들의 우두머리’이지만, 문맥상 바빌론 궁정의 군사·경비 직책을 가리키므로 기능을 드러내는 표현으로 옮겼습니다.
- source_word: וַיֹּלֶךְ אֹתָם עַל
  english_pob_choice: brought them to
  chosen_korean: 그들을 … 데려갔습니다
  alternatives_korean:
  - 그들을 … 끌고 갔습니다
  - 그들을 … 데리고 갔습니다
  - 그들을 … 앞으로 데려갔습니다
  lexicon: HALOT
  rationale: ‘가게 하다/데려가다’의 사역적 의미를 자연스럽게 살려, 목적지로 이끌어 간 동작을 한국어로 표현했습니다.
- source_word: רִבְלָתָה
  english_pob_choice: at Riblah
  chosen_korean: 리블라로
  alternatives_korean:
  - 리블라에
  - 리블라에서
  lexicon: 지명 용법
  rationale: 히브리어의 방향성/장소 표지를 문맥에 맞게 풀어, 왕이 있던 리블라의 위치로 이동했음을 드러냈습니다.
theological_decisions:
- issue: ‘to/ before the king’의 재현
  chosen_reading: ‘바빌론 왕에게, 리블라로’로 옮겨 왕이 있던 장소와 도착 대상을 함께 드러냈습니다.
  alternative_readings:
  - ‘바빌론 왕 앞에’
  - ‘바빌론 왕에게’만 번역
  rationale: 문맥상 단순 도착이 아니라 왕 앞에 끌려가 심문·처분을 받는 장면이므로, 장소와 대상 관계를 함께 보여 주는 번역이 원문 의도를 더 잘 살립니다.
  doctrine_reference: 본문 문맥에 따른 서사·법정적 장면 재현
