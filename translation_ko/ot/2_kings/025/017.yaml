  - 주기둥
  - 필라
  lexicon: HALOT
  rationale: 성전 구조물 맥락에서 일반적이고 이해하기 쉬운 표현은 ‘기둥’이며, 원문의 monumental 구조를 무리 없이 옮깁니다.
- source_word: כֹתֶרֶת
  english_pob_choice: capital
  chosen_korean: 수도관
  alternatives_korean:
  - 머리장식
  - 주두
  - 기둥머리
  lexicon: HALOT
  rationale: 문맥상 기둥의 장식적 윗부분을 가리키므로 본문은 ‘수도관’으로 옮겼습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 동
  - 구리
  lexicon: HALOT
  rationale: 성경 한국어에서 금속 재질을 나타내는 ‘놋’은 원문의 재료감을 잘 살리며, 장식물의 물성을 간결하게 전달합니다.
- source_word: שְׂבָכָה
  english_pob_choice: latticework
  chosen_korean: 격자무늬
  alternatives_korean:
  - 그물무늬
  - 격자장식
  - 망상 장식
  lexicon: HALOT
  rationale: 원문은 기둥 머리의 망상형 장식 구조를 말하므로, 읽기 쉬우면서도 장식성을 보존하는 ‘격자무늬’를 택했습니다.
- source_word: רִמֹּנִים
  english_pob_choice: pomegranates
  chosen_korean: 석류 장식
  alternatives_korean:
  - 석류들
  - 석류 모양 장식
  - 석류무늬
  lexicon: HALOT
  rationale: 실물 과일 자체가 아니라 장식 요소이므로, 상징적 형태를 드러내는 ‘석류 장식’이 더 정확합니다.
- source_word: וְכָאֵלֶּה
  english_pob_choice: had the same
  chosen_korean: 이와 같았고
  alternatives_korean:
  - 같은 장식이 있었고
  - 이처럼 있었고
  - 그와 같이였고
  lexicon: HALOT
  rationale: 히브리어의 생략된 비교를 한국어에서 자연스럽게 풀어, 둘째 기둥이 첫째와 같은 장식을 가졌음을 분명히 합니다.
theological_decisions:
- issue: 성전 기둥 장식의 반복과 생략된 비교구문 처리
  chosen_reading: 둘째 기둥도 첫째와 동일한 장식을 가진 것으로 풀어 읽었습니다.
  alternative_readings:
  - 원문을 더 직역하여 생략감을 그대로 두는 방식
  - 둘째 기둥도 ‘같은 것들’이 있었다고 모호하게 옮기는 방식
  rationale: 히브리어는 끝부분이 생략된 구문이므로, 한국어에서는 의미를 보충해 독자가 구조를 오해하지 않도록 하는 것이 적절합니다.
  doctrine_reference: 번역학적 명료화 원칙
