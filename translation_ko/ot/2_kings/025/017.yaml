  to: 한 기둥의 높이는 십팔 규빗이며, 그 위에는 청동 기둥머리가 있었습니다. 그 기둥머리의 높이는 세 규빗이었습니다. 기둥머리에는 사방으로 격자 장식[a]과 석류 장식이 있었는데, 모두 청동이었습니다. 둘째 기둥도 격자 장식과 함께 이와 같았습니다[b].
  rationale: 기둥의 건축적 윗부분을 배관으로 오역한 핵심 문제를 ‘청동 기둥머리’로 바로잡았습니다. 격자 장식과 석류 장식의 위치 및 재질을 원문에 맞게 유지했고, 생략적인 마지막 절은 한국어에서 최소한으로 풀되 각주에서 원문의 생략성을 밝혔습니다. 각주 a도 실제 설명 대상인 ‘격자 장식’에 연결했습니다.
