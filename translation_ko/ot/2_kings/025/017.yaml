  text: שְׁמֹנֶה֩ עֶשְׂרֵ֨ה אַמָּ֜ה קוֹמַ֣ת הָ/עַמּ֣וּד הָ/אֶחָ֗ד וְ/כֹתֶ֨רֶת עָלָ֥י/ו נְחֹשֶׁת֮ וְ/קוֹמַ֣ת הַ/כֹּתֶרֶת֮ שָׁלֹ֣שׁ אמה וּ/שְׂבָכָ֨ה וְ/רִמֹּנִ֧ים עַֽל הַ/כֹּתֶ֛רֶת סָבִ֖יב הַ/כֹּ֣ל נְחֹ֑שֶׁת וְ/כָ/אֵ֛לֶּה לַֽ/עַמּ֥וּד הַ/שֵּׁנִ֖י עַל הַ/שְּׂבָכָֽה׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/017.yaml
  text: The height of the one pillar was eighteen cubits[a], and a bronze capital was on it. The height of the capital was three cubits, with latticework and pomegranates all around on the capital, all of bronze. And the second pillar had the same[b], with the latticework.
  footnotes:
  - marker: a
    text: Or, 'network' for 'latticework' (Hebrew שְׂבָכָה), referring to a net-like ornamental structure on the capital.
    reason: lexical_alternative
  - marker: b
    text: 'The final clause is elliptical in Hebrew: literally, ''and like these for the second pillar upon the latticework.'' The sense is that the second pillar had matching ornamentation.'
    reason: alternative_reading
translation:
  language: ko
  text: 한 기둥의 높이는 십팔 규빗[a]이며, 그 위에는 놋 수도관이 있었습니다. 그 수도관의 높이는 세 규빗이었고, 그 수도관 위에는 둘레를 따라 격자무늬와 석류 장식이 있었는데, 모두 놋이었습니다. 둘째 기둥도 이와 같았고[b], 격자무늬도 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그물무늬’일 수 있습니다. 히브리어 שְׂבָכָה는 기둥 머리의 그물처럼 짠 장식 구조를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 마지막 절이 생략된 형태로, 직역하면 ‘그리고 이와 같은 것들이 둘째 기둥에, 그 격자무늬 위에’입니다. 뜻은 둘째 기둥도 첫째와 같은 장식을 가졌다는 것입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹמַת
  english_pob_choice: height of
  chosen_korean: 높이는
  alternatives_korean:
  - 높이
  - 길이는
  - 치수는
  lexicon: HALOT
  rationale: 건축물의 치수 설명이므로 ‘높이는’이 가장 자연스럽고, 원문의 측정값 진술을 직접 반영합니다.
- source_word: עַמּוּד
  english_pob_choice: pillar
  chosen_korean: 기둥
  alternatives_korean:
  - 원기둥
  - 주기둥
  - 필라
  lexicon: HALOT
  rationale: 성전 구조물 맥락에서 일반적이고 이해하기 쉬운 표현은 ‘기둥’이며, 원문의 monumental 구조를 무리 없이 옮깁니다.
- source_word: כֹתֶרֶת
  english_pob_choice: capital
  chosen_korean: 수도관
  alternatives_korean:
  - 머리장식
  - 주두
  - 기둥머리
  lexicon: HALOT
  rationale: 문맥상 기둥의 장식적 윗부분을 가리키므로 본문은 ‘수도관’으로 옮겼습니다.
- source_word: נְחֹשֶׁת
  english_pob_choice: bronze
  chosen_korean: 놋
  alternatives_korean:
  - 청동
  - 동
  - 구리
  lexicon: HALOT
  rationale: 성경 한국어에서 금속 재질을 나타내는 ‘놋’은 원문의 재료감을 잘 살리며, 장식물의 물성을 간결하게 전달합니다.
- source_word: שְׂבָכָה
  english_pob_choice: latticework
  chosen_korean: 격자무늬
  alternatives_korean:
  - 그물무늬
  - 격자장식
  - 망상 장식
  lexicon: HALOT
  rationale: 원문은 기둥 머리의 망상형 장식 구조를 말하므로, 읽기 쉬우면서도 장식성을 보존하는 ‘격자무늬’를 택했습니다.
- source_word: רִמֹּנִים
  english_pob_choice: pomegranates
  chosen_korean: 석류 장식
  alternatives_korean:
  - 석류들
  - 석류 모양 장식
  - 석류무늬
  lexicon: HALOT
  rationale: 실물 과일 자체가 아니라 장식 요소이므로, 상징적 형태를 드러내는 ‘석류 장식’이 더 정확합니다.
- source_word: וְכָאֵלֶּה
  english_pob_choice: had the same
  chosen_korean: 이와 같았고
  alternatives_korean:
  - 같은 장식이 있었고
  - 이처럼 있었고
  - 그와 같이였고
  lexicon: HALOT
  rationale: 히브리어의 생략된 비교를 한국어에서 자연스럽게 풀어, 둘째 기둥이 첫째와 같은 장식을 가졌음을 분명히 합니다.
theological_decisions:
- issue: 성전 기둥 장식의 반복과 생략된 비교구문 처리
  chosen_reading: 둘째 기둥도 첫째와 동일한 장식을 가진 것으로 풀어 읽었습니다.
  alternative_readings:
  - 원문을 더 직역하여 생략감을 그대로 두는 방식
  - 둘째 기둥도 ‘같은 것들’이 있었다고 모호하게 옮기는 방식
  rationale: 히브리어는 끝부분이 생략된 구문이므로, 한국어에서는 의미를 보충해 독자가 구조를 오해하지 않도록 하는 것이 적절합니다.
  doctrine_reference: 번역학적 명료화 원칙
