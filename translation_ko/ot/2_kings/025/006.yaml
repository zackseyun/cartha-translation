base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/006.yaml
  text: Then they captured the king and brought him up to the king of Babylon at Riblah[a], and they pronounced judgment on him.
  footnotes:
  - marker: a
    text: Or, more literally, 'they spoke judgment with him,' an idiom meaning they pronounced judicial sentence on him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그 왕을 사로잡아 바벨론 왕에게 있는 립나로 데려갔고, 그에게 판결을 내렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그와 함께 판결을 말하였다’에 가깝고, 관용적으로는 사법적 판결을 선고했다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפְּשׂוּ אֶת הַמֶּלֶךְ
  english_pob_choice: captured the king
  chosen_korean: 그 왕을 사로잡아
  alternatives_korean:
  - 그 왕을 붙잡아
  - 그 왕을 포로로 잡아
  lexicon: HALOT
  rationale: תפשׂ는 여기서 도주하는 왕을 붙잡아 제압하는 뜻이므로, 현대 한국어에서 자연스럽고 결과를 분명히 드러내는 ‘사로잡다’를 택했습니다.
- source_word: וַיַּעֲל֥וּ אֹת֛וֹ אֶל מֶ֥לֶךְ בָּבֶ֖ל
  english_pob_choice: brought him up to the king of Babylon
  chosen_korean: 바벨론 왕에게 있는 립나로 데려갔고
  alternatives_korean:
  - 바벨론 왕에게 데려갔고
  - 바벨론 왕 앞으로 데려갔고
  lexicon: HALOT
  rationale: עלה의 ‘올라가다/데려가다’ 방향성을 살리면서도 한국어에서는 장소와 대면 상황이 함께 드러나도록 ‘...에게 있는 립나로 데려갔다’로 옮겼습니다.
- source_word: וַיְדַבְּרוּ אִתּוֹ מִשְׁפָּט
  english_pob_choice: they pronounced judgment on him
  chosen_korean: 그에게 판결을 내렸습니다
  alternatives_korean:
  - 그에게 심판을 선고했습니다
  - 그와 함께 판결을 논했습니다
  - 그에게 재판을 선고했습니다
  lexicon: HALOT
  rationale: דבר + משפט는 단순한 대화가 아니라 사법적 판결 선고를 뜻하므로, 법정 의미가 분명한 ‘판결을 내리다’로 옮겼습니다.
theological_decisions:
- issue: 이 절의 משפט를 어떻게 이해할 것인가
  chosen_reading: 법정에서의 사법적 판결 선고로 이해했습니다.
  alternative_readings:
  - 일반적인 ‘말하다’로 완화하는 읽기
  - 추상적 ‘정의’ 선언으로 넓히는 읽기
  rationale: 문맥상 왕을 포로로 데려간 뒤의 공식 처분을 말하므로, משפט를 판결 선고로 번역해야 본문의 사법적 긴장이 보존됩니다.
  doctrine_reference: 구약 역사서의 재판/심판 서술
