source:
  edition: WLC
  text: וַ/יַּ֣ךְ אֹתָ/ם֩ מֶ֨לֶךְ בָּבֶ֧ל וַ/יְמִיתֵ֛/ם בְּ/רִבְלָ֖ה בְּ/אֶ֣רֶץ חֲמָ֑ת וַ/יִּ֥גֶל יְהוּדָ֖ה מֵ/עַ֥ל אַדְמָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/021.yaml
  text: And the king of Babylon struck them down and put them to death at Riblah in the land of Hamath[b][a]. So Judah was taken into exile from its land.
  footnotes:
  - marker: a
    text: 'Or ''killed them.'' The Hebrew uses two verbs in sequence: ''struck them'' and ''put them to death.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Judah went into exile from its land.' The Hebrew verb can be rendered actively or passively in context; the passive highlights the forced deportation.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론 왕이 그들을 쳐서 리블라, 하맛 땅에서 죽였습니다. 그래서 유다는 자기 땅에서 끌려가 포로가 되었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그들을 쳤다’와 ‘그들을 죽게 했다’라는 두 동사를 연속으로 사용합니다.
    reason: source_note
  - marker: b
    text: 히브리어 동사는 문맥상 ‘유다가 유배되었다/포로가 되었다’처럼 수동적으로도 옮길 수 있습니다. 여기서는 강제 이주의 뜻을 분명히 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ אֹתָם
  english_pob_choice: struck them down
  chosen_korean: 그들을 쳐서
  alternatives_korean:
  - 그들을 쳐서 쓰러뜨리고
  - 그들을 때리고
  lexicon: HALOT
  rationale: נכה는 ‘치다/타격하다’의 의미를 살리는 것이 좋고, 뒤의 ‘죽였습니다’와 구분해야 하므로 ‘그들을 쳐서’로 옮겼습니다.
- source_word: וַיְמִיתֵם
  english_pob_choice: put them to death
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 사형에 처했습니다
  - 죽게 했습니다
  lexicon: HALOT
  rationale: Hiphil의 사역적 의미를 자연스럽게 드러내면서도, 히브리어의 직접적인 진술을 과도하게 해석하지 않기 위해 ‘죽였습니다’를 택했습니다.
- source_word: וַיִּגֶל יְהוּדָה
  english_pob_choice: was taken into exile
  chosen_korean: 유다는 … 포로가 되었습니다
  alternatives_korean:
  - 유다는 … 끌려갔습니다
  - 유다는 … 유배되었습니다
  lexicon: HALOT
  rationale: גלה는 강제 이주/포로 생활의 맥락을 가지므로, 수동적 결과를 분명히 하되 한국어에서 자연스러운 ‘포로가 되었습니다’로 옮겼습니다.
- source_word: מֵעַל אַדְמָתוֹ
  english_pob_choice: from its land
  chosen_korean: 자기 땅에서
  alternatives_korean:
  - 그 땅에서
  - 자기 토지에서
  lexicon: HALOT
  rationale: אַדְמָה는 여기서 국토/땅의 의미가 적절하며, 주어가 유다이므로 ‘자기 땅’이 자연스럽고 문맥상 명확합니다.
theological_decisions:
- issue: 두 동사의 연속 표현을 살릴지 여부
  chosen_reading: ‘쳐서’와 ‘죽였습니다’를 분리해, 먼저 타격한 뒤 실제로 죽인다는 순서를 드러냈습니다.
  alternative_readings:
  - ‘죽였습니다’ 하나로 압축
  - ‘쳐서 죽였습니다’로 통합
  rationale: 히브리어는 두 동사를 나란히 두어 폭력성과 결과를 모두 강조하므로, 이를 한국어에서도 구분해 보존하는 것이 좋습니다.
  doctrine_reference: 본문의 서술 질서와 동사 중첩을 보존하는 번역 원칙
- issue: ‘유다는 … 포로가 되었습니다’의 수동적 표현
  chosen_reading: 강제 추방의 결과를 드러내는 수동적 종결로 번역했습니다.
  alternative_readings:
  - ‘유다가 그 땅에서 떠났습니다’
  - ‘유다가 그 땅에서 갔습니다’
  rationale: 문맥은 자발적 이동이 아니라 강제 포로를 말하므로, 수동적 결과를 유지해야 본문의 역사적·신학적 무게가 살아납니다.
  doctrine_reference: 포로기 심판 서술의 역사성 보존
