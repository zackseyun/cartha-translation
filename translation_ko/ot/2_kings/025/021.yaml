  source_fidelity: 첫 절의 두 동사(‘치다’와 ‘죽게 하다’)를 구분한 점은 원문에 충실합니다. 다만 유배 동사 자체가 히브리어 문법상 수동형이라는 인상을 주는 각주는 정확하지 않습니다. 수동적 한국어 번역은 문맥적 해석으로는 가능하지만, 원문의 동사 형태를 수동으로 설명해서는 안 됩니다.
