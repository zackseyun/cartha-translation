  terminology: ‘바빌론 왕’, ‘리블라’, ‘하맛’, ‘유다’, ‘포로’는 현대 표준어 성경 문체에서 적절합니다. ‘죽였습니다’는 사역형의 결과를 자연스럽게 전달하며, ‘사형에 처했습니다’처럼 법적 처형을 단정하지 않습니다.
