  source_fidelity: 중대한 인물 식별 오류가 있습니다. 히브리어의 ‘그의 통치’는 이 문맥에서 여호야긴이 아니라 직전 문맥의 유다 왕 시드기야를 가리킵니다. 또한 עַל־יְרוּשָׁלַ͏ִם은 포위전 문맥에서 예루살렘을 ‘향하여/치러’ 온 군사 행동을 나타내므로 이를 드러내는 편이 적절합니다. דָּיֵק은 특정 형태가 확정되지 않은 공성 시설을 뜻하므로 본문에서는 포괄적으로 옮기고 각주에서 가능한 의미를 보존했습니다.
  naturalness: 현대 한국어 합쇼체로 자연스럽게 다듬었습니다. ‘그와 그의 모든 군대를 거느리고’는 군대를 동반한 주체가 느부갓네살임을 다소 중복적으로 표현하므로, ‘그와 그의 모든 군대가’로 원문의 병렬 구조를 살렸습니다. ‘그 성의 주위에’는 סָבִיב의 공간 관계를 명료하게 나타냅니다.
  terminology: ‘시드기야’, ‘느부갓네살’, ‘바빌론’, ‘예루살렘’은 한국어 성경 전통과 현대 독자의 이해를 함께 고려한 통용 표기입니다. דָּיֵק은 ‘공성 시설’로 번역하고, 공성벽·공성토·공성 진지 등의 세부 가능성은 각주에 남겼습니다.
