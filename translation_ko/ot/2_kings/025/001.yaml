  revised_text: 시드기야가 통치한 지 제9년 열째 달 열째 날에, 바빌론 왕 느부갓네살이 그와 그의 모든 군대와 함께 예루살렘을 치러 와서, 그 성을 향해 진을 치고 그 주위에 공성 시설을 세웠습니다.[a]
