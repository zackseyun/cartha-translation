    rationale: 각주는 ‘그의 통치’를 여호야긴으로 풀었다고 설명하지만, 그 문맥상 해석 자체가 잘못되었습니다. 따라서 삭제하거나 시드기야로 고쳐야 합니다. 본문에서 시드기야를 명시하므로 별도 각주는 필요하지 않습니다.
