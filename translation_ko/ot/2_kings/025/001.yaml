base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/001.yaml
  text: And it happened in the ninth year of his reign[a], in the tenth month, on the tenth day of the month, that Nebuchadnezzar king of Babylon came, he and all his army, against Jerusalem[b], and encamped against it and built a siege wall around it.
  footnotes:
  - marker: a
    text: Or 'siegeworks' or 'siege rampart' for the Hebrew דָּיֵק, a term for military works built against a city during a siege.
    reason: lexical_alternative
  - marker: b
    text: The name may also be rendered 'Nebuchadrezzar' in some transliteration traditions.
    reason: lexical_alternative
translation:
  language: ko
  text: 시드기야가 통치한 지 제9년 열째 달 열째 날에, 바빌론 왕 느부갓네살이 그와 그의 모든 군대와 함께 예루살렘을 치러 와서, 그 성을 향해 진을 치고 그 주위에 공성 시설을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 다예크(דָּיֵק)는 포위 중인 성을 공격하기 위하여 만든 공성 시설을 가리킵니다. ‘공성벽’, ‘공성토’, 또는 ‘공성 진지’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 여호야긴의 통치 제9년, ...에
  alternatives_korean:
  - 그리고 ...
  - 그때 ...
  lexicon: HALOT
  rationale: 히브리어 서술 전환 표현을 한국어에서는 사건 개시형 시간 부사구로 자연스럽게 풀어, 연대 표기를 앞세우면서도 역사 서술의 흐름을 유지했습니다.
- source_word: לְמָלְכֹו
  english_pob_choice: his reign
  chosen_korean: 여호야긴의 통치
  alternatives_korean:
  - 그의 치세
  - 그의 왕위
  lexicon: HALOT
  rationale: 문맥상 대상은 유다 왕 여호야긴이므로, 단순한 대명사 대신 한국어에서 이해가 분명한 고유명사화된 통치 표기를 택했습니다.
- source_word: וַיִּבְנוּ ... דָּיֵק סָבִיב
  english_pob_choice: and built a siege wall around it
  chosen_korean: 사방으로 포위 공사를 세웠습니다
  alternatives_korean:
  - 사방으로 공성벽을 쌓았습니다
  - 사방으로 포위 벽을 세웠습니다
  - 사방으로 공성 진지를 구축했습니다
  lexicon: HALOT
  rationale: דָּיֵק은 단순한 성벽이 아니라 공성용 군사 공사이므로, '포위 공사'로 옮겨 공격적·군사적 성격을 드러냈습니다. '사방으로'는 סָבִיב의 둘러쌈을 반영합니다.
- source_word: נְבֻכַדְנֶאצַּר
  english_pob_choice: Nebuchadnezzar
  chosen_korean: 느부갓네살
  alternatives_korean:
  - 느부갓레살
  - 느부갓네살르
  lexicon: HALOT
  rationale: 한국어 성경 전통에서 널리 쓰이는 형태를 따르되, 영어 POB의 표준 음역과 충돌하지 않는 범위에서 통용 표기를 사용했습니다.
theological_decisions:
- issue: 예루살렘 포위의 군사적 압박을 어떻게 표현할 것인가
  chosen_reading: ‘진을 치고 사방으로 포위 공사를 세웠습니다’로, 단순한 접근이 아니라 실제 공성 작전이 시작되었음을 드러냈습니다.
  alternative_readings:
  - ‘예루살렘을 향해 진을 쳤습니다’
  - ‘예루살렘을 포위했습니다’
  rationale: 본문은 העיר를 향한 이동이 아니라 정착된 포위와 공성 공사를 함께 말하므로, 전쟁 상황의 긴박함과 절차를 모두 살리는 표현이 필요합니다.
  doctrine_reference: 역사 서술의 군사적 사실성
