base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/028.yaml
  text: He spoke kindly to him and set his throne above the thrones of the kings who were with him in Babylon[a][b].
  footnotes:
  - marker: a
    text: Or 'He spoke good things to him,' an idiom meaning he addressed him favorably or kindly.
    reason: lexical_alternative
  - marker: b
    text: '''Throne'' may also be understood concretely as ''seat''; the sense is that Jehoiachin was given a rank above the other captive kings in Babylon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그에게 친절하게 말하고, 그와 함께 바빌론에 있는 왕들의 보좌들보다 그의 보좌를 높이게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 좋은 말들을 했다’라는 뜻으로, 그에게 호의적이고 친절하게 말했다는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보좌’는 구체적으로 ‘자리’로도 이해할 수 있으며, 뜻은 바빌론의 다른 포로 왕들보다 여호야긴에게 더 높은 지위가 주어졌다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּ֥ר אִתּ֖וֹ טֹב֑וֹת
  english_pob_choice: He spoke kindly to him
  chosen_korean: 그에게 친절하게 말하고
  alternatives_korean:
  - 그에게 좋은 말들을 하고
  - 그에게 호의적으로 말하고
  lexicon: HALOT
  rationale: טובות는 직역하면 ‘좋은 것들’이지만, 문맥상 말의 내용보다 호의적·우호적 대우를 뜻하는 관용구이므로 ‘친절하게 말하다’로 옮겼습니다.
- source_word: וַיִּתֵּן אֶת כִּסְא֔וֹ
  english_pob_choice: set his throne
  chosen_korean: 그의 보좌를 높이게 했습니다
  alternatives_korean:
  - 그의 보좌를 세웠습니다
  - 그의 보좌를 두었습니다
  lexicon: HALOT
  rationale: נתן은 여기서 물건을 ‘주다’가 아니라 지위를 배치·승격시키는 뜻으로 쓰였으므로, 왕권의 승격을 드러내는 표현으로 옮겼습니다.
- source_word: כִּסֵּ֧א הַמְּלָכִ֛ים
  english_pob_choice: the thrones of the kings
  chosen_korean: 왕들의 보좌들
  alternatives_korean:
  - 왕들의 자리들
  - 왕들의 옥좌들
  lexicon: HALOT
  rationale: כִּסֵּא는 단순한 의자보다 왕적 지위를 가리키는 말이므로, 본문이 말하는 복수의 왕좌를 자연스럽게 드러내기 위해 ‘보좌들’로 옮겼습니다.
- source_word: בְּבָבֶל
  english_pob_choice: in Babylon
  chosen_korean: 바빌론에 있는
  alternatives_korean:
  - 바빌론에서
  - 바빌론 안에 있는
  lexicon: HALOT
  rationale: 장소 표지로서의 בְּ는 문맥상 ‘~에 있는’으로 자연스럽게 풀어, 포로 왕들이 왕궁/궁정에 함께 있었던 상황을 분명하게 했습니다.
theological_decisions:
- issue: 왕권의 상대적 승격 표현
  chosen_reading: 바벨론 궁정 안에서 여호야긴이 다른 포로 왕들보다 높은 지위를 받았다는 뜻을 살려 번역했습니다.
  alternative_readings:
  - 단순히 물리적 자리를 위에 두었다는 읽기
  - 추상적으로 ‘명예를 높였다’는 식의 완화된 읽기
  rationale: 히브리어의 ‘보좌’와 ‘~보다 위에’는 실제 지위 상승을 함께 암시하므로, 본문의 정치적·왕정적 함의를 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 왕권/포로 상태에 대한 역사서 본문 해석
