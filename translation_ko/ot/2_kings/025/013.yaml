source:
  edition: WLC
  text: וְ/אֶת עַמּוּדֵ֨י הַ/נְּחֹ֜שֶׁת אֲשֶׁ֣ר בֵּית יְהוָ֗ה וְֽ/אֶת הַ/מְּכֹנ֞וֹת וְ/אֶת יָ֧ם הַ/נְּחֹ֛שֶׁת אֲשֶׁ֥ר בְּ/בֵית יְהוָ֖ה שִׁבְּר֣וּ כַשְׂדִּ֑ים וַ/יִּשְׂא֥וּ אֶת נְחֻשְׁתָּ֖/ם בָּבֶֽלָ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/013.yaml
  text: And the Chaldeans broke in pieces the bronze pillars that were in the house of Yahweh[a], and the stands, and the bronze sea that was in the house of Yahweh[b], and carried their bronze to Babylon.
  footnotes:
  - marker: a
    text: Or 'the bases' for 'the stands' (Hebrew מְכֹנוֹת), referring to the supporting structures for the temple basins.
    reason: lexical_alternative
  - marker: b
    text: '''The Chaldeans'' refers to the Babylonian forces.'
    reason: cultural_note
translation:
  language: ko
  text: 갈대아 사람들[b]이 야훼의 집에 있던 청동 기둥들과 받침대들[a]과 야훼의 집에 있던 청동 바다를 부수고, 그 기물들의 청동을 바빌론으로 가져갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘받침들’. 히브리어 מְכֹנוֹת는 성전의 물두멍을 받치던 구조물을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘갈대아 사람들’은 바빌로니아 군세를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: עַמּוּדֵי הַנְּחֹשֶׁת
  english_pob_choice: the bronze pillars
  chosen_korean: 놋기둥들
  alternatives_korean:
  - 놋으로 된 기둥들
  - 청동 기둥들
  lexicon: HALOT
  rationale: 문맥상 성전 기구의 고유 명칭이므로 직역형인 ‘기둥들’을 살리고, הַנְּחֹשֶׁת은 전통적 ‘놋’으로 옮겨 성전 금속 기물 용례를 자연스럽게 반영했습니다.
- source_word: הַמְּכֹנוֹת
  english_pob_choice: the stands
  chosen_korean: 받침대들
  alternatives_korean:
  - 기둥받침들
  - 틀들
  lexicon: HALOT
  rationale: POB가 성전 물두멍의 지지 구조를 가리키는 ‘stands’를 택한 점을 따라, 한국어에서는 기능이 분명한 ‘받침대들’이 가장 이해하기 쉽습니다.
- source_word: יָם הַנְּחֹשֶׁת
  english_pob_choice: the bronze sea
  chosen_korean: 놋바다
  alternatives_korean:
  - 놋으로 된 바다
  - 청동 바다
  - 놋바다 물두멍
  lexicon: HALOT
  rationale: יַם을 해석적으로 ‘물두멍’으로 바꾸지 않고, 성전 기구의 고유 표현인 ‘바다’를 보존해 원문 이미지를 유지했습니다.
- source_word: שִׁבְּרוּ
  english_pob_choice: broke in pieces
  chosen_korean: 부수고
  alternatives_korean:
  - 조각내고
  - 산산이 부수고
  - 깨뜨리고
  lexicon: HALOT
  rationale: 큰 금속 기구를 운반 가능하게 만드는 파괴 행위를 간명하게 나타내는 동사로 ‘부수고’를 택했습니다.
- source_word: כַשְׂדִּים
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 칼데아 사람들
  - 바빌로니아 사람들
  lexicon: HALOT
  rationale: 히브리어 고유 표현을 직접 살리되, 한국어 성경 관용에 맞는 ‘갈대아 사람들’로 옮겨 원문 지시를 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: POB의 신명기적 표기 원칙에 따라 히브리어 고유명사를 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 갈대아 사람들 vs 바빌로니아 사람들
  chosen_reading: 원문의 민족/정치 집단 표지인 ‘갈대아 사람들’을 유지했습니다.
  alternative_readings:
  - 바빌로니아 사람들
  rationale: 영어 POB도 'Chaldeans'를 유지하고 주석으로 바빌로니아 군세임을 설명하므로, 본문은 원문 어휘를 보존하고 이해 보조는 주석에 맡기는 편이 더 투명합니다.
  doctrine_reference: 'POB translation principle: source-transparency over harmonizing paraphrase'
- issue: 여호와 대치어
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명기명사를 인격적 고유명사로 드러내어, 성전 기물의 약탈이 단순한 장소 훼손이 아니라 야훼의 집에 대한 침탈임을 분명히 합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
