source:
  edition: WLC
  text: וַ/תִּבָּקַ֣ע הָ/עִ֗יר וְ/כָל אַנְשֵׁ֨י הַ/מִּלְחָמָ֤ה הַ/לַּ֨יְלָה֙ דֶּ֜רֶךְ שַׁ֣עַר בֵּ֣ין הַ/חֹמֹתַ֗יִם אֲשֶׁר֙ עַל גַּ֣ן הַ/מֶּ֔לֶךְ וְ/כַשְׂדִּ֥ים עַל הָ/עִ֖יר סָבִ֑יב וַ/יֵּ֖לֶךְ דֶּ֥רֶךְ הָ/עֲרָבָֽה־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/004.yaml
  text: Then the city was breached[a], and all the men of war fled by night by the way of the gate between the two walls, which was by the king’s garden, though the Chaldeans were around the city on every side[c][b]; and the king went by the way of the Arabah.
  footnotes:
  - marker: a
    text: Or 'the Babylonians' for 'the Chaldeans.' The Hebrew specifically reads 'Chaldeans.'
    reason: lexical_alternative
  - marker: b
    text: Or 'he went.' The Hebrew leaves the subject implicit; context indicates the king.
    reason: lexical_alternative
  - marker: c
    text: The Arabah is the Jordan rift region southward from the Jordan Valley; traditionally also rendered 'the plain.'
    reason: cultural_note
translation:
  language: ko
  text: 그 성이 뚫리자[a], 모든 전사들이 밤에 왕의 정원 곁에 있는 두 성벽 사이의 성문으로 도망하였고, 갈대아 사람들[b]이 성을 사방에서 에워싸고 있는 가운데 왕은 아라바 길로 갔습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “성이 돌파되자”. 히브리어는 포위전 중 성읍의 방어선이 뚫린 상황을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “바빌로니아 사람들”. 히브리어 본문은 “갈대아 사람들”이라고 합니다.
    reason: lexical_alternative
  - marker: c
    text: 아라바는 요단 계곡에서 남쪽으로 이어지는 지리 구역입니다. 전통적으로는 “평야”로도 옮깁니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּבָּקַע / was breached
  english_pob_choice: was breached
  chosen_korean: 함락되자
  alternatives_korean:
  - 무너져 뚫리자
  - 돌파되자
  - 깨져 열리자
  lexicon: HALOT
  rationale: 성읍이 포위전 끝에 무력으로 뚫린 상황을 자연스럽게 드러내면서도, 원문의 군사적 함의를 유지합니다.
- source_word: הָעִיר / the city
  english_pob_choice: the city
  chosen_korean: 그 성
  alternatives_korean:
  - 그 도시
  - 예루살렘
  lexicon: HALOT
  rationale: 문맥상 예루살렘이지만, 히브리어의 일반명사를 살려 서술을 유지했습니다.
- source_word: וְכַשְׂדִּים / the Chaldeans
  english_pob_choice: the Chaldeans
  chosen_korean: 갈대아 사람들
  alternatives_korean:
  - 바빌로니아 사람들
  lexicon: HALOT
  rationale: POB의 본문 선택을 따라 히브리어가 말하는 고유한 역사적 호칭을 본문에 남겼습니다.
- source_word: וַיֵּלֶךְ / the king went
  english_pob_choice: the king went
  chosen_korean: 왕은 갔습니다
  alternatives_korean:
  - 그는 갔습니다
  lexicon: HALOT
  rationale: 히브리어는 주어를 생략하지만 문맥상 왕으로 분명하므로, 한국어에서는 의미가 분명하도록 명시했습니다.
- source_word: דֶּרֶךְ הָעֲרָבָה / by the way of the Arabah
  english_pob_choice: by the way of the Arabah
  chosen_korean: 아라바 길
  alternatives_korean:
  - 아라바로 가는 길
  - 광야 길
  lexicon: HALOT
  rationale: 지리명은 해석어인 ‘평야/광야’로 풀지 않고 아라바를 음역해 지리적 고유성을 보존했습니다.
theological_decisions:
- issue: 사방으로 둘러선 적군의 묘사
  chosen_reading: 갈대아 사람들이 성 주위에 사방으로 둘러서 있었습니다
  alternative_readings:
  - 갈대아 사람들이 성을 에워싸고 있었습니다
  - 바빌로니아 사람들이 성 주위에 있었습니다
  rationale: 원문의 סביב가 단순한 위치보다 포위의 압박을 강조하므로, ‘사방으로’로 그 긴박함을 살렸습니다.
  doctrine_reference: 역사서의 서술 정확성 및 전쟁 맥락 보존
