- from: 그 성이 함락되자[a], 모든 전사들은 밤에 두 성벽 사이의 성문 길로—그곳은 왕의 정원 곁이었는데—도망하였고, 갈대아 사람들은 성 주위에 사방으로 둘러서 있었습니다[b]; 왕은 아라바 길로 갔습니다[c].
  to: 그 성이 뚫리자[a], 모든 전사들이 밤에 왕의 정원 곁에 있는 두 성벽 사이의 성문으로 도망하였고, 갈대아 사람들[b]이 성을 사방에서 에워싸고 있는 가운데 왕은 아라바 길로 갔습니다[c].
