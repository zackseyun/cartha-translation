  rationale: 본 구절은 יְהוָה를 직접 사용하므로, 프로젝트 기본어휘와 영어 POB의 audit trail에 따라 ‘야훼’로 옮겨 언약명 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
