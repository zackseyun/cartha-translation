  text: As for the two pillars[a], the one Sea, and the stands that Solomon had made for the house of Yahweh, there was no weighing the bronze of all these vessels.
  footnotes:
  - marker: a
    text: Or, 'there was no weight for the bronze of all these vessels,' that is, the bronze was not weighed because of its great quantity.
    reason: lexical_alternative
translation:
  language: ko
  text: 두 기둥과 바다 하나와, 솔로몬이 야훼의 집을 위해 만든 받침대들은, 이 모든 기구의 청동이 너무 많아 무게를 달 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “이 모든 기구의 청동에는 무게가 없었다.”
