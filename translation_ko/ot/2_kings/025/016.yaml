    issue: ‘청동을 달지 않았습니다’가 원문의 비인칭적 관용을 능동적 행위로 특정합니다.
    rationale: לֹא הָיָה מִשְׁקָל은 직역하면 ‘무게가 없었다’이며, 문맥상 너무 많아 무게를 달지 못했다는 뜻입니다. 누가 의도적으로 달지 않았다는 의미는 본문이 명시하지 않습니다.
  - severity: low
    issue: ‘한 바다’는 성전 기물의 고유·기술적 명칭으로 읽히기 어렵습니다.
    rationale: הַיָּם הָאֶחָד은 문자적으로 ‘그 바다 하나’이며 여기서 ‘바다’는 성전의 큰 청동 물그릇을 가리킵니다. ‘바다 하나’가 한국어 어순상 더 자연스럽습니다.
  - severity: low
    issue: 각주가 본문과 의미상 충돌할 수 있는 ‘달아 보지 않았다’를 단정합니다.
