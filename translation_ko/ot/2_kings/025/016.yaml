lexical_decisions:
- source_word: הָעַמּוּדִים שְׁנַיִם
  english_pob_choice: the two pillars
  chosen_korean: 두 기둥
  alternatives_korean:
  - 두 개의 기둥
  - 두 원주
  lexicon: HALOT
  rationale: עַמּוּדִים은 성전 기구 맥락에서 구조물의 기둥을 가리키므로, 자연스럽고 직역에 가까운 ‘기둥’으로 옮겼습니다.
- source_word: הַיָּם הָאֶחָד
  english_pob_choice: the one Sea
  chosen_korean: 한 바다
  alternatives_korean:
  - 한 바다 대야
  - 그 하나의 바다
  lexicon: HALOT
  rationale: 여기서 יָם은 성전의 큰 청동 물두멍을 가리키는 기술적 명칭이므로, 고유한 호칭을 살리되 한국어로는 직역형인 ‘한 바다’로 유지했습니다.
- source_word: וְהַמְּכֹנֹת
  english_pob_choice: the stands
  chosen_korean: 받침대들
  alternatives_korean:
  - 기단들
  - 스탠드들
  lexicon: HALOT
  rationale: מְכֹנוֹת은 성전의 물두멍 받침을 뜻하므로, 기능이 분명한 ‘받침대들’이 가장 이해하기 쉽고 과도한 설명도 피합니다.
- source_word: לֹא הָיָה מִשְׁקָל לִנְחֹשֶׁת
  english_pob_choice: there was no weighing the bronze
  chosen_korean: 청동을 달지 않았습니다
  alternatives_korean:
  - 청동의 무게를 달 수 없었습니다
  - 청동의 무게를 재지 않았습니다
  lexicon: HALOT
  rationale: 문맥상 ‘무게가 없었다’가 아니라, 양이 너무 많아 ‘달아 보지 않았다’는 뜻이므로 동사적으로 옮겨 원문의 관용적 의미를 살렸습니다.
- source_word: לְבֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집
  lexicon: HALOT
  rationale: 기본 대응을 따라 יְהוָה를 ‘야훼’로 두고, בית־יהוה의 직역인 ‘집’을 유지해 성전 명칭의 원형을 보존했습니다.
