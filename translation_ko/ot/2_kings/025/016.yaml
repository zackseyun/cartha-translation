revisions:
- from: 두 기둥과 한 바다와 — 야훼의 집을 위해 솔로몬이 만든 — 받침대들에 관해서는, 이 모든 기구의 청동을 달지 않았습니다.[a]
  to: 두 기둥과 바다 하나와, 솔로몬이 야훼의 집을 위해 만든 받침대들은, 이 모든 기구의 청동이 너무 많아 무게를 달 수 없었습니다.[a]
  rationale: 원문의 기물 열거와 관계절을 자연스러운 한국어 문장으로 재구성하되, ‘무게가 없었다’라는 히브리어 관용을 ‘너무 많아 무게를 달 수 없었습니다’로 옮겨 의미를 명확히 했습니다. ‘너무 많아’는 문맥상 함의를 드러내는 보충이며, 각주에서 명사적 직역을 제시하여 원문의 표현을 확인할 수 있게 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:39Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적으로 기물 목록과 야훼의 이름은 원문에 충실합니다. 그러나 לֹא הָיָה מִשְׁקָל은 ‘청동을 달지 않았다’라고 행위 주체를 특정하기보다, ‘무게를 달 수 없었다/달지 못했다’라는 비인칭적 표현으로 옮기는 편이 원문의 ‘무게를 잴 수 없을 만큼 많음’이라는 관용을 더 정확히 보존합니다.
  naturalness: ‘한 바다’는 한국어에서 수량사와 일반명사의 결합으로 읽혀 성전 기물의 명칭이라는 점이 흐려집니다. ‘바다 하나’라고 하거나, 문맥상 명칭임을 살려 ‘그 바다’로 옮기는 것이 더 자연스럽습니다. 또한 긴 삽입 대시는 한국어 성경 문체에서는 관계절로 자연스럽게 연결하는 편이 좋습니다.
  terminology: ‘두 기둥’, ‘받침대들’, ‘청동’, ‘야훼의 집’은 적절합니다. הַיָּם은 성전의 대형 물 그릇을 가리키는 명칭이므로 ‘바다 하나’로 두어 문자적 표현과 지시 대상을 함께 보존합니다. 각주 대안인 ‘달 수 없었다’는 본문과 지나치게 겹치므로, 원문의 명사적 표현인 ‘무게가 없었다’를 대안으로 제시합니다.
  issues:
