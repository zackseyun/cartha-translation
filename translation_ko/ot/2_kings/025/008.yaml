  alternative_readings:
  - 직함을 '도살자들의 우두머리'처럼 직역해 더 강하게 드러내는 읽기
  - 모든 고유명사를 음역으로만 두는 읽기
  rationale: 이 절은 신학적 해석보다 역사적 정보 전달이 핵심이므로, 원문의 사실성과 직책 의미를 균형 있게 살리는 것이 적절합니다.
  doctrine_reference: 성경의 역사 서술 전달 원칙
