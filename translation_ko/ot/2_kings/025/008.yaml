base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/008.yaml
  text: And in the fifth month[a], on the seventh day of the month—which was the nineteenth year of King Nebuchadnezzar, king of Babylon—Nebuzaradan, the captain of the guard, a servant of the king of Babylon, came to Jerusalem.
  footnotes:
  - marker: a
    text: Hebrew 'chief of the slaughterers'; the title likely refers to the commander of the royal guard or executioners.
    reason: lexical_alternative
translation:
  language: ko
  text: 다섯째 달[a], 곧 그 달의 일곱째 날에, 그것은 바빌로니아 왕 느부갓네살의 제십구년이었는데, 느부사라단—경호대장, 바빌로니아 왕의 종—이 예루살렘에 이르렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '도살자들의 우두머리'를 뜻하지만, 문맥상 왕실 경호대 또는 처형 집행자들의 지휘관을 가리키는 직함으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/חֹ֤דֶשׁ הַֽ/חֲמִישִׁי֙
  english_pob_choice: And in the fifth month
  chosen_korean: 다섯째 달
  alternatives_korean:
  - 그리고 다섯째 달에
  - 다섯째 달에
  lexicon: HALOT
  rationale: 문맥상 이어지는 연대기 서술이므로 한국어에서는 군더더기 없는 날짜 표현으로 옮기되, '달'의 달력 표현을 유지했습니다.
- source_word: בְּ/שִׁבְעָ֣ה לַ/חֹ֔דֶשׁ
  english_pob_choice: on the seventh day of the month
  chosen_korean: 그 달의 일곱째 날
  alternatives_korean:
  - 그 달의 7일에
  - 그 달의 일곱째 날에
  lexicon: HALOT
  rationale: 히브리어 날짜 관용구를 자연스러운 현대 한국어로 풀되, '날'을 넣어 원문의 명시성을 살렸습니다.
- source_word: הִ֗יא שְׁנַת֙ תְּשַֽׁע עֶשְׂרֵ֣ה שָׁנָ֔ה לַ/מֶּ֖לֶךְ נְבֻכַדְנֶאצַּ֣ר
  english_pob_choice: which was the nineteenth year of King Nebuchadnezzar
  chosen_korean: 그것은 바빌로니아 왕 느부갓네살의 제십구년이었는데
  alternatives_korean:
  - 그것은 느부갓네살 왕의 제십구년이었는데
  - 곧 느부갓네살 바빌로니아 왕의 제십구년이었는데
  lexicon: HALOT
  rationale: 히브리어 היא의 설명적 용법을 '그것은'으로 살리고, 재위 연대는 한국어 연대기체에 맞게 '제십구년'으로 옮겼습니다.
- source_word: רַב טַבָּחִים
  english_pob_choice: the captain of the guard
  chosen_korean: 경호대장
  alternatives_korean:
  - 시위대장
  - 친위대장
  - 경호대장
  lexicon: HALOT
  rationale: 직역하면 '도살자들의 우두머리'이지만 문맥상 왕실 경호/처형 담당의 고위 직책이므로, 그 기능을 드러내는 '경호대장'을 택했습니다.
- source_word: עֶבֶד מֶלֶךְ בָּבֶל
  english_pob_choice: a servant of the king of Babylon
  chosen_korean: 바빌로니아 왕의 종
  alternatives_korean:
  - 바빌로니아 왕의 신하
  - 바빌로니아 왕의 신복
  - 바빌로니아 왕의 종
  lexicon: HALOT
  rationale: עבד는 이 문맥에서 신분적 노예라기보다 왕에게 속해 있는 종/신하의 관계를 나타내므로, POB의 'servant'에 맞춰 '종'으로 옮겼습니다.
