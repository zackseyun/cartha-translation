  text: 다섯째 달 그 달의 일곱째 날, 곧 바빌론 왕 느부갓네살의 제십구년에, 바빌론 왕의 신하인 경호대장[a] 느부사라단이 예루살렘에 이르렀습니다.
  philosophy: optimal-equivalence
