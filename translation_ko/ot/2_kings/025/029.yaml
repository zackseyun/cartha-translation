base_translation:
  language: en
  yaml_path: translation/ot/2_kings/025/029.yaml
  text: And he changed his prison clothes[a], and he ate bread continually before him all the days of his life.
  footnotes:
  - marker: a
    text: Or 'in his presence'; the phrase may also imply eating at the king's table.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 옥중 옷을 갈아입었고, 평생 내내 그 앞에서 계속 빵을 먹었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 면전에서’. 이 구절은 왕의 식탁에서 먹었다는 뜻을 함의할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנָּא
  english_pob_choice: and he changed
  chosen_korean: 갈아입었고
  alternatives_korean:
  - 바꾸었고
  - 변경했고
  lexicon: HALOT
  rationale: פּיעל형 שׁנה는 ‘바꾸다/바뀌다’의 뜻이지만, 여기서는 감옥 옷을 벗고 다른 옷으로 갈아입는 상황이므로 한국어에서는 자연스럽게 ‘갈아입다’가 source의 의미를 가장 정확하게 드러냅니다.
- source_word: בִּגְדֵי כִלְאוֹ
  english_pob_choice: his prison clothes
  chosen_korean: 옥중 옷
  alternatives_korean:
  - 감옥 옷
  - 감금의 옷
  - 옥의 옷
  lexicon: HALOT
  rationale: כּלא는 ‘감금/옥’의 뜻이므로, ‘옥중 옷’이 간결하면서도 구속 상태를 분명히 드러냅니다. ‘감옥 옷’보다 문어체로 덜 거칠고, ‘감금의 옷’보다 한국어 자연성이 높습니다.
- source_word: לֶחֶם תָּמִיד
  english_pob_choice: bread continually
  chosen_korean: 계속 빵을 먹었습니다
  alternatives_korean:
  - 늘 빵을 먹었습니다
  - 끊임없이 빵을 먹었습니다
  - 항상 빵을 먹었습니다
  lexicon: HALOT
  rationale: לֶחֶם은 직역하면 ‘빵’이며, כאן은 식사를 가리키는 관용어이지만 본문 이미지를 유지하는 편이 source에 더 가깝습니다. תָּמִיד는 지속성/규칙성을 나타내므로 ‘계속’이 가장 무난합니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: 그 앞에서
  alternatives_korean:
  - 그의 면전에서
  - 그의 앞에서
  - 그와 함께
  lexicon: HALOT
  rationale: 직역은 ‘그 앞에서’이며, 왕의 식탁에서 먹는다는 함의는 가능하지만 본문 자체가 그보다 넓습니다. 따라서 본문은 열린 의미를 유지하고, 구체적 함의는 주석으로 처리하는 편이 적절합니다.
theological_decisions:
- issue: 왕 앞에서 먹는다는 함의의 처리
  chosen_reading: 본문은 ‘그 앞에서’로 옮겨 왕의 면전/식탁 섭식 가능성을 열어 둡니다.
  alternative_readings:
  - ‘왕의 식탁에서’로 구체화
  - ‘그의 면전에서’로만 직역
  rationale: 히브리어 לְפָנָיו는 단순한 위치 표현이지만 왕실 공급의 맥락상 식탁 교제까지 암시할 수 있습니다. 한국어 본문은 과도하게 특정화하지 않고, 주석으로 독자를 안내하는 것이 source에 더 충실합니다.
  doctrine_reference: 본문-주석 구분 원칙
- issue: ‘빵’의 표현 유지
  chosen_reading: 식사 관용구를 너무 풀지 않고 ‘빵을 먹었습니다’로 유지했습니다.
  alternative_readings:
  - ‘식사를 했습니다’
  - ‘음식을 먹었습니다’
  rationale: 히브리어 לֶחֶם은 일상적으로 식사를 뜻할 수 있으나, 사본의 표면 형식 자체가 의미 전달의 일부입니다. 관용구를 유지함으로써 원문 어감을 보존합니다.
  doctrine_reference: source-form preservation
