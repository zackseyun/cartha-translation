base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/010.yaml
  text: Then Jehoiada the priest took one chest[a], bored a hole in its lid, and set it beside the altar, on the right as a man enters the house of Yahweh[c][b]; and the priests who guarded the threshold put there all the silver that was brought into the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'as one enters the house of the LORD.' The Hebrew reads literally 'as a man enters,' a generic singular orienting the reader to the right side from the entrant's perspective.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'in its door.' In context this likely refers to the chest's lid or cover.
    reason: lexical_alternative
  - marker: c
    text: Or 'all the money.' Hebrew 'silver' can also function as a term for money.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 제사장 여호야다가 궤 하나를 가져다가 그 뚜껑에 구멍을 뚫고[b], 야훼의 집에 사람이 들어올 때 그 오른쪽, 제단 곁에 그것을 두었습니다[a]. 문지방을 지키는 제사장들은 야훼의 집으로 가져오는 은을 모두 거기에 넣었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “한 사람이 들어올 때”라고 되어 있습니다. 이는 들어오는 사람의 시점에서 오른쪽을 가리키는 일반적 단수 표현입니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 ‘그의 문’이라고 되어 있습니다. 문맥상 궤의 뚜껑 또는 덮개를 가리키는 것으로 이해됩니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘은’은 여기서 ‘돈’의 의미로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן
  english_pob_choice: chest
  chosen_korean: 궤
  alternatives_korean:
  - 상자
  - 궤짝
  lexicon: HALOT
  rationale: 이 문맥에서는 헌금용 용기를 가리키므로, 성궤를 연상시키는 전통적 용례를 피하면서도 비교적 중립적인 ‘궤’가 적절합니다.
- source_word: וַיִּקֹּב חֹר
  english_pob_choice: bored a hole
  chosen_korean: 구멍을 뚫고
  alternatives_korean:
  - 구멍을 내고
  - 뚫어 구멍을 만들고
  lexicon: HALOT
  rationale: 동작의 물리성을 살리면서 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: בְּדַלְתּוֹ
  english_pob_choice: in its lid
  chosen_korean: 그 뚜껑에
  alternatives_korean:
  - 그 문에
  - 그 옆면에
  lexicon: HALOT
  rationale: 작은 헌금 궤에는 ‘문’보다 ‘뚜껑’이 문맥상 더 자연스럽고, 영어 POB의 판단을 한국어로 반영했습니다.
- source_word: שֹׁמְרֵי הַסַּף
  english_pob_choice: who guarded the threshold
  chosen_korean: 문지방을 지키는
  alternatives_korean:
  - 문턱을 지키는
  - 출입문을 지키는
  lexicon: HALOT
  rationale: ‘threshold’를 직역하되, 성전 출입 관리의 역할이 드러나도록 현대적이고 구체적인 표현을 택했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 하나님의 고유명을 번역하지 않고 음역하여 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: אִישׁ의 성중립화 여부
  chosen_reading: 사람이 들어올 때
  alternative_readings:
  - 한 남자가 들어올 때
  - 누가 들어올 때
  rationale: 히브리어의 남성 단수 표현은 관용적으로 일반인을 가리키므로, 한국어에서는 문맥상 자연스러운 일반 지시로 옮기되 의미를 훼손하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
