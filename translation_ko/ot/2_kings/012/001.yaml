  lexicon: 표준 음역
  rationale: 히브리어 יְהוֹאָשׁ의 형태를 살려 음역하되, 전통적인 영어식 간략형보다 원형에 더 가까운 ‘여호아스’를 선택했습니다.
- source_word: בְּמָלְכוֹ
