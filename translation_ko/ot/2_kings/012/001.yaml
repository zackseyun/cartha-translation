  lexicon: HALOT
  rationale: 나이 표현 בֶּן + 수사 + שָׁנִים은 한국어에서도 자연스러운 연령 표현으로 풀어 옮겨야 하므로, 문자적인 ‘아들’보다 ‘일곱 살’이 본문의 의미를 가장 분명하게 드러냅니다.
