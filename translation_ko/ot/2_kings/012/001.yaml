  - 즉위할 때
  - 다스리기 시작할 때
  lexicon: HALOT
  rationale: ב + מלך의 부정사형은 단순히 ‘~할 때’의 시점을 가리키며, 영어 POB의 ‘began to reign’에 맞춰 왕위에 오른 시점을 자연스럽게 표현했습니다.
theological_decisions:
