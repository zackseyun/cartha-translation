  rationale: 본문은 연령과 즉위 시점을 결합한 역사 서술 공식이므로, 단순 과거 시제가 아니라 통치 개시의 순간을 드러내는 표현이 가장 정확합니다.
  doctrine_reference: 역사 서술의 문법적·서사적 뉘앙스
