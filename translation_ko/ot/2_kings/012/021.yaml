  edition: WLC
  text: וַ/יָּקֻ֥מוּ עֲבָדָ֖י/ו וַ/יִּקְשְׁרֽוּ קָ֑שֶׁר וַ/יַּכּוּ֙ אֶת יוֹאָ֔שׁ בֵּ֥ית מִלֹּ֖א הַ/יּוֹרֵ֥ד סִלָּֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/021.yaml
  text: And his servants rose up and conspired a conspiracy[a], and they struck down Joash at Beth-millo, on the descent to Silla.
  footnotes:
  - marker: a
    text: Or 'which goes down to Silla' / 'on the way down to Silla.' The Hebrew phrase describes the location more literally as the descending approach toward Silla.
    reason: lexical_alternative
translation:
  language: ko
  text: 그의 신하들이 일어나 모반을 꾸미고, 실라로 내려가는 곳에 있는 벳밀로에서 요아스를 쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘실라로 내려가는’이라고 하며, 벳밀로와 관련된 내리막길 또는 내려가는 접근로를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 왕의 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕궁 문맥에서 עֲבָדָיו는 단순한 가사 종보다 왕에게 속한 신하들을 가리키므로, 한국어에서는 자연스럽고 문맥을 분명히 하는 ‘왕의 신하들’로 옮겼습니다.
- source_word: וַיִּקְשְׁרוּ קָשֶׁר
  english_pob_choice: formed a conspiracy / conspired a conspiracy
  chosen_korean: 모반을 꾸미고
  alternatives_korean:
  - 반역을 꾸미고
  - 음모를 꾸미고
  lexicon: HALOT
  rationale: קשׁר의 관용적 표현은 단순한 계획이 아니라 왕에 대한 반역적 음모를 뜻하므로, 한국어에서는 ‘모반을 꾸미고’로 압축해 원문의 관용성과 정치적 강도를 살렸습니다.
- source_word: וַיַּכּוּ
  english_pob_choice: struck down
  chosen_korean: 쳤습니다
  alternatives_korean:
  - 쳐 죽였습니다
  - 내려쳤습니다
  lexicon: HALOT
  rationale: נכה는 넓게 ‘치다/때리다’를 뜻하며, 문맥상 치명상을 암시하지만 본문 자체는 ‘죽이다’보다 ‘치다’에 가깝습니다. 그래서 결과를 과잉단정하지 않도록 ‘쳤습니다’로 옮겼습니다.
- source_word: בֵּית מִלֹּא / הַיּוֹרֵד סִלָּא
  english_pob_choice: Beth-millo, on the descent to Silla
  chosen_korean: 벳밀로에서, 실라로 내려가는 길목에서
  alternatives_korean:
  - 벳밀로에서, 실라로 내려가는 내리막에서
  - 벳밀로에서, 실라로 내려가는 길에서
  lexicon: HALOT
  rationale: 지명은 음역하고, ‘הַיּוֹרֵד סִלָּא’는 위치를 설명하는 하강 통로이므로 ‘실라로 내려가는 길목’으로 자연스럽게 풀어 원문의 지형적 의미를 드러냈습니다.
