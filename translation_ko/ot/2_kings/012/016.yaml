id: 2KI.12.16
reference: 2 Kings 12:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֧א יְחַשְּׁב֣וּ אֶת הָ/אֲנָשִׁ֗ים אֲשֶׁ֨ר יִתְּנ֤וּ אֶת הַ/כֶּ֨סֶף֙ עַל יָדָ֔/ם לָ/תֵ֖ת לְ/עֹשֵׂ֣י הַ/מְּלָאכָ֑ה כִּ֥י בֶ/אֱמֻנָ֖ה הֵ֥ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/016.yaml
  text: But they did not reckon with the men into whose hand they gave the money to give to those doing the work[c][b][a], for they acted faithfully.
  footnotes:
  - marker: a
    text: Or, 'they did not require an accounting from the men.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'into their hand,' an idiom for entrusting something to someone's charge.
    reason: cultural_note
  - marker: c
    text: '''Faithfully'' may also be rendered ''honestly'' or ''with integrity.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 돈을 맡겨서 그 일을 하는 이들에게 주도록 건넨 사람들과는 결산하지 않았습니다[a][b]. 그들이 충실하게 일했기 때문입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그 사람들에게 결산을 요구하지 않았다.’
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그들의 손에’는 무언가를 맡겨 위탁한다는 관용구입니다.
    reason: cultural_note
  - marker: c
    text: ‘충실하게’는 ‘정직하게’ 또는 ‘성실하게’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹ֧א יְחַשְּׁב֣וּ
  english_pob_choice: did not reckon with
  chosen_korean: 결산하지 않았습니다
  alternatives_korean:
  - 정산하지 않았습니다
  - 계산하지 않았습니다
  - 회계보고를 요구하지 않았습니다
  lexicon: HALOT
  rationale: חשב의 피엘은 여기서 돈의 사용에 대해 계산을 따지거나 정산하는 뜻이므로, ‘결산하다’가 회계적 뉘앙스를 가장 자연스럽게 살립니다.
- source_word: אֶת הָאֲנָשִׁים ... עַל יָדָם
  english_pob_choice: the men into whose hand they gave the money
  chosen_korean: 돈을 맡겨서 그 일을 하는 이들에게 주도록 건넨 사람들과
  alternatives_korean:
  - 그들의 손에 돈을 맡긴 사람들과
  - 돈을 그들의 손에 넘겨준 사람들과
  - 돈을 맡은 사람들과
  lexicon: HALOT
  rationale: ‘손에’라는 히브리어 관용구를 한국어로는 ‘맡기다/건네다’로 풀어 주어, 위탁의 의미를 살리면서도 문장을 자연스럽게 했습니다.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  english_pob_choice: those doing the work
  chosen_korean: 그 일을 하는 이들
  alternatives_korean:
  - 일하는 사람들
  - 그 일을 맡은 사람들
  - 공사를 하는 사람들
  lexicon: HALOT
  rationale: 명사적 분사구를 직역에 가깝게 살리되, 문맥상 성전 수리 일을 가리키므로 ‘그 일을 하는 이들’이 가장 무난합니다.
- source_word: בֶאֱמֻנָה
  english_pob_choice: faithfully
  chosen_korean: 충실하게
  alternatives_korean:
  - 성실하게
  - 신실하게
  - 정직하게
  lexicon: HALOT
  rationale: אֱמוּנָה는 여기서 맡은 일을 믿을 만하게 처리했다는 뜻이므로, ‘충실하게’가 ‘faithfully’의 윤리적·신뢰성 뉘앙스를 잘 반영합니다.
theological_decisions:
- issue: 결산/정산의 책임을 강조할지, 단순한 관리 상태로 완화할지
  chosen_reading: 사람들에게 회계적 책임을 묻지 않았다는 뜻을 드러내기 위해 ‘결산하지 않았습니다’로 옮겼습니다.
  alternative_readings:
  - 사람들과 결산하지 않았습니다
  - 사람들에게 정산을 요구하지 않았습니다
  rationale: 본문은 신뢰할 만한 관리 체계를 말하며, 단순 무시가 아니라 돈의 사용에 대한 회계적 검증이 생략되었다는 점을 보여 줍니다.
  doctrine_reference: 청지기적 신뢰와 책임성
- issue: ‘faithfully’를 도덕적 정직성보다 신실한 수행으로 볼지
  chosen_reading: 맡겨진 일을 충실하게 수행한 태도를 뜻하는 것으로 옮겼습니다.
  alternative_readings:
  - 정직하게
  - 신실하게
  - 성실하게
  rationale: 문맥은 금전 취급의 투명성뿐 아니라 맡은 공사를 성실히 수행한 태도를 함께 말하므로, ‘충실하게’가 가장 넓고 안전합니다.
  doctrine_reference: 성실한 청지기직
