translation:
  language: ko
  text: 속건제의 돈과 속죄제의 돈[a]은 야훼의 집[b]으로 들여오지 않았습니다. 그것은 제사장들의 몫이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘은’이지만, 여기서는 성전 재정의 문맥에서 ‘돈’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘야훼의 집’이라고 되어 있으며, 곧 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף
  english_pob_choice: money
  chosen_korean: כסף(은/돈) → 돈
  alternatives_korean:
  - 은
  - 금전
  - 돈
  lexicon: HALOT
  rationale: 이 문맥은 성전 재정의 처리 규정이므로 물질인 ‘은’보다 기능적 의미인 ‘돈’이 한국어에서 더 분명합니다. 다만 두 번 반복되는 מקור어의 어감을 살려 첫머리에 그대로 두지 않고 자연스러운 재정 표현으로 옮겼습니다.
- source_word: אָשָׁם
  english_pob_choice: guilt offering
  chosen_korean: 속건제
  alternatives_korean:
  - 유죄제
  - 배상제
  - 속건제물
  lexicon: HALOT
  rationale: 한국 교회/학술 용례에서 אָשָׁם은 통상 ‘속건제’로 번역되며, POB의 ‘guilt offering’과 가장 안정적으로 대응합니다.
- source_word: חַטָּאוֹת
  english_pob_choice: sin offerings
  chosen_korean: 속죄제
  alternatives_korean:
  - 죄제
  - 정결제
  - 속죄제물
  lexicon: HALOT
  rationale: 여기서는 복수형이 제사의 범주를 가리키므로 ‘죄들’이 아니라 제의적 용어인 ‘속죄제’로 옮기는 것이 적절합니다. 한국어에서는 복수성을 본문 밖 문맥이 보충해 주므로 단수형 제사명으로 처리했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of the LORD
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  - 여호와의 집
  lexicon: HALOT
  rationale: 성전이라는 뜻이 내포되지만, מקור어의 직역 구조인 ‘야훼의 집’을 유지해 히브리어 표현을 보존했습니다. POB의 יְהוָה는 본문 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: לַכֹּהֲנִים יִהְיוּ
  english_pob_choice: it belonged to the priests
  chosen_korean: 제사장들의 몫이었습니다
  alternatives_korean:
  - 제사장들에게 속했습니다
  - 제사장들에게 돌아갔습니다
  - 제사장들의 것이었습니다
  lexicon: HALOT
  rationale: יִהְיוּ는 단순 존재가 아니라 배정/소유를 뜻하므로, 한국어에서는 ‘몫’이 제의적 분배를 가장 자연스럽게 드러냅니다.
theological_decisions:
