  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אָ֣ז יַעֲלֶ֗ה חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יִּלָּ֥חֶם עַל גַּ֖ת וַֽ/יִּלְכְּדָ֑/הּ וַ/יָּ֤שֶׂם חֲזָאֵל֙ פָּנָ֔י/ו לַ/עֲל֖וֹת עַל יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/018.yaml
  text: Then Hazael king of Aram went up and fought against Gath and captured it[b][a], and Hazael set his face to go up against Jerusalem.
  footnotes:
  - marker: a
    text: Or 'set his mind' / 'determined' to go up against Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: '''Aram'' is the Hebrew name often rendered traditionally as ''Syria.'''
    reason: cultural_note
translation:
  language: ko
  text: 그때 아람 왕 하사엘이 올라와서 가드와 싸워 그것을 함락시켰으며, 하사엘은 예루살렘으로 올라가려는 뜻을 정했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음먹고’ / ‘결심하고’ 예루살렘으로 올라가려는 뜻으로 볼 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아람’은 전통적으로 ‘시리아’로 옮겨지기도 하는 히브리어 지명입니다.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  english_pob_choice: Then
  chosen_korean: 그때
  alternatives_korean:
  - 그러자
  - 그리하여
  lexicon: HALOT
  rationale: 이야기 흐름을 이어 주는 시간 접속사로, 현대 한국어에서 자연스럽고 간결한 ‘그때’를 택했습니다.
- source_word: יַעֲלֶה / לַעֲלוֹת
  english_pob_choice: went up / to go up against
  chosen_korean: 올라와서 / 올라가려는 뜻
  alternatives_korean:
  - 쳐들어와서 / 공격하려는
  - 올라가려는
  - 진군하여
  lexicon: HALOT
  rationale: עלה의 반복되는 ‘올라가다’ 관용을 살리되, 군사 문맥의 적대 방향은 뒤의 ‘싸워’와 ‘뜻을 정했습니다’로 분명히 했습니다.
- source_word: וַיִּלָּחֶם עַל
  english_pob_choice: fought against
  chosen_korean: 싸워
  alternatives_korean:
  - 전쟁을 벌여
  - 대항하여 싸워
  lexicon: HALOT
  rationale: לחם עם/על의 전쟁 행위를 자연스러운 현대 문장으로 옮기되, 과도하게 해석적인 ‘공격하다’보다 원문의 전투 동사를 유지했습니다.
- source_word: וַיִּלְכְּדָהּ
  english_pob_choice: captured it
  chosen_korean: 그것을 함락시켰으며
  alternatives_korean:
  - 그것을 포로로 삼았으며
  - 그것을 점령했으며
  - 그것을 빼앗았으며
  lexicon: HALOT
  rationale: 도시 정복 맥락에서 לכד는 성읍의 함락/점령을 뜻하므로, 목적어가 성읍인 점을 드러내는 ‘함락시켰으며’를 택했습니다.
- source_word: וַיָּשֶׂם ... פָּנָיו
  english_pob_choice: set his face
  chosen_korean: 뜻을 정했습니다
  alternatives_korean:
  - 얼굴을 돌렸습니다
  - 얼굴을 향했습니다
  - 결심했습니다
  lexicon: HALOT
  rationale: ‘얼굴을 향하다’는 히브리어 관용을 직역하면 한국어 의미가 흐려지므로, 문맥상 ‘의지를 굳히다’에 해당하는 결심의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 군사 서술에서 히브리어 관용구를 얼마나 직접적으로 유지할지
  chosen_reading: ‘올라가다’ 관용은 가능한 한 살리되, 이해를 돕기 위해 ‘싸워’와 ‘뜻을 정했습니다’로 군사적 의도를 분명히 했습니다.
  alternative_readings:
  - ‘쳐들어갔습니다’로 완전한 현대화
  - ‘진군했습니다’로 군사 뉘앙스 강화
  rationale: 원문은 이동의 방향(올라가다)과 공격 의도(예루살렘으로 올라가려는 의도)를 함께 보여 주므로, 둘 중 하나를 지우지 않는 균형이 필요합니다.
  doctrine_reference: 역사 서술의 서사적 정확성
