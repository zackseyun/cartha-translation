  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יוֹזָבָ֣ד בֶּן שִׁ֠מְעָת וִ/יהוֹזָבָ֨ד בֶּן שֹׁמֵ֤ר עֲבָדָי/ו֙ הִכֻּ֣/הוּ וַ/יָּמֹ֔ת וַ/יִּקְבְּר֥וּ אֹת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲמַצְיָ֥ה בְנ֖/וֹ תַּחְתָּֽי/ו־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/022.yaml
  text: And Jozabad son of Shimeath and Jehozabad son of Shomer[a], his servants, struck him down, and he died. And they buried him with his fathers in the city of David, and Amaziah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'his officials' for 'his servants'; the Hebrew עֲבָדָיו can refer to servants or court attendants depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 시므아의 아들 여호사밧과 쇼메르의 아들 여호사밧, 그의 종들이 그를 쳐서 죽였으므로, 그가 죽었습니다. 그리고 그들은 그를 그의 조상들과 함께 다윗 성에 장사하였고, 그의 아들 아마샤가 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 신하들
  - 그의 관리들
  lexicon: HALOT
  rationale: 문맥상 궁정 소속 사람들을 가리키지만, 히브리어 עֲבָדָיו의 기본 의미인 ‘종들’을 살려 POB의 직역 성향을 따랐습니다. ‘신하들’은 신분과 역할을 조금 더 해석적으로 좁힙니다.
- source_word: הִכֻּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳐서 죽였으므로
  alternatives_korean:
  - 그를 쳤고
  - 그를 죽였고
  lexicon: HALOT
  rationale: 동사 נכה의 폭력성을 살리면서, 바로 뒤의 ‘그가 죽었습니다’와 중복되더라도 한국어에서는 결과를 분명히 보여 주기 위해 ‘쳐서 죽였다’로 옮겼습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 조상들 가운데
  lexicon: HALOT
  rationale: 왕실 매장 관용구를 현대 한국어에서 자연스럽게 풀되, 매장 공동체/왕조적 연속성을 유지하기 위해 ‘조상들’로 옮겼습니다. 직역형 ‘그의 아버지들’은 한국어에서 부자연스럽습니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the city of David
  chosen_korean: 다윗 성에
  alternatives_korean:
  - 다윗의 성에
  - 다윗의 도시 안에
  lexicon: HALOT
  rationale: 고정된 지명 표현이므로 한국어 성경에서 널리 쓰이는 ‘다윗 성’ 구조를 유지했습니다. 조사 ‘-에’로 위치를 분명히 했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned ... in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 자리를 대신하여 다스렸습니다
  - 그를 대신해 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 계승 공식을 한국어로 자연스럽게 살리면서 ‘מלך’의 왕권 취임 의미를 드러냈습니다. ‘그의 뒤를 이어’는 ‘in his place’와 가장 가까운 자연스러운 한국어 표현입니다.
