  text: וַ/יַּ֨עַשׂ יְהוֹאָ֧שׁ הַ/יָּשָׁ֛ר בְּ/עֵינֵ֥י יְהוָ֖ה כָּל יָמָ֑י/ו אֲשֶׁ֣ר הוֹרָ֔/הוּ יְהוֹיָדָ֖ע הַ/כֹּהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/003.yaml
  text: Jehoash did what was right in the eyes of Yahweh all his days[a], because Jehoiada the priest instructed him.
  footnotes:
  - marker: a
    text: Or, more literally, 'all his days that Jehoiada the priest instructed him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야스는 여호와 보시기에 올바른 일을 행했습니다[a]. 그는 제사장 여호야다가 그를 가르치는 동안 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘여호야다 제사장이 그를 가르친 모든 날’ 또는 ‘여호야다 제사장이 그를 가르치는 동안’의 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 했습니다
  - 행하였습니다
  lexicon: HALOT
  rationale: עשה는 왕정 서술에서 행위의 총체를 가리키는 관용적 동사이므로, 단순한 '했습니다'보다 '행했습니다'가 평가 문맥과 더 잘 맞습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 올바른 일
  alternatives_korean:
  - 옳은 일
  - 의로운 일
  - 바른 일
  lexicon: HALOT
  rationale: עשה와 결합한 הַיָּשָׁר는 도덕적 평가를 뜻하므로, '올바른 일'이 문맥을 자연스럽게 살리면서도 판단 기준이 되는 행위를 드러냅니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 여호와 보시기에
  alternatives_korean:
  - 여호와의 눈에
  - 여호와 앞에서
  - 여호와 보기에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 비유적으로 보존해 평가의 기준이 하나님께 있음을 드러냈습니다.
- source_word: הוֹרָהוּ
  english_pob_choice: instructed him
  chosen_korean: 그를 가르치는
  alternatives_korean:
  - 그를 지도하는
  - 그를 훈계하는
  - 그를 가르쳐
  lexicon: HALOT
  rationale: ירה의 히필은 단순 전달보다 가르침과 지도를 포함하므로, 문맥상 제사장 여호야다의 교육적 영향력을 살려 '가르치는'으로 옮겼습니다.
theological_decisions:
- issue: כָּל יָמָיו와 אשר הוֹרָהוּ의 관계
  chosen_reading: 이 구절은 여호야다가 그를 가르치는 동안 여호야스가 올바른 일을 행했다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘그의 모든 날’이라고 더 직역해 시기를 덜 명시적으로 둘 수 있습니다.
  - ‘그가 가르침을 받는 한’으로 더 분명히 기간을 제한할 수도 있습니다.
  rationale: 영어 POB의 감사 메모가 보인 대로, 관계절은 단순히 정보를 덧붙이기보다 행위의 기간을 한정하는 뉘앙스를 강하게 가집니다. 한국어에서는 '동안'으로 그 긴장을 자연스럽게 드러냈습니다.
  doctrine_reference: 본문의 시간적 수식을 과도하게 확장하지 않음
- issue: יְהוָה의 표기
  chosen_reading: 언약 이름 יְהוָה를 '여호와' 대신 '여호와'로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 서술형 역사 본문이므로, 한국어 교회 독자에게 즉각 인식되는 전통 표기를 택하되, 본문 의미는 '여호와'라는 고유명칭으로 보존했습니다.
  doctrine_reference: 고유명칭 표기 일관성
