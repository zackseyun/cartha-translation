source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹאָ֖שׁ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/020.yaml
  text: Now the rest of the acts of Joash[a], and all that he did—are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'the annals of the kings of Judah.' The Hebrew expression can denote an official royal record or chronicle.
    reason: lexical_alternative
translation:
  language: ko
  text: 요아스의 나머지 행적[a]과 그가 한 모든 일은 유다 왕들의 역대기 책에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘행적’은 히브리어 דִּבְרֵי를 왕의 역사 기록이라는 관용적 의미로 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 남은
  alternatives_korean:
  - 나머지
  - 그 밖의
  lexicon: HALOT
  rationale: 제왕 기사문의 관용구에서 יֶתֶר는 '남은'이라는 뜻이 자연스럽고, 문두의 וְ는 한국어에서 별도 접속사 없이 문맥상 이어지게 처리했습니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 사적
  alternatives_korean:
  - 일들
  - 행적
  - 말들
  lexicon: HALOT
  rationale: 직역하면 '말들/일들'이지만, 왕의 생애를 기록한 문맥에서는 '사적'이 역사 기록체의 의미를 잘 살립니다.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 기록되지 않았습니까
  - 쓰여 있지 않습니까
  lexicon: HALOT
  rationale: 수사 의문문을 한국어의 확인 요청형으로 옮겨, 원문의 이미 정해진 기록을 상기시키는 뉘앙스를 유지했습니다.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 역대기 책
  alternatives_korean:
  - 유다 왕들의 연대기 책
  - 유다 왕들의 역대기
  lexicon: HALOT
  rationale: דִּבְרֵי הַיָּמִים는 왕실 연대기/역대기를 가리키므로 '역대기 책'으로 옮기되, לְמַלְכֵי יְהוּדָה의 소속 관계를 '유다 왕들의'로 분명히 했습니다.
