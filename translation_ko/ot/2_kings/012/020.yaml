  source_fidelity: 히브리어의 왕정 요약 공식(‘요아스의 남은/나머지 행적과 그가 한 모든 일’)과 수사 의문문, 그리고 유다 왕들의 기록이라는 출처 표기를 충실히 반영합니다. ‘나머지 행적’은 יֶתֶר דִּבְרֵי의 문맥상 의미를 자연스럽게 전달합니다.
  naturalness: 초안의 ‘사적’은 현대 표준어에서 다소 고풍스럽고 사적인 기록이라는 뜻으로도 읽힐 수 있습니다. ‘나머지 행적’이 현대적이면서도 왕의 업적·행위를 가리키는 문맥에 더 명료합니다. 각주 표지도 설명 대상 바로 뒤에 두는 것이 자연스럽습니다.
  terminology: 요아스, 유다, 역대기 책은 적절합니다. 이곳의 ‘역대기’는 정경 「역대기」 자체가 아니라 유다 왕들의 왕실 기록을 가리키는 명칭이므로, 본문의 ‘유다 왕들의 역대기 책’은 충분히 명확합니다.
  issues:
  - severity: medium
    issue: ‘사적’의 현대어상 모호성 및 각주 문구의 비한국어 표현
