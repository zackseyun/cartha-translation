revisions:
- from: 제사장들은 각기 자기 후원자에게서 받게 하십시오. 그리고 그들은 그 집의 훼손된 곳을 보수해야 합니다[b], 곧 그곳에서 발견되는 모든 훼손을 말입니다.
  to: 제사장들은 저마다 자기 후원자에게서 받아야 합니다[a]. 그리고 그 집에 훼손된 곳이 발견되는 곳마다 그것을 보수해야 합니다[b].
  rationale: ‘각기’의 분배 의미는 ‘저마다’로 보존했습니다. 수령의 대상은 본문의 문맥적 해석인 ‘후원자’를 유지하되 어휘적 대안을 각주에 명시했습니다. 마지막 절은 훼손이 발견되는 모든 장소 또는 경우라는 범위를 ‘훼손된 곳이 발견되는 곳마다’로 재구성하여, 원문의 반복된 בֶּדֶק과 수리 범위를 자연스러운 한국어로 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:07Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안의 ‘그곳에서 발견되는 모든 훼손을 말입니다’는 히브리어의 범위 표현(훼손이 발견되는 곳마다)을 부자연스러운 첨가 설명처럼 처리하며, ‘곧’은 원문에 없는 동격·해설 관계를 암시합니다. 또한 ‘후원자’는 מַכָּרוֹ의 문맥상 가능한 해석이지만, ‘아는 사람/거래 관계에 있는 사람’이라는 어휘적 여지를 각주로 밝혀야 합니다.
  naturalness: ‘받게 하십시오’ 뒤에 ‘그들은 … 해야 합니다’가 이어져 지시의 대상과 문체가 흔들립니다. ‘제사장들은 … 받아야 하며, … 보수해야 합니다’로 병렬된 의무 표현을 쓰면 현대 표준어 합쇼체로 자연스럽고 명료합니다.
  terminology: ‘제사장들’, ‘보수하다’, ‘그 집’은 적절합니다. ‘그 집’이 성전을 가리킨다는 문화적 각주는 유지합니다. מַכָּרוֹ를 본문에서 ‘후원자’로 옮길 경우, 더 직역적인 대안을 각주로 보존합니다.
  issues:
  - severity: medium
    issue: 마지막 절의 범위 표현이 ‘곧 … 말입니다’라는 설명절로 바뀌었습니다.
    rationale: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק은 훼손이 발견되는 모든 곳/경우에 수리를 시행하라는 범위를 나타냅니다. 동격 설명으로 처리하지 말고 ‘훼손된 곳이 발견되는 곳마다’로 옮기는 것이 충실합니다.
  - severity: medium
    issue: מַכָּרוֹ의 어휘적 모호성에 대한 각주가 없습니다.
    rationale: 문맥상 ‘후원자’는 가능하지만, 이 낱말은 ‘아는 사람’ 또는 관계를 맺은 사람을 뜻할 수도 있습니다. 영어 감사 기록의 lexical alternative에 맞추어 각주를 추가해야 합니다.
  - severity: low
    issue: 첫 문장의 지시 표현과 다음 문장의 서술적 의무 표현이 혼재합니다.
    rationale: ‘받게 하십시오’와 ‘보수해야 합니다’를 같은 문장 안에서 병렬하면 한국어 문체가 매끄럽지 않습니다. 두 동사를 ‘해야 합니다’로 맞추면 지시적 의미를 유지하면서 합쇼체 문체가 안정됩니다.
