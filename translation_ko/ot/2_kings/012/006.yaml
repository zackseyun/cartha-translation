id: 2KI.12.6
reference: 2 Kings 12:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: יִקְח֤וּ לָ/הֶם֙ הַ/כֹּ֣הֲנִ֔ים אִ֖ישׁ מֵ/אֵ֣ת מַכָּר֑/וֹ וְ/הֵ֗ם יְחַזְּקוּ֙ אֶת בֶּ֣דֶק הַ/בַּ֔יִת לְ/כֹ֛ל אֲשֶׁר יִמָּצֵ֥א שָׁ֖ם בָּֽדֶק־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/006.yaml
  text: Let the priests take for themselves[a], each man from his donor, and let them repair the damage of the house[b], wherever any damage is found there.
  footnotes:
  - marker: a
    text: Or 'from his acquaintance.' The Hebrew term can refer more literally to someone known to him, but in this collection context it likely means the person from whom each priest received contributions.
    reason: lexical_alternative
  - marker: b
    text: '''The house'' here refers to the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 제사장들은 저마다 자기 후원자에게서 받아야 합니다[a]. 그리고 그 집에 훼손된 곳이 발견되는 곳마다 그것을 보수해야 합니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘후원자’는 문맥에 따른 번역입니다. 히브리어는 더 문자적으로 ‘자기가 아는 사람’ 또는 ‘자기와 관계를 맺은 사람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘그 집’은 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 사제들
  - 성직자들
  lexicon: HALOT
  rationale: 성전 문맥에서 הַכֹּהֲנִים은 제사장들을 가리키므로, 한국어에서는 표준적인 ‘제사장들’이 가장 직접적입니다.
- source_word: אִישׁ
  english_pob_choice: each man
  chosen_korean: 각기
  alternatives_korean:
  - 각 사람
  - 각자
  lexicon: HALOT
  rationale: 복수 주어 뒤의 אִישׁ는 분배적 의미이므로, 한국어에서는 자연스럽게 ‘각기’로 풀어 각 제사장마다 따로 해당됨을 나타냈습니다.
- source_word: מֵאֵת מַכָּרוֹ
  english_pob_choice: from his donor
  chosen_korean: 자기 후원자에게서
  alternatives_korean:
  - 자기 아는 사람에게서
  - 자기 교제 상대에게서
  - 자기 기부자에게서
  lexicon: HALOT
  rationale: 이 구절은 헌금/모금 문맥이므로 관계적 뜻의 ‘아는 사람’보다 실제 제공자를 뜻하는 ‘후원자’가 의미를 더 분명히 드러냅니다.
- source_word: יְחַזְּקוּ
  english_pob_choice: repair
  chosen_korean: 보수해야 합니다
  alternatives_korean:
  - 수리해야 합니다
  - 견고하게 해야 합니다
  - 고쳐야 합니다
  lexicon: HALOT
  rationale: 동사의 기본 뜻은 ‘강하게 하다’이지만 건축물 보수 문맥에서는 ‘보수하다/수리하다’가 가장 적절합니다.
- source_word: בֶּדֶק הַבַּיִת
  english_pob_choice: the damage of the house
  chosen_korean: 그 집의 훼손된 곳
  alternatives_korean:
  - 그 집의 손상
  - 그 집의 보수할 곳
  - 그 집의 틈
  lexicon: HALOT
  rationale: בֶּדֶק은 ‘손상, 결함, 보수할 부분’의 뜻을 가지므로, 대상의 상태를 드러내는 ‘훼손된 곳’으로 옮겼습니다. ‘집’은 히브리어의 직역을 살렸고 문맥상 성전을 가리킵니다.
- source_word: לְכֹל אֲשֶׁר יִמָּצֵא שָׁם בָּדֶק
  english_pob_choice: wherever any damage is found there
  chosen_korean: 그곳에서 발견되는 모든 훼손을 말입니다
  alternatives_korean:
  - 거기에서 발견되는 모든 손상을
  - 거기서 보이는 모든 결함을
  - 어디서든 발견되는 모든 훼손을
  lexicon: HALOT
  rationale: 범위를 제한하지 않는 ‘어디서나/발견되는 모든’의 의미를 살리되, 한국어에서는 뒤의 설명절로 자연스럽게 연결했습니다.
theological_decisions:
- issue: הַבַּיִת의 지시 대상
  chosen_reading: ‘그 집’은 성전을 가리키는 표현으로 이해하되, 본문에서는 히브리어의 표면적 표현을 유지했습니다.
  alternative_readings:
  - 본문에 ‘성전’을 직접 넣는 번역
  - ‘여호와의 집’으로 확장하는 번역
  rationale: 열왕기 문맥에서 ‘집’은 성전을 뜻하지만, 원문은 פשוט히 ‘집’이라고 하므로 본문은 직역을 유지하고 의미는 문맥으로 드러내는 편이 원문 충실합니다.
  doctrine_reference: 문맥상 성전 지시
