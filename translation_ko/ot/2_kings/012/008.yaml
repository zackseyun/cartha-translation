  verdict: revise
  source_fidelity: 전반적으로 왕이 제사장들에게 성전 보수 재정을 돌리라고 명하는 뜻을 충실히 전달합니다. 다만 מַכָּרֵיכֶם는 문맥상 기부자들로 이해할 수 있으나 어휘적으로 난해하므로, ‘후원자들’보다 ‘기부자들’이 금전 수수 문맥에 더 직접적입니다. תִּתְּנֻהוּ의 목적어는 앞의 돈이므로 ‘그 돈’을 명시하는 것이 한국어에서 더 분명합니다.
  naturalness: 현대 한국어로 자연스럽지만, 지정된 합쇼체와 맞지 않게 인용문 안의 종결이 ‘-느냐/-아라’로 되어 있습니다. 질문과 명령을 각각 ‘-습니까?/-(으)십시오’로 고쳐야 합니다. 각주 표지도 해당 표현 바로 뒤에 두는 편이 독자가 주석의 대상을 알기 쉽습니다.
  terminology: ‘요아스’, ‘여호야다’, ‘제사장’, ‘성전’은 적절합니다. הַבַּיִת를 ‘성전’으로 풀어 쓴 것은 문맥상 안전하며, 히브리어의 ‘집’이라는 표현은 각주로 보완할 수 있습니다. בֶּדֶק הַבַּיִת에는 ‘파손된 곳’이 자연스럽고, 대안 번역은 각주에서 보존합니다.
