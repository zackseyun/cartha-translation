- from: 그래서 왕 요아스가 제사장 여호야다와 제사장들을 불러 그들에게 말했습니다. “어찌하여 너희는 성전의 훼손된 부분을 수리하지 않느냐? 이제는 너희의 후원자들로부터 돈을 받지 말고, 성전의 수리에 그것을 내놓아라.”[a][b][c]
  to: 그래서 요아스 왕이 제사장 여호야다와 제사장들을 불러 그들에게 말했습니다. “어찌하여 너희는 성전[a]의 파손된 곳[b]을 수리하지 않습니까? 이제는 너희의 기부자들[c]에게서 돈을 받지 말고, 그 돈을 성전 수리를 위해 내놓으십시오.”
