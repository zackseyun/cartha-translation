id: 2KI.12.8
reference: 2 Kings 12:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ הַ/מֶּ֨לֶךְ יְהוֹאָ֜שׁ לִ/יהוֹיָדָ֤ע הַ/כֹּהֵן֙ וְ/לַ/כֹּ֣הֲנִ֔ים וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם מַדּ֛וּעַ אֵינְ/כֶ֥ם מְחַזְּקִ֖ים אֶת בֶּ֣דֶק הַ/בָּ֑יִת וְ/עַתָּ֗ה אַל תִּקְחוּ כֶ֨סֶף֙ מֵ/אֵ֣ת מַכָּֽרֵי/כֶ֔ם כִּֽי לְ/בֶ֥דֶק הַ/בַּ֖יִת תִּתְּנֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/008.yaml
  text: So King Jehoash called Jehoiada the priest and the priests and said to them[a], “Why are you not repairing the damage of the house? Now then, do not take money from your donors[c][b], but give it for the repair of the house.”
  footnotes:
  - marker: a
    text: Hebrew 'the house,' referring to the temple.
    reason: cultural_note
  - marker: b
    text: Or 'the repairs of the house' / 'the breaches of the house' for 'the damage of the house.'
    reason: lexical_alternative
  - marker: c
    text: The Hebrew term rendered 'donors' is difficult; alternatives include 'contributors' or, more literally, 'those known to you.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 요아스 왕이 제사장 여호야다와 제사장들을 불러 그들에게 말했습니다. “어찌하여 너희는 성전[a]의 파손된 곳[b]을 수리하지 않습니까? 이제는 너희의 기부자들[c]에게서 돈을 받지 말고, 그 돈을 성전 수리를 위해 내놓으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘집’은 여기서 성전을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘집의 수리’ 또는 ‘집의 틈새들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 용어는 난해하며, ‘기여자들’ 또는 더 직역하면 ‘너희가 아는 이들’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 호출하여
  lexicon: HALOT
  rationale: 서사 문맥에서 왕이 제사장들을 불러들이는 동작을 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: בֶּדֶק הַבָּיִת
  english_pob_choice: the damage of the house
  chosen_korean: 성전의 훼손된 부분
  alternatives_korean:
  - 성전의 손상
  - 성전의 파손된 곳
  - 집의 훼손
  lexicon: HALOT
  rationale: בדק은 단순한 ‘수리’보다 손상·갈라짐·훼손을 가리킬 수 있으므로, 수리 대상이 되는 손상 부위를 드러내는 표현으로 옮겼습니다.
- source_word: מֵאֵת מַכָּרֵיכֶם
  english_pob_choice: from your donors
  chosen_korean: 너희의 후원자들로부터
  alternatives_korean:
  - 너희의 아는 사람들로부터
  - 너희의 기부자들로부터
  - 너희의 제공자들로부터
  lexicon: HALOT
  rationale: 어휘가 난해하지만 성전 보수 자금 문맥상 금전을 내는 이들을 가리키는 말로 이해되어, 현대 한국어에서 자연스러운 ‘후원자들’로 옮겼습니다.
- source_word: תִּתְּנֻהוּ
  english_pob_choice: give it
  chosen_korean: 그것을 내놓아라
  alternatives_korean:
  - 그것을 주어라
  - 그것을 바쳐라
  - 그것을 넘겨라
  lexicon: HALOT
  rationale: 지시 대화 안에서 금전의 용도를 전환하라는 뜻을 분명히 하기 위해, 단순한 ‘주다’보다 목적 전환의 뉘앙스를 살린 표현을 선택했습니다.
theological_decisions:
- issue: 성전(temple) 지칭을 ‘집’으로 둘지 ‘성전’으로 풀지 여부
  chosen_reading: 본문의 הַבָּיִת는 직역하면 ‘집’이지만, 이 문맥에서는 예루살렘 성전을 가리키므로 본문에는 ‘성전’으로 풀었습니다.
  alternative_readings:
  - 집
  - 그 집
  rationale: 영어 POB는 본문에서는 ‘house’를 유지하되 주석으로 성전 의미를 밝혔습니다. 한국어에서는 오해를 줄이기 위해 본문의 실제 지시 대상을 드러냈습니다.
  doctrine_reference: 문맥적 지시 대상 해명
- issue: ‘후원자들’ 표현의 해석
  chosen_reading: מַכָּרֵיכֶם는 단순한 인간관계보다 금전 제공자들을 가리키는 말로 이해했습니다.
  alternative_readings:
  - 너희가 아는 사람들
  - 너희의 지인들
  - 너희가 아는 이들
  rationale: 성전 보수 재정 문맥에서 ‘지인’보다 자금 제공자의 의미가 더 적절하므로, 난해한 어휘의 문맥적 의미를 따라 번역했습니다.
  doctrine_reference: 문맥 우선 원칙
