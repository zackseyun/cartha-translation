translation:
  language: ko
  text: 그것은 일하는 사람들에게 주었고, 그것으로 야훼의 집을 수리했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘야훼의 집’ 곧 성전을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  english_pob_choice: for
  chosen_korean: 그것은
  alternatives_korean:
  - 왜냐하면
  - 그것은 그래서
  lexicon: HALOT
  rationale: 문맥상 앞절의 이유를 설명하는 연결이지만, 한국어에서는 전면에 내세운 설명 접속사보다 이어지는 서술을 자연스럽게 받는 방식이 더 간결합니다.
- source_word: לְעֹשֵׂי הַמְּלָאכָה
  english_pob_choice: to those doing the work
  chosen_korean: 일하는 사람들에게
  alternatives_korean:
  - 그 일을 하는 사람들에게
  - 일꾼들에게
  lexicon: HALOT
  rationale: 히브리어 분사구를 한국어의 자연스러운 지시 대상으로 옮겼습니다. ‘일꾼’도 가능하지만, 문맥상 공사 인부를 지나치게 직역하기보다 중립적인 표현이 적절합니다.
- source_word: וְחִזְּקוּ
  english_pob_choice: they repaired
  chosen_korean: 수리했습니다
  alternatives_korean:
  - 보강했습니다
  - 튼튼하게 했습니다
  - 보수했습니다
  lexicon: HALOT
  rationale: 기본 의미는 ‘강하게 하다’이지만 건축 문맥에서는 손상된 것을 고치고 보강하는 뜻이므로, 현대 한국어에서 가장 직접적인 ‘수리했습니다’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집/성전
  lexicon: HALOT
  rationale: POB의 본문 결정인 ‘Yahweh’를 한국어로 일관되게 ‘야훼’로 옮겼습니다. 히브리어의 ‘집’(בַּיִת) 이미지를 유지하기 위해 ‘성전’보다 직역에 가까운 ‘집’을 본문에 두었습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 본문에서는 야훼를 사용합니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 나타난 신명사יהוה를 POB의 기준에 따라 음역해, 언약 이름 자체를 드러내는 방향을 따랐습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
