  source_fidelity: 개정이 필요합니다. כִּי는 앞절에서 회계 보고를 요구하지 않은 이유를 설명하는 접속사인데, 초안의 ‘그것은’은 이를 지시대명사로 바꾸어 인과 관계를 잃습니다. 또한 יִתְּנֻהוּ의 목적어 접미사 ‘그것을’이 본문에서 빠져 있습니다.
  naturalness: ‘이는 그들이 … 주었고’는 현대 표준 한국어 합쇼체에서 앞 문맥의 이유를 자연스럽고 명확하게 잇습니다. ‘그 일을 하는 사람들’은 막연한 ‘일하는 사람들’보다 הַמְּלָאכָה(그 공사/업무)를 더 잘 반영합니다.
  terminology: ‘야훼의 집’은 בֵּית יְהוָה의 표현을 보존하며, ‘수리했습니다’는 건축 문맥의 וְחִזְּקוּ에 적절합니다. 각주에서는 ‘성전을 뜻합니다’라고 단정하기보다 원문의 직역과 문맥상 의미를 구별해야 합니다.
