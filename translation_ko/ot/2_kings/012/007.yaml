source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁנַ֨ת עֶשְׂרִ֧ים וְ/שָׁלֹ֛שׁ שָׁנָ֖ה לַ/מֶּ֣לֶךְ יְהוֹאָ֑שׁ לֹֽא חִזְּק֥וּ הַ/כֹּהֲנִ֖ים אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/007.yaml
  text: Now it happened in the twenty-third year of King Jehoash that the priests had not repaired the damage to the house[a].
  footnotes:
  - marker: a
    text: Or 'the breaches of the house.' Here 'house' refers to the temple.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야스 왕의 스물셋째 해에 제사장들이 집의 손상된 부분을 수리하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집의 틈새들’입니다. 여기서 ‘집’은 성전을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now it happened
  chosen_korean: …했습니다
  alternatives_korean:
  - …이 있었습니다
  - …되었습니다
  lexicon: WLC/HALOT
  rationale: 서술 전환 표지로서의 wayyiqtol을 한국어에서는 자연스러운 과거 서술로 옮기고, 불필요한 직역 어감을 피했습니다.
- source_word: בִּשְׁנַת עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  english_pob_choice: in the twenty-third year
  chosen_korean: 스물셋째 해에
  alternatives_korean:
  - 이십삼 년에
  - 스물세 해에
  lexicon: WLC/HALOT
  rationale: 히브리어 왕년 표준 공식을 한국어 관용에 맞게 서수로 옮겼습니다.
- source_word: לַמֶּלֶךְ יְהוֹאָשׁ
  english_pob_choice: of King Jehoash
  chosen_korean: 여호야스 왕
  alternatives_korean:
  - 여호야스 왕의
  - 여호야스 왕에게 속한
  lexicon: WLC/HALOT
  rationale: 왕년 기준점을 나타내는 לְ+왕 공식은 한국어에서 소유격보다 시간 기준 표지로 처리하는 것이 자연스럽습니다.
- source_word: לֹא חִזְּקוּ הַכֹּהֲנִים אֶת בֶּדֶק הַבָּיִת
  english_pob_choice: the priests had not repaired the damage to the house
  chosen_korean: 제사장들이 집의 손상된 부분을 수리하지 않았습니다
  alternatives_korean:
  - 제사장들이 집의 틈새를 보수하지 않았습니다
  - 제사장들이 성전의 파손을 고치지 않았습니다
  lexicon: WLC/HALOT
  rationale: חזק은 여기서 구조물의 수리·보수를 뜻하므로 ‘수리하다’로 옮겼고, בֶּדֶק הַבָּיִת은 ‘손상된 부분’으로 풀어 한국어에서 뜻이 분명하게 드러나게 했습니다.
