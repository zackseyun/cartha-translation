  rationale: 유다 왕의 한국어 관용형 이름은 요아스가 가장 널리 통용되므로 이를 따랐습니다.
- source_word: הַכֹּהֲנִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
