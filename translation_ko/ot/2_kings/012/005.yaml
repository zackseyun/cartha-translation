  - 프리스트들
  lexicon: BDB
  rationale: 성전 문맥의 제사장 직분을 표준 한국어 성경 용어인 제사장들로 옮겼습니다.
- source_word: כֹּל כֶּסֶף הַקֳּדָשִׁים
  english_pob_choice: all the money of the holy things
  chosen_korean: 모든 거룩한 것의 כסף
  alternatives_korean:
  - 모든 성물의 돈
  - 모든 거룩한 것들의 כסף
  - 모든 거룩한 예물의 כסף
  lexicon: HALOT
  rationale: 문장의 구성상 ‘거룩한 것들과 관련된 כסף’라는 소유구조를 유지해야 하므로, 의미를 지나치게 좁히지 않는 방향으로 옮겼습니다.
- source_word: כֶּסֶף עוֹבֵר אִישׁ
  english_pob_choice: the money from each man who is counted
  chosen_korean: 계수된 각 사람의 כסף
  alternatives_korean:
  - 각 사람이 지나가는 כסף
  - 등록된 각 남자의 כסף
  - 계수받는 각 남자의 כסף
  lexicon: HALOT
  rationale: POB가 채택한 인구조사 관련 의미를 반영해 ‘계수된’으로 옮겨, 단순한 ‘지나감’의 직역보다 문맥적 의미를 분명하게 했습니다.
- source_word: כֶּסֶף נַפְשׁוֹת עֶרְכּוֹ
  english_pob_choice: the money of the valuation of persons
  chosen_korean: 사람의 속량 가치의 כסף
  alternatives_korean:
  - 사람의 평가액의 כסף
  - 인적 평가의 כסף
  - 서원한 사람들의 속량 כסף
  lexicon: HALOT
  rationale: 평가·속량 관련 제의적 금액이라는 점을 살리되, 한국어 독자가 이해할 수 있도록 ‘가치’라는 표현으로 압축했습니다.
- source_word: כָּל כֶּסֶף אֲשֶׁר יַעֲלֶה עַל לֶב אִישׁ
  english_pob_choice: all the money that comes up on a man’s heart
  chosen_korean: 그리고 야훼의 집으로 가져오고자 마음에 떠오르는 모든 כסף
  alternatives_korean:
  - 사람의 마음에 올라오는 모든 כסף
  - 누구든 마음먹어 가져오려는 모든 כסף
  - 사람의 마음에 떠오르는 모든 כסף
  lexicon: HALOT
  rationale: ‘마음에 올라오다’라는 히브리어 관용구를 유지하면서, 자원적 기부 의도를 드러내도록 한국어로 자연스럽게 옮겼습니다.
