revisions:
- from: 요아스가 제사장들에게 말했습니다. 「야훼의 집으로 들어오는 모든 거룩한 것의 כסף—곧 계수된 각 사람의 כסף, 사람의 속량 मूल्य의 כסף, 그리고 야훼의 집으로 가져오고자 마음에 떠오르는 모든 כסף—」[a][b][c]
  to: 요아스가 제사장들에게 말했습니다. “야훼의 집으로 들어오는 모든 성물에 관한 은, 곧 계수되는 각 사람의 은[a], 사람들의 평가액에 따른 은[b], 그리고 어떤 사람의 마음에 떠올라 야훼의 집으로 가져오는 모든 은[c]을 받으십시오.”
  rationale: 미번역 외국 문자들을 모두 한국어로 번역했습니다. כסף는 이 성전 재정 문맥에서 ‘은’으로 옮겼고, קֳדָשִׁים은 ‘성물’로 처리했습니다. ‘속량’을 제거하고 ‘평가액’으로 고쳐 원문의 압축성과 해석상 여지를 보존했습니다. 세 각주 표지를 해당 어구 바로 뒤로 옮겼습니다. 원문이 인용문을 다음 절까지 이어 가는 구조이지만, 한국어 본문이 독립 구절로 제시되어 있으므로 앞 절의 명령을 보충한 ‘받으십시오’를 넣어 한국어 문장으로 완결했습니다.
  reviewer_model: gpt-5.6-terra
