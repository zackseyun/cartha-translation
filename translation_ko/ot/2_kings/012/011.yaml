    rationale: 번역문은 ‘여호와’를 사용하지만, 제공된 lexical/theological 결정은 프로젝트 본문 표기의 원칙을 ‘야훼’로 명시하며 현 선택의 정합성 검토가 필요하다고 적고 있습니다.
  - severity: medium
    issue: 목적어의 반복 및 수식 범위 분리
    rationale: 원문에서 ‘여호와의 집에서 발견된 은’은 묶는 행위와 세는 행위에 함께 걸립니다. 초안처럼 두 번 나누어 쓰면 ‘그 은’과 ‘발견된 은’이 별개의 은처럼 읽힐 여지가 있고 한국어 문장도 어색합니다.
  - severity: low
    issue: נִמְצָא의 번역
    rationale: ‘찾아낸’은 행위자를 암시하지만, 히브리어 분사는 ‘발견된/있는’의 수동적 상태를 나타냅니다.
