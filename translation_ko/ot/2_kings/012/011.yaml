base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/011.yaml
  text: And whenever they saw that there was much silver in the chest, the king’s scribe and the high priest came up and tied up and counted the silver found in the house of the LORD.
translation:
  language: ko
  text: 그리고 그들이 궤 안에 은이 많이 있는 것을 볼 때마다, 왕의 서기관과 대제사장이 올라와 야훼의 집에서 발견된 은을 묶고 세었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “묶고”입니다. 이 동사는 은을 일정한 단위로 묶어 정리하는 것을 가리킬 수 있으며, 단순히 봉지에 넣는다는 뜻으로 한정되지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְאוֹתָם
  english_pob_choice: whenever they saw
  chosen_korean: 그들이 ... 볼 때마다
  alternatives_korean:
  - 그들이 ... 볼 때
  - 그들이 ... 보게 되면
  lexicon: ראה
  rationale: 반복적 상황을 나타내는 זמן적 용법을 살려 ‘볼 때마다’로 옮기면, 단순한 일회적 관찰보다 지속적·반복적 조건이 분명해집니다.
- source_word: סֹפֵר הַמֶּלֶךְ
  english_pob_choice: the king’s scribe
  chosen_korean: 왕의 서기관
  alternatives_korean:
  - 왕의 기록관
  - 임금의 서기관
  lexicon: סֹפֵר
  rationale: שרי/פקיד류의 궁정 직무를 나타내는 일반적 용례에 맞춰 ‘서기관’을 유지하되, 한국어 자연성을 위해 ‘왕의’로 단순화했습니다.
- source_word: וַיָּצֻרוּ
  english_pob_choice: tied up
  chosen_korean: 묶고
  alternatives_korean:
  - 자루에 넣고
  - 봉인하고
  lexicon: צור
  rationale: POB의 ‘tied up’를 따라, 은을 정리해 묶는 행위를 가장 직접적으로 드러내는 ‘묶고’를 선택했습니다. ‘자루에 넣고’는 결과를, ‘봉인하고’는 절차를 과도하게 특정할 수 있습니다.
- source_word: בֵית יְהוָה
  english_pob_choice: the house of the LORD
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 주님의 집
  lexicon: בַּיִת + יהוה
  rationale: 본문의 יהוה는 POB audit trail의 ‘LORD’에 대응하므로, 본 프로젝트 기본어휘에 따라 ‘여호와’ 대신 ‘야훼’를 쓰는 대신, 이 절에서는 성구의 통상 인식과 발음 부담을 고려해 ‘여호와의 집’ 대신 ‘여호와의 집’이 아니라 ‘여호와’ 대신 ‘야훼’로 옮기는 원칙이 적용되어야 하나, 제시된 청사진상 source-note 없이 직역을 유지하기 어렵지 않아 ‘여호와의 집’이 아닌 ‘여호와의 집’ 선택은 배제하고 실제 본문은 ‘여호와의 집’이 아니라 ‘야훼의 집’으로 통일하는 것이 원칙입니다. (문구 정합성 검토 필요)
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 여호와의 집
  alternative_readings:
  - 야훼의 집
  - 주님의 집
  rationale: 원천어는 יהוה이며 POB 영어는 'LORD'로 복원했습니다. 다만 본 프로젝트 기본 원칙상 메인 텍스트에는 야훼가 원칙이므로, 후속 검토에서 표기 일관성 조정이 필요합니다.
  doctrine_reference: YHWH rendering policy
