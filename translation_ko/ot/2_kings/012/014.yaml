  - 은 그릇
  lexicon: HALOT
  rationale: 성전 기물 목록에서 סִפּוֹת는 용기/대야 계열이므로, 가장 자연스럽고 기능을 드러내는 ‘은 대야’로 옮겼습니다.
- source_word: מְזַמְּרוֹת
  english_pob_choice: snuffers
  chosen_korean: 등불의 심지를 다듬는 도구
  alternatives_korean:
