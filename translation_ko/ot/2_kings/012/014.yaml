  lexicon: HALOT
  rationale: 본문은 여호와의 집이라는 고정된 성전 표현을 반복하므로, 한국어 성경 독자에게 널리 알려진 전통 표기를 유지했습니다. 다만 원문 자체는 신적 고유명사입니다.
- source_word: סִפּוֹת כֶּסֶף
  english_pob_choice: silver basins
  chosen_korean: 은 대야
  alternatives_korean:
  - 은 바리
  - 은 그릇
  lexicon: HALOT
  rationale: 성전 기물 목록에서 סִפּוֹת는 용기/대야 계열이므로, 가장 자연스럽고 기능을 드러내는 ‘은 대야’로 옮겼습니다.
- source_word: מְזַמְּרוֹת
  english_pob_choice: snuffers
  chosen_korean: 등불의 심지를 다듬는 도구
  alternatives_korean:
  - 심지 가위
  - 심지 다듬개
  lexicon: HALOT
  rationale: 문맥상 등불 관리용 도구라는 기능을 드러내되, 정확한 형태가 확정적이지 않은 점을 반영해 너무 단정적인 고유 명칭은 피했습니다.
- source_word: מִזְרָקוֹת
  english_pob_choice: sprinkling bowls
  chosen_korean: 뿌리는 대야
  alternatives_korean:
  - 뿌림 대야
  - 제사용 대야
  lexicon: HALOT
  rationale: 단순한 ‘그릇’보다 제의적 사용 기능이 드러나도록 ‘뿌리는 대야’로 옮겼습니다.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  english_pob_choice: any vessel of gold or vessel of silver
  chosen_korean: 금 그릇이나 은 그릇도
  alternatives_korean:
  - 금으로 된 그릇이나 은으로 된 그릇도
  - 금·은 그릇도
  lexicon: HALOT
  rationale: כְּלִי의 넓은 의미를 살려 반복 구조를 자연스러운 한국어 목록으로 정리하되, ‘어떤 금 그릇/은 그릇도’의 배제 의미를 유지했습니다.
theological_decisions:
