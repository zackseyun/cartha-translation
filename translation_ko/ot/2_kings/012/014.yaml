  - 심지 다듬개
  lexicon: HALOT
  rationale: 문맥상 등불 관리용 도구라는 기능을 드러내되, 정확한 형태가 확정적이지 않은 점을 반영해 너무 단정적인 고유 명칭은 피했습니다.
- source_word: מִזְרָקוֹת
  english_pob_choice: sprinkling bowls
  chosen_korean: 뿌리는 대야
  alternatives_korean:
  - 뿌림 대야
  - 제사용 대야
  lexicon: HALOT
  rationale: 단순한 ‘그릇’보다 제의적 사용 기능이 드러나도록 ‘뿌리는 대야’로 옮겼습니다.
- source_word: כָּל כְּלִי זָהָב וּכְלִי כָסֶף
  english_pob_choice: any vessel of gold or vessel of silver
  chosen_korean: 금 그릇이나 은 그릇도
  alternatives_korean:
