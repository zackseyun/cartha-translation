source:
  edition: WLC
  text: אַךְ֩ לֹ֨א יֵעָשֶׂ֜ה בֵּ֣ית יְהוָ֗ה סִפּ֥וֹת כֶּ֨סֶף֙ מְזַמְּר֤וֹת מִזְרָקוֹת֙ חֲצֹ֣צְר֔וֹת כָּל כְּלִ֥י זָהָ֖ב וּ/כְלִי כָ֑סֶף מִן הַ/כֶּ֖סֶף הַ/מּוּבָ֥א בֵית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/014.yaml
  text: However[a], from the money brought into the house of Yahweh there were not made for the house of Yahweh silver basins, snuffers, sprinkling bowls, trumpets[c][b], or any vessel of gold or vessel of silver.
  footnotes:
  - marker: a
    text: Or 'silver bowls' for 'silver basins.'
    reason: lexical_alternative
  - marker: b
    text: Or 'trimmers' for 'snuffers.' The Hebrew term likely refers to an implement used in tending lamps.
    reason: lexical_alternative
  - marker: c
    text: Or simply 'bowls' for 'sprinkling bowls.' The fuller rendering makes the likely ritual function explicit.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 여호와의 집에 들여온 돈으로는 여호와의 집을 위해 은 대야[a], 등불 심지 다듬개[b], 뿌림 대야[c], 나팔, 또는 금 그릇이나 은 그릇을 만들지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은 사발’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘심지 다듬개’로 옮길 수 있습니다. 이 히브리어는 등불을 손질하는 도구를 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 단순히 ‘대야’로 옮길 수 있습니다. ‘뿌림 대야’는 그 제의적 기능을 드러낸 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: However
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 다만
  lexicon: HALOT
  rationale: 앞절의 내용과 대비되는 전환을 자연스럽게 나타내는 한국어 역접 접속사로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 여호와
  alternatives_korean:
