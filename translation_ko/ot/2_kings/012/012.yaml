  yaml_path: translation/ot/2_kings/012/012.yaml
  text: And they gave the weighed-out silver into the hand of the workmen who were appointed over the house of Yahweh[c][b][a], and they paid it out to the carpenters and the builders who were working on the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the measured silver' or 'the counted money.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'into the hand of.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH, traditionally rendered this way in English.
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 무게를 달아 둔 은[a]을 야훼의 집 일을 맡도록 임명된 작업자들의 손에[b] 맡겼고, 그 작업자들은 그것을 야훼의 집 공사에 종사하는 목수들과 건축자들에게 지급했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘측량한 은’, ‘계산된 돈’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘손에’입니다. 이는 맡기거나 위임한다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 יְהוָה는 하나님의 고유명사이며, 여기서는 ‘야훼’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: הַכֶּסֶף הַמְתֻכָּן
  english_pob_choice: the weighed-out silver
  chosen_korean: 정제한 은
  alternatives_korean:
  - 달아낸 은
  - 무게를 잰 은
  - 계산된 은
  lexicon: HALOT
  rationale: 문맥상 성전 수리 자금을 분배하는 장면이므로, ‘weighed-out silver’의 의미를 살리되 한국어에서는 자연스럽게 ‘정제한 은’으로 옮겨 측정·확정된 자금임을 드러냈습니다.
- source_word: עַל יַד
  english_pob_choice: into the hand of
  chosen_korean: '...들의 손에 달아준'
  alternatives_korean:
  - '...에게'
  - '...의 관리 아래'
  - '...의 손으로'
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 위임·인수의 뉘앙스를 보존했습니다. 한국어에서는 ‘달아주다’로 처리해 문맥상 지급·인도를 자연스럽게 표현했습니다.
- source_word: הַפְּקֻדִים בֵּית יְהוָה
  english_pob_choice: who were appointed over the house of Yahweh
  chosen_korean: 야훼의 집 일에 임명된 일꾼들
  alternatives_korean:
  - 야훼의 집을 감독하도록 세운 사람들
  - 야훼의 집에 배정된 사람들
  lexicon: HALOT
  rationale: 수리 작업을 맡은 자들이라는 점과 ‘appointed over’의 관리 책임을 함께 살리기 위해 ‘일에 임명된 일꾼들’로 옮겼습니다.
- source_word: לְחָרָשֵׁי הָעֵץ וְלַבֹּנִים
  english_pob_choice: to the carpenters and the builders
  chosen_korean: 목수들과 건축자들에게
  alternatives_korean:
  - 목수들과 쌓는 사람들에게
  - 목공들과 돌쌓는 이들에게
  lexicon: HALOT
  rationale: 목재 작업자와 건축 작업자를 가리키는 가장 자연스러운 현대어를 사용했습니다. ‘builders’를 지나치게 좁히지 않기 위해 ‘건축자들’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 고유한 신명사 יְהוָה는 본 프로젝트 기준에 따라 ‘야훼’로 음역하여, 전통적 대체표현인 ‘주’로 바꾸지 않았습니다.
theological_decisions:
- issue: 이 절에서 יְהוָה를 어떻게 표기할 것인가
  chosen_reading: 야훼
  alternative_readings:
