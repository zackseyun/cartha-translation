  to: 그들은 무게를 달아 둔 은[a]을 야훼의 집 일을 맡도록 임명된 작업자들의 손에[b] 맡겼고, 그 작업자들은 그것을 야훼의 집 공사에 종사하는 목수들과 건축자들에게 지급했습니다.[c]
