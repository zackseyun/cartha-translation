  - 주님
  - 여호와
  rationale: 본문이 신명사 עצמו를 사용하므로, 하나님의 언약 이름을 직역 대체하지 않고 표기해 원문이 주는 고유성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
