source:
  edition: WLC
  text: וַ/יִּקַּ֞ח יְהוֹאָ֣שׁ מֶֽלֶךְ יְהוּדָ֗ה אֵ֣ת כָּל הַ/קֳּדָשִׁ֡ים אֲשֶׁר הִקְדִּ֣ישׁוּ יְהוֹשָׁפָ֣ט וִ/יהוֹרָם֩ וַ/אֲחַזְיָ֨הוּ אֲבֹתָ֜י/ו מַלְכֵ֤י יְהוּדָה֙ וְ/אֶת קֳדָשָׁ֔י/ו וְ/אֵ֣ת כָּל הַ/זָּהָ֗ב הַ/נִּמְצָ֛א בְּ/אֹצְר֥וֹת בֵּית יְהוָ֖ה וּ/בֵ֣ית הַ/מֶּ֑לֶךְ וַ/יִּשְׁלַ֗ח לַֽ/חֲזָאֵל֙ מֶ֣לֶךְ אֲרָ֔ם וַ/יַּ֖עַל מֵ/עַ֥ל יְרוּשָׁלִָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/019.yaml
  text: Then Jehoash king of Judah took all the holy things that Jehoshaphat, Jehoram, and Ahaziah, his fathers, the kings of Judah, had dedicated, along with his own holy things, and all the gold found in the treasuries of the house of Yahweh and of the king’s house, and sent it to Hazael king of Aram; so he went up away from Jerusalem.
  footnotes:
  - marker: a
    text: Or, 'and he withdrew from Jerusalem.' The Hebrew literally says, 'and he went up from upon Jerusalem,' an idiom indicating that Hazael ceased his advance against the city.
    reason: lexical_alternative
  - marker: b
    text: '''His fathers'' means his royal forefathers or ancestors.'
    reason: cultural_note
translation:
  language: ko
  text: 유다 왕 요아스는 여호사밧과 여호람과 아하시야, 곧 유다 왕들인 그의 조상들이 바친 모든 성물과 자기의 성물, 그리고 야훼의 집과 왕궁의 곳간에서 찾은 모든 금을 가져다가 아람 왕 하사엘에게 보냈습니다. 그 뒤 하사엘은 예루살렘에서 물러갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그가 예루살렘 위로부터 올라갔다’입니다. 문맥상 하사엘이 예루살렘에서 물러난 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֳּדָשִׁים / קֳדָשָׁיו
  english_pob_choice: the holy things / his own holy things
  chosen_korean: 성물 / 자기의 성물
  alternatives_korean:
  - 거룩한 물건들 / 그의 거룩한 물건들
  - 봉헌물 / 자기의 봉헌물
  lexicon: HALOT
  rationale: קדש 어근의 성전 헌납 맥락을 살리면서도 한국어에서 자연스럽고, 앞뒤 두 표현의 대응도 보이도록 ‘성물’로 옮겼습니다.
- source_word: הִקְדִּישׁוּ
  english_pob_choice: had dedicated
  chosen_korean: 바친
  alternatives_korean:
  - 헌납한
  - 구별하여 바친
  lexicon: HALOT
  rationale: 왕들의 행위가 성전용으로 따로 떼어 둔 헌납 행위라는 점을 간명하게 드러내는 동사로 ‘바친’을 택했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 이 본문은 여호와/야훼의 집을 가리키는 직접 표현이므로, 프로젝트 기본값에 따라 ‘야훼’를 유지하고 ‘집’이라는 히브리식 표현도 살렸습니다.
- source_word: וַיַּעַל מֵעַל יְרוּשָׁלִָם
  english_pob_choice: so he went up away from Jerusalem
  chosen_korean: 그러자 그는 예루살렘에서 물러갔습니다
  alternatives_korean:
  - 그러자 그는 예루살렘에서 올라갔습니다
  - 그러자 그는 예루살렘에서 철수했습니다
  lexicon: HALOT
  rationale: עלה + מעל 예루살렘은 단순 이동보다 압박을 멈추고 물러남을 뜻하므로, 영어 주석의 의미를 따라 ‘물러갔습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나온 신명사 표기를 프로젝트 기본값에 따라 ‘야훼’로 유지해, 언약 이름의 식별성을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
