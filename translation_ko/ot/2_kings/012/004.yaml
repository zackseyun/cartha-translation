  text: However[a], the high places were not removed; the people still were sacrificing and burning incense on the high places.
  footnotes:
  - marker: a
    text: Or 'the shrines were not removed'; Hebrew 'the high places' refers to local elevated worship sites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그런데 산당들은 제거되지 않았습니다. 백성은 여전히 산당에서 제사를 드리고 향을 피웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산당’은 지역의 높은 곳에 세운 예배 장소를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: However
  chosen_korean: 그런데
  alternatives_korean:
  - 다만
  - 그러나
  - 오직
  lexicon: HALOT
  rationale: 앞선 긍정적 평가를 잇되 예외를 드러내는 전환어로는 현대 한국어에서 자연스러운 ‘그런데’가 적절합니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 산 위의 제단들
  - 산당
  lexicon: HALOT
  rationale: בָּמוֹת는 단순한 지형이 아니라 지역적 예배 장소를 가리키므로, 한국어 성경에서 익숙한 ‘산당’이 원뜻과 관용성을 함께 살립니다.
- source_word: לֹא סָרוּ
  english_pob_choice: were not removed
  chosen_korean: 제거되지 않았습니다
  alternatives_korean:
  - 옮겨지지 않았습니다
  - 없어지지 않았습니다
  - 치워지지 않았습니다
  lexicon: HALOT
  rationale: 주어가 산당이므로 실제 의미는 ‘그곳이 그대로 남아 있었다’는 뜻입니다. ‘제거되지 않았습니다’가 가장 직접적으로 그 상태를 드러냅니다.
- source_word: מְקַטְּרִים
  english_pob_choice: burning incense
  chosen_korean: 향을 피웠습니다
  alternatives_korean:
  - 분향했습니다
  - 향을 태웠습니다
  - 연기를 올렸습니다
  lexicon: HALOT
  rationale: 제의적 동사 קטר는 문맥상 분향을 가리키며, 현대 한국어에서는 ‘향을 피우다’가 가장 자연스럽고 구체적입니다.
theological_decisions:
- issue: 산당 예배에 대한 서술을 설명으로 확장할지 여부
  chosen_reading: 본문의 진술만 유지하고, 산당을 본문 안에서 별도로 비난하거나 풀이하지 않았습니다.
  alternative_readings:
  - 산당은 제거되지 않았습니다. 백성은 여전히 불법 제의 장소에서 제사를 드리고 분향했습니다.
  - 산당들은 제거되지 않았습니다. 백성은 여전히 거기서 제사를 드리고 향을 피웠습니다.
  rationale: 히브리어 본문은 현황을 보고할 뿐이며, 신학적 평가는 문맥에서 드러납니다. 번역 본문에 해설을 덧붙이지 않고 역사적·종교적 긴장을 그대로 보존합니다.
  doctrine_reference: 원문 우선 번역 원칙; 서술과 해설의 구분 유지
