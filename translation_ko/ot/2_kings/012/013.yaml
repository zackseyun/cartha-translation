base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
  footnotes:
  - marker: a
    text: Or 'builders' for 'masons.' The Hebrew term may refer more broadly to those doing masonry or wall-repair work.
    reason: lexical_alternative
  - marker: b
    text: Or 'hewn stone' or 'cut stone.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'to strengthen the damage/breach of the house of the LORD.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'for all that goes out on the house,' that is, all expenses incurred for its repair.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 석공들[a]과 돌을 캐는 사람들에게 주고, 목재와 채석한 돌[b]을 사서 야훼의 집에서 손상된 곳[c]을 보수하고, 그 집을 보수하는 데 드는 모든 비용[d]에 썼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘석공들’은 문맥상 벽을 쌓거나 보수하는 일을 하는 사람들까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘채석한 돌’은 ‘다듬은 돌’ 또는 ‘깎은 돌’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어를 직역하면 ‘야훼의 집의 파손을 견고하게 하다’입니다. 여기서는 파손된 곳을 보수한다는 뜻입니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘그 집 위로 나가는 모든 것’으로, 그 집을 보수하기 위해 지출되는 모든 비용을 뜻합니다.
    reason: lexical_alternative
