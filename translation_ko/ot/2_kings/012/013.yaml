source:
  edition: WLC
  text: וְ/לַ/גֹּֽדְרִים֙ וּ/לְ/חֹצְבֵ֣י הָ/אֶ֔בֶן וְ/לִ/קְנ֤וֹת עֵצִים֙ וְ/אַבְנֵ֣י מַחְצֵ֔ב לְ/חַזֵּ֖ק אֶת בֶּ֣דֶק בֵּית יְהוָ֑ה וּ/לְ/כֹ֛ל אֲשֶׁר יֵצֵ֥א עַל הַ/בַּ֖יִת לְ/חָזְקָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/013.yaml
  text: and for the masons[a], and for the stonecutters, and to buy timber and quarried stone to repair the damage of the house of Yahweh[d][c][b], and for all that is spent on the house to repair it.
  footnotes:
  - marker: a
    text: Or 'builders' for 'masons.' The Hebrew term may refer more broadly to those doing masonry or wall-repair work.
    reason: lexical_alternative
  - marker: b
    text: Or 'hewn stone' or 'cut stone.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'to strengthen the damage/breach of the house of the LORD.'
    reason: lexical_alternative
  - marker: d
    text: Literally 'for all that goes out on the house,' that is, all expenses incurred for its repair.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 석공들과 돌을 다듬는 사람들을 위해서, 또 목재와 다듬은 돌을 사서 야훼의 집의 훼손된 곳을 보수하고, 집을 위해 나가는 모든 비용을 위해서였습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘석공들’은 문맥상 벽돌공·보수공까지 아우를 수 있는 넓은 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘다듬은 돌’은 ‘채석한 돌’ 또는 ‘깎은 돌’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘집의 훼손/균열을 강하게 하기 위해’이지만, 한국어에서는 ‘보수하다’가 문맥상 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: d
    text: 직역하면 ‘집에 대해 나가는 모든 것’으로, 곧 보수에 들어가는 모든 경비를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּדְרִים
  english_pob_choice: masons
  chosen_korean: 석공들
  alternatives_korean:
  - 건축자들
  - 담을 쌓는 사람들
  lexicon: HALOT
  rationale: 성전 보수 문맥에서 גדר 계열을 단순한 ‘건축자’보다 돌·벽 공사에 종사하는 사람으로 구체화한 영어 POB의 취지를 살려 ‘석공들’로 옮겼습니다.
- source_word: חֹצְבֵי הָאֶבֶן
  english_pob_choice: stonecutters
  chosen_korean: 돌을 다듬는 사람들
  alternatives_korean:
  - 돌깎는 사람들
  - 돌을 채석하는 사람들
  lexicon: HALOT
  rationale: 직역형 ‘돌을 깎는 사람들’도 가능하지만, 한국어에서는 공사용 돌을 다루는 인력이라는 기능이 더 분명하도록 ‘돌을 다듬는 사람들’로 자연화했습니다.
- source_word: אַבְנֵי מַחְצֵב
  english_pob_choice: quarried stone
  chosen_korean: 다듬은 돌
  alternatives_korean:
  - 채석한 돌
  - 채석 돌
  lexicon: HALOT
  rationale: 마חצֵב의 채석소 의미를 반영해야 하지만, 한국어 문맥에서는 ‘목재와 다듬은 돌’이 건축 자재 병렬로 자연스럽고 원문의 자재 목록 기능을 잘 드러냅니다.
- source_word: בֶּדֶק
  english_pob_choice: the damage
  chosen_korean: 훼손된 곳
  alternatives_korean:
  - 갈라진 곳
  - 틈
  - 파손
  lexicon: HALOT
  rationale: בֶּדֶק은 틈·파손·손상의 의미를 갖는데, ‘훼손된 곳’이 건물의 손상 부위를 가리키는 문맥을 가장 무리 없이 전달합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
  rationale: 프로젝트 기본 원칙에 따라 신명은 대체 호칭이 아니라 음역형 ‘야훼’로 옮겨, ‘야훼의 집’이라는 원문 표지를 보존했습니다.
- source_word: וּלְכֹל אֲשֶׁר יֵצֵא עַל הַבַּיִת
  english_pob_choice: and for all that is spent on the house
  chosen_korean: 집을 위해 나가는 모든 비용
  alternatives_korean:
  - 집에 들어가는 모든 비용
  - 집에 쓰이는 모든 경비
  lexicon: HALOT
  rationale: ‘나가다’의 관용적 용법을 비용 지출로 풀어, 회계 항목처럼 보이는 원문의 의미를 현대 한국어로 분명하게 전달했습니다.
theological_decisions:
- issue: 여호와 신명 표기
  chosen_reading: 본문에서는 ‘야훼’로 표기하여 성전이 누구의 집인지 분명히 드러냅니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 이 구절은 야훼의 집의 보수 비용을 말하므로, 신명 대체어보다 고유명 표기가 원문과 주제 의도를 더 직접적으로 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
