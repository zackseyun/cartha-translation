  text: In the seventh year of Jehu, Jehoash became king, and he reigned forty years in Jerusalem. His mother’s name was Zibiah of Beersheba.
translation:
  language: ko
  text: 예후의 칠년째에 요아스가 왕이 되었고, 예루살렘에서 사십 년 동안 다스렸습니다. 그의 어머니의 이름은 브엘세바 출신 지비아였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת שֶׁבַע לְיֵהוּא
  english_pob_choice: In the seventh year of Jehu
  chosen_korean: 예후의 칠년째에
  alternatives_korean:
  - 예후의 칠년 되는 해에
  - 예후의 칠 년에
  lexicon: HALOT
  rationale: 히브리어 관용의 연대 표지로, 왕의 재위 기준점을 자연스럽게 드러내기 위해 ‘…의 칠년째에’로 옮겼습니다.
- source_word: מָלַךְ יְהוֹאָשׁ
  english_pob_choice: Jehoash became king
  chosen_korean: 요아스가 왕이 되었고
  alternatives_korean:
  - 요아스가 다스리기 시작했고
  - 요아스가 왕위에 올랐고
  lexicon: HALOT
  rationale: 여기서는 즉위 개시를 말하므로, 단순한 재위보다 왕위 획득의 시작을 분명히 하는 ‘왕이 되다’를 택했습니다.
- source_word: וְאַרְבָּעִים שָׁנָה מָלַךְ
  english_pob_choice: and he reigned forty years
  chosen_korean: 사십 년 동안 다스렸습니다
  alternatives_korean:
  - 사십 년 동안 통치했습니다
  - 사십 년을 재위했습니다
  lexicon: HALOT
  rationale: משך 기간을 나타내는 מָלַךְ는 한국어에서 ‘다스리다/통치하다’가 자연스럽고, 이어지는 기간 표현과도 잘 맞습니다.
- source_word: מִבְּאֵר שָׁבַע
  english_pob_choice: of Beersheba
  chosen_korean: 브엘세바 출신
  alternatives_korean:
  - 브엘세바에서 온
  - 브엘세바 사람
  lexicon: HALOT
  rationale: 출신지 표지인 מִן을 인물 식별문맥에 맞게 ‘출신’으로 옮겨, 단순한 이동 출발보다 기원을 드러냈습니다.
