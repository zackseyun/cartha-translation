id: 2KI.12.9
reference: 2 Kings 12:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּאֹ֖תוּ הַ/כֹּֽהֲנִ֑ים לְ/בִלְתִּ֤י קְחַת כֶּ֨סֶף֙ מֵ/אֵ֣ת הָ/עָ֔ם וּ/לְ/בִלְתִּ֥י חַזֵּ֖ק אֶת בֶּ֥דֶק הַ/בָּֽיִת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/012/009.yaml
  text: But the priests agreed not to take money from the people and not to repair the damage of the house[a][b].
  footnotes:
  - marker: a
    text: Or, more literally, 'not to strengthen the damage of the house,' an idiom meaning to repair the temple's damage.
    reason: lexical_alternative
  - marker: b
    text: '''House'' here refers to the house of the LORD, that is, the temple.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 제사장들은 백성에게서 돈을 받지 않고 성전의 훼손된 곳을 수리하지 않기로 동의했습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘성전의 훼손을 강하게 하지 않다’에 가까우며, 여기서는 ‘수리하다/보수하다’는 관용적 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘집’은 야훼의 집, 곧 성전을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּאֹתוּ
  english_pob_choice: agreed
  chosen_korean: 동의했습니다
  alternatives_korean:
  - 승낙했습니다
  - 받아들였습니다
  - 뜻을 같이했습니다
  lexicon: HALOT
  rationale: אבה 계열 동사는 여기서 ‘기꺼이 받아들여 동의하다’는 뜻이므로, 현대 한국어로는 ‘동의했습니다’가 가장 자연스럽고 정확합니다.
- source_word: לְבִלְתִּי קְחַת כֶּסֶף מֵאֵת הָעָם
  english_pob_choice: not to take money from the people
  chosen_korean: 백성에게서 돈을 받지 않고
  alternatives_korean:
  - 백성에게서 כסף를 취하지 않고
  - 백성에게서 은전을 받지 않고
  - 백성에게서 돈을 거두지 않고
  lexicon: HALOT
  rationale: כֶּסֶף는 문맥상 단순한 ‘은’보다 ‘돈’이 자연스럽고, לְבִלְתִּי와 부정 동사구는 ‘-지 않고’로 옮기면 합쇼체 서술에 잘 맞습니다.
- source_word: וּלְבִלְתִּי חַזֵּק אֶת בֶּדֶק הַבָּיִת
  english_pob_choice: and not to repair the damage of the house
  chosen_korean: 성전의 훼손된 곳을 수리하지 않기로
  alternatives_korean:
  - 성전의 손상된 부분을 보수하지 않기로
  - 성전의 파손을 고치지 않기로
  - 성전의 훼손을 강화하지 않기로
  lexicon: HALOT
  rationale: חזק의 기본 뜻은 ‘강하게 하다’지만, בֶּדֶק הַבָּיִת 관용구에서는 ‘수리하다/보수하다’의 의미이므로 이를 살려 ‘수리하지 않기로’로 옮겼습니다.
- source_word: בֶּדֶק הַבָּיִת
  english_pob_choice: the damage of the house
  chosen_korean: 성전의 훼손된 곳
  alternatives_korean:
  - 성전의 손상
  - 성전의 균열
  - 그 집의 훼손
  lexicon: HALOT
  rationale: ‘house’는 이 문맥에서 성전을 가리키므로 본문에는 의미를 풀어 ‘성전’이라 하고, בֶּדֶק은 단순 추상명사보다 실제 보수 대상인 ‘훼손된 곳’으로 구체화했습니다.
theological_decisions:
- issue: ‘house’의 지시 대상
  chosen_reading: 본문의 ‘house’는 야훼의 집, 곧 성전을 뜻합니다.
  alternative_readings:
  - 일반적인 집
  - 왕궁의 건물
  - 비유적 집
  rationale: 직전 영어 주석과 본문 맥락상 כאן의 ‘house’는 성전을 가리키므로, 한국어 본문에서는 오해를 막기 위해 ‘성전’으로 드러냈습니다.
  doctrine_reference: 성전 용례 해석
