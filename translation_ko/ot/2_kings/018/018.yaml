  to: 그들이 왕을 불렀습니다.[a] 그러자 왕실을 맡은 힐기야의 아들 엘리야김이 그들에게 나왔고, 서기관 셉나[c]와 기록관 아삽의 아들 요아[d]가 함께했습니다.[b]
  rationale: 단수 동사의 주어를 엘리야김으로 바로잡고, 셉나와 요아를 그와 함께 나온 관리들로 표현했습니다. 또한 원문에 있는 요아의 직함을 복원했습니다. ‘왕을 불렀습니다’는 קרא אל의 가능한 의미 범위를 보존하면서 해당 장면에 자연스러운 현대 표준어 합쇼체입니다. 각 주석 표지는 해당 본문 표현에 직접 붙였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:16Z'
