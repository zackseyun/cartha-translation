  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יִּקְרְאוּ֙ אֶל הַ/מֶּ֔לֶךְ וַ/יֵּצֵ֧א אֲלֵ/הֶ֛ם אֶלְיָקִ֥ים בֶּן חִלְקִיָּ֖הוּ אֲשֶׁ֣ר עַל הַ/בָּ֑יִת וְ/שֶׁבְנָה֙ הַ/סֹּפֵ֔ר וְ/יוֹאָ֥ח בֶּן אָסָ֖ף הַ/מַּזְכִּֽיר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/018.yaml
  text: And they called for the king[a], and Eliakim son of Hilkiah, who was over the household, came out to them, along with Shebna the scribe and Joah son of Asaph[c][b], the recorder.
  footnotes:
  - marker: a
    text: Or 'went out to them.'
    reason: lexical_alternative
  - marker: b
    text: '''Who was over the household'' is an administrative title; alternatively, ''who was over the palace.'''
    reason: cultural_note
  - marker: c
    text: Or 'the secretary' for 'the scribe.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 왕에게 외쳤습니다. 그러자 힐기야의 아들 엘리야김—궁정을 맡은 자—과 서기관 셉나와 아삽의 아들 요아가 나와 그들에게 갔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘왕에게 외쳤습니다’는 קרא + אֶל의 직접적 뉘앙스를 살린 번역입니다. 문맥상 ‘왕을 불렀습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘궁정을 맡은 자’는 ‘집을 맡은 자’의 직역보다 왕실 행정 관직임을 더 분명히 드러냅니다.
    reason: cultural_note
  - marker: c
    text: ‘서기관’은 공문서 작성과 기록을 맡는 관직을 가리키는 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל הַמֶּלֶךְ
  english_pob_choice: they called for the king
  chosen_korean: 왕에게 외쳤습니다
  alternatives_korean:
  - 왕을 불렀습니다
  - 왕에게 불렀습니다
  - 왕을 찾았습니다
  lexicon: HALOT
  rationale: קרא + אֶל은 단순한 호출보다 상대를 향해 소리쳐 부르는 뜻을 가질 수 있어, 이 장면의 긴박한 외침을 살려 ‘외쳤습니다’로 옮겼습니다.
- source_word: אֲשֶׁר עַל הַבָּיִת
  english_pob_choice: who was over the household
  chosen_korean: 궁정을 맡은 자
  alternatives_korean:
  - 왕궁을 맡은 자
  - 집안을 맡은 자
  - 궁정의 책임자
  lexicon: HALOT
  rationale: בַּיִת의 직무용법은 가정집보다 왕실 행정 구역을 가리키는 경우가 자연스러워, 직함의 기능을 드러내는 ‘궁정을 맡은 자’로 옮겼습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 서기
  - 필경관
  lexicon: HALOT
  rationale: סֹפֵר는 공문서·행정 기록을 담당하는 관직이므로, 현대 한국어에서 그 직무를 비교적 분명히 드러내는 ‘서기관’을 택했습니다.
- source_word: הַמַּזְכִּיר
  english_pob_choice: the recorder
  chosen_korean: 요아
  alternatives_korean:
  - 기록관
  - 기록 담당자
  - 사관
  lexicon: HALOT
  rationale: 이 단어는 조정의 기록 담당 관직을 가리키므로 인명과 구별되도록 직함은 본문에서 ‘그들에게 갔습니다’ 앞에 별도 설명으로 처리하지 않고, 인명 구조를 그대로 유지했습니다.
theological_decisions:
- issue: 직함 표현의 행정적 성격
  chosen_reading: 두 관직 모두 왕실 행정 직무를 가리키는 표현으로 옮기되, 현대 독자가 이해할 수 있게 직무 중심으로 전달했습니다.
  alternative_readings:
  - 가문/집안 중심의 표현으로 번역
  - 전통 교회어풍의 직함으로 고정
  rationale: 본문은 신학적 비유가 아니라 앗수르 사신 앞에 나온 왕실 관리들의 공식 직함을 나열하므로, 행정적 기능이 드러나는 번역이 가장 충실합니다.
  doctrine_reference: 본문 맥락의 역사서 서술 원칙
