  source_fidelity: 현 번역은 וַיֵּצֵא(단수)의 주어가 엘리야김 한 사람임을 복수로 바꾸었고, הַמַּזְכִּיר(기록 담당 왕실 관리)이라는 요아의 직함을 누락했습니다. 또한 ‘나와 그들에게 갔습니다’는 ‘나오다’와 ‘가다’를 중복하여 원문의 간결한 이동 동사를 과도하게 풀어냅니다.
  naturalness: ‘왕에게 외쳤습니다’는 가능하기는 하나, 이 외교적 장면에서 왕의 출현을 요청하는 뜻에는 ‘왕을 불렀습니다’가 현대 한국어로 더 자연스럽고 중립적입니다. 수정문은 인물들의 역할과 동행 관계를 자연스럽게 드러냅니다.
  terminology: ‘서기관’은 הַסֹּפֵר에 적절합니다. אֲשֶׁר עַל הַבָּיִת는 왕실 행정의 고위 직책이므로 ‘왕실을 맡은’으로 옮기고, הַמַּזְכִּיר는 누락하지 않고 ‘기록관’으로 번역했습니다. 인명은 엘리야김, 힐기야, 셉나, 요아, 아삽으로 유지했습니다.
