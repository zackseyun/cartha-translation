- from: 내가 가서 너희를 너희 땅과 같은 땅으로 데려갈 때까지, 곧 곡식과 새 포도주의 땅, 떡과 포도원의 땅, 감람유와 꿀의 땅으로 데려갈 것이니, 너희가 살아서 죽지 않게 하려는 것입니다. 히스기야의 말을 듣지 마십시오. 그는 너희를 잘못 이끌며 이렇게 말합니다. 「야훼께서 우리를 건져 주실 것입니다.」[a]
  to: 내가 와서 너희를 너희 땅과 같은 땅, 곧 곡식과 새 포도주의 땅, 떡과 포도원의 땅, 감람유와 꿀의 땅으로 데려갈 때까지 그렇게 하십시오. 그러면 너희는 살고 죽지 않을 것입니다. 히스기야의 말을 듣지 마십시오. 그는 너희를 잘못 이끌면서 이렇게 말합니다. 「야훼께서 우리를 건져 주실 것입니다.」
  rationale: 원문의 עַד בֹּאִי וְלָקַחְתִּי를 ‘내가 와서 … 데려갈 때까지’로 복원했습니다. 이 절은 앞 절의 권고에 문법적으로 이어지므로, 한국어에서 시간 절을 완결하기 위해 ‘그렇게 하십시오’를 보충하되 그 행동의 구체적 내용을 새로 규정하지 않았습니다. וִחְיוּ וְלֹא תָמֻתוּ는 문맥상 권고의 결과를 나타내므로 ‘그러면 너희는 살고 죽지 않을 것입니다’로 옮겼습니다. 기존 각주는 해당 낱말에 연결되지 않고 번역상 필수적이지 않아 삭제했습니다.
