source:
  edition: WLC
  text: עַד בֹּאִ/י֩ וְ/לָקַחְתִּ֨י אֶתְ/כֶ֜ם אֶל אֶ֣רֶץ כְּ/אַרְצְ/כֶ֗ם אֶרֶץ֩ דָּגָ֨ן וְ/תִיר֜וֹשׁ אֶ֧רֶץ לֶ֣חֶם וּ/כְרָמִ֗ים אֶ֣רֶץ זֵ֤ית יִצְהָר֙ וּ/דְבַ֔שׁ וִֽ/חְי֖וּ וְ/לֹ֣א תָמֻ֑תוּ וְ/אַֽל תִּשְׁמְעוּ֙ אֶל חִזְקִיָּ֔הוּ כִּֽי יַסִּ֤ית אֶתְ/כֶם֙ לֵ/אמֹ֔ר יְהוָ֖ה יַצִּילֵֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/032.yaml
  text: until I come and take you away to a land like your own land[a], a land of grain and new wine, a land of bread and vineyards, a land of olive oil and honey, so that you may live and not die. And do not listen to Hezekiah, for he is misleading you by saying[b], ‘Yahweh will deliver us.’
  footnotes:
  - marker: a
    text: Or “a land of grain and wine”; “new wine” reflects the specific sense of תִּירוֹשׁ.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “a land of olive oil and honey,” with a compressed expression involving olive produce.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 와서 너희를 너희 땅과 같은 땅, 곧 곡식과 새 포도주의 땅, 떡과 포도원의 땅, 감람유와 꿀의 땅으로 데려갈 때까지 그렇게 하십시오. 그러면 너희는 살고 죽지 않을 것입니다. 히스기야의 말을 듣지 마십시오. 그는 너희를 잘못 이끌면서 이렇게 말합니다. 「야훼께서 우리를 건져 주실 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד בֹּאִי
  english_pob_choice: until I come
  chosen_korean: 내가 가서 …까지
  alternatives_korean:
  - 내가 올 때까지
  - 내가 도착할 때까지
  lexicon: HALOT
  rationale: בוא의 1인칭 미래를 자연스럽게 살리되, 문맥상 ‘도착’보다 직접적인 ‘가다/오다’ 표현이 맞아 ‘내가 가서 …까지’로 옮겼습니다.
- source_word: וְלָקַחְתִּי אֶתְכֶם
  english_pob_choice: and take you away
  chosen_korean: 너희를 … 데려갈 것이니
  alternatives_korean:
  - 너희를 데리고 갈 것이니
  - 너희를 끌고 갈 것이니
  lexicon: HALOT
  rationale: 포로로 옮겨 가는 강제성을 드러내면서도, 지나치게 현대적이거나 거친 어감은 피하기 위해 ‘데려가다’를 사용했습니다.
- source_word: אֶרֶץ דָּגָן וְתִירוֹשׁ
  english_pob_choice: a land of grain and new wine
  chosen_korean: 곡식과 새 포도주의 땅
  alternatives_korean:
  - 곡식과 포도주의 땅
  - 곡물과 새 포도주의 땅
  lexicon: HALOT
  rationale: דגן은 넓게 곡식/곡물의 풍요를 가리키며, תירושׁ은 일반 포도주보다 ‘새 포도주’가 더 정확하므로 그 구별을 살렸습니다.
- source_word: אֶרֶץ זֵית יִצְהָר וּדְבַשׁ
  english_pob_choice: a land of olive oil and honey
  chosen_korean: 감람유와 꿀의 땅
  alternatives_korean:
  - 올리브기름과 꿀의 땅
  - 감람나무와 기름과 꿀의 땅
  lexicon: HALOT
  rationale: יִצְהָר는 압착한 감람유를 뜻하므로 ‘감람유’로 옮겨 압축된 히브리어 표현을 자연스럽게 살렸습니다.
- source_word: וְאַל תִּשְׁמְעוּ אֶל חִזְקִיָּהוּ
  english_pob_choice: And do not listen to Hezekiah
  chosen_korean: 히스기야의 말을 듣지 마십시오
  alternatives_korean:
  - 히스기야에게 귀를 기울이지 마십시오
  - 히스기야를 따르지 마십시오
  lexicon: HALOT
  rationale: שׁמע אֶל은 단순 청취보다 ‘귀 기울여 듣다/말을 듣다’의 의미이므로, 한국어에서는 가장 مستقیم한 관용인 ‘말을 듣다’로 옮겼습니다.
- source_word: כִּי יַסִּית אֶתְכֶם
  english_pob_choice: for he is misleading you
  chosen_korean: 그는 너희를 잘못 이끌며
  alternatives_korean:
  - 그는 너희를 미혹하며
  - 그는 너희를 부추기며
  lexicon: HALOT
  rationale: סות의 뜻인 ‘부추기다/유혹하다/잘못 이끌다’ 가운데, 이 발화의 정치적 선전·압박 맥락에는 ‘잘못 이끌다’가 과도한 종교적 어조 없이 잘 맞습니다.
theological_decisions:
- issue: 여호와의 이름 יְהוָה 처리
  chosen_reading: 본문과 직접적인 신명사형을 살려 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 지시적 호칭으로 대체하지 않고 고유한 언약명을 보존해야 한다는 POB 원칙에 따라, 전통적 치환어 대신 음역형을 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 히스기야의 말 인용부의 어조
  chosen_reading: 인용문 안의 야훼께서 주체가 되는 선언은 그대로 유지하고, 전반 서술은 합쇼체로 처리했습니다.
  alternative_readings:
  - 인용문까지 모두 평서형으로 통일
  - 간접화법으로 완화
  rationale: 본문의 설득·회유적 발화와 직접 인용을 분명히 보여 주어야 하므로, 바깥 서술은 공식체로, 인용은 원문의 직접화법을 유지했습니다.
  doctrine_reference: 서사/인용문 레지스터 보존 원칙
