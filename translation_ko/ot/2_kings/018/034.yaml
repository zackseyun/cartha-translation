id: 2KI.18.34
reference: 2 Kings 18:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אַיֵּה֩ אֱלֹהֵ֨י חֲמָ֜ת וְ/אַרְפָּ֗ד אַיֵּ֛ה אֱלֹהֵ֥י סְפַרְוַ֖יִם הֵנַ֣ע וְ/עִוָּ֑ה כִּֽי הִצִּ֥ילוּ אֶת שֹׁמְר֖וֹן מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/034.yaml
  text: Where are the gods of Hamath and Arpad? Where are the gods of Sepharvaim[a], Hena, and Ivvah? Have they delivered Samaria from my hand?
  footnotes:
  - marker: a
    text: 'Hebrew place-name spellings vary in English tradition: ''Ivvah'' is also rendered ''Avva'' or ''Ivvah/Avvah.'''
    reason: lexical_alternative
translation:
  language: ko
  text: “하맛과 아르밧의 신들은 어디 있느냐? 스발와임과 헤나와 이와의 신들은 어디 있느냐? 그들이 사마리아를 내 손에서 구해 냈느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 지명 표기는 전통에 따라 달라질 수 있으며, 여기서는 עוה의 자음을 따라 ‘이와’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  english_pob_choice: Where are
  chosen_korean: 어디 있느냐
  alternatives_korean:
  - 어디에 있느냐
  - 어디 있습니까
  lexicon: HALOT
  rationale: 부정문의 위치 질문을 한국어의 직접적인 도전·조롱형 질문으로 옮기되, 합쇼체를 유지했습니다.
- source_word: אֱלֹהֵי
  english_pob_choice: the gods of
  chosen_korean: 신들
  alternatives_korean:
  - 그 신들
  - ~의 신들
  lexicon: HALOT
  rationale: 지명들과 결합한 복수형을 문맥대로 ‘신들’로 풀어, 여러 도시의 수호신들을 겨냥한 조롱이라는 점을 드러냈습니다.
- source_word: סְפַרְוַיִם הֵנַע וְ/עִוָּה
  english_pob_choice: Sepharvaim, Hena, and Ivvah
  chosen_korean: 스발와임과 헤나와 이와
  alternatives_korean:
  - 세파르와임과 헤나와 이바
  - 스발와임과 헤나와 아바
  lexicon: HALOT
  rationale: 고유지명은 한국어 음역으로 옮겼고, 특히 עוה의 음가를 반영해 ‘이와’로 적었습니다.
- source_word: הִצִּילוּ
  english_pob_choice: delivered
  chosen_korean: 구해 냈느냐
  alternatives_korean:
  - 건져 냈느냐
  - 구원했느냐
  lexicon: HALOT
  rationale: 군사적·정치적 압박에서 ‘구출하다/건져 내다’의 뜻이므로, ‘구해 내다’가 가장 자연스럽고 원문의 도전적 뉘앙스를 살립니다.
- source_word: מִ/יָּדִי
  english_pob_choice: from my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 손에서부터
  - 내 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 압제를 행사하는 권력의 손이라는 구체적 이미지를 보존했습니다.
theological_decisions:
- issue: 무신론적 진술이 아니라 점령자 왕의 조롱을 어떻게 반영할 것인가
  chosen_reading: 본문의 화자는 정복당한 도시들의 신들이 사마리아를 구하지 못했다고 조롱하는 것으로 번역했습니다.
  alternative_readings:
  - ‘신들’ 대신 ‘우상들’로 해석해 평가적 표현을 넣는 방법
  - 마지막 질문을 평서문처럼 옮겨 단정하는 방법
  rationale: 히브리어는 실제로 여러 도시의 신들을 지칭하고 있으며, 본문은 그 효력을 인정하는 것이 아니라 조롱의 수사로 제시합니다. 평가어를 덧붙이지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 본문의 수사와 서술자의 신학적 평가를 구분하여, 텍스트가 말하는 바 이상을 덧붙이지 않음
