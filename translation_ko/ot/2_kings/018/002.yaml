theological_decisions:
- issue: 왕의 즉위와 통치 기간을 연속된 연대기 공식으로 제시하는 방식
  chosen_reading: ‘왕이 되었을 때’와 ‘다스렸습니다’로 구분해 즉위 시점과 재위 기간을 분명히 했습니다.
  alternative_readings:
  - ‘즉위했을 때’와 ‘통치했습니다’로 더 문어적으로 옮길 수 있습니다.
  - ‘왕으로서 다스렸습니다’라고 더 설명적으로 옮길 수 있습니다.
  rationale: 본문의 역사 서술 형식을 유지하면서도 한국어에서 즉위와 재위의 구분이 분명하게 읽히도록 했습니다.
  doctrine_reference: 역사 서술의 연대기적 정확성
- issue: ‘아비, 스가랴의 딸’이라는 계보 표기
  chosen_reading: 이름과 부계 표지를 그대로 두어 어머니의 신원을 간결하게 표시했습니다.
  alternative_readings:
  - ‘아비, 스가랴의 딸’
  - ‘아비라는 스가랴의 딸’
  rationale: 본문은 왕의 모친을 소개하는 공식적 계보 표기이므로, 과도한 해설 없이 원문의 구조를 보존했습니다.
  doctrine_reference: 본문의 계보·왕실 기록 형식
