  rationale: 본문은 신학적 해석보다 역사적 연대기 기능이 핵심이므로, 정보 구조를 보존하면서도 현대 독자가 바로 이해할 수 있게 했습니다.
  doctrine_reference: 역사서의 왕정 연대 공식
- issue: מָלַךְ의 도착적 의미
  chosen_reading: '''왕이 되었습니다''로 즉위 순간을 나타냈습니다.'
  alternative_readings:
  - '''다스렸습니다''로 통치 기간 중심으로 옮김'
  - '''즉위했습니다''로 더 공식적으로 옮김'
  rationale: POB의 영어 audit trail이 accession의 의미를 강조하므로, 통치 지속이 아니라 왕위에 오름을 드러내는 번역을 선택했습니다.
  doctrine_reference: 본문의 역사적 서술 의도
