  terminology: 인명은 통용 표기인 호세아, 엘라, 히스기야, 아하스를 사용했습니다. מָלַךְ는 이 문맥에서 즉위를 가리키므로 ‘왕이 되었습니다’를 유지했습니다.
  issues:
