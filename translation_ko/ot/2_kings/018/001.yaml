translation:
  language: ko
  text: 이스라엘 왕 엘라의 아들 호세아가 다스린 셋째 해에 유다 왕 아하스의 아들 히스기야가 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘즉위했습니다.’ 히브리어 동사는 이 왕정 연대 공식에서 히스기야가 왕위에 오른 것을 가리킵니다.
    reason: lexical_alternative
