theological_decisions:
- issue: 왕정 연대 공식의 서술 방식
  chosen_reading: 연대 표지와 즉위 사실을 하나의 매끄러운 한국어 문장으로 옮겼습니다.
  alternative_readings:
  - 직역적으로 '…의 셋째 해에 …가 왕이 되었습니다'를 더 분절해 옮김
