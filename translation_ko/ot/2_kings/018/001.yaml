  source_fidelity: 수정이 필요합니다. 초안은 호세아와 엘라의 부자 관계를 ‘호세아의 아들 엘라’로 뒤바꾸었고, ‘이스라엘 왕 호세아의 때에’는 히브리어의 ‘호세아 제삼년에’라는 연대 공식을 정확히 재현하지 못합니다. 선행 접속 서술 표지 וַיְהִי는 영어 POB 정리 이력과 같이 별도의 ‘이제’로 번역하지 않는 것이 적절합니다.
