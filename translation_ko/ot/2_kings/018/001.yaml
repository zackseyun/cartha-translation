  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בִּ/שְׁנַ֣ת שָׁלֹ֔שׁ לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל מָלַ֛ךְ חִזְקִיָּ֥ה בֶן אָחָ֖ז מֶ֥לֶךְ יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/001.yaml
  text: Now in the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
  footnotes:
  - marker: a
    text: Or, more formally, 'began to reign.' The Hebrew verb in this regnal formula marks Hezekiah's accession to the throne.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 호세아의 아들 엘라의 셋째 해에, 이스라엘 왕 호세아의 때에 유다 왕 아하스의 아들 히스기야가 왕이 되었습니다.ᵃ[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 더 문자적으로는 '즉위했습니다' 또는 '왕위에 올랐습니다'로 옮길 수 있습니다. 히브리어 동사는 여기서 통치 개시, 곧 즉위를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고
  - 그때
  lexicon: HALOT
  rationale: 새 장면으로 넘어가는 서술 전환을 자연스럽게 살리기 위해 '이제'를 택했습니다.
- source_word: בִּשְׁנַת שָׁלֹשׁ
  english_pob_choice: in the third year
  chosen_korean: 셋째 해에
  alternatives_korean:
  - 세 번째 해에
  - 제삼년에
  lexicon: HALOT
  rationale: 왕정 연대 표지의 관용적 표현을 현대 한국어로 간결하게 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 히브리어의 즉위/등극 의미를 분명히 드러내되, 현대 문체에서 자연스럽게 읽히도록 했습니다.
theological_decisions:
- issue: 왕정 연대 공식의 서술 방식
  chosen_reading: 연대 표지와 즉위 사실을 하나의 매끄러운 한국어 문장으로 옮겼습니다.
  alternative_readings:
  - 직역적으로 '…의 셋째 해에 …가 왕이 되었습니다'를 더 분절해 옮김
  - '''즉위했습니다''로만 옮겨 등극 뉘앙스를 강조'
  rationale: 본문은 신학적 해석보다 역사적 연대기 기능이 핵심이므로, 정보 구조를 보존하면서도 현대 독자가 바로 이해할 수 있게 했습니다.
  doctrine_reference: 역사서의 왕정 연대 공식
- issue: מָלַךְ의 도착적 의미
  chosen_reading: '''왕이 되었습니다''로 즉위 순간을 나타냈습니다.'
  alternative_readings:
  - '''다스렸습니다''로 통치 기간 중심으로 옮김'
  - '''즉위했습니다''로 더 공식적으로 옮김'
  rationale: POB의 영어 audit trail이 accession의 의미를 강조하므로, 통치 지속이 아니라 왕위에 오름을 드러내는 번역을 선택했습니다.
  doctrine_reference: 본문의 역사적 서술 의도
