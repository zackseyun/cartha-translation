    rationale: וַיְהִי는 서술 전환 기능을 하지만, 이 구절에서는 한국어의 명시적 시간 부사 ‘이제’로 옮길 필요가 없습니다. 이는 영어 POB의 최신 정리 이력과도 일치합니다.
