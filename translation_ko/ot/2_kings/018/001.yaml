  text: Now in the third year of Hoshea son of Elah[a], king of Israel, Hezekiah son of Ahaz became king of Judah.
  footnotes:
  - marker: a
    text: Or, more formally, 'began to reign.' The Hebrew verb in this regnal formula marks Hezekiah's accession to the throne.
