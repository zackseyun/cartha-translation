  text: אָמַ֨רְתָּ֙ אַךְ דְּבַר שְׂפָתַ֔יִם עֵצָ֥ה וּ/גְבוּרָ֖ה לַ/מִּלְחָמָ֑ה עַתָּה֙ עַל מִ֣י בָטַ֔חְתָּ כִּ֥י מָרַ֖דְתָּ בִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/020.yaml
  text: You say, ‘It is only a word of the lips’—but counsel and strength are for war. Now in whom have you trusted, that you have rebelled against me?
translation:
  language: ko
  text: 당신은 ‘그저 입술의 말일 뿐입니다’라고 말하지만, 전쟁에는 계략과 힘이 필요합니다. 이제 누구를 믿고서 나에게 반역하였습니까?[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘입술의 말’은 ‘빈말’이라는 뜻으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ דְּבַר שְׂפָתַיִם
  english_pob_choice: It is only a word of the lips
  chosen_korean: ‘그저 입술의 말일 뿐입니다’
  alternatives_korean:
  - ‘입술의 말에 불과합니다’
  - ‘말뿐입니다’
  lexicon: אַךְ / דְּבַר / שְׂפָתַיִם
  rationale: אַךְ의 제한·강조를 ‘그저’로, ‘word of the lips’를 직역해 상대의 발언을 빈말로 낮추는 뉘앙스를 살렸습니다.
- source_word: עֵצָה וּגְבוּרָה לַמִּלְחָמָה
  english_pob_choice: Counsel and strength are for war
  chosen_korean: 전쟁에는 계략과 힘이 필요합니다
  alternatives_korean:
  - 전쟁에는 모의와 힘이 있습니다
  - 전쟁에는 조언과 용기가 필요합니다
  lexicon: עֵצָה / גְבוּרָה / מִלְחָמָה
  rationale: עֵצָה는 단순한 ‘조언’보다 전쟁 수행을 위한 ‘계략/모의’에 가깝고, גְבוּרָה는 문맥상 ‘힘’으로 옮기는 것이 자연스럽습니다.
- source_word: בָּטַחְתָּ
  english_pob_choice: have you trusted
  chosen_korean: 믿고서
  alternatives_korean:
  - 의지하고서
  - 신뢰하고서
  lexicon: בטח
  rationale: ‘믿다/의지하다’ 모두 가능하지만, 왕이 외교·군사적 후원에 기대는 문맥을 드러내기 위해 ‘믿고서’를 택했습니다.
- source_word: מָרַדְתָּ בִּי
  english_pob_choice: you have rebelled against me
  chosen_korean: 나에게 반역하였습니까
  alternatives_korean:
  - 내게 대항하였습니까
  - 나를 배반하였습니까
  lexicon: מרד
  rationale: מרד의 반역·봉기 의미를 분명히 드러내기 위해 ‘반역하다’를 사용했습니다.
theological_decisions:
- issue: 히스기야의 항의적 수사와 직설적 2인칭 질문의 톤
  chosen_reading: 원문의 질책적 질문을 유지해, 단순 정보 질문이 아니라 정치적·군사적 도발을 드러내는 말투로 옮겼습니다.
  alternative_readings:
  - 부드러운 서술형으로 완화
  - 간접화법으로 재구성
  rationale: 본절은 협상 언어가 아니라 상대의 신뢰 대상을 추궁하는 왕의 도전 발언이므로, 직설적 질문형을 유지해야 합니다.
  doctrine_reference: 서사적 충돌의 화용론
- issue: ‘전쟁에는 계략과 힘’의 표현
  chosen_reading: ‘counsel and strength’의 병렬을 전쟁 수행 능력으로 이해해 ‘계략과 힘’으로 번역했습니다.
  alternative_readings:
  - ‘조언과 힘’
  - ‘모의와 능력’
  rationale: 문맥상 단순한 일반 조언이 아니라 전쟁을 위한 전략적 판단과 군사력이 대비되므로, 의미를 선명하게 살리는 방향이 적절합니다.
  doctrine_reference: 문맥우선 해석 원칙
