  text: And the king of Assyria exiled Israel to Assyria and settled them in Halah[a], and on the Habor, the river of Gozan[b], and in the cities of the Medes.
  footnotes:
  - marker: a
    text: Or 'deported Israel to Assyria and placed them in Halah, and by the Habor River, in Gozan, and in the cities of Media.'
    reason: lexical_alternative
  - marker: b
    text: '''Israel'' here refers to the northern kingdom and its people taken into exile.'
    reason: cultural_note
