  text: 앗수르 왕이 이스라엘을 앗수르로 유배시켜, 할라와 고산의 하볼 강가와 메대 사람들의 여러 성읍에 정착시켰습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
