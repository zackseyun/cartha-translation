  source_fidelity: 수정이 필요합니다. 본문은 지명 חֲלַח(Halah)를 ‘하랄’로 잘못 음역했으며, ‘고산 강의 하볼’은 하볼을 고산의 강으로 식별하는 히브리어 동격·속격 관계를 한국어에서 부자연스럽고 다소 혼동되게 전달합니다. 또한 וַיֶּגֶל은 단순 포획보다 강제 이주/유배를 뜻하므로 ‘유배시켜’가 더 정확합니다.
  naturalness: ‘할라와 고산의 하볼 강가와 메대 사람들의 여러 성읍에 정착시켰습니다’는 지명들의 병렬과 처소 표현을 자연스러운 현대 한국어로 전달합니다.
  terminology: ‘앗수르’, ‘이스라엘’, ‘고산’, ‘하볼’, ‘메대’는 통용되는 성서 지명·민족명 표기를 따릅니다. ‘정착시켰습니다’는 נוח/נחה의 사역적 정착 의미에 적절합니다.
