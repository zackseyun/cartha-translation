  text: 앗수르 왕이 이스라엘을 앗수르로 사로잡아 가서, 하랄과 고산 강의 하볼과 메대 사람들의 여러 성읍에 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 앗수르로 데려가서 하랄과 하볼 강가, 고산과 메대의 성읍들에 두었다’로 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘이스라엘’은 북이스라엘 왕국과 그 백성을 가리킵니다.
    reason: cultural_note
