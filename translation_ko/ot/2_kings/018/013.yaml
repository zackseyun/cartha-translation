  text: Now in the fourteenth year of King Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah and captured them.
translation:
  language: ko
  text: 히스기야 왕의 제십사년에는 앗시리아의 왕 산헤립이 올라와 유다의 모든 견고한 성읍들을 치고 그것들을 점령했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제십사년’은 왕의 즉위 연차를 가리키는 관용적 연대 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  english_pob_choice: Now in the fourteenth year
  chosen_korean: 히스기야 왕의 제십사년에는
  alternatives_korean:
  - 히스기야 왕의 열네째 해에는
  - 히스기야 왕 제십사년에는
  lexicon: HALOT
  rationale: 연대 표지를 한국어 서술 흐름에 맞게 ‘에는’으로 살리고, 왕의 통치 연차를 뜻하는 관용적 표현으로 옮겼습니다.
- source_word: סַנְחֵרִיב מֶלֶךְ אַשּׁוּר
  english_pob_choice: Sennacherib king of Assyria
  chosen_korean: 앗시리아의 왕 산헤립
  alternatives_korean:
  - 앗시리아 왕 산헤립
  - 산헤립 앗시리아 왕
  lexicon: 개역성서/현대 외래어 표기 관행
  rationale: 고유명사는 현대 외래어 표기법에 따라 산헤립으로 옮기고, 지배 영역은 속격으로 자연스럽게 연결했습니다.
- source_word: עַל כָּל עָרֵי יְהוּדָה הַבְּצֻרוֹת
  english_pob_choice: against all the fortified cities of Judah
  chosen_korean: 유다의 모든 견고한 성읍들을
  alternatives_korean:
  - 유다의 모든 요새화된 성읍들을
  - 유다의 모든 fortified 도시들을
  lexicon: HALOT
  rationale: הַבְּצֻרוֹת는 성채로 방비된 도시들을 가리키므로, 군사적 문맥에 맞는 ‘견고한 성읍들’로 옮겼습니다.
- source_word: וַיִּתְפְּשֵׂם
  english_pob_choice: and captured them
  chosen_korean: 그것들을 점령했습니다
  alternatives_korean:
  - 그것들을 사로잡았습니다
  - 그것들을 빼앗았습니다
  lexicon: HALOT
  rationale: 도시를 대상으로 한 정복 문맥이므로 단순한 ‘잡다’보다 군사적 결과를 분명히 하는 ‘점령하다’가 더 정확합니다.
