translation:
  language: ko
  text: 그는 야훼, 이스라엘의 하나님을 신뢰했습니다. 그 뒤로는 유다의 모든 왕들 가운데서도, 그보다 앞선 이들 가운데서도 그와 같은 이가 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘야훼’라고 직접 말합니다. 영어 POB는 표준 관행에 따라 ‘the LORD’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: בַּ/יהוָ֥ה
  english_pob_choice: in Yahweh / in the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: HALOT
  rationale: 히브리어 본문이 여호와의 이름(YHWH)을 직접 사용하므로, 표준 번역 관행 대신 고유명을 드러내는 ‘야훼’를 채택했습니다. 전치사 בְּ는 ‘신뢰하다’와 결합해 대상 표시가 되므로 본문에서는 자연스럽게 동사와 함께 처리했습니다.
- source_word: בָּטָח
  english_pob_choice: trusted
  chosen_korean: 신뢰했습니다
  alternatives_korean:
  - 믿었습니다
  - 의지했습니다
  lexicon: HALOT
  rationale: 동사 בּטח의 핵심 의미인 ‘신뢰하다/의지하다’를 살려, 단순한 감정보다 관계적 의탁을 나타내는 ‘신뢰했습니다’로 옮겼습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 주 하나님
  - 이스라엘 하나님
  lexicon: HALOT
  rationale: 구문상 ‘야훼’에 대한 동격 설명이므로, 한국어에서도 자연스럽게 ‘이스라엘의 하나님’으로 이어 주어 신적 명칭과 정체성을 함께 드러냈습니다.
- source_word: לֹא הָיָה כָמֹהוּ
  english_pob_choice: there was none like him
  chosen_korean: 그와 같은 이가 없었습니다
  alternatives_korean:
  - 그와 같은 자가 없었습니다
  - 그만한 이가 없었습니다
  lexicon: HALOT
  rationale: 히브리어의 비교 표현을 과장 없이 유지하면서, 현대 한국어에서 자연스럽고 품위 있는 부정 비교로 옮겼습니다.
- source_word: בְּכֹל מַלְכֵי יְהוּדָה ... וַאֲשֶׁר הָיוּ לְפָנָיו
  english_pob_choice: among all the kings of Judah, nor among those who were before him
  chosen_korean: 유다의 모든 왕들 가운데서도, 그보다 앞선 이들 가운데서도
  alternatives_korean:
  - 유다의 모든 왕들 중에서도, 그보다 আগে 있던 이들 중에서도
  - 유다의 모든 왕들과 그보다 앞선 이들 가운데서도
  lexicon: HALOT
  rationale: 두 비교 범위를 모두 살려 ‘가운데서도’로 반복해, 유다 왕들 전체와 그 이전 왕들까지 포함한 비교의 폭을 분명하게 했습니다.
theological_decisions:
