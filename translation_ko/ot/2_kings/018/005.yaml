  source_fidelity: 야훼와 이스라엘의 하나님의 동격, 신뢰의 대상, 그리고 히스기야와 견줄 왕이 후대와 선대에 없었다는 비교를 대체로 충실히 옮겼습니다. 다만 ‘그 뒤로는’은 시간의 계속을 다소 부자연스럽게 강조하고, 이어지는 ‘그보다 앞선 이들’과의 병렬 범위를 흐립니다.
