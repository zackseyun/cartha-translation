revisions:
- from: 그때 힐기야의 아들 엘리아김과 스브나와 요아가 랍사게에게 말했습니다. 「청하건대 당신의 종들에게 아람어로 말해 주십시오. 우리는 알아듣습니다. 그리고 성벽 위에 있는 백성의 귀에 들리도록 우리에게 유다 말로는 말하지 마십시오.」[a]
  to: 그때 힐기야의 아들 엘리야김과 셉나와 요아가 랍사게에게 말했습니다. 「청하건대 당신의 종들에게 아람어로 말해 주십시오. 우리는 알아듣습니다. 성벽 위에 있는 백성이 듣는 데서 우리에게 유다 말[a]로 말하지 마십시오.」
  rationale: 원문의 בְּאָזְנֵי הָעָם의 청각 범위를 목적절처럼 들릴 수 있는 표현 대신 ‘백성이 듣는 데서’로 옮겨 보존했습니다. 또한 통용 한국어 성경 인명 표기에 맞추고, 어휘 대안 각주를 ‘유다 말’에 직접 연결했습니다. 나머지 요청의 공손함, 외교적 자기낮춤, 언어명에 관한 역사적 모호성은 유지했습니다.
