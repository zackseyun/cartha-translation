id: 2KI.18.26
reference: 2 Kings 18:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶלְיָקִ֣ים בֶּן חִ֠לְקִיָּהוּ וְ/שֶׁבְנָ֨ה וְ/יוֹאָ֜ח אֶל רַב שָׁקֵ֗ה דַּבֶּר נָ֤א אֶל עֲבָדֶ֨י/ךָ֙ אֲרָמִ֔ית כִּ֥י שֹׁמְעִ֖ים אֲנָ֑חְנוּ וְ/אַל תְּדַבֵּ֤ר עִמָּ֨/נוּ֙ יְהוּדִ֔ית בְּ/אָזְנֵ֣י הָ/עָ֔ם אֲשֶׁ֖ר עַל הַ/חֹמָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/026.yaml
  text: Then Eliakim son of Hilkiah[a], and Shebna, and Joah said to the Rabshakeh, “Please speak to your servants in Aramaic, for we understand it. And do not speak with us in Judean in the hearing of the people who are on the wall.”
  footnotes:
  - marker: a
    text: Or 'in Hebrew.' The Hebrew term is יְהוּדִית, literally 'Judean,' referring to the language of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 힐기야의 아들 엘리아김과 스브나와 요아가 랍사게에게 말했습니다. 「청하건대 당신의 종들에게 아람어로 말해 주십시오. 우리는 알아듣습니다. 그리고 성벽 위에 있는 백성의 귀에 들리도록 우리에게 유다 말로는 말하지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘히브리어로.’ 여기의 יְהוּדִית는 문자적으로는 ‘유다 사람의 말’, 곧 유다의 언어를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר ... אֶל
  english_pob_choice: Then ... said to
  chosen_korean: 그때 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그리하여 ... 말했습니다
  lexicon: WLC narrative sequence; POB narrative audit trail
  rationale: 와우 연속형의 서사 진행을 자연스러운 한국어 시간표현으로 살렸습니다.
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 라브사게
  - 랍샤케
  lexicon: HALOT
  rationale: 영어 POB가 고유 칭호를 직역하지 않고 음역화했으므로, 한국어도 관용적 음역으로 처리해 직책 추정을 과도하게 단정하지 않았습니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종들
  alternatives_korean:
  - 당신의 종/종들
  - 당신의 하인들
  lexicon: HALOT
  rationale: 이 문맥에서는 외교적 자기 낮춤 표현이지만, 한국어에서는 왕실 대화의 격식을 유지하면서도 원문의 עבד의 종속성을 너무 약화시키지 않도록 '종들'로 옮겼습니다.
- source_word: יְהוּדִית
  english_pob_choice: Judean
  chosen_korean: 유다 말
  alternatives_korean:
  - 유대 말
  - 유다어
  - 히브리어
  lexicon: HALOT
  rationale: 영어 주석이 이것을 'Judean'으로 유지하고 '히브리어'를 대안으로 달았으므로, 본문은 원문에 더 가까운 '유다 말'로 두어 언어명의 역사적 긴장을 보존했습니다.
theological_decisions:
- issue: 청원의 공손한 어조와 직접화법의 재현
  chosen_reading: 「청하건대 ... 말해 주십시오」로 예의를 드러내되, 원문의 요청 강도를 살려 명령형+청유를 유지했습니다.
  alternative_readings:
  - 「부디 ... 말씀해 주십시오」
  - 「... 말하십시오」
  rationale: דבר נא의 요청성은 약화하지 않으면서 현대 한국어의 공손한 청원형으로 자연스럽게 옮겼습니다.
  doctrine_reference: 성경 번역의 화행 보존 원칙
