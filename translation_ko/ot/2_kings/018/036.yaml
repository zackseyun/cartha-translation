  text: וְ/הֶחֱרִ֣ישׁוּ הָ/עָ֔ם וְ/לֹֽא עָנ֥וּ אֹת֖/וֹ דָּבָ֑ר כִּי מִצְוַ֨ת הַ/מֶּ֥לֶךְ הִ֛יא לֵ/אמֹ֖ר לֹ֥א תַעֲנֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/036.yaml
  text: But the people kept silent and did not answer him a word[a], for the king’s command was, “Do not answer him.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''did not answer him a word,'' an idiom meaning they gave no reply at all.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 백성은 잠잠하고 그에게 한마디도 대답하지 않았습니다. 이는 왕의 명령이 “그에게 대답하지 말라”는 것이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘그에게 한마디도 대답하지 않았다’는 관용적으로 ‘전혀 대답하지 않았다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶחֱרִישׁוּ
  english_pob_choice: kept silent
  chosen_korean: 잠잠하고
  alternatives_korean:
  - 침묵하고
  - 가만히 있고
  - 말없이 있고
  lexicon: HALOT
  rationale: 히필형 חרשׁ의 동작적 뉘앙스를 살려 단순 상태보다 ‘잠잠하다’로 옮기면, 이어지는 ‘대답하지 않았다’와도 자연스럽게 호응합니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 그 사람들
  - 사람들
  - 무리
  lexicon: HALOT
  rationale: 문맥상 성벽 위의 유다 백성을 가리키므로, 한국어 성경에서 자연스러운 ‘백성’이 적절합니다.
- source_word: וְלֹא עָנוּ אֹתוֹ דָבָר
  english_pob_choice: did not answer him a word
  chosen_korean: 그에게 한마디도 대답하지 않았습니다
  alternatives_korean:
  - 그에게 아무 말도 하지 않았습니다
  - 그에게 대답 한마디 하지 않았습니다
  - 그에게 한마디도 답하지 않았습니다
  lexicon: HALOT
  rationale: ‘대답하다’가 ענה의 기본 의미를 유지하면서, ‘한마디도’로 히브리어의 관용적 강조를 한국어로 자연스럽게 드러냅니다.
- source_word: מִצְוַת הַמֶּלֶךְ
  english_pob_choice: the king’s command
  chosen_korean: 왕의 명령
  alternatives_korean:
  - 왕의 지시
  - 왕의 주문
  - 왕의 명령령
  lexicon: HALOT
  rationale: מִצְוָה는 권위를 지닌 명령을 뜻하므로, ‘명령’이 가장 직접적이며 문맥상 군사적/행정적 강제력을 잘 반영합니다.
theological_decisions:
- issue: 왕의 금지 명령을 인용문으로 분리해 전달하는 방식
  chosen_reading: 직접화법으로 “그에게 대답하지 말라”를 제시해, 본문의 권고가 아니라 공식 금지를 분명히 드러냈습니다.
  alternative_readings:
  - 간접화법으로 ‘그에게 대답하지 말라는 것이었습니다’
  - ‘그에게 답하지 말라’로 축약
  rationale: 본문의 히브리어 לֵאמֹר 뒤에 오는 금지문을 그대로 살려야 왕의 권위와 금지의 직접성이 유지됩니다.
  doctrine_reference: 본문 해석 및 서술 전달
