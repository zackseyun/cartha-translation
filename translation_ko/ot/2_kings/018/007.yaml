base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
  footnotes:
  - marker: a
    text: Or 'in everything he undertook, he succeeded' / 'he acted wisely in all that he did.' The Hebrew combines the ideas of wisdom and success.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그와 함께하셨고, 그가 하는 모든 일에서 성공하였습니다.[a] 그는 앗수르 왕에게 반역하여 그를 섬기지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 하는 모든 일을 지혜롭게 행하였습니다’. 히브리어 동사는 지혜롭게 행함과 그에 따른 성공의 뜻을 함께 담을 수 있습니다.
    reason: lexical_alternative
