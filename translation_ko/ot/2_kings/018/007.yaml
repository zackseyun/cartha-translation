base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/007.yaml
  text: And Yahweh was with him; wherever he went[a], he prospered. And he rebelled against the king of Assyria and did not serve him.
  footnotes:
  - marker: a
    text: Or 'in everything he undertook, he succeeded' / 'he acted wisely in all that he did.' The Hebrew combines the ideas of wisdom and success.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 그와 함께하셨고, 그가 어디로 나아가든지 번성하였습니다. 그는 앗수르 왕에게 반역하여 그를 섬기지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 하는 모든 일에서 성공하였습니다’ / ‘그가 하는 모든 일을 지혜롭게 행하였습니다’. 히브리어는 지혜와 성공의 뜻을 함께 담습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 원문 고유명사 יְהוָה를 프로젝트 기본값에 따라 음역하여, 언약의 이름을 보존했습니다.
- source_word: וְהָיָה ... עִמּוֹ
  english_pob_choice: was with him
  chosen_korean: 그와 함께하셨고
  alternatives_korean:
  - 그와 함께 계셨고
  - 그와 함께 있었고
  lexicon: HALOT
  rationale: 하나님의 지속적 임재와 호의를 자연스러운 한국어로 옮기되, 동사의 주어가 야훼임을 분명히 했습니다.
- source_word: בְּכֹל אֲשֶׁר יֵצֵא / יַשְׂכִּיל
  english_pob_choice: wherever he went out ... he prospered
  chosen_korean: 그가 어디로 나아가든지 번성하였습니다
  alternatives_korean:
  - 그가 무엇을 하든지 성공하였습니다
  - 그가 어디로 가든지 형통하였습니다
  lexicon: HALOT
  rationale: ‘나아가다’는 출정·활동의 뉘앙스를 살리고, יַשְׂכִּיל의 결과적 의미는 ‘번성하다’로 간결하게 담았습니다.
- source_word: וַיִּמְרֹד
  english_pob_choice: he rebelled
  chosen_korean: 반역하여
  alternatives_korean:
  - 반란을 일으켜
  - 반역하였고
  lexicon: HALOT
  rationale: 정치적 항거의 의미를 분명히 하는 동사로 옮겼으며, 앞뒤 문맥과 연결되도록 부사형으로 처리했습니다.
- source_word: וְלֹא עֲבָדֹו
  english_pob_choice: did not serve him
  chosen_korean: 그를 섬기지 않았습니다
  alternatives_korean:
  - 그의 종이 되지 않았습니다
  - 그에게 복종하지 않았습니다
  lexicon: HALOT
  rationale: עבד의 기본 의미를 살리되, 여기서는 앗수르 왕에 대한 봉신적 예속을 한국어로 자연스럽게 드러내기 위해 ‘섬기다’를 선택했습니다.
theological_decisions:
