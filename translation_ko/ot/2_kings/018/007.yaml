  lexicon: HALOT
  rationale: 정치적 항거의 의미를 분명히 하는 동사로 옮겼으며, 앞뒤 문맥과 연결되도록 부사형으로 처리했습니다.
- source_word: וְלֹא עֲבָדֹו
  english_pob_choice: did not serve him
  chosen_korean: 그를 섬기지 않았습니다
  alternatives_korean:
