  naturalness: ‘이제 보십시오’와 합쇼체의 직접적 어조는 본문의 조롱성 경고에 자연스럽습니다. 다만 ‘그것은 …와 같아서’보다 ‘이집트라는 부러진 갈대 지팡이’가 원문의 은유적 동격을 더 직접적으로 드러내며, 마지막 문장은 바로를 주어로 복원해야 자연스럽고 명료합니다.
