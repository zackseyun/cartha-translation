revisions:
- from: 이제 보십시오. 당신은 이집트를 의지하고 있는데, 그것은 부러진 갈대 지팡이와 같아서, 사람이 그것에 기대면 손바닥에 들어가 찌릅니다. 바로 그런 것이 이집트 왕 바로를 신뢰하는 모든 사람에게 해당합니다.[a][b]
  to: 이제 보십시오. 당신은 이집트라는 부러진 갈대 지팡이를 의지하고 있습니다. 사람이 그것에 기대면, 그것이 그의 손바닥을 파고들어 찌를 것입니다.[a] 이집트 왕 바로는 그를 신뢰하는 모든 사람에게 바로 그러한 존재입니다.[b]
  rationale: 원문의 직접 은유와 조건-결과 구조를 보존하고, 누락되었던 ‘이집트 왕 바로’를 결론절의 주어로 복원했습니다. עַתָּה의 시간 표지는 ‘이제’로 유지했으며, הִנֵּה의 주의를 환기하는 어조는 ‘보십시오’로 옮겼습니다. 각주는 손바닥/손의 어휘 범위와 רָצוּץ의 어휘적 대안을 각각 해당 위치에 연결했습니다.
