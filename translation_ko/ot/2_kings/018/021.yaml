  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַתָּ֡ה הִנֵּ֣ה בָטַ֣חְתָּ לְּ/ךָ֡ עַל מִשְׁעֶנֶת֩ הַ/קָּנֶ֨ה הָ/רָצ֤וּץ הַ/זֶּה֙ עַל מִצְרַ֔יִם אֲשֶׁ֨ר יִסָּמֵ֥ךְ אִישׁ֙ עָלָ֔י/ו וּ/בָ֥א בְ/כַפּ֖/וֹ וּ/נְקָבָ֑/הּ כֵּ֚ן פַּרְעֹ֣ה מֶֽלֶךְ מִצְרַ֔יִם לְ/כָֽל הַ/בֹּטְחִ֖ים עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/021.yaml
  text: Now look, you are trusting in Egypt, that broken reed of a staff, which, if a man leans on it, will go into his palm and pierce it. So is Pharaoh king of Egypt to all who trust in him.
  footnotes:
  - marker: a
    text: Or 'that crushed reed of a staff.' The Hebrew adjective can denote something crushed, bruised, or broken; 'broken' best fits the image of a support that splinters and injures the hand.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'if a man leans on it.' The singular masculine is used generically here.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 보십시오. 당신은 이집트를 의지하고 있는데, 그것은 부러진 갈대 지팡이와 같아서, 사람이 그것에 기대면 손바닥에 들어가 찌릅니다. 바로 그런 것이 이집트 왕 바로를 신뢰하는 모든 사람에게 해당합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 בְכַפּוֹ는 문자적으로 ‘그의 손바닥/손’입니다. 영어 POB는 이 이미지를 살려 ‘palm’으로 두었으며, 한국어도 손바닥을 택해 상해의 구체성을 보존했습니다.
    reason: source_note
  - marker: b
    text: 히브리어 רצוץ는 ‘부러진, 으스러진, 짓눌린’의 범위를 가질 수 있습니다. 여기서는 지지대가 되어 주지 못하고 오히려 상처를 내는 이미지를 가장 잘 드러내는 ‘부러진’을 기본으로 삼았습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָטַחְתָּ לְּךָ / הַבֹּטְחִים עָלָיו
  english_pob_choice: you are trusting / trust in him
  chosen_korean: 당신은 … 의지하고 있는데 / 바로를 신뢰하는
  alternatives_korean:
  - 당신은 … 믿고 있는데
  - 당신은 … 의탁하고 있는데
  - 바로에게 의지하는
  lexicon: HALOT
  rationale: בטח는 단순 인지보다 ‘기대어 의존하다’는 뜻이 강하므로, 현재적 책망의 뉘앙스를 살려 ‘의지하다’로 옮겼습니다.
- source_word: מִשְׁעֶנֶת הַקָּנֶה הָרָצוּץ
  english_pob_choice: that broken reed of a staff
  chosen_korean: 부러진 갈대 지팡이
  alternatives_korean:
  - 꺾인 갈대 지팡이
  - 짓눌린 갈대 지팡이
  - 부서진 갈대 막대기
  lexicon: HALOT
  rationale: מִשְׁעֶנֶת은 ‘기대는 것/지팡이’이고, קנה הָרָצוּץ는 지지력을 잃은 갈대의 이미지를 드러내므로, ‘부러진 갈대 지팡이’가 비유를 가장 자연스럽고 직접적으로 전달합니다.
- source_word: וּבָא בְכַפּוֹ וּנְקָבָהּ
  english_pob_choice: will go into his palm and pierce it
  chosen_korean: 손바닥에 들어가 찌릅니다
  alternatives_korean:
  - 손에 들어가 찌릅니다
  - 손바닥을 꿰뚫습니다
  - 손을 찔러 상하게 합니다
  lexicon: HALOT
  rationale: בְכַפּוֹ는 문자적으로 ‘그의 손바닥/손’이며, וּנְקָבָהּ는 ‘뚫다/찌르다’이므로, 한국어에서는 ‘손바닥에 들어가 찌릅니다’로 생생한 상해 이미지를 보존했습니다.
- source_word: כֵּן פַּרְעֹה מֶלֶךְ מִצְרַיִם
  english_pob_choice: So is Pharaoh king of Egypt
  chosen_korean: 바로를 신뢰하는 모든 사람에게 해당합니다
  alternatives_korean:
  - 이집트 왕 바로도 그와 같습니다
  - 이집트 왕 바로는 그와 같습니다
  - 바로 왕은 바로 그런 존재입니다
  lexicon: HALOT
  rationale: כֵּן은 앞의 비유를 뒤의 실상에 대응시키는 비교 표지이므로, ‘해당합니다’로 현대 한국어에서 비교·판정의 기능을 분명히 했습니다.
theological_decisions:
- issue: 수사적 조롱문의 어조
  chosen_reading: 예언자적 책망의 직설성을 살려 2인칭 직접 호격과 현재형 진술로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘당신은 잘못 기대고 있습니다’로 누그러뜨리는 읽기
  - 중립적으로 ‘당신이 의지하는 바는’으로 바꾸는 읽기
  rationale: 본문은 단순 정보 전달이 아니라 히스기야를 향한 조롱성 책망이므로, 비유의 날카로움과 압박감을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 예언서/왕정사 서술의 수사적 장치 보존
- issue: ‘예루살렘 방어의 현실성’에 대한 비유
  chosen_reading: 이집트를 군사적 동맹으로 신뢰하는 것이 결국 상처를 입히는 의지처라는 점을 그대로 드러냈습니다.
  alternative_readings:
  - 도덕적 교훈으로 일반화하는 읽기
  - 정치적 언급을 약화해 단순 비유로 처리하는 읽기
  rationale: 원문은 실제 외교적 신뢰의 실패를 강한 물질적 이미지로 비판하므로, 그 위험성과 결과를 한국어에서도 분명히 보존해야 합니다.
  doctrine_reference: 2열왕기 18:21의 역사-신학적 맥락
