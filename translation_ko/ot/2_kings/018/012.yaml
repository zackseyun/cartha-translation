id: 2KI.18.12
reference: 2 Kings 18:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: עַ֣ל אֲשֶׁ֣ר לֹֽא שָׁמְע֗וּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעַבְרוּ֙ אֶת בְּרִית֔/וֹ אֵ֚ת כָּל אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֣בֶד יְהוָ֑ה וְ/לֹ֥א שָׁמְע֖וּ וְ/לֹ֥א עָשֽׂוּ׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/012.yaml
  text: because they did not listen to the voice of Yahweh their God[a], but transgressed his covenant, all that Moses the servant of Yahweh commanded[c][b]; they neither listened nor did it.
  footnotes:
  - marker: a
    text: Or 'obeyed the voice of the LORD their God.' The Hebrew idiom 'listen to the voice' often carries the sense of obedience.
    reason: lexical_alternative
  - marker: b
    text: Or 'violated his covenant.'
    reason: lexical_alternative
  - marker: c
    text: The repeated 'did not listen' / 'would not listen' echoes the Hebrew for emphasis, stressing persistent refusal rather than a single act of disobedience.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 그들의 하나님 야훼의 음성을 듣지 않고[a], 그의 언약, 곧 야훼의 종 모세가 명령한 모든 것을 어겼기 때문입니다[b]. 그들은 듣지도 않았고 행하지도 않았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘음성을 듣다’는 종종 ‘순종하다’의 뜻을 함축합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 언약을 위반했으며’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 본문에서 ‘듣지 않았다’가 반복되는 것은 단순히 듣지 못했다는 뜻이 아니라 거부를 강조합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: Yahweh their God
  chosen_korean: 자기들의 하나님이신 야훼
  alternatives_korean:
  - 여호와 그들의 하나님
  - 그들의 하나님이신 주님
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 POB 기준에 따라 야훼로, 소유 관계는 자연스러운 관형격으로 풀어 한국어 독자를 위해 의미를 분명히 했습니다.
- source_word: שָׁמְעוּ בְּקוֹל
  english_pob_choice: did not listen to the voice of
  chosen_korean: 말씀을 듣지 않고
  alternatives_korean:
  - 음성을 듣지 않고
  - 말에 귀를 기울이지 않고
  - 순종하지 않고
  lexicon: HALOT
  rationale: 히브리어 관용구의 청종-순종 의미를 살리되, 한국어에서는 “말씀을 듣다”가 가장 자연스럽고 본문 대비의 반복도 유지합니다.
- source_word: וַיַּעַבְרוּ אֶת בְּרִיתוֹ
  english_pob_choice: transgressed his covenant
  chosen_korean: 그의 언약을 어겼으며
  alternatives_korean:
  - 그의 언약을 범했으며
  - 그의 언약을 위반했으며
  - 그의 언약을 깨뜨렸으며
  lexicon: HALOT
  rationale: 언약 문맥에서 עבר는 단순 이동이 아니라 언약 위반을 뜻하므로, 한국어에서는 직접적으로 “어겼다”로 옮겨 의미를 분명히 했습니다.
- source_word: עֶבֶד יְהוָה
  english_pob_choice: the servant of Yahweh
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 야훼의 노예
  - 야훼의 섬기는 사람
  - 야훼의 일꾼
  lexicon: HALOT
  rationale: 모세의 호칭은 봉사적·신분적 소속을 드러내는 관용적 칭호이므로, 본문 전통을 살려 “종”으로 옮겼습니다.
- source_word: וְלֹא שָׁמְעוּ וְלֹא עָשׂוּ
  english_pob_choice: they neither listened nor did it
  chosen_korean: 듣지도 않았고 행하지도 않았습니다
  alternatives_korean:
  - 듣지도 않았고 하지도 않았습니다
  - 청종하지도 않았고 행하지도 않았습니다
  - 들으려 하지도 않았고 행하지도 않았습니다
  lexicon: HALOT
  rationale: 뒤의 반복은 지속적 거절을 강조하므로, 한국어에서도 병렬 구조로 반복성을 살리되 과도한 해석은 피했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명기적 언약 문맥에서 고유 신명은 번역어가 아닌 음역으로 보존하는 것이 POB 원칙과 더 잘 맞습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: שׁמע의 의미 범위
  chosen_reading: 듣지 않고 / 듣지도 않았고
  alternative_readings:
  - 순종하지 않고
  - 청종하지 않고
  rationale: 이 동사는 순종을 함축하지만, 본문은 이미 언약 위반을 별도로 말하므로 한국어에서는 ‘듣다’의 반복을 유지해 히브리어의 수사적 강조를 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §5
