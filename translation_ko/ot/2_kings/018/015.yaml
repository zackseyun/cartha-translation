base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/015.yaml
  text: So Hezekiah gave all the silver that was found in the house of Yahweh and in the treasuries of the king's house[a][b][c].
  footnotes:
  - marker: a
    text: Or 'the money'; Hebrew 'the silver.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of the LORD'; literally 'the house of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the royal palace'; literally 'the king's house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 히스기야는 야훼의 집과 왕궁의 곳간들에서 찾아진 은을 모두 내주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘은화’; 히브리어는 직역하면 ‘은’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 성전’; 직역하면 ‘야훼의 집’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘왕궁’; 직역하면 ‘왕의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 내주었습니다
  alternatives_korean:
  - 주었습니다
  - 넘겨주었습니다
  lexicon: HALOT
  rationale: 문맥이 조공성 인도이며, 단순한 ‘주다’보다 외부에 넘겨 보내는 뉘앙스를 살리되 과도하게 법률적이지 않게 옮겼습니다.
- source_word: חִזְקִיָּה
  english_pob_choice: Hezekiah
  chosen_korean: 히스기야
  alternatives_korean:
  - 헤즈키야
  lexicon: 고유명사 관용형
  rationale: 한국어 성서에서 널리 쓰이는 관용 표기인 히스기야를 따랐습니다.
- source_word: הַנִּמְצָא
  english_pob_choice: that was found
  chosen_korean: 찾아진
  alternatives_korean:
  - 있던
  - 발견된
  lexicon: HALOT
  rationale: 히브리어 수동분사형의 결과 상태를 살리면서, 창고에 실제로 ‘찾아져 나온’ 재화를 가리키는 느낌을 유지했습니다.
- source_word: בֵית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: source의 직역성을 따라 ‘집’으로 옮기고, divine name은 POB 원칙에 맞게 야훼로 표기했습니다.
- source_word: וּבְאֹצְרוֹת בֵּית הַמֶּלֶךְ
  english_pob_choice: and in the treasuries of the king's house
  chosen_korean: 왕궁의 곳간들
  alternatives_korean:
  - 왕의 집의 곳간들
  - 왕실 창고들
  lexicon: HALOT
  rationale: אֹצָר의 금전·귀금속 보관 장소 기능을 살려 ‘곳간들’로 옮겼고, בֵּית הַמֶּלֶךְ는 한국어 자연성을 위해 왕궁으로 풀었습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 하나님의 고유명인 יְהוָה를 직접 쓰므로, POB 원칙에 따라 대체 호칭이 아니라 고유명사 음역인 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
