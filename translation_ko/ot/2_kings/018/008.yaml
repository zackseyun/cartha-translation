  text: He struck the Philistines as far as Gaza and its territory[b][a], from watchtower to fortified city.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from watchtower to fortified city,'' an idiom meaning from the smallest outpost to the largest defended settlement.'
    reason: cultural_note
  - marker: b
    text: Or 'and its borders.' The Hebrew word can denote either boundary lines or the territory belonging to a city.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 블레셋 사람들을 쳤습니다. 그 범위는 가자와 그 영토[b]에 이르기까지, 곧 파수대에서 요새화된 성읍까지[a]였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘파수대에서 요새화된 성읍까지’는 가장 작은 전초지에서 가장 큰 방어 거점까지를 뜻합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘그 경계’. 히브리어 גְּבוּלֶיהָ는 경계선뿐 아니라 도시에 속한 영토를 뜻할 수 있습니다.
    reason: lexical_alternative
