language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אַל יַבְטַ֨ח אֶתְ/כֶ֤ם חִזְקִיָּ֨הוּ֙ אֶל יְהוָ֣ה לֵ/אמֹ֔ר הַצֵּ֥ל יַצִּילֵ֖/נוּ יְהוָ֑ה וְ/לֹ֤א תִנָּתֵן֙ אֶת הָ/עִ֣יר הַ/זֹּ֔את בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/030.yaml
  text: And do not let Hezekiah make you trust in Yahweh[a], saying, ‘Yahweh will surely deliver us, and this city will not be given into the hand of the king of Assyria.’
  footnotes:
  - marker: a
    text: 'Hebrew: ''The LORD delivering will deliver us,'' an emphatic form meaning ''The LORD will surely deliver us.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 여러분을 야훼를 신뢰하도록 만들게 하지 마십시오. 그는 “야훼께서 반드시 우리를 구원하실 것이며, 이 도성은 앗수르 왕의 손에 넘어가지 않을 것이다”라고 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘구원하시고 구원하신다’는 강조형을 반영한 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַל יַבְטַח אֶתְכֶם
  english_pob_choice: do not let Hezekiah make you trust
  chosen_korean: 히스기야가 여러분을 ... 신뢰하도록 만들게 하지 마십시오
  alternatives_korean:
  - 히스기야를 믿지 마십시오
  - 히스기야가 여러분을 믿게 하지 마십시오
  lexicon: HALOT
  rationale: Hiphil of בטח는 단순한 ‘믿다’보다 남을 그렇게 하게 만드는 사역적 뉘앙스를 가지므로, ‘...하도록 만들게 하지 마십시오’로 그 강제/유도 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명은 경칭 대체어가 아니라 고유명사로 처리하는 프로젝트 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַצֵּל יַצִּילֵנוּ
  english_pob_choice: will surely deliver us
  chosen_korean: 반드시 우리를 구원하실 것이며
  alternatives_korean:
  - 틀림없이 우리를 구원하실 것이며
  - 구원하시고 또 구원하실 것이며
  lexicon: HALOT
  rationale: 부정사 절대형+동사로 된 강조형을 한국어의 ‘반드시’로 자연스럽게 옮겨, 단순 미래보다 확실성과 강조를 드러냈습니다.
- source_word: בְּיַד מֶלֶךְ אַשּׁוּר
  english_pob_choice: into the hand of the king of Assyria
  chosen_korean: 앗수르 왕의 손에 넘어가지 않을 것이다
  alternatives_korean:
  - 앗수르 왕의 손에 주어지지 않을 것이다
  - 앗수르 왕의 권세 아래로 넘어가지 않을 것이다
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에’는 문자적 이미지가 있지만 문맥상 점령/지배를 뜻하므로, 한국어에서는 ‘손에 넘어가다’로 그 군사적 의미를 살렸습니다.
theological_decisions:
- issue: YHWH를 한국어에서 어떻게 표기할지
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 직접적인 신명 표기를 유지해 히스기야의 발화가 특정한 언약의 이름을 부르는 것임을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: 히스기야의 발화 내부 인용부의 어조
  chosen_reading: 예언적/직설적 인용을 따르되 현대 한국어에서 자연스럽게 정리했습니다.
  alternative_readings:
  - 더 강한 구어체
  - 더 전례적·성경문체
  rationale: 직접 인용된 말은 원문의 선포성을 유지해야 하지만, 본문 전체는 현대 합쇼체 서술이므로 인용문은 내용 중심으로 자연스럽게 처리했습니다.
  doctrine_reference: Korean style and quotation handling
