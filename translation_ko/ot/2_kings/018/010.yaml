  verdict: revise
  source_fidelity: 첫 시간 표현인 ‘삼 년이 지난 뒤에’는 מִקְצֵה שָׁלֹשׁ שָׁנִים(‘세 해의 끝에’)보다 느슨하며, 단순히 삼 년 뒤라는 뜻으로 읽힐 수 있습니다. 또한 본문의 연대 표지는 두 연대 모두 사건의 시점을 나타내므로 한국어에서 ‘…해에’를 밝혀 주는 편이 충실합니다. 능동 ‘그들이’와 뒤의 수동 ‘사마리아가 함락되었습니다’는 원문의 서술 전개를 적절히 반영합니다.
  naturalness: ‘제육년/제구년’은 현대 표준어 합쇼체 본문에는 다소 고어적입니다. ‘다스린 지 여섯째 해/아홉째 해’가 명료하고 자연스럽습니다. 대명사의 선행사가 앞 절 문맥에 있는 점을 반영하여 ‘그곳’으로 옮길 수 있습니다.
