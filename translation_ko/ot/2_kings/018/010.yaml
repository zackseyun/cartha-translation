  text: 세 해가 끝날 때에[a] 그들이 그곳을 점령했습니다. 히스기야가 다스린 지 여섯째 해, 곧 이스라엘 왕 호세아가 다스린 지 아홉째 해에 사마리아가 함락되었습니다.
  philosophy: optimal-equivalence
  footnotes:
