  text: At the end of three years they captured it. In the sixth year of Hezekiah[a], which was the ninth year of Hoshea king of Israel, Samaria was captured.
  footnotes:
  - marker: a
    text: Or 'After three years they took it.' The Hebrew idiom is more literally 'at the end of three years.'
    reason: lexical_alternative
translation:
  language: ko
  text: 삼 년이 지난 뒤에 그들이 그것을 점령했습니다. 히스기야의 제육년, 곧 이스라엘 왕 호세아의 제구년이었습니다. 사마리아가 함락되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘삼 년이 지난 뒤에’는 더 직역하면 ‘세 해의 끝에’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדֻהָ
  english_pob_choice: they captured it
  chosen_korean: 그들이 그것을 점령했습니다
  alternatives_korean:
  - 그들이 그것을 사로잡았습니다
  - 그들이 그것을 빼앗았습니다
  lexicon: HALOT
  rationale: לכד의 기본 뜻인 ‘점령하다/포획하다’를 살려 능동 복수의 진행을 유지했습니다. 여기서는 성읍 함락의 군사적 상황에 맞게 ‘점령하다’가 가장 자연스럽습니다.
- source_word: מִקְצֵה שָׁלֹשׁ שָׁנִים
  english_pob_choice: At the end of three years
  chosen_korean: 삼 년이 지난 뒤에
  alternatives_korean:
  - 삼 년 끝에
  - 삼 년 후에
  lexicon: HALOT
  rationale: 히브리어 관용구의 시간 경과를 한국어로 자연스럽게 옮기되, ‘삼 년이 지난 뒤에’로 사건의 완료 시점을 분명히 했습니다.
- source_word: בִּשְׁנַת שֵׁשׁ לְחִזְקִיָּה
  english_pob_choice: In the sixth year of Hezekiah
  chosen_korean: 히스기야의 제육년
  alternatives_korean:
  - 히스기야의 여섯째 해
  - 히스기야 제6년에
  lexicon: HALOT
  rationale: 왕의 재위 연대를 한국어 성경 문체에 맞는 ‘제육년’으로 옮겨 동시대적 연대 표지를 유지했습니다.
- source_word: שְׁנַת תֵּשַׁע לְהוֹשֵׁעַ מֶלֶךְ יִשְׂרָאֵל
  english_pob_choice: the ninth year of Hoshea king of Israel
  chosen_korean: 이스라엘 왕 호세아의 제구년
  alternatives_korean:
  - 이스라엘 왕 호세아의 아홉째 해
  - 호세아 이스라엘 왕의 제구년에
  lexicon: HALOT
  rationale: 두 번째 동시대 연대를 첫 표현과 같은 방식으로 맞추어, ‘왕 호세아’가 아니라 ‘이스라엘 왕 호세아’라는 호칭 구조를 보존했습니다.
- source_word: נִלְכְּדָה שֹׁמְרוֹן
  english_pob_choice: Samaria was captured
  chosen_korean: 사마리아가 함락되었습니다
  alternatives_korean:
  - 사마리아가 점령되었습니다
  - 사마리아가 사로잡혔습니다
  lexicon: HALOT
  rationale: 수동 결과를 나타내는 니팔형에 맞추어 자연스러운 한국어 수동 표현을 사용했습니다. 성읍 함락의 결과를 분명히 드러내기 위해 ‘함락되다’를 택했습니다.
