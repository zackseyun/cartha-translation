  lexicon: HALOT
  rationale: 수동 결과를 나타내는 니팔형에 맞추어 자연스러운 한국어 수동 표현을 사용했습니다. 성읍 함락의 결과를 분명히 드러내기 위해 ‘함락되다’를 택했습니다.
