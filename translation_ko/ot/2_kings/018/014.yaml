  text: וַ/יִּשְׁלַ֣ח חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֣ה אֶל מֶֽלֶךְ אַשּׁוּר֩ לָכִ֨ישָׁ/ה לֵ/אמֹ֤ר חָטָ֨אתִי֙ שׁ֣וּב מֵֽ/עָלַ֔/י אֵ֛ת אֲשֶׁר תִּתֵּ֥ן עָלַ֖/י אֶשָּׂ֑א וַ/יָּ֨שֶׂם מֶֽלֶךְ אַשּׁ֜וּר עַל חִזְקִיָּ֣ה מֶֽלֶךְ יְהוּדָ֗ה שְׁלֹ֤שׁ מֵאוֹת֙ כִּכַּר כֶּ֔סֶף וּ/שְׁלֹשִׁ֖ים כִּכַּ֥ר זָהָֽב־־־׀׀׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/014.yaml
  text: Then Hezekiah king of Judah sent to the king of Assyria at Lachish[a], saying, “I have offended. Withdraw from me. Whatever you impose on me[b], I will bear.” So the king of Assyria imposed on Hezekiah king of Judah three hundred talents of silver and thirty talents of gold.
  footnotes:
  - marker: a
    text: Or 'to Lachish'; the Hebrew form can mark motion toward Lachish, though here it likely identifies where the king of Assyria was located.
    reason: lexical_alternative
  - marker: b
    text: Or 'Whatever you lay on me, I will carry/pay.' The Hebrew speaks of bearing whatever burden or levy is placed on him.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 유다 왕 히스기야가 라기스에 있는[a] 앗시리아 왕에게 사신을 보내어 말했습니다. “제가 죄를 지었습니다. 제게서 물러가십시오. 왕께서 제게 부과하시는 것은 무엇이든[b] 제가 감당하겠습니다.” 그러자 앗시리아 왕은 유다 왕 히스기야에게 은 삼백 달란트와 금 삼십 달란트를 부과했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라기스로’. 히브리어 형태는 라기스를 향한 이동을 나타낼 수도 있지만, 여기서는 앗시리아 왕이 라기스에 있었다고 보는 해석이 더 자연스럽습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘왕께서 제게 얹으시는 것은 무엇이든 제가 지겠습니다/치르겠습니다’. 히브리어는 자신에게 부과되는 부담이나 부과금을 짊어진다는 뜻을 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내어
  alternatives_korean:
  - 보냈습니다
  - 파견했습니다
  lexicon: HALOT
  rationale: 히브리어 שלח는 이 문맥에서 단순히 보내는 행위를 뜻하며, 뒤따르는 직접 화법 때문에 ‘사람을 보내어’가 한국어에서 가장 자연스럽고 문맥에 맞습니다.
- source_word: לָכִישָׁה
  english_pob_choice: at Lachish
  chosen_korean: 라기스에 있는
  alternatives_korean:
  - 라기스로
  - 라기스에게
  lexicon: HALOT
  rationale: 방향성 ה가 붙어 있지만, 서술상 앗시리아 왕의 위치를 표시하는 것으로 이해하는 편이 자연스러워 ‘라기스에 있는’으로 옮겼습니다.
- source_word: חָטָאתִי
  english_pob_choice: I have sinned
  chosen_korean: 내가 죄를 지었습니다
  alternatives_korean:
  - 제가 잘못했습니다
  - 제가 과실을 범했습니다
  lexicon: HALOT
  rationale: 히브리어는 정치적 사과가 아니라 통상적인 ‘죄를 짓다’의 어휘를 사용하므로, 그 도덕적 무게를 살려 직역에 가깝게 옮겼습니다.
- source_word: אֵת אֲשֶׁר תִּתֵּן עָלַי ... אֶשָּׂא
  english_pob_choice: Whatever you impose on me, I will bear
  chosen_korean: 당신이 내게 부과하는 것은 무엇이든 내가 감당하겠습니다
  alternatives_korean:
  - 무엇이든 당신이 내게 지우는 것은 내가 지겠습니다
  - 당신이 내게 얹는 것은 무엇이든 내가 메겠습니다
  lexicon: HALOT
  rationale: נתן על과 נשא의 결합은 부담·부과·과징을 지고 감당한다는 뜻이므로, 현대 한국어에서 자연스러운 ‘부과하다/감당하다’로 렌더링했습니다.
- source_word: כִּכַּר
  english_pob_choice: talents
  chosen_korean: 달란트
  alternatives_korean:
  - 중량 단위 달란트
  - 탈렌트
  lexicon: HALOT
  rationale: ככר는 성경에서 통용되는 고대 중량 단위이므로 한국어 성경 관용인 ‘달란트’를 유지했습니다.
theological_decisions:
- issue: Hezekiah의 고백 수위
  chosen_reading: ‘내가 죄를 지었습니다’로 번역해 단순한 외교적 실수보다 죄책의 언어를 유지했습니다.
  alternative_readings:
  - 제가 잘못했습니다
  - 제가 실수했습니다
  rationale: 본문은 חטא의 일반적인 종교·도덕 어휘를 사용하므로, 이를 약화시키지 않고 그대로 살리는 것이 원문 의미에 충실합니다.
  doctrine_reference: Translation philosophy §1, §6
- issue: 조공/벌금의 구체화 정도
  chosen_reading: मुख्य본문은 ‘부과하다/감당하다’의 넓은 표현을 유지하고, 금액은 뒤 문장에서 제시했습니다.
  alternative_readings:
  - 무엇이든 당신이 내게 지우는 조공을 내가 내겠습니다
  - 무엇이든 당신이 내게 정하는 벌금을 내가 내겠습니다
  rationale: 히브리어는 무엇이 부과되는지 본문 첫 절에서 좁히지 않고, 다음 절에서 은과 금의 액수를 제시하므로 번역도 그 폭을 유지했습니다.
  doctrine_reference: Translation philosophy §1, §5
