  text: וְ/עַתָּה֙ הִתְעָ֣רֶב נָ֔א אֶת אֲדֹנִ֖/י אֶת מֶ֣לֶךְ אַשּׁ֑וּר וְ/אֶתְּנָ֤ה לְ/ךָ֙ אַלְפַּ֣יִם סוּסִ֔ים אִם תּוּכַ֕ל לָ֥/תֶת לְ/ךָ֖ רֹכְבִ֥ים עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/023.yaml
  text: Now then[a], please make a wager with my master, the king of Assyria, and I will give you two thousand horses, if you are able to provide riders for them.
  footnotes:
  - marker: a
    text: Or 'make a pledge with my master' or 'strike a bargain with my master.' The Hebrew verb can denote entering an agreement or staking oneself, but here likely carries the sense of a mocking wager or challenge.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 주인과 앗수르 왕과 내기를 하십시오. 내가 말 이천 마리를 주겠으니, 그 위에 탈 사람을 댈 수만 있다면 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 주인과 내기를 걸어 보십시오’, ‘내 주인과 약속을 맺으십시오’로도 옮길 수 있습니다. 히브리어 동사는 합의에 들어가거나 무엇을 걸고 도전하는 뜻을 둘 다 가질 수 있으며, 여기서는 조롱 섞인 내기의 의미가 강합니다.
    reason: lexical_alternative
