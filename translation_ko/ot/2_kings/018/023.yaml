theological_decisions:
- issue: 왕의 호칭을 어떻게 처리할지
  chosen_reading: ‘앗수르 왕’으로 옮겨 인간 통치자의 호칭임을 분명히 했습니다.
  alternative_readings:
  - ‘앗수르의 왕’
  - ‘앗시리아 왕’
  rationale: 문맥상 존칭의 종교적 함의가 아니라 정치적·군사적 직함이므로, 한국어에서 가장 직접적인 표현을 택했습니다.
  doctrine_reference: 서술 문맥의 역사-정치적 호칭 처리 원칙
