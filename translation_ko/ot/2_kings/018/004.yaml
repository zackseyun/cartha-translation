base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
  footnotes:
  - marker: a
    text: Or 'cut down the Asherah pole' or 'cut down the sacred pole.'
    reason: lexical_alternative
  - marker: b
    text: Nehushtan is likely a wordplay on 'bronze' and may mean something like 'a mere piece of bronze.'
    reason: cultural_note
  - marker: c
    text: Or 'he called it Nehushtan.' The Hebrew does not make the subject explicit in a way that must be carried over into English.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 산당들을 제거하고, 돌기둥들을 부수고, 아세라[a]를 베어 버리고, 모세가 만든 청동 뱀을 산산조각 냈습니다. 그 무렵까지 이스라엘 자손이 그것에게 향을 피워 바치고 있었기 때문입니다. 그것을 느후스단[b]이라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아세라 기둥’ 또는 ‘신성한 기둥’. ‘아세라’는 여기서 베어 낼 수 있는 제의 물건을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘느후스단’은 ‘청동’과 관련된 말놀이일 가능성이 있으며, ‘한낱 청동 조각’과 같은 뜻일 수 있습니다. 히브리어는 이것을 그렇게 부른 주어를 명시하지 않습니다.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: הֵסִיר
  english_pob_choice: removed
  chosen_korean: 제거하고
  alternatives_korean:
