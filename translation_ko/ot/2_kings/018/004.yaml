  source_fidelity: 원문의 인과관계는 놋/청동 뱀을 부순 행위에 직접 연결되는데, 초안은 앞선 모든 개혁 행위가 향을 바친 이유 때문인 것처럼 연결될 수 있습니다. 또한 כרת의 물리적 ‘베다/잘라 내다’의 뜻은 ‘찍어 버리다’보다 ‘베어 버리다’가 더 정확합니다. וַיִּקְרָא의 주어는 문맥상 히스기야로 이해될 수 있으나 명시되지 않은 주어를 한국어에서 보존할 수 있도록 무주어 능동문으로 옮겼습니다.
  naturalness: ‘놋뱀’은 성경적 전통 표현이지만 현대 표준어로는 ‘청동 뱀’이 더 자연스럽습니다. 인과절을 별도 문장으로 처리하여 수식 범위와 문장 흐름을 분명히 했습니다.
  terminology: ‘산당’, ‘아세라’, ‘느후스단’은 제의·고유 용어로 유지했습니다. מַצֵּבוֹת는 일반 건축 기둥으로 오해되지 않도록 ‘돌기둥들’로 했고, 아세라가 어떤 제의 물건인지 단정하지 않도록 각주에서 가능한 이해를 제시했습니다.
  issues:
