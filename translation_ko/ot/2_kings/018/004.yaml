- issue: וַיִּקְרָא לוֹ נְחֻשְׁתָּן의 주어 처리
  chosen_reading: 그것은 느후스단이라고 불렸습니다
  alternative_readings:
  - 그가 그것을 느후스단이라고 불렀습니다
  - 사람들이 그것을 느후스단이라고 불렀습니다
  rationale: 히브리어는 주어를 명시적으로 고정하지 않으므로, 해석을 덧씌우지 않는 수동형이 가장 안전합니다.
  doctrine_reference: Translation philosophy 3
