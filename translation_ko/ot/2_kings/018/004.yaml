reference: 2 Kings 18:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: ה֣וּא הֵסִ֣יר אֶת הַ/בָּמ֗וֹת וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּבֹ֔ת וְ/כָרַ֖ת אֶת הָֽ/אֲשֵׁרָ֑ה וְ/כִתַּת֩ נְחַ֨שׁ הַ/נְּחֹ֜שֶׁת אֲשֶׁר עָשָׂ֣ה מֹשֶׁ֗ה כִּ֣י עַד הַ/יָּמִ֤ים הָ/הֵ֨מָּה֙ הָי֤וּ בְנֵֽי יִשְׂרָאֵל֙ מְקַטְּרִ֣ים ל֔/וֹ וַ/יִּקְרָא ל֖/וֹ נְחֻשְׁתָּֽן׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/004.yaml
  text: He removed the high places[a], shattered the pillars, cut down the Asherah, and crushed to pieces the bronze serpent that Moses had made, because until those days the sons of Israel had been burning incense to it[c][b]; and it was called Nehushtan.
  footnotes:
  - marker: a
    text: Or 'cut down the Asherah pole' or 'cut down the sacred pole.'
    reason: lexical_alternative
  - marker: b
    text: Nehushtan is likely a wordplay on 'bronze' and may mean something like 'a mere piece of bronze.'
    reason: cultural_note
  - marker: c
    text: Or 'he called it Nehushtan.' The Hebrew does not make the subject explicit in a way that must be carried over into English.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 산당들을 제거하고, 기둥들을 부수고, 아세라를 찍어 버리고, 모세가 만든 놋뱀을 산산조각 냈습니다. 이는 그때까지 이스라엘 자손이 그것에게 향을 피워 바쳤기 때문이며, 그것은 느후스단이라고 불렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵסִיר
  english_pob_choice: removed
  chosen_korean: 제거하고
  alternatives_korean:
  - 치우고
  - 없애고
  lexicon: HALOT
  rationale: 제의적 개혁 문맥에서 단순 이동보다 권위 있게 없애는 뜻을 살리기에 적절합니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들을
  alternatives_korean:
  - 높은 곳들을
  - 산당
  lexicon: HALOT
  rationale: 고대 이스라엘의 지역 제의 장소를 가리키는 통용 용어를 살렸습니다.
- source_word: הַמַּצֵּבֹת
  english_pob_choice: the pillars
  chosen_korean: 기둥들을
  alternatives_korean:
  - 우상 기둥들을
  - 세운 돌기둥들을
  lexicon: HALOT
  rationale: 문맥상 제의용 세움돌/기둥을 가리키지만, 본문은 간결하게 ‘기둥들’로 처리해 파괴 행위를 자연스럽게 전달합니다.
- source_word: וְכָרַת אֶת הָאֲשֵׁרָה
  english_pob_choice: cut down the Asherah
  chosen_korean: 아세라를 찍어 버리고
  alternatives_korean:
  - 아세라 목상을 찍어 버리고
  - 아세라 기둥을 찍어 버리고
  lexicon: HALOT
  rationale: WLC가 단수형을 사용하므로 한국어도 대상 자체를 직접 살려 ‘아세라’를 유지했습니다. 동시에 ‘찍어 버리다’로 물리적 파괴를 분명히 했습니다.
- source_word: נְחַשׁ הַנְּחֹשֶׁת
  english_pob_choice: the bronze serpent
  chosen_korean: 놋뱀
  alternatives_korean:
  - 놋으로 만든 뱀
  - 청동 뱀
  lexicon: HALOT
  rationale: 전통적으로도 널리 쓰이는 간결한 표현이며, ‘놋’은 문맥상 금속 재질을 자연스럽게 드러냅니다.
- source_word: כִתַּת
  english_pob_choice: crushed to pieces
  chosen_korean: 산산조각 냈습니다
  alternatives_korean:
  - 가루로 만들었습니다
  - 부수어 놓았습니다
  lexicon: HALOT
  rationale: 강한 파괴 동사를 살리되, 현대 한국어에서 매우 자연스럽고 격렬한 파괴를 나타내는 표현을 택했습니다.
- source_word: מְקַטְּרִים לוֹ
  english_pob_choice: had been burning incense to it
  chosen_korean: 그것에게 향을 피워 바쳤기 때문이며
  alternatives_korean:
  - 그것에게 분향했기 때문이며
  - 그것에 향을 피웠기 때문이며
  lexicon: HALOT
  rationale: 여기서는 단순 향 피우기가 아니라 우상/제의 행위를 가리키므로 ‘향을 피워 바치다’로 제의적 성격을 드러냈습니다.
theological_decisions:
- issue: אֲשֵׁרָה의 번역
  chosen_reading: 아세라
  alternative_readings:
  - 아세라 목상
  - 아세라 기둥
  rationale: 본문은 물리적으로 ‘찍어 버리는’ 대상을 말하지만, 원어의 종교사적 용어를 보존하기 위해 음역을 유지했습니다.
  doctrine_reference: Translation philosophy 3, 5
- issue: וַיִּקְרָא לוֹ נְחֻשְׁתָּן의 주어 처리
  chosen_reading: 그것은 느후스단이라고 불렸습니다
  alternative_readings:
  - 그가 그것을 느후스단이라고 불렀습니다
  - 사람들이 그것을 느후스단이라고 불렀습니다
  rationale: 히브리어는 주어를 명시적으로 고정하지 않으므로, 해석을 덧씌우지 않는 수동형이 가장 안전합니다.
  doctrine_reference: Translation philosophy 3
