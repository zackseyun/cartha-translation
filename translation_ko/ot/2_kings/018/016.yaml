  alternatives_korean:
  - 주었습니다
  - 넘겨주었습니다
  - 바쳤습니다
  lexicon: HALOT
  rationale: 제거한 성전 부속물을 앗수르 왕에게 넘기는 행위를 자연스럽게 드러내는 서술형 동사로 옮겼습니다.
