  source_fidelity: 히브리어 본문의 시간 표현, 히스기야의 행위(קִצַּץ), 성전 문들 및 אָמְנוֹת, 이전에 입힌 행위(צִפָּה), 앗수르 왕에게 주었다는 서술을 충실히 옮겼습니다. ‘잘라 내어’는 다소 거친 물리적 행위를 보존하며, 무엇을 입혔는지 본문이 명시하지 않는 점도 불필요하게 보충하지 않았습니다.
  naturalness: ‘그때에 … 주었습니다’는 현대 표준 한국어의 정중한 성경 서술체로 자연스럽습니다. ‘문설주들’은 문맥에 적합하며, ‘입혀 두었던’은 과거의 덧입힘을 자연스럽게 나타냅니다.
