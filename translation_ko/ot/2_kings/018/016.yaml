  - 야훼의 궁전
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 예루살렘 성전을 뜻하므로 ‘성전’이 적절하며, יְהוָה는 프로젝트 기본어에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיִּתְּנֵם
