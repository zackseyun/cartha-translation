source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗יא קִצַּ֨ץ חִזְקִיָּ֜ה אֶת דַּלְת֨וֹת הֵיכַ֤ל יְהוָה֙ וְ/אֶת הָ/אֹ֣מְנ֔וֹת אֲשֶׁ֣ר צִפָּ֔ה חִזְקִיָּ֖ה מֶ֣לֶךְ יְהוּדָ֑ה וַֽ/יִּתְּנֵ֖/ם לְ/מֶ֥לֶךְ אַשּֽׁוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/016.yaml
  text: At that time Hezekiah cut off the doors of the temple of Yahweh and the doorposts that Hezekiah king of Judah had overlaid[a], and gave them to the king of Assyria.
  footnotes:
  - marker: a
    text: Or 'the doorframes' or 'the pillars'; the Hebrew term is rare and may refer more broadly to structural supports associated with the temple doors.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 히스기야는 야훼의 성전 문들과 유다 왕 히스기야가 입혀 두었던 문설주들[a]을 잘라 내어 앗수르 왕에게 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘문틀들’ 혹은 ‘기둥들’. 히브리어 단어가 드물어 성전 문과 관련된 구조물을 더 넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  english_pob_choice: At that time
  chosen_korean: 그때에
  alternatives_korean:
  - 그때에
  - 그 시기에
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 관용구로, 현대 한국어에서 자연스럽고 간결한 시간 표현을 선택했습니다.
- source_word: קִצַּץ
  english_pob_choice: cut off
  chosen_korean: 잘라 내어
  alternatives_korean:
  - 잘라 내어
  - 잘라서 치워
  - 벗겨 내어
  lexicon: HALOT
  rationale: 단순한 ‘떼다’보다, 성전 문짝과 문설주의 금속 입힘을 제거하는 물리적 행위를 분명하게 드러내는 표현입니다.
- source_word: הָאֹמְנוֹת
  english_pob_choice: the doorposts
  chosen_korean: 문설주들
  alternatives_korean:
  - 문설주들
  - 문틀들
  - 기둥들
  lexicon: HALOT
  rationale: 희귀어로서 문과 연결된 구조물을 가리키며, 본문 맥락상 ‘문설주’가 가장 무난하지만, 히브리어의 폭을 남기기 위해 각주를 달았습니다.
- source_word: הֵיכַל יְהוָה
  english_pob_choice: the temple of Yahweh
  chosen_korean: 야훼의 성전
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 궁전
  lexicon: HALOT
  rationale: הֵיכָל은 문맥상 예루살렘 성전을 뜻하므로 ‘성전’이 적절하며, יְהוָה는 프로젝트 기본어에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיִּתְּנֵם
  english_pob_choice: and gave them
  chosen_korean: 주었습니다
  alternatives_korean:
  - 주었습니다
  - 넘겨주었습니다
  - 바쳤습니다
  lexicon: HALOT
  rationale: 제거한 성전 부속물을 앗수르 왕에게 넘기는 행위를 자연스럽게 드러내는 서술형 동사로 옮겼습니다.
theological_decisions:
- issue: יהוה / YHWH의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 야훼
  - 주님
  rationale: 본문이 직접 사용하는 언약명 יְהוָה를 한국어 본문에서도 가려지지 않게 드러내기 위해 기본 표기를 따랐습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
