  chosen_korean: 그때에
  alternatives_korean:
  - 그때에
  - 그 시기에
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 관용구로, 현대 한국어에서 자연스럽고 간결한 시간 표현을 선택했습니다.
- source_word: קִצַּץ
  english_pob_choice: cut off
