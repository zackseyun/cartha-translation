base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/025.yaml
  text: Now[a], was it apart from Yahweh that I came up against this place to destroy it? Yahweh said to me, ‘Go up against this land and destroy it.’
  footnotes:
  - marker: a
    text: Or 'without the LORD' or 'independently of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 야훼 없이[a] 이곳을 멸하려고 올라왔느냐? 야훼께서 나에게 ‘이 땅으로 올라가 그것을 멸하라’라고 말씀하셨다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼와 무관하게’, ‘야훼와 독립하여’.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲמִבַּלְעֲדֵי
  english_pob_choice: was it apart from
  chosen_korean: 야훼 없이
  alternatives_korean:
  - 야훼와 상관없이
  - 야훼를 떠나
  - 독자적으로
  lexicon: HALOT
  rationale: 수사적 질문으로서 ‘~없이/없이서’의 뜻을 담으며, 전후 문맥의 ‘야훼께서 말씀하셨다’는 주장과 연결되도록 자연스럽게 옮겼습니다.
- source_word: הַמָּקוֹם הַזֶּה
  english_pob_choice: this place
  chosen_korean: 이곳
  alternatives_korean:
  - 이 장소
  - 이 자리
  - 이 곳
  lexicon: HALOT
  rationale: 문맥상 예루살렘을 가리키더라도 히브리어의 일반 명사 ‘장소/곳’을 보존하기 위해 좁혀 번역하지 않고 중립적인 ‘이곳’을 택했습니다.
- source_word: לְהַשְׁחִיתוֹ / וְהַשְׁחִיתָהּ
  english_pob_choice: to destroy it / and destroy it
  chosen_korean: 멸하려고 / 멸하라
  alternatives_korean:
  - 파괴하려고 / 파괴하라
  - 없애려고 / 없애라
  - 황폐하게 하려고 / 황폐하게 하라
  lexicon: HALOT
  rationale: שׁחת의 강한 파괴 의미를 살리되 한국어에서는 반복을 통해 같은 어근의 연결을 드러내기 위해 ‘멸하다’를 일관되게 사용했습니다.
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가
  alternatives_korean:
  - 올라서
  - 진격하여
  - 치러 올라가
  lexicon: HALOT
  rationale: עלה의 기본 의미를 살리면서 군사적 맥락도 유지하기 위해 ‘올라가’로 옮겼습니다.
theological_decisions:
- issue: 여호와의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 יְהוָה가 직접 나오므로 프로젝트 기본값에 따라 고유한 언약 이름을 표기했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘이곳’과 ‘저 땅’의 범위
  chosen_reading: 원문의 두 표현을 각각 ‘이곳’과 ‘저 땅’으로 유지
  alternative_readings:
  - 예루살렘
  - 유다
  - 이 성
  rationale: 본문은 מָקוֹם과 אֶרֶץ를 구별해 사용하므로, 해석을 미리 좁히지 않고 군사적 위협의 직접성을 보존했습니다.
  doctrine_reference: 'Translation philosophy: Original-language primacy; Never paraphrase beyond what the source text warrants.'
