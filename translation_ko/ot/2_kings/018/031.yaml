  text: 'Do not listen to Hezekiah[a], for this is what the king of Assyria says: Make peace with me and come out to me, and let each man eat from his own vine and each from his own fig tree, and let each man drink the water of his own cistern,'
  footnotes:
  - marker: a
    text: Hebrew literally, 'Make with me a blessing,' an idiom for making peace or coming to terms.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야의 말을 듣지 마십시오. 아시리아 왕이 이렇게 말합니다. "나와 화평을 맺고 내게로 나오십시오. 그러면 너희 각자는 자기 포도나무에서 먹고, 자기 무화과나무에서 먹으며, 너희 각자는 자기 구덩이의 물을 마시게 될 것입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 '나와 복을 이루라'로, 평화나 화친을 맺으라는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַֽל תִּשְׁמְעוּ אֶל
  english_pob_choice: Do not listen to
  chosen_korean: 듣지 마십시오
  alternatives_korean:
  - 귀 기울이지 마십시오
  - 순종하지 마십시오
  lexicon: HALOT
  rationale: שמע with אֶל의 기본적 의미를 살려 청중에게 말을 ‘듣지 말라’는 직접 경고로 옮겼습니다. '순종하다'는 함의는 있지만, 본문은 먼저 경청을 차단하는 표현입니다.
- source_word: עֲשׂוּ אִתִּי בְרָכָה
  english_pob_choice: Make peace with me
  chosen_korean: 나와 화평을 맺으십시오
  alternatives_korean:
  - 나와 축복을 만드십시오
  - 나와 타협하십시오
  - 나와 화친하십시오
  lexicon: HALOT
  rationale: 직역하면 '나와 복을 이루다'이지만, 문맥상 앗수르 왕에게 유리한 조건으로 항복·타협하라는 회유이므로 ‘화평을 맺다’로 풀었습니다. 전통 교회어보다 문맥의 협상 뉘앙스를 분명히 합니다.
- source_word: אִישׁ גַּפְנוֹ / אִישׁ תְּאֵנָתוֹ / אִישׁ מֵי בוֹרוֹ
  english_pob_choice: each man eat from his own vine ... and let each man drink the water of his own cistern
  chosen_korean: 너희 각자는 자기 포도나무에서 먹고, 자기 무화과나무에서 먹으며, 너희 각자는 자기 구덩이의 물을 마시게 될 것입니다
  alternatives_korean:
  - 각 사람은 자기 포도나무와 무화과나무에서 먹고 자기 우물의 물을 마시게 될 것입니다
  - 각자 자기 포도나무, 무화과나무, 우물의 물을 누리게 될 것입니다
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 ‘각자’로 살렸고, גפן/תאנה의 관용적 병렬을 그대로 유지했습니다. בוֹר은 '우물'보다 저장 구덩이/저수조인 '구덩이'가 원뜻에 가깝습니다.
theological_decisions:
- issue: 분배적 אִישׁ의 성별 표지
  chosen_reading: 너희 각자 / 각자는
  alternative_readings:
  - 각 사람은
  - 모든 사람은
  rationale: 히브리어는 남성 단수 אִישׁ을 반복해 분배적으로 사용합니다. 한국어에서는 자연스러운 현대 문체를 유지하면서도 대표성 있는 개별화를 살리기 위해 '각자'를 사용했습니다.
  doctrine_reference: Translation philosophy §4
- issue: עֲשׂוּ אִתִּי בְרָכָה의 함의
  chosen_reading: 화평을 맺다
  alternative_readings:
  - 타협하다
  - 화친하다
  - 복을 이루다
  rationale: 이 표현은 신학적 용어가 아니라 정치·군사적 회유입니다. 본문이 드러내는 항복 조건을 과도하게 약화하지 않도록, 현대 한국어에서 분명한 협상·평화 제안을 뜻하는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §3
