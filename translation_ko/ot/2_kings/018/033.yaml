  text: הַ/הַצֵּ֥ל הִצִּ֛ילוּ אֱלֹהֵ֥י הַ/גּוֹיִ֖ם אִ֣ישׁ אֶת אַרְצ֑/וֹ מִ/יַּ֖ד מֶ֥לֶךְ אַשּֽׁוּר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/033.yaml
  text: Have the gods of the nations ever delivered[a], each one, his land from the hand of the king of Assyria?
  footnotes:
  - marker: a
    text: 'Hebrew uses an emphatic construction: literally, ''Have the gods of the nations surely delivered...?'''
    reason: lexical_alternative
translation:
  language: ko
  text: “열국의 신들이 각기 자기 땅을 앗시리아 왕의 손에서 정말 구출해 낸 적이 있기라도 합니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 강조형 구문을 사용하므로, 직역하면 ‘열국의 신들이 정말로 구출해 냈단 말이냐?’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֵּל הִצִּילוּ
  english_pob_choice: Have ... ever delivered
  chosen_korean: 정말 구출해 낸 적이 있기라도 합니까
  alternatives_korean:
  - 구출해 낸 적이 있습니까
  - 전혀 구출해 내지 못했습니까
  lexicon: HALOT
  rationale: נצל의 강조형과 수사적 질문을 한국어에서 자연스럽게 살리기 위해 ‘정말 … 있기라도 합니까’로 압박감을 드러냈습니다.
- source_word: אֱלֹהֵי הַגּוֹיִם
  english_pob_choice: the gods of the nations
  chosen_korean: 열국의 신들
  alternatives_korean:
  - 민족들의 신들
  - 나라들의 신들
  lexicon: HALOT
  rationale: 본문의 대비 효과를 유지하면서도 한국어에서 자연스러운 집합 표현인 ‘열국의 신들’로 옮겼습니다.
- source_word: אִישׁ אֶת אַרְצֹו
  english_pob_choice: each one, his land
  chosen_korean: 각기 자기 땅
  alternatives_korean:
  - 각자 자기 땅
  - 각 신이 자기 땅
  lexicon: HALOT
  rationale: אישׁ의 분배적 용법을 한국어의 ‘각기’로 반영했고, 소유격은 ‘자기 땅’으로 자연스럽게 처리했습니다.
- source_word: מִיַּד מֶלֶךְ אַשּׁוּר
  english_pob_choice: from the hand of the king of Assyria
  chosen_korean: 앗시리아 왕의 손에서
  alternatives_korean:
  - 앗수르 왕의 손에서
  - 앗시리아 왕의 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘손에서’를 보존해 권세·지배의 이미지를 살렸고, 고유명사는 외래어 표기법에 따라 ‘앗시리아’로 옮겼습니다.
theological_decisions:
- issue: 이방 신들의 무능을 조롱하는 수사적 질문의 톤
  chosen_reading: 번역문도 반어적 도전의 어조를 유지해, 앗시리아 사신의 오만한 논지를 그대로 드러냈습니다.
  alternative_readings:
  - 더 평서문에 가까운 완곡한 표현
  - 단순한 정보 질의처럼 중화된 표현
  rationale: 본문은 신들의 실패를 암시하는 질문이므로, 한국어에서도 조롱과 압박의 뉘앙스가 약해지지 않도록 했습니다.
  doctrine_reference: 왕하 18:33의 서사적·수사적 기능
- issue: ‘손’의 문자성과 관용성
  chosen_reading: ‘손에서’를 직역적으로 유지해 지배·권세의 성경적 관용구를 보존했습니다.
  alternative_readings:
  - 권세에서
  - 힘에서
  rationale: 히브리어의 전형적 구문을 약화시키지 않기 위해 이미지와 의미를 함께 살렸습니다.
  doctrine_reference: 성경 히브리어 관용구의 보존
