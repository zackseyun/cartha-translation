  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם רַב שָׁקֵ֗ה הַ/עַ֨ל אֲדֹנֶ֤י/ךָ וְ/אֵלֶ֨י/ךָ֙ שְׁלָחַ֣/נִי אֲדֹנִ֔/י לְ/דַבֵּ֖ר אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה הֲ/לֹ֣א עַל הָ/אֲנָשִׁ֗ים הַ/יֹּֽשְׁבִים֙ עַל הַ֣/חֹמָ֔ה לֶ/אֱכֹ֣ל אֶת חרי/הם וְ/לִ/שְׁתּ֛וֹת אֶת שיני/הם עִמָּ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/027.yaml
  text: Then the Rabshakeh said to them[a], “Has my master sent me to speak these words only to your master and to you? Has he not also sent me to the men sitting on the wall, who will eat their own dung and drink their own urine with you?”
  footnotes:
  - marker: a
    text: 'Hebrew literally uses coarse siege imagery: ''eat their dung and drink their urine.'' Some manuscripts/traditions preserve euphemistic wording for the second expression, often rendered ''drink the water of their feet.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 랍사게가 그들에게 말했습니다. “내 주가 나를 보내어 이 말들을 너희 주와 너희에게만 말하게 한 것이냐? 그가 성벽 위에 앉아 있는 그 사람들에게도 나를 보내지 않았느냐? 그들은 너희와 함께 자기 똥을 먹고 자기 오줌을 마시게 될 것이다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 포위전의 거친 이미지를 문자 그대로 사용합니다. 일부 사본/전승에는 두 번째 표현이 완곡하게 보존되어 ‘발의 물을 마시다’로 옮기기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 랍사케
  - 라브사게
  lexicon: HALOT
  rationale: 본문에서는 고유명사처럼 기능하는 아시리아 관직 호칭이므로, 설명적 번역보다 음역을 유지하는 것이 서사 흐름과 POB의 영어 처리에 맞습니다.
- source_word: אֲדֹנֶיךָ
  english_pob_choice: your master
  chosen_korean: 너희 주
  alternatives_korean:
  - 너희 상전
  - 너희 주인
  lexicon: HALOT
  rationale: 정치적·대항적 خطاب에서의 주인/상전보다, 상대편 우두머리를 가리키는 호칭으로서 ‘주’가 가장 자연스럽고 원문의 관계를 보존합니다.
- source_word: הַיֹּשְׁבִים עַל הַחֹמָה
  english_pob_choice: the men sitting on the wall
  chosen_korean: 성벽 위에 앉아 있는 그 사람들
  alternatives_korean:
  - 성벽에 앉아 있는 사람들
  - 성벽 위에 있는 사람들
  lexicon: HALOT
  rationale: 성벽 위에 앉아 있는 모습은 포위전의 긴박함을 드러내므로, 단순한 위치 정보보다 장면성을 살려 옮겼습니다.
- source_word: חרי/הם
  english_pob_choice: their own dung
  chosen_korean: 자기 똥
  alternatives_korean:
  - 그들의 배설물
  - 자기 똥오줌
  lexicon: HALOT
  rationale: 히브리어의 저속한 포위전 조롱을 약화하지 않기 위해 완곡어보다 직접적인 표현을 택했습니다.
- source_word: שיני/הם
  english_pob_choice: their own urine
  chosen_korean: 자기 오줌
  alternatives_korean:
  - 자기 소변
  - 그들의 오줌
  lexicon: HALOT
  rationale: 본문의 잔혹한 위협을 분명히 드러내기 위해 일상적이고 노골적인 한국어를 사용했습니다.
