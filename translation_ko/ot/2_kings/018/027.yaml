  naturalness: ‘성벽 위에 앉아 있으면서’와 ‘그 사람들에게도 나를 보내지 않았느냐?’의 결합은 현대 표준 한국어에서 자연스럽습니다. 원문의 의도적인 모욕성과 포위전 조롱을 보존하기 위해 ‘똥’과 ‘오줌’을 유지하되, 전체 문장은 합쇼체 서술과 인용문 문체에 맞추었습니다.
