  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֵ֣יךְ תָּשִׁ֗יב אֵ֠ת פְּנֵ֨י פַחַ֥ת אַחַ֛ד עַבְדֵ֥י אֲדֹנִ֖/י הַ/קְּטַנִּ֑ים וַ/תִּבְטַ֤ח לְ/ךָ֙ עַל מִצְרַ֔יִם לְ/רֶ֖כֶב וּ/לְ/פָרָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/024.yaml
  text: How then can you turn back the face of a single captain among the least of my master's servants[b][a], when you trust in Egypt for chariots and horsemen?
  footnotes:
  - marker: a
    text: Or 'turn back the face of,' a Hebrew idiom meaning 'repel' or 'withstand.'
    reason: lexical_alternative
  - marker: b
    text: '''Captain'' could also be rendered ''governor'' or ''official''; the Hebrew term can denote a provincial ruler or military officer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 어떻게 너는 내 주인의 가장 낮은 신하들 가운데 한 사람인 한 사령관의 얼굴을 물리칠 수 있겠느냐? 네가 이집트를 의지하여 병거와 기병을 바라고 있으니 말이다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 직역하면 ‘얼굴을 되돌리다’이지만 여기서는 ‘물리치다/막아내다’의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘사령관’에 해당하는 히브리어는 ‘총독’이나 ‘관원’으로도 옮길 수 있으며, 더 넓게는 지방 통치자나 군사 지휘관을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּשִׁיב אֵת פְּנֵי
  english_pob_choice: turn back the face of / repulse
  chosen_korean: 얼굴을 물리칠 수 있겠느냐
  alternatives_korean:
  - 물리칠 수 있겠느냐
  - 되돌려 보낼 수 있겠느냐
  - 대항할 수 있겠느냐
  lexicon: HALOT
  rationale: 히브리어 관용구는 문자 그대로보다 ‘거부하다/물리치다/막아내다’의 뜻이므로, 한국어에서는 자연스럽게 군사적 대결의 의미를 드러내는 동사로 옮겼습니다.
- source_word: פַחַת
  english_pob_choice: captain
  chosen_korean: 사령관
  alternatives_korean:
  - 관원
  - 총독
  - 장교
  lexicon: HALOT
  rationale: 문맥상 앗수르의 하위 지휘관 또는 통치 권한을 가진 인물을 가리키므로, 군사적 뉘앙스를 살리면서도 과도하게 특정되지 않는 표현을 택했습니다.
- source_word: עַבְדֵי אֲדֹנִי הַקְּטַנִּים
  english_pob_choice: the least of my master's servants
  chosen_korean: 내 주인의 가장 낮은 신하들 가운데 한 사람
  alternatives_korean:
  - 내 주인의 가장 낮은 종들 가운데 한 사람
  - 내 주인의 가장 하찮은 신하들 가운데 한 사람
  - 내 주인의 하급 신하들 가운데 한 사람
  lexicon: HALOT
  rationale: ‘가장 낮은’은 지위의 열등함을, ‘한 사람’은 אַחַד의 단수 강조를 살려 상대를 극도로 낮추는 조롱의 어조를 반영합니다.
- source_word: לְרֶכֶב וּלְפָרָשִׁים
  english_pob_choice: for chariots and horsemen
  chosen_korean: 병거와 기병을
  alternatives_korean:
  - 병거와 말을 탄 자들을
  - 병거와 기병대를
  - 전차와 기병을
  lexicon: HALOT
  rationale: 군사적 지원 수단을 가리키는 표현이므로, 한국어 성경에서 익숙하면서도 원문의 병렬 구조를 보존하는 표현으로 옮겼습니다.
