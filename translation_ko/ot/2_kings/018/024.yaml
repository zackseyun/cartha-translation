  source_fidelity: 히브리어의 수사 의문문, 하급 관리 한 명이라는 경멸적 강조, 이집트의 병거와 기병에 대한 의존을 대체로 반영합니다. 다만 ‘얼굴을 물리치다’는 한국어에서 부자연스럽고, 주석의 직역과 본문의 관용적 의미가 충돌합니다. לְרֶכֶב וּלְפָרָשִׁים는 이집트에 의지하는 목적 또는 기대하는 군사 자원을 나타내므로 ‘얻으려고’로 명시하는 것이 적절합니다.
  naturalness: ‘내 주인의 가장 낮은 신하들 가운데 한 사람인 한 사령관’은 ‘한 사람’이 중복되어 어색하며, ‘얼굴을 물리치다’는 현대 표준 한국어의 자연스러운 군사 표현이 아닙니다. ‘내 주인의 가장 낮은 신하들 가운데 한 명에 불과한 지휘관’과 ‘물리치다’가 합쇼체의 조롱하는 수사 의문문에 자연스럽습니다.
  terminology: פַחַת는 군사·행정 양면의 직위를 가리킬 수 있으므로 본문에서는 문맥상 ‘지휘관’을 사용하고, ‘총독’ 또는 ‘관원’이라는 가능성은 주석에서 보존합니다. רכב와 פרשים는 ‘병거와 기병’으로 유지합니다.
