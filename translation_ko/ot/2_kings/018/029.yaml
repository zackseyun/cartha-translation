reference: 2 Kings 18:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר הַ/מֶּ֔לֶךְ אַל יַשִּׁ֥יא לָ/כֶ֖ם חִזְקִיָּ֑הוּ כִּי לֹ֣א יוּכַ֔ל לְ/הַצִּ֥יל אֶתְ/כֶ֖ם מִ/יָּדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/029.yaml
  text: 'Thus says the king: Do not let Hezekiah deceive you[b][a], for he will not be able to deliver you from his hand.'
  footnotes:
  - marker: a
    text: Or 'mislead you.' The Hebrew verb can mean to lead astray or deceive.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from his hand,' an idiom for being under someone's power. The parallel in Isaiah 36:14 reads 'from my hand.'
    reason: textual_variant
translation:
  language: ko
  text: 「왕이 이렇게 말합니다. 히스기야가 너희를 속이지 못하게 하십시오. 그가 너희를 그의 손에서 구해 낼 수는 없을 것입니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘속이다’뿐 아니라 ‘그릇된 길로 이끌다, 현혹하다’는 뜻도 가집니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 손에서’는 누군가의 권력 아래 있다는 히브리어 관용구입니다. 이사야 36:14의 평행구는 ‘내 손에서’라고 읽습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  english_pob_choice: Thus says the king
  chosen_korean: 「왕이 이렇게 말합니다」
  alternatives_korean:
  - 「왕이 말합니다」
  - 「이렇게 왕이 말합니다」
  lexicon: HALOT
  rationale: 공식 선포문의 도입부를 한국어답게 살리되, 왕의 발화가 현재형 선언으로 들리도록 했습니다. 주어를 앞세운 직역보다 자연스러운 공식 발화체를 택했습니다.
- source_word: אַל יַשִּׁיא לָכֶם
  english_pob_choice: Do not let Hezekiah deceive you
  chosen_korean: 히스기야가 너희를 속이지 못하게 하십시오
  alternatives_korean:
  - 히스기야가 너희를 미혹하지 못하게 하십시오
  - 히스기야가 너희를 속이지 못하게 하라
  lexicon: HALOT
  rationale: יַשִּׁיא의 ‘속이다/그릇된 확신을 주다’는 뜻을 한국어의 ‘속이다’로 직접 옮겼습니다. ‘미혹하다’는 종교적 어감이 강해 군사적 선동 경고의 뉘앙스를 약화시킬 수 있어 피했습니다.
- source_word: לֹא יוּכַל לְהַצִּיל
  english_pob_choice: he will not be able to deliver
  chosen_korean: 그가 … 구해 낼 수는 없을 것입니다
  alternatives_korean:
  - 그가 … 구원할 수는 없을 것입니다
  - 그가 … 건져 낼 수는 없을 것입니다
  lexicon: HALOT
  rationale: לְהַצִּיל의 구출·구조 의미를 한국어의 ‘구해 내다’로 자연스럽게 살렸습니다. ‘구원하다’는 신학적 색채가 더 강해 여기의 정치·군사적 문맥을 덜 직접적으로 드러냅니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손아귀에서
  - 그의 권세에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 가능한 한 그대로 유지해, 상대의 힘 아래 있다는 비유를 살렸습니다. 본문의 언어적 이미지를 보존하기 위해 ‘권세’보다 ‘손’이 적절합니다.
theological_decisions:
- issue: 왕의 직접 발화 형식과 경멸적 명령의 높임말 처리
  chosen_reading: 한국어 서술은 합쇼체로 두되, 왕의 선포문 안의 금지명령은 ‘못하게 하십시오’로 옮겨 직접적 권위를 표현했습니다.
  alternative_readings:
  - 직설형 명령으로 번역
  - 더 완곡한 서술형으로 번역
  rationale: 본문은 아시리아 왕의 공적 위협 발언이므로, 공문체 같은 공식성은 유지하되 과도하게 구어적이지 않게 처리했습니다. 청중을 향한 금지의 압박을 드러내려면 단순 서술보다 명령적 뉘앙스가 필요합니다.
  doctrine_reference: 번역 원칙 §1(원문 우선) 및 §4(화행 기능 보존)
