  to: 「왕이 이렇게 말합니다. 히스기야가 너희를 속이지[a] 못하게 하십시오. 히스기야는 너희를 왕의 손에서[b] 구해 낼 수 없을 것입니다.」
  rationale: 후반절의 대명사를 이름과 직함으로 바꾸어, 히스기야와 왕이라는 서로 다른 지시 대상을 한국어에서 명확히 했습니다. 이는 히브리어의 문맥상 의미를 풀어 준 것이며, ‘손’이라는 원문의 비유는 보존합니다. 또한 각주 표지를 해당 단어와 구절에 직접 배치했습니다.
