  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּדְבַּק֙ בַּֽ/יהוָ֔ה לֹא סָ֖ר מֵ/אַֽחֲרָ֑י/ו וַ/יִּשְׁמֹר֙ מִצְוֺתָ֔י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/006.yaml
  text: He held fast to Yahweh; he did not turn away from following him[a], and he kept his commandments, which Yahweh had commanded Moses.
  footnotes:
  - marker: a
    text: Hebrew 'clung to' or 'held fast to'; the verb conveys strong covenant loyalty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 야훼께 굳게 붙들렸고, 그를 따르던 데서 물러서지 않았으며, 야훼께서 모세에게 명령하신 그분의 계명을 지켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 דבק는 단순히 ‘붙다’보다 언약적 충성의 강한 결속을 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדְבַּק
  english_pob_choice: held fast
  chosen_korean: 굳게 붙들렸고
  alternatives_korean:
  - 달라붙었고
  - 굳게 매달렸고
  - 충실히 따랐고
  lexicon: HALOT
  rationale: דבק는 단순한 물리적 부착보다 언약적 충성과 밀착을 드러내므로, 자연스러운 한국어로 ‘굳게 붙들리다’가 그 힘을 잘 살립니다.
- source_word: בַּיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC / POB doctrine
  rationale: 원문의 여호와 이름을 직접 반영하기 위해 POB 기본값인 ‘야훼’를 유지했습니다.
- source_word: לֹא סָר מֵאַחֲרָיו
  english_pob_choice: he did not turn away from following him
  chosen_korean: 그를 따르던 데서 물러서지 않았으며
  alternatives_korean:
  - 그의 뒤를 따르던 데서 떠나지 않았으며
  - 그를 따르는 데서 돌아서지 않았으며
  - 그의 뒤에서 물러서지 않았으며
  lexicon: HALOT
  rationale: מן + אחריו는 단순한 이동이 아니라 추종과 충성에서 이탈하지 않음을 뜻하므로, ‘따르던 데서 물러서지 않다’로 옮겼습니다.
- source_word: וַיִּשְׁמֹר מִצְוֺתָיו
  english_pob_choice: he kept his commandments
  chosen_korean: 그분의 계명을 지켰습니다
  alternatives_korean:
  - 그분의 명령들을 지켰습니다
  - 그분의 계명들을 지켰습니다
  - 그의 명령을 지켰습니다
  lexicon: HALOT
  rationale: מִצְוֺתָיו는 율법적·언약적 용법의 ‘계명들’이 자연스러워 ‘계명’을 유지했고, 문장 흐름상 한국어에서는 소유 대명사를 받는 ‘그분의’가 가장 분명합니다.
theological_decisions:
- issue: 야훼 이름의 표기
  chosen_reading: 본문에서 יְהוָה를 ‘야훼’로 직접 표기합니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 열왕기하 18:6의 원문은 신명기적 역사서에서 언약 이름을 직접 사용하므로, 전통적 대체어보다 स्रोत 직결 표기를 따르는 것이 의미를 더 투명하게 드러냅니다.
  doctrine_reference: 'POB contested terms: YHWH'
- issue: ‘그분의’의 지시 대상
  chosen_reading: 마지막 절의 ‘그분의 계명’은 앞의 야훼를 가리키도록 문맥을 정리했습니다.
  alternative_readings:
  - 그의 계명
  - 야훼의 계명
  rationale: 히브리어는 대명사로 연결되지만 한국어에서는 반복을 줄이면서도 지시 대상이 흐려지지 않도록 ‘그분의’로 처리했습니다.
  doctrine_reference: Korean discourse clarity
