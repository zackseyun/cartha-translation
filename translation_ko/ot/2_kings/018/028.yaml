  yaml_path: translation/ot/2_kings/018/028.yaml
  text: Then the Rabshakeh stood and called out in a loud voice in Judean[a], and he spoke and said, “Hear the word of the great king, the king of Assyria.”
  footnotes:
  - marker: a
    text: Or “in Hebrew.” The Hebrew term more specifically denotes the language of Judah.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 랍사게가 서서 유다 말로[a] 큰 소리로 외쳐 말했습니다. “위대한 왕이신 앗수르 왕의 말을 들으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유다 말’은 본문이 가리키는 언어적 표현을 살린 것입니다. 이를 ‘히브리어’로 옮길 수도 있으나, 원문은 더 구체적으로 유다의 언어를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 랍-사게
  - 대장 술 맡은 관원
  lexicon: 고유명사/관직 호칭
  rationale: 본문의 아시리아 관직명은 음역으로 처리하는 것이 서술의 역사적 특수성을 가장 잘 보존합니다. 한국어에서 통용되는 형태인 ‘랍사게’를 채택했습니다.
- source_word: יְהוּדִית
  english_pob_choice: in Judean
  chosen_korean: 유다 말로
  alternatives_korean:
  - 유대 말로
  - 히브리어로
  - 유다의 언어로
  lexicon: HALOT
  rationale: 문맥상 예루살렘 사람들이 알아듣는 ‘유다의 언어/말’이라는 뜻이므로, 후대의 포괄적 용례인 ‘히브리어’보다 원문의 역사적 뉘앙스를 살린 ‘유다 말로’가 적절합니다.
- source_word: בְקוֹל גָּדוֹל
  english_pob_choice: in a loud voice
  chosen_korean: 큰 소리로
  alternatives_korean:
  - 큰 음성으로
  - 크게
  lexicon: HALOT
  rationale: 직역투를 피하면서도 ‘큰 소리’라는 구체적 음량의 이미지를 유지했습니다.
- source_word: וַיְדַבֵּר וַיֹּאמֶר
  english_pob_choice: and he spoke and said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하고 이르기를
  - 말하며 이르렀습니다
  lexicon: HALOT
  rationale: 히브리어의 이중 발화 도입을 한국어에서 자연스럽게 정리하되, 반복 강조를 과도하게 늘리지 않도록 하나의 동사로 압축했습니다.
- source_word: הַמֶּלֶךְ הַגָּדוֹל
  english_pob_choice: the great king
  chosen_korean: 그 큰 왕
  alternatives_korean:
  - 위대한 왕
  - 대왕
  lexicon: HALOT
  rationale: 앗수르 왕의 공식 칭호를 반영하되, ‘great’의 직결된 의미를 살려 ‘큰 왕’으로 옮겼습니다. 전통적 ‘대왕’은 한국어 관용이 강해 원문의 호칭 효과가 약해질 수 있습니다.
