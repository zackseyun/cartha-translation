revisions:
- from: 그러자 힐기야의 아들 엘리아김 — 그는 왕궁의 책임자였고 — 서기관 셉나와 아삽의 아들 요아, 기록관이 찢어진 옷을 입은 채 히스기야에게 와서, 랍사게의 말을 전했습니다.[a]
  to: 그러자 왕궁을 맡은 힐기야의 아들 엘리아김과 서기관 셉나와 기록관 아삽의 아들 요아가 옷을 찢은 채 히스기야에게 와서 랍사게의 말을 전했습니다.[a]
  rationale: 원문의 병렬된 세 보고자를 명료하게 제시하고, 엘리아김에게만 붙는 왕궁 관리 직함 및 요아에게만 붙는 기록관 직함을 자연스러운 한국어 어순으로 분명히 했습니다. ‘옷을 찢은 채’는 히브리어의 ‘옷이 찢어진’ 상태를 한국어 성경 문체의 관용적 표현으로 보존합니다. 랍사게는 본문에서 음역으로 유지하고, 각주도 직무를 확정하지 않습니다.
