  - ‘랍-사게’로 분절해 옮기기
  rationale: 본문은 앗수르 관직 칭호를 고유 명칭처럼 사용하므로, 의미를 단정해 풀기보다 음역을 유지하는 편이 원문과 POB의 주석 취지에 더 충실합니다.
  doctrine_reference: 본문 해석과 역사-문헌적 정확성
