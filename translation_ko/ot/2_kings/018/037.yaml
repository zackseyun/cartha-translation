base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/037.yaml
  text: Then Eliakim son of Hilkiah[a], who was over the household, and Shebna the scribe, and Joah son of Asaph, the recorder, came to Hezekiah with their clothes torn and told him the words of the Rabshakeh.
  footnotes:
  - marker: a
    text: Rabshakeh is an Assyrian official title, possibly referring to a high-ranking officer such as a chief cupbearer or spokesman.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 왕궁을 맡은 힐기야의 아들 엘리아김과 서기관 셉나와 기록관 아삽의 아들 요아가 옷을 찢은 채 히스기야에게 와서 랍사게의 말을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘랍사게’는 앗수르의 관직 호칭으로, 수석 술관원이나 대변인 같은 고위 관리를 가리킬 수 있습니다.
    reason: cultural_note
