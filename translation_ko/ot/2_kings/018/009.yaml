source:
  edition: WLC
  text: וַֽ/יְהִ֞י בַּ/שָּׁנָ֤ה הָֽ/רְבִיעִית֙ לַ/מֶּ֣לֶךְ חִזְקִיָּ֔הוּ הִ֚יא הַ/שָּׁנָ֣ה הַ/שְּׁבִיעִ֔ית לְ/הוֹשֵׁ֥עַ בֶּן אֵלָ֖ה מֶ֣לֶךְ יִשְׂרָאֵ֑ל עָלָ֞ה שַׁלְמַנְאֶ֧סֶר מֶֽלֶךְ אַשּׁ֛וּר עַל שֹׁמְר֖וֹן וַ/יָּ֥צַר עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/009.yaml
  text: And it happened in the fourth year of King Hezekiah—which was the seventh year of Hoshea son of Elah[b][a], king of Israel—that Shalmaneser king of Assyria came up against Samaria and besieged it.
  footnotes:
  - marker: a
    text: Or, 'came to pass' for 'it happened.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'went up against Samaria and laid siege to it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야 왕의 넷째 해, 곧 이스라엘 왕 엘라의 아들 호세아의 일곱째 해에 앗수르 왕 살만에셀이 사마리아를 치러 올라와 그곳을 포위하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: …에
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리고 일어났습니다
  lexicon: HALOT
  rationale: 서사 도입 공식으로서 사건 연대를 여는 기능을 살려, 한국어에서는 자연스러운 시점 표지로 처리했습니다.
- source_word: בַּשָּׁנָה הָרְבִיעִית / הַשָּׁנָה הַשְּׁבִיעִית
  english_pob_choice: in the fourth year / the seventh year
  chosen_korean: 넷째 해 / 일곱째 해
  alternatives_korean:
  - 4년째 / 7년째
  - 네 번째 해 / 일곱 번째 해
  lexicon: HALOT
  rationale: 왕 연대기 공식이므로 서수 표현을 유지해 두 개의 동시 연대를 분명히 드러냈습니다.
- source_word: עָלָה ... וַיָּצַר עָלֶיהָ
  english_pob_choice: came up against ... and besieged it
  chosen_korean: 올라와 ... 쳐서 포위하였습니다
  alternatives_korean:
  - 쳐들어와 ... 포위하였습니다
  - 올라와 ... 에 포위망을 쳤습니다
  lexicon: HALOT
  rationale: עלה의 군사적 '올라가다'는 관용을 살리면서, צור는 성읍을 포위하는 의미를 분명하게 현대적으로 옮겼습니다.
theological_decisions:
- issue: 왕 연대기 동기화의 중첩 표현
  chosen_reading: 히스기야의 넷째 해가 호세아의 일곱째 해와 동일하다는 병행 설명을 본문에서 분명히 드러냈습니다.
  alternative_readings:
  - 두 연대 중 하나만 먼저 제시하고 각주로 처리
  - 더 매끄럽게 한 번만 표현
  rationale: 본문 자체가 두 왕의 연대를 맞추어 제시하므로, 이를 축소하지 않고 병기해야 역사 서술의 의도를 그대로 보존합니다.
  doctrine_reference: 역사 서술의 명시성 보존
- issue: 군사 동사의 방향성
  chosen_reading: עלה를 단순한 이동이 아니라 적대적 원정으로 이해하여 '올라와'를 유지했습니다.
  alternative_readings:
  - 와서
  - 진군하여
  rationale: 히브리어 본문의 군사적 긴장을 흐리지 않기 위해, 상향 이동과 침공의 뉘앙스를 함께 살렸습니다.
  doctrine_reference: 본문 의미의 적대성 보존
