source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הַ/יָּשָׁ֖ר בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/כֹ֥ל אֲשֶׁר עָשָׂ֖ה דָּוִ֥ד אָבִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/003.yaml
  text: He did what was right in the eyes of Yahweh[a], according to all that David his father had done.
  footnotes:
  - marker: a
    text: Hebrew 'father' here means ancestor in the Davidic line, not immediate parent.
    reason: cultural_note
translation:
  language: ko
  text: 그는 야훼께서 보시기에 옳은 일을 했으며, 그의 아버지 다윗이 행한 모든 것을 본받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘아버지’는 히스기야의 직계 부친이 아니라 다윗 왕조의 조상을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행했습니다
  alternatives_korean:
  - 하였습니다
  - 했습니다
  lexicon: HALOT
  rationale: 서사문의 동작 진행을 자연스러운 현대 한국어로 옮기되, 원문의 행위 중심 의미를 유지했습니다.
- source_word: הַיָּשָׁר
  english_pob_choice: what was right
  chosen_korean: 옳은 것
  alternatives_korean:
  - 바른 것
  - 의로운 것
  lexicon: HALOT
  rationale: 정관사 붙은 형용사의 명사적 용법을 한국어의 명사구로 살려, 도덕적 평가를 직접적으로 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈에/보시기에’라는 히브리어 관용구를 한국어에서도 평가 기준의 뉘앙스를 살려 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 문맥상 텔트라그람마톤을 가리키므로, 프로젝트 기본값에 따라 고유명사 ‘야훼’를 유지했습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  english_pob_choice: according to all that ... had done
  chosen_korean: 행한 모든 것에 따라 행했습니다
  alternatives_korean:
  - 행한 모든 대로 행했습니다
  - 모든 일을 따라 했습니다
  lexicon: HALOT
  rationale: 비교구문 ‘~에 따라’로 상응 관계를 드러내고, 다윗의 이전 행위를 기준으로 삼는 뜻을 자연스럽게 표현했습니다.
- source_word: דָּוִד אָבִיו
  english_pob_choice: David his father
  chosen_korean: 그의 아버지 다윗
  alternatives_korean:
  - 다윗 그의 아버지
  - 다윗 그의 조상
  lexicon: HALOT
  rationale: 왕조적 수식을 살리면서도 한국어 어순에 맞게 배치했습니다. 다만 ‘아버지’는 혈연 그 이상으로 왕조 선조를 뜻할 수 있습니다.
theological_decisions:
- issue: 왕조적 ‘아버지’의 의미
  chosen_reading: 본문에는 ‘그의 아버지 다윗’을 그대로 두어 다윗 계승의 왕조적 연속성을 보존했습니다.
  alternative_readings:
  - 그의 조상 다윗
  - 다윗
  rationale: 히브리어 royal formula는 즉각적 부친이 아니라 다윗 계열의 시원을 가리킬 수 있으므로, 본문은 직역을 유지하고 의미 범위를 주석으로 처리하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
