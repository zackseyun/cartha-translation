  rationale: POB의 표준 원칙대로, 본문 속 신명을 칭호로 대체하지 않고 고유 이름으로 드러내어 대조의 날카로움을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
