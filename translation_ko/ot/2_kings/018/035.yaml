lexical_decisions:
- source_word: מִי
  english_pob_choice: Who
  chosen_korean: 누가
  alternatives_korean:
  - 어느 신이
  - 누구
  lexicon: HALOT
  rationale: 수사적 질문의 직접성을 살려 표준적인 의문대명사 ‘누가’로 옮겼습니다.
- source_word: בְּכָל אֱלֹהֵי הָאֲרָצוֹת
  english_pob_choice: among all the gods of the lands
  chosen_korean: 모든 나라의 신들 가운데
  alternatives_korean:
  - 모든 땅의 신들 가운데
  - 모든 국가들의 신들 가운데
  lexicon: HALOT
  rationale: בְּכָל은 ‘가운데/중에서’의 부분적 의미로 살리고, הָאֲרָצוֹת는 문맥상 여러 나라들을 가리키므로 ‘나라’로 자연스럽게 옮겼습니다.
- source_word: הִצִּילוּ אֶת אַרְצָם
  english_pob_choice: has delivered their land
  chosen_korean: 자기 땅을 건져 냈기에
  alternatives_korean:
  - 그들의 땅을 구해 냈기에
  - 자기 나라를 구원했기에
  lexicon: HALOT
  rationale: נצל의 ‘구하다/건져내다’ 의미를 살리고, 히브리어의 분배적 소유격을 ‘자기 땅’으로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 항목은 고유한 신명 הנוה의 음역이므로, POB의 원칙에 따라 ‘야훼’로 유지했습니다.
- source_word: מִיָּדִי
  english_pob_choice: from my hand
  chosen_korean: 내 손에서
  alternatives_korean:
  - 내 권세에서
  - 내 손 안에서
  lexicon: HALOT
  rationale: 권력과 통제의 히브리 관용구를 직역에 가깝게 살려 ‘내 손에서’로 옮겼습니다.
theological_decisions:
- issue: 야훼라는 신명 표기
  chosen_reading: 본문의 יְהוָה는 한국어 본문에서 ‘야훼’로 표기했습니다.
  alternative_readings:
