  lexicon: HALOT
  rationale: בְּכָל은 ‘가운데/중에서’의 부분적 의미로 살리고, הָאֲרָצוֹת는 문맥상 여러 나라들을 가리키므로 ‘나라’로 자연스럽게 옮겼습니다.
- source_word: הִצִּילוּ אֶת אַרְצָם
