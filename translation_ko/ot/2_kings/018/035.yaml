  lexicon: HALOT
  rationale: נצל의 ‘구하다/건져내다’ 의미를 살리고, 히브리어의 분배적 소유격을 ‘자기 땅’으로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
