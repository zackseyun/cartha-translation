  to: 아시리아 왕이 라기스에서 다르탄[a]과 라브사리스와 라브사게를 큰 군대와 함께[b] 예루살렘에 있는 히스기야 왕에게 보냈습니다. 그들은 예루살렘으로 올라와 이르렀습니다. 그들은 올라와 이르러 세탁공의 밭 큰길에 있는 윗못의 수로 곁에 섰습니다.[c]
  rationale: 원문의 서사적 동사 반복과 수식 관계를 보존하고, ‘윗못’이라는 지형 명칭을 정확히 옮겼습니다. 외래 관직명은 본문에서 음역으로 유지하되, 주석은 가능한 기능적 이해를 확정하지 않는 방식으로 수정했습니다. 모든 주석 앵커는 해당 본문 표현 뒤에 배치했습니다.
