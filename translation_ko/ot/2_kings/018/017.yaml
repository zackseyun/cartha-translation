  naturalness: 현대 한국어 합쇼체로 자연스럽게 다듬을 수 있습니다. '상류 못의 수로 — 곧 … 있는 곳'은 지시 관계가 다소 불명확하므로, 수로가 세탁공의 밭 큰길에 있었다는 관계를 평이하게 제시했습니다.
