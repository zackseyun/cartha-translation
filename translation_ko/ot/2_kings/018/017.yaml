reference: 2 Kings 18:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח מֶֽלֶךְ אַשּׁ֡וּר אֶת תַּרְתָּ֥ן וְ/אֶת רַב סָרִ֣יס וְ/אֶת רַב שָׁקֵ֨ה מִן לָכִ֜ישׁ אֶל הַ/מֶּ֧לֶךְ חִזְקִיָּ֛הוּ בְּ/חֵ֥יל כָּבֵ֖ד יְרוּשָׁלִָ֑ם וַֽ/יַּעֲלוּ֙ וַ/יָּבֹ֣אוּ יְרוּשָׁלִַ֔ם וַ/יַּעֲל֣וּ וַ/יָּבֹ֗אוּ וַ/יַּֽעַמְדוּ֙ בִּ/תְעָלַת֙ הַ/בְּרֵכָ֣ה הָֽ/עֶלְיוֹנָ֔ה אֲשֶׁ֕ר בִּ/מְסִלַּ֖ת שְׂדֵ֥ה כוֹבֵֽס־־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/018/017.yaml
  text: Then the king of Assyria sent the Tartan[a], the Rab-saris, and the Rab-shakeh from Lachish to King Hezekiah at Jerusalem with a great army. They went up and came to Jerusalem; they went up and came and stood by the conduit of the upper pool[c][b], which is on the highway of the washer’s field.
  footnotes:
  - marker: a
    text: The titles 'Tartan,' 'Rab-saris,' and 'Rab-shakeh' are likely Assyrian official titles rather than personal names; possible functional renderings include 'commander-in-chief,' 'chief official/eunuch,' and 'chief cupbearer' or another high officer.
    reason: cultural_note
  - marker: b
    text: Or 'with a great army' / 'with a large military force.'
    reason: lexical_alternative
  - marker: c
    text: Traditionally 'the fuller’s field.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아시리아 왕이 라기스에서 다르탄[a]과 라브사리스와 라브사게를 큰 군대와 함께[b] 예루살렘에 있는 히스기야 왕에게 보냈습니다. 그들은 예루살렘으로 올라와 이르렀습니다. 그들은 올라와 이르러 세탁공의 밭 큰길에 있는 윗못의 수로 곁에 섰습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다르탄, 라브사리스, 라브사게는 고유명사라기보다 아시리아의 관직명일 가능성이 높습니다. 기능적으로는 각각 ‘최고사령관’, ‘최고 환관’ 또는 ‘고위 관리’, ‘술 맡은 최고 관리’ 또는 다른 고위 관리로 이해되기도 합니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘큰 군사력과 함께’.
    reason: lexical_alternative
  - marker: c
    text: 전통적으로 ‘풀러의 밭’.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְתָּן / רַב סָרִיס / רַב שָׁקֵה
  english_pob_choice: the Tartan, the Rab-saris, and the Rab-shakeh
  chosen_korean: 다르탄과 라브-사리스와 라브-사게
  alternatives_korean:
  - 군 최고사령관과 시종장과 음료관
  - 다르탄과 내시장과 술잔 시종장
  lexicon: HALOT
  rationale: 세 표현은 아시리아 궁정/군사 직함일 가능성이 높아, 기능어로 단정하기보다 음역을 유지해 본문에서 외래 관직명임을 드러냈습니다. 다만 רַב שָׁקֵה는 전통적으로 여러 방식으로 풀이되므로, 한국어는 중립적으로 음역 처리했습니다.
- source_word: בְּחֵיל כָּבֵד
  english_pob_choice: with a great army
  chosen_korean: 큰 군대를 거느리고
  alternatives_korean:
  - 큰 군사력을 가지고
  - 무거운 군대를 거느리고
  lexicon: HALOT
  rationale: חֵיל은 여기서 군사 집단/병력을 가리키므로 자연스러운 현대 한국어로 ‘큰 군대’를 택했습니다. ‘거느리고’는 함께 동행한 군사력을 문맥상 자연스럽게 살립니다.
- source_word: וַיַּעֲלוּ ... וַיָּבֹאוּ ... וַיַּעַמְדוּ
  english_pob_choice: They went up and came ... and stood
  chosen_korean: 올라와 도착하여 ... 서 있었습니다
  alternatives_korean:
  - 올라가 와 ... 서 있었습니다
  - 올라와 오고 ... 서 있었습니다
  lexicon: HALOT
  rationale: 히브리어의 연속 동사 배열을 완전히 평준화하지 않고, 이동-도착-정지의 순서를 한국어로 분명하게 옮겼습니다. 예루살렘을 ‘올라감’으로 표현한 관용도 유지했습니다.
- source_word: תְעָלַת הַבְּרֵכָה הָעֶלְיוֹנָה
  english_pob_choice: the conduit of the upper pool
  chosen_korean: 상류 못의 수로
  alternatives_korean:
  - 상부 못의 수로
  - 윗못의 수로
  lexicon: HALOT
  rationale: תְעָלָה는 물길/수로이며, בְּרֵכָה는 못 또는 저수지입니다. 한국어에서는 지형을 간결하게 살려 ‘상류 못의 수로’로 옮겼습니다.
- source_word: שְׂדֵה כוֹבֵס
  english_pob_choice: the washer’s field
  chosen_korean: 세탁공의 밭
  alternatives_korean:
  - 풀러의 밭
  - 세탁자의 밭
  lexicon: HALOT
  rationale: כּוֹבֵס는 옷을 씻거나 표백하는 사람으로, 전통적 ‘풀러’보다 현대 독자가 이해하기 쉬운 ‘세탁공’을 택했습니다. 본문의 지명적 성격을 살려 ‘밭’은 직역했습니다.
theological_decisions:
- issue: 아시리아 관직명과 지명 표현의 낯섦
  chosen_reading: 본문의 외래 관직명은 음역을 유지하고, 지명/지형은 설명적으로 옮겨 독자가 사건 현장을 따라가게 했습니다.
  alternative_readings:
  - 관직을 기능적으로 풀어 번역하기
  - 지형 표현을 더 전통적인 교회식 용어로 바꾸기
  rationale: 이 절은 신학적 용어보다 역사 서술의 정확성이 중요하므로, 확정되지 않은 관직을 기능적으로 과잉해석하지 않았습니다. 동시에 한국어 문장 안에서 의미가 막히지 않도록 지형은 자연스럽게 풀었습니다.
  doctrine_reference: 역사서술의 투명성 및 본문 우선 원칙
