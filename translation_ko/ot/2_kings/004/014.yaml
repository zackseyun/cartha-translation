base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/014.yaml
  text: So he said[a], “What then is to be done for her?” And Gehazi said, “Well, she has no son[b], and her husband is old.”
  footnotes:
  - marker: a
    text: Or, “What should be done for her?”
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “there is no son for her.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “그러면 그녀를 위해 무엇을 해 주어야 합니까?” 게하시가 말했습니다. “아, 그 여인에게는 아들이 없습니다. 그리고 그녀의 남편은 늙었습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀를 위해 무엇을 해야 합니까?”
    reason: alternative_reading
  - marker: b
    text: '히브리어: “그녀에게는 아들이 없습니다.”'
    reason: source_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: So he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그러자 그가 말했습니다
  - 그리고 그가 말했습니다
  lexicon: HALOT
  rationale: 와우 연속형은 서술의 진행을 표시하므로, 현대 한국어에서는 자연스럽게 사건을 이어 주는 평서형으로 옮겼습니다.
- source_word: וּמֶה לַעֲשׂוֹת לָהּ
  english_pob_choice: What then is to be done for her?
  chosen_korean: “그러면 그녀를 위해 무엇을 해 주어야 합니까?”
  alternatives_korean:
  - “그녀를 위해 무엇을 해야 합니까?”
  - “그녀를 위해 무엇을 해야 하겠습니까?”
  lexicon: HALOT
  rationale: 직역보다 한국어에서 통용되는 수동/의무적 뉘앙스를 살려, 그녀를 위한 조치가 무엇인지 묻는 형식으로 자연화했습니다.
- source_word: אֲבָל
  english_pob_choice: Well
  chosen_korean: “아,”
  alternatives_korean:
  - “글쎄,”
  - “하지만,”
  lexicon: HALOT
  rationale: 아발은 강한 대조보다 응답을 이끄는 담화 표지이므로, 한국어에서는 짧은 감탄/머뭇거림 표현으로 처리했습니다.
- source_word: בֵּן אֵין לָהּ
  english_pob_choice: she has no son
  chosen_korean: “그 여인에게는 아들이 없습니다”
  alternatives_korean:
  - “그녀에게는 아들이 없습니다”
  - “그 여인에게는 자녀가 없습니다”
  lexicon: HALOT
  rationale: 히브리어의 존재문을 한국어에서는 ‘~에게는 … 없습니다’로 옮겨 소유관계와 결핍을 함께 드러냈습니다. בן은 일반적인 ‘자녀’가 아니라 ‘아들’입니다.
- source_word: וְאִישָׁהּ זָקֵן
  english_pob_choice: and her husband is old
  chosen_korean: 그리고 그녀의 남편은 늙었습니다
  alternatives_korean:
  - 그리고 그녀의 남편은 나이가 많습니다
  - 그리고 그녀의 남편은 연로합니다
  lexicon: HALOT
  rationale: זָקֵן의 기본 의미를 직접적으로 살려, 원문의 간결한 상태 서술을 유지했습니다.
