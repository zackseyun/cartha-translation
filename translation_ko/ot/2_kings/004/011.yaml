base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/011.yaml
  text: One day he came there[a], turned aside into the upper room, and lay down there.
  footnotes:
  - marker: a
    text: Or 'and slept there.' The Hebrew verb can denote lying down or sleeping; the context does not require the more specific sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 어느 날 그는 그곳에 와서, 위층 방으로 돌아서 들어가 거기 누웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거기서 잤습니다.’ 히브리어 동사는 눕다 또는 자다의 뜻을 가질 수 있으며, 문맥은 더 구체적인 의미를 요구하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: One day
  chosen_korean: 어느 날
  alternatives_korean:
  - 그 일이 일어나던 날
  - 어느 날에
  lexicon: HALOT
  rationale: 히브리어 관용적 서두로서 사건의 시간적 전환을 자연스럽게 여는 표현이므로, 현대 한국어에서 가장 자연스러운 ‘어느 날’로 옮겼습니다.
- source_word: וַיָּבֹא שָׁמָּה
  english_pob_choice: he came there
  chosen_korean: 그곳에 와서
  alternatives_korean:
  - 거기에 가서
  - 그곳에 도착해서
  lexicon: HALOT
  rationale: בוא의 기본값인 ‘오다’를 살려, 서술 흐름상 자연스러운 ‘그곳에 와서’로 옮겼습니다.
- source_word: וַיָּסַר אֶל הָעֲלִיָּה
  english_pob_choice: turned aside into the upper room
  chosen_korean: 위층 방으로 돌아서 들어가
  alternatives_korean:
  - 위층 방으로 비켜 들어가
  - 위층 방으로 들어가
  lexicon: HALOT
  rationale: סור는 단순한 प्रवेश보다 ‘옆길로 돌다/돌아서다’의 뉘앙스가 있어, 목적지로 곧장 들어가기보다 ‘돌아서 들어가’로 옮겨 방향 전환을 드러냈습니다.
- source_word: הָעֲלִיָּה
  english_pob_choice: the upper room
  chosen_korean: 위층 방
  alternatives_korean:
  - 윗방
  - 상방
  lexicon: HALOT
  rationale: עֲלִיָּה는 건물의 높은 층에 있는 방을 가리키므로, 오늘날 독자가 이해하기 쉬운 ‘위층 방’을 택했습니다.
- source_word: וַיִּשְׁכַּב שָׁמָּה
  english_pob_choice: and lay down there
  chosen_korean: 거기 누웠습니다
  alternatives_korean:
  - 거기 잠들었습니다
  - 거기 드러누웠습니다
  lexicon: HALOT
  rationale: שׁכב는 문맥상 ‘눕다/드러눕다’가 기본 의미이며, 본문은 반드시 수면까지 요구하지 않으므로 ‘누웠습니다’로 과도한 특정화를 피했습니다.
