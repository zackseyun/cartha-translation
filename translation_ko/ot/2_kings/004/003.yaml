id: 2KI.4.3
reference: 2 Kings 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לְכִ֨י שַׁאֲלִי לָ֤/ךְ כֵּלִים֙ מִן הַ/ח֔וּץ מֵ/אֵ֖ת כָּל שכנ/כי כֵּלִ֥ים רֵקִ֖ים אַל תַּמְעִֽיטִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/003.yaml
  text: Then he said[a], “Go, borrow vessels for yourself from outside, from all your neighbors—empty vessels[b]. Do not gather only a few.”
  footnotes:
  - marker: a
    text: Or 'ask for vessels'; the Hebrew verb can mean 'ask' more generally, but here likely implies borrowing from neighbors for temporary use.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'Do not make few' or 'Do not diminish.' The sense in context is not to collect only a small number of vessels.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「가서, 바깥에서 네 이웃들 모두에게서 빈 그릇들을 구하십시오. 적게 구하지 마십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 이르렀습니다
  - 그가 말했습니다
  lexicon: WLC
  rationale: 서술 흐름을 자연스럽게 살리되, 원문의 단순한 말하기 동사를 합쇼체로 옮겼습니다.
- source_word: שַׁאֲלִי
  english_pob_choice: borrow
  chosen_korean: 구하십시오
  alternatives_korean:
  - 빌리십시오
  - 구해 오십시오
  - 빌려 오십시오
  lexicon: HALOT
  rationale: 문맥상 이웃에게서 임시로 받아 오는 행위이지만, 한국어에서는 ‘빌리다’보다 ‘구하다/구해 오다’가 명령형으로 더 자연스럽고, “ask for”의 여지를 과도하게 좁히지 않습니다.
- source_word: כֵּלִים
  english_pob_choice: vessels
  chosen_korean: 그릇들
  alternatives_korean:
  - 용기들
  - 기물들
  - 항아리들
  lexicon: HALOT
  rationale: 기름을 담을 용기를 가리키므로 포괄적이면서도 일상적인 ‘그릇들’이 원문의 넓은 의미를 잘 살립니다.
- source_word: מִן הַחוּץ
  english_pob_choice: from outside
  chosen_korean: 바깥에서
  alternatives_korean:
  - 밖에서
  - 바깥으로부터
  lexicon: HALOT
  rationale: 직역보다 한국어 문장 흐름에 맞는 자연스러운 위치 표현으로, 집 안이 아닌 밖으로 나가라는 뜻을 분명히 합니다.
- source_word: כֵּלִים רֵקִים
  english_pob_choice: empty vessels
  chosen_korean: 빈 그릇들
  alternatives_korean:
  - 빈 용기들
  - 빈 항아리들
  lexicon: HALOT
  rationale: ‘빈’이라는 상태를 유지하면서, 중복된 ‘그릇들’을 한국어에서는 한 번만 자연스럽게 처리했습니다.
- source_word: אַל תַּמְעִיטִי
  english_pob_choice: Do not gather only a few
  chosen_korean: 적게 구하지 마십시오
  alternatives_korean:
  - 너무 적게 구하지 마십시오
  - 몇 개만 구하지 마십시오
  - 적게 만들지 마십시오
  lexicon: HALOT
  rationale: 히브리어는 수량을 줄이거나 적게 만드는 것을 금지하므로, 실제 의미를 자연스럽게 드러내는 표현으로 옮겼습니다.
