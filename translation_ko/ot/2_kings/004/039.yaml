  edition: WLC
  text: וַ/יֵּצֵ֨א אֶחָ֣ד אֶל הַ/שָּׂדֶה֮ לְ/לַקֵּ֣ט אֹרֹת֒ וַ/יִּמְצָא֙ גֶּ֣פֶן שָׂדֶ֔ה וַ/יְלַקֵּ֥ט מִמֶּ֛/נּוּ פַּקֻּעֹ֥ת שָׂדֶ֖ה מְלֹ֣א בִגְד֑/וֹ וַ/יָּבֹ֗א וַ/יְפַלַּ֛ח אֶל סִ֥יר הַ/נָּזִ֖יד כִּֽי לֹ֥א יָדָֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/039.yaml
  text: Then one man went out into the field to gather herbs[a], and he found a wild vine and gathered from it wild gourds, filling his garment. Then he came and sliced them into the pot of stew[c][b], though they did not know what they were.
  footnotes:
  - marker: a
    text: Or 'greens' for 'herbs.' The Hebrew refers broadly to edible plants gathered from the field.
    reason: lexical_alternative
  - marker: b
    text: Literally 'a vine of the field' ... 'gourds of the field'; that is, a wild vine bearing wild gourds.
    reason: lexical_alternative
  - marker: c
    text: Or 'for they did not know' / 'because they did not know.' The Hebrew conjunction can be read as explanatory.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 들판으로 나가 나물을 뜯으려다가, 들포도나무를 발견하고 거기에서 들호박을 따서 옷에 가득 채웠습니다. 그리고 와서 그것들을 국이 든 가마에 썰어 넣었는데, 그들이 그것이 무엇인지 알지 못했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''나물''은 히브리어 אֹרֹת의 넓은 뜻—들에서 뜯는 먹을 수 있는 식물—을 포괄하는 한국어 표현입니다.'
    reason: lexical_alternative
  - marker: b
    text: '''들포도나무''와 ''들호박''은 본문의 ''들의 덩굴''과 ''들의 박류''를 자연스러운 한국어로 옮긴 것입니다.'
    reason: lexical_alternative
  - marker: c
    text: 히브리어 כִּי는 여기서 '왜냐하면'/'~때문에'처럼 설명적으로도 읽힐 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶחָד
  english_pob_choice: one man
  chosen_korean: 그는
  alternatives_korean:
  - 한 사람은
  - 어떤 사람은
  lexicon: HALOT
  rationale: 문맥상 앞선 무리 가운데 한 개인을 가리키므로, 한국어에서는 앞 문맥의 주어를 이어받는 대명사로 자연스럽게 처리했습니다.
- source_word: לְלַקֵּט אֹרֹת
  english_pob_choice: to gather herbs
  chosen_korean: 나물을 뜯으려다가
  alternatives_korean:
  - 나물을 모으려다가
  - 채소를 모으려다가
  lexicon: HALOT
  rationale: 오롯은 들에서 거두는 먹을 수 있는 식물을 가리키므로, 한국어에서는 자연스럽고 넓게 포괄하는 '나물'을 택했습니다.
- source_word: גֶּפֶן שָׂדֶה / פַּקֻּעֹת שָׂדֶה
  english_pob_choice: a wild vine / wild gourds
  chosen_korean: 들포도나무 / 들호박
  alternatives_korean:
  - 야생 덩굴 / 들오이
  - 야생 포도나무 / 들박
  lexicon: HALOT
  rationale: '''들-''을 붙여 야생성, 비재배성을 드러냈고, פַּקֻּעֹת는 문맥상 식용이 어려운 들열매를 가리키므로 ''들호박''으로 옮겨 독자가 즉시 상황을 이해하게 했습니다.'
- source_word: מְלֹא בִגְדוֹ
  english_pob_choice: filling his garment
  chosen_korean: 옷에 가득 채웠습니다
  alternatives_korean:
  - 옷자락에 가득 담았습니다
  - 겉옷을 가득 채웠습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 '가득함'과 임시 용기 역할을 하는 옷의 이미지를 함께 살리기 위해 직역보다 자연스러운 한국어로 옮겼습니다.
- source_word: סִיר הַנָּזִיד
  english_pob_choice: the pot of stew
  chosen_korean: 국이 든 가마
  alternatives_korean:
  - 스튜가 든 솥
  - 죽이 든 솥
  lexicon: HALOT
  rationale: נָזִיד는 끓인 음식, 즉 국물 요리를 가리키므로 한국어에서는 당시의 음식 이미지를 살려 '국'과 '가마'로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 כִּי לֹא יָדָעוּ의 관계
  chosen_reading: 그들이 그것이 무엇인지 알지 못했습니다
  alternative_readings:
  - 그들이 알지 못했기 때문입니다
  - 그들은 그것이 무엇인지 몰랐습니다
  rationale: 본절은 서술의 흐름상 독자에게 결과를 자연스럽게 전달하는 것이 적절하므로, 원문의 원인/설명 가능성을 해치지 않으면서도 문맥상 분명한 무지를 본문에 반영했습니다.
  doctrine_reference: 본문 이해상의 문장 관계 문제
- issue: 야생 식물 명칭의 구체화
  chosen_reading: 들포도나무, 들호박
  alternative_readings:
  - 야생 덩굴, 야생 열매
  rationale: 본문의 핵심은 독성 가능성이 있는 야생 식물을 재배 식물로 오인한 데 있으므로, 한국어 독자가 장면의 위험성을 즉시 파악할 수 있도록 비재배성 표지를 분명히 했습니다.
  doctrine_reference: 서사 맥락 보존
