base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/038.yaml
  text: And Elisha returned to Gilgal[a], and there was a famine in the land. Now the sons of the prophets were sitting before him, and he said to his servant, “Put on the large pot and boil stew for the sons of the prophets.”
  footnotes:
  - marker: a
    text: Or “the disciples of the prophets,” referring to a prophetic community or guild.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사가 길갈로 돌아왔습니다. 그 땅에 기근이 있었습니다. 예언자들의 아들들[a]이 그의 앞에 앉아 있었고, 엘리사가 자기 종에게 말했습니다. “큰 솥을 걸고 예언자들의 아들들을 위하여 끓인 음식을 마련하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예언자 공동체의 제자들.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֱלִישָׁע שָׁב הַגִּלְגָּלָה
  english_pob_choice: And Elisha returned to Gilgal
  chosen_korean: 엘리사가 길갈로 돌아왔는데
  alternatives_korean:
  - 엘리사가 길갈로 돌아왔습니다
  - 엘리사가 길갈에 돌아왔습니다
  lexicon: HALOT
  rationale: שׁוּב의 서술은 ‘돌아오다’가 자연스럽고, 방향성 ה는 한국어에서 목적지 조사 ‘-로’로 가장 잘 드러납니다.
- source_word: וְהָרָעָב בָּאָרֶץ
  english_pob_choice: and there was a famine in the land
  chosen_korean: 그 땅에 기근이 있었습니다
  alternatives_korean:
  - 그 땅에 기근이 있었습니다
  - 그 땅에 기근이 있었습니다
  lexicon: HALOT
  rationale: 배경 설명의 무동사 절을 한국어에서는 ‘있었습니다’로 풀어 주어 사건의 배경을 자연스럽게 살렸습니다.
- source_word: בְנֵי הַנְּבִיאִים
  english_pob_choice: the sons of the prophets
  chosen_korean: 예언자들의 아들들
  alternatives_korean:
  - 예언자들의 제자들
  - 예언자 공동체
  lexicon: HALOT
  rationale: 직역을 본문에 유지해 히브리어 관용구를 보존했고, ‘제자들’이나 ‘공동체’는 해석적이므로 본문에서는 채택하지 않았습니다.
- source_word: שְׁפֹת הַסִּיר הַגְּדוֹלָה
  english_pob_choice: Put on the large pot
  chosen_korean: 큰 솥을 걸고
  alternatives_korean:
  - 큰 솥을 얹고
  - 큰 솥을 올리고
  lexicon: HALOT
  rationale: 솥을 불 위에 두는 동작을 한국어 관용으로 가장 자연스럽게 드러내는 동사로 ‘걸다’를 택했습니다.
- source_word: וּבַשֵּׁל נָזִיד
  english_pob_choice: and boil stew
  chosen_korean: 국을 끓이십시오
  alternatives_korean:
  - 스튜를 끓이십시오
  - 죽을 끓이십시오
  lexicon: HALOT
  rationale: נָזִיד는 보통 끓인 음식/국물 요리를 가리키므로, 현대 한국어에서는 의미를 살리면서도 과도하게 서구식인 ‘스튜’보다 ‘국’을 선택했습니다.
theological_decisions:
- issue: 예언자들의 아들들 표현의 처리
  chosen_reading: 본문에는 ‘예언자들의 아들들’을 유지하고, 별도 보충 없이 독자가 문맥으로 공동체적 의미를 읽게 합니다.
  alternative_readings:
  - 예언자들의 제자들
  - 예언자 공동체
  rationale: 이 표현은 신학적 쟁점어라기보다 히브리어 관용구이므로, 본문에서는 원문 형식을 보존하고 해설적 대체어는 채택하지 않았습니다.
  doctrine_reference: Translation philosophy §§1, 4, 5
