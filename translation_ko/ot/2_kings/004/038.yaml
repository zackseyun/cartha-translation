  source_fidelity: 전반적으로 히브리어의 사건 순서, 길갈로의 귀환, 기근이라는 배경, 예언자들의 아들들, 큰 솥과 끓인 음식이라는 내용을 충실히 옮겼습니다. 다만 נָזִיד는 단순한 ‘국’보다 걸쭉하게 끓인 음식인 ‘스튜/죽/국물 요리’의 뜻 범위에 가깝습니다. 현대 한국어에서 ‘스튜’는 불필요하게 서구적 음식으로 한정될 수 있으므로, 본문에서는 ‘끓인 음식을 마련하십시오’로 옮겨 조리 행위와 음식의 포괄성을 보존했습니다.
  naturalness: ‘그가 그의 종에게’는 한국어에서 소유 대명사가 중복되어 다소 부자연스럽습니다. ‘자기 종에게’가 자연스럽습니다. 또한 각 서술을 정중한 문장 종결로 분명히 구분하고, 각주 표지는 설명 대상인 ‘예언자들의 아들들’에 직접 붙이는 편이 자연스럽고 기능적으로도 정확합니다.
  terminology: ‘예언자들의 아들들’은 בְנֵי הַנְּבִיאִים의 문자적 표현을 보존하므로 적절합니다. 각주에서는 이것이 혈연 관계만을 뜻하지 않을 수 있음을 ‘예언자 공동체의 제자들’이라는 대안으로 간결하게 밝혔습니다. ‘길드’는 현대 한국어 성서 문맥에서 다소 이질적이므로 피했습니다.
