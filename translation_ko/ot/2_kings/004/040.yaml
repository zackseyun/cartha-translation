  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
  footnotes:
  - marker: a
    text: Literally, “death in the pot.” The phrase likely means the stew was deadly or poisonous.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 남자들에게 먹으라고 그것을 부어 주었습니다. 그런데 그들이 그 스튜를 먹고 있을 때, 소리치며 말했습니다. “냄비에 죽음이 있습니다[a], 하나님의 사람!” 그들은 먹을 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “죽음이 냄비에 있다”라고 말합니다. 이 표현은 그 스튜가 치명적이거나 독이 들었다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
