  text: וַ/יִּֽצְק֥וּ לַ/אֲנָשִׁ֖ים לֶ/אֱכ֑וֹל וַ֠/יְהִי כְּ/אָכְלָ֨/ם מֵ/הַ/נָּזִ֜יד וְ/הֵ֣מָּה צָעָ֗קוּ וַ/יֹּֽאמְרוּ֙ מָ֤וֶת בַּ/סִּיר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים וְ/לֹ֥א יָכְל֖וּ לֶ/אֱכֹֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/040.yaml
  text: So they poured it out for the men to eat. But as they were eating from the stew[a], they cried out and said, “There is death in the pot, man of God!” And they could not eat.
  footnotes:
  - marker: a
    text: Literally, “death in the pot.” The phrase likely means the stew was deadly or poisonous.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 남자들에게 먹도록 그것을 부어 주었습니다. 그런데 그들이 그 스튜를 먹고 있을 때 소리치며 말했습니다. “그 냄비 안에 죽음이 있습니다, 하나님의 사람이여!” 그들은 먹을 수 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “죽음이 냄비 안에 있다”라고 말합니다. 이 표현은 스튜가 치명적이거나 독이 들었다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְקוּ
  english_pob_choice: they poured it out
  chosen_korean: 그것을 부어 주었습니다
  alternatives_korean:
  - 그것을 따랐습니다
  - 그것을 부었습니다
  - 퍼서 주었습니다
  lexicon: HALOT
  rationale: יצק의 기본 뜻인 ‘붓다/따르다’를 살리되, 식사 제공의 맥락을 반영해 자연스러운 서술로 옮겼습니다.
- source_word: לַאֲנָשִׁים
  english_pob_choice: for the men
  chosen_korean: 남자들에게
  alternatives_korean:
  - 사람들에게
  - 남성들에게
  - 그들에게
  lexicon: HALOT
  rationale: אֲנָשִׁים은 여기서 모인 남자들을 가리키므로 성별을 흐리지 않고 ‘남자들’로 옮겼습니다.
- source_word: מֵהַנָּזִיד
  english_pob_choice: from the stew
  chosen_korean: 그 스튜
  alternatives_korean:
  - 그 죽
  - 그 탕
  - 그 국
  lexicon: HALOT
  rationale: נָזִיד는 끓여 만든 음식, 곧 스튜/국물 요리를 뜻하므로 현대 독자가 이해하기 쉬운 ‘스튜’를 택했습니다.
- source_word: מָוֶת בַּסִּיר
  english_pob_choice: There is death in the pot
  chosen_korean: 그 냄비 안에 죽음이 있습니다
  alternatives_korean:
  - 냄비 안에 죽음이 있습니다
  - 그 냄비에 죽음이 있습니다
  - 그 냄비에는 독이 있습니다
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현 ‘죽음이 냄비 안에 있다’를 본문에서 살려, 해석어 ‘독’을 본문에 미리 넣지 않았습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: man of God
  chosen_korean: 하나님의 사람이여
  alternatives_korean:
  - 하나님의 사람이여
  - 하나님의 사람
  - 오 하나님의 사람
  lexicon: HALOT
  rationale: 엘리사를 부르는 호칭을 한국어 관용 표현으로 옮기되, 히브리어의 직접 호칭성을 반영해 호격을 살렸습니다.
theological_decisions:
- issue: מָוֶת בַּסִּיר의 의미를 본문에서 어떻게 처리할지
  chosen_reading: 본문에는 ‘죽음’이라는 직설적 이미지를 유지하고, 독성에 대한 해석은 주석으로 남깁니다.
  alternative_readings:
  - ‘독이 있습니다’로 의역
  - ‘치명적입니다’로 완화
  rationale: 본문 자체는 ‘죽음’이라는 강한 표현을 사용하므로, 의미를 미리 완화하면 원문의 긴박감과 수사적 힘이 약해집니다.
  doctrine_reference: 본문 충실성 원칙
