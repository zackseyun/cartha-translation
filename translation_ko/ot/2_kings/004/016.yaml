  edition: WLC
  text: וַ/יֹּ֗אמֶר לַ/מּוֹעֵ֤ד הַ/זֶּה֙ כָּ/עֵ֣ת חַיָּ֔ה אתי חֹבֶ֣קֶת בֵּ֑ן וַ/תֹּ֗אמֶר אַל אֲדֹנִ/י֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אַל תְּכַזֵּ֖ב בְּ/שִׁפְחָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/016.yaml
  text: Then he said[a], "At this appointed time next year, you will be embracing a son." But she said, "No, my lord, man of God; do not deceive your servant."
  footnotes:
  - marker: a
    text: Literally, "about this time of life"; that is, at this same time next year.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 말했습니다. “이 정해진 때에, 곧 내년 이맘때에[a] 네가 아들을 안고 있을 것이다.” 그러나 그 여자가 말했습니다. “아니요, 나의 주인이시여, 하나님의 사람이시여, 당신의 여종을 속이지 마십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 직역하기 어려우며, 문자적으로는 “살아 있는 때쯤”입니다. 문맥상 같은 시기의 내년을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמּוֹעֵד הַזֶּה
  english_pob_choice: at this appointed time
  chosen_korean: 이 기한에
  alternatives_korean:
  - 이 정해진 때에
  - 이 약정된 시기에
  lexicon: HALOT
  rationale: מועֵד는 정해진 때, 지정된 시기를 가리키므로 ‘기한’으로 옮겨 약속된 시점이라는 뜻을 살렸습니다.
- source_word: כָּעֵת חַיָּה
  english_pob_choice: next year
  chosen_korean: 내년 이맘때쯤
  alternatives_korean:
  - 다음 해 이때쯤
  - 내년 같은 시각에
  - 이맘때의 내년
  lexicon: HALOT
  rationale: 문맥상 같은 계절의 다음 해를 뜻하는 관용구이므로, 자연스러운 한국어로 ‘내년 이맘때쯤’이라고 옮기되 시간의 근접성을 살렸습니다.
- source_word: חֹבֶקֶת בֵּן
  english_pob_choice: you will be embracing a son
  chosen_korean: 아들을 안고 있을 것이다
  alternatives_korean:
  - 아들을 품고 있을 것이다
  - 아들을 끌어안고 있을 것이다
  lexicon: HALOT
  rationale: חֹבֶקֶת는 ‘껴안다, 안다’의 현재분사이므로 출산 후의 생생한 장면을 드러내는 ‘안고 있을 것이다’로 옮겼습니다.
- source_word: בְּשִׁפְחָתֶךָ
  english_pob_choice: your servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 종
  - 당신의 시녀
  lexicon: HALOT
  rationale: 형태는 여성형이므로 성별을 드러내는 ‘여종’이 원문에 더 가깝습니다. 다만 한국어에서는 직접대화에서 자연스럽고 겸손한 표현입니다.
theological_decisions:
- issue: 아들 약속에 대한 엘리사의 확언과 여인의 거절 반응
  chosen_reading: 앞 문장은 예언적 선언으로, 뒤 문장은 절박한 부정과 간청으로 구분해 옮겼습니다.
  alternative_readings:
  - 둘 다 단순한 대화문으로 평탄화하는 번역
  - 뒤의 אַל을 완곡한 부탁으로 약화시키는 번역
  rationale: 첫 문장은 확정적 예언이고, 둘째 문장은 기대를 거짓으로 만들지 말라는 정서적 호소입니다. 원문의 긴장을 유지해야 하므로 명령형 완곡화 없이 ‘속이지 마십시오’로 표현했습니다.
  doctrine_reference: 예언적 선언의 확정성과 인간의 절박한 호소를 함께 보존하는 번역 원칙
- issue: אֲדֹנִי의 호칭
  chosen_reading: 내 주인이시여
  alternative_readings:
  - 내 주여
  - 주인님
  rationale: 엘리사에게 대한 존칭으로, 하나님께 쓰는 호칭이 아니므로 신적 용법을 피하면서도 공손한 높임을 살렸습니다.
  doctrine_reference: 인물 호칭의 문맥 구분과 합쇼체 존대 유지
