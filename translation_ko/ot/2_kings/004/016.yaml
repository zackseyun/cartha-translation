- from: 그러자 그는 「이 기한에, 내년 이맘때쯤 네가 아들을 안고 있을 것이다」라고 말했습니다. 그러나 그녀는 「아니오, 내 주인이시여, 하나님의 사람이시여, 당신의 여종을 속이지 마십시오」라고 말했습니다.[a]
  to: 그러자 그가 말했습니다. “이 정해진 때에, 곧 내년 이맘때에[a] 네가 아들을 안고 있을 것이다.” 그러나 그 여자가 말했습니다. “아니요, 나의 주인이시여, 하나님의 사람이시여, 당신의 여종을 속이지 마십시오.”
  rationale: ‘기한’을 ‘정해진 때’로 바로잡아 מוֹעֵד의 의미를 보존했습니다. 시간 관용구 כָּעֵת חַיָּה는 본문에서 ‘내년 이맘때’로 자연스럽게 번역하고, 직역의 불확실성과 문맥상 의미는 해당 표현에 연결된 각주에서 처리했습니다. 나머지 호칭과 여성형 자기지칭은 원문의 사회적·문법적 정보를 유지했습니다.
