reference: 2 Kings 4:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֥א אֱלִישָׁ֖ע הַ/בָּ֑יְתָ/ה וְ/הִנֵּ֤ה הַ/נַּ֨עַר֙ מֵ֔ת מֻשְׁכָּ֖ב עַל מִטָּתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/032.yaml
  text: When Elisha came into the house[a], behold, the boy was dead, laid on his bed.
  footnotes:
  - marker: a
    text: Or 'lying on his bed.' The Hebrew participle can be rendered more literally as a state of being stretched out or lying there.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사가 집에 들어오니, 보라, 그 소년은 죽어 있었고 그의 침상 위에 누워 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 침상에 누워 있었습니다.’ 히브리어 분사형은 상태를 더 직역하면 ‘뻗어 있는/누워 있는’ 상태를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: came into
  chosen_korean: 들어오니
  alternatives_korean:
  - 들어가니
  - 와서
  lexicon: HALOT
  rationale: wayyiqtol의 서사 진행을 자연스러운 과거 서술로 옮기되, 집 안으로의 이동을 분명히 드러내기 위해 ‘들어오니’로 렌더링했습니다.
- source_word: הַבָּיְתָה
  english_pob_choice: the house
  chosen_korean: 집에
  alternatives_korean:
  - 그 집에
  - 집 안으로
  lexicon: HALOT
  rationale: 방향의 he가 가리키는 ‘집 안으로’의 의미를 한국어 조사와 동사로 자연스럽게 반영했습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보십시오
  - 그리고 보니
  lexicon: HALOT
  rationale: 장면을 갑작스럽고 생생하게 제시하는 감탄 표지를 살리기 위해 ‘보라’로 옮겼습니다.
- source_word: מֵת מֻשְׁכָּב עַל מִטָּתוֹ
  english_pob_choice: was dead, laid on his bed
  chosen_korean: 죽어 있었고 그의 침상 위에 누워 있었습니다
  alternatives_korean:
  - 죽어 있었고 그의 침상에 놓여 있었습니다
  - 죽은 채 그의 침상 위에 누워 있었습니다
  lexicon: HALOT
  rationale: ‘죽어 있었고’로 상태를, ‘누워 있었습니다’로 מֻשְׁכָּב의 수동적 결과 상태를 살렸습니다. ‘침상’은 מִטָּה의 보다 직접적인 대응으로 선택했습니다.
theological_decisions:
- issue: 마지막 절의 장면 제시 방식
  chosen_reading: 서술형으로 유지하되 ‘보라’를 남겨 독자의 주의를 사건의 충격에 즉시 붙들게 했습니다.
  alternative_readings:
  - 단순히 ‘그 소년은 죽어 있었고…’로 평서화
  - ‘그리고 보니’로 완화
  rationale: וְהִנֵּה의 화용적 효과는 단순 정보 전달이 아니라 목격 장면의 생생한 제시이므로, 이를 약화시키지 않는 번역이 적절합니다.
  doctrine_reference: 서사 본문 화용론
