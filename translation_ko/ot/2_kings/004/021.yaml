  text: וַ/תַּ֨עַל֙ וַ/תַּשְׁכִּבֵ֔/הוּ עַל מִטַּ֖ת אִ֣ישׁ הָ/אֱלֹהִ֑ים וַ/תִּסְגֹּ֥ר בַּעֲד֖/וֹ וַ/תֵּצֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/021.yaml
  text: Then she went up and laid him on the bed of the man of God[a], shut the door behind him[b], and went out.
  footnotes:
  - marker: a
    text: Or 'shut the door on him,' that is, closed the door with him inside the room.
    reason: lexical_alternative
  - marker: b
    text: Or 'shut the door behind him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 여인은 올라가서 하나님의 사람의 침상 위에 그를 눕히고, 그를 위해 문을 닫고 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에 그를 두고 문을 닫고’, 곧 방 안에 그를 두기 위해 문을 닫는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  english_pob_choice: Then she went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 올랐습니다
  - 다음에 올라가서
  lexicon: WLC / עלה
  rationale: עלה의 기본 뜻인 ‘오르다/올라가다’를 살려, 앞 문맥의 위층 공간으로 이동하는 동작을 자연스럽게 옮겼습니다.
- source_word: וַתַּשְׁכִּבֵהוּ עַל
  english_pob_choice: laid him on
  chosen_korean: 그를 … 위에 눕히고
  alternatives_korean:
  - 그를 … 위에 눕혀 놓고
  - 그를 … 위에 뉘이고
  lexicon: WLC / שׁכב
  rationale: 사역형의 ‘눕게 하다’라는 뜻을 반영하되, 현대 한국어에서 가장 자연스러운 서술로 ‘눕히고’라고 옮겼습니다.
- source_word: מִטַּת אִישׁ הָאֱלֹהִים
  english_pob_choice: the bed of the man of God
  chosen_korean: 하나님의 사람의 침상
  alternatives_korean:
  - 하나님의 사람의 침대
  - 하나님의 사람의 잠자리
  lexicon: WLC / מִטָּה, אִישׁ הָאֱלֹהִים
  rationale: מִטָּה는 여기서 단순한 가구로서의 ‘침상/침대’가 적절하고, אִישׁ הָאֱלֹהִים은 해석을 덧붙이지 않고 직역하여 ‘하나님의 사람’으로 유지했습니다.
- source_word: וַתִּסְגֹּר בַּעֲדוֹ
  english_pob_choice: shut the door behind him
  chosen_korean: 그를 위해 문을 닫고
  alternatives_korean:
  - 그 뒤로 문을 닫고
  - 그를 안에 두고 문을 닫고
  lexicon: WLC / סגר, בעד
  rationale: בַּעֲדוֹ는 그를 안에 두고 문을 닫는 뜻을 담으므로, 공간적 결과를 살려 ‘그를 위해 문을 닫고’로 옮겼습니다. 한국어에서는 ‘뒤에’보다 이 표현이 더 자연스럽고 오해가 적습니다.
- source_word: וַתֵּצֵא
  english_pob_choice: and went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 그리고 나갔습니다
  - 밖으로 나갔습니다
  lexicon: WLC / יצא
  rationale: יצא의 기본 동작을 간결하게 살려 서술 흐름을 유지했습니다.
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים의 호칭 유지
  chosen_reading: ‘하나님의 사람’으로 직역해 엘리사를 곧바로 ‘예언자’로 풀지 않았습니다.
  alternative_readings:
  - 예언자
  - 하나님의 선지자
  rationale: 본문의 표준 호칭을 보존해 화자의 표현 자체를 드러내는 것이 더 소스 충실적이기 때문입니다.
  doctrine_reference: 호칭 보존과 서술 층위 유지
