  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
  footnotes:
  - marker: a
    text: Or 'pay your creditor,' if the underlying form is taken with reference to the person owed rather than the debt itself.
    reason: lexical_alternative
  - marker: b
    text: Literally 'you and your sons will live by the remainder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 와서 하나님의 사람에게 알렸습니다. 그러자 그가 말했습니다. 「가서 기름을 팔고 빚을 갚으십시오.[a] 그러면 당신과 당신의 아들들이 남은 것으로[b] 살아갈 수 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빚’을 갚는 뜻으로 옮겼습니다. 원문의 형태는 ‘채권자’ 자체를 가리키는 것으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너와 네 아들들이 남은 것으로 살 것이다’입니다.
    reason: lexical_alternative
