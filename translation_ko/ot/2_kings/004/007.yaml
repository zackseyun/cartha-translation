base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/007.yaml
  text: Then she came and told the man of God[a], and he said, “Go, sell the oil, and pay your debts[b]; and you and your sons can live on what is left.”
  footnotes:
  - marker: a
    text: Or 'pay your creditor,' if the underlying form is taken with reference to the person owed rather than the debt itself.
    reason: lexical_alternative
  - marker: b
    text: Literally 'you and your sons will live by the remainder.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 와서 하나님의 사람에게 알리니, 그가 말했습니다. 「가서 기름을 팔고, 빚을 갚으십시오. 그러면 당신과 당신의 아들들이 남은 것으로 살 수 있습니다.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빚’을 갚는 뜻으로 옮겼습니다. 원문 형식은 때로 ‘채권자’ 자체를 가리키는 것으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘남은 것으로 네가 네 아들들과 살 것이다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 선지자
  lexicon: WLC
  rationale: 히브리어 직함을 직역해 인물의 신적 소속과 권위를 드러내되, ‘선지자’로 풀어 의미를 좁히지 않았습니다.
- source_word: וְשַׁלְּמִי אֶת נִשְׁיֵךְ
  english_pob_choice: pay your debts
  chosen_korean: 빚을 갚으십시오
  alternatives_korean:
  - 빚을 지불하십시오
  - 채무를 갚으십시오
  lexicon: WLC
  rationale: 금전 채무 문맥이므로 자연스러운 한국어로 ‘빚을 갚다’로 옮겼고, 영어 POB의 복수형 ‘debts’를 반영했습니다.
- source_word: בַּנּוֹתָר
  english_pob_choice: on what is left
  chosen_korean: 남은 것으로
  alternatives_korean:
  - 남은 것을 가지고
  - 나머지로
  lexicon: WLC
  rationale: 남아 있는 몫으로 생계를 유지한다는 뜻을 살리기 위해, 결과적 생존 수단을 드러내는 표현을 택했습니다.
- source_word: תִּחְיִי
  english_pob_choice: can live
  chosen_korean: 살 수 있습니다
  alternatives_korean:
  - 살게 됩니다
  - 살아갈 수 있습니다
  lexicon: WLC
  rationale: 단순 미래가 아니라 남은 것으로 생존이 가능해진다는 뉘앙스를 살려 ‘살 수 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 사람 호칭의 번역 방식
  chosen_reading: ‘하나님의 사람’으로 직역해 예언자 직함의 의미를 유지했습니다.
  alternative_readings:
  - ‘선지자’로 의역
  - ‘하나님의 종’으로 완화
  rationale: 본문이 특정 직분명보다 문자적으로 ‘하나님의 사람’을 말하므로, 독자가 원문 호칭의 강도를 그대로 느끼도록 했습니다.
  doctrine_reference: 본문 직함의 직역 원칙
- issue: 대화체의 공손한 명령형
  chosen_reading: 엘리사가 여인에게 공손한 명령형(하십시오체)으로 말하는 것으로 처리했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 반말체로 통일
  rationale: 서술문은 합쇼체를 유지하되, 인물 간 직접 화법은 한국어 자연성을 위해 공손한 명령으로 옮겼습니다.
  doctrine_reference: 문체/화행 일관성
