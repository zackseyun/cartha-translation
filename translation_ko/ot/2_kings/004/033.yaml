translation:
  language: ko
  text: 그가 안으로 들어가 두 사람 뒤에서 문을 닫고, 야훼께 기도했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두 사람 위에 문을 닫고”라는 뜻일 수 있는데, 곧 그와 아이만 방 안에 함께 있게 했다는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: He went in
  chosen_korean: 안으로 들어가
  alternatives_korean:
  - 들어갔습니다
  - 들어갔고
  lexicon: HALOT
  rationale: 연속 동작을 나타내는 wayyiqtol의 서술 흐름을 살리면서, 방 안으로 들어가는 장면을 자연스러운 현대 한국어로 표현했습니다.
- source_word: וַיִּסְגֹּר הַדֶּלֶת
  english_pob_choice: shut the door
  chosen_korean: 문을 닫고
  alternatives_korean:
  - 문을 닫아 걸고
  - 문을 닫았습니다
  lexicon: HALOT
  rationale: סגר의 핵심은 ‘닫다/닫아 걸다’이지만, 문을 닫아 두 사람만 안에 있게 하는 문맥을 한국어로 간결하게 살리기 위해 ‘문을 닫고’로 옮겼습니다.
- source_word: בְּעַד שְׁנֵיהֶם
  english_pob_choice: behind the two of them
  chosen_korean: 두 사람 뒤에서
  alternatives_korean:
  - 두 사람에게서
  - 두 사람 위에
  lexicon: HALOT
  rationale: 문을 닫아 그 둘을 안쪽에 가두는 장면이므로, 관용적이고 이해하기 쉬운 ‘뒤에서’로 원문의 공간 관계를 전달했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 고유한 언약 이름을 일반적인 호칭인 ‘주님’으로 완화하지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 처리
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 히브리어 본문이 테트라그람마톤을 직접 사용하므로, 호칭으로 바꾸지 않고 고유 이름을 드러내는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
