base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/013.yaml
  text: And he said to him[a], “Please say to her, ‘Look, you have taken all this trouble for us. What is to be done for you? Is there anything to be spoken for you to the king or to the commander of the army?’” And she said[c][b], “I am living among my own people.”
  footnotes:
  - marker: a
    text: Or, more literally, “you have trembled/been anxious for us with all this anxiety,” an idiom here meaning she has shown great care and gone to much trouble for them.
    reason: lexical_alternative
  - marker: b
    text: Or, “Is there anything to say on your behalf to the king or to the commander of the army?”
    reason: lexical_alternative
  - marker: c
    text: “I am living among my own people” likely means she is settled securely within her community and does not seek special favor from royal or military authorities.
    reason: cultural_note
translation:
  language: ko
  text: 그가 그에게 말했습니다. 「그 여인에게 이렇게 말해 주십시오. ‘보십시오, 당신은 우리를 위해 이 모든 수고를 하셨습니다[a]. 당신을 위해 무엇을 해 드려야 하겠습니까? 왕에게나 군대의 지휘관에게 당신을 위해 말씀드릴 일이 있겠습니까?[b]’」 그러자 그녀가 말했습니다. 「나는 내 백성 가운데에 살고 있습니다.[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘우리에게 이 모든 떨림/염려를 보이셨다’에 가깝지만, 여기서는 큰 수고와 세심한 배려를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘왕에게나 군대의 지휘관에게 당신을 위해 말할 일이 있느냐’는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘나는 내 백성 가운데에 산다’는 말은 단순한 거주지 정보라기보다, 공동체 안에 안정적으로 자리 잡고 있어 왕실이나 군사 권력의 특별한 도움을 구할 필요가 없다는 뜻일 가능성이 큽니다.
    reason: cultural_note
lexical_decisions:
- source_word: חָרַדְתְּ / חֲרָדָה
  english_pob_choice: you have taken all this trouble for us
  chosen_korean: 우리에게 이 모든 수고를 끼쳤습니다
  alternatives_korean:
  - 우리에게 이 모든 염려를 보이셨습니다
  - 우리에게 이 모든 애씀을 하셨습니다
  lexicon: HALOT
  rationale: חרד/חרדה의 ‘떨다, 마음을 쓰다, 애쓰다’라는 뜻이 이 환대의 문맥에서는 단순한 불안보다 상대를 위해 기울인 정성과 수고를 가리키므로, 자연스럽고 문맥에 맞는 ‘수고를 끼치다’를 택했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끌어 다음 말을 도입하는 표현이므로, 현대 표준어에서 공손하고 분명한 ‘보십시오’로 옮겼습니다.
- source_word: הֲיֵשׁ לְדַבֶּר לָךְ
  english_pob_choice: Is there something to be spoken for you
  chosen_korean: 당신을 위해 말해 드릴 일이 있겠습니까
  alternatives_korean:
  - 당신을 대신해 말할 것이 있겠습니까
  - 당신을 위해 청해 드릴 일이 있겠습니까
  lexicon: HALOT
  rationale: 히브리어는 ‘그녀를 위해 말하다’, 곧 대변하거나 청원해 주는 뜻이어서, 직역을 너무 어색하게 밀어붙이기보다 ‘말해 드릴 일’로 옮겨 간접적 중보의 의미를 살렸습니다.
- source_word: שַׂר הַצָּבָא
  english_pob_choice: the commander of the army
  chosen_korean: 군대의 지휘관
  alternatives_korean:
  - 군대의 사령관
  - 군대의 장관
  lexicon: HALOT
  rationale: שַׂר는 ‘우두머리, 지휘관’의 뜻이므로, 현대 한국어에서 자연스럽고 직관적인 ‘군대의 지휘관’으로 번역했습니다.
- source_word: בְּתוֹךְ עַמִּי אָנֹכִי יֹשָׁבֶת
  english_pob_choice: I am living among my own people
  chosen_korean: 나는 내 백성 가운데에 살고 있습니다
  alternatives_korean:
  - 나는 내 백성 한가운데에 살고 있습니다
  - 나는 내 백성 속에 거하고 있습니다
  lexicon: HALOT
  rationale: 이 표현은 단순한 거주 사실을 넘어서 자기 공동체 안에서의 안정과 만족을 나타내므로, POB의 문화적 함의를 유지하면서도 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 여인의 응답이 왕이나 군대 지휘관의 특혜를 거절하는 뉘앙스
  chosen_reading: 그녀는 내 백성 가운데 살고 있다고 말함으로써, 왕실이나 군사 권력에 특별한 청탁이 필요 없음을 드러냅니다.
  alternative_readings:
  - 단순히 현재 거주지를 말하는 것으로 볼 수 있음
  - 겸손한 사양 표현으로 이해할 수 있음
  rationale: POB의 문화적 주석처럼, 이 말은 사회적 안전과 공동체적 안정을 암시하며 특별한 후원을 구하지 않는 태도를 보여 줍니다.
  doctrine_reference: 문맥 주해/서사적 함의
- issue: 직접화법의 공손한 요청 표현
  chosen_reading: נא를 한국어 공손 표현으로 반영해, 요청과 청원의 분위기를 살렸습니다.
  alternative_readings:
  - 명령형으로 강하게 옮길 수 있음
  - 단순 서술로 약화시킬 수 있음
  rationale: 서술 전체가 엘리사의 배려와 여인의 응답을 공손하게 주고받는 장면이므로, 한국어에서도 예의와 간청의 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 문체/화법 일치
