base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/017.yaml
  text: So the woman conceived and bore a son at that appointed time[a], about this time next year, just as Elisha had spoken to her.
  footnotes:
  - marker: a
    text: 'Hebrew: ''at this appointed time, at the time of life''; an idiom meaning roughly the same season next year.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인은 정해진 때, 곧 이듬해 이맘때에 아들을 낳았습니다. 엘리사가 그 여자에게 말한 그대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘이 정해진 때, 곧 생명의 때’라는 관용구로, 대체로 ‘내년 이맘때’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: וַתַּהַר
  english_pob_choice: conceived
  chosen_korean: 임신했습니다
  alternatives_korean:
  - 아이를 잉태했습니다
  - 아이를 가졌습니다
  lexicon: WLC/표준 현대 한국어
  rationale: 히브리어 הרה는 임신의 시작을 가리키므로, 서술체에서는 ‘임신했습니다’가 가장 직접적이고 자연스럽습니다.
- source_word: הָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여인
  alternatives_korean:
  - 그 여자
  - 그 아내
  lexicon: WLC/담화 문맥
  rationale: 앞 절에서 이미 소개된 수넴 여인을 가리키므로, 문맥적 지시를 살리면서도 ‘여자’보다 공손한 ‘여인’이 한국어 서술에 더 적합합니다.
- source_word: לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה
  english_pob_choice: at that appointed time ... about this time next year
  chosen_korean: 정해진 때, 곧 이듬해 이맘때에
  alternatives_korean:
  - 이 정해진 때에, 곧 다음 해 이맘때에
  - 약속된 때에, 곧 일 년 뒤 이맘때에
  lexicon: HALOT
  rationale: מוֹעֵד는 단순한 시간이 아니라 ‘정해진/지정된 때’라는 뜻이 강하므로 이를 반영했고, כָּעֵת חַיָּה는 관용적으로 ‘이듬해 이맘때’로 옮겨 예언 성취의 의미를 분명히 했습니다.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיהָ
  english_pob_choice: just as Elisha had spoken to her
  chosen_korean: 엘리사가 그 여자에게 말한 그대로
  alternatives_korean:
  - 엘리사가 그 여자에게 말한 대로
  - 엘리사가 그 여자에게 일러 준 그대로
  lexicon: HALOT
  rationale: 관계절은 이전에 한 엘리사의 말을 성취로 연결하므로, ‘그대로’로 대응을 분명히 하되 과장 없이 자연스럽게 표현했습니다.
theological_decisions:
- issue: 예언 성취의 강조
  chosen_reading: 마지막 절을 ‘말한 그대로’로 처리해 엘리사의 선포와 출산 사건의 정확한 일치를 드러냈습니다.
  alternative_readings:
  - 단순 서술로만 옮겨 성취 관계를 약화시키는 방식
  - ‘예언한 대로’처럼 예언어를 명시하는 방식
  rationale: 본문은 사건의 발생 자체보다 야훼의 말씀에 대한 성취를 강조하므로, 성취 대응을 한국어에서도 유지하는 것이 본문 의도에 충실합니다.
  doctrine_reference: 예언 성취 / 신적 말씀의 확실성
