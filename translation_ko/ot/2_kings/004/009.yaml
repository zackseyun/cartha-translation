source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אִישָׁ֔/הּ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִ֥ישׁ אֱלֹהִ֖ים קָד֣וֹשׁ ה֑וּא עֹבֵ֥ר עָלֵ֖י/נוּ תָּמִֽיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/009.yaml
  text: And she said to her husband[a], “Look now, I know that this is a holy man of God who regularly passes by us.”
  footnotes:
  - marker: a
    text: Or “who continually passes by us.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 남편에게 말했습니다. “보십시오, 제가 아는데, 이분은 하나님의 거룩한 사람으로서 우리에게 늘 들르십니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리에게 계속 지나가십니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אִישָׁהּ
  english_pob_choice: to her husband
  chosen_korean: 남편에게
  alternatives_korean:
  - 그의 남자에게
  - 그 남자에게
  lexicon: HALOT
  rationale: אִישׁ with a feminine suffix in this 가정적 문맥은 단순히 ‘남자’가 아니라 ‘남편’을 뜻하므로, 한국어도 관계를 직접 드러내는 ‘남편’이 가장 정확합니다.
- source_word: הִנֵּה נָא
  english_pob_choice: Look now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보세요
  - 자, 보십시오
  - 이보십시오
  lexicon: HALOT
  rationale: 주의를 환기하는 הִנֵּה와 완곡한 आग्रह נָא를 현대 한국어의 정중한 호격 표현으로 옮겨, 대화의 자연스러움과 정중함을 함께 살렸습니다.
- source_word: אִישׁ אֱלֹהִים קָדוֹשׁ
  english_pob_choice: a holy man of God
  chosen_korean: 하나님의 거룩한 사람
  alternatives_korean:
  - 하나님의 성스러운 사람
  - 거룩한 하나님의 사람
  lexicon: HALOT
  rationale: אִישׁ אֱלֹהִים은 예언자적 직함이므로 ‘하나님의 사람’으로 유지하고, קָדוֹשׁ는 ‘거룩한’으로 옮겨 직함의 종교적 무게를 보존했습니다.
- source_word: עֹבֵר עָלֵינוּ תָּמִיד
  english_pob_choice: who regularly passes by us
  chosen_korean: 우리에게 늘 들르십니다
  alternatives_korean:
  - 우리 곁을 늘 지나가십니다
  - 우리에게 계속 지나가십니다
  lexicon: HALOT
  rationale: עבר על의 맥락상 반복적 방문/통과를 가리키므로, 한국어에서는 ‘들르다’가 장소를 반복적으로 찾아오는 뉘앙스를 가장 자연스럽게 전달합니다. תָּמִיד은 ‘늘’로 간결하게 살렸습니다.
theological_decisions:
- issue: אִישׁ אֱלֹהִים의 직함 보존
  chosen_reading: ‘하나님의 거룩한 사람’으로 옮겨 예언자적 직함과 קדוש의 성격을 함께 드러냈습니다.
  alternative_readings:
  - ‘경건한 사람’
  - ‘하나님께 속한 사람’
  rationale: 본문은 단순한 도덕 평가가 아니라 엘리사를 알아보는 서술이므로, 직함의 식별 기능을 유지하는 번역이 필요합니다.
  doctrine_reference: Translation philosophy §1, §5
- issue: 남편에게의 직접 발화 정중성
  chosen_reading: 인물 대사는 현대 한국어 정중체로 유지했습니다.
  alternative_readings:
  - 평서형
  - 더 친숙한 구어체
  rationale: 서술문은 합쇼체를 유지하고, 인물 대사는 문맥상 가능한 정중한 호소로 처리해 원문의 대화 기능을 자연스럽게 살렸습니다.
  doctrine_reference: Korean target style guidance
