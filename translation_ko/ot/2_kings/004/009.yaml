revisions:
- from: 그녀가 남편에게 말했습니다. “보십시오, 제가 아는데, 이분은 하나님의 거룩한 사람으로서 우리에게 늘 들르십니다.”[a]
  to: 그녀가 남편에게 말했습니다. “보십시오, 저는 이분이 우리 곁을 늘 지나가시는 하나님의 거룩한 사람이라는 것을 압니다.”[a]
  rationale: 본문은 여인이 남편에게 엘리사가 반복하여 자신들의 곁을 지나는 ‘하나님의 거룩한 사람’임을 알아보았다고 말합니다. ‘지나가시다’로 이동 표현을 보존하고, ‘늘’로 תָּמִיד의 습관적 반복을 자연스럽게 옮겼습니다. 각주에는 ‘계속’이라는 가능한 어휘 대안을 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:52:00Z'
