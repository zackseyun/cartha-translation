theological_decisions:
- issue: שָׁלוֹם의 의미 범위
  chosen_reading: 평안으로 일관되게 옮겨, 단순한 내면의 평화가 아니라 안녕·무사·복리의 확인으로 읽히게 했습니다.
  alternative_readings:
  - 평화
  - 무사
  rationale: 본문의 שאלות는 반복되는 안부 확인이며, 한국어 ‘평안’이 이 범위를 가장 균형 있게 담습니다.
  doctrine_reference: 문맥상 안부 인사와 가족의 안전을 묻는 서술
- issue: 공손 표현과 직접 화법
  chosen_reading: 하인에 대한 명령은 간청형 ‘부디 달려가서’로, 여인에게는 공손한 2인칭 존대 ‘당신은’과 합쇼체 질문을 사용했습니다.
  alternative_readings:
  - 직설적 명령형
  - 더 낮은 구어체
  rationale: 서술자는 명령을 전달하지만, 한국어 독자에게는 왕실/예언자적 긴박함과 예의가 함께 전달되어야 합니다.
  doctrine_reference: 서술적 화법과 한국어 공손 체계
