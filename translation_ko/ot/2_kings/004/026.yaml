  text: Now please run to meet her and say to her[a], ‘Is it well with you? Is it well with your husband? Is it well with the child?’ And she said[b], ‘It is well.’
  footnotes:
  - marker: a
    text: 'Hebrew shalom, repeated four times in this verse, can denote peace, wholeness, or well-being. Here it refers to welfare: ''Is it well...?'' / ''It is well.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'Is the boy well?' The Hebrew yeled can mean 'child' or 'boy.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 부디 달려가서 그녀를 맞으러 가서 그녀에게 이렇게 말하십시오. ‘평안하십니까?[a] 남편께서는 평안하십니까? 아이는 평안합니까?[b]’ 그러자 그녀가 말했습니다. ‘평안합니다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 샬롬(שָׁלוֹם)은 이 절에서 네 번 반복되며, ‘평화’뿐 아니라 안녕, 무사, 복리를 가리킬 수 있습니다. 여기서는 안부와 안전을 묻고 답하는 말입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 옐레드(יֶלֶד)는 ‘아이’ 또는 ‘소년’을 뜻할 수 있습니다. 여기서는 문맥상 그 여인의 아들을 가리킵니다.
    reason: lexical_alternative
