  - marker: a
    text: Or, 'and there was some left over.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그것을 그들 앞에 놓았고, 그들은 먹고도 남겼습니다.[a] 이는 야훼의 말씀대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “남은 것이 있었습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  english_pob_choice: he set it before them
  chosen_korean: 그가 그들 앞에 그것을 차려 놓으니
  alternatives_korean:
  - 그가 그들 앞에 그것을 놓으니
  - 그가 그들 앞에 그것을 내놓으니
  lexicon: HALOT
  rationale: נתן + לִפְנֵיהֶם는 단순한 ‘주다’보다 식사를 앞에 두는 장면이므로, 한국어에서는 식사 문맥에 자연스러운 ‘차려 놓다’가 동작과 장면을 잘 드러냅니다.
- source_word: וַיֹּאכְלוּ
  english_pob_choice: they ate
  chosen_korean: 그들이 먹고
  alternatives_korean:
  - 그들이 먹었습니다
  - 그들이 그것을 먹고
  lexicon: HALOT
  rationale: 서술 연쇄를 살리기 위해 동사형으로 간결하게 옮겼고, 앞 문맥의 떡을 가리키는 대상은 한국어에서 중복을 피했습니다.
- source_word: וַיּוֹתִרוּ
  english_pob_choice: had some left over
  chosen_korean: 남겼습니다
  alternatives_korean:
  - 일부가 남았습니다
  - 먹고도 남았습니다
  lexicon: HALOT
  rationale: יתר의 히필은 ‘남게 하다/남다’의 결과를 나타내므로, 기적의 초과분을 과장 없이 간명하게 ‘남겼습니다’로 옮겼습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로였습니다
  alternatives_korean:
  - 야훼의 말씀에 따라였습니다
  - 야훼의 말씀대로 이루어졌습니다
  lexicon: HALOT
  rationale: כִּדְבַר는 ‘말씀대로/말씀에 따라’의 공식적 결구이며, 한국어에서는 예언 성취를 자연스럽게 밝히는 ‘말씀대로였습니다’가 가장 직접적입니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명사 표기는 대체 칭호가 아니라 고유한 언약 이름이므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 일관되게 옮겼습니다.
theological_decisions:
- issue: 기적의 결과를 ‘남겼습니다’로 옮길지, 영어처럼 ‘some left over’의 여운을 유지할지
  chosen_reading: 결과 서술을 분명하게 해 ‘먹고 남겼습니다’로 옮겼습니다.
  alternative_readings:
  - 먹고도 조금 남았습니다
  - 먹고 남은 것이 있었습니다
  rationale: 히브리어 동사는 실제 잔여가 생겼다는 사실을 진술하므로, 한국어에서도 기적의 실재성을 흐리지 않도록 명료한 결과문으로 처리했습니다.
  doctrine_reference: Narrative fidelity and miracle reporting
