base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/029.yaml
  text: Then he said to Gehazi, “Tuck up your garment, take my staff in your hand, and go. If you meet anyone, do not greet him; and if anyone greets you, do not answer him. Then place my staff on the boy’s face.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'Gird up your loins,' an idiom for preparing quickly for action.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not bless him' / 'if anyone blesses you'; here the verb likely refers to exchanging greetings on the road.
    reason: lexical_alternative
  - marker: c
    text: '''Anyone'' renders Hebrew ''man'' with generic force in this context.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 게하시에게 말했습니다. “옷자락을 걷어 올리고[a] 내 지팡이를 네 손에 들고 가십시오. 누구를 만나더라도 그에게 인사하지 마십시오. 또 누가 네게 인사하더라도[b] 그에게 대답하지 마십시오. 그리고 내 지팡이를 그 아이의 얼굴 위에 놓으십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘네 허리를 동여라’라는 뜻으로, 급히 행동할 준비를 하라는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘축복하다’로도 옮길 수 있습니다. 여기서는 길에서 주고받는 인사나 문안을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲגֹר מָתְנֶיךָ
  english_pob_choice: Tuck up your garment
  chosen_korean: 옷자락을 걷어 올리고
  alternatives_korean:
  - 허리를 동이고
  - 옷을 추스르고
  lexicon: HALOT
  rationale: 히브리어는 급히 움직이기 위해 옷을 단단히 고정하라는 관용구이므로, 현대 한국어에서는 동작이 바로 보이도록 풀어 옮겼습니다.
- source_word: מִשְׁעַנְתִּי
  english_pob_choice: my staff
  chosen_korean: 내 지팡이
  alternatives_korean:
  - 내 막대기
  - 내 지팡이대
  lexicon: HALOT
  rationale: 예언자가 들고 가는 지팡이/막대의 의미이므로 가장 자연스럽고 문맥에 맞는 ‘지팡이’를 택했습니다.
- source_word: לֹא תְבָרְכֶנּוּ / וְכִי יְבָרֶכְךָ אִישׁ
  english_pob_choice: do not greet him / greets you
  chosen_korean: 인사하지 마십시오 / 인사하더라도
  alternatives_korean:
  - 축복하지 마십시오 / 축복하더라도
  - 문안하지 마십시오 / 문안하더라도
  lexicon: HALOT
  rationale: 이 동사쌍은 길에서의 만남에서 흔한 인사 행위를 가리킬 가능성이 크므로, 종교적 ‘축복’보다 상황에 맞는 ‘인사’로 옮겼습니다.
- source_word: וְשַׂמְתָּ ... עַל פְּנֵי הַנָּעַר
  english_pob_choice: Then place my staff on the boy’s face
  chosen_korean: 내 지팡이를 그 아이의 얼굴 위에 놓으십시오
  alternatives_korean:
  - 내 지팡이를 그 아이의 얼굴에 대십시오
  - 내 지팡이를 그 아이의 얼굴 위에 두십시오
  lexicon: HALOT
  rationale: ‘얼굴 위에’라는 위치 표현을 유지해 히브리어의 직접성을 살렸고, ‘놓으십시오’로 간명한 명령형을 살렸습니다.
theological_decisions:
- issue: 예언자적 명령의 화법
  chosen_reading: 엘리사가 게하시에게 직접적이고 긴박한 명령형으로 말하는 구도를 살려 한국어에서도 연속 명령을 유지했습니다.
  alternative_readings:
  - 완곡하게 풀어 ‘가서’와 ‘해 보십시오’로 완화하는 방식
  - 서술형으로 바꾸어 지시의 급박함을 약화시키는 방식
  rationale: 본문은 연속된 명령으로 서두름과 긴급성을 드러내므로, 이를 약화하지 않는 것이 원문의 효과를 보존합니다.
  doctrine_reference: 서사 본문 화법 보존
- issue: 예절 표현의 범위
  chosen_reading: ‘ברך’를 여기서는 종교적 축복보다 길에서의 인사로 이해해 옮겼습니다.
  alternative_readings:
  - ‘축복하다’로 직역하는 방식
  - ‘문안하다’로 옮기는 방식
  rationale: 문맥상 여행 중 만남에 대한 지시이므로, 일반적 예절 표현으로 읽는 것이 POB의 주해와 가장 잘 맞습니다.
  doctrine_reference: 문맥 우선 해석
