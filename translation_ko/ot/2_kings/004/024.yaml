  yaml_path: translation/ot/2_kings/004/024.yaml
  text: Then she saddled the donkey and said to her servant[a], “Drive on and go; do not slow down for me unless I tell you.”
  footnotes:
  - marker: a
    text: Hebrew 'do not restrain/stop for me to ride'; the sense is 'do not slow or stop on my account while I am riding.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그녀가 나귀에 안장을 얹고 그녀의 종에게 말했습니다. 「몰고 가서 가십시오. 내가 말할 때까지 내 쪽에서 속도를 늦추지 마십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내가 타는 것을 막지/멈추지 말라’는 뜻으로, 여기서는 ‘내가 타는 동안 내 쪽에서 속도를 늦추지 말라’는 의미입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּחֲבֹשׁ הָאָתוֹן
  english_pob_choice: Then she saddled the donkey
  chosen_korean: 그녀가 나귀에 안장을 얹고
  alternatives_korean:
  - 그녀가 나귀를 얹동여매고
  - 그녀가 나귀에 안장을 얹어 놓고
  lexicon: HALOT
  rationale: חבש는 여기서 짐승을 타도록 준비시키는 뜻이므로, 자연스러운 현대 한국어로 ‘안장을 얹다’가 가장 적절합니다. אָתוֹן은 암나귀이지만, 본문 의미에 큰 영향이 없으므로 기본형인 ‘나귀’로 옮겼습니다.
- source_word: נַעֲרָהּ
  english_pob_choice: her servant
  chosen_korean: 그녀의 종에게
  alternatives_korean:
  - 그녀의 하인에게
  - 그녀의 시종에게
  lexicon: HALOT
  rationale: 나아르는 여기서 수행하는 남성 종/시종을 가리키므로, 성별을 과도하게 부각하지 않으면서도 관계를 분명히 하는 ‘종’이 적절합니다.
- source_word: נְהַג וָלֵךְ
  english_pob_choice: Drive on and go
  chosen_korean: 몰고 가서 가십시오
  alternatives_korean:
  - 몰아 가십시오
  - 이끌고 가십시오
  - 계속 몰고 가십시오
  lexicon: HALOT
  rationale: נהג는 짐승을 몰아 앞으로 나아가게 하라는 뜻이므로 ‘몰고 가다’가 직접적입니다. 이어지는 וָלֵךְ는 동작의 지속과 전진을 강조하므로 ‘가십시오’를 덧붙여 긴급한 명령을 살렸습니다.
- source_word: אַל תַּעֲצָר לִי לִרְכֹּב
  english_pob_choice: do not slow down for me
  chosen_korean: 내 쪽에서 속도를 늦추지 마십시오
  alternatives_korean:
  - 내 때문에 멈추지 마십시오
  - 내가 타는 것을 방해하지 마십시오
  - 내 속도에 맞춰 늦추지 마십시오
  lexicon: HALOT
  rationale: עצר는 ‘막다, 멈추다, 지체하게 하다’의 뜻이므로, POB가 잡은 의미대로 ‘멈추지 말고/늦추지 말라’는 흐름을 한국어로 자연스럽게 표현했습니다. לִי는 ‘내가 타는 동안 나 때문에’라는 부담을 나타내므로 ‘내 쪽에서’로 풀었습니다.
- source_word: כִּי אִם אָמַרְתִּי לָךְ
  english_pob_choice: unless I tell you
  chosen_korean: 내가 말할 때까지
  alternatives_korean:
  - 내가 말하지 않는 한
  - 내가 말하기 전까지
  - 내가 말할 때가 아니면
  lexicon: HALOT
  rationale: כִּי אִם은 부정 명령 뒤에서 예외를 도입하므로 ‘~할 때까지/전까지’가 가장 자연스럽습니다. 직역보다 한국어 명령문으로서의 명료성을 우선했습니다.
