source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/מְלֹ֣את הַ/כֵּלִ֗ים וַ/תֹּ֤אמֶר אֶל בְּנָ/הּ֙ הַגִּ֨ישָׁ/ה אֵלַ֥/י עוֹד֙ כֶּ֔לִי וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אֵ֥ין ע֖וֹד כֶּ֑לִי וַֽ/יַּעֲמֹ֖ד הַ/שָּֽׁמֶן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/006.yaml
  text: And when the containers were full[a], she said to her son, “Bring me another container.” But he said to her[b], “There is not another container.” Then the oil stopped.
  footnotes:
  - marker: a
    text: Or “vessels” instead of “containers.”
    reason: lexical_alternative
  - marker: b
    text: Literally, “the oil stood.” The sense is that it stopped flowing.
    reason: lexical_alternative
translation:
  language: ko
  text: 그릇들이 가득 차자[a], 그녀가 아들에게 말했습니다. “다른 그릇을 제게 가져오십시오.” 그러자 아들이 그녀에게 말했습니다. “더 이상 다른 그릇이 없습니다.” 그때 기름이 멈추었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “용기들”.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 “기름이 섰습니다”입니다. 여기서는 기름이 더 이상 흐르지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְלֹאת הַכֵּלִים
  english_pob_choice: when the containers were full
  chosen_korean: 그릇들이 가득 차자
  alternatives_korean:
  - 그릇들이 가득 찼을 때
  - 그릇들이 차는 것이 끝났을 때
  lexicon: HALOT
  rationale: כִּמְלֹאת는 시간절로 이해하는 것이 자연스럽고, הַכֵּלִים는 본문 상황에 맞게 넓은 의미의 ‘그릇들’로 옮기는 것이 가장 정확합니다.
- source_word: הַגִּישָׁה
  english_pob_choice: Bring
  chosen_korean: 다른 그릇을 내게 가져오너라
  alternatives_korean:
  - 다른 그릇을 내게 가까이 가져오너라
  - 다른 그릇을 내게 내밀어라
  lexicon: HALOT
  rationale: 히필 명령형의 핵심은 ‘가까이 가져오다/갖다 대다’이지만, 이 장면에서는 실제로 그릇을 가져다 주는 뜻이므로 한국어로는 자연스럽게 ‘가져오너라’가 적절합니다.
- source_word: עוֹד כֶּלִי
  english_pob_choice: another container
  chosen_korean: 다른 그릇
  alternatives_korean:
  - 더 많은 그릇
  - 또 하나의 그릇
  lexicon: HALOT
  rationale: עוֹד는 단수 명사와 함께 ‘추가적인 하나’를 뜻하므로, ‘다른 그릇’이 가장 간결하고 본문 의미를 잘 살립니다.
- source_word: וַיַּעֲמֹד הַשָּׁמֶן
  english_pob_choice: the oil stopped
  chosen_korean: 기름이 멈추었습니다
  alternatives_korean:
  - 기름이 서 있었습니다
  - 기름이 흐르기를 멈추었습니다
  lexicon: HALOT
  rationale: עָמַד의 직역은 ‘서다’이지만 여기서는 흐름의 중단을 가리키므로, POB의 취지를 따라 자연스러운 ‘멈추었습니다’로 옮겼습니다.
