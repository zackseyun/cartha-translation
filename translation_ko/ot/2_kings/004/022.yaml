source:
  edition: WLC
  text: וַ/תִּקְרָא֮ אֶל אִישָׁ/הּ֒ וַ/תֹּ֗אמֶר שִׁלְחָ֨/ה נָ֥א לִ/י֙ אֶחָ֣ד מִן הַ/נְּעָרִ֔ים וְ/אַחַ֖ת הָ/אֲתֹנ֑וֹת וְ/אָר֛וּצָה עַד אִ֥ישׁ הָ/אֱלֹהִ֖ים וְ/אָשֽׁוּבָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/022.yaml
  text: Then she called to her husband and said[a], “Please send me one of the young men and one of the female donkeys[b], so that I may run to the man of God and return.”
  footnotes:
  - marker: a
    text: Or, 'so that I may hurry to the man of God and return.' The Hebrew verb literally means 'run,' expressing urgency.
    reason: lexical_alternative
  - marker: b
    text: '''Female donkeys'' renders a specifically feminine Hebrew noun; some translations simply have ''donkey'' or ''ass.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여자가 남편에게 불러 말했습니다. "부디 젊은이들 가운데 한 사람과 암나귀 한 마리를 내게 보내 주십시오. 그러면 내가 하나님의 사람에게 달려갔다가 돌아오겠습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘달리다’이며, 급박함을 드러냅니다.
    reason: source_note
  - marker: b
    text: 히브리어는 암컷을 가리키는 형태로, 일반적인 ‘나귀’보다 성별이 분명합니다.
    reason: source_note
lexical_decisions:
- source_word: וַתִּקְרָא אֶל אִישָׁהּ
  english_pob_choice: Then she called to her husband
  chosen_korean: 그 여자가 남편에게 불러 말했습니다
  alternatives_korean:
  - 그 여자가 남편에게 불렀습니다
  - 그리고 남편에게 말했습니다
  lexicon: WLC / HALOT
  rationale: אִישָׁהּ는 이 가정 맥락에서 '남편'이 자연스럽고, וַתִּקְרָא는 단순한 호명보다 말을 시작하는 동작까지 포함해 '불러 말했습니다'로 옮기면 장면 진행이 분명합니다.
- source_word: שִׁלְחָה נָא לִי
  english_pob_choice: Please send me
  chosen_korean: 부디 … 내게 보내 주십시오
  alternatives_korean:
  - 제발 … 보내 주십시오
  - 부디 … 보내 주시기 바랍니다
  lexicon: WLC / HALOT
  rationale: נָא는 공손한 간청이므로 '부디'로 살렸고, שִׁלְחָה의 요청 뉘앙스는 현대 한국어의 정중한 명령형 '보내 주십시오'가 가장 가깝습니다.
- source_word: אֶחָד מִן הַנְּעָרִים
  english_pob_choice: one of the young men
  chosen_korean: 젊은이들 가운데 한 사람
  alternatives_korean:
  - 젊은 종들 가운데 한 사람
  - 젊은이 한 명
  lexicon: WLC / HALOT
  rationale: נַעַר는 문맥상 수행원/젊은이를 가리킬 수 있으나, 여기서는 소속을 지나치게 특정하지 않고 '젊은이들 가운데 한 사람'으로 원문의 범위를 유지했습니다.
- source_word: וְאַחַת הָאֲתֹנוֹת
  english_pob_choice: and one of the female donkeys
  chosen_korean: 암나귀 한 마리
  alternatives_korean:
  - 암나귀들 가운데 한 마리
  - 암컷 나귀 한 마리
  lexicon: WLC / HALOT
  rationale: אֲתֹנוֹת는 분명한 암컷 형태이므로 성별 표지를 살려 '암나귀'로 옮겼습니다. 한국어에서는 수량을 자연스럽게 '한 마리'로 처리했습니다.
- source_word: וְאָרוּצָה ... וְאָשׁוּבָה
  english_pob_choice: so that I may run ... and return
  chosen_korean: 그러면 내가 하나님의 사람에게 달려갔다가 돌아오겠습니다
  alternatives_korean:
  - 내가 하나님의 사람에게 달려가서 돌아오겠습니다
  - 내가 하나님의 사람에게 서둘러 갔다가 돌아오겠습니다
  lexicon: WLC / HALOT
  rationale: אָרוּץ는 단순한 '가다'가 아니라 '달려가다'이며, 목적과 긴급성을 드러내기 위해 '달려갔다가'로 연결했습니다. וְאָשׁוּבָה는 약속된 귀환을 나타내므로 '돌아오겠습니다'로 마무리했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 선지자
  lexicon: WLC / HALOT
  rationale: 이 칭호는 엘리사를 가리키는 히브리어 관용구이므로, 예언자 해석을 덧씌우지 않고 원문 표지를 살린 '하나님의 사람'을 유지했습니다.
theological_decisions:
- issue: 긴급성을 드러내는 동사 선택
  chosen_reading: ‘달려갔다가’로 번역해 요청의 서두름과 절박함을 드러냈습니다.
  alternative_readings:
  - ‘서둘러 갔다가’로 완화할 수 있음
  - 단순히 ‘갔다가’로 평탄하게 옮길 수 있음
  rationale: 히브리어 אָרוּץ는 단순 이동이 아니라 빠른 달림을 뜻하므로, 서술의 감각적 강도를 약화하지 않는 것이 본문 의미에 충실합니다.
  doctrine_reference: 서사 본문의 동작 묘사 보존
