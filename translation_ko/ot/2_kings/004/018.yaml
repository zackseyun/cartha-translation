    text: 히브리어 ילד는 문맥에 따라 ‘아이’ 또는 ‘소년’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 관용구 ‘그리고 그 날이 되었다’는 ‘어느 날’이라는 서사적 표현입니다.
    reason: lexical_alternative
