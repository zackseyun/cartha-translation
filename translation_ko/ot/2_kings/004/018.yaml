    text: 히브리어 ‘예레드’는 문맥에 따라 ‘아이’ 또는 ‘소년’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 ‘그리고 그날이 되었다’는 ‘어느 날’이라는 서사적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדַּל
  english_pob_choice: grew
  chosen_korean: 자라났습니다
  alternatives_korean:
  - 자랐습니다
  - 성장했습니다
  lexicon: HALOT
  rationale: גדל의 자연스러운 서술로서 신체적 성장을 나타내므로, 현대 한국어에서는 간결한 ‘자라났습니다’가 가장 무난합니다.
- source_word: הַיָּלֶד
  english_pob_choice: the boy
  chosen_korean: 소년
  alternatives_korean:
  - 아이
  - 어린아이
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘child’보다 연령이 좀 더 드러나는 ‘소년’이 English POB의 ‘boy’를 잘 반영합니다.
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: one day
  chosen_korean: 어느 날
  alternatives_korean:
  - 하루가 되어
  - 그 날에
  lexicon: HALOT
  rationale: 히브리어 관용구는 서사 도입의 ‘어느 날’로 자연스럽게 옮기는 것이 문맥상 가장 분명합니다.
- source_word: הַקֹּצְרִים
  english_pob_choice: the reapers
  chosen_korean: 곡식 거두는 사람들
  alternatives_korean:
  - 추수하는 사람들
  - 거두는 사람들
  lexicon: HALOT
  rationale: קֹצְרִים은 곡식을 거두는 이들을 가리키므로, ‘reapers’의 기능을 분명히 드러내는 표현을 택했습니다.
