id: 2KI.4.34
reference: 2 Kings 4:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֜עַל וַ/יִּשְׁכַּ֣ב עַל הַ/יֶּ֗לֶד וַ/יָּשֶׂם֩ פִּ֨י/ו עַל פִּ֜י/ו וְ/עֵינָ֤י/ו עַל עֵינָי/ו֙ וְ/כַפָּ֣י/ו עַל כפ/ו וַ/יִּגְהַ֖ר עָלָ֑י/ו וַ/יָּ֖חָם בְּשַׂ֥ר הַ/יָּֽלֶד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/034.yaml
  text: Then he went up and lay on the boy[a], and put his mouth on his mouth, his eyes on his eyes, and his palms on his palms; and he stretched himself over him, and the boy’s flesh became warm.
  footnotes:
  - marker: a
    text: Or 'he bent over him.' The Hebrew verb is rare and may describe bending or stretching oneself over the child.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 올라가서 그 아이 위에 누워 자기 입을 그의 입에, 자기 눈을 그의 눈에, 자기 손바닥을 그의 손바닥에 대고 그 위에 몸을 뻗으니[a], 그 아이의 살이 따뜻해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 위에 몸을 굽혔다.’ 이 희귀한 히브리어 동사는 아이 위로 몸을 굽히거나 뻗는 동작을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: Then he went up
  chosen_korean: 그는 올라가서
  alternatives_korean:
  - 그는 위층으로 올라가서
  - 그는 다시 올라가서
  lexicon: HALOT
  rationale: עלה의 기본 동작인 ‘올라가다’를 살리고, 본문에 암시된 장소를 한국어 본문에 덧붙이지 않았습니다.
- source_word: וַיִּשְׁכַּב עַל הַיֶּלֶד
  english_pob_choice: lay on the boy
  chosen_korean: 그 아이 위에 누워
  alternatives_korean:
  - 그 아이 위에 누웠습니다
  - 그 아이 위에 몸을 뉘었습니다
  lexicon: HALOT
  rationale: שׁכב의 물리적 동작을 자연스러운 현대 한국어로 옮기되, 과도한 완곡어법은 피했습니다.
- source_word: וְכַפָּיו עַל כַּפָּיו
  english_pob_choice: his palms on his palms
  chosen_korean: 자기 손바닥을 그의 손바닥에
  alternatives_korean:
  - 자기 손을 그의 손에
  - 자기 손바닥을 그의 손에
  lexicon: HALOT
  rationale: כַּף는 일반적인 ‘손’보다 ‘손바닥’이 더 정확하므로, 신체 대응의 세밀함을 살렸습니다.
- source_word: וַיִּגְהַר עָלָיו
  english_pob_choice: he stretched himself over him
  chosen_korean: 그 위에 몸을 뻗으니
  alternatives_korean:
  - 그 위에 몸을 굽히니
  - 그 위로 몸을 굽히니
  lexicon: HALOT
  rationale: 희귀 동사 גהר의 ‘몸을 기울여/뻗어 위에 덮다’는 느낌을 살리되, 한국어에서 가장 분명한 동작 표현으로 옮겼습니다.
- source_word: וַיָּחָם בְּשַׂר הַיָּלֶד
  english_pob_choice: the boy’s flesh became warm
  chosen_korean: 그 아이의 살이 따뜻해졌습니다
  alternatives_korean:
  - 그 아이의 몸이 따뜻해졌습니다
  - 그 아이의 살이 데워졌습니다
  lexicon: HALOT
  rationale: בָּשָׂר의 구체적 육체성을 살려 ‘살’로 옮기고, חם은 결과 상태를 드러내는 ‘따뜻해졌습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 엘리사의 신체적 행위의 의미를 어떻게 제시할 것인가
  chosen_reading: 본문의 연속된 신체 접촉을 그대로 드러내되, 그것을 의학적 절차나 상징으로 해석하는 말을 본문에 넣지 않았습니다.
  alternative_readings:
  - 입대입 인공호흡으로 설명하기
  - 완곡하게 ‘몸을 굽혔다’만 제시하기
  rationale: 히브리어는 예언자의 실제 신체 행위를 묘사하지만 그 메커니즘을 설명하지 않으므로, 번역도 관찰 가능한 동작을 보존하는 데 머물렀습니다.
  doctrine_reference: Translation philosophy §1, §3, §6
