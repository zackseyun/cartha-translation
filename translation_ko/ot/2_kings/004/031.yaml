id: 2KI.4.31
reference: 2 Kings 4:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/גֵחֲזִ֞י עָבַ֣ר לִ/פְנֵי/הֶ֗ם וַ/יָּ֤שֶׂם אֶת הַ/מִּשְׁעֶ֨נֶת֙ עַל פְּנֵ֣י הַ/נַּ֔עַר וְ/אֵ֥ין ק֖וֹל וְ/אֵ֣ין קָ֑שֶׁב וַ/יָּ֤שָׁב לִ/קְרָאת/וֹ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר לֹ֥א הֵקִ֖יץ הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/031.yaml
  text: And Gehazi went on ahead of them and laid the staff on the boy’s face[a], but there was no sound and no response. So he returned to meet him and told him, saying, “The boy has not awakened.”
  footnotes:
  - marker: a
    text: Or, more literally, 'there was no voice and no attentiveness/hearing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 게하시가 그들보다 앞서 가서 지팡이를 그 아이의 얼굴에 대었으나, 소리도 없고 응답도 없었습니다[a]. 그래서 그는 엘리사를 맞으러 돌아와 말하였습니다. “그 아이가 깨어나지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 문자적으로, ‘목소리도 없고 귀 기울임도 없었다.’
    reason: 히브리어 וְאֵין קוֹל וְאֵין קָשֶׁב의 어휘적 대안을 제시합니다. קוֹל은 ‘소리’ 또는 ‘목소리’, קָשֶׁב은 ‘귀 기울임/주의 깊게 들음’을 뜻할 수 있습니다.
lexical_decisions:
- source_word: עָבַר לִפְנֵיהֶם
  english_pob_choice: went on ahead of them
  chosen_korean: 그들보다 앞서 가다
  alternatives_korean:
  - 그들 앞을 지나가다
  - 그들보다 먼저 가다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 통과가 아니라 앞서서 나아감을 뜻하므로, ‘앞서 가다’가 자연스럽고 의미를 정확히 살립니다.
- source_word: הַמִּשְׁעֶנֶת
  english_pob_choice: the staff
  chosen_korean: 막대기
  alternatives_korean:
  - 지팡이
  - 지팡이 막대
  lexicon: HALOT
  rationale: 본문의 도구는 예언자의 지팡이로 이해되지만, 한국어에서는 ‘막대기’가 가장 중립적이고 물건의 형상을 직접적으로 드러냅니다.
- source_word: וְאֵין קוֹל וְאֵין קָשֶׁב
  english_pob_choice: there was no sound and no response
  chosen_korean: 소리도 없고 응답도 없었습니다
  alternatives_korean:
  - 소리도 없고 듣는 기색도 없었습니다
  - 목소리도 없고 귀 기울임도 없었습니다
  lexicon: HALOT
  rationale: קוֹל과 קָשֶׁב의 병렬을 살리면서, 한국어에서는 ‘응답’이 문맥상 가장 자연스럽게 반응 부재를 전달합니다.
- source_word: לֹא הֵקִיץ הַנַּעַר
  english_pob_choice: The boy has not awakened
  chosen_korean: 그 아이가 깨어나지 않았습니다
  alternatives_korean:
  - 그 아이가 일어나지 않았습니다
  - 그 아이가 아직 깨지 않았습니다
  lexicon: HALOT
  rationale: הֵקִיץ는 ‘깨어나다/깨다’의 의미이므로, 결과 상태를 드러내는 ‘깨어나지 않았습니다’가 본문의 판단을 가장 분명하게 옮깁니다.
theological_decisions:
- issue: 반복 보고 सूत्र ‘말하였습니다’의 문체
  chosen_reading: 직접 화술 도입을 위해 ‘말하였습니다’로 옮기고, 인물 대사는 평서체로 유지했습니다.
  alternative_readings:
  - ‘말했습니다’
  - 직접 인용 없이 서술만 처리
  rationale: 히브리어의 וַיַּגֶּד לוֹ לֵאמֹר는 보고 뒤 직접 발화를 여는 공식이므로, 한국어도 그 형식을 유지하는 편이 서사 흐름을 더 잘 드러냅니다.
  doctrine_reference: 서술 형식의 충실 번역
