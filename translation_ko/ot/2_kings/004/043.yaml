  text: וַ/יֹּ֨אמֶר֙ מְשָׁ֣רְת֔/וֹ מָ֚ה אֶתֵּ֣ן זֶ֔ה לִ/פְנֵ֖י מֵ֣אָה אִ֑ישׁ וַ/יֹּ֗אמֶר תֵּ֤ן לָ/עָם֙ וְ/יֹאכֵ֔לוּ כִּ֣י כֹ֥ה אָמַ֛ר יְהוָ֖ה אָכֹ֥ל וְ/הוֹתֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/043.yaml
  text: 'But his servant said[a], “How am I to set this before a hundred men?” And he said, “Give it to the people, and let them eat[b], for thus says Yahweh: ‘They shall eat and have some left over.’”'
  footnotes:
  - marker: a
    text: Or, 'How can I give this to a hundred men?' The Hebrew literally says, 'What shall I give this before a hundred men?'
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''eat and leave over,'' an idiom meaning that food will remain after they have eaten.'
    reason: lexical_alternative
translation:
  language: ko
  text: '그의 시종이 말했습니다[a]. “제가 이것을 백 명 앞에 어떻게 내놓을 수 있겠습니까?” 그러자 그가 말했습니다. “백성에게 주어서 먹게 하십시오. 야훼께서 이렇게 말씀하십니다: ‘그들이 먹고도 남을 것입니다.’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, “제가 이것을 백 명에게 어떻게 줄 수 있겠습니까?” 히브리어를 직역하면 “내가 이것을 백 명 앞에 무엇을 내놓겠습니까?”입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘먹고 남다’라는 관용적 표현으로, 먹은 뒤에 음식이 남는다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתוֹ
  english_pob_choice: his servant
  chosen_korean: 그의 종
  alternatives_korean:
  - 그의 시종
  - 그의 하인
  lexicon: HALOT
  rationale: מְשָׁרֵת은 개인을 시중드는 종속적 수행자를 가리키므로, 현대 한국어에서는 서열과 관계를 가장 직접적으로 드러내는 ‘종’이 문맥에 맞습니다.
- source_word: מָה אֶתֵּן זֶה לִפְנֵי מֵאָה אִישׁ
  english_pob_choice: How am I to set this before a hundred men?
  chosen_korean: 제가 이것을 백 명 앞에 어떻게 내놓을 수 있겠습니까?
  alternatives_korean:
  - 제가 이것을 백 명에게 어떻게 줄 수 있겠습니까?
  - 이것을 백 명 앞에 어떻게 둘 수 있겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 ‘~앞에 두다’라는 구체적 이미지를 살리면서, 종의 당혹을 드러내는 의문형으로 자연스럽게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겼습니다. 이는 본문 안의 직접 발화로 유지해야 할 신명 표지입니다.
- source_word: אָכֹל וְהוֹתֵר
  english_pob_choice: They shall eat and have some left over.
  chosen_korean: 그들이 먹고도 남을 것입니다
  alternatives_korean:
  - 그들이 먹고 남길 것입니다
  - 그들이 먹고도 남아 있을 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 ‘먹다’가 아니라 실제로 남는 결과를 뜻하므로, 그 의미를 분명하게 드러내는 ‘먹고도 남을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 발화 속 신명 표기
  chosen_reading: “야훼께서 이렇게 말씀하십니다”로 직역하여 예언자 발화의 권위를 보존했습니다.
  alternative_readings:
  - “주께서 이렇게 말씀하십니다”
  - “여호와께서 이렇게 말씀하십니다”
  rationale: 본문은 직접적인 예언 공식이므로, 전통적 대체어보다 신명 자체를 드러내는 방식이 원문의 신학적 긴장을 더 잘 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
