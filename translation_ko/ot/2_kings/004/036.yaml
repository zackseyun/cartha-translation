  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּקְרָ֣א אֶל גֵּיחֲזִ֗י וַ/יֹּ֨אמֶר֙ קְרָא֙ אֶל הַ/שֻּׁנַמִּ֣ית הַ/זֹּ֔את וַ/יִּקְרָאֶ֖/הָ וַ/תָּב֣וֹא אֵלָ֑י/ו וַ/יֹּ֖אמֶר שְׂאִ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/036.yaml
  text: Then he called Gehazi and said[a], “Call this Shunammite woman.” So he called her, and she came to him. Then he said, “Take up your son.”
  footnotes:
  - marker: a
    text: Or “this Shunammite.” The Hebrew uses a feminine gentilic, literally “this Shunammite [woman].”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 게하시를 불러 말했습니다. 「이 수넴 여인을 불러 오십시오。」 그래서 그가 그녀를 불렀고, 그녀가 그에게 왔습니다. 그러자 그가 말했습니다. 「네 아들을 들어 올리십시오。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여성형 민족명사형을 사용하므로, 뜻은 “이 수넴 사람(여인)”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָא אֶל הַשֻּׁנַמִּית הַזֹּאת
  english_pob_choice: Call this Shunammite woman
  chosen_korean: 「이 수넴 여인을 불러 오십시오」
  alternatives_korean:
  - 「이 수넴 여인을 부르십시오」
  - 「이 수넴 여인을 불러 주십시오」
  lexicon: HALOT
  rationale: 여성 단수 지시어 הַזֹּאת를 살려 ‘이’로 옮기고, 지칭 대상이 여성임을 분명히 하기 위해 ‘여인’을 보탰습니다. ‘불러 오십시오’는 단순한 호출보다 하인에게 사람을 데려오게 하는 문맥을 자연스럽게 드러냅니다.
- source_word: וַיִּקְרָאֶהָ
  english_pob_choice: So he called her
  chosen_korean: 그래서 그가 그녀를 불렀고
  alternatives_korean:
  - 그리고 그가 그녀를 불렀고
  - 그리하여 그가 그녀를 불렀습니다
  lexicon: HALOT
  rationale: 히브리어의 반복된 קרא를 그대로 살려 게하시의 순종 동작을 분명히 했습니다. 서술 흐름은 합쇼체 내에서 자연스럽게 연결했습니다.
- source_word: וַתָּבֹא אֵלָיו
  english_pob_choice: and she came to him
  chosen_korean: 그녀가 그에게 왔습니다
  alternatives_korean:
  - 그녀가 그에게 다가왔습니다
  - 그녀가 그에게 들어왔습니다
  lexicon: HALOT
  rationale: אֶל + 인칭은 기본적으로 ‘~에게/으로’의 접근을 뜻하므로, 방 안으로 ‘들어오다’로 좁히지 않고 단순한 이동 관계를 살렸습니다.
- source_word: שְׂאִי בְנֵךְ
  english_pob_choice: Take up your son
  chosen_korean: 네 아들을 들어 올리십시오
  alternatives_korean:
  - 네 아들을 받아 들이십시오
  - 네 아들을 받으십시오
  lexicon: HALOT
  rationale: נשא의 명령형은 물리적으로 들어 올리는 동작을 가리키므로, 한국어에서도 ‘들어 올리다’로 직접 옮겼습니다. 2인칭 여성 단수의 대상을 반영해 ‘네’와 ‘아들’을 유지했습니다.
theological_decisions:
- issue: 직접 화법의 공손도
  chosen_reading: 엘리사가 게하시와 수넴 여인에게 정중하게 말하는 장면으로 보고, 명령형은 합쇼체 명령·청유로 처리했습니다.
  alternative_readings:
  - 직접적인 명령체로 더 거칠게 옮기는 방식
  - 일반 서술체로 완화하는 방식
  rationale: 본문은 왕래 지시와 회복된 아들을 건네는 장면이므로, 한국어에서는 공손한 명령이 원문의 장면 긴장을 해치지 않으면서도 자연스럽습니다.
  doctrine_reference: 서사문 문체 및 대화체 정합성
