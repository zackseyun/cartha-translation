  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
  footnotes:
  - marker: a
    text: Or 'all these vessels.' The Hebrew term is broad and can refer to various kinds of containers.
    reason: lexical_alternative
  - marker: b
    text: Or 'remove the full one' / 'put the full one aside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러면 들어가서 너와 네 아들들 뒤에서 문을 닫고, 이 그릇들에 모두 부으십시오. 그리고 가득 찬 것들은 치워 두십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֵּלִים은 넓게 ‘그릇들/용기들’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 단수형은 여기서 가득 찬 것들을 집합적으로 가리키는 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  english_pob_choice: Then go in
  chosen_korean: 그러면 들어가서
  alternatives_korean:
  - 들어가십시오
  - 그리고 들어가서
  lexicon: HALOT
  rationale: 명령형 상황이므로 한국어에서는 자연스럽게 연결되는 ‘그러면’으로 순서를 살리고, 동작은 ‘들어가서’로 옮겨 직역의 어색함을 피했습니다.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  english_pob_choice: shut the door
  chosen_korean: 문을 닫고
  alternatives_korean:
  - 문을 닫으시고
  - 문을 닫아
  lexicon: HALOT
  rationale: סגר는 문을 ‘닫다/잠그다’의 의미인데, 여기서는 이어지는 행동 지시를 살려 ‘문을 닫고’로 간결하게 옮겼습니다.
- source_word: בְּעַד בָּנַיִךְ
  english_pob_choice: behind your sons
  chosen_korean: 네 아들들 뒤에서
  alternatives_korean:
  - 네 아들들 뒤에
  - 네 아들들 뒤편에서
  lexicon: HALOT
  rationale: בעד는 문맥상 ‘뒤에서’라는 차단·차폐의 공간적 의미를 가지므로, 원문의 반복 구조를 살려 ‘너와 네 아들들 뒤에서’로 표현했습니다.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  english_pob_choice: all these containers
  chosen_korean: 이 그릇들에 모두
  alternatives_korean:
  - 이 모든 그릇에
  - 이 모든 용기에
  lexicon: HALOT
  rationale: כֵּלִים은 폭넓은 ‘그릇/용기/기구’를 가리키므로, 이 장면의 기름 붓기 맥락에는 한국어로 가장 자연스럽고 넓은 ‘그릇들’이 적절합니다.
- source_word: תַּסִּיעִי
  english_pob_choice: set aside the full ones
  chosen_korean: 가득 찬 것들은 치워 두십시오
  alternatives_korean:
  - 가득 찬 것은 치워 두십시오
  - 가득 찬 것들을 옮겨 두십시오
  lexicon: HALOT
  rationale: הסיע/נסע 계열의 ‘옮기다, 치우다’ 의미를 따라, 가득 찬 그릇을 작업 자리에서 분리하는 동작을 ‘치워 두십시오’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 엘리사의 지시문에서 반복되는 공간 표현과 명령형의 어조
  chosen_reading: 직접 지시를 살려 공손한 명령형으로 옮기고, ‘뒤에서’의 반복을 통해 사적인 공간 안에서의 차단성을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘문을 닫은 뒤’로 풀어쓰기
  - 평서형으로 바꾸어 설명적으로 번역
  rationale: 본문은 기적 행위의 준비 절차를 세밀하게 명령하므로, 한국어에서도 지시의 직접성과 동작 순서를 보존하는 것이 의미 전달에 유익합니다.
  doctrine_reference: 본문 내 서사적 지시의 재현
