base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/004.yaml
  text: Then go in and shut the door behind yourself and behind your sons[a], and pour into all these containers[b]; and set aside the full ones.
  footnotes:
  - marker: a
    text: Or 'all these vessels.' The Hebrew term is broad and can refer to various kinds of containers.
    reason: lexical_alternative
  - marker: b
    text: Or 'remove the full one' / 'put the full one aside.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그런 다음 들어가서 너와 네 아들들이 들어간 뒤에 문을 닫으십시오. 이 모든 그릇들[a]에 부으십시오. 가득 찬 것은[b] 따로 옮겨 놓으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כֵּלִים은 넓게 ‘그릇들’, ‘용기들’ 등 여러 종류의 물건을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘가득 찬 것’이라는 정관사 단수형입니다. 여기서는 가득 찬 그릇들을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאת
  english_pob_choice: Then go in
  chosen_korean: 그러면 들어가서
  alternatives_korean:
  - 들어가십시오
  - 그리고 들어가서
  lexicon: HALOT
  rationale: 명령형 상황이므로 한국어에서는 자연스럽게 연결되는 ‘그러면’으로 순서를 살리고, 동작은 ‘들어가서’로 옮겨 직역의 어색함을 피했습니다.
- source_word: וְסָגַרְתְּ הַדֶּלֶת
  english_pob_choice: shut the door
  chosen_korean: 문을 닫고
  alternatives_korean:
