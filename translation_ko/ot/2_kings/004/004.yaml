  lexicon: HALOT
  rationale: בעד는 문맥상 ‘뒤에서’라는 차단·차폐의 공간적 의미를 가지므로, 원문의 반복 구조를 살려 ‘너와 네 아들들 뒤에서’로 표현했습니다.
- source_word: כָּל הַכֵּלִים הָאֵלֶּה
  english_pob_choice: all these containers
  chosen_korean: 이 그릇들에 모두
  alternatives_korean:
  - 이 모든 그릇에
  - 이 모든 용기에
  lexicon: HALOT
  rationale: כֵּלִים은 폭넓은 ‘그릇/용기/기구’를 가리키므로, 이 장면의 기름 붓기 맥락에는 한국어로 가장 자연스럽고 넓은 ‘그릇들’이 적절합니다.
- source_word: תַּסִּיעִי
  english_pob_choice: set aside the full ones
  chosen_korean: 가득 찬 것들은 치워 두십시오
  alternatives_korean:
  - 가득 찬 것은 치워 두십시오
  - 가득 찬 것들을 옮겨 두십시오
  lexicon: HALOT
  rationale: הסיע/נסע 계열의 ‘옮기다, 치우다’ 의미를 따라, 가득 찬 그릇을 작업 자리에서 분리하는 동작을 ‘치워 두십시오’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 엘리사의 지시문에서 반복되는 공간 표현과 명령형의 어조
  chosen_reading: 직접 지시를 살려 공손한 명령형으로 옮기고, ‘뒤에서’의 반복을 통해 사적인 공간 안에서의 차단성을 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘문을 닫은 뒤’로 풀어쓰기
