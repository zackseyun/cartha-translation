  rationale: 본문은 기적 행위의 준비 절차를 세밀하게 명령하므로, 한국어에서도 지시의 직접성과 동작 순서를 보존하는 것이 의미 전달에 유익합니다.
  doctrine_reference: 본문 내 서사적 지시의 재현
