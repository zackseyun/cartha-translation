  lexicon: HALOT
  rationale: סגר는 문을 ‘닫다/잠그다’의 의미인데, 여기서는 이어지는 행동 지시를 살려 ‘문을 닫고’로 간결하게 옮겼습니다.
- source_word: בְּעַד בָּנַיִךְ
  english_pob_choice: behind your sons
  chosen_korean: 네 아들들 뒤에서
  alternatives_korean:
