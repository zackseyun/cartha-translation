base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
  footnotes:
  - marker: a
    text: Or “from afar.” The Hebrew expression indicates that he saw her while she was still some distance away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 가서 갈멜 산에 있는 하나님의 사람에게 이르렀습니다. 하나님의 사람이 그 여인을 멀리서 보자[a], 자기의 종 게하시에게 말하였습니다. "보아라, 저 수넴 여인이다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “멀리서”. 히브리어 표현은 그가 아직 꽤 떨어진 곳에 있는 동안 그녀를 보았다는 뜻을 담고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 예언자
  lexicon: HALOT
  rationale: 히브리어의 표준 호칭을 직접 옮겼고, 문맥상 엘리사를 가리키지만 직함 자체를 설명적으로 풀지 않았습니다.
- source_word: אֶל הַר הַכַּרְמֶל
  english_pob_choice: at Mount Carmel
  chosen_korean: 갈멜 산에 있는
  alternatives_korean:
  - 갈멜 산에
  - 갈멜 산으로
  lexicon: HALOT
  rationale: 앞의 동사들은 이동을 나타내지만, 장소 표시는 엘리사의 현재 위치를 가리키므로 한국어에서는 ‘~에 있는’이 가장 자연스럽습니다.
- source_word: מִנֶּגֶד
  english_pob_choice: from a distance
  chosen_korean: 멀리서
  alternatives_korean:
  - 멀리 떨어진 곳에서
  - 먼 데서
  lexicon: HALOT
  rationale: 상대적 거리를 나타내는 표현을 현대 한국어의 간결한 부사로 살렸습니다.
- source_word: הַשּׁוּנַמִּית הַלָּז
  english_pob_choice: that Shunammite woman
  chosen_korean: 저 수넴 여인
  alternatives_korean:
  - 저 수넴 여자
  - 그 수넴 여인
  lexicon: HALOT
  rationale: 지시어의 거리감과 지명형 형용사를 함께 보존하면서, 현대적이되 직설적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 사람이라는 호칭을 직역할지, 예언자로 풀어 쓸지
  chosen_reading: 직역하여 ‘하나님의 사람’으로 유지했습니다.
  alternative_readings:
  - 예언자
  - 하나님의 선지자
  rationale: 본문은 엘리사의 직분 설명보다 하나님의 소유·대표성을 드러내는 호칭을 사용하므로, 그 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 성경 본문 호칭의 보존과 인물 직함의 문맥적 직역
