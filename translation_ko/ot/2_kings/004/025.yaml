  rationale: 본문은 엘리사의 직분 설명보다 하나님의 소유·대표성을 드러내는 호칭을 사용하므로, 그 긴장을 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 성경 본문 호칭의 보존과 인물 직함의 문맥적 직역
