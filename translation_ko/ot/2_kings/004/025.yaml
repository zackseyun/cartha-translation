base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/025.yaml
  text: So she went and came to the man of God at Mount Carmel. And when the man of God saw her from a distance[a], he said to Gehazi his servant, “Look, that Shunammite woman.”
  footnotes:
  - marker: a
    text: Or “from afar.” The Hebrew expression indicates that he saw her while she was still some distance away.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 여인이 가서 갈멜 산에 있는 하나님의 사람에게 이르렀습니다. 하나님의 사람이 그 여인을 멀리서 보자[a], 자기의 종 게하시에게 말하였습니다. “보아라, 저 수넴 여인이다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “먼 데서”. 히브리어 표현은 그 여인이 아직 꽤 떨어진 곳에 있을 때 그가 그 여인을 보았다는 뜻을 담고 있습니다.
    reason: lexical_alternative
