base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/042.yaml
  text: And a man came from Baal-shalishah and brought to the man of God bread of the firstfruits[a], twenty loaves of barley, and fresh grain in his sack. And he said, “Give it to the people[b], so that they may eat.”
  footnotes:
  - marker: a
    text: Or 'parched grain.' The Hebrew term may refer to grain prepared for eating rather than simply fresh grain.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'sack' is rare and uncertain; it may refer to a bag, wrapping, or possibly the grain in its husk.
    reason: lexical_alternative
translation:
  language: ko
  text: 한 사람이 바알살리사에서 와서 하나님의 사람에게 첫 수확물의 떡, 곧 보리떡 스무 개와 자루에 담긴 햇곡식[a][b]을 가져왔습니다. 하나님의 사람이 말했습니다. “그것을 사람들에게 주어 먹게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘볶은 곡식’. 히브리어는 먹을 수 있도록 처리한 곡물을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 단어는 드물게 쓰이며 뜻이 확실하지 않습니다. 자루, 주머니, 포장물, 또는 곡식의 껍질을 가리킬 수 있습니다.
    reason: lexical_alternative
