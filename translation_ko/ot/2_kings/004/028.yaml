base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/028.yaml
  text: She said[a], “Did I ask my lord for a son? Did I not say, ‘Do not deceive me’?”
  footnotes:
  - marker: a
    text: Or “Do not deceive me” or “Do not give me false hope.” The Hebrew verb can denote misleading someone, here in the sense of raising hope that would prove empty.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 말했습니다. 「제가 제 주인께 아들을 구했습니까? 제가 ‘저를 속이지 마십시오’라고 말하지 않았습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「저를 오도하지 마십시오」. 히브리어 동사는 사람에게 기대를 품게 한 뒤 그 기대가 헛되게 되도록 잘못 이끄는 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  english_pob_choice: She said
  chosen_korean: 그녀가 말했습니다
  alternatives_korean:
  - 그리고 그녀가 말했습니다
  - 그녀가 말하였습니다
  lexicon: HALOT
  rationale: 서술 도입부의 וַ-연결을 한국어에서는 자연스럽게 풀어 '말했습니다'로 옮겼습니다.
- source_word: הֲשָׁאַלְתִּי בֵן מֵאֵת אֲדֹנִי
  english_pob_choice: Did I ask my lord for a son?
  chosen_korean: 제가 제 주인께 아들을 구했습니까?
  alternatives_korean:
  - 제가 제 주인께 아들을 요청했습니까?
  - 제가 제 주인에게 아들을 달라고 했습니까?
  lexicon: HALOT
  rationale: שאל은 여기서 간청·요청의 뉘앙스를 가지므로 '구하다'로 옮겼고, אֲדֹנִי는 예언자 엘리사를 가리키는 존칭으로 '제 주인'을 택했습니다.
- source_word: לֹא תַשְׁלֶה אֹתִי
  english_pob_choice: Do not deceive me
  chosen_korean: 저를 속이지 마십시오
  alternatives_korean:
  - 저를 속이지 말아 주십시오
  - 저에게 거짓 희망을 주지 마십시오
  lexicon: HALOT
  rationale: הִשְׁלָה는 단순한 거짓말보다 기대를 부풀려 실망시키는 뜻까지 포함할 수 있으나, 문맥상 핵심 경고를 한국어에서 직접적으로 드러내기 위해 '속이지 마십시오'로 옮겼습니다.
theological_decisions:
- issue: 엘리사에 대한 호칭 아ֲדֹנִי의 한국어 처리
  chosen_reading: 하나님 호칭이 아닌 인간 존칭으로 이해하여 '제 주인'으로 번역했습니다.
  alternative_readings:
  - 주님
  - 선생님
  rationale: 본문의 אֲדֹנִי는 엘리사를 향한 예의 있는 호칭이므로, 주님(신적 호칭)으로 옮기면 의미가 왜곡됩니다.
  doctrine_reference: 구약 서사에서 인물 간 존칭과 하나님의 호칭을 구분하는 번역 원칙
