  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
  footnotes:
  - marker: a
    text: Or 'a small upper chamber with a wall' or simply 'a small upper room.' The Hebrew phrase is somewhat compact, and 'on the wall' preserves its concrete wording.
    reason: lexical_alternative
  - marker: b
    text: Or 'he may turn aside there.' The Hebrew verb often means 'turn aside' and here refers to stopping there for lodging.
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 우리가 벽 위에 작은 윗방 하나를 만들고[a], 거기에 그를 위해 침대와 상과 의자와 등잔대를 두도록 합시다. 그리고 그가 우리에게 올 때마다 그곳에 들러 묵을 수 있을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벽이 딸린 작은 윗방’, 또는 단순히 ‘작은 윗방’입니다. 히브리어 구문은 압축적이어서 정확한 건축적 관계가 분명하지 않습니다. 여기서는 원문의 ‘벽’이라는 구체적 표현을 살렸습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그가 그곳으로 들를 것입니다’ 또는 ‘그가 그곳으로 돌아설 것입니다’입니다. 히브리어 동사는 흔히 ‘돌아서다, 들르다’를 뜻하며, 여기서는 숙박을 위해 들르는 뜻입니다.
    reason: alternative_reading
