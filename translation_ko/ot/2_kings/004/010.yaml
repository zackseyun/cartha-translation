source:
  edition: WLC
  text: נַֽעֲשֶׂה נָּ֤א עֲלִיַּת קִיר֙ קְטַנָּ֔ה וְ/נָשִׂ֨ים ל֥/וֹ שָׁ֛ם מִטָּ֥ה וְ/שֻׁלְחָ֖ן וְ/כִסֵּ֣א וּ/מְנוֹרָ֑ה וְ/הָיָ֛ה בְּ/בֹא֥/וֹ אֵלֵ֖י/נוּ יָס֥וּר שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/010.yaml
  text: Please let us make a small upper room on the wall[a], and let us put there for him a bed, a table, a chair, and a lampstand; and whenever he comes to us[b], he can turn in there.
  footnotes:
  - marker: a
    text: Or 'a small upper chamber with a wall' or simply 'a small upper room.' The Hebrew phrase is somewhat compact, and 'on the wall' preserves its concrete wording.
    reason: lexical_alternative
  - marker: b
    text: Or 'he may turn aside there.' The Hebrew verb often means 'turn aside' and here refers to stopping there for lodging.
    reason: lexical_alternative
translation:
  language: ko
  text: 부디 우리가 벽에 작은 윗방 하나를 만들고, 거기에 그를 위해 침대와 상과 의자와 등잔대를 두도록 합시다. 그리고 그가 우리에게 올 때마다, 거기에서 묵을 수 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벽이 딸린 작은 윗방’ 혹은 단순히 ‘작은 윗방’입니다. 히브리어 구문이 압축적이어서, 여기서는 구체적인 표현을 살렸습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘그가 거기로 들를 때마다’입니다. 히브리어 동사는 ‘돌이키다/들르다’의 뜻이 흔하며, 여기서는 숙박을 위해 들르는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: נַעֲשֶׂה נָּא
  english_pob_choice: Please let us make
  chosen_korean: 부디 우리가 … 만들고
  alternatives_korean:
  - 제발 우리가 … 만들고
  - 부디 우리가 … 만들도록 합시다
  lexicon: HALOT
  rationale: 청유형과 נָא의 공손한 요청을 현대 합쇼체로 자연스럽게 옮기되, 공동 제안을 살려 ‘우리가 … 만들고’로 시작했습니다.
- source_word: עֲלִיַּת קִיר קְטַנָּה
  english_pob_choice: a small upper room on the wall
  chosen_korean: 벽에 작은 윗방 하나
  alternatives_korean:
  - 벽 위의 작은 윗방 하나
  - 작은 윗방 하나
  lexicon: HALOT
  rationale: עֲלִיָּה의 ‘윗방’과 קִיר의 구체성을 살려 ‘벽에’로 옮겼고, קְטַנָּה는 ‘작은’으로 직역했습니다.
- source_word: מִטָּה וְשֻׁלְחָן וְכִסֵּא וּמְנוֹרָה
  english_pob_choice: a bed, a table, a chair, and a lampstand
  chosen_korean: 침대와 상과 의자와 등잔대
  alternatives_korean:
  - 침대와 탁자와 의자와 등잔대
  - 침상과 상과 의자와 등잔대
  lexicon: HALOT
  rationale: 가정용 비품의 목록을 그대로 살리되, מְנוֹרָה는 단순한 ‘등불’보다 구체적인 ‘등잔대’가 어울립니다.
- source_word: יָסוּר שָׁמָּה
  english_pob_choice: he can turn in there
  chosen_korean: 거기에서 묵을 수 있을 것입니다
  alternatives_korean:
  - 거기에서 들를 수 있을 것입니다
  - 거기에서 머무를 수 있을 것입니다
  - 거기에서 쉬어 갈 수 있을 것입니다
  lexicon: HALOT
  rationale: סוּר의 기본 의미는 ‘돌이키다/들르다’이지만, 숙소 문맥에서는 ‘묵다’가 기능적으로 자연스럽고 의미를 과도하게 확장하지 않습니다.
theological_decisions:
- issue: 손님 맞이를 위한 준비의 표현
  chosen_reading: 문장 구조를 따라 공동의 제안과 환대의 목적을 분명히 드러내는 평이한 합쇼체로 옮겼습니다.
  alternative_readings:
  - 더 직역하여 ‘우리가 … 하게 하십시오’로 옮길 수 있음
  - ‘윗방’을 ‘다락방’으로 바꿀 수 있음
  rationale: 이 절은 신학적 쟁점보다 서술의 구체성이 중요하므로, 원문의 환대 장면이 한국어 독자에게 즉시 이해되도록 했습니다.
  doctrine_reference: 서사 본문 번역 원칙
- issue: בְּבֹאוֹ의 반복적/미래적 시간표현
  chosen_reading: ‘그가 우리에게 올 때마다’로 반복성을 살렸습니다.
  alternative_readings:
  - ‘그가 우리에게 올 때’
  - ‘그가 우리에게 올 때마다’
  rationale: 히브리어의 미래 상황을 단발 사건으로 약화시키지 않도록 반복적 뉘앙스를 반영했습니다.
  doctrine_reference: 서술적 시간 표현
