source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלֶ֤י/הָ אֱלִישָׁע֙ מָ֣ה אֶֽעֱשֶׂה לָּ֔/ךְ הַגִּ֣ידִי לִ֔/י מַה יֶּשׁ ל/כי בַּ/בָּ֑יִת וַ/תֹּ֗אמֶר אֵ֣ין לְ/שִׁפְחָתְ/ךָ֥ כֹל֙ בַּ/בַּ֔יִת כִּ֖י אִם אָס֥וּךְ שָֽׁמֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/002.yaml
  text: And Elisha said to her[a], “What shall I do for you? Tell me, what do you have in the house?” And she said, “Your female servant has nothing at all in the house except a flask of oil.”
  footnotes:
  - marker: a
    text: Or 'a jar of oil' or 'a small flask of oil'; the Hebrew אָסוּךְ refers to a small container for oil.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사가 그 여자에게 말했습니다. 「내가 당신을 위해 무엇을 하겠습니까? 내게 말하십시오. 집에 무엇이 있습니까?」 그 여자가 말했습니다. 「당신의 여종에게는 집에 아무것도 없고, 기름 한 병[a]만 있습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기름 한 항아리’ 또는 ‘기름 한 작은 병’. 히브리어 אָסוּךְ는 기름을 담는 용기를 가리키지만, 그 정확한 형태와 크기는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לָּךְ
  english_pob_choice: What shall I do for you?
  chosen_korean: 내가 당신을 위해 무엇을 하겠습니까?
  alternatives_korean:
  - 제가 당신을 위해 무엇을 할 수 있습니까?
  - 제가 당신을 위해 무엇을 해야 하겠습니까?
  lexicon: HALOT
  rationale: 의문문이지만 상대를 위해 취할 조치를 묻는 뉘앙스를 살려 ‘무엇을 하겠습니까?’로 옮겼습니다.
- source_word: הַגִּידִי לִי
  english_pob_choice: Tell me
  chosen_korean: 내게 말하십시오
  alternatives_korean:
  - 말해 주십시오
  - 부디 내게 말하십시오
  lexicon: HALOT
  rationale: 고전적 ‘알리다’의 명령형을 현대 한국어에서 자연스러운 요청형인 ‘말하십시오’로 옮겼습니다.
- source_word: לְשִׁפְחָתְךָ
  english_pob_choice: Your female servant
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 여성 종
  - 당신의 시녀
  lexicon: HALOT
  rationale: שִׁפְחָה는 여성 종/종살이하는 여자를 가리키므로 성별을 드러내는 ‘여종’이 가장 직접적입니다. '시녀'는 궁정적 뉘앙스가 있어 피했습니다.
- source_word: אָסוּךְ שָׁמֶן
  english_pob_choice: a flask of oil
  chosen_korean: 기름 한 병
  alternatives_korean:
  - 기름 한 작은 병
  - 기름 한 플라스크
  lexicon: HALOT
  rationale: אָסוּךְ는 기름을 담는 작은 용기를 가리키므로 한국어에서는 통용되는 ‘한 병’으로 자연스럽게 옮겼습니다. 용기 형태를 과도하게 특정하지 않았습니다.
theological_decisions:
- issue: 하인/종 관련 표현의 번역
  chosen_reading: ‘여종’으로 번역해 여성 종이라는 원문 구분을 살렸습니다.
  alternative_readings:
  - ‘종’으로 성중립 처리
  - ‘시녀’로 완화
  rationale: 본문은 남녀 구분이 있는 שִׁפְחָה를 사용하므로, 성별 정보를 유지하는 것이 원문의 사회적 관계를 더 정확히 드러냅니다.
  doctrine_reference: 사회사적 본문에서의 성별·신분 정보 보존
- issue: אָסוּךְ의 용기 이미지
  chosen_reading: ‘기름 한 병’으로 번역했습니다.
  alternative_readings:
  - ‘기름 한 항아리’
  - ‘기름 한 플라스크’
  rationale: 문맥상 집 안에 남은 소량의 기름을 말하므로, 과도하게 크거나 의례적인 용기 이미지를 피하고 작은 용기라는 핵심만 유지했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
