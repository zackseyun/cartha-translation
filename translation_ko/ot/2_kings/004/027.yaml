base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/027.yaml
  text: When she came to the man of God at the mountain[a], she took hold of his feet. Gehazi came near to push her away, but the man of God said, “Leave her alone, for her soul is bitter within her[b], and Yahweh has hidden it from me and has not told me.”
  footnotes:
  - marker: a
    text: Or “she took hold of his feet.”
    reason: lexical_alternative
  - marker: b
    text: Hebrew “her soul is bitter to her,” an idiom expressing deep inner anguish.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀가 하나님의 사람에게 산에 이르러 그의 발을 붙들자, 게하시가 가까이 가서 그녀를 밀어내려 했습니다. 그러나 하나님의 사람이 말했습니다. "그녀를 가만두십시오. 그녀의 영혼이 그녀 안에서 쓰라리기 때문입니다[b]. 야훼께서 그것을 내게 숨기셨고 내게 알리지 않으셨습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 발을 붙들었다.”
    reason: alternative_reading
  - marker: b
    text: 히브리어는 문자적으로 “그녀의 영혼이 그녀에게 쓰라리다”라는 관용구로, 깊은 내적 고통을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 예언자
  - 거룩한 사람
  lexicon: HALOT
  rationale: 히브리어의 표준적 호칭을 살려 직역하되, 한국어에서 자연스럽고 경건한 호칭인 ‘하나님의 사람’으로 옮겼습니다.
- source_word: אֶל הָהָר
  english_pob_choice: at the mountain
  chosen_korean: 산에 이르러
  alternatives_korean:
  - 산에서
  - 산으로
  - 그 산에서
  lexicon: HALOT
  rationale: 이동의 도착점을 드러내는 문맥이므로, 단순 위치보다 ‘산에 이르러’가 서술 흐름에 자연스럽고 원문 상황도 보존합니다.
- source_word: וַתַּחֲזֵק בְּרַגְלָיו
  english_pob_choice: she took hold of his feet
  chosen_korean: 그의 발을 붙들자
  alternatives_korean:
  - 그의 발을 잡자
  - 그의 발을 움켜잡자
  lexicon: HALOT
  rationale: 동사의 강한 접촉과 매달리는 절박함을 살리면서도 현대 한국어에서 과도하게 거칠지 않게 ‘붙들다’로 옮겼습니다.
- source_word: נַפְשָׁהּ מָרָה לָהּ
  english_pob_choice: her soul is bitter within her
  chosen_korean: 그녀의 영혼이 그녀 안에서 쓰라리기 때문입니다
  alternatives_korean:
  - 그녀의 마음이 몹시 괴롭기 때문입니다
  - 그녀의 영혼이 쓰라리기 때문입니다
  lexicon: HALOT
  rationale: נפשׁ의 인류학적 표현을 살리기 위해 ‘영혼’을 유지했고, 관용구의 감정적 강도를 ‘쓰라리다’로 표현했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본 표기인 ‘야훼’를 사용해 고유 신명 자체를 드러냈습니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 титular '주'가 아니라 히브리어 고유명사 יְהוָה를 직접 사용하므로, 한국어 본문에서도 제목어로 대체하지 않고 고유명칭을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נֶפֶשׁ 표현의 인류학적 보존
  chosen_reading: 그녀의 영혼이 그녀 안에서 쓰라리기 때문입니다
  alternative_readings:
  - 그녀가 몹시 괴롭기 때문입니다
  - 그녀의 생명이 쓰라리기 때문입니다
  rationale: 감정 상태만 평면적으로 전달하기보다, 히브리어가 지닌 ‘영혼/생명/자기 자신’의 층위를 보존해 엘리사의 판단 근거를 더 직접적으로 드러냈습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1, §5
