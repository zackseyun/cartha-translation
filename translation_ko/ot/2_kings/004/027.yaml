revisions:
- from: 그녀가 하나님의 사람에게 산에 이르러 그의 발을 붙들자, 게하시가 가까이 가서 그녀를 밀어내려 했습니다. 그러나 하나님의 사람이 말했습니다. "그녀를 가만두십시오. 그녀의 영혼이 그녀 안에서 쓰라리기 때문입니다[b]. 야훼께서 그것을 내게 숨기셨고 내게 알리지 않으셨습니다."[a]
  to: 그녀가 산에 있는 하나님의 사람에게 가서 그의 발을 붙들었습니다. 게하시가 그녀를 밀어내려고 가까이 왔습니다. 그러나 하나님의 사람이 말했습니다. “그녀를 가만두십시오. 그녀의 영혼이 괴롭기 때문입니다[a]. 야훼께서 이 일을 내게 숨기시고 내게 알리지 않으셨습니다.”
  rationale: The revision clarifies that the man of God is located on the mountain, makes the נפשׁ idiom natural without omitting ‘영혼,’ and corrects the footnote anchoring by retaining only the substantive explanatory note at the relevant phrase. “이 일” naturally refers to the undisclosed matter without specifying what Yahweh had concealed.
  reviewer_model: gpt-5.6-terra
