source:
  edition: WLC
  text: וַ/יָּ֜שָׁב וַ/יֵּ֣לֶךְ בַּ/בַּ֗יִת אַחַ֥ת הֵ֨נָּה֙ וְ/אַחַ֣ת הֵ֔נָּה וַ/יַּ֖עַל וַ/יִּגְהַ֣ר עָלָ֑י/ו וַ/יְזוֹרֵ֤ר הַ/נַּ֨עַר֙ עַד שֶׁ֣בַע פְּעָמִ֔ים וַ/יִּפְקַ֥ח הַ/נַּ֖עַר אֶת עֵינָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/035.yaml
  text: Then he returned and walked in the house[a], once here and once there; then he went up and stretched himself over him, and the boy sneezed seven times[b], and the boy opened his eyes.
  footnotes:
  - marker: a
    text: Or 'back and forth' / 'to and fro.' The Hebrew literally says 'once here and once there.'
    reason: lexical_alternative
  - marker: b
    text: Or 'bent over him.' The Hebrew verb can denote bending or bowing over someone.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 돌아와 집 안을 이쪽저쪽으로 걸으셨습니다.[a] তারপর 다시 올라가 그 아이 위로 몸을 굽히셨습니다.[b] 그러자 그 아이가 일곱 번 재채기하고 눈을 떴습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘한 번 이쪽으로, 한 번 저쪽으로’입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘그 아이 위에 몸을 뻗으셨습니다.’ 히브리어 동사는 그 위로 몸을 굽히거나 숙이는 행동을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: Then he returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 그리고 돌아왔습니다
  - 그런 뒤 돌아왔습니다
  lexicon: HALOT
  rationale: שׁוּב의 서사 진행을 자연스럽게 살려 ‘돌아와’로 옮겼습니다. 앞뒤 동작과 이어지는 연속성을 한국어에서도 유지합니다.
- source_word: וַיֵּלֶךְ בַּבַּיִת אַחַת הֵנָּה וְאַחַת הֵנָּה
  english_pob_choice: walked in the house, once here and once there
  chosen_korean: 집 안을 이리저리 걸었으며, 이리 와서 한 번, 저리 와서 한 번
  alternatives_korean:
  - 집 안을 왔다 갔다 했으며
  - 집 안에서 한 번 여기, 한 번 저기 걸었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘한 번 여기, 한 번 저기’이지만, 반복적 왕복의 이미지를 살리기 위해 본문에 ‘이리 와서 한 번, 저리 와서 한 번’을 덧붙여 히브리어 관용구를 드러냈습니다.
- source_word: וַיִּגְהַר עָלָיו
  english_pob_choice: stretched himself over him
  chosen_korean: 그 위에 몸을 뻗었습니다
  alternatives_korean:
  - 그 위로 몸을 굽혔습니다
  - 그 위에 엎드렸습니다
  lexicon: HALOT
  rationale: גהר는 단순히 ‘굽히다’보다 몸을 위로 숙이거나 덮는 자세를 포함할 수 있어, 본문이 암시하는 물리적 동작을 과도하게 해석하지 않으면서도 자연스럽게 옮겼습니다.
- source_word: וַיְזוֹרֵר הַנַּעַר עַד שֶׁבַע פְּעָמִים
  english_pob_choice: the boy sneezed seven times
  chosen_korean: 그 아이가 일곱 번 재채기하고
  alternatives_korean:
  - 그 아이가 일곱 번 재채기하였고
  - 그 아이가 일곱 차례 재채기하고
  lexicon: HALOT
  rationale: 희귀 동사는 문맥상 ‘재채기하다’로 이해되는 것이 가장 타당하므로 이를 따라 옮겼습니다. ‘일곱 번’은 완료된 총횟수를 자연스럽게 반영합니다.
- source_word: וַיִּפְקַח הַנַּעַר אֶת עֵינָיו
  english_pob_choice: the boy opened his eyes
  chosen_korean: 눈을 떴습니다
  alternatives_korean:
  - 눈을 열었습니다
  - 그 아이가 눈을 떴습니다
  lexicon: HALOT
  rationale: ‘눈을 뜨다’는 히브리어 관용구 פקח עיניים을 가장 자연스럽게 옮기며, 회복의 서술을 한국어에서 분명하게 전달합니다.
theological_decisions:
- issue: 엘리사의 몸짓이 기적의 메커니즘으로 오해될 가능성
  chosen_reading: 물리적 동작을 서술적으로 옮기되, 의례적·주술적 의미를 덧씌우지 않았습니다.
  alternative_readings:
  - 더 문자적으로 ‘그 위에 몸을 구부렸습니다’로 옮기기
  - ‘다시 그 위에 누웠습니다’처럼 확대 해석하기
  rationale: 본문은 기적의 사실을 서술하지만 그 작동 원리를 설명하지 않습니다. 번역도 그 긴장을 보존해야 합니다.
  doctrine_reference: 본문이 말하는 범위를 넘는 기계적/주술적 해석을 피함
