reference: 2 Kings 4:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מַ֠דּוּעַ אתי הלכתי אֵלָי/ו֙ הַ/יּ֔וֹם לֹֽא חֹ֖דֶשׁ וְ/לֹ֣א שַׁבָּ֑ת וַ/תֹּ֖אמֶר שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/023.yaml
  text: And he said[a], “Why are you going to him today? It is neither new moon nor Sabbath.” And she said, “Peace.”
  footnotes:
  - marker: a
    text: Or “It is well” or “All is well.” Hebrew “Peace.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. “어째서 오늘 그에게 가십니까? 오늘은 초하루도 아니고 안식일도 아닙니다.” 그러자 그녀가 말했습니다. “평안합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “괜찮습니다” 혹은 “모든 것이 괜찮습니다.” 히브리어는 “평안”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  english_pob_choice: Why
  chosen_korean: 어째서
  alternatives_korean:
  - 왜
  - 무슨 까닭으로
  lexicon: HALOT
  rationale: 이유를 묻는 직설적 의문사로서 현대 한국어에서는 ‘어째서’가 본문의 물음을 비교적 정확하고 자연스럽게 살립니다.
- source_word: אֵלָיו
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 엘리사에게
  lexicon: HALOT
  rationale: 히브리어는 대명사로 말하지만 문맥상 엘리사를 가리키므로, 본문을 과도하게 풀지 않고 대명사성을 유지한 채 한국어로는 자연스럽게 ‘그에게’로 옮겼습니다.
- source_word: חֹדֶשׁ
  english_pob_choice: new moon
  chosen_korean: 초하루
  alternatives_korean:
  - 새달
  - 신월
  lexicon: HALOT
  rationale: 이 문맥은 달의 ‘월’이 아니라 달 초의 절기 관행을 가리키므로, 한국어 성경에서 자연스럽고 예배적 맥락도 드러나는 ‘초하루’가 적절합니다.
- source_word: שָׁלוֹם
  english_pob_choice: Peace
  chosen_korean: 평안합니다
  alternatives_korean:
  - 평안
  - 평화입니다
  - 괜찮습니다
  lexicon: HALOT
  rationale: 히브리어 표면형은 ‘평화/평안’이지만, 짧은 응답에서는 ‘모든 것이 괜찮다’는 관용적 의미를 띱니다. 본문에는 어휘를 드러내되, 한국어에서는 자연스러운 회답으로 ‘평안합니다’라고 옮겼습니다.
theological_decisions:
- issue: שַׁבָּת을 예배적 절기명으로 어떻게 처리할지
  chosen_reading: 안식일
  alternative_readings:
  - 휴일
  - 쉼의 날
  rationale: 본문은 엘리사를 찾아가는 이유를 정중한 종교적 방문 관습과 연결하므로, 고유한 성경 용어인 ‘안식일’을 유지하는 것이 문맥과 전통적 인식을 동시에 살립니다.
  doctrine_reference: 성경의 절기 및 안식일 이해
