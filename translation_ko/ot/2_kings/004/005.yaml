  source_fidelity: 첫 절의 주어가 여성 단수인데 초안은 '그가'로 남성으로 옮겨 핵심 인물 지시가 바뀌었습니다. 또한 아들들이 가져오는 대상은 히브리어 절에는 명시되지 않았으므로, 문맥상 보충한 '그릇들'에는 각주를 직접 붙이는 것이 적절합니다. 문을 닫는 표현은 여인과 아들들이 문 안에 있음을 나타내도록 자연스럽게 다듬었습니다.
  naturalness: 초안의 '그가 떠나가서'는 주어 오류인 동시에 문맥상 부자연스럽습니다. '자기와 자기 아들들 뒤로 문을 닫았습니다'보다 '자기와 아들들을 안에 두고 문을 닫았습니다'가 현대 표준 한국어에서 자연스럽고, בְּעַד의 포위·차단 상황을 잘 전달합니다. 인물 지시는 '그 여인'과 '아들들'로 처리해 불필요한 대명사 반복을 피했습니다.
  terminology: '''그릇들'', ''붓고 있었습니다''는 앞 절들의 빈 그릇과 기름을 붓는 행위라는 문맥에 적절합니다. ''그릇들''은 원문에 명시된 목적어가 아니라 문맥상 보충이므로 각주로 밝혔습니다.'
