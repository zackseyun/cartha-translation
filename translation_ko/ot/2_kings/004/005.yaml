reference: 2 Kings 4:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תֵּ֨לֶךְ֙ מֵֽ/אִתּ֔/וֹ וַ/תִּסְגֹּ֣ר הַ/דֶּ֔לֶת בַּעֲדָ֖/הּ וּ/בְעַ֣ד בָּנֶ֑י/הָ הֵ֛ם מַגִּשִׁ֥ים אֵלֶ֖י/הָ וְ/הִ֥יא מיצקת׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/005.yaml
  text: So she went from him and shut the door behind herself and behind her sons; they were bringing the vessels to her[a], and she was pouring.
  footnotes:
  - marker: a
    text: Hebrew simply says, 'they were bringing to her'; 'the vessels' is supplied from the context of the empty containers in the preceding verses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 떠나가서, 문을 자기와 자기 아들들 뒤로 닫았습니다. 그들은 그 그릇들을 그녀에게 가져오고 있었고, 그녀는 붓고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단지 '그녀에게 가져오고 있었다'라고만 말합니다. 여기서는 앞 절들에 나온 빈 그릇들이 문맥상 대상이므로, 한국어에서는 그 의미를 분명히 했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  english_pob_choice: So she went from him
  chosen_korean: 그가 떠나가서
  alternatives_korean:
  - 그래서 그녀는 그에게서 떠났습니다
  - 그러고 나서 그녀는 그를 떠났습니다
  lexicon: HALOT
  rationale: 이동의 순서와 관계의 분리를 자연스럽게 살리되, 한국어에서는 주어를 유지한 채 사건을 이어 주는 표현이 더 매끄러워 '그가 떠나가서'로 옮겼습니다.
- source_word: וַתִּסְגֹּר הַדֶּלֶת בַּעֲדָהּ וּבְעַד בָּנֶיהָ
  english_pob_choice: and shut the door behind herself and behind her sons
  chosen_korean: 문을 자기와 자기 아들들 뒤로 닫았습니다
  alternatives_korean:
  - 문을 자신과 아들들 뒤로 닫았습니다
  - 문을 자기와 자기 아들들 뒤에 닫았습니다
  lexicon: HALOT
  rationale: בְּעַד의 '뒤로'라는 공간적 뉘앙스를 살려, 문이 그들 뒤에서 닫혀 안쪽에 함께 있게 되는 장면을 분명하게 표현했습니다.
- source_word: הֵם מַגִּשִׁים אֵלֶיהָ
  english_pob_choice: they were bringing the vessels to her
  chosen_korean: 그들은 그 그릇들을 그녀에게 가져오고 있었고
  alternatives_korean:
  - 그들은 그것들을 그녀에게 가져오고 있었고
  - 그들은 그릇들을 그녀에게 계속 가져오고 있었고
  lexicon: HALOT
  rationale: 명시되지 않은 목적어는 앞 문맥의 빈 그릇들을 가리키므로, 문맥상 분명한 '그 그릇들'로 보충해 의미를 드러냈습니다. 진행형은 '가져오고 있었고'로 옮겼습니다.
- source_word: וְהִיא מיצקת
  english_pob_choice: and she was pouring
  chosen_korean: 그녀는 붓고 있었습니다
  alternatives_korean:
  - 그리고 그녀는 따르고 있었습니다
  - 그녀는 계속 붓고 있었습니다
  lexicon: HALOT
  rationale: 동작의 지속성과 반복성을 살려 현재진행형으로 옮겼고, 액체를 그릇에 옮겨 붓는 상황에 자연스러운 '붓다'를 선택했습니다.
theological_decisions:
- issue: 사건 진행의 순차성과 밀폐된 공간의 의미
  chosen_reading: 여인이 엘리사에게서 떠나 문을 닫고, 그 안에서 아들들과 함께 그릇을 받아 붓는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 독립적인 동작들의 나열로 읽는 방식
  - 문을 닫는 행위를 생략적으로 처리하는 방식
  rationale: 히브리어 연속 동사들이 장면의 긴박한 순서를 형성하므로, 문을 닫아 안에서 기적이 진행되는 장면성을 보존했습니다.
  doctrine_reference: 본문 내 서술의 흐름과 내러티브 문맥
