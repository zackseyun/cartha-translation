source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֵ֣ם הַ/נַּ֔עַר חַי יְהוָ֥ה וְ/חֵֽי נַפְשְׁ/ךָ֖ אִם אֶעֶזְבֶ֑/ךָּ וַ/יָּ֖קָם וַ/יֵּ֥לֶךְ אַחֲרֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/030.yaml
  text: Then the boy’s mother said[a], “As Yahweh lives, and as your soul lives, I will not leave you.” So he arose and went after her.
  footnotes:
  - marker: a
    text: 'Hebrew oath formula: ''As the LORD lives, and as your life lives''; that is, ''As surely as the LORD lives and as you live.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그 아이의 어머니가 말했습니다. “야훼께서 살아 계심과 당신의 목숨이 살아 있음을 두고 맹세합니다[a]. 나는 당신을 떠나지 않겠습니다.” 그러자 그가 일어나 그녀를 따라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 맹세 공식: ‘야훼께서 살아 계심과 당신의 목숨이 살아 있음.’ 곧 ‘야훼께서 살아 계시고 당신이 살아 있는 것처럼 확실히’라는 뜻입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵם הַנַּעַר
  english_pob_choice: the boy’s mother
  chosen_korean: 그 아이의 어머니
  alternatives_korean:
  - 소년의 어머니
  - 아이의 어머니
  lexicon: HALOT
  rationale: 구문은 직역하면 ‘그 소년의 어머니’이지만, 한국어에서는 소유격보다 ‘그 아이의 어머니’가 자연스럽고 문맥의 특정 모친을 분명히 드러냅니다.
- source_word: חַי יְהוָה
  english_pob_choice: Yahweh lives
  chosen_korean: 야훼께서 살아 계시는 것
  alternatives_korean:
  - 야훼께서 살아 계심
  - 주께서 살아 계시는 것
  lexicon: HALOT
  rationale: 야훼의 생존을 두고 맹세하는 관용구를 한국어에서는 절의 명사화로 옮겨, 맹세의 힘을 유지하면서도 현대 문체에 맞게 했습니다.
- source_word: וְחֵי נַפְשְׁךָ
  english_pob_choice: and as your soul lives
  chosen_korean: 당신의 혼이 살아 있는 것
  alternatives_korean:
  - 당신의 생명이 살아 있는 것
  - 당신의 혼이 살아 있음
  lexicon: HALOT
  rationale: נֶפֶשׁ은 여기서 단순한 감정이 아니라 ‘생명/혼’을 가리키므로, POB의 의미를 따라 ‘혼’으로 옮기되 맹세 구조를 보존했습니다.
- source_word: אִם אֶעֶזְבֶךָּ
  english_pob_choice: I will not leave you
  chosen_korean: 나는 당신을 떠나지 않겠습니다
  alternatives_korean:
  - 내가 당신을 버리지 않겠습니다
  - 내가 당신을 떠나지 않을 것입니다
  lexicon: HALOT
  rationale: 오스성 맹세 뒤의 אִם은 부정적 서약을 뜻하므로 조건형을 피하고 직접적인 부정 서약으로 옮겼습니다.
- source_word: וַיָּקָם וַיֵּלֶךְ אַחֲרֶיהָ
  english_pob_choice: So he arose and went after her
  chosen_korean: 그가 일어나 그녀를 따라갔습니다
  alternatives_korean:
  - 그가 일어나 그녀를 뒤따랐습니다
  - 그가 일어나 그 뒤를 따랐습니다
  lexicon: HALOT
  rationale: 연속 동작을 한국어 서술 흐름에 맞게 간결히 옮겼고, ‘뒤따르다’보다 ‘따라가다’가 현대 한국어에서 자연스럽습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명 처리
  chosen_reading: יהוה를 ‘야훼’로 옮기고 본문에 그대로 반영했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문은 신적 칭호가 아니라 언약적 고유명사를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: נפש의 의미 범위
  chosen_reading: 여기서는 ‘혼’으로 옮겨 맹세 공식의 ‘생명/혼’ 의미를 살렸습니다.
  alternative_readings:
  - 생명
  - 목숨
  rationale: 맹세 표현에서 נַפְשְׁךָ는 단순한 ‘목숨’보다 존재 전체를 가리키는 뉘앙스가 있어, 한국어에서는 ‘혼’이 가장 가깝습니다.
  doctrine_reference: 히브리어 נפש의 의미 범위에 대한 어휘적 판단
