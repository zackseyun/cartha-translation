  text: Then he said[a], “Bring some flour.” And he threw it into the pot and said, “Pour it out for the people[b], so that they may eat.” And there was nothing harmful in the pot.
  footnotes:
  - marker: a
    text: Or “Pour it out for the people.” The Hebrew verb is more literally “pour,” but here it refers to serving the prepared food.
    reason: lexical_alternative
  - marker: b
    text: Literally, “there was not a bad/evil thing in the pot,” meaning the stew was no longer harmful.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「밀가루를 가져오십시오.」 그가 그것을 그 냄비에 던져 넣고 다시 말했습니다. 「그것을 사람들에게 부어 주어 먹게 하십시오.」 그러자 냄비에는 해로운 것이 아무것도 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 “붓다”에 가깝지만, 여기서는 이미 조리된 음식을 사람들에게 나누어 주는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 직역은 “냄비에 나쁜/악한 것이 없었다”이지만, 문맥상 국이 더 이상 해롭지 않았다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְחוּ קֶמַח
  english_pob_choice: Bring some flour
  chosen_korean: 밀가루를 가져오십시오
  alternatives_korean:
  - 가루를 가져오십시오
  - 밀가루를 취하십시오
  lexicon: HALOT
  rationale: קמח는 이 문맥에서 조리용 밀가루를 가리키며, 명령형 복수는 자연스러운 공손 명령인 ‘가져오십시오’로 옮겼습니다.
- source_word: וַיַּשְׁלֵךְ אֶל הַסִּיר
  english_pob_choice: he threw it into the pot
  chosen_korean: 그것을 그 냄비에 던져 넣고
  alternatives_korean:
  - 그것을 그 냄비에 던지고
  - 그것을 냄비 속에 넣고
  lexicon: HALOT
  rationale: שלך의 기본 의미를 살려 ‘던져 넣다’로 번역해, 엘리사의 즉각적이고 상징적인 행동을 드러냈습니다.
- source_word: צַק לָעָם
  english_pob_choice: Pour it out for the people
  chosen_korean: 그것을 사람들에게 부어 주어
  alternatives_korean:
  - 그것을 사람들에게 따라 주어
  - 그것을 사람들에게 나누어 주어
  lexicon: HALOT
  rationale: יצק는 문자적으로 ‘붓다’이므로 본문 흐름을 따라 ‘부어 주다’로 옮겼고, 음식 배분의 뜻은 다음 동작과 함께 드러나도록 했습니다.
- source_word: וְלֹא הָיָה דָּבָר רָע בַּסִּיר
  english_pob_choice: there was nothing harmful in the pot
  chosen_korean: 냄비에는 해로운 것이 아무것도 없었습니다
  alternatives_korean:
  - 냄비에는 나쁜 것이 아무것도 없었습니다
  - 냄비에는 악한 것이 아무것도 없었습니다
  - 냄비에는 해가 되는 것이 없었습니다
  lexicon: HALOT
  rationale: דבר רע는 여기서 도덕적 ‘악’이 아니라 독이 된 국의 ‘해로움’을 뜻하므로, 영어 POB의 취지를 따라 ‘해로운 것’으로 옮겼습니다.
theological_decisions:
- issue: 최종 안전성 진술의 의미
  chosen_reading: 냄비에 있던 위험한 성질이 제거되어 음식이 더 이상 해롭지 않게 되었다는 뜻으로 읽었습니다.
  alternative_readings:
  - 도덕적 악이 사라졌다는 문자적 읽기
  - 단순히 맛이 나아졌다는 완화된 읽기
  rationale: 문맥은 병든 군중을 위한 국의 독성 문제를 다루므로, ‘해로운 것’으로 번역해 실제적 치유와 보호의 의미를 보존했습니다.
  doctrine_reference: 문맥 우선의 서술 이해
