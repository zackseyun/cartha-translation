  yaml_path: translation/ot/2_kings/004/012.yaml
  text: Then he said to Gehazi his servant[a], “Call this Shunammite woman.” So he called her, and she stood before him.
  footnotes:
  - marker: a
    text: Or simply, “this Shunammite.” The Hebrew identifies her by origin; English may supply “woman” for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 자기의 종 게하시에게 말했습니다. 「이 수넴 여자를 불러오너라」 하니, 그가 그녀를 불러오자 그녀가 그의 앞에 섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 여인을 출신지로 식별합니다. 한국어에서는 자연성을 위해 ‘여자’를 보탰습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵּחֲזִי נַעֲרוֹ
  english_pob_choice: Gehazi his servant
  chosen_korean: “자기의 종 게하시”
  alternatives_korean:
  - “게하시의 종”
  - “그의 시종 게하시”
  - “게하시, 그의 젊은 종”
  lexicon: HALOT
  rationale: נַעַר는 여기서 단순한 ‘젊은이’보다 엘리사의 하인 역할을 가리키므로, 관계를 분명히 드러내는 ‘종’이 적절합니다. 대명사도 원문의 소유 관계를 살려 ‘자기의’로 옮겼습니다.
- source_word: קְרָא
  english_pob_choice: Call
  chosen_korean: “불러오너라”
  alternatives_korean:
  - “불러라”
  - “소집하라”
  - “불러 오너라”
  lexicon: HALOT
  rationale: 문맥상 단순 호명이 아니라 엘리사 앞으로 오게 하라는 명령이므로, 한국어에서는 목적을 드러내는 ‘불러오너라’가 자연스럽고 정확합니다.
- source_word: לַשּׁוּנַמִּית הַזֹּאת
  english_pob_choice: this Shunammite woman
  chosen_korean: “이 수넴 여자”
  alternatives_korean:
  - “이 수넴 여인”
  - “이 수넴 사람”
  - “이 수넴 여자 사람”
  lexicon: HALOT
  rationale: 히브리어는 출신지로 여인을 가리키며, POB도 명료성을 위해 ‘woman’을 보탭니다. 한국어에서는 교회식 표현인 ‘여인’보다 직접적인 ‘여자’가 원문 지시성을 더 잘 살립니다.
- source_word: לְפָנָיו
  english_pob_choice: before him
  chosen_korean: “그의 앞에”
  alternatives_korean:
  - “그 앞에”
  - “그 면전에서”
  - “그의 앞에서”
  lexicon: HALOT
  rationale: לִפְנֵי는 공간적 위치를 가리키므로, 현대 한국어에서는 가장 직접적인 ‘그의 앞에’가 원문의 장면을 자연스럽게 전달합니다.
theological_decisions:
- issue: 직접화법의 명령문 어조
  chosen_reading: 엘리사의 지시를 한국어 명령형 ‘불러오너라’로 옮겨 장면의 즉각성과 권위를 살렸습니다.
  alternative_readings:
  - “불러라”
  - “불러오십시오”
  rationale: 본문은 하인에게 내리는 직접 명령이므로, 평서형으로 완화하지 않고 명령문을 유지하는 것이 서사적 긴장과 관계 역학을 더 정확히 드러냅니다.
  doctrine_reference: 서사 본문 어법 보존
