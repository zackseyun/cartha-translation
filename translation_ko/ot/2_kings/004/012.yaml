  source_fidelity: ‘불러오너라’는 קְרָא(‘부르다, 호출하다’)에 ‘오다’의 이동 의미를 보태므로, 문맥상 그 결과를 추정할 수 있더라도 본문 자체보다 다소 구체적입니다. 단순히 ‘부르십시오’로 옮기는 것이 원문에 더 충실합니다.
  naturalness: ‘수넴 여자’는 현대 표준어의 공식적 성경 문체에서는 다소 거칠고 어색하게 들릴 수 있습니다. ‘수넴 여인’이 자연스럽고 품위 있는 현대 문어체입니다. 또한 목표 합쇼체에 맞추어 인용문의 명령을 ‘부르십시오’로 고쳤습니다.
  terminology: 게하시, 수넴, 종은 통용되는 성경 인명·지명 및 관계 표현으로 적절합니다. ‘여인’은 히브리어의 여성 수넴 출신자 지시를 자연스럽게 드러냅니다.
