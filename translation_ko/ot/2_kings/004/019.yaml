base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/019.yaml
  text: And he said to his father[a], “My head, my head!” Then he said to the young man, “Carry him to his mother.”
  footnotes:
  - marker: a
    text: Or “to the servant” for “to the young man”; the Hebrew נַעַר can denote a youth, attendant, or servant depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 아버지에게 말했습니다. 「내 머리야, 내 머리야!」 아버지는 그 젊은이에게 말했습니다. 「그를 어머니에게 데려가라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘젊은이’로 번역한 히브리어 נַעַר는 문맥에 따라 청년, 수행원, 또는 종을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אָבִיו
  english_pob_choice: to his father
  chosen_korean: 아버지에게
  alternatives_korean:
  - 아빠에게
  - 아버지한테
  lexicon: HALOT
  rationale: 관계 표현 אָבִיו는 서사 문맥에서 자연스럽고 격을 갖춘 ‘아버지’가 가장 적절합니다.
- source_word: רֹאשִׁי רֹאשִׁי
  english_pob_choice: My head, my head!
  chosen_korean: 「내 머리, 내 머리야!」
  alternatives_korean:
  - 「내 머리야, 내 머리야!」
  - 「머리야, 머리야!」
  lexicon: HALOT
  rationale: 반복된 명사구의 급박한 호소를 그대로 살리기 위해 병행 구조를 유지했습니다. 마지막 ‘-야’는 한국어에서 통증·절규의 즉각성을 자연스럽게 드러냅니다.
- source_word: אֶל הַנַּעַר
  english_pob_choice: to the young man
  chosen_korean: 젊은 종에게
  alternatives_korean:
  - 젊은이에게
  - 소년에게
  - 시종에게
  lexicon: HALOT
  rationale: נַעַר는 문맥에 따라 청년, 시종, 종을 가질 수 있는데, 여기서는 아이를 실제로 들어 옮길 수 있는 동반 하인/심부름꾼의 기능이 분명하므로 ‘젊은 종’이 본문 기능을 가장 잘 드러냅니다.
- source_word: שָׂאֵהוּ
  english_pob_choice: Carry him
  chosen_korean: 그를 데려가라
  alternatives_korean:
  - 그를 업어가라
  - 그를 들어 옮겨라
  lexicon: HALOT
  rationale: 동사 נשׂא는 물리적으로 ‘들어 옮기다/데려가다’의 뜻을 가지며, 이어지는 목적지가 어머니임을 고려해 한국어에서는 자연스러운 이동 지시인 ‘데려가라’로 옮겼습니다.
