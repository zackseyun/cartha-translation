  rationale: 본문이 יהוה를 직접 사용하므로, 개인 명칭을 보존하는 방향을 택했습니다. 이는 독자가 본문의 언약적 이름을 인지하도록 돕습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
