  yaml_path: translation/ot/2_kings/004/001.yaml
  text: Now one woman from the wives of the sons of the prophets cried out to Elisha, saying, “Your servant, my husband, has died, and you know that your servant feared Yahweh. And the creditor has come to take my two children for himself as slaves.”
  footnotes:
  - marker: a
    text: Or, 'my two sons.' The Hebrew says 'my two children,' which can be understood more specifically from context.
    reason: lexical_alternative
translation:
  language: ko
  text: 예언자 제자들의 아내들 가운데 한 여인이 엘리사에게 부르짖어 말했습니다. “선생님의 종인 제 남편이 죽었습니다. 선생님께서는 그가 야훼를 경외했다는 것을 아십니다. 그런데 채권자가 제 두 자녀를 자기 종으로 삼으려고 왔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘내 두 자녀’라고 되어 있으나, 문맥상 ‘내 두 아들’로 이해될 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אַחַת
  english_pob_choice: Now one woman
  chosen_korean: 이제 한 여인이
  alternatives_korean:
  - 그리고 한 여인이
  - 어떤 여인이
  lexicon: HALOT
  rationale: 서사 전환을 나타내는 הראשית וְ는 한국어에서 ‘이제’로 자연스럽게 옮기고, אַחַת의 비특정성을 ‘한’으로 보존했습니다.
- source_word: מִנְּשֵׁי בְנֵי הַנְּבִיאִים
  english_pob_choice: from the wives of the sons of the prophets
  chosen_korean: 선지자들의 아들들 가운데에서
  alternatives_korean:
  - 선지자들의 아내들 가운데에서
  - 선지자 무리의 아내들 가운데에서
  lexicon: HALOT
  rationale: ‘sons of the prophets’는 한국어에서 직역하면 어색할 수 있으나, 본문이 가리키는 예언자 공동체의 구성원을 지칭하는 표현임을 살려 ‘선지자들의 아들들’로 유지했습니다. מִן은 출처/소속의 범위를 드러내는 ‘가운데에서’로 처리했습니다.
- source_word: עַבְדְּךָ אִישִׁי
  english_pob_choice: Your servant, my husband
  chosen_korean: 선생님의 종인 제 남편
  alternatives_korean:
  - 제 남편, 선생님의 종
  - 선생님의 종이자 제 남편
  lexicon: HALOT
  rationale: 히브리어의 두 관계를 모두 살리기 위해, 엘리사에게 속한 ‘종’이라는 관계와 아내의 ‘남편’이라는 관계를 함께 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 프로젝트 기본어에 따라 신적 고유명은 ‘야훼’로 옮겨, 호칭화된 ‘주님’으로 약화시키지 않았습니다.
- source_word: לַעֲבָדִים
  english_pob_choice: as slaves
  chosen_korean: 자기의 종으로
  alternatives_korean:
  - 종들로
  - 노예로
  lexicon: HALOT
  rationale: 채무예속의 강제성을 반영해야 하므로 단순한 ‘하인’이나 ‘섬김’보다 종속 상태를 드러내는 표현을 택했습니다. 다만 한국어에서 가족을 직접 ‘노예’로 넘긴다는 어감이 지나치게 현대적·법적일 수 있어, 여기서는 ‘자기의 종으로’로 옮겼습니다.
theological_decisions:
