  to: 예언자 제자들의 아내들 가운데 한 여인이 엘리사에게 부르짖어 말했습니다. “선생님의 종인 제 남편이 죽었습니다. 선생님께서는 그가 야훼를 경외했다는 것을 아십니다. 그런데 채권자가 제 두 자녀를 자기 종으로 삼으려고 왔습니다.”[a]
  rationale: 수식 관계를 바로잡아 여인이 예언자 제자들의 아내들 중 하나임을 명확히 했고, 근거 없는 시간 표지를 제거했습니다. 또한 채권자가 아이들을 예속시키려는 목적을 ‘자기 종으로 삼으려고’로 명료하게 옮겼습니다. 자녀의 성별은 히브리어가 명시하지 않으므로 본문에서는 ‘두 자녀’를 유지하고 각주에서 문맥상 가능한 ‘두 아들’을 제시했습니다.
