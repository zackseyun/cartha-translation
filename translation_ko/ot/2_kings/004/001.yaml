  naturalness: ‘예언자 제자들의 아내들 가운데 한 여인’은 해당 히브리 관용구를 현대 표준 한국어로 자연스럽게 드러냅니다. ‘자기 종으로 데려가려 합니다’보다 ‘자기 종으로 삼으려고 왔습니다’가 לָקַחַת와 לַעֲבָדִים의 목적 및 강제 예속의 뜻을 더 직접적으로 반영합니다.
  terminology: יהוה는 프로젝트 방침에 따라 ‘야훼’로 유지합니다. בְנֵי הַנְּבִיאִים는 혈연상의 ‘선지자들의 아들들’로 오해되지 않도록 ‘예언자 제자들’로 옮깁니다. עֲבָדִים는 완곡한 고용 관계가 아니라 예속 신분을 가리키므로 ‘종으로 삼다’로 번역합니다.
