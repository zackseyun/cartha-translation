  yaml_path: translation/ot/2_kings/004/037.yaml
  text: Then she came and fell at his feet and bowed to the ground[a]. Then she picked up her son and went out.
  footnotes:
  - marker: a
    text: Or 'prostrated herself to the ground'; the Hebrew verb can also be rendered 'worshiped' in some contexts, but here it most likely denotes an act of deep reverence before Elisha.
    reason: lexical_alternative
translation:
  language: ko
  text: 그녀는 와서 그의 발에 엎드려 땅에 절하고, 자기 아들을 안아 들고 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문맥에 따라 ‘엎드려 절하다’ 또는 ‘경배하다’로도 옮길 수 있으나, 여기서는 엘리사 앞에서 드린 깊은 경의의 몸짓으로 보는 것이 가장 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבֹא
  english_pob_choice: Then she came
  chosen_korean: 그녀는 와서
  alternatives_korean:
  - 그녀는 왔습니다
  - 그러고 나서 그녀가 왔습니다
  lexicon: WLC
  rationale: 서술의 진행을 자연스럽게 살리되, 히브리어 연속 동작을 한국어의 연결형 ‘와서’로 간결하게 반영했습니다.
- source_word: וַתִּפֹּל עַל רַגְלָיו
  english_pob_choice: fell at his feet
  chosen_korean: 그의 발에 엎드려
  alternatives_korean:
  - 그의 발 앞에 쓰러져
  - 그의 발에 무너져
  lexicon: WLC
  rationale: 관용적으로는 ‘발 앞에’이지만, כאן의 몸짓은 간청과 경배의 자세이므로 ‘엎드리다’가 동작을 더 분명하게 드러냅니다.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  english_pob_choice: bowed to the ground
  chosen_korean: 땅에 절하고
  alternatives_korean:
  - 땅에 엎드려 절하고
  - 땅까지 몸을 굽혀
  lexicon: WLC
  rationale: שׁחה의 핵심은 낮추어 절하는 몸짓이므로, 한국어에서는 예배적 뉘앙스를 지나치게 확정하지 않으면서도 강한 경의를 나타내는 ‘절하다’를 택했습니다.
- source_word: וַתִּשָּׂא אֶת בְּנָהּ
  english_pob_choice: picked up her son
  chosen_korean: 자기 아들을 안아 들고
  alternatives_korean:
  - 자기 아들을 들어 올리고
  - 자기 아들을 들쳐 안고
  lexicon: WLC
  rationale: 나사(들다/운반하다)를 회복된 아들을 실제로 품에 올리는 모습으로 자연스럽게 옮기되, 단순히 집어 드는 느낌보다 감정적 회복을 살렸습니다.
- source_word: וַתֵּצֵא
  english_pob_choice: went out
  chosen_korean: 나갔습니다
  alternatives_korean:
  - 밖으로 나갔습니다
  - 떠났습니다
  lexicon: WLC
  rationale: יצא의 기본 의미를 가장 직접적으로 살리는 평이한 서술로 옮겼습니다.
theological_decisions:
- issue: 엘리사를 향한 הגוף의 자세 의미
  chosen_reading: ‘엎드려 땅에 절하다’로 옮겨, 감사와 경외의 몸짓을 나타내되 하나님께 드리는 직접적 예배로 단정하지 않았습니다.
  alternative_readings:
  - ‘예배하였다’로 번역
  - ‘경배하였다’로 번역
  rationale: 본문은 엘리사 앞에서의 반응을 묘사하므로, 동사의 넓은 의미를 유지하면서도 예배 대상을 신학적으로 과도하게 확정하지 않는 표현이 필요합니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it'
