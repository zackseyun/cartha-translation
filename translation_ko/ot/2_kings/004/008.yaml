  text: וַ/יְהִ֨י הַ/יּ֜וֹם וַ/יַּעֲבֹ֧ר אֱלִישָׁ֣ע אֶל שׁוּנֵ֗ם וְ/שָׁם֙ אִשָּׁ֣ה גְדוֹלָ֔ה וַ/תַּחֲזֶק בּ֖/וֹ לֶ/אֱכָל לָ֑חֶם וַֽ/יְהִי֙ מִ/דֵּ֣י עָבְר֔/וֹ יָסֻ֥ר שָׁ֖מָּ/ה לֶ/אֱכָל לָֽחֶם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/008.yaml
  text: And one day Elisha passed through Shunem[a], where there was a prominent woman, and she urged him to eat bread. So whenever he passed by[b], he would turn in there to eat bread.
  footnotes:
  - marker: a
    text: Hebrew 'a great woman'; the phrase likely refers to social prominence or means.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'to eat bread,' an idiom for taking a meal.
    reason: lexical_alternative
translation:
  language: ko
  text: 어느 날 엘리사가 수넴을 지나가는데, 거기에는 한 유력한 여인이 있었습니다. 그 여인이 그를 강권하여 빵을 먹게 했습니다. 그래서 그가 지나갈 때마다 그곳으로 들어가 빵을 먹곤 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 '한 큰 여인'이지만, 문맥상 사회적 지위나 영향력을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 '빵'은 여기서 식사 전체를 뜻하는 관용적 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  english_pob_choice: And one day
  chosen_korean: 어느 날
  alternatives_korean:
  - 그리고 어느 날
  - 하루는
  lexicon: HALOT
  rationale: 히브리어 서술 도입구의 자연스러운 시간 표지로서, 사건 전개를 매끈하게 시작하는 현대 한국어 표현을 택했습니다.
- source_word: אִשָּׁה גְדוֹלָה
  english_pob_choice: a prominent woman
  chosen_korean: 한 유력한 여인
  alternatives_korean:
  - 한 큰 여인
  - 한 부유한 여인
  lexicon: HALOT
  rationale: גדולה는 단순한 '크다'보다 사회적 지위나 영향력을 가리키는 가능성이 커서, 재산에만 고정되지 않도록 '유력한'으로 옮겼습니다.
- source_word: וַתַּחֲזֶק בּוֹ
  english_pob_choice: she urged him
  chosen_korean: 그를 강권하여
  alternatives_korean:
  - 그를 권하여
  - 그에게 간청하여
  lexicon: HALOT
  rationale: 어근상 '붙잡다/강하게 하다'의 뉘앙스가 있어, 단순한 초청보다 더 강한 호의와 압박을 드러내는 표현으로 옮겼습니다.
- source_word: לֶאֱכָל לָחֶם
  english_pob_choice: to eat bread
  chosen_korean: 빵을 먹게 했습니다
  alternatives_korean:
  - 식을 먹게 했습니다
  - 밥을 먹게 했습니다
  lexicon: HALOT
  rationale: לחם은 문자적으로 '빵'이지만 여기서는 식사 전체를 가리키는 관용적 표현으로, 한국어에서는 간결하게 '빵을 먹다'로 유지해 원문 반복을 살렸습니다.
- source_word: מִדֵּי עָבְרוֹ ... יָסֻר שָׁמָּה
  english_pob_choice: whenever he passed by ... he would turn in there
  chosen_korean: 그가 지나갈 때마다 그곳으로 들어가 ... 먹곤 했습니다
  alternatives_korean:
  - 그가 지나갈 때마다 그곳으로 들르곤 했습니다
  - 지날 때마다 그곳으로 돌아들었습니다
  lexicon: HALOT
  rationale: 반복성을 나타내는 구조를 '때마다'로 살렸고, יָסֻר의 방향성을 '들어가'로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 사회적 지위가 암시되는 '큰/유력한'의 해석
  chosen_reading: 이 여인은 단순히 나이·체격이 큰 여인이 아니라, 마을에서 영향력이나 지위가 있는 인물로 이해했습니다.
  alternative_readings:
  - 재산이 많은 여인
  - 위대한 여인
  rationale: 본문의 מידות가 아니라 সামাজিক/서사적 맥락이 핵심이므로, 의미를 과도하게 좁히지 않으면서도 독자에게 자연스럽게 전달되는 쪽을 택했습니다.
  doctrine_reference: 서사 문맥 해석 원리
