  edition: WLC
  text: וַ/יִּשָּׂאֵ֔/הוּ וַ/יְבִיאֵ֖/הוּ אֶל אִמּ֑/וֹ וַ/יֵּ֧שֶׁב עַל בִּרְכֶּ֛י/הָ עַד הַֽ/צָּהֳרַ֖יִם וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/004/020.yaml
  text: And he carried him and brought him to his mother[a], and he sat on her knees until noon; then he died.
  footnotes:
  - marker: a
    text: Or 'on her lap'; the Hebrew reads 'on her knees.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그 아이를 안고 그의 어머니에게 데려갔습니다[a]. 아이는 그의 무릎 위에 앉아 있다가 정오까지 있다가 죽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 무릎 위에’; 히브리어는 문자적으로 ‘그의 무릎들 위에’라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂאֵהוּ
  english_pob_choice: carried him
  chosen_korean: 안고
  alternatives_korean:
  - 데리고
  - 업고
  - 옮기고
  lexicon: HALOT
  rationale: נשא는 여기서 단순히 들어 올리는 동작보다 아이를 품에 안아 이동시키는 지속적 운반을 나타내므로, 자연스러운 한국어로는 ‘안고’가 가장 잘 맞습니다.
- source_word: וַיְבִיאֵהוּ אֶל אִמּוֹ
  english_pob_choice: brought him to his mother
  chosen_korean: 그의 어머니에게 데려갔습니다
  alternatives_korean:
  - 그의 어머니께 데려갔습니다
  - 그의 어머니에게 가져갔습니다
  lexicon: HALOT
  rationale: ביא(히필)는 목적지로 ‘데려오다/데려가다’의 뜻이므로, 관계를 드러내는 ‘어머니에게 데려갔습니다’가 적절합니다.
- source_word: עַל בִּרְכֶּיהָ
  english_pob_choice: on her knees
  chosen_korean: 그의 무릎 위에
  alternatives_korean:
  - 그의 무릎에
  - 그의 품에
  lexicon: HALOT
  rationale: 히브리어 본문은 비유적 ‘품’보다 문자적으로 ‘무릎(들) 위’를 말하므로, 의미를 완화하지 않고 그대로 살린 표현을 택했습니다.
- source_word: עַד הַצָּהֳרַיִם
  english_pob_choice: until noon
  chosen_korean: 정오까지
  alternatives_korean:
  - 한낮까지
  - 정오가 될 때까지
  lexicon: HALOT
  rationale: צָהֳרַיִם은 정오/한낮을 가리키므로, 현대 한국어에서는 ‘정오까지’가 가장 자연스럽고 정확합니다.
- source_word: וַיָּמֹת
  english_pob_choice: then he died
  chosen_korean: 죽었습니다
  alternatives_korean:
  - 그런 다음 죽었습니다
  - 마침내 죽었습니다
  lexicon: HALOT
  rationale: 문맥의 서술 진행은 접속사보다 동사 연쇄로 충분히 드러나므로, 한국어에서는 간결하게 ‘죽었습니다’로 옮겼습니다.
theological_decisions:
- issue: 부모-자녀 관계와 정서적 긴장 표현
  chosen_reading: ‘안고’와 ‘무릎 위에’라는 직역에 가까운 표현을 유지해, 아이를 살리려는 어머니의 절박함과 장면의 정서를 약화시키지 않았습니다.
  alternative_readings:
  - ‘데리고’와 ‘품에’로 완화하여 자연스럽게 다듬는 읽기
  rationale: 본문은 장면의 신체적 밀착과 비극적 반전을 함께 강조하므로, 이를 평평하게 만들지 않는 번역이 서사 의도를 더 잘 보존합니다.
  doctrine_reference: 서술 본문의 서정·비극적 효과 보존
