source:
  edition: WLC
  text: וְ/הַ/שְּׁלִשִׁית֙ בְּ/שַׁ֣עַר ס֔וּר וְ/הַ/שְּׁלִשִׁ֥ית בַּ/שַּׁ֖עַר אַחַ֣ר הָ/רָצִ֑ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת הַ/בַּ֖יִת מַסָּֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/006.yaml
  text: and a third shall be at the Sur Gate[a], and a third at the gate behind the runners[b]; and you shall keep watch over the house to prevent intrusion.
  footnotes:
  - marker: a
    text: Or 'the guards' or 'the royal guards'; Hebrew literally 'the runners.'
    reason: lexical_alternative
  - marker: b
    text: The meaning of the Hebrew term rendered 'as a barricade' is uncertain; it may mean 'for defense' or 'to prevent entry.'
    reason: lexical_alternative
translation:
  language: ko
  text: 또 삼분의 일은 수르 문에, 삼분의 일은 주자들[a] 뒤의 문에 배치하십시오. 집을 지켜 침입을 막으십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘주자들’은 히브리어의 문자적 표현입니다. 왕실 문맥에서는 전령이나 왕실 경호대를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘침입을 막으십시오’로 옮긴 히브리어 희귀어의 뜻은 확실하지 않습니다. ‘방어를 위해’ 또는 ‘출입을 막도록’이라는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁלִשִׁית
  english_pob_choice: and a third
  chosen_korean: 그리고 세 번째는
  alternatives_korean:
  - 그리고 한 부분은
  - 그리고 셋째는
  lexicon: HALOT
  rationale: 세 갈래로 나뉜 경비 배치를 한국어 자연문으로 옮기되, 분배적 의미를 살려 ‘세 번째’로 처리했습니다.
- source_word: בְּשַׁעַר סוּר
  english_pob_choice: at the Sur Gate
  chosen_korean: 수르 문 앞에
  alternatives_korean:
  - 수르 성문에
  - 수르 문에
  lexicon: HALOT
  rationale: שַׁעַר는 ‘문/성문’이지만, 문맥상 장소 지시를 자연스럽게 살려 ‘문 앞에’로 옮겼고, סוּר은 고유지명으로 음역했습니다.
- source_word: הָרָצִים
  english_pob_choice: the runners
  chosen_korean: 주자들
  alternatives_korean:
  - 달리는 자들
  - 전령들
  - 경호병들
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘달리는 자들’이지만, 왕실 맥락에서 기능상 전령/호위대일 수 있어 본문은 직역에 가깝게 두되 한국어로는 지나치게 어색하지 않은 ‘주자들’을 택했습니다.
- source_word: מַסָּח
  english_pob_choice: to prevent intrusion
  chosen_korean: 침입하지 못하게
  alternatives_korean:
  - 막는 경계로
  - 방어하기 위해
  - 출입을 막도록
  lexicon: HALOT
  rationale: 희귀어로 의미가 분명하지 않으므로, 영어 POB의 해석을 따라 ‘침입하지 못하게’라고 옮겨 방어·차단의 기능을 드러냈습니다.
theological_decisions:
- issue: 왕궁 경비 지시문의 군사적 기능
  chosen_reading: 본문은 성전이 아니라 왕궁/집의 경비 배치를 기술하는 실무 지시로 읽었습니다.
  alternative_readings:
  - 성전 경비 지시로 일반화하는 읽기
  - 상징적 영적 의미를 덧붙이는 읽기
  rationale: 문맥의 3분 배치와 ‘주자들’ 표현은 구체적 경비 운영을 가리키므로, 과도한 상징화 없이 역사적·서술적 의미를 유지했습니다.
  doctrine_reference: 본문 문맥 우선 원칙
- issue: 희귀어 מַסָּח의 처리
  chosen_reading: ‘침입하지 못하게’로 기능을 번역하고, 본문의 불확실성은 직역을 과장하지 않는 방식으로 보존했습니다.
  alternative_readings:
  - ‘장벽으로’
  - ‘방어용으로’
  - ‘출입을 막도록’
  rationale: 어휘 자체의 의미가 확정적이지 않으므로, 해석을 단정하지 않으면서도 경계 목적을 전달하는 표현을 택했습니다.
  doctrine_reference: 보수적 의미 보존 원칙
