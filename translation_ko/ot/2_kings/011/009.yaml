source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֞וּ שָׂרֵ֣י ה/מאיות כְּ/כֹ֣ל אֲשֶׁר צִוָּה֮ יְהוֹיָדָ֣ע הַ/כֹּהֵן֒ וַ/יִּקְחוּ֙ אִ֣ישׁ אֶת אֲנָשָׁ֔י/ו בָּאֵ֣י הַ/שַּׁבָּ֔ת עִ֖ם יֹצְאֵ֣י הַ/שַּׁבָּ֑ת וַ/יָּבֹ֖אוּ אֶל יְהוֹיָדָ֥ע הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/009.yaml
  text: So the commanders of hundreds did according to all that Jehoiada the priest commanded. Each took his men[a], those coming on duty on the Sabbath together with those going off duty on the Sabbath, and they came to Jehoiada the priest.
  footnotes:
  - marker: a
    text: Or 'those entering on the Sabbath ... those leaving on the Sabbath.' The Hebrew may be rendered more literally, but the context suggests incoming and outgoing duty shifts.
    reason: lexical_alternative
translation:
  language: ko
  text: 이에 백인대장들은 제사장 여호야다가 명령한 모든 대로 했습니다. 각자는 자기 부하들, 곧 안식일에 들어오는 자들과 안식일에 나가는 자들을 함께 데리고 제사장 여호야다에게 왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “안식일에 들어오는 자들 … 안식일에 나가는 자들”입니다. 문맥상 성전 또는 군사 교대조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  english_pob_choice: the commanders of hundreds
  chosen_korean: 백인대장들
  alternatives_korean:
  - 백 명의 지휘관들
  - 백인대들
  lexicon: HALOT
  rationale: 군사적 단위를 지휘하는 지휘관이라는 뜻을 간결하게 살리면서, 한국어에서 자연스럽고 널리 이해되는 관직 표현을 택했습니다.
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  english_pob_choice: according to all that ... commanded
  chosen_korean: 명령한 모든 대로
  alternatives_korean:
  - 모든 것을 따라
  - 모든 것처럼
  lexicon: HALOT
  rationale: 명령에 대한 전면적 순종을 드러내는 관용구로 보아, 과도하게 직역하지 않으면서도 포괄성을 유지했습니다.
- source_word: בָּאֵי הַשַּׁבָּת / יֹצְאֵי הַשַּׁבָּת
  english_pob_choice: those coming on duty on the Sabbath / those going off duty on the Sabbath
  chosen_korean: 안식일에 들어오는 자들과 안식일에 나가는 자들
  alternatives_korean:
  - 안식일에 들어오는 사람들과 안식일에 나가는 사람들
  - 안식일에 들어오는 근무조와 안식일에 나가는 근무조
  lexicon: HALOT
  rationale: 본문의 대조를 살리되, 영어 POB가 시사하는 교대 근무의 기능적 의미를 한국어 본문에는 최소한으로만 반영했습니다.
- source_word: אִישׁ אֶת אֲנָשָׁיו
  english_pob_choice: Each took his men
  chosen_korean: 각 사람은 자기 부하들을 데리고
  alternatives_korean:
  - 각 사람은 자기 사람들을 데리고
  - 각자 자기 부하들을 거느리고
  lexicon: HALOT
  rationale: 분배적 단수와 하위 병력 관계를 자연스럽게 드러내기 위해 '부하들'을 택했습니다. 제도적 종속 관계를 흐리지 않기 위한 선택입니다.
theological_decisions:
- issue: 안식일 교대 표현의 직역과 기능적 의미 사이의 긴장
  chosen_reading: ‘안식일에 들어오는 자들 / 나가는 자들’로 비교적 직역하되, 한국어 문장 전체는 교대 인력을 가리키는 문맥이 드러나도록 구성했습니다.
  alternative_readings:
  - ‘안식일에 근무하러 들어오는 자들 / 근무를 마치고 나가는 자들’
  - ‘안식일에 교대해 들어오는 자들 / 교대해 나가는 자들’
  rationale: 본문의 히브리어는 문자적으로는 ‘들어오는/나가는’ 구조이며, 영어 POB도 이를 근무 교대의 문맥으로 이해합니다. 그러나 본문 자체가 명시하는 이상의 해석을 과도하게 주입하지 않도록 절제했습니다.
  doctrine_reference: 본문 주해 원칙; 서술의 역사성 보존
