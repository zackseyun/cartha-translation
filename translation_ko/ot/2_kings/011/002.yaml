id: 2KI.11.2
reference: 2 Kings 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/תִּקַּ֣ח יְהוֹשֶׁ֣בַע בַּת הַ/מֶּֽלֶךְ י֠וֹרָם אֲח֨וֹת אֲחַזְיָ֜הוּ אֶת יוֹאָ֣שׁ בֶּן אֲחַזְיָ֗ה וַ/תִּגְנֹ֤ב אֹת/וֹ֙ מִ/תּ֤וֹךְ בְּנֵֽי הַ/מֶּ֨לֶךְ֙ ה/ממותתים אֹת֥/וֹ וְ/אֶת מֵינִקְתּ֖/וֹ בַּ/חֲדַ֣ר הַ/מִּטּ֑וֹת וַ/יַּסְתִּ֧רוּ אֹת֛/וֹ מִ/פְּנֵ֥י עֲתַלְיָ֖הוּ וְ/לֹ֥א הוּמָֽת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/002.yaml
  text: But Jehosheba[a], the daughter of King Joram, sister of Ahaziah, took Joash son of Ahaziah and stole him away from among the king’s sons who were being put to death, along with his nurse, into the bedroom; and they hid him from Athaliah[c][b], so that he was not put to death.
  footnotes:
  - marker: a
    text: 'Hebrew: ''in the room of the beds'' or ''in the bedchamber.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'his wet nurse.'
    reason: lexical_alternative
  - marker: c
    text: 'The Hebrew verb is plural: ''they hid him.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그런데 여호사브앗[a], 곧 여호람 왕의 딸이며 아하시야의 누이인 그 여자가 아하시야의 아들 요아스를 데려다가, 왕자들 가운데서 죽임을 당하고 있던 자들 가운데서 그와 그의 유모[b]를 침실로 숨겼습니다[c]. 그리고 그들은 그를 아달랴의 눈앞에서 감추어, 그가 죽임을 당하지 않게 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘침상들의 방’ 또는 ‘침실’ 정도의 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘젖먹이 보모’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 동사는 복수형으로, ‘그들이 그를 숨겼다’는 뜻입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בַּת הַמֶּלֶךְ יוֹרָם
  english_pob_choice: the daughter of King Joram
  chosen_korean: 여호람 왕의 딸
  alternatives_korean:
  - 왕의 딸 여호람
  - 여호람의 왕딸
  lexicon: HALOT
  rationale: 히브리어 친족·왕호 구조를 그대로 살려, 여호사브앗이 왕족 혈통임을 분명히 드러냅니다.
- source_word: אֲחוֹת אֲחַזְיָהוּ
  english_pob_choice: sister of Ahaziah
  chosen_korean: 아하시야의 누이
  alternatives_korean:
  - 아하시야의 자매
  - 아하시야의 친족
  lexicon: HALOT
  rationale: אחות의 기본 의미인 ‘누이/자매’를 유지하여, 본문이 말하는 직접적 친족 관계를 약화시키지 않았습니다.
- source_word: וַתִּגְנֹב אֹתוֹ
  english_pob_choice: stole him away
  chosen_korean: 데려다가
  alternatives_korean:
  - 훔쳐 데려가
  - 몰래 데려가
  - 빼돌려
  lexicon: HALOT
  rationale: 히브리어의 ‘훔치다’ 뉘앙스는 본문에서 은밀한 구조 행동으로 기능하므로, 한국어에서는 지나치게 거친 표현보다 서술의 자연스러움과 긴박감을 함께 살리는 방향을 택했습니다.
- source_word: מֵינִקְתּוֹ
  english_pob_choice: his nurse
  chosen_korean: 그의 유모
  alternatives_korean:
  - 그의 젖먹이 보모
  - 그의 젖어미
  lexicon: HALOT
  rationale: 어린 왕자의 수유·양육을 맡는 여인을 가리키므로, 현대 한국어에서 가장 바로 이해되는 ‘유모’로 옮겼습니다.
- source_word: בַּחֲדַר הַמִּטּוֹת
  english_pob_choice: into the bedroom
  chosen_korean: 침실로
  alternatives_korean:
  - 침상 방으로
  - 침실 방으로
  - 침상들이 있는 방으로
  lexicon: HALOT
  rationale: 직역하면 ‘침상들의 방’에 가깝지만, 문맥상 은신 장소의 기능을 드러내는 자연스러운 현대어로 옮기되, 본문이 지시하는 공간성을 보존했습니다.
- source_word: וַיַּסְתִּרוּ אֹתוֹ
  english_pob_choice: they hid him
  chosen_korean: 그들은 그를 감추어
  alternatives_korean:
  - 그들이 그를 숨겨
  - 그들은 그를 숨기고
  lexicon: HALOT
  rationale: 히브리어 복수 동사를 그대로 반영해 주어를 복수로 유지하면서, 앞선 행동과 이어지는 결과를 한국어 접속 방식으로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 아하시야와의 혈족 관계를 약화시키지 않을 것인지
  chosen_reading: 본문의 직접 어휘대로 ‘아하시야의 누이’로 옮기고, 조정된 친족 표현으로 완화하지 않았습니다.
  alternative_readings:
  - 아하시야의 친족
  - 아하시야와 가까운 사람
  rationale: 본문은 일반적인 친족어를 사용하므로, 조화 목적의 완화는 원문의 발화력을 줄일 수 있습니다. 본문이 말하는 왕실 내부의 긴장과 구조의 긴박함을 그대로 드러내는 쪽이 적합합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: ‘그들은 그를 감추어’의 복수 주어 유지
  chosen_reading: 히브리어 복수형을 살려 복수 주어 ‘그들은’으로 번역했습니다.
  alternative_readings:
  - 그녀는 그를 감추어
  - 그가 감추어지도록
  rationale: 본문의 형태 정보는 작은 차이처럼 보여도 서술 주체를 투명하게 보여 줍니다. 행위자 복수는 텍스트가 허용하는 범위 안에서 유지해야 합니다.
  doctrine_reference: Translation philosophy §1, §5
