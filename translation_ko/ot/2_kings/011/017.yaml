base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/017.yaml
  text: Then Jehoiada made the covenant between Yahweh and the king and the people[a], that they should be a people for Yahweh[b], and also between the king and the people.
  footnotes:
  - marker: a
    text: Hebrew literally, 'cut the covenant,' a standard idiom meaning 'made the covenant.'
    reason: lexical_alternative
  - marker: b
    text: Or, 'to be the LORD's people.'
    reason: alternative_reading
translation:
  language: ko
  text: 그때 여호야다는 야훼와 왕과 백성 사이에 언약을 세워, 그들이 야훼의 백성이 되게 하였고[a][b], 또 왕과 백성 사이에도 언약을 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로는 ‘언약을 자르다’이지만, 관용적으로는 ‘언약을 세우다/맺다’는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘야훼의 백성이 되도록’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת ... אֶת הַבְּרִית
  english_pob_choice: made the covenant
  chosen_korean: 언약을 세워
  alternatives_korean:
  - 언약을 맺어
  - 언약을 만들고
  - 언약을 체결하여
  lexicon: HALOT
  rationale: כרת ברית는 ‘언약을 세우다/맺다’의 관용 표현이므로, ‘cut’의 직역보다 한국어에서 자연스럽고 언약 행위의 공적 성격을 살리는 표현을 택했습니다.
- source_word: בֵּין יְהוָה וּבֵין הַמֶּלֶךְ וּבֵין הָעָם
  english_pob_choice: between Yahweh and the king and the people
  chosen_korean: 야훼와 왕과 백성 사이에
  alternatives_korean:
  - 야훼와 왕과 백성 사이에서
  - 야훼, 왕, 백성 사이에
  lexicon: HALOT
  rationale: 반복된 בין 구조를 그대로 살려 언약의 삼자 관계를 드러내되, 한국어에서는 ‘사이’로 매끄럽게 정리했습니다.
- source_word: לִהְיוֹת לְעָם לַיהוָה
  english_pob_choice: that they should be a people for Yahweh
  chosen_korean: 그들이 야훼의 백성이 되게 하였고
  alternatives_korean:
  - 그들이 야훼를 위한 백성이 되게 하였고
  - 그들이 야훼께 속한 백성이 되게 하였고
  - 그들이 야훼의 백성이 되도록 하였고
  lexicon: HALOT
  rationale: לִהְיוֹת לְעָם לַיהוָה는 단순 소유가 아니라 언약적 소속과 목적을 함께 담으므로, ‘야훼의 백성’으로 옮기되 관계성을 유지했습니다.
- source_word: הָעָם
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민족
  - 백성들
  lexicon: HALOT
  rationale: 이 문맥의 עם은 언약 공동체 전체를 가리키므로, 왕과 대응되는 집합 명사로서 ‘백성’이 가장 적절합니다.
theological_decisions:
- issue: 여호와(יווה) 신명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 신명은 고유명사로서 ‘야훼’로 옮겨, 호칭 대체가 아니라 이름 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → 야훼'
- issue: 언약 목적절의 소속감 표현
  chosen_reading: 야훼의 백성이 되게 하였고
  alternative_readings:
  - 야훼께 속한 백성이 되게 하였고
  - 야훼의 백성이 되도록 하였고
  - 야훼의 백성으로 삼았고
  rationale: 히브리어의 언약적 목적을 유지하되, 한국어 독자가 ‘야훼께 속함’이라는 함의를 자연스럽게 읽도록 직역과 해석의 균형을 맞췄습니다.
  doctrine_reference: 'Translation philosophy: optimal-equivalence; covenant formulation'
