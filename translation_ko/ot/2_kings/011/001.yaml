  rationale: 히브리어 זֶרַע הַמַּמְלָכָה는 단순한 생물학적 씨앗이 아니라 왕조 계승자들을 가리키므로, 직역보다 의미를 드러내는 표현이 적절합니다.
  doctrine_reference: 왕조 계승과 언약사적 맥락
