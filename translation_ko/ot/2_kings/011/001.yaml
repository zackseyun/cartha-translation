  - 아하시야의 어미
  lexicon: HALOT
  rationale: 부자 관계를 나타내는 구성형을 자연스럽게 옮겨, 인물 식별 기능을 분명히 했습니다.
- source_word: וַתְּאַבֵּד אֵת כָּל זֶרַע הַמַּמְלָכָה
  english_pob_choice: destroyed all the royal offspring
  chosen_korean: 왕가의 모든 자손을 멸하였습니다
  alternatives_korean:
  - 왕가의 모든 씨를 멸하였습니다
  - 왕가의 모든 후손을 멸하였습니다
  - 왕실의 모든 자손을 없앴습니다
  lexicon: HALOT
  rationale: זֶרַע는 문자적으로 ‘씨’이지만 여기서는 왕조의 후손을 가리키므로 ‘자손’으로 풀었습니다. מִלֵּא? 아니요—동사 אַבֵּד의 강한 파괴/제거 뜻을 살려 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: 왕조적 ‘씨/자손’ 표현의 보존 여부
  chosen_reading: ‘왕가의 모든 자손’으로 옮겨 다윗 왕조 계승선을 암시하는 의미를 드러냈습니다.
  alternative_readings:
