  lexicon: 고유명사 표기
  rationale: 아달랴는 현대 한국어 성경에서 널리 쓰이는 표기이므로 음역을 따랐습니다. 서두의 와우 연속은 한국어에서는 별도 접속어보다 문맥 흐름으로 처리했습니다.
