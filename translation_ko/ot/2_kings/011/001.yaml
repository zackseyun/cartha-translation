base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/001.yaml
  text: Now Athaliah[a], the mother of Ahaziah, saw that her son was dead, so she arose and destroyed all the royal offspring.
  footnotes:
  - marker: a
    text: 'Hebrew: ''all the seed of the kingdom,'' that is, the royal line or royal descendants.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이세벨은 아달랴가 자기 아들 아하시야가 죽은 것을 보고 일어나 왕가의 모든 자손을 멸하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘왕국의 씨’ — 곧 왕가의 혈통/후손을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲתַלְיָה
  english_pob_choice: Now Athaliah
  chosen_korean: 아달랴는
  alternatives_korean:
  - 그리고 아달랴는
  - 그때 아달랴는
  lexicon: 고유명사 표기
  rationale: 아달랴는 현대 한국어 성경에서 널리 쓰이는 표기이므로 음역을 따랐습니다. 서두의 와우 연속은 한국어에서는 별도 접속어보다 문맥 흐름으로 처리했습니다.
- source_word: אֵם אֲחַזְיָהוּ
  english_pob_choice: the mother of Ahaziah
  chosen_korean: 아하시야의 어머니
  alternatives_korean:
  - 아하시야의 어머니인
  - 아하시야의 어미
  lexicon: HALOT
  rationale: 부자 관계를 나타내는 구성형을 자연스럽게 옮겨, 인물 식별 기능을 분명히 했습니다.
- source_word: וַתְּאַבֵּד אֵת כָּל זֶרַע הַמַּמְלָכָה
  english_pob_choice: destroyed all the royal offspring
  chosen_korean: 왕가의 모든 자손을 멸하였습니다
  alternatives_korean:
  - 왕가의 모든 씨를 멸하였습니다
  - 왕가의 모든 후손을 멸하였습니다
  - 왕실의 모든 자손을 없앴습니다
  lexicon: HALOT
  rationale: זֶרַע는 문자적으로 ‘씨’이지만 여기서는 왕조의 후손을 가리키므로 ‘자손’으로 풀었습니다. מִלֵּא? 아니요—동사 אַבֵּד의 강한 파괴/제거 뜻을 살려 ‘멸하다’로 옮겼습니다.
theological_decisions:
- issue: 왕조적 ‘씨/자손’ 표현의 보존 여부
  chosen_reading: ‘왕가의 모든 자손’으로 옮겨 다윗 왕조 계승선을 암시하는 의미를 드러냈습니다.
  alternative_readings:
  - ‘왕국의 씨’
  - ‘왕실의 후손’
  rationale: 히브리어 זֶרַע הַמַּמְלָכָה는 단순한 생물학적 씨앗이 아니라 왕조 계승자들을 가리키므로, 직역보다 의미를 드러내는 표현이 적절합니다.
  doctrine_reference: 왕조 계승과 언약사적 맥락
