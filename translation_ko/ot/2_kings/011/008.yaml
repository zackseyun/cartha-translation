  edition: WLC
  text: וְ/הִקַּפְתֶּ֨ם עַל הַ/מֶּ֜לֶךְ סָבִ֗יב אִ֚ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֔/וֹ וְ/הַ/בָּ֥א אֶל הַ/שְּׂדֵר֖וֹת יוּמָ֑ת וִ/הְי֥וּ אֶת הַ/מֶּ֖לֶךְ בְּ/צֵאת֥/וֹ וּ/בְ/בֹאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/008.yaml
  text: You shall surround the king on every side[a], each man with his weapons in his hand. Whoever comes within the ranks shall be put to death[b]. Stay with the king when he goes out and when he comes in.
  footnotes:
  - marker: a
    text: Or 'whoever comes into the lines/rows.' The Hebrew term likely refers to the arranged ranks of the guard.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''in his going out and in his coming in,'' an idiom for accompanying and guarding him in all his movements.'
    reason: cultural_note
translation:
  language: ko
  text: 왕을 사방으로 둘러싸십시오. 각 사람은 손에 무기를 들고 있어야 합니다. 진영 안으로 들어오는 자는 죽임을 당해야 합니다. 왕이 나갈 때와 들어올 때에는 왕과 함께 있으십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘진영/대열’을 가리키는 표현으로, 경호대의 배열된 줄을 뜻할 수 있습니다.
    reason: source_note
  - marker: b
    text: 히브리어 관용구로, ‘그가 나갈 때와 들어올 때’는 그의 모든 이동에 동행하며 보호하라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִקַּפְתֶּם עַל הַמֶּלֶךְ סָבִיב
  english_pob_choice: You shall surround the king on every side
  chosen_korean: 왕을 사방으로 둘러싸십시오
  alternatives_korean:
  - 왕 주위를 에워싸십시오
  - 왕을 온 사방에서 둘러싸십시오
  lexicon: HALOT
  rationale: 군사적 경계 명령의 문맥을 살려 ‘둘러싸다’로 옮기되, 사방성을 ‘사방으로’로 간결하게 드러냈습니다.
- source_word: וְכֵלָיו בְּיָדוֹ
  english_pob_choice: with his weapons in his hand
  chosen_korean: 각 사람은 손에 무기를 들고 있어야 합니다
  alternatives_korean:
  - 각 사람은 손에 자기 무기를 가져야 합니다
  - 각 사람은 손에 무기를 쥐고 있어야 합니다
  lexicon: HALOT
  rationale: כֵּלִים은 이 경호 문맥에서 도구보다 ‘무기’가 더 정확하며, ‘손에 들고’는 무장한 경계 태세를 자연스럽게 전달합니다.
- source_word: וְהַבָּא אֶל הַשְּׂדֵרוֹת
  english_pob_choice: Whoever comes within the ranks
  chosen_korean: 진영 안으로 들어오는 자
  alternatives_korean:
  - 대열 안으로 들어오는 자
  - 진열 속으로 들어오는 자
  lexicon: HALOT
  rationale: שְּׂדֵרוֹת는 배열된 대열/진영을 가리키므로, 군사적 의미가 분명한 ‘진영’으로 옮겼습니다.
- source_word: יוּמָת
  english_pob_choice: shall be put to death
  chosen_korean: 죽임을 당해야 합니다
  alternatives_korean:
  - 사형을 당해야 합니다
  - 반드시 죽어야 합니다
  lexicon: HALOT
  rationale: 히필/홉할의 처형 명령 성격을 반영해, 단순한 ‘죽다’보다 법적·군사적 집행 뉘앙스가 드러나는 수동 표현을 택했습니다.
- source_word: בְּצֵאתוֹ וּבְבֹאוֹ
  english_pob_choice: when he goes out and when he comes in
  chosen_korean: 왕이 나갈 때와 들어올 때에는 왕과 함께 있으십시오
  alternatives_korean:
  - 그가 나갈 때와 들어올 때에 함께 있으십시오
  - 나가고 들어올 때마다 왕 곁에 있으십시오
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 유지하면서도 한국어에서는 자연스럽게 ‘함께 있으십시오’로 풀어, 보호 동행의 뜻을 분명히 했습니다.
theological_decisions:
- issue: 왕 경호 명령의 강한 처형 경고
  chosen_reading: 진영 안으로 침입하는 자에게는 즉각적인 치명적 대응이 허용되는 군사 명령으로 옮겼습니다.
  alternative_readings:
  - 단순 경비 지시로 완화해 읽을 수 있음
  - ‘죽임을 당해야 합니다’를 덜 직설적으로 완화할 수 있음
  rationale: 본문의 명령문과 יוּמָת의 강한 법집행 뉘앙스를 흐리지 않기 위해, 경호 규정의 엄중함을 그대로 드러냈습니다.
  doctrine_reference: 본문-기반 역사 서술; 군사·법적 명령의 서술
- issue: ‘나갈 때와 들어올 때’ 관용구
  chosen_reading: 왕의 모든 이동을 함께 보좌하고 호위하는 상시 동행 의무로 이해해 번역했습니다.
  alternative_readings:
  - 시간표시의 단순 반복으로만 읽을 수 있음
  - 의례적 출입 장면만 가리킨다고 볼 수 있음
  rationale: 히브리어 관용구가 일상적 출입 전체를 포괄하므로, 한국어에서도 보호 동행의 상시성을 드러내는 해석을 택했습니다.
  doctrine_reference: 본문 관용구 해석
