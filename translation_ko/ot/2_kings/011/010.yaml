  text: 그때 제사장이 백부장들에게 창들과 방패들, 곧 야훼의 집에 있던 다윗 왕의 것들을 주었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 ‘창’이지만, 문맥상 여러 지휘관에게 나누어 준 무기들로 보이므로 복수로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 집 안에’; 영어 POB의 ‘the house of Yahweh’에 해당하는 표현입니다.
    reason: source_note
