  text: Then the priest gave to the commanders of hundreds the spears and the shields that had belonged to King David[b][a], which were in the house of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew 'the spear'; the singular may be used collectively, hence 'the spears.'
    reason: lexical_alternative
  - marker: b
    text: Or 'in the temple of the LORD.' Literally, 'in the house of the LORD.'
    reason: lexical_alternative
translation:
