source:
  edition: WLC
  text: וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ/ן הַ/שְּׁלִשִׁ֤ית מִ/כֶּם֙ בָּאֵ֣י הַ/שַּׁבָּ֔ת וְ/שֹׁ֣מְרֵ֔י מִשְׁמֶ֖רֶת בֵּ֥ית הַ/מֶּֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/005.yaml
  text: 'And he commanded them[a], saying, “This is the thing that you shall do: one third of you who come on the Sabbath shall keep watch over the king’s house,”'
  footnotes:
  - marker: a
    text: Or “the royal palace.” Hebrew literally reads “the king’s house.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 명령하며 말했습니다. “너희가 해야 할 일은 이렇습니다. 안식일에 들어오는 너희의 삼분의 일은 왕궁을 지키며 경계하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 히브리어는 문자적으로 “왕의 집”입니다. 문맥상 “왕궁”으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַוֵּם
  english_pob_choice: And he commanded them
  chosen_korean: 그가 그들에게 명령하며
  alternatives_korean:
  - 그가 그들에게 지시하며
  - 그가 그들에게 명하여
  lexicon: HALOT
  rationale: צוה의 강한 명령 의미를 살리되, 한국어 서술 흐름에서는 ‘명령하며’가 가장 자연스럽고 공적입니다.
- source_word: זֶה הַדָּבָר אֲשֶׁר תַּעֲשׂוּן
  english_pob_choice: This is the thing that you shall do
  chosen_korean: 너희가 해야 할 일은 이렇습니다
  alternatives_korean:
  - 이것이 너희가 행할 일입니다
  - 너희가 할 일은 이것입니다
  lexicon: HALOT
  rationale: 지시문 형식을 유지하면서도 현대 한국어에서 자연스럽게 들리도록 ‘해야 할 일’로 옮겼습니다.
- source_word: הַשְּׁלִשִׁית מִכֶּם
  english_pob_choice: one third of you
  chosen_korean: 너희의 삼분의 일
  alternatives_korean:
  - 너희 가운데 삼분의 일
  - 너희 중 한 부분
  lexicon: HALOT
  rationale: 히브리어의 집합적 분수 표현을 직접 반영해 인원 배분의 비율을 분명하게 했습니다.
- source_word: בָּאֵי הַשַּׁבָּת וְשֹׁמְרֵי מִשְׁמֶרֶת
  english_pob_choice: who come on the Sabbath ... shall keep watch
  chosen_korean: 안식일에 들어오는 ... 지키며 경계하십시오
  alternatives_korean:
  - 안식일에 오는 ... 수비하십시오
  - 안식일에 교대하여 들어오는 ... 지키십시오
  lexicon: HALOT
  rationale: ‘come on the Sabbath’는 교대 시점을 가리키므로 ‘안식일에 들어오는’으로 살리고, ‘keep watch’는 파수·경계의 의미를 함께 담아 ‘지키며 경계하다’로 옮겼습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕궁
  alternatives_korean:
  - 왕의 집
  - 왕의 궁
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘왕의 집’이지만 문맥상 궁전/궁성 전체를 가리킬 수 있어, EN POB의 각주 가능성을 고려하되 본문은 한국어 독자에게 자연스러운 ‘왕궁’으로 처리했습니다.
