  text: וַ/יִּשְׂמַ֥ח כָּל עַם הָ/אָ֖רֶץ וְ/הָ/עִ֣יר שָׁקָ֑טָה וְ/אֶת עֲתַלְיָ֛הוּ הֵמִ֥יתוּ בַ/חֶ֖רֶב בֵּ֥ית מלך־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/020.yaml
  text: And all the people of the land rejoiced[a], and the city was quiet. As for Athaliah, they put her to death with the sword at the king’s house.
  footnotes:
  - marker: a
    text: Or 'they killed her by the sword in the king’s house' / 'at the royal palace.' The Hebrew phrase is compact, and English may construe the final expression with slightly different nuance of location.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 땅의 모든 백성이 기뻐하였고, 성은 평온하였습니다. 그리고 그들이 아달랴를 왕궁에서 칼로 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 왕의 집에서 칼로 그녀를 죽였다’ / ‘왕궁에서.’ 히브리어 표현이 압축적이어서, 마지막 구절의 장소 관계는 한국어에서 약간 다르게 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמַח
  english_pob_choice: rejoiced
  chosen_korean: 기뻐하였고
  alternatives_korean:
  - 즐거워하였고
  - 환호하였고
  lexicon: HALOT
  rationale: שׂמח의 집단적 기쁨을 자연스러운 현대 한국어로 옮기되, 단순한 상태보다 사건성 있는 반응을 살리기 위해 '기뻐하다'를 택했습니다.
- source_word: כָּל עַם הָאָרֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 온 땅의 백성
  - 그 땅의 모든 사람들
  lexicon: HALOT
  rationale: 관용적 표현의 사회·정치적 뉘앙스를 유지하면서, 직역 어순보다 한국어 자연성을 고려해 '그 땅의 모든 백성'으로 옮겼습니다.
- source_word: שָׁקָטָה
  english_pob_choice: was quiet
  chosen_korean: 평온하였습니다
  alternatives_korean:
  - 조용하였습니다
  - 고요하였습니다
  - 평안하였습니다
  lexicon: HALOT
  rationale: 도시가 소란과 불안에서 벗어났다는 서술을 한국어에서 가장 자연스럽게 나타내기 위해 '평온하다'를 선택했습니다.
- source_word: הֵמִיתוּ
  english_pob_choice: they put her to death
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 사형에 처했습니다
  - 처형했습니다
  - 죽음에 이르게 했습니다
  lexicon: HALOT
  rationale: 히필의 원인적 의미는 포함하되, 본문이 법정 절차를 명시하지 않으므로 과도한 해석을 피하고 서술체로 간결하게 처리했습니다.
- source_word: בֵּית מלך
  english_pob_choice: at the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
  - 왕의 집 곁에서
  - 왕궁 안에서
  lexicon: HALOT
  rationale: 히브리어 구문은 장소를 압축적으로 제시하므로, 문맥상 자연스러운 한국어 관용어인 '왕궁'으로 옮겨 장소를 분명히 했습니다.
