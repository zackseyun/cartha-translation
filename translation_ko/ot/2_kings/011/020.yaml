  lexicon: HALOT
  rationale: 히필의 원인적 의미는 포함하되, 본문이 법정 절차를 명시하지 않으므로 과도한 해석을 피하고 서술체로 간결하게 처리했습니다.
- source_word: בֵּית מלך
  english_pob_choice: at the king’s house
  chosen_korean: 왕궁에서
  alternatives_korean:
  - 왕의 집에서
