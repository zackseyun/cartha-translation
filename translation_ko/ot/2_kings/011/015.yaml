  yaml_path: translation/ot/2_kings/011/015.yaml
  text: Then Jehoiada the priest commanded the captains of hundreds who were appointed over the army[a], and said to them, “Bring her out between the ranks, and whoever follows after her, put to death with the sword.” For the priest had said, “She must not be put to death in the house of Yahweh.”
  footnotes:
  - marker: a
    text: Or “outside the rows” / “to the area between the lines”; the Hebrew phrase is difficult and likely refers to taking her out through the ordered ranks of guards.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 여호야다 제사장이 군대 위에 세워진 백부장들에게 명하고 그들에게 말하였습니다. 「그 여인을 호위대 사이로 끌어내십시오. 그리고 그녀를 따라오는 자는 칼로 죽이십시오.」 제사장이 이미 「그녀를 야훼의 집에서 죽여서는 안 된다」라고 말했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘호위대 사이로’는 히브리어 표현의 난해함을 반영한 번역으로, 정렬된 경비병의 대오를 가리킬 가능성을 살렸습니다.
    reason: alternative_reading
