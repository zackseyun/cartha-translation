revisions:
- from: 일곱째 해에 여호야다가 사람을 보내어, 백부장들과 카리 사람들과 달리는 자들을 데려와 야훼의 집에서 자기에게로 오게 했습니다. 그는 그들과 언약을 맺고 야훼의 집에서 그들에게 맹세하게 한 뒤, 왕의 아들을 그들에게 보여 주었습니다.[a][b]
  to: 일곱째 해에 여호야다는 카리 사람들[a]과 달리는 자들[b]의 백부장들을 보내어 데려와, 야훼의 집에 있는 자기에게 이르게 했습니다. 그는 그들과 언약을 맺고 야훼의 집에서 그들에게 맹세하게 한 뒤, 왕의 아들을 그들에게 보여 주었습니다.
  rationale: 백부장들과 카리 사람들 및 달리는 자들의 문법적 관계를 바로잡고, 원문이 명시하지 않는 ‘보낸 사람’을 제거했습니다. ‘보내어 데려와’는 두 히브리어 동사를 보존하며, ‘야훼의 집에 있는 자기에게’는 장소와 수혜/방향의 의미를 함께 반영합니다. 불확실한 집단명의 동일시는 각주에서만 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:00Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어는 여호야다가 ‘보내고’ 카리 사람들과 달리는 자들에 속한 백부장들을 데려온 것으로 말합니다. 초안의 ‘사람을 보내어’는 보낸 사람을 명시하고, ‘…오게 했습니다’는 원문의 연속 동작을 다소 우회적으로 바꿉니다. 또한 שָׂרֵי הַמֵּאוֹת 뒤의 לַכָּרִי וְלָרָצִים은 카리 사람들과 달리는 자들 자체와 백부장들을 나란히 열거하기보다, 그들의 백부장들을 가리키는 것으로 옮기는 편이 문법과 문맥에 더 충실합니다.
  naturalness: ‘야훼의 집에 있는 자기에게 그들을 데려왔습니다’는 원문의 장소와 ‘자기에게’를 모두 보존하면서 현대 표준 한국어 합쇼체로 자연스럽습니다. 각주 표지는 해당 어구 바로 뒤에 두어 지시 대상을 분명히 했습니다.
