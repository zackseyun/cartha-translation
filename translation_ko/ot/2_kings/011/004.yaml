source:
  edition: WLC
  text: וּ/בַ/שָּׁנָ֣ה הַ֠/שְּׁבִיעִית שָׁלַ֨ח יְהוֹיָדָ֜ע וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י ה/מאיות לַ/כָּרִי֙ וְ/לָ֣/רָצִ֔ים וַ/יָּבֵ֥א אֹתָ֛/ם אֵלָ֖י/ו בֵּ֣ית יְהוָ֑ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם בְּרִ֜ית וַ/יַּשְׁבַּ֤ע אֹתָ/ם֙ בְּ/בֵ֣ית יְהוָ֔ה וַ/יַּ֥רְא אֹתָ֖/ם אֶת בֶּן הַ/מֶּֽלֶךְ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/004.yaml
  text: In the seventh year Jehoiada sent and took the commanders of hundreds[a], the Carites, and the runners, and brought them to himself in the house of Yahweh. He made a covenant with them and put them under oath in the house of Yahweh[b], and showed them the king’s son.
  footnotes:
  - marker: a
    text: Or 'the Cherethites.' The Hebrew term likely names a royal guard unit; its precise identification is uncertain.
    reason: alternative_reading
  - marker: b
    text: '''The runners'' likely refers to royal guards or couriers.'
    reason: cultural_note
translation:
  language: ko
  text: 일곱째 해에 여호야다는 카리 사람들[a]과 달리는 자들[b]의 백부장들을 보내어 데려와, 야훼의 집에 있는 자기에게 이르게 했습니다. 그는 그들과 언약을 맺고 야훼의 집에서 그들에게 맹세하게 한 뒤, 왕의 아들을 그들에게 보여 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘카리 사람들’은 히브리어 집단명 לַכָּרִי를 음역한 것입니다. 정확한 동일시는 확정되지 않았으며, ‘그렛 사람들’로 이해하기도 합니다.
    reason: alternative_reading
  - marker: b
    text: ‘달리는 자들’은 왕실 경호대나 전령을 가리키는 표현일 가능성이 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  english_pob_choice: the commanders of hundreds
  chosen_korean: 백부장들
  alternatives_korean:
  - 백 명의 지휘관들
  - 백인대장들
  lexicon: HALOT
  rationale: 군사 단위를 다스리는 지휘관이라는 뜻을 살려 한국어 성경에서 널리 통용되는 기능적 대응을 택했습니다. '백인대장들'은 관용적이지만 시대감을 지나치게 다르게 만들 수 있어 피했습니다.
- source_word: לַכָּרִי
  english_pob_choice: the Carites
  chosen_korean: 카리 사람들
  alternatives_korean:
  - 가리 사람들
  - 케레스 사람들
  lexicon: HALOT
  rationale: 고유 집단명으로 보존하는 것이 본문의 불확실성을 가장 잘 드러냅니다. 영어 POB의 각주처럼 정확한 동일시가 확정되지 않았으므로 음역형을 유지했습니다.
- source_word: וְלָרָצִים
  english_pob_choice: and the runners
  chosen_korean: 달리는 자들
  alternatives_korean:
  - 달리는 사람들
  - 전령들
  - 호위병들
  lexicon: HALOT
  rationale: 직역을 살려 원문의 표현을 유지했습니다. 기능상 왕실 경호/전령일 수 있지만, 본문 자체는 문자적으로 '달리는 자들'이므로 주석 없이도 이해 가능한 범위에서 그대로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 여호와의 집
  - 주님의 집
  - 성전
  lexicon: HALOT
  rationale: 원문의 언약명 יהוה를 프로젝트 기본값에 따라 '야훼'로 옮겼고, '집'을 유지해 히브리어 관용구를 보존했습니다. '성전'은 의미를 풀어쓴 표현이므로 본문에서는 피했습니다.
- source_word: וַיִּכְרֹת לָהֶם בְּרִית
  english_pob_choice: He made a covenant with them
  chosen_korean: 그들과 언약을 맺고
  alternatives_korean:
  - 그들과 언약을 세우고
  - 그들과 계약을 맺고
  lexicon: HALOT
  rationale: כרת ברית의 표준 관용구를 한국어 성경의 신학적 어휘인 '언약'으로 옮겼습니다. '계약'은 법률적 뉘앙스가 강해 본문의 공적·신앙적 무게를 약화시킬 수 있습니다.
- source_word: וַיַּשְׁבַּע אֹתָם
  english_pob_choice: and put them under oath
  chosen_korean: 그들에게 맹세하게 한 뒤
  alternatives_korean:
  - 그들을 맹세 아래 두고
  - 그들에게 서약하게 한 뒤
  lexicon: HALOT
  rationale: 사역형의 의미를 자연스러운 현대 한국어로 풀었습니다. 맹세의 강제성을 드러내면서도 지나치게 법률문서처럼 들리지 않게 했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 직접 사용하는 하나님의 이름을 표준 프로젝트 원칙에 따라 음역해, 언약명 자체가 드러나도록 했습니다. 영어 POB의 'Yahweh'와도 정합적입니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
- issue: 왕의 아들을 '보여 주었습니다'의 처리
  chosen_reading: 보여 주었습니다
  alternative_readings:
  - 드러내 보였습니다
  - 보게 했습니다
  rationale: 제사장 여호야다가 왕위를 보호하기 위해 핵심 인물에게 적법한 계승자를 공개하는 장면이므로, 단순한 시각 제시 이상의 공식적 공개를 담되 과잉 해석은 피했습니다.
  doctrine_reference: 서사 문맥상 계승 정당성의 확인
