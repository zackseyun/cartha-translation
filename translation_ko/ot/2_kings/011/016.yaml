  verdict: revise
  source_fidelity: ‘손을 대다’는 히브리어 표현의 외형을 일부 보존하지만, 한국어에서는 단순 접촉으로도 이해될 수 있어 체포·제압 문맥을 충분히 전달하지 못합니다. 또한 לָהּ가 포함된 이 표현은 ‘그녀를 붙잡았다’와 ‘그녀를 위해 길을 내주었다’라는 해석이 갈리는 곳이므로 각주에서 그 대안을 밝혀야 합니다. ‘דרך מבוא הסוסים בית המלך’는 말의 입구를 지난 뒤 왕궁에 갔다는 두 단계 이동이라기보다 왕궁으로 들어가는 말 출입로를 따른 이동을 가리킵니다.
  naturalness: ‘왕궁으로 들어가는 말 출입로를 따라 갔고’는 현대 표준 한국어에서 자연스러우며, 원문의 장소·경로 관계를 명확히 합니다. 각주 표지는 해당 어구 바로 뒤에 배치하는 것이 적절합니다.
  terminology: ‘왕궁’은 בֵּית הַמֶּלֶךְ가 이 문맥에서 가리키는 궁정/왕궁을 자연스럽게 전달합니다. ‘죽임을 당했습니다’는 Hophal 동사의 수동적 처형 의미를 유지합니다.
  issues:
