  text: וַ/יָּשִׂ֤מוּ לָ/הּ֙ יָדַ֔יִם וַ/תָּב֛וֹא דֶּֽרֶךְ מְב֥וֹא הַ/סּוּסִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/תּוּמַ֖ת שָֽׁם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/016.yaml
  text: So they laid hands on her[a], and she went by the way of the horses’ entrance to the king’s house[b], and there she was put to death.
  footnotes:
  - marker: a
    text: Or, 'they seized her.' Some translations take the Hebrew idiom differently as 'they made room for her,' but the more direct sense is that they took hold of her.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the horses’ entrance.' This likely refers to the access route or gate by which horses entered the palace area.
    reason: cultural_note
translation:
  language: ko
  text: 그들이 그녀에게 손을 대자, 그녀는 말들의 입구를 지나 왕궁으로 갔고, 거기서 죽임을 당했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 문맥상 ‘붙잡다/체포하다’의 뜻입니다. 직역하면 ‘손을 대다’입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘말들의 입구’입니다. 궁정 구역으로 들어가는 말의 출입로를 가리키는 말로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהּ יָדַיִם
  english_pob_choice: they laid hands on her
  chosen_korean: 그들이 그녀에게 손을 대자
  alternatives_korean:
  - 그들이 그녀를 붙잡자
  - 그들이 그녀를 체포하자
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘손을 두다’의 구체성을 살리면서, 문맥상 압박·제압의 의미를 자연스럽게 드러냈습니다.
- source_word: מְבוֹא הַסּוּסִים
  english_pob_choice: the horses’ entrance
  chosen_korean: 말들의 입구
  alternatives_korean:
  - 말들의 출입문
  - 말들의 들어가는 길
  lexicon: HALOT
  rationale: 직역에 가까운 형태를 유지하되, ‘horses’ entrance’라는 POB의 문화적 주석을 반영해 성벽/궁정 구역의 출입 지점을 뜻하는 표현으로 옮겼습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s house
  chosen_korean: 왕궁으로
  alternatives_korean:
  - 왕의 집으로
  - 왕궁으로
  lexicon: HALOT
  rationale: 히브리어의 ‘왕의 집’이라는 문자성을 살리면서, 한국어에서는 실제 장소 의미가 분명한 ‘왕궁’이 자연스러워 문맥에 맞게 풀었습니다.
- source_word: וַתּוּמַת
  english_pob_choice: she was put to death
  chosen_korean: 죽임을 당했습니다
  alternatives_korean:
  - 처형당했습니다
  - 죽었습니다
  lexicon: HALOT
  rationale: 단순한 ‘죽다’가 아니라 실행된 처형의 의미를 드러내기 위해 수동적·사건적 표현을 선택했습니다.
theological_decisions:
- issue: 아달랴의 최종 처형 묘사
  chosen_reading: 본문의 서술을 완곡하게 낮추지 않고, 실행된 죽임으로 직접 번역했습니다.
  alternative_readings:
  - 그녀는 죽었습니다
  - 그녀는 사망했습니다
  rationale: 문맥은 단순 자연사나 일반적 죽음이 아니라 왕권 회복 과정에서의 처형을 가리키므로, 원문의 법정·집행적 뉘앙스를 유지하는 것이 필요합니다.
  doctrine_reference: 서술 문맥의 역사적·법적 의미 보존
