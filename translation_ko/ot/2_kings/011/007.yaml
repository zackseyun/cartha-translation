theological_decisions:
- issue: 야훼의 집을 지키는 행위의 목적을 어떻게 드러낼지
  chosen_reading: ‘야훼의 집을 지켜 왕을 위해 파수할 것입니다’로 옮겨, 성전 수비가 곧 왕 보호와 연결된다는 문맥을 살렸습니다.
  alternative_readings:
  - ‘야훼의 집을 지켜 왕을 위하여’
  - ‘왕을 향하여/왕 곁에서’
  rationale: 히브리어의 אֶל הַמֶּלֶךְ는 난해하지만, 주변 문맥상 성전 경비가 왕의 안전을 위한 조치라는 점이 분명하므로 목적/이익의 뉘앙스를 살렸습니다.
  doctrine_reference: Narrative context in 2 Kings 11; POB audit trail for אֶל הַמֶּלֶךְ
