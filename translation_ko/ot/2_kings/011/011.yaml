id: 2KI.11.11
reference: 2 Kings 11:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעַמְד֨וּ הָ/רָצִ֜ים אִ֣ישׁ וְ/כֵלָ֣י/ו בְּ/יָד֗/וֹ מִ/כֶּ֨תֶף הַ/בַּ֤יִת הַ/יְמָנִית֙ עַד כֶּ֤תֶף הַ/בַּ֨יִת֙ הַ/שְּׂמָאלִ֔ית לַ/מִּזְבֵּ֖חַ וְ/לַ/בָּ֑יִת עַל הַ/מֶּ֖לֶךְ סָבִֽיב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/011.yaml
  text: And the guards stood[a], each man with his weapons in his hand, from the right side of the house to the left side of the house, by the altar and by the house[c][b], around the king.
  footnotes:
  - marker: a
    text: Or 'the runners,' that is, the royal guard.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the right side of the house to the left side of the house'; this may also be understood in temple orientation as 'from the south side ... to the north side.'
    reason: alternative_reading
  - marker: c
    text: '''The house'' here refers to the temple building/precinct.'
    reason: cultural_note
translation:
  language: ko
  text: 경호병들은 각자 손에 무기를 들고, 집의 오른쪽에서 왼쪽까지, 제단 곁과 집 곁에, 왕을 둘러서 섰습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘경주하는 자들’은 여기서 왕의 호위병을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘집의 오른쪽에서 왼쪽까지’입니다. 성전 배치 관점에서는 ‘남쪽에서 북쪽까지’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 여기서 ‘집’은 성전 건물/구역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָרָצִים
  english_pob_choice: the guards
  chosen_korean: 경호병들
  alternatives_korean:
  - 경비병들
  - 달리는 자들
  - 왕의 호위병들
  lexicon: HALOT
  rationale: 이 문맥에서는 문자적 의미인 ‘달리는 자들’보다 왕을 보호하는 무장 호위의 기능이 분명하므로, 현대 한국어에서 자연스럽고 구체적인 ‘경호병들’로 옮겼습니다.
- source_word: אִישׁ וְכֵלָיו בְּיָדוֹ
  english_pob_choice: each man with his weapons in his hand
  chosen_korean: 각자 손에 무기를 들고
  alternatives_korean:
  - 각 사람마다 손에 무기를 들고
  - 각자 손에 그의 장비를 들고
  lexicon: HALOT
  rationale: אִישׁ의 분배적 의미를 ‘각자’로 살리고, כְּלִי를 군사적 문맥에 맞게 ‘무기’로 구체화하여 준비된 상태를 분명히 드러냈습니다.
- source_word: מִכֶּתֶף ... עַד כֶּתֶף
  english_pob_choice: from the right side ... to the left side
  chosen_korean: 집의 오른쪽에서 왼쪽까지
  alternatives_korean:
  - 집의 오른편에서 왼편까지
  - 집의 남쪽에서 북쪽까지
  lexicon: HALOT
  rationale: כֶּתֶף의 공간적 용법을 한국어의 ‘오른쪽/왼쪽’으로 자연스럽게 반영했고, 주석에서 남쪽/북쪽의 가능성은 따로 보존했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 집
  alternatives_korean:
  - 성전
  - 전각
  lexicon: HALOT
  rationale: 본문은 문자적으로 ‘집’이라고 하므로 기본 본문은 이를 유지하되, 독자가 문맥상 성전 공간임을 이해할 수 있게 했습니다.
theological_decisions:
- issue: 하이픈된 공간 표지와 제단/집의 배치가 성전 경호 배치를 어떻게 드러내는가
  chosen_reading: 본문의 핵심은 왕을 중심으로 한 경호의 포위 배치이며, ‘제단 곁과 집 곁에’로 옮겨 성전 공간 안에서의 엄중한 호위를 드러냈습니다.
  alternative_readings:
  - ‘제단과 집을 향하여’
  - ‘제단과 집에’
  rationale: ל의 위치/방향 용법이 압축되어 있으므로, 단정적인 방향어보다 자리 배치를 드러내는 표현이 원문의 긴장감을 더 잘 살립니다.
  doctrine_reference: 왕권 보호와 성전 질서의 서술
