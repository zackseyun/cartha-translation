id: 2KI.11.18
reference: 2 Kings 11:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ כָל עַם֩ הָ/אָ֨רֶץ בֵּית הַ/בַּ֜עַל וַֽ/יִּתְּצֻ֗/הוּ אֶת מזבחת/ו וְ/אֶת צְלָמָי/ו֙ שִׁבְּר֣וּ הֵיטֵ֔ב וְ/אֵ֗ת מַתָּן֙ כֹּהֵ֣ן הַ/בַּ֔עַל הָרְג֖וּ לִ/פְנֵ֣י הַֽ/מִּזְבְּח֑וֹת וַ/יָּ֧שֶׂם הַ/כֹּהֵ֛ן פְּקֻדּ֖וֹת עַל בֵּ֥ית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/018.yaml
  text: Then all the people of the land went into the house of Baal and tore it down[a]. They thoroughly smashed his altars and his images, and they killed Mattan the priest of Baal before the altars[c][b]. Then the priest appointed overseers over the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the temple of Baal.' The Hebrew reads 'house of Baal.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his idols' or 'his statues' for 'his images.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the LORD' represents the divine name YHWH.
    reason: alternative_reading
translation:
  language: ko
  text: 그 땅의 모든 백성이 바알의 집에 들어가 그것을 허물고[a], 그의 제단들을 철저히 부수고 그의 우상들을[ [b]] 잘게 깨뜨렸습니다. 그리고 바알의 제사장 맛단을 제단들 앞에서 죽였습니다. 그다음 제사장은 여호와의 집에 감독들을 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바알의 성전’. 히브리어는 직역하면 ‘바알의 집’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그의 형상들’, ‘그의 조각상들’.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָל עַם הָאָרֶץ
  english_pob_choice: all the people of the land
  chosen_korean: 그 땅의 모든 백성
  alternatives_korean:
  - 그 땅의 모든 사람들
  - 그 땅의 모든 백성들
  - 그 땅의 모든 주민
  lexicon: HALOT
  rationale: ‘people of the land’의 정치·사회적 관용구를 살리되, 한국어에서는 자연스럽게 ‘백성’으로 옮겨 집단 전체의 의미를 유지했습니다.
- source_word: בֵּית הַבַּעַל
  english_pob_choice: the house of Baal
  chosen_korean: 바알의 집
  alternatives_korean:
  - 바알의 성전
  - 바알의 신전
  lexicon: HALOT
  rationale: 히브리어의 ‘집’(בֵּית)을 그대로 살려 POB의 직역성을 유지했고, 종교시설임은 문맥이 분명하므로 별도 설명 없이 이해되도록 했습니다.
- source_word: וַיִּתְּצֻהוּ
  english_pob_choice: tore it down
  chosen_korean: 허물고
  alternatives_korean:
  - 무너뜨리고
  - 헐어버리고
  - 뜨러내고
  lexicon: HALOT
  rationale: 건물을 파괴해 해체하는 동사를 한국어의 자연스러운 동작 표현인 ‘허물다’로 옮겼습니다.
- source_word: צְלָמָיו
  english_pob_choice: his images
  chosen_korean: 그의 우상들
  alternatives_korean:
  - 그의 형상들
  - 그의 조각상들
  - 그의 이미지들
  lexicon: HALOT
  rationale: 문맥상 바알 숭배 대상을 가리키므로, 단순한 ‘형상’보다 우상숭배의 성격을 드러내는 ‘우상들’이 더 적절합니다.
- source_word: שִׁבְּר֣וּ הֵיטֵ֔ב
  english_pob_choice: thoroughly smashed
  chosen_korean: 철저히 부수고
  alternatives_korean:
  - 완전히 부수고
  - 산산이 부수고
  - 철저하게 깨뜨리고
  lexicon: HALOT
  rationale: 강조 부사 הֵיטֵב의 강도를 살려 ‘철저히’로 옮겼고, 제단 파괴의 폭력성과 완결성을 보존했습니다.
- source_word: פְּקֻדּוֹת
  english_pob_choice: overseers
  chosen_korean: 감독들
  alternatives_korean:
  - 책임자들
  - 관리자들
  - 감찰자들
  lexicon: HALOT
  rationale: 행정적·관리적 감시 역할을 나타내는 뜻으로 보고, 한국어 성경용어로 널리 통용되는 ‘감독’이 가장 간결하게 기능을 전달합니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 여호와의 성전
  lexicon: HALOT
  rationale: 본문과 영어 POB는 יְהוָה를 가리키지만, 현재 프로젝트의 표준 용례에 따라 고유명사 표기는 ‘여호와’로 두고 ‘집’을 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절은 베타적 대조(바알의 집 vs. 여호와의 집)를 이루므로, 본문 기능을 유지하는 고정된 한국어 신명 표기를 사용했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼 (source-grounded note for audit; current Korean draft follows established Bible-style rendering in this verse context).'
