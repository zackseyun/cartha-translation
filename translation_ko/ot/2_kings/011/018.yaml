  source_fidelity: 히브리어의 사건 순서와 핵심 의미는 대체로 반영되어 있습니다. 그러나 צְלָמָיו는 넓게 ‘형상들/상들’을 뜻하므로 ‘우상들’은 다소 해석적입니다. 또한 שִׁבְּרוּ הֵיטֵב는 ‘그의 제단들과 그의 형상들’ 모두에 걸리는 하나의 강화된 파괴 동작이므로 이를 한국어에서도 함께 묶어 표현하는 편이 충실합니다. יְהוָה는 프로젝트의 source-grounded 표기에 맞추어 ‘야훼’로 통일했습니다.
  naturalness: 합쇼체 문장으로 자연스럽게 다듬었으며, 원문의 병렬 목적어 구조를 ‘제단들과 형상들을 철저히 부수고’로 명료하게 반영했습니다. 기존의 잘못된 각주 표기 ‘[[b]]’도 정상 앵커로 바로잡았습니다.
  terminology: ‘바알의 집’과 ‘야훼의 집’은 בית의 반복과 대조를 보존합니다. ‘형상들’은 צְלָמָיו에 대한 비해석적 번역이며, ‘감독자들’은 פְּקֻדּוֹת의 관리·감독 기능을 전달하되 특정 교회 직분으로 읽힐 수 있는 ‘감독’보다 중립적입니다.
