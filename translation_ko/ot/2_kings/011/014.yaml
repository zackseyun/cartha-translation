base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/014.yaml
  text: And she looked, and behold, the king was standing by the pillar, according to the custom, with the officers and the trumpets beside the king, and all the people of the land were rejoicing and blowing trumpets. Then Athaliah tore her clothes and cried, “Conspiracy! Conspiracy!”
  footnotes:
  - marker: a
    text: Or “at the pillar.” The Hebrew preposition can be understood in more than one locative sense here.
    reason: lexical_alternative
  - marker: b
    text: Or “Treason! Treason!”
    reason: lexical_alternative
translation:
  language: ko
  text: 아달랴가 보니, 왕이 관례대로 기둥 곁에[a] 서 있었고, 관리들과 나팔들이 왕 곁에 있었으며, 그 땅의 모든 백성이 기뻐하고 나팔을 불고 있었습니다. 그러자 아달랴가 자기 옷을 찢고 외쳤습니다. 「음모다! 음모다!」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “기둥 위에.” 히브리어 전치사는 여기에서 위치 관계를 여러 방식으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “반역이다! 반역이다!”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא וְהִנֵּה
  english_pob_choice: And she looked, and behold
  chosen_korean: 그것을 보고 보니
  alternatives_korean:
  - 보고 보니
  - 그녀가 보니
  - 보고, 보니
  lexicon: BDB
  rationale: 히브리어의 अचानक한 장면 전환과 감탄성을 살리기 위해 ‘보고 보니’를 사용했고, 첫 동사와 הִנֵּה의 중첩 효과를 함께 드러냈습니다.
- source_word: עֹמֵד עַל הָעַמּוּד כַּמִּשְׁפָּט
  english_pob_choice: standing by the pillar, according to the custom
  chosen_korean: 규례대로 기둥 곁에 서 있었고
  alternatives_korean:
  - 기둥 곁에 서 있었고, 관례대로
  - 기둥에 서 있었고, 규례대로
  - 기둥 곁에 서 있었습니다
  lexicon: BDB
  rationale: עַל הָעַמּוּד는 이 문맥에서 단순한 ‘위에’보다 의례적 위치를 가리키므로 ‘기둥 곁에’로 옮기고, כַּמִּשְׁפָּט는 법적 ‘판결’이 아니라 궁중 의례의 ‘규례’로 옮겼습니다.
- source_word: וְהַשָּׂרִים וְהַחֲצֹצְרוֹת אֶל הַמֶּלֶךְ
  english_pob_choice: with the officers and the trumpets beside the king
  chosen_korean: 관리들과 나팔수들이 왕 곁에 있었으며
  alternatives_korean:
  - 관원들과 나팔수들이 왕 곁에 있었으며
  - 관리들과 나팔들이 왕 곁에 있었으며
  - 지휘관들과 나팔수들이 왕 곁에 있었으며
  lexicon: BDB
  rationale: 최종 개정이 지적한 대로 하시라의 ‘나팔들’이 아니라 사람을 가리키므로 ‘나팔수들’로 옮겼고, שָׂרִים은 이 궁정/군사 맥락에서 ‘관리들’이 과도한 계급 특정 없이 자연스럽습니다.
- source_word: וַתִּקְרַע עֲתַלְיָה אֶת בְּגָדֶיָה
  english_pob_choice: Then Athaliah tore her clothes
  chosen_korean: 아달랴가 자기 옷을 찢고
  alternatives_korean:
  - 아달랴가 옷을 찢고
  - 아달랴가 자기 의복을 찢고
  lexicon: BDB
  rationale: ‘옷’은 한국어로 가장 자연스럽고, 히브리어의 분노/경악/애도 제스처를 그대로 보존합니다.
- source_word: קֶשֶׁר קָשֶׁר
  english_pob_choice: Conspiracy! Conspiracy!
  chosen_korean: 반역이다! 반역이다!
  alternatives_korean:
  - 음모다! 음모다!
  - 반역이다!
  - 역모다! 역모다!
  lexicon: BDB
  rationale: 히브리어의 반복은 긴박한 고발/외침을 나타내며, 한국어에서는 통치 질서에 대한 공개적 고발로서 ‘반역’이 가장 직접적으로 대응합니다.
theological_decisions:
- issue: 아달랴의 외침 קֶשֶׁר의 번역 강도
  chosen_reading: ‘반역이다! 반역이다!’로 옮겨, 단순한 정치적 ‘음모’보다 왕권에 대한 공개적 도전으로 들리게 했습니다.
  alternative_readings:
  - 음모다! 음모다!
  - 역모다! 역모다!
  rationale: 이 장면은 왕위 찬탈이 무너지는 순간에 대한 절규이므로, 한국어 독자가 체감하는 역사적·정치적 긴장을 살리는 번역이 적절합니다.
  doctrine_reference: 서사적 본문 번역 원칙
