source:
  edition: WLC
  text: וַ/תִּשְׁמַ֣ע עֲתַלְיָ֔ה אֶת ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם וַ/תָּבֹ֥א אֶל הָ/עָ֖ם בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/013.yaml
  text: When Athaliah heard the noise of the guards and of the people[c][b][a], she came to the people in the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'the runners,' likely referring to the royal guard or bodyguard corps.
    reason: lexical_alternative
  - marker: b
    text: Or 'the sound' or 'the voice' of the guards and the people.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the house of the LORD'; that is, the temple precincts.
    reason: lexical_alternative
translation:
  language: ko
  text: 아달랴가 경호병들과 백성의 소리를 듣고, 여호와의 집의 백성에게 나아왔습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘경호병들’—히브리어는 직역하면 ‘달리는 자들’이지만, 왕실 경호대나 시종대일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘소리’ 또는 ‘외침’입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 ‘여호와의 집’, 곧 성전 구역을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּשְׁמַע
  english_pob_choice: heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들었고
  - 귀에 들었습니다
  lexicon: WLC / HALOT
  rationale: 문맥상 단순한 청각 인지를 나타내므로 ‘들었습니다’가 가장 자연스럽고 원문에 가깝습니다.
- source_word: ק֥וֹל הָֽ/רָצִ֖ין הָ/עָ֑ם
  english_pob_choice: the noise of the guards and of the people
  chosen_korean: 경호병들과 백성의 소리
  alternatives_korean:
  - 경호병들과 백성의 소란
  - 경호병들과 백성의 외침
  lexicon: WLC / HALOT
  rationale: קוֹל은 ‘소리/외침/소음’의 범위를 가지며, כאן에서는 두 집단이 만들어 내는 공적 소란을 가리키므로 ‘소리’로 두고, הָרָצִין은 왕실 경호 기능을 살려 ‘경호병들’로 옮겼습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 야훼의 집
  - 성전
  lexicon: WLC / DOCTRINE.md contended terms
  rationale: 본문의 관용구를 직역해 ‘여호와의 집’으로 옮겨, 장소명에 더해 여호와의 이름이 드러나도록 했습니다.
theological_decisions:
- issue: 야훼/여호와 표기
  chosen_reading: 이 절에서는 한국 교회 독자에게 즉시 인지되는 표준형 ‘여호와’를 사용했습니다.
  alternative_readings:
  - 야훼
  rationale: 원문은 יְהוָה를 직접 포함하지만, 한국어 공개 초안의 가독성과 기존 POB 용례를 고려해 본문에는 ‘여호와’를 두고, 필요 시 주석에서 표기 논의를 보완하는 편이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH'
