source:
  edition: WLC
  text: וַ/יִּקַּ֣ח אֶת שָׂרֵ֣י הַ֠/מֵּאוֹת וְ/אֶת הַ/כָּרִ֨י וְ/אֶת הָ/רָצִ֜ים וְ/אֵ֣ת כָּל עַ֣ם הָ/אָ֗רֶץ וַ/יֹּרִ֤ידוּ אֶת הַ/מֶּ֨לֶךְ֙ מִ/בֵּ֣ית יְהוָ֔ה וַ/יָּב֛וֹאוּ דֶּֽרֶך שַׁ֥עַר הָ/רָצִ֖ים בֵּ֣ית הַ/מֶּ֑לֶךְ וַ/יֵּ֖שֶׁב עַל כִּסֵּ֥א הַ/מְּלָכִֽים־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/019.yaml
  text: Then he took the commanders of hundreds[a], the Carites, the runners, and all the people of the land, and they brought the king down from the house of Yahweh and came by way of the gate of the runners to the king’s house[b], and he sat on the throne of the kings.
  footnotes:
  - marker: a
    text: Or 'the Cherethites' or 'the bodyguard' for 'the Carites.' The Hebrew term is uncertain.
    reason: alternative_reading
  - marker: b
    text: '''The runners'' likely refers to royal guards or couriers; also in ''the gate of the runners.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 백부장들과 카리인들[a]과 달리는 자들[b]과 그 땅의 모든 백성을 데리고, 그들은 왕을 야훼의 집에서 내려오게 하였습니다. 그들은 달리는 자들의 문을 거쳐 왕의 집에 이르렀으며, 왕은 왕들의 왕좌에 앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘카리인들’은 히브리어 용어의 음역이며, 전통적으로는 ‘그렛 사람들’ 또는 ‘호위병들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘달리는 자들’은 왕실 경호병 또는 전령을 가리킬 가능성이 있습니다. 이는 ‘달리는 자들의 문’에도 적용됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי הַמֵּאוֹת
  english_pob_choice: the commanders of hundreds
  chosen_korean: 백부장들
  alternatives_korean:
  - 백 명의 지휘관들
  - 백인대장들
  lexicon: HALOT
  rationale: 군사 단위를 살리면서도 한국어에서 자연스러운 직함으로 옮겼습니다. '백부장'은 구조를 간결하게 드러냅니다.
- source_word: הַכָּרִי
  english_pob_choice: the Carites
  chosen_korean: 카리인들
  alternatives_korean:
  - 그렛 사람들
  - 호위병들
  lexicon: HALOT
  rationale: 히브리어 형태를 보존해 불확실한 용어임을 드러냈습니다. 본문 주석에서 전통 번역 가능성은 따로 열어 둘 수 있습니다.
- source_word: הָרָצִים
  english_pob_choice: the runners
  chosen_korean: 달리는 자들
  alternatives_korean:
  - 달리기병들
  - 전령들
  - 경호병들
  lexicon: HALOT
  rationale: 직역 이미지를 살려 본문에는 '달리는 자들'로 두었습니다. 기능적 의미는 문맥상 가능하지만, 본문은 히브리어의 구체적 표현을 유지하는 편이 더 투명합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 언약명은 관례적 대체어보다 고유명으로 옮기는 것이 원문과 공시적 대응이 가장 분명합니다.
- source_word: כִּסֵּא הַמְּלָכִים
  english_pob_choice: the throne of the kings
  chosen_korean: 왕들의 왕좌
  alternatives_korean:
  - 왕들의 보좌
  - 왕실의 왕좌
  - 왕의 왕좌
  lexicon: HALOT
  rationale: 복수형 '왕들의'를 평준화하지 않고 살려 다윗 왕조의 계승 왕좌라는 히브리어의 결을 유지했습니다. '왕좌'는 현대어에서 자연스럽고 위엄을 담습니다.
theological_decisions:
- issue: 예배 공간에서의 이동 방향 표현
  chosen_reading: '''야훼의 집에서 내려오게 하였다''로 옮겨, 성전 구역에서 왕의 집으로 이동하는 하강 방향을 분명히 했습니다.'
  alternative_readings:
  - '''야훼의 집에서 데려왔다'''
  - '''성전에서 인도해 내렸다'''
  rationale: 원문 ירד의 방향성은 단순한 '데려옴'보다 '내려옴'이 더 직접적으로 드러냅니다. 이 장면은 즉위의 공적 성격을 강화합니다.
  doctrine_reference: 본문 서사와 왕권 즉위의 공적 이전
- issue: 왕좌의 복수형 의미
  chosen_reading: '''왕들의 왕좌''를 유지해 단순한 일반 명사화보다 왕조적 연속성을 드러냈습니다.'
  alternative_readings:
  - '''왕실의 왕좌'''
  - '''왕의 보좌'''
  rationale: 히브리어 복수형을 단순한 수사로만 처리하면 본문의 왕조적 뉘앙스가 약해집니다. 따라서 계승 구조를 살리는 표현을 택했습니다.
  doctrine_reference: 다윗 왕조의 정통성 및 계승
