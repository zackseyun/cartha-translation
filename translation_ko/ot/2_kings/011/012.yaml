id: 2KI.11.12
reference: 2 Kings 11:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יּוֹצִ֣א אֶת בֶּן הַ/מֶּ֗לֶךְ וַ/יִּתֵּ֤ן עָלָי/ו֙ אֶת הַ/נֵּ֨זֶר֙ וְ/אֶת הָ֣/עֵד֔וּת וַ/יַּמְלִ֥כוּ אֹת֖/וֹ וַ/יִּמְשָׁחֻ֑/הוּ וַ/יַּכּוּ כָ֔ף וַ/יֹּאמְר֖וּ יְחִ֥י הַ/מֶּֽלֶךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/011/012.yaml
  text: Then he brought out the king’s son and put the crown on him and gave him the testimony[a], and they made him king and anointed him; and they clapped their hands and said, “Long live the king!”
  footnotes:
  - marker: a
    text: Or 'the covenant document' or 'the decree'; the Hebrew reads 'the testimony,' likely referring to a written witness associated with the king’s rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 왕의 아들을 데리고 나와 그 위에 왕관을 씌우고 증거문서[a]를 주었습니다. 그들이 그를 왕으로 세우고 기름을 부었으며, 손뼉을 치며 “왕 만세!”라고 외쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘언약 문서’, ‘법령’; 히브리어는 문자적으로 ‘증거’이며, 왕의 통치와 관련된 기록된 증언을 가리키는 듯합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  english_pob_choice: brought out
  chosen_korean: 데리고 나와
  alternatives_korean:
  - 이끌어 내고
  - 데려다가
  lexicon: HALOT
  rationale: 히필형 יצא의 사역적 의미를 자연스럽게 살려, 단순히 ‘나오다’가 아니라 ‘데리고 나와’로 옮겼습니다.
- source_word: הַנֵּזֶר
  english_pob_choice: the crown
  chosen_korean: 왕관
  alternatives_korean:
  - 관
  - 다이아뎀
  lexicon: HALOT
  rationale: 왕권의 표지를 가리키는 말로서 현대 한국어에서는 ‘왕관’이 가장 분명하고 자연스럽습니다.
- source_word: הָעֵדוּת
  english_pob_choice: the testimony
  chosen_korean: 증거문서[a]
  alternatives_korean:
  - 증거
  - 증언
  - 언약 문서
  lexicon: HALOT
  rationale: 문맥상 왕의 통치와 관련된 लिख문서일 가능성이 있으나, 히브리어 자체는 넓게 ‘증거/증언’을 뜻하므로 본문은 의미를 넓게 유지하되 각주로 대안을 제시했습니다.
- source_word: וַיַּמְלִכוּ אֹתוֹ
  english_pob_choice: they made him king
  chosen_korean: 그를 왕으로 세우고
  alternatives_korean:
  - 그를 왕으로 삼고
  - 그를 왕으로 선포하고
  lexicon: HALOT
  rationale: מלך의 사역형을 한국어 관용 표현으로 살려, 단순 선언보다 즉위의 행위를 드러내는 ‘왕으로 세우다’를 택했습니다.
- source_word: וַיִּמְשָׁחֻהוּ
  english_pob_choice: anointed him
  chosen_korean: 기름을 부었으며
  alternatives_korean:
  - 기름부음을 하였으며
  - 그에게 기름을 부었으며
  lexicon: HALOT
  rationale: 왕의 취임 의식을 가리키는 표준 표현을 유지했습니다.
- source_word: וַיַּכּוּ כָף
  english_pob_choice: they clapped their hands
  chosen_korean: 손뼉을 치며
  alternatives_korean:
  - 손을 치며
  - 박수치며
  lexicon: HALOT
  rationale: 히브리 관용구를 한국어의 자연스러운 공적 환호로 옮겼습니다.
theological_decisions:
- issue: הָעֵדוּת의 의미를 얼마나 구체화할지
  chosen_reading: 본문에는 넓게 ‘증거문서’로 두고, 해석 가능성을 각주로 남겼습니다.
  alternative_readings:
  - 언약 문서
  - 법령
  - 증언
  rationale: 열왕기상/열왕기하의 즉위 문맥에서 문서적 성격이 암시되지만, 본문이 특정 명칭을 확정하지 않으므로 과도한 제도화 없이 원문의 긴장을 보존했습니다.
  doctrine_reference: '번역 원칙: 원문 근접성, 해석 과잉 회피'
