  yaml_path: translation/ot/2_kings/011/003.yaml
  text: And he was with her in the house of the LORD, hiding for six years, while Athaliah was reigning over the land.
translation:
  language: ko
  text: 그는 그녀와 함께 여호와의 집에 숨어 지냈습니다. 여섯 해 동안 아달랴는 그 땅을 다스리고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of the LORD
  chosen_korean: 여호와의 집
  alternatives_korean:
  - 주님의 집
  - 야훼의 집
  lexicon: יהוה
  rationale: 히브리어 원문이 יְהוָה를 직접 사용하므로, 본문 차원에서는 표준 프로젝트 기본값인 ‘여호와’로 옮겨 신명성을 분명히 했습니다. 영어 POB의 LORD는 이를 관용적으로 가린 표기이므로, 한국어에서는 원문 가시성을 우선했습니다.
- source_word: מִתְחַבֵּא
  english_pob_choice: hiding
  chosen_korean: 숨어 있었습니다
  alternatives_korean:
  - 숨고 있었습니다
  - 숨은 채 있었습니다
  lexicon: חבא
  rationale: 진행적 동작과 은밀한 상태를 함께 나타내므로, 단순한 완료형보다 ‘숨어 있었습니다’가 문맥에 더 가깝습니다.
- source_word: וַעֲתַלְיָה מֹלֶכֶת
  english_pob_choice: while Athaliah was reigning
  chosen_korean: 아달랴가 ... 다스리는 동안
  alternatives_korean:
  - 아달랴가 ... 통치하는 동안
  - 아달랴가 ... 왕 노릇하는 동안
  lexicon: מלך
  rationale: מֹלֶכֶת는 여성형 현재분사로 지속적 통치를 나타내므로, 자연스러운 서술인 ‘다스리는 동안’으로 옮겼습니다.
theological_decisions:
- issue: YHWH 표기 선택
  chosen_reading: 원문의 יְהוָה를 한국어 본문에서 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 절은 구약 히브리어 원문 직역 문맥이므로, 프로젝트 기본값인 학술 음역 ‘야훼’와 함께 검토될 수 있으나, 본문 가독성과 한국어 교회권 수용성을 고려해 ‘여호와’를 채택했습니다.
  doctrine_reference: 구약 신명성 표기 정책
- issue: ‘그녀와 함께’의 지시 대상
  chosen_reading: 히브리어 אִתָּהּ의 여성 대명사에 따라 ‘그녀와 함께’로 옮겼습니다.
  alternative_readings:
  - 그와 함께
  - 그 아이와 함께
  rationale: 문맥상 여호사브앗(여성)과의 동거를 가리키므로, 대명사 성별을 보존해야 합니다.
  doctrine_reference: 문맥 지시대상 보존 원칙
