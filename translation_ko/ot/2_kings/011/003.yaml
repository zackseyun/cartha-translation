revisions:
- from: 그는 여호와의 집에서 그녀와 함께 있으면서, 아달랴가 그 땅을 다스리는 동안 여섯 해 동안 숨어 있었습니다.[a]
  to: 그는 그녀와 함께 여호와의 집에 숨어 지냈습니다. 여섯 해 동안 아달랴는 그 땅을 다스리고 있었습니다.
  rationale: ‘그녀와 함께’는 אִתָּהּ의 여성 지시 대상을 보존했습니다. ‘숨어 지냈습니다’는 מִתְחַבֵּא의 은신 상태가 여섯 해 동안 지속되었음을 자연스럽게 나타내며, ‘다스리고 있었습니다’는 מֹלֶכֶת의 지속성을 반영합니다. 불필요한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:54Z'
