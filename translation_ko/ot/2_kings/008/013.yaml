  rationale: 본 절은 하나님의 이름을 직접 사용하므로, 프로젝트 기본 방침에 따라 언약명 자체를 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
