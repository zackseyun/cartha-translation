  text: וַ/יֹּ֣אמֶר חֲזָהאֵ֔ל כִּ֣י מָ֤ה עַבְדְּ/ךָ֙ הַ/כֶּ֔לֶב כִּ֣י יַעֲשֶׂ֔ה הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה וַ/יֹּ֣אמֶר אֱלִישָׁ֔ע הִרְאַ֧/נִי יְהוָ֛ה אֹתְ/ךָ֖ מֶ֥לֶךְ עַל אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/013.yaml
  text: Hazael said[a], “But what is your servant, this dog, that he should do this great thing?” And Elisha said, “Yahweh has shown me that you will be king over Aram.”
  footnotes:
  - marker: a
    text: Or 'king of Aram'; Hebrew literally 'king over Aram.'
    reason: lexical_alternative
translation:
  language: ko
  text: 하사엘이 말했습니다. 「그런데 제가 누구이기에, 이 개 같은 종이 이 큰 일을 하겠습니까?」 그러자 엘리사가 말했습니다. 「야훼께서 당신이 아람의 왕이 될 것을 제게 보여 주셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아람의 왕’. 히브리어는 문자적으로 ‘아람 위의 왕’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מָה
  english_pob_choice: But what
  chosen_korean: 그런데 제가 누구이기에
  alternatives_korean:
  - 하지만 제가 무엇이기에
  - 그런데 무슨 일이기에
  lexicon: HALOT
  rationale: 하사엘의 반문은 단순 정보 질문이 아니라 강한 겸손과 부정의 뉘앙스를 띠므로, 한국어에서는 ‘그런데 제가 누구이기에’로 자연스럽게 그 항변성을 살렸습니다.
- source_word: עַבְדְּךָ
  english_pob_choice: your servant
  chosen_korean: 종
  alternatives_korean:
  - 당신의 종
  - 당신의 종인 저
  lexicon: HALOT
  rationale: 직접적인 자기비하 표현으로서 ‘종’이 소속과 낮춤을 분명히 드러냅니다. ‘당신의 종’은 의미는 맞지만 문맥상 하사엘의 자조적 표현을 다소 완화합니다.
- source_word: הַכֶּלֶב
  english_pob_choice: this dog
  chosen_korean: 개 같은
  alternatives_korean:
  - 이 개
  - 이런 개
  lexicon: HALOT
  rationale: 히브리어의 정관사와 자조적 모욕감을 한국어에서 그대로 살리기 위해 ‘개 같은’으로 옮겨, 단순 지시보다 비하의 강도를 드러냈습니다.
- source_word: מֶלֶךְ עַל אֲרָם
  english_pob_choice: king over Aram
  chosen_korean: 아람의 왕
  alternatives_korean:
  - 아람 위에 있는 왕
  - 아람을 다스릴 왕
  lexicon: HALOT
  rationale: 직역하면 ‘아람 위에 왕’이지만 한국어에서는 왕권 표현으로 ‘아람의 왕’이 가장 자연스럽습니다. 본문 주석에서 영어 POB의 ‘king over Aram’과 히브리어 עַל의 직접성을 보완할 수 있습니다.
theological_decisions:
- issue: 야훼의 고유명 표기
  chosen_reading: ‘יְהוָה’는 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 하나님의 이름을 직접 사용하므로, 프로젝트 기본 방침에 따라 언약명 자체를 보존하는 ‘야훼’를 채택했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
