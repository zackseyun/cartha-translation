  to: 하사엘이 말했습니다. “그러나 당신의 종인 이 개가 무엇이기에 이 큰 일을 하겠습니까?” 그러자 엘리사가 말했습니다. “야훼께서 당신이 아람을 다스릴 왕이 될 것을 제게 보여 주셨습니다.”[a]
  rationale: 하사엘의 반문을 자연스러운 합쇼체로 다듬되, ‘당신의 종’과 ‘이 개’의 동격적 자기비하를 보존했습니다. ‘아람을 다스릴 왕’은 מֶלֶךְ עַל אֲרָם의 통치 의미를 한국어로 자연스럽게 드러내며, 각주는 ‘아람의 왕’이라는 관용적 대안을 제공합니다.
