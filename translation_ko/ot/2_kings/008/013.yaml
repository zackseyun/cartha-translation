  source_fidelity: ‘이 개 같은 종’은 히브리어의 ‘당신의 종, 그 개’라는 자기비하적 동격 표현을 ‘개 같은 종’(dog-like servant)으로 바꾸어 의미 관계가 흐려집니다. 또한 ‘당신의 종’의 소유·신하 관계가 본문에서 빠졌습니다. ‘아람의 왕’ 자체는 자연스럽지만 עַל(‘~을 다스리는/위에’)의 직접성을 살릴 수 있습니다.
