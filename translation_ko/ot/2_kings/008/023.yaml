  source_fidelity: 본문의 ‘이제’는 히브리어 접속사 וְ에 과도하게 시간적 의미를 부여합니다. 또한 יוֹרָם은 본문에서 직접 옮기면 ‘요람’이며, ‘여호람’은 전통적 형태로 각주에서 처리하는 편이 원문 형태와 이름 식별을 모두 보존합니다.
  naturalness: ‘남은 행적’, ‘그가 한 모든 일’, ‘기록되어 있지 않습니까?’는 현대 표준 한국어 합쇼체에서 자연스럽고, 왕정 요약 공식의 문체에도 잘 맞습니다.
  terminology: ‘유다 왕들의 역대기’는 왕실 기록을 가리키는 관용적이고 이해 가능한 표현입니다. ‘역대기’가 정경의 책 제목으로 오해될 가능성은 각주의 ‘실록’ 대안으로 보완할 수 있습니다.
