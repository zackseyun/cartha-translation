  - severity: medium
    issue: 본문의 ‘여호람’과 이름 각주의 설명이 일치하지 않습니다.
    rationale: 원문 표기는 יוֹרָם(Yoram)이며, ‘여호람’은 보다 긴 전통적 이름 형태입니다. 본문은 ‘요람’으로 옮기고 ‘여호람’을 전통적 형태로 각주 처리해야 원문 충실성과 각주 기능이 일치합니다.
