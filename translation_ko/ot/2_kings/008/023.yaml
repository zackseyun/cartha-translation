  rationale: 히브리어 הֲלוֹא는 긍정 답변을 기대하는 수사 의문이므로, 한국어에서도 그 확인 요청의 힘을 유지하는 질문형이 가장 적절합니다.
  doctrine_reference: 서술형 종결로 약화시키지 않고 본문의 수사적 강조를 보존함
