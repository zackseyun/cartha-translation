translation:
  language: ko
  text: 이제 여호람의 남은 일과 그가 한 모든 일은 유다 왕들의 역대기에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יוֹרָם; 전통적으로는 ‘여호람’으로도 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 ...의 남은 일
  alternatives_korean:
  - 그리고 ...의 나머지
  - '...의 남은 사건들'
  lexicon: HALOT
  rationale: 예언자적·역사 서술의 왕정 결산 공식에서 וְ는 흐름 전환을 나타내므로, 한국어에서는 자연스러운 연결어 ‘이제’로 옮기고 יֶתֶר은 ‘남은 일’로 간결하게 살렸습니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 일
  alternatives_korean:
  - 행적
  - 사건
  - 말들
  lexicon: HALOT
  rationale: 직역하면 ‘말/일들’이지만, 이 공식에서는 왕의 기록된 행적 전체를 가리키므로 ‘일’이 가장 자연스럽고 본문이 요구하는 포괄성을 유지합니다.
- source_word: יוֹרָם
  english_pob_choice: Yoram
  chosen_korean: 여호람
  alternatives_korean:
  - 요람
  - 요람
  lexicon: BHS consonantal form / established Korean biblical form
  rationale: 히브리어 자음형은 יוֹרָם이지만, 한국어 성경 전승에서 이 왕은 통상 ‘여호람’으로 알려져 있어 식별성과 가독성을 위해 그 형태를 따랐습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 역대기
  alternatives_korean:
  - 유다 왕들의 연대기
  - 유다 왕들의 역대 연대기
  lexicon: HALOT
  rationale: 왕정 공식문서 제목에 해당하는 관용구이므로, דִּבְרֵי הַיָּמִים을 ‘역대기’로 옮겨 문서의 성격을 유지했고, לְמַלְכֵי יְהוּדָה는 ‘유다 왕들의’로 자연스럽게 연결했습니다.
theological_decisions:
