  text: At the end of seven years, the woman returned from the land of the Philistines, and she went out to appeal to the king for her house and for her field.
  footnotes:
  - marker: a
    text: Or 'to cry out to the king' or 'to plead with the king.'
    reason: lexical_alternative
translation:
  language: ko
  text: 칠 년이 끝날 무렵 그 여인은 블레셋 사람들의 땅에서 돌아와, 자기 집과 자기 밭을 돌려 달라고 왕에게 호소하러 나갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왕에게 외치다’나 ‘왕에게 탄원하다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה שֶׁבַע שָׁנִים
  english_pob_choice: At the end of seven years
  chosen_korean: 칠 년이 끝날 무렵
  alternatives_korean:
  - 칠 년 후에
  - 칠 년의 끝에
  lexicon: HALOT
  rationale: 시간 경과를 나타내는 관용구로, 직역의 어색함을 피하면서도 기간의 종료 시점을 분명히 살렸습니다.
- source_word: וַתָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아와
  - 돌아왔습니다
  lexicon: HALOT
  rationale: 서술 흐름상 자연스러운 동작을 살리되, 이전 체류지에서의 귀환이라는 의미를 유지했습니다.
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים
  english_pob_choice: from the land of the Philistines
  chosen_korean: 블레셋 사람들의 땅에서
  alternatives_korean:
  - 블레셋 땅에서
  - 블레셋에서
  lexicon: HALOT
  rationale: 히브리어의 직설적 표현을 따라 지리명보다 ‘사람들의 땅’이라는 소속 표현을 보존했습니다.
- source_word: לִצְעֹק אֶל הַמֶּלֶךְ
  english_pob_choice: to appeal to the king
  chosen_korean: 왕에게 호소하러
  alternatives_korean:
  - 왕에게 소리치러
  - 왕에게 외치러
  - 왕에게 탄원하러
  lexicon: HALOT
  rationale: צָעַק의 기본 뜻인 ‘외치다’와 법정·청원 맥락의 청유적 의미를 함께 살려, 한국어에서는 ‘호소하다’로 petition의 의미를 전달했습니다.
- source_word: בֵּיתָהּ וְאֶל שָׂדָהּ
  english_pob_choice: for her house and for her field
  chosen_korean: 자기 집과 자기 밭
  alternatives_korean:
  - 자기 집과 자기 들
  - 자기 집과 자기 토지
  lexicon: HALOT
  rationale: בַּיִת과 שָׂדֶה의 재산 회복 맥락을 따라 구체적인 소유물로 옮겼고, ‘밭’이 ‘field’의 가장 직접적인 한국어 대응입니다.
theological_decisions:
- issue: 청원 동사의 의미 범위
  chosen_reading: ‘호소하다’로 번역해 단순한 외침이 아니라 왕에게 재산 회복을 요청하는 청원 행위를 드러냈습니다.
  alternative_readings:
  - ‘외치다’로 더 문자적으로 옮김
  - ‘탄원하다’로 더 법정적 뉘앙스를 줌
  rationale: 히브리어 צָעַק은 기본적으로 ‘외치다’이지만, 왕을 상대로 한 재산 청구 문맥에서는 청원/호소의 의미가 핵심이므로 이를 전면에 두었습니다.
  doctrine_reference: 서사 문맥의 행위 의미 보존
