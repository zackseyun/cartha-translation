theological_decisions:
- issue: 청원 동사의 의미 범위
  chosen_reading: ‘호소하다’로 번역해 단순한 외침이 아니라 왕에게 재산 회복을 요청하는 청원 행위를 드러냈습니다.
  alternative_readings:
  - ‘외치다’로 더 문자적으로 옮김
  - ‘탄원하다’로 더 법정적 뉘앙스를 줌
  rationale: 히브리어 צָעַק은 기본적으로 ‘외치다’이지만, 왕을 상대로 한 재산 청구 문맥에서는 청원/호소의 의미가 핵심이므로 이를 전면에 두었습니다.
  doctrine_reference: 서사 문맥의 행위 의미 보존
