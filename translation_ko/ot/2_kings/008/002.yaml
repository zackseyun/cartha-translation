  text: 그 여인은 일어나 하나님의 사람의 말대로 행했습니다. 그리고 그녀는 자기 집안과 함께 떠나 블레셋 사람들의 땅에서 칠 년 동안 외국인 거류민으로 살았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 보다 전통적으로, ‘블레셋 사람들의 땅에서 칠 년 동안 머물렀습니다.’
