  text: וַ/יֵּ֜לֶךְ אֶת יוֹרָ֣ם בֶּן אַחְאָ֗ב לַ/מִּלְחָמָ֛ה עִם חֲזָהאֵ֥ל מֶֽלֶךְ אֲרָ֖ם בְּ/רָמֹ֣ת גִּלְעָ֑ד וַ/יַּכּ֥וּ אֲרַמִּ֖ים אֶת יוֹרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/028.yaml
  text: He went with Joram son of Ahab to war against Hazael king of Aram at Ramoth-gilead[b][a], and the Arameans wounded Joram.
  footnotes:
  - marker: a
    text: Or 'struck Joram.' The Hebrew verb can mean 'struck' more generally; 'wounded' is chosen because the battle context and the parallel account indicate injury rather than death.
    reason: lexical_alternative
  - marker: b
    text: Traditionally 'king of Syria' and 'the Syrians'; Hebrew has 'Aram' and 'Arameans.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아합의 아들 요람과 함께 아람 왕 하사엘에게 맞서 전쟁하러 길르앗 라못으로 갔습니다. 그런데 아람 사람들이 요람을 상하게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 ‘치다’의 더 넓은 뜻도 가질 수 있으나, 전투 문맥과 평행본문을 따라 여기서는 ‘상하게 하다’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 전통적 ‘시리아’가 아니라 ‘아람’과 ‘아람 사람들’을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ אֶת יוֹרָם
  english_pob_choice: He went with Joram
  chosen_korean: 그는 아합의 아들 요람과 함께
  alternatives_korean:
  - 그는 요람과 함께
  - 그는 요람과 더불어
  lexicon: HALOT
  rationale: הלך 뒤의 את는 동행을 나타내므로, 관계를 분명하게 풀어 ‘함께’로 옮겼습니다. 여기에 ‘아합의 아들’도 원문대로 살렸습니다.
- source_word: עִם חֲזָהאֵל מֶלֶךְ אֲרָם
  english_pob_choice: against Hazael king of Aram
  chosen_korean: 아람 왕 하사엘에게 맞서
  alternatives_korean:
  - 하사엘과
  - 하사엘을 향해
  lexicon: HALOT
  rationale: 전쟁 문맥에서 עִם은 단순한 ‘함께’가 아니라 대항 관계를 뜻하므로, 한국어에서는 ‘맞서’로 적절히 드러냈습니다.
- source_word: בְּרָמֹת גִּלְעָד
  english_pob_choice: at Ramoth-gilead
  chosen_korean: 길르앗 라못으로
  alternatives_korean:
  - 길르앗 라못에서
  - 길르앗 라못에
  lexicon: HALOT
  rationale: 전쟁하러 가는 이동을 함께 나타내기 위해 종착지 느낌의 ‘-으로’를 택했습니다. 지명은 원문 형태를 따라 ‘길르앗 라못’으로 옮겼습니다.
- source_word: וַיַּכּוּ אֲרַמִּים אֶת יוֹרָם
  english_pob_choice: and the Arameans wounded Joram
  chosen_korean: 아람 사람들이 요람을 상하게 했습니다
  alternatives_korean:
  - 아람 사람들이 요람을 쳤습니다
  - 아람 사람들이 요람에게 상처를 입혔습니다
  lexicon: HALOT
  rationale: נכה는 ‘치다/상하게 하다’의 넓은 의미를 가지며, 전투 맥락과 평행본문을 고려해 ‘상하게 했습니다’로 옮겼습니다. ‘아람 사람들’은 מקור의 אַרַמִּים을 투명하게 반영합니다.
theological_decisions:
- issue: אֲרָם의 번역
  chosen_reading: ‘아람’과 ‘아람 사람들’로 일관되게 옮겼습니다.
  alternative_readings:
  - 전통적 관용인 ‘시리아’와 ‘시리아 사람들’
  rationale: 원문은 지명/민족명으로 아람을 사용하므로, 전통적 교회 용어보다 원문 투명성을 우선했습니다.
  doctrine_reference: 번역 원문의 역사·지리 표지 보존 원칙
