base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/010.yaml
  text: And Elisha said to him[a], “Go, say to him, ‘You will certainly recover’; but Yahweh has shown me that he will certainly die.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'You shall surely not live.' The Hebrew text here is difficult; many understand the sense to be, 'You will certainly recover,' in contrast to the following revelation that he will in fact die.
    reason: alternative_reading
translation:
  language: ko
  text: 엘리사가 그에게 말했습니다. 「가서 그에게 이렇게 말하십시오. ‘왕께서는 반드시 나으실 것입니다[a].’ 그러나 야훼께서 그가 반드시 죽을 것임을 저에게 보여 주셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 문자적으로 옮기면 ‘당신은 반드시 살지 못할 것입니다’입니다. 이 히브리어 본문은 해석하기 어렵습니다. 많은 이들은 뒤따르는 계시, 곧 그가 실제로 죽으리라는 말씀과 대조하여, 이를 ‘당신은 반드시 회복될 것입니다’라는 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱלִישָׁע
  english_pob_choice: And Elisha said to him
  chosen_korean: 엘리사가 그에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그에게 말했습니다
  - 엘리사가 그에게 이르렀습니다
  lexicon: HALOT
  rationale: 주어 엘리사가 뒤에 명시되므로 한국어도 이름을 앞에 드러내어 서술을 분명하게 했습니다.
- source_word: לֵךְ אֱמָר
  english_pob_choice: Go, say to him
  chosen_korean: 가서 그에게 이렇게 말하십시오
  alternatives_korean:
  - 가서 그에게 말하십시오
  - 가서 그에게 전하십시오
  lexicon: HALOT
  rationale: 두 명령을 유지하되, אמר의 직접성을 살리기 위해 ‘말하십시오’를 택했습니다. उद्ध
- source_word: לא חָיֹה תִחְיֶה
  english_pob_choice: You will certainly recover
  chosen_korean: 당신은 반드시 회복될 것입니다
  alternatives_korean:
  - 당신은 반드시 살 것입니다
  - 당신은 반드시 살아날 것입니다
  lexicon: HALOT
  rationale: 본문의 문자형은 어렵지만 문맥상 병 회복을 전하는 말로 이해하는 해석을 반영했습니다. 한국어에서는 병세 회복의 의미가 자연스러워 ‘회복될 것입니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본값에 따라 신적 이름은 ‘야훼’로 표기했습니다.
theological_decisions:
- issue: לא חיה תחיה의 해석
  chosen_reading: 본문은 예언적 전달문 안에서 ‘반드시 회복될 것’이라는 보고로 번역하고, 문자적인 부정형의 난점을 본문 주석 없이 문맥 번역에 반영했습니다.
  alternative_readings:
  - ‘당신은 반드시 살지 못할 것입니다’
  - ‘당신은 반드시 살아 있을 것입니다’
  rationale: 이 구절은 바로 뒤의 죽음 선언과 대비되어 문맥상 회복 통보로 읽히는 것이 가장 자연스럽습니다. 한국어 본문은 의미를 우선하되, 본문 난점은 다른 절의 주석 처리 관행에 맞춰 별도 각주 없이 간결하게 처리했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
