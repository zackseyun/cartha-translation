base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/025.yaml
  text: In the twelfth year of Joram son of Ahab[a], king of Israel, Ahaziah son of Jehoram, king of Judah, became king.
  footnotes:
  - marker: a
    text: Hebrew has 'Joram' for the king of Israel and 'Jehoram' for the king of Judah; these are related name forms and are sometimes both rendered 'Joram' in English.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다의 왕 여호람의 아들 아하시야는, 이스라엘의 왕 아합의 아들 요람의 십이년에 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 이스라엘 왕에게는 요람 계열 이름형을, 유다 왕에게는 여호람 이름형을 사용합니다. 두 형태는 관련 이름형입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שְׁתֵּים עֶשְׂרֵה שָׁנָה
  english_pob_choice: In the twelfth year
  chosen_korean: 십이년에
  alternatives_korean:
