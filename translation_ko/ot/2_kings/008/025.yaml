  - 아합의 아들로
  lexicon: HALOT
  rationale: 표준적인 부자 관계 표지이므로 직역에 가깝게 ‘아합의 아들’로 유지했습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
