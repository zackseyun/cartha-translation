  lexicon: HALOT
  rationale: 이스라엘 왕 이름은 히브리어 יְהוֹרָם/יוֹרָם의 관련형인데, 본문이 가리키는 연대 기준 인물을 한국어 본문에서는 요람으로 옮겼습니다.
- source_word: בֶן אַחְאָב
  english_pob_choice: son of Ahab
  chosen_korean: 아합의 아들
  alternatives_korean:
