  - 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 히브리어 מלך의 즉위 공식을 현대 한국어로 분명하게 드러내되, 단순한 지속적 통치보다 즉위 개시를 나타내도록 했습니다.
theological_decisions:
- issue: 요람/여호람의 중복되는 관련 이름형 처리
  chosen_reading: 이스라엘 왕은 요람, 유다 왕의 아버지는 여호람으로 구분해 옮겼습니다.
  alternative_readings:
  - 두 이름을 모두 요람으로 통일
  - 두 이름을 모두 여호람으로 통일
  rationale: 히브리어 본문이 두 왕가의 관련 이름형을 구별해 사용하므로, 한국어에서도 독자가 인물 구분을 잃지 않도록 분리 표기했습니다.
  doctrine_reference: 본문 역사성 및 인명 식별
