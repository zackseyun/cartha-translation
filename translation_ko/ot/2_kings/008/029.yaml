  to: 그때 요람 왕은 아람 왕 하사엘과 싸울 때 라마에서 아람 사람들이 그에게 입힌 상처에서 회복하려고 이스르엘로 돌아왔습니다.[a] 유다 왕 여호람의 아들 아하시야는 요람이 병들어 있었기 때문에 이스르엘에 있는 아합의 아들 요람을 보러 내려갔습니다.[b]
