  text: וַ/יָּשָׁב֩ יוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בְ/יִזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֨ר יַכֻּ֤/הוּ אֲרַמִּים֙ בָּֽ/רָמָ֔ה בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָהאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/אֲחַזְיָ֨הוּ בֶן יְהוֹרָ֜ם מֶ֣לֶךְ יְהוּדָ֗ה יָרַ֡ד לִ/רְא֞וֹת אֶת יוֹרָ֧ם בֶּן אַחְאָ֛ב בְּ/יִזְרְעֶ֖אל כִּֽי חֹלֶ֥ה הֽוּא־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/029.yaml
  text: Then King Yoram returned to Jezreel to recover from the wounds that the Arameans had inflicted on him at Ramah when he fought against Hazael king of Aram[a]. And Ahaziah son of Jehoram, king of Judah, went down to see Yoram son of Ahab in Jezreel[c][b], because he was sick.
  footnotes:
  - marker: a
    text: Or 'to be healed' for 'to recover.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Arameans'; traditionally 'Syrians.'
    reason: lexical_alternative
  - marker: c
    text: Or 'to visit Yoram.' The Hebrew literally says 'to see Yoram.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요람 왕은 아람 사람들이 라마에서 그에게 입힌 상처에서 회복하려고 이스르엘로 돌아왔습니다. 그리고 유다의 왕 여호람의 아들 아하시야는 요람에게 보러 이스르엘로 내려갔는데, 그가 병들어 있었기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘아람 사람들’에 해당합니다. 전통적으로는 ‘시리아 사람들’로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘요람을 보다’입니다. 문맥상 병문안/방문을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아왔습니다
  alternatives_korean:
  - 되돌아왔습니다
  - 돌아갔습니다
  lexicon: HALOT
  rationale: 서술 흐름상 전장 이후 이스르엘로의 귀환을 뜻하므로, 자연스러운 현대 한국어로 ‘돌아왔습니다’가 가장 적절합니다.
- source_word: לְהִתְרַפֵּא
  english_pob_choice: to recover
  chosen_korean: 회복하려고
  alternatives_korean:
  - 낫기 위해
  - 치유받으려고
  lexicon: HALOT
  rationale: 히트파엘 형태가 의료적 회복의 과정을 나타내므로, 자가치유 뉘앙스를 피하면서도 문맥상 자연한 ‘회복하려고’를 택했습니다.
- source_word: מִן הַמַּכִּים אֲשֶׁר יַכֻּהוּ אֲרַמִּים
  english_pob_choice: from the wounds that the Arameans had inflicted on him
  chosen_korean: 아람 사람들이 … 입힌 상처
  alternatives_korean:
  - 아람 사람들이 … 준 상처
  - 아람 사람들이 … 가한 상처
  lexicon: HALOT
  rationale: 직역보다 한국어에서 자연한 피해 결과 표현인 ‘입힌 상처’로 옮기되, 원문의 폭력성과 가해 주체를 분명히 살렸습니다.
- source_word: לִרְאוֹת אֶת יוֹרָם
  english_pob_choice: to see Yoram
  chosen_korean: 요람에게 보러
  alternatives_korean:
  - 요람을 만나러
  - 요람을 보러
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘보다’이지만 병문안/방문 맥락이므로, 너무 완곡하지 않게 ‘보러’로 유지했습니다.
- source_word: כִּי חֹלֶה הוּא
  english_pob_choice: because he was sick
  chosen_korean: 그가 병들어 있었기 때문입니다
  alternatives_korean:
  - 그가 아팠기 때문입니다
  - 그가 병이 있었기 때문입니다
  lexicon: HALOT
  rationale: 원문은 현재 상태를 말하므로 ‘병들어 있었습니다’가 질병 상태를 가장 직접적으로 반영합니다.
theological_decisions:
- issue: 아람 사람들(Arameans) vs. 전통적 ‘시리아 사람들’
  chosen_reading: ‘아람 사람들’로 옮겼습니다.
  alternative_readings:
  - 시리아 사람들
  - 아람인들
  rationale: 히브리어 אֲרַמִּים를 직접 반영해 고대 민족·정치적 맥락을 분명히 드러내기 위해서입니다.
  doctrine_reference: 역사서 본문 고유명사 처리 원칙
