  lexicon: HALOT
  rationale: 본문의 직역을 유지하되, 영어 주석처럼 혈통을 넓게 가리킬 가능성은 주석에서 처리했습니다.
theological_decisions:
- issue: “오므리의 딸”의 친자 관계 여부
  chosen_reading: 본문에는 직역하여 “오므리의 딸”로 두고, 혈통적/왕조적 의미일 가능성은 각주로 열어 두었습니다.
  alternative_readings:
  - 오므리의 후손
  - 오므리 가문의 여자
  rationale: 히브리어 kinship 용어는 즉시적 딸뿐 아니라 계통 구성원을 가리킬 수 있으므로, 본문은 원문에 가깝게 두고 해석 가능성은 주석으로 보존하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §3, §5
