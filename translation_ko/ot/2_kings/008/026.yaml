base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/026.yaml
  text: Ahaziah was twenty-two years old when he became king[a], and he reigned one year in Jerusalem. His mother's name was Athaliah, the daughter of Omri king of Israel.
  footnotes:
  - marker: a
    text: Or 'descendant of Omri.' Hebrew 'daughter' can sometimes denote a female descendant or member of a dynasty rather than an immediate daughter.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하시야는 왕이 되었을 때 스물두 살이었고, 예루살렘에서 한 해 동안 다스렸습니다. 그의 어머니의 이름은 아달랴이며, 이스라엘 왕 오므리의 딸이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘딸’은 여기서 오므리의 직계 딸이 아니라 오므리 계통의 후손을 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  english_pob_choice: was twenty-two years old
  chosen_korean: 스물두 살이었고
  alternatives_korean:
