  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
  footnotes:
  - marker: a
    text: Or, 'until Hazael was ashamed.' The Hebrew leaves the subject of 'was ashamed' less explicit than English normally prefers.
