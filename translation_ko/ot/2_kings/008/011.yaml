  rationale: 히브리어는 문자적으로 ‘얼굴을 세우다/고정하다’에 가까우므로, 한국어에서는 자연스럽게 ‘얼굴을 고정하고’로 옮겨 원문 이미지를 살렸습니다.
- source_word: וַיָּשֶׂם
  english_pob_choice: stared
  chosen_korean: 똑바로 바라보았고
  alternatives_korean:
