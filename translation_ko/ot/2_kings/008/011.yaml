  - 주시했고
  lexicon: HALOT
  rationale: 앞절의 고정된 자세를 이어가는 동사로 보아, 단순한 ‘보다’보다 강한 지속적 시선을 나타내는 표현으로 옮겼습니다.
- source_word: עַד בֹּשׁ
  english_pob_choice: until he was ashamed
  chosen_korean: 부끄러워할 때까지
  alternatives_korean:
  - 수치스러워할 때까지
  - 당황할 때까지
  - 부끄러움을 느낄 때까지
  lexicon: HALOT
  rationale: בוש의 기본 의미를 살리되, 한국어에서 가장 자연스러운 감정 표현인 ‘부끄러워하다’를 택했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 선지자
  - 하나님의 사람
  lexicon: HALOT
  rationale: 이 표제는 예언자 엘리사를 가리키는 원문 표현이므로, 관용적이면서도 직역에 가까운 ‘하나님의 사람’을 유지했습니다.
theological_decisions:
- issue: עַד בֹּשׁ의 주체가 누구인지의 모호성
  chosen_reading: 주체를 명시하지 않고 ‘부끄러워할 때까지’로 남겨 두었습니다.
  alternative_readings:
  - 그가 부끄러워할 때까지
  - 하사엘이 부끄러워할 때까지
  rationale: 히브리어는 이 절에서 부끄러움의 주체를 명확히 못 박지 않으므로, 번역에서도 그 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
