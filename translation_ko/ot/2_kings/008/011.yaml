translation:
  language: ko
  text: 그는 얼굴을 굳힌 채 부끄러움에 이를 때까지 응시하였고, 하나님의 사람은 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘부끄러움에 이르다’의 주체를 분명히 밝히지 않습니다. ‘하사엘이 부끄러워할 때까지’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת פָּנָיו
  english_pob_choice: fixed his gaze
  chosen_korean: 얼굴을 고정하고
  alternatives_korean:
  - 시선을 고정하고
