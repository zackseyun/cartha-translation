  text: וַ/יַּעֲמֵ֥ד אֶת פָּנָ֖י/ו וַ/יָּ֣שֶׂם עַד בֹּ֑שׁ וַ/יֵּ֖בְךְּ אִ֥ישׁ הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/011.yaml
  text: And he fixed his gaze and stared until he was ashamed[a], and the man of God wept.
  footnotes:
  - marker: a
    text: Or, 'until Hazael was ashamed.' The Hebrew leaves the subject of 'was ashamed' less explicit than English normally prefers.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 얼굴을 고정하고 부끄러워할 때까지 똑바로 바라보았고, 하나님의 사람은 울었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘부끄러워하다’의 주체를 분명히 밝히지 않으므로, 본문은 그 모호성을 보존합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֵד אֶת פָּנָיו
  english_pob_choice: fixed his gaze
  chosen_korean: 얼굴을 고정하고
  alternatives_korean:
  - 시선을 고정하고
  - 얼굴을 들고
  - 얼굴을 굳게 하고
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘얼굴을 세우다/고정하다’에 가까우므로, 한국어에서는 자연스럽게 ‘얼굴을 고정하고’로 옮겨 원문 이미지를 살렸습니다.
- source_word: וַיָּשֶׂם
  english_pob_choice: stared
  chosen_korean: 똑바로 바라보았고
  alternatives_korean:
  - 응시했고
  - 계속 바라보았고
  - 주시했고
  lexicon: HALOT
  rationale: 앞절의 고정된 자세를 이어가는 동사로 보아, 단순한 ‘보다’보다 강한 지속적 시선을 나타내는 표현으로 옮겼습니다.
- source_word: עַד בֹּשׁ
  english_pob_choice: until he was ashamed
  chosen_korean: 부끄러워할 때까지
  alternatives_korean:
  - 수치스러워할 때까지
  - 당황할 때까지
  - 부끄러움을 느낄 때까지
  lexicon: HALOT
  rationale: בוש의 기본 의미를 살리되, 한국어에서 가장 자연스러운 감정 표현인 ‘부끄러워하다’를 택했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 하나님의 선지자
  - 하나님의 사람
  lexicon: HALOT
  rationale: 이 표제는 예언자 엘리사를 가리키는 원문 표현이므로, 관용적이면서도 직역에 가까운 ‘하나님의 사람’을 유지했습니다.
theological_decisions:
- issue: עַד בֹּשׁ의 주체가 누구인지의 모호성
  chosen_reading: 주체를 명시하지 않고 ‘부끄러워할 때까지’로 남겨 두었습니다.
  alternative_readings:
  - 그가 부끄러워할 때까지
  - 하사엘이 부끄러워할 때까지
  rationale: 히브리어는 이 절에서 부끄러움의 주체를 명확히 못 박지 않으므로, 번역에서도 그 긴장을 해소하지 않고 보존했습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
