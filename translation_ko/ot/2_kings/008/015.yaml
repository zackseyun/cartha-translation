  chosen_korean: 그러고 나서 하사엘이 그의 자리에 왕이 되었습니다
  alternatives_korean:
  - 그러고 나서 하사엘이 그를 대신해 다스렸습니다
  - 그러고 나서 하사엘이 그의 자리에 통치했습니다
  lexicon: HALOT
  rationale: 왕위 승계 공식을 한국어로 자연스럽게 옮기되, ‘왕이 되다’로 왕권 교체를 분명히 했습니다.
theological_decisions:
- issue: 본문이 드러내지 않는 행위 주체의 식별
  chosen_reading: 본문의 동사 주어를 ‘그’로 유지하고, 이름을 본문에 앞당겨 넣지 않았습니다.
  alternative_readings:
