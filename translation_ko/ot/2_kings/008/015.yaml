  rationale: 히브리어는 이 동작들의 주어를 직접 밝히지 않으므로, 마지막 절에서 이름이 나올 때까지의 서술상 अस्प명성을 보존했습니다.
  doctrine_reference: 원문 우선 원칙과 의미 과잉 방지
