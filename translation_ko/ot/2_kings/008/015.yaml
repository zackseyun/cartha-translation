  rationale: 동작의 연속성을 살리되, 단순히 ‘덮다’보다 펴서 놓는 행위를 더 분명히 드러냈습니다.
- source_word: וַיִּמְלֹךְ חֲזָהאֵל תַּחְתָּיו
