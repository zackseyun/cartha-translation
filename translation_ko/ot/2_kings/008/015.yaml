- from: 그리고 이튿날, 그는 덮개 천[a]을 가져다가 물에 적셔 자기 얼굴 위에 펴 놓았고, 그는 죽었습니다[b]. 그러고 나서 하사엘이 그의 자리에 왕이 되었습니다.
