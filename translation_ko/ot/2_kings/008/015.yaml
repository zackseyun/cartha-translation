  lexicon: HALOT
  rationale: 희귀어라 정확한 물건의 종류를 단정하기 어렵기 때문에, 기능을 드러내는 중립적 표현을 택했습니다.
- source_word: וַיִּפְרֹשׂ עַל־פָּנָיו
  english_pob_choice: spread it over his face
  chosen_korean: 자기 얼굴 위에 펴 놓았고
