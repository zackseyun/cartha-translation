  source_fidelity: ‘자기 얼굴’은 한국어에서 행위 주어와 얼굴의 소유자가 동일하다는 재귀적 관계를 강하게 확정합니다. 히브리어의 소유 접미사는 그러한 동일 지시를 명시하지 않으므로, ‘그의 얼굴’로 옮겨 본문의 지시 대상 불확실성을 보존해야 합니다. 또한 וַיִּטְבֹּל은 단순히 ‘적시다’보다 ‘물에 담그다/담갔다’가 더 직접적입니다.
  naturalness: ‘그의 자리에 왕이 되었습니다’는 뜻은 전달하지만 한국어 왕위 계승 표현으로 다소 어색합니다. ‘그의 뒤를 이어 왕이 되었습니다’가 자연스럽고 왕위 계승의 뜻을 분명히 합니다. ‘마지막 절’은 이 절의 마지막 절(節)처럼 들리므로 ‘마지막 구절’로 고치는 것이 정확합니다.
  terminology: ‘덮개 천’은 희귀어 הַמַּכְבֵּר의 종류를 단정하지 않는 적절한 중립 번역입니다. ‘하사엘’도 통용 표기이며, 왕위 계승은 ‘왕이 되었습니다’로 유지할 수 있습니다.
