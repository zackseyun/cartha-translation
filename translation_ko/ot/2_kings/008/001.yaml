  to: 엘리사는 자기 아들을 살려 준 그 여인에게 이렇게 말한 적이 있었습니다. “너와 네 집안은 일어나 떠나십시오. 머무를 수 있는 곳이면 어디든지 머무르십시오.[a] 야훼께서 기근을 불러오셨고, 그 기근도 이 땅에 칠 년 동안 닥쳤습니다.”
