base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/001.yaml
  text: Now Elisha had spoken to the woman whose son he had restored to life[a], saying, “Arise, and go, you and your household, and stay wherever you can stay, for Yahweh has called for a famine, and it has also come upon the land for seven years.”
  footnotes:
  - marker: a
    text: Or 'sojourn' / 'reside' for 'stay' and 'wherever you can stay'; the Hebrew verb גור often carries the sense of living as a temporary resident.
    reason: lexical_alternative
translation:
  language: ko
  text: 엘리사는 자기 아들을 살려 준 그 여인에게 이렇게 말한 적이 있었습니다. “너와 네 집안은 일어나 떠나십시오. 머무를 수 있는 곳이면 어디든지 머무르십시오.[a] 야훼께서 기근을 불러오셨고, 그 기근도 이 땅에 칠 년 동안 닥쳤습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גור는 ‘잠시 거주하다’, ‘유숙하다’라는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע דִּבֶּר
  english_pob_choice: Now Elisha had spoken
  chosen_korean: 이리하여 엘리사가 … 말했으니
  alternatives_korean:
  - 그리고 엘리사가 … 말했습니다
  - 엘리사가 … 말했습니다
  lexicon: BDB / HALOT
  rationale: 서술 전환을 보이면서도 히브리어 완료형의 선행성을 한국어 관형절·종결 어미로 자연스럽게 반영했습니다.
- source_word: אֲשֶׁר הֶחֱיָה אֶת־בְּנָהּ
  english_pob_choice: whose son he had restored to life
  chosen_korean: 그 아들의 생명을 되살려 준
  alternatives_korean:
  - 그 아들을 살려 준
  - 그 아들을 다시 살린
  lexicon: HALOT
  rationale: החיה의 사역적 의미를 살리되, 현대 한국어에서 자연스럽고 서술적으로 읽히는 표현으로 옮겼습니다.
- source_word: בֵּיתֵךְ
  english_pob_choice: your household
  chosen_korean: 네 집안
  alternatives_korean:
  - 네 집
  - 네 가족
  lexicon: HALOT
  rationale: 단순한 건물이 아니라 동행하는 식구와 소속원을 가리키므로 ‘집안’이 가장 적절합니다.
- source_word: וְגוּרִי בַּאֲשֶׁר תָּגוּרִי
  english_pob_choice: stay wherever you can stay
  chosen_korean: 네가 머무를 수 있는 곳 어디든지 머물러 있어라
  alternatives_korean:
  - 네가 유숙할 수 있는 곳 어디든지 유숙하여라
  - 네가 거주할 수 있는 곳 어디든지 거주하여라
  lexicon: HALOT
  rationale: גור의 ‘임시로 머무르다/체류하다’는 뉘앙스를 살리면서도, 반복을 한국어에서 자연스럽게 처리했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: DOCTRINE.md Contested terms
  rationale: 프로젝트 기본어휘에 따라 신명은 ‘야훼’로 옮겨, 본문이 가진 언약적 신명 사용을 직접 드러냈습니다.
theological_decisions:
- issue: 기근의 원인 표명에서 하나님의 주권을 어떻게 드러낼지
  chosen_reading: “야훼께서 기근을 불러오셨고”
  alternative_readings:
  - “야훼께서 기근을 정하셨고”
  - “야훼께서 기근을 선포하셨고”
  rationale: קרא ל־는 단순한 발생 설명보다 ‘불러오다/불러내다’의 주권적 원인성을 담을 수 있어, 본문의 신학적 긴장을 유지했습니다.
  doctrine_reference: 섭리와 심판의 주권
