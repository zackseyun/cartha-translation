  - 다섯 해째에
  lexicon: WLC/HALOT
  rationale: 히브리어 연대 공식의 관용적 의미를 따라 ‘다섯째 해에’로 자연스럽게 옮기되, 연대 표지의 기능을 유지했습니다.
- source_word: לְ/יוֹרָ֤ם בֶּן אַחְאָב֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל
  english_pob_choice: of Joram son of Ahab king of Israel
  chosen_korean: 이스라엘 왕 아합의 아들 요람[a]
  alternatives_korean:
  - 이스라엘 왕 아합의 아들 요람
  - 이스라엘의 왕 아합의 아들 요람
  lexicon: WLC/HALOT
  rationale: 왕호와 부친 관계를 그대로 살리되, 한국어 연대문에서는 ‘요람 때에’가 가장 자연스러워 ‘of’를 소유격보다 시점 표지로 처리했습니다.
- source_word: וִ/יהוֹשָׁפָ֖ט מֶ֣לֶךְ יְהוּדָ֑ה
  english_pob_choice: while Jehoshaphat was king of Judah
  chosen_korean: 유다의 왕 여호사밧의
  alternatives_korean:
  - 여호사밧이 유다 왕이었을 때
  - 유다 왕 여호사밧과
  lexicon: WLC/HALOT
  rationale: 히브리어 압축 절을 한국어에서는 ‘…의 다섯째 해에’ 앞에 두어 병행 관계를 유지했습니다. 다만 본문에는 해석을 과하게 풀지 않고 축약된 구조를 반영했습니다.
- source_word: מָלַ֛ךְ
  english_pob_choice: began to reign
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 통치하기 시작했습니다
  - 즉위했습니다
  lexicon: WLC/HALOT
  rationale: מָלַךְ의 즉위 개시를 현대 한국어로 자연스럽게 옮겼습니다. ‘왕이 되었습니다’는 서술의 격식을 유지하면서도 시작점 의미를 드러냅니다.
- source_word: יְהוֹרָ֥ם בֶּן יְהוֹשָׁפָ֖ט מֶ֥לֶךְ יְהוּדָֽה
  english_pob_choice: Jehoram son of Jehoshaphat, king of Judah
  chosen_korean: 여호사밧의 아들 여호람[b], 유다의 왕
  alternatives_korean:
  - 유다의 왕 여호사밧의 아들 여호람
  - 여호사밧의 아들 여호람, 유다 왕
  lexicon: WLC/HALOT
  rationale: 히브리어의 이름-부친-왕호 순서를 한국어에 맞게 재배열하되, 마지막의 ‘유다의 왕’을 보존하여 인물 식별을 분명히 했습니다.
theological_decisions:
- issue: 요람과 여호람의 두 이름이 매우 유사한 점
  chosen_reading: 본문의 히브리어 구별을 따라 요람(이스라엘 왕)과 여호람(유다 왕)을 서로 구별해 표기했습니다.
  alternative_readings:
  - 두 이름을 모두 요람으로 통일
  - 두 이름을 모두 여호람으로 통일
  rationale: 본문은 철자와 인물이 다르므로, 독자가 왕들을 혼동하지 않도록 한국어에서도 구별을 유지하는 것이 본문의 역사적 정보에 더 충실합니다.
  doctrine_reference: 'Translation philosophy §1: Preserve source distinctions unless the target language requires otherwise.'
- issue: 여호사밧 관련 압축된 연대 표현
  chosen_reading: ‘유다의 왕 여호사밧의 다섯째 해에’로 옮겨, 본문의 압축성과 연대 표지를 유지했습니다.
  alternative_readings:
  - ‘여호사밧이 유다 왕이던 때에’로 풀어 쓰기
  - 코어전시를 본문에 명시하기
  rationale: 히브리어는 코어전시를 명시하지 않으므로, 본문에서 그 결론을 단정하지 않고 읽기 쉬운 연대문으로만 처리했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
