base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/016.yaml
  text: And in the fifth year of Joram son of Ahab king of Israel[a], while Jehoshaphat was king of Judah, Jehoram son of Jehoshaphat, king of Judah[b], began to reign.
  footnotes:
  - marker: a
    text: Or more literally, 'and Jehoshaphat king of Judah.' The Hebrew clause is compressed; some understand it as reflecting a period of coregency.
    reason: alternative_reading
  - marker: b
    text: 'Hebrew distinguishes the names: ''Joram'' (king of Israel) and ''Jehoram'' (son of Jehoshaphat, king of Judah), though these forms are closely related.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아합의 아들 이스라엘 왕 요람의 다섯째 해, 유다 왕 여호사밧[a]이 통치하고 있을 때에, 여호사밧의 아들 여호람[b]이 유다의 왕으로 통치하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 더 직역하면 ‘그리고 유다 왕 여호사밧’입니다. 이 절은 압축되어 있으며, 일부는 이를 공동 통치 기간을 반영하는 것으로 이해합니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 이스라엘 왕의 이름을 ‘요람’, 유다 왕의 이름을 ‘여호람’으로 구별하지만, 두 형태는 서로 밀접하게 관련되어 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בִ/שְׁנַ֣ת חָמֵ֗שׁ
  english_pob_choice: in the fifth year of
  chosen_korean: 다섯째 해에
  alternatives_korean:
