  lexicon: HALOT
  rationale: 연령 공식으로서의 בֶּן + 수사 + שָׁנָה를 한국어의 자연스러운 나이 표현으로 풀어 옮겼습니다.
- source_word: הָיָה בְמָלְכוֹ
