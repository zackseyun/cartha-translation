source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר יוֹרָם֙ צָעִ֔ירָ/ה וְ/כָל הָ/רֶ֖כֶב עִמּ֑/וֹ וַֽ/יְהִי ה֞וּא קָ֣ם לַ֗יְלָה וַ/יַּכֶּ֨ה אֶת אֱד֜וֹם הַ/סֹּבֵ֤יב אֵלָי/ו֙ וְ/אֵת֙ שָׂרֵ֣י הָ/רֶ֔כֶב וַ/יָּ֥נָס הָ/עָ֖ם לְ/אֹהָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/021.yaml
  text: So Joram crossed over to Zair[a], with all the chariots with him. Then he arose by night and struck Edom, which had surrounded him, and the commanders of the chariots[b]; but the people fled to their tents.
  footnotes:
  - marker: a
    text: Or possibly 'to Seir'; the Hebrew place name צָעִירָה is difficult, and some take it as a variant related to Seir/Edom rather than the distinct place name Zair.
    reason: alternative_reading
  - marker: b
    text: '''Fled to their tents'' is a Hebrew idiom meaning they dispersed and returned home.'
    reason: cultural_note
translation:
  language: ko
  text: 그리하여 요람은 자기와 함께한 모든 병거와 함께 자이어로 건너갔습니다. 그때 그는 밤에 일어나 자신을 에워싼 에돔과 병거 지휘관들을 쳤고, 백성은 자기들의 장막으로 도망쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자이어’는 마소라 본문의 지명형을 따른 것입니다. 일부는 이를 ‘세일’과 관련된 변이로 보기도 합니다.
    reason: source_note
  - marker: b
    text: ‘자기들의 장막으로’는 히브리어 관용구로, 흩어져 각자 집으로 돌아갔다는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  english_pob_choice: crossed over
  chosen_korean: 건너갔습니다
  alternatives_korean:
  - 지나갔습니다
  - 건너왔습니다
  lexicon: HALOT
  rationale: עבר은 여기서 이동·진입의 의미로 쓰여, 군사적 이동 상황에 맞게 ‘건너갔습니다’로 옮기면 본문의 흐름을 자연스럽게 살릴 수 있습니다.
- source_word: צָעִירָה
  english_pob_choice: Zair
  chosen_korean: 자이어
  alternatives_korean:
  - 세일
  - 자이르
  lexicon: HALOT
  rationale: 마소라 본문의 지명 형태를 따르는 기본 독법을 유지해 고유명사로 처리했고, 세일과의 관련 가능성은 본문 밖 주석으로 두는 편이 더 안전합니다.
- source_word: שָׂרֵי הָרֶכֶב
  english_pob_choice: the commanders of the chariots
  chosen_korean: 병거 지휘관들
  alternatives_korean:
  - 병거들의 지휘관들
  - 병거 부대의 장교들
  lexicon: HALOT
  rationale: שָׂרֵי는 통치자보다 군사적 지휘관을 가리키므로, 병거와의 관계를 분명히 드러내는 ‘병거 지휘관들’이 적절합니다.
- source_word: לְאֹהָלָיו
  english_pob_choice: to their tents
  chosen_korean: 자기들의 장막으로
  alternatives_korean:
  - 자기들의 집으로
  - 자기들의 천막으로
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살려 문자적 이미지를 유지하되, 오늘 한국어에서는 ‘장막’이 가장 본문 친화적입니다.
theological_decisions:
- issue: אָז / narrative sequence and military outcome
  chosen_reading: ‘그때 그는 밤에 일어나 … 쳤고’로 순차적 사건 전개를 살렸습니다.
  alternative_readings:
  - ‘그는 밤에 일어나 … 공격했고’
  - ‘그는 밤에 일어나 … 무찔렀고’
  rationale: וַיַּכֶּה는 폭넓게 ‘치다’의 의미를 가지므로, 본문의 결과를 과도하게 단정하지 않고 연속 서술을 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 서사 본문 번역 원칙
