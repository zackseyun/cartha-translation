revisions:
- from: 그리하여 요람은 자기와 함께한 모든 병거와 함께 자이어로 건너갔습니다. 그때 그는 밤에 일어나 자신을 에워싼 에돔과 병거 지휘관들을 쳤고, 백성은 자기들의 장막으로 도망쳤습니다.[a][b]
  to: 그리하여 요람은 모든 병거를 거느리고 사일로 건너갔습니다.[a] 그는 밤에 일어나 자신을 에워싸고 있던 에돔 사람들과 병거 지휘관들을 쳤습니다. 그러나 백성은 저마다 장막으로 도망쳤습니다.[b]
  rationale: 병거 동반 표현의 중복을 제거하고, 지명을 한국어 통용 표기인 ‘사일’로 바로잡았습니다. 에돔을 에워싼 집단으로 자연스럽게 표현하되, ‘치다’의 폭넓은 의미와 본문의 군사적 결과에 대한 절제를 유지했습니다. 각주 표지는 해당 지명 및 관용구에 맞추어 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:59Z'
review_pass:
  verdict: revise
  source_fidelity: 전반적인 사건 순서와 군사적 장면은 히브리어 본문에 충실합니다. 다만 ‘자기와 함께한 모든 병거와 함께’는 עִמּוֹ를 중복하여 옮긴 표현이므로 바로잡는 것이 좋습니다. 지명 צָעִירָה는 한국어 성경의 통용 표기와 히브리어 형태를 고려하여 ‘사일’로 옮기고, 대안 독법은 각주에 보존합니다.
  naturalness: ‘모든 병거를 거느리고’가 중복 없이 자연스럽습니다. ‘자신을 에워싸고 있던 에돔 사람들과 병거 지휘관들’은 한국어 문장 안에서 목적어 관계를 분명히 하면서도 집합명사 에돔의 뜻을 자연스럽게 전달합니다.
  terminology: ‘병거’, ‘병거 지휘관들’, ‘장막’은 문맥과 격식에 적절합니다. ‘에돔 사람들’은 본문의 집합적 민족 명칭을 한국어에서 자연스럽게 풀어 쓴 것이며, 군대나 완전한 패배를 불필요하게 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘자기와 함께한 모든 병거와 함께’의 중복
    rationale: 히브리어 וְכָל־הָרֶכֶב עִמּוֹ는 ‘그와 함께한 모든 병거’라는 한 구성이므로, 한국어의 ‘…와 함께’가 반복되면 의미가 중복되고 문장이 어색해집니다.
  - severity: low
    issue: 지명 ‘자이어’의 표기
    rationale: 영어식 Zair를 옮긴 ‘자이어’보다, 한국어 성경 전통에서 통용되는 ‘사일’이 고유명사 표기로 더 자연스럽습니다. 세일 관련 대안은 각주로 유지해야 합니다.
  - severity: low
    issue: 각주 b의 표지 위치
    rationale: 관용구 설명은 ‘장막으로’에 직접 붙이는 편이 해당 범위를 명확히 합니다.
  revised_text: 그리하여 요람은 모든 병거를 거느리고 사일로 건너갔습니다.[a] 그는 밤에 일어나 자신을 에워싸고 있던 에돔 사람들과 병거 지휘관들을 쳤습니다. 그러나 백성은 저마다 장막으로 도망쳤습니다.[b]
