  source_fidelity: 첫 절의 히브리어 관용구 ‘유다의 손 아래에서’는 유다의 지배·권세 아래 있던 상태를 뜻합니다. 초안의 ‘유다의 손 아래에서 반역하여 오늘에 이르렀습니다’는 ‘오늘에 이르렀습니다’가 반역 행위 자체의 도달점처럼 들려, 반역/이탈 상태가 기록자의 현재까지 지속되었다는 עַד הַיּוֹם הַזֶּה의 뜻을 충분히 드러내지 못합니다. 수정문은 이 지속성을 명확히 반영합니다. 리브나가 같은 때에 반역했다는 후반절은 충실합니다.
