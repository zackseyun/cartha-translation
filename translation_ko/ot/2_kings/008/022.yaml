  lexicon: HALOT
  rationale: ‘손 아래’라는 히브리어 관용구를 살리되, 한국어로도 자연스럽게 읽히도록 직역과 의미를 함께 반영했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
