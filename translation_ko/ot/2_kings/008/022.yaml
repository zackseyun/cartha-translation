translation:
  language: ko
  text: 그리하여 에돔은 유다의 지배에서 벗어나 반역하였고, 오늘에 이르기까지 그러했습니다[a]. 그때에 립나도 반역했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반기를 들어’ 또는 ‘떨어져 나가’로 옮길 수 있습니다. 히브리어 동사는 정치적 지배에 대한 반역이나 이탈을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  english_pob_choice: rebelled
  chosen_korean: 반역하여 / 반역했습니다
  alternatives_korean:
