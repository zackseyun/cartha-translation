base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/022.yaml
  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
  footnotes:
  - marker: a
    text: Or 'revolted' / 'broke away.' The Hebrew verb carries the sense of political rebellion against rule.
    reason: lexical_alternative
translation:
  language: ko
  text: 그렇게 에돔이 유다의 손 아래에서 반역하여 오늘에 이르렀습니다[a]. 그때에 립나도 반역했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘반란하여’ / ‘떨어져 나가’로 옮길 수 있습니다. 히브리어 동사는 정치적 지배에 대한 반역의 뜻을 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁע / תִּפְשַׁע
  english_pob_choice: rebelled
  chosen_korean: 반역하여 / 반역했습니다
  alternatives_korean:
  - 반란하여 / 반란했습니다
  - 배반하여 / 배반했습니다
  lexicon: HALOT
  rationale: 정치적 지배에 대한 이탈과 저항을 가리키므로, 단순한 ‘떠남’보다 ‘반역’이 원문의 강한 정치적 의미를 더 정확히 드러냅니다.
- source_word: מִתַּחַת יַד יְהוּדָה
