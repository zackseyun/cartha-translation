  text: So Edom rebelled from under the hand of Judah to this day[a]. Then Libnah also rebelled at that time.
  footnotes:
  - marker: a
    text: Or 'revolted' / 'broke away.' The Hebrew verb carries the sense of political rebellion against rule.
