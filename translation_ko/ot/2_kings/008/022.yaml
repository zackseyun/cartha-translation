  - 오늘까지입니다
  lexicon: HALOT
  rationale: 서술 시점까지 계속되는 상태를 나타내는 관용구이므로, 한국어에서는 자연스러운 ‘오늘에 이르렀습니다’로 옮겼습니다.
- source_word: לִבְנָה
  english_pob_choice: Libnah
  chosen_korean: 립나
  alternatives_korean:
  - 리브나
