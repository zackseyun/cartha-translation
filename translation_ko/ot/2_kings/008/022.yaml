  chosen_korean: 유다의 손 아래에서
  alternatives_korean:
  - 유다의 권세 아래에서
  - 유다의 통제 아래에서
  lexicon: HALOT
  rationale: ‘손 아래’라는 히브리어 관용구를 살리되, 한국어로도 자연스럽게 읽히도록 직역과 의미를 함께 반영했습니다.
- source_word: עַד הַיּוֹם הַזֶּה
