  text: וַ֠/יְהִי ה֥וּא מְסַפֵּ֣ר לַ/מֶּלֶךְ֮ אֵ֣ת אֲשֶׁר הֶחֱיָ֣ה אֶת הַ/מֵּת֒ וְ/הִנֵּ֨ה הָ/אִשָּׁ֜ה אֲשֶׁר הֶחֱיָ֤ה אֶת בְּנָ/הּ֙ צֹעֶ֣קֶת אֶל הַ/מֶּ֔לֶךְ עַל בֵּיתָ֖/הּ וְ/עַל שָׂדָ֑/הּ וַ/יֹּ֤אמֶר גֵּֽחֲזִי֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ זֹ֚את הָֽ/אִשָּׁ֔ה וְ/זֶה בְּנָ֖/הּ אֲשֶׁר הֶחֱיָ֥ה אֱלִישָֽׁע־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/005.yaml
  text: And as he was telling the king how he had restored the dead to life[a], behold, the woman whose son he had restored to life was crying out to the king about her house and about her field. And Gehazi said, “My lord the king, this is the woman[b], and this is her son whom Elisha restored to life.”
  footnotes:
  - marker: a
    text: Or, 'how he had revived the dead' / 'how he had brought the dead back to life.' The Hebrew uses the causative of 'live' (החיה).
    reason: lexical_alternative
  - marker: b
    text: '''Behold'' marks the sudden, striking coincidence that the woman arrived at that very moment.'
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그가 왕에게 죽은 사람을 살린 일[a]을 말하고 있는데, 보라, 그가 살린 아들의 어머니인 그 여자가 자기 집과 자기 밭에 관하여 왕에게 부르짖고 있었습니다. 게하시가 말했습니다. “내 주 왕이여, 이 여자가 바로 그 여자이며, 이 사람은 엘리사가 살려 낸 그 아들입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘죽은 사람을 되살린’ 혹은 ‘죽은 자를 다시 살린’으로도 옮길 수 있습니다. 히브리어는 ‘살게 하다’의 사역형을 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הוּא מְסַפֵּר
  english_pob_choice: And as he was telling
  chosen_korean: 그리고 그가 …을 말하고 있는데
  alternatives_korean:
  - 그가 …을 말하고 있을 때
  - 그리고 그가 …을 이야기하고 있었는데
  lexicon: HALOT
  rationale: 와우 연속과 분사구가 만드는 진행 중인 배경 상황을 한국어로 자연스럽게 살려, 사건의 동시성을 드러냈습니다.
- source_word: הֶחֱיָה אֶת הַמֵּת / אֲשֶׁר הֶחֱיָה אֶת בְּנָהּ / אֲשֶׁר הֶחֱיָה אֱלִישָׁע
  english_pob_choice: restored the dead to life
  chosen_korean: 죽은 사람을 살린 일 / 살린 아들 / 살려 낸
  alternatives_korean:
  - 죽은 자를 다시 살린 일
  - 죽은 사람을 되살린
  - 다시 살아나게 한
  lexicon: HALOT
  rationale: החיה의 사역적 의미를 따라 단순히 ‘살다’가 아니라 ‘살리다/살려 내다’로 옮겼고, 문맥상 동일한 동사를 세 번 반복하는 구조도 유지했습니다.
- source_word: צֹעֶקֶת אֶל הַמֶּלֶךְ
  english_pob_choice: was crying out to the king
  chosen_korean: 왕에게 부르짖고 있었습니다
  alternatives_korean:
  - 왕에게 외치고 있었습니다
  - 왕에게 간청하고 있었습니다
  lexicon: HALOT
  rationale: צעק의 절박한 외침과 호소의 뉘앙스를 살리기 위해, 단순한 ‘말하다’보다 강한 ‘부르짖다’를 택했습니다.
- source_word: עַל בֵּיתָהּ וְעַל שָׂדָהּ
  english_pob_choice: about her house and about her field
  chosen_korean: 자기 집과 자기 밭에 관하여
  alternatives_korean:
  - 자기 집과 자기 밭 때문에
  - 자기 집과 자기 밭을 두고
  lexicon: HALOT
  rationale: עַל이 여기서는 청원의 ‘관하여/대하여’의 뜻으로 쓰였으므로, 재산 분쟁의 대상인 ‘집’과 ‘밭’을 문맥에 맞게 분명히 했습니다.
- source_word: אֲדֹנִי הַמֶּלֶךְ
  english_pob_choice: My lord the king
  chosen_korean: 내 주 왕이여
  alternatives_korean:
  - 내 주 왕님이여
  - 왕이시여
  lexicon: HALOT
  rationale: 궁정 예법을 반영하는 호칭으로, 히브리어의 직설적 호칭을 살리면서도 한국어 왕실 호칭에 맞게 옮겼습니다.
theological_decisions:
- issue: וְהִנֵּה의 담화 효과
  chosen_reading: “보라”를 넣어 우연처럼 보이는 즉각적 장면 전환과 서술상의 놀라움을 살렸습니다.
  alternative_readings:
  - “갑자기”
  - 아무 표시 없이 연결
  rationale: 히브리어 וְהִנֵּה는 단순한 연결어가 아니라 독자의 주의를 끌며 사건의 극적 동시성을 강조하므로, 그 수사적 힘을 보존하는 번역이 적절합니다.
  doctrine_reference: 서사 문체의 수사적 효과 보존
- issue: 게하시의 발화 등록
  chosen_reading: 직접 화법 안에서는 예법을 갖춘 ‘내 주 왕이여’를 사용해 궁정 대화의 위계를 반영했습니다.
  alternative_readings:
  - 그냥 ‘왕이여’
  - ‘내 주 왕이여’ 대신 평서형
  rationale: 본문의 궁정적 장면에서 게하시가 왕에게 증언하는 맥락이므로, 직설적이되 공손한 호칭을 유지하는 것이 원문의 사회적 의미를 더 잘 드러냅니다.
  doctrine_reference: 본문의 사회적 위계와 발화 장르
