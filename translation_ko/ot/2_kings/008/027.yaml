  rationale: 이 본문은 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유한 신명성을 유지하는 ‘야훼’를 채택했습니다.
  doctrine_reference: POB naming convention for יְהוָה / YHWH
