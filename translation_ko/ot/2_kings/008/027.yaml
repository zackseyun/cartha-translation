revisions:
- from: 그는 아합의 집의 길을 따라가서 야훼의 눈에 악한 일을 했습니다. 아합의 집과 같았는데, 그것은 그가 아합의 집과 사돈 관계였기 때문입니다.[a]
  to: 그는 아합 집안의 길을 걸었고, 아합 집안처럼 야훼 보시기에 악을 행했습니다. 그는 아합 집안의 사위였기 때문입니다.[a]
  rationale: 행실을 가리키는 ‘길’의 은유와 왕 평가 공식은 유지하되, 현대 표준 한국어 합쇼체에 맞게 다듬었습니다. 본문 문맥에서 가장 정확한 ‘사위’를 본문에 두고, 더 넓은 혼인 관계라는 어휘적 가능성은 각주에 남겼습니다.
  reviewer_model: gpt-5.6-terra
