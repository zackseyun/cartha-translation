  lexicon: HALOT
  rationale: הלך의 관용적 용법은 단순한 이동보다 행실과 삶의 방향을 가리키므로, ‘길을 따라가다’로 도덕적 행보를 살렸습니다.
- source_word: בֵּית אַחְאָב / כְּבֵית אַחְאָב
  english_pob_choice: the house of Ahab / like the house of Ahab
  chosen_korean: 아합의 집 / 아합의 집과 같았는데
  alternatives_korean:
  - 아합의 가문
  - 아합 왕조
  lexicon: HALOT
  rationale: ‘집’의 왕조·가문 의미를 유지해 히브리어 관용을 보존했고, 비교구문도 같은 표현을 반복해 대응 관계를 분명히 했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 직역에 가까운 ‘눈에’가 히브리어 관용을 가장 직접적으로 드러내며, 하나님의 평가를 보는 이미지도 보존합니다.
