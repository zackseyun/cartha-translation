base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/027.yaml
  text: He walked in the way of the house of Ahab and did what was evil in the sight of Yahweh[a], like the house of Ahab, for he was a son-in-law of the house of Ahab.
  footnotes:
  - marker: a
    text: Or, 'related by marriage to the house of Ahab.' The Hebrew term can denote a marriage relationship more broadly, though 'son-in-law' is the most specific fit here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 아합의 집의 길을 따라가서 야훼의 눈에 악한 일을 했습니다. 아합의 집과 같았는데, 그것은 그가 아합의 집과 사돈 관계였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘아합의 집과 혼인으로 더 넓게 연결된 관계였다.’ 히브리어는 혼인 관계를 더 넓게 가리킬 수 있으나, 여기서는 ‘사돈 관계’가 가장 구체적인 의미에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  english_pob_choice: He walked in the way of
  chosen_korean: 길을 따라가서
  alternatives_korean:
