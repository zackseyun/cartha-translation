  chosen_korean: 사돈 관계였기 때문입니다
  alternatives_korean:
  - 사위였기 때문입니다
  - 혼인으로 연결되어 있었기 때문입니다
  lexicon: HALOT
  rationale: 히브리어 חָתָן은 좁게는 ‘사위’이지만 더 넓게 혼인 관계를 가리킬 수 있어, 본문 주석의 여지를 살려 ‘사돈 관계’로 옮겼습니다.
theological_decisions:
