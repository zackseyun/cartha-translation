  language: ko
  text: 그는 이스라엘 왕들의 길로 걸어갔습니다. 아합의 집이 했던 것처럼 그렇게 했는데, 아합의 딸이 그의 아내였기 때문입니다. 그는 야훼의 눈에 악한 일을 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
