  rationale: 비교절을 ‘이스라엘 왕들이 걸어간 길’에 직접 연결하여 히브리어의 행위 방식 비교를 자연스러운 한국어로 옮겼습니다. בֵּית אַחְאָב의 왕조적 의미는 ‘아합의 집안’으로 드러냈고, 원문의 평가 관용구는 ‘야훼께서 보시기에’로 자연스럽게 유지했습니다. 의미상 불필요한 직역 각주는 삭제했습니다.
