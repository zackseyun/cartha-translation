  text: 그는 아합의 집안이 행한 것처럼 이스라엘 왕들이 걸어간 길을 걸었습니다. 아합의 딸이 그의 아내였기 때문입니다. 그는 야훼께서 보시기에 악한 일을 행했습니다.
