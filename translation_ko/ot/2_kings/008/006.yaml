base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/006.yaml
  text: So the king asked the woman[a], and she told him. Then the king assigned to her one court official, saying, “Restore all that belongs to her, along with all the produce of the field from the day she left the land until now.”
  footnotes:
  - marker: a
    text: Or “one eunuch,” if סָרִיס is taken in its more literal sense rather than the broader sense “court official.”
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 그 여자에게 물으니, 그녀가 그에게 말했습니다. 그러자 왕이 그녀에게 한 내시를 붙여 주며 말했습니다. “그녀에게 속한 모든 것과, 그녀가 그 땅을 떠난 날부터 지금까지의 밭의 모든 소출을 모두 돌려주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 내시’로, סָרִיס을 더 문자적인 뜻으로 이해한 경우입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  english_pob_choice: asked
  chosen_korean: 물으니
  alternatives_korean:
  - 물었습니다
  - 질문하니
  lexicon: HALOT
  rationale: 왕의 간단한 문의 동작을 자연스러운 서술문으로 옮기되, 대화로 이어지는 흐름을 살리기 위해 ‘물으니’를 택했습니다.
- source_word: לָאִשָּׁה
  english_pob_choice: the woman
  chosen_korean: 그 여자에게
  alternatives_korean:
  - 그 여자에게
  - 그 부인에게
  lexicon: HALOT
  rationale: 여기서는 결혼 관계보다 앞서 나온 수넴 여인을 가리키는 인물 지시가 중심이므로, ‘부인’보다 중립적인 ‘여자’가 원문에 더 가깝습니다.
- source_word: סָרִיס אֶחָד
  english_pob_choice: one court official
  chosen_korean: 한 내시
  alternatives_korean:
  - 한 궁정 관리
  - 한 시종
  lexicon: HALOT
  rationale: סָרִיס은 문맥상 궁정 관리로 넓게도 읽히지만, 한국어에서는 원문의 잠재적 의미 긴장을 남기기 위해 더 직접적인 ‘내시’를 본문에 두었습니다.
- source_word: הָשֵׁיב
  english_pob_choice: Restore
  chosen_korean: 돌려주십시오
  alternatives_korean:
  - 회복하십시오
  - 되돌려주십시오
  lexicon: HALOT
  rationale: שׁוב의 사역형 명령으로서 소유권 회복을 요구하는 말이므로, 법적·실무적 뉘앙스가 살아 있는 ‘돌려주십시오’가 적합합니다.
- source_word: תְּבוּאֹת הַשָּׂדֶה
  english_pob_choice: the produce of the field
  chosen_korean: 밭의 모든 소출
  alternatives_korean:
  - 밭의 모든 열매
  - 밭의 모든 수확
  lexicon: HALOT
  rationale: תְּבוּאָה는 농산물·수확·소출을 아우르므로, 축적된 농경 수익까지 포함하는 넓은 표현인 ‘소출’을 택했습니다.
- source_word: מִיּוֹם עָזְבָה אֶת הָאָרֶץ וְעַד עָתָּה
  english_pob_choice: from the day she left the land until now
  chosen_korean: 그녀가 그 땅을 떠난 날부터 지금까지
  alternatives_korean:
  - 그녀가 그 땅을 떠난 날부터 오늘까지
  - 그녀가 그 땅을 떠난 때부터 지금까지
  lexicon: HALOT
  rationale: אֶרֶץ를 ‘그 땅’으로 옮겨, 특정 지역/영토를 포괄하는 원문의 유연성을 유지했습니다.
theological_decisions:
- issue: סָרִיס의 의미 범위
  chosen_reading: 본문에는 ‘한 내시’를 두되, 그 직함이 궁정 관리로도 읽힐 수 있는 여지를 남깁니다.
  alternative_readings:
  - 한 궁정 관리
  - 한 시종
  rationale: 영어 POB가 주석으로 literal sense와 broader sense의 긴장을 명시하므로, 본문은 직접성을 살리고 번역사실을 각주로 보강하는 방식이 원문 충실도에 더 맞습니다.
  doctrine_reference: 번역학상 어휘 중의성 처리
