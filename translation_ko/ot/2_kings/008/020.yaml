review_pass:
  verdict: revise
  source_fidelity: 히브리어 מִתַּחַת(‘~의 아래에서/지배 아래에서 벗어나’)의 이탈 의미가 초안의 ‘유다의 손 아래에서 반역하고’에는 충분히 드러나지 않습니다. 또한 עֲלֵיהֶם은 에돔 사람들이 자신들을 다스릴 왕을 세웠다는 뜻인데, ‘자기들 위에 왕을 세웠습니다’는 현대 한국어에서 어색합니다.
  naturalness: ‘그의 시대에’와 ‘유다의 손 아래에서 반역하고’는 다소 직역투이며, 특히 후자는 한국어 문장 안에서 의미 관계가 불분명합니다. ‘그가 다스리던 때에’, ‘유다의 지배에서 벗어나’, ‘자기들을 다스릴 왕을 세웠습니다’가 현대 표준어 합쇼체에 자연스럽습니다.
  terminology: ‘에돔’, ‘유다’, ‘반역’, ‘왕을 세우다’는 역사·정치 문맥과 원문의 의미를 적절히 반영합니다. ‘지배’는 ‘손 아래’라는 히브리어 관용구의 정치적 의미를 자연스럽게 전달하며, 각주에서 문자적 표현을 보존할 수 있습니다.
