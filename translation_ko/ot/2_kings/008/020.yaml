base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/020.yaml
  text: In his days Edom rebelled from under the hand of Judah and made a king over themselves[a].
  footnotes:
  - marker: a
    text: Or, more dynamically, 'Edom revolted from Judah's control.' The Hebrew reads literally, 'rebelled from under the hand of Judah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 다스리던 때에 에돔이 유다의 지배에서 벗어나 반역하고, 자기들을 다스릴 왕을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유다의 손 아래에서 벗어나 반역했다’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 날들에
  - 그의 때에
  lexicon: HALOT
  rationale: 히브리어의 시간 관용구로서 특정 왕의 재위 기간을 가리키므로, 현대 한국어에서는 자연스러운 ‘그의 시대에’로 옮겼습니다.
- source_word: פָּשַׁע
  english_pob_choice: rebelled
  chosen_korean: 반역하고
  alternatives_korean:
  - 반란을 일으키고
  - 배반하고
  lexicon: HALOT
  rationale: 이 문맥에서는 도덕적 ‘범죄’가 아니라 유다의 지배에서 벗어난 정치적 반역이므로, 그 성격을 드러내는 ‘반역하다’를 선택했습니다.
- source_word: מִתַּחַת יַד יְהוּדָה
  english_pob_choice: from under the hand of Judah
  chosen_korean: 유다의 손 아래에서
  alternatives_korean:
  - 유다의 지배 아래에서
  - 유다의 통제 아래에서
  lexicon: HALOT
  rationale: ‘손 아래’라는 히브리어의 구체적 지배 표상을 살리되, 한국어에서도 뜻이 통하도록 그대로 옮겼습니다.
- source_word: וַיַּמְלִכוּ ... מֶלֶךְ
  english_pob_choice: made a king
  chosen_korean: 왕을 세웠습니다
  alternatives_korean:
  - 왕으로 세웠습니다
  - 왕으로 임명했습니다
  lexicon: HALOT
  rationale: 말쿠트 계열 동사는 누군가를 왕으로 세우는 뜻이므로, 독립된 왕정 수립을 분명하게 드러내는 ‘왕을 세우다’로 옮겼습니다.
theological_decisions:
- issue: 정치적 반역을 도덕적 ‘죄’로 일반화하지 않기
  chosen_reading: 에돔의 행위를 유다의 지배에서 벗어난 정치적 반역으로 유지했습니다.
  alternative_readings:
  - 도덕적 불순종으로 넓게 이해하는 번역
  - 단순히 ‘떠났다’로 완화하는 번역
  rationale: 히브리어 פָּשַׁע는 여기서 왕권/종주권 관계를 깨는 정치적 반역을 가리키므로, 본문의 역사적 의미를 유지했습니다.
  doctrine_reference: 본문 주해의 역사-정치적 의미 보존
