translation:
  language: ko
  text: 그의 시대에 에돔이 유다의 손 아래에서 반역하고 자기들 위에 왕을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘유다의 손 아래에서 반역했다’입니다.
