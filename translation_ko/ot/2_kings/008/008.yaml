  yaml_path: translation/ot/2_kings/008/008.yaml
  text: And the king said to Hazael[a], “Take a gift in your hand, and go to meet the man of God, and inquire of Yahweh through him, saying, ‘Will I recover from this sickness?’”
  footnotes:
  - marker: a
    text: Or 'Will I live from this sickness?' The Hebrew verb is literally 'live,' here used in the sense of surviving or recovering.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕이 하사엘에게 말했습니다. “선물을 들고 가서 하나님의 사람을 만나십시오. 그를 통하여 야훼께 내가 이 병에서 나을 수 있는지 여쭈어보십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 이 병에서 살 수 있는지.’ 히브리어 동사는 문자적으로 ‘살다’이며, 여기서는 생존하거나 회복한다는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָה
  english_pob_choice: gift
  chosen_korean: 선물
  alternatives_korean:
  - 예물
  - 공물
  - 제물
  lexicon: HALOT
  rationale: 이 문맥에서는 제의적 제물이 아니라 예언자에게 가져가는 동반 선물이므로, 자연스러운 현대 한국어인 ‘선물’이 의미를 가장 잘 살립니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님 사람
  - 선지자
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살려, 직함의 서술성과 내러티브 울림을 유지했습니다.
- source_word: וְדָרַשְׁתָּ אֶת־יְהוָה מֵאֹתוֹ
  english_pob_choice: inquire of Yahweh through him
  chosen_korean: 그를 통해 야훼께 여쭈어 보아라
  alternatives_korean:
  - 그를 통해 야훼를 찾으라
  - 그에게서 야훼께 물어보라
  lexicon: HALOT
  rationale: דרשׁ는 여기서 단순한 질문이 아니라 신탁을 구하는 뜻이므로, 존칭적이면서도 현대적인 ‘여쭈어 보다’로 옮겨 매개 표현 ‘그를 통해’를 살렸습니다.
- source_word: הַאֶחְיֶה
  english_pob_choice: Will I recover
  chosen_korean: 제가 이 병에서 나을 수 있겠습니까?
  alternatives_korean:
  - 제가 이 병에서 살 수 있겠습니까?
  - 제가 이 병에서 회복하겠습니까?
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘살다’이지만, 문맥상 병에서의 생존·회복을 묻는 말이므로 ‘나을 수 있겠습니까’가 가장 자연스럽고 의미를 정확히 전달합니다.
theological_decisions:
- issue: יהוה(YHWH)의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기적 하나님의 고유 이름을 직접 사용하므로, 관례적 대체어 대신 음역형 ‘야훼’를 유지해 원문의 고유명과 신학적 무게를 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
