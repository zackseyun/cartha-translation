  lexicon: HALOT
  rationale: 왕위 승계를 자연스러운 한국어로 옮기되, ‘뒤를 이어’로 תַּחְתָּיו의 대체·계승 의미를 살렸습니다.
- source_word: יוֹרָם / אֲחַזְיָהוּ
  english_pob_choice: Yoram / Ahaziah
  chosen_korean: 요람 / 아하시야
  alternatives_korean:
  - 여호람 / 아하시야
  - 요람 / 아하시야후
  lexicon: 현대 외래어 표기
  rationale: 히브리어 음가에 따라 ‘요람’을 택하고, 관용적으로 널리 쓰이는 ‘아하시야’를 유지했습니다.
theological_decisions:
- issue: 왕의 죽음 공식의 완곡성
  chosen_reading: ‘누워’와 ‘장사되었고’로 왕실 연대기의 관용구를 살려, 본문이 직접적으로 ‘죽었다’고 서술하지 않는 점을 유지했습니다.
  alternative_readings:
  - ‘죽었고’로 명시적으로 풀기
  - ‘잠들었고’로 완곡하게 옮기기
  rationale: 열왕기의 정형적 왕위 계승 기록이라는 장르적 특성을 보존하는 편이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 서사/연대기 관용구
- issue: 장소와 계승의 정치적 의미
  chosen_reading: ‘다윗 성’과 ‘그의 뒤를 이어 다스렸습니다’로, 묘지 위치와 왕위 승계가 함께 제시하는 왕조적 연속성을 드러냈습니다.
  alternative_readings:
  - 장소를 일반적으로 ‘예루살렘’으로 풀기
  - 단순히 ‘계승했습니다’로 축약하기
  rationale: 본문은 단순한 사실 전달을 넘어 왕권의 연속성과 다윗 왕조의 정당성을 암시하므로, 그 구조를 보존하는 번역이 필요합니다.
  doctrine_reference: 다윗 왕조/열왕기 서술 구조
