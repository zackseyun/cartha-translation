  rationale: 한국어에서는 ‘아버지들’보다 왕조 문맥의 집단적 선조를 드러내는 ‘조상들’이 더 자연스럽고, 문맥의 계승 의미도 잘 전달합니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the City of David
