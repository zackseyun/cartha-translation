base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'slept with his fathers.' The Hebrew uses a conventional royal death formula.
    reason: lexical_alternative
  - marker: b
    text: Yoram is traditionally rendered 'Jehoram' in some English versions.
    reason: alternative_reading
translation:
  language: ko
  text: 요람은 조상들과 함께 잠들었고[a] 다윗 성에 조상들과 함께 장사되었으며, 그의 아들 아하시야가 그의 뒤를 이어 왕이 되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 왕의 죽음을 가리키는 관용적 표현으로 ‘잠들다’를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 이름 ‘요람’은 한국어 성경 번역 전통에서 ‘여호람’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
