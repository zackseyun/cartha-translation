  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹרָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר עִם אֲבֹתָ֖י/ו בְּ/עִ֣יר דָּוִ֑ד וַ/יִּמְלֹ֛ךְ אֲחַזְיָ֥הוּ בְנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/024.yaml
  text: And Yoram lay down with his fathers and was buried with his fathers in the City of David[b][a], and Ahaziah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'slept with his fathers.' The Hebrew uses a conventional royal death formula.
    reason: lexical_alternative
  - marker: b
    text: Yoram is traditionally rendered 'Jehoram' in some English versions.
    reason: alternative_reading
translation:
  language: ko
  text: 요람은 그의 조상들과 함께 누워, 다윗 성에 그의 조상들과 함께 장사되었고, 그의 아들 아하시야가 그의 뒤를 이어 다스렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 왕의 죽음을 가리키는 관용적 표현 ‘누워 있다’를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 이름 ‘요람’은 영어 성경 일부에서 전통적으로 ‘여호람’으로 옮기기도 합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누워
  alternatives_korean:
  - 잠들어
  - 죽어
  lexicon: HALOT
  rationale: 왕의 죽음 공식을 직역에 가깝게 살려, ‘죽다’로 풀어버리지 않고 히브리어 관용을 보존했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 조상들 가운데
  lexicon: HALOT
  rationale: 한국어에서는 ‘아버지들’보다 왕조 문맥의 집단적 선조를 드러내는 ‘조상들’이 더 자연스럽고, 문맥의 계승 의미도 잘 전달합니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the City of David
  chosen_korean: 다윗 성에
  alternatives_korean:
  - 다윗의 성에
  - 다윗 도시에
  lexicon: HALOT
  rationale: 고유 지명으로 굳어진 ‘다윗 성’을 유지해 장소 표현을 분명히 했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned ... in his place
  chosen_korean: 그의 뒤를 이어 다스렸습니다
  alternatives_korean:
  - 그를 대신하여 통치했습니다
  - 그의 자리에 왕이 되었습니다
  lexicon: HALOT
  rationale: 왕위 승계를 자연스러운 한국어로 옮기되, ‘뒤를 이어’로 תַּחְתָּיו의 대체·계승 의미를 살렸습니다.
- source_word: יוֹרָם / אֲחַזְיָהוּ
  english_pob_choice: Yoram / Ahaziah
  chosen_korean: 요람 / 아하시야
  alternatives_korean:
  - 여호람 / 아하시야
  - 요람 / 아하시야후
  lexicon: 현대 외래어 표기
  rationale: 히브리어 음가에 따라 ‘요람’을 택하고, 관용적으로 널리 쓰이는 ‘아하시야’를 유지했습니다.
theological_decisions:
- issue: 왕의 죽음 공식의 완곡성
  chosen_reading: ‘누워’와 ‘장사되었고’로 왕실 연대기의 관용구를 살려, 본문이 직접적으로 ‘죽었다’고 서술하지 않는 점을 유지했습니다.
  alternative_readings:
  - ‘죽었고’로 명시적으로 풀기
  - ‘잠들었고’로 완곡하게 옮기기
  rationale: 열왕기의 정형적 왕위 계승 기록이라는 장르적 특성을 보존하는 편이 원문 의미를 더 정확히 드러냅니다.
  doctrine_reference: 서사/연대기 관용구
- issue: 장소와 계승의 정치적 의미
  chosen_reading: ‘다윗 성’과 ‘그의 뒤를 이어 다스렸습니다’로, 묘지 위치와 왕위 승계가 함께 제시하는 왕조적 연속성을 드러냈습니다.
  alternative_readings:
  - 장소를 일반적으로 ‘예루살렘’으로 풀기
  - 단순히 ‘계승했습니다’로 축약하기
  rationale: 본문은 단순한 사실 전달을 넘어 왕권의 연속성과 다윗 왕조의 정당성을 암시하므로, 그 구조를 보존하는 번역이 필요합니다.
  doctrine_reference: 다윗 왕조/열왕기 서술 구조
