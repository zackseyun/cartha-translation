source:
  edition: WLC
  text: וַ/יָּבֹ֤א אֱלִישָׁע֙ דַּמֶּ֔שֶׂק וּ/בֶן הֲדַ֥ד מֶֽלֶךְ אֲרָ֖ם חֹלֶ֑ה וַ/יֻּגַּד ל֣/וֹ לֵ/אמֹ֔ר בָּ֛א אִ֥ישׁ הָ/אֱלֹהִ֖ים עַד הֵֽנָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/007.yaml
  text: Then Elisha came to Damascus. Now Ben-hadad king of Aram was sick[a], and it was told him, saying, “The man of God has come here.”
  footnotes:
  - marker: a
    text: Or “king of Syria.” The Hebrew reads “Aram.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 엘리사가 다메섹에 왔습니다. 그런데 아람[a] 왕 벤하닷은 병들어 있었고, 그에게 “하나님의 사람이 여기까지 왔습니다”라고 전해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시리아 왕.” 히브리어는 “아람”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 그때 ... 왔습니다
  alternatives_korean:
  - 그리고 ... 왔습니다
  - 그래서 ... 왔습니다
  lexicon: HALOT
  rationale: 와우 연속의 서술 전개를 살리되, 한국어에서는 ‘그때’가 자연스럽게 장면 전환과 사건 진행을 보여 줍니다.
- source_word: וּבֶן הֲדַד מֶלֶךְ אֲרָם
  english_pob_choice: Now Ben-hadad king of Aram
  chosen_korean: 아람 왕 벤하닷은
  alternatives_korean:
  - 시리아 왕 벤하닷은
  lexicon: HALOT
  rationale: 히브리어 지명·민족명인 ‘아람’을 우선 살려, 전통적이지만 해석이 들어간 ‘시리아’보다 원문을 더 직접적으로 반영했습니다.
- source_word: חֹלֶה
  english_pob_choice: was sick
  chosen_korean: 병이 들었고
  alternatives_korean:
  - 아팠고
  - 병들었고
  lexicon: HALOT
  rationale: 상태를 나타내는 분사적 표현으로, 한국어에서는 ‘병이 들다’가 자연스럽고 인물의 현재 상태를 잘 드러냅니다.
- source_word: וַיֻּגַּד לוֹ לֵאמֹר
  english_pob_choice: it was told him, saying
  chosen_korean: 그에게 사람들이 말하여 이르기를
  alternatives_korean:
  - 그에게 전하여 이르기를
  - 그에게 알려져 이르기를
  lexicon: HALOT
  rationale: 히브리어의 수동적 통보 구조를 한국어에서 어색하지 않게 풀어, 누군가가 그에게 소식을 전했다는 점을 살렸습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 사람인
  - 하나님 사람
  lexicon: HALOT
  rationale: 이 관용구는 예언자를 가리키는 정식 표현으로, 직역에 가까운 ‘하나님의 사람’을 유지해 서술의 울림을 보존했습니다.
