revisions:
- from: 그때 엘리사가 다메섹에 왔습니다. 그런데 아람 왕 벤하닷은 병이 들었고[a], 그에게 사람들이 말하여 이르기를 “하나님의 사람이 여기까지 왔습니다” 하였습니다.
  to: 그때 엘리사가 다메섹에 왔습니다. 그런데 아람[a] 왕 벤하닷은 병들어 있었고, 그에게 “하나님의 사람이 여기까지 왔습니다”라고 전해졌습니다.
  rationale: 원문의 수동 통보 구조를 보존하기 위해 ‘사람들이 말하여 이르기를’를 ‘전해졌습니다’로 고쳤습니다. 또한 ‘아람’의 번역 대안을 설명하는 각주 표지를 해당 어휘 바로 뒤로 옮겼습니다. 그 밖의 고유명사와 ‘하나님의 사람’이라는 표현은 원문 충실성과 한국어 관용을 고려하여 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:55Z'
