reference: 2 Kings 8:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חֲזָאֵל֮ לִ/קְרָאת/וֹ֒ וַ/יִּקַּ֨ח מִנְחָ֤ה בְ/יָד/וֹ֙ וְ/כָל ט֣וּב דַּמֶּ֔שֶׂק מַשָּׂ֖א אַרְבָּעִ֣ים גָּמָ֑ל וַ/יָּבֹא֙ וַ/יַּעֲמֹ֣ד לְ/פָנָ֔י/ו וַ/יֹּ֗אמֶר בִּנְ/ךָ֨ בֶן הֲדַ֤ד מֶֽלֶךְ אֲרָם֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר הַ/אֶחְיֶ֖ה מֵ/חֳלִ֥י זֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/009.yaml
  text: So Hazael went to meet him and took a gift in his hand[a], even every good thing of Damascus, a load for forty camels. He came and stood before him and said, “Your son Ben-hadad king of Aram has sent me to you, saying[b], ‘Will I recover from this sickness?’”
  footnotes:
  - marker: a
    text: “Your son” is a deferential expression of humility toward a respected superior; it does not necessarily indicate literal sonship.
    reason: cultural_note
  - marker: b
    text: Or more literally, “Will I live from this sickness?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 하사엘이 그를 맞으러 가서 손에 예물을 가지고 갔습니다[a]. 곧 다마스쿠스의 모든 좋은 것, 곧 낙타 사십 마리 분량이었습니다. 그는 와서 그의 앞에 서서 말했습니다. "왕의 아들 벤하닷, 아람 왕이 저를 당신에게 보내며 말하기를[b], ‘제가 이 병에서 낫겠습니까?’라고 했습니다."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 '예물'은 예배용 제물이 아니라, 존경하는 상급자에게 드리는 공손한 증정물을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 “제가 이 병에서 살겠습니까?” 또는 “제가 이 병에서 살겠습니까?”에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְרָאתוֹ
  english_pob_choice: to meet him
  chosen_korean: 그를 맞으러 가서
  alternatives_korean:
  - 그를 만나러 갔습니다
  - 그를 맞이하러 갔습니다
  lexicon: HALOT
  rationale: 상대에게 나아가 만나는 방향성을 살리면서, 현대 한국어 서술로 자연스럽게 표현했습니다.
- source_word: מִנְחָה
  english_pob_choice: a gift
  chosen_korean: 예물
  alternatives_korean:
  - 선물
  - 헌물
  - 공물
  lexicon: HALOT
  rationale: 이 문맥에서는 제의적 '제물'이 아니라 상급자에게 드리는 예물에 가깝기 때문에, 공경과 헌정을 함께 담는 '예물'을 택했습니다.
- source_word: וְכָל טוּב דַּמֶּשֶׂק
  english_pob_choice: even every good thing of Damascus
  chosen_korean: 다마스쿠스의 모든 좋은 것
  alternatives_korean:
  - 다마스쿠스의 온갖 좋은 것
  - 다마스쿠스의 가장 좋은 물품들
  lexicon: HALOT
  rationale: '''טוּב''의 풍성함과 우수성을 살리되, 한국어에서 과도하게 장식적이지 않게 ''모든 좋은 것''으로 옮겼습니다.'
- source_word: מַשָּׂא אַרְבָּעִים גָּמָל
  english_pob_choice: a load for forty camels
  chosen_korean: 낙타 사십 마리 분량
  alternatives_korean:
  - 사십 낙타의 짐
  - 낙타 사십 마리가 실을 짐
  lexicon: HALOT
  rationale: '''분량''으로 무게·양의 총량을 자연스럽게 전달하되, 마소라 본문의 숫자와 운반 규모를 그대로 반영했습니다.'
- source_word: בִּנְךָ
  english_pob_choice: Your son
  chosen_korean: 왕의 아들
  alternatives_korean:
  - 당신의 아들
  - 임금님의 아들
  lexicon: HALOT
  rationale: 히브리어의 직역은 '당신의 아들'이지만, 여기서는 아람 왕 벤하닷을 가리키는 왕실적 경어를 한국어에서 가장 자연스럽게 드러내는 표현으로 풀었습니다.
- source_word: הַאֶחְיֶה
  english_pob_choice: Will I recover
  chosen_korean: 제가 이 병에서 낫겠습니까?
  alternatives_korean:
  - 제가 이 병에서 회복하겠습니까?
  - 제가 이 병으로 살아남겠습니까?
  lexicon: HALOT
  rationale: 문맥상 생존 여부보다 병에서의 회복을 묻는 말이므로, 현대 독자가 즉시 이해할 수 있는 '낫겠습니까'로 옮겼습니다.
theological_decisions:
- issue: '''Your son''의 공손한 자기비하 표현을 어떻게 처리할 것인가'
  chosen_reading: 본문은 벤하닷이 엘리사를 향해 사용하는 예우적 표현으로 읽고, 한국어 본문에서는 '왕의 아들'로 옮기되 후주로 문자적 '아들'의 함의를 남겼습니다.
  alternative_readings:
  - 당신의 아들
  - 당신의 종
  rationale: 히브리어 בִּנְךָ는 실제 혈연관계라기보다 상급자에게 대한 겸손한 호칭이므로, 의미를 흐리지 않으면서도 한국어에서 왕실적 공손함이 드러나게 했습니다.
  doctrine_reference: 사회적-화용적 표현에 대한 본문 충실성
