revisions:
- from: 그러나 야훼께서는 유다를 멸하시려 하지 않으셨습니다[a]. 이는 그의 종 다윗을 생각하셨기 때문이며[b], 그가 다윗에게 말씀하신 대로 그의 아들들을 위하여 모든 날 동안 등불을 주시려는 것이었습니다.
  to: 그러나 야훼께서는 그의 종 다윗을 위하여 유다를 멸하시려 하지 않으셨습니다[a]. 이는 그분께서 다윗에게 말씀하신 대로, 그에게 그의 아들들을 위하여 모든 날 동안 등불을[b] 주실 것이라고 하셨기 때문입니다.
  rationale: 원문의 대조(그러나), 하나님의 의지의 부정(멸하시려 하지 않으셨습니다), 다윗을 위한 동기, 그리고 다윗에게 하신 약속의 내용을 보존했습니다. ‘그의 종 다윗을 위하여’로 직역적 관계를 회복했으며, ‘등불’의 비유는 본문에서 유지하고 주석으로만 설명했습니다. ‘그에게 … 그의 아들들을 위하여’는 히브리어의 수여 대상과 아들들을 위한 지속을 모두 보존하기 위해 유지했습니다.
