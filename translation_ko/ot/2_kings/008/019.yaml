source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֤ה יְהוָה֙ לְ/הַשְׁחִ֣ית אֶת יְהוּדָ֔ה לְמַ֖עַן דָּוִ֣ד עַבְדּ֑/וֹ כַּ/אֲשֶׁ֣ר אָֽמַר ל֗/וֹ לָ/תֵ֨ת ל֥/וֹ נִ֛יר לְ/בָנָ֖י/ו כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/019.yaml
  text: Yet Yahweh was not willing to destroy Judah[a], for the sake of David his servant[b], just as he had said to him that he would give him a lamp for his sons all the days.
  footnotes:
  - marker: a
    text: Or 'promised him.'
    reason: lexical_alternative
  - marker: b
    text: '''Lamp'' is a royal image for the continuing Davidic line or dynasty.'
    reason: cultural_note
translation:
  language: ko
  text: 그러나 야훼께서는 그의 종 다윗을 위하여 유다를 멸하시려 하지 않으셨습니다[a]. 이는 그분께서 다윗에게 말씀하신 대로, 그에게 그의 아들들을 위하여 모든 날 동안 등불을[b] 주실 것이라고 하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸하시기를 원하지 않으셨습니다.’
    reason: lexical_alternative
  - marker: b
    text: ‘등불’은 다윗 왕조가 계속 이어짐을 나타내는 왕실의 비유입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְלֹא אָבָה
  english_pob_choice: was not willing
  chosen_korean: 멸하시려 하지 않으셨습니다
  alternatives_korean:
  - 멸하려 하지 않으셨습니다
  - 멸하기를 원치 않으셨습니다
  - 멸하시려는 뜻이 없으셨습니다
  lexicon: HALOT
  rationale: אָבָה는 단순한 미래 거부보다 의지·동의의 부정을 나타내므로, 하나님의 의도와 결정을 드러내는 표현으로 옮겼습니다.
- source_word: לְהַשְׁחִית אֶת יְהוּדָה
  english_pob_choice: to destroy Judah
  chosen_korean: 유다를 멸하시려
  alternatives_korean:
  - 유다를 멸하시려
  - 유다를 파멸시키려
  - 유다를 멸망시키려
  lexicon: HALOT
  rationale: שׁחת의 파괴적 심판 의미를 살리되, 한국어에서는 ‘멸하다’가 가장 간결하고 본문 맥락에 맞는 강도를 전달합니다.
- source_word: לְמַעַן דָּוִד עַבְדּוֹ
  english_pob_choice: for the sake of David his servant
  chosen_korean: 그의 종 다윗을 생각하셨기 때문이며
  alternatives_korean:
  - 그의 종 다윗을 위하여
  - 그의 종 다윗 때문에
  - 그의 종 다윗을 위해서
  lexicon: HALOT
  rationale: לְמַעַן은 단순 원인보다 ‘~을 고려하여/생각하여’의 동기를 나타내므로, 언약적 배려를 드러내는 한국어로 옮겼습니다.
- source_word: נִיר
  english_pob_choice: a lamp
  chosen_korean: 등불
  alternatives_korean:
  - 등불
  - 램프
  - 촛불
  lexicon: HALOT
  rationale: 한국어에서 נִיר의 왕조적 이미지에 대응하는 가장 자연스러운 기본어는 ‘등불’이며, 문자적 이미지도 보존합니다.
- source_word: לְבָנָיו כָּל הַיָּמִים
  english_pob_choice: for his sons all the days
  chosen_korean: 그의 아들들을 위하여 모든 날 동안
  alternatives_korean:
  - 그의 아들들을 위해 모든 날 동안
  - 그의 아들들을 위한 모든 날 동안
  - 그의 아들들을 위하여 영원히
  lexicon: HALOT
  rationale: 직역적으로는 ‘그의 아들들을 위하여 모든 날 동안’이며, 왕조의 지속을 암시하되 ‘영원히’로 과잉 해석하지 않도록 했습니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 본 프로젝트의 기본 원칙에 따라 여호와 대신 고유명사 야훼를 사용하여 하나님의 이름을 가립니다. 다만 한국어 독자에게 낯설 수 있으므로 문맥은 자연스럽게 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 다윗 언약의 ‘등불’ 은유
  chosen_reading: 등불
  alternative_readings:
  - 왕조
  - 계보
  - 빛
  rationale: 열왕기 문맥에서 ‘등불’은 다윗 계열의 지속을 가리키는 구체적 왕조 은유이므로, 추상화하지 않고 이미지 자체를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
