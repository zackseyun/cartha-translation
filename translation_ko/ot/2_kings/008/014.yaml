base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/014.yaml
  text: So he went away from Elisha and came to his master[a], who said to him, “What did Elisha say to you?” And he said, “He told me, ‘You will surely recover.’”
  footnotes:
  - marker: a
    text: 'Or, “He said to me, ‘You shall surely live.’” The Hebrew literally repeats the verb for emphasis: “living, you will live.” In context this refers to recovery from illness.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 엘리사에게서 떠나가서 그의 주인에게 이르렀습니다. 그의 주인이 그에게 말했습니다. “엘리사가 당신에게 뭐라고 했습니까?” 그가 대답했습니다. “그가 저에게 말하기를, ‘당신은 반드시 회복될 것입니다’라고 했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그가 저에게 말하기를, ‘당신은 반드시 살아 있을 것입니다’라고 했습니다.” 히브리어는 강조를 위해 동사를 반복하여, 문자적으로는 “살아, 당신은 살 것입니다”에 가깝습니다. 문맥상 병에서의 회복을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מֵאֵת אֱלִישָׁע
  english_pob_choice: went away from Elisha
  chosen_korean: 엘리사에게서 떠나가서
  alternatives_korean:
  - 엘리사에게서 갔습니다
  - 엘리사에게서 떠났습니다
  lexicon: HALOT
  rationale: הלך의 진행과 מֵאֵת의 분리를 함께 살려, 단순한 이동보다 ‘떠나감’을 드러내면서도 한국어 문장 흐름은 자연스럽게 맞췄습니다.
- source_word: אֲדֹנָיו
  english_pob_choice: his master
  chosen_korean: 그의 주인
  alternatives_korean:
  - 그의 주님
  - 그의 상전
  lexicon: HALOT
  rationale: 여기서는 신적 호칭이 아니라 하사엘의 인간 상관을 가리키므로, 오해를 피하고 사회적 관계를 분명히 하는 ‘주인’이 가장 적절합니다.
- source_word: חָיֹה תִחְיֶה
  english_pob_choice: You will surely recover
  chosen_korean: 당신은 반드시 회복될 것입니다
  alternatives_korean:
  - 당신은 반드시 살 것입니다
  - 당신은 틀림없이 회복될 것입니다
  lexicon: HALOT
  rationale: 히브리어의 강조 반복을 ‘반드시’로 살렸고, 병이 낫는 문맥이므로 직역적인 ‘살다’보다 ‘회복되다’가 본뜻을 더 분명히 전달합니다.
theological_decisions:
- issue: אֲדֹנָיו의 호칭 처리
  chosen_reading: 인간 상관을 뜻하는 ‘그의 주인’으로 번역해, 본문에 없는 신적 호칭을 피했습니다.
  alternative_readings:
  - 그의 주님
  - 그의 상전
  rationale: 본문은 궁정 관계를 말할 뿐이며, 한국어에서 ‘주님’은 신앙적 뉘앙스를 강하게 띠므로 의미 혼동을 줄이기 위해 사회적 호칭을 선택했습니다.
  doctrine_reference: 'Translation philosophy: context-driven rendering of titles without importing theological title usage where the source is non-divine.'
