  naturalness: ‘떠나가서’와 ‘이르렀습니다’의 결합, 그리고 반복된 ‘그의 주인’은 현대 한국어에서는 다소 경직됩니다. ‘떠나 그의 주인에게 갔습니다’, ‘주인이 그에게 물었습니다’ 및 간결한 직접 인용이 현대적이면서도 합쇼체 문체에 적합합니다. 대화에서 ‘당신’은 한국어에서 불필요하게 대립적이거나 어색하게 들릴 수 있으므로 문어적 존칭인 ‘그대’를 사용했습니다.
