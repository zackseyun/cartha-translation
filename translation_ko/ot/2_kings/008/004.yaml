reference: 2 Kings 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מֶּ֗לֶךְ מְדַבֵּר֙ אֶל גֵּ֣חֲזִ֔י נַ֥עַר אִישׁ הָ/אֱלֹהִ֖ים לֵ/אמֹ֑ר סַפְּרָ/ה נָּ֣א לִ֔/י אֵ֥ת כָּל הַ/גְּדֹל֖וֹת אֲשֶׁר עָשָׂ֥ה אֱלִישָֽׁע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/008/004.yaml
  text: Now the king was speaking with Gehazi[a], the servant of the man of God, saying, “Please tell me all the great things that Elisha has done.”
  footnotes:
  - marker: a
    text: Or 'the attendant of the man of God' or 'the young man of the man of God'; the Hebrew נַעַר can denote a servant, attendant, or youth depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 왕은 하나님의 사람의 종[a]인 게하시에게 이렇게 말하고 있었습니다. “부디 엘리사가 행한 모든 큰일을 내게 들려주십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님의 사람의 시종’ 혹은 ‘하나님의 사람의 젊은이’로 옮길 수 있습니다. 히브리어 נַעַר는 문맥에 따라 종, 시종, 젊은이를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ / מְדַבֵּר
  english_pob_choice: Now the king was speaking
  chosen_korean: 이제 왕은 … 이야기하고 있었습니다
  alternatives_korean:
  - 그리고 왕은 … 말하고 있었습니다
  - 이제 왕이 … 말하고 있었습니다
  lexicon: HALOT
  rationale: 서두의 וְ는 서사 진행을 여는 흐름으로 보고 ‘이제’로 옮겼고, 분사형 מְדַבֵּר은 장면 설정의 진행상으로 표현해 ‘이야기하고 있었습니다’로 자연스럽게 반영했습니다.
- source_word: גֵּחֲזִי
  english_pob_choice: Gehazi
  chosen_korean: 게하시
  alternatives_korean:
  - 게하시
  - 게하이지
  lexicon: 고유명사 관행
  rationale: 성경에서 통용되는 인명 표기를 따랐습니다.
- source_word: נַעַר אִישׁ הָאֱלֹהִים
  english_pob_choice: the servant of the man of God
  chosen_korean: 하나님의 사람의 종
  alternatives_korean:
  - 하나님의 사람의 시종
  - 하나님의 사람의 젊은이
  lexicon: HALOT
  rationale: נַעַר의 문맥상 기능은 엘리사에게 속한 수행인/종에 가깝기 때문에, 관계를 드러내는 ‘종’으로 옮겨 영어 POB의 기능적 판단을 반영했습니다.
- source_word: סַפְּרָה נָּא לִי
  english_pob_choice: Please tell me
  chosen_korean: 부디 … 말해 보십시오
  alternatives_korean:
  - 부디 … 들려주십시오
  - 제발 … 말해 주십시오
  lexicon: HALOT
  rationale: ספר의 ‘말하다/전하다’ 뜻과 נָא의 정중한 요청을 살려, 현대 한국어에서 자연스러운 공손 명령형으로 옮겼습니다.
- source_word: כָּל הַגְּדֹלוֹת
  english_pob_choice: all the great things
  chosen_korean: 모든 큰일
  alternatives_korean:
  - 모든 위대한 일
  - 모든 큰 사건
  lexicon: HALOT
  rationale: הַגְּדֹלוֹת는 단순한 크기보다 ‘주목할 만한 큰 일들’을 가리키므로, 한국어에서는 관용적으로 ‘큰일’로 압축해 소식의 성격을 보존했습니다.
theological_decisions:
- issue: 왕의 직접 요청의 높임 표현
  chosen_reading: 왕의 말은 제3자 서술이지만, 상대방에게 전하는 요청은 공손한 높임말로 처리했습니다.
  alternative_readings:
  - 평서체로만 직역하기
  - 더 격식을 낮춘 명령형으로 옮기기
  rationale: 원문의 예의 있는 간청을 한국어에서 자연스럽게 드러내기 위해 ‘부디 … 말해 보십시오’로 옮겼습니다. 이는 왕의 위엄을 약화시키지 않으면서도 נָא의 요청성을 살립니다.
  doctrine_reference: 화용적 높임/서술 균형
