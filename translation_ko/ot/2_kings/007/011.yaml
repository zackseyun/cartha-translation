translation:
  language: ko
  text: 그러자 성문지기들이 외쳐, 왕궁 안쪽으로 그 소식을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘왕의 집 안쪽으로’입니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּקְרָא
  english_pob_choice: called out
  chosen_korean: 부르고
  alternatives_korean:
  - 불러
  - 외치고
  - 소리치고
  lexicon: HALOT
  rationale: 성문지기들이 소식을 알리기 위해 크게 호출하는 동작을 나타내므로, 단순한 ‘부르다’보다 행위성을 살리되 현대 한국어에 자연스러운 ‘부르고’로 옮겼습니다.
- source_word: הַשֹּׁעֲרִים
  english_pob_choice: the gatekeepers
  chosen_korean: 성문지기들
  alternatives_korean:
  - 문지기들
  - 문을 지키는 사람들
  - 성문을 지키는 사람들
  lexicon: HALOT
  rationale: 문맥상 성문을 맡은 사람들을 가리키므로, ‘성문지기들’이 가장 직접적이고 본문 기능도 잘 드러냅니다.
- source_word: וַיַּגִּידוּ
  english_pob_choice: reported it
  chosen_korean: 보고하였습니다
  alternatives_korean:
  - 알렸습니다
  - 전했습니다
  - 보고했습니다
  lexicon: HALOT
  rationale: נגד의 ‘알리다/보고하다’ 의미를 살려, 단순 전달보다 위쪽으로 소식을 올리는 행정적 뉘앙스를 반영했습니다.
- source_word: פְּנִימָה
  english_pob_choice: inside
  chosen_korean: 왕궁 안으로
  alternatives_korean:
  - 안으로
  - 내부로
  - 궁 안으로
  lexicon: HALOT
  rationale: 히브리어가 ‘집의 안쪽/내부로’라는 방향성을 나타내므로, 한국어에서는 보고가 향하는 장소를 분명히 한 ‘왕궁 안으로’로 옮겼습니다.
theological_decisions:
- issue: בֵּית הַמֶּלֶךְ의 공간 표현
  chosen_reading: ‘왕궁’으로 기능을 드러내되, ‘안으로’로 פנימה의 방향성을 유지했습니다.
  alternative_readings:
  - ‘왕의 집 안으로’
  - ‘왕궁 내부로’
  - ‘왕의 집 안쪽으로’
  rationale: 히브리어는 직역하면 ‘왕의 집’이지만, 한국어에서는 이 표현이 어색할 수 있어 기능적으로는 왕궁을 가리키는 것으로 이해하되, 원문의 내부 방향성을 보존했습니다.
  doctrine_reference: 본문의 서술적 공간 표현을 자연스럽게 전달하는 문제
