base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/020.yaml
  text: 'And so it happened to him: the people trampled him in the gate[b][a], and he died.'
  footnotes:
  - marker: a
    text: Or 'And it was so for him,' meaning that events happened exactly as previously foretold.
    reason: lexical_alternative
  - marker: b
    text: Or 'at the gate' or 'in the gateway.' The Hebrew term can refer to the city gate area or gateway complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그래서 그대로 그에게 일어났습니다. 사람들이 그를 성문에서 짓밟았고, 그는 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 그렇게 일어났습니다.’ 이는 앞서 말해진 대로 일이 정확히 이루어졌다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘성문에서’ 혹은 ‘성문 어귀에서’. 히브리어는 성문 공간 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ כֵן
  english_pob_choice: And so it happened to him
  chosen_korean: 그래서 그대로 그에게 일어났습니다
  alternatives_korean:
  - 그에게 그렇게 일어났습니다
  - 그리고 그에게 그런 일이 일어났습니다
  lexicon: HALOT
  rationale: כֵן을 단순한 ‘그렇게’보다 ‘그대로’로 옮기면 앞서 선포된 말의 성취라는 뉘앙스를 자연스럽게 살리면서도 과잉 해설을 피할 수 있습니다.
- source_word: וַיִּרְמְסוּ
  english_pob_choice: trampled
  chosen_korean: 짓밟았고
  alternatives_korean:
  - 밟아 짓눌렀고
  - 짓밟아 버렸고
  lexicon: HALOT
  rationale: רמס의 핵심 의미는 ‘발로 짓밟다’이므로, 한국어에서도 가장 직접적인 동사인 ‘짓밟다’를 택했습니다.
- source_word: בַּשַּׁעַר
  english_pob_choice: in the gate
  chosen_korean: 성문에서
  alternatives_korean:
  - 성문 안에서
  - 문에서
  - 성문 어귀에서
  lexicon: HALOT
  rationale: שַׁעַר은 성문과 그 주변의 출입 공간을 가리킬 수 있으나, 문맥상 군중이 몰린 현장을 자연스럽게 드러내는 ‘성문에서’가 가장 무난합니다.
- source_word: וַיָּמֹת
  english_pob_choice: and he died
  chosen_korean: 그는 죽었습니다
  alternatives_korean:
  - 그리고 죽었습니다
  - 그리하여 죽었습니다
  lexicon: HALOT
  rationale: 단순한 서술형 완료를 한국어 합쇼체로 직역에 가깝게 옮겨, 결과를 지나치게 해설하지 않도록 했습니다.
theological_decisions:
- issue: 예언 성취의 함의
  chosen_reading: 본문은 직접적으로 해설하지 않고, 사건이 예언대로 정확히 이루어졌음을 서술적으로 드러내는 방식으로 옮겼습니다.
  alternative_readings:
  - ‘심판이 그에게 임했습니다’처럼 더 신학적으로 풀 수 있습니다.
  rationale: 이 절은 엘리사의 예언 성취와 연결되지만, 본문 자체는 사건을 건조하게 기록합니다. 한국어 본문도 그 서술 형식을 유지하는 편이 원문에 더 충실합니다.
  doctrine_reference: 원문 우선, 서술적 성격 유지, 신학적 해설의 과잉 삽입 회피
