source:
  edition: WLC
  text: אִם אָמַרְנוּ֩ נָב֨וֹא הָ/עִ֜יר וְ/הָ/רָעָ֤ב בָּ/עִיר֙ וָ/מַ֣תְנוּ שָׁ֔ם וְ/אִם יָשַׁ֥בְנוּ פֹ֖ה וָ/מָ֑תְנוּ וְ/עַתָּ֗ה לְכוּ֙ וְ/נִפְּלָה֙ אֶל מַחֲנֵ֣ה אֲרָ֔ם אִם יְחַיֻּ֣/נוּ נִֽחְיֶ֔ה וְ/אִם יְמִיתֻ֖/נוּ וָ/מָֽתְנוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/004.yaml
  text: If we say[a], ‘Let us enter the city,’ the famine is in the city, and we will die there. And if we sit here, we will die. So now, come, let us fall into the camp of Aram. If they let us live, we will live; and if they put us to death[b], we will die.”
  footnotes:
  - marker: a
    text: Or ‘let us surrender to the camp of Aram’ for ‘let us fall into the camp of Aram’; the Hebrew idiom נפל אל can carry the sense of going over or yielding to another force.
    reason: lexical_alternative
  - marker: b
    text: ‘Aram’ is the Hebrew name often rendered ‘Syria’ or ‘the Arameans.’
    reason: cultural_note
translation:
  language: ko
  text: 만일 우리가 말하기를 ‘우리가 성읍으로 들어가자’ 하면, 성읍 안에 기근이 있으니, 거기서 죽을 것입니다. 또 우리가 여기 앉아 있으면, 우리도 죽을 것입니다. 그러니 이제 오십시오. 우리가 아람 진영으로 가 봅시다. 그들이 우리를 살려 주면 우리가 살 것이고, 그들이 우리를 죽이면 우리는 죽을 것입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 נפל אל은 ‘~에게로 떨어지다’의 문자적 뜻을 넘어, 군사적 맥락에서는 다른 편으로 ‘넘어가다’ 또는 ‘항복하다’는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 아람은 히브리어 지명 אֲרָם으로, 문맥에 따라 ‘시리아’ 또는 ‘아람인들’로 옮길 수도 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אִם אָמַרְנוּ / נָב֨וֹא
  english_pob_choice: If we say, ‘Let us enter the city,’
  chosen_korean: 만일 우리가 말하기를 ‘우리가 성읍으로 들어가자’
  alternatives_korean:
  - 우리가 성읍으로 들어가자고 말하면
  - 만일 우리가 ‘성읍으로 들어가자’ 하고 말하면
  lexicon: WLC; HALOT
  rationale: 조건문 안의 직접화법으로 처리해, 제안/결의의 뉘앙스를 살리면서도 한국어에서는 자연스럽게 ‘들어가자’로 옮겼습니다.
- source_word: הָעִיר / הָרָעָב
  english_pob_choice: the city / the famine
  chosen_korean: 성읍 / 기근
  alternatives_korean:
  - 그 도시 / 굶주림
  - 성읍 / 흉년
  lexicon: WLC; HALOT
  rationale: עִיר은 일반명사로서 ‘성읍’이 문맥상 적절하고, רָעָב은 단순한 배고픔이 아니라 포위 상황의 ‘기근’이므로 그 강도를 유지했습니다.
- source_word: יָשַׁבְנוּ פֹה
  english_pob_choice: we sit here
  chosen_korean: 우리가 여기 앉아 있으면
  alternatives_korean:
  - 우리가 여기 머물면
  - 우리가 여기 그대로 있으면
  lexicon: WLC; HALOT
  rationale: ישב의 구체성을 살리면서도 한국어에서는 현재 상태의 지속을 자연스럽게 표현하기 위해 ‘앉아 있으면’으로 옮겼습니다.
- source_word: וְנִפְּלָה אֶל מַחֲנֵה אֲרָם
  english_pob_choice: let us fall into the camp of Aram
  chosen_korean: 우리가 아람 진영으로 가 봅시다
  alternatives_korean:
  - 우리가 아람 진영으로 떨어져 들어갑시다
  - 우리가 아람 진영에 항복합시다
  lexicon: WLC; HALOT
  rationale: נפל אל의 관용적 의미가 ‘넘어가다/의탁하다/항복하다’까지 포함하므로, 한국어에서는 지나치게 직역된 ‘떨어지다’보다 원문의 결단을 살리되 완곡하지 않은 ‘가 봅시다’로 옮겼습니다.
- source_word: יְחַיֻּנוּ / יְמִיתֻנוּ
  english_pob_choice: they let us live / they put us to death
  chosen_korean: 그들이 우리를 살려 주면 / 그들이 우리를 죽이면
  alternatives_korean:
  - 그들이 우리를 살리면 / 그들이 우리를 죽이면
  - 그들이 우리를 살려 두면 / 그들이 우리를 죽이면
  lexicon: WLC; HALOT
  rationale: 히필의 사동성을 살려 ‘살려 주다/죽이다’로 대응했고, 앞뒤의 대구를 맞추어 생존 가능성과 죽음의 대비를 분명히 했습니다.
theological_decisions:
- issue: 아람의 지명 표기
  chosen_reading: ‘아람’으로 음역해 원문 지명을 유지했습니다.
  alternative_readings:
  - ‘시리아’
  - ‘아람인들’
  rationale: 본문의 히브리어는 אֲרָם이며, EN POB도 이를 ‘Aram’으로 유지하므로 지명 자체를 보존하는 것이 원문 추적성과 일관성에 유리합니다.
  doctrine_reference: 지리·역사적 표기 일관성
- issue: נפל אל의 함의
  chosen_reading: 직접적인 ‘항복하다’ 대신, 결단의 흐름을 살린 ‘아람 진영으로 가 봅시다’를 택했습니다.
  alternative_readings:
  - ‘아람 진영에 항복합시다’
  - ‘아람 진영으로 넘어갑시다’
  rationale: 이 동사는 군사적 맥락에서 항복의 뜻을 띨 수 있지만, 본문은 결과를 시험하는 절박한 제안이므로 의미를 과도하게 확정하지 않고 함의는 문맥이 전달하도록 두었습니다.
  doctrine_reference: 본문의 비유적·관용적 표현 보존
