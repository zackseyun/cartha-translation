  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
  footnotes:
  - marker: a
    text: Or “no human voice.” The Hebrew phrase can refer specifically to voice or more broadly to any human sound.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the camp of Aram”; traditionally “the camp of the Syrians.”
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 와서 성읍의 문지기들에게 외치고, 그들에게 이렇게 말했습니다. “우리가 아람의 진영에 갔더니, 보십시오, 거기에는 사람이 아무도 없고 사람의 소리[a]도 없으며, 다만 말들은 묶여 있고 나귀들도 묶여 있으며 천막들은 그대로 있었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사람의 소리”이지만, 여기서는 사람의 말소리뿐 아니라 인간의 존재를 드러내는 모든 소리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  english_pob_choice: the gatekeepers of the city
  chosen_korean: 성읍의 문지기들
  alternatives_korean:
