base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/010.yaml
  text: So they came and called to the gatekeepers of the city[a], and they told them, saying, “We came to the camp of Aram, and behold, there was no one there, no human sound—only the horses tied, and the donkeys tied[b], and the tents as they were.”
  footnotes:
  - marker: a
    text: Or “no human voice.” The Hebrew phrase can refer specifically to voice or more broadly to any human sound.
    reason: lexical_alternative
  - marker: b
    text: Hebrew “the camp of Aram”; traditionally “the camp of the Syrians.”
    reason: alternative_reading
translation:
  language: ko
  text: 그들이 와서 성읍의 문지기들에게 외치고, 그들에게 말하여 이르되, "우리가 아람의 진영에 갔더니, 보십시오, 거기에는 사람이 하나도 없고 사람의 소리도 없으며, 다만 말은 묶여 있고 나귀도 묶여 있으며, 천막들은 그대로였습니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “사람의 소리”이지만, 여기서는 사람의 말소리뿐 아니라 인간의 존재를 드러내는 모든 소리를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁעֵר הָעִיר
  english_pob_choice: the gatekeepers of the city
  chosen_korean: 성읍의 문지기들
  alternatives_korean:
  - 성읍의 파수꾼들
  - 성읍의 문지기
  lexicon: HALOT
  rationale: 히브리어 יח. שֹׁעֵר는 성문을 지키는 사람을 가리키며, 문맥상 집합적 복수로 이해하는 것이 자연스러워 한국어도 복수형으로 옮겼습니다.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  english_pob_choice: and they told them, saying
  chosen_korean: 그들에게 말하여 이르되
  alternatives_korean:
  - 그들에게 보고하여 이르되
  - 그들에게 전하여 이르되
  lexicon: HALOT
  rationale: 히브리어의 보고 공식은 한국어에서 ‘말하여 이르되’가 가장 자연스럽게 반복 구조를 살려 줍니다.
- source_word: מַחֲנֵה אֲרָם
  english_pob_choice: the camp of Aram
  chosen_korean: 아람의 진영
  alternatives_korean:
  - 아람 사람들의 진영
  - 시리아의 진영
  lexicon: HALOT
  rationale: 지명 아람을 직접 살리고, 전통적 ‘시리아’로 바꾸지 않아 원문 고유명을 보존했습니다.
- source_word: וְקוֹל אָדָם
  english_pob_choice: no human sound
  chosen_korean: 사람의 소리도 없으며
  alternatives_korean:
  - 사람의 목소리도 없으며
  - 인간의 소리도 없으며
  lexicon: HALOT
  rationale: קוֹל은 여기서 단순한 ‘목소리’보다 더 넓은 ‘소리’이고, אָדָם은 남성 한 사람보다 인간 일반을 뜻하므로 ‘사람의 소리’가 문맥에 맞습니다.
- source_word: אָסוּר
  english_pob_choice: tied
  chosen_korean: 묶여 있고
  alternatives_korean:
  - 매여 있고
  - 동여매여 있고
  lexicon: HALOT
  rationale: 가축이 진영에서 묶인 상태를 가리키므로 ‘묶여 있다’가 가장 평이하고 정확합니다.
theological_decisions:
- issue: 아람의 진영을 가리키는 역사적·지리적 표현
  chosen_reading: ‘아람’으로 직역해 원문 지명을 유지했습니다.
  alternative_readings:
  - 전통적으로 익숙한 ‘시리아’로 옮김
  rationale: 본문은 고유명 아람을 사용하므로, 역사적 배경을 흐리지 않도록 그대로 옮겼습니다.
  doctrine_reference: 본문의 고유명사 보존 원칙
