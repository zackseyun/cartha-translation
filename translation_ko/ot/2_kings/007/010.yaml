  lexicon: HALOT
  rationale: 히브리어 יח. שֹׁעֵר는 성문을 지키는 사람을 가리키며, 문맥상 집합적 복수로 이해하는 것이 자연스러워 한국어도 복수형으로 옮겼습니다.
- source_word: וַיַּגִּידוּ לָהֶם לֵאמֹר
  english_pob_choice: and they told them, saying
  chosen_korean: 그들에게 말하여 이르되
  alternatives_korean:
