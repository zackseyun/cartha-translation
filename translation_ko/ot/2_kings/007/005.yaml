source:
  edition: WLC
  text: וַ/יָּק֣וּמוּ בַ/נֶּ֔שֶׁף לָ/ב֖וֹא אֶל מַחֲנֵ֣ה אֲרָ֑ם וַ/יָּבֹ֗אוּ עַד קְצֵה֙ מַחֲנֵ֣ה אֲרָ֔ם וְ/הִנֵּ֥ה אֵֽין שָׁ֖ם אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/005.yaml
  text: So they arose at twilight to go to the camp of Aram. When they came to the edge of the camp of Aram[a], behold, there was no one there.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'there was no one there.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 황혼에 아람 진영으로 가려고 일어났습니다. 아람 진영 가장자리에 이르러 보니, 그곳에는 아무도 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּק֣וּמוּ
  english_pob_choice: So they arose
  chosen_korean: 그들은 … 일어나
  alternatives_korean:
  - 그들은 … 일어났습니다
  - 그들은 … 기상했습니다
  lexicon: HALOT
  rationale: wayyiqtol의 서사 전진을 한국어로 자연스럽게 살리되, 현대 문체에 맞는 ‘일어나’를 사용했습니다.
- source_word: בַּנֶּשֶׁף
  english_pob_choice: at twilight
  chosen_korean: 황혼에
  alternatives_korean:
  - 해질 무렵에
  - 어스름에
  lexicon: HALOT
  rationale: 문맥상 어두워지기 직전의 때를 가리키므로, 간결하고 자연스러운 ‘황혼에’가 적절합니다.
- source_word: מַחֲנֵה אֲרָם
  english_pob_choice: the camp of Aram
  chosen_korean: 아람 진
  alternatives_korean:
  - 아람의 진영
  - 아람 진영
  lexicon: HALOT
  rationale: 히브리어 소유구문을 간명하게 옮겨 고유명 ‘아람’을 유지하면서, 진(진영)의 의미를 살렸습니다.
- source_word: וְהִנֵּה
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: HALOT
  rationale: 놀라운 발견을 알리는 담화 표지이므로, 단순 접속어보다 주의를 환기하는 감탄형 표현을 택했습니다.
- source_word: אֵין שָׁם אִישׁ
  english_pob_choice: there was no man there
  chosen_korean: 거기에는 아무도 없었습니다
  alternatives_korean:
  - 거기에는 사람이 없었습니다
  - 거기에는 남자가 없었습니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘한 남자도 없다’이지만, 여기서는 존재 부재를 한국어로 가장 자연스럽게 드러내는 ‘아무도 없었습니다’가 적절합니다.
theological_decisions:
- issue: אִישׁ의 성별 표지와 한국어 자연성
  chosen_reading: ‘거기에는 아무도 없었습니다’로 의미를 옮기되, 남성형 명사의 형식은 주석화하지 않고 본문에서 자연스럽게 처리했습니다.
  alternative_readings:
  - ‘거기에는 남자가 없었습니다’
  - ‘거기에는 한 사람도 없었습니다’
  rationale: 이 구절의 핵심은 진영의 비어 있음이며, 독자에게는 사람의 부재가 전달되면 충분합니다. 한국어에서는 성별 표지를 본문에 유지할 실익이 크지 않습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
