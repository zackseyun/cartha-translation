  rationale: 본문의 관용적 칭호를 직접 옮겨 ‘선지자’로 해석해 좁히지 않았습니다.
- source_word: סָאתַיִם / וּסְאָה
  english_pob_choice: Two seahs ... one seah
  chosen_korean: 보리 두 세아 ... 고운 가루 한 세아
  alternatives_korean:
