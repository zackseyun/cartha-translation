id: 2KI.7.18
reference: 2 Kings 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/דַבֵּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֶל הַ/מֶּ֖לֶךְ לֵ/אמֹ֑ר סָאתַ֨יִם שְׂעֹרִ֜ים בְּ/שֶׁ֗קֶל וּֽ/סְאָה סֹ֨לֶת֙ בְּ/שֶׁ֔קֶל יִהְיֶה֙ כָּ/עֵ֣ת מָחָ֔ר בְּ/שַׁ֖עַר שֹׁמְרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/018.yaml
  text: And it happened just as the man of God had spoken to the king[a], saying, “Two seahs of barley for a shekel, and one seah of fine flour for a shekel[b], will be about this time tomorrow in the gate of Samaria.”
  footnotes:
  - marker: a
    text: 'A seah was an ancient dry measure. The Hebrew names the units directly: two seahs of barley and one seah of fine flour.'
    reason: cultural_note
  - marker: b
    text: Or “at the gate of Samaria.” The city gate was the public place of trade and judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 하나님의 사람이 왕에게 말했던 그대로 이루어졌습니다. 곧 「보리 두 세아가 한 세겔, 고운 가루 한 세아가 한 세겔이 내일 이맘때 사마리아 성문에서 있을 것입니다」라고 말한 대로입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  english_pob_choice: And it happened
  chosen_korean: 이루어졌습니다
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리고 그렇게 되었습니다
  lexicon: WLC/HALOT
  rationale: 서술적 성취를 나타내는 도입형식으로, 예언 성취 문맥을 분명하게 살리면서도 현대 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 종
  - 선지자
  lexicon: WLC/HALOT
  rationale: 본문의 관용적 칭호를 직접 옮겨 ‘선지자’로 해석해 좁히지 않았습니다.
- source_word: סָאתַיִם / וּסְאָה
  english_pob_choice: Two seahs ... one seah
  chosen_korean: 보리 두 세아 ... 고운 가루 한 세아
  alternatives_korean:
  - 보리 두 되 ... 고운 가루 한 되
  - 보리 두 측량 ... 고운 가루 한 측량
  lexicon: WLC/HALOT
  rationale: 히브리어의 구체적 부피 단위를 보존해 경제적 수량의 정확성을 살렸고, 영어 POB의 문화적 주석을 본문으로 흡수하지 않았습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 밀가루
  - 정선한 가루
  lexicon: WLC/HALOT
  rationale: 일반적인 ‘가루’보다 정제된 곡물가루라는 의미를 반영해 ‘고운 가루’로 옮겼습니다.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  english_pob_choice: in the gate of Samaria
  chosen_korean: 사마리아 성문에서
  alternatives_korean:
  - 사마리아 문에서
  - 사마리아 성문 안에서
  lexicon: WLC/HALOT
  rationale: 히브리어의 장소 관용구를 한국어로 자연스럽게 옮기면서, 거래와 공적 판결이 이루어지는 성문이라는 배경을 유지했습니다.
theological_decisions:
- issue: 예언 성취 문장의 서술 방식
  chosen_reading: ‘이루어졌습니다’와 뒤따르는 인용을 써서, 말한 대로 실제로 성취되었음을 서두에서 분명히 드러냈습니다.
  alternative_readings:
  - ‘있었습니다’로 중립적으로 처리
  - ‘그대로였습니다’로 완곡하게 처리
  rationale: 본문은 단순한 과거 사건이 아니라 예언의 실현을 강조하므로, 성취성을 분명히 드러내는 번역이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: 예언 성취와 하나님의 신실하심
