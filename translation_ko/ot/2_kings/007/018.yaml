  terminology: ‘하나님의 사람’, ‘세아’, ‘세겔’, ‘고운 가루’, ‘사마리아 성문’은 모두 적절합니다. ‘세아’는 낯선 고대 부피 단위이므로 첫 언급에 간단한 문화 주석을 다는 것이 유익합니다. 원문은 성문 ‘안에서/에서’라는 관용적 장소 표현이며, ‘사마리아 성문에서’는 충분히 적절합니다.
