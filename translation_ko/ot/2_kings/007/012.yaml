base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/012.yaml
  text: Then the king arose in the night and said to his servants[a], “Let me tell you, please, what Aram has done to us. They know that we are hungry, so they have gone out from the camp to hide themselves in the field, saying, ‘When they come out from the city, we will seize them alive and enter the city.’”
  footnotes:
  - marker: a
    text: Or “the Arameans.” The Hebrew uses the place/name Aram for the people or army of Aram.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 밤에 일어나 자기 신하들에게 말했습니다. “아람[a]이 우리에게 무슨 일을 했는지 내가 여러분에게 알려 주겠습니다. 그들은 우리가 굶주리고 있는 것을 알고서 진영에서 나가 들판에 몸을 숨겼습니다. 이렇게 말한 것입니다. ‘그들이 성에서 나오면, 우리가 그들을 산 채로 사로잡고 성으로 들어갑시다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 민족/지역명 ‘아람’을 사용합니다. 문맥상 아람 사람들 또는 아람 군대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הַמֶּלֶךְ
  english_pob_choice: the king arose
  chosen_korean: 왕이 ... 일어나
  alternatives_korean:
  - 왕이 ... 일어났다
  - 왕이 ... 일어났습니다
  lexicon: HALOT
  rationale: 서사 동작을 자연스럽게 살리면서도 고어적 울림을 피하기 위해 '일어나'를 썼습니다. 다만 문장 전체는 합쇼체로 정리했습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 자기 신하들
  alternatives_korean:
  - 그의 종들
  - 그의 시종들
  lexicon: HALOT
  rationale: 왕궁 맥락에서 עבד는 단순한 가사 '종'보다 왕을 보좌하는 신하/시종의 뉘앙스가 더 자연스럽습니다. 여기서는 직역보다 문맥상 기능을 살려 '신하들'로 옮겼습니다.
- source_word: אַגִּידָה נָּא לָכֶם
  english_pob_choice: Let me tell you, please
  chosen_korean: 내가 여러분에게 좀 말하겠습니다
  alternatives_korean:
  - 제가 여러분에게 말씀드리겠습니다
  - 내가 여러분에게 알려 드리겠습니다
  lexicon: HALOT
  rationale: 청유형과 나(נא)의 공손함을 현대 한국어에서는 완곡한 요청 표현으로 처리했습니다. '좀'은 부담을 낮추는 화용적 기능을 반영합니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 시리아
  - 아람 사람들
  lexicon: HALOT
  rationale: POB의 원칙에 따라 אֲרָם은 지명/민족명으로 '아람'을 유지했습니다. 문맥상 집단을 가리키지만 '아람 사람들'로 풀지 않아 원문 호칭을 보존했습니다.
- source_word: וְנִתְפְּשֵׂם חַיִּים
  english_pob_choice: we will seize them alive
  chosen_korean: 우리는 그들을 산 채로 사로잡고
  alternatives_korean:
  - 우리는 그들을 산 채로 붙잡고
  - 우리는 그들을 살아 있는 채로 잡아
  lexicon: HALOT
  rationale: תפשׂ는 전투/포획 맥락에서 '사로잡다'가 가장 적절합니다. חַיִּים은 부사적으로 '산 채로'로 옮겨 포획의 상태를 분명히 했습니다.
theological_decisions:
- issue: 아람의 군사적 의도를 왕의 추정으로 서술하는 방식
  chosen_reading: 직접적인 사실 진술이 아니라 왕이 적의 의도를 추정해 재구성한 발화로 옮겼습니다.
  alternative_readings:
  - 적의 실제 발언처럼 단정적으로 번역
  - 의도 추정을 약화시켜 단순한 서술로 처리
  rationale: 본문은 왕의 해석을 인용문 안에서 전달하므로, 추정성과 계획 진술의 구분을 유지해야 합니다. 이는 서사적 긴장과 화자의 인식을 보존합니다.
  doctrine_reference: 서사 문맥 존중, 화자 관점 보존
