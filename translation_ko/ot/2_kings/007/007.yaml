  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
  footnotes:
  - marker: a
    text: Or 'at dusk' / 'in the twilight.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the camp as it was,' that is, left just as they found it.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'fled to their life,' an idiom meaning 'fled for their lives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 일어나 황혼에 달아났습니다.[a] 그들은 자기들의 천막과 말과 나귀, 곧 진영을 있는 그대로 두고[b] 자기 목숨을 구하려고 달아났습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해질 무렵에’, ‘땅거미가 질 무렵에’, ‘저녁 어스름에’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘진영을 있는 그대로 [두고]’입니다. 곧 서둘러 떠나면서 진영을 손대지 않은 채 남겨 두었다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘자기 목숨을 향해’ 달아났다는 말로, 곧 ‘자기 목숨을 구하려고’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
