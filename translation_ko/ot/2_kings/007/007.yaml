  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּקוּמוּ֮ וַ/יָּנ֣וּסוּ בַ/נֶּשֶׁף֒ וַ/יַּעַזְב֣וּ אֶת אָהֳלֵי/הֶ֗ם וְ/אֶת סֽוּסֵי/הֶם֙ וְ/אֶת חֲמֹ֣רֵי/הֶ֔ם הַֽ/מַּחֲנֶ֖ה כַּ/אֲשֶׁר הִ֑יא וַ/יָּנֻ֖סוּ אֶל נַפְשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/007.yaml
  text: So they arose and fled at twilight[a], and they left their tents, their horses[c][b], their donkeys—the camp as it was—and fled for their lives.
  footnotes:
  - marker: a
    text: Or 'at dusk' / 'in the twilight.'
    reason: lexical_alternative
  - marker: b
    text: Literally, 'the camp as it was,' that is, left just as they found it.
    reason: lexical_alternative
  - marker: c
    text: Literally, 'fled to their life,' an idiom meaning 'fled for their lives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 일어나 황혼에 달아나며, 자기들의 천막과 말들과 나귀들, 곧 진영은 그대로 두고 자기 목숨을 구하려고 달아났습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘해질 무렵에’, ‘땅거미가 질 무렵에’, ‘저녁 어스름에’.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘진영은 그대로였다’, 곧 서둘러 떠나며 아무것도 손대지 않고 남겨 두었다는 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘자기 목숨을 향해’ 달아났다는 말로, 곧 ‘자기 목숨을 구하려고’라는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקוּמוּ
  english_pob_choice: they arose
  chosen_korean: 일어나
  alternatives_korean:
  - 깨어나
  - 자리에서 일어나
  lexicon: HALOT
  rationale: 급박한 도주가 시작되는 동작을 자연스럽게 살리면서, 서술 흐름도 유지합니다.
- source_word: בַנֶּשֶׁף
  english_pob_choice: at twilight
  chosen_korean: 황혼에
  alternatives_korean:
  - 해질 무렵에
  - 땅거미가 질 무렵에
  - 저녁 어스름에
  lexicon: HALOT
  rationale: נֶשֶׁף의 해질 무렵/어스름 의미를 현대 한국어에서 가장 자연스럽게 전달합니다.
- source_word: הַמַּחֲנֶה כַּאֲשֶׁר הִיא
  english_pob_choice: the camp as it was
  chosen_korean: 진영은 그대로 두고
  alternatives_korean:
  - 진영은 있는 그대로 두고
  - 진영은 원래 있던 모습 그대로 두고
  - 진영은 손대지 않은 채
  lexicon: HALOT
  rationale: 문자적으로는 ‘그 진영이 그대로였다’는 뜻이지만, 도주 상황에서는 ‘그대로 두고’가 남겨진 상태를 가장 분명하게 드러냅니다.
- source_word: וַיָּנֻסוּ אֶל נַפְשָׁם
  english_pob_choice: fled for their lives
  chosen_korean: 자기 목숨을 구하려고 달아났습니다
  alternatives_korean:
  - 목숨을 걸고 달아났습니다
  - 살려고 달아났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구의 생명 보존 의미를 살리되, 한국어에서는 목적을 분명히 드러내는 표현이 가장 자연스럽습니다.
theological_decisions:
- issue: 도주 동사의 반복
  chosen_reading: ‘달아나며 … 달아났습니다’로 두 번의 נוּס를 모두 살렸습니다.
  alternative_readings:
  - 첫 번째만 ‘달아나며’로 두고 뒤는 생략
  - 둘을 모두 ‘도망쳤습니다’로 평준화
  rationale: 히브리어는 같은 동사를 반복해 급박함을 강조하므로, 한국어도 반복을 유지해 서술의 긴박감을 보존합니다.
  doctrine_reference: 서사적 강조와 원문 반복의 보존
