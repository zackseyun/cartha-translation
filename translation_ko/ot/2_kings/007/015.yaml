  naturalness: ‘그들을 요단까지 그들을 뒤쫓아갔습니다’는 목적어 반복으로 다소 무겁습니다. ‘그들을 따라 요단까지 갔습니다’가 현대 한국어 합쇼체 서사에서 더 자연스럽습니다. ‘그런데 보니’는 주목을 환기하는 히브리어 담화 표지를 자연스럽게 반영합니다.
