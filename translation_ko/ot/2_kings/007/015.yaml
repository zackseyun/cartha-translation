source:
  edition: WLC
  text: וַ/יֵּלְכ֣וּ אַחֲרֵי/הֶם֮ עַד הַ/יַּרְדֵּן֒ וְ/הִנֵּ֣ה כָל הַ/דֶּ֗רֶךְ מְלֵאָ֤ה בְגָדִים֙ וְ/כֵלִ֔ים אֲשֶׁר הִשְׁלִ֥יכוּ אֲרָ֖ם ב/החפז/ם וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים וַ/יַּגִּ֖דוּ לַ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/015.yaml
  text: So they went after them as far as the Jordan[a], and behold, the whole road was full of garments and equipment that Aram had thrown away in their haste[c][b]. Then the messengers returned and reported to the king.
  footnotes:
  - marker: a
    text: Or 'articles,' 'gear,' or 'supplies' for 'equipment' (Hebrew כֵלִים), a broad term for objects or implements.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; traditionally sometimes rendered 'the Arameans' or 'Syria' in English versions. The translation preserves the source name.
    reason: alternative_reading
  - marker: c
    text: Or 'the scouts returned.' Hebrew מַלְאָכִים more literally means 'messengers,' but in context these are the men sent out to investigate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 그들을 따라 요단까지 갔습니다[a]. 그런데 보니, 온 길이 아람이 급히 내버린 옷과 물품으로 가득 차 있었습니다[b]. 그러자 전령들이 돌아와 왕에게 보고했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 הַיַּרְדֵּן은 요단강을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 히브리어 כֵלִים은 그릇만이 아니라 물건, 도구, 장비까지 아우르는 넓은 말입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘정탐꾼들이 돌아왔다’로 옮길 수 있습니다. 히브리어 מַלְאָכִים은 더 문자적으로는 ‘전령들’을 뜻하지만, 이 문맥에서는 상황을 확인하러 보낸 사람들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ אַחֲרֵיהֶם עַד הַיַּרְדֵּן
  english_pob_choice: So they went after them as far as the Jordan
  chosen_korean: 그들은 요단까지 그들을 뒤쫓아갔습니다
  alternatives_korean:
  - 그들은 요단까지 그들을 따라갔습니다
  - 그들은 요단까지 그들을 추격했습니다
  lexicon: HALOT
  rationale: אַחֲרֵיהֶם은 단순한 뒤따름보다 추적의 흐름이 강하므로, 자연스러운 합쇼체에서 ‘뒤쫓아갔습니다’로 옮겨 추격의 뉘앙스를 살렸습니다.
- source_word: כָל הַדֶּרֶךְ מְלֵאָה בְגָדִים וְכֵלִים
  english_pob_choice: the whole road was full of garments and equipment
  chosen_korean: 온 길이 ... 옷과 물품으로 가득 차 있었습니다
  alternatives_korean:
  - 온 길이 ... 의복과 장비로 가득 차 있었습니다
  - 온 길이 ... 옷가지와 장비로 가득 차 있었습니다
  lexicon: HALOT
  rationale: דֶּרֶךְ은 여기서 추격 경로를 가리키므로 ‘길’로 직역했고, בְגָדִים은 ‘옷’, כֵּלִים은 전리품처럼 흩어진 넓은 범주의 물품을 가리키므로 ‘물품’으로 넓게 살렸습니다.
- source_word: אֲרָם
  english_pob_choice: Aram
  chosen_korean: 아람
  alternatives_korean:
  - 아람 사람들
  - 시리아
  lexicon: HALOT
  rationale: 본문의 מקור명칭을 그대로 유지해 지명·민족명 자체를 보존했습니다. 영어 POB의 처리와도 맞추어 전통적 대체어를 피했습니다.
- source_word: בְּחָפְזָם
  english_pob_choice: in their haste
  chosen_korean: 급히
  alternatives_korean:
  - 서두르며
  - 허둥지둥
  lexicon: HALOT
  rationale: חפז는 공포의 과잉 해석 없이 ‘급함/서두름’을 뜻하므로, 본문의 상황을 드러내되 해석을 덧붙이지 않는 ‘급히’로 처리했습니다.
- source_word: וַיָּשֻׁבוּ הַמַּלְאָכִים וַיַּגִּדוּ לַמֶּלֶךְ
  english_pob_choice: Then the messengers returned and reported to the king
  chosen_korean: 그러자 정탐꾼들이 돌아와 왕에게 보고했습니다
  alternatives_korean:
  - 그러자 전령들이 돌아와 왕에게 보고했습니다
  - 그러자 사자들이 돌아와 왕에게 알렸습니다
  lexicon: HALOT
  rationale: מַלְאָכִים은 기본적으로 ‘사자/전령’이지만, 여기서는 실제로 상황을 확인하러 보낸 사람들로서 ‘정탐꾼’이 문맥상 가장 분명합니다. נגד의 의미도 단순 ‘말하다’보다 ‘보고하다’가 자연스럽습니다.
theological_decisions:
- issue: 사건 전개를 강조하는 담화 표지 וְהִנֵּה
  chosen_reading: ‘보십시오’로 옮겨 독자의 시선을 급전환시키는 효과를 살렸습니다.
  alternative_readings:
  - ‘그리고 보니’
  - ‘보라’
  rationale: וְהִנֵּה는 단순 접속보다 돌발적 주목을 요청하는 표지이므로, 서술의 긴박함을 살리는 한국어 담화 표지로 처리했습니다.
  doctrine_reference: 서사 문맥의 수사적 강조
