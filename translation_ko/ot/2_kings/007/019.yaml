  naturalness: 합쇼체는 일관됩니다. 그러나 직접 인용 안의 ‘그것을 자기 눈으로’는 2인칭 호소 문맥에서 다소 어색하고, ‘당신의 눈으로 직접’이 현대 표준어로 더 자연스럽습니다. 각주 표지는 설명 대상인 ‘창문들’에 붙이는 것이 독자의 이해에 더 분명합니다.
