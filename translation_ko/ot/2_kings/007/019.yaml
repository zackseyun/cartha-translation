base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/019.yaml
  text: Then the officer answered the man of God and said[a], “If Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you will see it with your own eyes, but you will not eat from it.”
  footnotes:
  - marker: a
    text: Or “floodgates in the sky.” The Hebrew literally says “windows in the heavens,” an image for openings in heaven through which provision or judgment might come.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 그 장교가 하나님의 사람에게 대답하여 말했습니다. 「야훼께서 하늘에 창문들을 내신다 해도 이런 일이 일어나겠습니까?」 그러자 그가 말했습니다. 「보십시오. 당신은 그것을 자기 눈으로 보겠지만, 거기서 먹지는 못할 것입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “하늘의 창문들”입니다. 이는 하늘에서 공급이나 심판이 내려오는 문이 열리는 이미지를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  english_pob_choice: the officer
  chosen_korean: 그 장교
  alternatives_korean:
  - 그 관리
  - 그 대장
  - 그 장교
  lexicon: HALOT
  rationale: שָׁלִישׁ은 왕실·군사 고위 관리로 쓰이며, 문맥상 현대 한국어의 ‘장교’가 직책의 위계를 과도하게 좁히지 않으면서 자연스럽게 전달합니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 사람
  - 하나님의 종
  lexicon: HALOT
  rationale: 예언자적 호칭을 직역에 가깝게 유지해 원문의 공식적 칭호를 살렸습니다.
- source_word: עֹשֶׂה אֲרֻבּוֹת בַּשָּׁמַיִם
  english_pob_choice: were making windows in the heavens
  chosen_korean: 하늘에 창문들을 내신다
  alternatives_korean:
  - 하늘의 창문들을 여신다
  - 하늘에 물문들을 내신다
  - 하늘에 창문들을 내신다
  lexicon: HALOT
  rationale: אֲרֻבּוֹת의 기본 이미지를 살려 ‘창문들’로 옮기고, 동작을 ‘내신다’로 표현해 하늘의 개방이라는 원문의 비유를 비교적 직접적으로 보존했습니다.
- source_word: הֲיִהְיֶה כַּדָּבָר הַזֶּה
  english_pob_choice: could this thing happen?
  chosen_korean: 이런 일이 일어나겠습니까?
  alternatives_korean:
  - 이런 일이 가능하겠습니까?
  - 이런 일이 되겠습니까?
  - 이런 일이 일어나겠습니까?
  lexicon: HALOT
  rationale: 의심 어린 수사적 질문을 한국어의 자연스러운 가능성 질문으로 옮겨 원문의 회의적 뉘앙스를 유지했습니다.
- source_word: רֹאֶה בְּעֵינֶיךָ
  english_pob_choice: you will see it with your own eyes
  chosen_korean: 그것을 자기 눈으로 보겠지만
  alternatives_korean:
  - 그것을 직접 보겠지만
  - 그것을 자기 눈으로 보겠지만
  lexicon: HALOT
  rationale: ‘자기 눈으로’는 원문의 강조를 살리며, 예측적 분사 구문을 한국어 미래형으로 자연스럽게 풀었습니다.
- source_word: וּמִשָּׁם לֹא תֹאכֵל
  english_pob_choice: but you will not eat from it
  chosen_korean: 거기서 먹지는 못할 것입니다
  alternatives_korean:
  - 거기서 먹지는 못할 것입니다
  - 그것을 먹지는 못할 것입니다
  - 그 자리에서 먹지는 못할 것입니다
  lexicon: HALOT
  rationale: מִשָּׁם의 ‘거기서/그곳에서’를 살리면서, 한국어에서는 ‘먹다’의 목적어를 생략해도 자연스럽기 때문에 간결하게 처리했습니다.
