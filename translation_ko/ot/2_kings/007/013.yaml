base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/013.yaml
  text: Then one of his servants answered and said[a], “Please let them take five of the horses that remain, which are left in it. Behold, they are like all the multitude of Israel who are left in it; behold, they are like all the multitude of Israel who have perished[b]. So let us send and see.”
  footnotes:
  - marker: a
    text: The Hebrew likely refers to the city of Samaria by the pronoun 'in it,' but the noun itself is not repeated in this verse.
    reason: lexical_alternative
  - marker: b
    text: 'The verse contains a difficult and repetitive Hebrew comparison: ''they are like all the multitude of Israel who are left in it ... like all the multitude of Israel who have perished.'' The translation preserves the repetition rather than smoothing it out.'
    reason: textual_variant
translation:
  language: ko
  text: 그때 그의 종들 가운데 한 사람이 대답하여 말했습니다. “청하건대, 남아 있는 말들 가운데서 다섯 마리를 가져가게 하십시오. 그 성 안에 남아 있는 것들과 같고, 그 성 안에 멸망한 온 이스라엘 무리와도 같으니입니다. 그러니 보내어 보겠습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 이 절에서 성읍 이름을 다시 반복하지 않고 ‘그 안에’라고만 말합니다. 문맥상 사마리아를 가리키지만, 본문 자체의 표현은 유지했습니다.
    reason: source_note
  - marker: b
    text: 히브리어는 같은 어근 שׁאר를 반복하여 ‘남아 있다’와 ‘남은 자들’을 강조합니다. 한국어도 이 반복을 최대한 살렸습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  english_pob_choice: answered and said
  chosen_korean: 대답하여 말했습니다
  alternatives_korean:
  - 응답하여 말했습니다
  - 대답했습니다
  lexicon: HALOT
  rationale: 히브리어 서술 관용구를 자연스러운 한국어 서술로 옮기되, 말하기 동작을 분명히 드러내기 위해 ‘대답하여 말했습니다’를 택했습니다.
- source_word: אֶחָד מֵעֲבָדָיו
  english_pob_choice: one of his servants
  chosen_korean: 그의 종들 가운데 한 사람
  alternatives_korean:
  - 그의 시종들 가운데 한 사람
  - 그의 신하들 가운데 한 사람
  lexicon: HALOT
  rationale: עֲבָדָיו는 왕실 문맥이지만 기본적으로 ‘종들’이 가장 직접적이며, 직분을 과도하게 좁히지 않기 위해 중립적으로 옮겼습니다.
- source_word: וְיִקְחוּ נָא
  english_pob_choice: Please let them take
  chosen_korean: 청하건대 ... 가져가게 하십시오
  alternatives_korean:
  - 부디 ... 데려가게 하십시오
  - 제발 ... 가져가게 하십시오
  lexicon: HALOT
  rationale: 요청의 뉘앙스와 공손함을 함께 살리기 위해 ‘청하건대’와 사역형을 사용했습니다.
- source_word: הַנִּשְׁאָרִים ... נִשְׁאֲרוּ
  english_pob_choice: that remain, which are left in it
  chosen_korean: 남아 있는 말들
  alternatives_korean:
  - 남아 있는 것들
  - 거기에 남아 있는 말들
  lexicon: HALOT
  rationale: 문맥상 남은 것은 말들이므로, 반복되는 שׁאר의 의미를 살려 ‘남아 있는 말들’로 옮겼습니다.
- source_word: הִנָּם כְּכָל ... הִנָּם כְּכָל
  english_pob_choice: Behold, they are like ... behold, they are like
  chosen_korean: 그 성 안에 남아 있는 것들과 같고 ... 그 성 안에 멸망한 온 이스라엘 무리와도 같으니입니다
  alternatives_korean:
  - 보십시오, 그들은 ... 보십시오, 그들은 ...
  - 보라, 그들은 ... 보라, 그들은 ...
  lexicon: HALOT
  rationale: 반복되는 הנה의 주의를 환기하는 기능을 살리되, 한국어에서는 반복 ‘그 성 안에 ...’로 비교 구조를 분명히 드러냈습니다.
- source_word: הָמוֹן יִשְׂרָאֵל
  english_pob_choice: the multitude of Israel
  chosen_korean: 온 이스라엘 무리
  alternatives_korean:
  - 이스라엘의 큰 무리
  - 이스라엘의 무리
  lexicon: HALOT
  rationale: הָמוֹן의 집합적 의미를 살리기 위해 ‘무리’를 유지하고, 전체성을 강조하는 ‘온’을 더했습니다.
- source_word: וְנִשְׁלְחָה וְנִרְאֶה
  english_pob_choice: So let us send and see
  chosen_korean: 그러니 보내어 보겠습니다
  alternatives_korean:
  - 그러니 보내어 보고 오겠습니다
  - 그러니 사람을 보내어 보겠습니다
  lexicon: HALOT
  rationale: 동사의 연속을 한국어에서 간결하게 묶으면서도, 제안의 결의를 담기 위해 ‘보내어 보겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 전쟁·기근 속 관찰자의 냉혹한 비교를 완화하지 않고 전달할지 여부
  chosen_reading: 원문의 반복과 대비를 그대로 살려, 남은 말들과 죽은 이스라엘 무리를 직접 비교하는 냉혹한 논리를 유지했습니다.
  alternative_readings:
  - 비교를 완화해 더 부드럽게 표현하기
  - 의역하여 핵심만 전달하기
  rationale: 이 절의 충격은 반복과 대조에 있으므로, 문체를 매끈하게 다듬어 긴장을 희석하지 않는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: '본문 해석 원리: 문학적 반복 보존'
- issue: ‘그 성 안에’의 명시 여부
  chosen_reading: 히브리어의 여성 단수 대명사 ‘그 안에’를 ‘그 성 안에’로 풀어 주되, 비교의 대상이 사마리아라는 문맥을 과도하게 확장하지는 않았습니다.
  alternative_readings:
  - ‘그 안에’로 직역하기
  - ‘사마리아 성 안에’로 명시하기
  rationale: 대명사의 지시 대상은 문맥상 사마리아이지만, 본절 자체에는 명사가 반복되지 않으므로 본문 근거를 넘지 않는 범위에서만 보충했습니다.
  doctrine_reference: 본문 지시어 해석
