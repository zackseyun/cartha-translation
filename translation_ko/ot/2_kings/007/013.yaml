  lexicon: HALOT
  rationale: 동사의 연속을 한국어에서 간결하게 묶으면서도, 제안의 결의를 담기 위해 ‘보내어 보겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 전쟁·기근 속 관찰자의 냉혹한 비교를 완화하지 않고 전달할지 여부
  chosen_reading: 원문의 반복과 대비를 그대로 살려, 남은 말들과 죽은 이스라엘 무리를 직접 비교하는 냉혹한 논리를 유지했습니다.
  alternative_readings:
  - 비교를 완화해 더 부드럽게 표현하기
  - 의역하여 핵심만 전달하기
  rationale: 이 절의 충격은 반복과 대조에 있으므로, 문체를 매끈하게 다듬어 긴장을 희석하지 않는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: '본문 해석 원리: 문학적 반복 보존'
- issue: ‘그 성 안에’의 명시 여부
  chosen_reading: 히브리어의 여성 단수 대명사 ‘그 안에’를 ‘그 성 안에’로 풀어 주되, 비교의 대상이 사마리아라는 문맥을 과도하게 확장하지는 않았습니다.
  alternative_readings:
  - ‘그 안에’로 직역하기
  - ‘사마리아 성 안에’로 명시하기
  rationale: 대명사의 지시 대상은 문맥상 사마리아이지만, 본절 자체에는 명사가 반복되지 않으므로 본문 근거를 넘지 않는 범위에서만 보충했습니다.
  doctrine_reference: 본문 지시어 해석
