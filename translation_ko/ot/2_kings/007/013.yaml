  lexicon: HALOT
  rationale: 히브리어 서술 관용구를 자연스러운 한국어 서술로 옮기되, 말하기 동작을 분명히 드러내기 위해 ‘대답하여 말했습니다’를 택했습니다.
- source_word: אֶחָד מֵעֲבָדָיו
  english_pob_choice: one of his servants
