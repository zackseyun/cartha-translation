  lexicon: HALOT
  rationale: 문맥상 남은 것은 말들이므로, 반복되는 שׁאר의 의미를 살려 ‘남아 있는 말들’로 옮겼습니다.
- source_word: הִנָּם כְּכָל ... הִנָּם כְּכָל
  english_pob_choice: Behold, they are like ... behold, they are like
  chosen_korean: 그 성 안에 남아 있는 것들과 같고 ... 그 성 안에 멸망한 온 이스라엘 무리와도 같으니입니다
  alternatives_korean:
  - 보십시오, 그들은 ... 보십시오, 그들은 ...
