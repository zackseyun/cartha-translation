  rationale: עֲבָדָיו는 왕실 문맥이지만 기본적으로 ‘종들’이 가장 직접적이며, 직분을 과도하게 좁히지 않기 위해 중립적으로 옮겼습니다.
- source_word: וְיִקְחוּ נָא
  english_pob_choice: Please let them take
  chosen_korean: 청하건대 ... 가져가게 하십시오
  alternatives_korean:
  - 부디 ... 데려가게 하십시오
  - 제발 ... 가져가게 하십시오
  lexicon: HALOT
