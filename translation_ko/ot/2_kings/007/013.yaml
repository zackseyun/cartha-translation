  to: 그때 그의 종들 가운데 한 사람이 대답하여 말했습니다. “부디, 그 안에 남아 있는 말들 가운데서 다섯 마리를 데려가게 하십시오.[a] 보십시오, 그들은 그 안에 남아 있는 온 이스라엘 무리와 같습니다. 보십시오, 그들은 멸망해 버린 온 이스라엘 무리와 같습니다.[b] 그러니 그들을 보내어 살펴봅시다.”
  rationale: 원문의 문장 진행을 따라, 남은 말 다섯 마리를 보내자는 제안과 그 말들을 이스라엘의 남은 무리 및 멸망한 무리에 각각 견주는 두 비교를 모두 복원했습니다. 대명사 ‘그 안에’와 비교의 난해성은 본문과 각주에서 보존했으며, 한국어 문체는 현대 표준 합쇼체로 다듬었습니다.
