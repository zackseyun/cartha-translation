  lexicon: HALOT
  rationale: 반복되는 הנה의 주의를 환기하는 기능을 살리되, 한국어에서는 반복 ‘그 성 안에 ...’로 비교 구조를 분명히 드러냈습니다.
- source_word: הָמוֹן יִשְׂרָאֵל
