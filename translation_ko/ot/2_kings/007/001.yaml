  rationale: סֹלֶת의 ‘고운/선별된 밀가루’ 의미를 한국어의 자연스러운 식재료 표현으로 옮겼습니다.
- source_word: בְּשֶׁקֶל
  english_pob_choice: for a shekel
  chosen_korean: 한 세겔에
  alternatives_korean:
  - 세겔 값으로
  - 세겔에
  lexicon: HALOT
  rationale: 시장 가격을 나타내는 전치사의 기능을 한국어의 가격 표현 ‘~에’로 자연스럽게 반영했습니다.
- source_word: בְּשַׁעַר שֹׁמְרוֹן
  english_pob_choice: at the gate of Samaria
  chosen_korean: 사마리아 성문에서
  alternatives_korean:
  - 사마리아 성문 앞에서
  - 사마리아 문에서
  lexicon: HALOT
  rationale: שער는 도시의 공적 거래·판결 공간인 성문을 가리키므로, ‘성문’으로 옮겨 장소의 사회적 기능을 드러냈습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 본문과 인용문 모두에서 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  - LORD
  rationale: 본 프로젝트의 기준에 따라 신명기적 고유명사성을 유지하기 위해 יְהוָה를 ‘야훼’로 일관되게 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
