base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/001.yaml
  text: 'Then Elisha said[a], “Hear the word of Yahweh. Thus says Yahweh: About this time tomorrow, a seah of fine flour will be for a shekel, and two seahs of barley for a shekel, at the gate of Samaria.”'
  footnotes:
  - marker: a
    text: A seah was a dry measure; the Hebrew keeps the specific unit rather than a generic 'measure.'
    reason: cultural_note
translation:
  language: ko
  text: 그러자 엘리사가 말했습니다[a]. “야훼의 말씀을 들으십시오. 야훼께서 이렇게 말씀하십니다. ‘내일 이맘때쯤에는 고운 밀가루 한 스아가 한 세겔에, 보리 두 스아가 한 세겔에 사마리아 성문에서 팔릴 것입니다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 엘리사는 여기서 자기 말이 아니라 야훼의 말씀을 대언하므로, 서술상의 발화 표시를 살렸습니다.
    reason: source_note
lexical_decisions:
