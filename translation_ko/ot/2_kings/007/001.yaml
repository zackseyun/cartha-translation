  rationale: 와우 연속형의 진행·전환 기능을 자연스러운 서술 연결로 옮기되, 예언 발화의 시작을 분명히 하기 위해 ‘그러자’와 ‘말했습니다’를 사용했습니다.
- source_word: דְּבַר יְהוָה
  english_pob_choice: the word of Yahweh
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: HALOT
  rationale: 예언자적 공식인 ‘말씀’을 유지해 권위와 계시성을 살렸고, יְהוָה는 본 지침에 따라 ‘야훼’로 옮겼습니다.
- source_word: שִׁמְעוּ
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 보십시오
  - 들으세요
