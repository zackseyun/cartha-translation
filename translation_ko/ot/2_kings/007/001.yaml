  rationale: 복수 명령형의 공개적 선포를 현대 한국어의 공손한 명령형으로 옮겨, 예언자적 호소의 직접성을 유지했습니다.
- source_word: סְאָה
  english_pob_choice: a seah
  chosen_korean: 한 스아
  alternatives_korean:
  - 한 되
  - 한 말
  lexicon: HALOT
  rationale: 특정 건량 단위를 일반 단위로 바꾸지 않고 음역해, 본문이 요구하는 경제적·문화적 구체성을 보존했습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 밀가루
  alternatives_korean:
  - 곱게 간 밀가루
