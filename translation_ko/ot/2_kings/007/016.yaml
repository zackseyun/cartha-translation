id: 2KI.7.16
reference: 2 Kings 7:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א הָ/עָ֔ם וַ/יָּבֹ֕זּוּ אֵ֖ת מַחֲנֵ֣ה אֲרָ֑ם וַ/יְהִ֨י סְאָה סֹ֜לֶת בְּ/שֶׁ֗קֶל וְ/סָאתַ֧יִם שְׂעֹרִ֛ים בְּ/שֶׁ֖קֶל כִּ/דְבַ֥ר יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/016.yaml
  text: Then the people went out and plundered the camp of Aram[a], and a seah of fine flour was sold for a shekel, and two seahs of barley for a shekel[b], according to the word of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew seah, a dry measure.
    reason: cultural_note
  - marker: b
    text: Or, 'the Aramean camp.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 백성이 나가서 아람[a]의 진영을 약탈하였고, 고운 가루 한 세아는 한 세겔에, 보리 두 세아는 한 세겔에 팔렸습니다[b]. 이는 야훼의 말씀대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 seah(세아)는 건량 단위입니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘아람 사람의 진영’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא הָעָם
  english_pob_choice: Then the people went out
  chosen_korean: 백성이 나가서
  alternatives_korean:
  - 그러자 백성이 나가서
  - 그리고 백성이 나가서
  lexicon: HALOT
  rationale: 와우 연속형의 서술 진행을 한국어에서는 자연스러운 서사 연결인 ‘그러자’로 살리고, הָעָם은 단수 집합명사로 ‘백성’이 가장 직접적입니다.
- source_word: וַיָּבֹזּוּ
  english_pob_choice: plundered
  chosen_korean: 약탈하였고
  alternatives_korean:
  - 노략하였고
  - 노획하였고
  lexicon: HALOT
  rationale: 전리품을 강제로 취하는 군사적 의미를 분명히 드러내는 표준적 표현으로 ‘약탈하다’가 가장 가깝습니다.
- source_word: מַחֲנֵה אֲרָם
  english_pob_choice: the camp of Aram
  chosen_korean: 아람의 진영
  alternatives_korean:
  - 아람 진영
  - 아람 사람들의 진영
  - 시리아의 진영
  lexicon: HALOT
  rationale: 히브리어 직역 구조를 유지하면서도 한국어 문장에서는 소유격이 자연스럽기 때문에 ‘아람의 진영’으로 옮겼습니다.
- source_word: סְאָה
  english_pob_choice: a seah
  chosen_korean: 한 세아
  alternatives_korean:
  - 세아 한 되
  - 한 되
  - 한 세아
  lexicon: HALOT
  rationale: 이는 특정 건량 단위이므로 음역어 ‘세아’를 유지해 단위를 보존하고, 수량 표현은 자연스럽게 ‘한’을 붙였습니다.
- source_word: סֹלֶת
  english_pob_choice: fine flour
  chosen_korean: 고운 가루
  alternatives_korean:
  - 정한 가루
  - 고운 밀가루
  - 고운 분말
  lexicon: HALOT
  rationale: סֹלֶת는 일반 가루가 아니라 곱게 빻은 고급 가루이므로, 과도하게 현대화하지 않으면서도 의미를 분명히 하는 ‘고운 가루’를 택했습니다.
- source_word: בְּשֶׁקֶל
  english_pob_choice: for a shekel
  chosen_korean: 한 세겔에
  alternatives_korean:
  - 세겔 한 개에
  - 한 세겔로
  - 세겔당
  lexicon: HALOT
  rationale: 가격 진술에서는 한국어도 ‘-에’가 가장 자연스럽고, 고대 화폐/중량 단위 ‘세겔’을 그대로 살렸습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀에 의해
  - 주님의 말씀대로
  lexicon: HALOT
  rationale: כִּדְבַר은 ‘말씀에 따라/말씀대로’의 성취 공식을 나타내며, 본문의 신명 표지를 따라 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: 야훼(יְהוָה) 표기 유지
  chosen_reading: 본문의 신명 יהוה를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님
  - 여호와
  - 주
  rationale: 이 절은 예언 성취를 신적 말씀의 실현으로 결말짓기 때문에, 관습적 대체어보다 본문이 가진 언약명 자체를 드러내는 번역이 더 직접적입니다.
  doctrine_reference: 'DOCTRINE.md: יְהוָה / YHWH'
