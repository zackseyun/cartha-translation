source:
  edition: WLC
  text: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ מְצֹרָעִ֖ים פֶּ֣תַח הַ/שָּׁ֑עַר וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מָ֗ה אֲנַ֛חְנוּ יֹשְׁבִ֥ים פֹּ֖ה עַד מָֽתְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/003.yaml
  text: Now there were four men with a skin disease at the entrance of the gate[a], and they said to one another, “Why are we sitting here until we die?”
  footnotes:
  - marker: a
    text: Or, traditionally, “leprous.” The Hebrew refers to a skin condition associated with צָרַעַת and is not necessarily identical to modern leprosy (Hansen’s disease).
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 네 명의 나병환자[a]가 성문 어귀에 있었는데, 그들이 서로에게 말했습니다. “어찌하여 우리가 여기 앉아 있다가 죽기만 하겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 전통적으로 “문둥병자”로 옮길 수 있습니다. 히브리어는 צָרַעַת과 관련된 피부 상태를 가리키며, 현대의 나병(한센병)과 반드시 동일한 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעָ֧ה אֲנָשִׁ֛ים הָי֥וּ
  english_pob_choice: Now there were four men
  chosen_korean: 이제 네 명의 ...가 있었는데
  alternatives_korean:
  - 그리고 네 명의 ...가 있었습니다
  - 그때 네 명의 ...가 있었습니다
  lexicon: HALOT
  rationale: 장면 전환을 나타내는 서술 도입으로 이해하여, 자연스러운 문맥 연결을 살린 ‘이제 …가 있었습니다’로 옮겼습니다.
- source_word: מְצֹרָעִ֖ים
  english_pob_choice: with a skin disease
  chosen_korean: 나병환자
  alternatives_korean:
  - 피부병이 있는 사람들
  - 피부 질환을 앓는 사람들
  lexicon: HALOT
  rationale: 본문의 인물 표지를 간결하게 드러내기 위해 본문에는 ‘나병환자’를 두되, 히브리어가 현대 의학적 한센병과 일치한다고 단정하지는 않는다는 점은 각주로 보완했습니다.
- source_word: פֶּ֣תַח הַ/שָּׁ֑עַר
  english_pob_choice: at the entrance of the gate
  chosen_korean: 성문 어귀에
  alternatives_korean:
  - 성문 입구에
  - 성문 문간에
  lexicon: HALOT
  rationale: ‘문/입구’의 결합을 한국어로 가장 자연스럽고 간결하게 옮길 수 있는 표현으로 ‘어귀’를 선택했습니다.
- source_word: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ
  english_pob_choice: and they said to one another
  chosen_korean: 그들이 서로에게 말했습니다
  alternatives_korean:
  - 각자 자기 동무에게 말했습니다
  - 서로 말했습니다
  lexicon: HALOT
  rationale: 분배적 관용구를 뜻대로 살려, 공동체 내부의 상호 발화를 자연스러운 한국어로 표현했습니다.
- source_word: מָ֗ה ... עַד מָֽתְנוּ
  english_pob_choice: Why are we sitting here until we die?
  chosen_korean: 어찌하여 우리가 여기 앉아 있다가 죽기만 하겠습니까?
  alternatives_korean:
  - 왜 우리가 여기 앉아 죽을 때까지 있어야 합니까?
  - 어찌하여 우리가 여기 앉아 있다가 죽겠습니까?
  lexicon: HALOT
  rationale: 수사 의문문의 압박감과 체념의 뉘앙스를 살리기 위해 ‘어찌하여’와 ‘-기만 하겠습니까’로 옮겨, 단순 정보 질문이 아니라 절박한 자문을 드러냈습니다.
theological_decisions:
- issue: ‘מְצֹרָעִים’의 병명 표기
  chosen_reading: 본문에는 ‘나병환자’로 간결히 옮기되, 각주에서 히브리어가 현대 의학적 한센병과 동일하지 않을 수 있음을 밝혔습니다.
  alternative_readings:
  - 피부병이 있는 사람들
  - 문둥병자
  rationale: 본문 가독성과 한국어 교회 문맥의 인지 가능성을 살리면서도, 원어가 지시하는 상태를 과도하게 현대화하지 않기 위해서입니다.
  doctrine_reference: 레위기 13–14장 정결 규례 관련 용례
- issue: 체념 섞인 반문의 정서
  chosen_reading: ‘어찌하여 우리가 여기 앉아 있다가 죽기만 하겠습니까?’로 번역해 절박한 자기질문을 드러냈습니다.
  alternative_readings:
  - 왜 우리가 여기 앉아 죽을 때까지 있어야 합니까?
  - 어찌하여 우리가 여기 앉아 있다가 죽겠습니까?
  rationale: 본문은 단순한 위치 설명이 아니라 죽음 앞에서의 긴박한 결단 직전 발화를 담고 있으므로, 반문의 감정적 힘을 보존하는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 서술문 내 인물 발화의 수사학적 기능
