review_pass:
  verdict: revise
  source_fidelity: 히브리어는 네 명의 남성, צָרַעַת 관련 피부 상태, 성문 입구, 상호 발화, 그리고 ‘여기 앉아 있다가 죽을 때까지’라는 수사 의문을 말합니다. 초안의 ‘이제’는 원문에 명시된 시간 부사가 없고 영어 감사본에서도 삭제되었으므로 제거하는 것이 타당합니다. 또한 ‘나병환자’는 현대 한센병을 연상시켜 원어의 범위를 본문에서 지나치게 좁힙니다.
  naturalness: ‘피부 질환을 앓는 네 남자’, ‘성문 어귀’, ‘서로 말했습니다’는 현대 표준어 합쇼체 서술에 자연스럽습니다. 질문은 ‘왜 우리가 여기 앉아 죽을 때까지 있겠습니까?’로 하여 원문의 수사성과 시간적 종결점을 자연스럽게 보존합니다.
  terminology: מְצֹרָעִים는 현대 의학적 나병으로 단정하지 않고 ‘피부 질환을 앓는’으로 옮깁니다. 전통적 번역어 ‘나병환자’는 각주에 두며, 차별적 표현인 ‘문둥병자’는 제시하지 않습니다.
  issues:
  - severity: medium
    issue: ‘이제’가 본문 첫머리에 추가되었습니다.
    rationale: וְאַרְבָּעָה의 접속·장면 전환 기능이 명시적인 시간어 ‘이제’를 요구하지 않으며, 영어 POB 감사본도 같은 이유로 선행 ‘Now’를 삭제했습니다.
  - severity: high
    issue: ‘나병환자’가 מְצֹרָעִים를 현대 한센병으로 과도하게 특정할 수 있습니다.
    rationale: צָרַעַת 관련 상태는 현대의 Hansen병과 반드시 동일하지 않습니다. 각주만으로 보완하기보다 본문을 포괄적인 ‘피부 질환’으로 번역하는 편이 원문 충실성에 맞습니다.
  - severity: low
    issue: ‘죽기만 하겠습니까?’는 원문의 ‘~할 때까지’(עַד)보다 ‘그저 죽기만 한다’는 제한·대조를 더 강하게 암시합니다.
    rationale: ‘죽을 때까지 있겠습니까?’가 시간적 종결점을 직접 보존합니다.
  revised_text: 피부 질환을 앓는 네 남자가 성문 어귀에 있었는데, 그들이 서로 말했습니다. “왜 우리가 여기 앉아 죽을 때까지 있겠습니까?”
  revised_footnotes:
  - marker: a
    text: 또는 전통적으로 “나병환자”. 히브리어는 צָרַעַת과 관련된 피부 상태를 가리키며, 현대의 나병(한센병)과 반드시 동일한 것은 아닙니다.
    reason: lexical_alternative
  revision_rationale: 명시되지 않은 ‘이제’를 삭제하고, מְצֹרָעִים의 의학적 불확실성을 본문에서 보존했습니다. 원문의 남성 복수는 ‘네 남자’로 반영했으며, 수사 의문의 ‘죽을 때까지’라는 시간적 의미를 직접 드러냈습니다. 각주 표지는 ‘피부 질환’에 붙입니다.
