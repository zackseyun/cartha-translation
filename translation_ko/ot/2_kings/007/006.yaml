source:
  edition: WLC
  text: וַ/אדֹנָ֞/י הִשְׁמִ֣יעַ אֶת מַחֲנֵ֣ה אֲרָ֗ם ק֥וֹל רֶ֨כֶב֙ ק֣וֹל ס֔וּס ק֖וֹל חַ֣יִל גָּד֑וֹל וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל אָחִ֗י/ו הִנֵּ֣ה שָֽׂכַר עָלֵי/נוּ֩ מֶ֨לֶךְ יִשְׂרָאֵ֜ל אֶת מַלְכֵ֧י הַ/חִתִּ֛ים וְ/אֶת מַלְכֵ֥י מִצְרַ֖יִם לָ/ב֥וֹא עָלֵֽי/נוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/006.yaml
  text: For the Lord had caused the camp of Aram to hear the sound of chariots[a], the sound of horses, the sound of a great army, and they said to one another, “Look, the king of Israel has hired the kings of the Hittites and the kings of Egypt against us[c][b], to come against us.”
  footnotes:
  - marker: a
    text: Or "the Aramean camp."
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew repeats "the sound of": "the sound of chariots, the sound of horses, the sound of a great army."'
    reason: lexical_alternative
  - marker: c
    text: Literally, "each man said to his brother."
    reason: lexical_alternative
translation:
  language: ko
  text: 주님께서 아람 진영으로 하여금 병거의 소리, 말의 소리, 큰 군대의 소리를 듣게 하셨습니다. 그래서 그들이 서로 말하였습니다. "보십시오, 이스라엘 왕이 우리를 치러 오게 하려고 헷 사람들의 왕들과 이집트의 왕들을 고용했습니다."
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאדֹנָי / the Lord
  english_pob_choice: the Lord
  chosen_korean: 주님께서
  alternatives_korean:
  - 주께서
  - 하나님께서
  lexicon: HALOT
  rationale: 아도나이는 이 문맥에서 이스라엘의 하나님을 가리키므로, 한국어에서는 서술적이고 자연스러운 신적 호칭인 “주님”으로 옮겼습니다.
- source_word: הִשְׁמִיעַ אֶת ... קוֹל
  english_pob_choice: had caused ... to hear the sound of
  chosen_korean: '... 듣게 하셨습니다'
  alternatives_korean:
  - '... 듣도록 하셨습니다'
  - '... 듣게 만드셨습니다'
  lexicon: HALOT
  rationale: 원문의 사역적 의미를 살리되 한국어에서는 “듣게 하셨습니다”가 가장 간결하고 자연스럽습니다.
- source_word: מַחֲנֵה אֲרָם
  english_pob_choice: the camp of Aram
  chosen_korean: 아람 진영
  alternatives_korean:
  - 아람의 진영
  - 아람 군대
  lexicon: HALOT
  rationale: 문맥상 군사적 집결지를 가리키므로 “진영”이 적절하며, 고유명사 아람을 직접 보존했습니다.
- source_word: קוֹל רֶכֶב / קוֹל סוּס / קוֹל חַיִל גָּדוֹל
  english_pob_choice: the sound of chariots / the sound of horses / the sound of a great army
  chosen_korean: 병거의 소리, 말의 소리, 큰 군대의 소리
  alternatives_korean:
  - 전차의 소리, 말들의 소리, 큰 군대의 소리
  - 병거 소리, 말 소리, 대군의 소리
  lexicon: HALOT
  rationale: 히브리어의 반복된 “소리” 구조를 살리면서, 군사적 이미지인 병거·말·큰 군대를 현대 한국어로 분명하게 전달했습니다.
- source_word: וַיֹּאמְרוּ אִישׁ אֶל אָחִיו
  english_pob_choice: they said to one another
  chosen_korean: 서로 말하였습니다
  alternatives_korean:
  - 각자 자기 형제에게 말하였습니다
  - 서로서로 말하였습니다
  lexicon: HALOT
  rationale: 직역의 “사람이 그의 형제에게”는 한국어에서 어색하므로, 상호 발화의 뜻을 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 아도나이의 한국어 신적 호칭 처리
  chosen_reading: “주님”으로 번역하여 하나님의 주권적 행위로 읽히게 했습니다.
  alternative_readings:
  - “주께서”
  - “주인이”
  rationale: 본문은 아람 진영의 공포가 우연이 아니라 주님의 주권적 개입의 결과임을 말하므로, 신적 호칭을 분명히 드러내는 번역이 적절합니다.
  doctrine_reference: 'DOCTRINE.md: 신적 호칭과 섭리적 행위의 번역 원칙'
