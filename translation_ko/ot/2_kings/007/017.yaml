  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הַ/מֶּלֶךְ֩ הִפְקִ֨יד אֶת הַ/שָּׁלִ֜ישׁ אֲשֶׁר נִשְׁעָ֤ן עַל יָד/וֹ֙ עַל הַ/שַּׁ֔עַר וַ/יִּרְמְסֻ֧/הוּ הָ/עָ֛ם בַּ/שַּׁ֖עַר וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֤ר דִּבֶּר֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/רֶ֥דֶת הַ/מֶּ֖לֶךְ אֵלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/017.yaml
  text: Now the king had appointed the officer on whose hand he leaned to be in charge of the gate[a], but the people trampled him in the gate, and he died[b], just as the man of God had spoken when the king came down to him.
  footnotes:
  - marker: a
    text: Or 'the captain' or 'the royal adjutant'; the Hebrew שָׁלִישׁ refers to a high-ranking officer close to the king.
    reason: lexical_alternative
  - marker: b
    text: Literally 'on whose hand he leaned,' a Hebrew expression for a close royal attendant.
    reason: cultural_note
translation:
  language: ko
  text: 이처럼 왕은 손을 받치던 그 관리[a]를 문지기 책임자로 임명했지만, 백성이 문에서 그를 짓밟아 그는 죽었습니다[b]. 이는 하나님의 사람이 왕이 자기에게 내려왔을 때 말한 그대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שָׁלִישׁ은 왕 가까이에 있던 고위 군관이나 시종을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그의 손에 의지하던’이라는 뜻의 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: הִפְקִיד
  english_pob_choice: had appointed / to be in charge of the gate
  chosen_korean: 임명했지만
  alternatives_korean:
  - 맡겼지만
  - 책임자로 세웠지만
  lexicon: HALOT
  rationale: 히필형의 ‘임무를 맡겨 감독하게 하다’라는 뜻을 살려, 단순한 배치보다 책임 부여를 드러내는 ‘임명하다’를 택했습니다.
- source_word: הַשָּׁלִישׁ
  english_pob_choice: the officer
  chosen_korean: 그 관리
  alternatives_korean:
  - 그 장교
  - 그 시종
  lexicon: HALOT
  rationale: שָׁלִישׁ은 왕 곁의 고위 시종/군관을 가리킬 수 있어, 특정 계급으로 과도하게 좁히지 않는 ‘관리’로 옮겼습니다.
- source_word: נִשְׁעָן עַל יָדוֹ
  english_pob_choice: on whose hand he leaned
  chosen_korean: 손을 받치던
  alternatives_korean:
  - 팔에 기대던
  - 그 손에 의지하던
  lexicon: HALOT
  rationale: 히브리어 관용구의 신체 이미지를 살리되, 한국어에서는 ‘왕이 몸을 의지하던 근신’의 관계를 자연스럽게 드러내는 표현으로 다듬었습니다.
- source_word: כַּאֲשֶׁר דִּבֶּר אִישׁ הָאֱלֹהִים
  english_pob_choice: just as the man of God had spoken
  chosen_korean: 이는 하나님의 사람이 … 말한 그대로였습니다
  alternatives_korean:
  - 이는 하나님의 사람이 … 예언한 그대로였습니다
  - 이는 하나님의 사람이 … 말씀한 대로였습니다
  lexicon: HALOT
  rationale: ‘하나님의 사람’이라는 정식 호칭을 유지하고, 성취 공식인 כַּאֲשֶׁר דִּבֶּר의 결과를 ‘말한 그대로’로 표현해 예언 성취를 분명히 했습니다.
theological_decisions:
- issue: 예언 성취의 강조
  chosen_reading: 본문의 종결부를 ‘말한 그대로였습니다’로 옮겨, 사건이 앞서 선포된 하나님의 사람의 말을 성취했다는 내러티브 신학을 드러냈습니다.
  alternative_readings:
  - 단순히 사건 보고만 하는 번역
  - 성취를 약화한 평이한 서술
  rationale: 히브리어는 두 번의 דִּבֶּר로 이전 발화와의 대응을 분명히 하므로, 이를 살려 독자가 사건의 성취성을 놓치지 않게 했습니다.
  doctrine_reference: 예언-성취 구조를 본문 수준에서 보존
