- from: 이처럼 왕은 손을 받치던 그 관리[a]를 문지기 책임자로 임명했지만, 백성이 문에서 그를 짓밟아 그는 죽었습니다[b]. 이는 하나님의 사람이 왕이 자기에게 내려왔을 때 말한 그대로였습니다.
  to: 왕은 왕이 그의 손[b]에 의지하던 그 관리[a]에게 성문을 맡겨 두었는데, 백성이 성문에서 그를 짓밟아 그가 죽었습니다. 이는 왕이 그에게 내려왔을 때 하나님의 사람이 말한 그대로였습니다.
  rationale: 왕이 관리의 손에 의지하던 관계를 명확히 하고, 성문 감독 임무를 ‘문지기’라는 특정 직책으로 축소하지 않았습니다. 또한 관용구 설명 각주를 해당 어구에 직접 연결했습니다. 예언 성취를 나타내는 종결부와 ‘하나님의 사람’이라는 호칭은 유지했습니다.
