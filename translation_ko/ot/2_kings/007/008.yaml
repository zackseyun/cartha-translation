revisions:
- from: 이 나병환자들이 진영의 끝에 이르러 한 장막에 들어가 먹고 마시고, 그곳에서 은과 금과 옷을 가져다가 가서 숨겼습니다. 그러고 나서 그들은 돌아서서 다른 장막에 들어가 거기서도 가져다가 가서 숨겼습니다.[a]
  to: 이 나병환자들[a]이 진영의 가장자리에 이르러 한 장막에 들어가 먹고 마셨습니다. 그리고 그곳에서 은과 금과 옷을 가져가 숨겼습니다. 그들은 다시 돌아와 다른 장막에 들어가, 거기서도 물건을 가져가 숨겼습니다.
  rationale: 원문의 순차적 서술, ‘한 장막’과 ‘다른 장막’의 대조, 은·금·옷의 목록, 그리고 두 번째 취득 행위의 비특정성을 보존했습니다. 한국어 문법상 필요한 범위에서만 ‘물건을’을 보충했으며, 각주 표지를 해당 용어 바로 뒤로 옮겨 주석의 지시 대상을 분명히 했습니다.
