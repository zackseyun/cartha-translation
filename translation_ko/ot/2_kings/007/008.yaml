  source_fidelity: 핵심 사건 순서와 물품 목록은 대체로 충실합니다. 그러나 ‘가져다가 가서 숨겼습니다’는 히브리어의 ‘가져가다/옮겨 가다—가다—숨기다’라는 연속 동작을 한국어에서 어색하게 중복하며, 두 번째 ‘가져다가’는 목적어가 전혀 드러나지 않아 뜻이 불완전하게 들립니다.
  naturalness: ‘진영의 끝’도 가능하지만 공간적 의미에는 ‘진영의 가장자리’가 더 자연스럽습니다. 동사를 ‘가져가 숨겼습니다’로 정리하고 두 번째 경우에만 ‘물건을’을 보충하면 현대 표준어 합쇼체에서 자연스럽고 명료합니다.
  terminology: ‘나병환자들’은 본문 전통과 독자 친숙성을 고려할 때 유지할 수 있습니다. 다만 각주는 ‘문둥병’이라는 כיום 비권장되고 낙인적인 표현을 언급할 필요 없이, 히브리어 용어가 현대 의학적 한센병보다 넓은 피부 질환 범위를 가리킬 수 있음을 밝혀야 합니다.
