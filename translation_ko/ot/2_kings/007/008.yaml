base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/008.yaml
  text: When these lepers came to the edge of the camp[a], they entered one tent and ate and drank, and they carried off silver and gold and clothing from there, and went and hid them. Then they returned and entered another tent, and carried things off from there, and went and hid them.
  footnotes:
  - marker: a
    text: Hebrew 'lepers' refers to persons afflicted with a skin disease traditionally rendered 'leprosy'; the ancient term may cover a broader range of conditions than the modern medical term.
    reason: cultural_note
translation:
  language: ko
  text: 이 나병환자들[a]이 진영의 가장자리에 이르러 한 장막에 들어가 먹고 마셨습니다. 그리고 그곳에서 은과 금과 옷을 가져가 숨겼습니다. 그들은 다시 돌아와 다른 장막에 들어가, 거기서도 물건을 가져가 숨겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘나병환자들’은 전통적으로 ‘나병’으로 번역되는 피부 질환을 앓는 사람들을 가리킵니다. 이 용어는 현대 의학적 한센병보다 더 넓은 범위의 질환을 포함할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: הַמְצֹרָעִים
  english_pob_choice: lepers
  chosen_korean: 나병환자들
  alternatives_korean:
  - 문둥병자들
  - 피부병을 앓는 사람들
  lexicon: HALOT
  rationale: POB의 ‘lepers’를 한국어로는 자연스럽게 ‘나병환자들’로 옮기되, 주석 없이도 전통적 표현과 본문의 인물 지시를 살렸습니다.
- source_word: קְצֵה הַמַּחֲנֶה
  english_pob_choice: the edge of the camp
  chosen_korean: 진영의 끝
  alternatives_korean:
  - 진영의 가장자리
  - 진영의 바깥끝
  lexicon: HALOT
  rationale: ‘edge’를 ‘끝’으로 직역하되, 군사적 상황의 ‘camp’를 ‘진영’으로 옮겨 문맥의 현장감을 살렸습니다.
- source_word: אֹהֶל אֶחָד
  english_pob_choice: one tent
  chosen_korean: 한 장막
  alternatives_korean:
  - 한 천막
  - 어느 한 장막
  lexicon: HALOT
  rationale: 히브리어의 수사적 단순성을 따라 ‘한’으로 시작해 순차적 동작을 강조했고, 장막은 천막보다 성경 문체에 더 잘 맞습니다.
- source_word: וַיִּשְׂאוּ מִשָּׁם
  english_pob_choice: carried off from there / carried things off from there
  chosen_korean: 가져다가
  alternatives_korean:
  - 가져갔습니다
  - 옮겨 갔습니다
  - 약탈해 갔습니다
  lexicon: HALOT
  rationale: 여기서는 단순한 ‘take’보다 전리품을 챙겨 옮기는 뉘앙스가 있어 ‘가져다가’로 처리해 뒤의 ‘숨겼습니다’와 자연스럽게 연결했습니다.
- source_word: וַיַּטְמִנוּ
  english_pob_choice: hid them
  chosen_korean: 숨겼습니다
  alternatives_korean:
  - 감추었습니다
  - 파묻었습니다
  lexicon: HALOT
  rationale: 히브리어의 핵심 의미는 ‘감추다/숨기다’이므로 가장 중립적인 ‘숨겼습니다’를 택했고, ‘파묻었습니다’처럼 구체화하지 않았습니다.
theological_decisions:
- issue: 서술 반복과 생략된 목적어 처리
  chosen_reading: 두 번째 ‘가져다가’도 목적어를 한국어에서 드러내지 않고 그대로 두어, 히브리어의 축약된 반복과 약탈의 누적감을 살렸습니다.
  alternative_readings:
  - ‘거기서도 물건을 가져다가’처럼 목적어를 보충함
  - ‘거기서도 가져갔습니다’로 단순화함
  rationale: 원문은 두 번째 동작에서 목적어를 생략해 리듬을 만들므로, 이를 과도하게 풀지 않는 편이 서술의 긴박함을 보존합니다.
  doctrine_reference: 본문 서술의 수사와 의미 보존 원칙
