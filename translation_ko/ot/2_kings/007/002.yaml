  text: וַ/יַּ֣עַן הַ/שָּׁלִ֡ישׁ אֲשֶׁר לַ/מֶּלֶךְ֩ נִשְׁעָ֨ן עַל יָד֜/וֹ אֶת אִ֣ישׁ הָ/אֱלֹהִים֮ וַ/יֹּאמַר֒ הִנֵּ֣ה יְהוָ֗ה עֹשֶׂ֤ה אֲרֻבּוֹת֙ בַּ/שָּׁמַ֔יִם הֲ/יִהְיֶ֖ה הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/יֹּ֗אמֶר הִנְּ/כָ֤ה רֹאֶה֙ בְּ/עֵינֶ֔י/ךָ וּ/מִ/שָּׁ֖ם לֹ֥א תֹאכֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/002.yaml
  text: Then the officer on whose arm the king leaned answered the man of God and said[a], “Look, if Yahweh were making windows in the heavens, could this thing happen?” And he said, “Look, you are about to see it with your own eyes[b], but you will not eat from it.”
  footnotes:
  - marker: a
    text: Or 'if the LORD were opening floodgates in heaven.' The Hebrew literally says 'making windows in the heavens,' a metaphor for extraordinary provision from above.
    reason: lexical_alternative
  - marker: b
    text: Or 'Look, if the LORD were making windows in the heavens, could this thing happen?'.
    reason: previous_rendering
translation:
  language: ko
  text: 이에 그 왕의 팔에 기대고 있던 그 장교가 하나님의 사람에게 대답하며 말했습니다. 「보십시오, 만일 야훼께서 하늘에 창문들을 내신다면, 이런 일이 일어날 수 있겠습니까?」 그러자 그가 말했습니다. 「보십시오, 당신은 이것을 두 눈으로 보게 될 것이지만, 거기서 먹지는 못할 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשָּׁלִישׁ
  english_pob_choice: the officer
  chosen_korean: 그 장교
  alternatives_korean:
  - 그 군관
  - 그 시종장
  - 그 고위 관리
  lexicon: HALOT
  rationale: שָׁלִישׁ은 군사·궁정 맥락의 고위 인물을 가리킬 수 있으므로, 현대 한국어에서는 위계를 과도하게 특정하지 않는 ‘장교’가 자연스럽습니다.
- source_word: נִשְׁעָן עַל יָדוֹ
  english_pob_choice: on whose arm the king leaned
  chosen_korean: 왕이 기대고 있던
  alternatives_korean:
  - 왕이 손에 기대고 있던
  - 왕의 곁을 받들던
  - 왕이 팔에 기대고 있던
  lexicon: HALOT
  rationale: 히브리어의 신체 이미지를 살리되 한국어에서 어색하지 않게, ‘팔’의 비유를 직접 반복하기보다 ‘기대고 있던’으로 관계의 긴밀함을 드러냈습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문이 신명기를 직접 사용하는 이름을 지니므로, 전통적 대체어인 ‘주님’보다 원어 표기를 옮긴 ‘야훼’를 사용했습니다.
- source_word: אֲרֻבּוֹת בַּשָּׁמַיִם
  english_pob_choice: windows in the heavens
  chosen_korean: 하늘에 창문들을
  alternatives_korean:
  - 하늘의 수문을
  - 하늘에 창들을
  - 하늘의 문들을
  lexicon: HALOT
  rationale: 직역적 은유를 보존해 초자연적 공급을 가리키는 과장된 표현임을 드러내기 위해 ‘하늘에 창문들을’로 옮겼습니다.
- source_word: הֲיִהְיֶה הַדָּבָר הַזֶּה
  english_pob_choice: could this thing happen?
  chosen_korean: 이런 일이 일어날 수 있겠습니까?
  alternatives_korean:
  - 이 일이 가능하겠습니까?
  - 이런 일이 되겠습니까?
  - 이 일이 있을 수 있겠습니까?
  lexicon: HALOT
  rationale: 불신과 조롱의 뉘앙스를 유지하면서도 현대 한국어에서 자연스러운 가능성 질문으로 표현했습니다.
- source_word: הִנְּכָה רֹאֶה בְּעֵינֶיךָ
  english_pob_choice: you are about to see it with your own eyes
  chosen_korean: 당신은 이것을 두 눈으로 보게 될 것이지만
  alternatives_korean:
  - 당신은 이것을 눈으로 보게 될 것이지만
  - 당신은 이것을 직접 보게 될 것이지만
  - 당신은 이것을 똑똑히 보게 될 것이지만
  lexicon: HALOT
  rationale: ‘당신은…보게 될 것이지만’으로 예언적 확실성을 살리되, ‘두 눈으로’로 히브리어의 강조를 반영했습니다.
theological_decisions:
- issue: 하나님의 이름 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 고유한 언약 სახელ을 보존하기 위해 대체 칭호 대신 이름 자체를 옮겼습니다. 이는 POB의 원문 직접성 원칙과 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
