  rationale: 본문의 고유한 언약 სახელ을 보존하기 위해 대체 칭호 대신 이름 자체를 옮겼습니다. 이는 POB의 원문 직접성 원칙과 일치합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
