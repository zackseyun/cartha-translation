  to: 이에 왕이 그의 팔에 기대고 있던 장교가 하나님의 사람에게 대답하여 말했습니다. “보십시오, 만일 야훼께서 하늘에 창문들을 만드신다 해도, 이런 일이 일어날 수 있겠습니까?” 하나님의 사람이 그에게 말했습니다. “보십시오, 당신은 이것을 두 눈으로 보게 될 것이지만, 그것을 먹지는 못할 것입니다.”
