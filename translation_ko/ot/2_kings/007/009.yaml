base_translation:
  language: en
  yaml_path: translation/ot/2_kings/007/009.yaml
  text: Then they said to one another[a], “What we are doing is not right. This day is a day of good news, and we are keeping silent. If we wait until the light of morning, guilt will overtake us. So now, come[b], let us go and report it to the king’s household.”
  footnotes:
  - marker: a
    text: Or, “punishment will find us” or “we will incur guilt.” The Hebrew says literally, “guilt/iniquity will find us.”
    reason: lexical_alternative
  - marker: b
    text: “The king’s household” may also be rendered “the king’s house” or “the royal palace.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 서로 말했습니다. “우리가 하는 일은 옳지 않습니다. 오늘은 좋은 소식의 날인데, 우리가 침묵하고 있습니다. 아침 빛이 밝아 올 때까지 기다린다면, 우리에게 죄책[a]이 닥쳐올 것입니다. 그러니 이제 가서 왕의 집안[b]에 알립시다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 “죄악/죄책이 우리를 찾아올 것이다”입니다. 이는 우리가 죄를 범한 책임을 지게 되거나 벌을 받을 수 있다는 뜻으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “왕의 집안”은 “왕의 집”, “왕실”, 또는 “왕궁”으로도 옮길 수 있습니다.
    reason: lexical_alternative
