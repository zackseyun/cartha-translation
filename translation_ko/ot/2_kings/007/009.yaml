- source_word: מַחְשִׁים
  english_pob_choice: we are keeping silent
  chosen_korean: 우리가 침묵하고 있습니다
  alternatives_korean:
  - 우리가 잠자코 있습니다
  - 우리가 아무 말도 하지 않고 있습니다
  lexicon: HALOT
  rationale: 의도적으로 입을 다문 상태를 나타내므로, 단순 상태보다 지속적 행위를 드러내는 ‘침묵하고 있습니다’를 택했습니다.
- source_word: וּמְצָאָנוּ עָוֹן
  english_pob_choice: guilt will overtake us
  chosen_korean: 우리에게 죄책이 닥쳐올 것입니다
  alternatives_korean:
  - 죄책이 우리를 찾아올 것입니다
  - 우리에게 죄가 드러날 것입니다
  - 우리에게 죄가 돌아올 것입니다
  lexicon: HALOT
  rationale: עָוֹן의 직역 의미인 ‘죄책/죄악’과 ‘찾아오다’의 관용적 결과성을 함께 살려, 책임이 임하는 뉘앙스를 한국어로 전달했습니다.
- source_word: בֵּית הַמֶּלֶךְ
  english_pob_choice: the king’s household
  chosen_korean: 왕의 집안
  alternatives_korean:
  - 왕의 집
  - 왕궁
  - 왕실
  lexicon: HALOT
  rationale: ‘house of the king’는 건물만이 아니라 왕의 식솔과 체계를 포함할 수 있어, POB의 판단을 따라 ‘집안’으로 넓게 옮겼습니다.
theological_decisions:
- issue: עָוֹן의 결과를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘죄책이 닥쳐올 것입니다’로 옮겨, 단순한 감정적 죄책감보다 책임과 유죄의 결과가 임한다는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘벌이 우리를 찾아올 것입니다’
  - ‘우리가 죄를 짊어지게 될 것입니다’
  rationale: 본문은 ‘iniquity/guilt will find us’의 결과를 경고하므로, 도덕적 책임과 심판 가능성을 함께 보존하는 표현이 필요합니다.
  doctrine_reference: 죄의 책임성과 그 결과에 대한 성경적 경고
- issue: 대화체의 톤
  chosen_reading: 서술은 합쇼체로 유지하되, 인용문은 원문의 즉각적 결의와 긴박함을 살려 평서·청유형으로 처리했습니다.
  alternative_readings:
  - 인용문 전체를 더 공손하게 완만화하는 방식
  - 전부 서술체로 평탄화하는 방식
  rationale: 장면의 긴박한 판단과 결정을 유지하려면, 원문 대화의 직접성을 약화시키지 않는 것이 적절합니다.
  doctrine_reference: 본문 장면의 수사적 긴박성 보존
