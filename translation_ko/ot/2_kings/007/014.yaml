  source_fidelity: 히브리어의 두 연속 서술(‘그들이 가져왔다’와 ‘왕이 보냈다’)을 분명히 구분해야 합니다. 초안의 ‘가져오자’는 첫 동사를 종속절로 바꾸어 원문의 병렬적 서사 진행을 약화합니다. 또한 רֶכֶב은 이 문맥에서 일반 ‘수레’보다 ‘전차’가 더 정확합니다.
  naturalness: ‘말 두 수레’는 현대 표준 한국어에서 부자연스럽고 의미 관계가 불명확합니다. ‘말이 끄는 전차 두 대’가 자연스럽습니다. ‘아람의 진영 뒤로’는 목적지가 진영의 후방이라는 뜻으로도 읽히므로, 추격의 방향을 드러내는 ‘아람 진영을 뒤쫓아’로 다듬는 것이 좋습니다.
  terminology: 아람은 고유명으로 유지합니다. רֶכֶב은 ‘전차’로, מַחֲנֶה는 ‘진영’으로 옮깁니다. 각주에서는 히브리어 압축 표현의 범위와 대안적 이해를 보존합니다.
  issues:
  - severity: medium
    issue: ‘가져오자’가 원문의 독립 서술을 종속절로 처리함
