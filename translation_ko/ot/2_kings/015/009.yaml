  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה כַּ/אֲשֶׁ֥ר עָשׂ֖וּ אֲבֹתָ֑י/ו לֹ֣א סָ֗ר מֵֽ/חַטֹּאות֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/009.yaml
  text: He did what was evil in the sight of Yahweh[a], just as his fathers had done. He did not turn away from the sins of Jeroboam son of Nebat, with which he caused Israel to sin.
  footnotes:
  - marker: a
    text: Or 'who caused Israel to sin.' The Hebrew relative clause can be taken as referring either to Jeroboam himself or to the sins associated with him; the main text preserves the close connection between Jeroboam's sins and Israel's being led into sin.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼의 눈에 악한 일을 했습니다. 그의 조상들이 한 것처럼 했으며, 느밧의 아들 여로보암의 죄에서 돌이키지 않았습니다. 그 죄로 여로보암이 이스라엘을 죄짓게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그로 인해 이스라엘이 죄를 지었습니다.” 히브리어 관계절은 여로보암 자신을 가리키거나 그와 연결된 죄들을 가리키는 것으로 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הָרַע בְּעֵינֵי יְהוָה
  english_pob_choice: what was evil in the sight of Yahweh
  chosen_korean: 야훼의 눈에 악한 일
  alternatives_korean:
  - 야훼 보시기에 악한 일
  - 야훼 앞에서 악한 일
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기되, 평가 주체가 야훼라는 점과 도덕적 판정을 함께 살리기 위해 ‘야훼의 눈에’와 ‘악한 일’을 유지했습니다.
- source_word: אֲבֹתָיו
  english_pob_choice: his fathers
  chosen_korean: 그의 조상들이
  alternatives_korean:
  - 그의 아버지들이
  - 그의 선조들이
  lexicon: HALOT
  rationale: 왕조 문맥에서 선왕들/조상들의 전례를 가리키므로, 한국어에서는 성별감이 덜한 ‘조상들’이 현대 독자에게 더 분명합니다.
- source_word: מֵחַטֹּאות יָרָבְעָם בֶּן נְבָט
  english_pob_choice: from the sins of Jeroboam son of Nebat
  chosen_korean: 느밧의 아들 여로보암의 죄에서
  alternatives_korean:
  - 느밧의 아들 여로보암의 죄들에서
  - 느밧의 아들 여로보암이 지은 죄에서
  lexicon: HALOT
  rationale: 복수형 ‘죄들’의 집합성을 살릴 수 있지만, 한국어에서는 관용적으로 단수 ‘죄’가 여로보암의 우상숭배적 죄 전체를 묶어 말하기에 자연스럽습니다.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: with which he caused Israel to sin
  chosen_korean: 그 죄로 여로보암이 이스라엘을 죄짓게 했습니다
  alternatives_korean:
  - 그 죄로 이스라엘을 죄짓게 한 여로보암의 죄
  - 그 죄로 이스라엘을 범죄하게 했습니다
  lexicon: HALOT
  rationale: POB가 유지한 의미상 연결—여로보암의 죄가 이스라엘을 죄로 끌어들인다는 점—을 한국어의 ‘-로’와 ‘죄짓게 하다’로 직접 드러냈습니다.
theological_decisions:
- issue: 히브리어 관용구 ‘야훼의 눈에’의 처리
  chosen_reading: 직역에 가까운 평가 관용구를 유지했습니다.
  alternative_readings:
  - ‘야훼 보시기에’로 완화
  - ‘야훼 앞에서’로 일반화
  rationale: 본문은 단순한 인상평이 아니라 언약적 도덕 판단을 선언하므로, 관용구의 평가성을 약화하지 않는 표현을 택했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2 (source transparency)
- issue: 여로보암의 죄와 이스라엘의 죄책 사이의 연결
  chosen_reading: ‘그 죄로 여로보암이 이스라엘을 죄짓게 했습니다’로 인과를 분명히 했습니다.
  alternative_readings:
  - ‘그 죄와 함께 이스라엘도 죄를 지었습니다’
  - ‘그의 죄 때문에 이스라엘이 죄를 지었습니다’
  rationale: 본문은 단순한 역사 보고가 아니라 지도자의 죄가 공동체를 죄로 이끈다는 신학적 비난을 포함하므로, 인과를 분명히 표현했습니다.
  doctrine_reference: 'DOCTRINE.md: covenant accountability and corporate sin'
