revisions:
- from: 그는 야훼의 눈에 악한 일을 했습니다. 그의 조상들이 한 것처럼 했으며, 느밧의 아들 여로보암의 죄에서 돌이키지 않았습니다. 그 죄로 여로보암이 이스라엘을 죄짓게 했습니다.[a]
  to: 그는 야훼께서 보시기에 악을 행했습니다. 그는 그의 조상들이 행한 것처럼 행했으며, 느밧의 아들 여로보암의 죄들[a]에서 돌이키지 않았습니다. 여로보암은 그 죄들로 이스라엘을 죄짓게 했습니다.
  rationale: 정형적 평가 관용구를 자연스러운 합쇼체로 다듬고, ‘죄들’로 원문의 복수형을 보존했습니다. 본문은 영어 POB와 같이 관계절을 죄들과 긴밀히 연결하여 여로보암이 그 죄들로 이스라엘을 죄짓게 했다는 독해를 채택했습니다. 동시에 각주를 관계절의 실제 문법적 쟁점에 맞게 고쳐, 여로보암을 직접 수식하는 대안도 보존했습니다.
