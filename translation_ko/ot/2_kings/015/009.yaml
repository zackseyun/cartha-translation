  verdict: revise
  source_fidelity: 히브리어의 ‘야훼께서 보시기에 악을 행하다’라는 평가 관용구와 두 차례의 행위 진술을 자연스럽게 보존해야 합니다. 또한 관계절은 여로보암 또는 그의 죄들을 선행사로 볼 여지가 있으므로, 본문에서는 영어 POB의 선택을 따라 죄들을 수단으로 한 독해를 제시하되 각주에서 인물 수식 독해를 정확히 밝혀야 합니다.
  naturalness: 초안의 ‘야훼의 눈에 악한 일을 했습니다’보다 ‘야훼께서 보시기에 악을 행했습니다’가 현대 표준 한국어 성경 문체로 더 자연스럽고 격식에 맞습니다. ‘그 죄로’는 앞선 복수형 명사와의 연결 및 관계절의 의미를 다소 축소하므로 ‘그 죄들로’가 더 정확합니다.
  terminology: ‘야훼’, ‘느밧의 아들 여로보암’, ‘이스라엘’은 적절합니다. חַטֹּאות의 복수형은 한국어에서도 ‘죄들’로 보존하는 편이 최적등가 원칙에 더 부합합니다. אֲבֹתָיו는 이 왕조 문맥에서 자연스러운 ‘그의 조상들’로 유지할 수 있습니다.
