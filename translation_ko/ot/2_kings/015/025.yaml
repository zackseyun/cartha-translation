source:
  edition: WLC
  text: וַ/יִּקְשֹׁ֣ר עָלָי/ו֩ פֶּ֨קַח בֶּן רְמַלְיָ֜הוּ שָׁלִישׁ֗/וֹ וַ/יַּכֵּ֨/הוּ בְ/שֹׁמְר֜וֹן בְּ/אַרְמ֤וֹן בֵּית מלך אֶת אַרְגֹּ֣ב וְ/אֶת הָ/אַרְיֵ֔ה וְ/עִמּ֛/וֹ חֲמִשִּׁ֥ים אִ֖ישׁ מִ/בְּנֵ֣י גִלְעָדִ֑ים וַ/יְמִיתֵ֖/הוּ וַ/יִּמְלֹ֥ךְ תַּחְתָּֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/025.yaml
  text: Then Pekah son of Remaliah[a], his officer, conspired against him and struck him down in Samaria, in the citadel of the king’s house, with Argob and Arieh, and with him were fifty men of the Gileadites[d][c][b]. So he put him to death and reigned in his place.
  footnotes:
  - marker: a
    text: Or 'his captain.' The Hebrew שָׁלִישׁ refers to a high-ranking military officer, but the exact rank is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Or 'in the palace of the king’s house.' The Hebrew אַרְמוֹן can denote a palace or fortified royal residence.
    reason: lexical_alternative
  - marker: c
    text: אַרְיֵה may be understood as the personal name 'Arieh'; lexically the word can also mean 'lion,' but here it is best read as a name alongside Argob.
    reason: lexical_alternative
  - marker: d
    text: Or 'and with him fifty men from the Gileadites.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 르말랴의 아들 베가가 그의 장관인 그를 거슬러 반역하여, 사마리아의 왕궁 요새에서 그를 치고, 길르앗 사람 오십 명과 함께 있던 아르곱과 아리엘도 함께 쳤습니다. 그래서 그를 죽이고, 그의 자리에 왕이 되었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘장관’은 שָׁלִישׁ의 대략적 의미를 살린 번역이며, 정확한 계급은 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘왕궁 요새’는 אַרְמוֹן을 ‘궁전’보다 더 요새화된 왕실 거처로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘아리엘’은 כאן의 הָאַרְיֵה를 인명으로 본 이해를 따른 것입니다. 문자적으로는 ‘사자’라는 뜻이 될 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘길르앗 사람 오십 명과 함께 있던’은 ‘길르앗 사람들 가운데 오십 명이 그와 함께 있었다’는 뜻을 압축한 표현입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  english_pob_choice: conspired against him
  chosen_korean: 그를 거슬러 반역하여
  alternatives_korean:
  - 그를 상대로 음모를 꾸며
  - 그를 대적하여 모반하여
  lexicon: HALOT
  rationale: 왕권을 겨냥한 정치적 반역이라는 점을 살려, 단순한 ‘계획’이 아니라 공적 배신을 드러내는 표현으로 옮겼습니다.
- source_word: שָׁלִישׁוֹ
  english_pob_choice: his officer
  chosen_korean: 그의 장관
  alternatives_korean:
  - 그의 군관
  - 그의 호위대장
  lexicon: HALOT
  rationale: 직함의 정확한 계급은 불확실하지만, 왕에게 딸린 고위 관료/군사 책임자라는 관계를 한국어에서 가장 무난하게 드러내는 말로 처리했습니다.
- source_word: בְּאַרְמוֹן בֵּית מֶלֶךְ
  english_pob_choice: in the citadel of the king’s house
  chosen_korean: 왕궁 요새에서
  alternatives_korean:
  - 왕의 집 궁전에서
  - 왕궁의 성채에서
  lexicon: HALOT
  rationale: אַרְמוֹן의 ‘궁전/성채/요새’ 의미를 반영하되, 뒤의 ‘왕의 집’과의 중복을 줄이기 위해 ‘왕궁 요새’로 압축했습니다.
- source_word: וְעִמּוֹ חֲמִשִּׁים אִישׁ מִבְּנֵי גִלְעָדִים
  english_pob_choice: and with him were fifty men from the Gileadites
  chosen_korean: 길르앗 사람 오십 명과 함께 있던
  alternatives_korean:
  - 길르앗 사람 오십 명이 그와 함께 있었던
  - 길르앗 사람들 가운데 오십 명과 함께 있던
  lexicon: HALOT
  rationale: 히브리어의 서술적 절을 자연스러운 수식어로 풀되, ‘מִן’의 부분적 뉘앙스를 살려 ‘길르앗 사람’으로 옮겼습니다.
theological_decisions:
- issue: אָרְיֵה를 인명으로 볼지, 일반명사 ‘사자’로 볼지
  chosen_reading: 문맥상 아르곱과 나란한 고유명사로 보고 ‘아리엘’로 옮겼습니다.
  alternative_readings:
  - ‘사자’로 이해하여 ‘아르곱과 사자’
  - 음역만 하고 의미 판단을 유보
  rationale: 두 개의 직접목적어가 병렬로 제시되고, 인명으로 읽는 것이 서사 구조에 가장 잘 맞습니다.
  doctrine_reference: 본문 문맥 해석
