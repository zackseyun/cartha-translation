  text: ה֣וּא דְבַר יְהוָ֗ה אֲשֶׁ֨ר דִּבֶּ֤ר אֶל יֵהוּא֙ לֵ/אמֹ֔ר בְּנֵ֣י רְבִיעִ֔ים יֵשְׁב֥וּ לְ/ךָ֖ עַל כִּסֵּ֣א יִשְׂרָאֵ֑ל וַֽ/יְהִי כֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/012.yaml
  text: This was the word of Yahweh that he spoke to Jehu, saying, “Your sons to the fourth generation shall sit on the throne of Israel.” And so it happened.
translation:
  language: ko
  text: 이것은 야훼께서 예후에게 이렇게 말씀하신 야훼의 말씀입니다. “네 자손이 사대에 걸쳐 이스라엘의 왕좌에 앉을 것이다.” 그리고 그대로 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא דְבַר יְהוָה
  english_pob_choice: This was the word of Yahweh
  chosen_korean: 이것은 야훼의 말씀입니다
  alternatives_korean:
  - 그것은 야훼의 말씀입니다
  - 이것은 주님의 말씀입니다
  lexicon: HALOT
  rationale: הוּא는 앞 문맥의 성취를 가리키는 지시용법으로 보아 “이것은”이 자연스럽고, דְבַר יְהוָה는 ‘야훼의 말씀’으로 직접 옮겨 개인적 신적 발화를 드러냅니다.
- source_word: בְּנֵי רְבִיעִים
  english_pob_choice: Your sons to the fourth generation
  chosen_korean: 네 자손이 네 대를 이어
  alternatives_korean:
  - 네 아들들이 네 대째에
  - 네 자손이 네 세대까지
  lexicon: HALOT
  rationale: 직역하면 ‘네 아들들, 네 번째 세대’이지만, 문맥상 예후의 왕조 계승을 뜻하므로 ‘자손’으로 풀되 혈통의 연속성을 살린 ‘네 대를 이어’로 옮겼습니다.
- source_word: יֵשְׁבוּ לְךָ עַל כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: shall sit on the throne of Israel
  chosen_korean: 이스라엘의 왕좌에 앉을 것이다
  alternatives_korean:
  - 이스라엘의 보좌에 앉을 것이다
  - 이스라엘의 왕좌에 앉아 있을 것이다
  lexicon: HALOT
  rationale: יָשַׁב + על הכִּסֵּא는 즉위 관용구이므로 ‘앉다’로 살리되, 현대 한국어에서 왕권 이미지를 분명히 하는 ‘왕좌’를 택했습니다.
- source_word: וַיְהִי כֵן
  english_pob_choice: And so it happened
  chosen_korean: 그리고 그대로 되었습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그리하여 이루어졌습니다
  lexicon: HALOT
  rationale: 이 공식은 예언 성취를 표시하므로, 사건의 실현을 자연스럽게 전달하는 현대적 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼의 이름을 어떻게 옮길지
  chosen_reading: ‘야훼’로 직접 음역했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 יְהוָה를 직접 사용하므로, POB 원칙에 따라 신적 호칭으로 대체하지 않고 고유 이름을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
