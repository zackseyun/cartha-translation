  to: 이것은 야훼께서 예후에게 이렇게 말씀하신 야훼의 말씀입니다. “네 자손이 사대에 걸쳐 이스라엘의 왕좌에 앉을 것이다.” 그리고 그대로 되었습니다.
  rationale: 히브리어의 지시적 회고(‘이것은’), 야훼의 말씀, 예후에게 주어진 인용 발화, 왕좌에 앉는 왕조 계승, 그리고 성취 공식을 모두 보존했습니다. 문장 구조를 현대 표준어 합쇼체에 맞게 정리하고, 세대 범위를 더 명료하게 했습니다.
