  text: וְ/יֶ֥תֶר דִּבְרֵי פֶ֖קַח וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הִנָּ֣/ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/031.yaml
  text: Now the rest of the acts of Pekah[a], and all that he did—behold, they are written in the Book of the Chronicles of the Kings of Israel.
  footnotes:
  - marker: a
    text: Or 'the annals of the kings of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 남은 베가의 행적과 그가 한 모든 일은 보십시오, 그것들이 이스라엘 왕들의 역대기에 기록되어 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 왕들의 연대기’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 남은
  alternatives_korean:
  - 그리고 남은
  - 그 밖의
  lexicon: HALOT
  rationale: 왕의 통치 결산 공식에서 וְיֶתֶר은 단순한 접속보다 ‘남은/그 밖의’라는 요약 전환을 나타내므로, 자연스러운 한국어로 ‘이제 남은’이라고 옮겼습니다.
- source_word: דִּבְרֵי פֶקַח
  english_pob_choice: the acts of Pekah
  chosen_korean: 베가의 행적
  alternatives_korean:
  - 베가의 일들
  - 베가의 사건들
  - 베가의 말들
  lexicon: HALOT
  rationale: 직역하면 ‘말/일들’이지만, 왕정사 문맥에서는 기록된 통치 행위 전체를 가리키므로 POB의 ‘acts’를 따라 ‘행적’으로 옮겼습니다.
- source_word: הִנָּם כְּתוּבִים
  english_pob_choice: behold, they are written
  chosen_korean: 보십시오, 그것들이 … 기록되어 있습니다
  alternatives_korean:
  - 보라, 그것들이 … 기록되어 있습니다
  - 그것들이 … 기록되어 있습니다
  lexicon: HALOT
  rationale: הִנָּם의 지시적·주목 환기 효과를 살리기 위해 ‘보십시오’로 옮기고, 수동 분사 כְּתוּבִים은 문서적 상태를 나타내는 현재 완료적 표현으로 ‘기록되어 있습니다’라고 했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기
  alternatives_korean:
  - 이스라엘 왕들의 연대기
  - 이스라엘 왕들의 일지
  lexicon: HALOT
  rationale: סֵפֶר דִּבְרֵי הַיָּמִים은 왕정 연대기/역대 기록을 가리키는 관용구이므로, 문서 제목의 기능을 살려 ‘역대기’로 옮겼습니다. לְמַלְכֵי יִשְׂרָאֵל은 ‘이스라엘 왕들에 관한’이라는 소유·귀속 관계이므로 ‘이스라엘 왕들의’로 처리했습니다.
