source:
  edition: WLC
  text: רַ֤ק הַ/בָּמוֹת֙ לֹ֣א סָ֔רוּ ע֗וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמ֑וֹת ה֗וּא בָּנָ֛ה אֶת שַׁ֥עַר בֵּית יְהוָ֖ה הָ/עֶלְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/035.yaml
  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'burning incense on the high places.' The Hebrew verb can refer more specifically to burning incense or more broadly to making an offering go up in smoke.
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 산당들은 철거되지 않았습니다. 백성은 여전히 산당들에서 제사를 드리고 분향하고 있었습니다[a]. 그는 야훼의 집 윗문을 건축했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 מְקַטְּרִים은 더 구체적으로는 향을 피우는 행위일 수 있으나, 더 넓게는 제물을 연기로 올려 드리는 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  - 그런데
  lexicon: HALOT
  rationale: 앞선 평가를 제한하는 예외를 표시하는 말로, 한국어에서는 문맥상 ‘다만’이 가장 자연스럽고 과도한 대조를 피합니다.
- source_word: הַבָּמוֹת / בַּבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 고지들
  - 산당
  lexicon: HALOT
  rationale: 왕기 문맥에서 בָּמוֹת은 단순한 지형이 아니라 불법적 예배 처소를 가리키므로, 전통적 교회용어를 유지하되 복수성을 살려 ‘산당들’로 옮깁니다.
- source_word: וּמְקַטְּרִים
  english_pob_choice: burning incense
  chosen_korean: 분향하고
  alternatives_korean:
  - 향을 피우고
  - 연기로 드리고
  - 향을 사르고
  lexicon: HALOT
  rationale: קטר는 향을 피우는 행위를 가리킬 수 있으므로, 본문이 요구하는 제의적 행위를 간결하게 드러내는 ‘분향하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 프로젝트 기본 원칙에 따라 신명은 ‘야훼’로 옮겨 언약 სახელ을 보존합니다.
- source_word: הָעֶלְיוֹן
  english_pob_choice: upper
  chosen_korean: 위쪽
  alternatives_korean:
  - 상층의
  - 윗
  - 높은
  lexicon: HALOT
  rationale: 문맥상 성전의 위치를 구분하는 형용사이므로, 한국어에서는 자연스러운 위치 표시인 ‘위쪽’으로 처리했습니다.
theological_decisions:
- issue: 산당 예배의 지속에 대한 평가를 어떻게 드러낼 것인가
  chosen_reading: ‘산당들은 철거되지 않았습니다’와 ‘백성은 여전히…’로 번역해, 개혁이 있었음에도 우상/비정규 예배가 계속된 긴장을 그대로 보여 줍니다.
  alternative_readings:
  - 산당들이 아직도 제거되지 않았습니다
  - 백성은 계속 산당에서 제사하고 분향했습니다
  rationale: 히브리어의 미완료/지속적 표현과 왕기 특유의 개혁 미완성 평가를 약화하지 않기 위해 지속성과 미비함을 함께 살렸습니다.
  doctrine_reference: 2 Kings 평가 공식과 산당 비판 문맥
- issue: ‘분향’의 범위를 좁힐 것인가 넓힐 것인가
  chosen_reading: ‘분향하고’로 옮겨 제의적 연기 상승을 포함하는 넓은 의미를 살렸습니다.
  alternative_readings:
  - 향을 피우고
  - 제물을 불사르고
  rationale: 본문의 קטר는 단순 향 연소를 넘어 제의적 연기 상승을 포함할 수 있으므로, 지나치게 좁히지 않되 한국어로는 익숙한 예배 동사를 택했습니다.
  doctrine_reference: 2 Kings 15:35 lexical ambiguity
