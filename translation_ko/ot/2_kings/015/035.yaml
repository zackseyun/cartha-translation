  text: Only the high places were not removed; the people still were sacrificing and burning incense on the high places[a]. He built the upper gate of the house of Yahweh.
  footnotes:
  - marker: a
    text: Or 'burning incense on the high places.' The Hebrew verb can refer more specifically to burning incense or more broadly to making an offering go up in smoke.
