translation:
  language: ko
  text: 다만 산당들은 철거되지 않았습니다. 백성은 여전히 산당들에서 제사를 드리고 분향하고 있었습니다[a]. 그가 야훼의 집의 위쪽 문을 건축했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 מְקַטְּרִים은 더 구체적으로는 향을 피우는 행위일 수 있으나, 더 넓게는 제물을 연기로 올려 드리는 행위를 가리킬 수도 있습니다.
    reason: lexical_alternative
