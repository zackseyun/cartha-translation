lexical_decisions:
- source_word: בִּ/שְׁנַת שְׁלֹשִׁים וָ/תֵשַׁע שָׁנָה
  english_pob_choice: In the thirty-ninth year
  chosen_korean: 서른아홉째 해에
  alternatives_korean:
  - 서른아홉 해에
  - 서른아홉 번째 해에
  lexicon: HALOT
  rationale: 왕 연대기 공식에서는 ‘...째 해’가 순서를 나타내는 관용적 표현이어서, 연대기적 동기화의 뜻을 자연스럽게 살렸습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었고
  alternatives_korean:
  - 즉위했고
  - 다스리기 시작했고
  lexicon: HALOT
  rationale: 여기서는 통치 기간과 별도로 즉위 사실을 알리는 동사이므로, ‘왕이 되다’로 액세스 사건을 분명히 했습니다.
- source_word: מְנַחֵם בֶּן גָּדִי
  english_pob_choice: Menahem son of Gadi
  chosen_korean: 가디의 아들 므나헴
  alternatives_korean:
  - 가디의 아들 메나헴
  - 므나헴, 가디의 아들
  lexicon: HALOT
  rationale: 고유명사는 현대 한국어 음역을 따르고, בן은 혈통 표지이므로 ‘가디의 아들’로 옮겼습니다.
- source_word: בְּ/שֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아 안에서
  - 사마리아에
  lexicon: HALOT
  rationale: സ്ഥ소 부사구는 통치 거점을 가리키므로 한국어에서는 자연스럽게 ‘-에서’로 처리했습니다.
