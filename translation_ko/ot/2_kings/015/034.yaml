translation:
  language: ko
  text: 그는 야훼께서 보시기에 옳은 일을 했습니다. 그의 아버지 웃시야[a]가 행한 모든 대로 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 ‘웃시야’라고 합니다. 이 왕은 다른 곳에서는 ‘아사랴’로도 불립니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 그는 … 했습니다
  alternatives_korean:
  - 그는 … 하였습니다
  - 그는 … 행했습니다
  lexicon: HALOT
  rationale: 서술의 단순한 진행을 자연스러운 현대 한국어 과거형으로 옮겼습니다.
- source_word: הַיָּשָׁר בְּעֵינֵי יְהוָה
  english_pob_choice: what was right in the eyes of Yahweh
  chosen_korean: 야훼 보시기에 옳은 일
  alternatives_korean:
  - 야훼의 눈에 옳은 일
  - 야훼 앞에서 옳은 일
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서 가장 자연스러운 평가 표현인 '보시기에 옳은 일'로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문이 신명기적 평가의 기준으로 삼는 고유명은 전통적 대체어가 아니라 자료 지침대로 '야훼'를 사용했습니다.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  english_pob_choice: according to all that ... had done
  chosen_korean: 곧 …가 한 모든 것과 같았습니다
  alternatives_korean:
  - …가 행한 모든 대로였습니다
  - …가 했던 모든 것에 따라였습니다
  lexicon: HALOT
  rationale: 비교·준거의 뜻을 유지하면서 한국어에서 어색하지 않은 '…와 같았습니다'로 처리했습니다.
- source_word: עֻזִיָּהוּ אָבִיו
  english_pob_choice: his father Uzziah
  chosen_korean: 그의 아버지 웃시야
  alternatives_korean:
  - 그의 아버지 아사랴
  - 아버지 웃시야
  lexicon: HALOT
  rationale: 마소라 본문에 있는 이름 형태를 따라 '웃시야'로 옮기고, 본문의 대조를 위해 '그의 아버지'를 앞에 두었습니다.
theological_decisions:
- issue: 야훼의 고유명 보존
  chosen_reading: 전통적 대체어 없이 '야훼'를 본문에 직접 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문은 왕의 행위가 누구의 기준에 합당한지를 분명히 드러내므로, 신적 평가의 기준이 되는 고유명을 유지하는 것이 원문의 힘을 더 정확히 전달합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
