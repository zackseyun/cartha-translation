  text: בִּ/שְׁנַ֨ת חֲמִשִּׁ֤ים וּ/שְׁתַּ֨יִם֙ שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פֶּ֣קַח בֶּן רְמַלְיָ֧הוּ עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן עֶשְׂרִ֥ים שָׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/027.yaml
  text: In the fifty-second year of Azariah king of Judah, Pekah son of Remaliah became king over Israel in Samaria, and he reigned twenty years.
translation:
  language: ko
  text: 유다 왕 아사랴의 오십이 년에, 르말랴의 아들 페카가 사마리아에서 이스라엘의 왕이 되어 스무 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּ/שְׁנַת חֲמִשִּׁים וּ/שְׁתַּיִם שָׁנָה
  english_pob_choice: In the fifty-second year
  chosen_korean: 유다 왕 아사랴의 오십이 년에
  alternatives_korean:
  - 아사랴 왕의 쉰두 번째 해에
  - 유다 왕 아사랴의 쉰두 번째 해에
  lexicon: WLC regnal formula; HALOT
  rationale: 열왕기상의 통상적인 치세 연대 공식을 한국어로 자연스럽게 옮기되, ‘오십이 년’으로 연대 표기를 유지해 원문의 연대 구조를 드러냈습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되어
  alternatives_korean:
  - 즉위하여
  - 왕이 되었습니다
  lexicon: HALOT
  rationale: מלך의 즉위 의미를 살려, 뒤의 재위 기간 표현과 중복되지 않도록 ‘왕이 되어’로 옮겼습니다.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  english_pob_choice: Pekah son of Remaliah
  chosen_korean: 르말랴의 아들 페카
  alternatives_korean:
  - 페카, 르말랴의 아들
  - 페카 아들 르말랴
  lexicon: WLC proper names
  rationale: 히브리어 친족표현을 직역해 부친 표지를 보존하면서, 인명은 현대 한국어 음역에 맞춰 옮겼습니다.
- source_word: עַל יִשְׂרָאֵל בְּ/שֹׁמְרוֹן
  english_pob_choice: over Israel in Samaria
  chosen_korean: 사마리아에서 이스라엘의 왕이
  alternatives_korean:
  - 이스라엘을 다스리며 사마리아에
  - 사마리아에서 이스라엘 위에
  lexicon: HALOT
  rationale: ‘ישראל 위에’라는 통치 구문을 한국어 왕정 서술로 자연스럽게 풀되, 사마리아를 통치 소재지로 분명히 했습니다.
- source_word: עֶשְׂרִ֥ים שָׁנָֽה
  english_pob_choice: twenty years
  chosen_korean: 스무 해 동안 다스렸습니다
  alternatives_korean:
  - 이십 년 동안 다스렸습니다
  - 스무 해를 다스렸습니다
  lexicon: HALOT
  rationale: 재위 기간을 한국어 관용에 맞게 ‘스무 해’로 옮기고, 동사 ‘다스렸습니다’로 재위 사실을 명시했습니다.
