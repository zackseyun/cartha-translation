source:
  edition: WLC
  text: רַ֥ק הַ/בָּמ֖וֹת לֹא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/004.yaml
  text: Only the high places were not removed; the people still were sacrificing and making offerings in smoke on the high places.
  footnotes:
  - marker: a
    text: Or 'burning incense on the high places.' The Hebrew verb can refer specifically to burning incense or more broadly to making an offering go up in smoke.
    reason: lexical_alternative
translation:
  language: ko
  text: 오직 산당들만 제거되지 않았습니다. 백성은 여전히 산당들에서 제사를 드리고, 연기를 올리고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사 מְקַטְּרִים은 구체적으로 '향을 피우다'를 뜻할 수도 있고, 더 넓게 '연기 가운데 제물을 올리다'를 뜻할 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 오직
  alternatives_korean:
  - 다만
  - 그러나
  - 그런데
  lexicon: HALOT
  rationale: 문맥상 앞선 왕 평가에 대한 예외를 표시하는 짧은 대조로서, 한국어에서는 '오직'이 가장 자연스럽고 압축적인 대응입니다.
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 고지의 제단들
  lexicon: HALOT
  rationale: בָּמוֹת는 고대 이스라엘의 제의 장소를 가리키므로, 통용되는 성서어휘인 '산당'을 쓰되 복수형을 살렸습니다.
- source_word: מְזַבְּחִים
  english_pob_choice: were sacrificing
  chosen_korean: 제사를 드리고
  alternatives_korean:
  - 희생제물을 바치고
  - 희생제를 드리고
  lexicon: HALOT
  rationale: זבח의 제의적 동작을 한국어 성서 문체로 자연스럽게 옮기면 '제사를 드리다'가 가장 직접적입니다.
- source_word: וּמְקַטְּרִים
  english_pob_choice: making offerings in smoke
  chosen_korean: 연기를 올리고
  alternatives_korean:
  - 향을 피우고
  - 연기 제사를 드리고
  lexicon: HALOT
  rationale: קטר는 문맥상 향을 태우는 행위로도, 더 넓게는 제물을 연기 가운데 올리는 행위로도 읽힐 수 있어, 의미 범위를 좁히지 않는 '연기를 올리다'로 옮겼습니다.
theological_decisions:
- issue: 산당에서의 행위가 무엇을 향한 예배인지
  chosen_reading: 본문은 백성이 산당에서 계속 제사를 드리고 연기를 올렸다고만 말하며, 그 대상이 누구인지 이 절만으로는 단정하지 않습니다.
  alternative_readings:
  - 산당에서의 행위가 곧바로 우상숭배라는 읽기
  - 여호와께 드리는 것이지만 승인되지 않은 장소에서의 예배라는 읽기
  rationale: 히브리어는 행위 자체를 진술할 뿐 대상 신격을 명시하지 않으므로, 번역도 그 긴장을 그대로 보존해야 합니다.
  doctrine_reference: 본문의 범위를 넘는 신학적 판단을 번역에 덧붙이지 않음
