id: 2KI.15.36
reference: 2 Kings 15:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יוֹתָ֖ם אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/036.yaml
  text: Now the rest of the acts of Jotham[a], which he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'recorded' instead of 'written'; the Hebrew participle is literally 'written,' but the sense is that these acts were entered in an official royal record.
    reason: lexical_alternative
  - marker: b
    text: '''Book of the Chronicles'' refers to a royal annalistic source, not necessarily the biblical book of Chronicles.'
    reason: cross_reference
translation:
  language: ko
  text: 이제 요담의 남은 행적과 그가 한 일은 유다 왕들의 역대기 책에 기록되지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기록되지 않았습니까’는 히브리어 כְּתוּבִים의 문자적 ‘쓰인’보다 문서 편입의 뜻을 드러낸 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘역대기 책’은 성경 역대기서가 아니라 유다 왕실의 연대기 자료를 가리키는 표제입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest
  chosen_korean: 이제 … 남은 행적
  alternatives_korean:
  - 그리고 … 남은 일
  - 그 밖의 … 행적
  lexicon: HALOT
  rationale: regnal-summary 공식에서 יֶתֶר는 남은 부분/나머지를 뜻하므로, 한국어에서는 자연스럽게 ‘남은 행적’으로 옮겨 요약문의 전환감을 살렸습니다.
- source_word: דִּבְרֵי … אֲשֶׁר עָשָׂה
  english_pob_choice: acts, which he did
  chosen_korean: 행적과 그가 한 일
  alternatives_korean:
  - 일과 그가 행한 것
  - 업적과 그가 한 것
  lexicon: HALOT
  rationale: 문맥상 왕의 기록된 행위를 가리키므로 직역적 ‘말들’보다 ‘행적/한 일’이 원문의 관용적 의미를 더 잘 드러냅니다.
- source_word: הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되지 않았습니까
  alternatives_korean:
  - 쓰여 있지 않습니까
  - 적혀 있지 않습니까
  lexicon: HALOT
  rationale: 히브리어 분사 כְּתוּבִים의 문자적 의미는 ‘쓰인’이지만, 여기서는 왕실 연대기 속 ‘공식적으로 기록된’ 뜻이므로 ‘기록되다’가 더 정확합니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: Book of the Chronicles
  chosen_korean: 역대기 책
  alternatives_korean:
  - 연대기 책
  - 역사 기록 책
  lexicon: HALOT
  rationale: 이 표현은 성경 역대기서 자체라기보다 왕실 연대기 자료를 가리키므로, 오해를 줄이면서도 문서 제목성을 살려 ‘역대기 책’으로 옮겼습니다.
- source_word: לְמַלְכֵי יְהוּדָה
  english_pob_choice: of the Kings of Judah
  chosen_korean: 유다 왕들의
  alternatives_korean:
  - 유다의 왕들의
  - 유다 왕들에게 속한
  lexicon: HALOT
  rationale: 소유격/소속을 나타내는 ל를 한국어 문맥에 맞게 ‘…의’로 풀어, 왕실 사료의 제목 구조를 자연스럽게 재현했습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 이 구절은 정보 요구가 아니라 독자가 이미 그렇다고 알고 있어야 하는 왕실 기록의 존재를 상기시키는 수사적 질문으로 번역했습니다.
  alternative_readings:
  - 그들은 기록되어 있습니다
  - 기록되지 않았습니까
  rationale: הֲלֹא의 관용적 기능은 반문을 통한 확인이므로, 한국어도 종결형 의문으로 유지해 서술의 공적·문서적 톤을 살렸습니다.
  doctrine_reference: 본문 수사 구조 보존
