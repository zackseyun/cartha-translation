    rationale: 히브리어의 ‘그가 행한’은 ‘행적/일들’을 수식합니다. 한국어에서는 ‘요담이 행한 나머지 일들’로 통합하면 의미를 보존하면서 더 자연스럽습니다.
  revised_text: 요담이 행한 나머지 일들은 유다 왕들의 역대기 책에 기록되어 있지 않습니까?[a][b]
