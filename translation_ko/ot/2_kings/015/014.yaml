review_pass:
  verdict: revise
  source_fidelity: 히브리어의 연속된 행위—디르사에서 올라감, 사마리아에 도착함, 살룸을 침, 그를 죽임, 그 뒤를 이어 왕이 됨—를 대체로 반영합니다. 그러나 가디의 이름이 ‘깃디’로 잘못 표기되었고, 마지막 표현은 מלך의 왕위 계승·통치 의미를 더 직접적으로 나타내는 편이 좋습니다.
  naturalness: 현대 표준 한국어 합쇼체에 맞게 자연스럽게 다듬을 수 있습니다. ‘가디의 아들인 므나헴’이라는 동격 구성이 원문에 충실하고, ‘그를 쳐 죽이고’는 두 동사를 간결하면서도 분명히 살립니다.
  terminology: 인명은 므나헴, 가디, 디르사, 사마리아, 살룸, 야베스로 통일합니다. 특히 히브리어 גָּדִי는 ‘가디’이며 ‘깃디’가 아닙니다.
  issues:
