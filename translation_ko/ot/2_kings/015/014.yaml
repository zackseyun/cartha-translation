base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/014.yaml
  text: Then Menahem son of Gadi went up from Tirzah and came to Samaria, and he struck down Shallum son of Jabesh in Samaria and put him to death, and he reigned in his place.
translation:
  language: ko
  text: 그때 가디의 아들 므나헴이 디르사에서 올라와 사마리아에 이르렀습니다. 그는 사마리아에서 야베스의 아들 살룸을 쳐 죽이고, 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라와
  alternatives_korean:
  - 올라갔습니다
  - 올라왔습니다
  lexicon: HALOT
  rationale: עלה의 기본 의미인 ‘올라가다’를 살리면서, 이동 서술의 흐름을 자연스럽게 이어 주는 형태로 옮겼습니다.
- source_word: וַיַּךְ אֶת
  english_pob_choice: struck down
  chosen_korean: 쳐서
  alternatives_korean:
  - 때려서
  - 공격하여
  lexicon: HALOT
  rationale: נכה는 이 왕위 찬탈 맥락에서 치명적 타격을 뜻하므로, 무력한 단순 ‘쳤다’보다 결과를 드러내는 ‘쳐서’가 적절합니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: put him to death
  chosen_korean: 죽이고
  alternatives_korean:
  - 사형에 처하고
  - 죽게 하고
  lexicon: HALOT
  rationale: 히필 형태의 사역성을 반영하되, 한국어에서는 앞 동작과 병렬로 이어지는 자연스러운 서술인 ‘죽이고’가 가장 직접적입니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: he reigned in his place
  chosen_korean: 그의 자리에 왕이 되었습니다
  alternatives_korean:
  - 그를 대신해 다스렸습니다
  - 그의 자리를 이어 다스렸습니다
  lexicon: HALOT
  rationale: מלך의 ‘통치/즉위’ 의미를 살리면서, ‘in his place’의 계승 관계를 한국어에서 분명히 드러내기 위해 이렇게 옮겼습니다.
