    rationale: 의미는 통하지만, וַיִּמְלֹךְ תַּחְתָּיו는 살룸의 뒤를 이어 왕이 된 계승을 나타내므로 ‘그의 뒤를 이어 왕이 되었습니다’가 더 명확하고 자연스럽습니다.
  revised_text: 그때 가디의 아들 므나헴이 디르사에서 올라와 사마리아에 이르렀습니다. 그는 사마리아에서 야베스의 아들 살룸을 쳐 죽이고, 그의 뒤를 이어 왕이 되었습니다.
