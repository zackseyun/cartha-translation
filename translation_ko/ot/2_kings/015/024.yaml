translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 했습니다. 그는 네밧의 아들 여로보암의 죄에서 떠나지 않았습니다. 그 죄는 이스라엘이 죄를 짓게 만든 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 네밧의 아들 여로보암의 죄에서 떠나지 않았습니다.”
    reason: lexical_alternative
  - marker: b
    text: 또는 “이스라엘이 죄를 짓게 한 사람입니다.”
    reason: lexical_alternative
