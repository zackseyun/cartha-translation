source:
  edition: WLC
  text: וַ/יִּקְשָׁר קֶ֜שֶׁר הוֹשֵׁ֣עַ בֶּן אֵלָ֗ה עַל פֶּ֨קַח֙ בֶּן רְמַלְיָ֔הוּ וַ/יַּכֵּ֨/הוּ֙ וַ/יְמִיתֵ֔/הוּ וַ/יִּמְלֹ֖ךְ תַּחְתָּ֑י/ו בִּ/שְׁנַ֣ת עֶשְׂרִ֔ים לְ/יוֹתָ֖ם בֶּן עֻזִיָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/030.yaml
  text: Then Hoshea son of Elah conspired in a conspiracy against Pekah son of Remaliah, struck him down, put him to death, and reigned in his place, in the twentieth year of Jotham son of Uzziah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''conspired a conspiracy,'' an emphatic expression for plotting against the king.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew reads 'in the twentieth year of Jotham son of Uzziah.' This creates a chronological difficulty in the regnal data; some interpreters attempt to harmonize it with Ahaz's reign, but the translation follows the Hebrew wording.
    reason: textual_variant
translation:
  language: ko
  text: 그때 엘라의 아들 호세아가 르말랴의 아들 베가를 상대로 반역을 일으켜 그를 쳐서 죽이고 그의 자리를 이어 다스렸습니다. 그것은 웃시야의 아들 요담의 제이십년이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘반역을 일으키다’라는 뜻의 동사-명사 결합을 사용해, 단순한 사건 묘사보다 의도적 모의의 강도를 강조합니다.
    reason: lexical_alternative
  - marker: b
    text: 본문의 ‘요담의 제이십년’은 열왕기 전체의 연대 기록과 맞물릴 때 역사적 긴장을 낳습니다. 번역은 이 표현을 그대로 따랐습니다.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְשָׁר קֶשֶׁר
  english_pob_choice: conspired against
  chosen_korean: 반역을 일으켜
  alternatives_korean:
  - 모의를 꾸며
  - 음모를 꾸며
  lexicon: HALOT
  rationale: 히브리어는 어근이 같은 동사-명사 결합으로 반역 행위를 강조하지만, 한국어에서는 이를 자연스럽게 풀어 ‘반역을 일으켜’로 옮기면 의미와 문체를 함께 살릴 수 있습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳐서
  alternatives_korean:
  - 그를 치고
  - 그를 쳐
  lexicon: HALOT
  rationale: 첫 번째 폭력 행위를 분명히 드러내되, 바로 뒤의 ‘죽이고’와 구별되도록 ‘쳐서’로 연결했습니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: put him to death
  chosen_korean: 죽이고
  alternatives_korean:
  - 사형하여
  - 죽게 하고
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스를 한국어에서 과도하게 장식하지 않으면서도, 결과를 분명히 하는 자연스러운 동사로 옮겼습니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 자리를 이어 다스렸습니다
  alternatives_korean:
  - 그를 대신해 다스렸습니다
  - 그의 자리에 왕이 되었습니다
  lexicon: HALOT
  rationale: ‘그의 자리를 이어’는 תחתיו의 계승 관계를 살리면서, ‘다스렸습니다’는 מלך의 왕권 행위를 한국어 문맥에 맞게 자연스럽게 표현합니다.
- source_word: בִּשְׁנַת עֶשְׂרִים לְיוֹתָם בֶּן עֻזִיָּה
  english_pob_choice: in the twentieth year of Jotham son of Uzziah
  chosen_korean: 웃시야의 아들 요담의 제이십년
  alternatives_korean:
  - 웃시야의 아들 요담의 제20년
  - 웃시야의 아들 요담의 스무 번째 해
  lexicon: HALOT
  rationale: 왕정 연대 표기는 본문 어순을 살려 ‘제이십년’으로 직역에 가깝게 두어, 히브리어의 공식적 연대 표지를 보존했습니다.
theological_decisions:
- issue: 요담 연대 표기의 역사적 긴장
  chosen_reading: 본문의 히브리어 표기를 그대로 따라 ‘요담의 제이십년’이라고 옮겼습니다.
  alternative_readings:
  - 아하스 통치와 조화되도록 암묵적으로 수정하기
  - 본문을 연대 문제 해결 방향으로 의역하기
  rationale: 열왕기서의 연대 기록에는 알려진 긴장이 있으나, 번역 본문이 그 문제를 임의로 해결하기보다 원문 표기를 드러내는 것이 더 투명합니다.
  doctrine_reference: Translation philosophy §1, §3, §5
