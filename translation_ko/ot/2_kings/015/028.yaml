base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/028.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 행했습니다. 그는 느밧의 아들 여로보암의 죄들에서 떠나지 않았습니다. 여로보암은 이스라엘이 죄를 짓게 한 사람입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 그는 … 악한 일을 행했습니다
  alternatives_korean:
  - 그는 … 악을 행했습니다
  - 그는 … 나쁜 일을 했습니다
  lexicon: HALOT
  rationale: 왕정 평가 공식의 관용적 표현을 한국어 합쇼체로 자연스럽게 옮기되, 단순한 ‘악’보다 ‘악한 일을 행하다’가 평가 문구의 기능을 더 분명히 드러냅니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 직역적인 ‘눈에’보다 한국어 성경 문체에서 평가·판단의 관용구를 살리는 ‘보시기에’가 원문의 비유를 가장 자연스럽게 보존합니다.
- source_word: לֹא סָר מִן חַטֹּאות
  english_pob_choice: He did not turn away from the sins
  chosen_korean: 죄에서 돌아서지 않았으며
  alternatives_korean:
  - 죄에서 떠나지 않았으며
  - 죄를 버리지 않았으며
  lexicon: HALOT
  rationale: סור עם מן은 단순 이동이 아니라 이전의 길에서 물러남을 뜻하므로, 도덕적 이탈을 드러내는 ‘돌아서지 않다’가 적절합니다.
- source_word: יָרָבְעָם בֶּן נְבָט
  english_pob_choice: Jeroboam son of Nebat
  chosen_korean: 여로보암의 아들 느밧
  alternatives_korean:
  - 느밧의 아들 여로보암
  - 여로보암 아들 느밧
  lexicon: HALOT
  rationale: 히브리어 친족관계 표지를 한국어의 가장 표준적인 소유격 구조로 옮겼습니다. 인명은 통용되는 성경 표기인 ‘여로보암’, ‘느밧’을 따랐습니다.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: who caused Israel to sin
  chosen_korean: 그 죄로 이스라엘에게 죄를 짓게 한 자
  alternatives_korean:
  - 이스라엘을 죄짓게 한 자
  - 이스라엘로 하여금 죄를 짓게 한 자
  lexicon: HALOT
  rationale: החטיא의 사역적 의미를 살려 단순한 유도보다 ‘죄를 짓게 하다’로 옮겼습니다. 관계절의 기능도 유지해 여로보암의 책임을 분명히 합니다.
theological_decisions:
- issue: 예언자적/왕정 평가 공식에서 יְהוָה를 어떻게 표기할 것인가
  chosen_reading: 야훼
  alternative_readings:
