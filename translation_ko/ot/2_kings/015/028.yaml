  - 주님
  rationale: 본문은 Tetragrammaton יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유 신명인 ‘야훼’를 본문에 유지했습니다.
  doctrine_reference: 'POB glossary: יְהוָה / YHWH → 야훼'
