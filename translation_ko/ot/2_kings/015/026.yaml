  lexicon: HALOT
  rationale: הִנָּם의 지시적·강조적 기능을 ‘보라’로 살리고, 수동 분사 כְּתוּבִים는 현대 한국어에서 자연스러운 ‘기록되어 있습니다’로 옮겼습니다.
