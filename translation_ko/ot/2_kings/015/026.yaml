  - 연대 기록책
  - 역사서
  lexicon: HALOT
  rationale: 문서명으로서의 관용구를 살리되, 한국어 독자가 이해하기 쉬운 ‘역대 기록책’으로 옮겨 ‘기록된 연대기’라는 기능을 드러냈습니다.
theological_decisions:
- issue: רג정체 요약 공식의 문체
  chosen_reading: 연대기적 결산 공식의 반복성과 공적 기록성을 살려 건조한 서술형으로 유지했습니다.
  alternative_readings:
  - 더 매끄러운 의역으로 풀어 쓰기
  - ‘남아 있는 일들’처럼 설명을 덧붙이기
  rationale: 이 구절은 신학적 해설보다 왕정 사료 참조를 알리는 공식 문장이라, 내용 확대 없이 기록성 자체를 보존하는 것이 원문의 의도를 더 잘 전달합니다.
  doctrine_reference: 열왕기하 15:26의 왕정 결산 공식
