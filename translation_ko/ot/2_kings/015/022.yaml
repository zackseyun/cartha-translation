  text: And Menahem lay down with his fathers[a], and Pekahiah his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'slept with his fathers.' The Hebrew idiom is a standard formula for a king's death and succession.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 메나헴이 그의 조상들과 함께 누웠고, 그의 아들 브가히야가 그를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 조상들과 함께 잠들었고’. 이 히브리어 관용구는 왕의 죽음과 계승을 나타내는 표준 공식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב ... עִם אֲבֹתָיו
  english_pob_choice: lay down with his fathers
  chosen_korean: 그의 조상들과 함께 누웠고
  alternatives_korean:
  - 그의 조상들과 함께 잠들었고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어의 왕의 죽음 공식인 ‘누웠다 + 조상들과 함께’의 관용을 살리되, 단순히 ‘죽었다’로 풀어 쓰지 않고 한국어에서도 이미지가 남도록 옮겼습니다.
- source_word: וַיִּמְלֹךְ
  english_pob_choice: reigned
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 통치했습니다
  - 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 ‘reigned’의 기능을 자연스럽게 전달하면서도, 한국어 합쇼체 서술에 맞게 ‘왕이 되었습니다’로 옮겼습니다.
- source_word: פְּקַחְיָה
  english_pob_choice: Pekahiah
  chosen_korean: 브가히야
  alternatives_korean:
  - 페카히야
  - 베가히야
  lexicon: standard transliteration
  rationale: 히브리어 인명 פְּקַחְיָה를 한국어 음역 관행에 따라 브가히야로 옮겼습니다.
- source_word: תַּחְתָּיו
  english_pob_choice: in his place
  chosen_korean: 그를 이어
  alternatives_korean:
  - 그의 자리에
  - 그 대신
  lexicon: HALOT
  rationale: 왕위 계승 공식에서 תַּחְתָּיו는 단순한 공간적 ‘아래’가 아니라 교체·승계를 뜻하므로, 한국어로는 ‘그를 이어’가 가장 자연스럽습니다.
theological_decisions:
- issue: 왕의 죽음과 계승을 나타내는 관용구의 처리
  chosen_reading: ‘조상들과 함께 누웠고’와 ‘그를 이어 왕이 되었습니다’를 함께 유지해, 죽음과 즉위가 하나의 왕조 공식으로 읽히게 했습니다.
  alternative_readings:
  - ‘죽었고’로 단순화
  - ‘잠들었고’로 완화
  rationale: 본문은 단순한 사망 통보가 아니라 왕의 죽음과 후계자 즉위를 연결하는 정형 공식이므로, 두 요소를 함께 드러내는 번역이 의미를 가장 충실히 보존합니다.
  doctrine_reference: 역사서의 왕조 공식
- issue: 인명 음역의 표준화
  chosen_reading: פְּקַחְיָה를 브가히야로 표기했습니다.
  alternative_readings:
  - 페카히야
  - 베가히야
  rationale: 본문의 고유명사는 한국어 성경 독자에게 익숙한 현대 음역 관행을 따르되, 원어와의 대응이 분명하도록 일관되게 처리했습니다.
  doctrine_reference: 고유명사 음역 원칙
