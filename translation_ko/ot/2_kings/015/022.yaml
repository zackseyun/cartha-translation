theological_decisions:
- issue: 왕의 죽음과 계승을 나타내는 관용구의 처리
  chosen_reading: ‘조상들과 함께 누웠고’와 ‘그를 이어 왕이 되었습니다’를 함께 유지해, 죽음과 즉위가 하나의 왕조 공식으로 읽히게 했습니다.
  alternative_readings:
  - ‘죽었고’로 단순화
  - ‘잠들었고’로 완화
  rationale: 본문은 단순한 사망 통보가 아니라 왕의 죽음과 후계자 즉위를 연결하는 정형 공식이므로, 두 요소를 함께 드러내는 번역이 의미를 가장 충실히 보존합니다.
  doctrine_reference: 역사서의 왕조 공식
- issue: 인명 음역의 표준화
  chosen_reading: פְּקַחְיָה를 브가히야로 표기했습니다.
  alternative_readings:
