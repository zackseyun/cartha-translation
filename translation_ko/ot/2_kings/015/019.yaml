revisions:
- from: 앗수르 왕 풀이 그 땅에 와서, 므나헴은 풀에게 은 천 달란트를 주어 그의 손이 자기와 함께 있게 하고, 왕국을 그의 손에 굳게 하려 하였습니다.[a]
  to: 앗수르 왕 풀이 그 땅을 치러 오자, 므나헴은 풀이 자기를 도와 왕국을 자기 손에 굳게 세우도록 그에게 은 천 달란트를 주었습니다.[a][b]
