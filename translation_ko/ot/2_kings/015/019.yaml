  naturalness: 초안의 문장은 ‘그의 손이 자기와 함께 있게 하고, 왕국을 그의 손에’에서 대명사 지시가 혼란스럽고 한국어로 다소 직역투입니다. 인물 이름과 ‘자기’를 보완하면 현대 한국어 합쇼체로 자연스럽고 명료해집니다.
