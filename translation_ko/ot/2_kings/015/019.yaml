source:
  edition: WLC
  text: בָּ֣א פ֤וּל מֶֽלֶךְ אַשּׁוּר֙ עַל הָ/אָ֔רֶץ וַ/יִּתֵּ֤ן מְנַחֵם֙ לְ/פ֔וּל אֶ֖לֶף כִּכַּר כָּ֑סֶף לִ/הְי֤וֹת יָדָי/ו֙ אִתּ֔/וֹ לְ/הַחֲזִ֥יק הַ/מַּמְלָכָ֖ה בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/019.yaml
  text: Pul king of Assyria came against the land[b][a], and Menahem gave Pul a thousand talents of silver so that his hand might be with him to strengthen the kingdom in his hand.
  footnotes:
  - marker: a
    text: Or, more idiomatically, 'so that he might support him in strengthening the kingdom under his control.' The Hebrew reads literally, 'so that his hand might be with him to strengthen the kingdom in his hand.'
    reason: lexical_alternative
  - marker: b
    text: '''The land'' likely refers to the land of Israel.'
    reason: cultural_note
translation:
  language: ko
  text: 앗수르 왕 풀이 그 땅에 와서, 므나헴은 풀에게 은 천 달란트를 주어 그의 손이 자기와 함께 있게 하고, 왕국을 그의 손에 굳게 하려 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘그 땅’은 아마 이스라엘 땅을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: בָּא
  english_pob_choice: came
  chosen_korean: 와서
  alternatives_korean:
  - 왔습니다
  - 내려왔습니다
  lexicon: HALOT
  rationale: 서술 흐름을 살리면서도 군사적 진군의 뉘앙스를 자연스럽게 담기 위해 ‘와서’로 옮겼습니다.
- source_word: מֶֽלֶךְ אַשּׁוּר
  english_pob_choice: king of Assyria
  chosen_korean: 앗수르 왕
  alternatives_korean:
  - 앗시리아 왕
  - 앗수르의 왕
  lexicon: HALOT
  rationale: 고유명사와 관용적 어순을 살려 현대 한국어 성경 문체에 맞게 옮겼습니다.
- source_word: עַל הָאָרֶץ
  english_pob_choice: against the land
  chosen_korean: 그 땅에
  alternatives_korean:
  - 그 땅을 향해
  - 그 땅을 치러
  lexicon: HALOT
  rationale: 영문 POB가 유지한 ‘the land’의 절제된 표현을 따르되, 한국어에서는 ‘와서’와 함께 군사적 긴장을 자연스럽게 드러내기 위해 ‘그 땅에’로 처리했습니다.
- source_word: וַיִּתֵּן
  english_pob_choice: gave
  chosen_korean: 주어
  alternatives_korean:
  - 바쳐
  - 냈습니다
  lexicon: HALOT
  rationale: 정치적 조공 맥락이지만 히브리어의 기본 동사 ‘주다’를 유지해 원문의 어휘 감각을 보존했습니다.
- source_word: אֶלֶף כִּכַּר כָּסֶף
  english_pob_choice: a thousand talents of silver
  chosen_korean: 은 천 달란트
  alternatives_korean:
  - 은 천 개의 달란트
  - 은 1,000달란트
  lexicon: HALOT
  rationale: 무게 단위 표현은 관용적으로 ‘은 천 달란트’로 옮겨 의미와 가독성을 함께 살렸습니다.
- source_word: לִהְיוֹת יָדוֹ אִתּוֹ / לְהַחֲזִיק הַמַּמְלָכָה בְּיָדוֹ
  english_pob_choice: so that his hand might be with him to strengthen the kingdom in his hand
  chosen_korean: 그의 손이 자기와 함께 있게 하고, 왕국을 그의 손에 굳게 하려 하였습니다
  alternatives_korean:
  - 자기를 도우며 왕국을 굳게 하려 하였습니다
  - 자기 편이 되어 왕권을 굳히려 하였습니다
  lexicon: HALOT
  rationale: 히브리어의 손-관용구를 그대로 반영하여 ‘손이 … 함께 있게’와 ‘그의 손에’를 살리고, 뒤의 ‘굳게 하다’로 통치 안정의 뜻을 드러냈습니다.
