base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/007.yaml
  text: And Azariah slept with his fathers[a], and they buried him with his fathers in the city of David. And Jotham his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'with his ancestors.' The Hebrew idiom 'slept with his fathers' is a conventional way of referring to death and burial among prior generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 아사랴가 그의 조상들과 함께 잠들었고, 그들은 그를 그의 조상들과 함께 다윗 성에 장사하였습니다. 그리고 그의 아들 요담이 그의 뒤를 이어 왕이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 ‘그의 조상들과 함께 잠들다’는 죽음과 장례를 가리키는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: slept
  chosen_korean: 잠들었고
  alternatives_korean:
  - 누웠고
  - 죽었고
  lexicon: HALOT
  rationale: 히브리어 관용구인 ‘조상들과 함께 잠들다’를 한국어에서도 살려서, 단순히 ‘죽었다’로 평평하게 만들지 않도록 했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 왕실 장례 공식을 자연스럽게 옮기면서도, 직역 느낌보다 한국어에서 의미가 분명한 ‘조상들’을 택했습니다.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: they buried him
  chosen_korean: 그들은 그를 ... 장사하였습니다
  alternatives_korean:
  - 그를 매장하였습니다
  - 그를 묻었습니다
  lexicon: HALOT
  rationale: 본문의 능동 복수형을 반영해 주어를 살렸고, 왕 장례 맥락에 맞는 ‘장사하다’를 사용했습니다.
- source_word: בְּעִיר דָּוִד
  english_pob_choice: in the city of David
  chosen_korean: 다윗 성에
  alternatives_korean:
  - 다윗의 성에
  - 예루살렘에
  lexicon: HALOT
  rationale: 고유한 지명 표현을 유지하여 왕실 매장 장소라는 역사적 표지를 보존했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그의 자리를 대신해 다스렸습니다
  - 그 뒤에 통치했습니다
  lexicon: HALOT
  rationale: ‘다스리다’보다 왕위 계승의 의미가 분명한 한국어 표현으로, ‘in his place’의 승계 관계를 자연스럽게 나타냈습니다.
theological_decisions:
- issue: וַיִּשְׁכַּב ... עִם אֲבֹתָיו의 관용구 처리
  chosen_reading: 죽음과 장례를 함께 가리키는 왕실 공식 표현으로 이해해 ‘잠들다’와 ‘장사하다’를 함께 유지했습니다.
  alternative_readings:
  - 직역하여 ‘누웠다’로 옮김
  - 의미만 드러내어 ‘죽었다’로 옮김
  rationale: 이 표현은 단순한 수면이 아니라 이전 세대와 함께하는 죽음과 매장을 암시하므로, 관용구의 완곡성과 서술 기능을 모두 보존해야 합니다.
  doctrine_reference: 열왕기상하의 왕조 연대기적 서술 관례
- issue: ‘그의 뒤를 이어 왕이 되었습니다’의 승계 표현
  chosen_reading: 왕위의 단순 시간적 연속보다, 정당한 계승이라는 의미가 드러나도록 번역했습니다.
  alternative_readings:
  - ‘그 후에 왕이 되었습니다’
  - ‘그 대신 왕이 되었습니다’
  rationale: תַּחְתָּיו는 단순한 ‘나중에’가 아니라 왕권의 자리 교체를 뜻하므로, 승계 관계를 분명히 해야 본문 의도가 살아납니다.
  doctrine_reference: 다윗 왕조의 계승 서술
