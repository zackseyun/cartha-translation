id: 2KI.15.37
reference: 2 Kings 15:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם הֵחֵ֣ל יְהוָ֗ה לְ/הַשְׁלִ֨יחַ֙ בִּֽ/יהוּדָ֔ה רְצִ֖ין מֶ֣לֶךְ אֲרָ֑ם וְ/אֵ֖ת פֶּ֥קַח בֶּן רְמַלְיָֽהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/037.yaml
  text: In those days Yahweh began to send against Judah Rezin king of Aram[b][a], and Pekah son of Remaliah.
  footnotes:
  - marker: a
    text: Or 'to send into Judah'; the Hebrew idiom here likely carries hostile force, hence 'against Judah.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Aram'; traditionally 'Syria.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 무렵에 야훼께서는 유다를 향해[a] 아람[b] 왕 르신과 르말랴의 아들 베가를 보내기 시작하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘유다 안/유다로’이지만, 문맥상 적대적 의미가 있어 ‘유다를 향해’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘아람’이며, 전통적으로는 ‘시리아’로 번역되기도 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그날들에
  - 그 시절에
  lexicon: HALOT
  rationale: 히브리어 관용구로서 특정 시기를 서술적으로 여는 표현이므로, 현대 한국어에서 자연스럽고 간결한 ‘그때에’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 신명기적 고유명사를 제목적 표현으로 바꾸지 않고, 프로젝트 기본어인 ‘야훼’를 유지했습니다.
- source_word: לְהַשְׁלִיחַ בִּיהוּדָה
  english_pob_choice: to send against Judah
  chosen_korean: 유다를 향해 … 보내기 시작하셨습니다
  alternatives_korean:
  - 유다에 보내기 시작하셨습니다
  - 유다를 치려고 보내기 시작하셨습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순한 파견이 아니라 적대적 개입을 암시하므로, ‘향해’로 방향성과 위협성을 함께 살렸습니다.
- source_word: רְצִין מֶלֶךְ אֲרָם
  english_pob_choice: Rezin king of Aram
  chosen_korean: 아람 왕 르신
  alternatives_korean:
  - 시리아 왕 르신
  - 르신, 아람의 왕
  lexicon: HALOT
  rationale: אנרם은 전통적 ‘시리아’보다 원어 지시를 보존하는 ‘아람’이 더 직접적이므로 이를 따랐고, 명칭 구조는 한국어 어순에 맞게 정리했습니다.
- source_word: פֶּקַח בֶּן רְמַלְיָהוּ
  english_pob_choice: Pekah son of Remaliah
  chosen_korean: 르말랴의 아들 베가
  alternatives_korean:
  - 베가, 르말랴의 아들
  - 베가, 르말랴의 아들 베가
  lexicon: HALOT
  rationale: 인명 관계를 한국어에서 가장 자연스러운 친족 표지로 옮겨, ‘르말랴의 아들’ 구조를 유지했습니다.
theological_decisions:
- issue: 야훼가 역사적 적대 세력을 ‘보내기 시작하셨다’는 표현의 주어 이해
  chosen_reading: 본문의 문법적 주어를 따라 야훼의 주권적 개입으로 번역했습니다.
  alternative_readings:
  - 단순히 두 왕이 일어난 시기로 완화하는 읽기
  - 허용적 의미만 남겨 야훼의 행위를 약화하는 읽기
  rationale: 히브리어 동사와 전치사 구조는 사건의 발단을 야훼의 주도적 행위로 제시하므로, 이를 약화하지 않고 그대로 반영해야 합니다.
  doctrine_reference: 섭리와 주권에 대한 성경적 서술 원리
- issue: לְהַשְׁלִיחַ의 적대성
  chosen_reading: ‘보내기 시작하셨습니다’에 ‘유다를 향해’라는 방향 표현을 더해 적대적 함의를 드러냈습니다.
  alternative_readings:
  - 중립적 ‘유다에 보내기 시작하셨습니다’
  - 해석적 ‘유다를 치려고 보내기 시작하셨습니다’
  rationale: 영문 POB가 지적하듯 이 표현은 단순 파견이 아니라 적대적 작용을 뜻하므로, 과도한 의역 없이도 문맥상의 긴장을 살리는 방향으로 처리했습니다.
  doctrine_reference: 문맥상 적대 행위 표현의 보존
