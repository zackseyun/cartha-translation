  text: In the second year of Pekah son of Remaliah[a], king of Israel, Jotham son of Uzziah, king of Judah[b], became king.
  footnotes:
  - marker: a
    text: Or, 'began to reign.' The Hebrew verb can denote accession to kingship or the start of a reign.
    reason: lexical_alternative
  - marker: b
    text: Uzziah is elsewhere also called Azariah.
    reason: cross_reference
translation:
