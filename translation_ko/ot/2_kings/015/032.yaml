  text: 이것은 이스라엘의 왕 베가[a]의 둘째 해에, 유다 왕 웃시야의 아들 요담이 왕이 되었습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘즉위하기 시작했습니다.’ 히브리어 동사는 왕위에 오름이나 통치의 시작을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 웃시야는 다른 곳에서는 아사랴라고도 불립니다.
    reason: cross_reference
