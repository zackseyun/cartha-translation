base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/005.yaml
  text: And Yahweh struck the king[a], and he was leprous until the day of his death, and he lived in a separate house. And Jotham the king’s son was over the household[b], judging the people of the land.
  footnotes:
  - marker: a
    text: Or, more broadly, “afflicted with a serious skin disease”; the Hebrew term does not necessarily refer to modern leprosy specifically.
    reason: lexical_alternative
  - marker: b
    text: Or “in a house of separation” / “in an isolated house”; the Hebrew phrase likely refers to a segregated residence.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 왕을 치셔서, 그는 죽는 날까지 나병 환자가 되었고[a], 분리된 집에 살았습니다[b]. 그리고 왕의 아들 요담은 왕실을 맡아 그 땅의 백성을 재판하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 넓게는 ‘심한 피부병을 앓고 있었다’로도 옮길 수 있습니다. 히브리어 용어는 현대적 의미의 나병을 반드시 가리키지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘분리된 집에’ 또는 ‘격리된 집에’로도 옮길 수 있습니다. 히브리어 표현은 격리된 거주지를 가리키는 것으로 보입니다.
    reason: lexical_alternative
