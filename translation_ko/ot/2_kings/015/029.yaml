  verdict: revise
  source_fidelity: 히브리어는 디글랏빌레셀이 열거된 성읍·지역을 취하고(군사적으로 점령하고), 이어 그들의 주민을 앗수르로 강제 이주시켰음을 말합니다. 초안의 ‘사로잡아 갔습니다’는 포로로 잡는 행위는 나타내지만 גלה(히필)의 유배·강제 이주 의미를 충분히 드러내지 못합니다.
  naturalness: ‘갈릴리 곧 납달리의 온 땅’은 쉼표만으로 연결되어 범위와 동격 관계가 다소 불분명합니다. 접속과 대시를 사용해 지명 열거와 요약 구문을 분명히 했습니다. 또한 통용 한국어 성경 지명 표기인 ‘베가’, ‘디글랏빌레셀’을 사용했습니다.
  terminology: ‘유배시켰습니다’는 גלה의 강제 이주 의미를 자연스럽고 정확하게 전달합니다. ‘길르앗’, ‘갈릴리’, ‘납달리’, ‘앗수르’는 통용 지명 표기를 유지했습니다.
