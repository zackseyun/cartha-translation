revisions:
- from: 이스라엘 왕 페카의 시대에 앗수르 왕 디글랏-빌레셀이 와서 이욘, 아벨벳마아가, 야노아, 게데스, 하솔, 길르앗, 갈릴리 곧 납달리의 온 땅을 점령하고 그들을 앗수르로 사로잡아 갔습니다.[a]
  to: 이스라엘 왕 베가의 시대에 앗수르 왕 디글랏빌레셀이 와서 이욘, 아벨벳마아가, 야노아, 게데스, 하솔, 길르앗과 갈릴리—곧 납달리의 온 땅을 점령하고, 그들을 앗수르로 유배시켰습니다.[a]
  rationale: 강제 이주를 뜻하는 גלה의 의미를 ‘유배시켰습니다’로 정확히 반영했습니다. 지명 열거와 ‘납달리의 온 땅’이라는 요약 동격을 문장부호로 명확히 했으며, 통용되는 한국어 성경의 인명 표기를 적용했습니다. ‘그들’은 히브리어 대명사의 표현을 보존하되, 유배라는 서술로 정복된 지역의 주민을 가리킴이 자연스럽게 드러납니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:55:09Z'
