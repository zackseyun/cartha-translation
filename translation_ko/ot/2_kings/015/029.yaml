  - ~의 통치 기간에
  lexicon: HALOT
  rationale: 히브리어 관용적 시간 서두를 자연스러운 현대 한국어 역사 서술로 옮기되, 사건의 역사적 배경을 유지했습니다.
- source_word: וַיִּקַּח
  english_pob_choice: captured
  chosen_korean: 점령하고
  alternatives_korean:
  - 사로잡고
  - 빼앗고
  lexicon: HALOT
  rationale: 지명 목록과 결합된 군사적 맥락이므로 단순한 '가져가다'보다 성읍 점령의 의미를 드러내는 표현을 택했습니다.
- source_word: הַגִּלְעָד / הַגָּלִילָה
  english_pob_choice: Gilead / Galilee
  chosen_korean: 길르앗, 갈릴리
  alternatives_korean:
  - 그 길르앗, 그 갈릴리
  - 길르앗 지역, 갈릴리 지역
  lexicon: HALOT
  rationale: 고유 지명으로서 한국어 성경에서 통용되는 음역을 유지하되, 목록의 병렬성을 살렸습니다.
- source_word: וַיַּגְלֵם אַשּׁוּרָה
  english_pob_choice: he carried them away to Assyria
  chosen_korean: 그들을 앗수르로 사로잡아 갔습니다
  alternatives_korean:
  - 그들을 앗수르로 끌고 갔습니다
  - 그들을 앗수르로 유배시켰습니다
  lexicon: HALOT
  rationale: גלה의 ‘포로로 옮기다/유배하다’ 의미를 살리면서도, POB의 서술 흐름에 맞춰 강제 이주시킴을 분명히 했습니다.
theological_decisions:
- issue: אַשּׁוּרָה의 방향성 표현
  chosen_reading: ‘앗수르로’로 옮겨 강제 이주의 도착지를 분명히 했습니다.
  alternative_readings:
  - ‘앗수르에’
  - ‘앗수르 안으로’
  rationale: 히브리어 방향 접미사는 이동의 목적지를 나타내므로, 한국어에서는 자연스럽고 직접적인 도착지 표현이 가장 잘 대응합니다.
  doctrine_reference: 본문의 역사 서술을 해치지 않는 범위에서 지리·서사 의미를 보존하는 번역 원칙
