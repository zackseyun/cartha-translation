  text: בִּ/שְׁנַת֙ חֲמִשִּׁ֣ים שָׁנָ֔ה לַ/עֲזַרְיָ֖ה מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ פְּקַֽחְיָ֨ה בֶן מְנַחֵ֧ם עַל יִשְׂרָאֵ֛ל בְּ/שֹׁמְר֖וֹן שְׁנָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/023.yaml
  text: In the fiftieth year of Azariah king of Judah, Pekahiah son of Menahem became king over Israel in Samaria, and he reigned two years.
translation:
  language: ko
  text: 유다 왕 아사랴의 오십년째 해에 므나헴의 아들 브가히야가 사마리아에서 이스라엘의 왕이 되었고, 두 해 동안 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּשְׁנַת ... חֲמִשִּׁים שָׁנָה
  english_pob_choice: In the fiftieth year
  chosen_korean: 오십년째 해에
  alternatives_korean:
  - 쉰 번째 해에
  - 오십 년에
  lexicon: HALOT
  rationale: 히브리어 연대기 공식은 사건의 연도를 지정하는 관용 표현이므로, 한국어에서도 서수적 의미가 드러나는 ‘오십년째 해에’로 자연스럽게 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었고
  alternatives_korean:
  - 왕이 되었습니다
  - 다스리기 시작했고
  - 즉위했고
  lexicon: HALOT
  rationale: מלך는 여기서 통치 기간 전체보다 즉위/등극의 사건을 가리키므로, ‘왕이 되었고’로 사건성을 살렸습니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘의 왕이
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘을 다스리는 왕이
  lexicon: HALOT
  rationale: עַל은 지배 대상을 나타내므로, 한국어에서는 소유격 구조로 풀어 ‘이스라엘의 왕’이라고 옮겨 통치 관계를 분명히 했습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아 안에서
  - 사마리아에
  lexicon: HALOT
  rationale: 왕위가 자리한 장소를 나타내는 전치사 ב를 장소 부사격 ‘-에서’로 옮겨, 사마리아가 통치의 중심지임을 자연스럽게 드러냈습니다.
