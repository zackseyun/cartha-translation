source:
  edition: WLC
  text: וַ/יֹּצֵא֩ מְנַחֵ֨ם אֶת הַ/כֶּ֜סֶף עַל יִשְׂרָאֵ֗ל עַ֚ל כָּל גִּבּוֹרֵ֣י הַ/חַ֔יִל לָ/תֵת֙ לְ/מֶ֣לֶךְ אַשּׁ֔וּר חֲמִשִּׁ֧ים שְׁקָלִ֛ים כֶּ֖סֶף לְ/אִ֣ישׁ אֶחָ֑ד וַ/יָּ֨שָׁב֙ מֶ֣לֶךְ אַשּׁ֔וּר וְ/לֹא עָ֥מַד שָׁ֖ם בָּ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/020.yaml
  text: Then Menahem exacted the money from Israel[a], from all the mighty men of valor, to give to the king of Assyria fifty shekels of silver from each man. So the king of Assyria turned back and did not remain there in the land.
  footnotes:
  - marker: a
    text: Or 'from all the wealthy men' or 'from all the mighty men of valor.' The Hebrew phrase can denote men of military strength, social standing, or wealth; the taxation context favors the sense of men of means.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 므나헴이 이스라엘로부터 돈을 징수하였는데, 곧 모든 힘센 자들에게서 앗시리아 왕에게 주려고 각 사람에게 은 오십 세겔씩 거두었습니다. 그러자 앗시리아 왕은 돌아가서 그 땅에 더 머물지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּצֵא / exacted
  english_pob_choice: exacted
  chosen_korean: 징수하였다
  alternatives_korean:
  - 거두었다
  - 부과하였다
  - 징수해 냈다
  lexicon: HALOT
  rationale: כסף을 백성에게서 강제로 걷는 행정·재정적 뉘앙스를 살리기 위해, 단순한 ‘모았다’보다 ‘징수하다’가 더 정확합니다.
- source_word: עַל כָּל גִּבּוֹרֵי הַחַיִל
  english_pob_choice: from all the mighty men of valor
  chosen_korean: 모든 힘센 자들에게서
  alternatives_korean:
  - 모든 용사들에게서
  - 모든 유력자들에게서
  - 모든 재력 있는 자들에게서
  lexicon: HALOT
  rationale: 이 표현은 문맥상 군사적 용맹만이 아니라 부담을 감당할 수 있는 사회적 유력층까지 포함할 수 있으므로, 한국어에서는 의미 범위를 열어 두는 ‘힘센 자들’이 가장 무난합니다.
- source_word: חֲמִשִּׁים שְׁקָלִים כֶּסֶף
  english_pob_choice: fifty shekels of silver
  chosen_korean: 은 오십 세겔
  alternatives_korean:
  - 오십 세겔의 은
  - 은화 오십 세겔
  lexicon: HALOT
  rationale: 히브리어의 무게-금속 표현을 한국어에서도 그대로 살려, 금액이 아니라 은의 단위임을 드러냈습니다.
- source_word: וְלֹא עָמַד שָׁם בָּאָרֶץ
  english_pob_choice: did not remain there in the land
  chosen_korean: 그 땅에 더 머물지 않았습니다
  alternatives_korean:
  - 그 땅에 머물지 않았습니다
  - 그곳에 서 있지 않았습니다
  lexicon: HALOT
  rationale: ‘서 있다’의 직역보다, 여기서는 점령군이 현지에 계속 주둔하지 않았다는 뜻을 살려 ‘더 머물지 않았다’로 옮기는 것이 자연스럽습니다.
