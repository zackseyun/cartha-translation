  naturalness: ‘이스라엘로부터 돈을 징수하였는데, 곧 … 각 사람에게 … 거두었습니다’는 수식 관계와 격조사가 혼란스럽습니다. ‘각 사람마다 …씩’ 및 ‘…에게서 징수하였습니다’로 정리하면 현대 표준어 합쇼체로 자연스럽고 명료합니다.
  terminology: ‘은 오십 세겔’은 무게와 금속을 충실히 반영합니다. גִּבּוֹרֵי הַחַיִל은 군사적 용사, 유력자, 재력가를 아우를 수 있으므로 ‘힘 있는 사람들’에 주석을 붙여 의미 범위를 보존했습니다. 앗시리아, 므나헴, 이스라엘의 표기는 적절합니다.
