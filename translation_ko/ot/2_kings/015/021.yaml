base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/021.yaml
  text: Now the rest of the acts of Menahem[a], and all that he did, are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'the book of the annals of the kings of Israel.'
    reason: lexical_alternative
translation:
  language: ko
  text: 메나헴의 남은 행적과 그가 한 모든 일은 이스라엘 왕들의 연대기 책[a]에 기록되어 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 왕들의 실록 책’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי מְנַחֵם
  english_pob_choice: Now the rest of the acts of Menahem
  chosen_korean: 이제 메나헴의 남은 행적
  alternatives_korean:
  - 메나헴의 나머지 행적
  - 메나헴의 남은 일들
  lexicon: HALOT
  rationale: 왕조 기록 공식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 왕의 행적·기록된 일들을 가리키므로, 이를 ‘행적’으로 자연스럽게 옮겼습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 그가 행한 모든 것
  - 그가 한 모든 행위
  lexicon: HALOT
  rationale: 서술 공식의 평행구를 살려 ‘all that he did’의 포괄성을 간결하게 반영했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 연대기 책
  alternatives_korean:
  - 역대기 책
  - 연대기 두루마리
  lexicon: HALOT
  rationale: 문맥상 공식 연대기/실록 문서이므로, 전통 교회 용어 ‘역대기’보다 기록 문서의 성격이 드러나는 ‘연대기 책’으로 옮겼습니다.
- source_word: לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: of the Kings of Israel
  chosen_korean: 이스라엘 왕들의
  alternatives_korean:
  - 이스라엘 왕들의
  - 이스라엘 왕들에게 속한
  lexicon: HALOT
  rationale: לְ는 이 문서 제목 안에서 소속·관계 표지를 이루므로, ‘왕들의’로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 수사 의문문 보존
  chosen_reading: “기록되어 있지 않습니까?”로 옮겨, 히브리어 הֲלוֹא가 기대하는 긍정 답변을 한국어 수사 의문으로 유지했습니다.
  alternative_readings:
  - “기록되어 있습니다”
  - “기록되어 있지 않습니까”
  rationale: 이 절은 왕조 기록을 가리키며 독자의 동의를 이끌어내는 요약 질문이므로, 평서문보다 수사 의문이 원문의 기능을 더 잘 드러냅니다.
  doctrine_reference: 서사·연대기 공식 문체
