translation:
  language: ko
  text: 그는 왕이 되었을 때 열여섯 살이었고, 예루살렘에서 쉰두 해 동안 다스렸습니다. 그의 어머니의 이름은 예루살렘 사람 여골리야였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שֵׁשׁ עֶשְׂרֵה שָׁנָה
