  lexicon: HALOT
  rationale: 왕의 재위 공식에서 ‘다스리다’는 의미를 살리면서도 한국어 독자에게 자연스럽게 읽히도록 했습니다.
- source_word: מִ/ירוּשָׁלִָֽם
