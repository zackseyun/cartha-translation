    issue: ‘역대지’는 오늘날 일반 독자에게 다소 낯선 표현입니다.
    rationale: ‘연대기 책’은 현대 표준어에서 이해하기 쉬우면서도 왕실 기록 문서라는 의미를 유지합니다.
