lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 … 나머지
  alternatives_korean:
  - 그리고 … 나머지
  - 그 나머지
  lexicon: HALOT
  rationale: 열왕기 왕정 결산 공식에서 ‘나머지’라는 잔여 보고를 살리되, 앞의 접속을 자연스럽게 풀어 ‘이제’로 옮겼습니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 행적
  alternatives_korean:
  - 일들
  - 행위
  - 사적
  lexicon: HALOT
  rationale: 이 구절의 דִּבְרֵי는 단순한 ‘말’이 아니라 왕의 치적·사건 전체를 가리키므로, 문어체 한국어에서 역사 기록에 맞는 ‘행적’이 가장 가깝습니다.
- source_word: הִנָּם
  english_pob_choice: behold, they are
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 그것이
  lexicon: HALOT
  rationale: 지시·강조 기능을 한국어 독자에게 자연스럽게 전달하기 위해 감탄사적 ‘보십시오’로 옮겼습니다.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대지
  alternatives_korean:
  - 이스라엘 왕들의 연대기
  - 이스라엘 왕들의 사건 기록
  lexicon: HALOT
  rationale: דִּבְרֵי הַיָּמִים는 정형화된 궁정 연대기 명칭이므로, 전통적이면서도 현대적인 ‘역대지’로 처리해 문서 제목의 성격을 유지했습니다.
