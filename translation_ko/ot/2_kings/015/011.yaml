    rationale: 이 구절에는 ‘이제’에 해당하는 명시적 시간 부사가 없습니다. 영어 감사본도 같은 이유로 선행 ‘Now’를 삭제했습니다.
  - severity: medium
    issue: ‘보십시오[a], 그것이’의 문법적·문체적 연결이 어색하고, 각주 표지가 대안어가 아닌 ‘보십시오’에 붙어 있습니다.
    rationale: 각주는 ‘역대지/연대기’라는 문서 명칭의 어휘 대안을 설명하므로 해당 표현에 표지를 붙여야 합니다. 대명사를 생략하면 히브리어의 강조도 보존하면서 자연스러워집니다.
