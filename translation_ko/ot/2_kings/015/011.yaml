lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 … 나머지
  alternatives_korean:
  - 그리고 … 나머지
  - 그 나머지
  lexicon: HALOT
  rationale: 열왕기 왕정 결산 공식에서 ‘나머지’라는 잔여 보고를 살리되, 앞의 접속을 자연스럽게 풀어 ‘이제’로 옮겼습니다.
- source_word: דִּבְרֵי
