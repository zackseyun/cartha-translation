base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/006.yaml
  text: Now the rest of the acts of Azariah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'recorded' instead of 'written' for הֵם כְּתוּבִים; the main text keeps the more literal wording.
    reason: lexical_alternative
  - marker: b
    text: '''The Book of the Chronicles of the Kings of Judah'' refers to a royal record or annal source cited throughout Kings.'
    reason: cultural_note
translation:
  language: ko
  text: 아사랴의 남은 행적과 그가 한 모든 일은 유다 왕들의 역대기[b]에 기록되어[a] 있지 않습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כְּתוּבִים는 문자적으로는 ‘쓰여 있다’는 뜻이지만, 왕실 기록 문맥에서는 ‘기록되어 있다’가 더 자연스러운 한국어입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유다 왕들의 역대기’는 열왕기 전체에서 반복되는 왕실 연대기 자료를 가리키는 제목형 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  english_pob_choice: the rest of the acts
  chosen_korean: 남은 행적
  alternatives_korean:
  - 나머지 행적
  - 남은 일들
  - 그 밖의 행적
  lexicon: HALOT
  rationale: 왕들의 결산 공식에서 'rest of the acts'는 이어지지 않은 왕의 공적·행적 전체를 가리키므로, 자연스러운 역사 서술인 '남은 행적'으로 옮겼습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 한 모든 일
  alternatives_korean:
  - 그가 행한 모든 일
  - 그가 이룬 모든 일
  lexicon: HALOT
  rationale: 히브리어의 포괄적 행위 표현을 그대로 살려, 사건·업적을 모두 아우르는 문맥상 넓은 표현으로 옮겼습니다.
- source_word: הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 기록되어 있지 않습니까
  - 쓰여 있지 않습니까
  lexicon: HALOT
  rationale: 문자적 '쓰이다'보다 역사 기록문맥에 맞는 '기록되다'가 자연스럽지만, 반문 구조는 유지했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 역대기
  alternatives_korean:
  - 유다 왕들의 연대기
  - 유다 왕들의 역대 기록
  lexicon: HALOT
  rationale: 이 표현은 실제 인용되는 왕실 연대기/공문서 제목이므로, 전통적 용례를 살리되 한국어로는 '역대기'가 가장 직접적인 제목형 표현입니다.
