  - severity: low
    issue: ‘갈라버렸습니다’의 추가된 완료·강조
    rationale: בקע는 폭력적으로 가르다/찢어 열다는 뜻이지만, 한국어 보조동사 ‘버리다’가 원문에 없는 완료·단절의 뉘앙스를 더합니다. 잔혹성은 ‘배를 갈랐습니다’만으로도 충분히 보존됩니다.
