- from: 그때 므나헴이 디르사에서부터 팁사와 그 안에 있는 모든 것과 그 영토를 쳤습니다. 그것이 그에게 열지 않았기 때문입니다. 그리고 그는 그 도시의 임신한 여자들을 배를 갈라버렸습니다.[a][b][c]
  to: 그때 므나헴은 디르사에서부터 팁사와 그 안에 있는 모든 것과 그 영토를 쳤습니다. 그 도시가 그에게 열어 주지 않았기 때문입니다. 그는 그 도시의 임신한 여인들의 배를 갈랐습니다.[a][b][c]
  rationale: 도시를 주어로 한 ‘열다’의 관용적 의미를 자연스러운 한국어로 바로잡고, 원문에 없는 완료·강조를 제거했습니다. 공격 대상과 ‘디르사에서부터’라는 원문의 다소 압축된 공간 표현은 유지했으며, 잔혹한 행위를 완곡하게 바꾸지 않았습니다.
