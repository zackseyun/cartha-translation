theological_decisions:
- issue: 폭력 서술의 직설성
  chosen_reading: 완곡하게 돌리지 않고 ‘배를 갈라버렸습니다’라고 직설적으로 옮겼습니다.
  alternative_readings:
  - 가르셨습니다
  - 찢어 열었습니다
  rationale: 본문의 בקע가 가리키는 강한 폭력성을 흐리지 않기 위해, 현대 한국어에서도 충격과 잔혹함이 드러나는 표현을 유지했습니다.
  doctrine_reference: 본문의 역사 서술 및 심판/폭력 묘사에 대한 서술 충실성
