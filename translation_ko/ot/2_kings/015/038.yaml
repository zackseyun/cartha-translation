source:
  edition: WLC
  text: וַ/יִּשְׁכַּ֤ב יוֹתָם֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵר֙ עִם אֲבֹתָ֔י/ו בְּ/עִ֖יר דָּוִ֣ד אָבִ֑י/ו וַ/יִּמְלֹ֛ךְ אָחָ֥ז בְּנ֖/וֹ תַּחְתָּֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/038.yaml
  text: And Jotham lay down with his fathers and was buried with his fathers in the city of David his father[b][a], and Ahaz his son reigned in his place.
  footnotes:
  - marker: a
    text: Or 'with his ancestors.' The Hebrew literally says 'with his fathers' in a standard royal death formula.
    reason: lexical_alternative
  - marker: b
    text: '''David his father'' uses ''father'' in the sense of forefather or dynastic ancestor, not immediate biological father.'
    reason: cultural_note
translation:
  language: ko
  text: 요담은 그의 조상들과 함께 누웠으며[a], 그의 아버지 다윗의 성읍에서 그의 조상들과 함께 장사되었습니다[b]. 그의 아들 아하스가 그를 대신하여 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 조상들과 함께’는 히브리어의 문자적 표현 ‘그의 아버지들과 함께’를 왕실의 통상적인 사망 공식에 맞게 옮긴 것입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 아버지 다윗’에서 ‘아버지’는 요담의 직계 부친이 아니라 다윗 왕조의 조상 또는 선조를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누워
  alternatives_korean:
  - 잠들어
  - 쉬고
  lexicon: HALOT
  rationale: 히브리어의 관용적 죽음 표현을 살리기 위해 직역적으로 ‘누워’로 옮기되, 뒤의 ‘장사되었고’로 의미를 분명히 했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 왕실의 상투적 사망 공식에서 ‘아버지들’은 생물학적 아버지보다 조상/선조를 가리키므로, 한국어에서는 자연스럽고 오해가 적은 ‘조상들’로 풀었습니다.
- source_word: בְּעִיר דָּוִד אָבִיו
  english_pob_choice: in the city of David his father
  chosen_korean: 그의 아버지 다윗의 성읍에
  alternatives_korean:
  - 다윗 성읍에
  - 그의 조상 다윗의 성읍에
  lexicon: HALOT
  rationale: ‘다윗 그의 아버지’는 직계 부친이 아니라 다윗 계열의 조상을 뜻하므로, 소유·동격 관계를 살려 ‘그의 아버지 다윗의 성읍’으로 옮겼습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그를 대신하여 왕이 되었습니다
  alternatives_korean:
  - 그 자리에 왕이 되었습니다
  - 그 뒤를 이어 다스렸습니다
  lexicon: HALOT
  rationale: ותַּחְתָּיו의 대체/승계 의미를 한국어의 자연스러운 왕위 계승 표현으로 풀어, ‘왕이 되었습니다’에 ‘그를 대신하여’를 붙였습니다.
theological_decisions:
- issue: ‘그의 아버지 다윗’의 친족 의미
  chosen_reading: 다윗은 요담의 직계 부친이 아니라 다윗 왕조의 조상이라는 뜻으로 이해했습니다.
  alternative_readings:
  - 다윗을 실제 생물학적 아버지로 읽는 것
  rationale: 열왕기하의 왕위 계승 공식과 역사 맥락상 요담의 아버지는 웃시야이므로, 본문은 계보적·왕조적 의미의 ‘아버지’를 사용한 것입니다.
  doctrine_reference: 2 Kings 15:7, 2 Samuel 7:12-16
