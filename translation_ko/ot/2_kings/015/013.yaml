  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 어색하지만, 본문의 ‘약 한 달’이라는 뜻을 유지하면서도 현대 한국어에서 읽히는 표현으로 옮겼습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아에
  - 사마리아 안에서
  lexicon: HALOT
  rationale: 위치 부사구는 한국어에서 ‘-에서’가 가장 자연스럽고, 짧은 통치의 장소를 직접 나타냅니다.
