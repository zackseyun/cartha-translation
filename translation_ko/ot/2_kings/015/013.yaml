base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/013.yaml
  text: Shallum son of Jabesh became king in the thirty-ninth year of Uzziah king of Judah[a], and he reigned for a month of days in Samaria.
  footnotes:
  - marker: a
    text: 'Hebrew: ''a month of days,'' that is, about one month.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야베스의 아들 샬룸이 유다 왕 웃시야의 서른아홉째 해에 왕이 되었고, 사마리아에서 한 달 동안[a] 다스렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 달의 날들’이며, 곧 약 한 달을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 통치보다 즉위·등극의 의미를 가지므로, 한국어에서는 왕위에 오른 사실을 분명히 드러내는 표현이 가장 자연스럽습니다.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  english_pob_choice: in the thirty-ninth year
  chosen_korean: 서른아홉째 해에
  alternatives_korean:
  - 삼십구년에
  - 제39년에
  lexicon: HALOT
  rationale: 왕정 연대 공식은 한국어에서도 서수형으로 옮기는 것이 가장 자연스러워, ‘서른아홉째 해’로 번역했습니다.
- source_word: יֶרַח יָמִים
  english_pob_choice: for a month of days
  chosen_korean: 한 달의 기간 동안
  alternatives_korean:
  - 한 달 동안
  - 한 달의 날들 동안
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하면 어색하지만, 본문의 ‘약 한 달’이라는 뜻을 유지하면서도 현대 한국어에서 읽히는 표현으로 옮겼습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아에
  - 사마리아 안에서
  lexicon: HALOT
  rationale: 위치 부사구는 한국어에서 ‘-에서’가 가장 자연스럽고, 짧은 통치의 장소를 직접 나타냅니다.
