  source_fidelity: 핵심 내용은 히브리어 본문에 충실합니다. מָלַךְ는 ‘왕이 되었습니다’로, 두 번째 וַיִּמְלֹךְ는 ‘다스렸습니다’로 자연스럽게 구별했으며, 왕위 계승 연대와 사마리아라는 장소도 정확히 반영했습니다. 다만 יֶרַח יָמִים의 직역적 특성은 각주로 처리하는 편이 적절하므로 본문에서는 불필요하게 중첩된 ‘한 달의 기간 동안’보다 ‘한 달 동안’이 낫습니다.
  naturalness: ‘한 달의 기간 동안’은 ‘달’과 ‘기간’이 의미상 중복되어 다소 무겁습니다. 현대 표준 한국어 합쇼체에서는 ‘한 달 동안’이 간결하고 자연스럽습니다. 각주 표지는 해당 표현 바로 뒤에 두어 무엇을 설명하는지 명확하게 해야 합니다.
