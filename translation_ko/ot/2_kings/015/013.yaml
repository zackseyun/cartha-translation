translation:
  language: ko
  text: 야베스의 아들 샬룸이 유다 왕 웃시야의 서른아홉째 해에 왕이 되었고, 사마리아에서 한 달의 기간 동안 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘한 달의 날들’이며, 곧 약 한 달을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 즉위했습니다
  - 다스리기 시작했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순 통치보다 즉위·등극의 의미를 가지므로, 한국어에서는 왕위에 오른 사실을 분명히 드러내는 표현이 가장 자연스럽습니다.
- source_word: בִּשְׁנַת שְׁלֹשִׁים וָתֵשַׁע שָׁנָה
  english_pob_choice: in the thirty-ninth year
  chosen_korean: 서른아홉째 해에
  alternatives_korean:
