  lexicon: HALOT
  rationale: 왕정 연대 공식은 한국어에서도 서수형으로 옮기는 것이 가장 자연스러워, ‘서른아홉째 해’로 번역했습니다.
- source_word: יֶרַח יָמִים
  english_pob_choice: for a month of days
  chosen_korean: 한 달의 기간 동안
  alternatives_korean:
