revisions:
- from: 그는 야훼 보시기에 악한 일을 행했습니다. 그는 네밧의 아들 여로보암의 죄에서 떠나지 않았는데[a], 그 죄로 이스라엘을 죄짓게 했습니다. 그는 평생 그렇게 했습니다.
  to: 그는 야훼 보시기에 악한 일을 행했습니다. 그는 네밧의 아들 여로보암의 죄들[a]에서 평생 떠나지 않았습니다. 그는 그 죄들로 이스라엘을 죄짓게 했습니다.
  rationale: 복수형 ‘죄들’을 보존하고, ‘평생’을 ‘떠나지 않았다’에 직접 연결했습니다. 본문은 영어 POB의 선택처럼 관계절을 죄들에 연결하되, 히브리어 관계절이 바로 앞의 여로보암을 선행사로 삼을 수 있는 문법적 가능성은 각주에 남겼습니다.
