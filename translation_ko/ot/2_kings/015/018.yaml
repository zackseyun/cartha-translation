  terminology: ‘야훼’, ‘네밧’, ‘여로보암’, ‘이스라엘’ 및 ‘죄짓게 하다’는 적절합니다. ‘죄’는 원문의 복수에 맞추어 ‘죄들’로 수정했습니다.
