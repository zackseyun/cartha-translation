  source_fidelity: 히브리어의 평가 공식, 야훼 이름, 사역형 ‘이스라엘을 죄짓게 하다’, 그리고 지속 기간을 전반적으로 잘 반영했습니다. 다만 חַטֹּאות는 복수이므로 ‘죄들’로 옮기는 것이 더 충실하며, כָּל־יָמָיו는 ‘그렇게 했습니다’가 아니라 그가 죄들에서 떠나지 않은 기간을 직접 수식하도록 처리하는 편이 원문에 더 가깝습니다.
