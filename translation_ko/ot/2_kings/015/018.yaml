id: 2KI.15.18
reference: 2 Kings 15:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה לֹ֣א סָ֠ר מֵ/עַ֨ל חַטֹּ֜אות יָרָבְעָ֧ם בֶּן נְבָ֛ט אֲשֶׁר הֶחֱטִ֥יא אֶת יִשְׂרָאֵ֖ל כָּל יָמָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/018.yaml
  text: He did what was evil in the eyes of Yahweh. He did not turn away from the sins of Jeroboam son of Nebat[a], with which he caused Israel to sin, all his days.
  footnotes:
  - marker: a
    text: Or, 'Jeroboam son of Nebat, who caused Israel to sin.' The Hebrew relative clause can be taken with 'Jeroboam' rather than with 'the sins.'
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 행했습니다. 그는 네밧의 아들 여로보암의 죄들[a]에서 평생 떠나지 않았습니다. 그는 그 죄들로 이스라엘을 죄짓게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네밧의 아들 여로보암은 이스라엘을 죄짓게 한 사람’으로, 히브리어 관계절을 ‘죄들’이 아니라 ‘여로보암’에 연결하여 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 행했습니다
  alternatives_korean:
  - 악을 행했습니다
  - 악한 일을 했습니다
  lexicon: HALOT
  rationale: עשה + הרע는 열왕기에서 관용적으로 도덕적 평가를 나타내므로, ‘악한 일을 행하다’로 자연스럽고 직접적으로 옮겼습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼 앞에
  - 야훼의 눈에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어에서도 평가의 비유로 살리기 위해 ‘보시기에’를 택했습니다.
- source_word: לֹא סָר מֵעַל חַטֹּאות
  english_pob_choice: He did not turn away from the sins
  chosen_korean: 죄에서 떠나지 않았는데
  alternatives_korean:
  - 죄를 버리지 않았는데
  - 죄에서 돌아서지 않았는데
  lexicon: HALOT
  rationale: סור의 부정형은 죄의 길을 버리지 않았다는 뜻이므로, ‘떠나지 않았다’로 회피의 이미지를 유지했습니다.
- source_word: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: with which he caused Israel to sin
  chosen_korean: 그 죄로 이스라엘을 죄짓게 했습니다
  alternatives_korean:
  - 그것으로 이스라엘을 죄에 빠뜨렸습니다
  - 그 죄들로 이스라엘을 죄짓게 했습니다
  lexicon: HALOT
  rationale: 히브리어 הֶחֱטִיא는 사역형으로 ‘죄짓게 하다’가 핵심이므로, 한국어에서도 사역 의미를 분명히 드러냈습니다. 문맥상 앞의 ‘죄’가 원인/매개로 읽히는 연결을 살렸습니다.
- source_word: כָּל יָמָיו
  english_pob_choice: all his days
  chosen_korean: 평생
  alternatives_korean:
  - 그의 모든 날 동안
  - 그가 사는 동안
  lexicon: HALOT
  rationale: 관용적 시간표현을 현대 한국어에서 가장 자연스럽게 압축해 전달했습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 옮기고, 제목어 ‘주’로 대체하지 않았습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문에 신명기적 고유명사가 직접 나타나므로, 번역 본문에서도 신적 호칭이 아니라 이름 자체를 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — YHWH → Yahweh'
- issue: אֲשֶׁר הֶחֱטִיא אֶת יִשְׂרָאֵל의 관계절 처리
  chosen_reading: ‘그 죄로 이스라엘을 죄짓게 했습니다’로 앞의 ‘죄’를 매개로 읽었습니다.
  alternative_readings:
  - ‘네밧의 아들 여로보암, 이스라엘을 죄짓게 한 자’처럼 여로보암에 직접 연결
  - ‘그 죄들로 이스라엘을 죄짓게 했습니다’처럼 단순히 죄들에 연결
  rationale: 히브리어는 관계절이 여로보암 또는 그 죄들에 연결될 수 있어 긴장을 남깁니다. 한국어 본문은 사역 의미를 분명히 하되, 주석적 가능성은 각주로 열어 두었습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: preserve theological tension rather than resolve it'
