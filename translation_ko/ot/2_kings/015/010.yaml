base_translation:
  language: en
  yaml_path: translation/ot/2_kings/015/010.yaml
  text: Then Shallum son of Jabesh conspired against him and struck him down before the people[a], and put him to death and reigned in his place.
  footnotes:
  - marker: a
    text: Or 'in public' / 'before the assembly' for the difficult phrase קָבָל־עָם.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 야베스의 아들 살룸이 그에게 반역을 꾀하여, 백성 앞에서 그를 쳤으며[a], 그를 죽이고 그의 자리에 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공개적으로’, ‘회중 앞에서’. 난해한 구문 קָבָל־עָם의 가능한 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשֹׁר עָלָיו
  english_pob_choice: conspired against him
  chosen_korean: 그에게 대항하여 모의하고
  alternatives_korean:
  - 그를 상대로 모의하고
  - 그에게 반역하고
  lexicon: HALOT
  rationale: 정치적 전복 맥락에서 קשר는 단순한 계획보다 반역성 있는 모의를 뜻하므로, 현대 한국어에서 자연스러운 ‘대항하여 모의하다’로 옮겼습니다.
- source_word: וַיַּכֵּהוּ
  english_pob_choice: struck him down
  chosen_korean: 그를 쳤으며
  alternatives_korean:
  - 그를 공격했으며
  - 그를 쓰러뜨렸으며
  lexicon: HALOT
  rationale: 이 동사는 폭력적 타격을 가리키며, 뒤의 ‘그를 죽이고’와 분리해 두 단계의 행위를 살리기 위해 과도하게 ‘살해하다’로 합치지 않았습니다.
- source_word: קָבָל־עָם
  english_pob_choice: before the people
  chosen_korean: 백성 앞에서
  alternatives_korean:
  - 공개적으로
  - 회중 앞에서
  lexicon: HALOT
  rationale: 난해한 표현이지만 문맥상 공개된 자리라는 뜻이 가장 자연스러우므로, 원문에 비교적 가까운 ‘백성 앞에서’를 채택했습니다.
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  english_pob_choice: reigned in his place
  chosen_korean: 그의 자리에 왕이 되었습니다
  alternatives_korean:
  - 그의 자리에 통치했습니다
  - 그를 대신하여 다스렸습니다
  lexicon: HALOT
  rationale: מלך + תחתיו는 왕위 계승을 가리키므로, ‘왕이 되었습니다’로 왕권 승계를 분명히 하되 한국어 문장으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 폭력과 공개 처형의 묘사 강도
  chosen_reading: ‘백성 앞에서’와 ‘그를 쳤으며’의 직역적 표현을 유지해, 정치적 암살의 공적 성격을 약화시키지 않았습니다.
  alternative_readings:
  - ‘공개적으로 그를 죽였으며’로 완화
  - ‘회중 앞에서’로 종교적 뉘앙스 부여
  rationale: 본문은 왕위 찬탈의 폭력성과 공개성을 함께 드러내므로, 독자가 사건의 정치적 긴장을 그대로 이해하도록 했습니다.
  doctrine_reference: 서사 본문 해석 원칙
