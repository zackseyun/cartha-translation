  source_fidelity: 핵심 의미는 대체로 충실하나, 현 번역의 ‘그들이 ... 분향하게 하였으며’는 관계절의 선행사인 제사장들이 다른 이들에게 분향시킨 것처럼 읽힐 수 있습니다. 히브리어는 유다 왕들이 그 제사장들을 산당에서 분향하도록 세웠다는 뜻으로 옮기는 것이 안전합니다. 또한 בָּמוֹת와 עָרֵי는 모두 복수이므로 각각 ‘산당들’, ‘성읍들’로 반영했습니다.
  naturalness: ‘제사장들을 폐하고’는 사람을 목적어로 할 때 현대 한국어에서 다소 부자연스럽습니다. ‘없애고’가 문맥상 요시야의 숙청 행위를 자연스럽게 전달합니다. ‘하늘의 모든 군상’은 현대어에서 천체 집단을 명료하게 가리키지 않으므로 ‘하늘의 모든 천체’로 다듬었습니다.
  terminology: כְּמָרִים는 본문에서는 해석을 추가하지 않고 ‘제사장들’로 유지하되, 대안적 이해는 해당 낱말에 직접 연결한 각주로 제시했습니다. מַזָּלוֹת는 논쟁의 여지를 보존하여 ‘별자리들’로 번역했고, 대안으로 ‘황도대의 별자리들’을 제시했습니다. צְבָא הַשָּׁמַיִם는 이 문맥에서 숭배 대상인 천체를 뜻하므로 ‘하늘의 모든 천체’로 옮겼습니다.
