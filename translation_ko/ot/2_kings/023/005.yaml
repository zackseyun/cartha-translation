source:
  edition: WLC
  text: וְ/הִשְׁבִּ֣ית אֶת הַ/כְּמָרִ֗ים אֲשֶׁ֤ר נָֽתְנוּ֙ מַלְכֵ֣י יְהוּדָ֔ה וַ/יְקַטֵּ֤ר בַּ/בָּמוֹת֙ בְּ/עָרֵ֣י יְהוּדָ֔ה וּ/מְסִבֵּ֖י יְרוּשָׁלִָ֑ם וְ/אֶת הַֽ/מְקַטְּרִ֣ים לַ/בַּ֗עַל לַ/שֶּׁ֤מֶשׁ וְ/לַ/יָּרֵ֨חַ֙ וְ/לַ/מַּזָּל֔וֹת וּ/לְ/כֹ֖ל צְבָ֥א הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/005.yaml
  text: And he put an end to the priests whom the kings of Judah had appointed to burn incense at the high places in the cities of Judah and around Jerusalem[a], and also those who burned incense to Baal, to the sun, to the moon, to the constellations[c][b], and to all the host of the heavens.
  footnotes:
  - marker: a
    text: Or 'the pagan priests.' The Hebrew term refers to priests associated with illegitimate or idolatrous worship, not the lawful priests of the LORD.
    reason: lexical_alternative
  - marker: b
    text: Or 'the zodiac signs.' The Hebrew term likely refers to constellations or astral groupings.
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the host of the heavens'; also commonly rendered 'the host of heaven' or 'the heavenly host.' Here it refers to celestial bodies worshiped in astral religion.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그는 유다 왕들이 유다의 성읍들과 예루살렘 주변의 산당들에서 분향하도록 세운 제사장들[a]을 없애고, 바알과 해와 달과 별자리들[b]과 하늘의 모든 천체[c]에게 분향하던 자들도 없앴습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이교 제사장들’. 이 히브리어 낱말은 정규 야훼 제사장과 구별되는, 부정하거나 우상숭배적인 제의와 관련된 제사장을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘황도대의 별자리들’. 히브리어는 별자리 또는 점성술적 천체 구분을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘하늘의 군대’ 또는 ‘하늘의 무리’입니다. 여기서는 숭배의 대상이 된 천체들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּית
  english_pob_choice: he put an end to
  chosen_korean: 폐하고
  alternatives_korean:
  - 그치게 하고
  - 없애고
  - 중단시키고
  lexicon: HALOT
  rationale: 히필형의 사역적 의미를 살리면서도 한국어에서 자연스럽고 간결하게 ‘그치게 하다/폐하다’의 뜻을 전달합니다.
- source_word: הַכְּמָרִים
  english_pob_choice: the priests
  chosen_korean: 제사장들
  alternatives_korean:
  - 제사장들
  - 우상 제사장들
  - 이방 제사장들
  lexicon: HALOT
  rationale: 문맥상 야훼의 합법적 제사장이 아니라 잘못된 제의에 속한 인물들이지만, 본문 자체는 단순히 ‘제사장들’이라 하므로 해석을 과도하게 밀지 않고 번역했습니다.
- source_word: וַיְקַטֵּר בַּבָּמוֹת
  english_pob_choice: to burn incense at the high places
  chosen_korean: 산당에서 분향하게 하였으며
  alternatives_korean:
  - 산당에서 향을 피우게 하였으며
  - 산당에서 제사를 드리게 하였으며
  lexicon: HALOT
  rationale: קטר의 핵심 행위는 분향이며, בָּמוֹת는 관용적으로 ‘산당’이 가장 잘 대응합니다.
- source_word: וְלְכֹל צְבָא הַשָּׁמָיִם
  english_pob_choice: and to all the host of the heavens
  chosen_korean: 하늘의 모든 군상
  alternatives_korean:
  - 하늘의 모든 군대
  - 하늘의 모든 군상들
  - 천상의 모든 군대
  lexicon: HALOT
  rationale: ‘host’의 군집적 이미지를 살리되, 한국어에서 우상숭배의 대상이 되는 천체 집단을 과장 없이 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: הַכְּמָרִים를 명목상 중립적인 ‘제사장’으로 둘지, 문맥상 잘못된 제의 직분을 드러낼지
  chosen_reading: 본문 자체의 형식을 따라 ‘제사장들’로 옮기되, 주변 문맥과 분향 대상들이 우상숭배임을 통해 그 성격이 드러나게 했습니다.
  alternative_readings:
  - 우상 제사장들
  - 이방 제사장들
  rationale: 열왕기하 23장의 요시야 개혁 맥락이 이미 이들을 불법적 제의 인물로 규정하므로, 번역문에서 추가 해석어를 넣지 않아도 의미가 충분히 분명합니다.
  doctrine_reference: 열왕기하 23장 요시야의 종교개혁 문맥
- issue: תְּמוּנָה 목록의 천체 숭배 대상을 한국어로 어떻게 배열할지
  chosen_reading: ‘바알과 해와 달과 별자리들, 그리고 하늘의 모든 군상’으로 반복 구조를 살려 천체 숭배의 열거를 그대로 드러냈습니다.
  alternative_readings:
  - 바알, 해, 달, 별자리들, 하늘의 모든 군상
  - 바알과 해와 달과 별자리들과 하늘의 모든 군상
  rationale: 히브리어는 각 항목에 전치사가 반복되는 열거체이므로, 한국어도 병렬감을 유지해 우상 목록의 누적 효과를 보존했습니다.
  doctrine_reference: 우상숭배 금지 및 천체 숭배 비판의 본문 맥락
