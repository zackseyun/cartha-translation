source:
  edition: WLC
  text: וַ/יִּ֣פֶן יֹאשִׁיָּ֗הוּ וַ/יַּ֨רְא אֶת הַ/קְּבָרִ֤ים אֲשֶׁר שָׁם֙ בָּ/הָ֔ר וַ/יִּשְׁלַ֗ח וַ/יִּקַּ֤ח אֶת הָֽ/עֲצָמוֹת֙ מִן הַ/קְּבָרִ֔ים וַ/יִּשְׂרֹ֥ף עַל הַ/מִּזְבֵּ֖חַ וַֽ/יְטַמְּאֵ֑/הוּ כִּ/דְבַ֣ר יְהוָ֗ה אֲשֶׁ֤ר קָרָא֙ אִ֣ישׁ הָ/אֱלֹהִ֔ים אֲשֶׁ֣ר קָרָ֔א אֶת הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/016.yaml
  text: Then Josiah turned and saw the tombs that were there on the mountain[a], and he sent and took the bones from the tombs and burned them on the altar and defiled it, according to the word of Yahweh that the man of God proclaimed[b], who proclaimed these things.
  footnotes:
  - marker: a
    text: Or 'the graves.' The Hebrew term can refer to burial places generally, not only constructed tombs.
    reason: lexical_alternative
  - marker: b
    text: Or 'cried out' / 'called out.' The Hebrew verb can emphasize a loud public proclamation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 요시야가 돌아서서 산에 있는 무덤들을 보았습니다[a]. 그는 사람을 보내어 무덤들에서 뼈를 가져다가 제단 위에 불사르고 그 제단을 더럽혔습니다. 이는 이 일들을 선포한 하나님의 사람이 선포한[b] 야훼의 말씀대로였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘묘들’. 히브리어는 일반적인 매장 장소를 가리킬 수 있어 반드시 건축된 무덤만을 뜻하지는 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘외친’ 또는 ‘불러 외친’. 히브리어 동사는 큰소리로 공적으로 선포하는 뜻을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  english_pob_choice: turned
  chosen_korean: 돌아서서
  alternatives_korean:
  - 돌아보며
  - 몸을 돌려
  lexicon: HALOT
  rationale: פּנה는 물리적으로 몸을 돌리는 동작을 뜻하므로, 앞의 대상을 향해 시선을 옮기는 장면을 자연스럽게 드러내는 ‘돌아서서’가 적절합니다.
- source_word: הַקְּבָרִים
  english_pob_choice: the tombs
  chosen_korean: 무덤들
  alternatives_korean:
  - 묘들
  - 무덤
  lexicon: HALOT
  rationale: קבר는 ‘무덤’이나 ‘묘’가 가능하지만, 산에 있는 매장 장소들을 가리키는 이 문맥에서는 자연스러운 표준어 ‘무덤들’이 알맞습니다.
- source_word: וַיִּשְׂרֹף עַל הַמִּזְבֵּחַ
  english_pob_choice: burned them on the altar
  chosen_korean: 제단 위에서 불사르고
  alternatives_korean:
  - 제단에서 불사르고
  - 제단 위에 불사르고
  lexicon: HALOT
  rationale: עצמות를 제단에 올려 태워 제의적 더러움을 일으키는 장면이므로, ‘제단 위에서 불사르고’가 행위와 장소를 가장 직접적으로 살립니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 사람
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 예언자적 호칭을 살렸습니다. 교회적 관용 표현으로 바꾸기보다 본문의 호칭을 유지하는 것이 적절합니다.
- source_word: קָרָא
  english_pob_choice: proclaimed
  chosen_korean: 선포했습니다
  alternatives_korean:
  - 불렀습니다
  - 외쳤습니다
  - 공포했습니다
  lexicon: HALOT
  rationale: 이 동사는 단순한 ‘부르다’보다 공적이고 권위 있는 발표를 포함할 수 있으므로, 예언적 맥락에 맞는 ‘선포하다’를 택했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본값에 따라 신명은 ‘야훼’로 옮겨, 제목어 ‘주님’으로 대체하지 않았습니다.
theological_decisions:
- issue: 예언 성취 구조의 보존
  chosen_reading: ‘야훼의 말씀대로였는데’와 뒤이은 ‘하나님의 사람이 그것을 선포했으며’로, 요시야의 행동이 앞선 하나님의 말씀 성취라는 점을 분명히 했습니다.
  alternative_readings:
  - ‘야훼의 말씀처럼’
  - ‘하나님의 사람이 외친 말씀대로’
  rationale: 히브리어는 왕의 행동을 여호와의 이전 말씀과 연결합니다. 이 인과·성취 관계를 약화시키지 않으면서도 한국어 문장으로 자연스럽게 드러냈습니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 여호와 이름의 표기
  chosen_reading: 신명 יְהוָה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - ‘주님’
  - ‘여호와’
  rationale: 프로젝트 표준에 따른 처리로, 본문 속 고유한 신적 이름을 제목어로 희석하지 않기 위해서입니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
