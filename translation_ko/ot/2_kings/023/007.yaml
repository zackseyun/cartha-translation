  text: וַ/יִּתֹּץ֙ אֶת בָּתֵּ֣י הַ/קְּדֵשִׁ֔ים אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁ֣ר הַ/נָּשִׁ֗ים אֹרְג֥וֹת שָׁ֛ם בָּתִּ֖ים לָ/אֲשֵׁרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
  footnotes:
  - marker: a
    text: Or 'the male cult prostitutes.' The Hebrew term is masculine plural and refers to persons involved in illicit cultic sexual practice.
    reason: lexical_alternative
  - marker: b
    text: Or 'hangings' or, more literally, 'houses' for the Asherah. The phrase likely refers to woven cultic coverings or shrine-like textiles associated with Asherah worship.
    reason: alternative_reading
  - marker: c
    text: '''The Asherah'' may refer either to the goddess Asherah or to the cult object associated with her, often rendered ''Asherah pole.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼의 성전 안에 있던 남성 제의 매춘자들의 거처들을 헐어 버렸습니다.[a] 그곳에서 여자들은 아세라를 위해 휘장들을 짜고 있었습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘남성 제의 매춘자들’. 히브리어는 남성 복수형이며, 불법적인 제의 성행위에 관여한 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘휘장들’, 혹은 더 문자적으로 ‘아세라를 위한 집들’. 이 표현은 아세라 숭배와 관련된 짜인 제의용 덮개나 성소 같은 직물을 가리키는 것으로 보입니다.
    reason: alternative_reading
  - marker: c
    text: ‘아세라’는 여신 아세라를 가리킬 수도 있고, 그녀와 연관된 제의 대상물을 가리킬 수도 있습니다. 흔히 ‘아세라 목상’으로 옮깁니다.
    reason: alternative_reading
