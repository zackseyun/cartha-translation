  text: וַ/יִּתֹּץ֙ אֶת בָּתֵּ֣י הַ/קְּדֵשִׁ֔ים אֲשֶׁ֖ר בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁ֣ר הַ/נָּשִׁ֗ים אֹרְג֥וֹת שָׁ֛ם בָּתִּ֖ים לָ/אֲשֵׁרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/007.yaml
  text: He tore down the houses of the cult prostitutes that were in the house of Yahweh[c][b][a], where the women were weaving hangings for the Asherah.
  footnotes:
  - marker: a
    text: Or 'the male cult prostitutes.' The Hebrew term is masculine plural and refers to persons involved in illicit cultic sexual practice.
    reason: lexical_alternative
  - marker: b
    text: Or 'hangings' or, more literally, 'houses' for the Asherah. The phrase likely refers to woven cultic coverings or shrine-like textiles associated with Asherah worship.
    reason: alternative_reading
  - marker: c
    text: '''The Asherah'' may refer either to the goddess Asherah or to the cult object associated with her, often rendered ''Asherah pole.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그는 야훼의 집 안에 있는, 남창들의 집들을 허물어뜨렸습니다. 거기에서 여자들은 아세라를 위해 휘장을 짜고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '남성 성전 매춘자들'. 히브리어는 남성 복수형이며, 불법적인 제의 성행위에 관여한 사람들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '휘장들' 혹은 더 문자적으로 '아세라를 위한 집들'입니다. 이 표현은 아세라 숭배와 관련된 짜인 제의용 덮개나 성소 같은 직물을 가리키는 것으로 보입니다.
    reason: alternative_reading
  - marker: c
    text: '''아세라''는 여신 아세라를 가리킬 수도 있고, 그녀와 연관된 제의 대상물을 가리킬 수도 있습니다. 흔히 ''아세라 목상''으로 옮깁니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֹּץ
  english_pob_choice: He tore down
  chosen_korean: 허물어뜨렸습니다
  alternatives_korean:
  - 무너뜨렸습니다
  - 헐어버렸습니다
  lexicon: HALOT
  rationale: 건물이나 구조물을 강하게 해체·파괴하는 뉘앙스를 살리면서, 현대 한국어에서도 자연스럽고 서술문에 어울리는 표현입니다.
- source_word: הַקְּדֵשִׁים
  english_pob_choice: the cult prostitutes
  chosen_korean: 남창들의
  alternatives_korean:
  - 성전 창기들의
  - 남성 성전 매춘자들의
  lexicon: HALOT
  rationale: 히브리어가 남성 복수형이므로 성별 표지를 살려야 하며, 문맥상 불법적 제의 성행위에 연루된 사람들을 가리키므로 완곡한 '거룩한 자들'류보다 직접적인 표현을 택했습니다.
- source_word: בָּתֵּי
  english_pob_choice: houses of
  chosen_korean: 집들을
  alternatives_korean:
  - 방들을
  - 거처들을
  lexicon: HALOT
  rationale: 직역 가능한 복수형 '집들'을 유지해 원문의 형태를 살렸고, 뒤의 '야훼의 집'과의 대비도 선명하게 드러냈습니다.
- source_word: לָאֲשֵׁרָה
  english_pob_choice: for the Asherah
  chosen_korean: 아세라를 위해
  alternatives_korean:
  - 아세라를 위하여
  - 아세라에게
  lexicon: HALOT
  rationale: 문맥상 아세라 숭배와 관련된 물건을 가리키지만, 본문이 여신과 숭배 대상 사이의 긴장을 완전히 해소하지 않으므로 주어적·목적적 해석을 과도하게 좁히지 않는 표현을 택했습니다.
