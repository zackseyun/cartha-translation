  text: בְּ/יָמָ֡י/ו עָלָה֩ פַרְעֹ֨ה נְכֹ֧ה מֶֽלֶךְ מִצְרַ֛יִם עַל מֶ֥לֶךְ אַשּׁ֖וּר עַל נְהַר פְּרָ֑ת וַ/יֵּ֨לֶךְ הַ/מֶּ֤לֶךְ יֹאשִׁיָּ֨הוּ֙ לִ/קְרָאת֔/וֹ וַ/יְמִיתֵ֨/הוּ֙ בִּ/מְגִדּ֔וֹ כִּ/רְאֹת֖/וֹ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/029.yaml
  text: In his days Pharaoh Neco king of Egypt went up against the king of Assyria to the Euphrates River[a]. And King Josiah went to meet him[c][b], and he killed him at Megiddo when he saw him.
  footnotes:
  - marker: a
    text: Hebrew Neco; traditionally, Necho.
    reason: lexical_alternative
  - marker: b
    text: Or, more explicitly by interpretation, 'Pharaoh Neco killed him at Megiddo when Josiah went to meet him.' The Hebrew uses ambiguous third-person pronouns.
    reason: alternative_reading
  - marker: c
    text: See also 2 Chronicles 35:20–24 for the parallel account of Josiah's death.
    reason: cross_reference
translation:
  language: ko
  text: 그의 시대에 이집트 왕 파라오 느고[a]가 아시리아 왕을 치러 유프라테스 강으로 올라갔습니다. 요시야 왕이 그를 맞으러 나갔고, 그가 그를 보았을 때 그를 므깃도에서 죽였습니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 이름은 느코로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 마지막 절의 3인칭 대명사들이 누구를 가리키는지 압축적으로 표현합니다. 해석적으로는 ‘파라오 느고가 요시야를, 요시야가 그를 맞으러 나갔을 때 므깃도에서 죽였다’로 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 역대하 35:20–24의 평행 기록도 참조하십시오.
    reason: cross_reference
lexical_decisions:
- source_word: בְּיָמָיו
  english_pob_choice: In his days
  chosen_korean: 그의 시대에
  alternatives_korean:
  - 그의 때에
  - 그의 통치 기간에
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮기되, 특정 사건의 시간 배경이라는 기능을 유지했습니다.
- source_word: עָלָה ... עַל
  english_pob_choice: went up against
  chosen_korean: '...에게 올라갔습니다'
  alternatives_korean:
  - '...를 향해 올라갔습니다'
  - '...와 맞서러 갔습니다'
  lexicon: HALOT
  rationale: עלה의 기본 이미지인 ‘올라가다’를 살리면서, 전쟁 문맥의 이동을 문맥으로 드러냈습니다. 영어 POB의 ‘against’는 한국어에서 과도하게 전투성만 강조하지 않도록 다듬었습니다.
- source_word: פַרְעֹה נְכֹה
  english_pob_choice: Pharaoh Neco
  chosen_korean: 파라오 느고
  alternatives_korean:
  - 파라오 네코
  - 바로 느고
  lexicon: HALOT
  rationale: 전통적 교회 용어인 ‘바로’보다 원어 음역에 가까운 ‘파라오’를 택했고, 인명은 현대 표기에서 통용되는 ‘느고’를 사용했습니다.
- source_word: וַיְמִיתֵהוּ
  english_pob_choice: he killed him
  chosen_korean: 그를 죽였습니다
  alternatives_korean:
  - 그를 사형에 처했습니다
  - 그를 목숨 잃게 했습니다
  lexicon: HALOT
  rationale: 히필형의 사역적 뉘앙스를 과도하게 해설하지 않으면서, 본문이 말하는 결과를 सीधे 드러내는 기본 동사로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 주어·목적어 지시 대상의 모호성
  chosen_reading: ‘그를 맞으러 나갔고, 그를 므깃도에서 죽였습니다. 그가 그를 보았을 때였습니다’로 두었고, 주어를 명시적으로 재구성하지 않았습니다.
  alternative_readings:
  - ‘바로 느고가 그를 므깃도에서 죽였습니다’로 해석적으로 명시
  - ‘요시야가 그를 맞으러 나갔고’만 남겨 행위 주체를 분리
  rationale: 히브리어는 대명사 연쇄가 압축되어 있어 주체를 단정하기 어렵습니다. 병행본문을 통해 해석을 좁힐 수는 있지만, 본문 투명성을 위해 모호성을 유지했습니다.
  doctrine_reference: 본문의 문법적 긴장을 보존하고 조화시키지 않음
