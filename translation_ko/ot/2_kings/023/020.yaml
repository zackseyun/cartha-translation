source:
  edition: WLC
  text: וַ֠/יִּזְבַּח אֶת כָּל כֹּהֲנֵ֨י הַ/בָּמ֤וֹת אֲשֶׁר שָׁם֙ עַל הַֽ/מִּזְבְּח֔וֹת וַ/יִּשְׂרֹ֛ף אֶת עַצְמ֥וֹת אָדָ֖ם עֲלֵי/הֶ֑ם וַ/יָּ֖שָׁב יְרוּשָׁלִָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/020.yaml
  text: He slaughtered all the priests of the high places who were there on the altars[a], and he burned human bones on them. Then he returned to Jerusalem.
  footnotes:
  - marker: a
    text: Or 'He sacrificed all the priests of the high places.' The Hebrew verb can carry sacrificial overtones, but here it likely emphasizes violent slaughter in the context of purging illicit worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳에 있던 산당의 모든 제사장들을 제단들 위에서 학살하고, 그 위에 사람의 뼈를 불살랐습니다. 그런 다음 예루살렘으로 돌아왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘학살하고’는 여기서 זבח의 희생제의적 가능성보다 폭력적 도살의 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  english_pob_choice: he slaughtered
  chosen_korean: 학살하고
  alternatives_korean:
  - 희생제물로 바치고
  - 죽이고
  lexicon: HALOT
  rationale: זבח는 ‘희생하다/도살하다’의 뜻을 가질 수 있지만, 여기서는 우상 숭배 장소의 제사장들을 겨냥한 폭력적 정화 행위이므로 ‘학살하다’가 제의적 정당성을 주지 않으면서도 폭력성을 분명히 드러냅니다.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  english_pob_choice: the priests of the high places
  chosen_korean: 산당의 제사장들
  alternatives_korean:
  - 고지의 제사장들
  - 산당 제사장들
  lexicon: HALOT
  rationale: בָּמוֹת은 열왕기에서 불법적인 지방 제의 장소인 ‘산당’을 가리키므로, 한국어에서도 통용되는 성경 용어인 ‘산당’이 가장 정확합니다.
- source_word: עַצְמוֹת אָדָם
  english_pob_choice: human bones
  chosen_korean: 사람의 뼈
  alternatives_korean:
  - 인간의 뼈
  - 사람 뼈
  lexicon: HALOT
  rationale: אָדָם은 여기서 성별이 아닌 인간 일반을 뜻하므로 ‘사람의 뼈’가 자연스럽고 정확합니다.
- source_word: עֲלֵיהֶם
  english_pob_choice: on them
  chosen_korean: 그 위에
  alternatives_korean:
  - 그들 위에
  - 그것들 위에
  lexicon: HALOT
  rationale: 지시 대명사가 앞의 제단들을 가리키므로 한국어에서는 중복을 피하면서도 대상을 분명히 하는 ‘그 위에’가 가장 자연스럽습니다.
- source_word: וַיָּשָׁב יְרוּשָׁלִָם
  english_pob_choice: Then he returned to Jerusalem
  chosen_korean: 그런 다음 예루살렘으로 돌아왔습니다
  alternatives_korean:
  - 그리고 예루살렘으로 돌아왔습니다
  - 그 뒤 예루살렘으로 돌아왔습니다
  lexicon: HALOT
  rationale: 서술의 진행을 나타내는 וַיָּשָׁב을 한국어 서사 연결어 ‘그런 다음’으로 옮겨 자연스러운 시간 순서를 살렸습니다.
theological_decisions:
- issue: וַיִּזְבַּח의 제의적 뉘앙스를 한국어에서 어떻게 처리할지
  chosen_reading: ‘학살하고’로 옮겨 희생 제의의 정당화 인상을 피했습니다.
  alternative_readings:
  - 희생제물로 바치고
  - 제사드리고
  rationale: 본문은 야훼께 드리는 합법적 제사가 아니라 산당 정화와 우상 숭배에 대한 심판을 묘사하므로, 제의적 의미가 과도하게 읽히지 않도록 폭력성을 전면에 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: Original-language primacy over translation tradition; preserve lexical/theological tension
