source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה גַּ֤ם אֶת יְהוּדָה֙ אָסִיר֙ מֵ/עַ֣ל פָּנַ֔/י כַּ/אֲשֶׁ֥ר הֲסִרֹ֖תִי אֶת יִשְׂרָאֵ֑ל וּ֠/מָאַסְתִּי אֶת הָ/עִ֨יר הַ/זֹּ֤את אֲשֶׁר בָּחַ֨רְתִּי֙ אֶת יְר֣וּשָׁלִַ֔ם וְ/אֶת הַ/בַּ֔יִת אֲשֶׁ֣ר אָמַ֔רְתִּי יִהְיֶ֥ה שְׁמִ֖/י שָֽׁם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/027.yaml
  text: And Yahweh said[a], “I will also remove Judah from before me, just as I removed Israel; and I will reject this city that I chose—Jerusalem—and the house of which I said[b], ‘My name will be there.’”
  footnotes:
  - marker: a
    text: Or 'the temple.' Hebrew 'the house,' referring to the temple in Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Or 'and I have rejected this city that I chose—Jerusalem.' The Hebrew verb can be read as a completed action, though here it is rendered with future force to match the surrounding judgment declaration.
    reason: alternative_reading
translation:
  language: ko
  text: 야훼께서 말씀하셨습니다. “나는 유다도 내가 이스라엘을 제거한 것처럼 내 앞에서 제거하겠다. 또 내가 택한 이 성, 곧 예루살렘과 ‘내 이름이 거기에 있을 것이다’라고 내가 말한 그 집[a]을 거절하겠다[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성전’입니다. 히브리어는 ‘집’이며, 예루살렘 성전을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘거절하였다’입니다. 히브리어 동사는 완료형으로 읽을 수 있으나, 여기서는 앞의 심판 선언에 맞추어 미래 의미로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 본문의 여호와/주님이 아니라 언약적 고유명으로서의 하나님의 이름을 한국어 기본값인 ‘야훼’로 옮겼습니다.
- source_word: אָסִיר / הֲסִרֹתִי (סור in Hiphil)
  english_pob_choice: remove / removed
  chosen_korean: 제거하다
  alternatives_korean:
  - 없애다
  - 버리다
  - 쫓아내다
  lexicon: HALOT
  rationale: 히필형의 ‘떠나가게 하다, 치워 버리다’는 의미를 현대 한국어에서 가장 직접적으로 드러내는 말로 ‘제거하다’를 택했습니다.
- source_word: מֵעַל פָּנַי
  english_pob_choice: from before me
  chosen_korean: 내 앞에서
  alternatives_korean:
  - 내 임재에서
  - 내 얼굴 앞에서
  lexicon: HALOT
  rationale: 관계적·언약적 거리감을 살리면서도 자연스러운 한국어 관용으로 옮기기 위해 ‘내 앞에서’로 처리했습니다.
- source_word: הַבַּיִת
  english_pob_choice: the house
  chosen_korean: 그 집
  alternatives_korean:
  - 성전
  - 그 성전
  lexicon: HALOT
  rationale: 직역상 ‘집’이며, 문맥상 성전을 가리키지만 원문 어휘를 유지해 성전 호칭의 해석적 긴장을 보존했습니다.
theological_decisions:
- issue: וּמָאַסְתִּי의 시제 처리
  chosen_reading: 문맥의 심판 선언 흐름에 맞추어 ‘거절하겠다’로 미래 지향적으로 옮겼습니다.
  alternative_readings:
  - 거절하였다
  - 버렸다
  rationale: 형태는 완료형이지만, 앞뒤가 모두 임박한 심판 선언이므로 한국어에서는 미래형으로 유지하는 편이 담화 흐름과 더 잘 맞습니다.
  doctrine_reference: 예언적 현재/완료의 담화 기능을 보존하며, 이미 실현된 폐기를 과잉 단정하지 않습니다.
