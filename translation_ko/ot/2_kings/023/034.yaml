  text: וַ/יַּמְלֵךְ֩ פַּרְעֹ֨ה נְכֹ֜ה אֶת אֶלְיָקִ֣ים בֶּן יֹאשִׁיָּ֗הוּ תַּ֚חַת יֹאשִׁיָּ֣הוּ אָבִ֔י/ו וַ/יַּסֵּ֥ב אֶת שְׁמ֖/וֹ יְהוֹיָקִ֑ים וְ/אֶת יְהוֹאָחָ֣ז לָקָ֔ח וַ/יָּבֹ֥א מִצְרַ֖יִם וַ/יָּ֥מָת שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/034.yaml
  text: And Pharaoh Neco made Eliakim son of Josiah king in place of Josiah his father[a], and changed his name to Jehoiakim. But he took Jehoahaz[b], and he came to Egypt and died there.
  footnotes:
  - marker: a
    text: Or, 'and he went to Egypt.' The Hebrew reads 'came to Egypt.'
    reason: lexical_alternative
  - marker: b
    text: That is, Pharaoh Neco renamed Eliakim as Jehoiakim.
    reason: cultural_note
translation:
  language: ko
  text: 파라오 느고가 요시야의 아들 엘리아김을 그의 아버지 요시야의 자리에 왕으로 세우고, 그의 이름을 여호야김으로 바꾸었습니다. 그러나 그는 여호아하스를 데려갔고, 여호아하스는 이집트에 와서 거기에서 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘이집트에 왔다’라고 되어 있습니다.
    reason: source_note
  - marker: b
    text: 여기서는 파라오 느고가 엘리아김의 이름을 여호야김으로 바꾼 것으로 이해됩니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּמְלֵךְ
  english_pob_choice: made ... king
  chosen_korean: 왕으로 세우고
  alternatives_korean:
  - 왕으로 삼고
  - 왕으로 임명하고
  - 왕으로 즉위시키고
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리면서도, 한국어에서는 ‘세우다’가 임명·등용의 뜻을 자연스럽게 담아 ‘made ... king’에 가장 가깝습니다.
- source_word: תַּחַת
  english_pob_choice: in place of
  chosen_korean: '...의 자리에'
  alternatives_korean:
  - '...를 대신하여'
  - '...의 대신으로'
  - '...를 대신해'
  lexicon: HALOT
  rationale: 왕위 계승 문맥에서 תַּחַת는 단순한 ‘아래’가 아니라 교체를 뜻하므로, ‘자리에’로 옮겨 대체 관계를 분명히 했습니다.
- source_word: וַיַּסֵּב אֶת־שְׁמוֹ
  english_pob_choice: changed his name
  chosen_korean: 이름을 여호야김으로 바꾸었습니다
  alternatives_korean:
  - 이름을 여호야김으로 바꾸었습니다
  - 여호야김으로 이름을 고쳤습니다
  - 그의 이름을 여호야김이라 하였습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘이름을 돌리다/바꾸다’의 뜻이므로, 한국어에서 가장 직접적인 ‘이름을 바꾸다’로 옮겼습니다.
- source_word: וַיָּבֹא מִצְרַיִם
  english_pob_choice: and he came to Egypt
  chosen_korean: 이집트에 와서
  alternatives_korean:
  - 이집트에 갔고
  - 이집트에 이르렀고
  - 이집트로 와서
  lexicon: HALOT
  rationale: 영어 POB처럼 히브리어의 ‘came’를 보존해 원문 시점을 살렸고, 한국어에서는 서술 흐름상 ‘와서’가 자연스럽습니다.
theological_decisions:
- issue: 요시야를 ‘his father’로 명시하는 처리
  chosen_reading: ‘그의 아버지 요시야’라고 풀어 써서 엘리아김의 혈연 관계를 분명히 했습니다.
  alternative_readings:
  - ‘요시야’만 적는다
  - ‘그의 아버지’만 적는다
  rationale: 히브리어의 소유격은 엘리아김을 기준으로 한 관계를 분명히 하므로, 한국어에서도 관계성을 그대로 드러내는 편이 문맥 이해에 유리합니다.
  doctrine_reference: 본문 문맥상 계승과 혈통의 역사 서술
- issue: ‘데려갔고’의 의미
  chosen_reading: לָקָח를 단순한 ‘취하다’보다 구체적인 ‘데려가다’로 옮겨 포로·연행의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그를 취했고’
  - ‘그를 잡아갔고’
  - ‘그를 끌고 갔고’
  rationale: 문맥상 여호아하스는 이집트로 이송되어 그곳에서 죽으므로, 한국어에서는 결과를 과도하게 해석하지 않으면서도 이동·연행의 함의를 드러내는 표현이 적절합니다.
  doctrine_reference: 왕정사 서술의 역사적·사실적 의미 보존
