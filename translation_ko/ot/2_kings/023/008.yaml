  text: וַ/יָּבֵ֤א אֶת כָּל הַ/כֹּֽהֲנִים֙ מֵ/עָרֵ֣י יְהוּדָ֔ה וַ/יְטַמֵּ֣א אֶת הַ/בָּמ֗וֹת אֲשֶׁ֤ר קִטְּרוּ שָׁ֨מָּ/ה֙ הַ/כֹּ֣הֲנִ֔ים מִ/גֶּ֖בַע עַד בְּאֵ֣ר שָׁ֑בַע וְ/נָתַ֞ץ אֶת בָּמ֣וֹת הַ/שְּׁעָרִ֗ים אֲשֶׁר פֶּ֜תַח שַׁ֤עַר יְהוֹשֻׁ֨עַ֙ שַׂר הָ/עִ֔יר אֲשֶֽׁר עַל שְׂמֹ֥אול אִ֖ישׁ בְּ/שַׁ֥עַר הָ/עִֽיר־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/008.yaml
  text: He brought all the priests from the cities of Judah and defiled the high places where the priests had burned incense[a], from Geba to Beer-sheba. He also tore down the high places of the gates that were at the entrance of the gate of Joshua the governor of the city[b], which were on the left of a man at the city gate.
  footnotes:
  - marker: a
    text: Or, more interpretively, 'the shrines at the gates.' The Hebrew reads literally 'the high places of the gates.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew phrase 'which were on a man's left at the city gate' is difficult. It likely refers to the left side as one entered the gate.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다의 여러 성읍에서 모든 제사장들을 데려와, 제사장들이 그곳에서 분향하던 산당들을 부정하게 했습니다. 그것은 게바에서 브엘세바까지였습니다. 또한 그는 도시의 관원 여호수아의 문 어귀에 있는 산당들—그것들은 성문에 있는 사람의 왼쪽에 있었습니다—을 헐어 버렸습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 해석적으로, ‘성문에 있는 산당들’입니다. 히브리어는 문자적으로 ‘성문들의 산당들’이라고 되어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어의 ‘성문에 있는 사람의 왼쪽’은 난해합니다. 아마도 성문으로 들어갈 때 왼쪽을 가리키는 것으로 보입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא אֶת כָּל הַכֹּהֲנִים
  english_pob_choice: He brought all the priests
  chosen_korean: 그는 … 모든 제사장들을 데려와
  alternatives_korean:
  - 그는 … 모든 제사장들을 데리고 와
  - 그는 … 모든 제사장들을 불러와
  lexicon: HALOT
  rationale: הביא는 여기서 사람들을 어떤 장소/상황으로 ‘데려오다’의 의미가 자연스럽고, 단순히 ‘가져오다’보다 인격적 대상에 맞습니다.
- source_word: וַיְטַמֵּא אֶת הַבָּמוֹת
  english_pob_choice: defiled the high places
  chosen_korean: 산당들을 부정하게 했습니다
  alternatives_korean:
  - 산당들을 더럽혔습니다
  - 산당들을 불결하게 했습니다
  lexicon: HALOT
  rationale: טמא의 제의적 의미를 살리면서, 한국어에서는 ‘부정하게 하다’가 의례적 오염을 가장 정확하고 절제되게 드러냅니다.
- source_word: קִטְּרוּ שָׁמָּה
  english_pob_choice: had burned incense there
  chosen_korean: 그곳에서 분향하던
  alternatives_korean:
  - 그곳에서 향을 피우던
  - 그곳에서 분향했던
  lexicon: HALOT
  rationale: קטר는 여기서 제사 행위인 분향을 가리키므로 교회적이지만 문맥에 맞는 ‘분향’이 원문의 제의성을 보존합니다.
- source_word: בָּמוֹת הַשְּׁעָרִים
  english_pob_choice: the high places of the gates
  chosen_korean: 산당들—
  alternatives_korean:
  - 성문 산당들
  - 문들의 산당들
  lexicon: HALOT
  rationale: 히브리어의 압축된 표현을 살리되, 한국어에서는 설명적 삽입으로 문맥을 풀어 주었습니다. ‘산당들’이 핵심 명사입니다.
- source_word: שַׂר הָעִיר
  english_pob_choice: the governor of the city
  chosen_korean: 도시의 관원
  alternatives_korean:
  - 성읍의 통치자
  - 도시의 총독
  lexicon: HALOT
  rationale: שַׂר는 문맥상 왕족 호칭보다 행정 관직에 가깝고, 한국어 ‘관원’이 과도한 추정을 피하면서도 직분성을 전달합니다.
- source_word: אֲשֶׁר עַל שְׂמֹאול אִישׁ
  english_pob_choice: which were on a man's left
  chosen_korean: 성문에 있는 사람의 왼쪽에
  alternatives_korean:
  - 한 사람의 왼쪽에
  - 성문에 들어서는 사람의 왼쪽에
  lexicon: HALOT
  rationale: 이 구절은 난해하므로, 영어 POB의 이해를 반영하되 원문의 방향 감각을 유지하도록 ‘성문에 있는 사람의 왼쪽’으로 옮겼습니다.
theological_decisions:
- issue: 제의적 장소를 ‘부정하게 하다’로 번역할지의 문제
  chosen_reading: 산당들을 부정하게 했습니다
  alternative_readings:
  - 산당들을 더럽혔습니다
  - 산당들을 불결하게 했습니다
  rationale: 요시야의 행위는 단순한 물리적 오염이 아니라 예배 장소를 제의적으로 무효화하는 행동이므로, ‘부정하게 하다’가 본문의 종교적 의미를 가장 잘 드러냅니다.
  doctrine_reference: 구약 제의 정결/부정 개념
