revisions:
- from: 그는 유다의 여러 성읍에서 모든 제사장들을 데려와, 제사장들이 그곳에서 분향하던 산당들을 부정하게 했습니다. 그것은 게바에서 브엘세바까지였습니다. 또한 그는 도시의 관원 여호수아의 문 어귀에 있는 산당들—그것들은 성문에 있는 사람의 왼쪽에 있었습니다—을 헐어 버렸습니다.[a][b]
  to: 그는 유다의 여러 성읍에서 모든 제사장들을 데려와, 게바에서 브엘세바에 이르기까지 제사장들이 그곳에서 분향하던 산당들을 부정하게 했습니다. 또 그는 성읍 관원 여호수아의 성문 입구에 있던 성문들의 산당들[a]을 허물었습니다. 그 산당들은 성읍 성문에서 한 사람의 왼쪽에 있었습니다.[b]
  rationale: 지리적 범위를 해당 산당들을 수식하도록 회복하고, 누락된 ‘성문들의’(הַשְּׁעָרִים)를 본문에 복원했습니다. 마지막 위치절은 특정한 이동 방향이나 인물을 과도하게 확정하지 않도록 원문의 난해성을 유지했으며, 각주 표지도 각각 해당 표현 직후에 배치했습니다.
