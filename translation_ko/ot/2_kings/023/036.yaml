  yaml_path: translation/ot/2_kings/023/036.yaml
  text: Jehoiakim was twenty-five years old when he began to reign[a], and he reigned eleven years in Jerusalem. His mother’s name was Zebidah daughter of Pedaiah[b], from Rumah.
  footnotes:
  - marker: a
    text: Or, more formally, “Jehoiakim was a son of twenty-five years when he became king.”
    reason: lexical_alternative
  - marker: b
    text: Zebidah may also be spelled “Zebudah” in English transliteration traditions.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호야김은 왕이 되었을 때 스물다섯 살이었고, 예루살렘에서 열한 해 동안 다스렸습니다. 그의 어머니의 이름은 루마 출신 브다야의 딸 스비다였습니다.
  philosophy: optimal-equivalence
