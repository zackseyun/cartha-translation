id: 2KI.23.25
reference: 2 Kings 23:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/כָמֹ/הוּ֩ לֹֽא הָיָ֨ה לְ/פָנָ֜י/ו מֶ֗לֶךְ אֲשֶׁר שָׁ֤ב אֶל יְהוָה֙ בְּ/כָל לְבָב֤/וֹ וּ/בְ/כָל נַפְשׁ/וֹ֙ וּ/בְ/כָל מְאֹד֔/וֹ כְּ/כֹ֖ל תּוֹרַ֣ת מֹשֶׁ֑ה וְ/אַחֲרָ֖י/ו לֹֽא קָ֥ם כָּמֹֽ/הוּ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/025.yaml
  text: And before him there was no king like him[a], who turned to Yahweh with all his heart and with all his soul and with all his might, according to all the law of Moses[c][b]; nor did any like him arise after him.
  footnotes:
  - marker: a
    text: Or 'returned to the LORD.' The Hebrew verb can carry the sense of turning back in covenant loyalty and repentance.
    reason: lexical_alternative
  - marker: b
    text: '''With all his heart and with all his soul and with all his might'' echoes Deuteronomy 6:5.'
    reason: cross_reference
  - marker: c
    text: Or 'strength' for 'might.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그보다 앞서 그와 같은 왕은 없었습니다. 그는 모세의 모든 율법대로, 온 마음과 온 영혼과 온 힘을 다하여[b][c] 야훼께로 돌아왔습니다[a]. 그 뒤에도 그와 같은 왕은 일어나지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아오다’는 여기서 שׁוּב와 אֶל의 결합이 지닌 언약적 회복과 회개의 뜻을 함께 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 마음과 온 영혼과 온 힘’은 신명기 6:5를 반영하는 표현입니다.
    reason: cross_reference
  - marker: c
    text: מְאֹד는 여기서 문자적 ‘매우’가 아니라 총체적 역량을 가리키므로 ‘힘’으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָמֹהוּ / לְפָנָיו
  english_pob_choice: And before him there was no king like him
  chosen_korean: 그와 같은 왕은 그 앞에도 없었습니다
  alternatives_korean:
  - 그보다 앞선 왕 중에 그와 같은 이는 없었습니다
  - 그 앞에서 그와 같은 왕은 없었습니다
  lexicon: HALOT
  rationale: 전면화된 비교와 ‘before him’의 시간적 뜻을 한국어에서 자연스럽게 살리되, 왕 평가문 특유의 강한 유일성을 유지했습니다.
- source_word: שָׁב אֶל יְהוָה
  english_pob_choice: turned to Yahweh
  chosen_korean: 야훼께로 … 돌아오고
  alternatives_korean:
  - 야훼께로 돌아가고
  - 야훼께로 돌아서고
  lexicon: HALOT
  rationale: שׁוּב + אֶל은 단순 이동이 아니라 언약적 회복과 충성을 포함한 ‘돌아옴’이므로, 관계적·회개적 뉘앙스를 살려 ‘돌아오다’로 옮겼습니다.
- source_word: בְּכָל לְבָבוֹ וּבְכָל נַפְשׁוֹ וּבְכָל מְאֹדוֹ
  english_pob_choice: with all his heart and with all his soul and with all his might
  chosen_korean: 온 마음과 온 영혼과 온 힘을 다하여
  alternatives_korean:
  - 마음과 영혼과 힘을 다하여
  - 온 마음과 온 생명과 온 힘을 다하여
  lexicon: HALOT
  rationale: 신명기 6:5의 삼중 표현을 한국어 성경에서 익숙하면서도 본문의 상호본문성을 드러내는 형태로 유지했습니다. מְאֹד는 문맥상 총체적 역량을 뜻하므로 ‘힘’이 적절합니다.
- source_word: כְּכֹל תּוֹרַת מֹשֶׁה
  english_pob_choice: according to all the law of Moses
  chosen_korean: 모세의 모든 율법을 따라
  alternatives_korean:
  - 모세의 모든 율법에 따라
  - 모세의 율법 전체를 따라
  lexicon: HALOT
  rationale: 이 왕 평가 문맥의 תּוֹרָה는 단순 ‘가르침’보다 모세 율법 전체를 가리키므로, POB의 ‘law of Moses’에 맞춰 ‘모세의 모든 율법’으로 옮겼습니다.
- source_word: וְאַחֲרָיו לֹא קָם כָּמֹהוּ
  english_pob_choice: nor did any like him arise after him
  chosen_korean: 그 뒤에도 그와 같은 이가 일어나지 않았습니다
  alternatives_korean:
  - 그 뒤로도 그와 같은 왕은 일어나지 않았습니다
  - 그 뒤에도 그와 같은 자는 없었습니다
  lexicon: HALOT
  rationale: קָם의 ‘일어나다’를 살리면서, 이후의 후속 왕들 가운데 동등한 자가 없었다는 절대 비교를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 야훼의 고유명사 번역
  chosen_reading: יהוה를 ‘야훼’로 표기했습니다.
  alternative_readings:
  - the LORD식 대문자 대체
  - 여호와
  rationale: 본문이 하나님의 언약 이름을 직접 사용하므로, 직함으로 바꾸지 않고 고유명사성을 보존했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 신명기 6:5의 삼중 헌신 표현
  chosen_reading: ‘온 마음과 온 영혼과 온 힘’의 삼중 구조를 본문에 유지했습니다.
  alternative_readings:
  - 마음과 영혼과 힘
  - 온 마음과 온 생명과 온 힘
  rationale: 본문의 평가는 요시야의 헌신이 신명기적 언약 이상형을 구현했음을 암시하므로, 상호본문성을 희석하지 않도록 구조를 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 5
