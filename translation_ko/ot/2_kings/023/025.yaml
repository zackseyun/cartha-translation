revisions:
- from: 그와 같은 왕은 그 앞에도 없었는데, 곧 야훼께로 온 마음과 온 영혼과 온 힘을 다하여 돌아오고, 모세의 모든 율법을 따라 행하였으며, 그 뒤에도 그와 같은 이가 일어나지 않았습니다.[a][b][c]
  to: 그보다 앞서 그와 같은 왕은 없었습니다. 그는 모세의 모든 율법대로, 온 마음과 온 영혼과 온 힘을 다하여[b][c] 야훼께로 돌아왔습니다[a]. 그 뒤에도 그와 같은 왕은 일어나지 않았습니다.
  rationale: 원문의 수식 관계를 보존하도록 ‘행하다’를 삭제하고, 시간적 비교를 ‘그보다 앞서’로 명료화했습니다. ‘야훼’, 삼중 헌신 표현, ‘모세의 모든 율법’은 유지했습니다. 각주 a의 부정확한 ‘כאן’ 표기도 바로잡고, 각주 표지는 해당 표현 가까이에 배치했습니다.
