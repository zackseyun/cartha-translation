  - severity: medium
    issue: 각주 a의 ‘כאן’ 오기
    rationale: 히브리어 ‘כאן’은 본문 어휘나 필요한 문법 설명이 아니며, 한국어 ‘여기서’로 수정해야 독자에게 정확한 설명이 됩니다.
