  source_fidelity: 초안은 핵심 의미와 비교의 양끝(요시야 이전과 이후), 야훼께로의 전향, 신명기적 삼중 표현을 대체로 충실히 전달합니다. 그러나 ‘모세의 모든 율법을 따라 행하였으며’는 히브리어 본문에 별도의 ‘행하다’ 동사를 보충하여, ‘모세의 모든 율법대로’가 ‘야훼께로 돌아오다’를 수식하는 원문의 구조를 다소 바꿉니다.
  naturalness: ‘그 앞에도’는 시간적 의미가 문맥상 가능하지만 한국어에서는 공간적 의미도 떠올릴 수 있습니다. ‘그보다 앞서’가 시간 비교를 더 명료하고 자연스럽게 나타냅니다. 또한 두 문장으로 나누면 긴 수식 구조를 현대 표준어 합쇼체에서 더 분명하게 읽을 수 있습니다.
  terminology: ‘야훼’, ‘온 마음과 온 영혼과 온 힘’, ‘모세의 모든 율법’은 원문 및 영어 POB의 용어 선택을 적절히 반영합니다. 각주 a의 ‘כאן’은 이 문맥에 맞지 않는 표기이므로 ‘여기서’로 바로잡아야 합니다.
