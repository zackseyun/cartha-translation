  - 그의 조상들
  lexicon: HALOT
  rationale: 왕조 문맥에서 ‘his fathers’는 혈연적 아버지들만이 아니라 선대 조상/전임자들을 가리키므로, 문맥을 반영해 ‘조상들’로 옮겼습니다.
