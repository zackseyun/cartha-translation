translation:
  language: ko
  text: 그리고 그는 야훼 보시기에 악한 일을 행하였습니다. 그의 조상들이 행한 모든 것과 같이였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그의 아버지들’이지만, 여기서는 그 선대 조상들 또는 전임자들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: And he did
  chosen_korean: 그는 … 행하였습니다
  alternatives_korean:
  - 그리고 그는 … 하였습니다
  - 그는 … 했습니다
  lexicon: HALOT
  rationale: 서사 진행을 나타내는 완료형을 자연스러운 한국어 과거 서술로 옮기되, 본문의 행위 동사를 살려 ‘행하다’로 번역했습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 악을
  - 악한 것
  lexicon: HALOT
  rationale: ‘עשה הרע’는 관용적으로 ‘악한 일을 행하다’라는 의미이므로, 한국어에서도 관용을 살려 의미를 분명하게 했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 평가의 관용구를 직역에 가깝게 살리되, 한국어에서는 ‘보시기에’가 가장 자연스럽고 원문의 시각적 은유도 유지합니다.
- source_word: אֲבֹתָיו
  english_pob_choice: his fathers
  chosen_korean: 그의 조상들이
  alternatives_korean:
  - 그의 아버지들이
  - 그의 선조들이
  - 그의 조상들
  lexicon: HALOT
  rationale: 왕조 문맥에서 ‘his fathers’는 혈연적 아버지들만이 아니라 선대 조상/전임자들을 가리키므로, 문맥을 반영해 ‘조상들’로 옮겼습니다.
theological_decisions:
