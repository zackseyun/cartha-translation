    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: sent
  chosen_korean: 사람을 보내자
  alternatives_korean:
  - 보내자
  - 전령을 보내자
  - 불러오자
  lexicon: HALOT
  rationale: 히브리어 שׁלח는 이 문맥에서 단순히 ‘보내다’만이 아니라 소집을 위한 파견을 포함할 수 있어, 한국어에서는 자연스럽게 ‘사람을 보내자’로 옮겼습니다.
- source_word: וַיַּאַסְפוּ אֵלָי/ו
  english_pob_choice: were gathered to him
  chosen_korean: 그에게 모여들었습니다
  alternatives_korean:
  - 그에게 모였습니다
  - 그에게 모여왔습니다
  - 그 앞으로 모였습니다
  lexicon: HALOT
  rationale: 수동적으로 풀기보다 ‘모여들다’가 집결의 움직임을 더 생생하게 살리며, אֶל의 방향성도 자연스럽게 드러냅니다.
- source_word: זִקְנֵי
  english_pob_choice: the elders
  chosen_korean: 장로
  alternatives_korean:
  - 지도자
  - 원로
  - 늙은이
  lexicon: HALOT
  rationale: 여기서는 연장자가 아니라 공동체의 공적 대표자들을 가리키므로, 한국어 성경에서 통용되는 ‘장로’를 유지했습니다.
