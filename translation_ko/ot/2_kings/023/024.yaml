  text: וְ/גַ֣ם אֶת הָ/אֹב֣וֹת וְ/אֶת הַ֠/יִּדְּעֹנִים וְ/אֶת הַ/תְּרָפִ֨ים וְ/אֶת הַ/גִּלֻּלִ֜ים וְ/אֵ֣ת כָּל הַ/שִּׁקֻּצִ֗ים אֲשֶׁ֤ר נִרְאוּ֙ בְּ/אֶ֤רֶץ יְהוּדָה֙ וּ/בִ/יר֣וּשָׁלִַ֔ם בִּעֵ֖ר יֹֽאשִׁיָּ֑הוּ לְ֠מַעַן הָקִ֞ים אֶת דִּבְרֵ֤י הַ/תּוֹרָה֙ הַ/כְּתֻבִ֣ים עַל הַ/סֵּ֔פֶר אֲשֶׁ֥ר מָצָ֛א חִלְקִיָּ֥הוּ הַ/כֹּהֵ֖ן בֵּ֥ית יְהוָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/024.yaml
  text: Moreover[a], Josiah removed the mediums, the spiritists, the household gods, the idols, and all the abominations that were seen in the land of Judah and in Jerusalem, in order to establish the words of the law written in the book that Hilkiah the priest found in the house of Yahweh.
  footnotes:
  - marker: a
    text: Or “written on the scroll.” The Hebrew word can refer to a written document in scroll form.
    reason: lexical_alternative
translation:
  language: ko
  text: 그뿐만 아니라 요시야는 유다 땅과 예루살렘에 있던 영매들과 강신술사들, 가정의 신상들, 우상들, 그리고 모든 가증한 것들을 제거했습니다. 이는 제사장 힐기야가 야훼의 집에서 발견한 책에 기록된 율법의 말씀을 시행하려고 한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두루마리에 기록된”. 히브리어 단어는 두루마리 형태의 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם / moreover
  english_pob_choice: Moreover
  chosen_korean: 그뿐만 아니라
  alternatives_korean:
  - 또
  - 더욱이
  lexicon: HALOT
  rationale: 추가적인 개혁 조치를 자연스럽게 이어 주면서도 원문의 덧붙임 강도를 살립니다.
- source_word: הָאֹבוֹת / הַיִּדְּעֹנִים
  english_pob_choice: the mediums, the spiritists
  chosen_korean: 점쟁이들, 영매들
  alternatives_korean:
  - 무당들, 영들과 교통하는 자들
  - 신접자들, 영매들
  lexicon: HALOT
  rationale: 문맥상 죽은 자나 영적 존재를 매개하려는 불법적 행위자들을 가리키므로, 현대 한국어에서 뜻이 분명한 표현을 택했습니다.
- source_word: הַתְּרָפִים / הַגִּלֻּלִים
  english_pob_choice: the household gods, the idols
  chosen_korean: 가정신상들, 우상들
  alternatives_korean:
  - 가정 우상들, 우상들
  - 테라핌, 우상들
  lexicon: HALOT
  rationale: תרפים는 가정용 신상/수호상에 해당하므로 기능을 드러내는 표현으로 옮기고, גִלֻּלִים는 경멸적 뉘앙스를 살리되 통상적인 ‘우상들’로 옮겼습니다.
- source_word: כָּל הַשִּׁקֻּצִים
  english_pob_choice: all the abominations
  chosen_korean: 모든 가증한 것들
  alternatives_korean:
  - 모든 혐오스러운 것들
  - 모든 더러운 것들
  lexicon: HALOT
  rationale: 의례적·도덕적으로 혐오스러운 대상 전체를 가리키는 넓은 표현을 보존했습니다.
- source_word: לְמַעַן הָקִים אֶת דִּבְרֵי הַתּוֹרָה
  english_pob_choice: in order to establish the words of the law
  chosen_korean: 율법의 말씀을 세우기 위한 것이었습니다
  alternatives_korean:
  - 율법의 말씀을 이루기 위한 것이었습니다
  - 율법의 말씀을 확립하기 위한 것이었습니다
  lexicon: HALOT
  rationale: הקים는 단순 수행보다 ‘세우다/확립하다’의 의미가 강해, 율법의 말씀을 실제로 효력을 갖게 한다는 목적을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  rationale: 이 본문은 구약 서술문이므로 한국 교회권에서 널리 인지되는 관용형을 우선해 읽었습니다. 다만 프로젝트 기본어인 ‘야훼’와의 긴장은 주석으로 남기지 않았습니다.
  doctrine_reference: POB contested terms policy for YHWH
