revisions:
- from: 그뿐만 아니라 요시야는 유다 땅과 예루살렘에서 나타난 점쟁이들, 영매들, 가정신상들, 우상들, 그리고 모든 가증한 것들을 제거했습니다. 이는 여호와의 집에서 제사장 힐기야가 발견한 책에 기록된 율법의 말씀을 세우기 위한 것이었습니다.[a]
  to: 그뿐만 아니라 요시야는 유다 땅과 예루살렘에 있던 영매들과 강신술사들, 가정의 신상들, 우상들, 그리고 모든 가증한 것들을 제거했습니다. 이는 제사장 힐기야가 야훼의 집에서 발견한 책에 기록된 율법의 말씀을 시행하려고 한 것이었습니다.[a]
  rationale: 원문의 병렬 목록과 제거 행위를 유지하되, 영매 관련 용어를 일반 ‘점쟁이’와 구별했습니다. נִרְאוּ는 자연스러운 한국어로 ‘있던’이라 옮겼고, 목적절은 율법 조항을 실제로 실행한다는 הָקִים의 문맥상 의미를 살려 다듬었습니다. 각주는 본문과 중복되지 않도록 ‘두루마리’라는 어휘 대안을 제시했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:46Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. אֹבוֹת를 ‘점쟁이들’로 옮기면 일반적인 점복 행위자라는 뜻으로 넓어져, 죽은 자/영과 관련된 매개자라는 원문의 의미가 약화됩니다. נִרְאוּ의 문맥적 의미도 ‘나타난’보다 그 지역에 존재·발견된 것을 나타내는 표현이 자연스럽습니다. YHWH는 제공된 POB 정책 및 영어 감사 기록에 맞춰 ‘야훼’로 통일하는 것이 적절합니다.
  naturalness: ‘가정신상들’은 현대 표준어에서 다소 결합이 부자연스럽고 ‘가정의 신상들’이 더 명료합니다. ‘율법의 말씀을 세우기 위한 것이었습니다’도 직역투이므로, 목적을 직접 연결한 ‘율법의 말씀을 시행하려고’가 현대 합쇼체 문맥에서 자연스럽습니다.
  terminology: ‘영매들과 강신술사들’은 두 병렬된 불법 종교 행위자를 구별하면서도 현대 독자가 이해할 수 있습니다. תְּרָפִים는 ‘가정의 신상들’, גִּלֻּלִים는 ‘우상들’, שִׁקֻּצִים는 포괄적으로 ‘모든 가증한 것들’로 옮깁니다. 신명은 프로젝트 기본 정책에 따라 ‘야훼’를 사용합니다.
  issues:
  - severity: medium
    issue: ‘점쟁이들’은 הָאֹבוֹת의 의미를 지나치게 일반화합니다.
    rationale: 이 단어는 이 문맥에서 죽은 자 또는 영을 매개·문의하는 이들과 관련되며, 일반 점복가를 가리키는 표현은 정확도가 떨어집니다.
  - severity: low
    issue: ‘유다 땅과 예루살렘에서 나타난’은 נִרְאוּ의 한국어 표현으로 어색합니다.
    rationale: 원문은 해당 지역에 보이거나 존재하던 대상들을 가리킵니다. ‘있던’이 자연스럽게 그 의미를 전달합니다.
  - severity: medium
    issue: 신명 ‘여호와’가 제공된 POB의 YHWH 기본 정책 및 영어 감사 기록의 ‘Yahweh’와 불일치합니다.
    rationale: 프로젝트의 명시된 신명 정책을 적용해 ‘야훼’로 통일해야 합니다.
  - severity: medium
    issue: 각주가 본문과 동일한 ‘책에 기록된’을 대안으로 제시합니다.
    rationale: 각주는 סֵפֶר가 두루마리 문서를 뜻할 수 있다는 실제 대안을 제시해야 합니다.
