  text: 그가 말했습니다. “그를 그대로 두십시오. 아무도 그의 뼈를 건드리지 못하게 하십시오.” 그래서 그들은 그의 뼈와 사마리아에서 온 그 예언자의 뼈를 그대로 두었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
