    text: 또는, “그래서 그들은 그의 뼈와 사마리아에서 온 그 예언자의 뼈를 보존했습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּיחוּ לוֹ
  english_pob_choice: Leave him alone
  chosen_korean: 그를 그대로 두십시오
  alternatives_korean:
  - 그를 내버려 두십시오
  - 그를 그대로 두십시오
  lexicon: HALOT
  rationale: 직역보다 자연스러운 현대 한국어로, 시신을 더 건드리지 말라는 금지를 간결하게 살렸습니다.
- source_word: אַל יָנַע עַצְמֹתָי/ו
  english_pob_choice: let no man disturb his bones
  chosen_korean: 아무도 그의 뼈를 흔들지 못하게 하십시오
  alternatives_korean:
  - 아무도 그의 뼈를 움직이지 못하게 하십시오
  - 아무도 그의 뼈를 건드리지 못하게 하십시오
  lexicon: HALOT
  rationale: נוע의 이 문맥상 의미를 ‘흔들다’로 옮겨, 무덤/유해를 훼손하지 말라는 금지의 물리적 뉘앙스를 유지했습니다.
- source_word: וַיְמַלְּטוּ עַצְמֹתָי/ו
  english_pob_choice: So they let his bones alone
  chosen_korean: 그래서 그들은 그의 뼈를 그대로 두었고
  alternatives_korean:
  - 그래서 그들은 그의 뼈를 보존했고
  - 그래서 그들은 그의 뼈를 건드리지 않았고
  lexicon: HALOT
  rationale: מלט의 ‘보호하여 손상되지 않게 하다/모면하게 하다’는 뜻을 한국어에서 간결하게 드러내기 위해 ‘그대로 두다’로 옮겼습니다.
- source_word: אֵת עַצְמוֹת הַנָּבִיא אֲשֶׁר בָּא מִשֹּׁמְרוֹן
  english_pob_choice: along with the bones of the prophet who had come from Samaria
  chosen_korean: 사마리아에서 온 그 예언자의 뼈도 함께 두었습니다
  alternatives_korean:
  - 사마리아에서 온 예언자의 뼈와 함께 두었습니다
  - 사마리아에서 온 그 예언자의 뼈까지 보존했습니다
  lexicon: HALOT
  rationale: 사마리아를 고유명사로 살리고, 병행되는 추가 대상임을 ‘도 함께’로 명확히 했습니다.
theological_decisions:
- issue: 예언자 시신과 ‘뼈’의 반복을 어떻게 보존할 것인가
  chosen_reading: 시신을 일반화하지 않고 ‘뼈’라는 반복을 그대로 살려, 본문이 실제 유해를 가리키는 강한 구체성을 유지했습니다.
  alternative_readings:
  - ‘유해’로 완화해 읽기
  - ‘몸’으로 일반화해 읽기
  rationale: 본문은 시종일관 עצמות(뼈)를 반복하므로, 완곡하게 바꾸면 경고와 보존의 구체성이 약해집니다.
  doctrine_reference: 본문의 서술적 구체성 보존
