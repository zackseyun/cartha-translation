source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּהוּ֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶת כֹּהֲנֵ֣י הַ/מִּשְׁנֶה֮ וְ/אֶת שֹׁמְרֵ֣י הַ/סַּף֒ לְ/הוֹצִיא֙ מֵ/הֵיכַ֣ל יְהוָ֔ה אֵ֣ת כָּל הַ/כֵּלִ֗ים הָֽ/עֲשׂוּיִם֙ לַ/בַּ֣עַל וְ/לָֽ/אֲשֵׁרָ֔ה וּ/לְ/כֹ֖ל צְבָ֣א הַ/שָּׁמָ֑יִם וַֽ/יִּשְׂרְפֵ֞/ם מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ בְּ/שַׁדְמ֣וֹת קִדְר֔וֹן וְ/נָשָׂ֥א אֶת עֲפָרָ֖/ם בֵּֽית אֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/004.yaml
  text: Then the king commanded Hilkiah the high priest[a], the priests of the second order, and the keepers of the threshold to bring out from the temple of Yahweh all the vessels made for Baal, for Asherah, and for all the host of heaven. He burned them outside Jerusalem in the fields of the Kidron, and carried their dust to Bethel.
  footnotes:
  - marker: a
    text: Or 'for the Asherah pole'; the Hebrew אֲשֵׁרָה can refer either to the goddess Asherah or to a cult object associated with her.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 왕이 힐기야 대제사장과 둘째 서열의 제사장들과 문지기들에게 명령하여, 야훼의 성전에서 바알과 아세라와 하늘의 모든 군대를 위해 만들어진 모든 기구를 밖으로 가져오게 했습니다. 그는 그것들을 예루살렘 밖, 기드론 들판에서 불태우고, 그 재를 베델로 옮겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아세라 목상’. 히브리어 אֲשֵׁרָה는 여신 아세라나 그와 관련된 숭배 대상 둘 다를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 명하여
  lexicon: HALOT
  rationale: 왕의 주도적이고 권위 있는 행위를 드러내기 위해 직접적인 동사 ‘명령하다’를 썼습니다.
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 최고 제사장
  lexicon: HALOT
  rationale: 문맥상 유대 제사장 직분의 통상 명칭인 ‘대제사장’이 가장 자연스럽고 정확합니다.
- source_word: כֹּהֲנֵי הַמִּשְׁנֶה
  english_pob_choice: the priests of the second order
  chosen_korean: 둘째 서열의 제사장들
  alternatives_korean:
  - 두 번째 계열의 제사장들
  - 부제사장들
  lexicon: HALOT
  rationale: מִשְׁנֶה의 ‘부차적/두 번째’라는 계층성을 살리되, 제도적 세부를 과도하게 좁히지 않기 위해 ‘서열’을 택했습니다.
- source_word: לַבַּעַל / לָאֲשֵׁרָה / צְבָא הַשָּׁמָיִם
  english_pob_choice: for Baal, for Asherah, and for all the host of heaven
  chosen_korean: 바알과 아세라와 하늘의 모든 군대
  alternatives_korean:
  - 바알과 아세라와 하늘의 모든 천상군
  - 바알과 아세라와 하늘의 모든 군대
  lexicon: HALOT
  rationale: 우상 숭배의 대상을 병렬로 유지했고, צְבָא הַשָּׁמָיִם은 관용적으로 ‘하늘의 모든 군대’로 옮겼습니다.
- source_word: עֲפָרָם
  english_pob_choice: their dust
  chosen_korean: 그 재
  alternatives_korean:
  - 그들의 먼지
  - 그들의 티끌
  lexicon: HALOT
  rationale: 불탄 기물의 결과물을 한국어에서 자연스럽게 드러내기 위해 ‘재’로 옮겼습니다. 원문의 ‘dust/티끌’보다 소각의 결과를 더 분명하게 전달합니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절의 신명 표기는 직접적으로 야훼를 가리키므로, 프로젝트 기본값에 따라 고유 신명인 ‘야훼’를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: אֲשֵׁרָה의 처리
  chosen_reading: 아세라
  alternative_readings:
  - 아세라 목상
  - 아세라 여신
  rationale: 열거 구조가 바알과 나란히 우상적 대상들을 가리키므로, 문맥의 모호성을 보존하며 고유명사 형태로 두었습니다.
  doctrine_reference: English POB lexical note on אֲשֵׁרָה
