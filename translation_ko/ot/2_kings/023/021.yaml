  text: וַ/יְצַ֤ו הַ/מֶּ֨לֶךְ֙ אֶת כָּל הָ/עָ֣ם לֵ/אמֹ֔ר עֲשׂ֣וּ פֶ֔סַח לַֽ/יהוָ֖ה אֱלֹֽהֵי/כֶ֑ם כַּ/כָּת֕וּב עַ֛ל סֵ֥פֶר הַ/בְּרִ֖ית הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/021.yaml
  text: Then the king commanded all the people[a], saying, “Keep the Passover to Yahweh your God, as it is written in this Book of the Covenant.”
  footnotes:
  - marker: a
    text: Or “Celebrate/Observe the Passover.” The Hebrew idiom is literally “do/make Passover.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 모든 백성에게 명령했습니다. “이 언약책에 기록된 대로 야훼 너희 하나님을 위하여 유월절을 지키십시오[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘유월절을 하다/만들다’라는 관용구이며, ‘유월절을 지내십시오’ 또는 ‘유월절을 기념하십시오’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명하여 말했습니다
  alternatives_korean:
  - 명령했습니다
  - 명하였습니다
  lexicon: HALOT
  rationale: 왕이 백성에게 공식적으로 지시하는 서술이므로, 단순한 발화보다 명령의 행위를 드러내는 ‘명하여 말했습니다’가 자연스럽습니다.
- source_word: עֲשׂוּ פֶסַח
  english_pob_choice: Keep the Passover
  chosen_korean: 유월절을 지키십시오
  alternatives_korean:
  - 유월절을 지키세요
  - 유월절을 행하십시오
  - 유월절을 지내십시오
  lexicon: HALOT
  rationale: 히브리어는 직역하면 ‘유월절을 하라’이지만, 절기를 준수한다는 관용적 의미를 살려 ‘지키다’를 택했습니다.
- source_word: לַיהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: project default
  rationale: 이 프로젝트의 기본 원칙에 따라 언약명 יהוה는 ‘야훼’로 옮겨, 고유한 신명성과 언약적 호칭을 유지했습니다.
- source_word: אֱלֹהֵיכֶם
  english_pob_choice: your God
  chosen_korean: 너희 하나님
  alternatives_korean:
  - 너희의 하나님
  - 당신들의 하나님
  lexicon: HALOT
  rationale: 복수 2인칭 소유격을 분명히 드러내면서도 한국어 성경문체에 자연스러운 ‘너희 하나님’을 사용했습니다.
- source_word: סֵפֶר הַבְּרִית הַזֶּה
  english_pob_choice: this Book of the Covenant
  chosen_korean: 이 언약책
  alternatives_korean:
  - 이 언약의 책
  - 이 계약서
  lexicon: HALOT
  rationale: 문서명 성격을 살려 ‘언약책’으로 압축했고, ‘이’와 함께 지시성을 유지했습니다.
theological_decisions:
- issue: יהוה의 번역과 직접 명령문 어조
  chosen_reading: 야훼를 고유명으로 살리고, 왕의 명령을 직접 인용문 안에서 높임 명령형으로 처리했습니다.
  alternative_readings:
  - ‘주’로 완화해 번역
  - 평서형으로 바꿔 ‘지켜야 합니다’로 번역
  rationale: 본문은 언약의 하나님 이름과 왕의 공식 명령을 모두 선명하게 드러냅니다. 한국어에서도 신명 대체 없이 고유명 ‘야훼’를 유지하고, 직접 화법의 명령성을 보존하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘עשה פסח’의 관용적 의미
  chosen_reading: 의례를 ‘행하다’의 직역보다 ‘지키다’로 옮겨 절기 준수의 의미를 살렸습니다.
  alternative_readings:
  - ‘유월절을 하십시오’
  - ‘유월절을 지내십시오’
  rationale: 히브리어 관용구는 단순한 행위 수행이 아니라 절기 준수 전체를 가리키므로, 신학적·실천적 의미가 드러나는 ‘지키다’가 가장 적절합니다.
  doctrine_reference: HALOT on פֶּסַח idiom
