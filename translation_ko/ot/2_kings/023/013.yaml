  terminology: ‘산당’, ‘멸망의 산’, ‘가증한 것’, ‘아스다롯’, ‘그모스’, ‘밀곰’은 유지했습니다. ‘암몬 자손들’은 원문의 בְּנֵי עַמּוֹן을 보존합니다.
