  text: וְֽ/אֶת הַ/בָּמ֞וֹת אֲשֶׁ֣ר עַל פְּנֵ֣י יְרוּשָׁלִַ֗ם אֲשֶׁר֮ מִ/ימִ֣ין לְ/הַר הַ/מַּשְׁחִית֒ אֲשֶׁ֣ר בָּ֠נָה שְׁלֹמֹ֨ה מֶֽלֶךְ יִשְׂרָאֵ֜ל לְ/עַשְׁתֹּ֣רֶת שִׁקֻּ֣ץ צִידֹנִ֗ים וְ/לִ/כְמוֹשׁ֙ שִׁקֻּ֣ץ מוֹאָ֔ב וּ/לְ/מִלְכֹּ֖ם תּוֹעֲבַ֣ת בְּנֵֽי עַמּ֑וֹן טִמֵּ֖א הַ/מֶּֽלֶךְ־׀־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/013.yaml
  text: And the king defiled the high places that were before Jerusalem[a], which were to the right of the Mount of Destruction, which Solomon king of Israel had built for Ashtoreth, the abomination of the Sidonians, and for Chemosh, the abomination of Moab, and for Milcom[c][b], the abomination of the Ammonites.
  footnotes:
  - marker: a
    text: Or 'south of the Mount of Destruction,' since 'to the right' can reflect directional orientation in Hebrew topography.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'Mount of Destruction'; possibly the hill later identified with the Mount of Olives.
    reason: cross_reference
  - marker: c
    text: Hebrew reads 'Milcom'; some readers may associate this deity with 'Molech.'
    reason: alternative_reading
translation:
  language: ko
  text: 왕은 예루살렘 앞에 있으며 멸망의 산[b] 오른쪽에 있는[a] 산당들을 더럽혔습니다. 이 산당들은 이스라엘 왕 솔로몬이 시돈 사람들의 가증한 것 아스다롯과 모압의 가증한 것 그모스와 암몬 자손들의 가증한 것 밀곰[c]을 위하여 세운 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘멸망의 산 남쪽에 있는’으로 옮길 수 있습니다. 히브리어의 ‘오른쪽’은 지리적 방향 감각상 남쪽을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘멸망의 산’이라고 읽습니다. 이곳은 후대에 감람산과 연결되었을 가능성이 있습니다.
    reason: cross_reference
  - marker: c
    text: 히브리어 본문은 ‘밀곰’이라고 읽습니다. 일부 독자는 이 신을 ‘몰렉’과 연관지을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבָּמוֹת
  english_pob_choice: the high places
  chosen_korean: 산당들
  alternatives_korean:
  - 높은 곳들
  - 산당
  lexicon: HALOT
  rationale: 히브리어 בָּמוֹת는 단순한 지형보다 우상 숭배 장소를 가리키는 경우가 많아, 한국어 성경에서 익숙하고 의미가 분명한 ‘산당들’로 옮겼습니다.
- source_word: עַל פְּנֵי יְרוּשָׁלִַם
  english_pob_choice: before Jerusalem
  chosen_korean: 예루살렘 앞에 있는
  alternatives_korean:
  - 예루살렘 앞
  - 예루살렘 앞쪽의
  lexicon: HALOT
  rationale: 직역 성격을 살려 ‘before’의 전면/대면 의미를 유지했습니다. 지리적 해석을 본문에 미리 확정하지 않기 위해 ‘앞에 있는’으로 처리했습니다.
- source_word: הַר הַמַּשְׁחִית
  english_pob_choice: the Mount of Destruction
  chosen_korean: 멸망의 산
  alternatives_korean:
  - 파괴의 산
  - 멸망산
  lexicon: HALOT
  rationale: 히브리어의 폄하적 지명을 그대로 드러내기 위해 ‘멸망의 산’으로 옮겼습니다. ‘감람산’으로 조화시키지 않고 원문 표현을 유지했습니다.
- source_word: שִׁקֻּץ / תּוֹעֲבָה
  english_pob_choice: abomination
  chosen_korean: 가증한 것
  alternatives_korean:
  - 혐오스러운 것
  - 역겨운 것
  lexicon: HALOT
  rationale: 우상에 대한 강한 신학적 비난을 완화하지 않기 위해 ‘가증한 것’을 유지했습니다. 본문이 단순한 중립적 명칭이 아니라 혐오의 언어를 사용한다는 점을 반영합니다.
- source_word: לְמִלְכֹּם
  english_pob_choice: for Milcom
  chosen_korean: 밀곰
  alternatives_korean:
  - 몰렉
  lexicon: HALOT
  rationale: 본문의 자음형은 밀곰을 가리키므로 본문에는 ‘밀곰’을 두고, 몰렉과의 혼동 가능성은 각주로 처리했습니다.
theological_decisions:
- issue: 외국 신들의 이름과 평가어의 처리
  chosen_reading: 아스다롯, 그모스, 밀곰과 같은 고유명사는 음역하고, שִׁקּוּץ / תּוֹעֵבָה는 ‘가증한 것’으로 강하게 유지했습니다.
  alternative_readings:
  - 중립적 명칭으로 완화
  - 우상들을 일반명사화
  rationale: 본문은 이 신들을 단순 소개하지 않고 신학적으로 정죄합니다. 그 폄하적 어조를 한국어에서도 유지하는 것이 원문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 'Translation philosophy #1 and #5'
- issue: מִימִין의 방향 표현
  chosen_reading: 본문은 ‘오른쪽에 있는’으로 직역하고, 지리적 해석은 각주로 남기지 않았습니다.
  alternative_readings:
  - 남쪽에 있는
  - 남쪽 편의
  rationale: 원문은 ‘오른쪽’이라는 방향어를 사용하므로, 본문 차원에서는 이를 보존하는 편이 히브리어의 표면 구조를 더 잘 반영합니다.
  doctrine_reference: 'Translation philosophy #1'
