  edition: WLC
  text: וְ/גַ֨ם אֶת הַ/מִּזְבֵּ֜חַ אֲשֶׁ֣ר בְּ/בֵֽית אֵ֗ל הַ/בָּמָה֙ אֲשֶׁ֨ר עָשָׂ֜ה יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל גַּ֣ם אֶת הַ/מִּזְבֵּ֧חַ הַ/ה֛וּא וְ/אֶת הַ/בָּמָ֖ה נָתָ֑ץ וַ/יִּשְׂרֹ֧ף אֶת הַ/בָּמָ֛ה הֵדַ֥ק לְ/עָפָ֖ר וְ/שָׂרַ֥ף אֲשֵׁרָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/015.yaml
  text: Also the altar that was at Bethel—the high place that Jeroboam son of Nebat[a], who caused Israel to sin, had made—even that altar and the high place he tore down. He burned the high place, crushed it to dust, and burned the Asherah.
  footnotes:
  - marker: a
    text: Or 'the Asherah pole'; the Hebrew term can refer to the cult object associated with Asherah worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 또 베델에 있는 제단—곧 느밧의 아들 여로보암이 세워 이스라엘이 죄를 짓게 한 그 산당—그 제단과 산당을 무너뜨렸습니다. 그 산당을 불사르고 그것을 티끌로 부수었으며, 아세라를 불살랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라 목상’으로도 옮길 수 있습니다. 히브리어 용어는 아세라 숭배와 관련된 제의 물체를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבֵּחַ
  english_pob_choice: the altar
  chosen_korean: 제단
  alternatives_korean:
  - 번제단
  - 제사 제단
  lexicon: HALOT
  rationale: מִזְבֵּחַ의 기본 의미는 제단이므로, 불필요한 확장 없이 표준적인 ‘제단’으로 옮겼습니다.
- source_word: הַבָּמָה
  english_pob_choice: the high place
  chosen_korean: 산당
  alternatives_korean:
  - 산 위의 제사처
  - 높은 곳
  lexicon: HALOT
  rationale: בָּמָה는 이 문맥에서 우상 숭배의 제의 장소를 가리키는 기술적 용어이므로, 한국어 성경 관용에 맞는 ‘산당’을 사용했습니다.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: who caused Israel to sin
  chosen_korean: 이스라엘이 죄를 짓게 한
  alternatives_korean:
  - 이스라엘을 죄로 이끈
  - 이스라엘을 죄짓게 한
  lexicon: HALOT
  rationale: 히필형의 인과성을 살려 여로보암이 이스라엘을 죄로 끌어들였다는 뜻을 직접적으로 드러냈습니다.
- source_word: הֵדַק לְעָפָר
  english_pob_choice: crushed it to dust
  chosen_korean: 티끌로 부수었으며
  alternatives_korean:
  - 먼지로 부수었으며
  - 가루로 부수었으며
  lexicon: HALOT
  rationale: לְעָפָר의 결과 상태를 자연스러운 한국어로 반영하되, 단순 파괴보다 ‘잘게 부수어 흩뜨림’의 뉘앙스를 살렸습니다.
- source_word: אֲשֵׁרָה
  english_pob_choice: the Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 목상
  - 아세라 상
  lexicon: HALOT
  rationale: 본문의 용어를 그대로 살려 번역상의 과잉 해석을 피했습니다. 이 문맥에서는 숭배 대상과 관련된 제의 물체를 가리킬 가능성이 크지만, 본문 자체의 모호성은 유지했습니다.
theological_decisions:
- issue: אֲשֵׁרָה의 번역에서 모호성 보존
  chosen_reading: 본문에서는 ‘아세라’로 두어 대상의 정확한 성격을 단정하지 않았습니다.
  alternative_readings:
  - 아세라 목상
  - 아세라 상
  rationale: 멸망시키는 대상이 여신인지, 그와 연관된 제의 물체인지 본문만으로는 과잉 단정하기 어렵기 때문에, POB의 투명성 원칙에 따라 히브리어 용어를 유지했습니다.
  doctrine_reference: Preserve theological/lexical tension rather than resolving ambiguity prematurely.
