  text: וַ/יֹּ֕אמֶר מָ֚ה הַ/צִּיּ֣וּן הַלָּ֔ז אֲשֶׁ֖ר אֲנִ֣י רֹאֶ֑ה וַ/יֹּאמְר֨וּ אֵלָ֜י/ו אַנְשֵׁ֣י הָ/עִ֗יר הַ/קֶּ֤בֶר אִישׁ הָֽ/אֱלֹהִים֙ אֲשֶׁר בָּ֣א מִֽ/יהוּדָ֔ה וַ/יִּקְרָ֗א אֶת הַ/דְּבָרִ֤ים הָ/אֵ֨לֶּה֙ אֲשֶׁ֣ר עָשִׂ֔יתָ עַ֖ל הַ/מִּזְבַּ֥ח בֵּֽית אֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/017.yaml
  text: Then he said[a], “What is this monument that I see?” And the men of the city said to him[b], “It is the tomb of the man of God who came from Judah and proclaimed these things that you have done against the altar at Bethel.”
  footnotes:
  - marker: a
    text: Or “marker,” “memorial stone,” or “grave marker” for “monument.”
    reason: lexical_alternative
  - marker: b
    text: Or “called out” or “cried out”; the verb refers to the man of God's prophetic declaration concerning the altar (cf. 1 Kgs 13:1–2).
    reason: alternative_reading
translation:
  language: ko
  text: 그가 말했습니다. "내가 보는 이 표지판은 무엇입니까?" 성읍 사람들이 그에게 말했습니다. "그것은 유다에서 온 하나님의 사람의 무덤입니다. 그는 벧엘의 제단에 대하여, 당신이 이 일을 행한 것을 선포했습니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘표지판’은 여기서 무덤과 관련된 표식의 일반적 의미로 쓴 것입니다. 문맥상 기념석, 기념물, 무덤 표지로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선포했습니다’는 단순히 말한 것이 아니라, 1열왕기 13장의 예언처럼 공개적으로 선언했다는 뉘앙스를 살린 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּיּוּן
  english_pob_choice: monument
  chosen_korean: 표지판
  alternatives_korean:
  - 기념물
  - 기념석
  - 무덤 표지
  lexicon: HALOT
  rationale: 문맥상 눈에 보이는 묘지 표식이므로, 과도하게 특정하지 않으면서 현대 한국어에서 자연스러운 ‘표지판’으로 옮겼습니다.
- source_word: הַלָּז
  english_pob_choice: this
  chosen_korean: 이
  alternatives_korean:
  - 저
  - 그
  lexicon: HALOT
  rationale: 화자가 눈앞의 대상을 보고 묻는 장면이므로 지시어는 근접성을 살려 ‘이’가 가장 자연스럽습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 종
  lexicon: HALOT
  rationale: 히브리어의 관용적 칭호를 직역해, 예언자 기능은 드러나되 본문이 말하는 호칭 자체를 보존했습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: proclaimed
  chosen_korean: 선포했습니다
  alternatives_korean:
  - 외쳤습니다
  - 불렀습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 1열왕기 13장의 예언적 발화를 회상하는 동사이므로, 단순 발화보다 공개적 예언 선포의 힘을 살린 ‘선포했습니다’가 적절합니다.
theological_decisions:
- issue: 벧엘 제단을 향한 예언적 발화의 성격
  chosen_reading: 본문의 וַיִּקְרָא를 ‘선포했습니다’로 옮겨, 이전 예언이 단순한 언급이 아니라 제단을 향한 공적 경고였음을 드러냈습니다.
  alternative_readings:
  - 외쳤습니다
  - 불렀습니다
  rationale: 이 절은 1열왕기 13장의 예언을 상기시키므로, 한국어에서도 예언의 공적·선포적 성격이 유지되어야 합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 해설적 확장 최소화'
