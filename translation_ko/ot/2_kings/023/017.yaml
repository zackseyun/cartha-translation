  - 기념석
  - 무덤 표지
  lexicon: HALOT
  rationale: 문맥상 눈에 보이는 묘지 표식이므로, 과도하게 특정하지 않으면서 현대 한국어에서 자연스러운 ‘표지판’으로 옮겼습니다.
- source_word: הַלָּז
  english_pob_choice: this
  chosen_korean: 이
  alternatives_korean:
  - 저
  - 그
  lexicon: HALOT
  rationale: 화자가 눈앞의 대상을 보고 묻는 장면이므로 지시어는 근접성을 살려 ‘이’가 가장 자연스럽습니다.
- source_word: אִישׁ הָאֱלֹהִים
  english_pob_choice: the man of God
  chosen_korean: 하나님의 사람
  alternatives_korean:
  - 하나님의 선지자
  - 하나님의 종
  lexicon: HALOT
  rationale: 히브리어의 관용적 칭호를 직역해, 예언자 기능은 드러나되 본문이 말하는 호칭 자체를 보존했습니다.
- source_word: וַיִּקְרָא
  english_pob_choice: proclaimed
  chosen_korean: 선포했습니다
  alternatives_korean:
  - 외쳤습니다
  - 불렀습니다
  - 말했습니다
  lexicon: HALOT
  rationale: 1열왕기 13장의 예언적 발화를 회상하는 동사이므로, 단순 발화보다 공개적 예언 선포의 힘을 살린 ‘선포했습니다’가 적절합니다.
theological_decisions:
- issue: 벧엘 제단을 향한 예언적 발화의 성격
  chosen_reading: 본문의 וַיִּקְרָא를 ‘선포했습니다’로 옮겨, 이전 예언이 단순한 언급이 아니라 제단을 향한 공적 경고였음을 드러냈습니다.
  alternative_readings:
  - 외쳤습니다
  - 불렀습니다
  rationale: 이 절은 1열왕기 13장의 예언을 상기시키므로, 한국어에서도 예언의 공적·선포적 성격이 유지되어야 합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 해설적 확장 최소화'
