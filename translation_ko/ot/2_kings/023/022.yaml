  lexicon: HALOT
  rationale: 비교의 כ가 들어가 있으므로 단순 지시어보다 '이런/이와 같은'이 'like this one'의 뜻을 더 정확히 드러냅니다.
- source_word: מִימֵי הַשֹּׁפְטִים אֲשֶׁר שָׁפְטוּ אֶת יִשְׂרָאֵל
  english_pob_choice: since the days of the judges who judged Israel
  chosen_korean: 이스라엘을 재판하던 사사들의 시대부터
  alternatives_korean:
  - 이스라엘을 다스리던 사사들의 시대부터
