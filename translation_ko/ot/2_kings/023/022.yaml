  - 이스라엘의 왕들과 유다의 왕들의 모든 날 동안에는
  lexicon: HALOT
  rationale: 히브리어의 병렬 구조를 살려 이스라엘과 유다를 각각 분리해 두 왕조를 명확히 했습니다.
theological_decisions:
- issue: 역사적 비교의 범위
  chosen_reading: 이 절은 요시야의 유월절과 견줄 만한 유월절이 사사 시대부터 남북 왕조 전체 기간 동안 없었다는 비교를 말합니다.
  alternative_readings:
  - 유월절 자체가 전혀 없었다는 뜻으로 읽는 해석
  - 과장법으로만 이해하는 해석
  rationale: כַּפֶּסַח הַזֶּה의 비교 의미를 살려, 본문이 '이런 유월절'의 부재를 말한다는 점을 보존했습니다.
  doctrine_reference: 본문 주해의 역사적-문법적 읽기
