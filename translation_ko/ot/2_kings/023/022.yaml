  naturalness: 원문의 ‘이스라엘의 모든 왕들과 유다의 모든 왕들의 모든 날’은 소유·수식이 중복되어 현대 한국어로 매우 어색합니다. ‘이스라엘 왕들의 모든 시대와 유다 왕들의 모든 시대’로 병렬을 유지하면서 자연스럽게 고쳤습니다.
