  text: For such a Passover had not been kept since the days of the judges who judged Israel[a], nor in all the days of the kings of Israel and the kings of Judah.
  footnotes:
  - marker: a
    text: Literally, 'this Passover'; the sense is 'a Passover like this one' or 'such a Passover.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이런 유월절은 이스라엘을 다스리던 사사들의 시대부터 이스라엘 왕들의 모든 시대와 유다 왕들의 모든 시대에 이르기까지 지켜진 적이 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘이 유월절과 같이’이지만, 뜻은 ‘이와 같은 유월절’ 또는 ‘이런 유월절’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לֹא נַעֲשָׂה
  english_pob_choice: had not been kept
  chosen_korean: 지켜진 적이 없었습니다
  alternatives_korean:
  - 행해진 적이 없었습니다
  - 거행된 적이 없었습니다
  - 지켜진 일이 없었습니다
  lexicon: HALOT
  rationale: 유월절에 대한 עשה는 단순한 '행하다'보다 예전부터 이어지는 예식의 '지킴/거행'을 뜻하므로, 부정 완료로 자연스럽게 옮겼습니다.
