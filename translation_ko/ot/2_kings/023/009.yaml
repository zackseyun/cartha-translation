  source_fidelity: 수정이 필요합니다. 초안의 ‘올라가지 못하고’는 히브리어 לֹא יַעֲלוּ(‘올라가지 않았다/않는다’)보다 능력 또는 허가의 불가능을 더 강하게 명시합니다. 또한 כִּי אִם의 제한·대조를 ‘다만’으로 드러내는 것이 적절합니다. ‘예루살렘에 있는 야훼의 제단’은 히브리어의 ‘예루살렘에 있는 야훼의 제단’ 관계를 자연스럽고 정확하게 나타냅니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘그들의 형제들 가운데서’는 원문의 소유 표현을 보존하면서 ‘자기’가 낳을 수 있는 지시의 모호성을 줄입니다.
  terminology: ‘산당’, ‘야훼’, ‘제단’, ‘무교병’은 본문과 제의 문맥에 알맞습니다. ‘형제들’은 אֲחֵיהֶם의 남성 복수 친족·동료 표현을 과도하게 해석하지 않고 보존합니다.
