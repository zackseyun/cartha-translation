theological_decisions:
- issue: ‘예루살렘의 야훼의 제단’에서 제의적 배제의 의미
  chosen_reading: 산당 제사장들은 예루살렘 성전 제단에서 봉사하지 못하고, 대신 형제들 가운데서 무교병을 먹는 것으로 제한되었습니다.
  alternative_readings:
  - 예루살렘의 제단으로 올라가지 않았다
  - 예루살렘에서 야훼의 제단에 나아가지 못했다
  rationale: אַךְ + לֹא יַעֲלוּ는 단순한 이동 부재가 아니라 제단 봉사에 대한 제한을 뜻하므로, 서술 전체가 제의적 배제를 드러내도록 옮겼습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §2
