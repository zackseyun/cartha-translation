    issue: ‘올라가지 못하고’가 원문의 단순 부정에 능력·허가의 불가능을 추가합니다.
    rationale: לֹא יַעֲלוּ는 문자적으로 ‘올라가지 않았다/않는다’입니다. 문맥상 제의 참여 제한을 시사할 수 있지만, 본문 자체가 ‘못했다’라고 명시하지 않으므로 번역문에서는 그 추가 뉘앙스를 피하는 것이 안전합니다.
