  text: However[a], the priests of the high places did not go up to the altar of Yahweh in Jerusalem[c][b], but they ate unleavened bread among their brothers.
  footnotes:
  - marker: a
    text: Or, 'the high-place priests.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'among their brothers,' likely referring to their fellow priests or priestly kinsmen.
    reason: cultural_note
  - marker: c
    text: The divine name is YHWH, traditionally rendered 'the LORD.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 산당의 제사장들은[a] 예루살렘에 있는 야훼[c]의 제단에 올라가지 않았고, 다만 그들의 형제들 가운데서[b] 무교병을 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘산당의 제사장들’은 히브리어의 ‘산당 제사장들’이라는 관형 관계를 풀어 쓴 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 형제들 가운데서’는 히브리어의 직역에 가깝고, 문맥상 그들의 동료 제사장이나 제사장 친족을 가리킬 가능성이 있습니다.
    reason: cultural_note
  - marker: c
    text: 히브리어 본문은 신명사표기 יְהוָה를 사용합니다.
    reason: alternative_reading
