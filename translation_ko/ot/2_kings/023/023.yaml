translation:
  language: ko
  text: 그러나 요시야 왕의 열여덟째 해에야 이 유월절이 야훼를 위해 예루살렘에서 지켜졌습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘행해졌다’입니다. 여기서는 ‘지켜졌다’ 또는 ‘준수되었다’의 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: but only
  chosen_korean: 그러나 …에야
  alternatives_korean:
  - 오직
  - 다만
  lexicon: HALOT
  rationale: 앞선 문맥과 대조되는 제한적 의미를 자연스러운 한국어로 살리기 위해 ‘그러나 …에야’로 옮겼습니다.
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  english_pob_choice: in the eighteenth year
  chosen_korean: 열여덟째 해에
  alternatives_korean:
  - 열여덟 해에
  - 열여덟째 해 동안
  lexicon: HALOT
  rationale: 통치 연대의 관용적 표현이므로 순서를 드러내는 ‘열여덟째 해에’가 가장 직접적입니다.
- source_word: נַעֲשָׂה
  english_pob_choice: was kept
  chosen_korean: 지켜졌습니다
  alternatives_korean:
  - 행해졌습니다
  - 드려졌습니다
  - 실행되었습니다
  lexicon: HALOT
  rationale: 직역하면 ‘행해지다/되다’이지만, 유월절의 문맥에서는 ‘지키다’가 예식을 실제로 준수했다는 뜻을 가장 잘 드러냅니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 위해
  alternatives_korean:
  - 야훼께
  - 야훼를 위하여
  lexicon: HALOT
  rationale: POB의 본문처럼 하나님의 이름을 ‘야훼’로 드러내고, לַ־의 목적/헌정 의미를 한국어에서는 ‘위해’로 자연스럽게 표현했습니다.
theological_decisions:
