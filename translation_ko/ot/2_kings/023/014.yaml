lexical_decisions:
- source_word: וְ/שִׁבַּר֙ אֶת הַ/מַּצֵּב֔וֹת
  english_pob_choice: He shattered the pillars
  chosen_korean: 기둥들을 산산이 부수고
  alternatives_korean:
  - 기둥들을 깨뜨리고
  - 기둥들을 부수고
  lexicon: HALOT
  rationale: שִׁבַּר의 강한 파괴성을 살리기 위해 ‘산산이 부수고’로 옮겼습니다. מַצֵּבוֹת은 여기서 제의적 기둥을 가리키므로, 간결하게 ‘기둥들’로 렌더링했습니다.
- source_word: וַ/יִּכְרֹ֖ת אֶת הָ/אֲשֵׁרִ֑ים
  english_pob_choice: cut down the Asherim
  chosen_korean: 아세라 목상들을 베어 내고
  alternatives_korean:
  - 아세라들을 베어 내고
  - 아세라 기둥들을 베어 내고
  lexicon: HALOT
  rationale: אֲשֵׁרִים은 아세라와 관련된 제의 대상들을 가리킬 수 있어, 한국어에서는 그 기능을 드러내는 ‘아세라 목상들’이 가장 자연스럽습니다. ‘베어 내고’는 लक재/목재성 대상에 대한 כרת의 물리적 행위를 잘 반영합니다.
- source_word: וַ/יְמַלֵּ֥א אֶת מְקוֹמֹם עַצְמוֹת אָדָם
  english_pob_choice: filled their places with human bones
  chosen_korean: 그 자리를 사람의 뼈로 채웠습니다
  alternatives_korean:
  - 그 자리를 인간의 뼈로 채웠습니다
  - 그 자리를 사람 뼈로 채웠습니다
  lexicon: HALOT
  rationale: מְקוֹמָם은 파괴된 우상 제의 대상들의 ‘자리’를 가리키므로 ‘그 자리’로 옮겼습니다. עַצְמוֹת אָדָם은 일반적 인간을 뜻하므로, 성별을 특정하지 않는 ‘사람의 뼈’로 표현했습니다.
theological_decisions:
- issue: 아세라 관련 제의 대상의 성격
  chosen_reading: ‘아세라 목상들’로 옮겨, 단순한 사람 이름이 아니라 제의적 우상 대상임을 드러냈습니다.
  alternative_readings:
  - 아세라들
  - 아세라 기둥들
  rationale: 히브리어 복수형 אֲשֵׁרִים은 아세라와 연관된 제의 물체를 가리킬 수 있으므로, 문맥의 우상 파괴 의미를 분명히 하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: 우상/제의 대상은 문맥에 따라 기능을 드러내어 번역'
