  text: וְ/טִמֵּ֣א אֶת הַ/תֹּ֔פֶת אֲשֶׁ֖ר בְּ/גֵ֣י בני הִנֹּ֑ם לְ/בִלְתִּ֗י לְ/הַעֲבִ֨יר אִ֜ישׁ אֶת בְּנ֧/וֹ וְ/אֶת בִּתּ֛/וֹ בָּ/אֵ֖שׁ לַ/מֹּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/010.yaml
  text: And he defiled Topheth[a], which is in the Valley of Ben-hinnom[c][b], so that no man might make his son or his daughter pass through the fire to Molech.
  footnotes:
  - marker: a
    text: 'Hebrew: ''make his son or his daughter pass through the fire,'' a cultic idiom referring to offering children in a rite associated with Molech, likely child sacrifice.'
    reason: cultural_note
  - marker: b
    text: Or 'no one.' Hebrew 'man' is singular masculine with generic force here.
    reason: lexical_alternative
  - marker: c
    text: Or possibly 'for Molech'; less likely, some understand the consonants as 'to the king.'
    reason: alternative_reading
translation:
  language: ko
  text: 그가 도벳을 더럽혔습니다. 이곳은 힌놈의 아들들의 골짜기에 있었는데, 아무도 자기 아들이나 딸을 불 속으로 몰렉에게 지나가게 하지 못하게 하려는 것이었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 자녀를 몰렉과 관련된 의례에 불 속으로 지나가게 하는 행위를 가리키며, 대체로 아동 제사를 뜻합니다.
    reason: cultural_note
  - marker: b
    text: '''아무도''로도 옮길 수 있습니다. 히브리어의 ''사람''은 여기서 단수 남성형이지만 일반적 의미로 쓰였습니다.'
    reason: lexical_alternative
  - marker: c
    text: '''몰렉에게'' 대신 ''몰렉을 위하여''로 읽을 가능성도 있으나, 덜 유력합니다. 일부는 자음군을 ''왕에게''로 이해합니다.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְטִמֵּא
  english_pob_choice: And he defiled
  chosen_korean: 그가 ... 더럽혔습니다
  alternatives_korean:
  - 그가 ... 부정하게 했습니다
  - 그가 ... 모독했습니다
  lexicon: HALOT
  rationale: טמא의 사역적 의미를 살리되, 제의 장소를 쓸모없게 만든 상황에 자연스럽게 맞는 한국어로 옮겼습니다.
- source_word: הַתֹּפֶת
  english_pob_choice: Topheth
  chosen_korean: 도벳
  alternatives_korean:
  - 도페트
  - 토펫
  lexicon: HALOT
  rationale: 지명은 음역하는 것이 적절하며, 한국어 성서 문맥에서 통용되는 형태를 따랐습니다.
- source_word: בְּגֵי בני הִנֹּם
  english_pob_choice: in the Valley of Ben-hinnom
  chosen_korean: 힌놈의 아들들의 골짜기
  alternatives_korean:
  - 벤힌놈 골짜기
  - 힌놈 골짜기
  lexicon: HALOT
  rationale: 직역성을 유지해 원문 지명을 드러냈습니다. 'Ben-hinnom'의 의미 구조를 보존하면서도 한국어로 읽히게 했습니다.
- source_word: לְבִלְתִּי לְהַעֲבִיר
  english_pob_choice: so that no man might make ... pass through
  chosen_korean: 아무도 ... 지나가게 하지 못하게 하려는 것이었습니다
  alternatives_korean:
  - '... 지나가게 하지 않으려고'
  - '... 통과시키지 못하게 하려는 것이었습니다'
  lexicon: HALOT
  rationale: 부정 목적절의 기능을 살려 '못하게 하려는'으로 옮겼고, לְהַעֲבִיר의 관용구는 '지나가게 하다'로 반영했습니다.
- source_word: בָּאֵשׁ לַמֹּלֶךְ
  english_pob_choice: through the fire to Molech
  chosen_korean: 불 속으로 몰렉에게
  alternatives_korean:
  - 불 가운데로 몰렉에게
  - 불로 몰렉에게
  lexicon: HALOT
  rationale: 관용구 'pass through the fire'를 직역해 의례적 표현을 유지했고, 목적어는 '몰렉에게'로 보존했습니다.
theological_decisions:
- issue: child-sacrifice idiom in the source
  chosen_reading: 본문에서는 관용구를 유지하고, 한국어도 '불 속으로 지나가게 하다'의 형식을 살렸습니다.
  alternative_readings:
  - 자녀를 몰렉에게 제물로 바치다
  - 자녀를 불태워 몰렉에게 드리다
  rationale: 원문은 의례적 관용구를 사용하므로, 본문에서 의미를 과도하게 풀기보다 투명하게 유지하는 편이 원문 충실성과 감사 가능성을 높입니다.
  doctrine_reference: Translation philosophy §1, §3, §6
