    rationale: ‘불 가운데로’는 통과 경로를, ‘몰렉에게’는 의례의 수혜 대상을 나타내므로 ‘…을 불 가운데로 지나가게 하여 몰렉에게 바치다’처럼 한국어에서 관계를 분명히 해야 합니다. 이는 본문에서 관용구를 유지하면서도 원문의 의례적 지향을 보존합니다.
