  text: אַ֣ךְ לֹֽא שָׁ֣ב יְהוָ֗ה מֵ/חֲר֤וֹן אַפּ/וֹ֙ הַ/גָּד֔וֹל אֲשֶׁר חָרָ֥ה אַפּ֖/וֹ בִּֽ/יהוּדָ֑ה עַ֚ל כָּל הַ/כְּעָסִ֔ים אֲשֶׁ֥ר הִכְעִיס֖/וֹ מְנַשֶּֽׁה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/026.yaml
  text: Yet Yahweh did not turn from the fierceness of his great anger[a], with which his anger burned against Judah[b], because of all the provocations with which Manasseh had provoked him.
  footnotes:
  - marker: a
    text: Or 'from his great burning anger'; the Hebrew literally speaks of the 'burning of his nose/anger,' an idiom for intense anger.
    reason: lexical_alternative
  - marker: b
    text: Or 'in Judah'; English commonly says anger burned 'against' someone, though the Hebrew preposition is literally 'in.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 자기의 큰 타오르는 분노[a]를 거두지 않으셨습니다. 그분의 분노가 유다[b]를 향하여 타올랐으니, 그것은 므낫세가 그분을 격노하게 한 온갖 분노케 하는 일들 때문이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그분의 코/분노의 타오름’이라는 관용구를 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 전치사는 문자적으로 ‘유다 안에’이지만, 한국어에서는 ‘유다를 향하여’가 분노의 대상을 더 자연스럽게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: Yet
  chosen_korean: 그러나
  alternatives_korean:
  - 그렇지만
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 문맥상 요시야의 개혁 뒤에도 이어지는 강한 대조를 살리기 위해 역접을 분명히 했습니다.
- source_word: שָׁב ... מֵחֲרוֹן אַפּוֹ הַגָּדוֹל
  english_pob_choice: did not turn from the fierceness of his great anger
  chosen_korean: 자기의 큰 타오르는 분노를 거두지 않으셨습니다
  alternatives_korean:
  - 자기의 큰 타오르는 분노에서 돌이키지 않으셨습니다
  - 자기의 큰 분노를 누그러뜨리지 않으셨습니다
  - 자기의 맹렬한 큰 분노에서 물러서지 않으셨습니다
  lexicon: HALOT
  rationale: שׁוּב의 ‘돌이키다/turn’ 이미지를 한국어에서 자연스럽게 살리면서도, מֵחֲרוֹן אַף의 ‘타오르는 분노’ 관용을 보존했습니다.
- source_word: אֲשֶׁר חָרָה אַפּוֹ
  english_pob_choice: with which his anger burned
  chosen_korean: 그분의 분노가 ... 타올랐으니
  alternatives_korean:
  - 그분의 분노가 ... 불탔으니
  - 그분의 진노가 ... 일어났으니
  - 그분의 분노가 ... 격해졌으니
  lexicon: HALOT
  rationale: 히브리어의 ‘분노가 타다’(חרה + אף) 반복을 유지해, 단순한 추상어보다 불붙는 이미지를 드러냈습니다.
- source_word: בִּיהוּדָה
  english_pob_choice: against Judah
  chosen_korean: 유다를 향하여
  alternatives_korean:
  - 유다에
  - 유다 안에서
  - 유다를 향해
  lexicon: HALOT
  rationale: 전치사의 직역인 ‘안에서’보다, 분노의 대상 방향을 드러내는 ‘향하여’가 한국어에서 더 자연스럽고 본문 의도를 잘 전달합니다.
- source_word: עַל כָּל הַכְּעָסִים ... הִכְעִיסוֹ
  english_pob_choice: because of all the provocations ... had provoked him
  chosen_korean: 온갖 분노케 하는 일들 때문이었습니다
  alternatives_korean:
  - 온갖 격노하게 한 일들 때문이었습니다
  - 온갖 그분을 노하게 한 일들 때문이었습니다
  - 온갖 도발 때문이었습니다
  lexicon: HALOT
  rationale: כְּעָסִים / הִכְעִיסוֹ의 반복적 어근을 살리기 위해 ‘분노케 하는 일들’로 옮겨, ‘provocations’의 결과적·원인적 의미를 함께 반영했습니다.
- source_word: מְנַשֶּׁה
  english_pob_choice: Manasseh
  chosen_korean: 므낫세
  alternatives_korean:
  - 마나세
  - 므나쎄
  lexicon: 표준 외래어 표기법
  rationale: 한국어 성경에서 널리 통용되는 인명 표기를 따랐습니다.
theological_decisions:
- issue: 하나님의 분노를 인간적 이미지로 표현하는 문제
  chosen_reading: ‘타오르는 분노’와 ‘거두지 않으셨습니다’를 유지해, 본문의 신체적·감정적 은유를 완화하지 않았습니다.
  alternative_readings:
  - 분노를 누그러뜨리지 않으셨습니다
  - 진노를 거두지 않으셨습니다
  rationale: 히브리어는 ‘코의 타오름’이라는 관용구를 사용하므로, 추상화하기보다 원문의 강도를 드러내는 편이 본문 충실성에 부합합니다.
  doctrine_reference: '번역 원칙: source-direct metaphor preservation'
- issue: 야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  rationale: 이 프로젝트의 기본 원칙에 따라 יְהוָה를 학술적 음역인 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
