id: 2KI.23.3
reference: 2 Kings 23:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּעֲמֹ֣ד הַ֠/מֶּלֶךְ עַֽל הָ֨/עַמּ֜וּד וַ/יִּכְרֹ֥ת אֶֽת הַ/בְּרִ֣ית לִ/פְנֵ֣י יְהוָ֗ה לָ/לֶ֜כֶת אַחַ֤ר יְהוָה֙ וְ/לִ/שְׁמֹ֨ר מִצְוֺתָ֜י/ו וְ/אֶת עֵדְוֺתָ֤י/ו וְ/אֶת חֻקֹּתָי/ו֙ בְּ/כָל לֵ֣ב וּ/בְ/כָל נֶ֔פֶשׁ לְ/הָקִ֗ים אֶת דִּבְרֵי֙ הַ/בְּרִ֣ית הַ/זֹּ֔את הַ/כְּתֻבִ֖ים עַל הַ/סֵּ֣פֶר הַ/זֶּ֑ה וַ/יַּעֲמֹ֥ד כָּל הָ/עָ֖ם בַּ/בְּרִֽית־־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/003.yaml
  text: 'Then the king stood by the pillar and made the covenant before Yahweh: to walk after Yahweh[a], and to keep his commandments, his testimonies, and his statutes with all his heart and with all his soul, to carry out the words of this covenant that were written in this book[b]. And all the people entered into the covenant.'
  footnotes:
  - marker: a
    text: Or, 'written in this scroll.' The Hebrew word can refer to a scroll or a book/document.
    reason: cultural_note
  - marker: b
    text: Literally, 'stood in the covenant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 기둥 곁에 서서 야훼 앞에서 언약을 맺어, 야훼를 따르고 그의 명령과 그의 증언과 그의 규례를 온 마음과 온 목숨을 다해 지키며, 이 책[a]에 기록된 이 언약의 말씀을 실행하기로 했습니다. 그리고 모든 백성도 그 언약에 참여했습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 סֵפֶר는 문맥에 따라 ‘책’, ‘두루마리’, ‘기록 문서’를 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 직역하면 ‘모든 백성이 언약 안에 섰다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד ... עַל הָעַמּוּד
  english_pob_choice: stood by the pillar
  chosen_korean: 기둥 곁에 서서
  alternatives_korean:
  - 기둥 위에 서서
  - 기둥에 서서
  lexicon: HALOT
  rationale: עַל은 여기서 물리적으로 ‘위에’라기보다 지정된 왕의 자리 ‘곁/앞’의 위치를 가리킬 수 있으므로, 자연스러운 한국어로 ‘기둥 곁에’가 가장 무리가 적습니다.
- source_word: וַיִּכְרֹת אֶת־הַבְּרִית
  english_pob_choice: made the covenant
  chosen_korean: 언약을 세웠습니다
  alternatives_korean:
  - 언약을 맺었습니다
  - 언약을 만들었습니다
  lexicon: HALOT
  rationale: כרת ברית의 관용구를 한국어에서 가장 자연스럽게 전달하면서도, 단순 체결보다 공적·서약적 행위를 드러내는 표현으로 ‘세우다’를 택했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 임재 앞에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: לִפְנֵי의 직접적 의미를 살려, 언약 체결의 엄숙한 공개성을 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: לָלֶכֶת אַחַר יְהוָה ... וְלִשְׁמֹר מִצְוֺתָיו ...
  english_pob_choice: to walk after Yahweh ... and to keep his commandments ...
  chosen_korean: 야훼를 따라가며 ... 그의 명령과 그의 증거와 그의 규례를 ... 지키고
  alternatives_korean:
  - 야훼 뒤를 따르며
  - 야훼를 따라 살며
  lexicon: HALOT
  rationale: ‘walk after’의 제자도/충성의 방향성을 살리면서도 한국어 문맥에서는 ‘따라가다’가 가장 직접적입니다. 이어지는 삼중 법률 용어는 구분을 유지해 옮겼습니다.
- source_word: בְּכָל לֵב וּבְכָל נֶפֶשׁ
  english_pob_choice: with all his heart and with all his soul
  chosen_korean: 온 마음과 온 목숨을 다해
  alternatives_korean:
  - 온 마음과 온 영혼을 다해
  - 온 마음과 온 생명을 다해
  lexicon: HALOT
  rationale: 관용적 언약 공식이지만, נֶפֶשׁ는 한국어 성경 전통의 ‘목숨’이 몸과 삶 전체의 헌신을 더 직접적으로 드러내므로 이를 택했습니다.
- source_word: לְהָקִים אֶת דִּבְרֵי הַבְּרִית
  english_pob_choice: to carry out the words of this covenant
  chosen_korean: 이 언약의 말씀을 실행하기로 한 것입니다
  alternatives_korean:
  - 이 언약의 말씀을 이루기로 한 것입니다
  - 이 언약의 말씀을 세우기로 한 것입니다
  lexicon: HALOT
  rationale: לְהָקִים은 여기서 ‘확립하다’보다 실제로 이행·실천하다의 뜻이 강하므로, 현대 한국어에서 의미가 분명한 ‘실행하다’를 선택했습니다.
- source_word: וַיַּעֲמֹד כָּל הָעָם בַּבְּרִית
  english_pob_choice: And all the people entered into the covenant
  chosen_korean: 모든 백성은 언약에 서 있었습니다
  alternatives_korean:
  - 모든 백성은 언약 안에 서 있었습니다
  - 모든 백성은 언약에 들어섰습니다
  lexicon: HALOT
  rationale: 직역은 ‘언약 안에 서다’이지만, 한국어에서는 ‘서 있다’가 언약에 대한 공개적 동의와 서약의 뉘앙스를 더 자연스럽게 보존합니다.
theological_decisions:
- issue: YHWH의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 사용하므로, 인명적·언약적 신명성을 보존하는 프로젝트 기본값을 따랐습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: ‘언약에 서 있다’의 관용구 처리
  chosen_reading: 모든 백성은 언약에 서 있었습니다
  alternative_readings:
  - 모든 백성은 언약을 맺었습니다
  - 모든 백성은 언약에 들어갔습니다
  rationale: 히브리어의 직설적 관용구를 완전히 평탄화하지 않고, 공동체적 서약·확약의 장면이라는 신학적 긴장을 보존했습니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §3, §6
