revisions:
- from: 그때 왕이 기둥 곁에 서서 야훼 앞에서 언약을 세웠습니다. 곧 야훼를 따라가며, 그의 명령과 그의 증거와 그의 규례를 온 마음과 온 목숨을 다해 지키고, 이 책에 기록된 이 언약의 말씀을 실행하기로 한 것입니다. 그리고 모든 백성은 언약에 서 있었습니다.[a][b]
  to: 그때 왕은 기둥 곁에 서서 야훼 앞에서 언약을 맺어, 야훼를 따르고 그의 명령과 그의 증언과 그의 규례를 온 마음과 온 목숨을 다해 지키며, 이 책[a]에 기록된 이 언약의 말씀을 실행하기로 했습니다. 그리고 모든 백성도 그 언약에 참여했습니다.[b]
  rationale: 왕의 언약 행위와 그 언약의 내용을 하나의 자연스러운 합쇼체 문장으로 연결했습니다. 마지막 관용구는 한국어 본문에서 ‘그 언약에 참여했습니다’로 명료하게 옮기고, ‘언약 안에 섰다’라는 직역은 각주에서 보존했습니다. 책/두루마리 각주의 앵커도 해당 명사 뒤로 옮겼습니다.
