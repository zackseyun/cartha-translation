  rationale: 열왕기의 정형적 인명 소개 문구를 살리되, 문장 흐름은 현대 한국어로 자연스럽게 다듬었습니다.
- source_word: בַּת יִרְמְיָהוּ מִלִּבְנָה
  english_pob_choice: daughter of Jeremiah of Libnah
  chosen_korean: 립나 출신 예레미야의 딸
  alternatives_korean:
  - 립나 사람 예레미야의 딸
  - 립나의 예레미야의 딸
  lexicon: HALOT
  rationale: מִן의 출신/연고 의미를 '출신'으로 풀어 혈연과 지리적 소속을 함께 드러냈습니다.
