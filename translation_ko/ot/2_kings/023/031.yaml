  text: Jehoahaz was twenty-three years old when he began to reign, and he reigned three months in Jerusalem. His mother’s name was Hamutal daughter of Jeremiah of Libnah.
translation:
  language: ko
  text: 여호아하스는 스물셋 살에 왕이 되어 예루살렘에서 석 달 동안 다스렸습니다. 그의 어머니의 이름은 함우달이었으니, 립나 출신 예레미야의 딸이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  english_pob_choice: was twenty-three years old
  chosen_korean: 스물셋 살에
