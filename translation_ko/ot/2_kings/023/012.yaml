base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/012.yaml
  text: As for the altars on the roof of the upper chamber of Ahaz[a], which the kings of Judah had made, and the altars that Manasseh had made in the two courts of the house of Yahweh, the king tore them down, smashed them there[b], and threw their dust into the Kidron Valley.
  footnotes:
  - marker: a
    text: Or 'upper room of Ahaz.' The Hebrew עֲלִיָּה can refer to an upper chamber or upper room.
    reason: lexical_alternative
  - marker: b
    text: Or 'the brook Kidron.' Hebrew נַחַל can denote a streambed, ravine, or valley.
    reason: lexical_alternative
translation:
  language: ko
  text: 아하스의 위층 방[a] 지붕 위에 있는 제단들, 곧 유다 왕들이 만든 제단들과 야훼의 집 두 뜰에 므낫세가 만든 제단들을 왕이 헐어 버리고 그 자리에서 부수어, 그 가루를 기드론 골짜기에 던졌습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아하스의 윗방’. 히브리어 עֲלִיָּה는 위층 방이나 윗방을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘기드론 시내’. 히브리어 נַחַל은 시내, 협곡, 골짜기를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּזְבְּחוֹת
  english_pob_choice: the altars
  chosen_korean: 제단들
  alternatives_korean:
