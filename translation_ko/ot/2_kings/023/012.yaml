  rationale: מִזְבֵּחַ는 기본적으로 ‘제단’이므로 복수형을 살려 ‘제단들’로 옮겼습니다.
- source_word: עַל הַגָּג עֲלִיַּת אָחָז
  english_pob_choice: on the roof of the upper chamber of Ahaz
  chosen_korean: 아하스의 위층 방 지붕 위
  alternatives_korean:
  - 아하스의 윗방 지붕 위
  - 아하스의 위층 지붕 위
  lexicon: HALOT
  rationale: עֲלִיָּה는 ‘위층 방/윗방’으로 읽을 수 있어, 건축적 의미를 살리면서도 자연스러운 한국어인 ‘위층 방’으로 옮겼습니다.
- source_word: בִּשְׁתֵּי חַצְרֹות בֵּית יְהוָה
  english_pob_choice: in the two courts of the house of Yahweh
  chosen_korean: 야훼의 집 두 뜰
  alternatives_korean:
  - 야훼의 집 두 마당
  - 야훼의 집 두 마당 안
  lexicon: HALOT
  rationale: חָצֵר는 성전 문맥에서 ‘뜰’이 가장 직접적이며, בֵּית יְהוָה는 영어 POB처럼 ‘야훼의 집’으로 유지했습니다.
- source_word: נָתַץ / וַיָּרָץ / הִשְׁלִיךְ
  english_pob_choice: tore them down, smashed them there, and threw their dust
  chosen_korean: 헐어 버리고, 그 자리에서 부수어 그 가루를 던졌습니다
  alternatives_korean:
  - 무너뜨리고, 그 자리에서 깨뜨려 그 가루를 던졌습니다
  - 헐어 버리고, 그 자리에서 산산조각 내어 그 가루를 던졌습니다
  lexicon: HALOT
  rationale: נָתַץ는 구조물을 ‘헐다/무너뜨리다’가 자연스럽고, 이어지는 동작은 파괴의 강도를 살려 ‘부수어’로 옮겼습니다. עֲפָרָם은 ‘그들의 가루/먼지’로 읽을 수 있으나, 문맥상 파쇄된 잔해를 가리켜 ‘그 가루’로 간결하게 처리했습니다.
