id: 2KI.23.30
reference: 2 Kings 23:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּרְכִּבֻ֨/הוּ עֲבָדָ֥י/ו מֵת֙ מִ/מְּגִדּ֔וֹ וַ/יְבִאֻ֨/הוּ֙ יְר֣וּשָׁלִַ֔ם וַֽ/יִּקְבְּרֻ֖/הוּ בִּ/קְבֻֽרָת֑/וֹ וַ/יִּקַּ֣ח עַם הָ/אָ֗רֶץ אֶת יְהֽוֹאָחָז֙ בֶּן יֹ֣אשִׁיָּ֔הוּ וַ/יִּמְשְׁח֥וּ אֹת֛/וֹ וַ/יַּמְלִ֥יכוּ אֹת֖/וֹ תַּ֥חַת אָבִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/030.yaml
  text: His servants carried him dead from Megiddo and brought him to Jerusalem[a], and they buried him in his tomb. Then the people of the land took Jehoahaz the son of Josiah, anointed him[b], and made him king in place of his father.
  footnotes:
  - marker: a
    text: Or 'made him ride'; the Hebrew verb is literally 'caused him to ride,' here referring to transporting Josiah's body.
    reason: lexical_alternative
  - marker: b
    text: '''The people of the land'' is a formal Hebrew expression for the local populace acting as a political body.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 신하들이 그의 시신을 므깃도에서 실어[b] 예루살렘으로 데려가 그의 묘소에 장사하였습니다. 그 땅의 백성[a]은 요시야의 아들 여호아하스를 데려다가 그에게 기름을 부어 그의 아버지를 대신하여 왕으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 땅의 백성’은 히브리어의 고정된 사회·정치적 표현입니다. 문맥에서는 하나의 정치적 집단으로 행동하는 주민들을 가리킬 수 있습니다.
    reason: cultural_note
  - marker: b
    text: 여기서 ‘실어’로 옮긴 히브리어 동사는 문자적으로 ‘타게 하다’에 가깝습니다. 이 문맥에서는 요시야의 시신을 운구한 것을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּבֻהוּ ... מֵת מִמְּגִדּוֹ
  english_pob_choice: carried him dead from Megiddo
  chosen_korean: 그의 시체를 므깃도에서 데려와
  alternatives_korean:
  - 죽은 채로 므깃도에서 데려와
  - 시체를 메고 므깃도에서 옮겨
  lexicon: HALOT
  rationale: 히필 동사 רכב은 문자적으로 ‘타게 하다’이지만, 여기서는 이미 죽은 요시야의 시신 운구를 가리키므로 한국어에서는 자연스럽게 ‘시체를 ... 데려와/옮겨’로 옮기는 것이 원문 의미를 가장 분명하게 드러냅니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들이
  alternatives_korean:
  - 그의 종들이
  - 그의 시종들이
  lexicon: HALOT
  rationale: 왕실 문맥에서 עבד는 단순한 하인보다 왕을 수행하는 신하/시종의 뜻이 자연스러우므로, 한국어에서는 군주 관련 서술에 맞는 ‘신하들’로 옮겼습니다.
- source_word: בִּקְבֻרָתוֹ
  english_pob_choice: in his tomb
  chosen_korean: 자기 묘실에
  alternatives_korean:
  - 그의 무덤에
  - 그의 묘에
  lexicon: HALOT
  rationale: 왕의 매장 문맥에서 קבורה는 단순한 ‘무덤’보다 묘실/묘소의 뜻이 더 잘 드러나므로, 장례·왕실 맥락을 살려 ‘묘실’로 옮겼습니다.
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 백성
  lexicon: HALOT
  rationale: 이 표현은 단순한 지리적 ‘땅의 사람들’이 아니라 정치적 주체로서의 지역 민중을 가리키는 고정 표현이므로, 직역을 유지하되 한국어로는 자연스러운 ‘그 땅의 백성’으로 옮겼습니다.
- source_word: וַיִּמְשְׁחוּ אֹתוֹ
  english_pob_choice: anointed him
  chosen_korean: 그에게 기름을 부어
  alternatives_korean:
  - 그를 기름부어
  - 그를 관유로 세워
  lexicon: HALOT
  rationale: משׁח의 왕위 즉위 의례를 그대로 드러내기 위해, 한국어 성경 전통과도 맞는 ‘기름을 부어’로 옮겼습니다.
theological_decisions:
- issue: 왕위 계승의 정당화 방식
  chosen_reading: 기름을 붓는 행위와 왕으로 세우는 행위를 둘 다 분명히 살려, 지역 백성이 새 왕을 공적으로 즉위시키는 장면으로 제시했습니다.
  alternative_readings:
  - 그를 세워 왕으로 삼았습니다
  - 그를 임금으로 삼았습니다
  rationale: 원문은 단순한 정치적 선택이 아니라 기름 부음과 즉위 선언을 함께 제시하므로, 둘을 분리해 번역해야 왕권 부여의 종교적·공적 성격이 보존됩니다.
  doctrine_reference: 왕권 서술의 성례적/공적 성격
