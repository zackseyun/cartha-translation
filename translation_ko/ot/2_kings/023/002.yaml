base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''all the men of Judah.'' The expression may function representatively for the populace, but the masculine wording is retained in translation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the least to the greatest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕은 야훼의 집[b]으로 올라갔습니다. 유다의 모든 남자[a]와 예루살렘의 모든 주민, 제사장들과 예언자들, 곧 작은 자부터 큰 자까지[c] 모든 백성이 그와 함께 올라갔습니다. 그는 그들이 듣는 가운데 야훼의 집에서 발견된 언약의 책의 모든 말씀을 읽었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘유다의 모든 남자’입니다. 이 표현은 대표적 집합 표현으로 기능할 수 있으나, 번역에서는 남성형을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 집’입니다. 문맥상 ‘성전’으로도 옮길 수 있지만, 여기서는 원문의 표현을 보존했습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘작은 자부터 큰 자까지’는 모든 계층을 아우르는 관용적 표현입니다.
    reason: lexical_alternative
