  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘귀에’로 직역하되, 한국어 문맥상 자연스럽게 읽히도록 ‘읽었습니다’와 결합했습니다.
- source_word: סֵפֶר הַבְּרִית
