base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/002.yaml
  text: Then the king went up to the house of Yahweh[a], and with him all the men of Judah and all the inhabitants of Jerusalem, and the priests and the prophets, all the people from small to great[c][b]; and he read in their hearing all the words of the Book of the Covenant that had been found in the house of Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''all the men of Judah.'' The expression may function representatively for the populace, but the masculine wording is retained in translation.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
  - marker: c
    text: Or 'from the least to the greatest.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 야훼의 집으로 올라갔습니다. 그와 함께 유다의 모든 남자와 예루살렘의 모든 주민, 제사장들과 예언자들, 작은 자부터 큰 자까지 모든 백성이 있었으며, 그는 그들의 귀에 야훼의 집에서 발견된 언약 책의 모든 말씀을 읽었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘유다의 모든 남자’입니다. 이 표현은 대표적 집합 표현으로 기능할 수 있으나, 번역에서는 남성형을 유지했습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘야훼의 집’입니다. 문맥상 ‘성전’으로도 옮길 수 있지만, 여기서는 원문의 표현을 보존했습니다.
    reason: lexical_alternative
  - marker: c
    text: 관용적으로 ‘가장 작은 자부터 가장 큰 자까지’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라갔습니다
  alternatives_korean:
  - 갔습니다
  - 올랐습니다
  lexicon: HALOT
  rationale: עלה의 기본 방향성인 ‘위로 올라가다’를 살려, 성전 산으로의 이동과 연결되는 지리적 뉘앙스를 보존했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집(성전)
  lexicon: HALOT
  rationale: 히브리어 직역 구조인 ‘집’을 유지해 원문 표현을 살리고, 필요 이상의 해석어인 ‘성전’은 본문 안에서는 보류했습니다.
- source_word: כָל אִישׁ יְהוּדָה
  english_pob_choice: all the men of Judah
  chosen_korean: 유다의 모든 남자
  alternatives_korean:
  - 유다의 모든 사람
  - 유다의 모든 백성
  lexicon: HALOT
  rationale: אִישׁ의 남성형과 대표성을 살려 ‘남자’로 옮겼으며, 영어 POB가 유지한 성별-정확성을 반영했습니다.
- source_word: לְמִקָּטֹן וְעַד גָּדוֹל
  english_pob_choice: from small to great
  chosen_korean: 작은 자부터 큰 자까지
  alternatives_korean:
  - 가장 작은 자부터 가장 큰 자까지
  - 가장 낮은 자부터 가장 높은 자까지
  lexicon: HALOT
  rationale: 관용구의 사회적 범위를 자연스러운 한국어로 옮기되, ‘least/greatest’처럼 해석을 덧씌우지 않고 원문의 대비를 유지했습니다.
- source_word: בְאָזְנֵיהֶם
  english_pob_choice: in their hearing
  chosen_korean: 그들의 귀에
  alternatives_korean:
  - 그들이 듣는 데
  - 그들의 들음 가운데
  lexicon: HALOT
  rationale: 히브리어 관용구를 살려 ‘귀에’로 직역하되, 한국어 문맥상 자연스럽게 읽히도록 ‘읽었습니다’와 결합했습니다.
- source_word: סֵפֶר הַבְּרִית
  english_pob_choice: the Book of the Covenant
  chosen_korean: 언약 책
  alternatives_korean:
  - 언약의 책
  - 계약 책
  lexicon: HALOT
  rationale: POB의 제목형 표현을 반영하면서도, 히브리어의 명사 결합을 살려 ‘언약 책’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 야훼의 집의 표기
  chosen_reading: ‘야훼의 집’으로 직접 옮겼습니다.
  alternative_readings:
  - ‘여호와의 집’
  - ‘야훼의 성전’
  rationale: 본문의 יְהוָה를 프로젝트 기본값대로 ‘야훼’로 옮기고, 본문의 표현인 ‘집’도 유지해 사제적/성전적 의미를 과도하게 해석하지 않았습니다.
  doctrine_reference: 'POB contested terms: יְהוָה → 야훼'
- issue: 유다의 모든 남자
  chosen_reading: 남성형 집합 표현을 유지했습니다.
  alternative_readings:
  - ‘유다의 모든 사람’
  - ‘유다의 모든 백성’
  rationale: 히브리어 אִישׁ의 성별 표지를 지우지 않고, 영어 POB의 의도처럼 대표적 남성 집합 표현을 보존했습니다.
  doctrine_reference: POB gender-accurate translation policy
