source:
  edition: WLC
  text: וְ/הַ/כֶּ֣סֶף וְ/הַ/זָּהָ֗ב נָתַ֤ן יְהוֹיָקִים֙ לְ/פַרְעֹ֔ה אַ֚ךְ הֶעֱרִ֣יךְ אֶת הָ/אָ֔רֶץ לָ/תֵ֥ת אֶת הַ/כֶּ֖סֶף עַל פִּ֣י פַרְעֹ֑ה אִ֣ישׁ כְּ/עֶרְכּ֗/וֹ נָגַ֞שׂ אֶת הַ/כֶּ֤סֶף וְ/אֶת הַ/זָּהָב֙ אֶת עַ֣ם הָ/אָ֔רֶץ לָ/תֵ֖ת לְ/פַרְעֹ֥ה נְכֹֽה־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/035.yaml
  text: And Jehoiakim gave the silver and the gold to Pharaoh, but he taxed the land to give the silver according to Pharaoh’s command. He exacted the silver and the gold from the people of the land, each according to his valuation, to give it to Pharaoh Neco.
  footnotes:
  - marker: a
    text: Or 'assessed the land' or 'levied the land.' The Hebrew verb can denote imposing an assessment for payment.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'according to the mouth of Pharaoh,' that is, according to Pharaoh’s command.
    reason: lexical_alternative
  - marker: c
    text: Or 'each according to his assessment' or, more interpretively, 'each according to his means.'
    reason: lexical_alternative
  - marker: d
    text: '''Neco'' is also commonly spelled ''Necho'' in English translations.'
    reason: alternative_reading
translation:
  language: ko
  text: 예호야김은 은과 금을 파라오에게 주었습니다. 그러나 그는 파라오의 명령에 따라 은을 내놓게 하려고 그 땅에 세금을 매겼습니다. 그는 그 땅의 백성에게서, 각 사람의 평가에 따라 은과 금을 거두어 파라오 느고에게 주게 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 땅에 세금을 매겼습니다’는 동사의 행정적·재정적 의미를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘각 사람의 평가에 따라’는 문자적으로는 ‘각자 자신의 값/평가에 따라’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַכֶּסֶף וְהַזָּהָב
  english_pob_choice: the silver and the gold
  chosen_korean: 은과 금
  alternatives_korean:
  - 은전과 금
  - 돈과 금
  lexicon: HALOT
  rationale: 히브리어는 귀금속 자체를 가리키므로, 구체성을 살려 ‘은과 금’으로 옮겼습니다. 여기서는 화폐 일반보다 공물의 성격이 앞섭니다.
- source_word: הֶעֱרִיךְ אֶת הָאָרֶץ
  english_pob_choice: taxed/assessed the land
  chosen_korean: 그 땅에 세금을 매겼습니다
  alternatives_korean:
  - 그 땅을 평가했습니다
  - 그 땅을 징세했습니다
  lexicon: HALOT
  rationale: 동사의 핵심은 토지에 대한 부과·평가입니다. 한국어에서는 행정적·재정적 의미가 분명한 ‘세금을 매기다’가 자연스럽고, ‘평가하다’만으로는 납부 강제가 약해집니다.
- source_word: עַל פִּי פַרְעֹה
  english_pob_choice: according to Pharaoh’s command
  chosen_korean: 파라오의 명령에 따라
  alternatives_korean:
  - 파라오의 입에 따라
  - 파라오의 말대로
  lexicon: HALOT
  rationale: 직역하면 ‘입에 따라’이지만, 관용구의 뜻은 명령·지시에 따름입니다. 현대 한국어에서는 그 의미를 분명히 드러내는 표현이 필요합니다.
- source_word: אִישׁ כְּעֶרְכּוֹ
  english_pob_choice: each according to his valuation
  chosen_korean: 각 사람의 평가에 따라
  alternatives_korean:
  - 각 사람의 액수에 따라
  - 각 사람의 형편에 따라
  lexicon: HALOT
  rationale: 같은 어근의 명사적 뉘앙스를 살리면서, 사람마다 매겨진 평가액이라는 의미를 유지했습니다. ‘형편에 따라’는 해석이 더 앞서는 표현입니다.
- source_word: פַרְעֹה נְכֹה
  english_pob_choice: Pharaoh Neco
  chosen_korean: 파라오 느고
  alternatives_korean:
  - 파라오 네고
  - 파라오 느호
  lexicon: standard transliteration
  rationale: 고유명사는 현대 음역에 맞추어 옮겼고, 영어 관례상 ‘Neco/Necho’로도 전해지는 인명을 한국어에서는 ‘느고’로 처리했습니다.
theological_decisions:
- issue: עַם הָאָרֶץ의 사회적 뉘앙스
  chosen_reading: 그 땅의 백성
  alternative_readings:
  - 그 땅의 사람들
  - 토지의 주민들
  rationale: 여기서는 사회계층 용어로 과도하게 규정하기보다, 본문의 직접적인 집단 표지를 살리는 쪽이 안전합니다.
  doctrine_reference: 본문 직접의 역사서술; 사회적 함의는 과잉 주석하지 않음
