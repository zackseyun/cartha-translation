    issue: ‘파라오 느고에게 주게 했습니다’
    rationale: 원문의 목적 부정사 לָתֵת는 예호야김이 공물을 바치기 위하여 백성에게서 은과 금을 징수한 목적을 나타냅니다. 현 번역은 백성 또는 불특정 대리인에게 파라오에게 주도록 시킨 것으로 의미가 바뀔 수 있습니다.
