revisions:
- from: 예호야김은 은과 금을 파라오에게 주었습니다. 그러나 그는 파라오의 명령에 따라 은을 내놓게 하려고 그 땅에 세금을 매겼습니다. 그는 그 땅의 백성에게서, 각 사람의 평가에 따라 은과 금을 거두어 파라오 느고에게 주게 했습니다.[a][b]
  to: 예호야김은 은과 금을 파라오에게 주었습니다. 그러나 그는 파라오의 명령에 따라 은을 바치기 위해 그 땅에 세금을 매겼습니다.[a] 그는 그 땅의 백성에게서 각 사람에게 매겨진 평가액에 따라 은과 금을 거두어 파라오 느고에게 주었습니다.[b]
  rationale: 후반부 목적절의 주체와 행위를 원문에 맞게 복원하여, 예호야김 자신이 파라오 느고에게 바치기 위해 백성에게서 은과 금을 거두었다는 뜻을 분명히 했습니다. 개인별 산정의 의미도 ‘평가액’으로 자연스럽고 정확하게 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T15:07:41Z'
review_pass:
  verdict: revise
  source_fidelity: 마지막 절의 ‘주게 했습니다’는 예호야김이 백성에게 파라오에게 바치게 했다는 사역 의미로 읽히기 쉽습니다. 히브리어 לָתֵת는 예호야김이 은과 금을 거두어 파라오 느고에게 바치려는 목적을 나타냅니다. 이를 ‘주기 위해 … 거두었습니다’로 바로잡는 것이 필요합니다. 또한 אִישׁ כְּעֶרְכּוֹ는 개인별로 산정된 액수/평가에 따른다는 뜻이므로, ‘각 사람에게 매겨진 평가액에 따라’가 한국어에서 더 정확합니다.
  naturalness: 합쇼체는 일관되고, ‘세금을 매겼습니다’와 ‘거두었습니다’는 현대 한국어에서 자연스럽습니다. 목적 표현은 ‘은을 내놓게 하려고’보다 ‘은을 바치기 위해’가 문맥상 더 직접적이며, 후반부는 ‘거두었습니다’로 마무리해야 자연스럽습니다.
  terminology: ‘예호야김’, ‘파라오’, ‘느고’, ‘은과 금’, ‘그 땅의 백성’은 적절합니다. ‘그 땅에 세금을 매겼습니다’는 הֶעֱרִיךְ의 재정적 부과 의미를 안전하게 전달합니다. ‘평가’는 사람 자체의 가치 평가처럼 들릴 수 있으므로 ‘평가액’으로 구체화합니다.
  issues:
