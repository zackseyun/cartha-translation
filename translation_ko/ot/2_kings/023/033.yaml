id: 2KI.23.33
reference: 2 Kings 23:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּאַסְרֵ/הוּ֩ פַרְעֹ֨ה נְכֹ֤ה בְ/רִבְלָה֙ בְּ/אֶ֣רֶץ חֲמָ֔ת ב/מלך בִּ/ירוּשָׁלִָ֑ם וַ/יִּתֶּן עֹ֨נֶשׁ֙ עַל הָ/אָ֔רֶץ מֵאָ֥ה כִכַּר כֶּ֖סֶף וְ/כִכַּ֥ר זָהָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/033.yaml
  text: And Pharaoh Neco imprisoned him at Riblah in the land of Hamath[a], so that he might not reign in Jerusalem[c][b]; and he imposed on the land a tribute of a hundred talents of silver and a talent of gold.
  footnotes:
  - marker: a
    text: Or 'bound him' or 'confined him.'
    reason: lexical_alternative
  - marker: b
    text: The Hebrew expression may be rendered 'so that he might not reign in Jerusalem' or 'from reigning in Jerusalem.'
    reason: alternative_reading
  - marker: c
    text: Or 'a penalty' or 'a fine' instead of 'a tribute.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 파라오 느고는 하맛 땅의 립나에서 그를 가두어 예루살렘에서 왕 노릇하지 못하게 하였고[a][b], 그 땅에 은 백 달란트와 금 한 달란트의 조공을 부과했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘묶어’ 혹은 ‘가둬 두어’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 표현은 ‘예루살렘에서 왕 노릇하지 못하게’ 또는 ‘예루살렘에서 다스리지 못하게’로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘벌금’이나 ‘형벌’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאַסְרֵהוּ
  english_pob_choice: imprisoned him
  chosen_korean: 그를 가두어
  alternatives_korean:
  - 그를 묶어
  - 그를 감금하여
  lexicon: HALOT
  rationale: אסר의 핵심 의미는 ‘매다/묶다’이지만, 왕권을 박탈하려는 정치적 구금 문맥에서는 ‘가두다’가 영어 POB의 ‘imprisoned’와 같이 결과를 가장 분명하게 드러냅니다.
- source_word: בְּרִבְלָה בְּאֶרֶץ חֲמָת
  english_pob_choice: at Riblah in the land of Hamath
  chosen_korean: 하맛 땅의 립나에서
  alternatives_korean:
  - 립나에서
  - 하맛 지역의 립나에서
  lexicon: HALOT
  rationale: 장소 표시는 한국어에서도 자연스럽게 ‘~의 ~에서’로 옮겨 위치 관계를 분명히 했습니다.
- source_word: בִּירוּשָׁלָם
  english_pob_choice: in Jerusalem
  chosen_korean: 예루살렘에서 왕 노릇하지 못하게
  alternatives_korean:
  - 예루살렘에서 다스리지 못하게
  - 예루살렘에서 통치하지 못하게
  lexicon: HALOT
  rationale: ב־למֶלֶךְ는 결과/방지의 뜻을 띠므로 단순한 위치가 아니라 ‘왕 노릇하지 못하게’로 옮겨 왕권 박탈의 목적을 살렸습니다.
- source_word: עֹנֶשׁ
  english_pob_choice: a tribute
  chosen_korean: 조공
  alternatives_korean:
  - 벌금
  - 형벌
  lexicon: HALOT
  rationale: 금과 은으로 정해진 강제 납부이므로, 영어 POB의 ‘tribute’를 따라 정치적 부담금인 ‘조공’이 가장 자연스럽습니다.
theological_decisions:
- issue: ב־למֶלֶךְ 구문의 의미
  chosen_reading: 느고가 요시야의 아들을 묶은 목적은 예루살렘에서 계속 왕으로 활동하지 못하게 하는 데 있었습니다.
  alternative_readings:
  - 단순히 그가 예루살렘에 있을 때 그를 가두었다는 시간적 진술
  - 그가 예루살렘에서 왕이 된 이후에 그를 가두었다는 진술
  rationale: 본문의 문맥과 영어 POB의 주석대로 이 구문은 시간표시보다 방지/결과를 나타내므로, 왕권 차단의 의미를 본문에 반영해야 합니다.
  doctrine_reference: 주해적 문법 결정
