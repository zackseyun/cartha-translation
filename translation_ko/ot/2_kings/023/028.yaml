  lexicon: HALOT
  rationale: עשה는 여기서 왕의 총체적 행위를 가리키므로, 직역적이면서도 자연한 ‘행한 모든 일’로 옮겼습니다.
- source_word: הֲלֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 쓰여 있지 않습니까
  - 적혀 있지 않습니까
  lexicon: HALOT
  rationale: כותב의 수동분사는 문자적으로 ‘쓰이다’이지만, 연대기적 자료를 가리키는 관용구에서는 ‘기록되어 있다’가 가장 자연스럽고 문맥도 잘 살립니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 역대기 책
  alternatives_korean:
  - 역대기 책
  - 연대기 책
  - 역사 기록 책
  lexicon: HALOT
  rationale: Kings에서 인용되는 왕실 문서 명칭을 가리키므로, 교회적 전통서명과 구별되게 하면서도 관용적으로 이해 가능한 ‘역대기 책’으로 옮겼습니다.
- source_word: לְמַלְכֵי יְהוּדָה
  english_pob_choice: of the Kings of Judah
  chosen_korean: 유다 왕들의
  alternatives_korean:
  - 유다 왕들의
  - 유다 왕들에 관한
  - 유다 왕들의 것
  lexicon: HALOT
  rationale: 문서 제목의 소유/소속 관계를 자연스럽게 드러내기 위해 ‘유다 왕들의’로 처리했습니다.
