  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י יֹאשִׁיָּ֖הוּ וְ/כָל אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/028.yaml
  text: Now the rest of the acts of Josiah[a], and all that he did[b], are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'recorded' for 'written'; the Hebrew passive participle means 'written,' but in this archival context it can also be understood as 'recorded.'
    reason: lexical_alternative
  - marker: b
    text: '''Book of the Chronicles'' refers to a royal record source cited in Kings, not necessarily the biblical books of 1–2 Chronicles in their final canonical form.'
    reason: cross_reference
translation:
  language: ko
  text: 요시야의 남은 업적과 그가 행한 모든 일은 유다 왕들의 역대기 책에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘기록되어’는 히브리어 수동분사의 문맥적 뜻을 살린 번역입니다. 문자적으로는 ‘쓰여 있다’이지만, 왕실 문서 인용 공식에서는 ‘기록되다’가 더 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘역대기 책’은 열왕기가 가리키는 왕실 연대기 문서로 이해할 수 있으며, 반드시 정경의 1–2역대기를 뜻하는 것은 아닙니다.
    reason: cross_reference
lexical_decisions:
- source_word: יֶתֶר דִּבְרֵי
  english_pob_choice: the rest of the acts
  chosen_korean: 남은 업적
  alternatives_korean:
  - 남은 일들
  - 그 나머지 행적
  - 남은 행적
  lexicon: HALOT
  rationale: 왕의 결론부 요약 공식에서 יֶתֶר דִּבְרֵי 는 단순한 ‘말들’이 아니라 남은 행적/업적을 가리키므로, 문맥에 맞는 역사 서술체로 ‘남은 업적’이라 옮겼습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 행한 모든 일
  alternatives_korean:
  - 그가 한 모든 것
  - 그가 이룬 모든 일
  - 그가 행한 모든 것
  lexicon: HALOT
  rationale: עשה는 여기서 왕의 총체적 행위를 가리키므로, 직역적이면서도 자연한 ‘행한 모든 일’로 옮겼습니다.
- source_word: הֲלֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 쓰여 있지 않습니까
  - 적혀 있지 않습니까
  lexicon: HALOT
  rationale: כותב의 수동분사는 문자적으로 ‘쓰이다’이지만, 연대기적 자료를 가리키는 관용구에서는 ‘기록되어 있다’가 가장 자연스럽고 문맥도 잘 살립니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים
  english_pob_choice: the Book of the Chronicles
  chosen_korean: 역대기 책
  alternatives_korean:
  - 역대기 책
  - 연대기 책
  - 역사 기록 책
  lexicon: HALOT
  rationale: Kings에서 인용되는 왕실 문서 명칭을 가리키므로, 교회적 전통서명과 구별되게 하면서도 관용적으로 이해 가능한 ‘역대기 책’으로 옮겼습니다.
- source_word: לְמַלְכֵי יְהוּדָה
  english_pob_choice: of the Kings of Judah
  chosen_korean: 유다 왕들의
  alternatives_korean:
  - 유다 왕들의
  - 유다 왕들에 관한
  - 유다 왕들의 것
  lexicon: HALOT
  rationale: 문서 제목의 소유/소속 관계를 자연스럽게 드러내기 위해 ‘유다 왕들의’로 처리했습니다.
theological_decisions:
- issue: 수사적 질문의 처리
  chosen_reading: 긍정적 대답을 기대하는 수사 의문형으로 옮겼습니다.
  alternative_readings:
  - 단정문으로 옮길 수 있음
  - 평서문+부가 의문으로 처리할 수 있음
  rationale: הֲלֹא는 단순 정보 질문이 아니라 독자의 동의를 이끄는 수사 의문이므로, 한국어에서도 그 힘을 유지하는 의문형이 적절합니다.
  doctrine_reference: 본문의 서술 기능과 역사서 문체에 관한 번역 원칙
