  yaml_path: translation/ot/2_kings/023/037.yaml
  text: And he did what was evil in the sight of Yahweh[a], according to all that his fathers had done.
  footnotes:
  - marker: a
    text: Or 'his ancestors' or 'his forefathers.' The Hebrew literally reads 'his fathers.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 눈에 악한 일을 행하였으며, 자기 조상들이 한 모든 것과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기 조상들’은 히브리어의 문자적 표현 ‘그의 아버지들’을 왕정 문맥에 맞게 풀어 옮긴 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: And he did
  chosen_korean: 그는 ... 행하였으며
  alternatives_korean:
  - 그는 ... 하였으며
  - 그리고 그는 ... 하였습니다
  lexicon: HALOT
  rationale: 히브리어 서술 연쇄의 진행성을 살리되, 한국어에서는 자연스러운 종결 연결로 옮겼습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 나쁜 일
  lexicon: HALOT
  rationale: עשה הרע의 평가 공식을 한국어에서는 관용적으로 ‘악한 일’로 옮기는 편이 직역성과 가독성을 함께 살립니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: ‘눈에’는 원문의 비유를 직접 반영하며, 평가의 기준이 야훼라는 점을 선명하게 드러냅니다.
- source_word: אֲבֹתָיו
  english_pob_choice: his fathers
  chosen_korean: 자기 조상들
  alternatives_korean:
  - 그의 아버지들
  - 그의 선조들
  lexicon: HALOT
  rationale: 왕정 문맥에서 ‘his fathers’는 직계 부친보다 선대 전체를 가리키므로, 한국어로는 의미를 분명히 하는 ‘조상들’이 적절합니다.
theological_decisions:
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본절은 신명기를 대체하는 칭호가 아니라 언약적 고유명사 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
