  text: וַ/יֹּצֵ֣א אֶת הָ/אֲשֵׁרָה֩ מִ/בֵּ֨ית יְהוָ֜ה מִ/ח֤וּץ לִ/ירוּשָׁלִַ֨ם֙ אֶל נַ֣חַל קִדְר֔וֹן וַ/יִּשְׂרֹ֥ף אֹתָ֛/הּ בְּ/נַ֥חַל קִדְר֖וֹן וַ/יָּ֣דֶק לְ/עָפָ֑ר וַ/יַּשְׁלֵךְ֙ אֶת עֲפָרָ֔/הּ עַל קֶ֖בֶר בְּנֵ֥י הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/006.yaml
  text: He brought the Asherah out from the house of Yahweh[a], outside Jerusalem, to the Kidron Valley, and burned it in the Kidron Valley, and beat it to dust, and threw its dust on the graves of the common people.
  footnotes:
  - marker: a
    text: Or 'the Asherah pole' or 'the Asherah image.' The Hebrew term can refer to the Canaanite goddess Asherah or to the cult object associated with her worship; here it denotes the object removed and destroyed.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 집에서 아세라[a]를 예루살렘 밖 기드론 골짜기로 끌어내어, 기드론 골짜기에서 그것을 불사르고, 그것을 잘게 부숴 가루로 만든 뒤, 그 가루를 일반 백성의 무덤 위에 뿌렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라’는 가나안 여신 아세라를 가리킬 수도 있고, 그 숭배와 관련된 제의물을 가리킬 수도 있습니다. 여기서는 성전에서 끌어내어 파괴한 대상의 정확한 형태를 단정하지 않기 위해 음역을 유지했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲשֵׁרָה
  english_pob_choice: the Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 목상
  - 아세라 상
  lexicon: HALOT
  rationale: 히브리어가 가리키는 대상은 아세라 숭배와 연관된 제의물로도, 신격 자체로도 쓰일 수 있으므로, 구체 형상을 단정하지 않고 음역을 유지했습니다.
- source_word: מִבֵּית יְהוָה
  english_pob_choice: from the house of Yahweh
  chosen_korean: 야훼의 집에서
  alternatives_korean:
  - 야훼의 성전에서
  lexicon: HALOT
  rationale: 기본 표현인 ‘집’을 살리면서, 본문이 신적 이름 יְהוָה를 직접 쓰므로 ‘야훼’로 옮겼습니다.
- source_word: נַחַל קִדְרוֹן
  english_pob_choice: the Kidron Valley
  chosen_korean: 기드론 골짜기
  alternatives_korean:
  - 기드론 시내
  - 기드론 와디
  lexicon: HALOT
  rationale: 역사·지리 문맥에서 נחל은 계절하천보다 지형 전체를 가리키는 경우가 자연스러워, 한국어로는 ‘골짜기’가 가장 무난합니다.
- source_word: וַיָּדֶק לְעָפָר
  english_pob_choice: beat it to dust
  chosen_korean: 잘게 부숴 가루로 만들었습니다
  alternatives_korean:
  - 가루가 되도록 쳤습니다
  - 먼지처럼 빻았습니다
  lexicon: HALOT
  rationale: 동사는 단순히 부수는 것이 아니라 아주 잘게 분쇄하는 동작을 뜻하므로, ‘잘게 부숴 가루로 만들다’로 강도를 살렸습니다.
- source_word: עַל קֶבֶר בְּנֵי הָעָם
  english_pob_choice: on the graves of the common people
  chosen_korean: 백성의 아들들의 무덤 위에
  alternatives_korean:
  - 평민들의 무덤 위에
  - 보통 사람들의 무덤 위에
  lexicon: HALOT
  rationale: 히브리어를 더 직접적으로 반영해 ‘백성의 아들들’로 옮기되, 한국어에서 자연스럽게 읽히도록 문장 안에서 위치를 정리했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 프로젝트의 기본 원칙에 따라 신적 고유명사 יְהוָה는 대체 칭호가 아니라 음역인 ‘야훼’로 유지했습니다.
  doctrine_reference: project glossary / divine name policy
- issue: 아세라의 대상 규정
  chosen_reading: 음역 유지로 제의물의 정체를 열어 둠
  alternative_readings:
  - 아세라 목상으로 특정
  - 아세라 여신으로 특정
  rationale: 문맥은 성전에서 제거·파괴된 물건을 말하지만, 히브리어 자체는 그 형상을 단정하지 않으므로 해석을 과잉 확정하지 않았습니다.
  doctrine_reference: source-text restraint / lexical transparency
