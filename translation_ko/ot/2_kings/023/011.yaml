  source_fidelity: 현 번역은 말들의 위치를 나타내는 히브리어의 연속된 장소 표현(‘야훼의 집 입구에서 … 느단-멜렉의 방까지’)을 ‘말들을 … 내어 보내고’ 및 ‘그 말들을 제거하였다’로 중복·왜곡합니다. 또한 ‘궁전 관원’은 성전 구역 문맥에서 근거 없이 궁전을 첨가합니다. סָרִיס는 내시 또는 궁정/왕실 관원을 뜻할 수 있으므로 본문에서는 신체적 지위를 단정하지 않는 ‘궁정 관원’이 안전합니다.
  naturalness: ‘야훼의 집 입구에서 … 방까지 있던 말들을 제거하였습니다’는 한국어로 자연스럽고, 원문의 위치 관계도 분명히 전달합니다. ‘불로 태워 버렸습니다’의 ‘버리다’는 원문에 없는 구어적 완결 뉘앙스를 더하므로 ‘불에 태웠습니다’가 현대의 격식 있는 성경 문체에 적합합니다.
  terminology: 야훼, 유다, 느단-멜렉, 태양의 병거는 적절합니다. 파르바림은 정확한 뜻이 불확실한 희귀어이므로 음역을 유지하고 각주에서 가능한 의미를 설명하는 방식이 적절합니다. 내시/궁정 관원의 어휘상 불확실성은 본문을 ‘궁정 관원’으로 옮기고 각주에 ‘내시’를 대안으로 제시하여 보존합니다.
