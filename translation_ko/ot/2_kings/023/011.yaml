source:
  edition: WLC
  text: וַ/יַּשְׁבֵּ֣ת אֶת הַ/סּוּסִ֗ים אֲשֶׁ֣ר נָתְנוּ֩ מַלְכֵ֨י יְהוּדָ֤ה לַ/שֶּׁ֨מֶשׁ֙ מִ/בֹּ֣א בֵית יְהוָ֔ה אֶל לִשְׁכַּת֙ נְתַן מֶ֣לֶךְ הַ/סָּרִ֔יס אֲשֶׁ֖ר בַּ/פַּרְוָרִ֑ים וְ/אֶת מַרְכְּב֥וֹת הַ/שֶּׁ֖מֶשׁ שָׂרַ֥ף בָּ/אֵֽשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/023/011.yaml
  text: He removed the horses that the kings of Judah had dedicated to the sun[a], from the entrance of the house of Yahweh to the chamber of Nethan-melech the court official, which was in the precincts[b]; and he burned the chariots of the sun with fire.
  footnotes:
  - marker: a
    text: Or 'the eunuch'; the Hebrew term can denote either a eunuch or a royal/court official.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew term rendered 'precincts' is rare and may refer to an outlying or peripheral part of the temple complex; alternatives include 'suburbs' or 'colonnades.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 유다 왕들이 태양에게 바친 말들을 야훼의 집에 들어가는 곳에서 내어 보내고, 내시[a] 곧 파르바림[b]에 있는 궁전 관원 느탄-멜렉의 방 곁까지 있었던 그 말들을 제거하였습니다. 또 그는 태양의 병거들을 불로 태워 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘환관’; 히브리어는 내시와 궁정 관원을 둘 다 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 희귀한 건축·지리 용어로, 외곽 구역이나 부속 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבֵּת
  english_pob_choice: removed
  chosen_korean: 내어 보내고 / 제거하였습니다
  alternatives_korean:
  - 없애고
  - 중단시키고
  - 치워 버리고
  lexicon: HALOT
  rationale: 문맥상 우상 숭배에 쓰이던 말들을 사용 불가능하게 만드는 뜻이므로, 단순히 ‘멈추게 하다’보다 ‘내어 보내고/제거하다’가 자연스럽고 स्रोत의 사역형 뉘앙스를 잘 살립니다.
- source_word: לַשֶּׁמֶשׁ
  english_pob_choice: to the sun
  chosen_korean: 태양에게
  alternatives_korean:
  - 해에게
  - 태양을 위하여
  lexicon: HALOT
  rationale: 여기서는 일상적 ‘해’보다 우상적 대상임을 드러내는 ‘태양’이 더 적절하며, 여격 의미를 살려 ‘태양에게’로 옮겼습니다.
- source_word: הַסָּרִיס
  english_pob_choice: the court official
  chosen_korean: 내시
  alternatives_korean:
  - 궁정 관리
  - 궁정 관원
  - 환관
  lexicon: HALOT
  rationale: 본문의 히브리어는 ‘내시/환관’과 ‘궁정 관리’ 둘 다 가능하지만, 한국어에서는 보통의 행정직을 뜻할 때보다 신체적 의미가 더 기본이므로 본문 그대로의 중의성을 우선 살려 ‘내시’로 두고, 문맥상 관직임은 뒤의 ‘궁전 관원’으로 보완했습니다.
- source_word: בַּפַּרְוָרִים
  english_pob_choice: in the precincts
  chosen_korean: 파르바림
  alternatives_korean:
  - 바깥 뜰
  - 외곽 구역
  - 부속 구역
  lexicon: HALOT
  rationale: 이 지명/건축 용어는 희귀하여 확정적 한국어 대응이 어렵기 때문에, 의미를 단정하기보다 음역을 유지해 본문 정보를 보존했습니다.
theological_decisions:
- issue: 여호와/야훼의 신명사 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 고유명사로 보존해야 하므로 ‘야훼’를 사용했습니다. 이는 제목화된 ‘주’로 평준화하지 않고, 언약 이름 자체를 드러내려는 본 프로젝트의 원칙에 따릅니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
