    rationale: 원문은 ‘그가 말들을 제거하였다’라는 단일 서술이며, 뒤따르는 표현들은 말들의 위치를 한정합니다. 현 문장은 불필요한 두 행동을 만들고 문장 구조를 훼손합니다.
