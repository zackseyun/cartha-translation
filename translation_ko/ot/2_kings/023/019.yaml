  source_fidelity: 수정이 필요합니다. 초안은 לְהַכְעִיס의 암시된 대상을 본문에 ‘하나님’으로 보충하여, 원문과 영어 POB의 의도적인 비명시성을 넘었습니다. 또한 וַיַּעַשׂ לָהֶם의 대상과 벧엘에서의 행위를 비교하는 구조를 더 명료하게 반영할 필요가 있습니다.
  naturalness: ‘산당들의 집들’은 히브리어의 구성 관계를 기계적으로 옮긴 표현이라 현대 표준 한국어에서 부자연스럽습니다. ‘산당의 모든 건물’은 구체적인 건물/집들의 의미를 유지하면서 자연스럽습니다. ‘그것들에도 … 행하셨습니다’는 선행하는 건물들을 가리키는 문맥에서 비교적 자연스럽고 원문의 포괄성을 보존합니다.
  terminology: ‘산당’, ‘사마리아’, ‘이스라엘’, ‘벧엘’, ‘요시야’는 통용되는 성서 용어와 고유명에 맞습니다. ‘하나님’은 본 절 히브리어에 명시되지 않은 분노의 대상을 보충하므로 본문에서 제거하고 각주로만 문맥적 이해를 밝혀야 합니다.
  issues:
