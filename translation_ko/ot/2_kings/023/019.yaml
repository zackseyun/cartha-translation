  text: Josiah also removed all the houses of the high places that were in the cities of Samaria[a], which the kings of Israel had made to provoke to anger, and he did to them according to all the deeds that he had done at Bethel.
  footnotes:
  - marker: a
    text: Or, more explicitly from the broader context, 'to provoke the LORD to anger.'
    reason: alternative_reading
translation:
  language: ko
  text: 요시야는 또한 사마리아 성읍들에 있던 산당들의 집들, 곧 이스라엘의 왕들이 하나님을 노하시게 하려고 만든 것을 모두 제거하였고, 벧엘에서 그가 한 모든 일과 같이 그들에게도 행하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하나님을 노하시게 하려고’는 문맥상 명시된 의미를 드러낸 번역입니다. 히브리어는 여기서 분노의 대상을 직접 적지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: also
  chosen_korean: 또한
  alternatives_korean:
  - 그리고 또한
  - 더구나
  lexicon: HALOT
  rationale: 앞선 요시야의 개혁 조치에 덧붙는 추가 행동이므로, 한국어에서는 ‘또한’이 가장 자연스럽고 원문의 첨가 관계를 잘 살립니다.
- source_word: בָּתֵּי הַבָּמוֹת
  english_pob_choice: the houses of the high places
  chosen_korean: 산당들의 집들
  alternatives_korean:
  - 산당의 집들
  - 산당들
  - 산당들의 건물들
  lexicon: HALOT
  rationale: 직역적 요소인 ‘집들’을 유지하면서, פ 현지의 우상숭배 장소인 ‘high places’는 ‘산당’으로 옮겨 원문의 구체적 표현을 살렸습니다.
- source_word: לְהַכְעִיס
  english_pob_choice: to provoke to anger
  chosen_korean: 하나님을 노하시게 하려고
  alternatives_korean:
  - 분노하게 하려고
  - 노하게 하려고
  lexicon: HALOT
  rationale: 히브리어는 목적을 나타내는 표현으로, 문맥상 분노의 대상이 하나님임이 분명하므로 이를 본문에 반영했습니다.
- source_word: הֵסִיר
  english_pob_choice: removed
  chosen_korean: 제거하였고
  alternatives_korean:
  - 없애버렸고
  - 치워버렸고
  lexicon: HALOT
  rationale: 개혁 기사에서 הֵסִיר의 물리적·공적 철거 의미를 한국어 ‘제거하다’로 간결하게 살렸습니다.
- source_word: וַיַּעַשׂ לָהֶם כְּכָל הַמַּעֲשִׂים
  english_pob_choice: he did to them according to all the deeds
  chosen_korean: 그들에게도 행하였습니다
  alternatives_korean:
  - 그들에게도 그대로 행하였습니다
  - 그들에게도 그가 한 모든 일을 행하였습니다
  lexicon: HALOT
  rationale: 직역의 어색함을 피하면서도, 뒤의 비교절 ‘벧엘에서 그가 한 모든 일과 같이’를 통해 의미가 분명해지도록 자연스럽게 옮겼습니다.
theological_decisions:
- issue: לְהַכְעִיס의 분노 대상 명시 여부
  chosen_reading: 본문에는 ‘하나님을’이라고 명시해 문맥이 전제하는 대상이 분명히 드러나도록 했습니다.
  alternative_readings:
  - ‘노하시게 하려고’처럼 대상 없이 옮김
  - ‘여호와를 노하시게 하려고’로 더 구체화
  rationale: 열왕기상·하의 관용구에서 이 표현은 반복적으로 야훼에 대한 도발을 가리키므로, 문맥적 대상인 하나님을 드러내는 번역이 독자 이해에 더 충실합니다.
  doctrine_reference: 열왕기하 23장 문맥; POB source-direct contextual clarification
