revisions:
- from: 요시야는 또한 사마리아 성읍들에 있던 산당들의 집들, 곧 이스라엘의 왕들이 하나님을 노하시게 하려고 만든 것을 모두 제거하였고, 벧엘에서 그가 한 모든 일과 같이 그들에게도 행하였습니다.[a]
  to: 요시야는 또한 이스라엘 왕들이 분노를 일으키려고 만든, 사마리아 성읍들에 있는 산당의 모든 건물을 제거하고, 그것들에도 벧엘에서 행한 모든 일을 그대로 행하셨습니다.[a]
  rationale: 분노의 대상을 본문에 보충하지 않아 히브리어의 암시성을 보존했습니다. ‘산당의 모든 건물’로 בָּתֵּי הַבָּמוֹת의 구체적 의미를 자연스럽게 옮겼고, 후반부는 벧엘에서 행한 조치를 그 건물들에도 동일하게 행했다는 비교 구조를 유지했습니다.
