lexical_decisions:
- source_word: סֵפֶר הַתּוֹרָה
  english_pob_choice: the Book of the Law
  chosen_korean: 율법책
  alternatives_korean:
  - 율법의 책
  - 율법 두루마리
  - 율법서
  lexicon: WLC / HALOT
  rationale: סֵפֶר는 문서형 책/두루마리를 가리킬 수 있지만, 이 문맥에서는 왕이 낭독된 내용을 듣는 장면이므로 한국어로는 자연스럽고도 본뜻을 살리는 ‘율법책’이 적절합니다. ‘율법서’도 가능하지만 현대 독자에게는 다소 문어적입니다.
- source_word: דִּבְרֵי
  english_pob_choice: the words of
  chosen_korean: 말씀을
  alternatives_korean:
  - 말들을
  - 내용을
  - 말들의
  lexicon: HALOT
  rationale: construct 형태의 ‘말들/말씀’은 읽히는 본문 내용 자체를 가리키므로, 한국어에서는 자연스럽게 ‘말씀을 듣고’로 옮겼습니다. ‘내용을’은 의미는 통하지만 원문의 ‘말’ 연결을 약화시킵니다.
- source_word: וַיִּקְרַע אֶת בְּגָדָיו
  english_pob_choice: he tore his clothes
  chosen_korean: 자기 옷을 찢었습니다
  alternatives_korean:
  - 그의 옷을 찢었습니다
  - 옷을 찢었습니다
  - 자기 의복을 찢었습니다
  lexicon: HALOT
  rationale: בְּגָדָיו는 단순히 ‘옷’으로 옮기면 충분하며, 비탄과 충격을 나타내는 동작을 현대 한국어에서 가장 직접적으로 전달합니다. ‘의복’은 더 격식 있지만 덜 자연스럽습니다.
theological_decisions:
- issue: 왕의 반응을 표현하는 서술체의 톤
  chosen_reading: ‘찢었습니다’로 직접적이고 절제된 서술을 유지했습니다.
  alternative_readings:
  - ‘찢어 버렸습니다’
  - ‘찢었습니다’ 외에 완곡한 표현
  rationale: 본문은 율법의 말씀을 들은 왕의 충격과 애통을 보여 주므로, 의미를 약화시키지 않는 직접 서술이 필요합니다. 과도한 감정화는 피하고 원문의 급박함만 살렸습니다.
  doctrine_reference: narrative emphasis
