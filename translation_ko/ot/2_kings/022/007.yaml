  edition: WLC
  text: אַ֚ךְ לֹא יֵחָשֵׁ֣ב אִתָּ֔/ם הַ/כֶּ֖סֶף הַ/נִּתָּ֣ן עַל יָדָ֑/ם כִּ֥י בֶ/אֱמוּנָ֖ה הֵ֥ם עֹשִֽׂים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/007.yaml
  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
  footnotes:
  - marker: a
    text: Or 'the money.' Hebrew 'silver' commonly refers to money in financial contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'is not to be required from them'—that is, no accounting was demanded from the men handling the funds.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들의 손에 맡겨진 은은 그들에게서 حساب하지 않아도 됩니다. 그들이 성실하게 일하고 있기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 כסף는 문맥에 따라 ‘은’ 또는 ‘돈’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 그 돈에 대해 그들에게 회계 책임을 묻지 않아도 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: HALOT
  rationale: 앞 절과의 대비를 자연스럽게 살리는 역접으로 옮겼습니다.
- source_word: הַכֶּסֶף
  english_pob_choice: the silver
  chosen_korean: 은
  alternatives_korean:
  - 돈
  - 은전
  lexicon: HALOT
  rationale: 히브리어 כסף의 문자적 의미를 살리되, 문맥상 재정 자원을 가리키므로 ‘은’으로 옮겼습니다.
- source_word: יֵחָשֵׁב אִתָּם
  english_pob_choice: is not to be counted with them
  chosen_korean: 그들에게서 حساب하지 않아도 됩니다
  alternatives_korean:
  - 그들과 함께 계산하지 않아도 됩니다
  - 그들에게서 회계 처리를 요구하지 않아도 됩니다
  lexicon: HALOT
  rationale: 계산·정산의 의미를 드러내기 위해 ‘계산하다/계산을 요구하다’ 계열로 옮기고, 문맥상 감독 책임을 면제한다는 뜻을 살렸습니다.
- source_word: בֶאֱמוּנָה
  english_pob_choice: faithfully
  chosen_korean: 성실하게
  alternatives_korean:
  - 충실하게
  - 믿음직하게
  - 진실하게
  lexicon: HALOT
  rationale: אֱמוּנָה를 여기서는 신앙 교리보다 신뢰할 만한 수행을 가리키는 말로 보고, 업무 수행의 신실함을 드러내는 ‘성실하게’를 택했습니다.
theological_decisions:
- issue: 재정 관리의 ‘정산 없음’ 표현
  chosen_reading: “그들에게서 계산하지 않아도 됩니다”로 옮겨, 돈을 맡은 이들에게 회계 책임이 면제된다는 행정적 의미를 유지했습니다.
  alternative_readings:
  - 그들과 함께 계산하지 않아도 됩니다
  - 그들에게서 회계 보고를 요구하지 않아도 됩니다
  rationale: 본문은 도덕적 선언이 아니라 성전 공사 자금 관리의 감독 면제에 관한 문맥이므로, 의미를 약화시키지 않도록 정산/회계의 뉘앙스를 유지했습니다.
  doctrine_reference: 본문 문맥(성전 수리 재정 관리)
