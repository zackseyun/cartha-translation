  alternative_readings:
  - 그들과 함께 계산하지 않아도 됩니다
  - 그들에게서 회계 보고를 요구하지 않아도 됩니다
  rationale: 본문은 도덕적 선언이 아니라 성전 공사 자금 관리의 감독 면제에 관한 문맥이므로, 의미를 약화시키지 않도록 정산/회계의 뉘앙스를 유지했습니다.
  doctrine_reference: 본문 문맥(성전 수리 재정 관리)
