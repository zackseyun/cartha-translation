  text: But the silver that is put into their hands is not to be counted with them[b][a], for they are acting faithfully.
  footnotes:
  - marker: a
    text: Or 'the money.' Hebrew 'silver' commonly refers to money in financial contexts.
    reason: lexical_alternative
  - marker: b
    text: Or 'is not to be required from them'—that is, no accounting was demanded from the men handling the funds.
    reason: lexical_alternative
translation:
