  text: 그러나 그들의 손에 맡겨진 은[a]에 대해서는 그들에게 회계를 요구하지 않아도 됩니다.[b] 그들이 성실하게 일하고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘כסף’는 문맥에 따라 ‘은’ 또는 ‘돈’을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 그 돈에 대해 그들에게 회계 책임을 묻지 않아도 된다는 뜻입니다.
    reason: lexical_alternative
