source:
  edition: WLC
  text: לָ/כֵן֩ הִנְ/נִ֨י אֹֽסִפְ/ךָ֜ עַל אֲבֹתֶ֗י/ךָ וְ/נֶאֱסַפְתָּ֣ אֶל קִבְרֹתֶי/ךָ֮ בְּ/שָׁלוֹם֒ וְ/לֹא תִרְאֶ֣ינָה עֵינֶ֔י/ךָ בְּ/כֹל֙ הָֽ/רָעָ֔ה אֲשֶׁר אֲנִ֥י מֵבִ֖יא עַל הַ/מָּק֣וֹם הַ/זֶּ֑ה וַ/יָּשִׁ֥יבוּ אֶת הַ/מֶּ֖לֶךְ דָּבָֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/020.yaml
  text: Therefore[a], behold, I will gather you to your fathers, and you shall be gathered to your graves in peace, and your eyes shall not see all the disaster that I am bringing on this place.” And they brought back word to the king.
  footnotes:
  - marker: a
    text: Or 'peacefully.' The Hebrew says 'in peace,' which may mean that Josiah would die before seeing the coming judgment, rather than specifying the exact manner of his death.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 보십시오, 내가 당신을 당신의 조상들에게 모으겠습니다. 당신은 평안 중에 당신의 무덤으로 모일 것이며, 당신의 눈은 내가 이곳에 가져오는 이 모든 재앙을 보지 못할 것입니다.” 그리고 그들은 왕에게 말을 전했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘평안 중에’는 죽음의 정확한 방식이라기보다, 다가오는 재앙을 보기 전에 죽게 된다는 뜻일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그래서
  - 이러므로
  lexicon: HALOT
  rationale: 앞선 문맥의 결론을 잇는 추론 표지이므로, 인과와 결론을 자연스럽게 드러내는 ‘그러므로’가 가장 적절합니다.
- source_word: הִנְנִי
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이보십시오
  lexicon: HALOT
  rationale: 예언적 선언의 긴장감을 살리면서 현대 한국어 합쇼체에 맞게 주의를 환기하는 표현으로 옮겼습니다.
- source_word: אֹסִפְךָ / נֶאֱסַפְתָּ
  english_pob_choice: I will gather you ... you shall be gathered
  chosen_korean: 모으겠습니다 ... 모일 것입니다
  alternatives_korean:
  - 데려가겠습니다 ... 데려가질 것입니다
  - 거두겠습니다 ... 거두어질 것입니다
  lexicon: HALOT
  rationale: 같은 어근 אסף의 반복을 살려 ‘모으다/모이다’로 대응했고, 죽음과 조상에게 합류하는 관용을 과도하게 풀지 않았습니다.
- source_word: בְּשָׁלוֹם
  english_pob_choice: in peace
  chosen_korean: 평안 중에
  alternatives_korean:
  - 평안하게
  - 평화 중에
  lexicon: HALOT
  rationale: 명사 שָׁלוֹם의 감각을 유지하면서도 한국어로 자연스럽게 읽히도록 ‘평안 중에’로 옮겼습니다. 죽음의 방식보다 재앙을 보기 전에 떠난다는 뜻을 보존합니다.
- source_word: הָרָעָה
  english_pob_choice: the disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 악
  lexicon: HALOT
  rationale: 이 문맥의 רָעָה는 도덕적 ‘악’이 아니라 임박한 심판의 재앙이므로, 의미를 분명하게 드러내는 ‘재앙’이 적절합니다.
theological_decisions:
- issue: ‘평안 중에’의 의미와 요시야의 이후 전사 기사 사이의 긴장
  chosen_reading: 본문 표현을 그대로 살려, 죽음의 정황을 해석적으로 정리하지 않았습니다.
  alternative_readings:
  - ‘평안하게’로 죽음의 방식까지 규정하는 번역
  - ‘재앙이 오기 전에’처럼 의미를 풀어쓴 번역
  rationale: 히브리어는 분명히 ‘평안 중에’라고 말하므로, 이후 역사 서술과의 긴장을 번역이 미리 해소하지 않도록 했습니다. 핵심은 재앙을 보지 않게 될 것이라는 약속입니다.
  doctrine_reference: 'Translation philosophy: preserve theological tension rather than resolve it.'
