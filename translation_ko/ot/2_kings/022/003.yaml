source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁמֹנֶ֤ה עֶשְׂרֵה֙ שָׁנָ֔ה לַ/מֶּ֖לֶךְ יֹאשִׁיָּ֑הוּ שָׁלַ֣ח הַ֠/מֶּלֶךְ אֶת שָׁפָ֨ן בֶּן אֲצַלְיָ֤הוּ בֶן מְשֻׁלָּם֙ הַ/סֹּפֵ֔ר בֵּ֥ית יְהוָ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/003.yaml
  text: Now in the eighteenth year of King Josiah[a], the king sent Shaphan son of Azaliah, son of Meshullam, the scribe, to the house of Yahweh, saying,
  footnotes:
  - marker: a
    text: Or 'the temple of the LORD.' Literally, 'the house of the LORD.'
    reason: lexical_alternative
translation:
  language: ko
  text: 요시야 왕의 열여덟째 해에 왕이 사반 곧 아실랴의 아들이며 므술람의 손자인 서기관을 야훼의 집으로 보내며 이르렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님의 성전.’ 문자적으로는 ‘야훼의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  english_pob_choice: in the eighteenth year
  chosen_korean: 열여덟째 해에
  alternatives_korean:
  - 열여덟 해에
  - 즉위 제18년에
  lexicon: HALOT
  rationale: 왕의 재위 연대를 나타내는 관용 표현이므로, 자연스러운 한국어로 '열여덟째 해에'라고 옮겼습니다.
- source_word: שָׁלַח הַמֶּלֶךְ
  english_pob_choice: the king sent
  chosen_korean: 왕이 … 보내며
  alternatives_korean:
  - 왕이 … 보냈습니다
  - 왕이 … 파견하며
  lexicon: HALOT
  rationale: 히브리어는 앞에서 요시야를 언급한 뒤 다시 '왕'을 반복하므로, 이를 살려 주어 반복을 유지했습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 서기
  - 궁정 서기관
  lexicon: HALOT
  rationale: 문맥상 왕실 행정관이지만, 즉시 문맥에서 확인되는 직함은 '서기관'이므로 가장 투명한 기본 대응을 택했습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: 직역에 가까운 '집'을 유지해 히브리어 표현을 보존했고, יְהוָה는 프로젝트 기준에 따라 '야훼'로 옮겼습니다.
theological_decisions:
- issue: 요시야 재위 연대 표현에서 ‘왕’ 반복을 살릴지 여부
  chosen_reading: 본문의 ‘요시야 왕의 열여덟째 해’ 뒤에 다시 ‘왕이’라고 반복하여, 서술의 리듬과 원문 구조를 유지했습니다.
  alternative_readings:
  - ‘요시야 왕의 열여덟째 해에 요시야가 … 보냈습니다’
  - ‘요시야 왕의 열여덟째 해에 그가 … 보냈습니다’
  rationale: 히브리어는 동일 인물을 다시 지칭하는 반복을 사용하므로, 이를 매끄럽게 풀어쓰되 지나치게 생략하지 않는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 원문 서술 구조 보존 원칙
- issue: יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본 절은 신명기적 서술 속에서 하나님의 고유명을 직접 사용하므로, 전통적 대체칭호보다 고유명 음역을 유지하는 것이 원문 감각을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
