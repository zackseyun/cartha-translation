  source_fidelity: 본문의 연대, 왕의 반복 지칭, 사반의 계보, 서기관 직함, ‘야훼의 집’, 그리고 뒤따르는 발화 도입은 대체로 충실합니다. 다만 ‘보내며 이르렀습니다’는 히브리어의 ‘보내어 … 말하였다’라는 주절과 לֵאמֹר의 관계를 자연스럽게 나타내지 못합니다.
  naturalness: 현 번역의 ‘보내며 이르렀습니다’는 현대 표준 한국어에서 부자연스럽고, ‘보내는 동시에 말했다’라는 어색한 연결로 읽힐 수 있습니다. ‘보내어 이렇게 말했습니다’가 합쇼체 서술과 다음 절의 직접화법 연결에 자연스럽습니다.
  terminology: ‘야훼’, ‘서기관’, ‘열여덟째 해’는 적절합니다. 아버지 이름 אֲצַלְיָהוּ는 통용 음역 및 영어 POB의 Azaliah에 맞춰 ‘아살리야’로 바로잡는 편이 안전합니다. 각주의 대안도 본문의 신명 ‘야훼’와 일치시켜야 합니다.
