source:
  edition: WLC
  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה הִנְ/נִ֨י מֵבִ֥יא רָעָ֛ה אֶל הַ/מָּק֥וֹם הַ/זֶּ֖ה וְ/עַל יֹֽשְׁבָ֑י/ו אֵ֚ת כָּל דִּבְרֵ֣י הַ/סֵּ֔פֶר אֲשֶׁ֥ר קָרָ֖א מֶ֥לֶךְ יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/016.yaml
  text: 'Thus says Yahweh: Behold[a], I am bringing disaster on this place and on its inhabitants, all the words of the book that the king of Judah has read.'
  footnotes:
  - marker: a
    text: Or 'calamity'; Hebrew רָעָה here refers to judgment or disaster, not moral evil.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이렇게 말씀하십니다. 보십시오, 내가 이곳과 그 주민들에게, 유다 왕이 읽은 그 책의 모든 말을 두고 재앙을 내리고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 히브리어 רָעָה는 도덕적 ‘악’이 아니라 심판의 ‘재앙/재난’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: Thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이와 같이 말씀하십니다
  - 야훼께서 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 전달 공식의 격식을 살리기 위해 ‘이렇게’를 사용했고, 주어는 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הִנְנִי
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 내가
  lexicon: HALOT
  rationale: 즉각성과 엄숙함을 드러내되 현대 한국어 합쇼체에 자연스럽게 맞도록 감탄형 명령 ‘보십시오’로 옮겼습니다.
- source_word: מֵבִיא רָעָה
  english_pob_choice: I am bringing disaster
  chosen_korean: 재앙을 내리고 있습니다
  alternatives_korean:
  - 재난을 가져오고 있습니다
  - 재앙을 가져오고 있습니다
  - 재난을 내리고 있습니다
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’이 아니라 심판의 재앙을 뜻하므로, 한국어에서는 예언적 심판 어감이 분명한 ‘재앙’을 택했습니다.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  english_pob_choice: all the words of the book
  chosen_korean: 그 책의 모든 말
  alternatives_korean:
  - 그 책에 기록된 모든 말
  - 그 책에 적힌 모든 말씀
  lexicon: HALOT
  rationale: 히브리어의 직설적 어순과 ‘words’를 반영해 ‘모든 말’로 옮겨, 책에 담긴 언약 경고의 문구를 가깝게 살렸습니다.
- source_word: יֹשְׁבָיו
  english_pob_choice: its inhabitants
  chosen_korean: 그 주민들에게
  alternatives_korean:
  - 그 안에 사는 사람들에게
  - 그 거주자들에게
  lexicon: HALOT
  rationale: ‘그곳에 사는 이들’의 뜻을 간결하게 살리면서 문장 흐름상 ‘재앙을 내리다’의 목적 대상에 자연스럽게 연결했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 언약명을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: רָעָה의 의미 범위
  chosen_reading: 재앙
  alternative_readings:
  - 악
  - 재난
  - 재해
  rationale: 문맥이 도덕적 악이 아니라 언약적 심판의 선포이므로, 하나님을 악의 행위자로 오해하지 않도록 ‘재앙’으로 분명히 옮겼습니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; source-direct judgment language'
