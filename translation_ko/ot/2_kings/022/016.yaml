  - 재난을 내리고 있습니다
  lexicon: HALOT
  rationale: רָעָה는 여기서 도덕적 ‘악’이 아니라 심판의 재앙을 뜻하므로, 한국어에서는 예언적 심판 어감이 분명한 ‘재앙’을 택했습니다.
- source_word: אֵת כָּל דִּבְרֵי הַסֵּפֶר
  english_pob_choice: all the words of the book
  chosen_korean: 그 책의 모든 말
  alternatives_korean:
  - 그 책에 기록된 모든 말
  - 그 책에 적힌 모든 말씀
  lexicon: HALOT
  rationale: 히브리어의 직설적 어순과 ‘words’를 반영해 ‘모든 말’로 옮겨, 책에 담긴 언약 경고의 문구를 가깝게 살렸습니다.
- source_word: יֹשְׁבָיו
  english_pob_choice: its inhabitants
  chosen_korean: 그 주민들에게
  alternatives_korean:
  - 그 안에 사는 사람들에게
  - 그 거주자들에게
  lexicon: HALOT
  rationale: ‘그곳에 사는 이들’의 뜻을 간결하게 살리면서 문장 흐름상 ‘재앙을 내리다’의 목적 대상에 자연스럽게 연결했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문에 직접 나타난 언약명을 보존하기 위해 프로젝트 기본값인 ‘야훼’를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: רָעָה의 의미 범위
