    rationale: וְיִתְּנוּ는 앞선 지시와 병행되어 ‘그들이 주게 하십시오’라는 지시를 이룹니다. ‘그러면 … 할 것입니다’는 원문에 없는 조건 관계와 미래 진술을 도입합니다.
