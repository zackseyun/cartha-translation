  text: ו/יתנ/ה עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים ב/בית יְהוָ֑ה וְ/יִתְּנ֣וּ אֹת֗/וֹ לְ/עֹשֵׂ֤י הַ/מְּלָאכָה֙ אֲשֶׁר֙ בְּ/בֵ֣ית יְהוָ֔ה לְ/חַזֵּ֖ק בֶּ֥דֶק הַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/005.yaml
  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
  footnotes:
  - marker: a
    text: Or 'and he shall give it into the hand of the workmen.' The Hebrew verb is 'give,' but the idiom means to place something into someone's custody.
    reason: lexical_alternative
  - marker: b
    text: '''Repair the damage'' is literally ''strengthen the breach/damage'' of the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그가 그것을 야훼의 집에서 일하는 공사 책임자들의 손에 넘기게 하십시오. 그러면 그들이 야훼의 집 안에 있는 공사자들에게 그것을 넘겨 그 집의 손상된 부분을 수리하게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “손에 넘기다”는 히브리어의 ‘주다’보다, 어떤 것을 누군가의 관리 아래 맡긴다는 관용적 의미를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수리하다’는 문자적으로는 ‘강하게 하다’에 해당하는 לחזק을, 건물 보수 문맥에 맞게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יתנ/ה עַל יַד
  english_pob_choice: and let him put it into the hands of
  chosen_korean: 그것을 …의 손에 넘기게 하십시오
  alternatives_korean:
  - 그것을 …에게 주게 하십시오
  - 그것을 …의 손에 맡기게 하십시오
  lexicon: HALOT
  rationale: נתן과 עַל יַד의 결합은 단순한 ‘주다’보다 보관·관리의 위탁을 뜻하므로, 한국어에서는 ‘손에 넘기다’로 전달하는 것이 문맥에 가장 가깝습니다.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  english_pob_choice: the workmen who are appointed
  chosen_korean: 공사 책임자들
  alternatives_korean:
  - 일하는 사람들
  - 배정된 일꾼들
  - 감독된 공사자들
  lexicon: HALOT
  rationale: ‘일하는 자들’이라는 문자성보다 성전 수리 공사의 관리·책임 역할이 드러나야 하므로, 문맥상 ‘공사 책임자들’로 옮겼습니다.
- source_word: לחזק בדק הבית
  english_pob_choice: to repair the damage to the house
  chosen_korean: 그 집의 손상된 부분을 수리하게 할 것입니다
  alternatives_korean:
  - 그 집의 손상을 보강하게 할 것입니다
  - 그 집의 틈을 고치게 할 것입니다
  lexicon: HALOT
  rationale: חזק는 문자적으로 ‘강하게 하다’이지만 건물 수리 문맥에서는 ‘수리하다/보수하다’가 자연스럽고, בדק הבית는 구조적 손상 부위를 가리키므로 ‘손상된 부분’으로 풀었습니다.
- source_word: בית יהוה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 주님의 집
  lexicon: HALOT
  rationale: בית יהוה는 문자적으로 ‘야훼의 집’이며, 본문이 반복하는 ‘집’의 어휘 연결을 살리기 위해 ‘성전’보다 ‘집’을 유지했습니다.
theological_decisions:
