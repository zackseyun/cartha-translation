  text: and let him put it into the hands of the workmen who are appointed in the house of Yahweh[b][a], and let them give it to the workmen who are in the house of Yahweh to repair the damage to the house.
  footnotes:
  - marker: a
    text: Or 'and he shall give it into the hand of the workmen.' The Hebrew verb is 'give,' but the idiom means to place something into someone's custody.
    reason: lexical_alternative
  - marker: b
    text: '''Repair the damage'' is literally ''strengthen the breach/damage'' of the house.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그것을 야훼의 집에서 임명된 일꾼들의 손에 맡기게 하십시오.[a] 그들이 야훼의 집에 있는 일꾼들에게 그것을 주어 그 집의 손상된 부분을 수리하게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘…의 손에 맡기다’는 히브리어로는 직역하면 ‘…의 손에 주다’입니다. 여기서는 어떤 것을 그들의 관리 아래 맡긴다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘수리하다’는 문자적으로는 ‘그 집의 손상(틈)을 강하게 하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ו/יתנ/ה עַל יַד
  english_pob_choice: and let him put it into the hands of
  chosen_korean: 그것을 …의 손에 넘기게 하십시오
  alternatives_korean:
  - 그것을 …에게 주게 하십시오
  - 그것을 …의 손에 맡기게 하십시오
  lexicon: HALOT
  rationale: נתן과 עַל יַד의 결합은 단순한 ‘주다’보다 보관·관리의 위탁을 뜻하므로, 한국어에서는 ‘손에 넘기다’로 전달하는 것이 문맥에 가장 가깝습니다.
- source_word: עֹשֵׂי הַמְּלָאכָה הַמֻּפְקָדִים
  english_pob_choice: the workmen who are appointed
  chosen_korean: 공사 책임자들
  alternatives_korean:
  - 일하는 사람들
