- from: 그리고 그가 그것을 야훼의 집에서 일하는 공사 책임자들의 손에 넘기게 하십시오. 그러면 그들이 야훼의 집 안에 있는 공사자들에게 그것을 넘겨 그 집의 손상된 부분을 수리하게 할 것입니다.[a][b]
  to: 그것을 야훼의 집에서 임명된 일꾼들의 손에 맡기게 하십시오.[a] 그들이 야훼의 집에 있는 일꾼들에게 그것을 주어 그 집의 손상된 부분을 수리하게 하십시오.[b]
