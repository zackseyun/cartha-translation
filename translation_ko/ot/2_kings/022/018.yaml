  to: 그러나 여러분을 보내어 야훼께 묻도록 한 유다 왕에게는 이렇게 말하십시오. “이스라엘의 하나님 야훼께서 이렇게 말씀하십니다. ‘당신이 들은 말씀들에 관해서는—’”[a]
