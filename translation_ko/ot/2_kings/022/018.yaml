base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/018.yaml
  text: 'But to the king of Judah[a], who sent you to inquire of Yahweh, thus you shall say to him: Thus says Yahweh, the God of Israel: As for the words that you have heard—'
  footnotes:
  - marker: a
    text: Or, 'As for the words that you heard—' The Hebrew clause is left hanging here and is completed in the following verse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 유다 왕—당신들을 보내어 야훼께 묻도록 한 왕—에게는, 그에게 이렇게 말하십시오. "야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 당신이 들은 그 말씀들에 관하여—"[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 히브리어 문장은 여기서 끝나지 않고 다음 절에서 이어집니다.
    reason: source_note
lexical_decisions:
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: the king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  lexicon: HALOT
  rationale: 히브리어 소유/소속 관계를 자연스러운 한국어 관용인 ‘유다 왕’으로 옮겼습니다.
- source_word: הַשֹּׁלֵחַ אֶתְכֶם לִדְרֹשׁ אֶת יְהוָה
  english_pob_choice: who sent you to inquire of Yahweh
  chosen_korean: 당신들을 보내어 야훼께 묻도록 한
  alternatives_korean:
  - 당신들을 보내어 야훼를 찾도록 한
  - 당신들을 보내어 야훼를 상의하도록 한
  lexicon: HALOT
  rationale: דרשׁ의 예언적/제의적 용법을 따라 ‘묻다’로 옮겨, 왕이 야훼께 지시를 구한 상황을 살렸습니다.
- source_word: כֹּה תֹאמְרוּ אֵלָיו
  english_pob_choice: you shall say this to him
  chosen_korean: 그에게 이렇게 말하십시오
  alternatives_korean:
  - 그에게 이처럼 말하십시오
  - 그에게 이렇게 말씀하십시오
  lexicon: HALOT
  rationale: 메신저 공식의 명령형을 현대 한국어의 공손한 지시문으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 프로젝트 기본값에 따라 ‘야훼’로 유지했습니다.
- source_word: הַדְּבָרִים אֲשֶׁר שָׁמָעְתָּ
  english_pob_choice: As for the words that you have heard—
  chosen_korean: 당신이 들은 그 말씀들에 관하여—
  alternatives_korean:
  - 당신이 들은 말씀들에 관하여—
  - 당신이 들은 그 말들에 대하여—
  lexicon: HALOT
  rationale: 다음 절에서 이어질 미완성 절을 살리기 위해 주제 전환형 표현 ‘…에 관하여—’를 사용했습니다.
theological_decisions:
- issue: 야훼의 직접 발화 도입
  chosen_reading: 예언자적 전달 공식으로 본문에서 야훼의 말씀을 직접 인용하되, 한국어는 공손한 지시형으로 유지했습니다.
  alternative_readings:
  - 직접 화법을 더 강하게 드러내는 평서형
  - 전통 교회어체의 경어 완화
  rationale: 히브리어의 공식적 전달 구조(‘이렇게 말하십시오… 이렇게 말씀하십니다’)를 보존하면서도 현대 한국어의 문체를 유지하기 위한 선택입니다.
  doctrine_reference: Narrative register / messenger formula
- issue: 수미절 미완성 구조
  chosen_reading: 절 끝의 ‘—’를 유지해 다음 절로 이어지는 미완성 구문을 드러냈습니다.
  alternative_readings:
  - 완결형으로 매끈하게 다듬는 번역
  - 다음 절 내용을 앞당겨 보충하는 번역
  rationale: 히브리어가 다음 절에서 완성되는 절단형 구조이므로, 미완성감을 지우지 않는 것이 본문 충실성에 부합합니다.
  doctrine_reference: Source syntax preservation
