reference: 2 Kings 22:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: לְכוּ֩ דִרְשׁ֨וּ אֶת יְהוָ֜ה בַּעֲדִ֣/י וּ/בְעַד הָ/עָ֗ם וּ/בְעַד֙ כָּל יְהוּדָ֔ה עַל דִּבְרֵ֛י הַ/סֵּ֥פֶר הַ/נִּמְצָ֖א הַ/זֶּ֑ה כִּֽי גְדוֹלָ֞ה חֲמַ֣ת יְהוָ֗ה אֲשֶׁר הִיא֙ נִצְּתָ֣ה בָ֔/נוּ עַל֩ אֲשֶׁ֨ר לֹֽא שָׁמְע֜וּ אֲבֹתֵ֗י/נוּ עַל דִּבְרֵי֙ הַ/סֵּ֣פֶר הַ/זֶּ֔ה לַ/עֲשׂ֖וֹת כְּ/כָל הַ/כָּת֥וּב עָלֵֽי/נוּ־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/013.yaml
  text: Go[a], inquire of Yahweh for me, and for the people, and for all Judah[b], concerning the words of this book that has been found. For great is the wrath of Yahweh that has been kindled against us, because our fathers have not listened to the words of this book, to do according to all that is written concerning us.
  footnotes:
  - marker: a
    text: Or 'seek the LORD' or 'consult the LORD.' The Hebrew verb can denote seeking God generally or inquiring of him for guidance; here the context favors formal inquiry.
    reason: lexical_alternative
  - marker: b
    text: Or 'our ancestors.' Hebrew 'our fathers' is retained in the main text because the source is explicitly masculine and refers to the nation's forefathers.
    reason: lexical_alternative
translation:
  language: ko
  text: 가서 저와 백성과 모든 유다를 위하여 야훼께 여쭈어 보십시오. 이 발견된 책의 말씀들에 대하여 말입니다. 야훼의 큰 진노가 우리에게 불붙었으니, 우리 조상들이 이 책의 말씀들을 듣지 않고, 우리에 관하여 기록된 모든 것을 행하지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘여쭈어 보다’는 כאן의 דָּרַשׁ을 공식적으로 문의하다/계시를 구하다로 이해한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘우리 조상들’은 히브리어의 남성 복수형을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ דִרְשׁוּ אֶת יְהוָה
  english_pob_choice: Go, inquire of Yahweh
  chosen_korean: 가서 … 야훼께 여쭈어 보십시오
  alternatives_korean:
  - 가서 … 야훼를 찾으십시오
  - 가서 … 야훼께 물으십시오
  lexicon: HALOT
  rationale: דָּרַשׁ은 하나님을 대상으로 할 때 단순한 ‘찾다’보다 공식적인 문의·계시 요청의 의미가 강하므로, ‘여쭈어 보다’로 자연스럽고 공손하게 옮겼습니다.
- source_word: בַּעֲדִי וּבְעַד הָעָם וּבְעַד כָּל יְהוּדָה
  english_pob_choice: for me, and for the people, and for all Judah
  chosen_korean: 저와 백성과 모든 유다를 위하여
  alternatives_korean:
  - 저를 위해서와 백성을 위해서와 모든 유다를 위해
  - 저를 위하여, 백성을 위하여, 그리고 온 유다를 위하여
  lexicon: HALOT
  rationale: בְּעַד의 대표·중보적 용법을 한국어의 ‘위하여’로 살려, 요시야가 백성을 대신해 하나님께 문의하라는 뜻을 보존했습니다.
- source_word: חֲמַת יְהוָה
  english_pob_choice: the wrath of Yahweh
  chosen_korean: 야훼의 큰 진노
  alternatives_korean:
  - 야훼의 분노
  - 야훼의 노여움
  lexicon: HALOT
  rationale: חֵמָה는 단순한 감정적 화보다 심판적·격렬한 진노를 가리키므로, ‘큰 진노’로 그 강도를 드러냈습니다.
- source_word: נִצְּתָה בָנוּ
  english_pob_choice: has been kindled against us
  chosen_korean: 우리에게 불붙었으니
  alternatives_korean:
  - 우리에게 붙었으니
  - 우리에게 타올랐으니
  lexicon: HALOT
  rationale: 이 동사는 ‘점화되다/붙다’의 이미지를 가지므로, 진노의 불길이 이미 붙은 상태를 살려 ‘불붙다’로 옮겼습니다.
- source_word: לֹא שָׁמְעוּ אֲבֹתֵינוּ
  english_pob_choice: our fathers have not listened
  chosen_korean: 우리 조상들이 … 듣지 않고
  alternatives_korean:
  - 우리 아버지들이 … 듣지 않고
  - 우리 조상들이 … 귀 기울이지 않고
  lexicon: HALOT
  rationale: 여기서는 책의 말씀에 대한 청취를 뜻하므로 ‘듣지 않고’가 직접적이며, 남성 복수의 אָבוֹתֵינוּ는 문맥상 ‘조상들’로 옮겼습니다.
- source_word: לַעֲשׂוֹת כְּכָל הַכָּתוּב עָלֵינוּ
  english_pob_choice: to do according to all that is written concerning us
  chosen_korean: 우리에 관하여 기록된 모든 것을 행하지 않았기 때문입니다
  alternatives_korean:
  - 우리에게 기록된 모든 대로 행하지 않았기 때문입니다
  - 우리에 대하여 기록된 모든 것대로 행하지 않았기 때문입니다
  lexicon: HALOT
  rationale: כְּכָל הַכָּתוּב은 ‘기록된 모든 것에 따라’라는 포괄성을 가지며, עָלֵינוּ는 그 말씀이 지금의 공동체에 적용됨을 가리켜 ‘우리에 관하여’로 살렸습니다.
theological_decisions:
- issue: יהוה의 한국어 처리
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 구절은 신명기적 언약 이름 יְהוָה를 직접 사용하므로, 프로젝트 기본 방침에 따라 ‘야훼’로 옮겨 고유한 언약명을 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘우리 조상들’의 성별 표지
  chosen_reading: 우리 조상들
  alternative_readings:
  - 우리 선조들
  - 우리 조상들(중성화)
  rationale: 히브리어 אֲבֹתֵינוּ는 남성 복수형이며, 본문은 민족의 남성 계열 조상들을 지칭하므로 성별을 지우지 않는 번역을 택했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
