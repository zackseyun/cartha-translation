  to: 그때 서기관 사반이 왕에게 와서 왕께 보고하고 말했습니다. “당신의 종들이 집[a]에서 발견된 은을 쏟아 내어, 야훼의 집을 맡도록 임명된 일꾼들의 손에[b] 넘겼습니다.”
  rationale: ‘집을 맡도록 임명된’으로 고쳐 הַמֻּפְקָדִים의 수동적 임명 및 감독 범위를 보존했습니다. ‘쏟아 내어’는 화폐를 용기에서 비우거나 옮기는 원문의 구체적 이미지를 유지했습니다. 각주 표지는 각각 ‘집’과 ‘손에’에 직접 연결했습니다.
