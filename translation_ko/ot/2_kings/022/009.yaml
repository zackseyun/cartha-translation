reference: 2 Kings 22:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֞א שָׁפָ֤ן הַ/סֹּפֵר֙ אֶל הַ/מֶּ֔לֶךְ וַ/יָּ֥שֶׁב אֶת הַ/מֶּ֖לֶךְ דָּבָ֑ר וַ/יֹּ֗אמֶר הִתִּ֤יכוּ עֲבָדֶ֨י/ךָ֙ אֶת הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֣א בַ/בַּ֔יִת וַֽ/יִּתְּנֻ֗/הוּ עַל יַד֙ עֹשֵׂ֣י הַ/מְּלָאכָ֔ה הַ/מֻּפְקָדִ֖ים בֵּ֥ית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/009.yaml
  text: Then Shaphan the scribe came to the king and brought back word to the king[a], and said[c][b], “Your servants have poured out the silver that was found in the house and have put it into the hand of the workmen who are appointed over the house of Yahweh.”
  footnotes:
  - marker: a
    text: Or 'have emptied out the silver'; the Hebrew verb can also be understood more literally as 'have poured out.'
    reason: lexical_alternative
  - marker: b
    text: That is, the temple; literally 'the house.'
    reason: cultural_note
  - marker: c
    text: Or 'have entrusted it to' or 'have delivered it to'; literally 'have put it into the hand of.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 서기관 사반이 왕에게 와서 왕에게 보고하고 말했습니다. “당신의 종들이 집에서 발견된 은을 쏟아 내어, 야훼의 집 일에 임명된 일꾼들의 손에 넘겼습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 문맥상 성전을 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 문자적으로 ‘손에’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת הַמֶּלֶךְ דָּבָר
  english_pob_choice: brought back word
  chosen_korean: 왕에게 보고하고
  alternatives_korean:
  - 말을 전하고
  - 보고를 올리고
  lexicon: HALOT
  rationale: 히브리어 관용구는 단순히 ‘말하다’보다 ‘돌아와서 보고하다’의 흐름이므로, 현대 한국어에서는 ‘보고하고’로 자연스럽게 옮겼습니다.
- source_word: הִתִּיכוּ
  english_pob_choice: have poured out
  chosen_korean: 쏟아 내어
  alternatives_korean:
  - 비워 내어
  - 녹여
  lexicon: HALOT
  rationale: 문맥은 금속을 제련하는 것이 아니라 담아 둔 은을 비우거나 옮기는 행위이므로, 이미지와 행정적 맥락을 살리는 ‘쏟아 내어’를 택했습니다.
- source_word: וַיִּתְּנֻהוּ עַל יַד
  english_pob_choice: have put it into the hand of
  chosen_korean: …의 손에 넘겼습니다
  alternatives_korean:
  - …의 손에 두었습니다
  - …에게 맡겼습니다
  - …의 손에 전달했습니다
  lexicon: HALOT
  rationale: ‘손에 두다/넘기다’라는 히브리어 관용을 한국어로 살리되, 금전을 책임자에게 인계하는 뜻이 분명하도록 ‘넘겼습니다’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 고유명사로서의 하나님의 이름을 보존하기 위해 전통적 대치어인 ‘주님’ 대신 ‘야훼’를 사용했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 본문의 יְהוָה는 ‘야훼’로 옮기고, ‘주’로 대치하지 않았습니다.
  alternative_readings:
  - 주
  - 주님
  - 여호와
  rationale: 본문이 하나님의 언약적 이름을 직접 사용하므로, 제목어로 바꾸기보다 고유명을 드러내는 번역이 원문 인식을 더 정확히 보존합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
