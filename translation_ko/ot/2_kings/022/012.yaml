  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְצַ֣ו הַ/מֶּ֡לֶךְ אֶת חִלְקִיָּ֣ה הַ/כֹּהֵ֡ן וְ/אֶת אֲחִיקָ֣ם בֶּן שָׁ֠פָן וְ/אֶת עַכְבּ֨וֹר בֶּן מִיכָיָ֜ה וְ/אֵ֣ת שָׁפָ֣ן הַ/סֹּפֵ֗ר וְ/אֵ֛ת עֲשָׂיָ֥ה עֶֽבֶד הַ/מֶּ֖לֶךְ לֵ/אמֹֽר־־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/012.yaml
  text: Then the king commanded Hilkiah the priest[a], Ahikam son of Shaphan, Achbor son of Micaiah, Shaphan the scribe, and Asaiah the king’s servant, saying[c][b],
  footnotes:
  - marker: a
    text: Or "Shaphan the secretary." The Hebrew term can refer to a royal scribe or administrative secretary.
    reason: lexical_alternative
  - marker: b
    text: Or "Asaiah the king’s official." The Hebrew literally reads "servant," which in a royal court can denote an official in the king’s service.
    reason: lexical_alternative
  - marker: c
    text: The Hebrew says "Hilkiah the priest," not explicitly "the high priest."
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 왕이 제사장 힐기야[a], 사반의 아들 아히감, 미가야의 아들 악볼, 서기관 사반, 그리고 왕의 종 아사야[b]에게 명령하여 이렇게 말했습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 여기서 힐기야를 단지 ‘제사장’이라고 부르며, ‘대제사장’이라고 명시하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘왕의 종’이라고 합니다. 왕실 맥락에서는 왕을 섬기는 관리나 관리를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 לֵאמֹר는 이어지는 절에 나오는 명령의 내용을 도입합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיְצַו
  english_pob_choice: commanded
  chosen_korean: 명령하여 이르렀습니다
  alternatives_korean:
  - 명령했습니다
  - 지시했습니다
  lexicon: HALOT
  rationale: 왕의 권위를 분명히 드러내는 동사로, 단순한 안내보다 강한 명령의 힘을 살렸습니다.
- source_word: הַכֹּהֵן
  english_pob_choice: Hilkiah the priest
  chosen_korean: 힐기야 제사장
  alternatives_korean:
  - 힐기야 대제사장
  - 힐기야 사제
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘제사장’(the priest)이라고만 하므로, 본절에 없는 ‘대제사장’을 덧붙이지 않았습니다.
- source_word: שָׁפָן הַסֹּפֵר
  english_pob_choice: Shaphan the scribe
  chosen_korean: 서기관 사반
  alternatives_korean:
  - 사반 서기관
  - 사반 비서
  lexicon: HALOT
  rationale: סופר는 왕실 행정 맥락에서 서기관/비서를 가리킬 수 있으나, 한국어에서는 ‘서기관’이 형태와 직분을 가장 직접적으로 반영합니다.
- source_word: עֶבֶד הַמֶּלֶךְ
  english_pob_choice: the king’s servant
  chosen_korean: 왕의 종
  alternatives_korean:
  - 왕의 신하
  - 왕의 관리
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘종’이며, 본절에서는 bonded status를 부각할 신학적 이유가 없으므로 공문체의 ‘신하’보다 원어에 더 가까운 ‘종’을 택했습니다.
theological_decisions:
- issue: ‘commanded … saying’의 왕권 표현
  chosen_reading: 왕이 여러 인물에게 명령하여 이르렀다고 옮겨, 본문의 권위적 행위를 분명히 드러냈습니다.
  alternative_readings:
  - 왕이 …에게 말했습니다
  - 왕이 …에게 지시했습니다
  rationale: 히브리어 וַיְצַו는 단순한 발화가 아니라 명령 행위를 나타내므로, 왕의 통치적 권위를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 성경 본문의 역사 서술에서 하나님의 섭리 아래 인간 통치의 실제성을 드러내는 표현
