  source_fidelity: 주요 인과 구조와 회개의 표지는 대체로 충실합니다. 그러나 ‘그 마음’은 2인칭 소유를 빠뜨렸고, ‘나도 네 말을 들었습니다’는 히브리어에 명시되지 않은 ‘말’을 보충하여 대상의 여지를 좁힙니다. 여호와의 이름은 제공된 POB 방침과 영어 감사 기록에 맞추어 ‘야훼’로 통일하는 것이 적절합니다.
  naturalness: 수정문은 긴 히브리어 인과절을 자연스러운 현대 표준 한국어로 유지하면서, 직접 발화의 합쇼체 종결을 보존합니다. ‘네 마음’ 및 ‘스스로를 낮추었으며’가 지시 대상과 재귀 의미를 더 분명히 합니다.
  terminology: יַהְוֶה는 POB의 지정 용례에 따라 ‘야훼’로, שַׁמָּה는 본문에서 ‘황폐’로 옮깁니다. 주석은 히브리어 낱말을 정확히 제시하고 ‘경악의 대상’이라는 가능한 판단 문맥상의 의미를 알려야 합니다.
