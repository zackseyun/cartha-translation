theological_decisions:
- issue: YHWH의 고유명사 처리
  chosen_reading: 여호와
  alternative_readings:
  - 야훼
  - 주님
  rationale: 주어진 영어 POB가 본문에서 Yahweh를 사용하므로, 한국어 본문에서는 통용성과 가독성을 고려해 ‘여호와’로 옮겼습니다. 다만 이는 POB 프로젝트의 기본 용례와는 다른 판정입니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 하나님/왕의 직접 발화에서의 말투
  chosen_reading: 직접 화법을 유지하되, 서술문은 합쇼체로 통일했습니다.
  alternative_readings:
  - 모든 절을 평서체로 통일
  - 신적 발화만 더 격식화
  rationale: 절 전체는 서술형 예언/신적 선언 문맥이므로 일반 서술은 합쇼체로 두고, 마지막 ‘여호와의 말씀입니다’로 선언 형식을 살렸습니다.
  doctrine_reference: Korean style policy for biblical narrative and divine speech
