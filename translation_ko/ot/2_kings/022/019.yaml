base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/019.yaml
  text: Because your heart was tender[a], and you humbled yourself before Yahweh when you heard what I spoke against this place and against its inhabitants, that they would become a desolation and a curse, and because you tore your clothes and wept before me, I also have heard you, declares Yahweh.
  footnotes:
  - marker: a
    text: Or 'an astonishment and a curse.' The Hebrew שַׁמָּה can denote desolation, horror, or an object of astonishment in judgment contexts.
    reason: lexical_alternative
translation:
  language: ko
  text: 네 마음이 부드러웠고, 네가 야훼 앞에서 스스로를 낮추었으며, 내가 이곳과 그 주민들이 황폐와 저주가 될 것이라고 말한 것을 들었을 때 네가 옷을 찢고 내 앞에서 울었으므로, 나도 들었습니다. 야훼의 말씀입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘황폐’로 옮긴 히브리어 שַׁמָּה는 심판 문맥에서 ‘경악의 대상’ 또는 ‘참혹한 광경’을 뜻할 수도 있습니다.
    reason: lexical_alternative
