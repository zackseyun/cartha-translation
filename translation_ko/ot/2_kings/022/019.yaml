  lexicon: HALOT
  rationale: שַׁמָּה를 여기서는 심판 문맥의 ‘황폐’로 옮겨, POB의 lexical note가 지적한 ‘놀람/경악’ 가능성은 본문이 아니라 주석 여지로 남겼습니다.
- source_word: וַתִּקְרַע אֶת בְּגָדֶיךָ
