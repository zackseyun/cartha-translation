  - 여호와 앞에
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 옮기면서도, 신적 임재 앞에 선다는 의미를 유지했습니다.
- source_word: לִהְיוֹת לְשַׁמָּה וְלִקְלָלָה
