- from: 그는 야훼 보시기에 옳은 일을 행하고, 그의 아버지 다윗의 모든 길로 걸어갔으며, 오른쪽으로도 왼쪽으로도 치우치지 않았습니다.[a]
  to: 그는 야훼께서 보시기에 옳은 일을 하였고, 그의 아버지 다윗의 모든 길을 따라 걸었으며, 오른쪽으로도 왼쪽으로도 벗어나지 않았습니다.[a]
  rationale: 본문의 의미는 유지하면서, 한국어 조사와 동사 결합을 바로잡아 다윗의 길을 온전히 따른다는 히브리어 관용구를 자연스럽게 옮겼습니다. ‘벗어나지 않았습니다’는 סוּר의 길 비유와 ‘오른쪽/왼쪽’의 방향성을 ‘치우치지’보다 직접적으로 보존합니다.
