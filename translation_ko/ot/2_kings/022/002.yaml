base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/002.yaml
  text: He did what was right in the eyes of Yahweh and walked in all the way of David his father[a], and he did not turn aside to the right or to the left.
  footnotes:
  - marker: a
    text: Hebrew 'David his father' uses 'father' in the broader sense of ancestor or dynastic forefather.
    reason: cultural_note
translation:
  language: ko
  text: 그는 야훼 보시기에 옳은 일을 행하고, 그의 아버지 다윗의 모든 길로 걸어갔으며, 오른쪽으로도 왼쪽으로도 치우치지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 아버지’는 이 문맥에서 다윗이 요시야의 직계 부친이 아니라 왕조의 선조임을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행하고
  alternatives_korean:
  - 하였고
  - 행하였습니다
  lexicon: HALOT
  rationale: 문맥상 왕의 행위를 이어 주는 서술이므로 단순 과거보다 진행·열거를 살리는 ‘행하고’가 자연스럽고, 뒤의 동사구들과도 잘 연결됩니다.
- source_word: הַיָּשָׁר בְּעֵינֵי יְהוָה
  english_pob_choice: what was right in the eyes of Yahweh
  chosen_korean: 야훼 보시기에 옳은 일
  alternatives_korean:
  - 야훼 눈에 옳은 일
  - 야훼 앞에서 옳은 일
  lexicon: HALOT
  rationale: ‘보시기에’는 히브리어 관용구를 살리면서 한국어로도 자연스럽고, 하느님의 평가 기준을 분명히 드러냅니다.
- source_word: דָּוִד אָבִי/ו
  english_pob_choice: David his father
  chosen_korean: 그의 아버지 다윗
  alternatives_korean:
  - 다윗 그의 아버지
  - 조상 다윗
  lexicon: HALOT
  rationale: 히브리어의 ‘아버지’는 이 문맥에서 직계 부친이 아니라 왕조적 선조를 가리키므로, 본문은 직역하되 한국어에서는 관계를 자연스럽게 드러내는 표현을 택했습니다.
- source_word: וְלֹא סָר יָמִין וּשְׂמֹאול
  english_pob_choice: and he did not turn aside to the right or to the left
  chosen_korean: 오른쪽으로도 왼쪽으로도 치우치지 않았습니다
  alternatives_korean:
  - 오른쪽이나 왼쪽으로도 벗어나지 않았습니다
  - 오른편으로도 왼편으로도 기울지 않았습니다
  lexicon: HALOT
  rationale: ‘치우치다’는 방향 비유를 자연스럽게 전달하며, 관용적 표현인 ‘오른쪽으로도 왼쪽으로도’의 균형감을 유지합니다.
theological_decisions:
- issue: יהוה / YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
