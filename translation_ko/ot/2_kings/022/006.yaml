  text: for the craftsmen[a], and for the builders, and for the masons[c][b], and for buying timber and quarried stone to strengthen the house.
  footnotes:
  - marker: a
    text: That is, the temple, the house of the LORD in context.
    reason: cross_reference
  - marker: b
    text: Or 'hewn stone' / 'cut stone.'
    reason: lexical_alternative
  - marker: c
    text: '''Masons'' renders a term that more literally refers to those who build or repair walls/enclosures.'
    reason: lexical_alternative
translation:
  language: ko
  text: 공예가들에게와 건축하는 사람들에게와 담을 쌓는 사람들에게, 그리고 나무와 채석한 돌을 사는 데 쓰게 하여 집을 튼튼하게 하게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이는 여호와의 집, 곧 성전을 가리킵니다.
    reason: cross_reference
  - marker: b
    text: 또는 ‘다듬은 돌’, ‘깎은 돌’.
    reason: lexical_alternative
  - marker: c
    text: ‘담을 쌓는 사람들’은 이 말이 더 문자적으로는 벽이나 울타리를 세우거나 보수하는 일을 가리키기 때문입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחָרָשִׁים
  english_pob_choice: for the craftsmen
  chosen_korean: 공예가들에게
  alternatives_korean:
  - 기술자들에게
  - 장인들에게
  lexicon: HALOT
  rationale: חָרָשִׁים은 특정 목수만이 아니라 숙련된 기술자를 넓게 가리킬 수 있으므로, 건축 수리 맥락에서 폭넓은 의미를 살리는 ‘공예가들’을 택했습니다.
- source_word: וְלַבֹּנִים
  english_pob_choice: and for the builders
  chosen_korean: 건축하는 사람들에게
  alternatives_korean:
  - 짓는 사람들에게
  - 건축자들에게
  lexicon: HALOT
  rationale: בנה 계열의 분사적 명사로 실제로 짓는 사람들을 가리키므로, 자연스러운 현대어인 ‘건축하는 사람들’로 옮겼습니다.
- source_word: וְלַגֹּדְרִים
  english_pob_choice: and for the masons
  chosen_korean: 담을 쌓는 사람들에게
  alternatives_korean:
  - 벽을 수선하는 사람들에게
  - 석공들에게
  lexicon: HALOT
  rationale: גדר는 문자적으로는 울타리나 담을 두르거나 보수하는 일을 가리키므로, 단순히 직종명만 고정하기보다 동작을 드러내는 ‘담을 쌓는 사람들’이 원뜻을 더 잘 보여 줍니다.
- source_word: וְאַבְנֵי מַחְצֵב
  english_pob_choice: and quarried stone
  chosen_korean: 채석한 돌을
  alternatives_korean:
  - 다듬은 돌을
  - 깎은 돌을
  lexicon: HALOT
  rationale: מַחְצֵב은 채석장/채석한 것을 가리키므로, 현대 독자에게 가장 분명한 ‘채석한 돌’로 옮겼습니다.
theological_decisions:
- issue: אֶת הַבָּיִת의 지시 대상
  chosen_reading: 본문은 단순히 ‘집’이라고 하되, 문맥상 여호와의 성전을 가리킵니다.
  alternative_readings:
  - 직접 ‘성전’으로 옮김
  - ‘여호와의 집’으로 옮김
  rationale: 히브리어는 여기서 בַּיִת(집)이라고만 말하므로, 본문 표면을 보존하는 한편 문맥상 의미는 자연스럽게 이해되도록 처리했습니다.
  doctrine_reference: 문맥적 지시 대상 보존
- issue: לְחַזֵּק의 목적 의미
  chosen_reading: ‘튼튼하게 하게 하였습니다’로 결과적 목적을 살렸습니다.
  alternative_readings:
  - ‘강화하게 하였습니다’
  - ‘수리하게 하였습니다’
  rationale: חזק의 핵심 뜻은 ‘강하게 하다/튼튼하게 하다’이며, 이 구절에서는 수리와 보강이 함께 암시되므로 둘을 함께 드러내는 표현이 적절합니다.
  doctrine_reference: 어휘-문맥 절충
