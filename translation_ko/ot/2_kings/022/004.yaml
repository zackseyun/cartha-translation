  text: Go up to Hilkiah the high priest, and let him total the silver that has been brought into the house of Yahweh, which the keepers of the threshold have collected from the people.
  footnotes:
  - marker: a
    text: Or 'the doorkeepers'; literally 'the keepers of the threshold.'
    reason: lexical_alternative
translation:
  language: ko
  text: 힐기야 대제사장에게 올라가십시오. 그에게 야훼의 집으로 들어온 은, 곧 문지방을 지키는 사람들이 백성에게서 거둔 은의 합계를 내게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘문지방을 지키는 사람들’입니다. 문맥상 성전 출입문을 맡은 문지기들을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  english_pob_choice: Go up
  chosen_korean: 올라가서
  alternatives_korean:
  - 가서
  - 올라가십시오
  lexicon: HALOT
  rationale: עלה의 기본 방향성을 살려 ‘올라가다’로 옮기되, 명령형 흐름에 맞게 연결어미를 사용했습니다.
- source_word: וְיַתֵּם
  english_pob_choice: let him total
  chosen_korean: 그가 총계하게 하십시오
  alternatives_korean:
  - 그가 합계하게 하십시오
  - 그가 계산하게 하십시오
  - 그가 합산하게 하십시오
  lexicon: HALOT
  rationale: 회계적·행정적 문맥에서 ‘수량을 총계하다’는 뜻을 살려, 단순히 ‘끝내다’보다 계수 완료의 의미가 드러나도록 했습니다.
- source_word: שֹׁמְרֵי הַסַּף
  english_pob_choice: the keepers of the threshold
  chosen_korean: 문지방을 지키는 사람들
  alternatives_korean:
  - 문지방 지킴이들
  - 문지기들
  - 문간을 지키는 사람들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘문지방’과 기능 설명인 ‘지키는 사람들’을 함께 써서, 전통적이지만 모호할 수 있는 표현을 한국어에서 이해 가능하게 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: project glossary
  rationale: 프로젝트 기본 용례에 따라 신명기적 고유명사로서 ‘야훼’를 유지했습니다.
theological_decisions:
- issue: יהוה(야훼)의 표기
  chosen_reading: 본문의 신명사는 ‘야훼’로 직역하여 고유성을 보존했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 문맥상 일반 호칭이 아니라 언약의 신적 이름이므로, 제목어 ‘주’로 대체하지 않고 음역을 유지하는 것이 원문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
