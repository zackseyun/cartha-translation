id: 2KI.22.17
reference: 2 Kings 22:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: תַּ֣חַת אֲשֶׁ֣ר עֲזָב֗וּ/נִי וַֽ/יְקַטְּרוּ֙ לֵ/אלֹהִ֣ים אֲחֵרִ֔ים לְמַ֨עַן֙ הַכְעִיסֵ֔/נִי בְּ/כֹ֖ל מַעֲשֵׂ֣ה יְדֵי/הֶ֑ם וְ/נִצְּתָ֧ה חֲמָתִ֛/י בַּ/מָּק֥וֹם הַ/זֶּ֖ה וְ/לֹ֥א תִכְבֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/017.yaml
  text: because they have forsaken me and have made offerings to other gods[a], in order to provoke me to anger by all the work of their hands. Therefore my wrath has been kindled against this place, and it shall not be quenched.
  footnotes:
  - marker: a
    text: Or, more specifically, 'have burned incense to other gods.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 그들이 나를 버리고 다른 신들에게 제물을 바치며[a], 자기 손으로 한 모든 일로 나를 격노하게 하려고 했기 때문입니다. 그러므로 이곳에 내 진노가 불붙었고, 그것은 꺼지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 구체적으로, “다른 신들에게 향을 피우며.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲזָבוּנִי
  english_pob_choice: they have forsaken me
  chosen_korean: 나를 버리고
  alternatives_korean:
  - 나를 떠나고
  - 나를 저버리고
  lexicon: HALOT
  rationale: עזב는 단순한 이탈보다 관계적·언약적 단절을 담아 “버리다”가 가장 직접적입니다.
- source_word: וַיְקַטְּרוּ
  english_pob_choice: have made offerings
  chosen_korean: 분향하며
  alternatives_korean:
  - 제사를 드리며
  - 향을 피우며
  lexicon: HALOT
  rationale: 이 동사는 제의적 ‘연기 올림’ 행위를 가리키며, 본문과 평행 주석상 ‘분향하다’가 가장 자연스럽게 그 제의적 뉘앙스를 드러냅니다.
- source_word: לֵאלֹהִים אֲחֵרִים
  english_pob_choice: to other gods
  chosen_korean: 다른 신들에게
  alternatives_korean:
  - 이방 신들에게
  - 다른 신들에게 제사하며
  lexicon: HALOT
  rationale: 히브리어는 여호와가 아닌 다른 신격을 직접 가리키므로, 표준적이고 직설적인 “다른 신들”을 유지했습니다.
- source_word: לְמַעַן הַכְעִיסֵנִי
  english_pob_choice: in order to provoke me to anger
  chosen_korean: 나를 격노하게 하려고
  alternatives_korean:
  - 나를 노하게 하려고
  - 나를 화나게 하려고
  lexicon: HALOT
  rationale: הכעיס는 단순한 불쾌감보다 강한 격노를 유발하는 뜻이므로, 심판 문맥의 강도를 살려 “격노하게 하다”로 옮겼습니다.
- source_word: בְּכֹל מַעֲשֵׂה יְדֵיהֶם
  english_pob_choice: by all the work of their hands
  chosen_korean: 자신들의 손으로 만든 모든 일로
  alternatives_korean:
  - 자기 손의 모든 일로
  - 그들 손의 모든 소산으로
  lexicon: HALOT
  rationale: 히브리어 관용구는 우상 제작을 포함한 인간의 행위를 가리키므로, “손으로 만든”을 넣어 우상적·비판적 뉘앙스를 드러냈습니다.
- source_word: חֲמָתִי
  english_pob_choice: my wrath
  chosen_korean: 내 진노
  alternatives_korean:
  - 내 분노
  - 내 غض
  lexicon: HALOT
  rationale: חֵמָה/חֲמָה는 단순 감정보다 재판적·심판적 분노에 가깝기 때문에 “진노”가 가장 적절합니다.
- source_word: וְלֹא תִכְבֶּה
  english_pob_choice: and it shall not be quenched
  chosen_korean: 꺼지지 않을 것입니다
  alternatives_korean:
  - 진화되지 않을 것입니다
  - 식지 않을 것입니다
  lexicon: HALOT
  rationale: 불이 꺼지지 않는 이미지를 한국어로 자연스럽게 살리면서도, 심판의 비가역성을 분명히 하기 위해 “꺼지다”를 사용했습니다.
theological_decisions:
- issue: 분향과 우상숭배의 관계
  chosen_reading: “분향하며”를 사용해 제의적 행위를 직접 드러내되, 우상숭배의 대상은 “다른 신들”로 명시합니다.
  alternative_readings:
  - “향을 피우며”로 완화
  - “제사하며”로 일반화
  rationale: 본문은 단순한 종교행위가 아니라 다른 신들에게 드린 제의적 충성을 고발하므로, 분향의 구체성을 유지하는 편이 원문의 책망을 더 정확히 반영합니다.
  doctrine_reference: Translation philosophy §1, §3
- issue: 하나님의 진노 표현
  chosen_reading: “내 진노가 타올라 꺼지지 않을 것입니다”로 불의 이미지를 보존합니다.
  alternative_readings:
  - 단순히 “내 심판이 확정되었습니다”로 풀이
  - “내 분노가 계속될 것입니다”로 완화
  rationale: 히브리어는 불붙고 꺼지지 않는 진노의 은유를 사용하므로, 이를 추상화하지 않고 심판의 엄중함을 그대로 드러냅니다.
  doctrine_reference: Translation philosophy §1, §3
