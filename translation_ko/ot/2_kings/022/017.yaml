  to: 이는 그들이 나를 버리고 다른 신들에게 제물을 바치며[a], 자기 손으로 한 모든 일로 나를 격노하게 하려고 했기 때문입니다. 그러므로 이곳에 내 진노가 불붙었고, 그것은 꺼지지 않을 것입니다.
  rationale: קטר의 제의적 ‘태워 바침’ 의미를 본문에서는 ‘제물을 바치며’로 넓게 옮기고, ‘향을 피우며’라는 가능한 더 구체적 의미는 해당 어휘에 연결된 각주로 보존했습니다. ‘손의 모든 일’은 제작물로 한정하지 않고 ‘자기 손으로 한 모든 일’로 번역했습니다. 또한 진노가 ‘이곳에’ 불붙는다는 원문의 장소 표현과 불의 은유를 유지했습니다.
