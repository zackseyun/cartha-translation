id: 2KI.22.14
reference: 2 Kings 22:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ חִלְקִיָּ֣הוּ הַ֠/כֹּהֵן וַ/אֲחִיקָ֨ם וְ/עַכְבּ֜וֹר וְ/שָׁפָ֣ן וַ/עֲשָׂיָ֗ה אֶל חֻלְדָּ֨ה הַ/נְּבִיאָ֜ה אֵ֣שֶׁת שַׁלֻּ֣ם בֶּן תִּקְוָ֗ה בֶּן חַרְחַס֙ שֹׁמֵ֣ר הַ/בְּגָדִ֔ים וְ/הִ֛יא יֹשֶׁ֥בֶת בִּ/ירוּשָׁלִַ֖ם בַּ/מִּשְׁנֶ֑ה וַֽ/יְדַבְּר֖וּ אֵלֶֽי/הָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/014.yaml
  text: Then Hilkiah the priest[a], Ahikam, Achbor, Shaphan, and Asaiah went to Huldah the prophetess, the wife of Shallum son of Tikvah, son of Harhas, keeper of the wardrobe. She lived in Jerusalem in the Second Quarter[c][b], and they spoke to her.
  footnotes:
  - marker: a
    text: Or 'in the second district'; the Hebrew likely refers to a particular quarter of Jerusalem.
    reason: lexical_alternative
  - marker: b
    text: Literally 'keeper of the garments.'
    reason: lexical_alternative
  - marker: c
    text: Or 'they spoke to her.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 힐기야 제사장과 아히감과 악볼과 사반과 아사야가 여예언자 훌다, 곧 의복을 맡은 자 하르하스의 아들 틱바의 아들 살룸의 아내에게 갔습니다.[b] 훌다는 예루살렘의 제2구역에 살고 있었으며,[a] 그들은 훌다에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘둘째 구역’으로 옮길 수 있습니다. 히브리어는 예루살렘의 특정 구역을 가리키는 것으로 보입니다.
    reason: alternative_reading
  - marker: b
    text: 직역하면 ‘의복들을 지키는 자’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  english_pob_choice: the priest
  chosen_korean: 제사장
  alternatives_korean:
  - 대제사장
  lexicon: HALOT
  rationale: 히브리어는 단순히 ‘제사장’이라 하므로, 문맥상 알려진 직함을 덧붙여 ‘대제사장’으로 높이지 않고 그대로 옮겼습니다.
- source_word: חֻלְדָּה הַנְּבִיאָה
  english_pob_choice: Huldah the prophetess
  chosen_korean: 여선지자 훌다
  alternatives_korean:
  - 선지자 훌다
  lexicon: HALOT
  rationale: 여성형 표지를 살려 ‘여선지자’로 옮겼으며, 성별을 지우는 일반형보다 원문 정보를 더 직접적으로 반영했습니다.
- source_word: שֹׁמֵר הַבְּגָדִים
  english_pob_choice: keeper of the wardrobe
  chosen_korean: 의복을 맡은 자
  alternatives_korean:
  - 옷을 지키는 자
  - 의복 보관인
  lexicon: HALOT
  rationale: 직역하면 ‘옷/의복을 지키는 자’이지만, 관직적 기능을 드러내면서도 과도한 현대화는 피하기 위해 ‘의복을 맡은 자’로 옮겼습니다.
- source_word: בַּמִּשְׁנֶה
  english_pob_choice: in the Second Quarter
  chosen_korean: 제2구역
  alternatives_korean:
  - 둘째 구역
  - 제2지구
  lexicon: HALOT
  rationale: 예루살렘의 특정 지역명으로 보이므로 고유 지명성을 살려 ‘제2구역’으로 표기했습니다. 본문의 주석 가능성도 보존됩니다.
- source_word: וַיְדַבְּרוּ אֵלֶיהָ
  english_pob_choice: and they spoke to her
  chosen_korean: 그들이 그녀에게 말했습니다
  alternatives_korean:
  - 그들이 그녀와 말했습니다
  - 그들이 그녀에게 이야기했습니다
  lexicon: HALOT
  rationale: 히브리어는 직접 대화를 나타내므로 자연스러운 서술체로 옮겼습니다. POB의 ‘spoke to her’에 맞춰 방향성을 분명히 했습니다.
theological_decisions:
- issue: ‘הַנְּבִיאָה’의 성별 표지 처리
  chosen_reading: ‘여선지자’로 명시하여 여성 예언자임을 드러냄
  alternative_readings:
  - ‘선지자’로 중립화
  - ‘예언자’로 일반화
  rationale: 본문의 여성형은 우연적 장식이 아니라 정보이므로, 성별 표지를 유지하는 것이 원문 독자 이해를 더 정확하게 반영합니다.
  doctrine_reference: Translation philosophy §4
- issue: ‘הַכֹּהֵן’의 직함 범위
  chosen_reading: ‘제사장’으로만 번역
  alternative_readings:
  - ‘대제사장’으로 강화
  rationale: 본문 자체에 ‘대’에 해당하는 요소가 없으므로, 전승적 추정을 본문에 끌어들이지 않았습니다.
  doctrine_reference: Translation philosophy §1
