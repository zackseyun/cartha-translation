base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/010.yaml
  text: Then Shaphan the scribe told the king[a], saying, “Hilkiah the priest has given me a book.” And Shaphan read it before the king.
  footnotes:
  - marker: a
    text: Or “a scroll.” The Hebrew word can refer generally to a written document and does not itself specify the physical format.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 서기관 사반이 왕에게 아뢰며 말했습니다. “제사장 힐기야가 저에게 책 하나를 주었습니다.” 그리고 사반이 그것을 왕 앞에서 읽었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두루마리 하나를.” 히브리어 단어는 일반적으로 기록된 문서를 가리킬 수 있으며, 물리적 형식을 본문 자체가 특정하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: told
  chosen_korean: 아뢰며 말했습니다
  alternatives_korean:
  - 말했습니다
  - 알렸습니다
  lexicon: HALOT
  rationale: 왕에게 보고하는 궁중 맥락이므로 단순한 ‘말하다’보다 ‘아뢰다’가 관계를 더 정확히 드러내지만, 본문 흐름을 살려 현대적 합쇼체로 정리했습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 비서
  lexicon: HALOT
  rationale: 히브리어 סֹפֵר는 왕실 행정관을 가리킬 수 있으나, 한국어 성경에서 널리 인식되는 ‘서기관’이 직분과 역사적 배경을 가장 잘 보존합니다.
- source_word: סֵפֶר
  english_pob_choice: a book
  chosen_korean: 책 하나를
  alternatives_korean:
  - 두루마리 하나를
  - 문서 하나를
  lexicon: HALOT
  rationale: 히브리어는 물리 형식을 특정하지 않는 일반적인 문서명이라, POB의 ‘a book’에 맞춰 ‘책 하나’를 택하되 한국어에서 자연스럽게 들리도록 했습니다.
- source_word: וַיִּקְרָאֵהוּ
  english_pob_choice: read it
  chosen_korean: 그것을 … 읽었습니다
  alternatives_korean:
  - 그것을 읽어 내려갔습니다
  - 그것을 낭독했습니다
  lexicon: HALOT
  rationale: 문맥상 왕 앞에서의 공적 낭독이지만, 히브리어 동사는 단순히 읽는 행위를 가리킬 수 있어 과도하게 해석하지 않고 ‘읽었습니다’로 유지했습니다.
