  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יֹּאמֶר חִלְקִיָּ֜הוּ הַ/כֹּהֵ֤ן הַ/גָּדוֹל֙ עַל שָׁפָ֣ן הַ/סֹּפֵ֔ר סֵ֧פֶר הַ/תּוֹרָ֛ה מָצָ֖אתִי בְּ/בֵ֣ית יְהוָ֑ה וַ/יִּתֵּ֨ן חִלְקִיָּ֧ה אֶת הַ/סֵּ֛פֶר אֶל שָׁפָ֖ן וַ/יִּקְרָאֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/022/008.yaml
  text: Then Hilkiah the high priest said to Shaphan the scribe[a], “I have found the Book of the Law in the house of Yahweh.” And Hilkiah gave the book to Shaphan[c][b], and he read it.
  footnotes:
  - marker: a
    text: Or, “the scroll of the law.” The Hebrew סֵפֶר can refer to a scroll or book document.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: “in the house of the LORD,” that is, in the temple.'
    reason: cultural_note
  - marker: c
    text: Or, less likely, “and he read from it.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 힐기야 대제사장이 사반 서기관에게 말했습니다. “야훼의 집에서[b] 율법책을[a] 발견했습니다.” 그리고 힐기야가 그 책을 사반에게 주었고, 그가 그것을 읽었습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “율법 두루마리”. 히브리어 סֵפֶר은 두루마리나 책 문서를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어로는 “야훼의 집에서”인데, 곧 성전을 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는, 가능성은 더 낮지만, “그것에서 읽었습니다”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַגָּדוֹל
  english_pob_choice: the high priest
  chosen_korean: 대제사장
  alternatives_korean:
  - 큰 제사장
  - 최고 제사장
  lexicon: HALOT
  rationale: 표준적인 직함으로서 ‘high priest’의 의미를 가장 자연스럽고 정확하게 옮깁니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 기록관
  - 비서
  lexicon: HALOT
  rationale: 고대 행정·문서 담당 관직을 가리키는 표현이므로, 전통적이면서도 직역성을 살리는 ‘서기관’이 적절합니다.
- source_word: סֵפֶר הַתּוֹרָה
  english_pob_choice: the Book of the Law
  chosen_korean: 율법책
  alternatives_korean:
  - 율법의 책
  - 율법 두루마리
  lexicon: HALOT
  rationale: תּוֹרָה를 이 문맥에서는 율법으로 옮기고, סֵפֶר은 문서로서의 책/두루마리 의미가 있으나 본문 발견의 뉘앙스를 살려 간결한 ‘율법책’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 신명기의 이름인 יְהוָה를 제목이 아닌 고유명으로 보존하기 위해, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: וַיִּקְרָאֵהוּ
  english_pob_choice: and he read it
  chosen_korean: 그것을 읽었습니다
  alternatives_korean:
  - 그것을 읽어 보았습니다
  - 그것을 읽어 갔습니다
  lexicon: HALOT
  rationale: 대명사 목적어를 자연스럽게 살려, 문맥상 가장 직접적인 ‘그것을 읽었습니다’로 옮겼습니다. 주어는 앞의 문맥상 사반으로 읽힙니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 고유명사 ‘야훼’로 유지했습니다.
  alternative_readings:
  - ‘주’
  - ‘여호와’
  rationale: 본문이 야훼의 개인 이름을 직접 사용하므로, 제목화된 대체어보다 고유명사 보존이 원문 의미를 더 잘 드러냅니다.
  doctrine_reference: 'POB terminology: יְהוָה / YHWH → 야훼'
