  text: וַ/יִּשְׁלַ֤ח יֵהוּא֙ בְּ/כָל יִשְׂרָאֵ֔ל וַ/יָּבֹ֨אוּ֙ כָּל עֹבְדֵ֣י הַ/בַּ֔עַל וְ/לֹֽא נִשְׁאַ֥ר אִ֖ישׁ אֲשֶׁ֣ר לֹֽא בָ֑א וַ/יָּבֹ֨אוּ֙ בֵּ֣ית הַ/בַּ֔עַל וַ/יִּמָּלֵ֥א בֵית הַ/בַּ֖עַל פֶּ֥ה לָ/פֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/021.yaml
  text: So Jehu sent throughout all Israel[a], and all the worshipers of Baal came; not a man was left who did not come. They entered the house of Baal, and the house of Baal was filled from end to end.
  footnotes:
  - marker: a
    text: Hebrew literally, 'mouth to mouth,' an idiom meaning the house was completely filled, from one end to the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 예후가 온 이스라엘에 사람을 보내자 바알의 모든 섬기는 자들이 다 왔고, 오지 않은 사람은 하나도 남지 않았습니다. 그들이 바알의 집에 들어가니, 바알의 집이 이 끝에서 저 끝까지 가득 찼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘입에서 입까지’이며, 공간이 한쪽 끝에서 다른 쪽 끝까지 빈틈없이 가득 찼음을 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח יֵהוּא בְּכָל יִשְׂרָאֵל
  english_pob_choice: So Jehu sent throughout all Israel
  chosen_korean: 예후가 온 이스라엘에 사람을 보내자
  alternatives_korean:
  - 예후가 온 이스라엘에 보냈습니다
  - 예후가 온 이스라엘에 전갈을 보냈습니다
  lexicon: HALOT
  rationale: בְּכָל יִשְׂרָאֵל의 포괄성을 살려 ‘온 이스라엘에’로 옮기고, שׁלח는 문맥상 소집/전달의 의미이므로 자연스럽게 ‘사람을 보내자’로 표현했습니다.
- source_word: עֹבְדֵי הַבַּעַל
  english_pob_choice: the worshipers of Baal
  chosen_korean: 바알의 모든 섬기는 자들
  alternatives_korean:
  - 바알을 섬기는 자들
  - 바알의 예배자들
  lexicon: HALOT
  rationale: עבד는 일반적으로 ‘섬기다’이지만, 우상 숭배 문맥에서는 종교적 예속을 드러내는 ‘섬기는 자들’이 원문과 가장 가깝습니다. ‘예배자들’은 현대 한국어에서 다소 교회적 뉘앙스를 가질 수 있어 피했습니다.
- source_word: וְלֹא נִשְׁאַר אִישׁ אֲשֶׁר לֹא בָא
  english_pob_choice: not a man was left who did not come
  chosen_korean: 오지 않은 사람은 하나도 남지 않았습니다
  alternatives_korean:
  - 한 사람도 남지 않았습니다
  - 오지 않은 남자는 하나도 남지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 보편적 참석을 강조하지만 한국어에서는 ‘사람’이 더 자연스러워 의미를 살렸습니다. 대표적 남성 단수 אִישׁ의 형식을 지나치게 직역해 어색해지는 것은 피했습니다.
- source_word: פֶּה לָפֶה
  english_pob_choice: from end to end
  chosen_korean: 이 끝에서 저 끝까지
  alternatives_korean:
  - 끝에서 끝까지
  - 가득 차게
  lexicon: HALOT
  rationale: 직역하면 ‘입에서 입까지’이지만, 관용적으로 공간이 완전히 차 있음을 뜻하므로 ‘이 끝에서 저 끝까지’로 옮겨 원문의 압축된 의미를 드러냈습니다.
theological_decisions:
- issue: אַחֵדִים? no explicit theological tension; cultic terminology for Baal worship
  chosen_reading: ‘섬기는 자들’로 옮겨 바알 숭배의 종교적 헌신을 분명히 드러냈습니다.
  alternative_readings:
  - ‘종들’로 옮김
  - ‘예배자들’로 옮김
  rationale: 이 본문은 서술적 역사 문장으로 신학적 해석을 덧붙이기보다, 바알에 대한 헌신이 실제로 소집되었다는 사실을 그대로 드러내는 것이 중요합니다.
  doctrine_reference: 'Translation philosophy: source-direct historical narration'
