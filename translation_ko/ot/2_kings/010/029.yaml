source:
  edition: WLC
  text: רַ֠ק חֲטָאֵ֞י יָרָבְעָ֤ם בֶּן נְבָט֙ אֲשֶׁ֣ר הֶחֱטִ֣יא אֶת יִשְׂרָאֵ֔ל לֹֽא סָ֥ר יֵה֖וּא מֵ/אַֽחֲרֵי/הֶ֑ם עֶגְלֵי֙ הַ/זָּהָ֔ב אֲשֶׁ֥ר בֵּֽית אֵ֖ל וַ/אֲשֶׁ֥ר בְּ/דָֽן־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/029.yaml
  text: Only[a], Jehu did not turn away from the sins of Jeroboam son of Nebat, by which he caused Israel to sin—the golden calves that were at Bethel and at Dan.
  footnotes:
  - marker: a
    text: Or 'did not depart from them'; the Hebrew idiom is literally 'did not turn away from after them.'
    reason: lexical_alternative
translation:
  language: ko
  text: 다만 여로보암의 아들 느밧의 죄들, 곧 이스라엘이 죄를 짓게 한 그 죄들에서 예후는 물러서지 않았습니다—벧엘과 단에 있는 그 금송아지들이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들을 따라 뒤로 물러서지 않았다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  english_pob_choice: Only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 그러나
  lexicon: HALOT
  rationale: 앞뒤 문맥의 예후에 대한 평가를 제한하는 역접·예외의 뉘앙스를 간결하게 살리기 위해 ‘다만’을 택했습니다.
- source_word: לֹא סָר מֵאַחֲרֵיהֶם
  english_pob_choice: did not turn away from following them
  chosen_korean: 물러서지 않았습니다
  alternatives_korean:
  - 돌이키지 않았습니다
  - 그들을 따르던 길에서 떠나지 않았습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 ‘그 뒤에서 돌이키지 않았다’는 뜻이므로, 현대 한국어에서 자연스러운 ‘물러서지 않았다’로 옮겨 지속성을 드러냈습니다.
- source_word: עֶגְלֵי הַזָּהָב
  english_pob_choice: the golden calves
  chosen_korean: 그 금송아지들이었습니다
  alternatives_korean:
  - 황금 송아지들이었습니다
  - 금으로 된 송아지들이었습니다
  lexicon: HALOT
  rationale: 예로보암의 우상숭배 대상을 구체적으로 지시하는 표현이므로 관용적인 ‘금송아지’로 옮기되, 정관성을 살리기 위해 ‘그’를 붙였습니다.
- source_word: בֵּית אֵל וַאֲשֶׁר בְּדָן
  english_pob_choice: that were at Bethel and at Dan
  chosen_korean: 벧엘과 단에 있는
  alternatives_korean:
  - 벧엘과 단에 있었던
  - 벧엘과 단에 있던
  lexicon: HALOT
  rationale: 장소를 지시하는 יחס절을 현대 한국어의 위치 표현으로 자연스럽게 풀어, 예배처의 지리적 위치가 드러나게 했습니다.
theological_decisions:
- issue: ‘예후는 물러서지 않았습니다’의 도덕적 평가 보존
  chosen_reading: 본문은 예후의 다른 행위가 어떠했든, 예로보암의 죄를 계속 따랐다는 평가를 유지합니다.
  alternative_readings:
  - ‘계속 따랐습니다’로 더 직접적으로 옮길 수 있습니다.
  - ‘떠나지 않았습니다’로 더 문자적으로 옮길 수 있습니다.
  rationale: 히브리어의 부정 관용구는 단순한 이동이 아니라 이전 우상숭배 체계에 대한 지속적 결부를 뜻하므로, 그 신학적 평가를 흐리지 않도록 했습니다.
  doctrine_reference: 왕하 10:29의 역사서적 평가 구조
