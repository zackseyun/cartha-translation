  yaml_path: translation/ot/2_kings/010/035.yaml
  text: And Jehu lay down with his fathers, and they buried him in Samaria. And Jehoahaz his son became king in his place.
translation:
  language: ko
  text: '여호와가 아들로 세운 왕이에요? 아니, 이 구절은 역사 서술이므로 합쇼체로 가야 합니다.


    예후는 그의 조상들과 함께 누웠고, 사람들이 그를 사마리아에 장사했습니다. 그리고 그의 아들 여호아하스가 그의 뒤를 이어 왕이 되었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘누웠고’는 이곳의 관용적 죽음 표현을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누웠고
  alternatives_korean:
  - 죽었고
  - 잠들었고
  lexicon: HALOT
  rationale: 왕의 사망 보고에서 쓰이는 관용구를 직역 쪽으로 살려, 단순한 ‘죽었다’보다 히브리어의 표현성을 유지했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들과 함께
  lexicon: HALOT
  rationale: 직역상 ‘아버지들’이지만 한국어에서는 오해를 줄이기 위해 왕조적·조상적 의미를 드러내는 ‘조상들’을 택했습니다.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  english_pob_choice: they buried him
  chosen_korean: 사람들이 그를 장사했습니다
  alternatives_korean:
  - 그를 묻었습니다
  - 그를 장사했습니다
  lexicon: HALOT
  rationale: 히브리어의 3인칭 복수 능동형을 살리면서, 왕실 매장 맥락에 맞는 ‘장사하다’를 사용했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king ... in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그 자리를 대신해 왕이 되었습니다
  - 그 뒤에 왕이 되었습니다
  lexicon: HALOT
  rationale: 승계 공식의 핵심은 선왕의 자리를 대체하는 것이라서, 한국어에서 자연스럽고 명확한 ‘뒤를 이어’로 옮겼습니다.
