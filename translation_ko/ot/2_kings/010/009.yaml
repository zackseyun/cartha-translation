  text: And it happened in the morning that he went out and stood and said to all the people[a], “You are righteous. Look, I conspired against my master and killed him, but who struck down all these?”
  footnotes:
  - marker: a
    text: Or “You are righteous” / “You are in the right.” The Hebrew can denote being just or being free from blame; here the public-judicial sense favors “innocent.”
    reason: lexical_alternative
translation:
  language: ko
  text: 아침이 되자 그가 나와 서서 온 백성에게 말했습니다. 「너희는 의롭습니다. 보십시오, 나는 내 주를 거슬러 모반하여 그를 죽였지만, 이 모든 사람을 누가 쳤습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희는 죄가 없습니다”, “너희는 옳습니다”. 히브리어는 의로움과 책임 없음 둘 다를 나타낼 수 있으나, 여기서는 공적·법정적 문맥이 강합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  english_pob_choice: in the morning
  chosen_korean: 아침이 되자
  alternatives_korean:
  - 아침에
  - 아침 무렵에
  lexicon: HALOT
  rationale: 히브리어 내러티브 공식의 시간 전환을 자연스럽게 살리되, 한국어 문장 흐름은 매끄럽게 유지했습니다.
- source_word: צַדִּקִים אַתֶּם
  english_pob_choice: You are righteous
  chosen_korean: 너희는 의롭습니다
  alternatives_korean:
  - 너희는 죄가 없습니다
  - 너희는 옳습니다
  lexicon: HALOT
  rationale: POB의 공적·법정적 뉘앙스를 따라 moral judgment보다 ‘의롭다’로 옮겼습니다. 문맥상 책임 없음의 선언이지만, 본문 어휘와의 대응을 우선했습니다.
- source_word: קָשַׁרְתִּי עַל
  english_pob_choice: I conspired against
  chosen_korean: 나는 …를 거슬러 모반하여
  alternatives_korean:
  - 나는 …를 상대로 음모를 꾸며
  - 나는 …를 배반하여
  lexicon: HALOT
  rationale: קשר의 반역·음모 의미를 살려 ‘모반하다’로 옮겼고, עַל의 대상을 ‘거슬러’로 표시해 정치적 반란의 방향을 드러냈습니다.
- source_word: אֲדֹנִי
  english_pob_choice: my master
  chosen_korean: 내 주
  alternatives_korean:
  - 내 주인
  - 나의 상전
  lexicon: HALOT
  rationale: 여기서는 신적 칭호가 아니라 왕권 아래의 상관을 가리키므로, 직역성과 한국어 자연성을 함께 고려해 ‘내 주’로 옮겼습니다.
theological_decisions:
- issue: צַדִּקִים אַתֶּם의 법정적 선언을 어떻게 한국어로 드러낼지
  chosen_reading: ‘너희는 의롭습니다’로 두어, 무죄 선포의 공적 성격을 본문 어휘 수준에서 유지했습니다.
  alternative_readings:
  - ‘너희는 죄가 없습니다’
  - ‘너희는 옳습니다’
  rationale: 이 구절은 윤리적 칭찬이 아니라 정치적 폭력에 대한 책임 부재를 선언하는 자리이므로, 지나치게 완화된 표현보다 원어의 공적 선언을 살리는 번역이 적합합니다.
  doctrine_reference: 법정적/공적 무죄 선언의 문맥
