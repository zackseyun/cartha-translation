    rationale: 예후는 백성의 도덕적 의로움을 칭찬하기보다 살해 사건에 관하여 그들을 무책임자로 선언합니다. 본문은 ‘너희에게는 죄가 없습니다’로 옮기고, 어휘적 대안은 각주에 보존하는 것이 적절합니다.
  - severity: low
    issue: ‘내 주’는 한국어에서 신적 ‘주’로 오해될 수 있습니다.
    rationale: 문맥의 아도니는 예후의 주인·상관인 왕을 가리키므로 ‘내 주인’이 더 분명합니다.
  - severity: low
