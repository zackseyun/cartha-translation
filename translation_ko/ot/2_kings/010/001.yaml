source:
  edition: WLC
  text: וּ/לְ/אַחְאָ֛ב שִׁבְעִ֥ים בָּנִ֖ים בְּ/שֹׁמְר֑וֹן וַ/יִּכְתֹּב֩ יֵה֨וּא סְפָרִ֜ים וַ/יִּשְׁלַ֣ח שֹׁמְר֗וֹן אֶל שָׂרֵ֤י יִזְרְעֶאל֙ הַ/זְּקֵנִ֔ים וְ/אֶל הָ/אֹמְנִ֥ים אַחְאָ֖ב לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/001.yaml
  text: Now Ahab had seventy sons in Samaria[a]. And Jehu wrote letters and sent them to Samaria, to the rulers of Jezreel, the elders, and the guardians of Ahab's sons, saying[b],
  footnotes:
  - marker: a
    text: 'Hebrew: ''to the officials of Jezreel.'' Since the letters are said to be sent to Samaria, some understand this as referring to Jezreel-associated officials residing there, while some ancient versions and interpreters favor ''officials of Samaria.'' The main text preserves the Masoretic wording.'
    reason: textual_variant
  - marker: b
    text: Or 'foster fathers' or 'caretakers' for 'guardians.' The Hebrew refers to those responsible for rearing or overseeing Ahab's sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 아합에게는 사마리아에 칠십 명의 아들들이 있었습니다. 예후는 편지를 써서 사마리아로 보내되, 이스르엘의 고관들과 장로들, 그리고 아합의 아들들을 돌보는 보호자들에게 보내며 말했습니다[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 본문은 문자적으로 ‘이스르엘의 고관들’이라고 합니다. 편지는 사마리아로 보내진다고 하므로, 여기에는 사마리아에 있는 이스르엘 관련 관리들을 가리킨다는 이해와 본문을 그대로 유지한 이해가 모두 가능합니다.
    reason: textual_variant
  - marker: b
    text: ‘보호자들’은 아합의 아들들을 양육하거나 감독하던 사람들을 가리킵니다. 영어 POB의 취지를 따라 역할을 풀어 적었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַחְאָב
  english_pob_choice: Now Ahab had
  chosen_korean: 그때 아합에게는
  alternatives_korean:
  - 아합에게는
  - 이제 아합에게는
  lexicon: HALOT
  rationale: 문두의 ו+ל은 단순 소유보다 화제 전환을 나타내므로, 한국어에서는 자연스럽게 상황 제시를 하는 ‘그때 아합에게는’으로 옮겼습니다.
- source_word: שִׁבְעִים בָּנִים
  english_pob_choice: seventy sons
  chosen_korean: 칠십 명의 아들들
  alternatives_korean:
  - 칠십 아들
  - 칠십 명의 자녀들
  lexicon: HALOT
  rationale: 왕위 계승 맥락에서 בָּנִים의 남성적 의미가 중요하므로 ‘아들들’을 유지했고, 수량 표현은 한국어 관용에 맞게 ‘칠십 명의’로 처리했습니다.
- source_word: אֶל שָׂרֵי יִזְרְעֶאל
  english_pob_choice: to the officials of Jezreel
  chosen_korean: 이스르엘의 고관들
  alternatives_korean:
  - 이스르엘의 관리들
  - 이스르엘의 지도자들
  lexicon: HALOT
  rationale: שָׂרִים은 지위가 있는 통치·행정 인물을 가리키므로, 영어 POB의 lexical range를 반영해 ‘고관들’로 옮겼습니다. 본문은 사마리아로 보내는 편지 수신처가 ‘이스르엘의 고관들’이라는 난점을 그대로 보존합니다.
- source_word: הַזְּקֵנִים
  english_pob_choice: the elders
  chosen_korean: 장로들
  alternatives_korean:
  - 원로들
  - 연장자들
  lexicon: HALOT
  rationale: 공적·공동체적 지도층을 가리키는 용례이므로 ‘장로들’이 가장 직접적입니다.
- source_word: הָאֹמְנִים
  english_pob_choice: the guardians
  chosen_korean: 아합의 아들들을 돌보는 보호자들
  alternatives_korean:
  - 양육자들
  - 후견인들
  - 보호자들
  lexicon: HALOT
  rationale: אמן 계열 분사는 왕자들을 길러 주거나 감독하는 책임자를 뜻하므로, 한국어로는 역할을 풀어 ‘아합의 아들들을 돌보는 보호자들’이라 했습니다.
- source_word: סְפָרִים
  english_pob_choice: letters
  chosen_korean: 편지
  alternatives_korean:
  - 서신
  - 문서
  lexicon: HALOT
  rationale: 서면 통신문을 뜻하므로 현대 한국어에서는 가장 자연스러운 ‘편지’가 적절합니다.
