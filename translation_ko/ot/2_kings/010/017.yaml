    rationale: עַד הִשְׁמִידוֹ는 그가 남은 자들을 쳐서 멸절에 이르게 한 종결 관계를 나타냅니다. ‘쳐 죽여 그들을 멸절시켰습니다’도 결과를 전달하지만, ‘때까지’ 표현을 보완하면 원문의 진행 관계를 더 잘 반영합니다.
