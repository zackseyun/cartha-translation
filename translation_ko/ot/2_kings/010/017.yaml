  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
  footnotes:
  - marker: a
    text: Or, 'until he had destroyed it,' with the suffix understood as referring collectively to Ahab's house rather than to Ahab personally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 사마리아에 이르러, 사마리아에 남아 있던 아합에게 속한 모든 사람을 쳐 죽여 그들을 멸절할 때까지 하였습니다. 이는 야훼께서 엘리야에게 하신 말씀대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘그를/그것을 멸절할 때까지’라고 단수 접미사를 사용합니다. 이 접미사는 아합 개인이 아니라 아합의 집안을 집합적으로 가리킬 수 있습니다.
    reason: alternative_reading
