  text: When he came to Samaria[a], he struck down all who remained of Ahab in Samaria, until he had destroyed them, according to the word of Yahweh that he had spoken to Elijah.
  footnotes:
  - marker: a
    text: Or, 'until he had destroyed it,' with the suffix understood as referring collectively to Ahab's house rather than to Ahab personally.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 사마리아에 이르자, 사마리아에 남아 있던 아합에게 속한 사람들을 모두 쳐 죽여 그들을 멸절시켰습니다. 이는 야훼께서 엘리야에게 말씀하신 야훼의 말씀대로였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 그것을 멸절시켰을 때까지’로도 옮길 수 있습니다. 히브리어의 단수 접미사는 아합 개인보다 아합 집안을 집합적으로 가리키는 것으로 이해될 수 있습니다.
    reason: alternative_reading
