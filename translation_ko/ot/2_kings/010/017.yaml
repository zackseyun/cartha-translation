  source_fidelity: 본문은 사마리아의 반복, 아합에게 속한 남은 사람들, 살해와 멸절, 그리고 야훼께서 엘리야에게 하신 말씀의 성취를 대체로 충실히 반영합니다. 다만 히브리어 עַד הִשְׁמִידוֹ의 ‘~할 때까지’라는 종결·완결의 관계가 현 번역에서는 독립된 연속 동작처럼 약화되었고, 단수 접미사의 집합적 선행사 가능성도 본문과 각주가 더 명료하게 연결될 필요가 있습니다.
  naturalness: ‘야훼께서 엘리야에게 말씀하신 야훼의 말씀대로’는 ‘야훼’와 ‘말씀’이 불필요하게 반복되어 다소 부자연스럽습니다. ‘야훼께서 엘리야에게 하신 말씀대로’가 현대 한국어 합쇼체에서 자연스럽고 의미도 보존합니다.
  terminology: ‘사마리아’, ‘아합’, ‘엘리야’, ‘야훼’, ‘멸절시키다’는 적절합니다. ‘아합에게 속한 사람들’도 לְאַחְאָב의 관계를 무리 없이 드러냅니다.
  issues:
