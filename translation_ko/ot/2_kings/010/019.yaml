base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/019.yaml
  text: Now summon to me all the prophets of Baal[a], all his worshipers, and all his priests; let no man be missing, for I have a great sacrifice for Baal. Whoever is missing shall not live.” But Jehu did it in deceit[b], in order to destroy the worshipers of Baal.
  footnotes:
  - marker: a
    text: Or, “let no one be missing.” The Hebrew reads “let not a man be missing,” using a singular masculine form generically.
    reason: lexical_alternative
  - marker: b
    text: Or, “with cunning” / “by trickery.”
    reason: lexical_alternative
translation:
  language: ko
  text: “이제 바알의 모든 예언자들과 그의 모든 숭배자들과 그의 모든 제사장들을 내게로 불러오너라. 한 사람도[a] 빠지지 않게 하라. 내가 바알에게 드릴 큰 제사가 있기 때문이다. 빠지는 자는 누구든지 살지 못할 것이다.” 그러나 예후는 바알의 숭배자들을 멸하려고 속임수로[b] 그렇게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수형 ‘한 사람’을 써서 각 개인이 빠지지 않도록 하라는 뜻을 나타냅니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘간계로’, ‘교묘하게’.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֵי הַבַּעַל
  english_pob_choice: the prophets of Baal
  chosen_korean: 바알의 모든 예언자들
  alternatives_korean:
  - 바알의 예언자들
  lexicon: HALOT
  rationale: 소유 관계를 자연스럽게 살리면서, 집합 전체를 강조하는 כָּל을 ‘모든’으로 옮겨 우상 숭배 집단의 전면적 소집임을 드러냈습니다.
- source_word: עֹבְדָיו
  english_pob_choice: his worshipers
  chosen_korean: 그의 모든 숭배자들
  alternatives_korean:
  - 그의 종들
  - 그를 섬기는 자들
  lexicon: HALOT
  rationale: 문맥상 일반적 ‘종들’보다 종교적 충성을 분명히 하는 ‘숭배자들’이 원문의 제의적 의미를 더 잘 드러냅니다.
- source_word: קִרְאוּ אֵלַי
  english_pob_choice: summon to me
  chosen_korean: 내게로 불러오너라
  alternatives_korean:
  - 내게로 소집하라
  - 내게로 부르라
  lexicon: HALOT
  rationale: 왕의 명령처럼 공개적으로 사람들을 자기 앞에 모으는 뉘앙스를 살려 ‘불러오다’보다 강한 ‘불러오너라’를 선택했습니다.
- source_word: אִישׁ אַל יִפָּקֵד
  english_pob_choice: let no man be missing
  chosen_korean: 아무도 빠지는 자가 없게 하라
  alternatives_korean:
  - 한 사람도 빠지지 않게 하라
  - 남자 하나도 빠지지 말게 하라
  lexicon: HALOT
  rationale: 히브리어의 단수형 אִישׁ을 한국어에서 어색하지 않게 살리되, 성별 제한보다 ‘누락 없음’에 초점을 맞춰 경계 명령의 기능을 전달했습니다.
- source_word: בְעָקְבָּה
  english_pob_choice: in deceit
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만으로
  - 간계로
  lexicon: HALOT
  rationale: 서술자의 평가를 드러내는 핵심 부사적 표현이므로, 한국어에서 가장 직접적이고 자연스러운 ‘속임수로’를 택했습니다.
theological_decisions:
- issue: 예후의 계획에 대한 서술자 평가 유지
  chosen_reading: 예후는 … 멸하려고 속임수로 그렇게 했습니다.
  alternative_readings:
  - 예후는 … 지혜롭게 그렇게 했습니다.
  - 예후는 … 꾀를 써서 그렇게 했습니다.
  rationale: 원문은 예후의 행동을 중립적 지략이 아니라 ‘속임수’로 규정하므로, 이를 완화하지 않고 윤리적 긴장을 그대로 보존했습니다.
  doctrine_reference: 서술자의 도덕적 평가를 해석적으로 중화하지 말 것
- issue: 직접 인용과 서술 전환의 문체 처리
  chosen_reading: 직접 인용은 명령형/예고문체를 유지하고, 서술은 합쇼체로 전환했습니다.
  alternative_readings:
  - 전 구절을 동일한 합쇼체로 평탄화
  - 직접 인용까지 모두 공손체로 통일
  rationale: 히브리어 본문이 예후의 명령과 서술자 코멘트를 구분하므로, 인용 내부의 권위적 명령성과 바깥 서술의 문체를 구분해 독자가 구조를 즉시 파악하도록 했습니다.
  doctrine_reference: 인용 구조와 화자 전환을 보존
