  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘살아 있는 채로 잡으라/잡아’는 반복을 보존하면서도 자연스럽고, ‘그들 가운데 한 사람도 남기지 않았습니다’는 총체적 파멸의 뜻을 명료하게 전달합니다.
  terminology: 고유 지명은 ‘벧에겟’으로 음역하고, בּוֹר는 ‘구덩이’로, שׁחט는 ‘도살하다’로 옮겼습니다. 번역은 지명의 어원적 뜻을 본문에 부과하지 않으며, ‘한 사람도’는 אִישׁ가 강조하는 남성 인원과 전무함을 문맥에 맞게 반영합니다.
