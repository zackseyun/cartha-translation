source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ תִּפְשׂ֣וּ/ם חַיִּ֔ים וַֽ/יִּתְפְּשׂ֖וּ/ם חַיִּ֑ים וַֽ/יִּשְׁחָט֞וּ/ם אֶל בּ֣וֹר בֵּֽית עֵ֗קֶד אַרְבָּעִ֤ים וּ/שְׁנַ֨יִם֙ אִ֔ישׁ וְ/לֹֽא הִשְׁאִ֥יר אִ֖ישׁ מֵ/הֶֽם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/014.yaml
  text: And he said[a], “Capture them alive.” So they captured them alive and slaughtered them at the pit of Beth-eked, forty-two men[c][b]; he did not leave a man of them.
  footnotes:
  - marker: a
    text: Or “by the pit” or “into the pit.” The Hebrew preposition can be understood in more than one spatial sense here.
    reason: lexical_alternative
  - marker: b
    text: Beth-eked is a place name; the Hebrew may reflect an underlying meaning such as “house of binding/gathering,” but it functions here as a proper name.
    reason: cultural_note
  - marker: c
    text: Hebrew “he left not a man of them,” emphasizing that none survived.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 말했습니다. 「그들을 살아 있는 채로 잡으십시오.」 그래서 그들은 그들을 살아 있는 채로 잡아, 벧에겔의 구덩이에서 마흔두 명을 죽였습니다. 그는 그들 중 한 사람도 남기지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벧에겔’은 고유 지명으로 음역했습니다. 히브리어는 ‘묶음/매임’ 같은 어감을 가질 수 있지만, 여기서는 장소 이름으로 기능합니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 표현은 “그들 가운데 한 사람도 남기지 않았다”는 뜻으로, 전원이 죽었음을 강조합니다.
    reason: source_note
  - marker: c
    text: ‘살아 있는 채로’는 죽이지 말고 생포하라는 뜻을 분명히 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְשׂוּם / וַיִּתְפְּשׂוּם
  english_pob_choice: capture them alive / they captured them alive
  chosen_korean: 살아 있는 채로 잡으십시오 / 살아 있는 채로 잡아
  alternatives_korean:
  - 붙잡으십시오 / 붙잡아
  - 사로잡으십시오 / 사로잡아
  lexicon: HALOT
  rationale: תפשׂ는 단순한 ‘잡다’보다 대상을 제압하여 붙들어 두는 뜻이 강하므로, 문맥상 ‘살아 있는 채로’와 결합해 ‘잡다’로 옮기되 상태를 분명히 했습니다.
- source_word: חַיִּים
  english_pob_choice: alive
  chosen_korean: 살아 있는 채로
  alternatives_korean:
  - 살아 있게
  - 생포하여
  lexicon: HALOT
  rationale: 명령문과 서술문에서 모두 죽이지 말고 생포하라는 의미이므로, 한국어에서는 자연스럽고 명확한 부사구인 ‘살아 있는 채로’를 사용했습니다.
- source_word: וַיִּשְׁחָטוּם
  english_pob_choice: slaughtered them
  chosen_korean: 죽였습니다
  alternatives_korean:
  - 도살했습니다
  - 도륙했습니다
  lexicon: HALOT
  rationale: שׁחט는 본래 ‘도살하다/도륙하다’의 강한 표현이지만, 한국어에서 너무 잔혹한 어감을 피하면서도 처형의 폭력성을 유지하는 동사로 ‘죽였습니다’를 택했습니다.
- source_word: אֶל בּוֹר בֵּית עֵקֶד
  english_pob_choice: at the pit of Beth-eked
  chosen_korean: 벧에겔의 구덩이에서
  alternatives_korean:
  - 벧에겔의 구덩이에서
  - 벧에겔 구덩이에서
  - 구덩이 곁의 벧에겔에서
  lexicon: HALOT
  rationale: אֶל은 이 문맥에서 장소를 가리키는 방향/지점으로 쓰여 영어 POB의 ‘at the pit’을 반영할 수 있으며, 지명은 음역하여 고유명사로 유지했습니다.
- source_word: מֵהֶם
  english_pob_choice: he did not leave a man of them
  chosen_korean: 그들 중 한 사람도 남기지 않았습니다
  alternatives_korean:
  - 그들 중 한 사람도 남겨 두지 않았습니다
  - 그들 가운데 한 사람도 남기지 않았습니다
  lexicon: HALOT
  rationale: 히브리어는 ‘한 사람도 남기지 않다’는 전면적 소멸을 강조하므로, 남김의 부정으로 총체성을 살렸습니다.
