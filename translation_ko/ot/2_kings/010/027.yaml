translation:
  language: ko
  text: 그들은 바알의 주상을 헐어 버리고, 바알의 집[a]을 헐어 버려 오늘날까지 그것을 변소로 삼았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바알의 성전’. 히브리어는 문자적으로 ‘바알의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּצוּ
  english_pob_choice: they tore down
  chosen_korean: 헐어 버리고
  alternatives_korean:
  - 무너뜨리고
  - 뜯어내고
  - 파괴하고
  lexicon: HALOT
  rationale: נתץ는 구조물이나 제의적 대상을 힘으로 허무는 뜻이므로, 현대 한국어에서 자연스럽고 강한 ‘헐어 버리다’로 옮겼습니다.
- source_word: מַצְּבַת הַבָּעַל
  english_pob_choice: the pillar of Baal
  chosen_korean: 바알의 주상
  alternatives_korean:
  - 바알의 기둥
  - 바알의 세운 돌
  - 바알의 석상
  lexicon: HALOT
  rationale: מַצֵּבָה는 제의적 ‘세운 돌/주상’을 가리키는 경우가 많아, 단순한 기둥보다 우상 숭배의 대상임을 드러내는 ‘주상’이 원문과 주석 전통을 함께 살립니다.
- source_word: בֵּית הַבַּעַל
  english_pob_choice: the house of Baal
  chosen_korean: 바알의 집
  alternatives_korean:
  - 바알의 성전
  - 바알의 신전
  lexicon: HALOT
  rationale: בַּיִת의 직역인 ‘집’을 유지해 히브리어 표현을 보존하되, 문맥상 우상 숭배 장소임은 앞뒤 문장으로 분명하므로 그대로 옮겼습니다.
- source_word: למחראות
  english_pob_choice: a latrine
  chosen_korean: 변소로 삼았습니다
  alternatives_korean:
  - 분뇨받이로 삼았습니다
  - 화장실로 삼았습니다
  - 배설물 치우는 곳으로 삼았습니다
  lexicon: HALOT
  rationale: 이 명사는 배설을 위한 장소를 뜻하며, 의도적 모독의 뉘앙스를 살리기 위해 현대 한국어에서 직설적인 ‘변소’로 옮겼습니다.
theological_decisions:
- issue: 바알 제의 장소의 의도적 모독 표현
  chosen_reading: ‘변소로 삼았습니다’로 번역해, 단순한 철거가 아니라 우상 숭배의 중심지를 공개적으로 모독한 행위를 드러냈습니다.
  alternative_readings:
  - ‘화장실로 만들었습니다’
  - ‘변소로 바꾸었습니다’
  rationale: 본문은 바알 숭배의 완전한 수치화와 폐기를 강조하므로, 완곡한 표현보다 원문의 충격을 보존하는 번역이 적절합니다.
  doctrine_reference: Translation philosophy §6
- issue: ‘주상’의 제의적 의미 보존
  chosen_reading: 일반 건축물의 기둥이 아니라 바알 숭배와 연결된 제의적 표지를 뜻하는 것으로 읽었습니다.
  alternative_readings:
  - 단순한 기둥
  - 성스러운 기둥
  rationale: 문맥상 מדובר하는 대상은 우상 숭배의 표지이므로, 한국어 독자가 그 종교적 성격을 놓치지 않도록 ‘주상’을 선택했습니다.
  doctrine_reference: Translation philosophy §1, §5
