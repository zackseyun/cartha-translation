- from: 이제 이 문서가 여러분에게 이르거든, 여러분과 함께 여러분의 주인의 아들들이 있고, 전차들과 말들과 요새화된 성읍도 여러분과 함께 있으며, 무기도 있습니다.[a][b][c]
  to: 이제 이 편지가 여러분에게 이르면[a], 여러분에게는 여러분의 주인의 아들들[b]과 전차와 말들이 있으며, 요새화된 성읍[c]과 무기도 있습니다.
  rationale: 왕실 서신 문맥에 맞게 ‘이 편지’를 채택하고, 히브리어의 반복된 ‘너희와 함께’를 한국어의 자연스러운 병렬 보유 구문으로 옮겼습니다. 각주 b의 비한국어 혼입을 제거하고, 모든 각주 표지를 해당 어휘에 직접 붙였습니다. 본절은 뒤 절의 명령으로 이어지는 조건적 서두이지만, 한국어 문장 자체는 완결된 서술로 제시해도 의미를 바꾸지 않습니다.
