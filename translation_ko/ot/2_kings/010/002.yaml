  text: וְ/עַתָּ֗ה כְּ/בֹ֨א הַ/סֵּ֤פֶר הַ/זֶּה֙ אֲלֵי/כֶ֔ם וְ/אִתְּ/כֶ֖ם בְּנֵ֣י אֲדֹנֵי/כֶ֑ם וְ/אִתְּ/כֶם֙ הָ/רֶ֣כֶב וְ/הַ/סּוּסִ֔ים וְ/עִ֥יר מִבְצָ֖ר וְ/הַ/נָּֽשֶׁק׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/002.yaml
  text: Now when this letter comes to you[a], since your master's sons are with you, and the chariots and the horses, a fortified city also being with you, and the weapons[c][b],
  footnotes:
  - marker: a
    text: Or 'when this document arrives to you.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'your master's sons'; that is, the sons of the king whom the recipients served.
    reason: cultural_note
  - marker: c
    text: Or 'a fortress city.' The phrase refers to a defensible city available to the recipients.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 이 편지가 여러분에게 이르면[a], 여러분에게는 여러분의 주인의 아들들[b]과 전차와 말들이 있으며, 요새화된 성읍[c]과 무기도 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 문서’. 히브리어는 넓게 기록물이나 문서를 가리킬 수 있으나, 여기서는 왕이 보낸 편지를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘여러분의 주인’은 수신자들이 섬기던 왕을 가리키는 정치적 표현입니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘견고한 성읍’ 또는 ‘요새 성읍’. 방어 시설을 갖춘 도시를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: HALOT
  rationale: 담화 전환 표지로서 다음 지시를 여는 말이므로, 현대 한국어에서 자연스러운 「이제」로 옮겼습니다.
- source_word: הַסֵּפֶר הַזֶּה
  english_pob_choice: this letter
  chosen_korean: 이 문서
  alternatives_korean:
  - 이 편지
  - 이 서신
  - 이 두루마리
  lexicon: HALOT
  rationale: 왕실 문맥의 כתב문을 가리키므로 ‘편지’도 가능하지만, 현대 독자에게는 더 포괄적인 「문서」가 자연스럽고 원문 범위도 무리 없이 담습니다.
- source_word: בְּנֵי אֲדֹנֵיכֶם
  english_pob_choice: your master's sons
  chosen_korean: 여러분의 주인의 아들들
  alternatives_korean:
  - 여러분의 주군의 아들들
  - 여러분의 주인의 아들
  - 여러분의 임금의 아들들
  lexicon: HALOT
  rationale: 아도나이의 일반적 정치적 의미를 살려 「주인」으로 옮겼고, 복수 수신자에게 직접 호응하도록 복수형을 유지했습니다.
- source_word: וְעִיר מִבְצָר
  english_pob_choice: a fortified city
  chosen_korean: 요새화된 성읍
  alternatives_korean:
  - 요새 성읍
  - 견고한 성읍
  - 방어 가능한 성읍
  lexicon: HALOT
  rationale: מיתבצר의 방어 시설 의미를 살려 현대어로는 「요새화된」이 가장 직접적이며, עיר는 서사 문맥상 「성읍」이 적절합니다.
theological_decisions:
- issue: 반복된 'with you'를 한국어에서 어떻게 드러낼지
  chosen_reading: 마지막 구절에서도 「여러분과 함께」를 반복해, 성읍과 무기가 그들의 보유 자원 목록에 포함된다는 점을 분명히 했습니다.
  alternative_readings:
  - 한 번만 반복하여 간결하게 처리
  - 후행 절을 압축해 자연스럽게 재배열
  rationale: 히브리어는 같은 전치사 표현을 반복해 자원 목록을 병렬로 강조하므로, 한국어에서도 반복을 유지하는 편이 원문의 압력을 더 잘 보존합니다.
  doctrine_reference: source transparency / discourse structure
- issue: הַסֵּפֶר הַזֶּה의 번역 범위
  chosen_reading: 왕실 전갈 맥락을 따라 「이 문서」로 옮겼습니다.
  alternative_readings:
  - 이 편지
  - 이 서신
  - 이 책
  rationale: ‘책’은 오해를 부르고, ‘편지’는 가능하나 현대어에서 문서성까지 포괄하는 표현이어서 서사 상황을 더 넓게 반영합니다.
  doctrine_reference: historical-literary context
