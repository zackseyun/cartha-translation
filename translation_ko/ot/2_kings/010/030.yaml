  lexicon: 프로젝트 기본 용례
  rationale: 언약적 신명은 프로젝트 기본값에 따라 야훼로 옮겨, 원문 고유명성과 가시적인 번역 일관성을 살렸습니다.
- source_word: הֱטִיבֹתָ לַעֲשׂוֹת
  english_pob_choice: you have done well in carrying out
  chosen_korean: 행하는 데 선을 행하였고
  alternatives_korean:
