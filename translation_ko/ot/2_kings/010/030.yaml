  - 내가 옳다고 여기는 일
  lexicon: HALOT
  rationale: 히브리어의 관용구를 직역하되 자연스러운 현대 한국어로 다듬어, 하나님의 평가 기준이라는 의미를 보존했습니다.
- source_word: בְּנֵי רְבִעִים
  english_pob_choice: your sons to the fourth generation
  chosen_korean: 네 자손이 사 대까지
  alternatives_korean:
