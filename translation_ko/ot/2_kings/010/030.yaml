  - 네 후손이 사 대까지
  lexicon: HALOT
  rationale: 이 표현은 왕조 승계를 가리키는 관용구이므로, 영어 주석의 설명을 반영해 ‘사 대까지’로 풀고 ‘자손’으로 왕조적 범위를 자연스럽게 나타냈습니다.
- source_word: עַל כִּסֵּא יִשְׂרָאֵל
  english_pob_choice: on the throne of Israel
  chosen_korean: 이스라엘의 왕좌에 앉을 것이다
  alternatives_korean:
  - 이스라엘의 왕좌에 앉을 것이다
  - 이스라엘의 왕위에 오를 것이다
  lexicon: HALOT
  rationale: 왕권의 즉위 관용구를 살리기 위해 ‘왕좌에 앉다’를 유지했고, 현대 한국어에서 더 직접적인 ‘왕위에 오르다’보다 원문의 형상을 보존했습니다.
theological_decisions:
- issue: 야훼의 평가와 예후의 행위에 대한 승인 범위
  chosen_reading: 이 구절이 말하는 범위 안에서만, 예후가 아합의 집에 대해 행한 일을 야훼께서 옳다고 평가하신 것으로 번역했습니다.
  alternative_readings:
  - 예후의 모든 통치 전체를 칭찬하는 것으로 넓혀 번역하기
  - 불편한 신학적 긴장을 완화하려고 칭찬 표현을 약화하기
  rationale: 원문은 아합의 집에 대한 집행을 특정하여 평가할 뿐이므로, 그 범위를 넘는 일반적 인준이나 약화를 피하고 본문의 긴장을 그대로 유지하는 것이 적절합니다.
  doctrine_reference: 본문의 범위 유지와 신학적 긴장 보존
