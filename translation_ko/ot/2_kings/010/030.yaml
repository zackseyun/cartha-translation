  - 옳게 행하였고
  lexicon: HALOT
  rationale: 히필 동사와 부정사구의 평가적 뉘앙스를 살리되, 한국어에서는 ‘선을 행하다’로 옮겨 예후의 행위가 긍정적으로 평가받는다는 점을 드러냈습니다.
- source_word: הַיָּשָׁר בְּעֵינַי
  english_pob_choice: what is right in my eyes
  chosen_korean: 내 눈에 옳은 일
  alternatives_korean:
