  text: And Yahweh said to Jehu[a], “Because you have done well in carrying out what is right in my eyes, and have done to the house of Ahab according to all that was in my heart, your sons to the fourth generation shall sit on the throne of Israel.”
  footnotes:
  - marker: a
    text: 'Hebrew: ''your sons, sons of fourths,'' an idiom meaning a four-generation dynasty.'
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 예후에게 말씀하셨습니다. 「네가 내 눈에 옳은 일을 행하는 데 선을 행하였고, 내 마음에 있는 모든 대로 아합의 집에 행하였으므로, 네 자손이 사 대까지 이스라엘의 왕좌에 앉을 것이다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘사 대의 아들들’이라는 왕조 관용구로, 네 세대의 왕조를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
