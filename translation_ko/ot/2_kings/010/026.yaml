  - marker: b
    text: Or 'sacred pillars' or 'standing stones.' The Hebrew term refers to cultic stone pillars associated with worship.
    reason: lexical_alternative
  - marker: c
    text: Or 'the temple of Baal.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 바알 신전[a]의 기둥들[b]을 꺼내어 불태웠습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바알의 집’입니다. 문맥상 ‘바알의 신전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 마체보트(מַצְּבוֹת)는 문맥상 바알 숭배와 관련된 ‘기둥’, 곧 제의에 쓰인 세운 돌을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 앞선 명사 ‘기둥들’이 복수인데도 동사에 단수 목적어 접미사가 붙어 있습니다. 집합적 의미로 이해될 수 있으므로 한국어에서는 복수로 옮겼습니다.
    reason: lexical_alternative
