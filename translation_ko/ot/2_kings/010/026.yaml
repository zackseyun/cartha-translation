    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들은 바알의 집에 있던 기둥들을 끌어내어 불태웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 앞선 명사 ‘기둥들’이 복수인데도 동사에 단수 목적어 접미사가 붙어 있습니다. 한국어에서는 의미상 복수로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: מַצְּבוֹת은 문맥상 바알 숭배와 관련된 ‘기둥’, 곧 제의적 세운 돌을 가리킵니다.
    reason: lexical_alternative
  - marker: c
    text: בֵּית הַבַּעַל은 문자적으로 ‘바알의 집’이지만, 문맥상 ‘바알의 신전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
