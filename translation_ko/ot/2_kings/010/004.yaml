  text: But they were very[a], very afraid, and they said, “Look, the two kings could not stand before him; so how can we stand?”
  footnotes:
  - marker: a
    text: Or, more explicitly, “could not withstand him … how can we withstand him?” The Hebrew uses the same verb, “stand,” in both clauses.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 매우, 매우 두려워하며 말했습니다. “보십시오, 두 왕도 그 앞에 설 수 없었으니, 우리가 어찌 설 수 있겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ מְאֹד מְאֹד
  english_pob_choice: they were very, very afraid
  chosen_korean: 매우, 매우 두려워하며
  alternatives_korean:
  - 몹시, 몹시 두려워하며
  - 매우 두려워하며
  lexicon: HALOT
  rationale: 두 번 반복된 강도를 한국어에서도 그대로 살려, פחד의 감정적 충격과 반복의 수사 효과를 보존했습니다.
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄·지시 표현으로서 현대 한국어에서는 “보십시오”가 가장 자연스럽고 정중합니다.
- source_word: לֹא עָמְדוּ לְפָנָיו / וְאֵיךְ נַעֲמֹד אֲנָחְנוּ
  english_pob_choice: could not stand before him / how can we stand?
  chosen_korean: 그 앞에 설 수 없었으니, 우리가 어찌 설 수 있겠습니까?
  alternatives_korean:
  - 그 앞에 버틸 수 없었으니, 우리가 어찌 버티겠습니까?
  - 그 앞에 맞설 수 없었으니, 우리가 어찌 맞서겠습니까?
  lexicon: HALOT
  rationale: 히브리어의 같은 동사 עמד 반복을 “서다”로 유지해 대구를 살렸고, 문맥상 ‘대항해 버티다’의 뜻은 함축으로 남겼습니다.
theological_decisions:
- issue: 두 번 반복된 ‘서다’의 의미 범위
  chosen_reading: 직역적 이미지를 유지하되, 문맥상 ‘맞서다/버티다’의 함의를 독자가 읽어내도록 했습니다.
  alternative_readings:
  - 의미를 풀어 ‘견디다’로 바꾸는 번역
  - 두 곳 모두 ‘버티다’로 명시하는 번역
  rationale: 본문은 동일 동사의 반복으로 대조를 이루므로, 한국어에서도 형식적 대응을 유지하는 편이 원문의 수사와 긴장을 더 잘 전달합니다.
  doctrine_reference: source-level rhetoric
