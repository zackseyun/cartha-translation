base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/012.yaml
  text: Then he arose and went and traveled to Samaria[a]. He was at Beth-eked of the shepherds on the way.
  footnotes:
  - marker: a
    text: Beth-eked may mean something like 'house of gathering' or, in some interpretations of the place name, a site associated with shepherds' shearing or binding. The Hebrew is best treated as a place name in the main text.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 일어나 와서 사마리아로 갔습니다. 그는 길에서 목자들의 벧에케드에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벧에케드’는 지명으로 보는 것이 가장 안전합니다. 그 이름은 ‘모임의 집’ 또는 목자들의 털깎이나 결박과 관련된 장소를 뜻할 가능성이 있으나, 정확한 어원과 의미는 확실하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: Then he arose
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켜
  lexicon: HALOT
  rationale: 서사적 연속을 나타내는 동작 동사로, 한국어에서는 자연스럽게 ‘일어나’로 옮겨 다음 동작으로 이어지게 했습니다.
- source_word: וַיֵּלֶךְ שֹׁמְרוֹן
  english_pob_choice: traveled to Samaria
  chosen_korean: 사마리아로 갔습니다
  alternatives_korean:
  - 사마리아로 여행했습니다
  - 사마리아로 향했습니다
  lexicon: HALOT
  rationale: הלך + 목적지는 단순 이동을 가리키므로, 본문 흐름을 가장 सीधे하게 드러내는 ‘사마리아로 갔습니다’를 택했습니다.
- source_word: בֵּית עֵקֶד הָרֹעִים
  english_pob_choice: Beth-eked of the shepherds
  chosen_korean: 목자들의 벧에겐
  alternatives_korean:
  - 목자들의 베스에겐
  - 목자들의 모임의 집
  lexicon: HALOT
  rationale: 이 어구는 지명으로 보는 것이 가장 안전하므로 본문에는 음역을 유지하고, הָרֹעִים는 소유/관련 표지로서 ‘목자들의’로 옮겼습니다.
- source_word: בַּדָּרֶךְ
  english_pob_choice: on the way
  chosen_korean: 길가의
  alternatives_korean:
  - 길 위의
  - 길 위에
  lexicon: HALOT
  rationale: 장소 관계를 자연스럽게 풀어 주되, 지명이 길에 위치함을 보여 주기 위해 ‘길가의’로 옮겼습니다.
theological_decisions:
- issue: 지명 בֵּית עֵקֶד의 처리
  chosen_reading: 본문에는 지명으로 보존하고, 어원적 가능성은 각주로 처리합니다.
  alternative_readings:
  - ‘묶는 집’처럼 의미 번역
  - ‘모임의 집’처럼 의미 번역
  rationale: 문맥상 기능하는 이름을 본문에서 해석해 버리면 지명 자체의 정보가 사라지므로, POB의 주석 지침에 따라 음역을 유지하는 편이 더 충실합니다.
  doctrine_reference: 본문-비평/지명 번역 원칙
