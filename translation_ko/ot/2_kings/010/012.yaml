  source_fidelity: 수정이 필요합니다. 초안은 וַיָּבֹא(‘와서/이르러’)를 빠뜨려 세 개의 연속 동작을 두 개로 축소합니다. 또한 עֵקֶד의 마지막 자음은 달렛(ד)이므로 ‘벧에겐’이 아니라 ‘벧에케드’로 음역해야 합니다.
  naturalness: ‘그는 일어나 와서 사마리아로 갔습니다’는 히브리어의 연속 동작을 자연스러운 한국어 합쇼체로 유지합니다. 장소 절은 ‘그는 길에서 목자들의 벧에케드에 있었습니다’로 옮겨, ‘길에서’가 이동 경로상의 위치를 나타내도록 했습니다.
  terminology: 사마리아는 통용 지명을 유지했습니다. בֵּית עֵקֶד는 의미를 단정하지 않고 ‘벧에케드’로 음역했으며, הָרֹעִים는 ‘목자들의’로 보존했습니다. 각주는 불확실한 지명의 어원적 가능성만 제시합니다.
