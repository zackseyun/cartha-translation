  text: וַ/יֹּ֗אמֶר לַֽ/אֲשֶׁר֙ עַל הַ/מֶּלְתָּחָ֔ה הוֹצֵ֣א לְב֔וּשׁ לְ/כֹ֖ל עֹבְדֵ֣י הַ/בָּ֑עַל וַ/יֹּצֵ֥א לָ/הֶ֖ם הַ/מַּלְבּֽוּשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/022.yaml
  text: He said to the one who was over the wardrobe[b][a], “Bring out clothing for all the worshipers of Baal.” So he brought out the clothing for them.
  footnotes:
  - marker: a
    text: Or “garments” throughout the verse.
    reason: lexical_alternative
  - marker: b
    text: “Worshipers of Baal” translates a phrase that is more literally “servants of Baal,” with the sense of those devoted to Baal’s service in worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 예복실을 맡은 사람에게 말했습니다. “바알의 모든 섬기는 자들을 위해 옷을 가져오십시오.” 그러자 그가 그들에게 옷을 가져왔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옷’으로 옮긴 표현은 본문 전반에서 반복되는 히브리어 집합명사에 대응합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바알의 모든 섬기는 자들’은 보다 문자적으로는 ‘바알의 종들’에 가깝지만, 여기서는 제의적 의미를 분명히 한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאֲשֶׁר עַל הַמֶּלְתָּחָה
  english_pob_choice: to the one who was over the wardrobe
  chosen_korean: 예복실을 맡은 사람
  alternatives_korean:
  - 옷방을 맡은 사람
  - 옷을 관리하는 사람
  - 예복실 책임자
  lexicon: HALOT
  rationale: 직역의 행정적 표현을 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘맡은 사람’으로 옮겼습니다. ‘예복실’은 이어지는 옷의 지급 맥락을 반영한 중립적 공간명입니다.
- source_word: הוֹצֵא
  english_pob_choice: Bring out
  chosen_korean: 가져오십시오
  alternatives_korean:
  - 꺼내십시오
  - 내오십시오
  - 가져다가 내십시오
  lexicon: HALOT
  rationale: 창고에서 물품을 지급하라는 명령이므로 한국어에서는 ‘가져오십시오’가 가장 자연스럽고, 단순한 이동이 아니라 배부의 뉘앙스도 담을 수 있습니다.
- source_word: לְב֔וּשׁ
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 옷차림
  - 예복
  lexicon: HALOT
  rationale: 집합명사로서의 의미를 살리면서도 현대 독자에게 가장 분명한 일반어인 ‘옷’을 사용했습니다. ‘예복’은 지나치게 의례적 뉘앙스를 더할 수 있습니다.
- source_word: עֹבְדֵי הַבָּעַל
  english_pob_choice: the worshipers of Baal
  chosen_korean: 바알의 모든 섬기는 자들
  alternatives_korean:
  - 바알의 모든 예배자들
  - 바알을 섬기는 자들
  - 바알의 종들
  lexicon: HALOT
  rationale: 히브리어의 עבד는 여기서 단순한 ‘종’보다 신에게 예속되어 섬기는 사람들을 가리키므로, POB의 해석을 따라 ‘섬기는 자들’로 옮겼습니다. ‘모든’은 집합 전체를 드러냅니다.
- source_word: הַמַּלְבּוּשׁ
  english_pob_choice: the clothing
  chosen_korean: 옷
  alternatives_korean:
  - 그 옷
  - 의복
  - 복장
  lexicon: HALOT
  rationale: 뒤의 ‘그가 그들에게…’와 연결되는 집합적 명사이므로 한국어에서도 반복을 피하지 않고 간결하게 ‘옷’으로 유지했습니다.
theological_decisions:
- issue: 바알 숭배자 표현의 종교적 뉘앙스
  chosen_reading: ‘섬기는 자들’로 번역해 우상에게 헌신한 집단이라는 종교적 성격을 드러냈습니다.
  alternative_readings:
  - ‘종들’
  - ‘예배자들’
  rationale: 본문은 단순한 직업적 종속이 아니라 바알 숭배 행위를 전제하므로, 예배/섬김의 종교적 기능을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 구약의 우상숭배 비판과 제의적 충성 개념
