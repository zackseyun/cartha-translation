  naturalness: ‘바알의 모든 섬기는 자들’보다 ‘바알을 섬기는 모든 사람’이 현대 표준 한국어에서 자연스럽고, 신을 섬기는 제의적 의미도 분명합니다. ‘그 옷’은 두 번째 명사의 정관성과 앞서 언급된 의복을 자연스럽게 연결합니다.
