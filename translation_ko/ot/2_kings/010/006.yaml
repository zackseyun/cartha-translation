base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/006.yaml
  text: So he wrote them a second letter[a], saying, “If you are on my side and if you are listening to my voice, take the heads of the men, the sons of your master, and come to me at this time tomorrow at Jezreel.” Now the king’s sons, seventy men, were with the leading men of the city[c][b], who were raising them.
  footnotes:
  - marker: a
    text: Or, 'if you obey me.' The Hebrew says literally, 'if you are listening to my voice,' an idiom that often includes obedience.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'take the heads of the men, the sons of your master'—that is, the severed heads of your master's sons.
    reason: lexical_alternative
  - marker: c
    text: Or, 'to Jezreel.' The Hebrew form includes a directional ending.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그들에게 두 번째 편지를 써서 말했습니다. “너희가 나를 따르고, 내 목소리를 듣고 있다면, 너희 주인의 아들들의 머리를 가져다가 내일 이맘때 이스르엘로 내게 오너라.” 그때 왕의 아들 일흔 명은 성읍의 지도자들과 함께 있었는데, 그들이 그들을 양육하고 있었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘내 목소리를 듣고 있다면’이라고 되어 있으며, 이 표현은 흔히 순종을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘너희 주인의 아들들의 머리’라고 말하며, 곧 너희 주인의 아들들의 잘린 머리를 뜻합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 형태는 ‘이스르엘로’라는 방향성을 포함합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: סֵפֶר שֵׁנִית
  english_pob_choice: a second letter
  chosen_korean: 두 번째 편지
  alternatives_korean:
  - 두 번째 문서
  - 또 다른 편지
  lexicon: HALOT
  rationale: 서간문맥의 סֵפֶר는 ‘편지’가 자연스럽고, שֵׁנִית는 순서를 나타내므로 ‘두 번째’가 적절합니다.
- source_word: אִם לִי אַתֶּם
  english_pob_choice: If you are for me
  chosen_korean: 너희가 나를 따르고
  alternatives_korean:
  - 너희가 내 편이라면
  - 너희가 나를 위한다면
  lexicon: HALOT
  rationale: 직역하면 소속·충성을 묻는 관용구이므로, 한국어에서는 관계와 충성의 뉘앙스를 드러내는 표현으로 옮겼습니다.
- source_word: וּלְקֹלִי אַתֶּם שֹׁמְעִים
  english_pob_choice: if you are listening to my voice
  chosen_korean: 내 목소리를 듣고 있다면
  alternatives_korean:
  - 내 말을 듣고 있다면
  - 내 목소리에 귀를 기울이고 있다면
  lexicon: HALOT
  rationale: שׁמע with קוֹל은 단순 청취보다 순종을 포함할 수 있으나, 본문 표현을 살려 ‘목소리를 듣다’로 옮기고 순종의 함의를 유지했습니다.
- source_word: קְחוּ אֶת רָאשֵׁי
  english_pob_choice: take the heads of
  chosen_korean: 머리를 가져다가
  alternatives_korean:
  - 머리들을 가져다가
  - 머리를 취하여
  lexicon: HALOT
  rationale: 히브리어는 실제로 잘린 머리를 가리키는 직접적 표현이므로, 완곡하게 풀지 않고 한국어에서도 그 직접성을 살렸습니다.
