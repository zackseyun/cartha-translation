  text: In those days Yahweh began to cut off parts of Israel[b][a], and Hazael struck them down throughout all the territory of Israel.
  footnotes:
  - marker: a
    text: Or 'began to cut off parts of Israel.' The Hebrew verb conveys the beginning of Israel's reduction, likely through territorial losses.
    reason: lexical_alternative
  - marker: b
    text: Or 'along the whole border of Israel.' The Hebrew phrase can denote border or territory; here it likely refers to the full extent of Israel's domain under attack.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때에 야훼께서 이스라엘을 조금씩 잘라 내기 시작하셨고, 하사엘이 이스라엘의 온 영토에 걸쳐 그들을 쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조금씩 잘라 내기’는 히브리어 동사의 진행적·축소적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘온 영토에 걸쳐’는 ‘경계’보다 더 넓은, 이스라엘이 실제로 점유한 영역 전체를 가리킬 수 있습니다.
    reason: lexical_alternative
