theological_decisions:
- issue: 여호와의 행위와 하사엘의 공격을 함께 서술하는 구조
  chosen_reading: 야훼께서 먼저 이스라엘을 축소시키기 시작하시고, 그 수단으로 하사엘의 침공이 이어진다는 인과 구조를 그대로 유지했습니다.
  alternative_readings:
  - 하사엘이 단지 독자적으로 이스라엘을 약화시켰다는 읽기
  - 하나님의 주권적 개입을 완화한 읽기
  rationale: 원문은 야훼의 시작하심과 하사엘의 타격을 나란히 두어 역사 사건 뒤의 신적 주권을 드러냅니다. 이를 약화하지 않도록 둘의 관계를 분리하지 않았습니다.
  doctrine_reference: 섭리와 역사 주권
