  text: 그 무렵 야훼께서 이스라엘의 일부를 잘라 내기[a] 시작하셨고, 하사엘이 이스라엘의 온 영토에서[b] 그들을 쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 줄이기 시작하셨다.’ 히브리어 표현은 이스라엘의 축소를 뜻하며, 문맥상 영토 상실을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이스라엘의 모든 경계에서.’ 히브리어 게불은 ‘경계’ 또는 ‘영토’를 뜻할 수 있습니다.
    reason: lexical_alternative
