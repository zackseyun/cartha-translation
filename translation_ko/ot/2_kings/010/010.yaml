source:
  edition: WLC
  text: דְּע֣וּ אֵפ֗וֹא כִּי֩ לֹ֨א יִפֹּ֜ל מִ/דְּבַ֤ר יְהוָה֙ אַ֔רְצָ/ה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עַל בֵּ֣ית אַחְאָ֑ב וַ/יהוָ֣ה עָשָׂ֔ה אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֔ר בְּ/יַ֖ד עַבְדּ֥/וֹ אֵלִיָּֽהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/010.yaml
  text: Know[a], then, that not a word of Yahweh that he spoke against the house of Ahab will fall to the ground[b], and Yahweh has done what he spoke by the hand of his servant Elijah.
  footnotes:
  - marker: a
    text: 'Hebrew: ''will not fall to the ground,'' an idiom meaning ''will not fail'' or ''will not go unfulfilled.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'through his servant Elijah.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 아십시오. 야훼께서 아합의 집을 거슬러 말씀하신 말씀은 한 마디도 땅에 떨어지지 않을 것입니다[a]. 야훼께서는 자기 종 엘리야를 통해 말씀하신 것을 이루셨습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘땅에 떨어지지 않을 것이다’이며, ‘헛되이 끝나지 않다’ 또는 ‘실패하지 않다’라는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘자기 종 엘리야의 손으로’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּעוּ אֵפוֹא
  english_pob_choice: Know, then
  chosen_korean: 아시다시피
  alternatives_korean:
  - 그러니 아십시오
  - 그런즉 알아두십시오
  lexicon: HALOT
  rationale: 복수 명령의 공개 선언 어감을 살리면서, 한국어에서는 자연스러운 담화 전환으로 ‘아시다시피’를 택해 청중의 인지를 촉구했습니다.
- source_word: מִדְּבַר יְהוָה ... לֹא יִפֹּל ... אַרְצָה
  english_pob_choice: not a word ... will fall to the ground
  chosen_korean: 야훼의 말씀 가운데서 땅에 떨어질 것은 하나도 없습니다
  alternatives_korean:
  - 야훼의 말씀은 하나도 실패하지 않습니다
  - 야훼의 말씀 가운데서 땅에 떨어지는 것은 하나도 없습니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살리되, 한국어에서는 ‘땅에 떨어질 것은 하나도 없습니다’로 표현해 실패하지 않는다는 뜻을 보존했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: DOCTRINE.md contested terms
  rationale: 문자음 표기를 음역한 고유명사로 일관해, 칭호 ‘주’로 환원하지 않고 신명 자체를 드러냈습니다.
- source_word: בְּיַד עַבְדּוֹ אֵלִיָּהוּ
  english_pob_choice: by the hand of his servant Elijah
  chosen_korean: 자기 종 엘리야를 통해
  alternatives_korean:
  - 자기 종 엘리야의 손으로
  - 자기 종 엘리야를 통하여
  lexicon: HALOT
  rationale: ‘손으로’의 히브리어 표현은 예언적 매개를 뜻하므로, 한국어에서는 자연스럽고 의미를 드러내는 ‘통해’로 옮겼습니다.
theological_decisions:
- issue: 야훼의 말씀의 확실한 성취를 드러내는 관용구 유지
  chosen_reading: ‘땅에 떨어질 것’ 이미지를 살려, 예언 성취의 불가역성과 확실성을 표현했습니다.
  alternative_readings:
  - 직설적으로 ‘실패하지 않습니다’로 풀어쓸 수 있음
  rationale: 본문은 단순한 예측이 아니라 야훼의 선언이 반드시 이루어진다는 점을 강조하므로, 비유를 보존하는 편이 원문 의미를 더 충실히 전달합니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
- issue: ‘자기 종’의 신학적 뉘앙스
  chosen_reading: 엘리야를 야훼의 ‘자기 종’으로 유지했습니다.
  alternative_readings:
  - ‘종’만 사용
  - ‘일꾼’으로 일반화
  rationale: 예언자 엘리야의 권위는 개인적 공로가 아니라 야훼께 받은 위임에 있으므로, ‘자기 종’이 그 종속성과 소명을 가장 정확히 드러냅니다.
  doctrine_reference: DOCTRINE.md contested terms — עבד
