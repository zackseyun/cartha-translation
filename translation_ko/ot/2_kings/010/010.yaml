  naturalness: 기존의 ‘야훼께서 ... 말씀하신 야훼의 말씀 가운데서’는 동일 어휘의 중복과 ‘가운데서’의 결합이 부자연스럽습니다. ‘야훼께서 아합의 집을 거슬러 말씀하신 말씀은 한 마디도’가 현대 표준어 합쇼체에서 자연스럽고 명료합니다.
  terminology: ‘야훼’, ‘아합의 집’, ‘종 엘리야’는 적절합니다. ‘통해’는 בְּיַד의 매개·도구적 의미를 자연스럽게 전달하되, 각주에서 ‘손으로’라는 직역을 제시하는 편이 본문의 표현을 더 투명하게 보존합니다.
