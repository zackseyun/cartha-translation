base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/015.yaml
  text: He went on from there and found Jehonadab the son of Rechab coming to meet him. He greeted him and said to him, “Is your heart upright, as my heart is with your heart?” Jehonadab said, “It is, it is.” Jehu said, “Give me your hand.” So he gave him his hand, and Jehu took him up to himself into the chariot.
  footnotes:
  - marker: a
    text: Or, 'He blessed him.' The Hebrew verb can mean 'bless,' but in this encounter setting it likely functions as a greeting or salutation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew, 'Is your heart upright, as my heart is with your heart?' The wording expresses mutual loyalty or alignment of purpose.
    reason: lexical_alternative
  - marker: c
    text: Hebrew, 'It is, and it is'—an emphatic affirmation.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 그곳에서 떠나가 레갑의 아들 여호나답이 자기에게 오는 것을 보고 그에게 인사하며 말했습니다. “당신의 마음이 내 마음이 당신의 마음과 함께하는 것처럼 올바릅니까?” 여호나답이 말했습니다. “그렇습니다, 그렇습니다.” 그러자 그가 말했습니다. “당신의 손을 주십시오.” 그가 자기 손을 내밀자, 그가 그를 자기 곁으로 병거에 올려놓았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘그에게 복을 빌었습니다.’ 히브리어 동사는 ‘축복하다’의 뜻도 있지만, 이 만남 장면에서는 인사나 문안의 기능으로 쓰였을 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘내 마음이 당신의 마음과 함께하는 것처럼 당신의 마음이 올바른가?’라는 식으로, 상호 충성이나 뜻의 일치를 나타냅니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어의 반복은 강한 확언입니다. 한국어로는 ‘그렇습니다, 그렇습니다’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  english_pob_choice: He went on from there
  chosen_korean: 그는 그곳에서 떠나가
  alternatives_korean:
  - 그곳에서 나아가
  - 그곳을 떠나
  lexicon: HALOT
  rationale: 이동의 지속을 나타내는 서술로 자연스럽게 옮기되, 앞 장면에서 이어지는 진행성을 살렸습니다.
- source_word: וַיִּמְצָא אֶת יְהוֹנָדָב בֶּן רֵכָב
  english_pob_choice: found Jehonadab the son of Rechab
  chosen_korean: 레갑의 아들 여호나답이 자기에게 오는 것을 보고
  alternatives_korean:
  - 레갑의 아들 여호나답을 만나
  - 레갑의 아들 여호나답을 발견하고
  lexicon: HALOT
  rationale: מָצָא의 기본값은 ‘찾다/발견하다’이지만 여기서는 마주치는 장면이므로, 다가오는 모습을 포함해 사건의 상황을 한국어로 분명히 했습니다.
- source_word: וַיְבָרְכֵהוּ
  english_pob_choice: He greeted him
  chosen_korean: 그에게 인사하며
  alternatives_korean:
  - 그에게 복을 빌며
  - 그를 축복하며
  lexicon: HALOT
  rationale: ברך는 기본적으로 ‘축복하다’이지만 대면 인사 장면에서는 인사/문안의 기능이 자연스럽습니다. 한국어에서는 종교적 의미를 과잉해석하지 않도록 ‘인사하다’로 옮겼습니다.
- source_word: הֲיֵשׁ אֶת לְבָבְךָ יָשָׁר
  english_pob_choice: Is your heart upright
  chosen_korean: 당신의 마음이 … 올바릅니까
  alternatives_korean:
  - 당신의 마음이 … 바릅니까
  - 당신의 마음이 … 정직합니까
  lexicon: HALOT
  rationale: לֵבָב은 내적 의지와 충성의 중심을 가리키며, יָשָׁר는 ‘곧다/바르다’의 뜻이므로 ‘올바르다’로 옮겨 관계적 충성의 뉘앙스를 살렸습니다.
- source_word: כַּאֲשֶׁר לְבָבִי עִם לְבָבֶךָ
  english_pob_choice: as my heart is with your heart
  chosen_korean: 내 마음이 당신의 마음과 함께하는 것처럼
  alternatives_korean:
  - 내 마음이 당신의 마음에 향한 것처럼
  - 내 마음이 당신의 마음과 맞닿아 있는 것처럼
  lexicon: HALOT
  rationale: 직역식으로 ‘마음’을 반복해 상호 충성/연합의 비유를 유지했습니다. עִם은 여기서 단순한 공간관계보다 동행·일치의 뉘앙스를 가집니다.
- source_word: יֵשׁ וָיֵשׁ
  english_pob_choice: It is, it is
  chosen_korean: 그렇습니다, 그렇습니다
  alternatives_korean:
  - 있습니다, 있습니다
  - 예, 그렇습니다
  lexicon: HALOT
  rationale: 히브리어의 반복적 확언을 한국어에서 자연스러운 중첩으로 살렸습니다. 단순한 ‘예’보다 강한 동의와 확증을 드러냅니다.
- source_word: תְּנָה אֶת יָדֶךָ
  english_pob_choice: Give me your hand
  chosen_korean: 당신의 손을 주십시오
  alternatives_korean:
  - 손을 내미십시오
  - 제게 손을 주십시오
  lexicon: HALOT
  rationale: 직역에 가까운 손-제스처 표현을 유지하되, 한국어에서는 정중한 명령형으로 자연스럽게 다듬었습니다.
- source_word: וַיַּעֲלֵהוּ אֵלָיו אֶל הַמֶּרְכָּבָה
  english_pob_choice: Jehu took him up to himself into the chariot
  chosen_korean: 그가 그를 자기 곁으로 병거에 올려놓았습니다
  alternatives_korean:
  - 그가 그를 자기에게로 병거에 올렸습니다
  - 그가 그를 병거 안으로 데려올렸습니다
  lexicon: HALOT
  rationale: העלה의 상향 이동을 ‘올려놓다’로 살리고, אֵלָיו는 ‘자기 곁으로’로 처리해 병거라는 구체적 장면을 유지했습니다.
theological_decisions:
- issue: 이 구절의 ברך를 축복으로 볼지 인사로 볼지
  chosen_reading: 대면 인사 행위로 읽어 ‘인사하다’로 번역했습니다.
  alternative_readings:
  - 문자적으로 ‘축복하다’
  - 형식적 문안으로 ‘문안하다’
  rationale: 전투/동맹 맥락의 만남 장면이므로, 종교적 축복 행위로 단정하기보다 사회적 환대와 확인의 기능을 우선 반영하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 문맥과 동사 ברך의 다의성
