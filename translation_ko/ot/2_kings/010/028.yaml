base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/028.yaml
  text: So Jehu destroyed Baal from Israel[a][b].
  footnotes:
  - marker: a
    text: Or 'wiped out' / 'eliminated.' The Hebrew verb conveys causing destruction or removal.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the Baal'; English normally omits the article with the deity's name.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 예후가 이스라엘에서 바알을 제거했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘없애버렸습니다’, ‘제거해 버렸습니다’. 히브리어 동사는 파괴와 제거의 강한 의미를 가집니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그 바알’이지만, 한국어에서는 신명 앞의 관사를 보통 드러내지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁמֵד
  english_pob_choice: destroyed
  chosen_korean: 제거했습니다
  alternatives_korean:
  - 멸했습니다
  - 없애버렸습니다
  - 파괴했습니다
  lexicon: HALOT
  rationale: 히필 형태의 שׁמד는 ‘파멸시키다/제거하다’의 강한 원인을 나타내므로, 한국어에서는 문맥상 자연스러우면서도 제거·소멸의 강도를 살릴 수 있는 ‘제거했습니다’로 옮겼습니다.
- source_word: הַבַּעַל
  english_pob_choice: Baal
  chosen_korean: 바알
  alternatives_korean:
  - 바알 신
  - 바알 숭배
  - 그 바알
  lexicon: HALOT
  rationale: 히브리어에 정관사가 있으나, 인명·신명에서는 한국어에서도 보통 관사를 드러내지 않으므로 단순히 ‘바알’로 옮겨 원문 호칭을 보존했습니다.
- source_word: מִיִּשְׂרָאֵל
  english_pob_choice: from Israel
  chosen_korean: 이스라엘에서
  alternatives_korean:
  - 이스라엘로부터
  - 이스라엘 밖으로부터
  lexicon: HALOT
  rationale: מִן의 분리/제거 의미를 한국어 조사 ‘에서’로 자연스럽게 표현해, 바알이 이스라엘 영역에서 치워졌다는 뜻을 직접적으로 드러냈습니다.
theological_decisions:
- issue: ‘바알’의 범위
  chosen_reading: 본문의 직접 표현을 따라 ‘바알’을 그대로 두고, 바알 숭배에 대한 해석을 본문 밖으로 과도하게 확장하지 않았습니다.
  alternative_readings:
  - 바알 숭배
  - 바알 예배
  rationale: 히브리어 목적어는 단순히 ‘그 바알’이므로, 원문 수준을 유지하는 것이 번역 원칙에 맞습니다. 문맥이 이미 우상 제의의 제거를 충분히 알려 줍니다.
  doctrine_reference: 'Translation philosophy: original-language primacy over translation tradition; never paraphrase beyond what the source text warrants.'
