  text: וְ/יֵה֗וּא מָצָא֙ אֶת אֲחֵי֙ אֲחַזְיָ֣הוּ מֶֽלֶךְ יְהוּדָ֔ה וַ/יֹּ֖אמֶר מִ֣י אַתֶּ֑ם וַ/יֹּאמְר֗וּ אֲחֵ֤י אֲחַזְיָ֨הוּ֙ אֲנַ֔חְנוּ וַ/נֵּ֛רֶד לִ/שְׁל֥וֹם בְּנֵֽי הַ/מֶּ֖לֶךְ וּ/בְנֵ֥י הַ/גְּבִירָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/013.yaml
  text: Jehu found the brothers of Ahaziah king of Judah and said[a], “Who are you?” They said, “We are the brothers of Ahaziah[c][b], and we have come down to ask about the welfare of the sons of the king and the sons of the queen mother.”
  footnotes:
  - marker: a
    text: Hebrew 'brothers of Ahaziah.' In royal narrative this can denote close relatives or kinsmen, not only literal brothers.
    reason: lexical_alternative
  - marker: b
    text: Or 'to see if all was well with the sons of the king and the sons of the queen mother.'
    reason: lexical_alternative
  - marker: c
    text: '''Queen mother'' renders Hebrew gebirah, a royal court title for the king''s mother.'
    reason: cultural_note
translation:
  language: ko
  text: 예후가 유다 왕 아하시야의 형제들[a]을 만나서 말했습니다. “여러분은 누구입니까?” 그들이 말했습니다. “우리는 아하시야의 형제들입니다. 왕의 아들들과 태후[c]의 아들들의 안부를 묻기 위해[b] 내려왔습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 ‘아하시야의 형제들’이라고 하며, 왕실 서술에서는 문자적 형제뿐 아니라 친족을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘안부를 묻기 위해’는 히브리어 לִשְׁלוֹם의 관용적 의미를 반영합니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 גְּבִירָה는 왕의 어머니를 가리키는 궁정 호칭으로, 여기서는 ‘태후’로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: אֲחֵי אֲחַזְיָהוּ
  english_pob_choice: the brothers of Ahaziah
  chosen_korean: 아하시야의 형제들
  alternatives_korean:
  - 아하시야의 친족들
  - 아하시야의 일족들
  lexicon: HALOT
  rationale: 직역에 가깝게 ‘형제들’을 유지하되, 왕실 문맥에서 확대 친족을 가리킬 수 있다는 점은 본문 그대로 두고 주석으로 처리하는 편이 원문에 충실합니다.
- source_word: מֶלֶךְ יְהוּדָה
  english_pob_choice: king of Judah
  chosen_korean: 유다 왕
  alternatives_korean:
  - 유다의 왕
  lexicon: HALOT
  rationale: 히브리어 관용구에 자연스럽게 맞는 현대 한국어 왕호 표현으로 옮겼습니다.
- source_word: מִי אַתֶּם
  english_pob_choice: Who are you?
  chosen_korean: 너희는 누구냐?
  alternatives_korean:
  - 당신들은 누구입니까?
  - 너희는 누구입니까?
  lexicon: HALOT
  rationale: 대화체의 즉각성을 살리기 위해 간결한 직설문으로 옮겼으며, 예후의 군사적 발화 성격에 맞춰 평서적 높임은 피했습니다.
- source_word: לִשְׁלוֹם
  english_pob_choice: to ask about the welfare of
  chosen_korean: 안부를 묻기 위해
  alternatives_korean:
  - 평안을 살피기 위해
  - 형편을 알아보기 위해
  lexicon: HALOT
  rationale: לִשְׁלוֹם의 관용적 의미를 살려 단순한 인사보다 ‘안부를 묻다’로 번역했습니다.
- source_word: הַגְּבִירָה
  english_pob_choice: the queen mother
  chosen_korean: 태후
  alternatives_korean:
  - 왕대비
  - 왕의 어머니
  lexicon: HALOT
  rationale: 여기서는 왕실 관직적 호칭이므로 한국어 성경 문맥에서 가장 간결하고 기능적으로 대응하는 ‘태후’를 택했습니다.
theological_decisions:
- issue: 예후의 질문과 대답의 문체
  chosen_reading: 예후의 짧은 질문은 반말형 명령·추궁의 뉘앙스를 살리고, 그들의 대답은 설명문으로 처리했습니다.
  alternative_readings:
  - 전체를 모두 높임말로 평준화
  - 질문까지 모두 서술형으로 완화
  rationale: 왕실 학살 맥락의 긴박함과 권력 비대칭을 본문이 드러내므로, 한국어에서도 그 긴장감을 보존하는 것이 적절합니다.
  doctrine_reference: 서사 문맥의 화행과 인물 관계 표지
- issue: וּבְנֵי הַגְּבִירָה의 관계 표현
  chosen_reading: ‘태후의 아들들’로 직역을 유지했습니다.
  alternative_readings:
  - ‘왕대비의 아들들’
  - ‘태후의 자녀들’
  rationale: 히브리어가 아들들(bənê)이라고 특정하므로 성별과 수를 완화하지 않고 그대로 보존했습니다.
  doctrine_reference: 원문 수사 보존 원칙
