  source_fidelity: 히브리어 원문은 예후의 복수 명령 ‘카드슈’(성별/거룩히 구별하라)와 ‘아차라’(제의적 엄숙 집회)를 포함하며, 이어 그 명령이 공적으로 선포되었음을 말합니다. 초안은 이 기본 의미를 대체로 보존하지만, ‘거룩하게 하십시오’는 집회 자체를 성화한다는 뜻으로 다소 부자연스럽고 제의적 지정·성별의 의미가 약합니다.
  naturalness: ‘엄숙한 모임’도 이해되지만, 종교적·공적 소집이라는 문맥에서는 ‘엄숙한 집회’가 더 자연스럽고 정확합니다. 또한 명령문을 따옴표 안에 두고 바로 ‘그래서’로 잇는 현재의 문장부호는 다소 어색합니다. ‘그들은 그것을 공포했습니다’는 법령의 공포를 연상시키므로, 집회 소집의 공개 알림에는 ‘선포했습니다’가 적합합니다.
  terminology: ‘바알’과 ‘예후’는 표준적 표기입니다. קדשׁ는 여기서 바알 제의를 위한 집회를 공식적으로 성별·지정하라는 명령이므로 ‘성별하십시오’가 가장 정확합니다. עֲצָרָה는 ‘엄숙한 집회’로 옮기는 것이 제의적 용례를 잘 반영합니다. 각주가 제시하는 대안은 본문 동사와 문법적으로 맞지 않으므로 교정이 필요합니다.
