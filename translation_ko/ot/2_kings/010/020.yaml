- from: 그러자 예후가 말했습니다. 「바알을 위한 엄숙한 모임을 거룩하게 하십시오.」 그래서 그들이 그것을 공포했습니다.[a]
  to: 그러자 예후가 말했습니다. “바알을 위한 엄숙한 집회를 성별하십시오.” 그들은 그것을 선포했습니다.[a]
  rationale: 원문의 명령형 קַדְּשׁוּ는 제의적 목적을 위한 공식적 성별·지정을 뜻하므로 ‘성별하십시오’로 수정했습니다. עֲצָרָה는 종교적 공식 모임의 성격을 살려 ‘엄숙한 집회’로 옮겼습니다. 후속 וַיִּקְרָאוּ는 집회를 공적으로 알린 행위이므로 ‘선포했습니다’로 고쳤고, 각주는 이 동사의 자연스러운 어휘 대안만 제시하도록 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:55Z'
