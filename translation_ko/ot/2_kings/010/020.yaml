    text: Or “announce a sacred assembly for Baal.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예후가 말했습니다. “바알을 위한 엄숙한 집회를 성별하십시오.” 그들은 그것을 선포했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것을 널리 알렸습니다.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  english_pob_choice: Then ... said
  chosen_korean: 그러자 ... 말했습니다
  alternatives_korean:
  - 그리고 ... 말했습니다
  - 그때 ... 말했습니다
  lexicon: HALOT
  rationale: 와우 연속의 서사 전진을 한국어에서는 자연스러운 결과·전환 표현인 ‘그러자’로 살렸습니다.
- source_word: קַדְּשׁוּ
  english_pob_choice: Consecrate
  chosen_korean: 거룩하게 하십시오
  alternatives_korean:
  - 성별하십시오
  - 거룩하게 하라
  lexicon: HALOT
  rationale: 공식적 종교 행위로 ‘구별해 바치다’의 뜻을 살리되, 현대 한국어 합쇼체에서 가장 읽히는 직접 명령형으로 옮겼습니다.
- source_word: עֲצָרָה
  english_pob_choice: a solemn assembly
  chosen_korean: 엄숙한 모임
  alternatives_korean:
  - 엄숙한 회중
  - 거룩한 집회
  - 엄숙한 집회
  lexicon: HALOT
  rationale: 단순한 집회가 아니라 제의적·공식적 성격의 모임이라는 점을 드러내되, 한국어에서 지나치게 교회적이지 않은 표현을 택했습니다.
- source_word: וַיִּקְרָאוּ
  english_pob_choice: So they proclaimed it
  chosen_korean: 그래서 그들이 그것을 공포했습니다
  alternatives_korean:
  - 그래서 그들이 그것을 선포했습니다
  - 그래서 그들이 그것을 알렸습니다
  lexicon: HALOT
  rationale: 공적 소집/선언의 뜻을 반영해 ‘공포하다’로 옮겼습니다. 본문은 내용을 지칭하는 목적어가 암시되므로 ‘그것을’을 보충했습니다.
theological_decisions:
- issue: בעל을 위한 종교적 소집의 표현 방식
  chosen_reading: ‘바알을 위한 엄숙한 모임’으로, 우상 숭배를 위한 공식 제의 소집이라는 본문의 직설성을 유지했습니다.
  alternative_readings:
  - ‘바알을 섬기는 엄숙한 집회’
  - ‘바알에게 드리는 거룩한 모임’
  rationale: 본문은 예후가 바알 숭배를 위한 공적 모임을 명령하는 장면이므로, 이를 완화하지 않고 직접적으로 드러내는 것이 서사와 의도를 더 잘 보존합니다.
  doctrine_reference: 우상숭배 비판과 서사적 아이러니
