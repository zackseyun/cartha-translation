id: 2KI.10.3
reference: 2 Kings 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/רְאִיתֶ֞ם הַ/טּ֤וֹב וְ/הַ/יָּשָׁר֙ מִ/בְּנֵ֣י אֲדֹנֵי/כֶ֔ם וְ/שַׂמְתֶּ֖ם עַל כִּסֵּ֣א אָבִ֑י/ו וְ/הִֽלָּחֲמ֖וּ עַל בֵּ֥ית אֲדֹנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/003.yaml
  text: Then choose the best and most upright of your master's sons[a], set him on his father's throne[b], and fight for your master's house.
  footnotes:
  - marker: a
    text: Or 'look for the good and upright one from among your master's sons.' The Hebrew verb is literally 'see,' but here it carries the sense of selecting after consideration.
    reason: lexical_alternative
  - marker: b
    text: '''House'' here means the royal household or dynasty, not merely a physical building.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 너희는 왕자의 아들들 가운데서 가장 좋고 가장 올바른 사람을 택하여 그의 아버지의 왕좌에 앉히고, 너희 주인의 집안을 위하여 싸우십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 곧 ‘너희 주인의 아들들 가운데서 선하고 올바른 사람을 찾아 택하라’는 뜻입니다. 히브리어 동사는 문자적으로는 ‘보다’이지만, 여기서는 숙고하여 선발하는 의미로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘집안’은 단순한 건물이 아니라 왕가나 왕조를 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: וּרְאִיתֶם
  english_pob_choice: choose
  chosen_korean: 택하여
  alternatives_korean:
  - 보고
  - 살펴
  - 골라
  lexicon: HALOT
  rationale: 직역하면 ‘보라’이지만, 문맥상 충분히 살핀 뒤 사람을 선발하는 뜻이므로 한국어에서는 ‘택하다’가 의도된 행위를 가장 자연스럽게 드러냅니다.
- source_word: הַטּוֹב וְהַיָּשָׁר
  english_pob_choice: the best and most upright
  chosen_korean: 가장 좋고 가장 올바른
  alternatives_korean:
  - 좋고 올바른
  - 선하고 바른
  - 가장 선하고 가장 바른
  lexicon: HALOT
  rationale: 후보 중 최선자를 고르는 상황이므로 비교적·선택적 뉘앙스를 살려 ‘가장 좋고 가장 올바른’으로 옮겼습니다.
- source_word: מִבְּנֵי אֲדֹנֵיכֶם
  english_pob_choice: of your master's sons
  chosen_korean: 왕자의 아들들 가운데서
  alternatives_korean:
  - 너희 주인의 아들들 가운데서
  - 너희 주군의 아들들 가운데서
  - 너희 주인의 아들들 중에서
  lexicon: HALOT
  rationale: 여기서 אֲדֹנֵיכֶם은 하나님이 아니라 인간 통치자를 가리키므로, 문맥을 분명히 하면서도 왕실 맥락을 드러내기 위해 ‘왕자’로 구체화했습니다.
- source_word: כִּסֵּא אָבִיו
  english_pob_choice: his father's throne
  chosen_korean: 그의 아버지의 왕좌
  alternatives_korean:
  - 그 아버지의 왕좌
  - 그의 아버지의 보좌
  - 아버지의 왕좌
  lexicon: HALOT
  rationale: 즉위의 의미를 살리기 위해 단순한 ‘자리’보다 ‘왕좌’가 적합하며, 소유 관계를 분명히 하기 위해 ‘그의 아버지의’로 옮겼습니다.
- source_word: בֵּית אֲדֹנֵיכֶם
  english_pob_choice: your master's house
  chosen_korean: 너희 주인의 집안을
  alternatives_korean:
  - 너희 주인의 집을
  - 너희 주인의 왕실을
  - 너희 주인의 가문을
  lexicon: HALOT
  rationale: POB의 주석처럼 ‘집’은 건물보다 왕가/왕조를 뜻하므로, 한국어에서는 그 dynastic sense를 자연스럽게 드러내는 ‘집안’을 택했습니다.
theological_decisions:
- issue: 아드니켐(אֲדֹנֵיכֶם)의 대상
  chosen_reading: 인간 왕권의 주인(아합 가문)을 가리키는 말로 읽고 ‘주인’으로 번역했습니다.
  alternative_readings:
  - 주님
  - 주
  rationale: 본문은 하나님 칭호가 아니라 인간 통치자에 대한 호칭이므로, ‘주님’으로 옮기면 신적 칭호와 혼동될 수 있습니다.
  doctrine_reference: 'Contested terms rule: human referents of אדון are translated by sense, not by the divine-title convention.'
