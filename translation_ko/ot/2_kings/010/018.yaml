base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
  footnotes:
  - marker: a
    text: 'Jehu''s statement is ironic in context: he says he will serve Baal ''much,'' but the narrative shows this is a ruse to gather Baal''s worshipers.'
    reason: cross_reference
  - marker: b
    text: Or 'worshiped Baal' / 'will worship him'; the Hebrew verb 'served' is also used for religious service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예후가 모든 백성을 모아 그들에게 말했습니다. "아합은 바알을 조금 섬겼지만, 예후는 그를 많이 섬길 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아합은 바알을 조금 예배했지만, 예후는 그를 많이 예배할 것입니다.’ 히브리어 עבד는 여기서 신에게 드리는 종교적 섬김을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 예후의 말은 문맥상 바알 숭배자들을 모으기 위한 기만적 발언입니다.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  english_pob_choice: gathered
  chosen_korean: 모아
  alternatives_korean:
  - 모았습니다
  - 집결시켰습니다
  lexicon: HALOT
  rationale: 사람들을 한곳으로 불러모으는 동작을 자연스러운 현대 한국어 동사로 옮겼습니다.
- source_word: כָּל הָעָם
  english_pob_choice: all the people
  chosen_korean: 모든 백성
  alternatives_korean:
  - 온 백성
  - 모든 사람들
  lexicon: HALOT
  rationale: 히브리어의 폭넓은 집합 표현을 살려, 특정 계층이 아닌 전체 민중을 가리키는 말로 옮겼습니다.
- source_word: עָבַד אֶת הַבַּעַל / יַעַבְדֶנּוּ
  english_pob_choice: served Baal / will serve him
  chosen_korean: 바알을 ... 섬겼지만 / 그를 ... 섬길 것입니다
  alternatives_korean:
  - 바알을 ... 예배했지만 / 그를 ... 예배할 것입니다
  - 바알을 ... 섬겼지만 / 바알을 ... 섬길 것입니다
  lexicon: HALOT
  rationale: עבד의 종교적 사용을 살려 '섬기다'를 택했고, 대명사 '그를'은 히브리어의 목적어 지시를 그대로 반영했습니다.
- source_word: מְעָט ... הַרְבֵּה
  english_pob_choice: a little ... much
  chosen_korean: 조금 ... 많이
  alternatives_korean:
  - 약간 ... 크게
  - 적게 ... 많이
  lexicon: HALOT
  rationale: 대조 구조를 가장 간명하게 살리는 한국어 부사 쌍으로, 히브리어의 짧은 병행을 유지했습니다.
theological_decisions:
- issue: 예후의 발언에 내재한 아이러니
  chosen_reading: 본문은 예후의 발언을 직설적으로 옮기고, 속임수라는 해석은 본문 바깥의 서술 맥락에 맡겼습니다.
  alternative_readings:
  - '''가장할 것입니다''처럼 의도를 드러내는 표현을 넣기'
  - '''예배할 것입니다''로 종교적 뉘앙스를 강화하기'
  rationale: 히브리어 문장은 말 그대로의 발언을 보고하므로, 본문 자체에 없는 해설을 삽입하지 않는 것이 소스 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §1, §3
