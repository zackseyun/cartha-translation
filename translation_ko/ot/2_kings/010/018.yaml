base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/018.yaml
  text: Then Jehu gathered all the people and said to them[a], “Ahab served Baal a little[b]; Jehu will serve him much.”
  footnotes:
  - marker: a
    text: 'Jehu''s statement is ironic in context: he says he will serve Baal ''much,'' but the narrative shows this is a ruse to gather Baal''s worshipers.'
    reason: cross_reference
  - marker: b
    text: Or 'worshiped Baal' / 'will worship him'; the Hebrew verb 'served' is also used for religious service.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 예후가 모든 백성을 모아 그들에게 말했습니다. "아합은 바알을 조금 섬겼지만, 예후는 그를 많이 섬길 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 עבד는 여기서 신에게 드리는 종교적 섬김을 가리킬 수 있으므로, POB는 '섬기다'를 택했습니다.
    reason: lexical_alternative
  - marker: b
    text: 예후의 말은 문맥상 바알 숭배자들을 모으기 위한 기만적 발언입니다.
    reason: cross_reference
lexical_decisions:
