  rationale: 본문의 신명기적 고유명사 יהוה를 합쇼체 본문에서도 고유명으로 보존하기 위해 ‘야훼’를 사용했습니다.
  doctrine_reference: 'Project glossary: יהוה / YHWH → 야훼'
