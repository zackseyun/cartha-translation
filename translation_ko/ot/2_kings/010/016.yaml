base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/016.yaml
  text: Then he said[a], “Come with me and see my zeal for Yahweh.” So they had him ride in his chariot.
  footnotes:
  - marker: a
    text: Or 'my jealousy for the LORD.' The Hebrew noun can denote either zeal or jealousy depending on context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 말했습니다. 「나와 함께 와서 야훼를 향한 나의 열심을 보십시오」. 그래서 사람들이 그를 그의 병거에 태웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나의 질투’를 뜻할 수 있습니다. 히브리어 명사는 문맥에 따라 열심이나 질투를 나타낼 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה
  english_pob_choice: Come
  chosen_korean: 와서
  alternatives_korean:
  - 오십시오
  - 함께 오십시오
  lexicon: HALOT
  rationale: 초청형 명령으로서 자연스러운 합쇼체 구어를 살리되, 단순한 이동 명령이 아니라 동행 요청임을 반영했습니다.
- source_word: אִתִּי
  english_pob_choice: with me
  chosen_korean: 나와 함께
  alternatives_korean:
  - 나와
  - 함께
  lexicon: HALOT
  rationale: 동행의 뜻을 분명히 드러내는 가장 자연스러운 한국어 표현을 택했습니다.
- source_word: בְּקִנְאָתִי
  english_pob_choice: my zeal
  chosen_korean: 나의 열심
  alternatives_korean:
  - 나의 질투
  - 나의 열정
  lexicon: HALOT
  rationale: קִנְאָה의 문맥상 의미를 ‘질투’보다 야훼에 대한 헌신적 열심으로 이해하는 것이 적절하므로, 한국어도 그 긴장을 살려 ‘열심’으로 옮겼습니다.
- source_word: לַיהוָה
  english_pob_choice: for Yahweh
  chosen_korean: 야훼를 향한
  alternatives_korean:
  - 야훼를 위한
  - 야훼께 드리는
  lexicon: HALOT
  rationale: 전치사 ל־의 방향성/대상성을 자연스럽게 살려, 열심의 대상이 야훼임을 분명히 했습니다.
- source_word: וַיַּרְכִּבוּ אֹתוֹ בְּרִכְבּוֹ
  english_pob_choice: they had him ride in his chariot
  chosen_korean: 사람들이 그를 그의 병거에 태웠습니다
  alternatives_korean:
  - 사람들이 그를 그의 병거에 태웠습니다
  - 그를 그의 병거로 태웠습니다
  lexicon: HALOT
  rationale: 사역형의 ‘타게 하다’라는 의미를 한국어로 자연스럽게 풀어, 그가 스스로 탄 것이 아니라 다른 이들이 태웠음을 드러냈습니다.
theological_decisions:
