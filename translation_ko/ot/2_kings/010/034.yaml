source:
  edition: WLC
  text: וְ/יֶ֨תֶר דִּבְרֵ֥י יֵה֛וּא וְ/כָל אֲשֶׁ֥ר עָשָׂ֖ה וְ/כָל גְּבוּרָת֑/וֹ הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/034.yaml
  text: Now the rest of the acts of Jehu[a], and all that he did[b], and all his might—are they not written in the Book of the Chronicles of the Kings of Israel?
  footnotes:
  - marker: a
    text: Or 'and all his mighty deeds' for 'and all his might.'
    reason: lexical_alternative
  - marker: b
    text: This refers to a royal annalistic source, not necessarily the canonical book of Chronicles.
    reason: cross_reference
translation:
  language: ko
  text: 이제 여호야의 나머지 행적과 그가 행한 모든 일과 그의 모든 능력은 이스라엘 왕들의 역대기 책에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 모든 능력’은 ‘그의 모든 용맹한 행위’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘역대기 책’은 정경 「역대기」가 아니라 이스라엘 왕실 연대기 자료를 가리킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יֵהוּא
  english_pob_choice: Now the rest of the acts of Jehu
  chosen_korean: 여호야의 나머지 행적
  alternatives_korean:
  - 여호야의 나머지 일들
  - 여호야의 남은 행적
  lexicon: HALOT
  rationale: 왕 열전의 상투적 결론식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 기록된 행적·사적을 가리키므로, 자연스럽게 ‘행적’으로 옮겼습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그가 행한 모든 일
  alternatives_korean:
  - 그가 한 모든 것
  - 그가 행한 모든 것
  lexicon: HALOT
  rationale: 포괄성을 살리면서도 한국어 왕정 서술체에 맞게 ‘행한 모든 일’로 옮겼습니다.
- source_word: וְכָל גְּבוּרָתוֹ
  english_pob_choice: and all his might
  chosen_korean: 그의 모든 능력
  alternatives_korean:
  - 그의 모든 용맹
  - 그의 모든 무훈
  lexicon: HALOT
  rationale: גְּבוּרָה는 힘, 용맹, 위업을 포괄하므로, 본문이 요약하는 왕의 역량을 간명하게 드러내는 ‘능력’을 택했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  english_pob_choice: the Book of the Chronicles of the Kings of Israel
  chosen_korean: 이스라엘 왕들의 역대기 책
  alternatives_korean:
  - 이스라엘 왕들의 연대기 책
  - 이스라엘 왕들의 역대기
  lexicon: HALOT
  rationale: 이는 정경 역대기가 아니라 왕실 연대기 자료를 가리키는 관용구이므로, 한국어에서는 ‘역대기 책’으로 살리되 문맥상 사료적 의미를 유지했습니다.
theological_decisions:
- issue: 히브리어 수사 의문문 הֲלוֹא의 처리
  chosen_reading: 반어적 확인을 살린 질문형으로 옮겨 ‘기록되어 있지 않습니까?’라고 했습니다.
  alternative_readings:
  - ‘분명히 기록되어 있습니다’
  - ‘기록되어 있지요?’
  rationale: 본문은 긍정 응답을 기대하는 수사 의문문이므로, 단정문보다 질문형이 원문의 기능을 더 잘 보존합니다.
  doctrine_reference: 서사/문체 보존
