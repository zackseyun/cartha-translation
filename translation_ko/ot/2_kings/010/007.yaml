base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/007.yaml
  text: And when the letter came to them[a], they took the king’s sons and slaughtered seventy men, and put their heads in baskets and sent them to him at Jezreel.
  footnotes:
  - marker: a
    text: Or 'in pots' or 'in jars'; the Hebrew term denotes containers and is not limited with certainty to woven baskets.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 편지가 그들에게 이르렀을 때, 그들은 왕의 아들 일흔 명을 데려다가 죽이고, 그들의 머리를 광주리에 담아 이스르엘에 있는 그에게 보냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 두드(דוּד)는 냄비, 항아리, 큰 용기 등 넓은 범위의 용기를 가리킬 수 있으므로, 여기서 반드시 ‘광주리’만을 뜻하는 것은 아닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסֵּפֶר
  english_pob_choice: the letter
  chosen_korean: 그 편지
  alternatives_korean:
  - 그 문서
  - 그 메시지
  lexicon: HALOT
  rationale: 이 문맥에서는 예후가 보낸 서면 통신문을 가리키므로, 일반적 ‘문서’보다 구체적인 ‘편지’가 자연스럽고 원문의 상황을 더 잘 드러냅니다.
- source_word: וַיִּקְחוּ אֶת בְּנֵי הַמֶּלֶךְ
  english_pob_choice: they took the king’s sons
  chosen_korean: 그들은 왕의 아들들을 붙잡아
  alternatives_korean:
  - 그들은 왕의 아들들을 데려다가
  - 그들은 왕의 왕자들을
  lexicon: HALOT
  rationale: ‘취하다/잡다’의 직접적 의미를 살려, 단순히 이동시키는 뉘앙스의 ‘데려가다’보다 긴박한 체포·압수의 느낌이 드는 ‘붙잡다’를 택했습니다.
- source_word: וַיִּשְׁחֲטוּ
  english_pob_choice: slaughtered
  chosen_korean: 죽이고
  alternatives_korean:
  - 도살하고
  - 살육하고
  lexicon: HALOT
  rationale: ‘שׁחט’의 폭력성을 살리되 한국어에서 지나치게 동물 도살 이미지로 흐르지 않도록, 문맥상 자연한 ‘죽이고’로 옮겼습니다. 뒤의 수량과 이어져 집단 처형의 잔혹성이 충분히 드러납니다.
- source_word: בַּדּוּדִים
  english_pob_choice: in baskets
  chosen_korean: 광주리에 담아
  alternatives_korean:
  - 그릇에 담아
  - 항아리에 넣어
  lexicon: HALOT
  rationale: 용기가 정확히 무엇인지는 불확실하지만, POB가 지적하듯 단순한 ‘바구니’에 한정할 수 없습니다. 한국어에서는 이동용 용기를 넓게 포괄하면서도 읽기 자연스러운 ‘광주리’로 처리했습니다.
theological_decisions:
- issue: 서술의 잔혹성 표현
  chosen_reading: 원문의 폭력성을 완화하지 않고, ‘죽이고…머리를…담아’처럼 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘처형하고’로 바꾸는 방식
  - 머리 부분을 돌려 말하는 방식
  rationale: 이 본문은 정치적 폭력의 현실을 드러내는 역사 서술이므로, 원문이 주는 잔혹성과 충격을 약화시키지 않는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 서술의 사실성/역사성
- issue: 지명 표현
  chosen_reading: ‘이스르엘로’로 옮겨 목적지의 방향성을 살렸습니다.
  alternative_readings:
  - ‘이스르엘에’
  - ‘이스르엘로 향하여’
  rationale: 히브리어 방향격이 이동의 도착점을 가리키므로, 한국어에서도 도착·향함을 자연스럽게 담는 ‘이스르엘로’가 가장 간결합니다.
  doctrine_reference: 서술 문법
