review_pass:
  verdict: revise
  source_fidelity: 핵심 사건과 경고의 생명-대체 책임 공식은 대체로 충실합니다. 그러나 לוֹ를 ‘자기 몫으로’로 번역한 것은 본문에 없는 소유·배분의 뜻을 부가하므로 수정해야 합니다. 이는 예후가 사람들을 바깥에 배치했다는 뜻으로 자연스럽게 처리하는 것이 안전합니다.
  naturalness: ‘제사를 지내며 번제를 드리러’는 두 동작의 연결이 다소 어색하고, ‘자기 몫으로 배치해 두고’는 현대 한국어에서 부자연스럽습니다. ‘제사와 번제를 드리려고 들어갔습니다’, ‘바깥에 팔십 명을 배치해 두었습니다’가 자연스럽습니다.
  terminology: ‘번제’, ‘예후’, ‘목숨’, ‘너희 손에 넘겨 주는’은 적절합니다. 경고문의 두 번째 ‘그 사람’은 도망친 사람을 가리키므로, 본문 문맥을 보존하면서 ‘도망친 그 사람’으로 밝혀 줄 수 있습니다.
  issues:
  - severity: medium
    issue: לוֹ를 ‘자기 몫으로’로 번역함
    rationale: לוֹ는 여기서 예후가 자신을 위해 또는 자신의 지시 아래 사람들을 배치했다는 뉘앙스로 이해될 수 있으나, ‘자기 몫’은 분배받은 소유물이라는 한국어 의미를 더하여 부정확합니다. 한국어에서는 이를 생략하고 ‘팔십 명을 배치해 두었습니다’로 옮겨도 문맥상 의미 손실이 없습니다.
  - severity: low
    issue: 제의 목적 표현의 연결이 어색함
    rationale: ‘제사를 지내며 번제를 드리러’는 병렬 목적어인 זְבָחִים וְעֹלוֹת를 한국어에서 비대칭적으로 연결합니다. ‘제사와 번제를 드리려고’가 병렬성과 목적을 더 자연스럽게 드러냅니다.
  revised_text: 그들이 제사와 번제를 드리려고 들어갔습니다. 예후는 바깥에 팔십 명을 배치해 두고 말하였습니다. “내가 너희 손에 넘겨 주는 사람들 가운데 누구 하나라도 도망치게 하는 자는, 그의 목숨으로 도망친 그 사람의 목숨을 대신할 것입니다.”
  revised_footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 목숨 대신 그의 목숨’입니다. 첫 번째 ‘그의 목숨’은 도망을 허용한 사람의 목숨이고, 두 번째는 도망친 사람의 목숨을 가리킵니다.
    reason: lexical_alternative
  revision_rationale: ‘자기 몫으로’를 삭제하여 לוֹ에 근거하지 않는 소유·배분의 의미를 제거했습니다. 제의 행위의 병렬 구조를 ‘제사와 번제’로 정리했으며, 생명-대체 경고는 한국어에서 지시 대상이 혼동되지 않도록 문맥상 도망친 사람을 밝혔습니다. 각주 표지는 수정문에서 ‘팔십 명’ 뒤에 유지해야 합니다.
