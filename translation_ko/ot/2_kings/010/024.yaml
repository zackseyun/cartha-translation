base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/024.yaml
  text: And they went in to offer sacrifices and burnt offerings. Now Jehu had stationed for himself outside eighty men[a], and he said, “The man who lets any of the men whom I am delivering into your hands escape—his life for that man’s life.”
  footnotes:
  - marker: a
    text: Hebrew literally, 'his life instead of his life'; the sense is that the guard who allows an escape will forfeit his own life in place of the escapee’s life.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들이 제사를 지내며 번제를 드리러 들어갔습니다. 그런데 예후는 바깥에 팔십 명을 자기 몫으로 배치해 두고[a], 말하였습니다. “내가 너희 손에 넘겨 주는 사람들 가운데서 누구 하나라도 도망치게 하는 자는—그의 목숨으로 그 사람의 목숨을 대신할 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 목숨 대신 그의 목숨’입니다. 뜻은 경비가 도망을 허용하면 도망자의 목숨을 대신해 자기 목숨을 잃게 된다는 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  english_pob_choice: they went in
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 갔습니다
  - 들어섰습니다
  lexicon: HALOT
  rationale: 문맥상 제의 행위를 하러 성소 안으로 들어가는 동작이므로, 방향성과 자연스러움을 함께 살려 ‘들어갔습니다’로 옮겼습니다.
- source_word: לַעֲשׂוֹת זְבָחִים וְעֹלֹת
  english_pob_choice: to offer sacrifices and burnt offerings
  chosen_korean: 제사를 지내며 번제를 드리러
  alternatives_korean:
  - 제사를 드리며 번제를 드리러
  - 희생제물을 바치며 번제를 드리러
  lexicon: HALOT
  rationale: עשה+제의 목적어는 ‘행하다’보다 제의적으로 ‘제사를 지내다/드리다’가 더 정확하므로, זְבָחִים은 ‘제사’, וְעֹלֹת은 관용적으로 ‘번제’로 옮겼습니다.
- source_word: שָׂם לוֹ בַחוּץ שְׁמֹנִים אִישׁ
  english_pob_choice: had stationed for himself outside eighty men
  chosen_korean: 바깥에 팔십 명을 자기 몫으로 배치해 두고
  alternatives_korean:
  - 바깥에 팔십 명을 두고
  - 바깥에 팔십 명을 배치해 두고
  lexicon: HALOT
  rationale: שׂים לוֹ는 단순한 ‘두다’보다 예후가 직접 경비를 배치한 뜻이므로 ‘배치해 두고’로 살렸고, לוֹ는 소유/책임 뉘앙스를 살려 ‘자기 몫으로’로 표현했습니다.
- source_word: נַפְשׁוֹ תַּחַת נַפְשׁוֹ
  english_pob_choice: his life for that man’s life
  chosen_korean: 그의 목숨으로 그 사람의 목숨을 대신할 것입니다
  alternatives_korean:
  - 그의 목숨은 그 사람의 목숨을 대신할 것입니다
  - 그의 목숨을 그 사람의 목숨 대신으로 바칠 것입니다
  lexicon: HALOT
  rationale: נפש는 여기서 ‘목숨/생명’의 뜻이 자연스러우며, תַּחַת은 대체·대신의 의미이므로 보복적 책임 문구를 분명히 드러내는 ‘대신할 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 경비 책임 위반에 대한 보복적 판결 공식
  chosen_reading: 도망을 허용한 경비는 도망자의 목숨을 대신해 자기 목숨을 잃게 되는 책임 선고로 읽었습니다.
  alternative_readings:
  - 단순한 경고로 완화하는 읽기
  - 법정적 책임을 약하게 표현하는 읽기
  rationale: 히브리어의 ‘목숨을 대신하여 목숨’이라는 공식은 우발적 손실이 아니라 생명으로 갚는 강한 책임 구조를 나타내므로, 그 긴장을 약화하지 않았습니다.
  doctrine_reference: 출 21:23-25의 보복 원리와 본문의 서술적 책임 언어
