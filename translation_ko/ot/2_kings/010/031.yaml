  naturalness: 초안의 ‘율법 안에서 … 행하려고’은 현대 한국어 성경 문체에서 다소 부자연스럽고, ‘온전히’는 ‘온 마음을 다하여’라는 원문의 표현을 충분히 드러내지 못합니다. 관계절을 여로보암에 직접 연결하면 대시를 피하면서도 더 명료하고 자연스럽습니다.
