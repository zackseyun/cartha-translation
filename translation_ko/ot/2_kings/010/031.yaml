  to: 그러나 예후는 온 마음을 다하여 이스라엘의 하나님 야훼의 율법을 따라 행하는 데 주의를 기울이지 않았습니다.[a] 그는 여로보암이 이스라엘을 죄짓게 한 죄들에서 돌이키지 않았습니다.[b]
