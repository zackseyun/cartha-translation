id: 2KI.10.31
reference: 2 Kings 10:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵה֗וּא לֹ֥א שָׁמַ֛ר לָ/לֶ֛כֶת בְּ/תֽוֹרַת יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל בְּ/כָל לְבָב֑/וֹ לֹ֣א סָ֗ר מֵ/עַל֙ חַטֹּ֣אות יָֽרָבְעָ֔ם אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/031.yaml
  text: But Jehu was not careful to walk in the law of Yahweh[a], the God of Israel, with all his heart. He did not turn away from the sins of Jeroboam[b], with which he caused Israel to sin.
  footnotes:
  - marker: a
    text: Or 'did not keep to walking in the law of the LORD.' The Hebrew verb can emphasize careful observance.
    reason: lexical_alternative
  - marker: b
    text: That is, the cultic sins associated with Jeroboam's idolatrous system, a recurring formula in Kings.
    reason: cross_reference
translation:
  language: ko
  text: 그러나 예후는 온 마음을 다하여 이스라엘의 하나님 야훼의 율법을 따라 행하는 데 주의를 기울이지 않았습니다.[a] 그는 여로보암이 이스라엘을 죄짓게 한 죄들에서 돌이키지 않았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 율법을 따라 행하는 것을 지키지 않았다’로 옮길 수 있습니다. 히브리어 동사는 주의 깊은 준수를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여로보암의 우상숭배적 제도와 연결된 제의적 죄들을 가리키는 열왕기의 반복 공식입니다.
    reason: cross_reference
lexical_decisions:
- source_word: שָׁמַר + לָלֶכֶת
  english_pob_choice: was not careful to walk
  chosen_korean: 온전히 행하려고 주의하지 않았습니다
  alternatives_korean:
  - 행하지 않았습니다
  - 지키지 않았습니다
  - 가려고 주의하지 않았습니다
  lexicon: HALOT
  rationale: שָׁמַר + 부정사 구문은 단순한 불이행보다 ‘주의하여 지키다/행하다’의 뉘앙스가 있어, 예후의 부주의한 불순종을 드러내도록 옮겼습니다.
- source_word: תּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: HALOT
  rationale: 언약적 문맥에서 תּוֹרָה는 단순한 ‘가르침’보다 하나님의 율법이 자연스러우므로 ‘율법’으로 옮겼습니다.
- source_word: בְּכָל לְבָבוֹ
  english_pob_choice: with all his heart
  chosen_korean: 온전히
  alternatives_korean:
  - 마음을 다해
  - 온 마음을 다해
  lexicon: HALOT
  rationale: 히브리어 관용구의 총체적·내적 헌신을 살리면서 한국어 문맥에서는 ‘온전히’가 앞절의 ‘행하다’와 결합해 자연스럽습니다.
- source_word: סָר מֵעַל
  english_pob_choice: did not turn away
  chosen_korean: 돌이키지 않았습니다
  alternatives_korean:
  - 떠나지 않았습니다
  - 벗어나지 않았습니다
  - 돌아서지 않았습니다
  lexicon: HALOT
  rationale: 관용적 ‘돌이키다’는 죄의 길에서의 전환 부재를 잘 드러내며, 단순한 방향 전환보다 도덕·언약적 의미를 보존합니다.
- source_word: חַטֹּאות יָרָבְעָם / הֶחֱטִיא אֶת יִשְׂרָאֵל
  english_pob_choice: the sins of Jeroboam ... caused Israel to sin
  chosen_korean: 여로보암의 죄들 ... 그가 이스라엘을 죄짓게 한 그 죄들
  alternatives_korean:
  - 여로보암의 죄들 ... 그가 이스라엘을 범죄하게 한 그 죄들
  - 여로보암의 죄들 ... 그가 이스라엘을 죄에 빠뜨린 그 죄들
  lexicon: HALOT
  rationale: 열왕기의 반복 공식인 여로보암의 제의적 죄와 그 결과를 함께 살리되, 원문의 인과절을 한국어에서 명시적으로 풀어 오해를 줄였습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: יהוה를 ‘야훼’로 옮기고, ‘이스라엘의 하나님’과 함께 병기했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본 프로젝트의 기준에 따라 신성호칭 대체어 대신 고유한 신명 표기를 보존해, 본문이 말하는 언약적 관계를 더 직접적으로 드러냅니다.
  doctrine_reference: Tetragrammaton rendering policy
- issue: 예후에 대한 평가의 긴장
  chosen_reading: 예후의 개혁 이전 업적과 별개로, 언약적 순종의 결핍을 분명히 유지했습니다.
  alternative_readings:
  - 정치적 개혁의 미완성만을 지적하는 읽기
  - 개인적 신앙까지는 평가하지 않는 읽기
  rationale: 본문의 ‘온전히’와 ‘돌이키지 않았다’는 표현은 정치적 실패보다 더 넓은 신앙·언약적 평가를 가리키므로, 그 긴장을 완화하지 않고 유지했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it
