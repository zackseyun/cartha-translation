  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
  footnotes:
  - marker: a
    text: Hebrew 'as far as the city/citadel of the house of Baal'; the phrase may refer to an inner fortified or inner sacred area of the temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 예후가 번제를 드리기를 마치자, 예후가 호위병들과 지휘관들에게 말했습니다. 「들어가서 그들을 치십시오. 한 사람도 나오지 못하게 하십시오.」 그래서 그들은 칼날로 그들을 쳐 죽였습니다. 호위병들과 지휘관들은 그들을 내던지고 바알 신전의 안쪽 성소까지 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바알의 집의 도시’ 또는 ‘바알의 집의 성채’로도 옮길 수 있습니다. 이 표현은 신전 복합체의 안쪽 요새화 구역이나 성스러운 내부 구역을 가리킬 수 있습니다.
    reason: lexical_alternative
