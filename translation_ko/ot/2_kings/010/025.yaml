base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/025.yaml
  text: And when he had finished offering the burnt offering[a], Jehu said to the runners and to the officers, “Go in; strike them down. Let no man come out.” So they struck them down with the edge of the sword, and the runners and the officers threw them out and went as far as the inner shrine of the house of Baal.
  footnotes:
  - marker: a
    text: Hebrew 'as far as the city/citadel of the house of Baal'; the phrase may refer to an inner fortified or inner sacred area of the temple complex.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 번제 드리기를 마치자, 예후가 달리는 자들과 지휘관들에게 말했습니다. 「들어가서 그들을 치십시오. 한 사람도 나오지 못하게 하십시오.」 그들이 칼날로 그들을 쳤고, 달리는 자들과 지휘관들은 그들을 내던진 뒤 바알의 집의 안쪽 성소까지 갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘바알의 집의 도시/성채’라고도 읽힐 수 있으나, 문맥상 안쪽의 성소나 내부 구역을 가리키는 것으로 이해할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: כְּכַלֹּתוֹ
  english_pob_choice: when he had finished
  chosen_korean: 드리기를 마치자
  alternatives_korean:
  - 마치고 나자
  - 마치자마자
  lexicon: HALOT
  rationale: 완료 동작 뒤에 이어지는 서술 전환을 자연스럽게 살리면서, 히브리어의 시간적 순서를 압축해 표현했습니다.
- source_word: לַעֲשׂוֹת הָעֹלָה
  english_pob_choice: offering the burnt offering
  chosen_korean: 번제 드리기
  alternatives_korean:
  - 번제를 행하기
  - 번제를 바치기
  lexicon: HALOT
  rationale: עֹלָה는 제의적 ‘번제’로 옮기고, עָשָׂה와 결합한 제의 관용구는 한국어에서 자연스러운 ‘드리기’로 풀었습니다.
- source_word: לָרָצִים
  english_pob_choice: to the runners
  chosen_korean: 달리는 자들
  alternatives_korean:
  - 경호병들
  - 전령들
  lexicon: HALOT
  rationale: 직역에 가까운 ‘달리는 자들’이 히브리어 어감을 가장 투명하게 드러내며, 문맥상 군사적 수행 인원임은 뒤의 행동으로 충분히 드러납니다.
- source_word: לַשָּׁלִשִׁים
  english_pob_choice: to the officers
  chosen_korean: 지휘관들
  alternatives_korean:
  - 장교들
  - 부관들
  lexicon: HALOT
  rationale: שָׁלִישׁ의 군사적 직분을 한국어 현대어로 지나치게 세분화하지 않으면서도, 명령 수행의 책임 있는 지위를 드러내는 표현을 택했습니다.
- source_word: לְפִי חָרֶב
  english_pob_choice: with the edge of the sword
  chosen_korean: 칼날로
  alternatives_korean:
  - 칼의 날로
  - 칼로
  lexicon: HALOT
  rationale: 히브리어 관용구의 공격성과 도구성을 간결하게 살리기 위해 ‘칼날로’로 옮겼습니다.
- source_word: עַד עִיר בֵּית הַבָּעַל
  english_pob_choice: as far as the inner shrine of the house of Baal
  chosen_korean: 바알의 집의 안쪽 성소까지
  alternatives_korean:
  - 바알의 집의 성채까지
  - 바알의 집의 도시까지
  lexicon: HALOT
  rationale: עִיר는 문자적으로는 ‘도시’이지만, 문맥상 성전/건물 내부의 구획을 가리킬 가능성을 반영하여 ‘안쪽 성소’로 옮기고, POB의 해석적 선택을 따라 ‘까지’를 유지했습니다.
theological_decisions:
- issue: 제의적 표현과 폭력적 명령의 직설성
  chosen_reading: 히브리어 서술의 흐름을 완화하지 않고, 예후의 명령과 즉각적인 학살을 직접적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘처치하다’로 낮추는 번역
  - 제의 행위를 추상화하는 번역
  rationale: 본문은 제의가 끝난 직후의 군사적 처형을 강하게 대비시키므로, 직설적 어휘가 서술 의도와 긴장을 더 잘 보존합니다.
  doctrine_reference: 본문 해설 차원의 서술적 판단
