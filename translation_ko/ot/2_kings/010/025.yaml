  naturalness: ‘바알의 집의 안쪽 성소’는 소유격이 중첩되어 다소 부자연스럽습니다. ‘바알 신전의 안쪽 성소’가 현대 표준어 문장으로 자연스럽고 원문의 신전 맥락도 보존합니다. ‘달리는 자들’은 직역이지만 현대 한국어에서 직책명으로 매우 어색하므로, 문맥상 기능을 나타내는 ‘호위병들’이 적절합니다.
