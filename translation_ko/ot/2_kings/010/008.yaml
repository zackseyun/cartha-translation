  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/מַּלְאָךְ֙ וַ/יַּגֶּד ל֣/וֹ לֵ/אמֹ֔ר הֵבִ֖יאוּ רָאשֵׁ֣י בְנֵֽי הַ/מֶּ֑לֶךְ וַ/יֹּ֗אמֶר שִׂ֣ימוּ אֹתָ֞/ם שְׁנֵ֧י צִבֻּרִ֛ים פֶּ֥תַח הַ/שַּׁ֖עַר עַד הַ/בֹּֽקֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/008.yaml
  text: The messenger came and told him[a], saying, “They have brought the heads of the king’s sons.” And he said, “Put them in two heaps at the entrance of the gate until morning.”
  footnotes:
  - marker: a
    text: Or “in two piles.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그 사자가 와서 그에게 알리며 말했습니다. "왕의 아들들의 머리를 가져왔습니다." 그러자 그가 말했습니다. "그것들을 성문 어귀에 두 무더기로, 아침까지 두십시오."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “두 더미로.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 그 사자
  alternatives_korean:
  - 그 전령
  - 그 메신저
  lexicon: HALOT
  rationale: 문맥상 초자연적 ‘천사’가 아니라 소식을 전하는 인간 전달자이므로, 기존 POB의 ‘messenger’에 맞춰 ‘사자’로 옮겼습니다.
- source_word: וַיַּגֶּד לוֹ לֵאמֹר
  english_pob_choice: told him, saying
  chosen_korean: 그에게 알리며 말했습니다
  alternatives_korean:
  - 그에게 보고하며 말했습니다
  - 그에게 말했습니다
  lexicon: HALOT
  rationale: 보고 동사와 ‘말하다’의 결합을 함께 살려 서술의 형식을 유지하면서도 한국어로 자연스럽게 표현했습니다.
- source_word: שְׁנֵי צִבֻּרִים
  english_pob_choice: in two heaps
  chosen_korean: 두 무더기로
  alternatives_korean:
  - 두 더미로
  - 두 소쿠리로
  lexicon: HALOT
  rationale: צִבֻּרִים은 ‘무더기/더미’를 뜻하므로, 시신 머리들을 쌓아 둔 모습을 드러내는 ‘두 무더기’가 가장 직접적입니다.
- source_word: פֶּתַח הַשַּׁעַר
  english_pob_choice: at the entrance of the gate
  chosen_korean: 성문 어귀에
  alternatives_korean:
  - 성문 입구에
  - 문 어귀에
  lexicon: HALOT
  rationale: שער의 ‘문’보다 성읍의 관문을 가리키는 ‘성문’이 더 정확하며, פֶּתַח의 위치 감각은 ‘어귀’로 자연스럽게 살렸습니다.
theological_decisions:
- issue: 왕의 아들들의 머리를 어떻게 직설적으로 표현할지
  chosen_reading: ‘왕의 아들들의 머리’라고 직접 옮겨, 폭력적 결과를 완화하지 않았습니다.
  alternative_readings:
  - ‘그들의 머리’
  - ‘머리들’
  rationale: 본문은 잘려 온 머리들이 도착했음을 서술하므로, 문맥의 잔혹함을 희석하지 않고 독자가 사건의 현실을 그대로 이해하도록 했습니다.
  doctrine_reference: 본문 충실성 / 서사적 직설성
