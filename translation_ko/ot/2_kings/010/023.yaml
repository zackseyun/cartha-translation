base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/023.yaml
  text: Then Jehu and Jehonadab son of Rechab entered the house of Baal[a], and he said to the worshipers of Baal, “Search and see that there is no servant of the LORD here among you, but only worshipers of Baal.”
  footnotes:
  - marker: a
    text: Or “the temple of Baal.” Hebrew literally, “the house of Baal.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예후와 레갑의 아들 여호나답이 바알의 집에 들어가서 바알의 종들에게 말했습니다. “살펴보고 보아서, 너희 가운데 야훼의 종이 하나도 없고 오직 바알의 종들만 있는지 확인하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘바알의 신전’. 히브리어는 문자적으로 ‘바알의 집’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: entered
  chosen_korean: 들어가서
  alternatives_korean:
  - 들어왔습니다
  - 갔습니다
  lexicon: HALOT
  rationale: 목적지가 ‘바알의 집’이므로 단순 이동보다 건물 안으로의 진입을 분명히 하는 ‘들어가서’가 가장 자연스럽습니다.
- source_word: בֵּית הַבָּעַל
  english_pob_choice: the house of Baal
  chosen_korean: 바알의 집
  alternatives_korean:
  - 바알의 신전
  - 바알의 성전
  lexicon: HALOT
  rationale: 히브리어의 직역 구조를 살리되, 문맥상 우상 숭배 장소임이 충분히 드러나므로 ‘집’이라는 מקור 표현을 유지했습니다.
- source_word: עֹבְדֵי הַבַּעַל
  english_pob_choice: worshipers of Baal
  chosen_korean: 바알의 종들
  alternatives_korean:
  - 바알을 섬기는 자들
  - 바알의 예배자들
  lexicon: HALOT
  rationale: עבד는 여기서 종교적 소속과 섬김을 함께 가리키므로, 한국어에서는 ‘종들’이 원문의 소속성과 종속성을 더 직접적으로 반영합니다.
- source_word: מֵעַבְדֵי יְהוָה
  english_pob_choice: servant of the LORD
  chosen_korean: 야훼의 종
  alternatives_korean:
  - 주님의 종
  - 야훼를 섬기는 자
  lexicon: HALOT
  rationale: 본문의 대조가 ‘바알의 종들’과 ‘야훼의 종’이므로, 같은 어휘군을 유지해 대비를 선명하게 했습니다.
theological_decisions:
- issue: 여호와/야훼의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 원문 ההוה의 고유명칭을 드러내는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겨, 바알과의 충돌이라는 본문의 신학적 대비를 보존했습니다.
  doctrine_reference: 'POB contested terms: יהוה / YHWH → 야훼'
