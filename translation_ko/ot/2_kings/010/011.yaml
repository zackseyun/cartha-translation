  source_fidelity: 핵심 의미는 잘 반영했습니다. 그러나 מְיֻדָּעָיו를 옮긴 ‘친밀한 사람들’은 현대 한국어에서 다소 부자연스럽고, 각주에서 이를 문자적으로 ‘아는 사람들/지인들’이라고 한 설명은 원문의 수동형 관계 표현을 충분히 정확하게 설명하지 못합니다. 마지막 לוֹ의 모호성은 본문과 각주에서 적절히 보존되어야 합니다.
