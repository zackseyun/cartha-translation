id: 2KI.10.11
reference: 2 Kings 10:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֣ךְ יֵה֗וּא אֵ֣ת כָּל הַ/נִּשְׁאָרִ֤ים לְ/בֵית אַחְאָב֙ בְּ/יִזְרְעֶ֔אל וְ/כָל גְּדֹלָ֖י/ו וּ/מְיֻדָּעָ֣י/ו וְ/כֹהֲנָ֑י/ו עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/011.yaml
  text: So Jehu struck down all who remained of the house of Ahab in Jezreel[a], and all his great men, his close associates, and his priests[c][b], until he left him no survivor.
  footnotes:
  - marker: a
    text: Or 'his nobles' for 'his great men.'
    reason: lexical_alternative
  - marker: b
    text: Or 'his acquaintances' or 'his intimates' for 'his close associates.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'until he left him no survivor,' with 'him' referring to Ahab or to the house of Ahab.
    reason: alternative_reading
translation:
  language: ko
  text: 예후가 이스르엘에서 아합의 집안 중 남아 있던 자들과 그의 귀인들과 그의 친밀한 사람들과 그의 제사장들을 모두 쳐서 죽여, 그에게 한 사람도 남기지 않았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘귀인들’은 문자적으로는 ‘그의 큰 사람들’에 해당합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘친밀한 사람들’은 문자적으로는 ‘그의 아는 사람들/지인들’에 해당합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 ‘그에게’는 아합 또는 아합의 집안을 가리키는 압축된 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐서 죽여
  alternatives_korean:
  - 쳐서 쓰러뜨려
  - 죽였습니다
  lexicon: HALOT
  rationale: נכה의 서술적 용법이 여기서는 치명적 폭력을 뜻하므로, 현대 한국어에서 자연스럽고 강한 표현인 ‘쳐서 죽여’로 옮겼습니다.
- source_word: הַנִּשְׁאָרִים לְבֵית אַחְאָב
  english_pob_choice: who remained of the house of Ahab
  chosen_korean: 아합의 집안 중 남아 있던 자들
  alternatives_korean:
  - 아합 집안의 살아남은 자들
  - 아합의 집안에 남은 자들
  lexicon: HALOT
  rationale: 왕조/가문을 뜻하는 ‘집안’으로 dynastic affiliation을 살리고, ‘남아 있던 자들’로 잔존 집단의 의미를 자연스럽게 드러냈습니다.
- source_word: גְּדֹלָיו
  english_pob_choice: his great men
  chosen_korean: 그의 귀인들
  alternatives_korean:
  - 그의 큰 사람들
  - 그의 고관들
  lexicon: HALOT
  rationale: 문맥상 아합에게 속한 사회·정치적 유력자를 가리키므로, 한국어에서 위상을 잘 드러내는 ‘귀인들’로 옮겼습니다.
- source_word: מְיֻדָּעָיו
  english_pob_choice: his close associates
  chosen_korean: 그의 친밀한 사람들
  alternatives_korean:
  - 그의 친지들
  - 그의 측근들
  - 그의 지인들
  lexicon: HALOT
  rationale: 단순한 ‘아는 사람들’보다 관계의 가까움과 결속을 살리기 위해 ‘친밀한 사람들’로 옮겼습니다.
theological_decisions:
- issue: 최종절의 대명사 לוֹ의 지시 대상
  chosen_reading: ‘그에게’로 남겨, 아합 또는 아합의 집안을 가리키는 압축된 표현을 유지했습니다.
  alternative_readings:
  - ‘그 집안에’로 풀어 쓰기
  - ‘아합에게’로 명시하기
  rationale: 히브리어의 압축된 지시를 과도하게 풀지 않고, 문맥상 아합/아합의 집안을 가리키는 모호성을 그대로 보존했습니다.
  doctrine_reference: 본문의 지시 대상을 해설로 확정하지 않고 문맥 내 긴장을 유지함
