base_translation:
  language: en
  yaml_path: translation/ot/2_kings/010/005.yaml
  text: So the one who was over the palace[a], and the one who was over the city, along with the elders and the guardians, sent to Jehu, saying, “We are your servants, and all that you say to us we will do. We will not make any man king. Do what is good in your eyes.”
  footnotes:
  - marker: a
    text: Or “the foster fathers” or “the caretakers” for “the guardians.” The Hebrew term refers to those entrusted with the care of the royal sons.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 궁궐을 맡은 사람과 성을 맡은 사람, 장로들과 보호자들이 예후에게 사람을 보내어 말하였습니다. 「우리는 당신의 종입니다. 당신이 우리에게 말씀하시는 것은 무엇이든지 우리가 행하겠습니다. 우리는 어떤 사람도 왕으로 세우지 않겠습니다. 당신의 눈에 좋은 대로 하십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר עַל הַבַּיִת
  english_pob_choice: the one who was over the palace
  chosen_korean: 궁궐을 맡은 사람
  alternatives_korean:
  - 왕궁 관리
  - 궁정 총감
  lexicon: HALOT
  rationale: 왕실 행정직을 가리키는 관용구이므로, 가정적 의미의 ‘집’을 피하고 왕궁 문맥을 살려 ‘궁궐을 맡은 사람’으로 옮겼습니다.
- source_word: וַאֲשֶׁר עַל הָעִיר
  english_pob_choice: the one who was over the city
  chosen_korean: 성을 맡은 사람
  alternatives_korean:
  - 도시를 맡은 사람
  - 성읍 관리
  lexicon: HALOT
  rationale: 구체적 관직명을 단정하기보다, 성읍/도시를 관할하는 직분이라는 기능을 드러내는 표현을 택했습니다.
- source_word: הָאֹמְנִים
  english_pob_choice: the guardians
  chosen_korean: 보호자들
  alternatives_korean:
  - 양육자들
  - 후견인들
  lexicon: HALOT
  rationale: 본문 주석이 아합의 아들들을 돌보도록 맡겨진 사람들을 가리키므로, 현대 한국어에서 그 역할을 넓게 포괄하는 ‘보호자들’이 적절합니다.
- source_word: עֲבָדֶיךָ
  english_pob_choice: your servants
  chosen_korean: 당신의 종입니다
  alternatives_korean:
  - 당신의 노예입니다
  - 당신의 종들입니다
  lexicon: HALOT
  rationale: 정치적 항복 문맥의 예법적 자기호칭이므로 기본값인 ‘종’을 유지하되, 예후에게 직접 말하는 문맥을 반영해 존대형 종결을 사용했습니다.
- source_word: לֹא נַמְלִיךְ אִישׁ
  english_pob_choice: We will not make any man king
  chosen_korean: 우리는 어떤 사람도 왕으로 세우지 않겠습니다
  alternatives_korean:
  - 우리는 아무도 왕으로 삼지 않겠습니다
  - 우리는 어떤 사람도 왕이 되게 하지 않겠습니다
  lexicon: HALOT
  rationale: 히필형의 ‘~을 왕으로 만들다/세우다’라는 사역적 의미를 살려, 한국어에서 자연스러운 ‘왕으로 세우다’로 옮겼습니다.
- source_word: הַטּוֹב בְּעֵינֶיךָ
  english_pob_choice: what is good in your eyes
  chosen_korean: 당신의 눈에 좋은 대로
  alternatives_korean:
  - 당신 보기에 좋은 대로
  - 당신이 좋게 여기는 대로
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역에 가깝게 살려, 판단 기준이 ‘당신의 눈’에 있음을 보존했습니다.
theological_decisions:
- issue: 예후에게 보내는 항복 서신의 말투
  chosen_reading: 직접 화법 안에서 공식적이고 복종적인 존대체를 유지했습니다.
  alternative_readings:
  - 더 중립적인 평서문
  - 현대식 비격식 표현
  rationale: 본문은 정치적 항복 선언이므로, 내용상의 복종성과 한국어의 공적·공식적 톤을 함께 드러내는 것이 적절합니다.
  doctrine_reference: 서사 문맥의 화행과 공손성
- issue: ‘종’과 ‘보호자’의 관계
  chosen_reading: ‘종’은 정치적 복속의 자기호칭으로, ‘보호자들’은 왕자들의 돌봄을 맡은 사람들을 가리키는 별도 직분으로 구분했습니다.
  alternative_readings:
  - 둘 다 단순히 ‘시종들’로 통합
  - ‘노예들’로 강하게 번역
  rationale: 본문은 서로 다른 사회적 역할을 병치하므로, 동일화하거나 과도하게 강한 사회적 의미로 평평하게 만들지 않았습니다.
  doctrine_reference: 본문의 사회사적 구분 보존
