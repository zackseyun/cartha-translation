revisions:
- from: 그들은 야훼 곧 자기들의 하나님의 모든 명령을 버리고, 자기들을 위해 주조한 우상, 곧 두 송아지를 만들고, 아세라를 만들며, 하늘의 모든 군상에게 절하고, 바알을 섬겼습니다.[a]
  to: 그들은 야훼, 곧 그들의 하나님의 모든 계명을 버리고, 자기들을 위해 주조한 우상, 곧 두 송아지를 만들고, 아세라[a]를 만들고, 하늘의 모든 천체에게 절하고, 바알을 섬겼습니다.
  rationale: ‘군상’을 문맥에 맞는 ‘천체’로 바로잡고, 접속 표현과 각주 앵커를 정리했습니다. 주조 우상의 단수와 ‘두 송아지’라는 원문의 다소 특이한 병치는 해소하거나 복수화하지 않고 그대로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:57:32Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 단수 מַסֵּכָה와 뒤따르는 ‘두 송아지’의 관계를 ‘주조한 우상, 곧 두 송아지’로 보존했습니다. 아세라의 의미상 모호성도 음역과 각주로 유지했습니다. 다만 ‘하늘의 군상’은 한국어에서 천체의 무리를 뜻하기보다 여러 인물·형상을 뜻할 수 있어, 문맥상 천체 숭배를 명확히 하는 ‘하늘의 모든 천체’로 고쳤습니다.
  naturalness: 원문의 연속된 완료 사건에 맞추어 ‘아세라를 만들며’를 ‘아세라를 만들고’로 수정했습니다. 또한 ‘야훼 곧 자기들의 하나님’은 ‘야훼, 곧 그들의 하나님’으로 다듬어 현대 한국어 문장 흐름을 개선했습니다.
  terminology: יַהְוֶה는 방침대로 ‘야훼’로, מִצְוֺת는 언약 문맥에 적합한 ‘계명’으로 옮겼습니다. אֲשֵׁירָה는 ‘아세라’로 음역하고, 각주에서 여신 또는 숭배 대상물이라는 가능성을 밝혔습니다.
  issues:
  - severity: medium
    issue: ‘하늘의 모든 군상’
    rationale: ‘군상’은 현대 한국어에서 주로 여러 사람이나 형상을 뜻하며, צְבָא הַשָּׁמַיִם가 이 문맥에서 가리키는 천체들의 무리를 자연스럽게 전달하지 못합니다.
  - severity: low
    issue: ‘아세라를 만들며’의 연결 표현
    rationale: 앞뒤의 וַיַּעֲשׂוּ 연속 서술과 달리 진행·동시의 뉘앙스를 낼 수 있으므로 ‘만들고’가 더 충실합니다.
  - severity: low
    issue: 아세라 각주의 위치
    rationale: 각주가 아세라가 아니라 문장 전체 끝에 붙어 있어 해당 어휘와의 연결이 약합니다. ‘아세라’ 뒤에 앵커를 두는 편이 명료합니다.
