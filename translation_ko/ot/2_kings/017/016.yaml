  text: וַ/יַּעַזְב֗וּ אֶת כָּל מִצְוֺת֙ יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וַ/יַּעֲשׂ֥וּ לָ/הֶ֛ם מַסֵּכָ֖ה שנים עֲגָלִ֑ים וַ/יַּעֲשׂ֣וּ אֲשֵׁירָ֗ה וַ/יִּֽשְׁתַּחֲווּ֙ לְ/כָל צְבָ֣א הַ/שָּׁמַ֔יִם וַ/יַּעַבְד֖וּ אֶת הַ/בָּֽעַל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/016.yaml
  text: And they abandoned all the commandments of Yahweh their God[a], and made for themselves cast images, two calves, and made an Asherah, and bowed down to all the host of heaven, and served Baal.
  footnotes:
  - marker: a
    text: Or 'an Asherah pole'; the Hebrew term Asherah can refer to the Canaanite goddess or to her cult object.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼 곧 자기들의 하나님의 모든 명령을 버리고, 자기들을 위해 주조한 우상, 곧 두 송아지를 만들고, 아세라를 만들며, 하늘의 모든 군상에게 절하고, 바알을 섬겼습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아세라’는 가나안 여신 또는 그 숭배 대상물을 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  english_pob_choice: abandoned
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 저버리고
  lexicon: HALOT
  rationale: 언약적 배반의 뉘앙스를 살리면서도 현대 한국어에서 자연스러운 동사를 택했습니다.
- source_word: מִצְוֺת
  english_pob_choice: all the commandments
  chosen_korean: 모든 명령
  alternatives_korean:
  - 모든 계명
  - 모든 규례
  lexicon: HALOT
  rationale: 여기서는 야훼의 언약적 요구를 가리키므로 ‘모든’과 함께 ‘명령’으로 옮겨 직역성을 유지했습니다.
- source_word: מַסֵּכָה
  english_pob_choice: a cast image
  chosen_korean: 주조한 우상
  alternatives_korean:
  - 주조한 형상
  - 부어 만든 우상
  lexicon: HALOT
  rationale: 금속을 부어 만든 형상이라는 구체성을 살리되, 한국어에서 의미가 분명하도록 ‘우상’을 보완해 옮겼습니다.
- source_word: אֲשֵׁירָה
  english_pob_choice: an Asherah
  chosen_korean: 아세라
  alternatives_korean:
  - 아세라 목상
  - 아세라 상
  lexicon: HALOT
  rationale: 본문의 용어적 모호성을 과도하게 해소하지 않고 히브리어 고유명을 그대로 살렸습니다.
- source_word: לְכָל צְבָא הַשָּׁמַיִם
  english_pob_choice: to all the host of heaven
  chosen_korean: 하늘의 모든 군상에게
  alternatives_korean:
  - 하늘의 모든 군대에게
  - 하늘의 모든 천상 군대에게
  lexicon: HALOT
  rationale: 천체들을 포함한 하늘의 무리를 가리키는 표현으로, ‘군상’이 집합적이고 현대적인 대응어입니다.
theological_decisions:
- issue: 여호와/야훼의 이름 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 יְהוָה를 제목적 대체어가 아닌 고유명으로 보존해 언약적 이름을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אֲשֵׁירָה의 의미 범위 보존
  chosen_reading: 아세라
  alternative_readings:
  - 아세라 목상
  - 여신 아세라
  rationale: 만든 대상이 신상인지 숭배물인지 본문만으로 단정하지 않고, 번역에서도 해석을 과도하게 좁히지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §3: Preserve theological tension rather than resolve it'
