  text: וַ/יָּ֣עַד יְהוָ֡ה בְּ/יִשְׂרָאֵ֣ל וּ/בִ/יהוּדָ֡ה בְּ/יַד֩ כָּל נביא/ו כָל חֹזֶ֜ה לֵ/אמֹ֗ר שֻׁ֝֠בוּ מִ/דַּרְכֵי/כֶ֤ם הָֽ/רָעִים֙ וְ/שִׁמְרוּ֙ מִצְוֺתַ֣/י חֻקּוֹתַ֔/י כְּ/כָ֨ל הַ/תּוֹרָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶת אֲבֹֽתֵי/כֶ֑ם וַֽ/אֲשֶׁר֙ שָׁלַ֣חְתִּי אֲלֵי/כֶ֔ם בְּ/יַ֖ד עֲבָדַ֥/י הַ/נְּבִיאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/013.yaml
  text: Yet Yahweh warned Israel and Judah by every one of his prophets and every seer, saying, “Turn from your evil ways and keep my commandments and my statutes, according to all the law that I commanded your fathers and that I sent to you by my servants the prophets.”
  footnotes:
  - marker: a
    text: Or 'testified against Israel and Judah.' The Hebrew verb can carry the sense of solemn warning or testimony.
    reason: lexical_alternative
  - marker: b
    text: '''Your fathers'' may also be understood as ''your ancestors.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'through my servants the prophets.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서는 자신의 모든 예언자와 모든 환상을 보는 자를 통해 이스라엘과 유다에게 경고하시며 말씀하셨습니다. “너희의 악한 길에서 돌이키고, 내가 너희 조상들에게 명령한 율법과 내가 나의 종들인 예언자들을 통해 너희에게 보낸 것에 따라 내 명령과 내 규례를 지키십시오.”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘과 유다를 상대로 증언하셨다.’ 히브리어 동사는 엄중한 경고나 증언의 뜻을 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘조상들’로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘나의 종들인 예언자들을 통해’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּעַד יְהוָה
  english_pob_choice: warned
  chosen_korean: 경고하시며
  alternatives_korean:
  - 증언하시며
  - 엄중히 경고하시며
  - 훈계하시며
  lexicon: HALOT
  rationale: עוּד의 Hiphil은 단순 정보 전달보다 엄중한 경고·증언의 뉘앙스를 가지므로, 문맥의 심판 배경을 살려 ‘경고하시며’로 옮겼습니다.
- source_word: בְּיַד כָּל־נָבִיאוֹ כָּל־חֹזֶה
  english_pob_choice: by every prophet and every seer
  chosen_korean: 자신의 모든 예언자와 모든 환상을 보는 자를 통해
  alternatives_korean:
  - 그의 모든 예언자와 모든 선견자를 통해
  - 모든 예언자와 모든 선견자를 통해
  lexicon: HALOT
  rationale: ביד의 도구적 용법을 ‘~를 통해’로 살리고, חֹזֶה는 ‘seer’에 해당하는 예언 직분 용어이므로 ‘환상을 보는 자’로 풀어 의미를 드러냈습니다.
- source_word: שֻׁבוּ מִדַּרְכֵיכֶם הָרָעִים
  english_pob_choice: Turn from your evil ways
  chosen_korean: 너희의 악한 길에서 돌이키고
  alternatives_korean:
  - 너희의 악한 길에서 돌아오고
  - 너희의 악한 길을 버리고
  lexicon: HALOT
  rationale: שׁוּב의 기본 뜻은 ‘돌이키다/돌아오다’이므로, 회개적 의미를 과장하지 않으면서도 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: מִצְוֺתַי חֻקּוֹתַי כְּכָל הַתּוֹרָה
  english_pob_choice: my commandments and my statutes, according to all the law
  chosen_korean: 내 명령과 내 규례를 지키십시오. ... 율법과
  alternatives_korean:
  - 내 계명과 내 규례
  - 내 명령들과 내 규례들
  lexicon: HALOT
  rationale: מִצְוֹת과 חֻקּוֹת은 구별되는 언약 법어이므로, 관용적이면서도 구분을 유지하는 ‘명령’과 ‘규례’를 택했습니다. תּוֹרָה는 이 문맥에서 ‘율법’이 가장 분명합니다.
theological_decisions:
- issue: ‘나의 종들인 예언자들’의 표현과 직역성
  chosen_reading: עֲבָדַי를 ‘나의 종들’로, הַנְּבִיאִים을 뒤에서 동격으로 받아 예언자 직분을 유지했습니다.
  alternative_readings:
  - ‘나의 종인 예언자들’
  - ‘예언자인 내 종들’
  rationale: 예언자들이 하나님의 종이라는 관계를 분명히 드러내면서도, 한국어 어순에서 자연스러운 동격 구조를 유지했습니다.
  doctrine_reference: '번역 원칙 §3: 문맥이 요구하는 직분적 의미를 보존하되 불필요한 해설은 덧붙이지 않음'
