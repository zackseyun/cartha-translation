- from: 그러나 야훼께서는 자신의 모든 예언자와 모든 환상을 보는 자를 통해 이스라엘과 유다에게 경고하시며 말씀하셨습니다. “너희의 악한 길에서 돌이키고, 내가 너희 조상들에게 명령한 율법과 내가 나의 종들인 예언자들을 통해 너희에게 보낸 것에 따라 내 명령과 내 규례를 지키십시오.”[a][b][c]
  to: 그러나 야훼께서는 그분의 모든 예언자와 모든 선견자를 통해 이스라엘과 유다에게 경고하시어[a] 이렇게 말씀하셨습니다. “너희의 악한 길에서 돌이키고, 내가 너희 조상들에게[b] 명령하고 나의 종들인 예언자들을 통해[c] 너희에게 보낸 모든 율법에 따라 나의 계명과 나의 규례를 지키십시오.”
