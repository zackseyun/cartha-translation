reference: 2 Kings 17:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַל מֶֽלֶךְ אַשּׁ֖וּר בְּ/כָל הָ/אָ֑רֶץ וַ/יַּ֨עַל֙ שֹׁמְר֔וֹן וַ/יָּ֥צַר עָלֶ֖י/הָ שָׁלֹ֥שׁ שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/005.yaml
  text: Then the king of Assyria went up throughout all the land[a], and he went up against Samaria and besieged it for three years.
  footnotes:
  - marker: a
    text: Or 'he went up to Samaria'; the Hebrew idiom can denote simple ascent or military advance, but the following clause ('besieged it') supports the hostile sense here.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 앗시리아 왕이 온 땅을 두루 진격하여 사마리아를 치러[a] 올라가, 삼 년 동안 그 성을 포위했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사마리아로 올라가’. 히브리어의 ‘올라가다’는 단순한 올라감이나 군사적 진격을 가리킬 수 있으나, 뒤의 ‘포위했습니다’는 여기서 적대적 의미를 뒷받침합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  english_pob_choice: went up
  chosen_korean: 올라가서
  alternatives_korean:
  - 쳐들어가서
  - 진군해서
  - 올라갔습니다
  lexicon: HALOT
  rationale: עלה의 기본 뜻인 ‘올라가다’를 살리되, 전쟁 문맥에서의 군사적 진출 뉘앙스를 자연스럽게 드러냈습니다.
- source_word: בְּכָל הָאָרֶץ
  english_pob_choice: throughout all the land
  chosen_korean: 온 땅[a]을 두루
  alternatives_korean:
  - 그 땅 전체를 통해
  - 온 나라를
  - 전 지역을
  lexicon: HALOT
  rationale: ‘땅/나라’의 범위를 살리면서 이동의 넓은 범위를 나타내는 ‘두루’를 써서 영어 POB의 포괄성을 반영했습니다.
- source_word: וַיַּעַל שֹׁמְרוֹן
  english_pob_choice: he went up against Samaria
  chosen_korean: 사마리아를 치러 올라가
  alternatives_korean:
  - 사마리아를 향해 올라가
  - 사마리아에 올라가
  - 사마리아를 공격하러 올라가
  lexicon: HALOT
  rationale: 도시를 목적어로 한 군사 서술에서는 ‘against’의 적대적 방향이 핵심이므로, 한국어에서는 ‘치러’로 공격 의도를 분명히 했습니다.
- source_word: וַיָּצַר עָלֶיהָ
  english_pob_choice: besieged it
  chosen_korean: 그 성을 포위했습니다
  alternatives_korean:
  - 그 성에 포위해 있었습니다
  - 그 성을 에워쌌습니다
  - 그 성에 포위 공격을 가했습니다
  lexicon: HALOT
  rationale: צור의 군사적 의미인 ‘포위하다/공성하다’를 현대 한국어로 간결하게 옮겼습니다.
theological_decisions:
- issue: 사마리아에 대한 군사 행동의 방향성
  chosen_reading: ‘올라가서’와 ‘치러 올라가’로, 단순 이동이 아니라 적대적 군사 진출임을 본문 흐름대로 드러냈습니다.
  alternative_readings:
  - ‘사마리아로 올라가서’처럼 중립적으로 옮김
  - ‘침공해서’처럼 해석을 앞세움
  rationale: 앞 절의 ‘포위했다’가 뒤따르므로, העלה의 관용적 군사 용법을 살리면서도 공격성을 과도하게 해석하지 않는 표현을 택했습니다.
  doctrine_reference: 본문 역사 서술
- issue: ‘온 땅’의 범위
  chosen_reading: ‘온 땅[a]을 두루’로 옮겨, 이동 경로의 전면성과 광범위성을 동시에 살렸습니다.
  alternative_readings:
  - ‘땅 전체를 통해’
  - ‘전국을’
  rationale: 히브리어 전치사 בְּ와 כָּל הָאָרֶץ의 결합은 지역 전체를 가로지르는 진군을 시사하므로, 한국어에서도 범위를 넓게 드러내는 것이 적절합니다.
  doctrine_reference: 본문 역사 서술
