source:
  edition: WLC
  text: וְ/הָ/עַוִּ֛ים עָשׂ֥וּ נִבְחַ֖ז וְ/אֶת תַּרְתָּ֑ק וְ/הַ/סְפַרְוִ֗ים שֹׂרְפִ֤ים אֶת בְּנֵי/הֶם֙ בָּ/אֵ֔שׁ לְ/אַדְרַמֶּ֥לֶךְ וַֽ/עֲנַמֶּ֖לֶךְ אלה ספרים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/031.yaml
  text: The Avvites made Nibhaz and Tartak, and the Sepharvites were burning their sons in the fire to Adrammelek and Anammelek, the gods of Sepharvaim.
  footnotes:
  - marker: a
    text: Or, 'the Avvim.'
    reason: lexical_alternative
  - marker: b
    text: That is, they were offering child sacrifices by burning their sons to these gods.
    reason: cultural_note
translation:
  language: ko
  text: 아와 사람들[a]은 닙하스와 타르탁을 만들었고, 스발와임 사람들은 스발와임의 신들인 아드람멜렉과 아남멜렉에게 자기 아들들을 불에 태우고 있었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아와 사람들’은 히브리어 민족명 הָעַוִּים의 번역입니다. 또는 ‘아빔 사람들’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 아들들을 불에 태우는 것은 이 신들에게 바치는 인신 제사를 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: הָעַוִּים
  english_pob_choice: The Avvites
  chosen_korean: 아빗 사람들
  alternatives_korean:
  - 아빔 사람들
  - 아벳 사람들
  lexicon: HALOT
  rationale: 히브리어 지명/민족명을 음역하되, 한국어에서는 “사람들”을 붙여 집단명임을 자연스럽게 드러냈습니다.
- source_word: עָשׂוּ
  english_pob_choice: made
  chosen_korean: 만들었고
  alternatives_korean:
  - 지었고
  - 제작했고
  lexicon: HALOT
  rationale: 단순 과거의 ‘만들다’가 가장 सीधे하며, 본문이 우상/신상 제작을 암시하더라도 원문의 동사를 과잉 해석하지 않았습니다.
- source_word: שֹׂרְפִים
  english_pob_choice: were burning
  chosen_korean: 태우고 있었습니다
  alternatives_korean:
  - 태웠습니다
  - 불사르고 있었습니다
  lexicon: HALOT
  rationale: 분사형의 진행·상습적 뉘앙스를 살려 현재진행형에 가까운 표현으로 옮겼습니다.
- source_word: אֶת בְּנֵי/הֶם בָּ/אֵשׁ
  english_pob_choice: their sons in the fire
  chosen_korean: 자기 아들들을 … 불 속에서
  alternatives_korean:
  - 자기 자녀들을 … 불 속에서
  - 그들의 아들들을 … 불 속에서
  lexicon: HALOT
  rationale: בְּנֵיהֶם의 성별을 보존해 ‘아들들’로 옮겼고, בָּאֵשׁ는 제사적 맥락을 과도하게 풀지 않고 ‘불 속에서’로 직역했습니다.
- source_word: לְאַדְרַמֶּלֶךְ וַֽעֲנַמֶּלֶךְ
  english_pob_choice: to Adrammelek and Anammelek
  chosen_korean: 아드람멜렉과 아남멜렉에게
  alternatives_korean:
  - 아드람멜렉과 아남멜렉을 위하여
  - 아드람멜렉과 아남멜렉에게 바쳐
  lexicon: HALOT
  rationale: ל는 여기서 희생의 수여/방향을 나타내므로 한국어 ‘-에게’가 가장 자연스럽습니다.
- source_word: אלה ספרים
  english_pob_choice: the gods of Sepharvaim
  chosen_korean: 스발와임의 신들
  alternatives_korean:
  - 스발와임의 신들
  - 스발와임 사람들의 신들
  lexicon: HALOT
  rationale: 문말의 해설적 구문으로, 앞선 고유명과 연결해 이 두 신이 스발와임과 관련된 신들임을 분명히 했습니다.
theological_decisions:
- issue: Nibhaz와 Tartak을 본문에서 ‘우상/신상’으로 풀어 쓸지 여부
  chosen_reading: 본문은 단순히 ‘만들었다’고 유지하고, 우상이라는 해석은 덧붙이지 않았습니다.
  alternative_readings:
  - 닙하스와 타르탁의 우상을 만들었고
  - 닙하스와 타르탁의 신상을 만들었고
  rationale: 히브리어는 단지 ‘만들다’라고 말하므로, 문맥상 우상 제작이 분명하더라도 본문에는 없는 해석어를 추가하지 않았습니다.
  doctrine_reference: 원문 우선, 본문이 허용하는 범위를 넘는 설명적 첨가 금지
- issue: שֹׂרְפִים의 상습적/진행적 뉘앙스 반영 여부
  chosen_reading: ‘태우고 있었습니다’로 옮겨 행위의 반복적·진행적 성격을 살렸습니다.
  alternative_readings:
  - 태웠습니다
  - 불태웠습니다
  rationale: 분사는 단발 과거보다 묘사적 성격이 강하므로, 제의적 관행의 지속성을 드러내는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 형태론적 뉘앙스 보존
