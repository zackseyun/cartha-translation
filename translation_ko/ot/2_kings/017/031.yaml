- from: 아빗 사람들은 닙하스와 타르탁을 만들었고, 스발와임 사람들은 자기 아들들을 아드람멜렉과 아남멜렉에게, 곧 스발와임의 신들에게, 불 속에서 태우고 있었습니다.[a][b]
  to: 아와 사람들[a]은 닙하스와 타르탁을 만들었고, 스발와임 사람들은 스발와임의 신들인 아드람멜렉과 아남멜렉에게 자기 아들들을 불에 태우고 있었습니다.[b]
  rationale: 원문의 고유명 및 성별 특정 표현은 유지하되, 한국어의 통상적 지명·민족명 표기인 ‘아와 사람들’을 사용했습니다. ‘불에 태우고 있었습니다’는 בָּאֵשׁ와 분사 שֹׂרְפִים의 의미를 자연스럽게 반영합니다. 신들의 이름을 ‘스발와임의 신들’이라는 동격 설명과 결합하되, 본문에 원문에 없는 ‘제사’나 ‘바치다’를 삽입하지 않았습니다. 문화적 함의는 각주에서만 밝혔습니다.
  reviewer_model: gpt-5.6-terra
