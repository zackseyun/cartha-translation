  terminology: ‘아와’, ‘닙하스’, ‘타르탁’, ‘스발와임’, ‘아드람멜렉’, ‘아남멜렉’은 한국어 성경에서 통용되는 음역 및 원문의 고유명 성격을 존중합니다. ‘아들들’을 유지하여 בְּנֵיהֶם의 남성 복수를 일반화하지 않았습니다. 본문에는 ‘인신 제사’라는 해석어를 넣지 않고 각주에서만 설명합니다.
