base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/020.yaml
  text: So Yahweh rejected all the offspring of Israel[a], and afflicted them and gave them into the hand of plunderers[c][b], until he had cast them out from his presence.
  footnotes:
  - marker: a
    text: Or 'all the descendants of Israel'; Hebrew 'seed/offspring of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Or 'delivered them into the hand of plunderers.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'from before him.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 야훼께서 이스라엘의 모든 후손을[a] 버리시고, 그들을 괴롭게 하시며 약탈자들의 손에 넘기셨고[b], 마침내 그분 앞에서 그들을 쫓아내셨습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘후손’은 히브리어 ‘씨/후손’(זֶרַע)의 집합적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘~의 손에 넘기다’는 히브리어로 누구의 권세 아래에 내주거나 넘긴다는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘그의 앞에서/면전에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְאַס יְהוָה
  english_pob_choice: So Yahweh rejected
  chosen_korean: 야훼께서 … 버리시고
  alternatives_korean:
  - 야훼께서 … 거절하시고
  - 야훼께서 … 거부하시고
  - 야훼께서 … 내치시고
  lexicon: HALOT
  rationale: מָאַס는 단순 감정적 ‘혐오’보다 관계적·판결적 ‘버림/거절’의 의미가 강하므로, 문맥의 언약적 심판을 살리면서도 현대 한국어로 자연스러운 ‘버리시고’를 택했습니다.
- source_word: בְּכָל זֶרַע יִשְׂרָאֵל
  english_pob_choice: all the offspring of Israel
  chosen_korean: 이스라엘의 모든 후손
  alternatives_korean:
  - 이스라엘의 모든 씨
  - 이스라엘의 모든 자손
  - 이스라엘의 모든 후예
  lexicon: HALOT
  rationale: זֶרַע는 ‘씨/후손/자손’의 집합적 의미를 가지므로, 영어 POB의 ‘offspring’에 맞추어 자연스럽고 집합성을 유지하는 ‘모든 후손’을 사용했습니다.
- source_word: וַיְעַנֵּם
  english_pob_choice: afflicted them
  chosen_korean: 그들을 괴롭게 하시며
  alternatives_korean:
  - 그들을 학대하시며
  - 그들을 압제하시며
  - 그들을 고통받게 하시며
  lexicon: HALOT
  rationale: ענה의 피엘은 ‘괴롭게 하다/억누르다/학대하다’의 폭을 가지지만, 여기서는 이어지는 심판 연쇄 속에서 고통을 주시는 뜻을 직접적으로 드러내는 ‘괴롭게 하시며’가 가장 균형적입니다.
- source_word: וַיִּתְּנֵם בְּיַד שֹׁסִים
  english_pob_choice: gave them into the hand of plunderers
  chosen_korean: 그들을 약탈자들의 손에 넘기셨습니다
  alternatives_korean:
  - 그들을 약탈자들의 손에 주셨습니다
  - 그들을 노략하는 자들의 손에 넘기셨습니다
  - 그들을 침략자들의 손에 넘기셨습니다
  lexicon: HALOT
  rationale: נתן ביד은 관용적으로 ‘~의 손에 넘기다/주다’의 뜻이므로, 문맥의 폭력적 지배를 살리는 ‘넘기셨습니다’로 옮겼고, שֹׁסִים는 약탈 행위를 하는 자들이라 ‘약탈자들’이 적절합니다.
- source_word: מִפָּנָיו
  english_pob_choice: from his presence
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 그분의 임재에서
  - 그의 면전에서
  - 그 앞에서
  lexicon: HALOT
  rationale: 문자적으로는 ‘그의 얼굴 앞에서/그 앞에서’이지만, POB의 영어처럼 추방과 단절의 뉘앙스를 살리면서도 자연스러운 한국어로 ‘자기 앞에서’라고 옮겼습니다.
theological_decisions:
- issue: 야훼의 ‘버리심’과 ‘쫓아내심’의 심판적 어조
  chosen_reading: 문맥의 언약적 심판을 완화하지 않고, 하나님의 주도적 행위로서 ‘버리시고… 넘기셨습니다… 쫓아내셨습니다’의 연쇄를 유지했습니다.
  alternative_readings:
  - ‘외면하셨습니다’처럼 완화하여 번역
  - 행위자성을 약화시켜 수동적으로 번역
  rationale: 본문은 이스라엘에 대한 야훼의 निर्ण정적 심판을 강조하므로, 한국어에서도 심판의 강도를 보존하는 것이 원문의 의도를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
