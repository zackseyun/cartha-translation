source:
  edition: WLC
  text: וְ/אַנְשֵׁ֣י בָבֶ֗ל עָשׂוּ֙ אֶת סֻכּ֣וֹת בְּנ֔וֹת וְ/אַנְשֵׁי כ֔וּת עָשׂ֖וּ אֶת נֵֽרְגַ֑ל וְ/אַנְשֵׁ֥י חֲמָ֖ת עָשׂ֥וּ אֶת אֲשִׁימָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/030.yaml
  text: The men of Babylon made Succoth-benoth[a], the men of Cuth made Nergal[b], and the men of Hamath made Ashima.
  footnotes:
  - marker: a
    text: Succoth-benoth is likely the name of a foreign deity or cult object; the meaning of the name is uncertain, so it is transliterated rather than translated.
    reason: cultural_note
  - marker: b
    text: Or 'the people of Babylon ... the people of Cuth ... the people of Hamath.' The Hebrew uses 'men of' in each case.
    reason: lexical_alternative
translation:
  language: ko
  text: 바빌론 사람들은 수곳-브노스를 만들고, 쿠스 사람들은 네르갈을 만들고, 하맛 사람들은 아시마를 만들었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 수곳-브노스는 외래 신명 또는 제의 대상의 이름일 가능성이 크며, 의미는 확실하지 않으므로 번역하지 않고 음역했습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 각 항목마다 ‘사람들’에 해당하는 남성 복수형을 사용합니다. 따라서 ‘바빌론 사람들… 쿠스 사람들… 하맛 사람들…’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  english_pob_choice: the men of
  chosen_korean: … 사람들은
  alternatives_korean:
  - … 사람들
  - …의 남자들은
  - …의 백성은
  lexicon: HALOT
  rationale: 히브리어 복수 연계형은 각 도시/지역 출신 집단을 가리키지만, 한국어에서 반복되는 ‘~사람들은’이 직역성과 자연스러움을 함께 살립니다.
- source_word: עָשׂוּ
  english_pob_choice: made
  chosen_korean: 만들었습니다
  alternatives_korean:
  - 지었습니다
  - 제작했습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 본문은 우상이나 제의 대상을 직접 서술만 하므로, 영어 POB의 ‘made’를 따라 가장 기본적인 동사로 옮겼습니다. ‘세웠습니다’는 해석을 더 앞세울 수 있습니다.
- source_word: סֻכּוֹת בְּנוֹת
  english_pob_choice: Succoth-benoth
  chosen_korean: 수곳-브노스
  alternatives_korean:
  - 숙곳-베놋
  - 수꼬트-브노트
  - 숙곳 베놋
  lexicon: HALOT
  rationale: 고유명사이므로 음역을 유지했습니다. 뜻풀이를 하지 않고 음역만 택한 것은 명칭의 의미가 불확실하다는 주석 성격을 보존하기 위함입니다.
- source_word: נֵרְגַל
  english_pob_choice: Nergal
  chosen_korean: 네르갈
  alternatives_korean:
  - 느르갈
  - 네르갈
  lexicon: HALOT
  rationale: 메소포타미아 신명으로 보이는 고유명사이므로 표준 음역으로 옮겼습니다.
- source_word: אֲשִׁימָא
  english_pob_choice: Ashima
  chosen_korean: 아시마
  alternatives_korean:
  - 아쉬마
  - 아시마
  lexicon: HALOT
  rationale: 외래 신명 고유명사이므로 음역을 유지했으며, 한국어 성경 관용 표기보다 원음에 가까운 형태를 택했습니다.
theological_decisions:
- issue: 본문에 ‘우상/신’이라는 해석어를 덧붙일지 여부
  chosen_reading: 주요 본문에는 고유명사만 두고, ‘만들었습니다’라는 동사만 유지했습니다.
  alternative_readings:
  - 바빌론 사람들이 수곳-브노스라는 우상을 만들고…
  - 바빌론 사람들이 수곳-브노스라는 신을 섬기고…
  rationale: 히브리어는 단순히 ‘만들다’와 직접 목적어를 병치할 뿐, 대상을 명시적으로 ‘우상’이나 ‘신’이라고 부르지 않습니다. 해석을 본문에 앞세우기보다 음역과 절제된 서술로 텍스트의 폭을 보존했습니다.
  doctrine_reference: Translation philosophy §§1, 2, 3
