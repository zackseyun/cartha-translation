id: 2KI.17.37
reference: 2 Kings 17:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/אֶת הַ/חֻקִּ֨ים וְ/אֶת הַ/מִּשְׁפָּטִ֜ים וְ/הַ/תּוֹרָ֤ה וְ/הַ/מִּצְוָה֙ אֲשֶׁ֣ר כָּתַ֣ב לָ/כֶ֔ם תִּשְׁמְר֥וּ/ן לַ/עֲשׂ֖וֹת כָּל הַ/יָּמִ֑ים וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/037.yaml
  text: And the statutes and the judgments and the law and the commandment that he wrote for you[a], you shall keep to do all the days[c][b], and you shall not fear other gods.
  footnotes:
  - marker: a
    text: Or 'the decrees ... the ordinances ... the instruction ... the command.' The Hebrew uses a cluster of covenant-law terms with overlapping but distinct legal nuance.
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall be careful to do.' The Hebrew expression combines keeping/observing with doing.
    reason: lexical_alternative
  - marker: c
    text: '''Fear'' here carries the sense of reverential allegiance or worshipful dread toward deities.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 규례들과 그 법도들과 그 율법과 그 명령은, 그가 여러분을 위해 기록한 것이니, 여러분은 그것들을 지켜 행해야 합니다[a][b]. 또 다른 신들을 두려워해서는 안 됩니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘규례들 ... 법도들 ... 교훈 ... 명령’. 히브리어는 서로 겹치면서도 미묘하게 다른 언약-율법 용어들을 묶어 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘여러분은 행하도록 조심해야 합니다’. 히브리어 표현은 ‘지키다/준수하다’와 ‘행하다’를 함께 담습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘두려워하다’는 여기서 다른 신들에게 대한 경외·충성·예배적 두려움의 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֻקִּים
  english_pob_choice: the statutes
  chosen_korean: 규례들
  alternatives_korean:
  - 법규들
  - 율례들
  lexicon: HALOT
  rationale: חֻקִּים는 정해진 규범이나 규례의 뜻이므로, 한국어에서는 법적 느낌을 유지하면서도 자연스러운 ‘규례들’이 적절합니다.
- source_word: הַמִּשְׁפָּטִים
  english_pob_choice: the judgments
  chosen_korean: 법도들
  alternatives_korean:
  - 판결들
  - 판례들
  - 규정들
  lexicon: HALOT
  rationale: מִשְׁפָּטִים은 단순한 일반 법이 아니라 판정·규범의 결을 지니므로, 문맥상 이어지는 법률 목록 안에서 ‘법도들’로 옮겨 구별감을 살렸습니다.
- source_word: הַתּוֹרָה
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  - 교훈
  lexicon: HALOT
  rationale: 이 법-언약 목록에서는 תּוֹרָה를 전통적이면서도 원어의 언약적 성격을 살리는 ‘율법’으로 옮기는 것이 가장 분명합니다.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  english_pob_choice: you shall keep to do
  chosen_korean: 지켜 행해야 합니다
  alternatives_korean:
  - 지켜서 해야 합니다
  - 조심하여 행해야 합니다
  - 지키고 행해야 합니다
  lexicon: HALOT
  rationale: 히브리어는 ‘지키다/준수하다’와 ‘행하다’를 결합한 표현이므로, 한국어에서는 두 동사를 모두 살린 ‘지켜 행해야 합니다’가 가장 자연스럽고 원문의 긴장을 유지합니다.
- source_word: תִירְאוּ
  english_pob_choice: fear
  chosen_korean: 두려워해서는 안 됩니다
  alternatives_korean:
  - 경외해서는 안 됩니다
  - 무서워해서는 안 됩니다
  - 섬겨서는 안 됩니다
  lexicon: HALOT
  rationale: 여기서는 다른 신들에게 향하는 충성·경배의 두려움을 금하는 맥락이므로, 직역적이면서도 금지의 의미가 분명한 ‘두려워해서는 안 됩니다’를 택했습니다.
theological_decisions:
- issue: ‘other gods’의 번역을 어떻게 처리할 것인가
  chosen_reading: ‘다른 신들’로 직역해, 야훼 이외의 신적 존재를 금하는 언약적 경고를 분명히 드러냅니다.
  alternative_readings:
  - ‘이방 신들’
  - ‘거짓 신들’
  rationale: 히브리어 אֱלֹהִים אֲחֵרִים는 표준적으로 ‘다른 신들’이 가장 직접적입니다. ‘이방’이나 ‘거짓’은 해석을 더해 의미를 좁힐 수 있으므로 본문 표현을 보존했습니다.
  doctrine_reference: Translation philosophy §1 (original-language primacy)
