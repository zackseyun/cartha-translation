base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/024.yaml
  text: Then the king of Assyria brought people from Babylon[a], Cuthah, Avva, Hamath, and Sepharvaim, and settled them in the cities of Samaria in place of the sons of Israel[b]. They took possession of Samaria and lived in its cities.
  footnotes:
  - marker: a
    text: Or 'instead of the Israelites' or 'in place of the people of Israel.'
    reason: lexical_alternative
  - marker: b
    text: Avva may also be spelled 'Awwa' in English transliteration.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 앗수르 왕이 바벨론, 구다, 아와[b], 하맛, 스발와임에서 사람들을 데려와 사마리아의 성읍들에 이스라엘 자손[a] 대신 거주하게 했습니다. 그들은 사마리아를 차지하고 그 성읍들에 살았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘 사람들 대신’ 혹은 ‘이스라엘 백성 대신’. 히브리어는 문자적으로 ‘이스라엘 자손’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘아와’는 영어 음역에서 ‘아우아’로도 표기됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  english_pob_choice: brought people
  chosen_korean: 데려와
  alternatives_korean:
  - 데려왔습니다
  - 가져와
  lexicon: HALOT
  rationale: 히필 בוא는 ‘데려오다/오게 하다’의 강한 사역 의미가 있어, 문맥상 이주민을 옮겨 온 뜻을 자연스럽게 살렸습니다.
- source_word: מֶלֶךְ אַשּׁוּר
  english_pob_choice: the king of Assyria
  chosen_korean: 앗수르 왕
  alternatives_korean:
  - 앗수르의 왕
  - 아시리아 왕
  lexicon: HALOT
  rationale: 고유명사는 통용되는 성경식 표기를 따랐고, 속격 관계는 한국어에서 무리 없이 생략해도 의미가 분명합니다.
- source_word: מִבָּבֶל ... וּסְפַרְוַיִם
  english_pob_choice: from Babylon, Cuthah, Avva, Hamath, and Sepharvaim
  chosen_korean: 바벨론, 구다, 아와, 하맛, 스발와임
  alternatives_korean:
  - 바벨론, 쿠다, 아와, 하맛, 스발와임
  - 바벨론, 구다, 아우아, 하맛, 스발와임
  lexicon: HALOT
  rationale: 지명은 현대 음역 관행과 성경 번역 관례를 함께 고려해 옮겼습니다. 영어 주석의 Avva/Awwa 변이도 반영해 ‘아와’를 사용했습니다.
- source_word: תַּחַת בְּנֵי יִשְׂרָאֵל
  english_pob_choice: in place of the sons of Israel
  chosen_korean: 이스라엘 자손 대신
  alternatives_korean:
  - 이스라엘 사람들 대신
  - 이스라엘 백성 대신
  lexicon: HALOT
  rationale: תַּחַת의 핵심 의미인 ‘~대신’은 직접 살리고, בְּנֵי יִשְׂרָאֵל은 원문 구조를 비교적 가깝게 반영해 ‘이스라엘 자손’으로 유지했습니다.
- source_word: וַיִּרְשׁוּ אֶת שֹׁמְרוֹן
  english_pob_choice: They took possession of Samaria
  chosen_korean: 사마리아를 차지하고
  alternatives_korean:
  - 사마리아를 소유하고
  - 사마리아를 점유하고
  lexicon: HALOT
  rationale: ירשׁ는 정복·정착 문맥에서 ‘차지하다/점유하다’의 뜻이므로, 역사적 상황에 맞는 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 이스라엘 집단 지칭인 בְּנֵי יִשְׂרָאֵל의 처리
  chosen_reading: ‘이스라엘 자손’으로 직역을 유지하되, 한국어 문장에서는 ‘대신’과 결합해 집단 대체의 의미를 분명히 했습니다.
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 원문은 문자적으로는 남성 복수 구성형이지만, 여기서는 민족 전체를 가리키는 대표적 표현입니다. 직역성과 의미 명료성을 함께 살리기 위해 본문은 비교적 직설적으로 유지했습니다.
  doctrine_reference: DOCTRINE.md §Translation philosophy 4
