  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/לֹ֖א שָׁמֵ֑עוּ וַ/יַּקְשׁ֤וּ אֶת עָרְפָּ/ם֙ כְּ/עֹ֣רֶף אֲבוֹתָ֔/ם אֲשֶׁר֙ לֹ֣א הֶאֱמִ֔ינוּ בַּֽ/יהוָ֖ה אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/014.yaml
  text: But they would not listen; they stiffened their neck like the neck of their fathers[a], who did not believe in Yahweh their God.
  footnotes:
  - marker: a
    text: Or 'did not trust the LORD their God.' The Hebrew verb can denote belief or trust in a covenantal sense.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 듣지 않았습니다. 그들은 자기 조상들의 목처럼 자기 목을 굳게 했습니다[a]. 그들의 조상들도 야훼 그들의 하나님을 믿지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼 그들의 하나님을 신뢰하지 않았다.’ 히브리어 동사는 언약적 의미에서 믿음 또는 신뢰를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  english_pob_choice: But they would not listen
  chosen_korean: 그러나 그들은 듣지 않았습니다
  alternatives_korean:
  - 그러나 그들은 들으려 하지 않았습니다
  - 그러나 그들은 순종하지 않았습니다
  lexicon: HALOT
  rationale: וְלֹא는 앞선 경고에 대한 반대 전개를 드러내므로 ‘그러나’가 자연스럽고, שׁמע의 핵심 의미는 ‘듣다/듣지 않다’이므로 직역을 유지했습니다. ‘순종하지 않았다’는 가능하지만 여기서는 청각-관계적 거절의 이미지가 더 분명합니다.
- source_word: וַיַּקְשׁוּ אֶת עָרְפָּם
  english_pob_choice: they stiffened their neck
  chosen_korean: 그들은 자기 목을 굳게 했습니다
  alternatives_korean:
  - 그들은 목을 뻣뻣하게 했습니다
  - 그들은 목을 굳어지게 했습니다
  lexicon: HALOT
  rationale: ‘목을 굳게 하다’는 히브리어 관용구를 한국어로 자연스럽게 옮기면서도, 완고함의 신체 이미지를 유지합니다. ‘뻣뻣하게 했다’도 가능하지만 다소 구어적이고, ‘굳게 했다’가 문맥상 더 안정적입니다.
- source_word: כְּעֹרֶף אֲבוֹתָם
  english_pob_choice: like the neck of their fathers
  chosen_korean: 자기 조상들의 목처럼
  alternatives_korean:
  - 그들의 조상들의 목처럼
  - 조상들처럼
  lexicon: HALOT
  rationale: 비교 대상이 ‘그들의 조상들의 목’이므로 구체적 이미지와 병렬성을 살려 그대로 옮겼습니다. ‘조상들처럼’은 의미는 전달하지만 원문의 형상성을 약화시킵니다.
- source_word: הֶאֱמִינוּ בַּיהוָה אֱלֹהֵיהֶם
  english_pob_choice: did not believe in Yahweh their God
  chosen_korean: 야훼 그들의 하나님을 믿지 않았기 때문입니다
  alternatives_korean:
  - 야훼 그들의 하나님을 신뢰하지 않았기 때문입니다
  - 야훼 그들의 하나님께 믿음을 두지 않았기 때문입니다
  lexicon: HALOT
  rationale: אמן의 כאן 용법은 단순 지적 동의가 아니라 언약적 신뢰/믿음을 포함하므로 ‘믿지 않았다’가 가장 직접적입니다. 영어 POB의 ‘believe in’에 맞추되, 한국어에서는 전치사 구조보다 목적어+동사를 통해 자연스럽게 표현했습니다.
theological_decisions:
- issue: 예호와/야훼의 신명기적 언약명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 원문이 יְהוָה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 고유한 언약명을 보존하는 ‘야훼’를 채택했습니다. 이는 일반적인 교회용 ‘여호와’보다 원천 텍스트 추적성과 일관성이 높습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: אמן의 번역을 ‘믿다’로 둘지 ‘신뢰하다’로 둘지
  chosen_reading: 믿지 않았습니다
  alternative_readings:
  - 신뢰하지 않았습니다
  - 의지하지 않았습니다
  rationale: 본문의 문법은 ‘야훼 그들의 하나님을’ 대상화한 믿음의 결여를 말하며, 여기서는 ‘믿다’가 언약적 불신앙의 고발을 가장 직접적으로 드러냅니다. ‘신뢰하다’는 의미는 타당하지만 한국어 본문에서는 약간 더 해석적입니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #3'
