  lexicon: HALOT
  rationale: גלה의 강제 이주의 뉘앙스를 살리되, 영어 POB의 ‘carried ... away’에 대응하는 한국어로 ‘끌고 가다’를 택해 추방의 강제성을 유지했습니다.
- source_word: וַ/יֹּ֨שֶׁב אֹתֹ/ם
  english_pob_choice: settled them
  chosen_korean: 그들을 ... 살게 하였습니다
  alternatives_korean:
  - 그들을 ... 거주하게 하였습니다
  - 그들을 ... 정착시켰습니다
  lexicon: HALOT
  rationale: 히필의 ‘거주하게 하다’ 의미를 반영하되, 현대 한국어에서 자연스러운 결과상태 표현으로 풀어 원문의 처분 행위를 분명하게 했습니다.
theological_decisions:
- issue: 앗시리아 포로 이동의 강제성
  chosen_reading: ‘끌고 가서’로 번역해 단순 이주가 아니라 강제 추방/포로 이동임을 드러냈습니다.
  alternative_readings:
  - ‘유배하여’
  - ‘이주시켜’
  rationale: 문맥과 גלה의 용법상 단순 이동보다 강제적 추방이 핵심이므로, 독자가 역사적·신학적 충격을 놓치지 않도록 했습니다.
  doctrine_reference: 신명기 28장 포로 경고, 열왕기하 17장의 언약적 심판 서술
- issue: ‘할라와 고산 강의 하볼’의 지리 관계
  chosen_reading: ‘고산 강의 하볼’로 두어 하볼이 고산과 연결된 강임을 반영했습니다.
  alternative_readings:
  - ‘하볼, 고산의 강’
  - ‘하볼 강, 고산’
  rationale: 영어 POB의 주석이 지적하듯 히브리어는 하볼과 고산의 관계를 지리적으로 설명할 수 있으므로, 문장 안에서 강-지역 결속을 보존했습니다.
  doctrine_reference: 본문 지리 묘사에 대한 소스-직역 원칙
