  english_pob_choice: the king of Assyria captured Samaria
  chosen_korean: 앗시리아 왕이 사마리아를 점령하고
  alternatives_korean:
  - 앗시리아 왕이 사마리아를 사로잡고
  - 앗시리아 왕이 사마리아를 함락하고
  lexicon: HALOT
  rationale: 도시를 대상으로 한 לָכַד는 군사적 점령/함락의 의미이므로 ‘점령하다’가 가장 자연스럽고 원문의 정복력을 잘 살립니다.
