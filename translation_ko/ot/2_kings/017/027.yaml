  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
  footnotes:
  - marker: a
    text: Or 'Bring there' or 'Send there' one of the priests.
    reason: lexical_alternative
  - marker: b
    text: Or 'whom you deported from there.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew has plural verbs here (''let them go'' / ''let them live''), though the sense is singular: ''one of the priests'' ... ''let him teach them.'''
    reason: textual_variant
  - marker: d
    text: Or 'teach them the law/requirement of the god of the land.'
    reason: lexical_alternative
  - marker: e
    text: Or 'the God of the land'; lower-case 'god' reflects the Assyrian speaker's perspective.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 앗수르 왕이 명령했습니다. “그곳으로 너희가 그곳에서 유배 보낸[b] 제사장들 가운데 한 사람을 데려가라[a]. 그가 가서 그곳에 살게 하고[c], 그 땅의 신의 법도를 그들에게 가르치게 하라[d][e].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려가라’는 ‘보내라’ 또는 ‘옮겨 보내라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘유배 보낸’은 ‘추방한’, ‘강제로 이주시킨’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여기서 ‘가게 하고’와 ‘살게 하고’에 해당하는 동사를 복수형으로 사용합니다. 그러나 앞의 ‘한 사람’과 뒤의 단수형 ‘가르치게 하라’에 비추어 문맥상 단수로 옮겼습니다.
    reason: textual_variant
  - marker: d
    text: ‘법도’는 여기서 ‘관습’, ‘율법’ 또는 ‘요구 사항’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 직접 화법을 말하는 앗수르 왕의 관점을 반영하여 ‘신’으로 옮겼습니다. ‘그 땅의 하나님’으로 번역할 수도 있습니다.
    reason: alternative_reading
