base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/027.yaml
  text: Then the king of Assyria commanded[a], saying, “Take there one of the priests whom you exiled from there, and let him go and live there[e][d][c][b], and let him teach them the custom of the god of the land.”
  footnotes:
  - marker: a
    text: Or 'Bring there' or 'Send there' one of the priests.
    reason: lexical_alternative
  - marker: b
    text: Or 'whom you deported from there.'
    reason: lexical_alternative
  - marker: c
    text: 'Hebrew has plural verbs here (''let them go'' / ''let them live''), though the sense is singular: ''one of the priests'' ... ''let him teach them.'''
    reason: textual_variant
  - marker: d
    text: Or 'teach them the law/requirement of the god of the land.'
    reason: lexical_alternative
  - marker: e
    text: Or 'the God of the land'; lower-case 'god' reflects the Assyrian speaker's perspective.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 앗수르 왕이 명령하여 말했습니다. 「그곳으로 너희가 거기에서 쫓아낸 제사장들 가운데 한 사람을 데려가게 하여, 그가 거기에서 살며 그 땅의 하나님이 정하신 규례를 그들에게 가르치게 하라.」[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘데려가게 하라’, ‘보내라’, ‘옮기게 하라’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거기에서 쫓아낸’은 ‘거기에서 추방한/유배시킨’의 뜻입니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 여기서 복수형 동사를 사용하지만, 앞의 ‘한 사람’과 뒤의 단수형 ‘가르치게 하라’에 따라 뜻은 단수입니다.
    reason: textual_variant
  - marker: d
    text: ‘규례’는 여기서 ‘율법’ 또는 ‘요구사항’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: e
    text: 이 표현은 앗수르 왕의 관점을 반영하므로, ‘그 땅의 신’으로도 번역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְצַו / commanded
  english_pob_choice: commanded
  chosen_korean: 명령하여
  alternatives_korean:
  - 명하여
  - 지시하여
  lexicon: HALOT
  rationale: 왕의 권위를 드러내는 צוה의 서술형에 맞게, 한국어에서도 공식적이고 직접적인 ‘명령하여’로 옮겼습니다.
- source_word: הֹלִיכוּ שָׁמָּה
  english_pob_choice: Take there
  chosen_korean: 그곳으로 ... 데려가게 하라
  alternatives_korean:
  - 그곳으로 보내라
  - 그곳으로 데려오라
  lexicon: HALOT
  rationale: 히필 הלך의 ‘가게 하다/데려가다’라는 강제적 이동을 살리되, 왕의 지시 맥락에 자연스러운 ‘데려가게 하라’를 택했습니다.
- source_word: וְיֹרֵם אֶת מִשְׁפַּט
  english_pob_choice: and let him teach them the custom
  chosen_korean: 규례를 ... 가르치게 하라
  alternatives_korean:
  - 율법을 ... 가르치게 하라
  - 법도를 ... 가르치게 하라
  lexicon: HALOT
  rationale: מִשְׁפַּט은 여기서 성문화된 ‘율법’보다 실제로 따라야 할 종교적 관행/규정을 가리키므로, 문맥상 중립적인 ‘규례’가 가장 적절합니다.
- source_word: אֱלֹהֵי הָאָרֶץ
  english_pob_choice: the god of the land
  chosen_korean: 그 땅의 하나님
  alternatives_korean:
  - 그 땅의 신
  - 그 땅의 하나님이
  lexicon: HALOT
  rationale: 히브리어 문맥은 토지의 신격을 가리키는 표현이지만, 본문은 이스라엘의 하나님을 외인들이 지역신처럼 이해하는 장면이므로 ‘하나님’을 유지하되 앞의 ‘규례’와 함께 맥락의 아이러니를 살렸습니다.
theological_decisions:
- issue: 앗수르 왕의 관점에 따른 territorial deity 표현의 처리
  chosen_reading: 그 땅의 하나님
  alternative_readings:
  - 그 땅의 신
  rationale: 본문은 이방 왕의 명령을 직접 보고하여, 독자가 그가 야훼를 지역신처럼 다루는 관점을 읽어내도록 해야 합니다. 한국어에서는 ‘하나님’을 유지하되 문맥 자체가 그 인식을 드러내므로, 신학적 긴장을 보존할 수 있습니다.
  doctrine_reference: 'translation philosophy: preserve theological tension rather than resolving narrator/speaker perspective'
- issue: 히브리어 복수 동사와 단수 선행사 불일치
  chosen_reading: 단수 의미로 자연스럽게 정리(‘그가 ... 살며’)
  alternative_readings:
  - 복수형을 직역하여 ‘그들이 ... 살며’
  rationale: 앞의 선행사는 ‘한 사람’이며 뒤의 가르치는 주체도 단수이므로, 한국어는 의미상 단수로 정리하는 것이 본문의 의도를 더 분명하게 전달합니다.
  doctrine_reference: source text grammatical irregularity
