  edition: WLC
  text: כִּ֣י אִֽם אֶת יְהוָ֗ה אֲשֶׁר֩ הֶעֱלָ֨ה אֶתְ/כֶ֜ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בְּ/כֹ֧חַ גָּד֛וֹל וּ/בִ/זְר֥וֹעַ נְטוּיָ֖ה אֹת֣/וֹ תִירָ֑אוּ וְ/ל֥/וֹ תִֽשְׁתַּחֲו֖וּ וְ/ל֥/וֹ תִזְבָּֽחוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/036.yaml
  text: But Yahweh[a], who brought you up from the land of Egypt with great power and with an outstretched arm—you shall fear him, and to him you shall bow down[b], and to him you shall sacrifice.
  footnotes:
  - marker: a
    text: Or 'Rather, the LORD ... him you shall fear.' The Hebrew opening is contrastive, setting the LORD over against other gods.
    reason: alternative_reading
  - marker: b
    text: '''Fear'' here carries the sense of reverent awe and covenant loyalty, not merely terror.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 야훼께서—그분은 큰 능력과 뻗은 팔로 너희를 이집트 땅에서 올라오게 하신 분이니—그분만 두려워하고, 그분께만 엎드려 경배하며, 그분께만 제사를 드리십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워하다’는 여기서 단순한 공포가 아니라 경외와 언약적 충성을 포함합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘뻗은 팔’은 출애굽을 가리키는 관용구로, 하나님의 구원 능력을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: כִּי אִם
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 오직
  - 하지만
  lexicon: HALOT
  rationale: 앞선 우상 숭배 금지와 대비되는 긍정 명령을 한국어의 자연스러운 역접으로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: POB의 본문 원칙에 따라 신적 고유명사를 ‘야훼’로 옮겨, 호칭인 ‘주’로 대체하지 않았습니다.
- source_word: וּבִזְרֹעַ נְטוּיָה
  english_pob_choice: and with an outstretched arm
  chosen_korean: 뻗은 팔
  alternatives_korean:
  - 펼친 팔
  - 늘인 팔
  - 뻗어 있는 팔
  lexicon: HALOT
  rationale: 출애굽 전승의 관용구를 살리되, 현대 한국어에서 자연스럽고 힘의 이미지를 분명히 드러내는 표현을 택했습니다.
- source_word: אֹתוֹ תִירָאוּ
  english_pob_choice: you shall fear him
  chosen_korean: 그분만 두려워하고
  alternatives_korean:
  - 그분을 경외하고
  - 그분을 두려워하고
  - 그분을 경외하십시오
  lexicon: HALOT
  rationale: ‘fear’의 긴장감을 유지하되, 여기서는 단순 공포보다 예배적 경외를 포함하는 의미로 읽히므로 문맥상 ‘두려워하고’에 설명적 뉘앙스를 더했습니다.
- source_word: וְלוֹ תִשְׁתַּחֲווּ
  english_pob_choice: and to him you shall bow down
  chosen_korean: 그분께만 엎드려 경배하며
  alternatives_korean:
  - 그분께만 절하며
  - 그분께만 엎드리고
  - 그분께만 경배하며
  lexicon: HALOT
  rationale: 동사의 문자적 의미인 엎드림을 보존하면서, 예배 행위임을 드러내기 위해 ‘경배’와 결합했습니다.
theological_decisions:
- issue: 여호와/야훼의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 문맥상 언약의 신적 고유명사를 가리키므로, 전통적 대체어 ‘주’ 대신 고유명사 음역을 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘fear’의 의미 범위
  chosen_reading: 그분만 두려워하고
  alternative_readings:
  - 그분을 경외하고
  - 그분을 두려워하십시오
  - 그분을 예배로 두려워하고
  rationale: 본문의 긴장감을 보존하기 위해 ‘두려워하다’를 유지하되, 절대적 충성과 예배의 뉘앙스가 문맥에서 이해되도록 했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: Preserve theological tension rather than resolve it'
