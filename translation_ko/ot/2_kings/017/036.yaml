  source_fidelity: 수정이 필요합니다. 초안은 야훼라는 신명을 유지하고 출애굽 및 제사의 의미를 대체로 충실히 반영합니다. 그러나 히브리어의 직접 목적어인 ‘야훼를’을 ‘그분만’으로 세 차례 반복하여 강조를 확장했고, תִשְׁתַּחֲווּ(몸을 굽히다/엎드리다)에 ‘경배’를 덧붙여 예배 일반으로 해석을 보탰습니다. ‘뻗은 팔’보다 출애굽 관용구에 더 밀착한 ‘펴신 팔’이 적절합니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체로 자연스럽습니다. 관계절을 신명 앞에 두고 세 명령을 병렬하여 원문의 흐름을 살렸습니다.
  terminology: ‘야훼’는 프로젝트의 신명 표기 원칙과 일치합니다. ירא는 본문에서 ‘두려워하다’로 보존하고 각주에서 경외의 문맥적 함의를 설명합니다. ‘엎드리다’는 שׁחה의 신체적 행위를 유지하며, ‘제사를 드리다’는 זבח의 제의적 의미를 자연스럽게 전달합니다.
  issues:
