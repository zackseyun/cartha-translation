- from: 그러나 야훼께서—그분은 큰 능력과 뻗은 팔로 너희를 이집트 땅에서 올라오게 하신 분이니—그분만 두려워하고, 그분께만 엎드려 경배하며, 그분께만 제사를 드리십시오.[a][b]
  to: 그러나 큰 능력과 펴신 팔로 너희를 이집트 땅에서 이끌어 올리신 야훼를 두려워하고,[a] 그분께 엎드리며, 그분께 제사를 드리십시오.[b]
  rationale: 대조 접속사 כִּי אִם은 ‘그러나’로, 신명 יהוה는 ‘야훼’로 유지했습니다. הֶעֱלָה의 출애굽 이미지는 ‘이끌어 올리신’으로 보존하고, בִּזְרוֹעַ נְטוּיָה는 ‘펴신 팔’로 옮겼습니다. 세 명령은 원문의 순서대로 ‘두려워하다—엎드리다—제사를 드리다’로 번역하여 불필요한 해석적 보충을 제거했습니다. 각주는 영어 POB 감사 기록의 두 쟁점에 맞추어 배치했습니다.
  reviewer_model: gpt-5.6-terra
