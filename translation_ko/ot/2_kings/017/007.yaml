revisions:
- from: 이스라엘 자손이 자기들의 하나님이신 야훼께 죄를 지었기 때문입니다. 그분은 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 손 아래에서 끌어내신 분이셨는데, 그들은 다른 신들을 두려워했습니다.[a][b]
  to: 이 일이 일어난 것은 이스라엘 자손이 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 손 아래에서[a] 끌어내신 그들의 하나님 야훼께 죄를 지었으며, 다른 신들을 두려워했기[b] 때문입니다.
  rationale: 설명적 도입구를 ‘이 일이 일어난 것은’으로 명시하여 원문의 인과적 서사 기능을 자연스러운 한국어 문장으로 완결했습니다. 야훼를 수식하는 분사구는 ‘그들을 … 끌어내신 그들의 하나님 야훼’로 유지했으며, ‘두려워하다’의 의미 범위를 보존했습니다. 각주 표지는 해당 본문 어구 직후로 바로잡고, 각주 b의 잘못된 낱말 표기를 제거했습니다.
