  source_fidelity: 핵심 어휘 선택은 대체로 원문에 충실합니다. 그러나 현 본문은 첫 문장이 ‘…때문입니다’로 끝난 뒤 그 원인이 설명되는 문장이 이어져, וַיְהִי כִּי의 설명적 도입과 문장 관계가 한국어에서 무너집니다. 또한 각주 표지가 해당 어구와 바뀌어 연결되어 있습니다.
  naturalness: ‘이 일이 일어난 것은 … 때문입니다’로 한 문장 안에 원인과 결과를 연결하면 현대 한국어 합쇼체로 자연스럽고, 히브리어의 서사적 인과 관계도 보존됩니다. ‘자기들의’보다 ‘그들의’가 이 민족 집단을 가리키는 문맥에서 더 자연스럽습니다.
  terminology: ‘야훼’, ‘하나님’, ‘죄를 짓다’, ‘다른 신들’, ‘두려워하다’는 프로젝트의 선택 및 원문의 어휘 범위와 일치합니다. ירא를 ‘경배하다’로 좁히지 않은 점이 적절합니다.
  issues:
