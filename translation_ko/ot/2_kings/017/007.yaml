source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי חָטְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ לַ/יהוָ֣ה אֱלֹהֵי/הֶ֔ם הַ/מַּעֲלֶ֤ה אֹתָ/ם֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם מִ/תַּ֕חַת יַ֖ד פַּרְעֹ֣ה מֶֽלֶךְ מִצְרָ֑יִם וַ/יִּֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/007.yaml
  text: And this happened because the children of Israel had sinned against Yahweh their God[a], who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt[b], and had feared other gods.
  footnotes:
  - marker: a
    text: Or 'from under Pharaoh’s power.' The Hebrew idiom is literally 'from under the hand of Pharaoh.'
    reason: lexical_alternative
  - marker: b
    text: Or 'worshiped other gods.' The Hebrew says 'feared other gods,' using the common verb for fear/reverence that can include worshipful devotion.
    reason: lexical_alternative
translation:
  language: ko
  text: 이스라엘 자손이 자기들의 하나님이신 야훼께 죄를 지었기 때문입니다. 그분은 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 손 아래에서 끌어내신 분이셨는데, 그들은 다른 신들을 두려워했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손 아래’는 히브리어 관용구로, 문자적으로는 ‘파라오의 손 아래에서’라는 뜻입니다.
    reason: source_note
  - marker: b
    text: ‘두려워했다’는 כאן의 기본 동사를 살린 번역입니다. 문맥상 우상숭배를 내포할 수 있지만, 본문은 ‘경배했다’가 아니라 ‘두려워했다’를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  english_pob_choice: And this happened because
  chosen_korean: …때문입니다
  alternatives_korean:
  - …이렇게 된 것은
  - …이 일이 일어난 것은
  lexicon: HALOT
  rationale: 서사적 설명을 여는 כי의 인과를 한국어 원인절로 자연스럽게 드러내되, 본문의 해설적 기능을 유지했습니다.
- source_word: חָטְאוּ
  english_pob_choice: had sinned
  chosen_korean: 죄를 지었기
  alternatives_korean:
  - 죄를 범했기
  - 죄를 지었기 때문에
  lexicon: HALOT
  rationale: חטא의 기본 의미를 살려 ‘죄를 지었다’로 옮겼고, 문맥상 결과 설명이므로 이유 연결에 맞게 처리했습니다.
- source_word: לַיהוָה אֱלֹהֵיהֶם
  english_pob_choice: against Yahweh their God
  chosen_korean: 자기들의 하나님이신 야훼께
  alternatives_korean:
  - 그들의 하나님 야훼께
  - 야훼 그들의 하나님께
  lexicon: HALOT
  rationale: 이 동사는 ‘~께 죄를 짓다’의 대상 표지가 자연스럽고, יְהוָה는 본 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם מִתַּחַת יַד פַּרְעֹה
  english_pob_choice: who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt
  chosen_korean: 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 손 아래에서 끌어내신 분
  alternatives_korean:
  - 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 권세 아래에서 끌어올리신 분
  - 그들을 이집트 땅에서, 곧 파라오의 손 아래에서 인도해 내신 분
  lexicon: HALOT
  rationale: 분사구를 과거 완료적 설명으로 옮겨 구원의 행위를 회고적으로 드러냈고, ‘손 아래’라는 히브리어 관용을 본문에 보존했습니다.
- source_word: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים
  english_pob_choice: and had feared other gods
  chosen_korean: 다른 신들을 두려워했습니다
  alternatives_korean:
  - 다른 신들을 경외했습니다
  - 다른 신들을 섬겼습니다
  lexicon: HALOT
  rationale: ירא의 핵심 의미를 유지해 ‘두려워하다’로 옮겼습니다. 우상숭배의 의미가 함축되더라도, 본문 자체의 어휘를 넘어서 ‘섬겼다’로 풀지는 않았습니다.
theological_decisions:
- issue: יהוה(YHWH)와 אֱלֹהִים의 한국어 처리
  chosen_reading: 야훼 / 하나님
  alternative_readings:
  - 여호와 / 하나님
  - 주님 / 하나님
  rationale: 히브리어 본문의 고유한 언약명 יְהוָה는 프로젝트 기본값에 따라 ‘야훼’로, אֱלֹהִים은 통상 번역 관례에 따라 ‘하나님’으로 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼; Θεός → 하나님'
- issue: וַיִּירְאוּ אֱלֹהִים אֲחֵרִים의 해석 범위
  chosen_reading: 다른 신들을 두려워했습니다
  alternative_readings:
  - 다른 신들을 경배했습니다
  - 다른 신들을 숭배했습니다
  rationale: 히브리어는 ‘두려워하다’(ירא)를 사용하므로, 본문이 실제로 말하는 어휘를 보존했습니다. 문맥상 우상적 예배를 포함할 수 있으나, 그 해석을 본문보다 앞서지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy: preserve source text''s plain sense; do not paraphrase beyond what the source warrants'
