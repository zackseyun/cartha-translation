- source_word: הַמַּעֲלֶה אֹתָם מֵאֶרֶץ מִצְרַיִם מִתַּחַת יַד פַּרְעֹה
  english_pob_choice: who had brought them up from the land of Egypt, from under the hand of Pharaoh king of Egypt
  chosen_korean: 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 손 아래에서 끌어내신 분
  alternatives_korean:
  - 그들을 이집트 땅에서, 곧 이집트 왕 파라오의 권세 아래에서 끌어올리신 분
