  text: וַ/יֹּאמְר֗וּ לְ/מֶ֣לֶךְ אַשּׁוּר֮ לֵ/אמֹר֒ הַ/גּוֹיִ֗ם אֲשֶׁ֤ר הִגְלִ֨יתָ֙ וַ/תּ֨וֹשֶׁב֙ בְּ/עָרֵ֣י שֹׁמְר֔וֹן לֹ֣א יָֽדְע֔וּ אֶת מִשְׁפַּ֖ט אֱלֹהֵ֣י הָ/אָ֑רֶץ וַ/יְשַׁלַּח בָּ֣/ם אֶת הָ/אֲרָי֗וֹת וְ/הִנָּ/ם֙ מְמִיתִ֣ים אוֹתָ֔/ם כַּ/אֲשֶׁר֙ אֵינָ֣/ם יֹדְעִ֔ים אֶת מִשְׁפַּ֖ט אֱלֹהֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/026.yaml
  text: So they spoke to the king of Assyria[a], saying, “The nations that you have exiled and settled in the cities of Samaria do not know the law of the god of the land, so he has sent lions among them; and behold, they are killing them[b], because they do not know the law of the god of the land.”
  footnotes:
  - marker: a
    text: Or “the God of the land.” The Hebrew can refer to Israel’s God, but the lowercase rendering in the main text preserves the reported pagan perspective of the speakers.
    reason: alternative_reading
  - marker: b
    text: “Custom” may also be rendered “law,” “requirement,” or “prescribed practice,” referring here to the expected manner of worship for the deity of the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 아시리아 왕에게 말했습니다. “왕께서 내쫓고 사마리아 성읍들에 정착시킨 민족들은 그 땅의 하나님의 법을 알지 못합니다. 그래서 그분이 사자들을 그들 가운데 보내셨는데, 보십시오, 그들이 그들을 죽이고 있습니다. 그들이 그 땅의 하나님의 법을 알지 못하기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 ‘그 땅의 하나님’은 본문 맥락상 이스라엘의 하나님을 가리키지만, 말하는 이들은 이를 지역 신처럼 이해하고 있습니다.
    reason: source_note
lexical_decisions:
- source_word: הַגּוֹיִם
  english_pob_choice: the nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 열방
  lexicon: HALOT
  rationale: 이 역사 서술에서는 여러 집단의 강제 이주민을 가리키므로, ‘민족들’이 집단적·민족적 의미를 자연스럽게 살리면서도 신약적 ‘이방인’ 뉘앙스를 피합니다.
- source_word: הִגְלִיתָ
  english_pob_choice: you have exiled
  chosen_korean: 내쫓고
  alternatives_korean:
  - 유배시키고
  - 포로로 끌고 가고
  lexicon: HALOT
  rationale: 히필 גלה의 강제 이주 의미를 현대 한국어에서 간결하게 드러내기 위해 ‘내쫓다’를 택했습니다. ‘유배시키다’도 가능하지만 문맥의 강제성은 유지하면서 더 직접적입니다.
- source_word: מִשְׁפַּט
  english_pob_choice: law
  chosen_korean: 법
  alternatives_korean:
  - 관례
  - 규정
  - 율례
  lexicon: HALOT
  rationale: 여기서는 법적 판결이 아니라 지역 신에게 요구되는 준수 기준을 가리키므로, 한국어에서는 ‘법’이 가장 자연스럽고 POB의 문맥적 선택을 잘 반영합니다.
- source_word: אֱלֹהֵי הָאָרֶץ
  english_pob_choice: the god of the land
  chosen_korean: 그 땅의 하나님
  alternatives_korean:
  - 그 땅의 신
  - 그 땅의 하나님(소문자 ‘하나님’에 해당하는 표현)
  lexicon: HALOT
  rationale: 히브리어 본문은 보고된 말 속에서 이 신을 지역 신처럼 말하지만, 한국어에서는 ‘하나님’을 소문자 표기로 구분할 수 없으므로 본문은 ‘그 땅의 하나님’으로 두고, 그들 관점의 표현이라는 점은 문맥으로 보존합니다.
- source_word: וְהִנָּם
  english_pob_choice: and look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라, 지금
  lexicon: HALOT
  rationale: 감탄·지시 기능을 가진 표현을 한국어 합쇼체에서 가장 자연스럽게 옮기기 위해 ‘보십시오’를 선택했습니다.
- source_word: מְמִיתִים אוֹתָם
  english_pob_choice: they are killing them
  chosen_korean: 그들이 그들을 죽이고 있습니다
  alternatives_korean:
  - 그들이 그들을 죽입니다
  - 그들을 죽이고 있습니다
  lexicon: HALOT
  rationale: 분사형의 진행 중인 행위를 살리기 위해 현재 진행형으로 옮겼습니다.
theological_decisions:
- issue: 보고된 이방인 관점 속의 ‘하나님’ 표기
  chosen_reading: 본문은 ‘그 땅의 하나님’으로 옮기되, 독자가 이것을 이스라엘의 하나님에 대한 보고된 이방인식 표현으로 읽도록 문맥을 유지합니다.
  alternative_readings:
  - ‘그 땅의 신’으로 약화
  - ‘그 땅의 하나님’ 대신 ‘하나님’으로 일반화
  rationale: 히브리어 본문은 정황상 지역 신처럼 인식된 야훼를 말하는 보고된 발화입니다. 한국어는 대소문자 구분이 없으므로, 본문은 직접적이고도 중립적인 ‘그 땅의 하나님’으로 두어 의미 긴장을 보존합니다.
  doctrine_reference: Translation philosophy §1 (원문 우선) 및 §3 (긴장 보존)
