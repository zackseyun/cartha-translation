  source_fidelity: 수정이 필요합니다. הִגְלִיתָ는 단순히 ‘내쫓다’보다 강제적인 이주·추방을 뜻하므로 ‘강제로 이주시켜’가 더 정확합니다. 또한 אֱלֹהֵי הָאָרֶץ는 보고된 발화에서 지역의 신으로 이해된 표현이므로, 한국어 본문에서는 고유한 신명처럼 들리는 ‘하나님’보다 ‘신’이 원문의 관점과 영어 POB의 소문자 god 선택을 더 충실히 보존합니다. 사자와 이주민을 가리키는 복수 대명사는 한국어에서 명시하여 원문의 지시 관계를 분명히 했습니다.
  naturalness: ‘왕께서 강제로 이주시켜 사마리아 성읍들에 살게 하신’은 현대 표준 한국어 합쇼체에서 자연스럽고, 강제 이주와 정착이라는 두 동작을 모두 드러냅니다. ‘사자들이 그들을 죽이고 있습니다’는 반복 대명사로 생기는 모호성을 제거하면서 진행의 의미를 유지합니다.
