  naturalness: ‘산당들의 집들’은 현대 한국어에서 부자연스럽고 의미도 불분명합니다. ‘산당 신전들’은 제의 장소의 건물을 자연스럽게 나타냅니다. ‘자기들의 신들’도 가능하지만, 분배적 단수 주어와 더 잘 호응하는 ‘자기 신들’이 간결하고 자연스럽습니다.
