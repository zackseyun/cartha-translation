base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/029.yaml
  text: But each nation kept making its own gods[a], and they set them in the shrines of the high places that the people of Samaria had made, each nation in the cities where they lived.
  footnotes:
  - marker: a
    text: Or, 'the Samaritans had made.'
    reason: alternative_reading
translation:
  language: ko
  text: 그러나 각 민족은 자기들의 신들을 계속 만들어 냈고, 사마리아 사람들이 만든 산당들의 집들에 그것들을 두었습니다. 각 민족은 자기들이 사는 도시들에 그렇게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, ‘사마리아 사람들이 만들었다’.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ עֹשִׂים
  english_pob_choice: kept making
  chosen_korean: 계속 만들어 냈고
  alternatives_korean:
  - 만들고 있었고
  - 만들었습니다
  lexicon: HALOT
  rationale: הלך식 진행·상습의 뉘앙스를 한국어 과거 서술에서 자연스럽게 살리기 위해 ‘계속 만들어 냈고’로 옮겼습니다.
- source_word: גּוֹי גּוֹי אֱלֹהָיו
  english_pob_choice: each nation... its own gods
  chosen_korean: 각 민족은 자기들의 신들
  alternatives_korean:
  - 각 민족은 자기 신들
  - 모든 민족은 그 신들
  lexicon: HALOT
  rationale: 반복된 גוי는 분배적 의미이므로 ‘각 민족’으로, אַלֹהָיו는 각 집단의 소유를 드러내기 위해 ‘자기들의 신들’로 옮겼습니다.
- source_word: וַיַּנִּיחוּ
  english_pob_choice: they set
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 세워 두었습니다
  lexicon: HALOT
  rationale: 제의적 배치 맥락에서 단순한 ‘놓다’보다 ‘두다’가 더 자연스럽고, 우상 설치의 결과를 간결하게 전달합니다.
- source_word: בְּבֵית הַבָּמוֹת
  english_pob_choice: in the shrines of the high places
  chosen_korean: 산당들의 집들에
  alternatives_korean:
  - 높은 곳의 집들에
  - 산당의 집에
  lexicon: HALOT
  rationale: 히브리어 직역인 ‘집’의 구조를 유지하되, 관용적으로 ‘산당’이 본문의 제의 장소를 가장 분명하게 드러내므로 ‘산당들의 집들’로 옮겼습니다.
- source_word: הַשֹּׁמְרֹנִים
  english_pob_choice: the people of Samaria
  chosen_korean: 사마리아 사람들이
  alternatives_korean:
  - 사마리아인들이
  - 사마리아의 백성이
  lexicon: HALOT
  rationale: 이 시기의 역사적 지시 대상은 후대의 종파적 의미를 띠는 ‘사마리아인’보다 지역 주민을 가리키는 ‘사마리아 사람들’이 더 적절합니다.
theological_decisions:
- issue: 지명·집단명인 שֹׁמְרֹנִים의 한국어 처리
  chosen_reading: ‘사마리아 사람들’로 옮겨 후대의 종교적·민족적 고정 의미를 덜어냈습니다.
  alternative_readings:
  - 사마리아인들
  - 사마리아의 사람들
  rationale: 본문은 분열왕국 이후의 지역 거주 집단을 가리키므로, 신학적 오독을 줄이기 위해 역사적·지역적 의미를 우선했습니다.
  doctrine_reference: 원문 우선 원칙과 역사적 문맥 보존
