revisions:
- from: 그러나 각 민족은 자기들의 신들을 계속 만들어 냈고, 사마리아 사람들이 만든 산당들의 집들에 그것들을 두었습니다. 각 민족은 자기들이 사는 도시들에 그렇게 했습니다.[a]
  to: 그러나 각 민족은 계속해서 자기 신들을 만들고, 자기가 사는 성읍들에 있는 사마리아 사람들이[a] 만든 산당 신전들에 그것들을 두었습니다.
  rationale: 진행·반복의 וַיִּהְיוּ עֹשִׂים은 ‘계속해서 만들고’로, 분배적 גּוֹי גּוֹי는 ‘각 민족’으로 보존했습니다. 마지막 장소구를 ‘자기가 사는 성읍들에 있는’으로 연결하여 원문의 수식 관계를 회복했습니다. בֵּית הַבָּמוֹת는 한국어의 자연스러운 제의 용어인 ‘산당 신전들’로 옮겼으며, 사마리아 관련 대안은 실제로 구별되는 표현으로 각주 처리했습니다.
  reviewer_model: gpt-5.6-terra
