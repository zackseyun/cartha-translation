source:
  edition: WLC
  text: וְ/הַ/בְּרִ֛ית אֲשֶׁר כָּרַ֥תִּי אִתְּ/כֶ֖ם לֹ֣א תִשְׁכָּ֑חוּ וְ/לֹ֥א תִֽירְא֖וּ אֱלֹהִ֥ים אֲחֵרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/038.yaml
  text: And the covenant that I made with you[a], you shall not forget[b], and you shall not fear other gods.
  footnotes:
  - marker: a
    text: Hebrew literally, 'the covenant that I cut with you.' 'Made' renders the Hebrew covenant-making idiom in natural English.
    reason: lexical_alternative
  - marker: b
    text: Or 'do not fear other gods.' The Hebrew form can be rendered with either 'you shall not' or 'do not' in English.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 내가 너희와 맺은 언약을 너희는 잊지 말아야 하며, 다른 신들을 두려워해서도 안 됩니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구는 문자적으로는 ‘너희와 자른’에 가깝지만, 한국어에서는 ‘언약을 맺다’가 자연스러운 관용적 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 לֹא תִירְאוּ는 문맥에 따라 ‘두려워하지 말라’ 또는 ‘두려워해서도 안 된다’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: הַבְּרִית
  english_pob_choice: the covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 협정
  lexicon: HALOT
  rationale: בְּרִית는 하나님과 백성 사이의 결속을 가리키는 문맥이므로, 평범한 ‘계약’보다 성서적·신학적 함의를 살리는 ‘언약’이 가장 적절합니다.
- source_word: כָּרַתִּי אִתְּכֶם
  english_pob_choice: that I made with you
  chosen_korean: 내가 너희와 맺은
  alternatives_korean:
  - 내가 너희와 끊은
  - 내가 너희와 만든
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘언약을 자르다’는 관용구이지만, 한국어에서는 ‘언약을 맺다’가 자연스럽고 원문의 의미를 정확히 전달합니다.
- source_word: לֹא תִשְׁכָּחוּ
  english_pob_choice: you shall not forget
  chosen_korean: 너희는 잊지 말아야 하며
  alternatives_korean:
  - 너희는 잊어서는 안 되며
  - 너희는 잊지 않을 것입니다
  lexicon: HALOT
  rationale: 문맥상 금지·권고의 뉘앙스가 있어, 현대 한국어에서는 ‘잊지 말아야 하며’가 명령성과 문체를 함께 살립니다.
- source_word: וְלֹא תִירְאוּ אֱלֹהִים אֲחֵרִים
  english_pob_choice: and you shall not fear other gods
  chosen_korean: 다른 신들을 두려워해서도 안 됩니다
  alternatives_korean:
  - 다른 신들을 경외해서도 안 됩니다
  - 다른 신들을 무서워해서도 안 됩니다
  lexicon: HALOT
  rationale: יָרֵא는 ‘두려워하다/경외하다’의 범위를 가지지만, 여기서는 다른 신들에 대한 종교적 충성의 금지를 드러내므로 ‘두려워하다’가 가장 직설적이고 덜 해석적입니다.
theological_decisions:
- issue: 금지문의 한국어 표지
  chosen_reading: ‘잊지 말아야 하며’와 ‘안 됩니다’로 이어지는 현대적 금지 표현을 사용했습니다.
  alternative_readings:
  - ‘잊어서는 안 되며’
  - ‘잊지 말고… 두려워하지 말라’
  rationale: 히브리어의 연속된 금지/명령 구조를 살리면서도, 합쇼체 본문에서 자연스럽고 분명한 권면으로 들리게 하기 위한 선택입니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: ‘fear’의 신학적 뉘앙스
  chosen_reading: ‘다른 신들을 두려워하다’로 번역해 예배·충성의 방향성을 암시하되, 과도한 해설은 피했습니다.
  alternative_readings:
  - ‘다른 신들을 경외하다’
  - ‘다른 신들을 섬기다’
  rationale: 본문은 야훼에 대한 배타적 언약 충성을 요구하므로, ‘경외’처럼 예배적 의미를 미리 확정하기보다 원문의 금지 대상을 직접 드러내는 표현이 더 적합합니다.
  doctrine_reference: Covenant fidelity; exclusive worship
