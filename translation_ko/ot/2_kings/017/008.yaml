base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/008.yaml
  text: And they walked in the statutes of the nations whom Yahweh had dispossessed before the sons of Israel[c][b][a], and in the practices that the kings of Israel had introduced.
  footnotes:
  - marker: a
    text: Or 'walked according to the customs of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Or 'whom the LORD had driven out before the sons of Israel.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Israel'; that is, the Israelites.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼께서 이스라엘 자손 앞에서 쫓아내신 나라들의 규례를 따르고, 이스라엘 왕들이 만들어 놓은 관례들을 따랐습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나라들의 관습을 따라 걸었다’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘주께서 이스라엘 자손 앞에서 쫓아내신’.
    reason: alternative_reading
  - marker: c
    text: ‘이스라엘 자손’은 곧 이스라엘 사람들입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: they walked
  chosen_korean: 따르고
  alternatives_korean:
  - 걸어갔습니다
  - 행하였습니다
  - 살았습니다
  lexicon: HALOT
  rationale: הלך의 윤리적·관습적 용법을 한국어에서는 ‘따르다’로 자연스럽게 살려, 단순 이동이 아니라 삶의 행태를 나타내는 비유를 반영했습니다.
- source_word: בְּחֻקּוֹת
  english_pob_choice: in the statutes
  chosen_korean: 규례를
  alternatives_korean:
  - 율례를
  - 법도를
  - 관습을
  lexicon: HALOT
  rationale: חֻקּוֹת는 정해진 규정이나 고정된 관행을 가리키므로, 본문이 비판하는 이교적 삶의 틀을 드러내는 ‘규례’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  - 하나님
  lexicon: DOCTRINE.md contested terms
  rationale: 원문이 신명기적 역사서의 언약명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: הוֹרִישׁ ... מִפְּנֵי
  english_pob_choice: had dispossessed before
  chosen_korean: 앞에서 쫓아내신
  alternatives_korean:
  - 전에서 몰아내신
  - 앞에서 내쫓으신
  - 점유를 빼앗아 내신
  lexicon: HALOT
  rationale: הוֹרִישׁ는 단순한 ‘보냄’이 아니라 땅에서 몰아내고 자리를 빼앗는 뜻이므로, מִפְּנֵי의 ‘앞에서’와 함께 ‘쫓아내신’으로 옮겨 공간적·역사적 긴장을 살렸습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘 사람들
  - 이스라엘 백성
  lexicon: HALOT
  rationale: 히브리어의 직역형을 유지하되, 한국어에서 관용적이고도 원문의 혈통·언약적 표지를 살리는 ‘이스라엘 자손’으로 옮겼습니다.
- source_word: וּמַלְכֵי יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  english_pob_choice: and in the practices that the kings of Israel had introduced
  chosen_korean: 이스라엘 왕들이 만들어 놓은 관례들
  alternatives_korean:
  - 이스라엘 왕들이 행한 것들
  - 이스라엘 왕들이 한 일들
  - 이스라엘 왕들이 도입한 관행들
  lexicon: HALOT
  rationale: 히브리어는 뒤에 목적어가 생략된 압축 표현이므로, 왕들의 새 제도·관행을 가리키는 문맥을 살려 ‘만들어 놓은 관례들’로 자연화했습니다.
theological_decisions:
- issue: 원문이 야훼께서 가나안 민족을 이스라엘 앞에서 몰아내신 행위를 어떻게 제시하는가
  chosen_reading: 하나님이 그 민족들을 심판과 언약 성취의 차원에서 ‘쫓아내신’ 것으로, 이스라엘의 불순종이 그 대체를 무효화하지는 않지만 오히려 더욱 부각되는 구조로 읽었습니다.
  alternative_readings:
  - 단순한 역사적 이주/정복 진술
  - 이스라엘의 소유권 주장만을 강조하는 읽기
  rationale: 본문은 단순한 군사사보다 야훼의 주권적 조치와 이스라엘의 배신을 대조합니다. 따라서 공간 이동보다 언약적·심판적 의미가 드러나도록 옮겼습니다.
  doctrine_reference: 신명기적 역사서의 언약 신학
- issue: ‘이스라엘 왕들이 만들어 놓은 관례들’의 윤리적 평가
  chosen_reading: 왕권의 제도화가 아니라, 우상숭배와 혼합주의를 포함한 잘못된 관행의 도입으로 이해했습니다.
  alternative_readings:
  - 중립적인 행정 제도
  - 문화적 적응의 사례
  rationale: 문맥상 앞의 ‘나라들의 규례’와 병행되는 부정적 평가이므로, 왕들의 행위를 중립적으로 완화하지 않고 부정적 함의를 유지했습니다.
  doctrine_reference: 열왕기서의 신앙적 평가 구조
