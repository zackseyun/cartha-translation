  text: גַּם יְהוּדָ֕ה לֹ֣א שָׁמַ֔ר אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם וַ/יֵּ֣לְכ֔וּ בְּ/חֻקּ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר עָשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/019.yaml
  text: Even Judah did not keep the commandments of Yahweh their God[b][a], but walked in the statutes that Israel had made.
  footnotes:
  - marker: a
    text: Or 'also Judah'; the opening particle emphasizes that Judah, like Israel, was likewise guilty.
    reason: lexical_alternative
  - marker: b
    text: Or 'walked according to the statutes of Israel' or 'followed the customs that Israel had made.'
    reason: alternative_reading
translation:
  language: ko
  text: 유다도[a] 그들의 하나님 야훼의 계명들을 지키지 않았으며, 이스라엘이 만든 규례들을 따랐습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문두의 גַּם은 ‘또한’ 또는 ‘역시’라는 뜻이며, 여기서는 이스라엘과 마찬가지로 유다도 죄가 있었다는 강조를 나타냅니다. ‘심지어 유다도’로 옮길 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그들이 만든 이스라엘의 규례들’로도 읽을 수 있습니다. ‘그들’은 이스라엘을 집합적으로 가리킬 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  english_pob_choice: Even
  chosen_korean: 심지어
  alternatives_korean:
  - 또한
  - 심지어도
  lexicon: HALOT
  rationale: 문두의 גַּם이 앞선 이스라엘의 죄책에 유다도 예외가 아니었음을 강조하므로, 평서적 '또한'보다 강조가 살아 있는 '심지어'가 더 적절합니다.
- source_word: שָׁמַר אֶת מִצְוֺת
  english_pob_choice: keep the commandments
  chosen_korean: 명령을 지키지 않았고
  alternatives_korean:
  - 계명을 지키지 않았고
  - 명령들을 준수하지 않았고
  lexicon: HALOT
  rationale: שׁמר는 언약적 문맥에서 '지키다'가 자연스럽고, מִצְוֺת는 단수로 풀어도 무방하지만 한국어에서는 하나의 집합적 대상을 '명령'으로 옮기면 간결합니다.
- source_word: יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: Yahweh their God
  chosen_korean: 야훼, 그들의 하나님이신 분
  alternatives_korean:
  - 야훼 그들의 하나님
  - 야훼, 그들의 하나님
  lexicon: HALOT
  rationale: 고유명사 יְהוָה는 본 프로젝트 기본어인 '야훼'로 옮기고, אֱלֹהֵיהֶם은 소유격을 살려 '그들의 하나님'으로 번역하되, 한국어 조사만으로는 관계가 약해질 수 있어 보조적으로 '이신 분'을 더했습니다.
- source_word: בְּחֻקּוֹת יִשְׂרָאֵל אֲשֶׁר עָשׂוּ
  english_pob_choice: in the statutes that Israel had made
  chosen_korean: 이스라엘이 만든 규례들을 따라 걸었습니다
  alternatives_korean:
  - 이스라엘의 규례들 안에서 걸었습니다
  - 이스라엘이 만든 율례들을 따라 걸었습니다
  lexicon: HALOT
  rationale: בְּ + חֻקּוֹת는 문자적으로 '규례들 안에서/에 따라'의 뜻이 가능하므로, 관계대명사절의 '만든'을 살리고 행동 패턴을 자연스럽게 드러내기 위해 '…을 따라 걸었습니다'로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문이 신명기를 직접적으로 언급하는 언약 문맥이므로, 전통적 대체칭호보다 고유신명인 '야훼'를 유지하는 것이 원문과 번역 철학에 더 충실합니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 이스라엘의 규례들에 대한 동사 처리
  chosen_reading: 이스라엘이 만든 규례들을 따라 걸었습니다
  alternative_readings:
  - 이스라엘의 규례들 안에서 걸었습니다
  - 이스라엘이 만든 규례들 가운데 걸었습니다
  rationale: 히브리어 הלך + ב 구조는 단순한 이동이 아니라 삶의 방식과 행위를 뜻하므로, 이를 '따라 걸었습니다'로 옮겨 죄책의 윤리적 성격을 분명히 했습니다.
  doctrine_reference: 원문 문법/관용구(הלך בְּ)
