revisions:
- from: 심지어 유다도 야훼, 그들의 하나님이신 분의 명령을 지키지 않았고, 이스라엘이 만든 규례들을 따라 걸었습니다.[a][b]
  to: 유다도[a] 그들의 하나님 야훼의 계명들을 지키지 않았으며, 이스라엘이 만든 규례들을 따랐습니다.[b]
  rationale: The revision preserves the source's contrast and its contextual identification of Israel as the maker of the statutes, while retaining the plural ‘commandments,’ using idiomatic formal Korean, and qualifying the two points where the Hebrew allows lexical or referential variation.
