translation:
  language: ko
  text: 그러므로 사마리아에서 끌려가던 제사장들 가운데 한 사람이 와서 벧엘에 살며, 그들에게 야훼를 어떻게 두려워해야 하는지를 가르쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 שם יהוה(YHWH)는 전통적으로 ‘주’로 옮기기도 하지만, 여기서는 신명 자체를 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: ot_citation
lexical_decisions:
- source_word: וַיָּבֹא
