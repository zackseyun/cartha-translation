  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겨 본문에서 고유성을 보존했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문의 야훼는 신약의 주(主) 일반칭이 아니라 언약적 고유명으로 처리했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 직접 신명 야훼를 사용하므로, 이를 일반 호칭으로 희석하지 않고 고유명으로 드러내는 것이 원문 의미를 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
