base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/028.yaml
  text: Then one of the priests whom they had exiled from Samaria came and lived in Bethel[a], and he taught them how they should fear Yahweh.
  footnotes:
  - marker: a
    text: 'Hebrew: ''YHWH'' (the divine name), traditionally rendered ''the LORD''; alternatively ''Yahweh.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그때 사마리아에서 유배된 제사장들 가운데 한 사람이 와서 벧엘에 살면서, 그들에게 야훼를 어떻게 경외해야 하는지를 가르쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 יהוה(YHWH)는 전통적으로 ‘주’로 옮기기도 하지만, 여기서는 신명 자체를 드러내기 위해 ‘야훼’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: Then ... came
  chosen_korean: 와서
  alternatives_korean:
  - 그리고 왔습니다
  - 그때 와서
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 이어 주는 와서로 옮겨 히브리어 연속 동작을 살렸습니다.
- source_word: אֶחָד מֵהַכֹּהֲנִים
  english_pob_choice: one of the priests
  chosen_korean: 제사장들 가운데 한 사람
  alternatives_korean:
  - 제사장들 중 하나
  - 제사장 가운데 한 사람
  lexicon: HALOT
  rationale: ‘one of the priests’의 집합 중 개체 선택을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: הִגְלוּ מִשֹּׁמְרוֹן
  english_pob_choice: whom they had exiled from Samaria
  chosen_korean: 사마리아에서 끌려가던
  alternatives_korean:
  - 사마리아에서 추방한
  - 사마리아에서 포로로 끌어간
  lexicon: HALOT
  rationale: גלה의 강제 이주/유배 의미를 살리되, 한국어에서는 문맥상 ‘끌려가다’가 가장 직접적이고 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 표준 용례 및 프로젝트 용어집
  rationale: 프로젝트 기본 용례에 따라 신명은 ‘야훼’로 옮겨 본문에서 고유성을 보존했습니다.
theological_decisions:
- issue: יְהוָה의 표기
  chosen_reading: 본문의 야훼는 신약의 주(主) 일반칭이 아니라 언약적 고유명으로 처리했습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 히브리어 본문이 직접 신명 야훼를 사용하므로, 이를 일반 호칭으로 희석하지 않고 고유명으로 드러내는 것이 원문 의미를 더 정확히 반영합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
