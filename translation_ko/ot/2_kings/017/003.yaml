base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/003.yaml
  text: Shalmaneser king of Assyria came up against him[a], and Hoshea became his servant and paid him tribute.
  footnotes:
  - marker: a
    text: Or 'became his vassal.' The Hebrew literally says 'became his servant,' using political subordination language.
    reason: lexical_alternative
translation:
  language: ko
  text: 앗시리아 왕 살만에셀이 그에게로 올라왔고, 호세아는 그의 종이 되어 그에게 조공을 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘종’은 개인적 노예가 아니라 정치적 예속 관계를 가리키는 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה עָלָיו
  english_pob_choice: came up against him
  chosen_korean: 그에게로 올라왔고
  alternatives_korean:
  - 그에게 맞서 올라왔고
  - 그를 공격했고
  - 그에게 진군했고
  lexicon: HALOT
  rationale: 전쟁 문맥의 עָלָה עַל은 상대를 향해 올라오는 군사적 접근을 뜻하므로, 히브리어 관용을 살리면서도 자연스러운 한국어로 옮겼습니다.
- source_word: מֶלֶךְ אַשּׁוּר
  english_pob_choice: king of Assyria
  chosen_korean: 앗시리아 왕
  alternatives_korean:
  - 앗시리아의 왕
  - 앗수르 왕
  lexicon: HALOT
  rationale: שר/מֶלֶךְ 구조는 직함+영역 표지이므로 간결한 ‘앗시리아 왕’으로 처리했으며, 고유명사는 현대 표기 관행에 맞춰 음역했습니다.
- source_word: עֶבֶד
  english_pob_choice: became his servant
  chosen_korean: 그의 종이 되어
  alternatives_korean:
  - 그의 노예가 되어
  - 그의 봉신이 되어
  - 그의 신하가 되어
  lexicon: HALOT
  rationale: 히브리어는 정치적 예속 관계를 가리키는 ‘종’이 직역이며, POB의 영어 선택처럼 ‘노예’보다 국제정치적 종속을 덜 오해하게 합니다.
- source_word: מִנְחָה
  english_pob_choice: paid him tribute
  chosen_korean: 그에게 조공을 바쳤습니다
  alternatives_korean:
  - 그에게 조세를 냈습니다
  - 그에게 공물을 바쳤습니다
  - 그에게 예물을 보냈습니다
  lexicon: HALOT
  rationale: 문맥상 מִנְחָה는 왕에게 바치는 예물이 아니라 속국이 내는 조공이므로, 정치적 의미가 분명한 ‘조공’으로 옮겼습니다.
theological_decisions:
- issue: 앗시리아에 대한 호세아의 관계를 단순한 개인 종살이로 오해하지 않게 하는 번역
  chosen_reading: ‘그의 종’은 개인적 노예화가 아니라 속국 왕의 정치적 예속 상태를 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘그의 노예’로 옮김
  - ‘그의 봉신’으로 기술적 표현 사용
  rationale: 본문 자체가 열국 사이의 조공 관계를 말하므로, 신학적·역사적 긴장을 보존하면서도 한국어 독자가 통치 종속 관계로 이해하도록 했습니다.
  doctrine_reference: 열왕기하 17장 문맥의 제국-속국 관계
- issue: 가시적 군사 행동과 속국화가 한 절에 함께 제시됨
  chosen_reading: ‘올라왔고’와 ‘조공을 바쳤습니다’의 병렬로 침공과 종속을 모두 드러냈습니다.
  alternative_readings:
  - 전투를 암시하는 표현으로 통합
  - 조공 관계만 강조
  rationale: 히브리어 동사 배열이 군사적 접근과 정치적 복속을 단계적으로 보여 주므로, 두 요소를 분리해 보존했습니다.
  doctrine_reference: 서술 문맥의 역사적 진행
