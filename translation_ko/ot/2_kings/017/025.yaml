base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
  footnotes:
  - marker: a
    text: Or 'they did not revere the LORD.' The Hebrew 'fear' includes reverence and covenantal regard, not merely terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그곳에 거주하기 시작할 때, 그들은 야훼를 두려워하지 않았습니다.[a] 그래서 야훼께서 그들 가운데 사자들을 보내셨고, 사자들은 그들 중 몇 사람을 죽이고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워하다’에는 단순한 공포뿐 아니라 경외와 언약적 존중도 포함됩니다.
    reason: lexical_alternative
