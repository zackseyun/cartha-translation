base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/025.yaml
  text: And it happened[a], at the beginning of their dwelling there, that they did not fear Yahweh; so Yahweh sent lions among them, and they were killing some of them.
  footnotes:
  - marker: a
    text: Or 'they did not revere the LORD.' The Hebrew 'fear' includes reverence and covenantal regard, not merely terror.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 거기에 거주하기 시작할 무렵에는 야훼를 두려워하지 않았습니다. 그래서 야훼께서 그들 가운데 사자들을 보내셨고, 사자들은 그들 가운데 몇 사람을 죽이고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두려워하다’에는 단순한 공포뿐 아니라 경외와 언약적 존중도 포함됩니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתְחִלַּת שִׁבְתָּם
  english_pob_choice: at the beginning of their dwelling
  chosen_korean: 거주하기 시작할 무렵
  alternatives_korean:
  - 처음 거주할 때
  - 거주를 시작할 때
  lexicon: HALOT
  rationale: 시작 시점을 분명히 하되, ‘거주’로 정착·체류의 뉘앙스를 살려 자연스러운 문장으로 옮겼습니다.
- source_word: יָרְאוּ אֶת יְהוָה
  english_pob_choice: did not fear Yahweh
  chosen_korean: 야훼를 두려워하지 않았습니다
  alternatives_korean:
  - 야훼를 경외하지 않았습니다
  - 야훼를 공경하지 않았습니다
  lexicon: HALOT
  rationale: hebraic fear에는 경외가 포함되지만, 본문이 직접 쓰는 ‘두려워하다’를 보존해 source-direct한 표현을 유지했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms
  rationale: 본문의 신명기식 이름을 제목어로 대치하지 않고, 프로젝트 기본값에 따라 고유명 ‘야훼’로 옮겼습니다.
- source_word: הָאֲרָיוֹת ... הֹרְגִים בָּהֶם
  english_pob_choice: lions ... were killing some of them
  chosen_korean: 사자들을 보내셨고, 사자들은 그들 가운데 몇 사람을 죽이고 있었습니다
  alternatives_korean:
  - 사자들을 보내셨고, 사자들은 그들 중 몇 사람을 죽였습니다
  - 사자들을 보내셨고, 사자들은 그들 가운데 사람들을 죽이고 있었습니다
  lexicon: HALOT
  rationale: 동사 ‘죽이고 있었습니다’로 진행·반복적 진행상을 살리고, בָּהֶם은 ‘그들 가운데’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 야훼의 심판적 행위로서 사자 파견
  chosen_reading: 본문의 인과를 유지해, 야훼를 두려워하지 않자 야훼께서 사자들을 보내신 것으로 직역에 가깝게 반영했습니다.
  alternative_readings:
  - 사자들이 들판에 나타나 사람들을 해쳤습니다
  - 야훼께서 사자들을 풀어 그들을 벌하셨습니다
  rationale: 히브리어는 단순한 자연재해가 아니라 야훼의 능동적 개입으로 제시하므로, 그 신학적 원인을 흐리지 않았습니다.
  doctrine_reference: Providence and judgment in the narrative theology of Kings
