theological_decisions:
- issue: 야훼의 심판적 행위로서 사자 파견
  chosen_reading: 본문의 인과를 유지해, 야훼를 두려워하지 않자 야훼께서 사자들을 보내신 것으로 직역에 가깝게 반영했습니다.
  alternative_readings:
  - 사자들이 들판에 나타나 사람들을 해쳤습니다
  - 야훼께서 사자들을 풀어 그들을 벌하셨습니다
  rationale: 히브리어는 단순한 자연재해가 아니라 야훼의 능동적 개입으로 제시하므로, 그 신학적 원인을 흐리지 않았습니다.
  doctrine_reference: Providence and judgment in the narrative theology of Kings
