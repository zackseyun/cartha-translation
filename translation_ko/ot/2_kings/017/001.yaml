  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: בִּ/שְׁנַת֙ שְׁתֵּ֣ים עֶשְׂרֵ֔ה לְ/אָחָ֖ז מֶ֣לֶךְ יְהוּדָ֑ה מָ֠לַךְ הוֹשֵׁ֨עַ בֶּן אֵלָ֧ה בְ/שֹׁמְר֛וֹן עַל יִשְׂרָאֵ֖ל תֵּ֥שַׁע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/001.yaml
  text: In the twelfth year of Ahaz king of Judah, Hoshea son of Elah began to reign in Samaria over Israel, and he reigned nine years.
translation:
  language: ko
  text: 아하스 왕의 열두째 해에 엘라의 아들 호세아가 사마리아에서 이스라엘을 다스리기 시작했으며, 그가 아홉 해 동안 다스렸습니다.
  philosophy: formal
lexical_decisions:
- source_word: מָלַךְ
  english_pob_choice: began to reign
  chosen_korean: 다스리기 시작했으며
  alternatives_korean:
  - 왕이 되었습니다
  - 통치하기 시작했으며
  - 즉위했습니다
  lexicon: מָלַךְ
  rationale: POB의 ‘began to reign’을 따라 단순한 ‘왕이 되다’보다 통치의 개시를 분명히 하되, 본문의 서술형 역사체에 맞게 자연스럽게 옮겼습니다.
- source_word: בְּשֹׁמְרוֹן
  english_pob_choice: in Samaria
  chosen_korean: 사마리아에서
  alternatives_korean:
  - 사마리아 안에서
  - 사마리아에
  lexicon: שֹׁמְרוֹן
  rationale: 지명 전치사는 한국어 역사 서술에서 가장 자연스러운 ‘에서’로 옮겼고, 본문은 통치 거점의 위치를 말합니다.
- source_word: עַל יִשְׂרָאֵל
  english_pob_choice: over Israel
  chosen_korean: 이스라엘을
  alternatives_korean:
  - 이스라엘 위에
  - 이스라엘 위에서
  lexicon: עַל
  rationale: 왕권 행사 대상이라는 의미를 살려 ‘~을 다스리다’ 구조로 반영했습니다. 직역형 ‘위에’는 한국어에서 의미가 부자연스럽습니다.
theological_decisions:
- issue: 왕권 서술의 관용적 표현과 본문 직역의 균형
  chosen_reading: ‘다스리기 시작했습니다’로 옮겨 왕권 개시를 분명히 하되, 본문의 역사 기록체를 유지했습니다.
  alternative_readings:
  - ‘왕이 되었습니다’
  - ‘통치하기 시작했습니다’
  rationale: 이 구절은 신학적 해석보다 왕의 즉위/통치 개시를 기록하는 역사 서술이므로, 의미를 확장하지 않고 원문이 말하는 사실만 전달했습니다.
  doctrine_reference: 역사서 서술의 사실 전달 원칙
