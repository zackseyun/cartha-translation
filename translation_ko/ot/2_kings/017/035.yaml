  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּכְרֹ֨ת יְהוָ֤ה אִתָּ/ם֙ בְּרִ֔ית וַ/יְצַוֵּ֣/ם לֵ/אמֹ֔ר לֹ֥א תִֽירְא֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/לֹא תִשְׁתַּחֲו֣וּ לָ/הֶ֔ם וְ/לֹ֣א תַעַבְד֔וּ/ם וְ/לֹ֥א תִזְבְּח֖וּ לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/035.yaml
  text: And Yahweh made a covenant with them and commanded them, saying, “You shall not fear other gods, and you shall not bow down to them, or serve them, or sacrifice to them.”
translation:
  language: ko
  text: 야훼께서 그들과 언약을 맺으시고 명령하시며 말씀하셨습니다. “너희는 다른 신들을 두려워해서는 안 되고, 그들에게 엎드려 절해서도 안 되며, 그들을 섬겨서도 안 되고, 그들에게 제사를 드려서도 안 됩니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 히브리어 고유명사 יְהוָה를 제목적 표현인 ‘주’로 바꾸지 않고, POB의 본문 방침에 따라 음역 ‘야훼’로 옮겨 언약의 개인적 이름을 보존했습니다.
- source_word: כָּרַת בְּרִית / וַיִּכְרֹת
  english_pob_choice: made a covenant
  chosen_korean: 언약을 맺으시고
  alternatives_korean:
  - 언약을 세우시고
  - 언약을 끊으시고
  lexicon: HALOT
  rationale: כרת ברית의 관용적 의미는 ‘언약을 맺다’이므로, 직역적이지만 덜 자연스러운 ‘끊다’는 피하고 한국어에서 공적인 언약 수립을 나타내는 표현으로 옮겼습니다.
- source_word: תִירְאוּ / לֹא תִירְאוּ
  english_pob_choice: You shall not fear
  chosen_korean: 두려워해서는 안 되고
  alternatives_korean:
  - 두려워하지 말고
  - 경외해서는 안 되고
  lexicon: HALOT
  rationale: 여기서의 금지는 제사 행위들과 구별되는 ‘두려움’ 자체를 가리키므로, 숭배 의미로 미리 좁히지 않고 ‘두려워하다’로 유지했습니다.
- source_word: תִשְׁתַּחֲווּ
  english_pob_choice: bow down
  chosen_korean: 엎드려 절해서도 안 되며
  alternatives_korean:
  - 엎드려 절해서는 안 되며
  - 절해서도 안 되며
  - 엎드려 경배해서도 안 되며
  lexicon: HALOT
  rationale: 동사의 핵심은 몸을 굽혀 엎드리는 행위이므로, 단순한 ‘경배하다’보다 물리적 동작을 드러내는 ‘엎드려 절하다’로 옮겼습니다.
- source_word: תַעַבְדוּם
  english_pob_choice: serve them
  chosen_korean: 섬겨서도 안 되고
  alternatives_korean:
  - 봉사해서도 안 되고
  - 예배해서도 안 되고
  lexicon: HALOT
  rationale: עבד는 종교적 맥락에서 넓게 ‘섬기다/예배하다’를 뜻할 수 있으나, 앞뒤의 금지와 구분을 위해 기본 의미인 ‘섬기다’를 유지했습니다.
- source_word: תִזְבְּחוּ לָהֶם
  english_pob_choice: sacrifice to them
  chosen_korean: 그들에게 제사를 드려서도 안 됩니다
  alternatives_korean:
  - 그들에게 희생 제물을 바쳐서도 안 됩니다
  - 그들에게 제사해서도 안 됩니다
  lexicon: HALOT
  rationale: זבח은 제의적 희생을 가리키므로, 한국어 성서 문맥에서 가장 분명한 ‘제사를 드리다’로 옮겼습니다.
theological_decisions:
- issue: 두려움과 예배 행위의 구분
  chosen_reading: ‘두려워하다’, ‘엎드려 절하다’, ‘섬기다’, ‘제사를 드리다’를 분리하여 각각 번역했습니다.
  alternative_readings:
  - ‘두려워하다’를 ‘예배하다’로 넓혀 번역
  - 네 동사를 모두 ‘경배하다’ 계열로 통일
  rationale: 히브리어 본문은 금지 항목을 누적적으로 나열하며 의미를 구분합니다. 이를 한 단어로 흡수하면 원문의 경고 강도와 범주 구분이 약해집니다.
  doctrine_reference: '번역 원칙: 원문 의미와 신학적 긴장 보존'
