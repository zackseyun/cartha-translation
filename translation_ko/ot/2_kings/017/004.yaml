  text: וַ/יִּמְצָא֩ מֶֽלֶךְ אַשּׁ֨וּר בְּ/הוֹשֵׁ֜עַ קֶ֗שֶׁר אֲשֶׁ֨ר שָׁלַ֤ח מַלְאָכִים֙ אֶל ס֣וֹא מֶֽלֶךְ מִצְרַ֔יִם וְ/לֹא הֶעֱלָ֥ה מִנְחָ֛ה לְ/מֶ֥לֶךְ אַשּׁ֖וּר כְּ/שָׁנָ֣ה בְ/שָׁנָ֑ה וַֽ/יַּעַצְרֵ֨/הוּ֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּאַסְרֵ֖/הוּ בֵּ֥ית כֶּֽלֶא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/004.yaml
  text: Then the king of Assyria discovered a conspiracy in Hoshea[a], because he had sent messengers to So king of Egypt and had not sent up tribute to the king of Assyria, as year by year[d][c][b]. So the king of Assyria confined him and bound him in prison.
  footnotes:
  - marker: a
    text: Or 'found treason in Hoshea.' The Hebrew says literally 'found conspiracy in Hoshea,' an idiom for detecting disloyal plotting in him.
    reason: lexical_alternative
  - marker: b
    text: '''So'' is a transliteration of the Hebrew name. The historical identity of this Egyptian king is uncertain.'
    reason: cultural_note
  - marker: c
    text: Or 'had not brought up tribute' or more dynamically 'had not paid tribute.'
    reason: lexical_alternative
  - marker: d
    text: 'The Hebrew distinguishes two actions: the king of Assyria first detained or confined Hoshea, then bound him in prison.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 앗수르 왕은 호세아에게서 반역을 발견했습니다. 곧 그가 이집트 왕 소에게 사신들을 보냈고, 앗수르 왕에게 해마다 바쳐야 할 조공을 올리지 않았기 때문입니다. 그래서 앗수르 왕은 그를 붙잡아 감옥에 가두었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소’는 히브리어 고유명사를 옮긴 것입니다. 이 이집트 왕의 역사적 동일시는 확정되지 않았습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어는 조공을 ‘올리다’라고 표현합니다. 한국어에서는 관용을 살려 ‘올리지 않았습니다’로 옮겼습니다.
    reason: source_note
  - marker: c
    text: 원문은 해마다 반복되는 의무를 말합니다.
    reason: source_note
lexical_decisions:
- source_word: וַיִּמְצָא ... קֶשֶׁר
  english_pob_choice: discovered a conspiracy
  chosen_korean: 반역을 발견했습니다
  alternatives_korean:
  - 음모를 발견했습니다
  - 반역 음모를 알아냈습니다
  lexicon: HALOT
  rationale: 문맥상 단순한 ‘찾음’이 아니라 숨은 정치적 배신을 드러내는 표현이므로, 한국어에서는 자연스럽게 ‘반역을 발견했습니다’로 옮겨 군사·정치적 뉘앙스를 살렸습니다.
- source_word: בְּהוֹשֵׁעַ
  english_pob_choice: in Hoshea
  chosen_korean: 호세아에게서
  alternatives_korean:
  - 호세아 안에서
  - 호세아에게서 드러났습니다
  lexicon: HALOT
  rationale: 히브리어 관용구는 인물 안에서 드러난 불충을 뜻하므로, 한국어에서는 ‘호세아에게서’로 처리해 행위의 소재를 자연스럽게 나타냈습니다.
- source_word: מַלְאָכִים
  english_pob_choice: messengers
  chosen_korean: 사신들
  alternatives_korean:
  - 사자들
  - 전령들
  lexicon: HALOT
  rationale: 외교적 문맥에서 단순한 전달자보다 국가 간 접촉을 나타내는 ‘사신들’이 더 정확합니다.
- source_word: מִנְחָה
  english_pob_choice: tribute
  chosen_korean: 조공
  alternatives_korean:
  - 공물
  - 예물
  lexicon: HALOT
  rationale: 앗수르에 대한 속국적 의무를 가리키므로 일반적 ‘선물’보다 정치·제국 관계를 드러내는 ‘조공’이 적절합니다.
- source_word: הֶעֱלָה
  english_pob_choice: had not sent up
  chosen_korean: 올리지 않았습니다
  alternatives_korean:
  - 바치지 않았습니다
  - 보내지 않았습니다
  lexicon: HALOT
  rationale: ‘위로 올리다’라는 히브리어 관용을 살리면서도, 조공 문맥에서 한국어로는 ‘올리지 않았습니다’가 가장 투명합니다.
theological_decisions:
- issue: 앗수르 왕의 행동을 나타내는 두 동사(붙잡다/가두다)의 구분
  chosen_reading: 그를 붙잡아 감옥에 가두었습니다
  alternative_readings:
  - 그를 가두고 묶었습니다
  - 그를 체포해 감옥에 넣었습니다
  rationale: 원문은 먼저 억류/구금을, შემდეგ 감금의 순서를 구분하므로 한국어에서도 두 동작을 함께 살려 서술했습니다.
  doctrine_reference: source-text sequencing
