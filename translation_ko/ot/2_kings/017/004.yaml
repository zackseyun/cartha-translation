revisions:
- from: 그때 앗수르 왕은 호세아에게서 반역을 발견했습니다. 곧 그가 이집트 왕 소에게 사신들을 보냈고, 앗수르 왕에게 해마다 바쳐야 할 조공을 올리지 않았기 때문입니다. 그래서 앗수르 왕은 그를 붙잡아 감옥에 가두었습니다.[a][b][c]
  to: 그때 앗수르 왕은 호세아의 반역 음모를 알아냈습니다. 이는 호세아가 이집트 왕 소[a]에게 사신들을 보내고, 앗수르 왕에게 조공을 올리지 않았기[b] 때문입니다. 그는 해마다[c] 그렇게 하던 것과 달리 그렇게 했습니다. 그래서 앗수르 왕은 그를 구금한 뒤 감옥에 가두었습니다.[d]
  rationale: 원문의 정치적 음모, 조공을 매년 올리던 관행의 중단, 그리고 구금과 감옥에서의 결박이라는 연속된 조치를 보존하도록 고쳤습니다. ‘해야 할’처럼 원문에 명시되지 않은 당위는 제거했으며, 한국어 본문에서는 자연스러운 표현을 사용하고 둘째 동사의 직역적 결박 의미는 주석으로 보완했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:57:35Z'
