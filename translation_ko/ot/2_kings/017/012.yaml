theological_decisions:
- issue: 우상 숭배에 대한 신적 금지의 시제 관계
  chosen_reading: ‘그 우상들을 섬겼습니다’와 ‘야훼께서…말씀하셨습니다’ 사이의 대조를 통해, 이미 주어진 금지가 뒤늦은 불순종보다 앞선다는 구조를 살렸습니다.
  alternative_readings:
  - 단순 현재적 진술로 평탄화
  - 금지문을 일반적 도덕진술로 완화
  rationale: 히브리어는 서술 동작과 그 이전의 말씀을 대조하므로, 이 시간적·언약적 긴장을 한국어에서도 유지하는 것이 본문의 핵심입니다.
  doctrine_reference: 본문의 언약적 불순종 구조
- issue: 하나님의 직접 화법의 높임말
  chosen_reading: 하나님께 대한 직접 인용부는 합쇼체 명령형을 유지했습니다.
  alternative_readings:
  - 평서문으로 완화
  - 더 아치익한 성경체
  rationale: 본문의 명령 강도를 보존하면서도 현대 표준어 독자에게 자연스럽게 들리도록 했습니다.
