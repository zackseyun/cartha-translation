  text: וַ/יִּהְי֣וּ הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֶת פְּסִֽילֵי/הֶ֖ם הָי֣וּ עֹֽבְדִ֑ים גַּם בְּנֵי/הֶ֣ם וּ/בְנֵ֣י בְנֵי/הֶ֗ם כַּ/אֲשֶׁ֨ר עָשׂ֤וּ אֲבֹתָ/ם֙ הֵ֣ם עֹשִׂ֔ים עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה׀־־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/041.yaml
  text: So these nations feared Yahweh[a], yet they were serving their carved images. Their children also, and their children's children—as their fathers did, so they are doing to this day.
  footnotes:
  - marker: a
    text: Or 'their idols' for 'their carved images.' The Hebrew specifically refers to images made by carving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 이 여러 민족은 야훼를 두려워하면서도 자신들의 새긴 형상들을 섬기고 있었습니다. 그들의 자녀들도, 그 자녀의 자녀들도 그들의 조상들이 행한 것처럼 오늘날까지 그렇게 하고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새긴 형상들’은 히브리어 פְּסִילִים의 문자적 의미를 반영한 표현입니다. ‘우상들’로 옮길 수도 있지만, 여기서는 새김으로 만든 형상이라는 점을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרֵאִים אֶת יְהוָה
  english_pob_choice: feared Yahweh
  chosen_korean: 야훼를 두려워하면서도
  alternatives_korean:
  - 야훼를 경외하면서도
  - 야훼를 두려워하였으나
  lexicon: HALOT
  rationale: יָרֵא + 목적어는 신앙적 ‘두려움/경외’의 관용구이므로, POB의 ‘feared Yahweh’를 따라 ‘두려워하다’ 계열로 옮기되 뒤의 우상 숭배와의 긴장을 살렸습니다.
- source_word: פְּסִילֵיהֶם
  english_pob_choice: their carved images
  chosen_korean: 자신들의 새긴 우상들을
  alternatives_korean:
  - 자신들의 조각한 형상들을
  - 자신들의 우상들을
  lexicon: HALOT
  rationale: פְּסִילִים은 단순한 ‘우상’보다 조각·새김으로 만들어진 형상을 가리키므로, POB의 ‘carved images’를 반영해 ‘새긴 우상들’로 구체화했습니다.
- source_word: הָיוּ עֹבְדִים
  english_pob_choice: they were serving
  chosen_korean: 섬기고 있었습니다
  alternatives_korean:
  - 섬기고 있었습니다만
  - 예배하고 있었습니다
  lexicon: HALOT
  rationale: עָבַד는 여기서 지속적·관행적 종교 행위를 뜻하므로, 진행형 뉘앙스를 살려 ‘섬기고 있었습니다’로 옮겼습니다. ‘예배하다’는 의미를 너무 좁힐 수 있어 피했습니다.
- source_word: גַּם בְּנֵיהֶם וּבְנֵי בְנֵיהֶם
  english_pob_choice: Their children also, and their children's children
  chosen_korean: 그들의 자녀들도, 그리고 그들의 자녀의 자녀들도
  alternatives_korean:
  - 그들의 아들들도, 그리고 그들의 손자들도
  - 그들의 자손들도, 그리고 그들의 자손의 자손들도
  lexicon: HALOT
  rationale: 족보적 반복 구조를 오늘날 자연스러운 한국어로 풀어, 남성 중심의 ‘아들/손자’보다 포괄적인 ‘자녀’와 ‘자녀의 자녀’로 옮겼습니다.
- source_word: עַד הַיּוֹם הַזֶּה
  english_pob_choice: to this day
  chosen_korean: 오늘날까지
  alternatives_korean:
  - 이 날까지
  - 지금까지
  lexicon: HALOT
  rationale: 히브리어 관용구를 현대 한국어에서 가장 자연스럽게 받는 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼를 두려워함과 우상 섬김의 공존을 어떻게 드러낼지
  chosen_reading: ‘야훼를 두려워하면서도 … 섬기고 있었습니다’로 옮겨, 본문이 말하는 신앙적 긴장을 해소하지 않고 그대로 보존했습니다.
  alternative_readings:
  - 야훼를 두려워하고 또 우상들을 섬겼습니다
  - 야훼를 경외했지만 사실상 우상숭배였습니다
  rationale: 히브리어는 이들이 야훼를 두려워했다는 사실과 우상 섬김을 병치할 뿐, 그 경외가 진실했는지 외형적이었는지 판정하지 않습니다. 번역도 그 판단을 앞서지 않도록 했습니다.
  doctrine_reference: Translation philosophy §3 — 본문이 해소하지 않는 긴장은 해소하지 않는다.
