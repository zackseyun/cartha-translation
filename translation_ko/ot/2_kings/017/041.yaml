  to: 그러므로 이 여러 민족은 야훼를 두려워하면서도 자신들의 새긴 형상들을 섬기고 있었습니다. 그들의 자녀들도, 그 자녀의 자녀들도 그들의 조상들이 행한 것처럼 오늘날까지 그렇게 하고 있습니다.[a]
