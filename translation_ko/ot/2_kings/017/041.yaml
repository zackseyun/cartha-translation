  verdict: revise
  source_fidelity: 히브리어 본문은 이 민족들이 야훼를 두려워하는 동시에 자신들의 새긴 형상들을 섬겼으며, 그들의 자녀와 자녀의 자녀가 조상들의 행위를 따라 ‘오늘날까지’ 그렇게 한다고 말합니다. 초안은 핵심 의미를 대체로 충실히 옮겼으나, ‘자신들의 새긴 우상들’은 פְּסִילִים의 ‘새긴 형상’이라는 어휘적 의미에 ‘우상’이라는 해석적 명사를 중첩합니다. 또한 ‘그랬습니다’는 뒤의 비교·지속 구절을 미리 요약하여 원문의 연결을 다소 약화합니다.
  naturalness: 합쇼체는 일관되며 전반적으로 자연스럽습니다. 다만 ‘그들의 자녀의 자녀들’보다 ‘그 자녀의 자녀들’이 반복을 줄이면서도 자연스럽고, 한 문장 안에서 원문의 비교 구문을 유지하면 더 명료합니다.
  terminology: ‘야훼’, ‘두려워하다’, ‘섬기다’는 원문의 명칭과 종교적 긴장을 적절히 보존합니다. פְּסִילִים에는 ‘새긴 형상들’을 사용하여 조각된 형상이라는 의미를 직접적으로 나타내는 것이 더 적절합니다. 각주도 이에 맞추어 ‘우상들’을 대안으로 제시해야 합니다.
