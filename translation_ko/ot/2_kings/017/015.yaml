    rationale: עֵדוֹת는 ‘증거들/증언들’이며, 뒤따르는 동사가 경고의 기능을 나타냅니다. 대안은 ‘경고들’ 또는 ‘그들에게 하신 경고의 증언들’ 정도로 제한하는 편이 낫습니다.
