revisions:
- from: 그들은 그의 율례들과, 자기들의 조상들과 맺으신 그의 언약과, 그들에게 경고하신 그의 증거들을 버렸습니다. 그들은 헛것을 따라갔고 헛되게 되었습니다. 그리고 그들 주변에 있는 민족들을 따라갔습니다. 야훼께서는 그들에게 그것들을 본받아 행하지 말라고 명령하셨습니다.[a][b][c]
  to: 그들은 그의 율례들과 그가 자기들의 조상들과 맺으신 그의 언약과, 그들에게 경고하신 그의 증거들[c]을 버렸습니다. 그들은 헛것[a]을 따라가 헛되게 되었으며, 야훼께서 그들에게 그들처럼 행하지 말라고 명령하신 그들 주위의 민족들을 따라갔습니다[b].
  rationale: 마지막 절을 하나의 관계절로 재구성하여, 야훼께서 이스라엘에게 주변 민족들처럼 행하지 말라고 명령하셨다는 원문의 수식 관계를 보존했습니다. ‘그것들을’은 인칭 복수인 ‘그들’로 바로잡았고, 각주 표지를 해당 어휘와 표현에 옮겼습니다. 나머지 핵심 용어와 הֶבֶל의 말놀이 효과는 유지했습니다.
