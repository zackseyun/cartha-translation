base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/015.yaml
  text: They rejected his statutes and his covenant that he had made with their fathers[a], and his testimonies with which he had warned them. They went after vanity and became vain, and after the nations that were around them[c][b], concerning whom Yahweh had commanded them not to do like them.
  footnotes:
  - marker: a
    text: Hebrew 'vanity' can also mean 'emptiness,' 'worthlessness,' or, by implication in this context, 'idols.'
    reason: lexical_alternative
  - marker: b
    text: 'The Hebrew plays on related words: they ''went after vanity'' and ''became vain''—that is, empty or worthless like what they pursued.'
    reason: lexical_alternative
  - marker: c
    text: Or 'his testimonies that he had testified against them with' / 'his warnings with which he had warned them.'
    reason: alternative_reading
translation:
  language: ko
  text: 그들은 그의 율례들과, 자기들의 조상들과 맺으신 그의 언약과, 그들에게 경고하신 그의 증거들을 버렸습니다. 그들은 헛것을 따라갔고 헛되게 되었습니다. 그리고 그들 주변에 있는 민족들을 따라갔습니다. 야훼께서는 그들에게 그것들을 본받아 행하지 말라고 명령하셨습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘헛것’은 문맥상 ‘공허함, 무가치함’뿐 아니라 우상들을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그들처럼 행하지 말라’라는 뜻으로도 읽을 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: ‘증거들’은 여기서 ‘경고들’ 또는 ‘경고의 증거들’의 뉘앙스를 가질 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  english_pob_choice: They rejected
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 거절했습니다
  - 배척했습니다
  lexicon: HALOT
  rationale: 문맥상 언약적 규례와 증거를 단순히 마음에 들지 않아 한 것이 아니라 내팽개치고 버린 행위를 나타내므로, 현대 한국어에서 자연스럽고 강한 ‘버리다’로 옮겼습니다.
- source_word: חֻקָּיו
  english_pob_choice: his statutes
  chosen_korean: 그의 율례들
  alternatives_korean:
  - 그의 규례들
  - 그의 법도들
  lexicon: HALOT
  rationale: חֹק/חֻקִּים은 언약적·법적 규정을 가리키므로, 한국어 성서 어휘로 익숙한 ‘율례’가 가장 적절합니다.
- source_word: בְּרִיתוֹ
  english_pob_choice: his covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 조약
  lexicon: HALOT
  rationale: 하나님과 이스라엘의 관계를 가리키는 בְּרִית는 ‘언약’이 표준적이며, ‘계약’이나 ‘조약’은 신학적 울림을 약화시킵니다.
- source_word: הַהֶבֶל / וַיֶּהְבָּלוּ
  english_pob_choice: vanity / became vain
  chosen_korean: 헛것 / 헛되게 되었습니다
  alternatives_korean:
  - 허무 / 허무하게 되었습니다
  - 공허 / 공허하게 되었습니다
  lexicon: HALOT
  rationale: 의도된 말장난을 한국어에서 살리기 위해 동일 어근 계열의 ‘헛것’과 ‘헛되게 되다’를 사용했습니다. ‘우상들’로 풀면 본문이 가진 추상적·도덕적 비판과 반복 효과가 약해집니다.
- source_word: כָּהֶם
  english_pob_choice: like them
  chosen_korean: 그것들을 본받아
  alternatives_korean:
  - 그들처럼
  - 그들의 행위를 따라
  lexicon: HALOT
  rationale: 마지막 절은 주변 민족의 행위를 모방하지 말라는 뜻이므로, 자연스러운 한국어로 ‘본받아 행하지 말라’고 풀되, 원문의 모방 금지를 분명히 했습니다.
