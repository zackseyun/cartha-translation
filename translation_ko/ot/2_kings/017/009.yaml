- from: 이스라엘 자손이 자기들의 하나님 여호와께 대하여 옳지 않은 일들을 은밀히 행하였고, 또 자기들을 위해 모든 성읍에 산당들을 세웠습니다 — 망대에서부터 견고한 성읍에 이르기까지입니다.[a][b][c]
  to: 이스라엘 자손은 자기들의 하나님 여호와를 거슬러 옳지 않은 일들을 은밀히 행하였고, 파수 망대에서부터 견고한 성읍에 이르기까지 자기들을 위하여 자기들의 모든 성읍에 산당들을 세웠습니다.[a][b][c]
  rationale: 여호와와의 관계를 중립적인 ‘대하여’가 아니라 문맥에 맞는 ‘거슬러’로 바로잡고, לָהֶם를 ‘자기들을 위하여’로 반영했습니다. 산당 건립의 지리적 범위를 나타내는 수식어도 동사 앞에 배치해 원문의 범위를 보존하면서 자연스러운 한국어 문장으로 다듬었습니다. 각주 c는 관용적 포괄 표현을 설명하되 본문 이상의 지리적 세부를 단정하지 않도록 조정했습니다.
