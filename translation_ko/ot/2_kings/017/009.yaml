id: 2KI.17.9
reference: 2 Kings 17:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְחַפְּא֣וּ בְנֵֽי יִשְׂרָאֵ֗ל דְּבָרִים֙ אֲשֶׁ֣ר לֹא כֵ֔ן עַל יְהוָ֖ה אֱלֹהֵי/הֶ֑ם וַ/יִּבְנ֨וּ לָ/הֶ֤ם בָּמוֹת֙ בְּ/כָל עָ֣רֵי/הֶ֔ם מִ/מִּגְדַּ֥ל נוֹצְרִ֖ים עַד עִ֥יר מִבְצָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/009.yaml
  text: And the sons of Israel secretly did things that were not right against Yahweh their God[a], and they built for themselves high places in all their cities[c][b], from watchtower to fortified city.
  footnotes:
  - marker: a
    text: Or 'covered up matters that were not right concerning the LORD their God.' The Hebrew verb is rare and may carry the sense of concealing or acting secretly.
    reason: lexical_alternative
  - marker: b
    text: '''High places'' were local worship sites, often associated with unauthorized worship.'
    reason: cultural_note
  - marker: c
    text: From 'watchtower' to 'fortified city' is a way of saying throughout the whole land, from the smallest outpost to the strongest city.
    reason: cultural_note
translation:
  language: ko
  text: 이스라엘 자손은 자기들의 하나님 여호와를 거슬러 옳지 않은 일들을 은밀히 행하였고, 파수 망대에서부터 견고한 성읍에 이르기까지 자기들을 위하여 자기들의 모든 성읍에 산당들을 세웠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 희귀 동사 חפא는 여기서 ‘숨기다’ 또는 ‘몰래 하다’라는 뜻을 띨 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘산당’은 지방의 예배처를 가리키며, 흔히 승인되지 않은 예배와 관련됩니다.
    reason: cultural_note
  - marker: c
    text: ‘파수 망대에서부터 견고한 성읍에 이르기까지’는 가장 작은 감시 거점에서 가장 견고한 성읍까지, 모든 곳을 포괄한다는 뜻의 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְחַפְּאוּ
  english_pob_choice: secretly did
  chosen_korean: 은밀히 행하였고
  alternatives_korean:
  - 몰래 행하였고
  - 숨겨서 행하였고
  - 비밀리에 행하였고
  lexicon: HALOT
  rationale: 희귀 동사 חפא의 ‘숨기다/몰래 하다’ 뉘앙스를 살리면서, 한국어에서는 ‘은밀히 행하다’가 자연스럽고 문맥의 악행을 함께 드러냅니다.
- source_word: דְּבָרִים אֲשֶׁר לֹא כֵן
  english_pob_choice: things that were not right
  chosen_korean: 옳지 않은 일들
  alternatives_korean:
  - 옳지 않은 것들
  - 바르지 않은 일들
  - 마땅하지 않은 일들
  lexicon: HALOT
  rationale: 직역형 ‘그렇지 않은 것들’은 한국어에서 의미가 흐려지므로, 도덕적 평가를 유지하는 ‘옳지 않은 일들’로 옮겼습니다.
- source_word: עַל יְהוָה אֱלֹהֵיהֶם
  english_pob_choice: against Yahweh their God
  chosen_korean: 자기들의 하나님 여호와께 대하여
  alternatives_korean:
  - 자기들의 하나님 여호와를 거슬러
  - 자기들의 하나님 야훼를 향하여
  - 자기들의 하나님 여호와에 관하여
  lexicon: HALOT
  rationale: 히브리어 עַל은 여기서 단순한 ‘관하여’보다 대립·위반의 성격이 강하므로, 한국어에서는 직접적 대립을 다소 완화한 ‘대하여’로 옮겨 원문의 긴장을 유지했습니다.
- source_word: בָּמוֹת
  english_pob_choice: high places
  chosen_korean: 산당들
  alternatives_korean:
  - 고지 제단들
  - 높은 곳들
  - 산당
  lexicon: HALOT
  rationale: במות는 우상숭배와 결부된 예배 장소를 가리키는 고정된 성경 용어이므로, 한국어 교회 용례와 의미를 함께 살리는 ‘산당들’을 선택했습니다.
- source_word: מִמִּגְדַּל נוֹצְרִים עַד עִיר מִבְצָר
  english_pob_choice: from watchtower to fortified city
  chosen_korean: 망대에서부터 견고한 성읍에 이르기까지
  alternatives_korean:
  - 파수망대에서부터 요새 성읍에 이르기까지
  - 감시탑에서부터 요새 도시까지
  - 망대에서 견고한 성읍까지
  lexicon: HALOT
  rationale: 이 구절은 작은 변경지대에서 큰 성읍까지를 가리키는 포괄 표현이므로, 한국어에서는 범위를 드러내는 종결형 ‘…에 이르기까지’로 옮겼습니다.
theological_decisions:
- issue: ‘여호와’ 표기와 עַל의 관계성
  chosen_reading: 본문의 반역성을 분명히 하기 위해 ‘여호와께 대하여’로 옮기되, 하나님의 이름은 프로젝트 기본값에 따라 ‘여호와’로 표기했습니다.
  alternative_readings:
  - 여호와를 향하여
  - 여호와를 거슬러
  - 야훼께 대하여
  rationale: 히브리어의 대립적 뉘앙스를 살리면서도, 한국어 문맥에서 과도하게 해설적이거나 생경하지 않게 균형을 잡았습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
