  yaml_path: translation/ot/2_kings/017/040.yaml
  text: But they did not listen; instead[a], they kept acting according to their former custom.
  footnotes:
  - marker: a
    text: Or 'they kept doing according to their former ordinance/practice.' The Hebrew מִשְׁפָּט can denote ordinance, rule, or customary practice; here it refers to their established former way of worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 듣지 않았습니다. 오히려 자기들의 예전 관습대로 계속 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 자기들의 예전 규례/관행대로 계속했습니다.’ 히브리어 מִשְׁפָּט은 규례, 법도, 관행을 뜻할 수 있으며, 여기서는 이전부터 굳어진 예배 방식을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא שָׁמֵעוּ
  english_pob_choice: But they did not listen
  chosen_korean: 그들은 듣지 않았습니다
  alternatives_korean:
  - 그들은 듣지 않았습니다만
  - 그들은 순종하지 않았습니다
  lexicon: HALOT
  rationale: שׁמע는 문맥상 단순 청취보다 이전의 경고를 받아들이지 않는 반응을 가리키므로, ‘듣지 않았습니다’가 가장 자연스럽고 과도한 해석을 피합니다.
- source_word: כִּי אִם
  english_pob_choice: instead
  chosen_korean: 오히려
  alternatives_korean:
  - 대신
  - 그러나
  lexicon: HALOT
  rationale: כִּי אִם은 앞의 부정을 뒤집어 대조하는 표현이므로, 한국어에서는 ‘오히려’가 간결하게 그 대비를 살립니다.
- source_word: כְּמִשְׁפָּטָם הָרִאשׁוֹן
  english_pob_choice: according to their former custom
  chosen_korean: 자기들의 예전 관습대로
  alternatives_korean:
  - 자기들의 예전 규례대로
  - 자기들의 이전 방식대로
  - 자기들의 전례대로
  lexicon: HALOT
  rationale: מִשְׁפָּט은 이 문맥에서 법적 ‘판결’보다 예배의 정착된 관행을 가리키므로, ‘관습’이 가장 직접적입니다.
- source_word: הֵם עֹשִׂים
  english_pob_choice: they kept acting
  chosen_korean: 계속 행했습니다
  alternatives_korean:
  - 계속하고 있었습니다
  - 계속 그렇게 했습니다
  - 계속 실천했습니다
  lexicon: HALOT
  rationale: 분사적 진행·습관 의미를 한국어 현재/과거 진행보다 자연스럽게 살리기 위해 ‘계속 행했습니다’로 옮겼습니다.
theological_decisions:
- issue: 이절의 מִשְׁפָּט를 종교적 규례로 볼지, 단순 관습으로 볼지
  chosen_reading: 여기서는 정식 율례라기보다 그들이 이전부터 지켜 오던 예배 관행으로 읽고, 본문에는 ‘관습’으로 반영했습니다.
  alternative_readings:
  - ‘규례’로 번역해 예배 질서를 강조하는 읽기
  - ‘관행’과 ‘규례’를 함께 살리는 중간 번역
  rationale: 문맥이 사마리아 이주민들의 혼합 예배 습관을 설명하므로, 법적 규범보다 반복된 예배 방식이라는 뉘앙스를 드러내는 편이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 문맥 주해
