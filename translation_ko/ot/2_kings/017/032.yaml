revisions:
- from: 그들은 야훼를 두려워하였고, 모든 백성 가운데서 산당의 제사장들을 자신들을 위해 세웠으며, 그들이 산당의 집들에서 자신들을 위해 섬기고 있었습니다.[a][b]
  to: 그들은 야훼를 경외하였고, 그들 가운데서[a] 자신들을 위하여 산당의 제사장들[b]을 세웠습니다. 그 제사장들은 산당의 신당들에서 그들을 위하여 봉사하였습니다.
  rationale: 원문의 논쟁적인 מִקְצוֹתָם의 범위를 ‘모든 백성’으로 확정하지 않고, 본문에는 넓은 표현을 사용하고 각주에 가능한 관용적 뉘앙스를 남겼습니다. 마지막 절은 임명된 제사장들이 봉사한다는 자연스러운 선행사를 명시했으며, בית הבמות는 한국어에서 자연스러운 ‘산당의 신당들’로 옮겼습니다. 대조 접속사를 덧붙이지 않고 히브리어의 단순 병치를 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:57:56Z'
review_pass:
