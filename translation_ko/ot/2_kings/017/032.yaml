source:
  edition: WLC
  text: וַ/יִּהְי֥וּ יְרֵאִ֖ים אֶת יְהוָ֑ה וַ/יַּעֲשׂ֨וּ לָ/הֶ֤ם מִ/קְצוֹתָ/ם֙ כֹּהֲנֵ֣י בָמ֔וֹת וַ/יִּהְי֛וּ עֹשִׂ֥ים לָ/הֶ֖ם בְּ/בֵ֥ית הַ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/032.yaml
  text: They feared Yahweh[a], and they appointed for themselves from among all their people priests of the high places[b], who were serving for them in the houses of the high places.
  footnotes:
  - marker: a
    text: Or 'from all classes of them'; the Hebrew expression is idiomatic and may suggest selection from the people at large without proper distinction.
    reason: lexical_alternative
  - marker: b
    text: That is, priests serving at local shrine sites rather than at the central sanctuary.
    reason: cultural_note
translation:
  language: ko
  text: 그들은 야훼를 두려워하였고, 모든 백성 가운데서 산당의 제사장들을 자신들을 위해 세웠으며, 그들이 산당의 집들에서 자신들을 위해 섬기고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘모든 백성 가운데서’는 히브리어 관용구를 반영한 것으로, 신분 구분보다 무차별적 선발을 암시할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉, 중앙 성소가 아니라 지역 산당에서 섬기는 제사장들을 뜻합니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְרֵאִים אֶת יְהוָה
  english_pob_choice: feared Yahweh
  chosen_korean: 야훼를 두려워하였고
  alternatives_korean:
  - 야훼를 경외하였고
  - 야훼를 섬겼고
  lexicon: HALOT
  rationale: ירא את־יהוה의 기본 의미인 두려움/경외를 살려, 외형적 경외와 실제 행위의 모순이 드러나도록 했습니다.
- source_word: מִקְצוֹתָם
  english_pob_choice: from among themselves
  chosen_korean: 모든 백성 가운데서
  alternatives_korean:
  - 그들 가운데서
  - 그들 중에서
  - 모든 계층 가운데서
  lexicon: HALOT
  rationale: 이 관용구는 단순히 내부에서 선발했다는 뜻이므로, 신분 구분을 암시하지 않으면서도 POB의 ‘from among all their people’ 취지를 반영했습니다.
- source_word: כֹּהֲנֵי בָמ֔וֹת
  english_pob_choice: priests of the high places
  chosen_korean: 산당의 제사장들
  alternatives_korean:
  - 산당 제사장들
  - 높은 곳의 제사장들
  lexicon: HALOT
  rationale: בָּמוֹת를 한국어 성경 관용의 ‘산당’으로 옮겨, 지역 제의 장소라는 문화적 의미를 유지했습니다.
- source_word: בְּבֵית הַבָּמוֹת
  english_pob_choice: in the houses of the high places
  chosen_korean: 산당의 집들에서
  alternatives_korean:
  - 산당의 집 안에서
  - 산당의 성소들에서
  lexicon: HALOT
  rationale: בית의 직역적 이미지를 살리되, POB가 설명하는 지역 제의 공간이라는 점이 드러나도록 ‘집들’로 옮겼습니다.
theological_decisions:
- issue: 두려움과 불법적 제의의 긴장 보존
  chosen_reading: 야훼를 두려워하였고, ... 산당의 제사장들을 자신들을 위해 세웠으며
  alternative_readings:
  - 야훼를 경외하면서도 ... 산당의 제사장들을 세웠으며
  - 야훼를 섬겼고 ... 산당의 제사장들을 세웠으며
  rationale: 본문은 야훼에 대한 두려움과 산당 제의의 병치를 통해 종교적 혼합을 드러내므로, 그 긴장을 완화하지 않도록 했습니다.
  doctrine_reference: 'Translation philosophy §3: Preserve theological tension rather than resolve it.'
