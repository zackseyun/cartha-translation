  source_fidelity: 초안은 야훼를 두려워함과 산당 제사장 임명의 병치를 대체로 보존합니다. 그러나 מִקְצוֹתָם을 단정적으로 ‘모든 백성 가운데서’로 옮기면 논쟁적인 관용구의 뉘앙스를 과도하게 확정합니다. 또한 마지막 절의 주어는 임명된 제사장들로 자연스럽게 이해되므로 이를 한국어에서 분명히 하는 편이 좋습니다.
  naturalness: ‘산당의 집들’은 현대 표준 한국어에서 부자연스럽고 지시 대상이 불명확합니다. ‘산당의 신당들’은 בית הבמות가 가리키는 산당의 제의 건물을 자연스럽게 전달합니다. 마지막 절도 ‘그들이’ 대신 ‘그 제사장들은’으로 밝혀야 대명사 혼동을 피할 수 있습니다.
  terminology: ‘야훼’, ‘산당’, ‘제사장’은 적절합니다. ירא את־יהוה는 여기서 문맥상 종교적 경외를 나타내므로 ‘두려워하였습니다’도 가능하나, 현대 한국어의 자연스러움과 관용을 고려하여 ‘경외하였습니다’로 옮겼습니다. 이는 단순한 감정적 공포로 축소하지 않으면서 원문의 긴장을 유지합니다.
