id: 2KI.17.11
reference: 2 Kings 17:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יְקַטְּרוּ שָׁם֙ בְּ/כָל בָּמ֔וֹת כַּ/גּוֹיִ֕ם אֲשֶׁר הֶגְלָ֥ה יְהוָ֖ה מִ/פְּנֵי/הֶ֑ם וַֽ/יַּעֲשׂוּ֙ דְּבָרִ֣ים רָעִ֔ים לְ/הַכְעִ֖יס אֶת יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/011.yaml
  text: There they burned incense on all the high places[a], like the nations whom Yahweh had driven out before them; and they did evil things to provoke Yahweh.
  footnotes:
  - marker: a
    text: Or, 'whom the LORD had exiled from before them.' The Hebrew verb can denote carrying away or removing; here it refers to the nations dispossessed from the land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그곳에서 그들은 모든 산당에서, 그 땅에서 그들 앞에서 쫓아내신 민족들처럼 향을 피웠고, 야훼를 격노하게 하려고 악한 일들을 행했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼께서 그들 앞에서 쫓아내신 민족들’입니다. 히브리어 동사는 끌고 가다/옮기다의 뜻도 가질 수 있으나, 여기서는 땅에서 축출된 민족들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַטְּרוּ
  english_pob_choice: they burned incense
  chosen_korean: 향을 피웠고
  alternatives_korean:
  - 분향했고
  - 제사를 드렸고
  lexicon: HALOT
  rationale: קטר의 제의적 의미를 살리되, 우상숭배 문맥에서 자연스러운 한국어인 ‘향을 피우다’로 옮겼습니다.
- source_word: בְּכָל בָּמוֹת
  english_pob_choice: on all the high places
  chosen_korean: 모든 산당에서
  alternatives_korean:
  - 모든 높은 곳에서
  - 각 산당마다
  lexicon: HALOT
  rationale: בָּמוֹת는 열왕기에서의 기술적 종교 용어이므로, 일반적 ‘높은 곳’보다 ‘산당’을 유지하는 것이 문맥을 더 정확히 드러냅니다.
- source_word: אֲשֶׁר הֶגְלָה יְהוָה מִפְּנֵיהֶם
  english_pob_choice: whom Yahweh had driven out before them
  chosen_korean: 그 땅에서 그들 앞에서 쫓아내신
  alternatives_korean:
  - 그들 앞에서 옮겨가게 하신
  - 그들 앞에서 내쫓으신
  - 그들 앞에서 추방하신
  lexicon: HALOT
  rationale: הֶגְלָה는 여기서 포로로 끌고 간다는 의미보다 땅에서 몰아내고 제거하는 정복-축출의 뜻이 강하므로, ‘쫓아내신’으로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트의 기본 원칙에 따라 여호와 대신 신명기적 고유명사 ‘야훼’를 사용했습니다.
- source_word: לְהַכְעִיס
  english_pob_choice: to provoke
  chosen_korean: 격노하게 하려고
  alternatives_korean:
  - 노하게 하려고
  - 화를 돋우려고
  - 진노하게 하려고
  lexicon: HALOT
  rationale: 히필형 כעס는 단순한 감정 유발을 넘어 언약적 분노를 일으키는 뜻이므로, ‘격노하게 하다’가 더 강하게 대응합니다.
theological_decisions:
- issue: 민족을 향한 הֶגְלָה의 역사적 뉘앙스
  chosen_reading: ‘쫓아내신’으로 정복과 축출의 의미를 드러냈습니다.
  alternative_readings:
  - ‘포로로 보내신’
  - ‘추방하신’
  rationale: 이 절은 이미 땅에서 제거된 민족들을 상기시키며, 이 맥락에서는 포로기 언어보다 약속의 땅에서의 축출이라는 신학적 대비가 핵심입니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §1 Original-language primacy over translation tradition
