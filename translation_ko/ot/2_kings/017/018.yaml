  to: 그러므로 야훼께서는 이스라엘에게 매우 진노하셔서, 그들을 그분의 얼굴 앞에서 물러나게 하셨습니다[a]. 유다 지파만 홀로 남았습니다.
  rationale: 접속사 ו의 문맥상 귀결을 ‘그러므로’로 자연스럽게 나타내고, וַיְסִרֵם의 사역적 의미를 ‘물러나게 하셨습니다’로 옮겼습니다. ‘그분의 얼굴 앞에서’는 원문의 구체적 표현을 보존하며, 더 관용적인 대안은 각주에 남겼습니다. 유다만 남았다는 강조는 ‘만 홀로’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:57:30Z'
