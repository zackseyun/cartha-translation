  text: וַ/יִּתְאַנַּ֨ף יְהוָ֤ה מְאֹד֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְסִרֵ֖/ם מֵ/עַ֣ל פָּנָ֑י/ו לֹ֣א נִשְׁאַ֔ר רַ֛ק שֵׁ֥בֶט יְהוּדָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/018.yaml
  text: So Yahweh was very angry with Israel and removed them from before his face[a]; none was left except the tribe of Judah alone.
  footnotes:
  - marker: a
    text: Or 'from his presence.' The Hebrew is more literally 'from before his face.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서는 이스라엘에게 매우 진노하셔서, 그들을 그분의 얼굴 앞에서 물러나게 하셨습니다[a]. 유다 지파만 홀로 남았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그분의 임재에서’. 히브리어를 더 직역하면 ‘그분의 얼굴 앞에서’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְאַנַּף יְהוָה מְאֹד
  english_pob_choice: Yahweh was very angry
  chosen_korean: 야훼께서는 매우 진노하시고
  alternatives_korean:
  - 야훼께서는 크게 분노하시고
  - 야훼께서는 몹시 노하셔서
  lexicon: HALOT
  rationale: אנף의 강한 분노를 ‘진노하시다’로 옮기고, מְאֹד는 ‘매우’로 반영해 분노의 강도를 분명히 했습니다.
- source_word: וַיְסִרֵם
  english_pob_choice: removed them
  chosen_korean: 그들을 … 치우셨습니다
  alternatives_korean:
  - 그들을 옮기셨습니다
  - 그들을 제거하셨습니다
  lexicon: HALOT
  rationale: 사역적 의미의 סור를 살리되, 단순한 이동보다 하나님이 그들을 관계의 자리에서 밀어내신 뉘앙스를 갖는 ‘치우다’로 처리했습니다.
- source_word: מֵעַל פָּנָיו
  english_pob_choice: from before his face
  chosen_korean: 자기 얼굴 앞에서
  alternatives_korean:
  - 자기 임재에서
  - 그분의 앞에서
  lexicon: HALOT
  rationale: 히브리어의 구체적 인체화 표현을 살려 ‘얼굴 앞’으로 옮겼습니다. 본문의 긴장감을 유지하기 위해 ‘임재’로 매끈하게 바꾸지 않았습니다.
- source_word: לֹא נִשְׁאַר רַק שֵׁבֶט יְהוּדָה לְבַדּוֹ
  english_pob_choice: none was left except the tribe of Judah alone
  chosen_korean: 유다 지파만 홀로 남았습니다
  alternatives_korean:
  - 유다 지파만 남았습니다
  - 유다 지파 외에는 아무도 남지 않았습니다
  lexicon: HALOT
  rationale: 부정과 예외를 한국어에서 자연스럽게 합쳐, 예외적 생존을 강조하는 ‘만 홀로 남았습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘Yahweh’와 ‘face/presence’의 보존
  chosen_reading: 하나님의 이름은 ‘야훼’로, ‘מֵעַל פָּנָיו’는 ‘자기 얼굴 앞에서’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 바꾸어 읽기
  - ‘자기 임재에서’로 완화하기
  rationale: 이 절은 하나님의 언약적 분노와 추방의 이미지를 직접적으로 드러내므로, 이름과 표상을 둘 다 평탄화하지 않고 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 'Translation philosophy #3, #6'
