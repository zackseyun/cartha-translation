  edition: WLC
  text: עַ֣ד הַ/יּ֤וֹם הַ/זֶּה֙ הֵ֣ם עֹשִׂ֔ים כַּ/מִּשְׁפָּטִ֖ים הָ/רִֽאשֹׁנִ֑ים אֵינָ֤/ם יְרֵאִים֙ אֶת יְהוָ֔ה וְ/אֵינָ֣/ם עֹשִׂ֗ים כְּ/חֻקֹּתָ/ם֙ וּ/כְ/מִשְׁפָּטָ֔/ם וְ/כַ/תּוֹרָ֣ה וְ/כַ/מִּצְוָ֗ה אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁר שָׂ֥ם שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/034.yaml
  text: To this day they act according to the former customs[a]. They do not fear Yahweh, and they do not act according to their statutes and their ordinances, or according to the law and the commandment that Yahweh commanded the sons of Jacob[d][c][b], whom he named Israel.
  footnotes:
  - marker: a
    text: Or 'according to the former ordinances' or 'according to the former practices.'
    reason: lexical_alternative
  - marker: b
    text: '''Fear the LORD'' can also be expressed ''revere the LORD''; the Hebrew idiom carries both dread and reverent covenant loyalty.'
    reason: lexical_alternative
  - marker: c
    text: Hebrew 'the sons of Jacob'; this refers corporately to the people descended from Jacob.
    reason: lexical_alternative
  - marker: d
    text: That is, Jacob; compare Genesis 32:28; 35:10.
    reason: cross_reference
translation:
  language: ko
  text: 오늘날까지도 그들은 옛 관례를 따릅니다[a]. 그들은 야훼를 경외하지 않으며[b], 자기들의 규례와 자기들의 법도대로도, 야훼께서 야곱의 아들들에게[c] 명하신 율법과 명령대로도 행하지 않습니다. 야곱은 야훼께서 이스라엘이라 이름하신 사람입니다[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘옛 규례에 따라’ 혹은 ‘옛 관습에 따라’.
    reason: lexical_alternative
  - marker: b
    text: ‘야훼를 두려워하다’로도 옮길 수 있으나, 이 히브리어 관용구는 두려움과 경외를 함께 담습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어는 ‘야곱의 아들들’이라고 하며, 이는 야곱에게서 난 백성을 집합적으로 가리킵니다.
    reason: lexical_alternative
  - marker: d
    text: 창세기 32:28; 35:10 참조.
    reason: cross_reference
lexical_decisions:
- source_word: כַּמִּשְׁפָּטִים הָרִאשֹׁנִים
  english_pob_choice: according to the former customs
  chosen_korean: 옛 관례를 따릅니다
  alternatives_korean:
  - 옛 규례를 따릅니다
  - 옛 법도에 따라 행합니다
  - 이전 관습을 따릅니다
  lexicon: HALOT
  rationale: מִשְׁפָּט는 문맥에 따라 ‘규례/관례/법도’까지 넓게 가리킬 수 있으므로, 여기서는 계속 이어지는 우상 섞인 종교 관행을 가리키는 POB의 이해를 따라 ‘옛 관례’로 옮겼습니다.
- source_word: יְרֵאִים אֶת יְהוָה
  english_pob_choice: fear Yahweh
  chosen_korean: 야훼를 경외하지 않으며
  alternatives_korean:
  - 야훼를 두려워하지 않으며
  - 야훼를 경외하지 않으며
  - 야훼를 무서워하지 않으며
  lexicon: HALOT
  rationale: 히브리어 관용구는 두려움과 언약적 경외를 함께 담으므로, 한국어에서는 ‘경외하다’가 의미를 가장 잘 보존합니다. 부정문으로 처리해 대조를 분명히 했습니다.
- source_word: כְּחֻקֹּתָם וּכְמִשְׁפָּטָם
  english_pob_choice: according to their statutes and their ordinances
  chosen_korean: 자기들의 규례와 자기들의 법도대로
  alternatives_korean:
  - 자기들의 규례와 자기들의 율례대로
  - 자기들의 규례와 자기들의 판결대로
  - 자기들의 법령과 법도대로
  lexicon: HALOT
  rationale: 여기서는 ‘their’가 다른 민족들의 자체 규범을 가리키며, 2절차 문맥상 별도의 ‘야훼의 율법’과 대비됩니다. ‘규례/법도’의 짝으로 법적·관습적 뉘앙스를 살렸습니다.
- source_word: בְּנֵי יַעֲקֹב ... אֲשֶׁר שָׂם שְׁמוֹ יִשְׂרָאֵל
  english_pob_choice: the sons of Jacob, whom he named Israel
  chosen_korean: 야곱의 아들들에게[c] ... 그는 그들의 이름을 이스라엘이라 하셨습니다[d]
  alternatives_korean:
  - 야곱의 자손들에게 ... 그를 이스라엘이라 부르셨습니다
  - 야곱의 아들들에게 ... 그 이름을 이스라엘로 지으셨습니다
  lexicon: HALOT
  rationale: ‘sons of Jacob’는 집합적으로 이스라엘 백성을 가리키므로 직역하되, 이어지는 재명명 구절은 창세기 32장과 35장의 연관을 살려 ‘이름을 이스라엘이라 하셨습니다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 절의 텍스트는 여호와 대체어가 아니라 고유명사 יהוה를 직접 사용하므로, 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘경외하다’의 뉘앙스
  chosen_reading: 경외하지 않으며
  alternative_readings:
  - 두려워하지 않으며
  - 공경하지 않으며
  rationale: 히브리어 ירא את־יהוה는 단순한 공포보다 언약적 경외와 충성을 포함하므로, ‘경외하다’를 택해 신학적 긴장을 보존했습니다.
  doctrine_reference: HALOT / covenantal idiom
