translation:
  language: ko
  text: 이스라엘 자손은 여로보암이 지은 모든 죄 가운데서 걸어 다녔습니다. 그들은 그것들에서 돌아서지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 단수 여성형 ‘그것에서’를 쓰지만, 앞의 복수 ‘죄’ 전체를 가리키는 집합적 표현으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  english_pob_choice: walked
  chosen_korean: 걸어 다녔습니다
  alternatives_korean:
  - 걸었습니다
  - 행했습니다
  - 그 길을 따랐습니다
  lexicon: HALOT
  rationale: הלך + ב의 관용적 용법을 살려, 단순 이동이 아니라 삶의 행실과 지속적 추종을 드러내는 표현으로 옮겼습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 언약적·민족적 표현을 비교적 직접적으로 반영하면서도 한국어에서 자연스럽게 읽히는 전통적 표현을 택했습니다.
- source_word: חַטֹּאות
  english_pob_choice: sins
  chosen_korean: 죄
  alternatives_korean:
  - 죄악
  - 죄들
  - 범죄
  lexicon: HALOT
  rationale: 구체적이고 반복된 악행을 가리키므로, 한국어 성경 문맥에서 가장 자연스러운 ‘죄’로 옮겼습니다.
- source_word: לֹא סָרוּ מִמֶּנָּה
  english_pob_choice: they did not turn away from them
  chosen_korean: 그들은 그것들에서 돌아서지 않았습니다
  alternatives_korean:
  - 그것에서 돌아서지 않았습니다
  - 그 길에서 떠나지 않았습니다
  - 그것들을 버리지 않았습니다
  lexicon: HALOT
  rationale: סור의 ‘돌아서다/떠나다’ 의미를 살리되, 복수인 앞절의 ‘죄들’에 자연스럽게 대응하도록 한국어에서는 ‘그것들’을 사용했습니다.
theological_decisions:
- issue: 끝의 단수 대명사 מִמֶּנָּה의 지시 대상
  chosen_reading: 한국어에서는 앞의 복수 ‘죄’ 전체를 가리키는 집합적 지시로 처리해 ‘그것들’로 옮겼습니다.
  alternative_readings:
  - 그것에서
  - 그 죄의 길에서
  rationale: 히브리어는 단수 여성형 접미사를 쓰지만, 문맥상 여로보암의 죄의 패턴 전체를 가리키는 집합적 용법으로 이해하는 것이 타당합니다. 한국어에서는 모호함을 줄이면서도 의미를 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
