  rationale: 비유적 행위 동사인 ‘걷다’를 한국어의 자연스러운 윤리적 표현인 ‘따르다’로 바꾸었습니다. 끝의 단수 대명사는 본문에서 ‘거기’로 옮기고 각주에서 집합적 지시 가능성을 밝혀, 원문의 문법적 특징과 문맥적 의미를 모두 보존했습니다.
