  lexicon: HALOT
  rationale: סור의 ‘돌아서다/떠나다’ 의미를 살리되, 복수인 앞절의 ‘죄들’에 자연스럽게 대응하도록 한국어에서는 ‘그것들’을 사용했습니다.
theological_decisions:
- issue: 끝의 단수 대명사 מִמֶּנָּה의 지시 대상
  chosen_reading: 한국어에서는 앞의 복수 ‘죄’ 전체를 가리키는 집합적 지시로 처리해 ‘그것들’로 옮겼습니다.
  alternative_readings:
  - 그것에서
  - 그 죄의 길에서
  rationale: 히브리어는 단수 여성형 접미사를 쓰지만, 문맥상 여로보암의 죄의 패턴 전체를 가리키는 집합적 용법으로 이해하는 것이 타당합니다. 한국어에서는 모호함을 줄이면서도 의미를 보존하는 쪽이 적절합니다.
  doctrine_reference: Translation philosophy §1, §5
