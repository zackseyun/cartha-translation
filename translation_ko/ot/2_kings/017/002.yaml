id: 2KI.17.2
reference: 2 Kings 17:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה רַ֗ק לֹ֚א כְּ/מַלְכֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הָי֖וּ לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/002.yaml
  text: He did what was evil in the eyes of Yahweh[a], yet not like the kings of Israel who were before him.
  footnotes:
  - marker: a
    text: Or 'only, not like the kings of Israel who were before him.' The Hebrew particle can be rendered more literally as 'only,' introducing a qualification to the judgment.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 했습니다. 그러나 그보다 앞선 이스라엘의 왕들처럼 하지는 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다만, 그보다 앞선 이스라엘의 왕들처럼 하지는 않았다.’ 히브리어 입자는 더 문자적으로 ‘오직’으로도 옮길 수 있으며, 판단을 한정하는 뉘앙스를 띱니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 그는 ... 했습니다
  alternatives_korean:
  - 그는 ... 행했습니다
  - 그는 ... 하였습니다
  lexicon: HALOT
  rationale: 서술적 wayyiqtol의 간단한 행위를 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 나쁜 일
  - 악한 것
  lexicon: HALOT
  rationale: 왕 평가 공식에서 관용적으로 ‘악한 일’이 가장 직설적이며, 단순한 형용사보다 행위 평가를 분명히 드러냅니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어 관용구를 한국어로 자연스럽게 살리면서, 예배적·평가적 시선을 유지했습니다.
- source_word: רַק
  english_pob_choice: yet
  chosen_korean: 그러나
  alternatives_korean:
  - 다만
  - 오직
  - 그렇지만
  lexicon: HALOT
  rationale: 문맥상 단순한 접속이 아니라 앞선 평가를 한정하는 대비를 나타내므로, ‘그러나’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼의 고유명사 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יהוה를 직접 사용하므로, 관습적 대체어보다 신명사 자체를 드러내는 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB contested terms: יְהוָה / YHWH → 야훼'
- issue: רַק의 완화·한정 기능
  chosen_reading: ‘그러나’로 대비를 살리되, 다음 절과 연결되는 한정 뉘앙스를 보존
  alternative_readings:
  - 오직
  - 다만
  - 단지
  rationale: 이 구절은 단순한 반전이 아니라 이스라엘 열왕들에 비해 덜 악하다는 비교적 한정입니다. 한국어에서는 ‘그러나’가 본문의 대비를 가장 자연스럽게 전달합니다.
  doctrine_reference: 문맥상 평가어의 비교·한정 기능
