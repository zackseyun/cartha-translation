base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
  footnotes:
  - marker: a
    text: Or 'from his presence.' The Hebrew is literally 'from before his face,' an idiom for removal from before the LORD.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by the hand of,' that is, 'through' all his servants the prophets.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼께서 이스라엘을 자기 앞에서 제거하실 때까지였는데, 이는 그분께서 자기 종들 곧 모든 예언자들의 손을 통해 말씀하신 그대로였습니다. 그래서 이스라엘은 자기 땅에서 아시리아로 유배되었고, 오늘날까지 그러합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 얼굴 앞에서’라는 뜻으로, 야훼 앞에서의 배제라는 관용구입니다.
    reason: source_note
  - marker: b
    text: ‘손을 통해’는 히브리어의 관용적 표현으로, ‘통하여’라는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר / removed
  english_pob_choice: removed
  chosen_korean: 제거하실
  alternatives_korean:
  - 옮기실
  - 내쫓으실
  lexicon: HALOT
  rationale: 히필 동사 סור의 사역적 의미를 살리면서도, 심판 맥락을 과도하게 좁히지 않도록 ‘제거하다’를 택했습니다.
- source_word: מֵעַל פָּנָיו / from before his face
  english_pob_choice: from before his face
  chosen_korean: 자기 앞에서
  alternatives_korean:
  - 자기 얼굴 앞에서
  - 그분의 임재에서
  lexicon: HALOT
  rationale: 히브리어 관용구의 의미는 살리되, 한국어에서는 ‘앞에서’가 가장 자연스럽게 앞/면전의 관계와 추방의 뉘앙스를 전달합니다.
- source_word: בְּיַד כָּל עֲבָדָיו הַנְּבִיאִים / by the hand of all his servants the prophets
  english_pob_choice: by the hand of all his servants the prophets
  chosen_korean: 자기 종들 곧 모든 예언자들의 손을 통해
  alternatives_korean:
  - 모든 종들인 예언자들을 통해
  - 모든 예언자 종들을 통해
  lexicon: HALOT
  rationale: ‘손을 통해’로 히브리어 בְּיַד의 도구성/매개성을 유지했고, 예언자들이 야훼의 종이라는 병렬 관계는 ‘곧’으로 풀어냈습니다.
- source_word: וַיִּגֶל / was exiled
  english_pob_choice: was exiled
  chosen_korean: 유배되었고
  alternatives_korean:
  - 추방되었고
  - 끌려가고
  lexicon: HALOT
  rationale: 국가적 집단의 강제 이주를 나타내는 역사적 맥락에서 ‘유배되다’가 가장 정확하며, 수동형도 보존합니다.
theological_decisions:
- issue: 야훼가 이스라엘을 ‘자기 앞에서’ 제거하시는 심판적 표현
  chosen_reading: 관계적·언약적 단절을 드러내는 심판 언어로 이해해, 의미를 약화시키지 않고 한국어로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘임재에서’로 완화
  - ‘면전에서’로 더 직역
  rationale: 본문은 단순한 이동이 아니라 야훼 앞에서의 배제라는 언약적 심판을 말하므로, 지나치게 매끈한 표현보다 관계적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: YHWH 심판/언약적 배제 표현'
