  lexicon: HALOT
  rationale: 국가적 집단의 강제 이주를 나타내는 역사적 맥락에서 ‘유배되다’가 가장 정확하며, 수동형도 보존합니다.
theological_decisions:
- issue: 야훼가 이스라엘을 ‘자기 앞에서’ 제거하시는 심판적 표현
  chosen_reading: 관계적·언약적 단절을 드러내는 심판 언어로 이해해, 의미를 약화시키지 않고 한국어로 직설적으로 옮겼습니다.
  alternative_readings:
  - ‘임재에서’로 완화
  - ‘면전에서’로 더 직역
  rationale: 본문은 단순한 이동이 아니라 야훼 앞에서의 배제라는 언약적 심판을 말하므로, 지나치게 매끈한 표현보다 관계적 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 'DOCTRINE.md: YHWH 심판/언약적 배제 표현'
