  source_fidelity: 핵심 어휘는 대체로 반영했지만, 첫 문장의 ‘…때까지였는데, 이는 … 그대로였습니다’는 עַד אֲשֶׁר 및 כַּאֲשֶׁר의 관계를 한국어에서 부정확하고 어색하게 처리합니다. 또한 ‘오늘날까지 그러합니다’는 이스라엘이 현재까지 계속 유배 상태라는 뜻으로 읽힐 수 있으므로, 원문의 서술 시점에 맞춰 ‘오늘날까지 그곳에 있습니다’로 옮기는 편이 안전합니다.
  naturalness: ‘자기 종들 곧 모든 예언자들의 손을 통해’는 소유 관계와 수식 범위가 다소 불분명하고 한국어로 무겁습니다. ‘그분의 모든 종인 예언자들을 통하여’가 자연스럽고 원문의 동격 관계를 명료하게 나타냅니다. ‘마침내’는 앞 절에서 이어지는 עַד אֲשֶׁר의 종결·귀결을 자연스러운 한국어 문장으로 처리합니다.
  terminology: ‘야훼’, ‘이스라엘’, ‘아시리아’, ‘예언자’, ‘유배’는 적절합니다. מֵעַל פָּנָיו는 ‘그분 앞에서’로 유지하고, 문자적 ‘얼굴’ 및 관용적 의미는 각주에서 보충합니다. בְּיַד의 관용구 각주는 실제 해당 번역어에 붙여야 합니다.
