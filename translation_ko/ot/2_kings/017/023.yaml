base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/023.yaml
  text: until Yahweh removed Israel from before him[a], just as he had spoken by the hand of all his servants the prophets. So Israel was exiled from its land to Assyria[b], to this day.
  footnotes:
  - marker: a
    text: Or 'from his presence.' The Hebrew is literally 'from before his face,' an idiom for removal from before the LORD.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'by the hand of,' that is, 'through' all his servants the prophets.
    reason: lexical_alternative
translation:
  language: ko
  text: 마침내 야훼께서는 그분의 모든 종인 예언자들을 통하여 말씀하신 그대로 이스라엘을 그분 앞에서[a] 제거하셨습니다. 그리하여 이스라엘은 자기 땅에서 아시리아로 유배되었으며, 오늘날까지 그곳에 있습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 얼굴 앞에서’이며, 여기서는 야훼의 앞 또는 임재에서 제거됨을 나타내는 관용적 표현입니다.
    reason: source_note
  - marker: b
    text: 히브리어의 ‘손을 통하여’는 ‘통하여’라는 뜻의 관용적 표현입니다.
    reason: lexical_alternative
