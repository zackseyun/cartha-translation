  to: 마침내 야훼께서는 그분의 모든 종인 예언자들을 통하여 말씀하신 그대로 이스라엘을 그분 앞에서[a] 제거하셨습니다. 그리하여 이스라엘은 자기 땅에서 아시리아로 유배되었으며, 오늘날까지 그곳에 있습니다.[b]
