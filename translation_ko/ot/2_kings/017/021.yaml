  text: כִּֽי קָרַ֣ע יִשְׂרָאֵ֗ל מֵ/עַל֙ בֵּ֣ית דָּוִ֔ד וַ/יַּמְלִ֖יכוּ אֶת יָרָבְעָ֣ם בֶּן נְבָ֑ט ו/ידא יָרָבְעָ֤ם אֶת יִשְׂרָאֵל֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/הֶחֱטֵיאָ֖/ם חֲטָאָ֥ה גְדוֹלָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/021.yaml
  text: For Israel tore itself away from the house of David[a], and they made Jeroboam son of Nebat king; and Jeroboam drove Israel from following Yahweh and caused them to commit a great sin.
  footnotes:
  - marker: a
    text: Or 'turned Israel away from following the LORD.' The Hebrew verb can denote driving away or leading astray.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 이스라엘이 다윗의 집에서 찢어져 나가 느밧의 아들 여로보암을 왕으로 세웠으며, 여로보암이 이스라엘을 야훼를 따르는 데서 떠나게 하고[a] 그들이 큰 죄를 짓게 했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스라엘을 야훼를 따르는 데서 돌이켰다’로도 옮길 수 있습니다. 히브리어 동사는 ‘몰아내다’ 또는 ‘잘못된 길로 이끌다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַע
  english_pob_choice: tore itself away
  chosen_korean: 찢겨 나갔기
  alternatives_korean:
