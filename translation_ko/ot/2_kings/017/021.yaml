  - 갈라져 나갔기
  - 찢어져 분리되었기
  lexicon: HALOT
  rationale: 동사는 본래 ‘찢다/찢어지게 하다’의 강한 파열 이미지를 가지므로, 단순한 ‘분리하다’보다 ‘찢겨 나갔기’가 원문의 생생한 비유를 더 잘 살립니다.
- source_word: מֵ/עַל בֵּית דָּוִד
  english_pob_choice: from the house of David
  chosen_korean: 다윗의 집에서
  alternatives_korean:
  - 다윗의 집으로부터
  - 다윗의 집에서 벗어나
  - 다윗의 집을 떠나
  lexicon: HALOT
  rationale: ‘~에서/로부터’는 다윗 왕조의 권위에서 이탈한 관계를 자연스럽게 드러내며, 분리의 강도는 앞의 ‘찢겨 나갔기’가 담당합니다.
- source_word: וַיַּמְלִיכוּ
  english_pob_choice: they made ... king
  chosen_korean: 왕으로 세웠기
  alternatives_korean:
  - 왕으로 삼았기
  - 왕으로 세워 즉위시켰기
  - 왕으로 만들었기
  lexicon: HALOT
  rationale: 사역형의 의미를 살리면서 현대 한국어에서 가장 자연스럽게 왕권 설치를 표현합니다.
- source_word: מֵאַחֲרֵי יְהוָה
  english_pob_choice: from following Yahweh
  chosen_korean: 야훼를 따르는 데서
  alternatives_korean:
  - 야훼를 따르는 데서 떠나게
  - 야훼 뒤를 따르는 데서
  - 야훼를 따라가는 데서
  lexicon: HALOT
  rationale: 히브리어 관용구 ‘~의 뒤를 따르다’는 언약적 충성을 뜻하므로, 한국어에서는 ‘따르는 데서’로 옮겨 관계적·지속적 의미를 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주
  lexicon: HALOT
  rationale: 프로젝트 기본 용례에 따라 신적 고유명사는 ‘야훼’로 옮겨, 호칭어 ‘주’와 구별했습니다.
- source_word: וְ/הֶחֱטֵיאָ֖/ם
  english_pob_choice: caused them to commit
  chosen_korean: 그들로 하여금 ... 짓게 했고
  alternatives_korean:
  - 그들을 죄짓게 했고
  - 그들로 하여금 죄를 짓게 했고
  - 그들을 죄로 이끌었고
  lexicon: HALOT
  rationale: 사역적 의미를 분명히 하면서도, 뒤의 목적어 ‘큰 죄’를 자연스럽게 받도록 ‘짓게 했고’로 표현했습니다.
- source_word: חֲטָאָה גְדוֹלָה
  english_pob_choice: a great sin
  chosen_korean: 큰 죄
  alternatives_korean:
  - 중대한 죄
  - 엄청난 죄
  - 지극히 큰 죄
  lexicon: HALOT
  rationale: 원문의 수식 관계를 직접적으로 반영해, 평가를 덧붙이지 않고 규모를 드러내는 ‘큰 죄’를 택했습니다.
