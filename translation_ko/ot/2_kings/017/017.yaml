base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/017.yaml
  text: They made their sons and their daughters pass through the fire[a], practiced divination and interpreted omens, and sold themselves to do what was evil in the sight of Yahweh, provoking him to anger.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'sacrificed their sons and daughters in the fire.' The Hebrew idiom is literally 'made ... pass through the fire.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기 아들들과 딸들을 불 가운데로 지나가게 하고[a], 점을 치며 징조를 해석하고, 야훼 보시기에 악을 행하려고 스스로를 팔아 그분을 진노하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 분명히, ‘그들의 아들들과 딸들을 불에서 제물로 바쳤습니다.’ 히브리어 관용구의 문자적 표현은 ‘…을 불 가운데로 지나가게 하다’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִירוּ ... בָּאֵשׁ
  english_pob_choice: made ... pass through the fire
  chosen_korean: 불 가운데로 지나가게 하고
  alternatives_korean:
  - 불에 태우고
  - 불 속으로 지나가게 하고
  - 불로 바치고
  lexicon: HALOT
  rationale: 히브리어 관용구를 그대로 살리되, 한국어로는 ‘불 가운데로 지나가게 하다’가 가장 직역에 가깝고 의례의 모호함도 유지합니다.
- source_word: וַיִּקְסְמוּ קְסָמִים
  english_pob_choice: practiced divination
  chosen_korean: 점을 치고
  alternatives_korean:
  - 점을 행하고
  - 점술을 행하고
  - 주술을 사용하고
  lexicon: HALOT
  rationale: 무속적·점복적 행위를 자연스럽게 드러내는 현대 한국어로 옮겼습니다. 앞의 ‘불 가운데로 지나가게 하다’와 병렬되는 금지된 행위를 간명하게 표현합니다.
- source_word: וַיְנַחֵשׁוּ
  english_pob_choice: interpreted omens
  chosen_korean: 길흉을 살피며
  alternatives_korean:
  - 징조를 해석하며
  - 전조를 해석하며
  - 점괘를 풀이하며
  lexicon: HALOT
  rationale: 별도의 동사로서 징조 읽기, 전조 해석의 뉘앙스를 살리기 위해 ‘길흉을 살피다’를 택했습니다. 앞의 ‘점을 치다’와 구별됩니다.
- source_word: וַיִּתְמַכְּרוּ
  english_pob_choice: sold themselves
  chosen_korean: 스스로 팔려
  alternatives_korean:
  - 자신을 팔아
  - 자기 자신을 내주어
  - 스스로 넘겨
  lexicon: HALOT
  rationale: ‘팔아버리다’의 자기-매매 이미지를 보존해, 죄에 대한 자발적 예속과 굴복을 강하게 드러냅니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에서
  - 야훼 보기에
  lexicon: HALOT
  rationale: 평가를 뜻하는 히브리 관용구를 한국어 성경체로 자연스럽게 옮겼습니다. 프로젝트 기본값에 따라 신명은 ‘야훼’로 유지했습니다.
- source_word: לְהַכְעִיסוֹ
  english_pob_choice: provoking him to anger
  chosen_korean: 그분을 화나게 했습니다
  alternatives_korean:
  - 그분께 분노를 일으켰습니다
  - 그분을 진노하게 했습니다
  - 그분의 분노를 샀습니다
  lexicon: HALOT
  rationale: 히브리어 사역형의 결과를 현대 한국어로 분명하게 전달하되, 문맥상 하나님의 감정적 반응을 흐리지 않도록 ‘화나게 했다’를 택했습니다.
theological_decisions:
- issue: 신명기 이름 יְהוָה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 프로젝트의 기본 원칙에 따라 여호와 대체어를 쓰지 않고, 본문이 가리키는 고유한 신명을 드러내는 음역을 유지했습니다.
  doctrine_reference: 'Contested terms: יְהוָה YHWH'
- issue: 아동 제의의 표현 수준
  chosen_reading: ‘불 가운데로 지나가게 하고’라는 히브리 관용구를 본문에 유지했습니다.
  alternative_readings:
  - ‘불에 태우고’
  - ‘자녀를 불로 제물로 바치고’
  rationale: 본문 자체는 관용구를 사용하므로, 더 구체적인 제의 해석은 주석 여지로 남기고 본문에서는 원문의 표현력을 보존했습니다.
  doctrine_reference: Translation philosophy 1 and 3
