base_translation:
  language: en
  yaml_path: translation/ot/2_kings/017/033.yaml
  text: They feared Yahweh[a], but they served their own gods, according to the custom of the nations from which they had been exiled.
  footnotes:
  - marker: a
    text: Or 'They feared the LORD and served their gods'—the Hebrew conjunction is simply 'and'; the contrast is made explicit in English for clarity.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 야훼를 두려워했지만, 자기들의 신들을 섬겼습니다. 이는 그들이 쫓겨난 민족들의 관습을 따른 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들은 야훼를 두려워하고 자기들의 신들을 섬겼습니다'—히브리어 접속사는 단순히 '그리고'이며, 대비는 영어에서 명확성을 위해 드러낸 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: WLC/HALOT
  rationale: 문자 그대로의 신적 고유명사를 살리기 위해 전통적 대체어인 '주님' 대신 학술적 음역 '야훼'를 사용했습니다.
- source_word: הָיוּ יְרֵאִים
  english_pob_choice: they feared
  chosen_korean: 두려워했습니다
  alternatives_korean:
  - 경외했습니다
  - 두려워하고 있었습니다
  lexicon: HALOT
  rationale: 하나님을 향한 경외와 두려움이 함께 있는 지속적 태도를 자연스러운 현대 한국어로 옮기기 위해 '두려워했습니다'를 택했습니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their own gods
  chosen_korean: 자기들의 신들
  alternatives_korean:
  - 그들의 신들
  - 자기들의 우상들
  lexicon: HALOT
  rationale: 소유격이 드러내는 대조를 살리되, 본문에 없는 '자기들의 own'을 과도하게 해석하지 않도록 '자기들의 신들'로 번역했습니다.
- source_word: כְּמִשְׁפַּט הַגּוֹיִם
  english_pob_choice: according to the custom of the nations
  chosen_korean: 민족들의 관습을 따른 것입니다
  alternatives_korean:
  - 민족들의 방식에 따라
  - 나라들의 관례대로
  lexicon: HALOT
  rationale: מִשְׁפָּט가 여기서는 법정 판결이 아니라 관습적 행위를 가리키므로 '관습'으로 옮겼습니다.
theological_decisions:
- issue: 야훼를 두려워함과 다른 신들을 섬김 사이의 대조
  chosen_reading: 접속된 두 절의 긴장을 살리기 위해 '하지만'으로 옮겨, 혼합 신앙의 모순을 드러냈습니다.
  alternative_readings:
  - 그리고
  - 그런데
  rationale: 히브리어 접속사는 단순한 'and'이지만, 문맥상 예배의 불일치를 강조하는 대비가 분명하므로 한국어에서 그 대비를 분명히 했습니다.
  doctrine_reference: 'translation philosophy: optimal equivalence'
