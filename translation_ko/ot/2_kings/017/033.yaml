  source_fidelity: 개정이 필요합니다. 히브리어의 마지막 구는 ‘그들이 그곳에서 사로잡혀 온/추방된 민족들의 관습대로’라는 방식으로 ‘자기들의 신들을 섬겼다’를 수식합니다. 초안의 ‘이는 … 따른 것입니다’는 별도의 설명문과 ‘따르다’라는 새 서술을 만들어 원문의 직접적인 병렬 구조를 약화합니다.
  naturalness: ‘야훼를 경외했지만 … 신들을 섬겼습니다’와 같이 한 문장으로 옮기면 현대 표준 한국어 합쇼체로 자연스럽고, 관습구의 수식 범위도 분명합니다.
