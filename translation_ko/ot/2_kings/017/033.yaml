revisions:
- from: 그들은 야훼를 두려워했지만, 자기들의 신들을 섬겼습니다. 이는 그들이 쫓겨난 민족들의 관습을 따른 것입니다.[a]
  to: 그들은 야훼를 경외했지만, 그곳에서 사로잡혀 온 민족들의 관습대로 자기들의 신들을 섬겼습니다.[a]
  rationale: 마지막 구를 원문처럼 ‘섬겼습니다’에 직접 연결하고, 원문에 없는 설명문 구조를 제거했습니다. ‘그곳에서 사로잡혀 온’은 히브리어의 추방/강제 이주 표현을 자연스럽게 반영하면서 행위 주체를 특정하지 않습니다. 역접은 문맥상 가능한 번역 선택으로 유지하되 각주에서 단순 접속사라는 원문의 형태를 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:57:32Z'
