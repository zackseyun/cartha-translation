  text: וַ/יִּשְׁכַּ֤ב מְנַשֶּׁה֙ עִם אֲבֹתָ֔י/ו וַ/יִּקָּבֵ֥ר בְּ/גַן בֵּית֖/וֹ בְּ/גַן עֻזָּ֑א וַ/יִּמְלֹ֛ךְ אָמ֥וֹן בְּנ֖/וֹ תַּחְתָּֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/018.yaml
  text: And Manasseh lay down with his fathers and was buried in the garden of his house[a], in the garden of Uzza. And Amon his son became king in his place.
  footnotes:
  - marker: a
    text: Or 'slept with his fathers,' preserving the conventional Hebrew royal-death idiom more literally.
    reason: lexical_alternative
translation:
  language: ko
  text: 므낫세가 그의 조상들과 함께 누웠고[a], 자기 집의 동산, 곧 우자의 동산에 장사되었습니다. 그의 아들 아몬이 그의 뒤를 이어 왕이 되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조상들과 함께 누웠고’는 죽음을 나타내는 히브리어의 관용적인 왕실 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  english_pob_choice: lay down
  chosen_korean: 누워
  alternatives_korean:
  - 잠들어
  - 죽어
  lexicon: HALOT
  rationale: 왕들의 죽음 보고 공식에서 쓰이는 관용구를 살리되, 한국어에서는 ‘누워’와 ‘장사되다’를 함께 써서 죽음의 의미가 분명하게 드러나도록 했습니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 조상들 곁에
  lexicon: HALOT
  rationale: 히브리어의 관용적 왕실 장례 표현을 자연스러운 현대 한국어로 옮기면서도, 단순한 ‘부친들’보다 세대적·왕조적 의미가 드러나도록 했습니다.
- source_word: בְּגַן בֵּיתוֹ / בְּגַן עֻזָּא
  english_pob_choice: in the garden of his house / in the garden of Uzza
  chosen_korean: 자기 집 동산 곧 우자의 동산
  alternatives_korean:
  - 자기 집의 동산, 우자의 동산에
  - 왕궁 동산, 우자의 동산
  lexicon: HALOT
  rationale: ‘집’과 ‘동산’의 직설적 결합을 유지해 본문이 말하는 장소를 과도하게 특정하지 않았고, 둘째 구를 동격으로 풀어 같은 장소를 설명하는 구조를 살렸습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king ... in his place
  chosen_korean: 그의 뒤를 이어 왕이 되었습니다
  alternatives_korean:
  - 그를 대신하여 왕이 되었습니다
  - 그의 자리에 왕이 되었습니다
  lexicon: HALOT
  rationale: 승계 공식의 의미를 한국어 왕위 계승 표현으로 자연스럽게 전달하면서, ‘뒤를 이어’로 תחת의 대체·승계 뜻을 반영했습니다.
theological_decisions:
- issue: 왕의 죽음 보고에서 ‘누워’와 ‘장사되다’의 결합 여부
  chosen_reading: 직역적 관용구를 살리되, 한국어에서는 ‘장사되었는데’로 죽음 결과를 분명히 했습니다.
  alternative_readings:
  - 그의 조상들과 함께 누웠습니다
  - 죽었습니다
  rationale: 본문의 관용적 왕실 서술을 보존하면서도 현대 독자가 오해 없이 읽도록 죽음과 매장을 함께 드러냈습니다.
  doctrine_reference: 역사서 본문의 서술 관습 보존
- issue: ‘his house’의 범위
  chosen_reading: ‘자기 집 동산’으로 두어 본문이 직접 말하는 범위 안에서만 옮겼습니다.
  alternative_readings:
  - 궁궐 동산
  - 왕궁 정원
  rationale: 본문 자체는 ‘집’이라고만 하므로, 왕궁으로 구체화하면 원문의 범위를 넘어설 수 있습니다.
  doctrine_reference: 본문 한정 번역 원칙
