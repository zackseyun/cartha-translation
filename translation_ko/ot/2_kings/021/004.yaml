id: 2KI.21.4
reference: 2 Kings 21:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וּ/בָנָ֥ה מִזְבְּחֹ֖ת בְּ/בֵ֣ית יְהוָ֑ה אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה בִּ/ירוּשָׁלִַ֖ם אָשִׂ֥ים אֶת שְׁמִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/004.yaml
  text: He built altars in the house of Yahweh[a], of which Yahweh had said[b], “In Jerusalem I will put my name.”
  footnotes:
  - marker: a
    text: Or 'in the temple of the LORD.' Literally, 'in the house of the LORD.'
    reason: lexical_alternative
  - marker: b
    text: '''I will put my name'' is temple covenant language for the place the LORD chooses to associate with his name and presence.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 야훼께서 “예루살렘에 내가 내 이름을 두겠다”라고 말씀하신 야훼의 집에 제단들을 쌓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘야훼의 집’은 히브리어를 직역한 표현이며, ‘야훼의 성전’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: “내 이름을 두겠다”는 야훼께서 선택하신 장소에 자신의 이름과 임재를 연관시키신다는 성전 언약의 표현입니다.
    reason: theological_note
lexical_decisions:
- source_word: וּ/בָנָה
  english_pob_choice: He built
  chosen_korean: 그는 ... 쌓았습니다
  alternatives_korean:
  - 그는 ... 세웠습니다
  - 그는 ... 지었습니다
  lexicon: HALOT
  rationale: 히브리어 완료형 서술을 자연스러운 서사체로 옮기되, 제단을 대상으로 한 동사로는 ‘쌓다’가 가장 직접적입니다.
- source_word: מִזְבְּחֹת
  english_pob_choice: altars
  chosen_korean: 제단들
  alternatives_korean:
  - 제단
  - 제단들
  lexicon: HALOT
  rationale: 복수형을 살려 ‘제단들’로 옮겼습니다. 히브리어의 복수성을 유지하는 편이 본문의 행위의 다수성을 더 분명하게 드러냅니다.
- source_word: בְּ/בֵית יְהוָה
  english_pob_choice: in the house of Yahweh
  chosen_korean: 야훼의 집에
  alternatives_korean:
  - 야훼의 성전에
  - 야훼의 집 안에
  lexicon: HALOT
  rationale: 직역에 가까운 ‘집’을 유지해 히브리어 표현을 보존했습니다. 전통적 ‘성전’도 가능하지만, 원문어의 이미지와 직접성을 살리기 위해 기본 표현을 택했습니다.
- source_word: אֲשֶׁר אָמַר יְהוָה
  english_pob_choice: of which Yahweh had said
  chosen_korean: 야훼께서는 ...라고 말씀하신 곳입니다
  alternatives_korean:
  - 야훼께서 말씀하신 곳입니다
  - 야훼께서 ...라고 말씀하신 바입니다
  lexicon: HALOT
  rationale: 관계절이 앞의 ‘야훼의 집’을 수식하므로 한국어에서는 자연스럽게 ‘곳’으로 받아 연결했습니다. 과거완료의 시간 관계는 문맥상 ‘말씀하신’으로 충분히 드러납니다.
- source_word: אָשִׂים אֶת שְׁמִי
  english_pob_choice: I will put my name
  chosen_korean: 내가 내 이름을 두겠다
  alternatives_korean:
  - 내가 내 이름을 두겠다
  - 내 이름을 두겠다
  lexicon: HALOT
  rationale: ‘name’을 소유격으로 그대로 옮겨 ‘내 이름’을 유지했고, 성전 언약적 관용구를 해치지 않으면서도 자연스러운 한국어 동사 ‘두다’로 표현했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼로 음역하여 하나님의 고유명을 보존했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 본문이 사용하는 신명기적 고유명 יְהוָה를 칭호로 바꾸지 않고, 프로젝트 기준에 따라 ‘야훼’로 옮겨 언약적 이름의 직접성을 살렸습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘내 이름을 두겠다’의 성전 언약 의미
  chosen_reading: 직역적 관용구를 유지해 하나님의 선택과 임재의 함의를 남겼습니다.
  alternative_readings:
  - 내 임재를 두겠다
  - 내 이름을 거기에 두겠다
  rationale: 히브리어는 성전 장소에 대한 신학적 언어를 평이하게 말하므로, 해설적 확장보다 원문 관용구를 보존하는 편이 본문의 긴장을 더 잘 드러냅니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3'
