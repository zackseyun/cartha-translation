translation:
  language: ko
  text: 암몬의 종들이 그를 거슬러 공모하여 왕을 그의 집에서 죽였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 거슬러 모의하여.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  english_pob_choice: conspired
  chosen_korean: 배반하여 모의하고
  alternatives_korean:
  - 모의하고
  - 공모하여
  lexicon: HALOT
  rationale: 정치적 음모를 뜻하는 קשר의 용법을 살려, 단순한 ‘묶다’가 아니라 왕에게 적대적으로 ‘배반하여 모의하다’로 옮겼습니다.
- source_word: עַבְדֵי אָמוֹן
  english_pob_choice: Amon’s servants
  chosen_korean: 암몬의 종들
  alternatives_korean:
  - 암몬의 신하들
  - 암몬의 관리들
  lexicon: HALOT
  rationale: 문맥상 왕실 사람들을 가리키지만, 원문의 소유 관계를 보존하기 위해 ‘종들’로 직역하되 한국어에서 자연스럽게 ‘암몬의 종들’로 표현했습니다.
- source_word: וַיָּמִיתוּ
  english_pob_choice: put the king to death
  chosen_korean: 왕을 ... 죽였습니다
  alternatives_korean:
  - 왕을 죽였습니다
  - 왕을 사형에 처했습니다
  lexicon: HALOT
  rationale: 히필의 사역적 뉘앙스는 ‘죽이다’만으로도 충분히 전달되므로, 과도한 해석을 피하면서도 자연스러운 서술형으로 옮겼습니다.
- source_word: בְּבֵיתוֹ
  english_pob_choice: in his own house
  chosen_korean: 그의 집 안에서
  alternatives_korean:
  - 자기 집 안에서
  - 자기 집에서
  lexicon: HALOT
  rationale: בית + 인칭 접미사는 ‘그의 집’이며, 사건의 장소성을 분명히 하되 ‘own’의 강조는 한국어에서 과도하지 않게 처리했습니다.
