base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew literally, 'filled Jerusalem mouth to mouth,' an idiom meaning throughout the city, from one end to the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 게다가 므낫세는 매우 많은 무죄한 피를 흘려, 예루살렘을 이 끝에서 저 끝까지 가득 채울 정도였습니다. 이는 그가 지은 자기 죄 외에, 유다로 하여금 죄를 짓게 하여 야훼의 눈에 악한 일을 행하게 한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘예루살렘을 입에서 입까지 가득 채웠다’입니다. 이는 도시 전체, 곧 끝에서 끝까지를 뜻하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  english_pob_choice: Moreover
  chosen_korean: 게다가
  alternatives_korean:
  - 또한
  - 그리고도
  - 더욱이
  lexicon: HALOT
  rationale: 앞 문장에 더해지는 추가적 비난이라는 점을 살리면서, 한국어에서 자연스럽고 약간의 강조도 담는 연결어로 옮겼습니다.
- source_word: דָּם נָקִי
  english_pob_choice: innocent blood
  chosen_korean: 무죄한 피
  alternatives_korean:
  - 의로운 피
  - 죄 없는 피
  - 무고한 피
  lexicon: HALOT
  rationale: 히브리어 관용구의 법적·도덕적 무고함을 직접 드러내기 위해 ‘무죄한 피’로 옮겼습니다. ‘무고한 피’도 가능하지만, 본문이 강조하는 ‘죄 없음’의 성격을 더 분명히 했습니다.
- source_word: עַד אֲשֶׁר מִלֵּא אֶת יְרוּשָׁלִַם פֶּה לָפֶה
  english_pob_choice: until he had filled Jerusalem from one end to the other
  chosen_korean: 예루살렘을 이 끝에서 저 끝까지 가득 채울 정도
  alternatives_korean:
  - 예루살렘을 끝에서 끝까지 가득 채울 정도
  - 예루살렘을 입에서 입까지 가득 채울 정도
  lexicon: HALOT
  rationale: 직역하면 ‘입에서 입까지’이지만, 한국어 독자에게는 도시 전체에 걸친 충만함이라는 관용적 의미를 분명하게 전달하는 표현이 더 적절합니다.
- source_word: הֶחֱטִיא אֶת יְהוּדָה
  english_pob_choice: caused Judah to sin
  chosen_korean: 유다로 하여금 죄를 짓게 하여
  alternatives_korean:
  - 유다가 죄를 짓도록 하여
  - 유다를 죄로 이끌어
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살려, 단순한 유혹보다 ‘죄를 짓게 함’이라는 직접적 인과를 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에 악한 일을 행하게
  alternatives_korean:
  - 야훼 보시기에 악한 일을 하게
  - 야훼의 눈앞에서 악을 행하게
  lexicon: HALOT
  rationale: 평가적 관용구를 한국어로 자연스럽게 살리되, 본문이 ‘눈에’라는 비유를 쓰는 점도 보존했습니다.
theological_decisions:
- issue: 여호와 이름 יְהוָה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 신명기적 예배문이 아니라 역사서 서술이므로, 프로젝트 기준에 따라 고유한 하나님의 이름을 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘무죄한 피’의 윤리적 강도
  chosen_reading: 무죄한 피
  alternative_readings:
  - 무고한 피
  - 의로운 피
  rationale: 므낫세의 행위를 단순 폭력보다 더 강한 언약적·법정적 죄책으로 제시하는 문맥을 유지하기 위해 약화하지 않았습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #1 and #5'
