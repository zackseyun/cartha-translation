  yaml_path: translation/ot/2_kings/021/016.yaml
  text: Moreover[a], Manasseh shed very much innocent blood, until he had filled Jerusalem from one end to the other, besides his sin by which he caused Judah to sin, to do what was evil in the eyes of Yahweh.
  footnotes:
  - marker: a
    text: Hebrew literally, 'filled Jerusalem mouth to mouth,' an idiom meaning throughout the city, from one end to the other.
    reason: lexical_alternative
translation:
  language: ko
  text: 또한 므낫세는 유다로 하여금 죄를 짓게 하고 야훼의 눈에 악한 일을 하게 한 그의 죄와는 별도로, 무고한 피를 매우 많이 흘려 예루살렘을 한쪽 끝에서 다른 쪽 끝까지 가득 채웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘예루살렘을 입에서 입까지 가득 채웠다’입니다. 이는 도시 전체, 곧 한쪽 끝에서 다른 쪽 끝까지를 뜻하는 관용구입니다.
    reason: lexical_alternative
