  - 주
  rationale: 본문이 신명기적 예배문이 아니라 역사서 서술이므로, 프로젝트 기준에 따라 고유한 하나님의 이름을 ‘야훼’로 직접 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘무죄한 피’의 윤리적 강도
