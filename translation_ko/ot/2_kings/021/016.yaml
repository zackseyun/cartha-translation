  to: 또한 므낫세는 유다로 하여금 죄를 짓게 하고 야훼의 눈에 악한 일을 하게 한 그의 죄와는 별도로, 무고한 피를 매우 많이 흘려 예루살렘을 한쪽 끝에서 다른 쪽 끝까지 가득 채웠습니다.[a]
  rationale: ‘그의 죄와는 별도로’를 앞의 유혈 행위에 직접 연결하여 לְבַד מֵחַטָּאתוֹ의 부가 관계를 보존했습니다. 유다가 죄를 짓고 야훼의 눈에 악한 일을 하게 된 것은 므낫세가 일으킨 죄라는 사역적 관계를 유지했습니다. 관용구의 의미는 본문에서 자연스럽게 번역하고, 직역은 해당 표현에 붙은 각주로 제시했습니다.
