base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/015.yaml
  text: because they have done what is evil in my eyes and have been provoking me from the day their fathers came out of Egypt to this day[a].
  footnotes:
  - marker: a
    text: Or 'their ancestors came out of Egypt.' The Hebrew reads 'their fathers,' a masculine kinship term used for prior generations.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 내 눈에 악한 것을 행하였고, 그들의 조상들이 이집트에서 나온 날부터 오늘에 이르기까지 나를 계속 분노하게 했기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들의 조상들이 이집트에서 나왔다.' 히브리어는 남성 친족어 '그들의 아버지들'을 쓰지만, 여기서는 이전 세대를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשׂוּ אֶת הָרַע
  english_pob_choice: they have done what is evil
  chosen_korean: 악한 것을 행하였고
  alternatives_korean:
  - 악을 행하였고
  - 악을 했고
  lexicon: HALOT
  rationale: 히브리어 관용구를 자연스러운 현대 한국어로 옮기되, 단순히 '나쁜 일'이 아니라 하나님 보시기에 악한 행위를 드러내도록 했습니다.
- source_word: בְּעֵינַי
  english_pob_choice: in my eyes
  chosen_korean: 내 눈에
  alternatives_korean:
  - 내가 보기에
  - 내 시야에서
  lexicon: HALOT
  rationale: 평가의 관용구를 그대로 살려, 하나님의 판단 기준이라는 뉘앙스를 유지했습니다.
- source_word: וַיִּהְיוּ מַכְעִסִים אֹתִי
  english_pob_choice: and have been provoking me
  chosen_korean: 나를 계속 분노하게 했기 때문입니다
  alternatives_korean:
  - 나를 계속 노하게 했기 때문입니다
  - 나를 격노하게 했기 때문입니다
  lexicon: HALOT
  rationale: 지속적·반복적 행위를 나타내는 구문을 한국어의 '계속'으로 살리고, מַכְעִיסִים의 인과적 의미를 '분노하게 하다'로 옮겼습니다.
- source_word: אֲבוֹתָם
  english_pob_choice: their fathers
  chosen_korean: 그들의 조상들이
  alternatives_korean:
  - 그들의 아버지들이
  - 그들의 선조들이
  lexicon: HALOT
  rationale: 문법적으로는 남성형 친족어이지만, 이 문맥에서는 출애굽 세대부터 이어지는 집단적 역사성을 가리키므로 한국어에서는 더 직접적인 '조상들'로 옮겼습니다.
theological_decisions:
- issue: 출애굽 이후 이어진 공동체적 반역의 역사성
  chosen_reading: 개인 몇 명의 죄가 아니라 출애굽 세대부터 오늘까지 이어진 언약적 반역으로 유지했습니다.
  alternative_readings:
  - 최근 왕들만의 죄로 좁혀 읽는 해석
  rationale: 본문이 '그들의 조상들'과 '오늘에 이르기까지'를 통해 장기간의 역사적 연속성을 명시하므로, 그 신학적 긴장을 풀어버리지 않았습니다.
  doctrine_reference: Translation philosophy §3
