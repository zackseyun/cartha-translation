translation:
  language: ko
  text: 그들이 내 눈에 악을 행하고, 그들의 조상들이[a] 이집트에서 나온 날부터 오늘에 이르기까지 그들이 계속 나를 분노하게 해 왔기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '그들의 아버지들'입니다. 여기서는 이전 세대의 조상들을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשׂוּ אֶת הָרַע
  english_pob_choice: they have done what is evil
  chosen_korean: 악한 것을 행하였고
  alternatives_korean:
