theological_decisions:
- issue: 왕위 계승 연대기 공식의 간결한 서술
  chosen_reading: 서술어를 ‘왕이 되었고…다스렸습니다’로 유지해 본문의 연대기적 사실 진술을 분명히 했습니다.
  alternative_readings:
  - ‘즉위했습니다…재위했습니다’
  - ‘왕이었습니다…다스렸습니다’
  rationale: 이 절은 신학적 해석보다 역사 보고가 중심이므로, 과장 없이 사건 순서를 드러내는 표현을 택했습니다.
  doctrine_reference: 열왕기하의 왕정사 서술 방식
- issue: 출신 표기의 처리
  chosen_reading: ‘야트바 사람입니다’로 번역해 지명 출신을 인물 식별 정보로 보존했습니다.
  alternative_readings:
  - ‘야트바에서 왔습니다’
  - ‘야트바 출신입니다’
  rationale: 히브리어의 מִן은 단순 위치보다 출신/기원 표지가 되므로, 계보 정보의 기능을 유지했습니다.
  doctrine_reference: 족보·출신 표지의 역사적 진술
