base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/019.yaml
  text: Amon was twenty-two years old when he began to reign, and he reigned two years in Jerusalem. His mother’s name was Meshullemeth daughter of Haruz, from Jotbah.
translation:
  language: ko
  text: 아몬은 스물두 살에 왕이 되었고, 예루살렘에서 두 해 동안 다스렸습니다. 그의 어머니의 이름은 하룻의 딸이며 야트바 출신인 므술레멧이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  english_pob_choice: was twenty-two years old
  chosen_korean: 스물두 살에
  alternatives_korean:
  - 스물두 살이었을 때
  - 스물두 살의 아들이었을 때
  lexicon: HALOT
  rationale: 히브리어 연령 관용구를 한국어의 자연스러운 연령 표현으로 옮겼습니다.
- source_word: בְּמָלְכֹו / מָלַךְ
  english_pob_choice: when he began to reign / he reigned
  chosen_korean: 왕이 되었고 / 다스렸습니다
  alternatives_korean:
  - 통치하기 시작했고 / 통치했습니다
  - 즉위했고 / 즉위했습니다
  lexicon: HALOT
  rationale: 앞부분은 즉위 시점을, 뒷부분은 재위의 지속을 나타내므로 한국어에서도 구분을 살려 옮겼습니다.
- source_word: מְשֻׁלֶּמֶת
  english_pob_choice: Meshullemeth
  chosen_korean: 므술레멧
  alternatives_korean:
  - 메슐레멧
  - 메슐렘엣
  lexicon: 표준 외래어 표기 원칙
  rationale: 인명은 현대 외래어 표기 원칙에 따라 음역했습니다.
- source_word: בַּת חָרוּץ
  english_pob_choice: daughter of Haruz
  chosen_korean: 하룻의 딸
  alternatives_korean:
  - 하루스의 딸
  - 하루츠의 딸
  lexicon: HALOT
  rationale: 부계 계보 표현을 한국어의 표준 친족 관계 표현으로 옮겼습니다.
- source_word: מִן יָטְבָה
  english_pob_choice: from Jotbah
  chosen_korean: 야트바 사람입니다
  alternatives_korean:
  - 야트바 출신입니다
  - 야트바에서 왔습니다
  lexicon: HALOT
  rationale: מִן은 출신·기원을 나타내므로, 인명·지명 관계를 한국어에서 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 왕위 계승 연대기 공식의 간결한 서술
  chosen_reading: 서술어를 ‘왕이 되었고…다스렸습니다’로 유지해 본문의 연대기적 사실 진술을 분명히 했습니다.
  alternative_readings:
  - ‘즉위했습니다…재위했습니다’
  - ‘왕이었습니다…다스렸습니다’
  rationale: 이 절은 신학적 해석보다 역사 보고가 중심이므로, 과장 없이 사건 순서를 드러내는 표현을 택했습니다.
  doctrine_reference: 열왕기하의 왕정사 서술 방식
- issue: 출신 표기의 처리
  chosen_reading: ‘야트바 사람입니다’로 번역해 지명 출신을 인물 식별 정보로 보존했습니다.
  alternative_readings:
  - ‘야트바에서 왔습니다’
  - ‘야트바 출신입니다’
  rationale: 히브리어의 מִן은 단순 위치보다 출신/기원 표지가 되므로, 계보 정보의 기능을 유지했습니다.
  doctrine_reference: 족보·출신 표지의 역사적 진술
