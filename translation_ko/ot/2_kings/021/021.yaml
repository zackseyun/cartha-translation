- from: 그는 그의 아버지가 걸었던 모든 길을 따라 걸었고, 그의 아버지가 섬겼던 우상들을 섬겼으며, 그것들에게 절했습니다.[a]
  to: 그는 아버지가 걸어간 모든 길을 따라 걸었고, 아버지가 섬겼던 우상들을 섬겼으며, 그 우상들에게 절했습니다.[a]
  rationale: 수정본은 아버지의 행로를 그대로 따랐다는 첫 구절의 관용적 의미와 ‘걷다’의 비유를 보존하되 한국어 어색함을 줄였습니다. 또한 섬김과 절함을 구별하고, 경멸적인 우상 명칭의 뉘앙스는 과도한 어원 단정 없이 각주에 반영했습니다.
