translation:
  language: ko
  text: 그는 아버지가 걸어간 모든 길을 따라 걸었고, 아버지가 섬겼던 우상들을 섬겼으며, 그 우상들에게 절했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 גִּלֻּלִים은 우상을 경멸적으로 부르는 말입니다. ‘더러운 우상들’ 또는 ‘가증한 우상들’로 옮길 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל הַדֶּרֶךְ אֲשֶׁר הָלַךְ
  english_pob_choice: He walked in all the way that his father had walked
  chosen_korean: 그는 그의 아버지가 걸었던 모든 길을 따라 걸었고
  alternatives_korean:
  - 그는 그의 아버지가 간 모든 길을 따라 갔고
  - 그는 그의 아버지가 걸었던 길을 그대로 따랐고
  lexicon: HALOT
  rationale: הלך의 반복된 ‘걷다/가다’ 이미지를 살리면서, ‘모든 길’은 행실과 삶의 방식이라는 관용적 의미를 자연스럽게 드러냅니다.
- source_word: וַיַּעֲבֹד אֶת הַגִּלֻּלִים
  english_pob_choice: he served the idols
  chosen_korean: 그의 아버지가 섬겼던 우상들을 섬겼으며
  alternatives_korean:
  - 그의 아버지가 예배했던 우상들을 예배했으며
  - 그의 아버지가 섬겼던 우상들을 따랐으며
  lexicon: HALOT
  rationale: עבד는 기본적으로 ‘섬기다’이므로, 앞의 행실 표현과 구별되도록 종교적 충성을 ‘섬겼다’로 옮겼습니다.
- source_word: הַגִּלֻּלִים
  english_pob_choice: the idols
  chosen_korean: 우상들을
  alternatives_korean:
  - 우상들
  - 똥 우상들을
  - 가증한 우상들을
  lexicon: HALOT
  rationale: 원문의 경멸적 뉘앙스는 있으나, 본문 흐름상 대상이 분명하므로 본문은 간명하게 ‘우상들’로 두고 그 경멸성은 주석 없이도 읽히는 범위에 맡겼습니다.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  english_pob_choice: and bowed down to them
  chosen_korean: 그것들에게 절했습니다
  alternatives_korean:
  - 그것들 앞에 엎드렸습니다
  - 그것들에게 경배했습니다
  lexicon: HALOT
  rationale: שׁחה는 몸을 굽혀 절하는 행위이므로, ‘경배하다’보다 물리적 동작이 드러나는 ‘절하다’를 택했습니다.
theological_decisions:
- issue: גִּלֻּלִים의 경멸적 뉘앙스 처리
  chosen_reading: 본문에는 중립적인 ‘우상들’을 쓰고, 원문의 멸시적 어감은 과도하게 부풀리지 않았습니다.
  alternative_readings:
  - 똥 우상들
  - 가증한 우상들
  - 더러운 우상들
  rationale: 이 절의 중심은 왕이 아버지의 길을 그대로 따른다는 반복 구조와 우상숭배의 사실에 있으므로, 본문 가독성을 해치지 않는 범위에서만 의미를 전달하는 것이 적절합니다.
  doctrine_reference: Translation philosophy §6; §5 consistency of key terms
