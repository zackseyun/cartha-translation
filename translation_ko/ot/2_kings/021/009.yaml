  yaml_path: translation/ot/2_kings/021/009.yaml
  text: But they did not listen[b][a], and Manasseh led them astray to do more evil than the nations that Yahweh had destroyed before the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'to do evil more than the nations.' The Hebrew comparison is expressed with 'from/than the nations.'
    reason: lexical_alternative
  - marker: b
    text: 'Or ''the Israelites.'' Hebrew: ''the sons of Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그들은 듣지 않았고, 므낫세는 그들을 야훼께서 이스라엘 자손 앞에서 멸하신 민족들보다 더 악한 일을 하도록 그릇된 길로 이끌었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘민족들보다’는 히브리어의 מִן 비교용법을 반영한 것입니다.
    reason: source_note
  - marker: b
    text: 히브리어는 문자적으로 ‘이스라엘의 아들들’입니다.
    reason: source_note
lexical_decisions:
- source_word: וְלֹ֖א שָׁמֵ֑עוּ
  english_pob_choice: did not listen
  chosen_korean: 듣지 않았고
  alternatives_korean:
  - 듣지 않았습니다
  - 귀를 기울이지 않았고
  - 순종하지 않았고
  lexicon: HALOT
  rationale: שׁמע는 단순 청취보다 응답을 포함한 ‘듣다/경청하다’의 뜻이므로, 본문에서는 예언적 경고를 받아들이지 않았다는 의미를 살려 ‘듣지 않았고’로 옮겼습니다.
- source_word: וַיַּתְעֵם
  english_pob_choice: led them astray
  chosen_korean: 그들을 ... 그릇된 길로 이끌었습니다
  alternatives_korean:
  - 그들을 미혹했습니다
  - 그들을 잘못된 길로 인도했습니다
  - 그들을 방황하게 했습니다
  lexicon: HALOT
  rationale: הִתְעָה/תעה 계열의 사역형은 도덕적·영적 오도라는 뜻이므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘그릇된 길로 이끌었습니다’를 사용했습니다.
- source_word: מִן הַגּוֹיִם
  english_pob_choice: than the nations
  chosen_korean: 민족들보다
  alternatives_korean:
  - 나라들보다
  - 이방 민족들보다
  - 열국보다
  lexicon: HALOT
  rationale: 여기서 מִן은 비교 용법이므로 한국어에서도 비교 표지 ‘-보다’를 반영했습니다. גּוֹיִם은 이 역사 문맥에서 주변 민족들을 가리키므로 ‘민족들’이 가장 무난합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명은 전통 대체어가 아니라 고유명사로 처리하여, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל의 표현
  chosen_reading: 이스라엘 자손
  alternative_readings:
  - 이스라엘 사람들
  - 이스라엘 백성
  rationale: 히브리어의 직역 구조를 살리되 한국어 독자가 자연스럽게 읽을 수 있도록 ‘이스라엘 자손’을 유지했습니다. 남성 복수 형태의 원형도 보존됩니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy §4: Gender-accurate over gender-neutral'
