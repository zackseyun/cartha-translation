  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/הֶעֱבִ֤יר אֶת בְּנ/וֹ֙ בָּ/אֵ֔שׁ וְ/עוֹנֵ֣ן וְ/נִחֵ֔שׁ וְ/עָ֥שָׂה א֖וֹב וְ/יִדְּעֹנִ֑ים הִרְבָּ֗ה לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִֽיס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/006.yaml
  text: He made his son pass through the fire[a], practiced soothsaying and divination, and dealt with mediums and spiritists. He multiplied doing what was evil in the eyes of Yahweh[c][b], provoking him to anger.
  footnotes:
  - marker: a
    text: Or, more explicitly, 'He sacrificed his son in the fire.' The Hebrew idiom is literally 'made his son pass through the fire.'
    reason: alternative_reading
  - marker: b
    text: '''Divination'' may also be rendered ''interpreted omens.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'consulted mediums and spiritists.' The Hebrew idiom is difficult and may denote involvement with such practitioners more broadly.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 자기 아들을 불 가운데로 지나가게 했고[a], 점술을 행하고 징조를 점쳤으며[b], 영매와 신접한 자들을 가까이했습니다[c]. 그는 야훼께서 보시기에 악을 크게 행하여 그분을 진노하게 했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구를 문자적으로 옮기면 ‘그의 아들을 불 가운데로 지나가게 하다’입니다. 아들을 불에 바치는 희생 제의를 가리킨다고 이해할 수도 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘징조를 점쳤으며’는 ‘점복을 행했으며’ 또는 ‘징조를 해석했으며’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 표현은 직역하기 어려우며, 영매와 신접한 자들을 이용하거나 그들과 관계한 것을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱבִיר אֶת בְּנוֹ בָּאֵשׁ
  english_pob_choice: He made his son pass through the fire
  chosen_korean: 자기 아들을 불로 지나가게 했고
  alternatives_korean:
  - 자기 아들을 불 속으로 지나가게 했고
  - 자기 아들을 불에 바쳤고
  - 자기 아들을 불로 제물로 삼았고
  lexicon: HALOT
  rationale: 히브리어 관용구를 본문에서 그대로 살리되, 한국어로는 ‘불로 지나가게 하다’로 자연스럽게 옮겨 제의적·폭력적 뉘앙스를 유지했습니다.
- source_word: וְעוֹנֵן
  english_pob_choice: practiced soothsaying
  chosen_korean: 점술
  alternatives_korean:
  - 무당질
  - 주술
  - 점치는 일
  lexicon: HALOT
  rationale: 금지된 예언적 점술 행위를 가리키므로, 현대 한국어에서 뜻이 분명한 ‘점술’로 압축해 옮겼습니다.
- source_word: וְנִחֵשׁ
  english_pob_choice: divination
  chosen_korean: 점복
  alternatives_korean:
  - 복점
  - 징조풀이
  - 점괘 해석
  lexicon: HALOT
  rationale: 앞의 ‘점술’과 구별되는 또 다른 점복 행위로 읽히므로, 너무 일반적인 ‘예언’이 아니라 ‘점복’으로 대응시켰습니다.
- source_word: וְעָשָׂה א֖וֹב וְיִדְּעֹנִים
  english_pob_choice: dealt with mediums and spiritists
  chosen_korean: 영매들과 영들 부리는 자들을 찾아다녔으며
  alternatives_korean:
  - 영매들과 주술사들을 상담했으며
  - 무당들과 신접한 자들을 이용했으며
  - 영매들과 점술가들을 접촉했으며
  lexicon: HALOT
  rationale: 직역하면 ‘오브와 지드오님을 만들다’라는 난해한 관용구이므로, 특정 행위로 과도하게 좁히지 않으면서 관련자들과의 적극적 연루를 드러내는 표현을 택했습니다.
- source_word: הִרְבָּה לַעֲשׂוֹת הָרַע
  english_pob_choice: He multiplied doing what was evil
  chosen_korean: 악한 일을 더욱 많이 행하여
  alternatives_korean:
  - 악을 크게 행하여
  - 계속해서 악을 행하여
  - 악을 거듭 행하여
  lexicon: HALOT
  rationale: ‘히르바’의 증강 의미를 살리되 한국어 어법에 맞게 ‘더욱 많이 행하다’로 풀어, 단순한 반복보다 악의 증대를 드러냈습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the eyes of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼의 관점에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: 평가적 관용구를 직설적으로 살려, 행위의 도덕적 기준이 야훼에게 있음을 분명하게 했습니다.
- source_word: לְהַכְעִיס
  english_pob_choice: provoking him to anger
  chosen_korean: 그분을 진노하게 했습니다
  alternatives_korean:
  - 그분을 화나게 했습니다
  - 그분의 분노를 자극했습니다
  - 그분을 노하게 했습니다
  lexicon: HALOT
  rationale: 결과적 의미를 한국어 자연문으로 옮겨, 단순 감정 자극이 아니라 언약적 진노를 불러일으킨다는 점을 유지했습니다.
theological_decisions:
- issue: 아들을 불로 지나가게 했다는 표현의 해석 수준
  chosen_reading: 본문에서는 히브리어 관용구를 유지하고, 한국어도 ‘불로 지나가게 했고’로 번역해 제의적 폭력의 가능성을 열어 둡니다.
  alternative_readings:
  - 자기 아들을 불에 바쳤고
  - 자기 아들을 불로 제물로 삼았고
  - 자기 아들을 불살랐고
  rationale: 원문은 관용구로 말하고 있으므로, 더 단정적인 재구성은 본문이 직접 말한 것보다 강합니다. 독자가 희생 제의의 가능성을 읽어 내도록 두되, 번역문 자체는 과도하게 특정하지 않았습니다.
  doctrine_reference: '번역 원칙: 원문 우선, 해석 과잉 금지, 긴장 보존'
- issue: יהוה의 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트의 고정 규정에 따라 본문과 평가구 모두에서 야훼를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
