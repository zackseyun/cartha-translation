id: 2KI.21.25
reference: 2 Kings 21:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֶ֛תֶר דִּבְרֵ֥י אָמ֖וֹן אֲשֶׁ֣ר עָשָׂ֑ה הֲ/לֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/025.yaml
  text: Now the rest of the acts of Amon[b][a], what he did—are they not written in the Book of the Chronicles of the Kings of Judah?
  footnotes:
  - marker: a
    text: Or 'deeds' for 'acts'; Hebrew דִּבְרֵי literally means 'words' or 'matters,' but in this royal-summary formula it refers to the king's recorded acts.
    reason: lexical_alternative
  - marker: b
    text: '''Book'' refers to an ancient written record, likely a scroll; the phrase could also be rendered ''the annals of the Kings of Judah.'''
    reason: cultural_note
translation:
  language: ko
  text: 아몬의 남은 행적, 곧 그가 한 일은 유다 왕들의 역대기 책에 기록되어 있지 않습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘행적’은 히브리어 דִּבְרֵי를 이 문맥에서 풀어 옮긴 것으로, 문자적으로는 ‘말들’ 또는 ‘사안들’이라는 뜻도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘역대기 책’은 고대 왕실의 연대기 기록물을 가리키는 표현입니다. 실제로는 두루마리 형태의 기록이었을 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: וְיֶתֶר
  english_pob_choice: Now the rest of
  chosen_korean: 이제 … 남은 행적
  alternatives_korean:
  - 그리고 … 나머지
  - 아몬의 남은 일들
  lexicon: HALOT
  rationale: יֶתֶר의 ‘남은 것/나머지’ 의미를 살리면서, 왕조 연대기 서술에서 자연스러운 서두로 ‘이제’를 넣어 연결했습니다.
- source_word: דִּבְרֵי
  english_pob_choice: acts
  chosen_korean: 행적
  alternatives_korean:
  - 말들
  - 일들
  - 행동들
  lexicon: HALOT
  rationale: 문자적으로는 ‘말/사안’이지만, 왕정 결산 공식에서는 기록된 행위들을 가리키므로 ‘행적’이 가장 간결하고 문맥에 맞습니다.
- source_word: הֲלֹא הֵם כְּתוּבִים
  english_pob_choice: are they not written
  chosen_korean: 기록되어 있지 않습니까
  alternatives_korean:
  - 쓰여 있지 않습니까
  - 기록되어 있지 않느냐
  lexicon: HALOT
  rationale: 수사 의문문을 한국어에서 자연스럽게 옮겨, 원문의 기대 답변을 살리되 문체는 합쇼체로 유지했습니다.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 역대기
  alternatives_korean:
  - 유다 왕들의 연대기
  - 유다 왕들의 기록
  lexicon: HALOT
  rationale: 왕실 연대기라는 제목형 표현으로 보아 ‘역대기’가 가장 자연스럽고, ‘유다 왕들’의 소속 관계를 분명히 했습니다.
theological_decisions:
- issue: 히브리어 수사 의문문의 전달
  chosen_reading: 본문을 정보 요청이 아니라 기록을 상기시키는 수사 의문문으로 옮겼습니다.
  alternative_readings:
  - 기록되어 있습니다
  - 기록되지 않았습니까
  rationale: 원문의 הֲלֹא는 단순 사실 질문이 아니라 독자가 이미 알고 있는 기록을 환기하는 표현이므로, 한국어에서도 같은 기능을 유지했습니다.
  doctrine_reference: 서사문맥과 수사 장치 보존
- issue: ‘Book’의 물성
  chosen_reading: ‘책’보다 ‘기록/역대기’의 의미를 살려 번역했습니다.
  alternative_readings:
  - 책
  - 두루마리
  rationale: 여기서는 실제 책의 형식보다 왕조 기록물이라는 기능이 중요하므로, 현대 독자에게는 ‘역대기’가 가장 정확한 전달입니다.
  doctrine_reference: 고대 기록 관용구
