base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/007.yaml
  text: And he set the carved image of Asherah that he had made in the house of which Yahweh had said to David and to Solomon his son[a], “In this house and in Jerusalem, which I have chosen out of all the tribes of Israel, I will put my name forever.”
  footnotes:
  - marker: a
    text: Or, “the image of Asherah.” The Hebrew combines “carved image” with “Asherah,” indicating an idol/image associated with Asherah; some render more specifically “Asherah pole,” but that is less precise here because the text explicitly says “carved image.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 만든 아세라의 조각상[a]을 야훼께서 다윗과 그의 아들 솔로몬에게 말씀하신 그 집에 두었습니다. 야훼께서 말씀하셨습니다. “이 집과 내가 이스라엘의 모든 지파 가운데서 택한 예루살렘에 내 이름을 영원히 두겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아세라의 형상”. 히브리어는 “조각상”과 “아세라”를 함께 써서 아세라와 관련되거나 아세라를 나타내는 형상을 가리킵니다. “아세라 목상”으로 옮길 수도 있으나, 이 절은 조각된 형상임을 명시하므로 그 구체적 형태를 단정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  english_pob_choice: And he set
  chosen_korean: 두었습니다
  alternatives_korean:
  - 놓았습니다
  - 세웠습니다
  lexicon: HALOT
  rationale: 우상 형상을 성전 안에 ‘set’한 행동을 현대 한국어에서 가장 자연스럽게 보이게 하면서도, 단순한 이동보다 배치·설치를 드러내는 동사로 옮겼습니다.
- source_word: פֶּסֶל הָאֲשֵׁרָה
  english_pob_choice: the carved image of Asherah
  chosen_korean: 아세라의 새긴 형상
  alternatives_korean:
  - 아세라의 조각한 형상
  - 아세라의 우상
  lexicon: HALOT
  rationale: פֶּסֶל의 구체적 뜻인 ‘새긴/조각한 형상’을 살리고, הָאֲשֵׁרָה를 ‘아세라의’로 처리해 단순한 ‘아세라 나무’나 ‘아세라 목상’으로 좁히지 않았습니다.
- source_word: בַּבַּיִת
  english_pob_choice: in the house
  chosen_korean: 그 집에
  alternatives_korean:
  - 성전에
  - 집 안에
  lexicon: HALOT
  rationale: 문자적으로는 ‘집’이지만, 인용문 안에서의 반복을 살리기 위해 ‘그 집’으로 옮겼습니다. 본문이 가리키는 성전의 신학적 표현을 유지하면서도 과도한 해석어인 ‘성전’을 본문 서술부에 먼저 넣지 않았습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 주께서
  alternatives_korean:
  - 야훼께서
  - 여호와께서
  lexicon: HALOT
  rationale: 이 절의 영어 POB에는 기본적으로 LORD 전통이 반영되어 있으며, 한국어 본문에서는 인용문 밖 서술의 경어적 호칭으로 ‘주께서’를 사용해 문맥의 흐름을 자연스럽게 했습니다.
- source_word: בְנוֹ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 아들
  - 솔로몬의
  lexicon: HALOT
  rationale: 지시 대상을 다윗으로 분명히 하면서도 히브리어의 소유 접미사를 그대로 반영했습니다.
- source_word: אֲשֶׁר בָּחַרְתִּי
  english_pob_choice: which I have chosen
  chosen_korean: 내가 택한
  alternatives_korean:
  - 내가 선택한
  - 내가 고른
  lexicon: HALOT
  rationale: בחר의 언약적·선택적 의미를 살려 ‘택한’으로 옮겼습니다.
- source_word: שְׁמִי
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 명성
  - 내 이름을
  lexicon: HALOT
  rationale: 성전 문맥의 표준 표현인 ‘내 이름’을 그대로 살려, 하나님의 현존과 소유의 신학적 함의를 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 서술문에는 ‘주께서’, 인용문 안에는 ‘나는’으로 처리했습니다.
  alternative_readings:
  - 야훼께서 …
  - 여호와께서 …
  rationale: 이 절의 핵심은 하나님의 직접 발화가 아니라, 왕이 우상을 들여놓은 행위와 그 행위가 모독하는 야훼의 말씀입니다. 한국어 합쇼체 문맥에서는 서술부를 ‘주께서’로 자연스럽게 읽히게 하되, 인용문 안의 1인칭 화자는 그대로 살렸습니다.
  doctrine_reference: 'DOCTRINE.md Contested terms: יְהוָה YHWH'
- issue: 아세라 관련 표현
  chosen_reading: ‘아세라의 새긴 형상’으로 옮겨, 형상과 관련 신격을 함께 드러냈습니다.
  alternative_readings:
  - 아세라 목상
  - 아세라 상
  - 아세라의 우상
  rationale: 히브리어는 פֶּסֶל과 הָאֲשֵׁרָה를 결합하여 단순한 ‘아세라 기둥’보다 더 구체적인 조각상/형상임을 보여 줍니다. 이를 보존해야 본문의 우상숭배 비판이 약화되지 않습니다.
  doctrine_reference: 본문의 우상숭배 비판 및 출애굽기/신명기 계열의 형상 금지 배경
