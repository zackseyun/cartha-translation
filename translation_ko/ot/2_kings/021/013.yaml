id: 2KI.21.13
reference: 2 Kings 21:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָטִ֣יתִי עַל יְרוּשָׁלִַ֗ם אֵ֚ת קָ֣ו שֹֽׁמְר֔וֹן וְ/אֶת מִשְׁקֹ֖לֶת בֵּ֣ית אַחְאָ֑ב וּ/מָחִ֨יתִי אֶת יְרוּשָׁלִַ֜ם כַּֽ/אֲשֶׁר יִמְחֶ֤ה אֶת הַ/צַּלַּ֨חַת֙ מָחָ֔ה וְ/הָפַ֖ךְ עַל פָּנֶֽי/הָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/013.yaml
  text: And I will stretch over Jerusalem the measuring line of Samaria and the plumb line of the house of Ahab[a], and I will wipe Jerusalem as one wipes a dish[b], wiping it and turning it upside down.
  footnotes:
  - marker: a
    text: Or 'builder’s line of Samaria' and 'plummet of the house of Ahab.' The imagery is of measuring Jerusalem for judgment by the same standard used against them.
    reason: lexical_alternative
  - marker: b
    text: Or 'bowl' instead of 'dish.'
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 예루살렘 위에 사마리아의 측량줄과 아합 집의 추를 펴고, 예루살렘을 사람이 접시를 닦듯이 닦아 내되, 닦고 뒤집어엎겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָטִיתִי
  english_pob_choice: And I will stretch over
  chosen_korean: 펴고
  alternatives_korean:
  - 펼치고
  - 펴서 얹고
  lexicon: HALOT
  rationale: 측량줄을 위에 ‘stretch over’ 하는 동작을 한국어로는 ‘펴고’가 가장 자연스럽고, 이어지는 심판 표상을 구체적으로 살립니다.
- source_word: קָו שֹׁמְרוֹן
  english_pob_choice: the measuring line of Samaria
  chosen_korean: 사마리아의 측량줄
  alternatives_korean:
  - 사마리아의 줄
  - 사마리아의 건축줄
  lexicon: HALOT
  rationale: קָו는 단순한 ‘선’보다 측량에 쓰는 줄의 이미지가 강하므로, 심판을 위한 재는 도구라는 뜻이 드러나도록 ‘측량줄’로 옮겼습니다.
- source_word: מִשְׁקֹלֶת בֵּית אַחְאָב
  english_pob_choice: the plumb line of the house of Ahab
  chosen_korean: 아합 집의 추
  alternatives_korean:
  - 아합 집의 수직추
  - 아합의 왕가의 추
  lexicon: HALOT
  rationale: מִשְׁקֹלֶת은 ‘plumb line’의 뜻을 담는 무게추이므로, 한국어에서는 도구의 핵심을 살린 ‘추’로 옮기되 ‘아합 집’이라는 왕조 표현은 그대로 유지했습니다.
- source_word: וּמָחִיתִי ... כַּאֲשֶׁר יִמְחֶה אֶת הַצַּלַּחַת ... וְהָפַךְ עַל פָּנֶיהָ
  english_pob_choice: and I will wipe Jerusalem as one wipes a dish, wiping it and turning it upside down
  chosen_korean: 예루살렘을 사람이 접시를 닦듯이 닦아 내되, 닦고 뒤집어엎겠습니다
  alternatives_korean:
  - 예루살렘을 접시를 닦듯이 닦아 버리되, 닦고 뒤집겠습니다
  - 예루살렘을 접시를 씻어 내듯 닦아 내되, 닦고 뒤집어엎겠습니다
  lexicon: HALOT
  rationale: 연속 동사들의 강한 파괴 이미지를 살리기 위해 ‘닦아 내다’를 기본으로 하고, 마무리 동작은 ‘뒤집어엎다’로 옮겨 접시를 엎는 장면을 분명하게 했습니다.
theological_decisions:
- issue: 사마리아와 아합 집의 기준을 예루살렘에 적용하는 심판 표상
  chosen_reading: 예루살렘은 사마리아와 아합 집에 이미 적용된 동일한 심판의 기준으로 재어지고 닦여 없어지는 대상으로 제시됩니다.
  alternative_readings:
  - 건축이나 회복의 도구로 읽는 가능성
  - 단순한 수사적 과장으로 약화시키는 읽기
  rationale: 문맥과 뒤따르는 ‘접시를 닦듯이’라는 비유가 파괴와 소멸을 분명히 하므로, 측량 도구의 심판적 의미를 유지해야 합니다.
  doctrine_reference: 예언적 심판의 공정성 및 역사적 동일 기준 적용
