review_pass:
  verdict: revise
  source_fidelity: 전반적으로 히브리어의 심판 비유와 동사 반복을 충실히 반영합니다. 다만 מִשְׁקֹלֶת은 단순한 일반 ‘추’보다 수직을 재는 도구인 ‘수직추’로 옮기는 편이 정확합니다. 또한 ‘닦아 내되, 닦고’는 같은 동작의 반복을 살리려 한 것이나 한국어 문장 안에서는 다소 부자연스럽고, ‘닦아 내다’는 원문의 단순한 ‘닦다’보다 소거의 뜻을 조금 더 보탭니다.
  naturalness: ‘사람이 접시를 닦듯이 닦아 내되, 닦고 뒤집어엎겠습니다’는 반복의 대상과 연결이 매끄럽지 않습니다. 접시를 닦고 엎는 일련의 동작을 하나의 비교절로 처리하면 현대 표준 한국어 합쇼체에서 더 자연스럽습니다.
  terminology: ‘측량줄’, ‘사마리아’, ‘아합 집’, ‘예루살렘’은 적절합니다. מִשְׁקֹלֶת에는 ‘수직추’를 사용하여 측량 도구의 기능을 분명히 하는 것이 좋습니다. ‘아합 집’은 왕조를 가리키는 원문의 표현을 보존합니다.
  issues:
  - severity: medium
    issue: ‘아합 집의 추’
    rationale: מִשְׁקֹלֶת은 건축·측량 문맥에서 수직을 재는 추(plummet/plumb)입니다. ‘추’만으로도 가능하지만 일반적인 무게추로 이해될 수 있으므로 ‘수직추’가 더 정확합니다.
  - severity: low
    issue: ‘닦아 내되, 닦고’의 연결
    rationale: 원문의 반복은 닦는 행위를 강조하지만, 현 번역은 한국어에서 동일 행위가 왜 두 번 이어지는지 불분명합니다. 비교절 안에 ‘닦고 뒤집어엎듯이’라고 두어 접시의 동작을 자연스럽게 표현할 수 있습니다.
  revised_text: 내가 예루살렘 위에 사마리아의 측량줄과 아합 집의 수직추를 펴고, 예루살렘을 사람이 접시를 닦고 뒤집어엎듯이 닦겠습니다.
