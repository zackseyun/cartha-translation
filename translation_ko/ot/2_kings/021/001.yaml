revisions:
- from: 므낫세는 왕이 될 때 열두 살이었고, 예루살렘에서 오십오 년 동안 다스렸습니다. 그의 어머니의 이름은 헤프치바였습니다.[a]
  to: 므낫세는 왕위에 올랐을 때 열두 살이었습니다. 그는 예루살렘에서 오십오 년 동안 다스렸습니다. 그의 어머니의 이름은 헵시바였습니다.[a]
  rationale: 즉위 시점을 더 정확히 드러내도록 ‘왕이 될 때’를 ‘왕위에 올랐을 때’로 수정하고, 인명을 한국어 성경의 통용 표기인 ‘헵시바’로 통일했습니다. 각주는 히브리어 인명의 의미를 자연스러운 한국어로 설명하되, 본문에서는 음역을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:55:26Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 왕위 계승 시점, 즉 ‘그가 왕이 되었을 때’라는 의미는 보존되어 있으나, 초안의 ‘왕이 될 때’는 아직 왕이 되기 전의 상황으로도 읽힐 수 있습니다. ‘왕위에 올랐을 때’가 בְּמָלְכוֹ의 완료된 즉위 시점을 더 정확히 나타냅니다. 재위 기간과 어머니 이름은 원문에 충실합니다.
  naturalness: ‘므낫세는 왕위에 올랐을 때 열두 살이었습니다. 그는 … 다스렸습니다’는 현대 표준 한국어의 자연스러운 합쇼체이며, 긴 문장을 나누어 주어와 사건 순서가 분명합니다.
  terminology: ‘므낫세’와 ‘헵시바’는 한국어 성경에서 널리 쓰이는 인명 표기입니다. ‘헤프치바’보다 ‘헵시바’가 한국어 성경 독자에게 더 익숙하고 일관된 표기입니다. 이름 뜻은 본문이 아니라 각주에 유지합니다.
  issues:
  - severity: medium
    issue: ‘왕이 될 때’의 시점 표현
    rationale: 원문의 בְּמָלְכוֹ는 그의 통치가 시작된 때, 곧 왕이 되었을 때를 가리킵니다. ‘왕이 될 때’는 미래적·과정적 뉘앙스를 낼 수 있으므로 ‘왕위에 올랐을 때’로 바로잡는 것이 안전합니다.
  - severity: low
    issue: 인명 표기 ‘헤프치바’
    rationale: 한국어 성경의 통용 표기인 ‘헵시바’를 쓰는 편이 자연스럽고 독자 인식에 도움이 됩니다. 이는 원문의 인명을 음역한다는 원칙을 유지합니다.
  revised_text: 므낫세는 왕위에 올랐을 때 열두 살이었습니다. 그는 예루살렘에서 오십오 년 동안 다스렸습니다. 그의 어머니의 이름은 헵시바였습니다.[a]
