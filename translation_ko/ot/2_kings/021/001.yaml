  text: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙ מְנַשֶּׁ֣ה בְ/מָלְכ֔/וֹ וַ/חֲמִשִּׁ֤ים וְ/חָמֵשׁ֙ שָׁנָ֔ה מָלַ֖ךְ בִּ/ירוּשָׁלִָ֑ם וְ/שֵׁ֥ם אִמּ֖/וֹ חֶפְצִי בָֽהּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/001.yaml
  text: Manasseh was twelve years old when he began to reign[a], and he reigned fifty-five years in Jerusalem. His mother’s name was Hephzibah.
  footnotes:
  - marker: a
    text: Hephzibah means approximately, “My delight is in her.”
    reason: cultural_note
translation:
  language: ko
  text: 므낫세는 왕이 될 때 열두 살이었고, 예루살렘에서 오십오 년 동안 다스렸습니다. 그의 어머니의 이름은 헤프치바였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 헤프치바는 대략 “나의 기쁨이 그녀에게 있다”라는 뜻입니다.
    reason: cultural_note
lexical_decisions:
- source_word: בֶּן שְׁתֵּ֨ים עֶשְׂרֵ֤ה שָׁנָה֙
  english_pob_choice: was twelve years old
  chosen_korean: 열두 살이었고
  alternatives_korean:
  - 열두 해의 아들이었고
  - 열두 살 때
  lexicon: HALOT
  rationale: 히브리어 나이 관용구를 자연스러운 현대 한국어로 옮기되, 연대기적 서술 흐름에 맞게 상태 서술로 처리했습니다.
- source_word: בְמָלְכ֔וֹ
  english_pob_choice: when he began to reign
  chosen_korean: 왕이 될 때
  alternatives_korean:
  - 그가 다스리기 시작했을 때
  - 그가 왕이 되었을 때
  lexicon: HALOT
  rationale: בה + 동사형이 통치 시작 시점을 나타내므로, regnal formula의 의미를 살려 ‘왕이 될 때’로 옮겼습니다.
- source_word: מָלַ֖ךְ
  english_pob_choice: he reigned
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 왕이었습니다
  lexicon: HALOT
  rationale: 본문의 왕정 공식에서 מלך는 단순 존재보다 통치 행위를 가리키므로 ‘다스리다’로 옮겼습니다.
- source_word: חֶפְצִי בָהּ
  english_pob_choice: Hephzibah
  chosen_korean: 헤프치바
  alternatives_korean:
  - 헵시바
  - 헤프시바
  lexicon: 표준 외래어 표기
  rationale: 인명은 통용되는 음역을 따르되, 영어 POB처럼 의미 번역을 본문에 넣지 않고 음역으로 처리했습니다.
theological_decisions:
- issue: 왕정 연대기 공식의 서술 방식
  chosen_reading: 연대기적 사실 전달에 맞춰 평서형으로 옮기고, 통치 시작과 통치 기간을 분명히 구분했습니다.
  alternative_readings:
  - ‘왕이 되기 시작했을 때’로 더 직역
  - ‘왕으로 다스렸다’로 축약
  rationale: 이 절은 신학적 논평보다 역사 기록의 정확성이 핵심이므로, 본문의 왕위 개시와 재위 기간을 분리해 읽히도록 했습니다.
  doctrine_reference: 역사서의 서술 정확성
- issue: 어머니 이름의 처리
  chosen_reading: ‘Hephzibah’는 의미 번역 대신 음역을 유지했습니다.
  alternative_readings:
  - ‘내 기쁨이 그녀에게 있다’로 의미 번역
  rationale: 본문은 인명을 제시하는 문맥이므로, 영어 POB도 주석에서만 의미를 밝히고 본문은 이름을 보존합니다.
  doctrine_reference: 고유명사 처리 원칙
