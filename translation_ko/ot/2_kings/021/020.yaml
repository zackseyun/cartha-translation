translation:
  language: ko
  text: 그는 야훼의 눈에 악한 일을 행하였는데, 그의 아버지 므낫세가 행한 것과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '히브리어 직역: ‘야훼의 눈에’.'
