lexical_decisions:
- source_word: וַיַּעַשׂ
  english_pob_choice: He did
  chosen_korean: 행하였는데
  alternatives_korean:
  - 하였습니다
  - 했고
  lexicon: HALOT
  rationale: 서사 진행을 자연스럽게 잇되, 앞 절과의 연결을 보이기 위해 종결을 완전히 닫지 않는 형태로 옮겼습니다.
- source_word: הָרַע
  english_pob_choice: what was evil
  chosen_korean: 악한 일
  alternatives_korean:
  - 악
  - 악한 것
  lexicon: HALOT
  rationale: עשה הרע의 관용적 표현을 한국어에서 자연스러운 행위 표현인 ‘악한 일’로 옮겨, 평가적 의미를 유지했습니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼의 눈에
  alternatives_korean:
  - 야훼 보시기에
  - 야훼 앞에서
  lexicon: HALOT
  rationale: 히브리어의 직유적 평가 관용구를 살려 ‘눈에’로 번역하고, 본문상의 신명은 원문 가이드를 따라 야훼로 옮겼습니다.
- source_word: כַּאֲשֶׁר עָשָׂה
  english_pob_choice: just as Manasseh his father had done
  chosen_korean: 그의 아버지 므낫세가 행한 것과 같았습니다
  alternatives_korean:
  - 아버지 므낫세가 한 것과 같이 하였습니다
  - 그의 아버지 므낫세가 했던 것처럼 하였습니다
  lexicon: HALOT
  rationale: 비교구문 כַּאֲשֶׁר를 ‘...과 같았습니다’로 옮겨 동일성/비교의 힘을 살리고, 완료 의미는 한국어 과거로 충분히 드러낸다고 보았습니다.
- source_word: מְנַשֶּׁה אָבִיו
  english_pob_choice: Manasseh his father
  chosen_korean: 그의 아버지 므낫세
  alternatives_korean:
  - 아버지 므낫세
  - 므낫세 그의 아버지
  lexicon: HALOT
  rationale: 관계 표현을 한국어 어순에 맞게 재배열하되, 소유격 ‘his father’의 관계를 분명히 유지했습니다.
theological_decisions:
- issue: יְהוָה의 한국어 처리
  chosen_reading: 본문의 평가 구문은 ‘야훼’로 옮겨 신명 자체를 드러냈습니다.
  alternative_readings:
  - 여호와
  - 주님
  - 주
  rationale: 원문과 POB 규범에 따라 יהוה를 제목적 대치어가 아니라 고유명으로 보존하는 것이 본문의 신학적·언어학적 대조를 더 정확히 드러냅니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
