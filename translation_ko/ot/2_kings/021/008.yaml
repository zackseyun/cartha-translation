  text: וְ/לֹ֣א אֹסִ֗יף לְ/הָנִיד֙ רֶ֣גֶל יִשְׂרָאֵ֔ל מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לַֽ/אֲבוֹתָ֑/ם רַ֣ק אִם יִשְׁמְר֣וּ לַ/עֲשׂ֗וֹת כְּ/כֹל֙ אֲשֶׁ֣ר צִוִּיתִ֔י/ם וּ/לְ/כָל הַ֨/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה אֹתָ֖/ם עַבְדִּ֥/י מֹשֶֽׁה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/008.yaml
  text: And I will not again make Israel’s foot wander from the land that I gave to their fathers[a], if only they are careful to do according to all that I commanded them[c][b], and according to all the law that my servant Moses commanded them.
  footnotes:
  - marker: a
    text: Or 'make Israel move' / 'remove Israel from the land.' The Hebrew literally says 'make Israel’s foot wander,' preserving the image of displacement.
    reason: lexical_alternative
  - marker: b
    text: Or 'their ancestors.' Hebrew 'their fathers' is a covenantal expression for the forefathers of Israel.
    reason: lexical_alternative
  - marker: c
    text: '''The law'' may also be rendered ''the instruction''; here it refers to the Mosaic Torah commanded through Moses.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 다시는 이스라엘의 발을 내가 그들의 조상들에게 준 땅에서 떠돌게 하지 않겠습니다. 오직 그들이 내가 그들에게 명령한 모든 것과 내 종 모세가 그들에게 명령한 모든 율법을 그대로 지켜 행하기만 한다면 말입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 발을 … 떠돌게 하다’는 히브리어의 구체적 표현을 살린 번역입니다. 이 표현은 이스라엘을 그 땅에서 옮겨 유랑하게 하는 것을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘조상들’은 이스라엘의 선조들을 가리키는 언약적 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘율법’은 여기서 모세를 통하여 명령된 토라를 뜻합니다. ‘가르침’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אֹסִיף
  english_pob_choice: I will not again make
  chosen_korean: 다시는 … 하지 않겠습니다
  alternatives_korean:
  - 더 이상 … 하지 않겠습니다
  - 계속 … 하지 않겠습니다
  lexicon: HALOT
  rationale: לֹא + יסף의 반복 중단 표현을 한국어의 ‘다시는’으로 자연스럽게 옮겨, ‘다시 더하지 않다’의 관용적 힘을 살렸습니다.
- source_word: לְהָנִיד רֶגֶל יִשְׂרָאֵל
  english_pob_choice: make Israel’s foot wander
  chosen_korean: 이스라엘의 발이 … 떠돌게 하지 않겠습니다
  alternatives_korean:
  - 이스라엘을 옮기지 않겠습니다
  - 이스라엘의 발을 흔들지 않겠습니다
  lexicon: HALOT
  rationale: ‘발’의 단수 이미지를 유지하면서, 문맥상 땅에서의 이탈·유랑을 드러내기 위해 ‘떠돌게 하다’를 택했습니다.
- source_word: הָאֲדָמָה
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 그 땅
  - 토지
  lexicon: HALOT
  rationale: 조상들에게 준 언약적 영토를 가리키므로 ‘땅’이 가장 자연스럽고, 이어지는 문맥과도 잘 맞습니다.
- source_word: אֲשֶׁר נָתַתִּי לַאֲבוֹתָם
  english_pob_choice: that I gave to their fathers
  chosen_korean: 내가 그들의 조상들에게 준
  alternatives_korean:
  - 내가 그들의 아버지들에게 준
  - 내가 그들의 선조들에게 준
  lexicon: HALOT
  rationale: covenantal expression인 ‘their fathers’를 한국어 성경 문맥에 맞게 ‘조상들’로 풀되, 출발점인 관계 표현은 유지했습니다.
- source_word: רַק אִם יִשְׁמְרוּ לַעֲשׂוֹת
  english_pob_choice: if only they are careful to do
  chosen_korean: 단지 그들이 … 따라 행하도록 조심하기만 한다면
  alternatives_korean:
  - 오직 그들이 … 지켜 행한다면
  - 그들이 … 행하도록 주의하기만 한다면
  lexicon: HALOT
  rationale: רַק אִם의 제한적 조건을 ‘단지 … 하기만 한다면’으로 옮겨 조건의 긴박함을 살렸고, שמר + infinitive는 ‘조심하다’로 표현했습니다.
- source_word: וּלְכָל הַתּוֹרָה
  english_pob_choice: and according to all the law
  chosen_korean: 온 율법
  alternatives_korean:
  - 모든 율법
  - 온 가르침
  lexicon: HALOT
  rationale: 여기서는 모세를 통해 주어진 토라를 가리키므로 전통적이면서도 본문 문맥에 맞는 ‘율법’을 택했습니다.
theological_decisions:
- issue: 언약적 조건과 약속의 긴장
  chosen_reading: 이 절은 이스라엘이 땅에서 흔들리지 않도록 하시는 하나님의 말씀을, 순종을 전제한 실제 조건으로 제시합니다.
  alternative_readings:
  - 단순한 수사적 강조로만 읽는 해석
  - 무조건적 약속에 맞추어 조건성을 약화하는 해석
  rationale: רַק אִם이 분명한 조건절을 이루므로, 본문이 지닌 언약적 긴장을 완화하지 않고 그대로 드러냈습니다.
  doctrine_reference: 'Translation philosophy: Preserve theological tension rather than resolve it.'
