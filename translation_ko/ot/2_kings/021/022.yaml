base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/022.yaml
  text: He abandoned Yahweh[a], the God of his fathers[b], and did not walk in the way of Yahweh.
  footnotes:
  - marker: a
    text: Or 'forsook the LORD.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the God of his fathers'; alternatively, 'the God of his ancestors.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼, 곧 그의 조상들의 하나님을 버리고, 야훼의 길로 걷지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주님을 저버리고’.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘그의 아버지들의 하나님’이며, 문맥상 ‘그의 선조들의 하나님’도 가능합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲזֹב
  english_pob_choice: abandoned
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 저버리고
  - 버렸습니다
  lexicon: HALOT
  rationale: עזב는 ‘떠나다/버리다/저버리다’의 뜻이 있으므로, 언약적 불충성을 드러내는 ‘버리고’가 간결하고 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명 יְהוָה를 제목이나 대체어로 바꾸지 않고, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: אֱלֹהֵי אֲבֹתָי/ו
  english_pob_choice: the God of his fathers
  chosen_korean: 그의 조상들의 하나님
  alternatives_korean:
  - 그의 아버지들의 하나님
  - 그의 선조들의 하나님
  lexicon: HALOT
  rationale: 히브리어의 소유격 결합구를 그대로 살리되, 한국어에서 더 자연스러운 ‘조상들’로 옮겨 혈통적·언약적 뉘앙스를 유지했습니다.
- source_word: וְלֹא הָלַךְ
  english_pob_choice: and did not walk
  chosen_korean: 걷지 않았습니다
  alternatives_korean:
  - 따르지 않았습니다
  - 살지 않았습니다
  lexicon: HALOT
  rationale: הלך의 관용적 의미인 삶의 방식/행위를 살려 ‘걷다’를 유지했습니다. 영어 POB의 ‘walk’와도 대응됩니다.
theological_decisions:
- issue: 신명 יְהוָה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 단순한 칭호가 아니라 언약적 고유명사를 쓰므로, 대체 번역어보다 고유명 표기를 유지하는 것이 소스 충실도에 부합합니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
- issue: ‘walk in the way of Yahweh’의 관용구 처리
  chosen_reading: 야훼의 길로 걷지 않았습니다
  alternative_readings:
  - 야훼의 길을 따르지 않았습니다
  - 야훼의 길에서 벗어났습니다
  rationale: ‘길’은 행위와 삶의 방향을 가리키는 성서적 관용어이므로, 의미를 풀어쓰기보다 이미지와 판단을 함께 보존하는 표현을 택했습니다.
  doctrine_reference: 'Translation philosophy: source-direct idiom preservation'
