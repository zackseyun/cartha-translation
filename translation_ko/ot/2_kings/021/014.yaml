  source_fidelity: 원문의 미래형 동사 연쇄(‘내가 버릴 것이며 … 넘겨줄 것이고 … 될 것이다’)를 드러내야 합니다. 초안의 ‘버리고, 넘겨 주며’는 뒤의 미래형과 시제가 어긋납니다. 또한 שְׁאֵרִית의 집합적 단수는 뒤의 복수 대명사와 연결되므로 한국어에서는 ‘남은 자들’이 자연스럽습니다.
  naturalness: ‘그들의 모든 원수에게’가 ‘모든 그들의 원수들에게’보다 자연스럽고, 각주 표지는 해당 어구 바로 뒤에 두는 편이 독해와 구조 면에서 적절합니다. ‘원수들의 손에 넘겨주다’는 히브리어 관용구를 자연스럽게 재현합니다.
