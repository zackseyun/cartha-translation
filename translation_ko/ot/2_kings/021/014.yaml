id: 2KI.21.14
reference: 2 Kings 21:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/נָטַשְׁתִּ֗י אֵ֚ת שְׁאֵרִ֣ית נַחֲלָתִ֔/י וּ/נְתַתִּ֖י/ם בְּ/יַ֣ד אֹֽיְבֵי/הֶ֑ם וְ/הָי֥וּ לְ/בַ֛ז וְ/לִ/מְשִׁסָּ֖ה לְ/כָל אֹיְבֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/014.yaml
  text: And I will forsake the remnant of my inheritance and give them into the hand of their enemies[b][a], and they will become plunder and spoil for all their enemies.
  footnotes:
  - marker: a
    text: Or 'abandon' for 'forsake.'
    reason: lexical_alternative
  - marker: b
    text: '''My inheritance'' can also be rendered ''my heritage,'' preserving covenant-possession language.'
    reason: lexical_alternative
translation:
  language: ko
  text: 나는 내 유업의 남은 자들을 버릴 것이며[a], 그들을 그들의 원수들의 손에 넘겨줄 것이고, 그들은 그들의 모든 원수에게 노략거리와 약탈거리가 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘버리다’는 ‘내버리다’ 또는 ‘저버리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘내 유업’은 ‘내 기업’ 또는 ‘내 유산’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָטַשְׁתִּי
  english_pob_choice: I will forsake
  chosen_korean: 버리고
  alternatives_korean:
  - 떠나고
  - 내버리고
  - 버려 두고
  lexicon: HALOT
  rationale: נטשׁ는 단순히 '떠나다'보다 관계를 끊고 내버리는 뉘앙스가 강하므로, 예언적·심판적 문맥을 살린 '버리다'를 택했습니다.
- source_word: שְׁאֵרִית נַחֲלָתִי
  english_pob_choice: the remnant of my inheritance
  chosen_korean: 내 유업의 남은 자
  alternatives_korean:
  - 내 상속의 남은 자
  - 내 몫의 남은 자
  - 내 소유의 남은 자
  lexicon: HALOT
  rationale: שְׁאֵרִית는 '남은 자', נַחֲלָה는 언약적 소유/유업을 뜻하므로, 한국어에서도 인격적·공동체적 함의를 살려 '유업의 남은 자'로 옮겼습니다.
- source_word: בְּיַד אֹיְבֵיהֶם
  english_pob_choice: into the hand of their enemies
  chosen_korean: 그들의 원수들의 손에 넘겨 주며
  alternatives_korean:
  - 그들의 원수들의 손에 맡기며
  - 그들의 원수들의 권세에 넘겨 주며
  - 그들의 원수들에게 넘기며
  lexicon: HALOT
  rationale: 히브리어 관용구 '손에'를 유지하되, 한국어에서는 의미를 분명히 하기 위해 '넘겨 주다'를 붙여 통치·지배 아래 두는 이미지를 살렸습니다.
- source_word: לְבַז וְלִמְשִׁסָּה
  english_pob_choice: plunder and spoil
  chosen_korean: 노략거리가 되고 약탈거리가 될 것입니다
  alternatives_korean:
  - 노략물과 약탈물이 될 것입니다
  - 약탈과 노략의 대상이 될 것입니다
  - 전리품이 되고 노획물이 될 것입니다
  lexicon: HALOT
  rationale: 두 명사의 병렬을 한국어에서도 대칭적으로 살리기 위해 '노략거리가 되고 약탈거리가 되다'로 옮겼습니다. '전리품'보다 수동적 피탈 상태가 더 분명합니다.
theological_decisions:
- issue: 언약 소유를 가리키는 'my inheritance'의 범위
  chosen_reading: '''내 유업''으로 옮겨, 하나님께 속한 언약 공동체라는 함의를 유지하되 의미를 과도하게 확장하지 않았습니다.'
  alternative_readings:
  - 내 상속
  - 내 소유
  - 내 기업
  rationale: 문맥은 소유권 선언이 아니라 하나님이 자기 몫으로 삼으신 백성의 남은 자에 대한 심판이므로, 전통 교회어보다 원문에 가까운 언약적 소유 표현을 선택했습니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
