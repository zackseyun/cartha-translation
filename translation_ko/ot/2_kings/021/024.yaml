translation:
  language: ko
  text: 그러나 그 땅의 백성은 아몬 왕[a]에게 대항하여 음모를 꾸민 자들을 모두 쳐 죽이고, 그 땅의 백성은 그의 아들 요시야를 아몬의 자리에 왕으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아몬 왕에 대항한 모든 음모자들’
