review_pass:
  verdict: revise
  source_fidelity: 히브리어의 핵심 사건 전개와 왕위 계승은 대체로 잘 옮겼습니다. 다만 ‘배반하여’는 קשר(음모하다/공모하다)가 명시하지 않는 의미를 보태며, 두 번째 עַם הָאָרֶץ의 반복이 번역에서 생략되었습니다. 또 ‘그의 자리’는 한국어에서 요시야를 가리키는 것으로 잠시 읽힐 수 있어 아몬을 명시하는 편이 정확합니다.
  naturalness: ‘그 땅의 백성’, ‘왕으로 세웠습니다’는 현대 표준어 합쇼체에서 자연스럽습니다. ‘아몬 왕에게 대항하여 음모를 꾸민 자들’이 ‘왕 아몬을 배반하여 음모한 자들’보다 자연스럽고 의미도 정확합니다.
  terminology: ‘그 땅의 백성’은 עַם הָאָרֶץ의 사회·정치적 함의를 과도하게 해석하지 않는 적절한 표현입니다. ‘음모를 꾸민 자들’은 הַקֹּשְׁרִים를 충실히 반영합니다.
  issues:
  - severity: medium
    issue: ‘배반하여’가 원문에 없는 의미를 추가합니다.
    rationale: קשר는 여기서 아몬 왕에 맞선 음모/공모를 뜻합니다. 반역적 맥락은 있을 수 있으나 ‘배반’은 별도의 행위와 관계를 명시하므로 번역문에 추가하지 않는 것이 안전합니다.
  - severity: low
    issue: 두 번째 ‘그 땅의 백성’이 생략되었습니다.
    rationale: 원문은 עַם הָאָרֶץ를 두 번 반복하여 두 행동의 주체를 다시 명시합니다. 한국어에서도 반복을 유지하면 원문 구조와 강조를 더 잘 보존합니다.
  - severity: low
    issue: ‘그의 자리에’의 지시 대상이 모호합니다.
    rationale: 원문의 תַּחְתָּיו는 아몬의 뒤를 이은다는 뜻입니다. 바로 앞의 ‘그의 아들 요시야’ 때문에 한국어 대명사는 잠시 요시야를 가리키는 듯 읽힐 수 있으므로 ‘아몬의 자리에’로 분명히 하는 것이 좋습니다.
  revised_text: 그러나 그 땅의 백성은 아몬 왕[a]에게 대항하여 음모를 꾸민 자들을 모두 쳐 죽이고, 그 땅의 백성은 그의 아들 요시야를 아몬의 자리에 왕으로 세웠습니다.
