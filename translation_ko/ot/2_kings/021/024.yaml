base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/024.yaml
  text: But the people of the land struck down all those who had conspired against King Amon[a], and the people of the land made Josiah his son king in his place.
  footnotes:
  - marker: a
    text: Or, 'all the conspirators against King Amon.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 그 땅의 백성은 왕 아몬[a]을 배반하여 음모한 자들을 모두 쳐 죽이고, 그의 아들 요시야를 그의 자리에 왕으로 세웠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아몬 왕에 대항하여 음모한 모든 자들’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם הָאָרֶץ
  english_pob_choice: the people of the land
  chosen_korean: 그 땅의 백성
  alternatives_korean:
  - 그 땅의 사람들
  - 그 땅의 주민들
  lexicon: HALOT
  rationale: 히브리어 관용구를 너무 풀어 쓰지 않고, 정치적 주체로서의 집단성을 살려 옮겼습니다.
- source_word: וַיַּךְ
  english_pob_choice: struck down
  chosen_korean: 쳐 죽이고
  alternatives_korean:
  - 죽이고
  - 쳐서 쓰러뜨리고
  lexicon: HALOT
  rationale: 문맥상 단순한 타격이 아니라 치명적인 공격이므로, 현대 한국어에서 자연스러운 폭력 행위로 분명히 드러냈습니다.
- source_word: כָּל הַקֹּשְׁרִים עַל הַמֶּלֶךְ אָמוֹן
  english_pob_choice: all those who had conspired against King Amon
  chosen_korean: 왕 아몬을 배반하여 음모한 자들
  alternatives_korean:
  - 아몬 왕에게 음모한 모든 자들
  - 왕 아몬에 대하여 공모한 자들
  lexicon: HALOT
  rationale: קשר의 반역적 음모 의미를 살려 ‘배반하여 음모한’으로 옮기되, 대상을 분명히 했습니다.
- source_word: וַיַּמְלִיכוּ ... תַּחְתָּיו
  english_pob_choice: made Josiah his son king in his place
  chosen_korean: 그의 아들 요시야를 그의 자리에 왕으로 세웠습니다
  alternatives_korean:
  - 그의 아들 요시야를 대신하여 왕이 되게 했습니다
  - 그의 아들 요시야를 왕으로 삼아 그의 뒤를 잇게 했습니다
  lexicon: HALOT
  rationale: 히필형 מלך의 사역적 의미를 따라 즉위/계승을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 서술 연결을 위한 접속사 선택
  chosen_reading: ‘그러나’로 시작해 앞절의 암몬의 죽음과 대비를 드러냈습니다.
  alternative_readings:
  - 그리고
  - 그런데
  rationale: 히브리어 와우 연결을 단순 병렬로만 보지 않고, 전절의 사건과의 대조를 한국어 담화에서 분명히 했습니다.
  doctrine_reference: Narrative discourse equivalence
