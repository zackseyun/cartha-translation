base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/011.yaml
  text: Because Manasseh king of Judah has done these abominations[a], and has done more evil than all the Amorites who were before him did, and has also caused Judah to sin with his idols,
  footnotes:
  - marker: a
    text: Hebrew גִּלּוּלִים is a contemptuous term for idols; alternatively, 'filthy idols' or more vividly 'dung-idols.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 유다 왕 므낫세가 이런 가증한 일들을 행하여, 자기 앞에 있던 모든 아모리 사람보다 더 악을 행했으며, 또한 자기 우상들로 유다를 죄짓게 했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  english_pob_choice: Because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 … 때문입니다
  - …이므로
  lexicon: HALOT
  rationale: 원문의 원인·근거 제시를 자연스러운 현대 한국어 인과 표현으로 옮겼습니다. 문맥상 다음 절의 심판 선언을 받치는 이유절입니다.
- source_word: הַתֹּעֵבוֹת הָאֵלֶּה
  english_pob_choice: these abominations
  chosen_korean: 이런 가증한 일들
  alternatives_korean:
  - 이런 가증물
  - 이런 혐오스러운 일들
  lexicon: HALOT
  rationale: פּוֹלֵ미컬한 종교적·도덕적 거부감을 살리면서도 한국어로 과도하게 해석적이지 않게 옮겼습니다. ‘가증한 일들’은 우상숭배 문맥의 무게를 유지합니다.
- source_word: הֵרַע מִכֹּל אֲשֶׁר עָשׂוּ
  english_pob_choice: has done more evil than all ... did
  chosen_korean: 모든 아모리 사람보다 더 악을 행했으며
  alternatives_korean:
  - 그들보다 더 악하게 행했으며
  - 그들 모두보다 더 악을 저질렀으며
  lexicon: HALOT
  rationale: 히필의 비교적 악행을 한국어 동사구로 자연스럽게 살렸습니다. ‘더 악을 행하다’는 원문의 비교 구조를 유지하면서도 현대적입니다.
- source_word: בְּגִלּוּלָיו
  english_pob_choice: with his idols
  chosen_korean: 자기 우상들로
  alternatives_korean:
  - 자기 우상들과 함께
  - 자기 우상들로 말미암아
  lexicon: HALOT
  rationale: ב 전치사의 수단·도구적 뉘앙스를 한국어 조사 ‘-로’로 옮겨, 므낫세가 우상들을 통해 유다를 죄짓게 했다는 인과적 연결을 드러냈습니다. ‘우상들’은 원문의 복수형도 반영합니다.
theological_decisions:
- issue: גִּלּוּלִים의 비하적 뉘앙스
  chosen_reading: ‘우상들’로 본문에 두고, 원문의 경멸적 어조는 ‘가증한 일들’과 문맥 전체로 드러냅니다.
  alternative_readings:
  - ‘똥우상들’
  - ‘더러운 우상들’
  rationale: 한국어 본문에서 지나치게 자극적인 조어를 쓰기보다, 본문의 공적 읽기 가능성을 유지하면서도 경멸성을 해치지 않는 표현을 택했습니다. 어조의 강도는 각주 없이도 충분히 문맥에서 드러납니다.
  doctrine_reference: Translation philosophy §§5–6
