  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'for the whole heavenly host.' The Hebrew idiom 'host of heaven' refers to the celestial host and in this context likely to heavenly bodies or powers venerated in astral worship.
