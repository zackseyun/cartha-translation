base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/005.yaml
  text: He built altars for all the host of heaven in the two courts of the house of Yahweh[a].
  footnotes:
  - marker: a
    text: Or 'for the whole heavenly host.' The Hebrew idiom 'host of heaven' refers to the celestial host and in this context likely to heavenly bodies or powers venerated in astral worship.
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼의 집의 두 뜰에 하늘의 모든 군대를 위하여 제단들을 세웠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 모든 천상 군세를 위하여’. 히브리어 ‘하늘의 군대’는 천체 또는 천상적 존재들을 가리킬 수 있으며, 이 문맥에서는 숭배의 대상이 된 천체나 천상적 세력을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  english_pob_choice: He built
  chosen_korean: 세웠습니다
  alternatives_korean:
  - 지었습니다
  - 건축했습니다
  lexicon: HALOT
  rationale: בנה의 기본 의미는 ‘짓다/세우다’이며, 제단을 만든다는 문맥에서는 ‘세우다’가 가장 자연스럽고 간결합니다.
- source_word: מִזְבְּחֹות
  english_pob_choice: altars
  chosen_korean: 제단들을
  alternatives_korean:
  - 제단
  - 제단들
  lexicon: HALOT
  rationale: 복수형이므로 복수성을 살려 ‘제단들을’로 옮겼습니다.
- source_word: לְכָל צְבָא הַשָּׁמָיִם
  english_pob_choice: for all the host of heaven
  chosen_korean: 하늘의 온 군대를 위하여
  alternatives_korean:
  - 하늘의 온 군대를 위해
  - 하늘의 군대 전체를 위하여
  - 하늘의 별무리를 위하여
  lexicon: HALOT
  rationale: ‘host of heaven’의 관용적 종교 표현을 살려 ‘하늘의 온 군대’로 옮겼고, ‘온’으로 כלל의 포괄성을 반영했습니다.
- source_word: בִּשְׁתֵּי חַצְרֹות
  english_pob_choice: in the two courts
  chosen_korean: 두 뜰 안에
  alternatives_korean:
  - 두 뜰에
  - 두 뜰 안에서
  - 두 뜰
  lexicon: HALOT
  rationale: 성전 맥락의 חַצְרוֹת는 ‘뜰’이 자연스럽고, 위치를 분명히 하도록 ‘안에’를 덧붙였습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 야훼의 집안
  lexicon: HALOT
  rationale: 성전의 관용구인 ‘야훼의 집’을 유지해 원문의 표현을 직접 살렸습니다.
theological_decisions:
- issue: 성전 안에 세운 우상 숭배용 제단의 직설적 표현
  chosen_reading: ‘야훼의 집 두 뜰 안에’와 ‘하늘의 온 군대’라는 표현을 그대로 살려, 성전 공간의 모독과 천상 숭배를 분명히 드러냈습니다.
  alternative_readings:
  - ‘성전 뜰에’로 완화
  - ‘별들’로 구체화
  rationale: 본문은 단순한 장식이 아니라 야훼의 집 안에서의 우상 숭배를 고발하므로, 공간성과 대상을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 우상 숭배/성전 모독에 대한 본문 해석
