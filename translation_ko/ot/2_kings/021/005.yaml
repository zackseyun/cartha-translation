translation:
  language: ko
  text: 그는 야훼의 집 두 뜰 안에 하늘의 온 군대를 위하여 제단들을 세웠습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하늘의 온 군대를 위하여’의 의미로, 히브리어 관용구 ‘하늘의 군대’는 천체나 천상적 권세를 가리킬 수 있으며, 여기서는 점성적 숭배의 대상이 되었을 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
