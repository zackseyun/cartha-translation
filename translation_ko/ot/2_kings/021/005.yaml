  rationale: 성전의 관용구인 ‘야훼의 집’을 유지해 원문의 표현을 직접 살렸습니다.
theological_decisions:
- issue: 성전 안에 세운 우상 숭배용 제단의 직설적 표현
  chosen_reading: ‘야훼의 집 두 뜰 안에’와 ‘하늘의 온 군대’라는 표현을 그대로 살려, 성전 공간의 모독과 천상 숭배를 분명히 드러냈습니다.
  alternative_readings:
  - ‘성전 뜰에’로 완화
  - ‘별들’로 구체화
  rationale: 본문은 단순한 장식이 아니라 야훼의 집 안에서의 우상 숭배를 고발하므로, 공간성과 대상을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 우상 숭배/성전 모독에 대한 본문 해석
