translation:
  language: ko
  text: 이제 므낫세의 나머지 행적과 그가 행한 모든 일, 그리고 그가 저지른 그의 죄는—유다 왕들의 역대기에 기록되어 있지 않습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 즉, 유다 왕들의 공식 왕실 기록 문서입니다.
    reason: source_note
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי
  english_pob_choice: Now the rest of the acts of
  chosen_korean: 이제 …의 나머지 행적
  alternatives_korean:
  - 그리고 …의 나머지 일들
  - …의 남은 이야기
  lexicon: HALOT
  rationale: 왕국사 요약 공식에서 דִּבְרֵי는 단순한 ‘말’이 아니라 기록된 행적·사건을 뜻하므로, 자연스러운 현대 한국어인 ‘행적’으로 옮겼습니다.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  english_pob_choice: and all that he did
  chosen_korean: 그리고 그가 행한 모든 일
  alternatives_korean:
  - 그리고 그가 한 모든 것
  - 그리고 그가 한 모든 일
  lexicon: HALOT
  rationale: עשה의 포괄적 의미를 살리되, 열왕기 연대기 문맥에 맞게 ‘행한 모든 일’로 자연스럽게 표현했습니다.
- source_word: וְחַטָּאתוֹ אֲשֶׁר חָטָא
  english_pob_choice: and the sin that he committed
  chosen_korean: 그리고 그가 저지른 그의 죄
  alternatives_korean:
  - 그리고 그가 저지른 죄
  - 그리고 그가 범한 죄
  lexicon: HALOT
  rationale: 히브리어의 소유격과 동사적 강조를 반영해 ‘그의 죄’를 살렸고, חטא를 강한 책임성을 지닌 ‘저지르다’로 옮겼습니다.
- source_word: דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  english_pob_choice: the Book of the Chronicles of the Kings of Judah
  chosen_korean: 유다 왕들의 역대기
  alternatives_korean:
  - 유다 왕들의 연대기
  - 유다 왕들의 기록
  lexicon: HALOT
  rationale: 이 표현은 왕실 기록문서의 고유한 명칭이므로, 관용적으로 통하는 ‘역대기’로 옮기되 본문 안에서 그 기능이 기록 자료임을 드러냈습니다.
theological_decisions:
- issue: 수사 의문문의 처리
  chosen_reading: 본문의 ‘그렇지 않습니까?’로 수사 의문을 살려, 독자가 답을 이미 알고 있는 기록 형식을 유지했습니다.
  alternative_readings:
  - 확언형으로 평탄화하여 ‘기록되어 있습니다’로 번역
  rationale: 히브리어 הֲלֹא는 단순 진술보다 확인을 요구하는 반어적·수사적 질문이므로, 문체를 유지하는 편이 원문의 힘을 더 잘 전달합니다.
  doctrine_reference: 문체/담화 기능 보존
- issue: ‘역대기’의 지시 대상
  chosen_reading: ‘유다 왕들의 역대기’로 옮겨, 정경 역대기서가 아니라 왕실 기록 보관소를 가리키는 표현임을 유지했습니다.
  alternative_readings:
  - ‘유다 왕들의 연대기’
  - ‘유다 왕들의 기록’
  rationale: 본문의 מקור은 특정 서명(archive title)으로 보이므로, 한국어 성경 독자가 정경과 혼동하지 않도록 기록 자료 성격을 함께 보존했습니다.
  doctrine_reference: 사료적 맥락 보존
