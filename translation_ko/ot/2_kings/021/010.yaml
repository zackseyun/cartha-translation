translation:
  language: ko
  text: 야훼께서 자신의 종들인 예언자들의 손을 통해 말씀하시며 이르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘손으로’는 여기서 ‘통하여’, ‘~을 통해’라는 뜻의 매개 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  english_pob_choice: spoke
  chosen_korean: 말씀하시며
  alternatives_korean:
  - 말하셨습니다
  - 이르셨습니다
  lexicon: HALOT
  rationale: 히브리어 דבר의 피엘형은 단순 발화보다 공식적·서술적 ‘말씀하다’에 가깝기 때문에, 서사적 힘을 살려 ‘말씀하시며’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 여호와 이름은 관용적 대체어가 아니라 고유명사이므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겼습니다.
- source_word: בְּיַד
  english_pob_choice: by the hand of
  chosen_korean: …의 손을 통해
  alternatives_korean:
  - …을 통해
  - …으로
  lexicon: HALOT
  rationale: 히브리어 관용구의 매개성·대리성을 드러내기 위해 ‘손을 통해’로 살렸습니다. 직역을 그대로 두기보다 한국어에서 자연스럽게 이해되도록 다듬었습니다.
- source_word: עֲבָדָיו הַנְּבִיאִים
  english_pob_choice: his servants the prophets
  chosen_korean: 자신의 종들인 예언자들
  alternatives_korean:
  - 그의 종들인 예언자들
  - 그의 예언자 종들
  lexicon: HALOT
  rationale: ‘예언자들’은 ‘종들’의 동격 설명이므로, 두 호칭의 관계가 분명히 보이도록 재배열했습니다. כאן에서는 봉사직이라는 기능보다 하나님의 위임받은 대리자라는 점이 핵심입니다.
- source_word: לֵאמֹר
  english_pob_choice: saying
  chosen_korean: 이르셨습니다
  alternatives_korean:
  - 말하여 이르시되
  - 말씀하여
  lexicon: HALOT
  rationale: 히브리어 לֵאמֹר는 다음 직접화법을 여는 표지이므로 한국어에서는 반복을 피하면서도 발화 전환을 자연스럽게 만드는 방식으로 처리했습니다.
theological_decisions:
- issue: 예언자들을 통한 매개적 계시의 표현
  chosen_reading: ‘손을 통해’와 ‘예언자들’의 결합으로, 야훼의 말씀이 직접이면서도 대표자를 통해 전달되었음을 드러냈습니다.
  alternative_readings:
  - ‘통하여’로 완전히 평탄화하기
  - ‘종들’만 강조하여 예언자적 매개를 약화시키기
  rationale: 본문은 단순한 정보 전달이 아니라 야훼의 권위 있는 선포가 예언자들을 매개로 왔다는 점을 강조합니다. 그래서 관용구의 매개성은 유지하되, 한국어 문장에서는 읽기 쉽게 조정했습니다.
  doctrine_reference: 계시와 예언의 매개성
- issue: יהוה의 번역
  chosen_reading: ‘야훼’
  alternative_readings:
  - ‘여호와’
  - ‘주’
  rationale: 이 절은 하나님의 개인 이름을 직접 사용하므로, 제목어로 대체하지 않고 고유명사를 유지했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
