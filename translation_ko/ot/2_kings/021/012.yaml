theological_decisions:
- issue: 야훼가 내리시는 רָעָה의 성격
  chosen_reading: 하나님이 도덕적 악을 행하신다는 뜻이 아니라, 예루살렘과 유다에 임할 심판적 재앙을 뜻합니다.
  alternative_readings:
  - 악
  - 불행
  - 재난
  rationale: 문맥상 예언적 심판 선언이므로 하나님의 성품에 대한 오해를 피하면서도 원문의 강한 경고를 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the text''s plain sense without importing doctrinal claims.'
