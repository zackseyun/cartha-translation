source:
  edition: WLC
  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הִנְ/נִי֙ מֵבִ֣יא רָעָ֔ה עַל יְרוּשָׁלִַ֖ם וִֽ/יהוּדָ֑ה אֲשֶׁר֙ כָּל שמעי/ו תִּצַּ֖לְנָה שְׁתֵּ֥י אָזְנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/012.yaml
  text: 'Therefore[a], this is what Yahweh, the God of Israel, says: Behold, I am bringing disaster on Jerusalem and Judah[b], so that both ears of everyone who hears of it will tingle.'
  footnotes:
  - marker: a
    text: Or 'calamity.' The Hebrew רָעָה here refers to disastrous judgment, not moral evil.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew idiom: ''both his ears will tingle,'' expressing shock or horror at the report.'
    reason: cultural_note
translation:
  language: ko
  text: 그러므로 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. "보십시오, 내가 예루살렘과 유다에 재앙을 가져오고 있으니, 그것을 듣는 사람마다 두 귀가 다 울릴 것입니다."[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불행’. 여기서 히브리어 רָעָה는 도덕적 악이 아니라 재앙적 심판을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: '히브리어 관용구: ‘그의 두 귀가 울릴 것이다’는 충격이나 전율을 나타냅니다.'
    reason: cultural_note
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 따라서
  lexicon: HALOT
  rationale: 앞선 문맥의 결과를 나타내는 접속사로, 예언적 선언을 자연스러운 현대 한국어로 이어 주는 ‘그러므로’가 적절합니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: יהוה의 고유명을 보존하는 학술적 음역을 따랐습니다.
- source_word: רָעָה
  english_pob_choice: disaster
  chosen_korean: 재앙
  alternatives_korean:
  - 재난
  - 화
  - 악
  lexicon: HALOT
  rationale: 여기서는 도덕적 악이 아니라 심판으로서의 파국을 가리키므로 ‘재앙’이 가장 분명합니다.
- source_word: תִּצַּלְנָה שְׁתֵּי אָזְנָיו
  english_pob_choice: both ears ... will tingle
  chosen_korean: 두 귀가 다 울릴 것입니다
  alternatives_korean:
  - 두 귀가 다 떨릴 것입니다
  - 두 귀가 다 쨍할 것입니다
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역하기보다, 충격적 소식을 들을 때의 신체적 반응을 한국어 관용으로 살려 의미를 전달했습니다.
theological_decisions:
- issue: 야훼가 내리시는 רָעָה의 성격
  chosen_reading: 하나님이 도덕적 악을 행하신다는 뜻이 아니라, 예루살렘과 유다에 임할 심판적 재앙을 뜻합니다.
  alternative_readings:
  - 악
  - 불행
  - 재난
  rationale: 문맥상 예언적 심판 선언이므로 하나님의 성품에 대한 오해를 피하면서도 원문의 강한 경고를 보존해야 합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve the text''s plain sense without importing doctrinal claims.'
