id: 2KI.21.2
reference: 2 Kings 21:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה כְּ/תֽוֹעֲבֹת֙ הַ/גּוֹיִ֔ם אֲשֶׁר֙ הוֹרִ֣ישׁ יְהוָ֔ה מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/002.yaml
  text: He did what was evil in the sight of Yahweh[b][a], according to the abominations of the nations whom Yahweh had driven out before the sons of Israel.
  footnotes:
  - marker: a
    text: Or 'like the detestable practices of the nations.'
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'the sons of Israel'; many English versions render this more idiomatically as 'the Israelites.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 야훼 보시기에 악한 일을 하여, 야훼께서 이스라엘 자손 앞에서 쫓아내신 그 나라들의 가증한 행실을 따랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  english_pob_choice: He did what was evil
  chosen_korean: 악한 일을 하여
  alternatives_korean:
  - 악을 행하여
  - 악한 것을 하여
  lexicon: HALOT
  rationale: עשה + הרע는 히브리어의 관용구로, 단순히 ‘악’이라는 명사를 붙이기보다 ‘악한 일을 하다’의 의미를 자연스럽게 살리는 것이 적절합니다.
- source_word: בְּעֵינֵי יְהוָה
  english_pob_choice: in the sight of Yahweh
  chosen_korean: 야훼 보시기에
  alternatives_korean:
  - 야훼의 눈앞에서
  - 야훼 앞에
  lexicon: HALOT
  rationale: ‘눈에’라는 비유를 한국어에서 그대로 옮기면 부자연스러울 수 있어, 하나님의 평가를 드러내는 관용적 표현인 ‘보시기에’를 사용했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: HALOT
  rationale: 본문의 신명사 표기는 프로젝트 기본 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: כְּתֽוֹעֲבֹת הַגּוֹיִם
  english_pob_choice: according to the abominations of the nations
  chosen_korean: 그 나라들의 가증한 행실을 따랐습니다
  alternatives_korean:
  - 그 나라들의 가증한 것들처럼 행했습니다
  - 그 나라들의 혐오스러운 관습을 따랐습니다
  lexicon: HALOT
  rationale: תועבות는 단순한 도덕적 불쾌감보다 언약적·우상숭배적 ‘가증함’을 가리키므로 ‘가증한 행실’로 살렸고, כְּ는 여기서 동일시/준거의 의미로 자연스럽게 ‘따랐습니다’로 풀었습니다.
- source_word: בְּנֵי יִשְׂרָאֵל
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘 사람들
  - 이스라엘의 아들들
  lexicon: HALOT
  rationale: 히브리어의 남성 복수 친족 표현을 보존하되, 한국어 성경에서 익숙한 ‘이스라엘 자손’을 사용했습니다.
theological_decisions:
- issue: 야훼 보시기에의 평가와 언약적 죄의 성격
  chosen_reading: 왕의 행위는 단순한 실책이 아니라 야훼의 시각에서 악으로 판정되는 언약 위반으로 제시했습니다.
  alternative_readings:
  - 도덕적 악으로만 약화해 읽는 해석
  - 정치적 실패로만 읽는 해석
  rationale: 본문은 평가 구문(בְּעֵינֵי יְהוָה)과 열방의 가증함을 연결해, 우상숭배적 배교의 성격을 강조합니다.
  doctrine_reference: 열왕기 역사서의 언약적 평가 구조
