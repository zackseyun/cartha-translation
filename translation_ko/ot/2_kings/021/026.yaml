  source_fidelity: 히브리어의 매장 장소 표현(‘우짜의 정원에 있는 그의 묘’)과 요시야의 왕위 계승을 충실히 반영합니다. 매장 동사의 형식상 단수 주어는 문맥상 특정되지 않으므로, 한국어에서는 주어를 생략해 불필요한 확정을 피하는 것이 적절합니다.
  naturalness: 초안의 ‘그의 무덤에, 우짜의 정원에’는 동격 관계가 어색하고 장소 수식 관계가 불분명합니다. ‘우짜의 정원에 있는 그의 묘에’로 하면 자연스럽고 명확합니다. ‘요시야 그의 아들’도 현대 한국어 어순상 ‘그의 아들 요시야’가 자연스럽습니다.
