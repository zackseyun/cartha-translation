base_translation:
  language: en
  yaml_path: translation/ot/2_kings/021/026.yaml
  text: And they buried him in his tomb in the garden of Uzza[b][a], and Josiah his son became king in his place.
  footnotes:
  - marker: a
    text: Hebrew literally, 'and he buried him.' English uses the indefinite plural 'they buried him' for natural style in this context.
    reason: lexical_alternative
  - marker: b
    text: Or 'his grave' or 'his burial place.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그를 그의 무덤에, 우짜의 정원에 묻었습니다. 요시야 그의 아들이 그를 대신하여 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּר
  english_pob_choice: they buried
  chosen_korean: 묻었습니다
  alternatives_korean:
  - 그를 묻었습니다
  - 장사했습니다
  lexicon: HALOT
  rationale: 히브리어는 형식상 3인칭 단수지만, 문맥상 한국어에서는 행위 주체를 굳이 드러내지 않는 무주어/피동형이 가장 자연스럽고 원문의 불특정 매장 행위를 잘 살립니다.
- source_word: קְבֻרָתוֹ
  english_pob_choice: his tomb
  chosen_korean: 그의 무덤
  alternatives_korean:
  - 그의 묘
  - 그의 장지
  lexicon: HALOT
  rationale: 이 명사는 매장된 장소를 가리키므로 '무덤'이 간결하고 본문 문맥에 맞습니다.
- source_word: גַן עֻזָּא
  english_pob_choice: the garden of Uzza
  chosen_korean: 우짜의 정원
  alternatives_korean:
  - 우짜의 동산
  - 우짜의 뜰
  lexicon: HALOT
  rationale: 히브리어 소유격 구조를 그대로 살려 인명-장소 관계를 보존했습니다.
- source_word: וַיִּמְלֹךְ ... תַּחְתָּיו
  english_pob_choice: became king in his place
  chosen_korean: 그를 대신하여 왕이 되었습니다
  alternatives_korean:
  - 그의 뒤를 이어 왕이 되었습니다
  - 그의 자리에 왕이 되었습니다
  lexicon: HALOT
  rationale: 즉위·계승 공식을 한국어로 자연스럽게 옮기되, '대신하여'로 'in his place'의 대체/승계 의미를 분명히 했습니다.
