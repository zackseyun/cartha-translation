translation:
  language: ko
  text: 그리고 이세벨은 이스르엘 지역에서[a] 개들이 먹을 것이며, 그녀를 묻어 줄 사람도 없을 것입니다.” 그러고서 그는 문을 열고 도망쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
