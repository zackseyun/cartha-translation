  text: וְ/אֶת אִיזֶ֜בֶל יֹאכְל֧וּ הַ/כְּלָבִ֛ים בְּ/חֵ֥לֶק יִזְרְעֶ֖אל וְ/אֵ֣ין קֹבֵ֑ר וַ/יִּפְתַּ֥ח הַ/דֶּ֖לֶת וַ/יָּנֹֽס־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/010.yaml
  text: And the dogs will eat Jezebel in the territory of Jezreel[a], and there will be no one to bury her.” Then he opened the door and fled.
  footnotes:
  - marker: a
    text: Or 'in the plot/portion of Jezreel.' The Hebrew חֵלֶק refers to a tract or parcel of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이세벨은 이스르엘 지역에서 개들이 먹을 것이며, 그를 묻어 줄 사람도 없을 것입니다.” 그러고서 그는 문을 열고 도망쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스르엘 지역’은 히브리어 חֵלֶק의 의미를 살린 번역입니다. 이 단어는 ‘몫’이나 ‘토지의 구획/구역’도 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאכְלוּ / הַכְּלָבִים
  english_pob_choice: will eat / the dogs
  chosen_korean: 개들이 먹을 것입니다
  alternatives_korean:
  - 그 개들이 먹을 것입니다
  - 개들이 삼킬 것입니다
  lexicon: HALOT
  rationale: 히브리어는 단순한 미래형으로 개들을 주어로 두고 ‘먹다’를 사용하므로, 과장된 ‘삼키다’보다 직역에 가까운 ‘먹을 것입니다’가 적절합니다.
- source_word: בְּחֵלֶק יִזְרְעֶאל
  english_pob_choice: in the territory of Jezreel
  chosen_korean: 이스르엘 지역에서
  alternatives_korean:
  - 이스르엘의 몫에서
  - 이스르엘의 구역에서
  - 이스르엘의 땅에서
  lexicon: HALOT
  rationale: חֵלֶק은 ‘몫’뿐 아니라 토지의 구획·지역을 뜻할 수 있으므로, 현대 한국어에서는 과도하게 좁은 ‘구역’보다 ‘지역’이 무난하게 그 범위를 드러냅니다.
- source_word: וְאֵין קֹבֵר
  english_pob_choice: and there will be no one to bury her
  chosen_korean: 그를 묻어 줄 사람도 없을 것입니다
  alternatives_korean:
  - 묻어 줄 자가 없을 것입니다
  - 장사할 사람이 없을 것입니다
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘매장하는 이가 없다’는 뜻이므로, 한국어 문장에서는 자연스럽게 목적어를 보충해 무덤에 묻어 줄 사람이 없다는 의미를 살렸습니다.
- source_word: וַיָּנֹס
  english_pob_choice: and fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 도망갔습니다
  lexicon: HALOT
  rationale: נוס는 급히 도망하다의 뜻으로, 서술의 긴박함을 살리는 ‘도망쳤습니다’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: 예언 선언의 시제와 종결감
  chosen_reading: 미래형 ‘먹을 것입니다’와 ‘없을 것입니다’를 사용해 심판 예언의 확정된 미래를 드러냈습니다.
  alternative_readings:
  - 현재형처럼 들리는 ‘먹습니다’
  - 완곡한 ‘먹게 될 것입니다’
  rationale: 본문은 예언적 선언으로서 미래의 확실성을 말하므로, 한국어에서도 단정적 미래 표현이 원문의 기능을 가장 잘 반영합니다.
  doctrine_reference: 예언적 확정 미래의 문맥 기능
