translation:
  language: ko
  text: 그들이 돌아와 그에게 알렸습니다. 그러자 그가 말했습니다. “이것은 야훼의 말씀입니다. 야훼께서 자신의 종인 디셉 사람 엘리야를 통하여 말씀하신 것입니다. ‘이스르엘의 땅[a]에서 개들이 이세벨의 살을 먹을 것이다.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스르엘의 몫’ 또는 ‘이스르엘의 구획’. 히브리어 חֵלֶק은 토지의 몫이나 구획을 가리킬 수 있습니다.
    reason: lexical_alternative
