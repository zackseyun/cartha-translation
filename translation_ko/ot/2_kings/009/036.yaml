  text: 그들이 돌아와서 그에게 알리자, 그는 말했습니다. 「그것은 야훼의 말씀입니다. 야훼께서 그분의 종 엘리야 디셉 사람의 손을 통해 말씀하신 것인데, ‘이스르엘의 지역에서 개들이 이세벨의 살을 먹을 것이다’라고 하셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이스르엘의 몫/분깃’; 히브리어 חֵלֶק은 토지의 몫이나 구획을 가리킬 수 있습니다.
    reason: lexical_alternative
