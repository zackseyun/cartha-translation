  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 히브리어의 ‘야훼의 말씀’과 그 말씀을 야훼께서 엘리야를 통하여 하셨다는 관계를 한국어에서 더 명료하게 연결하는 편이 좋습니다. חֵלֶק의 토지 구획 의미는 본문 각주 표지로 직접 연결해야 합니다.
  naturalness: ‘그분의 종 엘리야 디셉 사람의 손을 통해’는 히브리어 관용구를 지나치게 직역하여 현대 한국어로 다소 무겁고 수식 관계가 불분명합니다. ‘자신의 종인 디셉 사람 엘리야를 통하여’가 자연스럽고 매개 의미도 유지합니다. 직접 인용문의 인용부호와 문장부호도 한국어 관례에 맞추어 정리했습니다.
  terminology: ‘야훼’, ‘엘리야’, ‘이스르엘’, ‘이세벨’은 일관되고 적절합니다. בָּשָׂר의 구체성을 보존한 ‘살’도 적절합니다. חֵלֶק은 본문에서 ‘땅’으로 자연스럽게 옮기되, ‘몫/구획’이라는 대안을 각주로 보완합니다.
