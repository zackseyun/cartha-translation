  text: אִם לֹ֡א אֶת דְּמֵ֣י נָבוֹת֩ וְ/אֶת דְּמֵ֨י בָנָ֜י/ו רָאִ֤יתִי אֶ֨מֶשׁ֙ נְאֻם יְהוָ֔ה וְ/שִׁלַּמְתִּ֥י לְ/ךָ֛ בַּ/חֶלְקָ֥ה הַ/זֹּ֖את נְאֻם יְהוָ֑ה וְ/עַתָּ֗ה שָׂ֧א הַשְׁלִכֵ֛/הוּ בַּ/חֶלְקָ֖ה כִּ/דְבַ֥ר יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/026.yaml
  text: ‘Surely I saw yesterday the blood of Naboth and the blood of his sons,’ declares Yahweh[a], ‘and I will repay you on this plot of land,’ declares Yahweh. ‘So now, lift him up and throw him on the plot, according to the word of Yahweh.’
  footnotes:
  - marker: a
    text: Or, 'Indeed, I saw yesterday the blood of Naboth and the blood of his sons.' The opening Hebrew idiom is an emphatic oath-like assertion.
    reason: lexical_alternative
translation:
  language: ko
  text: ‘분명히 내가 어제 나봇의 피와 그의 아들들의 피를 보았다’라고 야훼께서 말씀하셨다[a]. ‘내가 이 밭에서 네게 갚겠다’라고 야훼께서 말씀하셨다. ‘그러니 이제 그를 들어 올려 이 밭에 던지십시오. 야훼의 말씀대로 하십시오.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘실로, 내가 어제 나봇의 피와 그의 아들들의 피를 보았다.’ 히브리어 서두의 표현은 맹세처럼 강하게 단언하는 관용구입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  english_pob_choice: Surely
  chosen_korean: 분명히
  alternatives_korean:
  - 진실로
  - 참으로
  - 만일 아니면
  lexicon: HALOT
  rationale: אִם לֹא는 조건문이 아니라 강한 서술적 확언이므로, 한국어에서도 확인·강조의 힘을 살리는 ‘분명히’로 옮겼습니다.
- source_word: דְּמֵי
  english_pob_choice: blood
  chosen_korean: 피
  alternatives_korean:
  - 피흘림
  - 유혈
  lexicon: HALOT
  rationale: 히브리어 복수형 ‘피들’은 유혈/피값의 관용구이지만, 한국어에서는 단수 개념의 ‘피’가 가장 자연스럽고 본문의 혈흔·피값 의미를 유지합니다.
- source_word: בָנָיו
  english_pob_choice: his sons
  chosen_korean: 그의 아들들
  alternatives_korean:
  - 그의 자녀들
  - 그의 아들
  lexicon: HALOT
  rationale: 원문은 일반적 ‘자녀들’이 아니라 명시적으로 ‘아들들’을 말하므로, 성별 구체성을 그대로 살렸습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: project default
  rationale: 문맥의 신명은 직역적 대체어가 아니라 음역 ‘야훼’로 표기하여 본문과 주석의 구분을 유지했습니다.
- source_word: כִּדְבַר יְהוָה
  english_pob_choice: according to the word of Yahweh
  chosen_korean: 야훼의 말씀대로
  alternatives_korean:
  - 야훼의 말씀에 따라
  - 야훼의 말씀을 따라
  lexicon: HALOT
  rationale: 완결된 예언 성취 공식을 한국어에서 가장 자연스럽게 드러내면서도, ‘말씀’의 권위성과 성취감을 보존했습니다.
theological_decisions:
- issue: 야훼의 직접 발화와 인간 화자의 연결
  chosen_reading: 예언 인용문 안의 ‘라고 야훼께서 말씀하십니다’와 이어지는 인간 명령문을 분리해, 본문이 하나님의 판결 선언에서 제후의 실행 명령으로 전환되는 흐름을 유지했습니다.
  alternative_readings:
  - 문장 전체를 하나의 평서문으로 평탄화
  - 인용부를 덜 분명하게 처리
  rationale: 원문은 신탁 선언과 즉각적 처형 명령을 연속적으로 제시하므로, 화자 전환을 분명히 보여 주어야 본문의 심판 성격이 살아납니다.
  doctrine_reference: 서술자 전환과 예언/성취 구조 보존
- issue: ‘그를 들어 올려 던지라’의 잔혹성
  chosen_reading: 직설적인 동사 ‘들어 올려… 던지십시오’를 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘옮기십시오’로 순화
  - ‘치우십시오’로 일반화
  rationale: 장례/처리의 완곡한 표현으로 약화시키면 원문의 처형·모욕적 집행 뉘앙스가 사라지므로, 본문이 드러내는 엄중함을 그대로 유지했습니다.
  doctrine_reference: 본문의 심판적·서사적 강도 보존
