  source_fidelity: 히브리어의 서술 동작과 명령(פִּקְדוּ נָא … וְקִבְרֻהָ), 그리고 왕의 딸이라는 이유 제시는 대체로 반영되었습니다. 그러나 인용문 안의 ‘그는’은 여성 단수 지시 대상인 이세벨과 문법적으로 맞지 않으므로 ‘그녀는’으로 고쳐야 합니다. 또한 פקד의 ‘돌보다/살피다’라는 의미를 ‘잘 처리하다’보다 직접적으로 나타내는 편이 안전합니다.
  naturalness: ‘안으로 들어가서 먹고 마셨으며, 말했습니다’는 자연스럽고 합쇼체 서술에 맞습니다. 명령문은 ‘부디 … 돌보아 묻으십시오’로 옮기면 공손한 요청의 뉘앙스와 명령의 기능을 함께 유지하면서 현대 한국어로도 자연스럽습니다.
  terminology: ‘저주받은 여자’, ‘왕의 딸’, ‘묻으십시오’는 문맥과 격식에 적절합니다. ‘장사하십시오’도 가능하지만, קבר의 직접적인 매장 행위에는 ‘묻으십시오’가 더 정확합니다.
