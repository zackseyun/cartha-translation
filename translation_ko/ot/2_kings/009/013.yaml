base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/013.yaml
  text: Then they hurried[a], and each man took his garment and put it under him on the bare steps, and they blew the horn and said[b], “Jehu is king!”
  footnotes:
  - marker: a
    text: Or “on the top of the steps” or “on the stairway landing”; the Hebrew expression is rare and its precise sense is uncertain.
    reason: lexical_alternative
  - marker: b
    text: Hebrew shofar, a horn used for signaling; traditionally rendered “trumpet.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그들이 급히 행동하여, 각 사람이 자기 겉옷을 가져다가 그를 위해 계단의 맨드러진 곳 아래에 깔았고, 나팔을 불며 「예후가 왕이 되었습니다!」라고 외쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 표현은 드물며, 정확한 뜻은 확실하지 않습니다. ‘계단의 맨드러진 곳’, ‘계단 꼭대기’, ‘계단참’ 등으로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어 쇼파르(shofar), 곧 신호용 뿔피리입니다. 전통적으로는 ‘나팔’로 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  english_pob_choice: Then they hurried
  chosen_korean: 그들이 급히 행동하여
  alternatives_korean:
  - 그러자 그들이 서둘렀고
  - 그러자 그들이 급히 갔고
  lexicon: HALOT
  rationale: מהר의 핵심은 신속한 반응이므로, 서술 흐름을 살리면서도 합쇼체에 자연스러운 ‘급히 행동하여’로 옮겼습니다.
- source_word: אִישׁ בִּגְדוֹ
  english_pob_choice: each man took his garment
  chosen_korean: 각 사람이 자기 겉옷을 가져다가
  alternatives_korean:
  - 각 사람이 자기 옷을 가져다가
  - 각 사람이 자기 외투를 가져다가
  lexicon: HALOT
  rationale: בגד는 여기서 몸에 걸치는 옷을 가리키며, enthronement gesture의 맥락을 고려해 ‘겉옷’으로 구체화했습니다.
- source_word: אֶל גֶּרֶם הַמַּעֲלוֹת
  english_pob_choice: on the bare steps
  chosen_korean: 계단의 맨드러진 곳 아래에
  alternatives_korean:
  - 계단의 드러난 곳에
  - 계단 꼭대기에
  lexicon: HALOT
  rationale: gerem ha-ma‘alot은 드문 표현이라 정확한 위치를 단정하기 어렵기 때문에, POB의 주석 취지를 살려 ‘맨드러진 곳’으로 불확정성을 유지했습니다.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָר
  english_pob_choice: they blew the horn
  chosen_korean: 나팔을 불며
  alternatives_korean:
  - 뿔나팔을 불며
  - 쇼파르를 불며
  lexicon: HALOT
  rationale: שׁוֹפָר는 의례적 신호용 뿔피리이지만, 본문 흐름에서는 한국어 독자가 즉시 이해할 수 있는 일반어 ‘나팔’이 가장 자연스럽습니다.
- source_word: מָלַךְ יֵהוּא
  english_pob_choice: Jehu is king!
  chosen_korean: 「예후가 왕이 되었습니다!」
  alternatives_korean:
  - 「예후가 왕입니다!」
  - 「예후가 왕이 되었습니다!」
  lexicon: HALOT
  rationale: מָלַךְ의 완료형은 즉위의 성취를 나타내므로, 단순 현재형보다 ‘왕이 되었습니다’가 사건 완결성을 더 잘 드러냅니다.
theological_decisions:
- issue: 즉위 선포의 뉘앙스
  chosen_reading: 예후가 이미 왕으로 선포되고 인정되는 공적 즉위 선언으로 옮겼습니다.
  alternative_readings:
  - 예후는 왕입니다
  - 예후가 왕이 되었습니다
  rationale: 문맥상 이것은 단순 정보 전달이 아니라 군중의 즉위 선포이므로, 선언문처럼 읽히는 표현을 택했습니다.
  doctrine_reference: 왕권/즉위 서술의 서사 문맥
