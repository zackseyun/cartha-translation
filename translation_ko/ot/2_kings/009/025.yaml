  text: וַ/יֹּ֗אמֶר אֶל בִּדְקַר֙ שלשה שָׂ֚א הַשְׁלִכֵ֔/הוּ בְּ/חֶלְקַ֕ת שְׂדֵ֖ה נָב֣וֹת הַ/יִּזְרְעֵאלִ֑י כִּֽי זְכֹ֞ר אֲנִ֣י וָ/אַ֗תָּה אֵ֣ת רֹכְבִ֤ים צְמָדִים֙ אַֽחֲרֵי֙ אַחְאָ֣ב אָבִ֔י/ו וַֽ/יהוָה֙ נָשָׂ֣א עָלָ֔י/ו אֶת הַ/מַּשָּׂ֖א הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/025.yaml
  text: 'Then he said to Bidkar his officer[a], “Lift him up and throw him onto the plot of the field of Naboth the Jezreelite[c][b], for remember: you and I were riding side by side behind Ahab his father when Yahweh laid this pronouncement against him.”'
  footnotes:
  - marker: a
    text: Or 'his third man,' possibly a technical designation for Bidkar’s rank or position.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'riding pairs'; the phrase likely means Jehu and Bidkar were riding together behind Ahab.
    reason: lexical_alternative
  - marker: c
    text: Or 'oracle' or 'burden.' The Hebrew term refers to a weighty prophetic pronouncement.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러고서 그가 그의 관리 브드카르에게 말했습니다. 「그를 들어서 나봇 이스르엘 사람의 밭의 그 밭고랑에 던지십시오. 기억하십시오. 당신과 나는 아합 그의 아버지 뒤에서 나란히 수레를 타고 달렸고, 야훼께서 그에게 이 선언을 내리셨습니다」.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘그의 셋째 사람’일 수 있으며, 여기서는 직분을 가리키는 기술적 표현일 가능성이 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 ‘쌍으로 탄(말)’의 뜻일 수 있으며, 문맥상 예후와 브드카르가 함께 뒤따르고 있었다는 의미로 보입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘예언’, ‘무거운 짐’입니다. 여기서는 무게감 있는 예언적 선언을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּדְקַר
  english_pob_choice: Bidkar
  chosen_korean: 브드카르
  alternatives_korean:
  - 빗드카르
  - 비드카르
  lexicon: 고유명사 음역
  rationale: 히브리어 고유명사는 현대 외래어 표기 관행에 따라 음역하되, 한국어 발음에 맞게 브드카르로 옮겼습니다.
- source_word: שלשה
  english_pob_choice: his officer
  chosen_korean: 그의 관리
  alternatives_korean:
  - 그의 장교
  - 그의 제삼인
  - 그의 부관
  lexicon: HALOT
  rationale: 문맥상 단순한 숫자 ‘셋’이 아니라 직분/역할 표시이므로, 군사적 직책을 너무 강하게 특정하지 않으면서 기능을 드러내는 ‘관리’로 옮겼습니다.
- source_word: שָׂא הַשְׁלִיכֵהוּ
  english_pob_choice: Lift him up and throw him
  chosen_korean: 그를 들어서 … 던지십시오
  alternatives_korean:
  - 그를 들어 올려 … 던지십시오
  - 그를 들어서 … 내던지십시오
  lexicon: HALOT
  rationale: 시신을 수레에서 내려 처리하라는 연속 명령의 힘을 살리기 위해 ‘들어서’와 ‘던지십시오’를 분리해 옮겼습니다.
- source_word: בְּחֶלְקַת שְׂדֵה
  english_pob_choice: onto the plot of the field
  chosen_korean: 그 밭의 그 밭고랑에
  alternatives_korean:
  - 그 밭의 한 구획에
  - 그 밭의 밭뙈기에
  lexicon: HALOT
  rationale: חלקה와 שדה의 중첩된 의미를 한국어에서 가장 자연스럽게 압축해 ‘그 밭의 그 밭고랑’으로 처리해, 특정된 토지 구획이라는 점을 보존했습니다.
- source_word: רֹכְבִים צְמָדִים
  english_pob_choice: were riding side by side
  chosen_korean: 나란히 수레를 타고 달렸고
  alternatives_korean:
  - 두 짝으로 수레를 탔고
  - 짝을 이루어 수레를 탔고
  lexicon: HALOT
  rationale: ‘쌍으로 탄 말/수레’라는 관용적 표현을 한국어에서 이해하기 쉽게 ‘나란히 수레를 타고’로 풀었습니다.
- source_word: נָשָׂא עָלָיו אֶת הַמַּשָּׂא הַזֶּה
  english_pob_choice: laid this pronouncement against him
  chosen_korean: 이 선언을 내리셨습니다
  alternatives_korean:
  - 이 예언적 경고를 그에게 내리셨습니다
  - 이 무거운 선고를 그에게 지우셨습니다
  lexicon: HALOT
  rationale: מַשָּׂא의 무게감과 예언적 선언성을 살리되, 한국어로는 예언-심판의 공적 발화라는 점이 드러나는 ‘선언’이 가장 읽기 자연스럽습니다.
theological_decisions:
