translation:
  language: ko
  text: 그들이 말했습니다. 「거짓말입니다. 부디 우리에게 말해 주십시오.」 그러자 그가 말했습니다. 「그가 내게 이러저러하게[a] 말했습니다. 곧, ‘야훼께서 이렇게 말씀하셨습니다. 내가 너를 이스라엘의 왕으로 기름부었습니다.’」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, 정확한 인용이 아닌 불특정하거나 대략적인 요약을 가리킵니다. ‘이것저것’ 또는 ‘이러쿵저러쿵’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: That is a lie
  chosen_korean: 거짓말입니다
  alternatives_korean:
  - 거짓입니다
  - 말이 안 됩니다
  lexicon: HALOT
  rationale: 명사 שֶׁקֶר는 ‘거짓/거짓말’을 뜻하므로, 한국어 대화문에서는 서술형으로 자연스럽게 ‘거짓말입니다’라고 옮겨 즉각적인 부정과 의심의 뉘앙스를 살렸습니다.
- source_word: הַגֶּד נָא לָנוּ
  english_pob_choice: Please tell us
  chosen_korean: 부디 우리에게 말해 주십시오
  alternatives_korean:
  - 우리에게 말해 주십시오
  - 제발 우리에게 말해 주십시오
  lexicon: HALOT
  rationale: הגּד는 ‘말하다/선포하다’의 명령형이고 נָא는 공손한 요청을 더하므로, 현대 합쇼체에서 ‘부디’로 간곡함을 살려 번역했습니다.
- source_word: כָּזֹאת וְכָזֹאת
  english_pob_choice: this and that
  chosen_korean: 이러저러하게
  alternatives_korean:
  - 이것저것
  - 이러쿵저러쿵
  lexicon: HALOT
  rationale: 이 표현은 정확한 인용이 아니라 대강의 요약을 가리키는 관용구이므로, 한국어에서도 비정형·개략적 보고를 나타내는 ‘이러저러하게’로 처리했습니다.
- source_word: מְשַׁחְתִּיךָ
  english_pob_choice: I have anointed you
  chosen_korean: 내가 너를 … 기름부었습니다
  alternatives_korean:
  - 내가 너를 … 기름부었습니다
  - 내가 너를 … 임명했습니다
  lexicon: HALOT
  rationale: משׁח의 기본 뜻을 따라 ‘기름부었습니다’로 옮겨 왕권 부여와 신학적 함의를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 히브리어 고유명 יְהוָה를 직접 사용하므로, 프로젝트 기본값에 따라 ‘야훼’로 옮겨 언약 სახელ을 드러냈습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 예언자적 전령 공식 כֹּה אָמַר יְהוָה
  chosen_reading: 야훼께서 이렇게 말씀하셨습니다
  alternative_readings:
  - 주께서 이렇게 말씀하셨습니다
  - 야훼께서 말씀하십니다
  rationale: 예언 전달문의 공식을 현대 한국어에 맞게 자연화하되, 직접화법의 선언성을 유지했습니다. 장면이 왕위 선포 전의 공식 메시지이므로 합쇼체를 유지했습니다.
  doctrine_reference: 예언자적 전언 공식의 직설성과 공적 선언성
