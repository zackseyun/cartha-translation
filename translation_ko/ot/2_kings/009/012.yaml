translation:
  language: ko
  text: 그들이 말했습니다. 「거짓말입니다. 부디 우리에게 말해 주십시오.」 그러자 그가 말했습니다. 「이러저러하게 그가 내게 말하며, ‘야훼께서 이렇게 말씀하셨습니다. 내가 너를 이스라엘의 왕으로 기름부었습니다.’」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구로, ‘이것과 저것’이라는 뜻의 불정확한 요약을 가리킵니다. ‘이러저러하게’도 가능한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  english_pob_choice: That is a lie
  chosen_korean: 거짓말입니다
  alternatives_korean:
  - 거짓입니다
  - 말이 안 됩니다
  lexicon: HALOT
  rationale: 명사 שֶׁקֶר는 ‘거짓/거짓말’을 뜻하므로, 한국어 대화문에서는 서술형으로 자연스럽게 ‘거짓말입니다’라고 옮겨 즉각적인 부정과 의심의 뉘앙스를 살렸습니다.
- source_word: הַגֶּד נָא לָנוּ
  english_pob_choice: Please tell us
  chosen_korean: 부디 우리에게 말해 주십시오
  alternatives_korean:
  - 우리에게 말해 주십시오
  - 제발 우리에게 말해 주십시오
  lexicon: HALOT
  rationale: הגּד는 ‘말하다/선포하다’의 명령형이고 נָא는 공손한 요청을 더하므로, 현대 합쇼체에서 ‘부디’로 간곡함을 살려 번역했습니다.
- source_word: כָּזֹאת וְכָזֹאת
  english_pob_choice: this and that
  chosen_korean: 이러저러하게
  alternatives_korean:
  - 이것저것
  - 이러쿵저러쿵
  lexicon: HALOT
  rationale: 이 표현은 정확한 인용이 아니라 대강의 요약을 가리키는 관용구이므로, 한국어에서도 비정형·개략적 보고를 나타내는 ‘이러저러하게’로 처리했습니다.
- source_word: מְשַׁחְתִּיךָ
  english_pob_choice: I have anointed you
  chosen_korean: 내가 너를 … 기름부었습니다
  alternatives_korean:
  - 내가 너를 … 기름부었습니다
  - 내가 너를 … 임명했습니다
  lexicon: HALOT
  rationale: משׁח의 기본 뜻을 따라 ‘기름부었습니다’로 옮겨 왕권 부여와 신학적 함의를 유지했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
