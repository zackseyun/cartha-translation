  rationale: 예언 전달문의 공식을 현대 한국어에 맞게 자연화하되, 직접화법의 선언성을 유지했습니다. 장면이 왕위 선포 전의 공식 메시지이므로 합쇼체를 유지했습니다.
  doctrine_reference: 예언자적 전언 공식의 직설성과 공적 선언성
