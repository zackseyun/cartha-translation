theological_decisions:
- issue: 훼손된 시신의 잔해를 어떤 수준으로 직설적으로 표현할지
  chosen_reading: 예의상 완곡하게 돌리지 않고 신체 잔해를 직접적으로 드러내는 번역을 유지했습니다.
  alternative_readings:
  - 시신의 일부만 남아 있었습니다
  - 유해만 남아 있었습니다
  rationale: 본문은 아하시야의 어머니 이세벨의 최후를 극적으로 기록하며, 남은 신체 부위를 열거합니다. 이 충격성을 약화시키지 않는 것이 본문 효과를 보존합니다.
  doctrine_reference: 본문 서술의 수사적 강도 보존
