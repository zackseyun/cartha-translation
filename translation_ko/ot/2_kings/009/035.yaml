translation:
  language: ko
  text: 그들은 그녀를 장사 지내려고 갔지만, 그녀의 시신에서는 두개골과 발과 손바닥 외에는 아무것도 찾지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어를 직역하면 ‘그녀 안에서’입니다. 여기서는 시신에 남아 있던 부분을 가리키는 관용적 표현입니다.
    reason: lexical_alternative
