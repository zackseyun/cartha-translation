  yaml_path: translation/ot/2_kings/009/035.yaml
  text: So they went to bury her[a], but they found nothing of her except the skull, the feet, and the palms of the hands.
  footnotes:
  - marker: a
    text: Or 'but they found nothing in her except the skull, the feet, and the palms of the hands.' The Hebrew expression with 'in her' is idiomatic in context for what remained of her body.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그녀를 장사하려고 갔지만, 그 안에서는 두개골과 발과 손바닥밖에 찾지 못했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 안에서는’은 히브리어 בָהּ의 관용적 의미를 반영한 것으로, 시신의 남은 부분을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
