  yaml_path: translation/ot/2_kings/009/023.yaml
  text: Then Jehoram turned his hands and fled[a], and said to Ahaziah, “Treachery[b], Ahaziah!”
  footnotes:
  - marker: a
    text: Or “turned about his hands”; the expression likely refers to turning the chariot by the use of his hands, but the Hebrew does not explicitly mention reins or chariot here.
    reason: lexical_alternative
  - marker: b
    text: Or “Deceit, Ahaziah!”
    reason: alternative_reading
translation:
  language: ko
  text: 그때 여호람이 손을 돌려 도망하였고, 아하시야에게 말했습니다. 「배반이다, 아하시야!」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “손을 돌렸다”로도 옮길 수 있습니다. 이 표현은 아마도 전차를 고삐로 돌리는 동작을 가리키지만, 히브리어 본문에는 고삐나 전차가 명시되어 있지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “기만이다, 아하시야!”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יְהוֹרָם יָדָיו
  english_pob_choice: Then Jehoram turned his hands and fled
  chosen_korean: “손을 돌려”
  alternatives_korean:
  - “방향을 돌려”
  - “말고삐를 돌려”
  - “몸을 돌려”
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘손들’을 돌린다고 하며, 본문 맥락상 전차를 조종하는 동작을 가리킬 가능성이 있지만, 본문에 고삐나 전차가 명시되지 않으므로 핵심 동작만 드러내는 “손을 돌려”로 옮겼습니다.
- source_word: וַיָּנֹס
  english_pob_choice: fled
  chosen_korean: “도망하였고”
  alternatives_korean:
  - “달아났고”
  - “피하여 갔고”
  lexicon: HALOT
  rationale: נוס는 서사에서 급박한 도주를 나타내므로, 현대 한국어의 자연스러운 서술체인 “도망하였고”가 가장 직접적입니다.
- source_word: מִרְמָה
  english_pob_choice: Treachery
  chosen_korean: “배반이다”
  alternatives_korean:
  - “기만이다”
  - “속임수다”
  - “반역이다”
  lexicon: HALOT
  rationale: מִרְמָה는 기본적으로 속임수이지만, 여기서는 적대적 행동에 대한 외침이므로 상황적 뉘앙스를 살려 “배반”으로 옮겼습니다. “반역”은 정치적 의미가 더 강해 히브리어의 폭보다 좁습니다.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  english_pob_choice: Ahaziah
  chosen_korean: 아하시야
  alternatives_korean:
  - 아하시아
  lexicon: 표준 음역
  rationale: 인명은 한국어 성서 관용 표기를 따르되, 본문의 직접 호명은 그대로 유지했습니다.
theological_decisions:
- issue: 직접 화법의 격식 유지
  chosen_reading: 아하시야를 향한 외침을 따옴표 안에 직접 발화로 유지했습니다.
  alternative_readings:
  - 간접화법으로 풀어 쓰기
