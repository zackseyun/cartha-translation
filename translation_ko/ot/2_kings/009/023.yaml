- source_word: מִרְמָה
  english_pob_choice: Treachery
  chosen_korean: “배반이다”
  alternatives_korean:
  - “기만이다”
  - “속임수다”
  - “반역이다”
  lexicon: HALOT
  rationale: מִרְמָה는 기본적으로 속임수이지만, 여기서는 적대적 행동에 대한 외침이므로 상황적 뉘앙스를 살려 “배반”으로 옮겼습니다. “반역”은 정치적 의미가 더 강해 히브리어의 폭보다 좁습니다.
- source_word: אֲחַזְיָהוּ / אֲחַזְיָה
  english_pob_choice: Ahaziah
  chosen_korean: 아하시야
