- from: 그가 일어나 집으로 들어가서 그 기름을 그의 머리에 붓고 그에게 말했습니다. “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 내가 너에게 야훼의 백성, 곧 이스라엘의 왕이 되도록 기름부었습니다.”[a]
  to: 그가 일어나 집 안으로 들어가, 기름을 그의 머리에 붓고 그에게 말했습니다. “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 내가 너를 야훼의 백성, 곧 이스라엘의 왕으로 기름부었습니다.”[a]
  rationale: 직접 목적어 ‘너를’과 임명 결과를 나타내는 ‘왕으로’를 회복하여 히브리어 구문과 의미를 더 가깝게 반영했습니다. ‘기름을’로 한국어 표현을 자연스럽게 다듬었고, 각주도 수행적 완료형이라는 해석 가능성을 보존하면서 본문의 직접적인 기름부음 표현을 유지했습니다.
