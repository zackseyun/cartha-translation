    issue: ‘너에게 … 왕이 되도록’이라는 표현
    rationale: 히브리어 מְשַׁחְתִּיךָ는 ‘내가 너를 기름부었다’로, 2인칭 남성 단수 목적어를 직접 취합니다. ‘왕이 되도록’은 원문의 왕으로 임명하는 술어를 목적절로 재구성하므로, ‘너를 … 왕으로 기름부었습니다’로 옮기는 것이 더 충실합니다.
