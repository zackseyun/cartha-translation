  source_fidelity: 핵심 의미는 대체로 충실하지만, ‘내가 너에게 … 왕이 되도록 기름부었습니다’는 히브리어의 직접 목적어 ‘너를’과 왕으로 기름부음의 서술을 목적·결과절로 바꾸어 놓았습니다. 또한 왕권의 대상인 ‘야훼의 백성, 곧 이스라엘’을 ‘왕’에 자연스럽게 연결할 필요가 있습니다.
  naturalness: 서사 부분은 자연스럽습니다. 다만 한국어에서 정관사만을 반영한 ‘그 기름’은 다소 부자연스러우며, ‘너에게 … 왕이 되도록 기름부었습니다’보다 ‘너를 … 왕으로 기름부었습니다’가 현대 표준어에서 더 직접적이고 자연스럽습니다.
  terminology: ‘야훼’, ‘이스라엘의 하나님’, ‘기름부었습니다’는 프로젝트 방침 및 본문의 의례·신학 용어에 적절합니다. ‘왕으로 기름부었습니다’는 מְשַׁחְתִּיךָ לְמֶלֶךְ의 통상적이고 직접적인 대응입니다.
  issues:
