  text: וַ/יָּ֨קָם֙ וַ/יָּבֹ֣א הַ/בַּ֔יְתָ/ה וַ/יִּצֹ֥ק הַ/שֶּׁ֖מֶן אֶל רֹאשׁ֑/וֹ וַ/יֹּ֣אמֶר ל֗/וֹ כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מְשַׁחְתִּ֧י/ךָֽ לְ/מֶ֛לֶךְ אֶל עַ֥ם יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/006.yaml
  text: 'So he got up and went into the house[a], and he poured the oil on his head and said to him, “Thus says Yahweh, the God of Israel: I have anointed you king over the people of Yahweh, over Israel.”'
  footnotes:
  - marker: a
    text: Or, “I anoint you king over the LORD’s people, over Israel.” The Hebrew perfect may be understood as performative in this anointing formula.
    reason: alternative_reading
translation:
  language: ko
  text: 그가 일어나 집 안으로 들어가, 기름을 그의 머리에 붓고 그에게 말했습니다. “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 내가 너를 야훼의 백성, 곧 이스라엘의 왕으로 기름부었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 너를 야훼의 백성, 곧 이스라엘의 왕으로 기름붓습니다.” 히브리어 완료형은 이 기름부음 공식에서 수행적으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  english_pob_choice: he got up
  chosen_korean: 일어나
  alternatives_korean:
  - 일어났습니다
  - 몸을 일으켜
  lexicon: HALOT
  rationale: 서사적 연속을 나타내는 wayyiqtol을 자연스러운 현대 한국어 동사 연쇄로 옮기되, 문어체의 간결함을 유지했습니다.
- source_word: וַיָּבֹא הַבַּיְתָה
  english_pob_choice: went into the house
  chosen_korean: 집으로 들어가서
  alternatives_korean:
  - 집 안으로 들어가서
  - 집에 들어가서
  lexicon: HALOT
  rationale: 방향성을 가진 ‘들어가다’로 הביתה의 이동 의미를 살렸고, 이어지는 동작과의 연결을 위해 ‘-아서’를 사용했습니다.
- source_word: וַיִּצֹק הַשֶּׁמֶן אֶל רֹאשׁוֹ
  english_pob_choice: poured the oil on his head
  chosen_korean: 그 기름을 그의 머리에 붓고
  alternatives_korean:
  - 기름을 그의 머리에 붓고
  - 그 기름을 머리에 쏟아붓고
  lexicon: HALOT
  rationale: יצק의 기본 의미인 ‘붓다’를 직접 살렸고, 정관사 있는 ‘기름’을 ‘그 기름’으로 옮겨 의례적 특정 대상을 드러냈습니다.
- source_word: כֹּה אָמַר יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: Thus says Yahweh, the God of Israel
  chosen_korean: 야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼, 이스라엘의 하나님께서 이같이 말씀하십니다
  - 야훼, 이스라엘의 하나님께서 말씀하시기를
  lexicon: HALOT
  rationale: 예언자적 선포 공식의 현재형 ‘말씀하십니다’를 살리고, 하나님의 이름은 본문 원칙에 따라 ‘야훼’로 옮겼습니다.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ
  english_pob_choice: I have anointed you king
  chosen_korean: 내가 너에게 … 왕이 되도록 기름부었습니다
  alternatives_korean:
  - 내가 너를 왕으로 기름부었습니다
  - 내가 너를 왕으로 세웠습니다
  lexicon: HALOT
  rationale: 히브리어 완료형의 수행적 힘을 살리면서도, 목적구 ‘לְמֶלֶךְ’를 한국어에서 자연스러운 결과·목적 표현인 ‘왕이 되도록’으로 풀어 왕권 부여의 의미를 분명히 했습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문에 직접 나온 여호와의 언약명을 한국어 관습어보다 स्रोत 직접 대응형인 ‘야훼’로 옮겨, 왕위 위임이 인간 권위가 아니라 언약 주권에서 비롯됨을 드러냈습니다.
  doctrine_reference: Contested terms — יְהוָה / YHWH → 야훼
- issue: 기름부음 선언의 수행적 완료
  chosen_reading: 기름부었습니다
  alternative_readings:
  - 기름붓습니다
  - 기름부으셨습니다
  rationale: 방금 이루어진 의례를 가리키는 완료형을 유지하되, 선언 자체가 즉시 효력을 갖는 수행적 성격도 함께 보존했습니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; preserve source-text force without flattening ritual speech'
