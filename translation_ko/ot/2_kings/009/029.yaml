    reason: cross_reference
lexical_decisions:
- source_word: וּ/בִ/שְׁנַת
  english_pob_choice: In the ... year
  chosen_korean: '... 해에'
  alternatives_korean:
  - '... 년에'
  - '... 해에 그리고'
  lexicon: WLC
  rationale: 연대기 서두의 시간 부사구로 자연스럽게 옮기되, 히브리어의 접속 요소를 한국어에서 불필요하게 반복하지 않기 위해 간결한 ‘... 해에’를 선택했습니다.
- source_word: אַחַת עֶשְׂרֵה שָׁנָה
  english_pob_choice: eleventh year
  chosen_korean: 열한째 해
  alternatives_korean:
  - 열한 해
  - 열한 번째 해
  lexicon: WLC
  rationale: 히브리어의 왕년 표준 관용구를 서수형으로 살려, ‘열한째 해’가 가장 직접적으로 대응합니다.
- source_word: לְיוֹרָם בֶּן אַחְאָב
  english_pob_choice: of Joram son of Ahab
  chosen_korean: 여호람의 아합의 아들
  alternatives_korean:
  - 여호람의 아들 아합의 아들
  - 아합의 아들 여호람의
  lexicon: WLC
  rationale: לְיוֹרָם은 연대의 기준점이 되는 여호람을 표시하므로 소유격으로 처리했고, בן אַחְאָב은 계보를 드러내는 직역에 가깝게 ‘아합의 아들’로 옮겼습니다.
- source_word: מָלַךְ
  english_pob_choice: became king
  chosen_korean: 왕이 되었습니다
  alternatives_korean:
  - 통치하기 시작했습니다
  - 즉위했습니다
  lexicon: WLC
  rationale: 즉위의 진입점을 나타내는 동사이므로, 결과 상태보다 시작 사건을 드러내는 ‘왕이 되었습니다’가 자연스럽고 정확합니다.
- source_word: עַל יְהוּדָה
  english_pob_choice: over Judah
  chosen_korean: 유다의
  alternatives_korean:
  - 유다 위에
  - 유다를 다스려
  lexicon: WLC
  rationale: מלך עם על은 통치 대상을 나타내므로 한국어 관용에 맞게 ‘유다의 왕’으로 풀어 왕권의 대상 관계를 분명히 했습니다.
theological_decisions:
- issue: 열왕기의 연대기 표기와 병행 본문 간 조화 문제
  chosen_reading: 본문이 적은 그대로의 연대 표기를 본문에 유지하고, 조화 시도는 하지 않았습니다.
  alternative_readings:
  - 역대기와 맞추어 연대를 보정하는 읽기
  - 본문의 숫자를 간접적으로 완화하는 읽기
  rationale: 이 구절은 역사 연대 주석이 핵심이므로, 히브리어 본문을 훼손하지 않고 독자가 본문 자체의 진술을 보도록 하는 것이 적절합니다.
  doctrine_reference: 성경 본문 보존과 역사 서술의 정직성
