source:
  edition: WLC
  text: וַ/יָּבֹ֗א וְ/הִנֵּ֨ה שָׂרֵ֤י הַ/חַ֨יִל֙ יֹֽשְׁבִ֔ים וַ/יֹּ֕אמֶר דָּבָ֥ר לִ֛/י אֵלֶ֖י/ךָ הַ/שָּׂ֑ר וַ/יֹּ֤אמֶר יֵהוּא֙ אֶל מִ֣י מִ/כֻּלָּ֔/נוּ וַ/יֹּ֖אמֶר אֵלֶ֥י/ךָ הַ/שָּֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/005.yaml
  text: So he came[a], and behold, the commanders of the army were sitting. And he said, “I have a word for you, commander.” And Jehu said, “For which one of us?” And he said, “For you, commander.”
  footnotes:
  - marker: a
    text: Or, “I have a message for you, commander.” Hebrew literally, “A word is to me for you, commander.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 들어가 보니 군대 지휘관들이 앉아 있었습니다. 그가 말했습니다. 「당신에게 전할 말이 있습니다, 지휘관님.」 예후가 말했습니다. 「우리 중 누구에게입니까?」 그가 말했습니다. 「당신에게입니다, 지휘관님.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신에게 전할 메시지가 있습니다, 지휘관님.’ 히브리어는 문자적으로 ‘말이 내게 있습니다, 당신에게, 지휘관님’이라는 식입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  english_pob_choice: So he came
  chosen_korean: 그가 들어가 보니
  alternatives_korean:
  - 그가 왔습니다
  - 그리고 그가 왔습니다
  - 그가 들어갔습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리되, 바로 뒤의 ‘보니’와 함께 अचानक한 장면 제시를 표현했습니다. 단순히 ‘오다’보다 이 문맥의 이동·진입을 더 잘 드러냅니다.
- source_word: שָׂרֵי הַחַיִל
  english_pob_choice: the commanders of the army
  chosen_korean: 군대 지휘관들
  alternatives_korean:
  - 군대의 장관들
  - 군대의 대장들
  - 군대의 장교들
  lexicon: HALOT
  rationale: שָׂרֵי는 통솔자/지휘자, הַחַיִל은 군사 집단을 가리키므로 현대 한국어에서는 ‘군대 지휘관들’이 가장 분명합니다. ‘대장’은 구어적 뉘앙스가 강하고 ‘장교’는 계급감이 다소 좁습니다.
- source_word: יֹשְׁבִים
  english_pob_choice: were sitting
  chosen_korean: 앉아 있었습니다
  alternatives_korean:
  - 앉아 있었습니다
  - 앉아 있었습니다
  - 앉아 있던 중이었습니다
  lexicon: HALOT
  rationale: 분사형의 지속적 상태를 살려 장면 배경을 보여 주는 표현으로 옮겼습니다. ‘앉아 있던 중’은 다소 장황합니다.
- source_word: דָּבָר לִי אֵלֶיךָ
  english_pob_choice: I have a word for you
  chosen_korean: 당신에게 전할 말이 있습니다
  alternatives_korean:
  - 당신에게 할 말이 있습니다
  - 당신을 위한 말이 있습니다
  - 당신에게 전해 드릴 말이 있습니다
  lexicon: HALOT
  rationale: 히브리어의 ‘말/사건’(דָּבָר)과 방향성 표현을 한국어 자연문으로 풀었습니다. ‘전할 말’은 원문의 전달성을 살리면서도 지나치게 의역하지 않습니다.
- source_word: הַשַּׂר
  english_pob_choice: commander
  chosen_korean: 지휘관님
  alternatives_korean:
  - 지휘관
  - 사령관님
  - 대장님
  lexicon: HALOT
  rationale: 호칭으로 직접 부르는 장면이므로 존대를 반영했습니다. ‘사령관’은 현대 군 직책에 더 한정되고, ‘대장님’은 비격식적입니다.
- source_word: אֶל־מִי מִכֻּלָּנוּ
  english_pob_choice: For which one of us?
  chosen_korean: 우리 중 누구에게입니까?
  alternatives_korean:
  - 우리 중 누구에게입니까?
  - 우리 중 누구를 말씀하십니까?
  - 우리 가운데 누구에게입니까?
  lexicon: HALOT
  rationale: ‘אֶל־מִי’의 지시 대상을 묻는 문장을 자연스러운 한국어 질문으로 옮겼습니다. ‘우리 중’은 מִכֻּלָּנוּ의 부분적 의미를 살립니다.
- source_word: אֵלֶיךָ הַשָּׂר
  english_pob_choice: For you, commander
  chosen_korean: 당신에게입니다, 지휘관님
  alternatives_korean:
  - 당신에게입니다, 지휘관님
  - 지휘관님께입니다
  - 바로 당신에게입니다, 지휘관님
  lexicon: HALOT
  rationale: 앞선 표현과 대응되도록 대상 지시를 분명히 했습니다. ‘입니다’로 마무리해 문맥의 단정적 전달을 살렸습니다.
theological_decisions:
- issue: 군대 지휘관에 대한 직접 호칭의 높임말 처리
  chosen_reading: 예후와 화자는 상호 대화체로 유지하되, 호칭 ‘지휘관님’에는 한국어 존대를 적용했습니다.
  alternative_readings:
  - 모두 반말로 옮김
  - 모두 평서체로 옮김
  rationale: 원문은 군사적 구두 대화의 긴박함을 보이면서도 한국어 독자에게는 직접 호칭의 예의를 자연스럽게 전달해야 합니다. 본문 의미를 바꾸지 않으면서도 장면의 사회적 관계를 살렸습니다.
  doctrine_reference: 문체·화용 선택
- issue: ‘דָּבָר’의 의미를 ‘말’로 유지할지 ‘메시지’로 풀지
  chosen_reading: ‘전할 말’로 두어 원문의 ‘word/matter’ 범위를 유지했습니다.
  alternative_readings:
  - 메시지
  - 소식
  rationale: 이 구절은 단순 정보 전달 이상의 구두 메시지를 가리키지만, 특정 내용을 덧붙이지는 않습니다. ‘전할 말’은 의미 범위를 과도하게 좁히지 않는 중간 선택입니다.
  doctrine_reference: 문체·의미 범위
