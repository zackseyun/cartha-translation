  naturalness: 합쇼체 서술과 명령의 어조는 전반적으로 자연스럽습니다. ‘상처를 치료하려고’는 주체가 치료 행위를 하는 듯 들릴 수 있어 ‘상처에서 회복하려고’가 더 자연스럽고 정확합니다. 명령문은 도망자가 떠나는 것을 막으라는 뜻이 분명하도록 다듬었습니다.
  terminology: ‘아람 사람들’, ‘아람 왕 하사엘’, ‘이스르엘’은 적절합니다. 각주 내용 자체도 적절하지만, a는 ‘너희의 뜻’ 표현에, b는 ‘아람 사람들’에 각각 붙어야 합니다. 현 초안은 두 표지가 문장 끝에 함께 놓여 있어 해당 어휘의 각주 연결이 불명확합니다.
