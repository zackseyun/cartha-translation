  text: וַ/יָּשָׁב֩ יְהוֹרָ֨ם הַ/מֶּ֜לֶךְ לְ/הִתְרַפֵּ֣א בִ/יְזְרְעֶ֗אל מִן הַ/מַּכִּים֙ אֲשֶׁ֣ר יַכֻּ֣/הוּ אֲרַמִּ֔ים בְּ/הִלָּ֣חֲמ֔/וֹ אֶת חֲזָאֵ֖ל מֶ֣לֶךְ אֲרָ֑ם וַ/יֹּ֤אמֶר יֵהוּא֙ אִם יֵ֣שׁ נַפְשְׁ/כֶ֔ם אַל יֵצֵ֤א פָלִיט֙ מִן הָ/עִ֔יר לָ/לֶ֖כֶת ל/גיד בְּ/יִזְרְעֶֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/015.yaml
  text: Now King Jehoram had returned to Jezreel to recover from the wounds that the Arameans had inflicted on him when he fought against Hazael king of Aram[a]. And Jehu said, “If this is your mind[b], let no fugitive leave the city to go and tell it in Jezreel.”
  footnotes:
  - marker: a
    text: Or, “If this is your desire” or “If you are willing.” The Hebrew idiom is literally, “If there is your soul.”
    reason: lexical_alternative
  - marker: b
    text: 'Traditionally, “the Syrians.” Hebrew: “Arameans.”'
    reason: lexical_alternative
translation:
  language: ko
  text: 요람 왕은 아람 왕 하사엘과 싸울 때 아람 사람들[b]에게 입은 상처에서 회복하려고 이스르엘로 돌아와 있었습니다. 예후가 말했습니다. 「만일 너희의 뜻이 그렇다면[a], 아무 도망자도 성읍에서 나가 이스르엘에 알리러 가지 못하게 하십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “만일 너희의 소원이 그렇다면” 혹은 “만일 너희가 원한다면.” 히브리어 관용구는 문자적으로 “만일 너희의 혼이 있다면”입니다.
    reason: lexical_alternative
  - marker: b
    text: 전통적으로는 “시리아 사람들”이라고 옮기기도 하지만, 히브리어는 “아람 사람들”입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  english_pob_choice: had returned
  chosen_korean: 돌아와 있었습니다
  alternatives_korean:
  - 돌아왔습니다
  - 되돌아왔습니다
  lexicon: HALOT
  rationale: 서술 진행을 자연스럽게 살리면서, 이미 이스르엘에 와 있던 상태를 드러내는 과거완료 뉘앙스를 한국어의 상태 지속 표현으로 옮겼습니다.
- source_word: לְהִתְרַפֵּא
  english_pob_choice: to recover
  chosen_korean: 치료하려고
  alternatives_korean:
  - 회복하려고
  - 낫기 위해
  lexicon: HALOT
  rationale: 부상에서 회복하는 목적을 현대 한국어로 간명하게 나타냈습니다. ‘자기 몸을 고치다’ 같은 오해를 피했습니다.
- source_word: אֲרַמִּים
  english_pob_choice: the Arameans
  chosen_korean: 아람 사람들
  alternatives_korean:
  - 아람인들
  - 시리아 사람들
  lexicon: HALOT
  rationale: 히브리어 지명·민족명 아람을 직접 반영해 역사적 배경을 보존했습니다. 전통적 ‘시리아 사람들’은 피했습니다.
- source_word: אִם יֵשׁ נַפְשְׁכֶם
  english_pob_choice: If this is your mind
  chosen_korean: 만일 너희의 뜻이 그렇다면
  alternatives_korean:
  - 만일 너희가 원한다면
  - 만일 너희의 마음이 그렇다면
  lexicon: HALOT
  rationale: 직역하면 ‘너희의 혼/영혼이 있다’는 관용구이므로, 영어 POB가 지시한 의지·원함의 의미를 한국어로 자연스럽게 살렸습니다. 본문 주석과 연결되는 핵심 표현입니다.
- source_word: לָלֶכֶת לְהַגִּיד
  english_pob_choice: to go and tell it
  chosen_korean: 알리러 가게
  alternatives_korean:
  - 가서 알리게
  - 가서 전하게
  lexicon: HALOT
  rationale: 이중 부정사를 목적 표현으로 옮겨, 성읍 밖으로 나가 소식을 전달하는 행위를 짧고 분명하게 나타냈습니다.
theological_decisions:
- issue: 예후의 명령문 어조
  chosen_reading: 직접 명령이므로 한국어에서도 공적인 군사적 제지 명령의 긴박함을 살려 「~하지 마십시오」로 옮겼습니다.
  alternative_readings:
  - ~하지 말게 하십시오
  - ~하지 못하게 하십시오
  rationale: 히브리어 금지명령을 완곡하게 낮추지 않고, 상황의 긴박성과 권위 있는 발화를 유지하기 위해 표준 합쇼체 금지형을 선택했습니다.
  doctrine_reference: 서사 본문 어조 보존 원칙
