- from: 그때 예후가 주인의 신하들에게 나가자, 그들 가운데 하나가 그에게 말했습니다. “모든 것이 잘됩니까? 왜 이 미친 사람이 당신에게 왔습니까?” 예후가 그들에게 말했습니다. “그 사람과 그의 말을 당신들이 알지 않습니까?”
  to: 그때 예후가 그의 주인의 신하들에게 나갔습니다. 그러자 그들 가운데 한 사람이 그에게 말했습니다. “모든 것이 잘됩니까? 왜 이 미친 사람이 당신에게 왔습니까?” 예후가 그들에게 말했습니다. “여러분은 그 사람과 그가 하는 말을 알고 있습니다.”
  rationale: 원문의 평서문을 평서문으로 회복하고, 사건 연결을 자연스러운 한국어 서사로 다듬었습니다. ‘미친 사람’이라는 표현은 화자들의 경멸적 호칭을 나타내므로 완화하거나 현대적 진단 용어로 바꾸지 않았습니다.
