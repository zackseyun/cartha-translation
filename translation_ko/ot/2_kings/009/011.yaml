reference: 2 Kings 9:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵה֗וּא יָצָא֙ אֶל עַבְדֵ֣י אֲדֹנָ֔י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ הֲ/שָׁל֔וֹם מַדּ֛וּעַ בָּֽא הַ/מְשֻׁגָּ֥ע הַ/זֶּ֖ה אֵלֶ֑י/ךָ וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם אַתֶּ֛ם יְדַעְתֶּ֥ם אֶת הָ/אִ֖ישׁ וְ/אֶת שִׂיחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/011.yaml
  text: Then Jehu went out to the servants of his master, and one said to him, “Is everything well? Why did this madman come to you?” And he said to them, “You know the man and his talk.”
  footnotes:
  - marker: a
    text: Or, “Is all well?” Hebrew literally asks, “Is it peace?”
    reason: lexical_alternative
  - marker: b
    text: Or, “this insane man” or “this crazy fellow.” The Hebrew is a contemptuous label.
    reason: lexical_alternative
  - marker: c
    text: Or, “his babble” / “his manner of speaking.” The Hebrew can refer broadly to a person's speech or discourse.
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 예후가 주인의 신하들에게 나가자, 그들 가운데 하나가 그에게 말했습니다. “모든 것이 잘됩니까? 왜 이 미친 사람이 당신에게 왔습니까?” 예후가 그들에게 말했습니다. “그 사람과 그의 말을 당신들이 알지 않습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַבְדֵי אֲדֹנָיו
  english_pob_choice: the servants of his master
  chosen_korean: 주인의 신하들
  alternatives_korean:
  - 주인의 종들
  - 그의 주인의 종들
  lexicon: HALOT
  rationale: עֶבֶד는 문맥에 따라 종/신하를 가리킬 수 있는데, 여기서는 예후의 상관에게 속한 수행원들을 뜻하므로 현대 한국어에서 자연스러운 ‘신하들’이 적절합니다.
- source_word: הֲשָׁלוֹם
  english_pob_choice: Is all well?
  chosen_korean: 모든 것이 잘됩니까?
  alternatives_korean:
  - 평안합니까?
  - 잘됩니까?
  lexicon: HALOT
  rationale: 히브리어는 문자적으로 ‘평화입니까?’이지만, 문맥상 안부와 형편을 묻는 관용구이므로 현대 한국어로 ‘모든 것이 잘됩니까?’가 의미를 가장 분명하게 전달합니다.
- source_word: הַמְשֻׁגָּע הַזֶּה
  english_pob_choice: this madman
  chosen_korean: 이 미친 사람
  alternatives_korean:
  - 이 미친 놈
  - 이 정신 나간 사람
  lexicon: HALOT
  rationale: 원문의 경멸적 뉘앙스를 살리되, 한국어 출판문체에서 과도하게 거친 욕설은 피하기 위해 ‘미친 사람’으로 옮겼습니다.
- source_word: שִׂיחוֹ
  english_pob_choice: his talk
  chosen_korean: 그의 말
  alternatives_korean:
  - 그의 이야기
  - 그의 수다
  - 그의 말투
  lexicon: HALOT
  rationale: שִׂיח은 말, 대화, 담화를 넓게 가리킬 수 있으므로, 이 문맥의 경멸적이면서도 다소 압축된 표현을 살려 ‘그의 말’로 옮겼습니다.
- source_word: וַיֹּאמֶר לוֹ
  english_pob_choice: and one said to him
  chosen_korean: 그들 가운데 하나가 그에게 말했습니다
  alternatives_korean:
  - 한 사람이 그에게 말했습니다
  - 그들이 그에게 말했습니다
  lexicon: HALOT
  rationale: 히브리어 동사는 단수형이지만 앞의 복수 명사와 함께 쓰여 대표 1인이 말한 것으로 이해되므로, 자연스럽게 ‘그들 가운데 하나’로 풀었습니다.
