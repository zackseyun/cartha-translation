    issue: 평서문을 수사의문문으로 번역함
    rationale: 히브리어 אַתֶּם יְדַעְתֶּם은 ‘너희는 알고 있다’라는 평서문입니다. ‘알지 않습니까?’는 상대의 동의를 요구하는 질문 형식을 더하므로 평서문으로 고쳐야 합니다.
  - severity: low
    issue: ‘나가자’가 즉시성의 뉘앙스를 추가함
    rationale: וַיֵּצֵא는 단순히 예후가 나간 사건을 서술합니다. ‘나갔습니다. 그러자’는 한국어 서사 흐름을 자연스럽게 하면서 불필요한 즉시성을 피합니다.
