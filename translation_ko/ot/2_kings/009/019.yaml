  text: וַ/יִּשְׁלַ֗ח רֹכֵ֣ב סוּס֮ שֵׁנִי֒ וַ/יָּבֹ֣א אֲלֵ/הֶ֔ם וַ/יֹּ֛אמֶר כֹּֽה אָמַ֥ר הַ/מֶּ֖לֶךְ שָׁל֑וֹם וַ/יֹּ֧אמֶר יֵה֛וּא מַה לְּ/ךָ֥ וּ/לְ/שָׁל֖וֹם סֹ֥ב אֶֽל אַחֲרָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
  footnotes:
  - marker: a
    text: Or “Is all well?” The Hebrew שָׁלוֹם can mean “peace,” “welfare,” or “well-being.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 둘째 기병을 보내자 그가 그들에게 와서 말하되, 「왕이 이렇게 말합니다. 평안합니까?」 하였습니다. 그러나 예후가 말하되, 「너와 평안이 무슨 상관이냐? 내 뒤로 돌아오라」 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무사합니까?” 히브리어 שָׁלוֹם은 “평안,” “복지,” “무사함”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
  english_pob_choice: a second horseman
  chosen_korean: 둘째 기병
  alternatives_korean:
  - 두 번째 말을 탄 사람
  - 둘째 마병
  lexicon: HALOT
  rationale: 군사적 사자 문맥에서 ‘기병’이 자연스럽고, ‘둘째’가 שֵׁנִי의 순서를 분명히 드러냅니다.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  english_pob_choice: Thus says the king
  chosen_korean: 왕이 이렇게 말합니다
  alternatives_korean:
  - 임금이 이같이 말합니다
  - 왕께서 말씀하십니다
  lexicon: HALOT
  rationale: 전령 공식의 엄격한 서술을 살리되, 현대 한국어로 자연스러운 보고체로 옮겼습니다.
- source_word: שָׁלוֹם
  english_pob_choice: peace
  chosen_korean: 평안
  alternatives_korean:
  - 평화
  - 안녕
  - 무사
  lexicon: HALOT
  rationale: 왕의 질문과 예후의 응답에서 같은 어휘를 반복해 긴장을 살리기 위해, 문맥상 ‘평안’으로 통일했습니다.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  english_pob_choice: What do you have to do with peace?
  chosen_korean: 너와 평안이 무슨 상관이냐?
  alternatives_korean:
  - 네게 평안이 무슨 일이냐?
  - 평안이 네게 무슨 상관이냐?
  lexicon: HALOT
  rationale: 관용적 거절/배제를 나타내는 히브리어 관용구를 직역보다 한국어 관용 표현으로 옮겨, 예후의 단호한 어조를 보존했습니다.
- source_word: סֹב אֶל אַחֲרָי
  english_pob_choice: Turn behind me
  chosen_korean: 내 뒤로 돌아오라
  alternatives_korean:
  - 내 뒤를 따르라
  - 내 뒤로 돌라
  lexicon: HALOT
  rationale: 문자적으로는 ‘내 뒤로’이지만, 문맥상 이동 방향 전환 명령이므로 한국어 명령형으로 간결하게 살렸습니다.
theological_decisions:
- issue: 평안/샬롬의 반복과 의미 범위
  chosen_reading: 두 차례 모두 ‘평안’으로 번역해, 단순한 안부 이상으로 정치적·관계적 상태를 묻는 긴장을 유지했습니다.
  alternative_readings:
  - 평화
  - 안녕
  - 무사
  rationale: 본문은 왕의 질문과 예후의 반문 사이에서 같은 শব্দ을 반복해 대조를 만듭니다. ‘평안’이 그 반복을 가장 안정적으로 드러냅니다.
  doctrine_reference: 본문의 어휘 반복과 서사적 대비
