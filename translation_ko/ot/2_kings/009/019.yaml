base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/019.yaml
  text: 'So he sent a second horseman[a], and he came to them and said, “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.”'
  footnotes:
  - marker: a
    text: Or “Is all well?” The Hebrew שָׁלוֹם can mean “peace,” “welfare,” or “well-being.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 두 번째 기병을 보냈습니다. 그가 그들에게 와서 말했습니다. “왕께서 이렇게 말씀하셨습니다. ‘평안하냐[a]?’” 그러자 예후가 말했습니다. “네가 평안과 무슨 상관이 있느냐? 내 뒤로 돌아서라.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무사하냐?” 히브리어 שָׁלוֹם은 “평안”, “복지”, “무사함”을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב סוּס שֵׁנִי
