  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
  footnotes:
  - marker: a
    text: Or “for he drives madly” or “for he drives with madness.” The Hebrew emphasizes Jehu’s frenzied, reckless manner of driving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 파수꾼이 이렇게 보고했습니다. 「그가 그들에게 이르렀으나 돌아오지 않았습니다. 그가 모는 방식은 님시의 아들 예후가 모는 방식과 같습니다. 그가 미친 듯이[a] 몰기 때문입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “미친 듯이”는 히브리어 בְּשִׁגָּעוֹן의 문자적 뉘앙스를 살린 표현입니다. 문맥상 “광란하듯” 또는 “미친 사람처럼”으로도 옮길 수 있습니다.
    reason: lexical_alternative
