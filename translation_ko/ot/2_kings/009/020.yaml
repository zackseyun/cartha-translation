  - 전했습니다
  lexicon: HALOT
  rationale: 감시 임무를 맡은 파수꾼이 상황을 상부에 전달하는 뉘앙스를 살려, 단순한 말하기보다 ‘보고하다’를 반영했습니다.
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 사람
  - 감시자
  lexicon: HALOT
  rationale: 성곽·군사 맥락의 관측 담당자를 자연스럽게 드러내는 한국어로 ‘파수꾼’을 택했습니다.
- source_word: הַמִּנְהָג כְּמִנְהַג
  english_pob_choice: the driving is like the driving
  chosen_korean: 달리는 모습이 … 달리는 모습과 같습니다
  alternatives_korean:
  - 몰는 방식이 … 몰는 방식과 같습니다
  - 운전하는 모습이 … 운전하는 모습과 같습니다
  lexicon: HALOT
  rationale: 전차를 몰고 달리는 장면이므로 ‘드라이빙’의 기능적 의미를 살려 ‘달리는 모습’으로 옮겼고, 히브리어 반복을 살렸습니다.
- source_word: בְשִׁגָּעוֹן
  english_pob_choice: he drives madly
  chosen_korean: 미친 듯이 몰기 때문입니다
  alternatives_korean:
  - 광란하듯 몰기 때문입니다
  - 미친 사람처럼 몰기 때문입니다
  lexicon: HALOT
  rationale: 히브리어의 ‘광기/정신 이상’ 뉘앙스를 약화시키지 않으면서도, 전차를 몬다는 문맥에 맞게 부사구로 처리했습니다.
