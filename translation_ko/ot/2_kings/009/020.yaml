  yaml_path: translation/ot/2_kings/009/020.yaml
  text: And the watchman reported[a], saying, “He came up to them, but he has not returned; and the driving is like the driving of Jehu son of Nimshi, for he drives madly.”
  footnotes:
  - marker: a
    text: Or “for he drives madly” or “for he drives with madness.” The Hebrew emphasizes Jehu’s frenzied, reckless manner of driving.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 파수꾼이 보고하여 말했습니다. 「그가 그들에게까지 왔으나 돌아오지 않았습니다. 그리고 달리는 모습이 님시의 아들 예후의 달리는 모습과 같습니다. 그는 미친 듯이 몰기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “미친 듯이”는 히브리어 בְשִׁגָּעוֹן의 문자적 뉘앙스를 살린 표현입니다. 문맥상 ‘광란하듯’, ‘미친 사람처럼’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  english_pob_choice: reported
  chosen_korean: 보고하여 말했습니다
  alternatives_korean:
