  text: וַ/אֲחַזְיָ֤ה מֶֽלֶךְ יְהוּדָה֙ רָאָ֔ה וַ/יָּ֕נָס דֶּ֖רֶךְ בֵּ֣ית הַגָּ֑ן וַ/יִּרְדֹּ֨ף אַחֲרָ֜י/ו יֵה֗וּא וַ֠/יֹּאמֶר גַּם אֹת֞/וֹ הַכֻּ֣/הוּ אֶל הַ/מֶּרְכָּבָ֗ה בְּ/מַֽעֲלֵה גוּר֙ אֲשֶׁ֣ר אֶֽת יִבְלְעָ֔ם וַ/יָּ֥נָס מְגִדּ֖וֹ וַ/יָּ֥מָת שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/027.yaml
  text: When Ahaziah king of Judah saw this[a], he fled by the way of Beth-haggan. And Jehu pursued him and said, “Strike him too, in the chariot!” So they struck him at the ascent of Gur, which is by Ibleam[b]. But he fled to Megiddo and died there.
  footnotes:
  - marker: a
    text: Beth-haggan may mean 'house of the garden,' but here it is likely a place-name, so it is transliterated.
    reason: cultural_note
  - marker: b
    text: Or 'Strike him too in the chariot'; the Hebrew preposition is somewhat flexible here and may indicate location or direction.
    reason: lexical_alternative
translation:
  language: ko
  text: 유다 왕 아하시야가 이것을 보았을 때 그는 베트-학간 길로 도망하였습니다. 예후가 그의 뒤를 추격하며 말하였습니다. “그도 수레에서 쳐라!” 그래서 그들이 그를 구르의 비탈, 곧 이블르암 곁에서 쳤습니다. 그러나 그는 므깃도로 도망하여 거기서 죽었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 베트-학간은 문자적으로는 ‘정원의 집’이 될 수 있지만, 여기서는 지명으로 보는 것이 자연스럽습니다.
    reason: cultural_note
  - marker: b
    text: 히브리어의 אֶת는 여기서 위치를 다소 유연하게 나타낼 수 있어, ‘곁에서/근처에서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  english_pob_choice: he fled
  chosen_korean: 도망하였습니다
  alternatives_korean:
  - 달아났습니다
  - 도망쳤습니다
  lexicon: HALOT
  rationale: בּרח/נוס 계열의 동작을 자연스러운 현대 한국어로 옮기되, 서술체의 흐름을 위해 ‘도망하였습니다’를 택했습니다.
- source_word: דֶּרֶךְ בֵּית הַגָּן
  english_pob_choice: by the way of Beth-haggan
  chosen_korean: 베트-학간 길로
  alternatives_korean:
  - 베트-학간으로 가는 길로
  - 정원의 집 길로
  lexicon: HALOT
  rationale: בֵּית הַגָּן은 여기서 지명으로 기능하므로 음역을 유지했고, דֶּרֶךְ는 이동 경로를 나타내는 ‘길로’로 옮겼습니다.
- source_word: וַיִּרְדֹּף אַחֲרָיו
  english_pob_choice: pursued after him
  chosen_korean: 그의 뒤를 추격하며
  alternatives_korean:
  - 그를 추격하며
  - 뒤쫓으며
  lexicon: HALOT
  rationale: אַחַר의 방향성을 살려 ‘뒤를’로 처리했으며, 단순한 추격보다 연속 동작을 드러내는 ‘추격하며’가 문맥상 자연스럽습니다.
- source_word: גַּם אֹתוֹ
  english_pob_choice: him too
  chosen_korean: 그도
  alternatives_korean:
  - 그도 역시
  - 그 역시
  lexicon: HALOT
  rationale: 추가 명령의 대상이 아하시야까지 확대됨을 간결하게 반영했습니다.
- source_word: הַכֻּהוּ אֶל הַמֶּרְכָּבָה
  english_pob_choice: Strike him too, in the chariot!
  chosen_korean: 수레에서 쳐라
  alternatives_korean:
  - 수레 안에서 쳐라
  - 수레에 있는 그를 쳐라
  lexicon: HALOT
  rationale: נכה는 ‘치다/쳐서 쓰러뜨리다’의 기본 의미를 살렸고, אֶל הַמֶּרְכָּבָה는 장소적 맥락으로 이해해 ‘수레에서’로 자연스럽게 옮겼습니다.
- source_word: בְּמַעֲלֵה גוּר אֲשֶׁר אֶת יִבְלְעָם
  english_pob_choice: at the ascent of Gur, which is by Ibleam
  chosen_korean: 구르의 비탈, 곧 이블르암 곁에서
  alternatives_korean:
  - 구르의 오르막, 곧 이블르암 근처에서
  - 이블르암 곁에 있는 구르의 비탈에서
  lexicon: HALOT
  rationale: מַעֲלֶה는 지형상의 ‘오름/비탈’을 뜻하므로 이를 살렸고, אֶת는 위치 관계를 나타내는 문맥으로 보아 ‘곁에서’로 옮겼습니다.
