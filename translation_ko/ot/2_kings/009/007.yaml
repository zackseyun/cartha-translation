translation:
  language: ko
  text: 너는 네 주인 아합의 집을 쳐야 합니다. 나는 내 종들인 예언자들의 피와 야훼의 모든 종들의 피의 원수를 이세벨에게 갚겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘이세벨의 손에서’입니다. 이는 이세벨의 손에 의해 피가 흘려졌으며 그에게 책임이 있다는 뜻을 나타내는 관용적 표현입니다.
    reason: lexical_alternative
