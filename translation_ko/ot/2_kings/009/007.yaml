translation:
  language: ko
  text: 너는 네 주인 아합의 집을 쳐야 합니다. 나는 내 종들인 예언자들과 야훼의 모든 종들의 피를 이세벨의 손에서 갚을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 직역은 ‘이세벨의 손으로부터’이지만, 관용적으로는 ‘이세벨의 손에 의해’ 또는 ‘이세벨에게 책임이 있다’는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
