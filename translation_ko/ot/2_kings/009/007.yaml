  verdict: revise
  source_fidelity: 첫 문장은 וְהִכִּיתָה의 심판 명령과 ‘아합의 집’이라는 왕조·가문 관용을 대체로 충실히 옮깁니다. 그러나 ‘피를 … 갚다’는 וְנִקַּמְתִּי דְּמֵי의 보복·응보 의미를 한국어에서 자연스럽고 정확하게 전달하지 못합니다. ‘피의 원수를 … 갚다’로 해야 죽임당한 이들의 피에 대한 보복이라는 뜻이 명확해집니다. מִיַּד אִיזָבֶל은 이세벨의 행위책임 및 그에게서 보복을 요구하는 표현이므로, 본문에서는 ‘이세벨에게’로 자연스럽게 옮기고 각주에서 히브리어 관용구를 밝히는 것이 적절합니다.
  naturalness: ‘나는 내 종들인 예언자들과 야훼의 모든 종들의 피를 이세벨의 손에서 갚을 것입니다’는 ‘피를 갚다’ 및 ‘손에서 갚다’의 결합이 현대 한국어로 부자연스럽습니다. ‘…피의 원수를 이세벨에게 갚겠습니다’는 합쇼체를 유지하면서도 명료하고 자연스럽습니다.
  terminology: ‘야훼’, ‘종’, ‘예언자’, ‘아합의 집’은 프로젝트의 명명 및 핵심 용어 원칙에 부합합니다. ‘내 종들인 예언자들’은 히브리어의 동격 관계를 적절히 드러냅니다.
