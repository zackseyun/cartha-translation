source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ/רְא֤וֹת יְהוֹרָם֙ אֶת יֵה֔וּא וַ/יֹּ֖אמֶר הֲ/שָׁל֣וֹם יֵה֑וּא וַ/יֹּ֨אמֶר֙ מָ֣ה הַ/שָּׁל֔וֹם עַד זְנוּנֵ֞י אִיזֶ֧בֶל אִמְּ/ךָ֛ וּ/כְשָׁפֶ֖י/הָ הָ/רַבִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/022.yaml
  text: And it happened[a], when Jehoram saw Jehu, that he said, “Is it peace, Jehu?” And he said, “What peace can there be[b], so long as the prostitutions of Jezebel your mother and her many sorceries continue?”
  footnotes:
  - marker: a
    text: Or 'the whorings of Jezebel your mother.' The Hebrew term can carry both literal and figurative overtones, including moral and cultic unfaithfulness.
    reason: lexical_alternative
  - marker: b
    text: Or 'What peace?' The Hebrew repeats 'peace' from Jehoram's question for rhetorical effect.
    reason: lexical_alternative
translation:
  language: ko
  text: 여호람이 예후를 보았을 때, 그가 말했습니다. 「예후여, 평강이 있습니까?」 예후가 말했습니다. 「네 어머니 이세벨의 음행[a]과 그녀의 수많은 주술이 계속되는 한, 무슨 평강이 있겠습니까[b]?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 어머니 이세벨의 창녀짓들.’ 히브리어는 문자적 의미와 비유적 의미를 함께 지닐 수 있으며, 도덕적·제의적 불신실을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘무슨 평강이 있습니까?’ 히브리어는 수사적 효과를 위해 여호람의 질문에 나온 ‘평강’을 되풀이합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּרְאוֹת
  english_pob_choice: And it happened, when ... saw
  chosen_korean: 그 일이 일어났습니다
  alternatives_korean:
  - 그리고 ... 보았을 때
  - 그때 ... 보았습니다
  lexicon: WLC / narrative formula
  rationale: 히브리어 서술 공식의 사건 전개감을 살리되, 한국어에서 과도하게 직역된 어순은 피하고 자연스러운 서술문으로 옮겼습니다.
- source_word: הֲשָׁלוֹם / מָה הַשָּׁלוֹם
  english_pob_choice: Is it peace / What peace can there be
  chosen_korean: 평강이냐 / 무슨 평강이 있겠느냐
  alternatives_korean:
  - 잘 있느냐 / 무슨 잘됨이 있겠느냐
  - 평안이냐 / 무슨 평안이 있겠느냐
  lexicon: HALOT
  rationale: 두 번 반복되는 שָׁלוֹם을 같은 낱말로 유지해 히브리어의 말장난과 대조를 드러냈습니다. 한국어에서는 문맥상 질문형으로 처리해 짧은 응답의 날카로움을 살렸습니다.
- source_word: זְנוּנֵי
  english_pob_choice: the prostitutions
  chosen_korean: 음행들
  alternatives_korean:
  - 창녀짓들
  - 음란함들
  - 부정함들
  lexicon: HALOT
  rationale: 히브리어의 노골적이고 복수적인 표현을 살리되, 한국어 출판문맥에서 지나치게 낯선 표현인 'prostitutions'의 직역보다는 문맥상 성적·종교적 불신실을 함께 담을 수 있는 '음행들'을 택했습니다.
- source_word: וּכְשָׁפֶיהָ הָרַבִּים
  english_pob_choice: and her many sorceries
  chosen_korean: 그의 많은 주술들
  alternatives_korean:
  - 그녀의 많은 마술들
  - 그의 많은 사술들
  lexicon: HALOT
  rationale: כֶּשֶׁף의 마법/주술 영역을 현대 한국어에서 분명하게 전달하는 '주술들'을 사용했고, רבים의 복수 강조를 살려 '많은'을 유지했습니다.
theological_decisions:
- issue: זְנוּנֵי를 노골적인 성적 표현으로 옮길지, 더 일반적인 도덕·종교적 표현으로 옮길지
  chosen_reading: 본문에는 '음행들'을 두어 원문의 수치스러운 어조를 유지했습니다.
  alternative_readings:
  - 창녀짓들
  - 우상숭배들
  - 성적 부도덕
  rationale: 이 표현은 단순한 도덕 평가를 넘어 Jezebel의 불신실과 우상 숭배적 배경까지 포괄하는 예언적 비난입니다. 본문에서는 해석을 좁히지 않고, 주해를 도울 때만 각주로 여지를 남기는 편이 원문 충실성에 맞습니다.
  doctrine_reference: Translation philosophy §§1, 3, 6
- issue: שָׁלוֹם의 반복을 한국어에서 동일 어휘로 유지할지 여부
  chosen_reading: 두 번 모두 '평강'으로 옮겨 반복과 반어를 보존했습니다.
  alternative_readings:
  - 평안
  - 안녕
  - 잘됨
  rationale: 여호람의 질문과 예후의 반응이 같은 단어를 되받아치는 구조이므로, 한국어에서도 동일 표지어를 써서 수사적 긴장을 드러내는 것이 중요합니다.
  doctrine_reference: Translation philosophy §§1, 5
