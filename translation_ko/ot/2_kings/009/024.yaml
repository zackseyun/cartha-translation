base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
  footnotes:
  - marker: a
    text: Or 'between his shoulders' / 'between his shoulder blades.' The Hebrew literally says 'between his arms,' which may idiomatically refer to the upper back or shoulder area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예후는 활을 끝까지 당겨 여호람을 그의 팔 사이[a]에 맞혔습니다. 화살은 그의 심장을 꿰뚫고 지나갔고, 그는 병거 안에서 주저앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그의 팔 사이”라고 되어 있으며, 문맥상 어깨나 어깨뼈 사이를 가리키는 관용 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא יָדוֹ בַּקֶּשֶׁת
  english_pob_choice: drew his bow full
  chosen_korean: 활을 끝까지 당겨
  alternatives_korean:
  - 활을 가득 당겨
  - 활을 완전히 당겨
  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 활시위를 충분히 당겨 발사했다는 뜻이므로, 자연스러운 한국어로 행동의 긴장감과 완전성을 살렸습니다.
- source_word: בֵּין זְרֹעָיו
  english_pob_choice: between his arms
  chosen_korean: 그의 팔 사이
  alternatives_korean:
  - 그의 어깨 사이
  - 그의 어깨뼈 사이
  lexicon: HALOT
  rationale: 직역을 유지해 본문의 표현을 드러내되, 해부학적으로는 상체/어깨 부위를 가리킬 수 있는 여지를 남겼습니다.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  english_pob_choice: the arrow came out through his heart
  chosen_korean: 화살은 그의 심장을 꿰뚫고 지나갔고
  alternatives_korean:
  - 화살은 그의 심장에서 나왔고
  - 화살은 그의 심장을 지나 나왔고
  lexicon: HALOT
  rationale: לֵב를 여기서는 치명상을 입은 신체기관으로 이해하여 '심장'으로 옮겼고, 관통의 결과를 한국어로 분명하게 표현했습니다.
- source_word: וַיִּכְרַע בְּרִכְבּוֹ
  english_pob_choice: he collapsed in his chariot
  chosen_korean: 병거 안에서 주저앉았습니다
  alternatives_korean:
  - 병거 안에서 무너졌습니다
  - 병거 안에서 쓰러졌습니다
  lexicon: HALOT
  rationale: כרע의 문자적 '굽힘/꿇음'을 전투 장면의 즉각적인 붕괴로 이해해, 자연스럽지만 과도하게 해석되지 않는 표현을 택했습니다.
