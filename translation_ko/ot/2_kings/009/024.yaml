- source_word: וַיִּכְרַע בְּרִכְבּוֹ
  english_pob_choice: he collapsed in his chariot
  chosen_korean: 병거 안에서 주저앉았습니다
  alternatives_korean:
  - 병거 안에서 무너졌습니다
  - 병거 안에서 쓰러졌습니다
  lexicon: HALOT
