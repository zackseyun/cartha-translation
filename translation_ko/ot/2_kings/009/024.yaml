base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/024.yaml
  text: And Jehu drew his bow full and struck Jehoram between his arms[a], and the arrow came out through his heart, and he collapsed in his chariot.
  footnotes:
  - marker: a
    text: Or 'between his shoulders' / 'between his shoulder blades.' The Hebrew literally says 'between his arms,' which may idiomatically refer to the upper back or shoulder area.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 예후는 활을 끝까지 당겨 여호람을 그의 팔 사이[a]에 맞혔습니다. 화살은 그의 심장을 꿰뚫고 지나갔고, 그는 병거 안에서 주저앉았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 “그의 팔 사이”라고 되어 있으며, 문맥상 어깨나 어깨뼈 사이를 가리키는 관용 표현일 수 있습니다.
    reason: lexical_alternative
