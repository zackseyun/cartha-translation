  - 그의 어깨뼈 사이
  lexicon: HALOT
  rationale: 직역을 유지해 본문의 표현을 드러내되, 해부학적으로는 상체/어깨 부위를 가리킬 수 있는 여지를 남겼습니다.
- source_word: וַיֵּצֵא הַחֵצִי מִלִּבּוֹ
  english_pob_choice: the arrow came out through his heart
  chosen_korean: 화살은 그의 심장을 꿰뚫고 지나갔고
