  lexicon: HALOT
  rationale: 히브리어 관용구의 핵심은 활시위를 충분히 당겨 발사했다는 뜻이므로, 자연스러운 한국어로 행동의 긴장감과 완전성을 살렸습니다.
- source_word: בֵּין זְרֹעָיו
  english_pob_choice: between his arms
  chosen_korean: 그의 팔 사이
  alternatives_korean:
