  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּרְכַּ֤ב יֵהוּא֙ וַ/יֵּ֣לֶךְ יִזְרְעֶ֔אלָ/ה כִּ֥י יוֹרָ֖ם שֹׁכֵ֣ב שָׁ֑מָּ/ה וַֽ/אֲחַזְיָה֙ מֶ֣לֶךְ יְהוּדָ֔ה יָרַ֖ד לִ/רְא֥וֹת אֶת יוֹרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/016.yaml
  text: So Jehu mounted up and went to Jezreel[a], because Joram was lying there[b], and Ahaziah king of Judah had gone down to see Joram.
  footnotes:
  - marker: a
    text: Or 'rode.' The Hebrew distinguishes Jehu's mounting from his going to Jezreel.
    reason: lexical_alternative
  - marker: b
    text: Literally 'to see Joram'; that is, to visit him.
    reason: lexical_alternative
translation:
  language: ko
  text: 예후가 올라타서 이스르엘로 갔습니다. 요람이 거기 누워 있었기 때문이며, 유다 왕 아하시야도 요람을 보러 내려갔습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘올라타서’는 히브리어의 ‘타다/오르다’ 동작을 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘보러’는 문자적으로는 ‘보다’이지만, 문맥상 방문의 뜻을 함께 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְכַּב
  english_pob_choice: mounted up
  chosen_korean: 올라타서
  alternatives_korean:
  - 탔고
  - 말(전차)에 올라
  lexicon: HALOT
  rationale: רכב의 핵심은 ‘타다/올라타다’이므로, 이동보다 먼저 일어난 탑승 동작을 드러내기 위해 ‘올라타서’로 옮겼습니다.
- source_word: וַיֵּלֶךְ יִזְרְעֶאלָה
  english_pob_choice: went to Jezreel
  chosen_korean: 이스르엘로 갔습니다
  alternatives_korean:
  - 이스르엘로 향했습니다
  - 이스르엘로 가서
  lexicon: HALOT
  rationale: 방향형 어미가 붙은 지명은 한국어에서 자연스럽게 ‘-로’로 처리해 목적지를 분명히 했습니다.
- source_word: שֹׁכֵב שָׁמָּה
  english_pob_choice: was lying there
  chosen_korean: 거기 누워 있었기 때문이며
  alternatives_korean:
  - 거기 누워 있었기 때문에
  - 거기 누워 있었으므로
  lexicon: HALOT
  rationale: שׁכב의 직역성을 살리되, 문맥상 원인이 되는 상태를 자연스럽게 연결하기 위해 ‘누워 있었기 때문’으로 옮겼습니다.
- source_word: לִרְאוֹת אֶת יוֹרָם
  english_pob_choice: to see Joram
  chosen_korean: 요람을 보러
  alternatives_korean:
  - 요람을 만나러
  - 요람을 방문하러
  lexicon: HALOT
  rationale: 동사는 문자적으로 ‘보다’이지만, 문맥상 병문안을 포함한 방문 의미가 있어 POB의 직역 경향을 유지하면서도 한국어에서는 ‘보러’로 표현했습니다.
theological_decisions:
- issue: 출발 순서와 원인 관계의 보존
  chosen_reading: 예후의 ‘올라탐’과 ‘감’의 순서를 분리하고, 요람이 누워 있는 상태를 예후의 이동 이유로 명시했습니다.
  alternative_readings:
  - ‘예후가 타고 이스르엘로 갔습니다’처럼 단일 동작으로 합치는 번역
  - 원인절 없이 단순 서술로 처리하는 번역
  rationale: 히브리어는 예후의 탑승과 이동을 구분하고, 뒤의 כִּי로 이유를 제시합니다. 이를 합쳐 버리면 서술의 긴장감과 이유 제시가 약해집니다.
  doctrine_reference: 서사 본문의 문법적 순서와 인과 관계 존중
