id: 2KI.9.31
reference: 2 Kings 9:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וְ/יֵה֖וּא בָּ֣א בַ/שָּׁ֑עַר וַ/תֹּ֣אמֶר הֲ/שָׁל֔וֹם זִמְרִ֖י הֹרֵ֥ג אֲדֹנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/031.yaml
  text: As Jehu came into the gate[a], she said, “Is it peace, Zimri[c][b], murderer of his master?”
  footnotes:
  - marker: a
    text: Jezebel calls Jehu 'Zimri' as a taunt, comparing him to Zimri, who killed his master and seized the throne (see 1 Kings 16:9–20).
    reason: cross_reference
  - marker: b
    text: Or 'Is all well?'
    reason: lexical_alternative
  - marker: c
    text: Literally 'killer of his master.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예후가 성문으로 들어오자, 그녀가 말했습니다. “평안하십니까, 시므리여, 자기 주인을 죽인 자여?”[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성문’은 히브리어로 성읍의 문, 또는 그 문 일대를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 הֲשָׁלוֹם은 ‘평안하십니까?’ 또는 ‘무사하십니까?’라는 관용적 안부 질문으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘자기 주인을 죽인 자’는 히브리어의 문자적 표현입니다. 이 말은 예후를 자기 주인을 죽이고 왕위를 차지한 시므리(왕상 16:9–20)에 빗댄 조롱입니다.
    reason: source_note
lexical_decisions:
- source_word: בָּא בַשָּׁעַר
  english_pob_choice: came into the gate
  chosen_korean: 성문으로 들어오자
  alternatives_korean:
  - 성문에 들어오자
  - 문으로 들어오자
  - 성문 안으로 들어오자
  lexicon: HALOT
  rationale: שַׁעַר는 도시의 성문을 가리키므로 ‘성문’이 자연스럽고, 동작의 진행을 살려 ‘들어오자’로 옮겼습니다.
- source_word: הֲשָׁלוֹם
  english_pob_choice: Is it peace
  chosen_korean: 평안하냐
  alternatives_korean:
  - 평안이냐
  - 잘 지내느냐
  - 평안하냐,
  - 무사하냐
  lexicon: HALOT
  rationale: 이 표현은 단순 정보 질문보다 상태를 비꼬듯 묻는 관용구이므로, 한국어에서는 짧고 직접적인 ‘평안하냐’가 어조를 가장 잘 살립니다.
- source_word: זִמְרִי
  english_pob_choice: Zimri
  chosen_korean: 지므리
  alternatives_korean:
  - 짐리
  - 짐브리
  lexicon: 고유명사 표기
  rationale: 히브리어 고유명사는 현대 외래어 표기 원칙에 따라 음역하되, 본문 주석에서 이미 정해진 인물명은 문맥상 동일 인물을 가리키도록 ‘지므리’로 옮겼습니다.
- source_word: הֹרֵג אֲדֹנָיו
  english_pob_choice: murderer of his master
  chosen_korean: 자기의 주인을 죽인 자야
  alternatives_korean:
  - 주인을 죽인 자야
  - 자기의 주인을 살해한 자야
  - 주인 살해자야
  lexicon: HALOT
  rationale: 직역형 ‘주인의 살인자’보다 한국어에서는 관계절로 풀어 ‘주인을 죽인 자’가 자연스럽고, ‘주인’은 인간 상관을 가리켜 신적 호칭 ‘주님’과 구별했습니다.
theological_decisions:
- issue: 예후를 ‘지므리’에 빗대는 조롱의 처리
  chosen_reading: 본문의 호칭을 단순 별명이 아니라, 이전에 자기 주인을 죽이고 왕위를 찬탈한 지므리를 예후와 대비시키는 조롱으로 살렸습니다.
  alternative_readings:
  - 조롱을 드러내지 않고 문자적으로만 옮김
  - ‘지므리’의 역사적 배경을 본문 안에 설명함
  rationale: 히브리어의 병렬 구조는 예후를 지므리에 빗대는 비난을 전달하므로, 본문은 과잉 설명 없이 그 날카로움을 유지하는 것이 적절합니다.
  doctrine_reference: 1열왕기 16:9-20
- issue: 화자의 문체
  chosen_reading: 질문과 조롱이 섞인 짧은 직설을 한국어 구어에 가까운 합쇼체로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 서술체
  - 고어풍 경어
  rationale: 장면의 긴박감과 적대적 어조를 살리기 위해 현대적 합쇼체를 유지하되, 인용문 안에서는 짧고 날카로운 질문형을 사용했습니다.
  doctrine_reference: 문체/화용
