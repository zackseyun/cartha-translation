  to: 예후가 성문으로 들어오자, 그녀가 말했습니다. “평안하십니까, 시므리여, 자기 주인을 죽인 자여?”[a][b][c]
  rationale: 현대 합쇼체를 준수하면서도, 격식 있는 질문 형식 안에 담긴 이세벨의 냉소와 적대감을 보존했습니다. ‘시므리’는 통용 한국어 성경 인명 표기로 고쳤고, ‘자기 주인’은 히브리어 소유 접미사가 가리키는 조롱의 역사적 비교를 본문에서 과도하게 해설하지 않은 채 유지했습니다. 주석은 본문 어휘와 시므리 암시를 정확하고 절제되게 설명하도록 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:58Z'
