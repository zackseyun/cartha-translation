  yaml_path: translation/ot/2_kings/009/017.yaml
  text: Now the watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “Is all well?”
    reason: lexical_alternative
translation:
  language: ko
  text: 그때 파수꾼이 이스르엘의 망대 위에 서 있다가 예후의 무리를 그가 오는 것을 보고 말했습니다. “무리가 보입니다.” 그러자 여호람이 말했습니다. “기마병 한 사람을 보내 그들을 맞게 하고, 그가 ‘평안하냐?’ 하고 말하게 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, “다 평안합니까?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצֹּפֶה
  english_pob_choice: the watchman
  chosen_korean: 파수꾼
  alternatives_korean:
  - 망보는 사람
  - 감시자
  lexicon: HALOT
  rationale: 감시·정탐의 역할을 가장 자연스럽게 드러내는 표준 한국어로, 서사 문맥에서 직무적 의미를 보존합니다.
- source_word: הַמִּגְדָּל
  english_pob_choice: the tower
  chosen_korean: 망대
  alternatives_korean:
  - 탑
  - 감시탑
  lexicon: HALOT
  rationale: 단순한 '탑'보다 감시 기능이 드러나는 '망대'가 문맥에 더 잘 맞지만, 본문 자체의 일반 명사를 과도하게 확장하지는 않습니다.
- source_word: שִׁפְעַת
  english_pob_choice: the company
  chosen_korean: 무리
  alternatives_korean:
  - 떼
  - 부대
  - 대오
  lexicon: HALOT
  rationale: 군사적 이동체이면서도 정확한 규모가 특정되지 않으므로, '무리'가 보이는 집합성을 무리 없이 전달합니다.
- source_word: קַח רַכָּב
  english_pob_choice: Take a horseman
  chosen_korean: 기마병 한 사람을 보내
  alternatives_korean:
  - 말탄 사람 한 명을 보내
  - 기병 한 사람을 보내
  lexicon: HALOT
  rationale: 여기서는 단수의 파견 명령이므로, 한국어에서는 '한 사람'을 분명히 밝혀 뒤이은 단수 동사 흐름을 살렸습니다.
- source_word: הֲשָׁלוֹם
  english_pob_choice: Is it peace?
  chosen_korean: 평안하냐?
  alternatives_korean:
  - 평안합니까?
  - 평화냐?
  lexicon: HALOT
  rationale: 반복되는 관용적 문의를 한국어로 자연스럽게 옮기되, 단순한 전쟁의 부재뿐 아니라 안부·상태 확인의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 예후의 접근을 가리키는 집합 표현의 처리
  chosen_reading: 예후의 무리를 그가 오는 것을 보고
  alternative_readings:
  - 예후의 일행을 보고
  - 예후의 군대를 보고
  rationale: 본문의 שִׁפְעַת은 수량이 아니라 '보이는 집합체'를 가리키므로, 과도한 군사화보다 중립적인 '무리'를 택했습니다.
  doctrine_reference: 본문 관찰에 따른 서사 정확성
