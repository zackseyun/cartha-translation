revisions:
- from: 그때 파수꾼이 이스르엘의 망대 위에 서 있다가 예후의 무리를 그가 오는 것을 보고 말했습니다. “무리가 보입니다.” 그러자 여호람이 말했습니다. “기마병 한 사람을 보내 그들을 맞게 하고, 그가 ‘평안하냐?’ 하고 말하게 하십시오.”[a]
  to: 이스르엘의 망대 위에 서 있던 파수꾼이 예후가 올 때에 그의 무리를 보고 말했습니다. “무리가 보입니다.” 그러자 여호람이 말했습니다. “기마병 한 사람을 데려다가 그들에게 보내어 만나게 하고, 그가 ‘평안하냐?’[a] 하고 말하게 하십시오.”
  rationale: 예후의 접근을 나타내는 시간절을 ‘예후가 올 때에’로 명확히 하고, 파수꾼의 배경 자세는 ‘서 있던’으로 옮겼습니다. 파견 명령은 기마병을 데려다가 보내는 연속 동작으로 다듬었으며, ‘평안하냐?’와 그 각주는 원문의 압축된 평안 문의와 그 관용적 의미를 함께 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:53:59Z'
