  text: Now the watchman was standing on the tower in Jezreel[a], and he saw the company of Jehu as he came and said, “I see a company.” And Jehoram said, “Take a horseman and send him to meet them, and let him say, ‘Is it peace?’”
  footnotes:
  - marker: a
    text: Or, more idiomatically, “Is all well?”
    reason: lexical_alternative
translation:
  language: ko
  text: 이스르엘의 망대 위에 서 있던 파수꾼이 예후가 올 때에 그의 무리를 보고 말했습니다. “무리가 보입니다.” 그러자 여호람이 말했습니다. “기마병 한 사람을 데려다가 그들에게 보내어 만나게 하고, 그가 ‘평안하냐?’[a] 하고 말하게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 더 관용적으로, “다 평안합니까?”
    reason: lexical_alternative
