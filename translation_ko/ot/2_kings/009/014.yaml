id: 2KI.9.14
reference: 2 Kings 9:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּתְקַשֵּׁ֗ר יֵה֛וּא בֶּן יְהוֹשָׁפָ֥ט בֶּן נִמְשִׁ֖י אֶל יוֹרָ֑ם וְ/יוֹרָם֩ הָיָ֨ה שֹׁמֵ֜ר בְּ/רָמֹ֣ת גִּלְעָ֗ד ה֚וּא וְ/כָל יִשְׂרָאֵ֔ל מִ/פְּנֵ֥י חֲזָאֵ֖ל מֶֽלֶךְ אֲרָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/014.yaml
  text: So Jehu son of Jehoshaphat[a], son of Nimshi, conspired against Joram. Now Joram had been keeping watch at Ramoth-gilead, he and all Israel[c][b], because of Hazael king of Aram.
  footnotes:
  - marker: a
    text: Or 'was keeping watch at Ramoth-gilead.' The Hebrew verb can denote guarding, watching, or defending in a military setting.
    reason: lexical_alternative
  - marker: b
    text: That is, the kingdom/forces of Israel; the text literally says 'all Israel.'
    reason: cultural_note
  - marker: c
    text: 'Traditionally ''Syria''; Hebrew: ''Aram.'''
    reason: alternative_reading
translation:
  language: ko
  text: 그러자 예후—여호사밧의 아들, 님시의 손자—가 여호람에게 반역을 꾀했습니다. 그때 여호람은 하사엘 아람 왕을 피해 길르앗 라못에서 경계하고 있었는데, 그와 온 이스라엘이 그러했습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘경계하고’ 또는 ‘지키고’로도 옮길 수 있습니다. 히브리어 동사는 군사적 상황에서 지키다, 감시하다, 방어하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 즉 이스라엘 왕국/군대를 가리킵니다. 본문은 문자적으로는 ‘온 이스라엘’이라고 말합니다.
    reason: cultural_note
  - marker: c
    text: 전통적으로는 ‘시리아’로 옮기기도 하지만, 히브리어는 ‘아람’입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְקַשֵּׁר
  english_pob_choice: conspired against
  chosen_korean: 반역을 꾀했습니다
  alternatives_korean:
  - 음모를 꾸몄습니다
  - 모반했습니다
  lexicon: HALOT
  rationale: 히트파엘 קשר는 이 문맥에서 정치적 배반과 반역의 뉘앙스를 가지므로, 현대 한국어에서 자연스럽고 적확한 ‘반역을 꾀했습니다’로 옮겼습니다.
- source_word: בֶּן יְהוֹשָׁפָט בֶּן נִמְשִׁי
  english_pob_choice: son of Jehoshaphat, son of Nimshi
  chosen_korean: 여호사밧의 아들, 님시의 손자
  alternatives_korean:
  - 여호사밧의 아들, 님시의 아들
  - 여호사밧의 아들, 님시의 후손
  lexicon: HALOT
  rationale: 반복된 בן은 직계 계보를 표시하므로 첫 항목은 ‘아들’로, 둘째는 한국어 친족 표현상 자연스러운 ‘손자’로 처리해 혈통의 단계가 드러나게 했습니다.
- source_word: הָיָה שֹׁמֵר
  english_pob_choice: had been keeping watch at
  chosen_korean: 경계하고 있었는데
  alternatives_korean:
  - 지키고 있었는데
  - 망을 보고 있었는데
  - 수비하고 있었는데
  lexicon: HALOT
  rationale: שׁמר는 군사적 문맥에서 지키다/경계하다의 뜻을 가지며, 배경 상황을 이끄는 과거진행적 느낌을 살려 ‘경계하고 있었는데’로 옮겼습니다.
- source_word: מִפְּנֵי חֲזָאֵל מֶלֶךְ אֲרָם
  english_pob_choice: because of Hazael king of Aram
  chosen_korean: 하사엘 아람 왕을 피해
  alternatives_korean:
  - 하사엘 아람 왕 때문에
  - 하사엘 아람 왕을 두려워하여
  - 하사엘 아람 왕 앞에서
  lexicon: HALOT
  rationale: מִפְּנֵי는 원인뿐 아니라 압박·회피의 맥락을 띠므로, 군사적 상황에 맞게 ‘~을 피해’로 옮겨 수비의 배경을 분명히 했습니다.
theological_decisions:
- issue: אֲרָם의 한국어 표기
  chosen_reading: 아람
  alternative_readings:
  - 시리아
  rationale: 히브리어 지명/민족명 אֲרָם을 전통 교회 용례보다 원어에 가깝게 ‘아람’으로 유지해 지리·역사적 항목을 보존했습니다.
  doctrine_reference: 원문 우선 번역 원칙
- issue: הוּא וְכָל יִשְׂרָאֵל의 범위
  chosen_reading: 그와 온 이스라엘이 그러했습니다
  alternative_readings:
  - 그와 온 이스라엘 군대가 그러했습니다
  - 그와 이스라엘의 모든 군사가 그러했습니다
  rationale: 본문은 문자적으로 ‘온 이스라엘’이라고 말하므로, 군사적 배경을 암시하되 본문 범위를 좁히지 않는 표현을 택했습니다.
  doctrine_reference: 본문-청중 의미 보존 원칙
