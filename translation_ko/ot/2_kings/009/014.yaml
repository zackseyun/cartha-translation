revisions:
- from: 그러자 예후—여호사밧의 아들, 님시의 손자—가 여호람에게 반역을 꾀했습니다. 그때 여호람은 하사엘 아람 왕을 피해 길르앗 라못에서 경계하고 있었는데, 그와 온 이스라엘이 그러했습니다.[a][b][c]
  to: 이에 예후, 곧 여호사밧의 아들이며 님시의 아들인 사람이 여호람을 거슬러 모반했습니다. 당시 여호람과 온 이스라엘[b]은 길르앗 라못을 지키고[a] 있었습니다. 이는 아람 왕 하사엘[c] 때문이었습니다.
  rationale: 계보 표현을 원문의 반복된 ‘아들’로 되돌려 세대 관계를 과도하게 특정하지 않았습니다. 하사엘과 관련된 전치사구는 회피가 아니라 수비의 사유로 번역했습니다. 또한 군사적 맥락의 שֹׁמֵר를 자연스러운 한국어인 ‘지키고 있었습니다’로 옮기고, 각주를 해당 어구에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:00Z'
