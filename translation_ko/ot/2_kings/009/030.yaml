base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/030.yaml
  text: When Jehu came to Jezreel[a], Jezebel heard of it. She painted her eyes with kohl, adorned her head[b], and looked out through the window.
  footnotes:
  - marker: a
    text: Or, more literally, 'she put kohl on her eyes.'
    reason: lexical_alternative
  - marker: b
    text: Or 'arranged her hair'; the Hebrew literally says 'made her head good/beautiful.'
    reason: lexical_alternative
translation:
  language: ko
  text: 예후가 이스르엘에 이르자 이세벨이 그 소식을 듣고, 눈에 콜을 바르고[a] 머리를 꾸민 뒤[b] 창문으로 내다보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 פּוּךְ는 눈에 바르는 짙은 화장재, 곧 콜(kohl)을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 히브리어는 문자적으로 ‘그녀의 머리를 좋게 하다’라고 하며, 머리를 손질하거나 꾸미는 것을 뜻합니다.
    reason: lexical_alternative
