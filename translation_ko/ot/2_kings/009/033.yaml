  text: And he said[a], “Throw her down!” So they threw her down, and some of her blood spattered on the wall and on the horses, and he trampled her.
  footnotes:
  - marker: a
    text: Or “and her blood splashed on the wall and on the horses.” The Hebrew literally says “and it spattered from her blood onto the wall and onto the horses.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 그가 말했습니다. 「그녀를 내던지십시오!」 그래서 그들이 그녀를 내던졌습니다. 그녀의 피 일부가 벽과 말들 위에 튀었고, 그가 그녀를 짓밟았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀의 피가 벽과 말들 위에 튀었다.” 히브리어는 문자적으로 “그녀의 피에서 벽과 말들 위로 튀었다”라고 합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: שמטהו / שמט
  english_pob_choice: Throw her down!
  chosen_korean: 그녀를 아래로 던지십시오!
  alternatives_korean:
  - 그녀를 내던지십시오!
  - 그녀를 떨어뜨리십시오!
  - 그녀를 내리치십시오!
  lexicon: HALOT
  rationale: שמט의 명령형은 여기서 창밖으로 제이셉벨을 떨어뜨리게 하는 강한 폭력 명령이므로, 한국어도 자연스럽고 직접적인 명령형인 ‘아래로 던지십시오’로 옮겼습니다.
- source_word: וישמטוה
  english_pob_choice: So they threw her down
  chosen_korean: 그래서 그들이 그녀를 아래로 던졌습니다
  alternatives_korean:
  - 그래서 그들이 그녀를 떨어뜨렸습니다
  - 그래서 그들이 그녀를 내던졌습니다
  lexicon: HALOT
  rationale: 앞선 명령과 같은 어근의 반복을 살려, 순종의 즉각성을 드러내는 ‘아래로 던졌습니다’를 사용했습니다.
- source_word: ויז מדמה
  english_pob_choice: some of her blood spattered
  chosen_korean: 그녀의 피가 … 튀었고
  alternatives_korean:
  - 그녀의 피가 … 튀었습니다
  - 그녀의 피가 … 튀었습니다
  lexicon: HALOT
  rationale: ויז는 여기서 피가 튀는 장면을 그리므로 ‘튀었습니다’로 살렸고, מן־דם의 부분적 의미는 자연스러운 한국어로 드러나도록 했습니다.
- source_word: וירמסנה
  english_pob_choice: and he trampled her
  chosen_korean: 그가 그녀를 짓밟았습니다
  alternatives_korean:
  - 그가 그녀를 밟고 지나갔습니다
  - 그가 그녀를 짓밟아 지나갔습니다
  lexicon: HALOT
  rationale: רמס는 ‘짓밟다’가 가장 직접적으로 대응하며, 주어를 말들이 아니라 문법상 ‘그’로 유지하여 본문의 폭력성을 그대로 보존했습니다.
theological_decisions:
- issue: 피가 벽과 말들 위에 ‘튀었다’는 장면의 보존
  chosen_reading: 사건의 잔혹성을 완화하지 않고, 피가 벽과 말들 위에 튄다는 시각적 이미지를 그대로 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘묻었다/흩뿌려졌다’로 순화함
  rationale: 본문은 단순한 죽음 묘사가 아니라 심판 장면의 충격을 강조하므로, 이미지의 강도를 낮추지 않는 것이 source-direct합니다.
  doctrine_reference: 본문 내 서술 강도 보존 원칙
