source:
  edition: WLC
  text: וְ/נָֽתַתִּי֙ אֶת בֵּ֣ית אַחְאָ֔ב כְּ/בֵ֖ית יָרָבְעָ֣ם בֶּן נְבָ֑ט וּ/כְ/בֵ֖ית בַּעְשָׁ֥א בֶן אֲחִיָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/009.yaml
  text: And I will make the house of Ahab like the house of Jeroboam son of Nebat and like the house of Baasha son of Ahijah[a].
  footnotes:
  - marker: a
    text: Or 'Ahab’s dynasty ... Jeroboam’s dynasty ... Baasha’s dynasty.' Hebrew 'house' here refers to a royal house or line.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 아합의 집을 느밧의 아들 여로보암의 집처럼, 또 아히야의 아들 바아사의 집처럼 만들겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘집’은 여기서 왕가 또는 왕조를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתִּי
  english_pob_choice: And I will make
  chosen_korean: 내가 ... 만들겠습니다
  alternatives_korean:
  - 내가 ... 두겠습니다
  - 내가 ... 넘기겠습니다
  lexicon: HALOT
  rationale: נתן은 문자적으로 ‘주다/두다’이지만, 여기서는 심판 선고 공식에서 ‘아합의 집’을 뒤이어 나오는 몰락한 왕가들과 같게 만드는 뜻이므로, 결과를 드러내는 ‘만들다’가 가장 자연스럽고 원문 기능을 잘 살립니다.
- source_word: בֵּית אַחְאָב
  english_pob_choice: the house of Ahab
  chosen_korean: 아합의 집
  alternatives_korean:
  - 아합의 왕가
  - 아합의 왕조
  lexicon: HALOT
  rationale: 왕조적 문맥의 בַּיִת는 ‘집’이 표준적인 대응이며, ‘왕가/왕조’는 해석을 더 강하게 드러내므로 본문 표현을 보존하는 쪽을 택했습니다.
- source_word: כְּ/בֵית ... וּ/כְ/בֵית
  english_pob_choice: like the house of ... and like the house of
  chosen_korean: 느밧의 아들 여로보암의 집과 같이, ... 아히야의 아들 바아사의 집과 같이
  alternatives_korean:
  - 느밧의 아들 여로보암의 왕가처럼, ... 아히야의 아들 바아사의 왕가처럼
  lexicon: HALOT
  rationale: כְּ는 비교를 나타내므로 ‘...과 같이’로 옮겨 반복되는 비교 구조를 그대로 살렸습니다. 영어 POB의 ‘like the house of’도 같은 이유로 dynastic comparison을 유지합니다.
- source_word: יָרָבְעָם בֶּן נְבָט / בַּעְשָׁא בֶן אֲחִיָּה
  english_pob_choice: Jeroboam son of Nebat / Baasha son of Ahijah
  chosen_korean: 느밧의 아들 여로보암 / 아히야의 아들 바아사
  alternatives_korean:
  - 네밧의 아들 여로보암 / 아히야의 아들 바아사
  - 느밧의 아들 여로보암 / 아히야의 아들 바아샤
  lexicon: HALOT
  rationale: 인명은 통용되는 한국어 성경형을 따르고, בן 구조는 ‘~의 아들’로 직역해 혈통 표지를 분명히 했습니다. אַחִיָּה는 통용 표기 ‘아히야’를 사용했습니다.
theological_decisions:
- issue: 왕가 심판의 비교 공식
  chosen_reading: 아합의 집을 ... 여로보암의 집과 같이 ... 바아사의 집과 같이 만들겠습니다
  alternative_readings:
  - 아합의 왕조를 ... 여로보암의 왕조처럼 ... 바아사의 왕조처럼 만들겠습니다
  rationale: 본문은 이전에 심판받은 왕가들과의 비교를 통해 아합의 집에 대한 역사적·언약적 심판을 선포합니다. ‘집’을 유지하면 히브리어 왕조 비유와 상호본문적 연결을 더 직접적으로 보존합니다.
  doctrine_reference: 'Translation philosophy: optimal equivalence; dynastic judgment formula'
