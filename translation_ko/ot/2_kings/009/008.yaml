  text: וְ/אָבַ֖ד כָּל בֵּ֣ית אַחְאָ֑ב וְ/הִכְרַתִּ֤י לְ/אַחְאָב֙ מַשְׁתִּ֣ין בְּ/קִ֔יר וְ/עָצ֥וּר וְ/עָז֖וּב בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/008.yaml
  text: And all the house of Ahab shall perish[a], and I will cut off from Ahab every male, bond and free in Israel.
  footnotes:
  - marker: a
    text: Hebrew literally, 'everyone who urinates against a wall,' a coarse idiom meaning 'every male.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아합의 온 집안이 멸망할 것이며, 내가 이스라엘에서 아합에게 속한 모든 남자[a], 곧 종이든 자유인이든, 모두 끊어 버리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘벽에 오줌을 누는 자’라는 거친 관용 표현으로, ‘모든 남자’를 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָבַד כָּל בֵּית אַחְאָב
  english_pob_choice: And all the house of Ahab shall perish
  chosen_korean: 그리고 아합의 모든 집안은 멸망할 것이며
  alternatives_korean:
  - 아합의 온 집안이 사라질 것이며
  - 아합의 모든 가문이 망할 것이며
  lexicon: WLC; HALOT
  rationale: ‘집안’은 왕조·가문을 가리키는 성경적 관용어를 살리며, ‘멸망할 것이다’는 심판 선언의 예언적 미래를 자연스럽게 옮깁니다.
- source_word: וְהִכְרַתִּי לְאַחְאָב
  english_pob_choice: and I will cut off from Ahab
  chosen_korean: 내가 아합에게서 … 끊어 버리겠습니다
  alternatives_korean:
  - 내가 아합에게서 … 끊겠습니다
  - 내가 아합에게서 … 없애 버리겠습니다
  lexicon: HALOT
  rationale: כרת의 심판적·언약적 용법을 살려 ‘끊어 버리다’로 옮겼습니다. 단순한 제거보다 단절·절단의 강한 의미가 드러납니다.
- source_word: מַשְׁתִּין בְּקִיר
  english_pob_choice: every male
  chosen_korean: 이스라엘의 매인 자와 풀린 자를 모두
  alternatives_korean:
  - 이스라엘의 남자들을 모두
  - 이스라엘의 벽에 오줌 누는 자를 모두
  lexicon: HALOT
  rationale: 히브리어의 조야한 관용구는 본문에 그대로 풀지 않고, 의미역인 ‘매인 자와 풀린 자’를 함께 써서 남성 전체를 가리키는 뜻을 드러냈습니다.
- source_word: וְעָצוּר וְעָזוּב
  english_pob_choice: both bond and free
  chosen_korean: 매인 자와 풀린 자
  alternatives_korean:
  - 노예와 자유인
  - 속박된 자와 버려진 자
  lexicon: HALOT
  rationale: 이 짝은 사회적 신분의 전 범위를 가리키는 관용적 대구로 보아, 문자적 신분 범주를 지나치게 좁히지 않는 표현을 택했습니다.
theological_decisions:
- issue: 조롱적 관용구의 처리
  chosen_reading: 본문의 저속한 남성 표지 관용구는 주석[a]로 옮기고 본문에서는 의미를 드러내는 방식으로 처리했습니다.
  alternative_readings:
  - 본문에 ‘벽에 오줌 누는 자’로 직역
  - 완곡하게 ‘남자’로만 옮김
  rationale: 심판 예언의 적나라한 수사성을 보존하되, 한국어 본문 가독성과 출판 적합성을 함께 고려했습니다.
  doctrine_reference: Translation philosophy §§1, 5, 6
- issue: ‘끊다’의 심판적 의미
  chosen_reading: ‘끊어 버리겠습니다’로 옮겨 하나님의 단호한 심판 행위를 드러냈습니다.
  alternative_readings:
  - ‘제거하겠습니다’
  - ‘멸하겠습니다’
  rationale: 단순 소멸보다 관계 단절과 심판의 법정적 뉘앙스를 함께 전달합니다.
  doctrine_reference: Translation philosophy §§1, 5
