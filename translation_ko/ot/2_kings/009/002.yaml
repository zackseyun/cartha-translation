  text: וּ/בָ֖אתָ שָׁ֑מָּ/ה וּ/רְאֵֽה שָׁ֠ם יֵה֨וּא בֶן יְהוֹשָׁפָ֜ט בֶּן נִמְשִׁ֗י וּ/בָ֨אתָ֙ וַ/הֲקֵֽמֹת/וֹ֙ מִ/תּ֣וֹך אֶחָ֔י/ו וְ/הֵבֵיאתָ֥ אֹת֖/וֹ חֶ֥דֶר בְּ/חָֽדֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/002.yaml
  text: When you arrive there, look for Jehu son of Jehoshaphat, son of Nimshi. Go in, get him up from among his brothers, and bring him into an inner room.
  footnotes:
  - marker: a
    text: Hebrew literally, 'a room within a room,' that is, a private inner chamber.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신이 거기 도착하면, 거기에서 요호사밧의 아들, 님시의 아들 예후를 찾아라. 들어가서 그를 그의 형제들 가운데서 일으켜 세우고, 그를 안쪽 방으로 데려가라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 ‘방 안의 방’이며, 곧 사적인 안쪽 방을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ שָׁמָּה
  english_pob_choice: When you arrive there
  chosen_korean: 당신이 거기 도착하면
  alternatives_korean:
  - 당신이 거기 가면
  - 거기로 가면
  lexicon: HALOT
  rationale: בוא는 여기서 이동의 완료를 전제로 한 도착을 뜻하므로, 한국어로는 자연스럽게 ‘도착하면’이 적절합니다.
- source_word: וּרְאֵה שָׁם
  english_pob_choice: look for
  chosen_korean: 거기에서 …를 찾아라
  alternatives_korean:
  - 거기서 보아라
  - 거기에서 찾아보아라
  lexicon: HALOT
  rationale: ראה는 문자적으로 ‘보다’이지만, 뒤에 특정 인물을 지목하는 명령문에서는 ‘찾다/찾아내다’의 의미가 분명하므로 이를 반영했습니다.
- source_word: חֶדֶר בְּחָדֶר
  english_pob_choice: an inner room
  chosen_korean: 안쪽 방
  alternatives_korean:
  - 방 안의 방
  - 내실
  lexicon: HALOT
  rationale: 중첩 표현은 사적인 내부 공간을 가리키므로, 한국어에서는 의미를 살린 ‘안쪽 방’이 가장 자연스럽습니다.
theological_decisions:
- issue: 예후의 신분을 명령형으로 구별해 따로 불러내는 장면의 톤
  chosen_reading: 서술을 완화하지 않고, 연속된 명령을 그대로 살려 왕의 기름부음 준비가 비밀리에 진행되는 긴박함을 유지했습니다.
  alternative_readings:
  - 부드럽게 풀어 ‘안으로 모셔라’처럼 완화하는 번역
  rationale: 본문은 단순한 이동 안내가 아니라 예후를 무리 가운데서 분리해 비공개로 세우는 절차를 지시하므로, 명령의 직접성과 긴박함을 보존하는 것이 중요합니다.
  doctrine_reference: 본문 맥락(왕위 교체의 비밀 지시)
