base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/037.yaml
  text: And Jezebel’s corpse will be like dung on the face of the field in the territory of Jezreel[a], so that they will not say, “This is Jezebel.”
  footnotes:
  - marker: a
    text: Or “in the plot of Jezreel.” The Hebrew חֵלֶק can denote a specific tract or parcel of land.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 이세벨의 시체는 이스르엘 지역의 밭의 표면에 있는 거름처럼 되어, 아무도 "이것이 이세벨이다"라고 말하지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 "이스르엘의 구획에 있는". 히브리어 חֵלֶק은 특정한 토지 구획이나 분깃을 가리킬 수 있습니다.
    reason: lexical_alternative
