translation:
  language: ko
  text: 그리고 이세벨의 시체는 이스르엘 지역[a]의 밭 위에 있는 거름처럼 될 것이므로, 아무도 “이것이 이세벨이다”라고 말하지 못할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
