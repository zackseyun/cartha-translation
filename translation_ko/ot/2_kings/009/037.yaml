  english_pob_choice: so that they will not say, “This is Jezebel.”
  chosen_korean: 아무도 "이것이 이세벨이다"라고 말하지 못할 것입니다
  alternatives_korean:
  - 그래서 사람들은 "이것이 이세벨이다"라고 말하지 못할 것입니다
  - 그래서 "이것이 이세벨이다"라고 말하는 일이 없을 것입니다
  lexicon: HALOT
  rationale: 결과 절의 뜻을 한국어에서는 ‘말하지 못하다’로 압축해, 신원 확인이 불가능할 만큼 훼손된다는 의미를 분명히 했습니다.
