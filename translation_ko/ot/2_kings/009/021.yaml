source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוֹרָם֙ אֱסֹ֔ר וַ/יֶּאְסֹ֖ר רִכְבּ֑/וֹ וַ/יֵּצֵ֣א יְהוֹרָ֣ם מֶֽלֶךְ יִ֠שְׂרָאֵל וַ/אֲחַזְיָ֨הוּ מֶֽלֶךְ יְהוּדָ֜ה אִ֣ישׁ בְּ/רִכְבּ֗/וֹ וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את יֵה֔וּא וַ/יִּמְצָאֻ֔/הוּ בְּ/חֶלְקַ֖ת נָב֥וֹת הַ/יִּזְרְעֵאלִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/021.yaml
  text: Then Jehoram said[a], “Harness!” and they harnessed his chariot. Then Jehoram king of Israel and Ahaziah king of Judah went out, each in his chariot, to meet Jehu, and they found him in the plot of land of Naboth the Jezreelite.
  footnotes:
  - marker: a
    text: Hebrew formally reads 'and he harnessed his chariot'; the sense is likely that the order was carried out by attendants.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러자 여호람이 말했습니다. “병거를 준비하라!” 그래서 그들이 그의 병거를 준비했습니다. 그러고 나서 이스라엘 왕 여호람과 유다 왕 아하시야는 각자 자기 병거를 타고 예후를 맞으러 나갔고, 이스르엘 사람 나봇의 땅에서 그를 만났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 형식상 ‘그가 그의 병거를 준비했다’라고 말합니다. 그러나 앞선 명령의 문맥에서는 시종들이 그 명령을 실행한 것으로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱסֹר
  english_pob_choice: Harness!
  chosen_korean: “마차를 준비하라!”
  alternatives_korean:
  - “병거에 메라!”
  - “병거를 매라!”
  - “출발 준비를 하라!”
  lexicon: HALOT
  rationale: 명령의 핵심은 왕의 병거를 즉시 출동 가능하게 하라는 뜻이므로, 한국어에서는 군사·왕실 맥락이 자연스럽게 드러나는 ‘마차를 준비하라’로 옮겼습니다.
- source_word: וַיֶּאְסֹר רִכְבּוֹ
  english_pob_choice: they harnessed his chariot
  chosen_korean: 그들이 그의 병거를 준비했습니다
  alternatives_korean:
  - 그가 그의 병거를 준비했습니다
  - 그의 병거가 준비되었습니다
  - 그들이 그의 마차를 메었습니다
  lexicon: HALOT
  rationale: 히브리어 형식상 주어는 3인칭 남성이지만, 영어 POB가 지적하듯 실제로는 시종들이 명령을 집행한 것으로 이해하는 것이 자연스럽습니다. 그래서 행위 주체를 ‘그들이’로 풀어 의미를 분명히 했습니다.
- source_word: אִישׁ בְּרִכְבּוֹ
  english_pob_choice: each in his chariot
  chosen_korean: 각자 자기 병거를 타고
  alternatives_korean:
  - 각자 자기 병거 안에서
  - 각자 자기 병거에
  - 각 사람은 자기 병거에
  lexicon: HALOT
  rationale: אִישׁ의 분배적 용법을 살려 두 왕이 각각 따로 움직였음을 드러내기 위해 ‘각자 자기 병거를 타고’로 옮겼습니다.
- source_word: בְּחֶלְקַת נָבוֹת הַיִּזְרְעֵאלִי
  english_pob_choice: in the plot of land of Naboth the Jezreelite
  chosen_korean: 나봇의 이스르엘 사람의 땅에서
  alternatives_korean:
  - 나봇 이스르엘 사람의 밭에서
  - 이스르엘 사람 나봇의 땅에서
  - 나봇의 이스르엘 토지에서
  lexicon: HALOT
  rationale: חלקה는 단순한 ‘밭’보다 ‘땅/토지’에 가까운 소유·권리의 뉘앙스를 지니므로 ‘땅’으로 옮겼고, הַיִּזְרְעֵאלִי는 고유 지명형 형용사로서 ‘이스르엘 사람’으로 처리했습니다.
theological_decisions:
- issue: 왕들의 출동이 하나님의 심판 서사의 진행으로 기능하는가
  chosen_reading: 이 절은 단순한 이동 묘사가 아니라, 예후와의 조우가 곧 심판 서사의 현장으로 들어가는 전환점으로 읽습니다.
  alternative_readings:
  - 중립적인 전술 이동 묘사
  - 단순한 지리 정보 제공
  rationale: 직접적인 신학 용어는 없지만, 앞뒤 문맥상 나봇의 땅에서의 만남은 여호와의 판결이 역사 속에서 실행되는 장면으로 기능합니다.
  doctrine_reference: 문맥적 서사 신학
