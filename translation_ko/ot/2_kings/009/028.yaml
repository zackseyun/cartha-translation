  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
  footnotes:
  - marker: a
    text: Or 'transported him to Jerusalem'; the Hebrew verb literally means 'caused him to ride' or 'had him carried.'
    reason: lexical_alternative
  - marker: b
    text: '''With his fathers'' is a Hebrew burial idiom meaning among his royal forefathers.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 신하들은 그를 예루살렘으로 옮기고, 다윗 성에 있는 그의 무덤에 그의 조상들과 함께 장사하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로 ‘타게 하다’ 또는 ‘태우다’를 뜻할 수 있습니다. 여기서는 그를 예루살렘으로 옮긴다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 조상들과 함께’는 조상들과 같은 매장지에 묻혔음을 나타내는 히브리어 장례 관용 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  english_pob_choice: carried
  chosen_korean: 옮겨다
  alternatives_korean:
  - 옮겼습니다
  - 실어 보냈습니다
