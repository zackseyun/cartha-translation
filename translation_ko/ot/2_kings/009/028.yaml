  text: וַ/יַּרְכִּ֧בוּ אֹת֛/וֹ עֲבָדָ֖י/ו יְרוּשָׁלְָ֑מָ/ה וַ/יִּקְבְּר֨וּ אֹת֧/וֹ בִ/קְבֻרָת֛/וֹ עִם אֲבֹתָ֖י/ו בְּ/עִ֥יר דָּוִֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/028.yaml
  text: His servants carried him to Jerusalem and buried him in his tomb with his fathers in the city of David[a][b].
  footnotes:
  - marker: a
    text: Or 'transported him to Jerusalem'; the Hebrew verb literally means 'caused him to ride' or 'had him carried.'
    reason: lexical_alternative
  - marker: b
    text: '''With his fathers'' is a Hebrew burial idiom meaning among his royal forefathers.'
    reason: cultural_note
translation:
  language: ko
  text: 그의 신하들이 그를 예루살렘으로 옮겨다 그를 그의 묘실에, 그의 조상들과 함께 다윗 성에 장사하였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 동사는 문자적으로는 ‘타게 하다/태우다’에 가깝지만, 여기서는 시신을 예루살렘으로 옮기는 뜻으로 쓰였습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 조상들과 함께’는 왕가 장례를 가리키는 히브리어 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְכִּבוּ
  english_pob_choice: carried
  chosen_korean: 옮겨다
  alternatives_korean:
  - 옮겼습니다
  - 실어 보냈습니다
  - 데려갔습니다
  lexicon: HALOT
  rationale: 히필형 רכב는 문자적으로는 ‘타게 하다/태우다’이지만, 시신을 옮기는 문맥이므로 ‘옮겨다’로 자연스럽게 옮겨 원문의 이동 행위를 살렸습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들이
  alternatives_korean:
  - 그의 종들이
  - 그의 시종들이
  - 그의 관리들이
  lexicon: HALOT
  rationale: 왕실 문맥의 עבד는 단순한 종보다 왕을 섬기는 인원을 가리키므로, 본문 의미를 해치지 않으면서 한국어에서 자연스러운 ‘신하들’로 옮겼습니다.
- source_word: בִּקְבֻרָתוֹ
  english_pob_choice: in his tomb
  chosen_korean: 그를 그의 묘실에
  alternatives_korean:
  - 그의 무덤에
  - 그의 장지에
  - 그의 무덤 속에
  lexicon: HALOT
  rationale: 왕족의 장례 문맥에서 קבר는 단순한 무덤보다 ‘묘실’이 더 구체적이고 품위 있는 장소감을 줍니다.
- source_word: עִם אֲבֹתָיו
  english_pob_choice: with his fathers
  chosen_korean: 그의 조상들과 함께
  alternatives_korean:
  - 그의 아버지들과 함께
  - 그의 선조들과 함께
  lexicon: HALOT
  rationale: 이 표현은 장례 관용구이므로 문자적 ‘아버지들’보다 의미를 드러내는 ‘조상들’이 한국어 독자에게 더 분명합니다.
theological_decisions:
- issue: 장례 관용구의 보존
  chosen_reading: ‘그의 조상들과 함께’로 옮겨 왕조적/계보적 매장을 드러냈습니다.
  alternative_readings:
  - ‘그의 아버지들과 함께’
  - ‘선조들 곁에’
  rationale: 히브리어 관용구의 왕조적 뉘앙스를 살리되, 한국어에서 오해를 줄이기 위해 의미를 풀어 표현했습니다.
  doctrine_reference: 문맥 관용구 보존 원칙
