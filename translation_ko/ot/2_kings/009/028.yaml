  lexicon: HALOT
  rationale: 히필형 רכב는 문자적으로는 ‘타게 하다/태우다’이지만, 시신을 옮기는 문맥이므로 ‘옮겨다’로 자연스럽게 옮겨 원문의 이동 행위를 살렸습니다.
- source_word: עֲבָדָיו
  english_pob_choice: his servants
  chosen_korean: 그의 신하들이
  alternatives_korean:
