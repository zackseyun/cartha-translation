  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 그러나 ‘옮겨다’는 문법적으로 불완전하며, 쉼표 때문에 ‘그의 묘실’과 ‘다윗 성’의 관계가 부자연스럽습니다. ‘다윗 성에 있는 그의 무덤’으로 연결하면 히브리어의 장소 관계와 매장 행위를 명료하게 전달합니다.
  naturalness: 현행 문장은 ‘그를 예루살렘으로 옮겨다 그를’의 중복과 불완전한 연결 표현 때문에 현대 표준 한국어로 자연스럽지 않습니다. 수정문은 합쇼체를 유지하면서 문장 흐름을 바로잡습니다.
  terminology: עֲבָדָיו는 왕의 수행자·관리들을 포함할 수 있으므로 ‘신하들’은 문맥상 가능합니다. קְבֻרָה는 구조를 특정하는 ‘묘실’보다 포괄적인 ‘무덤’이 안전합니다. ‘조상들과 함께’는 אֲבֹתָיו의 장례 관용구를 자연스럽게 보존합니다.
