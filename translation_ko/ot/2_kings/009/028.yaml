    rationale: 히브리어는 그를 그의 무덤에, 그의 조상들과 함께, 다윗 성에서/에 묻었다는 뜻입니다. ‘다윗 성에 있는 그의 무덤에’로 묶어 의미를 분명히 했습니다.
