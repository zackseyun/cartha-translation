base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/032.yaml
  text: He lifted up his face toward the window and said[a], “Who is with me? Who?” Then two or three eunuchs looked down at him.
  footnotes:
  - marker: a
    text: Or “court officials” for “eunuchs”; the Hebrew term can denote either, though in a royal palace setting “eunuchs” is most likely.
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 창을 향해 얼굴을 들고 말했습니다. “누가 나와 함께 있습니까? 누가?” 그러자 두세 명의 환관이 그를 내려다보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “환관”은 궁정 관리를 가리킬 수도 있으나, 이 왕궁 장면에서는 문자적 의미의 환관일 가능성이 가장 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא פָנָיו
  english_pob_choice: He lifted up his face
  chosen_korean: 그가 얼굴을 창 쪽으로 돌리고
  alternatives_korean:
  - 그가 얼굴을 들어
  - 그가 창 쪽을 올려다보고
  lexicon: HALOT
  rationale: 히브리어 관용구의 기본 이미지를 살리되, 한국어에서는 ‘얼굴을 창 쪽으로 돌리다’가 자연스럽고 장면의 방향성을 잘 드러냅니다.
- source_word: מִי אִתִּי מִי
  english_pob_choice: Who is with me? Who?
  chosen_korean: “누가 내 편입니까? 누가?”
  alternatives_korean:
  - “누가 나와 함께 있습니까? 누가?”
  - “누가 내 편에 섭니까? 누가?”
  lexicon: HALOT
  rationale: אִתִּי의 직역인 ‘나와 함께’도 가능하지만, 반복되는 수사적 질문의 긴박함을 한국어로 자연스럽게 살리기 위해 ‘내 편’으로 옮겼습니다.
- source_word: וַיַּשְׁקִיפוּ אֵלָיו
  english_pob_choice: looked down at him
  chosen_korean: 그를 내려다보았습니다
  alternatives_korean:
  - 그를 내려다보았습나다
  - 그를 밖으로 내다보았습니다
  lexicon: HALOT
  rationale: 높은 곳에서 아래를 향해 보는 시각 동작을 분명히 드러내는 표현으로, 창 위의 위치 관계를 반영합니다.
- source_word: סָרִיסִים
  english_pob_choice: eunuchs
  chosen_korean: 환관
  alternatives_korean:
  - 내시
  - 궁정 관리
  lexicon: HALOT
  rationale: 궁정 맥락에서 가장 직접적인 대응어는 ‘환관’이며, POB의 기본 선택도 이 쪽이므로 그 선택을 따랐습니다.
