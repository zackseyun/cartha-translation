  text: 'Then take the flask of oil[a], pour it on his head, and say, ‘Thus says Yahweh: I have anointed you king over Israel.’ Then open the door and flee; do not wait.'
  footnotes:
  - marker: a
    text: 'Hebrew: ''to Israel''; the sense in this royal appointment formula is ''over Israel.'''
    reason: lexical_alternative
translation:
  language: ko
  text: 그는 기름 한 병을 가져다가 그의 머리에 붓고, 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. “내가 너를 이스라엘의 왕으로 기름부었습니다.”’ 그런 다음 문을 열고 달아나십시오. 지체하지 마십시오.’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이스라엘의 왕으로’는 직역상 ‘이스라엘에게’에 가깝지만, 이 왕위 부여 공식에서는 ‘이스라엘 위에’라는 뜻으로 읽는 것이 자연스럽습니다.
    reason: lexical_alternative
