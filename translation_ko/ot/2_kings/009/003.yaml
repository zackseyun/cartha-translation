  - 머무르지 마십시오
  lexicon: HALOT
  rationale: חכה의 핵심은 ‘머물며 기다리다/지연하다’이므로, 급박한 탈출 명령의 뉘앙스를 살려 ‘지체하지 마십시오’로 옮겼습니다.
