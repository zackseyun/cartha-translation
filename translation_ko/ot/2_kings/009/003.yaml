  lexicon: HALOT
  rationale: יצק + עַל의 기본 의미를 살려, 예식적 동작이 분명하게 드러나도록 ‘머리에 붓고’로 옮겼습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
