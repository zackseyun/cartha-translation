  rationale: 본문의 신명은 대체 호칭이 아니라 고유명으로 처리하는 원칙에 따라 ‘야훼’를 사용했습니다.
- source_word: מְשַׁחְתִּיךָ לְמֶלֶךְ אֶל יִשְׂרָאֵל
  english_pob_choice: I have anointed you king over Israel
  chosen_korean: 내가 너를 이스라엘의 왕으로 기름부었습니다
  alternatives_korean:
  - 내가 너를 이스라엘 위에 왕으로 세웠습니다
  - 내가 너를 이스라엘의 왕으로 임명했습니다
  lexicon: HALOT
  rationale: 왕위 임명 공식의 관용을 따라 ‘왕으로 기름부었습니다’로 옮기되, אֶל יִשְׂרָאֵל은 통치 대상 관계를 자연스럽게 드러내는 속격 표현으로 처리했습니다.
- source_word: וְלֹא תְחַכֶּה
  english_pob_choice: do not wait
  chosen_korean: 지체하지 마십시오
  alternatives_korean:
