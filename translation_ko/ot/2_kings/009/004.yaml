lexical_decisions:
- source_word: וַיֵּלֶךְ
  english_pob_choice: So ... went
  chosen_korean: 갔습니다
  alternatives_korean:
  - 그리고 갔습니다
  - 그래서 갔습니다
  - 그리하여 갔습니다
  lexicon: HALOT
  rationale: 이완결의 서술 진행을 한국어 자연스러운 과거 서술로 옮기되, 앞선 행동의 연속성을 유지했습니다.
- source_word: הַנַּעַר
  english_pob_choice: the young man
  chosen_korean: 그 젊은 사람
  alternatives_korean:
  - 그 젊은이
  - 그 종
  - 그 하인
  lexicon: HALOT
  rationale: נַעַר는 이 문맥에서 단순한 ‘종’보다 나이/신분이 함께 드러나는 ‘젊은 사람’이 더 직접적입니다.
- source_word: הַנַּעַר הַנָּבִיא
  english_pob_choice: the young prophet
  chosen_korean: 곧 젊은 예언자는
  alternatives_korean:
  - 젊은 예언자
  - 그 예언자의 젊은 사람
  - 젊은 사람, 곧 예언자
  lexicon: HALOT
  rationale: 히브리어의 반복과 이어지는 apposition을 한국어의 ‘곧’으로 풀어, 같은 인물을 다시 지시하는 구조를 드러냈습니다.
- source_word: רָמֹת גִּלְעָד
  english_pob_choice: Ramoth-gilead
  chosen_korean: 길르앗 라못
  alternatives_korean:
  - 라못 길르앗
  - 라못-길르앗
  lexicon: HALOT
  rationale: 지명은 관용적인 성서 한국어 표기인 ‘길르앗 라못’을 사용해 알아보기 쉽게 옮겼습니다.
theological_decisions:
- issue: 예언자 호칭의 중의성
  chosen_reading: 본문의 두 번째 הנער를 같은 인물에 대한 수식적 재지시로 보고 ‘젊은 예언자’로 옮겼습니다.
  alternative_readings:
  - ‘예언자의 젊은 종’으로 이해하는 번역
  - ‘젊은 사람, 곧 예언자’로 분리하는 번역
  rationale: 영어 POB가 반복을 강조하는 본문 구조를 유지하되, 인물이 엘리사의 사자라는 점을 한국어에서 분명히 했습니다.
  doctrine_reference: 본문 주해/문법
