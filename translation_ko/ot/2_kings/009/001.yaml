source:
  edition: WLC
  text: וֶ/אֱלִישָׁע֙ הַ/נָּבִ֔יא קָרָ֕א לְ/אַחַ֖ד מִ/בְּנֵ֣י הַ/נְּבִיאִ֑ים וַ/יֹּ֨אמֶר ל֜/וֹ חֲגֹ֣ר מָתְנֶ֗י/ךָ וְ֠/קַח פַּ֣ךְ הַ/שֶּׁ֤מֶן הַ/זֶּה֙ בְּ/יָדֶ֔/ךָ וְ/לֵ֖ךְ רָמֹ֥ת גִּלְעָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/001.yaml
  text: Then Elisha the prophet called one of the sons of the prophets and said to him[a], “Gird up your loins, take this flask of oil in your hand[b], and go to Ramoth-gilead.”
  footnotes:
  - marker: a
    text: Literally, “Gird up your loins,” an idiom meaning to prepare for action or travel by tucking up one’s garments.
    reason: lexical_alternative
  - marker: b
    text: “Sons of the prophets” refers to members of a prophetic group or guild, not necessarily biological sons.
    reason: cultural_note
translation:
  language: ko
  text: 그러자 엘리사 예언자가 예언자들의 아들들[a] 가운데 한 사람을 불러 그에게 말했습니다. “허리를 동이고[b] 이 기름병을 손에 들고 라못 길르앗으로 가십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘예언자들의 아들들’은 생물학적 자녀라기보다 예언자 집단의 구성원을 가리키는 표현입니다.
    reason: cultural_note
  - marker: b
    text: 히브리어 직역은 “허리를 동이라”이며, 이는 이동이나 행동을 위해 옷자락을 걷어 올리라는 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶאֱלִישָׁע֙ הַנָּבִיא
  english_pob_choice: Then Elisha the prophet
  chosen_korean: 그러자 엘리사 예언자가
  alternatives_korean:
  - 그리고 엘리사 예언자가
  - 그때 엘리사 예언자가
  lexicon: HALOT
  rationale: 서술 진행을 나타내는 연결어는 한국어 서술 흐름에 맞게 '그러자'로 옮기고, הַנָּבִיא는 엘리사의 직함이므로 '예언자'로 옮겼습니다.
- source_word: מִבְּנֵי הַנְּבִיאִים
  english_pob_choice: of the sons of the prophets
  chosen_korean: 예언자들의 아들들 가운데 한 사람
  alternatives_korean:
  - 예언자들의 무리 가운데 한 사람
  - 예언자 제자들 가운데 한 사람
  lexicon: HALOT
  rationale: 히브리어의 관용구를 투명하게 살리기 위해 직역형을 유지했고, 문맥상 혈연보다는 예언자 집단 소속을 가리키므로 자연스럽게 '가운데 한 사람'으로 풀었습니다.
- source_word: חֲגֹר מָתְנֶיךָ
  english_pob_choice: Gird up your loins
  chosen_korean: 허리를 동이고
  alternatives_korean:
  - 전투 태세를 갖추고
  - 옷자락을 걷어 올리고
  lexicon: HALOT
  rationale: 문자적으로는 '허리/허리띠를 동이다'의 이미지이며, POB가 보존한 행동 준비의 관용 표현을 한국어로 간결하게 살렸습니다.
- source_word: פַּךְ הַשֶּׁמֶן הַזֶּה
  english_pob_choice: this flask of oil
  chosen_korean: 이 기름병
  alternatives_korean:
  - 이 기름 항아리
  - 이 기름 단지
  lexicon: HALOT
  rationale: פַּךְ는 작은 용기를 가리키므로, 현대 독자가 바로 이해할 수 있는 '기름병'이 가장 자연스럽습니다.
- source_word: רָמֹת גִּלְעָד
  english_pob_choice: Ramoth-gilead
  chosen_korean: 라못길르앗
  alternatives_korean:
  - 라못-길르앗
  - 길르앗 라못
  lexicon: modern biblical proper noun
  rationale: 지명은 현대 외래어 표기 관행에 따라 음역했고, 하이픈 대신 붙여 쓰는 형태를 택했습니다.
theological_decisions:
- issue: 예언자 직함과 예언자 공동체 표현
  chosen_reading: '''예언자''와 ''예언자들의 아들들''을 유지해 공동체적 예언자 집단의 성격을 드러냈습니다.'
  alternative_readings:
  - '''선지자'''
  - '''예언자 제자들'''
  rationale: 본문은 엘리사의 개인 직함과 예언자 집단 내부 구성원을 함께 보여 주므로, 교회적 관용어인 '선지자'보다 원문 구조를 드러내는 표현이 더 적절합니다.
  doctrine_reference: 역사서의 서술 맥락과 예언자 공동체 표상
