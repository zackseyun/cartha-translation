base_translation:
  language: en
  yaml_path: translation/ot/2_kings/009/018.yaml
  text: 'So the horseman went to meet him and said[a], “Thus says the king: Is it peace?” But Jehu said, “What do you have to do with peace? Turn behind me.” And the watchman reported, saying, “The messenger reached them[b], but he has not returned.”'
  footnotes:
  - marker: a
    text: Or “Is all well?” The Hebrew uses shalom, repeated throughout the exchange.
    reason: lexical_alternative
  - marker: b
    text: Or “Fall in behind me.” The Hebrew literally says “Turn behind me.”
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 말 탄 사람이 그를 맞으러 가서 말했습니다. “왕이 이렇게 말씀하십니다. 평안합니까?”[a] 예후가 말했습니다. “평안이 당신과 무슨 상관이 있습니까? 내 뒤로 돌아서십시오.”[b] 그러자 파수꾼이 보고했습니다. “전령이 그들에게 이르렀으나 돌아오지 않았습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “무사합니까?” 히브리어는 이 대화 전반에서 שָׁלוֹם을 반복합니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “내 뒤에 붙으십시오.” 히브리어는 문자적으로 “내 뒤로 돌아서십시오”라고 말합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכֵב הַסּוּס
  english_pob_choice: the horseman
  chosen_korean: 말 탄 사람
  alternatives_korean:
  - 기마병
  - 말 탄 자
  lexicon: HALOT
  rationale: 직역의 느낌을 유지하면서도 한국어에서 자연스럽게 읽히는 표현으로 옮겼습니다. 군사적 전령 맥락을 살리되 지나치게 전문적인 용어는 피했습니다.
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  english_pob_choice: Thus says the king
  chosen_korean: 왕이 이렇게 말씀하십니다
  alternatives_korean:
  - 왕이 이같이 말합니다
  - 왕이 말하십니다
  lexicon: HALOT
  rationale: 전형적인 사자 발화 공식을 한국어 현대문체로 옮겼습니다. "말씀하십니다"는 왕의 권위 있는 공식 발화를 자연스럽게 드러냅니다.
- source_word: הֲשָׁלוֹם
  english_pob_choice: Is it peace?
  chosen_korean: 평안하냐?
  alternatives_korean:
  - 평안이냐?
  - 무사하냐?
  lexicon: HALOT
  rationale: 본문의 반복어 שָׁלוֹם을 살리면서, 이 대목에서는 단순한 정치적 평화보다 안부/상태를 묻는 뉘앙스가 강하므로 한국어에서 가장 자연스러운 질문형으로 옮겼습니다.
- source_word: מַה לְּךָ וּלְשָׁלוֹם
  english_pob_choice: What do you have to do with peace?
  chosen_korean: 평안이 네게 무슨 상관이 있느냐?
  alternatives_korean:
  - 네가 평안과 무슨 상관이 있느냐?
  - 평안이 너와 무슨 관계가 있느냐?
  lexicon: HALOT
  rationale: 히브리어 관용구의 거절/차단 뉘앙스를 살리되, 반복된 "평안"을 유지해 앞선 질문과 대응되게 했습니다.
- source_word: סֹב אֶל אַחֲרָי
  english_pob_choice: Turn behind me
  chosen_korean: 내 뒤로 돌아오너라
  alternatives_korean:
  - 내 뒤에 붙어라
  - 내 뒤를 따라오너라
  lexicon: HALOT
  rationale: 직역인 "뒤로 돌아오라"의 방향성을 살리면서, 문맥상 명령의 의미가 분명히 드러나도록 한국어 명령형으로 정리했습니다.
- source_word: הַמַּלְאָךְ
  english_pob_choice: the messenger
  chosen_korean: 전령
  alternatives_korean:
  - 사자
  - 메신저
  lexicon: HALOT
  rationale: 여기서는 천사가 아니라 사람 심부름꾼이므로 "전령"이 가장 정확합니다. 군사적·궁정적 전달자라는 문맥도 반영합니다.
theological_decisions:
- issue: שָׁלוֹם의 반복을 어떻게 옮길지
  chosen_reading: 앞뒤 문장에서 모두 "평안"을 유지해 반복 효과를 살렸습니다.
  alternative_readings:
  - 앞 문장은 "안녕이냐?", 뒷문장은 "무슨 상관이 있느냐?"로 완화
  - 앞 문장은 "무사하냐?"로 풀고 반복을 약화
  rationale: 이 장면은 단순 정보 전달이 아니라 반복되는 שאלת שָׁלוֹם을 통해 긴장과 냉소를 강화합니다. 따라서 동일 어휘를 유지하는 것이 서사의 힘을 보존합니다.
  doctrine_reference: 내러티브 수사 보존; lexical cohesion
