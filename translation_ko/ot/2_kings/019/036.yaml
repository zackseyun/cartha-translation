  text: So Sennacherib king of Assyria departed and went and returned, and he lived in Nineveh.
translation:
  language: ko
  text: 그리하여 앗수르 왕 산헤립이 떠나서 가고 돌아와 니느웨에 살았습니다.
  philosophy: formal
lexical_decisions:
- source_word: וַ/יִּסַּ֣ע וַ/יֵּ֔לֶךְ וַ/יָּ֖שָׁב
  english_pob_choice: departed and went and returned
  chosen_korean: 떠나서 가고 돌아와
  alternatives_korean:
  - 떠났다가 가서 돌아와
  - 출발하여 가고 돌아와
  - 떠나고 가고 돌아와
  lexicon: נסע / הלך / שוב
  rationale: 세 동사의 연속을 한국어도 동작의 진행 순서가 보이도록 간결하게 살렸습니다.
- source_word: סַנְחֵרִ֣יב מֶֽלֶךְ אַשּׁ֑וּר
  english_pob_choice: Sennacherib king of Assyria
  chosen_korean: 앗수르 왕 산헤립
  alternatives_korean:
  - 아시리아 왕 산헤립
  - 산헤립 앗수르 왕
  lexicon: Sennacherib / Assyria
  rationale: 고유명사 산헤립은 통용형을 따르고, אַשּׁוּר는 역사적 지명·국명 맥락을 살려 앗수르로 옮겼습니다.
- source_word: וַ/יֵּ֖שֶׁב
  english_pob_choice: he lived
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 머물렀습니다
  - 살게 되었습니다
  lexicon: ישב
  rationale: POB가 'dwelt'를 'lived'로 조정한 흐름을 반영하여, 정주 상태를 자연스럽고 직접적으로 나타냈습니다.
- source_word: בְּ/נִֽינְוֵֽה־
  english_pob_choice: in Nineveh
  chosen_korean: 니느웨에
  alternatives_korean:
  - 니느웨에서
  - 니네베에
  lexicon: Nineveh
  rationale: 성경에서 널리 알려진 니느웨를 사용하고, 전치사는 한국어 조사 '-에'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 앗수르 왕의 귀환과 거주를 어떻게 서술할지
  chosen_reading: 이 절은 심판 이후 산헤립의 정치적 행보를 서술하는 역사 기록으로, 과장이나 해석을 덧붙이지 않고 사실 진술형으로 옮겼습니다.
  alternative_readings:
  - 징벌적 뉘앙스를 강조하는 번역
  - 서사적 여운을 덧붙이는 번역
  rationale: 원문은 단순한 서술문이며, 문맥상 신학적 평가보다 사건의 사실성을 전달하는 것이 적절합니다.
  doctrine_reference: 역사서 서술의 직역 원칙
- issue: ישב의 의미를 '거주하다/살다' 중 어떻게 잡을지
  chosen_reading: '''살았습니다''로 옮겨 장기 거주 상태를 드러냈습니다.'
  alternative_readings:
  - '''거주했습니다'''
  - '''머물렀습니다'''
  rationale: POB의 'lived' 선택과 부합하며, 왕의 정착 상태를 현대 한국어로 자연스럽게 표현합니다.
  doctrine_reference: 서술 동사 선택
