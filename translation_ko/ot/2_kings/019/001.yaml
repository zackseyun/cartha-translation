base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/001.yaml
  text: And when King Hezekiah heard it, he tore his clothes, covered himself with sackcloth, and went into the house of Yahweh.
translation:
  language: ko
  text: 히스기야 왕이 그것을 듣고 자기 옷을 찢고 굵은 베로 몸을 두르고 야훼의 집에 들어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  english_pob_choice: And when ... heard
  chosen_korean: “…을 듣고”
  alternatives_korean:
  - “…을 들었을 때”
  - “듣자”
  lexicon: HALOT
  rationale: 히브리어의 서사적 시간 전환을 한국어에서는 자연스러운 부사절로 살려, 뒤따르는 행동들의 연속을 매끄럽게 전달했습니다.
- source_word: הַמֶּלֶךְ חִזְקִיָּהוּ
  english_pob_choice: King Hezekiah
  chosen_korean: 히스기야 왕
  alternatives_korean:
  - 왕 히스기야
  - 히스기야
  lexicon: HALOT
  rationale: 한국어에서는 고유명사 뒤에 왕위를 두는 형태가 가장 자연스럽고, 인물 식별도 분명합니다.
- source_word: וַיִּתְכַּס בַּשָּׂק
  english_pob_choice: covered himself with sackcloth
  chosen_korean: 굵은 베로 몸을 두른
  alternatives_korean:
  - 베옷을 입고
  - 삼베를 둘러
  lexicon: HALOT
  rationale: שָּׂק은 통상적 애도복인 sackcloth로, 한국어 성경 전통의 ‘굵은 베’를 쓰되 ‘몸을 두르다’로 동작의 반사적 뉘앙스를 살렸습니다.
- source_word: בֵּית יְהוָה
  english_pob_choice: the house of Yahweh
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 야훼의 성전
  - 여호와의 집
  lexicon: HALOT
  rationale: 본문의 בית יהוה는 문자적으로 ‘YHWH의 집’이므로, POB 원칙에 따라 ‘야훼’를 유지했고, ‘집’도 원문 이미지를 보존했습니다.
theological_decisions:
- issue: יהוה의 번역
  chosen_reading: 야훼
  alternative_readings:
  - 주님
  - 여호와
  rationale: 본문이 신적 칭호가 아닌 언약 이름 יְהוָה를 직접 사용하므로, 전통적 치환어 대신 음역 ‘야훼’를 유지했습니다.
  doctrine_reference: 'POB glossary: יהוה / YHWH → 야훼'
