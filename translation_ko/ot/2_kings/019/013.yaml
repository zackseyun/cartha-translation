theological_decisions:
- issue: 조롱의 수사 유지
  chosen_reading: 왕들의 실재적 부재를 묻는 조롱형 수사의문문으로 유지했습니다.
  alternative_readings:
  - 단순한 위치 질문으로 완화
  - 의미를 설명적으로 풀어 ‘망한 왕들’로 의역
  rationale: 본문은 앗수르 왕의 도전적 질문이므로, 수사적 긴장과 빈정거림을 약화시키지 않도록 그대로 살렸습니다.
  doctrine_reference: 본문 문맥 보존 원칙
- issue: 호칭의 격식
  chosen_reading: 직접 설교적 높임이 아니라 역사 서술의 공식적 문체를 유지했습니다.
  alternative_readings:
  - 하십니까 체의 더 강한 고어적 높임
  - 평서형으로 단순화
  rationale: 합쇼체를 쓰되, 왕의 열거와 수사적 질문의 공적 문체를 살리기 위해 과도한 경어를 피했습니다.
