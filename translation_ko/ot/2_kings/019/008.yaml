  text: וַ/יָּ֨שָׁב֙ רַב שָׁקֵ֔ה וַ/יִּמְצָא֙ אֶת מֶ֣לֶךְ אַשּׁ֔וּר נִלְחָ֖ם עַל לִבְנָ֑ה כִּ֣י שָׁמַ֔ע כִּ֥י נָסַ֖ע מִ/לָּכִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/008.yaml
  text: So the Rabshakeh returned and found the king of Assyria fighting against Libnah[a], for he had heard that he had departed from Lachish.
  footnotes:
  - marker: a
    text: Or 'had set out from Lachish.' The Hebrew verb can denote departing, setting out, or breaking camp in a military context.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리하여 랍사게가 돌아와 보니, 앗시리아 왕은 립나를 치고 있었습니다. 그가 라기스에서 떠났다는 말을 들었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘라기스에서 출발했을 때’입니다. 히브리어 동사는 군사적 문맥에서 떠나다, 출발하다, 진을 걷다를 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 랍사게
  alternatives_korean:
  - 랍샤케
  - 왕의 술잔 맡은 자
  lexicon: HALOT
  rationale: 본문에서는 고유한 직함이 인물 식별자처럼 쓰이므로, 기능 설명보다 음역을 택해 서술 흐름을 유지했습니다.
- source_word: וַיָּשָׁב
  english_pob_choice: returned
  chosen_korean: 돌아와
  alternatives_korean:
  - 되돌아가
  - 되돌아와
  lexicon: HALOT
  rationale: 와우 연속형의 진행감을 살리면서 현대 한국어 서술에 자연스럽게 맞는 ‘돌아와’를 사용했습니다.
- source_word: נִלְחָם עַל
  english_pob_choice: fighting against
  chosen_korean: 치를고 있었습니다
  alternatives_korean:
  - 싸우고 있었습니다
  - 전쟁을 벌이고 있었습니다
  lexicon: HALOT
  rationale: עַל + 성읍의 적대적 군사행동을 한국어로 자연스럽게 풀어, 단순한 위치가 아니라 공격 중인 상태임을 드러냈습니다.
- source_word: נָסַע מִלָּכִישׁ
  english_pob_choice: had departed from Lachish
  chosen_korean: 라기스에서 떠났다는
  alternatives_korean:
  - 라기스에서 진을 걷고 떠났다는
  - 라기스에서 출발했다는
  lexicon: HALOT
  rationale: נָסַע는 군사적 문맥에서 출발·이동·진을 걷음을 뜻할 수 있으므로, 영어 주석의 여지를 반영해 ‘떠났다’로 옮겼습니다.
theological_decisions:
- issue: 아시리아 왕의 행위 묘사
  chosen_reading: 본절은 역사 서술로 처리하고, 원문의 군사적 진행과 이유 설명을 그대로 유지했습니다.
  alternative_readings:
  - 더 해설적으로 풀어 쓰는 방식
  - ‘공격했다’로 단정하는 방식
  rationale: 본문은 사건의 경과를 기록하는 문맥이므로, 의미를 과장하지 않고 원문이 말하는 진행상태와 인과만 드러내는 것이 적절합니다.
  doctrine_reference: 본문 맥락 보존 원칙
