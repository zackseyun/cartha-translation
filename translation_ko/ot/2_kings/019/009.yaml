  source_fidelity: 초안은 쿠스 왕 디르하가, 그가 싸우러 나왔다는 보고, 돌아감, 히스기야에게 사신을 보냄이라는 핵심 내용을 대체로 보존합니다. 그러나 첫 번째 לֵאמֹר가 이끄는 보고를 ‘듣고 말하기를’으로 연결하여 한국어 문법과 의미 관계가 어색해졌고, 마지막 לֵאמֹר는 다음 절의 전달 내용을 도입하는데 ‘말했습니다’로 종결하여 원문의 미완결 도입 구조를 흐립니다.
