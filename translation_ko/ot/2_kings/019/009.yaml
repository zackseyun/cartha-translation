source:
  edition: WLC
  text: וַ/יִּשְׁמַ֗ע אֶל תִּרְהָ֤קָה מֶֽלֶך כּוּשׁ֙ לֵ/אמֹ֔ר הִנֵּ֥ה יָצָ֖א לְ/הִלָּחֵ֣ם אִתָּ֑/ךְ וַ/יָּ֨שָׁב֙ וַ/יִּשְׁלַ֣ח מַלְאָכִ֔ים אֶל חִזְקִיָּ֖הוּ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/009.yaml
  text: When he heard concerning Tirhakah king of Cush[a], saying, “Look, he has come out to fight against you,” he turned back and sent messengers to Hezekiah, saying,
  footnotes:
  - marker: a
    text: Or 'king of Ethiopia.' The Hebrew reads 'Cush,' the ancient region south of Egypt.
    reason: lexical_alternative
translation:
  language: ko
  text: '그가 쿠스[a] 왕 디르하가에 관하여, 「보십시오, 그가 당신과 싸우러 나왔습니다」라는 말을 듣고 돌아가서, 히스기야에게 사신들을 보내어 이렇게 말하게 했습니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 쿠스는 히브리어 כּוּשׁ의 음역입니다. 이 지역은 이집트 남쪽의 고대 지명을 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֶל
  english_pob_choice: When he heard concerning
  chosen_korean: …에 관해 듣고
  alternatives_korean:
  - …을 듣고
  - …에 대하여 듣고
  lexicon: HALOT
  rationale: שׁמע 뒤의 אֶל은 들은 내용의 주제를 이끌므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘…에 관해 듣고’로 옮겼습니다.
- source_word: מֶלֶך כּוּשׁ
  english_pob_choice: king of Cush
  chosen_korean: 쿠스 왕
  alternatives_korean:
  - 에티오피아 왕
  - 구스 왕
  lexicon: HALOT
  rationale: 원문의 지명 כּוּשׁ를 직접 살려 ‘쿠스’로 옮기고, 전통적이지만 시대착오적일 수 있는 ‘에티오피아’는 피했습니다.
- source_word: לֵאמֹר הִנֵּה יָצָא לְהִלָּחֵם אִתָּךְ
  english_pob_choice: saying, “Look, he has come out to fight against you,”
  chosen_korean: 「보십시오, 그가 당신과 싸우러 나왔습니다」
  alternatives_korean:
  - 「보라, 그가 당신과 싸우려고 나왔습니다」
  - 「보십시오, 그가 당신과 싸우기 위해 나왔습니다」
  lexicon: HALOT
  rationale: 보고된 직접화법의 감탄·지시 기능을 ‘보십시오’로 살리고, 전투 맥락의 לְהִלָּחֵם אִתָּךְ는 ‘당신과 싸우러’로 자연스럽게 표현했습니다.
- source_word: וַיִּשְׁלַח מַלְאָכִים
  english_pob_choice: and sent messengers
  chosen_korean: 사신들을 보내며
  alternatives_korean:
  - 사자들을 보내며
  - 메신저들을 보내며
  lexicon: HALOT
  rationale: 외교·군사적 맥락에서 מַלְאָכִים는 인간 사절을 뜻하므로, 문맥상 격식 있는 ‘사신들’이 적절합니다.
theological_decisions:
- issue: 보고된 말의 종결 방식
  chosen_reading: 히브리어의 반복된 לֵאמֹר를 따라, 앞의 인용과 뒤의 소개를 분명히 하되 한국어는 군더더기 없이 이어지게 했습니다.
  alternative_readings:
  - ‘말하며’로 통합
  - 둘째 לֵאמֹר를 생략
  rationale: 원문은 두 차례의 말 소개 구조를 가지므로, 서사적 리듬과 다음 절로 이어지는 발화를 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 서사 구조 보존 원칙
- issue: 직접화법의 호칭과 문체
  chosen_reading: 쿠스 왕의 보고 인용문은 원문의 평서적 전달에 맞춰 합쇼체를 유지했습니다.
  alternative_readings:
  - 더 구어적인 반말
  - 고전적 성경체
  rationale: 내러티브 본문으로서 현대 표준어의 공식적 문체를 유지하되, 원문의 인용 기능을 흐리지 않도록 했습니다.
  doctrine_reference: 문체 일관성 원칙
