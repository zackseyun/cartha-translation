lexical_decisions:
- source_word: בַּדֶּרֶךְ אֲשֶׁר יָבֹא בָּהּ
  english_pob_choice: By the way that he came, by it he will return
  chosen_korean: 그가 온 그 길로 돌아갈 것이며
  alternatives_korean:
  - 그가 온 바로 그 길로 돌아갈 것이며
  - 그가 왔던 길을 따라 돌아갈 것이며
  lexicon: HALOT
  rationale: 히브리어는 ‘오다/되돌아가다’와 같은 길의 재이동을 말하므로, 한국어에서는 반복을 자연스럽게 살려 ‘그가 온 그 길’로 옮겼습니다.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
  english_pob_choice: he will not come to this city
  chosen_korean: 이 성읍에는 들어오지 못합니다
  alternatives_korean:
  - 이 성읍으로는 오지 못합니다
  - 이 성읍에 들어오지 않을 것입니다
  lexicon: HALOT
  rationale: ‘성읍’은 본문이 가리키는 도시를 살리고, 동작의 실제 결과를 분명히 하도록 ‘들어오다’로 옮겼습니다.
- source_word: נְאֻם יְהוָה
  english_pob_choice: declares Yahweh
  chosen_korean: 야훼의 말씀입니다
  alternatives_korean:
  - 야훼께서 말씀하십니다
  - 야훼의 선언입니다
  lexicon: HALOT
  rationale: 예언적 선언 공식 נְאֻם은 한국어에서 단순한 종결보다 ‘말씀입니다’가 더 자연스럽고, 본문 말미의 권위를 잘 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  lexicon: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
  rationale: 본문의 신명문자는 전통적 대체어가 아니라 고유명으로 처리하여, 독자가 하나님의 언약 이름을 직접 보게 했습니다.
theological_decisions:
- issue: 야훼의 선언 공식 לשון נְאֻם의 문체 처리
  chosen_reading: “야훼의 말씀입니다”로 마무리해 예언적 권위와 현대 한국어의 자연스러움을 함께 살렸습니다.
  alternative_readings:
  - “야훼께서 말씀하십니다”
  - “야훼의 선언입니다”
  rationale: 본절은 예언의 확정성을 선포하는 공식문이므로, 평서문 종결보다 신탁 문체가 드러나는 번역이 본문 기능을 더 잘 전달합니다.
  doctrine_reference: 예언적 신탁 공식 נְאֻם의 한국어 처리
