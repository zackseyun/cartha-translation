  naturalness: ‘그가 온 그 길로 돌아갈 것이며’와 ‘야훼의 말씀입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘이 성읍으로는 오지 않을 것입니다’는 대조·강조된 전치사구를 자연스럽게 반영합니다.
