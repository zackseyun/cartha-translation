  lexicon: HALOT
  rationale: 히브리어는 ‘오다/되돌아가다’와 같은 길의 재이동을 말하므로, 한국어에서는 반복을 자연스럽게 살려 ‘그가 온 그 길’로 옮겼습니다.
- source_word: וְאֶל הָעִיר הַזֹּאת לֹא יָבֹא
