  - 과연
  - 정녕
  lexicon: HALOT
  rationale: 문장의 첫머리에서 앞선 진술을 강하게 확인하는 감탄·확언의 용법을 자연스러운 현대 한국어로 살렸습니다.
- source_word: יְהוָה
