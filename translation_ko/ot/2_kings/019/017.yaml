translation:
  language: ko
  text: 참으로 야훼여, 앗수르의 왕들이 민족들과 그들의 땅을 황폐하게 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 직역하면 ‘그들의 땅’입니다. ‘땅’은 단수형이지만 복수의 ‘민족들’과 연결되어, 각 민족의 땅이라는 분산적 의미로 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמְנָם
  english_pob_choice: Truly
  chosen_korean: 참으로
  alternatives_korean:
