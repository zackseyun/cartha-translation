  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신적 이름을 제목형 표현이 아니라 이름으로 보존하기 위해 POB 기준에 따라 ‘야훼’로 옮겼습니다.
- source_word: הֶחֱרִיבוּ
  english_pob_choice: have laid waste
  chosen_korean: 황폐하게 하였습니다
  alternatives_korean:
  - 폐허로 만들었습니다
  - 파괴하였습니다
  - 멸망시켰습니다
  lexicon: HALOT
  rationale: 전쟁 맥락에서 단순 파괴보다 ‘땅을 황폐하게 함’의 의미가 더 분명하므로, 결과 상태를 드러내는 표현을 택했습니다.
- source_word: הַגּוֹיִם ... אַרְצָם
  english_pob_choice: the nations ... their lands
  chosen_korean: 여러 민족들과 그들의 땅
  alternatives_korean:
  - 민족들과 그들의 땅
  - 나라들과 그들의 땅
  - 열국과 그들의 땅
  lexicon: HALOT
  rationale: גויים는 여기서 정복 대상 집단들을 가리키므로 ‘민족들’이 적절하고, 히브리어 단수형 ‘땅’은 POB의 분산적 의미를 따라 한국어 복수 소유로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 하나님의 이름을 본문에서 어떻게 처리할 것인가
  chosen_reading: ‘야훼’로 직접 음역하여 하나님을 한 칭호가 아니라 고유한 이름으로 드러냈습니다.
  alternative_readings:
  - ‘주님’으로 처리
  - ‘여호와’로 처리
  rationale: 이 절은 야훼의 이름을 직접 호명하는 탄원 구조이므로, 독자가 본문이 말하는 인격적 언약 이름을 인지하도록 하는 것이 더 충실합니다.
  doctrine_reference: 'POB doctrine: יְהוָה YHWH → Yahweh'
