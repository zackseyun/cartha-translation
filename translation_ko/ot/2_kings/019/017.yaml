  text: Truly[a], O Yahweh[b], the kings of Assyria have laid waste the nations and their lands.
  footnotes:
  - marker: a
    text: Or 'Indeed' or 'Surely' for the opening affirmation.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'their land'; the singular likely has a collective/distributive sense, hence 'their lands.'
