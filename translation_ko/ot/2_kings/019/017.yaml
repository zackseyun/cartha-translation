  - ‘여호와’로 처리
  rationale: 이 절은 야훼의 이름을 직접 호명하는 탄원 구조이므로, 독자가 본문이 말하는 인격적 언약 이름을 인지하도록 하는 것이 더 충실합니다.
  doctrine_reference: 'POB doctrine: יְהוָה YHWH → Yahweh'
