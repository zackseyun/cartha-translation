  text: לָ/כֵ֗ן כֹּֽה אָמַ֤ר יְהוָה֙ אֶל מֶ֣לֶךְ אַשּׁ֔וּר לֹ֤א יָבֹא֙ אֶל הָ/עִ֣יר הַ/זֹּ֔את וְ/לֹֽא יוֹרֶ֥ה שָׁ֖ם חֵ֑ץ וְ/לֹֽא יְקַדְּמֶ֣/נָּה מָגֵ֔ן וְ/לֹֽא יִשְׁפֹּ֥ךְ עָלֶ֖י/הָ סֹלְלָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
  footnotes:
  - marker: a
    text: Or 'advance against it with a shield.' The Hebrew likely refers to approaching the city under shield protection in siege warfare.
    reason: lexical_alternative
  - marker: b
    text: Or 'heap up a siege mound against it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 앗수르 왕에 관하여 이렇게 말씀하십니다. 그는 이 성에 들어오지 못하며, 그곳에서 화살도 쏘지 못하고, 방패를 들고 그 앞에 나아오지도 못하며, 그것을 향해 포위 제방도 쌓아 올리지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '방패를 들고 그에게 맞서 접근하다'로 옮길 수 있습니다. 히브리어는 공성전에서 방패 보호 아래 성에 다가가는 동작을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '포위 제방을 쌓아 올리다'로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 따라서
  - 그리하여
  lexicon: HALOT
  rationale: 앞선 예언의 결론을 나타내는 인과·추론 접속으로 자연스러운 현대 한국어 '그러므로'가 가장 잘 맞습니다.
- source_word: כֹּה אָמַר יְהוָה
  english_pob_choice: thus says Yahweh
  chosen_korean: 야훼께서 이렇게 말씀하십니다
  alternatives_korean:
  - 야훼께서 이같이 말씀하십니다
  - 여호와께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 예언자적 선언형을 살리면서, 프로젝트 기본어인 '야훼'를 유지하고 한국어에서는 현재형 선언체로 옮겼습니다.
- source_word: יְקַדְּמֶנָּה מָגֵן
  english_pob_choice: come before it with a shield
  chosen_korean: 방패를 들고 그 앞에 나아오지도 못하며
  alternatives_korean:
  - 방패로 그 앞에 맞서지도 못하며
  - 방패를 앞세워 그 앞에 오지도 못하며
  lexicon: HALOT
  rationale: קדמ의 '맞서 다가가다/나아오다'라는 뉘앙스를 살리되, 문맥상 포위 공성 장면의 방어적 접근을 한국어로 자연스럽게 표현했습니다.
- source_word: סֹלְלָה
  english_pob_choice: siege ramp
  chosen_korean: 포위 제방
  alternatives_korean:
  - 공성 제방
  - 포위 망대
  - 포위 언덕
  lexicon: HALOT
  rationale: 히브리어의 공성용 흙둑·제방 개념을 반영하되, 현대 독자가 이해하기 쉬운 군사 용어로 옮겼습니다.
