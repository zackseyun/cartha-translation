base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/032.yaml
  text: 'Therefore thus says Yahweh concerning the king of Assyria: He shall not come into this city[a], or shoot an arrow there, or come before it with a shield[b], or cast up a siege ramp against it.'
  footnotes:
  - marker: a
    text: Or 'advance against it with a shield.' The Hebrew likely refers to approaching the city under shield protection in siege warfare.
    reason: lexical_alternative
  - marker: b
    text: Or 'heap up a siege mound against it.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 야훼께서 앗수르 왕에 관하여 이렇게 말씀하십니다. 그는 이 성에 들어오지 않을 것이며, 그곳에서 화살을 쏘지도 않을 것이며, 방패를 들고 그 성 앞으로 나아오지도[a] 않을 것이며, 그 성을 향하여 공성 제방을 쌓아 올리지도[b] 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘방패를 들고 그 성에 맞서 접근하다’로 옮길 수 있습니다. 히브리어는 공성전에서 방패의 보호 아래 성에 다가가는 동작을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘공성 둑을 쌓아 올리다’로 옮길 수 있습니다.
    reason: lexical_alternative
