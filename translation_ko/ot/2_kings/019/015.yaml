source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֨ל חִזְקִיָּ֜הוּ לִ/פְנֵ֣י יְהוָה֮ וַ/יֹּאמַר֒ יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ יֹשֵׁ֣ב הַ/כְּרֻבִ֔ים אַתָּה ה֤וּא הָֽ/אֱלֹהִים֙ לְ/בַדְּ/ךָ֔ לְ/כֹ֖ל מַמְלְכ֣וֹת הָ/אָ֑רֶץ אַתָּ֣ה עָשִׂ֔יתָ אֶת הַ/שָּׁמַ֖יִם וְ/אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/015.yaml
  text: And Hezekiah prayed before Yahweh and said[a], “Yahweh, God of Israel, enthroned above the cherubim, you alone are God over all the kingdoms of the earth. You made the heavens and the earth.”
  footnotes:
  - marker: a
    text: Or, “who sits enthroned over the cherubim”; the Hebrew literally says “sitting/dwelling [among/over] the cherubim,” a royal-cultic image of the LORD’s enthronement.
    reason: lexical_alternative
translation:
  language: ko
  text: 히스기야가 야훼 앞에서 기도하며 말했습니다[a]. “야훼, 이스라엘의 하나님, 그룹들 위에 좌정하시는 분이시여, 주님만이 땅의 모든 나라들 위에 하나님이십니다. 주님께서 하늘과 땅을 지으셨습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그룹들 위에 좌정하신 분”으로도 옮길 수 있습니다. 히브리어는 문자적으로 “그룹들 사이/위에 앉아 계신”이라는 왕적-성전 이미지를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  english_pob_choice: prayed
  chosen_korean: 기도하며
  alternatives_korean:
  - 기도했습니다
  - 간구했습니다
  lexicon: WLC
  rationale: 기본 의미는 ‘기도하다’이므로, 서술 흐름에 맞게 ‘기도하며’로 옮겨 ‘그리고 말했습니다’와 자연스럽게 연결했습니다.
- source_word: לִפְנֵי יְהוָה
  english_pob_choice: before Yahweh
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 야훼의 앞에서
  - 야훼의 임재 앞에서
  lexicon: WLC
  rationale: לִפְנֵי는 문자적으로 ‘앞에서/면전에’이므로, 기도가 하나님 앞에 드려진다는 관계적·공간적 감각을 살려 ‘앞에서’로 옮겼습니다.
- source_word: יֹשֵׁב הַכְּרֻבִים
  english_pob_choice: enthroned above the cherubim
  chosen_korean: 그룹들 위에 좌정하시는 분
  alternatives_korean:
  - 그룹들 위에 앉아 계시는 분
  - 그룹들 사이에 거하시는 분
  lexicon: WLC
  rationale: חושב/יֹשֵׁב는 단순한 ‘앉다’보다 왕적 좌정의 이미지를 담으므로 ‘좌정하시는 분’으로 옮겼습니다. ‘위에’는 언약궤 그룹들 위에 임하시는 통치 이미지를 반영합니다.
- source_word: אַתָּה הוּא הָאֱלֹהִים לְבַדְּךָ
  english_pob_choice: you alone are God
  chosen_korean: 주님만이 … 하나님이십니다
  alternatives_korean:
  - 주님만 하나님이십니다
  - 주님 홀로 하나님이십니다
  lexicon: WLC
  rationale: לְבַדְּךָ의 배타성을 한국어에서도 분명히 드러내기 위해 ‘주님만이’로 옮겼습니다. 경배 문맥이므로 존칭 호칭과 서술을 유지했습니다.
- source_word: עָשִׂיתָ אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  english_pob_choice: You made the heavens and the earth
  chosen_korean: 하늘과 땅을 지으셨습니다
  alternatives_korean:
  - 하늘과 땅을 만드셨습니다
  - 하늘들과 땅을 지으셨습니다
  lexicon: WLC
  rationale: 창조 행위의 종결성을 살리기 위해 ‘지으셨습니다’로 옮겼습니다. 한국어 성경에서 창조적 제작을 넓게 포괄할 수 있으나, 여기서는 자연스러운 창조 문맥을 고려해 이 동사를 택했습니다.
theological_decisions:
- issue: יהוה의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문의 신명은 대체 호칭이 아니라 고유명으로 제시되므로, 프로젝트 기본값에 따라 ‘야훼’로 보존했습니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
- issue: 왕적·성전적 묘사인 ‘그룹들 위에 좌정하시는 분’
  chosen_reading: 하나님의 통치를 나타내는 성전-왕정 이미지로 유지
  alternative_readings:
  - 단순한 공간 묘사로 완화
  - ‘그룹들 사이에 거하시는 분’으로 재구성
  rationale: 히브리어 표현은 단순 위치 정보가 아니라 야훼의 보좌-통치를 드러내는 관용구이므로, 그 신학적 긴장을 유지했습니다.
  doctrine_reference: 'Translation philosophy #3: Preserve theological tension rather than resolve it'
