  text: וְ/יֹֽשְׁבֵי/הֶן֙ קִצְרֵי יָ֔ד חַ֖תּוּ וַ/יֵּבֹ֑שׁוּ הָי֞וּ עֵ֤שֶׂב שָׂדֶה֙ וִ֣/ירַק דֶּ֔שֶׁא חֲצִ֣יר גַּגּ֔וֹת וּ/שְׁדֵפָ֖ה לִ/פְנֵ֥י קָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/026.yaml
  text: Therefore their inhabitants were short of strength[a]; they were dismayed and put to shame. They were like the grass of the field and green growth, like grass on the housetops[c][b], and scorched before it is grown.
  footnotes:
  - marker: a
    text: Hebrew literally, 'short of hand,' an idiom for lacking power or strength.
    reason: lexical_alternative
  - marker: b
    text: Or 'were dismayed' for 'were shattered.'
    reason: alternative_reading
  - marker: c
    text: Or 'blight before the standing grain' or 'scorched growth before it springs up.' The Hebrew of the final image is compact and agricultural.
    reason: lexical_alternative
translation:
  language: ko
  text: 그러므로 그들의 주민들은 힘이 없었고[a], 낙담하여[b] 수치를 당했습니다. 그들은 들의 풀과 푸른 초목과 같았고, 지붕 위의 풀과 같았으며, 아직 자라기도 전에 타 버린 곡식과 같았습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 문자적으로 '손이 짧다'는 관용구로, 힘이나 능력이 부족하다는 뜻입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 '꺾였습니다', '당황했습니다'. 히브리어 חַתּוּ는 꺾이거나 낙담하는 상태를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 '자라 선 곡식 앞의 마름병' 또는 '싹이 트기 전의 타 버린 초목'. 마지막 농업 이미지는 히브리어에서 매우 압축적으로 표현됩니다.
    reason: lexical_alternative
