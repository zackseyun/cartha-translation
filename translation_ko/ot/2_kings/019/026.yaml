  rationale: חַתּוּ는 단순한 감정이 아니라 꺾이고 주저앉는 상태를 포함하므로, 본문의 병렬성과 함께 심리적 붕괴를 드러내는 표현을 택했습니다.
- source_word: עֵשֶׂב שָׂדֶה וִירַק דֶּשֶׁא חֲצִיר גַּגּוֹת
  english_pob_choice: the grass of the field and green growth, like grass on the housetops
