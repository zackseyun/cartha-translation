  lexicon: HALOT
  rationale: 후반부는 압축된 농업 이미지이므로, '그을렸습니다'로 뜨거운 바람/작열로 인한 손상을 간결하게 살렸습니다.
theological_decisions:
- issue: 폐허가 된 공동체의 취약함을 묘사하는 시적 병렬
  chosen_reading: 원문의 세 개의 식물 이미지를 유지해, 사람들의 무력함과 급속한 소멸을 동시에 드러냈습니다.
  alternative_readings:
  - 식물 비유를 하나로 줄여 매끄럽게 처리하는 읽기
  - 의미를 풀어서 일반적 쇠퇴 표현으로 바꾸는 읽기
  rationale: 히브리어는 의도적으로 압축된 연속 비유를 사용하므로, 이를 평탄화하지 않고 시적 긴장을 유지하는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 시적 심판 묘사 보존
- issue: חַתּוּ의 뉘앙스
  chosen_reading: 단순한 '두려워했다'보다 꺾이고 당황한 상태를 함께 드러내는 '당황하며'를 사용했습니다.
  alternative_readings:
  - 두려워했습니다
  - 무너졌습니다
  - 수치스러워했습니다
  rationale: 이 동사는 감정만이 아니라 패배로 인한 동요와 붕괴를 내포하므로, 그 긴장을 약화시키지 않도록 번역했습니다.
  doctrine_reference: lexical tension preservation
