  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
  footnotes:
  - marker: a
    text: Or 'all the canals/Nile channels of Egypt.' The Hebrew term can refer specifically to Nile waterways.
