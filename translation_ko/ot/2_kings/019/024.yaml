translation:
  language: ko
  text: 나는 우물을 파고 타국의 물을 마셨으며, 내 발바닥으로 이집트의 모든 수로를 말려 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트의 모든 나일 수로를’. 히브리어 낱말은 나일과 관련된 수로 또는 운하를 가리킬 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가 스스로는
  alternatives_korean:
  - 나
  - 나 자신이
  lexicon: HALOT
  rationale: 강조된 1인칭 대명사의 자기를 내세우는 뉘앙스를 살리기 위해 ‘내가 스스로는’으로 옮겼습니다.
- source_word: קַרְתִּי
  english_pob_choice: have dug
  chosen_korean: 물을 길어 마셨으며
  alternatives_korean:
  - 팠으며
  - 우물을 팠으며
  lexicon: HALOT
  rationale: 이 문맥의 자랑스러운 진술에서 단순한 ‘팔다’보다, 파서 물을 얻어 마셨다는 결과를 드러내는 표현이 더 자연스럽고 원문의 함의를 잘 반영합니다.
- source_word: מַיִם זָרִים
  english_pob_choice: foreign waters
  chosen_korean: 물을
  alternatives_korean:
  - 낯선 물을
  - 이방의 물을
  lexicon: HALOT
  rationale: ‘foreign waters’의 핵심은 물의 출처가 타지라는 점인데, 한국어에서는 자연스러운 문맥상 이미 뒤의 이집트 전수와 결합되어 굳이 수식어를 늘리지 않고도 전달될 수 있습니다.
- source_word: יְאֹרֵי
  english_pob_choice: streams
  chosen_korean: 개천을
  alternatives_korean:
  - 시내를
  - 하천을
  - 나일 수로를
  lexicon: HALOT
  rationale: יְאֹר는 나일 관련 수로 또는 운하를 가리킬 수 있으므로, 본문에는 넓게 ‘개천’을 두고 지류적·수로적 느낌을 살리되, 더 구체적인 뉘앙스는 각주로 보완합니다.
