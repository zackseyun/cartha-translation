  text: אֲנִ֣י קַ֔רְתִּי וְ/שָׁתִ֖יתִי מַ֣יִם זָרִ֑ים וְ/אַחְרִב֙ בְּ/כַף פְּעָמַ֔/י כֹּ֖ל יְאֹרֵ֥י מָצֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/024.yaml
  text: I myself have dug and drunk foreign waters[a], and with the sole of my feet I dry up all the streams of Egypt.
  footnotes:
  - marker: a
    text: Or 'all the canals/Nile channels of Egypt.' The Hebrew term can refer specifically to Nile waterways.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 스스로는 물을 길어 마셨으며, 내 발바닥으로는 이집트의 모든 개천을 말려 버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이집트의 모든 운하/나일 수로를’. 히브리어는 나일 수로를 가리키는 뜻으로도 쓰일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  english_pob_choice: I myself
  chosen_korean: 내가 스스로는
  alternatives_korean:
  - 나
  - 나 자신이
  lexicon: HALOT
  rationale: 강조된 1인칭 대명사의 자기를 내세우는 뉘앙스를 살리기 위해 ‘내가 스스로는’으로 옮겼습니다.
- source_word: קַרְתִּי
  english_pob_choice: have dug
  chosen_korean: 물을 길어 마셨으며
  alternatives_korean:
  - 팠으며
  - 우물을 팠으며
  lexicon: HALOT
  rationale: 이 문맥의 자랑스러운 진술에서 단순한 ‘팔다’보다, 파서 물을 얻어 마셨다는 결과를 드러내는 표현이 더 자연스럽고 원문의 함의를 잘 반영합니다.
- source_word: מַיִם זָרִים
  english_pob_choice: foreign waters
  chosen_korean: 물을
  alternatives_korean:
  - 낯선 물을
  - 이방의 물을
  lexicon: HALOT
  rationale: ‘foreign waters’의 핵심은 물의 출처가 타지라는 점인데, 한국어에서는 자연스러운 문맥상 이미 뒤의 이집트 전수와 결합되어 굳이 수식어를 늘리지 않고도 전달될 수 있습니다.
- source_word: יְאֹרֵי
  english_pob_choice: streams
  chosen_korean: 개천을
  alternatives_korean:
  - 시내를
  - 하천을
  - 나일 수로를
  lexicon: HALOT
  rationale: יְאֹר는 나일 관련 수로 또는 운하를 가리킬 수 있으므로, 본문에는 넓게 ‘개천’을 두고 지류적·수로적 느낌을 살리되, 더 구체적인 뉘앙스는 각주로 보완합니다.
theological_decisions:
- issue: 이사야/열왕기의 앗수르 왕의 오만한 조롱 어조
  chosen_reading: 본문의 1인칭 자랑을 그대로 살리고, 화자가 앗수르 왕이라는 설명은 본문 밖에 두었습니다.
  alternative_readings:
  - 화자의 신분을 본문에 덧붙여 명시함
  - 과장된 군사 선전으로 완화하여 번역함
  rationale: 원문은 자만에 찬 왕의 과시를 압축적으로 제시하므로, 해설을 본문에 끼워 넣지 않고 공격적 어조 자체를 보존하는 것이 적절합니다.
  doctrine_reference: 'Translation philosophy: original-language primacy; preserve rhetorical force without interpretive smoothing.'
