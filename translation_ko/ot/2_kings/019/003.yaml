base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/003.yaml
  text: 'They said to him[a], “Thus says Hezekiah: This day is a day of distress, rebuke, and disgrace, for children have come to the point of birth[c][b], but there is no strength to give birth.”'
  footnotes:
  - marker: a
    text: 'Hebrew: ''children have come to the point of birth.'' The image is of labor reaching the moment of delivery, yet strength failing.'
    reason: cultural_note
  - marker: b
    text: Or 'children have come to the birthstool.' The Hebrew term מַשְׁבֵּר is difficult and may refer more concretely to the place or moment of delivery.
    reason: lexical_alternative
  - marker: c
    text: Or 'contempt' or 'scorn' for 'disgrace.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그들이 그에게 말했습니다. 「히스기야가 이렇게 말합니다. ‘이날은 고통과 책망과 수치의 날입니다. 아이들이 해산할 자리에 이르렀으나, 낳을 힘이 없습니다.’」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어의 מַשְׁבֵּר는 출산의 ‘자리’ 또는 ‘순간’을 가리키는 난해한 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘출산대에 이르렀으나’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘수치’보다 ‘멸시’나 ‘경멸’의 뉘앙스로 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  english_pob_choice: Thus says
  chosen_korean: 이렇게 말합니다
  alternatives_korean:
  - 이같이 말씀하십니다
  - 주께서 이렇게 말씀하십니다
  lexicon: HALOT
  rationale: 왕의 전달문 안에서 예언 공식의 현재적 효력을 살리되, 현대 한국어에서는 굳은 문투보다 자연스러운 현재형 공문식 표현이 적합합니다.
- source_word: יוֹם צָרָה וְתוֹכֵחָה וּנְאָצָה
  english_pob_choice: a day of distress, rebuke, and disgrace
  chosen_korean: 고통과 책망과 수치의 날
  alternatives_korean:
  - 환난과 책망과 치욕의 날
  - 고난과 꾸짖음과 수치의 날
  lexicon: HALOT
  rationale: צָרָה는 압박 아래의 고통/환난을, תוֹכֵחָה는 책망을, נְאָצָה는 공개적 모욕과 수치를 가리키므로, POB의 삼중 구조를 유지하면서도 한국어에서 가장 직접적으로 전달되는 어휘를 골랐습니다.
- source_word: בָאוּ בָנִים עַד מַשְׁבֵּר
  english_pob_choice: children have come to the point of birth
  chosen_korean: 아이들이 해산할 자리에 이르렀으나
  alternatives_korean:
  - 아이들이 해산의 순간에 이르렀으나
  - 아이들이 출산대에 이르렀으나
  lexicon: HALOT
  rationale: מַשְׁבֵּר의 난해함을 살리기 위해 문자적 대응을 과도하게 좇기보다, 출산이 임박했으나 아직 끝나지 않은 상황을 한국어로 분명히 드러냈습니다.
- source_word: וְכֹחַ אַיִן לְלֵדָה
  english_pob_choice: but there is no strength to give birth
  chosen_korean: 낳을 힘이 없습니다
  alternatives_korean:
  - 해산할 힘이 없습니다
  - 출산할 힘이 없습니다
  lexicon: HALOT
  rationale: לֵדָה의 출산 행위를 자연스러운 동사구로 옮겨, 비유의 절정인 ‘힘이 다함’의 긴박성을 살렸습니다.
theological_decisions:
- issue: 출산 비유의 전달 방식
  chosen_reading: 국가적 위기를 임신과 분만의 절정에 비유한 직설적 이미지로 옮겼습니다.
  alternative_readings:
  - ‘출산대’처럼 더 구체적인 물건/장소를 암시하는 번역
  - 비유를 풀어 설명하는 해석적 번역
  rationale: 본문은 위기가 임박했으나 해결 능력이 고갈된 상태를 비유로 제시하므로, 과도한 해설 없이 독자가 긴장감을 즉시 느끼도록 했습니다.
  doctrine_reference: 본문 해석 원칙; 비유 전달의 충실성
