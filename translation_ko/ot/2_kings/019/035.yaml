  lexicon: HALOT
  rationale: נכה의 군사·심판 맥락에서 단순한 ‘치다’보다 치명적 결과를 드러내는 표현을 택했습니다.
- source_word: פְּגָרִים מֵתִים
  english_pob_choice: dead bodies
  chosen_korean: 죽은 시체들
