  terminology: ‘야훼의 천사’와 ‘앗시리아’는 프로젝트의 표기 및 원문 의미에 부합합니다. ‘쳐 죽였습니다’는 군사적 심판 맥락에서 נכה의 치명적 결과를 적절히 나타냅니다.
