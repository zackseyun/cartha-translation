base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/035.yaml
  text: And that night the angel of Yahweh went out and struck down one hundred eighty-five thousand in the camp of Assyria. When people rose early in the morning, behold, all of them were dead bodies.
  footnotes:
  - marker: a
    text: Or, more literally, 'And they rose early in the morning.' The Hebrew leaves the subject indefinite.
    reason: lexical_alternative
  - marker: b
    text: 'Hebrew: ''corpses, dead''—an emphatic expression for the slain.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그 밤에 야훼의 천사가 나가서 앗시리아 진영에서 십팔만 오천 명을 쳐 죽였습니다. 그들이 아침 일찍 일어나 보니, 보라, 그들 모두가 죽은 시체들이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어는 주어를 명시하지 않아, 더 문자적으로는 ‘그들이 아침 일찍 일어났습니다’라고 할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 히브리어는 ‘시체들, 죽은 자들’이라는 강조적 표현을 씁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  english_pob_choice: And that night
  chosen_korean: 그 밤에
  alternatives_korean:
