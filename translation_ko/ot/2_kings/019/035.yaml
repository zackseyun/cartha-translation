  - 야훼의 사자
  lexicon: HALOT
  rationale: 직역 가능한 신적 존재 표현을 유지하면서, 본 프로젝트의 יְהוָה 기본어인 ‘야훼’를 반영했습니다.
- source_word: וַיַּךְ
