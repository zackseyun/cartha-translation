  edition: WLC
  text: כֹּ֣ה תֹאמְר֗וּ/ן אֶל חִזְקִיָּ֤הוּ מֶֽלֶךְ יְהוּדָה֙ לֵ/אמֹ֔ר אַל יַשִּׁאֲ/ךָ֣ אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בּ֖/וֹ לֵ/אמֹ֑ר לֹ֤א תִנָּתֵן֙ יְר֣וּשָׁלִַ֔ם בְּ/יַ֖ד מֶ֥לֶךְ אַשּֽׁוּר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/010.yaml
  text: 'Thus you shall say to Hezekiah king of Judah: ‘Do not let your God[a], in whom you trust, deceive you, saying, “Jerusalem will not be given into the hand of the king of Assyria.”’'
  footnotes:
  - marker: a
    text: Or “your god”; Hebrew capitalization is not marked, and the Assyrian speaker is mocking Hezekiah’s trust.
    reason: lexical_alternative
translation:
  language: ko
  text: “히스기야 유다 왕에게 이렇게 말하십시오. ‘너희가 신뢰하는 너희 하나님이 너희를 속여서, “예루살렘은 앗수르 왕의 손에 넘겨지지 않을 것이다”라고 말하게 하지 마십시오.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너희 신”; 히브리어는 대소문자를 표시하지 않으며, 앗수르 사자는 히스기야의 신뢰를 조롱하고 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה תֹאמְרוּן
  english_pob_choice: Thus you shall say
  chosen_korean: 이렇게 말하십시오
  alternatives_korean:
  - 이와 같이 말하십시오
  - 그렇게 말하십시오
  lexicon: HALOT
  rationale: 사절단에게 주어지는 공식적 전달 명령을 한국어 공손 명령형으로 자연스럽게 옮기되, 본문의 메시지 전달 공식성을 유지했습니다.
- source_word: אַל יַשִּׁאֲךָ
  english_pob_choice: Do not let ... deceive you
  chosen_korean: 너희를 속여서 … 하지 마십시오
  alternatives_korean:
  - 속이지 못하게 하십시오
  - 속여서 믿게 하지 마십시오
  lexicon: HALOT
  rationale: נשא의 사역적 의미를 따라 ‘속이다’로 옮겼고, 히브리어의 인과적 연결을 한국어의 ‘-해서’로 반영했습니다. 주어가 ‘너희 하나님’인 도발적 어조도 그대로 살렸습니다.
- source_word: אֱלֹהֶיךָ
  english_pob_choice: your God
  chosen_korean: 너희 하나님
  alternatives_korean:
  - 당신의 하나님
  - 네 하나님
  lexicon: HALOT
  rationale: 히스기야를 향한 복수형 메시지 전달 문맥을 반영해 ‘너희’로 옮겼습니다. 또한 앗수르 사자의 조롱조를 드러내기 위해 문맥상 존칭 완화는 피했습니다.
- source_word: בֹּטֵחַ בּוֹ
  english_pob_choice: in whom you trust
  chosen_korean: 너희가 신뢰하는
  alternatives_korean:
  - 너희가 의지하는
  - 너희가 믿는
  lexicon: HALOT
  rationale: בטח의 신뢰·의지 의미를 표준적 현대 한국어 ‘신뢰하다’로 옮겨, 인격적 의존 관계를 분명히 했습니다.
- source_word: בְּיַד
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 권세 아래
  - 지배 아래
  lexicon: HALOT
  rationale: 히브리어 관용구를 직역해 ‘손에’로 유지함으로써, 넘겨짐과 포획의 이미지를 보존했습니다.
theological_decisions:
- issue: אֱלֹהֶיךָ의 번역에서 조롱의 뉘앙스 처리
  chosen_reading: 너희 하나님
  alternative_readings:
  - 너희 신
  - 너의 하나님
  rationale: 본문의 발화자는 야훼를 믿는 히스기야를 조롱하지만, 히브리어 자체는 대소문자를 구분하지 않으므로 본문에는 표준 신칭 ‘하나님’을 유지하되, 비웃는 말투는 문맥과 어순으로 드러냈습니다.
  doctrine_reference: 문맥상 화자의 비아냥을 보존하면서도 본문 표준 신칭을 유지하는 번역 원칙
