  naturalness: ‘당신이 의지하는 당신의 하나님’은 왕에게 전달할 적대적 메시지 안에서 현대 한국어로 이해 가능하며, 합쇼체 명령문 ‘말하십시오/못하게 하십시오’와도 조화됩니다. ‘말하여 당신을 속이다’로 연결하면 인용문의 기능이 자연스럽고 명료해집니다.
  terminology: 히스기야, 유다 왕, 예루살렘, 앗수르 왕 및 ‘하나님’은 표준 표기와 용례에 맞습니다. 각주 대안은 한국어에서는 대소문자 문제가 아니라 ‘하나님/신’의 호칭 선택 문제이므로 그에 맞추어 설명을 고쳤습니다.
