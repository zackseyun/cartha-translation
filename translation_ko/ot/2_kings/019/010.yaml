- from: “히스기야 유다 왕에게 이렇게 말하십시오. ‘너희가 신뢰하는 너희 하나님이 너희를 속여서, “예루살렘은 앗수르 왕의 손에 넘겨지지 않을 것이다”라고 말하게 하지 마십시오.’”[a]
