base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/016.yaml
  text: Incline your ear[a], O Yahweh, and hear; open your eyes, O Yahweh, and see; and hear the words of Sennacherib, which he has sent to reproach the living God.
  footnotes:
  - marker: a
    text: Or "to defy the living God"; the Hebrew verb can carry the sense of taunting, reviling, or defying.
    reason: lexical_alternative
translation:
  language: ko
  text: 야훼여, 귀를 기울여 들으시고 눈을 떠서 보십시오. 산헤립이 보내어 살아 계신 하나님을 모독한 그 말들을 들으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “살아 계신 하나님을 조롱하려고”; 히브리어 동사는 조롱, 비방, 모독, 도전의 뜻을 모두 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본문의 고유한 신명사 טטר그램마톤을 직역 관습 대신 음역으로 살려, 하나님의 언약 이름이라는 점을 드러냈습니다.
- source_word: הַטֵּה ... אָזְנְךָ
  english_pob_choice: Incline your ear
  chosen_korean: 귀를 기울여
  alternatives_korean:
  - 귀를 기울이십시오
  - 귀를 굽혀
  lexicon: HALOT
  rationale: ‘귀를 기울이다’가 히브리어 관용구의 청원적·예배적 어조를 자연스럽게 전달합니다.
- source_word: פְּקַח ... עֵינֶיךָ
  english_pob_choice: open your eyes
  chosen_korean: 눈을 떠서 보십시오
  alternatives_korean:
  - 눈을 여시고 보십시오
  - 눈을 뜨십시오
  lexicon: HALOT
  rationale: ‘눈을 떠서 보십시오’는 단순한 개안이 아니라 보아 달라는 청원의 병렬성을 살립니다.
- source_word: לְחָרֵף
  english_pob_choice: to reproach
  chosen_korean: 모독한
  alternatives_korean:
  - 비방한
  - 조롱한
  - 꾸짖은
  lexicon: HALOT
  rationale: 여기서는 하나님께 대한 모독·조롱의 의미가 핵심이므로, 한국어로는 그 행위의 신학적 무게가 드러나는 ‘모독하다’를 택했습니다.
theological_decisions:
- issue: “the living God”의 번역
  chosen_reading: 살아 계신 하나님
  alternative_readings:
  - 생존하신 하나님
  - 살아 있는 하나님
  rationale: 성경적 관용구를 따라 하나님이 우상과 달리 실제로 살아 역사하시는 분이라는 대비를 분명히 했습니다.
  doctrine_reference: 시 42:2; 수 3:10의 표현 관습
- issue: 산헤립의 발화에 대한 청원형 동사의 높임
  chosen_reading: 들으시고 ... 보십시오 ... 들으십시오
  alternative_readings:
  - 들어 주시고 ... 보아 주십시오
  rationale: 기도문이므로 하나님께 직접 드리는 청원의 존댓말을 유지하되, 히브리어 병렬 명령문의 힘을 약화시키지 않도록 했습니다.
  doctrine_reference: 기도문 형식과 경어 일관성
