translation:
  language: ko
  text: 야훼여, 귀를 기울여 들으시고, 눈을 여시고 보십시오. 산헤립이 살아 계신 하나님을 모독하려고 보낸 말들을 들으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “살아 계신 하나님을 조롱하려고.” 히브리어 동사는 조롱하다, 비방하다, 모독하다, 도전하다의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
