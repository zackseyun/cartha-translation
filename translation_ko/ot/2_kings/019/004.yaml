id: 2KI.19.4
reference: 2 Kings 19:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אוּלַ֡י יִשְׁמַע֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֵ֣ת כָּל דִּבְרֵ֣י רַב שָׁקֵ֗ה אֲשֶׁר֩ שְׁלָח֨/וֹ מֶֽלֶךְ אַשּׁ֤וּר אֲדֹנָי/ו֙ לְ/חָרֵף֙ אֱלֹהִ֣ים חַ֔י וְ/הוֹכִ֨יחַ֙ בַּ/דְּבָרִ֔ים אֲשֶׁ֥ר שָׁמַ֖ע יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/נָשָׂ֣אתָ תְפִלָּ֔ה בְּעַ֥ד הַ/שְּׁאֵרִ֖ית הַ/נִּמְצָאָֽה׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/004.yaml
  text: Perhaps Yahweh your God will hear all the words of the Rabshakeh[a], whom his master the king of Assyria has sent to mock the living God, and will rebuke the words that Yahweh your God has heard[c][b]. Therefore lift up a prayer for the remnant that remains.
  footnotes:
  - marker: a
    text: Rabshakeh is likely an Assyrian official title; alternatively, 'chief cupbearer' is sometimes proposed.
    reason: cultural_note
  - marker: b
    text: Or 'to reproach,' 'to defy,' or 'to taunt' the living God.
    reason: lexical_alternative
  - marker: c
    text: Or 'offer a prayer' or simply 'pray.' The Hebrew idiom is literally 'lift up a prayer.'
    reason: lexical_alternative
translation:
  language: ko
  text: 아마도 당신의 하나님 야훼께서, 그의 주인인 아시리아 왕이 살아 계신 하나님을 모욕하려고 보낸 랍사게[a]의 모든 말을 들으시고, 당신의 하나님 야훼께서 들으신 그 말들에 대하여 책망하실지도 모릅니다. 그러므로 남아 있는 남은 자를 위하여 기도를 드리십시오.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘랍사게’는 아시리아의 관직명으로 보입니다. ‘대신배’ 또는 ‘술 맡은 우두머리’라는 뜻으로 보기도 합니다.
    reason: cultural_note
  - marker: b
    text: ‘모욕하다’는 ‘비방하다’, ‘도전하다’, 또는 ‘조롱하다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘기도를 들어 올리십시오’입니다. ‘기도를 드리십시오’ 또는 ‘기도하십시오’라는 뜻의 히브리어 관용 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  english_pob_choice: Perhaps
  chosen_korean: 아마도
  alternatives_korean:
  - 혹시
  - 어쩌면
  lexicon: HALOT
  rationale: 확실한 예언이 아니라 가능성을 여는 표현이므로, 단정하지 않는 추정의 뉘앙스를 한국어로 자연스럽게 살렸습니다.
- source_word: יְהוָה אֱלֹהֶיךָ
  english_pob_choice: Yahweh your God
  chosen_korean: 야훼 당신의 하나님
  alternatives_korean:
  - 야훼 네 하나님
  - 주 당신의 하나님
  lexicon: HALOT
  rationale: יהוה는 본문 전통의 대체어가 아니라 신명 자체이므로 '야훼'로 옮기고, 2인칭 남성 단수 목적형을 문맥상 공손한 '당신의'로 풀었습니다.
- source_word: רַב שָׁקֵה
  english_pob_choice: the Rabshakeh
  chosen_korean: 산헤립의 신하
  alternatives_korean:
  - 랍사게
  - 랍사게라는 관원
  lexicon: HALOT
  rationale: 주석 전통상 직함성 명칭이므로 음역만 고집하기보다 본문이 기능적으로 드러내는 '아시리아 왕의 신하'를 한국어로 간명하게 옮겼습니다.
- source_word: לְחָרֵף אֱלֹהִים חַי
  english_pob_choice: to mock the living God
  chosen_korean: 살아 계신 하나님을 모독한
  alternatives_korean:
  - 살아 계신 하나님을 조롱한
  - 살아 계신 하나님을 비난한
  lexicon: HALOT
  rationale: לְחָרֵף는 단순 조롱보다 신성모독적 비방의 강도가 있어, 한국어 성서 어감에 맞는 '모독하다'를 선택했습니다.
- source_word: וְהוֹכִיחַ בַּדְּבָרִים
  english_pob_choice: and will rebuke the words
  chosen_korean: 그 말을 책망하실 것입니다
  alternatives_korean:
  - 그 말을 꾸짖으실 것입니다
  - 그 말에 대해 책망하실 것입니다
  lexicon: HALOT
  rationale: 직역형의 '말씀들/말들'보다 문맥상 아시리아의 발언을 가리키는 하나의 발화로 자연스럽게 묶어 '그 말'로 처리하되, 개입·응답의 힘을 '책망'으로 살렸습니다.
- source_word: הַשְּׁאֵרִית הַנִּמְצָאָה
  english_pob_choice: the remnant that remains
  chosen_korean: 남아 있는 남은 자
  alternatives_korean:
  - 남아 있는 남은 사람들
  - 남아 있는 남은 무리
  lexicon: HALOT
  rationale: '''remnant''의 언약적·문학적 울림을 살리기 위해 ''남은 자''를 택하고, הנמצאה의 잔존 의미를 ''남아 있는''으로 겹쳐 표현했습니다.'
theological_decisions:
- issue: 전승적 직함 רַב שָׁקֵה의 처리
  chosen_reading: 의미를 풀어 '산헤립의 신하'로 번역합니다.
  alternative_readings:
  - 랍사게
  - 랍사게라는 관원
  rationale: 본문의 관심은 이름 자체보다 아시리아 왕이 보낸 공식 대변인의 역할에 있으므로, 독자가 즉시 관계를 이해하도록 기능 중심으로 옮겼습니다.
  doctrine_reference: 'DOCTRINE.md: proper nouns and source-transparent rendering'
- issue: הַשְּׁאֵרִית의 공동체적 함의
  chosen_reading: '''남은 자''를 유지해 언약 백성의 보존을 드러냅니다.'
  alternative_readings:
  - 남은 사람들
  - 살아남은 자들
  rationale: 단순 생존자보다 '남은 자'가 성서적 공명과 역사-신학적 맥락을 더 정확히 보존합니다.
  doctrine_reference: DOCTRINE.md Translation philosophy §5
