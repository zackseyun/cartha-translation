id: 2KI.19.21
reference: 2 Kings 19:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה עָלָ֑י/ו בָּזָ֨ה לְ/ךָ֜ לָעֲגָ֣ה לְ/ךָ֗ בְּתוּלַת֙ בַּת צִיּ֔וֹן אַחֲרֶ֨י/ךָ֙ רֹ֣אשׁ הֵנִ֔יעָה בַּ֖ת יְרוּשָׁלִָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/021.yaml
  text: 'This is the word that Yahweh has spoken concerning him: ‘Virgin Daughter Zion despises you[a]; she mocks you[b]. Daughter Jerusalem shakes her head behind you.’'
  footnotes:
  - marker: a
    text: Or, 'the virgin daughter of Zion despises you; she derides you.'
    reason: lexical_alternative
  - marker: b
    text: '''Shakes her head'' is an idiom of scorn or mockery.'
    reason: cultural_note
translation:
  language: ko
  text: 이것은 야훼께서 그에 관하여 하신 말씀입니다. 「시온의 처녀 딸이 너를 업신여기고[a], 너를 조롱합니다[b]. 예루살렘의 딸이 네 뒤에서 머리를 흔듭니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 처녀 딸이 너를 업신여긴다; 너를 조롱한다.’
    reason: alternative_reading
  - marker: b
    text: ‘머리를 흔듭니다’는 경멸이나 조롱을 나타내는 관용구입니다.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: DOCTRINE.md contested terms / 표준 transliteration
  rationale: 본문의 신명은 언약적 고유명으로 처리해 ‘야훼’로 옮겼습니다. ‘주님’은 호칭으로 바뀌어 원문의 고유명 효과가 약해집니다.
- source_word: דָּבָר ... דִּבֶּר
  english_pob_choice: the word ... has spoken
  chosen_korean: 말씀
  alternatives_korean:
  - 말
  - 전언
  - 선언
  lexicon: HALOT
  rationale: 예언 서두의 정형 표현으로서 ‘말씀’이 원문의 격식과 신적 발화의 무게를 가장 잘 살립니다.
- source_word: בָּזָה / לָעֲגָה
  english_pob_choice: despises / mocks
  chosen_korean: 업신여기고 / 조롱합니다
  alternatives_korean:
  - 멸시하고 / 비웃습니다
  - 경멸하고 / 조롱합니다
  lexicon: HALOT
  rationale: 두 동사는 모두 조소와 경멸의 뉘앙스를 가지므로, ‘업신여기고’와 ‘조롱합니다’로 서로 구분되면서도 현대 한국어에서 자연스럽게 살렸습니다.
- source_word: בְּתוּלַת בַּת צִיּוֹן / בַּת יְרוּשָׁלִָם
  english_pob_choice: Virgin Daughter Zion / Daughter Jerusalem
  chosen_korean: 시온의 처녀 딸 / 예루살렘의 딸
  alternatives_korean:
  - 처녀 딸 시온 / 예루살렘 딸
  - 시온 처녀 딸 / 예루살렘 딸
  lexicon: HALOT
  rationale: 도시를 의인화한 호칭이므로 소유격 구조를 유지해 ‘시온의 처녀 딸’, ‘예루살렘의 딸’로 옮겼습니다. ‘처녀’는 원문 이미지의 일부라 완화하지 않았습니다.
- source_word: אַחֲרֶיךָ רֹאשׁ הֵנִיעָה
  english_pob_choice: shakes her head behind you
  chosen_korean: 네 뒤에서 머리를 흔듭니다
  alternatives_korean:
  - 네 뒤에서 고개를 흔듭니다
  - 너를 뒤로 하고 머리를 흔듭니다
  lexicon: HALOT
  rationale: ‘머리를 흔들다’는 경멸의 관용구이므로 직역보다 관용을 살려 전달했습니다. ‘뒤에서’는 원문의 공간적 방향성을 보존합니다.
theological_decisions:
- issue: 예언적 조롱 발화의 직접화법 처리
  chosen_reading: 인용부호 안에서 시온과 예루살렘을 의인화된 화자로 두고, ‘업신여기고/조롱합니다’처럼 현재형으로 옮겼습니다.
  alternative_readings:
  - 과거형으로 평서화
  - 간접화법으로 완화
  rationale: 원문은 조롱의 현장감을 가진 직접 인용이므로, 한국어도 그 수사적 긴장을 유지하는 편이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 시적·예언적 직접화법 보존 원칙
- issue: ‘야훼’ 표기 사용
  chosen_reading: 전통 교회어 ‘여호와’ 대신 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 본문이 יְהוָה를 직접 사용하므로, 신명 자체를 드러내는 표기를 택하는 것이 원문과의 대응성을 높입니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → Yahweh'
