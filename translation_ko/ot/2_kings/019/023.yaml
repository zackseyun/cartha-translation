base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/023.yaml
  text: By the hand of your messengers you have mocked the Lord[a], and you have said, ‘With my many chariots I myself have gone up to the heights of the mountains, to the remotest parts of Lebanon; and I will cut down its tall cedars, its choicest cypresses, and I will enter its farthest lodging place, its forest garden.’
  footnotes:
  - marker: a
    text: Or 'its finest firs'; the Hebrew term for this tree species is not fully certain.
    reason: lexical_alternative
translation:
  language: ko
  text: 당신의 사자들을 통해 당신은 주님을 모독하였고, 이렇게 말하였습니다. “내가 많은 병거를 거느리고 나 스스로 산들의 높은 곳, 레바논의 가장 먼 곳까지 올라갔으며, 그 높은 백향목들과 그 가장 좋은 전나무들을 베어 내고, 그 가장 먼 숙소, 곧 그의 숲 정원에 들어가겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 브로르(bərōš)의 나무 이름은 확정되지 않으며, 전통적으로 ‘전나무’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד מַלְאָכֶיךָ
  english_pob_choice: By the hand of your messengers
  chosen_korean: 당신의 사자들을 통해
  alternatives_korean:
  - 당신의 사자들의 손으로
  - 당신의 사자들을 손에 들어
  lexicon: HALOT
  rationale: בְּיַד의 매개·도구 용법을 한국어에서 자연스럽게 풀어 옮겼습니다. מַלְאָךְ는 이 문맥에서 ‘천사’보다 정치·군사적 ‘사자’가 맞습니다.
- source_word: חֵרַפְתָּ
  english_pob_choice: have mocked
  chosen_korean: 모독하였고
  alternatives_korean:
  - 조롱하였고
  - 비웃었고
  - 능욕하였고
  lexicon: HALOT
  rationale: חרף는 단순한 농담이 아니라 상대를 모욕하고 깎아내리는 공격적 조롱을 뜻하므로, 문맥의 대담한 신성모독성을 드러내는 ‘모독하다’를 택했습니다.
- source_word: אֲדֹנָי
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주 하나님
  lexicon: HALOT
  rationale: 본문은 יהוה가 아니라 אֲדֹנָי이므로, 본문 표지에 맞춰 ‘주님’으로 옮겼습니다. 한국어에서는 예배적 직접칭을 살리되 야훼 표기로 바꾸지 않았습니다.
- source_word: בְּרֹב רִכְבִּי
  english_pob_choice: With my many chariots
  chosen_korean: 많은 병거를 거느리고
  alternatives_korean:
  - 내 많은 병거와 함께
  - 병거의 무리와 함께
  lexicon: HALOT
  rationale: רֹב은 수적 다수를, רִכְבִּי는 화자의 군사력을 가리키므로 ‘많은 병거를 거느리고’로 자연스럽게 보였습니다. 자랑조의 힘 과시를 살리기 위한 선택입니다.
- source_word: מִבְחוֹר בְּרֹשָׁיו
  english_pob_choice: its choicest cypresses
  chosen_korean: 그 가장 좋은 전나무들
  alternatives_korean:
  - 그 가장 좋은 측백나무들
  - 그 선택된 잣나무들
  lexicon: HALOT
  rationale: בְּרוֹשׁ의 수종은 확정적이지 않으므로, 영어 POB가 남긴 ‘fir’의 대안 가능성을 반영해 한국어도 전통적으로 널리 통하는 ‘전나무들’을 채택했습니다. ‘가장 좋은’은 מִבְחוֹר의 선택·최상 의미를 살립니다.
- source_word: יַעַר כַּרְמִלּוֹ
  english_pob_choice: its forest garden
  chosen_korean: 그의 숲 정원
  alternatives_korean:
  - 그의 숲과 같은 정원
  - 그의 비옥한 숲
  lexicon: HALOT
  rationale: כַּרְמִל은 단순한 숲이 아니라 비옥함·정원 같은 풍요를 내포하므로, ‘숲 정원’으로 두 이미지를 함께 보존했습니다. 소유격과 병렬성을 살리기 위해 ‘그의’로 옮겼습니다.
theological_decisions:
- issue: אֲדֹנָי와 YHWH의 구별
  chosen_reading: 본문의 אֲדֹנָי를 ‘주님’으로 옮기고, 야훼 표기는 사용하지 않았습니다.
  alternative_readings:
  - ‘주 하나님’
  - ‘여호와’
  rationale: 원어가 야훼의 사두문자형이 아니라 אֲדֹנָי이므로, 원문 구별을 지우지 않기 위해 별도 관습 표기 대신 직접 대응어를 사용했습니다.
  doctrine_reference: 'DOCTRINE.md: Translation philosophy #1; contested terms table for יהוה'
