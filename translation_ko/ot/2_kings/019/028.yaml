  lexicon: HALOT
  rationale: 원문의 원인절과 적대적 분노를 자연스러운 현대 한국어로 옮기되, 지나친 해석어를 피했습니다.
- source_word: וְשַׁאֲנַנְךָ
  english_pob_choice: your complacency
  chosen_korean: 네 교만함
  alternatives_korean:
  - 네 안일함
  - 네 자만함
  - 네 안락함
  lexicon: HALOT
  rationale: 문맥상 단순한 평안이 아니라 하나님을 향한 오만한 자기확신이므로, 한국어에서는 그 함의를 살려 ‘교만함’으로 옮겼습니다. POB의 본문 의미와 긴장을 유지합니다.
- source_word: עָלָה בְאָזְנָי
  english_pob_choice: have come up into my ears
  chosen_korean: 내 귀에 들렸으므로
  alternatives_korean:
  - 내 귀에 올라왔으므로
  - 내 귀에 들어왔으므로
  lexicon: HALOT
  rationale: 히브리어의 생생한 관용구를 직역하되, 한국어에서는 ‘들리다’가 가장 자연스럽고 원문의 청각 이미지를 충분히 보존합니다.
- source_word: חַחִי / מִתְגִּי
  english_pob_choice: my hook / my bit
  chosen_korean: 내 갈고리 / 내 재갈
  alternatives_korean:
  - 내 고리 / 내 재갈
  - 내 갈고리 / 내 굴레
  lexicon: HALOT
  rationale: 가축이나 포로를 제어하는 도구의 상징을 살려, 한국어 성서어휘로 널리 이해되는 ‘갈고리’와 ‘재갈’을 사용했습니다.
- source_word: בְּאַפֶּךָ / בִּשְׂפָתֶיךָ
  english_pob_choice: in your nose / in your lips
  chosen_korean: 네 코에, 내 재갈을 네 입술에
  alternatives_korean:
  - 네 콧구멍에, 내 재갈을 네 입에
  - 네 코에, 내 굴레를 네 입술에
  lexicon: HALOT
  rationale: 히브리어의 신체적 이미지와 평행 구조를 유지했습니다. ‘코’와 ‘입술’은 직설적이지만, 굴복과 굴욕의 표상을 선명하게 드러냅니다.
- source_word: וַהֲשִׁבֹתִיךָ בַּדֶּרֶךְ אֲשֶׁר בָּאתָ בָּהּ
  english_pob_choice: I will turn you back by the way by which you came
  chosen_korean: 네가 온 길로 너를 돌려보내겠습니다
  alternatives_korean:
  - 네가 왔던 길로 너를 되돌리겠습니다
  - 네가 온 길을 따라 너를 다시 보내겠습니다
  lexicon: HALOT
  rationale: 사역형 שוב의 의미를 ‘돌려보내다’로 간결하게 살려, 원문의 심판 선언과 귀환의 방향성을 분명히 했습니다.
theological_decisions:
- issue: 신적 의인화와 폭력적 제압 이미지 보존
  chosen_reading: 하나님이 ‘귀에 들렸다’, ‘내 갈고리’, ‘내 재갈’이라고 말하는 신체적·제어 이미지 자체를 유지했습니다.
  alternative_readings:
  - ‘나는 들었다’로 평탄화
  - ‘나는 너를 통제하겠다’로 추상화
  rationale: 본문은 앗수르 왕의 교만을 공개적으로 꺾는 예언적 조롱의 형식이므로, 이미지를 완화하면 심판의 수사적 힘이 약해집니다.
  doctrine_reference: Translation philosophy §1, §3, §6
- issue: שַׁאֲנַנְךָ의 평가적 뉘앙스
  chosen_reading: 본문에는 ‘교만함’을 본문 의미로 두어, 안일함이 아니라 책임 있는 오만의 뉘앙스를 드러냈습니다.
  alternative_readings:
  - 안일함
  - 자만함
  - 평온함
  rationale: 히브리어 기본 의미는 ‘안온함/안일함’이지만, 이 대적 문맥에서는 정죄적 의미가 강합니다. 한국어에서 그 평가를 가장 직접적으로 드러내는 표현을 택했습니다.
  doctrine_reference: Translation philosophy §1, §5
