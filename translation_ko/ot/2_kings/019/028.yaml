base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/028.yaml
  text: Because your raging against me and your complacency have come up into my ears[a], I will put my hook in your nose and my bit in your lips, and I will turn you back by the way by which you came.
  footnotes:
  - marker: a
    text: Or 'your arrogance' or 'your self-confidence.' The Hebrew term denotes ease or self-assured security, here in a hostile context.
    reason: lexical_alternative
translation:
  language: ko
  text: 네가 내게 분노하고 네 교만함이 내 귀에 들렸으므로, 내가 내 갈고리를 네 코에, 내 재갈을 네 입술에 두고, 네가 온 길로 너를 돌려보내겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 안일함’, ‘네 자만심’. 히브리어는 본래 평온하거나 자기확신에 찬 상태를 가리키며, 여기서는 적대적 문맥 속에서 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַן / הִתְרַגֶּזְךָ אֵלַי
  english_pob_choice: Because your raging against me
  chosen_korean: 네가 내게 분노하고
  alternatives_korean:
