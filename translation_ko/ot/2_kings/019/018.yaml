  text: וְ/נָתְנ֥וּ אֶת אֱלֹהֵי/הֶ֖ם בָּ/אֵ֑שׁ כִּי֩ לֹ֨א אֱלֹהִ֜ים הֵ֗מָּה כִּ֣י אִם מַעֲשֵׂ֧ה יְדֵֽי אָדָ֛ם עֵ֥ץ וָ/אֶ֖בֶן וַֽ/יְאַבְּדֽוּ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/018.yaml
  text: and they have cast their gods into the fire[a], for they were not gods, but the work of human hands, wood and stone; therefore they destroyed them.
  footnotes:
  - marker: a
    text: Or 'they put their gods in the fire.' The Hebrew verb is literally 'gave/put,' used here in the sense of casting something into the fire.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들은 자기들의 신들을 불에 던졌습니다[a]. 그것들이 신들이 아니라 사람의 손으로 만든 것, 곧 나무와 돌일 뿐이었기 때문입니다. 그래서 그들은 그것들을 없애 버렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 신들을 불에 넣었습니다.’ 히브리어 동사는 문자적으로는 ‘주다/두다’이며, 여기서는 불에 던져 넣는 뜻으로 쓰였습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  english_pob_choice: they have cast
  chosen_korean: 불에 던졌습니다
  alternatives_korean:
  - 불 속에 넣었습니다
  - 불에 던져 넣었습니다
  - 불에 넣었습니다
  lexicon: HALOT
  rationale: נתן은 문자적으로는 ‘주다/두다’이지만, ‘불’과 결합한 관용에서는 파괴를 위해 던져 넣는 뜻이므로 ‘불에 던졌습니다’가 자연스럽고 원문의 힘을 살립니다.
- source_word: אֱלֹהֵיהֶם
  english_pob_choice: their gods
  chosen_korean: 자기들의 신들
  alternatives_korean:
  - 그들의 신들
  - 그들의 우상들
  lexicon: HALOT
  rationale: 본문은 먼저 그들이 실제로 ‘신들’이라 부르던 대상을 말한 뒤 곧바로 그것들이 참 신이 아님을 부정하므로, ‘우상들’보다 ‘신들’이 수사적 대비를 더 잘 보존합니다.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  english_pob_choice: the work of human hands
  chosen_korean: 사람의 손으로 만든 작품
  alternatives_korean:
  - 인간의 손으로 만든 작품
  - 사람 손의 작품
  - 사람이 만든 것
  lexicon: HALOT
  rationale: ‘손으로 만든 것’이라는 제작 강조를 살리되, 현대 한국어에서 자연스러운 ‘작품’으로 옮겨 인공 제작물이라는 뜻을 분명히 했습니다.
- source_word: עֵץ וָאֶבֶן
  english_pob_choice: wood and stone
  chosen_korean: 나무와 돌
  alternatives_korean:
  - 목재와 돌
  - 목재와 석재
  - 나무와 석재
  lexicon: HALOT
  rationale: 재료를 직설적으로 제시하는 구문이므로, 관용적인 ‘나무와 돌’이 가장 간결하고 원문과 가깝습니다.
theological_decisions:
- issue: ‘신들’과 ‘우상들’ 중 어떤 표현을 본문에 둘 것인가
  chosen_reading: 본문은 ‘신들’로 두고, 다음 절차인 부정절에서 참 신이 아님을 밝힙니다.
  alternative_readings:
  - 우상들
  - 거짓 신들
  rationale: 원문은 먼저 그들이 그 대상으로 여긴 명칭을 그대로 사용한 뒤 그것이 참된 신이 아니라고 논박하므로, 수사적 긴장을 보존하기 위해 ‘신들’을 유지했습니다.
  doctrine_reference: 2 Kings 19:18 source rhetoric; translation philosophy §4
