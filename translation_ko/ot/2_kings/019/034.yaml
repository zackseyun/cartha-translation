  text: For I will defend this city to save it[a], for my own sake and for the sake of my servant David.
  footnotes:
  - marker: a
    text: Or 'deliver it.' The Hebrew verb can mean 'save' or 'deliver' in contexts of rescue from danger.
    reason: lexical_alternative
translation:
  language: ko
  text: 내가 이 성을 지켜서 구하리니, 이는 나 자신을 위함이며 내 종 다윗을 위함입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘건지다’. 히브리어 동사는 구출·구원의 문맥에서 ‘구하다’와 ‘건지다’ 둘 다 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַנּוֹתִי אֶל הָעִיר הַזֹּאת
  english_pob_choice: I will defend this city
  chosen_korean: 이 성을 지키다
  alternatives_korean:
  - 이 성을 보호하다
  - 이 성을 방어하다
  lexicon: HALOT
  rationale: גּנן의 보호·가림 의미를 살리되, 군사적 위기 문맥에서는 한국어 ‘지키다’가 가장 자연스럽고 원문 의도를 잘 드러냅니다.
- source_word: לְהוֹשִׁיעָהּ
  english_pob_choice: to save it
  chosen_korean: 구하리니
  alternatives_korean:
  - 건지리니
  - 구원하리니
  lexicon: HALOT
  rationale: ישׁע의 ‘구하다/건지다’ 뜻을 반영하되, 고난 속 성읍을 살려 내는 문맥에서는 ‘구하다’가 직관적입니다.
- source_word: לְמַעֲנִי
  english_pob_choice: for my own sake
  chosen_korean: 나 자신을 위함이며
  alternatives_korean:
  - 나를 위함이며
  - 내 이름을 위함이며
  lexicon: HALOT
  rationale: 하나님의 동기 안에 있는 자기 지시를 직역하되, 한국어에서는 강조를 살리는 ‘나 자신을 위함’이 가장 근접합니다.
- source_word: וּלְמַעַן דָּוִד עַבְדִּי
  english_pob_choice: for the sake of my servant David
  chosen_korean: 내 종 다윗을 위함입니다
  alternatives_korean:
  - 내 종 다윗을 위해서입니다
  - 내 종 다윗의 연고입니다
  lexicon: HALOT
  rationale: עבדּי를 POB 기본어휘대로 ‘종’으로 옮겨, 언약적 호칭인 ‘내 종 다윗’의 관계를 유지했습니다.
theological_decisions:
- issue: 하나님의 자기 목적 표현과 다윗 언약 근거를 함께 보존할지 여부
  chosen_reading: 하나님이 예루살렘을 지키고 구하시는 이유를 ‘나 자신을 위함’과 ‘내 종 다윗을 위함’ 두 갈래로 그대로 보존했습니다.
  alternative_readings:
  - 두 동기를 하나로 묶어 더 매끄럽게 의역하는 방식
  - 다윗을 단순한 역사적 인물 언급으로 축소하는 방식
  rationale: 원문은 לְמַעַן 구문을 두 번 병렬로 사용해 동기를 분명히 나누므로, 신학적 긴장과 언약적 이유를 해소하지 않고 유지하는 편이 원문 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
