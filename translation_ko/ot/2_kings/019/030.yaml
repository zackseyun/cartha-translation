  lexicon: HALOT
  rationale: 지하/상향의 대조를 한국어의 자연스러운 농경 이미지인 ‘뿌리를 내리다’와 ‘열매를 맺다’로 옮겨, 평행 구조와 상징성을 함께 보존했습니다.
