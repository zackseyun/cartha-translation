  alternative_readings:
  - ‘남은 자’로 단순화
  - ‘생존자들’로 일반화
  rationale: 이 절은 심판 이후 보존된 유다 공동체의 회복을 농경 이미지로 그리므로, 신학적 핵심인 ‘남은 자’ 모티프를 유지하되 생존의 감각도 함께 드러냈습니다.
  doctrine_reference: remnant theology; restoration oracle
