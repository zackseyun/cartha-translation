base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/014.yaml
  text: Then Hezekiah took the letters from the hand of the messengers and read them[a], and he went up to the house of Yahweh[c][b], and Hezekiah spread them before Yahweh.
  footnotes:
  - marker: a
    text: Or 'documents' or 'scrolls'; the Hebrew term can denote written materials more broadly than personal letters.
    reason: lexical_alternative
  - marker: b
    text: Hebrew 'from the hand of the messengers,' an idiom meaning 'from the messengers.'
    reason: lexical_alternative
  - marker: c
    text: That is, he laid out the letter(s) before the LORD in prayer.
    reason: cultural_note
translation:
  language: ko
  text: 그때 히스기야는 사신들의 손에서 그 서한들을 받아 읽었고, 야훼의 집으로 올라가서 히스기야가 그것들을 야훼 앞에 펼쳐 놓았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 ‘ספרים’은 여기서 개인 편지만이 아니라 서면 문서 전반을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּפָרִים
  english_pob_choice: the letters
  chosen_korean: 그 서한들
  alternatives_korean:
  - 그 편지들
  - 그 문서들
  - 그 두루마리들
  lexicon: HALOT
  rationale: 문맥상 왕에게 전달된 서면 메시지이므로 ‘서한들’이 가장 자연스럽고, 복수형도 분명하게 살립니다.
- source_word: מִיַּד הַמַּלְאָכִים
  english_pob_choice: from the hand of the messengers
  chosen_korean: 사신들의 손에서
  alternatives_korean:
  - 전령들의 손에서
  - 사신들로부터
  - 전령들로부터
  lexicon: HALOT
  rationale: 히브리어 관용구의 구체성을 살리면서도 한국어로는 ‘-로부터’보다 ‘손에서’가 더 직접적이고 원문 밀착적입니다.
- source_word: וַיִּפְרְשֵׂהוּ
  english_pob_choice: spread it
  chosen_korean: 펼쳐 놓았습니다
  alternatives_korean:
  - 펼쳤습니다
  - 펴 놓았습니다
  - 펴서 놓았습니다
  lexicon: HALOT
  rationale: 문서를 하나님 앞에 물리적으로 놓는 동작을 드러내기 위해 ‘펼쳐 놓았습니다’를 택했습니다. 영어 POB의 ‘spread it’보다 한국어에서는 이 표현이 더 자연스럽습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 본 프로젝트 기본 용례에 따라 여호와 대신 고유명사 음역 ‘야훼’를 유지해 언약의 이름을 드러냈습니다.
theological_decisions:
- issue: ‘야훼의 집’과 ‘야훼 앞에’의 반복
  chosen_reading: 동일 절 안에서 하나님의 이름을 두 번 모두 고유명사로 옮겨, 왕이 단순히 성전에 간 것이 아니라 야훼 앞에 그 서한들을 제시한 행위를 분명히 했습니다.
  alternative_readings:
  - ‘여호와의 집’/‘여호와 앞에’
  - ‘주님의 집’/‘주님 앞에’
  rationale: 히브리어 본문은 מקום(장소)과 יחס(관계)를 함께 강조하므로, 고유명사 ‘야훼’를 일관되게 사용해야 본문의 행위와 신학적 긴장이 살아납니다.
  doctrine_reference: 'DOCTRINE.md: Contested terms — יְהוָה YHWH → 야훼'
