theological_decisions:
- issue: 암살 장면의 서술 방식
  chosen_reading: 직접적이고 간결한 ‘칼로 쳐 죽였습니다’로 번역해, 본문의 폭력성과 사건의 급박함을 희석하지 않았습니다.
