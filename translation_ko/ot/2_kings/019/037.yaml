  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
  footnotes:
  - marker: a
    text: Hebrew 'Nisrok'; traditionally rendered 'Nisroch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 신 니스록[a]의 집에서 경배하고 있을 때에, 아드람멜렉과 사르에셀이 그를 칼로 쳐 죽였습니다. 그들은 아라랏 땅으로 피신하였고, 그의 아들 에살핫돈이 그를 대신하여 통치하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘니스록’은 히브리어 철자를 따른 음역입니다. 전통적으로는 ‘니스로크’로도 옮깁니다.
    reason: lexical_alternative
