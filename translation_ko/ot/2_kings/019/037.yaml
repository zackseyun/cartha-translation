base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/037.yaml
  text: And it happened that[a], as he was worshiping in the house of Nisrok his god, Adrammelek and Sharezer struck him down with the sword, and they escaped to the land of Ararat. And Esar-haddon his son reigned in his place.
  footnotes:
  - marker: a
    text: Hebrew 'Nisrok'; traditionally rendered 'Nisroch.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 그의 신의 니스록의 집에서 경배하고 있을 때에 아드람멜렉과 사르에셀이 그를 칼로 쳐 죽였습니다. 그들은 아라랏 땅으로 도망하였고, 그의 아들 에살핫돈이 그를 대신하여 통치하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘니스록’은 히브리어 철자를 따른 음역입니다. 전통적으로는 ‘니스로크’로도 옮깁니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁתַּחֲוֶה
  english_pob_choice: was worshiping
  chosen_korean: 경배하고 있을 때에
  alternatives_korean:
  - 절하고 있을 때에
  - 엎드려 경배하고 있을 때에
  lexicon: HALOT
  rationale: 제의적 행위이므로 단순한 신체 동작보다 ‘경배하다’가 원뜻을 더 잘 드러내며, 진행 중 상황을 한국어 관용에 맞게 풀어 옮겼습니다.
- source_word: בֵּית נִסְרֹךְ
  english_pob_choice: in the house of Nisrok
  chosen_korean: 니스록의 집에서
  alternatives_korean:
  - 니스록의 신전에서
  - 니스록의 집 안에서
  lexicon: HALOT
  rationale: 히브리어의 문자적 표현 ‘집’을 유지해 원문 결을 살렸고, POB의 음역 ‘니스록’을 따랐습니다.
- source_word: הִכֻּהוּ בַחֶרֶב
  english_pob_choice: struck him down with the sword
  chosen_korean: 칼로 쳐 죽였습니다
  alternatives_korean:
  - 칼로 쳤습니다
  - 검으로 쳐 죽였습니다
  lexicon: HALOT
  rationale: 동사 נכה의 ‘치다’와 결과적 치명성을 함께 살리기 위해 ‘쳐 죽이다’로 옮겼고, ‘칼’은 한국어에서 자연스러운 무기 표지입니다.
- source_word: אֶרֶץ אֲרָרָט
  english_pob_choice: the land of Ararat
  chosen_korean: 아라랏 땅
  alternatives_korean:
  - 아라랏 땅으로
  - 아라랏 지역
  lexicon: HALOT
  rationale: 지명구를 간결하게 유지하면서도 ‘land of’의 대응을 살리기 위해 ‘아라랏 땅’으로 옮겼습니다.
- source_word: אֵסַר חַדֹּן
  english_pob_choice: Esar-haddon
  chosen_korean: 에살핫돈
  alternatives_korean:
  - 에사르하돈
  - 에살하돈
  lexicon: HALOT
  rationale: 히브리어 음가를 반영한 음역으로, 한국어 표기에서는 두 요소를 붙여 왕명으로 읽히게 했습니다.
theological_decisions:
- issue: 암살 장면의 서술 방식
  chosen_reading: 직접적이고 간결한 ‘칼로 쳐 죽였습니다’로 번역해, 본문의 폭력성과 사건의 급박함을 희석하지 않았습니다.
  alternative_readings:
  - 그를 죽였습니다
  - 그를 칼로 쳤습니다
  rationale: 본문은 단순한 상해가 아니라 실제 살해를 말하므로, 결과를 분명히 드러내는 표현이 서사와 일치합니다.
  doctrine_reference: 역사 서술의 사실성 유지
