  text: וְ/עַתָּה֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ הוֹשִׁיעֵ֥/נוּ נָ֖א מִ/יָּד֑/וֹ וְ/יֵֽדְעוּ֙ כָּל מַמְלְכ֣וֹת הָ/אָ֔רֶץ כִּ֥י אַתָּ֛ה יְהוָ֥ה אֱלֹהִ֖ים לְ/בַדֶּֽ/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/019.yaml
  text: And now[a], Yahweh our God, please save us from his hand[b], so that all the kingdoms of the earth may know that you alone are God.
  footnotes:
  - marker: a
    text: 'Hebrew: ''from his hand,'' an idiom for deliverance from his power.'
    reason: cultural_note
  - marker: b
    text: Or 'all the kingdoms of the land,' though in this context 'earth' best fits the international scope.
    reason: lexical_alternative
translation:
  language: ko
  text: 이제, 야훼 우리 하나님, 그의 손에서 우리를 구원해 주십시오[a]. 그러면 세상 모든 나라가 당신 홀로 하나님이신 줄 알게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘그의 손에서’는 곧 그의 권세나 지배에서의 구출을 뜻합니다.
    reason: source_note
  - marker: b
    text: 문맥상 הָאָרֶץ는 ‘땅’보다 국제적 범위를 가리키는 ‘세상’으로 옮기는 것이 더 적절합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 그러므로 이제
  lexicon: HALOT
  rationale: 기도의 전환을 여는 시간·담화 표지로, 한국어에서는 간결한 ‘이제’가 가장 자연스럽습니다.
- source_word: יְהוָה אֱלֹהֵינוּ
  english_pob_choice: Yahweh our God
  chosen_korean: 야훼 우리 하나님
  alternatives_korean:
  - 야훼 우리 하느님
  - 여호와 우리 하나님
  lexicon: HALOT
  rationale: 본문의 여호와/야훼를 POB 원칙에 따라 ‘야훼’로 옮기고, 소유격 호칭은 표준 개신교 용례의 ‘우리 하나님’으로 살렸습니다.
- source_word: הוֹשִׁיעֵנוּ נָא
  english_pob_choice: please save us
  chosen_korean: 우리를 구원해 주십시오
  alternatives_korean:
  - 우리를 구해 주십시오
  - 부디 우리를 구원하십시오
  lexicon: HALOT
  rationale: 히필 명령형의 구원 요청을 현대 한국어에서는 ‘구원해 주십시오’로 자연스럽게 살리고, נָא의 간청성은 공손한 청유형으로 반영했습니다.
- source_word: מִיָּדוֹ
  english_pob_choice: from his hand
  chosen_korean: 그의 손에서
  alternatives_korean:
  - 그의 손에서부터
  - 그의 손에서 벗어나
  lexicon: HALOT
  rationale: 직역적 이미지인 ‘손’은 유지하되, 한국어 관용으로는 ‘~에서’가 압박과 지배에서의 구출을 가장 잘 드러냅니다.
- source_word: כָּל מַמְלְכוֹת הָאָרֶץ
  english_pob_choice: all the kingdoms of the earth
  chosen_korean: 세상 모든 나라
  alternatives_korean:
  - 온 땅의 모든 나라
  - 세상의 모든 왕국
  lexicon: HALOT
  rationale: 국제적 범위를 가리키는 הָאָרֶץ를 이 문맥에 맞게 ‘세상’으로 옮기고, ‘왕국들’보다 자연스러운 현대 한국어 표현을 택했습니다.
- source_word: אַתָּה יְהוָה אֱלֹהִים לְבַדֶּךָ
  english_pob_choice: you alone are God
  chosen_korean: 당신 홀로 하나님이신
  alternatives_korean:
  - 당신만 하나님이신
  - 당신 홀로 하나님이심
  lexicon: HALOT
  rationale: לְבַדֶּךָ의 배타성을 ‘홀로’로 살리고, 서술적 진술은 한국어에서 자연스러운 관형절 구조로 처리했습니다.
theological_decisions:
- issue: 보편적 인식 목적절의 종결 방식
  chosen_reading: “그러면 … 알게 될 것입니다”로 목적과 결과를 함께 드러냈습니다.
  alternative_readings:
  - “그래서 … 알 것입니다”
  - “… 알게 하십시오”
  rationale: וְיֵדְעוּ는 기도 뒤에 이어지는 목적·결과의 뉘앙스를 가지므로, 한국어에서도 단순 미래보다 목적성을 보존하는 표현이 더 적절합니다.
  doctrine_reference: 'POB translation philosophy: preserve purpose/result force without flattening tension'
- issue: 하나님 유일성 고백의 표현
  chosen_reading: “당신 홀로 하나님이신”으로 배타적 유일성을 앞세웠습니다.
  alternative_readings:
  - “당신만 하나님이신”
  - “당신은 오직 하나님이십니다”
  rationale: 본문의 핵심은 야훼의 유일신적 고백이므로, ‘홀로’로 독점적 배타성을 분명히 하되 과도한 해설은 피했습니다.
  doctrine_reference: 'DOCTRINE.md Translation philosophy #3: preserve theological tension rather than resolve it'
