- from: 이제, 야훼 우리 하나님, 그의 손에서 우리를 구원해 주십시오[a]. 그러면 세상 모든 나라가 당신 홀로 하나님이신 줄 알게 될 것입니다[b].
  to: 이제, 야훼 우리 하나님, 부디 그의 손에서[a] 우리를 구원해 주십시오. 그리하여 세상 모든 나라가 야훼만이 하나님이심을 알게 해 주십시오[b].
  rationale: Repeated ‘야훼’ in the final confession restores an explicit element of the Hebrew text. The revised second sentence preserves the imperative-plus-purpose/result relationship in natural 합쇼체. Footnote a has been moved to its proper anchor and lightly clarified; footnote b remains anchored to the rendering of הָאָרֶץ.
