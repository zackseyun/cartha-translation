id: 2KI.19.2
reference: 2 Kings 19:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ֠/יִּשְׁלַח אֶת אֶלְיָקִ֨ים אֲשֶׁר עַל הַ/בַּ֜יִת וְ/שֶׁבְנָ֣א הַ/סֹּפֵ֗ר וְ/אֵת֙ זִקְנֵ֣י הַ/כֹּֽהֲנִ֔ים מִתְכַּסִּ֖ים בַּ/שַּׂקִּ֑ים אֶל יְשַֽׁעְיָ֥הוּ הַ/נָּבִ֖יא בֶּן אָמֽוֹץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/002.yaml
  text: And he sent Eliakim[a], who was over the household, and Shebna the scribe, and the elders of the priests, clothed in sackcloth, to Isaiah the prophet[b], the son of Amoz.
  footnotes:
  - marker: a
    text: Or 'covering themselves with sackcloth.' The Hebrew participle can emphasize the act or the resulting state.
    reason: lexical_alternative
  - marker: b
    text: '''Who was over the household'' refers to a high royal official in charge of the palace or royal household.'
    reason: cultural_note
translation:
  language: ko
  text: 그는 엘리아김—그가 궁정 책임자였으며—서기관 셉나와 제사장들의 장로들을, 굵은 삼베옷을 입은 채, 아모스의 아들 예언자 이사야에게 보냈습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '삼베옷을 입고 자신들을 가리고 있는 채'로도 옮길 수 있습니다. 히브리어 분사는 행위 자체나 그 결과 상태를 강조할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '''그가 궁정 책임자였다''는 왕궁이나 왕실 가정을 맡은 고위 관직을 가리킵니다.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  english_pob_choice: And he sent
  chosen_korean: 보냈습니다
  alternatives_korean:
  - 그리고 그가 보냈습니다
  - 그는 파견했습니다
  lexicon: WLC / HALOT
  rationale: 서술 전개를 자연스럽게 살리면서도, 원문의 단순한 파송 동사를 과장 없이 옮겼습니다.
- source_word: אֲשֶׁר עַל הַבַּיִת
  english_pob_choice: who was over the household
  chosen_korean: 그가 궁정 책임자였으며
  alternatives_korean:
  - 그가 집 위에 있었으며
  - 그가 왕실 가정을 맡고 있었으며
  lexicon: HALOT
  rationale: 직역하면 어색한 관용구이므로, 왕궁 행정 고위직이라는 의미를 한국어로 분명히 드러냈습니다.
- source_word: הַסֹּפֵר
  english_pob_choice: the scribe
  chosen_korean: 서기관
  alternatives_korean:
  - 서기
  - 기록관
  lexicon: HALOT
  rationale: 궁정 관직으로서의 뉘앙스를 살리기 위해 한국어 성경에서 통용되는 관직어를 택했습니다.
- source_word: מִתְכַּסִּים בַּשַּׂקִּים
  english_pob_choice: clothed in sackcloth
  chosen_korean: 굵은 삼베옷을 입은 채
  alternatives_korean:
  - 삼베옷을 입고
  - 자루옷을 입은 채
  lexicon: HALOT
  rationale: mournful 상태를 나타내는 분사를 자연스러운 상태 표현으로 옮기되, 회개의 옷이라는 문화적 이미지를 유지했습니다.
- source_word: יְשַׁעְיָהוּ הַנָּבִיא
  english_pob_choice: Isaiah the prophet
  chosen_korean: 예언자 이사야
  alternatives_korean:
  - 이사야 선지자
  - 예언자 이사야
  lexicon: HALOT
  rationale: נָבִיא를 전통적 교회어인 '선지자'보다 원어 의미에 가까운 '예언자'로 옮겨, POB의 직역 지향을 따랐습니다.
theological_decisions:
- issue: 히브리어 관직명 'אֲשֶׁר עַל הַבַּיִת'의 해석 범위
  chosen_reading: 왕궁의 최고 책임자라는 기능을 드러내는 '궁정 책임자'로 옮겼습니다.
  alternative_readings:
  - 왕실의 집을 맡은 사람
  - 궁내대신
  rationale: 본문은 단순한 '집'이 아니라 왕실 행정 구조의 고위직을 가리키므로, 독자가 오해하지 않도록 기능적 의미를 분명히 했습니다.
  doctrine_reference: 역사서의 궁정 제도 이해
- issue: 나발적 문맥에서의 예언자 호칭
  chosen_reading: '''예언자''를 사용해 ישׁעיהו의 직함을 직역했습니다.'
  alternative_readings:
  - 선지자
  - 예언자
  rationale: 원문의 נָבִיא는 예언 행위와 메시지 전달의 직분을 가리키므로, 교회 전통어보다 원어 의미를 더 직접적으로 반영했습니다.
  doctrine_reference: 예언자 직분의 원어적 의미
