source:
  edition: WLC
  text: הִנְ/נִ֨י נֹתֵ֥ן בּ/וֹ֙ ר֔וּחַ וְ/שָׁמַ֥ע שְׁמוּעָ֖ה וְ/שָׁ֣ב לְ/אַרְצ֑/וֹ וְ/הִפַּלְתִּ֥י/ו בַּ/חֶ֖רֶב בְּ/אַרְצֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
  footnotes:
  - marker: a
    text: Or 'a disposition'; the Hebrew word can also mean 'wind' or 'breath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'news' or 'a rumor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 그의 안에 영을 넣을 것이니, 그는 소식을 듣고 자기 땅으로 돌아갈 것이며, 나는 그를 자기 땅에서 칼에 쓰러지게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기운’, ‘바람’, ‘성향’으로도 옮길 수 있습니다. 히브리어 רוּחַ는 이 문맥에서 작용하는 내적 충동이나 하나님의 보내심을 폭넓게 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: HALOT
  rationale: 신적 선언의 주의를 끄는 감탄을 현대 한국어의 공손한 명령형으로 살려, 예언적 도입부의 긴박함을 유지했습니다.
- source_word: רוּחַ
  english_pob_choice: a spirit
  chosen_korean: 영
  alternatives_korean:
  - 바람
  - 기운
  - 성령
  lexicon: HALOT
  rationale: 여기서는 물리적 바람보다 내적 충동 또는 하나님이 보내시는 작용을 가리키므로, 의미 범위를 유지하는 중립적 ‘영’이 가장 적절합니다.
- source_word: שְׁמוּעָה
  english_pob_choice: a report
  chosen_korean: 소식
  alternatives_korean:
  - 보고
  - 전갈
  - 루머
  lexicon: HALOT
  rationale: 공적·사건적 맥락에서 ‘report/news/rumor’를 아우를 수 있는 자연스러운 한국어로, 확정되지 않은 정보일 수도 있다는 여지를 남겼습니다.
- source_word: וְהִפַּלְתִּיו בַּחֶרֶב
  english_pob_choice: and I will make him fall by the sword
  chosen_korean: 그를 … 칼에 쓰러지게 하겠습니다
  alternatives_korean:
  - 그를 칼로 쓰러뜨리겠습니다
  - 그를 칼에 의해 넘어지게 하겠습니다
  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리되, 한국어에서 자연스럽고 직설적인 종결로 폭력적 심판을 표현했습니다.
theological_decisions:
- issue: רוח의 번역에서 작용의 방식과 범위를 얼마나 특정할 것인가
  chosen_reading: ‘영’으로 번역해, 하나님이 상황과 왕의 반응을 주권적으로 움직이시는 방식의 모호성을 보존했습니다.
  alternative_readings:
  - ‘바람’으로 구체화
  - ‘기운’으로 완화
  - ‘성령’으로 신격화
  rationale: 문맥은 앗수르 왕의 철수를 이끄는 하나님의 주권적 개입을 말하지만, 매개가 무엇인지는 규정하지 않습니다. 따라서 원문의 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 해소하지 말고 보존
