  lexicon: HALOT
  rationale: 히필의 사역적 의미를 살리되, 한국어에서 자연스럽고 직설적인 종결로 폭력적 심판을 표현했습니다.
theological_decisions:
- issue: רוח의 번역에서 작용의 방식과 범위를 얼마나 특정할 것인가
  chosen_reading: ‘영’으로 번역해, 하나님이 상황과 왕의 반응을 주권적으로 움직이시는 방식의 모호성을 보존했습니다.
  alternative_readings:
  - ‘바람’으로 구체화
  - ‘기운’으로 완화
  - ‘성령’으로 신격화
  rationale: 문맥은 앗수르 왕의 철수를 이끄는 하나님의 주권적 개입을 말하지만, 매개가 무엇인지는 규정하지 않습니다. 따라서 원문의 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 번역 철학 §3 — 신학적 긴장을 해소하지 말고 보존
