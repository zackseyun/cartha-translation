base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/007.yaml
  text: Look[a], I am putting a spirit in him, and he will hear a report and return to his own land[b], and I will make him fall by the sword in his own land.
  footnotes:
  - marker: a
    text: Or 'a disposition'; the Hebrew word can also mean 'wind' or 'breath.'
    reason: lexical_alternative
  - marker: b
    text: Or 'news' or 'a rumor.'
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오[a], 내가 그 안에 영을 두어, 그가 소식을 듣고 자기 땅으로 돌아가게 하겠습니다. 나는 그를 자기 땅에서 칼로 쓰러뜨리겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기운’, ‘바람’, ‘성향’. 히브리어 רוּחַ는 영, 바람, 숨, 또는 내적 성향을 가리킬 수 있습니다.
    reason: lexical_alternative
