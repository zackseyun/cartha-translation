  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
  footnotes:
  - marker: a
    text: Or 'the sons of Eden who were in Tel-assar.' The Hebrew literally reads 'sons of Eden,' which may denote the people or inhabitants of Eden.
