translation:
  language: ko
  text: 내 조상들이 멸망시킨 민족들의 신들이 고산과 하란과 레셉과 텔라살에 있던 에덴 사람들을 구해 냈습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘텔라살에 있던 에덴의 아들들’. 히브리어는 문자적으로 ‘에덴의 아들들’이라고 하며, 에덴의 사람들 또는 거주민을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  english_pob_choice: Did ... deliver
  chosen_korean: 구해 냈느냐
