source:
  edition: WLC
  text: הַ/הִצִּ֨ילוּ אֹתָ֜/ם אֱלֹהֵ֤י הַ/גּוֹיִם֙ אֲשֶׁ֣ר שִׁחֲת֣וּ אֲבוֹתַ֔/י אֶת גּוֹזָ֖ן וְ/אֶת חָרָ֑ן וְ/רֶ֥צֶף וּ/בְנֵי עֶ֖דֶן אֲשֶׁ֥ר בִּ/תְלַאשָּֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/012.yaml
  text: Did the gods of the nations that my fathers destroyed deliver them—Gozan[a], Haran, Rezeph, and the people of Eden who were in Tel-assar?
  footnotes:
  - marker: a
    text: Or 'the sons of Eden who were in Tel-assar.' The Hebrew literally reads 'sons of Eden,' which may denote the people or inhabitants of Eden.
    reason: lexical_alternative
translation:
  language: ko
  text: 내 조상들이 멸망시킨 민족들의 신들—곧 고산과 하란과 레셉과, 텔라살에 있던 에덴의 사람들을 그 신들이 구해 냈느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘에덴의 아들들’. 히브리어는 문자적으로 ‘에덴의 아들들’이므로, 거주민을 가리키는 표현일 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִצִּילוּ
  english_pob_choice: Did ... deliver
  chosen_korean: 구해 냈느냐
  alternatives_korean:
  - 구원했느냐
  - 건져 냈느냐
  lexicon: HALOT
  rationale: 도전적 수사의문문에서 בעבר형 질문으로 자연스럽게 옮기되, ‘구해 내다’로 ‘deliver’의 구출 의미를 살렸습니다.
- source_word: אֱלֹהֵי הַגּוֹיִם
  english_pob_choice: the gods of the nations
  chosen_korean: 민족들의 신들
  alternatives_korean:
  - 나라들의 신들
  - 열방의 신들
  lexicon: HALOT
  rationale: פְּרֶץ된 다신교적 대상을 드러내는 직역성을 유지하면서, 한국어에서는 ‘민족들’이 본문의 ‘nations’에 가장 중립적입니다.
- source_word: וּבְנֵי עֶדֶן
  english_pob_choice: the people of Eden
  chosen_korean: 에덴의 사람들
  alternatives_korean:
  - 에덴의 아들들
  - 에덴 사람들
  lexicon: HALOT
  rationale: ‘sons of’의 직역을 유지할 수 있으나, 문맥상 거주민을 가리키므로 POB의 해석을 반영해 ‘사람들’로 옮겼습니다.
- source_word: בִּתְלַאשָּׂר
  english_pob_choice: who were in Tel-assar
  chosen_korean: 텔라살에 있던
  alternatives_korean:
  - 텔라살에 있는
  - 텔라살에 있던 사람들
  lexicon: HALOT
  rationale: 장소 전치사 בְּ의 위치 관계를 살려 ‘~에 있던’으로 자연스럽게 표현했습니다.
theological_decisions:
- issue: Assyrian king’s boastful rhetorical question in hostile speech
  chosen_reading: 화자가 실제 신앙 고백을 하는 것이 아니라, 패배한 민족의 신들을 조롱하는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 역사 질문으로 읽기
  - 신들의 능력 부정을 절제된 진술로 완화하기
  rationale: 본문의 어조는 공격적 조롱이며, 한국어도 그 날카로움을 유지해야 문맥의 의도가 살아납니다.
  doctrine_reference: 본문 맥락(열왕기하 19장 랍사게/앗수르의 조롱 담화)
