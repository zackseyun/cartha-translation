    issue: ‘한 남은 자’가 집합명사 שְׁאֵרִית를 단수의 개인처럼 들리게 합니다.
    rationale: 원문은 문법적으로 여성 단수이나, 재난 뒤에 남은 공동체를 가리키는 집합명사입니다. 한국어에서는 ‘남은 자들’이 병행되는 ‘피한 자들’과도 자연스럽게 호응합니다.
  - severity: low
    issue: ‘야훼의 열심이 … 이루실 것입니다’의 높임 선어말어미가 문법상 주어인 ‘열심’과 맞지 않습니다.
    rationale: 야훼의 행위를 가리키는 표현이지만, 문장 주어는 קִנְאַת יְהוָה(야훼의 열심)입니다. ‘이룰 것입니다’는 합쇼체를 유지하면서 원문의 구문을 더 정확히 반영합니다.
