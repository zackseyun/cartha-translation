base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/031.yaml
  text: For from Jerusalem a remnant will go out[a], and from Mount Zion survivors. The zeal of Yahweh will do this.
  footnotes:
  - marker: a
    text: Or 'The jealousy of the LORD will do this.' The Hebrew noun can mean either 'zeal' or 'jealousy'; here it refers to the LORD's passionate commitment to accomplish Jerusalem's deliverance.
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 예루살렘에서 남은 자들이 나오고, 시온 산에서 피한 자들이 나올 것이기 때문입니다. 야훼의 열심이 이것을 이룰 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야훼의 질투가 이것을 이룰 것입니다.’ 히브리어 명사 קִנְאָה는 ‘열심’과 ‘질투’ 모두를 뜻할 수 있으며, 여기서는 예루살렘의 구원을 이루려는 야훼의 강렬한 언약적 헌신을 가리킵니다.
    reason: lexical_alternative
