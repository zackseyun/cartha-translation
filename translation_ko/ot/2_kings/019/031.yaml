revisions:
- from: 이는 예루살렘에서 한 남은 자가 나오고, 시온 산에서 생존자들이 나올 것이기 때문입니다. 야훼의 열심이 이것을 이루실 것입니다.[a]
  to: 이는 예루살렘에서 남은 자들이 나오고, 시온 산에서 피한 자들이 나올 것이기 때문입니다. 야훼의 열심이 이것을 이룰 것입니다.[a]
  rationale: 집합명사인 ‘남은 자’와 ‘피한 자’를 복수형으로 옮겨 한국어의 자연스러움과 원문의 병행을 살렸습니다. ‘피한 자들’은 פְּלֵיטָה의 탈출·생존 의미를 보존합니다. ‘이룰 것입니다’로 고쳐 ‘야훼의 열심’이 문법상 주어인 원문의 표현을 자연스럽게 반영했습니다. 각주는 קִנְאָה의 논쟁 가능한 어휘 대안을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T14:54:23Z'
review_pass:
  verdict: revise
  source_fidelity: 히브리어의 인과 접속사, 두 출처구의 병행, ‘남은 자/피한 자’의 집합적 의미, 그리고 ‘야훼의 열심’이라는 주어를 대체로 충실히 반영합니다. 다만 שְׁאֵרִית는 집합명사인데 ‘한 남은 자’는 한국어에서 한 개인을 가리키는 듯하여 원문의 집합적 의미와 뒤의 병행을 약화합니다. פְּלֵיטָה는 ‘생존자’도 가능하나, 재난에서 벗어나 살아남은 이들이라는 뜻을 더 직접적으로 나타내는 ‘피한 자들’이 적절합니다.
  naturalness: ‘이는 … 때문입니다’는 합쇼체 문맥에서 자연스럽습니다. 그러나 ‘한 남은 자가’와 ‘생존자들이’의 수적 불균형은 어색합니다. 또한 문법상 ‘열심’이 주어이므로 ‘이루실 것입니다’보다 ‘이룰 것입니다’가 더 자연스럽고 정확합니다.
  terminology: 야훼, 예루살렘, 시온 산, 열심은 일관되고 적절합니다. ‘열심’은 קִנְאָה의 문맥상 긍정적 열의를 잘 전달하며, ‘질투’라는 어휘적 대안은 각주로 보존하는 것이 타당합니다.
  issues:
