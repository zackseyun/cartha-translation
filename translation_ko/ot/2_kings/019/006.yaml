  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יְשַֽׁעְיָ֔הוּ כֹּ֥ה תֹאמְר֖וּ/ן אֶל אֲדֹֽנֵי/כֶ֑ם כֹּ֣ה אָמַ֣ר יְהוָ֗ה אַל תִּירָא֙ מִ/פְּנֵ֤י הַ/דְּבָרִים֙ אֲשֶׁ֣ר שָׁמַ֗עְתָּ אֲשֶׁ֧ר גִּדְּפ֛וּ נַעֲרֵ֥י מֶֽלֶךְ אַשּׁ֖וּר אֹתִֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/006.yaml
  text: 'Isaiah said to them[a], “Thus you shall say to your master: Thus says Yahweh, ‘Do not be afraid because of the words that you have heard, with which the servants of the king of Assyria have blasphemed me.’”'
  footnotes:
  - marker: a
    text: Or “the young men of the king of Assyria.” The Hebrew term can denote youths, but here likely refers to royal attendants or officials.
    reason: lexical_alternative
translation:
  language: ko
  text: 이사야가 그들에게 말했습니다. “너희는 너희 주인에게 이렇게 말하십시오. ‘야훼께서 이렇게 말씀하십니다. 네가 들은 말들, 곧 앗수르 왕의 신하들[a]이 나를 모독하며 한 말들 때문에 두려워하지 마십시오.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “앗수르 왕의 젊은이들”로 옮길 수 있습니다. 히브리어 נער는 문자적으로 젊은이를 뜻하지만, 여기서는 왕의 부하나 관원을 가리킬 가능성이 큽니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁעְיָהוּ / וַיֹּאמֶר
  english_pob_choice: Isaiah said
  chosen_korean: 이사야가 말했습니다
  alternatives_korean:
  - 이사야가 말하셨습니다
  - 이사야가 이르렀습니다
  lexicon: HALOT
  rationale: 서술형 wayyiqtol אמר는 현대 한국어 내러티브에서 자연스럽게 ‘말했습니다’로 옮기되, 인물 이름을 분명히 드러냈습니다.
- source_word: אֲדֹנֵיכֶם
  english_pob_choice: your master
  chosen_korean: 너희 주인에게
  alternatives_korean:
  - 너희 주께
  - 너희 상전에게
  lexicon: HALOT
  rationale: 이 표현은 여호와가 아니라 히스기야를 가리키므로, 신적 호칭인 ‘주’보다 사회적 관계를 나타내는 ‘주인’을 택해 오해를 피했습니다.
- source_word: יְהוָה
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: HALOT
  rationale: 이 프로젝트의 기본 원칙에 따라 신명기는 ‘야훼’로 옮겨 언약적 고유명을 보존했습니다.
- source_word: אַל תִּירָא
  english_pob_choice: Do not be afraid
  chosen_korean: 두려워하지 마라
  alternatives_korean:
  - 무서워하지 마라
  - 두려워하지 말아라
  lexicon: HALOT
  rationale: 부정 명령의 핵심은 공포의 중단이므로, 현대적이면서도 단호한 ‘두려워하지 마라’가 가장 자연스럽습니다.
- source_word: מִפְּנֵי הַדְּבָרִים
  english_pob_choice: because of the words
  chosen_korean: 그 말들 때문에
  alternatives_korean:
  - 그 일들 때문에
  - 그 말들로 인하여
  lexicon: HALOT
  rationale: 문맥상 פחד를 유발한 것은 사건 일반이 아니라 앗수르 사자들이 내뱉은 조롱의 말이므로 ‘말들’로 구체화했습니다.
- source_word: גִּדְּפוּ
  english_pob_choice: have blasphemed
  chosen_korean: 모독한
  alternatives_korean:
  - 신성모독한
  - 저주한
  - 욕한
  lexicon: HALOT
  rationale: 하나님을 향한 언어적 모욕이라는 강도를 살리되, 한국어에서 과도하게 교회화된 표현을 피하고 ‘모독하다’로 옮겼습니다.
- source_word: נַעֲרֵי מֶלֶךְ אַשּׁוּר
  english_pob_choice: the servants of the king of Assyria
  chosen_korean: 앗수르 왕의 종들이
  alternatives_korean:
  - 앗수르 왕의 젊은이들이
  - 앗수르 왕의 시종들이
  lexicon: HALOT
  rationale: נערים는 문자적으로 ‘젊은이들’일 수 있지만 궁정 맥락에서는 왕의 심부름꾼/부하를 가리킬 수 있어, 영문 POB의 해석을 따라 ‘종들’로 옮겼습니다.
theological_decisions:
