  text: But I know your sitting down[a], your going out, and your coming in[b], and your raging against me.
  footnotes:
  - marker: a
    text: 'Hebrew idiom: ''your sitting down, your going out, and your coming in'' expresses the totality of a person''s movements and conduct.'
