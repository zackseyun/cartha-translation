    reason: lexical_alternative
translation:
  language: ko
  text: 그러나 나는 당신이 앉아 있는 것과 나가고 들어오는 것, 또 당신이 나를 향해 격분하는 것을 알고 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 히브리어 관용구 ‘앉아 있는 것, 나가고 들어오는 것’은 사람의 모든 움직임과 행위를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 또는 ‘당신의 격앙됨’ 또는 ‘나를 향한 당신의 분노’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבְתְּךָ
  english_pob_choice: your sitting down
  chosen_korean: 당신의 앉아 있음
  alternatives_korean:
  - 당신의 거처
  - 당신의 머묾
  - 당신의 앉음
  lexicon: HALOT
  rationale: 출애굽기적 관용구로서 ‘앉아 있음/나아감/들어옴’의 삼중 표현이 삶의 전반을 가리키므로, 해석을 넓히기보다 구체적 동작을 살린 표현을 택했습니다.
- source_word: וְצֵאתְךָ
  english_pob_choice: your going out
  chosen_korean: 나아감
  alternatives_korean:
  - 나감
  - 나서는 일
  - 떠남
  lexicon: HALOT
  rationale: יצא의 대응으로, 앞뒤 항목과 병렬을 이루는 동작성을 살리기 위해 ‘나아감’을 사용했습니다.
- source_word: וּבֹאֲךָ
  english_pob_choice: your coming in
  chosen_korean: 들어옴
  alternatives_korean:
  - 들어감
  - 들어오는 일
  - 출입
  lexicon: HALOT
  rationale: בוא의 기본 뜻을 따라 ‘coming in’에 해당하는 자연스러운 현대 한국어로 옮기되, 관용구의 짝을 유지했습니다.
- source_word: הִתְרַגֶּזְךָ אֵלַי
  english_pob_choice: your raging against me
  chosen_korean: 당신이 저를 향해 격분하는 것
  alternatives_korean:
  - 당신의 분노
  - 당신의 흥분
  - 당신의 성을 냄
  lexicon: HALOT
  rationale: Hitpael רגז의 격앙된 반응을 ‘격분하다’로 옮기고, אלי의 적대적 방향성을 ‘저를 향해’로 드러냈습니다.
theological_decisions:
- issue: 1인칭 신적 지식의 현재성
  chosen_reading: ‘저는 … 알고 있으며 … 압니다’로 두 번의 현재형을 사용해, 하나님의 확정적이고 포괄적인 인식을 자연스럽게 드러냈습니다.
  alternative_readings:
  - ‘알고 있었습니다’처럼 과거형으로 옮김
  - 한 번만 ‘압니다’로 통일
  rationale: 히브리어 완료형 ידעתי는 여기서 단순 과거보다 확정된 지식을 나타내므로, 현재형으로 옮기는 것이 본문 기능에 더 가깝습니다.
  doctrine_reference: 하나님의 전지
- issue: אָלַי의 적대적 방향성
  chosen_reading: ‘저를 향해’로 직역하면서도, 앞의 ‘격분하다’와 결합해 적대적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘저에게’
  - ‘저에게 대하여’
  rationale: אל의 기본 전치 의미를 보존하되, 문맥상 적대적 대상임을 드러내는 것이 본문의 힘을 더 잘 전달합니다.
  doctrine_reference: 문맥적 적대 표현
