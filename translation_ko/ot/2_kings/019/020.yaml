  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: וַ/יִּשְׁלַח֙ יְשַֽׁעְיָ֣הוּ בֶן אָמ֔וֹץ אֶל חִזְקִיָּ֖הוּ לֵ/אמֹ֑ר כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֨ר הִתְפַּלַּ֧לְתָּ אֵלַ֛/י אֶל סַנְחֵרִ֥ב מֶֽלֶךְ אַשּׁ֖וּר שָׁמָֽעְתִּי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/020.yaml
  text: 'Then Isaiah son of Amoz sent to Hezekiah, saying, “Thus says the LORD, the God of Israel: Because you have prayed to me concerning Sennacherib king of Assyria, I have heard.”'
translation:
  language: ko
  text: 그때 아모스의 아들 이사야가 히스기야에게 사람을 보내어 말했습니다. “야훼, 이스라엘의 하나님께서 이렇게 말씀하십니다. 네가 앗수르 왕 산헤립에 관하여 내게 기도하였으니, 내가 들었다.”
  philosophy: formal
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶל חִזְקִיָּהוּ לֵאמֹר
  english_pob_choice: Then Isaiah son of Amoz sent to Hezekiah, saying
  chosen_korean: 아모스의 아들 이사야가 히스기야에게 사람을 보내어 말했습니다
  alternatives_korean:
  - 아모스의 아들 이사야가 히스기야에게 보내어 말했습니다
  - 아모스의 아들 이사야가 히스기야에게 전하여 말했습니다
  lexicon: שלח
  rationale: 히브리어 동사의 직접적 의미를 살리되, 한국어에서는 목적어 없는 ‘보내다’보다 ‘사람을 보내어’가 문맥상 자연스럽고 원문의 전달 행위를 분명히 드러냅니다.
- source_word: יְהוָה
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: יהוה
  rationale: POB 기본 원칙에 따라 신명 사역형을 ‘야훼’로 옮겨 원문 고유명적 용법을 드러냈습니다.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  english_pob_choice: the God of Israel
  chosen_korean: 이스라엘의 하나님
  alternatives_korean:
  - 이스라엘의 하나님님
  - 이스라엘의 신
  lexicon: אלהים
  rationale: 관용적이면서도 원문의 소유격 관계를 그대로 반영하는 표현으로, ‘하나님’이 POB의 기본 용례에 맞습니다.
- source_word: אֲשֶׁר הִתְפַּלַּלְתָּ אֵלַי ... שָׁמַעְתִּי
  english_pob_choice: Because you have prayed to me ... I have heard
  chosen_korean: 네가 ... 내게 기도하였으니, 내가 들었다
  alternatives_korean:
  - 네가 ... 내게 기도했기 때문에, 내가 들었다
  - 네가 ... 내게 기도한 것을 내가 들었다
  lexicon: הִתְפַּלֵּל / שׁמע
  rationale: 영문 POB의 ‘Because’를 반영하되, 히브리어는 이유절과 결과절 구조를 함께 담고 있어 ‘-하였으니’로 인과를 살리면서 ‘들었다’로 하나님의 응답을 간결하게 유지했습니다.
theological_decisions:
- issue: YHWH의 번역 방식
  chosen_reading: 본문의 יְהוָה를 ‘야훼’로 표기하고, 인용문 안에서 하나님의 직접 화행을 분명히 드러냈습니다.
  alternative_readings:
  - ‘여호와’로 전통 교회 용어를 따름
  - ‘주님’으로 완곡하게 처리
  rationale: POB의 기본 원칙은 신명(神名)을 학술적으로 투명하게 드러내는 것이므로, 전통적 교회어보다 원문 고유성 보존을 우선했습니다.
  doctrine_reference: 출 3:15의 신명 계시와 YHWH 표기 원칙
