base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/029.yaml
  text: 'And this shall be the sign for you: this year eat what grows by itself[a], and in the second year what springs from that; and in the third year sow and reap[b], and plant vineyards and eat their fruit.'
  footnotes:
  - marker: a
    text: Or 'volunteer growth' for 'what grows by itself'; the Hebrew term refers to produce that comes up without sowing.
    reason: lexical_alternative
  - marker: b
    text: The Hebrew word rendered 'what springs from that' is rare and may mean 'second growth'—produce arising in the second year from the previous year's unsown crop.
    reason: lexical_alternative
translation:
  language: ko
  text: 「이것이 당신을 위한 표징입니다. 올해는 저절로 난 것을 먹고, 둘째 해에는 그로부터 난 것을 먹으며, 셋째 해에는 씨를 뿌리고 거두고 포도원을 심고 그 열매를 먹으십시오.」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저절로 난 것’은 씨를 뿌리지 않아도 난 산물을 가리키는 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그로부터 난 것’은 둘째 해에 앞해의 무파종 산물에서 이어지는 두 번째 자람을 가리키는 희귀어를 넓게 옮긴 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  english_pob_choice: the sign
  chosen_korean: 표징
  alternatives_korean:
  - 징조
  - 표적
  lexicon: HALOT
  rationale: אוֹת는 문맥상 확인을 위한 ‘sign’이므로, ‘표징’이 가장 자연스럽고 예언적 확증의 기능을 잘 드러냅니다.
- source_word: סָפִיחַ
  english_pob_choice: what grows by itself
  chosen_korean: 저절로 난 것
  alternatives_korean:
  - 자라난 것
  - 자생한 것
  - 자연 발생한 수확물
  lexicon: HALOT
  rationale: 씨를 뿌리지 않아도 올라오는 산물을 가리키므로, 현대 한국어에서 이해하기 쉬운 ‘저절로 난 것’으로 옮겼습니다.
- source_word: סָחִישׁ
  english_pob_choice: what springs from that
  chosen_korean: 그로부터 난 것
  alternatives_korean:
  - 둘째 해의 새순
  - 둘째 해의 자람
  lexicon: HALOT
  rationale: 희귀어라 세부 식별을 과도하게 특정하지 않고, 앞선 무파종 수확의 연속성을 살리는 최소한의 표현으로 처리했습니다.
- source_word: וְאִכְלוּ פִרְיָם
  english_pob_choice: and eat their fruit
  chosen_korean: 그 열매를 먹으십시오
  alternatives_korean:
