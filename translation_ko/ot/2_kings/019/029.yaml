  lexicon: HALOT
  rationale: 문맥상 명령/예언적 지시의 연속이므로 합쇼체 명령형으로 통일했고, 복수 소유격은 자연스러운 ‘그 열매’로 옮겼습니다.
theological_decisions:
- issue: 직설적 예언 지시문의 한국어 문체
  chosen_reading: 이 구절은 표징 선언 뒤에 이어지는 농업적 지시이므로, 존대 명령형 ‘먹으십시오’로 옮겨 예언적 확언의 공적 성격을 살렸습니다.
  alternative_readings:
  - 먹으세요
  - 먹게 될 것입니다
  rationale: 히브리어 연속 명령형/예언적 사용을 반영하면서도, 한국어 성경 문체에서 너무 구어체이거나 단순 미래형으로 흐르지 않게 하기 위함입니다.
  doctrine_reference: 예언적 표징과 확증의 문체
