  text: הִנֵּ֣ה אַתָּ֣ה שָׁמַ֗עְתָּ אֵת֩ אֲשֶׁ֨ר עָשׂ֜וּ מַלְכֵ֥י אַשּׁ֛וּר לְ/כָל הָ/אֲרָצ֖וֹת לְ/הַֽחֲרִימָ֑/ם וְ/אַתָּ֖ה תִּנָּצֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/011.yaml
  text: Look[a], you have heard what the kings of Assyria have done to all the lands, devoting them to destruction—and will you be delivered?
  footnotes:
  - marker: a
    text: Or 'utterly destroying them'; Hebrew 'putting them under the ban,' that is, devoting them to destruction.
    reason: lexical_alternative
translation:
  language: ko
  text: 보십시오, 당신은 앗시리아 왕들이 모든 땅을 진멸하도록 바친 일을 들었습니다. 그런데 당신이 구원을 받겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 완전히 멸한 것’; 히브리어는 ‘헤렘 아래 두어 진멸하도록 바치는 것’을 뜻합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  english_pob_choice: Look
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  - 주목하십시오
  lexicon: HALOT
  rationale: 주의를 끄는 감탄·지시 표현으로서 현대 한국어에서는 ‘보십시오’가 가장 자연스럽고, 영어 POB의 ‘Look’이 가진 직접성을 잘 살립니다.
- source_word: שָׁמַעְתָּ
  english_pob_choice: have heard
  chosen_korean: 들었습니다
  alternatives_korean:
  - 들으셨습니다
  - 들어 왔습니다
  lexicon: HALOT
  rationale: 이미 들은 사실이 현재의 논증 근거가 되므로 완료의 뉘앙스를 살린 ‘들었습니다’가 적절합니다.
- source_word: לְהַחֲרִימָם
  english_pob_choice: devoting them to destruction
  chosen_korean: 그것들을 멸하기 위해
  alternatives_korean:
  - 그것들을 완전히 멸하기 위해
  - 그것들을 진멸하기 위해
  - 그것들을 저주 아래 두어 멸하기 위해
  lexicon: HALOT
  rationale: חרם의 기술적 뉘앙스를 살리되, 본문 흐름에서는 ‘멸하기 위해’가 가장 간명합니다. 본문은 군사적 파괴 행위를 강조하므로 오해를 줄이기 위해 설명적 표현을 택했습니다.
- source_word: וְאַתָּה תִּנָּצֵל
  english_pob_choice: and will you be delivered?
  chosen_korean: 그런데 당신이 구원받을 수 있겠습니까?
  alternatives_korean:
  - 그런데 당신이 구원되겠습니까?
  - 그런데 당신이 빠져나갈 수 있겠습니까?
  lexicon: HALOT
  rationale: 니팔형의 수동적 의미를 살려 ‘구원받다’로 옮겼고, 수사적 반문을 한국어에서도 분명하게 드러냈습니다.
theological_decisions:
- issue: חרם(ḥerem) 언어의 번역 강도
  chosen_reading: ‘멸하기 위해’로 옮기되, 본문에서는 전문 용어를 과도하게 드러내지 않았습니다.
  alternative_readings:
  - ‘진멸하기 위해’
  - ‘멸망시키도록 바치기 위해’
  - ‘멸절시키기 위해’
  rationale: 본문의 핵심은 앗시리아의 파괴 행위가 하나님의 심판적 맥락 속에서 제시된다는 점입니다. 한국어 본문은 읽기성을 위해 간결하게 유지하고, ḥerem의 특수성은 어휘 결정을 통해 보존했습니다.
  doctrine_reference: Translation philosophy §1, §5
