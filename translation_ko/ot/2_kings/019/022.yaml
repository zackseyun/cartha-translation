id: 2KI.19.22
reference: 2 Kings 19:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: אֶת מִ֤י חֵרַ֨פְתָּ֙ וְ/גִדַּ֔פְתָּ וְ/עַל מִ֖י הֲרִימ֣וֹתָ קּ֑וֹל וַ/תִּשָּׂ֥א מָר֛וֹם עֵינֶ֖י/ךָ עַל קְד֥וֹשׁ יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/022.yaml
  text: Whom have you mocked and blasphemed? Against whom have you raised your voice and lifted your eyes on high? Against the Holy One of Israel[a][b].
  footnotes:
  - marker: a
    text: Or 'reproached and reviled.' The Hebrew verbs are near-synonyms for scornful, abusive speech; the second can specifically carry the sense of blaspheming God.
    reason: lexical_alternative
  - marker: b
    text: Literally 'lifted your eyes to the height,' an idiom expressing haughtiness or arrogant self-exaltation.
    reason: cultural_note
translation:
  language: ko
  text: 당신은 누구를 조롱하고 모독하였습니까? 누구를 향해 목소리를 높이고 눈을 높이 들었습니까? 이스라엘의 거룩하신 분을 향한 것이었습니다[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘조롱하다/모독하다’는 히브리어의 서로 가까운 두 동사를 반영한 번역입니다. 둘째 동사는 특히 하나님을 향한 모독의 뜻을 강하게 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘눈을 높이 들어 올리다’라는 관용적 표현으로, 교만하고 오만하게 자신을 높이는 태도를 나타냅니다.
    reason: cultural_note
lexical_decisions:
- source_word: חֵרַפְתָּ
  english_pob_choice: mocked
  chosen_korean: 조롱하다
  alternatives_korean:
  - 모욕하다
  - 비웃다
  - 능멸하다
  lexicon: HALOT
  rationale: חרף는 이 문맥에서 경멸적이고 조롱하는 말을 뜻하므로, 현대 한국어에서 자연스럽고 대응되는 ‘조롱하다’로 옮겼습니다.
- source_word: גִדַּפְתָּ
  english_pob_choice: blasphemed
  chosen_korean: 모독하다
  alternatives_korean:
  - 저주하다
  - 능욕하다
  - 욕되게 하다
  lexicon: HALOT
  rationale: גדף는 특히 하나님을 향한 모독적 발화를 가리킬 수 있으므로, 종교적 무게를 살리는 ‘모독하다’를 선택했습니다.
- source_word: הֲרִימוֹתָ קּוֹל
  english_pob_choice: raised your voice
  chosen_korean: 목소리를 높이다
  alternatives_korean:
  - 소리를 높이다
  - 목소리를 치켜세우다
  lexicon: HALOT
  rationale: 직역보다 자연스러운 현대어로, 도전적이고 거만한 발성을 드러내는 관용구를 살렸습니다.
- source_word: וַתִּשָּׂא מָרוֹם עֵינֶיךָ
  english_pob_choice: lifted your eyes on high
  chosen_korean: 눈을 높이 들다
  alternatives_korean:
  - 눈을 치켜들다
  - 눈을 위로 들다
  lexicon: HALOT
  rationale: 히브리어 관용구의 ‘높이/교만한 눈’ 이미지를 유지하면서도 한국어에서 이해가 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 야훼에 대한 공격을 단순한 정치적 오만이 아니라 신성모독으로 드러낼지 여부
  chosen_reading: ‘모독하다’와 ‘이스라엘의 거룩하신 분’을 함께 사용해, 발언의 대상이 하나님이심을 분명히 했습니다.
  alternative_readings:
  - ‘욕되게 하다’처럼 더 중립적인 표현으로 낮추기
  - ‘거룩하신 이스라엘의 하나님’으로 풀어 쓰기
  rationale: 본문은 인간 통치자에 대한 불경이 아니라 이스라엘의 하나님을 향한 신성모독을 고발합니다. 한국어에서도 그 신학적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: Translation philosophy §§1, 6
