reference: 2 Kings 19:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: WLC
  text: הֲ/לֹֽא שָׁמַ֤עְתָּ לְ/מֵֽ/רָחוֹק֙ אֹתָ֣/הּ עָשִׂ֔יתִי לְ/מִ֥/ימֵי קֶ֖דֶם וִֽ/יצַרְתִּ֑י/הָ עַתָּ֣ה הֲבֵיאתִ֗י/הָ וּ/תְהִ֗י לַ/הְשׁ֛וֹת גַּלִּ֥ים נִצִּ֖ים עָרִ֥ים בְּצֻרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/2_kings/019/025.yaml
  text: Have you not heard? Long ago I made it[a]; from days of old I formed it. Now I have brought it to pass[c][b], that you should lay waste fortified cities into heaps of ruins.
  footnotes:
  - marker: a
    text: 'Or ''from afar''; the Hebrew expression can be read spatially, but here likely has a temporal sense: ''long ago.'''
    reason: lexical_alternative
  - marker: b
    text: Or 'I fashioned it.'
    reason: lexical_alternative
  - marker: c
    text: Literally 'heaps, ruins'; the Hebrew phrase is difficult and may also be rendered 'standing heaps.'
    reason: lexical_alternative
translation:
  language: ko
  text: “너는 듣지 않았습니까? 내가 오래전에 그것을 만들었고[a], 옛적부터 그것을 빚어 두었습니다[b]. 이제 내가 그것을 이루었으니, 네가 견고한 성읍들을 폐허의 돌무더기로 만들게 하였습니다[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘오래전에’는 문자적으로는 ‘멀리서부터’로도 옮길 수 있습니다. 이 문맥에서는 뒤의 ‘옛적부터’와 병행되어 시간적 의미로 이해됩니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘형성하였습니다’.
    reason: lexical_alternative
  - marker: c
    text: 히브리어 표현은 난해합니다. 직역에 가깝게는 ‘더미, 폐허’이며, ‘서 있는 더미’로 이해될 가능성도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא שָׁמַעְתָּ
  english_pob_choice: Have you not heard?
  chosen_korean: “듣지 않았습니까?”
  alternatives_korean:
  - “들어 보지 않았습니까?”
  - “알지 못했습니까?”
  lexicon: HALOT
  rationale: 수사 의문문의 예상을 살리되, 표준 한국어에서는 동사의 대상이 암시되므로 간결하게 ‘듣지 않았습니까?’로 옮겼습니다.
- source_word: לְמֵרָחוֹק
  english_pob_choice: Long ago
  chosen_korean: “멀리서부터”
  alternatives_korean:
  - “오래전에”
  - “먼 옛날부터”
  lexicon: HALOT
  rationale: 히브리어는 문자적으로는 공간적 표현이지만 문맥상 시간 의미가 강합니다. 다만 원문의 이중 가능성을 보존하려고 본문에는 직역 쪽을 두고, 시간 의미는 뒤의 ‘옛날에 / 먼 옛날부터’로 분명히 했습니다.
- source_word: עָשִׂיתִי / וִיצַרְתִּיהָ
  english_pob_choice: I made it / I formed it
  chosen_korean: “내가 그것을 옛날에 만들었고, 먼 옛날부터 그것을 지었습니다”
  alternatives_korean:
  - “내가 그것을 만들었고, 빚었습니다”
  - “내가 그것을 만들었고, 형성했습니다”
  lexicon: HALOT
  rationale: עשה와 יצר의 병행을 살려 첫 항은 ‘만들다’, 둘째 항은 ‘짓다’로 두어, 단순 제작보다 하나님의 선행 계획과 형성의 뉘앙스를 전달했습니다.
- source_word: גַּלִּים נִצִּים
  english_pob_choice: heaps of ruins / standing heaps
  chosen_korean: “무너진 더미”
  alternatives_korean:
  - “폐허의 더미”
  - “서 있는 더미”
  lexicon: HALOT
  rationale: 어려운 구절이지만 문맥상 전쟁으로 인한 폐허 상태를 가리키므로, 한국어에서는 자연스럽고 가시적인 ‘무너진 더미’로 압축했습니다.
theological_decisions:
- issue: 하나님의 선행 계획과 앗수르의 파괴 행위 표현
  chosen_reading: 본문은 앗수르 왕의 정복이 하나님의 오래된 목적 안에서 이루어졌음을 말하지만, 그 행위 자체에 대한 도덕적 승인까지는 말하지 않도록 번역했습니다.
  alternative_readings:
  - 더 강한 결정론적 표현
  - 단순한 예지에 가깝게 약화한 표현
  rationale: ‘만들었고… 지었습니다 / 이루어’라는 동사 연쇄를 살리되, 신학적 결론을 본문보다 더 앞서지 않게 했습니다.
  doctrine_reference: Affirmations; Translation philosophy §3
