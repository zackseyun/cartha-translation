    rationale: 영어의 이전 독법 ‘loins’ 관련 각주는 현재 ‘entrails’ 본문을 위한 한국어 각주로 제시되지 않았습니다. 미해결 앵커를 삭제하고 각주를 두지 않아야 합니다.
