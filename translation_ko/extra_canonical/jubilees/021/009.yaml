  yaml_path: translation/extra_canonical/jubilees/021/009.yaml
  text: The fat that is on them, and that which is on the entrails, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering.
  footnotes:
  - marker: a
    text: Or 'the loins'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 위에 붙어 있는 지방과 내장 위에 붙어 있는 지방과 간과 콩팥을 제거하십시오. 그리고 이 모든 것을 곡식 제물과 함께, 주님 앞에서 받아들여질 만한 향기로운 냄새로 바치십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስብሐ
  english_pob_choice: the fat that is on them
  chosen_korean: 그 위에 있는 기름
  alternatives_korean:
  - 그 위의 기름
  - 그들 위에 있는 지방
  lexicon: Ge'ez sacrificial terminology
  rationale: 문맥이 희생 제의 규정이므로 신체의 지방을 가리키는 제의적 표현으로 옮겼습니다. 현대 한국어에서는 '기름'이 자연스럽지만, 제의 맥락에서 '지방'도 가능하여 대안으로 남깁니다.
- source_word: ዘዲቤሆሙ / መናቅፅ
  english_pob_choice: that which is on the entrails
  chosen_korean: 그 창자에 있는 것
  alternatives_korean:
  - 그 내장에 있는 것
  - 창자 위에 있는 것
  lexicon: Ge'ez sacrificial terminology
  rationale: 영어 POB의 최신 수정이 መናቅፅ을 'entrails'로 조정한 점을 반영했습니다. '창자'는 본문이 요구하는 내부 장기 이미지를 가장 직접적으로 전달합니다.
- source_word: ቅድመ፡ እግዚአብሔር
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주 앞에서
  - 주님 앞에
  lexicon: divine address / reverential formulation
  rationale: 에티오피아어 본문의 '하나님 앞에서'에 해당하는 제의적 관용구를 한국어 성서 문체로 자연스럽게 옮겼습니다. 여기서 '주님'은 야훼에 대한 경외적 표현입니다.
- source_word: መሥዋዕቱ
  english_pob_choice: with its grain offering
  chosen_korean: 곡식 제물과 함께
  alternatives_korean:
  - 소제와 함께
  - 곡식 제사와 함께
  lexicon: sacrificial offering terminology
  rationale: 히브리 성경의 제의 어휘와 영어 POB의 'grain offering'을 따라 '곡식 제물'로 옮겼습니다. 전통적 '소제'보다 의미가 드러나고, 본문의 제물 병치 구조도 잘 보입니다.
theological_decisions:
- issue: 제의적 향기 표현의 신학적 기능
  chosen_reading: '''받아들여질 만한 향기로운 냄새''로 옮겨, 제물이 하나님께 기쁘게 열납된다는 의미를 유지했습니다.'
  alternative_readings:
  - '''향기로운 제물'''
  - '''기쁘게 받으실 향기'''
  rationale: 원문은 단순한 후각 묘사가 아니라 제사가 주님께 합당하게 받아들여지는 신학적 표현입니다. 따라서 '향기로운 냄새'와 '받아들여질 만한'을 함께 살렸습니다.
  doctrine_reference: 제사 열납 / 레 1:9, 3:5의 제의 관용구
- issue: 주님 표기의 대상
  chosen_reading: 문맥상 '주님'은 야훼를 가리키는 제의 규정의 하나님으로 이해했습니다.
  alternative_readings:
  - 하나님
  - 야훼
  rationale: 이 책의 제의 문맥에서는 경외적 호칭이 가장 자연스럽고, 본문은 인물의 직접 발화가 아닌 규정 서술이므로 한국어 문체상 '주님'을 사용했습니다.
  doctrine_reference: 야훼 명칭 표기 원칙
