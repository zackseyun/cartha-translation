  - severity: low
    issue: ‘그 창자에 있는 것’의 수식 관계가 불명확함
    rationale: 원문과 영어의 병렬은 내장 위에 있는 지방을 가리킵니다. ‘내장 위에 붙어 있는 지방’으로 명시하면 의미가 자연스럽고 분명해집니다.
