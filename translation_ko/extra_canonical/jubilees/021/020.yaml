translation:
  language: ko
  text: 그리고 사람의 피를 두고 뇌물이나 예물을 받지 마십시오. 피는 피로 갚아야 하며, 그것은 주님 곧 지극히 높으신 하나님 앞에서 갚아야 합니다. 이것이 그대를 위한 좋은 보호가 되어, 모든 악에서 그대를 지켜 주고 모든 죽음에서 그대를 구해 줄 것입니다. 내 아들아, 나는 사람들의 모든 행위를 봅니다. 그들의 모든 죄와 악과 그들의 모든 행위는 부정과 가증함과 더러움이며, 그들 가운데에는 의가 없습니다. 조심하여 그들의 길로 가지 말고 그들의 행로를 밟지도 마십시오. 지극히 높으신 하나님 앞에서 죽음에 이르는 죄를 짓지 마십시오. 그렇지 않으면 그분이 그대에게서 얼굴을 감추시고 그대를 원수들의 손에 넘기시며, 그대를 땅에서 뽑아 버리고 그대의 씨를 하늘 아래에서 뿌리째 뽑으시며, 온 땅에서 그대의 이름과 그대의 씨를 멸하실 것입니다. 그들의 모든 행위와 모든 더러움에서 돌아서십시오. 지극히 높으신 하나님의 명령을 지키고, 그분의 뜻을 행하며, 모든 일에서 바르게 행하십시오. 그러면 그분이 그대의 모든 일에 복을 주시고, 온 땅에 걸쳐 땅의 모든 세대 가운데 그대에게서 의의 나무를 일으키실 것입니다. 내 이름과 그대의 이름은 영원히 하늘 아래에서 잊히지 않을 것입니다. 내 아들아, 평안히 가십시오. 지극히 높으신 하나님, 곧 나의 하나님이시며 그대의 하나님이신 분께서 그대가 그분의 뜻을 행하도록 굳세게 하시기를 바랍니다. 또한 그분이 그대의 모든 씨와 그대의 씨의 남은 자에게 영원한 세대에 이르도록 모든 의로운 복으로 복을 주셔서, 그대가 온 땅에 복이 되게 하시기를 바랍니다.” 그리고 그는 기뻐하며 그의 곁을 떠났습니다.
  philosophy: optimal-equivalence
