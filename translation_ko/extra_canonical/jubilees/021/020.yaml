  alternative_readings:
  - 완화하여 ‘피에 대한 대가는 피로’
  - 법적 의미를 약화한 일반적 상환 표현
  rationale: 게에즈와 EN POB 모두 보응의 강한 문장을 유지하므로, 이를 순화하지 않고 그대로 드러내는 편이 원문의 경고를 가장 잘 보존합니다.
