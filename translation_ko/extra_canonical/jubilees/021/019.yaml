    text: Or 'lest it be exacted from you without judgment'.
    reason: previous_rendering
translation:
  language: ko
  text: 피는 곧 생명이기 때문입니다. 그러므로 어떤 피도 먹지 마십시오. 또한 어떤 사람의 피에 관하여도 선물을 받지 마십시오. 그것이 무죄하게 흘려져도, 심판 없이 흘려지게 되지 않도록 하려는 것입니다. 왜냐하면 흘려진 피가 땅을 더럽히는 것이며, 땅은 그 피를 흘린 자의 피를 제외하고는 사람의 피에서 깨끗해질 수 없기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደመ፡ እስመ፡ ነፍስ፡ ይእቲ
  english_pob_choice: blood at all, because it is the life
  chosen_korean: 피는 곧 생명이기 때문입니다
  alternatives_korean:
  - 피는 생명입니다
  - 그 피는 생명이기 때문입니다
  lexicon: 피/생명
  rationale: Geez의 직설적 동일시를 살려 ‘피 = 생명’의 이유절로 옮기되, 한국어에서는 자연스러운 설명문으로 다듬었습니다.
- source_word: ወኢትብላዕ፡ ምትነኒ፡ ደመ።
  english_pob_choice: do not eat any blood
  chosen_korean: 어떤 피도 먹지 마십시오
  alternatives_korean:
  - 피를 먹지 마십시오
  - 아무 피도 먹지 마십시오
  lexicon: 먹다
  rationale: 금지의 범위를 분명히 드러내는 any blood를 ‘어떤 피도’로 옮겨 원문의 포괄성을 유지했습니다.
- source_word: ወኢትነሣእ፡ ሕልያነ፡ ... ከመ፡ ኢይትከዐው፡ በከ፡ ዘእንበለ፡ ኵነኔ፡
  english_pob_choice: And do not accept a gift concerning any human blood, lest it be shed with impunity, without judgment
  chosen_korean: 또한 어떤 사람의 피에 관하여도 선물을 받지 마십시오. 그것이 무죄하게 흘려져도, 심판 없이 흘려지게 되지 않도록 하려는 것입니다
  alternatives_korean:
  - 또한 어떤 사람의 피와 관련하여도 예물을 받지 마십시오. 그것이 심판 없이 흘려져도 되지 않도록 하려는 것입니다
  - 또한 어떤 사람의 피에 대해 대가를 받지 마십시오. 그것이 무죄하게 흘려져도, 심판 없이 되지 않도록 하려는 것입니다
  lexicon: 선물/심판 없이
  rationale: POB의 ‘gift’는 문맥상 피값이나 배상금 성격의 수수로 보이지만, 원문의 포괄 표현을 유지하여 ‘선물’로 두고, ‘with impunity, without judgment’를 ‘무죄하게… 심판 없이’로 반영했습니다.
- source_word: ደም፡ ውእቱ፡ ዘይትከዐው፡ ያንጥኦ፡ ለምድር፡
  english_pob_choice: for it is the blood that is shed which pollutes the earth
  chosen_korean: 왜냐하면 흘려진 피가 땅을 더럽히는 것이며
  alternatives_korean:
  - 왜냐하면 흘려진 피가 땅을 오염시키기 때문이며
  - 왜냐하면 흘린 피가 땅을 더럽히기 때문입니다
  lexicon: 더럽히다
  rationale: ‘pollutes’의 도덕·제의적 오염 뉘앙스를 한국어의 ‘더럽히다’가 가장 간명하게 전달합니다.
- source_word: ወምድር፡ ኢትክል፡ ነጺሐ፡ እምደመ፡ ሰብእ፡ ...
  english_pob_choice: and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it
  chosen_korean: 땅은 그 피를 흘린 자의 피를 제외하고는 사람의 피에서 깨끗해질 수 없기 때문입니다
  alternatives_korean:
  - 땅은 그 피를 흘린 자의 피 외에는 사람의 피에서 깨끗해질 수 없기 때문입니다
  - 땅은 그 피를 흘린 자의 피가 아니고서는 사람의 피에서 깨끗해질 수 없기 때문입니다
  lexicon: 깨끗해지다
  rationale: 정결/정화의 수동 가능성을 살리기 위해 ‘cleansed’를 ‘깨끗해질 수 없다’로 옮겼고, 배제 절은 ‘제외하고는’으로 자연화했습니다.
theological_decisions:
- issue: 피의 금지 근거를 ‘생명’과 연결하는 방식
  chosen_reading: 본문은 피를 단순한 물질이 아니라 생명 자체와 연결된 것으로 제시하므로, 금지의 근거를 윤리 규정이 아니라 생명 보존의 질서로 드러냈습니다.
  alternative_readings:
  - 단순한 식이 금지로만 읽기
  - 제의적 규정으로만 축소하기
  rationale: Geez 원문과 POB는 모두 ‘피 = 생명’의 이유를 전면에 내세우므로, 한국어도 그 신학적 이유를 명시적으로 드러내야 합니다.
  doctrine_reference: 레위기 17장 및 창세기 9장의 피/생명 신학
- issue: ‘무죄하게 흘려져도, 심판 없이’의 이중 표현
  chosen_reading: 원문의 ‘in vain/with impunity’와 ‘without judgment’를 각각 ‘무죄하게’와 ‘심판 없이’로 이중 반영했습니다.
  alternative_readings:
  - 둘 중 하나만 번역하기
  - ‘처벌 없이’로 통일하기
  rationale: 개정된 영어 POB가 ‘with impunity, without judgment’로 구분한 점을 따라, 한국어에서도 두 층위를 분리해 보존했습니다.
  doctrine_reference: 공의로운 심판과 피흘림의 책임성
