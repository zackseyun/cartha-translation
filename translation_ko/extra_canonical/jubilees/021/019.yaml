    rationale: ‘되지 않도록 하려는 것입니다’는 원문의 금지와 결과 회피 관계를 해설적으로 바꾸며, ‘그것’의 지시 대상도 불명확합니다. 금지 명령에 직접 연결해야 합니다.
  - severity: low
