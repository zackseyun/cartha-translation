    rationale: ‘구하다’는 한국어에서 대체로 요청하거나 얻으려 한다는 의미로 이해되어, 원문의 ‘온 마음으로 … 행하고자 찾고/힘쓰다’라는 지속적 추구를 어색하게 만들 수 있습니다. ‘힘써 왔습니다’가 목적어와 자연스럽게 결합하면서도 원문의 의미를 보존합니다.
