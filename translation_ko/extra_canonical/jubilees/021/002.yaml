  text: And behold, I am one hundred and seventy-five years old, and throughout all the days of my life I have remembered the Lord, seeking with all my heart to do his will.
translation:
  language: ko
  text: 보십시오. 저는 백칠십오 세입니다. 그리고 제 생애의 모든 날 동안 주님을 기억해 왔고, 온 마음을 다해 그분의 뜻을 행하려고 구해 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이제 보십시오
  lexicon: source particle / discourse marker
  rationale: 서두의 주목 환기 표현을 자연스러운 현대 한국어 명령형 화법으로 옮겨, 말하는 이가 청자를 직접 주목시키는 효과를 살렸습니다.
- source_word: ወልደ ምእት ወሰብዓ ወኃምስቱ ዓመት
  english_pob_choice: one hundred and seventy-five years old
  chosen_korean: 백칠십오 세입니다
  alternatives_korean:
  - 백일흔다섯 살입니다
  - 일백칠십오 세입니다
  lexicon: numeral expression
  rationale: 연령 진술이므로 문어체에서 가장 자연스러운 연령 표현을 사용했고, 합쇼체 종결로 인물의 직접 발화를 유지했습니다.
- source_word: ሀሎኩ እንዘ እዜከር ለእግዚአብሔር
  english_pob_choice: I have remembered the Lord
  chosen_korean: 주님을 기억해 왔고
  alternatives_korean:
  - 주님을 기억했습니다
  - 주님을 늘 생각해 왔고
  lexicon: remember / keep in mind
  rationale: 전승문맥상 단순 과거보다 삶 전체의 지속성을 드러내는 현재완료적 뉘앙스가 있어, 한국어에서는 ‘-해 왔고’로 이어지는 지속성을 살렸습니다.
- source_word: ፈቃደቲሁ
  english_pob_choice: his will
  chosen_korean: 그분의 뜻
  alternatives_korean:
  - 그분의 의지
  - 그분의 뜻하심
  lexicon: divine will
  rationale: 하나님의 ‘의지’보다 한국어 성경에서 더 직접적으로 이해되는 ‘뜻’을 택하되, 원문의 지시 대상이 분명하도록 대명사로 받았습니다.
theological_decisions:
- issue: ‘with all my heart’의 충실한 감정·의지 강조
  chosen_reading: 온 마음을 다해
  alternative_readings:
  - 마음을 다해
  - 온 힘을 다해
  rationale: 원문은 정서적 헌신과 의지의 총체성을 강조하므로, 한국어에서도 관용적으로 이해되는 ‘온 마음을 다해’로 강도를 유지했습니다.
  doctrine_reference: 전인적 헌신에 대한 성경적 표현
- issue: 주님(= the Lord)의 호칭 처리
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 절의 영어 POB가 단순히 ‘the Lord’를 사용하고 있으며, 주석상 야훼 인용 표지가 없는 직접 서술이므로 한국어 본문에서는 문맥상 가장 자연스러운 ‘주님’을 사용했습니다.
  doctrine_reference: 호칭 번역 일관성
