    text: The chapter numbering in the source rows appears to skip from v. 15 to v. 17. No separate English v. 16 is supplied because the provided Ge'ez segmentation contains no distinct row for it.
    reason: segmentation_note
  - marker: a
    text: Or 'go in.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 명령을 지키고 행하라[15], 내 아들아. 네 모든 행실에서 바르게 살아가도록 하여라. 언제나 네 몸을 정결하게 하라. 제단에 올라가 제사를 드리기 전에 물로 몸을 씻고, 제단에 가까이 가기 전에 손과 발을 씻어라. 그리고 제사를 마치면 돌아가라.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: 자료의 장절 구분에는 15절 다음에 17절이 오는 것으로 보입니다. 제공된 게에즈어 구분에는 별도의 16절 행이 없으므로, 별도의 16절 한국어 본문은 제시하지 않습니다.
    reason: segmentation_note
  - marker: a
    text: 또는 ‘들어가라’.
    reason: previous_rendering
