  chosen_korean: 제단에 올라가 제사드리기 전에
  alternatives_korean:
  - 제단에 올라가 바치기 전에
  - 제단으로 올라가 예물 드리기 전에
  lexicon: 올라가다 / 제사드리다
  rationale: 개정된 영어 본문의 ‘go up’에 맞춰 상승 동사를 살리고, 제의적 행위를 ‘제사드리다’로 분명하게 했습니다.
- source_word: ግባእ
  english_pob_choice: return
  chosen_korean: 돌아가라
  alternatives_korean:
  - 들어가라
