  chosen_korean: 네 모든 행실에서 바르게 걸을 것이다
  alternatives_korean:
  - 네 모든 행위 가운데 올바르게 행할 것이다
  - 네 모든 일에서 의롭게 걸을 것이다
  lexicon: 올바르게 걷다 / 행실
  rationale: 히브리적 ‘걷다’의 도덕적 삶의 이미지를 살리면서, ‘모든 행실’로 전체 삶의 범위를 드러냈습니다.
- source_word: ንጹሐ፡ በሥጋከ
  english_pob_choice: be pure in your body
  chosen_korean: 네 몸을 깨끗하게 하라
  alternatives_korean:
  - 네 육체를 정결하게 하라
  - 네 몸 안팎을 깨끗하게 하라
  lexicon: 깨끗하다 / 몸
  rationale: 정결 규례의 맥락이므로 ‘깨끗하게 하다’가 자연스럽고, ‘몸’은 본문의 물리적 몸을 직접 반영합니다.
- source_word: ታርትዕ፡ ... ለአዕርጎ፡ ውስተ፡ ምሥዋዕ
  english_pob_choice: go up to offer on the altar
  chosen_korean: 제단에 올라가 제사드리기 전에
  alternatives_korean:
  - 제단에 올라가 바치기 전에
  - 제단으로 올라가 예물 드리기 전에
  lexicon: 올라가다 / 제사드리다
  rationale: 개정된 영어 본문의 ‘go up’에 맞춰 상승 동사를 살리고, 제의적 행위를 ‘제사드리다’로 분명하게 했습니다.
- source_word: ግባእ
  english_pob_choice: return
  chosen_korean: 돌아가라
  alternatives_korean:
  - 들어가라
  - 가라
  lexicon: 돌아가다
  rationale: 최신 교정에서 이 동사가 ‘return’으로 확정되었으므로, ‘돌아가라’가 가장 정확합니다.
theological_decisions:
- issue: 정결 규례의 윤리적 표현
  chosen_reading: 본문의 물 씻음과 몸의 정결을 문자적으로 옮겨, 제사 전 정결 규범의 실천적 요구를 드러냈습니다.
  alternative_readings:
  - 비유적으로 ‘마음을 깨끗하게 하라’로 완화하는 해석
  - ‘정결하다’를 제의적 의미로만 축소하는 해석
  rationale: 여기서는 내적 도덕화보다 제의적·육체적 정결의 직접성을 유지하는 것이 स्रोत 의미에 더 충실합니다.
  doctrine_reference: 정결 규례 / 제의적 성결
