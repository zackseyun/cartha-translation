  text: And in the sixth year of the seventh week of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and I am full of my days.”
  footnotes:
  - marker: a
    text: Or 'my days are fulfilled'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 희년의 일곱째 주의 여섯째 해에 아브라함이 자기 아들 이삭을 불러 그에게 명하며 말했습니다. "나는 늙었고, 내 죽음의 날을 알지 못하며, 내 날들이 차 있습니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘሳብዕ፡ ሱባዔ
  english_pob_choice: the seventh week
  chosen_korean: 일곱째 주
  alternatives_korean:
  - 일곱째 주간
  - 일곱째 칠년 주기
  lexicon: 주
  rationale: 문맥상 희년의 주기는 ‘week’이지만, 한국어에서는 간결하게 ‘일곱째 주’가 자연스럽고 원문의 주기성을 유지합니다.
- source_word: ጸውዐ፡
  english_pob_choice: called
  chosen_korean: 불러
  alternatives_korean:
  - 소집하여
  - 호명하여
  lexicon: 부르다
  rationale: 아브라함이 이삭을 직접 불러 말하는 동작을 가장 자연스럽고 직설적으로 옮기기 위해 ‘불러’를 선택했습니다.
- source_word: ወአዘዞ፡
  english_pob_choice: instructed him
  chosen_korean: 그에게 명하며
  alternatives_korean:
  - 그에게 지시하며
  - 그에게 가르치며
  lexicon: 명하다
  rationale: 주석된 영어 번역의 ‘instructed’는 단순한 조언보다 권위 있는 지시를 포함하므로, 서술의 무게를 살려 ‘명하다’로 옮겼습니다.
- source_word: ዕለተ፡ ሞትየ፡
  english_pob_choice: the day of my death
  chosen_korean: 내 죽음의 날
  alternatives_korean:
  - 내가 죽는 날
  - 내 임종의 날
  lexicon: 죽음
  rationale: 게에즈 원문의 소유격 구조를 그대로 반영하여 ‘내 죽음의 날’로 옮겼고, 문학적 관용도 유지했습니다.
- source_word: ወጸገብኩ፡ መዋዕልየ፡
  english_pob_choice: I am full of my days
  chosen_korean: 내 날들이 차 있습니다
  alternatives_korean:
  - 내 날들이 채워졌습니다
  - 내 삶의 날수가 가득 찼습니다
  lexicon: 날들
  rationale: 최신 영어 본문이 문법상 1인칭 ‘I am full’로 수정된 점을 반영해, ‘내 날들이 차 있습니다’로 관용적이며 본문 충실하게 표현했습니다.
theological_decisions:
- issue: ‘I am full of my days’의 관용구 처리
  chosen_reading: 아브라함이 생의 때가 충만해졌음을 말하는 관용적 자기 진술로 읽었습니다.
  alternative_readings:
  - 내 날들이 완료되었습니다
  - 내 날 수가 다했습니다
  rationale: 게에즈 동사 형태와 영어 POB의 수정 이력을 함께 보면, 단순한 수량 완료보다 생애가 충만히 찬 상태를 말하는 관용구로 보는 것이 가장 자연스럽습니다.
  doctrine_reference: 창세기 25:8의 유사 표현과 비교되는 노년·임종 준비의 서술
