revisions:
- from: 그리고 그 음료제와 함께, 여호와께 향기로운 냄새가 되는 소제입니다. 그 고기를 그날과 둘째 날에 먹으십시오. 둘째 날 그것이 먹히기까지는 해가 그것 위에 지지 못하게 하십시오. 그리고 셋째 날을 위하여는 아무것도 남기지 마십시오. 그것은 받아들여지지 않기 때문입니다. 그것은 부정한 것이므로 먹어서는 안 됩니다. 그것을 먹는 모든 사람은 자기 죄를 지을 것입니다. 내가 보니, 이렇게 내 조상들의 책과 옛 사람들의 글과 에녹의 글과 노아의 글에 기록되어 있었습니다.[a]
