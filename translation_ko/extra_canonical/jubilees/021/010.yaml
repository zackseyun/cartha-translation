  source_fidelity: 수정이 필요합니다. ሞጻሕቱ(음료제)와 ኅብስተ፡ጽንሓሕ(소제)를 모두 보존해야 하며, 현 번역은 이 둘을 포함하지만 첫 문장의 술어와 수식 관계가 불분명합니다. 또한 ‘자기 죄를 지을 것입니다’는 ‘죄를 짊어질 것입니다’라는 책임·형벌의 표현을 잘못 옮긴 것입니다. 마지막 문장은 단수 ‘책’ 및 ‘내 조상들, 곧 옛 조상들’을 분명히 해야 합니다.
  naturalness: 현대 표준어 합쇼체로 문장을 정돈했습니다. 특히 ‘둘째 날 그것이 먹히기까지는 해가 그것 위에 지지 못하게 하십시오’는 자연스럽지 않아, 둘째 날 해 지기 전까지 모두 먹어야 한다는 규정으로 명료하게 옮겼습니다.
  terminology: ‘음료제’와 ‘소제’를 구별하여 유지했습니다. ‘profane thing’에 해당하는 표현은 의례적 범주의 훼손을 나타내도록 ‘속된 것’으로 옮겼으며, 일반적 의례 불결을 뜻할 수 있는 ‘부정한 것’은 피했습니다. 신명은 원문의 일반 칭호에 맞추어 ‘주님’으로 옮겼습니다.
  issues:
  - severity: medium
    issue: 첫 문장의 제물 관계와 동작이 불명확함
    rationale: ‘그 음료제와 함께, 여호와께 향기로운 냄새가 되는 소제입니다’는 서술문처럼 읽히고, 음료제와 소제의 관계도 불분명합니다. 원문은 음료제와 함께 드리는 소제를 가리킵니다.
