  rationale: 제물 명칭을 모두 보존하면서 한국어 문장에 필요한 동사 ‘드리십시오’를 보충했습니다. 둘째 날의 일몰 규정, 셋째 날 잔여 금지, 먹는 자의 죄책 부담, 그리고 조상들의 단수 책이라는 문헌 출처를 원문 구조에 맞게 바로잡았습니다. 수식 관계의 불확실성은 각주로 보존했습니다.
