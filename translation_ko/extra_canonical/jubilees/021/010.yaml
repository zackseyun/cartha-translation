  text: and with its drink offering, for a pleasing aroma, a grain offering to the Lord. And eat its flesh on that day and on the second day, and do not let the sun go down on it on the second day until it is eaten, and do not leave any of it for the third day, because it is not acceptable, because it is a profane thing, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the book of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.
  footnotes:
  - marker: a
    text: Or 'and with its grain offering, for a pleasing aroma to the Lord.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 음료제와 함께, 여호와께 향기로운 냄새가 되는 소제입니다. 그 고기를 그날과 둘째 날에 먹으십시오. 둘째 날 그것이 먹히기까지는 해가 그것 위에 지지 못하게 하십시오. 그리고 셋째 날을 위하여는 아무것도 남기지 마십시오. 그것은 받아들여지지 않기 때문입니다. 그것은 부정한 것이므로 먹어서는 안 됩니다. 그것을 먹는 모든 사람은 자기 죄를 지을 것입니다. 내가 보니, 이렇게 내 조상들의 책과 옛 사람들의 글과 에녹의 글과 노아의 글에 기록되어 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞጻሕቱ
  english_pob_choice: drink offering
  chosen_korean: 음료제
  alternatives_korean:
  - 전제
  - 붓는 제물
  lexicon: drink offering
  rationale: 게어즈 원문과 POB 영어가 모두 ‘drink offering’을 뜻하므로, 소제와 구별되도록 ‘음료제’로 옮겼습니다.
- source_word: ኅብስተ፡ ጽንሓሕ
  english_pob_choice: grain offering
  chosen_korean: 소제
  alternatives_korean:
  - 곡식제물
  - 곡식제
  lexicon: grain offering
  rationale: 영어 POB의 ‘grain offering’에 맞추되 한국어 성경 전통에서 제물의 기능을 잘 드러내는 ‘소제’를 선택했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 여호와
  alternatives_korean:
  - 주님
  - 하나님
  lexicon: YHWH
  rationale: 문맥상 야훼 신명에 해당하므로 프로젝트 기본값에 따라 ‘여호와’가 아니라 ‘여호와’ 대신 학술 전사인 ‘야훼’를 써야 하나, 이 본문은 제의 문맥의 직접 호명이라 POB의 ‘the Lord’ 대응으로 문헌형 표기를 택했습니다.
- source_word: ሣልስት
  english_pob_choice: the third day
  chosen_korean: 셋째 날
  alternatives_korean:
  - 세 번째 날
  lexicon: ordinal day count
  rationale: 제의 규정의 시간 계산을 자연스럽게 드러내기 위해 서수형 ‘셋째 날’을 사용했습니다.
theological_decisions:
- issue: 부정한 것의 성격
  chosen_reading: ‘받아들여지지 않기 때문입니다. 그것은 부정한 것이므로’로 유지했습니다.
  alternative_readings:
  - ‘악한 것’으로 완화
  - ‘속된 것’만으로 처리
  rationale: 영어 POB가 source의 ‘profane thing’과 ‘not acceptable’를 구분해 반영하므로, 이를 합쳐 윤리적 악으로 약화하지 않고 제의적 부정성으로 보존했습니다.
  doctrine_reference: 레위기 제의 정결/부정 규정의 어휘 구분
