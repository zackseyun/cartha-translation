  - severity: medium
    issue: 마지막 문장의 문헌 출처 구조가 달라짐
    rationale: 원문은 ‘내 조상들, 곧 옛 조상들의 책’(단수)과 에녹 및 노아의 말을 열거합니다. 초안의 ‘내 조상들의 책과 옛 사람들의 글’은 이를 별개의 두 문헌처럼 만듭니다.
  - severity: low
