  text: its fragrance, because there is no longer fragrance upon it as at first. Other than these woods, do not place any other, because its fragrance is distinct, and the odor of its fragrance goes up to heaven.
translation:
  language: ko
  text: 그 냄새는, 처음과 같이 더 이상 그 위에 향기가 없기 때문입니다. 이 나무들 외에는 다른 것은 두지 마십시오. 그 향기는 분명하며, 그 향기의 냄새가 하늘로 올라갑니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዐዛሁ / its fragrance
  english_pob_choice: its fragrance
  chosen_korean: 그 냄새
  alternatives_korean:
  - 그 향기
  - 그 향내
  lexicon: 향기/냄새
  rationale: 원문은 소유격이 붙은 향취를 가리키므로 ‘그 냄새’로 시작해 대상의 향취를 자연스럽게 드러내되, 뒤에서 ‘향기’로 반복해 향긋한 성격을 살렸습니다.
- source_word: እስመ፡ አልቦ፡ እንከ፡ መዐዛ፡ ላዕሌሁ፡ ከመ፡ ቀዳማዊ
  english_pob_choice: because there is no longer fragrance upon it as at first
  chosen_korean: 처음과 같이 더 이상 그 위에 향기가 없기 때문입니다
  alternatives_korean:
  - 처음처럼 더는 그 위에 향기가 없기 때문입니다
  - 예전처럼 이제 그 위에 향기가 없기 때문입니다
  lexicon: 없다/더 이상
  rationale: ‘이제 더 이상 없다’는 시간적 대비를 분명히 하기 위해 ‘더 이상’을 살렸고, ‘as at first’를 ‘처음과 같이’로 옮겨 원문의 대비를 유지했습니다.
- source_word: ዘእንበለ፡ እሉ፡ ዕፀው፡ አልቦ፡ ዘታነብር፡ ባዕደ
  english_pob_choice: Other than these woods, do not place any other
  chosen_korean: 이 나무들 외에는 다른 것은 두지 마십시오
  alternatives_korean:
  - 이 나무들 외에는 어떤 다른 것도 넣지 마십시오
  - 이 나무들 말고는 다른 것을 넣지 마십시오
  lexicon: place / put
  rationale: 여기서 동사는 봉헌용 나무를 ‘놓다/두다’의 의미로 이해하는 것이 자연스러워 ‘두지 마십시오’로 옮겼습니다. ‘other’는 중복을 피하면서도 금지의 범위를 유지하도록 ‘다른 것’으로 처리했습니다.
- source_word: መዐዛሁ፡ ፍሉጥ፡ ወየዐርግ፡ ፄና፡ መዐዛሁ፡ ውስተ፡ ሰማይ
  english_pob_choice: because its fragrance is distinct, and the odor of its fragrance goes up to heaven
  chosen_korean: 그 향기는 분명하며, 그 향기의 냄새가 하늘로 올라갑니다
  alternatives_korean:
  - 그 향기는 구별되며, 그 향기의 냄새가 하늘로 올라갑니다
  - 그 향기는 뚜렷하며, 그 향기의 냄새가 하늘로 올라갑니다
  lexicon: distinct / odor / goes up
  rationale: POB의 ‘distinct’를 향기의 성격이 혼동되지 않는다는 뜻으로 이해해 ‘분명하며’로 옮겼고, 상승 동작은 원문대로 ‘하늘로 올라갑니다’로 직역해 종결 이미지를 살렸습니다.
theological_decisions:
- issue: 향기의 상징적 상승 표현
  chosen_reading: 물질적 향취의 묘사이면서, 제의적 행위가 하늘에 이르는 향상성을 함께 암시하는 표현으로 유지했습니다.
  alternative_readings:
  - 단순한 후각 묘사로만 제한하는 읽기
  - 기도/예배의 상징으로 강하게 풀어 쓰는 읽기
  rationale: 원문과 POB가 모두 향이 하늘로 올라간다는 이미지를 보존하므로, 과도한 상징화나 축소 없이 제의적 울림을 드러내는 선에서 번역했습니다.
  doctrine_reference: 제의적 언어와 하늘-상향 이미지의 보존
