  chosen_reading: 외형이 시험된 것들, 흠 없는 단단하고 깨끗한 나무, 온전하고 갓 자란 나무로 옮겨 의례적 순수성과 물리적 상태를 함께 보이도록 했습니다.
  alternative_readings:
  - 겉모양이 검증된 것들
  - 살펴본 것들
  rationale: 이 구절은 도덕적 평가가 아니라 제의용 재료의 적합성을 규정하므로, ‘시험된/검증된 외형’과 물질적 품질을 함께 드러내는 번역이 문맥에 더 충실합니다.
