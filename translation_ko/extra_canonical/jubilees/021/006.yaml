  chosen_korean: 새긴 우상들을 따르거나
  alternatives_korean:
  - 새긴 형상들을 따르거나
  - 조각한 우상들을 따르거나
  lexicon: carved image / idol
  rationale: 문맥상 단순한 조형물이 아니라 우상숭배 금지를 가리키므로, 한국어에서는 의미를 분명히 하는 ‘우상들’을 붙였습니다.
- source_word: ወድኅሬሆሙ፡ ለስብክ።
  english_pob_choice: or after molten images
  chosen_korean: 부어 만든 우상들을 따르지 마십시오
  alternatives_korean:
  - 주조한 우상들을 따르지 마십시오
  - 녹여 만든 우상들을 따르지 마십시오
  lexicon: molten image / idol
  rationale: ‘molten images’는 우상 제작 방식을 가리키므로, 현대 한국어에서 자연스럽고 분명한 ‘부어 만든 우상들’로 옮겼습니다.
- source_word: ወኢትብልዑ፡ ወኢምዝተኒ።
  english_pob_choice: And do not eat blood
  chosen_korean: 또한 피를 먹지 마십시오
  alternatives_korean:
  - 그리고 피를 먹지 마십시오
  - 피를 먹지 마십시오
  lexicon: blood prohibition
  rationale: 영어본의 ‘And do not eat blood’에 맞춰 금지 명령을 그대로 유지했고, 게에즈의 부정 강조도 한국어에서 ‘또한’으로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 우상 관련 항목의 반복 구조
  chosen_reading: 세 항목을 각각 금지 목록으로 보되, 한국어에서는 동사 ‘따르다’를 통해 우상숭배를 분명히 드러냈습니다.
  alternative_readings:
  - ‘~에 이르지 마십시오’처럼 방향성만 살리는 읽기
  - 명사구 나열로만 옮기는 읽기
  rationale: 게에즈 원문은 ‘~을 향하여/뒤따라’의 반복 구조를 가지며, 이는 단순한 위치 이동이 아니라 우상숭배적 추종 금지입니다. 한국어에서 그 신학적 의미를 분명히 해야 합니다.
  doctrine_reference: 우상숭배 금지, 출 20:3-5; 신 13
