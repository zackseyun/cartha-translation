lexical_decisions:
- source_word: ለርኩሳን፡
  english_pob_choice: to unclean things
  chosen_korean: 부정한 것들을
  alternatives_korean:
  - 더러운 것들을
  - 부정한 것에
  lexicon: negative purity term / ritual impurity
  rationale: 게에즈의 첫 항목이 영어본에서 누락되었으므로, 제의적·의례적 부정을 드러내는 표준적 표현인 ‘부정한 것들’로 보완했습니다.
- source_word: ወድኅሬሆሙ፡ ለገሊፎ፡
