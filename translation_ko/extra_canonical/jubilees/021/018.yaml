review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly retains the three elements of the Ge''ez: warning concerning blood, emphatic care in covering it in the ground, and the emphatic prohibition on eating it. However, ''덮기까지'' means ''until (one) covers it'' and does not express that special care is to be exercised in the act of covering. The source has no basis for the English audit trail''s older ''with dust'' alternative, so that wording should not be introduced.'
  naturalness: ‘그것을 땅에 덮기까지 크게 주의하십시오’ is syntactically and idiomatically awkward in modern Korean. ‘그것을 땅속에 덮는 일에 각별히 주의하십시오’ naturally conveys the emphatic instruction while retaining the source’s ‘in the earth/ground.’
  terminology: '‘피에 관해서는 조심하십시오’ is natural and appropriately formal. ‘각별히 주의하십시오’ renders the intensifier ጥቀ without adding ‘흙.’ ‘전혀 먹지 마십시오’ suitably conveys the emphatic negative. The unattested [a] and [b] anchors should be removed: no Korean footnote is needed, and the English alternatives are either unsupported by the source or merely less emphatic English renderings.'
  issues:
  - severity: medium
    issue: The phrase ‘덮기까지 크게 주의하십시오’ misrelates the act of covering to the warning.
    rationale: ‘-기까지’ marks an endpoint (‘until covering’) rather than expressing careful performance of the covering. The Ge'ez intensifier modifies the second command to take care.
  - severity: low
    issue: Footnote anchors [a][b] occur without corresponding Korean footnotes.
    rationale: The supplied draft contains no footnote set. Moreover, English note a proposes ‘with dust,’ which the audit trail identifies as absent from the Ge'ez; note b merely gives a non-emphatic alternative and need not be carried into Korean.
  revised_text: 내 아들아, 피에 관해서는 조심하십시오. 그것을 땅속에 덮는 일에 각별히 주의하십시오. 그리고 그것을 전혀 먹지 마십시오.
  revised_footnotes: []
  revision_rationale: The revision replaces the unnatural endpoint construction with an idiomatic expression that makes the second, intensified warning govern the covering of the blood. ‘땅속에’ expresses the source’s location ‘in the earth’ without importing dust. The emphatic prohibition is retained. Unsupported and structurally unpaired footnote anchors are removed.
