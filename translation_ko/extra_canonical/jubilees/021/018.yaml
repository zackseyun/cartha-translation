translation:
  language: ko
  text: 내 아들아, 피에 관해서는 조심하십시오. 그것을 땅속에 덮는 일에 각별히 주의하십시오. 그리고 그것을 전혀 먹지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብ... በደም
  english_pob_choice: Take care, my son, concerning blood
  chosen_korean: “피에 관하여 주의하십시오”
  alternatives_korean:
  - “피를 조심하십시오”
  - “피에 대해 삼가십시오”
  lexicon: 주의하다
  rationale: 원문은 단순 금지가 아니라 피 자체를 특별히 경계하라는 경고이므로, 직설적 금지보다 ‘주의하십시오’로 긴장감을 살렸습니다.
- source_word: ጥቀ፡ ደፍኖ፡ ውስተ፡ ምድር
  english_pob_choice: take great care to cover it in the earth
  chosen_korean: “그것을 땅에 덮기까지 크게 주의하십시오”
  alternatives_korean:
  - “땅에 잘 덮으십시오”
  - “흙으로 덮으십시오”
  lexicon: 덮다
  rationale: Ge'ez의 ጥቀ는 ‘크게/몹시’의 강조이므로 ‘크게 주의하십시오’로 반영했고, ውስተ፡ ምድር는 ‘흙’이 아니라 ‘땅/땅속’이므로 더 좁혀 번역하지 않았습니다.
- source_word: ወኢትብልዖ፡ እንከ፡
  english_pob_choice: And do not eat it at all
  chosen_korean: “그리고 그것을 전혀 먹지 마십시오”
  alternatives_korean:
  - “그리고 그것을 먹지 마십시오”
  - “그리고 아예 먹지 마십시오”
  lexicon: 전혀
  rationale: 부정 명령의 እንከ는 단순 금지보다 ‘전혀/아예’의 강조를 담으므로 이를 살렸습니다.
theological_decisions:
- issue: 피를 먹지 말라는 금지의 강도와 범위
  chosen_reading: 단순히 ‘먹지 말라’가 아니라, 피를 땅에 덮어 처리한 뒤에도 ‘전혀 먹지 말라’는 절대적 금지로 옮겼습니다.
  alternative_readings:
  - “먹지 마십시오”처럼 완화
  - 의례적 규정으로 중화
  rationale: 원문과 영어 POB 모두 혈액 섭취 금지를 강하게 반복하므로, 윤리적/의례적 경계를 약화시키지 않았습니다.
  doctrine_reference: 창 9:4, 레 17:10-14와의 금기 전통
