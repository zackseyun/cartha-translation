review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 첫 병렬에서 원문의 ‘모든 새’를 누락했고, 능동적으로 피를 ‘쏟으라’는 지시를 ‘뿌리십시오’로 바꾸었습니다. 또한 제공된 게에즈 본문과 영어 감사 추적문이 모두 ‘before’에서 끝나는데도, 원문 발췌에 없는 ‘야훼’를 보충했습니다.
  naturalness: ‘받아들여질 평화제물’은 다소 무겁지만 원문의 수용됨/합당함의 뜻을 보존합니다. 제의 문맥에서는 ‘피를 제단에 쏟으십시오’, ‘기름에 섞은 고운 가루’, ‘전제물’이 현대 표준어 합쇼체로 자연스럽고 명료합니다.
  terminology: ‘평화제물’, ‘제단’, ‘기름’, ‘고운 가루’, ‘전제물’은 제의 문맥에 적합합니다. 원문에 명시되지 않은 신명을 넣지 않았으며, 영어 감사 추적에 남아 있는 이전 번역 대안들은 현행 본문의 관주로 유지할 근거가 없습니다.
  issues:
  - severity: medium
    issue: ‘모든 새’의 범위가 누락되었습니다.
    rationale: 원문은 ‘모든 새’(ወዘኵሉ፡ ዖፍ)를 말하므로 ‘하늘을 나는 모든 새’로 옮겨야 합니다.
  - severity: medium
    issue: 피 처리 동작이 ‘쏟다’에서 ‘뿌리다’로 변경되었습니다.
    rationale: 게에즈 동사구와 영어 감사 추적문은 능동적으로 피를 ‘쏟으라’고 합니다. ‘뿌리다’는 제의적으로 가능한 표현일 수 있으나 이 대목의 제시된 원문·감사 추적을 따르지 않습니다.
  - severity: medium
    issue: 원문 발췌에 없는 ‘야훼’를 첨가했습니다.
    rationale: 제공된 게에즈 본문과 영어문은 모두 ‘before’에서 중단됩니다. 다음 문맥에 신명이 있을 가능성이 있어도, 현재 절의 제공 자료만으로 ‘야훼’를 본문에 보충할 수 없습니다.
  - severity: low
    issue: 기존 관주 a–c는 현재 번역의 변이 또는 보충 정보를 제시하지 않으며, 모두 문단 끝에 몰려 있어 연결 대상도 불명확합니다.
    rationale: a와 b는 이미 배제된 이전 번역을 반복하고, c는 현행 능동 명령과 상반됩니다. 삭제하는 편이 독자에게 정확합니다.
  revised_text: 들짐승과 가축과 하늘을 나는 모든 새의 피입니다. 또 받아들여질 평화제물로 제물을 잡으려거든, 그것을 잡아 그 피를 제단에 쏟으십시오. 그 제물의 모든 기름을 기름에 섞은 고운 가루와 그 전제물과 함께 모두 제단에 올리십시오. 그것은 향기로운 냄새가 나는 제물입니다.
  revised_footnotes: []
  revision_rationale: ‘모든 새’와 능동 명령 ‘피를 쏟으십시오’를 복원하고, 제공된 원문 발췌에 없는 ‘야훼’를 삭제했습니다. 원문이 ‘before’에서 문법적으로 중단되는 점 때문에 마지막 표현은 원문이 확실히 제시하는 ‘향기로운 냄새가 나는 제물’까지만 자연스러운 한국어 문장으로 옮겼습니다. 이전 번역 선택을 반영하던 관주들은 현행 본문에 맞지 않아 삭제했습니다.
