translation:
  language: ko
  text: 들짐승의 피와 가축의 피와 하늘에서 나는 날짐승의 피입니다. 그리고 만일 받아들여질 평화제물로 제물을 드리려거든, 그것을 잡아 그 피를 제단에 뿌리십시오. 또 그 제물의 모든 기름과 기름에 섞은 고운 가루와 그 전제물을 함께 제단에 올려, 야훼 앞에 향기로운 냄새가 되는 제물로 드리십시오.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደመ፡ ዘአርዌ፡ ወዘእንስሳ፡ ወዘኵሉ፡ ዖፍ፡ ዘይሰርር፡ ውስተ፡ ሰማይ
  english_pob_choice: the blood of wild animals and of cattle and of every bird that flies in the sky
  chosen_korean: 들짐승의 피와 가축의 피와 하늘에서 나는 날짐승의 피
  alternatives_korean:
  - 들짐승과 가축과 하늘에서 나는 모든 새의 피
  - 야생 짐승과 소와 하늘을 나는 모든 새의 피
  lexicon: 피, 들짐승, 가축, 날짐승
  rationale: 원문은 세 범주의 피를 병렬로 제시하므로 한국어도 피를 앞에 두어 구조를 보존했고, ዘይሰርር는 단순히 ‘날아가는’ 새를 가리켜 ‘하늘에서 나는’으로 옮겼습니다.
- source_word: ዘይሰጠው
  english_pob_choice: acceptable
  chosen_korean: 받아들여질
  alternatives_korean:
  - 합당한
  - 받으실 만한
  lexicon: 받아들이다
  rationale: 수정된 영어 관주처럼 이 형용사는 ‘thanksgiving’이 아니라 ‘acceptable/accepted’의 뜻이므로, 제물이 수용 가능함을 드러내는 표현으로 옮겼습니다.
- source_word: ሕርደ፡ ... ወደሞሙ፡ ትክዐዉ
  english_pob_choice: slaughter it and pour out its blood
  chosen_korean: 그것을 잡아 그 피를 제단에 뿌리십시오
  alternatives_korean:
  - 그것을 잡고 그 피를 쏟으십시오
  - 그것을 도살하고 그 피를 쏟아내십시오
  lexicon: 잡다, 뿌리다
  rationale: 원문은 능동 명령으로 제물의 도살과 피의 처리를 지시하므로, 제단에 ‘뿌리다’는 제의적 제사 용례를 살리면서도 적극적 동작을 유지했습니다.
- source_word: ጽንሑክ፡ ታዐርግ፡ ውስተ፡ ምሥዋዕ፡ ምስለ፡ ስንዳሌ፡ ልውሰ፡ በቅብዕ፡ ምስለ፡ ሞ፟ጻሕቱ
  english_pob_choice: all the fat of your offering ... together with fine flour mixed with oil; and with its drink offering
  chosen_korean: 그 제물의 모든 기름과 기름에 섞은 고운 가루와 그 전제물
  alternatives_korean:
  - 그 제물의 모든 기름과 기름에 섞은 고운 가루와 그 부어 드리는 제물
  - 제물의 모든 기름과 기름 섞인 고운 가루와 그 전제물
  lexicon: 전제물, 고운 가루, 기름, 올리브 기름
  rationale: 원문의 제의 항목들을 누락 없이 살리되, ‘전제물’은 한국 성경에서 통용되는 제의어를 유지했고 ‘섞은’으로 함께 섞였다는 관계를 드러냈습니다.
theological_decisions:
- issue: 제물의 성격을 ‘acceptable peace offering’으로 옮길지, 전통적 ‘thanksgiving’으로 읽을지
  chosen_reading: ‘받아들여질 평화제물’로 번역해 제물이 수용 가능하다는 의미를 드러냈습니다.
  alternative_readings:
  - 감사 평화제물
  - 합당한 화목제물
  rationale: 개정된 영어 관주와 게으즈 동사형이 수용 가능성을 가리키므로, 감사 개념을 삽입하지 않고 제물의 적합성/수용성을 보존했습니다.
  doctrine_reference: 제의 규정의 정확성 보존
- issue: ‘야훼 앞에’의 문맥과 제사적 표현의 유지
  chosen_reading: ‘야훼 앞에 향기로운 냄새가 되는 제물로 드리십시오’로 옮겼습니다.
  alternative_readings:
  - 하나님 앞에
  - 주님 앞에
  rationale: 본문은 제사의 수직적 지향을 분명히 하므로, POB 기본 원칙에 따라 신명 호칭은 ‘야훼’로 두고 제의적 수용을 ‘향기로운 냄새’로 유지했습니다.
  doctrine_reference: יהוה 표기 원칙
