translation:
  language: ko
  text: 그리고 그의 모든 길에서 곧게 걷도록 하였습니다. 내 영혼은 우상들을 미워하였으니, 내가 그것들을 행하지 않도록 삼가려 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከመ፡ አርትዕ፡ ሐዊረ፡ በኵሉ፡ ፍናዊሁ።
  english_pob_choice: and to walk uprightly in all his paths
  chosen_korean: 그의 모든 길에서 곧게 걷도록 하였습니다
  alternatives_korean:
  - 그의 모든 길에서 올바르게 걸으려고 하였습니다
  - 그의 모든 길에서 바르게 행하도록 하였습니다
  lexicon: 곧게 걷다
  rationale: Ge'ez의 ‘곧게/바르게 걷다’와 ‘모든 길’의 병행을 살리되, 한국어에서 자연스러운 행위 표현으로 옮겼습니다.
- source_word: ጣዖተ፡ ጸልአት፡
  english_pob_choice: idols
  chosen_korean: 우상들
  alternatives_korean:
  - 우상
  - 우상의 상들
  lexicon: 우상
  rationale: 문맥상 복수의 우상들을 가리키므로 복수형을 유지했습니다.
- source_word: ነፍስየ፡
  english_pob_choice: My soul
  chosen_korean: 내 영혼은
  alternatives_korean:
  - 내 혼은
  - 내 마음은
  lexicon: 영혼
  rationale: 화자의 내적 결단을 드러내는 표현으로, 한국어 성경에서 통용되는 ‘영혼’을 택했습니다.
- source_word: ከመ፡ እትዐቀብ፡ ለገቢረ፡
  english_pob_choice: that I might observe to do
  chosen_korean: 내가 그것들을 행하지 않도록 삼가려 하였습니다
  alternatives_korean:
  - 내가 그것들을 행하려고 조심하였습니다
  - 내가 행하는 일을 지키려 하였습니다
  lexicon: 삼가다
  rationale: English audit trail이 최종적으로 ‘observe to do’로 정정되었으므로, Ge'ez의 ‘주의하여 행하다/살피다’ 의미를 살려 ‘삼가다’로 옮겼습니다. 문맥상 다음 절로 이어질 대상을 감안해 한국어에서는 ‘그것들’을 보충해 자연스럽게 만들었습니다.
theological_decisions:
- issue: 우상에 대한 혐오와 윤리적 실천의 연결
  chosen_reading: 우상을 미워하는 태도는 곧 그것을 행하지 않도록 삼가려는 실제 순종으로 이어지는 것으로 옮겼습니다.
  alternative_readings:
  - 우상을 미워하여 그것을 하지 않도록 지키다
  - 우상을 미워하여 행하지 않으려 하다
  rationale: 원문은 내면의 혐오와 실제 행위의 절제를 함께 제시하므로, 감정만이 아니라 행동상의 자기절제를 분명히 드러냈습니다.
  doctrine_reference: 성화와 우상숭배 거부의 연결
