  english_pob_choice: And let no blood be seen
  chosen_korean: 피가 조금도 보이지 않게 하십시오
  alternatives_korean:
  - 피가 보이지 않게 하십시오
  - 피가 전혀 드러나지 않게 하십시오
  lexicon: 보이다 / 드러나다
  rationale: 영문 POB의 ‘be seen’을 따라 가시성 표현으로 옮기되, ‘조금도’로 완전한 부재를 분명히 했습니다.
- source_word: በዲቤክሙ፡ ... በውስተ፡ አልባሲክሙ
  english_pob_choice: on you or on your garments
  chosen_korean: 여러분과 여러분의 옷에
  alternatives_korean:
