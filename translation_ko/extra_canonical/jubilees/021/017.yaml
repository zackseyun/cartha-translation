lexical_decisions:
- source_word: ወትሐፀብ፡ እደዊከ፡ ወእገሪከ።
  english_pob_choice: and wash your hands and your feet.
  chosen_korean: 손과 발을 씻으십시오.
  alternatives_korean:
  - 손과 발을 씻어라.
  - 손과 발을 씻으십시오. 그리고
  lexicon: 씻다 / 손 / 발
  rationale: 원문의 동사 ‘씻다’와 신체 부위 ‘손, 발’을 간결하게 살려 명령문으로 옮겼습니다.
