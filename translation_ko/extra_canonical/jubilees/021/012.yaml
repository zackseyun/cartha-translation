base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021/012.yaml
  text: 'your offerings before the Lord. And take care with the wood of the offering, that you do not bring wood for the altar in addition to these: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar.'
  footnotes:
  - marker: a
    text: 'Or ''so that you do not bring wood for the offering from these: vine, fig, myrtle, laurel, cypress, cedar, juniper, date-palm, almond, olive, myrrh, bay, and ash-wood,''.'
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 제물들을 주님 앞에 드리십시오. 그리고 제단에 쓸 나무에 관하여 주의하십시오. 이 나무들 외에는 제단에 쓸 나무를 가져오지 마십시오. 곧 사이프러스나무, 전나무, 아몬드나무, 소나무, 송진소나무, 백향목, 향나무, 클레마티스, 올리브나무, 도금양나무, 월계수나무, 그리고 백향목입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “포도나무, 무화과나무, 도금양나무, 월계수나무, 사이프러스나무, 백향목, 향나무, 대추야자나무, 아몬드나무, 올리브나무, 몰약나무, 월계수, 물푸레나무에서 제단에 쓸 나무를 가져오지 않도록 주의하십시오.”
    reason: 영어 POB 감사 기록에 제시된 이전 번역/대안 독법을 한국어로 옮긴 것입니다. 본문은 현 게에즈 원문 및 최신 영어 POB의 제한적 목록 독법을 따릅니다.
lexical_decisions:
- source_word: your offerings before the Lord
  english_pob_choice: your offerings before the Lord
  chosen_korean: 당신의 예물들을 주님 앞에 드리십시오
  alternatives_korean:
  - 주님 앞에 당신의 제물을 드리십시오
  - 주님 앞에 당신의 예물들을 바치십시오
  lexicon: መሥዋዕቲከ / offering(s)
  rationale: 예배적 봉헌의 뜻을 살리되, 한국어에서 자연스러운 공손 명령형으로 옮겼습니다. 주님은 야훼를 가리키는 본문 맥락상 직접 명시하지 않고 ‘주님’으로 두었습니다.
- source_word: the wood of the offering
  english_pob_choice: the wood of the offering
  chosen_korean: 제단의 나무
  alternatives_korean:
  - 예물의 나무
  - 제물의 나무
  lexicon: ምሥዋዕ / altar, offering
  rationale: 게에즈 ምሥዋዕ은 제단을 가리키므로 ‘제단’으로 옮겼고, 뒤의 መሥዋዕት과 구별했습니다. 수정 이력에서 지적된 대로 ‘offering’으로 바꾸지 않고 제단 의미를 유지했습니다.
- source_word: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar
  english_pob_choice: cypress, fir, almond, pine, pitch-pine, cedar, juniper, clematis, olive, myrtle, laurel, and cedar
  chosen_korean: 사이프러스, 전나무, 아몬드나무, 소나무, 송진소나무, 백향목, 향나무, 클레마티스, 올리브나무, 몰약나무, 월계수나무, 그리고 백향목
  alternatives_korean:
  - 편백, 전나무, 아몬드나무, 소나무, 송진소나무, 백향목, 향나무, 클레마티스, 올리브나무, 몰약나무, 월계수나무, 그리고 백향목
  - 사이프러스나무, 전나무, 아몬드나무, 소나무, 송진소나무, 백향목, 향나무, 클레마티스, 올리브나무, 몰약나무, 월계수나무, 그리고 백향목
  lexicon: 열거된 수종 목록
  rationale: 본문의 식물 목록은 어휘 대응이 핵심이므로, 확인 가능한 통용명은 쓰고 불확실한 것은 음차를 병기하거나 음차로 유지했습니다. 끝의 ‘백향목’ 반복도 게에즈 본문과 영어 POB를 따라 보존했습니다.
theological_decisions:
- issue: 주님 앞의 예물과 제단 나무의 관계
  chosen_reading: 예물을 주님 앞에 드리라고 한 뒤, 이어서 제단에 놓을 나무의 범위를 제한하는 명령으로 읽었습니다.
  alternative_readings:
  - 예물의 나무를 주의하라는 뜻으로 읽기
  - 제단 대신 예물 자체를 가리킨다고 읽기
  rationale: 게에즈 본문은 መሥዋዕቲ(예물/제물)와 ምሥዋዕ(제단)을 구별합니다. 영어 POB의 수정 이력도 두 항목을 분리해 읽도록 조정했으므로, 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: 본문해석/제의 용어 구별
