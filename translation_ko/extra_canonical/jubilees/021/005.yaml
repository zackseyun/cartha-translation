translation:
  language: ko
  text: 그의 언약입니다. 너도, 내 아들아, 그의 계명과 그의 규례와 그의 판결을 지키고, 그들을 따라 걷지 마십시오.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳኖ
  english_pob_choice: his covenant
  chosen_korean: 그의 언약
  alternatives_korean:
  - 그의 계약
  - 그의 조약
  lexicon: 언약
  rationale: Ge'ez ኪዳኖ는 소유격이 붙은 'covenant'로, 성경적·문헌적 맥락에서 한국어 '언약'이 가장 직접적입니다.
- source_word: ዕቀብ
  english_pob_choice: keep
  chosen_korean: 지키고
  alternatives_korean:
  - 간직하고
  - 준수하고
  lexicon: 지키다
  rationale: 행동적 순종을 요구하는 맥락이므로 단순 보존보다 계명 준수의 뉘앙스를 살린 '지키다'가 적절합니다.
- source_word: ትእዛዞ / ሥርዐቶ / ኵነኔሁ
  english_pob_choice: his commandment and his statute and his judgment
  chosen_korean: 그의 계명과 그의 규례와 그의 판결
  alternatives_korean:
  - 그의 명령과 그의 규례와 그의 심판
  - 그의 계명과 그의 율례와 그의 판결
  lexicon: 계명 / 규례 / 판결
  rationale: 각 명사는 서로 다른 법적·규범적 층위를 가지므로 한국어에서도 세 단어를 구분해 살렸습니다. '판결'은 ኵነኔሁ의 판단/재판적 의미를 가장 직접적으로 드러냅니다.
- source_word: ድኅሬሆሙ
  english_pob_choice: after them
  chosen_korean: 그들을 따라
  alternatives_korean:
  - 그 뒤를 따라
  - 그들 뒤를 따라
  lexicon: 따르다
  rationale: 직역 '그들 뒤에'는 한국어에서 어색하므로, 행위·길을 추종하는 뉘앙스를 살려 '그들을 따라'로 옮겼습니다.
theological_decisions:
- issue: ‘his covenant’의 절 경계 처리
  chosen_reading: 현전 게으즈 본문에 있는 ኪዳኖ를 본 절 첫머리의 독립 절로 번역했습니다.
  alternative_readings:
  - 이 단어를 앞 절의 말미로 돌려 읽기
  - 본문 오류로 간주해 생략하기
  rationale: 주어진 소스 문자열에 실제로 존재하므로, 절 분절상의 어색함이 있더라도 번역에서 제거하지 않고 반영했습니다.
  doctrine_reference: source fidelity / textual auditability
- issue: ‘do not walk after them’의 명령 어조
  chosen_reading: 금지 명령을 현대 한국어 공손 명령형으로 옮겨 '걷지 마십시오'로 처리했습니다.
  alternative_readings:
  - 걷지 마라
  - 따르지 마십시오
  rationale: 청자에게 직접 주는 권면이므로 합쇼체를 유지하되, 'after them'의 추종 금지를 드러내기 위해 '걷다'를 유지했습니다.
  doctrine_reference: register and discourse fidelity
