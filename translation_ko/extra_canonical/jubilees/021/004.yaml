  text: the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandments and those who despise his covenant.
  footnotes:
  - marker: a
    text: Or 'no partiality and no accepting of persons'.
    reason: previous_rendering
  - marker: b
    text: Or 'who transgress his commandments and his covenant.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나를 지으신 분의 뜻입니다. 그는 살아 계신 하나님이시며, 거룩하시고 신실하시며 모든 것 위에 의로우십니다. 그분께는 사람을 외모로 가려 대하지 않으시는 일도, 뇌물을 받으시는 일도 없습니다. 그분은 의로우신 하나님이시며, 그분의 계명들을 어기는 모든 자와 그분의 언약을 멸시하는 자들에게 심판을 집행하시는 분이십니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈቃዱ
  english_pob_choice: the will of him who created me
  chosen_korean: 나를 지으신 분의 뜻
  alternatives_korean:
  - 나를 창조하신 분의 뜻
  - 나를 지으신 이의 뜻
  lexicon: ፈቃድ
  rationale: 소유격이 붙은 ‘그의 뜻’을 자연스럽게 풀어, 창조 행위와 결부된 하나님 뜻임을 살렸습니다.
- source_word: ነሢአ ገጽ
  english_pob_choice: no partiality
  chosen_korean: 사람을 외모로 가려 대하지 않으시는 일
  alternatives_korean:
  - 편파가 없으신 일
  - 사람을 차별하지 않으시는 일
  lexicon: ነሢአ፡ ገጽ
  rationale: 직역하면 ‘얼굴/외모를 받다’로, 성경적 관용구인 편파성·차별을 한국어로 분명히 드러냈습니다.
- source_word: ነሢአ ሕልያን
  english_pob_choice: accepting of gifts
  chosen_korean: 뇌물을 받으시는 일
  alternatives_korean:
  - 선물을 받으시는 일
  - 사람의 편을 들어 주시는 일
  lexicon: ነሢአ፡ ሕልያን
  rationale: 문맥상 단순 선물보다 재판적 편파를 유발하는 뇌물의 의미가 더 적절하여, 공정성의 대조를 살렸습니다.
- source_word: ይትዐደዉ ትእዛዞ / ይሜንኑ
  english_pob_choice: who transgress his commandments and those who despise his covenant
  chosen_korean: 그분의 계명들을 어기는 모든 자와 그분의 언약을 멸시하는 자들
  alternatives_korean:
  - 그분의 계명들을 범하는 모든 자와 그분의 언약을 업신여기는 자들
  - 그분의 명령들을 어기는 자들과 그분의 언약을 거스르는 자들
  lexicon: ትእዛዝ / ይሜንኑ
  rationale: 본문이 ‘계명들’과 ‘언약 멸시’라는 두 대상을 구분하므로, 두 절을 나누어 번역했습니다.
theological_decisions:
- issue: 하나님 성품 목록의 누적 표현
  chosen_reading: 살아 계신 하나님, 거룩하시고 신실하시며 모든 것 위에 의로우신 분으로 연결하여 번역했습니다.
  alternative_readings:
  - 살아 있는 하나님이며 거룩하고 믿을 만하며 의로우신 분
  - 살아 계신 하나님, 거룩하고 신실하고 의로우신 분
  rationale: 게에즈 원문의 연속된 술어를 보존하면서, 하나님 성품의 고백적 진술이 끊기지 않도록 했습니다.
  doctrine_reference: 하나님의 속성 진술
