- from: 나를 지으신 분의 뜻입니다. 그는 살아 계신 하나님이시며, 거룩하시고 신실하시며 모든 것 위에 의로우십니다. 그분께는 사람을 외모로 가려 대하지 않으시는 일도, 뇌물을 받으시는 일도 없습니다. 그분은 의로우신 하나님이시며, 그분의 계명들을 어기는 모든 자와 그분의 언약을 멸시하는 자들에게 심판을 집행하시는 분이십니다.[a]
  to: 나를 지으신 분의 뜻입니다. 그는 살아 계신 하나님이시며, 거룩하시고 신실하시며 무엇보다 의로우십니다. 그분께는 사람을 외모로 보아 차별하시는 일도, 뇌물을 받으시는 일도 없습니다. 그분은 의로우신 하나님이시며, 그분의 계명들을 어기는 모든 자와 그분의 언약을 멸시하는 자들에게 심판을 집행하시는 분이십니다.
  rationale: 문장의 의미를 바꾸지 않고, 편파성과 뇌물 수수를 각각 분명히 보존했습니다. 한국어 관용에 맞게 ‘외모로 보아 차별하다’와 ‘무엇보다 의롭다’를 사용했으며, 원문의 불완전한 문장 시작도 ‘…뜻입니다’로 유지했습니다. 영어 감사 기록의 대안 독법은 현재 번역이 ‘뇌물’을 명시하므로 별도 각주가 필요하지 않습니다.
