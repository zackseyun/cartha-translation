  text: And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of them.
translation:
  language: ko
  text: 그리고 네 모든 제물에 소금을 치고, 언약의 소금이 어느 제물에도 빠지지 않게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትደይ፡ ፄወ፡
  english_pob_choice: put salt
  chosen_korean: 소금을 치고
  alternatives_korean:
  - 소금을 넣고
  - 소금을 두고
  lexicon: 소금 치다
  rationale: 동사형으로 처리해 제물에 소금을 더하는 행위를 자연스럽게 옮기되, 단순 보유가 아니라 실제로 가하는 동작임을 드러냅니다.
- source_word: ፄወ፡ ኪዳን፡
  english_pob_choice: the salt of the covenant
  chosen_korean: 언약의 소금
  alternatives_korean:
  - 언약의 소금물
  - 계약의 소금
  lexicon: 소금 / 언약
  rationale: 원문은 소금을 언약과 직접 연결하므로, 관용적이면서도 직역에 가까운 ‘언약의 소금’으로 유지했습니다.
- source_word: ወኢይደሪዕ፡ ... ውስተ፡ ኵሉ፡
  english_pob_choice: do not let ... be lacking from any of them
  chosen_korean: 그 가운데 어느 것에서도 빠지지 않게 하십시오
  alternatives_korean:
  - 그들 중 어느 것에서도 없어지지 않게 하십시오
  - 그 가운데 하나도 모자라지 않게 하십시오
  lexicon: 빠지다 / 어느 것
  rationale: 결핍 금지를 한국어에서 가장 분명하게 전달하면서, 문맥상 모든 제물 각각을 가리키는 집합적 의미를 살렸습니다.
theological_decisions:
- issue: 제물 전체에 소금을 요구하는 규정의 강조
  chosen_reading: 모든 제물에 소금을 치고, 언약의 소금이 하나도 빠지지 않게 하라는 명령으로 옮겼습니다.
  alternative_readings:
  - 상징적 의미를 완화해 일반적인 풍미 규정처럼 옮기는 방식
  - ‘언약의 소금’을 비유적으로 풀어 설명하는 방식
  rationale: 원문과 POB는 모두 의례적 규정의 직접성을 유지하므로, 상징을 풀어 약화시키지 않고 명령형의 강도를 살렸습니다.
  doctrine_reference: 의례법 해석에 관한 본문 직접성 보존
- issue: 대상 범위의 집합성
  chosen_reading: ‘그 가운데 어느 것에서도’로 옮겨 각 제물마다 예외가 없음을 드러냈습니다.
  alternative_readings:
  - ‘그들 모두에게서’
  - ‘아무것도 빠뜨리지 말고’
  rationale: 마지막 구절이 단순 총괄이 아니라 각 제물에 대한 누락 금지를 뜻하므로, 개별성과 전체성을 함께 보이도록 했습니다.
  doctrine_reference: 본문 의미의 집합적-개별적 병행
