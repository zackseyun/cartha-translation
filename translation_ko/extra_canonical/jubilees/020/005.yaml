  yaml_path: translation/extra_canonical/jubilees/020/005.yaml
  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
  footnotes:
  - marker: a
    text: '''Rain of morning and evening'' may reflect the familiar agricultural blessing of timely rains, comparable to ''early and late rain.'''
    reason: lexical_alternative
    anchor_ref: '20:5'
  - marker: b
    text: Or 'direct your path'.
    reason: previous_rendering
  - marker: c
    text: Or 'the Most High'.
    reason: previous_rendering
translation:
  language: ko
  text: 지극히 높으신 분께 경배하고, 언제나 그의 얼굴을 구하며, 그의 앞에서 바름과 의를 행하십시오. 그러면 그가 여러분을 바르게 하시고 자비를 베푸시며, 아침과 저녁의 비[a]를 여러분에게 내리시고, 여러분이 땅에서 하는 모든 일을 복을 주시며, 여러분의 곡식도 복을 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아침과 저녁의 비’는 제때 내리는 비라는 친숙한 농경적 축복, 곧 ‘이른 비와 늦은 비’를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ልዑለ
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  lexicon: generic superlative divine epithet
  rationale: 지위 칭호를 직역하되, 한국어에서 자연스럽고 존칭이 살아 있는 표현으로 옮겼습니다. 본문은 YHWH 고유명보다는 지극히 높으신 분이라는 호칭을 쓰므로 개별 이름을 넣지 않았습니다.
- source_word: ወስግዱ፡ ሎቱ
  english_pob_choice: bow down to him
  chosen_korean: 경배하고
  alternatives_korean:
  - 그에게 절하고
  - 그 앞에 엎드리고
  lexicon: worship / prostrate oneself
  rationale: 의례적 몸짓을 넘어 예배적 복종의 뜻이 분명하므로, 한국어 성경에서 널리 통하는 ‘경배하다’를 사용했습니다.
- source_word: ወትስፈዉ፡ ገጸ፡ ዚአሁ፡ በኵሉ፡ ጊዜ
  english_pob_choice: continually seek his face at all times
  chosen_korean: 항상 그의 얼굴을 구하며
  alternatives_korean:
  - 끊임없이 그의 얼굴을 찾으며
  - 늘 그의 임재를 구하며
  lexicon: seek his face
  rationale: ‘얼굴을 구하다’는 히브리식 관용을 한국어에서도 최대한 살려, 관계적 친근성과 구도(求道)의 뉘앙스를 유지했습니다.
- source_word: ያርትዕ፡ ርእስክሙ
  english_pob_choice: direct you
  chosen_korean: 여러분을 바르게 인도하시고
  alternatives_korean:
  - 여러분의 길을 바르게 하시고
  - 여러분을 곧게 세우시고
  lexicon: make straight / direct
  rationale: 게에즈 표현은 문자적으로는 ‘너희 자신을 곧게 하다/바르게 하다’의 뜻이므로, POB의 수정 취지에 따라 ‘인도하다’보다 근본 의미를 드러내는 ‘바르게 인도하시고’로 옮겼습니다.
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ፡
  english_pob_choice: the rain of morning and evening
  chosen_korean: 아침과 저녁의 비
  alternatives_korean:
  - 이른 비와 늦은 비
  - 아침 비와 저녁 비
  lexicon: agricultural blessing rain
  rationale: 문자적 구성은 ‘아침과 저녁의 비’이지만, 농경적 축복으로는 ‘이른 비와 늦은 비’가 관용적일 수 있습니다. 다만 본문 어휘를 우선해 직역하되, 의미상 풍성함을 보존했습니다.
- source_word: እክልከ
  english_pob_choice: your grain
  chosen_korean: 여러분의 곡식
  alternatives_korean:
  - 여러분의 양식
  - 여러분의 수확
  lexicon: grain / produce
  rationale: 마지막 축복 대상은 추상적 ‘수확’보다 농경 문맥에 맞는 구체적 ‘곡식’이 더 직접적입니다.
theological_decisions:
- issue: 하늘 높음 칭호의 처리
  chosen_reading: ‘지극히 높으신 분’으로 번역하고 고유명 야훼를 주입하지 않았습니다.
  alternative_readings:
  - 야훼
  - 지극히 높으신 하나님
  rationale: 게에즈 본문은 칭호를 사용하며, 현재 절 자체는 신명 호출이 아니라 경배 대상의 위엄을 강조합니다. 따라서 호칭의 층위를 유지하는 것이 더 source-grounded합니다.
  doctrine_reference: Divine epithet usage / source-text sensitivity
- issue: ‘얼굴을 구하다’의 직역성
  chosen_reading: ‘그의 얼굴을 구하며’라는 히브리식 관용을 유지했습니다.
  alternative_readings:
  - 그의 임재를 구하며
  - 그를 찾으며
  rationale: 직역이 다소 낯설어도, 본문이 말하는 지속적 관계 추구와 예배적 지향을 가장 잘 보존합니다.
  doctrine_reference: Biblical idiom preservation
