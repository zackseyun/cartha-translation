  text: to Isaac his son. And Ishmael and his sons and the sons of Keturah and their children went together and settled from Paran as far as the entrance to Babylon, in all the land that faces eastward.
translation:
  language: ko
  text: 이삭 그의 아들에게서였습니다. 그리고 이스마엘과 그의 아들들과 게두라의 아들들과 그들의 자손이 함께 가서, 바란에서 바빌론으로 들어가는 곳까지, 해 뜨는 쪽을 향한 온 땅에 거주하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለይስሐቅ፡ ወልዱ።
  english_pob_choice: to Isaac his son.
  chosen_korean: 이삭 그의 아들에게서였습니다.
  alternatives_korean:
  - 이삭 그의 아들에게
  - 이삭의 아들에게
  lexicon: source phrase with dative/possessive relation
  rationale: 게으즈 원문은 ‘이삭’과 ‘그의 아들’의 관계를 짧게 제시하므로, 한국어도 소유·관계성을 유지하되 문맥상 종결을 자연스럽게 처리했습니다.
- source_word: ወሖረ፡ ... ወውሉዶሙ፡ ኅቡረ፡
  english_pob_choice: And Ishmael and his sons and the sons of Keturah and their children went together
  chosen_korean: 그리고 이스마엘과 그의 아들들과 게두라의 아들들과 그들의 자손이 함께 가서
  alternatives_korean:
  - 그리고 이스마엘과 그의 아들들과 게두라의 아들들과 그 자손이 함께 갔고
  - 이스마엘과 그의 아들들, 게두라의 아들들과 그 자손이 함께 이동하여
  lexicon: go together / children
  rationale: ኅቡረ는 단순한 동시 이동보다 ‘함께’라는 결속을 강조하므로 이를 살렸고, ‘자손’은 ወውሉዶሙ의 집합적 의미를 유지합니다.
- source_word: ወኀደሩ፡
  english_pob_choice: settled
  chosen_korean: 거주하였습니다
  alternatives_korean:
  - 정착하였습니다
  - 머물렀습니다
  lexicon: dwell/settle
  rationale: 장기간의 거주를 나타내는 동사로 보아, 일회적 체류보다 ‘거주하다’가 문맥상 더 안정적이어서 선택했습니다.
- source_word: እምፋርሞን፡ እስከ፡ ምብዋአ፡ ባቢሎን፡ ... ገጸ፡ ጽባሕ፡ አንጻረ፡
  english_pob_choice: from Paran as far as the entrance to Babylon, in all the land that faces eastward.
  chosen_korean: 바란에서 바빌론으로 들어가는 곳까지, 해 뜨는 쪽을 향한 온 땅에
  alternatives_korean:
  - 바란에서 바빌론의 입구까지, 동쪽을 향한 온 땅에
  - 바란에서 바빌론으로 들어가는 관문까지, 동쪽을 향한 온 땅에
  lexicon: from Paran ... entrance to Babylon ... faces eastward
  rationale: ‘입구/관문’보다 ‘들어가는 곳’이 원문의 방향성·지리성을 과장하지 않으면서도 자연스럽고, ‘해 뜨는 쪽’은 ‘동쪽’보다 원문 이미지(‘faces eastward’)를 더 직접적으로 반영합니다.
