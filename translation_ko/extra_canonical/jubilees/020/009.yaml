  - 의미를 완화해 ‘동방’으로만 처리
  rationale: 이 절은 교리적 진술보다 분포와 경계의 서술이 핵심이므로, 원문의 공간적 구성을 보존하는 것이 독자 이해에 더 유익합니다.
