  naturalness: ‘이삭 그의 아들에게서였습니다’는 현대 한국어로 비문이며, 문맥 의존적인 원문 단편은 ‘그의 아들 이삭에게.’로 옮기는 것이 가장 자연스럽습니다. ‘바빌론으로 들어가는 곳’은 다소 장황하므로 ‘바빌론으로 들어가는 길목’으로 다듬었습니다.
