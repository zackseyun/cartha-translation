  source_fidelity: 첫 문장의 원문은 ‘그들이 … 축복할 것이다’와 ‘그들이 나와 같이 복을 받도록’이라는 목적절입니다. 초안의 ‘복을 받게 하려는 것입니다’는 미래 서술을 설명적 의도 표현으로 바꾸어 문법적 관계를 다소 흐립니다. 또한 마지막 ‘그에게’는 게에즈어 목적어 접미사를 반영하므로 유지하는 것이 적절합니다.
  naturalness: ‘그들이 나와 같이 복을 받게 하려는 것입니다’는 문맥상 다소 부자연스럽고, ‘그의 아들 이삭에게서’는 한국어에서 지시 관계가 어색할 수 있습니다. 목적절을 ‘복을 받도록’으로, 소유 관계를 ‘자기 아들 이삭에게서’로 표현하면 현대 한국어 문장으로 자연스럽습니다.
