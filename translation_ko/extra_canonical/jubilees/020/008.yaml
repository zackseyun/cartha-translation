  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
  footnotes:
  - marker: a
    text: Or 'but he gave everything'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 나와 같이 복을 받도록 내 이름으로 너희 자녀들을 축복할 것입니다. 그리고 그는 이스마엘과 그의 아들들, 그리고 그두라의 아들들에게 선물을 주고, 그들을 자기 아들 이삭에게서 떠나보냈습니다. 그러나 그는 모든 것을 그에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በስምየ
  english_pob_choice: in my name
  chosen_korean: 내 이름으로
  alternatives_korean:
  - 내 이름 안에서
  - 내 이름에 의해
  lexicon: 고유명사+전치사구
  rationale: 게에즈 원문의 도구적/매개적 표현을 자연스럽게 살리면서, 축복 행위의 근거가 하나님의 이름임을 분명히 드러내기 위해 ‘내 이름으로’를 택했습니다.
- source_word: ይኩኑ፡ ቡሩካነ፡
  english_pob_choice: they may be blessed
  chosen_korean: 복을 받게 하려는 것입니다
  alternatives_korean:
  - 복되게 되게 하려는 것입니다
  - 복을 받도록 하려는 것입니다
  lexicon: 수동/중간태 동사
  rationale: ‘복을 받다’는 수동적 결과를 자연스럽게 드러내며, ‘as I am’과의 대응 관계를 과장하지 않고 유지합니다.
- source_word: ወወሀቦ፡ ... ሀብተ፡
  english_pob_choice: he gave gifts
  chosen_korean: 선물을 주고
  alternatives_korean:
  - 예물을 주고
  - 증여물을 주고
  lexicon: 명사 ሀብተ + 동사 ወወሀቦ
  rationale: 문맥상 왕족적/가족적 분배이지만, 원문은 일반적 ‘gift’ 계열이므로 ‘선물’이 가장 무난하게 대응합니다.
- source_word: ወፈነዎሙ፡ እምይስሐቅ፡ ወልዱ፡
  english_pob_choice: and he sent them away from Isaac his son
  chosen_korean: 그들을 그의 아들 이삭에게서 떠나 보내었습니다
  alternatives_korean:
  - 그들을 그의 아들 이삭에게서 보냈습니다
  - 그들을 이삭에게서 멀리 보내었습니다
  lexicon: 분리 동사 + 출발 전치구
  rationale: ‘떠나 보내다’는 원문의 분리·추방 뉘앙스를 담되, 가족 내부 정리의 서술임을 지나치게 폭력적으로 만들지 않습니다.
- source_word: ወኵሎ፡ ወሀቦ፡
  english_pob_choice: but he gave everything to him
  chosen_korean: 그러나 그는 그에게 모든 것을 주었습니다
  alternatives_korean:
  - 그러나 그는 그에게 다 주었습니다
  - 그러나 그는 모든 것을 그에게 주었습니다
  lexicon: 대명사 목적어 + 전부성 표현
  rationale: 게에즈의 목적어 접미사 ‘-to him’를 반영해 ‘그에게’를 살렸고, 영어 POB의 수정본도 이를 지지합니다.
theological_decisions:
- issue: ‘as I am’의 비교 구문을 한국어에서 어떻게 보존할지
  chosen_reading: ‘그들이 나와 같이 복을 받게 하려는 것입니다’로 번역해, 축복의 상태가 화자와 유비적임을 유지했습니다.
  alternative_readings:
  - ‘그들이 나처럼 복되게 되게 하려는 것입니다’
  - ‘그들이 나와 같이 복되도록 하려는 것입니다’
  rationale: 원문의 비교적 진술을 과장된 신격화 없이 그대로 살려, 자녀들의 축복이 화자의 복과 같은 성격임을 드러냅니다.
  doctrine_reference: 비교 구문 보존 / 문맥적 직역 원칙
