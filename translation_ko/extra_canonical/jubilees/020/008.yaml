revisions:
- from: 그리고 그들은 내 이름으로 너희 자녀를 축복할 것이니, 그들이 나와 같이 복을 받게 하려는 것입니다. 그리고 그는 이스마엘과 그의 아들들에게, 그리고 그두라의 아들들에게 선물을 주고, 그들을 그의 아들 이삭에게서 떠나 보내었습니다. 그러나 그는 그에게 모든 것을 주었습니다.[a]
  to: 그리고 그들은 나와 같이 복을 받도록 내 이름으로 너희 자녀들을 축복할 것입니다. 그리고 그는 이스마엘과 그의 아들들, 그리고 그두라의 아들들에게 선물을 주고, 그들을 자기 아들 이삭에게서 떠나보냈습니다. 그러나 그는 모든 것을 그에게 주었습니다.
  rationale: 첫 절의 미래 서술과 목적 관계를 한국어 문법에 맞게 복원했습니다. ‘내 이름으로’와 ‘나와 같이’의 비교 표현, 이스마엘·그두라의 후손에게 선물을 주고 이삭에게서 떠나보낸 내용, 그리고 마지막의 목적어 대명사 ‘그에게’를 모두 유지했습니다. 영어 감사 기록의 대안 각주는 한국어 본문에 별도의 의미상 또는 본문비평상 선택지를 제공하지 않으므로 옮기지 않았습니다.
