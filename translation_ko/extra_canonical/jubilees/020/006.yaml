translation:
  language: ko
  text: 그리고 태를, 그리고 당신의 몸의 씨와 당신의 땅의 씨와 당신의 가축의 떼와 양 떼를 야훼께서 복 주시기를 바랍니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወማኅፀነ
  english_pob_choice: and womb
  chosen_korean: 그리고 태를
  alternatives_korean:
  - 그리고 당신의 태를
  - 그리고 복중을
  lexicon: womb
  rationale: 게에즈의 ወማኅፀነ는 독립 명사 ‘womb/태’에 해당하므로, 동사와 붙여 ‘복 주시다’로 만들지 않고 앞절의 명사구로 유지했습니다.
- source_word: ዘርአ፡ ከርሥከ
  english_pob_choice: the seed of your body
  chosen_korean: 당신의 몸의 씨
  alternatives_korean:
  - 당신의 몸에서 난 씨
  - 당신의 자손
  lexicon: seed
  rationale: ‘씨’는 직역적이지만 생식·후손의 의미를 함께 보존하며, POB의 ‘seed’ 선택을 한국어에서도 드러냅니다.
- source_word: ዘርአ፡ ምድርከ
  english_pob_choice: the seed of your land
  chosen_korean: 당신의 땅의 씨
  alternatives_korean:
  - 당신의 땅의 소산
  - 당신의 땅에서 난 것
  lexicon: seed
  rationale: 원문은 땅의 생산물/수확을 가리키는 병렬구로 보이므로, POB의 ‘seed of your land’를 따라 농경적 결실의 이미지를 살렸습니다.
- source_word: መራዕየ
  english_pob_choice: the herds of your cattle and the flocks of
  chosen_korean: 당신의 가축의 떼와 양 떼
  alternatives_korean:
  - 당신의 가축 떼와 양 떼
  - 당신의 소 떼와 양 떼
  lexicon: herds/flocks
  rationale: 아둘라어/게에즈 መራዕየ는 ‘offspring’보다 목축 집단인 ‘herds/flocks’에 가깝기 때문에, 가축의 ‘떼’로 옮겨 목축 어휘를 유지했습니다.
theological_decisions:
- issue: 문장 말미의 절단된 형태와 축복 청원형
  chosen_reading: 현전 본문이 끝에서 끊겨 있으므로, 한국어도 완결된 서술로 보충하지 않고 축복 청원형으로만 옮겼습니다.
  alternative_readings:
  - 문맥을 보완해 완전한 축복문으로 정리하기
  - ‘…’로 미완성임을 더 강하게 표시하기
  rationale: 원문과 POB 영어가 모두 종결이 불완전하므로, 의미를 과도하게 보충하지 않는 것이 source-grounded 원칙에 부합합니다.
  doctrine_reference: '본문 비평/번역 윤리: 미완성 전승은 보충하지 않음'
