translation:
  language: ko
  text: 그리고 태를[a], 또 그분께서 당신 몸의 씨와 당신 땅의 씨와 당신 가축의 떼와 떼를[b] 복 주시기를…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 당신의 태를’. 이 ‘태’는 뒤의 ‘복 주시다’의 목적어라기보다 앞 절에 이어지는 명사구로 이해될 수 있습니다.
    reason: 게에즈 ወማኅፀነ는 독립 명사이며, 제공된 절의 앞부분이 생략되어 있어 문법적 연결에 대한 최소한의 안내가 필요합니다.
  - marker: b
    text: 직역하면 ‘그리고 떼를’. 제공된 게에즈 본문은 이 말 뒤에서 절단됩니다.
    reason: 두 번째 መራዕየ 뒤의 한정어를 보충하거나 이를 ‘양 떼’로 특정하지 않고, 전승된 본문의 불완전성을 보존합니다.
