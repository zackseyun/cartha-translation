  naturalness: 현 번역의 ‘야훼께서 … 복 주시기를 바랍니다’는 화자의 ‘바랍니다’를 덧붙여 축복 청원의 주체와 어조를 다소 바꿉니다. ‘복 주시기를’로 옮기면 현대 한국어의 격식 있는 청원형을 유지하면서도 본문의 미완결성을 드러낼 수 있습니다. ‘가축의 떼와 양 떼’는 병렬이 어색하고 원문의 불완전성을 가립니다.
