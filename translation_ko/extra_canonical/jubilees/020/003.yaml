  naturalness: 합쇼체는 일관되어 있으나, ‘칼에 의해 멸망에 넘겨지지 않고’는 다소 중첩되고 수동적입니다. ‘칼로 멸망에 넘기고’로 병렬 구조를 회복하면 현대 한국어에서도 명료합니다. 결말의 목적절을 ‘…되지 않도록’으로 한꺼번에 묶는 방식이 자연스럽습니다.
  terminology: ‘음행’, ‘부정함’, ‘저주’, ‘치욕’, ‘멸망’은 본문의 경고적·도덕적 어휘장과 한국어 성서 문체에 잘 맞습니다. ‘고모라’와 ‘소돔’ 표기도 적절합니다. 명시되지 않은 대상을 교리적으로 보충하지 않고 ‘그를’로 둔 것은 타당합니다.
