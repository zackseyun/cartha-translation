    rationale: 각주 b는 ‘모든 아들들이 칼로 멸망한다’는 대안 번역에 관한 것이므로, 절 끝이 아니라 ‘칼로 멸망에 넘기고’에 붙여야 독자가 무엇을 설명하는지 알 수 있습니다.
