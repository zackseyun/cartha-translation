base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/003.yaml
  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
  footnotes:
  - marker: a
    text: Or 'Listen to me, my children, and love'.
    reason: previous_rendering
  - marker: b
    text: Or 'and all your sons perish by the sword'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 소돔의 심판은 이러했습니다. 그들은 자기들의 악함과 음행과 부정함과 서로 간의 타락 때문에 심판을 받았으며, 음행으로 죽었습니다. 너희도 모든 음행과 부정함과 모든 죄의 더러움에서 자신을 지키십시오. 그래야 너희 이름을 저주가 되게 하지 않고, 너희 온 삶이 수치가 되지 않으며, 너희 모든 아들들이 칼에 의해 멸망에 넘겨지지 않고, 소돔처럼 저주받은 자가 되며, 너희 남은 자들 모두가 고모라의 자손들처럼 되지 않을 것입니다. 내가 너희에게 증언합니다, 내 자녀들아: 그를 사랑하십시오.[a][b]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ  / አሰምዕ
  english_pob_choice: I testify to you
  chosen_korean: 내가 너희에게 증언합니다
  alternatives_korean:
  - 내가 너희에게 말합니다
  - 들으십시오, 내 자녀들아
  lexicon: 미사용
  rationale: 어간이 ‘듣다’의 명령형이 아니라 1인칭 단수 서술형이므로, 단순 권고보다 법정/증언의 뉘앙스를 살린 ‘증언합니다’가 원문에 더 가깝습니다.
- source_word: ዝሙት
  english_pob_choice: fornication
  chosen_korean: 음행
  alternatives_korean:
  - 간음
  - 성적 타락
  lexicon: 미사용
  rationale: 문맥상 단일 행위가 아니라 소돔의 전반적 성적 타락을 가리키므로, 한국어 성서어휘에서 넓은 범위를 갖는 ‘음행’이 적합합니다.
- source_word: ወርኵስ / ፃማነ ኀጢአት
  english_pob_choice: uncleanness / defilement of sin
  chosen_korean: 부정함 / 모든 죄의 더러움
  alternatives_korean:
  - 더러움 / 죄의 오염
  - 부정 / 죄의 오염
  lexicon: 미사용
  rationale: 앞의 ‘부정함’은 의례적·도덕적 불결을, 뒤의 ‘죄의 더러움’은 죄가 주는 오염 상태를 살려 서로 구분해 옮겼습니다.
- source_word: ለመርገም / ለተፋጽዮ / ለሙስና
  english_pob_choice: a curse / a reproach / destruction
  chosen_korean: 저주가 되게 하지 않고, … 수치가 되지 않으며, … 멸망에 넘겨지지 않고
  alternatives_korean:
  - 저주로 만들지 않고, … 치욕이 되지 않으며, … 파멸로 넘겨지지 않고
  - 저주를 받게 하지 않고, … 모욕이 되지 않으며, … 멸망에 이르게 하지 않고
  lexicon: 미사용
  rationale: 세 개의 목적격 표현이 평행을 이루므로, 각각을 결과 상태로 보이게 하되 한국어에서는 ‘되다/넘겨지다’로 자연스럽게 대응시켰습니다.
- source_word: በሰይፍ
  english_pob_choice: by the sword
  chosen_korean: 칼에 의해
  alternatives_korean:
  - 칼로
  - 칼에 의해 죽게
  lexicon: 미사용
  rationale: 수단을 표시하는 전치사구이므로, 직접 원인보다 매개 수단을 드러내는 ‘칼에 의해’로 옮겼습니다.
theological_decisions:
- issue: 소돔과 고모라에 대한 경고의 기능
  chosen_reading: 단순 역사 회고가 아니라, 현재 청중에게 성적 타락과 그 결과를 피하라는 경고로 읽히도록 옮겼습니다.
  alternative_readings:
  - 소돔의 과거 심판을 설명하는 서술로만 읽기
  - 도덕적 경고를 약화한 중립적 역사 진술로 처리하기
  rationale: 원문은 소돔의 심판을 예로 들고 바로 ‘너희도’로 전환하므로, 경고적·권면적 기능이 중심입니다.
  doctrine_reference: 권면과 경고의 본문 기능
- issue: ‘그를 사랑하십시오’의 대상을 유지
  chosen_reading: 문맥상 이어질 ‘하늘의 하나님’을 미리 가리키는 남성 단수 대명사를 그대로 ‘그를’로 남겼습니다.
  alternative_readings:
  - ‘하나님을 사랑하십시오’로 대상 보충
  - 대상을 일반화해 ‘그분을 사랑하십시오’로 번역
  rationale: 직전 절만으로는 대상이 완전히 명시되지 않지만, 주어진 본문 형태와 다음 절의 연결을 훼손하지 않기 위해 대상을 과도하게 보충하지 않았습니다.
  doctrine_reference: 문맥 연결 보존
