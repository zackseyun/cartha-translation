  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
  footnotes:
  - marker: a
    text: The final clause is syntactically dense in Ge'ez. The sense appears to be that Abraham urged mutual love and a public life marked by justice and righteousness among all peoples.
    reason: segmentation_note
    anchor_ref: '20:1'
  - marker: b
    text: Or 'and Isaac and his sons'.
    reason: previous_rendering
  - marker: c
    text: Or 'each toward the other, to practice'.
    reason: previous_rendering
  - marker: d
    text: Or 'and that they should thus be'.
    reason: previous_rendering
  - marker: e
    text: Or 'walking each toward the other'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 마흔두 번째 희년[a], 곧 제칠주의 첫해에 아브라함이 이스마엘과 그의 열두 아들, 이삭과 그의 두 아들, 그리고 그두라의 여섯 아들과 그들의 자녀들을 불러 모았습니다. 그는 그들에게 주의 길을 지켜 의를 행하고, 각자가 자기 형제를 사랑하며, 모든 사람 가운데서도 서로 함께 걸어 땅에서 정의와 의를 행하도록 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍኖተ፡ እግዚአብሔር
  english_pob_choice: the way of the LORD
  chosen_korean: 주의 길
  alternatives_korean:
  - 야훼의 길
  - 주님의 길
  lexicon: ፍኖት / መንገድ = 길, 삶의 방식
  rationale: 지시 대상이 야훼이므로 ‘주의 길’로 옮기되, 본문이 요구하는 언약적 삶의 방식을 한국어에서도 자연스럽게 드러냈습니다.
- source_word: ጽድቀ፡
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  lexicon: צדק / ጽድቅ = 의
  rationale: POB 기본 용례에 맞춰 ‘의’로 옮기고, 뒤의 ‘정의’와 구별해 문맥상 반복을 살렸습니다.
- source_word: ይሖሩ፡ አሐዱ፡ አሐዱ፡ ላዕሌሆሙ
  english_pob_choice: walking together
  chosen_korean: 서로 함께 걸어
  alternatives_korean:
  - 함께 걸으며
  - 서로 마주 보며 걸어
  lexicon: הלך / ይሖሩ = 걷다, 행하다
  rationale: 보조번역의 수정사항처럼 ‘걷다’의 동사를 살리되, 관용적 의미를 한국어에서 자연스럽게 전달하도록 ‘서로 함께 걸어’로 옮겼습니다.
- source_word: ገቢረ፡ ፍትሕ፡ ወጽድቅ፡
  english_pob_choice: practice justice and righteousness
  chosen_korean: 정의와 의를 행하도록
  alternatives_korean:
  - 정의와 의를 실천하도록
  - 정의와 의를 행하며
  lexicon: ፍትሕ = 정의, ጽድቅ = 의
  rationale: 원문의 병렬을 보존하기 위해 ‘정의와 의’를 유지했고, ‘행하다’로 실제적 실천의 뉘앙스를 살렸습니다.
- source_word: ወይስሐቅሃ፡ ወደቂቀ፡ ክልኤሆሙ፡
  english_pob_choice: and Isaac and his two sons
  chosen_korean: 이삭과 그의 두 아들
  alternatives_korean:
  - 이삭과 그의 두 아들들
  - 이삭과 그의 아들 두 사람
  lexicon: 문맥상 ‘two sons’ = 두 아들
  rationale: 수량 표현을 한국어 관용에 맞게 직역하여, 앞뒤의 대칭 구조를 분명하게 했습니다.
theological_decisions:
- issue: ‘주의 길’을 야훼의 언약적 삶의 방식으로 어떻게 드러낼지
  chosen_reading: 직역적이되 한국어 성경에서 자연스러운 ‘주의 길’을 택했습니다.
  alternative_readings:
  - ‘야훼의 길’로 직접 음역
  - ‘주님의 길’로 완화
  rationale: 본문은 야훼의 명령과 삶의 방식을 연결하므로 직접적 관계를 살려야 합니다. 동시에 한국어 독자가 본문을 자연스럽게 읽도록 ‘주의 길’이 가장 균형적입니다.
  doctrine_reference: 언약적 순종과 행위 윤리
- issue: ‘walking together’의 의미를 단순 동작인지 공동체적 삶인지
  chosen_reading: 신체적 동작보다 공동체적으로 함께 살아가는 행위 규범으로 옮겼습니다.
  alternative_readings:
  - 그냥 ‘함께 걷다’로만 번역
  - ‘서로에게 향해 걷다’처럼 매우 직역
  rationale: 게즈 원문과 POB 주석은 이 구절이 공동체적 정의와 의를 향한 공적 삶을 뜻함을 시사합니다. 그래서 ‘서로 함께 걸어’로 번역해 행위 윤리를 드러냈습니다.
  doctrine_reference: 공동체 윤리와 공적 의
