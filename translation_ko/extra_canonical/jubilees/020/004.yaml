  yaml_path: translation/extra_canonical/jubilees/020/004.yaml
  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: ko
  text: 하늘의 하나님을 섬기고, 그분의 모든 명령을 굳게 붙드십시오. 그들의 우상들과 그들의 부정함을 따라가지 마십시오. 또 너희 자신을 위하여 주조한 신들이나 새긴 형상을 만들지 마십시오. 그것들은 헛것이며 그 안에 영이 없기 때문입니다. 그것들은 손으로 만든 것이며, 그것들을 신뢰하는 모든 사람은 아무것도 아닌 것을 신뢰하는 것입니다. 그것들을 섬기지도 말고 그것들에게 절하지도 마십시오. 그러나 하나님을 섬기십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰማይ
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘 하나님
  - 하늘의 신
  lexicon: 하나님
  rationale: 지정격 표현을 살려 ‘하늘의 하나님’으로 옮기고, source의 신학적 호칭을 평이한 표준어로 유지했습니다.
- source_word: ትጸመዱ፡ ኵሎ፡ ትእዛዞ
  english_pob_choice: cling to all his commandments
  chosen_korean: 모든 그분의 명령을 지키라고 하시며
  alternatives_korean:
  - 그분의 모든 계명을 붙들라고 하시며
  - 모든 그분의 명령에 매달리라고 하시며
  lexicon: 율법 / 명령
  rationale: ‘cling to’의 결속감을 살리되 한국어에서는 자연스러운 순종 표현인 ‘지키다’로 옮겼습니다.
- source_word: ጣዖቶሙ፡ ... ርኵሶሙ
  english_pob_choice: their idols and after their uncleanness
  chosen_korean: 그들의 우상들과 그들의 더러움
  alternatives_korean:
  - 그들의 우상들과 그들의 부정함
  - 그들의 우상들과 그들의 불결함
  lexicon: 우상 / 더러움
  rationale: revision pass의 ‘uncleanness’를 반영해 도덕적·의례적 부정성을 드러내는 ‘더러움’을 택했습니다.
- source_word: ግብረ፡ እደው
  english_pob_choice: the work of hands
  chosen_korean: 사람의 손으로 만든 것
  alternatives_korean:
  - 손으로 만든 작품
  - 손의 일
  lexicon: 손 / 만들다
  rationale: 우상에 대한 성경적 상투 표현인 ‘손으로 만든 것’의 의미를 풀어, 제작물이라는 점을 분명히 했습니다.
theological_decisions:
- issue: ‘영이 없다’는 진술의 의미
  chosen_reading: 우상은 실재적 생명도, 하나님께서 주시는 영적 실재도 없다는 선언으로 읽고 ‘그 안에는 영이 없기 때문’으로 직역했습니다.
  alternative_readings:
  - 그 안에는 생기(호흡)가 없기 때문
  - 그 안에는 성령이 없기 때문
  rationale: source의 መንፈስ은 일반적 ‘영’이지 성령으로 특정되지 않으므로, 본문의 우상 무가치성을 직접 드러내는 번역이 적합합니다.
  doctrine_reference: 우상 무가치성 / 참 하나님과 피조물의 구별
- issue: ‘절하다’와 ‘섬기다’의 병렬 금지
  chosen_reading: 예배 행위를 가리키는 두 동사를 모두 살려 ‘섬기지도 말고, 그것들에게 절하지도 마십시오’로 옮겼습니다.
  alternative_readings:
  - 그것들을 예배하지도 말고, 굽어 절하지도 마십시오
  - 그것들을 섬기지도 말고, 무릎 꿇지도 마십시오
  rationale: source의 금지는 행위와 태도를 함께 겨냥하므로, 봉사/예배와 경배 자세를 병렬로 유지했습니다.
  doctrine_reference: 우상숭배 금지
