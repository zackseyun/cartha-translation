translation:
  language: ko
  text: 그리고 그들이 언약에 따라 아들들에게 할례를 행하고, 그들과 맺어진 언약에서 벗어나지 않으며 — 여호와께서 명하신 모든 길에서 오른쪽으로도 왼쪽으로도 치우치지 않으며 — 우리가 모든 음행과 더러움에서 스스로를 지키고, 우리 가운데 있는 모든 음행과 더러움을 버리도록 하였습니다. 또 너희 가운데 있는 여자가 음행을 범하거나, 심지어 딸이라도, 그를 불로 태우고, 그들이 눈과 마음을 따라 음행하지 않게 하며, 가나안의 딸들 가운데서 아내를 취하지 않게 하였습니다. 왜냐하면 가나안의 씨가 땅에서 뿌리째 뽑힐 것이기 때문입니다. 그리고 그는 그들에게 감시자들의 심판을 말하였습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመ፡ ይክስቡ፡ ውሉዶሙ፡ በኪዳን፡ እንተ፡ ተካየደ፡ ምስሌሆሙ።
  english_pob_choice: circumcise their sons according to the covenant that was established with them
  chosen_korean: 언약에 따라 아들들에게 할례를 행하다
  alternatives_korean:
  - 그들과 맺은 언약에 따라 아들들을 할례하다
  - 언약에 따라 그들의 아들들에게 할례를 베풀다
  lexicon: ይክስቡ / ውሉዶሙ / በኪዳን
  rationale: 지시된 행위는 ‘아들들에 대한 할례’이며, 문맥상 아브라함 언약의 공식이 압축된 표현이므로 핵심 구조를 살려 간결하게 옮겼습니다.
- source_word: ኢይትዐደዉ፡ እምሃነ፡ ወኢፀጋመ፡ እምኵሉ፡ ፍናው፡ ዘአዘዘ፡ እግዚአብሔር።
  english_pob_choice: not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded
  chosen_korean: 오른쪽으로도 왼쪽으로도 치우치지 않다
