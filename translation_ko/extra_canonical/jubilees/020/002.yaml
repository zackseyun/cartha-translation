  - 이것에서 벗어나지 않다, 오른쪽이나 왼쪽으로도
  - 좌우로 치우치지 않다
  lexicon: 오른쪽 / 왼쪽 / 치우치다
  rationale: 히브리어적 관용구를 반영해 ‘치우치지 않다’로 옮기되, 방향 대조를 그대로 보존해 순종의 전면성을 드러냈습니다.
- source_word: ዝሙት፡ ወርኵስ፡
  english_pob_choice: fornication and uncleanness
  chosen_korean: 음행과 더러움
  alternatives_korean:
  - 간음과 더러움
  - 음행과 부정
  lexicon: ዝሙት / ወርኵስ
  rationale: 두 용어 모두 성적 부정을 가리키지만, 본문이 반복적으로 성적 범죄를 강조하므로 ‘음행’과 ‘더러움’의 직역적 구분을 유지했습니다.
- source_word: ይሤረዉ፡ ዘርአ፡ ከናአን፡ እምድር።
  english_pob_choice: for the seed of Canaan will be uprooted from the land
  chosen_korean: 가나안의 씨가 땅에서 뿌리째 뽑힐 것이기 때문입니다
  alternatives_korean:
  - 가나안의 씨가 땅에서 제거될 것이기 때문입니다
  - 가나안의 씨가 땅에서 멸절될 것이기 때문입니다
  lexicon: ይሤረዉ / ዘርአ
  rationale: 개정된 판독과 같게 ‘uprooted’의 농업적 이미지를 살려, 씨(후손)가 토지에서 뽑혀 나가는 심판을 직접적으로 표현했습니다.
