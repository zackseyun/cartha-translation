  source_fidelity: 첫 구절은 장 절단으로 인해 앞 문장에 이어지는 명사구인데, 초안의 ‘당신의 양 떼입니다’는 원문에 없는 계사·서술을 보충하여 ‘그것들이 당신의 양 떼이다’라는 독립 진술로 바꿉니다. 또한 ወትከውኑ의 미래 의미는 ‘될 것이며’로 분명히 드러내는 편이 적절합니다.
  naturalness: ‘사모하다’는 현대 한국어에서 존경·연모, 특히 낭만적 연모의 뜻으로도 쉽게 읽혀 여기의 넓은 ‘desire’보다 지나치게 관계적입니다. ‘원할 것입니다’가 자연스럽고 의미 범위도 안전합니다. 장 절단에 따른 첫 명사구의 미완결성은 보존합니다.
  terminology: ‘양 떼’와 ‘복이 되다’는 적절합니다. ‘땅의 모든 민족’도 원문의 반복된 ‘땅’을 충실히 반영합니다.
