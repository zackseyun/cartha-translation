translation:
  language: ko
  text: 당신의 양 떼입니다. 그리고 당신은 땅에서 복이 되며, 땅의 모든 민족이 당신을 사모할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዒከ፡
  english_pob_choice: your flocks
  chosen_korean: 당신의 양 떼입니다
  alternatives_korean:
  - 당신의 양 떼가 될 것입니다
  - 당신의 가축 떼입니다
  lexicon: 양 떼
  rationale: Geez의 소유격 표현을 자연스럽게 살려, 단순한 소유 묘사로 읽히는 ‘your flocks’를 현대 한국어로 간결하게 옮겼습니다.
- source_word: ወትከውኑ፡ በበረከት፡
  english_pob_choice: And you will be a blessing
  chosen_korean: 그리고 당신은 복이 되며
  alternatives_korean:
  - 그리고 당신은 복이 될 것이며
  - 그리고 당신은 축복이 되며
  lexicon: 복이 되다
  rationale: 영어 POB의 수정본처럼 ‘for a blessing’보다 직접적인 결과 상태인 ‘복이 되다’를 택해 원문의 의미를 살렸습니다.
- source_word: ወይፈትዉክሙ፡ ኵሎሙ፡ አሕዛበ፡ ምድር፡
  english_pob_choice: and all the nations of the earth will desire you
  chosen_korean: 땅의 모든 민족이 당신을 사모할 것입니다
  alternatives_korean:
  - 땅의 모든 민족이 당신을 원할 것입니다
  - 땅의 모든 민족이 당신을 바랄 것입니다
  lexicon: 사모하다
  rationale: Geez의 ‘원하다/갈망하다’ 계열을 관계적·정서적으로도 자연스럽게 담기 위해 ‘사모하다’를 선택했습니다.
theological_decisions:
- issue: ‘복이 되다’의 문법적·신학적 뉘앙스
  chosen_reading: 아브라함 계열 약속에서처럼, 수혜자가 아니라 주변에 복을 전달하는 존재가 된다는 뜻으로 읽었습니다.
  alternative_readings:
  - ‘복을 받게 된다’로 단순 수혜형으로 읽기
  - ‘축복이 된다’로 보다 교회적 어휘를 쓰기
  rationale: 문맥상 결과 상태를 말하는 표현이며, 영어 POB의 최신 수정도 이를 지지하므로 ‘복이 되다’가 가장 직접적입니다.
  doctrine_reference: 창 12:2-3의 약속 구조와 평행되는 축복-매개 구도
