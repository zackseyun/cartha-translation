    text: Or 'the seventh week of this jubilee'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 희년의 이 주의 둘째 해에 리브가가 자기 아들 야곱을 불렀습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበካልእ፡ ዓመት፡ ዘዝ፡ ሱባዔ፡
  english_pob_choice: in the second year of this week in this jubilee
  chosen_korean: “이 희년의 이 주의 둘째 해에”
  alternatives_korean:
  - “이 희년의 일곱째 주의 둘째 해에”
  - “이 희년 안의 이 주의 둘째 해에”
  lexicon: week / week-year phrase
  rationale: Ge'ez ዘዝ means “this,” so the demonstrative를 살려 “이 주”로 옮겼고, POB 수정본의 “this week in this jubilee”를 반영했습니다. 필요하면 주석으로 이전 번역의 ‘일곱째 주’ 독법을 추적할 수 있습니다.
- source_word: በዝ፡ አምቤልዉ፡
  english_pob_choice: in this jubilee
  chosen_korean: “이 희년에”
  alternatives_korean:
  - “이 희년 안에”
  - “이 희년 가운데”
  lexicon: jubilee
  rationale: 전치사와 지시어의 결합을 자연스러운 현대 한국어로 압축하되, ‘이’의 지시성을 보존했습니다.
- source_word: ጸውዐት፡
  english_pob_choice: called
  chosen_korean: “불렀습니다”
  alternatives_korean:
  - “불러 말했습니다”
  - “소집했습니다”
  lexicon: call
  rationale: 문맥상 리브가가 야곱을 직접 부르는 행위를 가리키므로 가장 مستقیم한 동사인 “부르다”를 택했습니다.
- source_word: ያዕቆብሃ፡ ወልዳ፡
  english_pob_choice: Jacob her son
  chosen_korean: “자기 아들 야곱을”
  alternatives_korean:
  - “그녀의 아들 야곱을”
  - “아들 야곱을”
  lexicon: possessive pronoun
  rationale: 소유 관계를 한국어 관용에 맞게 “자기 아들”로 옮겨 지시 대상을 분명히 했습니다.
theological_decisions:
- issue: Jubilees chronology wording
  chosen_reading: “이 희년의 이 주”라는 지시형 표현을 유지했습니다.
  alternative_readings:
  - “이 희년의 일곱째 주”
  - “이 희년의 주간”
  rationale: 원문과 POB 수정 기록 모두 ‘this week’를 지지하므로, 후대 해석으로 ‘일곱째’로 되돌리지 않고 지시형을 보존하는 것이 적절합니다.
  doctrine_reference: source fidelity / textual chronology
