translation:
  language: ko
  text: 저는 제 평생 동안 가나안의 자손의 딸들 가운데서 아내를 맞이하지 않고, 에서가 한 것처럼 악하게 행하지 않겠다고 당신 앞에서 맹세합니다.
  philosophy: optimal-equivalence
