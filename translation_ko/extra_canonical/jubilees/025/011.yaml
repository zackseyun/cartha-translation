  english_pob_choice: I will not take a wife for myself from the daughters of the seed of Canaan
  chosen_korean: 가나안의 씨에서 난 딸들 가운데서 제 아내를 맞이하지 않겠습니다
  alternatives_korean:
  - 가나안의 자손의 딸들 가운데서 아내를 취하지 않겠습니다
  - 가나안의 씨에서 난 딸들 중에서 제 아내를 얻지 않겠습니다
  lexicon: kinship/marriage formula
  rationale: ‘씨’에 해당하는 표현을 살리고, 아내를 ‘맞이하다’로 옮겨 결혼 선택의 행위를 자연스럽게 표현했습니다.
- source_word: ወኢያአኪ፡ ገቢረ፡ በከመ፡ ገብረ፡ ዔሳው።
  english_pob_choice: and that I will not act wickedly as Esau did
  chosen_korean: 또한 에서가 한 것처럼 악하게 행하지 않겠습니다
  alternatives_korean:
  - 또한 에서가 한 대로 하지 않겠습니다
  - 또한 에서처럼 행하지 않겠습니다
  lexicon: evil-doing phrase
  rationale: 게에즈 본문의 평가적 동사를 반영해 단순 비교가 아니라 ‘악하게 행하다’로 옮겼습니다.
theological_decisions:
- issue: 에서의 행위에 대한 평가를 한국어에서 어떻게 처리할지
  chosen_reading: 본문의 도덕적 평가를 유지해 ‘악하게 행하지 않겠습니다’로 번역했습니다.
  alternative_readings:
  - ‘에서가 한 것처럼 하지 않겠습니다’처럼 중립적으로 처리
  - ‘에서의 길을 따르지 않겠습니다’로 의역
  rationale: 게에즈 본문은 단순한 예시가 아니라 악행의 성격을 분명히 하므로, 이를 약화시키지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 본문의 윤리적 경고를 보존하는 번역 원칙
- issue: 서약의 1인칭 발화와 직접 호칭의 존대 처리
  chosen_reading: 서약 화자의 자기발언은 합쇼체로 유지하고, 수신자에 대한 직접 호칭은 ‘당신’으로 처리했습니다.
  alternative_readings:
  - 더 경건한 기도체로 바꾸는 방식
  - 평서형으로 완화하는 방식
  rationale: 서약문으로서의 공적·격식적 성격을 살리되, 불필요한 고어체는 피했습니다.
  doctrine_reference: 한국어 현대 문체 일관성
