translation:
  language: ko
  text: 저는 평생 제 모든 날 동안, 가나안의 씨에서 난 딸들 가운데서 제 아내를 맞이하지 않겠다고 당신 앞에서 맹세합니다. 또한 에서가 한 것처럼 악하게 행하지 않겠습니다.[a]
  philosophy: optimal-equivalence
