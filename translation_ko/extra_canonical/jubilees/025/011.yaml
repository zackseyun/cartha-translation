  - severity: low
    issue: 혼인 대상 표현의 어색함
    rationale: ‘가나안의 씨에서 난 딸들’은 직역 흔적이 강합니다. 원문의 계보 표현은 ‘가나안의 자손의 딸들’로 자연스럽게 옮길 수 있습니다.
