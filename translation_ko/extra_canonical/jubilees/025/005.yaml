translation:
  language: ko
  text: 이제 내 아들아, 내 말을 들으십시오. 네 어머니의 뜻을 행하십시오. 이 땅의 딸들 가운데서 아내를 맞지 마십시오. 오히려 내 아버지의 집과 내 아버지의 친족 가운데서[a] 네 아내를 맞으십시오. 지극히 높으신 하나님께서 너에게 복을 주실 것이며, 네 자녀는 의로운 자손과 거룩한 씨가 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈 본문은 ‘내 아버지의 집’을 이 구절에서 다시 반복합니다(직역하면 ‘내 아버지의 집과 내 아버지의 친족에게서 … 내 아버지의 집에서 아내를 맞으십시오’). 이는 강조적 반복일 수 있으며, 현존 본문의 구절 분절과 관련된 불확실성을 반영할 수도 있습니다.
    reason: 원문의 반복을 투명하게 보존하면서, 반복의 문장상 기능이 확정적이지 않음을 밝힙니다.
lexical_decisions:
- source_word: ስማዕ፡ ቃለየ፡
  english_pob_choice: listen to my voice
  chosen_korean: 내 말을 들으라
  alternatives_korean:
  - 내 목소리를 들으라
  - 내 음성을 들으라
  lexicon: 듣다 / 말
  rationale: 게으즈 원문과 영어본 모두 화자의 ‘voice’를 문자적으로만이 아니라 권위 있는 당부로 제시하므로, 자연스럽게 ‘내 말을 들으라’로 옮겨 의미를 살렸습니다.
- source_word: ወግበር፡ ፈቃደ፡ ለአምከ፡
  english_pob_choice: do the will of your mother
  chosen_korean: 네 어머니의 뜻을 행하라
  alternatives_korean:
  - 네 어머니의 뜻을 따르라
  - 네 어머니의 뜻에 순종하라
  lexicon: 뜻 / 행하다
  rationale: 원문은 단순한 감정 동의가 아니라 실제 행위를 요구하므로 ‘뜻을 행하라’로 번역해 명령의 직접성을 유지했습니다.
- source_word: እምአዋልደ፡ ዝምድር፡
  english_pob_choice: from the daughters of this land
  chosen_korean: 이 땅의 딸들 가운데서
  alternatives_korean:
  - 이 땅의 여자들 가운데서
  - 이 땅 출신의 딸들 가운데서
  lexicon: 딸들 / 이 땅
  rationale: ‘딸들’은 혼인 대상의 출신 집단을 가리키는 관용적 표현이므로, 영어본의 의미를 유지하면서도 한국어에서 자연스러운 집합 표현으로 처리했습니다.
- source_word: እምቤተ፡ አቡየ፡ / እምዘመደ፡ አቡየ፡
  english_pob_choice: from my father’s house and from my father’s kindred
  chosen_korean: 내 아버지의 집과 내 아버지의 친족 가운데서
  alternatives_korean:
  - 내 아버지의 집과 내 아버지의 친족에서
  - 내 아버지 집안과 친족 가운데서
  lexicon: 집 / 친족
  rationale: 게으즈의 병렬 구조를 그대로 살려 ‘집’과 ‘친족’을 분리했고, 관계 출처를 나타내는 ‘가운데서’로 혼인 상대의 범위를 명확히 했습니다.
- source_word: አምላከ፡ ልዑል፡
  english_pob_choice: God Most High
  chosen_korean: 하나님 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 하나님
  - 가장 높으신 하나님
  lexicon: 하나님 / 지극히 높으신 분
  rationale: ‘Most High’는 하나님의 호칭이므로 ‘하나님’과 호칭적 수식을 함께 두어 문체를 살리되, 한국어에서 자연스러운 존칭 구조로 옮겼습니다.
- source_word: ትውልደ፡ ጽድቅ፡ ወዘርአ፡ ቅዱሰ።
  english_pob_choice: a righteous offspring and a holy seed
  chosen_korean: 의로운 자손이 되고 거룩한 씨가 될 것이다
  alternatives_korean:
  - 의로운 후손이 되고 거룩한 씨가 될 것이다
  - 의로운 자손이며 거룩한 씨가 될 것이다
  lexicon: 자손 / 씨 / 의롭다 / 거룩하다
  rationale: ‘offspring’와 ‘seed’의 반복적 병렬을 그대로 드러내기 위해 ‘자손’과 ‘씨’를 구분했고, 서술형 평행을 살리기 위해 ‘-이 되고’로 연결했습니다.
theological_decisions:
- issue: 혼인 금지의 근거와 출처 범위
  chosen_reading: 이 본문은 특정 민족 배제가 아니라, 화자 가문의 범위 안에서 배우자를 택하라는 가문-언약적 지시로 읽었습니다.
  alternative_readings:
  - 인근 족속과의 혼인을 전면 금지하는 민족적 규정
  - 단순한 가족 선호를 말하는 사적 조언
  rationale: 게으즈 원문과 영어본 모두 ‘이 땅의 딸들’과 ‘내 아버지의 집/친족’을 대조해 혼인 출처를 규정하므로, 민족주의적 일반명령보다 가문 중심의 지시로 유지하는 것이 본문에 더 가깝습니다.
  doctrine_reference: 창세기 전승의 족장 혼인 규범과 언약 계보 보존
- issue: ‘하나님 지극히 높으신 분’의 호칭 처리
  chosen_reading: ‘Most High’를 하나님의 명칭으로 처리하여 ‘하나님 지극히 높으신 분’으로 옮겼습니다.
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  rationale: 호칭성과 서술성을 함께 담기 위해 명사 ‘하나님’과 수식어 ‘지극히 높으신 분’을 병기해, 본문의 축복 선언이 지닌 경외감을 보존했습니다.
  doctrine_reference: 하나님의 지극히 높으심에 대한 성서적 호칭
