  lexicon: concessive phrase + command
  rationale: 게에즈의 ወምስለ는 단순한 병렬이 아니라 양보의 뉘앙스를 가지므로 ‘불구하고’로 옮기고, ዘአዘዘኒ는 분명한 ‘명령하다’로 반영했습니다.
- source_word: ዕሥራ፡ ወክልኤተ፡ ዓመተ፡
