  - 이십이 년 동안
  lexicon: duration
  rationale: 기간의 지속성을 드러내기 위해 ‘지났는데도’를 붙여 압박이 장기적으로 계속되었음을 한국어에서 자연스럽게 살렸습니다.
- source_word: ይትኃአዘኒ፡ ወያበዝኀ፡ ... ይብል፡
  english_pob_choice: has been urging me and pressing me, speaking to me and saying
  chosen_korean: 나를 권면하고 재촉하며 내게 말하기를
  alternatives_korean:
  - 나를 간청하고 강권하며 내게 말하기를
