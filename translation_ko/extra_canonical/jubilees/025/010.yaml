  text: And despite all this that he has commanded me[a], these twenty-two years Esau has been urging me and pressing me, speaking to me and saying, ‘My brother, take a wife, one of the sisters of my two wives,’ but I have not been willing to do as he did.
  footnotes:
  - marker: a
    text: The phrase 'for these twenty-two years' is retained from the Ethiopic as given; it likely refers to a prolonged period of pressure from Esau rather than a single event.
    reason: cultural_note
    anchor_ref: '25:10'
  - marker: b
    text: Or 'And with all this,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 명령한 이 모든 일에도 불구하고, 이십이 년 동안[a] 에서는 나를 권하고 재촉하며 내게 말하여 이르기를 ‘내 형제여, 내 두 아내의 누이들 가운데서 아내를 하나 맞이하라’ 하였습니다. 그러나 나는 그가 한 것처럼 하기를 원하지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 이십이 년 동안’입니다. 에티오피아어 본문은 이 기간 표현을 보존하며, 이는 한 번의 사건이라기보다 에서가 오랫동안 가한 권유와 압박을 가리키는 것으로 보입니다.
    reason: 기간 표현의 문법적 배치와 정확한 지시 범위가 다소 난해하므로, 본문 의미를 바꾸지 않고 영어 POB 감사 기록의 설명을 한국어로 제공합니다.
