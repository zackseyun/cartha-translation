  lexicon: repeated pressure verbs
  rationale: 두 동사 모두 반복적이고 지속적인 압박을 나타내므로 ‘권면하다/재촉하다’로 중복성을 살렸습니다.
- source_word: ብእሲተ፡ አሐተ፡ እኅትነ፡ ለአንስቲያየ፡ ክልኤቲ፡
  english_pob_choice: one of the sisters of my two wives
  chosen_korean: 내 두 아내의 누이들 가운데서 아내를 하나
  alternatives_korean:
  - 내 두 아내의 자매들 가운데서 한 아내를
