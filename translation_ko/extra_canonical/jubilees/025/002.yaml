  text: And she spoke to him, saying, “My son, do not take for yourself a wife from the daughters of Canaan, as Esau your brother did, who took for himself two wives from the daughters of Canaan, and they have made my spirit bitter by all their unclean conduct.”
translation:
  language: ko
  text: 그녀가 그에게 말했습니다. “내 아들아, 가나안의 딸들 가운데서 아내를 택하지 마십시오. 네 형 에서가 가나안의 딸들 가운데서 두 아내를 취하였고, 그 두 여자가 자기들의 온갖 부정한 행위로 내 영을 쓰라리게 하였습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተናገረቶ፡ ... ትብል፡
  english_pob_choice: And she spoke to him, saying
  chosen_korean: 그녀가 그에게 말했습니다
  alternatives_korean:
  - 그가 그에게 말했습니다
  - 그녀가 그에게 이르러 말했습니다
  lexicon: source grammar (feminine verb form)
  rationale: Geez 동사의 여성형이므로 화자는 남성이 아니라 여성으로 분명히 옮겼습니다. 한국어에서는 장황한 ‘이르러’보다 간결한 ‘말했습니다’가 서술 흐름에 맞습니다.
- source_word: ኢትንሣእ፡ ለከ፡ ብእሲተ፡
  english_pob_choice: do not take for yourself a wife
  chosen_korean: 아내를 택하지 마라
  alternatives_korean:
  - 아내를 데려오지 마라
  - 아내를 취하지 마라
  lexicon: take a wife
  rationale: 문맥상 결혼 상대를 ‘취하다/택하다’는 의미이므로 자연스럽고 직설적인 ‘아내를 택하다’로 옮겼습니다. ‘데려오다’는 의미가 약해지고, ‘취하다’는 다소 문어적입니다.
- source_word: እም፡ አዋልደ፡ ከናአን፡
  english_pob_choice: from the daughters of Canaan
  chosen_korean: 가나안의 딸들 가운데서
  alternatives_korean:
  - 가나안의 딸들 중에서
  - 가나안 사람의 딸들 가운데서
  lexicon: source phrase
  rationale: 출발지/범주를 나타내는 전치구를 한국어 관용에 맞게 ‘가운데서’로 풀어, 선택의 범위를 분명히 했습니다.
- source_word: መንፈሰያ
  english_pob_choice: my spirit
  chosen_korean: 내 영
  alternatives_korean:
  - 내 마음
  - 내 심령
  lexicon: spirit
  rationale: 원문은 ‘영’(spirit)을 가리키므로 심리적 완화어인 ‘마음’보다 직접적인 ‘영’을 유지했습니다.
- source_word: ርኵስ
  english_pob_choice: unclean
  chosen_korean: 부정한
  alternatives_korean:
  - 더러운
  - 불결한
  - 추한
  lexicon: unclean/pure-impure
  rationale: 의례적·도덕적 부정성을 함께 지닐 수 있는 어휘이므로, 전통적인 성서 한국어에서 널리 쓰이면서도 의미를 보존하는 ‘부정한’을 택했습니다.
theological_decisions:
- issue: ‘my spirit was made bitter’의 정서적 강도
  chosen_reading: ‘내 영을 쓰라리게 하였다’로 옮겨, 단순한 불쾌감보다 깊은 내적 고통을 드러냈습니다.
  alternative_readings:
  - 내 영을 괴롭게 하였다
  - 내 영을 비통하게 하였다
  rationale: ‘쓴맛을 내다/쓰라리게 하다’는 원문의 감각적·정서적 비유를 살리면서도 과장하지 않습니다. 후속 문맥의 가족 갈등과도 잘 맞습니다.
  doctrine_reference: 정서 표현의 직역성과 비유 보존
- issue: ‘unclean conduct’의 윤리·의례적 함의
  chosen_reading: ‘온갖 부정한 행위’로 옮겨, 단순한 도덕적 흠결로 축소하지 않았습니다.
  alternative_readings:
  - 온갖 더러운 행실
  - 모든 불결한 행동
  rationale: 원문은 행위의 전반적 부정성을 강조하므로 ‘행위’로 유지하되, ‘부정한’으로 의례적/윤리적 중첩을 함께 살렸습니다.
  doctrine_reference: 부정/정결 어휘의 이중 의미 보존
