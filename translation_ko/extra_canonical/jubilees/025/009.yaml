  yaml_path: translation/extra_canonical/jubilees/025/009.yaml
  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
  footnotes:
  - marker: a
    text: The wording may also be understood as 'that I might not defile myself and that my ways might not be corrupted.'
    reason: lexical_alternative
    anchor_ref: '25:9'
translation:
  language: ko
  text: 그러므로 나는 내 모든 길에서 평생 동안 죄를 짓거나 더럽혀지지 않도록 내 영을 지켰습니다.[a] 음란과 음행 때문에 내 아버지 아브라함이 내게 많은 명령을 내렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 ‘내 자신을 더럽히지 않고 내 길들이 부패하지 않게 하려고’로도 이해할 수 있습니다.
    reason: 원문의 동사 및 결합 관계가 허용하는 대안적 독해를 영어 POB 감사 기록에 맞추어 보존합니다.
