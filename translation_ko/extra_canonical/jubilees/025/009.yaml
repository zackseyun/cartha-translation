  text: And for this reason I have guarded my spirit[a], so that I might not sin and might not be defiled in all my ways all the days of my life; for because of wantonness and fornication Abraham my father gave me many commands.
  footnotes:
  - marker: a
    text: The wording may also be understood as 'that I might not defile myself and that my ways might not be corrupted.'
    reason: lexical_alternative
    anchor_ref: '25:9'
translation:
  language: ko
  text: 그러므로 나는 내 영을 지켜서, 내 모든 길에서 평생 동안 죄를 짓지 않고 더럽혀지지 않게 하였습니다. 이는 음란과 음행 때문에 내 아버지 아브라함이 내게 많은 명령을 주었기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብኩ፡ "በመንፈስየ"
  english_pob_choice: I have guarded my spirit
  chosen_korean: 나는 내 영을 지켜서
  alternatives_korean:
  - 나는 내 영을 지켜서
  - 나는 내 영을 보호해서
  lexicon: 영
  rationale: 원문의 '영'은 내적 자아/생명력의 보존 행위로 읽히며, POB의 'spirit'을 한국어 합쇼체로 자연스럽게 옮기기 위해 '내 영'을 택했습니다.
- source_word: ከመ፡ ኢይአብስ፡
  english_pob_choice: so that I might not sin
  chosen_korean: 죄를 짓지 않고
  alternatives_korean:
  - 죄를 짓지 않게
  - 범죄하지 않게
  lexicon: 죄를 짓다
  rationale: ‘sin’은 추상명사보다 행위 표현이 문맥상 더 직접적이므로, 금지 목적을 살린 동사구로 옮겼습니다.
- source_word: ወኢይማስን፡
  english_pob_choice: and might not be defiled
  chosen_korean: 더럽혀지지 않게
  alternatives_korean:
  - 더럽혀지지 않게
  - 부정하게 되지 않게
  - 오염되지 않게
  lexicon: 더럽히다
  rationale: 개정된 영어 본문이 선택한 'defiled'는 도덕적·의례적 부정의 뉘앙스를 가지므로, 그 긴장을 살리는 '더럽혀지다'를 사용했습니다.
- source_word: በኵሉ፡ ፍናውየ፡ ... በኵሉ፡ መዋዕለ፡ ሕይወትየ፡
  english_pob_choice: in all my ways all the days of my life
  chosen_korean: 내 모든 길에서 평생 동안
  alternatives_korean:
  - 내 모든 길에서 평생 동안
  - 내 모든 행실에서 생애의 모든 날 동안
  lexicon: 길
  rationale: ‘ways’는 단순한 이동 경로가 아니라 삶의 행실 전체를 가리키므로, 한국어 성경 문맥에 맞는 '길'을 유지하되 시간 범위는 '평생 동안'으로 자연화했습니다.
- source_word: ምርዐት፡ ወዝሙት፡
  english_pob_choice: wantonness and fornication
  chosen_korean: 음란과 음행
  alternatives_korean:
  - 음란과 음행
  - 방탕과 간음
  - 방종과 음행
  lexicon: 음란
  rationale: 두 용어는 성적 방종과 성적 부정을 병렬로 강조하므로, 한국어 교회용 어휘 중 원문의 도덕적 강도를 보존하는 '음란과 음행'을 택했습니다.
- source_word: አብርሃም፡ አቡየ፡' አዝዘትየ።
  english_pob_choice: Abraham my father gave me many commands
  chosen_korean: 내 아버지 아브라함이 내게 많은 명령을 주었기 때문입니다
  alternatives_korean:
  - 내 아버지 아브라함이 내게 많은 명령을 주었기 때문입니다
  - 아버지 아브라함이 나에게 많은 계명을 주었기 때문입니다
  lexicon: 명령
  rationale: 여기서는 종교적 '계명'보다 구체적 지시들의 다수를 가리키는 '많은 명령'이 원문과 POB의 의미 범위에 더 가깝습니다.
theological_decisions:
- issue: ‘내 영을 지켰다’의 의미 범위
  chosen_reading: 도덕적 죄와 의례적 부정에 물들지 않도록 내적 삶을 보존했다는 뜻으로 이해하여 번역했습니다.
  alternative_readings:
  - 자기 영혼을 엄격히 절제했다
  - 자기 생명을 보존했다
  rationale: 원문과 영어 POB의 병렬은 죄와 더러움의 회피에 초점이 있으므로, 이를 내적 삶의 보존으로 풀어 과도한 심리화나 생존 의미로 좁히지 않았습니다.
  doctrine_reference: 정결/부정 개념의 윤리적·의례적 중첩
- issue: ‘더럽혀지지 않게’와 ‘부패되지 않게’의 대안
  chosen_reading: 본문에는 '더럽혀지지 않게'를 두고, 영어 주석이 허용하는 대안 이해는 각주로 밝혔습니다.
  alternative_readings:
  - 더럽혀지지 않게
  - 타락되지 않게
  - 부패되지 않게
  rationale: 개정된 영어 본문이 'defiled'를 채택했으므로 본문은 이를 따르되, 원문이 허용하는 ‘자기 자신을 더럽히다/길이 부패하다’라는 대안 독해는 각주로 보존했습니다.
  doctrine_reference: 본문 비평과 의미 범위 보존
