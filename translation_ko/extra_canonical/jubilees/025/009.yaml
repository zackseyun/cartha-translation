theological_decisions:
- issue: ‘내 영을 지켰다’의 의미 범위
  chosen_reading: 도덕적 죄와 의례적 부정에 물들지 않도록 내적 삶을 보존했다는 뜻으로 이해하여 번역했습니다.
  alternative_readings:
  - 자기 영혼을 엄격히 절제했다
  - 자기 생명을 보존했다
  rationale: 원문과 영어 POB의 병렬은 죄와 더러움의 회피에 초점이 있으므로, 이를 내적 삶의 보존으로 풀어 과도한 심리화나 생존 의미로 좁히지 않았습니다.
  doctrine_reference: 정결/부정 개념의 윤리적·의례적 중첩
- issue: ‘더럽혀지지 않게’와 ‘부패되지 않게’의 대안
  chosen_reading: 본문에는 '더럽혀지지 않게'를 두고, 영어 주석이 허용하는 대안 이해는 각주로 밝혔습니다.
  alternative_readings:
  - 더럽혀지지 않게
  - 타락되지 않게
  - 부패되지 않게
  rationale: 개정된 영어 본문이 'defiled'를 채택했으므로 본문은 이를 따르되, 원문이 허용하는 ‘자기 자신을 더럽히다/길이 부패하다’라는 대안 독해는 각주로 보존했습니다.
  doctrine_reference: 본문 비평과 의미 범위 보존
