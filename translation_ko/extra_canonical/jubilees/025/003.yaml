  text: For all their conduct is fornication and impurity, and there is no righteousness with them, for it is evil.
translation:
  language: ko
  text: 그들의 모든 행위는 음행과 부정이며, 그들 가운데에는 의가 없습니다. 이는 악하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝሙት / ምርጓት
  english_pob_choice: fornication and impurity
  chosen_korean: 음행과 부정
  alternatives_korean:
  - 간음과 더러움
  - 음행과 더러움
  - 음란과 부정
  lexicon: 음행 / 부정
  rationale: 원문의 두 항목을 각각 도덕적 성적 타락과 의례·윤리적 부정을 함께 가리키는 표현으로 살려, POB의 ‘fornication and impurity’ 구분을 유지했습니다.
- source_word: ጽድቀ
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 공의
  - 정의
  lexicon: 의
  rationale: 본문의 부정문 구조상 하나님 앞에서의 올바름/의가 전혀 없다는 뜻이므로, 표준적인 성경 번역어 ‘의’를 사용했습니다.
- source_word: እኩይ
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악한 것
  - 나쁨
  - 사악함
  lexicon: 악
  rationale: 마지막 이유절의 평가어로서 행위 전체의 본질을 판정하는 말이므로, 단일 명사형 ‘악’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘there is no righteousness with them’의 범위
  chosen_reading: 그들 가운데에는 의가 없습니다
  alternative_readings:
  - 그들에게는 의가 없습니다
  - 그들 안에는 의가 없습니다
  rationale: 원문의 ‘with them’은 단순 소유보다 동반·임재 부재를 넓게 시사하므로, 관계적 부재를 드러내는 ‘그들 가운데에는’으로 옮겼습니다.
  doctrine_reference: 인간의 행위가 의의 기준에 미치지 못한다는 성경적 도덕 평가
- issue: 이유절 ‘for it is evil’의 연결
  chosen_reading: 그것은 악하기 때문입니다
  alternative_readings:
  - 이는 악하기 때문입니다
  - 그들은 악하기 때문입니다
  rationale: 지시 대상은 앞의 ‘그들의 모든 행위’이므로, 한국어에서 자연스러운 지시대명사 ‘그것’을 사용해 전체 진술의 이유를 분명히 했습니다.
  doctrine_reference: 행위의 본질에 대한 직접적 도덕 판정
