  to: 그때 야곱이 자기 어머니 리브가에게 말했습니다. “보십시오, 저는 이제 아홉 주간의 해[a]를 산 사람입니다. 저는 여자를 알지 못했고, 어떤 여자에게도 손을 대지 않았으며, 약혼하지도 않았고, 가나안의 딸들 가운데서 아내를 맞이하려고도 하지 않습니다.”
  rationale: 원문의 네 가지 부정, 곧 여자를 알지 않음, 손을 대지 않음, 약혼하지 않음, 가나안 여인과 혼인할 의도가 없음은 모두 유지했습니다. 연령 표현은 원문 관용구를 각주와 함께 보존하면서 한국어의 연령 서술로 자연화했고, 중복된 발화 표현과 모호한 대명사를 정리했습니다.
