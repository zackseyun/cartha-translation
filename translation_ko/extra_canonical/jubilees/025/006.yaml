base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/025/006.yaml
  text: Then Jacob spoke with Rebekah his mother and said to her[a], “Look, I am now a son of nine weeks of years, and I do not know a woman, nor have I touched one, nor have I become engaged, nor do I intend to take a wife for myself from the daughters of Canaan.”
  footnotes:
  - marker: a
    text: '''Nine weeks of years'' equals sixty-three years, but the main text preserves Jubilees’ own chronological idiom.'
    reason: cultural_note
    anchor_ref: '25:6'
  - marker: b
    text: Or 'nor have I approached one, nor will I take'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 야곱이 자기 어머니 리브가에게 말했습니다. “보십시오, 저는 이제 아홉 주간의 해[a]를 산 사람입니다. 저는 여자를 알지 못했고, 어떤 여자에게도 손을 대지 않았으며, 약혼하지도 않았고, 가나안의 딸들 가운데서 아내를 맞이하려고도 하지 않습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아홉 주간의 해’는 63년을 뜻하지만, 본문에서는 『희년서』 특유의 연대 표현을 그대로 보존했습니다.
    reason: cultural_note; 원문의 ‘nine weeks of years’라는 시간 관용구를 설명합니다.
lexical_decisions:
- source_word: ወልደ ተስዓተ ሱባዔ ዓመት
  english_pob_choice: a son of nine weeks of years
  chosen_korean: 아홉 주간의 해
  alternatives_korean:
  - 아홉 주간의 세월
  - 아홉 주간의 연수
  lexicon: source idiom
  rationale: Ge'ez의 시간 관용구를 직역해 Jubilees 특유의 연대 표현을 보존했습니다. English POB도 이 관용구를 그대로 유지하므로, 의미 풀이는 각주에서 처리하는 편이 낫습니다.
- source_word: ኢያአምር
  english_pob_choice: I do not know a woman
  chosen_korean: 여자를 알지 못했고
  alternatives_korean:
  - 여자를 모르고
  - 여자를 가까이하지 않았고
  lexicon: ידע/γινώσκω
  rationale: 성경적 완곡표현을 유지하되, 현대 한국어에서 자연스럽고 정중하게 옮겼습니다. 단순한 ‘모르다’보다 행위적 부정을 드러내는 과거형이 문맥에 맞습니다.
- source_word: ወአፈፃርኩ
  english_pob_choice: nor have I become engaged
  chosen_korean: 약혼하지도 않았으며
  alternatives_korean:
  - 정혼하지도 않았으며
  - 약혼을 맺지도 않았으며
  lexicon: betrothal terminology
  rationale: Ge'ez의 추가 부정 항목을 빠뜨리지 않기 위해 별도 절로 살렸습니다. 한국어에서는 ‘약혼’이 가장 이해하기 쉬우며, ‘정혼’은 더 전통적이지만 현대 독자에게 덜 명확합니다.
- source_word: ወኢይሔሊኒ
  english_pob_choice: nor do I intend to take
  chosen_korean: 아내를 맞이하려고도 하지 않습니다
  alternatives_korean:
  - 아내를 취할 생각도 없습니다
  - 아내를 데려오려 하지도 않습니다
  lexicon: intend / take a wife
  rationale: 단순 미래형이 아니라 의도 부정을 나타내므로, ‘~하려고도 하지 않습니다’로 옮겨 Ge'ez의 심리적 뉘앙스를 보존했습니다. ‘take a wife’는 한국어 성경 문맥에 맞게 ‘아내를 맞이하다’로 자연화했습니다.
theological_decisions:
- issue: ‘여자를 알다’의 완곡성 보존
  chosen_reading: 성적 관계를 에둘러 말하는 성경적 완곡표현으로 그대로 유지했습니다.
  alternative_readings:
  - 직설적으로 ‘여자와 관계하지 않았다’로 풀어쓸 수 있음
  - ‘처녀를 알지 못했다’로 한정해 볼 수 있음
  rationale: 이 절은 신체적 순결과 결혼 전 상태를 나열하는 맥락이므로, 완곡성을 과도하게 해설하지 않고 원문식 표현을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 성경 번역의 완곡표현 보존 원칙
- issue: 아내를 ‘취하다’ 대신 ‘맞이하다’ 사용
  chosen_reading: 혼인을 뜻하는 서술에서는 ‘아내를 맞이하다’로 번역했습니다.
  alternative_readings:
  - ‘아내를 취하다’
  - ‘아내를 데려오다’
  rationale: 직역형 ‘취하다’는 현대 한국어에서 소유/점유 뉘앙스가 강해 혼인 맥락을 흐릴 수 있어, 결혼 행위를 드러내는 표현으로 조정했습니다.
  doctrine_reference: 혼인 서술의 문체적 적합성
