translation:
  language: ko
  text: “어머니, 두려워하지 마십시오. 저를 믿으십시오. 제가 어머니의 뜻을 행하고 올바르게 살아가며, 제 길을 영원히 더럽히지 않겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፍርሂ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려움을 품지 마십시오
  lexicon: 피동/금지 표현
  rationale: 직접적인 금지형을 살리면서도 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: እሞ
  english_pob_choice: mother
  chosen_korean: 어머니
  alternatives_korean:
  - 어머님
  - 어미
  lexicon: 호칭
  rationale: 원문의 친밀한 호칭을 유지하되, 현대 한국어에서 가장 직접적이고 자연스러운 대응을 선택했습니다.
- source_word: ትእመኒ
  english_pob_choice: be assured
  chosen_korean: 확신하십시오
  alternatives_korean:
  - 믿으십시오
  - 안심하십시오
  lexicon: 확신/신뢰
  rationale: 단순한 감정 위안보다, 뒤따르는 결심을 뒷받침하는 ‘확신’의 의미를 드러냅니다.
- source_word: ፈቃደኪ
  english_pob_choice: your will
  chosen_korean: 당신의 뜻
  alternatives_korean:
  - 당신의 의지
  - 당신의 소원
  lexicon: 의도/의지
  rationale: 하나님의 뜻처럼 과도한 신학적 고정을 피하면서, 모친의 요구·의사를 포괄하는 표현으로 옮겼습니다.
- source_word: ወበርትዕ
  english_pob_choice: walk in uprightness
  chosen_korean: 올바름 가운데 걸으며
  alternatives_korean:
  - 정직하게 걸으며
  - 의로움 가운데 걸으며
  lexicon: 도덕적 행위
  rationale: ‘걸음’의 비유를 살리면서, 단순한 품행보다 내적·외적 바름을 함께 담는 표현으로 번역했습니다.
- source_word: ኢያማስን ፍናውየ
  english_pob_choice: I will never corrupt my ways
  chosen_korean: 내 길을 영원히 더럽히지 않겠습니다
  alternatives_korean:
  - 내 행실을 결코 타락시키지 않겠습니다
  - 내 길을 결코 더럽히지 않겠습니다
  lexicon: 부패/오염 은유
  rationale: ‘corrupt’의 도덕적 오염 이미지를 살리기 위해 ‘더럽히다’를 택했고, 반복적 부정을 강하게 드러내기 위해 ‘영원히’로 응답했습니다.
theological_decisions:
