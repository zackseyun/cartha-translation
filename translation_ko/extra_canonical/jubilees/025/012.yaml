  naturalness: ‘올바름 가운데 걸으며’는 원문의 걸음 은유를 기계적으로 옮긴 표현으로 현대 표준 한국어에서는 다소 부자연스럽습니다. ‘올바르게 살아가며’가 자연스럽고 의미도 보존합니다. 호칭 뒤의 쉼표보다 문장을 분리하는 편이 자연스럽습니다.
