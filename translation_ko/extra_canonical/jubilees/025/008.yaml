  text: And I heard previously that daughters had been born to Laban, your brother, and I set my heart on them, that I might take a wife from among them.
translation:
  language: ko
  text: 그리고 나는 이전에 라반, 곧 당신의 형제에게 딸들이 태어났다는 소식을 들었고, 그들 가운데서 아내를 얻고자 그들에게 마음을 두었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕኩ፡ እምቀዲሙ
  english_pob_choice: And I heard previously
  chosen_korean: 그리고 나는 이전에 … 소식을 들었고
  alternatives_korean:
  - 그리고 나는 전에 들었고
  - 그리고 나는 이전에 들었습니다
  lexicon: 듣다 / 이전에
  rationale: 과거보다 앞선 시점을 나타내는 እምቀዲሙ를 자연스러운 ‘이전에’로 옮기고, ‘들었고’로 서술 흐름을 살렸습니다.
- source_word: ከመ፡ ትወልዲ፡ አዋልደ፡ ለላባ፡ እኁኪ።
  english_pob_choice: that daughters had been born to Laban, your brother
  chosen_korean: 라반, 곧 당신의 형제에게 딸들이 태어났다는
  alternatives_korean:
  - 라반의 딸들이 태어났다는
  - 당신의 형제 라반에게 딸들이 태어났다는
  lexicon: 태어나다 / 딸들
  rationale: 생성 사실을 전달하는 수동적 사건을 ‘태어났다는’으로 반영했고, ‘당신의 형제’는 원문의 친족 호칭을 그대로 살렸습니다.
- source_word: ወላዕሌሆን፡ አንበርኩ፡ ልብየ።
  english_pob_choice: and I set my heart on them
  chosen_korean: 그들 가운데서 아내를 얻고자 그들에게 마음을 두었습니다
  alternatives_korean:
  - 그리고 나는 그들에게 마음을 두었습니다
  - 그들을 마음에 두었습니다
  lexicon: 마음을 두다 / 아내를 얻다
  rationale: ‘마음을 두다’는 선택·집착의 의도를 드러내며, 뒤의 목적절이 결혼 상대를 찾는 뜻임을 분명히 하기 위해 ‘아내를 얻고자’를 덧붙였습니다.
theological_decisions:
- issue: 혼인 상대를 찾는 의도 표현
  chosen_reading: 원문의 목적절을 따라 ‘아내를 얻고자’로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘아내를 맞이하려고’
  - ‘배필을 얻고자’
  rationale: 본문은 단순 호감이 아니라 특정한 혼인 목적을 말하므로, 의미를 약화시키지 않는 표현이 필요합니다.
  doctrine_reference: 서사 본문에서 인물의 의도와 행위를 직접적으로 전달하는 원칙
