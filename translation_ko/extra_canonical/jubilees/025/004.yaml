translation:
  language: ko
  text: 그러나 나는, 내 아들아, 너를 지극히 사랑합니다. 나의 마음과 나의 사랑은 모든 때에, 곧 낮에도 밤의 파수 시간들에도 너를 축복할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 끝의 시간 표현은 이 행에서 본문상 구문이 매끄럽지 않습니다. 가장 자연스러운 뜻은 ‘낮에도 밤의 파수 시간들에도’라는 총칭적 표현으로 이해하는 것입니다.
    reason: segmentation_note
