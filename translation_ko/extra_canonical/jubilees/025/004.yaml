translation:
  language: ko
  text: 그러나 나는, 내 아들아, 너를 지극히 사랑하며, 내 마음과 내 애정은 항상, 곧 낮에도 밤의 경점들에도 너를 축복할 것이다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአነ፡
  english_pob_choice: But I
  chosen_korean: 그러나 나는
  alternatives_korean:
  - 나는
  - 그런데 나는
  lexicon: 접속사 + 1인칭 대명사
  rationale: 문맥상 앞말과의 대비를 살리기 위해 ‘그러나’를 두고, 주어는 직역에 가깝게 ‘나는’으로 옮겼습니다.
- source_word: ወልድየ፡
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 내 아들아
  lexicon: 호칭
  rationale: 직접 호명하는 화행이므로 한국어에서는 호격 ‘-아’를 붙여 자연스럽게 반영했습니다.
- source_word: አፈቅረከ፡ ጥቀ፡ ፈድፋደ፡
  english_pob_choice: love you exceedingly
  chosen_korean: 너를 지극히 사랑하며
  alternatives_korean:
  - 너를 매우 사랑하며
  - 너를 크게 사랑하며
  lexicon: 사랑하다 + 강조 부사
  rationale: 동사의 강한 강조를 ‘지극히’로 살려 과도한 의역 없이 원문의 중첩된 강도를 반영했습니다.
- source_word: ወልብየ፡' ወምሕረትየ፡
  english_pob_choice: my heart and my affection
  chosen_korean: 내 마음과 내 애정은
  alternatives_korean:
  - 내 마음과 내 자비는
  - 내 심장과 내 애정은
  lexicon: 감정/내면 표현
  rationale: 문맥상 정서적 내적 동작 주체를 가리키므로 ‘마음’과 ‘애정’으로 옮겨 POB의 두 요소를 유지했습니다.
- source_word: ይባርከከ፡ በኵሉ፡ ጊዜ፡ 'ዕለት፡ ወዐቃቤ፡ ለያልይ፡'
  english_pob_choice: will bless you at all times, by day and in the watches of the night
  chosen_korean: 항상, 곧 낮에도 밤의 경점들에도 너를 축복할 것이다
  alternatives_korean:
  - 모든 때에, 곧 낮과 밤의 경계마다 너를 축복할 것이다
  - 항상, 낮과 밤의 모든 파수 때에 너를 축복할 것이다
  lexicon: 축복하다 / 경점
  rationale: POB의 축자적 의미와 병행 구조를 따라 ‘항상’을 앞세우고, 야간 표현은 ‘밤의 경점들’로 원문의 관용적 시간표현을 살렸습니다.
theological_decisions:
- issue: 화자와 직접 خطاب의 정서적 강도
  chosen_reading: 하나님의 선언적 축복이 아니라 친밀한 부성적 애정의 표현으로 읽어, 직설적이고 따뜻한 호칭을 유지했습니다.
  alternative_readings:
  - 더 중립적인 서술체로 완화
  - 경건한 축언처럼 재구성
  rationale: 원문은 사랑과 축복을 병렬로 두어 관계적 친밀성을 강조하므로, 한국어에서도 정서적 온도를 낮추지 않는 것이 적절합니다.
  doctrine_reference: 문학적-서사적 문맥 해석
