- from: 아브라함 우리 아버지의 말씀을 기억합니다. 그가 나에게 가나안의 딸들 가운데서 아내를 데려가지 말고, 내 아버지의 집의 씨와 내 친족 가운데서 나를 위해 아내를 데려오라고 명령했기 때문입니다.[a]
  to: 나는 우리 조상 아브라함의 말씀을 기억합니다.[a] 그는 나에게 가나안의 딸들 가운데서 아내를 맞이하지 말고, 내 아버지 집안의 후손과 내 친족 가운데서 아내를 맞이하라고 명령했기 때문입니다.
  rationale: 혼인에 관한 명령의 강도와 혈통·친족 관련 표현을 보존하면서, 직역투인 '집의 씨'와 '나를 위해 ... 데려오다'를 자연스러운 현대 표준 한국어로 고쳤습니다. 대안 독법은 원문의 구문적 결속에 관한 것이므로 본문 의미를 단정적으로 바꾸지 않고 각주로 유지했습니다.
