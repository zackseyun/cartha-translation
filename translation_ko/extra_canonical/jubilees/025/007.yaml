  lexicon: Geʽez ብእሲተ / አወልደ
  rationale: ‘가져가다/데려오다’의 동사상을 살려 ‘데려가지 말고’로 풀었고, 여성 후손을 뜻하는 표현은 한국어의 자연스러운 집합표현인 ‘딸들 가운데서’로 옮겼습니다.
- source_word: እምዘርአ፡ ቤተ፡ አቡየ፡ አነሥእ፡ ሊተ፡ ብእሲተ፡ ወእምዘመድየ፡
  english_pob_choice: from the seed of my father’s house and from my kin
  chosen_korean: 내 아버지의 집의 씨와 내 친족 가운데서
  alternatives_korean:
  - 내 아버지의 집의 후손들과 내 친족 가운데서
  - 내 아버지 집의 자손과 내 친족 가운데서
  lexicon: Geʽez ዘርአ / ቤተ / ዘመድ
  rationale: ‘씨’는 후손/자손을 직역한 표현으로, 이 문맥의 혈통적 요구를 가장 직접적으로 드러내므로 유지했습니다. ‘집’은 가문 의미를 담아 ‘내 아버지의 집’으로 보존했습니다.
