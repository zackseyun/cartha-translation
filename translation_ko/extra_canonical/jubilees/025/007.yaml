  rationale: 원문의 지시적 강도를 살리기 위해 ‘명령하다’로 옮겼고, 뒤의 이유절을 자연스럽게 이어 주기 위해 한국어에서는 절 말미에 배치했습니다.
- source_word: ኢይንሣእ፡ ብእሲተ፡ እምአወልደ፡ ከናአን፡
  english_pob_choice: not to take a wife from the daughters of Canaan
  chosen_korean: 가나안의 딸들 가운데서 아내를 데려가지 말고
  alternatives_korean:
  - 가나안의 딸들 중에서 아내를 맞이하지 말고
