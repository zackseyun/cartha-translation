review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains Abraham's authoritative instruction, the prohibition concerning Canaanite women, and the two stated familial sources for a wife. However, the source's reflexive sense ('for myself') is better represented idiomatically by '아내를 맞이하라/얻으라' rather than the awkward '나를 위해 아내를 데려오라.'
  naturalness: 'Several expressions are overly literal or unnatural in modern Korean: ''내 아버지의 집의 씨'' is not idiomatic, and the paired ''데려가지 말고/데려오라고'' is less natural for contracting marriage. ''우리 조상 아브라함'' naturally conveys ''Abraham our father'' in this ancestral context.'
  terminology: Use '우리 조상 아브라함' for the ancestral designation, '아내를 맞이하다' for taking a wife, and '내 아버지 집안의 후손' for 'the seed of my father's house.' The textual-variant footnote should be anchored at the clause it qualifies, not at the end of the verse.
  issues:
  - severity: medium
    issue: '''내 아버지의 집의 씨'' is a calque.'
    rationale: Although 'seed' is literal, this phrasing is unnatural Korean and can misleadingly evoke physical seed rather than descent. '내 아버지 집안의 후손' preserves the genealogical sense.
  - severity: medium
    issue: '''나를 위해 아내를 데려오라고'' is unnatural and shifts the marriage idiom.'
    rationale: The source means taking a wife for oneself, not having a wife brought to the speaker. '아내를 맞이하라' naturally expresses the intended act and retains its reflexive implication.
  - severity: low
    issue: Footnote marker placement does not identify the disputed syntactic unit.
    rationale: The alternative concerns the opening expression about remembering Abraham's word; it should follow '기억합니다,' rather than appear after the final sentence.
