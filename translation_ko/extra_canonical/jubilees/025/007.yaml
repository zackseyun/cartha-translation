  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
  footnotes:
  - marker: a
    text: 'Or ''what Abraham our father told me: that he commanded me''.'
    reason: previous_rendering
translation:
  language: ko
  text: 나는 우리 조상 아브라함의 말씀을 기억합니다.[a] 그는 나에게 가나안의 딸들 가운데서 아내를 맞이하지 말고, 내 아버지 집안의 후손과 내 친족 가운데서 아내를 맞이하라고 명령했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 조상 아브라함이 나에게 한 말, 곧 그가 나에게 명령한 것을 기억합니다.”
    reason: 원문의 첫 구절의 결속 관계에 대한 영어 POB 감사 기록의 대안 독법을 한국어로 반영합니다.
lexical_decisions:
- source_word: ነገረ፡ አብርሃም፡ አቡነ፡
  english_pob_choice: the word of Abraham our father
  chosen_korean: 아브라함 우리 아버지의 말씀
