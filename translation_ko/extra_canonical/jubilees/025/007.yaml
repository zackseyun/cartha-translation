  text: For I remember the word of Abraham our father, for he commanded me not to take a wife from the daughters of Canaan, but to take a wife for myself from the seed of my father’s house and from my kin.
  footnotes:
  - marker: a
    text: 'Or ''what Abraham our father told me: that he commanded me''.'
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함 우리 아버지의 말씀을 기억합니다. 그가 나에게 가나안의 딸들 가운데서 아내를 데려가지 말고, 내 아버지의 집의 씨와 내 친족 가운데서 나를 위해 아내를 데려오라고 명령했기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገረ፡ አብርሃም፡ አቡነ፡
  english_pob_choice: the word of Abraham our father
  chosen_korean: 아브라함 우리 아버지의 말씀
  alternatives_korean:
  - 아브라함 우리 아버지의 말
  - 아브라함 우리 조상의 말씀
  lexicon: Geʽez ነገረ
  rationale: 지시문의 핵심은 단순한 ‘말’보다 권위를 지닌 ‘말씀’에 가깝지만, 본문은 성경의 하나님의 ‘말씀’과 혼동되지 않는 범위에서 아브라함의 발화를 가리키므로 자연스러운 ‘말씀’을 택했습니다.
- source_word: አዘዘኒ፡
  english_pob_choice: he commanded me
  chosen_korean: 나에게 … 명령했기
  alternatives_korean:
  - 나에게 … 명령했으므로
  - 나에게 … 일렀기
  lexicon: Geʽez አዘዘ
  rationale: 원문의 지시적 강도를 살리기 위해 ‘명령하다’로 옮겼고, 뒤의 이유절을 자연스럽게 이어 주기 위해 한국어에서는 절 말미에 배치했습니다.
- source_word: ኢይንሣእ፡ ብእሲተ፡ እምአወልደ፡ ከናአን፡
  english_pob_choice: not to take a wife from the daughters of Canaan
  chosen_korean: 가나안의 딸들 가운데서 아내를 데려가지 말고
  alternatives_korean:
  - 가나안의 딸들 중에서 아내를 맞이하지 말고
  - 가나안의 딸들에게서 아내를 취하지 말고
  lexicon: Geʽez ብእሲተ / አወልደ
  rationale: ‘가져가다/데려오다’의 동사상을 살려 ‘데려가지 말고’로 풀었고, 여성 후손을 뜻하는 표현은 한국어의 자연스러운 집합표현인 ‘딸들 가운데서’로 옮겼습니다.
- source_word: እምዘርአ፡ ቤተ፡ አቡየ፡ አነሥእ፡ ሊተ፡ ብእሲተ፡ ወእምዘመድየ፡
  english_pob_choice: from the seed of my father’s house and from my kin
  chosen_korean: 내 아버지의 집의 씨와 내 친족 가운데서
  alternatives_korean:
  - 내 아버지의 집의 후손들과 내 친족 가운데서
  - 내 아버지 집의 자손과 내 친족 가운데서
  lexicon: Geʽez ዘርአ / ቤተ / ዘመድ
  rationale: ‘씨’는 후손/자손을 직역한 표현으로, 이 문맥의 혈통적 요구를 가장 직접적으로 드러내므로 유지했습니다. ‘집’은 가문 의미를 담아 ‘내 아버지의 집’으로 보존했습니다.
theological_decisions:
- issue: 혈통과 혼인 제한의 강조
  chosen_reading: 본문은 혼인을 위한 신앙적·혈통적 경계로서 가나안 딸들과의 결합을 금하고, 아버지 집의 씨와 친족 안에서 아내를 구하라는 아브라함의 명령을 직접 전달합니다.
  alternative_readings:
  - 단순한 가족 전통 서술로 완화하는 읽기
  - 윤리적 조언 정도로 낮추는 읽기
  rationale: 게이즈 원문과 영어 POB 모두 명령 동사를 유지하므로, 이 구절의 규범성을 약화시키지 않고 그대로 드러내는 것이 source-grounded입니다.
  doctrine_reference: 족장 전승의 혼인 규범과 언약적 혈통 의식
