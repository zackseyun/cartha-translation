  text: fourth, in the second year of the third week of the forty-second[2] jubilee. And Joseph came to receive him.
  footnotes:
  - marker: '2'
    text: The Ge'ez text literally reads 'forty-second' (፵ወ፪), though the internal chronology of Jubilees requires this to be the forty-fifth jubilee.
    reason: textual_variant
  - marker: a
    text: Or 'In the fourth year[2], in the second year of the third week of the forty-second jubilee, Joseph came'.
    reason: previous_rendering
translation:
  language: ko
  text: 넷째, 셋째 주 둘째 해, 즉 마흔두 번째 희년입니다. 그리고 요셉이 그를 맞으러 왔습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ራብዕ
  english_pob_choice: fourth
  chosen_korean: 넷째
  alternatives_korean:
  - 네 번째
  - 네째
  lexicon: —
  rationale: Ge'ez 원문은 단순히 ‘fourth’로 되어 있어 ‘year’를 보충하지 않고, 앞절의 분절과 이어지는 연표 요소로서 한국어도 서수형으로만 옮겼습니다.
- source_word: በካልእ ዓመት፡ ዘሰብዓ፡ ሣልስ፡
  english_pob_choice: in the second year of the third week
  chosen_korean: 셋째 주 둘째 해
  alternatives_korean:
  - 셋째 주의 둘째 해
  - 제3주의 제2년
  lexicon: —
  rationale: ‘week’를 직역하기보다 희년 문맥의 연대 단위인 ‘주’로 옮기고, 한국어에서는 자연스러운 어순으로 정리했습니다.
- source_word: ዘ፵ወ፪ እዮቤልው
  english_pob_choice: of the forty-second jubilee
  chosen_korean: 마흔두 번째 희년
  alternatives_korean:
  - 마흔둘째 희년
  - 42번째 희년
  lexicon: —
  rationale: POB의 주석처럼 지면 문자상은 ‘마흔두 번째’이지만, 한국어에서는 서수 표현을 자연스럽게 ‘마흔두 번째’로 옮겼습니다.
- source_word: ወመጽአ፡ ዮሴፍ፡ ይትቀበል፡
  english_pob_choice: And Joseph came to receive him
  chosen_korean: 그리고 요셉이 그를 맞으러 왔습니다
  alternatives_korean:
  - 그리고 요셉이 그를 맞이하러 왔습니다
  - 그리고 요셉이 그를 받으러 왔습니다
  lexicon: —
  rationale: 동사군은 단순한 ‘come’ + ‘receive’ 구조이므로, 관계적 자연성을 살려 ‘맞으러 왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 희년 연대 표기에서 원문 서수와 문맥상 연대 단위의 보존
  chosen_reading: 원문 그대로 ‘넷째, 셋째 주 둘째 해, 마흔두 번째 희년’의 연대 표지를 유지했습니다.
  alternative_readings:
  - ‘넷째 해’로 보정
  - 문맥상 ‘마흔다섯 번째 희년’으로 조정
  rationale: 검증 주석은 희년 번호의 내적 연대 문제를 지적하지만, 본문 번역은 원문 증거를 우선하여 문자형을 보존하고, 해설은 주석에서 처리하는 것이 타당합니다.
  doctrine_reference: 본문 비평/연대기 주석 원칙
