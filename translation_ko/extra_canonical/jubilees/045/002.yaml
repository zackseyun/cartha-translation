  lexicon: —
  rationale: 동사군은 단순한 ‘come’ + ‘receive’ 구조이므로, 관계적 자연성을 살려 ‘맞으러 왔습니다’로 옮겼습니다.
theological_decisions:
- issue: 희년 연대 표기에서 원문 서수와 문맥상 연대 단위의 보존
  chosen_reading: 원문 그대로 ‘넷째, 셋째 주 둘째 해, 마흔두 번째 희년’의 연대 표지를 유지했습니다.
  alternative_readings:
  - ‘넷째 해’로 보정
  - 문맥상 ‘마흔다섯 번째 희년’으로 조정
  rationale: 검증 주석은 희년 번호의 내적 연대 문제를 지적하지만, 본문 번역은 원문 증거를 우선하여 문자형을 보존하고, 해설은 주석에서 처리하는 것이 타당합니다.
  doctrine_reference: 본문 비평/연대기 주석 원칙
