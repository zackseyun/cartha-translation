  source_fidelity: 게에즈 본문의 핵심 요소를 모두 충실히 반영했습니다. 요셉이 이집트 땅을 위해 규례를 세운 일, 이스라엘이 이집트에서 산 17년, 그의 총 생애를 세 희년 곧 147년으로 나타낸 연대 표기, 그리고 제45희년 제5주 제4년에 죽었다는 진술이 빠짐없이 보존되어 있습니다. ‘곧’은 세 희년(각 49년)과 147년의 대응을 한국어에서 자연스럽게 드러내며, 원문의 연대 계산을 훼손하지 않습니다.
  naturalness: 현대 표준 한국어의 정중한 합쇼체로 자연스럽습니다. ‘십칠 년’, ‘백사십칠 년’, ‘마흔다섯째 희년’ 같은 한글 수사 표기는 성서 번역의 격식 있는 문체와 잘 맞습니다. 문장 연결과 대명사 지시도 문맥상 명료합니다.
  terminology: ‘요셉’, ‘이스라엘’, ‘이집트’, ‘희년’은 확립된 성서·고대문헌 용례에 부합합니다. ሥርዐተ에 대한 ‘규례’도 단순 관습이 아니라 정해진 공적 규범이라는 의미를 적절히 전달합니다. ‘주’와 ‘해’는 희년 연대 체계의 단위를 일관되게 보존합니다.
