theological_decisions:
- issue: 이스라엘의 ‘dies’와 연대 계산 표현
  chosen_reading: ‘그가 산 모든 날은 세 희년, 곧 백사십칠 년’으로 옮겨, 총 생애와 희년 계산을 함께 보이게 했습니다.
  alternative_readings:
  - ‘그가 산 햇수는…’
  - ‘그의 평생은…’
  rationale: 본문은 단순한 연령 정보가 아니라 희년 체계 안에서의 연대 요약을 제공하므로, 계산식이 보이도록 직역적 구조를 유지했습니다.
  doctrine_reference: 서사적 연대 표기
- issue: ‘he died’의 주어 처리
  chosen_reading: 마지막 절의 주어를 ‘그는’이 아니라 앞선 문맥에 맞는 ‘그’로 유지했습니다.
  alternative_readings:
  - ‘이스라엘은 죽었습니다’
  rationale: 히브리식/고대 서술에서 주어 반복을 최소화하는 흐름을 살리되, 한국어 문장에서는 과도한 반복을 피했습니다.
  doctrine_reference: 서사 문체
