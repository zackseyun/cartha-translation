  - marker: a
    text: Or 'And Israel said to Joseph'.
    reason: previous_rendering
translation:
  language: ko
  text: …그의 아버지 야곱을 고센 땅에서 만나 아버지의 목을 끌어안고 울었습니다. 이스라엘이 요셉에게 말했습니다. “내가 너를 보았으니, 이제는 죽어도 된다. 이제 야훼, 곧 이스라엘의 하나님, 아브라함의 하나님, 이삭의 하나님이 찬양받으시기를 바랍니다. 그분은 자비와 긍휼을 보이셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ምድረ፡ ጌሤም
  english_pob_choice: in the land of Goshen
  chosen_korean: 고센 땅에서
  alternatives_korean:
  - 고센 땅 안에서
  - 고센 지역에서
  lexicon: 지명
  rationale: 지명 Goshen은 관용적으로 ‘고센’으로 옮기고, 전치사는 서술 흐름에 맞게 ‘에서’로 자연스럽게 처리했습니다.
- source_word: ወሐቀፈ፡ ክሳደ፡ አቡሁ፡
  english_pob_choice: he embraced his father's neck
  chosen_korean: 그 아버지의 목을 끌어안고
  alternatives_korean:
  - 아버지의 목을 껴안고
  - 아버지의 목을 안고
  lexicon: 동사구
  rationale: 원문의 신체적 애정 표현을 살리되 현대 한국어에서 자연스러운 ‘목을 끌어안다’로 옮겼습니다.
- source_word: ይትባረክ፡ እግዚአብሔር፡
  english_pob_choice: may the LORD ... be blessed
  chosen_korean: 야훼 ...가 찬양받으시기를 바랍니다
  alternatives_korean:
  - 야훼가 복되시기를 바랍니다
  - 야훼께서 복을 받으시기를 바랍니다
  lexicon: 축복/찬양
  rationale: 히브리 관용구의 수동형 축복 선언을 한국어에서 가장 덜 왜곡되게 ‘찬양받으시기를 바랍니다’로 재현해, 하나님이 인간에게 복을 받으신다는 오해를 피했습니다.
- source_word: እግዚአብሔር፡ አምላከ፡ እስራኤል፡ አምላከ፡ አብርሃም፡ ወአምላከ፡ ይስሐቅ፡
  english_pob_choice: the LORD, the God of Israel, the God of Abraham and the God of Isaac
  chosen_korean: 야훼, 곧 이스라엘의 하나님, 아브라함의 하나님, 이삭의 하나님
  alternatives_korean:
  - 주님, 이스라엘의 하나님, 아브라함의 하나님, 이삭의 하나님
  - 야훼, 이스라엘의 하나님, 아브라함과 이삭의 하나님
  lexicon: 신명칭호
  rationale: 본문의 호칭 연결을 살려 ‘곧’으로 동격을 명확히 하고, YHWH는 프로젝트 기본값대로 ‘야훼’로 옮겼습니다.
- source_word: ዘአክአለ፡ ምሕረተ፡ ወሣህሎ፡
  english_pob_choice: he who has shown mercy and compassion
  chosen_korean: 그분은 자비와 긍휼을 보이셨습니다
  alternatives_korean:
  - 그분은 자비와 긍휼을 나타내셨습니다
  - 그분은 자비와 연민을 베푸셨습니다
  lexicon: 동사/명사
  rationale: 출처가 ‘보이다/드러내다’의 뜻을 가지므로 단순한 감정이 아니라 역사 속에서 드러난 자비를 표현하는 ‘보이셨습니다’를 택했습니다.
