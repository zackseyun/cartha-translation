    text: Or 'And Israel said to Joseph'.
    reason: previous_rendering
translation:
  language: ko
  text: …그의 아버지 야곱을 고센 땅에서 만나 그 아버지의 목을 끌어안고 울었습니다. 이스라엘이 요셉에게 말했습니다. "이제는 내가 죽어도 좋습니다. 당신을 보았으니 말입니다. 이제는 야훼, 곧 이스라엘의 하나님, 아브라함의 하나님, 이삭의 하나님이 찬양받으시기를 바랍니다. 그분은 자비와 긍휼을 보이셨습니다."[a]
  philosophy: optimal-equivalence
