  text: And Joseph gave his father and his brothers a possession, so that they might dwell in the land of Goshen, and in Rameses and all its territory, which he ruled before Pharaoh. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.
  footnotes:
  - marker: a
    text: Or 'as was approved before Pharaoh'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉은 자기 아버지와 자기 형제들에게 소유지를 주어, 그들이 고센 땅과 라암셋과 그 모든 지역에 거주하게 했습니다. 그곳은 바로바로 앞에서 그가 다스리던 곳이었습니다. 이스라엘과 그의 아들들은 애굽 땅, 곧 그 땅의 가장 좋은 곳인 고센 땅에 정착했습니다. 이스라엘이 애굽에 들어갔을 때 그의 나이는 백삼십 세였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወሀቦ… ሀብተ
  english_pob_choice: gave… a possession
  chosen_korean: 소유지를 주어
  alternatives_korean:
  - 거처를 주어
  - 분깃을 주어
  - 재산을 주어
  lexicon: አሀበ / ሀብት
  rationale: 여기서는 단순한 ‘재물’보다 정착할 수 있는 토지·거처의 부여가 핵심이어서 ‘소유지’로 옮겼습니다.
- source_word: ይኅደሩ
  english_pob_choice: might dwell
  chosen_korean: 거주하게 했습니다
  alternatives_korean:
  - 살게 했습니다
  - 머물게 했습니다
  lexicon: ኀደረ
  rationale: 장기 정착의 의미를 살리기 위해 ‘거주하다’의 사역형으로 표현했습니다.
- source_word: ዘይኴንን፡ በቅድሜሁ፡ ለፈርዖን
  english_pob_choice: which he ruled before Pharaoh
  chosen_korean: 바로바로 앞에서 그가 다스리던 곳이었습니다
  alternatives_korean:
  - 바로바로 앞에서 그가 다스리도록 허락된 곳이었습니다
  - 바로바로 앞에서 승인된 곳이었습니다
  lexicon: ኰነነ / ቅድሜ
  rationale: 개정된 영어의 ‘approved’보다 최신 소스 검토가 지적한 ‘다스리다/통치하다’의 의미를 따라, 요셉의 행정적 통치를 드러내는 표현으로 옮겼습니다.
- source_word: ምሥናይሃ፡ ለምድረ፡ ግብጽ
  english_pob_choice: the best part of the land of Egypt
  chosen_korean: 그 땅의 가장 좋은 곳인 고센 땅
  alternatives_korean:
  - 애굽 땅의 가장 좋은 부분
  - 애굽 땅의 제일 좋은 지역
  lexicon: ምሥናይ / ምድረ ግብጽ
  rationale: 원문의 평가적 의미를 살려 ‘가장 좋은 곳’으로 옮기되, 그 대상이 곧 고센 땅임을 분명히 했습니다.
