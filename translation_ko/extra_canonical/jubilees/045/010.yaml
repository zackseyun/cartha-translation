  text: For during the seven years of famine it had not overflowed and had not watered the land, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.
  footnotes:
  - marker: a
    text: Or 'had not risen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 기근의 일곱 해 동안에는 강이 넘쳐흐르지 않았고, 강가의 몇 군데를 제외하고는 땅을 적시지 못했습니다. 그러나 이제는 넘쳐흘러, 그 해에 이집트가 땅에 씨를 뿌리고 매우 많은 곡식을 거두었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በ፯ዓመታት፡ ዐባር
  english_pob_choice: during the seven years of famine
  chosen_korean: 그 기근의 일곱 해 동안
  alternatives_korean:
  - 기근의 칠 년 동안
  - 흉년의 일곱 해 동안
  lexicon: 기간 표현 / አባር
  rationale: 문맥상 ‘기근의 일곱 해’를 자연스럽게 옮겼고, 한국어 성경문체에 맞게 ‘그 … 동안’으로 시간 범위를 분명히 했습니다.
- source_word: ወኢሰቀየ
  english_pob_choice: had not watered the land
  chosen_korean: 땅을 적시지 못했습니다
  alternatives_korean:
  - 땅에 물을 대지 못했습니다
  - 땅에 물을 주지 못했습니다
  lexicon: 동사 의미 / to water, irrigate
  rationale: 수정된 영어 주해대로 이 동사는 ‘올라오다’가 아니라 ‘물을 대다/적시다’의 뜻이므로, 강이 범람하지 않아 땅이 젖지 못했다는 의미를 살렸습니다.
- source_word: ድንጋጌ፡ ፈለግ
  english_pob_choice: by the banks of the river
  chosen_korean: 강가의 몇 군데
  alternatives_korean:
  - 강둑의 몇몇 곳
  - 강변의 몇몇 지점
  lexicon: 지리 표현 / river banks
  rationale: ‘몇 군데’는 예외적으로 물이 닿은 제한된 구역을 간결하게 드러내며, ‘강가’는 해당 지형을 자연스럽게 전달합니다.
- source_word: ምድረ
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 토지
  - 땅바닥
  lexicon: 일반 명사 / land
  rationale: 이 문맥에서 농사 가능한 지역 전체를 가리키므로, 가장 مستقیم적인 ‘땅’으로 옮겼습니다.
- source_word: ወይእዜሰ ... መልአ
  english_pob_choice: but now it overflowed
  chosen_korean: 그러나 이제는 넘쳐흘러
  alternatives_korean:
  - 하지만 이제는 범람하여
  - 그런데 지금은 넘쳐서
  lexicon: 대조/동사 / overflow
  rationale: 앞선 결핍과 대비되는 상황 전환을 살리기 위해 ‘그러나 이제는’으로 시작했고, 범람의 동작은 ‘넘쳐흐르다’로 자연스럽게 표현했습니다.
- source_word: ብዙኀ፡ ሥርናየ፡
  english_pob_choice: very much grain
  chosen_korean: 매우 많은 곡식
  alternatives_korean:
  - 아주 많은 곡식
  - 몹시 많은 양식
  lexicon: 수확물 표현 / grain
  rationale: 수확 결과를 가리키는 일반적 명사로 ‘곡식’을 택해 내용의 구체성과 현대 가독성을 함께 살렸습니다.
theological_decisions:
- issue: 서술의 범람과 농경의 인과 관계
  chosen_reading: 강이 넘쳐흐르지 않다가 이제 넘쳐흘러 이집트가 씨를 뿌리고 곡식을 거두는 변화로 옮겼습니다.
  alternative_readings:
  - 강이 솟구치지 않다가 이제 솟구쳐
  - 강물이 오르지 않다가 이제 올랐다
  rationale: 개정된 원문 이해는 물의 ‘상승’이 아니라 ‘관개/범람’의 여부이므로, 본문이 말하는 기근 종료와 농경 회복의 서술을 그대로 반영했습니다.
  doctrine_reference: 본문 해석의 정확성
