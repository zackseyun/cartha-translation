  yaml_path: translation/extra_canonical/jubilees/045/015.yaml
  text: And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah[15] in the land of Canaan, near Abraham his father.
  footnotes:
  - marker: '15'
    text: Literally 'the double cave.' This corresponds to the ancestral burial cave known elsewhere as Machpelah.
    reason: cross_reference
  - marker: a
    text: Or 'them[15], and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the cave of Machpelah'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들에게 복을 주고, 요셉에게는 그 땅에서 두 몫을 주었습니다. 그는 조상들과 함께 잠들었고, 가나안 땅에서 그의 아버지 아브라함 가까이에 있는 막벨라 굴[15]에 묻혔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: 직역하면 ‘두 겹의 굴’입니다. 이는 다른 곳에서 막벨라로 알려진 조상들의 매장 굴에 해당합니다.
    reason: ‘막벨라’라는 지명과 기즈어 표현의 문자적 의미를 설명하며, 영문 POB의 해당 각주와 동일한 기능을 합니다.
lexical_decisions:
- source_word: ወባረኮሙ
  english_pob_choice: And he blessed them
  chosen_korean: 그는 그들에게 복을 주고
  alternatives_korean:
  - 그는 그들을 축복하고
  - 그는 그들에게 축복하였고
  lexicon: ברך / εὐλογέω 계열
  rationale: Geez 동사는 단순한 ‘축복하다’보다 ‘복을 주다’로 풀어도 무리가 없고, 서술 흐름상 다음 절과 연결되는 동사구로 자연스럽게 옮겼습니다.
- source_word: ክልኤተ፡ መክፈሊተ
  english_pob_choice: a double portion
  chosen_korean: 두 몫
  alternatives_korean:
  - 두 배의 몫
  - 이중 몫
  lexicon: ‘double portion’ 분배 표현
  rationale: 문맥상 상속/분깃의 양을 가리키므로 한국어에서는 ‘두 몫’이 가장 간결하고 원문 의미를 직접 전달합니다.
- source_word: በዲበ፡ ምድር
  english_pob_choice: in the land
  chosen_korean: 땅에서
  alternatives_korean:
  - 그 땅에서
  - 그 땅 안에서
  lexicon: land / መድረ
  rationale: 히브리적 서술에서 상속 분배의 장소를 가리키는 표현으로, 한국어에서는 반복을 줄이기 위해 ‘땅에서’로 자연스럽게 옮겼습니다.
- source_word: በቐብረ / በዐት፡ ዘካዕበት
  english_pob_choice: buried in the cave of Machpelah
  chosen_korean: 막벨라 굴에 … 묻혔습니다
  alternatives_korean:
  - 막벨라 굴에 … 장사되었습니다
  - 막벨라 굴 속에 … 묻혔습니다
  lexicon: Machpelah place-name / burial formula
  rationale: POB 개정본이 ‘the cave of Machpelah’로 정리한 점을 따라 고유 지명은 음역하지 않고 ‘막벨라 굴’로 유지했으며, 매장 서술은 현대 한국어에서 자연스러운 ‘묻혔습니다’로 옮겼습니다.
- source_word: ቅሩበ፡ አብርሃም፡ አቡሁ
  english_pob_choice: near Abraham his father
  chosen_korean: 그의 아버지 아브라함 곁에
  alternatives_korean:
  - 그의 아버지 아브라함 가까이에
  - 그의 아버지 아브라함 옆에
  lexicon: near / place relation
  rationale: ‘near’의 공간 관계를 살리되, 장지 서술에서는 ‘곁에’가 가장 자연스럽고 문맥상 존댓말 흐름도 해치지 않습니다.
theological_decisions:
- issue: 매장 장소를 일반 묘소가 아니라 족장 전승의 특정 매장 동굴로 제시하는 방식
  chosen_reading: ‘막벨라 굴’로 구체화하여, 단순한 무덤이 아니라 족장들의 조상 묘역이라는 전승을 드러냈습니다.
  alternative_readings:
  - ‘막벨라의 동굴’
  - ‘막벨라 굴속’
  rationale: 영문 POB와 개정 이력은 Ge‘ez의 ‘double cave’를 고유 지명 ‘cave of Machpelah’로 정리하므로, 한국어도 그 역사적·지리적 특수성을 보존하는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 창세기 23장 전승과 족장 묘소 기억
