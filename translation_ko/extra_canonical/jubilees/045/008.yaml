- from: 기근 때문에 이집트 땅이 고통을 겪었습니다. 요셉은 곡식과 바꾸어 이집트의 온 땅을 파라오를 위해 얻었고, 백성과 그들의 가축과 그 밖의 모든 소유도 파라오를 위해 얻었습니다.[a]
  to: 기근 때문에 이집트 땅이 고통을 겪었습니다. 요셉은 곡식을 대가로 이집트의 온 땅을 파라오를 위해 얻었고, 백성과 그들의 가축과 모든 것을 파라오를 위해 얻었습니다.
  rationale: 마지막 절의 능동적 취득과 ‘모든 것’이라는 포괄성을 보존하도록 고쳤습니다. 또한 대응 각주가 없는 앵커를 삭제하고, 교환 관계를 자연스럽게 나타내도록 ‘곡식을 대가로’로 다듬었습니다.
