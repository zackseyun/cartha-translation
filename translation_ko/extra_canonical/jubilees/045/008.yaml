  revised_text: 기근 때문에 이집트 땅이 고통을 겪었습니다. 요셉은 곡식을 대가로 이집트의 온 땅을 파라오를 위해 얻었고, 백성과 그들의 가축과 모든 것을 파라오를 위해 얻었습니다.
