    rationale: 게에즈어 ኵሎ는 ‘모든 것’이며, 영어 POB도 ‘everything’으로 옮깁니다. ‘소유’는 원문에 없는 소유물 한정을 추가합니다.
  - severity: low
    issue: 무근거한 각주 앵커 [a]
