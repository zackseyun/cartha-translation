translation:
  language: ko
  text: 기근 때문에 이집트 땅이 고통을 겪었습니다. 요셉은 곡식과 바꾸어 이집트의 온 땅을 파라오를 위해 얻었고, 백성과 그들의 가축과 그 밖의 모든 소유도 파라오를 위해 얻었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐመተ፡ ምድረ፡ ግብጽ፡
  english_pob_choice: the land of Egypt suffered because of the famine
  chosen_korean: 기근 때문에 이집트 땅이 고통을 겪었습니다
  alternatives_korean:
  - 이집트 땅이 기근으로 시달렸습니다
  - 기근 때문에 이집트 땅이 고난을 겪었습니다
  lexicon: 고통을 겪다
  rationale: 문맥상 단순한 상태 진술보다 기근으로 인한 극심한 고통을 드러내는 표현이 자연스럽습니다.
- source_word: አስተጋብአ፡ ዮሴፍ፡ ... ለፈርዖን፡ በእክል፡
  english_pob_choice: Joseph acquired ... for Pharaoh in exchange for grain
  chosen_korean: 요셉은 곡식과 바꾸어 ... 파라오를 위해 얻었고
  alternatives_korean:
  - 요셉은 곡식을 주고 ... 파라오를 위해 얻었고
  - 요셉은 곡식과 맞바꾸어 ... 파라오에게 얻었습니다
  lexicon: 얻다 / 바꾸다
  rationale: 원문의 핵심은 요셉이 곡식의 대가로 재산을 취득했다는 점이므로, '얻다'와 '바꾸다'로 교환과 취득을 함께 살렸습니다.
- source_word: ኵለንታሃ፡ ምድረ፡ ግብጽ፡
  english_pob_choice: all the land of Egypt
  chosen_korean: 이집트의 온 땅
  alternatives_korean:
  - 이집트의 모든 땅
  - 이집트 땅 전체
  lexicon: 온 땅
  rationale: 전체성을 분명히 하면서도 문장 흐름이 자연스럽게 이어지도록 했습니다.
- source_word: ሰብአኒ፡ ወእንስሳሆሙኒ፡ ወኵሎ አጥሪየ፡
  english_pob_choice: he acquired the people, their livestock, and everything for Pharaoh
  chosen_korean: 백성과 그들의 가축과 그 밖의 모든 소유도
  alternatives_korean:
  - 사람들과 그들의 가축과 모든 소유도
  - 사람들과 가축과 모든 재산도
  lexicon: 백성 / 가축 / 소유
  rationale: 영문 개정에서 'their people'보다 'the people'의 의미를 바로잡은 점을 반영해, 소속을 덧붙이지 않고 '백성'으로 옮겼습니다. 마지막 항은 단순한 'everything'보다 소유물의 의미가 더 분명해 '소유'로 옮겼습니다.
theological_decisions:
- issue: 파라오 소유권과 반복되는 '파라오를 위해'의 처리
  chosen_reading: 요셉이 취득한 대상이 궁극적으로 파라오의 소유와 권한 아래 들어감을 두 차례의 '파라오를 위해'로 유지했습니다.
  alternative_readings:
  - 한 번만 반복해 문장을 더 간단하게 만드는 읽기
  - '''파라오에게''로 소유 이전을 완곡하게 표현하는 읽기'
  rationale: 원문과 영어 POB가 모두 요셉의 취득 행위와 파라오의 귀속을 함께 강조하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 본문 서술의 경제·정치적 귀속 구조
