  to: 그의 종 야곱에게서입니다. 제가 아직 살아 있는 동안 당신의 얼굴을 보게 된 것은 제게 참으로 큰 일입니다. 제가 벧엘에서 본 그 환상이 참으로 이루어졌기 때문입니다. 야훼, 나의 하나님, 영원무궁토록 찬송을 받으소서. 그의 이름도 찬송을 받으소서.
