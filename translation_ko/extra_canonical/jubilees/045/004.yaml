  text: from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. Blessed be the LORD my God forever and ever, and blessed be his name."
translation:
  language: ko
  text: 그의 종 야곱에게서입니다. 제가 아직 살아 있는 동안 당신의 얼굴을 보게 된 것이 제게는 얼마나 큰지요. 제가 벧엘에서 본 그 환상이 참으로 이루어졌기 때문입니다. 야훼, 나의 하나님, 영원무궁토록 찬송을 받으소서. 그리고 그의 이름도 찬송을 받으소서.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: servant
  english_pob_choice: his servant Jacob
  chosen_korean: 그의 종 야곱
  alternatives_korean:
  - 그의 하인 야곱
  - 그의 종인 야곱
  lexicon: δοῦλος / servant
  rationale: 원문과 POB의 관계적 종속성을 살리기 위해 관용적 ‘종’을 택했고, 문맥상 소유격을 자연스럽게 붙였습니다.
- source_word: while I am still alive
  english_pob_choice: while I am still alive
  chosen_korean: 제가 아직 살아 있는 동안
  alternatives_korean:
  - 제가 살아 있는 채로
  - 제가 아직 생존해 있는 동안
  lexicon: ζῶ / alive
  rationale: 직역에 가깝되 현대 한국어로 자연스럽게 풀어, 생존의 상태를 분명히 드러냈습니다.
- source_word: vision ... was truly established
  english_pob_choice: the vision that I saw at Bethel was truly established
  chosen_korean: 제가 벧엘에서 본 그 환상이 참으로 이루어졌기 때문입니다
  alternatives_korean:
  - 제가 벧엘에서 본 그 환상이 참되게 확정되었기 때문입니다
  - 제가 벧엘에서 본 그 환상이 ნამდვილად 성립되었기 때문입니다
  lexicon: vision / established
  rationale: ‘이루어졌기 때문입니다’로 환상이 현실 속에서 성취되었음을 자연스럽게 옮겼고, ‘참으로’로 ἀληθῶς의 확증 뉘앙스를 살렸습니다.
- source_word: Blessed be ... and blessed be his name
  english_pob_choice: Blessed be the LORD my God forever and ever, and blessed be his name
  chosen_korean: 야훼, 나의 하나님, 영원무궁토록 찬송을 받으소서. 그리고 그의 이름도 찬송을 받으소서
  alternatives_korean:
  - 야훼, 나의 하나님, 영원무궁토록 복을 받으소서. 그리고 그의 이름도 복을 받으소서
  - 야훼, 나의 하나님, 영원무궁토록 송축을 받으소서. 그리고 그의 이름도 송축을 받으소서
  lexicon: blessed / name
  rationale: POB의 축복형을 한국어 예배어법에 맞게 ‘찬송을 받으소서’로 옮겨, 하나님께 향하는 송축의 방향을 분명히 했습니다.
- source_word: LORD
  english_pob_choice: the LORD my God
  chosen_korean: 야훼, 나의 하나님
  alternatives_korean:
  - 주님, 나의 하나님
  - 여호와, 나의 하나님
  lexicon: YHWH
  rationale: 프로젝트 기본값에 따라 יהוה를 ‘야훼’로 옮기고, 고유 신명과 소유격을 함께 보존했습니다.
theological_decisions:
- issue: 마지막 축복문의 한국어 어조
  chosen_reading: ‘찬송을 받으소서’로 번역해 하나님께 향한 축복/송축의 방향을 유지했습니다.
  alternative_readings:
  - ‘복을 받으소서’
  - ‘송축을 받으소서’
  rationale: 원문과 POB는 하나님을 대상으로 한 축복 선언을 유지하므로, 한국어에서도 기원형보다 송축 선언형이 더 정확합니다.
  doctrine_reference: 하나님 송축에 관한 성경적 축복 언어
