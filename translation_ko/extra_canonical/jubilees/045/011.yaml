  text: And that year was the first year of the fourth week of the forty-fifth jubilee[11].
  footnotes:
  - marker: '11'
    text: The chronological notice appears difficult against the chapter's earlier dating formulas. The Ethiopic text is translated as given, but the jubilee numbering may reflect a textual problem or corruption in transmission.
    reason: textual_variant
  - marker: a
    text: Or 'forty-fourth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 해는 마흔다섯 번째 희년의 넷째 주간의 첫째 해였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 연대기 표기는 이 장 앞부분의 연대 공식들과 비교할 때 어렵게 보입니다. 에티오피아어 본문은 그대로 번역하였으나, 희년의 번호는 본문 전승 과정에서 문제가 생겼거나 훼손되었을 가능성이 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ዓመት
  english_pob_choice: that year
  chosen_korean: 그 해
  alternatives_korean:
  - 그때
  - 그 해였고
  lexicon: year
  rationale: 연대기적 진술이므로 간결하게 ‘그 해’로 옮겨, 앞 문맥의 시점 지시를 자연스럽게 반영했습니다.
- source_word: ቀዳሚ
  english_pob_choice: first
  chosen_korean: 첫해
  alternatives_korean:
  - 첫째 해
  - 처음 해
  lexicon: first
  rationale: 주간(week) 안에서의 연차를 나타내므로 ‘첫해’가 한국어에서 가장 자연스럽고 압축적인 대응입니다.
- source_word: ዘሱባዔ ራብዕ
  english_pob_choice: of the fourth week
  chosen_korean: 넷째 주의
  alternatives_korean:
  - 네 번째 주의
  - 넷째 기간의
  lexicon: week
  rationale: ‘주’는 주간 단위를 그대로 살리되, 속격 관계는 ‘의’로 자연스럽게 연결했습니다.
- source_word: ዘአርብዓ መንሥእቱ እዮቤሌው
  english_pob_choice: of the forty-fifth jubilee
  chosen_korean: 마흔다섯 번째 희년의
  alternatives_korean:
  - 마흔넷째 희년의
  - 마흔다섯째 희년의
  lexicon: jubilee
  rationale: 본문의 비평적 읽기와 영어 POB 수정 사항을 따라 ‘forty-fifth’에 해당하는 ‘마흔다섯 번째’로 옮겼습니다.
theological_decisions:
- issue: 희년 연대기의 수치가 본문 전후 맥락과 어긋날 수 있는 문제
  chosen_reading: 본문의 연대기 진술은 그대로 번역하되, 수치상 문제는 본문 자체의 긴장으로 남깁니다.
  alternative_readings:
  - 문맥을 따라 숫자를 조정해 매끈하게 풀기
  - 주해적으로만 처리하고 본문에는 반영하지 않기
  rationale: 영어 POB가 지적하듯 이 절은 전승 과정상의 텍스트 문제 가능성을 내포하므로, 한국어 본문은 원문의 수치적 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 본문비평/전승사
- issue: 희년(Jubilee) 용어의 번역
  chosen_reading: ‘희년’으로 옮겨 구약의 제도적·연대기적 용례를 유지합니다.
  alternative_readings:
  - 희락년
  - 해방년
  rationale: 이 문맥의 Jubilees는 고유한 연대 단위이므로, 교회 전통어보다 본문 기능을 드러내는 ‘희년’이 적절합니다.
  doctrine_reference: 구약 연대기/제도 용어
