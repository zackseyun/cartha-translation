  text: And the years of famine were completed[9], and Joseph gave the people who were in the land seed and provisions, so that they might sow the land in the eighth year, because the river had overflowed over all the land of Egypt.
  footnotes:
  - marker: '9'
    text: The clause 'in the seventh year' is textually and contextually difficult. It may reflect the year following the seven-year famine, or a segmentation issue in the extracted row.
    reason: segmentation_note
  - marker: a
    text: Or 'seventh'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 기근의 햇수는 끝났습니다. 요셉은 그 땅에 있는 백성에게 씨앗과 양식을 주어, 그들이 여덟째 해에 땅을 경작하게 했습니다. 이는 강물이 이집트 온 땅 위로 범람하였기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተፈጸመ፡ ዓመታት፡ ዐባር
  english_pob_choice: the years of famine were completed
  chosen_korean: 기근의 햇수는 끝났습니다
  alternatives_korean:
  - 기근의 해들이 끝났습니다
  - 기근의 세월이 끝났습니다
  lexicon: 완료 표현
  rationale: 완료된 기간을 자연스럽게 옮기되, Ge'ez의 복수적 ‘years’를 살려 ‘햇수’로 처리해 단순한 ‘해’보다 기간성을 분명히 했습니다.
- source_word: ወወሀበ፡ ዮሴፍ፡ ለአሕዛብ፡ ... ዘርአ፡ ወሲሳተ፡
  english_pob_choice: Joseph gave the people who were in the land seed and provisions
  chosen_korean: 요셉은 그 땅에 있는 백성에게 씨앗과 양식을 주어
  alternatives_korean:
  - 요셉은 그 땅에 있는 사람들에게 씨앗과 식량을 주어
  - 요셉은 그 땅의 백성에게 종자와 식량을 주어
  lexicon: መል비/보급 관련 어휘
  rationale: source의 씨앗(종자)과 생존용 보급을 구분해 살리기 위해 ‘씨앗과 양식’으로 옮겼으며, ‘양식’은 단순한 food보다 비상 보급의 뉘앙스를 유지합니다.
- source_word: ከመ፡ ይዝርኡ፡ ምድረ፡ በሳምን፡ ዓመት፡
  english_pob_choice: so that they might sow the land in the eighth year
  chosen_korean: 그들이 여덟째 해에 땅을 경작하게 했습니다
  alternatives_korean:
  - 그들이 여덟째 해에 땅에 씨를 뿌리게 했습니다
  - 그들이 여덟째 해에 땅을 파종하게 했습니다
  lexicon: 동사 선택
  rationale: Ge'ez 동사 ‘씨 뿌리다/경작하다’의 기능을 살려, 한국어에서 문맥상 파종을 포함하는 ‘경작하게 하다’로 자연스럽게 표현했습니다.
- source_word: እስመ፡ መልአ፡ ፈለግ፡ ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ።
  english_pob_choice: because the river had overflowed over all the land of Egypt
  chosen_korean: 이는 강물이 이집트 온 땅 위로 범람하였기 때문입니다
  alternatives_korean:
  - 이는 강이 이집트 온 땅을 가득 채웠기 때문입니다
  - 이는 강물이 이집트 땅 전체를 덮었기 때문입니다
  lexicon: 홍수/범람 어휘
  rationale: 원문의 ‘넘쳐흐름’ 이미지를 보존하기 위해 ‘범람하다’를 선택했고, ‘온 땅 위로’로 지형 위를 덮는 동작을 드러냈습니다.
theological_decisions:
- issue: 연대 표현의 해석(여덟째 해)
  chosen_reading: 본문의 ሳምን을 따라 ‘여덟째 해’로 번역했습니다.
  alternative_readings:
  - ‘일곱째 해’로 옮기는 전통적 오독을 따르는 읽기
  - 본문 비평 주석만 두고 본문에는 해를 밝히지 않는 읽기
  rationale: English audit와 Ge'ez 어휘 검토가 모두 ‘eighth’를 지지하므로, 본문 의미를 흐리는 ‘일곱째’는 따르지 않았습니다.
  doctrine_reference: 본문비평/주석적 판단
- issue: ‘그 땅에 있는 백성’의 범위
  chosen_reading: 이스라엘이 아니라 이집트 땅 안에 있던 주민 전체를 가리키는 일반적 집단명으로 읽었습니다.
  alternative_readings:
  - 요셉의 가족이나 특정 민족만을 가리키는 읽기
  rationale: 원문의 ዘውስተ ምድረ는 장소 안에 있는 사람들을 가리키는 표현으로 보이며, 문맥상 기근 속 이집트 거주민 전체를 뜻하는 것이 자연스럽습니다.
  doctrine_reference: 문맥 해석
