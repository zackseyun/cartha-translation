- from: 그리고 요셉은 아버지와 형제들과 그들의 모든 가축을 그들에게 넉넉할 만큼, 그 기근의 일곱 해 동안 부양하였습니다.[a]
  to: 그리고 요셉은 기근이 든 일곱 해 동안 아버지와 형제들과 그들의 모든 가축을, 그들 모두에게 필요한 만큼 먹여 살렸습니다.[a]
