  text: And Joseph sustained his father and his brothers, and all their livestock, as was sufficient for them during the seven years of famine.
  footnotes:
  - marker: a
    text: Or 'and he provided for them and all that was theirs'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 요셉은 기근이 든 일곱 해 동안 아버지와 형제들과 그들의 모든 가축을, 그들 모두에게 필요한 만큼 먹여 살렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들과 그들에게 속한 모든 것을 먹여 살렸다.”
    reason: Supplied English POB audit-trail footnote (‘and he provided for them and all that was theirs’) localized into Korean. The main text follows the more specific source-based rendering of ጥሪቶሙ as ‘livestock.’
lexical_decisions:
- source_word: ሴሰዮሙ
  english_pob_choice: sustained / nourished
  chosen_korean: 부양하였습니다
  alternatives_korean:
  - 먹여 살리셨습니다
  - 기르셨습니다
  - 공급하였습니다
  lexicon: sustained
  rationale: 가뭄 속에서 사람뿐 아니라 가축까지 포함해 생활을 유지시킨 뜻을 살리기 위해, 단순한 ‘공급’보다 생계를 떠받치는 의미가 있는 ‘부양하다’를 택했습니다.
- source_word: ዮሴፍ
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요세프
  lexicon: Joseph
  rationale: 성경에서 통용되는 고유명사 형태를 유지했습니다.
- source_word: ጥሪቶሙ
  english_pob_choice: all their livestock
  chosen_korean: 그들의 모든 가축
  alternatives_korean:
  - 그들의 모든 소유
  - 그들의 모든 재산
  lexicon: livestock
  rationale: 개정된 영어 POB가 이 항목을 ‘their livestock’로 확정하므로, 게으름을 피하는 추상적 표현보다 구체적인 가축으로 옮겼습니다.
- source_word: በከመ፡ የአክሎሙ
  english_pob_choice: as was sufficient for them
  chosen_korean: 그들에게 넉넉할 만큼
  alternatives_korean:
  - 그들에게 충분한 만큼
  - 그들이 필요로 하는 만큼
  lexicon: as was sufficient
  rationale: 원문의 ‘충분하다/맞다’는 뜻을 자연스러운 현대 한국어로 옮기되, 기근 상황의 실제 필요 충족을 드러내기 위해 ‘넉넉할 만큼’으로 표현했습니다.
theological_decisions:
- issue: 기근 속 요셉의 역할을 단순 생계지원 이상으로 옮길지 여부
  chosen_reading: 본문의 동사는 요셉이 아버지와 형제들과 그들의 가축을 실제로 부양해 생명을 유지하게 했다는 사실을 평이하게 진술합니다.
  alternative_readings:
  - 하나님의 섭리적 돌봄을 직접 부각하는 표현
  - 요셉의 통치적 관리 능력을 강조하는 표현
  rationale: 이 절 자체는 해설보다 사건 서술이 중심이므로, 본문이 말하는 실질적 부양을 직접적으로 전달하는 데 집중했습니다.
  doctrine_reference: 창세기의 요셉 이야기 전체에 나타나는 섭리 주제
