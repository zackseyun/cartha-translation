base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045/005.yaml
  text: And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.
translation:
  language: ko
  text: 요셉과 그의 형제들은 아버지 앞에서 떡을 먹고 포도주를 마셨습니다. 야곱은 요셉이 그의 형제들과 함께 먹고 아버지 앞에서 마시는 것을 보고 매우 크게 기뻐했습니다. 그는 야곱을 지켜 주시고 야곱을 위해 그의 열두 아들을 지켜 주신 만물의 창조주를 찬송했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብስተ
  english_pob_choice: bread
  chosen_korean: 떡
  alternatives_korean:
  - 빵
  - 양식
  lexicon: Geez ኅብስተ = bread/loaf
  rationale: 서술문에서 기본 식품을 뜻하며, 한국어 성경 문체에서 자연스럽고 간결한 기본 대응인 ‘떡’을 택했습니다.
- source_word: ወይነ
  english_pob_choice: wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 와인
  lexicon: Geez ወይነ = wine
  rationale: 원문의 일반적인 포도주를 분명히 드러내기 위해 ‘포도주’로 옮겼습니다.
- source_word: ፍሥሐ ዐቢየ ጥቀ
  english_pob_choice: very great joy
  chosen_korean: 매우 큰 기쁨으로 기뻐했습니다
  alternatives_korean:
  - 지극히 크게 기뻐했습니다
  - 크나큰 기쁨을 크게 누렸습니다
  lexicon: Geez expression of intensified joy
  rationale: ‘매우 큰 기쁨’의 강도를 유지하되, 한국어로는 자연스럽게 서술동사까지 포함해 반복적 기쁨의 뉘앙스를 살렸습니다.
- source_word: ዘፈጣሪ ኵሉ
  english_pob_choice: the Creator of all
  chosen_korean: 모든 것을 지키신 창조주
  alternatives_korean:
  - 만물의 창조주
  - 모든 것의 창조주
  lexicon: Geez title for God as creator of all
  rationale: 영어 POB의 ‘preserved’가 뒤따르므로, 단순 호칭보다 본문 흐름을 살려 ‘모든 것을 지키신 창조주’로 옮겨 감사의 초점을 보존 행위와 연결했습니다.
- source_word: ዐቀቦ / ዐቀበ
  english_pob_choice: had preserved him / had preserved for him
  chosen_korean: 자신을 보존하시고 자기에게 열두 아들을 보존해 주셨기 때문입니다
  alternatives_korean:
  - 자기를 지키시고 자기에게 열두 아들을 지켜 주셨기 때문입니다
  - 자신을 보호하시고 그에게 열두 아들을 보존하셨기 때문입니다
  lexicon: Geez verb of keeping/preserving
  rationale: 같은 보존 동사를 두 번 반복한 구조를 유지해, 야곱 자신의 생명 보존과 열두 아들의 보존을 분리해 드러냈습니다.
theological_decisions:
- issue: ‘Creator of all’의 번역에서 보존 의미를 어떻게 반영할지
  chosen_reading: 창조주를 단순 호칭으로만 두지 않고 ‘모든 것을 지키신 창조주’로 옮겨, 야곱의 감사가 창조와 섭리 둘 다를 향하고 있음을 드러냈습니다.
  alternative_readings:
  - 만물의 창조주
  - 모든 것의 창조주
  rationale: 원문과 영어 POB는 하나님을 창조주로 부르되 곧바로 보존 행위를 찬양하게 하므로, 한국어에서도 그 신학적 결속을 보이게 해야 합니다.
  doctrine_reference: 섭리, 보존
- issue: 야곱의 기쁨과 찬양을 한 문장 흐름으로 처리할지
  chosen_reading: ‘매우 큰 기쁨으로 기뻐했습니다. 그리고… 찬양했습니다’로 나누어, 관찰 → 기쁨 → 축복의 순서를 분명히 했습니다.
  alternative_readings:
  - 야곱은 매우 크게 기뻐하며… 찬양했습니다
  - 야곱은… 매우 큰 기쁨으로 기뻐하고… 찬양했습니다
  rationale: 원문은 ‘보았기 때문에’의 인과가 명확하므로, 한국어에서도 감정과 축복을 분리해 서술하는 편이 문맥을 더 정확히 전달합니다.
  doctrine_reference: 감사와 찬양의 서사
