    text: Or 'a fifth of everything that was produced for the king'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉은 생산된 모든 것 가운데 오분의 일을 왕을 위하여 거두고, 오분의 사는 그들에게 먹을 것과 씨앗으로 남겨 두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነሥአ፡ ዮሴፍ፡
  english_pob_choice: And Joseph took
  chosen_korean: 요셉은 ... 취하고
  alternatives_korean:
  - 요셉은 ... 가져가고
  - 요셉은 ... 받았고
  lexicon: proper noun; action verb
  rationale: 문맥상 요셉이 분배분을 ‘취하다’는 의미가 분명하므로, 단순한 ‘받다’보다 책임 있는 징수·수취의 뉘앙스를 살렸습니다.
- source_word: እምኵሉ፡ ዘፈረየ፡
  english_pob_choice: of everything that was produced
  chosen_korean: 생산된 것의
  alternatives_korean:
  - 산출된 모든 것의
  - 거둔 모든 것의
  lexicon: quantifier + passive/resultative participle
  rationale: 게으름 없이 나오는 전체 산물을 가리키므로, ‘생산된 것’으로 넓게 옮겨 모든 소출을 포괄하게 했습니다.
- source_word: ለንጉሥ፡
  english_pob_choice: for the king
  chosen_korean: 왕을 위하여
  alternatives_korean:
  - 왕을 위해
  - 왕에게
  - 왕의 몫으로
  lexicon: benefactive/dative marker
  rationale: 원문은 단순 소유가 아니라 왕에게 귀속되는 몫임을 나타내므로, ‘위하여’로 목적·귀속의 방향을 드러냈습니다.
- source_word: ወለዘርእ፡
  english_pob_choice: and for seed
  chosen_korean: 씨앗을 위해
  alternatives_korean:
  - 파종용으로
  - 씨 뿌릴 것을 위해
  lexicon: agricultural term
  rationale: 씨앗은 다음 파종을 위한 저장분을 뜻하므로, 자연스러운 현대어로 ‘씨앗’과 목적격 표현을 사용했습니다.
theological_decisions:
- issue: 분배 비율의 보존
  chosen_reading: 다섯째 몫과 나머지 네 몫이라는 비대칭 분배를 그대로 살렸습니다.
  alternative_readings:
  - ‘5분의 1은 왕 몫, 4분의 1은 백성 몫’으로 평준화
  - ‘한 몫은 왕에게, 네 몫은 그들에게’로 축약
  rationale: 본문은 생산물의 5분의 1을 왕에게, 나머지 4분의 1이 아니라 네 몫을 생활·종자용으로 남기는 구조를 보여 주므로, 수량 관계를 단순화하지 않았습니다.
  doctrine_reference: 텍스트 충실성 및 경제사적 서술 보존
- issue: ‘먹을 것과 씨앗’의 목적어 처리
  chosen_reading: ‘먹을 것과 씨앗을 위해’로 목적을 드러냈습니다.
  alternative_readings:
  - ‘먹을 것과 씨앗으로’
  - ‘먹거리와 종자로’
  rationale: 원문의 용도 표지는 단순 물품 열거가 아니라 생존과 다음 해 파종이라는 목적을 나타내므로, 목적 표현을 유지했습니다.
  doctrine_reference: 서술문 의미 보존
