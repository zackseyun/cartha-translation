translation:
  language: ko
  text: 그리고 이스라엘은 죽기 전에 자기 아들들을 축복하고, 그들에게 이집트 땅에서 닥칠 모든 일을 말해 주었으며, 또한 뒤날에 그들에게 닥칠 일을 알려 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባረኮሙ፡ እስራኤል፡ ለውሉዱ፡ ዘእንበለ፡ ይሙት፡
  english_pob_choice: And before he died, Israel blessed his sons
  chosen_korean: 그리고 이스라엘은 죽기 전에 자기 아들들을 축복하고
  alternatives_korean:
  - 그리고 이스라엘은 죽기 전에 아들들을 복 주고
  - 그리고 이스라엘은 죽기 전에 그의 아들들을 축복하고
  lexicon: 축복하다
  rationale: 게에즈 원문은 ‘축복하다’에 해당하는 동사를 사용하며, 관계를 분명히 하기 위해 ‘자기 아들들’로 옮겼습니다.
- source_word: ዘኮነ፡ ይረክቦሙ፡ በምድረ፡ ግብጽ፡
  english_pob_choice: everything that would happen to them in the land of Egypt
  chosen_korean: 그들에게 이집트 땅에서 그들에게 닥칠 모든 일
  alternatives_korean:
  - 이집트 땅에서 그들에게 일어날 모든 일
  - 이집트 땅에서 그들에게 닥칠 모든 것
  lexicon: 닥치다
  rationale: 원문은 단순한 사건 나열보다 ‘닥치다/일어나다’의 수동적 도래를 나타내므로, 한국어에서도 ‘닥칠’로 긴장을 살렸습니다.
- source_word: ወበደኃሪ፡ መዋዕል፡
  english_pob_choice: what would come upon them in later days
  chosen_korean: 뒤날에 그들에게 닥칠 일
  alternatives_korean:
  - 후일에 그들에게 닥칠 일
  - 마지막 날들에 그들에게 닥칠 일
  lexicon: 뒤날
  rationale: 게에즈의 ‘후일/뒤날’ 표현을 살려, 종말론적이기보다 장래를 가리키는 말로 유지했습니다.
- source_word: እይድያሙ
  english_pob_choice: he made known to them
  chosen_korean: 그들에게 알려 주었습니다
  alternatives_korean:
  - 그들에게 알렸습니다
  - 그들에게 밝혀 주었습니다
  lexicon: 알려 주다
  rationale: 마지막 동사는 ‘알리다/알게 하다’의 의미이므로, 앞의 ‘말해 주었다’와 구분되면서도 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 예언적 진술의 시제와 뉘앙스
  chosen_reading: ‘닿칠/알려 주었습니다’로 처리하여, 미래의 사건을 미리 통보하는 예언적 말하기를 드러냈습니다.
  alternative_readings:
  - 단순 과거 서술로만 옮기는 방식
  - 미래 시제를 반복해 강조하는 방식
  rationale: 원문은 과거 서술 안에서 장차 일어날 일을 미리 알려 주는 구조이므로, 한국어에서도 완료형 서술로 역사적 서술감을 유지하면서 미래성을 보존했습니다.
  doctrine_reference: 성서의 예언적 계시 이해
