  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
  footnotes:
  - marker: '16'
    text: '''Renew them'' may imply preserving the books by recopying, restoring, or transmitting them afresh to later generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 스스로 파 놓은 무덤, 곧 헤브론 땅의 쌍굴에 있는 무덤 안에. 그리고 그는 자기 아들 레위에게 자기의 모든 책과 조상들의 책을 주어, 레위가 오늘날까지 자기 자녀들을 위하여 그것들을 보존하고 새롭게 하도록 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘새롭게 하다’는 책들을 재필사하거나 복원하거나 후대에 새롭게 전승하여 보존한다는 뜻을 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: መቃብር / በዐት / ዘካዕበት
  english_pob_choice: the tomb ... in the double cave
  chosen_korean: 무덤 … 쌍둥이 굴속
  alternatives_korean:
