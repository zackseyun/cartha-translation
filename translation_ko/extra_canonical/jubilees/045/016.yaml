  text: in the tomb that he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16], so that he might preserve them and renew them for his children until this day.
  footnotes:
  - marker: '16'
    text: '''Renew them'' may imply preserving the books by recopying, restoring, or transmitting them afresh to later generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 스스로 파 놓은 무덤, 곧 헤브론 땅의 쌍둥이 굴속에 있는 무덤에 두었습니다. 그리고 자기 아들 레위에게 자기의 모든 책과 조상들의 책을 주어, 그가 그것들을 보존하고 오늘날까지 자기 자녀들을 위해 새롭게 하게 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቃብር / በዐት / ዘካዕበት
  english_pob_choice: the tomb ... in the double cave
  chosen_korean: 무덤 … 쌍둥이 굴속
  alternatives_korean:
  - 쌍굴
  - 이중 굴
  - 두 겹 굴
  lexicon: 무덤 / 굴
  rationale: 원문의 매장 장소는 단순한 ‘동굴’이 아니라 무덤이며, ዘካዕበት은 헤브론의 ‘double cave’를 가리키므로 자연스러운 설명형으로 옮겼습니다.
- source_word: ለይቲ / ይዕቀቦን
  english_pob_choice: preserve them
  chosen_korean: 보존하고
  alternatives_korean:
  - 지키고
  - 간직하고
  - 보관하고
  lexicon: 보존하다
  rationale: 책을 물리적으로 지키는 뜻과 후대까지 전하는 뜻을 함께 살리기에 ‘보존하다’가 가장 적절합니다.
- source_word: ያሐድሶን
  english_pob_choice: renew them
  chosen_korean: 새롭게 하게
  alternatives_korean:
  - 다시 쓰게
  - 복사하게
  - 갱신하게
  lexicon: 새롭게 하다
  rationale: 영어 주석이 암시하듯 이 동사는 단순 재생이 아니라 복사·복원·전승을 포함할 수 있으므로, 해석을 좁히지 않는 ‘새롭게 하다’로 두었습니다.
- source_word: መጻሕፍቲሁ / መጻሕፍተ አበዊሁ
  english_pob_choice: all his books ... the books of his fathers
  chosen_korean: 자기의 모든 책과 조상들의 책
  alternatives_korean:
  - 모든 문서와 조상들의 문서
  - 모든 기록과 조상들의 기록
  lexicon: 책
  rationale: 원문은 기록물 전체를 가리키지만, POB의 영어가 ‘books’를 유지하므로 한국어에서도 직역에 가까운 ‘책’을 사용했습니다.
theological_decisions:
- issue: 문서 보존 행위의 의미
  chosen_reading: 레위가 책들을 단순 소유하는 것이 아니라, 후대 자녀들을 위해 보존하고 새로 전하는 책임을 받는 것으로 읽었습니다.
  alternative_readings:
  - 그냥 보관하는 행위로만 이해
  - 문자 그대로 물리적 복원만 강조
  rationale: 영어 POB의 주석과 게에즈 동사의 조합은 전승·복제·복원을 포괄하므로, 문맥이 허용하는 범위 안에서 전승 책임을 분명히 했습니다.
  doctrine_reference: 사본 전승과 계승의 문맥
