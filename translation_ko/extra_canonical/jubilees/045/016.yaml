  - 복사하게
  - 갱신하게
  lexicon: 새롭게 하다
  rationale: 영어 주석이 암시하듯 이 동사는 단순 재생이 아니라 복사·복원·전승을 포함할 수 있으므로, 해석을 좁히지 않는 ‘새롭게 하다’로 두었습니다.
- source_word: መጻሕፍቲሁ / መጻሕፍተ አበዊሁ
  english_pob_choice: all his books ... the books of his fathers
  chosen_korean: 자기의 모든 책과 조상들의 책
  alternatives_korean:
