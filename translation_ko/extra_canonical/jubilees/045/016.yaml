  rationale: 영어 POB의 주석과 게에즈 동사의 조합은 전승·복제·복원을 포괄하므로, 문맥이 허용하는 범위 안에서 전승 책임을 분명히 했습니다.
  doctrine_reference: 사본 전승과 계승의 문맥
