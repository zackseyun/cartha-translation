  lexicon: 책
  rationale: 원문은 기록물 전체를 가리키지만, POB의 영어가 ‘books’를 유지하므로 한국어에서도 직역에 가까운 ‘책’을 사용했습니다.
theological_decisions:
- issue: 문서 보존 행위의 의미
  chosen_reading: 레위가 책들을 단순 소유하는 것이 아니라, 후대 자녀들을 위해 보존하고 새로 전하는 책임을 받는 것으로 읽었습니다.
  alternative_readings:
  - 그냥 보관하는 행위로만 이해
