base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/042.yaml
  text: '1[v3]. And in the first year of the third week of the forty-fifth jubilee, while the famine was coming into the land,

    2. the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land

    3. in the seven years of abundance and had kept it. And Egypt came to Joseph so that he might give them food[v5], and he opened the storehouses where the grain of the first years was, and sold it to the peoples of the land for silver.

    4. And the famine became very severe in the land of Canaan, and Jacob heard that there was food in Egypt, and he sent ten of his sons to get food for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.

    5. And Joseph recognized them, but they did not recognize him. And he spoke with them harshly and said to them, “Are you not spies, men of the eye, and have you come to observe the exposed parts of the land?”

    6. And he put them in custody. And after that he released them and kept Simeon alone, and the nine

    7. brothers he sent away. And he filled their sacks with grain, and he put their silver also for them

    8. into their sacks, and they did not know it. And he commanded them to bring their youngest brother, because they had told him that their father was alive and their youngest brother also.

    9. And they went up from the land of Egypt and came to the land of Canaan, and they told their father everything that had happened to them, and that the ruler of the land had spoken harshly with them and had seized Simeon until

    10. they should bring Benjamin. And Jacob said, “You have bereaved me: Joseph is not[v10][v8], and Simeon also is not...”'
  footnotes:
  - marker: v3
    text: The Ethiopic reads 'for gold' or a precious-metal term in Charles's text, but the narrative context strongly suggests ordinary payment money; compare the Joseph famine account in Genesis. The main text renders the likely sense as 'for silver.'
    reason: textual_variant
  - marker: v5
    text: The phrase rendered 'spies, men of the eye' is idiomatic and may literally evoke men who watch or inspect. The main text gives the sense while preserving some literal color.
    reason: lexical_alternative
  - marker: v8
    text: Verse division is slightly awkward in the source rows here; the command to bring the youngest brother continues naturally from the preceding line.
    reason: segmentation_note
  - marker: v10
    text: The chapter ends abruptly in the provided source row, with Jacob's complaint beginning but not completed. The ellipsis marks the incomplete surviving chapter segmentation here, not an attempt to paraphrase beyond the source provided.
    reason: segmentation_note
translation:
  language: ko
  text: '1[v3]. 마흔다섯째 희년 셋째 주 첫째 해에 그 땅에 흉년이 들매

    2. 소나기가 내리지 아니하므로 땅에 비가 그쳤느니라. 그 땅이 척박하더니 애굽 땅에만 먹을 것이 있었으니 이는 요셉이 그 땅에 종자를 거두었음이라

    3. 일곱 해의 풍년에도 그것을 지켰느니라. 그러자 이집트 사람이 요셉에게 와서 그들에게 양식을 주려고 왔습니다. 요셉이 처음 해의 곡물 창고를 열고 그것을 그 땅 백성들에게 은을 받고 팔았습니다.

    4. 가나안 땅에 기근이 심히 심하매 야곱이 애굽에 양식이 있다는 소식을 듣고 자기 아들 열 명을 보내어 애굽에서 양식을 구하게 하였더라. 그러나 베냐민은 보내지 않았습니다. 그리고 야곱의 열 아들은 여행하는 사람들과 함께 이집트에 도착했습니다.

    5. 요셉은 그들을 알아보았지만 그들은 그를 알아보지 못했습니다. 그가 엄하게 그들에게 말하여 이르되 너희는 정탐이요 명민이 아니냐 너희는 그 땅의 드러난 부분을 관찰하러 왔느냐

    6. 그리고 그는 그들을 감옥에 가두었습니다. 그 후에 그들을 놓아 주시고 시므온만 홀로 두셨으며 아홉 명은

    7. 그가 보낸 형제들. 그리고 그들의 자루에 곡식을 채우고 그들의 은도 넣어 두었습니다.

    8. 자루에 넣었으나 그들은 깨닫지 못하였느니라 그리고 그는 그들에게 그들의 아버지가 살아 있고 막내 동생도 살아 있다고 말하였기 때문에 그들의 막내 동생을 데려오라고 명령하였다.

    9. 그들이 애굽 땅에서 올라와 가나안 땅에 이르러 자기들이 겪은 모든 일과 그 땅의 통치자가 그들에게 엄하게 말하고 시므온을 사로잡아

    10. 베냐민을 데려와야 합니다. 야곱이 이르되 당신이 나를 버리셨도다 요셉은 [v10][v8]도 아니요 시므온도 아니라...'
