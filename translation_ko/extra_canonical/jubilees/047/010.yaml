base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: ko
  text: 그리고 당신은 왕의 궁정에 세 주간의 해 동안 있었습니다. 그러다가 왕의 궁정에서 나가던 날, 한 이집트 사람이 당신의 동족, 곧 당신의 형제들 가운데 한 사람을 때리는 것을 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ዐጸድ፡ መንግሥት፡
  english_pob_choice: in the court of the king
  chosen_korean: 왕의 궁정에
  alternatives_korean:
  - 왕의 뜰에
  - 왕궁 안에
  lexicon: court = 궁정
  rationale: geez의 ዐጸድ은 왕의 거처 자체보다 왕의 공적 공간/궁정에 가깝고, POB의 'court of the king'를 자연스러운 현대 한국어로 옮기기 위해 ‘왕의 궁정’으로 했습니다.
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመተ፡
  english_pob_choice: for three weeks of years
  chosen_korean: 세 주간의 해 동안
  alternatives_korean:
  - 세 주의 해 동안
  - 삼 주간의 해 동안
  lexicon: week of years = 주간의 해
  rationale: 직역적이되 한국어에서 의미가 통하도록 ‘주간의 해’로 유지했습니다. 이는 일반적인 시간 단위가 아니라 주석적/계산적 표현임을 드러냅니다.
- source_word: ወርኢኮ፡ ለግብጻዊ፡ እንዘ፡ *ይዘብጦ፡
  english_pob_choice: and saw an Egyptian striking
  chosen_korean: 한 이집트 사람이 ... 때리는 것을 보았습니다
  alternatives_korean:
  - 한 애굽 사람이 ... 치는 것을 보았습니다
  - 이집트인을 ... 때리는 것을 보았습니다
  lexicon: Egyptian = 이집트 사람
  rationale: 행위 주체를 드러내면서도 민족/출신 표지를 살리기 위해 ‘이집트 사람’으로 옮겼습니다. 현재형적 진행 뉘앙스는 한국어 관용에 따라 ‘때리는 것을 보았습니다’로 처리했습니다.
- source_word: ለካልእከ፡ ዘእምነ፡
  english_pob_choice: your fellow countryman, one of your brothers
  chosen_korean: 당신의 동족, 곧 당신의 형제들 가운데 한 사람
  alternatives_korean:
  - 당신의 동족인, 당신의 형제들 가운데 한 사람
  - 당신의 민족 동포, 곧 당신의 형제들 가운데 한 사람
  lexicon: fellow countryman / one of your brothers = 동족 / 형제들 가운데 한 사람
  rationale: ‘fellow countryman’와 ‘one of your brothers’를 둘 다 살리기 위해 ‘동족’과 ‘형제들 가운데 한 사람’을 병렬로 두어 관계를 중복해 명시했습니다.
theological_decisions:
- issue: 지시 대상 ‘당신’의 2인칭 유지
  chosen_reading: 본문의 직접 خطاب을 살려 일관되게 ‘당신’으로 옮겼습니다.
  alternative_readings:
  - ‘네가’로 더 친근하게 처리
  - ‘그대’로 고전적 높임을 부여
  rationale: 주석문체/서술문체 혼합이 가능한 위경 문맥이지만, POB의 청중 지향성과 현대 합쇼체를 고려해 직접 خطاب은 ‘당신’으로 유지하는 것이 가장 명료합니다.
  doctrine_reference: 문체/화자 표지
