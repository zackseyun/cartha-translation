  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
  footnotes:
  - marker: a
    text: Or 'And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking your companion?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 그를 죽여 모래 속에 숨겼습니다. 이튿날, 이스라엘 자손 둘이 싸우는 것을 보았고, 잘못을 저지르고 있던 사람에게 말했습니다. “왜 때립니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다르게는, “왜 당신의 동료를 때립니까?” 원문 본문은 때리는 대상의 목적어를 명시하지 않습니다.
    reason: English POB 감사 이력에 보존된 대안적 보충 번역을 제시하되, 제공된 게에즈 본문에 목적어가 없다는 점을 분명히 하여 본문 번역의 절제를 유지합니다.
