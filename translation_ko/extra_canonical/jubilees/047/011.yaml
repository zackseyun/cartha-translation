  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
  footnotes:
  - marker: a
    text: Or 'And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking your companion?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 당신은 그를 죽여 모래 속에 숨겼습니다. 그리고 이튿날에 이스라엘 자손 둘이 싸우는 것을 발견하고, 잘못하던 그에게 말했습니다. “왜 때리십니까?”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቀተልኮ፡ ወኀባእኮ፡ ውስተ፡ ኆፃ።
  english_pob_choice: And you killed him and hid him in the sand.
  chosen_korean: 그를 죽여 모래 속에 숨겼습니다
  alternatives_korean:
  - 그를 죽이고 모래에 숨겼습니다
  - 그를 죽여 모래 속에 감추었습니다
  lexicon: 죽이다 / 숨기다 / 모래
  rationale: 게에즈 원문에 있는 두 동사 ‘죽였다’와 ‘숨겼다’를 모두 살리고, ኆፃ의 구체적 이미지인 ‘모래’를 그대로 드러냈습니다.
- source_word: ወበሳኒታ፡ ዕለት፡
  english_pob_choice: And on the second day
  chosen_korean: 그리고 이튿날에
  alternatives_korean:
  - 그리고 둘째 날에
  - 그리고 다음 날에
  lexicon: 이튿날
  rationale: 원문의 ‘둘째 날’을 자연스러운 현대 한국어로 옮기되, 사건의 연속성을 유지했습니다.
- source_word: ፪እንዘ፡ ይትበአሱ፡ እምውሉደ፡ እስራኤል፡
  english_pob_choice: you found two of the sons of Israel fighting
  chosen_korean: 이스라엘 자손 둘이 싸우는 것을 발견하고
  alternatives_korean:
  - 이스라엘 자손 둘이 싸우는 것을 보셨고
  - 이스라엘 사람 둘이 서로 싸우는 것을 발견하고
  lexicon: 이스라엘 자손 / 발견하다 / 싸우다
  rationale: 원문의 ‘이스라엘 자손’과 ‘둘’의 수량을 유지했고, ‘발견하다’는 English POB의 ‘found’에 대응시켰습니다.
- source_word: ዘይትአገሎ፡
  english_pob_choice: the one who was doing wrong
  chosen_korean: 잘못하던 그에게
  alternatives_korean:
  - 잘못하던 자에게
  - 옳지 않게 하던 그에게
  lexicon: 잘못하다
  rationale: 게에즈 표현을 도덕적·행위적 잘못을 가리키는 말로 옮겼으며, 본문의 대조를 살리기 위해 지시어를 붙였습니다.
- source_word: ትዘብጥ፡
  english_pob_choice: Why are you striking?
  chosen_korean: 왜 때리십니까?
  alternatives_korean:
  - 왜 치십니까?
  - 어째서 때리십니까?
  lexicon: 때리다
  rationale: 원문의 현재적 공격 행위를 한국어에서 자연스럽게 드러내는 동사로 옮겼습니다.
theological_decisions:
- issue: 원문이 질문 대상의 목적어를 생략한 점
  chosen_reading: “왜 때리십니까?”라고 목적어 없이 번역했습니다.
  alternative_readings:
  - “왜 당신의 동료를 때리십니까?”
  - “왜 그를 때리십니까?”
  rationale: 게에즈 본문은 ትዘብጥ 만을 두어 목적어를 제시하지 않으므로, English POB의 후행 각주처럼 한국어 본문에서도 목적어를 보태지 않았습니다.
  doctrine_reference: source fidelity / textual restraint
