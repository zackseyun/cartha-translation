  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
  footnotes:
  - marker: a
    text: Or 'And he protected and sheltered you.'.
    reason: previous_rendering
  - marker: b
    text: Or 'your sister took you and gave you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 삯이 지불되었고, 그녀가 당신을 젖 먹여 길렀습니다. 그 후 당신이 자라자 그들은 당신을 파라오의 딸에게 데려갔고, 당신은 그녀의 아들이 되었습니다. 그리고 당신의 아버지 암람이 당신에게 글쓰기를 가르쳤으며, 당신이 세 주간의 연수를 마쳤을 때 그는 당신을 궁정으로 데려갔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐስበ፡
  english_pob_choice: And wages were paid
  chosen_korean: 삯이 지불되었고
  alternatives_korean:
  - 삯이 지급되었고
  - 보수가 지급되었고
  lexicon: 급여/보상 지급
  rationale: 게에즈 동사는 ‘보상을 주다/삯을 치르다’의 뜻이므로, 돌봄 행위보다 먼저 ‘삯’의 지급을 분명히 살렸습니다.
- source_word: ወሐፀነተከ።
  english_pob_choice: and she nursed you
  chosen_korean: 그녀가 당신을 젖 먹여 길렀습니다
  alternatives_korean:
  - 그녀가 당신을 젖먹였습니다
  - 그녀가 당신을 양육했습니다
  lexicon: 젖 먹이다/길르다
  rationale: 여성 주어가 분명하므로 ‘그녀가’로 살리고, 단순 양육보다 수유·양육의 결합을 보여 주는 표현으로 옮겼습니다.
- source_word: ልሂቀከ፡ ወሰዱከ፡
  english_pob_choice: when you had grown up, they brought you
  chosen_korean: 당신이 자라자 그들은 당신을 데려갔고
  alternatives_korean:
  - 당신이 성장하자 그들은 당신을 데려갔고
  - 당신이 다 자라자 그들은 당신을 데려갔고
  lexicon: 자라다/데려가다
  rationale: 성장(‘자라다’)과 이동(‘데려가다’)을 분리해, 영어 POB의 오독 없이 게에즈의 두 요소를 반영했습니다.
- source_word: ውሉዳ፡
  english_pob_choice: you became her son
  chosen_korean: 당신은 그녀의 아들이 되었습니다
  alternatives_korean:
  - 당신은 그녀의 아들이 되었습니다
  - 당신은 그녀의 아들로 삼겨졌습니다
  lexicon: 아들이 되다
  rationale: 출생이 아니라 관계적 귀속, 곧 입양/양자로 받아들여짐을 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 파라오의 딸에게 ‘아들이 되었다’는 입양적 표현
  chosen_reading: 혈통적 친자 관계가 아니라 궁정 안에서의 신분적 수용과 입양을 드러내는 표현으로 읽었습니다.
  alternative_readings:
  - ‘그녀의 아들이 되었다’를 단순 보호·양육으로 완화하는 읽기
  - ‘그녀의 아들로 삼아졌다’처럼 더 법적 입양을 강조하는 읽기
  rationale: 본문은 ‘딸에게 데려갔고, 그녀의 아들이 되었다’라고 이어지므로, 보호를 넘는 귀속 관계를 보존하는 것이 문맥에 가장 가깝습니다.
  doctrine_reference: 서사적 입양/귀속 표현의 보존
