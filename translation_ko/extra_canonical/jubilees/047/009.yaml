revisions:
- from: 그리고 삯이 지불되었고, 그녀가 당신을 젖 먹여 길렀습니다. 그 후 당신이 자라자 그들은 당신을 파라오의 딸에게 데려갔고, 당신은 그녀의 아들이 되었습니다. 그리고 당신의 아버지 암람이 당신에게 글쓰기를 가르쳤으며, 당신이 세 주간의 연수를 마쳤을 때 그는 당신을 궁정으로 데려갔습니다.[a]
  to: 그리고 삯이 지불되었고, 그녀는 당신에게 젖을 먹여 길렀습니다. 그 후 당신이 자라자 그들은 당신을 파라오의 딸에게 데려갔고, 당신은 그녀의 아들이 되었습니다. 당신의 아버지 암람은 당신에게 글을 쓰는 법을 가르쳤으며, 당신이 세 이레, 곧 스물한 해를 마쳤을 때 그는 당신을 궁정으로 데려갔습니다.
  rationale: 원문의 시간 단위인 ‘three weeks of years’를 ‘세 이레, 곧 스물한 해’로 바로잡아 의미를 명료하게 했습니다. 수유와 글쓰기 교육의 표현을 현대 한국어에 맞게 다듬고, 대응 각주가 없는 [a]를 삭제했습니다. 그 밖의 인물 관계와 서술의 모호성은 원문대로 유지했습니다.
