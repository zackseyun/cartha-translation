  yaml_path: translation/extra_canonical/jubilees/047/012.yaml
  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
  footnotes:
  - marker: '12'
    text: This verse corresponds to verse 48 in the source manuscript numbering. The Ge'ez text here ends abruptly at 'in the week' (በሱባዔ፡).
    reason: textual_note
  - marker: a
    text: Or 'quarreled'.
    reason: previous_rendering
translation:
  language: ko
  text: “네 형제.” 그리고 그는 분노하고 격분하여 말했습니다. “누가 너를 우리 위에 통치자와 재판관으로 세웠느냐? 네가 어제 이집트 사람을 죽인 것처럼 나를 죽이려 하느냐?” 그리고 그는 이 일 때문에 두려워하여 도망쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኅዋከ
  english_pob_choice: Your brother.
  chosen_korean: “네 형이냐?”
  alternatives_korean:
  - 네 형
  - 네 형제
  - 너의 형
  lexicon: 형/형제
  rationale: 문맥상 앞선 인물을 가리키는 호칭이므로 간결한 직접 호칭으로 처리했고, 영어 POB의 짧은 도입문을 반영해 질문형으로 살렸습니다.
- source_word: ወተምዐዐ፡ ወተቈጥዐ፡
  english_pob_choice: he became angry and was indignant
  chosen_korean: 분노하고 격분하여
  alternatives_korean:
  - 화를 내고 분개하여
  - 성내고 격노하여
  - 노하여
  lexicon: 분노하다 / 격분하다
  rationale: 두 동사가 연속되는 강한 감정 표현이므로 단순한 ‘화내다’보다 강도를 살려 ‘분노하고 격분하여’로 옮겼습니다.
- source_word: መኑ፡ ሤመከ፡ መልአከ፡ ወመኰንነ፡ ላዕሌነ፡
  english_pob_choice: Who appointed you a ruler and a judge over us?
  chosen_korean: 누가 너를 우리 위에 통치자와 재판관으로 세웠느냐?
  alternatives_korean:
  - 누가 너를 우리 위에 지도자와 재판관으로 세웠느냐?
  - 누가 너를 우리 위에 치리자와 판관으로 세웠느냐?
  lexicon: ruler / judge → 통치자 / 재판관
  rationale: 권한 부여의 뉘앙스를 살리기 위해 ‘세웠느냐’를 사용했고, POB의 법정·통치 병렬을 표준어로 직접 반영했습니다.
- source_word: ትፈቅድ፡ በከመ፡ ቀተልኮ፡ ትማልም፡ ለግብጻዊ
  english_pob_choice: Do you intend to kill me as you killed the Egyptian yesterday?
  chosen_korean: 네가 어제 이집트 사람을 죽인 것처럼 나를 죽이려 하느냐?
  alternatives_korean:
  - 어제 이집트 사람을 죽인 것처럼 나도 죽이려 하느냐?
  - 네가 어제 이집트 사람을 죽인 것 같이 나를 죽이려 하느냐?
  lexicon: Ἀιγύπτιος → 이집트 사람
  rationale: 직접적인 대비가 핵심이므로 ‘어제’와 ‘나를’의 대조를 분명히 했고, 민족명은 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 문장의 서술 방식과 직접화법의 긴장
  chosen_reading: 직접화법을 따옴표로 분리하고, 서술문은 과거 서술체로 처리했습니다.
  alternative_readings:
  - 한 문장으로 연속 서술
  - 간접화법으로 완화
  rationale: 게에즈 원문과 영어 POB가 모두 인용문과 서술문을 뚜렷이 구분하므로, 독자가 폭발적인 발화를 바로 따라가도록 유지하는 편이 본문 효과를 살립니다.
  doctrine_reference: 서사문체 보존 원칙
- issue: ‘두려워하여 도망쳤습니다’의 인과 표현
  chosen_reading: ‘이 일 때문에’로 인과를 분명히 했습니다.
  alternative_readings:
  - ‘그리하여 두려워 도망쳤습니다’
  - ‘이 일로 두려워 도망쳤습니다’
  rationale: 원문 말미의 ‘이 일 앞에서/때문에’라는 인과 관계를 드러내어, 단순한 감정 묘사가 아니라 사건의 결과로서의 도주를 보존했습니다.
  doctrine_reference: 서사 인과성 보존
