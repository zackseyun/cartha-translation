  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
  footnotes:
  - marker: '3'
    text: The phrase about Miriam likely means she guarded the child by day, specifically from birds or other danger near the riverbank.
    reason: segmentation_note
translation:
  language: ko
  text: 그리고 그들은 네가 태어날 날까지 칠 개월 동안 그것들을 던져 넣었습니다. 그리고 네 어머니는 석 달 동안 너를 숨겼는데, 너 때문에 사람들이 그녀를 알아차렸습니다. 그래서 그녀는 너를 위해 바구니를 만들고, 역청과 아스팔트를 발라서, 강가의 갈대 사이에 그것을 두었고, 너를 그 안에 칠 일 동안 두었습니다. 그리고 네 어머니가 밤에 와서 너에게 젖을 먹였고, 낮에는 네 누이 마리아가 새들로부터 너를 지켰습니다.[a][b]
  philosophy: formal
lexical_decisions:
- source_word: ይገድፉ
  english_pob_choice: casting them in
  chosen_korean: 던져 넣었습니다
  alternatives_korean:
  - 들어가게 했습니다
  - 내던졌습니다
  lexicon: Geez ይገድፉ
  rationale: 문맥상 아이들을 강에 던져 넣는 행위를 가리키므로, POB의 거친 동작감을 살려 ‘던져 넣었습니다’로 옮겼습니다.
- source_word: ወአንበረቶ *ውስተ፡ ሣዕር፡ ኀበ፡ ድንጋገ፡ ፈለግ
  english_pob_choice: placed it among the reeds by the bank of the river
  chosen_korean: 강가의 갈대 사이에 그것을 두었고
  alternatives_korean:
  - 강둑의 갈대 사이에 그것을 놓았고
  - 강가 갈대밭에 그것을 두었고
  lexicon: Geez ሣዕር / ድንጋገ፡ ፈለግ
  rationale: ‘갈대’와 ‘강가/강둑’의 공간 관계를 분명히 하되, 본문이 요구하는 이상으로 위치를 구체화하지 않도록 간결하게 옮겼습니다.
- source_word: ወአንበረተከ፡ ውስቴታ፡ ሰቡዐ፡ መዋዕለ፡
  english_pob_choice: and put you in it for seven days
  chosen_korean: 너를 그 안에 칠 일 동안 두었습니다
  alternatives_korean:
  - 너를 그 안에 일곱 날 동안 두었습니다
  - 너를 거기에 칠 일간 두었습니다
  lexicon: Geez ሰቡዐ መዋዕለ
  rationale: 시간 표현을 현대 한국어의 자연스러운 ‘칠 일 동안’으로 옮기면서도 기간의 길이를 그대로 유지했습니다.
- source_word: ወመዓልተ፡ ትዐቅበከ፡ ማርያ
  english_pob_choice: and by day Miriam your sister guarded you from the birds
  chosen_korean: 낮에는 네 누이 마리아가 새들로부터 너를 지켰습니다
  alternatives_korean:
  - 낮에는 네 누이 마리아가 새들을 막아 너를 지켰습니다
  - 낮에는 네 누이 미리암이 새들로부터 너를 보호했습니다
  lexicon: Geez ማርያ / ትዐቅበከ
  rationale: POB의 해석처럼 낮 동안의 보호 대상이 새들임을 드러내되, ‘지켰습니다’로 간결하게 처리했습니다.
theological_decisions:
- issue: ‘마리아’와 미리암 표기
  chosen_reading: 본문의 Geez 형태를 따라 ‘마리아’로 옮겼습니다.
  alternative_readings:
  - 미리암
  - 마리암
  rationale: 제공된 원문 표기가 ማርያ로 나타나며, POB의 문맥상 인물 식별을 해치지 않는 범위에서 음가에 가까운 표기를 채택했습니다.
  doctrine_reference: 인명 표기 원칙
- issue: ‘새들로부터 너를 지켰습니다’의 해석
  chosen_reading: 보호의 대상이 강변의 새들임을 반영했습니다.
  alternative_readings:
  - 그냥 너를 지켰습니다
  - 다른 위험으로부터 너를 지켰습니다
  rationale: 영문 POB 주석이 낮 동안의 경계가 특히 새들에 대한 것일 가능성을 제시하므로, 과도한 일반화보다 주석 반영 번역을 택했습니다.
  doctrine_reference: POB 주석 반영
