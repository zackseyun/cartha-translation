  to: …그가 당신을 데려오게 하였고, 그가 당신을 그녀에게 데려왔습니다. 그녀가 당신을 바구니에서 꺼내어 가엾게 여기셨습니다. 그러자 당신의 누이가 그녀에게 말했습니다. “제가 가서 당신을 위해 히브리 여자들 가운데 한 사람을 불러, 그 아이를 기르고 젖을 먹이게 할까요?”
