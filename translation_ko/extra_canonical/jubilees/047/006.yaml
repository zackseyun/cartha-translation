translation:
  language: ko
  text: …그가 당신을 데려오게 하였고, 그가 당신을 그녀에게 데려왔습니다. 그녀가 당신을 바구니에서 꺼내어 가엾게 여기셨습니다. 그러자 당신의 누이가 그녀에게 말했습니다. “제가 가서 당신을 위해 히브리 여자들 가운데 한 사람을 불러, 그 아이를 기르고 젖을 먹이게 할까요?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመ፡ ያምጽአከ፡ ወአምጽአከ፡ ኀቤሃ።
  english_pob_choice: '...to bring you, and he brought you to her.'
  chosen_korean: “그가 당신을 데려오게 하였고, 그가 당신을 그녀에게 데려왔습니다”
  alternatives_korean:
  - “당신을 데려오도록 하였고, 그가 당신을 그녀에게 데려왔습니다”
  - “당신을 오게 하였고, 그가 당신을 그녀에게 데려왔습니다”
  lexicon: 데려오다
  rationale: 게에즈 본문은 ‘데려오게 하다/데려오다’의 연속 동작을 말하므로, 단순히 ‘오다’로 약화시키지 않고 이동의 방향성과 중개 동작을 살렸습니다.
- source_word: ወአውፅአተከ፡ እምሤፍቅ፡ ወመሐረተከ።
  english_pob_choice: And she took you out of the basket and had compassion on you.
  chosen_korean: “그녀가 당신을 바구니에서 꺼내어 당신에게 불쌍히 여기셨습니다”
  alternatives_korean:
  - “그녀가 당신을 바구니에서 꺼내어 당신을 불쌍히 여기셨습니다”
  - “그녀가 당신을 바구니에서 꺼내어 당신을 가엾게 여기셨습니다”
  lexicon: 불쌍히 여기다
  rationale: 게에즈 동사의 핵심은 긍휼/연민의 동정 행위이므로, 정서적 의미가 분명한 ‘불쌍히 여기다’로 옮겼습니다.
- source_word: እኅትከ፡ እሖርኑ፡ ወእጸውዕ፡ ለኪ፡ አሐተ፡ እምነ፡ ዕብራዊያት፡
  english_pob_choice: And your sister said to her, “Shall I go and call for you one of the Hebrew women
  chosen_korean: “그러자 당신의 누이가 그 여자에게 말했습니다. ‘가서, 당신을 위해 히브리 여자들 가운데 한 사람을 불러다가’”
  alternatives_korean:
  - “그리고 당신의 누이가 그 여자에게 말했습니다. ‘제가 가서 히브리 여자들 가운데 한 사람을 당신을 위해 불러오겠습니다’”
  - “당신의 누이가 그 여자에게 말했습니다. ‘제가 가서 히브리 여자 한 사람을 당신을 위해 부를까요’”
  lexicon: 누이 / 히브리 여자들
  rationale: ‘누이’는 친족 관계를 분명히 드러내며, 복수형 ‘히브리 여자들 가운데 한 사람’은 원문의 선택 범위를 유지합니다.
- source_word: እንተ፡ ታሐፅኖ፡ ወታጠብዎ፡
  english_pob_choice: who will rear him and nurse him
  chosen_korean: “그가 그를 길러 주고 젖을 먹이게 할까요?”
  alternatives_korean:
  - “그가 그를 길러 주고 먹이게 할까요?”
  - “그가 그를 양육하고 젖을 먹이게 할까요?”
  lexicon: 길러 주다 / 젖을 먹이다
  rationale: 게에즈의 두 동사는 ‘기르다/양육하다’와 ‘젖을 먹이다/젖먹이다’의 이중 의미를 가지므로 둘 다 살려, 영어 주석 개정에서 회복된 의미를 반영했습니다.
theological_decisions:
- issue: 마지막 동사의 의미 범위
  chosen_reading: ‘젖을 먹이다’로 번역해 단순한 돌봄이 아니라 수유 행위를 포함하는 뜻을 드러냈습니다.
  alternative_readings:
  - ‘기르다만으로 묶어 일반 양육으로 처리한다’
  - ‘먹이다’처럼 일반적 표현으로 완화한다
  rationale: 게에즈 본문과 영어 수정 이력 모두 해당 동사가 ‘nurse’가 아니라 ‘suckle/nurse’의 의미를 지닌다고 보므로, 본문이 지닌 구체성을 보존했습니다.
  doctrine_reference: source_precision
