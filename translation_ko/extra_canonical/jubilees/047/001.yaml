  text: And in the seventh week, in the seventh year, in the forty-seventh jubilee, your father came from the land of Canaan, and you were born in the fourth week, in the sixth year, in the forty-eighth jubilee.
  footnotes:
  - marker: a
    text: Or 'in the seventh week of the seventh year'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 일곱 번째 주간, 일곱 번째 해, 마흔일곱 번째 희년에는 네 아버지가 가나안 땅에서 오셨고, 너는 네 번째 주간, 여섯 번째 해, 마흔여덟 번째 희년에 태어났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበሱባዔ፡ ሳብዕ፡ ዘሳብዕ፡ ዓመት፡
  english_pob_choice: in the seventh week, in the seventh year
  chosen_korean: 일곱 번째 주간, 일곱 번째 해
  alternatives_korean:
  - 일곱째 주, 일곱째 해
  - 일곱 번째 주간, 일곱째 해
  lexicon: 주간
  rationale: 에티오피아어의 주간-연대 체계는 7일 주가 아니라 7년 단위의 ‘주간’을 가리키므로, 영어 POB의 수정된 해석을 따라 ‘주간’과 ‘해’를 분리해 옮겼습니다.
- source_word: ወሰብዓቱ፡ ኢዮቤልዉ፡
  english_pob_choice: in the forty-seventh jubilee
  chosen_korean: 마흔일곱 번째 희년
  alternatives_korean:
  - 제47희년
  - 마흔일곱째 희년
  lexicon: 희년
  rationale: 유빌레오스의 연대 단위를 한국어로는 종교적 전통어 ‘희년’으로 옮기되, 수사는 서수 형태로 명확하게 유지했습니다.
- source_word: አቡከ፡ እምድረ፡ ከናአን፡
  english_pob_choice: your father came from the land of Canaan
  chosen_korean: 네 아버지가 가나안 땅에서 오셨고
  alternatives_korean:
  - 네 아버지가 가나안 땅에서 오셨고
  - 네 아버지가 가나안 땅에서 왔고
  lexicon: 가나안
  rationale: 동사의 방향성을 살려 ‘오셨고’로 옮겨 서술 흐름을 유지했으며, ‘from the land of Canaan’의 출발점을 자연스럽게 반영했습니다.
- source_word: በራብዕ፡ ሱባዔ፡ በሳድስ፡ ዓመት፡ በዘአርብዓ፡ ወስመንቱ፡
  english_pob_choice: in the fourth week, in the sixth year, in the forty-eighth jubilee
  chosen_korean: 네 번째 주간, 여섯 번째 해, 마흔여덟 번째 희년
  alternatives_korean:
  - 네 번째 주간, 여섯째 해, 마흔여덟 번째 희년
  - 넷째 주간, 여섯 번째 해, 제48희년
  lexicon: 주간
  rationale: 앞 절과 동일한 연대 공식이 반복되므로 용어를 일관되게 맞추어, 독자가 두 날짜 표현의 병렬 구조를 즉시 인지하도록 했습니다.
theological_decisions:
- issue: Jubilees의 연대 표현을 현대 한국어에서 어떻게 읽기 쉽게 유지할지
  chosen_reading: 희년-주간-해의 계층 구조를 그대로 보존해, 본문의 계산 체계가 흐트러지지 않도록 했습니다.
  alternative_readings:
  - 일반적인 달력식 표현으로 풀어 옮기기
  - 주간을 생략하고 연도만 제시하기
  rationale: 이 본문은 역사 서술이라기보다 연대 표식 자체가 의미이므로, 독자가 유빌리서의 시간 계산 구조를 오해하지 않게 하는 것이 중요합니다.
  doctrine_reference: 성경 본문 이해를 위한 서사·연대 구조 보존
- issue: ‘your father’의 지시 대상과 수신자 호칭
  chosen_reading: 직접 수신자에게 말하는 2인칭을 유지해 ‘네 아버지’로 옮겼습니다.
  alternative_readings:
  - 당신의 아버지
  - 그대의 아버지
  rationale: 원문의 직접 خطاب을 살리되, 현대 한국어의 자연스러운 서술체와 합쇼체를 동시에 유지하기 위한 선택입니다.
  doctrine_reference: 문맥상 직접 خطاب 보존
