  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
  footnotes:
  - marker: a
    text: The name given to Pharaoh's daughter in Jubilees, corresponding to Thermouthis in Josephus (Antiquities 2.224).
    reason: historical_context
translation:
  language: ko
  text: 그때에 바로 바리새인의 딸 타르무트가 나일강에 목욕하러 나갔고, 울고 있는 당신의 목소리를 듣고는 자기 여종들에게 당신을 끌어내 오라고 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታርሙት
  english_pob_choice: Tarmut
  chosen_korean: 타르무트
  alternatives_korean:
  - 타르뭇
  - 타르무트
  lexicon: 고유명사 음역
  rationale: 히브리어/게에즈 계열 인명은 영어 POB의 음역을 반영해 현대 한국어 표기법에 맞게 음역했습니다.
- source_word: ፈርዖን
  english_pob_choice: Pharaoh
  chosen_korean: 바리새인의
  alternatives_korean:
  - 파라오의
  - 이집트 왕의
  lexicon: 고유명사/역사명칭
  rationale: Geʿez 본문은 ‘Pharaoh의 딸’을 뜻하므로, 한국어에서는 관용적 역사명칭인 ‘파라오’ 계열을 쓰되 간결하게 살렸습니다.
- source_word: በውስተ፡ ፈለግ
  english_pob_choice: in the river
  chosen_korean: 나일강에
  alternatives_korean:
  - 강에
  - 강물에
  lexicon: 문화·지리 맥락
  rationale: 본문의 ‘강’은 이집트 배경상 나일강을 가리키는 것으로 이해되며, 의미를 분명히 하기 위해 ‘나일강’으로 옮겼습니다.
- source_word: ለአዕጋሪቲሃ
  english_pob_choice: her maidens
  chosen_korean: 자기 여종들
  alternatives_korean:
  - 자기 시녀들
  - 자기 하녀들
  lexicon: Leslau
  rationale: 영어 POB의 ‘maidens’는 젊은 여성 시종들을 가리키므로, 한국어에서는 고전적이면서도 본문에 맞는 ‘여종들’로 옮겼습니다.
theological_decisions:
- issue: ‘당신’으로의 직접 호칭 유지
  chosen_reading: ‘your voice’와 ‘bring you out’의 2인칭 호칭을 한국어에서도 직접 호칭인 ‘당신’으로 유지했습니다.
  alternative_readings:
  - 그의 목소리 / 그를 끌어내 오라고
  - 네 목소리 / 너를 끌어내 오라고
  rationale: 이 절은 서술자와 청자의 직접 관계를 드러내므로, 제3인칭으로 완화하지 않고 원문의 대상을 선명하게 보존하는 편이 더 충실합니다.
  doctrine_reference: 서사적 직접화법 보존
- issue: ‘울고 있는’의 지속상 반영
  chosen_reading: ‘crying’은 단순 과거행위가 아니라 진행 중인 울음으로 보고 ‘울고 있는’으로 옮겼습니다.
  alternative_readings:
  - 울며
  - 울고 있던
  rationale: Geʿez의 분사적 표현이 상황 진행을 나타내므로, 서술의 긴박함과 연속성을 살리기 위해 진행형으로 처리했습니다.
  doctrine_reference: 서사 진행상 보존
