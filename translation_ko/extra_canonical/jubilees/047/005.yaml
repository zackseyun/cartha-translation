  source_fidelity: 현 번역의 ‘바로 바리새인의 딸’은 게에즈어 ፈርዖን(파라오)를 ‘바리새인’으로 잘못 옮긴 중대한 오류입니다. 또한 ፈለግ은 일반적으로 ‘강’이며, 본문 자체가 나일강이라고 특정하지 않습니다. ‘끌어내 오라’도 ‘데리고 나오라’보다 강제성을 더하므로 완화하는 것이 적절합니다.
  naturalness: ‘당신의 목소리’보다는 원문의 ‘네가 울고 있는 가운데 들린 네 소리’를 자연스럽게 드러내는 ‘당신이 우는 소리’가 현대 한국어에서 더 자연스럽습니다. ‘시녀들’은 왕녀의 여성 수행원을 가리키기에 적합한 격식 있는 표현입니다.
  terminology: ፈርዖን은 ‘파라오’로, ታርሙት은 영어 POB 및 게에즈 표기를 따라 ‘타르무트’로 옮깁니다. አዕጋሪቲሃ는 복수의 여성 시종이므로 ‘자기 시녀들에게’로 번역합니다.
