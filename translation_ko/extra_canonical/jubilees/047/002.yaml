base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/002.yaml
  text: That was a time of affliction upon the children of Israel, and Pharaoh, king of Egypt, commanded concerning them that they should throw all their children, every male that was born, into the river.
translation:
  language: ko
  text: 그것은 이스라엘 자손에게 고난의 때였습니다. 이집트 왕 파라오는 그들에 관하여 명령을 내려, 그들의 자녀들, 곧 태어난 모든 남자아이를 강에 던지게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ምንዳቤ፡
  english_pob_choice: a time of affliction
  chosen_korean: 고난의 때
  alternatives_korean:
  - 고통의 때
  - 환난의 때
  lexicon: Geez መዋዕለ / ምንዳቤ
  rationale: 시간의 표현과 ‘affliction’의 고통성을 함께 살려, 단순한 사건 서술이 아니라 이스라엘이 겪은 압박의 국면임을 드러냈습니다.
- source_word: ውሉደ፡ እስራኤል
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 사람들
  lexicon: Geez ውሉድ
  rationale: 성경적 집단 호칭의 관용을 살리되, ‘자손’이 원문의 집합적 의미를 가장 안정적으로 전달합니다.
- source_word: ውሉዶሙ
  english_pob_choice: their children
  chosen_korean: 아들, 곧 태어나는 모든 남자아이
  alternatives_korean:
  - 자녀
  - 아이들
  - 남자 자녀
  lexicon: Geez ውሉዶሙ
  rationale: 앞부분의 ‘children’과 뒤의 ‘every male that was born’가 함께 있어, 일반적 ‘자녀’와 성별 제한을 모두 반영하도록 ‘아들’과 설명절을 병기했습니다.
- source_word: ኵሎ፡ ርሰ፡ ዘተወልደ፡
  english_pob_choice: every male that was born
  chosen_korean: 태어난 모든 남자아이
  alternatives_korean:
  - 태어난 모든 남자
  - 출생한 모든 남자아이
  lexicon: Geez ርስ / ዘተወልደ
  rationale: 출생 직후의 유아 살해 명령이라는 문맥을 고려해, 현대 한국어에서 자연스럽고 명확한 ‘남자아이’로 옮겼습니다.
- source_word: ወፈለግ
  english_pob_choice: into the river
  chosen_korean: 강물에
  alternatives_korean:
  - 나일강에
  - 강에
  lexicon: Geez ፈለግ
  rationale: 원문은 일반적으로 ‘강’을 뜻하지만, 한국어에서는 유기 대상과의 결합이 자연스러운 ‘강물에’로 옮겨 물리적 투입감을 살렸습니다.
theological_decisions:
- issue: 파라오의 호칭 순서
  chosen_reading: ‘이집트의 왕 파라오’
  alternative_readings:
  - ‘파라오, 이집트의 왕’
  - ‘이집트 왕 파라오’
  rationale: 원문과 영어 POB가 결합한 동격 관계를 유지하면서도, 한국어에서는 ‘이집트의 왕 파라오’가 가장 자연스럽고 정보 순서도 분명합니다.
  doctrine_reference: 명칭·동격 표현의 자연스러운 한국어화
- issue: ‘children’와 ‘every male’의 동시 보존
  chosen_reading: ‘아들, 곧 태어나는 모든 남자아이’
  alternative_readings:
  - ‘모든 자녀, 곧 태어난 모든 남자아이’
  - ‘모든 아들, 태어난 남자아이들’
  rationale: 원문은 집단 전체(자녀)와 성별 제한(남자)을 함께 말하므로, 한쪽만 선택하면 의미가 줄어듭니다. 설명절로 두 층위를 모두 보존했습니다.
  doctrine_reference: 본문 의미 보존과 과잉 일반화 방지
