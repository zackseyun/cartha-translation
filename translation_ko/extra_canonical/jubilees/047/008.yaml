theological_decisions:
- issue: 직접화법의 높임말과 서술문 어조
  chosen_reading: 서술은 합쇼체로 유지하고, 명령은 「가십시오」로 처리했습니다.
  alternative_readings:
  - 모두 평서형으로 통일
  - 직접화법도 반말형으로 처리
  rationale: 인물 간 발화의 짧은 명령을 한국어에서 자연스럽게 살리면서도, 본문 전체의 현대적 공손 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 번역 문체 일관성과 대화체 재현
- issue: ‘gave you to her’의 관계성
  chosen_reading: 물건 전달보다 사람의 인계에 가까운 표현으로 옮겼습니다.
  alternative_readings:
  - 주었습니다
  - 맡겼습니다
  rationale: 본문의 행동은 단순 소유 이전이 아니라 특정 인물에게의 인계이므로, 한국어에서 그 뉘앙스를 드러내는 표현을 선택했습니다.
  doctrine_reference: 서사 맥락의 정확한 재현
