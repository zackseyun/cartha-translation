review_pass:
  verdict: revise
  source_fidelity: 첫 발화의 수혜자는 여성 단수(‘그녀에게’)인데 초안은 ‘그에게’로 옮겼습니다. 마지막 ‘그녀에게’도 초안에서는 ‘그에게’가 되어 성별 지시가 바뀌었습니다. 또한 ወወሀበታ는 기본적으로 ‘그녀에게 주었다’이므로, 별도 해석을 더하는 ‘넘겨주었다’보다 ‘주었습니다’가 안전합니다.
  naturalness: 합쇼체 서술은 자연스럽게 유지할 수 있습니다. 직접화법은 짧은 명령으로 ‘가거라’가 자연스럽고, 원문의 명령 자체에 없는 공손도 등급을 부가하지 않습니다.
  terminology: ‘요게벳’은 Jochebed의 통용 한국어 성경 표기이며 적절합니다. 제공되지 않은 각주에 연결되는 [a][b] 표지는 삭제해야 합니다.
