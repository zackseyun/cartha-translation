revisions:
- from: 그리고 그녀가 그에게 말했습니다. 「가십시오.」 그러고 나서 그녀는 가서 당신의 어머니 요게벳을 불러와 그에게 당신을 넘겨주었습니다.[a][b]
  to: 그리고 그녀가 그녀에게 말했습니다. “가거라.” 그러자 그녀는 가서 당신의 어머니 요게벳을 불러왔고, 그녀에게 당신을 주었습니다.
  rationale: 여성 단수 지시를 일관되게 복원하고, 마지막 동사를 원문의 기본 의미에 맞춰 중립적으로 옮겼습니다. 서술은 현대 합쇼체로 유지하되, 직접화법은 짧은 명령문의 자연스러운 형태로 처리했습니다. 근거 없는 각주 표지도 제거했습니다.
