base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/010.yaml
  text: And on the day of turmoil and cursing and fury and wrath[10], and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse[10], so that for all days their judgment may be renewed with execration and with cursing and with wrath and with torment and with fury and with plagues and with everlasting disease.
  footnotes:
  - marker: '10'
    text: The clause 'he will be erased from the book of the discipline of the children of men' is textually difficult. The Ge'ez appears to distinguish this record from 'the book of life'; the exact nuance of the first book is uncertain.
    reason: textual_variant
  - marker: '10'
    text: The final sequence piles up near-synonymous curse terms. The translation preserves the accumulation rather than compressing it, because the rhetoric is part of the warning.
    reason: segmentation_note
  - marker: a
    text: Or 'they may denounce him with cursing and with execration'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 혼란과 저주와 격분과 진노의 날에, 불타며 삼키는 불로 — 소돔을 태우신 것처럼 — 그의 땅과 그의 도시와 그에게 속한 모든 것을 태우실 것입니다. 그는 인류의 아들들의 징계의 책[a]에서 지워질 것이며, 생명의 책으로 올라가지 못하고 파멸로 정해진 곳으로 들어갈 것이며, 영원한 저주를 받게 될 것입니다[b]. 그러므로 모든 날마다 그들의 심판은 징벌과 저주와 진노와 고통과 격분과 재앙과 영원한 질병으로 새롭게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕለተ፡ ሁከት፡ ወመርገም፡ ወቍጥዓ፡ ወመዓት
  english_pob_choice: day of turmoil and cursing and fury and wrath
  chosen_korean: 혼란과 저주와 격분과 진노의 날
  alternatives_korean:
  - 환난과 저주와 분노와 진노의 날
  - 소동과 저주와 격노와 진노의 날
  lexicon: 혼란 / 저주 / 격분 / 진노
  rationale: 게으즈어의 연쇄 명사를 그대로 살려 첫머리의 긴박한 심판일 이미지를 보존했습니다. መዓት은 단순한 ‘분노’보다 더 강한 ‘진노’로, ቍጥዓ는 ‘격분’으로 옮겨 인접어의 차이를 드러냈습니다.
- source_word: በእሳት፡ ... በላዒ፡
  english_pob_choice: with blazing, devouring fire
  chosen_korean: 불타며 삼키는 불
  alternatives_korean:
  - 활활 타오르며 삼키는 불
  - 타올라 삼키는 불
  lexicon: 불
  rationale: 두 형용사를 한국어 동사구로 풀어 ‘타는 것’과 ‘삼키는 것’을 함께 보이게 했습니다. 문체는 현대적이되 원문의 파괴적 이미지를 약화하지 않도록 했습니다.
- source_word: ይደመሰስ፡ እመጽሐፈ፡ *ተግሣጸ፡ ውሉደ፡ ሰብእ፡ ወአየዐርግ፡ ውስተ፡ መጽሐፈ፡ ሕይወት፡
  english_pob_choice: he will be blotted out from the book of the discipline of the children of men, and he will not ascend into the book of life
  chosen_korean: 그는 인류의 아들들의 징계의 책에서 지워질 것이며, 생명의 책으로 올라가지 못하고
  alternatives_korean:
  - 그는 사람들의 훈계의 책에서 지워질 것이며, 생명책으로 올라가지 못하고
  - 그는 인류 자손들의 교정의 책에서 지워질 것이며, 생명의 책으로 올라가지 못하고
  lexicon: 징계의 책 / 생명의 책
  rationale: 게으즈어의 ‘책’ 대조를 유지하면서 첫 책의 의미 불확실성을 반영해 ‘징계’로 보수적으로 옮겼습니다. POB의 텍스트 난해성 주석과 맞춰 ‘지워질’과 ‘올라가지 못하고’를 병렬로 살렸습니다.
- source_word: ለ*መርገም፡ ዘለዓለም፡
  english_pob_choice: the eternal curse
  chosen_korean: 영원한 저주
  alternatives_korean:
  - 영구한 저주
  - 끝없는 저주
  lexicon: 저주
  rationale: 다른 본문에서 자주 쓰이는 ‘저주’를 유지하되, ዘለዓለም의 지속성을 ‘영원한’으로 직역했습니다. POB의 누적 저주 어휘도 그대로 반복되게 했습니다.
theological_decisions:
