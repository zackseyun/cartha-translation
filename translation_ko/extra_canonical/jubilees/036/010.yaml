  rationale: 이 절은 경고의 수사 자체가 의미이므로, 동의어를 한 항목으로 뭉개면 원문의 압박감이 줄어듭니다. 따라서 반복과 병렬을 유지했습니다.
  doctrine_reference: 경고문학의 수사 보존
