  naturalness: ‘이것을 내가 너희에게 명령합니다, 내 아들들아’는 어순과 호격 연결이 다소 부자연스럽고, 마지막의 ‘이루게 하십시오’는 현대 표준 한국어에서 문법적으로도 문맥상으로도 부적절합니다. 문장을 나누고 목적 관계를 ‘그리하여 … 이루어 주시도록 하십시오’로 표현하면 합쇼체의 직접적 권면과 원문의 목적 관계를 자연스럽게 유지합니다.
