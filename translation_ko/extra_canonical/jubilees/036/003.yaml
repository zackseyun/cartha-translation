  text: 'And this I command you, my sons: do righteousness and uprightness on the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.'
translation:
  language: ko
  text: “이것을 내가 너희에게 명령합니다, 내 아들들아. 땅에서 의와 올바름을 행하여, 야훼께서 아브라함과 그의 씨에게 말씀하신 모든 것을 너희에게 이루게 하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኤዝዘክሙ
  english_pob_choice: I command you
  chosen_korean: “내가 너희에게 명령합니다”
  alternatives_korean:
  - 내가 너희에게 명합니다
  - 내가 너희에게 지시합니다
  lexicon: 명령하다
  rationale: 원문은 화자가 자녀들에게 직접 명령하는 문맥이므로, 권위와 직접성을 살려 ‘명령합니다’로 옮겼습니다.
- source_word: ጽድቀ፡ ወርትዐ፡
  english_pob_choice: righteousness and uprightness
  chosen_korean: “의와 올바름”
  alternatives_korean:
  - 의와 정직
  - 의와 공정함
  lexicon: 의 / 올바름
  rationale: 첫 항은 윤리적·언약적 ‘의’를, 둘째는 ‘uprightness’의 직선적·정직한 삶을 살려 ‘올바름’으로 구분했습니다.
- source_word: በዲበ፡ ምድር፡
  english_pob_choice: on the earth
  chosen_korean: “땅에서”
  alternatives_korean:
  - 땅 위에서
  - 이 땅에서
  lexicon: 땅
  rationale: Geʽez의 전치사구는 장소적 범위를 나타내므로, 자연스러운 한국어로 ‘땅에서’라고 옮겼습니다.
- source_word: እግዚአብሔር፡
  english_pob_choice: the LORD
  chosen_korean: “야훼”
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: 야훼
  rationale: POB 기본 원칙에 따라 신명 표기는 학술적 음역인 ‘야훼’를 사용했습니다.
- source_word: ኵሎ፡ ዘመጠነ፡ ነገረ፡
  english_pob_choice: all that the LORD said
  chosen_korean: “야훼께서 말씀하신 모든 것”
  alternatives_korean:
  - 야훼께서 말한 모든 것
  - 주께서 말씀하신 모든 것
  lexicon: 말씀하시다
  rationale: ‘말하다’의 일반적 서술보다, 언약 약속을 가리키는 신적 발화로서 ‘말씀하셨다’가 더 정확합니다.
theological_decisions:
- issue: 아브라함과 그의 씨에게 주어진 약속의 성격
  chosen_reading: 본문은 순종(의와 올바름)과 아브라함 언약의 성취를 직접 연결합니다.
  alternative_readings:
  - 단순한 윤리 권면으로만 읽는 해석
  - 보편적 도덕 원리로만 읽는 해석
  rationale: 원문은 윤리 명령의 결과를 야훼의 언약적 행위와 연결하므로, 언약-성취 구조를 드러내는 번역이 필요합니다.
  doctrine_reference: 창 17:7-8; 창 18:19; 신 7:9
