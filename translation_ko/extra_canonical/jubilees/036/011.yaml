translation:
  language: ko
  text: 나는 너희에게, 내 아들들아, 자기 형제에게 악을 행하려는 사람에게 임할 심판에 따라 선언하고 증언합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነ፡ አነግር፡ ወአስምዕ፡
  english_pob_choice: I declare and testify
  chosen_korean: 선언하고 증언합니다
  alternatives_korean:
  - 알려드립니다
  - 밝힙니다
  - 선언하고 알려드립니다
  lexicon: declare / testify
  rationale: 게에즈 원문의 병렬 동사와 영어 POB의 수정 이력을 따라, 단순한 ‘알림’보다 증언적·공적 성격이 드러나는 ‘증언합니다’를 유지했습니다.
- source_word: በከመ፡ ኵነኔ፡
  english_pob_choice: according to the judgment
  chosen_korean: 심판에 따라
  alternatives_korean:
  - 심판대로
  - 심판에 맞추어
  - 그 심판에 따라
  lexicon: judgment
  rationale: 전치사구 በከመ는 단순 대상이 아니라 준거/기준을 나타내므로, 관계를 분명히 하는 ‘-에 따라’로 옮겼습니다.
- source_word: ዘይፈቅድ፡ ይግበር፡ ሕሡመ፡
  english_pob_choice: who desires to do evil
  chosen_korean: 악을 행하려는
  alternatives_korean:
  - 악행하기를 원하는
  - 악을 하려는
  - 해를 끼치려는
  lexicon: do evil
  rationale: 게에즈의 ‘행하다’(ይግበር)와 ‘악한 것’(ሕሡመ)을 살려, 도덕적 범주가 분명한 ‘악을 행하다’로 옮겼습니다.
- source_word: ላዕለ፡ እኁሁ
  english_pob_choice: against his brother
  chosen_korean: 자기 형제에게
  alternatives_korean:
  - 그의 형제에게
  - 형제에 대하여
  - 형제에게 대하여
  lexicon: brother
  rationale: 대상 표지를 자연스러운 한국어로 처리하되, 관계의 방향성을 유지하기 위해 ‘에게’로 옮겼습니다.
theological_decisions:
- issue: 형제에게 향한 악의 범위를 어떻게 드러낼지
  chosen_reading: ‘악을 행하려는 사람’으로 옮겨 내적 의도까지 포함해 표현했습니다.
  alternative_readings:
  - ‘형제에게 해를 끼치려는 사람’
  - ‘형제에게 악을 저지르려는 사람’
  rationale: 원문은 단순한 결과보다 의도와 행위를 함께 가리키므로, 한국어에서도 죄의 의도성을 살리는 표현이 필요합니다.
  doctrine_reference: 윤리적 책임과 의도성에 관한 성서적 죄 이해
- issue: ‘증언’과 ‘선언’의 병렬성 유지
  chosen_reading: 두 동사를 모두 살려 공적·법정적 어조를 유지했습니다.
  alternative_readings:
  - ‘알려드립니다’로 단순화
  - ‘말합니다’로 완화
  rationale: 영어 POB의 개정 이력과 게에즈 원문의 병렬 구조를 따라, 법정적/증언적 무게를 약화시키지 않았습니다.
  doctrine_reference: 언약적 증언과 경고의 문맥
