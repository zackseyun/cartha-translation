  text: And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.”
translation:
  language: ko
  text: 그리고 이 주의 여섯째 해에 이삭이 그의 두 아들 에서와 야곱을 불렀고, 그들이 그에게 왔습니다. 그가 그들에게 말했습니다. “내 아들들아, 나는 내 조상들의 길로 가고 있습니다. 내 조상들이 있는 영원한 집으로 말입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበሳድስ፡ ዓመት፡ ዘዝሱባዔ፡
  english_pob_choice: in the sixth year of this week
  chosen_korean: 이 주의 여섯째 해에
  alternatives_korean:
  - 이번 주의 여섯째 해에
  - 이 주간의 여섯째 해에
  lexicon: source-note
  rationale: 여기서 'week'는 창세기적/희년 문맥의 주간 단위로, 영어 POB의 'this week'를 따라 시간 단위로 옮겼습니다.
- source_word: ጸውዐ፡
  english_pob_choice: called
  chosen_korean: 불렀고
  alternatives_korean:
  - 호출했고
  - 불러
  lexicon: source-note
  rationale: 가족을 소환하는 일반적 의미이므로 자연스러운 한국어 동사 '부르다'를 사용했습니다.
- source_word: ውስተ፡ ፍኖተ፡ አበውየ፡
  english_pob_choice: the way of my fathers
  chosen_korean: 내 조상들의 길로
  alternatives_korean:
  - 내 아버지들의 길로
  - 조상들의 길을 따라
  lexicon: source-note
  rationale: 직역하면 '아버지들'이지만 문맥상 조상 계열 전체를 가리키므로 한국어에서는 '조상들의 길'이 가장 자연스럽습니다.
- source_word: ውስተ፡ ቤት፡ ዘለዓለም፡
  english_pob_choice: the eternal house
  chosen_korean: 영원한 집
  alternatives_korean:
  - 영원한 집
  - 영원한 처소
  lexicon: source-note
  rationale: 지상적 '집'보다 사후 거처를 가리키는 표현이므로, 영어 POB의 직역을 유지해 '영원한 집'으로 옮겼습니다.
theological_decisions:
- issue: 죽음의 완곡어법과 사후 거처 표현
  chosen_reading: “내 조상들의 길로 가고 있습니다. 내 조상들이 있는 영원한 집으로 말입니다.”
  alternative_readings:
  - “죽으러 가고 있습니다”
  - “조상들의 묘로 갑니다”
  rationale: 본문은 직접적으로 '죽다'를 말하기보다 조상들의 길과 영원한 집을 병치하여 죽음과 사후 거처를 암시하므로, 그 긴장을 보존했습니다.
  doctrine_reference: Jubilees의 사후 이해와 족장 전승의 표현 방식
