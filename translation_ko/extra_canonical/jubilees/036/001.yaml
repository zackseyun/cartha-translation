revisions:
- from: 그리고 이 주의 여섯째 해에 이삭이 그의 두 아들 에서와 야곱을 불렀고, 그들이 그에게 왔습니다. 그가 그들에게 말했습니다. “내 아들들아, 나는 내 조상들의 길로 가고 있습니다. 내 조상들이 있는 영원한 집으로 말입니다.”
  to: 이 주의 여섯째 해에 이삭이 그의 두 아들 에서와 야곱을 불렀고, 그들이 그에게 왔습니다. 그가 그들에게 말했습니다. “내 아들들아, 나는 내 조상들의 길을 따라 내 조상들이 있는 영원한 집으로 가고 있습니다.”
  rationale: 문두의 ‘그리고’와 마지막의 ‘말입니다’를 제거하고, 원문의 ‘조상들의 길’과 ‘조상들이 있는 영원한 집’을 하나의 연속된 이동 표현으로 정리했습니다. 사후 상태에 관한 해석을 덧붙이지 않고 원문의 완곡성과 표현상의 긴장을 유지했습니다.
