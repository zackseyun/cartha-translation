  text: And Esau said, “I sold it to Jacob, and I gave the birthright to Jacob; let it be given to him, and I have no word to say about it, for it is his."”
  footnotes:
  - marker: a
    text: Or 'and I have nothing.'.
    reason: previous_rendering
translation:
  language: ko
  text: 에서는 “나는 그것을 야곱에게 팔았고, 장자권을 야곱에게 주었습니다. 그것을 그에게 주십시오. 나는 그것에 대하여 할 말이 없습니다. 그것은 그의 것이기 때문입니다.”라고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዔሳው
  english_pob_choice: Esau
  chosen_korean: 에서
  alternatives_korean:
  - 에서
  lexicon: 고유명사 표기
  rationale: 한국어 성경에서 통용되는 인명 표기를 따랐습니다.
- source_word: ሤጥኩ፡ ሎቱ፡ ለያዕቆብ፡
  english_pob_choice: I sold it to Jacob
  chosen_korean: 나는 그것을 야곱에게 팔았고
  alternatives_korean:
  - 나는 그것을 야곱에게 팔았습니다
  - 내가 그것을 야곱에게 팔았고
  lexicon: 동사/대명사 처리
  rationale: Ge'ez의 1인칭 완료형을 자연스러운 한국어 평서로 옮기되, 원문에 있는 목적어를 보존했습니다.
- source_word: ወወሀብኩ፡ ልህቃነ፡ ለያዕቆብ፡
  english_pob_choice: and I gave the birthright to Jacob
  chosen_korean: 내 장자권도 야곱에게 주었습니다
  alternatives_korean:
  - 그리고 나는 장자권을 야곱에게 주었습니다
  - 그리고 내 장자권을 야곱에게 주었습니다
  lexicon: 명사구/소유 처리
  rationale: 문맥상 ‘장자권’이 핵심이며, Ge'ez의 표현을 따라 소유격을 자연스럽게 한국어로 풀어 옮겼습니다.
- source_word: ወአልቦየ፡ ቃለ፡ ዘእብል፡ በእንቲአሁ፡
  english_pob_choice: and I have no word to say about it
  chosen_korean: 그리고 나는 그에 대해 말할 것이 없습니다
  alternatives_korean:
  - 그리고 나는 그것에 대해 할 말이 없습니다
  - 그리고 나는 그에 관해 말할 말이 없습니다
  lexicon: 관용 표현
  rationale: ‘말할 말이 없다’는 Ge'ez의 ‘word to say’에 가장 가까우면서도 한국어로 자연스러운 표현입니다.
- source_word: እስመ፡ ዚአሁ፡ ውእቱ።
  english_pob_choice: for it is his
  chosen_korean: 그것은 그의 것이기 때문입니다
  alternatives_korean:
  - 왜냐하면 그것은 그의 것이기 때문입니다
  - 그것은 그에게 속한 것이기 때문입니다
  lexicon: 소유/이유 절
  rationale: 원문의 소유 진술을 그대로 유지하되, 합쇼체 문장 흐름에 맞게 이유절로 매끄럽게 처리했습니다.
theological_decisions:
- issue: 장자권(birthright)의 소유 확정과 발화의 종결
  chosen_reading: 에서의 발언은 장자권을 야곱에게 양도한 사실을 재확인하고 더 이상의 이의를 제기하지 않는 선언으로 옮겼습니다.
  alternative_readings:
  - 단순한 과거 설명
  - 권리 포기의 감정적 진술
  rationale: 문맥상 법적·가족적 권리의 이전을 분명히 말하는 장면이므로, 해석을 과도하게 약화하지 않고 전달했습니다.
  doctrine_reference: 본문 문맥 해석
