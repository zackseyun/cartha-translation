translation:
  language: ko
  text: 에서는 말하기를, 「나는 그것을 야곱에게 팔았고, 내 장자권도 야곱에게 주었습니다. 그것을 그에게 주게 하십시오. 그리고 나는 그에 대해 말할 것이 없습니다. 그것은 그의 것이기 때문입니다」라고 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
