  source_fidelity: 주어가 명시된 2인칭 능동 부정(‘당신이 … 폭력을 저지르지 않았다’)은 유지해야 합니다. 초안의 이 부분은 방향상 맞지만, ‘폭력을 행하다’는 한국어 결합이 부자연스럽고, 원문의 인과적 연결을 더 자연스럽게 드러낼 수 있습니다. 마지막 축복은 문맥상 수혜자를 포함한 ‘주께서 당신에게 복을 주시기를 바랍니다’로 옮기는 것이 적절합니다.
  naturalness: ‘기뻐하였나니’와 ‘폭력을 행하지 않았기 때문입니다’는 현대 합쇼체로 다소 문어적이거나 어색합니다. ‘기뻐하였습니다’와 ‘폭력을 저지르지 않았기 때문에’가 자연스럽습니다.
  terminology: ‘장자권’과 신칭 ‘주’는 적절합니다. ‘복을 주시기를 바랍니다’도 축원문으로 자연스럽습니다.
