translation:
  language: ko
  text: 내 마음은 장자권에 관하여, 당신이 그것을 두고 폭력을 저지르지 않았기 때문에 기뻐하였습니다.[a] 주께서 당신에게 복을 주시기를 바랍니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “장자권 때문에 폭력이 일어나지 않았기 때문에.”
    reason: 원문의 동사 구문은 2인칭 능동으로 읽히지만, 영어 POB 감사 이력에 보존된 비인칭·수동적 대안 독법도 함께 제시합니다.
  - marker: b
    text: 또는 “주께서 복을 주시기를 바랍니다.”
    reason: 축복의 수혜자 ‘당신에게’는 문맥상 명확하나, 축복문 자체만 옮기는 대안도 보존합니다.
lexical_decisions:
- source_word: ልብየ
  english_pob_choice: my heart has rejoiced
  chosen_korean: 내 마음이 기뻐하였나니
  alternatives_korean:
  - 내 마음이 즐거워하였나니
  - 내 마음이 기뻐했습니다
  lexicon: 마음
  rationale: Ge'ez의 ‘heart’는 감정의 중심을 가리키므로, 자연스러운 현대 한국어로 ‘마음’으로 옮기되, POB가 반영한 ‘rejoiced’의 뉘앙스를 살려 ‘기뻐하였나니’로 표현했습니다.
- source_word: ልህቃን
  english_pob_choice: the birthright
  chosen_korean: 장자권
  alternatives_korean:
  - 맏아들의 권리
  - 장자의 권리
  lexicon: 장자권
  rationale: 문맥상 야곱-에서 전승의 핵심 용어는 상속과 지위를 포함한 ‘birthright’이므로, 통용성과 의미를 함께 살릴 수 있는 ‘장자권’을 사용했습니다.
- source_word: ኢትግበር በእንቲአሃ ፁገ
  english_pob_choice: you did not do violence concerning it
  chosen_korean: 당신이 그것에 대하여 폭력을 행하지 않았기 때문입니다
  alternatives_korean:
  - 당신이 그것을 두고 폭력을 저지르지 않았기 때문입니다
  - 당신이 그것 때문에 해를 끼치지 않았기 때문입니다
  lexicon: 폭력을 행하다
  rationale: Ge'ez 동사는 수동이 아니라 2인칭 능동으로 읽혀야 하므로, 주체를 ‘당신’으로 드러내고 ‘폭력’을 직역에 가깝게 살렸습니다.
- source_word: ይባርከ፡ እግዚአብሔር፡
  english_pob_choice: May the LORD bless you
  chosen_korean: 주께서 당신에게 복을 주시기를 바랍니다
  alternatives_korean:
  - 주께서 당신을 복 주시기를 바랍니다
  - 주께서 당신에게 복 주시옵기를 바랍니다
  lexicon: 복을 주다
  rationale: 마지막 축복문은 명령보다 소망/축원에 가까우므로 ‘주시기를 바랍니다’로 부드럽게 옮겼고, POB의 문맥상 대상이 직접 지시되도록 ‘당신에게’를 보존했습니다.
theological_decisions:
- issue: יהוה/주권적 호칭의 한국어 표기
  chosen_reading: Ge'ez의 እግዚአብሔር은 한국어 본문에서 ‘주’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 구절은 히브리어 야훼 직음 표기가 아니라 에티오피아어 전승의 통상적 신칭이므로, 본문 가독성을 위해 ‘주’로 처리했습니다.
  doctrine_reference: 번역 관례와 본문 전승 구분
