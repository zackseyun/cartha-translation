  text: 내 아들들아, 너희끼리 서로 사랑하되, 자기 생명을 사랑하는 사람처럼 자기 형제를 사랑하고, 각각 자기 형제에게 그에게 좋은 것을 구하며, 땅에서 함께 행동하고, 서로를 자기 자신처럼 사랑하십시오.[a]
  philosophy: optimal-equivalence
