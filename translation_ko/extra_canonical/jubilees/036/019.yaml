  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዔሳው፡ ወያዕቆብ።
  english_pob_choice: Esau and Jacob.
  chosen_korean: 에서는과 야곱이었습니다.
  alternatives_korean:
  - 에서는과 야곱입니다.
  - 에서는과 야곱이었습니다
  lexicon: 고유명사
  rationale: 본문의 첫 구절은 서술 시작을 알리는 단문으로, 영어 POB의 추가된 opening words를 반영해 두 인물을 먼저 제시했습니다. 한국어에서는 연결 자연성을 위해 서술형으로 옮겼습니다.
- source_word: ወሖረ፡ ... ውስተ፡ ምድረ፡ ኤዶም፡
  english_pob_choice: went to the land of Edom
  chosen_korean: 에돔 땅으로 가서
  alternatives_korean:
  - 에돔의 땅으로 가서
  - 에돔 땅에 이르러
  lexicon: 지명
  rationale: ‘land of Edom’을 직역하되, 현대 한국어에서 자연스러운 소유격보다 ‘에돔 땅’ 구성을 택해 지명을 간결하게 살렸습니다.
- source_word: ውስተ፡ ደብረ፡ ሴር፡
  english_pob_choice: to Mount Seir
  chosen_korean: 곧 세일 산으로
  alternatives_korean:
  - 세일 산으로
  - 세일 산까지
  lexicon: 지명
  rationale: ‘Mount Seir’는 고유 지명으로 음역하되, 앞의 장소를 보충 설명하는 ‘곧’를 넣어 이동 방향을 한국어 문장 흐름에 맞췄습니다.
- source_word: ወነበረ፡ ህየ።
  english_pob_choice: and lived there.
  chosen_korean: 거기에 살았습니다.
  alternatives_korean:
  - 거기서 살았습니다.
  - 그곳에 거주했습니다.
  lexicon: 동사
  rationale: 지속적 거주를 뜻하는 표현을 자연스러운 서술체 ‘살았습니다’로 옮겨 원문의 단순하고 직접적인 서술을 유지했습니다.
theological_decisions:
- issue: opening phrase retained as a standalone clause
  chosen_reading: ‘에서는과 야곱이었습니다’로 시작해 앞선 내러티브의 인물 요약을 그대로 드러냈습니다.
  alternative_readings:
  - 해당 구를 생략하고 바로 이동 서술로 시작
  - ‘에서는와 야곱이 있었습니다’처럼 완전한 존재문으로 정리
  rationale: 영어 POB 개정본이 누락된 ‘Esau and Jacob’의 시작 구를 복원했으므로, 한국어도 이를 본문에 반영해 서술의 완결성을 보존했습니다.
  doctrine_reference: source_completeness
- issue: geographic specificity
  chosen_reading: 에돔 땅과 세일 산을 둘 다 유지해 지리적 이중 표지를 보존했습니다.
  alternative_readings:
  - 둘 중 하나만 선택해 단순화
  - 지명을 일반화해 ‘그 지역’으로 처리
  rationale: 원문은 장소를 두 단계로 구체화하므로, 한국어도 이를 축소하지 않고 그대로 살렸습니다.
  doctrine_reference: historical-geographical fidelity
