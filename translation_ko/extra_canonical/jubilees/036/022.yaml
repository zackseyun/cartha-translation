translation:
  language: ko
  text: 그의 아버지의 어머니인 사라의 무덤 왼쪽에[a] 있었습니다. 그리고 그녀의 모든 아들과 그의 아들들이 그와 함께 그의 아내 레아를 애도하고 그를 위로하려고 왔습니다. 이는 그가 그녀를 두고 슬퍼하고 있었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘왼편에’.
    reason: 게에즈어 ፀጋም의 구체적인 공간 방향을 보존하면서 한국어의 가능한 동의 표현을 제시합니다.
lexical_decisions:
- source_word: በፀጋመ
  english_pob_choice: to the left
  chosen_korean: 왼쪽에
  alternatives_korean:
  - 왼편에
  - 왼쪽으로
  lexicon: Geez ፀጋም
  rationale: 원문의 구체적인 방향성은 '왼쪽'이 가장 직접적이며, POB의 수정 이력도 이 의미를 확정적으로 지지합니다.
- source_word: ለመቃብረ፡ ሣራ፡ እሙ፡ አቡሁ
  english_pob_choice: the grave of Sarah, his father’s mother
  chosen_korean: 사라, 그의 아버지의 어머니의 무덤
  alternatives_korean:
  - 사라의 무덤, 그의 아버지의 어머니
  - 사라의 무덤, 그의 부친의 어머니
  lexicon: Geez መቃብር / እሙ / አቡሁ
  rationale: 무덤의 소유 관계와 친족 설명을 모두 살리되, 한국어에서는 후행 수식으로 풀어 쓰는 편이 자연스럽습니다.
- source_word: ይብክይዋ
  english_pob_choice: mourn
  chosen_korean: 곡하고
  alternatives_korean:
  - 슬퍼하고
  - 애도하고
  lexicon: Geez በከየ / ይብክይዋ
  rationale: 단순한 감정 표현보다 장례 맥락의 공식적 애도 행위를 드러내는 '곡하다'가 원문의 장례적 분위기를 더 잘 보존합니다.
- source_word: ይናዝዝዎ
  english_pob_choice: to comfort him
  chosen_korean: 그를 위로했으니
  alternatives_korean:
  - 그를 위로하려고
  - 그에게 위로를 전했으니
  lexicon: Geez ናዘዘ
  rationale: 원문의 목적·결과 흐름을 따라 위로 행위를 간결하게 옮겼습니다.
- source_word: ይሳቀዮ
  english_pob_choice: he was grieving for her
  chosen_korean: 그가 그녀를 두고 슬퍼하고 있었기 때문입니다
  alternatives_korean:
  - 그가 그녀 때문에 고통받고 있었기 때문입니다
  - 그가 그녀로 인해 마음 아파하고 있었기 때문입니다
  lexicon: Geez ሰቀየ
  rationale: 문맥상 내적 슬픔과 고통을 모두 포함할 수 있으나, 한국어 본문에서는 자연스러운 '슬퍼하고'로 옮기되 이유절로 원인의 중량감을 유지했습니다.
theological_decisions:
- issue: 장례 맥락의 정서 표현
  chosen_reading: '''곡하고''와 ''위로했습니다''로 장례 공동체의 애도와 위로를 분명히 드러냈습니다.'
  alternative_readings:
  - '''슬퍼하고''와 ''위로했다''로 완화하여 번역'
  - '''애도하고''로 전면 치환'
  rationale: 외경 서사이지만 원문은 공동체적 장례 의례를 강조하므로, 정서만이 아니라 행위의 사회적 의미를 살리는 편이 더 충실합니다.
  doctrine_reference: 서사 문맥 보존 및 정서적 강도 유지
- issue: 친족 관계의 직역성
  chosen_reading: '''그의 아버지의 어머니''를 직역에 가깝게 유지했습니다.'
  alternative_readings:
  - '''할머니''로 의미 통합'
  - '''부친의 어머니''로 한문투 완화'
  rationale: 원문은 관계를 분해하여 제시하므로, 독자에게 친족 구조를 그대로 보이게 하는 편이 출처 가시성이 높습니다.
  doctrine_reference: source transparency
