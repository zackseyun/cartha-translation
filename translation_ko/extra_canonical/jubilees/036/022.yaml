translation:
  language: ko
  text: 사라, 그의 아버지의 어머니의 무덤 왼쪽에 있었습니다. 그리고 그의 모든 아들들과 그의 아들들이 함께 와서 그의 아내 레아를 위해 곡하고, 그녀 때문에 그를 위로했으니, 그가 그녀를 두고 슬퍼하고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
