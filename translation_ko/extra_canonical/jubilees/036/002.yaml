  text: And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb that I dug for myself there, bury me.
translation:
  language: ko
  text: 제 아버지 아브라함 가까이, 에브론 헷 사람의 밭에 있는 두 겹으로 된 굴에 저를 묻어 주십시오. 아브라함이 그곳을 매장지로 사들였습니다. 또 그곳에서 제가 저 자신을 위해 판 무덤에 저를 묻어 주십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅሩበ፡ አብርሃም፡ አቡየ፡
  english_pob_choice: near Abraham my father
  chosen_korean: 아버지 아브라함 곁
  alternatives_korean:
  - 아버지 아브라함 가까이에
  - 아버지 아브라함 옆
  lexicon: 아브라함 / 곁
  rationale: 관계와 위치를 함께 살리기 위해 ‘곁’으로 옮기고, 아버지라는 호칭은 앞에 두어 친족적 긴급함을 드러냈습니다.
- source_word: ባዐት
  english_pob_choice: double cave
  chosen_korean: 두 겹 굴
  alternatives_korean:
  - 두 동굴
  - 쌍굴
  lexicon: 굴
  rationale: 게에즈의 ‘두 겹/이중’ 의미를 살리면서, 관상적이기보다 매장용 공간임을 드러내는 중립적 표현으로 ‘굴’을 택했습니다.
- source_word: ዘአጥረየ፡ አብርሃም፡ ለዝኅረ፡ መቃብር፡
  english_pob_choice: which Abraham acquired for a burial place there
  chosen_korean: 그곳은 아브라함이 매장지로 사들인 곳입니다
  alternatives_korean:
  - 그곳은 아브라함이 묘지로 취득한 곳입니다
  - 그곳은 아브라함이 장지로 산 곳입니다
  lexicon: 매장지 / 사들이다
  rationale: 구입 행위를 분명히 하되, 장례 맥락에서 자연스러운 ‘매장지’로 목적을 드러냈습니다.
- source_word: መቃብር፡ ህየ፡ ቅብሩኒ።
  english_pob_choice: In the tomb that I dug for myself there, bury me.
  chosen_korean: 또한 그곳에서 제가 제 자신을 위해 판 무덤에 저를 묻어 주십시오.
  alternatives_korean:
  - 또한 그곳에서 제가 스스로 판 무덤에 저를 묻어 주십시오
  - 또 그곳에 제가 만든 무덤에 저를 묻어 주십시오
  lexicon: 무덤 / 판
  rationale: 자기 준비의 뉘앙스를 보존하기 위해 ‘제가 제 자신을 위해 판’으로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 족장 매장 장소의 반복 명령
  chosen_reading: 한 번의 매장 요청을 두 겹으로 반복하여, 아브라함의 소유지와 야곱 자신이 준비한 무덤을 함께 강조하는 것으로 읽었습니다.
  alternative_readings:
  - 문체적 중복으로 보고 한 번만 자연화할 수 있음
  - 후반부를 전반부의 단순 재진술로 볼 수 있음
  rationale: 게에즈 본문과 영어 POB 모두 두 번의 묻어 달라는 요청을 유지하므로, 반복을 의미 있는 수사로 보존하는 것이 더 충실합니다.
  doctrine_reference: 서사적 반복의 보존
- issue: ‘두 겹 굴’의 문화적 생소함
  chosen_reading: 익숙한 한국식 장례 용어로 완전히 치환하지 않고, 원문 구조를 드러내는 표현을 유지했습니다.
  alternative_readings:
  - ‘쌍동굴’처럼 문화적으로 익숙하지 않은 조어를 사용할 수 있음
  - ‘동굴 무덤’으로 완화할 수 있음
  rationale: 이 구절은 특정 지형과 매장 관습을 지시하므로, 의미를 풀어버리기보다 원문의 질감을 살리는 편이 유익합니다.
  doctrine_reference: 원문 형상 보존
