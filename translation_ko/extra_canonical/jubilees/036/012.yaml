  text: And he divided all the possessions that he had between them on that day, and he gave the greater share to the man who was born first, and the tower[12] and all that was around it, and all that Abraham had acquired at the Well of the Oath.
  footnotes:
  - marker: '12'
    text: '''The tower'' may refer to a specific estate feature included in Isaac''s holdings. The surrounding inheritance list is terse and may reflect a difficult underlying text.'
    reason: cultural_note
  - marker: a
    text: Or 'on that day[12], and he gave the greater share to the man who was born first, and the tower'.
    reason: previous_rendering
  - marker: b
    text: Or 'all that he had'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그날 그가 가진 모든 재산을 그들 사이에 나누어 주고, 맏이로 태어난 사람에게 더 큰 몫을 주었으며, 탑[12]과 그 둘레의 모든 것, 그리고 맹세의 우물에서 아브라함이 취득한 모든 것을 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ ዘቦ፡ ጥሪተ፡
  english_pob_choice: all the possessions that he had
  chosen_korean: 그가 가진 모든 재산
  alternatives_korean:
  - 그가 가진 모든 소유
  - 그가 가진 모든 소유물
  lexicon: 지닌/재산
  rationale: Ge'ez의 ጥሪተ는 단순한 소유보다 재산·재물의 뉘앙스를 가지므로, 영어판이 명시한 possessions를 따라 자연스러운 한국어로 옮겼습니다.
- source_word: ዕበየ
  english_pob_choice: the greater share
  chosen_korean: 더 큰 몫
  alternatives_korean:
  - 더 많은 몫
  - 더 큰 부분
  lexicon: 몫
  rationale: 형제 간 분배의 맥락에서 share는 추상적 ‘부분’보다 상속 분배의 ‘몫’이 더 정확합니다.
- source_word: ብእሲ፡ ዘውእቱ፡ ቀደመ፡ ተወልደ፡
  english_pob_choice: the man who was born first
  chosen_korean: 맏이로 태어난 사람
  alternatives_korean:
  - 먼저 태어난 사람
  - 먼저 난 남자
  lexicon: 맏이/firstborn
  rationale: ‘born first’는 장자 개념을 가리키므로, 자연스러운 한국어로 ‘맏이’로 풀어 의미를 분명히 했습니다.
- source_word: ዐዘቅተ፡ መሐላ።
  english_pob_choice: the Well of the Oath
  chosen_korean: 맹세의 우물
  alternatives_korean:
  - 맹세의 샘
  - 서약의 우물
  lexicon: 지명 번역
  rationale: 영어 POB의 고유 표현을 따르되, መሐላ의 기본 의미인 oath를 ‘맹세’로 옮겨 지명의 뜻을 드러냈습니다.
theological_decisions:
- issue: ‘tower’의 지시 대상이 불명확한 표현
  chosen_reading: ‘탑[12]’을 본문에 유지하고 주석으로 특정 유산 요소의 가능성을 표시했습니다.
  alternative_readings:
  - ‘성채’
  - ‘망대’
  rationale: 영어 POB가 특정한 estate feature 가능성을 열어 두고 있으므로, 의미를 과도하게 특정하지 않고 가장 직역에 가까운 ‘탑’을 유지했습니다.
  doctrine_reference: 본문 비평/역사적 배경의 불확실성은 본문 자체의 모호성을 보존하는 것이 원칙입니다.
