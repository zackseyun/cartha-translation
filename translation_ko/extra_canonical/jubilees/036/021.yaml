  text: 그는 자기 출생의 날들을 나누었습니다. 그리고 그의 아내 레아가 제45희년의 둘째 주 넷째 해에 죽었으며, 그는 어머니 리브가 곁의 쌍굴에 그녀를 장사하였습니다.[a]
  philosophy: optimal-equivalence
