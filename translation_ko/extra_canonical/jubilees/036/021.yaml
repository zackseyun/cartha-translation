  text: 그는 자기 생애의 날들을 나누었습니다. 그의 아내 레아가 제45희년의 둘째 주 넷째 해에 죽었고, 그는 어머니 리브가 가까이에 있는 이중 동굴에 레아를 장사 지냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이중 동굴’은 창세기 전승에서 막벨라로 알려진 조상들의 매장 동굴에 해당합니다.
    reason: cross_reference
