  text: And now I make you swear by a great oath, for there is no oath greater than it, by the glorious and honorable and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you may be those who fear him and those who worship him.
  footnotes:
  - marker: a
    text: Or 'all creation'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제 나는 너희에게 큰 맹세로 맹세하게 합니다. 그것보다 더 큰 맹세는 없기 때문입니다. 곧 하늘과 땅과 모든 것을 함께 지으신 분의 영광스럽고 존귀하며 크고 찬란하며 놀랍고 능력 있는 이름으로, 너희가 그분을 두려워하는 자들과 그분을 예배하는 자들이 되게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምሕለክሙ፡ በመሐላ፡ ዐቢይ፡ እስመ፡ አልቦ፡ መሐላ፡ ዘእምኔሁ፡ የዐቢ።
  english_pob_choice: I make you swear by a great oath, for there is no oath greater than it
  chosen_korean: “너희에게 큰 맹세로 맹세하게 합니다. 그것보다 더 큰 맹세는 없기 때문입니다”
  alternatives_korean:
  - “너희로 하여금 큰 맹세를 하게 합니다”
  - “너희에게 큰 맹세를 시킵니다”
  lexicon: 맹세
  rationale: 아랍어적·교회식 완화보다 원문의 강한 서약 행위를 살리기 위해 ‘맹세하게 합니다’를 택했고, 비교 구조도 ‘그것보다 더 큰 맹세는 없기 때문입니다’로 유지했습니다.
- source_word: ስቡሕ፡ ወክቡር፡ ወዐቢይ፡ ወስፉሕ፡ ወመንክር፡ ወኀያል፡
  english_pob_choice: the glorious and honorable and great and splendid and marvelous and mighty
  chosen_korean: “영광스럽고 존귀하며 크고 찬란하며 놀랍고 능력 있는”
  alternatives_korean:
  - “영광스럽고 명예로우며 크고 넓고 놀랍고 강한”
  - “영광스럽고 존귀하며 크고 화려하며 기이하고 힘 있는”
  lexicon: 영광스럽다 / 존귀하다 / 찬란하다 / 능력 있는
  rationale: 여러 형용사가 이름의 위엄을 누적적으로 수식하므로, 전통적 교회어보다 현대 한국어에서 자연스럽고 의미층이 보존되는 표현으로 배열했습니다.
- source_word: ወኵሎ፡ ኅቡረ
  english_pob_choice: and all things together
  chosen_korean: “하늘과 땅과 모든 것을 함께”
  alternatives_korean:
  - “하늘과 땅과 모든 피조물을”
  - “하늘과 땅과 모든 것이 함께”
  lexicon: 함께
  rationale: POB의 수정 이력에서 ‘all things together’가 원문상 중요하다고 정리되었으므로, 단순한 ‘모든 것’이 아니라 결합 상태를 드러내는 ‘함께’를 반영했습니다.
- source_word: ትፈርህዎ፡ ወእለ፡ ታመልከዎ
  english_pob_choice: those who fear him and those who worship him
  chosen_korean: “그분을 두려워하는 자들과 그분을 예배하는 자들”
  alternatives_korean:
  - “그분을 경외하는 자들과 그분을 섬기는 자들”
  - “그분을 두려워하며 그분께 경배하는 자들”
  lexicon: 두려워하다 / 예배하다
  rationale: 원문은 두려움과 예배를 병렬로 두므로, 경외로 순화하기보다 ‘두려워하는’과 ‘예배하는’의 직접성을 살렸습니다.
theological_decisions:
- issue: 서약의 주체와 목적
  chosen_reading: 화자는 상대를 강한 맹세 아래 두며, 그 목적은 야훼의 이름을 걸고 두려움과 예배의 공동체를 형성하는 것입니다.
  alternative_readings:
  - 단순한 미래 예고
  - 일반적 종교적 권면
  rationale: 문맥상 명령/서약의 힘이 핵심이므로, 권면보다 서약 행위의 구속력을 드러냈습니다.
  doctrine_reference: 서약·맹세의 언어가 공동체 정체성과 순종을 규정하는 본문 해석
- issue: ‘모든 것을 함께’의 범위
  chosen_reading: ‘모든 것’을 피조세계 전체로 좁히지 않고, 원문이 가진 결합적 표현을 살려 ‘하늘과 땅과 모든 것을 함께’로 옮겼습니다.
  alternative_readings:
  - ‘모든 피조물’
  - ‘온 창조세계’
  rationale: POB의 주석 이력상 원문의 ኅቡረ는 단순 총칭보다 ‘함께/일괄하여’의 뉘앙스를 갖기 때문에, 범위를 과도하게 해석하지 않았습니다.
  doctrine_reference: 창조 기사 수식의 어휘적 뉘앙스 보존
