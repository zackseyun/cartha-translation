  text: And he remembered all her deeds that she had done in her life, and he mourned for her greatly, because he loved her with all his heart and with all his soul.
translation:
  language: ko
  text: 그리고 그는 그녀가 생전에 행한 모든 일을 기억하고, 그녀를 매우 크게 슬퍼했습니다. 이는 그가 그녀를 온 마음과 온 영혼을 다해 사랑했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ፡ ምግባራቲሃ፡ ዘገብረት፡ በሕይወታ፡
  english_pob_choice: all her deeds that she had done in her life
  chosen_korean: 그녀가 생전에 행한 모든 일
  alternatives_korean:
  - 그녀가 살아 있는 동안 행한 모든 행위들
  - 그녀의 생애 동안 한 모든 일
  lexicon: ምግባር / 행하다
  rationale: 행동의 총체를 가리키므로 자연스러운 ‘모든 일’로 옮기되, ‘생전에’로 시간 범위를 분명히 했습니다.
- source_word: ወይላሕዋ፡ ጥቀ፡
  english_pob_choice: and he mourned for her greatly
  chosen_korean: 그녀를 매우 크게 슬퍼했습니다
  alternatives_korean:
  - 그녀를 몹시 애도했습니다
  - 그는 그녀를 깊이 애도했습니다
  lexicon: ላሕየ / 슬퍼하다
  rationale: 과도한 해석 없이 슬픔의 강도를 살리기 위해 ‘매우 크게’와 ‘슬퍼했습니다’를 함께 사용했습니다.
- source_word: በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ።
  english_pob_choice: with all his heart and with all his soul
  chosen_korean: 온 마음과 온 영혼을 다해
  alternatives_korean:
  - 마음과 영혼을 다해
  - 온 마음과 온 혼을 다해
  lexicon: לב / נפש
  rationale: 히브리적 총체성 표현을 현대 한국어의 관용적이고도 직역에 가까운 방식으로 반영했습니다.
theological_decisions:
- issue: 감정 표현의 강도와 반복
  chosen_reading: ‘매우 크게 슬퍼했습니다’로 슬픔의 강도를 살리면서도 문장 전체를 과장하지 않았습니다.
  alternative_readings:
  - ‘크게 통곡했습니다’
  - ‘극진히 애도했습니다’
  rationale: 원문은 애도의 정도를 강조하지만, 반드시 통곡이나 의례적 애도로 한정하지 않으므로 가장 포괄적인 슬픔 표현을 택했습니다.
  doctrine_reference: 서사 문맥의 정서 표현 보존
