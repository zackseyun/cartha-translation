- source_word: ኢሰምዐ፡ እምአፉሃ፡ ቃለ፡ ድሩከ፡
  english_pob_choice: he had not heard from her mouth a harsh word
  chosen_korean: 그의 입에서 거친 말을 한 번도 듣지 못했는데
  alternatives_korean:
  - 그녀의 입에서 거친 말을 한 번도 듣지 못했는데
  - 그녀 입에서 험한 말을 한 번도 듣지 못했는데
