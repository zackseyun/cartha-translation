  - 다정함과 평안과 바름과 존귀가 있었기 때문입니다
  lexicon: 평강
  rationale: 명사열거 구조와 ‘그녀 안에 있었다’는 원문 구문을 살리되, ጽም ሰላም의 의미는 교회적 용례를 고려해 ‘평강’으로, ርትዕ은 도덕적 바름을 나타내는 ‘올바름’으로 옮겼습니다.
