  chosen_korean: 그의 입에서 거친 말을 한 번도 듣지 못했는데
  alternatives_korean:
  - 그녀의 입에서 거친 말을 한 번도 듣지 못했는데
  - 그녀 입에서 험한 말을 한 번도 듣지 못했는데
  lexicon: —
  rationale: 부정과 수동적 청취 구문을 자연스럽게 풀어, ‘그의 입에서’로 연결된 한국어 흐름을 유지하면서도 원문의 ‘거친 말’ 의미를 보존했습니다.
