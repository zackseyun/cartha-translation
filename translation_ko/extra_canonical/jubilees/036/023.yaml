  yaml_path: translation/extra_canonical/jubilees/036/023.yaml
  text: For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because gentleness and peace and uprightness and honor were in her.
  footnotes:
  - marker: a
    text: Or 'she was gentle and peaceable and upright and honorable'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그녀의 누이 라헬이 죽은 뒤에 그녀를 더욱 몹시 사랑했습니다. 이는 그녀가 모든 길에서 온전하고 바르며 야곱을 공경했기 때문입니다. 그는 그녀가 그와 함께 살던 모든 날 동안 그녀의 입에서 거친 말을 한마디도 듣지 못했습니다. 이는 그녀 안에 온유와 평강과 올바름과 존귀가 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀는 온유하고 평화로우며 바르고 존귀했습니다.”
    reason: 원문의 추상명사들(‘온유, 평강, 올바름, 존귀’)과 ‘그녀 안에 있었다’라는 구문을 형용사적 서술로 옮긴 번역 가능성을 제시합니다.
