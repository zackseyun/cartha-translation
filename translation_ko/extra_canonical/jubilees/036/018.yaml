base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/018.yaml
  text: there was peace among them. And they went out from him and rested that day and slept. And Isaac slept on his bed five years[18], rejoicing, and he slept the eternal sleep and died at the age of one hundred and eighty years. He completed twenty-five weeks and five years. And his two sons buried him.
  footnotes:
  - marker: '18'
    text: The age notice literally combines 180 years with the calendrical summary 'twenty-five weeks and five years,' i.e., 25 weeks of years (175) plus 5 years.
    reason: cross_reference
  - marker: a
    text: Or 'and died. He completed one hundred and eighty years, that is, twenty-five weeks and five years.'.
    reason: previous_rendering
  - marker: b
    text: Or 'on that day[18]'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 사이에 평화가 있었습니다. 그들은 그에게서 나와 그날 쉬고 잠들었습니다. 이삭은 그날 자기 침상에서 기뻐하며 잠들었습니다. 그는 영원한 잠을 자고 백여든 살에 죽었습니다. 그는 스물다섯 주와 다섯 해를 채웠습니다.[18] 그의 두 아들이 그를 장사하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '18'
    text: ‘스물다섯 주와 다섯 해’는 연수로 세는 주간 25주(175년)와 5년을 합한 표현입니다.
    reason: 원문의 연대 계산 공식에서 ‘주’가 일반적인 7일 단위가 아니라 연수의 주간임을 밝혀, 본문은 직역적으로 유지하면서 오해를 막습니다.
lexical_decisions:
- source_word: ዐርዮ
  english_pob_choice: there was peace among them
  chosen_korean: 그들 사이에 평강이 있었습니다
  alternatives_korean:
  - 그들 사이에 평화가 있었습니다
  - 그들 사이에 조화가 있었습니다
  lexicon: 평강
  rationale: Ge'ez의 관계 상태를 나타내는 표현을 영어 POB의 peace에 맞추되, 본문 맥락상 단순한 내적 감정보다 관계적 안정이어서 ‘평강’으로 옮겼습니다.
- source_word: ወወፅኡ እምኀቤሁ
  english_pob_choice: And they went out from him
  chosen_korean: 그들은 그에게서 나가
  alternatives_korean:
  - 그들은 그를 떠나
  - 그들은 그에게서 떠나
  lexicon: 출발 동사
  rationale: 원문은 ‘그에게서 나가다’의 물리적 이동을 말하므로, 추상화된 ‘떠나다’보다 직접적인 동작을 살렸습니다.
- source_word: ወኖሙ ... ይትፌሣሕ
  english_pob_choice: Isaac slept on his bed ... rejoicing
  chosen_korean: 이삭은 그날 자기 침상에서 즐거워하며 잠들어
  alternatives_korean:
  - 이삭은 그날 자기 침상에서 기뻐하며 잠들어
  - 이삭은 그날 자기 침상에서 즐거운 마음으로 잠들어
  lexicon: 즐거워하다
  rationale: 영어 POB의 rejoicing을 감정의 상태로 유지하되, 한국어에서는 서술부가 자연스럽도록 ‘즐거워하며’로 처리했습니다.
- source_word: ወሞተ ወልደ ፻ወ፹ዓመት
  english_pob_choice: and died at the age of one hundred and eighty years
  chosen_korean: 백여든 살이었습니다
  alternatives_korean:
  - 백여든 해에 죽었습니다
  - 백여든 살로 죽었습니다
  lexicon: 연령 표기
  rationale: 원문은 죽음의 연령을 부가적으로 제시하므로, 합쇼체 서술에서 자연스럽게 연령 종결형으로 옮겨 별도의 동사 반복을 줄였습니다.
- source_word: ፳ወ፭ ሱባዔ ፈጸመ ወ፭ዓመተ
  english_pob_choice: He completed twenty-five weeks and five years
  chosen_korean: 그는 스물다섯 주와 다섯 해를 채웠습니다
  alternatives_korean:
  - 그는 스물다섯 주와 다섯 해를 완성했습니다
  - 그는 스물다섯 주와 다섯 해를 마쳤습니다
  lexicon: calendar formula
  rationale: 주(weeks of years)와 해(years)를 병렬로 유지해 계산식의 형태를 드러내고, ‘채우다’로 기간 완결의 의미를 살렸습니다.
theological_decisions:
- issue: ‘영원한 잠’의 사후 묘사
  chosen_reading: 원문의 죽음 표현을 그대로 살려 ‘영원한 잠’을 유지했습니다.
  alternative_readings:
  - ‘평안히 잠들어’
  - ‘죽어 영원한 안식을 누리고’
  rationale: 본 절은 단순한 시적 완곡어법을 넘어 족장 서사의 죽음 공식을 보여 주므로, 의미를 약화시키지 않도록 직역적 표현을 남겼습니다.
  doctrine_reference: 서사적 죽음 공식의 보존
- issue: ‘그의 두 아들이’의 구체명 여부
  chosen_reading: 이 절의 현재 게에즈 본문과 영어 POB 개정본에 따라 인명을 넣지 않았습니다.
  alternative_readings:
  - ‘그의 두 아들 에서와 야곱이’
  - ‘그의 두 아들’
  rationale: 개정 사본은 이 절에 없는 이름을 제거했으므로, 본문 증거에 맞춰 일반 명칭만 유지했습니다.
  doctrine_reference: 본문비평/사본 일치
