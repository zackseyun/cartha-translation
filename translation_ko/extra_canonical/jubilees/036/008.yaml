  text: And let each one love his brothers with mercy and righteousness, and let no man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.
  footnotes:
  - marker: a
    text: Or 'let not a man'.
    reason: previous_rendering
  - marker: b
    text: Or 'his brother'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 각각이 자기 형제들을 긍휼과 의로 사랑하며, 아무도 지금부터 영원까지 자기 형제에게 악을 품지 말라. 너희 생명의 모든 날 동안, 너희의 모든 행위에서 번성하여 망하지 않게 하려 함이라.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያፈቅር
  english_pob_choice: love
  chosen_korean: 사랑하다
  alternatives_korean:
  - 애정하다
  - 좋아하다
  lexicon: Ge'ez ያፈቅር
  rationale: 명령형 권고로서의 'love'를 표준적인 종교어휘인 '사랑하다'로 옮겼습니다.
- source_word: እኅዋሁ / በእኁሁ
  english_pob_choice: his brothers / his brother
  chosen_korean: 자기 형제들 / 자기 형제
  alternatives_korean:
  - 그의 형제들 / 그 형제
  - 형제들 / 형제
  lexicon: Ge'ez እኅዋሁ, በእኁሁ
  rationale: 본문의 복수형과 단수형 대비를 살려 '형제들'과 '형제'를 구분하되, 한국어에서는 자연스럽게 '자기'를 보충해 대상을 분명히 했습니다.
- source_word: በምሕረት፡ ወበጽድቅ
  english_pob_choice: with mercy and righteousness
  chosen_korean: 긍휼과 의로
  alternatives_korean:
  - 자비와 의로
  - 긍휼과 공의로
  lexicon: Ge'ez ምሕረት, ጽድቅ
  rationale: '''긍휼''은 자비보다 원문 어감을 더 직접적으로 반영하고, ''צדק/의'' 계열의 ጽድቅ은 이 문맥에서 ''의''로 옮기는 것이 가장 안정적입니다.'
- source_word: ኢይፈቅድ፡ ብእሲ፡ እኩየ
  english_pob_choice: let no man desire evil
  chosen_korean: 아무도 … 악을 품지 말라
  alternatives_korean:
  - 어떤 사람도 … 악을 바라지 말라
  - 사람이 … 악을 원하지 말라
  lexicon: Ge'ez ኢይፈቅድ, እኩየ
  rationale: 영어의 'desire evil'을 한국어에서 더 자연스럽고 내면적 의지를 드러내는 '악을 품다'로 옮겨, 형제에게 해를 품는 마음을 분명히 했습니다.
theological_decisions:
- issue: 형제 사랑의 범위를 복수형으로 반영할지 여부
  chosen_reading: 각각이 자기 형제들을 사랑한다
  alternative_readings:
  - 각각이 자기 형제를 사랑한다
  rationale: 게에즈 본문이 እኅዋሁ(복수형)로 되어 있어, 권고의 대상이 여러 형제들임을 한국어에서도 반영했습니다.
  doctrine_reference: 본문 주해/문법 일치
- issue: '''긍휼과 의''의 윤리적 병렬'
  chosen_reading: 긍휼과 의
  alternative_readings:
  - 자비와 의
  - 긍휼과 공의
  rationale: 본문은 사랑의 방식으로 '긍휼'과 '의'를 나란히 두며, 이를 교리적 확장 없이 직접적으로 유지하는 것이 가장 안전합니다.
  doctrine_reference: 본문 윤리 표현 유지
