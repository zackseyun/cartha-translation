revisions:
- from: 그리고 각각이 자기 형제들을 긍휼과 의로 사랑하며, 아무도 지금부터 영원까지 자기 형제에게 악을 품지 말라. 너희 생명의 모든 날 동안, 너희의 모든 행위에서 번성하여 망하지 않게 하려 함이라.[a][b]
  to: 그리고 저마다 긍휼과 의로 자기 형제들을 사랑하고, 아무도 이제부터 영원히, 곧 너희가 사는 모든 날 동안 자기 형제에게 악을 품지 마십시오. 그리하면 너희가 모든 일에서 잘되고 멸망하지 않을 것입니다.
  rationale: The revision preserves the Ge’ez plural/singular contrast (‘형제들’/‘형제’), the paired ethical terms, and the prohibition of evil desire. It uses consistent modern formal-polite endings, clarifies the temporal phrase without resolving or reducing its emphatic ‘from now and forever/all your days’ formulation, and renders the result clause naturally. The English-only alternative-rendering footnotes are removed because they have no corresponding Korean ambiguity requiring annotation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:04Z'
