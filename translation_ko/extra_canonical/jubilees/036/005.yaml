  text: And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.
translation:
  language: ko
  text: 그리고 우상에 관한 일로는 내가 여러분에게 명령하며 권고합니다. 그것들을 멸시하고 거절하며, 그것들을 사랑하지 마십시오. 그것들은 그것을 예배하는 사람들과 그것들에게 엎드려 절하는 사람들에게 오류로 가득하기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አአዝዘክሙ / እጌሥጸክሙ
  english_pob_choice: I command you and exhort you
  chosen_korean: 내가 여러분에게 명령하며 권고합니다
  alternatives_korean:
  - 내가 여러분에게 명령하고 간청합니다
  - 내가 여러분에게 명령하며 권면합니다
  lexicon: 명령하다; 권고하다
  rationale: 두 동사의 병렬을 살리되, 합쇼체에서 자연스럽고 구분되는 표현으로 옮겼습니다.
- source_word: ትመንንምዎሙ / ተጸረርዎሙ
  english_pob_choice: you should despise them and reject them
  chosen_korean: 그것들을 멸시하고 거절하며
  alternatives_korean:
  - 그것들을 업신여기고 버리며
  - 그것들을 경멸하고 배척하며
  lexicon: 멸시하다; 거절하다
  rationale: POB의 두 동작을 유지하면서, 우상에 대한 강한 부정적 태도를 드러내는 동사쌍으로 옮겼습니다.
- source_word: ኢታፍቅርዎሙ
  english_pob_choice: you should not love them
  chosen_korean: 그것들을 사랑하지 마십시오
  alternatives_korean:
  - 그것들을 좋아하지 마십시오
  - 그것들을 애정하지 마십시오
  lexicon: 사랑하다
  rationale: 원문의 금지형을 직접적으로 반영하고, POB의 ‘love’에 대응하는 가장 기본적인 한국어를 택했습니다.
- source_word: ስሕተት ምሉአን
  english_pob_choice: full of error
  chosen_korean: 오류로 가득하기 때문입니다
  alternatives_korean:
  - 잘못으로 가득하기 때문입니다
  - 미혹으로 가득하기 때문입니다
  lexicon: 오류; 가득하다
  rationale: ‘error’는 단순 실수보다 교란·왜곡의 의미를 띠므로, 본문 논지를 살리는 ‘오류’로 번역했습니다.
theological_decisions:
- issue: 우상에 대한 태도를 가리키는 세 연속 동사(멸시하다/거절하다/사랑하지 않다)의 강도
  chosen_reading: 우상 숭배를 단순 금지 이상으로, 적극적 혐오와 거부를 요구하는 강한 윤리적 경고로 제시했습니다.
  alternative_readings:
  - 단순히 ‘멀리하다’ 정도로 순화
  - ‘미워하다’로 더 강하게 표현
  rationale: 게에즈 원문과 POB가 모두 단순 회피보다 강한 단절을 말하므로, 과도한 완화 없이도 한국어에서 수용 가능한 강도로 옮겼습니다.
  doctrine_reference: 우상 금지와 제1계명 전통
- issue: ‘오류로 가득’의 대상
  chosen_reading: 오류는 우상 그 자체와, 그것을 예배하고 엎드려 절하는 자들에게 미친 상태를 함께 가리킨다고 보았습니다.
  alternative_readings:
  - 오류가 우상만을 가리킴
  - 오류가 숭배자들만을 가리킴
  rationale: 원문은 우상과 그 숭배자 모두를 연결하므로, 영어 POB의 병렬을 따라 양쪽 모두에 걸친 오염을 드러냈습니다.
  doctrine_reference: 우상 숭배의 미혹성과 죄성
