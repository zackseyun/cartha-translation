revisions:
- from: 그리고 우상에 관한 일로는 내가 여러분에게 명령하며 권고합니다. 그것들을 멸시하고 거절하며, 그것들을 사랑하지 마십시오. 그것들은 그것을 예배하는 사람들과 그것들에게 엎드려 절하는 사람들에게 오류로 가득하기 때문입니다.[a]
  to: 그리고 우상에 관한 일에 대해서는, 내가 여러분에게 명령하고 권고합니다. 그것들을 멸시하고 배척하며, 그것들을 사랑하지 마십시오. 그것들을 예배하는 사람들과 그것들에게 엎드려 절하는 사람들은 온갖 그릇됨으로 가득하기 때문입니다.
  rationale: 우상에 대한 세 가지 명령의 병렬과 금지의 강도는 유지했습니다. 마지막 절은 게에즈어 문장 구조에 따라 ‘가득한’ 상태의 주체를 우상 숭배자들로 바로잡았고, 어색한 대명사 연결을 없앴습니다. 제공되지 않은 [a] 주석 표지는 삭제했습니다.
