- source_word: ዘንተ
  english_pob_choice: this
  chosen_korean: 이
  alternatives_korean:
  - 이것의
  - 이런
  lexicon: demonstrative
  rationale: 지시어는 한국어에서도 간결하게 ‘이’로 살려 앞뒤 문맥의 몫을 가리키게 했습니다.
- source_word: ዕበየ
  english_pob_choice: greater share
  chosen_korean: 더 큰 몫
  alternatives_korean:
  - 더 큰 부분
