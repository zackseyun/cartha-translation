  lexicon: quantity/share
  rationale: ‘몫’이 분배의 의미를 가장 직접적으로 드러내며, ዕበየ의 비교급은 ‘더 큰’으로 자연스럽게 반영했습니다.
- source_word: ለብእሲ
  english_pob_choice: the man
  chosen_korean: 사람
  alternatives_korean:
  - 남자
  - 그 사람
  - 인간
  lexicon: human male/person
  rationale: 본문의 문맥상 성별을 명시하기보다, 인물 지칭을 자연스럽게 살려 ‘사람’으로 옮겼습니다.
- source_word: ዘውእቱ ቀደመ ተወልደ
  english_pob_choice: who was born first
  chosen_korean: 먼저 태어난
  alternatives_korean:
  - 처음 태어난
  - 장자로 태어난
  - 먼저 난
  lexicon: birth order
  rationale: 출생 순서를 간결하게 나타내면서도 ‘먼저’로 우선성을, ‘태어난’으로 출생 사실을 분명히 했습니다.
