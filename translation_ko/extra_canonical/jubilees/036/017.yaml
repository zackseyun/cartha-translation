  text: the man who does righteousness, him and his seed forever.” And he finished commanding them and blessing them, and they ate and drank together before him and rejoiced,
translation:
  language: ko
  text: 의를 행하는 사람과 그의 씨를 영원히.” 그들이 명령을 받는 것과 축복하는 것을 마치자, 그들은 그 앞에서 함께 먹고 마시며 기뻐했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልዑል፡ ለ*ብእሲ፡ ዘይገብር፡ ጽድቀ፡
  english_pob_choice: the man who does righteousness
  chosen_korean: 의를 행하는 사람
  alternatives_korean:
  - 공의를 행하는 사람
  - 의로운 사람
  - 의를 행하는 자
  lexicon: ጽድቀ፡ → 의
  rationale: 원문은 특정한 칭호보다 ‘의를 행하다’라는 행위 중심 표현이며, POB의 영어도 이를 그대로 살려 한국어에서도 자연스럽게 ‘의를 행하는 사람’으로 옮겼습니다.
- source_word: ኪያሁ፡ ወዘርኦ፡
  english_pob_choice: him and his seed forever
  chosen_korean: 그와 그의 씨를 영원히
  alternatives_korean:
  - 그와 그의 후손을 영원히
  - 그와 그의 자손을 영원히
  - 그와 그의 씨앗을 영원히
  lexicon: ዘርእ / seed
  rationale: 여기서 ‘씨’는 후손 집단을 가리키는 성경적 표현이므로, 영어 POB의 seed를 따라 직역적이되 한국어 성경어법에 맞게 유지했습니다.
- source_word: ወፈጸመ፡ እንዘ፡ ይኤዝዞሙ፡ ወ*እንዘ፡' ይባርኮሙ፡
  english_pob_choice: he finished commanding them and blessing them
  chosen_korean: 그들이 명령을 받는 것과 축복하는 것을 마치자
  alternatives_korean:
  - 그가 그들에게 명령하고 축복하기를 마치자
  - 그가 그들을 명령하고 축복하는 일을 끝내자
  - 그가 그들에게 명령하고 축복함을 마치자
  lexicon: ፈጸመ / ይኤዝዞሙ / ይባርኮሙ
  rationale: Geez 동사는 ‘마치다/끝내다’와 ‘명령하다/축복하다’의 연속을 나타내므로, 한국어에서는 자연스러운 서술 구조로 풀되 행위의 완료를 분명히 했습니다.
- source_word: በቅድሜሁ፡ ኅቡረ፡ ወተፈሥሑ፡
  english_pob_choice: they ate and drank together before him and rejoiced
  chosen_korean: 그 앞에서 함께 먹고 마시며 기뻐했습니다
  alternatives_korean:
  - 그 앞에서 함께 먹고 마시고 기뻐했습니다
  - 그 앞에서 함께 먹고 마시며 즐거워했습니다
  - 그 면전에서 함께 먹고 마시며 기뻐하였습니다
  lexicon: ቅድሜሁ / ኅቡረ / ተፈሥሑ
  rationale: ‘before him’는 관계적 위치를 드러내므로 ‘그 앞에서’로, ‘together’는 공동 행위의 결과를 살려 ‘함께’로 옮겼습니다.
theological_decisions:
- issue: ‘seed’의 집단적 약속 표현 보존
  chosen_reading: ‘그의 씨’로 유지하여 개인과 후손에 대한 축복 약속의 이중성을 드러냈습니다.
  alternative_readings:
  - ‘그의 자손’으로 완전 자연화
  - ‘그의 후손’으로 의미만 전달
  rationale: 본문은 단순한 생물학적 자손보다 언약적 계승을 암시하므로, 성경적 관용구인 ‘씨’를 유지하는 편이 원문의 함의를 더 잘 보존합니다.
  doctrine_reference: 창 12:7; 17:7; 갈 3:16의 언약적 씨 개념
