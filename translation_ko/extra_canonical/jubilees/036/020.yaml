  rationale: 복수 ‘계명’과 ‘드러남/계시됨’의 의미를 간결하게 살리기 위해 ‘드러난 계명’으로 압축했습니다.
theological_decisions:
- issue: 야훼/주님의 표기
  chosen_reading: 본문의 LORD에 해당하는 신명을 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절의 영어 POB는 LORD를 사용하지만, 본문은 직접 인용된 찬양/경배 서술이며 extra-canonical 자료의 일반 독자 가독성을 고려해 ‘주님’으로 표기했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
- issue: ‘worshiped’의 동사 선택
  chosen_reading: ‘경배하였습니다’로 옮겼습니다.
  alternative_readings:
  - 예배하였습니다
  - 숭배하였습니다
  rationale: ‘경배하다’는 하나님께 드리는 예배 행위를 가장 सीधे하게 드러내며, 본문의 경외적 의미를 유지합니다.
  doctrine_reference: 성서 한국어에서의 예배/경배 어법
