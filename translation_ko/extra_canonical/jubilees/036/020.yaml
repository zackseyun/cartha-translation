    text: Or 'in the tower of the sojourning'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 야곱은 헤브론 산, 곧 그의 아버지 아브라함이 나그네로 거하던 땅의 망루[a]에 살았으며, 온 마음을 다해 계시된 계명들에 따라 주님께 경배하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “나그네로 거하던 곳의 망루에”.
    reason: 영어 POB 감사 번역의 대안 독법(‘in the tower of the sojourning’)을 보존합니다.
