translation:
  language: ko
  text: 그러나 야곱은 헤브론 산에, 곧 그의 아버지 아브라함이 나그네로 거하던 땅의 망루에 살았으며, 그의 온 마음으로 그리고 드러난 계명에 따라 주님을 경배하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀደረ
  english_pob_choice: dwelt
  chosen_korean: 살았으며
  alternatives_korean:
  - 거하였으며
  - 머물렀으며
  lexicon: Geez ኀደረ
  rationale: 야곱의 지속적 거주를 자연스럽게 드러내기 위해 ‘살다’를 택했으며, 본문의 서술 흐름을 살렸습니다.
- source_word: ደብረ፡ ኬብሮን
  english_pob_choice: Mount Hebron
  chosen_korean: 헤브론 산
  alternatives_korean:
  - 헤브론 산 위
  - 헤브론 산지
  lexicon: Geez ደብር
  rationale: 산 이름의 직역을 유지하되, 한국어 지명 표현으로 자연스럽게 정리했습니다.
- source_word: ዘምድረ፡ ፍልሰተ፡ አቡሁ፡ አብርሃም
  english_pob_choice: of the land of the sojourning of Abraham his father
  chosen_korean: 그의 아버지 아브라함이 나그네로 거하던 땅
  alternatives_korean:
  - 그의 아버지 아브라함의 유랑의 땅
  - 그의 아버지 아브라함이 머물러 살던 땅
  lexicon: Geez ዘምድረ / ፍልሰተ
  rationale: ‘sojourning’을 단순한 이동이 아니라 거류 상태로 보아 ‘나그네로 거하던 땅’으로 옮겨, 아브라함의 임시 거주를 분명히 했습니다.
- source_word: ወበከመ፡ ትእዛዛት፡ ዘያስተርኢ
  english_pob_choice: according to the commandments as they were revealed
  chosen_korean: 드러난 계명에 따라
  alternatives_korean:
  - 계명들이 드러난 대로
  - 계명이 계시된 대로
  lexicon: Geez ትእዛዛት / ዘያስተርኢ
  rationale: 복수 ‘계명’과 ‘드러남/계시됨’의 의미를 간결하게 살리기 위해 ‘드러난 계명’으로 압축했습니다.
theological_decisions:
- issue: 야훼/주님의 표기
  chosen_reading: 본문의 LORD에 해당하는 신명을 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 절의 영어 POB는 LORD를 사용하지만, 본문은 직접 인용된 찬양/경배 서술이며 extra-canonical 자료의 일반 독자 가독성을 고려해 ‘주님’으로 표기했습니다.
  doctrine_reference: POB glossary default for יהוה / YHWH
- issue: ‘worshiped’의 동사 선택
  chosen_reading: ‘경배하였습니다’로 옮겼습니다.
  alternative_readings:
  - 예배하였습니다
  - 숭배하였습니다
  rationale: ‘경배하다’는 하나님께 드리는 예배 행위를 가장 सीधे하게 드러내며, 본문의 경외적 의미를 유지합니다.
  doctrine_reference: 성서 한국어에서의 예배/경배 어법
