  english_pob_choice: of the land of the sojourning of Abraham his father
  chosen_korean: 그의 아버지 아브라함이 나그네로 거하던 땅
  alternatives_korean:
  - 그의 아버지 아브라함의 유랑의 땅
  - 그의 아버지 아브라함이 머물러 살던 땅
  lexicon: Geez ዘምድረ / ፍልሰተ
