  text: And Isaac said, “May a blessing rest upon you, my sons, and upon your seed this day, because you have given me rest.”
translation:
  language: ko
  text: 그리고 이삭이 말했습니다. “내 아들들아, 오늘 복이 너희와 너희 자손 위에 머물기를 바랍니다. 너희가 내게 쉼을 주었기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “May a blessing rest upon you” / በረከተ
  english_pob_choice: May a blessing rest upon you
  chosen_korean: 복이 머물기를 바라노라
  alternatives_korean:
  - 복이 너희 위에 있기를 바라노라
  - 복이 너희에게 임하기를 바라노라
  lexicon: ბარكة/ברכה 계열의 축복 표현
  rationale: 동사 ‘rest’의 정적·지속적 뉘앙스를 살리기 위해 ‘머물다’를 택했고, 축복의 청원형은 이 축복문맥에 맞게 자연스러운 기원형으로 옮겼습니다.
- source_word: my sons
  english_pob_choice: my sons
  chosen_korean: 내 아들들아
  alternatives_korean:
  - 내 아들들이여
  - 아들들아
  lexicon: vocative address
  rationale: 직접 호칭을 분명히 드러내기 위해 ‘아들들아’를 사용했고, 친밀한 축복 발화의 어조를 살렸습니다.
- source_word: your seed
  english_pob_choice: your seed
  chosen_korean: 너희의 씨
  alternatives_korean:
  - 너희 자손
  - 너희 후손
  lexicon: seed = offspring/descendants
  rationale: 원문의 ‘씨’는 자손을 가리키는 언약적 표현이므로, 전통적 완화어인 ‘자손’보다 직역성이 높은 ‘씨’를 유지했습니다.
- source_word: because you have given me rest
  english_pob_choice: because you have given me rest
  chosen_korean: 너희가 나를 쉬게 하였기 때문입니다
  alternatives_korean:
  - 너희가 내게 안식을 주었기 때문입니다
  - 너희가 나를 편안하게 하였기 때문입니다
  lexicon: give rest / relieve
  rationale: 이삭이 받은 실제 쉼을 나타내는 말이므로 ‘안식’보다 평이한 ‘쉬게 하다’를 택해 문맥의 서술성을 살렸습니다.
theological_decisions:
- issue: 축복문의 청원형 어조
  chosen_reading: “복이 머물기를 바라노라”로 축복을 기원하는 형태를 유지했습니다.
  alternative_readings:
  - 직설형 ‘복이 너희 위에 있습니다’
  - 명령형 ‘복이 너희 위에 있으라’
  rationale: 히브리계 축복 발화의 소망·기원 성격을 반영해야 하므로, 선언문보다 청원형이 원문의 말하기 기능을 더 잘 보존합니다.
  doctrine_reference: 축복 발화의 서원/기원 기능
- issue: '''씨''의 언약적 의미'
  chosen_reading: ‘씨’를 유지해 언약적 후손 개념을 드러냈습니다.
  alternative_readings:
  - ‘자손’으로 완화
  - ‘후손’으로 일반화
  rationale: 원문은 단순한 가족 호칭이 아니라 장차 이어질 혈통·약속의 계열을 가리키므로, 익숙한 교회어보다 source-direct 표현이 더 적절합니다.
  doctrine_reference: 아브라함 언약의 후손 언어
