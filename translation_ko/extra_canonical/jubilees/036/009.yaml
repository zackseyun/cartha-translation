  text: But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.
  footnotes:
  - marker: a
    text: Or 'his own hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 너희 가운데에 자기 형제에게 악을 꾸미는 자가 있거든, 이제부터는 자기 형제에게 악을 꾸미는 자는 누구나 그의 손에 떨어지고, 그는 살아 있는 땅에서 끊어질 것이며, 그의 씨는 하늘 아래에서 지워질 것임을 알라.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩየ፡ ለእኁሁ
  english_pob_choice: devises evil against his brother
  chosen_korean: 자기 형제에게 악을 꾸미는
  alternatives_korean:
  - 형제에게 악을 도모하는
  - 형제를 향해 악을 꾀하는
  lexicon: እኩየ = 악; ዘኀሠሠ = 꾀하다/도모하다
  rationale: 행위의 의도성을 살리되, 한국어에서는 ‘악을 꾸미다’가 음모적 의도를 가장 자연스럽게 드러냅니다.
- source_word: ውስተ፡ እዴሁ
  english_pob_choice: will fall into his hand
  chosen_korean: 그의 손에 떨어지고
  alternatives_korean:
  - 그의 손에 넘어가고
  - 그의 권세 아래 떨어지고
  lexicon: እድ = 손; 구문상 소유격 ‘그의’
  rationale: 원문과 영어 POB의 손 이미지가 가리키는 ‘상대의 손에 넘어감’을 직역적으로 살려, 의미의 긴장을 유지했습니다.
- source_word: ይትሐጐል፡ እምድረ፡ ሕያዋን፡
  english_pob_choice: will be cut off from the land of the living
  chosen_korean: 살아 있는 땅에서 끊어질 것이며
  alternatives_korean:
  - 생명의 땅에서 끊어질 것이며
  - 산 자의 땅에서 끊어질 것이며
  lexicon: 문자적 관용구; ‘land of the living’
  rationale: 관용구를 그대로 옮기되, 한국어에서 자연스러운 ‘살아 있는 땅’으로 처리해 사망/제거의 강도를 보존했습니다.
- source_word: ዘርኡኒ ... እምታሕተ፡ ሰማይ
  english_pob_choice: his seed will be blotted out from under heaven
  chosen_korean: 그의 씨는 하늘 아래에서 지워질 것임
  alternatives_korean:
  - 그의 자손은 하늘 아래에서 사라질 것임
  - 그의 씨는 하늘 아래에서 말소될 것임
  lexicon: 씨/자손; ‘blotted out’ = 지우다/말소하다
  rationale: 후손 전체의 소멸을 가리키는 표현으로 ‘씨’를 유지하고, 삭제 이미지는 ‘지워지다’로 옮겼습니다.
theological_decisions:
- issue: 형제에게 악을 꾸민 자가 그 손에 떨어진다는 보응 구조
  chosen_reading: 해를 가하려는 자가 결국 그가 겨냥한 형제의 손에 넘어가는 보응으로 읽었습니다.
  alternative_readings:
  - 가해자 자신의 손에 떨어진다는 반사적 의미
  - 그가 자기 행위의 결과에 스스로 걸려든다는 일반적 의미
  rationale: 에티오픽 원문과 영어 POB 수정 이력은 ‘그의 손’을 상대방의 손으로 읽게 하므로, 보응의 대상 전도를 분명히 살렸습니다.
  doctrine_reference: 보응/행위의 역전 원리
