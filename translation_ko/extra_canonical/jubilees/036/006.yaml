base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036/006.yaml
  text: Remember, my sons, the LORD, the God of Abraham your father; and how I also worshipped him and served him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted throughout all generations forever.
  footnotes:
  - marker: a
    text: Or 'and I also have devoted myself to him'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아들들아, 너희 아버지 아브라함의 하나님이신 야훼를 기억하십시오. 나도 그분을 예배하고 의와 기쁨 가운데 섬겼으니, 그분께서 너희를 번성하게 하시고 너희 씨를 하늘의 별들처럼 많게 하시며, 너희를 땅에 의의 나무로 심으셔서 모든 세대를 거쳐 영원히 뽑히지 않게 하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከርዎ
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하시오
  - 기억하세요
  lexicon: Geez imperative of remembering
  rationale: 직접적인 명령형을 살리되, 현대 표준어 합쇼체에 맞게 공손한 요청형으로 옮겼습니다.
- source_word: እግዚአብሔር / አምላከ አብርሃም
  english_pob_choice: the LORD, the God of Abraham your father
  chosen_korean: 야훼 곧 너희 조상 아브라함의 하나님
  alternatives_korean:
  - 주님 곧 너희 조상 아브라함의 하나님
  - 야훼, 너희 조상 아브라함의 하나님
  lexicon: divine name YHWH + construct chain
  rationale: 본문의 신명 요소를 프로젝트 기본값에 따라 야훼로 옮기고, 뒤의 동격 관계를 ‘곧’으로 풀어 원문의 수사적 병치를 유지했습니다.
- source_word: ወተቀነዩኩ / ወእምዝ ... ዘበጽድቅ ወበፍሥሓ
  english_pob_choice: and how I also worshipped him and served him in righteousness and in joy
  chosen_korean: 나도 그분을 의와 기쁨 가운데 섬겼으니
  alternatives_korean:
  - 나도 그분을 의와 기쁨 가운데 예배하고 섬겼으니
  - 나도 그분을 의로움과 기쁨 가운데 섬겼으니
  lexicon: serve/worship clause with righteousness and joy
  rationale: 영어 POB의 ‘worshipped him and served him’에 맞추되, 한국어에서는 과도한 중복을 피하면서도 예배와 섬김의 의미를 ‘섬겼으니’에 포괄해 담았습니다.
- source_word: ዘርአክሙ ... ከመ፡ ከዋክብተ፡ ሰማይ
  english_pob_choice: your seed numerous like the stars of heaven in multitude
  chosen_korean: 너희 씨를 하늘의 별들처럼 많게 하시며
  alternatives_korean:
  - 너희 후손을 하늘의 별들처럼 많게 하시며
  - 너희 자손을 하늘의 별들처럼 셀 수 없이 많게 하시며
  lexicon: seed / stars of heaven
  rationale: 씨(זרע) 이미지를 보존해 약속 계보의 언어를 살렸고, ‘in multitude’는 한국어에서 자연스럽게 ‘많게’로 처리했습니다.
- source_word: ተክለ ጽድቅ ... ዘኢይሤረዉ
  english_pob_choice: a plant of righteousness that will not be uprooted
  chosen_korean: 의의 나무로 심으셔서 ... 뽑히지 않게 하시려는 것입니다
  alternatives_korean:
  - 의의 심긴 것으로 세우셔서 ... 뽑히지 않게 하시려는 것입니다
  - 의의 심은 것으로 심으셔서 ... 뽑히지 않게 하시려는 것입니다
  lexicon: plant/rooted imagery
  rationale: 식물 은유를 직역에 가깝게 살리되, 한국어에서 자연스러운 ‘나무로 심다’로 옮겨 뿌리째 뽑힘의 대비를 분명하게 했습니다.
theological_decisions:
- issue: “worshipped him and served him”의 이중 표현을 한국어에서 어떻게 보존할지
  chosen_reading: ‘의와 기쁨 가운데 섬겼으니’로 묶어, 예배와 봉사의 복합 의미를 한 동사구에 담았습니다.
  alternative_readings:
  - ‘예배하고 섬겼으니’로 이중 동사를 그대로 살림
  - ‘경배하며 섬겼으니’로 예배성을 더 직접 표기
  rationale: 게에즈 본문과 영어 POB 모두 경배/섬김의 복합을 전하므로, 한국어에서는 중복을 과도하게 늘리지 않으면서 의미의 긴장을 유지하는 방식이 적절합니다.
  doctrine_reference: 서술적 예배와 언약적 섬김의 결합 표현
- issue: ‘plant you in the earth as a plant of righteousness’의 은유를 어떻게 처리할지
  chosen_reading: 공적 이미지가 강한 ‘의의 나무로 심으셔서’로 옮겨, 하나님이 백성을 땅에 정착시키는 언약적 은유를 드러냈습니다.
  alternative_readings:
  - ‘의의 식물로 심으셔서’
  - ‘의의 심긴 것으로 두셔서’
  rationale: ‘plant’의 문자적 식물성을 유지하되, 한국어에서 문맥상 덜 어색하고 이미지가 살아 있는 표현을 택했습니다.
  doctrine_reference: 언약적 뿌리내림과 견고함의 이미지
