  source_fidelity: 현 번역은 핵심 명령, 번성과 별의 비유, 땅에 심김과 뽑히지 않음의 이미지를 대체로 충실히 옮깁니다. 그러나 영어 POB 감사 이력에서 채택한 ‘그분을 예배하고 섬겼다’라는 두 동작 가운데 ‘예배하다’가 빠져 있어 보완이 필요합니다. 또한 ‘너희 조상 아브라함’은 원문 및 영어의 ‘your father Abraham’을 ‘조상’으로 일반화합니다.
