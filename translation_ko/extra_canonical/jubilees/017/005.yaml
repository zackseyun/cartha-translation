translation:
  language: ko
  text: …그리고 그 아들도 내쫓으십시오. 이 여종의 아들이 내 아들 이삭과 함께 상속자가 되지 못할 것이기 때문입니다.” 그 일은 그의 여종과 그의 아들 때문에 아브라함이 보기에 매우 괴로웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 일은 아브라함이 보기에 그의 여종과 그의 아들 때문에 매우 괴로웠습니다.”
    reason: 원문의 어순상 ‘그의 여종과 그의 아들 때문에’는 ‘매우 괴로웠다’에 직접 연결되지만, 한국어에서는 ‘그 일’ 뒤에 둘 수도 있습니다. 의미 차이는 없습니다.
