translation:
  language: ko
  text: …그리고 그 여종의 아들입니다. 왜냐하면 그 여종의 아들은 내 아들 이삭과 함께 상속자가 되지 못할 것이기 때문입니다.” 그리고 그 일은 여종과 그의 아들 때문에 아브라함의 눈에 매우 괴로웠습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወልዳ፡ እስመ፡
  english_pob_choice: …and her son, for
  chosen_korean: …그리고 그 여종의 아들입니다. 왜냐하면
  alternatives_korean:
  - …그리고 그녀의 아들입니다. 왜냐하면
  - …그리고 그 여종의 아들인데,
  - …그리고 그 여종의 아들입니다. 그 이유는
  lexicon: source-syntax
  rationale: 게으즈 본문은 앞 절의 말(“그 여종과 그 아들…”을 내쫓으라)에 이어 문장을 잇는 도입부이므로, ‘그리고… 왜냐하면’으로 연결감을 살렸습니다.
- source_word: ኢይወርስ፡
  english_pob_choice: will not be an heir
  chosen_korean: 상속자가 되지 못할 것이기 때문입니다
  alternatives_korean:
  - 상속을 받지 못할 것이기 때문입니다
  - 상속자가 아닐 것이기 때문입니다
  - 유업을 받지 못할 것이기 때문입니다
  lexicon: inherit
  rationale: 상속/유업 의미를 살리되, 문맥상 아브라함 가문의 계승 문제를 드러내기 위해 ‘상속자가 되다’로 옮겼습니다.
- source_word: ወልዳ፡ ... ውእቱ፡ ... አብርሃም፡ በእንተ፡ አመቱ፡ ወበእንተ፡ ወልዱ፡
  english_pob_choice: And the matter was very grievous in the sight of Abraham because of his maidservant and because of his son.
  chosen_korean: 그 일은 여종과 그의 아들 때문에 아브라함의 눈에 매우 괴로웠습니다
  alternatives_korean:
  - 그 일은 여종과 그의 아들 때문에 아브라함에게 매우 괴로웠습니다
  - 아브라함은 여종과 그의 아들 때문에 그 일을 매우 괴로워했습니다
  - 아브라함의 눈에는 여종과 그의 아들 때문에 그 일이 매우 괴로웠습니다
  lexicon: grievous / in the sight of
  rationale: ‘in the sight of’는 관용적으로 ‘눈에’로 두어 평가의 초점을 유지했고, 게으즈의 강한 정서 반응은 ‘매우 괴로웠습니다’로 반영했습니다.
- source_word: ወልዱ
  english_pob_choice: his son
  chosen_korean: 그의 아들
  alternatives_korean:
  - 자기 아들
  - 그 아들
  - 아들
  lexicon: son
  rationale: 아브라함의 아들을 가리키는 소유격을 유지해, 앞부분의 상속 대조와 연결되도록 했습니다.
theological_decisions:
- issue: ‘slave woman’에 대한 한국어 표기
  chosen_reading: ‘여종’으로 옮기고, 본문에서는 POB의 ‘slave woman’에 대응하는 사회적 종속 상태를 과도하게 완화하지 않았습니다.
  alternative_readings:
  - 여종
  - 노예 여자
  - 종인 여자
  rationale: 게으즈/영문이 강조하는 종속성과 가족 내 위계를 드러내되, 한국어 문맥에서 가장 자연스럽고 본문에 충실한 표현을 택했습니다.
  doctrine_reference: 창세기 16장/21장의 하갈 전승과 상속 계승 구도
- issue: 아브라함의 감정 표현
  chosen_reading: ‘매우 괴로웠습니다’로 번역해 외적 행동보다 내적 고통을 드러냈습니다.
  alternative_readings:
  - 매우 슬펐습니다
  - 몹시 괴로워했습니다
  - 큰 근심이 있었습니다
  rationale: 게으즈 본문과 POB 영어의 ‘very grievous’는 단순한 슬픔보다 강한 고통·불쾌감을 시사하므로, 그 강도를 살렸습니다.
  doctrine_reference: 아브라함-하갈-이삭 서사의 긴장
