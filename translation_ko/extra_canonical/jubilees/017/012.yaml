translation:
  language: ko
  text: 그분이 그녀의 눈을 여시니 물웅덩이를 보았습니다. 그녀는 가서 물가죽에 물을 채우고 그에게 마시게 했습니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: ወከሠተ፡ አዕይንቲሃ፡
  english_pob_choice: And He opened her eyes
  chosen_korean: 그분이 그녀의 눈을 여시니
  alternatives_korean:
  - 그분이 그녀의 눈을 열어 주시니
  - 그분이 그녀의 눈을 열고
  lexicon: 눈을 열다 / 여시다
  rationale: Ge'ez의 ‘눈을 열다’는 원인을 나타내므로, 한국어에서는 자연스럽고 문어적인 ‘눈을 여시니’로 처리해 원인-결과 관계를 살렸습니다.
- source_word: ዐዘቅተ፡ ማይ፡
  english_pob_choice: a well of water
  chosen_korean: 물웅덩이를
  alternatives_korean:
  - 물 우물을
  - 물샘을
  lexicon: water source imagery
  rationale: 문맥상 물이 있는 샘/우물 계열을 가리키지만, 본문이 단순히 ‘우물’보다 넓은 물의 저장소를 암시할 수 있어 중립적으로 ‘물웅덩이’를 택했습니다.
- source_word: ዝቃ፡ ማየ፡
  english_pob_choice: the skin with water
  chosen_korean: 물가죽에 물을
  alternatives_korean:
  - 가죽부대에 물을
  - 물주머니에 물을
  lexicon: leather water container
  rationale: ‘즈카/가죽’류 용기는 한국어 성경 독자에게 ‘가죽부대’가 가장 가까우나, 본문의 기능을 직접 드러내는 ‘물가죽’으로 옮겼습니다.
theological_decisions:
- issue: 주어 표지의 생략과 대명사 처리
  chosen_reading: 원문 흐름에 따라 앞선 행위의 주체를 분리해 ‘그분’과 ‘그녀’로 명확히 번역했습니다.
  alternative_readings:
  - 주어를 반복하지 않고 문장만 이어 번역
  - ‘하나님이’/‘천사가’ 등으로 특정화
  rationale: 게으즈 본문은 주어를 동사 어미와 문맥으로 암시하므로, 한국어에서는 오해를 피하기 위해 대명사를 보완하되 특정 인물을 임의로 추가하지 않았습니다.
  doctrine_reference: 문맥 보존과 과잉특정화 방지
