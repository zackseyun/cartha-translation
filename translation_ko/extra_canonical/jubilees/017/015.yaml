  - severity: medium
    issue: ‘그가 말하는 모든 일’이 현재적이며 의미 범위가 다소 넓습니다.
    rationale: 영어 감사 번역의 ‘all that he spoke’ 및 원문의 관계절은 아브라함이 말한 것을 가리킵니다. ‘그가 말한 모든 일에서’로 과거 서술을 보존하는 편이 안전합니다.
  - severity: low
