  yaml_path: translation/extra_canonical/jubilees/017/015.yaml
  text: When I called him. And it came to pass in the seventh week, in the first year, in the first month, in this jubilee, on the twelfth of this month, words came in heaven concerning Abraham, that he was faithful in all that he spoke, and he loved the Lord, and in every trial he was faithful.
  footnotes:
  - marker: a
    text: Or 'And when he had called him,'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그를 불렀을 때였습니다. 그러고 나서 이 희년의 일곱째 주간, 첫해 첫째 달 그 달 열이틀에 하늘에서 아브라함에 관한 말들이 있었습니다. 곧 그가 말한 모든 일에서 신실하였고, 주님을 사랑하였으며, 모든 시험 가운데서도 신실하였다는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내가 그를 부른 뒤에.”
    reason: 영어 POB 감사 기록의 대안 독법(‘And when he had called him’)을 한국어로 반영하되, 본문은 게에즈 동사의 1인칭 단수 ‘내가 그를 불렀을 때’라는 기본 독법을 유지합니다.
lexical_decisions:
- source_word: ጸዋዕክዎ / When I called him
  english_pob_choice: When I called him.
  chosen_korean: 내가 그를 부를 때였습니다
  alternatives_korean:
  - 내가 그를 불렀습니다
  - 내가 그를 부른 때였습니다
  lexicon: source_note
  rationale: 게에즈 ጸዋዕክዎ는 1인칭 단수 ‘내가 그를 불렀다’에 해당하며, 문맥상 뒤의 시간 표지를 자연스럽게 잇기 위해 ‘~할 때였습니다’로 옮겼습니다.
- source_word: ቃላት፡ በሰማያት / words came in heaven
  english_pob_choice: words came in heaven
  chosen_korean: 하늘에서 말씀이 있었습니다
  alternatives_korean:
  - 하늘에서 말들이 있었습니다
  - 하늘에서 말들이 전해졌습니다
  lexicon: source_note
  rationale: 여기서 핵심은 ‘하늘에서’라는 출처와 ‘말씀/말’의 발생입니다. 한국어에서는 어색한 직역보다 자연스럽게 ‘하늘에서 말씀이 있었습니다’로 표현했습니다.
- source_word: መሃይምን / faithful
  english_pob_choice: faithful
  chosen_korean: 신실하였고
  alternatives_korean:
  - 충실하였고
  - 믿음직하였고
  lexicon: source_note
  rationale: 아브라함의 성격을 평가하는 핵심 형용사로서 ‘신실하다’가 원문의 충성·신뢰성을 가장 잘 살립니다.
- source_word: ዘይትናገር፡ ወያፈቅሮ፡ እግዚአብሔር / he spoke, and he loved the Lord
  english_pob_choice: he spoke, and he loved the Lord
  chosen_korean: 그가 말하는 모든 일에 신실하였고, 주님을 사랑하였으며
  alternatives_korean:
  - 그가 말한 모든 것에 신실하였고, 주님을 사랑하였으며
  - 그가 말하는 모든 일에서 신실하였고, 주님을 사랑하였으며
  lexicon: source_note
  rationale: 게에즈의 ‘말하다’와 ‘사랑하다’를 유지하되, 영어 POB의 의미를 따라 아브라함의 언어 행위와 사랑을 함께 드러내는 형식으로 다듬었습니다.
theological_decisions:
- issue: 구약 고유명사 יהוה 대응 여부
  chosen_reading: 이 절의 እግዚአብሔር은 문맥상 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 문장은 정경 인용이 아니라 희년서 본문 내부의 서술이며, 영어 POB도 Lord를 사용합니다. 따라서 본문 가독성을 위해 ‘주님’으로 유지했습니다.
  doctrine_reference: POB naming convention for κύριος / divine address
- issue: ‘모든 시험 가운데서도 신실하였다’의 반복 강조
  chosen_reading: ‘모든 시험 가운데서도 신실하였습니다’로 두 번째 신실함을 살렸습니다.
  alternative_readings:
  - ‘모든 시련에서도 믿음직하였습니다’
  - 해당 반복을 한 번만 옮김
  rationale: 원문은 아브라함의 신실함을 반복해 강조합니다. 이 반복은 문학적·신학적으로 의미가 있으므로 한국어에서도 유지했습니다.
  doctrine_reference: source-text emphasis / perseverance
