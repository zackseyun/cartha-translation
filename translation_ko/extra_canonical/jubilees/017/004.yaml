  yaml_path: translation/extra_canonical/jubilees/017/004.yaml
  text: And Sarah saw Ishmael joking and dancing, and Abraham rejoicing with great joy, and she became jealous of Ishmael and said to Abraham, “Cast out this maidservant and her son.”
  footnotes:
  - marker: a
    text: Or 'this woman'.
    reason: previous_rendering
translation:
  language: ko
  text: 사라는 이스마엘이 장난하고 춤추는 것과 아브라함이 크게 기뻐하는 것을 보고, 이스마엘을 질투하여 아브라함에게 말했습니다. 「이 여종[a]과 그 아들을 내쫓으십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 여자’.
    reason: 영어 POB 감사 이력의 ‘Or ‘this woman’’을 한국어로 반영합니다. 본문은 게에즈어와 문맥이 나타내는 종속 신분을 보존하기 위해 ‘여종’을 유지합니다.
lexical_decisions:
- source_word: ሣራ፡ እንዘ፡ ይትዋነይ፡ ወይዘፍን
  english_pob_choice: Sarah saw Ishmael joking and dancing
  chosen_korean: 이스마엘이 희롱하며 춤추는 것을 보고
  alternatives_korean:
  - 장난하며 춤추는 것을 보고
  - 놀리며 춤추는 것을 보고
  lexicon: 희롱하다
  rationale: Ge'ez 동사의 뉘앙스는 단순한 ‘농담’보다 경솔한 장난·희롱에 가깝기 때문에, 영어 POB의 joking을 따라가되 한국어에서는 ‘희롱하며’로 긴장을 살렸습니다.
- source_word: ወለአብርሃምኒ፡ እንዘ፡ ይትፌሣሕ፡ ፍሥሓ፡ ዐቢየ
  english_pob_choice: Abraham rejoicing with great joy
  chosen_korean: 아브라함이 큰 기쁨으로 즐거워하는 것을 보고
  alternatives_korean:
  - 아브라함이 크게 기뻐하는 것을 보고
  - 아브라함이 매우 기뻐하는 것을 보고
  lexicon: 큰 기쁨
  rationale: 중첩된 기쁨 표현을 평이하게 줄이되, ‘큰 기쁨’으로 중복 강조를 살려 원문의 강한 기쁨을 보존했습니다.
- source_word: ወቀንአት፡ ለይስማዔል
  english_pob_choice: she became jealous of Ishmael
  chosen_korean: 이스마엘을 질투하여
  alternatives_korean:
  - 이스마엘에게 질투를 품어
  - 이스마엘을 시기하여
  lexicon: 질투하다
  rationale: 문맥상 감정은 단순한 ‘시기’보다 관계적 적대감을 띤 ‘질투’가 더 적절하여, 영어 POB의 jealous를 직역하지 않고 자연스럽게 옮겼습니다.
- source_word: ወትቤሎ፡ ለአብርሃም፡ ስድድ፡ ዛተ፡ ወሰተ
  english_pob_choice: Cast out this maidservant and her son.
  chosen_korean: 이 여종과 그 아들을 내쫓으십시오.
  alternatives_korean:
  - 이 종녀와 그 아들을 쫓아내십시오.
  - 이 여종과 그 아들을 내보내십시오.
  lexicon: 여종
  rationale: 개정 전통의 ‘계집종’보다 현대 표준어에서는 ‘여종’이 중립적이고, 기존 POB 주석이 가리키는 사회적 신분(maidservant)을 보존합니다.
theological_decisions:
- issue: 사라의 발화에 대한 직접 명령의 격식
  chosen_reading: 아브라함에게 정중한 명령형(내쫓으십시오)으로 옮겼습니다.
  alternative_readings:
  - 내쫓으세요
  - 내쫓으라
  rationale: 서사 속 가족 간 대화이지만, 한국어 성경 문체의 공적·서사적 품격을 유지하면서도 합쇼체를 요구하는 목표 शैली를 따랐습니다.
  doctrine_reference: 문체/서사 화자 register
- issue: ‘maidservant’의 신분 표지
  chosen_reading: ‘여종’으로 번역해 종속적 신분을 드러냈습니다.
  alternative_readings:
  - 여자
  - 여인
  rationale: 영어 POB가 previous_rendering 주석으로 신분 의미를 유지하므로, 단순한 ‘여자’로 완화하지 않고 사회적 종속 관계를 보존했습니다.
  doctrine_reference: 사회적 신분의 본문적 보존
