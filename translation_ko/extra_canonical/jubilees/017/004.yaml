review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys all principal clauses in the Ge''ez source: Sarah sees Ishmael joking/playing and dancing, sees Abraham rejoicing greatly, becomes jealous of Ishmael, and tells Abraham to expel the maidservant and her son. However, ‘희롱하며’ normally suggests directing derision or harassment at someone and is less source-neutral than the source and English audit trail’s ‘joking.’'
  naturalness: The repeated ‘것을 보고’ is grammatical but cumbersome. Coordinating the two things Sarah sees yields more natural modern Korean narrative prose.
  terminology: ‘여종’ appropriately preserves the maidservant’s subordinated social status. The alternate reflected in the English audit note should be supplied as a Korean footnote and anchored directly to ‘여종.’
  issues:
  - severity: medium
    issue: ‘희롱하며’ adds a potentially hostile, transitive sense.
    rationale: In current Korean, ‘희롱하다’ commonly means to tease, mock, or harass a person. ‘장난하고’ retains the source’s and audit trail’s broader, less interpretively loaded sense of joking/playing.
  - severity: low
    issue: Footnote marker is not placed at its referent and no Korean footnote set is provided.
    rationale: The audit trail supplies an alternate (‘this woman’). It should be rendered and anchored to ‘여종’ for a structurally complete Korean footnote set.
  revised_text: 사라는 이스마엘이 장난하고 춤추는 것과 아브라함이 크게 기뻐하는 것을 보고, 이스마엘을 질투하여 아브라함에게 말했습니다. 「이 여종[a]과 그 아들을 내쫓으십시오.」
  revised_footnotes:
