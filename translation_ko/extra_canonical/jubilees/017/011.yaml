  text: She went a bowshot away, because she said, “Let me not see the death of my child,” and she sat and wept. And an angel of God, one of the holy ones, said to her, “What are you weeping for, Hagar? Rise, take up the child, and hold him with your hand, for God has heard your voice and has seen the child.”
  footnotes:
  - marker: a
    text: Or 'She went a little distance away'.
    reason: previous_rendering
  - marker: b
    text: Or 'and she sat opposite him, weeping.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀는 아들의 죽음을 보지 않으려고 화살이 날아가는 거리만큼 물러가 앉아 울었습니다. 그때 하나님의 천사, 곧 거룩한 이들 가운데 하나가 그녀에게 말했습니다. “하갈아, 네가 왜 울고 있느냐? 일어나 아이를 데려다가 네 손으로 붙들어 주어라. 하나님께서 네 목소리를 들으셨고 아이를 보셨기 때문이다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐቲ፡ ምንዳፍ፡
  english_pob_choice: a bowshot away
  chosen_korean: 화살이 날아가는 거리만큼
  alternatives_korean:
  - 활시위가 미치는 거리만큼
  - 조금 떨어진 곳으로
  lexicon: mndaf
  rationale: POB의 ‘bowshot away’를 살려 구체적 거리표현을 유지하되, 한국어에서는 자연스럽게 풀어 ‘화살이 날아가는 거리만큼’으로 옮겼습니다.
- source_word: ወነቢራ፡ በከየት።
  english_pob_choice: and she sat and wept
  chosen_korean: 앉아 울었습니다
  alternatives_korean:
  - 그리고 그녀는 앉아 울었습니다
  - 그녀는 앉아서 울고 있었습니다
  lexicon: nabara / bakayat
  rationale: 게에즈의 단순한 동작 연쇄를 따라 ‘앉아 울었습니다’로 간결하게 옮기고, 존재하지 않는 ‘맞은편’ 의미는 넣지 않았습니다.
- source_word: አሐዱ፡ እምቅዱሳን፡
  english_pob_choice: one of the holy ones
  chosen_korean: 거룩한 이들 가운데 하나
  alternatives_korean:
  - 성도들 가운데 하나
  - 성인들 가운데 하나
  lexicon: qiddusan
  rationale: 직역적으로는 ‘거룩한 자들 가운데 하나’이지만, 한국어에서는 인물 지칭을 자연스럽게 하여 천사의 소속을 분명히 했습니다.
- source_word: ንሥእዮ፡ ለኅፃን፡ ወአንዝዮ፡ በእዴኪ።
  english_pob_choice: take up the child, and hold him with your hand
  chosen_korean: 아이를 데려다가 네 손으로 붙들어 주어라
  alternatives_korean:
  - 아이를 안아라, 그리고 네 손으로 붙들어라
  - 아이를 잡아 네 손으로 붙들어라
  lexicon: nasa / anzaya
  rationale: ‘hold him with your hand’의 감각을 살리되 한국어에서는 보호·지지의 의미가 드러나도록 ‘붙들어 주어라’로 번역했습니다.
- source_word: ሰምዐ፡ ... ወርእዮ፡
  english_pob_choice: has heard ... and has seen
  chosen_korean: 들으셨고 ... 보셨기 때문이다
  alternatives_korean:
  - 들으셨고 ... 살피셨기 때문이다
  - 응답하셨고 ... 보셨기 때문이다
  lexicon: smʿ / raʾa
  rationale: 하나님의 청취와 관찰을 평행으로 유지하여, 위로의 근거를 명시적으로 드러냈습니다.
theological_decisions:
- issue: 천사가 자기 정체를 어떻게 제시하는가
  chosen_reading: ‘하나님의 천사, 곧 거룩한 이들 가운데 하나’로 옮겨 천사와 ‘거룩한 이들’의 병렬을 드러냈습니다.
  alternative_readings:
  - ‘하나님의 천사 중 하나’
  - ‘거룩한 천사 하나’
  rationale: 게에즈 본문은 천사를 ‘하나님의 천사’와 ‘거룩한 이들 가운데 하나’로 함께 묘사하므로, 둘 중 하나로 축소하지 않고 병렬 관계를 보존했습니다.
  doctrine_reference: 천사론 / 본문 표지 보존
- issue: ‘하갈아’의 직접 호칭과 명령형의 톤
  chosen_reading: 직접 호칭 ‘하갈아’를 살리고, 명령은 한국어 합쇼체 명령형 ‘-어라’로 옮겼습니다.
  alternative_readings:
  - 더 부드러운 권고형
  - 더 고어적인 종결형
  rationale: 천사의 권면이 단순 위로가 아니라 행동을 촉구하는 명령이므로, 본문의 긴박함을 살리는 직접적 어조를 유지했습니다.
  doctrine_reference: 서사 문맥의 화행 보존
