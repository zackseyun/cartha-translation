translation:
  language: ko
  text: 그리고 그의 어머니가 그를 데리고 가서 올리브나무 아래에 던져 두고, 그녀는 가서 멀리서 마주 보이는 곳에 앉았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነሥአቶ፡ እሙ፡
  english_pob_choice: his mother took him
  chosen_korean: 그의 어머니가 그를 데리고 가서
  alternatives_korean:
  - 그의 어머니가 그를 취하여
  - 그의 어머니가 그를 붙들고
  lexicon: 엄마/어머니; 취하다/데리고 가다
  rationale: 주어는 분명히 ‘그의 어머니’이며, 동작은 단순한 ‘취하다’보다 서술 흐름에 맞는 ‘데리고 가다’가 자연스럽습니다.
- source_word: ወገደፈቶ፡ ታኅተ፡ አሐቲ፡ እልያስ፡
  english_pob_choice: and cast him under an olive tree / under an olive tree
  chosen_korean: 올리브나무 아래에 던져 두고
  alternatives_korean:
  - 올리브나무 아래에 두고
  - 올리브나무 아래에 내려놓고
  lexicon: 던져 두다; 아래에
  rationale: Ge'ez의 ‘cast’는 단순 배치보다 거칠게 내던지는 동작을 내포하므로, 이를 살리되 한국어로는 ‘던져 두고’가 가장 직접적입니다.
- source_word: አንጻር፡ መጠነ፡
  english_pob_choice: opposite, at a distance
  chosen_korean: 멀리서 마주 보이는 곳에 앉았습니다
  alternatives_korean:
  - 맞은편, 떨어진 곳에 앉았습니다
  - 멀찍이 마주한 곳에 앉았습니다
  lexicon: 마주하다/맞은편; 멀리서
  rationale: 장소 관계 두 개를 모두 살리기 위해 ‘마주 보이는 곳’과 ‘멀리서’를 결합해, 단순한 ‘옆’이 아니라 떨어져 마주한 위치를 드러냈습니다.
