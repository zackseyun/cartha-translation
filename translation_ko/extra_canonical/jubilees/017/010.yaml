  source_fidelity: 핵심 사건 순서는 대체로 충실하나, ‘그를 데리고 가서’는 원문의 단순한 ‘그를 취하여/데려다가’에 이동 의미를 더하며, 뒤의 ‘가서’와도 중복될 수 있습니다. 또한 ‘마주 보이는 곳’은 ‘맞은편’이라는 장소 관계를 부정확하고 다소 장황하게 표현합니다.
