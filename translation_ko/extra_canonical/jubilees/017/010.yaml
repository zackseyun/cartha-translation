  terminology: ‘올리브나무’와 ‘던져 두고’는 적절합니다. 원문의 ‘한’은 부정관사적 용법일 수 있으므로 본문은 자연스럽게 무표지로 두되, 가능한 수량적 이해는 각주로 보존하는 것이 좋습니다.
