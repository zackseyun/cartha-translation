  source_fidelity: 첫머리 ሕፃና는 앞 절에서 이어지는 ‘그녀의 아이를’이라는 목적어적 잔여 표현이지, 인용문 ‘그 아이입니다’가 아닙니다. 또한 마지막 동사는 어머니가 아들을 위하여 아내를 취해 주는 행위이므로 ‘데려왔습니다’보다 ‘아내를 얻어 주었습니다’가 더 충실합니다.
