  terminology: 고유명사는 ‘파란’, 신명은 ‘주님’으로 유지할 수 있습니다. ‘이집트의 딸들’은 관용적으로 이집트 여성들을 뜻하므로 ‘이집트 여자들 가운데서’가 적절합니다.
