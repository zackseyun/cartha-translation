revisions:
- from: “그 아이입니다.” 그리고 그녀는 일어나 파란 광야 쪽으로 갔습니다. 그 아이는 자랐고 활쏘는 사람이 되었으며, 주님께서 그와 함께 계셨습니다. 그의 어머니는 그에게 이집트 여자들 가운데서 아내를 하나 데려왔습니다.[a]
  to: 그녀의 아이를. 그리고 그녀는 일어나 파란 광야 쪽으로 갔습니다.[a] 그 아이는 자라서 궁수가 되었고, 주님께서 그와 함께 계셨습니다. 그의 어머니는 그를 위하여 이집트 여자들 가운데서 아내를 얻어 주었습니다.
  rationale: 첫 단어를 앞 절에 걸리는 단편으로 보존하여 원문의 절 분할상 어색함을 과도하게 보완하지 않았습니다. 방향 전치 표현은 ‘쪽으로’로 유지했고, 궁수·신명·이집트 여성이라는 핵심 의미도 보존했습니다. 마지막 구절은 어머니가 아들을 위해 아내를 마련한 뜻을 자연스러운 현대 한국어로 명확히 했습니다.
