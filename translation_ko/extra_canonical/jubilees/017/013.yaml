translation:
  language: ko
  text: 그녀의 아이를. 그리고 그녀는 일어나 파란 광야 쪽으로 갔습니다.[a] 그 아이는 자라서 궁수가 되었고, 주님께서 그와 함께 계셨습니다. 그의 어머니는 그를 위하여 이집트 여자들 가운데서 아내를 얻어 주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 아이가 자랐고, 그녀는 일어나 파란 광야에서 갔다.”
    reason: 영어 POB 감사 기록에 보존된 대안적 분절·해석을 한국어로 옮겼습니다. 본문은 제공된 게에즈 본문과 최신 감사 판단에 따라 첫 단어를 앞 절에서 이어지는 ‘그녀의 아이를’로 처리합니다.
lexical_decisions:
- source_word: ሕፃና
  english_pob_choice: her child
  chosen_korean: 그 아이입니다
  alternatives_korean:
  - 그의 어머니의 아이입니다
  - 그녀의 아이입니다
  - 아이입니다
  lexicon: Geez ሕፃን/ሕፃና
  rationale: 문맥상 앞절에 걸린 대명사적 잔여 표현으로 보이므로, 영어 POB의 ‘her child’를 따라 ‘그 아이’로 자연스럽게 처리하되, 과도한 재진술을 피했습니다.
- source_word: መንገለ፡ በድው፡ ፍራም
  english_pob_choice: toward the wilderness of Paran
  chosen_korean: 파란 광야 쪽으로
  alternatives_korean:
  - 파란 광야로
  - 파란 광야에서
  - 파란 광야 안으로
  lexicon: Geez መንገለ + በድው ፍራም
  rationale: መንገለ의 ‘toward’ 방향성을 살려 ‘쪽으로’로 옮겼고, 장소명 ‘파란’은 음역을 유지했습니다.
- source_word: ነዳፌ
  english_pob_choice: he became an archer
  chosen_korean: 활쏘는 사람이 되었습니다
  alternatives_korean:
  - 궁수가 되었습니다
  - 사수가 되었습니다
  - 활잡이가 되었습니다
  lexicon: Geez ነዳፌ
  rationale: 단순 직업명보다 기술·정체성을 함께 드러내는 표현이어서, 전통적이지만 다소 문어적인 ‘궁수’보다 현대 한국어에서 분명한 ‘활쏘는 사람’을 택했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  lexicon: Geez divine title
  rationale: 이 절은 창세기 전승의 서술을 따라 ‘the Lord’를 지시하므로, 한국어 본문에서는 자연스러운 신칭 ‘주님’을 사용했습니다.
- source_word: እምአዋልደ፡ ግብጽ
  english_pob_choice: from the daughters of Egypt
  chosen_korean: 이집트 여자들 가운데서
  alternatives_korean:
  - 이집트의 딸들 가운데서
  - 이집트 처녀들 가운데서
  - 이집트 여자들 중에서
  lexicon: Geez idiom for women of Egypt
  rationale: 직역의 ‘딸들’은 한국어에서 불필요하게 가족관계로 읽힐 수 있어, 여성 집단을 가리키는 관용을 살려 ‘여자들 가운데서’로 옮겼습니다.
theological_decisions:
- issue: 본문의 인물 지시가 앞절과 연결되는 방식
  chosen_reading: 첫 문장은 앞절과 이어지는 잔여 표현으로 보고, 독립적인 서술이 아니라 연결된 문맥의 일부로 처리했습니다.
  alternative_readings:
  - 독립 절로 보고 ‘그 아이’만 따로 번역
  - 생략된 주어를 보충하여 서술형으로 정리
  rationale: 게에즈 본문과 영어 POB 주석 모두 이 구절이 절 경계 때문에 분절된 잔여 표현임을 시사하므로, 과도한 재구성을 피하는 것이 본문 충실도에 유리합니다.
  doctrine_reference: 문맥 연속성 / 절 분할 처리
