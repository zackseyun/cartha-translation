  source_fidelity: 첫 구절의 ይሰድዶሙ는 복수 목적어를 취하며, 앞 절에 이어지는 종속적 미완료 표현입니다. 현 번역의 단수 ‘그’, 과거의 신적 사역 표현 ‘보내게 하셨습니다’는 모두 원문과 맞지 않습니다. 이를 ‘그들을 … 내보내야 한다는’으로 고쳤습니다. ‘아이’와 ‘종녀’, 사라의 말에 귀 기울여 실행하라는 명령은 유지했습니다.
