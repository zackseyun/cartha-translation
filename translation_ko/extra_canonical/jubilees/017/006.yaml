base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/006.yaml
  text: that he should send them away from him. And the Lord said to Abraham, “Do not let it be grievous in your sight because of the boy and because of the slave woman. Whatever Sarah says to you, listen to her voice and do it.”
  footnotes:
  - marker: a
    text: Or 'He sent them away from him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들을 자기 곁에서 내보내야 한다는 것이었습니다. 그러자 주님께서 아브라함에게 말씀하셨습니다. “아이와 종녀 때문에 괴롭게 여기지 마십시오. 사라가 당신에게 하는 말은 무엇이든지 그 말에 귀를 기울여 그대로 행하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 자기에게서 내보내셨다.”
    reason: 첫 구절의 동사는 문맥상 앞 절에 이어지는 ‘내보내야 한다’라는 종속 표현으로 이해되지만, 과거 서술로 이해하는 번역도 있습니다.
lexical_decisions:
- source_word: ይሰድዶሙ፡ እምኀቤሁ
  english_pob_choice: that he should send them away from him
  chosen_korean: 그를 자기에게서 보내게 하셨습니다
  alternatives_korean:
  - 그들을 자기에게서 보내도록 하셨습니다
  - 그들을 자기에게서 떠나보내게 하셨습니다
  lexicon: send away / dismiss
  rationale: Ge'ez의 미완료·종속 뉘앙스를 살려 완료 서술이 아니라 ‘-게 하셨습니다’로 옮겼고, 문맥상 아브라함이 아니라 주님이 그 상황을 허용/명령하신 흐름을 반영했습니다.
- source_word: እግዚአብሔር፡
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 주
  lexicon: God/LORD
  rationale: 이 절의 호칭은 서사적 대화에서의 신적 발화 표지이므로 합쇼체의 직접 화법에 맞게 ‘주님’으로 옮겼습니다.
- source_word: ሐዘን፡ ቅድመ፡ አዕይንቲከ፡
  english_pob_choice: Do not let it be grievous in your sight
  chosen_korean: 네 눈에 괴롭게 여기지 말라
  alternatives_korean:
  - 네 눈앞에서 슬퍼하지 말라
  - 네게 괴로운 일로 여기지 말라
  lexicon: be grievous / in your sight
  rationale: 관용적 표현을 살리되, ‘눈에’라는 원문의 시각적 관용을 유지해 내적 번뇌보다 판단/수용의 문제임을 드러냈습니다.
- source_word: ሕፃን፡ ወበእንተ፡ ወለት
  english_pob_choice: because of the boy and because of the slave woman
  chosen_korean: 아이와 종녀 때문에
  alternatives_korean:
  - 아이와 여종 때문에
  - 아이와 노예 여자 때문에
  lexicon: boy / slave woman
  rationale: POB의 'slave woman' 선택을 따라 **종녀**를 사용해 종속 상태를 드러냈고, ‘because of’는 한국어 자연성을 위해 ‘때문에’로 압축했습니다.
- source_word: ሣራ፡ ስማዕ፡ ቃለ፡ ወግበር፡
  english_pob_choice: Whatever Sarah says to you, listen to her voice and do it
  chosen_korean: 사라가 네게 말하는 것은 무엇이든지 그녀의 목소리를 듣고 행하라
  alternatives_korean:
  - 사라가 네게 말하는 것은 무엇이든지 들어주고 행하라
  - 사라가 네게 말하는 것은 무엇이든지 그 말에 귀 기울이고 행하라
  lexicon: listen to her voice and do it
  rationale: ‘목소리’는 단순 청취보다 권면/명령을 수용하는 히브리식 표현을 살리며, ‘행하라’로 행동 요구를 분명히 했습니다.
theological_decisions:
- issue: Hagar의 사회적 지위 표현
  chosen_reading: 종녀
  alternative_readings:
  - 여종
  - 노예 여자
  rationale: 이 장면은 단순한 가사노동이 아니라 종속된 신분을 드러내는 본문이므로, POB의 'slave woman' 문제의식을 유지하면서도 한국어에서 다소 직역적인 ‘종녀’를 택했습니다.
  doctrine_reference: 사회적·법적 종속 상태를 드러내는 성서 번역 원칙
- issue: 직접 화법의 어조
  chosen_reading: 그녀의 목소리를 듣고 행하라
  alternative_readings:
  - 그 말에 순종하라
  - 그녀의 말을 들으라
  rationale: 원문은 단순한 청취가 아니라 구체적 실행까지 요구하므로, ‘순종’보다 덜 교회적이면서도 명령의 강도를 유지하는 표현으로 옮겼습니다.
  doctrine_reference: 서사 본문에서의 명령-응답 구조
