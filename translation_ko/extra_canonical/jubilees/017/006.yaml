  rationale: 첫 구절을 앞 절에 이어지는 종속적 미완료 의미로 바로잡고 복수 목적어를 회복했습니다. 하나님이 아브라함에게 말한 뒤의 직접 화법은 현대 합쇼체로 통일했으며, ‘목소리를 듣다’라는 셈어 관용은 한국어에서 자연스러운 ‘그 말에 귀를 기울이다’로 옮겼습니다. 각주 표지는 해당 쟁점이 있는 첫 구절에 배치했습니다.
