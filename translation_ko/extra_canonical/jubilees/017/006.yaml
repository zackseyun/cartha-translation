revisions:
- from: 그를 자기에게서 보내게 하셨습니다. 그리고 주님께서 아브라함에게 말씀하셨습니다. "아이와 종녀 때문에 네 눈에 괴롭게 여기지 말라. 사라가 네게 말하는 것은 무엇이든지 그녀의 목소리를 듣고 행하라."[a]
