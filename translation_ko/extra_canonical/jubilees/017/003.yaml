  - severity: low
    issue: ‘창조주를 찬양하였습니다’는 원문의 동사를 다소 일반화합니다.
    rationale: ወባረኮ는 ‘축복하다, 송축하다’에 해당합니다. 하나님을 향한 경배 문맥에서는 ‘송축하다’가 자연스럽고 원어 동사의 의미도 더 보존합니다.
  - severity: medium
    issue: '[a] 각주의 내용과 앵커가 현행 본문에 맞지 않습니다.'
    rationale: ‘to cover the earth’는 채택되지 않은 이전 독법이며, 현행 앵커는 ‘창조주를 찬양하였습니다’에 붙어 있어 해당 어구와도 관련이 없습니다. 삭제해야 합니다.
