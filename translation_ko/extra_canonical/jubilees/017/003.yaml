  text: And he remembered the word that He had spoken to him on the day when Lot was separated from him, and he rejoiced because the Lord had given him seed upon the earth to inherit the earth, and he blessed the Creator with all his mouth.
  footnotes:
  - marker: a
    text: Or 'to cover the earth'.
    reason: previous_rendering
  - marker: b
    text: Or 'the words that he had spoken'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 롯이 그에게서 갈라져 나가던 날에 주님께서 그에게 하신 말씀을 기억하였으며, 주님께서 그에게 땅 위에 씨를 주셔서 그가 땅을 유업으로 받게 하셨으므로 기뻐하였고, 입을 다하여 창조주를 송축하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃሎ፡ ዘተናገሮ፡
  english_pob_choice: the word that He had spoken / the words that he had spoken
  chosen_korean: 그에게 하신 말씀
  alternatives_korean:
  - 그가 하신 말씀
  - 그에게 전하신 말씀
  - 그 말
  lexicon: 말씀
  rationale: 게에즈 원문은 단수 ‘말씀’에 가깝고, 동사의 목적어 표지가 있어 ‘그에게’가 분명하므로 ‘그에게 하신 말씀’으로 옮겨 인칭 관계를 드러냈습니다.
- source_word: ወሀቦ፡ እግዚአብሔር፡ ዘርአ፡ በዲበ፡ ምድር፡
  english_pob_choice: the Lord had given him seed upon the earth
  chosen_korean: 주님께서 그에게 땅 위에 씨를 주셔서
  alternatives_korean:
  - 주님께서 그에게 씨를 주셔서
  - 주님께서 땅 위에 씨를 그에게 주셔서
  - 주님께서 그에게 땅의 씨를 주셔서
  lexicon: 씨 / 땅 위에
  rationale: ‘씨’는 자손을 뜻하는 직접 표현으로 유지했고, ‘땅 위에’는 원문의 장소 표현을 살려 자손이 지면에 퍼지는 그림을 보존했습니다.
- source_word: ከመ፡ ይረሳ፡ ለምድር፡
  english_pob_choice: to inherit the earth
  chosen_korean: 땅을 유업으로 받게 하셨으므로
  alternatives_korean:
  - 땅을 상속받게 하셨으므로
  - 땅을 차지하게 하셨으므로
  - 땅을 물려받게 하셨으므로
  lexicon: 유업으로 받다
  rationale: 주어진 수정 사항에 따라 동사를 ‘inherit’로 이해해야 하므로, 성경 한국어에서 자연스럽고 신학적으로도 적절한 ‘유업으로 받다’를 택했습니다.
- source_word: ወባረኮ፡ በኵሉ፡ አፉሁ፡ ለፈጣሪ፡
  english_pob_choice: and he blessed the Creator with all his mouth
  chosen_korean: 온 입으로 창조주를 찬양하였습니다
  alternatives_korean:
  - 온 입으로 창조주를 축복하였습니다
  - 입술을 다해 창조주를 찬양하였습니다
  - 온 입으로 창조주를 송축하였습니다
  lexicon: 찬양하다 / 창조주
  rationale: 원문 동사는 문자적으로 ‘축복하다’이지만, 대상이 ‘창조주’인 점과 한국어 예배 문맥에서의 자연스러움을 고려해 ‘찬양하다’로 옮겼습니다. ‘온 입으로’는 전면적 발화의 의미를 보존합니다.
theological_decisions:
- issue: ‘야훼’ 대체 여부
  chosen_reading: 본문의 እግዚአብሔር은 한국어에서 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 문맥은 창세기 전승을 요약하는 외경 본문으로, 직접 인용된 고유명 YHWH 표기라기보다 서사적 호칭으로 기능하므로 현대 합쇼체에서 자연스러운 ‘주님’이 적절합니다.
  doctrine_reference: 서사 내 신칭의 번역 관례
- issue: ‘창조주를 축복하다’의 의미 처리
  chosen_reading: ‘축복하다’의 직역성을 완전히 지우지 않고, 문장 전체 의미는 ‘찬양하다’로 자연화했습니다.
  alternative_readings:
  - 창조주를 축복하였습니다
  - 창조주를 송축하였습니다
  rationale: 하나님을 ‘축복’한다는 표현은 한국어에서 오해를 일으킬 수 있어, 원문의 경배적 행위를 드러내는 방향으로 조정하되, 주체가 하나님을 향해 말한 점은 보존했습니다.
  doctrine_reference: 경배 언어의 의미 보존
