revisions:
- from: 그리고 그는 롯이 자기에게서 갈라지던 날에 그에게 하신 말씀을 기억하였으며, 주님께서 그에게 땅 위에 씨를 주셔서 땅을 유업으로 받게 하셨으므로 기뻐하였고, 온 입으로 창조주를 찬양하였습니다.[a]
  to: 그리고 그는 롯이 그에게서 갈라져 나가던 날에 주님께서 그에게 하신 말씀을 기억하였으며, 주님께서 그에게 땅 위에 씨를 주셔서 그가 땅을 유업으로 받게 하셨으므로 기뻐하였고, 입을 다하여 창조주를 송축하였습니다.
  rationale: 롯의 분리 대상과 말씀의 화자를 명료하게 하되 원문의 인칭 관계를 보존했습니다. ‘땅 위에 씨’를 유지하고, ከመ ይረሳ ለምድር을 ‘그가 땅을 유업으로 받게 하셨으므로’로 옮겨 ‘inherit the earth’라는 확정된 독법을 반영했습니다. 마지막 동사는 ‘송축하다’로 수정하여 원문의 축복/경배 어휘를 더 직접적으로 살렸고, 무관하고 잘못 연결된 각주를 삭제했습니다.
