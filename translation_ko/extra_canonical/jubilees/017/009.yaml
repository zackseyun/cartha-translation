  text: And he took bread and a skin of water and put them on Hagar's shoulder, and the child, and sent her away. And she went and wandered in the wilderness of Beersheba, and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell.
  footnotes:
  - marker: a
    text: Or 'and gave them to Hagar and the child, and sent them away.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 빵과 물 한 가죽부대를 가져다가 하갈의 어깨에, 곧 아이에게 지우고 그녀를 보내 버렸습니다. 그녀는 브엘세바 광야로 가서 방황하였고, 가죽부대의 물이 떨어졌으며, 아이는 목말라 걸어갈 수 없었고 쓰러졌습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነሥአ፡ *ሐባወ-ዝ፡ ወዝቀ፡ ማይ፡
  english_pob_choice: he took bread and a skin of water
  chosen_korean: 빵과 물 한 가죽부대를 가져다가
  alternatives_korean:
  - 빵과 물 한 가죽부대를 집어다가
  - 빵과 물 한 부대의 물을 가져다가
  lexicon: bread, water skin
  rationale: Ge'ez의 ‘빵과 물’과 ‘물 가죽부대’를 자연스럽게 살리되, 한국어에서는 물의 용기까지 포함해 ‘한 가죽부대’로 표현하는 것이 원문을 가장 정확히 전달합니다.
- source_word: ወአስከማ፡ ለአጋር፡ ወለሕፃን፡
  english_pob_choice: and put them on Hagar's shoulder, and the child
  chosen_korean: 하갈의 어깨에, 곧 아이에게 지우고
  alternatives_korean:
  - 하갈의 어깨에, 그리고 아이에게 메게 하고
  - 하갈과 아이에게 지워
  lexicon: put on the shoulder / load onto
  rationale: 주석의 수정 기록이 보여 주듯이 동사는 단순 ‘주다’가 아니라 ‘어깨에 지우다/메게 하다’의 뜻이므로, 하갈과 아이가 함께 짐을 지는 장면을 드러내는 표현을 택했습니다.
- source_word: ወፈነዋ።
  english_pob_choice: and sent her away
  chosen_korean: 그녀를 보내 버렸습니다
  alternatives_korean:
  - 그녀를 떠나보냈습니다
  - 그녀를 내보냈습니다
  lexicon: send away
  rationale: 목적어가 여성 단수인 점을 반영하여 하갈을 지칭하게 하고, 관계를 끊어 내보내는 뉘앙스를 한국어의 ‘보내 버렸습니다’로 살렸습니다.
- source_word: ወሖረት፡ ወተንገገ፡ በገዳመ፡ ቤርሳቤ፡
  english_pob_choice: And she went and wandered in the wilderness of Beersheba
  chosen_korean: 그녀는 브엘세바 광야로 가서 방황하였고
  alternatives_korean:
  - 그녀는 브엘세바 광야에서 방황하였고
  - 그녀는 브엘세바 광야를 헤매었고
  lexicon: wander in the wilderness
  rationale: ‘방황하다’는 단순 이동보다 방향을 잃고 헤매는 뜻을 분명히 하며, ‘브엘세바 광야’는 지명과 지형을 그대로 옮겼습니다.
- source_word: ወተፈጸመ፡ ማይ፡ እምዝቅ፡ ወጸምአ፡ ሕፃን፡ ወስእነ፡ ሐዊረ፡ ወወድቀ።
  english_pob_choice: and the water in the skin was finished, and the child was thirsty and was unable to walk, and he fell
  chosen_korean: 가죽부대의 물이 떨어졌으며, 아이는 목말라 걸어갈 수 없었고 쓰러졌습니다
  alternatives_korean:
  - 가죽부대의 물이 다하였고, 아이는 목말라 걸어갈 수 없었고 쓰러졌습니다
  - 가죽부대의 물이 마르고 아이가 목말라 걷지 못해 넘어졌습니다
  lexicon: was finished / thirsty / unable to walk / fell
  rationale: ‘완전히 떨어지다’는 뜻의 종결을 ‘물이 떨어졌으며’로, ‘walk’는 단순 ‘걷다’보다 상황에 맞는 ‘걸어갈 수 없다’로 옮겼습니다.
theological_decisions:
- issue: 이 장면의 서술 강도
  chosen_reading: 원문의 냉정한 사건 진행을 유지해, 아브라함의 행동이 하갈과 아이를 실제로 곤궁에 빠뜨리는 결과를 직접 드러냈습니다.
  alternative_readings:
  - 완곡하게 ‘보내 주었습니다’로 순화함
  - 결과를 덜 직설적으로 표현함
  rationale: 히브리/게즈 서사 자체가 감정 완화보다 사건의 잔혹함과 긴장을 강조하므로, 한국어도 그 힘을 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: 서사 문맥의 직설성 보존
