  to: 그는 빵과 물 한 가죽부대를 가져다가 하갈의 어깨에 지우고 아이를 그녀에게 맡긴 뒤, 그녀를 떠나보냈습니다. 그녀는 브엘세바 광야로 가서 방황하였고, 가죽부대의 물이 떨어졌으며, 아이는 목말라 걸어갈 수 없었고 쓰러졌습니다.
