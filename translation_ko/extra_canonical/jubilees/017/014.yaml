  text: And she bore him a son and he called his name Nabaioth, for she said, “The Lord is near to me.”
  footnotes:
  - marker: a
    text: Or 'and called'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그녀는 그에게 아들을 낳았고, 그는 그의 이름을 나바이옷이라 불렀습니다. 그녀가 말하기를 「주님께서 내게 가까우십니다」라고 하였기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለደት / ወጸውዐ
  english_pob_choice: she bore ... and he called
  chosen_korean: 그녀는 그에게 아들을 낳았고, 그는 그의 이름을 …이라 불렀습니다
  alternatives_korean:
  - 그녀가 그에게 아들을 낳았고, 그녀가 그의 이름을 …이라 불렀습니다
  - 그녀가 그에게 아들을 낳고 이름을 …이라 지었습니다
  lexicon: 낳다 / 부르다
  rationale: 게즈 원문은 여성 주어의 ‘낳다’와 남성 주어의 ‘부르다/호명하다’를 구분하므로, 이름을 정한 주체가 아버지라는 점을 살려야 합니다.
- source_word: ናቤዮት
  english_pob_choice: Nabaioth
  chosen_korean: 나바이옷
  alternatives_korean:
  - 나바이오트
  - 나바욧
  lexicon: 고유명사 음역
  rationale: 영문 POB의 Nabaioth를 한국어 음역으로 옮기되, 성경 고유명사로서 읽기 자연스러운 표기를 택했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: The Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  - 야훼
  lexicon: 신명 대역
  rationale: 여기서는 직접적인 야훼 인용 표지가 아니라 서술 속 인용된 말이므로, 문맥상 자연스러운 ‘주님’을 택했습니다.
- source_word: ቅሩብ ... ሊተ
  english_pob_choice: is near to me
  chosen_korean: 내게 가까우십니다
  alternatives_korean:
  - 내게 가까이 계십니다
  - 내게 가까우십니다
  lexicon: 가깝다
  rationale: 하나님의 임재가 가까움을 드러내는 표현이므로 단순 거리감보다 인격적·관계적 가까움을 살렸습니다.
theological_decisions:
- issue: 명명 주체와 어머니의 진술을 함께 보존할 것인지
  chosen_reading: 아버지가 이름을 불렀고, 이어서 어머니의 이유 설명이 따라오는 구조로 보존했습니다.
  alternative_readings:
  - 아버지가 아닌 어머니가 이름을 지은 것으로 평준화
  - 두 동작을 모두 한 주체가 한 것으로 처리
  rationale: 원문은 ‘그가 불렀다’와 ‘그녀가 말했다’를 분리하여 가족 내 역할을 구분합니다. 이를 흐리면 서술의 의미가 약해집니다.
  doctrine_reference: 본문 서술의 문법적 주어 구분 보존
- issue: ‘The Lord’의 한국어 처리
  chosen_reading: 직접 계시 인용이 아닌 서술 내 어머니의 고백이므로 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 이스라엘 성경의 직접 인용 표지보다 인물의 고백을 전달하는 서술이므로, 독자가 즉시 이해할 수 있는 공손한 호칭을 사용했습니다.
  doctrine_reference: 서술체 내 신명 호칭의 문맥적 번역
