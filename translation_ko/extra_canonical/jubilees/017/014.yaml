  rationale: 남성과 여성 주어의 문법적 구별을 그대로 유지하면서, 한국어 관용에 맞게 표현을 다듬고 정착된 성경 인명 표기로 통일했습니다. 영어 이전 표현에 관한 비본문적 각주는 제거했습니다.
