    rationale: 영어 감사 기록의 ‘Or and called’는 이전 영어 표현에 관한 메모일 뿐, 한국어 본문에 필요한 독자용 본문비평 각주가 아닙니다. 해당 표지는 본문 의미를 보충하지 않고 한국어 각주로도 제공되지 않았으므로 삭제합니다.
