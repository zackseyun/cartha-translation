  source_fidelity: 게즈어는 ‘그녀가 낳았다’(여성 단수), ‘그가 이름을 불렀다’(남성 단수), ‘그녀가 말했다’(여성 단수)를 명확히 구별합니다. 개정문은 이 주어 구분과 명명 이유를 보존합니다.
  naturalness: 초안의 ‘그의 이름을’은 한국어 서사에서 다소 직역투이므로 ‘그 이름을’로 고쳤습니다. 또한 ‘가까우십니다’보다 임재의 의미를 자연스럽게 드러내는 ‘가까이 계십니다’를 사용했습니다.
  terminology: 성경 인명 통용 표기인 ‘느바욧’을 사용했습니다. እግዚአብሔር는 문맥에 맞게 ‘주님’으로 유지했습니다.
  issues:
