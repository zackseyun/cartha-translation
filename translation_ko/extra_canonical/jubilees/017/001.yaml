base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/017/001.yaml
  text: And the Lord knew that Abraham was faithful in all his trials; for he had tested him in his country, and with famine, and had tested him through the wealth of kings, and again had tested him through his wife when she was taken away, and through circumcision, and had tested him through Ishmael and Hagar his maidservant when he sent them away. And in everything by which he had tested him, he was found faithful, and his soul was not impatient, and he did not delay in acting; for he was faithful and a lover of the Lord.
translation:
  language: ko
  text: 주님께서는 아브라함이 그가 겪은 모든 시험에서 신실하다는 것을 아셨습니다. 이는 주님께서 그의 땅에서, 또 기근으로, 또 왕들의 재물을 통하여 그를 시험하셨고, 다시 그가 아내를 빼앗겼을 때와 할례로 그를 시험하셨으며, 그가 이스마엘과 자기 여종 하갈을 보냈을 때에도 그를 시험하셨기 때문입니다. 그를 시험하신 모든 일에서 그는 신실한 사람으로 드러났고, 그의 영혼은 조급해하지 않았으며, 그는 행동하기를 지체하지 않았습니다. 그는 신실했고 주님을 사랑하는 사람이었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያአምር
  english_pob_choice: knew
  chosen_korean: 아셨습니다
  alternatives_korean:
  - 알고 계셨습니다
  - 아셨습니다
  lexicon: Geez ዐመረ/ያአምር
  rationale: 하나님의 인지 행위를 단순한 정보 습득이 아니라 관계적 인식으로 자연스럽게 옮기되, 과도한 해설은 덧붙이지 않았습니다.
- source_word: መሃይምን
  english_pob_choice: faithful
  chosen_korean: 신실한
  alternatives_korean:
  - 믿음직한
  - 충실한
  - 신실한
  lexicon: Geez ምእመን
  rationale: 반복되는 시험 속에서 드러난 아브라함의 상태를 ‘믿음’의 결과라기보다 ‘신실함’으로 표현하는 것이 원문과 영어 POB의 결을 가장 잘 반영합니다.
- source_word: በኵሉ፡ ምንዳቤሁ
  english_pob_choice: in all his trials
  chosen_korean: 그의 모든 시험에서
  alternatives_korean:
  - 그의 모든 환난에서
  - 그의 모든 고난 가운데서
  - 그의 모든 시험에서
  lexicon: Geez ምንዳቤ
  rationale: 문맥상 ‘afflictions’보다 ‘trials’가 반복되는 검증의 의미를 잘 살리므로, 시험으로 옮겨 원문의 반복 구조를 보존했습니다.
- source_word: ወበይስማዔል፡ ወበአጋር
  english_pob_choice: through Ishmael and Hagar his maidservant
  chosen_korean: 이스마엘과 자기 여종 하갈을 보낼 때에도
  alternatives_korean:
  - 이스마엘과 하갈, 그의 여종을 통해서도
  - 이스마엘과 자기 여종 하갈을 보낼 때에도
  lexicon: Geez አጋር
  rationale: 문맥의 핵심은 인물 목록 자체보다 ‘보냄’이라는 시험의 사건이므로, 영어 POB처럼 그 사건을 드러내는 방식으로 자연스럽게 정리했습니다.
- source_word: ኢተአገተት፡ ነፍሱ
  english_pob_choice: his soul was not impatient
  chosen_korean: 그의 영혼은 조급해하지 않았으며
  alternatives_korean:
  - 그의 영혼은 참지 못하지 않았으며
  - 그의 영혼은 조급하지 않았으며
  - 그의 영혼은 조급해하지 않았으며
  lexicon: Geez ነፍስ
  rationale: ‘영혼’이 단순 정서가 아니라 내면 전체를 가리키므로, ‘조급해하지 않다’로 옮겨 성급한 반응의 부재를 살렸습니다.
- source_word: ወኢጐንደየ፡ ገቢሮተ
  english_pob_choice: and he did not delay in acting
  chosen_korean: 그는 행동하기를 지체하지 않았습니다
  alternatives_korean:
  - 행동하는 데 지체하지 않았습니다
  - 행동하기를 미루지 않았습니다
  - 행동하기를 지체하지 않았습니다
  lexicon: Geez ገቢር
  rationale: 원문은 단순한 태도보다 실제 행위의 지체 없음에 초점이 있으므로 ‘행동하기를 지체하지 않았다’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 아브라함의 신실함을 ‘아셨다’는 표현의 의미
  chosen_reading: 본문은 하나님의 전지에 대한 새 정보가 아니라, 시험을 통해 드러난 아브라함의 신실함을 하나님께서 확인하셨다는 의미로 읽었습니다.
  alternative_readings:
  - 하나님이 단순히 미리 알고 계셨다는 의미
  - 하나님이 시험 후에야 알게 되셨다는 의미
  rationale: Geez 본문과 영어 POB 모두 시험의 결과로 아브라함의 신실함이 ‘드러남’에 초점을 두므로, 지식 획득이나 제한된 인식으로 오해되지 않도록 정리했습니다.
  doctrine_reference: 하나님의 전지와 인간의 신실함의 검증
