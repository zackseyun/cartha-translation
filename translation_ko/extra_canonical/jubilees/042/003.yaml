translation:
  language: ko
  text: 풍요의 일곱 해 동안 그가 그것을 저장해 두었습니다. 그리고 이집트 사람들이 요셉에게 와서 그가 그들에게 먹을 것을 주게 했으며, 그는 이전 해들의 곡식이 있던 창고들을 열어 그 땅의 백성들에게 금으로 팔았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በ፯ሰብዓቱ፡ ዓመት፡ ዘሠምር፡ ወዐቀቦ
  english_pob_choice: in the seven years of abundance and had kept it
  chosen_korean: 풍요의 일곱 해 동안 그가 그것을 저장해 두었습니다
  alternatives_korean:
  - 풍년의 일곱 해 동안 그것을 간직했습니다
  - 풍요로운 일곱 해 동안 그것을 보관했습니다
  lexicon: 저장해 두다
  rationale: 여기의 동사는 단순 보관보다 나중의 분배를 염두에 둔 ‘보존해 둠’을 나타내므로, 문맥상 자연스럽고 기능적으로 맞는 표현을 택했습니다.
- source_word: ግብጽ
  english_pob_choice: the Egyptians
  chosen_korean: 이집트 사람들이
  alternatives_korean:
  - 이집트인들이
  - 이집트 백성이
  lexicon: 이집트 사람들
  rationale: 게에즈 동사의 복수형과 수 일치를 살리면서도, 한국어에서는 집단명사보다 ‘사람들’이 문맥상 가장 자연스럽습니다.
- source_word: መዛግብተ፡ ... ስርናይ፡ ዘቀዳሚ፡ ዓመት
  english_pob_choice: the storehouses where the grain of the former years was
  chosen_korean: 이전 해들의 곡식이 있던 창고들
  alternatives_korean:
  - 옛 해들의 곡식이 있던 곳들
  - 지난 해들의 곡식이 있던 곳
  lexicon: 이전 해들 / 창고들
  rationale: ‘former years’는 단순히 ‘첫 해들’이 아니라 앞선 해들을 가리키므로, 시간 순서를 분명히 드러내는 ‘이전 해들’로 옮겼습니다.
- source_word: በወርቅ
  english_pob_choice: for gold
  chosen_korean: 금으로
  alternatives_korean:
  - 은으로
  - 금값에
  lexicon: 금
  rationale: 게에즈 본문이 분명히 ‘금’을 쓰므로, 영어 초기 초안의 ‘silver’가 아니라 수정판의 ‘gold’를 반영해 직역했습니다.
theological_decisions:
- issue: 보유와 판매의 경제적 묘사
  chosen_reading: 요셉이 곡식을 ‘저장해 두고’ 뒤에 ‘금으로 팔았습니다’라는 서술을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘비축했습니다’ 또는 ‘나누어 주었습니다’로 조정
  rationale: 본문은 기근 대응을 위한 실제 보존과 상업적 거래를 함께 말하므로, 둘 중 하나로 약화하지 않고 둘 다 드러내는 쪽이 원문에 충실합니다.
  doctrine_reference: 창세기계 전승/요셉 서사 해석
