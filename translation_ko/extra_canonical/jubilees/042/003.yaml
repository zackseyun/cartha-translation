  source_fidelity: 게에즈 본문의 복수 주어(‘이집트 사람들’)와 ‘금’은 정확히 반영했습니다. 그러나 ‘그가 그들에게 먹을 것을 주게 했으며’는 목적을 나타내는 구문을 이집트 사람들이 요셉으로 하여금 주도록 강제한 것처럼 바꾸므로 수정해야 합니다. 또한 상거래의 대가인 ‘금을 받고’를 써서 በወርቅ의 의미를 분명히 하는 편이 안전합니다.
  naturalness: 현 초안의 ‘주게 했으며’는 한국어에서 사동 의미가 강해 문맥과 맞지 않습니다. ‘먹을 것을 달라고 요셉에게 왔고’는 자연스럽고 원문의 목적·요청 문맥을 충실히 전달합니다.
  terminology: ‘풍요의 일곱 해’, ‘이집트 사람들’, ‘요셉’, ‘곡식’, ‘창고’, ‘금’은 현대 표준 한국어의 격식 있는 성경 문체에 적절합니다. 영어 감사 이력의 대안 독법 각주는 한국어로도 유지하되, 본문의 복수형 번역과 구별되게 제시합니다.
