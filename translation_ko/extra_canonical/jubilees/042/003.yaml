translation:
  language: ko
  text: 풍요의 일곱 해 동안 그가 그것을 저장해 두었습니다. 이집트 사람들이 먹을 것을 달라고 요셉에게 왔고, 그는 앞선 해들의 곡식이 있던 창고들을 열어 그 땅의 백성들에게 그것을 금을 받고 팔았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이집트가 왔다.”
    reason: 게에즈어 명사 ግብጽ는 ‘이집트’로도 옮길 수 있으나, 뒤따르는 동사와 대명사 접미사가 복수형이므로 본문에서는 ‘이집트 사람들이’로 번역했습니다.
