- from: 풍요의 일곱 해 동안 그가 그것을 저장해 두었습니다. 그리고 이집트 사람들이 요셉에게 와서 그가 그들에게 먹을 것을 주게 했으며, 그는 이전 해들의 곡식이 있던 창고들을 열어 그 땅의 백성들에게 금으로 팔았습니다.[a]
  to: 풍요의 일곱 해 동안 그가 그것을 저장해 두었습니다. 이집트 사람들이 먹을 것을 달라고 요셉에게 왔고, 그는 앞선 해들의 곡식이 있던 창고들을 열어 그 땅의 백성들에게 그것을 금을 받고 팔았습니다.[a]
