base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/042/004.yaml
  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: ko
  text: 그리고 가나안 땅에 큰 기근이 들었습니다. 야곱은 이집트에 곡식이 있다는 소식을 듣고, 자기 아들 열 명을 이집트로 보내 그 곡식을 가져오게 했습니다. 그러나 베냐민은 보내지 않았습니다. 야곱의 열 아들은 그와 함께 여행하던 사람들과 함께 이집트에 도착했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረኃብ ... ጥቀ
  english_pob_choice: the famine became very severe
  chosen_korean: 큰 기근이 들었습니다
  alternatives_korean:
  - 기근이 매우 심해졌습니다
  - 기근이 극심해졌습니다
  lexicon: 기근
  rationale: 게에즈 원문의 ‘매우 심한 기근’을 자연스러운 현대 한국어로 옮기되, 상태의 강도를 분명히 드러내기 위해 ‘큰’과 ‘기근’을 결합했습니다.
- source_word: ሲሲተ
  english_pob_choice: grain
  chosen_korean: 곡식
  alternatives_korean:
  - 양식
  - 식량
  lexicon: 곡식
  rationale: 영어 POB의 수정처럼 원문은 일반적 ‘food’보다 곡물/곡식의 뜻이 더 분명하므로, 한국어도 농산물 맥락을 살려 ‘곡식’으로 옮겼습니다.
- source_word: ወብንያምንሰ፡ አፈነወ
  english_pob_choice: But Benjamin he did not send
  chosen_korean: 그러나 베냐민은 보내지 않았습니다
  alternatives_korean:
  - 그러나 베냐민은 보내지 않았습니다
  - 베냐민만은 보내지 않았습니다
  lexicon: 베냐민
  rationale: 원문은 예외를 단호하게 말하므로, 대조 접속사 ‘그러나’를 살려 문장의 긴장을 유지했습니다.
- source_word: ዘየሐውር
  english_pob_choice: those who were traveling
  chosen_korean: 그와 함께 여행하던 사람들
  alternatives_korean:
  - 함께 가던 사람들
  - 길 가는 이들
  lexicon: 여행하다
  rationale: 원문의 분사적 표현을 자연스럽게 풀어, 단순한 이동이 아니라 ‘함께 여행하던’이라는 동반 관계를 드러냈습니다.
theological_decisions:
- issue: 야곱의 아들들이 이집트에 도착한 장면의 서술 범위
  chosen_reading: 원문이 말하는 사건 전개만을 따라, 해설이나 감정 묘사를 덧붙이지 않았습니다.
  alternative_readings:
  - 가뭄의 배경을 더 설명하는 확장
  - 야곱의 불안을 추정하는 표현 추가
  rationale: 외경 본문의 서사 속도와 사실 진술을 보존하는 것이 이 절의 핵심이므로, 의미를 확장하지 않았습니다.
  doctrine_reference: 서사 본문 충실성
- issue: 곡식/식량 번역 선택
  chosen_reading: ‘곡식’을 택해 이집트로 식량 일반이 아니라 곡물 확보를 위해 보냈다는 점을 분명히 했습니다.
  alternative_readings:
  - 식량
  - 양식
  rationale: 영어 POB 개정이 ‘food’에서 ‘grain’으로 수정된 점을 반영하여, 본문의 경제적·서사적 구체성을 살렸습니다.
  doctrine_reference: 어휘 정확성 및 본문 일치
