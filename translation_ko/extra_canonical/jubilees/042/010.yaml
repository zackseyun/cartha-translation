  text: 'they should bring Benjamin. And Jacob said, “You have bereaved me: Joseph is no more, and Simeon also is no more...”'
translation:
  language: ko
  text: 그들은 베냐민을 데려와야 했습니다. 그리고 야곱이 말했습니다. “너희는 나에게서 자식들을 빼앗아 갔습니다. 요셉은 더 이상 없고, 시므온도 더 이상 없습니다…”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  english_pob_choice: they should bring Benjamin
  chosen_korean: 그들이 베냐민을 데려오게 하였습니다
  alternatives_korean:
  - 베냐민을 데려와야 했습니다
  - 베냐민을 가져오게 하였습니다
  lexicon: 베냐민
  rationale: 지시·요청의 결과를 서술하는 문맥으로 보고, 자연스러운 서술형 합쇼체로 옮겼습니다. ‘데려오다’가 사람을 함께 데리고 오는 의미를 가장 잘 드러냅니다.
- source_word: እምከንከሙኒከ
  english_pob_choice: You have bereaved me
  chosen_korean: 당신들은 나를 자식 잃은 사람으로 만들었습니다
  alternatives_korean:
  - 당신들은 나를 빼앗아 갔습니다
  - 당신들은 나를 잃게 했습니다
  lexicon: 자식을 잃은 사람
  rationale: 게에즈 표현은 단순한 상실보다 ‘자식을 잃어 상주가 된 상태’를 강하게 드러내므로, 관계적·정서적 손실을 살려 번역했습니다.
- source_word: ዮሴፍኒ፡ ኢሀሎ፡ ወስምዖንሂ፡
  english_pob_choice: Joseph is no more, and Simeon also is no more
  chosen_korean: 요셉은 더 이상 없고, 시므온도 더 이상 없습니다
  alternatives_korean:
  - 요셉은 없고 시므온도 없습니다
  - 요셉은 이제 없고, 시므온도 이제 없습니다
  lexicon: 더 이상 없고 / 더 이상 없습니다
  rationale: 영어 POB의 개정판이 ‘is no more’로 다듬은 점을 반영해, 존재 부재와 상실감을 드러내는 한국어로 옮겼습니다.
- source_word: direct speech punctuation
  english_pob_choice: “...”
  chosen_korean: '"…"'
  alternatives_korean:
  - 「…」
  - “…”
  lexicon: 따옴표와 말줄임표
  rationale: 본문의 인용이 중간에 끊긴 상태이므로, 한국어 문장부호 관습에 맞추되 원문의 미완결성을 유지했습니다.
theological_decisions:
- issue: 서사적 상실 표현의 강도
  chosen_reading: ‘자식 잃은 사람으로 만들었습니다’로 번역해 단순한 ‘슬픔’보다 더 강한 상실의 의미를 보존했습니다.
  alternative_readings:
  - 당신들은 나를 슬프게 했습니다
  - 당신들은 내게 큰 상실을 안겼습니다
  rationale: 이 구절은 야곱의 직접적 탄식을 드러내므로, 정서적 약화를 피하고 가족 상실의 중대성을 그대로 살리는 것이 본문에 충실합니다.
  doctrine_reference: 서사 본문의 정서·수사적 강도 보존
- issue: 미완결 인용의 처리
  chosen_reading: 말끝을 완결하지 않고 말줄임표로 처리했습니다.
  alternative_readings:
  - 마침표로 끝맺음
  - 인용부호 없이 서술
  rationale: 뒤 문맥이 이어지는 탄식의 단절감을 보존하기 위해, 원문과 POB의 미완결성을 한국어에서도 드러냈습니다.
  doctrine_reference: 본문의 문학적 형식 보존
