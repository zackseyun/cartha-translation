  yaml_path: translation/extra_canonical/jubilees/042/005.yaml
  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: ko
  text: 요셉은 그들을 알아보았지만, 그들은 그를 알아보지 못했습니다. 그는 그들에게 거칠게 말하며 이르렀습니다. “너희는 정탐꾼들이 아니냐? 너희는 땅의 드러난 곳을 살피러 왔느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአእመሮሙ… ኢያእመርዎ
  english_pob_choice: Joseph recognized them, but they did not recognize him
  chosen_korean: 요셉은 그들을 알아보았지만, 그들은 그를 알아보지 못했습니다
  alternatives_korean:
  - 요셉은 그들을 알아보았지만, 그들은 요셉을 알아보지 못했습니다
  - 요셉은 그들을 알아차렸지만, 그들은 그를 알아차리지 못했습니다
  lexicon: አእመረ / አያእመረ
  rationale: 서로의 인지 여부를 대조하는 구조를 그대로 살려, 자연스러운 현대 한국어의 ‘알아보다 / 알아보지 못하다’로 대응했습니다.
- source_word: ዐጹባጺበ
  english_pob_choice: spoke harshly with them
  chosen_korean: 거칠게 말하며
  alternatives_korean:
  - 엄하게 말하며
  - 날카롭게 말하며
  - 호되게 말하며
  lexicon: 거칠다
  rationale: 직역보다 인물의 태도와 어조를 드러내는 표현이므로, ‘거칠게 말하다’로 간결하게 옮겼습니다.
- source_word: ሰብአ፡ ዓይን
  english_pob_choice: spies
  chosen_korean: 스파이들
  alternatives_korean:
  - 정탐꾼들
  - 첩자들
  - 간첩들
  lexicon: 정탐하다 / 첩자
  rationale: 문맥상 ‘남의 사정을 엿보는 자들’이라는 기능을 뜻하며, 현대 한국어에서 가장 직접적인 대응은 ‘스파이들’입니다. 다만 교회식 용어로는 ‘정탐꾼들’도 가능하나, 본문의 강한 비난 뉘앙스를 살려 더 직설적인 표현을 택했습니다.
- source_word: ታስተሓይዪ፡ ጸባረ፡ ምድር፡
  english_pob_choice: have you come to observe the exposed parts of the land
  chosen_korean: 땅의 드러난 곳을 살피러 왔느냐
  alternatives_korean:
  - 땅의 헐벗은 곳을 염탐하러 왔느냐
  - 이 땅의 빈틈을 살피러 왔느냐
  - 땅의 취약한 부분을 살피러 왔느냐
  lexicon: ጸባረ + ምድር
  rationale: ‘드러난 곳’은 히브리어/게에즈 계열의 ‘벌거벗음, 드러남’ 이미지를 반영한 말로, 원문의 은유를 과도하게 풀지 않으면서도 한국어로 이해 가능하게 옮겼습니다.
theological_decisions:
- issue: Reproachful interrogation tone
  chosen_reading: 요셉이 그들을 ‘거칠게’ 몰아붙이며 스파이 혐의를 제기하는 장면으로 유지했습니다
  alternative_readings:
  - 부드럽게 의심하는 정도로 완화
  - 단순한 질문형으로 평이하게 처리
  rationale: 문맥은 단순 정보 질문이 아니라 권력 있는 인물이 의도적으로 위압적으로 추궁하는 장면이므로, 어조를 약화시키지 않았습니다.
  doctrine_reference: 서사적 인물 묘사 보존
