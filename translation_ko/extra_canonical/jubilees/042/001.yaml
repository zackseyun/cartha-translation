  rationale: 원문의 진행상과 POB의 현재진행적 감각을 살리되, 재난이 땅 안으로 ‘들어오는’ 상황을 자연스러운 한국어로 표현했습니다.
theological_decisions:
- issue: 서술 시제의 감각
  chosen_reading: 과거 서술 안에서 진행 중인 상태를 드러내기 위해 ‘다가오고 있었습니다’로 옮겼습니다.
  alternative_readings:
  - ‘다가왔습니다’처럼 단순 과거로 평평하게 옮김
  - ‘임하고 있었습니다’로 더 문어적으로 옮김
  rationale: 이 절은 사건의 경과보다 기근의 접근 상태를 배경으로 제시하므로, 진행형이 원문의 분위기를 더 잘 드러냅니다.
  doctrine_reference: 서사적 배경 진술의 상(aspect) 보존
