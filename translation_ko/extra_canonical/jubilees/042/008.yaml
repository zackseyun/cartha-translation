  text: into their sacks, and they did not know it. And he commanded them to bring their youngest brother, because they had told him that their father was alive and their youngest brother also.
translation:
  language: ko
  text: 그들의 자루 속에 넣었고, 그들은 그것을 알지 못했습니다. 그리고 그는 그들에게 그들의 막내 동생을 데려오라고 명령하셨습니다. 이는 그들이 그에게 그들의 아버지가 아직 살아 있고 그들의 막내 동생도 있다고 말했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ አሕስሊሆሙ፡
  english_pob_choice: into their sacks
  chosen_korean: 그들의 자루 속에
  alternatives_korean:
  - 그들의 자루 안에
  - 그들의 자루 속으로
  lexicon: source phrase
  rationale: Geez 전치구는 결과 상태를 포함한 ‘~안에’ 의미이므로, POB의 ‘into their sacks’를 자연스럽게 살려 ‘그들의 자루 속에’로 옮겼습니다.
- source_word: ወኢያእመሩ።
  english_pob_choice: and they did not know it
  chosen_korean: 그들은 그것을 알지 못했습니다
  alternatives_korean:
  - 그들은 그것을 알지 못했습니다
  - 그들은 알아차리지 못했습니다
  lexicon: source phrase
  rationale: 문맥상 숨겨진 물건의 존재를 인지하지 못했다는 뜻이므로, 단순한 ‘모르다’보다 직접적인 ‘그것을 알지 못하다’로 옮겼습니다.
- source_word: ወአዘዞሙ፡
  english_pob_choice: And he commanded them
  chosen_korean: 그리고 그는 그들에게 … 명령했습니다
  alternatives_korean:
  - 그리고 그는 그들에게 … 명령했습니다
  - 그리고 그는 그들에게 … 지시했습니다
  lexicon: source phrase
  rationale: Geez 동사는 강한 명령을 나타내므로, 완곡한 ‘지시하다’보다 ‘명령하다’가 원문 강도를 더 잘 드러냅니다.
- source_word: እኅዋሆሙ፡
  english_pob_choice: their youngest brother
  chosen_korean: 자기들의 가장 어린 동생
  alternatives_korean:
  - 그들의 막내 동생
  - 자기들의 막내 형제
  lexicon: source phrase
  rationale: 아브라함 계열 이야기의 가족 관계를 한국어로 자연스럽게 전달하기 위해 ‘막내’보다 설명적이지만 명확한 ‘가장 어린 동생’을 택했습니다.
theological_decisions:
- issue: 가족 관계 지시어의 반복
  chosen_reading: ‘그들/자기들/자기들의’ 반복으로 화자와 보고 대상의 관계를 분명히 했습니다.
  alternative_readings:
  - 대명사 반복을 줄여 더 매끄럽게 만들기
  - ‘그의 아버지’처럼 소유격을 완화하기
  rationale: 원문과 POB는 ‘their father / their youngest brother’를 분명히 구분하므로, 소유 관계를 약화시키지 않도록 반복을 유지했습니다.
  doctrine_reference: 서사 문맥의 명료성 보존
