translation:
  language: ko
  text: 그는 자기 형제들을 떠나보냈고, 그들의 자루에 곡식을 채웠으며, 그들의 돈도 그들 속에 넣었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አኀዊሁ፡ ፈነወ።
  english_pob_choice: He sent his brothers away
  chosen_korean: 그는 자기 형제들을 떠나보냈고
  alternatives_korean:
  - 그는 형제들을 보냈고
  - 그는 자기 형제들을 보냈고
  lexicon: source verb ፈነወ
  rationale: 동사는 단순히 ‘보내다’보다 ‘떠나보내다’가 문맥상 출발·해산의 뉘앙스를 더 잘 살리며, 소유격은 영어 POB의 ‘his’를 따라 ‘자기’로 자연스럽게 드러냈습니다.
- source_word: ወመልአ፡ አሕስሊሆሙ፡ ስርናየ፡
  english_pob_choice: and he filled their sacks with grain
  chosen_korean: 그들의 자루에 곡식을 채웠으며
  alternatives_korean:
  - 그들의 자루를 곡식으로 채웠으며
  - 그들의 자루에 양식을 채웠으며
  lexicon: source noun ስርናየ
  rationale: ‘곡식’은 저장된 식량을 가리키는 직접적 의미를 살리면서도 한국어에서 자연스럽고, ‘자루에 채우다’라는 구조를 유지했습니다.
- source_word: ወወርቆሙኒ፡ ወደየ፡ ሎሙ፡
  english_pob_choice: and he also put their money for them
  chosen_korean: 그들의 돈도 그들 속에 넣었습니다
  alternatives_korean:
  - 그들의 돈도 그들에게 넣었습니다
  - 그들의 금도 그들 속에 넣었습니다
  - 그들의 돈도 그들을 위해 넣었습니다
  lexicon: source noun ወርቅ / preposition ሎሙ
  rationale: 이 게에즈 본문은 ‘silver’가 아니라 ‘money/gold’ 계열을 뜻하고, ሎሙ는 ‘for them’이므로 영어 POB의 수정 흐름을 반영해 ‘돈’과 ‘그들 속에’로 옮겼습니다.
theological_decisions:
- issue: 본문의 재화 표현을 ‘silver’가 아니라 ‘돈’으로 옮길지 여부
  chosen_reading: 게에즈 본문을 따라 ‘돈’으로 번역했습니다.
  alternative_readings:
  - ‘은전’ 또는 ‘은’으로 옮기는 방식
  - 히브리어 창세기 본문에 맞춰 ‘은’을 택하는 방식
  rationale: 제공된 원문 검토와 영어 수정 기록이 모두 Ge'ez의 ወወርቆሙኒ를 ‘money/gold’ 계열로 읽게 하므로, 히브리어와의 조화보다 현존 본문을 우선했습니다.
  doctrine_reference: 본문비평 / 원문 우선
