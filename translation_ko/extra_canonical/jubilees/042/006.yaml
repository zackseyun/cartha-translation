  - 그리고 아홉은 [내보냈습니다]
  lexicon: Geez numeral phrase with contextually supplied verb
  rationale: 원문 단편은 마지막 동사가 다음 절로 넘어간 분절 오류를 반영하므로, 영어 POB의 보정과 맞추어 한국어에서도 보충 동사를 대괄호로 표시했습니다.
