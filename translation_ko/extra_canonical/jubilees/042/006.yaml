lexical_decisions:
- source_word: ወንጸዎሙ
  english_pob_choice: And he put them in custody
  chosen_korean: 그들을 감옥에 가두었습니다
  alternatives_korean:
  - 그들을 구금했습니다
  - 그들을 감시 아래 두었습니다
  lexicon: Geez ነጸወ / custody
  rationale: 문맥상 단순한 ‘보호’가 아니라 억류·구금의 의미이므로, 한국어에서는 자연스럽고 분명한 ‘감옥에 가두다’로 옮겼습니다.
- source_word: ወእምዝ
  english_pob_choice: And after that
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그리고 나서
  lexicon: Geez temporal connective
  rationale: 서술 순서를 이어 주는 시간 접속사로서 간결한 한국어 구어체·문어체 중간 수준의 표현을 택했습니다.
- source_word: ፈትሖሙ
  english_pob_choice: he released them
  chosen_korean: 그들을 풀어 주고
  alternatives_korean:
  - 그들을 석방하고
  - 그들을 놓아 주고
  lexicon: Geez ፈትሐ / release
  rationale: ‘풀어 주다’가 억류 해제의 뜻을 가장 자연스럽게 전달하며, 뒤의 시므온만 남기는 대비도 살립니다.
- source_word: ባሕቲተ
  english_pob_choice: alone
  chosen_korean: 따로
  alternatives_korean:
