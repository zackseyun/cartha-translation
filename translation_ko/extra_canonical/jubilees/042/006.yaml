translation:
  language: ko
  text: 그리고 그들을 구금했습니다. 그 뒤에 그들을 석방하고 시므온만 따로 남겨 두었으며, 아홉 명은 [보냈습니다][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 아홉 명을”.
    reason: 현 절의 원문은 ‘그리고 아홉’을 두고 끝나며, 보낸다는 동사는 절 분절 과정에서 누락된 것으로 보입니다. 본문의 대괄호는 문맥상 보충을 표시하고, 이 각주는 원문에 가까운 짧은 읽기를 제시합니다.
lexical_decisions:
- source_word: ወንጸዎሙ
  english_pob_choice: And he put them in custody
  chosen_korean: 그들을 감옥에 가두었습니다
  alternatives_korean:
  - 그들을 구금했습니다
  - 그들을 감시 아래 두었습니다
  lexicon: Geez ነጸወ / custody
  rationale: 문맥상 단순한 ‘보호’가 아니라 억류·구금의 의미이므로, 한국어에서는 자연스럽고 분명한 ‘감옥에 가두다’로 옮겼습니다.
- source_word: ወእምዝ
  english_pob_choice: And after that
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 그 후에
  - 그리고 나서
  lexicon: Geez temporal connective
  rationale: 서술 순서를 이어 주는 시간 접속사로서 간결한 한국어 구어체·문어체 중간 수준의 표현을 택했습니다.
- source_word: ፈትሖሙ
  english_pob_choice: he released them
  chosen_korean: 그들을 풀어 주고
  alternatives_korean:
  - 그들을 석방하고
  - 그들을 놓아 주고
  lexicon: Geez ፈትሐ / release
  rationale: ‘풀어 주다’가 억류 해제의 뜻을 가장 자연스럽게 전달하며, 뒤의 시므온만 남기는 대비도 살립니다.
- source_word: ባሕቲተ
  english_pob_choice: alone
  chosen_korean: 따로
  alternatives_korean:
  - 홀로
  - 혼자
  lexicon: Geez isolation marker
  rationale: 시므온을 다른 형제들과 분리해 두었다는 행위를 강조하므로, 상태 묘사보다 분리의 결과를 드러내는 ‘따로’가 적절합니다.
- source_word: ወተስዐተ
  english_pob_choice: and the nine [he sent away]
  chosen_korean: 나머지 아홉은 [보냈습니다]
  alternatives_korean:
  - 아홉은 [보냈습니다]
  - 그리고 아홉은 [내보냈습니다]
  lexicon: Geez numeral phrase with contextually supplied verb
  rationale: 원문 단편은 마지막 동사가 다음 절로 넘어간 분절 오류를 반영하므로, 영어 POB의 보정과 맞추어 한국어에서도 보충 동사를 대괄호로 표시했습니다.
