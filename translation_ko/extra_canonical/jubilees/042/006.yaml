  - 혼자
  lexicon: Geez isolation marker
  rationale: 시므온을 다른 형제들과 분리해 두었다는 행위를 강조하므로, 상태 묘사보다 분리의 결과를 드러내는 ‘따로’가 적절합니다.
- source_word: ወተስዐተ
  english_pob_choice: and the nine [he sent away]
  chosen_korean: 나머지 아홉은 [보냈습니다]
