  text: And the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land
  footnotes:
  - marker: a
    text: Lit. 'the rain refused to be given'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 비가 땅에 내리지 않았습니다.[a] 내리는 비가 없었기 때문입니다. 땅은 메말랐지만, 이집트 땅에만 먹을 것이 있었습니다. 요셉이 그 땅을 위해 씨앗을 모아 두었기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “비가 주어지기를 거절했습니다.”
    reason: 게에즈어의 비를 의인화한 ‘주어지기를 거절하다’라는 관용적 표현을 밝혀 줍니다.
lexical_decisions:
- source_word: ወአበየ፡ ዝናም፡ ተውህቦ
  english_pob_choice: the rain was withheld
  chosen_korean: 비가 땅에서 거두어졌습니다
  alternatives_korean:
  - 비가 땅에서 억제되었습니다
  - 비가 땅에서 막혔습니다
  lexicon: 수동 표현
  rationale: 게에즈의 ‘주어지기를 거절하다/거두어지다’라는 관용을 살리면서, 자연스럽고 출판 가능한 한국어로 비의 부재를 드러냈습니다.
- source_word: ምትነ፡ ዘይወርድ
  english_pob_choice: there was no shower that came down
  chosen_korean: 위에서 내리는 소나기가 없었기 때문입니다
  alternatives_korean:
  - 내려오는 비가 없었기 때문입니다
  - 내리는 소나기가 하나도 없었기 때문입니다
  lexicon: 기상 표현
  rationale: 직역보다 ‘소나기’로 구체성을 살리되, ‘내려오다’의 하강 이미지를 유지해 원문의 반복적 강조를 반영했습니다.
- source_word: ወዐብረተ፡ ምድር
  english_pob_choice: the land became barren
  chosen_korean: 땅은 메말랐고
  alternatives_korean:
  - 땅은 황폐해졌고
  - 땅은 불모지가 되었고
  lexicon: 상태 서술
  rationale: ‘barren’의 핵심 의미를 한국어의 자연스러운 상태 동사로 옮겨 문맥상 가뭄의 결과를 분명히 했습니다.
- source_word: ባሕቱ፡ ቦቱ፡ ሲሲተ
  english_pob_choice: in the land of Egypt alone there was food
  chosen_korean: 이집트 땅에는 … 거기만 먹을 것이 있었습니다
  alternatives_korean:
  - 이집트 땅에만 먹을 것이 있었습니다
  - 오직 이집트 땅에만 먹을 것이 있었습니다
  lexicon: 대조 및 유일성
  rationale: ‘alone/only’의 유일성을 ‘거기만’으로 드러내되, 앞뒤 대조가 자연스럽게 읽히도록 문장 구조를 조정했습니다.
- source_word: አስተጋብአ፡ ዮሴፍ፡ ዘርአ፡ ለምድር
  english_pob_choice: because Joseph had gathered seed for the land
  chosen_korean: 요셉이 땅을 위해 씨를 모아 두었으므로
  alternatives_korean:
  - 요셉이 땅을 위해 씨를 모았기 때문입니다
  - 요셉이 땅을 위해 종자를 저장해 두었으므로
  lexicon: 농업 용어
  rationale: ‘gathered seed’를 단순 수집보다 비축의 뉘앙스를 살려 옮기되, 한국어에서 이해하기 쉬운 ‘씨를 모아 두다’를 택했습니다.
