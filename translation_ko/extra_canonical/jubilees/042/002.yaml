- from: 그리고 비가 땅에서 거두어졌습니다. 위에서 내리는 소나기가 없었기 때문입니다. 땅은 메말랐고, 이집트 땅에는 요셉이 땅을 위해 씨를 모아 두었으므로 거기만 먹을 것이 있었습니다.[a]
