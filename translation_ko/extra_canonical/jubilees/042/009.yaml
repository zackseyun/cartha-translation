translation:
  language: ko
  text: 그리고 그들은 이집트 땅에서 올라와 가나안 땅에 이르러, 자기 아버지에게 그들에게 일어난 모든 일, 곧 그 땅의 통치자가 그들에게 어떻게 거칠게 말하고 시므온을 붙잡아 두었다고 하였는지를 전했습니다—그들이 …할 때까지.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 땅의 통치자가’.
    reason: 원문의 접속 표현은 앞선 보고 내용에 이어지는 별도 절로도 이해될 수 있습니다.
  - marker: b
    text: ‘그들이 …할 때까지’는 다음 절에서 이어지는 종속구입니다.
    reason: እስከ፡ ሶበ፡는 절 끝에서 완결되지 않으며 다음 절의 내용을 기다립니다.
lexical_decisions:
- source_word: ወዐርጉ፡ እምድረ፡ ግብጽ፡ ወበጽሑ፡ ምድረ፡ ከናአን፡
  english_pob_choice: And they went up from the land of Egypt and came to the land of Canaan
  chosen_korean: 이집트 땅에서 올라와 가나안 땅에 이르러
  alternatives_korean:
  - 이집트 땅에서 올라가 가나안 땅에 도착하여
  - 이집트 땅을 떠나 가나안 땅에 갔습니다
  lexicon: ዐርገ / በጽሐ
  rationale: 상행·도착의 두 동사를 한국어로 자연스럽게 나누어, 단순한 이동보다 ‘올라와 … 이르러’라는 서술 흐름을 살렸습니다.
- source_word: ወነገሩ፡ ለአቡሆሙ፡ ኵሎ፡ ዘከመ፡ ረከቦሙ፡
  english_pob_choice: and they told their father everything that had happened to them
  chosen_korean: 자기 아버지에게 그들에게 일어난 모든 일을 말하고
  alternatives_korean:
  - 아버지에게 자기들에게 일어난 모든 것을 이야기하고
  - 아버지에게 그들이 겪은 모든 일을 말하고
  lexicon: ነገረ / ረከበ
  rationale: ‘일어난 모든 일’은 사건의 경과를 직접적으로 옮긴 표현이며, ‘자기 아버지에게’로 수신자를 분명히 했습니다.
- source_word: ወአፎ፡ ተናገረ፡
  english_pob_choice: and how the ruler of the land had spoken harshly with them
  chosen_korean: 그 땅의 통치자가 그들에게 어떻게 거칠게 말했으며
  alternatives_korean:
  - 그 땅의 통치자가 그들에게 얼마나 거칠게 말했으며
  - 그 땅의 통치자가 그들을 어떻게 엄하게 대했으며
  lexicon: ወአፎ / ተናገረ
  rationale: English audit trail의 수정대로 ‘and how’를 반영해 ‘어떻게’로 옮겼고, 단순한 ‘말하다’보다 상황을 드러내는 ‘거칠게 말하다’를 택했습니다.
- source_word: አሐዘ፡ ለስምዖን፡ እስከ፡ ሶበ፡
  english_pob_choice: and had seized Simeon until…
  chosen_korean: 시므온을 붙잡아 두었는지까지
  alternatives_korean:
  - 시므온을 붙잡아 두었으며…
  - 시므온을 붙잡아 두었는지…
  lexicon: አሐዘ / እስከ ሶበ
  rationale: 본문이 다음 절로 이어지는 종속 구조이므로, 문장을 닫지 않고 ‘까지’로 열어 두어 의미 연결을 보존했습니다.
