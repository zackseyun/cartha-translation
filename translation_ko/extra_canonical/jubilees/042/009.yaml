- from: 그리고 그들은 이집트 땅에서 올라와 가나안 땅에 이르러, 자기 아버지에게 그들에게 일어난 모든 일을 말하고, 그 땅의 통치자가 그들에게 어떻게 거칠게 말했으며 시므온을 붙잡아 두었는지까지 전했습니다…[a][b]
  to: 그리고 그들은 이집트 땅에서 올라와 가나안 땅에 이르러, 자기 아버지에게 그들에게 일어난 모든 일, 곧 그 땅의 통치자가 그들에게 어떻게 거칠게 말하고 시므온을 붙잡아 두었다고 하였는지를 전했습니다—그들이 …할 때까지.[a][b]
  rationale: ‘어떻게’를 유지하여 ወአፎ의 방식을 반영하고, 통치자의 가혹한 발언과 시므온 억류를 동일한 보고 내용으로 재구성했습니다. 마지막 ‘그들이 …할 때까지’는 다음 절과의 연결을 보존하기 위해 의도적으로 미완으로 남겼습니다.
