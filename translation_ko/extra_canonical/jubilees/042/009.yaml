    rationale: እስከ፡ ሶበ፡는 다음 절에서 완성되는 ‘~할 때까지’의 시간 종속구입니다. ‘는지까지’는 이 의미와 통사적 연결을 보존하지 못합니다.
  - severity: low
    issue: ‘말하고, … 전했습니다’의 병렬 구성이 부자연스럽습니다.
    rationale: 두 내용 모두 아버지에게 한 보고의 목적절이므로 ‘모든 일, 곧 …했다는 것을 전했습니다’처럼 묶는 것이 자연스럽고 정확합니다.
