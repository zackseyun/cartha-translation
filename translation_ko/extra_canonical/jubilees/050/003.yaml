  source_fidelity: 게으즈어 본문의 주어(‘땅’), 소유 표현(‘그 땅의 안식일들’), 인간의 거주 기간, 그리고 미래의 ‘희년의 해를 앎’을 모두 반영합니다. 다만 초안의 ‘자기 안식일들’은 비인격 주어인 ‘땅’에 대한 재귀 소유 표현으로 한국어에서 부자연스럽고 지시가 다소 불명확합니다.
  naturalness: ‘그들이 그 위에 거주하는 동안’도 이해되지만, 토지를 가리키는 문맥에서는 ‘그들이 그 땅 위에 거주하는 동안’이 더 자연스럽고 명료합니다. ‘그 땅의 안식일들’은 원문의 소유 관계와 의인화를 유지하면서도 자연스러운 표현입니다.
  terminology: ‘안식일들’은 복수형을, ‘희년의 해’는 원문의 ‘jubilee의 해’라는 표현을 보존합니다. ‘희년’은 한국어 성서 용례에도 맞습니다.
  issues:
