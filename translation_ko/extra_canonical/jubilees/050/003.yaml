  text: And the land will keep its sabbaths while they dwell upon it, and they will know the year of the jubilee.
translation:
  language: ko
  text: 그 땅은 그들이 그 위에 거주하는 동안 자기 안식일들을 지킬 것이며, 그들은 희년의 해를 알게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድር
  english_pob_choice: the land
  chosen_korean: 그 땅
  alternatives_korean:
  - 땅
  - 토지
  lexicon: land/earth
  rationale: 문맥상 단순한 지구가 아니라 안식일과 희년을 지키는 대상인 토지를 가리키므로 ‘그 땅’으로 옮겼습니다.
- source_word: ሰንበታቲሃ
  english_pob_choice: its sabbaths
  chosen_korean: 자기 안식일들
  alternatives_korean:
  - 그 안식일들
  - 자기들의 안식일들
  lexicon: sabbath
  rationale: 소유 접미사와 복수를 반영해 땅이 ‘자기’ 안식일들을 지킨다는 뜻을 살렸습니다.
- source_word: በነቢሮቶሙ፡ ዲቤሃ
  english_pob_choice: while they dwell upon it
  chosen_korean: 그들이 그 위에 거주하는 동안
  alternatives_korean:
  - 그들이 그 위에 사는 동안
  - 그들이 그 땅에 거하는 동안
  lexicon: dwell
  rationale: 거주/거함의 지속적 의미를 살리면서, 위치 표지를 ‘그 위에’로 보존했습니다.
- source_word: ወዓመተ፡ ለኢዮቤል፡ ያእምሩ
  english_pob_choice: and they will know the year of the jubilee
  chosen_korean: 그들은 희년의 해를 알게 될 것입니다
  alternatives_korean:
  - 그들은 희년의 해를 알 것입니다
  - 그들은 희년의 해를 알게 됩니다
  lexicon: jubilee year
  rationale: 아직 성취될 인식을 나타내므로 미래형으로 옮겼고, ‘희년’은 성서적 용례를 따랐습니다.
theological_decisions:
- issue: 땅이 안식일을 지킨다는 의인화
  chosen_reading: 땅이 그 자체의 안식일들을 지키는 주체로 표현했습니다.
  alternative_readings:
  - 사람들이 땅에서 안식일을 지키게 된다는 뜻으로 완화
  - 땅이 안식년 규례를 따른다는 식의 해석적 변환
  rationale: 히브리적 표현을 보존해 땅의 안식과 인간 거주의 상호관계를 강하게 드러내는 구문을 유지했습니다.
  doctrine_reference: 창조-토지 신학 / 레위기적 안식 개념
