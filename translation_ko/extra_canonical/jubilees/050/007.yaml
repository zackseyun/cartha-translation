  text: Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your children and your male servants and your female servants and all your animals and also the resident foreigner who is with you.
  footnotes:
  - marker: a
    text: Or 'your sons'.
    reason: previous_rendering
translation:
  language: ko
  text: 엿새 동안은 일을 해야 합니다. 그러나 일곱째 날은 야훼, 곧 여러분의 하나님께 드리는 안식일입니다. 그날에는 여러분과 여러분의 자녀와 여러분의 남종과 여종과 모든 가축과 또한 여러분과 함께 있는 거류민도 아무 일도 해서는 안 됩니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 게에즈 본문이 지시하는 언약명은 POB 기본값에 따라 ‘야훼’로 옮겨, 일반적인 ‘주님’보다 원문 고유성을 드러냈습니다.
- source_word: ሰንበት
  english_pob_choice: a sabbath
  chosen_korean: 안식일
  alternatives_korean:
  - 사바트
  - 안식
  lexicon: sabbath
  rationale: 문맥상 단순한 휴식이 아니라 계명적 절기를 가리키므로 한국어 성경에서 자연스럽고 식별 가능한 ‘안식일’로 옮겼습니다.
- source_word: ውሉድክሙ
  english_pob_choice: your children
  chosen_korean: 여러분의 자녀
  alternatives_korean:
  - 여러분의 아들들
  - 여러분의 아이들
  lexicon: wld
  rationale: English POB의 수정처럼 게에즈 복수형은 성별을 제한하지 않는 ‘자녀’가 가장 정확하며, 남녀 자녀를 함께 포함합니다.
- source_word: አግብርቲክሙ
  english_pob_choice: your male servants
  chosen_korean: 여러분의 남종
  alternatives_korean:
  - 여러분의 종들
  - 여러분의 노예들
  lexicon: ʾgbrt
  rationale: 문맥이 가정 내 종속 노동자를 성별로 구분하므로 ‘남종’으로 살렸고, POB의 일반적 ‘servants’보다 원문 구분을 보존했습니다.
- source_word: ወነኪርኒ
  english_pob_choice: the resident foreigner who is with you
  chosen_korean: 여러분과 함께 있는 거류민
  alternatives_korean:
  - 여러분 가운데 있는 타국인
  - 여러분과 함께 사는 외국인
  lexicon: nkr
  rationale: ‘거류민’은 단순한 외국 국적자가 아니라 공동체 안에 거주하며 보호를 받는 타자라는 법적·사회적 뉘앙스를 더 잘 반영합니다.
theological_decisions:
- issue: 안식일 규정의 포괄성
  chosen_reading: 본문의 금지는 가족 구성원과 종들, 가축, 거류민까지 확장되는 공동체적 계명으로 제시했습니다.
  alternative_readings:
  - 개인 경건 규범으로만 읽는 해석
  - 가정 내부 질서 규범으로 축소하는 해석
  rationale: 게에즈 본문이 대상 목록을 의도적으로 확장하므로, 계명의 범위가 예외 없이 공동체 전체에 미친다는 점을 드러내는 것이 원문 충실합니다.
  doctrine_reference: 출 20:10; 신 5:14와 평행하는 안식 계명 전통
