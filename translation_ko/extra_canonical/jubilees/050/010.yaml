  yaml_path: translation/extra_canonical/jubilees/050/010.yaml
  text: 'For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.'
translation:
  language: ko
  text: 실로 주께서 이스라엘에게 주신 큰 영광은, 이 축제일에 먹고 마시며 배부르게 되고, 사람의 자손의 노동에 속한 모든 일에서 그날 쉬는 것이니—다만 분향하고 예물과 희생제물을 주 앞에 드리는 일은 제외됩니다. 이는 날들과 안식일들을 위한 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐቢይ ክብር
  english_pob_choice: great is the honor
  chosen_korean: 큰 영광
  alternatives_korean:
  - 큰 존귀
  - 막중한 영광
  lexicon: ክብር
  rationale: 문맥상 이스라엘에게 주어진 특권을 말하므로, 단순한 ‘명예’보다 ‘영광’이 원문의 위상을 더 잘 살립니다.
- source_word: በሊዕ ወለስቲይ ወለጸጊብ
  english_pob_choice: to eat and to drink and to be satisfied
  chosen_korean: 먹고 마시며 배부르게 되고
  alternatives_korean:
  - 먹고 마시며 만족하게 되고
  - 먹고 마시며 흡족하게 되고
  lexicon: 먹다/마시다/배부르다
  rationale: 3중 동작을 그대로 살리되, ‘배부르다’로 충분히 먹고 마시는 결과를 자연스럽게 표현했습니다.
- source_word: እምኵሉ ግብር
  english_pob_choice: from all work
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 모든 노동에서
  - 모든 일과에서
  lexicon: ግብር
  rationale: 문맥상 제의적 휴식을 말하므로 ‘일’이 가장 자연스럽지만, 뒤의 ‘노동’과 연결하여 ‘사람의 자손의 노동에 속한 모든 일’로 범위를 드러냈습니다.
- source_word: ዘእምግብረ እጓለ እመሕያው
  english_pob_choice: belonging to the labor of the children of men
  chosen_korean: 사람의 자손의 노동에 속한
  alternatives_korean:
  - 인간의 노동에 속한
  - 사람들이 하는 노동에 속한
  lexicon: እጓለ እመሕያው
  rationale: 게으름이 아니라 인간 일반의 노동을 뜻하는 관용구로 보고, 직역에 가까운 구조를 유지했습니다.
- source_word: ዘእንበለ ዕጣን
  english_pob_choice: except burning incense
  chosen_korean: 다만 분향하고
  alternatives_korean:
  - 단지 향을 피우는 일은 제외하고
  - 향을 사르는 일 외에는
  lexicon: ዕጣን
  rationale: ‘분향’은 제의 행위를 간결하게 드러내는 한국어 표준 표현입니다.
- source_word: ቍርባን ወመሥዋዕት
  english_pob_choice: bringing an offering and sacrifice
  chosen_korean: 예물과 희생제물을 드리는 일
  alternatives_korean:
  - 헌물과 제사를 드리는 일
  - 공물과 희생을 드리는 일
  lexicon: ቍርባን / መሥዋዕት
  rationale: 두 항목을 구분해 병렬로 살리되, 제의적 맥락을 따라 ‘예물’과 ‘희생제물’로 옮겼습니다.
theological_decisions:
- issue: 축제일의 휴식 예외와 제의 행위의 관계
  chosen_reading: 하루의 휴식은 명령되지만, 분향과 예물·희생제물은 그 예외로 남겨 둡니다.
  alternative_readings:
  - 모든 노동이 금지되지만 제사 행위는 허용됩니다.
  - 휴식 규정이지만 예배 행위는 제한되지 않습니다.
  rationale: 원문은 ‘모든 일에서 쉬라’와 ‘분향/예물/희생제물’의 예외를 함께 제시하므로, 휴식 규정과 성전 봉사의 긴장을 그대로 보존했습니다.
  doctrine_reference: 제의법 해석
