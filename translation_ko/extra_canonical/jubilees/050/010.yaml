revisions:
- from: 실로 주께서 이스라엘에게 주신 큰 영광은, 이 축제일에 먹고 마시며 배부르게 되고, 사람의 자손의 노동에 속한 모든 일에서 그날 쉬는 것이니—다만 분향하고 예물과 희생제물을 주 앞에 드리는 일은 제외됩니다. 이는 날들과 안식일들을 위한 것입니다.[a]
  to: 주께서 이스라엘에게 주신 영예는 참으로 큽니다. 곧 이 축제일에 먹고 마시며 배부르게 되고, 인간의 노동에 속한 모든 일에서 그날 쉬는 것입니다. 다만 주 앞에서 그 날들과 안식일들을 위하여 향을 피우고 예물과 희생 제물을 드리는 일은 예외입니다.
  rationale: 마지막 목적구를 원문과 영어 감사 추적에 따라 분향 및 제물 봉헌에 직접 연결했습니다. 현대 한국어의 자연스러움을 위해 ‘사람의 자손의 노동’을 ‘인간의 노동’으로 다듬었으며, 내용이 제공되지 않은 각주 표지를 삭제했습니다. 제의 행위가 휴식의 예외라는 원문의 구조와 의미는 보존했습니다.
