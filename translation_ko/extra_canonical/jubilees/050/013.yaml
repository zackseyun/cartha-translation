translation:
  language: ko
  text: 그리고 안식일에 이런 것들 가운데 하나라도 행하는 사람은 죽어야 합니다. 그리하여 이스라엘 자손은 땅의 안식일들에 관한 명령들을 지키게 되는데, 그것은 그분이 내 손에 주신 판들에 기록된 대로이며, 내가 여러분을 위해 각 정해진 때의 법들[a]을 그 날들의 구분에 따라 기록하려는 것입니다.
  philosophy: optimal-equivalence
