  text: And every person who does work on it, or goes on a journey, or tills his field, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—
translation:
  language: ko
  text: 그리고 그날에 일하는 모든 사람, 또는 여행하는 사람, 또는 자기 밭을 가는 사람, 집 안에 있든 어느 곳에 있든, 불을 붙이는 사람, 어떤 짐승 위에 타는 사람, 바다에서 배로 다니는 사람, 무엇이든 치거나 죽이는 사람, 짐승이나 새를 잡아 죽이는 사람, 들짐승이나 새나 물고기를 잡는 사람, 또는 금식하는 사람, 또는 안식일에 전쟁을 일으키는 사람은 모두—[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብር፡ ባቲ፡ ግብረ፡
  english_pob_choice: does work on it
  chosen_korean: 그날에 일하는
  alternatives_korean:
  - 그것에 대해 일하는
  - 그 위에서 일하는
  lexicon: 작업하다/일하다
  rationale: 여기서 대명사 ‘it’은 안식일을 가리키므로, 한국어에서는 자연스럽게 ‘그날에 일하는’으로 풀어 원문의 시간·대상 관계를 드러냈습니다.
- source_word: የሐውር፡ መንገደ፡
  english_pob_choice: goes on a journey
  chosen_korean: 여행하는
  alternatives_korean:
  - 길을 가는
  - 여정에 오르는
  lexicon: 여행하다/길을 가다
  rationale: 원문과 POB의 뜻을 따라 안식일에 장거리 이동을 금하는 항목으로 간결하게 옮겼습니다.
- source_word: ይትቀነይ፡ ወፍረ፡
  english_pob_choice: tills his field
  chosen_korean: 자기 밭을 가는
  alternatives_korean:
  - 자기 밭을 일구는
  - 자기 농사를 짓는
  lexicon: 밭을 갈다
  rationale: 개정된 영어가 ‘farm’에서 ‘field’로 바로잡은 점을 반영해, 원문의 농경 행위를 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: ይጼአን፡ ዲበ፡ ኵሉ፡ እንስሳ፡
  english_pob_choice: rides on any animal
  chosen_korean: 어떤 짐승 위에 타는
  alternatives_korean:
  - 어떤 동물을 타는
  - 어떤 짐승을 타는
  lexicon: 짐승 위에 타다
  rationale: 출발점이 ‘짐승/동물’이며 목적은 탑승 행위를 금하는 것이므로, 한국어에서 어순을 그대로 살려 금지의 범위를 분명히 했습니다.
- source_word: ይጾውም፡
  english_pob_choice: fasts
  chosen_korean: 금식하는
  alternatives_korean:
  - 단식하는
  lexicon: 금식하다
  rationale: 종교적 관행을 가리키는 표준 한국어 표현인 ‘금식’이 가장 직접적입니다.
theological_decisions:
- issue: 안식일 금지 항목 목록의 번역 범위
  chosen_reading: 원문의 나열을 최대한 보존하여, 행위 목록을 하나씩 병렬로 옮기고 마지막에는 대시로 문장을 열어 두었습니다.
  alternative_readings:
  - 목록을 하나의 문장으로 매끈하게 재구성함
  - 일부 항목을 묶어 축약함
  rationale: 이 구절은 규범적 금지 목록이 핵심이므로, 수사적 반복과 범위를 흐리지 않도록 원문 배열을 그대로 살리는 것이 중요합니다.
  doctrine_reference: 안식일 규례의 열거적 법문
