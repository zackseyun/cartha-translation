  yaml_path: translation/extra_canonical/jubilees/050/002.yaml
  text: And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but its year I did not tell you until the time when you enter the land that you are to possess.
translation:
  language: ko
  text: 그리고 나는 시내산에서 땅의 안식일들에 관해 너희에게 말하였고, 희년들의 해들에 관해서도 안식년들 가운데서 너희에게 말하였으나, 그것의 해는 너희가 소유할 땅에 들어갈 때까지 너희에게 말하지 않았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰንበታተ፡ ምድርኒ፡
  english_pob_choice: the sabbaths of the land
  chosen_korean: 땅의 안식일들
  alternatives_korean:
  - 땅의 안식
  - 토지의 안식일들
  lexicon: 안식일
  rationale: Ge‘ez의 복수형 표현을 살려 ‘안식일들’로 옮기고, 대상이 ‘땅’임을 소유격으로 드러내어 원문의 범위를 유지했습니다.
- source_word: ወዓመታተ፡ ኢዮቤሌዎኒ፡
  english_pob_choice: the years of the jubilees
  chosen_korean: 희년들의 해들
  alternatives_korean:
  - 희년의 해들
  - 희년들
  lexicon: 희년
  rationale: jubilees를 교회적 용례에 맞는 ‘희년’으로 옮기되, 원문의 ‘years’와 복수 관계를 보존하기 위해 ‘해들’을 유지했습니다.
- source_word: ውስተ፡ ሰንበታተ፡ ዓመታት፡
  english_pob_choice: among the sabbaths of years
  chosen_korean: 안식년들 가운데서
  alternatives_korean:
  - 안식년들 속에서
  - 해들의 안식일들 가운데서
  lexicon: 안식년
  rationale: 문맥상 ‘years’의 안식 체계를 가리키므로 자연스럽게 ‘안식년들’로 옮기되, 전치 의미는 ‘가운데서’로 살렸습니다.
- source_word: ትበውኡ፡ ውስተ፡ ምድር፡ እንተ፡ ትእኅዙ።
  english_pob_choice: you enter the land that you are to possess
  chosen_korean: 너희가 소유할 땅에 들어갈 때까지
  alternatives_korean:
  - 너희가 차지할 땅에 들어갈 때까지
  - 너희가 차지하게 될 땅에 들어갈 때까지
  lexicon: 소유하다
  rationale: POB의 ‘possess’를 ‘소유하다’로 직역해 소유·점유의 법적 뉘앙스를 살렸고, 종속절의 시점을 ‘~할 때까지’로 명확히 했습니다.
theological_decisions:
- issue: 계시의 단계적 보류
  chosen_reading: ‘그것의 해는…말하지 않았습니다’로 옮겨, 땅의 안식일과 희년의 일반 원리는 이미 주셨으나 특정 연도는 약속의 땅 प्रवेश 전까지 유보되었음을 드러냈습니다.
  alternative_readings:
  - ‘그 해는…말하지 않았습니다’
  - ‘그것의 해를…알려 주지 않았습니다’
  rationale: 원문과 POB의 대비 구조(‘말하였으나 / 말하지 않았습니다’)를 유지해야 계시의 범위와 시점 제한이 분명해집니다.
  doctrine_reference: 계시의 점진성
- issue: 시내산 언급의 기능
  chosen_reading: ‘시내산에서’는 장소 표시로 그대로 두어 율법 부여의 권위를 강조했습니다.
  alternative_readings:
  - ‘시내산에서’ 생략
  - ‘시내산 위에서’
  rationale: 원문은 시내산을 계시의 지점으로 명시하므로, 이를 약화시키거나 부풀리지 않고 그대로 보존하는 것이 적절합니다.
  doctrine_reference: 토라의 시내산 기원
