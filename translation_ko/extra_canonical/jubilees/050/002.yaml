revisions:
- from: 그리고 나는 시내산에서 땅의 안식일들에 관해 너희에게 말하였고, 희년들의 해들에 관해서도 안식년들 가운데서 너희에게 말하였으나, 그것의 해는 너희가 소유할 땅에 들어갈 때까지 너희에게 말하지 않았습니다.[a][b]
  to: 또 나는 시내산에서 땅의 안식년들에 관하여 네게 말하였고, 희년의 해들에 관하여도 안식년들 가운데서 네게 말하였으나, 그 해는 너희가 차지할 땅에 들어갈 때까지 네게 말하지 않았습니다.
  rationale: 원문의 계시 동사 반복과 대조(‘말하였다/말하지 않았다’), 시내산의 장소 표지, 안식년과 희년의 구별, 그리고 약속된 땅에 들어가 차지한다는 전망을 유지했습니다. 단수 수신자와 복수 공동체의 전환을 반영했으며, 한국어에서 오해되기 쉬운 ‘땅의 안식일들’을 문맥상 정확한 ‘땅의 안식년들’로 바로잡았습니다. 제공되지 않은 각주에 대한 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:27Z'
review_pass:
  verdict: revise
  source_fidelity: 원문의 대조 구조와 시내산·땅·안식의 해·희년·입성/점유의 요소는 대체로 보존되어 있습니다. 다만 2인칭 목적어는 단수(‘네게’)인데 입성 동사는 공동체 복수(‘너희가’)로 보이는 원문의 전환을 반영하는 편이 더 정확합니다. 또한 ‘땅의 안식일들’은 한국어에서 매주 안식일로 읽히기 쉬워, 농경지의 안식년을 가리키는 문맥을 충분히 전달하지 못합니다.
  naturalness: ‘희년들의 해들’과 ‘그것의 해’는 현대 표준 한국어에서 부자연스럽습니다. 각각 ‘희년의 해들’ 및 ‘그 해’로 다듬는 것이 자연스럽고, 후자는 원문의 소유·지시 관계도 문맥 안에서 유지합니다. 근거 없이 붙은 [a][b] 표지는 삭제해야 합니다.
  terminology: ‘안식년’은 ‘땅의 안식’ 및 ‘해들의 안식’이라는 문맥에 적절한 정착 용어입니다. ‘희년’도 적절합니다. ‘소유할 땅’은 가능하지만 약속의 땅을 차지한다는 문맥에서는 ‘차지할 땅’이 더 자연스럽고 의미를 보존합니다.
  issues:
  - severity: medium
    issue: 2인칭 수의 평준화
    rationale: 초반의 ‘너희에게’와 마지막의 ‘너희에게’는 원문의 단수 목적어를 반영하지 못합니다. 반면 입성 주체는 공동체 복수로 남겨 원문에 보이는 단수 수신자/복수 입성자 전환을 보존하는 것이 안전합니다.
  - severity: medium
