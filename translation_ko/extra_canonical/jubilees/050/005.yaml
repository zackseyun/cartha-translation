base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/005.yaml
  text: And the jubilees will pass until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in confidence in all the land; and there will no longer be for them any satan or any evil one, and the land will be clean from that time forever.
translation:
  language: ko
  text: 이스라엘이 음행과 부정과 더러움과 죄와 오류의 모든 죄책에서 깨끗해지고 안심하고 온 땅에 거하게 될 때까지 희년들이 지나갈 것입니다. 그들에게는 더 이상 어떤 사탄도 어떤 악한 자도 없을 것이며, 땅은 그때부터 영원히 깨끗할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የኃልፉ / will pass
  english_pob_choice: will pass
  chosen_korean: 지나가면
  alternatives_korean:
  - 지날 것입니다
  - 지나갈 때까지
  lexicon: 일반 동사
  rationale: 희년이 시간적으로 연속해서 경과한다는 뜻을 자연스럽게 살리되, 종결 시점을 뒤의 ‘until’과 연결하기 위해 조건·종속 표현으로 옮겼습니다.
- source_word: ይትአመን / dwells in confidence
  english_pob_choice: dwells in confidence
  chosen_korean: 확신 가운데 살게 될 것입니다
  alternatives_korean:
  - 안전하게 살게 될 것입니다
  - 신뢰 가운데 거하게 될 것입니다
  lexicon: 일반 동사/추상명사
  rationale: 문맥상 단순한 주거가 아니라 두려움 없는 안정 상태를 가리키므로, ‘확신 가운데’로 그 상태를 드러냈습니다.
- source_word: መነሂ ሰይጣነ / any satan
  english_pob_choice: any satan
  chosen_korean: 어떤 사탄도
  alternatives_korean:
  - 어떤 대적도
  - 사탄도
  lexicon: 고유명사/전승 용어
  rationale: 본문이 공통명사적 악의 존재를 가리키더라도, 영어 POB의 선택을 따라 고유명사형 ‘사탄’을 유지하되 부정 관형사로 범위를 보존했습니다.
- source_word: እኩየ / any evil one
  english_pob_choice: any evil one
  chosen_korean: 어떤 악한 자도
  alternatives_korean:
  - 어떤 악한 존재도
  - 어떤 악도
  lexicon: 형용사적 명사
  rationale: ‘사탄’과 병렬되는 인칭적 표현이므로 추상적 ‘악’보다 ‘악한 자’가 문장 구조를 더 정확히 반영합니다.
theological_decisions:
- issue: 시간 종결 표현 'from that time forever'의 처리
  chosen_reading: 그때부터 영원히
  alternative_readings:
  - 그때부터 그리고 영원히
  - 그때 이후로 영원히
  rationale: 게으름 없는 반복을 피하면서도, 정화 상태가 단절 없이 지속된다는 종말론적 강도를 유지했습니다.
  doctrine_reference: 종말론적 정결과 지속성
- issue: 악의 존재를 개인화된 존재로 남길지 여부
  chosen_reading: 사탄 / 악한 자
  alternative_readings:
  - 사탄 / 악
  - 대적 / 악한 세력
  rationale: 원문이 사탄과 악한 자를 병렬로 두므로, 인격적 악의 항목을 함께 보존해 본문의 이중 대립을 살렸습니다.
  doctrine_reference: 악의 인격화와 종말적 제거
