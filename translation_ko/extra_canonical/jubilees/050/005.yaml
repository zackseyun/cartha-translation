revisions:
- from: 그리고 희년들이 지나가면, 이스라엘이 음행과 부정과 더러움과 죄와 오류의 모든 죄책에서 깨끗해지고, 온 땅에서 확신 가운데 살게 될 것입니다. 그때부터는 그들에게 더 이상 어떤 사탄도 어떤 악한 자도 없을 것이며, 땅은 그때부터 영원히 깨끗할 것입니다.[a]
  to: 이스라엘이 음행과 부정과 더러움과 죄와 오류의 모든 죄책에서 깨끗해지고 안심하고 온 땅에 거하게 될 때까지 희년들이 지나갈 것입니다. 그들에게는 더 이상 어떤 사탄도 어떤 악한 자도 없을 것이며, 땅은 그때부터 영원히 깨끗할 것입니다.
  rationale: The revision restores the source's ‘until’ relationship by making Israel's cleansing and secure dwelling the endpoint to which the jubilees pass. It uses idiomatic formal Korean for dwelling in confidence and removes the unsupported footnote anchor. The enumeration of offences, the paired ‘satan’ and ‘evil one,’ and the enduring purification of the land are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal sequence and terms, but '희년들이 지나가면' changes the source's temporal endpoint ('will pass until') into a conditional clause and leaves the endpoint insufficiently expressed. The dangling footnote anchor has no corresponding note.
  naturalness: ‘확신 가운데 살게 될 것입니다’ is understandable but somewhat literal and less idiomatic in modern Korean. ‘안심하고 온 땅에 거하게 될’ naturally conveys dwelling in confidence/security while retaining the formal register.
  terminology: ‘희년’, ‘이스라엘’, ‘사탄’, and ‘악한 자’ are suitable. ‘음행’, ‘부정’, ‘더러움’, ‘죄’, and ‘오류’ preserve the source's enumerated moral and ritual categories without interpretive expansion.
  issues:
  - severity: medium
    issue: Temporal construction mistranslates ‘will pass until’.
    rationale: ‘희년들이 지나가면’ means ‘if/when the jubilees pass,’ whereas the source states that jubilees will continue to pass up to the time Israel is cleansed and dwells securely. The endpoint must be stated with ‘~할 때까지’.
  - severity: low
    issue: Unanchored footnote marker [a].
    rationale: The translation contains [a], but no footnote text is supplied. Removing it resolves the unsupported anchor without affecting meaning.
  - severity: low
    issue: Literal and slightly unnatural rendering of dwelling in confidence.
    rationale: ‘확신 가운데 살다’ can suggest subjective certainty rather than secure, confident habitation. ‘안심하고 ... 거하다’ is idiomatic and preserves the contextual sense.
  revised_text: 이스라엘이 음행과 부정과 더러움과 죄와 오류의 모든 죄책에서 깨끗해지고 안심하고 온 땅에 거하게 될 때까지 희년들이 지나갈 것입니다. 그들에게는 더 이상 어떤 사탄도 어떤 악한 자도 없을 것이며, 땅은 그때부터 영원히 깨끗할 것입니다.
  revised_footnotes: []
  revision_rationale: The revision restores the source's ‘until’ relationship by making Israel's cleansing and secure dwelling the endpoint to which the jubilees pass. It uses idiomatic formal Korean for dwelling in confidence and removes the unsupported footnote anchor. The enumeration of offences, the paired ‘satan’ and ‘evil one,’ and the enduring purification of the land are retained.
