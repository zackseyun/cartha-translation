translation:
  language: ko
  text: 보십시오, 내가 여러분을 위해 안식일에 관한 명령과 그 율법의 모든 규례를 기록했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ፡
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 이제
  lexicon: source interjection
  rationale: 청중의 주의를 끄는 감탄을 현대 합쇼체에서 자연스럽게 살리기 위해 ‘보십시오’로 옮겼습니다.
- source_word: ትእዛዘ፡ ሰንበታትኒ፡
  english_pob_choice: the command concerning the Sabbaths
  chosen_korean: 안식일에 관한 명령
  alternatives_korean:
  - 안식일들에 대한 명령
  - 안식일 명령
  lexicon: command / Sabbaths
  rationale: 복수형 ‘Sabbaths’는 일주일의 안식일 규례들을 가리키는 집합적 표현으로 보고, 한국어에서는 자연스럽게 ‘안식일에 관한 명령’으로 표현했습니다.
- source_word: ፍትሓተ፡ ሕገጊሁ።
  english_pob_choice: all the judgments of its laws
  chosen_korean: 그 율법의 모든 규례
  alternatives_korean:
  - 그 법들의 모든 판결
  - 그 율법의 모든 판단
  lexicon: judgments / laws
  rationale: ‘judgments’는 율법의 판례적·규례적 내용으로 이해되어 ‘규례’로 옮겼고, ሕገጊሁ의 복수적 뉘앙스를 반영해 ‘율법의’로 연결했습니다.
theological_decisions:
- issue: ‘Sabbaths’의 복수성을 한국어에서 어떻게 처리할지
  chosen_reading: 개별 안식일들을 뜻하는 규례적 복수로 보고 ‘안식일에 관한 명령’으로 번역했습니다.
  alternative_readings:
  - ‘안식일들’
  - ‘안식일들에 대한 명령’
  rationale: 문맥상 하나의 특정 안식일이 아니라 안식일 제도 전반을 가리키므로, 직역의 어색함보다 문맥적 명료성을 우선했습니다.
  doctrine_reference: 토라의 안식일 규정 이해
