  rationale: 문맥상 사람은 하나님을 ‘축복’할 수 없으므로, 하나님을 높이고 찬양하는 행위라는 점을 드러내는 번역이 더 정확합니다.
  doctrine_reference: 예배 언어의 방향성(인간→하나님)
