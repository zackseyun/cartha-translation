revisions:
- from: 안식일에는 전혀 어떤 일도 하지 마십시오. 다만 여섯째 날에 여러분을 위해 미리 준비한 것, 곧 먹고 마시고 쉬는 것과 이 날에 안식일을 지키는 것 외에는 그러합니다. 또한 여러분의 하나님 야훼를 찬양해야 합니다. 그분은 여러분에게 절기의 날과 거룩한 날과 거룩한 왕국의 날을 온 이스라엘을 위해 주셨습니다. 이 날은 그들의 날들 동안, 모든 날 동안 있습니다.[a][b]
  to: 안식일에는, 여섯째 날에 여러분이 먹고 마시고 쉬며 이 날 모든 일을 쉬기 위하여 미리 준비한 것 외에는, 어떤 일도 전혀 하지 마십시오. 또한 주 여러분의 하나님을 송축하십시오. 그분께서 온 이스라엘을 위하여 여러분에게 절기의 날과 거룩한 날과 왕국의 거룩한 날[a]을 주셨습니다. 이 날은 그들의 날들 내내, 모든 날 동안 그러합니다.[b]
  rationale: 예외 조항을 완전한 금지 명령으로 고치고, 하나님께 드리는 ‘송축’과 원문의 ‘주’ 호칭을 회복했습니다. 왕국/거룩함의 수식 관계는 본문과 각주로 불확실성을 보존했으며, 마지막의 ‘날들’ 반복도 유지했습니다.
