  yaml_path: translation/extra_canonical/jubilees/050/009.yaml
  text: You shall do no work at all on the Sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep Sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of the kingdom for all Israel—this day throughout their days, throughout all days.
  footnotes:
  - marker: a
    text: Or 'a holy kingdom day'.
    reason: previous_rendering
  - marker: b
    text: Or 'throughout their generations'.
    reason: previous_rendering
translation:
  language: ko
  text: 안식일에는, 여섯째 날에 여러분이 먹고 마시고 쉬며 이 날 모든 일을 쉬기 위하여 미리 준비한 것 외에는, 어떤 일도 전혀 하지 마십시오. 또한 주 여러분의 하나님을 송축하십시오. 그분께서 온 이스라엘을 위하여 여러분에게 절기의 날과 거룩한 날과 왕국의 거룩한 날[a]을 주셨습니다. 이 날은 그들의 날들 내내, 모든 날 동안 그러합니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 왕국의 날’.
    reason: 게에즈어의 ‘날—왕국—거룩한’ 결합은 ‘왕국의 거룩한 날’과 ‘거룩한 왕국의 날’로 모두 옮길 수 있습니다.
  - marker: b
    text: 또는 ‘그들의 세대에 걸쳐’.
    reason: 본문은 문자적으로 ‘그들의 날들 동안, 모든 날 동안’으로 옮겼습니다. 이전 번역 전통에는 ‘세대’로 이해한 경우가 있습니다.
lexical_decisions:
- source_word: ዕለተ፡ ሰንበት
  english_pob_choice: Sabbath day
  chosen_korean: 안식일
  alternatives_korean:
  - 사밧 날
  - 안식의 날
  lexicon: Sabbath
  rationale: 게에즈 원문과 POB의 ‘Sabbath day’에 맞추어 표준 교회 용어인 ‘안식일’을 택하되, 문장 전체는 현대 한국어 어순으로 풀었습니다.
- source_word: ኢትግበሩ… ምንተ*ኒ ግብረ
  english_pob_choice: You shall do no work at all
  chosen_korean: 전혀 어떤 일도 하지 마십시오
  alternatives_korean:
  - 아무 일도 하지 마십시오
  - 일을 전혀 하지 마십시오
  lexicon: work
  rationale: ‘일/일을 하지 마십시오’로 옮기면 자연스럽지만, 원문의 금지 강도를 살리기 위해 ‘전혀 어떤 일도’로 강조했습니다.
- source_word: ዘአስተዳለውክምዎ… በ*ዕለት፡ ሳድስት
  english_pob_choice: what you have prepared for yourselves on the sixth day
  chosen_korean: 여섯째 날에 여러분을 위해 미리 준비한 것
  alternatives_korean:
  - 여섯째 날에 스스로 준비한 것
  - 여섯째 날에 여러분이 마련한 것
  lexicon: prepared
  rationale: ‘미리 준비한 것’은 준비 완료 상태를 자연스럽게 드러내며, 원문의 ‘여섯째 날’과 ‘여러분을 위해’의 관계를 보존합니다.
- source_word: ወለባርኮ፡ እግዚአብሔር፡ አምላክክሙ
  english_pob_choice: to bless the LORD your God
  chosen_korean: 여러분의 하나님 야훼를 찬양해야 합니다
  alternatives_korean:
  - 여러분의 하나님 야훼를 축복해야 합니다
  - 여러분의 하나님 야훼를 송축해야 합니다
  lexicon: bless
  rationale: 동사를 직역하면 ‘축복하다’이지만, 인간이 하나님께 하는 행위라는 점에서 한국어로는 ‘찬양하다’가 더 명확하게 의미를 전달합니다.
- source_word: ዕለተ፡ በዓል… ዕለተ፡ ቅድስተ… ዕለተ፡ መንግሥት፡ ቅድስት
  english_pob_choice: a day of festival and a holy day and a holy kingdom day
  chosen_korean: 절기의 날과 거룩한 날과 거룩한 왕국의 날
  alternatives_korean:
  - 명절의 날과 거룩한 날과 거룩한 나라의 날
  - 축제의 날과 거룩한 날과 거룩한 통치의 날
  lexicon: festival / holy day / holy kingdom day
  rationale: ‘절기’는 히브리적 절기 개념을 살리면서 자연스럽고, ‘거룩한 왕국의 날’은 POB의 수정안을 따라 ‘kingdom day’를 직접 반영했습니다.
- source_word: በመዋዕሊሆሙ፡ በኵሉ፡ መዋዕል
  english_pob_choice: throughout their days, throughout all days
  chosen_korean: 그들의 날들 동안, 모든 날 동안
  alternatives_korean:
  - 그들의 세대 동안, 모든 세대 동안
  - 그들의 날마다, 언제나
  lexicon: throughout their days / throughout all days
  rationale: 게에즈 원문은 ‘날들/모든 날’의 반복이며, POB 개정도 ‘generations’보다 ‘days’를 지지하므로 이에 맞춰 직역했습니다.
theological_decisions:
- issue: 하나님께 드리는 동사의 의미
  chosen_reading: ‘barako’를 하나님께 대한 인간의 응답으로 이해하여 ‘찬양하다’로 옮겼습니다.
  alternative_readings:
