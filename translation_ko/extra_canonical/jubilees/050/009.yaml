    rationale: 원문은 ‘왕국의 거룩한 날’ 또는 ‘거룩한 왕국의 날’로 해석될 여지가 있습니다. 전자를 본문으로 하되 대안을 각주로 보존하는 것이 자연스럽고 안전합니다.
