base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
  footnotes:
  - marker: a
    text: Or 'by the Jordan on the west.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 내가 네게 해의 주간들과 해들과 희년들을 정해 두었다. 아담 때부터 오늘까지 사십구 희년이 지났으며, 주님의 계명을 배우기 위해 해의 한 주간과 두 해와 또 사십 해가 아직 남아 있다. 그들이 요단강을 건너 서쪽의 가나안 땅으로 들어갈 때까지이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘요단강을 건너, 그 서쪽의 가나안 땅으로’이다. 여기서 ‘해의 한 주간’은 일곱 해의 기간을 가리킨다.
    reason: Ge'ez의 ‘건너’라는 동작성을 보존하고, 앞서 제시된 ‘해의 주간’과 뒤의 ‘한 주간’이 같은 연대 단위임을 한국어 독자에게 명확히 한다.
lexical_decisions:
