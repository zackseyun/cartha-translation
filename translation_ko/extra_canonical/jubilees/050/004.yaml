  yaml_path: translation/extra_canonical/jubilees/050/004.yaml
  text: 'Therefore I have ordained for you weeks of years and years and jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and forty years still remain for learning the commandments of the LORD, until they cross over into the land of Canaan crossing the Jordan to the west.'
  footnotes:
  - marker: a
    text: Or 'by the Jordan on the west.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 저는 당신들을 위해 연들의 주간과 연들과 희년들을 정해 두었습니다. 아담의 날들로부터 이 날까지 사십구 희년이 있으며, 주님의 계명을 배우기 위해 아직 한 주와 두 해와 사십 해가 남아 있습니다. 그들이 요단강을 건너 서쪽에 있는 가나안 땅으로 들어갈 때까지입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠራዕኩ
  english_pob_choice: I have ordained
  chosen_korean: 정해 두었습니다
  alternatives_korean:
  - 제정했습니다
  - 정했습니다
  lexicon: Ge'ez ሠረዐ
  rationale: 규범을 세워 미리 정해 둔 뜻을 살리되, 현대 한국어에서 지나치게 법령체처럼 들리지 않도록 ‘정해 두었습니다’로 옮겼습니다.
- source_word: ሱባዔ ዓመታት ወዓመታት ወኢዮቤሌዎታት
  english_pob_choice: weeks of years and years and jubilees
  chosen_korean: 연들의 주간과 연들과 희년들
  alternatives_korean:
  - 해의 주간과 해들과 희년들
  - 주간들과 연들과 희년들
  lexicon: Ge'ez 수십/주간-연 단위 표현
  rationale: 문자적으로 반복되는 시간 단위를 살리기 위해 ‘연들의 주간’과 ‘연들’이라는 병렬 구조를 유지했고, 유대력의 기술 용어인 ‘희년들’은 그대로 옮겼습니다.
- source_word: ትእዛዛተ እግዚአብሔር
  english_pob_choice: the commandments of the LORD
  chosen_korean: 주님의 계명
  alternatives_korean:
  - 야훼의 계명
  - 주님의 명령
  lexicon: τε/Ge'ez 하나님의 명령 표현
  rationale: 본문은 하나님의 명령을 가리키므로 ‘계명’이 자연스럽고, Ge'ez의 신명 표현에 대응해 ‘주님’을 사용했습니다. 이 외경 본문에서는 POB 기본어인 ‘야훼’보다 문맥상 직접 호칭인 ‘주님’이 더 자연스럽습니다.
- source_word: ዐዲዎሙ
  english_pob_choice: crossing the Jordan
  chosen_korean: 요단강을 건너
  alternatives_korean:
  - 요단강을 건너서
  - 요단강을 건너가는
  lexicon: Ge'ez gerund/행위표현
  rationale: 동작성을 살려 ‘건너’로 처리하여, 단순 위치가 아니라 실제로 건너는 행위를 나타내도록 했습니다.
theological_decisions:
- issue: 본문의 시간 계산과 종말론적 유예 표현
  chosen_reading: 아담 이후부터 이 날까지의 긴 시간과, 아직 남은 한 주·두 해·사십 해를 함께 제시하는 연대적 선언으로 읽었습니다.
  alternative_readings:
  - 상징적 수치로만 읽는 해석
  - 문자적 연대 계산으로만 읽는 해석
  rationale: 본문은 수치의 배열 자체를 통해 남은 시간이 제한되어 있음을 강조하므로, 상징성과 계산 가능성을 둘 다 지우지 않고 그대로 드러내는 쪽이 원문에 충실합니다.
  doctrine_reference: Jubilees의 연대기적 종말 이해
