revisions:
- from: 그러므로 저는 당신들을 위해 연들의 주간과 연들과 희년들을 정해 두었습니다. 아담의 날들로부터 이 날까지 사십구 희년이 있으며, 주님의 계명을 배우기 위해 아직 한 주와 두 해와 사십 해가 남아 있습니다. 그들이 요단강을 건너 서쪽에 있는 가나안 땅으로 들어갈 때까지입니다.[a]
  to: 그러므로 내가 네게 해의 주간들과 해들과 희년들을 정해 두었다. 아담 때부터 오늘까지 사십구 희년이 지났으며, 주님의 계명을 배우기 위해 해의 한 주간과 두 해와 또 사십 해가 아직 남아 있다. 그들이 요단강을 건너 서쪽의 가나안 땅으로 들어갈 때까지이다.[a]
  rationale: 원문의 단수 수신자를 보존하고, 반복되는 연대 단위를 자연스러운 한국어로 정리했습니다. ‘또 사십 해’는 원문의 추가 접속 표현을 반영하며, 마지막 절은 ‘남아 있다’에 직접 연결하여 원문의 시간적 한계를 살렸습니다. 신적 화자의 직접 발화이므로 한국어 번역문에서는 불필요한 합쇼체의 1인칭 ‘저는’을 피하고 ‘내가 … 두었다’로 옮겼습니다.
