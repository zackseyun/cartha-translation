base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050/008.yaml
  text: And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do any matter on it so as to do business concerning any buying or selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.
translation:
  language: ko
  text: 그리고 이 날에 어떤 일이든 하는 사람은 죽을 것입니다. 이 날을 더럽히는 사람, 여자와 동침하는 사람, 어떤 일이나 하겠다고 말하여 어떤 매매든 하려고 하는 사람, 또는 여섯째 날에 자신을 위해 미리 준비해 두지 않은 물을 이 날에 길어 오는 사람, 또는 짐을 들어 자기 장막에서나 자기 집에서 밖으로 옮기는 사람은 모두 죽을 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመት / shall die
  english_pob_choice: shall die
  chosen_korean: 죽을 것입니다
  alternatives_korean:
  - 죽습니다
  - 반드시 죽습니다
  lexicon: 죽다
  rationale: 법령적 경고의 미래 결과를 자연스러운 현대 한국어로 옮기되, 원문의 제재 강도를 약화하지 않기 위해 단순한 서술형보다 미래형을 택했습니다.
- source_word: ዘይፄምና / who lies with a woman
  english_pob_choice: who lies with a woman
  chosen_korean: 여자와 동침하는 사람
  alternatives_korean:
  - 여자와 함께 눕는 사람
  - 여자와 관계하는 사람
  lexicon: 동침하다
  rationale: 원문의 성행위 완곡 표현을 직역에 가깝게 살려, 문맥상 성적 접촉을 분명히 드러내는 한국어를 사용했습니다.
- source_word: በእንተ፡ ኵሉ፡ ሠይጥ፡ ወተሣይጦ / any buying or selling
  english_pob_choice: any buying or selling
  chosen_korean: 어떤 매매든
  alternatives_korean:
  - 모든 사고팔기
  - 어떤 매매나
  lexicon: 매매
  rationale: 원문과 POB의 포괄성을 따라 ‘buying or selling’을 하나의 경제행위로 묶어 ‘매매’로 옮겼습니다.
- source_word: ይቀድሕ፡ ባቲ / draws water on it
  english_pob_choice: draws water on it
  chosen_korean: 물을 … 길어 오는 사람
  alternatives_korean:
  - 물을 긷는 사람
  - 물을 퍼오는 사람
  lexicon: 길어 오다
  rationale: 물의 수집 행위를 자연스럽게 표현하되, 단순히 ‘긷다’보다 출처에서 자기 집/장막으로 들여오는 뉘앙스를 살렸습니다.
- source_word: ዘኢያስተዳለው፡ ሎቱ፡ በዕለት፡ ሳድስት / that he had not prepared for himself on the sixth day
  english_pob_choice: that he had not prepared for himself on the sixth day
  chosen_korean: 여섯째 날에 자신을 위해 미리 준비해 두지 않은
  alternatives_korean:
  - 여섯째 날에 스스로 마련해 두지 않은
  - 여섯째 날에 자기 몫으로 준비하지 않은
  lexicon: 준비하다
  rationale: 사전 준비의 의무를 분명히 하기 위해 ‘미리 준비해 두다’로 옮겼고, 여섯째 날이라는 시간 표지를 그대로 살렸습니다.
theological_decisions:
- issue: 안식일 위반 항목들의 열거 방식
  chosen_reading: 원문이 나열하는 각 위반 행위를 별개 금지항목으로 유지하고, 하나의 종교적 윤리로 일반화하지 않았습니다.
  alternative_readings:
  - 안식일을 범하는 일반 규정으로 압축 번역
  - 예배적 의미를 강조해 도덕적 권면으로 완화
  rationale: 이 절은 특정 금지행위를 열거하는 법률 문체이므로, 항목별 구체성을 보존하는 것이 원문의 강한 제재 의도를 가장 잘 전달합니다.
  doctrine_reference: 율법적 금지 조항의 서술 보존
- issue: ‘죽을 것입니다’의 강도
  chosen_reading: 형벌 선언을 완화하지 않고 미래형 제재로 표기했습니다.
  alternative_readings:
  - 사형에 처할 것입니다
  - 반드시 죽습니다
  rationale: 본문의 형벌 선언을 현대어의 자연스러움 속에서도 분명하게 전달해야 하므로, 법령 문체의 미래형을 사용했습니다.
  doctrine_reference: 형벌 경고의 명시성
