  text: And after this law I made known to you the days of the sabbaths in the wilderness of Sinai, which is between Elim and Sinai.
  footnotes:
  - marker: a
    text: Or 'And after this I made known to you the law of the days of the sabbaths'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 법 후에, 나는 너희에게 시나이 광야에서 안식일의 날들을 알렸습니다.[a] 그 광야는 엘림과 시나이 사이에 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 이 일 후에 나는 너희에게 안식일의 날들에 관한 법을 알렸습니다.”
    reason: 게에즈어 첫 구절에서 ‘법’이 앞선 규정을 가리키는지, 뒤따르는 ‘안식일의 날들’과 결합하는지를 달리 분석할 수 있으므로 그 모호성을 보존합니다.
lexical_decisions:
- source_word: ወእምድኅረዝ፡ ሕገ፡
  english_pob_choice: And after this law
  chosen_korean: 그리고 이 법 뒤에
  alternatives_korean:
  - 그리고 이 법 이후에
  - 그리고 이 일 뒤에
  - 그리고 이 법 다음에
  lexicon: 법
  rationale: 게에즈의 ሕገ는 앞선 문맥의 특정 규정을 가리키는 ‘법’으로 읽는 것이 자연스럽고, POB의 수정 이력도 이 구문을 앞선 율례를 가리키는 도입부로 보게 합니다.
- source_word: መዋዕለ፡ ሰንበታት፡
  english_pob_choice: the days of the sabbaths
  chosen_korean: 안식일들의 날들
  alternatives_korean:
  - 안식일의 날들
  - 안식일 기간들
  - 안식일들의 시기
  lexicon: 안식일
  rationale: 직역하면 다소 어색하지만, 원문의 복수 구조와 POB의 ‘days of the sabbaths’를 살려 안식일이 반복되는 날들의 단위를 드러냈습니다.
- source_word: በገዳመ፡ ሲና፡
  english_pob_choice: in the wilderness of Sinai
  chosen_korean: 시나 광야에서
  alternatives_korean:
  - 시나의 광야에서
  - 시나 산에서
  - 시나 광야 안에서
  lexicon: 광야
  rationale: POB의 수정 이력에 따라 በገዳመ는 ‘산 위’가 아니라 ‘광야’로 옮겨야 하며, 지명은 한국어 표기 일관성을 위해 시나로 옮겼습니다.
- source_word: እንተ፡ ይእቲ፡ ምእከለ፡ ኤሎም፡ ወሲና።
  english_pob_choice: which is between Elim and Sinai.
  chosen_korean: 그곳은 엘림과 시나 사이에 있습니다.
  alternatives_korean:
  - 그것은 엘림과 시나 사이에 있습니다.
  - 엘림과 시나 사이에 있는 곳입니다.
  lexicon: 사이
  rationale: 관계절의 지시 대상을 장소로 풀어 한국어 문맥에서 자연스럽게 전달하면서도, ‘between Elim and Sinai’의 공간 관계를 유지했습니다.
theological_decisions:
- issue: ‘days of the sabbaths’의 의미를 한국어에서 어떻게 보존할지
  chosen_reading: 안식일들의 날들
  alternative_readings:
  - 안식일 주기들
  - 안식일 규례의 날들
  rationale: 문맥상 단순한 ‘안식일들’보다, 반복되는 절기/주기성까지 보이는 복수 표현을 유지하는 편이 원문 의미를 더 잘 보존합니다.
  doctrine_reference: 본문 해석상 절기 규정의 반복성과 리듬을 드러내는 번역 원칙
