revisions:
- from: 이 일만은 안식일마다 성전 안에서 행하여야 합니다. 그것은 여호와 곧 너희 하나님 앞에서 기쁘게 받으실 만한 기념제로서, 이스라엘을 위해 날마다 속죄하게 하며, 여러분이 명령받은 대로 영원히 날마다 그들을 받아 주실 것입니다.[a][b]
  to: 이 일만은 안식일마다 여호와 너희 하나님의 성소에서 행하여야 합니다. 이는 이스라엘을 위하여 속죄를 이루도록 날마다 드리는 계속적인 예물, 곧 여호와 앞에서 기쁘게 받아들여질 기념이 되게 하려는 것입니다. 그분께서는 명령받은 대로 그 예물들을 영원토록 날마다 받아 주실 것입니다.
  rationale: መባአ를 ‘예물’로 명시하고, ለተዝካር ዘይሠጠው를 ‘여호와 앞에서 기쁘게 받아들여질 기념’으로 옮겼습니다. 따라서 예물·속죄·기념의 제의적 관계를 보존하면서도 ‘기념제’가 암시할 수 있는 축제 의미는 피했습니다. 마지막 복수 대명사는 바로 앞의 계속적인 예물을 가리키는 문맥으로 이해해 한국어 지시 대상을 명료하게 했으며, 출처에 없는 신학적 해석은 더하지 않았습니다.
