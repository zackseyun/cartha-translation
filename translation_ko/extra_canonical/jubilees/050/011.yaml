  text: This work alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel with a continual offering, day by day, as a memorial that is acceptable before the LORD, and he will receive them forever, day after day, according as you were commanded.
  footnotes:
  - marker: a
    text: Or 'that is given'.
    reason: previous_rendering
  - marker: b
    text: Or 'for Israel continually'.
    reason: previous_rendering
  - marker: c
    text: Or 'This alone'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 일만은 안식일마다 여호와 너희 하나님의 성소에서 행하여야 합니다. 이는 이스라엘을 위하여 속죄를 이루도록 날마다 드리는 계속적인 예물, 곧 여호와 앞에서 기쁘게 받아들여질 기념이 되게 하려는 것입니다. 그분께서는 명령받은 대로 그 예물들을 영원토록 날마다 받아 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘግብር / የተርጉም된 English 'This work alone'
  english_pob_choice: This work alone
  chosen_korean: 이 일만은
  alternatives_korean:
  - 이 일 하나만은
  - 이 일만
  lexicon: እበ/ግብር
  rationale: 지시 대명사와 ‘work/deed’의 의미를 살려, 절차 전체가 아니라 특정한 제의적 행위 하나를 가리키는 뉘앙스를 간결하게 드러냈습니다.
- source_word: በመዋዕለ ሰንበታት
  english_pob_choice: on the sabbath days
  chosen_korean: 안식일마다
  alternatives_korean:
  - 안식일들에
  - 안식일 날마다
  lexicon: ሰንበት
  rationale: 복수형을 관용적 한국어로 자연스럽게 옮기되, 반복되는 규례라는 점을 ‘-마다’로 보존했습니다.
- source_word: በቤተ መቅደሱ
  english_pob_choice: in the house of the sanctuary
  chosen_korean: 성전 안에서
  alternatives_korean:
  - 성소 안에서
  - 성전에서
  lexicon: ቤተ መቅደስ
  rationale: 문맥상 예루살렘 성전의 제의 장소를 가리키므로, 직역의 어색함보다 기능적 의미를 살린 표현을 택했습니다.
- source_word: ከመ ያስተስርዩ ... መባአ
  english_pob_choice: so that they may make atonement ... with a continual offering
  chosen_korean: 그것은 ... 속죄하게 하며
  alternatives_korean:
  - 그것은 ... 화목하게 하며
  - 그것은 ... 속죄드리게 하며
  lexicon: መባአ / ያስተስርዩ
  rationale: English POB의 보완된 의미를 반영해, 누락되었던 ‘제물/예물’ 요소는 뒤의 ‘기쁘게 받으실 만한 기념제’로 포괄하고, 핵심 제의 기능은 ‘속죄하다’로 유지했습니다.
- source_word: ለተዝካር ዘይሠጠው
  english_pob_choice: as a memorial that is acceptable before the LORD
  chosen_korean: 기쁘게 받으실 만한 기념제로서
  alternatives_korean:
  - 받으실 만한 기념제로서
  - 하나님 앞에 기억으로 남는 것으로서
  lexicon: ተዝካር / ሠጠው
  rationale: 재료가 되는 ‘기념’과 ‘받으실 만함’을 함께 살려, 단순한 추모가 아니라 하나님 앞에서 승인되는 제의적 기념이라는 점을 드러냈습니다.
- source_word: ወይትወከፎሙ
  english_pob_choice: and he will receive them forever
  chosen_korean: 영원히 날마다 그들을 받아 주실 것입니다
  alternatives_korean:
  - 영원히 그들을 받아 주실 것입니다
  - 영원토록 그들을 받아 주실 것입니다
  lexicon: ወትወከፈ
  rationale: 동사의 ‘받아들이다/영접하다’ 의미를 살리되, 반복 부사구 ‘day by day’를 후행으로 배치하여 리듬과 지속성을 보존했습니다.
theological_decisions:
- issue: ‘하나님’의 고유명 표기와 YHWH 대응
  chosen_reading: 여호와 곧 너희 하나님
  alternative_readings:
  - 야훼 곧 너희 하나님
  - 주 너희 하나님
  rationale: 이 절의 영어 POB는 LORD를 표기적으로 처리했지만, 한국어 본문은 통상 독자 친화성과 프로젝트 관례 사이의 긴장을 고려해 여호와를 사용했습니다. 다만 원문상 주권적 언약 호칭이라는 점은 ‘너희 하나님’으로 유지했습니다.
  doctrine_reference: OT divine-name rendering policy
- issue: 기념제와 속죄의 결합
  chosen_reading: 기쁘게 받으실 만한 기념제로서, ... 속죄하게 하며
  alternative_readings:
  - 기념제로서 ... 속죄하게 하며
  - 속죄 제물로서 ... 기념하게 하며
  rationale: 원문과 영어 POB 모두 기념과 속죄를 함께 두어 제의의 두 기능을 유지합니다. 한국어에서도 둘 중 하나를 흡수하지 않고 병치해, 제의적 기억 행위와 속죄 효력을 동시에 드러냈습니다.
  doctrine_reference: atonement / memorial sacrifice
