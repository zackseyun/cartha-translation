base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/018/015.yaml
  text: And he said, “By myself I have sworn, says the LORD, because you have done this thing and have not withheld your son, your firstborn, your beloved one, from me, surely blessing I will bless you, and multiplying I will multiply your seed like the stars of heaven and like the sand that is on the seashore, and your seed will inherit the cities of their enemies.”
  footnotes:
  - marker: a
    text: Or 'your son, your beloved one, from me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. “내가 나 자신을 두고 맹세하였다. 야훼께서 말씀하신다. 네가 이 일을 행하고 네 아들, 곧 네 맏아들, 네 사랑하는 이를 내게 바치기를 아끼지 않았으므로, 내가 반드시 네게 복을 주고 네 씨를 하늘의 별들과 바닷가의 모래처럼 크게 번성하게 하겠다. 네 씨는 그 원수들의 성읍들을 차지할 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤ / ይቤ
  english_pob_choice: And he said / says
  chosen_korean: “그리고 그가 말씀하셨습니다.”
  alternatives_korean:
  - “그리고 그가 말했습니다.”
  - “그리고 그가 이르셨습니다.”
  lexicon: 서사 동사
  rationale: Ge’ez 서술 동사를 자연스러운 현대 한국어 서사체로 옮기되, 인용문 도입을 분명히 하기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: በ*ርእስየ
  english_pob_choice: By myself
  chosen_korean: “내 자신으로 맹세합니다”
  alternatives_korean:
  - “나 자신으로 맹세합니다”
  - “내 머리로 맹세합니다”
  lexicon: 서약 표현
  rationale: 직역 투의 ‘나 자신으로’보다 서약의 기능을 드러내는 한국어로 옮기되, 자기 자신을 두고 맹세하는 원의는 유지했습니다.
- source_word: ቃለ *ወኢምሕከ
  english_pob_choice: because you have done this thing and have not withheld
  chosen_korean: “네가 이 일을 행하여 … 거두지 않았으므로”
  alternatives_korean:
  - “네가 이 일을 하였고 … 아끼지 않았으므로”
  - “네가 이 일을 했고 … 보류하지 않았으므로”
  lexicon: 행위/거절 동사
  rationale: ‘행하다’와 ‘거두지 않다’로 원문의 행위-금지 대조를 살렸고, ‘아끼다’보다 소유자/제의적 헌납 맥락을 덜 흐리는 표현을 택했습니다.
- source_word: በዘረከ / በኵረከ(정정 반영)
  english_pob_choice: your son, your firstborn, your beloved one
  chosen_korean: “네 아들, 곧 네 맏아들, 네 사랑하는 이를”
  alternatives_korean:
  - “네 아들, 네 첫 열매, 네 사랑하는 이를”
  - “네 아들, 네 장자, 네 사랑하는 이를”
  lexicon: 친자/서열 표현
  rationale: 오류 정정으로 복원된 ‘맏아들/firstborn’을 빠뜨리지 않고, ‘사랑하는 이’는 원문의 애정 표지를 그대로 살려 추가했습니다.
- source_word: ዘርእከ
  english_pob_choice: your seed
  chosen_korean: “네 씨”
  alternatives_korean:
  - “네 후손”
  - “네 자손”
  lexicon: 후손 집합 명사
  rationale: 족장 약속 문맥의 반복어는 ‘씨’가 가장 간결하고 원문 반복을 잘 보존하므로 이를 유지했습니다.
theological_decisions:
- issue: 서약의 주체와 인용 구조
  chosen_reading: “내 자신으로 맹세합니다—야훼의 말입니다—”로 주어와 삽입된 신적 발화를 구분했습니다.
  alternative_readings:
  - “내 자신으로 맹세하였다고 야훼께서 말씀하셨습니다”
  - “내 자신으로 맹세합니다, 주께서 말씀하십니다”
  rationale: 원문은 화자 전환이 있는 직접화법 구조이므로, 서사자와 야훼의 발화를 분리해 독자가 서약의 권위를 분명히 느끼게 했습니다.
  doctrine_reference: 직접화법/계시적 발화 구조 보존
- issue: ‘네 아들, 네 맏아들, 네 사랑하는 이’의 중첩
  chosen_reading: 세 표지를 병렬로 두어, 아들임·서열·애정의 의미를 모두 드러냈습니다.
  alternative_readings:
  - ‘네 사랑하는 맏아들’처럼 하나로 합치기
  - ‘네 첫사랑하는 아들’처럼 수식어를 압축하기
  rationale: 본절의 긴장점은 단순한 아들 포기가 아니라 가장 소중한 상속자까지도 내어놓지 않았다는 점이므로, 의미를 합쳐 약화시키지 않았습니다.
  doctrine_reference: 본문 비평/의미 보존
