  to: 그리고 내가 하늘에서 그를 불러 말했습니다. “아브라함, 아브라함.” 그러자 그는 두려워하여 말했습니다. “제가 여기 있습니다.”
  rationale: 원문의 ‘하늘에서 그를 불렀고 그에게 말하였다’라는 과거 사건을 자연스러운 한국어로 바로잡고, ወይገብዕ의 ‘두려워하다’ 의미를 유지했습니다. 의미상 연결되지 않는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
