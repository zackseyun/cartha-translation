lexical_decisions:
- source_word: ወ*ጸዋዕክዎ፡ እምሰማይ
  english_pob_choice: And I called to him from heaven
  chosen_korean: “하늘에서 그에게 부르며”
  alternatives_korean:
  - “하늘로부터 그를 불러”
  - “하늘에서 그를 불렀고”
  lexicon: source_note
  rationale: 원문은 하늘에서 들려오는 신적 호출을 나타내므로, 한국어에서도 장소 부사구를 살려 직역에 가깝게 옮겼습니다.
- source_word: ወይገብዕ፡
  english_pob_choice: he was terrified
  chosen_korean: “그는 두려워하며”
  alternatives_korean:
  - “그는 놀라며”
  - “그는 급히”
  lexicon: source_note
  rationale: 게으즈 동사는 ‘서둘다’가 아니라 ‘두려워하다/떨다’의 의미이므로, 번역 논란을 반영해 공포 반응을 드러내는 표현을 택했습니다.
- source_word: ነየ፡ አነ
  english_pob_choice: Here I am
  chosen_korean: “제가 여기 있습니다”
  alternatives_korean:
  - “여기 있습니다”
  - “제가 있습니다”
  lexicon: source_note
  rationale: 응답 공식의 현재적·즉각적 의미를 살리되, 한국어에서 자연스러운 존대형 응답으로 옮겼습니다.
theological_decisions:
- issue: 하늘에서의 부르심과 두려움의 반응
  chosen_reading: 하나님의 초월적 호출 앞에서 아브라함이 두려워하는 장면으로 읽고, 그 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 단순한 주의를 끄는 호출로 완화할 수 있음
  - 두려움을 생략하고 즉각 응답만 강조할 수 있음
  rationale: 원문은 하늘로부터의 음성과 아브라함의 공포를 함께 제시하여 계시의 위엄을 강조하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 신적 계시의 위엄
