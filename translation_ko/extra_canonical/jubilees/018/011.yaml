  text: And I said to him, “Do not stretch out your hand against the boy, and do not do anything to him, for now I know that you fear God, and you have not withheld your son, your firstborn, from me.”
  footnotes:
  - marker: a
    text: Or 'And he said to him'.
    reason: previous_rendering
  - marker: b
    text: Or 'your seed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 그에게 말했습니다. “그 아이에게 손을 뻗지 마십시오. 그에게 아무 일도 하지 마십시오. 이제 나는 당신이 하나님을 경외하며, 당신의 아들, 곧 당신의 맏아들을 내게 바치기를 아끼지 않았다는 것을 압니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትፈኑ፡ እዴከ፡
  english_pob_choice: Do not stretch out your hand
  chosen_korean: 손을 뻗지 마십시오
  alternatives_korean:
  - 손을 내밀지 마십시오
  - 손을 뻗어 해치지 마십시오
  lexicon: 손을 뻗다
  rationale: 직역은 ‘손을 뻗다’이며, 여기서는 위협적 행위를 금지하는 명령으로 자연스럽게 한국어 명령형을 살렸습니다.
- source_word: ወአትግበር፡ ምንተኒ፡ ዲቤሁ፡
  english_pob_choice: do not do anything to him
  chosen_korean: 그에게 아무 일도 하지 마십시오
  alternatives_korean:
  - 그에게 아무것도 하지 마십시오
  - 그에게 어떤 일도 하지 마십시오
  lexicon: 아무 일도 하다
  rationale: 소스의 포괄적 부정은 단순히 ‘해치다’보다 넓으므로, 행위 일반을 금지하는 표현으로 옮겼습니다.
- source_word: ፈራሄ፡ እግዚአብሔር፡
  english_pob_choice: you fear God
  chosen_korean: 당신이 하나님을 경외하는
  alternatives_korean:
  - 당신이 하나님을 두려워하는
  - 당신이 하나님을 무서워하는
  lexicon: 하나님을 경외하다
  rationale: 독자에게 익숙한 종교적 의미를 유지하되, 게으른 완화 없이 ‘경외하다’로 원문의 경외/두려움의 긴장을 살렸습니다.
- source_word: በዘረከ፡
  english_pob_choice: your son, your firstborn / your seed
  chosen_korean: 당신의 아들, 곧 당신의 맏아들
  alternatives_korean:
  - 당신의 아들, 곧 당신의 씨
  - 당신의 아들, 당신의 첫째 아들
  lexicon: 맏아들
  rationale: 본문 전승과 주석에서 해당 어구는 ‘your firstborn’으로 확정되는 비평적 판독을 반영하여, ‘씨’가 아니라 ‘맏아들’로 옮겼습니다.
theological_decisions:
- issue: 서술 주체와 직접 화법
  chosen_reading: ‘그리고 내가 그에게 말했습니다’로 1인칭 서술을 유지했습니다.
  alternative_readings:
  - 그가 그에게 말했습니다
  - 그리고 내가 그에게 말했다
  rationale: 게에즈 동사형과 서사 맥락상 발화 주체는 이야기하는 천사/화자 자신이므로, 1인칭을 보존하는 것이 본문을 정확히 반영합니다.
  doctrine_reference: 본문 비평/서사 화자 식별
- issue: 하나님을 경외함의 뉘앙스
  chosen_reading: ‘하나님을 경외하는’으로 번역했습니다.
  alternative_readings:
  - 하나님을 두려워하는
  - 하나님을 무서워하는
  rationale: 이 표현은 단순 감정이 아니라 언약적 순종을 드러내는 표지이므로, 한국어에서도 경외의 신학적 무게를 살리는 것이 적절합니다.
  doctrine_reference: 경외와 순종의 표지
