translation:
  language: ko
  text: 아브라함은 그곳을 “야훼께서 보셨다”라고 불렀습니다. 그래서 “야훼께서 보셨다”라고 합니다. 그곳은 시온 산입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문은 신명칭을 가리키며, POB의 기본 원칙에 따라 ‘야훼’로 옮겨 원문 지시를 직접 드러냈습니다.
- source_word: ርእየ
  english_pob_choice: has seen
  chosen_korean: 보셨다
  alternatives_korean:
  - 살피셨다
  - 보아 주셨다
  lexicon: ראה
  rationale: 히브리계 ‘보다’의 완료 의미를 자연스러운 서술형 과거로 살렸습니다.
- source_word: ደብረ፡ ጽዮን
  english_pob_choice: Mount Zion
  chosen_korean: 시온 산
  alternatives_korean:
  - 시온 산지
  - 시온산
  lexicon: צִיּוֹן
  rationale: 지명은 현대 한국어에서 통용되는 성경적 고유명사 형태를 따르되, 구성 요소를 분명히 하려고 ‘산’을 분리해 적었습니다.
theological_decisions:
- issue: 반복된 “야훼께서 보셨다”의 기능
  chosen_reading: 첫 절과 인용절 모두 동일하게 반복해, 장소명과 속담적 설명의 연결을 유지했습니다.
  alternative_readings:
  - 첫 번째만 이름으로 두고 뒤는 풀어 쓰는 방식
  - 반복을 줄여 한 번만 제시하는 방식
  rationale: 원문은 동일한 표현을 반복해 이름의 의미와 전승된 말의 형성을 함께 보여 주므로, 이를 약화하지 않고 보존했습니다.
  doctrine_reference: 원문 반복 구조 보존
