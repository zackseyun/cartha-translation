  text: And I stood before him and before the prince Mastema, and the LORD said, “Tell him not to lay his hand upon the boy, and not to do anything to him, for now I know that he is one who fears God.”
translation:
  language: ko
  text: 나는 그의 앞과 메스테마의 통치자 앞에 서 있었고, 주께서 말씀하셨습니다. 「그가 소년에게 손을 대지 못하게 하고, 그에게 아무것도 하지 못하게 하십시오. 이제 내가 그가 하나님을 경외하는 자인 줄 알았기 때문입니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: 지명/호칭
  rationale: 본문의 주어는 여호와적 신호칭이지만, 한국어 본문에서는 직접 발화 동사와 함께 자연스럽고 장중한 호칭인 ‘주’를 사용하되, 번역 전통상 본문 흐름을 해치지 않도록 했습니다.
- source_word: መላእክት፡ መስተማ
  english_pob_choice: the prince Mastema
  chosen_korean: 메스테마의 통치자
  alternatives_korean:
  - 마스테마의 왕자
  - 마스테마의 방백
  lexicon: 고유명사/직함
  rationale: Mastema는 고유명사로 음역하고, መስተማ를 ‘통치자’로 옮겨 악한 권세의 위상을 드러냈습니다. ‘왕자’는 현대 한국어에서 오해를 부를 수 있어 피했습니다.
- source_word: ኢይግበር፡ ምዝገኒ
  english_pob_choice: not to do anything to him
  chosen_korean: 그에게 아무것도 하지 못하게 하십시오
  alternatives_korean:
  - 그에게 아무 일도 하지 않게 하십시오
  - 그를 해하지 못하게 하십시오
  lexicon: 행위 금지 표현
  rationale: 원문의 절대적 금지 범위를 살려 ‘아무것도 하지 못하게’로 옮겼습니다. ‘해하지’는 결과를 좁힐 수 있어 더 일반적인 표현을 택했습니다.
- source_word: ፈራሄ፡ እግዚአብሔር
  english_pob_choice: one who fears God
  chosen_korean: 하나님을 경외하는 자
  alternatives_korean:
  - 하나님을 두려워하는 사람
  - 하나님을 경외하는 사람
  lexicon: 경외 표현
  rationale: 서술적 평가인 ‘fears God’를 성경적 어법에 맞게 ‘경외하는 자’로 옮겨, 단순한 공포보다 언약적 경외를 살렸습니다.
theological_decisions:
- issue: 신적 호칭을 본문에서 어떻게 드러낼지
  chosen_reading: 직접 발화 화자인 주를 그대로 두어 구별을 유지했습니다.
  alternative_readings:
  - 본문에 ‘야훼’로 명시
  - ‘하나님’으로 일반화
  rationale: 게에즈 본문의 እግዚአብሔር은 신적 호칭이지만, 이 절의 대화 구조에서는 ‘주께서 말씀하셨습니다’가 자연스럽고, 청자가 발화자를 즉시 식별할 수 있습니다.
  doctrine_reference: 번역 일관성 및 고유명사/호칭 처리 원칙
