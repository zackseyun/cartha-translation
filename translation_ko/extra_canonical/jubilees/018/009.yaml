  source_fidelity: 수정이 필요합니다. 초안의 ‘메스테마의 통치자’는 ‘통치자’라는 직함이 메스테마를 수식하는 원문의 관계를 반대로 만들었습니다. 또한 주께서 ‘그에게 말하라’고 하시는 전달 명령이 초안에서는 빠졌습니다. ‘이제’는 ‘이제야’로 옮겨 인식의 시점을 보존하는 것이 적절합니다.
  naturalness: 합쇼체 서술과 인용문은 전반적으로 자연스럽지만, ‘그가 … 못하게 하고’는 말하라는 명령 없이 간접 지시만 남겨 화행이 불분명합니다. ‘그에게 …라고 말하십시오’로 하면 자연스럽고 원문의 구조도 드러납니다.
  terminology: ‘주’, ‘하나님을 경외하는 자’는 문맥과 한국어 성경적 문체에 적절합니다. Mastema는 ‘메스테마’로 음역하고, 직함은 ‘통치자 메스테마’로 앞에 두어야 합니다. 영어 감사 기록의 ‘prince Mastema’ 및 게에즈어의 메스테마 관련 호칭을 안전하게 반영합니다.
