  verdict: revise
  source_fidelity: 게에즈 본문은 마스테마를 መኰንን(통치자·군주·고관)으로 부르며, 그가 수치를 당했다고 말합니다. 이어 아브라함이 눈을 들어 한 숫양이 뿔로 가시덤불에 걸린 것을 보고, 그 숫양을 자기 아들 대신 번제로 바친다고 서술합니다. 수정문은 이 순서와 대체 관계를 보존합니다.
  naturalness: ‘마스테마 왕자’는 현대 한국어에서 통상 왕의 아들을 뜻하여 직함의 의미를 좁히므로 ‘마스테마 군주’가 더 자연스럽고 안전합니다. 서사 중간의 ‘보십시오’는 독자에게 직접 명령하는 듯해 부자연스러우므로 ‘보니’로 처리하는 것이 한국어 성서 서사에 자연스럽습니다.
  terminology: ‘군주’는 መኰንን 및 영어 POB의 Prince를 왕자라는 혈연 신분으로 단정하지 않고 직함으로 옮깁니다. ‘숫양 한 마리’, ‘가시덤불에 뿔이 걸려’, ‘번제’, ‘아들을 대신하여’는 각각 원문의 수량, 결박 방식, 제의 용어, 대체 관계를 적절히 반영합니다.
