  text: And Prince Mastema was put to shame. And Abraham lifted up his eyes and looked, and behold, one ram was caught by its horns in the thicket. And Abraham went and took the ram and offered it up as a burnt offering instead of his son.
translation:
  language: ko
  text: 그리고 마스테마 왕자가 수치를 당했습니다. 아브라함이 눈을 들어 보니, 보십시오, 숫양 한 마리가 가시덤불에 그 뿔이 걸려 있었습니다. 아브라함은 가서 그 숫양을 잡아 그의 아들을 대신하여 번제로 바쳤습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Prince Mastema
  english_pob_choice: Prince Mastema
  chosen_korean: 마스테마 왕자
  alternatives_korean:
  - 마스테마
  - 마스테마 군주
  - 마스테마 영주
  lexicon: 고유명사
  rationale: POB가 Mastema를 고유 칭호로 처리하므로, 한국어도 이름과 칭호를 함께 살려 ‘마스테마 왕자’로 옮겨 제목성을 드러냈습니다.
- source_word: one ram
  english_pob_choice: one ram
  chosen_korean: 숫양 한 마리
  alternatives_korean:
  - 어떤 숫양
  - 한 숫양
  - 숫양 하나
  lexicon: 고유명사 아님
  rationale: 게에즈의 አሐዱ와 POB의 ‘one’을 반영해 단순히 부정관사처럼 처리하지 않고 ‘숫양 한 마리’로 수량을 분명히 했습니다.
- source_word: caught by its horns in the thicket
  english_pob_choice: was caught by its horns in the thicket
  chosen_korean: 가시덤불에 그 뿔이 걸려 있었습니다
  alternatives_korean:
  - 가시덤불에 뿔로 걸려 있었습니다
  - 덤불 속에 뿔이 걸려 있었습니다
  lexicon: 문맥 표현
  rationale: ‘by its horns’의 도구적 관계를 한국어에서 가장 자연스럽게 드러내기 위해 ‘그 뿔이 걸려 있었습니다’로 풀어 옮겼습니다.
- source_word: burnt offering
  english_pob_choice: a burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 번제물
  - 불살라 드리는 제물
  lexicon: 제의 용어
  rationale: 제의적 희생을 가리키는 표준 용어를 유지하되, 문맥상 동사 ‘바쳤습니다’와 결합해 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘instead of his son’의 대속/대체 의미
  chosen_reading: ‘그의 아들을 대신하여’
  alternative_readings:
  - ‘그 아들 대신에’
  - ‘아들 대신으로’
  rationale: 본문은 제사 행위의 대체성을 직접 말하므로, 희생의 대속적 의미를 약화시키지 않고 직역에 가까운 ‘대신하여’를 유지했습니다.
  doctrine_reference: 대체 희생/대속의 서술
- issue: 화자의 서술 톤과 합쇼체
  chosen_reading: 서술은 합쇼체로 유지하고, 감탄·지시 표현인 ‘보십시오’를 삽입했습니다.
  alternative_readings:
  - 완전 평서형 서술
  - 더 구어적인 ‘봐요’
  rationale: 본문의 서사적 긴장을 살리면서도 현대 한국어 성서 문체에 맞추기 위해 합쇼체를 유지했고, ‘보라/and behold’에 해당하는 포착 표현은 공손한 지시형으로 옮겼습니다.
  doctrine_reference: 문체/서술 전략
