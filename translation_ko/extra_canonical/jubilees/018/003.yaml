  source_fidelity: 게에즈 본문과 영어 감사 번역의 동작 순서와 핵심 요소(이른 아침, 나귀에 안장을 얹음, 두 종, 아들 이삭, 번제용 나무, 셋째 날, 그곳으로 감)를 대체로 충실히 반영합니다. 다만 ‘번제 나무’는 원문의 ‘번제를 위한 나무’라는 목적 관계를 충분히 드러내지 못합니다.
