    rationale: 장소를 가리키는 의존 명사 결합은 현대 표준 표기상 ‘그곳’으로 씁니다.
  revised_text: 그는 아침 일찍 일어나 나귀에 안장을 얹고, 종 둘과 아들 이삭을 데리고, 번제에 쓸 나무를 쪼갠 뒤 셋째 날에 그곳으로 갔습니다.
