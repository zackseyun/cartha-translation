  text: And he rose early in the morning and saddled his donkey, and he took two servants with him, and Isaac his son; and he split the wood for the burnt offering, and he went to the place on the third day.
translation:
  language: ko
  text: 그는 아침 일찍 일어나 나귀에 안장을 얹고, 종 둘과 아들 이삭을 데리고, 번제에 쓸 나무를 쪼갠 뒤 셋째 날에 그곳으로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአሌለየ፡ በነግህ፡
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나
  alternatives_korean:
  - 이른 아침에 일어나
  - 아침에 일찍 일어나
  lexicon: 일찍/이른 아침
  rationale: 게에즈 동작 완료 표현을 자연스러운 현대 한국어 순서로 옮기되, 단순한 시간 정보보다 즉시성과 결단을 살렸습니다.
- source_word: ወጸዐነ፡ አድጎ፡
  english_pob_choice: saddled his donkey
  chosen_korean: 나귀에 안장을 얹고
  alternatives_korean:
  - 나귀에 안장을 지우고
  - 나귀를 안장하고
  lexicon: 안장을 얹다
  rationale: 직역 과잉을 피하면서도 나귀에 장비를 얹는 행위를 분명히 드러내는 한국어로 옮겼습니다.
- source_word: ወከአአተ፡ ደቂቀ፡
  english_pob_choice: he took two servants with him
  chosen_korean: 종 둘
  alternatives_korean:
  - 두 종
  - 하인 둘
  lexicon: 종
  rationale: 수량을 압축해도 의미가 유지되며, 이 문맥에서는 고용된 종이므로 ‘종’이 가장 직접적입니다.
- source_word: መሥዋዕተ፡
  english_pob_choice: burnt offering
  chosen_korean: 번제
  alternatives_korean:
  - 불태울 제물
  - 번제물
  lexicon: 번제
  rationale: 아브라함 전승의 제의 용어로서 고유한 제사 개념을 보존하기 위해 표준 성서 용어를 사용했습니다.
- source_word: በሠሉስ፡ ዕለት፡
  english_pob_choice: on the third day
  chosen_korean: 셋째 날에
  alternatives_korean:
  - 세째 날에
  - 제삼일에
  lexicon: 셋째 날
  rationale: 서사적 시간 표지로서 가장 자연스러운 현대 한국어 표현을 택했습니다.
theological_decisions:
- issue: 아브라함-이삭 서사의 제의적 성격
  chosen_reading: ‘번제’로 옮겨 제의 행위의 희생성과 하나님의 명령 아래 있는 순종을 유지했습니다.
  alternative_readings:
  - ‘태워 드리는 제물’처럼 풀어쓰는 방식
  - 일반적인 ‘제물’로 약화하는 방식
  rationale: 이 단락은 단순한 이동이 아니라 제의 준비를 묘사하므로, 희생 제사의 성격을 흐리지 않는 용어가 필요합니다.
  doctrine_reference: 창세기 22장 평행본문과 제사 용어 일관성
