  source_fidelity: 전반적인 사건 순서와 의미는 원문 및 영어 감사본에 충실합니다. 다만 마지막 동작에서 원문은 손을 뻗어 칼을 ‘취하는’ 것을 명시하므로, ‘칼을 잡고’보다 ‘칼을 집어 들고’가 더 정확합니다. 또한 마지막의 ‘이삭 자기 아들’은 원문의 동격적 반복을 반영하려 한 것으로 보이나 한국어 문장으로는 부자연스럽습니다.
