  text: And he built the altar and placed the wood on the altar, and he bound Isaac his son and laid him on the wood that was on top of the altar, and he stretched out his hand to take the knife so that he might slaughter Isaac his son.
translation:
  language: ko
  text: 그리고 그는 제단을 쌓고 제단 위에 나무를 놓았으며, 자기 아들 이삭을 묶어 제단 위에 놓인 나무 위에 올려놓았습니다. 또 손을 뻗어 칼을 집어 들고 이삭, 곧 자기 아들을 잡아 죽이려 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኀነጸ፡ ምሥዋዐ፡
  english_pob_choice: he built the altar
  chosen_korean: 제단을 쌓고
  alternatives_korean:
  - 제단을 만들고
  - 제단을 세우고
  lexicon: altar
  rationale: 게에즈 원문은 제단을 ‘세우다’보다 ‘쌓다/만들다’에 가까운 동작을 나타내므로, 자연스러운 한국어로는 ‘쌓고’가 가장 직접적입니다.
- source_word: ወአንበረ፡ ዕፀወ፡ ዲበ፡ ምሥዋዕ፡
  english_pob_choice: placed the wood on the altar
  chosen_korean: 제단 위에 나무를 놓았으며
  alternatives_korean:
  - 제단에 나무를 올려놓았으며
  - 제단 위에 장작을 놓았으며
  lexicon: wood
  rationale: 여기서 ‘wood’는 제사 준비를 위한 나무를 뜻하므로, 직역하면서도 자연스러운 ‘나무’를 유지했습니다.
- source_word: ወሰፍሓ፡ እዴሁ፡
  english_pob_choice: he stretched out his hand
  chosen_korean: 손을 내밀어
  alternatives_korean:
  - 손을 뻗어
  - 손을 펴고
  lexicon: hand
  rationale: 행동의 진행을 드러내는 관용적 표현으로 ‘손을 내밀어’가 한국어 서술문에 가장 자연스럽습니다.
- source_word: መጥባሕተ፡ ... ይዝብሖ፡
  english_pob_choice: the knife ... slaughter
  chosen_korean: 칼을 잡고 ... 잡아 죽이려 하였습니다
  alternatives_korean:
  - 도살칼을 잡고 ... 죽이려 하였습니다
  - 칼을 잡고 ... 제물로 바치려 하였습니다
  lexicon: knife / slaughter
  rationale: 원문은 ‘도살하다/잡아 죽이다’의 의미를 분명히 하므로, 예배적 완곡어보다 행위의 폭력성을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 이삭을 제단 위에 올려놓는 장면의 서술 강도
  chosen_reading: 이삭을 묶어 제단 맨 위에 있는 나무 위에 올려놓았습니다
  alternative_readings:
  - 이삭을 묶어 나무 위에 두었습니다
  - 이삭을 묶어 제단 위에 올려놓았습니다
  rationale: 게에즈 원문의 반복 구조(제단 위의 나무, 그 위의 이삭)를 보존해 장면의 긴박함과 단계성을 살렸습니다.
  doctrine_reference: 본문 서술의 연속성과 제의적 긴장
