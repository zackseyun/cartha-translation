  text: And he took the wood of the offering and laid it on Isaac his son, and he took in his hand the fire and the knife, and the two of them went together to that place.
translation:
  language: ko
  text: 그리고 그는 제물에 쓸 나무를 가져다가 자기 아들 이삭에게 지우고, 자기 손에 불과 칼을 들었으며, 두 사람은 함께 그곳으로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀወ መሥዋዕት
  english_pob_choice: wood of the offering
  chosen_korean: 제물의 나무
  alternatives_korean:
  - 희생 제물의 나무
  - 번제의 나무
  lexicon: መሥዋዕት / ዕፀ
  rationale: 목적격으로 ‘제물의 나무’를 두어 나무가 제물에 속해 있음을 분명히 하면서도, 본문의 간결한 서술을 유지했습니다.
- source_word: ወአስከሞ፡ ለይስሐቅ፡ ወልዱ
  english_pob_choice: laid it on Isaac his son
  chosen_korean: 자기 아들 이삭 위에 얹고
  alternatives_korean:
  - 자기 아들 이삭에게 지고
  - 자기 아들 이삭에게 올려놓고
  lexicon: አስከሞ / ወልዱ
  rationale: ‘얹다’는 나무를 이삭의 몸에 놓는 동작을 자연스럽게 살리며, 소유관계인 ‘자기 아들 이삭’을 그대로 반영합니다.
- source_word: እሳተ፡ ወመጥባሕተኒ
  english_pob_choice: the fire and the knife
  chosen_korean: 불과 칼
  alternatives_korean:
  - 불과 칼붙이
  - 불과 도끼
  lexicon: እሳት / መጥባሕ
  rationale: 무기보다 도구에 가까운 ‘칼’이 본문의 제의적·서사적 장면에 가장 직접적으로 대응합니다.
- source_word: ኅቡረ፡ ክልኤሆሙ
  english_pob_choice: the two of them went together
  chosen_korean: 두 사람은 함께
  alternatives_korean:
  - 둘은 함께
  - 그 둘이 함께
  lexicon: ክልኤ / ኅቡረ
  rationale: ‘두 사람’으로 명시해 아브라함과 이삭의 동행을 분명히 하고, ‘함께’로 연합된 움직임을 살렸습니다.
theological_decisions:
- issue: 제단 이동의 방향 표현
  chosen_reading: ‘그곳으로 갔습니다’로 목적지를 단순하게 옮겨, 서술의 초점을 제의 행위와 동행에 두었습니다.
  alternative_readings:
  - ‘그곳에 이르기까지 갔습니다’
  - ‘그곳까지 갔습니다’
  rationale: 영어 POB의 최신 수정이 ‘until that place’에서 ‘to that place’로 정리된 점을 따라, 도착 과정의 뉘앙스보다 목적지 지향을 반영했습니다.
  doctrine_reference: 서사적 단순성 유지
- issue: 제물 언어의 완곡화 여부
  chosen_reading: ‘제물의 나무’와 ‘불과 칼’을 직설적으로 옮겨 제의적 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - ‘번제 나무’
  - ‘불씨와 칼’
  rationale: 원문은 제의 준비물의 구체성을 강조하므로, 한국어에서도 전통적 미화보다 직접적 묘사를 우선했습니다.
  doctrine_reference: 본문 충실성
