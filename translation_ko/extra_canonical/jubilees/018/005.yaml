  source_fidelity: 게에즈어는 그가 제의에 쓰일 나무를 가져와 아들 이삭에게 얹고, 자기 손에 불과 칼을 들고, 두 사람이 함께 그곳으로 갔음을 서술합니다. 초안은 주요 요소와 순서를 충실히 담았으나, ‘제물의 나무’는 나무가 제물의 일부이거나 제물로 된 나무라는 뜻으로도 읽혀 용도 관계를 충분히 드러내지 못합니다.
