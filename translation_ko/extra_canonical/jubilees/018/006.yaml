  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: ko
  text: 그리고 이삭이 자기 아버지에게 말했습니다. “아버지.” 그러자 그가 말했습니다. “내가 여기 있단다, 내 아들아.” 이삭이 아버지에게 말했습니다. “보세요, 불과 칼과 나무는 있는데, 번제물로 드릴 양은 어디에 있습니까, 아버지?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአቡሁ / 아버지 호칭
  english_pob_choice: father / my father
  chosen_korean: 아버지
  alternatives_korean:
  - 아빠
  - 아버님
  lexicon: 가족 호칭
  rationale: 원문과 영어 본문 모두에서 부자 간 직접 호칭이므로, 현대 한국어의 자연스러운 직접 호칭인 ‘아버지’를 유지했습니다.
- source_word: ነየ፡ አነ፡ ወልድየ
  english_pob_choice: Here I am, my son
  chosen_korean: 내가 여기 있단다, 내 아들아
  alternatives_korean:
  - 내가 여기 있습니다, 내 아들아
  - 여기 있단다, 내 아들아
  lexicon: 응답 관용구
  rationale: 히브리어적 대응으로 기능하는 즉각적 응답을 살리되, 아들을 향한 친밀한 부름은 문맥상 자연스럽게 반말형으로 옮겼습니다.
- source_word: እሳት፡ ወመጥባሕት፡ ወዕፀው
  english_pob_choice: the fire and the knife and the wood
  chosen_korean: 불과 칼과 나무
  alternatives_korean:
  - 불과 칼과 장작
  - 불과 칼과 땔나무
  lexicon: 제의 용어
  rationale: 제사용 준비물의 병렬을 그대로 보존하되, ‘wood’는 문맥상 번제용 재료로 이해되므로 가장 직접적인 ‘나무’를 택했습니다.
- source_word: በግዕ፡ ዘለጽንሓሕ
  english_pob_choice: the sheep for the burnt offering
  chosen_korean: 번제할 양
  alternatives_korean:
  - 번제 제물로 드릴 양
  - 번제용 양
  lexicon: 희생제사 표현
  rationale: 영어 본문이 ‘burnt offering’을 분명히 반영하므로 제사 목적을 드러내는 ‘번제할 양’으로 압축했습니다.
theological_decisions:
- issue: 직접 화법 안에서의 격식과 친밀성
  chosen_reading: 아이의 직접 호칭은 친밀한 반말형을 유지하고, 상대를 향한 외침은 정중한 해설 문체로 분리했습니다.
  alternative_readings:
  - 전 구절을 모두 합쇼체로 평준화
  - 전 구절을 모두 반말체로 통일
  rationale: 부자 관계의 긴장과 애정이 원문 대화 구조의 핵심이므로, 한국어에서도 관계의 온도를 살리는 것이 내용 충실성에 부합합니다.
  doctrine_reference: 서사 대화의 화행 보존
