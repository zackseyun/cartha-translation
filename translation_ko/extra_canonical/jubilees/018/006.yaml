  text: 'And Isaac said to his father, “Father.” And he said, “Here I am, my son.” And he said to him, “Look: the fire and the knife and the wood—but where is the sheep for the burnt offering, father?”'
translation:
  language: ko
  text: 그리고 이삭이 자기 아버지에게 말했습니다. “아버지.” 그러자 그가 말했습니다. “내가 여기 있단다, 내 아들아.” 그가 아버지에게 말했습니다. “보십시오, 불과 칼과 나무는 있는데, 번제할 양은 어디에 있습니까, 아버지?”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአቡሁ / 아버지 호칭
  english_pob_choice: father / my father
  chosen_korean: 아버지
  alternatives_korean:
  - 아빠
  - 아버님
  lexicon: 가족 호칭
  rationale: 원문과 영어 본문 모두에서 부자 간 직접 호칭이므로, 현대 한국어의 자연스러운 직접 호칭인 ‘아버지’를 유지했습니다.
