  rationale: 문맥상 특정한 목적지를 가리키는 일반 명사이므로, 자연스러운 지시 표현인 ‘그곳’으로 옮겼습니다.
- source_word: ዐዘቅተ፡ ማይ
  english_pob_choice: the well of water
  chosen_korean: 물이 있는 우물
  alternatives_korean:
