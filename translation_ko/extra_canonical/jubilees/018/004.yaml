  text: 그리고 그는 멀리서 그곳을 보았습니다. 그리고 그는 물이 있는 우물 가까이까지 왔고, 자기 종들에게 말했습니다. "여기에 나귀들과 함께 머물러 있으십시오. 나와 아이는 저기까지 가서 예배하고, 당신들에게 돌아오겠습니다."[a][b]
  philosophy: optimal-equivalence
