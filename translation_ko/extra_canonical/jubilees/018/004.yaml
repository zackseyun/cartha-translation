  text: And he saw the place from afar. And he came as far as the well of water, and he said to his servants, “Stay here with the donkeys, and I and the boy will go on, and we will worship, and we will return to you.”
  footnotes:
  - marker: a
    text: Or 'water-pit'.
    reason: previous_rendering
  - marker: b
    text: Or 'with the donkey'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 멀리서 그곳을 보았습니다. 그는 물이 있는 우물[a]에 이르러 자기 종들에게 이렇게 말했습니다. “여기에 나귀들과[b] 함께 머물러 있으십시오. 나와 아이는 가서 예배드리고 여러분에게 돌아오겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “물웅덩이”.
    reason: ዐዘቅተ ማይ는 ‘물이 있는 우물’로 옮기는 것이 적절하나, 첫 명사는 문맥에 따라 물웅덩이 또는 구덩이를 가리킬 수도 있습니다.
  - marker: b
    text: 또는 “나귀와 함께”.
    reason: 이전 번역 전통의 단수 독법을 알리되, 본문의 አድግት가 복수이므로 본문은 ‘나귀들과’로 유지합니다.
