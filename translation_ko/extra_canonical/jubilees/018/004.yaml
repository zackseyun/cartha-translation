  - 물의 우물
  lexicon: 해당 없음
  rationale: POB의 수정본이 이 표현을 ‘well of water’로 확정했으므로, 중복을 피하면서도 원문의 물 관련 구체성을 살려 ‘물이 있는 우물’로 옮겼습니다.
- source_word: አድግት
  english_pob_choice: the donkeys
  chosen_korean: 나귀들
  alternatives_korean:
  - 나귀
  - 당나귀들
  lexicon: 해당 없음
  rationale: 영어 POB가 복수로 수정했으며, 게에즈 복수형을 반영해 ‘나귀들’로 번역했습니다.
- source_word: ምስለ
  english_pob_choice: with
  chosen_korean: 함께
  alternatives_korean:
  - 과 함께
  - 와 함께
  lexicon: 해당 없음
  rationale: 종들에게 나귀들과 함께 머물라는 뜻을 자연스럽게 드러내기 위해 한국어 부사구로 처리했습니다.
theological_decisions:
- issue: 예배하다의 공적-제의적 뉘앙스
  chosen_reading: ‘예배하다’로 직역해 아브라함과 소년이 하나님께 드릴 행위를 분명히 했습니다.
  alternative_readings:
  - 경배하다
  - 제사를 드리다
  rationale: 원문 동사는 단순한 숭배 행위보다 하나님께 드리는 예배 행위를 가리키므로, 문맥을 따라 ‘예배하다’가 가장 직접적입니다.
  doctrine_reference: 창 22장 전승과 희년서의 아브라함 시험 서사
