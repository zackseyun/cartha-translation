  to: 그리고 그는 멀리서 그곳을 보았습니다. 그는 물이 있는 우물[a]에 이르러 자기 종들에게 이렇게 말했습니다. “여기에 나귀들과[b] 함께 머물러 있으십시오. 나와 아이는 가서 예배드리고 여러분에게 돌아오겠습니다.”
