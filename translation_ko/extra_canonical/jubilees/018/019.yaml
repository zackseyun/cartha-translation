theological_decisions:
- issue: ‘하늘의 판’의 우주론적·문서적 이미지
  chosen_reading: 문자 그대로 ‘하늘의 판’으로 유지해, 하늘에 기록된 신적 칙령이라는 묵시적 이미지를 보존했습니다.
  alternative_readings:
  - 비유적으로 ‘하늘의 책판’으로 의역
  - ‘하늘에 있는 기록판’으로 완화
  rationale: 본절은 단순한 기록이 아니라 하늘에 보관된 신적 문서의 권위를 강조하므로, 이미지를 약화하지 않는 쪽을 택했습니다.
  doctrine_reference: Second Temple apocalyptic imagery
