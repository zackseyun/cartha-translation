translation:
  language: ko
  text: 이와 같이, 이스라엘과 그 자손에 관하여, 그들이 이 축제를 축제의 기쁨으로 칠 일 동안 지키도록 하늘의 판에 규정되어 기록되어 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
