  chosen_korean: 그러므로
  alternatives_korean:
  - 이와 같이
  - 그리고 이렇게
  lexicon: source connective
  rationale: 앞절의 규정과 본절의 진술을 이어 주는 인과·귀결 연결로 자연스럽게 옮겼습니다.
- source_word: ሤሩዕ፡ ውእቱ፡ መጽሐፍ፡ ውስተ፡ ጽላተ፡ ሰማይ / it is ordained and written on the heavenly tablets
  english_pob_choice: it is ordained and written on the heavenly tablets
  chosen_korean: 기록되고 하늘의 판에 새겨져 있으며
  alternatives_korean:
