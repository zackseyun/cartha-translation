  text: 그러므로 그것은 기록되고 하늘의 판에 새겨져 있으며, 이스라엘과 그의 씨에 대하여 이 축제를 기쁨으로 칠 일 동안 지키게 되어 있습니다.[a]
  philosophy: optimal-equivalence
