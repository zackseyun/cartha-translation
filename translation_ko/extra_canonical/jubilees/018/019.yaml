  lexicon: source phrase
  rationale: ‘ordained and written’의 이중 표현을 살리되, ‘하늘의 판’은 문자 그대로 유지해 원문 이미지와 성격을 보존했습니다.
- source_word: ወዲበ፡ ዘርኡ / concerning Israel and his seed
  english_pob_choice: concerning Israel and his seed
  chosen_korean: 이스라엘과 그의 씨에 대하여
  alternatives_korean:
