  source_fidelity: 원문은 ‘높은 땅’으로 가라고 한 뒤, 하나님이 보여 주실 산들 가운데 하나에서 이삭을 바치라고 명합니다. 초안은 ‘내가 네게 보여 줄’이라는 수식어를 높은 땅에도 붙여, 원문에 없는 내용을 중복하여 삽입했습니다. 이를 산들에만 연결하도록 바로잡았습니다. ‘그를 바치십시오’는 ወአዕርጎ(그를 올려 드리다/바치다)의 제의적 명령을 무리 없이 반영합니다.
  naturalness: 합쇼체 서술과 명령의 높임말은 자연스럽습니다. 반복 호명은 한국어 호격으로 ‘아브라함아, 아브라함아’라고 하여 직접 부름을 분명히 했고, 불필요하게 반복된 수식어를 제거해 문장 흐름을 정리했습니다.
  terminology: ‘주님’은 이 번역의 신명 표기 선택 안에서 일관되고 자연스럽습니다. ‘높은 땅’은 ምድር ልዐልት의 명사-형용사 구성을 보존하며, ‘산들 가운데 하나에서’는 복수 산들 중 하나라는 표현을 충실히 옮깁니다.
