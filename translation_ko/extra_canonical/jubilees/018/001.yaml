  text: And the LORD said to Abraham, “Abraham, Abraham.” And he said, “Here I am.” And he said, “Take your son, your beloved one whom you love, Isaac, and go to the high land, and offer him up on one of the mountains that I will show you.”
  footnotes:
  - marker: a
    text: Or 'the land of the height'.
    reason: previous_rendering
  - marker: b
    text: Or 'offer him there'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 주님께서 아브라함에게 말씀하셨습니다. “아브라함, 아브라함.” 그가 말했습니다. “제가 여기 있습니다.” 또 말씀하셨습니다. “네 아들, 네 사랑하는 아들, 네가 사랑하는 이삭을 데리고, 내가 네게 보여 줄 높은 땅으로 가서, 내가 네게 보여 줄 산들 가운데 하나에서 그를 바치십시오.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 주
  lexicon: default divine name rendering
  rationale: 이 문맥은 서술문에서 하나님을 가리키는 직접 호칭이므로, 한국어 합쇼체 본문에서는 경건한 직접 호칭인 ‘주님’이 가장 자연스럽고, 본문 흐름을 해치지 않으면서도 고유명사화된 표기보다 읽기 쉽습니다.
- source_word: ንሣእ
  english_pob_choice: Take
  chosen_korean: 데리고
  alternatives_korean:
  - 취하십시오
  - 잡으십시오
  - 가져가십시오
  lexicon: imperative motion + accompaniment
  rationale: 단순한 ‘취하다’보다 아들을 함께 이동시키는 명령의 뉘앙스를 살려 ‘데리고’로 옮겼습니다.
- source_word: ወልደከ፡ ፍቁረከ፡ ዘታፈቅር፡ ይስሐቅሃ፡
  english_pob_choice: your son, your beloved one whom you love, Isaac
  chosen_korean: 네 아들, 네 사랑하는 아들, 네가 사랑하는 이삭
  alternatives_korean:
  - 네 아들, 네 사랑하는 이, 네가 사랑하는 이삭
  - 네 아들, 네 사랑하는 자, 네가 사랑하는 이삭
  lexicon: reduplicated affection formula
  rationale: 중복된 사랑의 표현을 그대로 살려 ‘네 사랑하는 아들, 네가 사랑하는 이삭’으로 반복 구조를 유지했습니다.
- source_word: ምድር፡ ልዐልት
  english_pob_choice: the high land
  chosen_korean: 높은 땅
  alternatives_korean:
  - 높은 나라
  - 고지
  lexicon: topographical phrase
  rationale: 문맥상 지리적 고도를 가리키는 표현이므로, 축약하거나 관용화하지 않고 직역에 가까운 ‘높은 땅’으로 옮겼습니다.
- source_word: ውስተ፡ አሐዱ፡ እምአድባር
  english_pob_choice: on one of the mountains
  chosen_korean: 산들 가운데 하나에서
  alternatives_korean:
  - 산들 중 하나에서
  - 산 하나에서
  lexicon: locative phrase
  rationale: ‘on one of the mountains’의 복수성과 위치감을 살려 한국어 자연성 안에서 ‘산들 가운데 하나에서’로 옮겼습니다.
theological_decisions:
- issue: 주어 ‘the LORD’의 한국어 신명 처리
  chosen_reading: ‘주님’으로 번역해 서술문 안에서 자연스럽게 읽히도록 했습니다.
  alternative_readings:
  - 야훼로 음역
  - 여호와로 음역
  rationale: 이 구절은 경고나 발화의 제목이 아니라 내러티브 본문이므로, 독서 흐름을 우선해 ‘주님’을 택했습니다. 다만 본문이 구약 신명 전승을 반영하는 점은 유지됩니다.
  doctrine_reference: divine name rendering policy
