  source_fidelity: 직접화법과 서술 모두 같은 게에즈 신칭 እግዚአብሔር를 사용합니다. 초안은 이를 각각 ‘하나님’과 ‘야훼’로 달리 옮겨 원문에 없는 구별을 만들었습니다. 또한 ይሬኢ의 ‘볼 것이다/스스로 살필 것이다’라는 표현은 공급의 함의를 지니지만, 본문에서 ‘마련하다’로 단정하지 않는 편이 더 충실합니다.
