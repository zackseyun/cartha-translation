  text: And he said, “God will see for himself the sheep for the burnt offering, my son.” And he came near to the place of the mountain of the LORD.
translation:
  language: ko
  text: 그리고 그가 말하였습니다. 「하나님께서 번제할 양을 친히 보실 것입니다, 내 아들아.」 그리고 그는 야훼의 산이 있는 곳에 가까이 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 주님
  - 야훼
  lexicon: divine-name
  rationale: Geʽez 원문은 일반적인 신칭을 사용하며, 이 절의 인용된 직접화법 안에서는 보통의 서술형 신칭인 ‘하나님’이 가장 자연스럽습니다.
- source_word: ይሬኢ
  english_pob_choice: will see for himself
  chosen_korean: 친히 보실 것입니다
  alternatives_korean:
  - 보실 것입니다
  - 스스로 보실 것입니다
  lexicon: ראה
  rationale: ‘보다’의 단순 미래보다, 준비와 공급을 책임지는 뉘앙스를 살려 POB의 ‘for himself’를 ‘친히’로 옮겼습니다.
- source_word: በግዐ፡ ለጽንሓሕ
  english_pob_choice: the sheep for the burnt offering
  chosen_korean: 번제할 양
  alternatives_korean:
  - 번제용 양
  - 번제물을 위한 양
  lexicon: זבח/양
  rationale: 문맥상 제물로 드릴 어린 양을 가리키므로, 자연스럽고 간결한 제의 표현인 ‘번제할 양’으로 옮겼습니다.
- source_word: መካን፡ ዘ*ደብረ፡ እግዚአብሔር
  english_pob_choice: the place of the mountain of the LORD
  chosen_korean: 야훼의 산이 있는 곳
  alternatives_korean:
  - 야훼의 산의 곳
  - 주님의 산이 있는 곳
  lexicon: topography
  rationale: 원문은 장소 표지를 강조하므로 ‘산이 있는 곳’으로 풀어, 이어지는 도착 동작과 매끈하게 연결했습니다.
theological_decisions:
- issue: 직접화법 안의 신칭 번역
  chosen_reading: 하나님으로 유지하고, 본문 밖 지시 표지에서 ‘야훼’는 산의 고유 표지로만 드러냈습니다.
  alternative_readings:
  - 직접화법 전체를 야훼로 통일
  - 직접화법 전체를 주님으로 완화
  rationale: 이 절은 인물의 발화와 서술이 겹치는 장면이므로, 원문의 신칭을 과도하게 동일화하지 않고 서술과 지명을 구분해 보존했습니다.
  doctrine_reference: divine-name usage and source-text distinction
