- from: 그리고 그가 말하였습니다. 「하나님께서 번제할 양을 친히 보실 것입니다, 내 아들아.」 그리고 그는 야훼의 산이 있는 곳에 가까이 갔습니다.
  to: 그리고 그가 말하였습니다. “하나님께서 번제물로 드릴 양을 친히 보실 것입니다, 내 아들아.” 그리고 그는 하나님의 산이 있는 곳 가까이 갔습니다.
