  text: And the LORD called to Abraham by name a second time from heaven, as he had shown me, that we should speak in the name of the LORD.
translation:
  language: ko
  text: 그리고 주님께서 하늘에서 아브라함에게 이름을 불러 두 번째로 말씀하셨습니다. 그분이 내게 보여 주신 것처럼, 우리는 주님의 이름으로 말해야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዖ ... ለአብርሃም በስሙ
  english_pob_choice: called to Abraham by name
  chosen_korean: 아브라함에게 이름을 불러
  alternatives_korean:
  - 아브라함을 그의 이름으로 부르시고
  - 아브라함을 이름으로 부르시고
  lexicon: 콜/부르다
  rationale: 게에즈 문맥의 직접적 호출을 살려 ‘이름을 불러’로 옮기면, 단순히 ‘아브라함을 부르셨다’보다 호출 방식이 드러납니다.
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 주
  lexicon: YHWH
  rationale: 본문의 신적 호칭은 기본값상 야훼가 가능하지만, 이 외경 본문은 독자 가독성을 위해 인물 발화의 직접 호칭으로 ‘주님’을 택했습니다.
- source_word: ዳግመ ... እምሰማይ
  english_pob_choice: a second time from heaven
  chosen_korean: 하늘에서 ... 두 번째로
  alternatives_korean:
  - 하늘로부터 ... 다시 한 번
  - 하늘에서 ... 다시
  lexicon: secondary repetition + source preposition
  rationale: ‘다시’보다 ‘두 번째로’가 반복 횟수의 정확성을 더 분명히 드러내며, ‘하늘에서’는 원문의 장소 표지를 자연스럽게 반영합니다.
- source_word: በከመ አስተረአየኒ ... ንትናገር በስመ እግዚአብሔር
  english_pob_choice: as he had shown me, that we should speak in the name of the LORD
  chosen_korean: 그분이 내게 보여 주신 것처럼, 우리는 주님의 이름으로 말해야 합니다
  alternatives_korean:
  - 그분이 내게 보여 주신 대로, 우리가 주님의 이름으로 말하도록
  - 그분이 내게 보이신 대로, 우리는 주님의 이름으로 말해야 합니다
  lexicon: compare + purpose/result clause
  rationale: 게에즈의 비교절과 목적/결과절을 보존하면서, 한국어에서는 유려하게 ‘보여 주신 것처럼’과 ‘말해야 합니다’로 연결했습니다.
theological_decisions:
- issue: 하나님 이름의 한국어 표기
  chosen_reading: 이 절에서는 반복되는 신적 호칭을 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 외경/주석성 본문에서 가독성과 예배적 과도한 개입을 줄이기 위해, 직접 인용의 문장 흐름을 우선했습니다.
  doctrine_reference: 명명 규범 및 본문 장르 적합성
- issue: ‘우리가 말해야 합니다’의 1인칭 복수
  chosen_reading: ‘we should speak’는 내레이션의 공동 발화 의도를 반영하여 ‘우리는 ... 말해야 합니다’로 옮겼습니다.
  alternative_readings:
  - 우리가 ... 말하도록
  - 말하게 하셨습니다
  rationale: 원문은 아브라함만이 아니라 화자와 함께하는 발화의 목적을 담고 있어, 의무/필연의 뉘앙스를 가진 ‘말해야 합니다’가 가장 직접적입니다.
  doctrine_reference: 서술 시점과 공동체적 발화의 문법
