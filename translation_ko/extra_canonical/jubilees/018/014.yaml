    rationale: 한국어에서는 사람을 이름으로 부르는 경우 ‘아브라함의 이름을 부르다’ 또는 ‘아브라함을 이름으로 부르다’라고 하는 것이 자연스럽습니다.
  - severity: medium
    issue: 후반절의 관계를 ‘우리는 ... 말해야 합니다’라는 독립된 의무 진술로 확정함
    rationale: 원문은 ‘내게 보여 주신 것처럼/as he had shown me’과 ‘우리가 ... 말하도록/that we should speak’의 연결이 난해합니다. 이를 독립적 규범 문장으로 확정하지 않고 비교절과 내용절의 연결을 보존해야 합니다.
