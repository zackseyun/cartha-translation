  source_fidelity: 원문의 순서는 충실히 따르지만, ቃለ፡ ዚአየ(‘내 음성’)를 단순히 ‘들었기 때문’으로 옮기면 순종의 함의가 약해질 수 있습니다. ‘내 음성에 순종했기 때문입니다’는 원문과 영어 POB의 ‘obeyed my voice’를 자연스럽게 반영합니다. 또한 በኵሉ፡ ዘእቤለከ는 ‘내가 네게 말한 모든 것에서’가 ‘모든 일에서’보다 직접적입니다.
