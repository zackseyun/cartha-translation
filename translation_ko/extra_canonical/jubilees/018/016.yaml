  text: And in your seed all the nations of the earth will be blessed, because you have obeyed my voice, and I have made known to all that you are faithful to me in all that I have said to you. Go in peace.”
translation:
  language: ko
  text: 그리고 네 씨로 말미암아 땅의 모든 민족이 복을 받을 것입니다. 이는 네가 내 음성에 순종했기 때문입니다. 또 내가 네가 내가 네게 말한 모든 것에서 나에게 신실하다는 것을 모두에게 알렸습니다. 평안히 가십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘርእከ
  english_pob_choice: in your seed
  chosen_korean: 네 씨로 말미암아
  alternatives_korean:
  - 네 자손으로 말미암아
  - 네 후손을 통해
  lexicon: 씨
  rationale: 문맥상 집합적 후손을 가리키지만, 원문과 POB의 직역성을 살려 ‘씨’로 두고 한국어 자연성을 위해 ‘말미암아’를 덧붙였습니다.
- source_word: ቃለ፡
  english_pob_choice: my voice
  chosen_korean: 내 음성
  alternatives_korean:
  - 내 목소리
  - 내 말을
  lexicon: 음성
  rationale: 원문은 ‘소리/음성’을 가리키므로, 단순히 ‘말’로 평준화하지 않고 ‘내 음성’으로 옮겼습니다.
- source_word: ምእመን
  english_pob_choice: faithful
  chosen_korean: 신실하다는
  alternatives_korean:
  - 믿음직하다는
  - 충실하다는
  lexicon: 신실하다
  rationale: 하나님과의 관계에서 ‘faithful’의 언약적 충실성을 드러내기 위해 ‘신실하다’를 택했습니다.
- source_word: ሖር፡ በሰላም።
  english_pob_choice: Go in peace.
  chosen_korean: 평안히 가십시오.
  alternatives_korean:
  - 평강 가운데 가십시오.
  - 안녕히 가십시오.
  lexicon: 평안
  rationale: 축복/파송의 결구를 현대 한국어의 공손한 명령으로 살리되, ‘peace’의 의미를 ‘평안’으로 유지했습니다.
theological_decisions:
- issue: “your seed”의 범위
  chosen_reading: 아브라함의 한 개인적 후손만이 아니라, 약속을 이어받는 후손 전체를 포괄하는 표현으로 읽었습니다.
  alternative_readings:
  - 단수적 메시아 약속으로만 제한하는 읽기
  - 혈통적 자손 전체로만 한정하는 읽기
  rationale: 에티오피아어 본문과 POB는 모두 집합적 약속의 문맥을 유지하며, 여기서는 한 구절 안에서 메시아적 성취를 과도하게 특정하기보다 문면의 축복 선언을 보존하는 것이 적절합니다.
  doctrine_reference: 창 12:3; 갈 3:16-29
