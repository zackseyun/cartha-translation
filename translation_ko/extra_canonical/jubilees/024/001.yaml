  yaml_path: translation/extra_canonical/jubilees/024/001.yaml
  text: And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision[a] in the first year of the third week of this jubilee.
  footnotes:
  - marker: a
    text: The place-name is rendered literally from the Ge'ez as 'Well of the Vision.' It likely corresponds to the site known from Genesis, but the translation avoids importing the fuller traditional form into the main text.
    reason: cross_reference
    anchor_ref: '24:1'
  - marker: b
    text: Or 'his son. And he rose up from Hebron and went and dwelt at the Well of the Vision'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함이 죽은 뒤에 주님께서 그의 아들 이삭에게 복을 주셨습니다. 그는 헤브론에서 일어나 가서 환상의 우물에 머물렀습니다[a]. 이 희년의 셋째 주 첫해였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: YHWH
  rationale: 게으즈 원문이 언약명 יהוה 계열을 가리키므로, 본문에서는 직접적인 신명 호칭으로 '주님'을 쓰되 한국어 독자에게 자연스럽고 합쇼체 문맥에 맞게 처리했습니다.
- source_word: ባረኮ፡ ... ወልዱ
  english_pob_choice: blessed Isaac his son
  chosen_korean: 그의 아들 이삭에게 복을 주셨습니다
  alternatives_korean:
  - 이삭 그의 아들에게 복을 주셨습니다
  - 그의 아들 이삭을 복 주셨습니다
  lexicon: בָּרַךְ
  rationale: 축복 동사를 한국어의 자연스러운 서술인 '복을 주다'로 옮기고, 소유 관계 'his son'은 이삭이 아브라함의 아들임을 분명히 드러내도록 처리했습니다.
- source_word: ወኀደረ፡ ኀበ፡ ዐዘቅተ፡ ራእይ
  english_pob_choice: dwelt at the Well of the Vision
  chosen_korean: 환상의 우물에 머물렀습니다
  alternatives_korean:
  - 계시의 우물에 머물렀습니다
  - 환시의 우물에 거주했습니다
  lexicon: place-name rendering
  rationale: 영어 POB의 해설처럼 지명을 직역해 원문의 어감을 보존했습니다. '머물렀습니다'는 거주/체류를 무리 없이 담으면서 현대 한국어에 자연스럽습니다.
- source_word: በዓመት፡ አሐዱ፡ ዘሣልስ፡ ሱባዔ
  english_pob_choice: in the first year of the third week of this jubilee
  chosen_korean: 이 희년의 셋째 주 첫해였습니다
  alternatives_korean:
  - 이 희년의 셋째 주의 첫해였습니다
  - 희년의 셋째 주 첫해였습니다
  lexicon: chronological formula
  rationale: 희년-주-해의 연대 공식을 압축하지 않고 그대로 살리되, 한국어에서는 중복 조사 없이 간결하게 정리했습니다.
theological_decisions:
- issue: YHWH 호칭의 한국어 처리
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 원문은 언약적 주권자 호칭을 사용하지만, 본문 전체의 자연스러운 한국어 흐름과 합쇼체 서술을 고려해 '주님'으로 번역했습니다. 다만 본문 의미는 신명 호칭으로 유지됩니다.
  doctrine_reference: 성경 번역의 신명 처리 원칙
