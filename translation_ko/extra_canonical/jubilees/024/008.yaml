  text: 이삭은 이 주의 둘째 해에 이집트로 내려가려 했고, 블레셋 사람의 왕 아비멜렉에게 있는 그랄로 갔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይረድ
  english_pob_choice: was going to go down
  chosen_korean: 내려가려 했고
  alternatives_korean:
  - 내려가고자 했고
  - 내려가려 하였고
  - 내려가려는 길이었고
  lexicon: Ge'ez ይረድ
  rationale: 미완료형이 나타내는 의도·진행 중인 움직임을 살려, 실제 도착이 아니라 내려가려는 계획 상태였음을 분명히 했습니다.
- source_word: ዘዝ፡ ሱባዔ
  english_pob_choice: this week
  chosen_korean: 이 주의
  alternatives_korean:
  - 이번 주의
  - 이 주간의
  - 이 주의, 곧 여섯째 주의
  lexicon: Ge'ez ሱባዔ
  rationale: 원문의 지시어 '이'를 그대로 반영해 직역성을 살렸고, 주석 없이도 문맥상 주기 단위를 유지했습니다.
- source_word: ጌራርገ፡ ኀበ፡ አቤሜሌክ
  english_pob_choice: to Gerar, to Abimelech
  chosen_korean: 그랄로 … 아비멜렉에게 있는
  alternatives_korean:
  - 그랄로 … 아비멜렉 왕에게
  - 그랄로 … 아비멜렉에게
  - 그랄, 곧 아비멜렉에게
  lexicon: Ge'ez 지명/인명
  rationale: 그랄과 아비멜렉을 분리해 두 개의 목적지를 보존하고, ኀበ의 방향·대상 관계를 자연스럽게 '에게 있는'으로 풀었습니다.
- source_word: ንጉሠ፡ ፍልስጥኤም
  english_pob_choice: king of the Philistines
  chosen_korean: 블레셋 사람의 왕
  alternatives_korean:
  - 블레셋의 왕
  - 블레셋 사람들의 왕
  - 블레셋 족속의 왕
  lexicon: Ge'ez ንጉሠ + ethnonym
  rationale: 속격 관계를 자연스러운 한국어 소유격으로 옮겨, 아비멜렉의 정치적 신분을 간결하게 드러냈습니다.
