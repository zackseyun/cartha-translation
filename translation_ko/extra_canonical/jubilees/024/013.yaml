lexical_decisions:
- source_word: ሞተ፡ ለ*ይሙት።
  english_pob_choice: let him surely die.
  chosen_korean: 그가 반드시 죽게 하십시오.
  alternatives_korean:
  - 그를 반드시 죽게 하십시오.
  - 그는 반드시 죽어야 합니다.
  lexicon: 강조적 사동/명령 표현
  rationale: 게에즈 본문은 ‘반드시 죽게 하라’는 강한 명령을 담고 있으므로, 한국어에서도 결과의 필연성을 살린 사동 명령으로 옮겼습니다.
- source_word: በፍልስጥኤም፡
  english_pob_choice: in Philistia
  chosen_korean: 블레셋 땅에서
  alternatives_korean:
  - 블레셋에서
  - 필리스티아에서
  lexicon: 지명/지역명
  rationale: POB의 ‘in Philistia’를 따라 지역명을 지시하되, 한국어 독자가 바로 이해할 수 있도록 ‘블레셋 땅’으로 자연스럽게 풀었습니다.
- source_word: ወኮነ፡ ሎቱ፡ ጥሪት፡ ብዙኅ፡
  english_pob_choice: and he had much property,
  chosen_korean: 많은 재산을 가졌습니다.
  alternatives_korean:
  - 많은 소유를 가졌습니다.
  - 많은 재물을 소유했습니다.
  lexicon: 재산/소유
  rationale: ጥሪት은 물질적 소유를 가리키므로, 한국어에서도 ‘재산’이 가장 직접적이고 자연스러운 대응입니다.
theological_decisions:
- issue: ‘must die’의 명령 강도
  chosen_reading: 하나의 단순한 선언이 아니라 반드시 죽게 하라는 강한 명령으로 옮겼습니다.
  alternative_readings:
  - 그는 반드시 죽을 것입니다.
  - 그를 죽여야 합니다.
  rationale: 원문과 POB의 ‘let him surely die’는 결과의 확정과 명령성을 함께 담으므로, 둘을 약화하지 않도록 유지했습니다.
  doctrine_reference: 서술적/명령적 강세 보존
