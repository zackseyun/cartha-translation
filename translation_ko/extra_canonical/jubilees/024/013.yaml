  - 필리스티아에서
  lexicon: 지명/지역명
  rationale: POB의 ‘in Philistia’를 따라 지역명을 지시하되, 한국어 독자가 바로 이해할 수 있도록 ‘블레셋 땅’으로 자연스럽게 풀었습니다.
