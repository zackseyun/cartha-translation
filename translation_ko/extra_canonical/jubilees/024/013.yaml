lexical_decisions:
- source_word: ሞተ፡ ለ*ይሙት።
  english_pob_choice: let him surely die.
  chosen_korean: 그가 반드시 죽게 하십시오.
  alternatives_korean:
  - 그를 반드시 죽게 하십시오.
  - 그는 반드시 죽어야 합니다.
  lexicon: 강조적 사동/명령 표현
  rationale: 게에즈 본문은 ‘반드시 죽게 하라’는 강한 명령을 담고 있으므로, 한국어에서도 결과의 필연성을 살린 사동 명령으로 옮겼습니다.
- source_word: በፍልስጥኤም፡
  english_pob_choice: in Philistia
  chosen_korean: 블레셋 땅에서
