  text: And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and sojourn in that land, and I will be with you and bless you. For to you
translation:
  language: ko
  text: 그리고 주님께서 그에게 나타나 말씀하셨습니다. “이집트로 내려가지 마십시오. 내가 당신에게 말하는 땅에 머무르십시오. 그 땅에서 나그네로 지내십시오. 내가 당신과 함께 있고 당신에게 복을 주겠습니다. 이는 당신에게….”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 게으즈 본문과 영어 대조문은 여기서 ‘이는 당신에게’에 해당하는 말 뒤에 중단됩니다. 번역자는 뒤의 내용을 보충하지 않았습니다.
    reason: 제시된 원문 전승 단위의 절단을 독자에게 알리고, 번역문 말줄임표가 의미상 생략이나 의역이 아니라 제공 자료의 중단을 나타냄을 명시합니다.
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: YHWH
  rationale: 게으즈 본문은 야훼를 가리키며, 한국어 본문에서는 직접 발화의 자연스러움과 POB의 주(主) 용례를 고려해 대화문 서술부를 ‘주님’으로 옮겼습니다.
- source_word: ኢትረድ ግብጸ
  english_pob_choice: Do not go down to Egypt
  chosen_korean: 이집트로 내려가지 마십시오
  alternatives_korean:
  - 애굽으로 내려가지 마십시오
  - 이집트에 가지 마십시오
  lexicon: place-name / motion verb
  rationale: ‘내려가다’는 지리적·서사적 하강을 살리며, ‘이집트’는 현대 표준 표기를 택했습니다.
- source_word: ንበር ... ወ*ፍልስ
  english_pob_choice: Dwell in the land ... and sojourn in that land
  chosen_korean: 내가 말하는 땅에 머무르십시오. 그 땅에서 나그네로 지내십시오
  alternatives_korean:
  - 내가 말하는 땅에 거주하십시오. 그 땅에 잠시 머무르십시오
  - 내가 말하는 땅에 사십시오. 그 땅에 머무르십시오
  lexicon: verbs of residence / sojourning
  rationale: ‘머무르다’로 거주를, ‘나그네로 지내다’로 προσωριν한 체류와 이방인성의 뉘앙스를 살렸습니다. 영어 POB의 ‘sojourn’도 이 방향을 지지합니다.
- source_word: ወእባርከከ
  english_pob_choice: and I will be with you and bless you
  chosen_korean: 그러면 내가 당신과 함께 있을 것이며 당신에게 복을 주겠습니다
  alternatives_korean:
  - 내가 당신과 함께하며 당신에게 복을 주겠습니다
  - 내가 당신과 함께 있을 것이고 복을 주겠습니다
  lexicon: divine promise formula
  rationale: ‘함께 있을 것이다’와 ‘복을 주겠다’를 분리해 약속의 두 요소를 분명히 했고, 존대 화법은 하나님의 약속 발화에 맞게 유지했습니다.
theological_decisions:
- issue: 본문이 절 끝에서 끊겨 있어 후속 내용이 제시되지 않습니다.
  chosen_reading: 제공된 게으즈 원문과 영어 POB가 모두 "For to you"에서 중단되므로, 한국어도 동일하게 미완 결말을 드러내고 말줄임표로 처리했습니다.
  alternative_readings:
  - 문맥을 보충해 완결형으로 옮김
  - 절을 자연스럽게 마무리해 번역함
  rationale: 원문과 대조본이 모두 불완전한 상태에서 의미를 보강해 완결시키면 출처 기반성을 해칩니다.
  doctrine_reference: source fidelity / truncation handling
