translation:
  language: ko
  text: 야곱은 자라서 아버지의 명령을 지켰습니다. 그러나 에서는 그 명령을 저버렸습니다. 그리고 그 땅에 기근이 있었습니다. 그가 와서…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አህቀ
  english_pob_choice: grew up
  chosen_korean: 자라서
  alternatives_korean:
  - 성장하여
  - 장성하여
  lexicon: 성장/자람
  rationale: 게에즈 동사는 나이와 신체적 성숙의 의미를 가지므로, 지위의 증대를 뜻하는 표현보다 ‘자라다’가 더 직접적입니다.
- source_word: ይዕቀብ / ትእዛዘ
  english_pob_choice: kept the command
  chosen_korean: 아버지의 명령을 지켰고
  alternatives_korean:
  - 아버지의 명령을 지켰고
  - 아버지의 명령을 지키고
  lexicon: 지키다
  rationale: 문맥상 야곱이 순종했다는 의미를 분명히 하기 위해 ‘지켰다’를 택했습니다.
- source_word: ወኀለወ*ሱ፡ ትእዛዘ
  english_pob_choice: rejected it
  chosen_korean: 그것을 버렸습니다
  alternatives_korean:
  - 그것을 거절했습니다
  - 그것을 저버렸습니다
  lexicon: 버리다/저버리다
  rationale: 오독으로 ‘야곱이 떠났다’는 뜻이 되지 않도록, 본문의 대조 구조에 맞게 ‘명령을 버리다/저버리다’로 옮겼습니다.
- source_word: ዐባር፡ ዲበ፡ ምድር
  english_pob_choice: there was famine upon the land
  chosen_korean: 그 땅에 기근이 있었습니다
  alternatives_korean:
  - 그 땅에 기근이 있었습니다
  - 땅에 기근이 있었습니다
  lexicon: 기근
  rationale: 지시어를 살려 ‘그 땅에’로 옮기면 원문의 장소 범위를 더 자연스럽게 드러낼 수 있습니다.
theological_decisions:
- issue: 야곱과 에서의 도덕적 대비
  chosen_reading: 야곱은 순종하고 에서는 그 명령을 버린다는 대조를 분명히 했습니다.
  alternative_readings:
  - 야곱과 에서 모두를 중립적으로 처리하는 번역
  - 야곱이 명령에서 떠난다고 읽는 번역
  rationale: 주석된 게에즈 판독과 POB 감사 기록에 따르면 본문은 야곱의 순종과 에서의 거절을 대비시키며, 반대로 돌리면 본문 신학이 훼손됩니다.
  doctrine_reference: 본문 내 언약적 순종/불순종의 대비
