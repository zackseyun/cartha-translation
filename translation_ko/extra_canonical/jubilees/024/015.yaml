  text: among the Philistines and reaped a hundredfold. And Isaac became very great, and the Philistines envied him. And all the wells that the servants of Abraham had dug during Abraham's lifetime, the Philistines stopped up.
translation:
  language: ko
  text: 그가 블레셋 사람들 가운데서 백 배를 거두었습니다. 이삭은 매우 크게 되었고, 블레셋 사람들은 그를 시기하였습니다. 그리고 아브라함의 종들이 아브라함 생전에 판 모든 우물을 블레셋 사람들이 메워 버렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍልስጥኤም
  english_pob_choice: the Philistines / among the Philistines
  chosen_korean: 블레셋 사람들
  alternatives_korean:
  - 블레셋인들
  - 블레셋 사람
  lexicon: 고유명사 민족명
  rationale: 지리·민족 집단을 가리키므로 전통적 성서 지명/민족명인 ‘블레셋 사람들’을 사용해 자연스럽고 식별 가능하게 옮겼습니다.
- source_word: አዐረገ፡ መእተ፡ ስዊተ፡
  english_pob_choice: reaped a hundredfold
  chosen_korean: 백 배를 거두었습니다
  alternatives_korean:
  - 백 배의 수확을 거두었습니다
  - 백배로 거두었습니다
  lexicon: 수확 표현
  rationale: 문맥상 이삭의 농산물/소산의 결실을 말하므로 ‘거두었습니다’로 옮겨, 결과의 풍성함을 간결하게 드러냈습니다.
- source_word: ወዐብየ፡ ይስሐቅ፡ ፈድፋደ፡
  english_pob_choice: Isaac became very great
  chosen_korean: 이삭은 매우 크게 되었고
  alternatives_korean:
  - 이삭은 매우 위대해졌고
  - 이삭은 크게 번성했고
  lexicon: 성장/번성 표현
  rationale: 직역하면 ‘매우 커지다’이므로, 인물의 세력·재산의 증대를 자연스럽게 드러내는 ‘매우 크게 되었습니다’를 택했습니다.
- source_word: ወቀንኡ፡ ላዕሌሁ፡
  english_pob_choice: the Philistines envied him
  chosen_korean: 블레셋 사람들은 그를 시기하였습니다
  alternatives_korean:
  - 블레셋 사람들은 그를 질투하였습니다
  - 블레셋 사람들은 그에게 샘하였습니다
  lexicon: 감정 동사
  rationale: 경쟁적 적대감을 나타내는 표준어로 ‘시기하다’가 가장 직접적이며 문맥에 잘 맞습니다.
- source_word: ደፈንዎ
  english_pob_choice: stopped up
  chosen_korean: 메워 버렸습니다
  alternatives_korean:
  - 막아 버렸습니다
  - 흙으로 덮어 버렸습니다
  lexicon: 우물 폐쇄 동작
  rationale: 우물을 흙으로 메워 사용하지 못하게 한 행동을 한국어로 자연스럽게 드러내기 위해 ‘메워 버리다’를 사용했습니다.
theological_decisions:
- issue: 하나님 이름/직접 신학 용어의 부재
  chosen_reading: 이 절은 주로 서사적 진술로 구성되어 있어 별도의 신학 용어를 도입하지 않고, 원문의 사건 진행을 충실히 따랐습니다.
  alternative_readings:
  - 신학적 해설을 덧붙이는 방식
  - 보다 교훈적 문체로 재구성하는 방식
  rationale: 원문은 이삭의 번성, 블레셋 사람들의 시기, 우물 봉쇄라는 사건 묘사에 집중하므로 해설을 추가하면 문맥을 벗어납니다.
  doctrine_reference: 서사 문맥 보존 원칙
