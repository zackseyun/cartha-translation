translation:
  language: ko
  text: 그리고 넷째 주간의 첫해에, 아브라함 시대에 있었던 앞선 기근 외에도 그 땅에 기근이 임했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “in the first year of the fourth week”
  english_pob_choice: in the first year of the fourth week
  chosen_korean: 네 번째 주의 첫해
  alternatives_korean:
  - 네 번째 주의 첫 해
  - 네 번째 주 첫해
  lexicon: 주
  rationale: 게에즈의 ‘주간/주(week)’ 개념을 영어 POB의 ‘week’에 맞춰 직역하되, 한국어에서는 연대 단위로 읽히도록 자연스럽게 정리했습니다.
- source_word: “a famine came upon the land”
  english_pob_choice: a famine came upon the land
  chosen_korean: 그 땅에 기근이 임했습니다
  alternatives_korean:
  - 그 땅에 기근이 닥쳤습니다
  - 그 땅에 기근이 왔습니다
  lexicon: 기근
  rationale: ‘came upon’의 돌발성과 엄중함을 살려 ‘임하다’로 옮겼고, 성경 문체의 격식을 유지했습니다.
- source_word: “besides”
  english_pob_choice: besides the former famine
  chosen_korean: …외에
  alternatives_korean:
  - …말고도
  - …뿐 아니라
  lexicon: 외
  rationale: 앞선 기근과의 추가 관계를 간결하게 드러내는 연결로 처리했습니다.
- source_word: “the former famine that had been in the days of Abraham”
  english_pob_choice: the former famine that had been in the days of Abraham
  chosen_korean: 아브라함 시대에 있었던 이전의 기근
  alternatives_korean:
  - 아브라함 때에 있었던 앞선 기근
  - 아브라함 시대에 있던 먼저의 기근
  lexicon: 아브라함
  rationale: ‘days of Abraham’은 관용적으로 ‘아브라함 시대’로 옮기되, ‘former famine’은 ‘이전의 기근’으로 중복 없이 구분했습니다.
