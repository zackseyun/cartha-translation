  text: And to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And they will bless themselves
  footnotes:
  - marker: a
    text: Or 'And all the nations of the earth will bless themselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 네 씨에게 이 모든 땅을 주며, 내가 네 아버지 아브라함에게 맹세한 나의 맹세를 굳게 세우겠습니다. 또 네 씨를 하늘의 별들처럼 많게 하며, 네 씨에게 이 모든 땅을 주겠습니다. 그리고 그들은 스스로 복을 빌 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅의 모든 민족이 스스로 복을 빌 것입니다.”
    reason: 영어 POB 감사 기록에 보존된 대안적 확장 독해를 제시합니다. 제공된 게에즈 본문은 여기서 ‘그들은’이라고만 하므로, 확장된 주어는 본문이 아니라 각주에 둡니다.
lexical_decisions:
- source_word: ወለዘርእከ / ዘርእከ
  english_pob_choice: to your seed / your seed
  chosen_korean: 네 씨
  alternatives_korean:
  - 네 후손
  - 네 자손
  lexicon: 씨
  rationale: 게에즈의 ዘርእከ는 혈통적 후손을 가리키는 말로, POB의 English 'seed'를 반영해 한국어에서도 직역적이면서도 성경 문맥에 익숙한 '씨'를 택했습니다.
- source_word: መሐላ*የ፡ ዘመሐልኩ፡
  english_pob_choice: my oath that I swore
  chosen_korean: 내가 ... 맹세한 나의 맹세
  alternatives_korean:
  - 내가 맺은 맹세
  - 내가 서약한 나의 서약
  lexicon: 맹세
  rationale: 원문은 '나의 맹세'와 '내가 맹세한'을 병렬로 두어 강조하므로, 한국어도 중복을 유지해 맹세의 확정성과 엄숙함을 살렸습니다.
- source_word: ከመ፡ ከዋክብተ፡ ሰማይ፡
  english_pob_choice: like the stars of heaven
  chosen_korean: 하늘의 별들처럼
  alternatives_korean:
  - 하늘의 별처럼
  - 하늘 별무리처럼
  lexicon: 하늘의 별들
  rationale: 비유는 원문의 직유를 그대로 살려 '하늘의 별들처럼'으로 옮겼으며, 복수성을 드러내기 위해 '별들'을 택했습니다.
- source_word: ወይትባረኩ፡
  english_pob_choice: And they will bless themselves
  chosen_korean: 그리고 그들은 스스로 복을 빌 것입니다
  alternatives_korean:
  - 그리고 그들은 복을 받을 것입니다
  - 그리고 그들은 서로에게 복을 빌 것입니다
  lexicon: 복을 빌다
  rationale: 게에즈 동사는 재귀/중간태적 뉘앙스를 가질 수 있어, POB가 본문에 두고 각주로 다른 가능성을 남긴 점을 따라 '스스로 복을 빌 것입니다'로 옮겼습니다.
theological_decisions:
- issue: 문말 ወይትባረኩ의 의미 범위
  chosen_reading: 본문은 '그들은 스스로 복을 빌 것입니다'로 옮기고, 다른 읽기인 '그들은 복을 받을 것입니다'는 본문 밖으로 남겼습니다.
  alternative_readings:
  - 그들은 복을 받을 것입니다
  - 모든 민족이 스스로 복을 빌 것입니다
  rationale: 제공된 게에즈 문장은 '모든 민족'이 아니라 단순히 '그들은'으로 끝나며, 문법상 재귀적 의미가 가능하므로 본문은 축소하지도 확대하지도 않도록 유지했습니다.
  doctrine_reference: 본문비평/문법적 다의성
