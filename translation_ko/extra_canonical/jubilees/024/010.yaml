  source_fidelity: 전반적으로 게에즈 본문을 충실히 옮겼습니다. 마지막 ወይትባረኩ는 제공된 절 안에서 선행 명사를 명시하지 않으므로 ‘그들은’으로 유지한 것은 적절하며, ‘땅의 모든 민족’은 본문에 보태지 않았습니다. 다만 አቀውም의 ‘세우다/확립하다’에 ‘확증하다’는 증명한다는 뜻이 강하므로 더 직접적인 표현으로 고치는 것이 좋습니다.
  naturalness: ‘내가 … 맹세한 나의 맹세를 확증하겠습니다’는 한국어에서 다소 부자연스럽고 의미도 좁아집니다. ‘굳게 세우겠습니다’는 원문의 반복과 엄숙한 문체를 유지하면서 자연스럽습니다. 나머지 문장은 현대 한국어 합쇼체에 적합합니다.
