    rationale: ‘그가 야곱에게 자기 장자권과 맞바꾼 밀죽’은 누가 누구에게 무엇을 주었는지 문법적으로 혼란스럽습니다. 원문은 야곱이 에서의 장자권을 대가로 그에게 준 밀죽 때문에 에서가 에돔이라 불렸다고 합니다.
