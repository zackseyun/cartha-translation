    reason: segmentation_note
    anchor_ref: '24:11'
  - marker: b
    text: Or 'my charge and my commandments and my statutes and my covenant'.
    reason: previous_rendering
  - marker: c
    text: Or 'blessed, because'.
    reason: previous_rendering
translation:
  language: ko
  text: “당신의 씨로 말미암아 땅의 모든 민족이 복을 받을 것입니다. 이는 당신의 아버지가 내 음성에 순종하고, 내가 맡긴 의무와 내 명령들과 내 법들과 내 규례들과 내 언약을 지켰기 때문입니다.[a] 그리고 이제 내 음성에 귀를 기울이고 이 땅에 거주하십시오.” 그는 그랄에서 세 이레, 곧 스물한 해 동안 살았습니다. 아비멜렉은 그에 관하여 명령을 내렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 법적 열거는 의미가 서로 겹치는 부분이 있으나, 원문은 ‘내가 맡긴 의무’, ‘내 명령들’, ‘내 법들’, ‘내 규례들’, ‘내 언약’을 각각 구별하여 열거합니다.
    reason: segmentation_note
lexical_decisions:
- source_word: በዘርእከ፡
  english_pob_choice: By your seed
  chosen_korean: 네 씨로 말미암아
  alternatives_korean:
  - 당신의 후손으로
  - 네 자손으로
  lexicon: seed/offspring
  rationale: 게에즈 원문의 ‘씨’는 후손을 가리키는 집합적 표현이므로, 신학적 약어로 완화하지 않고 ‘씨’와 ‘말미암아’를 살려 원인·매개 관계를 드러냈습니다.
- source_word: ኵሎሙ፡ አሕዛበ፡ ምድር፡
  english_pob_choice: all the nations of the earth
  chosen_korean: 땅의 모든 민족
  alternatives_korean:
  - 세상의 모든 나라들
  - 땅의 모든 나라
  lexicon: nations of the earth
  rationale: ‘아합자베 메드르’의 관용적 범위는 민족 집단을 가리키므로, 한국어에서 자연스럽고 포괄적인 ‘민족’을 택했습니다.
- source_word: ዑቃቤየ፡ ወትእዛዛትየ፡ ወሕገጊየ፡ ወሥርዐትየ፡ ወኪዳንየ፡
  english_pob_choice: my charge and my commandments and my laws and my statutes and my covenant
  chosen_korean: 내 맡긴 것과 내 명령들과 내 법들과 내 규례들과 내 언약
  alternatives_korean:
  - 내 맡김과 내 명령들과 내 율례들과 내 규례들과 내 언약
  - 내 직무와 내 계명들과 내 법들과 내 규례들과 내 언약
  lexicon: legal list
  rationale: 원문은 다섯 항목을 분리해 열거하므로, POB의 세부 구분을 따라 ‘맡긴 것 / 명령들 / 법들 / 규례들 / 언약’으로 각각 살렸습니다.
- source_word: ወኀድር፡ ውስተ፡ ዛምድር።
  english_pob_choice: dwell in this land
  chosen_korean: 이 땅에 거주하십시오
  alternatives_korean:
  - 이 땅에 살십시오
  - 이 땅에 머무르십시오
  lexicon: dwell
  rationale: 명령형의 지속 거주를 표현해야 하므로 단순한 ‘머무르다’보다 계약적 정착 뉘앙스가 있는 ‘거주하십시오’를 택했습니다.
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመት።
  english_pob_choice: three weeks of years
  chosen_korean: 삼 주간의 해
  alternatives_korean:
  - 세 주간의 해
  - 세 이레의 해
  lexicon: time expression
  rationale: 직역성을 유지하되 한국어에서 의미가 전달되도록 ‘주간의 해’로 옮겼고, 수량은 한자식 ‘삼’으로 원문의 장중한 문체를 반영했습니다.
theological_decisions:
- issue: 언약적 축복의 주체와 인과 구조
  chosen_reading: “네 씨로 말미암아 땅의 모든 민족이 복을 받을 것입니다”로 옮겨, 축복의 미래적 선언과 ‘네 아버지의 순종’에 대한 인과를 함께 드러냈습니다.
  alternative_readings:
  - “네 씨로 말미암아 땅의 모든 민족이 복될 것입니다”
  - “네 씨로 땅의 모든 민족이 복을 얻을 것입니다”
  rationale: 원문과 POB의 선언형을 따라 하나님의 능동적 축복을 보이면서, 한국어에서는 자연스러운 수동 표현으로 미래 약속을 유지했습니다.
  doctrine_reference: 아브라함 언약/축복 약속
- issue: 열거된 율법 항목의 분리 유지
  chosen_reading: ‘맡긴 것과 명령들과 법들과 규례들과 언약’을 각각 분리해 번역했습니다.
  alternative_readings:
  - 항목을 ‘율법’으로 통합
  - ‘맡긴 것과 명령과 규례와 언약’로 축약
  rationale: 게에즈 본문과 POB 감사 기록이 모두 항목의 중복·긴장을 보존하므로, 한국어에서도 통합하지 않고 구분을 유지했습니다.
  doctrine_reference: 계시된 규정의 세분성과 언약 순종
