  language: ko
  text: 아브라함이 죽은 뒤에 그들이 그 우물을 흙으로 메웠습니다. 아비멜렉이 이삭에게 말하기를 “우리에게서 떠나가십시오. 당신이 우리보다 훨씬 더 강해졌기 때문입니다” 하였습니다. 이삭은 그곳을 떠나 제7주간의 첫해에 가서 그랄 골짜기에 진을 쳤습니다. 그는 아버지 아브라함의 종들이 팠던, 그리고 블레셋 사람들이 아브라함 그의 아버지가 죽은 뒤에 메워 버렸던 물의 우물들을 다시 팠으며, 아브라함 그의 아버지가 불렀던 이름대로 그 이름들을 불렀습니다. 이삭의 종들은 골짜기에서 우물을 파고 살아 있는 물을 얻었습니다. 그랄의 목자들이 이삭의 목자들과 다투며 “그 물은 우리 것입니다”라고 말하였습니다. 이삭은 그 우물의 이름을 “다툼”이라 불렀습니다. 그들이 우리와 다투었기 때문입니다. 그들이 또 다른 우물을 팠고, 그 우물 때문에도 다투었으므로 그는 그것의 이름을 “적대”라 불렀습니다. 이삭이 거기서 옮겨 가서 또 다른 우물을 팠는데, 그 일로는 다투지 않았으므로 그는 그것의 이름을 “넓은 곳”이라 불렀습니다. 이삭이 말하기를 “이제 야훼께서 우리를 위해 자리를 넓혀 주셨으니, 우리는 이 땅에서 번성할 것입니다” 하였습니다. 그는 거기서 올라가 제44희년의 첫째 주간 첫해에 맹세의 우물로 갔습니다. 그 밤, 곧 첫째 달의 첫날 새벽에 야훼께서 그에게 나타나 말씀하셨습니다. “나는 네 아버지 아브라함의 하나님이다. 두려워하지 말아라. 내가 너와 함께 있고, 내가 너를 복 주며 네 씨를 땅의 모래처럼 크게 번성하게 하겠다. 이는 내 종 아브라함을 위함이다.” 그는 거기에서 제단을 쌓았는데, 그것은 그의 아버지 아브라함이 먼저 쌓았던 제단이었습니다. 그리고 그는 야훼의 이름을 불렀으며, 그의 아버지 아브라함의 하나님께 제물을 드렸습니다. 그들이 우물을 파서 살아 있는 물을 얻었습니다. 이삭의 종들이 또 다른 우물을 팠으나 물을 얻지 못하여, 그들이 이삭에게 와서 물을 얻지 못했다고 알렸습니다. 이삭이 말하기를 “오늘 나는 블레셋 사람들에게 맹세하였는데, 이런 일이
    우리에게 일어났습니다” 하였습니다. 그래서 그는 그 곳의 이름을 맹세의 우물이라 불렀습니다. 거기에서 아비멜렉과 그의 동료 아훗삿과 그의 군대 지휘관 피골에게 맹세하였기 때문입니다. 이삭은 그날 자기가 평화를 이루기 위해 그들에게 억지로 맹세하였음을 알게 되었습니다. 그날 이삭은 블레셋 사람들을 저주하며 말하였습니다. “모든 민족들 가운데서 분노와 격노를 덧입은 블레셋 사람들은 저주를 받으라. 야훼께서 그들을 수치와 저주와 분노와 격노를 위해 죄 많은 민족들의 손, 곧 깃딤의 손에 넘기시기를 원한다. 원수의 칼과 깃딤의 손에서 살아남는 자들은, 의로운 백성이 그들을 하늘 아래에서 심판으로 뿌리째 뽑게 하라. 그들이 땅 위에서 대대로 내 자녀들의 원수와 미워하는 자들이 될 것이기 때문이다. 분노의 심판 날에 그들에게는 살아남은 자도, 도망치는 자도 남지 않을 것이다. 블레셋의 모든 씨는 멸망과 뿌리 뽑힘과 땅에서의 제거를 위하여 정해졌으며, 카프토르 사람들에게도 이제 땅 위에 남은 자나 씨가 더 이상 남지 않을 것이다. 비록 그가 하늘까지 올라간다 해도 거기서 내려올 것이며, 땅 속으로 가라앉는다 해도 거기서 끌려 나올 것이다. 그가 민족들 가운데 숨는다 해도 거기서 뿌리째 뽑힐 것이며, 스올로 내려간다 해도 거기서 그의 심판이 더욱 커질 것이고, 거기에는 그를 위한 평강이 없을 것이다. 그가 포로로 끌려간다 해도, 길에서 그의 생명을 찾는 자들의 손에 의해 죽임을 당할 것이며, 온 땅에 그를 위한 이름도 씨도 남지 않을 것이다. 그는 영원한 저주로 들어갈 것이기 때문이다.” 그리고 이 일은 하늘의 판에 그에 관해 기록되고 명령되었으니, 심판의 날에 그에게 행하여 그를 땅에서 뿌리 뽑게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
