  lexicon: 인칭대명사
  rationale: 질문 화자의 직접적 자기 관여를 자연스럽게 살리면서도, 문맥상 격식 있는 서술문에 어울리게 옮겼습니다.
- source_word: בְּכֹרָה / birthright of the firstborn
