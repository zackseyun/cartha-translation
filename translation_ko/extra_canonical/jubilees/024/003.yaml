  to: 야곱은 렌틸콩 죽을 끓였고, 에서는 들에서 배고픈 채로 왔습니다. 그가 자기 형 야곱에게 말했습니다. 「이 밀죽을 좀 주십시오.」[a] 그러자 야곱이 그에게 말했습니다. 「당신의 장자권을 나에게 파십시오.」
  rationale: 두 번째 음식 명칭을 게에즈어에 따라 ‘밀죽’으로 바로잡고, 원문 내 불일치는 해당 어구의 각주로 설명했습니다. ‘네 맏아들의 상속권’은 한국어 소유 관계가 모호하므로, 원문의 첫째 출생 지위와 권리를 정확히 나타내는 ‘당신의 장자권’으로 수정했습니다. 인물명, 서술 내용, 요청과 거래 요구의 강도는 유지했습니다.
  reviewer_model: gpt-5.6-terra
