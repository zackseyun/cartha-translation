  text: And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this wheat stew." And Jacob said to him, "Sell me your firstborn birthright."
  footnotes:
  - marker: a
    text: Or 'Sell me your birthright first.'.
    reason: previous_rendering
  - marker: b
    text: Or 'Give me some of this lentil stew.'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 렌틸콩으로 죽을 끓였고, 에서는 들에서 배고픈 채로 왔습니다. 그가 형 야곱에게 말했습니다. 「이 렌틸콩 죽을 좀 주십시오.」 그러자 야곱이 그에게 말했습니다. 「네 맏아들의 상속권을 나에게 파십시오.」[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተብሰለ፡ ብርስን / ተብሰል፡ ዘሥርናይ
  english_pob_choice: lentil stew / wheat stew
  chosen_korean: 렌틸콩 죽 / 이 렌틸콩 죽
  alternatives_korean:
  - 팥죽
  - 콩죽
  - 밀죽
  - 곡물 죽
  lexicon: lexical rendering of food terms
  rationale: 첫 절의 음식은 렌틸콩으로 만든 죽으로 분명하므로 이를 살렸고, 본문 뒤의 요청도 문맥상 같은 죽을 가리키는 것으로 자연스럽게 옮겨 반복을 유지했습니다. Geez에 나타난 ‘wheat stew’의 이질성은 본문 자체의 변이 가능성을 보여 주지만, 여기서는 독자가 장면을 바로 이해하도록 문맥 우선으로 번역했습니다.
- source_word: ልህቃኒከ፡ ዘቅድመ፡ ልደት
  english_pob_choice: your firstborn birthright
  chosen_korean: 네 맏아들의 상속권
  alternatives_korean:
  - 네 장자의 권리
  - 네 맏아들의 권리
  - 네 맏배의 상속권
  lexicon: lexical rendering of inheritance/status term
  rationale: 여기서 핵심은 단순한 ‘먼저’가 아니라 첫째 아들의 지위와 그에 따른 상속권이므로, 본문 의미를 드러내기 위해 ‘맏아들의 상속권’으로 옮겼습니다. ‘상속권’은 한국어에서 권리·몫을 함께 포괄하여 문맥에 적합합니다.
- source_word: ሀበኒ
  english_pob_choice: Sell me
  chosen_korean: 나에게 파십시오
  alternatives_korean:
  - 나에게 파세요
  - 나에게 넘기십시오
  - 나에게 주십시오
  lexicon: speech-act rendering
  rationale: 게으즈의 요구는 단순한 부탁이 아니라 거래를 요구하는 표현이므로, ‘주십시오’보다 직접적인 ‘파십시오’를 사용해 원문의 강도를 살렸습니다.
- source_word: ርኁብ
  english_pob_choice: hungry
  chosen_korean: 배고픈 채로
  alternatives_korean:
  - 배고파서
  - 허기가 져서
  - 굶주린 채로
  lexicon: state description
  rationale: 에서의 상태를 서술적으로 유지하기 위해 ‘배고픈 채로’로 옮겨, 들에서 돌아온 직후의 처지를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 첫째 아들의 지위와 상속의 강조
  chosen_reading: 본문의 마지막 요구를 단순한 시간 부사 ‘먼저’가 아니라 맏아들의 지위에 속한 상속권을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - ‘네 상속권을 먼저 나에게 파십시오’로 읽는 해석
  - ‘네 장자권을 나에게 파십시오’로 축약하는 해석
  rationale: Geez 형태가 ‘첫 출생/첫째 됨’의 의미를 분명히 포함하므로, 야곱의 요구가 에서의 장자 지위를 거래 대상으로 삼는다는 점을 보존해야 합니다.
  doctrine_reference: 창세기/희년서 전승의 장자권 모티프
