revisions:
- from: “너는 저주받았고, 야훼 앞에 있는 거룩한 재판관과 우리 아버지 노아 앞에서 맹세로 우리를 묶은 그 저주로 인해, 노아의 모든 아들들보다 더욱 저주받아야 합니다.”[a]
  to: “너는 저주를 받았습니다. 너는 노아의 모든 아들보다 더 큰 저주를 받게 될 것입니다. 이는 우리가 거룩한 재판관 앞과 우리 아버지 노아 앞에서 맹세로 우리 자신을 묶었던 그 저주로 말미암은 것입니다.”
  rationale: 신명 삽입을 제거하고 ‘거룩한 재판관 앞과 우리 아버지 노아 앞’이라는 병렬을 복원했습니다. 현재의 저주 선언과 장래의 저주 선언을 각각 ‘저주를 받았습니다’와 ‘저주를 받게 될 것입니다’로 구별했으며, ‘우리 자신을 묶었던’으로 oath-bound self-obligation을 보존했습니다. 대응 각주가 없는 [a]는 제거했습니다.
  reviewer_model: gpt-5.6-terra
