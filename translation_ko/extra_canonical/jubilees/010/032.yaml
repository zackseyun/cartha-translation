  text: Cursed are you, and cursed shall you be beyond all the sons of Noah, by the curse with which we bound ourselves by an oath before the holy judge and before Noah our father.”
translation:
  language: ko
  text: “너는 저주받았고, 야훼 앞에 있는 거룩한 재판관과 우리 아버지 노아 앞에서 맹세로 우리를 묶은 그 저주로 인해, 노아의 모든 아들들보다 더욱 저주받아야 합니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርጉም፡ አንተ፡ ወርጉመ፡ ትከውን፡
  english_pob_choice: Cursed are you, and cursed shall you be
  chosen_korean: “너는 저주받았고, ... 더욱 저주받아야 합니다”
  alternatives_korean:
  - “너는 저주받았으며, ... 저주받게 될 것입니다”
  - “너는 저주 아래 있고, ... 저주받을 것입니다”
  lexicon: 저주받다
  rationale: 아내피어(직접 저주 선언)를 유지하면서, 영어 POB의 반복 구조를 한국어에서도 대응시켜 현재형 선언과 미래/당위적 진술을 함께 살렸습니다.
- source_word: እምኵሎሙ ውሉደ ኖኅ
  english_pob_choice: beyond all the sons of Noah
  chosen_korean: “노아의 모든 아들들보다 더욱”
  alternatives_korean:
  - “노아의 모든 아들들 위에”
  - “노아의 모든 아들들 너머로”
  lexicon: 비교 표현
  rationale: 원문과 영어 모두 비교 우위를 말하므로, 한국어에서는 자연스러운 서열 비교인 ‘보다 더욱’으로 옮겼습니다.
- source_word: በመርገም፡ እንተ፡ ተማራዕነ፡ በመሐላ፡
  english_pob_choice: by the curse with which we bound ourselves by an oath
  chosen_korean: “맹세로 우리를 묶은 그 저주로 인해”
  alternatives_korean:
  - “맹세로 우리 자신을 묶었던 그 저주로 인해”
  - “우리가 맹세로 스스로에게 건 그 저주로 인해”
  lexicon: 묶다 / 맹세
  rationale: 원문의 ‘묶다’ 의미를 살리되 한국어에서는 관계절을 간결화하여, 영어 POB의 ‘bound ourselves by an oath’와 같은 언약적 구속을 드러냈습니다.
- source_word: ማኅደረ ሴም / ሴም፡
  english_pob_choice: before the holy judge and before Noah our father
  chosen_korean: “야훼 앞에 있는 거룩한 재판관과 우리 아버지 노아 앞에서”
  alternatives_korean:
  - “거룩한 재판관과 우리 아버지 노아 앞에서”
  - “거룩한 심판자와 우리 아버지 노아 앞에서”
  lexicon: 재판관
  rationale: ‘judge’는 법정적 의미를 분명히 보이기 위해 ‘재판관’으로 옮겼고, 하나님의 이름은 POB 관행에 따라 야훼로 표기했습니다.
theological_decisions:
- issue: 신적 칭호의 번역과 인명 호칭의 관계
  chosen_reading: ‘the holy judge’는 ‘거룩한 재판관’으로, 그 앞을 ‘야훼 앞에 있는’으로 풀어 신적 재판권을 분명히 했습니다.
  alternative_readings:
  - ‘거룩한 심판자’
  - ‘거룩한 하나님’
  rationale: 본문은 맹세의 증인이자 판결권을 가진 존재를 가리키므로, 심판 행위를 약화시키지 않는 법정적 표현을 택했습니다.
  doctrine_reference: 하나님의 재판권, 맹세의 증인성
