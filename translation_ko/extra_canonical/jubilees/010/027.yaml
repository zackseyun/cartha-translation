revisions:
- from: 그것은 아수르와 바벨론 사이, 시날 땅에 있었습니다. 그는 그 이름을 «무너짐»이라 불렀습니다. 그리고 그것은 네째 주, 첫 해의 시작에, 서른넷째 희년이었으며, 그들은 흩어졌습니다.[a]
  to: 그곳은 시날 땅의 아수르와 바벨론 사이에 있었습니다. 그는 그 이름을 ‘무너짐’이라고 불렀습니다. 그들은 제34희년 넷째 주간 첫째 해의 시작에 흩어졌습니다.
  rationale: 원문의 사건 배열과 통사 관계를 보존하도록 연대 구문을 ‘그들은 흩어졌습니다’에 직접 연결했습니다. 제34희년, ‘시작에’, 그리고 ደቀት의 의미역은 원문 및 정정된 영어 감사 기록에 따라 유지했습니다. 영어 감사 기록의 ‘서른일곱째’, ‘before this’, ‘Deket’ 대안은 이미 원문과 불일치하는 이전 판독으로 정정되었으므로 각주로 보존하지 않았습니다.
  reviewer_model: gpt-5.6-terra
