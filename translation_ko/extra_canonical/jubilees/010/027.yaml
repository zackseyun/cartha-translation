translation:
  language: ko
  text: 그것은 아수르와 바벨론 사이, 시날 땅에 있었습니다. 그는 그 이름을 «무너짐»이라 불렀습니다. 그리고 그것은 네째 주, 첫 해의 시작에, 서른넷째 희년이었으며, 그들은 흩어졌습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ማእከለ፡ አሱር፡ ወባቢሎን፡ ውስተ፡ ምድረ፡ ሰናአር
  english_pob_choice: between Asshur and Babylon, in the land of Shinar
  chosen_korean: 아수르와 바벨론 사이, 시날 땅에
  alternatives_korean:
  - 아슈르와 바빌론 사이, 신할 땅에
  - 앗수르와 바벨론 사이, 시날 땅에
  lexicon: 지명
  rationale: 지명은 현대 표기 관행을 따르되, 본문의 지리적 관계인 ‘사이’와 ‘땅에’를 유지해 원문의 위치 설명을 살렸습니다.
- source_word: ደቀት
  english_pob_choice: Overthrow
  chosen_korean: «무너짐»
  alternatives_korean:
  - «전복»
  - «추락»
  - «붕괴»
  lexicon: 명명어
  rationale: 원문은 장소 이름의 의미를 설명하는 이름 짓기이므로 음역보다 의미역이 더 직접적입니다. 영어 POB의 ‘Overthrow’를 따라 ‘무너짐’으로 옮겨 이름의 의미를 드러냈습니다.
- source_word: በ፴ሳባ፡ ወአርባዕቱ፡ እዮቤልው፡
  english_pob_choice: in the thirty-fourth jubilee
  chosen_korean: 서른넷째 희년이었으며
  alternatives_korean:
  - 서른일곱째 희년이었으며
  - 서른넷 희년이었으며
  lexicon: 연대표현
  rationale: 게으즈 수사형을 반영해 ‘서른넷째’로 옮겼습니다. 이는 수정된 영어 POB의 ‘thirty-fourth’와 일치합니다.
- source_word: ተዘርዉ፡
  english_pob_choice: they were dispersed
  chosen_korean: 그들은 흩어졌습니다
  alternatives_korean:
  - 그들은 퍼졌습니다
  - 그들은 분산되었습니다
  lexicon: 동사
  rationale: 원문은 집단이 흩어지는 결과를 서술하므로, 한국어에서 자연스럽고 직접적인 ‘흩어지다’를 택했습니다.
theological_decisions:
- issue: 명명된 장소의 의미역 처리
  chosen_reading: ‘무너짐’으로 번역해 이름의 뜻을 드러냈습니다.
  alternative_readings:
  - '단순 음역: ‘데켓’'
  - '혼합형: ‘데켓(무너짐)’'
  rationale: 이 문맥은 장소의 이름을 붙이는 행위 자체를 기록하므로, 의미를 가리는 음역보다 의미를 드러내는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문의 서사적 기능과 명명 동기
- issue: 희년 연대의 정확한 수치 반영
  chosen_reading: ‘서른넷째 희년’으로 반영했습니다.
  alternative_readings:
  - ‘서른일곱째 희년’
  - 각주로만 수치 변이를 처리
  rationale: 영어 POB의 이전 수치는 정정되었고, 기초 게으즈 수사도 34를 가리키므로 본문에는 수정된 수치를 반영해야 합니다.
  doctrine_reference: 본문 비평 및 수사 정합성
