translation:
  language: ko
  text: 그가 자기의 모든 아들보다 그를 더 사랑하였기 때문입니다. 노아는 그의 조상들과 함께 잠들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪያሁ (him)
  english_pob_choice: him
  chosen_korean: 그를
  alternatives_korean:
  - 그 사람을
  - 그에게
  lexicon: Ge'ez 인칭대명사 목적격
  rationale: 본문의 ኪያሁ는 독립 목적격 대명사이므로, 영어 POB의 ‘him’에 맞춰 한국어 목적격 ‘그를’로 옮겼습니다.
- source_word: ያፈቅር (loved)
  english_pob_choice: loved
  chosen_korean: 사랑하였기 때문입니다
  alternatives_korean:
  - 사랑하였습니다
  - 더 사랑했습니다
  lexicon: Ge'ez 동사 어근 ፈቅረ
  rationale: 결과적으로 앞 절의 이유를 드러내는 문맥을 살려 ‘-하였기 때문입니다’로 연결했으며, 사랑의 강도를 비교구문으로 받기 위해 ‘더 사랑하였기’ 구조를 사용했습니다.
- source_word: ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  english_pob_choice: more than all his sons
  chosen_korean: 자기의 모든 아들보다
  alternatives_korean:
  - 모든 아들보다
  - 그의 모든 아들보다
  lexicon: Ge'ez 비교 표현
  rationale: 비교 대상이 분명하므로 ‘보다’ 구문으로 자연스럽게 옮겼고, 소유격은 문맥상 주어의 자녀들을 가리켜 ‘자기의’로 처리했습니다.
- source_word: ወኖመ፡ ኖኅ፡ ምስለ፡ አበዊሁ
  english_pob_choice: And Noah slept with his fathers
  chosen_korean: 노아는 그의 조상들과 함께 잠들었습니다
  alternatives_korean:
  - 노아는 그의 조상들과 함께 누웠습니다
  - 노아는 조상들과 함께 잠들었습니다
  lexicon: 성경 관용구
  rationale: ‘잠들다’는 죽음을 가리키는 성경적 완곡법이므로 유지했고, ‘with his fathers’는 자연스러운 현대 한국어로 ‘그의 조상들과 함께’로 옮겼습니다.
theological_decisions:
- issue: 죽음을 가리키는 관용구의 처리
  chosen_reading: ‘잠들었습니다’로 옮겨, 죽음의 완곡적 표현을 유지했습니다.
  alternative_readings:
  - ‘죽었습니다’
  - ‘세상을 떠났습니다’
  rationale: 히브리 성경 계열의 전형적 관용을 살려, 본문의 직설적 종결보다 전승적 표현을 보존하는 쪽이 원문의 어감에 더 가깝습니다.
  doctrine_reference: 성경적 죽음 완곡법
