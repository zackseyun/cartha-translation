  source_fidelity: 두 절 모두의 핵심 의미는 대체로 충실합니다. ኪያሁ는 특정 인명으로 보충하지 않고 목적격 대명사 ‘그를’로 유지해야 하며, 현 번역은 이를 따릅니다. 다만 본문 끝의 [a] 표지는 이 절의 원문이나 현행 번역 내용에 근거한 주석으로 제시되지 않았고, 영어 감사 기록의 ‘Arpachshad’ 대안도 현행 ‘그를’에 붙일 수 없습니다.
  naturalness: ‘자기의 모든 아들’은 문법적으로 가능하나 현대 표준어에서는 ‘자신의 모든 아들’이 더 자연스럽습니다. ‘조상들과 함께 잠들었습니다’는 죽음을 가리키는 관용을 보존하면서도 자연스럽습니다.
