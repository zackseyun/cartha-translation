revisions:
- from: 시날 땅에서부터입니다. 함과 그의 아들들은 그에게 할당된 땅, 곧 그가 차지한 땅으로 갔습니다.[a]
  to: 시날 땅에서였습니다. 함과 그의 아들들은 그에게 할당되어 그가 얻은 땅으로 갔습니다.
  rationale: 문두의 원문 단편은 유지하되 한국어 표현을 다듬었습니다. ‘할당되어 그가 얻은 땅’으로 አሕዝት ሎቱ와 ዘረከበ를 모두 반영하고, 무단 탈취를 암시할 수 있는 ‘차지한’을 피했습니다. 대응 각주가 없는 [a]는 삭제했습니다. 영어 [28] 각주는 현 절의 Ge'ez 본문 및 현 번역과 관련되지 않은 앞선 영토 서술을 설명하므로 한국어 본문에 이식하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:17Z'
review_pass:
  verdict: revise
  source_fidelity: Ge'ez의 이동 기점(‘시날 땅에서’)과 함 및 아들들의 이동은 대체로 충실합니다. 그러나 ‘차지한’은 ዘረከበ의 ‘얻은/받은’보다 탈취의 함의를 띨 수 있어, 바로 뒤 절과의 대비 및 본문의 정당한 배분 의미를 흐릴 수 있습니다.
  naturalness: ‘시날 땅에서부터입니다’는 절 단위로 잘린 원문의 문두 단편을 반영하지만 한국어로 다소 어색합니다. ‘시날 땅에서였습니다’가 같은 단편성을 유지하면서 더 자연스럽습니다. 또한 ‘그에게 할당된 땅, 곧 그가 차지한 땅’보다 관계를 풀어 쓴 표현이 현대 한국어 문장에 자연스럽습니다.
  terminology: ‘할당된’은 배분된 몫이라는 አሕዝት의 의미를 적절히 전달합니다. ዘረከበ에는 ‘얻은’을 사용하여 ‘강제로 빼앗음’이라는 불필요한 뉘앙스를 피해야 합니다. 지명 ‘시날’과 인명 ‘함’은 적절합니다.
  issues:
  - severity: medium
    issue: ‘그가 차지한 땅’이 획득 동사에 탈취·점유의 뉘앙스를 더합니다.
    rationale: Ge'ez ዘረከበ는 여기서 그에게 배분된 땅을 얻거나 받은 것을 가리키며, 영어 감사 이력도 ‘acquired’를 불법 점거가 아닌 정당한 몫의 수령으로 설명합니다. ‘얻은’이 더 중립적이고 충실합니다.
  - severity: medium
    issue: 본문의 [a] 표지에 대응하는 한국어 각주가 없습니다.
    rationale: 제시된 초안에는 [a]가 있으나 제공된 한국어 각주가 없습니다. 또한 영어의 a 각주는 폐기된 ‘seized for himself’ 독법에 관한 것이므로, 수정된 본문에는 유지할 근거가 없습니다.
  revised_text: 시날 땅에서였습니다. 함과 그의 아들들은 그에게 할당되어 그가 얻은 땅으로 갔습니다.
  revised_footnotes: []
  revision_rationale: 문두의 원문 단편은 유지하되 한국어 표현을 다듬었습니다. ‘할당되어 그가 얻은 땅’으로 አሕዝት ሎቱ와 ዘረከበ를 모두 반영하고, 무단 탈취를 암시할 수 있는 ‘차지한’을 피했습니다. 대응 각주가 없는 [a]는 삭제했습니다. 영어 [28] 각주는 현 절의 Ge'ez 본문 및 현 번역과 관련되지 않은 앞선 영토 서술을 설명하므로 한국어 본문에 이식하지 않았습니다.
