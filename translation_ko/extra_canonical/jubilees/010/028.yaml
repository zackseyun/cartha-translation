  text: from the land of Shinar[28]. And Ham and his sons went into the land that was apportioned to him, which he acquired.
  footnotes:
  - marker: '28'
    text: The territorial description of Canaan's settlement is compressed and somewhat difficult. 'To the west, that is, to the sea' represents the inheritance region he should have taken rather than the Lebanon region where he actually settled.
    reason: segmentation_note
  - marker: a
    text: Or 'that he had seized for himself.'.
    reason: previous_rendering
translation:
  language: ko
  text: 시날 땅에서였습니다. 함과 그의 아들들은 그에게 할당되어 그가 얻은 땅으로 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድረ፡ ሲናአር።
  english_pob_choice: from the land of Shinar
  chosen_korean: 시날 땅에서부터입니다
  alternatives_korean:
  - 시날 땅으로부터
  - 시날 땅에서
  lexicon: 지명
  rationale: Ge'ez의 출발점 표지 እምd(‘from’)를 한국어 조사 ‘에서부터’로 자연스럽게 옮겨, 단순 지명 표기가 아니라 이동의 기점을 드러냈습니다.
- source_word: ወሖሩ፡ ካም፡ ወውሉዱ፡
  english_pob_choice: And Ham and his sons went
  chosen_korean: 함과 그의 아들들은 ... 갔습니다
  alternatives_korean:
  - 함과 그의 아들들은 ... 들어갔습니다
  - 함과 그의 아들들은 ... 향했습니다
  lexicon: 동사
  rationale: Ḥam과 아들들의 이동을 나타내는 단순 서술 동사로 이해하여, 과도한 해석 없이 ‘갔습니다’로 옮겼습니다.
- source_word: ውስተ፡ ምድር፡ እንተ፡ አሕዝት፡ ሎቱ፡ ዘረከበ።
  english_pob_choice: into the land that was apportioned to him, which he acquired
  chosen_korean: 그에게 할당된 땅, 곧 그가 차지한 땅
  alternatives_korean:
  - 그에게 배당된 땅, 곧 그가 얻은 땅
  - 그에게 분배된 땅, 곧 그가 받은 땅
  lexicon: 상속/할당
  rationale: POB 수정본의 ‘apportioned to him’와 ‘acquired’를 함께 반영하되, ‘차지한’으로 소유 획득의 결과를 살렸고 ‘할당된’으로 분깃의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: ‘seized for himself’가 아닌 ‘apportioned to him, which he acquired’로 읽는 문제
  chosen_reading: 함의 땅은 무단 점거가 아니라 그에게 배분되어 그가 얻은 몫으로 이해했습니다.
  alternative_readings:
  - 그가 스스로 빼앗은 땅
  - 그가 강제로 차지한 땅
  rationale: Ge'ez의 수동·사역적 표현과 POB 수정 이력을 따라, 본 절은 불법 탈취가 아니라 정당한 분깃의 수령을 말한다고 보았습니다.
  doctrine_reference: 분깃/상속 언어의 본문상 의미
