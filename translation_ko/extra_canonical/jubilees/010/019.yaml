  text: For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us go up by it into heaven.”
translation:
  language: ko
  text: 이는 그들이 아라랏 땅을 떠나 동쪽으로 시날에 이르렀기 때문입니다. 그의 시대에 그들은 성읍과 탑을 세웠으며, 이렇게 말했습니다. “자, 그 탑을 통해 하늘로 올라가자.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሲናአር / ὡς Shinar
  english_pob_choice: Shinar
  chosen_korean: 시날
  alternatives_korean:
  - 신할
  - 시나르
  lexicon: 지명
  rationale: 게즈 본문과 영어 POB의 Shinar를 표준적인 성서 지명인 시날로 옮겨, 장소 식별을 분명하게 했습니다.
- source_word: ፈለሱ፡ እምድረ፡ አራራት፡ መንገለ፡ ጽባሕ፡
  english_pob_choice: they departed from the land of Ararat eastward
  chosen_korean: 아라랏 땅에서 동쪽으로 나아가
  alternatives_korean:
  - 아라랏 땅에서 동쪽으로 떠나
  - 아라랏 땅을 떠나 동쪽으로
  lexicon: 동사구
  rationale: 출발과 방향 이동을 함께 담기 위해 ‘나아가’로 처리해, 단순 이동보다 서술의 흐름을 살렸습니다.
- source_word: ሐነጽዎ፡ ለሀገር፡ ወለማኅፈድ፡
  english_pob_choice: they built the city and the tower
  chosen_korean: 그들은 성읍과 탑을 세우며
  alternatives_korean:
  - 그들은 도시와 탑을 건설하며
  - 그들은 성읍과 망대를 세우며
  lexicon: 명사구/동사
  rationale: 성읍은 성서 문맥에 맞는 전통적 한국어를 쓰되, 영어 POB의 tower를 좇아 ‘탑’을 유지했습니다. ‘세우며’는 뒤따르는 발화와 연결되는 서술형 진행을 반영합니다.
- source_word: ንዕርግ፡ ቦቱ፡ ውስተ፡
  english_pob_choice: let us go up by it into heaven
  chosen_korean: 그쪽으로 올라가서 하늘에 이르자
  alternatives_korean:
  - 그것으로 하늘로 올라가자
  - 그것을 통해 하늘에 올라가자
  lexicon: 구문
  rationale: 게즈의 ‘~로/통하여 올라가다’라는 도구·매개 표현을 살리면서, 영어 POB의 직역적 ‘go up by it’에 맞춰 한국어로 자연스럽게 재구성했습니다.
theological_decisions:
- issue: 인용문 내부의 청유 표현
  chosen_reading: “자, 그쪽으로 올라가서 하늘에 이르자.”
  alternative_readings:
  - “자, 그것으로 하늘로 올라가자.”
  - “오라, 그로 말미암아 하늘에 올라가자.”
  rationale: 본문의 집단적 결의와 청유형 초대를 드러내기 위해 ‘자’와 ‘-자’를 유지했습니다. 이는 이야기 속 발화의 공동 행위를 분명히 합니다.
  doctrine_reference: 서사적 화행 재현
