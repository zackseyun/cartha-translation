revisions:
- from: 그들이 아라랏 땅에서 동쪽으로 나아가 시날로 갔습니다. 그리고 그들의 시대에 그들은 성읍과 탑을 세우며 말하기를, “자, 그쪽으로 올라가서 하늘에 이르자.” 하였습니다.[a]
  to: 이는 그들이 아라랏 땅을 떠나 동쪽으로 시날에 이르렀기 때문입니다. 그의 시대에 그들은 성읍과 탑을 세웠으며, 이렇게 말했습니다. “자, 그 탑을 통해 하늘로 올라가자.”
  rationale: 단수 소유 표현을 ‘그의 시대에’로 바로잡고, 탑을 가리키는 매개 표현을 ‘그 탑을 통해’로 명료하게 옮겼습니다. 완료된 서사 사건과 인용 발화의 연결을 현대 한국어 합쇼체에 맞게 다듬었으며, 대응 각주가 없는 [a] 표지는 삭제했습니다.
