  yaml_path: translation/extra_canonical/jubilees/010/018.yaml
  text: And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the counsel of wickedness to build for themselves a city and a tower in the land of Shinar.”
  footnotes:
  - marker: a
    text: Or 'in the land.'.
    reason: previous_rendering
  - marker: b
    text: Or 'counsel of wickedness, to build'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 서른셋째 희년, 둘째 주의 첫해에 펠렉이 롬나라는 아내를 맞이하였는데, 그 여자는 시나르의 딸이었습니다. 그 여자는 이 주의 넷째 해에 그에게 아들을 낳아 주었고, 그가 그 이름을 르우라고 지었습니다. 이는 그가 말하기를, 「보십시오, 사람의 자녀들이 악해졌습니다. 악한 계획으로 자기들을 위해 도시와 탑을 세우려고 하였기 때문입니다」라고 했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትውልድ፡ ለዕለተ፡ ደይን
  english_pob_choice: And in the thirty-third jubilee
  chosen_korean: 그리고 서른셋째 희년
  alternatives_korean:
  - 서른셋째 희년 때
  - 서른셋째 희년 가운데
  lexicon: 희년
  rationale: Geez의 연대 표지인 ‘jubilee’를 한국어 성경체에 맞게 ‘희년’으로 옮기고, 문맥상 시간 접속사는 자연스럽게 ‘그리고’로 처리했습니다.
- source_word: ነሥአ፡ ሎቱ፡ ፋሌክ፡ ብእሲተ
  english_pob_choice: Peleg took for himself a wife
  chosen_korean: 펠렉이 롬나라는 아내를 맞이하였는데
  alternatives_korean:
  - 펠렉이 자기에게 아내를 취하였는데
  - 펠렉이 아내를 얻었는데
  lexicon: 맞이하다
  rationale: ‘take a wife’의 결혼 결합을 현대 한국어에서 자연스럽고 품위 있게 드러내기 위해 ‘아내를 맞이하다’를 택했습니다.
- source_word: ስማ፡ ሎምና፡ ወለተ፡ ሲናአር
  english_pob_choice: whose name was Lomna, daughter of Shinar
  chosen_korean: 롬나라는 아내를 맞이하였는데, 그 여자는 시나르의 딸이었습니다
  alternatives_korean:
  - 이름은 롬나였고, 시나르의 딸이었습니다
  - 이름이 롬나인 시나르의 딸이었습니다
  lexicon: 시나르
  rationale: 인명과 지명은 기존 POB audit trail의 ‘Shinar’를 따라 시나르로 음역했고, ‘daughter of’는 관계를 분명히 하도록 소유격 구조로 처리했습니다.
- source_word: ወጸውዐ፡ ስሞ፡ ራገው
  english_pob_choice: And he called his name Reu
  chosen_korean: 그가 그 이름을 르우라고 지었습니다
  alternatives_korean:
  - 그 이름을 르우라 불렀습니다
  - 이름을 르우라고 불렀습니다
  lexicon: 르우
  rationale: ‘called his name’의 명명 행위를 한국어 서술문으로 자연스럽게 살리되, 성경식 이름 부여를 분명히 했습니다.
- source_word: በምክረ፡ ዐግ፡ ከመ፡ ይሕንፁ፡ ሎሙ፡ ሀገረ፡ ወማኅፈደ፡ ውስተ፡ ምድረ፡
  english_pob_choice: through the counsel of wickedness to build for themselves a city and a tower in the land
  chosen_korean: 악한 계획으로 자기들을 위해 도시와 탑을 세우려고 하였기 때문입니다
  alternatives_korean:
  - 악한 꾀로 자기들을 위해 도시와 탑을 세우려고 하였기 때문입니다
  - 악한 의논으로 자기들을 위해 도시와 탑을 세우려 했기 때문입니다
  lexicon: 계획
  rationale: Ge’ez의 ‘counsel of wickedness’를 ‘악한 계획’으로 옮겨 원인과 성격을 함께 드러냈으며, 행위 목적절은 과도한 해석 없이 간결하게 처리했습니다.
theological_decisions:
- issue: 문장 말미의 장소표현이 영어 본문에서 ‘in the land’로 남아 있지만, 주석 전승에서는 ‘of Shinar’가 문법상 보충되는지 여부가 논점입니다.
  chosen_reading: 본문에는 장소를 일반화해 '땅'으로만 두지 않고, 앞의 '시나르의 딸'과 연결되는 문맥을 자연스럽게 살려 지명 정보를 과도하게 새로 추가하지는 않았습니다.
  alternative_readings:
  - 그 땅에서
  - 시나르 땅에서
  rationale: 이번 절의 중심은 르우의 명명 사유이며, 지명은 이미 앞절 구조와 문맥으로 충분히 추적 가능하므로 한국어 본문은 설명을 확장하지 않는 쪽이 더 보수적입니다.
  doctrine_reference: 문맥 우선의 절 구분과 과잉보충 회피 원칙
