  lexicon: 수치·단위
  rationale: 영어 POB의 수치를 그대로 따라가되, palms는 고전적 길이 단위로서 한국어에서는 관용적으로 ‘뼘’이 가장 직관적입니다.
- source_word: ወ፲ወ፪ ምዕራፍ
  english_pob_choice: twelve stades
  chosen_korean: 열두 스타디온
  alternatives_korean:
