base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/021.yaml
  text: And they built it for forty-three years. Its breadth was 204 cubits[21], and the height of a brick was one third of one cubit; and its height amounted to 5,433 cubits and 2 palms, and twelve stades.
  footnotes:
  - marker: '21'
    text: The tower measurements in the Ethiopic are notoriously difficult, and some numerals/units may be corrupt. The translation preserves the transmitted figures as literally as possible, but the exact dimensions remain uncertain.
    reason: textual_variant
  - marker: a
    text: Or 'and the extent of one wall was thirteen stades, and of the other thirty stades.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 그것을 마흔세 해 동안 지었습니다. 그 넓이는 이백사 규빗이었고, 벽돌 한 장의 높이는 한 규빗의 삼분의 일이며, 그 높이는 오천사백삼십삼 규빗과 두 뼘, 그리고 열두 스타디온이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐነጽዎ
  english_pob_choice: they built it
  chosen_korean: 그들은 그것을 지었습니다
  alternatives_korean:
  - 그들은 그것을 세웠습니다
  - 그것을 지었습니다
  lexicon: 건축 동사
  rationale: 소스는 바벨탑의 건축을 말하므로 일반적인 ‘짓다’보다 건축 행위를 분명히 드러내는 ‘지었습니다’를 택했습니다.
- source_word: ግንፋለ ጽፍሑ
  english_pob_choice: Its breadth was 204 cubits
  chosen_korean: 그 넓이는 이백사 규빗이었고
  alternatives_korean:
  - 그 너비는 이백사 규빗이었고
  - 그 폭은 이백사 규빗이었고
  lexicon: 치수 표현
  rationale: 건축물의 가로 치수는 문맥상 ‘넓이’가 자연스럽고, 전통적 교회어보다 현대 독자가 바로 이해하기 쉽습니다.
- source_word: ሐምሳ ምእት ወአርባዐቱ ምእት ወሰላሳ ወሰለስቱ
  english_pob_choice: 5,433 cubits and 2 palms
  chosen_korean: 오천사백삼십삼 규빗과 두 뼘
  alternatives_korean:
  - 오천사백삼십삼 규빗과 두 손바닥
  - 오천사백삼십삼 규빗과 두 뺨
  lexicon: 수치·단위
  rationale: 영어 POB의 수치를 그대로 따라가되, palms는 고전적 길이 단위로서 한국어에서는 관용적으로 ‘뼘’이 가장 직관적입니다.
- source_word: ወ፲ወ፪ ምዕራፍ
  english_pob_choice: twelve stades
  chosen_korean: 열두 스타디온
  alternatives_korean:
  - 열두 스타디아
  - 열두 경기장
  lexicon: 고유 단위 음역
  rationale: Ge'ez 수치가 12를 뜻하므로 영어의 보정 전후를 반영해 ‘열두’로 옮기고, 길이 단위는 고유명적 성격을 살려 음역했습니다.
theological_decisions:
- issue: 바벨탑 건축 연수와 치수의 전승
  chosen_reading: 수치가 전승된 그대로 제시되며, 본문은 해설 없이 측정값 자체를 보존합니다.
  alternative_readings:
  - 상징적 수치로 풀이
  - 본문 수치를 대폭 의역
  rationale: 이 절은 해석보다 전승된 숫자를 보존하는 것이 핵심이므로, 본문을 평이하게 옮기고 숫자에 대한 판단은 각주에 맡깁니다.
  doctrine_reference: 본문 비평 및 전승 보존 원칙
- issue: Ge'ez 본문의 12 스타디온
  chosen_reading: 영어 POB의 수정 내역을 따라 12를 본문에 반영했습니다.
  alternative_readings:
  - 초기 영어 보정안의 13을 따름
  - 주석으로만 불확정성 표기
  rationale: 최신 감수에서 Ge'ez 원문 ፲ወ፪를 12로 확정했고, 13은 이전 보정의 오독이므로 본문에는 반영하지 않았습니다.
  doctrine_reference: 문자 수치의 원문 우선 원칙
