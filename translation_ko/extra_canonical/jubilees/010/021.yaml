    rationale: '[a]에 연결된 영어의 이전 번역안은 게에즈어 본문에 없는 내용을 포함합니다. 반면 현행 영어 POB 본문은 204규빗 뒤에 전승 치수의 불확실성을 설명하는 각주 21을 둡니다. 한국어도 그 위치와 내용을 따라야 합니다.'
