  yaml_path: translation/extra_canonical/jubilees/010/020.yaml
  text: And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.
translation:
  language: ko
  text: 그들은 건축을 시작하였고, 넷째 주에는 불에 구워 벽돌을 만들었는데, 그 벽돌은 그들에게 돌이 되었고, 그들이 바르는 데 쓴 진흙은 바다에서, 그리고 시날 땅의 물샘들에서 나오는 역청이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ፡ ራብዕ
  english_pob_choice: in the fourth week
  chosen_korean: 넷째 주에는
  alternatives_korean:
  - 네 번째 주에는
  - 넷째 시기에는
  lexicon: 주
  rationale: 원문의 시간 단위는 주(week)로 제시되므로 이를 직접 살려 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ይሕንጹ፡
  english_pob_choice: began to build
  chosen_korean: 건축하기 시작하였고
  alternatives_korean:
  - 짓기 시작하였고
  - 건설하기 시작하였고
  lexicon: 짓다 / 건축하다
  rationale: 문맥상 도시나 구조물을 세우는 행위이므로 ‘건축하다’가 가장 무난하며, 시작의 완료상도 반영했습니다.
- source_word: ንንፈሱ፡ በእሳት፡
  english_pob_choice: made brick with fire
  chosen_korean: 불로 벽돌을 만들었는데
  alternatives_korean:
  - 불에 굽어 벽돌을 만들었는데
  - 불로 구운 벽돌을 만들었는데
  lexicon: 벽돌
  rationale: 원문의 핵심은 벽돌 제작 방식이므로 ‘불로’와 ‘벽돌’을 직설적으로 배치해 공정을 분명히 드러냈습니다.
- source_word: ንንፋስ፡ ... አስፋሌጦስ፡
  english_pob_choice: the clay with which they plastered was asphalt
  chosen_korean: 그들이 바른 진흙은 ... 역청이었습니다
  alternatives_korean:
  - 그들이 이은 진흙은 ... 아스팔트였습니다
  - 그들이 바른 흙은 ... 역청이었습니다
  lexicon: 역청
  rationale: 영어 POB의 asphalt를 성경 문맥에 맞게 ‘역청’으로 옮겨, 시날 땅의 건축 재료라는 고대적 의미를 살렸습니다.
- source_word: እምነ፡ ባሕር፡ ወእምአንቅዐተ፡
  english_pob_choice: that comes out of the sea and from the springs of water in the land of Shinar
  chosen_korean: 바다에서 나오고 시날 땅의 샘들에서 나오는
  alternatives_korean:
  - 바다와 시날 땅의 물샘에서 나오는
  - 바다에서 비롯되고 시날 땅의 샘물에서 나오는
  lexicon: 샘들
  rationale: 복수형을 반영해 ‘샘들’로 옮겼으며, 출처가 바다와 지하수성 샘이라는 대조를 보존했습니다.
theological_decisions:
- issue: 시날 땅 표기와 고대 건축 재료의 현장감
  chosen_reading: 시날 땅
  alternative_readings:
