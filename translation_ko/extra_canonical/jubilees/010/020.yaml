revisions:
- from: 그들은 건축하기 시작하였고, 넷째 주에는 불로 벽돌을 만들었는데, 그 벽돌은 그들에게 돌과 같았으며, 그들이 바른 진흙은 바다에서 나오고 시날 땅의 샘들에서 나오는 역청이었습니다.[a]
  to: 그들은 건축을 시작하였고, 넷째 주에는 불에 구워 벽돌을 만들었는데, 그 벽돌은 그들에게 돌이 되었고, 그들이 바르는 데 쓴 진흙은 바다에서, 그리고 시날 땅의 물샘들에서 나오는 역청이었습니다.
  rationale: 벽돌이 돌과 단지 닮았다는 뜻이 아니라 돌의 구실을 했다는 원문의 관계를 보존하도록 수정했습니다. 또한 바르는 재료의 용도를 명료하게 하고, 내용 없는 각주 표지를 제거했습니다. 지명, 시간 단위, 역청이라는 건축 재료 용어와 바다 및 시날 땅의 물샘이라는 출처는 유지했습니다.
