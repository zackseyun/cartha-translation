  source_fidelity: 첫 문장은 게에즈어의 ‘그것은 … 사이에 있다’와 일치하며, 주어가 앞 문맥의 탑/그 구조물을 가리킨다는 점을 과도하게 확정하지 않고 보존합니다. 둘째 문장의 복수 주어 ‘그들은’도 게에즈어 복수 동사와 영어 POB의 최신 교정을 정확히 반영합니다.
  naturalness: ‘전복’은 현대 한국어에서 주로 정권 등을 뒤엎는 행위를 뜻하므로, 붕괴 뒤의 폐허 이름이라는 문맥에서는 지명으로도 부자연스럽고 오해를 낳습니다. ‘파괴’가 이 문맥에서 더 자연스럽습니다.
  terminology: ‘시날’, ‘앗수르’, ‘바벨론’은 통용되는 성서 지명 표기입니다. 이름의 어원·형태가 에티오피아어 전승에서 불확실하다는 영어 POB 주석은 한국어에도 유지해야 합니다.
