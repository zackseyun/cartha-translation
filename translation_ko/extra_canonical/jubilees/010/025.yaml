translation:
  language: ko
  text: 그것은 시날 땅에 있는 앗수르와 바벨론 사이에 있습니다[25]. 그리고 그들은 그 이름을 ‘파괴’라고 불렀습니다.
  philosophy: optimal-equivalence
  footnotes:
