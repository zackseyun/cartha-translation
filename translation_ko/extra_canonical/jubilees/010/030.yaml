base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/030.yaml
  text: 'And Ham his father, and Cush and Mizraim his brothers, said to him: ''Because you have settled in a land which is not yours, and which did not fall to you by lot, do not do so; for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'''
  footnotes:
  - marker: a
    text: Or 'for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 함과 그의 아버지와 구스와 미스라임 형제들이 그에게 말했습니다. 「너는 네 것이 아닌 땅, 그리고 네 몫으로 제비뽑혀 주어진 것도 아닌 땅에 거주하였으니, 그렇게 하지 마십시오. 만일 그렇게 하면 너와 네 아들들은 그 땅에서 쓰러지고, 반역으로 말미암아 저주를 받을 것이기 때문입니다. 너는 반역으로 거주하였고, 네 아들들도 반역으로 쓰러질 것이며, 너는 영원히 뿌리째 뽑힐 것입니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤሎ፡ ካም፡ አቡሁ፡ ወኩስ፡ መውጽሬም፡ አኀዊሁ፡
  english_pob_choice: And Ham his father, and Cush and Mizraim his brothers, said to him
  chosen_korean: 함과 그의 아버지와 구스와 미스라임 형제들이 그에게 말했습니다
  alternatives_korean:
  - 그의 아버지 함과 그의 형제 구스와 미스라임이 그에게 말했습니다
  - 함 그의 아버지와 구스와 미스라임이 그에게 말했습니다
  lexicon: 고유명사/문장구조
  rationale: 게에즈 본문은 ‘함, 그의 아버지’와 ‘구스와 미스라임, 그의 형제들’을 병렬로 제시하므로, 영어 POB의 어순을 따라 관계를 드러내되 한국어에서는 자연스럽게 ‘함과 그의 아버지와 구스와 미스라임 형제들’로 옮겼습니다. 이는 본문의 화자 집단을 분명히 하면서도 원문의 구조를 보존합니다.
- source_word: እንተ፡ አኮነ፡ እንቲአከ፡ ወኢወፀአ፡ ለከ በዕፁ፡
  english_pob_choice: which is not yours, and which did not fall to you by lot
  chosen_korean: 네 것이 아닌 땅, 그리고 네 몫으로 제비뽑혀 주어진 것도 아닌 땅
  alternatives_korean:
  - 네 소유가 아닌 땅, 그리고 제비로 네게 돌아오지 않은 땅
  - 네 것이 아니며 제비로 네게 떨어지지 않은 땅
  lexicon: 소유/제비뽑기
  rationale: ‘네 것이 아닌’은 소유 부재를, ‘제비뽑혀 주어진 것도 아닌’은 ‘by lot’의 분배 의미를 살립니다. ‘땅’은 문맥상 반복되므로 한국어에서 중복을 최소화했지만 의미는 유지했습니다.
- source_word: ኢትግበር፡ ከመዝ፡
  english_pob_choice: do not do so
  chosen_korean: 그렇게 하지 마십시오
  alternatives_korean:
  - 그렇게 하지 마시오
  - 이렇게 하지 마십시오
  lexicon: 부정 명령
  rationale: 직접 경고의 금지를 현대 합쇼체로 옮겨, 대화체의 긴박함을 유지했습니다.
- source_word: ትወድቁ፡ ውስተ፡ ምድር፡
  english_pob_choice: you and your sons will fall in the land
  chosen_korean: 너와 네 아들들은 그 땅에서 쓰러지고
  alternatives_korean:
  - 너와 네 아들들은 그 땅에 떨어지고
  - 너와 네 아들들은 땅에서 넘어지고
  lexicon: 심판/타락
  rationale: ‘쓰러지다’는 단순 낙하보다 심판적 붕괴와 몰락의 뉘앙스를 함께 살릴 수 있어, 이어지는 저주와 반역의 문맥에 더 적합합니다.
- source_word: ወርጉማን፡ በሀከከ፡
  english_pob_choice: and be accursed through rebellion
  chosen_korean: 반역으로 말미암아 저주를 받을 것이기 때문입니다
  alternatives_korean:
  - 반역으로 저주받을 것이기 때문입니다
  - 반역 때문에 저주를 받을 것이기 때문입니다
  lexicon: 저주/반역
  rationale: 게에즈의 어형은 ‘반역/반역함’이 원인이나 수단처럼 작용하는 구조이므로, ‘말미암아’로 원인성을 드러냈습니다. ‘저주를 받을’은 수동적 판결의 성격을 보존합니다.
- source_word: ወርጉማን፡ በሀከከ፡ ... ትወድቁ፡ ... ወርጉማን፡ በሀከከ፡ ... ትወድቁ
  english_pob_choice: because by rebellion you have settled, and by rebellion your sons will fall
  chosen_korean: 너는 반역으로 거주하였고, 네 아들들도 반역으로 쓰러질 것이며
  alternatives_korean:
  - 반역으로 너는 거주하였고, 반역으로 네 아들들도 쓰러질 것이며
  - 너는 반역 가운데 살았고, 네 아들들도 반역 가운데 쓰러질 것이며
  lexicon: 반역 반복
  rationale: 영어 POB가 두 번의 반복을 살리고 있으므로, 한국어도 ‘반역으로’의 반복을 보존해 원문의 강한 수사와 원인-결과 연결을 유지했습니다.
- source_word: ወትወጽዕከ ለዓለም
  english_pob_choice: and you will be uprooted forever
  chosen_korean: 너는 영원히 뿌리째 뽑힐 것입니다
  alternatives_korean:
  - 너는 영원히 뽑힐 것입니다
  - 너는 영원히 뿌리 뽑힐 것입니다
  lexicon: 심판 비유
  rationale: ‘뿌리째 뽑히다’는 정착과 번성의 반대를 강하게 드러내는 예언적 심판 이미지로, 영구적 추방/제거의 의미를 살립니다.
theological_decisions:
- issue: 형제들의 경고가 갖는 권위와 심판 선언의 톤
  chosen_reading: 문장 전체를 실제 경고 발화로 처리하여, 명령형 금지와 미래형 심판을 함께 살렸습니다.
  alternative_readings:
  - 완곡한 조언문으로 옮김
  - 단순 예언 진술로만 옮김
  rationale: 본문은 협박이 아니라 공동체 내부의 엄중한 경고이므로, 한국어에서도 명령-예언의 이중 톤을 유지하는 것이 원문 기능에 충실합니다.
  doctrine_reference: 서사/권면의 화행 보존
