  source_fidelity: 본문의 주요 내용은 충실히 옮겼습니다. 특히 첫 문장의 가나안 명명, 야벳과 아들들의 이동 및 배정된 땅에서의 거주, 마대가 바다의 땅을 보고 마음에 들어 하지 않은 일, 몫을 청한 일과 그곳에 거주한 결말이 모두 반영되어 있습니다. 다만 게으즈어의 어색하고 논쟁적인 친족관계 구문은 각주로 그 불확실성을 밝혀야 하며, 기존의 [a][b] 표지는 이 절의 현행 주석 체계와 맞지 않습니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. ‘자기 몫의 땅’은 선행하는 복수 주어를 다소 불분명하게 할 수 있으므로 ‘그들에게 돌아간 땅’으로 다듬었습니다. 또한 ‘그의 아내의 형제들인’은 자연스럽지만, 해당 구문의 해석상 난점은 본문에 과도하게 실어 두기보다 주석에서 밝혔습니다.
