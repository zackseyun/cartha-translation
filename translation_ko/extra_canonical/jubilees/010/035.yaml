- from: 그 땅은 가나안이라 불렸습니다. 야벳과 그의 아들들은 바다 쪽으로 가서 자기 몫의 땅에 거주했습니다. 마대는 바다의 땅을 보고 마음에 들지 않아서, 그의 아내의 형제들인 엘람과 앗수르와 아르박삿에게 몫을 요청했고, 그곳에 거주했습니다.[a][b]
