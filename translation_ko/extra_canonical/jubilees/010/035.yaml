base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/035.yaml
  text: That land was named Canaan. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea[35], and it did not please him, and he asked from Elam and Asshur and Arpachshad, the brothers of his wife, a portion, and he dwelt there.
  footnotes:
  - marker: '35'
    text: The clause about Madai and 'his wife's brother' is awkward in Ethiopic. The translation takes Elam, Asshur, and Arpachshad as the parties from whom he requested a portion, with Arpachshad especially linked by marriage.
    reason: segmentation_note
  - marker: a
    text: Or 'And Japheth'.
    reason: previous_rendering
  - marker: b
    text: Or 'the brother of his wife'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 땅은 가나안이라 불렸습니다. 야벳과 그의 아들들은 바다 쪽으로 가서 그들에게 돌아간 땅에 거주했습니다. 마대는 바다의 땅을 보았으나 그것이 마음에 들지 않았습니다.[35] 그래서 그는 아내의 형제들인 엘람과 앗수르와 아르박삿에게서 몫을 청하여 그곳에 거주했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '35'
    text: 마대에 관한 절과 ‘그의 아내의 형제들’이라는 표현은 게으즈어 본문에서 구문이 어색합니다. 여기서는 엘람과 앗수르와 아르박삿을 마대가 몫을 청한 상대로, 그리고 이들을 그의 아내의 형제들로 이해했습니다. 특히 아르박삿과의 혼인 관계를 더 좁게 연결하는 해석도 가능합니다.
    reason: segmentation_note
lexical_decisions:
- source_word: ተሰምየት፡ ይእቲ፡ ምድር፡ ከናአን
  english_pob_choice: That land was named Canaan
  chosen_korean: 그 땅은 가나안이라 불렸습니다
  alternatives_korean:
  - 그 땅의 이름은 가나안이었습니다
  - 그 땅은 가나안으로 불렸습니다
  lexicon: 가나안
  rationale: 게으즈 본문은 지명이 ‘이름 붙여졌다/불렸다’는 서술이므로, 한국어에서도 수동형의 자연스러운 ‘불렸습니다’로 옮겨 명명 행위를 분명히 했습니다.
- source_word: መንገለ፡ ባሕር፡
  english_pob_choice: toward the sea
  chosen_korean: 바다 쪽으로
  alternatives_korean:
  - 바다를 향하여
  - 해변 쪽으로
  lexicon: 바다
  rationale: 방향을 나타내는 표현이므로 직역적이되 현대 한국어에서 자연스러운 ‘쪽으로’를 사용해 이동 방향을 살렸습니다.
- source_word: አኀወ፡ ብእሲቱ
  english_pob_choice: the brother of his wife
  chosen_korean: 그의 아내의 형제들인
  alternatives_korean:
  - 그의 아내의 형제인
  - 그의 아내의 오라비인
  lexicon: 형제
  rationale: 영문 POB의 수정안과 게으즈 복수형 संकेत에 따라 단수를 피하고 복수 관계를 드러내기 위해 ‘형제들’로 옮겼습니다.
- source_word: መክፈልቶሙ
  english_pob_choice: their portion
  chosen_korean: 자기 몫의 땅
  alternatives_korean:
  - 그들의 분깃의 땅
  - 그들의 몫
  lexicon: 몫 / 분깃
  rationale: 분배된 토지를 뜻하는 문맥이므로 ‘몫의 땅’으로 옮겨 소유·배분 의미를 유지했습니다.
theological_decisions:
- issue: 지명 서술의 톤
  chosen_reading: 서술형 ‘가나안이라 불렸습니다’로 처리해 본문의 명명 선언을 그대로 드러냈습니다.
  alternative_readings:
  - ‘가나안이 되었습니다’
  - ‘가나안이라고 하였습니다’
  rationale: 본문은 사건 서술이지 신학적 해석이 아니므로, 과장 없이 단순한 명명 서술로 유지하는 것이 원문 의미에 가장 가깝습니다.
  doctrine_reference: 서사 문맥 보존
- issue: ‘아내의 형제들’의 관계 표시
  chosen_reading: 복수 관계를 드러내는 ‘형제들인’으로 옮겼습니다.
  alternative_readings:
  - ‘아내의 형제인’
  - ‘아내의 형제들인’
  rationale: 게으즈 복수형과 영어 수정본의 취지를 반영해 친족 관계의 범위를 축소하지 않도록 했습니다.
  doctrine_reference: 본문 비평 및 친족 관계 표지
