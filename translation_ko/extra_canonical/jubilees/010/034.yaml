translation:
  language: ko
  text: 레바논, 곧 하맛에서 이집트의 어귀에 이르는 지역은 오늘날까지 그와 그의 자손의 것입니다. 그리고 이 때문에[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 이로 말미암아’. 원문은 다음 절로 이어지는 인과 연결 표현입니다.
    reason: 본문 말미의 ወበእንተዝ፡가 미완결의 인과 연결어임을 밝히고, 한국어에서 문장 경계를 보완한 번역이 앞뒤 문맥에 이어짐을 표시합니다.
