translation:
  language: ko
  text: 레바논, 하맛에서 이집트의 어귀에 이르기까지, 그와 그의 자손이 오늘에 이르기까지 있습니다. 그리고 이 때문에[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊባኖስ
  english_pob_choice: Lebanon
  chosen_korean: 레바논
  alternatives_korean:
  - 레바논 산지
  - 리바논
  lexicon: 고유명사
  rationale: 지명은 현대 외래어 표기법에 따라 레바논으로 옮기되, 본문 맥락상 지역/산지를 가리키는 고유지명으로 유지했습니다.
- source_word: እምአማት፡ እስከ፡ ምብዋአ፡ ግብጽ፡
  english_pob_choice: from Hamath as far as the entrance of Egypt
  chosen_korean: 하맛에서 이집트의 어귀에 이르기까지
  alternatives_korean:
  - 하맛에서 이집트 입구까지
  - 하맛으로부터 이집트의 입구까지
  lexicon: 지리적 범위 표현
  rationale: 기점-종점 구조를 한국어의 ‘~에서 ~에 이르기까지’로 자연스럽게 살리고, ‘entrance’는 단순한 ‘입구’보다 지리적 경계 의미가 드러나도록 ‘어귀’로 옮겼습니다.
- source_word: ውእቱ፡ ወውሉዱ፡
  english_pob_choice: he and his descendants
  chosen_korean: 그와 그의 자손
  alternatives_korean:
  - 그와 그의 후손
  - 그와 그의 자녀들
  lexicon: 대명사/친족어
  rationale: 검토본의 수정대로 대명사는 땅이 아니라 인물(가나안)을 가리키므로 ‘그’로 두고, ‘descendants’는 혈통 계승을 드러내는 ‘자손’으로 번역했습니다.
- source_word: ወበእንተዝ፡
  english_pob_choice: And because of this,
  chosen_korean: 그리고 이 때문에
  alternatives_korean:
  - 그러므로
  - 이 때문에
  lexicon: 접속 표현
  rationale: 원문의 인과 연결을 그대로 보존하되, 문장 끝에서 다음 절로 이어지는 미완결적 연결감을 살리기 위해 ‘그리고 이 때문에’로 옮겼습니다.
theological_decisions:
- issue: 대명사 지시 대상
  chosen_reading: ‘그와 그의 자손’의 대명사는 레바논이 아니라 가나안/그 지역의 인물적 귀속을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - ‘그것과 그 자손’처럼 땅을 인격화하는 번역
  - 지시 대상을 흐리게 하는 중립 번역
  rationale: 검토 기록이 분명히 ውእቱ를 인물 지시로 판정했으므로, 원문의 역사-계보적 진술을 훼손하지 않도록 인칭 지시를 유지했습니다.
  doctrine_reference: 본문 주해의 지시 대상 일치 원칙
- issue: 종결 연결사
  chosen_reading: 절을 완결된 선언으로 닫지 않고 ‘그리고 이 때문에’로 끝냈습니다.
  alternative_readings:
  - 문장부호로 완결 처리
  - 이전 절과 독립된 완결문으로 재구성
  rationale: 게으즈 원문과 POB 영어가 모두 결론으로 넘어가는 연결어를 보존하므로, 독자가 앞뒤 문맥의 인과를 추적할 수 있게 열어 두었습니다.
  doctrine_reference: 문맥 연속성 보존
