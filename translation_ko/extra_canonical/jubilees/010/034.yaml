  lexicon: 지리적 범위 표현
  rationale: 기점-종점 구조를 한국어의 ‘~에서 ~에 이르기까지’로 자연스럽게 살리고, ‘entrance’는 단순한 ‘입구’보다 지리적 경계 의미가 드러나도록 ‘어귀’로 옮겼습니다.
- source_word: ውእቱ፡ ወውሉዱ፡
  english_pob_choice: he and his descendants
  chosen_korean: 그와 그의 자손
  alternatives_korean:
