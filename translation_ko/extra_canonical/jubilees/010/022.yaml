  text: And the Lord our God said to us[22], “Look, they are one people, and this they have begun to do; and now nothing will be withheld from them. Come, let us go down and confuse their tongues, so that one will not hear another’s speech, and they will be scattered into cities and nations, and one purpose will no longer remain with them until the day of judgment.”
  footnotes:
  - marker: '22'
    text: The wording echoes the Babel account but should not be treated as a mere quotation of Genesis; Jubilees embeds it in the angelic first-person revelation framework.
    reason: cross_reference
translation:
  language: ko
  text: 우리 하나님 주님께서 우리에게 이르시되 보라 그들이 한 민족이 되어 이 일을 시작하였으니 이제는 그들에게 숨길 것이 없느니라 자, 내려가서 그들의 혀를 혼잡하게 하여 그들이 다른 사람의 말을 듣지 못하게 하여 그들이 여러 성읍과 나라들로 흩어져서 심판 날까지 다시는 그들의 뜻이 변하지 아니하리로다 하셨느니라
