- from: 우리 하나님 주님께서 우리에게 이르시되 보라 그들이 한 민족이 되어 이 일을 시작하였으니 이제는 그들에게 숨길 것이 없느니라 자, 내려가서 그들의 혀를 혼잡하게 하여 그들이 다른 사람의 말을 듣지 못하게 하여 그들이 여러 성읍과 나라들로 흩어져서 심판 날까지 다시는 그들의 뜻이 변하지 아니하리로다 하셨느니라
  to: 주 우리 하나님께서 우리에게 말씀하셨습니다. “보아라, 그들은 한 민족이며 이 일을 시작하였다. 이제 그들이 하려고 하는 일은 무엇이든 그들에게서 막히지 않을 것이다. 자, 우리가 내려가서 그들의 언어를 혼란스럽게 하여, 서로의 말을 알아듣지 못하게 하자. 그들은 성읍들과 민족들 가운데 흩어지고, 심판의 날까지 한 목적이 더 이상 그들 가운데 남아 있지 못할 것이다.”[22]
  rationale: 원문의 핵심 대조인 ‘아무것도 저지되지 않음’과 ‘한 목적이 더 이상 지속되지 않음’을 정확히 복원했습니다. 또한 영어 POB 감사본의 계시 서술 틀과 각주 앵커를 보존하면서, 현대 표준어 합쇼체에 맞게 직접화법을 다듬었습니다.
