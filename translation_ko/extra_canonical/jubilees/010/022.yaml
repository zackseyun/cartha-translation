  source_fidelity: 초안의 ‘그들에게 숨길 것이 없느니라’는 원문의 ‘그들에게서 막히거나 저지될 것이 없다’는 뜻을 ‘숨기다’로 바꾸어 의미가 달라졌습니다. 또한 원문은 한 목적/계획이 더 이상 그들 가운데 남지 않게 된다는 뜻인데, 초안의 ‘그들의 뜻이 변하지 아니하리로다’는 정반대의 의미입니다.
