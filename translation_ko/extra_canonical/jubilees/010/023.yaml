  source_fidelity: 핵심 사건 순서와 의미는 대체로 맞지만, '인생의 모든 언어'는 원문의 '사람의 아들들/인간들의 모든 혀'를 부정확하고 부자연스럽게 옮긴 표현입니다. 또한 마지막의 흩어짐은 원문상 언어와 민족에 따른 분산을 나타내므로 이를 명료하게 반영하는 것이 좋습니다.
  naturalness: 초안은 '내려가시매 우리도 그와 함께 내려가서 … 보았는데 그리고'처럼 접속과 높임의 연결이 어색하며, '성읍으로 흩어졌으니 … 따르더라'는 현대 합쇼체 문체와 맞지 않습니다. 문장을 자연스러운 현대 한국어 합쇼체로 정리했습니다.
  terminology: '''사람의 아들들''은 한국어에서 어색하므로 문맥상 ''사람의 자손들''로 옮겼습니다. ''혀''는 언어를 뜻하는 관용적 용법이므로 본문에서는 ''언어''로 번역하고, 상호 이해의 상실은 ''서로의 말을 알아듣지 못하게''로 자연스럽게 표현했습니다. 지명은 ''시날'', ''바벨''을 유지했습니다.'
