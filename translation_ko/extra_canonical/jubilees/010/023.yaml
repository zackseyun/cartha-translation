revisions:
- from: 주님께서 내려가시매 우리도 그와 함께 내려가서 사람의 아들들이 건축한 성과 탑을 보았는데 그리고 그분께서 그들의 모든 혀를 혼잡하게 하셔서 그들이 더 이상 서로 말하는 것을 듣지 않게 하시고, 그들이 그 도시와 탑 건설을 그쳤습니다. 그러므로 시날 온 땅을 바벨이라 부르니 이는 주님께서 거기서 인생의 모든 언어를 혼잡하게 하셨음이라 그들이 거기서부터 각 성읍으로 흩어졌으니 각각의 언어와 종족을 따르더라.
  to: 주님께서 내려가셨고, 우리도 그분과 함께 내려가서 사람의 자손들이 건축한 성과 탑을 보았습니다. 그분께서는 그들의 모든 언어를 혼잡하게 하셔서 그들이 더 이상 서로의 말을 알아듣지 못하게 하셨고, 그들은 그 성과 탑의 건축을 그쳤습니다. 그러므로 시날 온 땅이 바벨이라 불리게 되었습니다. 주님께서 այնտեղ 사람의 자손들의 모든 언어를 혼잡하게 하셨기 때문입니다. 그들은 այնտեղ서 각자의 언어와 민족에 따라 여러 지역으로 흩어졌습니다.
  rationale: 원문의 복수 화자('우리도')와 주님의 행위를 보존하면서, 한국어 문장 구조와 현대 합쇼체를 정리했습니다. '혀'의 비유적 의미는 본문에서 자연스러운 '언어'로 옮겼고, 흩어짐의 언어·민족별 기준을 명시했습니다.
