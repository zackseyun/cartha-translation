  text: And he dwelt in the land of Media, near his wife’s brothers, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media, after Madai their father.
translation:
  language: ko
  text: 그는 이 날까지 자기 아내의 형제들 가까운 메디아 땅에 거주했습니다. 그리고 자기 거처와 자기 아들들의 거처를 그들의 조상 마대의 이름을 따라 메디아라 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ምድረ፡ ሜድቂን፡
  english_pob_choice: in the land of Media
  chosen_korean: 메디아 땅에
  alternatives_korean:
  - 메디아의 땅에
  - 메디아 지방에
  lexicon: 지명
  rationale: 지명 Media를 자연스럽게 살리되, 원문의 ‘땅’(land)을 유지해 그가 그 지역에 거주했다는 뜻을 분명히 했습니다.
- source_word: ቅሩበ፡ ኀበ፡ አኀወ፡ ብእሲቱ፡
  english_pob_choice: near his wife’s brothers
  chosen_korean: 자기 아내의 형제들 가까운
  alternatives_korean:
  - 자기 아내의 형제들 곁에
  - 자기 아내의 동생들 가까이에
  lexicon: 친족 관계 표현
  rationale: Geʽez 복수형을 반영하여 ‘형제들’로 옮겼고, 단순한 근접이 아니라 친족 관계를 드러내기 위해 ‘가까운’으로 처리했습니다.
- source_word: ምገባሪሁ ወምገባረ ውሉዱ
  english_pob_choice: his dwelling-place, and the dwelling-place of his sons
  chosen_korean: 자기 거처와 자기 아들들의 거처
  alternatives_korean:
  - 자기 거주지와 자기 아들들의 거주지
  - 자기 집과 자기 아들들의 집
  lexicon: 거처
  rationale: 원문의 반복 구조를 살려 ‘거처’로 일관되게 옮겨, 개인과 후손의 동일한 장소 명명 행위를 보여 주었습니다.
- source_word: ሜዲቂን እስመ ማዳይ አቡሆሙ
  english_pob_choice: Media, after Madai their father
  chosen_korean: 메디아라 불렀습니다 — 그들의 조상 마대를 따라
  alternatives_korean:
  - 메디아라 불렀습니다, 그들의 아버지 마대를 따라
  - 메디아라고 이름 붙였습니다 — 그들의 아버지 마대의 이름을 따라
  lexicon: 명명 관용
  rationale: ‘after X’의 원인·기준 의미를 한국어로 자연스럽게 풀어, 지명을 조상 이름에 따라 붙였다는 뜻을 분명히 했습니다.
theological_decisions:
- issue: “until this day”의 서술 시점 보존
  chosen_reading: ‘이 날까지’를 유지해 전승 서술의 현재 연결감을 살렸습니다.
  alternative_readings:
  - ‘오늘까지’
  - ‘지금까지’
  rationale: 이 표현은 화자의 현재 시점까지 이어지는 전승적 진술이므로, 평이하지만 시간 감각이 살아 있는 표현을 택했습니다.
  doctrine_reference: 서술 시점 보존
