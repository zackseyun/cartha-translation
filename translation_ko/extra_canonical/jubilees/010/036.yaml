  source_fidelity: 지명 메디아, 아내의 형제들이 복수라는 점, 거처와 아들들의 거처라는 반복, 그리고 마대에 따른 명명은 대체로 반영되었습니다. 그러나 ‘자기 아내의 형제들 가까운 메디아 땅’은 수식 관계가 불명확하고 비문에 가까워, ‘아내의 형제들 가까이에 있는 메디아 땅’으로 바로잡아야 합니다. 또한 원문의 ‘그들의 아버지 마대’를 ‘그들의 조상 마대’로 옮긴 것은 ‘father’를 넓혀 번역한 것이므로 원어의 친족 관계를 유지하는 편이 적절합니다.
  naturalness: 현 문장은 첫 문장의 관형절 연결이 자연스럽지 않습니다. ‘오늘날까지’와 ‘살았습니다’는 현대 표준 한국어의 합쇼체 서술에 자연스럽고, 문맥상 거주 행위를 명료하게 전달합니다.
  terminology: ‘메디아’, ‘마대’, ‘거처’는 적절합니다. ‘그들의 아버지 마대의 이름을 따라’는 원문의 명명 기준과 아버지라는 친족 관계를 모두 보존합니다.
