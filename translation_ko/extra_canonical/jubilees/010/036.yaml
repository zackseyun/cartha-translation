  to: 그는 오늘날까지 자기 아내의 형제들 가까이에 있는 메디아 땅에서 살았습니다. 그리고 자기 거처와 자기 아들들의 거처를 그들의 아버지 마대의 이름을 따라 메디아라고 불렀습니다.
