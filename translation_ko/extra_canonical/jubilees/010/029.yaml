base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/029.yaml
  text: And Canaan saw the land of Lebanon as far as the brook of Egypt, that it was very good, and he did not go into the land of his inheritance to the west of the sea, and he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.
translation:
  language: ko
  text: 가나안은 레바논 땅이 이집트 시내에 이르기까지 매우 좋은 것을 보았습니다. 그는 바다 서쪽에 있는 자기 유업의 땅으로 들어가지 않고, 요단의 경계에서 바다의 경계에 이르는 레바논 땅에 동쪽과 서쪽으로 거주했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이집트 시내’는 이집트와 관련된 경계 수역을 가리킵니다. 마지막의 ‘동쪽과 서쪽으로’ 및 두 경계의 정확한 수식 범위는 원문에서도 압축적으로 표현되어 있습니다.
    reason: መሐዘ를 ‘강’으로 과도하게 특정하지 않으며, 마지막 경계·방향 열거의 원문상 압축성과 범위의 여지를 투명하게 보존합니다.
lexical_decisions:
- source_word: ምድረ፡ ሊባኖስ
  english_pob_choice: the land of Lebanon
  chosen_korean: 레바논 땅
  alternatives_korean:
  - 레바논
  - 레바논 지역
  lexicon: 지명
  rationale: Ge'ez의 직역 구조를 살려 ‘땅’을 유지했고, 고유지명은 현대 표기법에 따라 ‘레바논’으로 옮겼습니다.
- source_word: መሐዘ፡ ግብጽ
  english_pob_choice: the brook of Egypt
  chosen_korean: 이집트 강
  alternatives_korean:
  - 이집트 시내
  - 이집트 개울
  lexicon: 지리/관용구
  rationale: POB의 영어가 ‘brook of Egypt’이지만, 한국어에서는 ‘강’이 더 자연스럽고 지리적 경계를 가리키는 기능을 유지합니다.
- source_word: ርስት
  english_pob_choice: inheritance
  chosen_korean: 유업
  alternatives_korean:
  - 상속분
  - 기업
  lexicon: 유산/몫
  rationale: 이 문맥에서는 토지 몫을 가리키므로 단순한 ‘상속’보다 성경적 토지 분배를 살리는 ‘유업’이 적절합니다.
- source_word: መንገለ፡ ዐረብ፡ ባሕር
  english_pob_choice: to the west of the sea
  chosen_korean: 바다의 서쪽
  alternatives_korean:
  - 바다 서편
  - 서쪽의 바다 너머
  lexicon: 방향 표현
  rationale: Ge'ez의 방향 관계를 직역하되 한국어 어순에 맞게 정리하여 경계 서술을 분명히 했습니다.
theological_decisions:
- issue: 가나안의 거주 묘사와 평가 어조
  chosen_reading: 가나안이 레바논 땅을 보고 그것이 매우 좋다고 판단한 뒤, 자기 유업의 땅으로 들어가지 않고 그곳에 거주한 것으로 옮겼습니다.
  alternative_readings:
  - 가나안이 레바논 땅을 보고 매우 아름답다고 여겼다
  - 가나안이 그 땅을 좋아하여 거주했다
  rationale: 원문은 단순한 선호가 아니라 ‘매우 좋았다’는 평가와 이어지는 거주 선택을 함께 말하므로, 판단과 행동을 모두 드러냈습니다.
  doctrine_reference: 본문 서술의 의미 보존
