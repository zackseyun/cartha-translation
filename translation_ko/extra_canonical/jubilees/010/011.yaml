  source_fidelity: 후반부의 ‘그들 가운데 십분의 일을’은 제공된 게에즈어 본문이 동사 없이 끝나는 미완결 상태를 보존합니다. 문두의 두 평행절은 난해하나, ‘바르게 행하다 / 의를 힘써 추구하다’는 영어 감사 기록의 문맥적 독법을 자연스러운 한국어로 옮긴 것입니다.
  naturalness: 초안의 ‘올바름 가운데 걷지 않고 의 가운데 힘쓰지’는 직역투가 강합니다. ‘올바르게 행하지 않고 의를 힘써 추구하지’로 고치면 현대 표준어 합쇼체에서 자연스럽고 평행도 유지됩니다. 또한 끝에 붙은 정의되지 않은 [a] 표지는 문두 난해 구절에 붙여 주석과 일치시켰습니다.
  terminology: ‘의’, ‘심판의 장소’, ‘악한 자들’은 원문의 표현 범위와 서사적 격식에 맞습니다. ‘잔혹한 악한 자들을 모두’는 ‘잔혹한 모든 악한 자들’보다 수식 관계가 분명합니다.
