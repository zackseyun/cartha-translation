base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/011.yaml
  text: 'He knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and a tenth of them'
  footnotes:
  - marker: '11'
    text: The Ethiopic at the start of v. 11 is difficult. The sense appears to be that Noah needed instruction because the spirits were not acting with strength/uprightness/righteousness. The translation renders the broader contextual sense rather than forcing each difficult clause woodenly.
    reason: segmentation_note
  - marker: a
    text: Or 'And one of us said that we should teach Noah all their medicines[11], because he knew'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들이 올바르게 행하지 않고 의를 힘써 추구하지 않는다는 것을 알고 있었습니다[a]. 그리고 우리는 그의 모든 말씀대로 행했습니다. 곧 잔혹한 악한 자들을 모두 심판의 장소에 묶었고, 그들 가운데 십분의 일을—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게에즈어 첫 구절은 문법과 어휘가 난해합니다. 여기서는 그들이 바르게 행하지 않았고 의를 추구하지 않았다는 문맥적 의미로 옮겼으며, 각 어구를 기계적으로 확정하지 않았습니다.
    reason: segmentation_note
lexical_decisions:
- source_word: ያአምር
  english_pob_choice: He knew
  chosen_korean: 그는 ... 알고 있었습니다
  alternatives_korean:
  - 그는 ... 알았습니다
  - 그는 ... 알아차렸습니다
  lexicon: source_note
  rationale: 문두의 동사는 단순한 인지로 읽는 것이 자연스럽고, 앞선 10절 내용과 이어지는 맥락상 ‘가르침을 받아 알다’보다 ‘알고 있었습니다’가 더 직접적으로 원문의 진술을 살립니다.
- source_word: ከመ፡ አኮ፡ በርቱዕ፡ ዘየሐውሩ / ወአኮ፡ በጽድቅ፡ ዘይትባአሱ
  english_pob_choice: they were not walking in uprightness and were not striving in righteousness
  chosen_korean: 그들이 올바름 가운데 걷지 않고 의 가운데 힘쓰지 않는다는 것
  alternatives_korean:
  - 그들이 바르게 행하지 않고 의를 추구하지 않는다는 것
  - 그들이 정직하게 걷지 않고 의를 위해 애쓰지 않는다는 것
  lexicon: source_note
  rationale: ‘걷다’는 히브리·게에즈식 행위 관용을 살리며, ‘올바름’과 ‘의’는 각각 행동의 방향성과 기준을 구분해 원문의 평행 구조를 보존합니다.
- source_word: ቃሉ
  english_pob_choice: his word
  chosen_korean: 그의 모든 말씀대로
  alternatives_korean:
  - 그의 말씀대로
  - 그가 말씀한 모든 대로
  lexicon: source_note
  rationale: 직역적 ‘말씀대로’에 ‘모든’을 보태어 영어 POB의 all his word를 반영하고, 뒤의 실행 진술과의 연결을 분명히 했습니다.
- source_word: መካነ፡ ደይን
  english_pob_choice: the place of judgment
  chosen_korean: 심판의 장소
  alternatives_korean:
  - 판결의 자리
  - 재판의 장소
  - 심판의 자리
  lexicon: source_note
  rationale: 장소성을 분명히 하면서도, 단순한 법정 이상으로 판정이 집행되는 곳이라는 의미를 살리기 위해 ‘심판의 장소’를 택했습니다.
theological_decisions:
- issue: 끝절의 불완전한 종결
  chosen_reading: ‘그들 가운데 십분의 일을’로 끝을 열어 둔 채 번역했습니다.
  alternative_readings:
  - 문맥을 보정하여 ‘그들 가운데 십분의 일을 남겼다’로 완결
  - 원문 미완성을 드러내기 위해 생략표시를 더 크게 처리
  rationale: 제공된 게에즈 본문과 최신 수정은 ወዓሥራተሙ를 ‘a tenth of them’으로 보존하도록 지시하지만, 절 자체가 다음 내용으로 이어지는 미완성 문장처럼 남아 있어 과도한 보정을 피했습니다.
  doctrine_reference: text-critical restraint / source fidelity
