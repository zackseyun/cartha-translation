translation:
  language: ko
  text: 주님께서 큰 바람을 탑에 보내셨고, 그것이 그것을 땅에 넘어뜨렸습니다 — 보십시오,[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님께서
  alternatives_korean:
  - 주께서
  - 하나님께서
  lexicon: YHWH/κύριος 계열
  rationale: 게에즈 원문은 신적 주어를 가리키므로 한국어에서는 직접적이고 경건한 호칭인 ‘주님’을 사용했습니다. 이 절의 주어는 행위 주체로서 자연스럽게 주격 조사와 함께 처리했습니다.
- source_word: ነፋሰ፡ ዐቢየ
  english_pob_choice: a mighty wind
  chosen_korean: 큰 바람
  alternatives_korean:
  - 강한 바람
  - 거센 바람
  - 힘센 바람
  lexicon: 바람/강함 표현
  rationale: 원문의 ‘큰/강대한’ 바람을 직역하되, 현대 한국어에서 자연스럽고 장엄한 표현인 ‘큰 바람’으로 옮겼습니다.
- source_word: ማኅፈድ / ወገፍታአ
  english_pob_choice: against the tower, and overthrew it
  chosen_korean: 탑에 보내셨고, 그것이 그것을 땅에 넘어뜨렸습니다
  alternatives_korean:
  - 탑을 향해 보내셨고, 그것이 그것을 땅에 엎어뜨렸습니다
  - 탑을 무너뜨렸습니다
  lexicon: 서술 동사 / 목적어 처리
  rationale: 공개된 교정 이력에 따라 핵심 이미지는 ‘탑’이며, 바람이 그것을 ‘넘어뜨렸다’는 파괴 동작을 살렸습니다. ‘무너뜨리다’는 의미는 전달되지만 원문의 직접적인 넘어짐 이미지는 약해져서 ‘넘어뜨리다’를 택했습니다.
theological_decisions:
- issue: 주어 호칭을 ‘야훼’가 아닌 ‘주님’으로 둘지 여부
  chosen_reading: 본문의 서사적 호칭을 따라 ‘주님’으로 두었습니다.
  alternative_readings:
  - 야훼께서
  - 하나님께서
  rationale: 이 절은 주님의 행위 서술이며, 게에즈 원문과 영어 POB 모두 일반적인 서사 호칭을 사용합니다. 따라서 본문 가독성과 일관성을 위해 ‘주님’을 유지했습니다.
  doctrine_reference: 서사 본문에서의 신명 호칭 관행
