translation:
  language: ko
  text: 그는 거룩한 통치자 앞과 우리 조상 노아 앞에서 말했으나 그들의 말을 듣지 않았고, 그 땅에 거주하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅዱስ
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성스러운
  - 거룩하신
  lexicon: adjective
  rationale: 인물의 지위를 나타내는 형용사로서 ‘거룩한’이 가장 직접적이며, 본문은 예배체 호칭이 아니라 서술적 수식입니다.
- source_word: መኰንን
  english_pob_choice: prince
  chosen_korean: 통치자
  alternatives_korean:
  - 왕자
  - 군주
  - 제후
  lexicon: noun
  rationale: 지정된 맥락에서 단순한 혈통 호칭보다 권위를 지닌 통치적 지위를 드러내는 번역이 더 안정적이어서 ‘통치자’로 옮겼습니다.
- source_word: አቡነ
  english_pob_choice: our father
  chosen_korean: 우리 조상 노아
  alternatives_korean:
  - 우리 아버지 노아
  - 우리 선조 노아
  lexicon: noun phrase
  rationale: 직역형 ‘우리 아버지’도 가능하지만, 여기서는 집단의 혈연적-계보적 조상을 가리키므로 한국어에서 자연스러운 ‘우리 조상 노아’로 풀었습니다.
- source_word: ወኢሰምዖሙ
  english_pob_choice: But he did not listen to them
  chosen_korean: 그는 그들의 말을 듣지 않았고
  alternatives_korean:
  - 그러나 그는 그들의 말을 듣지 않았고
  - 그는 그들에게 귀를 기울이지 않았고
  lexicon: verb phrase
  rationale: ‘듣지 않았다’는 명백한 거부의 의미를 살리되, 한국어에서 문맥상 자연스럽게 ‘그들의 말을 듣지 않았다’로 표현했습니다.
- source_word: ወኀደረ፡ ምድረ፡
  english_pob_choice: and he dwelt in the land
  chosen_korean: 그 땅에 거주하였습니다
  alternatives_korean:
  - 그 땅에 살았습니다
  - 그 땅에 머물렀습니다
  lexicon: verb phrase
  rationale: 정착·거주를 뜻하는 서술을 살리기 위해 ‘거주하다’를 사용했고, 문체는 본문 전체의 합쇼체에 맞췄습니다.
theological_decisions:
- issue: ‘거룩한 prince’의 호칭 번역
  chosen_reading: 본문의 신성한 위격 여부를 과도하게 단정하지 않고, 소스가 요구하는 최소한의 의미인 ‘거룩한 통치자’로 옮겼습니다.
  alternative_readings:
  - ‘거룩한 왕자’
  - ‘거룩한 군주’
  - 그대로 음역한 ‘마웁난’류 처리
  rationale: 주어진 게에즈 본문과 영어 POB는 설명을 확장하지 않으며, 인물 호칭의 성격이 문맥상 다의적이므로 독자에게 과도한 신학적 결론을 주지 않는 번역이 적절합니다.
  doctrine_reference: 문맥상 칭호 해석의 절제 원칙
