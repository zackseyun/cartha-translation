revisions:
- from: 열아홉 희년과 이 주간과 다섯 해였습니다. 그가 땅에서 사는 동안 그는 사람의 자손보다 뛰어났는데, 에녹만은 예외였습니다. 이는 그가 완전한 의 안에 있었기 때문입니다. 에녹은 세상 세대들을 위한 증언으로 세워졌으니, 세대에서 세대로 전해지는 모든 행위를 심판의 날까지 이야기하게 하려는 것이었습니다.[a]
  to: 열아홉 희년과 두 주간과 다섯 해였습니다. 그가 땅에서 사는 동안, 그는 사람의 자손보다 뛰어났습니다[17]. 에녹만은 예외였습니다. 이는 그가 의에 있어서 완전했기 때문입니다. 에녹은 세상의 세대들을 위한 증언[a]으로 세워졌습니다. 이는 그가 심판의 날까지 각 세대의 모든 행위를 전하게 하려는 것이었습니다.
  rationale: The revision removes the added idea of intergenerational transmission, clarifies that Enoch is appointed to recount the deeds of each generation, improves Korean idiom, and restores both documented footnote anchors at their relevant locations. It preserves the source's interpretive density rather than specifying an otherwise disputed basis for Noah's surpassing others.
