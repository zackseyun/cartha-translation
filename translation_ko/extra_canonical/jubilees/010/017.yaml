base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/010/017.yaml
  text: nineteen jubilees and two weeks of years and five years. And during his life on the earth he surpassed the sons of men[17], except Enoch, because of the righteousness in which he was perfect. For Enoch was appointed as a testimony for the generations of the world, to recount all the deeds of generation after generation until the day of judgment.
  footnotes:
  - marker: '17'
    text: The phrase about Enoch is textually dense. The translation understands it to mean that Noah surpassed all other humans in lifespan except Enoch, while Enoch's distinctive role was as a witness for future generations until the day of judgment.
    reason: alternative_reading
  - marker: a
    text: Or 'sign'.
    reason: previous_rendering
translation:
  language: ko
  text: 열아홉 희년과 두 주간과 다섯 해였습니다. 그가 땅에서 사는 동안, 그는 사람의 자손보다 뛰어났습니다[17]. 에녹만은 예외였습니다. 이는 그가 의에 있어서 완전했기 때문입니다. 에녹은 세상의 세대들을 위한 증언[a]으로 세워졌습니다. 이는 그가 심판의 날까지 각 세대의 모든 행위를 전하게 하려는 것이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '17'
    text: 에녹에 관한 이 구절은 문맥과 문법이 빽빽하여 해석에 어려움이 있습니다. 이 번역은 노아가 완전한 의 때문에, 에녹을 제외한 다른 모든 사람보다 뛰어났다고 이해합니다. 일부 해석은 특히 그가 수명에서 뛰어났다는 뜻으로 봅니다.
    reason: alternative_reading
  - marker: a
    text: 또는 ‘표징’.
    reason: previous_rendering
lexical_decisions:
- source_word: ፲ወ፱ *እዮቤልው፡ ወክልኤ፡ ሱባዔ፡ ወ፭ዓመተ
  english_pob_choice: nineteen jubilees and two weeks of years and five years
  chosen_korean: 열아홉 희년과 이 주간과 다섯 해
  alternatives_korean:
  - 열아홉 희년과 두 주간의 해와 다섯 해
  - 열아홉 희년과 이 주간과 오 년
  lexicon: 희년
  rationale: 희년은 Jubilees의 기본 단위인 jubilee를 직접 옮긴 것으로, '주간'은 Ge'ez의 수주(week of years) 표현을 살려 달력적 구조를 유지합니다.
- source_word: ሐዩዎ፡ *ዲበ፡ ምድር፡ እምውሉደ፡ ሰብእ፡
  english_pob_choice: during his life on the earth he surpassed the sons of men
  chosen_korean: 그가 땅에서 사는 동안 그는 사람의 자손보다 뛰어났는데
  alternatives_korean:
  - 그가 땅 위에서 사는 동안 그는 사람의 자손을 능가했는데
  - 그의 생애 동안 그는 사람의 자손보다 뛰어났는데
  lexicon: 사람의 자손
  rationale: Ge'ez의 'son(s) of men'는 직역 시 인류 일반을 가리키는 표현이므로, 한국어에서도 관용적으로 이해 가능한 '사람의 자손'을 유지했습니다.
- source_word: በእንተ፡ ጽድቅ፡ ዘባቲ፡ *ፍጹመ፡ ኮነ፡ ዘእንበለ፡ ሄኖክ።
  english_pob_choice: except Enoch, because of the righteousness in which he was perfect
  chosen_korean: 에녹만은 예외였습니다. 이는 그가 완전한 의 안에 있었기 때문입니다.
  alternatives_korean:
  - 에녹 외에는 모두 예외였습니다. 이는 그가 완전한 의 안에 있었기 때문입니다.
  - 에녹만 제외하였습니다. 이는 그가 완전한 의로 완전해졌기 때문입니다.
  lexicon: 의
  rationale: ጽድቅ을 '의'로 옮겨 윤리적 선함보다 하나님 앞의 올바름이라는 더 넓은 성경적 의미를 보존했습니다.
- source_word: ተፈጥሮተ፡ ለስምዕ፡
  english_pob_choice: appointed as a testimony
  chosen_korean: 증언으로 세워졌으니
  alternatives_korean:
  - 증거로 세워졌으니
  - 증언하도록 정해졌으니
  lexicon: 증언
  rationale: Ge'ez ስምዕ은 'testimony/witness' 계열이므로, POB의 문맥을 따르되 '증언'으로 옮겨 에녹의 증인적 기능을 드러냈습니다.
- source_word: ለትዝምደ፡ ዓለም፡ ... ኵሎ፡ ግብረ፡ ለትውልደ፡
  english_pob_choice: for the generations of the world, to recount all the deeds of generation after generation until the day of judgment
  chosen_korean: 세상 세대들을 위한 증언으로 ... 세대에서 세대로 전해지는 모든 행위를 심판의 날까지 이야기하게 하려는 것이었습니다.
  alternatives_korean:
  - 세상의 세대들을 위해 ... 모든 세대의 행위를 말하게 하려는 것이었습니다.
  - 세상 세대들을 위해 ... 모든 행위를 세대마다 전하게 하려는 것이었습니다.
  lexicon: 세대
  rationale: 반복되는 'generations'를 '세대'로 일관되게 옮겨, 에녹의 사명이 시간적 연속성 속에서 전승되는 점을 살렸습니다.
theological_decisions:
- issue: 에녹의 역할을 '증언'으로 둘지 '표징/표시'로 둘지
  chosen_reading: 에녹은 세상 세대들을 위한 증언으로 세워졌습니다.
  alternative_readings:
  - 에녹은 세상 세대들을 위한 표징으로 세워졌습니다.
  - 에녹은 세상 세대들을 위한 증거로 세워졌습니다.
  rationale: Ge'ez ስምዕ은 본문 주석과 최신 검토가 지시하듯 '증인/증언' 계열이므로, 텍스트의 직접 의미를 살려 에녹의 미래 세대를 향한 증인적 기능을 강조했습니다.
  doctrine_reference: 성경 인물의 예언적/증언적 소명
