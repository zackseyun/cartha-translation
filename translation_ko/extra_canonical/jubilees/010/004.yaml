translation:
  language: ko
  text: 나에 대한 아버지의 은혜가 크시고 내 생명에 대한 아버지의 자비가 크시기 때문입니다. 아버지의 은혜가 내 아들들에게 더해지게 하시고 악한 영들이 그들을 다스리지 못하게 하여 그들을 땅에서 멸망시키지 않게 하소서.
  philosophy: optimal-equivalence
