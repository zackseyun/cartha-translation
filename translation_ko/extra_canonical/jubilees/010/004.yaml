review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘아버지’는 제시된 영어 POB 및 이 구절의 기도 문맥에서 근거 없이 호칭을 한정합니다. 원문의 2인칭 소유 표현과 ‘은혜가 크다/크게 되다’의 반복은 ‘주님’과 ‘크게 나타나다’로 보존하는 것이 안전합니다.
  naturalness: ‘나에 대한’과 ‘내 생명에 대한’은 현대 한국어 기도문으로 다소 직역투입니다. ‘나에게 베푸신’으로 옮기고, 마지막 목적절은 주어가 악한 영들임을 분명히 하여 자연스럽게 다듬었습니다.
  terminology: grace는 ‘은혜’, mercy는 ‘자비’, wicked spirits는 ‘악한 영들’로 일관되게 옮겼습니다. ‘주님’은 본문에 없는 ‘아버지’라는 특정 호칭을 피하면서 기도의 수신자를 자연스럽게 표시합니다.
  issues:
  - severity: high
    issue: ‘your’를 ‘아버지의’로 번역함
    rationale: 영어 POB의 ‘your’와 해당 기도 문맥은 신적 수신자를 가리키지만, 이 절 자체에는 ‘아버지’라는 호칭이 없습니다. 원문에 없는 관계 호칭을 삽입하면 의미를 불필요하게 한정합니다.
  - severity: medium
    issue: ‘let your grace be magnified over my sons’의 의미 연결이 충분히 드러나지 않음
    rationale: ‘내 아들들에게 더해지게’도 가능하나, 앞선 ‘은혜가 크다’와 이어지는 ‘크게 되다/확대되다’의 어휘적 반복을 살려 ‘더욱 크게 나타나게’로 옮기는 편이 충실합니다.
  revised_text: 나에게 베푸신 주님의 은혜가 크고 내 생명에 베푸신 주님의 자비가 큽니다. 주님의 은혜가 내 아들들에게 더욱 크게 나타나게 하시고a, 악한 영들이 그들을 다스리지 못하게 하셔서 그들을 땅에서 멸망시키지 못하게 하소서.
  revised_footnotes:
  - marker: a
    text: 또는 ‘주님의 은혜가 내 아들들 위에 더욱 높아지게 하시고’.
    reason: ‘은혜가 크게 되다/확대되다’라는 표현은 ‘높아지다’로도 옮길 수 있으나, 본문은 앞절의 ‘은혜가 크다’와의 어휘적 연결을 살려 ‘더욱 크게 나타나다’로 번역했습니다.
  revision_rationale: 근거 없는 ‘아버지’ 호칭을 제거하고, 은혜가 ‘크다’는 표현의 반복을 반영했습니다. 또한 악한 영들이 다스리는 결과로 사람들을 멸망시킨다는 목적 관계를 한국어 문장 안에서 명확히 했습니다.
