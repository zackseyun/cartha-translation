  text: And he gave all that he had written to Shem, his son, whom he loved more than all his sons.
translation:
  language: ko
  text: 그는 자신이 기록한 모든 것을 자신의 모든 아들보다 더 사랑한 아들 셈에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩያን፡ እምድኅሬሆሙ፡ ለውሉደ፡ ኖኅ።
  english_pob_choice: his son ... all his sons
  chosen_korean: “자기 아들들 가운데서도”
  alternatives_korean:
  - “모든 아들들보다”
  - “다른 모든 아들들보다”
  lexicon: proper noun / comparison phrase
  rationale: 원문과 POB 영어의 비교 구조를 살려, 단순한 우위가 아니라 여러 아들 가운데 셈을 더 사랑했다는 대비를 자연스럽게 옮겼습니다.
- source_word: ወወሀበ፡ ኵሎ፡ ዘጸሐፈ፡
  english_pob_choice: he gave all that he had written
  chosen_korean: “자기 손으로 기록한 모든 것을 주었습니다”
  alternatives_korean:
  - “기록한 모든 것을 주었습니다”
  - “자기가 쓴 모든 것을 넘겨주었습니다”
  lexicon: verb of giving / writing
  rationale: Geez의 ‘기록하다/쓰다’ 의미를 살리되, 한국어에서는 ‘자기 손으로 기록한’이 내용의 범위를 분명하게 하면서도 본문을 과도하게 풀지 않습니다.
- source_word: ለሴም፡ ወልዱ፡
  english_pob_choice: to Shem, his son
  chosen_korean: “아들 셈에게”
  alternatives_korean:
  - “그의 아들 셈에게”
  - “아들인 셈에게”
  lexicon: proper noun
  rationale: 인물 관계가 본문에서 이미 분명하므로, 한국어에서는 가장 자연스러운 호칭 구조로 옮겼습니다.
- source_word: ዘይፈህቅ፡
  english_pob_choice: whom he loved more than all his sons
  chosen_korean: “자기 아들들 가운데서도 특히 더 사랑한”
  alternatives_korean:
  - “모든 아들들보다 더 사랑한”
  - “아들들 모두보다 더 사랑한”
  lexicon: comparative love verb
  rationale: 원문의 비교급을 ‘특히 더’로 풀어, 단순한 감정의 크기보다 아들들 사이의 우선적 선호를 드러냈습니다.
theological_decisions:
- issue: 아들 셈에 대한 특별한 사랑의 강조
  chosen_reading: 본문의 핵심은 재산의 이전보다, 셈을 다른 아들들보다 더 사랑했다는 서술입니다.
  alternative_readings:
  - 유산을 사랑의 표시로 해석하는 읽기
  - 단순한 가족적 선호로 약화하는 읽기
  rationale: POB 영어의 최종 수정이 인과문을 상대절로 바꾼 점에 맞추어, 원문의 비교적 사랑을 그대로 보존했습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: ‘기록한 모든 것’의 범위
  chosen_reading: 여기서는 문자 그대로의 문서/기록 전체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘재산’으로 의미를 확대하는 읽기
  - ‘유언’으로 특정하는 읽기
  rationale: Geez 원문과 영어가 모두 ‘written’에 해당하는 표지를 갖기 때문에, 특정 법적 문서로 단정하지 않고 기록된 것의 전체를 유지했습니다.
  doctrine_reference: 본문 우선 원칙
