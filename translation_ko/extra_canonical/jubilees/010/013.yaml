  to: 우리는 노아에게 그들의 모든 약을 알려 주어, 그들이 땅의 식물로 치유될 수 있게 하였습니다. 노아는 우리가 그에게 가르쳐 준 모든 것, 곧 온갖 치유 방법을 책에 기록하였고, 영들은 억제되었습니다.
