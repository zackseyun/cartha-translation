  text: And we told Noah all their medicines, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies, and the spirits were restrained.
translation:
  language: ko
  text: 우리는 노아에게 그들의 약들을 모두 알려 주어, 땅의 식물들로 병이 나을 수 있게 하였습니다. 노아는 우리가 그에게 가르쳐 준 모든 것, 곧 모든 종류의 치유하는 치료법을 책에 적었고, 영들은 제어되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስለ፡ አስሕተትሙ፡ ከመ፡ ይፈውሱ፡ በዕፀወ፡ ምድር።
  english_pob_choice: so that they might be healed by the plants of the earth
  chosen_korean: 땅의 식물들로 병이 나을 수 있게
  alternatives_korean:
  - 땅의 풀들로 치료받게
  - 땅의 식물들을 통해 치유되게
  lexicon: healed / plants of the earth
  rationale: 원문의 ‘땅의 식물들’을 보존하되, 한국어에서는 수동·결과 표현을 자연스럽게 옮겨 ‘병이 나을 수 있게’로 처리했습니다. ‘치료받게’보다 문맥상 더 넓은 치유 결과를 드러냅니다.
- source_word: ወጸሐፈ፡ ኖኅ፡ ኵሎ፡ ዘከመ፡ መሀርናሁ፡ በመጽሐፍ፡
  english_pob_choice: And Noah wrote down everything that we had taught him in a book
  chosen_korean: 노아는 우리가 그에게 가르쳐 준 모든 것…을 책에 적었고
  alternatives_korean:
  - 노아는 우리가 그에게 가르친 모든 것을 책에 기록했고
  - 노아는 우리가 그에게 가르쳐 준 모든 것을 책으로 남겼고
  lexicon: wrote down / in a book
  rationale: ‘መጽሐፍ’의 기본 뜻을 살려 ‘책에 적었다’로 직역성을 유지했습니다. ‘기록했다’도 가능하지만, 다음 절의 목록성·전승성 때문에 ‘적었다’가 더 직접적입니다.
- source_word: በኵሉ፡ ትዝምደ፡ ፈውሳት፡
  english_pob_choice: all the kinds of healing remedies
  chosen_korean: 모든 종류의 치유하는 치료법
  alternatives_korean:
  - 모든 종류의 치유 수단
  - 온갖 치유 처방
  lexicon: healing remedies
  rationale: ‘치유하는 치료법’은 원문의 복수·분류 감각을 살리면서도, 현대 한국어에서 과도하게 의학적이거나 민속적인 뉘앙스로 좁아지지 않게 했습니다.
- source_word: ተዐጸዉ፡ መናፍስት፡
  english_pob_choice: and the spirits were restrained
  chosen_korean: 영들은 제어되었습니다
  alternatives_korean:
  - 영들은 억제되었습니다
  - 영들은 굴복되었습니다
  lexicon: spirits were restrained
  rationale: 원문은 ‘악한’이나 ‘노아의 아들들을 따르지 못하게’ 같은 추가 설명이 없으므로, 단순히 ‘영들’과 그 제어 상태만 반영했습니다. ‘제어되다’는 능동적 구속의 결과를 가장 중립적으로 전합니다.
theological_decisions:
- issue: 약과 치유의 출처를 어떻게 표현할지
  chosen_reading: 노아에게 알려 준 ‘그들의 약들’과 ‘땅의 식물들로’ 치유가 이루어지게 했다는 구조를 그대로 살렸습니다.
  alternative_readings:
  - 약들을 ‘처방’으로 완화해 옮기기
  - ‘식물들로’ 대신 일반적 ‘자연물로’로 넓히기
  rationale: 본절은 지식의 전달과 창조세계의 치유적 사용을 함께 말하므로, 의학적·자연물적 요소를 약화시키지 않는 쪽이 원문 의도에 가깝습니다.
  doctrine_reference: 창조 세계의 선용과 치유에 대한 본문 자체의 서술
- issue: ‘영들’의 성격을 특정하지 않을지
  chosen_reading: 특정 수식 없이 ‘영들’만 남겼습니다.
  alternative_readings:
  - ‘악한 영들’로 보충하기
  - ‘귀신들’로 해석하기
  rationale: 제공된 게즈 본문과 영어 POB 개정본에는 ‘악한’도 ‘귀신’도 없으므로, 해석적 확대를 피하고 본문이 말하는 제어의 사실만 전달했습니다.
  doctrine_reference: 본문 비약 금지 원칙
