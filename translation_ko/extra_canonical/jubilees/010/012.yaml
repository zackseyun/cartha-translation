translation:
  language: ko
  text: 우리는 그들이 땅에서 사탄에게 복종하도록 그들을 남겨 두었습니다. 그리고 그들의 모든 질병의 치료법은…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አተርፍነ
  english_pob_choice: We left them
  chosen_korean: 우리는 그들을 남겨 두었습니다
  alternatives_korean:
  - 우리는 그들을 남겨 두었습니다
  - 우리는 그들을 남겼습니다
  lexicon: leave / remain
  rationale: Ge'ez의 동사 አተርፍነ는 여기서 ‘남겨 두다/남기다’의 뜻이므로, POB의 수정된 영어처럼 ‘a tenth of them’은 넣지 않고 단순히 대상이 남겨졌다는 의미를 살렸습니다.
- source_word: ከመ፡ ይትኰነኑ፡ ... ዲበ፡ ምድር
  english_pob_choice: so that they might be subject ... on the earth
  chosen_korean: 그들이 땅에서 … 복종하도록
  alternatives_korean:
  - 그들이 땅에서 … 종속되도록
  - 그들이 땅에서 … 굴복하도록
  lexicon: be subject / subject to
  rationale: ‘subject’는 단순한 복종이 아니라 지배 아래 놓이는 상태를 가리키므로, 문맥에 맞게 ‘복종하다’로 옮겼습니다.
- source_word: ሰይጣን
  english_pob_choice: Satan
  chosen_korean: 사탄
  alternatives_korean:
  - 사탄
  - 마귀
  lexicon: Satan
  rationale: 고유명사이므로 일반적으로 통용되는 음역 ‘사탄’을 유지했습니다.
- source_word: ወፈውሰ፡ ደዌሆሙ፡ ኵሎ፡
  english_pob_choice: And the remedy for all their diseases...
  chosen_korean: 그리고 그들의 모든 질병의 치료법은…
  alternatives_korean:
  - 그리고 그들의 모든 질병의 치료법은…
  - 그리고 그들의 모든 병의 치료는…
  lexicon: remedy / healing
  rationale: 제공된 게에즈 본문은 동사가 아니라 명사구로 끝나므로, 영어 POB의 수정된 판단에 따라 ‘치료했다’가 아니라 ‘치료법/치유’라는 명사구로 남겼습니다.
theological_decisions:
- issue: 본문 결말의 절단된 형태
  chosen_reading: 마지막 구절을 완결된 서술문으로 채우지 않고, 제공된 게에즈 단편대로 명사구를 생략부호로 남겼습니다.
  alternative_readings:
  - 그리고 우리는 그들의 모든 병을 고쳤습니다.
  - 그리고 그들의 모든 질병에 대한 치료가 있었습니다.
  rationale: 제공된 소스가 문장 끝에서 끊겨 있으며, 번역이 없는 내용을 보태면 원문 범위를 넘어가므로 단편성을 보존하는 것이 가장 충실합니다.
  doctrine_reference: source fidelity / textual restraint
