  language: ko
  text: 그는 아라랏 땅에 있는 루바르 산에 묻혔습니다. 그는 생애 구백오십 년을 채웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተቀብረ፡
  english_pob_choice: And he was buried
  chosen_korean: 묻혔습니다
  alternatives_korean:
  - 장사되었습니다
  - 매장되었습니다
  lexicon: 독자적 서술 동사
  rationale: 수동적 매장 사실을 현대 한국어로 자연스럽게 전달하면서, 의도된 장례/매장 사건을 과장 없이 반영합니다.
- source_word: ውስተ፡ ሉባር፡ ደብር፡
  english_pob_choice: in Lubar, a mountain
  chosen_korean: 루바르 산에
  alternatives_korean:
  - 루바르에 있는 산에
  - 루바르 산에 있는 곳에
  lexicon: 지명+일반명사 결합
  rationale: 원문의 ‘루바르’와 ‘산’을 직접 대응시켜 장소성을 분명히 하되, 한국어 어순에 맞게 간결하게 처리했습니다.
- source_word: በምድረ፡ አራራት።
  english_pob_choice: in the land of Ararat
  chosen_korean: 아라랏 땅의
  alternatives_korean:
  - 아라랏 땅에 있는
  - 아라랏 지역의
  lexicon: 소유/소속 관계
  rationale: 원문의 전치사구는 위치가 아니라 소속·영역을 나타내므로 ‘-의’로 관계를 나타냈습니다.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ፡
  english_pob_choice: He completed nine hundred and fifty years in his life
  chosen_korean: 자기 생애에 아흔다섯 해를 채웠습니다
  alternatives_korean:
  - 생애 동안 아흔다섯 해를 살았습니다
  - 생애에 아흔다섯 해를 마쳤습니다
  lexicon: 숫자 표현
  rationale: 원문 수치 표현을 자연스러운 한국어로 옮겼습니다. 다만 Geez의 수량 표기와 영어 POB의 'nine hundred and fifty years' 사이에 수치 차이가 있어, 본문은 영어 POB의 수정본을 따라 공적인 문장으로 제시합니다.
theological_decisions:
- issue: 장례 서술과 수명 서술의 병치
  chosen_reading: 매장 사실과 생애의 완결을 분리해 두 문장으로 옮겼습니다.
  alternative_readings:
  - 한 문장으로 이어서 옮김
  - 생애 완료를 앞세워 매장 서술을 종속시킴
  rationale: 원문은 매장 사건과 수명 완결을 둘 다 말하므로, 한국어에서도 두 진술의 독립성을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 서술 단위 보존 원칙
