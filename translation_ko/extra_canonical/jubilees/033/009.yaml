  text: And Jacob did not approach her again, because Reuben had defiled her. And every man who uncovers his father's covering—his deed is very evil,
translation:
  language: ko
  text: 그리고 야곱은 다시 그녀에게 가까이하지 않았습니다. 이는 르우벤이 그녀를 더럽혔기 때문입니다. 자기 아버지의 덮개를 벗기는 사람은 누구나 — 그의 행위는 매우 악합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአቀረበ ... ያዕቆብ
  english_pob_choice: And Jacob did not approach her again
  chosen_korean: 그리고 야곱은 다시 그녀에게 가까이하지 않았습니다
  alternatives_korean:
  - 그리고 야곱은 다시 그녀에게 접근하지 않았습니다
  - 그런데 야곱은 다시 그녀에게 가까이하지 않았습니다
  lexicon: 가까이하다
  rationale: 게으름 없는 직접적 행위를 나타내는 동사로, 원문의 관계 재개 거부를 자연스럽게 옮기면서도 과도한 해석을 피합니다.
- source_word: አርኩሳ ሮቤል
  english_pob_choice: because Reuben had defiled her
  chosen_korean: 이는 르우벤이 그녀를 더럽혔기 때문입니다
  alternatives_korean:
  - 이는 르우벤이 그녀를 부정하게 했기 때문입니다
  - 이는 르우벤이 그녀를 더럽혀 놓았기 때문입니다
  lexicon: 더럽히다
  rationale: 원문의 성적/의식적 훼손 의미를 담는 가장 직접적인 표현으로, POB의 'defiled'를 한국어로 보존합니다.
- source_word: ዘይከሥት ክዳነ
  english_pob_choice: who uncovers his father's covering
  chosen_korean: 자기 아버지의 덮개를 벗기는 사람
  alternatives_korean:
  - 자기 아버지의 가리개를 벗기는 사람
  - 자기 아버지의 덮은 것을 드러내는 사람
  lexicon: 덮개
  rationale: 원문의 비유적 표현을 그대로 살려, 전통적 완곡어보다 원문 이미지를 드러내는 '덮개'를 택했습니다.
- source_word: ክዳነ / his father's covering
  english_pob_choice: his deed is very evil
  chosen_korean: 그의 행위는 매우 악합니다
  alternatives_korean:
  - 그의 일은 매우 악합니다
  - 그의 소행은 매우 악합니다
  lexicon: 행위
  rationale: POB의 'deed'를 따라, 결과가 아닌 행위 자체의 도덕적 평가임을 분명히 했습니다.
theological_decisions:
- issue: 노골적인 근친/성적 금기 표현을 한국어에서 얼마나 완곡하게 처리할지
  chosen_reading: 원문의 직설적 비난 구조를 유지하되, 비속어로 과장하지 않고 '덮개를 벗기는 사람'으로 비유를 보존했습니다.
  alternative_readings:
  - 전통적 완곡어로 바꾸어 의미를 약화시키는 방식
  - 현대 속어로 강하게 치환하는 방식
  rationale: 이 구절은 금기의 성격을 드러내는 법적-도덕적 경고이므로, 완곡화하면 경고의 힘이 약해집니다.
  doctrine_reference: 창세기 9:22-23의 수치/노출 모티프와 레위기 18장 계열의 성적 금기
