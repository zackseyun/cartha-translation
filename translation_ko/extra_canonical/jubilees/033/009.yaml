revisions:
- from: 그리고 야곱은 다시 그녀에게 가까이하지 않았습니다. 이는 르우벤이 그녀를 더럽혔기 때문입니다. 자기 아버지의 덮개를 벗기는 사람은 누구나 — 그의 행위는 매우 악합니다.
  to: 그리고 야곱은 르우벤이 그 여자를 더럽혔기 때문에 다시는 그 여자에게 가까이하지 않으셨습니다. 자기 아버지의 덮개를 드러내는 사람은 누구나—그런 사람의 행위는 매우 악합니다.
  rationale: 문장 순서를 원문의 인과관계에 맞추어 다듬고, 성적 금기를 암시하는 ‘아버지의 덮개’라는 비유적 표현은 해석으로 대체하지 않았습니다. 또한 현대 표준 한국어의 자연스러운 서술을 위해 ‘다시는’과 ‘그런 사람의 행위’를 사용했습니다.
