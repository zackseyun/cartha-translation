revisions:
- from: “나는 당신에게 순결하지 않습니다. 내가 당신에게서 떨어져 더럽혀졌기 때문입니다. 르우벤이 나를 더럽혔고, 내가 잠든 밤에 내게 들어와 나와 동침했으며, 그가 내 치마를 들추기 전까지 나는 알지 못했습니다.”[a]
  to: “저는 당신에게 정결하지 않습니다. 제가 당신을 떠나 더럽혀졌기 때문입니다. 르우벤이 저를 더럽히고, 밤에 제가 자고 있을 때 저와 동침했습니다. 저는 그가 제 옷자락을 들추고 저와 동침할 때까지 알지 못했습니다.”[a]
  rationale: 원문이 말하는 부정, 밤의 수면 상태, 동침, 그리고 화자가 그 행위를 인지하지 못한 시간적 범위를 보존했습니다. 원문에 없는 침입 동작을 삭제하고, 논쟁적이거나 지나치게 특정적인 의복 명칭 대신 ‘옷자락’을 사용했습니다. ‘당신을 떠나’는 영어 POB audit trail의 ‘apart from you’를 관계적 분리로 자연스럽게 옮긴 것입니다.
