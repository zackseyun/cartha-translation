  - 나는 당신에게 정결하지 않습니다
  lexicon: ንጽሕተ
  rationale: 윤리·관계적 오염을 포함하는 문맥이므로 단순한 위생적 ‘깨끗함’보다 ‘순결’이 원문과 영어 POB의 의미를 더 잘 드러냅니다.
- source_word: ተገመዝኩ ፡ እምኔከ
  english_pob_choice: I have been defiled apart from you
  chosen_korean: 내가 당신에게서 떨어져 더럽혀졌기 때문입니다
  alternatives_korean:
  - 내가 당신에게서 멀리 떨어져 더럽혀졌기 때문입니다
  - 내가 당신과 상관없이 더럽혀졌기 때문입니다
  lexicon: ተገመዝኩ
  rationale: ‘apart from you’의 관계적 분리를 살리되, 한국어에서는 원인절로 풀어 자연스럽게 표현했습니다.
- source_word: ሮቤል ፡ ወሰከበ ፡ ምስሌየ ፡ ሌሊተ
  english_pob_choice: for Reuben has defiled me and lay with me at night
  chosen_korean: 르우벤이 나를 더럽혔고, 내가 잠든 밤에 내게 들어와 나와 동침했으며
  alternatives_korean:
  - 르우벤이 나를 더럽혔고 밤에 나와 동침했으며
  - 르우벤이 나를 더럽혔고, 밤에 나와 함께 누웠습니다
  lexicon: ሮቤል / ወሰከበ / ሌሊተ
  rationale: ‘lay with me at night’의 시간 정보와 성적 접촉의 직접성을 함께 보존하기 위해 ‘내게 들어와 나와 동침했다’로 옮겼습니다.
- source_word: ክነፍየ
  english_pob_choice: my skirt
  chosen_korean: 내 치마
  alternatives_korean:
  - 내 겉옷
  - 내 옷자락
  lexicon: ክነፍየ
  rationale: 구체적 신체 은폐 부위를 가리키는 표현이므로, 과도하게 완곡화하지 않고 한국어에서 자연스러운 ‘치마’로 옮겼습니다.
theological_decisions:
- issue: 성적 폭력과 부정의 진술을 완곡하게 하지 않는 번역
  chosen_reading: 본절은 레아의 부정·훼손을 고백하는 문맥이므로 ‘더럽혀졌다’와 ‘동침했다’를 유지해 사건의 성격을 분명하게 드러냈습니다.
  alternative_readings:
  - 보다 완곡한 ‘관계를 맺었다’
  - 전통적 경건어법의 ‘더럽혀졌다’만 두드러지게 번역
  rationale: 원문과 영어 POB가 모두 오염과 성적 접촉을 직접적으로 말하므로, 독자가 문맥의 폭력성과 침해성을 정확히 이해하도록 해야 합니다.
  doctrine_reference: source fidelity / narrative ethics
