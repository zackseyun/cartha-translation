  yaml_path: translation/extra_canonical/jubilees/033/007.yaml
  text: “I am not pure for you, because I have been defiled apart from you; for Reuben has defiled me and lay with me at night while I was asleep, and I did not know until he uncovered my skirt and lay with me.”
translation:
  language: ko
  text: “저는 당신에게 정결하지 않습니다. 제가 당신을 떠나 더럽혀졌기 때문입니다. 르우벤이 저를 더럽히고, 밤에 제가 자고 있을 때 저와 동침했습니다. 저는 그가 제 옷자락을 들추고 저와 동침할 때까지 알지 못했습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘옷자락’(직역하면 ‘날개/끝’)은 의복의 가장자리 또는 자락을 가리키는 표현입니다.
    reason: ክነፍየ의 문자적 이미지와 정확한 의복 종류가 확정되지 않는 점을 밝혀, 본문의 자연스러운 번역이 지나치게 구체화되는 것을 막습니다.
lexical_decisions:
- source_word: ኢኮንኩ ፡ ንጽሕተ ፡ ለከ
  english_pob_choice: I am not pure for you
  chosen_korean: 나는 당신에게 순결하지 않습니다
  alternatives_korean:
