  naturalness: ‘당신에게서 떨어져 더럽혀졌다’와 ‘내게 들어와 나와 동침했다’는 자연스럽지 않거나 불필요하게 해석을 보탭니다. ‘당신을 떠나 더럽혀졌습니다’ 및 ‘내 옷자락을 들추고 나와 동침할 때까지’가 현대 한국어 합쇼체로 더 자연스럽습니다.
  terminology: 성적·의례적 부정의 맥락에서 ‘순결하지 않습니다’는 가능하나, ንጽሕተ의 정결/부정 어휘장과 ‘더럽혀졌다’의 연결을 위해 ‘정결하지 않습니다’를 택했습니다. ክነፍየ는 ‘치마’로 한정하기보다 옷의 가장자리/자락이라는 폭넓은 뜻을 보존하는 ‘옷자락’이 안전합니다.
