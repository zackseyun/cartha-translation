review_pass:
  verdict: revise
  source_fidelity: The draft incorrectly leaves the subject of ‘fled’ as the woman under normal Korean coordination. The Geʽez explicitly shifts to a masculine subject (‘he fled’), then returns to the feminine subject for ‘she lamented.’ The hand is also hers, not his; the Korean should state this explicitly. ‘Before him,’ removal of her hand from upon him, and restrained lamentation are otherwise represented appropriately.
  naturalness: The proposed revision makes each subject explicit at the points where the source changes subject, avoiding a misleading serial-action reading. ‘그의 몸 위에서 거두었습니다’ retains the spatial sense of ‘from upon him’ while reading naturally in formal modern Korean.
  terminology: No specialized theological terminology occurs. ‘부끄러워했습니다,’ ‘거두었습니다,’ ‘달아났습니다,’ and ‘슬퍼했습니다’ are neutral, modern formal-polite renderings. The unsupported footnote marker is removed.
  issues:
  - severity: high
    issue: The Korean coordination makes the woman appear to be the one who fled.
    rationale: After ‘그녀는 … 손을 거두고,’ the unmarked predicate ‘도망쳤습니다’ normally retains 그녀 as its subject. The source says that he fled.
  - severity: medium
    issue: ‘그의 위에 있던 손’ does not clearly identify the hand as hers and can momentarily suggest his hand.
    rationale: The source has ‘her hand’; explicit ‘자기 손’ preserves this possessive relation.
  - severity: low
    issue: The text contains footnote marker [a] but no corresponding footnote.
    rationale: Removing the unanchored marker resolves the incomplete footnote apparatus without affecting meaning.
  revised_text: 그녀는 그 앞에서 부끄러워하여 자기 손을 그의 몸 위에서 거두었습니다. 그는 달아났습니다. 그리고 그녀는 이 일로 슬퍼했습니다.
  revised_footnotes: []
  revision_rationale: The revision explicitly marks the source’s shifts from the woman to the man and back to the woman, clarifies that the hand belongs to her, preserves the ‘upon him’ spatial relation, and removes the unsupported footnote marker. It does not add emotional intensity beyond the source.
