  text: And she was ashamed before him, and she removed her hand from upon him, and he fled. And she lamented over this matter,
translation:
  language: ko
  text: 그녀는 그 앞에서 부끄러워하여 자기 손을 그의 몸 위에서 거두었습니다. 그는 달아났습니다. 그리고 그녀는 이 일로 슬퍼했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተኀፍረት ፡ እምኔሁ
  english_pob_choice: she was ashamed before him
  chosen_korean: 그녀는 그 앞에서 부끄러워하며
  alternatives_korean:
  - 그녀는 그에게서 부끄러워하며
  - 그녀는 그 때문에 부끄러워하며
  lexicon: ተኀፍረት
  rationale: 전치사 እምኔሁ는 단순 원인보다 ‘그 앞에서/그 앞에’라는 대면적 뉘앙스를 더 잘 살리므로, English POB의 수정본도 반영해 자연스럽게 ‘그 앞에서’로 옮겼습니다.
- source_word: ወኀደገት ፡ እዴሃ ፡ እምላዕሌሁ
  english_pob_choice: she removed her hand from upon him
  chosen_korean: 그의 위에 있던 손을 거두고
  alternatives_korean:
  - 그에게서 손을 떼고
  - 그의 위에 있던 손을 내려놓고
  lexicon: ወኀደገት / እዴሃ / እምላዕሌሁ
  rationale: ‘손을 거두다’는 접촉을 끊는 동작을 한국어로 간결하게 살리며, እምላዕሌሁ의 ‘위에’라는 공간적 이미지를 유지합니다.
- source_word: ወጐየ
  english_pob_choice: and he fled
  chosen_korean: 도망쳤습니다
  alternatives_korean:
  - 달아났습니다
  - 도망갔습니다
  lexicon: ጐየ
  rationale: 행동의 급박함을 드러내는 기본 의미를 따라 표준적 서술형으로 옮겼습니다.
- source_word: ወትላሑ ፡ በእንተዝ ፡ ነገር
  english_pob_choice: And she lamented over this matter
  chosen_korean: 그리고 이 일로 슬퍼했습니다
  alternatives_korean:
  - 그리고 이 일에 대해 통곡했습니다
  - 그리고 이 일 때문에 애통해했습니다
  lexicon: ትላሑ
  rationale: 동사의 강도를 과장하지 않으면서도 문맥상 감정적 반응을 살리기 위해 ‘슬퍼했습니다’로 옮겼습니다.
theological_decisions:
- issue: 서술의 감정 강도
  chosen_reading: ‘lamented’의 강도를 ‘통곡하다’처럼 과하게 올리지 않고 ‘슬퍼했습니다’로 처리했습니다.
  alternative_readings:
  - 통곡했습니다
  - 몹시 슬퍼했습니다
  rationale: 게에즈 원문과 English POB 수정본에는 명시적 강도 부사가 없으므로, 추가적인 정서 과장은 피하고 감정 반응 자체만 분명히 드러냈습니다.
  doctrine_reference: source-accuracy principle
