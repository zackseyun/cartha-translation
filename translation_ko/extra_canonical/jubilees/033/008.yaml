  to: 야곱은 르우벤이 빌하와 동침하여 아버지의 옷자락을 들추었기 때문에 그에게 크게 분노하였습니다.[a]
  rationale: 본문은 ክዳነ의 기본 의미인 옷·덮개의 이미지를 ‘옷자락’으로 살리고, ከሠተ의 ‘드러내다’는 ‘들추다’로 옮겼습니다. 이는 성적 의미를 문맥상 전달하면서도 원문이 사용하는 관용적이고 간접적인 표현을 보존합니다. ‘침상’은 본문에 채택하지 않고 각주에 남겨 해석상의 여지를 유지했습니다.
