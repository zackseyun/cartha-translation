    text: Or 'bed'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 르우벤에게 크게 분노하였는데, 이는 그가 빌하와 동침하였고, 아버지의 겉옷을 벗겼기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተምዐ ፡ ... ጥቀ
  english_pob_choice: was very angry
  chosen_korean: 크게 분노하였는데
  alternatives_korean:
  - 몹시 화가 났는데
  - 크게 노하였는데
  lexicon: 감정 표지
  rationale: 게으즈 원문은 강한 분노를 나타내며, 영어 POB의 'very angry'를 자연스러운 합쇼체로 옮기기 위해 '크게 분노하다'를 택했습니다.
- source_word: ሰከበ ፡ ምስለ ፡ ባላን
  english_pob_choice: he had lain with Bilhah
  chosen_korean: 그가 빌하와 동침하였고
  alternatives_korean:
  - 그가 빌하와 자고
  - 그가 빌하와 누웠고
  lexicon: 성적 결합 표현
  rationale: 원문은 단순한 '누움'이 아니라 성적 위반을 가리키므로, 의미를 분명히 드러내는 '동침하다'가 가장 적절합니다.
- source_word: ከሠተ ፡ ክዳነ ፡ አቡሁ
  english_pob_choice: he had uncovered his father’s bed / skirt
  chosen_korean: 아버지의 겉옷을 벗겼기 때문입니다
  alternatives_korean:
  - 아버지의 침상을 드러냈기 때문입니다
  - 아버지의 치마를 벗겼기 때문입니다
  lexicon: idiom / garment-covering
  rationale: 게으즈 ክዳን은 '덮는 것, 옷, 겉가리개'의 뜻을 가지며, 영어 POB 수정 이력과 달리 '침상'보다 '겉옷/덮개'가 원문의 상징적·관용적 의미를 더 직접적으로 반영합니다.
- source_word: ሮቤል
  english_pob_choice: Reuben
  chosen_korean: 르우벤
  alternatives_korean:
  - 루벤
  lexicon: 고유명사
  rationale: 성경 인명은 통용되는 한국어 음역 '르우벤'을 사용했습니다.
theological_decisions:
- issue: 아버지의 '침상'이 아니라 '겉옷'으로 번역한 관용구 처리
  chosen_reading: 성적 위반을 직접 지시하는 관용 표현으로 이해하여, 덮개/옷의 이미지를 유지했습니다.
  alternative_readings:
  - 아버지의 침상을 드러냈다
  - 아버지의 치마를 벗겼다
  rationale: 게으즈 어휘와 주석 이력은 이 표현이 성적 수치를 암시하는 관용구임을 보여 주므로, 한국어에서도 그 이미지가 보이도록 하되 원어의 실제 어휘 의미를 해치지 않도록 '겉옷'으로 옮겼습니다.
  doctrine_reference: 창세기 35:22; 신명기 22:30, 27:20의 유사 관용구
- issue: '''크게 분노하다''의 서술어 선택'
  chosen_reading: 야곱의 즉각적이고 강한 도덕적 반응을 분명히 드러냈습니다.
  alternative_readings:
  - 화가 났습니다
  - 노하였습니다
  rationale: 원문은 단순한 감정이 아니라 격렬한 분노를 표현하므로, 약화시키지 않기 위해 강도를 보존했습니다.
  doctrine_reference: 서사 문맥의 감정 강도 보존
