translation:
  language: ko
  text: 그녀는 누구에게도 말하지 않았습니다. 그리고 야곱이 와서 그녀를 찾자, 그녀는 그에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈድፋደ
  english_pob_choice: and she told no one
  chosen_korean: 그녀는 누구에게도 말하지 않았습니다
  alternatives_korean:
  - 아무에게도 말하지 않았습니다
  - 아무에게도 알리지 않았습니다
  lexicon: 말하다
  rationale: 아무에게도 전하지 않았다는 의미를 자연스럽게 살리되, 원문의 단순한 부정을 과장하지 않도록 ‘누구에게도 말하지 않았습니다’로 옮겼습니다.
- source_word: ወኀሠሣ
  english_pob_choice: he sought her
  chosen_korean: 그녀를 찾자
  alternatives_korean:
  - 그녀를 찾았을 때
  - 그가 그녀를 찾았고
  lexicon: 찾다
  rationale: 지시어가 생략된 채 ‘찾다’의 행위만 제시되므로, 문맥상 주어는 야곱으로 두고 한국어에서는 종속절 ‘그녀를 찾자’로 간결하게 처리했습니다.
- source_word: ትቤሎ
  english_pob_choice: she said to him
  chosen_korean: 그녀는 그에게 말했습니다
  alternatives_korean:
  - 그녀가 그에게 말했습니다
  - 그에게 이르렀습니다
  lexicon: 말하다
  rationale: 대상 지시가 분명하므로 ‘그에게’로 옮기고, 서술의 평이함을 유지하기 위해 ‘이르다’보다 ‘말했습니다’를 택했습니다.
theological_decisions:
- issue: 익명성 유지와 인칭 처리
  chosen_reading: 이 문장은 사건 서술에 집중하며, 인칭 대명사는 원문의 담백한 진행을 따라 유지했습니다.
  alternative_readings:
  - 주어를 생략해 더 압축적으로 옮길 수 있음
  - ‘그녀’를 반복하지 않고 문장 간결화를 할 수 있음
  rationale: 원문은 단순 서술과 동사 연쇄로 진행되므로, 인칭을 분명히 드러내되 해설적 보충은 넣지 않는 것이 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
