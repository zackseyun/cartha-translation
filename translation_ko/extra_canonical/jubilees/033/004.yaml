translation:
  language: ko
  text: 그의 집 안에서였습니다. 그는 그녀와 함께 누웠고, 그녀가 깨어 그를 보았는데, 보니 르우벤이 그녀와 함께 침상에 누워 있었습니다. 그녀는 덮개 끝을 젖히고 그를 붙잡아 외쳤으며, 그가 르우벤임을 알아보았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ ፡ ቤታ
  english_pob_choice: in her house
  chosen_korean: 그의 집 안에서였습니다
  alternatives_korean:
  - 그녀의 집 안에서였습니다
  - 집 안에 있었습니다
  lexicon: source phrase
  rationale: 게에즈 원문은 사건의 장소를 먼저 제시하므로 한국어에서도 도입부로 옮겼습니다. 대명사 소유격은 문맥상 그녀를 가리키는 것으로 이해되지만, 원문 흐름을 살려 간결하게 처리했습니다.
- source_word: ወሰከበ ፡ ምስሌሃ
