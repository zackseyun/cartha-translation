  - 르우벤인 줄 알아보았습니다
  lexicon: source phrase
  rationale: 원문의 인식 동사는 사실 확인의 결과를 나타내므로 '알아보았습니다'로 옮겼고, 주어가 인물임을 분명히 하기 위해 '그가'를 유지했습니다.
