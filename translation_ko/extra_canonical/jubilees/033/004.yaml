  - 그녀가 그를 보았고
  lexicon: source phrase
  rationale: 목적어 대명사 '그를'을 반영해야 하며, 앞뒤 장면 전환을 자연스럽게 잇기 위해 '깨어'를 넣었습니다.
- source_word: ወአእመረቶ ፡ ከመ ፡ ሮቤል ፡ ውእቱ
