  text: the maidservant of Rachel, the concubine of his father, bathing in water in a secluded place, and he loved her. And he hid himself, and at night he entered the house of Bilhah and found her sleeping alone in her bed.
  footnotes:
  - marker: a
    text: Or 'Rachel, the concubine'.
    reason: previous_rendering
  - marker: b
    text: Or 'alone on a bed in her house'.
    reason: previous_rendering
translation:
  language: ko
  text: 라헬의 시녀, 곧 그의 아버지의 첩이 은밀한 곳에서 물로 몸을 씻고 있었고, 그는 그녀를 사랑했습니다. 그는 몸을 숨겼다가 밤에 빌하의 집에 들어가, 그녀가 그녀의 침상에서 홀로 자고 있는 것을 발견했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአኪተ ፡ ራሔል
  english_pob_choice: the maidservant of Rachel
  chosen_korean: 라헬의 시녀
  alternatives_korean:
  - 라헬의 하녀
  - 라헬의 몸종
  lexicon: 아직/보조역할 표현
  rationale: 게에즈의 관계구문은 라헬에 속한 여종을 가리키므로, 현대어에서 자연스럽고 위계감을 과도하게 키우지 않는 ‘시녀’로 옮겼습니다.
- source_word: ዐቅብተ ፡ አቡሁ
  english_pob_choice: the concubine of his father
  chosen_korean: 그의 아버지의 첩
  alternatives_korean:
  - 그의 아버지의 후궁
  - 그의 아버지의 소실
  lexicon: 첩/후궁/소실
  rationale: 출처 문맥과 영문 주해가 가리키는 가족관계 표현을 그대로 살려, 문어적이면서도 현재 한국어에서 이해 가능한 ‘첩’을 사용했습니다.
- source_word: ትትሐፀብ ፡ በማይ ፡ በኅቡእ
  english_pob_choice: bathing in water in a secluded place
  chosen_korean: 사람 눈에 띄지 않는 곳에서 물로 몸을 씻고 있었는데
  alternatives_korean:
  - 한적한 곳에서 물로 목욕하고 있었는데
  - 숨은 곳에서 목욕하고 있었는데
  lexicon: 목욕/몸을 씻다/은밀한 곳
  rationale: ‘목욕’의 의미는 유지하되, 게에즈의 ‘물로 씻다’와 ‘은밀한 곳’을 함께 드러내기 위해 ‘물로 몸을 씻고 있었는데’로 풀었습니다.
- source_word: ቦአ ፡ ቤተ ፡ ባላን
  english_pob_choice: he entered the house of Bilhah
  chosen_korean: 빌하의 집에 들어가
  alternatives_korean:
  - 빌하의 집으로 들어가
  - 빌하의 집 안으로 들어가
  lexicon: 집/들어가다
  rationale: 영문 주해와 원문이 분명히 ‘빌하의 집’을 가리키므로 이를 직역하되, 한국어 문장 흐름에 맞게 간결하게 처리했습니다.
- source_word: ውስተ ፡ ዐራታ ፡ ባሕቲታ
  english_pob_choice: sleeping alone in her bed
  chosen_korean: 자기 침상에서 홀로 자고 있는 것을
  alternatives_korean:
  - 침상에 홀로 누워 있는 것을
  - 혼자 침상에 자고 있는 것을
  lexicon: 침상/홀로
  rationale: 게에즈 표현은 ‘침상에서 홀로’의 뜻이므로, 장소와 상태를 모두 살려 ‘자고 있는 것을’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: '서술 대상의 식별: 라헬 vs 빌하'
  chosen_reading: 본문의 관계구문은 라헬의 여종인 빌하를 가리키므로, 한국어 본문은 ‘라헬의 시녀’로 시작하되 뒤에서는 ‘빌하의 집’으로 이어지게 했습니다.
  alternative_readings:
  - 라헬, 곧 그의 아버지의 첩
  - 라헬의 첩
  rationale: 영문 POB의 수정 이력과 게에즈 원문 모두 ‘maidservant of Rachel’에 해당하는 인물이 빌하임을 보여 주므로, 라헬 자체를 첩으로 읽는 오독을 피해야 합니다.
  doctrine_reference: 본문비평/서사맥락
- issue: ‘몰래/숨기다’의 반복 표현
  chosen_reading: ‘사람 눈에 띄지 않는 곳’과 ‘그는 몸을 숨겼으며’를 함께 살려 은밀성과 행동의 연속성을 드러냈습니다.
  alternative_readings:
  - 한적한 곳에서
  - 그는 숨어 있었으며
  rationale: 원문은 장소의 은밀함과 인물의 숨음이라는 두 요소를 모두 제시하므로, 둘을 한쪽으로 흡수하지 않고 분리해 번역했습니다.
  doctrine_reference: 서사적 강조
