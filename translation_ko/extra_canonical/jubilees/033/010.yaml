theological_decisions:
- issue: 주님/야훼 표기와 주석적 구분
  chosen_reading: 본문의 경고와 인용에서는 주님을 기본으로 두되, 심판자 호칭이 하나님을 직접 가리키는 대목은 야훼로 표기했습니다.
  alternative_readings:
  - 전체를 주님으로 통일
  - 전체를 야훼로 통일
  rationale: 게에즈 원문은 동일한 신적 지시를 반복하지만, 인용과 서술이 섞인 문맥에서 구별을 최소한으로 반영하는 편이 감사 가능성이 높습니다.
  doctrine_reference: YHWH / κύριος 구별 원칙
- issue: 르우벤 사례의 서술적 인용 처리
  chosen_reading: 르우벤 관련 문장은 공동체가 이의를 제기할 수 있는 예외 주장으로 번역해, 본문의 금지 규정이 일반 원칙을 확정하는 맥락을 살렸습니다.
  alternative_readings:
  - 르우벤을 언급하지 않고 일반 규정만 번역
  - 르우벤을 용서 사례로 단정적으로 제시
