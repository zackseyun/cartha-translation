translation:
  language: ko
  text: '그의 행위는 매우 악합니다. 그는 주님 앞에서 가증한 자입니다. 그러므로 하늘의 석판에 기록되고 제정되었으니, 사람은 자기 아버지의 아내와 동침해서는 안 되며 자기 아버지의 옷자락을 들추어서도 안 됩니다[a]. 이는 그것이 부정하기 때문입니다. 자기 아버지의 아내와 동침하는 남자와 그 여자도 함께 반드시 죽어야 합니다. 그들이 땅에서 부정한 일을 행했기 때문입니다. 우리 하나님 앞에서, 그분께서 자기 소유로 택하신 왕국의 백성 가운데에는 부정함이 없어야 합니다.


    또 다시 기록되었으니, “자기 아버지의 아내와 동침하여 자기 아버지의 수치를 드러낸 자는 저주를 받을지어다[b].” 주님의 모든 거룩한 자들은 “그리되기를, 그리되기를”이라고 말해야 합니다. 그리고 당신, 모세는 이스라엘 자손에게 이 말씀을 지키라고 명령하십시오. 이것은 사형의 판결이며 부정한 일이기 때문입니다. 이것을 행한 사람에게는 영원히 속죄가 없으며, 그를 사형에 처하고 죽이고 돌로 쳐 죽이며 우리 하나님의 백성 가운데에서 뿌리째 뽑아 버리는 것 외에는 달리 속죄할 길이 없습니다.


    이스라엘에서 이런 일을 하는 사람은 땅 위에서 하루도 살아남아서는 안 됩니다. 그는 가증하고 부정하기 때문입니다. 그들은 “르우벤은 그의 아버지의 첩과 동침한 뒤에도 살도록 허락받았고 용서도 받았다. 그 여자에게도 남편이 있었고, 그의 아버지 야곱도 그때 아직 살아 있었다”라고 말해서는 안 됩니다. 그때까지는 규례와 판결과 율법이 모든 사람을 위하여 완전히 드러나지 않았기 때문입니다. 그러나 당신의 시대에는 이것이 때와 날들의 율법이며, 영원한 세대를 위한 영원한 율법입니다. 이 율법에는 끝나는 날이 없고 용서도 없습니다. 오직 그 둘을 백성 가운데에서 뿌리째 뽑아 버릴 뿐입니다. 그들이 그것을 행한 날에 그들을 죽여야 합니다.


    그리고 당신, 모세는 이 일을 이스라엘을 위하여 기록하여, 그들이 지키고 이런 일을 행하지 않으며 죽음에 이르는 죄를 짓지 않게 하십시오. 심판자이신 우리 하나님 주님께서는 사람을 편들지 않으시고 뇌물도 받지 않으시는 분이기 때문입니다. 그들에게 이 규례의 말씀을 전하여, 그들이 듣고 경계하며 스스로 삼가서 멸망하고 그 땅에서 뿌리째 뽑히지 않게 하십시오. 땅에서 이것을 행하는 모든 자는 우리 하나님 앞에서 부정하고 더럽혀지고 오염되고 더러운 자들이기 때문입니다.


    이스라엘에서 땅 위에서 저지르는 음행보다 더 큰 죄는 없습니다. 이스라엘은 그 하나님 주님께 속한 거룩한 백성이며, 유업의 백성이며, 제사장 백성이며, 왕국의 백성이며, 심으신 백성이기 때문입니다. 거룩한 백성 가운데에는 그러한 부정함이 보여서는 안 됩니다.


