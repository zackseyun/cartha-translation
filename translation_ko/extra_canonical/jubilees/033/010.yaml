translation:
  language: ko
  text: 그의 행위는 매우 악합니다. 그는 주님 앞에서 가증한 자입니다. 그러므로 하늘의 판판에 기록되고 제정되었으니, 사람은 자기 아버지의 아내와 동침해서는 안 되며 자기 아버지의 치마를 들추어서도 안 됩니다. 이는 그것이 더럽기 때문입니다. 그 남자와 여자도 함께 반드시 죽어야 합니다. 곧 자기 아버지의 아내와 동침하는 자와 그 여자입니다. 그들이 땅에서 더러운 일을 행했기 때문입니다. 그리고 하나님 앞에서 그분이 친히 택하신 백성 가운데에는 더러움이 없어야 합니다. 또 다시 두 번째로 기록되었으니, “자기 아버지의 아내와 동침하여 자기 아버지의 수치를 드러낸 자는 저주를 받을지어다.” 주님의 모든 거룩한 자들은 “그렇게 하소서, 그렇게 하소서”라고 말해야 합니다. 그리고 당신, 모세는 이스라엘 자손에게 이 말씀을 지키라고 명령하십시오. 이것은 사형 판결이며 더럽기 때문입니다. 또한 이것을 행한 사람을 속죄하기 위한 영원한 속죄는 없습니다. 그를 죽이고, 죽이고, 돌로 치고, 우리 하나님의 백성 가운데에서 뽑아내는 것 외에는 아무런 속죄가 없습니다. 이스라엘에서 이런 일을 하는 사람은 땅 위에서 하루라도 살아남아서는 안 됩니다. 그는 가증하고 더럽기 때문입니다. 그들은 “르우벤은 그의 아버지의 첩과 동침한 뒤에도 살 수 있었고 용서도 받았다. 그 첩에게도 남편이 있었고, 그의 아버지 야곱도 그때 아직 살아 있었다”라고 말해서는 안 됩니다. 그때까지는 모든 사람을 위해 규례와 판결과 율법이 완전히 드러나지 않았기 때문입니다. 그러나 당신의 시대에는 그것이 때와 날들의 율법이자, 영원한 세대를 위한 영원한 율법과 같습니다. 이 율법에는 날들의 마침이 없고, 그것을 위한 용서도 없습니다. 오직 그들 둘을 백성 가운데에서 뽑아내는 것뿐입니다. 그들이 그것을 행한 날에 그들을 죽여야 합니다. 그리고 당신, 모세는 이스라엘을 위해 이것을 기록하여 그들이 지키고 이 일에 따라 행하지 않으며 죽음에 이르는 죄로 죄를 짓지 않게 하십시오. 심판하시는 이, 곧 우리 하나님
    야훼께서는 사람의 외모를 보지 않으시고 뇌물도 받지 않으시는 분이기 때문입니다. 그리고 그들에게 이 규례의 말씀을 전하여 그들이 듣고 경계하며 스스로 살펴서, 우리 하나님의 땅에서 멸망당하고 뽑혀 나가지 않게 하십시오. 땅에서 이것을 행하는 모든 자는 우리 하나님 앞에서 더럽고, 불결하고, 오염되고, 부정해지기 때문입니다. 이스라엘에서 그들이 땅에서 행하는 성적 부정함보다 더 큰 죄는 없습니다. 이스라엘은 그 하나님 주님께 속한 거룩한 백성이며, 유업의 백성이며, 제사장 백성이며, 왕국의 백성이며, 심어진 백성이기 때문입니다. 그러므로 거룩한 백성 가운데에는 그런 더러움이 보이지 않아야 합니다. 그리고 이 주기의 셋째 해에 야곱과 그의 모든 아들들은 가서 아브라함의 집에 거하였는데, 그의 아버지 이삭과 그의 어머니 리브가 가까이 있었습니다. 야곱의 아들들의 이름은 이렇습니다. 맏아들 르우벤, 시므온, 레위, 유다, 잇사갈, 스불론은 레아의 아들들이며, 라헬의 아들들은 요셉과 베냐민이고, 빌하의 아들들은 단과 납달리이며, 실바의 아들들은 갓과 아셀이고, 레아의 외동딸 디나라, 곧 야곱의 딸입니다. 그들은 가서 이삭과 리브가에게 절하였고, 그들이 그들을 보았을 때 야곱과 그의 모든 아들들을 축복했습니다. 이삭은 자기 아들 야곱의 아들들을 보았기 때문에 크게 기뻐하며 그들을 축복했습니다.[a][b]
  philosophy: optimal-equivalence
