  to: 유월절에 관하여 야훼께서 네게 명령하신 명령을 기억하십시오. 곧 정해진 때인 첫째 달 열넷째 날에 그것을 지키고, 저녁 전에 그것을 잡아 그들이 그것을 먹도록 하십시오.[a]
  rationale: 수신자를 원문의 단수형에 맞추고, 마지막 절에 희생물의 목적어를 보완하여 명령의 대상과 행위의 관계를 명료하게 했습니다. 날짜, 정해진 때, 저녁 전의 도살 및 복수 주체의 섭취라는 원문의 순서와 의미는 유지했습니다.
