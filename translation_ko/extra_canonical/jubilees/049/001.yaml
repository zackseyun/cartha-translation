  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: ko
  text: 야훼께서 너희에게 명령하신 유월절에 관한 명령을 기억하십시오. 그것을 정해진 때에, 곧 첫째 달 열넷째 날에 지키고, 저녁 전에 잡아 그들이 먹게 하십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር፡ ትእዛዘ፡
  english_pob_choice: Remember the command
  chosen_korean: 명령을 기억하십시오
  alternatives_korean:
  - 기억하십시오
  - 그 명령을 기억하십시오
  lexicon: 기억하다; 명령
  rationale: Geez의 ‘기억하다’와 ‘명령’을 직접 살려, 단순 회상이 아니라 준수 대상인 지시를 상기하라는 뜻으로 옮겼습니다.
- source_word: እግዚአብሔር፡
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 본문의 신적 칭호를 프로젝트 기본값에 따라 야훼로 옮겨, 원문의 언약적 고유명을 드러냈습니다.
- source_word: በእንተ፡ ፋሲካ፡
  english_pob_choice: concerning the Passover
  chosen_korean: 유월절에 관한
  alternatives_korean:
  - 유월절에 대하여
  - 유월절과 관련하여
  lexicon: Passover
  rationale: ‘관하여’는 Geez 전치사 구문과 영어 POB의 공식적 문체를 자연스럽게 반영합니다.
- source_word: ትግበር፡ በጊዜሁ፡
  english_pob_choice: observe it at its appointed time
  chosen_korean: 정해진 때에 지키고
  alternatives_korean:
  - 정해진 때에 지키며
  - 그 때에 পালন하고
  lexicon: observe; appointed time
  rationale: 영어 POB의 ‘observe’를 따라 단순 수행보다 규정된 절기 준수를 강조했고, ‘정해진 때’로 ‘appointed time’을 옮겼습니다.
- source_word: ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡ ቀዳማዊ፡
  english_pob_choice: on the fourteenth day of the first month
  chosen_korean: 첫째 달 열넷째 날에
  alternatives_korean:
  - 첫 달 열넷째 날에
  - 첫째 달의 열네째 날에
  lexicon: fourteenth day; first month
  rationale: 달 숫자와 날짜를 한국어 성경체로 간결하게 옮겨, 달력 지시가 분명하게 드러나도록 했습니다.
- source_word: ከመ፡ ትጥብቍ፡ ዘእንበለ፡ ይምሰይ፡
  english_pob_choice: that you should slaughter it before evening
  chosen_korean: 저녁 전에 잡아
  alternatives_korean:
  - 해 지기 전에 잡아
  - 저녁이 되기 전에 죽여
  lexicon: slaughter; before evening
  rationale: 희생 제사 맥락의 동사 ‘잡다’를 사용해 제의적 살해를 직접 드러내되, 지나치게 해설적으로 만들지 않았습니다.
theological_decisions:
- issue: 유월절 규정의 명령적·의례적 성격
  chosen_reading: 본문을 절기 준수 규정으로 읽어, ‘지키고’와 ‘잡아’의 명령형을 그대로 살렸습니다.
  alternative_readings:
  - 일반적인 기억 촉구로 약화하는 읽기
  - 의례적 세부를 완화한 의역
  rationale: 문맥상 단순 상기가 아니라 특정 날짜와 행위가 결부된 준수 명령이므로, 규범성과 의례성을 보존하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 토라/절기 준수의 서술적 명령
