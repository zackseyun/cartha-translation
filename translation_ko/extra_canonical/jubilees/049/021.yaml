revisions:
- from: 그것은 야훼의 이름으로 성별된 것입니다. 그들은 자기 도시들에서는, 또 야훼의 장막 앞이나, 또는 그분이 거하시는 그분의 집 앞이 아니면, 파스카를 지킬 수 없습니다.[a]
  to: 그것은 야훼의 이름으로 성별된 것입니다. 그들은 자기들의 도시에서나 다른 어느 곳에서나, 야훼의 장막 앞 또는 그분이 거하시는 집 앞에서가 아니면 유월절을 지킬 수 없습니다.[a]
  rationale: 원문의 장소 제한과 ‘또는’의 대안 관계를 자연스러운 한국어 조건 구문으로 재구성했습니다. 또한 Passover의 통상적 한국어 대응어인 ‘유월절’을 사용했습니다. 문두의 ‘그것은’은 앞 절에서 이어지는 관계절의 지시 대상을 보존하므로 유지했습니다.
