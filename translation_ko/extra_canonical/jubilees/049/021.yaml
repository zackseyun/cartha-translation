translation:
  language: ko
  text: 그것은 야훼의 이름으로 성별된 것입니다. 그들은 자기들의 도시에서나 다른 어느 곳에서나, 야훼의 장막 앞 또는 그분이 거하시는 집 앞에서가 아니면 유월절을 지킬 수 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 장막 앞과 그분이 거하시는 집 앞에서가 아니면.”
    reason: 게에즈어 접속 표현의 해석 가능성을 밝혀, 본문이 채택한 ‘또는’ 독법과 전통적인 병렬 연결 독법을 함께 제시합니다.
lexical_decisions:
- source_word: በስመ፡ እግዚአብሔር
  english_pob_choice: in the name of the LORD
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 주님의 이름으로
  - 여호와의 이름으로
  lexicon: YHWH
  rationale: 본문의 ‘LORD’는 여호와형의 전통어보다 학술 표기 ‘야훼’가 원문 대응을 더 직접적으로 드러내므로 이를 택했습니다.
- source_word: ዘተቀደሰ
  english_pob_choice: that has been sanctified
  chosen_korean: 성별된 것입니다
  alternatives_korean:
  - 거룩하게 된 것입니다
  - 성화된 것입니다
  lexicon: קדש
  rationale: 의례적으로 ‘거룩하게 구별됨’의 의미를 살려 ‘성별되다’로 옮겼습니다.
- source_word: ጳስካ
  english_pob_choice: Passover
  chosen_korean: 파스카
  alternatives_korean:
  - 유월절
  - 파스하
  lexicon: פסח
  rationale: 절기의 히브리어 음가와 서구성경 전통을 반영해 ‘파스카’를 사용했고, 문맥상 예식 행위를 뜻합니다.
- source_word: ደብተራ
  english_pob_choice: tent
  chosen_korean: 장막
  alternatives_korean:
  - 성막
  - 텐트
  lexicon: משכן/אוהל
  rationale: 하나님의 임재 처소를 가리키는 의례적 ‘tent’이므로 일상적 ‘텐트’보다 성서적 용례에 맞는 ‘장막’이 적절합니다.
theological_decisions:
- issue: 장막 앞/집 앞 연결어
  chosen_reading: ‘야훼의 장막 앞이나, 또는 … 그분의 집 앞이 아니면’으로 읽었습니다.
  alternative_readings:
  - ‘야훼의 장막 앞과 그분의 집 앞’
  - ‘야훼의 장막 앞 또는 그분의 집 앞’
  rationale: 게에즈의 부정 조건문과 영어 POB의 최종 정리(a footnote 포함)를 따라, 예외 가능한 두 장소를 병렬적으로 제시하되 ‘아니면’으로 조건을 분명히 했습니다.
  doctrine_reference: 예배 장소의 규정성과 성소 중심성
