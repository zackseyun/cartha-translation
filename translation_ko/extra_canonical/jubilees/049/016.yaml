translation:
  language: ko
  text: 정해진 때에, 그 명령대로 모든 점에서 해야 합니다. 또한 그것을 야훼의 성소 밖에서 먹는 것은 허용되지 않으며, 오히려 야훼의 성소 앞에서 먹어야 합니다. 그리고 회중의 모든 백성은—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጊዜሁ
  english_pob_choice: at its appointed time
  chosen_korean: 정해진 때에
  alternatives_korean:
  - 그 정한 때에
  - 그 지정된 때에
  lexicon: 시간 표현
  rationale: 절기 제물의 규정상 ‘정해진 때’라는 예정성과 의무성을 함께 살렸습니다.
- source_word: በኵሉ፡ በከመ፡ ትእዛዙ
  english_pob_choice: in every respect according to its command
  chosen_korean: 그 명령에 따라 모든 점에서
  alternatives_korean:
  - 그 명령대로 모든 면에서
  - 명령한 대로 전적으로
  lexicon: 명령/전적 일치 표현
  rationale: 아무 부분도 빠지지 않는 전면적 순종을 드러내기 위해 ‘모든 점에서’를 유지했습니다.
- source_word: ኢይከውን
  english_pob_choice: it shall not be lawful
  chosen_korean: 합당하지 않으며
  alternatives_korean:
  - 허용되지 않으며
  - 법으로 허락되지 않으며
  lexicon: 허용 불가 표현
  rationale: 법적 금지를 한국어로 자연스럽게 옮기되, 단순 규정이 아니라 마땅하지 않다는 규범성을 살렸습니다.
- source_word: በአፍአ / በአንጻረ
  english_pob_choice: outside / before
  chosen_korean: 밖에서는 / 앞에서
  alternatives_korean:
  - 바깥에서는 / 맞은편에서
  - 성소 밖에서 / 성소 앞쪽에서
  lexicon: 공간 관계 부사
  rationale: 개정된 영어의 ‘before’를 ‘앞에서’로 옮겨, 성소를 향한 위치 관계를 자연스럽고 직접적으로 반영했습니다.
- source_word: ወኵሉ፡ ሕዝበ፡ ማኅበር
  english_pob_choice: all the people of the assembly
  chosen_korean: 온 회중과 함께
  alternatives_korean:
  - 회중 전체와 함께
  - 모든 회중과 함께
  lexicon: 회중 표현
  rationale: 다음 절로 이어지는 ‘회중의 모든 사람들’의 공동 참여를 한국어에서 자연스럽게 연결해 주는 표현으로 처리했습니다.
theological_decisions:
- issue: 야훼의 성소로 옮길 때의 경외 표현
  chosen_reading: ‘성소 앞에서’와 ‘밖에서는 먹는 것이 합당하지 않다’로 옮겨, 장소 규정의 거룩성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘성소 맞은편에서’
  - ‘성소 밖에서 먹어서는 안 된다’
  rationale: 이 문맥은 단순한 방향 묘사가 아니라 야훼의 거룩한 공간에 대한 접근 규정이므로, 경외와 금지의 강도를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 거룩성/성소 규정
- issue: 회중 참여의 문법 처리
  chosen_reading: ‘온 회중과 함께’로 마무리해, 이어지는 문맥이 요구하는 공동체적 참여를 보존했습니다.
  alternative_readings:
  - ‘회중의 모든 사람들’
  - ‘모든 백성과 함께’
  rationale: 영어 POB와 수정 이력을 따라 이 구절의 끝이 다음 문맥과 연결되는 점을 살리되, 한국어에서는 절의 흐름이 끊기지 않도록 공동체 참여를 명시했습니다.
  doctrine_reference: 문맥 연속성/회중 공동체
