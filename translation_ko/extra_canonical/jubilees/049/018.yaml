base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: ko
  text: 이와 같이 그들이 그것을 주님의 성소에서 먹도록 기록되고 제정되었습니다. 이스라엘 자손이 차지하게 될 땅, 곧 가나안 땅에 들어가 그 땅 한가운데, 그들의 지파들 가운데 하나에 주님의 장막을 세우고, 주님의 성소가 그 땅에 세워질 때까지 그들이 와서 주님의 장막 한가운데에서 유월절을 지키며, 주님 앞에서 그것을 잡아야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  english_pob_choice: it is written and ordained
  chosen_korean: 기록되고 제정된 것
  alternatives_korean:
  - 기록되고 정해진 것
  - 기록되어 규례로 정해진 것
  lexicon: written/ordained
  rationale: 기록됨과 공적으로 제정됨을 둘 다 살려, 단순한 관습이 아니라 문서화된 규정이라는 점을 함께 드러냈습니다.
- source_word: ቤተ፡ መቅደሱ፡ ለእግዚአብሔር።
  english_pob_choice: the sanctuary of the LORD
  chosen_korean: 주님의 성소
  alternatives_korean:
  - 주의 성소
  - 야훼의 성소
  lexicon: sanctuary
  rationale: 본문의 신성한 거처를 가리키는 표현으로 '성소'를 유지하고, 게에즈의 신명호칭은 본문 스타일에 맞게 '주님'으로 옮겼습니다.
- source_word: ደብተራ፡ እግዚአብሔር፡
  english_pob_choice: the tent of the LORD
  chosen_korean: 주님의 장막
  alternatives_korean:
  - 주의 장막
  - 야훼의 장막
  lexicon: tent/tabernacle
  rationale: 임시 성소의 의미를 살리기 위해 '장막'을 택했고, 문맥상 '텐트'보다 성막적 뉘앙스가 분명합니다.
- source_word: ጳስካ፡
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스카
  - 넘어감 절기
  lexicon: Passover
  rationale: 유대 절기의 고유명으로 널리 통용되는 한국어 성경 용례를 따르되, 본문 의미를 해치지 않는 범위에서 사용했습니다.
theological_decisions:
- issue: 장소 규정의 단계적 구조
  chosen_reading: 이스라엘이 약속의 땅에 들어간 뒤에도 먼저 장막이 세워지고, 그 뒤에 성소가 세워질 때까지 유월절을 장막 가운데서 지키게 하는 단계적 규정으로 읽었습니다.
  alternative_readings:
  - 장막과 성소를 같은 시기의 중복 표현으로 보는 읽기
  - 장막보다 성소를 우선하는 것으로 단순화하는 읽기
  rationale: 게에즈 본문과 영어 POB가 모두 '장막'과 '성소'를 구분해 순차적 전개를 보이므로, 두 표현의 긴장을 보존했습니다.
  doctrine_reference: 서사적-제의적 질서 보존
