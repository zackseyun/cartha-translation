  naturalness: 합쇼체는 대체로 자연스럽지만, 첫 문장은 한국어로 다소 우회적입니다. ‘이와 같이 … 먹도록 기록되고 제정되었습니다’로 하면 원문의 선언적 규정 문체가 자연스럽게 살아납니다.
  terminology: ‘성소’, ‘장막’, ‘유월절’은 적절합니다. 신명 호칭은 본문 안에서 ‘주의/주님’으로 혼용하지 않고 ‘주님’으로 통일하는 것이 좋습니다.
