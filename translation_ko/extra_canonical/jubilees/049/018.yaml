revisions:
- from: 이렇게 기록되고 제정된 것은 그들이 그것을 주의 성소에서 먹게 하려는 것입니다. 그리고 이스라엘 자손이 차지할 땅, 곧 가나안 땅에 들어가서, 그 땅 한가운데 자기 지파들 가운데에 주님의 장막을 세우고, 주님의 성소가 그 땅에 세워질 때까지는, 그들이 와서 주님의 장막 한가운데서 유월절을 지키고, 주님 앞에서 그것을 잡아야 합니다.
  to: 이와 같이 그들이 그것을 주님의 성소에서 먹도록 기록되고 제정되었습니다. 이스라엘 자손이 차지하게 될 땅, 곧 가나안 땅에 들어가 그 땅 한가운데, 그들의 지파들 가운데 하나에 주님의 장막을 세우고, 주님의 성소가 그 땅에 세워질 때까지 그들이 와서 주님의 장막 한가운데에서 유월절을 지키며, 주님 앞에서 그것을 잡아야 합니다.
  rationale: 기록·제정된 규정이라는 원문의 서술을 목적론적 표현 없이 직역적이면서도 자연스러운 합쇼체로 정리했습니다. 또한 장막의 위치를 ‘지파들 가운데 하나’로 명시하고, ‘주님’으로 신명 호칭을 통일했습니다. 장막이 먼저 세워지고 성소가 건립될 때까지 그곳에서 유월절을 지키는 시간적 구조와 ‘그것’을 잡는 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:18Z'
