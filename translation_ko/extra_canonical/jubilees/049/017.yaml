  lexicon: 하나님
  rationale: 문맥상 집단적 소유격이지만, 한국어에서는 예배적·공적 문장에서 ‘당신의 하나님’이 더 자연스럽고 원문의 대상을 분명히 드러냅니다.
- source_word: ዘእም*፳ዓመት፡ ወላዕለ፡
