  - 성전
  lexicon: 집
  rationale: 영어 POB의 ‘house of the sanctuary’를 반영해 ‘집’의 이미지를 살리고, 앞뒤 문맥을 이어 주기 위해 설명적 동격으로 처리했습니다.
- source_word: ለአምላክክሙ፡
  english_pob_choice: your God
  chosen_korean: 당신의 하나님
