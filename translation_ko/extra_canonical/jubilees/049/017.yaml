  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: ko
  text: 온 이스라엘은 정해진 때에 그것을 지켜야 합니다. 그리고 그 날에 오는 모든 사람은 하나님의 집, 곧 당신의 하나님 앞에서 그 제물을 먹어야 합니다. 그것은 스무 살 이상인 자에게 해당합니다. 왜냐하면[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሮሙ፡ ለእስራኤል፡ ይገበርዎ፡ በጊዜሁ።
  english_pob_choice: All of Israel shall observe it at its appointed time.
  chosen_korean: 온 이스라엘은 정해진 때에 그것을 지켜야 합니다.
  alternatives_korean:
  - 이스라엘의 모든 사람은 그것을 정해진 때에 지켜야 합니다.
  - 온 이스라엘은 그 정한 때에 그것을 행해야 합니다.
  lexicon: 지키다
  rationale: 여기서 ይገበርዎ는 단순한 ‘행하다’보다 규정된 절기를 준수하는 뜻이 강해, POB의 observe에 맞춰 ‘지키다’로 옮겼습니다.
- source_word: ቤተ፡ መቅደሱ፡
  english_pob_choice: the house of the sanctuary
  chosen_korean: 하나님의 집, 곧
  alternatives_korean:
