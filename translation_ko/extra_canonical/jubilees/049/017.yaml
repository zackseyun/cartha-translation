  text: 온 이스라엘은 정해진 때에 그것을 지켜야 합니다. 그리고 그 날에 오는 모든 사람, 곧 스무 살 이상인 사람은 너희 하나님의 성소의 집에서 주님 앞에 그것을 먹어야 합니다. 왜냐하면[a]
