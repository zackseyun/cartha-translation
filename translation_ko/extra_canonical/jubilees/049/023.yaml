  text: before the LORD, upon the altar of your God. For you observed this feast in haste when you came out from Egypt until you entered the wilderness of Shur, because at the shore of the sea you completed it.
translation:
  language: ko
  text: 주님 앞에서, 여러분의 하나님 제단 위에서. 이는 여러분이 이집트에서 나와 수르 광야에 들어갈 때까지 이 절기를 서둘러 지켰고, 바닷가에서 그 절기를 마쳤기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: before the LORD
  english_pob_choice: before the LORD
  chosen_korean: 주님의 제단 곁에서입니다
  alternatives_korean:
  - 주님 앞에서
  - 야훼 앞에서
  lexicon: LORD
  rationale: 게에즈 원문은 ‘하나님 앞/주 앞’의 위치 표현과 ‘제단 위’라는 공간 표지를 함께 가지므로, 한국어에서는 제단의 위치를 살리되 예배 행위의 방향성을 드러내는 표현으로 옮겼습니다.
- source_word: upon the altar of your God
  english_pob_choice: upon the altar of your God
  chosen_korean: 여러분의 하나님께서 정하신 절기
  alternatives_korean:
  - 여러분의 하나님 제단 위에서
  - 여러분의 하나님 제단에
  lexicon: altar / God
  rationale: 원문은 제단 관련 표지를 포함하지만, 이 절의 핵심은 절기의 준수와 그 기억이므로 한국어에서는 문맥상 자연스럽게 ‘여러분의 하나님’과 연결해 예배 맥락을 분명히 했습니다.
- source_word: in haste
  english_pob_choice: in haste
  chosen_korean: 서둘러
  alternatives_korean:
  - 급히
  - 다급하게
  lexicon: haste
  rationale: 출애굽의 긴박함을 나타내는 핵심 부사이므로, 현대 표준어에서 자연스럽고 간결한 ‘서둘러’를 선택했습니다.
- source_word: wilderness of Shur
  english_pob_choice: wilderness of Shur
  chosen_korean: 수르 광야
  alternatives_korean:
  - 수르의 광야
  - 수르 사막
  lexicon: Shur
  rationale: 고유 지명은 현대 외래어 표기 관행에 따라 ‘수르’로 옮기고, המקרא적 지리 표현은 ‘광야’로 유지했습니다.
theological_decisions:
- issue: ‘the LORD’의 표기
  chosen_reading: 이 절에서는 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 본문의 영어 POB는 대문자 LORD를 사용하지만, 여기서는 제단과 절기라는 예배 문맥을 살려 한국어 독자에게 가장 직접적인 경배 대상을 드러내는 표준 경어형을 채택했습니다.
  doctrine_reference: 예배 언어의 직역성과 가독성 사이의 균형
- issue: 절기 준수의 시간적 범위
  chosen_reading: 이집트에서 나온 때부터 수르 광야에 들어가기까지의 출애굽 여정을 하나의 연속된 기억으로 제시했습니다.
  alternative_readings:
  - 바다 해변에서 끝냈다
  - 홍해 언저리에서 완성했다
  rationale: 원문은 ‘바다의 해변에서 그것을 완성했다’는 종결 표현으로 절기의 이행을 출애굽 여정의 특정 지점에 연결하므로, 그 연결성을 유지해 옮겼습니다.
  doctrine_reference: 출애굽 기억과 절기 전승의 연속성
