  language: ko
  text: 밤에, 곧 열다섯째 날 저녁, 해가 질 무렵이었습니다. 그 밤에는 절기의 시작과 즐거움의 시작이 있었습니다. 여러분은 이집트에 머물며 유월절 고기를 먹고 있었고, 마스테마의 모든 권세는 이집트 땅의 모든 처음 난 것을 치려고 보내졌습니다. 바로 파라오의 처음 난 것에서부터 맷돌집에 있던 사로잡힌 여종의 처음 난 것과 가축에 이르기까지였습니다. 하나님께서 그들에게 주신 표는 이러했습니다. 문설주에 일 년 된 어린양의 피를 본 집마다 그들은 그 집에 들어가 죽이지 않고, 그 집 위를 넘어 지나가서 집 안에 있는 모든 사람이 구원을 받게 해야 했습니다. 이는 피의 표가 그 집 문설주에 있었기 때문입니다. 주님의 권세들은 주님께서 명령하신 대로 모든 것을 행했고, 이스라엘의 모든 자손 위로는 넘어갔으며, 가축에서 사람에 이르기까지, 심지어 개에게까지 그들 가운데서 어떤 생명도 멸하려고 재앙이 닥치지 않았습니다. 이집트의 재앙은 매우 컸고, 이집트에는 죽은 사람이 하나도 없는 집이 없었으며, 통곡과 애곡이 있었습니다. 그러나 온 이스라엘은 유월절 고기를 먹고 포도주를 마시며 주님, 곧 그들의 조상의 하나님을 찬양하고 복을 빌며 감사를 드리면서 거하였고, 이집트의 멍에와 악한 종살이에서 나갈 준비가 되어 있었습니다. 또한 여러분도 이 날을 평생 동안 기억하고, 해마다 평생 동안 그 날에 맞추어, 그 모든 율법에 따라 매년 한 번씩 지키십시오. 그리고 그 날을 날에서 날로, 달에서 달로 옮기지 마십시오. 이는 영원한 규례이며, 하늘의 돌판들에 이스라엘의 모든 자손을 위해 기록되고 명령된 것이어서, 그들이 모든 세대에 걸쳐 해마다, 곧 그 날에, 매년 한 번씩 지키게 하려는 것입니다. 이 날은 끝이 없는 날들이 있기 때문입니다. 이것은 영원히 명령된 것입니다. 그리고 깨끗하고 그것을 지키러 그 날에 오는 사람이, 주님 앞에 받아들여질 제물을 드리고 절기 날에 주님 앞에서 먹고 마시러 오는 사람이라면 — 그 사람이 깨끗하고 가까이 있음에도, 정해진 때에 주님의 제물을
    가져오지 않았기 때문에, 그는 끊어질 것입니다. 그는 자기 죄를 짊어질 것입니다. 그러므로 이스라엘의 자손은 와서 첫째 달 열나흗날, 두 저녁 사이에, 낮의 중간에서 밤의 셋째 부분까지, 정해진 때에 유월절을 지켜야 합니다. 낮의 두 부분은 빛에 주어지고, 한 부분은 저녁에 속하기 때문입니다. 이것이 주님께서 여러분에게 저녁 한가운데 지키라고 명령하신 것입니다. 그리고 그것은 빛이 있는 어떤 때에도, 오직 저녁 때에만 잡아서는 안 되며, 그들은 저녁 때에 밤의 셋째 부분까지 그것을 먹어야 합니다. 그리고 밤의 셋째 부분 뒤에 남는 모든 고기는 불로 태워야 합니다. 그들은 그것을 날것으로도 먹어서는 안 되고, 물에 삶아서도 먹어서는 안 되며, 불에 구워 먹어야 합니다. 머리와 내장과 발까지도 불에 굽고, 그것의 뼈를 하나도 꺾어서는 안 됩니다. 이스라엘의 자손 가운데 어떤 뼈도 부서져서는 안 되기 때문입니다. 이 때문에 주님께서는 이스라엘의 자손에게 유월절을 정해진 때에 지키라고 명령하셨고, 그것은 절기의 날이며 명령된 날이기 때문에 그에게서 어떤 뼈도 꺾어지지 않아야 합니다. 또한 그것을 날에서 날로, 달에서 달로 옮겨서는 안 되며, 절기의 날에 지켜야 합니다. 그리고 당신은 이스라엘의 자손에게 명령하여, 해마다 그 정해진 때에 유월절을 지키게 하십시오. 그러면 그것은 주님 앞에 기쁘게 받아들여질 기념이 될 것이며, 그들이 유월절을 지키는 그 해에는 도살이나 징벌을 위한 재앙이 그들에게 닥치지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሌሊት፡ አመ፡ ምሴት፡ ዘዐሡር፡ ወሐሙስ፡
  english_pob_choice: In the night, at the evening of the fifteenth, from the setting of the sun.
  chosen_korean: 밤에, 곧 열다섯째 날 저녁, 해가 질 무렵
  alternatives_korean:
  - 열다섯째 날 저녁에
  - 해 질 무렵, 곧 열다섯째 날
  lexicon: source phrase
  rationale: 밤, 저녁, 해가 질 무렵의 세 요소를 모두 살려 시작 시점과 시간대를 함께 드러냈습니다.
- source_word: ጳስካ
  english_pob_choice: Passover
  chosen_korean: 유월절
  alternatives_korean:
  - 파스카
  - 과월절
  lexicon: source phrase
  rationale: 한국어 성경에서 널리 통용되는 절기명은 유월절이며, 문맥상 제의적 절기로 직접 대응됩니다.
- source_word: ውሉደ፡ እስራኤል
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘의 자손
  alternatives_korean:
  - 이스라엘 자손
  - 이스라엘의 아들들
  lexicon: source phrase
  rationale: 집합적 후손 개념을 자연스럽게 살리면서도 남성 편중을 과도하게 강화하지 않는 표현으로 옮겼습니다.
- source_word: ወይሠረው
  english_pob_choice: shall be cut off
  chosen_korean: 끊어질 것입니다
  alternatives_korean:
  - 제외될 것입니다
  - 끊어집니다
  lexicon: source phrase
  rationale: 해당 법적 제재는 단순한 무시가 아니라 공동체로부터의 절단/제거를 뜻하므로, POB의 ‘cut off’에 맞추어 옮겼습니다.
- source_word: እስመ፡ ክልኤ፡ መክፈልታ፡ ለዕለት፡ ትውሀብ፡ ለብርሃን፡ ወሣልስ፡ እምሴት፡
  english_pob_choice: for two parts of the day are given to the light, and a third part belongs to the evening.
  chosen_korean: 낮의 두 부분은 빛에 주어지고, 한 부분은 저녁에 속하기 때문입니다
  alternatives_korean:
  - 낮의 두 몫은 빛에 주어지고, 한 몫은 저녁에 속하기 때문입니다
  - 하루의 두 부분은 빛에 주어지고, 세 번째는 저녁에 속하기 때문입니다
  lexicon: source phrase
  rationale: 날짜 계산 설명을 직역하지 않고 의미를 보존하되, 저녁과 빛의 대비가 분명히 드러나도록 했습니다.
- source_word: ጽላተ፡ ሰማይ
  english_pob_choice: heavenly tablets
  chosen_korean: 하늘의 돌판들
  alternatives_korean:
  - 하늘의 판들
  - 하늘의 돌판
  lexicon: source phrase
  rationale: 제2성전 문헌의 고유한 표상을 살리되, 하늘에 있는 석판이라는 이미지가 드러나게 했습니다.
theological_decisions:
- issue: 마스테마와 주님의 권세들의 병렬 표현
  chosen_reading: 마스테마의 모든 권세와 주님의 권세들을 각각 독립된 행위 주체로 유지했습니다.
  alternative_readings:
  - 마스테마의 악한 세력으로 통일
  - 주님의 천사들로 해석하여 단순화
  rationale: 본문은 출애굽 사건을 두 상반된 권세의 대립으로 제시하므로, 그 긴장을 희석하지 않고 보존했습니다.
  doctrine_reference: 제2성전기 유대교의 악의 권세/천사적 대리 개념
- issue: ‘컷 오프’ 법정 제재의 강도
  chosen_reading: ‘끊어질 것입니다’로 옮겨 공동체적·언약적 제재를 드러냈습니다.
  alternative_readings:
  - 죽게 될 것입니다
  - 제외될 것입니다
  rationale: 원문은 단순한 처벌보다 언약 공동체에서의 절단을 나타내므로, 강도를 살리되 형벌 내용을 과도하게 특정하지 않았습니다.
  doctrine_reference: 언약 제재와 성결 규정
