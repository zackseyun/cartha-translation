translation:
  language: ko
  text: 해마다 그렇게 합니다. 그리고 집이 야훼의 이름으로 그들의 기업의 땅에 세워질 날들이 되면, 거기서 그들은 저녁, 해가 질 무렵에 유월절을 잡아 바칠 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሔር፡ እምዓመት፡ በ*ዓመት።
  english_pob_choice: from year to year.
  chosen_korean: 해마다 그렇게 합니다.
  alternatives_korean:
  - 해마다
  - 매년 반복하여
  lexicon: from year to year
  rationale: 반복적 주기를 자연스럽게 드러내는 관용 표현으로 옮겼습니다. 본문은 계속되는 연례 관습을 말하므로 단순한 '매년'보다 문맥상 조금 더 서술적인 표현이 적절합니다.
- source_word: በስመ፡ እግዚአብሔር፡
  english_pob_choice: in the name of the LORD
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 주님의 이름으로
  - 여호와의 이름으로
  lexicon: in the name of the LORD
  rationale: 직접적 원문 대응을 위해 하나님의 이름 표지는 프로젝트 기본값인 '야훼'를 사용했습니다. '여호와'는 전통적이지만 이 판본의 소스-직결 표준과 맞지 않습니다.
- source_word: ይጥብሑ፡ ጳስካ፡
  english_pob_choice: slaughter the Passover
  chosen_korean: 유월절을 잡아 바칠 것입니다
  alternatives_korean:
  - 유월절을 잡을 것입니다
  - 유월절을 도살할 것입니다
  lexicon: slaughter the Passover
  rationale: 짐승을 도살하는 행위를 단순한 '잡다'로만 두면 제의적 의미가 약해지므로, 동작의 폭력성과 제의성을 함께 살려 '잡아 바치다'로 옮겼습니다. '도살하다'는 지나치게 비의례적일 수 있어 덜 적합합니다.
- source_word: እንዘ፡ የዐርብ፡ ፀሐይ፡
  english_pob_choice: at sunset
  chosen_korean: 해가 질 무렵
  alternatives_korean:
  - 일몰에
  - 해질 무렵
  lexicon: at sunset
  rationale: 원문의 해가 기울고 지는 시점을 자연스럽고 격식 있게 살렸습니다. '해가 질 무렵'은 시간 감각을 보존하면서도 현대 한국어에서 읽기 자연스럽습니다.
theological_decisions:
- issue: 야훼의 이름 표기
  chosen_reading: 본문의 LORD를 프로젝트 기본값에 따라 '야훼'로 옮겼습니다.
  alternative_readings:
  - 주
  - 주님
  - 여호와
  rationale: 이 번역은 독자가 원문에서 신명 표지가 실제로 드러나는 지점을 식별하도록 하는 것을 우선합니다. 따라서 관습적 교회어보다 स्रोत 직결 표기를 택했습니다.
  doctrine_reference: 천명/신명 표기 정책
