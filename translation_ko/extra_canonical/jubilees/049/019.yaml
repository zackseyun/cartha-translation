  verdict: revise
  source_fidelity: 개정이 필요합니다. 게에즈어 ህየ፡ የሐሩ፡ ወይጥብሑ는 ‘그곳으로 가서 ... 잡다’라는 이동 동사와 도살 동사를 모두 포함하는데, 초안은 ‘가서’를 빠뜨렸습니다. 또한 ይጥብሑ는 ‘잡다/도살하다’이지 ‘바치다’가 명시된 것은 아니므로, ‘바치다’를 제거하는 것이 안전합니다.
  naturalness: ‘집이 … 세워질 날들이 되면’은 현대 한국어로 다소 부자연스럽습니다. ‘성전이 … 세워지는 날들에는’으로 옮기면 문맥과 문체가 자연스럽습니다. 절 첫머리의 단편적 ‘from year to year’는 원문의 연결을 보존하여 ‘해마다.’로 유지할 수 있습니다.
  terminology: ‘야훼’, ‘기업의 땅’, ‘유월절’은 일관되고 적절합니다. ‘house’는 이 문맥에서 예배 처소를 가리키므로 ‘성전’이 자연스럽습니다. ‘유월절 제물’은 유월절을 잡는다는 제의적 환유를 한국어에서 명료하게 전달하되, 원문에 없는 봉헌 행위를 더하지 않습니다.
