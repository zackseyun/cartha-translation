  - severity: medium
    issue: ‘잡아 바칠 것입니다’의 의미 추가
    rationale: 원문은 유월절을 ‘잡다/도살하다’라고 할 뿐 ‘바치다’를 명시하지 않습니다. 제의 문맥을 근거로 봉헌 행위를 본문에 추가하지 않는 편이 정확합니다.
