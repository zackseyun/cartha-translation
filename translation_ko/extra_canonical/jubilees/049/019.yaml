translation:
  language: ko
  text: 해마다. 그리고 야훼의 이름으로 그들의 기업의 땅에 성전이 세워지는 날들에는, 그들은 그곳으로 가서 저녁, 해가 질 무렵에 유월절 제물을 잡을 것입니다.
