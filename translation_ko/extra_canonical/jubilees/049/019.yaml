- from: 해마다 그렇게 합니다. 그리고 집이 야훼의 이름으로 그들의 기업의 땅에 세워질 날들이 되면, 거기서 그들은 저녁, 해가 질 무렵에 유월절을 잡아 바칠 것입니다.[a]
  to: 해마다. 그리고 야훼의 이름으로 그들의 기업의 땅에 성전이 세워지는 날들에는, 그들은 그곳으로 가서 저녁, 해가 질 무렵에 유월절 제물을 잡을 것입니다.
