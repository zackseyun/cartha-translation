base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
  footnotes:
  - marker: a
    text: Or 'the feast.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너, 모세여, 이스라엘 자손에게 네게 명령된 대로 유월절 규례를 지키라고 명하여라. 해마다, 날마다, 또 무교절에 관하여 그들에게 일러라. 그들이 이레 동안 무교병을 먹고 그 절기를 지키며, 그 기쁨의 이레 동안 날마다 제물을 드리게 하여라.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  english_pob_choice: the ordinance of the Passover
  chosen_korean: 유월절 규례
  alternatives_korean:
  - 유월절의 규정
  - 유월절 절기 규례
  lexicon: 규례
  rationale: Ge'ez의 '질서/규정' 계열 표현을 한국어 성경 문맥에 자연스럽게 옮기되, 단순한 절기 자체보다 지켜야 할 규범성을 살려 '규례'를 택했습니다.
- source_word: ይዕቀቡ
  english_pob_choice: keep
  chosen_korean: 지키라고
  alternatives_korean:
  - 준수하라고
  - 간직하라고
  lexicon: 지키다
  rationale: 명령문으로서 규정과 절기를 실제로 준수한다는 뜻이므로, 한국어에서 가장 직접적인 '지키다'를 사용했습니다.
- source_word: ፍአት / ፍሥሓ
  english_pob_choice: the feast of unleavened bread / seven days of rejoicing
  chosen_korean: 무교절 / 기쁨의 이레
  alternatives_korean:
  - 무교절 / 즐거움의 이레
  - 무교절 / 환희의 이레
  lexicon: 무교절; 기쁨
  rationale: English audit의 최종 수정과 달리, Ge'ez의 ፍሥሓ는 '기쁨, 즐거움, 환희'의 뜻이어서 '기쁨의 이레'로 옮겨 절기의 성격을 보존했습니다.
- source_word: ቍርባኖ
  english_pob_choice: their offering
  chosen_korean: 그들의 제물
  alternatives_korean:
  - 그들의 헌물
  - 그들의 예물
  lexicon: 제물
  rationale: 문맥상 절기 동안 날마다 드리는 제의적 봉헌을 가리키므로, 성경 한국어에서 제의적 맥락을 가장 분명히 드러내는 '제물'을 택했습니다.
theological_decisions:
- issue: 무교절 기간의 성격과 마지막 구절의 번역
  chosen_reading: 마지막을 '기쁨의 이레'로 옮겨, 단순한 절기명 반복이 아니라 절기 기간의 정서적·예배적 성격을 드러냈습니다.
  alternative_readings:
  - '''절기의 이레'''
  - '''즐거움의 이레'''
  rationale: 게에즈 원문은 ፍሥሓ(기쁨/즐거움)를 사용하므로, 이를 '절기'로 바꾸면 의미가 약화됩니다. English audit의 잘못된 'feast' 수정도 따르지 않았습니다.
  doctrine_reference: 텍스트 의미 보존 원칙
