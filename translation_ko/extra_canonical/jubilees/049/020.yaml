  text: in the third part of the day. And they shall bring its blood to the base of the altar, and they shall place its fat on the fire that is upon the altar, and they shall eat its flesh roasted with fire in the court of the house
translation:
  language: ko
  text: 그리고 날의 세 번째 부분에. 그들은 그 피를 제단의 바닥으로 가져오고, 그 기름을 제단 위에 있는 불에 올려놓으며, 그 고기를 불에 구워 집의 뜰에서 먹어야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በ*ሣልስቲ፡ ለዕለት።
  english_pob_choice: in the third part of the day
  chosen_korean: 날의 세 번째 부분에
  alternatives_korean:
  - 하루의 세 번째 부분에
  - 제삼시에
  lexicon: source temporal expression
  rationale: 게으름 없이 직역하되, 현대 한국어에서 자연스러운 시간 표현으로 옮겼습니다. 전통적 단일 시각으로 좁히지 않고 원문의 분절된 시간 개념을 살렸습니다.
- source_word: ወያዐርጉ፡ ደሞ፡ ውስተ፡ ምካይዳ፡ ለምሥዋዕ።
  english_pob_choice: And they shall bring its blood to the base of the altar
  chosen_korean: 그들은 그 피를 제단의 바닥으로 가져오고
  alternatives_korean:
  - 그 피를 제단 아래로 가져오고
  - 그 피를 제단 밑바닥으로 가져오고
  lexicon: bring ... to the base of the altar
  rationale: 영문 POB의 수정된 ‘base of the altar’를 반영해 제단의 아래쪽 기초부를 분명히 했습니다. ‘바닥’은 한국어로 자연스럽고, ‘threshold’ 같은 오해를 피합니다.
- source_word: ወሥብሖ፡ ይነብሩ፡ ዲበ፡ እሳት፡ ዘላዕለ፡ ምሥዋዕ።
  english_pob_choice: and they shall place its fat on the fire that is upon the altar
  chosen_korean: 그 기름을 제단 위에 있는 불에 올려놓으며
  alternatives_korean:
  - 그 기름을 제단 위의 불 위에 두며
  - 그 기름을 제단 위 불에 올려놓으며
  lexicon: fat / fire upon the altar
  rationale: 게즈 원문의 ‘지방/기름’에 해당하는 부분을 ‘기름’으로 옮겨 제사 규례 문맥을 유지했습니다. ‘제단 위에 있는 불’은 원문의 ‘제단 위의 불’을 자연스럽게 풀어 쓴 표현입니다.
- source_word: ወይብልዑ፡ ሥጋሁ፡ ጥቡሰ፡ በእሳት፡ በውስተ፡ ዐጸደ፡ ቤት፡
  english_pob_choice: and they shall eat its flesh roasted with fire in the court of the house
  chosen_korean: 그 고기를 불에 구워 집의 뜰에서 먹어야 합니다.
  alternatives_korean:
  - 그 살을 불에 구워 집의 뜰에서 먹어야 합니다.
  - 그 고기를 불에 익혀 집의 뜰에서 먹어야 합니다.
  lexicon: flesh / roasted with fire / court of the house
  rationale: 의식 규정의 문맥에서 ‘flesh’는 음식이 된 고기를 가리키므로 한국어는 자연스러운 ‘고기’를 택했습니다. ‘집의 뜰’은 성전/성소의 뜰을 가리키는 표현을 과도하게 특정하지 않고 원문을 보존합니다.
