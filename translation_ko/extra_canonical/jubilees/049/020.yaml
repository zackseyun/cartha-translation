revisions:
- from: 그리고 날의 세 번째 부분에. 그들은 그 피를 제단의 바닥으로 가져오고, 그 기름을 제단 위에 있는 불에 올려놓으며, 그 고기를 불에 구워 집의 뜰에서 먹어야 합니다.
  to: 하루의 세 번째 부분에 그들은 그 피를 제단 밑에 가져오고, 그 기름을 제단 위에 있는 불에 올려놓으며, 그 고기를 불에 구워 집의 뜰에서 먹어야 합니다.
  rationale: 시간구를 뒤따르는 절과 결합하여 한국어의 완결된 문장으로 만들었고, ‘제단의 바닥’을 ‘제단 밑에’로 고쳐 제단 기부를 뜻하는 원문의 공간 관계를 분명히 했습니다. 그 밖의 제의 용어와 ‘집의 뜰’이라는 비특정적 표현은 유지했습니다.
