revisions:
- from: 그리고 내 형제 야곱, 나는 모든 육체보다 그를 더 사랑합니다. 온 천하에 그 외에는 내 형제가 없습니다. 내가 그를 사랑하는 것이 나에게 큰 일이 아니니 그는 내 형제임이라 우리가 함께 네 태에 뿌려졌고 우리가 함께 네 배에서 나왔음이니라 내가 내 형제를 사랑하지 않으면 누구를 사랑하겠습니까?
  to: 그리고 내 형제 야곱을 저는 그 누구보다도 더 사랑합니다. 온 땅에 그 한 사람 외에는 제게 형제가 없습니다. 제가 그를 사랑하는 것이 어찌 대단한 일이겠습니까? 그는 제 형제입니다. 우리는 함께 어머니의 태에 심겨졌고, 함께 어머니의 몸에서 나왔습니다. 제가 제 형제를 사랑하지 않는다면 누구를 사랑하겠습니까?
  rationale: 원문의 반복되는 ‘형제’ 강조와 ‘함께 태에 심겨지고 함께 나왔다’는 출생 비유를 유지하되, 현대 한국어 합쇼체로 자연화했습니다. ‘네’는 화자인 에서가 어머니 리브가에게 직접 말하는 문맥을 반영하여 존대 호칭 ‘어머니’로 풀어, 한국어 대화의 자연스러움을 높였습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:31Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미와 형제 관계, 공동 출생의 근거, 수사적 질문은 대체로 충실합니다. 다만 ‘모든 육체보다’는 원문의 ‘all flesh’를 한국어에서 지나치게 직역하여 의미가 불투명하며, ‘큰 일이 아니니’도 원문의 관용적 수사성을 충분히 살리지 못합니다.
  naturalness: 현대 표준 한국어 합쇼체로 다듬을 필요가 있습니다. 특히 ‘임이라’, ‘나왔음이니라’는 요청된 현대 격식체보다 고어적입니다.
  terminology: ‘형제’와 ‘태’는 문맥에 적절합니다. ‘all flesh’는 여기서 사람들/혈육 전체와의 비교라는 뜻이므로 ‘그 누구보다도’로 자연스럽게 옮깁니다. ‘sown’의 비유는 ‘태에 함께 심겨’로 보존합니다.
  issues:
  - severity: medium
    issue: ‘모든 육체보다’라는 직역
    rationale: 한국어에서 사람을 가리키는 표현으로 자연스럽지 않고 비교 대상이 불명확합니다.
  - severity: medium
    issue: 고어적 종결과 다소 부자연스러운 수사 표현
    rationale: ‘임이라’, ‘나왔음이니라’, ‘큰 일이 아니니’는 현대 formal-polite 합쇼체 및 원문의 질문형 강조에 맞지 않습니다.
