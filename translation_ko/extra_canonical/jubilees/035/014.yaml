  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
  footnotes:
  - marker: a
    text: Or 'uprooted from the earth and those who will be destroyed from under heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제 내 마음은 그의 모든 행위 때문에 괴롭습니다. 그와 그의 씨도 구원을 받지 못할 것입니다. 이는 그들이 땅에서 멸망당하고 하늘 아래에서 뽑혀 나갈 자들이기 때문입니다. 그는 아브라함의 하나님을 버리고 그의 아내들을 따라가고 또…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ፡ ልብየ፡ ይትሀወክ፡
  english_pob_choice: And now my heart is troubled
  chosen_korean: 그리고 이제 내 마음은 괴롭습니다
  alternatives_korean:
  - 그리고 이제 내 마음이 동요합니다
  - 그리고 지금 내 심정이 괴롭습니다
  lexicon: heart → 마음; troubled → 괴롭습니다
  rationale: 지속되는 내적 고통을 자연스럽게 살리면서도, 원문의 ‘마음’ 표현을 유지해 직역성을 보존했습니다.
- source_word: ሊድኅን፡
  english_pob_choice: will be saved
  chosen_korean: 구원을 받지 못할 것입니다
  alternatives_korean:
  - 구원받지 못할 것입니다
  - 살아남지 못할 것입니다
  lexicon: save → 구원하다
  rationale: 문맥상 단순 생존보다 멸망/심판 대비의 구원 부정이어서 ‘구원을 받다’로 옮겼습니다.
- source_word: ይትሐጐሉ፡ / ይሤረዉ፡
  english_pob_choice: will be destroyed from the earth and those who will be uprooted from under heaven
  chosen_korean: 땅에서 멸망당하고 하늘 아래에서 뽑혀 나갈 자들
  alternatives_korean:
  - 땅에서 파멸되고 하늘 아래에서 뿌리째 뽑힐 자들
  - 땅에서 멸절되고 하늘 아래에서 뽑혀 나갈 자들
  lexicon: destroyed → 멸망당하다; uprooted → 뽑혀 나가다
  rationale: 게에즈 본문에 따라 ‘멸망’과 ‘뽑히다’의 두 동사를 구분해, 영어 초벌본의 동사 전도 문제를 반영하지 않고 원문 질서를 살렸습니다.
- source_word: ኀደገ፡ ወሖረ፡ ድኅረ፡ አንስቲያሁ፡
  english_pob_choice: because he has forsaken the God of Abraham and gone after his wives and after
  chosen_korean: 그는 아브라함의 하나님을 버리고 그의 아내들을 따라가고 또…
  alternatives_korean:
  - 그는 아브라함의 하나님을 버리고 그의 아내들을 따라갔기 때문입니다
  - 그가 아브라함의 하나님을 버리고 그의 아내들을 따라갔기 때문입니다
  lexicon: forsaken → 버리다; gone after → 따라가다
  rationale: 문장이 게에즈 원문처럼 미완으로 끝나므로 한국어도 종결을 닫지 않고 말줄임표로 열어 두었습니다.
theological_decisions:
- issue: 심판 표현의 강도와 구원 부정
  chosen_reading: ‘구원을 받지 못할 것입니다’와 ‘땅에서 멸망당하고 하늘 아래에서 뽑혀 나갈 자들’로, 대상의 운명을 강하게 심판 언어로 드러냈습니다.
  alternative_readings:
  - ‘살아남지 못할 것입니다’
  - ‘땅에서 끊어질 것입니다’
  rationale: 본문은 단순한 실패가 아니라 하나님 앞에서의 멸망과 추방을 말하므로, 약화된 완곡어보다 원문의 경고성을 살렸습니다.
  doctrine_reference: 심판과 언약적 배제의 진술은 창세기적 저주/멸망 언어와 연결됩니다.
