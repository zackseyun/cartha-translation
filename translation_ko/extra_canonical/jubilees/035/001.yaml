  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: ko
  text: 첫째 주의 첫째 해, 마흔다섯째 희년이었을 때 리브가가 자기 아들 야곱을 불러 그의 아버지와 그의 형에 관하여 그를 가르치며, 평생 그들 모두를 공경해야 한다고 일러주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመት / year; ዘሱባዔ / of the week
  english_pob_choice: in the first year of the first week
  chosen_korean: 첫째 주의 첫째 해
  alternatives_korean:
  - 첫 번째 주의 첫 번째 해
  - 첫째 주의 첫째 연도
  lexicon: 연/주
  rationale: 원문의 시간표현을 직역하되, 한국어에서 자연스러운 연대기 구조로 압축해 뜻을 유지했습니다.
- source_word: ኢዮቤልው / jubilee
  english_pob_choice: forty-fifth jubilee
  chosen_korean: 마흔다섯째 희년
  alternatives_korean:
  - 마흔다섯째 희년
  - 45번째 희년
  lexicon: 희년
  rationale: Jubilees의 고유한 계산 단위를 드러내기 위해 ‘희년’을 유지했습니다.
- source_word: ጸውዐቶ / called her son
  english_pob_choice: Rebekah called Jacob her son
  chosen_korean: 리브가가 자기 아들 야곱을 불러
  alternatives_korean:
  - 리브가가 자기 아들 야곱을 불러
  - 리브가가 아들 야곱을 불러
  lexicon: 부르다
  rationale: 호명 동작을 분명히 살리기 위해 ‘불러’로 옮겼고, 소유관계는 ‘자기 아들’로 명시했습니다.
- source_word: ወአዘዘቶ ... ከመ፡ ያክብሮሙ፡ ኵሎ / instructed him ... that he should honor them all
  english_pob_choice: instructed him concerning his father and concerning his brother, that he should honor them all the days of his life
  chosen_korean: 그의 아버지와 그의 형에 관하여 그를 가르치며, 평생 그들 모두를 공경해야 한다고 일러주었습니다
  alternatives_korean:
  - 그의 아버지와 그의 형에 관하여 그를 가르치며, 평생 그들 모두를 공경해야 한다고 일러주었습니다
  - 그의 아버지와 그의 형을 두고 그에게 명하며, 살아 있는 모든 날에 그들을 존중하라고 말했습니다
  lexicon: 가르치다 / 일러주다 / 공경하다
  rationale: 원문의 ‘명령/지시’ 성격과 존중의 윤리성을 함께 살리기 위해 ‘가르치며, 일러주었습니다’와 ‘공경하다’를 조합했습니다.
theological_decisions:
- issue: 아버지와 형에 대한 의무의 강도
  chosen_reading: ‘공경해야 한다’로 번역해 단순한 예의가 아니라 평생 지속되는 도덕적 의무를 드러냈습니다.
  alternative_readings:
  - 존중해야 한다
  - 귀하게 여겨야 한다
  rationale: POB 영어의 ‘honor’는 관계적 예의보다 더 강한 윤리적 책임을 뜻하므로, 한국어에서도 그 강도를 유지했습니다.
  doctrine_reference: 가정윤리/경외의 의무
