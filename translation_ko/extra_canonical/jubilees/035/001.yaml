revisions:
- from: 첫째 주의 첫째 해, 마흔다섯째 희년이었을 때 리브가가 자기 아들 야곱을 불러 그의 아버지와 그의 형에 관하여 그를 가르치며, 평생 그들 모두를 공경해야 한다고 일러주었습니다.
  to: 마흔다섯째 희년의 첫째 주 첫째 해에 리브가가 자기 아들 야곱을 불러, 그의 아버지와 그의 형제에 관하여 평생 그들 모두를 공경하라고 일러 주었습니다.
  rationale: 원문의 시간 순서를 한국어에 자연스럽게 재배열하고, ‘형’을 원문의 폭을 보존하는 ‘형제’로 고쳤습니다. 또한 중복된 지시 표현을 정리하되, 아버지와 형제를 평생 공경하라는 명령의 의미와 강도는 유지했습니다.
