base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/007.yaml
  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: ko
  text: “보십시오, 저는 제가 살아야 할 제 삶의 모든 날을 마쳤습니다.” 그리고 야곱은 어머니의 말 때문에 웃었습니다. 어머니는 그에게 자신이 죽을 것이라고 말했지만, 여전히 그의 맞은편에 있었고, 그녀의 힘이 그대로 있었으며, 힘이 약해지지 않았습니다. 왜냐하면 그녀는 들고 나고 보았기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አነ፡ ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ፡ ዘሀሎኩ፡ እሕየው።
  english_pob_choice: I have completed all the days of my life that I was to live
  chosen_korean: 제가 살아야 할 제 삶의 모든 날을 마쳤습니다
  alternatives_korean:
  - 제가 살 날들을 모두 마쳤습니다
  - 살아야 할 제 날들을 다 보냈습니다
  lexicon: 완료 표현 + 생애 기간
  rationale: Geez 원문은 ‘내가 살아온/살아야 할 삶의 날들’을 완료했다고 말하므로, 단순한 ‘살 날’보다 ‘살아야 할 제 삶의 모든 날’을 택해 기간의 완결을 분명히 했습니다.
- source_word: ወኀይላ፡ ላዕሌሃ፡
  english_pob_choice: and her strength was upon her
  chosen_korean: 그녀의 힘이 그대로 있었고
  alternatives_korean:
  - 그녀의 힘이 그녀 위에 있었고
  - 그녀에게 힘이 충만했고
  lexicon: 힘 / 그 위에 있다
  rationale: 직역하면 ‘힘이 그녀 위에 있었다’이지만 한국어에서는 이 관용적 구성이 어색하므로, 힘이 여전히 유지되었다는 뜻을 살려 ‘그녀의 힘이 그대로 있었다’로 옮겼습니다.
- source_word: ወኢደክመት፡ እምኀይላ፡
  english_pob_choice: and she had not grown weak in strength
  chosen_korean: 힘이 약해지지 않았습니다
  alternatives_korean:
  - 힘으로 쇠하지 않았습니다
  - 기력이 줄지 않았습니다
  lexicon: 쇠약/약해짐
  rationale: 원문은 힘이 쇠하지 않았다는 중복 강조이므로, 한국어도 중복을 살리되 자연스럽게 ‘힘이 약해지지 않았습니다’로 표현했습니다.
- source_word: ወትበውእ፡ ወትወፅእ፡ ወትሬኢ፡
  english_pob_choice: for she went in and went out and saw
  chosen_korean: 왜냐하면 그녀는 들고 나고 보았기 때문입니다
  alternatives_korean:
  - 그녀는 들어가고 나가고 보았기 때문입니다
  - 그녀는 안팎으로 다니며 보았기 때문입니다
  lexicon: 관용적 행위 열거
  rationale: 세 동사의 연쇄를 그대로 보존하되, 문맥상 활동성과 시력을 가리키므로 ‘들고 나고 보았다’는 간결한 한국어 관용으로 처리했습니다.
- source_word: እሙ
  english_pob_choice: his mother / mother
  chosen_korean: 어머니
  alternatives_korean:
  - 그의 어머니
  - 그 어머니
  lexicon: 친족 호칭
  rationale: 지시 관계가 분명하므로 ‘어머니’로 자연스럽게 옮기되, 이어지는 ‘그에게’로 야곱과의 관계를 문맥상 유지했습니다.
theological_decisions:
- issue: 야곱이 어머니의 말을 듣고 웃는 장면의 의미
  chosen_reading: 이 웃음은 조롱이라기보다, 어머니의 실제 활력과 예언적 발언 사이의 긴장 속에서 나온 반응으로 유지했습니다.
  alternative_readings:
  - 비웃음으로 읽을 수 있음
  - 단순한 놀라움으로 읽을 수 있음
  rationale: 원문과 POB는 감정의 세부를 해설하지 않으므로, 한국어도 의미를 좁히지 않고 서술적 중립을 유지했습니다.
  doctrine_reference: 서사 본문 해석의 최소개입 원칙
