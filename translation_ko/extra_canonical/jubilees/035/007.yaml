- from: “보십시오, 저는 제가 살아야 할 제 삶의 모든 날을 마쳤습니다.” 그리고 야곱은 어머니의 말 때문에 웃었습니다. 어머니는 그에게 자신이 죽을 것이라고 말했지만, 여전히 그의 맞은편에 있었고, 그녀의 힘이 그대로 있었으며, 힘이 약해지지 않았습니다. 왜냐하면 그녀는 들고 나고 보았기 때문입니다.[a]
  to: “보십시오, 저는 제가 살아야 할 생애의 모든 날을 다 마쳤습니다.” 그리고 야곱은 어머니의 말 때문에 웃었습니다. 어머니가 그에게 자신이 죽을 것이라고 말했지만, 그녀는 여전히 그의 맞은편에 있었고, 그녀에게는 여전히 힘이 있었으며, 기력도 쇠하지 않았습니다. 이는 그녀가 들어가고 나가고 보았기 때문인데,
