  source_fidelity: 초안의 마지막 ‘이를 구하라’는 게에즈어 ወይኅሥሥ ብእሲ(‘그리고 사람이 구하게 하라/사람은 구하라’)에 없는 목적어 ‘이를’를 보충합니다. 이 절은 다음 절에서 목적어가 이어지는 미완결 문장으로 남겨야 합니다.
