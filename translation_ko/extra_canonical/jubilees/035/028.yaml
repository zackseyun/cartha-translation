  terminology: ‘형제’, ‘생명’, ‘사랑’은 본문의 일반적·윤리적 어휘를 충실히 유지합니다. ‘사람’은 게에즈어 be’esi의 일반적 단수 용법을 보존하며, 성별을 특정하지 않습니다.
  issues:
