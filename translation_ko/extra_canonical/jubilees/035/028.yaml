  rationale: 원문과 영어 POB의 ‘and let a man seek—’에 맞추어 마지막 동사의 목적어를 보충하지 않았고, 다음 절로 이어지는 문장 중단을 대시로 유지했습니다. 앞부분은 현대 표준 한국어 합쇼체로 자연스럽게 정리하되, ‘사람’의 일반적 단수와 반복되는 사랑의 비교를 보존했습니다.
