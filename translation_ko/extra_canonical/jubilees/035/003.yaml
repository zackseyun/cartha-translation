  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: ko
  text: 내 아들아, 너는 네가 태어난 날부터 오늘까지 내 모든 행위와 내 마음속에 있는 모든 것을 알고 있습니다. 내가 네 아버지를 매우 사랑한다는 것도 알고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: Geʿez 용례 및 호칭 관용
  rationale: 직접 호칭이므로 한국어에서도 대화체를 살려 ‘내 아들아’로 옮겨 청자 지정과 친밀감을 드러냈습니다.
- source_word: ምግባርየ
  english_pob_choice: deeds
  chosen_korean: 내 모든 행위
  alternatives_korean:
  - 내 모든 일
  - 내 모든 행동
  - 내 모든 행실
  lexicon: Leslau
  rationale: ‘행위’는 눈에 보이는 행한 바를 자연스럽게 포괄하면서도, 영어 POB의 ‘deeds’와 원문의 ‘행동/행위’ 범위를 반영합니다.
- source_word: ዘውስተ ልብየ
  english_pob_choice: all that is in my heart
  chosen_korean: 내 마음속에 있는 모든 것
  alternatives_korean:
  - 내 마음에 있는 모든 것
  - 내 속마음의 모든 것
  lexicon: Geʿez 어휘 및 관용구
  rationale: ‘마음’(heart)은 내적 의도와 생각을 포함하므로, 원문의 내면 전체를 드러내는 ‘마음속에 있는 모든 것’으로 풀었습니다.
- source_word: ጥቀ
  english_pob_choice: exceedingly
  chosen_korean: 매우
  alternatives_korean:
  - 지극히
  - 대단히
  - 몹시
  lexicon: Leslau
  rationale: 강조 부사로서 사랑의 강도를 분명히 전하되, 한국어 문장 흐름상 가장 자연스러운 ‘매우’를 선택했습니다.
theological_decisions:
- issue: 화자의 사랑 대상과 진술의 직접성
  chosen_reading: “내가 네 아버지를 매우 사랑함이라”로 직설적으로 옮겨, 원문이 사랑의 대상(아버지)과 강도를 명시하는 진술을 그대로 유지했습니다.
  alternative_readings:
  - “내가 네 아버지를 매우 사랑한다”
  - “내가 네 아버지를 지극히 사랑함을 너는 알지니”
  rationale: 원문은 지식 진술(알지니)과 사랑의 선언을 결합하므로, 서술형 종결로 옮기되 내용상 단정성을 유지했습니다.
  doctrine_reference: 문맥상 서술적 진술의 보존
