revisions:
- from: 그리고 그의 이빨은 강하였고, 그의 평생 동안 그에게는 어떤 병도 전혀 닥치지 않았습니다. 야곱이 그녀에게 말했습니다. “어머니, 제 날들이 당신의 생애의 날들에 가까워지고, 제 힘도 당신의 힘처럼 제게 그대로 남아 있다면, 저는 복됩니다. 당신은 죽지 않을 것입니다. 당신이 제게 당신의 죽음에 관해 헛되이 말하고 있기 때문입니다.”[a]
  to: 그리고 그녀의 이빨은 튼튼했고, 그녀의 평생 동안 그녀에게는 어떤 병도 전혀 닥치지 않았습니다. 야곱이 그녀에게 말했습니다. “어머니, 제 생애의 날들이 어머니의 생애의 날들에 가까워지고, 제 힘도 어머니의 힘처럼 이처럼 제게 남아 있다면, 저는 복된 사람입니다. 어머니께서는 죽지 않으실 것입니다.[a] 이는 어머니께서 자신의 죽음에 관하여 제게 헛되이 말씀하고 계시기 때문입니다.”
  rationale: 여성 지시 대상에 맞추어 대명사를 바로잡고, 치아의 상태를 자연스럽게 표현했습니다. ‘복됩니다’를 자연스러운 ‘복된 사람입니다’로 고쳤으며, 야곱이 어머니에게 하는 말에 합당하게 존대 표현을 적용했습니다. አትመውቲ는 본문에서 ‘죽지 않으실 것입니다’라는 미래 부정 진술로 유지하고, 대안 독법은 해당 구절에 직접 연결된 각주로 보존했습니다.
