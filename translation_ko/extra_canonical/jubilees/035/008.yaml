  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
  footnotes:
  - marker: a
    text: Or 'Do not die'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 이빨은 강하였고, 그의 평생 동안 그에게는 어떤 병도 전혀 닥치지 않았습니다. 야곱이 그녀에게 말했습니다. “어머니, 제 날들이 당신의 생애의 날들에 가까워지고, 제 힘도 당신의 힘처럼 제게 그대로 남아 있다면, 저는 복됩니다. 당신은 죽지 않을 것입니다. 당신이 제게 당신의 죽음에 관해 헛되이 말하고 있기 때문입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽኑዕ
  english_pob_choice: strong
  chosen_korean: 강하였고
  alternatives_korean:
  - 튼튼하였고
  - 견고하였고
  - 강건하였고
  lexicon: strength/firmness
  rationale: 치아의 물리적 상태를 자연스럽게 드러내면서도 원문의 ‘강함’ 의미를 유지하기 위해 ‘강하다’를 택했습니다.
- source_word: ኢምንተኒ ሕማም
  english_pob_choice: no sickness at all
  chosen_korean: 어떤 병도 전혀 닥치지 않았습니다
  alternatives_korean:
  - 전혀 병이 없었습니다
  - 아무 병도 들지 않았습니다
  - 병이 조금도 없었습니다
  lexicon: sickness/affliction
  rationale: ‘닥치다’는 질병이 몸에 이르다/덮치다의 뉘앙스를 살려, 단순 무병 상태보다 원문의 도달·침범 부정을 더 직접적으로 반영합니다.
- source_word: በከፋ፡ ኵሎ መዋዕለ ሕይወታ
  english_pob_choice: in all the days of her life
  chosen_korean: 그의 평생 동안
  alternatives_korean:
  - 그 생애의 모든 날 동안
  - 평생 동안
  - 그 삶의 모든 날에
  lexicon: idiom of lifespan
  rationale: 의미는 같지만 한국어에서는 ‘평생 동안’이 가장 자연스럽고 응축적이어서, 뒤의 ‘생애의 날들’ 표현과 함께 과잉 반복을 줄였습니다.
- source_word: ብፁዕ
  english_pob_choice: Blessed am I
  chosen_korean: 저는 복됩니다
  alternatives_korean:
  - 저는 복이 있습니다
  - 복되도다, 나는
  - 저는 행복합니다
  lexicon: blessed
  rationale: 축복받은 상태를 말하는 원문을 따라 ‘복되다’ 계열을 유지하되, 현대 한국어 문장으로는 ‘복됩니다’가 가장 직역적입니다.
- source_word: ለመዋዕለ ሕይወትኪ
  english_pob_choice: to the days of your life
  chosen_korean: 당신의 생애의 날들에
  alternatives_korean:
  - 당신 생애의 날들에
  - 당신의 삶의 날들에
  - 당신의 생애까지
  lexicon: days of life
  rationale: 연대적 비교 구조를 살리기 위해 ‘생애의 날들’로 옮겼고, 소유·대상 관계를 분명히 하기 위해 ‘당신의’를 유지했습니다.
- source_word: አትመውቲ
  english_pob_choice: You will not die
  chosen_korean: 당신은 죽지 않을 것입니다
  alternatives_korean:
  - 죽지 않을 것입니다
  - 당신은 죽지 않습니다
  - 죽지 마십시오
  lexicon: future negative
  rationale: 주절의 형식이 금지보다 진술에 가깝다는 영어·게에즈 검토를 반영해, 명령형이 아닌 미래 부정 진술로 번역했습니다.
theological_decisions:
- issue: 야곱의 마지막 문장 어조
  chosen_reading: “당신은 죽지 않을 것입니다”로 옮겨, 야곱이 금지 명령을 하는 것이 아니라 리브가의 건강을 확언하는 말로 읽었습니다.
  alternative_readings:
  - “죽지 마십시오”
  - “죽지 않으실 것입니다”
  rationale: 게에즈 동사가 금지형이 아니라 서술적 미래 부정이라는 검토를 따랐습니다. 따라서 윤리적·목회적 명령보다 위로/확언의 성격이 원문에 더 가깝습니다.
  doctrine_reference: 문법-해석 결정; 본문 내 서술 의도 보존
- issue: 직접화법의 호칭
  chosen_reading: ‘어머니’로 옮겨, 야곱의 친밀한 가족 호칭을 유지했습니다.
  alternative_readings:
  - ‘어머님’
  - ‘어머니이시여’
  rationale: 원문과 영어 모두 친밀한 호칭을 보이므로 과도한 경어화는 피하고, 현대 한국어에서 자연스럽게 존중과 친근함을 함께 드러내는 ‘어머니’를 선택했습니다.
  doctrine_reference: 서사 화법 및 인물 간 관계 보존
