  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: ko
  text: 그는 당신이 죽은 뒤에 그를 죽일 것입니다. 그리고 당신은 그의 형제 야곱이 하란으로 간 날부터 오늘까지 그가 한 모든 일 — 온 마음으로 우리를 버리고 행한 일 — 을 다 알고 있습니다.[a][b]
  philosophy: formal
lexical_decisions:
- source_word: ይቅትሎ
  english_pob_choice: He will kill him
  chosen_korean: 그를 죽일 것입니다
  alternatives_korean:
  - 그를 죽이겠습니다
  - 그를 살해할 것입니다
  lexicon: Geʿez ቀተለ / 죽이다
  rationale: 미래 시제를 분명히 드러내면서도 원문의 단순한 살해 동사를 직역하여 과도한 해석을 피했습니다.
- source_word: እምድኅረ፡ ሞትከ
  english_pob_choice: after your death
  chosen_korean: 당신이 죽은 뒤에
  alternatives_korean:
  - 당신의 죽음 뒤에
  - 당신이 죽은 후에
  lexicon: Geʿez እምድኅረ + ሞት
  rationale: 시간 관계를 자연스러운 현대 한국어로 옮기되, 원문의 순서를 유지했습니다.
- source_word: በኵሉ፡ ልቡ፡ ኀደገነ
  english_pob_choice: with all his heart he has forsaken us
  chosen_korean: 온 마음으로 우리를 버리고
  alternatives_korean:
  - 온 마음을 다해 우리를 버리고
  - 전심으로 우리를 떠나고
  lexicon: Geʿez በኵሉ ልቡ / ኀደገ
  rationale: ‘온 마음’은 심장/마음 전체를 뜻하는 관용을 살리고, ‘버리다’로 관계적 단절의 강도를 보존했습니다.
- source_word: እምዕለተ፡ ሖረ፡ ያዕቆብ፡ እኁሁ፡ ውስተ፡ ካራን፡ እስከ፡ ዛቲ፡ ዕለት
  english_pob_choice: from the day his brother Jacob went to Haran until this day
  chosen_korean: 그의 형제 야곱이 하란으로 간 날부터 오늘까지
  alternatives_korean:
  - 그의 형제 야곱이 하란에 갔던 날부터 오늘까지
  - 야곱이 형제인 채 하란으로 간 날부터 오늘까지
  lexicon: Geʿez እምዕለተ ... እስከ ዛቲ ዕለት
  rationale: 기준 시점을 정확히 표시하면서 고유명사와 이동 방향을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 원문의 비난적 서술을 완화할지 여부
  chosen_reading: ‘온 마음으로 우리를 버리고 행한 일’로 직역하여 관계 단절의 책임을 분명히 드러냈습니다.
  alternative_readings:
  - ‘우리를 떠나 한 일’로 완화
  - ‘우리에게서 돌아선 일’로 순화
  rationale: 문맥상 단순한 이동이 아니라 의도적 이탈과 불충을 고발하는 진술이므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서술문맥 보존 원칙
