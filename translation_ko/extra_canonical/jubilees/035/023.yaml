  - marker: a
    text: Or 'Only hide me, so that'.
    reason: previous_rendering
  - marker: b
    text: Or 'nothing may come before us except love'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가는 에서가 보는 앞에서 야곱을 불러, 자기가 에서와 나눈 말대로 그에게 명령했습니다. 야곱이 말했습니다. “제가 당신의 뜻을 행하겠습니다. 저를 믿으십시오. 저나 제 자손에게서 에서를 해치는 어떤 악도 나오지 않을 것이며, 사랑 외에는 어떤 일에서도 제가 앞서지 않겠습니다.”
  philosophy: optimal-equivalence
