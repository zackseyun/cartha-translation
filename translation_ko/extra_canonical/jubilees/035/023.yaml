  - marker: a
    text: Or 'Only hide me, so that'.
    reason: previous_rendering
  - marker: b
    text: Or 'nothing may come before us except love'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 여자는 에서의 눈앞에서 야곱을 불러, 자기가 에서와 나눈 말대로 그에게 가르쳤습니다. 그가 이르되 내가 당신의 뜻을 행하리니 나와 내 자손이 에서에게 해를 끼치지 못할 것을 나를 믿으라 사랑 외에는 내가 모든 일에 첫째가 되지 아니하리라
