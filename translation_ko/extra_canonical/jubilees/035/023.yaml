revisions:
- from: 그리고 그 여자는 에서의 눈앞에서 야곱을 불러, 자기가 에서와 나눈 말대로 그에게 가르쳤습니다. 그가 이르되 내가 당신의 뜻을 행하리니 나와 내 자손이 에서에게 해를 끼치지 못할 것을 나를 믿으라 사랑 외에는 내가 모든 일에 첫째가 되지 아니하리라
  to: 리브가는 에서가 보는 앞에서 야곱을 불러, 자기가 에서와 나눈 말대로 그에게 명령했습니다. 야곱이 말했습니다. “제가 당신의 뜻을 행하겠습니다. 저를 믿으십시오. 저나 제 자손에게서 에서를 해치는 어떤 악도 나오지 않을 것이며, 사랑 외에는 어떤 일에서도 제가 앞서지 않겠습니다.”
  rationale: 원문의 인물 지시와 지시 동사를 보존하고, ‘악이 … 나오다’라는 표현 및 미래적 약속을 한국어로 자연스럽게 재현했습니다. 마지막 절은 다소 이례적인 표현이지만 원문의 ‘사랑 외에는 어떤 것에서도 내가 첫째/앞서지 않겠다’는 의미를 해석적으로 확대하지 않고 유지했습니다.
