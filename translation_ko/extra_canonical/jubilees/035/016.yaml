review_pass:
  verdict: revise
  source_fidelity: The draft reverses the object of fear ('do not fear for/because of Jacob,' not 'do not fear Jacob'), changes the comparative predicate into a future, and ambiguously renders Rebekah's action. The source describes Jacob's guardian as great, mighty, honored, and more praised than Esau's guardian; it then states that Rebekah sent for and called Esau.
  naturalness: The Korean needs a more natural rendering of the indirect action ('사람을 보내 ... 불렀습니다') and must correct the mismatched masculine pronoun in '그가 그에게 왔습니다.' The revised prose consistently uses modern formal-polite narration while retaining appropriate direct-speech imperatives.
  terminology: '''보호자'' is a natural, non-doctrinal rendering of the source''s ''guardian/protector.'' ''찬양받는다'' preserves the comparative ''more praised'' without importing the unsupported sense ''more powerful.'' Names are standardized as 야곱, 에서, and 리브가.'
  issues:
  - severity: high
    issue: The draft says '야곱을 두려워하지 말라' ('do not fear Jacob').
    rationale: The source and English audit trail mean 'do not fear for/on account of Jacob.' The object must be corrected to avoid reversing the meaning.
  - severity: medium
    issue: 'The draft renders the comparative description as future: ''더욱 칭찬받을 것이니라.'''
    rationale: The source presents a present descriptive comparison, not a future prediction.
  - severity: medium
    issue: The narrative says Esau came 'to him' after Rebekah called him.
    rationale: Rebekah is the referent; Korean must say that Esau came to her. The source also expressly includes that Rebekah sent for him.
