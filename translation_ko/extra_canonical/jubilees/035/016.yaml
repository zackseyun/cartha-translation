  language: ko
  text: 그리고 너는 야곱을 두려워하지 말라. 야곱의 후견인은 위대하고 능하며 존귀하며 에서의 후견인보다 더욱 칭찬받을 것이니라.” 그리고 리브가가 사람을 보내 에서를 부르니 그가 그에게 왔습니다. “내 아들아, 내가 너에게 한 가지 부탁을 하겠다. 그렇게 하겠다고 말해라, 내 아들아.”
