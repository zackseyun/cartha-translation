    text: Or 'honored, and more powerful than Esau’s guardian.” And Rebekah praised Isaac, and she called Esau'.
    reason: previous_rendering
translation:
  language: ko
  text: “그러나 너는 야곱 때문에 두려워하지 말아라. 야곱의 보호자는 위대하고 강하며 존귀하고, 에서의 보호자보다 더 찬양받는다.” 그 뒤 리브가는 사람을 보내 에서를 불렀고, 에서가 그녀에게 왔습니다. 리브가가 그에게 말했습니다. “내 아들아, 내가 네게 한 가지 청을 한다. 그것을 들어주겠다고 말하여라, 내 아들아.”
