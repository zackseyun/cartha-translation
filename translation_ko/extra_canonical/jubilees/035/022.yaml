  source_fidelity: 초안의 ‘그에게 해를 끼치지 않고’는 원문의 ‘그에게 악을 꾀하지/찾지 않고’를 실제 해를 가하지 않는다는 뜻으로 다소 좁힙니다. ‘내 평생에’는 원문의 생애 전체를 잘 반영합니다.
