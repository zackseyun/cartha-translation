  text: “그리고 저는 그를 사랑하며, 제 평생 동안 그에게 악을 꾀하지 않고 오직 선만을 도모할 것을 맹세합니다.” 그리고 그는 이 모든 일에 관하여 그녀에게 맹세하였다.
