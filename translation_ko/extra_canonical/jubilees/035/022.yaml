revisions:
- from: 그리고 나는 그를 사랑할 것이며, 내 평생에 그에게 해를 끼치지 않고 오직 좋은 것만을 추구할 것을 맹세합니다.” 그리고 그는 이 모든 일에 관하여 그 여자에게 맹세하였다.
  to: “그리고 저는 그를 사랑하며, 제 평생 동안 그에게 악을 꾀하지 않고 오직 선만을 도모할 것을 맹세합니다.” 그리고 그는 이 모든 일에 관하여 그녀에게 맹세하였다.
  rationale: ‘악을 꾀하지 않고’로 원문의 의도적 ‘악을 추구함’의 의미를 보존하고, 이에 대응하는 ‘선만을 도모하다’를 사용했습니다. 리브가를 가리키는 표현은 ‘그녀’로 고쳤습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:29Z'
