  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
  footnotes:
  - marker: a
    text: Or 'and all your possessions have gone'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 우리를 악하게 대하였고, 당신의 양 떼를 모았으며, 당신의 모든 소유를 당신의 얼굴 앞에서 빼앗아 갔습니다. 그리고 우리가 그에게서 우리에게 속한 것을 구하고 요구하는 동안, 그는 마치 우리를 불쌍히 여기는 사람처럼 행동합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩየ፡
  english_pob_choice: He has dealt wickedly with us
  chosen_korean: 우리를 악하게 대하였고
  alternatives_korean:
  - 우리를 악하게 행하였고
  - 우리를 악하게 다루었고
  lexicon: Ge'ez እኩየ
  rationale: 문맥상 단순한 '나쁨'이 아니라 우리를 향한 불의한 처신을 가리키므로, 행위의 성격을 드러내는 ‘악하게 대하다’로 옮겼습니다.
- source_word: መሪዕቶከ፡
  english_pob_choice: your flocks
  chosen_korean: 당신의 양 떼를
  alternatives_korean:
  - 당신의 가축 떼를
  - 당신의 목축 무리를
  lexicon: Ge'ez መሪዕቶ
  rationale: ‘flocks’에 해당하는 가축 무리 가운데서도 한국어에서 가장 자연스럽고 직관적인 ‘양 떼’를 택해 소유 관계를 분명히 했습니다.
- source_word: ሄደ፡
  english_pob_choice: he has plundered all your possessions
  chosen_korean: 당신의 모든 소유를 … 빼앗아 갔습니다
  alternatives_korean:
  - 당신의 모든 소유를 … 약탈했습니다
  - 당신의 모든 재산을 … 빼앗아 갔습니다
  lexicon: Ge'ez ሄደ
  rationale: 주해상 ‘가다’가 아니라 강탈·약탈의 뜻이므로, POB의 수정 취지에 맞추어 ‘빼앗아 갔습니다’로 처리했습니다.
- source_word: ወንስእሎ፡ ዘእምዚአነ፡
  english_pob_choice: we ask and request from him what is ours
  chosen_korean: 우리가 그에게서 우리에게 속한 것을 구하고 요구하는 동안
  alternatives_korean:
  - 우리가 그에게서 우리 몫을 구하고 청하는 동안
  - 우리가 그에게서 우리 것을 달라고 요청하는 동안
  lexicon: Ge'ez ወንስእሎ
  rationale: 이중 동사 구조를 살려 ‘구하고 요구하는 동안’으로 옮기되, 목적어의 소유 관계는 ‘우리에게 속한 것’으로 명확히 했습니다.
- source_word: ዘይምሕረነ።
  english_pob_choice: he acts like a man who has mercy on us
  chosen_korean: 마치 우리를 불쌍히 여기는 사람처럼 행동합니다
  alternatives_korean:
  - 마치 우리를 불쌍히 여기는 사람인 듯 행동합니다
  - 마치 우리에게 자비를 베푸는 사람처럼 행동합니다
  lexicon: Ge'ez ይምሕረ
  rationale: 동사 자체는 자비/긍휼의 범주이지만, POB의 ‘acts like’에 맞춰 겉모습의 연기를 드러내는 ‘행동합니다’로 살렸습니다.
theological_decisions:
- issue: 문장 전체의 화자 시점과 호칭 유지
  chosen_reading: 형제들이 아버지에게 말하는 직접 خطاب 구조를 살려 ‘당신’ 호칭을 유지했습니다.
  alternative_readings:
  - 3인칭 서술로 완화
  - ‘아버지’ 호칭을 본문에 추가
  rationale: 원문의 직접적 호소와 소유 관계(‘your flocks’, ‘your possessions’)를 흐리지 않기 위해, 대화 상대를 가리키는 2인칭을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 문맥 보존과 화자-청자 관계의 직접성
