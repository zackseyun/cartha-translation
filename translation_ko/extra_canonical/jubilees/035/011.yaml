  source_fidelity: 핵심 동사 ሄደ를 ‘빼앗다/약탈하다’로 이해한 것은 원문 및 영어 POB의 정정 사항에 부합합니다. መሪዕቶከ는 ‘당신의 양 떼’, ዘእምዚአነ는 ‘우리에게 속한 것’으로 충실히 반영되었습니다. 다만 ‘당신의 얼굴 앞에서’는 한국어에서는 직역투이므로 원문의 ‘눈앞에서/면전에서’라는 뜻을 자연스럽게 옮기는 편이 적절합니다.
  naturalness: ‘우리를 악하게 대하였고’와 ‘그에게서 우리에게 속한 것을 구하고 요구하는’은 의미는 통하지만 현대 한국어 합쇼체로 다소 부자연스럽고 중복됩니다. ‘우리에게 악한 짓을 하였고’, ‘우리에게 속한 것을 그에게 달라고 청하고 요구하는’으로 다듬으면 원문의 반복적 간청과 요청 대상을 유지하면서 더 자연스럽습니다.
