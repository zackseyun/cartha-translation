  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: ko
  text: 그리고 그녀는 이삭에게 가서 그에게 말했습니다. “제가 당신께 한 가지 요청을 드립니다. 에서가 야곱에게 해를 꾸미지 않고, 적대하여 뒤쫓지도 않겠다고 맹세하게 해주십시오. 당신은 에서의 마음을 알고 계십니다. 그는 어릴 때부터 잔인했으며, 그에게는 선함이 없기 때문입니다. 그가 원하기 때문입니다,”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐተ፡ ስእለተ፡ አስተበቍዕ
  english_pob_choice: I ask one request of you
  chosen_korean: 제가 당신께 한 가지 요청을 드립니다
  alternatives_korean:
  - 한 가지 청을 드립니다
  - 한 가지 부탁을 드립니다
  lexicon: request / petition
  rationale: 원문의 하나의 요청을 공손한 현대 한국어로 자연스럽게 살리되, 단순한 부탁보다 간청·청원의 뉘앙스를 유지했습니다.
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  english_pob_choice: will not devise evil against Jacob
  chosen_korean: 야곱에게 해를 꾸미지
  alternatives_korean:
  - 야곱에게 악을 행하지
  - 야곱에게 해코지하지
  lexicon: devise evil against / plan harm
  rationale: POB의 수정판이 지시한 'devise evil against'를 따라, 단순한 감정(미워함)보다 의도적 해악 계획을 드러내는 ‘해를 꾸미다’로 옮겼습니다.
- source_word: በጸልኢ
  english_pob_choice: in hostility
  chosen_korean: 적대하여 뒤쫓지도
  alternatives_korean:
  - 원한을 품고 쫓지도
  - 적의로 추격하지도
  lexicon: hostility / enmity
  rationale: ‘적대하여’는 적의 상태를, ‘뒤쫓다’는 추격의 행위를 드러내어 POB의 hostility/pursue him을 함께 반영합니다.
- source_word: ሕሊናሁ
  english_pob_choice: his mind
  chosen_korean: 마음
  alternatives_korean:
  - 생각
  - 심정
  lexicon: mind / inner disposition
  rationale: 지적 능력보다 성향과 의도를 가리키는 문맥이므로, 한국어 성경 문체에서도 자연스러운 ‘마음’으로 옮겼습니다.
- source_word: ጸዋን
  english_pob_choice: cruel
  chosen_korean: 잔인했으며
  alternatives_korean:
  - 혹독했으며
  - 사나웠으며
  lexicon: cruel / harsh
  rationale: 최신 POB 수정판의 'cruel'을 반영해, 어릴 때부터의 성품적 잔혹성을 분명히 하는 ‘잔인했으며’로 번역했습니다.
theological_decisions:
- issue: 문장 결말의 미완성 보존
  chosen_reading: 본문을 ‘그가 원하기 때문입니다,’로 끝내어, 원문과 POB가 보이는 문장 미완성을 그대로 드러냈습니다.
  alternative_readings:
  - 의역하여 문장을 완결시키기
  - 후속 문맥을 추정해 보충하기
  rationale: 현재 제시된 게에즈 본문과 영어 POB가 모두 절의 끝이 끊긴 형태를 보이므로, 해석적 보충 없이 미완성을 보존하는 것이 문헌학적으로 더 충실합니다.
  doctrine_reference: 본문 비평/번역 충실성
