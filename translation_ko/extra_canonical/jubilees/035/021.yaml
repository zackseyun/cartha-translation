  text: 그리고 나는 당신에게 청하노니 나와 내 자식에 대하여 야곱을 교훈하라. 이는 그가 정녕 나와 내 자식을 다스릴 줄을 내가 아노라. 이는 내 아버지가 그를 축복한 날에 그를 높이고 나를 낮추었음이라.
