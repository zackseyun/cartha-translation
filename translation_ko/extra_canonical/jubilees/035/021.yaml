    reason: previous_rendering
translation:
  language: ko
  text: 저는 어머니께 청합니다. 저와 제 자녀에 관하여 야곱을 타이르십시오. 아버지께서 야곱을 축복하시던 날 그를 높이시고 저를 낮추셨으므로, 그가 반드시 저와 제 자녀를 다스리게 될 것을 저는 압니다.
  philosophy: optimal-equivalence
