  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: ko
  text: 야곱이 그 여자에게 말했습니다. "내가 당신이 내게 명령한 모든 것을 행하겠습니다. 이 일은 내게 영광과 위대함이 되며, 하나님 앞에서 의가 되어, 내가 그들을 존중하게 될 것입니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ ዘአዘዝክኒ
  english_pob_choice: I will do all that you have commanded me
  chosen_korean: 내가 당신이 내게 명령한 모든 것을 행하겠습니다
  alternatives_korean:
  - 당신이 내게 명령한 모든 것을 내가 다 하겠습니다
  - 당신이 내게 시킨 모든 것을 행하겠습니다
  lexicon: 명령하다
  rationale: Geʿez의 2인칭 여성 단수 완전형과 1인칭 목적어 접미사가 결합된 표현을 반영해, 단순한 요청이 아니라 구체적 명령으로 옮겼습니다.
- source_word: ክብረ ወዕበየ
  english_pob_choice: an honor and greatness
  chosen_korean: 영광과 위대함
  alternatives_korean:
  - 존귀와 위대함
  - 명예와 عظ대함
  lexicon: 영광 / 위대함
  rationale: 두 명사 병렬을 살려, 단순한 체면이 아니라 높아짐과 중요함의 의미가 함께 드러나도록 했습니다.
- source_word: ወጽድቀ ቅድመ እግዚአብሔር
  english_pob_choice: and righteousness before God
  chosen_korean: 하나님 앞에서 의가 되어
  alternatives_korean:
  - 하나님 앞에서 의가 되고
  - 하나님 앞에서 의로
  lexicon: 의
  rationale: ‘before God’를 관계적·법적 기준으로 살려, 결과절 형태로 자연스럽게 풀되 핵심 명사 ‘의’를 유지했습니다.
- source_word: ከመ አክብሮሙ
  english_pob_choice: that I should honor them
  chosen_korean: 내가 그들을 존중하게 될 것입니다
  alternatives_korean:
  - 내가 그들을 존귀히 여기게 될 것입니다
  - 내가 그들을 공경하게 될 것입니다
  lexicon: 존중하다
  rationale: 문맥상 대상에 대한 적절한 공경을 뜻하지만, 한국어에서 ‘공경’이 과도하게 종교적·상하적일 수 있어 의미를 보존하는 ‘존중하다’를 택했습니다.
theological_decisions:
- issue: ‘의’와 ‘하나님 앞에서’의 결합
  chosen_reading: 이 말은 행위 자체의 공로를 주장하기보다, 하나님 앞에서 올바른 질서를 따르는 것으로 제시됩니다.
  alternative_readings:
  - 도덕적 선행의 공로 강조
  - 의롭다 함의 선언
  rationale: 본문은 야곱의 응답을 인용하는 서술이며, ‘의’는 언약적·윤리적 정합성을 가리키는 표현으로 읽는 것이 자연스럽습니다.
  doctrine_reference: 구약의 의 개념과 언약적 충성
- issue: 인용문 내부의 존대 표현
  chosen_reading: 서술문은 합쇼체를 유지하고, 직접 인용은 화자-청자 관계에 맞는 평서형을 사용했습니다.
  alternative_readings:
  - 인용문 전체를 동일한 높임말로 통일
  - 고전적 성경체로 전환
  rationale: 한국어에서 직접화법의 자연스러움을 살리면서도, 전체 서술의 현대적 공적 문체를 유지하기 위한 선택입니다.
  doctrine_reference: 번역 문체의 일관성과 대화체 재현
