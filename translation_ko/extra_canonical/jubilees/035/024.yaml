  to: 그 밤에 그녀와 그녀의 아들들은 먹고 마셨습니다. 그녀는 마흔한 번째 희년의 일곱째 주 셋째 해 그 밤에 죽었습니다. 그녀의 두 아들 에서와 야곱은 그녀를 그들의 아버지의 어머니 사라 곁에 있는 쌍굴에 장사했습니다.
