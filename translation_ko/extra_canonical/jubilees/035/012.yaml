base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: ko
  text: 그리고 그는 당신께서 당신의 완전하고 올곧은 아들 야곱을 축복하셨기 때문에 당신에게 쓰라린 마음을 품고 있습니다. 그에게는 악이 전혀 없고 오직 선함뿐입니다. 그가 하란에서 온 때부터 오늘까지, 그는 우리에게서 아무것도 빼앗지 않았습니다. 모든 것은 날마다 제때에 우리에게 오며, 우리가 그의 손에서 받을 때마다 그는 온 마음으로 기뻐하고 우리를 축복합니다. 그는 하란에서 온 때부터 오늘까지 우리 곁을 떠나지 않았고, 늘 집 안에서 우리와 함께 지내며 우리를 존중합니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍጹማዊ
  english_pob_choice: perfect
  chosen_korean: 완전한
  alternatives_korean:
  - 온전한
  - 완벽한
  lexicon: Geez ፍጹማዊ
  rationale: 도덕적 결함이 없다는 문맥이므로 ‘완전한’이 가장 자연스럽고, ‘완벽한’보다 성격 묘사에 덜 현대적 과장을 줍니다.
- source_word: ፈትዐ
  english_pob_choice: upright
  chosen_korean: 정직한
  alternatives_korean:
  - 올곧은
  - 의로운
  lexicon: Geez ፈትዐ
  rationale: 영어 POB의 ‘upright’를 인격적 바름으로 풀어 ‘정직한’으로 옮겼습니다. ‘의로운’은 신학적 평가를 더 강하게 부각할 수 있습니다.
- source_word: እኩየ
  english_pob_choice: evil
  chosen_korean: 악
  alternatives_korean:
  - 악한 것
  - 나쁜 것
  lexicon: Geez እኩየ
  rationale: 원문 대조가 ‘악/선함’이므로 명사형 ‘악’이 대비를 가장 분명하게 드러냅니다.
- source_word: ዘአንበበ
  english_pob_choice: deprived us of anything
  chosen_korean: 우리에게 아무것도 빼앗지 않았습니다
  alternatives_korean:
  - 우리에게서 아무것도 앗아가지 않았습니다
  - 우리에게 아무것도 부족하게 하지 않았습니다
  lexicon: Geez አንበበ
  rationale: 문맥상 재산이나 몫을 빼앗지 않았다는 뜻을 자연스럽게 살리기 위해 ‘빼앗지 않았다’로 옮겼습니다.
- source_word: ወይባርከነ
  english_pob_choice: he blesses us
  chosen_korean: 그는 우리를 축복합니다
  alternatives_korean:
  - 그는 우리에게 복을 빕니다
  - 그는 우리를 복 주십니다
  lexicon: Geez ባረከ
  rationale: 서술의 흐름이 지속적 습관을 말하므로 현재형으로 두고, POB의 ‘blesses us’를 따라 동사형으로 번역했습니다.
theological_decisions:
- issue: 가족 관계와 품성 묘사의 정도
  chosen_reading: ‘완전하고 정직한 아들’로 번역해 요셉의 도덕적 무흠함과 성실성을 직접 드러냈습니다.
  alternative_readings:
  - ‘온전하고 올곧은 아들’
  - ‘완전하고 의로운 아들’
  rationale: 본문은 요셉을 칭찬하는 문맥이며, Ge'ez의 형용사 배열을 과도하게 신학화하지 않으면서도 인격적 탁월함을 분명히 해야 합니다.
  doctrine_reference: 서술적 인물 평가; 도덕적 완전성 표현
- issue: ‘존중합니다’의 관계 의미
  chosen_reading: 마지막의 እንዘ፡ ያከብረነ를 ‘우리를 존중합니다’로 옮겨, 단순 거주가 아니라 집 안에서의 예우를 드러냈습니다.
  alternative_readings:
  - ‘우리를 공경합니다’
  - ‘우리에게 경의를 표합니다’
  rationale: 영어 POB의 ‘while honoring us’에 맞추되, 한국어에서는 가족 내부의 상호 예우를 가장 자연스럽게 나타내는 표현을 선택했습니다.
  doctrine_reference: 가정 내 질서와 존중의 서술
