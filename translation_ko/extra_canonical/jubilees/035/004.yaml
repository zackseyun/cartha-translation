translation:
  language: ko
  text: 그것이 내 마음에 있습니다. 나는 모든 날 동안 모든 이를 위해 선한 것을 생각합니다. 그런데 내가 왜 이 일을 하지 않겠습니까?[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘውስተ፡ ልብየ፡
  english_pob_choice: that is in my heart
  chosen_korean: 그것이 내 마음에 있습니다
  alternatives_korean:
  - 내 마음속에 있습니다
  - 내 마음에 있는 것입니다
  lexicon: 마음
  rationale: 소스는 ‘내 마음 안에 있는 것’이라는 내적 소유를 말하므로 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: ከመ፡ ኵሎ፡ መዋዕለ፡ *እሐሊ፡ ሠናየ፡ ለኵሉ።
  english_pob_choice: that all my days I think good for all
  chosen_korean: 나는 모든 날 동안 모든 이를 위해 선한 것을 생각합니다
  alternatives_korean:
  - 내 모든 날 동안 모두에게 좋은 것을 생각합니다
  - 평생 모든 이에게 선한 것을 생각합니다
  lexicon: 좋은/선한 것
  rationale: 영문 POB의 ‘think good for all’을 반영하되, 소스의 ‘선하다’ 계열 의미를 살려 ‘선한 것’으로 옮겼습니다.
- source_word: ወአፎ፡ ኢይገብር፡ ዘንተ፡ ነገረ፡
  english_pob_choice: And why should I not do this thing?
  chosen_korean: 그런데 내가 왜 이 일을 하지 않겠습니까?
  alternatives_korean:
  - 그리고 내가 왜 이 일을 하지 않겠습니까?
  - 내가 어찌 이 일을 하지 않겠습니까?
  lexicon: 왜 / 이 일
  rationale: 수사 의문문을 현대 한국어로 자연스럽게 살리되, 소스에 없는 추가 내용을 넣지 않고 ‘이 일’만 유지했습니다.
theological_decisions:
- issue: 본문에 없는 ‘아버지와 형제에게 경의를 표한다’는 문구 처리
  chosen_reading: 현재 제공된 소스에는 그 문구가 없으므로 번역에 포함하지 않았습니다.
  alternative_readings:
  - ‘내 아버지와 형제를 공경해야 하지 않겠습니까?’를 포함하는 읽기
  rationale: 영문 POB 주석과 수정 이력은 해당 문구가 다른 판본/이전 번역에만 있음을 보여 주므로, 제공된 게에즈 원문에 충실하게 제외했습니다.
  doctrine_reference: 텍스트 비평 / 원문 충실성
