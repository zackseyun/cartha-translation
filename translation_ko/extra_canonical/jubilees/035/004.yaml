translation:
  language: ko
  text: 내 마음에 있는 것은, 내가 늘 모든 이를 위해 선한 것을 생각한다는 것입니다. 그리고 내가 왜 이 일을 하지 않겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 번역은 다음과 같이 더 길게 읽습니다. “내 마음에 있는 것은, 내가 늘 모든 이를 위해 선한 것을 생각한다는 것입니다. 그리고 내가 왜 이 일을 하지 않겠습니까? 곧 내 아버지와 내 형제를 공경하려는 것입니다.” 그러나 이 확장 부분은 여기 제공된 게에즈 본문에는 없습니다.
    reason: 영어 POB 감사 기록에 보존된 이전 번역의 확장 읽기를 투명하게 제시하되, 제공된 원문에 없는 내용을 본문으로 오인하지 않게 합니다.
