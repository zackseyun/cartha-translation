translation:
  language: ko
  text: 그리고 이 이레의 여섯째 해에 이삭이 두 아들 에서와 야곱을 불렀습니다. 그들이 그에게 왔습니다. 이삭이 그들에게 말했습니다. “내 아들들아, 나는 내 조상들의 길로 가서 내 조상들이 있는 영원한 집에 이릅니다.”
