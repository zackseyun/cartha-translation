- from: 그리고 이번 주 여섯째 해에 이삭이 그의 두 아들 에서와 야곱을 부르니, 그들이 그에게로 왔습니다. 그리고 그는 그들에게 말했다. “내 아들들아, 나는 내 조상의 길을 가며 내 조상들이 계신 영원한 집으로 가노라.
  to: 그리고 이 이레의 여섯째 해에 이삭이 두 아들 에서와 야곱을 불렀습니다. 그들이 그에게 왔습니다. 이삭이 그들에게 말했습니다. “내 아들들아, 나는 내 조상들의 길로 가서 내 조상들이 있는 영원한 집에 이릅니다.”
  rationale: 희년서 특유의 연대 단위는 ‘이 이레’로 옮겨 현대적 ‘주’의 오해를 피했습니다. 서술과 직접 인용을 모두 현대 정중한 합쇼체로 통일했고, 원문의 반복 접속은 한국어에서 자연스럽게 문장으로 분리했습니다.
