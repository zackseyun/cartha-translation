base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/013.yaml
  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
  footnotes:
  - marker: a
    text: Or 'because his deeds are more evil'.
    reason: previous_rendering
  - marker: b
    text: Or 'and there is no righteousness in him.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 이삭이 그녀에게 말했습니다. “나도 야곱이 우리를 대하는 행실을 알고 또 보고 있습니다. 그는 마음을 다해 우리를 존중합니다. 나는 에서가 맏아들로 태어난 때부터 야곱보다 에서를 먼저 사랑했지만, 이제는 에서보다 야곱을 더 사랑합니다. 에서가 자기 행실을 매우 악하게 만들었고[a], 그에게는 의가 없으며, 그의 모든 길은 불의와 폭력이고, 그 주위에는 의가 전혀 없기 때문입니다.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 행실이 더 악하기 때문입니다.”
    reason: አብዝኀ의 의미를 비교급으로 이해하는 대안적 번역을 기록합니다. 본문은 동적·강조적 의미를 따라 ‘자기 행실을 매우 악하게 만들었다’로 옮깁니다.
  - marker: b
    text: 또는 “그에게는 의가 없습니다.”
    reason: 말미의 አውዶ를 앞 절과 같은 내적 상태로 이해하는 대안입니다. 본문은 ‘그 주위에/그를 둘러싸고’라는 추가 표현을 보존합니다.
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ
  english_pob_choice: Jacob’s conduct toward us
  chosen_korean: 야곱이 우리를 대하는 행실
  alternatives_korean:
  - 야곱의 행실
  - 야곱의 처신
  lexicon: 행실
  rationale: 문맥상 단순한 행동 전체가 아니라 ‘우리에게 보이는 야곱의 처신/행실’을 가리키므로, 관계성을 드러내는 ‘우리를 대하는 행실’이 가장 가깝습니다.
- source_word: በኵሉ፡ ልቡ
  english_pob_choice: with all his heart
  chosen_korean: 마음을 다해
  alternatives_korean:
  - 온 마음으로
  - 진심으로
  lexicon: 마음
  rationale: 히브리식 관용구를 자연스러운 현대 한국어로 옮기되, 전인적 헌신의 강도를 유지하기 위해 ‘마음을 다해’를 선택했습니다.
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  english_pob_choice: he has made his deeds very evil
  chosen_korean: 자기 행실을 매우 악하게 만들었고
  alternatives_korean:
  - 그의 행실을 크게 악하게 했고
  - 그의 행실을 더욱 악하게 했고
  lexicon: 악하게 만들다
  rationale: 개정 이력과 게에즈 어형을 따라 비교급보다 ‘악성을 증대시켰다’는 동적 의미를 살려 ‘매우 악하게 만들었다’로 옮겼습니다.
- source_word: ጽድቀ፡ ሎቱ፡ አውዶ
  english_pob_choice: there is no righteousness in him / around him
  chosen_korean: 그에게는 의가 없으며 … 그에게는 의가 전혀 없기 때문입니다
  alternatives_korean:
  - 그 주위에는 의가 없으며
  - 그에게는 의가 주위에 전혀 없으며
  lexicon: 의
  rationale: 말미의 ‘አውዶ’를 영어 주석처럼 ‘around him’으로 직역하기보다, 문맥상 ‘그를 둘러싼 곳에 의가 전혀 없다’는 강조를 한국어에서 반복 종결로 풀어 전달했습니다.
theological_decisions:
- issue: 악행과 의 없음의 이중 진술
  chosen_reading: ‘그에게는 의가 없으며’와 마지막 ‘그에게는 의가 전혀 없기 때문입니다’를 함께 살려, 악의 정도와 전면적 결핍을 둘 다 드러냈습니다.
  alternative_readings:
  - 마지막 구절을 하나로 압축해 중복을 줄이는 방식
  - ‘주위에 의가 없다’로 공간적 이미지를 강조하는 방식
  rationale: 게에즈 본문은 같은 판단을 반복·강화하므로, 한국어도 중복을 줄여 매끈하게 만들기보다 반복을 유지해 윤리적 단언의 힘을 보존했습니다.
  doctrine_reference: 본문의 도덕 평가와 문학적 강조를 보존하는 번역 원칙
- issue: 첫사랑/현재의 더 큰 사랑
  chosen_reading: “나는 맏아들로 태어난 때부터 야곱보다 에서를 먼저 사랑했지만, 이제는 에서보다 야곱을 더 사랑합니다”로 시간적 우선과 현재의 우선이 모두 드러나게 했습니다.
  alternative_readings:
  - ‘처음부터 에서를 더 사랑했지만’
  - ‘태어날 때부터 에서를 먼저 사랑했지만’
  rationale: 원문의 비교와 시간 부사가 모두 중요하므로, 단순한 ‘더 사랑했다’보다 ‘먼저 사랑했지만, 이제는 … 더 사랑합니다’로 대비를 분명히 했습니다.
  doctrine_reference: 서술 비교와 시간 대비를 보존하는 번역 원칙
