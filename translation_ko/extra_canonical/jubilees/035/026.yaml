  to: 나를 내 아버지 아브라함 곁, 헷 사람 에브론의 밭에 있는 쌍굴에 장사하십시오. 그곳은 아브라함이 가나안 땅에서 매장지로 마련한 곳입니다. 내가 나 자신을 위해 판 무덤, 바로 그곳에 나를 장사하십시오.
