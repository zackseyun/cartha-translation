  lexicon: 비뚤어짐
  rationale: 원문은 도덕적 '잘못'보다 곧지 않음/왜곡됨의 이미지를 가진 표현이어서, 그 긴장을 살리기 위해 '비뚤어짐'으로 옮겼습니다.
theological_decisions:
- issue: '''father and brother''의 호칭과 서술 대상'
  chosen_reading: 아버지와 형제
  alternative_readings:
