  lexicon: 아버지 / 형제
  rationale: 게에즈 본문은 'my father and my brother'로 읽히므로, 영어 POB의 수정된 독법을 따라 '어머니'가 아니라 '형제'로 옮겼습니다.
- source_word: አክብር
