translation:
  language: ko
  text: 당신께서 제게 명령하신 것은 제가 아버지와 형제를 공경하는 것이었습니다.[a] 그러니 제게서 어떤 비뚤어짐을 보셨는지 말씀해 주십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어머니’.
    reason: 일부 이전 번역의 대안 독법을 기록합니다. 그러나 현 게에즈 본문의 ወእኅየየ는 ‘나의 형제’를 뜻합니다.
lexical_decisions:
- source_word: አበየ፡ ወእኅየየ
  english_pob_choice: my father and my brother
  chosen_korean: 아버지와 형제
  alternatives_korean:
