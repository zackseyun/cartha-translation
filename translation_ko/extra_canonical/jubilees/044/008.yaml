    text: Or 'prepare'.
    reason: previous_rendering
  - marker: b
    text: Or 'it was good in the land of Egypt'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘은 자기 아들 요셉에게 유다를 앞서 보내어 고센 땅을 살펴보게 하였습니다[a]. 그곳에서 요셉이 자기 형제들에게 와서 거주하여 자기 가까이에 살도록 말하였기 때문입니다. 그곳은 이집트 땅에서 가장 좋은 곳이었으며[b], 그들 모두와 그들의 가축이 요셉 가까이에 머물기에 가까운 곳이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘준비하게 하다’.
    reason: 게에즈어 동사는 문맥상 ‘살펴보다, 조사하다’가 우선이지만, 전승 및 번역 관습에서는 ‘준비하다’로도 이해됩니다.
  - marker: b
    text: 직역하면 ‘이집트 땅에서 좋았다’.
    reason: 본문은 문맥과 비교·최상급의 뉘앙스를 반영하여 ‘가장 좋은 곳’으로 옮겼습니다.
