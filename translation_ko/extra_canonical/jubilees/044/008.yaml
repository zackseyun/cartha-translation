revisions:
- from: 이스라엘이 유다를 그의 아들 요셉에게 먼저 보내어 그가 고센 땅을 살펴보게 하였으니 이는 요셉이 그 형들에게 와서 거주하여 자기 가까이에 있으라 하였음이었더라. 그리고 그것은 이집트 땅에서 가장 좋은 것이었고 그들 모두와 그들의 가축을 위해 그에게 가까웠던 것이었습니다.
  to: 이스라엘은 자기 아들 요셉에게 유다를 앞서 보내어 고센 땅을 살펴보게 하였습니다[a]. 그곳에서 요셉이 자기 형제들에게 와서 거주하여 자기 가까이에 살도록 말하였기 때문입니다. 그곳은 이집트 땅에서 가장 좋은 곳이었으며[b], 그들 모두와 그들의 가축이 요셉 가까이에 머물기에 가까운 곳이었습니다.
  rationale: 원문의 어휘적 우선 의미에 따라 ‘살펴보게 하다’를 채택하고, 고센이 이집트 땅에서 가장 좋은 곳이며 요셉에게 가까운 곳이라는 정보를 한국어의 자연스러운 문장 구조로 명료화했습니다. 대안적 해석 가능성은 각주로 보존했습니다.
  reviewer_model: gpt-5.6-terra
