  text: 이스라엘이 유다를 그의 아들 요셉에게 먼저 보내어 그가 고센 땅을 살펴보게 하였으니 이는 요셉이 그 형들에게 와서 거주하여 자기 가까이에 있으라 하였음이었더라. 그리고 그것은 이집트 땅에서 가장 좋은 것이었고 그들 모두와 그들의 가축을 위해 그에게 가까웠던 것이었습니다.
