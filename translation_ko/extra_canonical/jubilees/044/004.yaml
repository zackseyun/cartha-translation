  yaml_path: translation/extra_canonical/jubilees/044/004.yaml
  text: And on the sixteenth the Lord appeared to him and said to him, “Jacob, Jacob.” And he said, “Here I am.”
translation:
  language: ko
  text: 그리고 십육일에 주님께서 그에게 나타나셔서 말씀하셨습니다. “야곱아, 야곱아.” 그가 말했습니다. “제가 여기 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 주
  lexicon: divine address / narrative title
  rationale: 서술문에서 신적 주어로 기능하는 표현이므로 한국어 합쇼체 서술에 자연스러운 ‘주님’을 택해 경외성과 가독성을 함께 살렸습니다.
- source_word: ያዕቆብ፡ ያዕቆብ፡
  english_pob_choice: Jacob, Jacob
  chosen_korean: 야곱아, 야곱아
  alternatives_korean:
  - 야곱, 야곱
  - 야곱이여, 야곱이여
  lexicon: proper noun + vocative
  rationale: 호격의 반복을 살리기 위해 호격 조사 ‘-아’를 붙였고, 성경적 인명 ‘야곱’을 현대 표기로 옮겼습니다.
- source_word: ነየ፡ አነ፡
  english_pob_choice: Here I am
  chosen_korean: 제가 여기 있습니다
  alternatives_korean:
  - 제가 여기 있나이다
  - 예, 제가 있습니다
  lexicon: response formula
  rationale: 현대 합쇼체에서 직접적이고 자연스러운 응답으로 옮기되, 존재 응답의 즉시성을 유지했습니다.
theological_decisions:
- issue: 신적 발화의 존칭 수준
  chosen_reading: 서술지문은 합쇼체로 두되, 하나님께 직접 드리는 기도문이 아니므로 ‘주님께서… 말씀하셨습니다’처럼 존칭 서술을 사용했습니다.
  alternative_readings:
  - 주께서… 말씀하셨습니다
  - 주님이… 말씀하셨습니다
  rationale: 본문은 야곱에게 임한 신현 서술이므로, 한국어 독자가 하나님의 주도성과 위엄을 분명히 인식하도록 했습니다.
  doctrine_reference: 신현 서술의 경외성 보존
