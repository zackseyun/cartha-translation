translation:
  language: ko
  text: 그리고 이스라엘은 집에서 떠나 셋째 달 초하루에 길을 나서서, 맹세의 우물 길로 갔으며, 이 달의 칠일에 자기 아버지 이삭의 하나님께 희생제사를 드렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስራኤል
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 야곱
  lexicon: 고유명사
  rationale: 본문의 주어는 인명 표지로서 이스라엘이 적합하며, 문맥상 야곱을 가리키더라도 여기서는 지칭 형태를 그대로 보존하는 편이 원문에 가깝습니다.
- source_word: እምካራን፡ እምቤቱ
  english_pob_choice: 'from Add a footnote: "Ge''ez reads Haran, a likely scribal error for Hebron.", from his house'
  chosen_korean: 집에서
  alternatives_korean:
  - 헤브론에서 그의 집에서
  - 하란에서
  lexicon: 지명/본문비평
  rationale: 게에즈 본문은 እምካራን(하란처럼 보이는 형태)과 እምቤቱ(그의 집에서)를 함께 전하지만, 영어 POB 주석처럼 문맥상 헤브론 오기 가능성이 있어 본문에는 의미가 분명한 ‘집에서’를 두고 지명 문제는 각주로 처리했습니다.
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  english_pob_choice: on the new moon of the third month
  chosen_korean: 셋째 달 초하루에
  alternatives_korean:
  - 셋째 달의 새달에
  - 셋째 달 신월에
  lexicon: 달력 용어
  rationale: ‘새달/신월’의 달력 의미를 한국어 관용으로 자연스럽게 풀어 ‘초하루’로 옮겨, 날짜 표지를 명확하게 했습니다.
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  english_pob_choice: the way of the Well of the Oath
  chosen_korean: 맹세의 우물 길
  alternatives_korean:
  - 맹세의 우물로 가는 길
  - 맹세의 우물의 길
  lexicon: 지명구
  rationale: ‘Well of the Oath’의 핵심 의미는 우물 이름이므로 직역하되, 한국어에서는 소유격보다 ‘~ 길’이 더 자연스러워 간결하게 처리했습니다.
- source_word: መሥዋዕተ
  english_pob_choice: a sacrifice
  chosen_korean: 희생제사
  alternatives_korean:
  - 제사
  - 희생제물
  lexicon: 제의 용어
  rationale: 단순한 ‘제물’이 아니라 하나님께 드리는 제의 행위를 가리키므로, 의미를 살려 ‘희생제사’로 옮겼습니다.
- source_word: አምላከ፡ አቡሁ፡ ይስሐቅ
  english_pob_choice: the God of his father Isaac
  chosen_korean: 자기 아버지 이삭의 하나님
  alternatives_korean:
  - 그의 아버지 이삭의 하나님
  - 아버지 이삭의 하나님
  lexicon: 소유/관계 표현
  rationale: ‘his father Isaac’의 관계를 한국어에서 자연스럽게 풀어 ‘자기 아버지 이삭’으로 번역해 소유 관계를 분명히 했습니다.
theological_decisions:
- issue: 본문의 지명 상이와 오기 가능성
  chosen_reading: 본문은 지명 문제를 본문 속에서 정정하지 않고, 의미를 해치지 않는 범위에서 번역한 뒤 각주로 게에즈 본문의 ‘하란’과 헤브론 오기 가능성을 알립니다.
  alternative_readings:
  - 하란을 그대로 본문에 반영
  - 헤브론으로 본문을 의역
  rationale: 영어 POB의 감사 흔적이 본문비평 문제를 명시하고 있으므로, 번역문은 읽기 쉽되 비평 정보는 각주로 보존해야 합니다.
  doctrine_reference: 본문비평/주석 원칙
