    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘은 셋째 달 초하루에 하란[a]의 자기 집에서 떠나 맹세의 우물 길로 갔습니다. 그리고 이 달 칠일에 자기 아버지 이삭의 하나님께 제사를 드렸습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 본문은 ‘하란’이라고 읽습니다. 문맥상 이는 ‘헤브론’의 필사 오류일 가능성이 큽니다.
    reason: 게에즈 본문의 지명 읽기를 보존하면서, 야곱의 출발지와 맹세의 우물로 가는 여정이라는 문맥에 근거한 본문비평적 문제를 독자에게 알립니다.
