  rationale: ‘his father Isaac’의 관계를 한국어에서 자연스럽게 풀어 ‘자기 아버지 이삭’으로 번역해 소유 관계를 분명히 했습니다.
theological_decisions:
- issue: 본문의 지명 상이와 오기 가능성
  chosen_reading: 본문은 지명 문제를 본문 속에서 정정하지 않고, 의미를 해치지 않는 범위에서 번역한 뒤 각주로 게에즈 본문의 ‘하란’과 헤브론 오기 가능성을 알립니다.
  alternative_readings:
  - 하란을 그대로 본문에 반영
