  text: 'And the sons of Zilpah[16], Leah’s maidservant, whom she bore to Jacob: Gad and Asher. And these are the names of their sons who came with him into Egypt. The sons of Gad: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli—seven.'
