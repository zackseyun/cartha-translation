translation:
  language: ko
  text: 그리고 레아의 여종 실바[16]가 야곱에게 낳은 아들들은 갓과 아셀입니다. 야곱과 함께 이집트로 들어간 그들의 아들들의 이름은 이러합니다. 갓의 아들들은 시브온, 학기, 수니, 에스본, 에리, 아로디, 아렐리, 곧 일곱 명입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '16'
    text: 갓의 아들 명단 가운데 한 이름은 제공된 원문 행 분절에서 일부 가려져 있습니다. 이 번역은 게에즈어 전승 및 창세기 전승에서 가장 개연적인 명단 순서를 따릅니다.
    reason: 제공된 원문 행 분절의 불완전성을 밝히고, 복원된 명단 순서의 근거를 제시하기 위함입니다.
