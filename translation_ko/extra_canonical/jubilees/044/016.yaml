  text: 그리고 레아의 여종 실바가 야곱에게 낳은 아들들은 갓과 아셀이다. 그와 함께 애굽으로 내려간 아들들의 이름은 이러하니라 갓의 아들들은 시브온, 학기, 수니, 에스본, 에리, 아로디, 아렐리 일곱이요
