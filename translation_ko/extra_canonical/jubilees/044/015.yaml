revisions:
- from: 이들은 메소포타미아에서 레아가 야곱에게 낳은 야곱의 아들들입니다. 여섯 명, 그의 누이 디나가 하나입니다. 그리고 레아의 아들들과 그들의 아버지 야곱과 함께 이집트로 온 그들의 아들들은 모두 삼십삼 명이었습니다. 그 아버지 야곱을 포함하여 그들의 나이는 삼십사 명이었더라
  to: 이들은 메소포타미아에서 레아가 야곱에게 낳은 아들들과 그들의 아들들입니다. 아들은 여섯 명이고, 그들의 누이 디나는 한 명입니다. 야곱 그들의 아버지와 함께 이집트로 온 레아의 아들들과 그들의 아들들은 모두 삼십삼 명이었습니다. 그들의 아버지 야곱을 그들 가운데 포함하면 모두 삼십사 명이었습니다.
  rationale: 원문의 계보 열거와 인원 계수를 보존하면서, ‘나이’라는 의미 오류를 ‘모두 삼십사 명’으로 바로잡았습니다. 디나는 여섯 아들과 별도로 한 명임을 분명히 했고, 전체 문장을 현대 한국어 합쇼체로 통일했습니다.
