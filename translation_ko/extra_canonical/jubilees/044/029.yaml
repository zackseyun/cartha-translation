translation:
  language: ko
  text: 아수디와 이약과 솔로몬까지 모두 여섯 명이었습니다. 그들은 이집트에 들어간 그 해에 죽었고, 다니에게는 남아 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
