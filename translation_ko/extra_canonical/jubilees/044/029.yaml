translation:
  language: ko
  text: 아수디와 이약과 솔로몬은 여섯이었습니다. 그들은 그들이 이집트에 들어간 해에 죽었고, 다니를 위해서는 남아 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአሱዲ፡ ወኢያክ፡ ወስሎሞን፡ ሲድስቱ።
  english_pob_choice: And Asudi, and Iyak, and Solomon were six.
  chosen_korean: 아수디와 이약과 솔로몬은 여섯이었습니다.
  alternatives_korean:
  - 아수디와 이약과 솔로몬은 여섯 명이었습니다.
  - 아수디와 이약과 솔로몬은 여섯이었습니다
  lexicon: 고유명사 음역
  rationale: 게에즈 본문의 인명은 현대 한국어 외래어 표기 관행에 맞게 음역했고, 수사 ‘여섯’은 원문의 단정적 진술을 살려 간결하게 옮겼습니다.
- source_word: ወሞቱ፡
  english_pob_choice: And they died
  chosen_korean: 그들은 ... 죽었고
  alternatives_korean:
  - 그들이 죽었고
  - 그들은 죽었습니다
  lexicon: 동사
  rationale: 서술 연결을 위해 과거형으로 옮기되, 다음 절과의 접속을 자연스럽게 하기 위해 ‘-었고’를 사용했습니다.
- source_word: በዓመተ፡ ቦኡ፡ በግብጽ፡
  english_pob_choice: in the year they entered Egypt
  chosen_korean: 그들이 이집트에 들어간 해에
  alternatives_korean:
  - 그들이 이집트에 들어온 해에
  - 그들이 이집트에 입국한 해에
  lexicon: 시간/이동 표현
  rationale: 문맥상 물리적 ‘들어감’이므로 ‘들어간 해’로 직역에 가깝게 유지했고, ‘이집트’는 통용 표기를 따랐습니다.
- source_word: ወተርፈ፡ ለዳን፡
  english_pob_choice: and there remained to Dan
  chosen_korean: 다니를 위해서는 남아 있었습니다
  alternatives_korean:
  - 다니에게 남아 있었습니다
  - 다니를 위해 남아 있었습니다
  - 다니에게는 남아 있었습니다
  lexicon: 동사구/전치사
  rationale: 게에즈의 intransitive ‘남아 있다’와 dative 전치사 ‘lă-’를 반영해 ‘~을 위해/에게 남아 있다’의 방향을 살렸습니다. 영어 POB의 주어 재구성을 따르지 않고, 잔여물이 ‘다니에게’ 속한다는 구조를 보존했습니다.
theological_decisions:
- issue: 문장 종료와 다음 절로 이어질 가능성
  chosen_reading: 현재 절은 ‘다니를 위해서는 남아 있었습니다’로 끝내어, 무엇이 남았는지는 다음 절로 열어 둡니다.
  alternative_readings:
  - ‘다니에게는 남아 있었습니다’처럼 더 일반적으로 처리
  - ‘다니에게 어떤 것이 남아 있었습니다’처럼 보충어를 추가
  rationale: 검토 메모가 지적하듯 원문은 ‘남아 있다’의 대상이 이 절 안에서 완결되지 않으므로, 의미를 임의로 보충하지 않고 열린 형태로 유지했습니다.
  doctrine_reference: 원문 충실성 및 절 경계 보존
