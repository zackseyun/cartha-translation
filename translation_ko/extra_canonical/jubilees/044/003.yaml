revisions:
- from: 그가 요셉에게 사람을 보내어 자신에게 오게 하고, 스스로 내려가지 않으려고 생각하는 동안, 거기서 칠 일 동안 머물며 환상 가운데서 자신이 머물러야 하는지, 아니면 내려가야 하는지를 보았습니다. 그리고 그는 오래된 곡식의 첫 수확의 추수 절기를 지켰습니다. 가나안 온 땅에는 어떤 씨앗도 한 움큼조차 땅에 남아 있지 않았기 때문입니다. 그 기근이 모든 짐승과 가축과 새들, 그리고 사람들에게까지 미쳤기 때문입니다.[a][b]
  to: 그가 요셉에게 사람을 보내어 자기에게 오게 하고, 자신은 내려가지 않으려고 생각하는 동안, 그는 거기서 칠 일 동안 머물며 환상을 통해 자신이 머물러야 할지 내려가야 할지를 알아보려고 하였습니다.[3] 그리고 그는 묵은 곡식의 첫 열매를 거두는 추수 절기를 지켰습니다. 이는 가나안 온 땅에 땅에 뿌릴 어떤 씨앗도 한 움큼조차 없었고, 기근이 모든 짐승과 가축과 새와 사람들에게 미쳤기 때문입니다.
  rationale: 환상을 ‘보기 위해’ 기다린 목적 표현으로 고치고, 난해한 첫 문장에는 본문 확정을 피하는 주석을 달았습니다. ‘추수’와 ‘첫 열매’를 모두 보존하되 자연스러운 한국어 어순으로 정리했으며, 기근과 씨앗 부족의 인과관계를 하나의 문장으로 매끄럽게 연결했습니다. 초안의 [a]·[b] 표지는 한국어 주석 내용이 제시되지 않았고 본문 번역에 필요한 변이 주석도 아니므로 제거하고, 원문 난해성을 설명하는 [3]만 유지했습니다.
