base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/003.yaml
  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
  footnotes:
  - marker: '3'
    text: The verse is textually difficult in the transmitted Ge'ez. The sense appears to be that Jacob waited seven days for a confirming vision and observed a firstfruits festival using old grain because the famine had consumed fresh produce.
    reason: textual_variant
  - marker: a
    text: Or 'because it had become for all the beasts and the livestock and the birds and also for men.'.
    reason: previous_rendering
  - marker: b
    text: Or 'the feast of the firstfruits'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 요셉에게 사람을 보내어 자신에게 오게 하고, 스스로 내려가지 않으려고 생각하는 동안, 거기서 칠 일 동안 머물며 환상 가운데서 자신이 머물러야 하는지, 아니면 내려가야 하는지를 보았습니다. 그리고 그는 오래된 곡식의 첫 수확의 추수 절기를 지켰습니다. 가나안 온 땅에는 어떤 씨앗도 한 움큼조차 땅에 남아 있지 않았기 때문입니다. 그 기근이 모든 짐승과 가축과 새들, 그리고 사람들에게까지 미쳤기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሔሊ ... ይልአክ ለዮሴፍ ከመ ይምጻእ ኀቤሁ
  english_pob_choice: considering sending to Joseph that he should come to him
  chosen_korean: 요셉에게 사람을 보내어 자신에게 오게 하고
  alternatives_korean:
  - 요셉에게 보내어 오게 하고
  - 요셉에게 사람을 보내어 자신이 오게 하고
  lexicon: send / come
  rationale: 원문은 단순한 ‘전갈을 보냄’이 아니라 요셉이 자기에게 오도록 보내는 뜻이어서, 주체와 도착 방향이 드러나도록 옮겼습니다.
- source_word: ወኢይረድ ውእቱ
  english_pob_choice: and not going down himself
  chosen_korean: 스스로 내려가지 않으려고
  alternatives_korean:
  - 자신이 내려가지 않고
  - 직접 내려가지 않으려고
  lexicon: go down
  rationale: 내려감의 주체를 분명히 하되, 서술의 흐름상 의도/결심의 뉘앙스를 살리기 위해 ‘-려고’로 옮겼습니다.
- source_word: ሰቡዐ ዕለተ
  english_pob_choice: seven days
  chosen_korean: 칠 일 동안
  alternatives_korean:
  - 일곱 날 동안
  - 칠 일
  lexicon: time period
  rationale: 성경 문체에 맞는 간결한 표현으로 기간을 유지했습니다.
- source_word: ራእየ
  english_pob_choice: in a vision
  chosen_korean: 환상 가운데서
  alternatives_korean:
  - 환상에서
  - 계시 가운데서
  lexicon: vision
  rationale: 원문이 지시하는 초자연적 시각 경험을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: ማእረረ፡ ቀዳሚ፡ ፍሬ
  english_pob_choice: the feast of the harvest of the firstfruits
  chosen_korean: 오래된 곡식의 첫 수확의 추수 절기
  alternatives_korean:
  - 옛 곡식의 첫 열매 추수 절기
  - 오래된 곡식의 첫 수확 절기
  lexicon: firstfruits harvest
  rationale: POB의 수정처럼 ‘harvest/추수’와 ‘firstfruits/첫 수확’의 두 요소를 모두 살렸고, ቀዳሚ(먼저 난, 처음의)를 ‘첫 수확’으로 반영했습니다.
- source_word: ዐባር
  english_pob_choice: the famine was upon all the beasts and the livestock and the birds and also upon men
  chosen_korean: 그 기근이 모든 짐승과 가축과 새들, 그리고 사람들에게까지 미쳤기 때문입니다
  alternatives_korean:
  - 그 기근이 모든 짐승과 가축과 새들과 사람들 위에 있었기 때문입니다
  - 기근이 모든 짐승과 가축과 새들과 사람들에도 있었습니다
  lexicon: famine upon
  rationale: 원문의 핵심은 기근의 보편적 타격이므로, ‘미쳤다’로 영향의 확산을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: ‘하나님/주’ 계열 용어가 없는 비정경 본문에서의 문체 유지
  chosen_reading: 직접 신학 용어를 덧입히지 않고, 서사적·제의적 표현을 중립적으로 유지했습니다.
  alternative_readings:
  - 절기 표현을 교회력처럼 해석적으로 풀기
  - 기근을 상징적으로 확장하기
  rationale: 이 절은 역사 서술과 제의 실천을 기록하므로, 해석을 과도하게 덧붙이지 않고 원문 범위 안에서 유지하는 것이 적절합니다.
  doctrine_reference: 문맥 충실성 및 본문 자의성 최소화
