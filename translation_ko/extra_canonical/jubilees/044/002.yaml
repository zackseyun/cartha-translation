  text: And Jacob remembered the dream that he had seen at Bethel, and he was afraid to go down into Egypt.
translation:
  language: ko
  text: 야곱은 벧엘에서 보았던 꿈을 기억하고, 이집트로 내려가기를 두려워했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּזְכֹּר / remembered
  english_pob_choice: remembered
  chosen_korean: 기억하고
  alternatives_korean:
  - 떠올리고
  - 생각해 내고
  lexicon: זכר
  rationale: 단순한 회상이 아니라 이전에 본 꿈을 마음에 다시 불러오는 의미를 자연스럽게 살리기 위해 ‘기억하고’로 옮겼습니다.
- source_word: חֲלֹם / dream
  english_pob_choice: the dream
  chosen_korean: 꿈을
  alternatives_korean:
  - 환상을
  - 몽시를
  lexicon: חלם
  rationale: 일반적이고 본문에 충실한 ‘꿈’을 사용했습니다.
- source_word: בֵּית־אֵל / Bethel
  english_pob_choice: Bethel
  chosen_korean: 벧엘에서
  alternatives_korean:
  - 베델에서
  lexicon: בֵּית־אֵל
  rationale: 성경에서 확립된 관용형인 ‘벧엘’을 유지했습니다.
- source_word: וַיִּירָא / he was afraid
  english_pob_choice: he was afraid
  chosen_korean: 두려워했습니다
  alternatives_korean:
  - 무서워했습니다
  - 겁을 냈습니다
  lexicon: ירא
  rationale: 영어 수정본이 ‘he was afraid’로 다듬은 감정 상태를 따라, 서술체에 맞는 ‘두려워했습니다’로 표현했습니다.
theological_decisions:
- issue: 이집트로 내려가기를 두려워한 야곱의 반응
  chosen_reading: 본문은 단순한 지리적 이동의 주저가 아니라, 벧엘의 꿈을 기억한 뒤 이집트로 내려가는 일을 두려워하는 내적 반응을 말합니다.
  alternative_readings:
  - 단순히 여행을 꺼린 것으로 읽을 수 있음
  - 미지의 환경에 대한 일반적 불안으로만 읽을 수 있음
  rationale: Geez 원문과 영어 본문 모두 ‘내려가기를 두려워함’을 명시하므로, 이를 약화하지 않고 야곱의 내적 두려움으로 그대로 드러냈습니다.
  doctrine_reference: 서사 본문 해석
