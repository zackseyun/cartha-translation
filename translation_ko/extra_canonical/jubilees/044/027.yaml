  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
  footnotes:
  - marker: '27'
    text: 'The chapter''s arithmetic is deliberate but not straightforward: it speaks of seventy entering Egypt, then seventy-five including descendants, and then explains that five died in Egypt, while Joseph and his two sons are excluded from that death notice.'
    reason: cross_reference
  - marker: a
    text: Or 'seventy-five,'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱의 식구들 가운데 이집트에 들어간 사람은 모두 칠십 명이었습니다. 이들은 그의 아들들과 그의 아들들의 아들들[27]로서, 모두 칠십오 명이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '27'
    text: 이 장의 인원 계산은 의도적으로 단순하지 않습니다. 이집트에 들어간 사람은 칠십 명이라고 하면서, 후손들을 포함하여 칠십오 명이라고도 말합니다. 이어서 이집트에서 다섯 명이 죽었다고 설명하며, 그 죽음의 언급에서는 요셉과 그의 두 아들은 제외됩니다.
    reason: cross_reference
