translation:
  language: ko
  text: 내가 너와 함께 내려가겠고 반드시 너를 다시 일으키리라. 그리고 네가 이 땅에 장사되고 요셉이 네 눈에 손을 얹을 것이다. 두려워하지 마십시오. 이집트로 내려가거라.”
  philosophy: optimal-equivalence
