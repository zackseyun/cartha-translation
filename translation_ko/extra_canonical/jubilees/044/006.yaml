review_pass:
  verdict: revise
  source_fidelity: 게에즈 본문은 하나님이 야곱에게 함께 이집트로 내려가며 그를 다시 올라오게 하겠다고 약속하고, 그 땅에서의 매장 및 요셉이 그의 눈에 손들을 얹을 일을 말합니다. 초안의 ‘다시 일으키리라’는 ‘다시 올라오게 하겠다’보다 의미가 넓고, 마지막 명령의 높임말이 앞선 인용문과 불일치합니다. 또한 게에즈의 복수 ‘손들’을 한국어에도 명시하는 편이 충실합니다.
  naturalness: ‘장사되고’와 ‘일으키리라’는 현대 표준어 합쇼체 성경문으로 다소 부자연스럽거나 고풍스럽습니다. ‘묻힐 것이며’, ‘다시 데리고 올라오겠다’, ‘내려가십시오’가 현대적이고 자연스럽습니다.
  terminology: ‘이집트’, ‘요셉’은 표준적인 현대 한국어 성경식 표기입니다. ‘눈 위에 두 손을 얹다’는 죽은 이의 눈을 감기는 행위를 묘사하되 해석을 본문에 덧붙이지 않습니다.
  issues:
  - severity: medium
    issue: ‘다시 일으키리라’는 원문의 ‘다시 올라오게 하겠다/데리고 올라오겠다’를 충분히 특정하지 못합니다.
    rationale: 여기서 ‘올라오다’는 이집트에서의 귀환을 가리키므로, 일반적인 ‘일으키다’보다 이동 방향을 보존해야 합니다.
  - severity: medium
    issue: ‘요셉이 네 눈에 손을 얹을 것이다’가 게에즈의 복수형을 단수로 바꿉니다.
    rationale: 원문은 ‘손들’이며, 영어 감사 이력도 이 복수형을 보존하도록 확정했습니다.
  - severity: low
    issue: 인용문 안에서 ‘내가 … 하겠다’와 ‘두려워하지 마십시오’/‘내려가거라’가 혼용됩니다.
    rationale: 목표 등록인 현대 합쇼체에 맞추어 명령도 ‘-십시오’로 통일하는 것이 자연스럽습니다.
  revised_text: 내가 너와 함께 내려가겠고, 반드시 너를 다시 데리고 올라오겠다. 네가 이 땅에 묻힐 것이며, 요셉이 네 눈 위에 두 손을 얹을 것이다. 두려워하지 마십시오. 이집트로 내려가십시오.”
  revised_footnotes:
  - marker: a
    text: 또는 ‘그의 손’.
    reason: 영어 감사 이력에 보존된 단수 독법의 대안을 제시하되, 게에즈 본문의 복수형에 따라 본문은 ‘두 손’으로 번역합니다.
  revision_rationale: 원문의 이동 동사와 손의 복수형을 보존하고, 현대 합쇼체로 문체를 일관되게 다듬었습니다. 매장과 눈에 손을 얹는 행위는 설명을 덧붙이지 않고 본문의 표현대로 유지했습니다.
