  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
  footnotes:
  - marker: a
    text: Or 'To Rachel, the wife of Jacob, were born to Jacob Dan and Naphtali.'.
    reason: previous_rendering
translation:
  language: ko
  text: '[그리고 이것은 라헬의 여종 빌하의 아들들의 이름입니다. 빌하는 야곱의 아내 라헬이 야곱에게 낳아 준 자입니다.] 단과 납달리입니다. 그리고 이것은 그들과 함께 이집트로 들어간 그들의 자녀들의 이름입니다. 단의 아들들은 후심과 사몬입니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለራሔል፡ ብእሲቱ፡ ለያዕቆብ፡ ዘወለደት፡ ለያዕቆብ
  english_pob_choice: of Rachel, the wife of Jacob, whom she bore to Jacob
  chosen_korean: 라헬의 여종 빌하… 야곱의 아내 라헬이 야곱에게 낳아 준 자
  alternatives_korean:
  - 라헬의 아내
  - 라헬이 야곱에게 낳은 자
  - 라헬의 여종
  lexicon: source_note
  rationale: 게에즈 본문은 문장 첫머리의 분절이 불완전해 보이지만, 영어 POB 주해와 수정 이력을 따라 ‘빌하, 라헬의 여종’이 생략된 것으로 보아 복원하는 것이 원문 의미를 가장 잘 보존합니다.
- source_word: ዳን፡ ወንፍታሌም።
  english_pob_choice: Dan and Naphtali
  chosen_korean: 단과 납달리
  alternatives_korean:
  - 단과 나프탈리
  - 단과 납달리
  lexicon: proper_name
  rationale: 일반적 성경 고유명사 표기를 따르되, 현대 표기에서 널리 통용되는 ‘납달리’를 사용했습니다.
- source_word: ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ
  english_pob_choice: who came with them into Egypt
  chosen_korean: 그들과 함께 이집트로 들어간
  alternatives_korean:
  - 그들과 함께 애굽으로 들어간
  - 그들과 함께 이집트에 들어간
  lexicon: cultural_note
  rationale: 지명 ‘이집트’는 현대 표준어 독자에게 직접적이어서 본문 문체에 맞게 옮겼습니다. ‘들어간’은 이동의 완료를 자연스럽게 나타냅니다.
- source_word: ወውሉደ፡ ዳን፡ ሑሲም፡ ወሳሞን።
  english_pob_choice: 'the sons of Dan: Hushim and Samon'
  chosen_korean: 단의 아들들은 후심과 사몬
  alternatives_korean:
  - 단의 아들들은 후심과 사몬
  - 단의 아들들은 후심과 사몬이었습니다
  lexicon: proper_name
  rationale: 인명은 음역을 유지하고, 목록문의 간결한 병렬을 살리기 위해 서술형보다 명사구로 처리했습니다.
theological_decisions:
- issue: 라헬과 빌하의 관계를 어떻게 드러낼 것인가
  chosen_reading: 본문은 라헬을 중심으로 말하지만, 실제 출산 주체가 빌하라는 점을 ‘라헬의 여종 빌하’로 드러냈습니다.
  alternative_readings:
  - 라헬이 야곱에게 낳아 준 자
  - 라헬이 낳은 자
  rationale: 영어 POB의 보정 주해와 개정 이력은 이 구절이 라헬의 직접 출산이 아니라 빌하의 출산을 가리킨다고 봅니다. 한국어 본문도 그 긴장을 지워 버리지 않도록 했습니다.
  doctrine_reference: source-critical textual alignment
