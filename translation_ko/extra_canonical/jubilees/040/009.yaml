  language: en
  yaml_path: translation/extra_canonical/jubilees/040/009.yaml
  text: And the land of Egypt prospered before Pharaoh because of Joseph, for the Lord was with him and gave him favor and mercy over all his generation, in the sight of all who knew him and all who heard of him. And Pharaoh’s kingdom was well ordered, and there was no adversary and no evil.
  footnotes:
  - marker: a
    text: Or 'before all his kin'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 요셉 때문에 이집트 땅이 파라오 앞에서 번성하였습니다. 주님께서 그와 함께 계셨고, 그에게 그의 모든 동시대 사람들[a]보다 더 큰 호의와 자비를 베푸셨습니다. 그를 아는 모든 사람과 그에 대하여 듣는 모든 사람이 보는 앞에서 그러하였습니다. 파라오의 나라에는 질서가 잘 잡혀 있었고, 대적도 없었으며 악도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 모든 친족들’.
    reason: 게에즈어 ዘመዱ는 본문 문맥과 영어 POB의 주된 판단에 따라 ‘그의 세대/동시대 사람들’로 옮겼으나, 기존 영어 POB 감사 기록의 대안 독법 ‘his kin’을 보존합니다.
lexical_decisions:
- source_word: ትሠናአወት / prospered
  english_pob_choice: prospered
  chosen_korean: 번성하였습니다
  alternatives_korean:
  - 잘되었습니다
  - 평안하였습니다
  - 번영하였습니다
  lexicon: prosper
  rationale: Ge'ez 동사의 결과를 단순한 평안보다 적극적인 번성으로 옮겨, POB의 revised English choice를 살렸습니다.
- source_word: ምስሌሁ / the Lord was with him
  english_pob_choice: the Lord was with him
  chosen_korean: 주님께서 그와 함께 계셨고
  alternatives_korean:
  - 주님이 그와 함께하셨고
  - 주께서 그와 함께 계셨고
  lexicon: be with
  rationale: 동행의 지속성을 자연스럽게 드러내기 위해 '함께 계셨고'를 택했습니다.
- source_word: ሞገሰ ወምሕረተ / favor and mercy
  english_pob_choice: favor and mercy
  chosen_korean: 호의와 자비
  alternatives_korean:
  - 은혜와 긍휼
  - 호의와 긍휼
  lexicon: favor / mercy
  rationale: 문맥상 왕 앞에서 얻은 호의와 자비를 표준어로 간결하게 살렸습니다.
- source_word: ዘመዱ / his generation
  english_pob_choice: over all his generation
  chosen_korean: 자신이 속한 모든 세대
  alternatives_korean:
  - 모든 세대
  - 그의 세대 전체
  - 모든 동시대 사람들
  lexicon: generation
  rationale: 주어진 주석과 수정 이력을 반영해 ዘመድ을 '세대'로 옮기고, 한국어에서는 '자신이 속한'을 보탠 형태로 문맥을 분명히 했습니다.
- source_word: ወረጐዐት መንግሥተ ፈርዖን
  english_pob_choice: Pharaoh’s kingdom was well ordered
  chosen_korean: 파라오의 나라는 잘 다스려졌고
  alternatives_korean:
  - 파라오의 나라는 잘 정돈되었고
  - 파라오의 나라는 질서정연하였고
  lexicon: well ordered
  rationale: 단순한 상태 묘사보다 통치 질서가 바로 섰다는 의미가 드러나도록 수동형으로 옮겼습니다.
theological_decisions:
- issue: 혼재된 번영과 질서의 신학적 초점
  chosen_reading: 요셉의 존재로 인해 이집트와 파라오의 나라가 실제로 복되게 정돈되고 번성했다는 서술로 읽었습니다.
  alternative_readings:
  - 단순한 정치적 안정의 묘사
  - 개인 요셉의 성공담
  rationale: 본문은 하나님의 동행이 사회적·정치적 결과로 나타난다는 점을 강조하므로, 번성과 질서를 함께 살려 신학적 긴장을 유지했습니다.
  doctrine_reference: 하나님의 섭리와 복의 확장
- issue: 마지막 구절의 악 부정
  chosen_reading: '''대적도 없었으며 악도 없었습니다''로 옮겨, 단순히 한 인격체가 아니라 악 자체의 부재를 드러냈습니다.'
  alternative_readings:
  - 악한 자도 없었습니다
  - 악인도 없었습니다
  rationale: Ge'ez의 እኩየ는 일반적 '악'의 의미가 자연스러우므로, POB의 revised English처럼 인격화된 '악한 자'로 좁히지 않았습니다.
  doctrine_reference: 악의 부재와 질서의 회복
