revisions:
- from: 그는 바로바로에게 말했습니다. 두 꿈은 하나라고 말하고 그에게 이르기를, “애굽 온 땅에 칠 년의 풍년이 올 것이며, 그 뒤에 칠 년의 기근이 올 것인데, 그것은 온 땅에 없었던 그런 기근입니다.”[a]
  to: 그는 바로 앞에서 두 꿈은 하나라고 말하고, 그에게 이렇게 말했습니다. “애굽 온 땅에 칠 년 동안 풍년이 들 것이며, 그 뒤에[a] 칠 년 동안 기근이 올 것인데, 온 땅에 없었던 그런 기근이 될 것입니다.”
  rationale: 명백한 중복 오자를 제거하고 ‘바로 앞에서’로 원문의 장소·상황 관계를 복원했습니다. 두 차례의 발화 구조는 유지하되 한국어 직접화법으로 자연스럽게 다듬었습니다. ‘칠 년 동안’을 두 번 사용하여 기간을 명시했고, 마지막 비교절은 원문의 전례 없는 기근이라는 뜻을 보존했습니다. 각주 표지는 관련 시간 표현 바로 뒤로 옮겼습니다.
