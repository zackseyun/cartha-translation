  - 풍족함
  lexicon: 농경어휘
  rationale: 문맥이 애굽의 수확과 이어지므로 ‘풍년’이 가장 자연스럽고 의미도 분명합니다.
- source_word: ወእምድኅረዝ
  english_pob_choice: after this
  chosen_korean: 그 뒤에
  alternatives_korean:
