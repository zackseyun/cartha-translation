  - 그 다음에
  lexicon: 시간표현
  rationale: 개정된 POB가 반영한 대로 원문의 지시적 시간표현을 한국어의 자연스러운 ‘그 뒤에’로 옮겼습니다.
- source_word: ረኃብ
  english_pob_choice: famine
  chosen_korean: 기근
