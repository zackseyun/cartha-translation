translation:
  language: ko
  text: 그는 바로바로에게 말했습니다. 두 꿈은 하나라고 말하고 그에게 이르기를, “애굽 온 땅에 칠 년의 풍년이 올 것이며, 그 뒤에 칠 년의 기근이 올 것인데, 그것은 온 땅에 없었던 그런 기근입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርዖን
  english_pob_choice: Pharaoh
  chosen_korean: 바로
  alternatives_korean:
  - 파라오
  - 애굽 왕
  lexicon: 고유명사
  rationale: 히브리어·고전 번역 전통과 POB의 평이한 역사 서술을 따라 ‘바로’를 사용했습니다.
- source_word: ክልኤሆሙ ሕለመሁ አሐዱ እሙንቱ
  english_pob_choice: both his dreams were one
  chosen_korean: 두 꿈은 하나라고
  alternatives_korean:
  - 두 꿈은 하나였습니다
  - 두 꿈은 같은 하나였습니다
  lexicon: 의미구문
  rationale: 꿈 둘의 동일성을 간결하게 드러내는 직역적 구성으로 옮겼습니다.
- source_word: ወይቤሎ
