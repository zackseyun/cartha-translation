  text: And he said before Pharaoh that both his dreams were one, and he said to him, “Seven years of abundance will come in all the land of Egypt, and after this seven years of famine, such famine as has not been in all the earth.”
  footnotes:
  - marker: a
    text: Or 'after them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 바로 앞에서 두 꿈은 하나라고 말하고, 그에게 이렇게 말했습니다. “애굽 온 땅에 칠 년 동안 풍년이 들 것이며, 그 뒤에[a] 칠 년 동안 기근이 올 것인데, 온 땅에 없었던 그런 기근이 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들 뒤에’.
    reason: 원문의 지시 표현은 직역하면 ‘이것 뒤에’이지만, 앞선 칠 년을 가리켜 ‘그것들 뒤에’로 이해할 수도 있다는 영어 POB 감사 기록의 대안 독법을 보존합니다.
lexical_decisions:
