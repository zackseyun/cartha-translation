  - 그에게 말했습니다
  lexicon: 서술동사
  rationale: 이중 발화 구조를 자연스럽게 살리되, 뒤의 직접화법 도입과 맞게 정리했습니다.
- source_word: ጽጋብ
  english_pob_choice: abundance
  chosen_korean: 풍년
  alternatives_korean:
