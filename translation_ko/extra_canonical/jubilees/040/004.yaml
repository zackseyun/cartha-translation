  rationale: 반복되는 재앙의 강도를 살리기 위해 ‘기근’을 택했습니다.
theological_decisions:
- issue: 직접화법의 위상과 예언적 선언의 톤
  chosen_reading: 직접화법을 따옴표로 분리하고, 예언 선언은 담담한 미래 진술로 처리했습니다.
  alternative_readings:
  - 예언투를 더 강하게 살린 선언형
  - 간접화법으로 완만하게 처리
  rationale: 본문은 예언 해석을 전달하는 서술이므로 과장된 종교어휘를 덧씌우지 않고, 원문의 통보적·예언적 기능을 보존했습니다.
  doctrine_reference: 서술/예언 화행 보존
- issue: ‘온 땅’과 ‘애굽 온 땅’의 범위 표현
  chosen_reading: ‘애굽 온 땅’과 ‘온 땅에 없었던’으로 구분했습니다.
  alternative_readings:
  - ‘이집트 전역’
  - ‘세상에 없었던’
  rationale: 첫 번째는 지역 범위, 두 번째는 비교 범위를 가리키므로 같은 표현으로 평평하게 만들지 않고 원문의 대비를 유지했습니다.
  doctrine_reference: 문맥적 의미 보존
