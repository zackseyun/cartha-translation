  yaml_path: translation/extra_canonical/jubilees/040/008.yaml
  text: And Joseph went out through all the land of Egypt, and all Pharaoh’s princes loved him, and all his servants, and all who did the king’s work, because he walked uprightly and there was no pride, or arrogance of heart, or partiality, and no taking of bribes; for he judged uprightly for all the peoples of the earth.
  footnotes:
  - marker: a
    text: Or 'or haughtiness of face, or partiality in his thoughts'.
    reason: previous_rendering
translation:
  language: ko
  text: 요셉은 이집트 온 땅을 두루 다녔고, 파라오의 모든 고관과 그의 모든 신하와 왕의 일을 하는 모든 사람이 그를 사랑하였습니다. 그가 바르게 행하였으며 교만도, 마음의 오만도, 편파도, 뇌물을 받는 일도 없었기 때문입니다. 그는 온 땅의 모든 민족에게 공정하게 판결을 내렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኳንንቲሁ ለፈርዖን / لآእካኒሁ / እለ ይገብሩ ግብረ ንጉሥ
  english_pob_choice: all Pharaoh’s princes / all his servants / all who did the king’s work
  chosen_korean: 파라오의 모든 방백 / 모든 신하 / 왕의 일을 하는 모든 이
  alternatives_korean:
  - 파라오의 모든 고관 / 모든 종 / 왕의 일을 하는 모든 사람
  - 파라오의 모든 귀족 / 모든 일꾼 / 왕의 일을 맡은 자들
  lexicon: 방백, 신하, 일하다/일을 하다
  rationale: Geez 원문은 파라오의 지배층과 궁정 종사자, 그리고 왕의 일을 수행하는 이들을 차례로 나열하므로, 위계와 기능을 함께 살리는 표현으로 옮겼습니다.
- source_word: ወአፍቀርዎ
  english_pob_choice: loved him
  chosen_korean: 그를 사랑하였습니다
  alternatives_korean:
  - 그를 좋아하였습니다
  - 그를 호의로 대하였습니다
  lexicon: 사랑하다
  rationale: 원문의 강한 호감 표현을 약화하지 않고, 영어 POB의 loved him에 맞추어 직접적으로 옮겼습니다.
- source_word: ርቱዐ የሐውር
  english_pob_choice: he walked uprightly
  chosen_korean: 그는 바르게 걸었고
  alternatives_korean:
  - 그는 정직하게 행했고
  - 그는 올곧게 걸었고
  lexicon: 바르게 걷다 / 행하다
  rationale: 직역적으로는 '걸었다'이지만, 비유적으로 삶의 행실 전체를 가리키므로 한국어에서도 행실의 정직성을 드러내는 '바르게 걸었고'를 택했습니다.
- source_word: ወአልቦ ትዕቢተ ወአዐብዮ ልብ
  english_pob_choice: no pride, or arrogance of heart
  chosen_korean: 교만도, 마음의 오만도
  alternatives_korean:
  - 교만도, 마음의 거만도
  - 교만도, 속마음의 오만도
  lexicon: 교만, 오만, 마음
  rationale: 두 개의 병렬 표현을 살려 '교만'과 '마음의 오만'으로 구분했고, source의 심장/내면 강조를 자연스럽게 반영했습니다.
- source_word: ወአሢሦተ፡ ገጽ / ወአልቦ ነሢአ፡ ሕልያነ
  english_pob_choice: partiality / no taking of bribes
  chosen_korean: 편파도, 뇌물을 받음도
  alternatives_korean:
  - 편애도, 뇌물을 받음도
  - 사람을 가림도, 뇌물을 받음도
  lexicon: 편파, 뇌물
  rationale: 개정된 영어 POB가 드러내듯 첫 표현은 '편파/편애'이며, 둘째는 '뇌물을 받음'입니다. 한국어도 재판 문맥을 유지해 공정성의 결핍을 분명히 했습니다.
theological_decisions:
- issue: 요셉의 통치적 성품을 도덕적 미화가 아니라 재판의 공정성으로 표현할지 여부
  chosen_reading: 마지막 절을 '그는 땅의 모든 백성에게 바르게 판결하였습니다'로 옮겨, 단순한 인격 칭찬이 아니라 공적 판결의 공정성을 드러냈습니다.
  alternative_readings:
  - 그는 땅의 모든 백성을 공정하게 다스렸습니다
  - 그는 땅의 모든 민족을 올바르게 판단했습니다
  rationale: 원문은 '모든 땅의 민족들에게'에 대해 '올바르게 판단하였다'는 사법적 진술을 하므로, 통치 전반보다 판결의 정당성을 살리는 번역이 더 source-direct입니다.
  doctrine_reference: 공의/재판의 공정성
