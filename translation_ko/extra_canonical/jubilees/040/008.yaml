revisions:
- from: 요셉은 온 이집트 땅으로 나아갔고, 파라오의 모든 방백과 모든 신하와 왕의 일을 하는 모든 이가 그를 사랑하였습니다. 그는 바르게 걸었고, 교만도, 마음의 오만도, 편파도, 뇌물을 받음도 없었기 때문입니다. 그는 땅의 모든 백성에게 바르게 판결하였습니다.[a]
  to: 요셉은 이집트 온 땅을 두루 다녔고, 파라오의 모든 고관과 그의 모든 신하와 왕의 일을 하는 모든 사람이 그를 사랑하였습니다. 그가 바르게 행하였으며 교만도, 마음의 오만도, 편파도, 뇌물을 받는 일도 없었기 때문입니다. 그는 온 땅의 모든 민족에게 공정하게 판결을 내렸습니다.
  rationale: 원문의 병렬 열거와 인과 관계를 유지하면서, 이동의 범위(‘온 땅을 두루’), 윤리적 행실의 비유(‘바르게 행하다’), 파라오에게 속한 신하들, 그리고 공정한 사법 행위를 현대 한국어 합쇼체로 자연스럽게 정리했습니다. 원문 및 영어 POB가 채택한 ‘편파’와 ‘뇌물을 받음’을 그대로 보존했으므로 별도 각주는 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
