  text: Then the chief cupbearer remembered Joseph and spoke about him to the king, and he brought him out from the prison house, and he told before him both his dreams.
  footnotes:
  - marker: a
    text: Or 'both dreams'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러고 나서 술 맡은 관원장이 요셉을 기억하고 왕에게 그에 대해 말하였고, 그를 감옥에서 데리고 나오게 하였으며, 그의 두 꿈을 왕 앞에서 말하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ መዘርት
  english_pob_choice: chief cupbearer
  chosen_korean: 술 맡은 관원장
  alternatives_korean:
  - 수석 술 시종
  - 술잔 맡은 자
  lexicon: 장관/궁정 관직명
  rationale: Geez의 관직 표현을 한국어로 자연스럽게 옮기되, 술을 맡아 왕을 섬기는 궁정 관직이라는 기능을 분명히 드러냈습니다.
- source_word: ተዘከረ
  english_pob_choice: remembered
  chosen_korean: 기억하고
  alternatives_korean:
  - 떠올리고
  - 기억하였고
  lexicon: 동사
  rationale: 단순한 회상이 아니라 이후 행동을 촉발하는 기억의 전환을 살려 자연스럽게 연결했습니다.
- source_word: እምቤተ ሞቅሕ
  english_pob_choice: from the prison house
  chosen_korean: 감옥에서
  alternatives_korean:
  - 옥에서
  - 감옥 집에서
  lexicon: 장소 표현
  rationale: 직역형의 ‘감옥 집’은 한국어에서 부자연스러우므로, 의미를 유지하면서도 읽기 쉬운 ‘감옥에서’로 옮겼습니다.
- source_word: ሕለመሁ
  english_pob_choice: his dreams
  chosen_korean: 그의 두 꿈
  alternatives_korean:
  - 두 꿈
  - 자신의 두 꿈
  lexicon: 소유 표현
  rationale: Ge'ez의 인칭 소유 접미사가 가리키는 소유 관계를 반영해 ‘그의’를 살렸고, 앞선 수량 표현도 함께 드러냈습니다.
theological_decisions:
- issue: 꿈의 소유 표현과 서술 초점
  chosen_reading: ‘그의 두 꿈’으로 요셉의 꿈을 분명히 하되, 본문이 강조하는 것은 해석 내용이 아니라 왕 앞에서 꿈을 진술하는 사건으로 보았습니다.
  alternative_readings:
  - ‘두 꿈’으로 소유를 덜 드러내는 읽기
  - ‘자기의 두 꿈’으로 더 설명적인 읽기
  rationale: Ge'ez 본문은 요셉의 꿈을 지시하지만, 이야기의 초점은 요셉의 정체 회복과 왕 앞 진술에 있으므로 과도한 해설을 피했습니다.
  doctrine_reference: 본문 내러티브의 문자적-서사적 초점
- issue: 관원장과 왕 사이의 궁정 서술
  chosen_reading: 궁정 행정과 왕 앞 진술의 순서를 그대로 보존했습니다.
  alternative_readings:
  - 문맥을 풀어 ‘왕에게 알렸다’로 단순화
  - 서술을 압축해 한 문장으로 재구성
  rationale: 연속 동사를 유지해야 사건의 진행과 중개 역할이 드러나므로, 서사적 리듬을 보존했습니다.
  doctrine_reference: 서사 문맥 보존 원칙
