  source_fidelity: 게에즈어는 술 맡은 관원장이 요셉을 기억하여 왕에게 그에 관해 말하고, 그를 감옥에서 나오게 한 뒤 ‘그의 두 꿈’을 왕 앞에서 말한 것으로 서술합니다. ሕለመሁ의 남성 단수 소유 접미사는 ‘그의’를 뒷받침하므로 이를 유지했습니다. 마지막 동사의 주어는 문맥상 다소 압축되어 있으므로, 초안처럼 접속된 서술 구조를 보존하여 불필요하게 주어를 특정하지 않았습니다.
  naturalness: 초안의 ‘데리고 나오게 하였으며’는 한국어에서 제3자에게 출옥을 지시했다는 강한 사역 의미를 낼 수 있습니다. 원문의 타동사적 ‘그를 감옥에서 데리고 나오다’를 자연스럽게 나타내도록 ‘데리고 나왔으며’로 고쳤습니다. 또한 문장 안에서 ‘말하였고’와 종결형 ‘말하였습니다’의 시제·문체 흐름을 더 매끄럽게 정리했습니다.
  terminology: ‘술 맡은 관원장’은 궁정의 chief cupbearer를 현대 한국어로 기능상 명료하게 옮긴 적절한 표현입니다. ‘감옥’, ‘왕 앞에서’, ‘그의 두 꿈’도 원문의 장소·궁정 맥락·소유 및 수량 표현을 충실히 반영합니다.
