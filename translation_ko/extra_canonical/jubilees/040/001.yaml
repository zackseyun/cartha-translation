base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/001.yaml
  text: 'And it happened to them just as he had interpreted for them: Pharaoh restored the chief cupbearer to his office, and he killed the baker, as Joseph had interpreted for them. And the chief cupbearer left Joseph in the prison house, even though he had informed him of what would happen, and he did not remember to inform Pharaoh of what Joseph had told him, for he forgot.'
  footnotes:
  - marker: a
    text: Or 'forgot Joseph in the prison house, though he knew what would happen'.
    reason: previous_rendering
  - marker: b
    text: Or 'And it happened just as Joseph had interpreted for them:'.
    reason: previous_rendering
  - marker: c
    text: Or 'the chief baker'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들에게 해석해 준 대로 일이 그렇게 되었습니다.[b] 바로는 술 맡은 관리자를 그의 직무로 복귀시키고, 빵 굽는 사람을 죽였습니다.[c] 요셉이 그들에게 해석해 준 대로였습니다. 그리고 술 맡은 관리자는 요셉이 그에게 앞으로 일어날 일을 알려 주었는데도 요셉을 감옥에 남겨 두었고,[a] 요셉이 그에게 말한 것을 바로에게 알릴 것을 기억하지 못했습니다. 그가 잊어버렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “앞으로 일어날 일을 알고 있었지만, 요셉을 감옥에 잊어버려 두었다.”
    reason: 이전 번역의 대안 독법을 보존합니다. 본문은 ወረሰዮ를 ‘남겨 두었다’로 옮겨 ረሳዐ(‘잊었다’)와 구별합니다.
  - marker: b
    text: 또는 “요셉이 그들에게 해석해 준 대로 일이 그렇게 되었습니다.”
    reason: 첫 절의 대명사 ‘그’가 요셉을 가리킨다는 명시적 번역 가능성을 제시합니다.
  - marker: c
    text: 또는 “빵 굽는 수석 관리자를 죽였습니다.”
    reason: 게즈어 본문은 단지 ‘빵 굽는 사람’을 뜻하므로 본문에는 이를 따르되, 이전 번역의 대안을 각주로 보존합니다.
lexical_decisions:
- source_word: ፈከረ / ወበከመ ፈከረ ሎሙ
  english_pob_choice: as he had interpreted for them
  chosen_korean: 그들에게 해석해 준 대로
  alternatives_korean:
  - 그들에게 풀이해 준 대로
  - 그들에게 해몄던 대로
  lexicon: 해석하다
  rationale: 예언적·꿈 해석 맥락에서 ‘해석하다’가 가장 직접적이며, 반복되는 구문도 자연스럽게 살립니다.
- source_word: ሊቀ፡ መዘርት
  english_pob_choice: the chief cupbearer
  chosen_korean: 술 맡은 관리자
  alternatives_korean:
  - 술 맡은 관원
  - 술잔을 맡은 수석 관원
  lexicon: 술 맡은 자 / 관원
  rationale: 기능을 드러내면서도 과도하게 제도화된 교회용어를 피하기 위해 ‘술 맡은 관리자’로 옮겼습니다.
- source_word: ሐባዚስ
  english_pob_choice: the baker
  chosen_korean: 빵 굽는 사람
  alternatives_korean:
  - 제빵사
  - 빵 굽는 이
  lexicon: 제빵 관련 직무 명칭
  rationale: Ge'ez가 ‘chief’를 쓰지 않아 단순히 직무명만 반영해야 하므로 ‘빵 굽는 사람’이 가장 무난합니다.
- source_word: አይድዖ
  english_pob_choice: he had informed him of what would happen
  chosen_korean: 그에게 앞으로 일어날 일을 알려 주었는데도
  alternatives_korean:
  - 그에게 무슨 일이 일어날지 말해 주었는데도
  - 그에게 장차 있을 일을 알려 주었는데도
  lexicon: 알리다 / 알려 주다
  rationale: 이 동사는 ‘알다’가 아니라 ‘알리다’의 사역 의미이므로, 요셉이 술 맡은 관리자에게 알려 준 행위를 분명히 드러냅니다.
- source_word: ወረሰዮ / ረሳዐ
  english_pob_choice: left Joseph in the prison house ... for he forgot
  chosen_korean: 요셉을 옥중에 남겨 두었고 ... 그는 잊어버렸기 때문입니다
  alternatives_korean:
  - 요셉을 감옥에 두었고 ... 그는 잊었기 때문입니다
  - 요셉을 감옥에 버려 두었고 ... 그는 잊어버렸기 때문입니다
  lexicon: 남겨 두다 / 잊어버리다
  rationale: 먼저 나오는 동사는 ‘잊다’가 아니라 ‘남겨 두다/두다’이고, 마지막의 ረሳዐ만 ‘잊다’이므로 두 표현을 구분해 번역해야 합니다.
theological_decisions:
- issue: 본문의 마지막 원인절과 앞선 행위절의 구분
  chosen_reading: 술 맡은 관리자가 요셉을 ‘잊은’ 것이 아니라, 먼저 그를 감옥에 남겨 두었고 그 뒤에 약속을 잊었습니다.
  alternative_readings:
  - 요셉을 잊어버렸다
  - 요셉을 감옥에 두었으나 사실상 잊었다
  rationale: 게즈 본문은 서로 다른 두 동사(‘남겨 두다’와 ‘잊다’)를 사용하므로, 사건의 진행과 책임 소재를 흐리지 않도록 구분해 살렸습니다.
  doctrine_reference: source-text fidelity
