revisions:
- from: 그리고 그들에게 해석해 준 대로 일이 그렇게 되었습니다. 바로아는 술 맡은 관리자를 그의 직무로 복귀시키고, 빵 굽는 사람을 죽였습니다. 요셉이 그들에게 해석해 준 대로였습니다. 그러나 술 맡은 관리자는 요셉이 그에게 앞으로 일어날 일을 알려 주었는데도 요셉을 옥중에 남겨 두었고, 요셉이 그에게 말한 것을 바로아에게 알리도록 기억하지 않았습니다. 그는 잊어버렸기 때문입니다.[a][b][c]
  to: 그리고 그들에게 해석해 준 대로 일이 그렇게 되었습니다.[b] 바로는 술 맡은 관리자를 그의 직무로 복귀시키고, 빵 굽는 사람을 죽였습니다.[c] 요셉이 그들에게 해석해 준 대로였습니다. 그리고 술 맡은 관리자는 요셉이 그에게 앞으로 일어날 일을 알려 주었는데도 요셉을 감옥에 남겨 두었고,[a] 요셉이 그에게 말한 것을 바로에게 알릴 것을 기억하지 못했습니다. 그가 잊어버렸기 때문입니다.
  rationale: 고유명 표기를 ‘바로’로 바로잡고, 원문에 없는 대조 접속사 ‘그러나’를 제거했습니다. 또한 ‘기억하지 않았다’의 목적 구문을 자연스러운 현대 한국어로 다듬었으며, 각주 표지를 해당 구절에 배치했습니다. 본문은 ‘남겨 두다’와 ‘잊다’라는 서로 다른 게즈어 동사를 계속 구별합니다.
