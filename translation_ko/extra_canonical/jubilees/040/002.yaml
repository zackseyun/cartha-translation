  source_fidelity: 게에즈어의 ‘한 밤에’(በአሐቲ ሌሊት)는 ‘한밤에/한밤중에’가 아니라 ‘하룻밤에, 한 밤 동안’이라는 뜻입니다. 또한 마지막 절은 해석자들과 점술가들이 그 꿈들을 이해하지 못했다는 뜻을 자연스럽게 유지해야 합니다.
