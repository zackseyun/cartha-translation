  text: And in those days Pharaoh dreamed two dreams in one night concerning the matter of the famine that would come upon all the earth. And he awoke from his sleep and called all the interpreters of dreams who were in Egypt, and the diviners, and he told them both his dreams, but they were not able to understand.
translation:
  language: ko
  text: 그리고 그때에 파라오가 온 땅에 임할 기근의 일에 관한 두 꿈을 한밤에 꾸었습니다. 그리고 그는 잠에서 깨어나 이집트에 있는 모든 꿈 해석자들과 점술가들을 불러, 자기의 두 꿈을 그들에게 말했으나, 그들은 이해하지 못했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርዖን
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  lexicon: 고유명사
  rationale: 게에즈 본문과 영어 POB의 고유명사를 따라, 한국어에서는 이집트 왕호를 현대 음역인 파라오로 옮겼습니다.
- source_word: ሕለመ ክልኤተ በአሐቲ ሌሊት
  english_pob_choice: dreamed two dreams in one night
  chosen_korean: 한밤에 두 꿈을 꾸었습니다
  alternatives_korean:
  - 하룻밤에 두 꿈을 꾸었습니다
  - 한밤중에 두 꿈을 꾸었습니다
  lexicon: 어휘/표현
  rationale: ‘한 밤에’라는 시간 표현과 꿈의 수량을 자연스럽게 살리되, 원문의 ‘두 꿈’을 분명히 드러냈습니다.
- source_word: መፈክራነ ሕልም
  english_pob_choice: interpreters of dreams
  chosen_korean: 꿈 해석자들
  alternatives_korean:
  - 꿈 풀이자들
  - 꿈을 해석하는 자들
  lexicon: 어휘/표현
  rationale: 본문의 기능을 직접 드러내는 표현으로 옮겨, 영어 POB가 지닌 해석적 의미를 유지했습니다.
- source_word: ወረቅይተ
  english_pob_choice: diviners
  chosen_korean: 점술가들
  alternatives_korean:
  - 점쟁이들
  - 길흉을 점치는 자들
  lexicon: 어휘/표현
  rationale: 예언/점복 행위를 가리키는 일반적 의미를 살려, 현대 한국어에서 통용되는 ‘점술가들’로 옮겼습니다.
- source_word: ወአክሀሉ አእምሮ
  english_pob_choice: they were not able to understand
  chosen_korean: 그들은 이해하지 못했습니다
  alternatives_korean:
  - 그들은 알아내지 못했습니다
  - 그들은 뜻을 깨닫지 못했습니다
  lexicon: 어휘/표현
  rationale: 최신 영어 개정의 ‘understand’를 반영해, 해석을 ‘알아내다’보다 ‘이해하다’에 가깝게 유지했습니다.
theological_decisions:
- issue: 기근이 닥칠 대상의 범위
  chosen_reading: ‘온 땅’으로 옮겨, 재난이 이집트에만 국한되지 않고 넓은 세계를 포괄한다는 서술을 그대로 살렸습니다.
  alternative_readings:
  - ‘온 세상’
  - ‘전 세계’
  rationale: 게에즈 원문의 ‘모든 땅’을 직역성 있게 반영하면서도, 영어 POB의 ‘all the earth’와 의미 범위를 맞추었습니다.
  doctrine_reference: source fidelity / historical narrative
- issue: 꿈 해석자와 점술가를 함께 언급하는 구조
  chosen_reading: 두 집단을 모두 구분해 옮겨, 파라오가 동원한 이집트 지식 체계의 폭을 드러냈습니다.
  alternative_readings:
  - 두 표현을 ‘점쟁이들’로 통합
  - ‘해몽가들’로 단순화
  rationale: 원문이 별개의 부류를 병렬로 제시하므로, 한국어에서도 구별을 유지하는 편이 더 충실합니다.
  doctrine_reference: source fidelity / narrative detail
