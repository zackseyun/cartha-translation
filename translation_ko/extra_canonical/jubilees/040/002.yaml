  terminology: ‘파라오’, ‘꿈 해석자들’, ‘점술가들’은 원문의 구별과 현대 한국어의 격식을 적절히 반영합니다. 다만 본문에 연결되는 실제 주석이 없으므로 [a][b] 표지는 삭제해야 합니다.
  issues:
