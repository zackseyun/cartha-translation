revisions:
- from: 그리고 그때에 파라오가 온 땅에 임할 기근의 일에 관한 두 꿈을 한밤에 꾸었습니다. 그리고 그는 잠에서 깨어나 이집트에 있는 모든 꿈 해석자들과 점술가들을 불러, 자기의 두 꿈을 그들에게 말했으나, 그들은 이해하지 못했습니다.[a][b]
  to: 그 무렵 파라오가 온 땅에 닥칠 기근에 관한 두 꿈을 하룻밤에 꾸었습니다. 그는 잠에서 깨어나 이집트에 있는 모든 꿈 해석자들과 점술가들을 불러 자기의 두 꿈을 그들에게 말했으나, 그들은 그것을 이해하지 못했습니다.
  rationale: 시간 표현을 원문의 의미에 맞게 ‘하룻밤에’로 바로잡고, 직역투를 완화했습니다. 마지막 절의 목적어는 한국어에서 자연스럽게 보충하되 앞서 말한 ‘두 꿈’을 가리키도록 ‘그것을’로 처리했습니다. 내용 없는 주석 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:01Z'
