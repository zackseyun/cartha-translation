    rationale: ‘풍년의 해들의 날들’은 게에즈의 관용적 중첩을 한국어에 그대로 옮겨 부자연스럽습니다. ‘풍년이 든 여러 해 동안’은 해당 기간을 자연스럽게 전달합니다.
