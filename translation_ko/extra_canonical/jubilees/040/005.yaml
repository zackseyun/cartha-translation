base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/040/005.yaml
  text: “And now let Pharaoh appoint overseers in all the land of Egypt, and let them store up grain in the storehouses of the cities, in each city, during the days of the years of abundance. And it will be provision for the seven years of famine, and the land will not perish before the face of the famine, for it will be very severe.”
  footnotes:
  - marker: a
    text: Or 'in the cities'.
    reason: previous_rendering
  - marker: b
    text: Or 'during the years'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 파라오께서는 이집트 온 땅에 감독들을 임명하시고, 그들이 풍년이 든 여러 해 동안 각 도시의 곡물 창고에 곡식을 저장하게 하십시오. 그것이 일곱 해의 기근을 위한 양식이 되어, 땅이 기근 때문에 멸망하지 않게 될 것입니다. 그 기근이 매우 심할 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርዖን
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  lexicon: 고유명사
  rationale: Geez 원문과 영어 POB의 ‘Pharaoh’에 맞추되, 현대 한국어에서는 음역형 ‘파라오’가 원형 인지를 가장 직접적으로 전달합니다.
- source_word: መኰንነ
  english_pob_choice: appoint overseers
  chosen_korean: 감독들을 세우게 하여
  alternatives_korean:
  - 감독들을 임명하게 하여
  - 관리들을 세우게 하여
  lexicon: 감독
  rationale: 원문의 직책은 단순 관리보다 감시·감독의 의미가 강하므로, POB의 ‘overseers’를 살려 ‘감독들’로 옮겼습니다.
- source_word: ቤተ፡ አህጉር
  english_pob_choice: storehouses of the cities
  chosen_korean: 도시들의 곡물 창고에
  alternatives_korean:
  - 도시들에
  - 도시들의 창고에
  lexicon: 창고
  rationale: 수정 이력에서 지적된 대로 ‘집/창고’에 해당하는 ቤተ를 반영해야 하므로, 문맥상 저장 시설인 ‘곡물 창고’로 구체화했습니다.
- source_word: በመዋዕለ፡ ዓመታት
  english_pob_choice: during the days of the years
  chosen_korean: 풍년의 해들의 날들 동안
  alternatives_korean:
  - 풍년의 해 동안
  - 그 해들 동안
  lexicon: 시간 표현
  rationale: Ge'ez 관용구의 ‘날들’(days of the years)을 지워 버리지 않도록, 영어 POB의 평이한 표현보다 원문의 반복적 시간 뉘앙스를 더 드러냈습니다.
theological_decisions:
- issue: 풍년과 기근의 대비를 해석 없이 유지할지 여부
  chosen_reading: 풍년의 해들의 날들 동안 저장한 곡식이 일곱 해의 기근을 위한 양식이 되며, 땅이 기근 앞에서 멸망하지 않도록 하는 구도로 직역했습니다.
  alternative_readings:
  - 풍년 동안의 곡식이 기근 때의 양식이 되도록 풀어 쓰는 방식
  rationale: 이 절은 행정 지시와 보존의 결과를 연결하는 서술이므로, 의미를 단순화하기보다 원문의 인과 구조를 보존하는 것이 적절합니다.
  doctrine_reference: 문맥 보존 원칙
