  yaml_path: translation/extra_canonical/jubilees/040/007.yaml
  text: And he appointed him second in all his kingdom, and made him ruler over all Egypt, and caused him to ride on Pharaoh’s second chariot. And he clothed him with garments of fine linen, and put a gold chain on his neck, and they proclaimed before him, “El, El,” and “Abrer”; and he gave him his signet ring into his hand, and set him over all his house, and magnified him, and said to him, “Only with respect to the throne alone will I be greater than you.”
translation:
  language: ko
  text: 그리고 그는 자기 왕국의 둘째 자리에 그를 세우고, 온 이집트의 통치자로 삼았으며, 파라오의 둘째 병거를 타게 하였습니다. 또 그에게 고운 아마포 옷을 입히고, 목에는 금사슬을 걸어 주었으며, 그의 앞에서 “엘, 엘”과 “아브리르”를 외치게 하였습니다. 그리고 그에게 자기 인장 반지를 손에 주고, 자기의 온 집을 맡겼으며, 그를 크게 높여 그에게 말하였습니다. “왕좌에 관해서는 나만이 당신보다 더 높을 것입니다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዳግመ፡ / second in all his kingdom
  english_pob_choice: second in all his kingdom
  chosen_korean: 자기 왕국의 둘째 자리
  alternatives_korean:
  - 왕국의 제2인자
  - 온 나라의 제2통치자
  lexicon: 지위 표현
  rationale: 원문의 ‘둘째’와 POB의 ‘second in all his kingdom’을 직역하되, 현대 한국어에서 자연스러운 지위 표현으로 옮겼습니다.
- source_word: ውስተ፡ ኵሉ፡ ግብጽ፡ / ruler over all Egypt
  english_pob_choice: ruler over all Egypt
  chosen_korean: 온 이집트의 통치자
  alternatives_korean:
  - 온 이집트의 다스리는 자
  - 이집트 전역의 총독
  lexicon: 통치 지위
  rationale: 문맥상 행정적·정치적 지배권을 나타내므로 ‘통치자’로 옮겼고, ‘온’으로 범위를 분명히 했습니다.
- source_word: ልብሰ፡ ቢሶስ፡ / garments of fine linen
  english_pob_choice: garments of fine linen
  chosen_korean: 고운 아마포 옷
  alternatives_korean:
  - 세마포 옷
  - 고운 리넨 옷
  lexicon: 의복 재질
  rationale: 아마포가 고운 리넨/세마포에 해당하므로, 한국어 성경에서 널리 통용되면서도 원문 재질을 드러내는 표현을 택했습니다.
- source_word: ወወሀቦ፡ ማዕተቤ፡ / he gave him his signet ring
  english_pob_choice: he gave him his signet ring
  chosen_korean: 그에게 자기 인장 반지를 손에 주고
  alternatives_korean:
  - 그의 인장 반지를 주고
  - 그의 도장 반지를 손에 주고
  lexicon: 권한 상징
  rationale: ‘인장 반지’가 권한 위임의 표지이므로, POB의 의미를 살리면서 ‘손에’라는 원문의 수여 동작을 반영했습니다.
- source_word: አል፡ አል፡ ወአቢርር፡ / “El, El,” and “Abrer”
  english_pob_choice: “El, El,” and “Abrer”
  chosen_korean: “엘, 엘”과 “아브리르”
  alternatives_korean:
  - “엘, 엘”과 “아브레르”
  - “엘, 엘”과 “아브리르르”
  lexicon: 고유 외침
  rationale: 의미를 불필요하게 풀지 않고, POB가 보존한 외침 형태를 한국어 음역으로 최대한 가깝게 옮겼습니다.
theological_decisions:
- issue: 왕좌를 제외한 전권 부여의 표현
  chosen_reading: 요셉의 승진이 매우 높지만, 최종 왕권 자체는 파라오에게 남아 있다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘왕권을 나누어 가졌다’고 완화하는 해석
  - 왕좌 언급을 생략하는 해석
  rationale: 원문 마지막 절의 제한 조항(왕좌만 제외)은 권력 위임의 한계를 명확히 하므로, 이를 약화하지 않고 살렸습니다.
  doctrine_reference: 권위의 위임과 최상위 주권의 구별
