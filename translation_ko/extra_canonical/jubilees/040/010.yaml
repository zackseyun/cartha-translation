translation:
  language: ko
  text: 그리고 왕이 요셉의 이름을 포티판스라 불렀으며,^[a] 포티파라의 딸, 사웨스의 딸인 그 여자를 요셉의 아내로 주었습니다.^[b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጶንጢፋንስ
  english_pob_choice: Pontifans
  chosen_korean: 포티판스
  alternatives_korean:
  - 폰티판스
  - 포스톤판스
  lexicon: 고유명사
  rationale: 게에즈 본문이 가리키는 이름형을 그대로 살리되, 영어 POB의 최신 수정인 Pontifans를 한국어 음역으로 옮겼습니다. LXX식 동화형보다 에티오피아 전승의 별도 형태를 반영하는 것이 더 source-grounded합니다.
- source_word: ሳውፅ
  english_pob_choice: Sawes
  chosen_korean: 사웨스
  alternatives_korean:
  - 사우에스
  - 사우스
  lexicon: 고유명사
  rationale: 본문의 ሳውፅ를 전통적으로 '제사장'으로 매끈하게 고치지 않고, 영어 POB의 Sawes를 따라 별도 고유명사로 표기했습니다. 이는 본문이 가진 변형/오염 흔적을 숨기지 않기 위함입니다.
- source_word: ወለተ፡ ጶጢፋራን፡ ብእሲተ፡ ለዮሴፍ
  english_pob_choice: he gave Joseph as wife the daughter of Potiphar
  chosen_korean: 포티파라의 딸
  alternatives_korean:
  - 포티파르의 딸
  - 보디발의 딸
  lexicon: 고유명사
  rationale: 아내로 준 여인의 부계 표지를 본문 그대로 옮겼습니다. 한국어 성경에서 익숙한 '보디발'로 정리하지 않고, 영어 POB와 원문이 가진 Potiphar 형태를 유지했습니다.
theological_decisions:
- issue: 본문의 '사웨스'를 의미상 '제사장'으로 보정할지 여부
  chosen_reading: 의미를 보정하지 않고 '사웨스'라는 전승상의 이름 형태를 유지했습니다.
  alternative_readings:
  - '''제사장''으로 번역해 본문을 의미적으로 평탄화하기'
  - 주석 없이 Potiphar의 딸로만 읽기
  rationale: 영어 POB와 최신 검토는 이 표기를 본문 전승의 변형으로 취급합니다. 따라서 텍스트 비평적 흔적을 보존하는 쪽이 번역의 충실성에 더 부합합니다.
  doctrine_reference: 본문비평 원칙, 전승 보존
- issue: 문장의 첫 동사와 서술 구조를 한국어에서 어떻게 연결할지
  chosen_reading: '''그리고 왕이 … 불렀으며 … 주었습니다''로 이어지는 단일 서술 구조를 유지했습니다.'
  alternative_readings:
  - 두 문장으로 분리하기
  - 더 자연스럽게 재배열하기
  rationale: 게에즈 원문의 연속 동작을 유지하면서도 한국어 문장성은 확보해야 하므로, 원문의 흐름을 따라 절 구조를 최소한으로 정리했습니다.
  doctrine_reference: 원문 질서 보존
