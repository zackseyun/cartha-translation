  source_fidelity: 원문에는 포티판스라는 이름과 사웨스라는 이름뿐 아니라, 사웨스에 딸린 ‘헬리오폴리스’와 ‘경호대장’이라는 수식도 포함됩니다. 초안은 이 마지막 수식어들을 누락하여 원문 정보를 온전히 전달하지 못합니다.
  naturalness: 초안의 문장 연결은 자연스럽지만, ‘포티파라의 딸, 사웨스의 딸인 그 여자’는 지시어가 불필요하고 원문의 후반 수식어 누락 때문에 문장 구조도 불완전합니다. 병렬된 계보·신분 표현을 유지하면서 한국어 어순으로 정리하는 것이 좋습니다.
  terminology: ‘포티판스’와 ‘사웨스’는 게에즈 본문의 고유명사 형태를 보존한 적절한 표기입니다. ‘경호대장’은 ሊቀ፡ ዐቀብት(경호대/수비대의 우두머리)를 무리 없이 옮깁니다. 영어 감사 이력의 대안 독법은 각주로 보존해야 합니다.
