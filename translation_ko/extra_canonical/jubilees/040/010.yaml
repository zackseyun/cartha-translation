revisions:
- from: 그리고 왕이 요셉의 이름을 포티판스라 불렀으며,^[a] 포티파라의 딸, 사웨스의 딸인 그 여자를 요셉의 아내로 주었습니다.^[b]
  to: 그리고 왕은 요셉의 이름을 포티판스라고 불렀고,^[a] 헬리오폴리스의 경호대장 사웨스의 딸, 곧 포티파라의 딸을 요셉에게 아내로 주었습니다.^[b]
  rationale: 게에즈 본문의 연속된 서술을 유지하되, 초안에서 빠진 ‘헬리오폴리스’와 ‘경호대장’을 복원했습니다. 포티판스와 사웨스는 원문 전승의 고유명사 형태대로 두고, 영어 POB 감사 이력에 있는 대안 독법은 각주로 처리했습니다. 포티파라와 사웨스에 관한 본문의 다소 이례적인 병렬 관계는 해석적으로 조화시키지 않고 ‘사웨스의 딸, 곧 포티파라의 딸’로 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:05Z'
