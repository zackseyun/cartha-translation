  text: And Joseph gathered food for each city within the city until they were full of grain, until they were unable to count and measure it because of its abundance.
  footnotes:
  - marker: a
    text: Or 'from city to city'.
    reason: previous_rendering
  - marker: b
    text: Or 'until the grain was beyond measure'.
    reason: previous_rendering
  - marker: c
    text: Or 'until they could no longer count it, and it was measured no more'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 요셉은 각 성읍마다 그 성읍 안에 식량을 모아 두었습니다. 곡식으로 가득 차고, 그 많음 때문에 셈하거나 재어 볼 수 없을 때까지였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአስተጋብአ
  english_pob_choice: gathered
  chosen_korean: 모아 두어
  alternatives_korean:
  - 모았습니다
  - 저장하였습니다
  - 거두어 들였습니다
  lexicon: 집합/축적 동사
  rationale: 게으즈어는 단순히 모으는 행위보다 목적을 가진 축적의 뉘앙스를 가지므로, 저장의 결과까지 드러내는 ‘모아 두어’가 문맥에 맞습니다.
- source_word: ለሀገር ውስተ ሀገር
  english_pob_choice: for each city within the city
  chosen_korean: 각 성읍에 그 성읍의
  alternatives_korean:
  - 성읍에서 성읍으로
  - 한 성읍에서 다른 성읍으로
  - 도시마다
  lexicon: 장소/분배 표현
  rationale: 수정된 영어 주석처럼 ‘from city to city’가 아니라 각 성읍 안에 식량을 저장하는 뜻이므로, 성읍마다 그 성읍 몫을 둔다는 구조를 살렸습니다.
- source_word: መልአ ስርናየ
  english_pob_choice: were full of grain
  chosen_korean: 곡식으로 가득 찰 때까지
  alternatives_korean:
  - 곡식이 넘치도록
  - 곡식이 한도 없이 쌓일 때까지
  - 곡식으로 가득 차도록
  lexicon: 채움/완전성 표현
  rationale: ‘말아’는 ‘가득 차다/채워지다’의 직접적인 의미이므로, 추상화된 ‘한도 없음’보다 곡식으로 채워지는 상태를 그대로 옮겼습니다.
- source_word: ይስእኑ ኍልቈቶ ወሰፈረ
  english_pob_choice: were unable to count and measure it
  chosen_korean: 셈할 수도 없고 재어 볼 수도 없을 때까지
  alternatives_korean:
  - 계산하고 측량할 수 없을 때까지
  - 더는 셀 수도 재볼 수도 없을 때까지
  - 헤아릴 수도 저울질할 수도 없을 때까지
  lexicon: 수량/측정 동사
  rationale: 두 동사가 병렬로 묶여 있으므로, 셈하기와 재기 모두 불가능해졌다는 구조를 유지해 번역했습니다.
theological_decisions:
- issue: 과장된 풍요의 표현을 직역할지 완화할지
  chosen_reading: 곡식이 가득 찬 상태와 그 많음 때문에 셈과 측정이 불가능해졌다는 순서를 그대로 드러냈습니다.
  alternative_readings:
  - 그 곡식이 너무 많아 헤아릴 수 없을 정도였습니다
  - 양이 너무 많아 측량할 수 없었습니다
  rationale: 본문은 풍요를 일반적 과장으로만 말하지 않고, 먼저 ‘가득 참’이 있고 그 결과로 ‘셀 수 없음/잴 수 없음’이 뒤따른다고 말하므로 그 논리를 보존했습니다.
  doctrine_reference: 서사 문맥의 의미 보존
- issue: ‘성읍’의 반복을 줄일지 유지할지
  chosen_reading: ‘각 성읍에 그 성읍의’로 반복 구조를 유지했습니다.
  alternative_readings:
  - 성읍마다
  - 각 도시에
  rationale: 게으즈어의 대응 구조가 도시별 저장을 강조하므로, 반복을 줄이면 원문의 분배성과 반복 리듬이 약해집니다.
  doctrine_reference: 원문 구조 보존
