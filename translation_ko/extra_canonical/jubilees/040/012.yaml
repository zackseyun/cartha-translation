  - 애굽 땅이 매우 풍성히 열매를 내어 한 되가 천팔백 되를 냈습니다
  lexicon: 소출
  rationale: 원문은 땅이 극도로 번성하여 수확이 크게 늘었음을 말하므로, 농사 맥락을 살리는 ‘소출’로 옮기고 수치 표현은 POB 영어의 의미를 그대로 반영했습니다.
