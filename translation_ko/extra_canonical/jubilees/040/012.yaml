  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: ko
  text: 그리고 그 해에 이삭이 죽었습니다. 그리고 요셉이 자기의 두 꿈의 해몽에 관하여 그에게 말한 그대로, 곧 그가 그에게 말한 그대로 이루어졌습니다. 애굽 온 땅에 칠 년의 풍년이 있었고, 애굽 땅은 매우 많은 소출을 냈습니다. 한 되가 천팔백 되를 냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሞተ ይስሐቅ
  english_pob_choice: Isaac died
  chosen_korean: 이삭이 죽었습니다
  alternatives_korean:
  - 이삭이 세상을 떠났습니다
  - 이삭이 죽었습니다
  lexicon: 이삭
  rationale: Geez 원문의 단순 서술형 동사 ሞተ를 직역하여 사건의 사실성을 유지했고, 합쇼체 서술에 맞게 자연스럽게 처리했습니다.
