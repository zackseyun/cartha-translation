  naturalness: 합쇼체는 일관되지만, ‘그에게 말한 그대로, 곧 그가 그에게 말한 그대로’는 같은 내용을 중복하여 매우 어색합니다. 이를 한 번의 자연스러운 서술로 정리할 수 있습니다.
  terminology: ‘이삭’, ‘요셉’, ‘애굽’, ‘풍년’, ‘소출’은 적절합니다. 원문의 비특정 측량 단위는 ‘되’ 대신 ‘측량 단위’로 보존해야 합니다.
