  yaml_path: translation/extra_canonical/jubilees/040/012.yaml
  text: 'And in that year Isaac died. And it came to pass just as Joseph had spoken concerning the interpretation of his two dreams, just as he had told him: there were seven years of abundance in all the land of Egypt, and the land of Egypt produced exceedingly, one measure yielding eighteen hundred measures.'
translation:
  language: ko
  text: 그 해에 이삭이 죽었습니다. 요셉이 두 꿈의 해석에 관하여 그에게 말한 대로 이루어졌습니다. 애굽 온 땅에 칠 해 동안 풍년이 들었고, 애굽 땅은 매우 풍성한 소출을 냈습니다. 한 측량 단위가 천팔백 측량 단위를 냈습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 구체적인 도량형 명칭을 밝히지 않고 일반적인 ‘측량 단위’를 사용합니다.
    reason: ‘되’와 같은 특정 한국 도량형을 원문에 부가하지 않으면서 수확량의 비율을 보존합니다.
