  text: And the Lord gave Joseph favor and mercy in Pharaoh’s sight, and Pharaoh said to his servants, “We will not find a man wise and understanding like this man, for the spirit of the Lord is with him.”
translation:
  language: ko
  text: 야훼께서 요셉에게 파라오의 눈앞에서 은총과 긍휼을 베푸셨습니다. 그리고 파라오가 자기 신하들에게 말했습니다. "우리는 이 사람 같은 지혜롭고 분별력 있는 사람을 찾지 못할 것입니다. 야훼의 영이 그와 함께 있기 때문입니다."[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 게으즈 본문과 POB 주석 맥락상 야훼를 가리키므로, 프로젝트 기본값인 학술 음역을 유지했습니다.
- source_word: ሞገሰ፡ ወምሕረተ፡
  english_pob_choice: favor and mercy
  chosen_korean: 은총과 긍휼
  alternatives_korean:
  - 호의와 자비
  - 은혜와 긍휼
  - 호의와 긍휼
  lexicon: favor/mercy
  rationale: 두 명사 모두 하나님의 호의적 태도를 나타내므로, 문맥상 각각을 분리해 자연스러운 경어체 표현으로 옮겼습니다.
- source_word: ጠቢበ፡ ወማእምረ፡
  english_pob_choice: wise and understanding
  chosen_korean: 지혜롭고 분별력 있는
  alternatives_korean:
  - 지혜롭고 총명한
  - 지혜 있고 이해력 있는
  - 지혜롭고 슬기로운
  lexicon: wise / understanding
  rationale: 지혜(지적 분별)와 이해력(판단력)의 이중 대비를 살리기 위해, 관용적이면서도 구별되는 한국어 짝으로 표현했습니다.
- source_word: መንፈሰ፡ እግዚአብሔር
  english_pob_choice: the spirit of the Lord
  chosen_korean: 야훼의 영
  alternatives_korean:
  - 주님의 영
  - 하나님의 영
  - 성령
  lexicon: ruach/pneuma
  rationale: 본문은 성령을 가리키는 명시적 신적 영의 표현이지만, 게으즈 원문이 '야훼의 영'이라고 하므로 POB 기본 원칙에 따라 '영'을 유지하고 주어를 야훼로 맞췄습니다.
theological_decisions:
- issue: 파라오의 발화가 인용문 안에 직접 제시됨
  chosen_reading: 파라오의 직접 화법을 따옴표로 유지하고, 고대 왕의 발화를 현대 공식문체로 옮겼습니다.
  alternative_readings:
  - 간접화법으로 완화
  - 더 구어적인 반말체로 재현
  rationale: 원문이 직접 인용 구조를 명확히 가지므로, 서술의 긴장과 궁정 장면의 생동감을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 내러티브 충실성
- issue: ‘야훼의 영이 그와 함께 있다’의 신적 임재 표현
  chosen_reading: 영의 동행을 인격적 임재 표현으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 성령이 함께한다
  - 하나님의 영이 함께한다
  rationale: 게으즈 원문의 소유격 구조를 보존해, 요셉의 지혜가 신적 임재에서 비롯됨을 분명히 드러냅니다.
  doctrine_reference: 신적 임재/지혜 전승
