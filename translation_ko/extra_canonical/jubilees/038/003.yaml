  rationale: 이 절은 전투 결과를 사실적으로 보고하는 서술이므로, 원문의 폭력성을 약화시키지 않는 것이 본문 의미를 더 정확히 보존합니다.
  doctrine_reference: 서사 본문은 사건의 사실성과 결과를 있는 그대로 전달해야 함
