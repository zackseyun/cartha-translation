  text: And again he shot an arrow, and it struck Adoran the Aramean in the left breast, and he drove him back and killed him.
translation:
  language: ko
  text: 그리고 다시 화살을 쏘니, 아도란 사람 아람 사람의 왼쪽 가슴을 맞혔습니다. 그래서 그를 물러서게 하고 죽였습니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: ፈነወ፡ ሐጸ፡''
  english_pob_choice: he shot an arrow
  chosen_korean: 화살을 쏘니
  alternatives_korean:
  - 살을 쏘니
  - 화살을 던지니
  lexicon: 일반 동사
  rationale: 게에즈 원문과 POB 문맥 모두 투사 무기인 화살을 쏘는 행위를 가리키므로, 자연스럽고 직접적인 한국어로 옮겼습니다.
- source_word: አዶራንሃ፡'' አረማዊ
  english_pob_choice: Adoran the Aramean
  chosen_korean: 아도란 사람 아람 사람
  alternatives_korean:
  - 아도란 아람 사람
  - 아도란 아람인
  lexicon: 고유명사/민족명
  rationale: 고유명사 아도란을 음역하고, አረማዊ는 지명적 ‘아람’보다 민족 표지로서 ‘아람 사람’이 더 직접적이므로 그렇게 처리했습니다.
- source_word: ጥቦ፡ ፀጋማዊ
  english_pob_choice: in the left breast
  chosen_korean: 왼쪽 가슴
  alternatives_korean:
  - 왼 가슴
  - 왼편 가슴
  lexicon: 신체 부위 표현
  rationale: 원문의 방향어 ‘왼쪽’과 신체부위 ‘가슴’을 직역하되, 현대 한국어에서 자연스럽게 읽히도록 다듬었습니다.
- source_word: ወሰደዶ፡'' ወቀተሎ።
  english_pob_choice: he drove him back and killed him
  chosen_korean: 그를 물러서게 하고 죽였습니다
  alternatives_korean:
  - 그를 밀어내고 죽였습니다
  - 그를 뒤로 몰아 죽였습니다
  lexicon: 동작 서술
  rationale: 원문은 타격 후의 퇴각과 치명상을 함께 서술하므로, ‘물러서게 하고’로 밀려남을, ‘죽였습니다’로 결과를 분명히 드러냈습니다.
theological_decisions:
