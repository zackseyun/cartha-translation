translation:
  language: ko
  text: 그리고 그들은 야곱이 이집트로 내려간 날까지 야곱에게 조공을 계속 바쳤습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 야곱을 계속 시중들며 지냈습니다.”
    reason: 영어 POB 감사 기록에 남아 있는 이전 대안 번역(“remained waiting on”)에 대응하는 각주입니다. 본문은 현행 어휘 판단에 따라 ‘조공을 바치다’를 유지합니다.
lexical_decisions:
- source_word: ይጸብሑ
  english_pob_choice: continued paying tribute to
  chosen_korean: 조공을 바치며
  alternatives_korean:
  - 예물을 바치며
  - 섬기며
  - 대기하며
  lexicon: Ge'ez ጸብሐ (ṣabḥa)
  rationale: 본문과 POB 수정 이력을 따라, 단순한 ‘섬김’이나 ‘대기’가 아니라 정치적 종속 아래의 조공 납부를 드러내는 표현으로 옮겼습니다.
- source_word: ወነበሩ፡ እንዘ፡
  english_pob_choice: continued
  chosen_korean: 계속하였습니다
  alternatives_korean:
  - 여전히 그러하였습니다
  - 머물렀습니다
  lexicon: Ge'ez ነበረ (näbbärä)
  rationale: 행위의 지속을 간결하게 나타내는 한국어로 옮겨, 뒤의 조공 납부와 자연스럽게 연결했습니다.
- source_word: ወረደ፡ ውስተ፡ ግብጽ
  english_pob_choice: he went down into Egypt
  chosen_korean: 이집트로 내려가는
  alternatives_korean:
  - 이집트로 내려간
  - 이집트 안으로 내려가는
  lexicon: Ge'ez ወረደ / ግብጽ
  rationale: ‘내려가다’라는 지리적·서사적 관용을 살리되, 목적지 표기는 현대 한국어의 자연스러운 형태인 ‘이집트로’로 처리했습니다.
theological_decisions:
- issue: 야곱에게 바치는 행위의 성격
  chosen_reading: 개인적 시중이 아니라 종속 관계에서의 조공 납부로 이해했습니다.
  alternative_readings:
  - 야곱을 섬김
  - 야곱을 기다림
  rationale: 개정 전 영어 주석 이력과 최종 재검토 모두가 ጸብሐ를 ‘paying tribute’로 확정하므로, 문맥상 권력 관계를 흐리는 번역은 피했습니다.
  doctrine_reference: 서사 문맥 일치; 번역사적 주해 결정
