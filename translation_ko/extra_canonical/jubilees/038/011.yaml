  text: And the sons of Jacob subdued the sons of Esau on Mount Seir, and they bowed their necks so that they might become slaves.
translation:
  language: ko
  text: 야곱의 아들들은 세일 산에서 에서의 아들들을 굴복시켰고, 그들의 목을 숙여 마침내 종이 되게 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ*መገብዎሙ፡
  english_pob_choice: subdued
  chosen_korean: 굴복시켰고
  alternatives_korean:
  - 제압했고
  - 눌렀고
  - 정복했고
  lexicon: 동사 선택
  rationale: Ge'ez의 동사는 단순한 ‘압박’보다 우세를 강요해 상대를 복속시키는 뜻으로 읽히므로, POB의 ‘subdued’를 따라 ‘굴복시키다’로 옮겼습니다.
- source_word: አትሐቱ፡ ክሳዶሙ፡
  english_pob_choice: they bowed their necks
  chosen_korean: 그들의 목을 숙여
  alternatives_korean:
  - 목을 굽혀
  - 목을 낮추어
  - 고개를 숙여
  lexicon: 관용구/신체 표현
  rationale: 직역하면 ‘목을 숙이다’이지만, 한국어에서는 자연스럽게 신체적 굴복을 드러내는 표현으로 ‘목을 숙여’가 가장 가깝습니다.
- source_word: ከመ፡ ይኩኑ፡ አግብርተ፡
  english_pob_choice: so that they might become slaves
  chosen_korean: 마침내 종이 되게 하였습니다
  alternatives_korean:
  - 노예가 되게 하였습니다
  - 종이 되도록 하였습니다
  - 노예가 되도록 하였습니다
  lexicon: 명사/상태 표현
  rationale: 원문의 목적절은 강제적 예속 상태를 가리키지만, 이 기록의 기본 용례인 ‘종’을 유지하면서 종속의 결과를 분명히 하기 위해 ‘되게 하였습니다’로 옮겼습니다.
theological_decisions:
- issue: 폭력적 정복과 예속의 서술을 완화하지 않을지
  chosen_reading: 원문의 정복-굴복-예속의 연쇄를 그대로 드러내어, 역사 서술의 거친 의미를 약화하지 않았습니다.
  alternative_readings:
  - ‘제압하여 복종시키다’처럼 완화된 표현
  - ‘항복하게 하다’처럼 군사적 뉘앙스를 좁히는 표현
  rationale: 본문은 승리의 결과로 상대가 실제로 예속되는 상황을 말하므로, 도덕적 완화보다 서술의 직접성이 우선합니다.
  doctrine_reference: 창세기적 역사서술의 문맥 보존
- issue: ‘종’과 ‘노예’ 중 어떤 표현을 쓸지
  chosen_reading: 본문은 일반적 예속 상태를 말하는 문맥이지만, 영어 POB가 ‘slaves’로 명시한 점을 반영해 최종 결과를 ‘종’으로 두었습니다.
  alternative_readings:
  - ‘노예’로 더 강하게 표기
  - ‘종’으로 보다 전통적인 예속 표현 사용
  rationale: POB의 audit trail은 예속의 강도를 분명히 하면서도 번역어 선택의 통일성을 유지하도록 요구하므로, 이 구절에서는 프로젝트 기본어인 ‘종’을 유지하되 주석 없이 본문에 직접 반영했습니다.
  doctrine_reference: 번역어 일관성 및 예속 상태 표지
