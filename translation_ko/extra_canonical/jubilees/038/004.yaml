lexical_decisions:
- source_word: ወእምዝ፡
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 뒤에
  alternatives_korean:
  - 그 후에
  - 그 일 뒤에
  lexicon: source connective/time marker
  rationale: 이전 사건 뒤의 시간적 연결을 자연스러운 한국어로 옮기되, 과도하게 문어체화하지 않았습니다.
- source_word: ውሉደ፡ ያዕቆብ፡
