  verdict: revise
  source_fidelity: 게에즈어의 시간 연결, ‘야곱의 아들들’, 그들의 종들, 그리고 네 전투 대형으로 나뉘는 동작은 대체로 충실히 반영되었습니다. 다만 ተናፊቆሙ는 주어들이 스스로 나뉘어 편성되는 뜻이므로, 이를 더 직접적으로 드러내는 표현이 좋습니다.
  naturalness: ‘그리고 이 일 뒤에’는 현대 표준 한국어에서 다소 번역투입니다. ‘이 일이 있은 뒤에’가 문맥과 합쇼체 서술에 더 자연스럽습니다. 또한 ‘그들과 그들의 종들이’보다 앞선 명사를 반복한 병렬 구조가 더 명료합니다.
  terminology: ‘전열’은 마ኅፈድ의 군사적 대형 의미를 적절히 살립니다. ‘종들’도 원문의 사회적 지위 표현을 불필요하게 완화하지 않는 적절한 선택입니다.
