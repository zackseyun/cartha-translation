    text: 또는 “네 전열을 이루어 나갔습니다.”
    reason: 게에즈어 분사 표현은 네 전투 대형으로 ‘나뉘는’ 동작 또는 그러한 대형으로 ‘편성된’ 상태를 나타낼 수 있습니다.
lexical_decisions:
- source_word: ወእምዝ፡
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 뒤에
  alternatives_korean:
  - 그 후에
  - 그 일 뒤에
  lexicon: source connective/time marker
  rationale: 이전 사건 뒤의 시간적 연결을 자연스러운 한국어로 옮기되, 과도하게 문어체화하지 않았습니다.
- source_word: ውሉደ፡ ያዕቆብ፡
  english_pob_choice: the sons of Jacob
  chosen_korean: 야곱의 아들들
  alternatives_korean:
  - 야곱의 자손들
  - 야곱의 아들들
  lexicon: proper noun + kinship phrase
  rationale: 직역에 가까운 표준 표현을 유지해, 소스의 족장 계보를 분명히 드러냈습니다.
- source_word: ወአግብርቲሆሙ፡
  english_pob_choice: they and their servants
  chosen_korean: 그들과 그들의 종들이
  alternatives_korean:
  - 그들과 그들의 종들
  - 그들과 함께한 그들의 종들이
  lexicon: social-status term
  rationale: 문맥상 부속 인원을 가리키므로 ‘종들’로 옮겼고, 소스의 병렬 구조를 보존했습니다.
- source_word: ተናፊቆሙ፡ ውስተ፡ መርብዕተ፡ ማኅፈድ።
  english_pob_choice: dividing themselves into four battle lines
  chosen_korean: 네 개의 전열로 나뉘었습니다
  alternatives_korean:
  - 네 개의 전투 대형으로 나뉘었습니다
  - 네 전열로 나뉘었습니다
  lexicon: military formation term
  rationale: 영어 POB의 ‘battle lines’를 한국어 군사 용어 ‘전열’로 옮겨, 단순한 분할이 아니라 전투 대형의 의미를 살렸습니다.
theological_decisions:
- issue: 전투 편제의 표현 강도
  chosen_reading: 군사적 편제를 나타내는 서술로 이해해 ‘전열’로 번역했습니다.
  alternative_readings:
  - 단순히 ‘네 갈래로 나뉘었습니다’
  - ‘네 부대로 나뉘었습니다’
  rationale: 지리적 분산이 아니라 전투 준비 상태를 가리키는 문맥이므로, 전투성을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서사 문맥의 군사 묘사
