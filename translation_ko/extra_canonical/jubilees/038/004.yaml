- source_word: ወአግብርቲሆሙ፡
  english_pob_choice: they and their servants
  chosen_korean: 그들과 그들의 종들이
  alternatives_korean:
  - 그들과 그들의 종들
  - 그들과 함께한 그들의 종들이
  lexicon: social-status term
  rationale: 문맥상 부속 인원을 가리키므로 ‘종들’로 옮겼고, 소스의 병렬 구조를 보존했습니다.
- source_word: ተናፊቆሙ፡ ውስተ፡ መርብዕተ፡ ማኅፈድ።
