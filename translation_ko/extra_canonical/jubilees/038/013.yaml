  text: And Jacob sent to his sons that they should make peace, and they made peace with them, and they imposed upon them a yoke of service, so that they should pay tribute to Jacob and his sons all their days.
  footnotes:
  - marker: a
    text: Or 'serve Jacob'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 그의 아들들에게 사람을 보내어 화평을 이루게 하였고, 그들이 그들과 화평을 이루었으며, 그들에게 섬김의 멍에를 지워 야곱과 그의 아들들에게 그들의 모든 날 동안 조공을 바치게 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቀትልዎሙ / ሰላመ ወገብሩ ምስሌሆሙ ሰላመ
  english_pob_choice: make peace / they made peace with them
  chosen_korean: 화평을 이루게 하였고 / 화평을 이루었습니다
  alternatives_korean:
  - 평화를 맺게 하였고 / 그들과 평화를 맺었습니다
  - 화친하게 하였고 / 그들과 화친하였습니다
  lexicon: 화평
  rationale: 원문은 단순한 ‘안부’가 아니라 두 집단 사이의 화해·평화 수립을 가리키므로, 현대 한국어에서 가장 직접적인 ‘화평을 이루다’로 옮겼습니다.
- source_word: አንበሩ አርዑተ ቅኔ
  english_pob_choice: they imposed upon them a yoke of service
  chosen_korean: 섬김의 멍에를 지워
  alternatives_korean:
  - 종속의 멍에를 지워
  - 노역의 멍에를 지워
  lexicon: 멍에
  rationale: ‘멍에’는 지배·종속의 강제를 드러내는 비유를 살리며, ‘섬김’은 뒤의 공납 의무와 함께 가해진 복속 상태를 포괄적으로 표현합니다.
- source_word: ይጽብሑ
  english_pob_choice: pay tribute
  chosen_korean: 조공을 바치게 하였습니다
  alternatives_korean:
  - 세금을 내게 하였습니다
  - 공물을 바치게 하였습니다
  lexicon: 조공
  rationale: 개정된 영어 본문이 ‘serve’가 아니라 ‘pay tribute’로 확정하고 있으므로, 강제적 예속 아래의 정기 납부라는 의미를 가장 분명하게 드러내는 ‘조공’을 택했습니다.
theological_decisions:
- issue: 야곱과 그의 아들들에 대한 에서 자손의 복속이 단순한 ‘봉사’인지 ‘공납 의무’인지
  chosen_reading: 본문의 핵심은 개인적 봉사가 아니라 정치·경제적 종속 아래에서 조공을 바치는 복속입니다.
  alternative_readings:
  - 그들에게 봉사하게 하였다
  - 그들을 섬기게 하였다
  rationale: 게에즈 동사 ይጽብሑ에 대한 영어 POB의 정정과 문맥상 ‘멍에’ 표현을 따라, 이 구절의 강도는 일반적 봉사보다 공납을 강요받는 상태에 있습니다.
  doctrine_reference: Jubilees narrative context; source-language audit trail
