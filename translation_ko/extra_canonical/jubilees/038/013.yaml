  verdict: revise
  source_fidelity: 첫 절의 ለአከ는 야곱이 아들들에게 보냈다는 뜻이나, 원문에는 ‘사람’을 뜻하는 목적어가 명시되지 않습니다. 초안의 ‘사람을 보내어’는 불필요하게 대상을 특정합니다. 또한 ይጽብሑ는 문맥상 ‘조공을 바치다’로 옮긴 것이 적절합니다.
  naturalness: ‘그의 아들들에게 사람을 보내어 화평을 이루게 하였고’는 한국어에서 목적어와 지시 관계가 다소 부자연스럽습니다. ‘화평을 이루라고 전갈을 보냈습니다’가 자연스럽고 원문의 명령 목적을 잘 드러냅니다. ‘섬김의 멍에’는 직역투이므로 ‘예속의 멍에’로 다듬었습니다.
  terminology: ‘화평’, ‘멍에’, ‘조공’은 문맥과 현대 격식체에 적합합니다. ‘예속의 멍에’는 강제된 복속을 뜻하며, 뒤따르는 조공 의무와도 잘 연결됩니다. 대안 독법인 ‘섬기다’는 각주로 보존합니다.
