  - severity: low
    issue: ‘섬김의 멍에’가 다소 부자연스러운 직역입니다.
    rationale: ‘예속의 멍에’는 복속과 강제의 비유를 자연스럽게 전달하면서도, 뒤의 조공 납부와 구별되는 지배 상태를 유지합니다.
