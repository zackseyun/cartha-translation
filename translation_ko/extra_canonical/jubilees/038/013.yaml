  to: 야곱은 자기 아들들에게 그들과 화평을 이루라고 전갈을 보냈습니다. 그들은 그들과 화평을 이루고, 그들에게 예속의 멍에를 메워 그들이 야곱과 그의 아들들에게 평생 조공을 바치게 하였습니다.[a]
