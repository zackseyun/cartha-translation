  text: And after this Judah spoke to Jacob his father and said to him, “Bend your bow, father, and send forth your arrows, and cast down the enemy and kill the adversary; and let there be strength for you, for we will not kill your brother, for he is your companion and he is like you; let us give him honor.”
  footnotes:
  - marker: a
    text: Or 'Take your bow, father, and put your arrows in the quiver'.
    reason: previous_rendering
  - marker: b
    text: Or 'because we will kill your brothers’ enemy. Your hand is with you, and your help is with you; we will give it to you for honor.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 후에 유다가 자기 아버지 야곱에게 말하며 그에게 이르되, “아버지, 활을 당기시고 화살을 날리셔서 원수를 넘어뜨리고 대적을 죽이십시오. 그러면 아버지에게 힘이 있을 것입니다. 왜냐하면 우리는 아버지의 형제를 죽이지 않을 것이기 때문입니다. 그는 아버지의 동료이며 아버지와 같기 때문입니다. 그에게 명예를 돌립시다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስከ
  english_pob_choice: Bend your bow
  chosen_korean: 활을 당기시고
  alternatives_korean:
  - 활을 드시고
  - 활을 굽히시고
  lexicon: Geez ምስከ
  rationale: 게으즈 동사 ምስከ는 활을 ‘당기다/휘다’는 뜻으로, 영어 POB의 수정 전 의미인 ‘bend your bow’를 반영해 활시위를 준비하는 동작으로 옮겼습니다.
- source_word: ፈኑ
  english_pob_choice: send forth your arrows
  chosen_korean: 화살을 날리셔서
  alternatives_korean:
  - 화살을 쏘셔서
  - 화살을 보내셔서
  lexicon: Geez ፈነወ
  rationale: 게으즈 ፈኑ는 ‘보내다/쏘다’의 의미를 가지므로, 문맥상 활의 사용을 살려 자연스럽게 ‘화살을 날리셔서’로 옮겼습니다.
- source_word: ኀይለ
  english_pob_choice: let there be strength for you
  chosen_korean: 아버지에게 힘이 있을 것입니다
  alternatives_korean:
  - 아버지에게 강함이 있을 것입니다
  - 아버지께 힘이 생길 것입니다
  lexicon: Geez ኀይል
  rationale: 본문의 ኀይል은 일반적인 ‘힘/강함’이므로, 과장하지 않고 직역에 가까운 ‘힘’으로 유지했습니다.
- source_word: ንህቦ ለክብር
  english_pob_choice: let us give him honor
  chosen_korean: 그에게 명예를 돌립시다
  alternatives_korean:
  - 그를 존중합시다
  - 그에게 영광을 드립시다
  lexicon: Geez ክብር
  rationale: 게으즈 ክብር는 ‘명예/존귀’를 뜻하므로, 전통적 교회어 ‘영광’보다 문맥상 더 직접적인 ‘명예’를 택했습니다.
theological_decisions:
- issue: “형제”를 누구로 지칭하는지
  chosen_reading: ‘아버지의 형제’로 옮겨, 본문이 말하는 친족 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘형제의 원수’로 재구성
  - ‘네 형제’로 일반화
  rationale: 게으즈 본문과 영어 POB 수정본 모두 혈연/동료 관계를 강조하며, 본문에 없는 적대적 해석을 덧씌우지 않는 것이 더 안전합니다.
  doctrine_reference: 본문비평/문맥 해석
- issue: 명령문과 권유문의 혼합
  chosen_reading: 직접 명령은 공손한 청유·명령형으로, 마지막 ‘우리가 주자’는 청유형으로 살렸습니다.
  alternative_readings:
  - 전부 명령형으로 통일
  - 전부 평서형으로 완화
  rationale: 원문의 화법은 군사적 격려와 공동 결의를 함께 담고 있으므로, 한국어에서도 그 긴장을 유지하는 것이 좋습니다.
  doctrine_reference: 수사학/문체
