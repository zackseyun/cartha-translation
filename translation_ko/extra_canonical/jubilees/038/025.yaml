lexical_decisions:
- source_word: እሉ፡ ነገሥት፡
  english_pob_choice: These are the kings
  chosen_korean: 이것들은 … 왕들입니다
  alternatives_korean:
  - 이들은 … 왕들입니다
  - 이 왕들은 …입니다
  lexicon: እሉ = these/these ones; ነገሥት = kings
  rationale: 지시대명사 እሉ를 단순히 생략하지 않고 ‘이것들’로 살려 앞선 목록의 결론을 분명히 했습니다. ነገሥት은 복수형 ‘왕들’로 옮겼습니다.
- source_word: እለ፡ ነገሡ፡
  english_pob_choice: who reigned
  chosen_korean: 다스린
  alternatives_korean:
  - 통치한
  - 재위한
  lexicon: ነገሡ = they reigned/ruled
  rationale: 왕의 활동을 나타내는 동사로서 ‘다스린’이 가장 자연스럽고 원문 의미를 직접 반영합니다.
- source_word: በምድረ፡ ኤዶም።
  english_pob_choice: in the land of Edom
  chosen_korean: 에돔 땅에서
  alternatives_korean:
  - 에돔 땅에서
  - 에돔 지역에서
  lexicon: ምድር = land/earth; ኤዶም = Edom
  rationale: 문맥상 특정 영토를 가리키므로 ‘땅에서’로 옮겼고, 고유명사 ኤዶም은 표준 음역 ‘에돔’을 사용했습니다.
