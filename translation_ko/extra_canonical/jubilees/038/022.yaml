    reason: previous_rendering
translation:
  language: ko
  text: 그리고 살만이 죽고, 강가의 르호봇 출신인 사울이 그를 대신하여 다스렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 뒤를 이어.”
    reason: 원문의 ህየንቴሁ는 문자적으로 ‘그를 대신하여/그의 자리에’를 뜻하며, 문맥상 ‘그의 뒤를 이어’로도 옮길 수 있습니다. 영어 POB 감사 추적의 대안 표현을 한국어로 보존합니다.
lexical_decisions:
- source_word: ወሞተ፡ ሰልመን፡
  english_pob_choice: And Salman died
  chosen_korean: 살만이 죽고
  alternatives_korean:
  - 살만이 죽었습니다
  - 그리고 살만이 죽었습니다
  lexicon: 고유명사/서술동사
  rationale: 게에즈 원문의 단순한 사건 진행을 살려 첫 절을 연결형으로 옮기고, 인물 이름은 영어 POB의 Salman에 맞춰 살만으로 옮겼습니다.
- source_word: ህየንቴሁ፡
  english_pob_choice: in his place
  chosen_korean: 그를 대신하여
  alternatives_korean:
  - 그 자리에
  - 그 뒤를 이어
  lexicon: 후계/대체 표현
  rationale: 원문은 단순한 ‘후에’가 아니라 ‘그의 자리에서/그를 대신하여’의 의미이므로, 왕위 승계의 대체 관계를 분명히 드러냈습니다.
- source_word: ሳኡል፡ ዘእም፡ ራኦቦት፡ ፈለግ።
  english_pob_choice: Saul from Rehoboth by the River
  chosen_korean: 강가의 르호봇에서 사울이
  alternatives_korean:
  - 르호봇 강가에서 사울이
  - 강가 르호봇 출신 사울이
  lexicon: 지명/출신 표지
  rationale: 영어 POB가 ‘by the River’로 다듬은 지리 정보를 살려, 르호봇이 강가에 있는 곳임을 자연스럽게 표현했습니다.
