  text: 사울이 죽고, 악볼의 아들 바알하난이 그의 자리에 왕이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሞተ፡ ሳኡል፡
  english_pob_choice: And Saul died
  chosen_korean: 그리고 사울이 죽고
  alternatives_korean:
  - 그리고 사울이 죽었습니다
  - 사울이 죽은 뒤
  lexicon: 사울
  rationale: Geez의 단순 서술 과거를 자연스러운 합쇼체 과거 연결형으로 옮기되, 사건의 진행을 유지하기 위해 ‘그리고’와 ‘죽고’를 사용했습니다.
- source_word: ህየንቴሁ፡
  english_pob_choice: in his place
  chosen_korean: 그의 자리에
  alternatives_korean:
  - 그 뒤에
  - 그 후에
  - 그를 이어
  lexicon: 자리
  rationale: 영문 POB의 수정본이 보여 주듯 이 표현은 단순한 시간적 ‘after’보다 ‘in his place/stead’의 계승 의미가 더 정확하므로, 한국어도 지위·계승을 드러내는 ‘그의 자리에’로 옮겼습니다.
- source_word: ወልደ፡ አክቡር።
  english_pob_choice: son of Achbor
  chosen_korean: 아크보르의 아들로서
  alternatives_korean:
  - 아크보르의 아들
  - 아크보르에게서 난 아들로서
  lexicon: son of
  rationale: 계보 표지를 분명히 하면서도 한국어 문맥에 자연스럽게 맞도록 소유격 구조를 유지했습니다.
theological_decisions:
- issue: 왕위 계승의 표현이 단순한 시간 순서를 넘는지
  chosen_reading: ‘그의 자리에’는 사울의 죽음 뒤에 바엘루난이 지위를 이어받았다는 계승 의미를 드러냅니다.
  alternative_readings:
  - ‘그 뒤에’처럼 단순한 시간적 연속으로만 읽는 해석
  rationale: Geez의 ህየንቴሁ는 문맥상 ‘in his place/stead’가 핵심이므로, 계승 관계를 약화시키지 않도록 번역했습니다.
  doctrine_reference: 서술 본문 해석 원리
