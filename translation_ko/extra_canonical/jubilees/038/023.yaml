  terminology: 이 인물들은 창세기 36장의 통상적인 한국어 성서 이름인 ‘악볼’과 ‘바알하난’으로 표기하는 것이 적절합니다. ‘왕이 되었습니다’는 여기서 왕위 계승 및 재위를 나타내며, 원문의 negse(왕으로 다스리다/왕이 되다)에 부합합니다.
