  text: And Asam died, and Adath son of Barad, who struck Midian in the field of Moab, reigned in his place; and the name of his city was Avith.
  footnotes:
  - marker: a
    text: Or 'reigned after him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 아삼이 죽고, 바랏의 아들 아닷이 그를 대신하여 다스렸습니다. 그는 모압 들판에서 미디안을 친 사람이었고, 그의 도시 이름은 아빗이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሞተ፡ አሳም፡
  english_pob_choice: And Asam died
  chosen_korean: 아삼이 죽고
  alternatives_korean:
  - 아삼이 죽었고
  - 아삼이 죽었습니다
  lexicon: 동사
  rationale: 서사 진행을 간결하게 살리기 위해 ‘죽고’로 연결했고, 합쇼체 종결은 뒤의 서술에 맞춰 정리했습니다.
- source_word: ወነግሠ፡ ህየንቴሁ፡
  english_pob_choice: reigned in his place
  chosen_korean: 그를 대신하여 다스렸습니다
  alternatives_korean:
  - 그의 자리에 다스렸습니다
  - 그 뒤를 이어 통치했습니다
  lexicon: 통치 동사
  rationale: 개정된 영어 POB의 ‘in his place’를 반영해 단순한 시간적 ‘뒤에’보다 대체·대신의 의미를 드러냈습니다.
- source_word: ምዕድያምሃ፡ በሐቅለ፡ ሞአብ፡
  english_pob_choice: who struck Midian in the field of Moab
  chosen_korean: 그는 모압 들판에서 미디안을 친 사람이었고
  alternatives_korean:
  - 모압 평야에서 미디안을 쳤던 사람이었고
  - 모압 들에서 미디안을 공격한 사람이었고
  lexicon: 전투 동사 / 지명
  rationale: ‘쳤다’는 히브리어식 전투 표현을 자연스럽게 살리면서, ‘field of Moab’을 ‘모압 들판’으로 직역에 가깝게 옮겼습니다.
- source_word: ወስመ፡
  english_pob_choice: and the name of his city was Avith
  chosen_korean: 그리고 그의 도시 이름은 아빗이었습니다
  alternatives_korean:
  - 그리고 그 도시 이름은 아빗이었습니다
  - 그의 성읍 이름은 아빗이었습니다
  lexicon: 지명/도시 명칭
  rationale: ‘city’를 서사체에 맞게 ‘도시’로 두고, 고유명사는 현대 외래어 표기 관행에 따라 ‘아빗’으로 옮겼습니다.
theological_decisions:
- issue: 왕위 계승 표현의 의미
  chosen_reading: ‘그를 대신하여 다스렸습니다’로 번역해 직계 후계가 아니라 대체 통치를 강조했습니다.
  alternative_readings:
  - 그 뒤를 이어 다스렸습니다
  - 그의 뒤에 왕이 되었습니다
  rationale: Ge'ez ህየንቴሁ는 단순한 연속 순서보다 ‘~의 자리에서/대신에’의 뜻이 강하므로, 서술의 역사적 관계를 흐리지 않도록 대체성을 드러냈습니다.
  doctrine_reference: 본문의 역사 서술 정확성
- issue: 전투 행위의 서술 방식
  chosen_reading: ‘미디안을 친 사람’으로 유지해 전쟁의 결과를 직접적으로 제시했습니다.
  alternative_readings:
  - 미디안을 공격한 사람
  - 미디안을 무찌른 사람
  rationale: 원문은 승리한 전투 행위를 간명하게 서술하므로, 완곡한 ‘무찌르다’보다 보다 직선적인 ‘치다’를 택했습니다.
  doctrine_reference: 서사적 사실 전달
