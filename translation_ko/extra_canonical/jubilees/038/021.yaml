translation:
  language: ko
  text: 그의 도시는 아위트였습니다. 아닷이 죽고, 살만이 아마세가에서 그의 자리에 다스렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀገሩ፡ አውኢት።
  english_pob_choice: His city was Aw'it.
  chosen_korean: 그의 도시는 아위트였습니다.
  alternatives_korean:
  - 그의 도성은 아위트였습니다.
  - 그의 성읍은 아위트였습니다.
  lexicon: ḫägäru / city; proper noun Aw'it
  rationale: 서두의 소유 표현을 그대로 살려 도시의 소속을 나타내고, 지명은 영어 POB의 음역 Aw'it에 맞춰 아위트로 옮겼습니다.
- source_word: ወሞተ፡ አዳት፡
  english_pob_choice: And Adath died,
  chosen_korean: 아닷이 죽고,
  alternatives_korean:
  - 그리고 아닷이 죽고,
  - 아닷이 죽었습니다, 그리고
  lexicon: mota / die
  rationale: 서술적 연결을 자연스럽게 하면서도 ‘죽다’라는 직접 표현을 유지해 원문의 사실 진술을 그대로 반영했습니다.
- source_word: ወነግሠ፡ ህየንቴሁ፡
  english_pob_choice: and Salman from Amaseqa reigned in his place.
  chosen_korean: 살만이 아마세가에서 그의 자리에 다스렸습니다.
  alternatives_korean:
  - 살만이 아마세가에서 그의 뒤를 이어 다스렸습니다.
  - 살만이 아마세가에서 그의 대신 다스렸습니다.
  lexicon: nägäsa / reign; heyantēhu / in his place
  rationale: ‘아마세가에서’로 출신지를 살리고, ህየንቴሁ는 단순한 ‘뒤에’보다 ‘그의 자리에’가 권위의 승계를 더 직접적으로 드러내므로 그렇게 옮겼습니다.
- source_word: ዘእም፡ አማሴቃ።
  english_pob_choice: from Amaseqa
  chosen_korean: 아마세가에서
  alternatives_korean:
  - 아마세가 출신으로
  - 아마세가로부터
  lexicon: ze'em + place name
  rationale: 전치적 ‘from’의 출신·기원 의미를 자연스러운 현대 한국어 조사 ‘에서’로 표현했습니다.
theological_decisions:
- issue: 왕위 승계 표현의 강도
  chosen_reading: ‘다스렸습니다’로 평이하게 옮겨, 왕권 승계의 사실 진술을 과장 없이 전달했습니다.
  alternative_readings:
  - ‘통치했습니다’
  - ‘왕이 되었습니다’
  rationale: 이 절은 계보적 기록문으로서 서술의 정확성이 중요하므로, 원문의 통치 사실을 담되 불필요한 서술 강화는 피했습니다.
  doctrine_reference: 서사/역사 진술의 등가성
