    text: Or 'Adurim'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 육백 명이 도망했고, 에서의 아들 넷도 그들과 함께 도망했습니다. 그들은 아버지를 아두핌[a]에 있는 산지에서 쓰러져 죽은 채로 남겨 두고 떠났습니다. 야곱의 아들들은 그들을 세일 산까지 추격했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 ‘아두핌’으로 읽습니다. 이는 아마도 ‘아두림’의 필사상 오류일 것입니다.
    reason: 원문의 지명 독법(아두핌)을 보존하면서, 영어 POB 감사 기록에 반영된 학술적 교정 가능성(아두림)을 투명하게 제시합니다.
