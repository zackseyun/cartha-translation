  text: And Baelunan son of Achbor died, and Adath reigned in his place; and the name of his wife was Mayṭabigo, daughter of Maṭarego, daughter of Metebedzaab.
  footnotes:
  - marker: a
    text: Or 'after him'.
    reason: previous_rendering
  - marker: b
    text: Or 'Meṭabigo'.
    reason: previous_rendering
translation:
  language: ko
  text: 바엘루난, 아크부르의 아들이 죽고, 아닷이 그를 대신하여 왕이 되었으며, 아닷의 아내의 이름은 마이타비고였습니다. 마이타비고는 마타레고의 딸이고, 마타레고는 메테베드자압의 딸이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየንቴሁ
  english_pob_choice: in his place
  chosen_korean: 그의 자리에서
  alternatives_korean:
  - 그의 뒤를 이어
  - 그의 뒤에
  lexicon: 위치/계승 표현
  rationale: 개정된 영어 POB가 가리키는 ‘in his place’를 따라, 단순한 시간적 ‘뒤에’보다 계승과 대체를 드러내는 ‘그의 자리에서’로 옮겼습니다.
- source_word: መይጠቢጎ
  english_pob_choice: Mayṭabigo
  chosen_korean: 마이타비고
  alternatives_korean:
  - 마타비고
  - 메이타비고
  lexicon: 고유명사 음역
  rationale: 게에즈 철자에 있는 ይ(y)를 반영해 ‘마이타비고’로 음역했습니다. 영어 POB 주석의 대안 표기인 Meṭabigo보다 원철자에 더 가깝습니다.
- source_word: ባኤሉናን፡ ወልደ፡ አክቡር፡
  english_pob_choice: Baelunan son of Achbor
  chosen_korean: 바엘루난, 아크부르의 아들
  alternatives_korean:
  - 바엘루난, 아크보르의 아들
  - 바에루난, 아크부르의 아들
  lexicon: 고유명사 음역
  rationale: 인명은 현대 한국어 외래어 표기 감각에 맞추되, 원문과 영어 POB의 인명 형태를 유지하도록 ‘바엘루난’, ‘아크부르’로 옮겼습니다.
