review_pass:
  verdict: revise
  source_fidelity: ‘열두 아들’은 문맥 및 Charles 본문의 확정된 읽기와 영어 감사 기록에 부합합니다. 다만 ኢነገኁ/‘have not cast off’는 능력의 결여라기보다 현재까지 그 멍에를 벗어 버리지 않은 상태를 말하므로 ‘벗어버리지 못하였습니다’보다 ‘벗어 버리지 않았습니다’가 더 정확합니다. 또한 ‘그들 위에 놓은’은 한국어에서 다소 직역투이므로, 멍에를 ‘그들에게 씌운’ 것으로 표현하는 것이 원문의 관계를 자연스럽게 보존합니다.
  naturalness: 합쇼체는 적절합니다. ‘종살이의 멍에’도 예속의 은유를 분명히 보존합니다. 불필요하게 남아 있는 [a] 표지는 대응 각주가 없으며, 영어의 이전 번역 관련 각주는 한국어 본문에 필요하지 않습니다.
  terminology: ‘에돔의 자손들’, ‘야곱의 열두 아들’, ‘종살이의 멍에’는 족보적 표현, 고유명사, 예속 이미지를 각각 적절히 전달합니다. ‘열네와 열다섯’이라는 OCR 유래 읽기는 채택하지 않습니다.
  issues:
  - severity: medium
    issue: ‘벗어버리지 못하였습니다’가 원문의 부정을 능력·불능의 의미로 강화합니다.
    rationale: 원문과 영어 감사 기준은 ‘벗어 버리지 않았다’는 사실 진술이며, 불가능했다는 뜻을 명시하지 않습니다.
  - severity: low
    issue: ‘그들 위에 놓은’은 멍에의 한국어 결합에서 부자연스럽습니다.
    rationale: ‘그들에게 씌운’이 부과된 예속 관계를 자연스럽고 정확하게 표현합니다.
  - severity: low
    issue: 본문의 [a]에 대응하는 한국어 각주가 없습니다.
    rationale: 구조적으로 고아 표지가 되며, 해당 영어 각주는 폐기된 ‘열네와 열다섯’ 읽기에 관한 것이므로 유지할 필요가 없습니다.
