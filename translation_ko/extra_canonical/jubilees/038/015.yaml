translation:
  language: ko
  text: 그리고 에돔의 자손들은 오늘날까지 야곱의 열두 아들이 그들에게 씌운 종살이의 멍에를 벗어 버리지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ ኤዶም
  english_pob_choice: the sons of Edom
  chosen_korean: 에돔의 자손들
  alternatives_korean:
  - 에돔의 아들들
  - 에돔 사람들
  lexicon: proper noun / genealogical phrase
  rationale: 족보적 표현을 살려 ‘자손들’로 옮기고, 집단 전체를 가리키는 의미를 자연스럽게 전달했습니다.
- source_word: ኢነገኁ
  english_pob_choice: have not cast off
  chosen_korean: 벗어버리지 못하였습니다
  alternatives_korean:
  - 벗어버리지 않았습니다
  - 내버리지 못하였습니다
  lexicon: verb phrase
  rationale: ‘cast off’를 멍에와 결합된 관용으로 풀어, 현재까지 지속되는 미완료 상태를 분명히 했습니다.
- source_word: አርዑተ ቅኔ
  english_pob_choice: the yoke of servitude
  chosen_korean: 종살이의 멍에
  alternatives_korean:
  - 노역의 멍에
  - 예속의 멍에
  lexicon: metaphor / bondage imagery
  rationale: ‘멍에’의 은유를 유지하면서, 종속 상태를 드러내는 ‘종살이’를 붙여 원문의 강한 예속 의미를 살렸습니다.
- source_word: ፲ወ፪ቱ / textual context
  english_pob_choice: the twelve sons of Jacob
  chosen_korean: 야곱의 열두 아들
  alternatives_korean:
  - 야곱의 열네와 열다섯 아들
  - 야곱의 열두 자손
  lexicon: number phrase
  rationale: 본문의 역사적·문맥적 의미와 확정된 정본 전승에 따라 ‘열두 아들’로 번역했습니다.
theological_decisions:
- issue: 에돔-야곱의 지배/예속 관계를 어떻게 보존할지
  chosen_reading: 단순한 정치적 굴복이 아니라, 지금까지 지속되는 예속 상태를 가리키는 ‘종살이의 멍에’로 옮겼습니다.
  alternative_readings:
  - 정치적 종속
  - 복종의 짐
  rationale: 원문은 관계의 지속성과 억압성을 함께 드러내므로, 완곡하게 낮추지 않고 예속의 이미지를 유지했습니다.
  doctrine_reference: 역사 서술의 직역 원칙; 예속/압제 이미지 보존
