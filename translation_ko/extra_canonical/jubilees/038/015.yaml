revisions:
- from: 그리고 에돔의 자손들은 오늘날까지 야곱의 열두 아들이 그들 위에 놓은 종살이의 멍에를 벗어버리지 못하였습니다.[a]
  to: 그리고 에돔의 자손들은 오늘날까지 야곱의 열두 아들이 그들에게 씌운 종살이의 멍에를 벗어 버리지 않았습니다.
  rationale: 동사의 양태를 원문의 단순 부정에 맞추고, 멍에를 부과한 관계를 자연스러운 한국어로 다듬었으며, 대응 각주 없는 표지를 제거했습니다. ‘열두’는 제공된 영어 감사 기록이 확인하는 정본적·문맥적 읽기를 따릅니다.
  reviewer_model: gpt-5.6-terra
