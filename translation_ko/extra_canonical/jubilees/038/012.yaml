  source_fidelity: 게에즈어 본문은 ‘그들이 그들의 아버지에게 보내어, 그들과 평화를 이루어야 할지 혹은 그들을 죽여야 할지를 [물었다]’라는 양자택일의 문의를 담고 있습니다. 제공된 본문에는 마지막 동사 ይቀትልዎሙ(‘그들을 죽이다’)가 실제로 있으므로 이를 생략하거나 미완결로 처리해서는 안 됩니다. 초안은 이 핵심 대안을 번역하였으나, 발송의 목적어가 한국어에서 다소 불분명합니다.
  naturalness: ‘자기들의 아버지’는 이 문맥에서 부자연스럽고, ‘아버지에게 보내어’도 무엇을 보냈는지가 생략되어 문장이 다소 걸립니다. ‘아버지에게 사람을 보내어’와 ‘화친을 맺을지’는 현대의 격식 있는 성서 문체에서 자연스럽습니다.
