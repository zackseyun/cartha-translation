  text: And Levi and Dan and Asher went out toward the east side of the tower, and fifty were with them; and they killed the warriors of Moab and Ammon.
translation:
  language: ko
  text: 레위와 단과 아셀은 탑의 동쪽 편으로 나갔고, 오십 명이 그들과 함께 있었으며, 그들은 모압과 암몬의 전사들을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጽኡ፡ እንተ፡ ገጸ፡ ጽባሕ፡
  english_pob_choice: went out toward the east side of the tower
  chosen_korean: “탑의 동쪽 편으로 나갔고”
  alternatives_korean:
  - “탑의 동편으로 나갔고”
  - “탑의 동쪽 쪽으로 나갔고”
  lexicon: 방향 표현 / 지형어
  rationale: ge'ez의 ‘east side’와 POB의 방향 감각을 살려, 현대 한국어에서 자연스럽고 문어적인 “동쪽 편”으로 옮겼습니다.
- source_word: ወ*፶*ምስሌሆሙ
  english_pob_choice: and fifty were with them
  chosen_korean: “오십 명이 그들과 함께 있었으며”
  alternatives_korean:
  - “그들과 함께 오십 명이 있었으며”
  - “오십이 그들과 함께 있었으며”
  lexicon: 수량표현
  rationale: 주어 역할의 수량을 한국어 문장으로 명확히 풀어, ‘오십 명’이라는 인원을 직접 드러냈습니다.
- source_word: መስተቃትላኒሆሙ
  english_pob_choice: the warriors
  chosen_korean: “전사들을”
  alternatives_korean:
  - “용사들을”
  - “전투원들을”
  - “싸우는 자들을”
  lexicon: 전쟁 용어
  rationale: POB의 ‘warriors’를 따라 전투적 성격을 분명히 하되, ‘용사들’보다 서술적으로 중립적인 ‘전사들’로 옮겼습니다.
theological_decisions:
- issue: 전투 행위의 서술을 완곡하게 할지 여부
  chosen_reading: 원문의 직접 서술을 유지하여, 그들이 모압과 암몬의 전사들을 죽였다고 분명히 말했습니다.
  alternative_readings:
  - “무찔렀습니다”
  - “쓰러뜨렸습니다”
  rationale: 본문은 전쟁 행위를 서술적으로 미화하지 않으며, 사건의 사실성을 직접 전달합니다. 따라서 완곡한 표현보다 원문 그대로의 강한 동사를 유지했습니다.
  doctrine_reference: 서사 본문의 사실적 진술 보존
- issue: 고유명사 레위, 단, 아셀의 음역
  chosen_reading: 한국 교회에서 널리 통용되는 형태를 유지했습니다.
  alternative_readings:
  - “리비”, “댄”, “아셔”
  rationale: 이 인명들은 이미 정착된 성경 인명형을 따르는 것이 독자의 인지와 대조에 가장 유리합니다.
  doctrine_reference: 고유명사 관례
