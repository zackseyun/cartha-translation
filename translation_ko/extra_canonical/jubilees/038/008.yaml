  - 그들과 함께 오십 명이 있었고
  lexicon: 수사/동반 표현
  rationale: 원문은 동반 인원을 말하므로, 한국어에서 가장 자연스러운 서술형으로 정리했습니다.
- source_word: ጽኑዓነ፡ መስተቃትላነ።
