  terminology: 시므온, 베냐민, 르우벤, 에녹, 에돔, 호리 사람들은 통용되는 성서식 표기와 잘 부합합니다. ‘용사’는 강하고 전투에 능한 사람이라는 원문의 뜻을 간결하게 전달합니다.
