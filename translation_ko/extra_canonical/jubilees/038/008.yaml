  text: And Simeon and Benjamin and Enoch, the son of Reuben, went out to the west side of the tower, and fifty were with them; and they killed four hundred valiant warriors of Edom and the Horites.
translation:
  language: ko
  text: 그리고 시므온과 베냐민과 르우벤의 아들 에녹이 탑의 서편으로 나갔습니다. 그들과 함께한 사람은 오십 명이었고, 그들은 에돔과 호리 사람들의 용사 사백 명을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ገጸ፡ ዐረቢሁ
  english_pob_choice: went out to the west side of the tower
  chosen_korean: 탑의 서쪽으로 나갔습니다
  alternatives_korean:
  - 탑 서편으로 나갔습니다
  - 탑의 서쪽 편으로 나갔습니다
  lexicon: 지명/방향 표현
  rationale: 원문의 이동 방향을 자연스럽게 살리되, 영어 POB의 직접 이동 의미를 따라 ‘서쪽으로’로 간결하게 옮겼습니다.
- source_word: ወ፶ ምስሌሆሙ
