  - 에돔 사람과 호리 사람의
  lexicon: 민족명/소유 관계
  rationale: 영어 보정본이 ‘four hundred’가 에돔과 호리 사람들에 속한다고 분명히 하므로, 한국어도 소속 관계를 유지했습니다.
