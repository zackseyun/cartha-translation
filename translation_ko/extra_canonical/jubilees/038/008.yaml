  source_fidelity: 원문의 이동 대상인 탑의 서편과 동반 인원, 그리고 에돔과 호리 사람들에 속한 전투원 사백 명을 죽였다는 내용을 충실히 반영합니다. 다만 ‘탑의 서쪽으로’는 탑의 서쪽 지역으로 이동했다는 뜻으로도 읽힐 수 있으므로, 원문의 ‘탑의 서편(side)’을 더 분명히 하는 편이 안전합니다.
