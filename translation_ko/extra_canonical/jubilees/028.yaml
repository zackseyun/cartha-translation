base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/028.yaml
  text: '1[a]. And he lifted up his feet and went to the land of the east, to Laban, the brother of Rebekah, and he was with him.

    2. And he served him for Rachel seven years.

    3. And in the first year of the third week he said to him, “Give me my wife, for whom I have served you

    4. these seven years.” And Laban said to Jacob, “I will give you your wife.” And Laban made a feast and took

    5. Leah his elder daughter and gave her to Jacob as a wife, and he gave her Zilpah his maidservant as a handmaid.

    6. But Jacob did not know, for he thought that she was Rachel. And he went in to her, and behold,

    7. she was Leah. And Jacob was angry with Laban and said to him, “Why have you done this to me? Was I not

    8. serving you for Rachel and not for Leah? Why have you wronged me? Take your daughter,

    9. and I will go, for you have done evil against me.” For Jacob loved Rachel more than Leah,

    10. because Leah’s eyes were weak, but Rachel was beautiful in appearance and very lovely,

    11. and her eyes were beautiful and her form very lovely. And Laban said to Jacob, “It is not done thus

    12. in our land, to give the younger before the elder, and it is not right to do this, for

    13. thus it is ordained and written on the heavenly tablets that no one should give the younger daughter

    14. before the elder; first let him give the elder, and after her the younger. And the man who does thus[b],

    15. his sin ascends on his account into heaven, and there is no one righteous who does this matter, for

    16. this deed is evil before the LORD. And you also command the children of Israel that they not

    17. do this thing: let them not take or give the younger before they first give the elder,

    18. for it is very evil.” And Laban said to Jacob, “Let the seven days of this one’s marriage-feast pass,

    19. and I will give you Rachel also, if you will serve me another seven years, while you pasture my sheep,

    20. as you did in the first week.” And when the seven days of Leah’s marriage-feast had passed,

    21. Laban gave Rachel to Jacob, that he might serve him another seven years. And he gave

    22. Rachel Bilhah, the sister of Zilpah, as a maidservant. And he served another seven years for

    23. Rachel, for Leah had been given to him in exchange. And the LORD opened Leah’s womb, and she conceived

    24. and bore a son to Jacob, and he called his name Reuben, on the fourteenth day of the ninth month,

    25. in the first year of the third week. But Rachel’s womb was closed, because

    26. the LORD saw that Leah was hated, while Rachel was loved. And Jacob again went in to

    27. Leah, and she conceived and bore Jacob a second son, and he called his name Simeon, on the twenty-first

    28. day of the tenth month, in the third year of this week. And Jacob again went in to

    29. Leah, and she conceived and bore him a third son, and he called his name Levi, at dawn, on the first day of the first month,

    30. in the sixth year of this week. And Jacob again went in to her, and she conceived

    31. and bore him a fourth son, and he called his name Judah, on the fifteenth day of the third month,

    32. in the first year of the fourth week. And through all this Rachel was jealous of Leah, because she

    33. did not bear children, and she said to Jacob, “Give me children.” And Jacob said, “Have I withheld from you

    34. the fruit of your womb? Have I forsaken you?” And when Rachel saw that Leah had borne four children

    35. to Jacob—Reuben, Simeon, Levi, and Judah—she said to Bilhah, “Here is Bilhah,

    36. my maidservant; go in to her, and she will conceive and bear me a son.” And she gave Bilhah her maidservant to be his wife.

    37. And he went in to her, and she conceived and bore him a son, and she called his name Dan, on the ninth day of the sixth month,

    38. in the sixth year of the third week. And Jacob again went in a second time to Bilhah, and she conceived

    39. and bore Jacob a second son, and Rachel called his name Naphtali, on the fifth day

    40. of the seventh month, in the second year of the fourth week. And when Leah saw that she had ceased and was not bearing,

    41. she took and gave her Zilpah also, her maidservant, to Jacob as a wife, and she conceived and bore

    42. a son, and Leah called his name Gad, on the twelfth day of the eighth month, in the third year

    43. of the fourth week. And he again went in to her, and she conceived and bore him a second son, and she called

    44. his name Asher, on the second day of the eleventh month, in the fifth year of the fourth week.

    45. And Jacob went in to Leah, and she conceived and bore a son, and she called his name Issachar, on the fourth day

    46. of the fifth month, in the fourth year of the fourth week. And she gave him to a nurse. And Jacob went in again

    47. to her, and she conceived and bore a second son and a daughter, and she called the son’s name Zebulun,

    48. and the daughter’s name Dinah, in the seventh month, in the seventh year of the sixth week of the fourth jubilee. And the LORD had mercy

    49. on Rachel and opened her womb, and she conceived and bore a son, and she called his name

    50. Joseph, at dawn, on the fourth day of the fourth month, in the sixth year, in this fourth week. And in the days when

    51. Joseph was born, Jacob said to Laban, “Give me my wives and my children, and I will go to my father Isaac, and I will make

    52. a house for myself, for I have completed the years for which I served you for your two daughters, and I will go

    53. to my father’s house.” And Laban said to Jacob, “Stay with me for your wages, and pasture my flock for me again,

    54. and take your wages.” And they agreed between themselves that he would give him as wages every sheep

    55. that was dark and spotted, and every one that had white upon it, that was born among the lambs, should be his wages. And they would bear

    56. all the sheep that were speckled and those that had marks of spots and those that had dark spots, and the sheep would again

    57. bear according to their kinds; and every one with marks belonged to Jacob, and every one without marks to Laban.

    58. And Jacob’s possessions increased greatly, and he acquired cattle and sheep and camels

    59. and donkeys and servants and maidservants. And Laban and his sons envied Jacob, and Laban gathered his sheep away

    60. from him and acted deceitfully toward him.

    61. And it came to pass after Rachel had borne Joseph, that Laban went to shear his sheep, for he was far

    62. from him, a journey of three days. And Jacob saw that Laban had gone to shear

    63. his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come

    64. with him to the land of Canaan[e][d][c], for he told them everything that he had seen in a dream and everything that had been spoken to him.'
  footnotes:
  - marker: a
    text: 'Verses 3-4 are segmented across the sentence: Jacob''s request begins in v. 3 and the phrase ''these seven years'' completes it in v. 4.'
    reason: segmentation_note
  - marker: b
    text: 'The phrase ''heavenly tablets'' is a hallmark of Jubilees'' theology: earthly law is grounded in prewritten heavenly decree.'
    reason: cross_reference
  - marker: c
    text: In v. 18, 'the seven days of this one's marriage-feast' refers to Leah's bridal week.
    reason: cultural_note
  - marker: d
    text: The wording in vv. 33-34 is textually difficult. Jacob's reply is rendered as a rhetorical denial that he is responsible for Rachel's barrenness; an alternative sense is, 'Am I withholding from you the fruit of the womb? He has not forsaken you.'
    reason: alternative_reading
  - marker: e
    text: The livestock-color terms in vv. 55-57 are difficult and overlapping. The translation uses broad terms such as 'dark,' 'spotted,' and 'marks' to preserve the wage arrangement without claiming more precision than the text securely gives.
    reason: lexical_alternative
translation:
  language: ko
  text: '1[a]. 그리고 그가 발을 들고 동방 땅으로 가서 리브가의 아우 라반에게 이르렀는데, 그도 그와 함께 있었다.

    2. 그는 칠 년 동안 라헬을 위해 그를 섬겼습니다.

    3. 셋째 주의 첫째 해에 그가 그에게 말했습니다. “내가 당신을 섬겨서 아내를 주십시오.

    4. 이 7년.” 라반이 야곱에게 “내가 네 아내를 네게 주리라”고 말했습니다. 라반이 잔치를 베풀고

    5. 큰 딸 레아가 그를 야곱에게 아내로 주매 야곱도 그에게 자기 여종 실바를 여종으로 주었더라.

    6. 그러나 야곱은 그녀가 라헬인 줄 알았으므로 알지 못하였다. 그가 그 여자에게로 들어가 보니, 보라,

    7. 그녀는 레아였습니다. 야곱이 라반에게 화를 내며 그에게 이르되, 네가 어찌하여 나에게 이렇게 하였느냐?

    8. 레아가 아닌 라헬을 위해 당신을 섬기고 있습니까? 왜 나에게 잘못을 했나요? 딸을 데리고 가세요

    9. 당신들이 나에게 악을 행하였으니 나는 갈 것입니다.” 야곱이 레아보다 라헬을 더 사랑하였으니

    10. 레아는 눈이 약하고 라헬은 용모가 아름답고 심히 사랑스럽더라

    11. 그 눈은 아름답고 그 모습은 매우 아름다웠더라. 라반이 야곱에게 이르되 이같이 할 수 없느니라

    12. 우리 땅에서는 어린 자를 큰 자보다 먼저 주며 이렇게 하는 것은 옳지 아니하니

    13. 이같이 하늘 판에 정하여 기록되었으니 누구든지 작은 딸에게 주지 말라 하였느니라

    14. 장로 앞에서; 먼저 큰 사람에게 주고 그 다음에는 어린 아이를 주어야 합니다. 그리고 이렇게 하는 사람은[b],

    15. 그 죄로 말미암아 하늘에 사무쳤으나 이 일을 행하는 의인이 없느니라

    16. 이 행위는 주님 앞에 악한 일입니다. 또 이스라엘 자손에게 명하여 이르시되

    17. 이렇게 하십시오. 큰 사람에게 먼저 주기 전에 어린 아이를 취하지도 말고 주지도 마십시오.

    18. 그것은 심히 악한 것이기 때문입니다.” 라반이 야곱에게 이르되 이 사람의 혼인 잔치 칠 일을 지나게 하라

    19. 네가 만일 내 양 떼를 칠 동안에 칠 년을 더 나를 섬기면 내가 라헬도 네게 주리라

    20. 첫 주에 그랬던 것처럼.” 레아의 결혼 잔치 칠 일이 지나매

    21. 라반이 야곱에게 라헬을 주어 야곱이 다시 칠년을 섬기게 하였더라 그리고 그는 주었다

    22. 실바의 누이인 라헬 빌하가 여종으로 있었습니다. 그리고 그는 다시 7년을 봉사했습니다.

    23. 라헬은 레아를 그와 교환한 것입니다. 주님께서 레아의 태를 여시매 그가 잉태하니라

    24. 야곱에게 아들을 낳으매 그가 아홉째 달 십사일에 그의 이름을 르우벤이라 하였으며

    25. 세 번째 주의 첫째 해에. 그러나 라헬의 태는 닫혀 있었으니

    26. 주님께서 레아는 미움을 받고 라헬은 사랑함을 보신지라 그리고 야곱이 다시 그 집으로 들어갔다.

    27. 레아가 잉태하여 둘째 아들을 야곱에게 낳으매 그가 이십일일에 그 이름을 시므온이라 하였으며

    28. 이번 주의 셋째 해 열째 달의 날. 그리고 야곱이 다시 그 집으로 들어갔다.

    29. 레아가 임신하여 그에게 셋째 아들을 낳으매 그가 첫째 달 초하루 새벽에 그 이름을 레위라 하니라

    30. 이번 주 6년차. 야곱이 다시 그에게 들어가매 그가 잉태하니라

    31. 넷째 아들을 낳으매 셋째 달 십오일에 그 이름을 유다라 하니라

    32. 넷째 주 첫째 해에. 이 모든 일로 인해 라헬은 레아를 질투했습니다.

    33. 아이를 낳지 못하더니 야곱에게 이르되 나에게 자식을 주소서 야곱이 이르되 내가 너에게 말하지 아니하였느냐

    34. 당신의 태의 열매는 무엇입니까? 내가 당신을 버렸나요?” 라헬이 레아가 네 자녀를 낳은 것을 보고

    35. 르우벤, 시므온, 레위, 유다 야곱에게 빌하에게 이르되, 여기 빌하가 있느니라.

    36. 나의 하녀; 그 여자에게 들어가라. 그러면 그가 잉태하여 나에게 아들을 낳을 것이다.” 그리고 그 여종 빌하를 그의 아내로 삼았습니다.

    37. 그가 그에게로 들어갔더니 그가 임신하여 아들을 낳고, 여섯째 달 구일에 그의 이름을 단이라 불렀으며,

    38. 셋째 주 여섯째 해에. 야곱이 다시 빌하에게로 갔더니 그가 잉태하니라

    39. 야곱에게 둘째 아들을 낳으매 라헬이 다섯째 날에 그의 이름을 납달리라 하였더라

    40. 일곱째 달, 넷째 주의 둘째 해. 레아가 자기가 임신하지 못하여 임신하지 못함을 보고

    41. 그가 그 여종 실바를 데려다가 야곱에게 아내로 주매 그가 잉태하여 낳으니라

    42. 아들을 낳으매 레아가 그 이름을 갓이라 하였으니, 제삼년 여덟째 달 십이일이었더라

    43. 넷째 주. 그가 다시 그에게 들어가매 그가 잉태하여 둘째 아들을 낳고 그 이름을

    44. 그의 이름은 아셀이라. 넷째 주일 다섯째 해 열한째 달 둘째 날이었더라.

    45. 야곱이 레아에게로 들어갔더니 그가 잉태하여 아들을 낳고 넷째 날에 그의 이름을 잇사갈이라 하였더라

    46. 다섯째 달, 넷째 주 넷째 해. 그리고 그녀는 그를 간호사에게 맡겼습니다. 그리고 야곱은 다시 들어갔다.

    47. 그에게 잉태하여 둘째 아들과 딸을 낳고 그 아들의 이름을 스불론이라 하였으며

    48. 넷째 희년 여섯째 주의 칠년 일곱째 달에 딸의 이름을 디나라 하였더라 그리고 주님께서는 자비를 베푸셨습니다.

    49. 라헬이 그 태를 열었더니 그가 잉태하여 아들을 낳고 그의 이름을 이름하였더라

    50. 요셉이여, 제육년 넷째 달 넷째 날 새벽, 이 넷째 주간에. 그리고 그 시절에는

    51. 요셉이 태어났다. 야곱이 라반에게 말했다. “나의 아내와 자녀를 나에게 주십시오. 내가 아버지 이삭에게로 가서 아버지 이삭에게로 돌아가서,

    52. 내 집을 마련하라 내가 네 두 딸을 위하여 너를 섬긴 기한이 차서

    53. 내 아버지 집으로.” 라반이 야곱에게 이르되 네 삯을 위하여 나와 함께 있어 나를 위하여 내 양 떼를 먹이라

    54. 그리고 네 품삯을 받아라.” 그리고 그들은 양 떼마다 그에게 삯을 주기로 서로 합의했습니다.

    55. 어린 양 가운데서 태어난 검고 점 있는 것과 그 위에 흰 얼룩 있는 것 모두가 그의 품삯이 될 것이니라 그리고 그들은 견딜 것입니다

    56. 모든 얼룩 있는 양과 점 있는 양과 흑점이 있는 양을 다 멸절하고

    57. 그 종류대로, 표가 있는 사람은 모두 야곱에게 속했고, 표가 없는 사람은 모두 라반에게 속했습니다.

    58. 야곱의 소유가 크게 늘어나서 소와 양과 낙타를 얻었으니

    59. 당나귀와 남종과 여종들이니라 라반과 그의 아들들이 야곱을 시기하여 라반이 그의 양 떼를 모았느니라

    60. 그에게서 떠나 그에게 거짓 행위를 하였느니라

    61. 라헬이 요셉을 낳은 후, 라반이 자기 양털을 깎으러 갔다.

    62. 그로부터 3일의 여행이 있었다. 야곱은 라반이 양털을 깎으러 간 것을 보고

    63. 양 떼를 데리고 야곱이 레아와 라헬을 불러서 그들의 마음에 이르기를 그들이 오라 하였으니

    64. 그와 함께 가나안 땅으로 가라. 이는 그가 꿈에서 본 것과 자기에게 말한 것을 다 말하였음이라.'
