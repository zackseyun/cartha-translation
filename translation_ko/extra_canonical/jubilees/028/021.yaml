  english_pob_choice: that he might serve him another seven years
  chosen_korean: 야곱이 또 다른 일곱 해 동안 그를 섬기게 하였습니다
  alternatives_korean:
  - 야곱이 그를 위해 또 다른 일곱 해를 섬기게 하였습니다
  - 그가 야곱에게 또 다른 일곱 해 동안 섬김을 받게 하였습니다
  lexicon: 섬기다
  rationale: 목적절의 ‘섬기다’는 노동/봉사 관계를 직접 드러내므로, ‘another seven years’는 ‘또 다른 일곱 해 동안’으로 자연스럽게 처리했습니다.
