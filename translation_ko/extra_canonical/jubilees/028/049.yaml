  text: And the Lord remembered Rachel and opened her womb, and she conceived and bore a son, and she called his name
translation:
  language: ko
  text: 주님께서 라헬을 기억하시고 그녀의 태를 여셨습니다. 그녀가 잉태하여 아들을 낳았고, 그 이름을 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 야훼
  lexicon: Lord (divine title)
  rationale: 게으스 본문은 하나님의 주권적 행위를 말하므로 ‘주님’이 자연스럽고, 본문이 야훼 명시 인용이나 구약 인용 맥락은 아니므로 고유형 ‘야훼’로 옮기지 않았습니다.
- source_word: ወአርኀወ ማኅፀና
  english_pob_choice: opened her womb
  chosen_korean: 그녀의 태를 여셨습니다
  alternatives_korean:
  - 그녀의 자궁을 여셨습니다
  - 그녀의 태를 열어 주셨습니다
  lexicon: womb
  rationale: ‘마흐쏘나(태/자궁)’의 직접적 의미를 살리되, 현대 한국어에서 과도하게 해부학적으로 들리지 않도록 ‘태’를 택했습니다.
- source_word: ወጸውዐት ስሞ
  english_pob_choice: she called his name
  chosen_korean: 그 이름을 불렀습니다
  alternatives_korean:
  - 그의 이름을 불렀습니다
  - 이름을 지었습니다
  lexicon: called his name
  rationale: 원문은 아들의 이름을 부르는 행위까지는 말하지만 실제 이름 자체는 뒤에 와서 완결되는 구조이므로, 영어 POB처럼 미완결성을 살려 ‘그 이름을 불렀습니다’로 남겼습니다.
theological_decisions:
- issue: 하나님의 ‘기억하심’ 표현
  chosen_reading: ‘주님께서 라헬을 기억하시고’로 직역성을 유지했습니다.
  alternative_readings:
  - ‘주님께서 라헬을 생각하셨고’
  - ‘주님께서 라헬을 돌보셨고’
  rationale: 본문의 동사는 단순한 인지 회상이 아니라 언약적 돌보심을 포함할 수 있지만, 여기서는 그 함의를 덧씌우기보다 본문 자체의 표상을 보존하는 쪽이 더 적절합니다.
  doctrine_reference: 서술적 신적 개입 표현
