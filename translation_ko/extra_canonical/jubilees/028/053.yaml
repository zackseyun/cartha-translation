    issue: 원문에 없는 “라헬이 야곱을 낳은 후”가 삽입됨
    rationale: 제시된 게에즈어와 영어 감사본은 첫 인용문의 끝 뒤에 곧바로 ‘라반이 야곱에게 말하였다’고 합니다. 삽입문은 본 절의 내용·인물 관계·담화 구조를 변경합니다.
  - severity: medium
    issue: ‘나를 위하여’(ሊተ, English ‘for me’)가 누락됨
    rationale: 라반이 자신의 양 떼를 자신을 위해 치라고 하는 목적/수혜 표현이므로 번역에 반영해야 합니다.
  - severity: low
    issue: ‘돌아가겠습니다’의 ‘돌아’가 원문 제시부와 영어 감사본의 ‘to’보다 구체적임
