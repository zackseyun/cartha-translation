  text: to my father’s house.” And Laban said to Jacob, “Stay with me for your wages, and pasture my flock for me again.”
translation:
  language: ko
  text: “아버지 집으로 돌아가겠습니다.” 라헬이 야곱을 낳은 후, 라반이 야곱에게 말했습니다. “나와 함께 있으면서 삯을 받으시오. 그리고 다시 내 양 떼를 치시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: بَيْت أَبِي / ቤተ አቡየ
  english_pob_choice: to my father’s house
  chosen_korean: “아버지 집으로 돌아가겠습니다.”
  alternatives_korean:
  - “아버지의 집으로 가겠습니다.”
  - “우리 아버지의 집으로 돌아가겠습니다.”
  lexicon: house
  rationale: 문맥상 화자의 귀향 의사를 직접 인용한 표현이므로, 자연스러운 현대 한국어로 ‘아버지 집’이라고 옮겨 가야 할 방향성을 살렸습니다.
- source_word: ንበር ኀቤየ
  english_pob_choice: Stay with me
  chosen_korean: 나와 함께 있으면서
  alternatives_korean:
  - 내게 머무시오
  - 나와 함께 지내시오
  lexicon: dwell/stay
  rationale: Geez의 명령형은 단순한 체류가 아니라 라반과의 동거·동행 관계를 가리키므로, 직역보다 관계를 드러내는 표현을 선택했습니다.
- source_word: በዐስብከ
  english_pob_choice: for your wages
  chosen_korean: 삯을 받으시오
  alternatives_korean:
  - 임금을 받으시오
  - 품삯을 받으시오
  lexicon: wages/earnings
  rationale: ‘삯’은 고용 보수의 성격을 분명히 하면서도 본문의 거래성을 간결하게 드러냅니다.
- source_word: መርዔትየ
  english_pob_choice: my flock
  chosen_korean: 내 양 떼
  alternatives_korean:
  - 내 가축 떼
  - 내 떼
  lexicon: flock
  rationale: 목축 맥락에서 ‘양 떼’가 가장 직접적이며, 라반의 소유를 분명히 보여 줍니다.
theological_decisions:
- issue: 직접화법 안의 명령형과 공손 체계
  chosen_reading: 라반의 말은 현대 한국어 공손체로 옮기되, 본문의 명령성은 유지했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 높은 경어로 과도하게 순화
  rationale: 이 구절은 계약적 지시를 담은 직접 발화이므로, 공손한 형식 속에서도 명령·요청의 힘을 보존하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 서사 문맥의 발화 행위 보존
- issue: 출처 텍스트의 인용 구조
  chosen_reading: 귀향 발화와 라반의 발화를 문장상 분리해 읽히게 했습니다.
  alternative_readings:
  - 한 문장으로 압축
  - 인용부호를 줄여 평서문처럼 처리
  rationale: 원문은 두 발화가 연속되는 구조이므로, 한국어에서도 인용 경계를 분명히 해야 화자의 전환이 유지됩니다.
  doctrine_reference: 서사/담화 구조 보존
