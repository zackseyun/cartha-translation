  source_fidelity: 후반부의 ‘라반과 그의 아들들은 야곱을 시기했고, 라반은 자기 양 떼를 모았습니다’는 게에즈어의 인물·대상·행동을 충실히 반영합니다. 앞부분의 종속 신분 집단은 성별이 구별되어 있으므로 ‘종들과 여종들’보다 ‘남종들과 여종들’이 더 명시적이고 안전합니다.
