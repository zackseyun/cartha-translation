  text: and donkeys and servants and maidservants. And Laban and his sons envied Jacob, and Laban gathered his sheep.
translation:
  language: ko
  text: 또 나귀들과 남종들과 여종들도 있었습니다. 라반과 그의 아들들은 야곱을 시기했고, 라반은 자기 양 떼를 모았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ
  english_pob_choice: servants and maidservants
  chosen_korean: 종들과 여종들
  alternatives_korean:
  - 종들과 하녀들
  - 남종들과 여종들
  lexicon: δοῦλος / δοῦλη default; gendered service terms
  rationale: 영어 POB의 'servants and maidservants'를 따라, 지위가 드러나는 일반적 종속 관계를 자연스럽게 옮겼습니다. '하녀들'보다 본문 맥락의 종속성을 더 분명히 드러내기 위해 '여종들'을 택했습니다.
- source_word: ላባ፡ ወውሉዱ፡ ላዕለ፡ ያዕቆብ፡ ወቀንአ፡
  english_pob_choice: Laban and his sons envied Jacob
  chosen_korean: 라반과 그의 아들들은 야곱을 시기했고
  alternatives_korean:
  - 라반과 그의 아들들은 야곱을 질투했고
  - 라반과 그의 아들들은 야곱을 부러워했고
  lexicon: φθονέω / envy
  rationale: 본문의 감정은 단순한 부러움보다 경쟁적이고 적대적인 '시기'가 더 가깝습니다. 영어 POB의 'envied'도 그 뉘앙스를 지지합니다.
- source_word: አስተጋብአ
  english_pob_choice: gathered
  chosen_korean: 모았습니다
  alternatives_korean:
  - 모아들였습니다
  - 거두었습니다
  - 불러모았습니다
  lexicon: συνάγω / gather
  rationale: 라반이 자기 양 떼를 한데 모은다는 단순 동작을 가장 자연스럽게 살렸습니다. 이 구절에는 'away'에 해당하는 추가 방향어가 없으므로, 양 떼를 옮겨간다는 뜻으로 확장하지 않았습니다.
theological_decisions:
- issue: 본문의 서술은 서사적 사실 진술이며, 별도의 신학적 용어 선택이 중심이 아닙니다.
  chosen_reading: 감정 동사 '시기'와 단순 동작 '모았습니다'를 그대로 살려 서사의 긴장감을 유지했습니다.
  alternative_readings:
  - 감정과 행동을 완화해 '부러워했고' 또는 '데려갔습니다'로 옮기는 읽기
  rationale: 게젠 계열의 서사에서는 인물 간 경쟁과 소유 갈등이 중요한 의미를 갖기 때문에, 본문이 말하는 감정의 강도와 행동의 단순성을 약화시키지 않았습니다.
  doctrine_reference: 서사 본문의 의미 보존 원칙
