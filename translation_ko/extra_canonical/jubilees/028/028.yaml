  lexicon: source-note
  rationale: 게에즈 원문의 ወአሐዱ는 영어 개정본의 'on the first'처럼 날짜 서두의 '첫째'를 뜻하므로, 달을 수식하는 '첫째 날'로 옮겨 자연스러운 현대 한국어 날짜 표현을 살렸습니다.
- source_word: ዘወርኅ፡ ዓሥር
