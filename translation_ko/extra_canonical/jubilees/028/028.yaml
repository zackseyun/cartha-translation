  chosen_reading: ‘그 주의 셋째 해, 열째 달의 첫째 날’처럼 원문의 연대 구조를 보존해 번역했습니다.
  alternative_readings:
  - ‘그 주기의 3년째 해’처럼 더 설명적으로 풀기
  - ‘10월 1일’처럼 현대 날짜로 환산하기
  rationale: 이 구절은 서사 진행보다 연대 표지가 핵심이므로, 환산하거나 과도하게 해설하면 본문이 가진 절기·주기 체계를 흐릴 수 있습니다.
  doctrine_reference: 본문 보존 원칙
