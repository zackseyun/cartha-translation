  chosen_korean: 열째 달
  alternatives_korean:
  - 열 번째 달
  - 십월
  lexicon: source-note
  rationale: 원문은 '열째 달'의 직역 구조를 취하므로, 달명 체계의 고유명화보다 원문 질서를 드러내는 표현을 선택했습니다.
- source_word: ለዝ፡ ሱባዔ
  english_pob_choice: in the third year of this week
  chosen_korean: 그 주의 셋째 해
  alternatives_korean:
  - 이 주의 셋째 해
  - 이 주간의 셋째 해
  lexicon: source-note
  rationale: 게에즈의 '이 주(week)'와 '셋째 해'의 결합을 그대로 살려, 본문이 말하는 연대 단위를 평이하게 전달했습니다.
- source_word: ወደገመ፡ ያዕቆብ፡ ወቦአ
  english_pob_choice: Jacob again went in to
  chosen_korean: 야곱이 다시 들어갔습니다
  alternatives_korean:
  - 야곱이 다시 들어갔습니다
  - 야곱이 또 들어갔습니다
  lexicon: source-note
  rationale: 원문 동사군은 야곱의 재진입/재방문을 나타내므로, 한국어에서는 목적어가 생략된 상태를 유지해 '다시 들어갔습니다'로 간결하게 옮겼습니다.
theological_decisions:
