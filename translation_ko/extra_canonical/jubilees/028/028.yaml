  source_fidelity: 게에즈 원문의 연대 표지(‘그 주의 셋째 해’, ‘열째 달’, ‘첫째 날’)와 접속사, 그리고 ‘야곱이 다시 들어갔다’라는 미완의 서술을 충실히 반영합니다. 영어 POB 감사 문구의 ‘And on the first day of the tenth month, in the third year of this week, Jacob again went in to’와도 의미상 일치합니다.
  naturalness: ‘그리고 그 주의 셋째 해, 열째 달의 첫째 날에 야곱이 다시 들어갔습니다.’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 원문 자체가 다음 구절로 이어지는 ‘들어가다’의 목적지/대상 미표시 구문이므로, 한국어에서도 이를 덧붙여 보완하지 않은 처리가 적절합니다.
  terminology: ‘열째 달’, ‘첫째 날’, ‘그 주의 셋째 해’는 본문의 달력·주기 표현을 현대식 월일 표기로 환산하지 않고 보존합니다. ‘야곱’도 통용되는 성서 인명 표기입니다.
