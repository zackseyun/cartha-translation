    issue: ‘그것을 알지 못했습니다’의 지시 대상이 불명확합니다.
    rationale: 원문과 영어 감사본은 야곱이 상대 여성을 라헬로 여긴 까닭에 사실을 알지 못했다는 뜻입니다. 한국어에서는 ‘그것’만으로는 무엇을 몰랐는지 자연스럽게 파악하기 어렵습니다.
  - severity: low
