  verdict: revise
  source_fidelity: 게에즈어의 부정 인지 동사와 이유절, 그리고 ‘그녀에게 들어갔다’라는 완곡한 결합 서술 및 미완의 주의 환기 표지는 대체로 반영되었습니다. 다만 초안의 ‘그것을 알지 못했습니다’에서 지시 대상이 불명확하여, 원문의 오인 상황을 한국어에서 더 정확히 드러낼 필요가 있습니다.
  naturalness: ‘그녀가 라헬이라고 생각했으므로 그것을 알지 못했습니다’는 인과 관계와 ‘그것’의 지시가 다소 어색합니다. 두 문장으로 나누어 오인과 무지를 자연스럽게 연결하는 편이 현대 한국어 합쇼체에 적합합니다. ‘그녀에게로 들어갔습니다’는 원문의 완곡한 서술을 유지합니다.
  terminology: 야곱, 라헬은 통용 성경식 표기를 유지했습니다. 성적 결합을 가리키는 관용적 완곡 표현은 불필요하게 노골화하거나 교리적으로 해석하지 않고 보존했습니다.
  issues:
