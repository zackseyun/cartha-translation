translation:
  language: ko
  text: 그리고 당신의 삯을 받으십시오.” 그러자 그들은 그가 그에게 그의 삯으로[b] 모든 새끼 양을 주기로 서로 합의했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “모든 양”.
    reason: The underlying flock term can be rendered more broadly as “sheep,” though the accompanying term specifically indicates young animals/lambs.
  - marker: b
    text: 또는 “삯으로”.
    reason: This reflects the alternative, less explicit rendering of the phrase “as his wages.”
lexical_decisions:
- source_word: ወንሣእ፡ ዐስበከ።
  english_pob_choice: and take your wages.
  chosen_korean: 그리고 너희 삯을 받으십시오.
  alternatives_korean:
  - 그리고 너희 삯을 취하십시오.
  - 그리고 너희 보수를 받으십시오.
  lexicon: ዐስብ / ἀσβός 계열의 '삯, 보수' 의미
  rationale: 명령형의 대화체를 살리되, 문맥상 품삯을 뜻하는 표현이므로 일상적이면서도 격식 있는 ‘삯’을 택했습니다.
- source_word: በበይናቲሆሙ
  english_pob_choice: They agreed between themselves
  chosen_korean: 그들은 서로 합의하여
  alternatives_korean:
  - 그들은 자기들끼리 შეთანხმ하여
  - 그들은 서로 상의하여
  lexicon: 내부 협의/합의 표현
  rationale: 주어들 사이의 상호 합의를 나타내므로, 자연스러운 표준어 ‘서로 합의하여’로 옮겼습니다.
- source_word: የሀቦ፡ ዐስቦ፡
  english_pob_choice: he would give him as his wages
  chosen_korean: 그가 삯으로 그에게 주기로 했습니다
  alternatives_korean:
  - 그가 삯으로 그에게 주겠다고 했습니다
  - 그가 그 삯을 그에게 주기로 했습니다
  lexicon: ‘as his wages’ 소유격 포함
  rationale: 아카드/게에즈 형태의 소유 접미사가 반영된 표현이므로, 단순히 ‘삯으로’만 두지 않고 ‘주기로 했습니다’로 문맥을 살리되 소유 의미는 앞의 ‘삯’ 관계로 자연스럽게 드러나게 했습니다.
- source_word: '*ኵሎ፡ በግዐ፡ እመሐስዕ'
  english_pob_choice: every lamb
  chosen_korean: 모든 새끼 양
  alternatives_korean:
  - 모든 어린 양
  - 모든 양 새끼
  lexicon: ‘lambs/young’에 해당하는 እመሐስዕ 및 በግዐ
  rationale: 개정 전 ‘every sheep’보다, 원문이 양 떼의 어린 짐승을 가리키는 점을 반영해 ‘새끼 양’으로 구체화했습니다.
