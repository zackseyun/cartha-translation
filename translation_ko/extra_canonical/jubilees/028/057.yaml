translation:
  language: ko
  text: 양 떼는 종류대로 새끼를 낳았고, 표가 있는 것은 모두 야곱에게 속하였으며, 표가 없는 것은 모두 라반에게 속하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዐ
  english_pob_choice: The sheep
  chosen_korean: 양 떼는
  alternatives_korean:
  - 양들은
  - 양 떼가
  lexicon: 양 떼
  rationale: 게에즈 원문과 영어 POB 모두 이 절의 주어를 ‘sheep’로 분명히 제시하므로, 한국어도 주어를 앞에 분명히 드러내어 서술의 주체를 유지했습니다.
- source_word: ይለዳ
  english_pob_choice: bore according to their kinds
  chosen_korean: 종류대로 새끼를 낳았고
  alternatives_korean:
  - 제 종류대로 낳았고
  - 그 종류대로 새끼를 낳았고
  lexicon: 새끼를 낳다
  rationale: 동사의 핵심은 ‘낳다’이므로 이를 살리고, ‘according to their kinds’는 자연스러운 한국어 관용으로 ‘종류대로’ 옮겨 반복적 번식의 질서를 드러냈습니다.
- source_word: ዘበአርአያሆን
  english_pob_choice: with marks
  chosen_korean: 표가 있는 것은
  alternatives_korean:
  - 표식이 있는 것은
  - 무늬가 있는 것은
  lexicon: 표
  rationale: 원문의 ‘표/표식’을 가장 सीधे 반영하는 표현으로 ‘표가 있는 것’이 적합하며, 뒤의 대조 구문과도 대응됩니다.
- source_word: ዘአልቦ ትእምርት
  english_pob_choice: without marks
  chosen_korean: 표가 없는 것은
  alternatives_korean:
  - 표식이 없는 것은
  - 무늬가 없는 것은
  lexicon: 표
  rationale: 이 절은 ‘표가 있는 것/없는 것’의 소유 구분이 핵심이므로, 같은 어휘를 반복해 대조 구조를 분명하게 했습니다.
theological_decisions:
- issue: 소유/귀속 표현의 법적·관계적 의미
  chosen_reading: ‘속하였습니다’로 번역해 표가 있는 짐승이 야곱에게 귀속되고 표가 없는 짐승이 라반에게 귀속된다는 소유 구분을 분명히 했습니다.
  alternative_readings:
  - ‘야곱의 것이었습니다’
  - ‘라반의 것이었습니다’
  rationale: 원문은 단순한 위치나 선호가 아니라 귀속 관계를 말하므로, 결과 상태를 나타내는 ‘속하다’가 가장 직접적입니다.
  doctrine_reference: 서사 맥락의 재산 분배 표현; 특별한 교리 쟁점 없음.
