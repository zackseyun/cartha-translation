translation:
  language: ko
  text: 그에게서 임신하여 또 다른 아들과 딸을 낳았고, 그녀는 그 아들의 이름을 스불론이라 불렀습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፀንሰት፡ ወወለደት፡ *ካልእተ፡ ወልደ፡⁸ ወወለተ፡⁹
  english_pob_choice: she conceived and bore another son and a daughter
  chosen_korean: 임신하여 또 다른 아들과 딸을 낳았고
  alternatives_korean:
  - 잉태하여 둘째 아들과 딸을 낳았고
  - 임신하여 한 아들과 딸을 더 낳았고
  lexicon: 임신하다 / 낳다
  rationale: 게에즈 원문은 ‘임신하다’와 ‘낳다’의 연속으로 출산을 분명히 말하며, ḥalleta 계열은 이 문맥에서 ‘another/other’의 의미가 자연스러워 ‘또 다른’으로 옮겼습니다. 영어 POB의 revised audit도 'another son'을 지지합니다.
- source_word: ዘቡሎን፡
  english_pob_choice: Zebulun
  chosen_korean: 스불론
  alternatives_korean:
  - 세불론
  - زب울론
  lexicon: 고유명사 음역
  rationale: 성경에서 널리 통용되는 한국어 음역을 따르되, 현대 표기 관행에 맞는 ‘스불론’을 채택했습니다.
theological_decisions:
- issue: ‘another son’의 수사적 범위
  chosen_reading: ‘둘째 아들’보다 ‘또 다른 아들’로 처리해 원문의 비특정적 의미를 유지했습니다.
  alternative_readings:
  - 둘째 아들
  - 한 아들을 더
  rationale: 게에즈 어형은 단순한 서수 표지로만 고정되지 않으며, 족보/출생 서술에서는 ‘another’가 더 정확한 경우가 있습니다. 여기서는 출생 순서의 혼선을 줄이기 위해 비서수적 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존
