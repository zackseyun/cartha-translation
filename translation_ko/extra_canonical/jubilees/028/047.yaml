  lexicon: 고유명사 음역
  rationale: 성경에서 널리 통용되는 한국어 음역을 따르되, 현대 표기 관행에 맞는 ‘스불론’을 채택했습니다.
theological_decisions:
- issue: ‘another son’의 수사적 범위
  chosen_reading: ‘둘째 아들’보다 ‘또 다른 아들’로 처리해 원문의 비특정적 의미를 유지했습니다.
  alternative_readings:
  - 둘째 아들
  - 한 아들을 더
  rationale: 게에즈 어형은 단순한 서수 표지로만 고정되지 않으며, 족보/출생 서술에서는 ‘another’가 더 정확한 경우가 있습니다. 여기서는 출생 순서의 혼선을 줄이기 위해 비서수적 표현을 택했습니다.
  doctrine_reference: 본문 의미 보존
