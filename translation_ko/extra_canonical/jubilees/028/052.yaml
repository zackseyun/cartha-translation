  - severity: medium
    issue: ‘당신의 두 딸을 위해 당신에게 봉사한’의 관계가 모호함
    rationale: 이는 딸들을 위해 봉사했다는 뜻으로 읽힐 수 있습니다. 문맥과 ህየንተ의 교환·대가 관계를 반영하여 ‘두 딸을 얻기 위해 … 일한’으로 옮기는 것이 정확합니다.
