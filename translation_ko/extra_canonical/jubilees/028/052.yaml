  source_fidelity: 첫 구절의 게에즈어 ሊተ፡ ቤተ፡는 ‘나를 위한 집’이라는 뜻이며, 창세기 평행본문에 따라 ‘아내를 달라’로 고쳐서는 안 됩니다. 다만 초안의 ‘집을 지으십시오’는 원문에 없는 ‘짓다’를 특정합니다. ህየንተ는 두 딸을 ‘위하여’ 봉사했다기보다 그들을 얻는 대가로 봉사한 관계를 나타내므로 이를 분명히 하는 편이 정확합니다.
  naturalness: ‘햇수를 다 채웠으니, 이제 가겠습니다’는 자연스러운 합쇼체입니다. ‘저를 위한 집을 마련해 주십시오’는 단편적으로 전해진 명사구를 한국어의 자연스러운 요청으로 연결하면서도 건축 행위를 단정하지 않습니다.
  terminology: ‘봉사한’은 계약 노동의 문맥에서 다소 부자연스럽고 자선적 뉘앙스를 낼 수 있어 ‘일한’으로 바꾸었습니다. ‘집’은 원문의 난해하지만 명시적인 어휘를 그대로 유지했습니다.
