translation:
  language: ko
  text: 저를 위한 집을 마련해 주십시오. 제가 당신의 두 딸을 얻기 위해 당신에게 일한 햇수를 다 채웠으니, 이제 가겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 창세기 평행본문에 따라, ‘제 아내를 주십시오.’ 그러나 여기의 게에즈어 본문은 ‘저를 위한 집’을 읽습니다.
    reason: 본문의 ‘집’이라는 게에즈어 읽기를 보존하면서, 평행본문에서 비롯된 대안적 읽기를 투명하게 밝협니다.
lexical_decisions:
- source_word: ሊተ፡ ቤተ፡
  english_pob_choice: a house for myself
  chosen_korean: 저를 위해 집을 지으십시오
  alternatives_korean:
  - 저를 위한 집
  - 제 집을 주십시오
  lexicon: house / house for oneself
  rationale: Ge'ez의 ሊተ(‘나를 위해’)와 ቤተ(‘집’)를 반영해, 단순 명사구보다 문맥상 요청의 뜻이 드러나는 한국어로 옮겼습니다. 기존 영어 POB의 수정안인 ‘Give me my wife’는 원문과 맞지 않으므로 따르지 않았습니다.
- source_word: ፈጸምኩ፡ ዓመታተ፡
  english_pob_choice: I have completed the years
  chosen_korean: 제가 … 햇수를 다 채웠으니
  alternatives_korean:
  - 제가 … 세월을 마쳤으니
  - 제가 … 해를 채웠으니
  lexicon: completed the years
  rationale: ‘완료하다’의 결과 상태를 살려 ‘다 채웠으니’로 옮겨, 약속한 노동 기간이 끝났음을 자연스럽게 표현했습니다.
- source_word: ዘተቀነይኩ፡ ለከ፡
  english_pob_choice: for which I served you
  chosen_korean: 제가 당신에게 봉사한
  alternatives_korean:
  - 제가 당신을 섬긴
  - 제가 당신을 위해 일한
  lexicon: served you
  rationale: 시종/종역의 관계를 나타내는 동사를 지나치게 격식화하지 않으면서도, 계약적 노동의 뉘앙스를 살려 ‘봉사한’으로 번역했습니다.
- source_word: ክልኤቲ አዋልዲከ፡
  english_pob_choice: your two daughters
  chosen_korean: 당신의 두 딸을 위해
  alternatives_korean:
  - 당신의 두 딸 때문에
  - 당신의 두 딸을 위하여
  lexicon: your two daughters
  rationale: 원문의 ‘~을 위해’에 해당하는 관계를 유지해, 앞의 노동 기간이 두 딸과 관련된 봉사였음을 분명히 했습니다.
theological_decisions:
- issue: 문맥상 요청의 대상이 ‘집’인지 ‘아내’인지
  chosen_reading: 게'에즈 원문과 영어 POB의 최종 수정 내역을 따라 ‘집’으로 번역했습니다.
  alternative_readings:
  - Genesis 평행본문에 따라 ‘제 아내를 주십시오’로 옮기는 القراءة
  - 문맥을 보정해 ‘제 아내를 제게 주십시오’로 옮기는 해석
  rationale: 제공된 원문 ሊተ፡ ቤተ፡는 분명히 ‘나를 위한 집/집을 위하여’이며, 후속 영어 수정은 원문과 충돌합니다. 따라서 원문 우선 원칙에 따라 ‘집’을 유지했습니다.
  doctrine_reference: source primacy / textual fidelity
