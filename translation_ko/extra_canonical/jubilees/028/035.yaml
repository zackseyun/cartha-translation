translation:
  language: ko
  text: 야곱에게 — 르우벤과 시므온과 레위와 유다가 있었고 — 그녀가 그에게 말했습니다. “빌하에게로 들어가십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለያዕቆብ፡ ሮቤል*ሃ፡ ወስምዖን*ሃ፡ ወሌዊሃ፡ ወይሁዳ*ሃ፡
  english_pob_choice: to Jacob—Reuben, Simeon, Levi, and Judah—
  chosen_korean: 야곱에게 — 르우벤과 시므온과 레위와 유다가 있었고 —
  alternatives_korean:
  - 야곱에게 — 르우벤, 시므온, 레위, 그리고 유다 —
  - 야곱에게 — 르우벤과 시므온과 레위와 유다가 —
  lexicon: 고유명사
  rationale: 게에즈 본문은 야곱에게 네 아들을 열거하는 방식이므로, 한국어에서도 나열을 살리되 목록이 문장에 매달리는 느낌을 유지했습니다.
- source_word: ወትቤሎ፡
  english_pob_choice: and she said to him
  chosen_korean: 그녀가 그에게 말했습니다
  alternatives_korean:
  - 그리고 그녀가 그에게 말했습니다
  - 그녀가 그에게 이르렀습니다
  lexicon: 말하다
  rationale: 원문은 ‘그에게’라고 분명히 대상자를 표시하므로, 영어 본문의 수정된 이해를 반영해 청자 오인을 피했습니다.
- source_word: ባላ፡ ኀበ፡ *ባላ፡
  english_pob_choice: “Go in to Bilhah.”
  chosen_korean: “빌하에게로 들어가십시오.”
  alternatives_korean:
  - “빌하에게 들어가십시오.”
  - “빌하에게로 가십시오.”
  lexicon: 들어가다
  rationale: 영어 POB의 수정본과 게에즈 맥락이 성적 관계를 함축하는 관용구로 읽히므로, 너무 완곡한 ‘가다’보다 직역에 가까운 ‘들어가다’가 더 정확합니다.
theological_decisions:
- issue: 직접화법의 명령 어조
  chosen_reading: 직접 인용문 안에서는 평서체가 아니라 예의 있는 명령형 “들어가십시오”로 옮겼습니다.
  alternative_readings:
  - “들어가세요.”
  - “들어가십시오.” 대신 “가십시오”
  rationale: 본문은 등장인물의 직접 발화를 전달하므로, 현대 표준어의 합쇼체 명령을 써서 발화의 강도를 보존했습니다.
  doctrine_reference: 서사 직접화법의 문체 보존
