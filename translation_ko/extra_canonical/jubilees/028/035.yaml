  - 그녀가 그에게 이르렀습니다
  lexicon: 말하다
  rationale: 원문은 ‘그에게’라고 분명히 대상자를 표시하므로, 영어 본문의 수정된 이해를 반영해 청자 오인을 피했습니다.
