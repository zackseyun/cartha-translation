  english_pob_choice: to Jacob—Reuben, Simeon, Levi, and Judah—
  chosen_korean: 야곱에게 — 르우벤과 시므온과 레위와 유다가 있었고 —
  alternatives_korean:
  - 야곱에게 — 르우벤, 시므온, 레위, 그리고 유다 —
  - 야곱에게 — 르우벤과 시므온과 레위와 유다가 —
  lexicon: 고유명사
  rationale: 게에즈 본문은 야곱에게 네 아들을 열거하는 방식이므로, 한국어에서도 나열을 살리되 목록이 문장에 매달리는 느낌을 유지했습니다.
- source_word: ወትቤሎ፡
  english_pob_choice: and she said to him
  chosen_korean: 그녀가 그에게 말했습니다
  alternatives_korean:
