  - “빌하에게로 가십시오.”
  lexicon: 들어가다
  rationale: 영어 POB의 수정본과 게에즈 맥락이 성적 관계를 함축하는 관용구로 읽히므로, 너무 완곡한 ‘가다’보다 직역에 가까운 ‘들어가다’가 더 정확합니다.
