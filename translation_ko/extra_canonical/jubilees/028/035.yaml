translation:
  language: ko
  text: 야곱에게는 르우벤과 시므온과 레위와 유다가 있었고, 그녀는 그에게 말했습니다. “빌하에게로 들어가십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 게에즈 본문은 전승상 문제가 있는 것으로 보입니다. 여기서는 동사의 목적어와 문맥을 따라 “그에게 말했습니다. ‘빌하에게로 들어가십시오.’”로 옮겼습니다.
    reason: 본문의 ‘그에게’와 빌하를 향한 명령이라는 채택된 읽기를 투명하게 밝히며, 이전의 부정확한 대안 읽기를 반복하지 않습니다.
