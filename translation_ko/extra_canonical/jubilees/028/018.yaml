lexical_decisions:
- source_word: እኩይ፡⁶ ጥቀ።
  english_pob_choice: for it is very evil.
  chosen_korean: “왜냐하면 그것은 매우 악하기 때문입니다.”
  alternatives_korean:
  - “왜냐하면 그것은 악하기 때문입니다.”
  - “왜냐하면 그것은 지극히 악하기 때문입니다.”
  lexicon: 악하다
  rationale: 게으즈어 ጥቀ는 강한 정도부사이므로 POB의 ‘very’에 맞춰 ‘매우’로 살렸고, እኩይ는 도덕적 판단을 약화시키지 않도록 ‘악하다’로 옮겼습니다.
- source_word: ላባ፡ ለያዕቆብ፡
  english_pob_choice: And Laban said to Jacob,
  chosen_korean: 라반이 야곱에게 말했습니다.
  alternatives_korean:
  - 라반이 야곱에게 말했습니다.
  - 라반이 야곱에게 이르렀습니다.
  lexicon: 고유명사 표기
  rationale: 라반, 야곱은 한국어 성경에서 통용되는 표기를 유지했고, 단순 서술 동사는 직접화법 도입에 맞는 ‘말했습니다’로 옮겼습니다.
- source_word: ይኅልፍ፡⁷ ሰቡዐ፡ መዋዕለ፡ ግዝአ፡⁸ ለዛ፡
  english_pob_choice: Let the seven days of this one’s marriage feast pass,
  chosen_korean: “이 사람의 혼인 잔치의 칠 일을 지나가게 하십시오.”
  alternatives_korean:
  - “이 사람의 혼인 잔치의 칠 일을 보내십시오.”
  - “이 사람의 혼인 잔치의 일곱 날이 지나가게 하십시오.”
  lexicon: 혼인 잔치 / 칠 일
  rationale: መዋዕለ ግዝአ는 문자적으로 ‘결혼 잔치의 기간’이므로 관용적이면서도 직역성을 유지하는 ‘혼인 잔치’로 옮겼고, ሰቡዐ는 ‘칠’로 옮겨 원문 순서를 살렸습니다.
