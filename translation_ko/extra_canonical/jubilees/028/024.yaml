translation:
  language: ko
  text: 그리고 그 여인은 야곱에게 아들을 낳았고, 그 이름을 르우벤이라 불렀습니다. 그것은 그 달 열나흗날이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለደት / bore
  english_pob_choice: and she bore Jacob a son
  chosen_korean: 그 여인은 야곱에게 아들을 낳았고
  alternatives_korean:
  - 그녀는 야곱에게 아들을 낳았고
  - 그리고 야곱에게 아들을 낳았고
  lexicon: 출생 동사
  rationale: 주어가 여성형 동사로 분명하므로 ‘그 여인’으로 받아, 야곱에게 자녀를 낳았다는 관계를 자연스럽게 표현했습니다.
- source_word: ጸውዐ / called his name
  english_pob_choice: and he called his name Reuben
  chosen_korean: 그 이름을 르우벤이라 불렀습니다
  alternatives_korean:
  - 그 이름을 르우벤이라 불렀습니다
  - 그 이름을 르우벤이라고 불렀습니다
  lexicon: 이름을 부르다
  rationale: 게으즈 원문은 남성 단수 주어가 ‘불렀다’는 뜻이므로, 영어 수정본의 무주어 처리보다 원문의 행위 주체를 반영해 옮겼습니다.
- source_word: ለወርኅ / of the month
  english_pob_choice: on the fourteenth day of the month
  chosen_korean: 그 달 열나흗날이었습니다
  alternatives_korean:
  - 그 달의 열나흗날이었습니다
  - 그 달 열넷째 날이었습니다
  lexicon: 날짜 표현
  rationale: 원문은 ‘그 달’이라고만 하며, 본문에 ‘제9월’은 없으므로 달을 특정하지 않고 그대로 유지했습니다.
theological_decisions:
- issue: 서술 주체의 명시 여부
  chosen_reading: 원문의 남성 단수 동사에 따라 ‘그 이름을 … 불렀습니다’로, 이름 짓는 행위를 한 주체를 직접 드러냈습니다.
  alternative_readings:
  - ‘그 이름을 르우벤이라 지었습니다’
  - ‘르우벤이라 불렸습니다’
  rationale: 영어 중간 수정안처럼 주체를 지우면 원문의 문법 정보가 약화되므로, 주체를 분명히 하면서도 과장 없이 서술했습니다.
  doctrine_reference: 본문 문법과 서술 책임성
- issue: 날짜의 월명 비특정성
  chosen_reading: ‘그 달’로 번역해, 사본 전승에서 보이는 ‘제9월’ 이형을 본문에 끌어오지 않았습니다.
  alternative_readings:
  - ‘제9월’
  - ‘아홉째 달’
  rationale: 제시된 게으즈 비평본문에는 ‘month’만 있으므로, 확정되지 않은 월명을 추가하지 않는 것이 더 충실합니다.
  doctrine_reference: 본문비평과 번역 충실성
