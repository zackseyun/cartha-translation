  text: of the fourth week. And he again went in to her, and she conceived and bore him a second son, and she called
translation:
  language: ko
  text: 넷째 주에. 그가 다시 그녀에게 들어가니, 그녀가 잉태하여 그에게 둘째 아들을 낳았고, 그녀는 불렀습니다[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문과 주어진 영어 감사본은 여기서 ‘그녀는 불렀습니다’에 해당하는 동사 뒤에 끊깁니다. 불린 대상 또는 이름은 이 분절에 제시되지 않았습니다.
    reason: 절단된 원문의 미완결성을 보존하면서, 마지막 동사가 번역되었음을 분명히 합니다.
lexical_decisions:
- source_word: ዘሱባዔ፡ ራብዕ።
  english_pob_choice: of the fourth week.
  chosen_korean: 제4주의 일입니다.
  alternatives_korean:
  - 넷째 주입니다
  - 제4주에 해당합니다
  lexicon: source phrase is a calendrical/chronological marker rather than narrative action; English POB keeps the genitive-like “of the fourth week.”
  rationale: 게에즈 원문은 사건 동작이 아니라 시기 표지이므로, 한국어에서도 문장 조각으로 처리해 ‘제4주의 일입니다’라고 옮겨 시간 표지를 보존했습니다.
- source_word: ወደገመ፡ ቦአ፡⁶⁰ ኀቤሃ፡
  english_pob_choice: And he again went in to her
  chosen_korean: 그가 다시 그녀에게 들어가니
  alternatives_korean:
  - 그가 다시 그녀와 동침하니
  - 그가 또 그녀에게 들어가니
  lexicon: The Ge'ez idiom literally says he went in to her; the English POB preserves this concrete source wording rather than replacing it with a euphemism.
  rationale: 원문 동사를 직역 쪽으로 유지해 성행위의 완곡한 관용을 지나치게 바꾸지 않았습니다. 한국어의 ‘들어가다’는 원문 이미지와 POB의 직설성을 함께 살립니다.
- source_word: ወፀንሰት፡ ወወለደት፡
  english_pob_choice: and she conceived and bore
  chosen_korean: 그녀가 잉태하여 … 낳았고
  alternatives_korean:
  - 그녀가 임신하여 … 낳았고
  - 그녀가 수태하여 … 출산하였고
  lexicon: The paired verbs mark conception followed by birth; English POB renders them in that sequence.
  rationale: ‘잉태하다’는 고전적이지만 본문에 맞는 ‘conceived’를 정확히 반영하며, 이어지는 ‘낳았고’로 출산까지의 연속을 유지했습니다.
- source_word: ሎቱ፡ ወልደ፡ ካልአ፡
  english_pob_choice: a second son
  chosen_korean: 둘째 아들을
  alternatives_korean:
  - 두 번째 아들을
  - 두 번째 아들
  lexicon: The Ge'ez numeral adjective means a second son, not merely another son.
  rationale: ‘둘째 아들’이 혈통 순서를 분명히 드러내므로, 단순한 ‘또 한 아들’보다 원문의 수적 의미를 잘 보존합니다.
theological_decisions:
- issue: Narrative register and completion of the verse
  chosen_reading: 원문이 여기서 끊기므로 한국어도 열린 종결(‘그녀가’)을 유지했습니다.
  alternative_readings:
  - 문장 보완을 위해 ‘이라고 불렀습니다’ 등을 임의로 보충
  - 완결된 한국어 문장으로 재구성
  rationale: 주어진 소스는 마지막 동사가 미완결 상태이므로, 의미를 보태어 마무리하지 않고 중단점을 그대로 드러내는 것이 source-grounded 원칙에 맞습니다.
  doctrine_reference: '텍스트 비평/번역 윤리: 결락·미완결 보존'
