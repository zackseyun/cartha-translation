translation:
  language: ko
  text: 그리고 염소들 가운데서 태어난, 얼룩지고 점박이이며 흰 것은 모두 그의 삯이 될 것이었습니다. 그리고 그들이 낳았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘቦ፡ ሐመደ፡ ወጋሰ፡ ወጸዐዳ፡
  english_pob_choice: every dark, spotted, and white one
  chosen_korean: 얼룩지고 점박이이며 흰 것
  alternatives_korean:
  - 검고 점박이이며 흰 것
  - 재빛이고 점박이이며 흰 것
  lexicon: 색채/무늬 형용사
  rationale: 게에즈 ḥamada는 단순한 ‘검은’보다 얼룩지거나 재빛의 색조를 가리킬 수 있어, POB의 revised English가 가진 무늬·색채의 직접성을 살려 ‘얼룩지고’로 옮겼습니다.
- source_word: አጣሊ
  english_pob_choice: goats
  chosen_korean: 염소들
  alternatives_korean:
  - 양들
  - 새끼염소들
  lexicon: 가축 명칭
  rationale: 영어 POB의 수정 이력과 게에즈 어휘 근거에 따라 ‘among the goats’로 이해하는 것이 타당하므로, 전통적 관습 번역보다 ‘염소들’이 더 직접적입니다.
- source_word: ይኩኖ፡ ዐስቦ።
  english_pob_choice: would be his wages
  chosen_korean: 그의 삯이 될 것이었습니다
  alternatives_korean:
  - 그의 보수가 될 것이었습니다
  - 그의 품삯이 될 것이었습니다
  lexicon: 보상/임금 표현
  rationale: 문맥상 노동에 대한 대가를 뜻하므로 ‘삯’이 가장 자연스럽고, 미래 완료적 예고를 담은 영어 POB의 ‘would be’에 맞춰 서술형으로 정리했습니다.
theological_decisions:
- issue: 서술체와 예언적 확정성
  chosen_reading: 과거 서술형으로 옮기되, 결과의 확정성을 ‘될 것이었습니다’로 유지했습니다.
  alternative_readings:
  - ‘될 것입니다’로 일반 미래형 처리
  - ‘되었습니다’로 단순 과거 처리
  rationale: 본문은 이야기 진행 속에서 약속된 결과를 말하므로, 한국어에서도 과거 서술 맥락과 확정된 결말을 함께 드러내는 표현이 가장 적절합니다.
