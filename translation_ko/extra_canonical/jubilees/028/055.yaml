  naturalness: ‘염소들 가운데서 태어난, … 것은’의 쉼표는 한국어 문장 구조상 불필요합니다. 이를 제거하고 ‘점박이며’로 연결하면 더 자연스럽습니다. 마지막 문장은 원문의 짧고 다소 불분명한 복수 주어를 보존하여 ‘그들은 낳았습니다’로 유지할 수 있습니다.
  terminology: ‘염소들’, ‘삯’은 적절합니다. 색채어는 원문의 열거를 보존하여 ‘얼룩지고 점박이며 흰’으로 유지합니다.
