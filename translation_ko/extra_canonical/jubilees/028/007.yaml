- source_word: ለምንት፡ *ገበርከኒ፡ ከመዝ፡¹¹ አኩ፡¹²
  english_pob_choice: Why have you done this to me? Did I not
  chosen_korean: 어찌하여 당신이 나에게 이렇게 하셨습니까?
  alternatives_korean:
  - 왜 당신이 저에게 이렇게 하셨습니까?
  - 어찌하여 내게 이런 일을 하셨습니까?
  lexicon: 의문문/지시대명사
  rationale: Ge'ez의 질문과 이어지는 አኩ(aku)의 미완성성을 감안하되, 본절에는 핵심 질문만 매끄럽게 담고 다음 절로 이어지는 긴장을 유지했습니다.
theological_decisions:
- issue: 절 경계상 남아 있는 አኩ(aku)의 처리
  chosen_reading: 본절에서는 “어찌하여 당신이 나에게 이렇게 하셨습니까?”로 마치되, 뒤의 “Did I not?”에 해당하는 미완성 질문은 다음 절로 이어지는 구문으로 보아 본문에 억지로 덧붙이지 않았습니다.
  alternative_readings:
  - “어찌하여 당신이 나에게 이렇게 하셨습니까? 내가 … 아니었습니까?”
  - “어찌하여 당신이 나에게 이렇게 하셨습니까? 내가 아니…”
  rationale: 제공된 English POB 감수 기록에 따르면 አኩ는 의미상 이어지지만 절 분할로 인해 본절에 온전히 담기지 않습니다. 한국어 본문은 자연스러운 읽기를 우선하되, 미완성성은 불필요한 보강 없이 유지합니다.
  doctrine_reference: 본문 경계와 번역 단위의 충실성
