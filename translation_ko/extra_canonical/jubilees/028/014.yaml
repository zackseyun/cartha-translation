  - 먼저 주게 하십시오
  lexicon: give first
  rationale: 명령형의 우선순위를 살리면서도 합쇼체로 자연스럽게 표현하기 위해 ‘먼저 주십시오’로 간명하게 옮겼습니다.
- source_word: ወበእሲ፡ ዘይገብር፡ ከመዝ፡
  english_pob_choice: And the man who does thus
  chosen_korean: 이렇게 하는 사람은
