  text: 나이가 많은 사람보다 먼저 연소자에게 주지 말고, 먼저 연장자에게 주고 그다음에 연소자에게 주십시오. 이렇게 하는 사람은[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘연장자보다 먼저; 먼저 연장자에게 주고, 그 뒤에 연소자에게 주십시오. 이렇게 하는 사람은’입니다. 절두의 ‘연장자보다 먼저’는 앞 절에서 이어지는 표현입니다.
    reason: 원문의 절두가 선행 절과 문법적으로 이어지는 점을 밝혀, 한국어에서 문맥상 보충한 ‘연소자에게 주지 말고’가 본문에 없는 별도 규정을 덧붙인 것이 아님을 나타냅니다.
