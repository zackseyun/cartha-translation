  lexicon: elder
  rationale: 이 문맥은 가족 내 순서를 가리키므로 교회 직분의 ‘장로’보다 연령상 우선하는 사람을 뜻하게 하여 ‘나이가 많은 사람’으로 옮겼습니다.
- source_word: ትንእስ / younger
  english_pob_choice: the younger
  chosen_korean: 어린 사람
  alternatives_korean:
  - 어린 자
  - 나이가 적은 사람
  lexicon: younger
  rationale: ‘elder’와 짝을 이루는 대조를 살리되, 한국어에서 자연스러운 대비 표현으로 ‘어린 사람’을 택했습니다.
- source_word: ያቀድም፡ ውሂበ፡
  english_pob_choice: first let him give
  chosen_korean: 먼저 주십시오
  alternatives_korean:
