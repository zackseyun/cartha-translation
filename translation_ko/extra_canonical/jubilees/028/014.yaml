  - 이와 같이 하는 남자는
  lexicon: man who does thus
  rationale: ‘man’을 성별 일반화가 가능한 한국어 표현 ‘사람’으로 옮겨, 행위 주체를 넓게 드러내면서도 원문의 일반적 지시를 유지했습니다.
