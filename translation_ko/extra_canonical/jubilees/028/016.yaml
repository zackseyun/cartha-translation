  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩይ፡ ዝንቱ፡ ግብር፡
  english_pob_choice: This deed is evil
  chosen_korean: 이 행위는 악합니다
  alternatives_korean:
  - 이 행위는 악합니다
  - 이 일은 악합니다
  lexicon: 악하다
  rationale: 게즈 원문은 특정 ‘행위/일’을 가리키는 ግብር에 ‘악하다’를 붙여 평가하므로, 한국어도 도덕적 판단을 분명히 드러내는 ‘악합니다’로 옮겼습니다.
- source_word: በ⁴ቅድመ፡ እግዚአብሔር
  english_pob_choice: before the LORD
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 여호와 앞에서
  - 야훼 앞에서
  lexicon: YHWH
  rationale: 원문 እግዚአብሔር은 야훼를 가리키므로 기본 표기인 ‘야훼’를 고려할 수 있으나, 이 절은 기존 POB 영어가 LORD로 처리했고 한국어 문맥상 예배적 서술이 자연스러워 ‘주님 앞에서’로 옮겨 직역성과 유통성을 함께 살렸습니다.
- source_word: ወአንተኒ፡ አዝዝ፡ ለደቂቀ፡ እስራኤል፡
  english_pob_choice: And you also command the children of Israel
  chosen_korean: 그리고 당신도 이스라엘 자손에게 명하여
  alternatives_korean:
  - 그리고 당신도 이스라엘 자손에게 명하여
  - 그리고 너도 이스라엘 자손에게 명하여
  lexicon: 명하다
  rationale: 2인칭 단수 명령형 አዝዝ를 직접 명령으로 살리고, 청자를 존대하는 합쇼체 서술에 맞추어 ‘당신도’로 시작했습니다. ‘이스라엘 자손’은 출애굽/율법 문맥의 표준 표현을 유지했습니다.
theological_decisions:
- issue: 절이 제공된 원문과 영어 본문에서 문장 끝이 끊겨 있습니다.
  chosen_reading: 현존하는 범위까지만 번역하고 말줄임표로 미완성을 표시했습니다.
  alternative_readings:
  - 추정하여 문장을 보충한다
  - 번역을 보류한다
  rationale: 원문 말미가 ወአይ에서 끊기고 영어 POB도 ‘that they not’에서 멈추므로, 누락된 뒤 문장을 보충하지 않고 미완성 상태를 드러내는 것이 가장 충실합니다.
  doctrine_reference: textual fidelity / source transparency
