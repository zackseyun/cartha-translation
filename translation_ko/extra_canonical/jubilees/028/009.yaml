theological_decisions:
- issue: 직접 화법의 종결 어조
  chosen_reading: 인물의 발화는 평서형 구어적 종결인 ‘-겠소/이오’를 사용했습니다.
  alternative_readings:
  - 정중한 서술체 ‘-겠습니다/입니다’
  - 더 중립적인 ‘-겠습니다’ 일괄 처리
  rationale: 이 구절은 등장인물의 감정이 드러나는 직접 인용이므로, 현대 합쇼체 안에서 말투의 생동감을 살리는 것이 원문 효과에 가깝습니다.
