  text: 그리고 딸이 태어났는데, 그 이름은 디나였습니다. 일곱째 달, 네 번째 희년의 여섯째 주의 일곱째 해였습니다. 그리고 그가 그녀에게 자비를 베푸셨습니다.[a][b]
