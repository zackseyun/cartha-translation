  text: 그리고 한 딸이 넷째 희년의 여섯째 주간의 일곱째 해, 일곱째 달에 태어났습니다. 그 이름은 디나였습니다. 그리고 그는 그녀에게 자비를 베풀었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለወለት
  english_pob_choice: And a daughter was born
  chosen_korean: 그리고 딸이 태어났는데
  alternatives_korean:
  - 그리고 딸이 태어났습니다
  - 그리고 딸이 태어났고
  lexicon: 출생 서술
  rationale: 게즈 동사는 ‘태어나다/낳다’의 출생 사건을 가리키므로, 이름을 앞세우기보다 출생이 먼저 오는 구조를 살렸습니다.
- source_word: ዲና፡ ስማ፡
  english_pob_choice: whose name was Dinah
  chosen_korean: 그 이름은 디나였습니다
