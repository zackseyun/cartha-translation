  lexicon: 고유명사 표기
  rationale: ስማ는 ‘그 이름’에 해당하므로 이름 정보를 분명히 드러내는 현대 한국어 구문으로 옮겼습니다.
- source_word: በሳብዕ፡ ወርኅ፡ ዘሳብዕ፡ ዓመት፡ ዘሳድስ፡ ሱባዔ፡ ዘራብዕ
  english_pob_choice: in the seventh month, in the seventh year of the sixth week of the fourth jubilee
  chosen_korean: 일곱째 달, 네 번째 희년의 여섯째 주의 일곱째 해였습니다
  alternatives_korean:
  - 일곱째 달, 네 번째 희년의 여섯째 주의 일곱째 해였습니다
  - 일곱째 달이었고, 네 번째 희년의 여섯째 주의 일곱째 해였습니다
  lexicon: 달/주/희년
  rationale: 수사 구조를 그대로 따라가되, 한국어에서 자연스럽게 읽히도록 시간 정보는 보충 연결어 없이 병렬로 배열했습니다.
- source_word: ወተሣሀላ፡
  english_pob_choice: And He had mercy on her
  chosen_korean: 그리고 그가 그녀에게 자비를 베푸셨습니다
  alternatives_korean:
  - 그리고 그가 그녀를 불쌍히 여기셨습니다
  - 그리고 그가 그녀에게 은혜를 베푸셨습니다
  lexicon: 자비/긍휼 동사
  rationale: 동사의 주어는 남성 단수이고 목적어 표지가 여성 단수이므로, ‘그가 그녀에게’로 인칭 관계를 살렸습니다.
