  lexicon: 직역 구문
  rationale: 게으즈 원문의 관용적 성구를 따라 육체적 결합을 직접적으로 드러내되, 한국어에서 지나치게 노골적이거나 구어적인 표현은 피했습니다.
- source_word: ወፀንሰት፡ ወወለደት፡ ሎቱ፡ ወልደ፡
  english_pob_choice: she conceived and bore him a son
  chosen_korean: 그녀는 잉태하여 그에게 아들을 낳았으며
  alternatives_korean:
  - 그녀는 임신하여 그에게 아들을 낳았으며
  - 그녀는 아이를 배어 그에게 아들을 낳았으며
  lexicon: 임신/잉태 어휘
  rationale: 성경적 서술의 전통적 의미를 살리되 현대 한국어에서 자연스러운 ‘잉태하다’를 택해, ‘conceived’의 결과성과 ‘bore him a son’의 출산 행위를 모두 반영했습니다.
- source_word: ወጸውዐ፡ ስሞ፡ ዳን፡
  english_pob_choice: he called his name Dan
  chosen_korean: 그는 그의 이름을 단이라 불렀습니다
  alternatives_korean:
  - 그녀는 그의 이름을 단이라 불렀습니다
  - 그 이름을 단이라 지었습니다
  lexicon: 호칭 주체
  rationale: 게으즈 동사의 주어가 남성 단수형이므로 영어 POB의 수정본처럼 ‘그는’으로 옮겨, 본문에 주어진 형태를 우선 반영했습니다.
- source_word: አመ፡ ተሱዑ፡ ለወርኅ፡
  english_pob_choice: on the ninth of the month
  chosen_korean: 그 달의 아홉째 날에
  alternatives_korean:
  - 그 달의 아홉째 날에
  - 아홉째 달에
  lexicon: 날짜 표현
  rationale: 수정 이력과 게으즈 표현을 따라 월이 아니라 날짜를 뜻하는 것으로 보고, 한국어에서도 ‘그 달의 아홉째 날’로 분명하게 옮겼습니다.
theological_decisions:
- issue: 이름 짓는 주체와 전승 차이
  chosen_reading: 본문의 게으즈 형태를 따라 이름을 붙인 주체를 남성으로 유지했습니다.
  alternative_readings:
  - 라헬이 이름을 지었다는 전승 반영
  - 주체를 불특정 또는 수동적으로 완화
  rationale: 이 절은 창세기 본문 전승과 다른 형태를 보이므로, 본문 자체의 문법을 우선해 독자가 텍스트 차이를 볼 수 있게 했습니다.
  doctrine_reference: 본문비평/전승 차이
- issue: 성적 결합을 직접적으로 암시하는 표현
  chosen_reading: ‘그녀에게 들어갔다’로 완곡하되 직설성을 유지했습니다.
  alternative_readings:
  - ‘동침했다’로 해설적 번역
  - ‘관계를 가졌다’로 완화
  rationale: 원문 관용구의 결혼-성적 결합 의미를 희석하지 않으면서도, 한국어 합쇼체 문체에 맞는 절제된 표현을 택했습니다.
  doctrine_reference: 서사체 번역 관례
