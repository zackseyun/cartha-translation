  text: And he went in to her, and she conceived and bore him a son, and he called his name Dan, on the ninth of the month.
  footnotes:
  - marker: a
    text: Or 'she called'.
    reason: previous_rendering
  - marker: b
    text: Or 'in the ninth month'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 그녀에게 들어갔고, 그녀는 잉태하여 그에게 아들을 낳았으며, 그는 그 달 아홉째 날에 그 이름을 단이라 불렀습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀는 그 이름을 단이라 불렀습니다.”
    reason: 일부 전승 또는 해석에서는 이름을 부른 주체를 여성으로 읽습니다. 본문은 게으즈 남성 단수형을 따라 ‘그는’으로 번역했습니다.
  - marker: b
    text: 또는 “아홉째 달에.”
    reason: 마지막 게으즈 날짜 표현은 ‘그 달 아홉째 날’로 옮겼으나, 월을 가리키는 것으로 이해하는 해석도 있습니다.
lexical_decisions:
- source_word: ወቦአ፡ ኀቤሃ፡
  english_pob_choice: And he went in to her
  chosen_korean: 그리고 그가 그녀에게 들어갔고
  alternatives_korean:
