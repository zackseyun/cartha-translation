translation:
  language: ko
  text: 다섯째 달, 넷째 주의 넷째 해에였습니다. 그리고 그는 그를 유모에게 맡겼습니다. 그리고 야곱은 다시 들어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለኃምስ፡⁶ ወርኅ፡
  english_pob_choice: in the fifth month
  chosen_korean: 다섯째 달
  alternatives_korean:
  - 오월
  - 다섯 번째 달
  lexicon: 달
  rationale: 게에즈 원문은 시기 표지로 'fifth month'를 나타내므로 달력 표현으로 자연스럽게 옮겼습니다. 수사적·문학적 문맥을 보존하려고 '오월'보다 직역에 가까운 '다섯째 달'을 택했습니다.
- source_word: ወወሀበተ፡ ለሐፂኒት።
  english_pob_choice: And she gave him to a nurse
  chosen_korean: 그리고 그는 그를 유모에게 맡겼습니다
  alternatives_korean:
  - 그리고 그녀는 그를 유모에게 주었습니다
  - 그리고 그녀가 그를 유모에게 맡겼습니다
  lexicon: 맡기다
  rationale: 주어 표지가 본문에서 명확하지 않아 영어 POB의 중성적 처리와 원문의 수동적 전달 감각을 반영해 '맡겼습니다'로 옮겼습니다. '유모'는 양육자/젖먹이는 사람의 의미를 간결하게 담습니다.
- source_word: ወቦአ፡ ያዕቆብ፡ ዳግመ፡
  english_pob_choice: And Jacob went in again
  chosen_korean: 그리고 야곱은 다시 들어갔습니다
  alternatives_korean:
  - 그리고 야곱이 다시 들어갔습니다
  - 그리고 야곱은 다시 들어갔습니다 안으로
  lexicon: 들어가다
  rationale: 게에즈 동사는 반복적 출입을 뜻하는 평이한 서술로 읽히므로, 영어 POB의 'went in again'을 따라 자연스러운 서술형으로 옮겼습니다.
theological_decisions:
- issue: 서술문의 연결과 의미 범위
  chosen_reading: 해당 절은 시간 표지, 양육 위임, 반복적 방문을 순차적으로 서술하는 역사적 문장으로 처리했습니다.
  alternative_readings:
  - 상징적 의미를 부여하는 해석
  - 문장 사이에 인과를 강하게 넣는 해석
  rationale: 원문과 영어 POB 모두 직접적 사건 진술에 머무르므로, 신학적 확장 없이 사건 순서를 보존하는 것이 가장 충실합니다.
  doctrine_reference: 문맥 우선의 서사 번역 원칙
