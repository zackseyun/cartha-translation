  source_fidelity: 초안의 ‘그녀를 하녀로 삼았고’는 라헬 또는 불명확한 인물을 ‘삼는’ 주체로 만들고, 앞 절에서 이어지는 ‘주다’의 구문과 맞지 않습니다. 게에즈어 본문은 절 분할상 앞 절의 동사에 의존하는 것으로 보이므로, 라헬이 주체라는 해석을 피하면서 한국어에서 필요한 수혜자 표지를 보완했습니다. ‘그는’은 이어지는 야곱을 가리키며, ‘다시 일곱 해’는 ዳግመ와 일치합니다.
  naturalness: ‘라헬, 빌하, 곧 슬밧의 누이인 그녀를 하녀로 삼았고’는 병렬과 지시 대상이 어색하고 문법적으로도 불안정합니다. ‘라헬에게는 실바의 누이 빌하를 여종으로 주었습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 생략된 선행 주어를 부당하게 특정하지 않습니다.
  terminology: 인명은 한국어 성서에서 통용되는 ‘라헬’, ‘빌하’, ‘실바’를 사용했습니다. Zilpah의 표기는 ‘슬밧’보다 한국 성서 표준 용례인 ‘실바’가 적절합니다. maidservant는 단순 가사 노동자를 뜻할 수 있는 ‘하녀’보다 본문의 종속 신분과 성서적 용례를 반영하는 ‘여종’으로 옮겼습니다.
