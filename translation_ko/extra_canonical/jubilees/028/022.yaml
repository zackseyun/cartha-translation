lexical_decisions:
- source_word: ራሔል
  english_pob_choice: Rachel
  chosen_korean: 라헬
  alternatives_korean:
  - 레이첼
  - 라헬
  lexicon: 고유명사
  rationale: 히브리 성서 인명으로 널리 굳은 표기를 따랐습니다.
- source_word: ባላንሃ
  english_pob_choice: Bilhah
  chosen_korean: 빌하
  alternatives_korean:
  - 빌하
  - 빌라
  lexicon: 고유명사
  rationale: 히브리계 인명 Bilhah의 통용 음역을 사용했습니다.
- source_word: አኅታ፡ ለዜልፋን፡
  english_pob_choice: the sister of Zilpah
  chosen_korean: 슬밧의 누이
  alternatives_korean:
  - 실바의 누이
  - 질바의 누이
  lexicon: 고유명사
  rationale: Zilpah는 한국 성서 표기에서 슬밧으로 굳은 형태가 있어 이를 따랐고, 친족 관계는 직역해 유지했습니다.
- source_word: ለአኪት
  english_pob_choice: as a maidservant
  chosen_korean: 하녀로 삼았고
  alternatives_korean:
  - 여종으로
  - 시녀로
  lexicon: 사회적 지위 표현
  rationale: POB의 maidservant를 한국어에서 자연스럽고 사회적 하위 지위를 드러내는 말로 옮겼습니다. 다만 본문이 절 분할로 인해 주어·동사가 비틀린 상태이므로, 관계절을 풀어 자연스럽게 정리했습니다.
- source_word: ወትቀንየ፡ ሰብዓተ፡ ዓመተ፡ ዳግመ፡
  english_pob_choice: And he served another seven years for
  chosen_korean: 그리고 그는 또 다른 일곱 해를 섬겼습니다
  alternatives_korean:
  - 그리고 그는 다시 일곱 해를 섬겼습니다
  - 그는 또 일곱 해를 섬겼습니다
  lexicon: 동사구
  rationale: 원문과 POB가 모두 문장이 미완인 상태를 보여 주므로, 완료형으로 매듭짓지 않고 미완 결말을 그대로 반영했습니다.
theological_decisions:
- issue: 절 분할 오류로 인해 주어가 흔들리는 구문
  chosen_reading: 라헬이 직접 ‘주었다’고 단정하지 않고, 앞뒤 문맥을 고려해 ‘하녀로 삼았고’로 옮겨 본문 흐름을 보존했습니다.
  alternative_readings:
  - 라헬, 빌하, 슬밧의 누이, 하녀로
  - 라헬이 빌하를 슬밧의 누이인 하녀로 주었습니다
  rationale: 영문 POB의 수정 이력에서도 이 대목은 원래 분절 오류를 안고 있으며, 주어를 라헬로 확정하는 번역은 서사와 충돌합니다. 따라서 단정적 보충보다 문맥이 드러내는 관계를 유지하는 쪽이 안전합니다.
  doctrine_reference: 본문 비평/서사 문맥 일치
- issue: 미완성된 종결부 보존
  chosen_reading: 절의 끝을 매끄럽게 완결하지 않고 ‘그는 또 다른 일곱 해를 섬겼습니다’로 열린 형태를 유지했습니다.
  alternative_readings:
  - 완결형으로 옮겨 자연스럽게 마무리하기
  - 생략 부호로 미완을 표시하기
  rationale: 원문과 POB 모두 문장이 끊긴 채 남아 있으므로, 한국어도 그 미완성을 보존하는 것이 원문 충실성에 맞습니다.
  doctrine_reference: source fidelity
