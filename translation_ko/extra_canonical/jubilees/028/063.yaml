review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그의 양 떼를 두고’는 원문의 ‘그의 양 떼에게로/그의 양 떼가 있는 곳으로’라는 장소·방향 관계를 ‘남겨 두고’라는 뜻으로 바꾸어 버립니다. 또한 원문 말미의 ‘함께’(ምስ)가 번역에서 빠졌습니다. 야곱이 레아와 라헬을 자기 양 떼가 있는 곳으로 부르는 장면으로 옮기는 것이 문맥과 어순에 부합합니다.
  naturalness: ‘그들의 마음에 말하여’는 현대 표준어에서 부자연스럽습니다. 원문의 마음을 향해 말한다는 관용적·설득적 표현은 ‘그들의 마음에 대고 말하여’로 비교적 가깝게 보존할 수 있습니다.
  terminology: 인명 ‘야곱’, ‘레아’, ‘라헬’은 적절합니다. ‘양 떼’도 집합명사로 자연스럽고 적절합니다.
  issues:
  - severity: high
    issue: ‘그의 양 떼를 두고’라는 표현
    rationale: ‘두고’는 양 떼를 남겨 둔다는 의미를 도입하며, 원문이 가리키는 양 떼가 있는 곳으로의 방향·장소 관계를 보존하지 못합니다.
  - severity: medium
    issue: 원문 말미의 ‘함께’ 누락
    rationale: 게에즈어 ምስ는 뒤 문맥과 연결되는 ‘함께’를 나타내므로, 절이 다음 문맥으로 이어짐을 한국어에서도 반영해야 합니다.
  - severity: medium
    issue: ‘그들의 마음에 말하여’의 비자연성
    rationale: 직역 흔적이 강해 현대 합쇼체 문장으로 자연스럽지 않습니다. 다만 설득 또는 마음을 향한 말하기의 뉘앙스는 유지해야 합니다.
  revised_text: 그의 양 떼에게로 야곱은 레아와 라헬을 불러, 그들의 마음에 대고 말하여 그들이 함께 오도록 하였습니다.
