theological_decisions:
- issue: 내적 설득을 나타내는 표현의 처리
  chosen_reading: “그들의 마음에 말하여”로 옮겨, 단순한 외적 호출이 아니라 마음에 닿도록 설득하는 뜻을 드러냈습니다.
  alternative_readings:
  - 그들에게 말하여
  - 그들의 마음을 얻기 위해 말하여
  rationale: 이 구절은 가족을 부르는 행위보다, 마음을 향한 말하기를 강조하므로 그 뉘앙스를 보존하는 것이 स्रोत에 더 충실합니다.
