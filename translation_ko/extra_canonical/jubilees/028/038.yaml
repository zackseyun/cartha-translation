lexical_decisions:
- source_word: ሳድስ
  english_pob_choice: The sixth
  chosen_korean: 여섯째입니다
  alternatives_korean:
  - 여섯째
  - 여섯 번째
  lexicon: source_note
  rationale: 문두의 단독 수사어를 한국어에서는 절 제목처럼 독립적으로 제시해, 이어지는 출생 순번 표지를 살렸습니다.
- source_word: በ*ሳድስ፡ ዓመት፡ ዘሱባዔ፡ ሣልስ።
  english_pob_choice: in the sixth year of the third week
  chosen_korean: 셋째 주의 여섯째 해
  alternatives_korean:
  - 셋째 주의 여섯째 해에
  - 세 번째 주의 여섯째 해
  lexicon: source_note
  rationale: ‘third week’는 달력이 아니라 주기 단위이므로 ‘셋째 주’로 옮기고, 연대 표지는 한국어 어순에 맞게 자연스럽게 배치했습니다.
- source_word: ወደገመ፡ ያዕቆብ፡ ካዕበ፡
  english_pob_choice: Jacob again went in
  chosen_korean: 야곱이 다시 빌하에게 들어갔고
  alternatives_korean:
  - 야곱이 다시 빌하에게 들어갔으며
  - 야곱이 또 빌하에게 들어갔고
  lexicon: source_note
  rationale: 히브리계 완곡어법인 ‘들어가다’를 유지해 성적 행위를 직설적으로 과장하지 않으면서도, ‘다시’로 반복을 분명히 했습니다.
- source_word: ወፀንሰት፡
  english_pob_choice: and she conceived
  chosen_korean: 그녀는 임신했습니다
  alternatives_korean:
  - 그녀는 잉태했습니다
  - 그녀가 임신했습니다
  lexicon: source_note
  rationale: 성경문체에서 통용되는 ‘잉태하다’도 가능하지만, 현대 합쇼체에서 이해가 직접적인 ‘임신했습니다’를 택했습니다.
theological_decisions:
- issue: 본문의 연속 출생 표지와 반복 행위의 서술
  chosen_reading: ‘여섯째입니다’와 ‘다시’로 출생 순서와 반복된 혼인을 분리해 드러냈습니다.
  alternative_readings:
  - 문두의 수사어를 생략하고 바로 사건 서술로 시작
  - ‘다시’를 약화해 단순 과거 사건처럼 처리
  rationale: 게에즈 원문의 문두 수사어와 반복 표지는 서사의 출생 순번과 행동 반복을 함께 전달하므로, 둘 다 한국어에서 눈에 띄게 살리는 편이 본문의 구조를 더 충실히 반영합니다.
  doctrine_reference: 서사 구조 보존
