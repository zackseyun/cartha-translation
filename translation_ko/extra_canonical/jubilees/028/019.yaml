  lexicon: 목축 동사; 소유 대명사
  rationale: 게에즈 원문의 목축 행위를 한국어 동사 ‘치다’로 옮겨, 양 떼를 돌보는 일뿐 아니라 목자적 관리의 뉘앙스를 유지했습니다.
