translation:
  language: ko
  text: 그는 자기 딸 라헬을 위하여 한 주 동안 그를 섬겼습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተቀንየ / served
  english_pob_choice: he served him
  chosen_korean: 그를 섬겼습니다
  alternatives_korean:
  - 그를 봉사했습니다
  - 그를 일했습니다
  lexicon: Geez verb of service/working for someone
  rationale: 문맥상 결혼 대가로 라반을 위해 노동한 뜻이므로, 현대 한국어에서 자연스럽고 본래의 종속적 노동 관계를 드러내는 ‘섬기다’를 택했습니다.
- source_word: ህየንተ ራሔል / for his daughter Rachel
  english_pob_choice: for his daughter Rachel
  chosen_korean: 자기 딸 라헬을 위하여
  alternatives_korean:
  - 라헬을 위하여
  - 자기 딸 라헬 때문에
  lexicon: prepositional phrase marking purpose/consideration
  rationale: 원문과 POB 수정안 모두 ‘라헬을 위하여’보다 ‘자기 딸 라헬을 위하여’가 더 정확하므로, 소유 관계를 명시해 원문의 누락된 관계를 반영했습니다.
- source_word: ሱባዔ አሐደ / one week
  english_pob_choice: one week
  chosen_korean: 한 주 동안
  alternatives_korean:
  - 일 주 동안
  - 일주일 동안
  lexicon: Jubilees temporal term for a week
  rationale: 희년서는 시간을 ‘주’ 단위로 계산하는 특유의 용례가 있으므로, ‘한 주’로 옮겨 구조를 보존했습니다.
theological_decisions:
- issue: 희년서의 시간 단위 표현
  chosen_reading: ‘one week’를 ‘한 주’로 직역해 희년서 고유의 연대기 체계를 드러냈습니다.
  alternative_readings:
  - ‘칠 년’으로 의역
  - ‘일주일’로 현대화
  rationale: 수정된 영어 POB의 판단대로 여기의 ‘주’는 일반적 7일이 아니라 희년서의 서사적·연대기적 단위이므로, 독자가 본문 체계를 놓치지 않도록 보존했습니다.
  doctrine_reference: 희년서의 내적 시간 체계와 본문 비평
