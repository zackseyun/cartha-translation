  text: And he lifted up his feet and went to the land of the east, to Laban, the brother of Rebekah, and he stayed with him.
translation:
  language: ko
  text: 그는 발걸음을 내디뎌 동쪽 땅으로 가서 라반—리브가의 형제—에게 이르러 그와 함께 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת־רַגְלָיו
  english_pob_choice: he lifted up his feet
  chosen_korean: 발걸음을 내디뎠습니다
  alternatives_korean:
  - 발을 들어 올렸습니다
  - 발을 옮겼습니다
  lexicon: 문맥상 관용구
  rationale: 히브리어/에티오피아어 계열의 관용적 표현을 직역하면 어색하므로, 출발하여 힘차게 길을 나서는 동작을 자연스럽게 살렸습니다.
- source_word: אֶרֶץ־קֶדֶם / land of the east
  english_pob_choice: to the land of the east
  chosen_korean: 동쪽 땅으로
  alternatives_korean:
  - 동방으로
  - 동쪽 지역으로
  lexicon: 지리적 방향 표현
  rationale: 방향과 지역성을 함께 보이기 위해 ‘동쪽 땅’으로 옮겼습니다.
- source_word: אֲחִי רִבְקָה / the brother of Rebekah
  english_pob_choice: the brother of Rebekah
  chosen_korean: 리브가의 형제
  alternatives_korean:
  - 리브가의 오라비
  - 리브가의 동생
  lexicon: 친족 관계 명칭
  rationale: 라반이 리브가의 친족임을 직접적으로 드러내는 본문 관계를 유지하되, 현대 한국어에서는 성별을 특정하지 않는 ‘형제’를 기본으로 썼습니다.
- source_word: וַיְהִי עִמּוֹ / and he stayed with him
  english_pob_choice: and he stayed with him
  chosen_korean: 그와 함께 머물렀습니다
  alternatives_korean:
  - 그와 함께 있었습니다
  - 그와 동거하였습니다
  lexicon: 관계 지속 동사
  rationale: 최신 영어 감수본의 ‘stayed with him’을 반영해, 단순 존재가 아니라 일정 기간 함께 머문 뜻을 살렸습니다.
theological_decisions:
- issue: 서술의 직역성 vs. 자연스러운 한국어 관용
  chosen_reading: ‘발걸음을 내디뎌’로 옮겨 원문의 힘 있는 출발 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘발을 들어 올리고’로 더 직역할 수 있음
  - ‘길을 떠나’로 더 평이하게 할 수 있음
  rationale: 본문은 단순 이동보다 출발의 결기를 암시하므로, 한국어에서도 그 힘을 유지하는 쪽이 적절합니다.
  doctrine_reference: 서사 문체와 관용구 재현
- issue: ‘with him’의 의미
  chosen_reading: ‘그와 함께 머물렀습니다’로, 단순 동행이 아니라 체류를 나타내도록 했습니다.
  alternative_readings:
  - ‘그와 함께 있었습니다’
  - ‘그와 같이 지냈습니다’
  rationale: 영어 POB의 수정 의도와 지시어를 따라, 관계적 동행보다 체류 상태를 분명히 했습니다.
  doctrine_reference: 본문 의미 보존
