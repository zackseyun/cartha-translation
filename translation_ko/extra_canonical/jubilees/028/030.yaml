lexical_decisions:
- source_word: ቀዳማዊ
  english_pob_choice: First,
  chosen_korean: 첫째,
  alternatives_korean:
  - 먼저,
  - 첫 번째로,
  lexicon: source_note
  rationale: Ge'ez의 ቀዳማዊ는 서술의 첫 항목을 여는 표지로 보이며, 영어 POB의 ‘First,’를 따라 한국어에서도 ‘첫째,’로 간결하게 옮겼습니다.
- source_word: በሳድስ ዓመት ዘዝ ሱባዔ
  english_pob_choice: in the sixth year of this week
  chosen_korean: 이 주의 여섯째 해에
  alternatives_korean:
  - 이 주간의 여섯째 해에
  - 이 주의 6년째에
  lexicon: source_note
  rationale: Jubilees의 ‘week’는 문자적 7일 주간이 아니라 희년 단위의 ‘주’를 가리키므로, POB의 주석을 반영해 ‘이 주의 여섯째 해’로 옮겼습니다.
- source_word: ወቦአ ኀቤሃ
  english_pob_choice: And Jacob again went in to her
  chosen_korean: 그리고 야곱이 다시 그녀에게 들어갔고
  alternatives_korean:
  - 그리고 야곱이 다시 그녀와 동침했고
  - 그리고 야곱이 다시 그녀에게 갔고
  lexicon: source_note
  rationale: 직역하면 ‘그녀에게 들어갔다’이지만, 이는 성관계를 완곡하게 나타내는 원문의 관용 표현이므로 의미를 유지해 ‘들어갔고’로 살렸습니다.
- source_word: ወፀንሰት
  english_pob_choice: and she conceived
  chosen_korean: 그녀는 잉태했습니다
  alternatives_korean:
  - 그녀는 임신했습니다
  - 그녀는 아이를 배었습니다
  lexicon: source_note
  rationale: 원문은 ‘잉태하다/임신하다’의 서술로, 성서 문맥의 고전적이면서도 현대 한국어에서 이해 가능한 ‘잉태했습니다’를 선택했습니다.
theological_decisions:
- issue: 문장 반복과 단절된 서술의 보존
  chosen_reading: 영어 POB와 같이 동일한 사건 진술을 두 번 반복해, 분절된 원문 전승을 있는 그대로 드러냈습니다.
  alternative_readings:
  - 중복을 정리해 한 번만 번역하는 방식
  - 앞절과 연결해 자연스럽게 하나로 합치는 방식
  rationale: 제시된 게으즈 본문이 동일한 진술을 두 번 반복하므로, 편집적으로 매끈하게 만들기보다 반복 자체를 유지하는 것이 원문 증거에 더 충실합니다.
  doctrine_reference: source-critical fidelity
