  chosen_reading: 영어 POB와 같이 동일한 사건 진술을 두 번 반복해, 분절된 원문 전승을 있는 그대로 드러냈습니다.
  alternative_readings:
  - 중복을 정리해 한 번만 번역하는 방식
  - 앞절과 연결해 자연스럽게 하나로 합치는 방식
  rationale: 제시된 게으즈 본문이 동일한 진술을 두 번 반복하므로, 편집적으로 매끈하게 만들기보다 반복 자체를 유지하는 것이 원문 증거에 더 충실합니다.
  doctrine_reference: source-critical fidelity
