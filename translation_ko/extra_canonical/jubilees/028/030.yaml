  text: 첫째, 이 주의 여섯째 해에. 그리고 야곱이 다시 그녀에게 들어갔고, 그녀는 잉태했습니다. 그리고 야곱이 다시 그녀에게 들어갔고, 그녀는 잉태했습니다.[a]
