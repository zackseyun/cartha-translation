translation:
  language: ko
  text: 그는 그에게서 사흘 길 떨어져 있었습니다. 그리고 야곱은 라반이 양털을 깎으러 갔음을 보았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሀሎ፡ እምኔሁ፡³⁵ ምሕዋረ፡ ሠሉስ፡ ዕለት።
  english_pob_choice: He was a three days' journey from him.
  chosen_korean: 그는 그에게서 사흘 길 떨어져 있었습니다.
  alternatives_korean:
  - 그는 그에게서 사흘 여정이었습니다.
  - 그는 그에게서 사흘 길의 거리였습니다.
  lexicon: 사흘 길
  rationale: 게에즈의 ምሕዋረ(여정, 길)와 영어 POB의 'three days' journey'를 자연스럽게 살려, 한국어에서 통용되는 거리 표현으로 옮겼습니다. '그에게서'는 እምኔሁ의 출발점 의미를 보존합니다.
- source_word: ወርእየ፡ ያዕቆብ፡
  english_pob_choice: And Jacob saw
  chosen_korean: 그리고 야곱은 보았습니다
  alternatives_korean:
  - 그리고 야곱이 보았습니다
  - 그때 야곱은 보았습니다
  lexicon: 보다
  rationale: 원문의 서사 연결 접속사와 시각적 인지를 직설적으로 살려, 단순한 사건 진술로 유지했습니다.
- source_word: ከመ፡ የሐውር፡ ላባ፡ ይቅርጽ፡
  english_pob_choice: that Laban had gone to shear.
  chosen_korean: 라반이 양털을 깎으러 갔음을
  alternatives_korean:
  - 라반이 양을 깎으러 갔음을
  - 라반이 털 깎으러 갔음을
  lexicon: 깎다
  rationale: 여기서 ይቅርጽ는 양털을 깎는 행위를 가리키므로, 대상이 분명하도록 '양털을 깎으러'로 풀었습니다. 한국어 독자가 오해하지 않도록 '라반이'를 보존했습니다.
theological_decisions:
- issue: 서사적 시간·거리 표현의 압축
  chosen_reading: 문장을 두 절로 나누되, 첫 절의 거리 진술과 둘째 절의 관찰 진술을 모두 유지했습니다.
  alternative_readings:
  - 한 문장으로 더 압축하는 방식
  - 거리 진술을 부연 설명으로 처리하는 방식
  rationale: 원문은 위치 정보와 야곱의 관찰을 나란히 제시합니다. 이를 분리해 옮기면 서사 흐름과 정보 구조가 더 분명하게 드러납니다.
  doctrine_reference: 서사 본문 번역 원칙
