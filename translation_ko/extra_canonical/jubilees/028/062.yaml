  rationale: 원문은 위치 정보와 야곱의 관찰을 나란히 제시합니다. 이를 분리해 옮기면 서사 흐름과 정보 구조가 더 분명하게 드러납니다.
  doctrine_reference: 서사 본문 번역 원칙
