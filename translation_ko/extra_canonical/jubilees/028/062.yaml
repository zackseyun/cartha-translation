  source_fidelity: 첫 절의 ሀሎ(‘있었다/였다’)와 ‘그에게서 사흘 길’이라는 거리 진술, 둘째 절의 야곱의 관찰 및 라반이 털을 깎으러 간 행위가 모두 보존되어 있습니다. 다만 각주가 거리 표현이 아니라 둘째 문장 끝에 붙어 있어, 원문의 거리 표현에 관한 대안 독법이라는 기능이 불분명합니다.
