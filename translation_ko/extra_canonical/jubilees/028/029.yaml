  - 그 달의 첫날
  lexicon: 첫째 달 / 첫날
  rationale: 문구는 ‘한 달의 첫날’이 아니라 ‘첫째 달의 첫날’로 읽히므로, 가능한 한 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 주체 불일치와 전승 차이
  chosen_reading: 본문의 ‘그가 그의 이름을 레위라 불렀습니다’는 야곱을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - ‘레아가 그의 이름을 레위라 불렀습니다’
