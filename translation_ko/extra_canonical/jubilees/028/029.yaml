    text: 또는 “새 달이 시작될 때에”.
    reason: ሠርቅ는 문맥상 달의 첫날을 가리키지만, 어휘상 ‘떠오름/새 달의 시작’이라는 뉘앙스가 있어 이를 제한적으로 밝혔습니다.
lexical_decisions:
- source_word: ወፀንሰት / ወወለደት
  english_pob_choice: conceived and bore
  chosen_korean: 임신하여 … 낳았고
  alternatives_korean:
