translation:
  language: ko
  text: 레아가 임신하여 그에게 셋째 아들을 낳았고, 그가 그의 이름을 레위라 불렀습니다. 그 첫째 달의 첫날이었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፀንሰት / ወወለደት
  english_pob_choice: conceived and bore
  chosen_korean: 임신하여 … 낳았고
  alternatives_korean:
  - 잉태하여 … 낳았고
  - 임신하고 … 낳았고
  lexicon: 임신하다 / 낳다
  rationale: 게으즈 원문의 연속 동사로 임신과 출산의 순서를 자연스럽게 살렸습니다.
- source_word: ሎቱ
  english_pob_choice: him
  chosen_korean: 그에게
  alternatives_korean:
  - 그를
  - 그에게서
  lexicon: 그에게 / 그를
  rationale: 문맥상 ‘낳았다’의 수혜·대상 관계를 드러내는 표현으로 ‘그에게’를 택해, 히브리어/제네시스 전승의 아들을 낳은 대상 관계를 보존했습니다.
- source_word: ሳልሰ
  english_pob_choice: a third
  chosen_korean: 셋째
  alternatives_korean:
  - 세 번째
  - 세째
  lexicon: 서수
  rationale: 아들의 순번을 한국어 서수로 간결하게 옮겼습니다.
- source_word: ጸውዐ
  english_pob_choice: he called
  chosen_korean: 그가 … 불렀습니다
  alternatives_korean:
  - 그녀가 … 불렀습니다
  - 레아가 … 불렀습니다
  lexicon: 부르다
  rationale: 게으즈 동사의 3인칭 남성 단수에 맞추어 주어를 ‘그가’로 유지했고, English audit의 수정이 원문과 충돌하므로 따르지 않았습니다.
- source_word: በሠርቅ፡ ወርኅ፡
  english_pob_choice: on the first day of the first month
  chosen_korean: 그 첫째 달의 첫날
  alternatives_korean:
  - 새 달의 첫날
  - 그 달의 첫날
  lexicon: 첫째 달 / 첫날
  rationale: 문구는 ‘한 달의 첫날’이 아니라 ‘첫째 달의 첫날’로 읽히므로, 가능한 한 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 주체 불일치와 전승 차이
  chosen_reading: 본문의 ‘그가 그의 이름을 레위라 불렀습니다’는 야곱을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - ‘레아가 그의 이름을 레위라 불렀습니다’
  - 주어를 명시하지 않는 번역
  rationale: 게으즈 원문의 3인칭 남성 단수 동사와 영어 POB 주석을 따라, 이름 짓는 주체를 레아가 아니라 야곱으로 보존했습니다. 이는 일반적인 창세기 본문 전승과는 다를 수 있으나, 원문 증거를 우선했습니다.
  doctrine_reference: 본문 비평/전승 차이
