  source_fidelity: 이름을 부른 동사 ጸውዐ는 남성 단수이므로 ‘그가’로 옮긴 것은 원문에 충실합니다. 시간 표현 በሠርቅ፡ ወርኅ፡은 달의 첫날/초하루를 가리키며, 본문 흐름에 따른 ‘첫째 달 초하루’는 English POB 본문과도 일치합니다. 다만 ‘그 첫째 달의 첫날이었습니다’는 원문의 부사구를 독립 서술로 바꾸고 ‘그’가 불필요하게 지시를 흐립니다.
  naturalness: ‘레위라 불렀습니다’도 가능하지만, 현대 표준어에서는 ‘레위라고 불렀습니다’가 더 자연스럽습니다. 시간 표현은 ‘첫째 달 초하루에’가 간결하고 자연스럽습니다.
  terminology: ‘레아’, ‘레위’, ‘임신하여’, ‘셋째 아들’은 표준적인 성서 한국어 및 현대 문어체에 적절합니다. 기존 [a]는 원문상 지지되지 않는 여성 주어 대안을 제시하므로 삭제해야 하며, 시간 표현의 어휘적 여지는 각주로 제한적으로 보존할 수 있습니다.
