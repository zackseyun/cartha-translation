  text: for Rachel I served you, and not for Leah. Why have you wronged me? Take your daughter,
translation:
  language: ko
  text: “라헬을 위해 내가 당신을 섬겼지, 레아를 위해서가 아닙니다. 어찌하여 저를 잘못 대하셨습니까? 당신의 딸을 데려가십시오,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተቀነይኩ
  english_pob_choice: I served you
  chosen_korean: 내가 당신을 섬겼지
  alternatives_korean:
  - 내가 당신을 섬겼습니다
  - 내가 당신을 위해 일했습니다
  lexicon: Geez ቀነየ / ‘to serve, work for’
  rationale: 행위의 주어와 대상을 분명히 드러내며, 고용 관계의 ‘일하다’보다 원문의 봉사·봉역 뉘앙스를 살리기 위해 ‘섬겼지’로 옮겼습니다.
- source_word: በእንተ፡ ራሔል / ልያ
  english_pob_choice: for Rachel ... and not for Leah
  chosen_korean: 라헬을 위해 … 레아를 위해서가 아닙니다
  alternatives_korean:
  - 라헬 때문에 … 레아 때문에가 아닙니다
  - 라헬을 위하여 … 레아를 위하여가 아닙니다
  lexicon: Geez በእንተ / 목적·이유 표지
  rationale: ‘~을 위해’로 목적성을 자연스럽게 살리되, 대조 구조를 분명히 하여 라헬과 레아의 대비를 유지했습니다.
- source_word: ፋዕከኒ
  english_pob_choice: Why have you wronged me?
  chosen_korean: 어찌하여 저를 잘못 대하셨습니까
  alternatives_korean:
  - 어찌하여 저에게 불의를 행하셨습니까
  - 어찌하여 저를 속이셨습니까
  lexicon: Geez ‘wrong, do wrong to’
  rationale: 피해 호소의 핵심인 ‘wronged me’를 직접 반영하되, 너무 법정적이거나 특정한 속임수로 좁히지 않도록 ‘잘못 대하셨습니까’로 번역했습니다.
- source_word: ንግአ፡ ወሰተከ፡
  english_pob_choice: Take your daughter,
  chosen_korean: 당신의 딸을 데려가십시오
  alternatives_korean:
  - 당신의 딸을 취하십시오
  - 당신의 딸을 받으십시오
  lexicon: Geez imperative
  rationale: 명령형의 직접성을 유지하면서 현대 한국어에서 자연스럽고 품위 있게 들리는 ‘데려가십시오’를 택했습니다.
theological_decisions:
- issue: 야곱의 항의 어조와 예절 수준
  chosen_reading: 상대에게 정중한 2인칭 ‘당신’을 쓰되, 항의·책망의 내용은 약화하지 않았습니다.
  alternative_readings:
  - 그대
  - 너
  rationale: 이 장면은 가족 내 갈등이지만, 현대 합쇼체 서술에서는 대화 상대를 ‘당신’으로 처리해 공손한 문체를 유지하면서도 원문의 날 선 항변을 보존합니다.
  doctrine_reference: 서사 문맥의 화법 보존
