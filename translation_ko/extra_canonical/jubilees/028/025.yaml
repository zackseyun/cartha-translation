  - 제3주의 첫해
  lexicon: 시간·연대 표현
  rationale: ‘week’는 주석적·연대기적 단위로 보아 ‘주’로 옮기고, ‘first year’는 자연스러운 한국어로 ‘첫해’로 압축했습니다.
- source_word: ወማሕጸናሰ፡ ለራሔል፡ ተጸፍቀ፡
  english_pob_choice: Rachel’s womb was closed
  chosen_korean: 라헬의 태는 닫혀 있었는데
  alternatives_korean:
