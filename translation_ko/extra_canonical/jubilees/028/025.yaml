  - 라헬의 태가 막혀 있었는데
  lexicon: 신체 은유
  rationale: Pob의 ‘womb was closed’를 직역하되, 한국어에서 자연스럽고 문맥상 보존되는 표현인 ‘태는 닫혀 있었는데’로 처리했습니다.
- source_word: እስመ፡ ርእየ፡
  english_pob_choice: because he saw
  chosen_korean: 그가 보았기 때문입니다
  alternatives_korean:
  - 그가 보았으므로
  - 그가 보았기 때문에
  lexicon: 원인절
  rationale: 완결되지 않은 Ge'ez 절의 동사를 반영하여 ‘보았기 때문입니다’로 원인 관계를 살렸습니다.
theological_decisions:
- issue: 연대기 문구의 지시 대상
  chosen_reading: ‘셋째 주의 첫해’는 주기의 연대기적 표지로 번역해, 본문이 말하는 시간 순서를 그대로 드러냈습니다.
  alternative_readings:
  - ‘셋째 주 첫해’로 더 압축
  - ‘제3주의 제1년’처럼 형식화
  rationale: 이 단락은 서사보다 연대기 기록의 성격이 강하므로, 의미를 손상하지 않는 범위에서 직역성을 유지했습니다.
  doctrine_reference: 본문 장르/문맥
