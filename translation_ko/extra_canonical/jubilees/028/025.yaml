translation:
  language: ko
  text: 그것은 셋째 주의 첫해의 아홉째 해였습니다. 그러나 라헬의 태는 닫혀 있었는데, 그가 보았기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታስዕ፡
  english_pob_choice: the ninth
  chosen_korean: 아홉째
  alternatives_korean:
  - 아홉 번째
  - 9번째
  lexicon: 기수·서수
  rationale: Ge'ez의 ታስዕ는 서수 ‘ninth’에 해당하므로, 연대기 표현에 맞게 ‘아홉째’로 옮겼습니다.
- source_word: በቀዳሚ፡ ዓመት፡ ዘሱባዔ፡ ሣልስ።
  english_pob_choice: in the first year of the third week
  chosen_korean: 셋째 주의 첫해
  alternatives_korean:
  - 셋째 주의 첫 번째 해
  - 제3주의 첫해
  lexicon: 시간·연대 표현
  rationale: ‘week’는 주석적·연대기적 단위로 보아 ‘주’로 옮기고, ‘first year’는 자연스러운 한국어로 ‘첫해’로 압축했습니다.
- source_word: ወማሕጸናሰ፡ ለራሔል፡ ተጸፍቀ፡
  english_pob_choice: Rachel’s womb was closed
  chosen_korean: 라헬의 태는 닫혀 있었는데
  alternatives_korean:
  - 라헬의 태가 닫혀 있었는데
  - 라헬의 태가 막혀 있었는데
  lexicon: 신체 은유
  rationale: Pob의 ‘womb was closed’를 직역하되, 한국어에서 자연스럽고 문맥상 보존되는 표현인 ‘태는 닫혀 있었는데’로 처리했습니다.
- source_word: እስመ፡ ርእየ፡
  english_pob_choice: because he saw
  chosen_korean: 그가 보았기 때문입니다
  alternatives_korean:
  - 그가 보았으므로
  - 그가 보았기 때문에
  lexicon: 원인절
  rationale: 완결되지 않은 Ge'ez 절의 동사를 반영하여 ‘보았기 때문입니다’로 원인 관계를 살렸습니다.
theological_decisions:
- issue: 연대기 문구의 지시 대상
  chosen_reading: ‘셋째 주의 첫해’는 주기의 연대기적 표지로 번역해, 본문이 말하는 시간 순서를 그대로 드러냈습니다.
  alternative_readings:
  - ‘셋째 주 첫해’로 더 압축
  - ‘제3주의 제1년’처럼 형식화
  rationale: 이 단락은 서사보다 연대기 기록의 성격이 강하므로, 의미를 손상하지 않는 범위에서 직역성을 유지했습니다.
  doctrine_reference: 본문 장르/문맥
