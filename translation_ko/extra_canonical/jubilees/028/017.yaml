  - 어린 자를 … 먼저 나이 많은 자를
  - 어린 것부터 … 먼저 큰 것을
  lexicon: comparative ordering / age-size contrast
  rationale: Geez의 ‘더 어린/더 큰’ 대비를 한국어에서 어순과 수량감이 살아나도록 ‘어린 것/큰 것’으로 옮겼습니다. 여기서 ‘큰 것’은 단순 물리적 크기보다 우선순위가 높은 대상을 가리키는 표현으로 보입니다.
