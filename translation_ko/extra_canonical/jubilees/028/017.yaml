  lexicon: imperative + demonstrative
  rationale: Geez의 명령문과 지시어를 자연스러운 현대 공문체 명령으로 옮기되, 지시의 간결함을 살려 중복된 명사구를 과도하게 풀지 않았습니다.
- source_word: አይንሥኡ፡ ወአየሀቡ፡
  english_pob_choice: let them not take or give
  chosen_korean: 「받거나 주지 말고」
  alternatives_korean:
  - 취하거나 주지 말고
  - 가져가거나 주지 말고
  - 받아들이거나 주지 말고
  lexicon: negative jussive / coordinated verbs
  rationale: ‘take and give’의 대칭을 한국어의 ‘받다/주다’로 가장 직접적으로 살렸고, 문맥상 거래·분배의 일반적 행위를 자연스럽게 나타냅니다.
- source_word: እንተ፡ ትንእስ፡ ዘእንበለ፡ *ያቅድሙ፡ እንተ፡ ትልህቅ፡
  english_pob_choice: the younger before they first give the elder,
  chosen_korean: 「어린 것을 … 먼저 큰 것을」
  alternatives_korean:
