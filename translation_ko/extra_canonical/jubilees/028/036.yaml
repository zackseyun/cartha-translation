  source_fidelity: 현 초안은 ትወልድ ሊተ ወልደ(‘내게 아들을 낳을 것이다’)를 빠뜨렸고, 마지막 절의 주어와 소유·관계 대상을 모두 남성인 ‘그’로 처리하여 본문 및 문맥상 관계를 잘못 전달합니다. 게에즈어에는 ‘그에게 들어가라’에 해당하는 표현이 없습니다.
  naturalness: ‘아이를 밸 것입니다’도 가능하지만, 여기서는 ‘잉태하여 내게 아들을 낳을 것입니다’가 원문의 두 동사와 여격·목적어를 빠짐없이 자연스럽게 반영합니다. ‘그녀는 … 그의 아내로 주었습니다’가 대명사 지시도 명료합니다.
  terminology: ‘여종’은 አመትየ에 적절합니다. ‘아내로 주었습니다’는 결혼 관계를 나타내는 ትኩኖ ብእሲተ를 충실히 반영합니다.
  issues:
