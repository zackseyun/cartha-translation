lexical_decisions:
- source_word: أمتي / አመትየ
  english_pob_choice: my maidservant
  chosen_korean: 내 여종
  alternatives_korean:
  - 내 종
  - 내 하녀
  lexicon: δοῦλη / maidservant 대응
  rationale: 문맥상 여성을 가리키는 종속 신분을 드러내야 하므로, 중립적인 ‘종’보다 ‘여종’이 더 직접적이며, ‘하녀’보다 신분 관계가 분명합니다.
- source_word: ትፀንስ
  english_pob_choice: she will conceive
  chosen_korean: 그가 아이를 밸 것입니다
  alternatives_korean:
  - 그녀가 잉태할 것입니다
  - 그가 임신할 것입니다
  lexicon: conceive
  rationale: ‘밸 것이다’는 한국어 성경 문체에서 임신·수태를 자연스럽게 나타내며, 본문에 없는 ‘가서’ 같은 동작을 덧붙이지 않도록 했습니다.
- source_word: ወወሀበት ባላሃ
  english_pob_choice: And she gave Bilhah her maidservant to be his wife
  chosen_korean: 그리고 그가 자기 여종 빌하를 자기의 아내로 주었습니다
  alternatives_korean:
  - 그리고 그녀가 자기 여종 빌하를 그의 아내로 주었습니다
  - 그리고 빌하를 그의 아내로 주었습니다
  lexicon: gave ... to be his wife
  rationale: 게으즈 본문은 ‘주다’의 주어와 목적 관계를 간명하게 전달하므로, 결혼 관계를 드러내는 ‘아내로 주었습니다’로 옮기되 본문의 직접 진술을 유지했습니다.
