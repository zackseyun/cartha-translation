    issue: ‘내게 아들을 낳을 것입니다’가 누락되었습니다.
    rationale: 원문은 ‘잉태하고(ወትፀንስ) 내게(ሊተ) 아들을(ወልደ) 낳을 것이다(ወትወልድ)’라고 하므로, 임신만 언급한 초안은 의미를 축소합니다.
  - severity: high
    issue: 마지막 문장의 대명사와 소유 관계가 역전되었습니다.
    rationale: 빌하를 주는 이는 문맥상 여성(라헬)이고, 빌하는 남성의 아내가 됩니다. ‘그가 자기 여종 빌하를 자기의 아내로’는 주어를 남성으로 바꾸고 빌하를 그 자신의 아내로 주는 듯하게 만듭니다.
  - severity: medium
    issue: 각주 a는 원문에 없는 ‘들어가라’를 대안 번역처럼 제시합니다.
