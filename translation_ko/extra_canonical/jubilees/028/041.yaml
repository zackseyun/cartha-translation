translation:
  language: ko
  text: 그녀도 자기 여종 실바를 데려다가 야곱에게 아내로 주었고, 실바가 잉태하여 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእቲኒ
  english_pob_choice: she also
  chosen_korean: 그녀도
  alternatives_korean:
  - 그녀가 또한
  - 그녀 역시
  lexicon: also / enclitic emphasis
  rationale: 게에즈의 -ni가 ‘also/even’의 부가·강조를 나타내므로, 주어에 붙는 ‘도’로 간결하게 반영했습니다.
- source_word: ዜልፋሃ
  english_pob_choice: Zilpah
  chosen_korean: 실바
  alternatives_korean:
  - 질바
  - 질파
  lexicon: proper noun
  rationale: 인명은 한국어 음역 관행에 따라 표기하되, 성경 인명으로 널리 쓰이는 형태를 우선했습니다.
- source_word: ብእሲተ
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 부인으로
  lexicon: wife / woman
  rationale: 문맥상 야곱에게 ‘아내로’ 주었다는 관계를 직접적으로 드러내는 표현이 가장 자연스럽습니다.
- source_word: ወፀንሰት፡ ወወለደት፡
  english_pob_choice: and she conceived and bore
  chosen_korean: 그가 잉태하여 아들을 낳았습니다
  alternatives_korean:
  - 그녀가 잉태하여 낳았습니다
  - 그녀가 임신하여 낳았습니다
  lexicon: conceived / bore
  rationale: 출생 결과가 문맥상 분명하므로 한국어에서는 자연스럽게 ‘아들을 낳았습니다’로 풀어, ‘잉태하여’와의 연속을 살렸습니다.
theological_decisions:
- issue: ‘ma servant’의 사회적 신분을 어떻게 드러낼지
  chosen_reading: 자기 여종
  alternative_readings:
  - 자기 시녀
  - 자기 종
  rationale: 여기서는 가정 내 여성 종의 신분을 가리키는 말이므로, 문맥적 뉘앙스를 살리되 과도하게 근대적·완곡하지 않은 ‘여종’을 택했습니다.
  doctrine_reference: 사회적 신분 표지의 서술적 번역
