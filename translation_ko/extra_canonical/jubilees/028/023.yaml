translation:
  language: ko
  text: 그리고 그는 레아보다 라헬을 더 사랑하였습니다.[a] 레아가 그에게 주어졌기 때문입니다. 야훼께서 레아의 태를 여시니, 그녀가 임신하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 레아가 그에게 주어졌기 때문에 라헬을 사랑하였습니다.”
    reason: 영어 POB의 대안 구두점에 따라 ‘레아보다 더’라는 비교 표현이 인과절이 아니라 ‘사랑하였습니다’에만 결부되는 대안 수식 범위를 보존합니다.
lexical_decisions:
- source_word: ራሔል ... እምልያ / And he loved Rachel more than Leah
  english_pob_choice: And he loved Rachel more than Leah
  chosen_korean: 그는 레아보다 라헬을 더 사랑하였습니다
  alternatives_korean:
  - 그리고 그는 라헬을 레아보다 더 사랑하였습니다
  - 그는 레아보다 라헬을 더 좋아하였습니다
  lexicon: 사랑하다
  rationale: 원문과 POB 모두 비교 우위를 분명히 하므로 ‘더 사랑하였습니다’로 직접 옮기고, ‘좋아하다’처럼 약화되는 표현은 피했습니다.
- source_word: ትውህበት / had been given
  english_pob_choice: because Leah had been given to him
  chosen_korean: 레아가 자기에게 주어졌기 때문입니다
  alternatives_korean:
  - 레아가 그에게 주어졌기 때문입니다
  - 레아가 그에게 준 바 되었기 때문입니다
  lexicon: 주다 / 주어지다
  rationale: 수동형 의미를 살려 ‘주어졌기 때문입니다’로 옮겼고, ‘자기에게’는 결혼 관계의 귀속을 자연스럽게 드러냅니다.
- source_word: እግዚአብሔር ... ማኅፀነ፡ ልያ፡ / the LORD opened Leah’s womb
  english_pob_choice: And the LORD opened Leah’s womb
  chosen_korean: 야훼께서 레아의 태를 여시니
  alternatives_korean:
  - 주님께서 레아의 태를 여시니
  - 야훼께서 레아의 자궁을 열어 주시니
  lexicon: 태 / 열다
  rationale: 출산 능력을 가리키는 관용적 표현으로 ‘태를 여시다’를 유지해 원문의 신적 행위를 자연스럽고 직접적으로 살렸습니다.
- source_word: ወፀንሰት / and she conceived
  english_pob_choice: and she conceived
  chosen_korean: 그녀가 임신하였습니다
  alternatives_korean:
  - 그녀가 잉태하였습니다
  - 그녀가 수태하였습니다
  lexicon: 임신하다
  rationale: 현대 한국어에서 가장 명료한 서술형으로 ‘임신하였습니다’를 택했으며, 고전적·교회적 어감의 ‘잉태하다’보다 덜 문어적입니다.
theological_decisions:
- issue: 야훼라는 신명 표기와 창세기 서술의 직설성 유지
  chosen_reading: 본문의 신적 주어를 ‘야훼’로 직접 옮기고, 신의 행위(태를 여심)를 완곡화하지 않았습니다.
  alternative_readings:
  - 주님께서 ...
  - 하나님께서 ...
  rationale: 게에즈 원문의 እግዚአብሔር은 야훼를 가리키므로 프로젝트 기본값에 따라 ‘야훼’를 사용했고, 생식의 주권이 하나님께 있음을 분명히 했습니다.
  doctrine_reference: divine name / providence
