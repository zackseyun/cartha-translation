  naturalness: ‘자신에게 불리한 죄를 하늘에까지 올려 보냅니다’는 현대 표준어 합쇼체 안에서 자연스럽게 사역성과 비유적 표현을 유지합니다. ‘이 일을 하는 사람은 아무도 의롭지 않으니’도 원문의 단정적 판단을 자연스럽게 전달합니다. 구절이 ‘이는’으로 끝나는 것은 원문 자체가 다음 절로 이어지는 접속 표현으로 끝나므로 보존했습니다.
