translation:
  language: ko
  text: 그가 자기 죄를 하늘에까지 올라가게 합니다. 이런 일을 하는 사람은 아무도 의롭지 않으니, 이는[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አበሳ
  english_pob_choice: sin
  chosen_korean: 죄
  alternatives_korean:
  - 죄악
  - 허물
  - 죄책
  lexicon: 'source sense: sin/guilt'
  rationale: 게에즈 አበሳ는 단순한 행위로서의 죄뿐 아니라 죄책의 뉘앙스도 가질 수 있으나, 문맥상 직접 목적어로서의 기본 의미를 살려 표준적인 ‘죄’로 옮겼습니다.
- source_word: ያዐርግ
  english_pob_choice: he brings up
  chosen_korean: 올라가게 합니다
  alternatives_korean:
  - 올립니다
  - 올려 보냅니다
  - 올라가게 합니다
  lexicon: causative verb from አዕረገ
  rationale: 영어 POB가 수정한 것처럼 이 동사는 단순히 ‘올라가다’가 아니라 ‘올라가게 하다’의 사역 의미이므로, 그 사역성을 드러내는 표현을 택했습니다.
- source_word: በእንቲአሁ... ውስተ ሰማይ
  english_pob_choice: into heaven / on his account into heaven
  chosen_korean: 하늘에까지
  alternatives_korean:
  - 하늘로
  - 하늘 안으로
  - 자기 때문에 하늘에
  lexicon: 'source phrase: into heaven, with explicit locative direction'
  rationale: 문장 골격은 ‘하늘로/하늘에’의 방향성을 요구하므로, 한국어에서 자연스럽고 압축적인 ‘하늘에까지’로 방향성과 강조를 함께 살렸습니다.
- source_word: ዘይገብር ዘንተ ነገረ
  english_pob_choice: who does this thing
  chosen_korean: 이런 일을 하는 사람
  alternatives_korean:
  - 이 일을 하는 사람
  - 이것을 행하는 자
  - 이런 일을 하는 이
  lexicon: 'source phrase: who does this thing'
  rationale: POB가 ‘this thing’으로 직역한 대상을 한국어에서는 ‘이런 일’로 자연스럽게 옮기되, 행위의 구체성과 평가성을 유지했습니다.
theological_decisions:
- issue: 죄가 하늘에까지 올라간다는 진술의 보존
  chosen_reading: 죄를 하늘에까지 올라가게 한다는 직설적 표현을 유지했습니다.
  alternative_readings:
  - 죄가 하늘로 올라간다
  - 하늘 앞에 죄책을 쌓는다
  rationale: 이 구절은 죄의 결과를 상징적으로 ‘하늘’에 연결하는 강한 표현이므로, 이를 완화하지 않고 원문의 도발적 이미지를 보존하는 것이 적절합니다.
  doctrine_reference: 죄와 심판에 대한 제2성전기 유대교 문맥의 표상
