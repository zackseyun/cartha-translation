  source_fidelity: 첫 구절의 ሌሁ는 ‘그와 함께’에 해당하며, 현 초안의 ‘그가 그들과 함께’는 동행 관계와 주체를 바꾸었습니다. 또한 이 절은 앞 문장에 이어지는 분절로 보이므로, 한국어에서도 주어를 보충하지 않고 연결된 형태를 유지하는 것이 원문과 영어 POB에 충실합니다. 꿈에서 본 것과 그에게 말해진 것을 모두 말했다는 후반부는 충실합니다.
  naturalness: ‘그와 함께 가나안 땅으로 갔습니다. 이는 … 때문입니다’는 문장 분절 상태에서도 자연스럽고 현대 표준어 합쇼체에 맞습니다. ‘자기에게’는 선행 주어가 불분명한 첫 문장과 결합될 때 지시가 다소 흐려질 수 있어 ‘그에게’가 더 명료합니다.
  terminology: ‘가나안 땅’, ‘꿈’, ‘말해진’은 지명 및 피동 표현을 적절히 보존합니다. 신학적 용어의 조정은 필요하지 않습니다.
