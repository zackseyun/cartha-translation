translation:
  language: ko
  text: 그와 함께 가나안 땅으로 갔습니다. 이는 그가 꿈에서 본 모든 것과 그에게 말해진 모든 것을 그들에게 말했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሁ፡ ምድረ፡ ከናአን
  english_pob_choice: to the land of Canaan
  chosen_korean: 가나안 땅으로
  alternatives_korean:
  - 가나안 지역으로
  - 가나안의 땅으로
  lexicon: 고유명사 지명
  rationale: 원문의 목적어 구문을 자연스러운 현대 한국어로 옮기되, 지명은 관용적으로 ‘가나안 땅’으로 처리했습니다.
- source_word: እስመ፡
  english_pob_choice: for
  chosen_korean: 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: 접속사/이유 표시
  rationale: 문맥상 앞의 이동 진술에 대한 이유를 제시하므로, 합쇼체에서 가장 자연스러운 인과 표현으로 옮겼습니다.
- source_word: ዘከመ፡ ርእየ፡ ኵሎ፡ በህልም፡
