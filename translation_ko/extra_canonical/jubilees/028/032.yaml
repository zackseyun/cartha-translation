  language: ko
  text: 첫째 주의 첫 해였습니다. 이 모든 일 가운데 라헬은 레아를 시기했습니다. 레아는 아이를 낳지 못했기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “In the first year of the fourth week.”
  english_pob_choice: In the first year of the fourth week.
  chosen_korean: 첫째 주의 첫 해였습니다.
  alternatives_korean:
  - 네 번째 주의 첫 해였습니다.
  - 넷째 주의 첫 해였습니다.
  lexicon: source chronological formula
  rationale: 에티오피아어 원문의 시간 표지를 자연스러운 한국어 연대 표현으로 옮겼으며, 주(week)의 수식 관계를 간결하게 보존했습니다.
- source_word: ትቀንዕ / jealous
  english_pob_choice: was jealous
  chosen_korean: 시기했습니다
  alternatives_korean:
  - 질투했습니다
  - 샘냈습니다
  lexicon: ζηλόω 계열
  rationale: 원문의 감정은 단순한 관심이 아니라 경쟁적·적대적 시기의 뜻이므로, 합쇼체에서 가장 직접적인 표준어 표현인 “시기했습니다”를 택했습니다.
- source_word: በ*ልያ፡ እስመ ይእቲ
  english_pob_choice: because she was barren
  chosen_korean: 레아는 아이를 낳지 못했기 때문입니다.
  alternatives_korean:
  - 레아가 불임이었기 때문입니다.
  - 레아가 아이를 갖지 못했기 때문입니다.
  lexicon: 불임/무자녀 상태
  rationale: 영문 본문이 요구하는 ‘barren’의 의미를 살리되, 현대 한국어에서 직접적이면서도 과도하게 의학화되지 않은 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘barren’의 상태 서술 방식
  chosen_reading: 레아의 상태를 단순한 정보 진술로 유지하고, 원인절만 덧붙여 해석적 확대를 하지 않았습니다.
  alternative_readings:
  - 레아가 불임이었기 때문이라고 명시적으로 해석하기
  - 레아가 자녀가 없었기 때문이라고 완화하기
  rationale: 본문은 라헬의 시기 원인을 레아의 출산 불가 상태로 연결할 뿐이므로, 서술을 과장하지 않고 원인-결과 구조를 그대로 드러냈습니다.
  doctrine_reference: 서사 본문의 평이한 인과 진술 보존
