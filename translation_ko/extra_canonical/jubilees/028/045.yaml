lexical_decisions:
- source_word: ወቦአ፡ ያዕቆብ፡ ኀበ፡ ሊያ፡
  english_pob_choice: And Jacob went in to Leah
  chosen_korean: “야곱이 레아에게 들어갔고”
  alternatives_korean:
  - 야곱이 레아와 동침했고
  - 야곱이 레아에게 들어가
  lexicon: Geez ኀበ + 동사 구문
  rationale: 원문과 POB 영어의 완곡한 성적 결합 표현을 그대로 반영해, 노골화하지 않으면서도 사건의 의미를 분명히 전달했습니다.
- source_word: ወፀንሰት፡ ወወለደት፡
  english_pob_choice: and she conceived and bore a son
  chosen_korean: “레아는 임신하여 아들을 낳았습니다”
  alternatives_korean:
  - 레아가 잉태하여 아들을 낳았습니다
  - 레아가 임신했고 아들을 낳았습니다
  lexicon: Geez 완료 서술 + 출산 동사
  rationale: ‘conceived and bore’의 연속 동작을 자연스러운 한국어로 옮겨, ‘임신하여’와 ‘낳았습니다’로 간결하게 재현했습니다.
- source_word: ወጸውዐት፡ ስሞ፡ ይሳኮር፡
  english_pob_choice: and she called his name Issachar
  chosen_korean: “그의 이름을 잇사갈이라 불렀습니다”
  alternatives_korean:
  - 그의 이름을 잇사갈이라 지었습니다
  - 그 이름을 잇사갈이라 불렀습니다
  lexicon: Geez 이름 명명 공식
  rationale: 성경적 명명 공식을 자연스럽게 살리되, 한국어 관용에 맞게 ‘불렀습니다’로 처리했습니다.
- source_word: በራብዑ፡
  english_pob_choice: on the fourth day
  chosen_korean: “그 넷째 날에”
  alternatives_korean:
  - 넷째 날에
  - 그 제4일에
  lexicon: Geez 시간 부사구
  rationale: 문맥상 잇사갈 이름 붙임과 연결된 시간표현을 직역에 가깝게 유지했습니다.
