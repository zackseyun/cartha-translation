translation:
  language: ko
  text: 얼룩진 모든 양, 점무늬 표식이 있는 양, 검은 점이 있는 양들이었으며, 그 양들은 다시 번식하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉን፡ አባግዕ፡
  english_pob_choice: all the sheep
  chosen_korean: 모든 양들
  alternatives_korean:
  - 양들 모두
  - 모든 양 떼
  lexicon: 아바그아/양
  rationale: 집합 전체를 가리키는 표현이므로 ‘모든 양들’로 자연스럽게 옮겼습니다.
- source_word: ጋሴ፡
  english_pob_choice: speckled
  chosen_korean: 얼룩진
  alternatives_korean:
  - 반점이 있는
  - 얼룩무늬의
  lexicon: 얼룩지다
  rationale: 양의 털무늬를 가리키는 형용사로, 한국어에서는 ‘얼룩진’이 가장 간결하고 본문 톤에 맞습니다.
- source_word: ትእምርተ፡ ኵስኵሰ፡
  english_pob_choice: those that had marks of spots
  chosen_korean: 점이 있는 표식을 가진 것들
  alternatives_korean:
  - 반점의 표지가 있는 것들
  - 점무늬 표식을 지닌 것들
  lexicon: 표식/표지
  rationale: 표지나 표시를 뜻하는 어감을 살려, 단순한 무늬보다 ‘표식’이라는 표현으로 원문의 표시성(특징 표지)을 반영했습니다.
- source_word: ሐመደ፡ ኵስኵሰ፡
  english_pob_choice: those that had dark spots
  chosen_korean: 검은 점이 있는 것들
  alternatives_korean:
  - 짙은 반점이 있는 것들
  - 어두운 점이 있는 것들
  lexicon: 검다/점
  rationale: 색채 대비를 분명히 드러내기 위해 ‘검은 점’으로 옮겼습니다.
- source_word: ወይደግማ፡
  english_pob_choice: they would breed again
  chosen_korean: 그들은 다시 번식하였습니다
  alternatives_korean:
  - 그들은 다시 새끼를 쳤습니다
  - 그들은 또 번식하였습니다
  lexicon: 번식하다
  rationale: 동물의 번식 결과를 직접 가리키는 동사로서 원문의 의미를 가장 분명하게 전달합니다.
