lexical_decisions:
- source_word: በሠርቅ
  english_pob_choice: on the new moon of the fourth month
  chosen_korean: 넷째 달의 초하루
  alternatives_korean:
  - 넷째 달의 새달
  - 넷째 달의 신월
  lexicon: chronological formula
  rationale: 주석의 영어 판정처럼 달력 용어로서의 ‘새달/신월’ 의미를 살려, 한국어에서는 자연스럽고 투명한 ‘초하루’로 옮겼습니다.
- source_word: ራብዕ
  english_pob_choice: fourth
  chosen_korean: 넷째
  alternatives_korean:
  - 네 번째
  lexicon: ordinal number
  rationale: 달·해·주간을 아우르는 연대기적 표현이므로, 간결한 서술형 서수 ‘넷째’를 유지했습니다.
- source_word: ዓመት
  english_pob_choice: year
  chosen_korean: 해
  alternatives_korean:
  - 년
  lexicon: time unit
  rationale: 연대기적 나열에서 현대 한국어의 자연스러운 표현인 ‘해’를 택했습니다.
- source_word: ወበመዋዕለ፡ ተወልደ
  english_pob_choice: And in the days when he was born...
  chosen_korean: 그리고 그가 태어난 날들에는…
  alternatives_korean:
  - 그리고 그가 태어난 때에는…
  - 그리고 그가 태어나던 날들에는…
  lexicon: construct clause
  rationale: 게에즈의 종속적 관용구를 살려 문장을 닫지 않고 이어지게 하되, 한국어에서는 ‘날들에는’로 남겨 다음 절로 넘어가는 미완 결구를 반영했습니다.
theological_decisions:
- issue: 마지막 절의 미완성 처리
  chosen_reading: 독립문장으로 완결하지 않고, 다음 절로 이어지는 종속절의 느낌을 살려 말줄임표를 남겼습니다.
  alternative_readings:
  - 그리고 그가 태어났습니다.
  - 그리고 그가 태어난 때가 있었습니다.
  rationale: 원문이 다음 절을 기다리는 구조이므로, 완결된 사건 진술로 매끈하게 고치지 않고 문법적 미완성을 보존하는 편이 स्रोत에 더 충실합니다.
