  source_fidelity: 초안의 영어 단어 ‘younger’, ‘elder’가 한국어 문장 안에 그대로 남아 있어 번역문으로 성립하지 않습니다. 게에즈어의 여성형 ‘더 어린 이/더 나이 많은 이’와 이 대목의 혼인 맥락을 반영하여 ‘어린 딸’과 ‘나이 많은 딸’로 옮겼습니다. 제공된 원문과 영어 감사 문구가 이유절 접속사에서 끝나는 점은 보존했습니다.
  naturalness: ‘어린 딸을 나이 많은 딸보다 먼저 시집보내는 것’은 현대 표준 한국어에서 자연스럽고, 혼인 관계에서 ‘give … before’가 뜻하는 바를 명확히 합니다. 합쇼체 서술형과 미완결 이유절은 ‘왜냐하면…’으로 유지했습니다.
  terminology: ‘옳지 않습니다’는 ርቱዐ(옳다, 정당하다)에 대한 절제된 규범적 판단을 적절히 반영합니다. ‘시집보내다’는 이 문맥의 딸을 혼인시키는 행위를 가리키며, 특정 교리적 해석을 추가하지 않습니다.
