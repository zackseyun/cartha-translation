lexical_decisions:
- source_word: በምድርነ፡
  english_pob_choice: in our land
  chosen_korean: 우리 땅에서는
  alternatives_korean:
  - 우리 땅에서
  - 우리 나라에서는
  lexicon: 토지/땅
  rationale: Geʽez의 장소구문을 영어 POB의 “in our land”에 맞추되, 현대 한국어에서는 소속과 범위를 자연스럽게 드러내는 ‘우리 땅에서는’이 가장 간결합니다.
- source_word: ትንእስ ... ትልህቅ
  english_pob_choice: the younger before the elder
  chosen_korean: younger를 elder보다 앞세우는
  alternatives_korean:
  - 어린 자를 나이 많은 자보다 앞세우는
  - 젊은 자를 나이 많은 자보다 먼저 두는
  lexicon: 비교/서열 표현
  rationale: 본문은 ‘더 어린 자를 더 나이 많은 자보다 먼저 두는’ 서열 역전을 말하므로, 의미를 보존하면서도 직역 투를 줄인 표현으로 옮겼습니다.
- source_word: ወአኮ፡ ርቱዐ፡ ለገቢረ፡ ዝንቱ
  english_pob_choice: it is not right to do this
  chosen_korean: 그렇게 하는 것은 옳지 않습니다
  alternatives_korean:
  - 이것을 행하는 것은 옳지 않습니다
  - 그 일을 하는 것은 올바르지 않습니다
  lexicon: 옳다/정당하다
  rationale: ‘not right’의 도덕적·규범적 판단을 현대 표준어의 ‘옳지 않습니다’로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 후반절의 이유절이 소스 단편에서 미완결로 끝남
