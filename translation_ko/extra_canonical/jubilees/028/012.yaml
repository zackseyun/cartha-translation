  rationale: 주어진 Geʽez 본문과 영어 POB가 모두 ‘for’에서 끊기므로, 의미를 보태어 완결시키지 않고 단절감을 유지하는 것이 사본 증거에 충실합니다.
  doctrine_reference: source-criticism / text-critical restraint
