  text: She did not bear children, and she said to Jacob, “Give me children.” And Jacob said, “Have I withheld from you?”
translation:
  language: ko
  text: 그녀는 아이를 낳지 못했습니다. 그리고 야곱에게 말했습니다. 「제게 자녀를 주십시오.」 야곱이 말했습니다. 「제가 당신에게 주지 않은 것이 있습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: did not bear children
  english_pob_choice: She did not bear children
  chosen_korean: 그녀는 아이를 낳지 못했습니다
  alternatives_korean:
  - 그녀는 자녀를 낳지 못했습니다
  - 그녀는 아이를 생산하지 못했습니다
  lexicon: n/a
  rationale: Geez 원문은 출산 부정문으로, 자연스러운 한국어에서는 ‘아이를 낳지 못했습니다’가 가장 직접적이고 과도한 의역 없이 상태를 드러냅니다.
- source_word: children / Give me children
  english_pob_choice: children
  chosen_korean: 자녀
  alternatives_korean:
  - 아이
  - 자식
  lexicon: n/a
  rationale: 야곱에게 요구하는 말에서는 복수성과 관계성을 함께 살리는 ‘자녀’가 적절합니다. 대화체에서는 앞 문장의 ‘아이’와 병행해도 되지만, 청유의 직접성은 ‘자녀를 주십시오’가 더 분명합니다.
- source_word: Have I withheld from you?
  english_pob_choice: Have I withheld from you?
  chosen_korean: 제가 당신에게서 무엇을 빼앗았습니까?
  alternatives_korean:
  - 제가 당신에게서 무엇을 아꼈습니까?
  - 제가 당신에게서 무엇을 금했습니까?
  lexicon: n/a
  rationale: 원문은 ‘주지 않음/막음’의 항변을 담고 있으므로, 한국어에서는 문맥상 빈손을 변호하는 반문으로 ‘무엇을 빼앗았습니까?’가 가장 자연스럽습니다.
theological_decisions:
- issue: 서술의 미완성 반문 유지
  chosen_reading: 야곱의 말은 완결된 설명이 아니라 반문 형태로 짧게 끝납니다.
  alternative_readings:
  - 「제가 당신에게서 무엇을 빼앗지 않았습니까?」처럼 완결형으로 보완
  - 의미를 풀어 「제가 당신에게서 무엇을 주지 않았습니까?」로 확장
  rationale: 원문과 영어 POB 모두 끝맺음을 확장하지 않으므로, 한국어도 반문의 긴장감을 보존해 서술을 덧붙이지 않았습니다.
