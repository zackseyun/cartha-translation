  source_fidelity: 첫 구절 አዕይንቲሃ는 이 절 분할 때문에 앞 문장에 걸려야 할 것으로 보이는 고립된 ‘그녀의 눈’입니다. 초안의 ‘그녀의 눈이었습니다’는 원문에 없는 계사·과거시제를 더하여 단절 자체를 잘못 재구성합니다. 또한 마지막 ኢኮነ፡ ከመዝ의 부정 의미가 초안에서는 탈락했습니다.
