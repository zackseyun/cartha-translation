translation:
  language: ko
  text: 주님께서는 레아가 미움을 받고 라헬이 사랑을 받는 것을 보셨습니다. 그리고 야곱은 다시 들어갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: YHWH
  rationale: 이 본문은 영어 POB가 관습적으로 ‘the LORD’로 옮긴 경우이므로, 한국어 본문에서는 공적 문체에 맞는 ‘주님’을 본문에 두고, 별도의 야훼 표기는 본문에 직접적 히브리어 대응이 있을 때로 한정했습니다.
- source_word: ትጸላእ
  english_pob_choice: was hated
  chosen_korean: 미움을 받는
  alternatives_korean:
  - 미움받은
  - 증오를 받은
  lexicon: passive verbal construction
  rationale: 수동 의미를 살리되 한국어에서 자연스럽고 문맥에 맞는 ‘미움을 받는’으로 처리하여 레아가 타자에게서 배척된 상태를 드러냈습니다.
- source_word: ትትፈቀር
  english_pob_choice: was loved
  chosen_korean: 사랑을 받았습니다
  alternatives_korean:
  - 사랑받았습니다
  - 사랑을 받는
  lexicon: passive verbal construction
  rationale: 라헬에 대한 대조를 분명히 하기 위해 수동형 의미를 그대로 반영했고, 문장 종결은 서술형 과거로 맞췄습니다.
- source_word: ወቦአ
  english_pob_choice: went in to
  chosen_korean: 들어갔습니다
  alternatives_korean:
  - 그녀에게 들어갔습니다
  - 그에게 들어갔습니다
  lexicon: sexual euphemism / contextual verb
  rationale: Ge'ez의 전치사로 끝나는 구조와 다음 절 연결을 고려하면 목적어를 과잉 보충하지 않는 것이 소스에 더 충실하므로, 본문에서는 ‘들어갔습니다’로 마무리해 다음 절과 자연스럽게 이어지도록 했습니다.
theological_decisions:
- issue: ‘hated’와 ‘loved’의 관계를 정서적 호감 수준으로 완화할지 여부
  chosen_reading: 관계의 강한 대비를 유지하여 레아는 미움을 받고 라헬은 사랑을 받는다고 옮겼습니다.
  alternative_readings:
  - 레아는 덜 사랑받았고 라헬은 더 사랑받았습니다
  - 레아는 소외되었고 라헬은 사랑받았습니다
  rationale: 본문의 대조는 서사적 긴장을 형성하므로, 완곡한 비교급으로 약화하지 않고 직접적인 수동 표현을 유지했습니다.
  doctrine_reference: 서사 본문의 인물 관계 묘사
- issue: 마지막 동사 뒤 목적어를 보충할지 여부
  chosen_reading: 영어 POB의 최신 수정은 목적어 ‘her’를 보충했지만, Ge'ez 본문과 절 경계를 함께 보면 여기서는 목적어를 본문에 명시하지 않고 다음 절로 연결하는 것이 더 적절합니다.
  alternative_readings:
  - 그녀에게 들어갔습니다
  - 라헬에게 들어갔습니다
  rationale: 원문이 전치사 ኀበ로 끝나며 다음 절 첫 단어가 라헬이므로, 한국어도 불필요한 목적어를 덧붙이지 않고 절 연결을 살리는 것이 소스 기반입니다.
  doctrine_reference: 본문 비평 / 절 경계
