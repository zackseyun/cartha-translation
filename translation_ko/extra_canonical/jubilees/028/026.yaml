revisions:
- from: 주님께서는 레아가 미움을 받는 것을 보셨고, 라헬은 사랑을 받았습니다. 그리고 야곱은 다시 그녀에게 들어갔습니다.[a]
  to: 주님께서는 레아가 미움을 받고 라헬이 사랑을 받는 것을 보셨습니다. 그리고 야곱은 다시 들어갔습니다.
  rationale: 원문의 절 경계상 다음 절에 속하는 목적어 ‘라헬’을 대명사로 앞당겨 보충하지 않았습니다. 한국어 문법상 전치사로 끝나는 원문 구문을 그대로 미완으로 둘 수 없으므로, 의미를 추가하지 않는 범위에서 동사를 자연스럽게 종결했습니다. 불필요해진 영어 기반 각주는 삭제했습니다.
