  text: '[He took] Leah his elder daughter, and gave her to Jacob as a wife, and he gave her Zilpah his maidservant as a handmaid.'
  footnotes:
  - marker: a
    text: Or 'Leah his elder daughter, and gave her'.
    reason: previous_rendering
translation:
  language: ko
  text: '[그는] 그의 맏딸 레아를 데려다가 야곱에게 아내로 주었고, 그의 여종 실바를 시녀로도 주었습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትልህቅ (elder/older)
  english_pob_choice: elder daughter
  chosen_korean: 맏딸
  alternatives_korean:
  - 큰딸
  - 언니딸
  lexicon: 인명관계 표현
  rationale: 단순한 ‘나이 많은’보다 가족 서술에서 자연스럽고 간결한 ‘맏딸’이 원문의 장자적·출생순 의미를 잘 살립니다.
- source_word: ብእሲተ (as a wife)
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내로서
  - 아내로 삼아
  lexicon: 혼인 관계 표현
  rationale: 동사 ‘주었다’와 결합해 야곱에게 혼인 상대를 넘겨준 의미를 직접 드러내도록 ‘아내로’로 옮겼습니다.
- source_word: ዘለፋሃ / maidservant
  english_pob_choice: maidservant
  chosen_korean: 여종
  alternatives_korean:
  - 시녀
  - 하녀
  lexicon: 종/여종 어휘
  rationale: 원문의 종속 신분을 분명히 하는 기본 대응어는 ‘여종’이며, 후반부 기능어 ‘시녀’와 구분해 사회적 지위를 드러냅니다.
- source_word: አመተ፡ ለእኪት (handmaid)
  english_pob_choice: as a handmaid
  chosen_korean: 시녀로도
  alternatives_korean:
  - 몸종으로도
  - 시종으로도
  lexicon: 종속 보조 역할 어휘
  rationale: 주어에게 부속된 보조적 역할을 나타내는 말로 ‘시녀’가 가장 자연스럽고, ‘도’를 넣어 앞의 혼인 부여와 별도의 추가 제공임을 살렸습니다.
theological_decisions:
- issue: 문장 앞의 생략 주어와 절 분절
  chosen_reading: 대괄호로 ‘[그는]’을 보완해 앞 절의 주체가 계속 이어짐을 드러냈습니다.
  alternative_readings:
  - 주어를 생략해 ‘레아를 데려다가…’로 시작
  - ‘그는 레아를 데려다가…’로 완전한 문장화
  rationale: 주어진 영어 POB가 전 절과의 분절 때문에 주어 보완을 허용하는 만큼, 한국어에서도 독자가 문맥 없이 읽을 때 의미가 끊기지 않도록 최소 보완을 했습니다.
  doctrine_reference: 서사 문맥 보존 및 절 연속성
- issue: ‘maidservant’와 ‘handmaid’의 이중 표현
  chosen_reading: ‘여종… 시녀’로 두 표현을 모두 살려, 동일 인물을 두 관점에서 설명하는 원문의 중복을 보존했습니다.
  alternative_readings:
  - 둘 다 ‘여종’으로 통일
  - 둘 다 ‘시녀’로 통일
  rationale: 원문은 동일한 인물을 신분과 기능으로 함께 설명하므로, 한국어에서도 의미 차이를 지워버리지 않도록 구분해 번역했습니다.
  doctrine_reference: 서술의 중복 보존 원칙
