translation:
  language: ko
  text: 레아가 잉태하여 야곱에게 둘째 아들을 낳았습니다. 그리고 그는[a] 그 아들의 이름을 시므온이라 불렀습니다. 스물한째 날에.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀가 불렀다.”
    reason: 영어 POB 감사 이력의 대안 독법 각주를 한국어로 제공하며, 남성 단수 동사를 따르는 본문 번역은 유지합니다.
lexical_decisions:
- source_word: ወፀንሰት / ወወለደት
  english_pob_choice: conceived and bore
  chosen_korean: 잉태하여 … 낳았습니다
  alternatives_korean:
  - 임신하여 … 출산했습니다
  - 잉태하고 … 낳았습니다
  lexicon: 잉태하다; 낳다
  rationale: Ge'ez의 연속 동작을 자연스럽게 살리되, 출산 서술의 직접성을 유지하기 위해 ‘잉태하여 … 낳았습니다’로 옮겼습니다.
- source_word: לְיַעֲקֹב / לְ…
  english_pob_choice: Jacob
  chosen_korean: 야곱에게
  alternatives_korean:
  - 야곱을 위해
  - 야곱을 향하여
  lexicon: 야곱
  rationale: 수혜/귀속 관계를 나타내는 전치사적 용법으로 읽어, 아들이 야곱에게 태어났음을 한국어 조사 ‘-에게’로 반영했습니다.
- source_word: በኵር / second son
  english_pob_choice: a second son
  chosen_korean: 둘째 아들
  alternatives_korean:
  - 두 번째 아들
  - 둘째 아기
  lexicon: 둘째; 아들
  rationale: 자녀의 출생 순서를 자연스럽고 분명하게 드러내는 한국어 관용 표현입니다.
- source_word: ወጸውዐ
  english_pob_choice: he called
  chosen_korean: 그는 … 불렀습니다
  alternatives_korean:
  - 그가 … 불렀습니다
  - 그가 이름을 지었습니다
  lexicon: 부르다
  rationale: 개정된 영어 POB와 달리 Ge'ez 동사가 남성 3인칭 단수이므로, 주어를 ‘그는’으로 두어 족장 야곱이 이름을 붙이는 재서술 특징을 보존했습니다.
theological_decisions:
- issue: 창세기 전승과 달리 이름 짓는 주체를 누구로 보존할 것인가
  chosen_reading: 야곱이 이름을 부른 것으로 옮겼습니다.
  alternative_readings:
  - 레아가 이름을 불렀다고 순화함
  - 주어를 생략해 모호하게 처리함
  rationale: 본문은 모계 화자를 암시하지 않고 남성 단수 동사를 사용하므로, Jubilees의 편집적 의도를 지우지 않기 위해 야곱 주어를 유지했습니다.
  doctrine_reference: 본문비평/문헌적 편집 특징
- issue: ‘스물하나째’의 시간 표현을 어떻게 처리할 것인가
  chosen_reading: 본문의 날짜성 표현을 살려 ‘스물하나째 날에’로 옮겼습니다.
  alternative_readings:
  - 그날 스물하나에
  - 스물한째 날에
  rationale: 게즈 원문 끝의 날짜 표지를 한국어에서 가장 자연스러운 절차적 표현으로 반영했습니다.
  doctrine_reference: 서사적 시간 표지
