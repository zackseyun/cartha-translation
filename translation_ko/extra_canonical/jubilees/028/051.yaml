translation:
  language: ko
  text: 요셉, 야곱이 라반에게 말했습니다. “내 아내들과 내 자녀들을 내게 주십시오. 그러면 나는 내 아버지 이삭에게로 가겠습니다. 그리고 내가 만들겠습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዮሴፍ
  english_pob_choice: Joseph
  chosen_korean: 요셉
  alternatives_korean:
  - 요셉이 태어났을 때
  - 요셉이
  lexicon: 고유명사
  rationale: 게에즈 본문에는 이름 ‘요셉’만 있으며, 영어의 보완적 시간절은 분절 보정이므로 한국어도 본문 표면형을 따라 이름만 옮겼습니다.
- source_word: ይቤ
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 말하였습니다
  - 이르렀습니다
  lexicon: 동사 어간
  rationale: 야곱이 라반에게 ‘말하다’의 서술로 자연스럽게 이어지므로 현대 합쇼체의 مستقیم한 ‘말했습니다’를 택했습니다.
- source_word: ሀበኒ
  english_pob_choice: Give me
  chosen_korean: 내게 주십시오
  alternatives_korean:
  - 나에게 주십시오
  - 제게 주십시오
  lexicon: 명령형 동사
  rationale: 요구를 분명히 드러내는 직접명령이므로 ‘주십시오’로 옮기고, 대상은 고정된 소유격을 살려 ‘내게’로 표현했습니다.
- source_word: ወውሉድየ
  english_pob_choice: and my children
  chosen_korean: 내 자녀들을
  alternatives_korean:
  - 내 아이들을
  - 내 자손들을
  lexicon: 가족/후손 표지
  rationale: 게에즈의 ‘children’을 문맥상 가족 단위의 직계 자녀로 보아 ‘자녀들’로 옮겼습니다.
- source_word: ወእግበር
  english_pob_choice: and I will make
  chosen_korean: 그리고 내가 만들겠습니다
  alternatives_korean:
  - 그리고 내가 하겠습니다
  - 그리고 내가 짓겠습니다
  lexicon: 동사 gabra
  rationale: 본문의 동사는 ‘돌아가다’가 아니라 ‘만들다/하다’의 의미이므로, 분절상 미완성된 느낌을 그대로 살려 직역적으로 처리했습니다.
theological_decisions:
- issue: 문장 말미의 미완성 동사 처리
  chosen_reading: “그리고 내가 만들겠습니다”로 남겨, 게에즈 절단 분절이 드러내는 불완전성을 보존했습니다.
  alternative_readings:
  - “그리고 내가 하겠습니다”로 일반화
  - “그리고 내가 돌아가겠습니다”로 매끄럽게 보정
  rationale: 검증 기록상 이 구절은 다음 분절의 보완을 기다리는 형태이므로, 의미를 과도하게 매끈하게 만들지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: source criticism / textual segmentation
