translation:
  language: ko
  text: 그리고 그들은 내 율법과 내 모든 계명과 내 모든 규례를 모두 잊어버리며, 초하루들에 대해 길을 벗어날 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕግየ
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 법
  - 내 규범
  lexicon: 율법
  rationale: Geez의 ሕግ은 여기서 하나님의 규범 전체를 가리키는 언약적 용례이므로, 한국어에서는 문맥상 가장 직접적인 ‘율법’이 적절합니다.
- source_word: ትእዛዝየ
  english_pob_choice: my commandments
  chosen_korean: 내 모든 계명
  alternatives_korean:
  - 내 명령들
  - 내 모든 명령
  lexicon: 계명
  rationale: 앞의 ‘율법’과 구별되는 개별적 요구들을 가리키므로, POB의 영어를 따라 ‘계명’으로 옮겼습니다.
- source_word: ፍትሕየ
  english_pob_choice: my judgments
  chosen_korean: 내 모든 규례
  alternatives_korean:
  - 내 판단들
  - 내 모든 판결
  lexicon: 규례
  rationale: 여기서는 법적 판결 자체보다 규정된 판례·판정의 성격이 강하므로, 한국어 성경 전통에서 널리 쓰는 ‘규례’가 가장 자연스럽습니다.
- source_word: ሠርቀ፡
  english_pob_choice: new moons
  chosen_korean: 초하루들
  alternatives_korean:
  - 새달들
  - 신월들
  lexicon: 초하루
  rationale: 영어 POB가 ‘new moons’로 읽은 달 시작일의 절기를, 한국어에서는 달 초의 절기라는 뜻이 분명한 ‘초하루들’로 옮겼습니다.
theological_decisions:
- issue: 절기 표현의 번역 범위
  chosen_reading: ‘초하루들’은 단순한 천문 현상이 아니라 달의 시작에 따른 예식적 날짜들을 가리키는 것으로 보아, 본문 흐름에서 율법·계명·규례와 병렬되는 절기 의무의 일부로 읽었습니다.
  alternative_readings:
  - ‘새달들’로 더 문자적으로 옮김
  - ‘초하루 절기들’로 풀어씀
  rationale: 문맥상 금지 대상은 시간표시가 아니라 예배 질서이므로, 의례적 의미를 살리되 과도한 설명은 넣지 않았습니다.
  doctrine_reference: 율법과 절기
