  source_fidelity: 핵심 어휘인 ‘마음의 포피’와 ‘거룩한 영’, 그리고 정결케 하심의 목적절은 원문 및 영어 POB의 검토 이력을 대체로 충실히 반영합니다. 다만 ‘제거하고’는 원문의 절단/할례 은유를 다소 약화하며, ‘나를 따라 돌아서지’는 한국어에서 수식 관계가 부자연스럽고 뜻이 불명확합니다.
