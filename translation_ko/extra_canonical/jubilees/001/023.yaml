translation:
  language: ko
  text: 내가 그들의 마음의 포피와 그들의 씨의 마음의 포피를 제거하고, 그들을 위해 거룩한 영을 창조하며, 그들이 그날부터 영원까지 나를 따라 돌아서지 않도록 그들을 깨끗하게 하겠습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ / ቍልፈተ፡ ልበ፡ ዘርኦሙ
  english_pob_choice: cut off the foreskin of their heart / the foreskin of the heart of their seed
  chosen_korean: 마음의 포피 / 그들의 씨의 마음의 포피
  alternatives_korean:
  - 마음의 덮개
  - 마음의 껍질
  - 마음의 무할례 상태
  lexicon: 포피
  rationale: 게에즈 본문은 완곡한 ‘덮개’보다 문자적으로 ‘포피/무할례’ 이미지를 가리키므로, 예언적·언약적 은유를 흐리지 않도록 ‘포피’를 택했습니다.
- source_word: እፈጥር፡ ሎሙ፡ መንፈሰ፡ ቅዱሰ
  english_pob_choice: I will create for them a holy spirit
  chosen_korean: 거룩한 영을 창조하며
  alternatives_korean:
  - 성령을 창조하며
  - 거룩한 영을 만드며
  - 거룩한 마음을 주며
  lexicon: 영
  rationale: 원문은 ‘holy spirit’로 되어 있어, 신약적 고유명사화된 ‘성령’보다 형용사-명사 결합을 살린 ‘거룩한 영’이 더 직접적입니다.
- source_word: እነጽሖሙ
  english_pob_choice: I will cleanse them
  chosen_korean: 그들을 깨끗하게 하겠습니다
  alternatives_korean:
  - 그들을 정결하게 하겠습니다
  - 그들을 씻어 깨끗하게 하겠습니다
  lexicon: 깨끗하게 하다
  rationale: 동사는 도덕적·의례적 정화를 함께 포괄하므로, 문맥을 과도하게 좁히지 않는 ‘깨끗하게 하다’로 옮겼습니다.
- source_word: ከመ፡ ኢይትመየጡ፡ እምድኅሬየ
  english_pob_choice: so that they do not turn away from following me
  chosen_korean: 그들이 그날부터 영원까지 나를 따라 돌아서지 않도록
  alternatives_korean:
  - 그들이 나를 떠나 돌아서지 않도록
  - 그들이 나에게서 돌아서지 않도록
  lexicon: 따라 돌아서다
  rationale: ‘뒤에서’라는 공간적 표현은 단순한 이탈보다 ‘따라가던 길에서 돌아섬’의 뉘앙스를 가지므로, POB의 audited revision을 반영해 ‘나를 따라 돌아서다’로 처리했습니다.
theological_decisions:
- issue: ‘holy spirit’의 표기
  chosen_reading: 거룩한 영
  alternative_readings:
  - 성령
  - 거룩한 마음
  rationale: 이 문맥은 성령의 위격을 명시하는 신약적 공식어라기보다, 하나님이 그들에게 주실 정결하고 새롭게 하는 영을 가리키는 구문이어서 ‘성령’으로 고정하지 않았습니다.
  doctrine_reference: extra-canonical Jubilees; lexical distinction between common ‘spirit’ and later canonical Spirit terminology
- issue: ‘from behind me’의 관용적 의미
  chosen_reading: 나를 따라 돌아서지 않도록
  alternative_readings:
  - 나에게서 돌아서지 않도록
  - 나를 떠나 돌아서지 않도록
  rationale: 게에즈 관용구는 제자도·추종 관계를 배경으로 하므로, 단순 거리 이탈이 아니라 ‘따라가던 길에서 돌아섬’의 의미를 드러내는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: biblical idiom of following/turning away
