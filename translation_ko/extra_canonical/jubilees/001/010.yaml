base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/010.yaml
  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: ko
  text: 그리고 많은 이들이 멸망하고, 붙잡혀 원수의 손에 넘어갈 것입니다. 이는 그들이 내 규례와 내 명령과 내 언약의 절기들과 내 안식일들과, 내가 그들 가운데에서 나를 위하여 거룩하게 한 내 거룩한 것들과, 내 이름을 그 위에 두기 위해 내가 그 땅 한가운데에서 나를 위하여 거룩하게 한 내 장막과 내 성소를 버렸기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐትየ
  english_pob_choice: my ordinances
  chosen_korean: 내 규례
  alternatives_korean:
  - 내 명령
  - 내 법도
  lexicon: 규례
  rationale: Geez의 규범·질서 계열 표현을 한국어 성경어에서 가장 자연스럽게 대응시키되, 뒤의 ‘명령’과 구별되도록 했습니다.
- source_word: ትእዛዝየ
  english_pob_choice: my commandments
  chosen_korean: 내 명령
  alternatives_korean:
  - 내 계명
  - 내 규정
  lexicon: 명령
  rationale: 앞의 규례와 병렬되는 보다 직접적인 지시를 살리기 위해 ‘명령’으로 옮겼습니다.
- source_word: በዓላት፡ ኪዳንየ
  english_pob_choice: the festivals of my covenant
  chosen_korean: 내 언약의 절기들
  alternatives_korean:
  - 내 언약의 축제들
  - 언약의 명절들
  lexicon: 절기
  rationale: 문맥상 특정한 종교 절기를 가리키므로 ‘절기들’이 가장 직접적이며, ‘언약’과의 결합도 유지했습니다.
- source_word: ወቅድሳትየ
  english_pob_choice: my holy things
  chosen_korean: 내 거룩한 것들
  alternatives_korean:
  - 내 성물들
  - 내 성스러운 것들
  lexicon: 거룩하다
  rationale: 지시 대상이 포괄적이므로 좁은 제의용어인 ‘성물’보다 원문 범위를 넓게 반영하는 ‘거룩한 것들’로 옮겼습니다.
- source_word: ደብተራየ፡ ወመቅደስየ
  english_pob_choice: my tabernacle and my sanctuary
  chosen_korean: 내 장막과 내 성소
  alternatives_korean:
  - 내 성막과 내 성소
  - 내 장막과 내 성전
  lexicon: 장막
  rationale: ‘tabernacle’은 이동식 성소를 가리키는 기본 의미를 살려 ‘장막’으로 옮기고, 병렬되는 ‘sanctuary’는 일반적인 ‘성소’로 대응했습니다.
theological_decisions:
- issue: 하나님의 이름을 두는 목적절
  chosen_reading: ‘내가 내 이름을 그 위에 두려는 것이었습니다’로, 단순 소유가 아니라 현존·표지의 의미를 유지했습니다.
  alternative_readings:
  - 그 위에 내 이름을 두겠습니다
  - 내 이름을 그 위에 두게 하려는 것이었습니다
  rationale: 게즈 원문의 목적절은 성소를 하나님의 이름이 머무는 표지로 세우는 언약적 의미를 담으므로, 목적성을 분명히 드러냈습니다.
  doctrine_reference: 성전/성막의 신적 임재와 이름-현존 모티프
