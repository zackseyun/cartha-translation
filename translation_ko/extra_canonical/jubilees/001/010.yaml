  to: 그리고 많은 이들이 멸망하고, 붙잡혀 원수의 손에 넘어갈 것입니다. 이는 그들이 내 규례와 내 명령과 내 언약의 절기들과 내 안식일들과, 내가 그들 가운데에서 나를 위하여 거룩하게 한 내 거룩한 것들과, 내 이름을 그 위에 두기 위해 내가 그 땅 한가운데에서 나를 위하여 거룩하게 한 내 장막과 내 성소를 버렸기 때문입니다.
