translation:
  language: ko
  text: 내 눈앞에서입니다. 내가 그들로부터 내 얼굴을 숨기고, 그들을 나라들의 손에 넘겨 포로와 약탈과 삼킴이 되게 하며, 그들을 땅 한가운데에서 뽑아내고, 그들을 나라들 가운데에 흩어 버리겠습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አኀብእ፡" ገጽየ፡ እምኔሆሙ
  english_pob_choice: I will hide my face from them
  chosen_korean: 내 얼굴을 숨기고
  alternatives_korean:
  - 내 얼굴을 가리고
  - 그들 앞에서 내 얼굴을 감추고
  lexicon: face = 얼굴 / hide = 숨기다
  rationale: 하나님의 임재와 호의를 거두는 관용적 표현을 직역에 가깝게 살리되, 현대 한국어에서 자연스러운 ‘숨기다’로 옮겼습니다.
- source_word: ውስተ፡ እደ፡" አሕዛብ፡
  english_pob_choice: into the hand of the nations
  chosen_korean: 나라들의 손에 넘겨
  alternatives_korean:
  - 민족들의 손에 넘겨
  - 열방의 손에 넘겨
  lexicon: hand = 손 / nations = 나라들
  rationale: ‘손에 넘기다’는 히브리적 수동/지배 관용을 그대로 드러내며, ἔθνη 계열을 한국어 ‘나라들’로 옮겨 포괄성을 유지했습니다.
- source_word: ለፂዋዌ፡ ወለኀብለ፡ ወለተበልዖ፡
  english_pob_choice: for captivity and for plunder and for devouring
  chosen_korean: 포로와 약탈과 삼킴이 되게
  alternatives_korean:
  - 포로와 노략과 먹힘이 되게
  - 포로와 노략질과 멸망이 되게
  lexicon: captivity / plunder / devouring = 포로 / 약탈 / 삼킴
  rationale: 세 항목의 병렬을 살리면서, ‘devouring’의 파괴적 이미지는 의미를 과도하게 완화하지 않도록 ‘삼킴’으로 옮겼습니다.
- source_word: ወ*አቤስሎሙ፡" እማእከለ፡" ምድር፡
  english_pob_choice: and I will uproot them from the midst of the land
  chosen_korean: 그들을 땅 한가운데에서 뽑아내고
  alternatives_korean:
  - 그들을 땅 한가운데에서 제거하고
  - 그들을 땅 한가운데에서 뿌리째 뽑아내고
  lexicon: uproot = 뽑아내다
  rationale: 개정된 audit가 강조하듯 동사는 단순한 ‘제거’보다 뿌리 뽑는 심판의 강도를 지니므로, 직접적이고 과격한 농경적 이미지를 살렸습니다.
theological_decisions:
- issue: 심판 언어의 강도와 직설성
  chosen_reading: ‘얼굴을 숨기다’, ‘나라들의 손에 넘기다’, ‘뽑아내다’ 같은 직설적 심판 표현을 완화하지 않았습니다.
  alternative_readings:
  - 더 완곡한 ‘외면하다’, ‘넘겨주다’, ‘제거하다’
  rationale: 원문은 하나님의 의도적 철수와 이스라엘에 대한 징계를 강하게 표현하므로, 독자가 그 경고의 무게를 그대로 이해하도록 직설적 어휘를 유지했습니다.
  doctrine_reference: 언약적 심판과 추방의 경고
