revisions:
- from: 오늘, 시내 산에서 그들의 세대를 위하여. 그리고 이렇게 될 것입니다. 이 모든 일이 그들에게 임할 때, 그들은 내가 그들의 모든 판결과 모든 행위에서 그들보다 더 의롭다는 것을 알게 될 것입니다.[a]
  to: 오늘 시내 산에서, 그들의 세대를 위하여—그리고 그리될 것입니다. 이 모든 일이 그들에게 임할 때, 그들은 내가 그들의 모든 판단과 모든 행위에 있어서 그들보다 더 의롭다는 것을 알게 될 것입니다.[a]
  rationale: 원문의 ‘오늘’을 보존하고, 절 분할로 인해 앞 문맥에 의존하는 첫 구절은 대시로 이어짐을 표시했습니다. ‘판결’을 더 넓고 자연스러운 ‘판단’으로 조정했으며, 누락된 [a] 대응 각주를 보완했습니다. 비교급 ‘그들보다 더 의롭다’와 심판·행위의 범위는 유지했습니다.
  reviewer_model: gpt-5.6-terra
