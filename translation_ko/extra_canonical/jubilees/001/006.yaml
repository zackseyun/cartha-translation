translation:
  language: ko
  text: 오늘 시내 산에서, 그들의 세대를 위하여—그리고 그리될 것입니다. 이 모든 일이 그들에게 임할 때, 그들은 내가 그들의 모든 판단과 모든 행위에 있어서 그들보다 더 의롭다는 것을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시내 산에서 그들의 세대를 위하여.”
    reason: 영어 POB 감사 이력에 보존된 이전 번역에 따른 대안적 구절 경계/어순을 제시하며, 본문의 각주 앵커에 대응합니다.
lexical_decisions:
- source_word: ዮም
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 그날에
  - 지금
  lexicon: 없음
  rationale: 게에즈 원문의 ዮም은 ‘오늘’이라는 시간 부사이므로, 생략하지 않고 가장 직접적으로 옮겼습니다.
- source_word: ለትውልዶሙ
  english_pob_choice: for their generations
  chosen_korean: 그들의 세대를 위하여
  alternatives_korean:
