translation:
  language: ko
  text: 오늘, 시내 산에서 그들의 세대를 위하여. 그리고 이렇게 될 것입니다. 이 모든 일이 그들에게 임할 때, 그들은 내가 그들의 모든 판결과 모든 행위에서 그들보다 더 의롭다는 것을 알게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዮም
  english_pob_choice: today
  chosen_korean: 오늘
  alternatives_korean:
  - 그날에
  - 지금
  lexicon: 없음
  rationale: 게에즈 원문의 ዮም은 ‘오늘’이라는 시간 부사이므로, 생략하지 않고 가장 직접적으로 옮겼습니다.
- source_word: ለትውልዶሙ
  english_pob_choice: for their generations
  chosen_korean: 그들의 세대를 위하여
  alternatives_korean:
  - 그 세대들을 위하여
  - 그들의 대대로
  lexicon: 없음
  rationale: 세대의 연속성을 나타내는 표현으로, 문맥상 단순한 ‘세대들’보다 목적격의 ‘위하여’가 원문의 방향성을 잘 살립니다.
- source_word: ደብረ፡ ሲና
  english_pob_choice: Mount Sinai
  chosen_korean: 시내 산
  alternatives_korean:
  - 시나 산
  - 시내산
  lexicon: 없음
  rationale: 성경 지명으로 널리 알려진 표준형 ‘시내 산’을 사용해 가독성과 식별성을 확보했습니다.
- source_word: ጻድቅ
  english_pob_choice: more righteous
  chosen_korean: 더 의롭다는
  alternatives_korean:
  - 더 공의롭다는
  - 더 바르다는
  lexicon: 없음
  rationale: 비교급의 핵심은 도덕적·언약적 정당성을 나타내는 ‘의롭다’이므로, 영어 POB의 ‘more righteous’에 맞춰 직역했습니다.
theological_decisions:
- issue: 하나님이 자신을 ‘그들보다 더 의롭다’고 말하는 비교 표현
  chosen_reading: 비교급을 완화하지 않고 그대로 옮겨, 판결과 행위의 영역에서 상대적 의로움이 드러난다는 의미를 살렸습니다.
  alternative_readings:
  - ‘더 올바르다’로 완화
  - ‘더 정당하다’로 재해석
  rationale: 본문은 도덕적 우열을 완곡하게 줄이기보다, 심판과 행위 전체에 대한 하나님의 정당성을 선명하게 드러냅니다.
  doctrine_reference: 하나님의 공의와 언약적 심판
