  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: ko
  text: 그 달의 열여섯째 날에 야훼께서 모세에게 말씀하셨습니다. "산으로 내게 올라오너라. 그러면 내가 네게 율법과 계명에 관한 두 돌판을 주겠다. 이는 내가 기록한 것이니, 네가 그것들을 가르치게 하려는 것이다." 그러자 모세는 야훼의 산으로 올라갔고, 야훼의 영광이 시내 산에 머물렀습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር / English 'Yahweh'
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: POB의 하나님의 이름 정책에 따라 영어 본문이 Yahweh인 곳은 한국어 본문에서도 야훼로 직접 옮겨 원문 고유명칭을 보존했습니다.
- source_word: ደብር / English 'the mountain'
  english_pob_choice: the mountain
  chosen_korean: 산
  alternatives_korean:
  - 그 산
  - 산 위
  lexicon: ג/ορος 해당 일반 명사
  rationale: 히브리어·게즈 문맥에서 특정한 계시의 산을 가리키지만, 한국어에서는 불필요한 반복을 피하고 자연스럽게 '산'으로 옮겼습니다.
- source_word: ጽላተ እብን / English 'two stone tablets'
  english_pob_choice: two stone tablets
  chosen_korean: 두 돌판
  alternatives_korean:
  - 두 석판
  - 돌로 된 두 판
  lexicon: לוחות אבן
  rationale: '''돌판''은 문자적으로 간결하면서도 계명판이라는 기능을 잘 드러내며, ''석판''보다 현대 한국어에서 더 자연스럽습니다.'
- source_word: ሕግ ወዘትእዛዝ / English 'the law and the commandment'
  english_pob_choice: the law and the commandment
  chosen_korean: 율법과 계명
  alternatives_korean:
  - 법과 명령
  - 율법과 명령
  lexicon: תורה / מצוה
  rationale: POB의 대응을 따라 'law'는 율법, 'commandment'는 계명으로 구분해 본문의 이중 표현을 살렸습니다.
- source_word: ዘመጠነ ጸሐፍኩ / English 'which I have written'
  english_pob_choice: which I have written
  chosen_korean: 내가 기록한 것
  alternatives_korean:
  - 내가 쓴 것
  - 내가 기록해 둔 것
  lexicon: כתב
  rationale: 돌판의 권위와 공적 성격을 살리기 위해 단순한 '썼다'보다 '기록하다'를 선택했습니다.
- source_word: ታስብዎሙ / English 'so that you may teach them'
  english_pob_choice: so that you may teach them
  chosen_korean: 네가 그것들을 가르치게 하려는 것이다
  alternatives_korean:
  - 네가 그것들을 가르치도록 하기 위함이다
  - 네가 그것들을 그들에게 알리게 하려는 것이다
  lexicon: ידע/למד 계열
  rationale: 말미의 목적절을 한국어로 분명하게 살려, 모세가 받은 돌판의 교육적 목적을 드러냈습니다.
- source_word: ወኀደረ / English 'dwelt'
  english_pob_choice: dwelt
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 거하셨습니다
  - 임하셨습니다
  lexicon: שכן/ישב
  rationale: 영광이 산에 '거했다'는 표현을 현대 한국어로 자연스럽게 옮기되, 일시적 임재보다 지속적 머묾을 나타내기 위해 '머물렀습니다'를 택했습니다.
theological_decisions:
- issue: 야훼의 산과 시내 산의 관계
  chosen_reading: 본문의 '야훼의 산'과 '시내 산'은 같은 산에 대한 병행 표현으로 보아, 두 표현을 모두 유지했습니다.
  alternative_readings:
  - '''야훼의 산''을 일반적 수식어로만 보고 ''시내 산''을 본명칭으로만 처리'
  - 둘 중 하나를 삭제해 중복을 줄임
  rationale: 게즈 본문이 두 표현을 모두 사용하므로, 서술의 중복처럼 보이더라도 계시 산의 신학적 강조를 보존하는 쪽이 더 원문 충실합니다.
  doctrine_reference: 출애굽기 19–24장의 시내산 계시 전통
