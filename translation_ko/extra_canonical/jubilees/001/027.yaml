  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: ko
  text: 그가 말씀하시기를, “현현의 천사에게 기록하라. 창조의 시작부터 내 성소가 그들 가운데 세워질 때까지 영원무궁하도록, 그리고 주께서 모든 사람의 눈에 나타나실 때까지를 모세를 위하여 기록하라.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለመልአከ፡ ገጽ
  english_pob_choice: the angel of the presence
  chosen_korean: 현현의 천사
  alternatives_korean:
  - 임재의 천사
  - 얼굴의 천사
  lexicon: 명사구
  rationale: Ge'ez 표현은 하나님의 임재/현현을 가리키는 관용구이므로, 문맥상 의미를 드러내는 ‘현현의 천사’로 옮겼습니다.
- source_word: ጸሐፍ፡ ለሙሴ፡
  english_pob_choice: Write for Moses
  chosen_korean: 모세를 위하여 기록하라
  alternatives_korean:
  - 모세를 위해 써라
  - 모세에게 기록하라
  lexicon: 동사구
  rationale: 명령형의 직접성과 수신자를 살리되, 메시아적 예언 기록의 기능을 드러내기 위해 ‘기록하라’로 옮겼습니다.
- source_word: መቅደስየ፡
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 나의 성소
  lexicon: 명사구
  rationale: 소유격이 분명하므로 ‘내’로 유지했고, 성전보다 넓은 성소 개념이 원문에 더 가깝다고 보았습니다.
- source_word: ዓለመ፡ ዓለማት
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁하도록
  alternatives_korean:
  - 영원히 또 영원히
  - 세세토록
  lexicon: 부사구
  rationale: 중첩된 세대/시대 표현을 한국어의 관용적 강조로 반영하되, 과도하게 해석하지 않도록 ‘영원무궁하도록’으로 처리했습니다.
- source_word: ወያስተርኢ፡ እግዚአብሔር፡ ለዐይን፡ ኵሉ፡
  english_pob_choice: and the Lord will appear to the eyes of all
  chosen_korean: 주께서 모든 사람의 눈에 나타나실 때까지
  alternatives_korean:
  - 주께서 모든 이의 눈에 보이실 때까지
  - 주께서 모든 사람에게 나타나실 때까지
  lexicon: 동사구
  rationale: ‘눈에’라는 직역적 요소를 유지하면서, 자연스러운 한국어 문장으로 ‘모든 사람의 눈에 나타나실’로 정리했습니다.
theological_decisions:
- issue: 하나님의 자기지칭과 주(κύριος) 표현의 구별
  chosen_reading: 문맥상 하나님을 가리키는 주는 ‘주’로 유지하되, 본문 전체는 창조주와 성소, 종말적 현현을 함께 말하는 예언적 문맥으로 읽었습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 이 단편의 게'즈 본문에는 야훼 표지가 직접 없고, 영어 POB도 단순히 Lord로 제시하므로 본문 표면을 과잉 특정하지 않았습니다.
  doctrine_reference: 본문비평/역사적 문맥
