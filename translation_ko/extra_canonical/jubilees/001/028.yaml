  to: 그리고 모든 사람이 내가 이스라엘의 하나님이며 야곱의 모든 자녀의 아버지이고, 시온 산에서 영원히 다스리는 왕임을 알게 될 것입니다. 또 시온과 예루살렘은 거룩할 것입니다.
