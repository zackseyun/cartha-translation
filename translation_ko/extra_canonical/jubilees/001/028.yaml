  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: ko
  text: 그리고 모든 사람이 내가 이스라엘의 하나님이며 야곱의 모든 자녀의 아버지이고, 시온 산에서 영원히 다스리는 왕임을 알게 될 것입니다. 또 시온과 예루살렘은 거룩할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ ... አነ ... አምላከ እስራኤል
  english_pob_choice: I am the God of Israel
  chosen_korean: 내가 이스라엘의 하나님임을
  alternatives_korean:
  - 내가 이스라엘의 하나님이라는 것을
  - 내가 이스라엘의 하나님임을
  lexicon: 하나님
  rationale: Ge'ez의 ‘아람/이스라엘의 하나님’ 자기선언을 자연스럽게 살리기 위해 ‘하나님’으로 옮기고, 목적절 형태로 ‘임을’로 마무리해 문장 흐름을 유지했습니다.
- source_word: አብ ለኵሎሙ ደቂቀ ያዕቆብ
  english_pob_choice: the Father of all the children of Jacob
  chosen_korean: 야곱의 모든 자녀의 아버지이고
  alternatives_korean:
  - 야곱의 모든 자녀의 아버지이며
  - 야곱의 모든 자녀의 아버지이고
  lexicon: 아버지
  rationale: 영어 POB의 직역 구조를 따라 ‘모든 자녀’의 소유관계를 분명히 하되, 병렬 종결을 위해 ‘이고’를 사용했습니다.
- source_word: ወንጉሥ በደብረ ጽዮን ለዓለመ ዓለም
  english_pob_choice: king on Mount Zion forever
  chosen_korean: 시온 산 위에서 영원히 다스리는 왕임을
  alternatives_korean:
  - 시온 산에서 영원한 왕임을
  - 시온 산 위에서 영원히 다스리는 왕임을
  lexicon: 왕
  rationale: 단순한 호칭보다 통치 행위를 드러내는 ‘다스리는 왕’이 원문의 지속적 왕권을 더 잘 전달하므로 이렇게 옮겼습니다.
- source_word: ቅድስት
  english_pob_choice: holy
  chosen_korean: 거룩할 것입니다
  alternatives_korean:
  - 거룩할 것입니다
  - 거룩하게 될 것입니다
  lexicon: 거룩하다
  rationale: 시온과 예루살렘의 상태를 예언적으로 진술하는 형식이어서, 한국어에서는 상태 서술인 ‘거룩할 것입니다’가 가장 자연스럽습니다.
theological_decisions:
- issue: 시온과 예루살렘의 최종 상태 진술
  chosen_reading: ‘시온과 예루살렘은 거룩할 것입니다’로 미래적 종말 진술을 유지했습니다.
  alternative_readings:
  - ‘시온과 예루살렘은 거룩합니다’
  - ‘시온과 예루살렘이 거룩해질 것입니다’
  rationale: Ge'ez와 영어 POB 모두 미래형/예언적 진술로 읽히므로, 현재형이나 과정형보다 종결된 미래 진술을 택했습니다.
  doctrine_reference: 예언의 성취와 거룩한 도성의 종말론적 정결
- issue: ‘king on Mount Zion’의 의미
  chosen_reading: ‘시온 산 위에서 영원히 다스리는 왕’으로 왕권의 지속성과 장소성을 함께 살렸습니다.
  alternative_readings:
  - ‘시온 산의 왕’
  - ‘시온 산 위의 왕’
  rationale: 문맥상 단순 지위 명칭보다 하나님의 지속적 통치를 강조하므로, ‘다스리는’으로 왕권의 행위를 분명히 했습니다.
  doctrine_reference: 하나님의 왕권과 시온 신학
