  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: ko
  text: 그리고 내가 그들에게 증인들을 보내 그들에게 증언하게 하겠지만, 그들은 듣지 않을 것입니다. 또한 그들은 증인들을 죽일 것이며, 율법을 찾는 이들을 쫓아내고, 모든 것을 뒤엎으며 악을 행하기 시작할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕተ
  english_pob_choice: witnesses
  chosen_korean: 증인들
  alternatives_korean:
  - 증언자들
  - 증거인들
  lexicon: Geʿez ሰማዕተ
  rationale: 법정·증언의 뉘앙스를 살려 ‘증인들’로 옮겼습니다. 문맥상 하나님이 보내는 이들은 단순한 목격자가 아니라 증언하는 자들입니다.
- source_word: ከመ፡ አስምዕ፡ ሎሙ
  english_pob_choice: so that I may testify to them
  chosen_korean: 그들에게 증언하게 하겠지만
  alternatives_korean:
  - 그들에게 증언하도록 하겠지만
  - 그들에게 증언하려 하겠지만
  lexicon: Geʿez አስምዕ
  rationale: 목적/의도 구조를 한국어 자연문으로 풀어, 보내는 목적이 ‘증언’에 있음을 분명히 했습니다.
- source_word: ሕገ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 교훈
  lexicon: Geʿez ሕግ
  rationale: 여기서는 일반 법칙이 아니라 하나님의 규범으로서의 율법을 가리키므로 ‘율법’이 가장 직접적입니다.
- source_word: ይዌልእ
  english_pob_choice: turn over / overturn everything
  chosen_korean: 모든 것을 뒤엎으며
  alternatives_korean:
  - 모든 것을 전복하며
  - 모든 것을 엎어버리며
  lexicon: Geʿez ወለዐ / ይዌልእ
  rationale: 전면적 파괴·전복의 동사를 살리기 위해 ‘뒤엎다’를 택했고, 문맥상 현재 진행의 열거로 연결했습니다.
theological_decisions:
- issue: ‘증인들’을 보내는 행위의 의미
  chosen_reading: 하나님이 먼저 증인을 보내 심판 이전에 증언을 주시는 구조로 읽었습니다.
  alternative_readings:
  - 단순한 예언자 파송의 일반 진술로 읽는 해석
  - 법정적 증언보다 교훈 전달로 약화해 읽는 해석
  rationale: 본문은 ‘보내다’와 ‘증언하다’가 결합되어 있어, 단순 통지가 아니라 책임 있는 증거 제시와 거절의 책임을 강조합니다.
  doctrine_reference: 예언자적 증언과 거절의 책임
