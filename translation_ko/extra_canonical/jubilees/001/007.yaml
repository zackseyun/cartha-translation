revisions:
- from: 그들이 내가 그들과 함께 있었다는 것을 알게 될 것입니다. 그리고 당신은 오늘 내가 당신에게 알게 하는 모든 말을 자신을 위해 기록하십시오. 이는 내가 그들의 반역과 그들의 목 뻣뻣함을 알기 때문입니다. 내가 그들의 조상들—아브라함과 이삭과 야곱—에게 맹세한 땅으로 그들을 데려가기 전에, 곧 내가 “네 씨에게는 젖과 꿀이 흐르는 그 땅을 주겠다”라고 말한 그 땅으로 말입니다. 그리고 그들은 먹고 배부를 것입니다.[a]
