base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: ko
  text: 그리고 현현의 천사가, 이스라엘 진영 앞에 나아가던 그가, 창조 때부터의 해의 구분표, 곧 율법과 증언의 기록과 그 희년들의 주간들을 적은 판들을 가져갔습니다. 그것들은 모든 수에 따라 해마다, 그리고 희년들도 해마다, 창조의 날부터 하늘과 땅과 그 모든 피조물이 하늘의 권능에 따라, 그리고 땅의 모든 창조물에 따라 새롭게 될 그 날까지였습니다. 그때에는 야훼의 성소가 예루살렘 시온 산에 세워지고, 모든 빛이 치유와 평강과 복을 위하여 이스라엘의 모든 택하신 자들을 위해 새롭게 될 것입니다. 그리고 그 일이 그 날부터 땅의 모든 날 동안 그렇게 있을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ ገጽ
  english_pob_choice: the angel of the presence
  chosen_korean: 현현의 천사
  alternatives_korean:
  - 임재의 천사
  - 얼굴의 천사
  - 주 앞에 선 천사
  lexicon: 현현
  rationale: Geez 표현은 하나님의 임재를 드러내는 천상 존재를 가리키므로, 한국어로는 의미를 살린 ‘현현’이 가장 직접적입니다.
- source_word: ጸላተ ዘክፋሌ ዓመታት
  english_pob_choice: the divisions of the years
  chosen_korean: 해의 구분표
  alternatives_korean:
  - 연대의 구분
  - 해들의 분할
  - 연수의 구분표
  lexicon: 구분
  rationale: 문맥상 연도의 분배와 배열을 적은 표/기록의 뜻이므로, 단순한 ‘분할’보다 기록물 느낌이 드러나는 ‘구분표’로 옮겼습니다.
- source_word: ሕገ ወለስምዕ
  english_pob_choice: of the law and of the testimony
  chosen_korean: 율법과 증언의 기록
  alternatives_korean:
  - 율법과 증거
  - 법과 증언
  - 율법과 증거의 판
  lexicon: 율법, 증언
  rationale: 두 명사 모두 판에 새겨진 내용으로 이해되므로, 한국어에서는 뒤에 ‘기록’을 보태어 앞뒤 관계를 자연스럽게 드러냈습니다.
- source_word: መቅደሰ እግዚአብሔር
  english_pob_choice: the sanctuary of Yahweh
  chosen_korean: 야훼의 성소
  alternatives_korean:
  - 야훼의 성전
  - 주님의 성소
  - 여호와의 성소
  lexicon: 야훼, 성소
  rationale: POB의 신명 표준을 따라 ‘야훼’를 유지했고, 성전 건물보다 거룩한 구별의 공간을 더 정확히 드러내는 ‘성소’를 선택했습니다.
- source_word: ብርሃናት
  english_pob_choice: all the lights
  chosen_korean: 모든 빛
  alternatives_korean:
  - 모든 광명
  - 모든 등불
  - 모든 빛들
  lexicon: 빛
  rationale: 복수성을 과장하지 않으면서도 천체적 광명 전체를 가리키는 뜻을 살리기 위해 한국어에서는 집합적 표현 ‘모든 빛’을 사용했습니다.
theological_decisions:
- issue: 하늘과 땅과 모든 피조물이 ‘새롭게 될 것’의 의미
  chosen_reading: 본문은 단순한 재배열이 아니라 종말론적 갱신을 말하므로 ‘새롭게 될 것입니다’로 옮겼습니다.
  alternative_readings:
  - 다시 만들어질 것입니다
  - 회복될 것입니다
  - 갱신될 것입니다
  rationale: Geez와 영어 모두 renewal의 의미를 담고 있어, 창조의 종말적 갱신이라는 신학적 긴장을 유지해야 합니다.
  doctrine_reference: 종말론적 새 창조
- issue: ‘하나님’ 대신 ‘야훼’ 사용
  chosen_reading: 예루살렘 시온 산에 세워질 성소의 주체를 POB 정책에 따라 ‘야훼’로 표기했습니다.
  alternative_readings:
  - 주님
  - 여호와
  - 하나님
  rationale: 영어 POB가 Yahweh를 채택했고, 본문이 직간접적으로 신명을 가리키므로 원문-대응성을 위해 야훼를 유지합니다.
  doctrine_reference: 신명 표기 정책
