  source_fidelity: 수정이 필요합니다. 게에즈어 አየድዐከ는 진행 중인 계시를 나타내므로, 초안의 완료형 ‘알려 준’은 원문의 상을 약화합니다. 또한 ‘모든 세세대’는 ‘모든 시대의 영원’을 자연스럽게 옮기지 못합니다. 시간 구분에 관한 난해한 열거는 과도하게 해석하지 않고 원문의 병렬성과 다소의 모호성을 보존해야 합니다.
