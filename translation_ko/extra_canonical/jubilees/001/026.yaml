base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
  footnotes:
  - marker: a
    text: Or 'I have made known'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 산에서 너에게 내가 알려 준 이 모든 것을, 곧 무엇이 처음이고 무엇이 마지막이며 무엇이 올 것인지를, 율법과 증언과 그들의 희년 주간들 안에 있는 모든 날의 구분들에 따라, 영원히, 내가 내려가 그들과 함께 모든 세세대에 걸쳐 거주할 때까지, 너를 위해 기록하겠습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እጽሐፍ
  english_pob_choice: I will write down
  chosen_korean: 기록하겠습니다
  alternatives_korean:
  - 적겠습니다
  - 써 두겠습니다
  lexicon: Geez እጽሐፍ
  rationale: 문맥상 단순한 ‘쓰기’보다 신탁 내용을 보존해 전하는 뉘앙스가 있어, 합쇼체에서 자연스러운 ‘기록하겠습니다’를 택했습니다.
- source_word: አየድዐከ / I am making known
  english_pob_choice: I am making known
  chosen_korean: 내가 알려 준
  alternatives_korean:
  - 내가 알리고 있는
  - 내가 알리겠습니다
  lexicon: Geez አየድዐከ
  rationale: 영어 본문이 현재 진행형/지속적 공개를 반영하므로, 한국어에서는 이미 산 위에서 ‘알려 준’ 것으로 풀어 현재적 계시의 완료-지속성을 함께 살렸습니다.
- source_word: ዘቀዳሚ ወዘደኃሪ
  english_pob_choice: what is first and what is last
  chosen_korean: 무엇이 처음이고 무엇이 마지막이며
  alternatives_korean:
  - 처음과 마지막이 무엇인지
  - 먼저인 것과 나중인 것
  lexicon: Geez ዘቀዳሚ ወዘደኃሪ
  rationale: 대조 구조를 그대로 살려 ‘처음/마지막’을 직역에 가깝게 옮겼습니다.
- source_word: በኵሉ፡ ዙፋቤ፡ መዋዕል፡ ዘበሕግ፡ ወዘበስምዕ፡ ወበሱባዔሆሙ፡ ለኢዮቤሌዎን
  english_pob_choice: in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees
  chosen_korean: 율법과 증언과 그들의 희년 주간들 안에 있는 모든 날의 구분들에 따라
  alternatives_korean:
  - 율법과 증언과 그들의 희년 주간들의 모든 날의 구분 속에서
  - 율법과 증언과 희년들의 주간들에 속한 모든 날의 구분에 따라
  lexicon: Geez ዙፋቤ / መዋዕል / ሕግ / ስምዕ / ሱባዔ
  rationale: 열거 구조를 보존하면서 ‘분할/구분들’의 의미를 살려, 단순한 시간표가 아니라 정해진 질서 안의 구획들을 드러내는 표현으로 옮겼습니다.
- source_word: እስከ፡ ሶበ፡ እወርድ፡ ወእኀድር፡ ምስሌሆሙ
  english_pob_choice: until I descend and dwell with them
  chosen_korean: 내가 내려가 그들과 함께 거주할 때까지
  alternatives_korean:
  - 내가 내려와 그들과 함께 살 때까지
  - 내가 내려가 그들과 함께 머물 때까지
  lexicon: Geez እወርድ / እኀድር
  rationale: ‘거주하다’는 임시 체류보다 지속적 동거의 뜻을 더 분명히 드러내며, 영원한 종말론적 임재를 잘 반영합니다.
theological_decisions:
- issue: ‘내려가 그들과 함께 거주한다’는 표현의 종말론적 임재
  chosen_reading: 하나님의 최종적 임재를 가리키는 표현으로 이해해, ‘거주할 때까지’로 직역에 가깝게 보존했습니다.
  alternative_readings:
  - 비유적 언어로 완화하여 ‘함께 지낼 때까지’로 옮기는 읽기
  - 성막/성전적 임재만 가리킨다고 좁히는 읽기
  rationale: 본문은 산 위의 계시가 역사 종말까지 이어진다는 점을 강조하므로, 임재의 종결적·우주적 범위를 약화시키지 않도록 했습니다.
  doctrine_reference: 종말론적 임재와 언약적 동거
- issue: ‘율법과 증언’의 이중 표지
  chosen_reading: 두 표현을 나란히 유지해 계시의 규범성과 증거성을 함께 드러냈습니다.
  alternative_readings:
  - 둘을 하나의 관용구로 묶어 단순화하는 읽기
  - ‘증언’을 다른 설명어로 바꾸는 읽기
  rationale: 저자는 서로 다른 두 계시 범주를 병렬로 두고 있어, 한국어에서도 긴장을 보존하는 것이 타당합니다.
  doctrine_reference: 계시의 규범성과 증언성
