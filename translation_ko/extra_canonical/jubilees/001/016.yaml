  text: with all my heart and with all my soul. And they will be for a blessing and not for a curse, and they will be the head and not the tail. And I will build my sanctuary in their midst, and I will dwell with them,
translation:
  language: ko
  text: 온 마음과 온 영으로. 그러면 그들은 복이 되고 저주가 되지 않을 것이며, 머리가 되고 꼬리가 되지 않을 것입니다. 또 내가 그들 가운데 내 성소를 세우고, 그들과 함께 거하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሉ፡ ልብየ፡ ወበኵሉ፡ ነፍስየ፡
  english_pob_choice: with all my heart and with all my soul
  chosen_korean: 온 마음과 온 영으로
  alternatives_korean:
  - 온 마음과 온 목숨으로
  - 온 마음과 온 혼으로
  lexicon: ልብየ=마음, ነፍስየ=영/목숨
  rationale: POB의 ‘heart/soul’ 대응을 살리되, ነፍስየ를 단순한 ‘혼’보다 본문이 요구하는 생명적 내적 존재로 읽어 ‘영’으로 옮겼습니다.
- source_word: ለበረከት፡ ወአኮ፡ ለመርገም፡
  english_pob_choice: for a blessing and not for a curse
  chosen_korean: 복이 되고 저주가 되지 않을 것이며
  alternatives_korean:
  - 복이 되고 저주가 아니며
  - 축복이 되고 저주가 되지 않을 것이며
  lexicon: በረከት=복/축복, መርገም=저주
  rationale: 본문의 대조를 자연스럽게 살리면서, POB의 blessing/curse 대비를 한국어에서도 분명하게 유지했습니다.
- source_word: ርእሰ፡ ወአኮ፡ ዘነበ።
  english_pob_choice: the head and not the tail
  chosen_korean: 머리가 되고 꼬리가 되지 않을 것입니다
  alternatives_korean:
  - 머리가 되고 꼬리가 아니며
  - 머리요 꼬리가 아니게 되며
  lexicon: ርእሰ=머리, ዘነበ=꼬리
  rationale: 관용적 대비 표현을 직역에 가깝게 유지해, 지배/우선의 의미가 약화되지 않도록 했습니다.
- source_word: መቅደስየ
  english_pob_choice: my sanctuary
  chosen_korean: 내 성소
  alternatives_korean:
  - 내 성전
  - 내 거룩한 처소
  lexicon: መቅደስ=성소/성전
  rationale: 후속 문맥의 ‘가운데’와 함께 거하심을 고려할 때, 건물로만 좁아지지 않는 ‘성소’가 가장 무난한 대응입니다.
theological_decisions:
- issue: 하나님이 ‘그들과 함께 거하겠다’는 표현의 직접성
  chosen_reading: “그들과 함께 거하겠습니다”로 미래 의지를 분명히 드러냈습니다.
  alternative_readings:
  - 그들과 함께 거하리라
  - 그들 가운데 거하시겠다
  rationale: 예언/서약적 미래를 한국어에서 자연스럽게 표현하면서도, 원문의 직접적 약속성을 유지했습니다.
  doctrine_reference: 언약적 임재의 약속
