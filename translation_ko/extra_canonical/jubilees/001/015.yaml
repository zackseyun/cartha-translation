review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the four-item opening list, the comprehensive 'heart/soul/strength' formula, gathering from all nations, and the agricultural image. However, it turns the source's passive 'that I may be found by them' into an active-purpose construction ('so that they may discover me'), and it loses the specific transfer sense of እፈልሶሙ ('I will transplant them').
  naturalness: 'Several expressions are not natural modern formal Korean: the opening nominal list cannot appropriately end in ''입니다''; ''이는 그들이 나를 발견하게 하려는 것입니다'' is semantically and syntactically awkward; ''의 안에서'' is malformed; and ''곧은 심으심으로 심을 것입니다'' is both opaque and repetitively unnatural.'
  terminology: '''안식일,'' ''절기,'' ''희년,'' and ''규례'' are appropriate. ''평강'' is acceptable in scriptural Korean, though ''평화'' is more natural; ''평강'' is retained. The final image is rendered with ''의로운 심음'' and ''옮겨 심다'' to preserve both righteousness/uprightness and transplantation without importing a doctrinal interpretation.'
  issues:
  - severity: high
    issue: The clause about being found is mistranslated.
    rationale: ከመ፡ እትረከቦሙ corresponds to 'so that I may be found by them.' The draft's '그들이 나를 발견하게 하려는 것입니다' recasts this as an explicit intention to make them discover God. '내가 그들에게 발견될 것입니다' preserves the passive construction.
  - severity: high
    issue: The final verb's transplantation nuance is absent.
    rationale: The source verb እፈልሶሙ denotes moving/transplanting, not merely planting. The revised text uses '옮겨 심겠습니다.'
  - severity: medium
    issue: The opening list is incorrectly concluded with a copula.
    rationale: The source opens mid-syntactic sequence with a nominal list, as reflected in the English audit trail. '규례들입니다' invents a predication. Korean may supply the governing verb from the immediate preceding context to make the verse readable.
  - severity: medium
    issue: The phrase for peace in righteousness is malformed and the final agricultural phrase is unnatural.
    rationale: '''의 안에서'' is not a valid rendering here, and ''곧은 심으심'' is not idiomatic Korean. ''의 안에서 풍성한 평강'' and ''의로운 심음으로'' provide clear formal Korean while retaining the source imagery.'
  revised_text: 또한 안식일들과 절기들과 희년들과 규례들을 잊을 것입니다. 그 후에 그들은 온 마음과 온 영혼과 온 힘을 다하여 여러 민족 가운데서 내게로 돌아올 것이며, 나는 그들을 모든 민족 가운데서 모으겠습니다. 그들은 나를 찾아, 내가 그들에게 발견될 것입니다. 그들이 온 마음과 온 영혼을 다하여 나를 찾을 때, 나는 의 안에서 풍성한 평강을 그들에게 나타내고, 그들을 의로운 심음으로 옮겨 심겠습니다.[a]
  revised_footnotes:
  - marker: a
    text: 또는 “그들을 의로운 심음으로 심겠습니다.”
    reason: The Ge'ez verb is specifically transitive/transfer-oriented ('transplant'), while a less specific 'plant' is a possible traditional rendering. The note preserves this lexical alternative.
  revision_rationale: The revision corrects the passive 'be found' clause and explicitly renders the final verb as transplantation. It replaces unidiomatic Korean with modern formal-polite prose, keeps established calendrical and legal terms, and supplies '잊을 것입니다' only for the opening list because this verse begins in the middle of a source sentence whose governing verb occurs immediately before the verse boundary. The final metaphor remains deliberately nonsectarian and retains its agricultural ambiguity.
