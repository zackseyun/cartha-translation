revisions:
- from: 그리고 안식일들과 절기들과 희년들과 규례들입니다. 그 후에는 그들이 모든 마음과 모든 영혼과 모든 힘을 다하여 여러 민족 가운데서 나에게로 돌아올 것이며, 내가 그들을 모든 민족 가운데서 모을 것이고, 그들이 나를 찾을 것이며, 이는 그들이 나를 발견하게 하려는 것입니다. 그들이 모든 마음과 모든 영혼을 다하여 나를 찾을 때, 나는 그들에게 의 안에서 풍성한 평강을 나타낼 것이며, 곧 그들을 곧은 심으심으로 심을 것입니다.[a]
  to: 또한 안식일들과 절기들과 희년들과 규례들을 잊을 것입니다. 그 후에 그들은 온 마음과 온 영혼과 온 힘을 다하여 여러 민족 가운데서 내게로 돌아올 것이며, 나는 그들을 모든 민족 가운데서 모으겠습니다. 그들은 나를 찾아, 내가 그들에게 발견될 것입니다. 그들이 온 마음과 온 영혼을 다하여 나를 찾을 때, 나는 의 안에서 풍성한 평강을 그들에게 나타내고, 그들을 의로운 심음으로 옮겨 심겠습니다.[a]
  rationale: The revision corrects the passive 'be found' clause and explicitly renders the final verb as transplantation. It replaces unidiomatic Korean with modern formal-polite prose, keeps established calendrical and legal terms, and supplies '잊을 것입니다' only for the opening list because this verse begins in the middle of a source sentence whose governing verb occurs immediately before the verse boundary. The final metaphor remains deliberately nonsectarian and retains its agricultural ambiguity.
