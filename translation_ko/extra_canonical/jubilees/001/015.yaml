  chosen_korean: 그들이 ... 나에게로 돌아올 것이며
  alternatives_korean:
  - 그들이 ... 나를 향해 돌이킬 것이며
  - 그들이 ... 내게로 돌아설 것이며
  lexicon: turn to
  rationale: 회심·귀향의 방향성을 살리되, ‘돌아오다’로 자연스러운 종교적 전환을 표현했습니다.
