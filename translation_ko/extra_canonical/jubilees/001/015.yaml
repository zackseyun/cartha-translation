  english_pob_choice: they will seek me so that I may be found by them
  chosen_korean: 그들이 나를 찾을 것이며, 이는 그들이 나를 발견하게 하려는 것입니다
  alternatives_korean:
  - 그들이 나를 찾을 것이며, 나로 하여금 그들에 의해 발견되게 하려는 것입니다
  - 그들이 나를 찾을 것이며, 그래서 내가 그들에게서 발견되게 하려는 것입니다
  lexicon: seek / be found
  rationale: 원문의 목적절을 살리면서 한국어에서 더 분명한 인과·목적 관계로 정리했습니다.
- source_word: እፈልሶሙ፡
  english_pob_choice: I will transplant them
  chosen_korean: 그들을 곧은 심으심으로 심을 것입니다
  alternatives_korean:
  - 그들을 옮겨 심을 것입니다
  - 그들을 다시 심을 것입니다
  lexicon: transplant / plant
  rationale: POB의 개정 취지인 ‘transplant’와 이전 렌더링의 ‘plant’ 사이 긴장을 반영해, 옮겨 심는 의미를 유지하면서도 심기의 결과를 강조했습니다.
theological_decisions:
- issue: 마지막 동사의 농업 비유를 한국어로 어떻게 살릴지
  chosen_reading: ‘곧은 심으심으로 심을 것입니다’로 번역해, 단순한 식재보다 하나님이 새로이 자리 잡게 하시는 회복의 이미지를 드러냈습니다.
  alternative_readings:
  - ‘옮겨 심을 것입니다’
  - ‘심을 것입니다’
  rationale: 문맥상 여러 민족 가운데서 불러 모은 백성을 새롭게 정착시키는 회복 비유이므로, 단순 ‘심다’만으로는 옮겨 세우는 함의가 약해질 수 있습니다.
  doctrine_reference: 회복과 재정착의 비유적 언어
