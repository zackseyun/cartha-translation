translation:
  language: ko
  text: 그들은 자기들의 모든 환난에서 자신들을 구원할 수 없는 이방 신들에게로 돌아갈 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀበ፡ *አምላክ፡ ነኪር፡
  english_pob_choice: foreign gods
  chosen_korean: 이방 신들
  alternatives_korean:
  - 낯선 신들
  - 외국 신들
  lexicon: foreign gods
  rationale: 게에즈 원문과 영어 POB의 뜻에 맞게, 단순한 ‘외국’보다 우상적·종교적 대상을 드러내는 ‘이방 신들’로 옮겼습니다.
- source_word: ይትመየጡ
  english_pob_choice: they will turn
  chosen_korean: 돌아갈 것입니다
  alternatives_korean:
  - 돌이킬 것입니다
  - 향할 것입니다
  lexicon: turn
  rationale: 문맥상 언약적 배도와 우상 추종의 방향 전환을 나타내므로, 자연스럽고 의미가 분명한 ‘돌아가다’를 사용했습니다.
- source_word: ኢያድኅንዎሙ
  english_pob_choice: cannot deliver them
  chosen_korean: 자신들을 구원할 수 없는
  alternatives_korean:
  - 자신들을 건져낼 수 없는
  - 자신들을 구출할 수 없는
  lexicon: deliver
  rationale: ‘deliver’의 구출 의미를 살리되, 종교 문맥에서 구원 동사의 힘이 필요해 ‘구원하다’로 옮겼습니다.
- source_word: እምኵሉ፡ ምንዳቤሆሙ
  english_pob_choice: from all their distress
  chosen_korean: 자기들의 모든 환난에서
  alternatives_korean:
  - 자기들의 온갖 환난에서
  - 자기들의 어떤 환난에서도
  lexicon: all their distress
  rationale: 게에즈의 ‘모든/전부’를 따라 ‘모든 환난’으로 옮겼고, 영어 POB의 수정 이력도 이 독법을 지지합니다.
theological_decisions:
- issue: 우상에 대한 표현을 어떻게 살릴지
  chosen_reading: ‘이방 신들’로 번역해 단순한 지역적 신명 목록이 아니라 야훼를 대체하는 거짓 신들을 드러냈습니다.
  alternative_readings:
  - 낯선 신들
  - 외국 신들
  rationale: 본문의 배도와 무능한 구원의 대조를 선명하게 하려면, 문화적 낯섦보다 신학적 우상성을 앞세우는 표현이 적절합니다.
  doctrine_reference: 우상숭배 경계와 참된 구원 주체에 대한 성경의 일관된 증언
- issue: ‘all their distress’의 범위를 어떻게 반영할지
  chosen_reading: ‘자기들의 모든 환난에서’로 옮겨, 구원 불능의 총체성을 분명히 했습니다.
  alternative_readings:
  - 자기들의 어떤 환난에서도
  - 자기들의 모든 고통에서
  rationale: 게에즈 어휘와 주석 이력을 종합하면 의미는 부분적 무능이 아니라 전면적 무능이므로, 총괄적 표현이 더 정확합니다.
  doctrine_reference: 거짓 신들의 무력함과 하나님의 유일한 구원 능력
