- from: 주께서는 그에게 처음 것과 장차 올 것을, 곧 율법과 증언의 모든 날의 구분에 대한 기록을 가르치셨습니다. 그리고 말씀하셨습니다. “네가 이 산에서 내가 네게 말하는 모든 것에 마음을 두고, 책에 기록하라. 그러면 그들의 세대가, 그들이 저지른 모든 악으로 인해, 내가 그들 가운데서 너와 나 사이에 세우는 규례를 어김으로써 내가 그들을 버리지 않았음을 보게 될 것이다.”
  to: 주께서는 그에게 처음의 일들과 장차 올 일들, 곧 율법과 증언에 관한 모든 날의 구분에 대한 기록을 가르치셨습니다. 그리고 말씀하셨습니다. “너는 이 산에서 내가 네게 말하는 모든 것을 마음에 새기고 책에 기록하여라. 그러면 그들의 후손들이, 그들이 나와 너 사이에 내가 세우는 규례를 어김으로써 저지른 모든 악 때문에 내가 그들을 버리지 않았음을 보게 될 것이다.”
  rationale: 원문의 시간적 대조, ‘날들의 구분에 대한 기록’, 기록 명령, 그리고 후손들이 하나님의 비(非)유기를 보게 된다는 진술을 유지했습니다. 마지막 절은 원문의 다소 긴밀하고 어려운 인과 관계를 해석적으로 전환하지 않고, ‘그들이 … 규례를 어김으로써 저지른 모든 악’으로 문법 관계만 명확히 했습니다.
