base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: ko
  text: 주께서는 그에게 처음의 일들과 장차 올 일들, 곧 율법과 증언에 관한 모든 날의 구분에 대한 기록을 가르치셨습니다. 그리고 말씀하셨습니다. “너는 이 산에서 내가 네게 말하는 모든 것을 마음에 새기고 책에 기록하여라. 그러면 그들의 후손들이, 그들이 나와 너 사이에 내가 세우는 규례를 어김으로써 저지른 모든 악 때문에 내가 그들을 버리지 않았음을 보게 될 것이다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주께서는
  alternatives_korean:
  - 하나님께서는
  - 야훼께서는
  - 주님께서는
  lexicon: source_name
  rationale: 게에즈 본문은 신명 자체(야훼)보다 ‘주/주인’에 해당하는 호칭을 쓰고 있으므로, POB의 영어 ‘the Lord’를 따라 ‘주’로 옮겼습니다.
- source_word: ቀዳሚ ... ይመጽእ
  english_pob_choice: what was first and what was to come
  chosen_korean: 처음 것과 장차 올 것을
  alternatives_korean:
  - 먼저인 것과 뒤에 올 것을
  - 처음과 오는 것을
  lexicon: temporal_concept
  rationale: 첫째와 장차 올 미래를 병렬로 대비하는 표현이라, 한국어에서도 시간적 선후를 드러내는 간결한 문장으로 옮겼습니다.
- source_word: መዋዕላት ሕግ ወለ ስምዕ
  english_pob_choice: the account of the divisions of all the days of the law and the testimony
  chosen_korean: 율법과 증언의 모든 날의 구분에 대한 기록
  alternatives_korean:
  - 율법과 증언의 날들에 대한 구획의 기록
  - 율법과 증언의 모든 날들을 나눈 기록
  lexicon: division/account
  rationale: ‘구분’은 날들을 나누는 구조를 살리면서도 ‘계산표’보다 본문의 조직적 의미를 잘 드러내며, ‘기록’으로 아랍/게에즈 계열의 ‘account’ 감각을 반영했습니다.
- source_word: ሥርዐት
  english_pob_choice: the ordinance
  chosen_korean: 규례
  alternatives_korean:
  - 명령
  - 법도
  - 제정
  lexicon: decree_statute
  rationale: 본문의 쟁점은 하나님이 세우는 제정된 규범이므로, 전통적 성서 한국어에서 널리 쓰이면서도 법적 강도를 지닌 ‘규례’를 택했습니다.
theological_decisions:
- issue: ‘내가 그들을 버리지 않았다’는 부정 표현의 보존
  chosen_reading: ‘내가 그들을 버리지 않았음’을 분명히 드러냈습니다.
  alternative_readings:
  - ‘내가 그들을 떠나지 않았음’
  - ‘내가 그들을 저버리지 않았음’
  rationale: 본문과 POB가 함께 강조하는 것은 하나님의 언약적 지속성의 부정문이므로, 완곡하게 바꾸지 않고 ‘버리지 않았다’로 직역에 가깝게 유지했습니다.
  doctrine_reference: 언약적 신실성
