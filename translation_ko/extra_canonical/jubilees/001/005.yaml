    rationale: 초안의 ‘그들이 저지른 모든 악으로 인해, 내가 그들 가운데서 너와 나 사이에 세우는 규례를 어김으로써’는 ‘규례를 어김’이 ‘내가’ 하는 행위처럼 읽히거나 문법적으로 미완성처럼 들립니다. 원문은 그들이 하나님과 모세 사이에 세워지는 규례를 범하여 악을 행한 것을 가리킵니다.
