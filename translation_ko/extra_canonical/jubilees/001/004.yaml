  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
  footnotes:
  - marker: a
    text: Or 'the glory of Yahweh appeared like'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 일곱째 날에 야훼께서 구름 한가운데서 모세를 부르셨습니다. 야훼의 영광의 모습[a]은 산 꼭대기에서 타오르는 불과 같았습니다. 모세는 그 산에서 사십 일과 사십 밤을 지냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야훼의 영광이 산 꼭대기에서 타오르는 불처럼 나타났습니다.”
    reason: 원문의 구문은 ‘야훼의 영광의 모습’이라는 명사적 표현으로 읽을 수 있으며, ‘야훼의 영광이 …처럼 나타났다’로도 옮길 수 있습니다.
