translation:
  language: ko
  text: 그리고 일곱째 날에 그가 구름 한가운데서 모세를 부르셨습니다. 야훼의 영광의 모습은 산 꼭대기 위에 타오르는 불과 같았습니다. 모세는 그 산에서 사십 일 사십 야간을 지냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕለት፡ ሳብዕት፡
  english_pob_choice: on the seventh day
  chosen_korean: 일곱째 날
  alternatives_korean:
  - 일곱째 날에
  - 제칠일에
  lexicon: —
  rationale: 게으즈의 날짜 표현을 자연스러운 한국어 서술로 옮기되, 특정 절차적 성격을 살려 ‘일곱째 날’로 간결하게 처리했습니다.
- source_word: እማእከለ፡ ደመና፡
  english_pob_choice: from the midst of the cloud
  chosen_korean: 구름 한가운데서
  alternatives_korean:
  - 구름 가운데서
  - 구름 속에서
  lexicon: —
  rationale: ‘중앙/한복판’의 뜻을 살려 신현 장면의 공간감을 유지하는 표현으로 옮겼습니다.
- source_word: ስብሐተ፡ እግዚአብሔር፡
  english_pob_choice: the appearance of the glory of Yahweh
  chosen_korean: 야훼의 영광의 모습
  alternatives_korean:
  - 야훼의 영광의 나타남
  - 야훼의 영광의 광채
  lexicon: —
  rationale: 영어 POB의 수정본이 ‘appearance’를 명사로 보도록 정리했으므로, 이를 따라 ‘모습’으로 옮겨 원문의 형식과 신현적 표지를 보존했습니다.
- source_word: ከመ፡ እሳት፡ ዘያነድድ፡
  english_pob_choice: was like a burning fire
  chosen_korean: 타오르는 불과 같았습니다
  alternatives_korean:
  - 붙타는 불과 같았습니다
  - 불처럼 타오르고 있었습니다
  lexicon: —
  rationale: 비유의 핵심은 외형 비교이므로 ‘같았습니다’를 유지했고, ‘burning fire’를 자연스럽게 ‘타오르는 불’로 옮겼습니다.
- source_word: አርብዓ፡ ዕለተ፡ ወአርብዓ፡
  english_pob_choice: forty days and forty nights
  chosen_korean: 사십 일 사십 야간
  alternatives_korean:
  - 사십 일 밤낮
  - 사십 일과 사십 밤
  lexicon: —
  rationale: 게으즈 본문의 대구를 그대로 드러내기 위해 ‘days and nights’를 직역에 가깝게 살리면서도, 한국어 성경 문체에 맞게 정리했습니다.
theological_decisions:
- issue: YHWH divine-name rendering in a theophany context
  chosen_reading: ‘야훼’로 직접 표기했습니다.
  alternative_readings:
