  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: ko
  text: 그들의 혼이 나와 나의 모든 명령에 매달릴 것이며, 그들은 나의 명령을 행할 것입니다. 나는 그들의 아버지가 되고, 그들은 나의 자녀가 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ
  english_pob_choice: their souls
  chosen_korean: 그들의 혼
  alternatives_korean:
  - 그들의 영혼
  - 그들의 목숨
  lexicon: ነፍስ
  rationale: 게에즈 원문은 내면의 생명/존재를 가리키며, 영어 POB의 their souls를 따라 한국어에서는 ‘혼’이 가장 직접적입니다. ‘영혼’은 후대 종교어감이 강하고, ‘목숨’은 의미가 좁아집니다.
- source_word: ኀቤየ
  english_pob_choice: to me
  chosen_korean: 나에게
  alternatives_korean:
  - 내게
  - 내 쪽으로
  lexicon: ኀቤ
  rationale: 동사의 방향성을 살려 단순한 소유가 아니라 ‘나에게/내게’의 지향을 분명히 했습니다.
- source_word: ትእዛዝየ
  english_pob_choice: my commandments
  chosen_korean: 나의 명령
  alternatives_korean:
  - 나의 계명
  - 내 계명
  lexicon: ትእዛዝ
  rationale: 게에즈의 명령/지시 의미를 반영해 ‘명령’으로 옮겼습니다. 한국 교회어의 ‘계명’도 가능하지만, 원문의 반복과 병행 구조에서는 ‘명령’이 더 직결됩니다.
- source_word: አበ
  english_pob_choice: Father
  chosen_korean: 아버지
  alternatives_korean:
  - 아빠
  - 부친
  lexicon: አበት
  rationale: 하나님을 가리키는 친자 관계 비유를 보존하기 위해 기본형 ‘아버지’를 택했습니다.
- source_word: ውሉደ
  english_pob_choice: children
  chosen_korean: 자녀
  alternatives_korean:
  - 아이들
  - 아들들
  lexicon: ውሉድ
  rationale: 남성 중심의 ‘아들들’보다 포괄적 친자 관계를 드러내는 ‘자녀’가 원문 의도를 더 잘 반영합니다.
theological_decisions:
- issue: ‘혼’과 ‘자녀’의 관계가 단순 비유인지 언약적 신분 언어인지
  chosen_reading: 하나님께 속한 내적 충성과 순종이 곧 친자 관계로 이어지는 언약 언어로 읽었습니다.
  alternative_readings:
  - 단순한 수사적 비유로 읽기
  - 윤리적 종속 관계로만 읽기
  rationale: 원문은 ‘혼이 매달림’과 ‘명령을 행함’ 뒤에 ‘아버지/자녀’ 선언을 결합하여, 마음의 충성과 관계적 귀속을 언약적으로 표현합니다.
  doctrine_reference: 언약적 친자 관계, 순종과 소속의 결합
