  text: a clean heart and a holy spirit, and do not let them be ensnared in their sins from now and forever.” And the LORD said to Moses, “I know their contrariness and their thoughts and their stiff neck, and they will not listen
translation:
  language: ko
  text: 깨끗한 마음과 거룩한 영을 가지게 하시고, 이제부터 영원토록 그들이 그들의 죄에 얽매이지 않게 하십시오.” 그리고 주님께서 모세에게 말씀하셨습니다. “나는 그들의 거역함과 그들의 생각과 그들의 목이 곧음을 알고 있으며, 그들은 듣지 않을 것입니다
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ንጹሐ፡
  english_pob_choice: a clean heart
  chosen_korean: 깨끗한 마음
  alternatives_korean:
  - 정결한 마음
  - 깨끗한 심장
  lexicon: heart = 마음
  rationale: Geez의 'heart'는 한국어 성경에서도 감정·의지·내면 전체를 포괄하는 ‘마음’이 가장 자연스럽고, ‘깨끗한’은 도덕적 순결을 잘 드러냅니다.
- source_word: ወመንፈሰ፡ ቅዱሰ፡
  english_pob_choice: a holy spirit
  chosen_korean: 거룩한 영
  alternatives_korean:
  - 성령
  - 거룩한 숨
  lexicon: spirit = 영
  rationale: 본문은 특정한 신적 위격명이라기보다 인간의 내적 성향과 병렬된 표현이므로, 프로젝트 기본값에 따라 ‘영’으로 옮기고 ‘거룩한’으로 수식했습니다.
- source_word: ወኢ*ይትዐቀጹ፡... በኀጢአቶሙ፡
  english_pob_choice: do not let them be ensnared in their sins
  chosen_korean: 그들이 자기 죄에 얽매이지 않게 하십시오
  alternatives_korean:
  - 그들이 자기 죄에 붙들리지 않게 하십시오
  - 그들이 자기 죄에 사로잡히지 않게 하십시오
  lexicon: ensnared = 얽매이다
  rationale: English POB의 ‘ensnared’를 따라 단순히 ‘잡히다’보다 덫에 걸린 듯한 포획 상태를 살리는 ‘얽매이다’가 더 정확합니다.
- source_word: ወይቤሎ፡ እግዚአብሔር፡ ለሙሴ፡
  english_pob_choice: And the LORD said to Moses
  chosen_korean: 그리고 주님께서 모세에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 야훼께서 모세에게 말씀하셨습니다
  - 주님이 모세에게 말씀하셨습니다
  lexicon: LORD = 주님
  rationale: 이 절의 English audit trail은 'LORD'를 표기하고 있으므로, 한국어에서는 구약 경건문체에 맞는 ‘주님’으로 옮겼습니다.
- source_word: ተዋሥኦቶሙ፡ ወሕሊናሆሙ፡ ወይቡሰ፡
  english_pob_choice: their contrariness and their thoughts and their stiff neck
  chosen_korean: 그들의 고집과 그들의 생각과 그들의 완고한 목
  alternatives_korean:
  - 그들의 반항과 그들의 생각과 그들의 고집 센 목
  - 그들의 거역과 그들의 생각과 그들의 완강한 목
  lexicon: stiff neck = 완고한 목
  rationale: 마지막 항목은 직역성이 강한 신체 비유이므로, 관용적이면서도 원문의 경직성과 거절 태도를 드러내는 ‘완고한 목’을 택했습니다.
theological_decisions:
- issue: 내적 상태의 이중 병렬('clean heart' / 'holy spirit')
  chosen_reading: ‘마음’과 ‘영’을 나란히 두어 인간의 내적 도덕성과 생명적 성향을 함께 요청하는 표현으로 유지했습니다.
  alternative_readings:
  - 둘을 모두 ‘성령’ 관련 표현으로 통일하는 읽기
  - 둘을 모두 추상적 품성 표현으로 바꾸는 읽기
  rationale: Geez 본문은 병렬 구조로 두 요소를 구분하므로, 한쪽을 신학적으로 흡수하지 않고 각 항을 별도로 살리는 것이 source-grounded입니다.
  doctrine_reference: 인간 내면의 도덕적 갱신과 순종의 요청
- issue: ‘LORD’의 한국어 표기
  chosen_reading: 본문에서는 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 제공된 영어 POB가 'LORD'로 제시되어 있어, 이 절의 표면 번역은 ‘주님’으로 두되 후속 주석에서 원어 대응을 검토할 수 있게 했습니다.
  doctrine_reference: 구약 신명 표기의 일관성과 본문 가시성
