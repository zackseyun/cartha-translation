  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: ko
  text: 그리고 그는 기도하며 말했습니다. 「주님, 제 하나님이시여, 당신의 백성과 당신의 기업을 그들 마음의 그릇된 길로 내버려 두지 마시고, 그들을 그들의 원수인 여러 민족의 손에 넘기지 마십시오. 그들이 그들을 다스리며 당신께 죄를 짓게 할까 두렵습니다. 주님, 당신의 자비가 당신의 백성 위에 높여지게 하십시오.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትኅድግ
  english_pob_choice: do not abandon
  chosen_korean: 내버려 두지 마시고
  alternatives_korean:
  - 버리지 마시고
  - 포기하지 마시고
  lexicon: ሕድግ
  rationale: 단순한 ‘버리다’보다 관계적·보호적 의미를 살려, 언약 백성을 방치하지 말라는 청원을 자연스럽게 전달했습니다.
- source_word: ሕዝበከ፡ ወርስትከ፡
  english_pob_choice: your people and your inheritance
  chosen_korean: 당신의 백성과 당신의 기업
  alternatives_korean:
  - 당신의 백성과 상속 재산
  - 당신의 백성과 유업
  lexicon: העם / נחלה 계열 대응
  rationale: ‘기업’은 성경적 소유·언약 상속의 뉘앙스를 유지하면서도 한국어 성경어로 어색하지 않게 옮깁니다.
- source_word: ፀሮሙ፡ አሕዛብ፡
  english_pob_choice: the hand of their enemies, the nations
  chosen_korean: 그들의 원수인 여러 민족의 손
  alternatives_korean:
  - 그들의 원수인 이방 민족의 손
  - 그들의 원수인 나라들의 손
  lexicon: ἔθνη / 민족
  rationale: ‘아흐잡’의 민족적 복수성을 살려 ‘여러 민족’으로 옮기되, 원수 관계를 분명히 하기 위해 수식어를 붙였습니다.
- source_word: ከመ፡ ይኅጥኡ፡ ለከ።
  english_pob_choice: cause them to sin against you
  chosen_korean: 당신께 죄를 짓게 할까 두렵습니다
  alternatives_korean:
  - 당신 앞에서 죄를 짓게 할까 두렵습니다
  - 당신께 범죄하게 할까 두렵습니다
  lexicon: חטא / 죄를 짓다
  rationale: 동사의 결과를 청원의 이유절로 풀어, 원문이 말하는 ‘그들이 하나님께 죄를 짓게 됨’의 의도를 분명히 했습니다.
theological_decisions:
- issue: ‘자비가 높여지게 하십시오’라는 청원형 종결
  chosen_reading: “주님, 당신의 자비가 당신의 백성 위에 높여지게 하십시오”로 기도문 어조를 살렸습니다.
  alternative_readings:
  - “당신의 자비를 당신의 백성 위에 올려 주십시오”
  - “당신의 자비가 당신의 백성 위에 임하게 하십시오”
  rationale: 게즈 원문의 상승·고양 이미지(‘위에 높이다’)를 유지하면서, 한국어 기도문에서 자연스러운 요청형으로 재현했습니다.
  doctrine_reference: 시편적 중보기도 형식
