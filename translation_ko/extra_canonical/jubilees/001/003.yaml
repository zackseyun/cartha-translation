translation:
  language: ko
  text: 야훼의 영광이 시내 산 위에 있었고, 구름이 그것을 여섯 날 동안 덮었습니다. 그리고 그가 그를 불렀습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር፡
  english_pob_choice: The glory of the Lord
  chosen_korean: 야훼의 영광
  alternatives_korean:
  - 주님의 영광
  - 하나님의 영광
  lexicon: Tetragrammaton + doxa/“glory”
  rationale: 지시 대상이 야훼일 때는 본문 맥락과 프로젝트 기본어에 따라 ‘야훼’로 옮기고, ‘glory’는 가시적 현현을 가리키는 뜻을 살려 ‘영광’으로 번역했습니다.
- source_word: ውስተ፡ *ደብረ፡ ሲና፡
  english_pob_choice: upon Mount Sinai
  chosen_korean: 시내 산 위에
  alternatives_korean:
  - 시내산에
  - 시내 산에
  lexicon: toponym
  rationale: 지명은 현대 한국어에서 통용되는 표기를 따르되, 원문의 ‘위에/upon’라는 위치 관계를 드러내기 위해 ‘위에’를 유지했습니다.
- source_word: ወጸለሎ፡ ደመና፡ ስዱሰ፡ ዕለተ።
  english_pob_choice: and the cloud overshadowed it for six days
  chosen_korean: 구름이 그것을 여섯 날 동안 덮었습니다
  alternatives_korean:
  - 구름이 그것을 여섯 날 동안 가렸습니다
  - 구름이 그것 위에 여섯 날 동안 드리워졌습니다
  lexicon: overshadowed
  rationale: 동사 어근이 ‘그늘지게 하다/덮다’의 의미를 가지므로, 자연스럽고 직역에 가까운 ‘덮었습니다’를 택해 기간 표현 ‘여섯 날 동안’과 함께 원문의 진행을 살렸습니다.
- source_word: ወጸውዖ፡
  english_pob_choice: And He called him
  chosen_korean: 그리고 그가 그를 불렀습니다
  alternatives_korean:
  - 그리고 그를 불렀습니다
  - 그가 그를 불렀습니다
  lexicon: call
  rationale: 지시 대명사와 인칭 대명사를 그대로 반영해 행위 주체와 대상이 분명히 드러나도록 옮겼습니다.
theological_decisions:
- issue: 야훼의 현현 표현
  chosen_reading: ‘야훼의 영광’과 ‘구름’의 병치를 유지해 시내 산 위의 현현 장면을 직접 드러냈습니다.
  alternative_readings:
  - ‘주님의 영광’으로 완화
  - ‘영광’만 남기고 신명칭을 생략
  rationale: 원문은 하나님의 임재를 가시적 영광과 구름으로 함께 묘사하므로, 두 요소를 모두 보존해야 본문의 신현적 강도가 유지됩니다.
  doctrine_reference: 신현/임재의 표상
