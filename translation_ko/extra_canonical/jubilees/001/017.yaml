  text: and I will be their God, and they will be my people in truth and in righteousness.
translation:
  language: ko
  text: 나는 그들의 하나님이 되고, 그들은 진실과 의로 내 백성이 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኖሙ፡ አምላከ፡
  english_pob_choice: I will be their God
  chosen_korean: 나는 그들의 하나님이 되고
  alternatives_korean:
  - 나는 그들의 하나님이 되겠습니다
  - 나는 그들의 하나님이 되며
  lexicon: 하나님
  rationale: Geez 원문의 소유 관계와 약속의 서술을 그대로 살려, 직설적인 미래형으로 옮겼습니다.
- source_word: ወእሙንቱኒ፡ ይከውኑኒ፡ ሕዝብየ፡
  english_pob_choice: they will be my people
  chosen_korean: 그들은 … 내 백성이 될 것입니다
  alternatives_korean:
  - 그들은 … 내 ժողովուրդ이 될 것입니다
  - 그들은 … 내 사람들일 것입니다
  lexicon: 백성
  rationale: ‘people’는 공동체적 소속을 드러내는 ‘백성’이 가장 자연스럽고, 하나님과의 언약 관계를 분명히 보여 줍니다.
- source_word: ዘበአማን፡ ወዘበጽድቅ።
  english_pob_choice: in truth and in righteousness
  chosen_korean: 진실과 의로
  alternatives_korean:
  - 진리와 의로
  - 참됨과 의로
  lexicon: 진실 / 의
  rationale: 원문의 두 추상명사를 함께 보존하되, 첫 항은 관계적·윤리적 진실성을 드러내는 ‘진실’로, 둘째는 POB 기본 용례에 맞춰 ‘의’로 옮겼습니다.
theological_decisions:
- issue: 언약적 소속 표현의 직역성
  chosen_reading: ‘내 백성’으로 옮겨 하나님-백성 관계의 언약 구조를 드러냈습니다.
  alternative_readings:
  - ‘내 사람들’로 완화하는 번역
  - ‘내 공동체’로 해석적 번역
  rationale: 문맥상 단순한 소유가 아니라 언약적 귀속을 말하므로, 한국어에서도 성경적 관계성을 가장 직접적으로 전달하는 표현을 유지했습니다.
  doctrine_reference: 언약 신학 / 출 6:7, 렘 31:33의 반복 구조
- issue: ‘진실과 의’의 병렬 유지
  chosen_reading: 두 개의 부사구를 모두 보존해 도덕적·관계적 정합성을 함께 나타냈습니다.
  alternative_readings:
  - ‘진리와 의’로 철학적 용어화
  - ‘참으로 의롭게’로 문장화
  rationale: 원문은 상태를 서술하는 병렬 구조이므로, 한국어에서도 의미를 합치지 않고 병렬을 유지하는 편이 소스 충실도가 높습니다.
  doctrine_reference: 성실/정의의 언약적 삶을 강조하는 성경적 표현
