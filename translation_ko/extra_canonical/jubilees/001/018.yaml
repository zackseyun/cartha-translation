  text: And I will not abandon them, nor will I estrange myself from them, for I am the Lord their God.” And Moses fell on his face,
translation:
  language: ko
  text: “나는 그들을 버리지도 않고, 그들에게서 멀어지지도 않겠습니다. 내가 그들의 주 하나님이기 때문입니다.” 그리고 모세는 얼굴을 땅에 대고 엎드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጎሙ፡ / ኢይትናከሮሙ፡
  english_pob_choice: I will not abandon them, nor will I estrange myself from them
  chosen_korean: “나는 그들을 버리지도 않고, 그들에게서 스스로 멀어지지도 않겠습니다”
  alternatives_korean:
  - “나는 그들을 떠나지 않겠습니다”
  - “나는 그들을 포기하지 않겠습니다”
  lexicon: Geez 동사 ጎሙ / ኢይትናከሮሙ
  rationale: 두 동사는 단순한 이별보다 관계를 끊거나 멀어지는 뜻을 함께 가지므로, ‘버리다’와 ‘스스로 멀어지다’로 나누어 관계적 긴장을 살렸습니다.
- source_word: እግዚአብሔር፡ አምላኮሙ
  english_pob_choice: the Lord their God
  chosen_korean: 그들의 주 하나님
  alternatives_korean:
  - 그들의 야훼 하나님
  - 그들의 주님 하나님
  lexicon: 신명 표현
  rationale: 이 절의 영어 POB는 divine name을 LORD가 아니라 Lord로 정리했으므로, 본문에는 יהוה 표기를 전제하지 않고 ‘주 하나님’으로 옮겼습니다.
- source_word: ወወድቀ፡ ሙሴ፡ በገጹ፡
  english_pob_choice: And Moses fell on his face
  chosen_korean: 그러자 모세가 얼굴을 땅에 대고 엎드렸습니다
  alternatives_korean:
  - 그러자 모세가 얼굴을 바닥에 대고 엎드렸습니다
  - 그러자 모세가 얼굴을 땅에 대고 넘어졌습니다
  lexicon: Geez 관용구
  rationale: ‘얼굴을 땅에 대고 엎드리다’는 경배와 굴복의 관용적 표현을 자연스럽게 드러내며, 단순한 신체 동작보다 예배적 반응을 보존합니다.
theological_decisions:
- issue: 하나님의 자기 소개에서 divine name을 어떻게 처리할지
  chosen_reading: ‘주 하나님’으로 옮기고 야훼 표기는 사용하지 않았습니다.
  alternative_readings:
  - ‘야훼 그들의 하나님’
  - ‘주님 그들의 하나님’
  rationale: 제공된 영어 POB가 ‘the Lord their God’로 정리하고 있으므로, 이 구절에서는 יהוה를 직접 식별하는 번역을 피하고 신분 호칭을 유지했습니다.
  doctrine_reference: 이사야/출애굽기 전승의 신적 자기 선언
