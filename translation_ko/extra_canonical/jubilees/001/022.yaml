translation:
  language: ko
  text: 그리고 그들은 자기 죄와 자기 조상들의 죄를 인정할 때까지는 듣지 않을 것입니다. 그리고 그 뒤에 그들은 온전함 가운데, 온 마음으로, 온 영혼으로 저에게 돌아올 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢይሰምዑ
  english_pob_choice: and they will not listen
  chosen_korean: 듣지 않을 것입니다
  alternatives_korean:
  - 귀 기울이지 않을 것입니다
  - 들으려 하지 않을 것입니다
  lexicon: ሰምዐ → 듣다/듣지 않다
  rationale: 출발어의 부정 미래형을 분명히 드러내기 위해 단순한 ‘듣지 않다’보다 현대 한국어에서 자연스러운 ‘듣지 않을 것입니다’를 택했습니다.
- source_word: እስከ፡ ሶበ፡ ያአምሩ፡ ኀጢአቶሙ፡ ወኀጣውአ፡ አበዊሆሙ
  english_pob_choice: until they acknowledge their sin and the sins of their fathers
  chosen_korean: 자기 죄와 자기 조상들의 죄를 인정할 때까지
  alternatives_korean:
  - 자기 죄와 조상들의 죄를 깨달을 때까지
  - 자기 죄와 조상들의 죄를 알게 될 때까지
  lexicon: ያአምሩ → 인정하다/알다
  rationale: 영어 POB의 ‘acknowledge’를 따라 단순 인식보다 책임 있는 인정의 뉘앙스를 살렸고, 병렬 구조를 위해 ‘자기…자기…’를 반복했습니다.
- source_word: ይትመየጡ ኀቤየ
  english_pob_choice: they will turn to me
  chosen_korean: 저에게 돌아올 것입니다
  alternatives_korean:
  - 저에게로 돌이킬 것입니다
  - 저에게로 돌아설 것입니다
  lexicon: 돌아오다/돌이키다
  rationale: 하나님께 향하는 회심적 전환을 자연스럽게 드러내는 한국어로 ‘돌아오다’를 택했습니다.
- source_word: በኵሉ ርቱዕ ወበኵሉ ልብ ወበኵሉ ነፍስ
  english_pob_choice: in all uprightness and with all their heart and with all their soul
  chosen_korean: 온전함 가운데, 온 마음으로, 온 영혼으로
  alternatives_korean:
  - 모든 올바름 가운데, 온 마음과 온 영혼으로
  - 전적인 정직함으로, 온 마음으로, 온 영혼으로
  lexicon: ርቱዕ / ልብ / ነፍስ → uprightness / heart / soul
  rationale: ‘uprightness’를 도덕적 성실성의 전반을 담는 ‘온전함’으로 옮기고, 관용구 ‘with all their heart…soul’을 한국어 평행 구조로 유지했습니다.
theological_decisions:
- issue: 회심의 방향을 나타내는 동사 선택
  chosen_reading: ‘저에게 돌아올 것입니다’는 단순 귀환이 아니라 하나님께로 향하는 회개·전환을 드러냅니다.
  alternative_readings:
  - ‘저에게로 돌아설 것입니다’처럼 더 직역적인 표현
  - ‘저에게로 회심할 것입니다’처럼 교회어를 직접 사용하는 표현
  rationale: 문맥상 하나님께 대한 관계 회복을 말하므로, 한국어에서 의미를 분명히 하되 교회 전통어로 과도하게 고정하지 않는 표현이 적절합니다.
  doctrine_reference: repentance / conversion
