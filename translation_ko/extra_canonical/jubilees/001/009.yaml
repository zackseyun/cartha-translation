  yaml_path: translation/extra_canonical/jubilees/001/009.yaml
  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: ko
  text: 그리고 이 증언이 그들에게 불리한 증언으로 들릴 것입니다. 그들이 내 모든 계명, 곧 내가 그들에게 명하는 모든 것을 잊고, 민족들을 따라가며, 그들의 부정함을 따라가며, 그들의 수치스러운 것들을 따라가며, 그들의 신들을 섬길 것이기 때문입니다. 그 신들은 그들에게 걸림돌이 되고 고난과 환난과 덫이 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዛቲ፡ ስምዕ፡ ለስምዕ፡ ሎሙ
  english_pob_choice: this testimony will be heard as a testimony against them
  chosen_korean: 이 증언은 그들에게 대한 증언으로 들릴 것입니다
  alternatives_korean:
  - 이 증언이 그들에게 대한 증언으로 들릴 것입니다
  - 이 증언이 그들을 향한 증언으로 들릴 것입니다
  lexicon: source note
  rationale: 반복된 ‘증언’ 표현을 살려 문장의 법정적/증언적 성격을 유지했고, ‘against them’의 대립 관계를 자연스럽게 ‘그들에게 대한’으로 옮겼습니다.
- source_word: ይረስዑ፡ ኵሎ፡ ትእዛዝየ፡ ኵሎ፡ ዘአነ፡ እኤዝዞሙ
  english_pob_choice: they will forget all my commandments, everything that I command them
  chosen_korean: 그들이 내 모든 계명과 내가 그들에게 명하는 모든 것을 잊고
  alternatives_korean:
  - 그들이 내 모든 계명과 내가 그들에게 명령한 모든 것을 잊고
  - 그들이 내 모든 계명, 곧 내가 그들에게 명하는 모든 것을 잊고
  lexicon: 계명 / 명하다
  rationale: ‘계명’과 ‘명하다’의 중복을 그대로 살려 원문의 총괄성과 강조를 보존했습니다.
- source_word: ወየሐውሩ፡ ድኅረ፡ አሕዛብ፡ ወድኅረ፡ ርኵሶሙ፡ ወድኅረ፡ ኀሣሮሙ
  english_pob_choice: and they will walk after the nations, and after their impurities, and after their shameful things
  chosen_korean: 민족들을 따라가며, 그들의 부정함을 따라가며, 그들의 수치스러운 것들을 따라가며
  alternatives_korean:
  - 민족들을 뒤따르며, 그들의 부정함을 뒤따르며, 그들의 수치스러운 것들을 뒤따르며
  - 민족들을 좇고, 그들의 부정함을 좇고, 그들의 수치스러운 것들을 좇고
  lexicon: walk after / impurities / shameful things
  rationale: ‘따라가다’로 반복 구조를 유지해 이탈과 추종의 누적을 드러냈고, ‘부정함/수치스러운 것들’은 도덕적·예식적 더러움을 구분하지 않고 원문 범위를 넓게 보존했습니다.
- source_word: ወይትቀነዩ፡ ለአማልክቲሆሙ፡ ወይከውንዎሙ፡ ማዕቅፈ፡ ወለምንዳቤ፡ ወለፃዕር፡ ወለመሥገርት
  english_pob_choice: and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare
  chosen_korean: 그들의 신들을 섬길 것이기 때문입니다. 그러면 그것들은 그들에게 걸림돌이 되고, 고난과 환난과 덫이 될 것입니다
  alternatives_korean:
  - 그들의 신들을 섬길 것이기 때문입니다. 그러면 그것들은 그들에게 걸림돌, 고난, 환난, 덫이 될 것입니다
  - 그들의 신들을 섬기게 될 것이기 때문입니다. 그러면 그것들은 그들에게 걸림돌이 되고, 고난과 환난과 덫이 될 것입니다
  lexicon: serve / stumbling block / affliction / tribulation / snare
  rationale: ‘섬기다’는 우상숭배의 종속적 행위를 유지하며, 이어지는 결과 명사들을 ‘걸림돌…덫’으로 병렬해 누적 심판의 강도를 살렸습니다.
theological_decisions:
- issue: ‘민족들’과 우상숭배의 결합이 만드는 언약적 배교의 경고
  chosen_reading: 이스라엘이 계명을 잊고 이방 민족의 길과 우상숭배를 따르며 그 결과 자신들의 신들에 종속되어 심판의 올무에 빠지는 경고로 읽었습니다.
  alternative_readings:
  - 단순한 문화적 혼합 경고
  - 개별 윤리 실패에 대한 일반 경고
  rationale: 본문은 ‘모든 계명’을 잊는 것에서 시작해 ‘민족들/부정함/수치스러운 것들/그들의 신들’로 내려가므로, 언약적 배교와 그 결과를 강조하는 읽기가 가장 자연스럽습니다.
  doctrine_reference: 언약 신학, 우상숭배 금지
