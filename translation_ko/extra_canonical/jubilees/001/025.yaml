  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: ko
  text: 모든 천사와 모든 영은 이것들이 내 자녀들이며, 내가 바르게 행함과 의로 그들의 아버지라는 것과 내가 그들을 사랑한다는 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእክ / angel
  english_pob_choice: every angel
  chosen_korean: 모든 천사
  alternatives_korean:
  - 천사마다
  - 각 천사
  lexicon: 천사
  rationale: 복수 집합을 자연스럽게 살리되, 원문의 보편적 범위를 분명히 하기 위해 ‘모든 천사’로 옮겼습니다.
- source_word: መንፈስ / spirit
  english_pob_choice: every spirit
  chosen_korean: 모든 영
  alternatives_korean:
  - 모든 영들
  - 각 영
  lexicon: 영
  rationale: 초월적 존재를 가리키는 일반 명사로서 ‘영’이 가장 직접적이며, 문맥상 성령이 아니라 피조된 영적 존재들을 포함하는 보편 표현으로 보았습니다.
- source_word: ወአነ፡ አቡሆሙ፡ በርቶዕ፡ ወበጽድቅ፡
  english_pob_choice: I am their Father in uprightness and righteousness
  chosen_korean: 내가 바르게 행함과 의로 그들의 아버지라는 것
  alternatives_korean:
  - 내가 정직함과 의로 그들의 아버지라는 것
  - 내가 올바름과 의로 그들의 아버지라는 것
  lexicon: 바르게 행함 / 의
  rationale: ge'ez의 ‘uprightness’와 ‘righteousness’를 각각 도덕적 올바름과 언약적·법정적 의로 구분해 살리기 위해 ‘바르게 행함과 의’로 옮겼습니다.
- source_word: አፈቅርሙ
  english_pob_choice: I love them
  chosen_korean: 내가 그들을 사랑한다는 것
  alternatives_korean:
  - 내가 그들을 아낀다는 것
  - 내가 그들을 사랑하고 있다는 것
  lexicon: 사랑
  rationale: 원문의 직설적 진술을 유지하면서 하나님의 지속적 사랑을 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘uprightness and righteousness’의 이중 표현
  chosen_reading: 하나님의 아버지 되심은 단순한 친밀감이 아니라 바른 행함과 의의 질서 안에 있습니다.
  alternative_readings:
  - 두 표현을 거의 동의어로 합쳐 버리는 읽기
  - 윤리적 뉘앙스를 약화시키는 포괄적 번역
  rationale: 게에즈 원문이 두 용어를 병렬로 두므로, 한국어도 구분을 어느 정도 유지해 하나님의 성품과 관계의 근거를 분명히 해야 합니다.
  doctrine_reference: 하나님의 의와 거룩함, 언약적 पिता 되심
