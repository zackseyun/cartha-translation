base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/011.yaml
  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: ko
  text: 그리고 그들은 자기들을 위하여 산당과 신성한 수풀과 새긴 우상들을 만들 것이며, 저마다 자기의 그릇됨에 절할 것이며, 자기들의 자녀를 귀신들과 그들의 마음의 그릇됨에서 나온 모든 행위에 제물로 바칠 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  english_pob_choice: high places and groves
  chosen_korean: 산당과 수목
  alternatives_korean:
  - 산당과 우상 숲
  - 높은 곳과 수목
  lexicon: high places / sacred groves
  rationale: English POB의 'high places and groves'에 맞추되, 성경적 용례에서 '산당'은 우상 숭배 장소를, '수목'은 신성한 나무/가이드를 가리키는 표현으로 압축해 옮겼습니다.
- source_word: ወግልፎ
  english_pob_choice: carved images
  chosen_korean: 새긴 우상
  alternatives_korean:
  - 새긴 형상
  - 깎아 만든 우상
  lexicon: carved image / idol
  rationale: 단순한 조각품이 아니라 우상 숭배 대상이라는 점이 분명하므로, '우상'을 덧붙여 원문의 종교적 의미를 드러냈습니다.
- source_word: ይሰግዱ
  english_pob_choice: bow down
  chosen_korean: 절할
  alternatives_korean:
  - 엎드릴
  - 경배할
  lexicon: bow down / prostrate
  rationale: 몸을 굽혀 경배하는 행위를 한국어 성경 문맥에서 가장 직접적으로 드러내는 동사로 '절하다'를 택했습니다.
- source_word: ዘዘ፡ ... ዚአሆሙ፡ ለስሒት
  english_pob_choice: each to his own error
  chosen_korean: 저마다 자기의 잘못에
  alternatives_korean:
  - 각자 자신의 오류에
  - 각 사람의 자기 오류에
  lexicon: own error / personal error
  rationale: 원문은 개인별로 귀속되는 잘못을 말하므로 '저마다 자기의'로 분산성과 소유성을 함께 살렸습니다.
- source_word: ወይዘብሑ፡ ውሉዶሙ
  english_pob_choice: they will sacrifice their children
  chosen_korean: 자기들의 자녀를 ... 바칠 것입니다
  alternatives_korean:
  - 자기 자녀를 ... 희생시킬 것입니다
  - 자녀를 ... 제물로 드릴 것입니다
  lexicon: sacrifice children
  rationale: 문맥상 자녀를 제의적으로 바치는 행위를 가리키지만, 한국어에서는 '바치다'가 제의적 헌납과 희생을 함께 포괄해 원문의 강한 의미를 보존합니다.
- source_word: ለአጋንንት፡ ወለኵሉ፡ ግብረ፡ ስሕተት፡ ልቦሙ
  english_pob_choice: to demons and to every work of the error of their hearts
  chosen_korean: 귀신들에게, 그리고 그들의 마음의 잘못된 모든 행위에
  alternatives_korean:
  - 악귀들에게, 그리고 마음의 오류로 인한 모든 일에
  - 귀신들과 그 마음의 모든 오류의 행위에
  lexicon: demons / works of the error of their hearts
  rationale: ‘귀신들’은 지시 대상을 분명히 하면서도 한국어 성경 독자에게 익숙한 어휘이고, '마음의 잘못된 모든 행위'는 원문의 소유격 연쇄를 과도하게 풀지 않고 유지합니다.
theological_decisions:
- issue: 원문의 반복적 미래 서술과 우상숭배의 단계적 진술
  chosen_reading: 산당·수목·우상 제작 → 절함 → 자녀를 귀신들에게 바침의 순서를 그대로 따라, 경고의 누적성을 살렸습니다.
  alternative_readings:
  - 문장 하나로 압축하여 단순화
  - 우상숭배 일반 진술로 평준화
  rationale: 이 절은 죄의 확산이 단계적으로 심화되는 구조이므로, 문장 압축보다 원문의 나열과 진행을 보존하는 것이 의미상 중요합니다.
  doctrine_reference: 우상숭배와 제사적 희생에 대한 성경의 경고(신 32:17; 시 106:37)
