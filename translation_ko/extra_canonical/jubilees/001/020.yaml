  source_fidelity: 핵심 청원과 대조 구조는 대체로 보존되었으나, 현행 문장은 ‘벨리알의 영이 … 고발하고 … 돌이키지 못하게’가 벨리알의 영이 그런 행위를 하지 못하도록 한다는 뜻으로 읽힙니다. 원문과 영어 감사본은 벨리알의 영이 그들을 지배하여 고발하고 의의 길에서 떠나게 하는 일을 막아 달라는 청원입니다.
  naturalness: ‘그들에게 창조하소서’는 다음 절로 이어지는 목적어 없는 미완결 구문을 보존하려는 의도는 타당하지만, ‘그들을 위하여 창조하소서’가 한국어에서 더 자연스럽게 그 연결성을 나타냅니다. 나머지는 현대 격식체로 무난합니다.
  terminology: ‘바른 영’, ‘벨리알의 영’, ‘의의 모든 길’, ‘백성’, ‘유산’은 본문의 용어와 어조를 적절히 반영합니다. ‘애굽의 손’도 압제적 지배를 나타내는 원문의 관용을 보존합니다.
  issues:
