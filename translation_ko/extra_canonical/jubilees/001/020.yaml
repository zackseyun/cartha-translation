    rationale: ‘…그들을 고발하고 의의 모든 길에서 그들을 돌이키지 못하게 하셔서’는 벨리알의 영이 고발하거나 돌이키게 하지 못하도록 해 달라는 뜻이 됩니다. 원문은 그 영이 지배하여 그러한 해를 끼치지 못하게 해 달라는 청원입니다.
