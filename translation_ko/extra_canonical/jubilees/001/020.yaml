base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: ko
  text: 그리고 그들에게 바른 영을 창조하시고, 벨리알의 영이 그들을 다스리며 주님 앞에서 그들을 고발하고 의의 모든 길에서 떠나게 하지 마소서. 그들이 주님의 얼굴 앞에서 멸망하지 않게 하소서. 그러나 그들은 주님의 백성이며 주님의 유산입니다. 주님께서는 큰 능력으로 그들을 애굽의 손에서 구해 내셨습니다. 그들을 위하여 창조하소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ፡
  english_pob_choice: an upright spirit
  chosen_korean: 바른 영
  alternatives_korean:
  - 올바른 영
  - 정직한 영
  - 곧은 영
  lexicon: መንፈስ + ርቱዕ
  rationale: ‘upright’의 도덕적·신실함 뉘앙스를 살리되, 한국어에서 자연스럽고 성경체에 어울리는 표현으로 ‘바른 영’을 택했습니다.
- source_word: መንፈሰ፡ ቤልሖር፡
  english_pob_choice: the spirit of Beliar
  chosen_korean: 벨리알의 영
  alternatives_korean:
  - 벨리알의 영
  - 사탄의 영
  - 악한 영
  lexicon: 벨리알
  rationale: 고유명사 벨리알을 직역하지 않고 음역을 유지하여, 악의 영적 실체를 특정 인물명으로 지칭하는 본문의 긴장을 보존했습니다.
- source_word: ይኰንንዎሙ
  english_pob_choice: to accuse them
  chosen_korean: 그들을 고발하고
  alternatives_korean:
  - 그들을 정죄하고
  - 그들을 비난하고
  - 그들을 참소하고
  lexicon: 고발하다
  rationale: 법정적·참소적 의미를 살리면서도 현대 한국어에서 이해가 쉬운 ‘고발하다’를 채택했습니다.
- source_word: እምኵሉ፡ ፍኖተ፡ ጽድቅ፡
  english_pob_choice: from every path of righteousness
  chosen_korean: 의의 모든 길에서
  alternatives_korean:
  - 의의 모든 길로부터
  - 모든 의의 길에서
  - 의로움의 모든 길에서
  lexicon: ፍኖት + ጽድቅ
  rationale: ‘path’의 비유를 살려 ‘길’을 유지했고, ጽድቅ은 본문 문맥상 ‘의’로 옮겨 일관성을 확보했습니다.
- source_word: ዘባላህከ፡ በኀይልከ፡ ዐቢይ፡ እምእዴ፡ ግብጽ፤
  english_pob_choice: whom you delivered by your great power from the hand of Egypt
  chosen_korean: 애굽의 손에서 주님의 큰 능력으로 구해 내신
  alternatives_korean:
  - 애굽의 손에서 주님의 큰 권능으로 구해 내신
  - 애굽의 손에서 큰 능력으로 건져 내신
  lexicon: deliver / great power / hand of Egypt
  rationale: ‘손’은 압제와 지배를 나타내는 관용을 살리고, ‘구해 내다’는 출애굽 해방의 능동적 구원을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 벨리알의 영의 인격적/악령적 이해
  chosen_reading: ‘벨리알의 영’을 실제로 사람들을 미혹하고 고발하는 악한 영적 실체로 보이게 옮겼습니다.
  alternative_readings:
  - 악한 성향이나 상징적 경향으로 완화해 옮기는 방식
  rationale: 문맥이 단순한 성향보다 외적이고 능동적인 영적 작용을 말하므로, 인격적 악의 실재성을 흐리지 않도록 했습니다.
  doctrine_reference: 악령/악의 세력 이해에 관한 성경적 문맥 보존
- issue: 마지막 문장의 미완성성
  chosen_reading: 본문이 다음 절로 이어지는 미완성 호소문이므로 ‘그들에게 창조하소서’로 남겨 연결감을 보존했습니다.
  alternative_readings:
  - 문장을 임의로 완결하거나 생략하는 방식
  rationale: 게제어 원문과 영어 POB가 모두 종결되지 않은 청원을 유지하므로, 한국어도 그 열린 구조를 그대로 반영했습니다.
  doctrine_reference: 본문비평/연속 구문 보존
