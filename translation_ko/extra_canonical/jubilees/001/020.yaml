  revised_text: 그리고 그들에게 바른 영을 창조하시고, 벨리알의 영이 그들을 다스리며 주님 앞에서 그들을 고발하고 의의 모든 길에서 떠나게 하지 마소서. 그들이 주님의 얼굴 앞에서 멸망하지 않게 하소서. 그러나 그들은 주님의 백성이며 주님의 유산입니다. 주님께서는 큰 능력으로 그들을 애굽의 손에서 구해 내셨습니다. 그들을 위하여 창조하소서.
