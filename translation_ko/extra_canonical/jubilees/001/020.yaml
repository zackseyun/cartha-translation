revisions:
- from: 그리고 그들에게 바른 영을 창조하시고, 벨리알의 영이 그들을 다스려 주님 앞에서 그들을 고발하고 의의 모든 길에서 그들을 돌이키지 못하게 하셔서, 그들이 주님의 얼굴 앞에서 멸망하지 않게 하소서. 그러나 그들은 주님의 백성이며 주님께서 애굽의 손에서 주님의 큰 능력으로 구해 내신 주님의 유산입니다. 그들에게 창조하소서.[a][b]
  to: 그리고 그들에게 바른 영을 창조하시고, 벨리알의 영이 그들을 다스리며 주님 앞에서 그들을 고발하고 의의 모든 길에서 떠나게 하지 마소서. 그들이 주님의 얼굴 앞에서 멸망하지 않게 하소서. 그러나 그들은 주님의 백성이며 주님의 유산입니다. 주님께서는 큰 능력으로 그들을 애굽의 손에서 구해 내셨습니다. 그들을 위하여 창조하소서.
  rationale: 벨리알의 영이 행하는 ‘고발’과 ‘의의 모든 길에서 떠나게 함’이 금지되어야 한다는 원문의 통사 관계를 명확히 했습니다. ‘그들의/주님의’ 반복을 일부 문장 분리로 정리하되, 백성과 유산 및 출애굽 구원의 의미는 보존했습니다. 다음 절로 이어지는 마지막 청원의 미완결성은 유지했고, 근거 없는 [a][b] 앵커는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:11Z'
