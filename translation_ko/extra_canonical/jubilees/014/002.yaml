  rationale: 게에즈 본문이 엘리에셀을 보태지 않고 ‘다마스쿠스’를 단독으로 두는 압축된 형태이므로, 영어 POB의 주해를 따라 인물명 보충 없이 한국어로도 압축성을 유지했습니다.
