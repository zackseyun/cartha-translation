    reason: previous_rendering
translation:
  language: ko
  text: '그리고 네 상급은 매우 클 것입니다.” 그러자 그가 말했습니다: “주님, 주님, 무엇을 제게 주시겠습니까? 저는 자식 없이 지내고 있으며, 내 여종의 아들 마세크의 아들은 다마스쿠스입니다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 ‘마세크’와 ‘다마스쿠스’를 매우 압축적으로 연결하며, 여기에는 ‘엘리에셀’이라는 이름이 없습니다. 이 구절은 창세기 15:2의 다마스쿠스 엘리에셀 및 집안의 상속자에 관한 언급과 관련된 것으로 이해될 수 있으나, 본문은 그 이름을 명시하지 않습니다.
    reason: 게에즈의 압축적이고 문법적으로 난해한 표현을 설명하되, 병행 본문의 이름을 번문에 보충하지 않기 위해 필요합니다.
