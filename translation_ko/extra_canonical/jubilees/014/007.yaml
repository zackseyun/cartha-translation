translation:
  language: ko
  text: 그리고 그가 그에게 말씀하셨습니다. “나는 야훼이다. 나는 너를 갈대아 우르에서 이끌어 낸 이다. 내가 너에게 이 땅을 주어 그것을 기업으로 삼게 하려는 것이다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 게에즈 원문이 언약적 신명 표지를 가리키므로, POB 기본값에 따라 아카데믹 음역인 야훼를 사용했습니다.
- source_word: ዘአውፃእኩከ፡ እምነ፡ ኡር፡ ዘከለዳዊያን፡
  english_pob_choice: who brought you out from Ur of the Chaldeans
  chosen_korean: 너를 갈대아 우르에서 이끌어 낸
  alternatives_korean:
  - 너를 갈대아 우르에서 데리고 나온
  - 너를 갈대아인의 우르에서 이끌어 낸
  lexicon: 출애굽/인도 동사군
  rationale: 출발·인도 의미를 살리기 위해 ‘이끌어 내다’를 택했고, 지명은 현대 표기 관례에 따라 ‘갈대아 우르’로 옮겼습니다.
- source_word: ከመ፡ እሀብከ፡ ምድረ፡
  english_pob_choice: so that I might give you the land
  chosen_korean: 내가 너에게 이 땅을 주어
  alternatives_korean:
  - 너에게 그 땅을 주려고
  - 내가 너에게 그 땅을 주어
  lexicon: 목적절
  rationale: 목적을 분명히 드러내는 ‘~하여/~주어’ 구조로 옮겨, 뒤의 기업 목적과 자연스럽게 연결했습니다.
- source_word: ዛቲ፡ ትረሳ፡
  english_pob_choice: to inherit it
  chosen_korean: 그것을 기업으로 삼게 하려는 것이다
  alternatives_korean:
  - 그것을 유업으로 받게 하려는 것이다
  - 그것을 상속받게 하려는 것이다
  lexicon: inherit
  rationale: ‘기업’은 성경적 상속·소유의 뜻을 가장 안정적으로 전달하므로, 동사구로 풀어 ‘기업으로 삼다’라고 옮겼습니다.
theological_decisions:
- issue: 하나님 자기계시의 신명 표지
  chosen_reading: ‘나는 야훼이다’로 직접 번역하여 언약적 자기계시를 드러냈습니다.
  alternative_readings:
  - 나는 주님이다
  - 나는 여호와이다
  rationale: 원문의 신명 표지는 일반적인 호칭보다 고유한 언약명 자체를 가리키므로, POB 기본 원칙에 따라 음역형을 유지했습니다.
  doctrine_reference: 출 3:14-15; 창 15:7
