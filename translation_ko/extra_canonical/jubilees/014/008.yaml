  to: 가나안 사람들의 땅을 영원한 소유로 주시고, 당신과 당신 뒤의 씨의 하나님이 되시려고 하셨습니다.” 그리고 그가 말씀하셨습니다.
  rationale: 절 분할로 이 구절 첫머리에 나타나는 ‘가나안 사람들의’은 앞선 ‘땅’을 수식하므로, 한국어에서 소유 주체가 바뀌어 읽히지 않도록 ‘가나안 사람들의 땅’을 보충했습니다. 하나님이 자신을 언약 상대와 그 씨의 하나님으로 두시는 표현 및 목적/의도 구조는 유지했습니다.
