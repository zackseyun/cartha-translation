  text: of the Canaanites as an everlasting possession, and to be God to you and to your seed after you.” And he said,
translation:
  language: ko
  text: 가나안 사람들의 영원한 소유가 되게 하시고, 또한 당신과 당신의 뒤를 이을 당신의 씨에게 하나님이 되려 하셨습니다.” 그리고 그가 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእኂዝ
  english_pob_choice: as an everlasting possession
  chosen_korean: 영원한 소유
  alternatives_korean:
  - 영구한 소유
  - 영원한 기업
  - 영원한 소유물
  lexicon: 소유
  rationale: 소유가 소유권과 상속의 뉘앙스를 함께 담아, 본문의 ‘everlasting possession’을 자연스럽고 직접적으로 옮길 수 있습니다.
- source_word: ወለከዊነ፡ ለከ፡ አምላከ፡
  english_pob_choice: and to be God to you
  chosen_korean: 당신에게 하나님이 되려 하셨습니다
  alternatives_korean:
  - 당신의 하나님이 되려 하셨습니다
  - 당신에게 신이 되려 하셨습니다
  lexicon: 하나님
  rationale: POB가 명시한 ‘to be God to you’의 직접적 의미를 살려, 관계적 언약 표현으로 자연스럽게 번역했습니다.
- source_word: ወለዘርእከ፡ እምድኅሬከ።
  english_pob_choice: and to your seed after you
  chosen_korean: 또한 당신의 뒤를 이을 당신의 씨에게
  alternatives_korean:
  - 그리고 당신의 후손에게
  - 그리고 당신 뒤의 당신의 씨에게
  lexicon: 씨
  rationale: ‘씨’는 본문이 가진 언약적·후손적 의미를 보존하며, ‘after you’는 ‘뒤를 이을’로 관계와 계승을 분명히 했습니다.
theological_decisions:
- issue: 언약 공식의 직설성
  chosen_reading: ‘하나님이 되려 하셨습니다’로 옮겨, 하나님과 아브라함의 언약 관계를 완곡하게 약화시키지 않았습니다.
  alternative_readings:
  - ‘하나님이 되시고자 하셨습니다’
  - ‘당신의 하나님이 되실 것입니다’
  rationale: 게즈 원문과 POB의 영어가 모두 목적/의도 구조를 담고 있으므로, 결과를 단정하기보다 언약 의도를 드러내는 표현이 더 적합합니다.
  doctrine_reference: 언약 신학, 출 6:7 / 창 17:7의 자기 계시 공식
