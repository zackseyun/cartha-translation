  - severity: medium
    issue: ‘당신의 뒤를 이을 당신의 씨’의 중복과 어색한 수식
    rationale: 원문의 ‘당신 뒤의 씨’를 보존하면서도 ‘당신 뒤의 씨’로 더 자연스럽게 옮길 수 있습니다.
  - severity: low
