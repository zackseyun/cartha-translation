  text: But you will go to your fathers in peace, and you will be buried at a good old age.
translation:
  language: ko
  text: 그러나 당신은 평안히 당신의 조상들에게로 갈 것이며, 복된 노년에 묻힐 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰላም
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평강 가운데
  - 평화롭게
  lexicon: 평안하다
  rationale: 출발의 상태를 나타내는 부사로 자연스럽게 옮기면서, 단순한 외적 안전보다 평안의 상태를 살렸습니다.
- source_word: ኀበ፡ አበዊከ፡
  english_pob_choice: to your fathers
  chosen_korean: 당신의 조상들에게로
  alternatives_korean:
  - 당신의 아버지들에게로
  - 당신의 선조들에게로
  lexicon: 조상
  rationale: 직역하면 ‘아버지들’이지만, 여기서는 조상 대대로 모인 사후 세계를 가리키는 관용적 표현으로 보아 한국어에서도 자연스러운 ‘조상들’로 옮겼습니다.
- source_word: በርእስ፡ ሠናይ።
  english_pob_choice: at a good old age
  chosen_korean: 좋은 노년에
  alternatives_korean:
  - 행복한 노년에
  - 장수하여
  lexicon: 노년
  rationale: ‘좋은’은 나이의 양이 아니라 삶의 질과 충만함을 가리키므로, 결과 상태를 해치지 않게 ‘좋은 노년’으로 보존했습니다.
theological_decisions:
- issue: 사후 이동과 매장 표현의 직설성
  chosen_reading: ‘당신의 조상들에게로 가게 되며’와 ‘묻히게 될 것입니다’를 그대로 살려, 죽음과 장례를 완곡하게 숨기지 않았습니다.
  alternative_readings:
  - ‘세상을 떠나’
  - ‘장사되실 것입니다’
  rationale: 게으른 완곡어법보다 원문이 가진 운명 선언의 직접성을 유지하는 편이 서사와 예언의 힘을 더 잘 드러냅니다.
  doctrine_reference: 죽음/장례의 서술적 직설성 유지
