- from: 아브람은 기뻐하며 이 모든 일을 아내 사래에게 말했고, 그녀가 아직 출산하지 못하는데도 자기에게 자손이 생기리라고 믿었습니다. 그리고 사래는 남편 아브람에게 권하여 그에게 말했습니다. "내 이집트인 여종 하갈에게 들어가십시오. 어쩌면 내가 그를 통해 당신을 위해 자손을 세울 수 있을지도 모릅니다." 아브람은 아내 사래의 말을 듣고 그녀에게 말했습니다. "그렇게 하십시오." 그리고 그녀는 그녀를 데려갔습니다.[a]
