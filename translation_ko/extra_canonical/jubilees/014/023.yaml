translation:
  language: ko
  text: 아브람은 기뻐했습니다. 그는 이 모든 일을 아내 사래에게 말했고, 사래가 아직 아이를 낳지 못하고 있었지만 자신에게 자손이 생기리라고 믿었습니다. 사래는 남편 아브람에게 권면하며 말했습니다. “내 이집트인 여종 하갈에게 들어가십시오. 어쩌면 내가 그녀에게서 당신을 위해 자손을 세울 수 있을지도 모릅니다.” 아브람은 아내 사래의 말을 듣고 그녀에게 말했습니다. “그렇게 하십시오.” 그리고 그녀는 하갈을 데려갔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 사래는 하갈을 데려갔습니다.”
    reason: 원문은 마지막 절의 주어를 여성 단수 대명사로 표현합니다. 문맥상 사래를 가리키지만, 명시적 이름을 보충하는 번역 가능성을 표시합니다.
