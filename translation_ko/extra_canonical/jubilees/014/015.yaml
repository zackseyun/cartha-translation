translation:
  language: ko
  text: 또 나는 그들이 종으로 삼길 민족도 심판할 것입니다. 그 뒤에 그들은 그곳에서 많은 재산을 가지고 나올 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ፡
  english_pob_choice: And I will also judge the nation
  chosen_korean: 또 나는 … 민족도 심판할 것입니다
  alternatives_korean:
  - 그리고 나는 … 민족을 심판할 것입니다
  - 또 나는 … 나라를 심판할 것입니다
  lexicon: 민족
  rationale: enclitic ኒ를 반영해 ‘또’로 처리하고, 대상 집단은 문맥상 한 민족/국가 집단을 가리키므로 ‘민족’이 가장 직접적입니다.
- source_word: እለ፡ ይትቀነዩ፡
  english_pob_choice: to whom they will be enslaved
  chosen_korean: 그들이 종으로 삼길
  alternatives_korean:
  - 그들이 노예가 될
  - 그들이 복종당할
  lexicon: 종
  rationale: POB의 audit trail이 ‘enslaved’의 피동 상태를 유지하므로, 문맥상 억압적 예속을 분명히 드러내는 ‘종으로 삼다’가 가장 적합합니다.
- source_word: ወእምድኅረዝ፡ ይወፅኡ፡ እምህየ፡
  english_pob_choice: and after this they will come out from there
  chosen_korean: 그 뒤에 그들은 그곳에서 나올 것입니다
  alternatives_korean:
  - 그 후 그들은 거기서 나올 것입니다
  - 그리고 그 뒤에 그들은 그곳을 떠날 것입니다
  lexicon: 그곳에서 나올 것입니다
  rationale: ‘from there’의 공간적 출처를 살리되, 한국어에서 자연스러운 서술어로 ‘나올 것입니다’를 택했습니다.
- source_word: ምስለ፡ ጥሪት፡ ብዙኅ።
  english_pob_choice: with much property
  chosen_korean: 많은 재산을 가지고
  alternatives_korean:
  - 많은 소유물을 가지고
  - 큰 재물을 가지고
  lexicon: 재산
  rationale: 출애굽기/창세기 계열의 약속 공식에서 소유의 축적을 가리키므로, 현대 한국어에서 가장 직관적인 ‘재산’을 사용했습니다.
theological_decisions:
- issue: ‘judge the nation’의 심판 표현
  chosen_reading: 하나님이 압제한 민족을 심판하신다는 선포로 읽었습니다.
  alternative_readings:
  - 단순한 법정적 판결 선언
  - 도덕적 평가 선언
  rationale: 문맥상 아브람의 후손을 예속시킨 민족에 대한 하나님의 응보적 심판을 가리키므로, ‘심판할 것입니다’로 직접 옮기는 것이 적절합니다.
  doctrine_reference: 창세기 15:14의 출애굽 예고와 연관된 신적 심판 주제
