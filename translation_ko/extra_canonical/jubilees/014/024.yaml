  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
  footnotes:
  - marker: a
    text: Or 'to Abram as a wife'.
    reason: previous_rendering
translation:
  language: ko
  text: 사라가 자기 여종이자 이집트 여자인 하갈을 데려다가 자기 남편 아브람에게 아내로 주었습니다. 아브람이 하갈에게 들어갔고, 하갈이 임신하여 아들을 낳았으며, 아브람은 그의 이름을 이스마엘이라 불렀습니다. 그때는 이 주간의 다섯째 해였고, 그 해는 아브람이 여든여섯 살이 되던 해였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሶራ
  english_pob_choice: Sarah took
  chosen_korean: 사라가 데려다가
  alternatives_korean:
  - 사라가 취하였고
  - 사라가 받아
  lexicon: 고유명사
  rationale: 원문과 POB 수정본이 모두 사라를 행위 주어로 제시하므로, 동사를 풀어 ‘데려다가’로 옮겨 사건 진행을 자연스럽게 살렸습니다.
- source_word: ለአጋር፡ ለአአታ፡ ግብጻዊት፡
  english_pob_choice: Hagar, her maidservant, the Egyptian
  chosen_korean: 자기 여종이자 이집트 여자였던 하갈
  alternatives_korean:
  - 자기 시녀이자 이집트 사람인 하갈
  - 자기 종이자 이집트 여자인 하갈
  lexicon: 고유명사
  rationale: ‘여종’은 종속적 신분을 분명히 드러내며, ‘이집트 여자’는 지명형 형용을 한국어로 자연스럽게 풀었습니다.
- source_word: ትኩኖ፡ ብእሲተ
  english_pob_choice: as a wife
  chosen_korean: 아내로
  alternatives_korean:
  - 아내가 되도록
  - 아내로서
  lexicon: 관계표현
  rationale: 게에즈 원문은 아브람에게 아내로 주는 관계 설정을 말하므로, 단순 소유가 아니라 혼인 관계임을 ‘아내로’로 간명하게 반영했습니다.
- source_word: ወጸውዐ፡ ስሞ፡ ይስማዔል፡
  english_pob_choice: and he called his name Ishmael
  chosen_korean: 아브람은 그의 이름을 이스마엘이라 불렀습니다
  alternatives_korean:
  - 그는 그의 이름을 이스마엘이라 불렀습니다
  - 그리고 그의 이름을 이스마엘이라 지었습니다
  lexicon: 서술동사
  rationale: 주어를 분명히 해서 행위 주체를 드러냈고, 성경적 이름 부여 관용을 살려 ‘불렀습니다’로 옮겼습니다.
- source_word: በዓመተ፡ ኃምስ፡ ዘዘሰብዐ፡
  english_pob_choice: in the fifth year of this week
  chosen_korean: 이 주간의 다섯째 해
  alternatives_korean:
  - 이 주의 다섯째 해
  - 이 주간의 5년째 해
  lexicon: 연대표현
  rationale: 쥬빌리서의 주간 연대 체계를 그대로 드러내기 위해 ‘week’의 단순 현대어화보다 구조를 보존하는 표현을 택했습니다.
theological_decisions:
- issue: 가내 신분 관계의 번역
  chosen_reading: ‘여종’으로 옮겨 하갈의 종속적 지위를 드러냈습니다.
  alternative_readings:
  - 시녀
  - 하녀
  rationale: 원문과 POB 전통이 모두 단순한 집안일 담당이 아니라 소속·종속 관계를 지시하므로, 한국어에서도 그 긴장을 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 창세기 16장 및 갈라디아서 4장의 하갈 전승과 연결되는 본문 맥락
