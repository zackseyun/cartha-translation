- from: “네 자손이 이와 같을 것이다.” 그는 야훼를 믿었고, 그것이 그에게 의로 여겨졌습니다.[a][b]
  to: 별들. 그분이 그에게 말씀하셨습니다. “네 자손도 이와 같을 것입니다.” 그는 야훼를 믿었고, 그것은 그에게 의로 여겨졌습니다.
  rationale: 원문과 영어 POB에 있는 절두의 ‘별들’ 및 발화 연결을 복원했습니다. ‘그분’은 원문의 대명사적 연결을 유지하면서 한국어 합쇼체에서 발화자를 자연스럽게 나타냅니다. ‘그것은 … 의로 여겨졌습니다’는 원문의 수동적·판정적 표현과 영어 POB의 모호성을 보존합니다.
  reviewer_model: gpt-5.6-terra
