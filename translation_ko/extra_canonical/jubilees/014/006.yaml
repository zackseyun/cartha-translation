  text: the stars. And he said to him, “So will your seed be.” And he believed the LORD, and it was reckoned to him as righteousness.
translation:
  language: ko
  text: 별들. 그분이 그에게 말씀하셨습니다. “네 자손도 이와 같을 것입니다.” 그는 야훼를 믿었고, 그것은 그에게 의로 여겨졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ / your seed
  english_pob_choice: So will your seed be
  chosen_korean: 네 자손
  alternatives_korean:
  - 네 씨
  - 네 후손
  lexicon: 씨/자손
  rationale: 직접적인 후손 약속을 한국어에서 자연스럽게 드러내기 위해 ‘자손’을 택했습니다. ‘씨’는 원문 대응은 더 가깝지만 현대어에서 다소 난해할 수 있습니다.
- source_word: አምኖ፡ ለእግዚአብሔር / believed the LORD
  english_pob_choice: he believed the LORD
  chosen_korean: 그는 야훼를 믿었고
  alternatives_korean:
  - 그는 주를 믿었고
  - 그는 여호와를 믿었고
  lexicon: YHWH
  rationale: source의 하나님의 고유명에 맞춰 POB 기본값인 ‘야훼’를 사용했습니다. 영어 POB의 LORD는 여기서 야훼를 가리키는 신명호칭으로 이해했습니다.
- source_word: ወተኈለቍ፡ ጽድቀ / it was reckoned to him as righteousness
  english_pob_choice: it was reckoned to him as righteousness
  chosen_korean: 그것이 그에게 의로 여겨졌습니다
  alternatives_korean:
  - 그것이 그에게 의로 계산되었습니다
  - 그것이 그에게 의로 간주되었습니다
  lexicon: reckoned as righteousness
  rationale: 법정적·회계적 뉘앙스를 유지하면서도 현대 한국어에서 자연스럽게 읽히도록 ‘의로 여겨지다’를 택했습니다.
theological_decisions:
- issue: ‘reckoned as righteousness’의 법정적 의미 유지
  chosen_reading: 행위 자체가 의가 되었다기보다, 믿음이 의로 간주되었다는 문법을 살렸습니다.
  alternative_readings:
  - 의롭게 되었다
  - 의로 인정받았다
  rationale: 원문은 결과 판정의 어조를 가지므로, 신학적 함의를 흐리지 않도록 ‘여겨졌습니다’로 옮겼습니다.
  doctrine_reference: 칭의의 법정적/선언적 표현
- issue: YHWH 고유명 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본값에 따라 야훼를 사용하여 원문 고유명성과 추적 가능성을 유지했습니다.
  doctrine_reference: 구약 신명호칭 표기 원칙
