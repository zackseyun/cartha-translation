- source_word: ወሐነጸ፡ ምሥዋዐ፡
  english_pob_choice: And he built an altar there
  chosen_korean: 그가 거기에 제단을 쌓고
  alternatives_korean:
  - 그는 거기에 제단을 만들고
  - 그가 거기에서 제단을 세우고
  lexicon: 제의 표현
  rationale: ‘쌓다’는 제단 निर्माण을 뜻하는 한국어 성경 문맥의 자연스러운 대응어이며, 건축 행위를 분명히 드러냅니다.
- source_word: ወዘብሐ፡
