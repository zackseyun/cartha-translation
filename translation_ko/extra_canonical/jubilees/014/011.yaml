  - 희생을 바쳤습니다
  lexicon: 제의 표현
  rationale: Geez 동사는 제의적 ‘제물 바침’을 가리키므로, 한국어에서는 포괄적인 ‘제사를 드리다’로 옮겨 문맥상 예배 행위를 살렸습니다.
theological_decisions:
- issue: ‘제사를 드리다’의 범위
  chosen_reading: 본문은 단순한 건축 묘사에 그치지 않고, 그 장소에서의 예배 행위를 함께 제시합니다.
  alternative_readings:
  - 단순히 제물만 바쳤다는 이해
  - 제단 설치와 별개의 행위로 보는 이해
  rationale: 히브리 전통의 제단-희생 연결을 반영하되, 본문이 추가 설명 없이 두 행위를 병렬로 제시하는 점을 유지했습니다.
  doctrine_reference: 창세기/족장 전승의 제의 서술
