  - 마므레의 참나무
  lexicon: 지명+수목어휘
  rationale: Geez 원문은 특정 나무를 가리키며, 영어 POB의 oak를 한국어로는 성경 문맥에 자연스러운 ‘상수리나무’로 옮겨 과도한 식물학적 구체화를 피했습니다.
