  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: ko
  text: 아브람에게 깊은 잠이 내렸습니다. 보니 큰 어둠의 공포가 그에게 내렸습니다. 아브람에게 다음과 같은 말씀이 전해졌습니다. 「너의 자손이 자기들의 땅이 아닌 곳에서 이방인이 될 것이며, 그 땅의 사람들이 그들을 종으로 삼아 사백 년 동안 괴롭힐 것이다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድንጋፄ / ግርማ ዐቢይ ጽልመት
  english_pob_choice: a deep sleep ... a great terror of darkness
  chosen_korean: 깊은 잠 ... 큰 흑암의 두려움
  alternatives_korean:
  - 깊은 잠 ... 큰 어둠의 공포
  - 깊은 잠 ... 흑암의 큰 두려움
  lexicon: 없음
  rationale: Geez 본문은 ‘깊은 잠’과 ‘큰 흑암의 두려움’의 병치를 두드러지게 하므로, ‘흑암’을 살려 단순한 어둠보다 더 강한 심판적/신현적 분위기를 유지했습니다.
- source_word: ወተ ብህለ ለአብራም
  english_pob_choice: And it was said to Abram
  chosen_korean: 그리고 아브람에게 이렇게 말했습니다
  alternatives_korean:
  - 그리고 아브람에게 말해졌습니다
  - 아브람에게 이렇게 말씀하셨습니다
  lexicon: 없음
  rationale: 수동형의 비인칭 표현을 한국어에서 자연스럽게 풀되, 본문이 전하는 계시의 전달성을 유지하기 위해 ‘말했습니다’로 옮겼습니다.
- source_word: ፈላሴ ... ይከውን ... ዘርእከ
  english_pob_choice: your seed will be aliens
  chosen_korean: 당신의 씨가 ... 나그네가 되어
  alternatives_korean:
  - 당신의 자손이 ... 타국인이 되어
  - 당신의 후손이 ... 이방인이 되어
  lexicon: 없음
  rationale: 여기서 ‘씨’는 집합적 후손을 가리키는 약속 언어를 보존하며, ‘나그네가 되어’로 타지 체류와 비소속 상태를 함께 나타냈습니다.
- source_word: ወይቀንይዎሙ ወያሐምምዎሙ
  english_pob_choice: they will enslave them and afflict them
  chosen_korean: 그들을 종으로 삼고 ... 괴롭힐 것입니다
  alternatives_korean:
  - 그들을 노예로 삼고 ... 학대할 것입니다
  - 그들을 종살이하게 하고 ... 억압할 것입니다
  lexicon: 없음
  rationale: 게즈 동사는 강제 예속과 고통을 함께 가리키므로, 첫 동사는 예속을 드러내는 ‘종으로 삼다’로, 둘째는 폭력적 고통을 넓게 포함하는 ‘괴롭히다’로 옮겼습니다.
theological_decisions:
- issue: 예언적 계시의 화법과 인용부호 처리
  chosen_reading: ‘그리고 아브람에게 이렇게 말했습니다’ 뒤에 직접 인용을 두어, 계시 내용과 서술을 구분했습니다.
  alternative_readings:
