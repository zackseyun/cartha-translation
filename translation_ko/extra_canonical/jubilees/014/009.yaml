  source_fidelity: 게에즈어의 반복 호칭, ‘무엇으로 알겠는가’라는 수단·표지 질문, 상속의 미래 의미, 그리고 ‘내게/나를 위하여’ 암송아지를 가져오라는 명령을 보존했습니다. 다만 원문의 ሊተ는 단순한 도착점인 ‘내게’보다 수익자 의미를 드러내는 ‘나를 위하여’가 더 안전합니다.
