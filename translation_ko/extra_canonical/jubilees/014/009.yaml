  yaml_path: translation/extra_canonical/jubilees/014/009.yaml
  text: “Lord, Lord, by what shall I know that I will inherit it?” And he said to him, “Bring me a three-year-old heifer,”
translation:
  language: ko
  text: “주님, 주님, 제가 무엇으로 그것을 상속받을 것을 알겠습니까?” 그가 그에게 말했습니다. “나를 위하여 삼 살 된 암송아지를 가져오십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚኦ፡ እግዚኦ፡
  english_pob_choice: Lord, Lord
  chosen_korean: “주님, 주님,”
  alternatives_korean:
  - “주, 주,”
  - “야훼, 야훼,”
  lexicon: κύριος / 호칭
  rationale: 여기서는 직접 부름의 호칭이므로 한국어 공용 성경에서 자연스러운 ‘주님’을 유지했습니다. 본문의 반복도 그대로 살렸습니다.
- source_word: በምንት፡ አአምር፡
  english_pob_choice: by what shall I know
  chosen_korean: “제가 무엇으로 … 알 수 있습니까?”
  alternatives_korean:
  - “어떻게 … 알겠습니까?”
  - “무엇으로 … 알 수 있겠습니까?”
  lexicon: γινώσκω / 알다
  rationale: 근거를 묻는 표현이므로 ‘무엇으로’와 ‘알 수 있습니까’를 함께 써서 수단/표지를 묻는 뉘앙스를 살렸습니다.
- source_word: እወርሳ
  english_pob_choice: I will inherit it
  chosen_korean: “제가 그것을 상속받게 될지”
  alternatives_korean:
  - “내가 그것을 차지하게 될지”
  - “내가 그것을 물려받게 될지”
  lexicon: κληρονομέω / 상속받다
  rationale: 동사의 핵심은 상속·유업 수령이므로 ‘상속받다’를 택했습니다. 대상 ‘it’은 문맥상 약속된 땅/유업을 가리키지만, 본 절만으로는 중립적으로 ‘그것’으로 두었습니다.
- source_word: ጣዕዋ
  english_pob_choice: a three-year-old heifer
  chosen_korean: “삼 살 된 암송아지”
  alternatives_korean:
  - “삼 년 된 암소”
  - “세 살 된 암송아지”
  lexicon: ζῶον / 제물 동물
  rationale: 영문 POB의 ‘heifer’를 따라 어린 암소로 옮겼고, ‘three-year-old’는 ‘삼 살 된’으로 직역해 연령 정보를 보존했습니다.
theological_decisions:
- issue: 직접화법의 경어 수준
  chosen_reading: 도입부는 질문자가 예의 있게 말하는 형식으로, 이어지는 하나님의 명령은 존대 명령형으로 처리했습니다.
  alternative_readings:
  - 전체를 평서체로 낮추는 방식
  - 고전적 기도체로 올리는 방식
  rationale: 본문은 대화 장면이므로 화자 전환을 드러내는 것이 중요합니다. 현대 합쇼체 안에서 직접 인용의 명령문만 자연스럽게 구분했습니다.
  doctrine_reference: 서사 내 화자 구분 원칙
- issue: ‘Lord’의 번역
  chosen_reading: 본문의 호칭은 ‘주님’으로 번역하고, 야훼 표기는 사용하지 않았습니다.
  alternative_readings:
  - ‘야훼’로 표기
  - ‘주’로 축약
  rationale: 게에즈 본문은 직접 호칭으로 ‘Lord’에 해당하며, 여기서는 문맥상 약속의 하나님께 부르는 호칭이지만 인용 본문 자체에야훼 대응 표지가 명시되지 않아 주님을 유지했습니다.
  doctrine_reference: 호칭/신명 표기 구분 원칙
