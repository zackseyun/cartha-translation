  text: all these, and poured out their blood upon the altar, and divided them in the middle, and placed them opposite one another, face to face; but the birds he did not divide. And birds came down upon the pieces,
translation:
  language: ko
  text: 이 모든 것을 제단 위에 쏟고, 그들의 피를 제단에 부으며, 그것들을 가운데로 쪼개어 서로 마주 보게 맞추어 놓았습니다. 그러나 새들은 쪼개지 않았습니다. 그리고 새들이 그 조각들 위로 내려왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወከዐወ፡ ደሞሙ፡ ውስተ፡ ምሥዋዕ፡
  english_pob_choice: poured out their blood upon the altar
  chosen_korean: 그들의 피를 제단에 부으며
  alternatives_korean:
  - 그들의 피를 제단 위에 쏟으며
  - 그들의 피를 제단에 쏟아 붓고
  lexicon: 쏟다 / 붓다
  rationale: 피를 제단 위에 흘려 붓는 제의적 행위를 자연스럽게 살리되, 문맥상 제단 위에 직접 바르는 느낌보다 '부으며'가 동작의 진행을 더 잘 드러냅니다.
- source_word: ነፈቆሙ፡ እማእከል፡
  english_pob_choice: divided them in the middle
  chosen_korean: 그것들을 가운데로 쪼개어
  alternatives_korean:
  - 그것들을 가운데서 나누어
  - 그것들을 반으로 가르고
  lexicon: 쪼개다 / 가르다
  rationale: 제물 분할의 구체성을 유지하기 위해 단순한 '나누다'보다 물리적 절단을 드러내는 표현을 택했습니다.
- source_word: ወአንበሮሙ፡ አንጻራቲሆሙ፡ በበገጾሙ፡
  english_pob_choice: placed them opposite one another, face to face
  chosen_korean: 서로 마주 보게 맞추어 놓았습니다
  alternatives_korean:
  - 서로 맞은편에 두었습니다
  - 얼굴을 마주하게 놓았습니다
  lexicon: 마주보다 / 맞추다
  rationale: 히브리식 제의 배열의 대칭성을 살리면서도 'face to face'의 직역 어감을 과도하게 어색하게 만들지 않도록 정리했습니다.
- source_word: ወለዐዋፊሰ፡ ኢነተፈ።
  english_pob_choice: but the birds he did not divide
  chosen_korean: 그러나 새들은 쪼개지 않았습니다
  alternatives_korean:
  - 그러나 새들은 나누지 않았습니다
  - 하지만 새들은 가르지 않았습니다
  lexicon: 새들 / 쪼개다
  rationale: 앞선 분할 동사를 반복해 대비를 분명히 했고, 문장 구조도 원문의 대조를 유지했습니다.
theological_decisions:
- issue: 제의적 피 흘림과 분할 장면의 서술 톤
  chosen_reading: 서술을 과장하거나 상징화하지 않고, 원문의 제사 행위를 있는 그대로 묘사하는 방향을 택했습니다.
  alternative_readings:
  - 상징적 의미를 덧붙여 해석적으로 옮김
  - 더 완곡한 표현으로 제의성을 약화시킴
  rationale: 본문은 해설보다 행위 묘사에 집중하므로, 독자가 장면의 거칠고 제의적인 성격을 직접 인지하도록 하는 것이 source-direct합니다.
  doctrine_reference: 서사 본문 번역 원칙; 제의 묘사 보존
- issue: ‘새들이 조각들 위로 내려왔습니다’의 서술 유지
  chosen_reading: 새들이 실제로 조각들 위로 내려오는 장면을 평서로 유지했습니다.
  alternative_readings:
  - 새들이 날아들었습니다
  - 새들이 덮쳤습니다
  rationale: 원문은 침입적 접근을 단순 진술하므로, 해석적 뉘앙스보다 장면의 사실성을 우선했습니다.
  doctrine_reference: 서사적 직서술 보존
