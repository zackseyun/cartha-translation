  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
  footnotes:
  - marker: a
    text: The first-person plural ('we made the covenant') reflects Jubilees' heavenly mediation framework. It is likely the angelic narrator speaking within the revelation to Moses.
    reason: cross_reference
    anchor_ref: '14:22'
translation:
  language: ko
  text: 그리고 이 날에 우리는 아브람과 언약을 맺었습니다[a]. 곧 이 달에 노아와 맺었던 것처럼 말입니다. 아브람은 그것을 자기에게 영원한 절기와 규례로 새롭게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተካየድነ ኪዳነ
  english_pob_choice: we made the covenant
  chosen_korean: 우리는 언약을 맺었습니다
  alternatives_korean:
  - 우리는 계약을 맺었습니다
  - 우리는 조약을 세웠습니다
  lexicon: ኪዳን
  rationale: 히브리계 전승의 언약 개념을 살리기 위해 ‘언약’을 택했고, 완료형 서술은 문맥상 과거 완료적 사건으로 자연스럽게 옮겼습니다.
- source_word: በዛቲ ወርኅ
  english_pob_choice: in this month
  chosen_korean: 이 달에
  alternatives_korean:
  - 이 달 안에
  - 이번 달에
  lexicon: ወርኅ
  rationale: 달의 단위 표현을 간결하게 살리면서, 전승의 시간 지시를 한국어로 자연스럽게 유지했습니다.
- source_word: ሐደሶ፡ በበዓል፡ ወለሥርዓት
  english_pob_choice: renewed it as a festival and as an ordinance
  chosen_korean: 그것을 자기에게 영원한 절기와 규례로 새롭게 하였습니다
  alternatives_korean:
  - 그것을 축제와 규례로 다시 세웠습니다
  - 그것을 자기의 절기와 규례로 갱신하였습니다
  lexicon: በዓል / ሥርዓት
  rationale: ‘절기’는 종교적 기념일 성격을, ‘규례’는 정해진 법도·의례적 규정을 각각 살렸고, ‘새롭게 하다’로 POB의 renew 의미를 보존했습니다.
- source_word: ሎቱ እስከ ለዓለም
  english_pob_choice: for himself forever
  chosen_korean: 자기에게 영원한
  alternatives_korean:
  - 영원히 자기의
  - 영구히 그의
  lexicon: ለዓለም
  rationale: ‘영원히’의 시간성을 분명히 하되, 문맥상 언약의 소유·귀속 관계를 드러내기 위해 ‘자기에게’로 옮겼습니다.
theological_decisions:
- issue: We-language in the covenant making
  chosen_reading: ‘우리는’은 본문 화자가 하늘의 중재적 존재로서 아브람과 언약을 맺었다는 서술을 그대로 반영합니다.
  alternative_readings:
  - 일반 역사서술처럼 ‘그들은’으로 순화하기
  - ‘하나님께서’로 주어를 명시하기
  rationale: 영어 POB의 주석처럼 1인칭 복수는 유대묵시 전승의 하늘 중재 구조를 보여 주므로, 화자를 평면화하지 않고 유지하는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 제2성전기 묵시문학의 천상 중재 서술
- issue: Renewed as festival and ordinance
  chosen_reading: ‘절기와 규례’는 단순한 행사와 규칙이 아니라 언약 표지로서의 예배·공동체 질서를 함께 가리킵니다.
  alternative_readings:
  - 단순히 기념일과 법으로 옮기기
  - 예식과 제도로 일반화하기
  rationale: 본문의 축제/규례 병치는 언약이 시간적 기억과 실천 규범 둘 다로 제도화되었음을 나타내므로, 둘을 분리해 보존했습니다.
  doctrine_reference: 언약 표지와 공동체 규범의 결합
