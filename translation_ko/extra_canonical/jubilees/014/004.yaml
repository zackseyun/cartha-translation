lexical_decisions:
- source_word: ዘይወፅእ፡ እምከርሥከ
  english_pob_choice: the one who comes out from your own body
  chosen_korean: 당신 몸에서 나오는 자
  alternatives_korean:
  - 당신의 몸에서 나오는 자
  - 당신 몸으로부터 나오는 자
  - 당신의 몸에서 태어나는 자
  lexicon: source phrase
  rationale: 출생/후손의 직역을 유지하되, 한국어에서 자연스러운 친족·후손 표현으로 다듬었습니다. "몸에서"는 원문의 신체 출처 표현을 살리고, "당신"은 원문의 2인칭 직접 대상을 분명히 합니다.
- source_word: ይወርሰከ
  english_pob_choice: he will inherit you
  chosen_korean: 당신을 상속할 것입니다
  alternatives_korean:
  - 당신을 이어받을 것입니다
  - 당신의 것을 상속받을 것입니다
  - 당신의 상속자가 될 것입니다
  lexicon: source phrase
  rationale: 동사의 핵심은 ‘상속하다/유산을 받다’이므로, 직역 성향을 살려 "상속할 것입니다"를 택했습니다. 목적어 "당신"은 원문상 애매하지만, POB의 영어도 이를 그대로 반영하므로 그 긴장을 유지했습니다.
- source_word: וַאֲוּצְאוֹ אַפְנָא
  english_pob_choice: And he brought him outside
  chosen_korean: 그리고 그를 밖으로 데리고 나가
  alternatives_korean:
  - 그리고 그를 밖으로 이끌어 내어
  - 그리고 그를 밖으로 데리고 나갔습니다
  - 그는 그를 밖으로 데리고 나갔습니다
  lexicon: narrative verb phrase
  rationale: 서술 흐름을 살려 능동적 사건 전개를 자연스럽게 옮겼습니다. "밖으로"는 공간 이동을 분명히 하고, "데리고 나가"는 원문의 이끌어냄을 보존합니다.
- source_word: וַיֹּאמֶר ... נְצַר
  english_pob_choice: and said to him, “Look
  chosen_korean: 말씀하셨습니다. “보십시오
  alternatives_korean:
  - 말했습니다. “보십시오
  - 말하며 이르셨습니다. “보십시오
  - 말씀하셨습니다. “보라
  lexicon: speech formula
  rationale: 신적/권위적 발화의 공손한 서술로 "말씀하셨습니다"를 사용했고, 이어지는 명령형은 현대 한국어의 정중 명령 "보십시오"로 옮겨 독자에게 직접적인 촉구를 유지했습니다.
theological_decisions:
- issue: “he will inherit you”의 목적어가 인간의 상속 문맥에서 다소 낯설게 들리는 문제
  chosen_reading: 문맥의 긴장을 완화하지 않고 "당신을 상속할 것입니다"로 유지했습니다.
  alternative_readings:
  - '"당신의 것을 상속받을 것입니다"로 자연화'
  - '"당신의 상속자가 될 것입니다"로 해석적 보강'
  rationale: 히브리어/게즈 계열의 직설적 상속 표현이 주는 충격과 예언적 약속성을 보존하는 것이 본문 이해에 중요하므로, 의미를 매끈하게 바꾸지 않았습니다.
  doctrine_reference: source-text transparency
