  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
  footnotes:
  - marker: a
    text: The Ge'ez term can mean 'at dawn' or 'at the beginning', but in Jubilees' calendrical system it frequently designates the 'new moon' of the month.
    reason: cultural_note
    anchor_ref: '14:1'
  - marker: b
    text: Or 'I am your protector.”'.
    reason: previous_rendering
  - marker: c
    text: Or 'matter'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 후에, 이 주의 넷째 해, 셋째 달의 초하루에 야훼의 말씀이 꿈에서 아브람에게 임하여 말씀하셨습니다. 「두려워하지 마십시오, 아브람. 나는 당신의 보호자이며, 당신의 보상은 매우 클 것입니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘዝሱባዔ / new moon
  english_pob_choice: new moon
  chosen_korean: 초하루
  alternatives_korean:
  - 새달
  - 신월
  lexicon: calendrical term
  rationale: 주기적 달력 문맥에서 단순한 ‘날이 밝음’보다 월초를 가리키는 용법이므로, 한국어에는 ‘초하루’로 자연스럽고 기능적으로 옮겼습니다.
- source_word: እግዚአብሔር / the LORD
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: divine name
  rationale: 이 프로젝트의 기본 원칙에 따라 히브리 신명은 학술적 음역인 ‘야훼’로 옮기고, ‘주님’은 κύριος 일반 번역에만 씁니다.
- source_word: ቃለ፡ እግዚአብሔር / the word of the LORD
  english_pob_choice: the word of the LORD
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 야훼의 말
  - 주님의 말씀
  lexicon: fixed biblical collocation
  rationale: ‘말씀’은 성서적 어법에서 ‘word’의 표준적이고 격식 있는 대응이며, 하나님의 계시가 주어지는 문맥을 가장 안정적으로 드러냅니다.
- source_word: ሞገስከ / your protector (audited POB reading)
  english_pob_choice: I am your protector
  chosen_korean: 당신의 보호자
  alternatives_korean:
  - 당신을 지키는 이
  - 당신의 방패
  lexicon: role noun
  rationale: 영어 POB의 감사된 해석을 따라 관계적 보호 책임을 드러내는 명사형으로 옮겼고, 과도한 비유인 ‘방패’는 피했습니다.
theological_decisions:
- issue: 야훼의 자기 계시를 둘째 인칭 위로 발화로 어떻게 옮길지
  chosen_reading: “두려워하지 마십시오… 나는 당신의 보호자이며…”처럼 공손한 위로와 자기 계시를 함께 유지했습니다.
  alternative_readings:
  - “두려워하지 말라…” 같은 평서형 명령
  - “내가 너의 보호자다” 같은 반말식 직역
  rationale: 본문은 꿈속에서 아브람에게 직접 주시는 위로의 말씀이라, 합쇼체 명령과 1인칭 선언을 함께 살리되 한국어 문체는 현대적이고 품위 있게 유지하는 것이 적절합니다.
  doctrine_reference: 신적 발화의 존대 재현
