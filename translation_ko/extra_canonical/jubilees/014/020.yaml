  text: 그니스 사람들과 그니스 사람들과, 가드몬 사람들과 브리스 사람들과 르바임과 아르깃 사람들[a]과 아윗 사람들과 아모리 사람들과 가나안 사람들과 기르가스 사람들과 여부스 사람들입니다.
