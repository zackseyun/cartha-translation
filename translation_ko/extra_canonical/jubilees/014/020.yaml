translation:
  language: ko
  text: 겐 사람들과 그니스 사람들과 갓몬 사람들과 브리스 사람들과 르바임과 라킷 사람들[a]과 아위 사람들과 아모리 사람들과 가나안 사람들과 기르가스 사람들과 여부스 사람들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘라킷 사람들’로 옮긴 민족명은 여기의 게에즈어 전승형을 반영하며, 병행 전승에서는 다른 형태로 알려진 집단에 해당할 수 있습니다. 번역은 조화시키지 않고 전승된 형태를 보존합니다.
    reason: textual_variant
