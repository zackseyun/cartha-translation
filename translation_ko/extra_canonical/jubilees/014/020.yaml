  lexicon: 고유 민족명
  rationale: 영어 POB가 전승된 이형을 보존한 것처럼, 한국어도 표준화된 성경식 명칭보다 음역을 우선해 전승형을 드러냈습니다.
theological_decisions:
- issue: 민족명 열거를 표준 성경의 익숙한 형태로 조화할지 여부
  chosen_reading: 게에즈 전승에 따른 이명들을 그대로 음역해 열거를 보존했습니다.
  alternative_readings:
  - 표준 병행본문의 익숙한 민족명으로 통일
  - 주석 없이 정규화된 형태로 대체
  rationale: 본문은 계보/열거 목록의 전승 형식을 보여 주므로, 평준화하면 원문이 가진 이형 전승의 흔적이 사라집니다.
  doctrine_reference: 본문비평 및 전승보존 원칙
- issue: Rakites 계열 이명 처리
  chosen_reading: 각주로 전승형 보존을 표시했습니다.
  alternative_readings:
  - Arkites로 정규화
  - 주석 없이 번역문에 흡수
  rationale: 주어진 영어 POB가 전승형 보존을 명시하므로, 본문과 주석에서 그 결정을 반영했습니다.
  doctrine_reference: 텍스트 비평 주석 원칙
