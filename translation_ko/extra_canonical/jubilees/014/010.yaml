translation:
  language: ko
  text: “삼 년 된 암소와 삼 년 된 염소와 삼 년 된 숫양과 산비둘기와 집비둘기를 가져오십시오.” 그는 이 모든 것을 그 달 중간에[a] 가져왔으며, 그 곁에 머물고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 달 중간에’라는 구절은 게에즈어 본문에 명시되어 있습니다. 유빌리서는 예전과 연대기에 관련된 시점을 세밀하게 표시하는 경우가 많으므로 이 시간 표지를 유지했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ዘሠለስቱ፡ ዓመት፡
  english_pob_choice: three years old
  chosen_korean: 삼 년 된 것
  alternatives_korean:
