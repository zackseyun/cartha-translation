    rationale: 원문은 ‘by/at’라는 전치사로 끝나고 그 목적어는 다음 절에 이어집니다. ‘그 곁에’로 옮겨 미완결 연결을 보존하는 것이 더 충실합니다.
  - severity: low
    issue: 시간 표현과 동사 선택이 다소 부자연스러움
