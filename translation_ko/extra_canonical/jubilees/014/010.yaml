  - 그 달의 중간에
  lexicon: 시간 표현
  rationale: POB 각주가 지적하듯 이 구절은 달의 정확한 중간 시점을 뜻하므로, 의례적·연대기적 뉘앙스를 살려 직역했습니다.
- source_word: ይነብር፡ ኀበ፡
  english_pob_choice: he was dwelling by
  chosen_korean: 그곳에서 머물고 있었습니다
  alternatives_korean:
  - 그 옆에 머물고 있었습니다
  - ~곁에 거하고 있었습니다
  lexicon: 동사·전치사
  rationale: 게에즈 ኀበ는 여기서 ‘by/at’의 방향·근접을 나타내며, 다음 절과 이어질 장소가 아직 제시되지 않았으므로 과도하게 위치를 특정하지 않고 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 이 구절의 시간 표지 보존
  chosen_reading: ‘달의 한가운데’라는 명시적 시간 표현을 본문에 그대로 유지했습니다.
  alternative_readings:
  - 시간 표지를 생략하여 자연스럽게 완화
  - ‘그달 중간쯤’처럼 대략화
  rationale: 유빌리서는 연대기와 예전적 시점을 세밀하게 기록하는 경향이 있으므로, 원문이 드러내는 시간 정밀성을 보존하는 편이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 서사-연대기적 정확성
- issue: ‘머물고 있었습니다’의 미완결성
  chosen_reading: 장소를 아직 완결하지 않은 채 진행형으로 마무리했습니다.
  alternative_readings:
  - ‘그곳에 있었습니다’로 단순화
  - 다음 절의 지명을 미리 보충
  rationale: 게에즈의 ኀበ는 다음 절로 이어지는 전치사이므로, 이 절에서 장소를 완결하지 않고 열린 형태로 두어 절 경계를 보존했습니다.
  doctrine_reference: 문맥 보존 원칙
