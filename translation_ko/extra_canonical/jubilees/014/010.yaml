  naturalness: ‘달의 한가운데에’보다 달력상의 시점을 가리키는 ‘그 달 중간에’가 현대 한국어에서 더 자연스럽습니다. 제물 목록은 앞 절의 명령을 한국어에서 독립적으로 읽을 수 있도록 ‘가져오십시오’로 보완했습니다. 끝의 ‘그 곁에’는 다음 절에서 장소 명사가 이어지는 분절 상태를 드러냅니다.
  terminology: ‘암소/염소/숫양’, ‘산비둘기/집비둘기’는 제물 목록과 창세기 15장의 대응 구절에서 통용되는 구별을 유지합니다. 시간 표지는 생략하지 않고 보존합니다.
