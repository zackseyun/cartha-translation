  english_pob_choice: and a turtledove and a pigeon
  chosen_korean: 산비둘기와 집비둘기
  alternatives_korean:
  - 비둘기와 산비둘기
  - 멧비둘기와 비둘기
  lexicon: 조류 명칭
  rationale: 게에즈의 짝 표현을 한국어 성경 문맥에서 통용되는 두 새 이름으로 옮겨, 제물 항목의 구별을 유지했습니다.
- source_word: በ*መንፈቀ፡ ወርኅ፡
  english_pob_choice: in the middle of the month
  chosen_korean: 달의 한가운데
  alternatives_korean:
