  lexicon: 연령 표지
  rationale: 문맥상 앞 절의 제물 목록에 붙는 연령 표현이므로, 한국어에서는 자연스럽게 ‘삼 년 된 것’으로 처리해 앞 절과의 연결을 살렸습니다.
