lexical_decisions:
- source_word: ውስተ፡ ሰማይ፡
  english_pob_choice: Look toward heaven
  chosen_korean: 하늘을 바라보고
  alternatives_korean:
  - 하늘을 향해
  - 하늘을 보시고
  lexicon: heaven
  rationale: 영어 POB의 보강된 명령형 ‘Look’에 맞춰 단순 방향표현이 아니라 시선의 행위를 드러내는 ‘바라보고’로 옮겼습니다.
- source_word: ወ*ኈልቍ፡ ከዋክብተ፡
  english_pob_choice: and count the stars
  chosen_korean: 별들을 세어 보십시오
  alternatives_korean:
  - 별을 세십시오
  - 별들을 헤아려 보십시오
  lexicon: count / stars
  rationale: ‘count’의 직접 명령을 살리되, 현대 한국어에서 자연스러운 공손 명령인 ‘세어 보십시오’로 옮겼습니다.
- source_word: እመ፡ ትክል፡ ኈልቈቶሙ።
  english_pob_choice: if you are able to count them
  chosen_korean: 셀 수 있다면 말입니다
  alternatives_korean:
  - 셀 수 있으면 말입니다
  - 헤아릴 수 있다면 말입니다
  lexicon: ability clause
  rationale: 가능성 조건을 분명히 하면서도 문장 흐름을 자연스럽게 유지하기 위해 ‘셀 수 있다면 말입니다’로 다듬었습니다.
- source_word: ወነጸረ፡ ሰማየ፡ ወርእየ፡
  english_pob_choice: And he looked toward heaven and saw
  chosen_korean: 그리고 그가 하늘을 바라보았고 보았습니다
  alternatives_korean:
  - 그리고 그는 하늘을 바라보았고 보았습니다
  - 그는 하늘을 바라보았고 보았습니다
  lexicon: narrative continuation
  rationale: 게에즈 원문의 서술 연결을 따라 ‘그리고’를 유지했고, 반복된 시선 동작과 결과를 직역에 가깝게 보존했습니다.
