lexical_decisions:
- source_word: ኤሊኤዜር
  english_pob_choice: Eliezer
  chosen_korean: 엘리에셀
  alternatives_korean:
  - 엘리에저
  - 엘리에셀
  lexicon: 고유명사
  rationale: 영어 POB가 본문에 명시한 이름 Eliezer를 반영하되, 한국어 음역은 표준 외래어 표기 관례에 맞게 옮겼습니다.
- source_word: ይወርሰኒ
  english_pob_choice: he will inherit me
  chosen_korean: 그가 저를 상속할 것입니다
  alternatives_korean:
  - 그가 저를 상속하겠습니다
  - 그가 제 것을 물려받을 것입니다
  lexicon: 상속하다
  rationale: Geez 동사의 ‘상속하다/물려받다’ 계열 의미를 살려 직역하되, 대상이 사람(‘저를’)인 난점을 한국어가 허용하는 범위에서 그대로 드러냈습니다.
- source_word: ዘርአ
  english_pob_choice: seed
  chosen_korean: 씨
  alternatives_korean:
  - 자손
  - 씨앗
  lexicon: 씨
  rationale: 영어 POB의 seed를 따라 혈통·후손의 의미를 담는 ‘씨’를 사용해, 단순한 식물 씨앗이 아니라 계보/후손 문제임을 보존했습니다.
- source_word: ኢይወርስከዝ
  english_pob_choice: This one will not inherit you
  chosen_korean: 이 사람은 당신을 상속하지 않을 것입니다
  alternatives_korean:
  - 이 사람은 당신을 물려받지 않을 것입니다
  - 이 사람은 당신의 상속자가 되지 않을 것입니다
  lexicon: 상속하다
  rationale: 부정 미래형을 그대로 살려, 앞의 상속 진술을 반박하는 신탁적 선언의 대조를 유지했습니다.
