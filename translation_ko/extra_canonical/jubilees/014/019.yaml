  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: ko
  text: 그날 야훼께서 아브람과 언약을 맺으시며 말씀하셨습니다. “네 자손에게 이 땅을 주겠다. 곧 이집트의 강에서부터 큰 강, 유프라테스 강까지이다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳነ እግዚአብሔር
  english_pob_choice: made a covenant with Abram
  chosen_korean: 야훼께서 아브람과 언약을 맺으시며
  alternatives_korean:
  - 주께서 아브람과 계약을 세우시며
  - 하나님께서 아브람과 언약을 맺으시며
  lexicon: 언약
  rationale: 게으즈 원문과 POB의 covenant를 직접 반영해 ‘언약’을 유지했고, 주어는 LORD에 맞춰 야훼로 옮겼습니다.
- source_word: לזרעך / ዘርእከ
  english_pob_choice: To your offspring
  chosen_korean: 네 자손에게
  alternatives_korean:
  - 네 씨에게
  - 네 후손에게
  lexicon: 씨/자손
  rationale: POB가 ‘offspring’로 다듬은 의미를 살리되, 한국어에서는 문맥상 자연스럽고 출생 계열을 분명히 하는 ‘자손’이 가장 직접적입니다.
- source_word: ἡ γῆ / ምድረ
  english_pob_choice: this land
  chosen_korean: 이 땅을
  alternatives_korean:
  - 이 지역을
  - 이 나라를
  lexicon: 땅
  rationale: 약속의 대상이 되는 지리적·언약적 토지를 가리키므로 ‘땅’이 가장 정확합니다.
- source_word: ἡ μεθόριος / እምፈለገ ... እስከ ...
  english_pob_choice: from the river of Egypt to the great river, the river Euphrates
  chosen_korean: 이집트의 강에서부터 큰 강, 유프라테스 강까지
  alternatives_korean:
  - 애굽의 강에서부터 큰 강 유프라테스까지
  - 이집트 강에서 큰 강 유프라테스에 이르기까지
  lexicon: 강 이름
  rationale: 원문의 경계 표현을 그대로 살리면서, POB의 ‘river of Egypt / the great river’ 구조를 한국어 어순에 맞게 옮겼습니다.
theological_decisions:
- issue: YHWH 전승 호칭
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 이 본문은 게으즈 원문에서 하나님의 고유명칭을 가리키므로, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
  doctrine_reference: YHWH transliteration policy
- issue: 언약과 약속 땅의 경계
  chosen_reading: 아브람과의 언약 속에서 특정 경계의 땅을 직접 약속하는 진술로 유지
  alternative_readings:
  - 상징적·비유적 약속으로 완화
  - 후대 지리 개념에 맞춰 일반화
  rationale: 원문은 구체적 경계선을 제시하는 서약 문장으로, 그 역사적·서술적 긴장을 약화하지 않고 그대로 드러내는 것이 본문 의도에 더 충실합니다.
  doctrine_reference: source-plain-sense principle
