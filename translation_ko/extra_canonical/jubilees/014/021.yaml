lexical_decisions:
- source_word: ወኀለፈ፡ ይእቲ፡ ዕለት፡
  english_pob_choice: And that day passed
  chosen_korean: 그리고 그날이 지나갔습니다
  alternatives_korean:
  - 그날이 지나갔고
  - 그 날이 지나갔습니다
  lexicon: source_note
  rationale: 원문의 사건 전환을 자연스럽게 살리되, 단순한 접속과 완료를 합쳐 한국어 서술 흐름으로 옮겼습니다.
- source_word: ወአዕረገ፡ አብራም፡
  english_pob_choice: Abram offered up
  chosen_korean: 아브람이 드렸고
  alternatives_korean:
  - 아브람이 올려드렸고
  - 아브람이 바쳤고
  lexicon: source_note
  rationale: 제의적 행위를 나타내는 동사로 ‘드리다’를 택해 원문의 희생 제사 맥락을 살렸습니다.
- source_word: ክፍላተ፡ ወአዕዋፈ፡ ወመሥዋዕቶሙ፡ ወሞጻሕቶሙ፡
  english_pob_choice: the pieces and the birds and their grain offerings and their drink offerings
  chosen_korean: 조각들과 새들과 그들의 소제와 그들의 전제
  alternatives_korean:
  - 조각들과 새들과 그들의 희생제물과 그들의 전제
  - 조각들과 새들과 그들의 제물과 그들의 전제
  lexicon: source_note
  rationale: መሥዋዕት을 여기서는 전통적 제사 용어인 ‘소제’로, ሞጻሕት을 ‘전제’로 옮겨 제의 항목의 구분을 보존했습니다.
- source_word: ወበልዐቶሙ፡ እሳት።
  english_pob_choice: and fire consumed them
  chosen_korean: 불이 그것들을 삼켰습니다
  alternatives_korean:
  - 불이 그것들을 태웠습니다
  - 불이 그것들을 먹어 삼켰습니다
  lexicon: source_note
  rationale: 직역보다도 소멸의 결과를 분명히 하는 ‘삼키다’가 원문의 완결된 소각 이미지를 더 잘 드러냅니다.
theological_decisions:
- issue: 제의 용어의 한국어 대응
  chosen_reading: ‘소제’와 ‘전제’로 구분하여 제사의 구성 요소를 보존했습니다.
  alternative_readings:
  - 두 항목을 모두 ‘제물’로 일반화함
  - ‘곡식제물’로 풀어 설명함
  rationale: 본문은 제의 항목들을 병렬로 열거하므로, 한국어에서도 항목별 구분을 유지하는 것이 원문 구조와 제사적 의미를 더 정확히 전달합니다.
  doctrine_reference: 제의 구조 보존
