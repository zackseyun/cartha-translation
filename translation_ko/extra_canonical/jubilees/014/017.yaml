translation:
  language: ko
  text: 그리고 넷째 세대에 그들은 여기로 돌아올 것입니다. 이는 아모리 사람들의 죄악이 지금까지는 다 차지 않았기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትውልድ ራብዕ
  english_pob_choice: in the fourth generation
  chosen_korean: 넷째 세대에
  alternatives_korean:
  - 네 번째 세대에
  - 4세대에
  lexicon: 세대
  rationale: 게으즈 원문의 ‘네 번째/넷째 세대’를 자연스러운 현대 한국어로 옮기되, 계보적 시간 단위를 분명히 하기 위해 ‘세대’를 유지했습니다.
- source_word: ይትመየጡ ዝየ
  english_pob_choice: they will return here
  chosen_korean: 그들은 여기로 돌아올 것입니다
  alternatives_korean:
  - 그들은 여기로 돌아갑니다
  - 그들은 이곳으로 돌아올 것입니다
  lexicon: 돌아오다
  rationale: 미래 시상과 장소 부사 ‘여기’를 그대로 살려, 예고된 귀환을 분명하게 표현했습니다.
- source_word: ኢተፈጸመ
  english_pob_choice: is not complete
  chosen_korean: 다 차지 않았기 때문입니다
  alternatives_korean:
  - 완성되지 않았기 때문입니다
  - 다 끝나지 않았기 때문입니다
  lexicon: 차다
  rationale: ‘완전하게 채워지다/다 차다’의 관용적 의미를 살려, 죄의 총량이 아직 채워지지 않았다는 뉘앙스를 유지했습니다.
- source_word: ኃጢአቶሙ ለአሞሬዎን
  english_pob_choice: the sin of the Amorites
  chosen_korean: 아모리 사람들의 죄악
  alternatives_korean:
  - 아모리 사람들의 죄
  - 아모리 족속의 죄악
  lexicon: 죄악
  rationale: 단순 행위보다 누적된 도덕적 타락을 가리키므로 ‘죄악’이 문맥에 더 가깝습니다.
theological_decisions:
- issue: 아모리 사람들의 죄가 아직 ‘채워지지 않았다’는 표현의 보존
  chosen_reading: 죄악이 지금까지는 다 차지 않았다고 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 죄악이 아직 끝나지 않았기 때문입니다
  - 죄악이 아직 완전히 드러나지 않았기 때문입니다
  rationale: 본문은 죄의 축적/충만이 심판 시점을 결정한다는 사상을 담고 있으므로, 이를 완화하지 않고 보존했습니다.
  doctrine_reference: 창세기 15:16의 심판 지연 모티프
- issue: 지시 부사 ‘여기’의 보존
  chosen_reading: ‘여기’로 돌아온다고 옮겨, 약속된 장소성을 유지했습니다.
  alternative_readings:
  - 그곳으로 돌아올 것입니다
  - 이곳으로 돌아올 것입니다
  rationale: 원문은 특정한 현재 위치로의 귀환을 말하므로, 추상화하지 않고 장소 지시를 살렸습니다.
  doctrine_reference: 약속된 땅/귀환 서사
