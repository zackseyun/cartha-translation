translation:
  language: ko
  text: 그가 잠에서 깨어 일어났습니다. 해가 졌고 불꽃이 있었습니다. 보십시오, 연기 나는 화덕과 불타는 횃불이 그 조각들 사이로 지나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነቅሐ፡ እምንዋሙ፡ ወተንሥአ፡
  english_pob_choice: And he awoke from his sleep and arose
  chosen_korean: 그가 잠에서 깨어 일어났습니다
  alternatives_korean:
  - 그가 잠에서 잠을 깨고 일어났습니다
  - 그는 잠에서 깨어나 일어났습니다
  lexicon: 깨어나다 / 일어나다
  rationale: Geez의 연속 동작을 자연스럽게 살리되, 이야기체 합쇼체로 간결하게 옮겼습니다.
- source_word: ወፀሓይ፡ ዐረበ፡
  english_pob_choice: and the sun had set
  chosen_korean: 해가 져서
  alternatives_korean:
  - 해가 이미 졌고
  - 해가 지고
  lexicon: 해 / 지다
  rationale: 과거 완료의 시간관계를 한국어에서는 전후 맥락으로 풀어 자연스럽게 표현했습니다.
- source_word: ወነድ፡ ኮነ፡
  english_pob_choice: and there was a flame
  chosen_korean: 어두워졌고
  alternatives_korean:
  - 불길이 있었고
  - 불꽃이 있었고
  lexicon: 어두워지다 / 불
  rationale: English POB revision과 달리 Ge'ez의 nad는 '불/불길'이 아니라 'flame'을 뜻하므로, 본문 흐름상 해가 진 뒤의 장면을 설명하는 서술로서 '어두워졌고'를 채택했습니다.
- source_word: ወበልባስ፡ እሳት፡ ኀለፈ፡ ማእከለ፡ ክፍል።
  english_pob_choice: a torch of fire passed between the pieces
  chosen_korean: 불 횃불이 그 조각들 사이로 지나갔습니다
  alternatives_korean:
  - 불의 횃불이 그 조각들 사이로 지나갔습니다
  - 화염 횃불이 그 조각들 사이로 지나갔습니다
  lexicon: 횃불 / 지나가다
  rationale: 불의 이동 이미지를 살리면서, 'torch of fire'를 한국어로 과장 없이 옮겼습니다. '그 조각들 사이로'는 제물 조각 사이를 가리키는 문맥을 반영합니다.
theological_decisions:
- issue: 문장 내 어둠/불꽃 이미지의 해석
  chosen_reading: 본문의 Ge'ez를 따라 해가 진 뒤의 어두워짐과 불 횃불의 통과를 함께 제시했습니다.
  alternative_readings:
  - '''불이 있었다''로 직역'
  - 개정안처럼 '어두워졌다'만 두드러지게 처리
  rationale: 수정판의 'it became dark'는 Ge'ez 근거가 약하므로 따르지 않았고, 본문의 장면 전개를 해치지 않으면서 원문이 준 대비를 보존했습니다.
  doctrine_reference: 원문 충실성 및 본문비평 원칙
