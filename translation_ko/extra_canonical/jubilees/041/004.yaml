translation:
  language: ko
  text: 유다가 자기 형제 오난에게 말했습니다. “네 형의 아내에게 들어가서, 그에게 형사 의무를 다하고, 네 형을 위해 후손을 일으키십시오.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቤ / said
  english_pob_choice: And Judah said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  lexicon: 말하다
  rationale: 서술문의 기본 동사로 자연스럽고, 이어지는 직접화법을 명확히 여는 현대 합쇼체에 맞습니다.
- source_word: እኁሁ / his brother
  english_pob_choice: his brother
  chosen_korean: 자기 형제
  alternatives_korean:
  - 그의 형제
  - 오난의 형제
  lexicon: 형제
  rationale: 원문 관계는 유다가 오난에게 말하는 장면이므로, 소유대명사 ‘his’가 가리키는 대상을 오해 없이 한국어로 풀어 ‘자기 형제’로 옮겼습니다.
- source_word: ባእ ኀበ ብእሲተ እኁከ
  english_pob_choice: Go in to your brother’s wife
  chosen_korean: 네 형의 아내에게 들어가서
  alternatives_korean:
  - 네 형수에게 들어가서
  - 네 형의 아내에게 가서
  lexicon: 가다/들어가다
  rationale: 성적 결합을 완곡하지만 분명하게 나타내는 히브리어식 관용을 따라 ‘들어가다’로 옮기되, 관계를 분명히 하기 위해 목적어를 유지했습니다.
- source_word: ወረከያ ናዕልተ
  english_pob_choice: perform a brother-in-law’s duty to her
  chosen_korean: 형사 의무를 다하고
  alternatives_korean:
  - 수혼 의무를 이행하고
  - 형부의 의무를 하고
  lexicon: 형사 의무
  rationale: 직역보다 한국어 독자가 제도적 의미를 이해할 수 있도록 ‘형사 의무’로 옮겼고, 동작의 완결을 나타내기 위해 ‘다하고’를 사용했습니다.
- source_word: አንሥእ
  english_pob_choice: raise up offspring for your brother
  chosen_korean: 네 형을 위해 후손을 일으키십시오
  alternatives_korean:
  - 네 형을 위해 자손을 세우십시오
  - 네 형에게 후손을 남기십시오
  lexicon: 후손을 일으키다
  rationale: ‘raise up’의 생식·가문 계승 의미를 살리면서, 원문이 요구하는 형제의 이름 지속을 드러내기 위해 ‘후손을 일으키다’로 옮겼습니다.
theological_decisions:
- issue: 형사 결혼 의무의 제도적 의미
  chosen_reading: 본문의 명령은 단순한 가족 권유가 아니라 죽은 형의 가문을 이어 주기 위한 수혼 의무를 지시하는 것으로 읽었습니다.
  alternative_readings:
  - 단순히 형수와 관계를 맺으라는 명령
  - 후손 생산만을 강조하는 명령
  rationale: 뒤의 ‘후손을 일으키다’와 함께 읽을 때, 원문은 생식 행위 자체보다 형제 계승을 위한 제도적 책임을 강조합니다.
  doctrine_reference: 족보 보존과 계대 계승의 문맥
