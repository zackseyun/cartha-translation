  source_fidelity: 현재의 ‘자기 형제 오난’은 ‘자기’가 유다를 가리켜 오난을 유다의 형제로 오해하게 합니다. 본문의 ‘그의 형제’는 문맥상 죽은 에르의 형제인 오난을 가리키므로, 한국어에서는 선행사를 밝혀야 합니다. 또한 ‘형사 의무’는 현대 한국어에서 자연스럽지 않고 다른 뜻으로도 읽힐 수 있습니다.
  naturalness: ‘에르의 동생 오난’, ‘수혼의 의무를 행하고’, ‘후사를 세우십시오’는 현대의 격식 있는 성경 한국어로 자연스럽고, 본문의 완곡한 성적·가계 계승 표현도 유지합니다.
  terminology: ‘수혼’은 죽은 형제의 아내와 결혼하여 후사를 잇는 제도를 가리키는 정확한 용어입니다. ‘후사를 세우다’는 여기서 요구되는 죽은 형제를 위한 계승을 자연스럽게 표현합니다.
