  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
  footnotes:
  - marker: a
    text: Or 'of the seventh week'.
    reason: previous_rendering
  - marker: b
    text: Or 'to shear his sheep.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 주간[a]의 다섯째 해에 유다의 아내 수아가 죽었습니다. 여섯째 해에 유다는 딤나에서 자기 양의 털을 깎으러 올라갔습니다. 그들이 다말에게 말하였습니다. “보십시오, 당신의 시아버지가 털을 깎으려고 딤나로 올라가고 있습니다.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역: “일곱째 주간의.”'
    reason: 영어 POB 감사 이력에 보존된 이전 독법을 투명하게 제시합니다. 다만 현 게으즈어 본문은 ‘이 주간의’를 지지합니다.
  - marker: b
    text: 직역하면 “깎으려고”입니다. 앞 문장에서 언급된 양의 털을 뜻하는 것으로 이해됩니다.
    reason: 게으즈어 마지막 동사 ይቅርጽ에는 목적어가 명시적으로 반복되지 않는 점을 반영합니다.
lexical_decisions:
- source_word: በዓመት ኃምስ ዘዝሱባዔ
  english_pob_choice: in the fifth year of this week
  chosen_korean: 이 주간의 다섯째 해
  alternatives_korean:
  - 이 주의 다섯째 해
  - 이 주간의 다섯 해
  lexicon: year / week formula
  rationale: 게으즈의 연대 공식은 주간(week) 단위 안의 연도를 가리키므로, POB의 'this week'를 따라 '이 주간'으로 옮기고 숫자 서열은 자연스러운 한국어로 풀었습니다.
- source_word: ብእሲተ፡ ይሁዳ
  english_pob_choice: the wife of Judah
  chosen_korean: 유다의 아내 수아
  alternatives_korean:
  - 유다의 아내
  - 유다의 아내 스와
  lexicon: proper name / kinship
  rationale: 문맥상 수아가 유다의 아내라는 점을 분명히 하면서, 고유명사는 한국어 독자에게 익숙한 형태로 옮겼습니다.
- source_word: ዐርገ ... ይቅርጽ
  english_pob_choice: went up ... to shear
  chosen_korean: 올라갔고 ... 양털을 깎으러
  alternatives_korean:
  - 올라갔고 ... 깎으러
  - 올라가 ... 털을 깎으러
  lexicon: shear / idiom
  rationale: 동작의 방향성인 '올라가다'를 살리고, 'shear'는 양의 털을 깎는 의미가 분명하므로 '양털을 깎다'로 구체화했습니다.
- source_word: አባግዒሁ
  english_pob_choice: his sheep
  chosen_korean: 자기 양털
  alternatives_korean:
  - 자기 양
  - 그의 양
  lexicon: possessive / sheep
  rationale: 게으즈 본문은 뒤의 '깎다'와 결합해 양털을 가리키는 압축적 표현이므로, 본문 의미를 자연스럽게 드러내는 방향으로 옮겼습니다.
- source_word: ይቅርጽ
  english_pob_choice: to shear
  chosen_korean: 양털을 깎으러
  alternatives_korean:
  - 깎으러
  - 털을 깎으러
  lexicon: verb aspect
  rationale: 본문 마지막의 간결한 동사만을 보존하되, 한국어에서는 목적을 나타내는 '-으러'로 자연스럽게 연결했습니다.
theological_decisions:
- issue: 연대 공식의 'week'와 'this week' 의미 보존
  chosen_reading: 이 주간
  alternative_readings:
  - 이 주
  - 이 주간의 주
  rationale: 희년서 특유의 주간-연도 계산법을 평준화하지 않고, 본문의 계산 체계를 드러내는 번역을 택했습니다.
