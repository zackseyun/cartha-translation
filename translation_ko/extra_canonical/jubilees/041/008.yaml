revisions:
- from: 그리고 이 주간의 다섯째 해에 유다의 아내 수아가 죽었습니다. 그리고 여섯째 해에 유다가 팀나에서 자기 양털을 깎으러 올라갔고, 사람들이 다말에게 말하기를, 「보십시오, 당신의 시아버지가 팀나로 양털을 깎으러 올라가고 있습니다」라고 하였습니다.[a][b]
  to: 그리고 이 주간[a]의 다섯째 해에 유다의 아내 수아가 죽었습니다. 여섯째 해에 유다는 딤나에서 자기 양의 털을 깎으러 올라갔습니다. 그들이 다말에게 말하였습니다. “보십시오, 당신의 시아버지가 털을 깎으려고 딤나로 올라가고 있습니다.”[b]
  rationale: 원문의 연대 공식과 마지막 동사의 목적어 생략은 유지하면서, 한국어 성경 지명 관례에 맞춰 ‘딤나’로 고치고, 앞 문장의 ‘그의 양들’을 ‘자기 양의 털’로 정확하고 자연스럽게 풀었습니다. 각주 표지도 실제로 해당하는 표현에 배치했습니다.
