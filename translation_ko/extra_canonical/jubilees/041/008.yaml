  source_fidelity: 연대 공식은 게으즈어 ዘዝሱባዔ에 따라 ‘이 주간’으로 옮긴 점이 정확합니다. 그러나 첫 번째 깎는 행위의 목적어 አባግዒሁ는 ‘그의 양들’이므로 ‘자기 양털’보다는 ‘자기 양의 털’이 더 충실합니다. 마지막 ይቅርጽ에는 목적어가 반복되지 않으므로 한국어에서도 ‘털을 깎으러’로 두어 그 생략을 보존하는 것이 좋습니다.
  naturalness: 합쇼체 문체는 자연스럽습니다. 다만 성경식 지명 표기에서는 ‘팀나’보다 ‘딤나’가 더 익숙하고 일관된 형태입니다. 인용문은 별도의 ‘말하였습니다’ 뒤에 직접화법으로 처리하면 문장 구조가 더 명료합니다.
  terminology: ‘수아’, ‘유다’, ‘다말’, ‘딤나’를 사용합니다. ‘주간’은 희년서의 연대 계산 단위를 보존하는 적절한 표현입니다.
