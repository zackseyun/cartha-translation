- source_word: ለእኁከ / 'offspring for your brother'
  english_pob_choice: offspring for your brother
  chosen_korean: “네 형을 위하여 자손을 낳게 하라.”
  alternatives_korean:
  - “네 형을 위해 후손을 내라.”
  - “네 형에게 자손이 생기게 하라.”
