  lexicon: 씨
  rationale: 성적 은유를 살리면서도 원문이 말하는 물질적 ‘seed’의 직접성을 유지하기 위해 ‘씨’로 옮겼습니다.
- source_word: በቅድመ፡ አዕይንተ፡ / in the sight of
  english_pob_choice: in the sight of
  chosen_korean: 보시기에
