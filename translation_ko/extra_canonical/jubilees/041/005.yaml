- issue: 문장이 본문 말미에서 끊기는 미완성 상태를 그대로 둘지 여부
  chosen_reading: 제공된 원문과 영어 감시문을 따라 ‘그것은 보시기에 악했습니다’에서 끝맺었습니다.
  alternative_readings:
