  text: “네 형을 위하여 자손을 낳게 하라.” 오난은 그 자손이 자기 것이 아니라 자기 형의 것임을 알았습니다. 그래서 그가 형의 아내에게 들어갔을 때, 씨를 땅에 쏟아 버렸습니다. 그리고 그것은 보시기에 악했습니다[a]
