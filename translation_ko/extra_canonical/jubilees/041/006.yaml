    issue: The final source word እንዘ is not represented in the Korean text.
    rationale: The em dash signals interruption but omits the temporal connective itself. A Korean incomplete connective such as ‘그동안…’ better reflects the extant source while avoiding conjectural completion.
  - severity: medium
    issue: Footnote anchor [a] has no corresponding footnote entry.
    rationale: The anchor must be supplied with a note explaining that the provided source text ends mid-construction; this also prevents readers from treating the ellipsis as a translation expansion.
