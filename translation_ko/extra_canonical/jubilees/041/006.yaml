  naturalness: ‘그리고 주님께서’ is unnecessarily awkward at the beginning of this excerpt. ‘주님께서 그를 죽이셨습니다’ is natural, formal-polite Korean. Rendering the cut-off connective as ‘그동안…’ makes the deliberate incompleteness intelligible in Korean.
  terminology: ‘주님,’ ‘유다,’ ‘다말,’ and ‘며느리’ are appropriate standard Korean biblical terminology. ‘죽이셨습니다’ accurately conveys the direct causative sense.
  issues:
