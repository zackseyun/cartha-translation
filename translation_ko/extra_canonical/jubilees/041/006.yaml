translation:
  language: ko
  text: 그리고 주님께서 그를 죽이셨습니다. 유다는 그의 며느리 다말에게 말하였습니다. "네 아버지의 집에 머무르십시오—"[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: YHWH
  rationale: 제공된 영어 POB가 이 절에서 단순히 ‘the LORD’로 옮기고 있으므로, 본문 흐름상 한국어 합쇼체에서는 자연스러운 존칭 호칭인 ‘주님’을 사용했습니다. 다만 이 단락은 창세기 인용 전승을 배경으로 하므로, 본문 내부에 직접 야훼를 표기할 근거는 부족합니다.
- source_word: ወቀተሎ
  english_pob_choice: and he put him to death
  chosen_korean: 그를 죽이셨습니다
  alternatives_korean:
  - 그를 죽게 하셨습니다
  - 그를 치셨습니다
  lexicon: מות / 죽이다 계열
  rationale: Geez 동사는 직접적 사망 초래를 가리키므로, 영어 POB의 의미를 따라 ‘죽이셨습니다’로 직역성 있게 옮겼습니다.
- source_word: ይሁዳ
  english_pob_choice: Judah
  chosen_korean: 유다
  alternatives_korean:
  - 유대
  - 유딧
  lexicon: 고유명사
  rationale: 성경에서 굳어진 표준 음역인 ‘유다’를 유지했습니다.
- source_word: ለትዕማር፡ መርዓቱ፡
  english_pob_choice: Tamar his daughter-in-law
  chosen_korean: 그의 며느리 다말에게
  alternatives_korean:
  - 그의 사위 아닌 다말에게
  - 며느리 다말에게
  lexicon: 고유명사 / 친족호칭
  rationale: ትዕማር은 다말, መርዓቱ는 관계를 분명히 하는 ‘그의 며느리’입니다. 한국어에서는 서술 흐름상 먼저 관계를, 뒤에 이름을 배치해 의미를 자연스럽게 살렸습니다.
- source_word: ንበሪ፡ ቤተ፡ አቡኪ፡ እንዘ፡
  english_pob_choice: Remain in your father’s house while...
  chosen_korean: 네 아버지의 집에 머무르십시오—
  alternatives_korean:
  - 네 아버지의 집에 남아 있으십시오—
  - 네 아버지의 집에 계십시오—
  lexicon: 머무르다 / 집
  rationale: ע/Ge'ez의 명령형과 장소구문을 따라 ‘머무르십시오’로 옮겼고, 원문이 እንዘ에서 끊기므로 문장을 완결하지 않고 대시로 남겨 절단된 상태를 반영했습니다.
theological_decisions:
- issue: 본문 종결부가 제공된 Ge'ez 문자열에서 끊겨 있음
  chosen_reading: 번역도 미완결로 끝내어, 본문이 이어질 내용을 보강하지 않았습니다.
  alternative_readings:
  - 영어 POB를 따라 ‘…과 같이’ 뒤를 보완해 완결문으로 처리
  - 문맥상 추정되는 나머지를 재구성
  rationale: 제공된 소스는 እንዘ፡에서 종료되며, 최신 수정 지침도 남은 부분을 보강하지 말라고 명시합니다. 따라서 독자에게 원문 절단 상태를 그대로 보여 주는 것이 가장 충실합니다.
  doctrine_reference: 본문 충실성 원칙
