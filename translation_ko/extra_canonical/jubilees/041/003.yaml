  - marker: a
    text: Or 'rebuked him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 유다가 그를 막았습니다. 그리고 유다의 맏아들 에르는 악했고, 야훼께서 그를 죽이셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአሕበሶ፡
  english_pob_choice: forbade him
  chosen_korean: 그를 막았습니다
  alternatives_korean:
  - 그를 금했습니다
  - 그를 제지했습니다
  - 그를 꾸짖었습니다
  lexicon: Geʽez ሐበሰ
  rationale: 이 동사는 ‘꾸짖다’보다 ‘막다/금하다/제지하다’의 의미가 맞으므로, 문맥에 맞게 결혼 시도를 제지하는 뜻을 드러냈습니다.
- source_word: ዔር፡ በኵሩ፡ ለይሁዳ፡
  english_pob_choice: Er, Judah’s firstborn
  chosen_korean: 유다의 맏아들 에르
  alternatives_korean:
  - 유다의 첫째 아들 에르
  - 유다의 장자 에르
  lexicon: 맏아들
  rationale: ‘በኵሩ’는 단순한 순서 정보가 아니라 장자의 지위를 가리키므로, 자연스러우면서도 그 의미를 살린 ‘맏아들’을 택했습니다.
- source_word: እግዚአብሔር።
  english_pob_choice: the LORD
  chosen_korean: 야훼께서
  alternatives_korean:
  - 주께서
  - 여호와께서
  - 하나님께서
  lexicon: 야훼
  rationale: 본 번역 원칙에 따라 히브리 성호 대응은 ‘야훼’로 옮겼고, 본문 속 주어로서 자연스럽게 주격 조사와 존대 서술을 맞췄습니다.
theological_decisions:
- issue: 하나님의 직접적 죽음 행위 표현
  chosen_reading: ‘야훼께서 그를 죽이셨습니다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘야훼께서 그를 치셨습니다’
  - ‘야훼께서 그를 제거하셨습니다’
  rationale: 본문은 에르의 죽음을 우연한 사건이 아니라 하나님의 직접 행위로 연결하므로, 그 신학적 긴장을 완화하지 않고 유지했습니다.
  doctrine_reference: 섭리와 심판에 대한 본문 고유의 진술
