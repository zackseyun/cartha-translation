  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
  footnotes:
  - marker: a
    text: Or 'be given as a wife to Judah'.
    reason: previous_rendering
  - marker: b
    text: Or 'wife. But Bedsu’el'.
    reason: previous_rendering
  - marker: c
    text: Or 'Wait until'.
    reason: previous_rendering
  - marker: d
    text: Or 'and Bed died'.
    reason: previous_rendering
translation:
  language: ko
  text: 「내 아들 셀라가 장성할 때까지는 과부로 지내십시오. 그러면 내가 그에게 당신을 아내로 주겠습니다.」 그가 장성했지만, 유다의 아내 베두엘은 자기 아들 셀라를 그에게 시집보내지 않았습니다. 그리고 베드[수엘]이 죽었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትመዐስቢ
  english_pob_choice: Remain a widow until
  chosen_korean: 과부로 지내십시오
  alternatives_korean:
  - 기다리십시오
  - 과부로 남아 있으십시오
  lexicon: Ge'ez phrase indicating widowhood state
  rationale: 단순히 ‘기다리다’보다 법적·서사적 상태를 드러내는 ‘과부로 지내다’가 원문의 무게를 더 잘 반영합니다.
- source_word: ይልህቅ
  english_pob_choice: grows up
  chosen_korean: 장성할 때까지
  alternatives_korean:
  - 자랄 때까지
  - 성인이 될 때까지
  lexicon: Ge'ez verb for growing up/maturing
  rationale: 소년의 성장 완료를 자연스럽게 나타내되, 혼인 가능 연령에 도달한다는 문맥을 살리기 위해 ‘장성하다’를 택했습니다.
- source_word: እሁበኪ
  english_pob_choice: I will give you ... as a wife
  chosen_korean: 아내로 주겠습니다
  alternatives_korean:
  - 아내로 넘기겠습니다
  - 아내로 드리겠습니다
  lexicon: Ge'ez giving formula in marriage context
  rationale: 혼인 제의의 직접성을 살려 ‘아내로 주겠다’로 옮겼고, ‘드리다’는 한국어 예배체 뉘앙스가 강해 피했습니다.
- source_word: ወኢኀደገት ... ከመ፡ ያውስብ
  english_pob_choice: did not let Shelah her son to marry
  chosen_korean: 자기 아들 셀라를 그에게 시집보내지 않았습니다
  alternatives_korean:
  - 자기 아들 셀라를 그와 결혼시키지 않았습니다
  - 자기 아들 셀라를 그에게 주지 않았습니다
  lexicon: Ge'ez causative marriage refusal
  rationale: 원문의 초점은 ‘혼인을 허락하지 않음’이므로 한국어 관용을 따라 ‘시집보내다’로 표현했습니다.
- source_word: ቤድ
  english_pob_choice: Bed[su'el] died
  chosen_korean: 베드[수엘]이 죽었습니다
  alternatives_korean:
  - 베드가 죽었습니다
  - 베두엘이 죽었습니다
  lexicon: Scribal truncation / broken personal name
  rationale: 본문이 ‘베드’에서 끊기므로, POB의 주석 취지에 맞춰 이름 보충분을 대괄호로 표기해 서기관적 절단을 드러냈습니다.
theological_decisions:
- issue: 혼인 주도 표현의 서사적 책임 소재
  chosen_reading: 유다가 약속한 혼인 제공과, 베두엘이 그것을 가로막은 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 중립적으로 단순 서술
  - 관습적 가족 서사로 완화
  rationale: 원문은 약속과 거부의 충돌을 통해 서사를 전개하므로, 그 긴장을 약화시키지 않도록 직접적으로 옮겼습니다.
  doctrine_reference: 서사 충실성 / 원문 긴장 보존
