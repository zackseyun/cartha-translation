lexical_decisions:
- source_word: አባግዒሁ
  english_pob_choice: his sheep
  chosen_korean: 그의 양 떼
  alternatives_korean:
  - 그의 양들
  - 그의 가축 떼
  lexicon: 양 떼
  rationale: 복수 명사로서 집합성을 살리기 위해 ‘양 떼’로 옮겼습니다.
- source_word: በቴምናታ
  english_pob_choice: in Timnah
  chosen_korean: 팀나에
