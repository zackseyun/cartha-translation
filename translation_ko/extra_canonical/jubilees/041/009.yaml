translation:
  language: ko
  text: '...그의 양 떼를 팀나에 두었습니다. 그리고 그는 과부의 옷을 벗고 베일을 두르고 몸을 단장했습니다.[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አባግዒሁ
  english_pob_choice: his sheep
  chosen_korean: 그의 양 떼
  alternatives_korean:
  - 그의 양들
  - 그의 가축 떼
  lexicon: 양 떼
  rationale: 복수 명사로서 집합성을 살리기 위해 ‘양 떼’로 옮겼습니다.
- source_word: በቴምናታ
  english_pob_choice: in Timnah
  chosen_korean: 팀나에
  alternatives_korean:
  - 팀나에서
  - 팀나 땅에
  lexicon: 팀나
  rationale: 지명은 현대 외래어 표기 관행에 따라 ‘팀나’로 옮기고, 전치사는 문맥상 자연스러운 부사격으로 처리했습니다.
- source_word: አልባሰ፡ ምዕስብናሃ
  english_pob_choice: the garments of her widowhood
  chosen_korean: 과부의 옷
  alternatives_korean:
  - 과부 신분의 옷
  - 과부의 의복
  lexicon: 의복/옷
  rationale: ‘widowhood’를 직접적으로 설명하는 소유격 표현으로, 과부 상태를 표시하는 옷이라는 뜻이 분명하므로 간결하게 ‘과부의 옷’으로 옮겼습니다.
- source_word: ገልባቤ
  english_pob_choice: a veil
  chosen_korean: 베일
  alternatives_korean:
  - 면사포
  - 덮개
  lexicon: 베일
  rationale: 본문의 덮어쓰는 천을 한국어에서 가장 무난하게 드러내는 말로 ‘베일’을 택했습니다.
theological_decisions:
- issue: 행동의 배열과 성격
  chosen_reading: 옷을 벗고 베일을 두르고 몸을 단장하는 연속 동작으로 옮겼습니다.
  alternative_readings:
  - ‘옷을 갈아입고 장식했다’로 완화
  - ‘자신을 꾸몄다’만으로 축약
  rationale: 게에즈 본문에 있는 세 동작(벗다, 입다/두르다, 꾸미다)을 모두 보존해야 장면의 의도와 진행이 살아납니다.
  doctrine_reference: 서사 본문의 표면 의미 보존 원칙
