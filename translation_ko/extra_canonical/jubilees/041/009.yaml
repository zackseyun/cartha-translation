  lexicon: 팀나
  rationale: 지명은 현대 외래어 표기 관행에 따라 ‘팀나’로 옮기고, 전치사는 문맥상 자연스러운 부사격으로 처리했습니다.
- source_word: አልባሰ፡ ምዕስብናሃ
  english_pob_choice: the garments of her widowhood
  chosen_korean: 과부의 옷
  alternatives_korean:
  - 과부 신분의 옷
  - 과부의 의복
  lexicon: 의복/옷
  rationale: ‘widowhood’를 직접적으로 설명하는 소유격 표현으로, 과부 상태를 표시하는 옷이라는 뜻이 분명하므로 간결하게 ‘과부의 옷’으로 옮겼습니다.
- source_word: ገልባቤ
  english_pob_choice: a veil
  chosen_korean: 베일
  alternatives_korean:
  - 면사포
  - 덮개
  lexicon: 베일
  rationale: 본문의 덮어쓰는 천을 한국어에서 가장 무난하게 드러내는 말로 ‘베일’을 택했습니다.
