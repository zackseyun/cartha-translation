  yaml_path: translation/extra_canonical/jubilees/041/002.yaml
  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: ko
  text: 그는 맏아들 에르를 위하여 아람의 딸들 가운데서 아내를 맞이하였는데, 그 이름은 다말이었습니다. 그러나 에르는 그녀를 거절하고 그녀와 동침하지 않았습니다. 그의 어머니가 가나안의 딸들 가운데서 났기 때문에, 그는 자기 어머니의 친족 가운데서 아내를 맞이하고 싶어 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሩ
  english_pob_choice: firstborn
  chosen_korean: 맏아들
  alternatives_korean:
  - 첫아들
  - 장자
  lexicon: 첫째/맏이 계열
  rationale: 문맥상 에르의 첫 번째 아들을 가리키므로 자연스러운 현대 한국어로 '맏아들'을 썼습니다. '장자'는 더 제도적·고어적 뉘앙스가 있어 서술문에는 덜 적합합니다.
- source_word: ብእሲተ ... ወስማ፡ ትዕማር
  english_pob_choice: he took a wife ... and her name was Tamar
  chosen_korean: 아내를 맞이하였는데, 그 이름은 다말이었습니다
  alternatives_korean:
  - 아내를 데려왔는데, 그 이름은 다말이었습니다
  - 아내를 취하였는데, 그 이름은 다말이었습니다
  lexicon: 아내를 맞이하다
  rationale: 결혼 행위를 드러내는 서술이므로 '맞이하다'를 택해 한국어 독자가 이해하기 쉬우면서도 원문의 결혼-취득 의미를 보존했습니다.
- source_word: ወጸልአ፡ ወኢሰከበ፡ ምስሌሃ፡
  english_pob_choice: But he rejected her and did not lie with her
  chosen_korean: 그러나 그는 그녀를 거절하고 함께 동침하지 않았습니다
  alternatives_korean:
  - 그러나 그는 그녀를 미워하고 그녀와 동침하지 않았습니다
  - 그러나 그는 그녀를 받아들이지 않고 함께하지 않았습니다
  lexicon: 거절하다 / 동침하다
  rationale: 두 동사의 의미를 분리해, 첫 동사는 관계 거부, 둘째는 성적 결합 부정을 나타내도록 했습니다. '동침'은 문맥상 완곡하지만 원문 의미를 분명히 드러냅니다.
- source_word: እምነገደ፡ እሙ
  english_pob_choice: the kin of his mother
  chosen_korean: 자기 어머니의 친족
  alternatives_korean:
  - 어머니의 족속
  - 어머니의 집안
  lexicon: 족속/친족
  rationale: 어머니 쪽 혈연 집단을 가리키는 표현이므로 현대어로는 '친족'이 가장 सीधे하며, '족속'보다 덜 낯설고 의미가 분명합니다.
theological_decisions:
- issue: 가문 간 혼인 선호의 동기
  chosen_reading: 어머니 쪽 혈연인 가나안 여인들보다 같은 친족에서 아내를 얻으려는 의도로 읽었습니다.
  alternative_readings:
  - 단순한 개인적 취향으로 볼 수 있습니다.
  - 혼인 규범을 넘어선 사회적·가문적 전략으로 볼 수 있습니다.
  rationale: 원문은 거절의 이유를 혈통/친족 선호로 제시하므로, 서술을 완화하지 않고 그대로 반영했습니다.
  doctrine_reference: 서사 맥락 해석
