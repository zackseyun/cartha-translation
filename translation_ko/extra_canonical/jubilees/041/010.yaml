  source_fidelity: 게에즈어의 두 절을 충실히 반영합니다. ወነበረት은 문맥상 ‘앉아 있었습니다’로 적절히 옮겼고, ውስተ አንቀጽ 및 팀낫 길을 수식하는 관계절도 보존했습니다. ረከባ는 상호적인 ‘만나다’보다 ‘발견했습니다’로 번역하여 원문의 어감을 잘 살렸습니다.
  naturalness: 표준 한국어의 현대적 합쇼체 서술로 자연스럽습니다. ‘유다가 가고 있을 때 그는’은 지시 대상이 분명하며, 원문의 진행 중인 상황을 보존합니다.
  terminology: ‘팀낫’은 일관된 지명 음역이며, ‘입구’와 ‘발견했습니다’는 각각 원문의 의미 범위와 영어 POB의 최종 어휘 결정을 적절히 반영합니다. 신학적 해석이나 후속 문맥의 내용을 첨가하지 않았습니다.
