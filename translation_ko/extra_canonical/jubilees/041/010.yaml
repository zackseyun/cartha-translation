translation:
  language: ko
  text: 그리고 그녀는 팀낫으로 가는 길에 있는 입구에 앉아 있었습니다. 유다가 가고 있을 때 그는 그녀를 발견했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነበረት
  english_pob_choice: And she sat
  chosen_korean: 그녀는 …에 앉아 있었습니다
  alternatives_korean:
  - 그녀는 …에 머물고 있었습니다
  - 그녀는 …에 있었습니다
  lexicon: Geez ነበረ / ወነበረት
  rationale: 문맥이 창세기 38장의 다말 장면을 반영하므로 단순한 ‘머물다’보다 자세를 취한 ‘앉아 있다’가 더 정확합니다.
- source_word: ውስተ፡ አንቀጽ፡
  english_pob_choice: at the entrance
  chosen_korean: 입구에
  alternatives_korean:
  - 문에
  - 출입구에
  lexicon: Geez አንቀጽ
  rationale: 게에즈어는 ‘entrance/doorway’의 뜻이므로 한국어에서는 자연스럽고 직접적인 ‘입구’가 적합합니다.
- source_word: እንተ፡ መንገሰ፡ ፍኖተ፡ ቴምናታ
  english_pob_choice: that is on the road to Timnah
  chosen_korean: 팀낫으로 가는 길에 있는
  alternatives_korean:
  - 팀낫으로 가는 길 위에 있는
  - 팀낫 길에 있는
  lexicon: Geez ፍኖት / ቴምናታ
  rationale: 관계절의 지시적 의미를 살려 ‘…에 있는’으로 풀었고, 지명은 기존 음역을 따랐습니다.
- source_word: የሐውር፡ … ረከባ
  english_pob_choice: was going ... he found her
  chosen_korean: 가고 있을 때 그는 그녀를 발견했습니다
  alternatives_korean:
  - 가던 중 그는 그녀를 만났습니다
  - 가고 있던 그는 그녀를 보았습니다
  lexicon: Geez ሐወረ / ረከበ
  rationale: ሬከባ는 ‘만나다’보다 ‘찾다/발견하다’의 어감이 강해 ‘발견하다’로 옮겼습니다.
theological_decisions:
- issue: 서술의 직접성 유지
  chosen_reading: 본절은 성적 해석을 덧붙이지 않고 지리적·서사적 진술만 그대로 옮겼습니다.
  alternative_readings:
  - 그녀를 만난 것으로 완곡하게 처리하는 번역
  - 배경적 의미를 덧붙이는 해설식 번역
  rationale: 게에즈 본문과 영어 POB의 수정 이력은 ‘발견하다/찾아내다’와 위치 진술에 집중하므로, 후대의 해석을 섞지 않는 것이 본문 충실도에 맞습니다.
  doctrine_reference: 본문 서술의 최소 해석 원칙
