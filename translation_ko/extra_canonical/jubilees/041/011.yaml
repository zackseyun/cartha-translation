translation:
  language: ko
  text: 그는 그녀를 창녀로 여기고 그녀에게 말했습니다. “제가 당신에게 들어가게 해 주십시오.” 그러자 그녀가 그에게 말했습니다. “들어오십시오.” 그래서 그가 들어갔습니다. 그녀가 그에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተሐዘባ
  english_pob_choice: thought her to be
  chosen_korean: 그녀를 …로 생각하고
  alternatives_korean:
  - 그녀를 …로 여겨
  - 그녀를 …로 인식하고
  lexicon: Geez ተሐዘበ / 생각하다 계열
  rationale: 게으즈 동사는 ‘알아보다’보다 ‘생각하다/여기다’의 의미가 더 직접적이어서, 그의 잘못된 판단을 드러내는 표현으로 옮겼습니다.
- source_word: ዘማዊት
  english_pob_choice: prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: Geez ዘማዊት / 성적 매춘 여성 지칭
  rationale: 현대 한국어에서 원뜻을 분명하게 드러내는 직역에 가깝게 ‘창녀’를 택했습니다.
- source_word: እባእ፡ ኀቤኪ
  english_pob_choice: Let me come in to you
  chosen_korean: 내가 당신에게 들어가게 해 주십시오
  alternatives_korean:
  - 제가 당신에게 들어가게 해 주십시오
  - 제가 당신에게 들어가겠습니다
  lexicon: Geez 청유/허락 표현 + 목적어 방향구
  rationale: 주체는 그녀가 아니라 화자이므로, ‘Come to me’가 아니라 ‘내가 … 들어가게 해 주십시오’로 옮겨 주어와 방향을 보존했습니다.
- source_word: ባእ፡ ወቦአ
  english_pob_choice: Come ... and he went in
  chosen_korean: 들어오십시오.” 그래서 그가 들어갔습니다.
  alternatives_korean:
  - 오십시오.” 그래서 그가 들어갔습니다.
  - 들어오십시오.” 그러자 그가 들어갔습니다.
  lexicon: Geez 상대방의 응답 + 동사 ‘들어가다’
  rationale: 그녀의 응답은 짧은 허락/초대 ‘들어오십시오’에 해당하고, 뒤의 서술은 실제 진입 행위를 간명하게 반영했습니다.
theological_decisions:
- issue: 이 문장은 도덕적 평가보다 서술적 사실 전달이 중심입니다.
  chosen_reading: ‘창녀’와 ‘들어가게 해 주십시오’의 직설성을 유지해, 본문이 보여 주는 긴장과 암시를 흐리지 않았습니다.
  alternative_readings:
  - ‘음녀’처럼 더 문어적·완곡한 표현
  - ‘들어오게 해 주십시오’로 주어를 덜 분명하게 만드는 표현
  rationale: 제공된 게으즈와 수정 이력은 창세기 38장과 대응하는 장면의 직설적 재현을 요구하므로, 완곡화보다 원문 장면성을 보존하는 쪽이 본문 의도에 더 가깝습니다.
  doctrine_reference: 본문 내러티브의 직접성 보존
- issue: 마지막 절이 미완성으로 끝납니다.
  chosen_reading: 마지막 문장을 ‘그녀가 그에게 말했습니다.’로 끝내어, 원문의 미완결성을 그대로 남겼습니다.
  alternative_readings:
  - 추가 문장을 보충해 매끄럽게 마무리
  - 의미를 추정해 이어 쓰기
  rationale: 게으즈 원문과 영어 본문이 모두 마지막 발화 도입 뒤에 끊기므로, 보충 번역은 자료를 넘어선 확대가 됩니다.
  doctrine_reference: 본문 비평 및 서술 구조 존중
