  source_fidelity: 게으즈 ተሐዘበ는 ‘알아보다/인정하다’보다 ‘생각하다, 여기다’에 가까우므로, 그가 여자를 창녀로 잘못 여겼다는 뜻을 유지해야 합니다. እባእ ኀቤኪ는 여인에게 ‘오라’고 명하는 말이 아니라 화자인 남자가 ‘내가 당신에게 들어가게 해 달라’고 요청하는 표현입니다. 뒤의 ‘들어오십시오’와 그가 실제로 들어간 사실, 그리고 마지막의 미완결 발화 도입도 보존되었습니다.
  naturalness: ‘그녀를 …로 생각하고’도 이해되지만, ‘창녀로 여기고’가 현대 한국어 서사문에서 더 자연스럽고 원문의 판단·추정을 잘 드러냅니다. ‘제가’는 공적 합쇼체 대화의 높임말과 일관됩니다.
  terminology: ‘창녀’는 원문의 직접적인 사회적 지칭을 보존합니다. 성행위를 완곡하게 암시하는 ‘들어가다’를 유지하여, 원문보다 노골적인 해석어를 덧붙이지 않았습니다.
