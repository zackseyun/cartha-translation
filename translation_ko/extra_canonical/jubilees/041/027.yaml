  chosen_korean: 우리가 말하였으며
  alternatives_korean:
  - 우리가 말했다고
  - 말하였고
  lexicon: speech verb
  rationale: 주체가 숨겨지지 않는 1인칭 복수 발화를 살려, 묵시적 전달이 아니라 발화 자체임을 드러냈습니다.
- source_word: ደቂቁ፡ ወበእንተዝ፡ ቆመ፡ ዘርአ፡ ለካልእ፡ ነገደ፡ ወኢይሤረወ።
  english_pob_choice: his seed was established for another tribe and was not uprooted
  chosen_korean: 그의 씨가 다른 지파를 위해 세워졌고 뽑히지 않았습니다
  alternatives_korean:
  - 그의 자손이 다른 지파를 위해 세워졌고 뽑히지 않았습니다
  - 그의 씨가 다른 지파에 굳게 서 있었고 뽑히지 않았습니다
  lexicon: seed / uprooted imagery
  rationale: ‘씨’는 혈통·후손의 집단 개념을 보존하고, ‘뽑히지 않았습니다’로 원문의 제거·이식 반대 이미지를 유지했습니다.
theological_decisions:
- issue: Jubilees의 발화자 지시가 'we said'인지 수동태인지
  chosen_reading: 우리가 말하였으며
  alternative_readings:
  - 말해졌으며
  - 그에게 말해졌으며
  rationale: 본문은 천상 발화의 1인칭 복수를 유지하는 전승의 프레임에 맞으므로, 능동 1인칭 복수로 옮겨 서술자의 음성을 희석하지 않았습니다.
  doctrine_reference: 문학적-서사적 화자 동일성 보존
- issue: '''his seed was established for another tribe''의 언약적·족보적 의미'
  chosen_reading: 그의 씨가 다른 지파를 위해 세워졌고
  alternative_readings:
  - 그의 후손이 다른 지파에 속하게 되었고
  - 그의 씨가 다른 지파에 정착하게 되었고
  rationale: 성적/가계적 결과를 단순한 지리적 이동으로 약화시키지 않기 위해, 혈통 보존과 지파 귀속의 긴장을 함께 드러냈습니다.
  doctrine_reference: 족보/언약 계승의 서사
