  chosen_reading: 그의 씨가 다른 지파를 위해 세워졌고
  alternative_readings:
  - 그의 후손이 다른 지파에 속하게 되었고
  - 그의 씨가 다른 지파에 정착하게 되었고
  rationale: 성적/가계적 결과를 단순한 지리적 이동으로 약화시키지 않기 위해, 혈통 보존과 지파 귀속의 긴장을 함께 드러냈습니다.
  doctrine_reference: 족보/언약 계승의 서사
