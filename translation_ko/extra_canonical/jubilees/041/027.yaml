  - 이 때문에
  lexicon: source particle phrase
  rationale: 문장 첫머리의 수단·근거 표현을 자연스럽게 살려, 앞선 사건이 뒤의 결과를 낳는다는 인과를 분명히 드러냈습니다.
- source_word: መዐተ፡ መመቅሠፍተ፡
