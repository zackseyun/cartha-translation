- from: 이로써 그는 이스라엘에게서 진노와 징벌을 돌리실 것입니다. 그리고 유다에게는 그의 두 아들이 그녀와 동침하지 않았다고 우리가 말하였으며, 이 때문에 그의 씨가 다른 지파를 위해 세워졌고 뽑히지 않았습니다.[a]
  to: 이로써 그가 이스라엘에서 진노와 징벌을 돌이킬 것입니다. 우리는 유다에게 그의 두 아들이 그녀와 동침하지 않았다고 말하였으며[a], 이 때문에 그의 후손은 또 다른 지파가 되도록 세워졌고 뿌리째 뽑혀 없어지지 않았습니다.
  rationale: 1인칭 복수 화자를 보존하되, 유다를 신적 주어처럼 만들 수 있는 존대법을 제거했습니다. ‘for another tribe’를 한국어의 목적·수혜 표현으로 오독하지 않도록 지파 구성의 의미를 명시했으며, ‘seed’와 ‘uprooted’의 족보·식물 비유는 ‘후손’과 ‘뿌리째 뽑혀 없어지지’로 자연스럽게 유지했습니다.
