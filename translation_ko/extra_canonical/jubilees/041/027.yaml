  - 그에게 말해졌으며
  rationale: 본문은 천상 발화의 1인칭 복수를 유지하는 전승의 프레임에 맞으므로, 능동 1인칭 복수로 옮겨 서술자의 음성을 희석하지 않았습니다.
  doctrine_reference: 문학적-서사적 화자 동일성 보존
