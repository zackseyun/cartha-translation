    issue: ‘돌리실 것입니다’의 존대법
    rationale: 본문의 ‘그’는 문맥상 유다를 가리키는 것으로 보이며, 존대 선어말어미는 한국어에서 신적 주어라는 불필요한 해석을 유발할 수 있습니다. 비존대 미래형이 원문의 인칭 지시를 더 중립적으로 보존합니다.
