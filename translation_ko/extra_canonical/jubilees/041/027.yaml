  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
  footnotes:
  - marker: a
    text: Or 'it was said'.
    reason: previous_rendering
translation:
  language: ko
  text: 이로써 그가 이스라엘에서 진노와 징벌을 돌이킬 것입니다. 우리는 유다에게 그의 두 아들이 그녀와 동침하지 않았다고 말하였으며[a], 이 때문에 그의 후손은 또 다른 지파가 되도록 세워졌고 뿌리째 뽑혀 없어지지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말해졌으며’.
    reason: 원문의 동사는 1인칭 복수 능동으로 읽을 수 있으나, 영어 POB audit trail에 보존된 수동 번역 대안을 해당 발화 표현에 직접 연결합니다.
