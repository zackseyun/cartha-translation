translation:
  language: ko
  text: 이로써 그는 이스라엘에게서 진노와 징벌을 돌리실 것입니다. 그리고 유다에게는 그의 두 아들이 그녀와 동침하지 않았다고 우리가 말하였으며, 이 때문에 그의 씨가 다른 지파를 위해 세워졌고 뽑히지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእሊአሁ / ወበእሊአሁ
  english_pob_choice: And by this
  chosen_korean: 이로써
  alternatives_korean:
