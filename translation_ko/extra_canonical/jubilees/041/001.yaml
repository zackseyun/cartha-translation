  rationale: 연대기적 문맥에서 반복되는 시간표현을 직역에 가깝게 살리기 위해 '둘째 해'로 옮겼습니다.
- source_word: ነሥአ፡ ይሁዳ፡
  english_pob_choice: Judah took
  chosen_korean: 유다가 취했습니다
