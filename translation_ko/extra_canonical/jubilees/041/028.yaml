  source_fidelity: 핵심 어휘인 የውሀተ를 ‘순결함’ 계열로 이해하고, እምፍተሐ를 아브라함의 판결을 행동의 기준으로 삼는 표현으로 옮긴 점은 원문 및 영어 감사 이력과 일치합니다. 다만 ‘걸어가며’는 여기서의 ሖረ가 지닌 행실·처신의 비유적 용법을 충분히 살리지 못하고, ‘불에 타기를’은 사법적 처벌의 수동 의미가 다소 약합니다.
  naturalness: ‘눈의 순결함 가운데서 걸어가며’는 현대 표준 한국어로는 부자연스럽습니다. ‘눈의 순전함으로 행하며’는 원문의 눈 관련 비유를 보존하면서도 문어적 합쇼체 성경 문맥에서 더 자연스럽습니다. 또한 ‘불로 태워지기를’이 의도된 처벌을 명확히 합니다.
  terminology: ‘판결’, ‘아브라함’, ‘유다’는 적절합니다. ‘그 여인’은 선행 문맥의 다말을 가리키는 존칭 없는 서술적 지시어로 자연스럽고, 원문이 이름을 반복하지 않는 방식을 유지합니다.
