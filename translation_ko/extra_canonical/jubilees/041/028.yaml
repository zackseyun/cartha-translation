  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
  footnotes:
  - marker: a
    text: Or 'after the desire of his eyes'.
    reason: previous_rendering
  - marker: b
    text: Or 'from the judgment'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 눈의 순결함 가운데서 걸어가며 판결을 구했습니다. 이는 아브라함이 자기 아들들에게 명한 판결에 따라, 유다가 그 여자가 불에 타기를 원했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  english_pob_choice: in the innocence of his eyes
  chosen_korean: 눈의 순결함 가운데서
  alternatives_korean:
  - 눈의 순수함 가운데서
  - 눈의 결백함 가운데서
  - 그 눈의 순결대로
  lexicon: የውሀተ
  rationale: Ge'ez의 የውሀተ를 ‘욕망’이 아니라 ‘순결함/순수함’ 계열로 옮겨야 하므로, 문맥상 품행의 무죄성·순결성을 드러내는 표현을 택했습니다.
- source_word: ሖረ፡ ወኀሠሠ፡ ኵነኔ፡
  english_pob_choice: he went ... and sought judgment
  chosen_korean: 걸어가며 판결을 구했습니다
  alternatives_korean:
  - 가서 판결을 구했습니다
  - 나아가 판결을 찾았습니다
  - 가며 재판을 구했습니다
  lexicon: ሖረ / ኀሠሠ / ኵነኔ
  rationale: 동작의 순서를 자연스럽게 살리되, ኵነኔ는 법적 맥락의 ‘판결’로 옮겨 사법적 의미를 분명히 했습니다.
- source_word: በእሳት
  english_pob_choice: with fire / be burned with fire
  chosen_korean: 불에 타기를
  alternatives_korean:
  - 불로 태워지기를
  - 불로 불태우기를
  - 불에 타서 죽기를
  lexicon: እሳት
  rationale: 형벌의 수단으로서의 불을 직설적으로 드러내되, 한국어에서는 자연스러운 수동·희구 구조로 정리했습니다.
- source_word: እምፍተሐ አብርሃም
  english_pob_choice: by the judgment of Abraham
  chosen_korean: 아브라함이 자기 아들들에게 명한 판결에 따라
  alternatives_korean:
  - 아브라함의 판결에 따라
  - 아브라함이 아들들에게 명한 판결로
  - 아브라함의 판결 때문에
  lexicon: እም / ፍተሐ
  rationale: 여기서 እም은 단순한 출처보다 근거·기준을 나타내므로 ‘~에 따라’로 옮겼고, 후행 절의 ‘명한’까지 반영해 권위의 근거를 살렸습니다.
theological_decisions:
- issue: 유다가 요구한 형벌의 방향
  chosen_reading: 유다가 그 여자가 불에 타기를 원한 것으로 옮겼습니다.
  alternative_readings:
  - 유다가 그 여자가 불로 태워지기를 원한 것으로 옮길 수 있습니다.
  - 유다가 그 여자를 불태우기를 원한 것으로 옮길 수 있습니다.
  rationale: 원문은 처벌의 수단을 불로 명시하므로, 행위의 폭력성과 사법적 엄격함이 흐려지지 않도록 직설적으로 표현했습니다.
  doctrine_reference: 서술적 역사문맥의 형벌 진술
