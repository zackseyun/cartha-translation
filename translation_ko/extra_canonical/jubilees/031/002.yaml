translation:
  language: ko
  text: 이방 신들, 곧 너희 가운데 있는 이방 신들과 라헬이 언니 라반에게서 훔친 우상들과, 그들의 귀에 있던 것과 목에 있던 것을 내주었습니다. 그리고 그녀는 그것들을 모두 야곱에게 주었고, 야곱은 그것들을 불사르고, 부수고, 멸하고, 세겜 땅에 있는 나무 아래에 숨겼습니다.[a][b][2]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማልክተ፡ ነኪር፡ እለ፡ ማእከሌክሙ
  english_pob_choice: the foreign gods that are among you
  chosen_korean: 이방 신들, 곧 너희 가운데 있는 이방 신들
  alternatives_korean:
  - 너희 가운데 있는 외국 신들
  - 너희 가운데 있는 낯선 신들
  lexicon: 이방 신 / 가운데
  rationale: Geez의 ‘foreign gods’는 단순히 국적상 외래라는 뜻보다 언약 공동체 밖의 우상을 가리키므로, 성경적 맥락을 살려 ‘이방 신들’로 옮겼습니다. ‘among you’는 직접 인용의 2인칭 복수로 유지했습니다.
- source_word: ወመጠውዎሙ፡ ለአማልክተ፡ ነኪር
  english_pob_choice: And they gave him the foreign gods
  chosen_korean: 그리고 그들은 그것들을 내주었습니다
  alternatives_korean:
  - 그리고 그들은 그 이방 신들을 그에게 주었습니다
  - 그리고 그들은 그 우상들을 그에게 넘겨주었습니다
  lexicon: 내주다
  rationale: 문맥상 야곱의 요구에 응해 우상을 넘기는 행동이므로, 단순한 ‘주다’보다 항복/양도 뉘앙스를 가진 ‘내주다’가 더 적절합니다.
- source_word: ወሀበት፡ ኵሎ
  english_pob_choice: And she gave them all to Jacob
  chosen_korean: 그리고 그녀는 그것들을 모두 야곱에게 주었고
  alternatives_korean:
  - 그리고 그녀가 그것들 모두를 야곱에게 내주었고
  - 그리고 그녀는 그것들 전부를 야곱에게 주었고
  lexicon: 주다
  rationale: 라헬의 행위는 자발적 이전이므로 2번째 절에서는 중립적인 ‘주다’가 자연스럽습니다. 앞절의 ‘내주다’와 구별해 동작의 성격을 살렸습니다.
- source_word: ወአውዕዮ፡ ወፀተሞ፡ ወአማስኖ፡ ወኀብአ
  english_pob_choice: and he burned them, and crushed them, and destroyed them, and hid them
  chosen_korean: 야곱은 그것들을 불사르고, 부수고, 멸하고, 숨겼습니다
  alternatives_korean:
  - 야곱은 그것들을 태우고, 깨뜨리고, 없애고, 감추었습니다
  - 야곱은 그것들을 불태우고, 짓부수고, 파괴하고, 숨겼습니다
  lexicon: 불사르다 / 부수다 / 멸하다 / 숨기다
  rationale: 연속 동사들을 원문 순서대로 보존하면서, ‘destroyed’에 해당하는 ወአማስኖ를 빠뜨리지 않기 위해 ‘멸하다’를 추가했습니다. 마지막 ‘hid’는 ‘감추다’보다 서술 흐름에 맞는 ‘숨기다’가 자연스럽습니다.
- source_word: ድርዋስ፡ ዘሀሎ፡ ውስተ፡ ምድረ፡ ሰቂሞን
  english_pob_choice: the oak that was in the land of Shechem
  chosen_korean: 세겜 땅에 있는 나무 아래
  alternatives_korean:
  - 세겜 땅에 있는 상수리나무 아래
  - 세겜 땅에 있는 떡갈나무 아래
  lexicon: 나무 아래
  rationale: 이 구절의 나무 명칭은 Ge'ez에서 정확한 수종이 불확실하므로, 본문은 안전하게 ‘나무’로 두고 POB의 식별 불확실성을 반영했습니다. 필요하면 주석에서 더 좁은 수종 가능성을 안내할 수 있습니다.
theological_decisions:
- issue: 우상 파기 동작의 누락 방지
  chosen_reading: ‘부수고, 멸하고’까지 모두 본문에 반영했습니다.
  alternative_readings:
  - ‘부수고, 숨겼습니다’로 간단히 처리
  - ‘파괴하고’로 하나의 동작으로 묶기
  rationale: Geez 본문과 POB 수정 내역 모두 ‘destroyed them’에 해당하는 동사가 별도로 존재하므로, 이를 한국어에서도 분리해 기록해야 본문의 폭력적 단호함과 우상 제거의 완결성이 살아납니다.
  doctrine_reference: 우상 숭배 제거와 언약 정결의 서사적 강조
