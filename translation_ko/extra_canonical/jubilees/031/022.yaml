  - 의로
  lexicon: 게에즈 በጽድቅ 계열의 부사적 용법
  rationale: 문맥상 ‘의롭게’가 아니라 사실 확인의 뉘앙스이므로, POB의 최종 영어처럼 ‘참으로’로 옮겨 의미를 분명히 했습니다.
