  - 그의 발에서 물러나와
  lexicon: 게에즈 관용구의 직역
  rationale: POB 주석이 지적하듯 원문은 관용구가 불분명하므로, 의미를 과도하게 풀지 않고 발화자의 즉각적 자리에서 물러나는 동작을 드러내는 직역을 유지했습니다.
- source_word: ወሰገደ፡ ሎቱ
  english_pob_choice: bowed to him
  chosen_korean: 엎드려 절하였습니다
  alternatives_korean:
  - 그에게 절하였습니다
  - 몸을 굽혀 절하였습니다
  lexicon: 경배/예배 동작을 나타내는 서술
  rationale: 단순한 인사보다 더 강한 예를 나타내므로, 한국어에서도 경배의 동작이 드러나는 표현을 택했습니다.
- source_word: ወአዕረፈ፡ ህየ፡ ቅሩበ፡ ይስሐቅ፡ አቡሁ፡ በይእቲ፡ ሌሊት፡
  english_pob_choice: rested there near Isaac his father that night
  chosen_korean: 그 밤에 자기 아버지 이삭 곁에서 거기 쉬었으며
  alternatives_korean:
  - 그 밤에 아버지 이삭 가까이에서 거기 머물렀으며
  - 그 밤에 자기 아버지 이삭 근처에서 쉬었으며
  lexicon: 휴식/체류를 나타내는 서술과 근접 표지
  rationale: ‘rested’와 ‘near’의 두 요소를 살리되, 한국어 문장 흐름을 위해 ‘거기 쉬었으며’로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 예식적 행위와 관계 질서의 표현
  chosen_reading: ‘엎드려 절하다’와 ‘축복하다’를 그대로 살려, 단순한 예의가 아니라 존중과 언약적 질서가 드러나게 했습니다.
  alternative_readings:
  - ‘절하다’로만 단순화
  - ‘경배하다’로 번역
  rationale: 이 장면은 가족 관계 속 예식적 존중을 보여 주므로, 강도를 약화하지도 과장하지도 않는 중간 표현이 적절합니다.
  doctrine_reference: 족장 서사에서의 존중과 축복 행위
- issue: ‘참으로’의 의미 선택
  chosen_reading: 본절의 수식어는 윤리적 ‘의로움’이 아니라 사실성/진실성의 강조로 이해했습니다.
  alternative_readings:
  - ‘의로’로 직역
  - ‘의롭게’로 해석
  rationale: 게에즈 표현과 POB 최종 영어가 모두 사실 확인의 의미를 지지하므로, 한국어에서도 오해를 피하는 쪽이 맞습니다.
  doctrine_reference: 본문 의미의 문맥 우선 원칙
