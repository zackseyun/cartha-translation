base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/007.yaml
  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: ko
  text: 그녀는 「보십시오, 당신의 아들 야곱이 왔습니다」라는 말을 듣고 그에게 입을 맞추었습니다. 그리고 그의 두 아들을 보고 그들을 알아보았습니다. 그리고 그에게 말했습니다. 「이 아이들이 네 아들들입니까, 내 아들아?」 그리고 그들을 끌어안고 입을 맞추며 축복하여 말했습니다. 「너희 안에서 아브라함의 씨가 존귀하게 여김을 받을 것이며, 너희는 복이 될 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰምዐት ... ወሰዐመቶ
  english_pob_choice: She heard ... And she kissed him.
  chosen_korean: 「보십시오, 야곱 당신의 아들이 왔습니다」라고 듣고 그에게 입을 맞추었습니다.
  alternatives_korean:
  - 그녀는 「보라, 네 아들 야곱이 왔다」는 말을 듣고 그에게 입맞추었습니다.
  - 그녀는 「야곱이 당신의 아들로 왔습니다」라고 듣고 그에게 입을 맞추었습니다.
  lexicon: 듣다 / 입을 맞추다
  rationale: 원문은 ‘듣다’와 ‘입을 맞추다’를 연속 동사로 제시하며, POB도 같은 순서를 유지하므로 이를 자연스러운 서술로 옮겼습니다. ‘보십시오’는 ናሁ의 호명·주목 표지를 살린 표현입니다.
- source_word: ወርእየቶሙ ... ወአእመረትሙ
  english_pob_choice: she saw his two sons and recognized them
  chosen_korean: 그의 두 아들을 보고 알아보며
  alternatives_korean:
  - 그의 두 아들을 보고 알아차리며
  - 그의 두 아들을 보고 그들을 알아보며
  lexicon: 보다 / 알아보다
  rationale: ‘보고 알아보며’는 시각 확인과 식별을 분리해 원문의 연속 동작을 살립니다.
- source_word: ወሐቀፈቶሙ ወሰዐመቶሙ
  english_pob_choice: And she embraced them and kissed them
  chosen_korean: 그들을 끌어안고 입을 맞추며
  alternatives_korean:
  - 그들을 껴안고 입을 맞추며
  - 그들을 품에 안고 입을 맞추며
  lexicon: 포옹 / 입맞춤
  rationale: 원문의 두 동작을 중복 없이 그대로 드러내기 위해 ‘끌어안고’와 ‘입을 맞추며’를 택했습니다.
- source_word: ይክበር ... ትከውኑ ለበረከት
  english_pob_choice: In you shall the seed of Abraham be honored, and you shall become a blessing.
  chosen_korean: 당신 안에서 아브라함의 씨가 존귀함을 받게 될 것이며, 당신은 복이 되실 것입니다
  alternatives_korean:
  - 당신 안에서 아브라함의 씨가 존중받게 될 것이며, 당신은 복이 될 것입니다
  - 당신 안에서 아브라함의 씨가 영광을 받게 될 것이며, 당신은 복이 되실 것입니다
  lexicon: 존귀하다 / 복
  rationale: ይክበር는 단순한 ‘존중’보다 ‘존귀함을 받다’가 격을 살리며, ትከውኑ ለበረከት은 결과 상태를 드러내는 ‘복이 되다’로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 씨가 '존귀함을 받게 될 것'이라는 표현의 의미
  chosen_reading: 이는 후손이 사람들 사이에서 높여지고 명예를 얻는다는 축복 선언으로 읽었습니다.
  alternative_readings:
  - ‘씨’ 자체가 번성한다는 약속으로 읽을 수 있습니다.
  - 메시아적 계승선에 대한 간접 예언으로 볼 수도 있습니다.
  rationale: 원문과 POB는 모두 축복 선언의 사회적-언약적 의미를 전면에 둡니다. 본 절만으로는 메시아적 특수화보다 일반적 축복 선언이 더 직접적입니다.
  doctrine_reference: 창 12:3; 창 22:17-18
