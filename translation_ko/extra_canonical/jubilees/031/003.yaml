revisions:
- from: 그리고 그가 일곱째 달의 초하루에 벧엘로 올라갔습니다. 그리고 그는 그가 머물렀던 곳에 제단을 쌓고, 거기에 기둥을 세웠으며, 그의 아버지 이삭에게 사람을 보내어 그가 자기에게 오게 했습니다.[a][b]
  to: 그리고 그가 일곱째 달의 초하루에 벧엘로 올라갔습니다. 그는 그가 머물렀던 곳에 제단을 쌓고, 거기에 기둥을 세웠으며, 아버지 이삭에게 전갈을 보내어 자기에게 오시도록 했습니다.
  rationale: 원문에 없는 ‘사람’을 제거하고, 한국어에서 ‘보내다’의 목적어가 요구되는 자리에 최소한의 전달 수단인 ‘전갈’을 사용했습니다. 아울러 대응 각주가 없는 표지를 삭제했으며, 원문상 잘못된 달력 대안 독법도 제거했습니다. 나머지 번역은 원문의 순서와 의미를 유지했습니다.
  reviewer_model: gpt-5.6-terra
