    rationale: 표지와 각주 세트가 구조적으로 불일치합니다. 또한 영어 a의 대안 독법(‘첫째 달, 일곱째 해’)은 본 게에즈어 본문에 근거하지 않는 것으로 이미 정정되었으므로 유지해서는 안 됩니다. b도 한국어 본문에는 필요한 대안 정보를 제공하지 않습니다.
  revised_text: 그리고 그가 일곱째 달의 초하루에 벧엘로 올라갔습니다. 그는 그가 머물렀던 곳에 제단을 쌓고, 거기에 기둥을 세웠으며, 아버지 이삭에게 전갈을 보내어 자기에게 오시도록 했습니다.
