translation:
  language: ko
  text: 그리고 그가 일곱째 달의 초하루에 벧엘로 올라갔습니다. 그는 그가 머물렀던 곳에 제단을 쌓고, 거기에 기둥을 세웠으며, 아버지 이삭에게 전갈을 보내어 자기에게 오시도록 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዐርገ
  english_pob_choice: And he went up
  chosen_korean: 그가 올라갔습니다
  alternatives_korean:
  - 그가 올라갔습니다
  - 그가 올라갔습니다
  lexicon: Geez ዐርገ
  rationale: 지리적 이동을 나타내는 ‘올라가다’를 유지하여 벧엘로 향하는 이동 방향성을 살렸습니다.
- source_word: አመ፡ ሠርቀ፡ ወርኅ፡ ሳብዕ፡
  english_pob_choice: on the new moon of the seventh month
  chosen_korean: 일곱째 달의 초하루에
  alternatives_korean:
  - 일곱째 달의 새달에
  - 일곱째 달의 그믐/초하루에
  lexicon: Geez calendar expression
  rationale: 수정된 영어 검토처럼 ‘첫째 달’이나 ‘일곱째 해’가 아니라 달력상의 ‘새달/초하루’ 표현이므로, 자연스럽고 정확한 한국어로 옮겼습니다.
- source_word: ወሐነጸ፡ ምሥዋዐ፡
  english_pob_choice: he built an altar
  chosen_korean: 제단을 쌓고
  alternatives_korean:
  - 제단을 세우고
  - 제단을 만들고
  lexicon: Geez ሐነጸ + ምሥዋዕ
  rationale: 제단은 한국어에서 ‘쌓다’가 제의적 구성 행위를 가장 직접적으로 나타내므로 이를 택했습니다.
- source_word: ውስተ፡ መካን፡ ኀበ፡ ኖመ፡ ህየ፡
  english_pob_choice: in the place where he had lodged
  chosen_korean: 그가 머물렀던 곳에
  alternatives_korean:
  - 그가 묵었던 곳에
  - 그가 숙박했던 곳에
  - 그가 잠들었던 곳에
  lexicon: Geez ኖመ + relative construction
  rationale: 검토된 영어의 ‘lodged’를 반영해, 단순한 수면이 아니라 하룻밤 머무름을 뜻하는 중립적 표현으로 옮겼습니다.
- source_word: ወፈነወ፡ ኀበ፡ አቡሁ፡ ይስሐቅ፡
  english_pob_choice: and he sent to his father Isaac that he should come to him
  chosen_korean: 그의 아버지 이삭에게 사람을 보내어 그가 자기에게 오게 했습니다
  alternatives_korean:
  - 그의 아버지 이삭에게 보내어 오게 했습니다
  - 그의 아버지 이삭에게 전갈을 보내어 오게 했습니다
  lexicon: Geez ፈነወ + infinitive purpose clause
  rationale: 보냄의 목적이 ‘오게 하다’에 있으므로, 파송 대상을 명시해 본문 의미를 분명히 했습니다.
theological_decisions:
- issue: 달력 표현의 해석
  chosen_reading: ‘일곱째 달의 초하루’로 읽었습니다.
  alternative_readings:
  - ‘일곱째 해의 첫달’로 읽는 오역 가능성
  - 달리 모호하게 처리하는 번역
  rationale: 본문과 기존 POB 수정 기록이 달력상의 새달을 가리킨다고 명시하므로, 문맥을 왜곡하지 않는 해석을 채택했습니다.
  doctrine_reference: 본문비평/주해적 정확성
- issue: ‘머물렀던 곳’의 의미
  chosen_reading: 단순히 잔 것이 아니라 그 장소에 머문 의미로 번역했습니다.
  alternative_readings:
  - ‘잠들었던 곳’
  - ‘자고 있던 곳’
  rationale: 검토된 영어가 ‘lodged’로 수정되었으므로, 과도하게 좁은 ‘잠들다’보다 체류를 포함하는 표현이 더 정확합니다.
  doctrine_reference: 주해적 정확성
