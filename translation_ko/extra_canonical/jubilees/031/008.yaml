  source_fidelity: 첫 문장의 장소 정보와 야곱이 아버지의 손을 잡고 몸을 굽혀 입맞춘 행위는 잘 반영되었습니다. 다만 ደቂቁ는 문맥상 야곱의 두 아들을 가리키므로 대명사 지시를 명시하는 편이 정확합니다. 끝 절은 원문이 전치사 뒤에서 절단되어 있으므로, 완결된 목적어를 보충하지 않고 결손을 표시해야 합니다.
  naturalness: 현대 표준 한국어 합쇼체로 대체로 자연스럽습니다. 그러나 ‘그의 두 아들’과 ‘그와 함께’는 선행사가 이삭인지 야곱인지 잠시 모호할 수 있어 ‘야곱의 두 아들도 야곱과 함께’로 명시하는 것이 좋습니다. 절단된 마지막 절은 말줄임표의 위치를 조정하여 원문의 미완결 상태를 더 분명히 드러낼 수 있습니다.
  terminology: 인명 ‘야곱’, ‘이삭’과 친족 표현은 적절합니다. ‘매달리다’는 ተሰቅለ의 달라붙음/매달림의 의미 범위 안에 있으나, 원문이 뒤따르는 전치사의 목적어에서 끊기므로 한국어에서도 그 결손을 표시해야 합니다.
  issues:
