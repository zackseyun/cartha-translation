translation:
  language: ko
  text: 야곱이 자기 아버지 이삭에게, 그가 누워 있던 방으로 들어갔습니다. 그의 두 아들도 그와 함께 있었습니다. 야곱은 아버지의 손을 잡고 몸을 굽혀 그에게 입을 맞추었습니다. 이삭은 그에게 매달렸습니다…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቦአ፡ ያዕቆብ፡ ኀበ፡ ይስሐቅ፡ አቡሁ፡ ውስተ፡ ጽርሕ፡
  english_pob_choice: And Jacob went in to Isaac his father, into the room where he was lying
  chosen_korean: 야곱이 자기 아버지 이삭에게, 그가 누워 있던 방으로 들어갔습니다
  alternatives_korean:
  - 야곱이 아버지 이삭에게 들어갔습니다
  - 야곱이 아버지 이삭이 누워 있는 방 안으로 들어갔습니다
  lexicon: 들어가다 / 방
  rationale: 게즈 원문과 영어 본문 모두 ‘아버지에게로 들어가다’와 ‘그가 누워 있던 방’의 두 요소를 담고 있으므로, 문장 흐름을 자연스럽게 하면서도 장소 정보를 유지했습니다.
- source_word: ወክልኤቱ፡ ደቂቁ፡ ምስሌሁ፡
  english_pob_choice: and his two children were with him
  chosen_korean: 그의 두 아들도 그와 함께 있었습니다
  alternatives_korean:
  - 그의 두 자녀도 그와 함께 있었습니다
  - 두 아이가 그와 함께 있었습니다
  lexicon: 아들 / 자녀
  rationale: 이 구절의 직후 문맥이 ‘아버지의 손을 잡고’ 등 가족 상봉 장면이므로, 게즈의 ‘두 자식들’은 성별을 확정하지 않는 범위에서 영어처럼 자연스럽게 ‘두 아들’로 옮길 수 있지만, 본문상 명시가 약해 ‘아들’보다 더 넓은 표현으로는 오히려 과도할 수 있어 기존 영어의 구체성을 따라 ‘아들’로 두었습니다.
- source_word: ወአንዘ፡ እዴ፡ አቡሁ፡ ወደነነ፡ ሰዐሞ፡
  english_pob_choice: And he took the hand of his father, and he bent down and kissed him
  chosen_korean: 야곱은 아버지의 손을 잡고 몸을 굽혀 그에게 입을 맞추었습니다
  alternatives_korean:
  - 야곱은 아버지의 손을 잡아 몸을 굽혀 그에게 입을 맞추었습니다
  - 야곱은 아버지의 손을 받아 몸을 굽혀 그에게 입을 맞추었습니다
  lexicon: 손을 잡다 / 몸을 굽히다 / 입을 맞추다
  rationale: 영어 개정본의 ‘took the hand’는 단순한 수동적 접촉보다 ‘손을 잡다’가 더 정확하고 자연스럽습니다. ‘kissed him’은 ‘입맞추다’보다 현대 한국어에서 의미가 분명한 ‘입을 맞추다’로 옮겼습니다.
- source_word: ወተሰቅለ፡ ይስሐቅ፡ ውስተ፡
  english_pob_choice: And Isaac clung to
  chosen_korean: 이삭은 그에게 매달렸습니다…
  alternatives_korean:
  - 이삭은 그에게 매달렸습니다
  - 이삭은 그를 붙들었습니다…
  lexicon: 매달리다 / 붙들다
  rationale: 게즈 동사는 단순한 접촉이 아니라 강하게 달라붙는 동작을 나타내므로, 감정적·육체적 긴밀함을 살린 ‘매달리다’가 적절합니다. 문장이 원문에서 절단되어 있으므로 말줄임표로 미완성을 드러냈습니다.
theological_decisions:
- issue: 원문이 절단된 채로 끝나는 미완성 문장 처리
  chosen_reading: 말줄임표로 미완성을 그대로 드러냈습니다.
  alternative_readings:
  - 문장을 매끈하게 완결하여 번역함
  - 미완성을 표시하지 않고 평서문처럼 끝맺음
  rationale: 영어 본문도 마지막 절이 끊긴 상태를 유지하고 있으므로, 이를 완결시키지 않고 독자가 텍스트의 상태를 확인할 수 있게 하는 것이 स्रोत 충실성에 부합합니다.
  doctrine_reference: 본문비평 / 번역 윤리
