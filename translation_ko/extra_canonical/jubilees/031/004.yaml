  naturalness: ‘그의 제사 때와 그의 어머니 리브가에게도, 이삭이 말했습니다’는 조사와 통사 관계가 부자연스럽습니다. 원문의 절단된 문장 성격을 보존하여 별도 구절로 처리하면 현대 한국어에서도 가장 덜 오해됩니다. 직접화법의 ‘오게 하라’는 인용된 족장의 명령으로 자연스럽고, 서술부의 합쇼체와 충돌하지 않습니다.
