lexical_decisions:
- source_word: ውስተ፡ መሥዋዕቱ፡
  english_pob_choice: at his sacrifice
  chosen_korean: 그의 제사 때
  alternatives_korean:
  - 그의 제사에서
  - 그의 제사 자리에서
  - 그의 제사 무렵
  lexicon: source-preposition
  rationale: Geez ውስተ는 장소·상황의 ‘~에서/때’ 범위를 가질 수 있으므로, 영어 POB의 수정을 반영해 제사 행위의 시점/상황을 자연스럽게 드러내는 ‘때’를 택했습니다.
- source_word: ወኀበ፡ እሙሂ፡ ርብቃ።
  english_pob_choice: and also to his mother Rebekah
  chosen_korean: 그의 어머니 리브가에게도
  alternatives_korean:
  - 그리고 그의 어머니 리브가에게도
  - 또 그의 어머니 리브가에게도
  - 그의 어머니 리브가에게도 또한
  lexicon: source-dative
  rationale: 여격 표지 ወኀበ에 따라 ‘~에게도’로 처리해, 제사와 더불어 리브가에게도 말/행위가 미쳤다는 병렬 관계를 유지했습니다.
- source_word: ይስሐቅ፡ ይምጻእ፡
  english_pob_choice: And Isaac said, “Let my son Jacob come,”
  chosen_korean: 이삭이 말했습니다. “내 아들 야곱을 오게 하라,”
  alternatives_korean:
  - 이삭이 말했습니다. “내 아들 야곱이 오게 하라,”
  - 이삭이 말했습니다. “내 아들 야곱을 데려오라,”
  - 이삭이 말했습니다. “내 아들 야곱이 오게 하십시오,”
  lexicon: imperative-subjunctive
  rationale: Ge‘ez 명령/청유형 ይምጻእ을 한국어에서 간결한 직접명령형 ‘오게 하라’로 옮겨, 요청의 강도를 살리되 현대 합쇼체 본문 흐름과 충돌하지 않게 했습니다.
theological_decisions:
- issue: 족장 서사에서의 직접 화법의 존대 수준
  chosen_reading: 서술문은 합쇼체를 유지하되, 이삭의 인용문은 원문의 직접 발화를 살려 평서적 명령형으로 두었습니다.
  alternative_readings:
  - 인용문까지 모두 간접화하여 ‘오게 하셨습니다’처럼 완화
  - 인용문도 합쇼체 명령으로 ‘오게 하십시오’로 상향
  rationale: 원문은 인용된 직접 화법을 전달하므로, 한국어에서도 화자의 발화 성격을 보존하는 것이 의미상 더 충실합니다.
  doctrine_reference: 직접화법 보존과 서사체 일관성
