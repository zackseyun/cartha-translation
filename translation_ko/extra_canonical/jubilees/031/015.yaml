base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
  footnotes:
  - marker: '15'
    text: The clause rendered 'his paths to Israel' is textually difficult; some interpreters understand a stronger sense such as 'his ordinances' or 'his discipline' for Israel.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 거룩함입니다. 또 그가 그들을 모든 시대에 걸쳐 위대하게 하시기를 바랍니다. 그들은 야곱의 아들들의 모든 씨를 위하여 통치자와 재판관과 우두머리가 될 것입니다. 그들은 의로 주님의 말씀을 말하고, 의로 그의 모든 판결을 재판할 것이며, 야곱에게는 그의 길들을, 이스라엘에게는 그의 길들을 선포할 것입니다. 주님의 복이 그들의 입에 있을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቅዱስ
  english_pob_choice: and holiness
  chosen_korean: 거룩함
  alternatives_korean:
  - 거룩한 상태
  - 성결
  lexicon: source lexical field of holiness / sanctity
  rationale: 문맥상 독립 명사로 쓰인 거룩함을 가장 직접적으로 옮겼습니다. 형용사화하지 않고 앞 문장 단편의 성격을 유지했습니다.
- source_word: ወመኳንንተ፡ ወመሳፍንተ፡ ወመላእክተ፡
  english_pob_choice: princes and judges and chiefs
  chosen_korean: 통치자와 재판관과 우두머리
  alternatives_korean:
  - 군왕과 재판관과 지도자
  - 공작과 재판관과 장관
  lexicon: common Ge'ez political offices
  rationale: 세 직분의 계층적 공적 역할을 현대 한국어로 자연스럽게 살리되, 전통 교회어보다 원문의 일반 행정·통치 의미가 드러나도록 옮겼습니다.
- source_word: ቃሎ ለእግዚአብሔር
  english_pob_choice: the word of the Lord
  chosen_korean: 주님의 말씀
  alternatives_korean:
  - 주님의 말
  - 주님의 언약의 말씀
  lexicon: divine speech formula
  rationale: ‘word of the Lord’의 예언적·권위적 표현을 표준적인 현대 한국어로 옮겼습니다. 여기서는 야훼의 인용으로 보이는 별도 전승 표지가 없어 ‘주님’을 유지했습니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 가운데
  - 공의로
  lexicon: δικαιοσύνη-equivalent / righteousness adverbial
  rationale: 행위 방식의 부사구이므로 간결하게 ‘의로’로 처리하여 두 번 반복된 도덕적·재판적 정당성을 유지했습니다.
- source_word: ወይነግሩ ፍኖቶ ለያዕቆብ ወአስርኖ ለእስራኤል
  english_pob_choice: they shall declare his ways to Jacob and his paths to Israel
  chosen_korean: 야곱에게는 그의 길들을, 이스라엘에게는 그의 길들을 선포할 것입니다
  alternatives_korean:
  - 야곱에게는 그의 길들을, 이스라엘에게는 그의 행보를 알릴 것입니다
  - 야곱에게는 그의 길들을, 이스라엘에게는 그의 규례들을 선포할 것입니다
  lexicon: ambiguous parallel phrase with textual difficulty
  rationale: 영문 각주가 지적하듯 뒤 구절은 본문상 난해하므로, 기본 독법을 살리면서도 동일 어휘를 반복해 원문의 병행성과 난점을 드러냈습니다.
- source_word: በረከተ፡ ለእግዚ
  english_pob_choice: The blessing of the Lord shall be in their mouths
  chosen_korean: 주님의 복이 그들의 입에 있을 것입니다
  alternatives_korean:
  - 주님의 복이 그들의 입에 있을 것입니다
  - 주님의 복이 그들의 입에 있게 될 것입니다
  lexicon: blessing formula
  rationale: 영문 개정판의 수정 사항을 반영해 ‘주어지다’의 의미를 덧붙이지 않고, 단순 존재 서술로 옮겼습니다.
theological_decisions:
- issue: ‘word of the Lord’와 ‘blessing of the Lord’의 신적 발화/축복 표현
  chosen_reading: 직접적 신적 권위와 축복의 현존을 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 보다 완화된 ‘주님의 말씀을 전할 것입니다’
  - ‘주님의 복을 빌 것입니다’
  rationale: 본문은 단순 전달이나 소망이 아니라, 지도자들이 야곱과 이스라엘 앞에서 야훼의 말씀과 복을 매개하는 역할을 말하므로 그 권위감을 약화하지 않았습니다.
  doctrine_reference: 예언적 발화와 제사적 축복의 언어
- issue: 후반 평행구 ‘his ways / his paths’의 난해성
  chosen_reading: 기본 독법을 따라 ‘그의 길들’로 두 번 옮기고, 난점을 드러내도록 평행 구조를 유지했습니다.
  alternative_readings:
  - ‘그의 길들과 그의 규례들’
  - ‘그의 길들과 그의 훈육’
  rationale: 영문 POB 각주가 지적한 본문 난점을 감추지 않고, 한국어 본문에서도 반복 어휘로 불확실성을 보존하는 편이 더 투명합니다.
  doctrine_reference: 본문 비평과 해석의 불확실성 보존
