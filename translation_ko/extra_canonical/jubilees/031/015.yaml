  source_fidelity: 첫 구절의 ወለቅዱስ는 문맥상 독립 명사 ‘거룩함’이라기보다 ‘그들을 거룩하게 하시고’라는 동사적 축복/기원 표현으로 읽는 것이 자연스럽습니다. 이를 반영했습니다. 나머지는 주어진 영어 POB의 의미 흐름과 게에즈어의 병행 구조를 대체로 충실히 따릅니다. 후반의 ‘길/행로’ 병행은 난해성을 보존했습니다.
  naturalness: ‘그리고 거룩함입니다’는 한국어에서 문장 단편으로도 매우 부자연스럽고, 원문의 동사적 의미를 흐립니다. 또한 ‘야곱의 아들들의 모든 씨를 위하여’는 직역투이므로 ‘야곱의 아들들의 모든 자손을 위하여’로 고쳤습니다. ‘그의 모든 판결을 재판하다’도 자연스럽지 않아 ‘그의 모든 심판을 의롭게 집행하다’로 다듬었습니다.
