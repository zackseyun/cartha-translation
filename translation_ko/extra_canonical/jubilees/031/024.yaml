  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
  footnotes:
  - marker: a
    text: Or 'And righteousness passed over to him.'.
    reason: previous_rendering
  - marker: b
    text: Or 'everything that the Lord had done with him, the great mercy'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그것이 그에게 의로 여겨졌습니다.[a] 야곱은 밤에 아버지에게, 주께서 야곱에게 큰 자비를 베푸시고 그의 모든 길을 형통하게 하시며 모든 것에서 그를 보호하신 모든 일을 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “의가 그에게로 지나갔습니다.”
    reason: 제시된 게에즈 본문에 보이는 ‘지나가다’라는 이문적/오독 가능성을 반영합니다. 본문은 문맥 및 정정된 독법에 따라 ‘의로 여겨졌다’로 번역합니다.
lexical_decisions:
- source_word: ወተኈለቈ / ወተኀለፈ
  english_pob_choice: it was reckoned to him as righteousness
  chosen_korean: 그것은 그에게 의로 여겨졌습니다
  alternatives_korean:
  - 그에게 의로 계산되었습니다
  - 의가 그에게 돌려졌습니다
  lexicon: חשב / λογίζομαι 계열 관용구
  rationale: 주어진 영어 POB의 수정안에 따라 ‘의로 여겨지다’로 옮겨, 단순 통과나 이동이 아니라 의로 간주·계산되는 관용구의 의미를 살렸습니다.
- source_word: እግዚአ ብሔር
  english_pob_choice: the Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 야훼께서
  lexicon: 주(主) / κύριος 대응
  rationale: 지시 대상이 하나님이므로 문맥상 ‘주께서’로 자연스럽게 옮겼습니다. 본절은 직접 인용된 야훼 표기가 아니라 서술문 안의 칭호이므로, 본문에는 ‘주’ 계열을 유지했습니다.
- source_word: ሣህለ ዐቢየ
  english_pob_choice: great mercy
  chosen_korean: 큰 자비
  alternatives_korean:
  - 큰 긍휼
  - 지극한 은총
  lexicon: 자비 / mercy
  rationale: Ge'ez의 ‘큰 자비’를 직역에 가깝게 반영하되, 한국어에서 자연스러운 종교문체인 ‘큰 자비’로 옮겼습니다.
- source_word: ሠርሖ ኵሎ ፍኖቲሁ
  english_pob_choice: had made all his ways prosper
  chosen_korean: 자기의 모든 길을 형통하게 하시고
  alternatives_korean:
  - 자기의 모든 길이 잘되게 하시고
  - 자기의 모든 길에 성공을 주시고
  lexicon: 번영/형통 동사구
  rationale: ‘모든 길’에 대한 하나님의 적극적 인도와 결과를 살리기 위해 ‘형통하게 하시고’를 택했습니다. 한국어 성경 전통에서 익숙하지만, 본문의 ‘주께서 하신 일’ 구조도 유지합니다.
- source_word: ወተማኅፀኖ እምኵሉ
  english_pob_choice: had protected him from everything
  chosen_korean: 모든 것에서 그를 보호하신
  alternatives_korean:
  - 모든 것으로부터 그를 지키신
  - 모든 해악에서 그를 보호하신
  lexicon: 보호 / 지키다
  rationale: 영어 POB의 확정된 의미를 반영해 ‘보호하신’으로 옮겼고, ‘from everything’을 과도하게 구체화하지 않기 위해 ‘모든 것에서’로 남겼습니다.
theological_decisions:
- issue: 의로 ‘여겨짐’의 수동적 선언 여부
  chosen_reading: 의는 인간이 만들어내는 성취가 아니라 하나님 앞에서 주어지는 평가로 표현했습니다.
  alternative_readings:
  - 의로 계산되었습니다
  - 의가 그에게 돌려졌습니다
  rationale: 창 15:6류의 법정적/언약적 표현을 한국어에서 가장 분명하게 드러내기 위해 ‘여겨졌습니다’를 선택했습니다. 이는 행위 공로가 아니라 선언적 인정이라는 뉘앙스를 유지합니다.
  doctrine_reference: 칭의의 선언성
- issue: ‘주께서’의 호칭 사용
  chosen_reading: 본문의 ‘주’는 문맥상 하나님을 가리키는 일반 호칭으로 처리했습니다.
  alternative_readings:
  - 야훼께서
  - 하나님께서
  rationale: 직접 인용된 야훼 발화가 아니므로 고유명 ‘야훼’를 본문에 삽입하지 않고, 서술 흐름에 맞는 ‘주께서’를 택했습니다.
  doctrine_reference: 하나님의 칭호 번역 원칙
