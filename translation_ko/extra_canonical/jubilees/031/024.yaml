  to: 그리고 그것이 그에게 의로 여겨졌습니다.[a] 야곱은 밤에 아버지에게, 주께서 야곱에게 큰 자비를 베푸시고 그의 모든 길을 형통하게 하시며 모든 것에서 그를 보호하신 모든 일을 말했습니다.
