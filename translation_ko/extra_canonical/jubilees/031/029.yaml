revisions:
- from: 당신이 나를 살아 있는 채로 보았고, 나도 내 아들을 보았으니, 그 날에<sup>a</sup> 복을 받고 네가 서원한 서원을 완수하십시오. 네 서원을 미루지 마십시오. 서원에 관하여 심문을 받을 것이기 때문입니다. 이제 서둘러 그것을 행하십시오.[a]
  to: 당신이 나를 살아 있는 모습으로 보았고 나도 당신을 보았으니, 내 아들이여, 번성하십시오. 네가 서원한 것을 이행하고, 네 서원을 미루지 마십시오. 서원에 대해 책임을 추궁받을 것이기 때문입니다. 이제 그것을 서둘러 이행하십시오.
  rationale: 원문의 인과적 접속구를 ‘~하였으니’로 옮기고, ‘너를 보았다, 내 아들아’라는 호격과 목적어를 바로잡았습니다. 명령형 ‘번성하라’를 보존했으며, 서원에 대한 책임 추궁을 자연스러운 한국어로 표현했습니다. 잘못된 시간 해석 및 구조적으로 불완전한 각주 표지는 삭제했습니다.
