  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
  footnotes:
  - marker: a
    text: Or 'the day on which'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신이 나를 살아 있는 모습으로 보았고 나도 당신을 보았으니, 내 아들이여, 번성하십시오. 네가 서원한 것을 이행하고, 네 서원을 미루지 마십시오. 서원에 대해 책임을 추궁받을 것이기 때문입니다. 이제 그것을 서둘러 이행하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  english_pob_choice: in that
  chosen_korean: 그 날에
  alternatives_korean:
  - 그 일로
  - 그런 까닭에
  - 그때
  lexicon: Ge'ez 접속 표현
  rationale: 문맥상 원인은 앞뒤 대조가 아니라 ‘너는 나를 살아 있게 보았고 나도 너를 보았다’는 사실에 이어지는 시간·상황 표지로 기능하므로, 본문에 붙는 주해각주로 처리하고 자연스러운 한국어 본문은 간결하게 옮겼습니다.
- source_word: ጸሎተ፡ ... ጸለይከ፡ / ወግበር፡ ጸሎተከ፡
  english_pob_choice: fulfill the vow ... do not delay your vow
  chosen_korean: 네가 서원한 서원을 완수하십시오 ... 네 서원을 미루지 마십시오
  alternatives_korean:
  - 네 서원을 이루십시오
  - 네 서원을 지키십시오
  - 네 서원을 행하십시오
  lexicon: 서원 관련 어휘
  rationale: Ge'ez의 반복구는 서원이 단순히 ‘말하는 것’이 아니라 이미 한 서원을 끝까지 이행하는 뜻이므로, 전통적이지만 의미를 분명히 하는 ‘완수하다’를 택했습니다.
- source_word: ትትኀሠሥ፡
  english_pob_choice: will be called to account
  chosen_korean: 심문을 받을 것이기 때문입니다
  alternatives_korean:
  - 책망을 받을 것이기 때문입니다
  - 따져 물음을 받을 것이기 때문입니다
  - 서원에 대해 추궁을 받을 것이기 때문입니다
  lexicon: Ge'ez 책임/조사 표현
  rationale: 직역적인 ‘찾음을 당하다’보다, 서원에 대해 책임을 묻는 의미가 드러나는 ‘심문을 받다’가 본문의 경고성을 더 잘 살립니다.
theological_decisions:
- issue: 서원 이행의 긴박성과 책임성
  chosen_reading: 서원은 미루지 말고 즉시 완수해야 하며, 하나님 앞에서 책임을 묻는 일로 제시됩니다.
  alternative_readings:
  - 서원은 단지 권면 수준으로 완곡하게 이해할 수 있습니다.
  - ‘심문’을 약화시켜 단순한 점검 정도로 볼 수 있습니다.
  rationale: 본문은 축복의 권면과 함께 서원 지연에 대한 경고를 병치하므로, 경고의 강도를 살려 도덕적·종교적 책임성을 분명히 했습니다.
  doctrine_reference: 민수기 30장; 전도서 5:4-5의 서원 경고 전통
- issue: ʻ그 날에’ 주해 처리
  chosen_reading: 게에즈 접속구를 본문은 자연스럽게 읽고, 정확한 의미 범위는 각주로 열어 둡니다.
  alternative_readings:
  - ‘그 날에’로 본문에 직접 넣을 수 있습니다.
  - ‘그 일로’로 완전히 의미를 옮길 수 있습니다.
  rationale: 현재 게에즈는 문맥상 ‘in that/since’ 계열이 유력하나, 영어 POB의 이전 각주가 남긴 해석 폭을 보존하기 위해 본문은 간결하게 두고 주해각주를 달았습니다.
  doctrine_reference: 번역학적 판단
