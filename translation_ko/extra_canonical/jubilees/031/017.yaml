  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
  footnotes:
  - marker: a
    text: Or 'And blessed be the one who blesses you,'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 상이 가득하고, 당신의 먹을 것이 모든 시대에 걸쳐 떨어지지 않기를 바랍니다. 또 당신을 미워하는 모든 자는 당신 앞에서 쓰러질 것이며, 당신의 모든 대적은 뿌리 뽑히고 멸망할 것입니다. 그리고 당신을 축복하는 자는[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 당신을 축복하는 자가 복되기를.”
    reason: 이전의 완결형 번역 가능성을 제시합니다. 그러나 게에즈어 본문의 이 절은 ‘당신을 축복하는 자는’으로 끝나며, 술어는 다음 절에서 이어집니다.
lexical_decisions:
- source_word: ትውልድ፡
  english_pob_choice: for all ages
  chosen_korean: 모든 세대에 걸쳐
  alternatives_korean:
  - 모든 시대에
  - 영원토록
  lexicon: Geez ትውልድ
  rationale: 지속 범위를 자연스럽게 살리되, 원문의 세대적·역사적 반복성을 보존하기 위해 ‘모든 세대에 걸쳐’로 옮겼습니다.
- source_word: ትኩን፡ ማዕድከ፡ ምልእተ፡
  english_pob_choice: May your table be full
  chosen_korean: 너의 상이 가득하고
  alternatives_korean:
  - 네 상이 가득하기를 바랍니다
  - 네 식탁이 가득하기를 바랍니다
  lexicon: Geez ማዕድ
  rationale: 문자적 ‘식탁’보다 공동 식사와 복의 충만을 담는 ‘상’이 원문의 이미지와 더 직접적으로 대응합니다.
- source_word: ወኵሎሙ፡ እለ፡ ይጸልኡከ፡ ቅድሜከ፡ ይደቁ፡
  english_pob_choice: And all who hate you shall fall before you
  chosen_korean: 너를 미워하는 모든 자는 너 앞에서 넘어지고
  alternatives_korean:
  - 너를 미워하는 모든 자는 너 앞에 엎드리고
  - 너를 미워하는 모든 자는 너 앞에서 쓰러지고
  lexicon: Geez יጸልኡ / ይደቁ
  rationale: ‘넘어지다’는 단순 추락이 아니라 패배와 굴복의 결과를 함께 드러내어, 적대자들의 몰락이라는 문맥을 살립니다.
- source_word: ወኵሎሙ፡ ዐርከ፡ ይሠረዉ፡ ወይትሐጐሉ፡
  english_pob_choice: And all your adversaries shall be rooted out and perish
  chosen_korean: 너의 모든 대적은 뿌리 뽑혀 사라질 것입니다
  alternatives_korean:
  - 너의 모든 대적은 뿌리째 뽑혀 망할 것입니다
  - 너의 모든 적대자들은 뽑혀서 멸망할 것입니다
  lexicon: Geez ይሠረዉ / ይትሐጐሉ
  rationale: 두 동작의 연쇄를 한국어에서 과도하게 늘리지 않으면서도, ‘뿌리 뽑히다’로 제거의 이미지를, ‘사라지다’로 소멸의 결과를 반영했습니다.
theological_decisions:
- issue: 축복 선언의 종결이 다음 절로 이어지는 구조
  chosen_reading: 이 절은 마지막의 ‘너를 축복하는 자는’으로 끝내고, 축복의 완료형은 다음 절에서 처리합니다.
  alternative_readings:
  - ‘너를 축복하는 자는 복을 받을 것입니다’처럼 이 절에서 완결
  - ‘너를 축복하는 자가 복되기를’로 이 절에서 완결
  rationale: 히브리계/게에즈 계열 전승에서 문장 경계가 절을 가로지르므로, 영어 POB의 최신 수정과 맞추어 다음 절과 중복되지 않게 끝맺었습니다.
  doctrine_reference: 본문 분절과 절 경계 보존
- issue: 저주/심판 표현의 강도
  chosen_reading: ‘대적’과 ‘뿌리 뽑혀 사라질 것입니다’로 적대자에 대한 심판을 직접적으로 유지합니다.
  alternative_readings:
  - ‘반대하는 자’로 완화
  - ‘사라질 것입니다’를 ‘패할 것입니다’로 완화
  rationale: 원문은 단순한 패배가 아니라 제거와 소멸의 이미지를 담고 있어, 이를 완화하면 본문의 축복-저주 대비가 약해집니다.
  doctrine_reference: 시적 축복 선언의 직접성
