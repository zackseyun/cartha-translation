  text: with you. And I know, my son, that it was for my sake you came, and this day shall be blessed.
translation:
  language: ko
  text: 그대와 함께. 그리고 내 아들아, 네가 나 때문에 왔다는 것을 내가 압니다. 이 날은 복될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌከ
  english_pob_choice: with you
  chosen_korean: 당신과 함께 있습니다
  alternatives_korean:
  - 당신과 함께 있습니다
  - 당신과 함께 있었습니다
  lexicon: msp-1
  rationale: 문맥상 앞 절의 결속을 이어 주는 전치사구로, 한국어에서는 자연스럽게 ‘함께 있습니다’로 옮겨 현재적 동행의 감각을 살렸습니다.
- source_word: ወአእምር፡ አነ፡ ወልድየ
  english_pob_choice: And I know, my son
  chosen_korean: 그리고 제 아들아, 그것이 내 때문임을 내가 압니다
  alternatives_korean:
  - 그리고 제 아들아, 내가 압니다
  - 그리고 제 아들아, 그것이 내 때문인 줄 압니다
  lexicon: ʾəʿmər-1
  rationale: ‘안다’의 주어를 분명히 하고, 호격 ‘내 아들아’를 한국어 어순에 맞게 앞에 두었습니다. 이어지는 내용절은 게에즈의 ‘~것이 내 때문임’을 반영해 축약하지 않았습니다.
- source_word: ከመስ፡ በእንቲአየ፡ መጻእከ፡
  english_pob_choice: that it was for my sake you came
  chosen_korean: 그것이 내 때문임을 내가 압니다
  alternatives_korean:
  - 당신이 내 때문에 왔음을 내가 압니다
  - 당신이 나를 위해 오셨음을 내가 압니다
  lexicon: metsaʾ-1
  rationale: 게에즈의 목적/원인 표현 ‘내 때문임’(for my sake)을 직접 살려, 관계적 의미를 약화시키는 ‘나를 위해’보다 원인성을 드러내는 표현을 택했습니다.
- source_word: ወዛቲ፡ ዕለት፡ ትኩን፡ ቡርክት፡
  english_pob_choice: and this day shall be blessed
  chosen_korean: 이 날은 복된 날이 될 것입니다
  alternatives_korean:
  - 이 날은 복을 받을 것입니다
  - 이 날은 복되게 될 것입니다
  lexicon: barakat-1
  rationale: 수동형 ‘복되다/축복받다’의 의미를 한국어에서 가장 자연스럽게 살려, 선언적 미래형으로 옮겼습니다.
theological_decisions:
- issue: ‘for my sake’의 원인성 보존
  chosen_reading: 아들이 아버지에게서 온 이유를 ‘내 때문임’으로 직접 진술하는 원인 표현을 유지했습니다.
  alternative_readings:
  - 관계적 호의로 완화해 ‘나를 위해’로 번역
  - 서술을 일반화해 이유를 생략
  rationale: 본문은 단순한 호의가 아니라 화자의 존재/행위가 방문의 이유였음을 말하므로, 원인성을 약화시키지 않는 쪽이 더 충실합니다.
  doctrine_reference: 원문 의미 보존 원칙
- issue: ‘복된 날’의 선언성
  chosen_reading: 이 날의 복됨을 단순한 소망이 아니라 선언적 미래로 옮겼습니다.
  alternative_readings:
  - ‘복되기를 바랍니다’ 같은 기원형
  - ‘복이 있을 것입니다’의 중립적 예측형
  rationale: 게에즈 문장은 미래 계시처럼 선언하는 뉘앙스가 있어, 합쇼체에서도 약한 기원보다 선언형이 더 가깝습니다.
  doctrine_reference: 서사/예언적 미래 이해
