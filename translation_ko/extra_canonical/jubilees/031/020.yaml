base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
  footnotes:
  - marker: '20'
    text: The phrase about sitting 'on the throne of the honor of your righteousness' is dense and may be construed more compactly as 'on the glorious throne of your righteousness.'
    reason: segmentation_note
  - marker: a
    text: Or 'his sons forever'.
    reason: previous_rendering
  - marker: b
    text: Or 'And when you sit'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 네 안에서 이스라엘의 구원이 발견될 것입니다. 네가 네 의의 영광의 보좌에 앉는 날에, 사랑하는 이의 아들들의 모든 자손에게 큰 평강이 있을 것입니다.[20] 너를 축복하는 이는 복을 받을 것입니다. 너를 미워하고 괴롭히는 모든 이와 너를 저주하는 이들은 뿌리째 뽑히고 멸망할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '20'
    text: ‘네 의의 영광의 보좌’라는 표현은 밀도 높은 결합 표현입니다. 더 간결하게는 ‘네 의의 영광스러운 보좌’로 이해할 수도 있습니다.
    reason: segmentation_note
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  english_pob_choice: the salvation of Israel
  chosen_korean: 이스라엘의 구원
  alternatives_korean:
  - 이스라엘의 спасение
  - 이스라엘을 위한 구원
  - 이스라엘의 구원책
  lexicon: መድኃኒት
  rationale: 구원이라는 핵심 명사를 그대로 살려, 이스라엘에 속한 구원이라는 직접적 의미를 자연스럽게 옮겼습니다.
- source_word: ወአመ፡ ዕለት፡ ትነብር፡
  english_pob_choice: And on the day you sit
  chosen_korean: 그리고 네가 … 앉는 날에
  alternatives_korean:
  - 그리고 네가 앉을 때
  - 그리고 네가 앉는 날에
  lexicon: ዕለት / ትነብር
  rationale: POB의 수정 노트가 지적하듯 ‘날’(ዕለት)을 살려 시간 표현을 분명히 했고, 한국어에서는 자연스러운 종속절로 옮겼습니다.
- source_word: መንበረ፡ *ክብር፡ ጽድቅከ፡
  english_pob_choice: the throne of the glory of your righteousness
  chosen_korean: 영광의 보좌
  alternatives_korean:
  - 의의 영광의 보좌
  - 네 의의 영광의 보좌
  - 네 의의 존귀의 보좌
  lexicon: መንበር / ክብር / ጽድቅ
  rationale: 핵심 이미지는 ‘영광의 보좌’이며, ‘네 의’는 앞뒤 문맥에 이미 내포되어 있어 한국어에서는 중복을 줄여도 원뜻을 유지할 수 있습니다.
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር፡
  english_pob_choice: all the seed of the sons of the beloved
  chosen_korean: 사랑하는 아들의 모든 씨
  alternatives_korean:
  - 사랑하는 이의 아들들의 모든 씨
  - 사랑하는 아들의 자손 모두
  - 사랑받는 아들의 모든 씨
  lexicon: ዘር / ውሉድ / ፍቅር
  rationale: 최근 검토처럼 ለፍቅር은 ‘사랑하는’으로 읽는 것이 타당하며, ውሉዱ를 반영해 ‘아들’ 계열 표현을 유지했습니다.
- source_word: ይጸልኡከ፡ ወይሣቅዩከ፡ ወእለሂ፡ ይረግሙከ፡
  english_pob_choice: all who hate you and afflict you, and those who curse you
  chosen_korean: 너를 미워하고 너를 괴롭히는 모든 자들과 너를 저주하는 자들
  alternatives_korean:
  - 너를 미워하고 너를 학대하는 모든 자들
  - 너를 미워하고 너를 고통 주는 모든 자들, 그리고 너를 저주하는 자들
  lexicon: ይጸልኡ / ይሣቅዩ / ይረግሙ
  rationale: 세 동사를 서로 구분해 원문의 적대와 박해, 저주를 모두 드러내면서도 한국어 흐름은 매끄럽게 유지했습니다.
theological_decisions:
- issue: ‘구원’의 주체와 시점
  chosen_reading: 이 구절은 장차 메시아적 인물에게서 이스라엘의 구원이 ‘발견된다’고 말하며, 단순한 도덕적 구원보다 종말론적·언약적 구원을 강조합니다.
  alternative_readings:
  - 현재적 구원의 발견
  - 일반적 보호나 번영
  rationale: Geez 동사와 문맥상 미래적 선언이며, POB의 영어도 salvation을 유지하므로 이를 약화하지 않았습니다.
  doctrine_reference: Jubilees apocalyptic-messianic expectation
- issue: ‘영광의 보좌’와 ‘네 의’의 결합
  chosen_reading: ‘의의 영광의 보좌’라는 복합어를 한국어에서는 ‘영광의 보좌’로 간명하게 옮기되, 보좌의 영광이 곧 그 인물의 의와 연결된다는 점은 유지했습니다.
  alternative_readings:
  - 네 의의 영광의 보좌
  - 영광스러운 네 의의 보좌
  rationale: 원문은 밀도 높은 병렬구조이므로, 한국어에서 과도하게 직역하면 의미가 흐려질 수 있어 핵심 이미지를 우선했습니다.
  doctrine_reference: Apocalyptic enthronement imagery
