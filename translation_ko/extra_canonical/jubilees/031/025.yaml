  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: ko
  text: 그리고 이삭은 자기 아버지 아브라함의 하나님을 찬송하였습니다. 그분은 그분의 종 이삭의 아들에게서 그분의 자비와 의를 거두지 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እኩይ።
  english_pob_choice: And
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 그리하여
  lexicon: 접속사
  rationale: 문맥상 앞뒤를 자연스럽게 잇는 단순 연결어로 처리하는 것이 가장 안정적입니다.
- source_word: ወባረኮ፡
  english_pob_choice: blessed
  chosen_korean: 축복하였는데
  alternatives_korean:
  - 복을 빌었는데
  - 찬송하였는데
  lexicon: 동사
  rationale: 주어 이삭이 하나님을 향해 말하는 행위로서, 단순한 찬양보다 ‘축복하다’가 원문의 방향성을 더 잘 드러냅니다.
- source_word: አምላከ፡ አቡሁ፡ አብርሃም፡
  english_pob_choice: the God of his father Abraham
  chosen_korean: 자기의 아버지 아브라함의 하나님
  alternatives_korean:
  - 그의 아버지 아브라함의 하나님
  - 아버지 아브라함의 하나님
  lexicon: 소유·호칭 구문
  rationale: 아브라함을 ‘아버지’로, 하나님을 그 아버지의 하나님으로 지칭하는 관계를 한국어 어순에 맞게 보존했습니다.
- source_word: ዘአኀደገ፡ ምሕረተ፡ ወጽድቀ፡
  english_pob_choice: who had not withheld his mercy and his righteousness
  chosen_korean: 그분은 … 자기의 자비와 자기의 의를 거두지 않으셨습니다
  alternatives_korean:
  - 그분은 … 자기의 긍휼과 자기의 의를 거두지 않으셨습니다
  - 그분은 … 자기의 자비와 자기의 공의를 거두지 않으셨습니다
  lexicon: 동사·명사
  rationale: ‘거두지 않으셨다’는 POB의 부정 동사 구조를 유지해, 하나님이 자비와 의를 계속 베푸셨다는 점을 분명히 했습니다. ጽድቅ은 여기서 법정적/언약적 ‘의’가 자연스럽습니다.
- source_word: ወልደ፡ ገብሩ፡ ይስሐቅ።
  english_pob_choice: the son of his servant Isaac
  chosen_korean: 자기의 종 이삭에게서
  alternatives_korean:
  - 자기의 종 이삭의 아들에게
  - 자기의 종 이삭의 아들에게서
  lexicon: 관계구문
  rationale: 게에즈 원문은 ‘종 이삭의 아들’이라는 관계를 포함하므로, 한국어에서는 압축해 ‘자기의 종 이삭에게서’로 옮겨 관계와 출처성을 살렸습니다.
theological_decisions:
- issue: 하나님이 ‘자비와 의’를 베푸신다는 표현의 균형
  chosen_reading: 자비와 의를 함께 유지했습니다.
  alternative_readings:
  - 자비만 번역하거나 의를 공의로 완화함
  rationale: 원문은 두 항목을 병렬로 제시하므로 한쪽을 다른 표현으로 흡수하지 않고 둘 다 살려 언약적 신실함과 न्याय적 성격을 함께 드러내야 합니다.
  doctrine_reference: 언약적 신실성과 하나님의 의
