translation:
  language: ko
  text: 그 달의 초하루에 야곱이 자기 집안의 모든 사람에게 말하며 이르기를, “몸을 정결하게 하고 옷을 갈아입으십시오. 그리고 일어나 베델로 올라갑시다. 내가 내 형 에서의 얼굴을 피하여 달아나던 날에 그에게 기도한 곳입니다. 그가 나와 함께하시고 이 땅으로 나를 평안히 돌아오게 하셨습니다. 그리고 …”[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበሠርቀ፡ ወርኅ፡
  english_pob_choice: on the new moon of the month
  chosen_korean: 그 달의 초하루에
  alternatives_korean:
  - 그 달의 신월에
  - 그 달의 새달에
  - 그 달의 첫날에
  lexicon: source phrase
  rationale: Ge'ez 표현은 ‘첫째 달’이 아니라 월삭/초하루를 뜻하므로, 한국어에서는 자연스럽고 정확한 ‘그 달의 초하루에’로 옮겼습니다.
- source_word: ንጽሑ፡
  english_pob_choice: Purify yourselves
  chosen_korean: 몸을 정결하게 하고
  alternatives_korean:
  - 스스로를 정결하게 하십시오
  - 정결하게 하십시오
  - 몸을 깨끗이 하십시오
  lexicon: source phrase
  rationale: 의례적·언약적 정결을 가리키므로 단순 위생보다 넓은 의미가 드러나도록 ‘몸을 정결하게 하고’로 번역했습니다.
- source_word: ወወልጡ፡ አልባሲክሙ፡
  english_pob_choice: change your garments
  chosen_korean: 옷을 갈아입으십시오
  alternatives_korean:
  - 옷을 바꾸십시오
  - 겉옷을 바꾸십시오
  - 옷을 갈아입고
  lexicon: source phrase
  rationale: 수정본의 의미에 따라 ‘씻다’가 아니라 복장 교체를 뜻하는 ‘옷을 갈아입다’를 택했습니다.
- source_word: ወሜጠኒ
  english_pob_choice: brought me back
  chosen_korean: 나를 평안히 돌아오게 하셨습니다
  alternatives_korean:
  - 나를 되돌려 보내셨습니다
  - 나를 다시 데려오셨습니다
  - 나를 돌아오게 하셨습니다
  lexicon: source phrase
  rationale: 동사는 귀환을 뜻하므로 ‘돌아오게 하셨습니다’로 옮기되, 문맥상 반환의 성취를 살려 ‘평안히’를 보강했습니다.
- source_word: ውስተ፡ ዛቲ፡ ምድር፡ በሰላም።
  english_pob_choice: into this land in peace
  chosen_korean: 이 땅으로 … 평안히
  alternatives_korean:
  - 이 땅에 평안히
  - 이 땅으로 평화 가운데
  - 이 땅에 안전하게
  lexicon: source phrase
  rationale: ‘평안’은 POB의 일관된 평강/평안 어휘와도 맞고, 귀환의 신학적 안식을 전달합니다.
theological_decisions:
- issue: 문장 끝이 다음 절로 이어지는 미완성 명령형
  chosen_reading: 본문의 ‘그리고 …’를 열어 둔 채 인용문을 닫지 않았습니다.
  alternative_readings:
  - 본문을 임의로 완결하여 번역하기
  - 다음 절의 내용을 미리 보태어 매끄럽게 처리하기
  rationale: 소스가 다음 절로 이어지는 명령을 끊지 않고 있으므로, 독자가 원문의 미완결성을 보도록 남겨 두는 것이 더 충실합니다.
