translation:
  language: ko
  text: 그리고 그는 자기 아버지 이삭과 자기 어머니 리브가에게로 왔습니다. 리브가는 자기 방에서 나와 방의 문까지 가서 야곱에게 입맞추고 그를 안아 주려고 했습니다. 그녀의 영은 그때 살아났기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወመጽአ፡ ኀበ፡ አቡሁ፡ ይስሐቅ፡ ወኀበ፡ እሙ፡ ርብቃ።
  english_pob_choice: And he came to his father Isaac and to his mother Rebekah.
  chosen_korean: 그리고 그는 자기 아버지 이삭과 자기 어머니 리브가에게로 왔습니다.
  alternatives_korean:
  - 그는 자기 아버지 이삭과 자기 어머니 리브가에게 왔습니다.
  lexicon: 기본 서술 동사/이동 표현
  rationale: 접속사 ወ의 연속을 자연스럽게 옮기되, 원문의 도착 방향성을 살려 ‘에게로 왔습니다’로 다듬었습니다.
- source_word: ወወፅአት፡ ርብቃ፡ እማኅፈድ፡ *ውስተ፡ አንቀጸ፡ ማኅፈድ፡
  english_pob_choice: And Rebekah came out from the chamber to the door of the chamber
  chosen_korean: 리브가는 자기 방에서 나와 방의 문까지 가서
  alternatives_korean:
  - 리브가는 방에서 나와 방의 문으로 갔습니다.
  - 리브가는 방에서 나와 방 문턱까지 갔습니다.
  lexicon: ማኅፈድ (māḫfad)
  rationale: 같은 단어 ማኅፈድ이 두 번 반복되므로 두 번 모두 ‘방’으로 일관되게 옮겨 원문의 반복을 보존했습니다. አንቀጸ는 이 문맥에서 ‘문’이 가장 직접적입니다.
- source_word: ከመ፡ ትስዐሞ፡ ለያዕቆብ፡ ወትሕቀፎ፡
  english_pob_choice: to kiss Jacob and embrace him
  chosen_korean: 야곱에게 입맞추고 그를 안아 주려고 했습니다.
  alternatives_korean:
  - 야곱에게 입맞추고 그를 껴안으려고 했습니다.
  lexicon: 동작 목적/의도 표현
  rationale: ከመ는 목적·의도 뉘앙스를 띠므로 단순 과거 서술보다 ‘-려고 했습니다’가 더 정확합니다. ‘안아 주다’는 ትሕቀፎ의 포옹 동작을 자연스럽게 옮깁니다.
- source_word: እስመ፡ ሐይወ፡ መንፈሳ፡ በጊዜ፡
  english_pob_choice: for her spirit had revived when...
  chosen_korean: 그녀의 영은 그때 살아났기 때문입니다.
  alternatives_korean:
  - 그녀의 영이 회복되었기 때문입니다.
  - 그녀의 영이 살아났을 때이기 때문입니다.
  lexicon: መንፈስ / ሐይወ
  rationale: መንፈሳ는 여기서 생명력/기운으로 살아난 상태를 가리키므로 ‘영’으로 두되, ሐይወ는 ‘살아났습니다’로 직역해 회복의 효과를 살렸습니다. በጊዜ는 본문상 절 끝에 남아 있어 ‘그때’로 처리해 dangling ‘when’ 문제를 반영했습니다.
theological_decisions:
- issue: Rebekah의 'spirit' 표현
  chosen_reading: ‘그녀의 영’으로 옮겨 내적 생명력이 회복된 상태를 유지했습니다.
  alternative_readings:
  - ‘그녀의 마음’으로 완화할 수 있습니다.
  - ‘기력이 돌아왔다’로 의미를 풀 수 있습니다.
  rationale: 본문은 단순 감정 변화보다 생명/기운의 회복을 말하므로, 심리적 표현으로 약화하지 않고 ‘영’과 ‘살아났습니다’를 함께 유지했습니다.
  doctrine_reference: Anthropology / source-text fidelity
- issue: በጊዜ의 처리
  chosen_reading: 문장 종결을 인위적으로 닫지 않고 ‘그때’로 남겨, 절 경계상 dangling connector의 흔적을 반영했습니다.
  alternative_readings:
  - ‘when…’처럼 미완성으로 남길 수 있습니다.
  - ‘그 당시’로 매끈하게 닫을 수 있습니다.
  rationale: 공유된 영문 교정 내역이 በጊዜ의 접속적 기능과 절 경계 문제를 드러내므로, 과도하게 완결된 시간 부사로 평준화하지 않았습니다.
  doctrine_reference: Text-critical / source boundary sensitivity
