  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
  footnotes:
  - marker: a
    text: Or 'For your name was called Levi, and truly your name was called.'.
    reason: previous_rendering
  - marker: b
    text: Or 'And your table shall be full for all.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 사랑받는 이의 모든 후손을 축복하게 하소서. 당신의 어머니가 당신의 이름을 레위라고 불렀으니,[a] 참으로 그렇게 당신의 이름을 불렀습니다. 당신은 주님께 결합되고 야곱의 모든 아들의 동반자가 될 것입니다. 그의 식탁이 당신의 것이 되고, 당신과 당신의 아들들은 거기에서 먹을 것입니다. 당신의 식탁은 모든 세대를 위하여 가득할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리, “당신의 이름은 레위라고 불렸고, 참으로 당신의 이름은 불렸습니다.”
    reason: 영문 POB 감사 흔적에 제시된 이전 번역의 대안 독법을 반영합니다. 본문은 게에즈어의 ‘당신의 어머니’를 명시하는 읽기를 따릅니다.
  - marker: b
    text: 달리, “당신의 식탁은 모든 이를 위하여 가득할 것입니다.”
    reason: 영문 POB 감사 흔적의 ‘for all’ 대안 독법을 반영합니다. 본문은 완전한 절에 확인되는 ‘모든 세대’를 따릅니다.
