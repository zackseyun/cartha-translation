revisions:
- from: 그들이 사랑하는 모든 씨를 축복하게 하소서. 당신의 어머니가 당신의 이름을 레위라 불렀고, 참으로 그렇게 당신의 이름을 불렀습니다. 당신은 주님과 하나가 되고, 야곱의 모든 아들들의 동반자가 될 것입니다. 그의 식탁이 당신의 것이 되게 하시고, 당신과 당신의 아들들이 거기서 먹게 하소서. 그리고 당신의 식탁은 모든 세대를 위해 가득할 것입니다.[a][b]
  to: 그들이 사랑받는 이의 모든 후손을 축복하게 하소서. 당신의 어머니가 당신의 이름을 레위라고 불렀으니,[a] 참으로 그렇게 당신의 이름을 불렀습니다. 당신은 주님께 결합되고 야곱의 모든 아들의 동반자가 될 것입니다. 그의 식탁이 당신의 것이 되고, 당신과 당신의 아들들은 거기에서 먹을 것입니다. 당신의 식탁은 모든 세대를 위하여 가득할 것입니다.[b]
  rationale: 원문의 수식 관계와 ‘어머니’라는 주어를 보존하고, 주님과의 관계를 과도하게 신학화하지 않았습니다. 마지막 절은 제공된 절 조각의 절단 여부에 관한 최신 감사 기록을 따라 ‘모든 세대’를 유지했습니다. 각주도 의미상 대응하는 위치에 재배치했습니다.
