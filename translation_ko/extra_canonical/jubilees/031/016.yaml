  naturalness: 합쇼체의 예언·축복문으로 자연스럽게 다듬었습니다. ‘모든 아들들의 동반자’는 한국어에서 다소 어색하므로 집합적 소유를 자연스럽게 표현한 ‘야곱의 모든 아들의 동반자’로 조정했습니다.
