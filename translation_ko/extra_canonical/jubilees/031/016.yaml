  - 주(主)
  rationale: 레위가 여호와께 속하고 연합됨을 나타내는 문맥에서, 한국어 독자가 즉시 알아볼 수 있는 주님을 택하되 신적 대상임을 유지했습니다.
  doctrine_reference: 언약적 소속과 귀속 표현
- issue: 축복 요청문과 명령형 종결
  chosen_reading: '...하게 하소서 / ...될 것입니다'
  alternative_readings:
