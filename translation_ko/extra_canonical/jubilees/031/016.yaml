  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
  footnotes:
  - marker: a
    text: Or 'For your name was called Levi, and truly your name was called.'.
    reason: previous_rendering
  - marker: b
    text: Or 'And your table shall be full for all.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 사랑하는 모든 씨를 축복하게 하소서. 당신의 어머니가 당신의 이름을 레위라 불렀고, 참으로 그렇게 당신의 이름을 불렀습니다. 당신은 주님과 하나가 되고, 야곱의 모든 아들들의 동반자가 될 것입니다. 그의 식탁이 당신의 것이 되게 하시고, 당신과 당신의 아들들이 거기서 먹게 하소서. 그리고 당신의 식탁은 모든 세대를 위해 가득할 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎ ዘርአ ለፍቅር
  english_pob_choice: all the seed of the beloved
  chosen_korean: 사랑받는 이의 모든 씨
  alternatives_korean:
  - 사랑하는 모든 씨
  - 사랑받는 모든 자손
  lexicon: 씨
  rationale: 영문 POB의 'seed'를 직역해 후대/자손의 계열성을 살리고, ለፍቅር은 관계성상 '사랑받는 이'로 옮겨 원문의 수식 관계를 보존했습니다.
- source_word: እምከ ስመከ ሌዊን
  english_pob_choice: Your mother called your name Levi
  chosen_korean: 당신의 어머니가 당신의 이름을 레위라 불렀고
  alternatives_korean:
  - 당신의 어머니가 당신을 레위라 불렀고
  - 당신의 어머니가 당신의 이름을 레위라 지었고
  lexicon: 이름을 ...라 부르다
  rationale: 출생 시 이름 부여를 가리키는 동사를 한국어에서 가장 자연스럽게 드러내면서도, 본문이 '이름을 불렀다'는 표현을 유지하도록 했습니다.
- source_word: በአማን
  english_pob_choice: truly
  chosen_korean: 참으로
  alternatives_korean:
  - 정말로
  - 진실로
  lexicon: 참으로
  rationale: 독립적인 강조 부사로서 문장 전체를 강화하는 용법을 살려, 구어적이되 격식 있는 '참으로'를 택했습니다.
- source_word: ወሱታፌ ኵሎሙ ውሉደ ያዕቆብ
  english_pob_choice: be the companion of all the sons of Jacob
  chosen_korean: 야곱의 모든 아들들의 동반자가 될 것입니다
  alternatives_korean:
  - 야곱의 모든 아들들과 함께할 것입니다
  - 야곱의 모든 아들들과 동무가 될 것입니다
  lexicon: 동반자
  rationale: 단순 동행보다 연합·공동 소속의 의미를 살리기 위해 '동반자'를 사용했고, '모든 아들들'의 집합성을 유지했습니다.
- source_word: ወለኵሉ
  english_pob_choice: for all
  chosen_korean: 모든 세대를 위해
  alternatives_korean:
  - 모든 이들을 위해
  - 모든 사람들에게
  lexicon: 모든 세대
  rationale: 이 절의 최종 진술은 문맥상 후손 계승을 가리키므로, 영문 POB의 축약과 달리 원문의 세대적 함의를 드러내는 한국어로 복원했습니다.
theological_decisions:
- issue: 호칭인 '주님'의 처리
  chosen_reading: 주님
  alternative_readings:
