lexical_decisions:
- source_word: አማን፡ ውሉድየ፡ እሙንቱ።
  english_pob_choice: '"Truly, they are my children."'
  chosen_korean: “참으로, 그들은 내 자녀입니다.”
  alternatives_korean:
  - “진실로, 그들은 내 자녀입니다.”
  - “실로, 그들은 내 자녀입니다.”
  lexicon: አማን / ውሉድ
  rationale: 첫 절의 확언을 ‘참으로’로 옮겨 단정적 화법을 살리고, 1인칭 소유를 ‘내 자녀’로 자연스럽게 표현했습니다.
- source_word: ወቀርቡ፡ ኀቤሁ፡
  english_pob_choice: And they came near to him
  chosen_korean: 그리고 그들이 그에게 가까이 오자
  alternatives_korean:
  - 그리고 그들이 그에게 다가오자
  - 그들이 그에게 가까이 오고
  lexicon: קרב에 해당하는 접근 동사군
  rationale: 행동의 순서를 살리되, 한국어에서는 사건 진행을 부드럽게 잇는 ‘-자’ 구문이 원문의 장면 전환을 잘 드러냅니다.
- source_word: ወተመይጠ፡ ወሰዐሞሙ፡ ወሐቀፎሙ፡
  english_pob_choice: and he turned and kissed them and embraced them
  chosen_korean: 그가 돌아서서 그들에게 입맞추고 껴안았습니다
  alternatives_korean:
  - 그가 돌아서서 그들에게 입을 맞추고 포옹했습니다
  - 그가 몸을 돌려 그들에게 입맞추고 끌어안았습니다
  lexicon: 돌다 / 입맞추다 / 안다
  rationale: 세 동작의 연쇄를 그대로 보존하면서, ‘껴안다’로 신체적 친밀감을 자연스럽고 직접적으로 전달했습니다.
theological_decisions:
- issue: 부성적 자기선언의 뉘앙스
  chosen_reading: ‘그들은 내 자녀입니다’로 번역해 친밀한 관계 선언을 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘그들은 내 아들들입니다’
  - ‘그들은 내 자손입니다’
  rationale: 지리멸렬한 성중립화보다 원문의 관계적·감정적 강도를 보존하는 것이 본문의 핵심 의도에 더 가깝습니다.
  doctrine_reference: 서사 본문에서의 친족 호칭은 혈연·언약적 소속을 함께 드러내는 표현으로 처리
- issue: 키스와 포옹의 서술
  chosen_reading: ‘입맞추고 껴안았습니다’로 직접적 신체 접촉을 유지했습니다.
  alternative_readings:
  - ‘입을 맞추고 포옹했습니다’
  - ‘입맞추고 받아 안았습니다’
  rationale: 원문이 보여 주는 화해와 애정의 행동을 약화하지 않기 위해 관용적 완곡어보다 직설적 동사를 택했습니다.
  doctrine_reference: 서사적 감정 표현의 구체성 보존
