  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
  footnotes:
  - marker: a
    text: Or 'I am no longer able to ride on a beast and travel.'.
    reason: previous_rendering
  - marker: b
    text: Or 'when he came, he set him on a donkey.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 기도했으며, 그가 왔을 때 나귀에 그를 태우려 했습니다. 이삭이 아들 야곱에게 말했습니다. "나는 당신과 함께 갈 수 없습니다. 나는 늙었고, 여행을 견딜 수 없습니다. 내 아들아, 평안히 가십시오. 오늘 나는 백육십오 세입니다. 나는 더 이상 짐승을 타고 여행할 수 없습니다. 당신의 어머니를 짐승에 태우고 가게 하십시오."[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸለየ
  english_pob_choice: he had prayed
  chosen_korean: 기도했으며
  alternatives_korean:
  - 맹세했으며
  - 기도하였으며
  lexicon: Geez verbal sense in context
  rationale: 영문 POB의 수정본과 같이 ጸለየ는 ‘맹세하다’가 아니라 ‘기도하다’가 맞으므로, 서술 흐름을 살려 ‘기도했으며’로 옮겼습니다.
- source_word: ይጽዐኖ ዲበ አድግ
  english_pob_choice: when he came, he might set him on a donkey
  chosen_korean: 그가 왔을 때 나귀에 그를 태우려 했습니다
  alternatives_korean:
  - 그가 왔을 때 나귀에 그를 태우게 할 수 있었습니다
  - 그가 와서 나귀에 그를 태웠습니다
  lexicon: Geez imperfect/subjunctive + movement verb
  rationale: 행위의 단순 과거가 아니라 가능/의도적 뉘앙스를 반영해 ‘태우려 했습니다’로 처리했습니다.
- source_word: መጽአ
  english_pob_choice: came
  chosen_korean: 왔을 때
  alternatives_korean:
  - 오자
  - 도착했을 때
  lexicon: Geez narrative participial sense
  rationale: 문맥상 ‘오다’의 도착 상황을 자연스럽게 살려 ‘왔을 때’로 옮겼습니다.
- source_word: በፍኖት
  english_pob_choice: the journey
  chosen_korean: 여행
  alternatives_korean:
  - 길
  - 도정
  lexicon: Geez noun of travel/path
  rationale: 영문 POB가 ‘journey’로 정리한 의미를 따라, 한국어에서도 구체적 이동의 부담을 드러내는 ‘여행’으로 옮겼습니다.
- source_word: ጻዐና ለአምካ
  english_pob_choice: Set your mother on a beast and let her go
  chosen_korean: 당신의 어머니를 짐승에 태우고 가게 하십시오
  alternatives_korean:
  - 당신의 어머니를 짐승에 태워 보내십시오
  - 어머니를 짐승에 태우고 가십시오
  lexicon: Geez imperative + object marker
  rationale: 주어가 ‘네 어머니’임을 분명히 드러내야 하므로, POB의 수정본처럼 마지막 절을 어머니에 대한 명령으로 분리해 번역했습니다.
theological_decisions:
- issue: 이삭의 발화에 보이는 공손한 인사와 명령형의 혼합
  chosen_reading: 직접 인용 안에서도 상황상 아들에게는 친밀한 호칭을 쓰되, 전체 서술은 현대 공손체로 유지했습니다.
  alternative_readings:
  - 직역식 비공손체
  - 성경식 고어체
  rationale: 본문은 가족 대화이지만 한국어 출판문체는 합쇼체가 요구되므로, 인용문 내부의 호칭만 살리고 본문 서술은 현대 공손체로 맞췄습니다.
  doctrine_reference: 번역 문체 결정
