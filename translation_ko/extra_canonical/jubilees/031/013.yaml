  - severity: low
    issue: ‘축복하기 시작하며 그에게 말하였습니다’의 연결이 어색합니다.
    rationale: 진행 개시 뒤 이어지는 발화를 과거 서사로 자연스럽게 연결하려면 ‘시작하고’가 적절합니다.
  - severity: low
