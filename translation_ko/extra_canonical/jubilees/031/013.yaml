  yaml_path: translation/extra_canonical/jubilees/031/013.yaml
  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
  footnotes:
  - marker: a
    text: Or 'and Judah with his left hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 왼손은 유다 위에 있었고,[a] 그는 먼저 레위 쪽으로 몸을 돌려 그를 축복하기 시작하고 그에게 말하였습니다. “만물의 하나님, 모든 시대의 주님께서 당신에게 복을 주시기를 바랍니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “유다를 그의 왼손으로.”
    reason: 게에즈어 구문의 어순과 생략으로 인해 가능한 대안적 연결을 영어 POB 감사 이력에 따라 보존합니다.
lexical_decisions:
- source_word: እዴሁ፡ ወይሁዳን፡ *በፀጋማዊ፡ እዴሁ፡*
  english_pob_choice: and his left hand on Judah
  chosen_korean: 그의 왼손은 유다 위에 있었고
  alternatives_korean:
  - 그리고 유다와 그의 왼손
  - 그리고 유다를 그의 왼손으로
  lexicon: hand / left hand
  rationale: 지시 대상은 유다가 아니라 왼손이며, 영어 POB 수정본도 그 뜻을 명확히 합니다. 한국어에서는 ‘위에 있었고’로 접촉·위치를 자연스럽게 드러냈습니다.
- source_word: ወተመይጠ፡ ኀበ፡ ሌዊ፡
  english_pob_choice: and he turned toward Levi first
  chosen_korean: 그가 먼저 레위를 향하여 돌아서서
  alternatives_korean:
  - 그리고 레위를 향하여 먼저 돌아서서
  - 그가 레위 쪽으로 먼저 돌이켜
  lexicon: turn toward / first
  rationale: 우선순위는 ‘먼저’로 살리고, 동작은 ‘향하여 돌아서서’로 옮겨 Ge'ez의 방향 전환을 보존했습니다.
- source_word: ይባርኮ፡
  english_pob_choice: began to bless him
  chosen_korean: 그를 축복하기 시작하며
  alternatives_korean:
  - 그를 축복하기 시작하고
  - 그를 축복하려 하고
  lexicon: bless
  rationale: 동사의 진행 개시를 드러내기 위해 ‘-하기 시작하며’를 택했고, 단순 과거보다 서술 흐름이 더 가깝습니다.
- source_word: አምላከ፡ ኵሉ፡ ውእቱ፡ እግዚአ፡ ኵሉ፡ ዓለማት፡
  english_pob_choice: the God of all, the Lord of all the ages
  chosen_korean: 만물의 하나님, 모든 시대의 주님
  alternatives_korean:
  - 모든 것의 하나님, 모든 시대의 주님
  - 만유의 하나님, 모든 시대들의 주님
  lexicon: God of all / Lord of all the ages
  rationale: ‘ኵሉ’의 총괄성을 살려 ‘만물의 하나님’으로, ‘all the ages’는 시간 전체를 포괄하는 표현으로 ‘모든 시대의 주님’이라 옮겼습니다.
- source_word: ኪያከ፡
  english_pob_choice: bless you
  chosen_korean: 당신을 복 주시기를 빕니다
  alternatives_korean:
  - 당신에게 복을 주시기를 빕니다
  - 당신을 축복하시기를 빕니다
  lexicon: bless you
  rationale: 직접 축원 형식이므로 ‘복 주시기를 빕니다’가 가장 자연스럽고, 존대형 2인칭을 유지했습니다.
theological_decisions:
- issue: 축복문 내부의 호칭과 기원 형식
  chosen_reading: 인물의 축복 발화로서 간접청원형 존대 표현을 유지했습니다.
  alternative_readings:
  - ‘복을 주십니다’의 선언형
  - ‘복 주옵소서’의 기원형
  rationale: 본문은 제사적 선언이 아니라 야곱의 축복 발화이므로, 인용문 안에서 ‘주시기를 빕니다’로 번역해 축원성과 서술성을 함께 보존했습니다.
  doctrine_reference: 본문 서사/화행 이해
