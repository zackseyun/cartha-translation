  source_fidelity: 핵심 의미는 대체로 충실합니다. 유다에게 왼손을 둔 뒤 레위 쪽으로 먼저 돌아 그를 축복하고 말하는 순서, 그리고 ‘만물의 하나님, 모든 시대의 주님’이라는 호칭이 보존되었습니다. 다만 원문의 대안적 어순을 표시하는 [a]에 해당하는 각주가 제공되지 않아 보완해야 합니다.
  naturalness: ‘그를 축복하기 시작하며 그에게 말하였습니다’는 주절 과거와 연결 어미의 결합이 다소 어색합니다. ‘축복하기 시작하고 그에게 말하였습니다’로 고치면 현대 한국어 서사에서 순서가 자연스럽습니다. 또한 인용문의 ‘당신을 복 주시기를 빕니다’보다 ‘당신에게 복을 주시기를 바랍니다’가 현대 합쇼체의 축원문으로 더 자연스럽습니다.
  terminology: ‘만물의 하나님, 모든 시대의 주님’은 አምላከ ኵሉ 및 እግዚአ ኵሉ ዓለማት의 포괄성과 호칭 구조를 적절히 전달합니다. ‘복을 주시다’도 축복 동사의 일반적인 한국어 성경 번역 관습에 부합합니다.
