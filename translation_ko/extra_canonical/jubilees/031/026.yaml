  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
  footnotes:
  - marker: '26'
    text: Although the Ge'ez uses prayer-related wording, the immediate context of Bethel, altar, sacrifice, and Isaac's warning not to delay indicates a vow in view here.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 아침에 야곱은 자기 아버지 이삭에게 그가 주님께 드렸던 기도와, 그가 본 환상과, 그가 어떻게 제단을 세웠는지, 그리고 주님 앞에 드릴 제사를 위해 모든 것이 준비되었는지를 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሎተ ዘጸለየ
  english_pob_choice: the prayer that he had prayed
  chosen_korean: 그가 주님께 드렸던 기도
  alternatives_korean:
  - 그가 주님께 드렸던 서원
  - 그가 주님께 드린 기도
  lexicon: 기도
  rationale: 게으즈 본문은 기도 관련 어휘를 쓰며, 최신 영어 POB도 ‘prayer’로 수정해 반영했으므로 한국어도 ‘기도’로 두었습니다. ‘드렸던’은 완료된 행위를 자연스럽게 나타냅니다.
- source_word: ወሬአየ ዘርእየ
  english_pob_choice: the vision that he had seen
  chosen_korean: 그가 본 환상
  alternatives_korean:
  - 그가 본 계시
  - 그가 보았던 환상
  lexicon: 환상
  rationale: 본문은 야곱이 ‘본 것’을 이어서 말하므로, 과도하게 해석하지 않고 표준적인 ‘환상’으로 옮겼습니다.
- source_word: ኀነጸ፡ ምሥዋዐ
  english_pob_choice: he had built an altar
  chosen_korean: 그가 어떻게 제단을 세웠는지
  alternatives_korean:
  - 그가 제단을 쌓았는지
  - 그가 제단을 만들었는지
  lexicon: 제단
  rationale: ‘세우다’는 제단에 대해 한국어에서 자연스럽고 성경적이며, 행위의 완료성을 살립니다. ‘어떻게’는 다음 절의 내용 정리를 드러내는 연결 표현입니다.
- source_word: ቅድመ እግዚአብሔር
  english_pob_choice: before the Lord
  chosen_korean: 주님 앞에
  alternatives_korean:
  - 주님 앞에서
  - 야훼 앞에
  lexicon: 주님
  rationale: 직접적인 신적 임재 앞을 뜻하는 전치사구로 자연스럽게 ‘주님 앞에’로 옮겼습니다. 본문 자체는 여호와 대역이지만, 주석 없이 읽히는 본문 텍스트에서는 POB 관례에 따라 ‘주님’을 사용했습니다.
theological_decisions:
- issue: 기록된 내용의 성격 — 기도인가 서원인가
  chosen_reading: 본문 표면은 ‘그가 드렸던 기도’로 유지하되, 내러티브는 야곱이 이삭에게 보고한 내용이라는 흐름을 살렸습니다.
  alternative_readings:
  - ‘그가 했던 서원’으로 번역해 서원 성격을 더 강하게 드러냄
  - ‘기도’로 직역해 기도 행위 자체만 전면화
  rationale: 게으즈 어휘와 영어 POB의 최종 판정이 ‘기도’이므로 본문은 그 판정을 따르되, 문맥상 서원 해석 여지도 삭제하지 않도록 과도한 신학적 확정을 피했습니다.
  doctrine_reference: 문맥 주해(베델 서사, 창세기 28장 병행)
