revisions:
- from: 그리고 아침에 야곱은 자기 아버지 이삭에게 그가 주님께 드렸던 기도와, 그가 본 환상과, 그가 어떻게 제단을 세웠는지, 그리고 주님 앞에 드릴 제사를 위해 모든 것이 준비되었는지를 말했습니다.[a]
  to: 그리고 아침에 야곱은 자기 아버지 이삭에게 자신이 주님께 드린 기도[a]와 자신이 본 환상, 자신이 어떻게 제단을 세웠는지, 또 주님 앞에 드릴 제사를 위하여 모든 것이 준비되어 있었다는 것을 말했습니다.
  rationale: 원문의 마지막 절이 사실을 보고하는 내용임을 살리기 위해 간접의문형 ‘준비되었는지’를 명사절 ‘준비되어 있었다는 것’으로 고쳤습니다. ‘기도’는 게으즈어 어휘를 따라 유지했으며, 서원이라는 문맥적 대안은 각주로 보존했습니다. 각주 표지는 해당 어휘 바로 뒤로 옮겼습니다.
