- from: 그들이 당신을 닮았습니다.” 그가 그에게 그들이 באמת 그의 아들들이라고 말했습니다. 그리고 그는 말했습니다. “이제 보니 그들이 באמת 당신의 아들들이군요.”[a]
  to: “그들이 당신을 닮았기 때문입니다.” 그는 그에게 그들이 참으로 자기 아들들이라고 말했습니다. 그리고 그는 말했습니다. “참으로 보니, 그들은 당신의 아들들이군요.”
  rationale: 한국어가 아닌 문자 혼입을 ‘참으로’로 바로잡고, 원문의 ‘아들들’을 유지했습니다. ‘자기 아들들’은 원문의 3인칭 소유를 한국어에서 자연스럽게 나타내면서 다음 인용문의 ‘당신의 아들들’과의 대조를 보존합니다. 원문이 지지하지 않는 ‘손자들’ 각주와 앵커는 제거했습니다.
