translation:
  language: ko
  text: 그들이 당신을 닮았습니다.” 그가 그에게 그들이 באמת 그의 아들들이라고 말했습니다. 그리고 그는 말했습니다. “이제 보니 그들이 באמת 당신의 아들들이군요.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ፡ ይመስሉከ።
  english_pob_choice: For they resemble you.
  chosen_korean: “그들이 당신을 닮았습니다.”
  alternatives_korean:
  - “그들은 당신과 닮았습니다.”
  - “그들은 당신을 닮아 보입니다.”
  lexicon: see/ resemble
  rationale: 원문의 비교 진술을 자연스럽게 옮기되, 단순한 외모가 아니라 혈연적 유사성을 암시하는 문맥을 살려 ‘닮았습니다’로 렌더링했습니다.
- source_word: ወነገሮ፡ ከመ፡ በአማን፡ ውሉዱ፡ እሙንቱ፡
  english_pob_choice: And he told him that they were indeed his sons.
  chosen_korean: 그가 그에게 그들이 באמת 그의 아들들이라고 말했습니다.
  alternatives_korean:
  - 그리고 그가 그에게 그들이 참으로 그의 아들들이라고 말했습니다.
  - 그리고 그가 그에게 그것들이 참으로 그의 아들들이라고 말했습니다.
  lexicon: tell / sons
  rationale: 게에즈의 ውሉዱ는 ‘그의 아들들’을 뜻하므로, 본문 논리와 어긋나는 ‘손자들’이 아니라 ‘아들들’로 옮겼습니다. 영어 POB의 최신 정정도 이를 뒷받침합니다.
- source_word: ወአማን፡ ርእክ፡ ከመ፡
  english_pob_choice: Now I see that they are truly your sons.
  chosen_korean: 그리고 그는 말했습니다. “이제 보니 그들이 באמת 당신의 아들들이군요.”
  alternatives_korean:
  - 그리고 그는 말했습니다. “이제 보니 그들이 정말 당신의 아들들이군요.”
  - 그리고 그는 말했습니다. “이제야 그들이 참으로 당신의 아들들이라는 것을 알겠습니다.”
  lexicon: see / truly
  rationale: ‘이제 보니’로 시각적 확인의 뉘앙스를 살리고, ‘참으로’는 አማን의 사실 확인을 반영합니다. 반복되는 ‘아들들’을 유지해 앞절과의 논리 연결을 분명히 했습니다.
theological_decisions:
- issue: 족속 확인 대화의 의미
  chosen_reading: 이 절은 외형적 유사성을 근거로 혈연적 소속을 확인하는 장면으로 읽었습니다.
  alternative_readings:
  - 단순히 외모가 비슷하다는 관찰
  - 비유적·상징적 자녀 언급
  rationale: 게에즈 본문과 영어 POB 모두 ‘닮음’에서 ‘그의 아들들’이라는 확인으로 나아가므로, 문맥상 혈연 확인으로 번역하는 것이 가장 직접적입니다.
  doctrine_reference: 문맥-기반 서사 이해
