  source_fidelity: 첫 구절의 እምድር은 ‘땅에서/땅으로부터’라는 출처·이탈 표지이며, 제시된 영어 감사본도 단지 ‘from the earth’로 옮깁니다. 초안의 ‘나오리니’는 원문과 영어본에 없는 ‘나오다’를 보태며, 특히 문맥상 땅에서 제거됨을 뜻할 가능성과 반대되는 뜻이 될 수 있습니다. 본문이 절 중간에서 시작하므로 첫 구절의 통사적 미완결성은 유지하는 것이 안전합니다. 나머지 동작 연쇄와 큰 기쁨의 표현은 원문 및 영어본에 충실합니다.
  naturalness: ‘나오리니’는 현대 표준어 합쇼체에도 다소 고풍스럽고, 무엇보다 원문에 없는 동작입니다. 절 경계 때문에 문장이 이어지는 형태는 불가피하므로, 한국어에서도 쉼표와 연결형으로 다음 문맥을 기다리게 했습니다. 마지막 እስመ(‘왜냐하면/…때문에’)는 다음 절로 이어지는 미완결 접속으로 보존했습니다.
  terminology: ‘저주받은 자들이 될 것입니다’는 ርጉማነ의 복수 ‘저주받은 자들’이라는 판정적 표현을 적절히 반영합니다. ‘입맞추고’, ‘껴안았으며’, ‘크게 기뻐했으니’도 현대적인 서사 문체와 의미에 맞습니다.
