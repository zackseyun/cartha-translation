  text: and let me see him before I die.” And Jacob went to his father Isaac and to his mother Rebekah, to the house of his father Abraham. And he took with him two of his sons, Levi and Judah.
translation:
  language: ko
  text: 그리고 “내가 죽기 전에 그를 보게 해 주십시오”라고 하였습니다. 야곱은 아버지 이삭과 어머니 리브가가 있는 아버지 아브라함의 집으로 갔습니다. 그리고 자기 아들들 가운데 둘, 곧 레위와 유다를 데리고 갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእርአዮ፡ ዘእንበለ፡ እሙት።
  english_pob_choice: and let me see him before I die.
  chosen_korean: 「내가 죽기 전에 그를 보게 해 주십시오」
  alternatives_korean:
  - 「내가 죽기 전에 그를 보게 하소서」
  - 「내가 죽기 전에 그를 보게 해 주십시오」
  lexicon: 재구성된 서술+간접화법
  rationale: Geez 문장은 ‘죽기 전에 그를 보게 하다’라는 청원의 뜻을 담고 있어, 자연스러운 현대 한국어로 간접화법을 살리면서도 원문의 요청성을 유지했습니다.
- source_word: ወሖረ፡ ያዕቆብ፡ ... ውስተ፡ ቤቱ፡ ለአቡሁ፡ አብርሃም።
  english_pob_choice: And Jacob went ... to the house of his father Abraham.
  chosen_korean: 야곱은 ... 아버지 아브라함의 집으로 갔습니다.
  alternatives_korean:
  - 야곱은 ... 아버지 아브라함의 집에 갔습니다.
  - 야곱은 ... 조상 아브라함의 집으로 갔습니다.
  lexicon: 집/가문 표현
  rationale: 원문은 ‘아브라함의 집’을 말하므로 단순한 건물보다 가문/거처를 아우르는 표현이지만, 본문 수준에서는 직역에 가까운 ‘집’이 가장 안전합니다.
- source_word: ወኀበ፡ እሙ፡ ርብቃ፡
  english_pob_choice: and to his mother Rebekah
  chosen_korean: 어머니 리브가에게
  alternatives_korean:
  - 어머니 리브가께
  - 어머니 리브가에게
  lexicon: 전치사 ኀበ의 방향/도달
  rationale: ‘~에게’는 도착/대상 방향을 무난하게 반영하며, 서술 문맥에서 한국어 합쇼체와도 자연스럽게 맞습니다.
- source_word: ወክልኤተ፡ እምውሉዱ፡ ነሥአ፡ ምስሌሁ፡ ሌዊሃ፡ ወይሁዳሃ፡
  english_pob_choice: And he took with him two of his sons, Levi and Judah.
  chosen_korean: 그리고 자기 아들들 가운데 둘, 곧 레위와 유다를 데리고 갔습니다.
  alternatives_korean:
  - 그리고 자기 아들들 가운데 둘을 데리고 갔습니다. 레위와 유다입니다.
  - 그리고 두 아들 레위와 유다를 데리고 갔습니다.
  lexicon: ‘두 명 중 두 아들’ 구조
  rationale: 원문은 ‘그의 자녀들 가운데 두 사람’을 명시한 뒤 이름을 제시하므로, ‘아들들 가운데 둘, 곧…’로 구조를 드러냈습니다.
theological_decisions:
- issue: 이 본문은 족보적·서사적 진술로서 신학적 용어 선택보다 사건 전달이 핵심입니다.
  chosen_reading: 직접적인 신학 용어를 덧붙이지 않고, 원문이 말하는 이동과 동행을 서술적으로 옮겼습니다.
  alternative_readings:
  - 의미를 확장해 상징적 해석을 덧붙이는 방식
  - 문학적 장엄체로 재서술하는 방식
  rationale: 외경/희년서 본문 특성상 과도한 신학화는 원문의 서사성을 흐릴 수 있으므로, 문맥이 요구하는 범위 안에서만 옮겼습니다.
  doctrine_reference: source-faithfulness
- issue: 원문의 간청 표현은 직접 화자의 어조를 보존해야 합니다.
  chosen_reading: 청원형을 유지하되 현대 한국어에서는 ‘해 주십시오’로 옮겨 공손한 요청의 힘을 살렸습니다.
  alternative_readings:
  - ‘보게 하소서’처럼 기도문식 어조로 번역
  - 평서형으로 완화해 서술
  rationale: 문맥상 인물의 간절한 요청이므로, 한국어 합쇼체 안에서 요청의 긴장감을 유지하는 것이 적절합니다.
  doctrine_reference: speech-act fidelity
