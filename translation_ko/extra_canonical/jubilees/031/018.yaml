- from: “당신을 저주하는 모든 사람은 저주를 받으십시오.” 그리고 유다에게는 이렇게 말했습니다. “주께서 당신에게 힘과 능력을 주셔서, 당신이 당신을 미워하는 모든 사람을 짓밟게 하십시오. 당신과 당신의 아들 하나가 야곱의 아들들 위에 다스리는 통치자가 되십시오. 당신의 이름과 당신의 아들들의 이름이 온 땅과 그 지역들을 두루 다니게 하십시오. 그러면 민족들이 당신의 얼굴 앞에서 두려워할 것입니다.”[a][b][c]
  to: “당신을 저주하는 모든 백성은 저주를 받기를 바랍니다.” 그리고 유다에게 이렇게 말했습니다. “주께서 당신에게 힘과 능력을 주셔서, 당신을 미워하는 모든 이를 짓밟게 하시기를 바랍니다. 당신과 당신의 아들들 가운데 한 사람이 야곱의 아들들을 다스리는 통치자들이 되십시오. 당신의 이름과 당신의 아들들의 이름이 온 땅과 그 모든 지역을 두루 다니기를 바랍니다. 그러면 민족들이 당신 앞에서 두려워할 것입니다.”
  rationale: 집합 명사의 의미와 ‘아들들 가운데 한 사람’이라는 구문을 바로잡고, 축복 선언 전체를 자연스러운 한국어 기원형으로 통일했습니다. 원문의 ‘얼굴 앞에서’는 한국어 관용에 맞게 ‘당신 앞에서’로 옮겼으며, 미정의 각주 표지는 제거했습니다.
