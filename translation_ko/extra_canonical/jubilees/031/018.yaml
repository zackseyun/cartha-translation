  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: ko
  text: “당신을 저주하는 모든 사람은 저주를 받으십시오.” 그리고 유다에게는 이렇게 말했습니다. “주께서 당신에게 힘과 능력을 주셔서, 당신이 당신을 미워하는 모든 사람을 짓밟게 하십시오. 당신과 당신의 아들 하나가 야곱의 아들들 위에 다스리는 통치자가 되십시오. 당신의 이름과 당신의 아들들의 이름이 온 땅과 그 지역들을 두루 다니게 하십시오. 그러면 민족들이 당신의 얼굴 앞에서 두려워할 것입니다.”[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ
  english_pob_choice: every people
  chosen_korean: 모든 사람
  alternatives_korean:
  - 모든 민족
  - 모든 백성
  lexicon: ሕዝብ
  rationale: 본문은 저주하는 대상을 집단 일반으로 말하며, 영어 POB의 every people에 맞춰 한국어에서는 ‘사람’보다 집단성을 더 분명히 드러내는 ‘모든 사람’이 아니라면 ‘모든 민족/백성’도 가능하지만, 앞선 저주-응답 대구를 자연스럽게 살리기 위해 짧고 직접적으로 옮겼습니다.
- source_word: ኀይለ፡ ወጽንዐ፡
  english_pob_choice: strength and power
  chosen_korean: 힘과 능력
  alternatives_korean:
  - 힘과 권능
  - 강함과 힘
  lexicon: ኀይል / ጽንዕ
  rationale: 두 명사를 병렬로 유지해 원문의 중첩된 역량 부여를 살렸고, 한국어에서는 ‘힘과 능력’이 가장 자연스럽고 의미 분화도 무리 없이 전달합니다.
- source_word: ትኪዶሙ
  english_pob_choice: you may tread down
  chosen_korean: 당신이 … 짓밟게 하십시오
  alternatives_korean:
  - 당신이 … 밟아 누르게 하십시오
  - 당신이 … 짓이기게 하십시오
  lexicon: ከመ + 동사
  rationale: 영어의 so that you may를 반영해 목적절로 처리했고, 적대자에 대한 우월적 제압 이미지를 과도하게 완화하지 않도록 ‘짓밟다’를 택했습니다.
- source_word: ዘየሐውር፡ ወዘያንሶሱ፡
  english_pob_choice: go about and travel through
  chosen_korean: 두루 다니게 하십시오
  alternatives_korean:
  - 오가며 퍼지게 하십시오
  - 두루 퍼져 나가게 하십시오
  lexicon: 동사쌍
  rationale: 두 동사의 반복·병렬을 한국어에서 한 번의 관용 표현으로 압축하되, 명칭이 지리와 사람들 사이를 널리 확산한다는 의미를 살리기 위해 ‘두루 다니게 하십시오’로 옮겼습니다.
- source_word: አሕዛብ
  english_pob_choice: nations
  chosen_korean: 민족들
  alternatives_korean:
  - 나라들
  - 이방 민족들
  lexicon: አሕዛብ
  rationale: 마지막에 주어지는 두려움의 주체를 지정하는 용법이므로, 일반적인 정치 단위인 ‘나라들’보다 집단 정체성을 드러내는 ‘민족들’이 더 가깝습니다.
theological_decisions:
- issue: 유다에게 주어지는 통치 언어
  chosen_reading: “당신과 당신의 아들 하나가 야곱의 아들들 위에 다스리는 통치자가 되십시오”로 옮겨, 왕권 약속의 명령형/축원형 어조를 보존했습니다.
  alternative_readings:
  - “당신과 당신의 아들 중 하나가… 통치할 것입니다” 같은 예언적 진술
  - “통치자가 되십시오”를 약화한 서술형
  rationale: Geez 원문은 축복 선언 속 명령·기원형 표현을 사용하므로, 단순 예언 진술로 평탄화하지 않고 축복적 선언의 힘을 살렸습니다.
  doctrine_reference: 서사적 축복 문맥에서의 performative blessing
- issue: ‘얼굴 앞에서’의 직역 유지
  chosen_reading: ‘당신의 얼굴 앞에서’로 직역해 하나님의 임재/대면 앞의 경외를 유지했습니다.
  alternative_readings:
  - ‘당신 앞에서’
  - ‘당신을 두려워할 것입니다’
  rationale: 원문의 ‘face’는 단순 시선보다 대면·임재의 뉘앙스를 지니므로, 관용적으로 완전히 평탄화하지 않고 구체적 이미지를 남겼습니다.
  doctrine_reference: 성서적 대면/임재 표현
