  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
  footnotes:
  - marker: a
    text: Or 'He embraced Jacob his son'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 야곱, 곧 자기 아들의 목을 끌어안고 그의 목에 대고 울었습니다. 이삭의 눈에서 흐릿함이 사라지자, 그는 야곱의 두 아들 레위와 유다를 보고 말했습니다. 「이들이 네 아들이냐, 내 아들아?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그는 자기 아들 야곱을 끌어안고’라고 할 수 있습니다.
    reason: 원문의 첫 구절은 ‘야곱, 그의 아들의 목’을 직역할 수 있으며, 이를 ‘자기 아들 야곱을 끌어안고’로 이해하는 번역 가능성도 있습니다. 본문은 원문의 ‘목’ 표현을 보존합니다.
