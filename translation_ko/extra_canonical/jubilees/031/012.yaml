  source_fidelity: 원문과 영어 감사 본문은 세 절 단편을 제시합니다. 현 초안은 첫 단편을 목적격 구문으로만 남겨 문장으로 성립하지 않으며, 마지막 동사도 ‘손으로 붙잡다/잡다’보다 의미가 강한 ‘데려가다’로 옮겼습니다. ‘예언의 영이 그의 입에 내려왔다’는 원문의 하강 및 입 안으로의 방향을 대체로 충실히 보존합니다.
  naturalness: ‘그 두 사람을 함께.’는 현대 한국어에서 불완전한 파편이며, 합쇼체 문맥에도 맞지 않습니다. 원문의 문맥 의존적 단편성은 보존하되, 한국어에서는 ‘그 두 사람을 함께 데리고’로 이어지는 미완결 연결구문으로 처리하는 편이 자연스럽습니다. 마지막은 ‘그는 오른손으로 레위의 손을 잡았습니다’가 자연스럽습니다.
  terminology: ‘예언의 영’은 적절하며 ‘성령’으로 교리적으로 일반화하지 않은 점이 좋습니다. 레위는 통용 고유명사 표기입니다.
