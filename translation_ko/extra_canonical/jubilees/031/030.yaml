lexical_decisions:
- source_word: ወይሥመር
  english_pob_choice: may he prosper
  chosen_korean: 형통하게 하시기를 바랍니다
  alternatives_korean:
  - 번성하게 하시기를 바랍니다
  - 잘되게 하시기를 바랍니다
  lexicon: 사전 항목 번호를 새로 만들지 않음
  rationale: 게에즈의 축복적 기원문을 자연스러운 합쇼체로 옮기되, 단순한 성공보다 삶 전체의 ‘형통’이라는 포괄적 의미를 살렸습니다.
- source_word: ዘገብረ፡ ኵሎ፡ ለዘጸለይከ፡ ጸሎተ
  english_pob_choice: all that you have prayed in prayer
  chosen_korean: 기도 가운데 너의 기도한 모든 일
  alternatives_korean:
  - 기도한 모든 것
  - 기도로 구한 모든 일
  lexicon: 사전 항목 번호를 새로 만들지 않음
  rationale: 소스는 ‘기도하다’ 동사를 반복해 강하게 강조하므로, 이를 ‘기도 가운데 … 기도한’으로 반영해 단순한 ‘구함’이나 ‘서원’으로 약화시키지 않았습니다.
- source_word: ሪርብቃ፡ ... ምስለ፡ ያዕቆብ፡ ወልዳ
  english_pob_choice: Go with Jacob your son
  chosen_korean: 네 아들 야곱과 함께 가라
  alternatives_korean:
  - 야곱과 함께 가라
  - 네 아들과 함께 가라
  lexicon: 사전 항목 번호를 새로 만들지 않음
  rationale: 수정된 본문이 분명히 ‘너의 아들’을 포함하므로, 인칭 소유를 살려 리브가가 누구와 가는지 분명하게 했습니다.
- source_word: ወሖረት፡ ርብቃ
  english_pob_choice: And Rebekah went
  chosen_korean: 리브가는 ... 갔고
  alternatives_korean:
  - 그리고 리브가는 갔습니다
  - 리브가가 갔고
  lexicon: 사전 항목 번호를 새로 만들지 않음
  rationale: 원문이 주어 ‘리브가’를 분명히 다시 제시하므로, 대명사로 바꾸지 않고 이름을 유지했습니다.
theological_decisions:
- issue: 기도 응답의 뉘앙스
  chosen_reading: 축복문의 핵심을 ‘형통하게 하시기를 바랍니다’로 옮겨, 기도한 모든 일을 하나님께서 이루시도록 구하는 뉘앙스를 살렸습니다.
  alternative_readings:
  - 그가 모든 일을 이루게 하시기를 바랍니다
  - 그가 네 모든 기도를 들어주시기를 바랍니다
  rationale: 본문은 단순한 소원 성취보다, 하나님이 기도에 응답하여 행위를 번성하게 하시는 축복을 말합니다. 그래서 ‘들어주다’로 좁히지 않고 ‘형통하게 하다’로 옮겼습니다.
  doctrine_reference: 하나님의 섭리와 기도 응답에 대한 서술적 표현
- issue: 문장 결말의 불완전성
  chosen_reading: 마지막 절은 원문과 동일하게 끊어진 상태를 살려 ‘…에 이르렀습니다’로 마무리했습니다.
  alternative_readings:
  - 완결형으로 보충하여 번역
  - 문장 자체를 삭제
  rationale: 소스가 마지막에 절단되어 있으므로, 한국어도 이를 가리켜 본문의 불완전함을 보존했습니다.
  doctrine_reference: 본문 보존 원칙
