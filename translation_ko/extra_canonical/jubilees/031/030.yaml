  text: 그가 기도 가운데 너의 기도한 모든 일을 형통하게 하시기를 바랍니다.” 그리고 그가 리브가에게 말하기를 “네 아들 야곱과 함께 가라” 하였습니다. 리브가는 자기 아들 야곱과 함께 갔고, 드보라가 그와 함께 갔으며, 그들은 …에 이르렀습니다.[a]
