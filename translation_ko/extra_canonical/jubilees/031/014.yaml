  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
  footnotes:
  - marker: a
    text: Or 'greatness of heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 네 자녀들도 모든 시대에 걸쳐 그러할 것입니다. 주께서 너와 네 씨에게 영광을 위한 큰 통찰력을 주시기를 바랍니다. 또 그분께서 너와 네 씨를 모든 육체 가운데에서 자기에게 가까이 이끄셔서, 임재의 천사들과 거룩한 이들처럼 그의 성소에서 섬기게 하시기를 바랍니다. 그들이 그러한 것처럼, 네 자녀들의 씨도 영광과 위대함을 얻게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마음의 위대함’.
    reason: 게에즈 ዐባየ፡ ልባዌ፡은 문자적으로는 ‘마음의 위대함’으로도 이해될 수 있으나, 문맥과 어휘상 본문에서는 ‘큰 통찰력’으로 옮겼습니다.
lexical_decisions:
- source_word: ዐባየ፡ ልባዌ፡
  english_pob_choice: great understanding
  chosen_korean: 큰 깨달음
  alternatives_korean:
  - 큰 이해
  - 큰 지혜
  - 마음의 위대함
  lexicon: Ge'ez ləbbawē
  rationale: 개정된 영어 POB가 ‘heart’보다 ‘understanding’을 취한 점을 반영해, 한국어도 문자적 ‘마음’보다 의미를 드러내는 ‘깨달음’을 선택했습니다.
- source_word: እምኵሉ፡ ዘሥጋ፡
  english_pob_choice: from among all flesh
  chosen_korean: 모든 육체 가운데에서
  alternatives_korean:
  - 모든 육체로부터
  - 모든 육체 중에서
  lexicon: Geez prepositional phrase
  rationale: 단순한 출처 표기보다 ‘~가운데에서’가 선택·구별의 뉘앙스를 더 분명히 살려 주므로, 성소로 부르심을 받은 맥락에 맞게 옮겼습니다.
- source_word: ይትአለክ፡ ውስተ፡ መቅደሱ፡
  english_pob_choice: to minister in his sanctuary
  chosen_korean: 그의 성소에서 섬기게 하시기를 바랍니다
  alternatives_korean:
  - 그의 성소에서 봉사하게 하시기를 바랍니다
  - 그의 성소에서 시중들게 하시기를 바랍니다
  lexicon: Geez cultic service terminology
  rationale: 성소에서의 공적 봉사를 드러내기 위해 ‘섬기다’를 택했고, ‘봉사하다’보다 예배·제의적 맥락이 자연스럽게 전달되도록 했습니다.
- source_word: መላእክተ፡ ገጽ፡
  english_pob_choice: the angels of the presence
  chosen_korean: 현현의 천사들
  alternatives_korean:
  - 임재의 천사들
  - 면전의 천사들
  lexicon: traditional rendering of the phrase
  rationale: 문맥상 고유한 천상 존재 집단을 가리키는 표현이므로, 직역적인 ‘임재’보다 POB의 용례에 맞는 ‘현현의 천사들’을 유지했습니다.
theological_decisions:
- issue: 성소 봉사와 천상 존재의 병치
  chosen_reading: 씨가 성소에서 섬기는 모습이 ‘현현의 천사들’과 ‘거룩한 이들’의 모범에 맞추어 설명됩니다.
  alternative_readings:
  - 단순한 비유적 비교로 약화하는 읽기
  - 제사장적 소명으로만 한정하는 읽기
  rationale: 본문은 지상 공동체의 봉사를 천상 질서와 직접 연결하므로, 비교의 강도를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 성전/성소 모티프와 천상 예배의 연속성
- issue: ‘영광을 위한’과 ‘위대함’을 분리해 살림
  chosen_reading: ‘영광을 위한 큰 깨달음’과 끝부분의 ‘영광과 위대함’을 구분해 번역했습니다.
  alternative_readings:
  - 둘 다 추상적으로 평탄화하는 읽기
  - ‘영광’만 반복해 단순화하는 읽기
  rationale: 게에즈 본문과 영어 POB가 서로 다른 두 개의 영광 관련 표현을 구분하므로, 한국어에서도 의미적 중복을 피하면서 각각의 강조를 유지했습니다.
  doctrine_reference: 어휘 반복의 의미 구분
