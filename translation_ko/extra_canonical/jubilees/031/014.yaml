revisions:
- from: 그리고 너의 자녀들은 모든 시대를 통하여 있게 될 것입니다. 주께서 너와 네 씨에게 영광을 위한 큰 깨달음을 주시기를 바랍니다. 또한 그분이 너와 네 씨를 모든 육체 가운데에서 자기에게 가까이 이끄시어, 그들이 현현의 천사들과 거룩한 이들처럼 그의 성소에서 섬기게 하시기를 바랍니다. 그들이 그러한 것처럼, 너의 자녀들의 씨도 영광과 위대함을 위하여 그러할 것입니다.[a]
  to: 그리고 네 자녀들도 모든 시대에 걸쳐 그러할 것입니다. 주께서 너와 네 씨에게 영광을 위한 큰 통찰력을 주시기를 바랍니다. 또 그분께서 너와 네 씨를 모든 육체 가운데에서 자기에게 가까이 이끄셔서, 임재의 천사들과 거룩한 이들처럼 그의 성소에서 섬기게 하시기를 바랍니다. 그들이 그러한 것처럼, 네 자녀들의 씨도 영광과 위대함을 얻게 될 것입니다.[a]
  rationale: ‘현현의 천사들’을 게에즈 어구의 뜻에 맞는 ‘임재의 천사들’로 바로잡았습니다. ləbbawē의 지적·분별적 의미를 ‘큰 통찰력’으로 명료하게 했으며, 마지막 절의 영광과 위대함을 목적이 아니라 미래의 결과로 자연스럽게 표현했습니다. 비교 구문의 모호성은 본문이 허용하는 범위 안에서 유지했습니다.
  reviewer_model: gpt-5.6-terra
