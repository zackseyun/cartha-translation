  yaml_path: translation/extra_canonical/jubilees/002.yaml
  text: '1[2]. And the angel of the presence said to Moses by the word of the LORD, saying, "Write all the account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all his works.

    2. For on the first day he created the heavens that are above and the earth and the waters and all the spirits that minister before him: the angels of the presence, and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of the winds, and of the clouds, and of darkness, and of snow and hail and hoarfrost, and the angels of the voices and the thunder and the lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his creatures that are in the heavens and on the earth and in the seas and in the depths and in darkness and in light and in dawn and in evening, which he prepared in the knowledge of his heart.

    3. And then we saw his works, and we blessed him and praised before him on account of all his works[7], because

    4. he made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above and half of them went down beneath the firmament in the midst over the face of the whole earth. And this alone

    5. was the work that he made on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and let the dry land appear.

    6. And the waters did so, just as he told them, and they withdrew from upon the face of the earth into

    7. one place outside this firmament, and the dry land appeared. And on that day he created for it all the seas according to their separate gatherings, and all the rivers and the gatherings of the waters in the mountains and in all the earth, and all the lakes and all the dew of the earth, and the seed that is sown, and everything that sprouts, and fruit-bearing trees, and the Garden of Eden in Eden for delight, and for all these—four great kinds—he made on the third day.

    8. And on the fourth day he made the sun and the moon and the stars, and set them in the firmament of heaven so that they might give light upon all the earth and rule

    9. over day and night and separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.

    10. And it separates light from darkness, and for prosperity, so that everything that shoots and grows on the earth may prosper. These three kinds he made on the fourth day.

    11. And on the fifth day he created the great sea-monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—

    12. the birds and all their kinds. And the sun rose over them for prosperity, and over everything that was on the earth, everything that sprouts from the earth, and every fruit-bearing tree, and all flesh. These three kinds he made on the fifth day. And on the sixth day he made all the beasts of the earth, and all cattle, and everything that moves upon the earth. And after all this he made humankind, male and female he made them, and gave them authority over everything that is upon the earth and in the seas, and over everything that flies, and over the beasts and over the cattle and over everything that moves upon the earth, and over all the earth. And over all this he gave them authority. And four kinds he made on the sixth day. And all were twenty-two kinds. And he finished all his work on the sixth day—all that is in the heavens and on the earth and in the seas and in the depths and in the light and in the darkness and in everything. And he gave us a great sign, the sabbath day, so
    that we might work six days and rest on the seventh day from all work. And all the angels of the presence and all the angels of sanctification—these two great kinds—he told us, "Let us rest with him in heaven and on earth." And he said to me, "Behold, I will separate for myself a people from among all the peoples, and they will keep the sabbath, and I will sanctify them for myself as my people, and I will bless them. As I sanctified the sabbath day, so I will sanctify them for myself, and so I will bless them; and they will be my people, and I will be their God. And I have chosen the seed of Jacob from among all that I have seen, and have written him down as my firstborn son, and have sanctified him for myself forever and ever. And I will make known to them the sabbath day, so that they may rest on it from all work." And thus he made a sign by which they should keep sabbath with us on the seventh day, to eat and to drink and to bless him who created all things, just as he blessed and
    sanctified for himself a people for possession from among all the nations, and that they should keep sabbath together with us. And he caused his commands to ascend as a pleasing fragrance acceptable before him all the days. There were twenty-two heads of mankind from Adam to Jacob, and twenty-two kinds of work were made until the seventh day. This is blessed and holy, and this also is blessed and holy; and this one and that one were for holiness and for blessing. And to this one it was given that they should be blessed and holy all the days, according to the testimony and the first law, just as it was sanctified and blessed on the seventh day. He created heaven and earth and everything that he created in six days, and God made the seventh day holy for all his works. Therefore he commanded concerning it that everyone who does any work on it shall die, and whoever defiles it shall surely die. And you command the children of Israel, and let them keep this day so that they may sanctify it,
    and so that they may not do on it any work, and so that they may not defile it, for it is holier than all days. And everyone who profanes it shall surely die, and everyone who does on it any work shall surely die forever, so that the children of Israel may keep this day throughout their generations and not be uprooted from the land; for it is a holy day and a blessed day. And every person who keeps it and rests on it from all his work will be holy and blessed through all days, like us.

    29. And declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves in their dwellings on the sixth day.

    30. And they shall not bring in or take out from house to house on this day, for it is holier and more blessed than any jubilee day of jubilees. On this we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.

    31. And the Creator of all blessed it, but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he gave that they should eat and drink and keep sabbath on it upon the earth.

    32. And the Creator of all blessed this day which he created for blessing and holiness

    33. and glory above all days[31][30][29-30][12][10]. This law and testimony was given to the children of Israel as an everlasting law throughout their generations.'
  footnotes:
  - marker: '2'
    text: The list of created angelic and elemental spirits is textually dense and may reflect some local corruption or compression in the Ethiopic tradition. The translation stays close to the sequence rather than smoothing the catalog.
    reason: segmentation_note
  - marker: '7'
    text: The phrase rendered 'for all these—four great kinds' is difficult because the verse combines topographical features, vegetation, and Eden in a compressed list. The number likely summarizes grouped categories rather than every item individually.
    reason: segmentation_note
  - marker: '10'
    text: The clause rendered 'for prosperity' may also be understood as 'for healing' or 'for making flourish,' referring to the beneficial effect of the heavenly lights on earthly growth.
    reason: lexical_alternative
  - marker: '12'
    text: Verse 12 in this source row contains a long continuous block that likely spans multiple traditional verse divisions (12-28). The English preserves the supplied chapter segmentation by combining them into a single verse 12 to match the source payload structure.
    reason: segmentation_note
  - marker: 29-30
    text: The legal details about carrying, preparing food, drawing water, and moving goods from house to house are preserved from the Ethiopic wording and should not be harmonized automatically with later rabbinic Sabbath law, though they are related in theme.
    reason: cultural_note
  - marker: '30'
    text: The phrase 'more blessed than any jubilee day of jubilees' is difficult and may be an emphatic comparison elevating the weekly Sabbath above even the highest festal cycles.
    reason: alternative_reading
  - marker: '31'
    text: The text states that the Creator blessed the day but did not sanctify all peoples and nations to keep Sabbath on it; Israel alone receives that sanctified earthly observance. This is a theological claim of election in sacred time, not merely an ethnic aside.
    reason: cross_reference
translation:
  language: ko
  text: '1[2]. 임재의 사자가 주님의 말씀으로 모세에게 일러 가로되 창조의 사적을 다 기록하라 주님 하나님이 엿새 동안에 그의 모든 일과 그의 창조하신 모든 일을 마치시고 일곱째 날에 안식하사 그것을 만세의 거룩하게 하시고 그것을 그의 모든 일의 표로 정하셨느니라

    2. 첫째 날에 그가 위의 하늘과 땅과 물과 자기 앞에서 섬기는 모든 영을 창조하시되 곧 임재의 천사들과 거룩하게 하는 천사들과 불의 영의 천사들과 바람과 구름과 흑암과 눈과 우박과 서리의 영의 천사들과 음성을 다스리는 천사들과 우렛소리와 번개와 성령의 천사들을 창조하셨으니 추위와 더위와 겨울과 봄과 추수와 여름과 또 하늘과 땅과 바다와 깊은 데와 어둠과 빛과 새벽과 저녁에 있는 그의 모든 피조물의 영 곧 그가 그의 마음을 아시는 대로 예비하신 것이라.

    3. 우리는 그의 행하신 일을 보고 그의 모든 행하신 일로 말미암아 그에게 축복하고 그 앞에서 찬양하였으니

    4. 그는 첫날에 일곱 가지 큰 일을 행했습니다. 둘째 날에 그가 물 가운데 궁창을 만드셨더니 그 날에 물이 갈라져 절반은 온 지면 한가운데에 궁창 아래로 흐르고 절반은 궁창 아래로 내려가니라. 그리고 이것만으로도

    5. 그가 둘째 날 만든 작품이었습니다. 셋째 날에 주님께서 명하사 물이 온 지면 앞에서 한 곳으로 물러가고 뭍이 드러나라

    6. 물이 예수께서 그들에게 말씀하신 대로 되어 지면에서 빠져나가고

    7. 이 궁창 바깥 한 곳에서 마른 땅이 나타나니라. 그 날에 하나님이 그것을 위하여 모든 바다와 산과 온 땅에 있는 모든 강과 물의 모이는 것과 모든 호수와 땅의 모든 이슬과 뿌린 씨와 싹이 나는 모든 것과 열매 맺는 나무와 에덴 동산을 기뻐하게 창조하셨으니 이 모든 것을 네 가지 큰 종류로 셋째 날에 만드셨느니라.

    8. 그리고 넷째 날에 그가 해와 달과 별들을 만들고 그것들을 하늘의 궁창에 두어 그것들이 온 땅을 비추게 하여 다스리게 하였느니라

    9. 낮과 밤에 빛과 어둠을 나누느니라. 하나님이 태양을 땅 위에 큰 표징으로 정하여 날과 안식일과 달과 정한 때와 해와 안식일과 희년과 연중 사시를 정하였느니라.

    10. 빛과 어두움을 나뉘게 하여 땅에 싹이 나고 자라는 모든 것이 다 형통하게 하느니라 그가 넷째 날에 만든 세 가지 종류입니다.

    11. 다섯째 날에 그가 큰 바다 괴물들을 깊은 물 속에 창조하셨으니 이는 그의 손으로 지으신 최초의 육체와 물에서 움직이는 모든 것과 나는 모든 것임이니라

    12. 새와 그 모든 종류. 그리고 해가 그들 위에 떠올라서 번영을 이루었고, 땅에 있는 모든 것, 땅에서 돋는 모든 것, 모든 열매 맺는 나무와 모든 육체 위에 떠올랐습니다. 그가 5일째에 만든 세 가지 종류입니다. 여섯째 날에 하나님이 땅의 모든 짐승과 모든 육축과 땅에 움직이는 모든 것을 만드셨으니 이 모든 일 후에 하나님이 사람을 남자와 여자로 만드시고 그들에게 땅과 바다에 있는 모든 것과 날아다니는 모든 것과 짐승과 육축과 땅에 움직이는 모든 것과 온 땅을 다스리는 권세를 주셨느니라. 그리고 이 모든 일에 대하여 그들에게 권위를 주셨습니다. 그리고 여섯째 날에는 네 종류를 만들었어요. 그리고 모두 스물두 종류였습니다. 그리고 그분께서는 여섯째 날에 그의 모든 일을 마치셨습니다. 하늘과 땅과 바다와 깊은 곳과 빛과 어둠과 모든 것 위에 있는 모든 일을 마치셨습니다. 그리고 우리에게 큰 표징인 안식일을 주셨으니, 이는 우리가 엿새 동안 일하고 일곱째 날에는 모든 일을 쉬도록 하신 것입니다. 그리고 모든 임재의 천사들과 성화의 모든 천사들, 이 두 종류의 큰 천사들에게 우리에게 말씀하시기를 "하늘과 땅에서 그와 함께 쉬자" 하셨습니다. 그가 내게 이르시되 보라 내가 모든 민족 중에서 한 백성을 구별하여 안식일을 지키고 내가 그들을 거룩하게 하여 내 백성으로 삼고 그들에게 복을 주리라. 내가 안식일을 거룩하게 한 것 같이 나를 위하여 그들을 거룩하게 하고 그들에게 복을 주리라. 그러면 그들은 내 백성이 되고 나는 그들의 하나님이 될 것이다. 그리고 내가 본 모든 것 중에서 야곱의 자손을 택하여 그를 내 장자로 기록하고 나를 위하여 영원무궁토록 그를 거룩하게 하였느니라. 내가 그들에게 안식일을 알게 하여 그들이 모든 일을 쉬게 하리라 하셨으니 이에 그들이 일곱째 날에 우리와 함께 안식일을 지키라 표를 정하여 먹고 마시며 만물을 창조하신 이를 송축함과 같이 모든 민족 중에서 자기를 위하여 거룩하게 하신 백성을 얻게 하사 그들이 우리와 함께 안식하게 하신 것과
    같으니라 아담으로부터 야곱까지 인류의 우두머리가 이십이 명이요 일곱째 날까지 이십이 일이 행하였으니 이것도 복되고 거룩하니 이것도 거룩하니라 이 사람과 저 사람은 거룩함과 축복을 위하여 주셨으니 증거와 첫 율법대로 일곱째 날에 천지와 만물을 거룩하게 하시고 하나님이 일곱째 날을 모든 사람을 위하여 거룩하게 하셨느니라 그러므로 그가 명하노니 그 일을 하는 자는 다 죽을 것이요 그것을 더럽히는 자는 반드시 죽으리라 너는 이스라엘 자손에게 명령하여 오늘을 지켜 거룩하게 하고 어떤 일도 하지 말며 더럽히지 말라 이 일을 더럽히는 자는 반드시 죽을 것이요 무슨 일이든지 영원히 죽으리니 이스라엘 자손이 이를 지키리라 이 날은 거룩한 날이요 복된 날임이라 이 날을 대대로 지켜 땅에서 뽑히지 않게 하소서 이 날을 지키며 그 일을 쉬는 자마다 우리와 같이 영원토록 거룩하고 복을 받으리라

    29. 그리고 이스라엘 자손에게 오늘의 율법을 선포하여 이르라 그들이 그 날에 안식일을 지키고 마음의 그릇됨으로 그것을 버려두지 말며 그 날에 합당하지 아니한 일을 하거나 자기 뜻대로 하지 말며 그 위에 먹을 것과 마실 것을 준비하지 말며 물을 길지 말며 또 여섯째 날에 그들이 거주할 때 준비하지 아니한 짐을 그들의 문으로 가져오거나 꺼내지 말라고 하라.

    30. 이 날에는 이 집에서 저 집으로 물건을 가져오거나 가지고 나가지 말지니 이는 어떤 희년보다 거룩하고 복된 날임이니라. 땅에서 안식일을 지키는 것이 어떤 육체에게 알려지기 전에 우리가 하늘에서 이것을 지켰느니라.

    31. 만물의 창조주가 이 땅에 복을 주었으나 모든 백성과 나라를 거룩하게 하여 그 날에 안식일을 지키게 하지는 아니하였느니라 이스라엘에게만 허락하시고 땅에서 먹고 마시며 안식을 지키게 하셨느니라

    32. 그리고 모든 것의 창조주께서는 축복과 거룩함을 위해 창조하신 이 날을 축복하셨습니다.

    33. 모든 일 위에 영광이 있으리로다[31][30][29-30][12][10]. 이 율법과 증거는 이스라엘 자손에게 대대로 영원한 율법으로 주어졌느니라.'
