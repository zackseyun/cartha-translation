  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
  footnotes:
  - marker: '26'
    text: '''From seed'' likely refers to agricultural produce or yield, not merely seed reserved for sowing.'
    reason: cultural_note
  - marker: a
    text: 'Or ''limit of days[26], for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed''.'
    reason: previous_rendering
translation:
  language: ko
  text: 이 율법에는 기한이 없으니, 그가 그것을 영원히 모든 세대를 위해 정하셨습니다. 곧 그들이 씨앗[26]과 포도주와 기름의 십분의 일을 모두 야훼께 드리게 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአልቦ፡ ... ወሰነ፡ መዋዕል፡
  english_pob_choice: there is no limit of days
  chosen_korean: 기한이 없으니
  alternatives_korean:
  - 날의 한계가 없으니
  - 기간이 정해져 있지 않으니
  lexicon: limit of days
  rationale: 날수의 종결이나 종료 시점을 가리키는 표현으로 이해하여, 자연스럽고 직접적인 한국어인 ‘기한’으로 옮겼습니다.
- source_word: ሕግ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 규례
  lexicon: 율법
  rationale: 문맥상 모세적 규범을 가리키므로, POB 기본 용례에 따라 ‘율법’으로 번역했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 여호와
  - 주님
  lexicon: YHWH
  rationale: 지시 대상이 여호와 하나님의 고유명이라서, 프로젝트 기본값에 따라 ‘야훼’를 사용했습니다.
- source_word: ዘርእ
  english_pob_choice: seed
  chosen_korean: 씨앗
  alternatives_korean:
  - 씨
  - 농산물
  - 소출
  lexicon: seed
  rationale: 영어 본문이 각주로 농산물/수확물의 뜻 가능성을 지적하므로, 문자적 ‘씨앗’을 유지하되 각주로 의미 범위를 안내했습니다.
theological_decisions:
- issue: 십일조의 범위 표현
  chosen_reading: “씨앗과 포도주와 기름의 십분의 일”로 직역하여, 단순한 화폐 헌금이 아니라 생산물 전체의 십일조임을 드러냈습니다.
  alternative_readings:
  - “모든 소출의 십분의 일”로 완화
  - “농산물의 십분의 일”로 의역
  rationale: 본문은 씨앗, 포도주, 기름을 열거하여 헌납 대상의 물질적 범위를 분명히 하므로, 그 구조를 보존하는 것이 해석상 중요합니다.
  doctrine_reference: 토라의 헌납 규정과 십일조의 소출 중심 성격
