  source_fidelity: 게에즈어 ጸግወነ의 복수 목적어를 ‘우리에게’로 반영한 점, ‘지극히 높으신 하나님’, 최소 단위부터 신발 끈까지라는 강조, 동행한 세 사람의 몫을 보존한 점은 원문에 충실합니다. 그러나 ‘lest you should say’는 상대가 말할 수 없게 된다는 뜻이 아니라 그가 그렇게 말하지 않도록 한다는 목적/예방의 뜻이므로 수정이 필요합니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 ‘그래야 ... 말하지 못할 것입니다’는 인과와 양태가 원문과 어긋납니다. 또한 문맥상 ‘받게 하십시오’보다 ‘가져가게 하십시오’가 분배 몫을 취하는 행위를 더 분명히 합니다.
  terminology: ‘아브람’, ‘아넬’, ‘에스골’, ‘마므레’, ‘지극히 높으신 하나님’은 적절합니다. ‘구해 주신 사람들’도 원문의 구출된 사람들을 자연스럽게 나타냅니다. 영어 감사 기록의 이문 가능성(단수 ‘저에게’)은 해당 단어에 각주로 보존하는 것이 적절합니다.
