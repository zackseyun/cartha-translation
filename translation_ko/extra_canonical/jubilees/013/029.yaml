base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/029.yaml
  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
  footnotes:
  - marker: a
    text: Or 'Give me'.
    reason: previous_rendering
translation:
  language: ko
  text: “구해 주신 사람들은 우리에게[a] 주십시오. 그러나 재물은 당신의 것이 되게 하십시오.” 아브람이 그에게 말했습니다. “나는 지극히 높으신 하나님께 손을 들어 맹세했습니다. 실 한 오라기에서부터 신발 끈에 이르기까지, 나는 당신의 것인 아무것도 받지 않겠습니다. 당신이 ‘내가 아브람을 부유하게 만들었다’고 말하지 않도록 하려는 것입니다. 다만 젊은이들이 먹은 것과 나와 함께 갔던 사람들, 곧 아넬과 에스골과 마므레의 몫은 제외합니다. 그들이 자기 몫을 가져가게 하십시오.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘저에게’.
    reason: 게에즈어 본문은 복수형 ‘우리에게’를 지지하지만, 영어 감사 추적에 보존된 단수 대안을 해당 표현에 한정하여 제시합니다.
lexical_decisions:
- source_word: ጸግወነ
  english_pob_choice: Give us
  chosen_korean: 우리에게 주십시오
  alternatives_korean:
  - 저에게 주십시오
  - 우리에게 넘겨주십시오
  lexicon: Geez ጸግወ
  rationale: 게에즈 원문과 수정 이력에 따라 복수형 요청을 반영했고, 한국어에서는 목적어를 자연스럽게 풀어 ‘우리에게 주십시오’로 옮겼습니다.
- source_word: አምላክ፡ ልዑል
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  lexicon: 고유 신칭/최상급 표현
  rationale: ‘God Most High’의 최상급 의미를 살리되, 한국어 성경체에서 자연스러운 ‘지극히 높으신 하나님’으로 옮겼습니다.
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ፡
  english_pob_choice: from a thread even to a sandal strap, I will not take anything that is yours
  chosen_korean: 실 한 오라기에서부터 신발 끈에 이르기까지, 나는 당신의 것인 아무것도 받지 않겠습니다
  alternatives_korean:
  - 실에서부터 신발 끈까지, 나는 당신의 것을 아무것도 받지 않겠습니다
  - 실 한 올에서부터 신발 끈에 이르기까지, 나는 아무것도 받지 않겠습니다
  lexicon: 관용적 최소량 강조 표현
  rationale: 최소 단위의 소유도 받지 않겠다는 원문의 강한 부정을 보존하기 위해 ‘실 한 오라기…신발 끈’의 점층 구조를 살렸습니다.
- source_word: መክፈልቶሙ
  english_pob_choice: their share
  chosen_korean: 자기 몫
  alternatives_korean:
  - 그들의 몫
  - 그들의 분깃
  lexicon: 분배/몫 표현
  rationale: 문맥상 전리품 분배의 몫을 가리키므로 현대 한국어에서 간결하고 명확한 ‘몫’으로 옮겼습니다.
theological_decisions:
- issue: 맹세의 대상과 표현
  chosen_reading: 아브람이 ‘지극히 높으신 하나님께 손을 들어 맹세했습니다’로 옮겨, 제스처와 맹세 행위를 함께 드러냈습니다.
  alternative_readings:
  - ‘하나님께 손을 들었습니다’
  - ‘하나님께 맹세했습니다’
  rationale: 원문은 손을 드는 동작이 맹세의 표지이므로, 단순한 서약보다 맹세의 몸짓을 함께 보이게 했습니다.
  doctrine_reference: 서약/맹세 표현의 서사적 재현
