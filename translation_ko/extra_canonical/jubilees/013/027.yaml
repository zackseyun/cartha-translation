  source_fidelity: 후반절은 제사장들에게 주어 먹고 마시게 했다는 원문의 분배·향유 서술을 대체로 충실히 반영합니다. 다만 첫 문장의 ‘것이었습니다’는 원문의 연결된 ‘소와 양에서/에게서’ 구절을 독립 문장으로 처리하면서 한국어 문법과 문맥 연결을 어색하게 만듭니다.
  naturalness: ‘소와 양에서 나온 것이었습니다’는 현대 한국어에서 무엇에 대한 서술인지 불분명하고 부자연스럽습니다. 또한 ‘즐거움으로 먹고 마시게 했습니다’보다 ‘기뻐하며 먹고 마시게 하였습니다’가 합쇼체의 자연스러운 서술입니다.
