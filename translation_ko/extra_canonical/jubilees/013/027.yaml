  text: and from cattle and from sheep. And he gave it to his priests to eat and to drink with rejoicing.
translation:
  language: ko
  text: 그리고 소와 양에서 나온 것이었습니다. 그는 자기 제사장들에게 그것을 주어, 즐거움으로 먹고 마시게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምአልህምት / እምአባግዕ
  english_pob_choice: from cattle and from sheep
  chosen_korean: 소와 양에서 나온 것
  alternatives_korean:
  - 가축과 양에서 나온 것
  - 소와 양으로부터 나온 것
  lexicon: source_note
  rationale: 게에즈 원문의 병렬 구조를 따라 가축류인 소와 양을 간명하게 옮겼습니다. 'from'의 출처성은 문맥상 분명하므로 자연스러운 한국어 조사로 처리했습니다.
- source_word: ካህናቲሁ
  english_pob_choice: his priests
  chosen_korean: 자기 제사장들
  alternatives_korean:
  - 그의 제사장들
  - 자기 사제들
  lexicon: source_note
  rationale: 문맥상 그가 속한 종교 집단의 제사장들을 가리키므로 소유를 드러내는 '자기'를 사용했습니다. '사제'보다 한국어 성경 독자에게는 '제사장'이 원문 기능을 더 직접적으로 전달합니다.
- source_word: በፍሥሓ
  english_pob_choice: with rejoicing
  chosen_korean: 즐거움으로
  alternatives_korean:
  - 기쁨으로
  - 즐거이
  lexicon: source_note
  rationale: ‘기뻐함/환호함’의 상태를 나타내는 부사적 표현이므로, 행위의 분위기를 자연스럽게 살리는 '즐거움으로'를 택했습니다.
theological_decisions:
- issue: 제사장들에게 음식을 주어 먹고 마시게 한 서술의 표현 수위
  chosen_reading: 원문의 사실 서술을 그대로 살려, 하나님께 대한 해설을 덧붙이지 않고 단순한 분배와 향유의 장면으로 옮겼습니다.
  alternative_readings:
  - ‘봉헌하여 먹고 마시게 했다’처럼 예배적 의미를 강화하는 읽기
  - ‘잔치를 베풀었다’처럼 해석을 확장하는 읽기
  rationale: 게에즈 본문과 영어 POB 모두 단순한 서술에 머물러 있으며, 본문이 명시하지 않은 제의적 의미를 추가하면 원문 범위를 넘을 수 있습니다.
  doctrine_reference: source fidelity / restraint in inference
