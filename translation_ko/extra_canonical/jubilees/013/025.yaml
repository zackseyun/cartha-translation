  - 세세토록
  - 영원토록
  - 항상
  lexicon: forever
  rationale: 게에즈 원문의 ‘세상/세계’ 계열 어휘가 아니라 기간·지속을 가리키는 종결 구로 보이므로, 한국어에서는 시간적 지속을 분명히 하는 ‘영원히’로 옮겼습니다.
theological_decisions:
- issue: 목적절의 자연스러운 한국어 재현
  chosen_reading: “that they might possess it forever”를 결과보다 목적을 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - “그들이 그것을 영원히 소유할 것입니다.”
  - “그들이 그것을 영원히 차지하게 될 것입니다.”
  rationale: 영어 POB와 원문이 모두 목적을 나타내는 구문으로 읽히므로, 한국어도 ‘-게 하려는’ 구조로 목적성을 유지하는 것이 가장 충실합니다.
