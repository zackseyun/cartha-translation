  - 그것을 가지게 하려는
  - 그것을 얻게 하려는
  lexicon: possess
  rationale: 게으름없는 미래적 목적을 나타내는 영어 POB의 뜻을 따라, 단순 보유보다 소유·점유의 뉘앙스를 살리는 ‘소유하다’를 선택했습니다.
- source_word: ለዓለም
  english_pob_choice: forever
  chosen_korean: 영원히
