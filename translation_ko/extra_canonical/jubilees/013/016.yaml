  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
  footnotes:
  - marker: a
    text: Or 'he entered that place and built there an altar'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 제41 희년 첫째 주의 셋째 해에, 그는 이곳으로 돌아와 그 위에 희생 제물을 바치고 야훼의 이름을 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 그곳에 들어가 그곳에 제단을 세웠다.”
    reason: 영어 POB 감사 이력에 보존된 이전 번역의 대안 독법을 제시합니다. 본문은 제공된 게에즈어 본문과 최신 소스 기반 교정에 따라 ‘이곳으로 돌아와 그 위에 희생 제물을 바치고’로 번역합니다.
