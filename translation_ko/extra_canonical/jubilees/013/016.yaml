translation:
  language: ko
  text: 그리고 마흔한 번째 희년, 첫째 주의 셋째 해에, 그는 이곳으로 돌아와 그 위에 희생제를 드리고 야훼의 이름을 불렀습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዘአርብዓ፡ ወአሐዱ፡ ኢዮቤልዎን፡ በሣልስ፡ ዓም፡ ዘሱባዔ፡
  english_pob_choice: in the forty-first jubilee, in the third year of the first week
  chosen_korean: 마흔한 번째 희년, 첫째 주의 셋째 해
  alternatives_korean:
  - 41번째 희년, 첫째 주의 셋째 해
  - 마흔한 희년의 첫째 주 셋째 해
  lexicon: 희년
  rationale: 숫자 구조를 원문과 English POB에 맞게 보존하면서, Jubilees의 기술 용어인 ἰοβέλ/희년을 한국어로 직접 옮겼습니다.
- source_word: ገብአ፡ ውስተዝ፡ መካን፡
  english_pob_choice: he returned to this place
  chosen_korean: 이곳으로 돌아와
  alternatives_korean:
  - 이곳에 돌아와
  - 그곳으로 돌아와
  lexicon: 돌아오다
  rationale: 수정된 소스 판독은 ‘entered/installed’가 아니라 ‘returned’이므로, 장소 이동의 복귀 의미를 살려 번역했습니다.
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ፡
  english_pob_choice: and offered a sacrifice upon it
  chosen_korean: 그 위에 희생제를 드리고
  alternatives_korean:
  - 그 위에 제사를 드리고
  - 그 위에 번제를 드리고
  lexicon: 희생제
  rationale: 원문과 교정 내역이 제물 드림을 가리키므로, 일반적인 ‘제사’보다 행위의 구체성을 드러내는 ‘희생제’를 택했습니다.
- source_word: ወጸውዐ፡ በስመ፡ እግዚአብሔር፡
  english_pob_choice: and he called on the name of the LORD
  chosen_korean: 야훼의 이름을 불렀습니다
  alternatives_korean:
  - 주님의 이름을 불렀습니다
  - 여호와의 이름을 불렀습니다
  lexicon: 야훼
  rationale: YHWH 대응어는 프로젝트 기본값인 ‘야훼’를 따르고, 동사는 관용구의 의미를 살려 ‘이름을 부르다’로 옮겼습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 본문의 ‘주’ 대응을 일반화하지 않고 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 주님의 이름
  - 여호와의 이름
  rationale: 프로젝트 기본 원칙에 따라 መ/YHWH는 학술적 음역인 ‘야훼’로 표기하여 원문 식별성을 유지했습니다.
  doctrine_reference: Tetragrammaton rendering policy
