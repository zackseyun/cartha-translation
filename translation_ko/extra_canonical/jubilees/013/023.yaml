  lexicon: established biblical form
  rationale: 성경 고유명사는 한국어에서 확립된 ‘단’을 따르는 것이 자연스럽습니다.
theological_decisions:
- issue: 창세기 14장 병행 전승을 어떻게 반영할지
  chosen_reading: 게에즈 본문이 말하는 ‘소돔 사람들의 골짜기’와 ‘역청 구덩이’를 그대로 살리되, 지리적 관계는 ‘소금 바다 곁의’로 풀어 옮겼습니다.
  alternative_readings:
  - ‘시딤 골짜기’로 정리
  - ‘소금 바다 골짜기’로 단순화
  rationale: 본문 자체는 시딤을 직접 쓰지 않으므로, 병행 본문을 과잉 반영해 본문 고유 표현을 지우지 않으면서도 의미는 분명하게 전달하도록 했습니다.
  doctrine_reference: source fidelity / intertextual parallel
