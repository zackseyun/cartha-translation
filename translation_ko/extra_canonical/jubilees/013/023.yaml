  lexicon: Leslau
  rationale: 행위의 결과를 분명히 드러내되, 원문의 단순 과거 서술을 과장하지 않도록 ‘죽였고’로 옮겼습니다.
- source_word: ወጐየ
  english_pob_choice: fled
  chosen_korean: 도망쳤으며
  alternatives_korean:
  - 달아났으며
  - 도망가며
  lexicon: Leslau
  rationale: 주어가 소돔 왕이므로 단순한 이동이 아니라 패주를 나타내는 ‘도망쳤으며’가 가장 정확합니다.
- source_word: በቀብአ፡ በቀላ፡ ሰዶማውያን
  english_pob_choice: into the bitumen of the valley of the Sodomites
  chosen_korean: 소돔 사람들의 골짜기, 소금 바다 곁의 역청 구덩이
  alternatives_korean:
  - 소돔 사람들의 골짜기의 역청 구덩이
  - 소돔 사람들의 골짜기 속 역청
  - 사해 곁의 역청 구덩이
  lexicon: Leslau / Genesis 14:10 parallel
  rationale: 게에즈 본문이 ‘소돔 사람들’과 ‘역청/오일’ 어휘를 분명히 갖고 있으므로, 창세기 14:10의 병행 전통을 따라 ‘역청 구덩이’로 옮기고 위치 관계를 한국어로 풀어 주었습니다.
