  source_fidelity: 핵심 사건 순서와 인명은 대체로 충실하지만, በቀብአ(역청 자체)를 ‘역청 구덩이’로 확정한 것은 게에즈 본문에 없는 ‘구덩이’를 보충합니다. 또한 ‘소금 바다 곁의’가 ‘소돔 사람들의 골짜기’와 ‘역청’의 관계를 불명확하게 만듭니다.
  naturalness: 현 초안의 첫 절은 ‘민족들의 왕 타르갈[a], 그들은’으로 이어져 한국어 문장 구조가 부자연스럽습니다. 원문의 다소 불완전하거나 압축적인 접속을 과도하게 해설하지 않으면서, 타르갈을 뒤따르는 복수 주체에 포함시키는 문장으로 다듬는 것이 안전합니다.
  terminology: ‘타르갈’과 ‘단’, ‘고모라’, ‘소돔’, ‘아드마’, ‘스보임’, ‘롯’, ‘아브람’은 적절합니다. በቀብአ는 문맥상 ‘역청’으로 옮기되, ‘구덩이’는 각주에서 창세기 병행 본문과의 관련으로만 설명해야 합니다.
  issues:
