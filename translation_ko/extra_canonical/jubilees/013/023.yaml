    issue: ‘역청 구덩이’는 원문보다 구체적입니다.
    rationale: 게에즈는 ‘기름/역청’에 해당하는 qab'a를 읽으며, ‘구덩이’라는 명사는 명시하지 않습니다. 창세기 14:10의 병행 표현을 본문 번역에 삽입하지 말고 ‘역청 속으로’로 옮기는 편이 원문에 충실합니다.
