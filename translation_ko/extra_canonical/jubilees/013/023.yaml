base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
  footnotes:
  - marker: a
    text: Ge'ez Targāl, corresponding to Tidal in Genesis 14:1.
    reason: lexical_choice
  - marker: b
    text: Ge'ez ba-qab'a baqalā Sadomāwyān (lit. 'in the oil/bitumen of the valley of the Sodomites'). This corresponds to the 'bitumen pits in the valley of Siddim' in Genesis 14:10. Charles (1902) considered the text corrupt and emended to 'through wounds', but the Ge'ez is comprehensible as a rendering of the Genesis tradition.
    reason: textual_critical
translation:
  language: ko
  text: 그리고 민족들의 왕 타르갈[a]과 그들은 고모라의 왕을 죽였고, 소돔의 왕은 도망쳤으며, 많은 사람이 소금 바다 곁에 있는 소돔 사람들의 골짜기의 역청 속으로 떨어졌습니다[b] 그들은 소돔과 아드마와 스보임을 사로잡았고, 아브람의 형제의 아들인 롯과 그의 모든 재산도 사로잡아 단까지 갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 타르갈(Targāl)은 창세기 14:1의 디달에 해당합니다.
    reason: lexical_choice
  - marker: b
    text: 게에즈어 ba-qab'a baqalā Sadomāwyān은 직역하면 ‘소돔 사람들의 골짜기의 기름/역청 안에’입니다. 이는 창세기 14:10의 ‘시딤 골짜기의 역청 구덩이’ 전승과 대응합니다. 찰스는 본문을 손상된 것으로 보고 ‘상처들을 통하여’로 고쳤지만, 게에즈 본문은 역청으로 이해할 수 있습니다.
    reason: textual_critical
lexical_decisions:
- source_word: ንጉሠ፡ አሕዛብ
  english_pob_choice: king of nations
  chosen_korean: 민족들의 왕
  alternatives_korean:
  - 나라들의 왕
  - 이방 민족들의 왕
  lexicon: Leslau / POB audit trail
  rationale: 직역하면 ‘민족들의 왕’이 가장 자연스럽고, 고유명사나 정치체를 과장하지 않으면서 원문의 칭호를 보존합니다.
- source_word: ወቀትልዎ
  english_pob_choice: they killed
  chosen_korean: 죽였고
  alternatives_korean:
  - 쳐서 죽였고
  - 죽이고
  lexicon: Leslau
  rationale: 행위의 결과를 분명히 드러내되, 원문의 단순 과거 서술을 과장하지 않도록 ‘죽였고’로 옮겼습니다.
- source_word: ወጐየ
  english_pob_choice: fled
  chosen_korean: 도망쳤으며
  alternatives_korean:
  - 달아났으며
  - 도망가며
  lexicon: Leslau
  rationale: 주어가 소돔 왕이므로 단순한 이동이 아니라 패주를 나타내는 ‘도망쳤으며’가 가장 정확합니다.
- source_word: በቀብአ፡ በቀላ፡ ሰዶማውያን
  english_pob_choice: into the bitumen of the valley of the Sodomites
  chosen_korean: 소돔 사람들의 골짜기, 소금 바다 곁의 역청 구덩이
  alternatives_korean:
  - 소돔 사람들의 골짜기의 역청 구덩이
  - 소돔 사람들의 골짜기 속 역청
  - 사해 곁의 역청 구덩이
  lexicon: Leslau / Genesis 14:10 parallel
  rationale: 게에즈 본문이 ‘소돔 사람들’과 ‘역청/오일’ 어휘를 분명히 갖고 있으므로, 창세기 14:10의 병행 전통을 따라 ‘역청 구덩이’로 옮기고 위치 관계를 한국어로 풀어 주었습니다.
- source_word: ዳን
  english_pob_choice: Dan
  chosen_korean: 단
  alternatives_korean:
  - 다ן
  lexicon: established biblical form
  rationale: 성경 고유명사는 한국어에서 확립된 ‘단’을 따르는 것이 자연스럽습니다.
theological_decisions:
- issue: 창세기 14장 병행 전승을 어떻게 반영할지
  chosen_reading: 게에즈 본문이 말하는 ‘소돔 사람들의 골짜기’와 ‘역청 구덩이’를 그대로 살리되, 지리적 관계는 ‘소금 바다 곁의’로 풀어 옮겼습니다.
  alternative_readings:
  - ‘시딤 골짜기’로 정리
  - ‘소금 바다 골짜기’로 단순화
  rationale: 본문 자체는 시딤을 직접 쓰지 않으므로, 병행 본문을 과잉 반영해 본문 고유 표현을 지우지 않으면서도 의미는 분명하게 전달하도록 했습니다.
  doctrine_reference: source fidelity / intertextual parallel
