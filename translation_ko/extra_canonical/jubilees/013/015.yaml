  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: ko
  text: 파라오가 사래, 곧 아브람의 아내를 내보내고 그를 이집트 땅에서 쫓아냈습니다. 그는 처음에 장막을 쳤던 곳, 곧 서쪽에는 벧엘이 있고 동쪽에는 아이가 있는 제단의 자리로 갔습니다. 그리고 그는 자기를 평안히 돌아오게 하신 그의 하나님이신 주님을 찬양했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርዖን
  english_pob_choice: Pharaoh
  chosen_korean: 파라오
  alternatives_korean:
  - 바로
  lexicon: 고유명사
  rationale: 본문의 고유명사로서 음역을 유지하되, 학술적·직역적 감각을 살려 ‘파라오’로 옮겼습니다. 기존 교회용 관용형 ‘바로’도 가능하지만, 원문 지칭을 더 직접적으로 드러냅니다.
- source_word: አፍለሶ፡ እምድረ፡ ግብጽ
  english_pob_choice: expelled him from the land of Egypt
  chosen_korean: 그를 이집트 땅에서 쫓아냈습니다
  alternatives_korean:
  - 그를 이집트 땅에서 내쫓았습니다
  - 그를 이집트에서 내보냈습니다
  lexicon: 동사구
  rationale: 원문의 강한 추방 의미를 살리기 위해 단순한 ‘보내다’보다 ‘쫓아내다’를 택했습니다. ‘땅’은 እምድረ의 지리적 범위를 반영합니다.
- source_word: በሰላም
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 무사히
  lexicon: 부사
  rationale: ‘평안’은 히브리적 샬롬의 뉘앙스를 비교적 자연스럽게 담으면서, 단순한 안전 이상을 보여 줍니다.
- source_word: ወቤቴል፡ እምባሕር፡
  english_pob_choice: between Bethel on the west and Ai on the east
  chosen_korean: 벧엘이 서쪽에 있고 아이가 동쪽에 있는 사이였습니다
  alternatives_korean:
  - 벧엘의 서쪽과 아이의 동쪽 사이였습니다
  - 서쪽의 벧엘과 동쪽의 아이 사이였습니다
  lexicon: 지명 구문
  rationale: 원문의 관계 표지와 위치 설명을 살려, ‘사이’라는 구조 안에서 서쪽/동쪽 배치를 분명히 했습니다. 지명은 한국어 성서 관용형을 따랐습니다.
theological_decisions:
- issue: 야훼 호칭의 번역
  chosen_reading: 영어 POB의 LORD에 해당하는 신명은 ‘주 하나님’으로 번역했습니다.
  alternative_readings:
  - 야훼 하나님
  - 주님 하나님
  rationale: 이 절의 Geez 원문은 하나님의 호칭을 가리키지만, 제시된 영어 본문은 LORD로 표기합니다. 한국어 본문에서는 합쇼체의 자연스러움과 전통적 예배어를 고려해 ‘주 하나님’을 택했습니다.
  doctrine_reference: 신명 표기 관례 및 본문 간 조화
