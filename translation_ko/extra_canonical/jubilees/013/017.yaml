  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: ko
  text: 그리고 그가 말했습니다. “당신은 지극히 높으신 하나님이시며, 제 하나님이시니, 영원무궁하십니다.” 그리고 이 주간의 일곱째 해에 롯이 그에게서 갈라졌고, 롯은 소돔에 살게 되었으며, 소돔 사람들은 매우 죄악되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ ልዑል
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  lexicon: The phrase is a title for God, not a generic superlative adjective.
  rationale: ‘Most High’의 위격적 칭호를 살려 ‘지극히 높으신 하나님’으로 옮겼습니다. ‘지존’도 가능하지만 현대 한국어에서는 다소 문어적·전통적이라, 직역성과 가독성의 균형을 택했습니다.
- source_word: ልዑል አምላኪየ ለዓለመ ዓለም
  english_pob_choice: my God forever and ever
  chosen_korean: 제 하나님이시니, 영원무궁하십니다
  alternatives_korean:
  - 제 하나님이시며, 영원히 영원하십니다
  - 제 하나님이시니, 세세토록이십니다
  lexicon: The clause expresses enduring duration with a first-person possessive.
  rationale: ‘forever and ever’를 ‘영원무궁’으로 압축해 반복적 영속성을 자연스럽게 드러냈습니다. 하나님께 직접 드리는 호칭이므로 존대형을 유지했습니다.
- source_word: ወበ፯ብዑ፡ ዓመት፡
  english_pob_choice: in the seventh year of this week
  chosen_korean: 이 주간의 일곱째 해에
  alternatives_korean:
  - 이 주의 일곱째 해에
  - 이 주간의 제7년에
  lexicon: The temporal expression refers to a week-unit in Jubilees chronology.
  rationale: 주기의 단위가 일반적 ‘한 주’가 아니라 희년 구조의 ‘주간’이므로, POB의 ‘week’를 ‘주간’으로 유지했습니다.
- source_word: ተፈልጠ፡ ሎጥ፡ እምኔሁ
  english_pob_choice: Lot separated from him
  chosen_korean: 롯이 그에게서 갈라졌고
  alternatives_korean:
  - 롯이 그와 헤어졌고
  - 롯이 그를 떠났고
  lexicon: The verb marks separation rather than merely departure.
  rationale: 관계적 분리를 분명히 드러내기 위해 ‘갈라졌고’를 선택했습니다. 단순한 이동보다 서술의 초점인 분리를 더 잘 보존합니다.
- source_word: ወሰብአ፡ ሰዶም፡ ኃጥኣን፡ ጥቀ
  english_pob_choice: and the men of Sodom were very sinful
  chosen_korean: 그리고 소돔 사람들은 매우 죄악되었습니다
  alternatives_korean:
  - 그리고 소돔 사람들은 매우 죄를 지었습니다
  - 그리고 소돔 사람들은 심히 죄인이었습니다
  lexicon: The source uses an adjective for the people’s condition, not a finite verb of committing acts.
  rationale: 행위 반복보다 상태·성격 묘사를 살려 ‘죄악되었습니다’로 옮겼습니다. ‘매우’는 게어즈의 강조어를 반영합니다.
theological_decisions:
- issue: 아브라함의 고백을 하나님께 드리는 직접 화법의 존대 수준
  chosen_reading: 인용문 안에서는 하나님께 대한 직접 호칭과 서술에 존대형을 유지했습니다.
  alternative_readings:
  - 인용문을 전면 평서체로 낮춤
  - 전통적 기도체 표현으로 바꿈
  rationale: 원문은 하나님께 대한 직접 진술이므로 한국어에서도 경건한 존대가 자연스럽습니다. 다만 과도하게 전례문처럼 만들지는 않았습니다.
  doctrine_reference: 예배 언어의 경외성과 본문 서술의 직접성을 함께 보존
