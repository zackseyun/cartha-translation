revisions:
- from: 그리고 그것은 그의 마음에 괴로움이 되었습니다. 그의 형제의 아들이 그에게서 떨어져 나갔기 때문입니다. 그는 자녀가 없었기 때문입니다.[a]
  to: 그의 형제의 아들이 그에게서 떼어져 나가게 된 것이 그의 마음을 괴롭게 하였습니다. 이는 그에게 자녀가 없었기 때문입니다.[a]
  rationale: 원문 ተፈልጠ의 수동적 분리 의미를 ‘떼어져 나가게 된’으로 반영하고, 불명확한 ‘그것’을 구체적 사건으로 바꾸었습니다. 또한 두 절을 자연스러운 한국어 문장으로 재구성하되, 형제의 아들이 분리된 일과 그 인물의 무자녀 상태 사이의 원문상 인과관계를 유지했습니다.
  reviewer_model: gpt-5.6-terra
