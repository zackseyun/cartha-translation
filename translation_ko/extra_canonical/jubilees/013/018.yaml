  text: And it was grievous in his heart that his brother’s son had been separated from him, for he had no children.
translation:
  language: ko
  text: 그의 형제의 아들이 그에게서 떼어져 나가게 된 것이 그의 마음을 괴롭게 하였습니다. 이는 그에게 자녀가 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “그에게 자녀가 없었기 때문이다.”
    reason: 마지막 대명사 ‘그’는 앞 문장의 ‘그에게’ 및 ‘그의 마음’의 인물을 가리키며, 원문의 간결한 인과 표현을 보존합니다.
lexical_decisions:
- source_word: በልቡ
  english_pob_choice: in his heart
  chosen_korean: 그의 마음에
  alternatives_korean:
  - 그의 হৃদ에
  - 그의 속에
  lexicon: לב/heart
  rationale: Geez의 ‘마음’에 해당하는 내면의 자리로 자연스럽게 옮기되, 현대 한국어에서 가장 직관적인 표현인 ‘마음에’를 사용했습니다.
- source_word: አእከዮ
  english_pob_choice: it was grievous
  chosen_korean: 괴로움이 되었습니다
  alternatives_korean:
  - 몹시 슬펐습니다
  - 마음이 아팠습니다
  lexicon: be distressed / be grieved
  rationale: 단순한 슬픔보다 내면의 심한 괴로움을 드러내는 동사구로 옮겨, 원문의 정서적 강도를 유지했습니다.
- source_word: ተፈልጠ
  english_pob_choice: had been separated
  chosen_korean: 떨어져 나갔기 때문입니다
  alternatives_korean:
  - 떼어졌기 때문입니다
  - 분리되었기 때문입니다
  lexicon: be separated, passively
  rationale: 영어 POB의 수정처럼 수동 의미를 살려, 스스로 떠난 것이 아니라 분리된 상태가 되었음을 드러냈습니다.
- source_word: አልቦ፡ ውሉደ፡፡
  english_pob_choice: he had no children
  chosen_korean: 그는 자녀가 없었기 때문입니다
  alternatives_korean:
  - 그에게는 자녀가 없었기 때문입니다
  - 그는 후손이 없었기 때문입니다
  lexicon: have no children
  rationale: 직접적인 가족 관계를 나타내는 ‘자녀’가 문맥에 가장 자연스럽고, 원문의 무자녀 상태를 분명히 전달합니다.
theological_decisions:
- issue: ‘brother’s son’의 친족 관계 표현
  chosen_reading: 그의 형제의 아들
  alternative_readings:
  - 그의 조카
  - 형제의 아들
  rationale: 원문은 친족 관계를 직역적으로 제시하므로, 관용적 해석어인 ‘조카’보다 관계 구조가 보이는 표현을 택했습니다.
  doctrine_reference: source_transparency
