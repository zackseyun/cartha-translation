  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
  footnotes:
  - marker: '24'
    text: The verse is textually difficult and appears segmentationally compressed in this edition. After 'he armed the servants born in his house' the text shifts abruptly to the institution of the tithe. A fuller underlying narrative likely stood here.
    reason: segmentation_note
  - marker: '24'
    text: '''The first tithe'' could also be rendered ''the chief tithe'' or understood as an initial tithe associated with first produce; the Ge''ez wording is unusual.'
    reason: lexical_alternative
  - marker: a
    text: Or 'he imposed the first tithe'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 도망쳐 온 한 사람이 와서 아브람에게 그의 형제의 아들이 사로잡혔다고 알렸습니다. 아브람은 자기 집에서 태어난 종들을 무장시켰습니다. … 아브람과 그의 씨에게는 여호와를 위한 첫 십일조가 있고, 여호와께서는 그것을 영구한 규례로 세우셔서, 그들이 그분 앞에서 수종드는 제사장들에게 그것을 주게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዚድኅነ፡
  english_pob_choice: one who had escaped
  chosen_korean: 도망쳐 온 한 사람
  alternatives_korean:
  - 달아난 사람
  - 탈출한 사람
  lexicon: Geez ድኅነ- (escape)
  rationale: 도망쳐 온이라는 표현이 급박한 도주 상황을 자연스럽게 살리며, 본문이 특정 신분보다 ‘살아남아 빠져나온 자’를 지칭함을 드러냅니다.
- source_word: ተፄወወ፡ ወልደ፡ እኁሁ
  english_pob_choice: his brother’s son had been taken captive
  chosen_korean: 그의 형제의 아들이 사로잡혔다
  alternatives_korean:
  - 그의 형제의 아들이 포로로 끌려갔다
  - 그의 형제의 아들이 붙잡혔다
  lexicon: Geez 사로잡힘/포로 상태 어휘
  rationale: 사로잡혔다가 포로로 잡힌 상태를 간결하게 전달하며, 영어 POB의 taken captive를 과도하게 해석하지 않습니다.
- source_word: ዐሥራተ፡ ቀዳሚ፡
  english_pob_choice: the first tithe
  chosen_korean: 첫 십일조
  alternatives_korean:
  - 첫 번째 십일조
  - 첫 몫의 십일조
  - 주된 십일조
  lexicon: Geez ዐሥርተ / tithe terminology
  rationale: ‘first tithe’를 문자적으로 옮기되, POB 주석이 지적한 ‘chief/initial tithe’의 잠재적 의미를 보존할 수 있는 가장 직역적인 현대 한국어로 잡았습니다.
- source_word: ለካህናት፡ ለእለ፡ ይትቀነዩ፡ ቅድሜሁ
  english_pob_choice: to the priests who minister before him
  chosen_korean: 그분 앞에서 수종드는 제사장들에게
  alternatives_korean:
  - 그 앞에서 섬기는 제사장들에게
  - 그분 앞에 서서 봉사하는 제사장들에게
  lexicon: Geez 제사장 직분 및 봉사 동사
  rationale: ‘수종들다’는 제사장의 예배적 봉사를 자연스럽게 담아내며, ‘before him’의 방향성도 보존합니다.
theological_decisions:
- issue: 본문의 절이 축약되어 있고 ‘첫 십일조’ 진술이 서술적으로 갑자기 등장함
  chosen_reading: 현행 본문을 따라 ‘아브람과 그의 씨에게는 … 있다’는 서술형으로 옮겼습니다.
  alternative_readings:
  - ‘아브람과 그의 씨에게 … 부과하셨다’
  - ‘아브람과 그의 씨에게 … 정하셨다’
  rationale: 게에즈 본문은 동사가 생략된 계사문으로 읽히므로, 임의의 행위 주어를 넣기보다 존재/규정 진술로 처리하는 것이 원문에 더 가깝습니다.
  doctrine_reference: 본문비평 및 문법적 절 구조
- issue: 여호와 명칭과 제사장 봉사 문맥
  chosen_reading: 주석 없이 본문에 ‘여호와’를 사용하고, 제사장들의 봉사를 여호와 앞에서의 봉사로 유지했습니다.
  alternative_readings:
  - ‘주’
  - ‘하나님’
  rationale: 게에즈 원문이 Ἰαχ베/יהוה에 상응하는 신명을 가리키며, 본문 자체가 제사장 직무를 언약적 질서 안에 두고 있기 때문에 ‘여호와’가 가장 명시적입니다.
  doctrine_reference: 신명 표기 및 성전/제사장 제도
