lexical_decisions:
- source_word: ኢይትኍለቍ
  english_pob_choice: will be innumerable
  chosen_korean: 헤아릴 수 없을 것입니다
  alternatives_korean:
  - 셀 수 없을 것입니다
  - 무수할 것입니다
  lexicon: source_note
  rationale: 양이 셀 수 없이 많다는 뜻을 한국어에서 자연스럽고 출판 가능한 형태로 옮겼습니다. “헤아릴 수 없다”는 단순 수량 초과를 잘 드러냅니다.
- source_word: ተንሥእ
  english_pob_choice: Rise
  chosen_korean: 일어나
  alternatives_korean:
  - 일어나십시오
  - 일어서
  lexicon: source_note
  rationale: 직접 명령형을 반영하되, 이어지는 순행 명령들과 함께 자연스럽게 읽히도록 간결하게 옮겼습니다.
- source_word: አንሶሱ፡ ውስተ፡ ምድር፡ ውስተ፡ ኑኃ፡ ወርኅባ፡ ወርኢ፡ ኵሎ
  english_pob_choice: walk through the land in its length and its breadth, and see it all
  chosen_korean: 그 땅을 길이와 너비로 걸어 다니며 그것을 모두 보십시오
  alternatives_korean:
  - 그 땅을 길이와 너비로 두루 다니며 그것을 모두 보십시오
  - 그 땅을 길이와 너비로 지나가며 그것을 다 보십시오
  lexicon: source_note
  rationale: ‘길이와 너비’라는 공간적 대비를 유지했고, ‘walk through’는 단순히 지나가는 것보다 계속 둘러보는 뜻이 있어 ‘걸어 다니며’로 옮겼습니다.
theological_decisions:
- issue: 문장 첫머리의 “그 수는 헤아릴 수 없을 것입니다”가 앞절의 맥락을 전제하는지 여부
  chosen_reading: 현재 절 자체의 독립된 진술로 유지했습니다.
  alternative_readings:
  - 앞절과 연결해 ‘너의 자손은 헤아릴 수 없을 것입니다’처럼 보충하는 방식
  rationale: 제공된 소스와 영어 POB가 이 절에서만 해당 문구를 제시하므로, 본문에 없는 보충어를 덧붙이지 않고 원문 범위 안에서 번역했습니다.
  doctrine_reference: source fidelity
- issue: 명령형의 높임 정도
  chosen_reading: 하나님께 직접 말하는 존대 체계 없이, 서술적 명령형을 현대 합쇼체로 유지했습니다.
  alternative_readings:
  - ‘일어나십시오… 보십시오’처럼 더 직접적인 공손 명령형
  rationale: 이 구절은 화자가 청자에게 지시하는 장면이므로, 한국어 본문에서는 과도한 종교적 경어를 피하고 표준적인 명령-청유형으로 전달했습니다.
  doctrine_reference: register preservation
