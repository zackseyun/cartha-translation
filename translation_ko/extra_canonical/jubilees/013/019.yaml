  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
  footnotes:
  - marker: a
    text: Or 'eastward,”'.
    reason: previous_rendering
translation:
  language: ko
  text: 롯이 사로잡혔던 그 해, 롯이 아브람에게서 떠난 뒤, 이 주간의 넷째 해에 주님께서 아브람에게 말씀하셨습니다. “네가 거주하고 있는 곳에서 눈을 들어 북쪽과 남쪽과 서쪽과 동쪽을 바라보십시오,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: יהוה / κύριος
  rationale: Ge'ez 본문의 신명칭을 영어 POB의 'the LORD'에 맞추되, 한국어 본문에서는 직접 호칭보다 서술체에 자연스러운 '주님'을 택했습니다. 이 본문은 야훼 표기를 본문에 직접 넣기보다 영어 POB의 일반 서술을 따라 가독성을 우선했습니다.
- source_word: ተፄወወ፡ ሎጥ፡
  english_pob_choice: when Lot had been taken captive
  chosen_korean: 롯이 사로잡혔을 때
  alternatives_korean:
  - 롯이 포로로 잡혔을 때
  - 롯이 붙잡혀 갔을 때
  lexicon: שבה / αἰχμαλωτίζω
  rationale: 사로잡히다/사로잡혔다는 표현이 포로 상태를 가장 직접적으로 드러내며, 문맥상 전쟁 포로의 상황을 자연스럽게 전달합니다.
- source_word: ተፈልጠ፡ እምኔሁ፡ ሎጥ፡
  english_pob_choice: after Lot had separated from him
  chosen_korean: 롯이 그에게서 떠난 뒤에
  alternatives_korean:
  - 롯이 그와 분리된 뒤에
  - 롯이 그에게서 갈라진 뒤에
  lexicon: נפרד / ἀποχωρίζω
  rationale: ‘떠나다’는 한국어에서 관계의 분리를 가장 자연스럽게 표현하며, 아브람과 롯의 이별이라는 서술을 과장 없이 반영합니다.
- source_word: አንሥእ፡ አዕይንቲከ፡
  english_pob_choice: Lift up your eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 올려
  - 시선을 들어
  lexicon: נשא עיניים
  rationale: 관용구적 표현을 살려 직역에 가깝게 옮겼고, 명령형의 힘을 유지하면서도 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: መንገለ፡ ሰሜን፡ ወሌብ፡ ወባሕር፡ ወጽባሕ፡
  english_pob_choice: northward and southward and westward and eastward
  chosen_korean: 북쪽과 남쪽과 서쪽과 동쪽을 바라보십시오
  alternatives_korean:
  - 북쪽과 남쪽과 서쪽과 동쪽을 향하십시오
  - 북쪽과 남쪽과 서쪽과 동쪽을 보십시오
  lexicon: ארבע רוחות / direction list
  rationale: 방향 열거를 그대로 보존하되, 뒤의 동사 '바라보십시오'를 보충하여 한국어 문장이 완결되도록 했습니다. 영어 POB의 열거도 한국어에서 동일하게 유지했습니다.
theological_decisions:
- issue: 주님의 호칭을 야훼로 직접 표기할지 여부
  chosen_reading: 본문에는 '주님'을 사용했습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 구절은 서술형 내레이션 안의 신명칭이므로, 한국어 본문에서는 자연스러운 서술 호칭인 '주님'을 택했고, 별도의 OT 인용 맥락이 아니므로 야훼 본문 표기는 보류했습니다.
  doctrine_reference: 신명칭 표기와 경건어 선택의 균형
- issue: 인용문 종결 처리
  chosen_reading: 본문을 다음 절로 이어지는 직접화법으로 열어 두었습니다.
  alternative_readings:
  - 이 절 끝에 닫는 따옴표를 넣어 종결
  rationale: 영어 POB 수정 이력상 13:19의 직접화법은 13:20로 이어지므로, 한국어도 절 경계에서 인용을 닫지 않고 열어 두는 편이 원문 흐름을 더 정확히 반영합니다.
  doctrine_reference: 문단/절 경계와 직접화법 연속성
