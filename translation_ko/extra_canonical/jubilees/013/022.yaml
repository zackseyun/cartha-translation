  text: for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,
translation:
  language: ko
  text: “나는 그것을 네 자손에게 주겠소.” 아브람은 헤브론으로 가서 거기서 살았습니다. 그리고 이 해에 엘람의 왕 케돌라오메르와 시날의 왕 아므라펠과 엘라살의 왕 아리옥이 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  english_pob_choice: I will give it
  chosen_korean: “나는 그것을 … 주겠소.”
  alternatives_korean:
  - “내가 그것을 … 주겠습니다.”
  - “그것을 … 주리라.”
  lexicon: Geʽez እሁብ corresponds to a first-person future/intentive verb of giving.
  rationale: 직접적인 약속의 미래형을 살리되, 예언적·서술적 문맥에 맞게 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: ለዘርእከ
  english_pob_choice: to your seed
  chosen_korean: “네 자손에게”
  alternatives_korean:
  - “네 씨에게”
  - “네 후손에게”
  lexicon: Geʽez ዘርእ means seed/offspring/descendants.
  rationale: 성경적 약속 공식의 핵심어인 ‘seed’를 문맥에 맞게 ‘자손’으로 옮겨, 출산적·언약적 의미를 함께 유지했습니다.
- source_word: ወሖረ አብራም ኬብሮን ወኀደረ ህየ
  english_pob_choice: And Abram went to Hebron and settled there
  chosen_korean: 아브람은 헤브론으로 가서 거기서 살았습니다.
  alternatives_korean:
  - 아브람은 헤브론으로 가서 거기 머물렀습니다.
  - 아브람은 헤브론으로 가서 거기 정착했습니다.
  lexicon: Geʽez verbs of going and dwelling are straightforward narrative actions.
  rationale: ‘거기서 살았습니다’는 단순 체류보다 거주·정착의 의미를 무리 없이 담아 서술 흐름에 맞췄습니다.
- source_word: ኮዶላጎሞር / አማርፍል / አሪኦክ
  english_pob_choice: Chedorlaomer / Amraphel / Arioch
  chosen_korean: 케돌라오메르 / 아므라펠 / 아리옥
  alternatives_korean:
  - 그돌라오멜 / 아므라팔 / 아리오크
  lexicon: Proper names are transliterated according to established Korean biblical forms where available, otherwise by modern phonetic rendering.
  rationale: 인명은 한국어 성경 관용형을 우선하고, 확립형이 약한 경우 현대 표기 관행에 맞춰 음역했습니다.
theological_decisions:
- issue: Promise language for Abraham's descendants
  chosen_reading: “네 자손에게 주겠소”로 언약적 약속을 분명히 드러냈습니다.
  alternative_readings:
  - 단순 과거적 서술로 완화하는 번역
  - “씨”를 직역해 비유적 긴장을 강하게 유지하는 번역
  rationale: 이 구절은 앞선 약속의 반복이므로, 미래의 확정적 약속으로 읽히는 원문 힘을 살리는 것이 중요합니다.
  doctrine_reference: 언약과 약속의 지속성
- issue: Register in quoted divine speech
  chosen_reading: 인용문 안에서는 하나님이 직접 말씀하시는 약속이므로 ‘주겠소’로 경어를 유지했습니다.
  alternative_readings:
  - 평서형 ‘줄 것이다’
  - 더 고전적인 ‘주리라’
  rationale: 현대 한국어 합쇼체에서 직접 화자의 권위와 공손성을 함께 드러내기 위한 선택입니다.
  doctrine_reference: 직접 인용의 화자 표지
