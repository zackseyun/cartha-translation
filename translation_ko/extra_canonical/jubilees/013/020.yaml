translation:
  language: ko
  text: 네가 보는 모든 땅을 내가 너와 네 씨에게 영원히 주겠습니다. 또 내가 네 씨를 바닷가의 모래처럼 많게 하겠습니다. 사람이 땅의 티끌을 셀 수 있다면, 네 씨도 셀 수 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵላ፡ ምድር፡ እንተ፡ ትሬኢ፡
  english_pob_choice: all the land that you see
  chosen_korean: 네가 보는 모든 땅
  alternatives_korean:
  - 네가 볼 수 있는 모든 땅
  - 네가 바라보는 모든 땅
  lexicon: source phrase
  rationale: ‘보는’은 현재 시각으로 실제로 눈에 들어오는 범위를 자연스럽게 옮기며, 과도한 의역 없이 땅의 범위를 분명히 드러냅니다.
- source_word: ወለዘርእከ፡ እሁብ፡
  english_pob_choice: I will give to you and to your seed
  chosen_korean: 내가 너와 네 씨에게 영원히 주겠습니다
  alternatives_korean:
  - 내가 너와 네 자손에게 주겠습니다
  - 내가 너와 네 후손에게 주겠습니다
  lexicon: source phrase
  rationale: ‘씨’는 족속/후손을 가리키는 성서적 표현을 보존해, 약속의 계승 구조를 직접적으로 드러냅니다.
- source_word: እስከ፡ ለዓለም፡
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 세세토록
  - 영원토록
  lexicon: source phrase
  rationale: 장기간의 약속을 나타내는 시간 부사를 한국어에서 가장 직역에 가깝고도 자연스럽게 표현했습니다.
- source_word: ከመ፡ ኆፃ፡ ባሕር፡
  english_pob_choice: like the sand of the sea
  chosen_korean: 바닷가의 모래처럼
  alternatives_korean:
  - 바다의 모래처럼
  - 바닷모래처럼
  lexicon: source phrase
  rationale: ‘바닷가의 모래’는 관용적이면서도 원문의 비유를 분명히 살려, 수효의 압도적 많음을 전달합니다.
- source_word: ይክል፡ ሰብእ፡ ኍልቆ፡ ኆፃ፡ ምድር፡
  english_pob_choice: if a man can count the dust of the earth
  chosen_korean: 사람이 땅의 티끌을 셀 수 있다면
  alternatives_korean:
  - 사람이 땅의 먼지를 셀 수 있다면
  - 어떤 사람이 땅의 티끌을 셀 수 있다면
  lexicon: source phrase
  rationale: ‘티끌’은 ‘dust of the earth’의 매우 작은 입자감을 살리면서, 바로 뒤의 ‘셀 수 있다’와도 자연스럽게 맞물립니다.
- source_word: ወዘርእከኒ፡
  english_pob_choice: then your seed also
  chosen_korean: 네 씨도
  alternatives_korean:
  - 네 자손도
  - 네 후손도
  lexicon: source phrase
  rationale: 문맥상 다음 절의 ‘셀 수 있습니다’와 이어지는 미완결 연결을 유지하기 위해, POB 개정 취지를 따라 동사를 덧붙이지 않고 간결하게 남겼습니다.
theological_decisions:
- issue: ‘씨’의 집단적-언약적 의미 보존
  chosen_reading: ‘씨’를 사용해 아브라함 언약의 집단적 후손 개념을 그대로 드러냈습니다.
  alternative_readings:
  - ‘자손’으로 평이하게 풀어쓰기
  - ‘후손’으로 중립화
  rationale: 이 절은 개인 혈통보다 언약의 계승자를 가리키므로, 성서적 용례가 강한 ‘씨’가 원문의 신학적 함의를 가장 잘 보존합니다.
  doctrine_reference: 언약 신학, 창세기 12:7 / 15:5의 약속 연속성
- issue: 절 경계상 마지막 절구의 개방성 유지
  chosen_reading: 끝의 ‘네 씨도’를 완결된 문장으로 닫지 않고 다음 절과 연결되도록 두었습니다.
  alternative_readings:
  - ‘네 씨도 셀 수 있습니다’로 완결
  - ‘네 씨도 셀 수 없을 것입니다’로 미리 보강
  rationale: 주어진 원문은 다음 절에서 부정형 동사로 이어지므로, 20절에서 긍정 동사를 보충하면 절 경계를 흐리게 됩니다. 따라서 미완결 연결을 유지하는 것이 더 충실합니다.
  doctrine_reference: 본문 분절 보존, 인접 절 연속성
