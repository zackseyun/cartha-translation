  text: 노아가 술기운에서 깨어나 자기의 막내아들이 자기에게 한 모든 일을 알고, 그의 아들을 저주하며 말하였습니다. “가나안은 저주를 받아 그의 형제들에게 비천한 종[a]이 될 것입니다.”
