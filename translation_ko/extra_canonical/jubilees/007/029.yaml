  text: And in the fifth year make the release[a], so that you may release it in righteousness and uprightness, and you will be righteous, and all your planting will prosper.
  footnotes:
  - marker: a
    text: The command about the fifth year is difficult. 'Make the release' renders a term of letting go or leaving off, likely an agricultural practice tied to the preceding firstfruits legislation.
    reason: alternative_reading
    anchor_ref: '7:29'
  - marker: b
    text: Or 'and all your planting will be righteous and prosperous.'.
    reason: previous_rendering
