revisions:
- from: 삼 년 동안은 먹은 모든 열매를 거두지 못하리라. 넷째 해에는 그 열매를 거두어 천지와 만물을 창조하신 지극히 높으신 주님 앞에 기쁘게 받으실 첫 열매를 드릴 것이니라 그들은 첫 포도주와 기름을 첫 열매로 그것을 받는 주님의 제단에 넉넉히 바쳐야 합니다. 남은 것은 주님의 성전의 종들이 그것을 받는 제단 앞에서 먹을지니라.
  to: 먹을 수 있는 모든 것의 열매는 삼 년 동안 거두지 마십시오. 넷째 해에는 그 열매를 거두고, 하늘과 땅과 만물을 창조하신 지극히 높으신 주님 앞에 받아들여질 첫 열매를 바치십시오. 그들은 첫 포도주와 기름을 첫 열매로 풍성히, 그것을 받으시는 주님의 제단에 바쳐야 합니다. 남은 것은 주님의 집의 종들이 그것을 받는 제단 앞에서 먹어야 합니다.
  rationale: 핵심적인 범위 표현을 ‘먹을 수 있는 모든 것의 열매’로 바로잡고, 원문의 ‘주님의 집’을 보존했으며, 모든 문장을 합쇼체로 통일했습니다. 영어 본문의 ‘제단 … who receives it’에 내재한 수식의 어색함은 원문의 수령 주체가 주님임을 반영하여 ‘그것을 받으시는 주님의 제단’으로 명료하게 옮겼습니다.
