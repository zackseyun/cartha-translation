    rationale: 목적격 조사 ‘를’은 여기서 성립하지 않으며, 원문의 ‘the LORD, the God of Shem’은 동격으로 처리되어야 합니다.
  - severity: high
    issue: ‘셈의 하나님 주님를 찬송하리로다’는 원문의 축복 선언을 부정확하고 부자연스럽게 옮깁니다.
    rationale: 원문은 ‘셈의 하나님이신 주님은 복되시다/찬송을 받으시다’라는 선언이며, 화자가 주님을 찬송하겠다는 뜻이 아닙니다.
  - severity: medium
    issue: ‘가나안은 셈의 종이 되게 하시기를 원하노라’는 주체가 불명확하고 현대 합쇼체에 맞지 않습니다.
    rationale: 원문은 가나안이 셈의 종이 되기를 바라는 기원입니다. ‘바랍니다’로 옮기면 현대적 정중체와 기원법을 함께 살릴 수 있습니다.
  revised_text: 그리고 셈을 축복하여 말씀하셨습니다. “셈의 하나님이신 주님은 찬송을 받으시며, 가나안은 셈의 종이 되기를 바랍니다.”
