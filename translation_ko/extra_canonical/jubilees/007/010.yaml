  naturalness: 초안의 ‘주님를’이라는 조사 오류와 ‘찬송하리로다’의 부자연스러운 주어·서술어 관계를 바로잡고, 현대 한국어 합쇼체로 다듬었습니다.
  terminology: LORD는 문맥상 ‘주님’으로, ‘slave’는 본문의 종속 관계를 반영하여 ‘종’으로 옮겼습니다. ‘그의’가 가리키는 대상을 셈으로 명시해 자연스럽고 분명하게 했습니다.
  issues:
