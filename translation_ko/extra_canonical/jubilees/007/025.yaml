  text: The thoughts and desires of man imagine what is vain and evil continually, and the Lord destroyed everything from the face of the earth because of the evil of their deeds and because of blood.
  footnotes:
  - marker: a
    text: Or 'are evil continually'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람의 생각과 욕구는 늘 헛되고 악한 것을 상상합니다. 주님께서는 그들의 악한 행위와 피 때문에 땅의 얼굴에서 모든 것을 멸하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ፡
  english_pob_choice: The thoughts and desires of man
  chosen_korean: 사람의 생각과 욕구
  alternatives_korean:
  - 사람의 생각과 뜻
  - 사람의 사고와 욕망
  lexicon: thoughts/desires
  rationale: ‘ሕሊና’는 생각·마음의 작용을, ‘ፈቃዱ’는 욕구·의지를 가리키므로 두 요소를 분리해 옮겼습니다.
- source_word: ይኄሊ፡ ከንተ፡ ወእኩየ፡ በኵሉ፡ መዋዕል።
  english_pob_choice: imagine what is vain and evil continually
  chosen_korean: 늘 헛되고 악한 것을 상상합니다
  alternatives_korean:
  - 항상 헛되고 악한 것을 생각합니다
  - 늘 헛된 것과 악을 떠올립니다
  lexicon: imagine / vain / evil continually
  rationale: 동사 ‘ይኄሊ’는 단순한 존재 상태가 아니라 ‘상상하다/생각하다’의 의미가 있어 이를 살렸고, ‘ከንተ’의 ‘헛되다/공허하다’를 반영했습니다.
- source_word: ወደምሰሰ፡ እግዚአብሔር፡ ኵሎ፡ እም ፳፰ ገጸ፡ ምድር፡
  english_pob_choice: and the Lord destroyed everything from the face of the earth
  chosen_korean: 주님께서는 그들의 악한 행위와 피 때문에 땅의 얼굴에서 모든 것을 멸하셨습니다
  alternatives_korean:
  - 주님께서 땅의 얼굴에서 모든 것을 멸하셨습니다
  - 주님께서는 온 땅 위의 모든 것을 멸하셨습니다
  lexicon: destroyed everything / from the face of the earth
  rationale: ‘መሰሰ’의 파괴·멸절 의미를 반영하되, 뒤의 이유절을 함께 살려 문맥상 멸망의 근거를 분명히 했습니다.
- source_word: በእንተ፡ እኩይ፡ ምግባሮሙ፡ ወበእንተ፡ ደም፡
  english_pob_choice: because of the evil of their deeds and because of blood
  chosen_korean: 그들의 악한 행위와 피 때문에
  alternatives_korean:
  - 그들의 악한 행위와 피 흘림 때문에
  - 그들의 악행과 피 때문에
  lexicon: because of blood
  rationale: ‘피’는 단순한 물질이 아니라 살인·유혈의 죄를 가리키는 표현으로, 본문이 요구하는 원인적 의미를 간명하게 옮겼습니다.
theological_decisions:
- issue: 인간의 내면 상태를 ‘are evil’로 고정할지, ‘think/imagine vain and evil’로 옮길지
  chosen_reading: ‘사람의 생각과 욕구는 늘 헛되고 악한 것을 상상합니다’로 옮겨, 내면의 지속적 상상과 의향을 드러냈습니다.
  alternative_readings:
  - 사람의 생각과 욕구는 늘 악합니다
  - 사람은 늘 헛되고 악한 것을 생각합니다
  rationale: 게에즈 본문은 단순한 상태 진술보다 인간 내면의 지속적 사고·상상을 말하므로, 이를 평탄화하지 않고 유지하는 것이 더 충실합니다.
  doctrine_reference: 인간의 전적 타락을 직접 교리화하기보다 본문의 서술 강도를 보존함
