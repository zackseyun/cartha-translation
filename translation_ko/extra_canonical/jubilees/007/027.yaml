base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/027.yaml
  text: 'My children, [love] one another. For I see, and behold, the demons have begun to sin against you and against your children, and now I fear for you, that after my death you will shed the blood of men on the earth, and you yourselves will be destroyed from the face of the earth. For everyone who sheds the blood of man[a], and everyone who eats the blood of any flesh, will all be destroyed from the earth. And no man who eats blood, or who sheds the blood of man on the earth, will be left; neither seed nor descendants will remain to him under heaven. For into Sheol they will go, and into the place of judgment they will descend, and into the darkness of the deep they will all enter by a violent death. Let no blood appear upon you from all the blood there is in all the days in which you slaughter any beast or cattle or whatever creeps on the earth; and do a good work for your souls by covering with earth that which has been poured out on the face of the earth. And do not be like one who
    eats with the blood, but be strong not to eat blood before you; cover the blood, for thus I have been commanded to testify to you and to your children, together with all flesh. And do not eat the life with the flesh, so that your blood, which is your life, may not be required from the hand of any flesh that sheds it on the earth. For the earth will not be cleansed from the blood that has been poured out upon it, except by the blood of the one who poured it out will the earth be cleansed throughout all its generations. And now, my children, listen: do justice and righteousness, so that you may be planted in righteousness over the face of the whole earth, and your glory may be lifted up before my God, who saved me from the waters of the flood. And behold, go and build for yourselves cities, and plant in them every plant that is on the earth, and every fruit-bearing tree.'
  footnotes:
  - marker: a
    text: The long instruction on blood, homicide, and agricultural firstfruits is compressed into a single extended verse in the surviving row data, though it likely reflects multiple verse units in fuller editions.
    reason: segmentation_note
    anchor_ref: '7:27'
  - marker: b
    text: Or 'For everyone who sheds the blood of man'.
    reason: previous_rendering
translation:
  language: ko
  text: '내 자녀들아, [서로 사랑하십시오]. 내가 보니, 보십시오, 악한 영들이 너희와 너희 자녀들에게 죄를 짓기 시작하였습니다. 이제 나는 너희를 염려합니다. 내가 죽은 뒤에 너희가 땅 위에서 사람의 피를 흘리고, 너희 자신도 땅에서 멸망할까 두렵기 때문입니다. 사람의 피를 흘리는 자[a]와 어떤 육체의 피든 먹는 자는 모두 땅에서 멸망할 것입니다. 피를 먹거나 땅 위에서 사람의 피를 흘리는 사람은 아무도 남지 않을 것이며, 하늘 아래 그에게는 씨도 후손도 남지 않을 것입니다. 그들은 스올로 들어가고, 심판의 장소로 내려가며, 모두 폭력적인 죽음으로 깊은 어둠 속에 들어갈 것입니다.


    너희가 짐승이나 가축이나 땅 위를 기어 다니는 어떤 것을 잡는 모든 날에, 그 모든 피에 대하여 너희에게 피 흘린 죄가 없게 하십시오. 땅 위에 흘린 피를 흙으로 덮어 너희 자신을 위하여 선한 일을 하십시오. 피와 함께 먹는 자처럼 되지 말고, 피를 먹지 않도록 굳게 힘쓰십시오. 피를 덮으십시오. 이렇게 하도록 내가 너희와 너희 자녀들에게, 모든 육체에 관하여 명령하였습니다. 생명, 곧 피를 육체와 함께 먹지 마십시오. 그러면 땅 위에서 피를 흘리는 어떤 육체의 손이 너희의 생명인 너희 피에 대한 책임을 묻지 못할 것입니다. 땅은 그 위에 흘린 피 때문에 정결해지지 않으며, 그 피를 흘린 자의 피로써만, 그 모든 세대에 걸쳐 정결해질 것입니다.


    이제 내 자녀들아, 들으십시오. 정의와 의를 행하십시오. 그러면 너희가 온 땅 위에 의 안에서 심길 것이며, 홍수의 물에서 나를 구원하신 나의 하나님 앞에서 너희의 영광이 높아질 것입니다. 보십시오, 가서 너희를 위하여 성읍들을 세우고, 그 안에 땅 위의 모든 식물과 열매 맺는 모든 나무를 심으십시오. 먹을 수 있는 모든 것 가운데서도 그 열매는 삼 년 동안 먹지 않은 것으로 두십시오. 넷째 해에는 그 열매를 먹되, 하늘과 땅과 만물을 지으신 지극히 높으신 주님 앞에 바칠 첫 열매를 올리십시오. 첫 열매의 포도주와 기름을 주님의 제단에 올리십시오. 주님께서 받으신 뒤에 남은 것은 주님의 집 앞뜰에서 먹으십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 행 자료에서는 피, 살인, 첫 열매에 관한 긴 지시가 하나의 확장된 절로 이어지지만, 더 완전한 판본들에서는 여러 절 단위에 해당할 가능성이 있습니다.
    reason: segmentation_note; 제공된 게에즈 본문의 확장된 단위를 번역문에 보존했음을 설명합니다.
lexical_decisions:
- source_word: አውሉድየ፡
  english_pob_choice: My children
  chosen_korean: 내 자녀들아
  alternatives_korean:
  - 내 아이들아
  - 내 자녀들이여
  lexicon: Ge'ez vocative
  rationale: 호격의 친밀한 부름을 살리되, 현대 한국어에서 자연스럽고 공적 문체에 맞는 ‘자녀들아’를 선택했습니다.
- source_word: አጋንንት፡
  english_pob_choice: the demons
  chosen_korean: 악귀들
  alternatives_korean:
  - 귀신들
  - 악마들
  lexicon: Ge'ez demon term
  rationale: 문맥상 인간을 해치고 죄를 유발하는 초자연적 악한 존재를 가리키므로 ‘악귀들’이 가장 직접적입니다.
- source_word: ኵሉ፡ ዘይክዑ፡ ደመ፡ ሰብእ፡
  english_pob_choice: everyone who sheds the blood of man
  chosen_korean: 사람의 피를 흘리는 자
  alternatives_korean:
  - 사람의 피를 흘리는 사람
  - 사람의 피를 흘리는 자마다
  lexicon: Ge'ez idiom for bloodshed
  rationale: 반복되는 법적 경고의 문맥을 따라 간결한 주어형으로 옮겼고, ‘흘리다’는 살해를 직접적으로 드러냅니다.
- source_word: ምድር / ውስተ ገጸ ምድር
  english_pob_choice: the earth / from the face of the earth
  chosen_korean: 땅 / 땅의 얼굴에서
  alternatives_korean:
  - 땅 위에서
  - 지면에서
  lexicon: Ge'ez earth-face formula
  rationale: 원문 반복의 관용구를 살리기 위해 ‘땅의 얼굴’이라는 직역을 유지했습니다. 다만 첫 번째는 자연스러운 ‘땅’으로 처리했습니다.
theological_decisions:
- issue: 보호 명령의 핵심 표현인 혈금지 규정
  chosen_reading: ‘피를 먹지 마십시오’와 ‘피를 덮으십시오’를 모두 살려, 단순 식규범이 아니라 생명은 하나님께 속한다는 금지의 무게를 드러냈습니다.
  alternative_readings:
  - ‘피를 먹지 말라’로 완화
  - ‘피를 가리라’ 정도로 축소
  rationale: 문맥이 반복적으로 살인과 동물의 피 섭취를 함께 금지하므로, 두 명령을 분리해 번역하는 것이 신학적 긴장과 법적 강도를 보존합니다.
  doctrine_reference: 창 9:4-6, 레 17:10-14
- issue: ‘정의와 의’를 병렬로 유지
  chosen_reading: ‘정의와 의를 행하십시오’로 번역해 두 명사의 병렬을 유지했습니다.
  alternative_readings:
  - ‘공의와 의’
  - ‘정직과 의’
  rationale: 원문은 서로 다른 두 덕목을 나란히 제시하므로, 하나로 흡수하지 않고 구분을 유지해야 합니다.
  doctrine_reference: 성경의 쌍어법과 언약적 윤리
