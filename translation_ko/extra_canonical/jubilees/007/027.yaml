- from: 내 자녀들아, 서로 사랑하십시오. 내가 보니, 보라, 악귀들이 너희와 너희 자녀들을 향해 죄 짓기 시작했습니다. 이제 나는 너희를 두려워합니다. 내 죽음 뒤에 너희가 땅에서 사람들의 피를 흘리게 되고, 너희 자신도 땅의 얼굴에서 멸망할 것이기 때문입니다. 사람의 피를 흘리는 자와[a] 모든 육체의 피를 먹는 자는 모두 땅에서 멸망할 것입니다. 사람의 피를 먹는 사람과 땅에서 사람의 피를 흘리는 사람은 아무도 남지 않을 것이며, 하늘 아래에서 그에게는 씨도 후손도 남지 않을 것입니다. 그들이 스올로 들어갈 것이고, 심판의 곳으로 내려갈 것이며, 깊은 어둠 속으로 그들 모두가 폭력적인 죽음으로 들어갈 것입니다. 너희가 땅 위에 쏟아 놓은 모든 피에 대하여, 짐승이나 가축이나 땅 위를 기어 다니는 것 가운데 아무것이나 죽일 때에는 너희 위에 피가 나타나지 않게 하십시오. 흙으로 덮어, 땅의 얼굴에 쏟아진 것을 가려 두는 일로 너희 영혼을 위해 선한 일을 하십시오. 피와 함께 먹는 자처럼 되지 말고, 너희 앞에서 피를 먹지 않도록 힘쓰십시오. 피를 덮으십시오. 나는 이 일로 너희와 너희 자녀들, 그리고 모든 육체와 함께 증언하도록 명령받았기 때문입니다. 생명을 육체와 함께 먹지 마십시오. 그러면 땅 위에서 그것을 흘리는 모든 육체의 손에서 너희의 피, 곧 너희의 생명이 요구되지 않을 것입니다. 땅 위에 쏟아진 피는, 그것을 쏟아 놓은 자의 피로 말미암지 않고는, 그 세대마다 깨끗하게 되지 않을 것입니다. 이제 내 자녀들아, 들으십시오. 정의와 의를 행하십시오. 그러면 너희는 온 땅의 얼굴 위에서 의 안에 심기고, 홍수의 물에서 나를 구원하신 내 하나님 앞에서 너희의 영광이 높아질 것입니다. 보십시오. 가서 너희를 위해 성읍들을 세우고, 그 안에 땅에 있는 모든 식물과 열매 맺는 모든 나무를 심으십시오.
  to: '내 자녀들아, [서로 사랑하십시오]. 내가 보니, 보십시오, 악한 영들이 너희와 너희 자녀들에게 죄를 짓기 시작하였습니다. 이제 나는 너희를 염려합니다. 내가 죽은 뒤에 너희가 땅 위에서 사람의 피를 흘리고, 너희 자신도 땅에서 멸망할까 두렵기 때문입니다. 사람의 피를 흘리는 자[a]와 어떤 육체의 피든 먹는 자는 모두 땅에서 멸망할 것입니다. 피를 먹거나 땅 위에서 사람의 피를 흘리는 사람은 아무도 남지 않을 것이며, 하늘 아래 그에게는 씨도 후손도 남지 않을 것입니다. 그들은 스올로 들어가고, 심판의 장소로 내려가며, 모두 폭력적인 죽음으로 깊은 어둠 속에 들어갈 것입니다.


    너희가 짐승이나 가축이나 땅 위를 기어 다니는 어떤 것을 잡는 모든 날에, 그 모든 피에 대하여 너희에게 피 흘린 죄가 없게 하십시오. 땅 위에 흘린 피를 흙으로 덮어 너희 자신을 위하여 선한 일을 하십시오. 피와 함께 먹는 자처럼 되지 말고, 피를 먹지 않도록 굳게 힘쓰십시오. 피를 덮으십시오. 이렇게 하도록 내가 너희와 너희 자녀들에게, 모든 육체에 관하여 명령하였습니다. 생명, 곧 피를 육체와 함께 먹지 마십시오. 그러면 땅 위에서 피를 흘리는 어떤 육체의 손이 너희의 생명인 너희 피에 대한 책임을 묻지 못할 것입니다. 땅은 그 위에 흘린 피 때문에 정결해지지 않으며, 그 피를 흘린 자의 피로써만, 그 모든 세대에 걸쳐 정결해질 것입니다.


    이제 내 자녀들아, 들으십시오. 정의와 의를 행하십시오. 그러면 너희가 온 땅 위에 의 안에서 심길 것이며, 홍수의 물에서 나를 구원하신 나의 하나님 앞에서 너희의 영광이 높아질 것입니다. 보십시오, 가서 너희를 위하여 성읍들을 세우고, 그 안에 땅 위의 모든 식물과 열매 맺는 모든 나무를 심으십시오. 먹을 수 있는 모든 것 가운데서도 그 열매는 삼 년 동안 먹지 않은 것으로 두십시오. 넷째 해에는 그 열매를 먹되, 하늘과 땅과 만물을 지으신 지극히 높으신 주님 앞에 바칠 첫 열매를 올리십시오. 첫 열매의 포도주와 기름을 주님의 제단에 올리십시오. 주님께서 받으신 뒤에 남은 것은 주님의 집 앞뜰에서 먹으십시오.'
  rationale: 원문을 우선하여 염려의 대상, 피를 흙으로 덮는 행위, 유혈자가 자기 피로 땅의 유혈을 속/정결하게 한다는 조건을 바로잡았습니다. 영어 POB가 끝나는 지점 뒤에도 제공된 게에즈 원문에 계속되는 농업 및 첫 열매 지시를 번역문에 포함했습니다. 교리적 해석을 덧붙이지 않았고, 첫 동사의 보충성은 대괄호로 유지했습니다.
