translation:
  language: ko
  text: 그는 그 열매를 보관하고, 그 해 일곱째 달에 그것을 거두었습니다. 그리고 그것으로 포도주를 만들어 그릇에 넣고, 다섯째 해의 첫날까지 보관하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓቀበ / ἔθηκε-계열
  english_pob_choice: kept
  chosen_korean: 보관하고
  alternatives_korean:
  - 간직하고
  - 지켜 두고
  - 보존하고
  lexicon: 보관하다
  rationale: 단순한 소유가 아니라 만들어진 포도주를 용기에 넣어 일정 기간 유지하는 행위를 자연스럽게 드러내면서도, 원문의 보존·유지 의미를 살렸습니다.
- source_word: ፍሬሁ
  english_pob_choice: its fruit
  chosen_korean: 그 열매를
  alternatives_korean:
  - 그 열매를
  - 그 과실을
  lexicon: 열매
  rationale: 지시대명사를 살려 원문의 소유 관계를 유지했고, 한국어에서는 ‘열매’가 가장 직접적이고 문맥상 자연스럽습니다.
- source_word: በወርኀ፡ ሳብዕ
  english_pob_choice: in the seventh month
  chosen_korean: 그 해 일곱째 달에
  alternatives_korean:
  - 그 해 일곱째 달에
  - 일곱째 달에
  lexicon: 일곱째 달
  rationale: 연도와 월의 관계를 드러내는 Ge'ez 문맥을 반영해 ‘그 해’를 덧붙였고, 달력 표현은 직역에 가깝게 유지했습니다.
- source_word: እስከ፡ ዕለት፡ ቀዳሚት፡
  english_pob_choice: until the first day
  chosen_korean: 다섯째 해의 첫날까지
  alternatives_korean:
  - 첫날까지
  - 그 첫날까지
  lexicon: 첫날
  rationale: 제공된 최종 수정본이 이 절의 경계를 ‘until the first day’로 확정하므로, 본문은 그 범위에 맞춰 번역하고 ‘다섯째 해의’는 바로 앞의 수식을 자연스럽게 이어 붙였습니다.
theological_decisions:
- issue: 절 경계와 달(月) 언급 여부
  chosen_reading: 본문에는 ‘일곱째 달’까지만 포함하고, 끝맺음은 ‘다섯째 해의 첫날’로 처리했습니다.
  alternative_readings:
  - ‘다섯째 해의 첫날, 첫째 달’로 확장
  - ‘첫달의 첫날’로 보충
  rationale: 제공된 최종 감사 기록이 Ge'ez 본문과 절 경계를 기준으로 ‘first day’까지만 남겨야 한다고 명시하므로, 본문에 없는 ‘첫째 달’은 넣지 않았습니다.
  doctrine_reference: textual-criticism / verse-boundary fidelity
