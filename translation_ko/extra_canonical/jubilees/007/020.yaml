revisions:
- from: 그리고 스물여덟째 희년에는 노아가 자기 아들들의 자녀들에게, 그리고 그가 알고 있는 모든 판결과 규례와 계명에 관해 가르치기 시작했습니다. 그는 자기 자녀들에게 증언하여, 의를 행하고 육체의 수치를 가리고, 자기 창조주를 찬양하며, 아버지와 어머니를 공경하고, 각각 자기 이웃을 사랑하고, 음행과 부정함과 모든 불의에서 자기들의 영혼을 지키라고 하였습니다.[a][b]
  to: 그리고 스물여덟째 희년에 노아는 자기 아들들의 자녀들에게 규례와 계명을, 또 자기가 알고 있는 모든 판결[a]을 명하기 시작했습니다. 그는 자기 자녀들에게 증언하여, 의를 행하고 자기들의 육체의 수치를 가리며, 그들을 지으신 분을 찬송하고[b], 아버지와 어머니를 공경하며, 서로 이웃을 사랑하고, 음행과 부정함과 모든 불의에서 자기들의 영혼을 지키라고 하였습니다.
  rationale: 원문의 명령 동사, ‘자기가 알고 있는’의 수식 범위, 규례·계명·판결의 구조를 회복했습니다. ‘서로 이웃을 사랑하다’로 자연스러운 현대 한국어를 사용하되 상호성을 유지했고, 각주를 관련 어휘에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
