  - severity: medium
    issue: ‘가르치기 시작했습니다’가 ‘명하기 시작했습니다’보다 약합니다.
    rationale: ይእዘዝ는 명하다/지시하다의 뜻이며, 이 절의 규범적 권면 성격상 ‘명하다’가 더 충실합니다.
  - severity: low
