base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/020.yaml
  text: And in the twenty-eighth jubilee, Noah began to command the ordinances and the commandments to his children's children, and all the judgments[a] that he knew. And he testified to his children that they should do righteousness, and cover the shame of their flesh, and bless their Creator,[b] and honor father and mother, and love each one his neighbor, and guard their souls from fornication and uncleanness and all iniquity.
  footnotes:
  - marker: a
    text: Or "justice".
    reason: lexical_choice
  - marker: b
    text: Lit. "the one who created them".
    reason: literal_translation
translation:
  language: ko
  text: 그리고 스물여덟째 희년에 노아는 자기 아들들의 자녀들에게 규례와 계명을, 또 자기가 알고 있는 모든 판결[a]을 명하기 시작했습니다. 그는 자기 자녀들에게 증언하여, 의를 행하고 자기들의 육체의 수치를 가리며, 그들을 지으신 분을 찬송하고[b], 아버지와 어머니를 공경하며, 서로 이웃을 사랑하고, 음행과 부정함과 모든 불의에서 자기들의 영혼을 지키라고 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “정의”.
    reason: ፍትሐ는 이 문맥에서 법적 ‘판결’로 이해될 수 있으나 ‘정의’라는 의미도 가능합니다.
  - marker: b
    text: 직역하면 “그들을 지으신 분”.
    reason: 원문의 관계 표현을 밝혀, ‘창조주’라는 자연스러운 표현이 지닌 압축을 보완합니다.
lexical_decisions:
- source_word: ፍትሐ
  english_pob_choice: judgments
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 정의
  - 법도
  lexicon: Leslau
  rationale: English POB가 이 항목을 법정·규범 영역의 복수 개념인 judgments로 잡았으므로, 문맥상 규례·계명과 병렬되는 법적 판단으로서 ‘판결’이 가장 직접적입니다.
- source_word: ለዘፈጠሮሙ
  english_pob_choice: their Creator
  chosen_korean: 자기 창조주
  alternatives_korean:
  - 그들의 창조주
  - 그들을 지으신 분
  lexicon: Leslau
  rationale: 직역상 ‘그들을 지으신 분’이지만, 한국어에서는 소유 대명사를 앞세운 ‘자기 창조주’가 자연스럽고 원문의 관계도 유지합니다.
- source_word: ይክድኑ ኃፍረተ ሥጋሆሙ
  english_pob_choice: cover the shame of their flesh
  chosen_korean: 육체의 수치를 가리다
  alternatives_korean:
  - 몸의 부끄러움을 덮다
  - 육신의 수치를 덮다
  lexicon: Leslau
  rationale: 원문의 ‘살/육체’와 ‘수치’의 직결을 살리기 위해 완곡화하지 않고 ‘육체의 수치’로 옮겼습니다.
- source_word: ዝሙት ወእምርኵስ ወእምኵሉ ዐመፃ
  english_pob_choice: fornication and uncleanness and all iniquity
  chosen_korean: 음행과 부정함과 모든 불의
  alternatives_korean:
  - 간음과 더러움과 모든 악행
  - 음란과 부정과 모든 죄악
  lexicon: Leslau
  rationale: POB의 세 항목을 각각 대응시키되, ‘불의’는 단순한 도덕적 악이 아니라 원문이 가진 범주적 죄악성을 보존하기 위한 선택입니다.
theological_decisions:
- issue: ‘그가 알고 있는 모든 판결과 규례와 계명’의 배열
  chosen_reading: 판결·규례·계명을 각각 구분하여 법적·계약적 가르침의 총체로 제시했습니다.
  alternative_readings:
  - ‘판결’을 ‘정의’로 완화하여 읽는 방식
  - ‘규례와 계명’만 강조하는 방식
  rationale: 원문은 노아가 알고 있는 실천 규범 전체를 나열하므로, 특정 항목을 추상화하지 않고 병렬 구조를 유지하는 것이 의미를 가장 잘 보존합니다.
  doctrine_reference: 서사 본문 보존 원칙
- issue: ‘자기 창조주를 찬양하며’의 동작
  chosen_reading: ‘찬양하며’로 옮겨, 창조주에 대한 적극적 경배 행위를 드러냈습니다.
  alternative_readings:
  - ‘감사하며’
  - ‘축복하며’
  rationale: English POB의 bless는 단순 감사보다 더 강하게 하나님을 높이는 행위를 가리킬 수 있으므로, 한국어에서는 문맥상 예배적 성격이 드러나는 ‘찬양’이 적절합니다.
  doctrine_reference: 창조주 경배의 언어
