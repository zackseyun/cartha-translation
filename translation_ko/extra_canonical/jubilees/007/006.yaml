  text: And he rejoiced and drank some of this wine, he and his sons with joy. And it became evening, and he went into his tent, and being drunk he lay down and slept, and he was uncovered inside his tent while he slept.
translation:
  language: ko
  text: 그는 기뻐하며 이 포도주를 조금 마셨습니다. 그와 그의 아들들도 기쁨으로 마셨습니다. 저녁이 되자 그는 자기 천막으로 들어갔고, 술에 취한 채 누워 잠들었습니다. 그리고 자는 동안 자기 천막 안에서 몸이 드러났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተፈሥሐ፡
  english_pob_choice: he rejoiced
  chosen_korean: 기뻐하며
  alternatives_korean:
  - 즐거워하며
  - 환희하여
  lexicon: standard
  rationale: 동작의 상태를 자연스럽게 살리면서도 단순 과거 서술로 굳히지 않고 기쁨의 상태를 드러내는 부사형으로 옮겼습니다.
- source_word: ወሰትየ፡ እም ... ወይነ፡
  english_pob_choice: drank some of this wine
  chosen_korean: 이 포도주를 조금 마셨습니다
  alternatives_korean:
  - 이 포도주를 마셨습니다
  - 이 포도주를 조금 들이켰습니다
  lexicon: standard
  rationale: 본문의 ‘일부/조금’이라는 양적 제한을 살려 과도한 해석 없이 번역했습니다.
- source_word: ውሉዱ፡
  english_pob_choice: his sons
  chosen_korean: 그의 아들들도
  alternatives_korean:
  - 그의 아들들도 함께
  - 그의 자녀들도
  lexicon: standard
  rationale: 원문의 복수 표현을 반영하고, 함께 기뻐하며 마셨다는 문맥을 자연스럽게 연결했습니다.
- source_word: ውስተ፡ ሰቀላሁ፡
  english_pob_choice: inside his tent
  chosen_korean: 자기 천막 안에서
  alternatives_korean:
  - 그의 장막 안에서
  - 자기 텐트 안에서
  lexicon: standard
  rationale: 일관된 서사체를 위해 ‘천막’으로 옮겼고, 위치 구문은 한국어 어순에 맞게 처리했습니다.
- source_word: እንዘ፡ ይነውም።
  english_pob_choice: while he slept
  chosen_korean: 자는 동안
  alternatives_korean:
  - 잠들어 있는 동안
  - 그가 자고 있는 사이
  lexicon: standard
  rationale: 동시성을 나타내는 분사구를 간결한 시간 부사구로 옮겼습니다.
theological_decisions:
- issue: 노출 상태를 나타내는 문구의 표현 강도
  chosen_reading: ‘몸이 드러났습니다’로 직역에 가까운 완화된 표현을 사용했습니다.
  alternative_readings:
  - ‘벗겨져 있었습니다’
  - ‘벌거벗겨져 있었습니다’
  rationale: 본문의 결과 상태를 과장하지 않으면서도, 수치스러운 노출 상태라는 의미를 분명하게 전달합니다.
  doctrine_reference: 서사적 묘사; 민감한 신체 노출 표현
