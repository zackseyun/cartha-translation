  lexicon: 폭력
  rationale: Geez 원문의 ‘땅’과 ‘가득 찼다’의 상태 진술을 그대로 살리고, violence는 문맥상 포악한 폭력 행위를 가리키므로 자연스럽고 직접적인 ‘폭력’으로 옮겼습니다.
- source_word: “sinned against the beasts and birds and everything that moves and everything that walks upon the earth”
  english_pob_choice: they sinned against the beasts and birds and everything that moves and everything that walks upon the earth
  chosen_korean: 그들은 짐승과 새와 땅 위를 움직이는 모든 것, 그리고 땅 위를 걷는 모든 것에 대해 죄를 지었고
