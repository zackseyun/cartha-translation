translation:
  language: ko
  text: 그리고 땅은 폭력으로 가득 찼습니다. 그 후에 그들은 짐승과 새와 땅 위를 움직이는 모든 것, 그리고 땅 위를 걷는 모든 것에 대해 죄를 지었고, 땅 위에 많은 피가 흘려졌습니다. 그리고 모든—[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “filled with violence”
  english_pob_choice: And the earth was filled with violence.
  chosen_korean: 땅은 폭력으로 가득 찼습니다
  alternatives_korean:
  - 땅이 폭력으로 가득 찼습니다
  - 땅은 포악함으로 가득 찼습니다
  lexicon: 폭력
  rationale: Geez 원문의 ‘땅’과 ‘가득 찼다’의 상태 진술을 그대로 살리고, violence는 문맥상 포악한 폭력 행위를 가리키므로 자연스럽고 직접적인 ‘폭력’으로 옮겼습니다.
- source_word: “sinned against the beasts and birds and everything that moves and everything that walks upon the earth”
  english_pob_choice: they sinned against the beasts and birds and everything that moves and everything that walks upon the earth
  chosen_korean: 그들은 짐승과 새와 땅 위를 움직이는 모든 것, 그리고 땅 위를 걷는 모든 것에 대해 죄를 지었고
  alternatives_korean:
  - 그들은 짐승과 새와 땅 위를 움직이는 모든 것, 그리고 땅 위를 걷는 모든 것에게 죄를 지었고
  - 그들은 짐승과 새와 움직이는 모든 것과 걷는 모든 것에 대해 죄를 지었고
  lexicon: 죄를 짓다
  rationale: 경계사 ‘against’를 인칭 오독 없이 대상 표지로 처리해, 피조물들을 상대로 한 죄행이라는 뜻을 살렸습니다. 영어 주석이 제시한 ‘against themselves with beasts’는 본문과 어긋나므로 반영하지 않았습니다.
- source_word: “much blood was shed upon the earth”
  english_pob_choice: and much blood was shed upon the earth
  chosen_korean: 땅 위에 많은 피가 흘려졌습니다
  alternatives_korean:
  - 땅 위에 많은 피가 쏟아졌습니다
  - 땅 위에 많은 피가 흘렸습니다
  lexicon: 피가 흘려지다
  rationale: 수동 표현을 살려 유혈의 결과를 강조했고, Geez 원문의 ‘땅 위에’ 반복도 유지해 지리적 범위를 분명히 했습니다.
