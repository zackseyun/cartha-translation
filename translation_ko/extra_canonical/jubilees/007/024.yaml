  text: 그리고 땅은 폭력으로 가득 찼습니다. 그 후에 그들은 짐승들과 새들과 땅 위를 움직이는 모든 것과 땅 위를 걷는 모든 것에게 죄를 지었고, 많은 피가 땅 위에 쏟아졌습니다. 그리고 모든—
