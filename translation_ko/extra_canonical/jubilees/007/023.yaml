review_pass:
  verdict: revise
  source_fidelity: 첫 절은 게에즈 본문 자체가 동사 없이 ‘그리고 사람은 그의 이웃을’이라는 단편으로 끝납니다. 초안의 ‘이웃을 상대로 하였습니다’는 본문에 없는 대립 행위를 보충하므로 삭제해야 합니다. 후반부의 ተሰይጠ 및 목적 표현은 ‘자신을 팔아/팔았습니다’와 ‘많은 피를 흘리려고’로 옮기는 것이 가깝습니다. ‘피를 흘리게 하였습니다’는 원문에 없는 사역 의미를 더합니다.
  naturalness: 원문의 단편성을 한국어에서도 의도적으로 보존하되, 각주로 그 이유를 밝혀 독자가 오역으로 여기지 않도록 했습니다. 후반절은 현대 표준어 합쇼체로 자연스럽게 다듬었습니다.
  terminology: ‘불의’는 ዐመፃ의 윤리적·폭력적 부정의를 적절히 반영합니다. ‘많은 피를 흘리다’는 살육을 불필요하게 해설하지 않으면서 원문의 관용적 표현을 보존합니다.
  issues:
  - severity: high
    issue: 첫 절에 없는 서술어를 보충함
    rationale: ‘이웃을 상대로 하였습니다’는 게에즈 단편에 명시되지 않은 행위와 적대 관계를 확정합니다. 본문이 불완전하거나 생략적인 상태인 점을 보존해야 합니다.
  - severity: medium
    issue: ‘피를 흘리게 하였습니다’가 사역 의미를 추가함
    rationale: 원문과 영어 감사 기록은 행위자들이 많은 피를 흘리는 것을 말하며, 타인에게 피를 흘리게 했다는 사역 구문을 요구하지 않습니다.
  - severity: medium
    issue: 기존 각주가 현 본문과 무관한 이전 번역을 제시함
    rationale: 각주는 다른 본문 내용(땅, 모든 육체 등)을 제시하므로 삭제하고, 실제 본문의 동사 없는 첫 단편을 설명하는 각주로 교체해야 합니다.
  revised_text: 그리고 사람은 자기 이웃을.[a] 또 모두가 불의를 행하고 많은 피를 흘리려고 자신을 팔았습니다.
  revised_footnotes:
