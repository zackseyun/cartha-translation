translation:
  language: ko
  text: 그리고 사람은 이웃을 상대로 하였습니다. 또 모든 사람이 스스로를 팔아 불의를 행하고 많은 피를 흘리게 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰብእሂ፡ ቢጾ።
  english_pob_choice: and a man his neighbor
  chosen_korean: 그리고 사람은 이웃을 상대로 하였습니다
  alternatives_korean:
  - 그리고 사람과 그의 이웃
  - 사람이 자기 이웃과 대적하였습니다
  lexicon: 입문적 표준어 대응
  rationale: 게에즈 구문이 ‘사람과 그의 이웃’을 직역형으로 두기보다 상호 대립 관계를 압축해 말하므로, 한국어에서는 자연스러운 대립 표현인 ‘이웃을 상대로’로 옮겼습니다.
- source_word: ተሰይጠ፡
  english_pob_choice: sold himself
  chosen_korean: 스스로를 팔아
  alternatives_korean:
  - 자기를 팔아
  - 자기를 넘겨
  lexicon: 입문적 표준어 대응
  rationale: 주어가 자기 자신을 거래 대상으로 삼는 의미를 살리되, 한국어 합쇼체 문맥에서 가장 직접적인 표현인 ‘스스로를 팔아’를 택했습니다.
- source_word: ዐመፃ፡
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불법
  - 악행
  - 부정
  lexicon: 의
  rationale: 게에즈의 죄악/불의 의미를, 윤리적·법정적 울림을 함께 지닌 성경적 표준어 ‘불의’로 옮겼습니다.
- source_word: ይክዐው፡ ደመ፡ ብዙኀ፡
  english_pob_choice: to shed much blood
  chosen_korean: 많은 피를 흘리게 하였습니다
  alternatives_korean:
  - 많은 피를 쏟게 하였습니다
  - 많은 피를 흘렸습니다
  lexicon: 피 흘림
  rationale: 동사의 목적 보어가 ‘많은 피’이므로, 단순한 유혈이 아니라 의도된 살육/유혈 행위를 드러내도록 ‘피를 흘리게 하였습니다’로 표현했습니다.
theological_decisions:
- issue: 문맥의 죄책 묘사 강도
  chosen_reading: ‘스스로를 팔아’와 ‘불의를 행하고 많은 피를 흘리게 하였습니다’로, 개인적 책임과 폭력의 확대를 분명히 드러냈습니다.
  alternative_readings:
  - 보다 완곡하게 ‘악을 행하여’로 약화
  - ‘피를 흘렸습니다’로 중립화
  rationale: 본문은 단순한 도덕적 타락이 아니라 자기-매매와 폭력의 공모를 함께 말하므로, 그 죄책의 강도를 보존하는 번역이 필요합니다.
  doctrine_reference: 인간의 죄책과 폭력의 확산에 대한 성경적 증언
