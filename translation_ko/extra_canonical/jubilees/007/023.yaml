    text: 직역하면 ‘그리고 사람은 자기 이웃을’입니다. 게에즈 본문은 여기서 동사 없이 끝나는 단편이며, 어떤 행위를 뜻하는지는 본문만으로 확정할 수 없습니다.
    reason: 첫 절의 문법적으로 불완전한 원문을 임의로 보충하지 않고 보존했음을 설명합니다.
  revision_rationale: 초안이 첫 절에 추가한 ‘대상으로 삼다’의 의미와 마지막 절에 추가한 사역 의미를 제거했습니다. 원문이 제공하는 첫 절의 불완전성을 번역문과 각주에서 투명하게 유지하고, 후반절은 ‘자신을 팔아’라는 비유와 불의 및 유혈의 목적을 보존했습니다.
