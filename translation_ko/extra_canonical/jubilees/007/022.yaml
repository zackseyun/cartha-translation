  yaml_path: translation/extra_canonical/jubilees/007/022.yaml
  text: And they fathered the children of the Naphidim, and all of them were unlike one another, and they devoured one another; and the giants killed the Naphil, and the Naphil killed the Elyo, and the Elyo mankind.
translation:
  language: ko
  text: 그리고 그들은 나피딤의 자손을 낳았으며, 그들 모두는 서로 같지 않았고 서로를 집어삼켰습니다. 그리고 거인들이 나필을 죽였으며, 나필이 엘요를 죽였고, 엘요가 인류를 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወለዱ፡ ውሉደ፡ ናፊዲም፡
  english_pob_choice: And they fathered the children of the Naphidim
  chosen_korean: 나피딤의 자손을 낳았으며
  alternatives_korean:
  - 나피딤의 아이들을 낳았으며
  - 나피딤의 자녀를 낳았으며
  lexicon: 자손
  rationale: 출생/생산 관계를 그대로 옮기되, 지시된 집단명 Naphidim은 음역으로 보존하여 본문의 종족 계열을 흐리지 않게 했습니다.
- source_word: ወኵሎሙ፡ ኢይትማሰሉ፡
  english_pob_choice: and all of them were unlike one another
  chosen_korean: 그들 모두는 서로 같지 않았고
  alternatives_korean:
  - 그들 모두는 서로 닮지 않았고
  - 모두가 서로 다르지 않았고
  lexicon: 같지 않다
  rationale: 서로의 비동일성을 직접적으로 드러내는 표현이므로, 완곡한 해석보다 문장 그대로의 대비를 살렸습니다.
- source_word: ወይበልዕ፡ አሐዱ፡ አሐዱ፡ ካልኦ፡
  english_pob_choice: and they devoured one another
  chosen_korean: 서로를 집어삼켰습니다
  alternatives_korean:
  - 서로를 먹어치웠습니다
  - 서로를 삼켜버렸습니다
  lexicon: 집어삼키다
  rationale: 단순한 상해보다 훨씬 강한 식인적 폭력을 나타내므로, 한국어에서도 동일한 충격도를 지닌 표현을 택했습니다.
- source_word: ናፊል / ኤልዮ
  english_pob_choice: the Naphil / the Elyo
  chosen_korean: 나필 / 엘요
  alternatives_korean:
  - 네필 / 엘리오
  - 나필림 / 엘요
  lexicon: 음역
  rationale: 검증된 고유명사 표기가 없으므로, 영어 POB의 구분을 따라 두 집단명을 각각 음역해 구별을 보존했습니다.
- source_word: አንሰ፡ አመሕያው፡
  english_pob_choice: mankind
  chosen_korean: 사람들을
  alternatives_korean:
  - 인류를
  - 인간을
  lexicon: 인류
  rationale: 문맥상 마지막 대상은 일반 인간 집단을 가리키므로, 현대 한국어에서 가장 자연스럽고 포괄적인 표현으로 옮겼습니다.
theological_decisions:
- issue: 괴물/거인 계열 명칭의 구분 보존
  chosen_reading: 나피딤, 나필, 엘요를 서로 다른 집단명으로 유지했습니다.
  alternative_readings:
  - 모두 네피림으로 통일
  - 거인들로 일반화
  rationale: 게에즈 본문은 서로 다른 용어를 쓰며, 영어 POB의 수정도 이 구분을 유지하려는 방향이므로, 종족 분류의 긴장을 평준화하지 않았습니다.
  doctrine_reference: 본문비평 및 용어 일관성
- issue: 최종 절의 짧은 서술 유지
  chosen_reading: ‘엘요가 사람들을 죽였습니다’로 짧게 처리했습니다.
  alternative_readings:
  - 엘요가 인류를 멸했습니다
  - 엘요가 사람들을 죽여 멸망시켰습니다
  rationale: 원문이 매우 압축적이어서 설명을 덧붙이면 본문의 난해함과 잔혹성을 과도하게 풀어버리게 되므로, 최소한의 서술만 유지했습니다.
  doctrine_reference: 최소충실 번역 원칙
