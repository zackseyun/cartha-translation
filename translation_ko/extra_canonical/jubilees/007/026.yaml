revisions:
- from: 그들이 땅 한가운데에 흘린 피를 말하는 것입니다. 그분은 모든 것을 멸하셨습니다. 나와 너희와 내 자녀들, 그리고 우리와 함께 방주에 들어온 모든 사람은 남았습니다. 보십시오, 나는 너희의 행위를 내 앞에서 보고 있습니다. 너희는 의롭게 걷고 있지 않습니다. 너희는 이미 부패의 길로 걷기 시작했고, 각자가 자기 이웃에게서 떨어져 나가고 있으며, 서로 싸우게 될 것이고, 하나로 연합하지 못할 것입니다.[a][b]
  to: 그들이 땅 한가운데에 흘린 피 때문에, 그분께서는 모든 것을 멸하셨습니다. 나와 너희, 곧 내 자녀들, 그리고 우리와 함께 방주에 들어온 모든 이들만 남았습니다. 보십시오, 나는 너희의 행위를 보고 있습니다. 너희는 의롭게 걷고 있지 않습니다. 너희는 부패의 길을 걷기 시작했고, 각자가 자기 이웃에게서 떨어져 나가고 있으며, 서로 싸우게 될 것이고, 하나로 연합하지 못할 것입니다.
  rationale: The revision removes the non-source explanatory phrase, makes the causal connection supplied by the inherited relative clause explicit in idiomatic Korean, preserves ‘you, my children’ as apposition, and improves the naturalness of the observation formula. It retains the source’s present assessment, future conflict, and lack of unity. The English audit-trail alternatives are not adopted and therefore require no Korean footnote anchors.
