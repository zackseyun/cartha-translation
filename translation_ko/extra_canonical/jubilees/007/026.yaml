base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/026.yaml
  text: which they shed in the midst of the earth. He destroyed everything, and I and you, my children, and all that entered with us into the ark were left. And behold, I see before me your deeds, that you are not walking in righteousness; for you have begun to walk in the paths of corruption, and you are separating, each one from his neighbor, and you will fight one with another, and you will not be united.
  footnotes:
  - marker: a
    text: Or 'which destroyed the middle of the earth,'.
    reason: previous_rendering
  - marker: b
    text: Or 'and each of you will go after his neighbor,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 땅 한가운데에 흘린 피를 말하는 것입니다. 그분은 모든 것을 멸하셨습니다. 나와 너희와 내 자녀들, 그리고 우리와 함께 방주에 들어온 모든 사람은 남았습니다. 보십시오, 나는 너희의 행위를 내 앞에서 보고 있습니다. 너희는 의롭게 걷고 있지 않습니다. 너희는 이미 부패의 길로 걷기 시작했고, 각자가 자기 이웃에게서 떨어져 나가고 있으며, 서로 싸우게 될 것이고, 하나로 연합하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘከዐዉ
  english_pob_choice: which they shed
  chosen_korean: 그들이 흘린
  alternatives_korean:
  - 그들이 쏟아낸
  - 그들이 퍼부은
  lexicon: Geez ከዐወ
  rationale: 동사는 ‘흘리다/쏟다’의 의미를 가지며, 전후 문맥상 물이나 피를 ‘흘린’ 것으로 읽는 것이 자연스럽습니다.
- source_word: ማእከለ፡ ምድር፡
  english_pob_choice: in the midst of the earth
  chosen_korean: 땅 한가운데에
  alternatives_korean:
  - 세상 한가운데에
  - 땅 가운데에
  lexicon: Geez ማእከለ + ምድር
  rationale: 직역을 유지하되 한국어로는 ‘땅 한가운데에’가 가장 명료하게 위치 관계를 드러냅니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의롭게
  alternatives_korean:
  - 의 가운데에서
  - 의 안에서
  lexicon: Geez ጽድቅ
  rationale: 행위의 방식으로 이어지는 문맥이므로 명사구보다 부사형 ‘의롭게’가 더 자연스럽고 원문의 규범적 의미를 잘 살립니다.
- source_word: በፍኖተ፡ ሙስና
  english_pob_choice: in the paths of corruption
  chosen_korean: 부패의 길로
  alternatives_korean:
  - 썩어짐의 길로
  - 타락의 길로
  lexicon: Geez ፍኖት + ሙስና
  rationale: ‘길/행로’와 ‘부패’의 이미지를 그대로 살리면서 한국어 문맥상 ‘부패의 길로’가 가장 간결합니다.
- source_word: ወትትፋለጡ
  english_pob_choice: you are separating, each one from his neighbor
  chosen_korean: 각자가 자기 이웃에게서 떨어져 나가고 있으며
  alternatives_korean:
  - 각자가 이웃과 갈라서고 있으며
  - 서로 분리되고 있으며
  lexicon: Geez ተፋለጠ
  rationale: 이 동사는 ‘갈라지다, 분리되다, 떨어지다’의 뜻이므로, 문맥상 ‘이웃에게서 떨어져 나가다’가 원문 의미를 가장 직접적으로 반영합니다.
theological_decisions:
- issue: ‘의롭게 걷지 않음’과 ‘부패의 길’의 대조
  chosen_reading: 행위의 윤리적 상태를 직접 비판하는 문장으로 유지했습니다.
  alternative_readings:
  - 단순한 생활습관의 문제로 완화
  - 미래 예언만 강조
  rationale: 원문은 현재의 관찰(‘보고 있습니다’)과 도덕적 평가(‘의롭게 걷지 않음’)를 연결하므로, 윤리적 긴장을 약화시키지 않고 그대로 살렸습니다.
  doctrine_reference: '성경 본문 해석 원칙: 서술적 관찰과 규범적 평가를 구분하되 둘 다 보존'
