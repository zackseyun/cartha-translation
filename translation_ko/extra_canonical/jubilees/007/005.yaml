revisions:
- from: 그는 그들의 모든 육체를 제단 위에 올려놓고, 그들의 모든 제물을 기름에 섞어 그 위에 두었습니다. 그런 뒤 그는 제단 위의 불 속에 포도주를 부었고, 제단에 향을 놓았으며, 향기로운 냄새가 올라가도록 하여, 그의 하나님 야훼 앞에 받아들여지게 했습니다.[a][b]
  to: 그는 그 모든 고기를 제단 위에 올려놓고, 그들의 모든 제물을 기름에 섞어 그 위에 두었습니다. 그런 뒤 그는 제단 위의 불 속에 포도주를 부었고, 제단에 향을 놓았으며, 그의 하나님 야훼 앞에서 기쁘게 받아들여질 향기가 올라가게 했습니다.[a][b]
  rationale: 제의문맥에서 자연스러운 ‘고기’로 고치고, 긍정적 향기가 야훼 앞에 받아들여진다는 원문의 수식 관계를 명시했습니다. 그 밖의 제의 행위의 순서와 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
