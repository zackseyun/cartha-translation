  text: And he caused all their flesh to ascend on the altar, and he placed all their offering mixed with oil upon it, and afterward he poured wine into the fire that was on the altar, and put incense on the altar, and caused a pleasing fragrance to ascend, acceptable before the LORD his God.
translation:
  language: ko
  text: 그는 그들의 모든 육체를 제단 위에 올려놓고, 그들의 모든 제물을 기름에 섞어 그 위에 두었습니다. 그런 뒤 그는 제단 위의 불 속에 포도주를 부었고, 제단에 향을 놓았으며, 향기로운 냄새가 올라가도록 하여, 그의 하나님 야훼 앞에 받아들여지게 했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በምሥዋዕ / altar
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 단
  - 희생제단
  lexicon: 제단
  rationale: 제의적 장소를 자연스럽게 드러내는 표준어로 옮겼으며, 본문 반복 구조도 살렸습니다.
- source_word: መሥዋዕቶሙ
  english_pob_choice: their offering
  chosen_korean: 그들의 모든 제물
  alternatives_korean:
  - 그들의 제사
  - 그들의 헌물
  lexicon: 제물
  rationale: 문맥상 제의에 바쳐진 물건을 가리키므로 ‘제물’이 가장 직접적이며, all의 반복을 살려 ‘모든’을 붙였습니다.
- source_word: በቅብዕ
  english_pob_choice: mixed with oil
  chosen_korean: 기름에 섞어
  alternatives_korean:
  - 기름과 섞어
  - 기름을 섞어
  lexicon: 기름
  rationale: 제물의 준비 상태를 나타내는 표현으로, ‘mixed with oil’의 관계를 자연스럽게 드러내는 한국어 구문으로 처리했습니다.
- source_word: ወይነ
  english_pob_choice: wine
  chosen_korean: 포도주
  alternatives_korean:
  - 술
  - 포도즙
  lexicon: 포도주
  rationale: 제의적 붓기 행위에 들어가는 음료로서 표준적인 성서어휘인 ‘포도주’를 선택했습니다.
- source_word: መዐዛ፡ ሠናየ
  english_pob_choice: a pleasing fragrance
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 기분 좋은 향기
  - 향긋한 냄새
  lexicon: 향기
  rationale: 히브리/에티오피아 제의문맥의 ‘기쁘게 하는 향’ 계열을, 과도한 신학적 해석 없이 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: “acceptable before the LORD his God”의 ‘받아들여지다’ 표현
  chosen_reading: ‘받아들여지게 했습니다’로 옮겨 제의의 결과와 하나님 앞에서의 수용성을 함께 드러냈습니다.
  alternative_readings:
  - ‘기쁘게 했습니다’
  - ‘합당했습니다’
  rationale: 원문과 영어 POB 모두 향기와 수용 가능성을 함께 제시하므로, 정서적 반응만으로 좁히지 않고 제의적 수용을 분명히 했습니다.
  doctrine_reference: 제의적 수납/기쁨 표상
- issue: 야훼 표기
  chosen_reading: 기존 프로젝트 기본값에 따라 LORD를 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 신명칭을 가리키는 자리이므로, 본 프로젝트의 원문지향 기준에 따라 학술적 전사형을 유지했습니다.
  doctrine_reference: YHWH 표기 원칙
