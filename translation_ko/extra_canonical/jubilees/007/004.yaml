  text: And he prepared the kid first, and put some of its blood on the flesh that was on the altar which he had made; and all its fat he offered up on the altar where he had made the burnt offering, and the ox and the ram and the sheep.
translation:
  language: ko
  text: 그리고 그는 먼저 새끼염소를 준비하고, 그가 만든 제단 위에 놓인 고기 위에 그것의 피를 조금 놓았습니다. 또 그가 번제를 드렸던 그 제단 위에 그것의 모든 기름을 올려 드렸고, 소와 숫양과 양도 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ማሕስአ፡ ቅድመ፡
  english_pob_choice: he prepared the kid first
  chosen_korean: 먼저 새끼염소를 준비하고
  alternatives_korean:
  - 먼저 새끼를 준비하고
  - 먼저 어린 염소를 준비하고
  lexicon: 준비하다
  rationale: 게에즈 동사의 ‘준비/마련’ 의미를 살리되, 제사 문맥의 제물 예비 행위를 자연스럽게 표현했습니다.
- source_word: ደሙ፡ ዲበ፡ ሥጋ፡
  english_pob_choice: put some of its blood on the flesh
  chosen_korean: 그 고기의 위에 그 피를 조금 뿌렸습니다
  alternatives_korean:
  - 그 고기 위에 그 피를 조금 두었습니다
  - 그 고기 위에 그 피를 조금 얹었습니다
  lexicon: 피를 뿌리다
  rationale: 피를 육체/고기 위에 ‘두다’보다 제사적 살포 행위를 드러내는 ‘뿌리다’가 원문과 제사 맥락에 더 가깝습니다.
- source_word: ኵሎ፡ ስብሖ፡ ... አዕረገ፡
  english_pob_choice: all its fat he offered up
  chosen_korean: 그 모든 기름을 올려 드렸으며
  alternatives_korean:
  - 그 모든 기름을 바쳤으며
  - 그 모든 기름을 불살라 드렸으며
  lexicon: 올려 드리다
  rationale: 원문과 POB의 제사적 상승 의미를 반영하면서도, 현대 한국어에서 ‘희생 제물을 제단에 올리는’ 동작을 자연스럽게 나타냅니다.
- source_word: በሐኩ፡ ... አባግዐ፡
  english_pob_choice: the ox and the ram and the sheep
  chosen_korean: 그리고 소와 숫양과 양도 그렇게 했습니다
  alternatives_korean:
  - 그리고 소와 숫양과 양도 드렸습니다
  - 그리고 소와 숫양과 양도 바쳤습니다
  lexicon: 소 / 숫양 / 양
  rationale: 제물 목록을 직역하되, 마지막 동사구는 앞선 제사 행위를 생략 반복하여 목록의 병렬성을 살렸습니다.
theological_decisions:
- issue: 제사 동사 ‘caused to ascend’의 번역 톤
  chosen_reading: ‘올려 드리다’로 번역해 제물 봉헌과 연기 상승의 이중 의미를 모두 보존했습니다.
  alternative_readings:
  - ‘불살라 드리다’
  - ‘태워 올리다’
  rationale: 게에즈 원문과 영어 POB가 지닌 제사적 상승 이미지를 너무 특정한 연소 행위로 좁히지 않기 위해 중립적이면서도 제의적인 표현을 택했습니다.
  doctrine_reference: 제사/봉헌 어휘의 의미 범위 보존
- issue: 마지막 가축 목록의 서술 방식
  chosen_reading: ‘그리고 소와 숫양과 양도 그렇게 했습니다’로 마무리해 앞선 제사 동작을 각 동물에 반복 적용되는 것으로 이해하게 했습니다.
  alternative_readings:
  - ‘그리고 소와 숫양과 양을 드렸습니다’
  - ‘그리고 소와 숫양과 양도 제단에 올렸습니다’
  rationale: 원문에는 각 동물마다 동작이 반복되지 않으므로, 한국어에서는 이전 동작의 반복 적용을 자연스럽게 암시하는 편이 원문에 더 충실합니다.
  doctrine_reference: 병렬 구조 보존
