translation:
  language: ko
  text: 첫째 달 초하루에 그는 그날 기쁨으로 잔치를 베풀고, 야훼께 번제를 드렸습니다. 곧 어린 수소 한 마리와 숫양 한 마리와 일 년 된 양 일곱 마리와 숫염소 한 마리를 드려, 자신과 자기 아들들을 위하여 속죄하게 하였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
