translation:
  language: ko
  text: 첫째 달 초하루에 그는 기쁨으로 잔치를 베풀고, 야훼께 번제를 드렸습니다. 곧 어린 수소 한 마리, 숫양 한 마리, 한 살 된 양 일곱 마리[a], 숫염소 한 마리를 드려 자신과 자기 아들들을 위하여 속죄하려고 하였습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양 일곱 마리’.
    reason: 영어 POB 감사 기록의 대안 번역을 보존합니다. 본문은 제사용 양이 한 살 되었음을 명시하므로 본문에는 이를 유지했습니다.
  - marker: b
    text: 또는 ‘그리고 그날 그는 기쁨으로 잔치를 베풀고’.
    reason: 영어 POB 감사 기록의 이전 번역에 따른 대안 어순을 보존합니다. 본문은 첫째 달 초하루라는 달력 표지를 명시적으로 유지했습니다.
