- source_word: ፳፬ ... ፳፯ ... ፳፱ ... ፴
  english_pob_choice: one young bull, one ram, seven yearling sheep, and one male goat
  chosen_korean: 어린 수소 한 마리와 숫양 한 마리와 일 년 된 양 일곱 마리와 숫염소 한 마리
