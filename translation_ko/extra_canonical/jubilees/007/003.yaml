  lexicon: source_note
  rationale: ‘기쁨으로’는 수식어의 방식과 분위기를 함께 살리고, ‘잔치를 베풀다’는 본문의 행사적 뉘앙스를 유지합니다.
- source_word: ጽንሓሐ፡ ለእግዚአብሔር፡
