  - marker: b
    text: Or 'And Shem took a garment, and he and Japheth laid the garment on their shoulders, and going backward they covered the shame of their father, and their faces were turned backward.'.
    reason: previous_rendering
translation:
  language: ko
  text: 함은 자기 아버지 노아가 벌거벗은 것을 보고[a], 밖으로 나가 밖에 있는 두 형제에게 알렸습니다. 셈은 옷을 가져왔고, 셈과 야벳은 그 옷을 어깨에 메었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서는 자료의 행 분절이 이례적입니다. 셈과 야벳의 행동은 8절로 표기된 행에서 시작하고, 뒤로 물러가 아버지의 수치를 덮는 행동은 18절로 표기된 행에서 이어집니다. 번역은 이를 연속된 이야기 절로 정리합니다.
    reason: 제공된 영어 POB의 분절 주석에 대응하며, 이 절에 다음 절의 덮는 행동이 포함되지 않음을 독자가 이해하도록 돕습니다.
lexical_decisions:
- source_word: “saw Noah his father naked”
  english_pob_choice: And Ham saw Noah his father naked
  chosen_korean: “자기 아버지 노아의 벌거벗은 모습을 보고”
  alternatives_korean:
  - “자기 아버지 노아가 벌거벗은 것을 보고”
  - “자기 아버지 노아의 알몸을 보고”
  lexicon: naked → 벌거벗은
  rationale: 문맥상 단순한 신체 상태를 직접 진술하므로, 완곡하지 않은 ‘벌거벗은 모습’으로 옮겨 본문의 수치감을 유지했습니다.
- source_word: went out and told his two brothers outside
  english_pob_choice: and he went out and told his two brothers outside
  chosen_korean: “밖으로 나가 자기 두 형제에게 밖에서 알렸습니다”
  alternatives_korean:
  - “나가서 밖에 있는 자기 두 형제에게 말했습니다”
  - “밖으로 나가 두 형제에게 전했습니다”
  lexicon: tell → 알리다
  rationale: 행위의 핵심은 단순 보고가 아니라 외부로 나가 두 형제에게 전하는 것이므로 ‘알렸습니다’로 자연스럽게 살렸습니다.
- source_word: took a garment
  english_pob_choice: And Shem took a garment
  chosen_korean: “셈은 옷을 가져다가”
  alternatives_korean:
  - “셈이 한 옷을 가져다가”
  - “셈은 한 의복을 վերց다가”
  lexicon: garment → 옷
  rationale: 히브리/게으즈 계열에서 특정한 예복 명칭이 아니라 덮는 데 쓰는 옷 일반을 가리키므로 가장 무리 없는 ‘옷’으로 옮겼습니다.
- source_word: laid the garment on their shoulders
  english_pob_choice: and he and Japheth laid the garment on their shoulders
  chosen_korean: “자기와 야벳이 그 옷을 어깨에 메었습니다”
  alternatives_korean:
  - “자기와 야벳이 그 옷을 어깨에 걸쳤습니다”
  - “자기와 야벳이 그 옷을 어깨에 올렸습니다”
  lexicon: laid on their shoulders → 어깨에 메다
  rationale: 운반 동작이 분명하므로 ‘메었습니다’가 장면을 가장 분명하게 전달합니다. ‘걸쳤습니다’보다 능동적 이동감이 살아납니다.
theological_decisions:
- issue: 이 절의 범위와 다음 절 내용의 분리
  chosen_reading: 이 절은 함의 발견과 보고, 셈의 옷 준비까지만 담고 다음 절의 뒤로 물러가며 덮는 행위는 포함하지 않았습니다.
  alternative_readings:
  - 서술을 이어서 ‘뒤로 가며 덮었습니다’까지 한 절에 넣는 읽기
  rationale: 제공된 게으즈 본문과 최신 감수에서 분절이 정정되었으므로, 절 경계를 존중해 번역 범위를 제한했습니다.
  doctrine_reference: 본문 비평/절 분절
