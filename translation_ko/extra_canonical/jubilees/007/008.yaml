  to: 함은 자기 아버지 노아가 벌거벗은 것을 보고[a], 밖으로 나가 밖에 있는 두 형제에게 알렸습니다. 셈은 옷을 가져왔고, 셈과 야벳은 그 옷을 어깨에 메었습니다.
  rationale: 원문의 절 범위를 보존하여 함의 목격과 보고, 셈의 옷 취함 및 셈과 야벳이 옷을 어깨에 메는 데까지만 번역했습니다. ‘밖에 있는 두 형제’와 ‘셈과 야벳’으로 문장 관계를 분명히 하고 현대 한국어 문장을 자연스럽게 다듬었습니다.
