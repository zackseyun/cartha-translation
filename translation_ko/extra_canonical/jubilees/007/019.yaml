revisions:
- from: 이들은 노아의 아들들이다. 그리고 제이십팔 희년이 되자 노아는 자기 손자들에게 율례와 계명과 자기가 아는 모든 법도를 명령하기 시작하였다. 그리고 그는 그의 아들들에게 그들이 의를 행하고, 그들의 육체의 부끄러움을 가리고, 그들의 창조주를 찬송하고 아버지와 어머니를 공경하며, 각각 자기 이웃을 사랑하고 음행과 더러움과 모든 불의에서 자신을 지켜야 한다고 증거했습니다.
  to: 이들은 노아의 아들들입니다. 제이십팔 희년에 노아는 자기 손자들에게 규례와 계명과 자기가 아는 모든 판결을 지키도록 명하기 시작하였습니다. 또 그는 자기 아들들에게 의를 행하고, 자기 육체의 수치를 가리며, 자기들을 창조하신 분을 송축하고 아버지와 어머니를 공경하며, 저마다 자기 이웃을 사랑하고 음행과 부정과 모든 불의에서 자신을 지켜야 한다고 증언하였습니다.
  rationale: 원문의 열거와 권면의 범위를 유지하면서, 목표 한국어 등록에 맞추어 전 문장을 합쇼체로 통일했습니다. ‘명령하기’의 어색한 결합을 ‘지키도록 명하다’로 바로잡고, ‘bless’와 ‘uncleanness’에 해당하는 핵심 어휘를 각각 ‘송축’과 ‘부정’으로 조정했습니다.
  reviewer_model: gpt-5.6-terra
