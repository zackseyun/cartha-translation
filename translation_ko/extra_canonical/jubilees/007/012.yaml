  to: 함은 자기 아버지가 그의 막내아들, 곧 가나안을 저주한 것을 알고, 아버지가 자기 아들을 저주한 일을 불쾌하게 여겼습니다. 그래서 그는 자기 아들들, 곧 구스와 미스라임과 붓과 가나안과 함께 아버지에게서 떠났습니다.
