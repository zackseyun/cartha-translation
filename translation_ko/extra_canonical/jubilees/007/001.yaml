  text: And in the seventh week, in its first year, in this jubilee, Noah planted a vine on the mountain on which the ark had come to rest, whose name was Lubar, one of the mountains of Ararat; and in the fourth year it produced fruit.
translation:
  language: ko
  text: 그리고 이 희년의 일곱째 주의 첫해에, 노아는 방주가 머물렀던 산, 곧 아라랏의 여러 산 가운데 하나인 루바르라는 이름의 산에 포도나무를 심었습니다. 그리고 넷째 해에 그것이 열매를 맺었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሱባዔ፡ ሳብዕ፡ በ ቀዳማይ፡ ዓመት፡
  english_pob_choice: And in the seventh week, in its first year
  chosen_korean: 이 희년의 일곱째 주의 첫해에
  alternatives_korean:
  - 일곱째 주의 첫해에
  - 이 주간의 첫해에
  lexicon: source temporal frame
  rationale: 희년서의 주간-희년 구조를 살리되, 영어 POB의 ‘seventh week’에 맞춰 ‘일곱째 주’로 옮겼습니다. ‘이 희년의’는 문맥상 해당 희년 내의 시간표임을 드러냅니다.
- source_word: ተከለ፡ ኖኅ፡ ወይነ፡
  english_pob_choice: Noah planted a vine
  chosen_korean: 노아는 포도나무를 심었습니다
  alternatives_korean:
  - 노아는 포도나무 한 그루를 심었습니다
  - 노아는 포도덩굴을 심었습니다
  lexicon: טָמַע/plant imagery equivalent
  rationale: Geez 동사는 ‘심다’의 직접적 의미를 가지므로 자연스럽게 옮겼습니다. ‘포도나무’는 영어 POB의 vine을 한국어 성경체로 가장 자연스럽게 반영합니다.
- source_word: ኀበ፡ ደብር፡ እንተ፡ ዲቤ
  english_pob_choice: on the mountain on which the ark had come to rest
  chosen_korean: 방주가 머물렀던 산
  alternatives_korean:
  - 방주가 안식했던 산
  - 방주가 내려앉았던 산
  lexicon: rest/come to rest
  rationale: 아라랏 산 위에 방주가 ‘머물렀다’는 뜻을 살려, 과도하게 신학화하지 않고 상태를 나타내는 표현으로 옮겼습니다. 한국어로는 ‘머물다’가 문맥상 가장 안정적입니다.
- source_word: ዘስሙ፡ ሉባር፡ ፲፮ እምአድባረ፡ አራራት፡
  english_pob_choice: whose name was Lubar, one of the mountains of Ararat
  chosen_korean: 루바르라는 이름의 산, 곧 아라랏의 여러 산 가운데 하나인
  alternatives_korean:
  - 이름이 루바르인 산, 곧 아라랏의 산들 가운데 하나인
  - 루바르라 불리는, 아라랏 산맥의 한 산
  lexicon: proper noun + appositive geography
  rationale: 영어 POB의 설명 구조를 따라 산의 이름과 소속 관계를 분명히 했습니다. ‘아라랏의 여러 산 가운데 하나’는 원문의 복수형 지시를 자연스럽게 반영합니다.
- source_word: ወገብረ፡ ፍሬ፡ በራብዕ፡
  english_pob_choice: and in the fourth year it produced fruit
  chosen_korean: 넷째 해에 그것이 열매를 맺었습니다
  alternatives_korean:
  - 넷째 해에 열매를 맺었습니다
  - 넷째 해에 그것은 열매를 생산했습니다
  lexicon: fruit-bearing idiom
  rationale: 직역보다 한국어 관용에 맞는 ‘열매를 맺다’를 사용해 원문의 결과 동작을 자연스럽게 전달했습니다. ‘그것’은 포도나무를 가리킵니다.
theological_decisions:
- issue: Jubilees의 시간 단위인 ‘week’ 처리
  chosen_reading: ‘주’로 옮기되, 문맥상 희년 내부의 주간 단위를 뜻하는 것으로 읽히도록 했습니다.
  alternative_readings:
  - ‘주간’
  - ‘7년 주기’
  rationale: 희년서의 기술 체계는 일반적인 요일 주간이 아니라 주기 단위를 가리킵니다. 한국어에서는 ‘주’가 가장 간결하지만, 앞의 ‘이 희년의’와 결합해 오해를 줄였습니다.
  doctrine_reference: 해당 없음 — 유대 묵시/희년 문헌의 내적 연대기 표현
- issue: ‘방주가 머물렀던 산’의 서술 방식
  chosen_reading: 방주의 정박/안식 이미지를 과장된 신학 용어 없이 중립적으로 처리했습니다.
  alternative_readings:
  - 방주가 안식했던 산
  - 방주가 내려앉았던 산
  rationale: 원문은 단순한 지리적·서사적 진술이므로, 본문이 요구하지 않는 교리적 어휘를 덧씌우지 않는 편이 source-grounded합니다.
  doctrine_reference: 서사 본문 해석 원칙
