base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/007/021.yaml
  text: And uncleanness and all lawlessness. For because of these three things the flood came upon the earth[a], because of the fornication by which the Watchers committed fornication contrary to the command of their ordinances, going after the daughters of men, and they took for themselves wives from all whom they chose, and they made the beginning of uncleanness.
  footnotes:
  - marker: a
    text: The sequence Naphidim / Naphil / Elyo reflects difficult giant-group terminology in the Ethiopic text. Some scholars compare these with forms like Nephilim and Elioud, but the exact relationships are debated.
    reason: textual_variant
    anchor_ref: '7:21'
  - marker: b
    text: Or 'transgressed against the command of their ordinances after the daughters of men'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 더러움과 모든 불법입니다. 이 셋 때문에 홍수가 땅 위에 임하였으니[a], 감시자들이 사람의 딸들을 따라가며 자기들의 규례의 명령에 어긋나게 음행하였고, 그들이 스스로 모든 이들 가운데서 택한 여자들을 아내로 맞아 더러움의 시작을 이루었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኵስ፡ ወእምኵሉ፡ ዐመፃ።
  english_pob_choice: And uncleanness and all lawlessness.
  chosen_korean: 더러움과 모든 불법
  alternatives_korean:
  - 부정함과 모든 불법
  - 더러움과 모든 무법
  lexicon: 더러움 / 불법
  rationale: 첫 구의 병렬을 살려 ‘uncleanness’를 도덕적·의례적 오염까지 포괄하는 ‘더러움’으로, ‘all lawlessness’를 단순 위반보다 강한 ‘불법’으로 옮겼습니다.
- source_word: በእንተ፡ ዝሙት፡ ዘዘመዉ፡
  english_pob_choice: because of the fornication by which ... committed fornication
  chosen_korean: 음행하였고
  alternatives_korean:
  - 간음하였고
  - 음란을 행하였고
  lexicon: 음행
  rationale: 반복 구조를 자연스럽게 살리면서도 성적 타락의 강도를 유지하기 위해 ‘음행’으로 옮겼습니다.
- source_word: ትጉሃን፡ እምትእዛዘ፡ ዘነኒሆሙ፡
  english_pob_choice: contrary to the command of their ordinances
  chosen_korean: 자기들의 규례의 명령에 어긋나게
  alternatives_korean:
  - 자기들의 규례의 명령을 거슬러
  - 자기들의 명령 규례를 어기고
  lexicon: 규례 / 명령
  rationale: Ge'ez의 ‘명령-규례’ 결합을 살리면서, 규범적 질서를 가리키는 점을 드러내기 위해 ‘규례의 명령’으로 직역에 가깝게 처리했습니다.
- source_word: ወነሥኡ፡ ሎሙ፡ አንስተ፡ እምኵሉ፡ እለ፡ ኀረዩ፡
  english_pob_choice: and they took for themselves wives from all whom they chose
  chosen_korean: 그들이 스스로 모든 이들 가운데서 택한 여자들을 아내로 맞아
  alternatives_korean:
  - 그들이 자신들이 고른 모든 여자들을 아내로 취하여
  - 그들이 원하는 모든 여자들을 자기에게 아내로 삼아
  lexicon: 아내로 맞다 / 택하다
  rationale: ‘took for themselves wives’의 결혼 취득 의미를 살리면서, 단순 소유보다 혼인 행위를 드러내기 위해 ‘아내로 맞다’를 택했습니다.
theological_decisions:
- issue: 홍수의 원인 진술과 악의 누적을 어떻게 연결할지
  chosen_reading: ‘이 셋 때문에 홍수가 땅 위에 임하였으니’로 옮겨, 앞의 세 요소가 홍수 심판의 직접 원인으로 제시된다는 점을 분명히 했습니다.
  alternative_readings:
  - ‘이 셋 때문에 홍수가 땅에 있었다’
  - ‘이 세 가지 때문에 홍수가 땅 위에 일어났다’
  rationale: Ge'ez의 인과 문장을 심판 선언으로 읽는 것이 문맥상 자연스럽고, POB의 영어도 같은 인과를 유지합니다.
  doctrine_reference: 창세기 6장 전승과 1 Enoch/Jubilees의 홍수 심판 해석
