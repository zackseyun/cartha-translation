  terminology: ‘감시자들’, ‘음행’, ‘홍수’, ‘더러움’, ‘불법’은 적절합니다. ትእዛዘ ዘነኒሆሙ의 규범적 의미는 ‘자기들에게 주어진 규례의 명령’으로 보존하는 것이 안전합니다.
