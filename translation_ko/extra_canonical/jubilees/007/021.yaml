  to: 또 더러움과 온갖 불법이 있었습니다. 이 세 가지 때문에 홍수가 땅 위에 닥쳤습니다. 이는 감시자들이 사람의 딸들을 따라가 자기들에게 주어진 규례의 명령을 거슬러 음행하고, 그들이 택한 모든 여자들을 아내로 삼아 더러움의 시작을 만들어 냈기 때문입니다.
