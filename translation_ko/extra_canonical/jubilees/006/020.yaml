  text: And you also, command the children of Israel that they keep this festival throughout their generations.
translation:
  language: ko
  text: 너도 이스라엘 자손에게 이 절기를 모든 세대에 걸쳐 지키라고 명령하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዝዞሙ
  english_pob_choice: command
  chosen_korean: 명령하여
  alternatives_korean:
  - 지시하여
  - 분부하여
  lexicon: Geez imperative/causative command expression
  rationale: 원문의 강한 명령성을 살리기 위해 약화된 ‘지시’보다 직접적인 ‘명령하다’를 택했습니다.
- source_word: ለ*ደቂቀ፡⁹ እስራኤል
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: biblical group designation
  rationale: 영문 POB의 관용적 표현을 자연스럽게 반영하면서, 성경적 집단 표지로 널리 쓰이는 ‘이스라엘 자손’을 유지했습니다.
- source_word: ይዕቀብዋ፡¹⁰
  english_pob_choice: that they keep
  chosen_korean: 지키게 하십시오
  alternatives_korean:
  - 준수하게 하십시오
  - 지키도록 하십시오
  lexicon: Geez jussive of keeping/observing
  rationale: 절기와 결합될 때는 단순 보관이 아니라 규례를 ‘지키다/준수하다’의 뜻이므로, 한국어 성경에서 자연스러운 ‘지키다’를 사용했습니다.
- source_word: ለዛቲ፡ በዓል፡
  english_pob_choice: this festival
  chosen_korean: 이 절기
  alternatives_korean:
  - 이 축제
  - 이 명절
  lexicon: festival/feast term
  rationale: 문맥이 종교적 절기이므로 현대 한국어에서는 ‘축제’보다 성경적·중립적인 ‘절기’가 원문 의미를 더 정확히 드러냅니다.
- source_word: በኵሉ፡ ትዝምዶሙ፡
  english_pob_choice: throughout their generations
  chosen_korean: 모든 세대에 걸쳐
  alternatives_korean:
  - 대대로
  - 그들의 모든 نسل 동안
  lexicon: generation-duration formula
  rationale: 세대 반복의 지속성을 분명히 하되, 현대 한국어에서 가장 자연스러운 관용 표현으로 옮겼습니다.
theological_decisions:
- issue: 명령문의 화자와 청자 관계를 한국어에서 어떻게 표지할지
  chosen_reading: 본문의 직접 명령을 살리되, 청자에게는 공손한 명령형인 ‘하십시오’를 사용했습니다.
  alternative_readings:
  - 명령하라
  - 명령하십시오
  rationale: 원문은 권위 있는 지시를 담지만, 한국어 합쇼체 본문 규범에 맞추어 격식을 유지하면서도 강도를 약화하지 않는 형태를 선택했습니다.
  doctrine_reference: 공적·율례적 명령문의 문체 일관성
