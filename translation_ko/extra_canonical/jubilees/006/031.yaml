revisions:
- from: 그리고 너는 이스라엘 자손에게 이 계산에 따라 해마다 지키라고 명령하십시오. 곧 삼백육십사일이니, 그것은 완전한 해가 될 것입니다. 그것은 자기의 날들에서나 자기의 절기들에서나 그 시기를 어지럽히지 않을 것입니다. 모든 것은 그들의 증언에 따라 그 안에서 이루어질 것이며, 그들은 하루도 빠뜨리지 않고 절기도 어지럽히지 않을 것입니다.[a]
  to: 그리고 당신은 이스라엘 자손에게 이 계산, 곧 삼백육십사일에 따라 해들을 지키도록 명령하십시오. 그러면 그것은 완전한 해가 될 것입니다. 그것은 자기 날들이나 자기 절기들에서 그 시기를 어지럽히지 않을 것입니다. 모든 것은 그들의 증언에 따라 그것들 안에서 이루어질 것이며, 그들은 하루도 빠뜨리지 않고 절기도 어지럽히지 않을 것입니다.[a]
  rationale: 합쇼체에 맞게 수신자 표현을 조정하고, 원문의 ‘해들’을 부사 ‘해마다’로 바꾸지 않도록 수정했습니다. 단수 주어인 ‘그것’과 마지막 절의 복수 주어 ‘그들’의 대비를 유지했으며, ‘그들의 증언’이 누구를 가리키는지에 관한 본문의 여지는 해석적으로 확정하지 않았습니다. 기존 각주 표지 [a]가 본문에 있으나 각주가 제공되지 않았으므로, 영어 POB 감사 기록의 해당 대안을 번역하여 표지와 각주를 연결했습니다.
