base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/031.yaml
  text: 'And you, command the children of Israel to keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And it will not disturb its time from its days or from its feasts, for everything will come in them according to their testimony, and they will not omit a day nor disturb a feast.'
  footnotes:
  - marker: a
    text: Or 'And they shall not disturb its time'.
    reason: previous_rendering
  - marker: b
    text: Or 'And command'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 당신은 이스라엘 자손에게 이 계산, 곧 삼백육십사일에 따라 해들을 지키도록 명령하십시오. 그러면 그것은 완전한 해가 될 것입니다. 그것은 자기 날들이나 자기 절기들에서 그 시기를 어지럽히지 않을 것입니다. 모든 것은 그들의 증언에 따라 그것들 안에서 이루어질 것이며, 그들은 하루도 빠뜨리지 않고 절기도 어지럽히지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들은 그 시기를 어지럽히지 않을 것입니다.”
    reason: 영어 POB 감사 기록의 이전 번역 관련 이문성 주석을 한국어로 보존합니다. 본문은 게으즈어의 마지막 복수 동사에 따라 ‘그들은 … 절기도 어지럽히지 않을 것입니다’로 번역했습니다.
lexical_decisions:
- source_word: ወእንተኒ
  english_pob_choice: And you, command
  chosen_korean: 그리고 너는
  alternatives_korean:
  - 그리고 당신은
  - 그리고 너도
  lexicon: 인칭 강조 표현
  rationale: 게으즈어의 독립 인칭대명사로서, 단순 명령이 아니라 모세에게 직접 초점을 두는 강조를 살려 ‘너는’으로 옮겼습니다.
- source_word: ይዕቀቡ
  english_pob_choice: to keep
  chosen_korean: 지키라고
  alternatives_korean:
  - 준수하라고
  - 보존하라고
  lexicon: 지키다
  rationale: 해마다의 규례를 준수하라는 의미이므로, 한국어에서 자연스럽고 규범 준수의 뜻이 살아 있는 ‘지키다’를 택했습니다.
- source_word: ዓመታተ ... ሠለስተ ምእተ ወስሳ ወረቡዐ
  english_pob_choice: three hundred and sixty-four days
  chosen_korean: 삼백육십사일
  alternatives_korean:
  - 364일
  - 삼백예순넷 날
  lexicon: 수량 표현
  rationale: 달력 계산의 정밀성을 그대로 보여 주기 위해 숫자보다 한국어 수사로 풀어 썼습니다.
- source_word: ፍጹመ ዓመተ
  english_pob_choice: a complete year
  chosen_korean: 완전한 해
  alternatives_korean:
  - 온전한 해
  - 완성된 해
  lexicon: 완전한/온전한
  rationale: ‘완전한’은 계산상 결함 없는 해라는 뜻을 직접적으로 살리며, 문맥상 달력적 완결성을 잘 드러냅니다.
- source_word: ወኢያማስን / ወኢያማስኑ
  english_pob_choice: it will not disturb ... / they will not disturb
  chosen_korean: 어지럽히지 않을 것입니다 / 어지럽히지 않을 것입니다
  alternatives_korean:
  - 혼란스럽게 하지 않을 것입니다
  - 흐트러뜨리지 않을 것입니다
  lexicon: 어지럽히다
  rationale: 해의 시기와 절기의 질서를 깨뜨리는 의미를 살리기 위해 ‘어지럽히다’를 사용했습니다.
- source_word: በዓላቲሁ
  english_pob_choice: his feasts
  chosen_korean: 절기들
  alternatives_korean:
  - 절기
  - 축제들
  lexicon: 절기
  rationale: 본문의 종교적 달력 항목을 한국어 성경어법에 맞게 ‘절기들’로 옮겼습니다.
theological_decisions:
- issue: 달력 규례의 절대적 정합성
  chosen_reading: 해는 364일로 유지되며 시기와 절기가 어그러지지 않도록 지켜야 한다는 규범적 진술로 읽었습니다.
  alternative_readings:
  - 서술적 설명으로만 읽는 견해
  - 의례적 상징 강조로 완화하는 견해
  rationale: 게으즈 본문과 영어 POB 모두 규정적 명령과 결과를 분명히 하므로, 달력 질서의 엄격함을 약화시키지 않았습니다.
  doctrine_reference: 본문 문맥상의 달력 규례 이해
- issue: ‘그들의 증언’의 기능
  chosen_reading: 그 안에서 모든 것이 ‘그들의 증언에 따라’ 이루어진다는 표현을 유지했습니다.
  alternative_readings:
  - ‘증거’ 또는 ‘확인’으로 완화하는 해석
  rationale: 게으즈어의 대응 표현이 달력의 기준/증언을 가리키므로, 단순한 ‘증거’보다 규범적 기준이라는 긴장을 살렸습니다.
  doctrine_reference: 본문 내부 상호참조적 용례
