  to: 나는 알고 있으며, 이제부터 날들의 구분[a]을 당신에게 알리겠습니다. 이것은 내 마음에서 나온 것이 아닙니다. 책이 내 앞에 기록되어 있고 하늘의 판들에 정해져 있기 때문입니다. 이는 그들이 언약의 절기를 잊고, 자기들의 잘못과 무지를 따라 민족들의 절기를 따라 행하지 않게 하려는 것입니다.
