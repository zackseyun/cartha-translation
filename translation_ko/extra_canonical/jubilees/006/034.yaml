base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/034.yaml
  text: For I know, and from now on I will make it known to you—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.
  footnotes:
  - marker: a
    text: Or 'divisions of the times'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 알고 있으며, 이제부터 날들의 구분[a]을 당신에게 알리겠습니다. 이것은 내 마음에서 나온 것이 아닙니다. 책이 내 앞에 기록되어 있고 하늘의 판들에 정해져 있기 때문입니다. 이는 그들이 언약의 절기를 잊고, 자기들의 잘못과 무지를 따라 민족들의 절기를 따라 행하지 않게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘때들의 구분’.
    reason: መዋዕል은 문자적으로 ‘날들’이며, 본문은 달력의 날 수와 구분을 강조하므로 본문에는 ‘날들의 구분’을 유지했습니다. 다만 문맥상 ‘때들’로 이해할 여지도 있어 대안 번역을 제시합니다.
lexical_decisions:
- source_word: አእምር / አየድዐከ፡
  english_pob_choice: For I know, and from now on I will make it known to you
  chosen_korean: 나는 알고 있으며, 이제부터 내가 그것을 당신에게 알려 드리겠습니다
  alternatives_korean:
  - 나는 알고 있으며, 이제부터 내가 당신에게 알게 하겠습니다
  - 나는 알고 있으며, 이제부터 내가 그것을 당신에게 알리겠습니다
  lexicon: standard Korean verbal style
  rationale: 게으즈 원문의 ‘내가 알다’와 ‘알게 하다’의 대비를 살리되, 현대 한국어에서 자연스럽고 공식적인 ‘알려 드리겠습니다’로 옮겼습니다.
- source_word: መጽሐፍ፡ ጽሑፍ፡ በቅድሜየ፡
  english_pob_choice: for the book is written before me
  chosen_korean: 그 책이 내 앞에 기록되어 있고
  alternatives_korean:
  - 그 책이 내 앞에 쓰여 있고
  - 그 책이 내 앞에 기록되어 있습니다
  lexicon: 기록되다
  rationale: 단순한 ‘쓰다’보다 문맥상 이미 정해진 문서를 가리키는 ‘기록되어 있다’가 원문의 완료·공적 성격을 더 잘 드러냅니다.
- source_word: ተሠርዐ፡ ውስተ፡ ጽላተ፡ ሰማይ፡
  english_pob_choice: it is ordained on the heavenly tablets
  chosen_korean: 하늘의 판에 정해져 있기 때문입니다
  alternatives_korean:
  - 하늘의 돌판에 정해져 있기 때문입니다
  - 하늘의 판에 규정되어 있기 때문입니다
  lexicon: 천상 기록 / tablets
  rationale: ‘판’은 판(板)·판석의 이미지를 살리면서도 너무 설명적이지 않게 유지하며, ‘정해져 있다’로 예정·규정의 의미를 전달했습니다.
- source_word: ክፋሌሁ፡
  english_pob_choice: the divisions of the days
  chosen_korean: 날들의 구분
  alternatives_korean:
  - 날들의 분할
  - 날들의 구획
  lexicon: division
  rationale: 이 단어는 달력 문맥에서 날짜들의 구획을 가리키므로, 직역에 가까우면서도 한국어에서 자연스러운 ‘구분’을 택했습니다.
theological_decisions:
- issue: 천상 기록의 권위
  chosen_reading: 이 내용은 내 생각에서 나온 것이 아니라, 하늘의 판에 이미 정해진 것으로 제시됩니다.
  alternative_readings:
  - 단순한 예언적 영감으로 완화해 읽는 것
  - 비유적 표현으로만 처리하는 것
  rationale: 원문은 계시의 출처를 화자의 내면이 아니라 사전 정해진 천상 기록에 둡니다. 이를 약화하지 않고 그대로 드러내는 것이 본문의 권위 구조를 보존합니다.
  doctrine_reference: 계시와 예정의 문학적 표현
- issue: 언약의 절기와 민족들의 절기 대조
  chosen_reading: 언약의 절기와 민족들의 절기를 대조하여, 공동체가 이방 관습을 따르지 않게 하는 경고로 읽습니다.
  alternative_readings:
  - 문화적 달력 차이로만 읽는 것
  - 단순한 의식 규정으로 축소하는 것
  rationale: 원문은 절기의 실천을 언약 정체성과 민족 구분의 문제로 제시합니다. 따라서 단순 달력 정보가 아니라 신앙적 경계의 의미를 유지했습니다.
  doctrine_reference: 언약 정체성, 분리/구별의 신학
