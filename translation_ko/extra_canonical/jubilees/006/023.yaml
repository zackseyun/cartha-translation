- from: 이 달에 그들의 نسل을 위하여 해마다 하루가 있습니다. 그리고 첫째 달의 초하루, 넷째 달의 초하루, 일곱째 달의 초하루, 열째 달의 초하루에는 기억의 날들이 있으며, 그것들은 해의 네 구분의 계절의 날들입니다. 그것들은 기록되어 있습니다.[a]
