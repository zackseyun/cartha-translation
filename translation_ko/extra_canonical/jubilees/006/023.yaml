  source_fidelity: 첫 구절의 ‘그들의 نسل’에는 아랍 문자 혼입이라는 명백한 오류가 있습니다. 또한 원문의 기억/기념일 및 연중 네 구분 안의 절기라는 관계를 더 자연스럽고 정확하게 드러낼 필요가 있습니다. 마지막 ‘기록되어 있다’는 지원되는 범위에서 유지합니다.
  naturalness: ‘그들의 세대를 위하여 이 달에는 해마다 하루가 있습니다’와 ‘한 해의 네 구분에 속한 절기의 날들’은 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘해의 네 구분의 계절의 날들’처럼 연속된 관형어를 피했습니다.
  terminology: ተዝካር는 문맥상 ‘기념의 날들’로, ጊዜ는 달력상의 ‘절기’로 옮겼습니다. ‘초하루’는 각 달의 신월을 가리키는 자연스러운 한국어 표현입니다. ‘세대’는 감사 기록의 ‘generations’를 반영합니다.
