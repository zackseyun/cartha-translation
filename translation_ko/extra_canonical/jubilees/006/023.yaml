    reason: previous_rendering
translation:
  language: ko
  text: 그들의 세대를 위하여[a] 이 달에는 해마다 하루가 있습니다. 그리고 첫째 달의 초하루, 넷째 달의 초하루, 일곱째 달의 초하루, 열째 달의 초하루는 기념의 날들이며, 한 해의 네 구분에 속한 절기의 날들입니다. 이것들은 기록되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 달에’.
    reason: 영어 POB 감사 흔적에 보존된 대안 해석을 첫 구절의 해당 표현에 연결합니다. 본문은 최신 감사의 ‘for their generations’ 읽기를 따릅니다.
lexical_decisions:
- source_word: ትዝምዶሙ
  english_pob_choice: for their generations
  chosen_korean: 그들의 نسل을 위하여
  alternatives_korean:
  - 그들의 세대를 위하여
  - 그들의 후손을 위하여
  lexicon: Ge'ez ትዝምዶሙ / English POB audit note
  rationale: 감수 기록이 지적하듯 이 어형은 ‘this month’가 아니라 앞절을 이어 주는 ‘그들의 نسل/세대’ 의미로 보는 것이 자연스럽고, 한국어는 문맥상 ‘그들의 세대를 위하여’로 옮기는 것이 가장 직접적입니다.
- source_word: ዕለተ አሐተ ለለ አሐዱ ዓመት
  english_pob_choice: one day every year
  chosen_korean: 해마다 하루
  alternatives_korean:
  - 매년 하루
  - 일 년에 하루
  lexicon: Ge'ez 연간 주기 표현 / English POB
  rationale: 반복되는 주기성을 간결하게 드러내되, 원문의 분산형 표현을 해치지 않도록 ‘해마다 하루’로 자연스럽게 옮겼습니다.
- source_word: ተዝካር
  english_pob_choice: days of remembrance
  chosen_korean: 기억의 날들
  alternatives_korean:
  - 기념의 날들
  - 추모의 날들
  lexicon: Ge'ez 기념/기억 어휘
  rationale: 원문은 특정 집단의 추모라기보다 ‘기억’ 자체를 표지하는 날들이므로, 의미를 좁히지 않고 ‘기억의 날들’로 렌더링했습니다.
- source_word: ውስተ አርባዕቱ መክፈላት ዓመት
  english_pob_choice: in the four divisions of the year
  chosen_korean: 해의 네 구분의 계절
  alternatives_korean:
  - 해의 네 분할
  - 해의 네 절기
  lexicon: Ge'ez መክፈላት / English POB
  rationale: ‘division(s)’의 구조를 살리되 한국어에서 이해 가능한 자연어로 ‘해의 네 구분’이라 하고, 문맥상 연중 주기성을 드러내기 위해 ‘계절’로 풀었습니다.
theological_decisions:
