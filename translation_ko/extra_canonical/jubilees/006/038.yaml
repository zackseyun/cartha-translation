base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/038.yaml
  text: Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year three hundred and sixty-four days only. Therefore they will go wrong concerning the new moons and seasons and sabbaths and festivals, and they will eat all the blood with all flesh.
translation:
  language: ko
  text: 그러므로 내가 네게 명령하고 네게 증언합니다. 네가 그들에게 증언하도록 하려는 것입니다. 네가 죽은 뒤에 네 자손이 그것을 훼손하여, 한 해를 364일로만 정하지 않을 것이기 때문입니다. 그러므로 그들은 새달과 때와 안식일과 절기에 관하여 잘못될 것이며, 모든 육체와 함께 모든 피를 먹을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እዝዘከ፡
  english_pob_choice: I command you
  chosen_korean: 내가 너희에게 명령합니다
  alternatives_korean:
  - 내가 너희에게 이릅니다
  - 내가 너희에게 지시합니다
  lexicon: 명령하다
  rationale: 게으즈 원문은 권위 있는 직접 명령을 나타내므로, 단순 통지보다 명령이 더 정확합니다.
- source_word: አስምዕ፡
  english_pob_choice: testify to you / testify to them
  chosen_korean: 너희에게 증언합니다 … 그들에게 증언하게 하려는 것입니다
  alternatives_korean:
  - 너희에게 알립니다
  - 너희에게 증거합니다
  lexicon: 증언하다
  rationale: 영어 POB 최신 수정은 일반 통지보다 ‘증언’의 언약적 무게를 살리므로, 그 결정을 따라 한국어도 증언으로 옮겼습니다.
- source_word: ፪ሠለስተ፡ ምእተ፡ ... ፭ ባሕቲተከ፡
  english_pob_choice: three hundred and sixty-four days only
  chosen_korean: 삼백육십사일만
  alternatives_korean:
  - 삼백육십사일뿐
  - 삼백육십사일만 되게
  lexicon: 삼백육십사일만
  rationale: 원문은 364일 ‘뿐’이라는 배타성을 강조하므로, 간결한 ‘만’으로 제한 의미를 살렸습니다.
- source_word: እምድኅረ፡ ሞትከ፡ ... ያማስኑ፡
  english_pob_choice: after your death your children will corrupt it
  chosen_korean: 너희가 죽은 뒤에 너희 자손이 그것을 더럽혀서
  alternatives_korean:
  - 너희가 죽은 뒤에 너희 자손이 그것을 타락시켜서
  - 너희가 죽은 뒤에 너희 자손이 그것을 혼란스럽게 해서
  lexicon: 더럽히다
  rationale: 문맥상 달력과 절기 규례를 흐트러뜨리는 행위를 가리키며, 한국어에서는 도덕·예전적 훼손을 함께 담는 ‘더럽히다’가 가장 근접합니다.
- source_word: ኵሎ፡ ደመ፡ ምስለ፡ ኵሉ፡ ሥጋ።
  english_pob_choice: all the blood with all flesh
  chosen_korean: 모든 피를 모든 육체와 함께
  alternatives_korean:
  - 모든 피를 모든 살과 함께
  - 피 전부를 모든 육체와 함께
  lexicon: 피 / 육체
  rationale: 영어 POB의 최종 수정은 ‘all kinds of’가 아니라 실제로 ‘all the blood with all flesh’에 가깝기 때문에, 혈액 섭취 금지를 직접적으로 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 달력 규정의 위반이 단순 실수인지, 언약적 불순종인지
  chosen_reading: 언약적 질서에 대한 훼손으로 읽고, ‘증언’과 ‘명령’의 병치를 유지했습니다.
  alternative_readings:
  - 단순 정보 전달로 완화
  - ‘알리다’로 비언약적 표현 사용
  rationale: 게으즈 원문과 영어 POB 개정은 모두 권위 있는 경고의 성격을 가지므로, 언약적·규범적 뉘앙스를 약화시키지 않았습니다.
  doctrine_reference: 언약 공동체의 계시 전승과 규례 준수
