translation:
  language: ko
  text: 그리고 계명의 모든 날은 날들의 오십이 주이며, 그것들은 모두 온전한 한 해를 이룹니다. 이렇게 하늘의 판에 기록되고 제정되었으며, 해마다 한 해라도 빠뜨리는 일이 없습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፶ምሳ ወክልኤ ሰንበታት መዋዕል
  english_pob_choice: fifty-two weeks of days
  chosen_korean: 날들의 오십이 주
  alternatives_korean:
  - 날들의 쉰두 주
  - 쉰두 주의 날들
  lexicon: 52 weeks of days
  rationale: 주(週)는 영어 POB의 weeks를 자연스럽게 옮기면서도, 직역이 요구하는 날짜 단위를 유지합니다. ‘오십이’는 수사를 문어체로 맞춘 표현입니다.
- source_word: ኵሎን ... ፍጹም
  english_pob_choice: all of them make a complete year
  chosen_korean: 그것들은 모두 온전한 한 해를 이룹니다
  alternatives_korean:
  - 그것들은 모두 완전한 한 해가 됩니다
  - 그것들 전체가 온전한 1년을 이룹니다
  lexicon: complete year
  rationale: ‘온전한 한 해’는 단순한 365일의 합이 아니라 규정된 주기의 완결성을 살리는 표현입니다. ‘이룹니다’는 원문의 구성적 의미를 자연스럽게 드러냅니다.
- source_word: ተቈርፀ፡ ወተሠርዐ
  english_pob_choice: it is inscribed and ordained
  chosen_korean: 기록되고 제정되었으며
  alternatives_korean:
  - 새겨지고 제정되었으며
  - 기록되어 정해졌으며
  lexicon: inscribed / ordained
  rationale: Ge'ez의 순서를 따라 ‘기록되고’ 뒤에 ‘제정되었으며’를 두어, 새겨짐/기록됨과 제정됨의 이중 의미를 구분해 살렸습니다.
- source_word: ውስተ፡ ጽላት፡ ሰማይ
  english_pob_choice: on the heavenly tablets
  chosen_korean: 하늘의 판에
  alternatives_korean:
  - 하늘의 판들에
  - 하늘 판에
  lexicon: heavenly tablets
  rationale: POB의 ‘heavenly tablets’를 직역하되, 한국어 문맥에서 자연스러운 ‘판’으로 옮겼습니다. 복수성은 문맥상 포괄적으로 유지했습니다.
- source_word: ወአልቦ፡ ተዐድዎ፡ አሐተ፡ ዓመተ፡ ወዓመ፡ እምዓም
  english_pob_choice: and there is no neglecting a single year, from year to year
  chosen_korean: 해마다 한 해라도 빠뜨리는 일이 없습니다
  alternatives_korean:
  - 한 해도 소홀히 넘기는 일이 없습니다
  - 해마다 한 해라도 간과하는 일이 없습니다
  lexicon: neglecting / from year to year
  rationale: revision pass의 ‘neglecting’을 반영해, ‘빠뜨리는’으로 반복적 누락의 의미를 살렸습니다. ‘해마다’는 ‘from year to year’의 순환적 반복을 자연스럽게 드러냅니다.
theological_decisions:
- issue: 하늘의 판(heavenly tablets) 표현 보존
  chosen_reading: 하늘의 판에 기록되고 제정되었으며
  alternative_readings:
  - 하늘의 돌판에
  - 하늘의 서판에
  rationale: 문헌 고유의 천상 기록 매체 이미지를 평이하게 바꾸지 않고 보존했습니다. ‘판’은 원문의 초월적 기록/명령의 권위를 유지하면서도 한국어로 과도하게 성서화된 어휘를 피합니다.
  doctrine_reference: Second Temple Jewish apocalyptic imagery / heavenly record motif
