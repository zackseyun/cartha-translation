  text: And Noah and his sons swore that they would not eat any blood that is in any flesh, and he established a covenant before the Lord God forever throughout all the generations of the earth in this month.
translation:
  language: ko
  text: 노아와 그의 아들들은 그들 안에 있는 어떤 피도 먹지 않겠다고 맹세하였으며, 그는 이 달에 영원히, 땅의 모든 세대에 걸쳐, 주 하나님 앞에서 언약을 세우셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወመሐኩ፡ ... ኢይብልዑ፡
  english_pob_choice: swore that they would not eat
  chosen_korean: 먹지 않겠다고 맹세하였으며
  alternatives_korean:
  - 먹지 않겠다고 서약하였으며
  - 먹지 않겠다고 맹세하고
  lexicon: 맹세하다
  rationale: 서약의 행위를 분명히 드러내면서도, 서술형 합쇼체에 자연스럽게 맞는 표현을 택했습니다.
- source_word: ደመ፡ ... በኵሉ፡ ሥጋ፡
  english_pob_choice: any blood that is in any flesh
  chosen_korean: 그들 안에 있는 어떤 피도
  alternatives_korean:
  - 모든 육체 안에 있는 피도
  - 어떤 육체에든 있는 피도
  lexicon: 피 / 육체
  rationale: 게에즈 원문의 핵심 금지 대상인 ‘피’를 살리되, 영어 POB의 범위를 따라 ‘어떤 피도’로 간결하게 옮겼습니다.
- source_word: ወተካየደ፡ ኪዳነ፡
  english_pob_choice: he established a covenant
  chosen_korean: 언약을 세우셨습니다
  alternatives_korean:
  - 언약을 맺으셨습니다
  - 언약을 확정하셨습니다
  lexicon: 언약을 세우다
  rationale: POB 개정의 ‘established’에 맞추어, 단순 체결보다 더 공적이고 확정적인 뉘앙스를 주는 ‘세우다’를 택했습니다.
- source_word: እግዚአብሔር፡ አምላክ፡
  english_pob_choice: the Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 하나님
  - 주 여호와 하나님
  lexicon: 주 하나님
  rationale: 원문이 야훼가 아니라 일반적인 ‘주 하나님’을 가리키므로, 프로젝트 기본값인 야훼 대신 ‘주 하나님’으로 옮겼습니다.
theological_decisions:
- issue: 언약의 지속 범위 표현
  chosen_reading: ‘영원히, 땅의 모든 세대에 걸쳐’로 옮겨 언약의 시간적·세대적 지속성을 함께 드러냈습니다.
  alternative_readings:
  - ‘땅의 모든 세대를 통하여 영원히’
  - ‘땅의 모든 세대 동안’
  rationale: 게에즈 원문의 ዓለም / ትውልደ ምድር / ወርኅ의 중첩된 지속 표현을 모두 반영해야 하므로, 단순화하지 않고 두 층위를 함께 살렸습니다.
  doctrine_reference: 창세기 홍수 언약의 보편성과 지속성
- issue: ‘주 하나님’ 표기
  chosen_reading: 하나님 이름을 야훼로 옮기지 않고 ‘주 하나님’으로 유지했습니다.
  alternative_readings:
  - 야훼 하나님
  - 주 야훼 하나님
  rationale: 제공된 영어 POB가 LORD를 Lord로 수정했고, 본문 히브리/게에즈 맥락상 여기서는 고유신명보다는 주권 칭호가 핵심이므로 이를 따랐습니다.
  doctrine_reference: 신명호칭 번역 원칙
