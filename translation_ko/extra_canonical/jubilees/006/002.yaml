  text: And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he sprinkled wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the Lord.
  footnotes:
  - marker: a
    text: Or 'poured out'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 제단 위에 기름진 것을 올려놓고, 수소와 숫양과 양과 염소 새끼들과 소금과 산비둘기와 어린 비둘기를 가져다가 제단 위에서 번제물을 드렸습니다. 그리고 그 위에 기름을 섞은 제물을 얹고, 포도주를 뿌리고, 모든 것 위에 향을 놓아, 주님 앞에서 기쁘게 받으실 향기를 올려드렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዕረገ፡ ሥብሐ፡ ዲበ፡ ምሥዋዕ፡
  english_pob_choice: And he placed the fat on the altar
  chosen_korean: 제단 위에 기름진 것을 올려놓고
