  - 수소와 숫양과 어린 양과 염소 새끼들과 소금과 산비둘기와 어린 비둘기를
  lexicon: ላህመ / በሐኰ / በገዐ / አጣሊ / ጼወ / መንጢጠ / አጕለ ርግብ
  rationale: 제물 목록을 한국어로 자연스럽게 열거하되, 각 동물의 구분을 유지했습니다. ጼወ와 መንጢጠ는 POB의 'turtledove'와 'young pigeon'에 맞춰 각각 산비둘기와 어린 비둘기로 옮겼습니다.
- source_word: ወነዝኀ፡ ወይነ፡
  english_pob_choice: and he sprinkled wine
  chosen_korean: 포도주를 뿌리고
  alternatives_korean:
  - 포도주를 부어 바르고
