  lexicon: ነዝኀ
  rationale: 게즈 동사는 '붓다'보다 '뿌리다/뿌려 뿌리다'의 뜻이 더 분명하므로, 최신 검토를 반영해 '뿌리고'로 옮겼습니다.
- source_word: ወአዕረገ፡ መዐዛ፡ ሠናየ፡ ዘያሠምር፡ ቅድመ፡ እግዚአብሔር።
  english_pob_choice: and he caused a pleasing fragrance to rise up, acceptable before the Lord
  chosen_korean: 주님 앞에서 기쁘게 받으실 향기를 올려드렸습니다
  alternatives_korean:
  - 주님 앞에서 기쁘게 받으시는 향기가 올라갔습니다
