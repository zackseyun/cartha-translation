  rationale: 원문의 '향기'와 '받으실 만한/받아들여지는' 의미를 함께 살리기 위해 '기쁘게 받으실 향기'로 옮겼습니다. '올려드렸습니다'는 제의 행위의 상승 이미지를 보존합니다.
theological_decisions:
- issue: ἁγי 이름 대응과 본문상의 신명 표기
  chosen_reading: 소스의 እግዚአብሔር을 '주님'으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 구절의 게즈 본문은 직접적으로 እግዚአብሔር을 사용하지만, 현재 제공된 영어 POB는 'the Lord'로 정리되어 있습니다. 본문 자체가 야훼 인용을 명시하는 표지는 없으므로, 이 절에서는 통상적 경칭인 '주님'을 유지하는 것이 안전합니다.
  doctrine_reference: 신명 존칭 처리 원칙
