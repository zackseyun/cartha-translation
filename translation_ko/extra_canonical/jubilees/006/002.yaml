  - 기름진 부분을 제단 위에 두고
  lexicon: ብሥብሐ (fat)
  rationale: 제의 문맥에서 동물의 기름진 부분을 가리키므로 단순한 '기름'보다 제물의 일부라는 점이 드러나는 '기름진 것'으로 옮겼습니다.
