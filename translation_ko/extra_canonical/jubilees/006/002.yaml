  lexicon: ብሥብሐ (fat)
  rationale: 제의 문맥에서 동물의 기름진 부분을 가리키므로 단순한 '기름'보다 제물의 일부라는 점이 드러나는 '기름진 것'으로 옮겼습니다.
- source_word: ወነሥአ፡ ላህመ፡ ወበሐኰ፡ ወበገዐ፡ ወአጣሊ፡ ወጼወ፡ ወመንጢጠ፡ ወአጕለ፡ ርግብ፡
  english_pob_choice: and he took an ox and a ram and a sheep and kids and salt and a turtledove and a young pigeon
  chosen_korean: 수소와 숫양과 양과 염소 새끼들과 소금과 산비둘기와 어린 비둘기를
  alternatives_korean:
