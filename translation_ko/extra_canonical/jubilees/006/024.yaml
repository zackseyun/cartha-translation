  text: and an ordinance for a testimony forever. And Noah ordained them for himself as festivals for everlasting generations,
  footnotes:
  - marker: a
    text: Or 'as a testimony forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또한 이는 영원한 증거를 위한 규례입니다. 노아는 그것들을 자신을 위해 영원히 이어질 세대를 위한 절기들로 정했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영원한 증거로서’입니다.
    reason: The Ge'ez phrase can be understood as expressing the ordinance's function ‘for a testimony forever’ or its resulting status ‘as a testimony forever’; the note preserves this syntactic nuance.
lexical_decisions:
- source_word: ወሥርዓት
  english_pob_choice: and an ordinance
  chosen_korean: 그리고 영원한 증거를 위한 규례입니다
  alternatives_korean:
  - 그리고 증거를 위한 규례입니다
  - 그리고 증언을 위한 규례입니다
  lexicon: 규례
  rationale: Ge'ez의 ወሥርዓት은 단순한 설명이 아니라 제정된 규범·규정을 가리키므로, 한국어로는 ‘규례’가 가장 직접적입니다. 문맥상 뒤의 ‘증거’와 연결해 목적 관계를 분명히 했습니다.
- source_word: ለስምዕ
  english_pob_choice: for a testimony
  chosen_korean: 영원한 증거를 위한
  alternatives_korean:
  - 영원한 증언을 위한
  - 영원한 표징을 위한
  lexicon: 증거
  rationale: 이 어근은 ‘듣는 것’에서 출발하지만, 여기서는 영구적으로 남는 공적 증거의 기능이 강조되므로 ‘증거’로 옮겼습니다. POB의 testimony를 기계적으로 따르기보다 문맥 기능을 살렸습니다.
- source_word: ለዓለም
  english_pob_choice: forever
  chosen_korean: 영원한
  alternatives_korean:
  - 영원히
  - 끝없이
  lexicon: 영원한
  rationale: 수식어로서 ‘영원한’은 뒤의 ‘증거’와 ‘세대들’을 자연스럽게 연결하며, 절 전체의 지속성을 간결하게 드러냅니다.
- source_word: ለበዓላት ለትውልድ ዘለዓለም
  english_pob_choice: as festivals for everlasting generations
  chosen_korean: 영원한 세대들을 위한 절기로
  alternatives_korean:
  - 세세토록 절기로
  - 영원한 세대들을 위한 절기로
  lexicon: 절기
  rationale: ‘festivals’는 일반적 잔치보다 제의적·기념적 절기를 뜻하므로 ‘절기’가 적절합니다. ‘세대들’을 복수로 살려 반복되는 세대를 직접 반영했습니다.
theological_decisions:
- issue: 노아가 절기를 제정하는 서술의 권위 표현
  chosen_reading: 노아는 그것들을 자신을 위해 영원한 세대들을 위한 절기로 정했습니다
  alternative_readings:
  - 노아는 그것들을 자신을 위해 절기로 지켰습니다
  - 노아는 그것들을 자신을 위해 절기로 마련했습니다
  rationale: 원문 동사는 단순 보관이 아니라 제정·정식화를 뜻하므로 ‘정했습니다’가 서술의 권위를 가장 잘 드러냅니다. 또한 ‘자신을 위해’는 노아 개인의 준수이면서 후대 규범의 출발점임을 보여 줍니다.
  doctrine_reference: 서사적 율례 제정 표현
