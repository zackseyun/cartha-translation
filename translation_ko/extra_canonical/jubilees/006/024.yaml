revisions:
- from: 그리고 영원한 증거를 위한 규례입니다. 노아는 그것들을 자신을 위해 영원한 세대들을 위한 절기로 정했습니다.[a]
  to: 또한 이는 영원한 증거를 위한 규례입니다. 노아는 그것들을 자신을 위해 영원히 이어질 세대를 위한 절기들로 정했습니다.[a]
  rationale: The revision completes the first Korean clause idiomatically, preserves the plural ‘festivals,’ and renders the enduring-generations expression in natural modern Korean without changing its perpetual sense. The footnote preserves the source phrase's closely related functional/resultative construals.
