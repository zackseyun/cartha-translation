  text: And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth.
translation:
  language: ko
  text: 그리고 주님께서 좋은 향기를 맡으시고, 그와 다시는 홍수의 물이 땅을 멸하지 않게 하시겠다는 언약을 맺으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: YHWH
  rationale: 이 절의 영어 POB가 LORD를 대문자로 표기해 신적 호칭을 가리키므로, 한국어에서는 경외를 살리면서도 자연스러운 합쇼체인 ‘주님’으로 옮겼습니다. 창세기의 서술문 안에서 널리 통용되는 신명 표기인 ‘야훼’도 가능하지만, 본 절의 문장 흐름에는 ‘주님’이 더 유려합니다.
- source_word: መዐዛ፡ ሠናየ፡
  english_pob_choice: the pleasing fragrance
  chosen_korean: 그 향기로운 향
  alternatives_korean:
  - 기분 좋은 향기
  - 향긋한 향
  lexicon: ἀπόσμη/향기 어휘에 대응되는 서술 표현
  rationale: 원문은 단순한 냄새가 아니라 하나님께서 받아들이시는 ‘좋은/기쁜 향’의 성격을 말하므로, 의미를 유지하면서도 한국어에서 자연스러운 ‘향기로운 향’으로 옮겼습니다.
- source_word: ተካየደ፡ ምስሌሁ፡ ኪዳነ፡
  english_pob_choice: he made a covenant with him
  chosen_korean: 그와 언약을 세우셔서
  alternatives_korean:
  - 그와 언약을 맺으셔서
  - 그와 계약을 맺으셔서
  lexicon: קָרַת/כרת ברית 계열의 언약 체결 표현
  rationale: ‘언약’은 성서적 관계를 보존하는 핵심 용어이므로 ‘계약’보다 이를 택했습니다. 동사는 문맥상 ‘세우다’가 서술적이면서도 언약의 성립을 잘 드러냅니다.
- source_word: ከመ፡ ኢይኩን፡ ማየ፡ አይኅ፡ ዘያማስን፡ ምድረ፡
  english_pob_choice: that there should never again be floodwaters to destroy the earth
  chosen_korean: 다시는 홍수의 물이 땅을 멸하지 못하게 하셨습니다
  alternatives_korean:
  - 다시는 홍수의 물이 땅을 파괴하지 못하게 하셨습니다
  - 다시는 홍수물이 땅을 멸망시키지 못하게 하셨습니다
  lexicon: מַיִם / מַבּוּל 계열과 파괴 동사
  rationale: 원문은 ‘홍수의 물’과 그 파괴 결과를 직접 말하므로, 영어 POB의 의미를 따르되 종말적 과격성을 살려 ‘멸하지 못하게’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘향기’ 수용 표현
  chosen_reading: 주님께서 제사적 향을 ‘맡으셨다’는 표현을 문자적으로 유지해, 제사가 하나님께 받아들여졌다는 의미를 드러냈습니다.
  alternative_readings:
  - 비유적으로 ‘기쁘게 받으셨다’로 풀어 옮길 수 있음
  - ‘향기를 흠향하셨다’ 같은 전통적 제의어를 사용할 수 있음
  rationale: 원문과 영어 POB 모두 후속 해석을 덧붙이지 않고 감각 동사를 보존합니다. 한국어에서도 제의적 수용의 의미를 독자에게 직접 보이게 하는 쪽이 더 투명합니다.
  doctrine_reference: 제사 수납과 언약 체결의 서술적 표현
