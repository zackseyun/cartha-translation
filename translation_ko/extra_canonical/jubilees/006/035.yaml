  source_fidelity: 문두 접속사 ወ를 ‘그리고’로 반영하고, 달을 관찰하는 이들이 있을 것이라는 진술 및 그 인과관계는 적절히 옮겼습니다. 그러나 ታማስን은 이 문맥에서 단순히 혼란을 야기한다는 뜻보다 ‘부패시키다/망가뜨리다’라는 강한 훼손의 뜻이므로, ‘혼란스럽게 만들다’는 원문의 강도를 약화합니다. 또한 ጊዜያተ는 복수이므로 ‘절기들을’로 명시하는 것이 안전합니다.
