  terminology: ‘절기’는 이 달력·제의 문맥에서 ጊዜያተ에 적절합니다. ታማስን은 ‘혼란스럽게 만들다’가 아니라 ‘망가뜨리다’로 옮겨야 합니다. ‘부패시키다’는 가능하지만 한국어에서 절기와의 결합이 다소 부자연스러워, 의미 강도를 유지하는 ‘망가뜨리다’를 채택합니다.
