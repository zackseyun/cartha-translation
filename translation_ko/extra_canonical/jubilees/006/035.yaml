translation:
  language: ko
  text: 그리고 달을 관찰하는 사람들이 반드시 있을 것입니다. 이는 달이 절기를 혼란스럽게 만들기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ (wa-)
  english_pob_choice: And there will be
  chosen_korean: 그리고 ... 있을 것입니다
  alternatives_korean:
  - 그러므로 ... 있을 것입니다
  - 또 ... 있을 것입니다
  lexicon: Geʿez conjunction ወ
  rationale: 문두의 ወ는 단순 접속이므로 ‘그리고’로 옮겨 앞 문맥과의 연결을 자연스럽게 살렸습니다.
- source_word: ያስተሐይጹ
  english_pob_choice: make observations of
  chosen_korean: 관찰하는
  alternatives_korean:
  - 살피는
  - 헤아리는
  - 관측하는
  lexicon: Geʿez verbal root for observing/calculating
  rationale: 달의 움직임을 예측·점검하는 행위를 가리키므로, 현대 한국어에서 가장 직접적인 ‘관찰하는’으로 처리했습니다.
- source_word: ታማስን
  english_pob_choice: corrupts
  chosen_korean: 혼란스럽게 만들기 때문입니다
  alternatives_korean:
  - 타락시키기 때문입니다
  - 망가뜨리기 때문입니다
  - 절기를 부패시키기 때문입니다
  lexicon: Geʿez tamāsən
  rationale: 문맥상 달이 절기를 ‘부패’시킨다는 직설보다, 절기 질서를 흐트러뜨리고 어지럽힌다는 효과를 살려 ‘혼란스럽게 만들다’로 옮겼습니다.
- source_word: ጊዜያተ፡
  english_pob_choice: the seasons
  chosen_korean: 절기
  alternatives_korean:
  - 계절
  - 때
  - 시기
  lexicon: Geʿez time/season terminology
  rationale: 본문의 달력적·제의적 맥락을 고려하면 단순한 자연계절보다 ‘절기’가 더 정확합니다.
theological_decisions:
- issue: 달의 역할에 대한 부정적 진술 강도
  chosen_reading: 달은 절기 질서를 어지럽히는 것으로 묘사됩니다.
  alternative_readings:
  - 달이 단지 절기를 바꾸거나 구분할 뿐이라고 완화하는 읽기
  - 달의 영향이 중립적이라는 읽기
  rationale: 게에즈 동사 ታማስን의 기본 의미와 주석 전통상 문맥은 단순한 ‘변화’가 아니라 달력 질서의 왜곡을 말하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 달력 질서와 창조 질서에 대한 본문 고유 관점
