base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/014.yaml
  text: And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day, at morning and evening. They shall make atonement for it continually before the Lord, so that they may keep it and not be uprooted.
  footnotes:
  - marker: a
    text: Or 'not neglect it'.
    reason: previous_rendering
  - marker: b
    text: Or 'making atonement'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 율법에는 날수의 한계가 없으니, 그것은 영원하기 때문입니다. 그들은 대대로 그것을 지켜야 하며, 날마다 아침과 저녁에 제단 앞에서 피로 너희를 위하여 계속 간구해야 합니다. 또 그들은 주 앞에서 그것을 위하여 끊임없이 속죄하여, 그것을 지키고 뿌리째 뽑히지 않게 해야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕል፡
  english_pob_choice: there is no limit of days for this law
  chosen_korean: 이 율법에는 날수의 한계가 없으니
  alternatives_korean:
  - 이 율법은 날의 제한이 없으니
  - 이 율법에는 기한이 없으니
  lexicon: 율법
  rationale: 게에즈 원문은 이 규정의 시간적 유효기간이 없음을 말하므로, 영어 POB의 'no limit of days'를 따라 한국어로는 '날수의 한계'로 옮겨 기간 제한의 의미를 분명히 했습니다.
- source_word: እስመ፡ ለዓለም፡ ውእቱ
  english_pob_choice: for it is forever
  chosen_korean: 그것은 영원하기 때문입니다
  alternatives_korean:
  - 그것은 영원하기 때문입니다
  - 그것은 세세토록 있기 때문입니다
  lexicon: 영원
  rationale: 원문의 'for ever'는 단순 지속이 아니라 규정의 영속성을 강조하므로, 한국어로는 표준적이고 직설적인 '영원'을 사용했습니다.
- source_word: ይትመሀለሉ
  english_pob_choice: supplicating
  chosen_korean: 계속 간구하며
  alternatives_korean:
  - 계속 간구하며
  - 간청하며
  - 탄원하며
  lexicon: 간구
  rationale: 게에즈 동사는 속죄와 구별되는 '간구/탄원'의 의미이므로, POB가 이 지점을 살린 영어 선택을 반영해 한국어에서도 '속죄'와 분리해 번역했습니다.
- source_word: ያስተሰርዩ
  english_pob_choice: make atonement
  chosen_korean: 속죄해야 합니다
  alternatives_korean:
  - 속죄해야 합니다
  - 속죄를 해야 합니다
  - 화목해야 합니다
  lexicon: 속죄
  rationale: 뒤이어 나오는 분명한 속죄 동사는 제사적 배경을 가지므로, 전통적이면서도 의미가 분명한 '속죄'를 사용했습니다.
- source_word: ወኢ*ይሠረዉ።
  english_pob_choice: not be uprooted
  chosen_korean: 버려지지 않게 해야 합니다
  alternatives_korean:
  - 뽑히지 않게 해야 합니다
  - 뿌리째 뽑히지 않게 해야 합니다
  - 버려지지 않게 해야 합니다
  lexicon: uproot / eradicate
  rationale: 게에즈 동사는 단순 무시가 아니라 공동체적·언약적 제거/도태의 위협을 나타내므로, 직역적 이미지인 '뿌리째 뽑히다'의 뜻을 살리되 문맥상 자연스럽게 '버려지지 않게'로 다듬었습니다.
theological_decisions:
- issue: ‘아침과 저녁’의 제사 반복과 ‘간구’/‘속죄’의 구별
  chosen_reading: 제단 앞에서 피로 너희를 위하여 계속 간구하며 속죄해야 합니다
  alternative_readings:
  - 피로 너희를 위하여 속죄하며 간구해야 합니다
  - 피로 너희를 위하여 기도하며 속죄해야 합니다
  rationale: 원문은 먼저 간구를 말하고 그 다음 속죄를 말해 두 행위를 구분합니다. 영어 POB의 수정 이력도 이 점을 확인하므로, 한국어에서도 두 동사를 분리해 제사 행위의 층위를 보존했습니다.
  doctrine_reference: 제사/속죄 언어의 구분, 언약적 중보와 속죄의 반복성
