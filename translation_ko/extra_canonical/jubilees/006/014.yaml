revisions:
- from: 이 율법에는 날수의 한계가 없으니, 그것은 영원하기 때문입니다. 그들은 대대로 이것을 지켜야 하며, 날마다, 아침과 저녁에, 제단 앞에서 피로 너희를 위하여 계속 간구하며 속죄해야 합니다. 그들은 주 앞에서 이것을 끊임없이 속죄하여, 그것을 지키고 버려지지 않게 해야 합니다.[a][b]
  to: 이 율법에는 날수의 한계가 없으니, 그것은 영원하기 때문입니다. 그들은 대대로 그것을 지켜야 하며, 날마다 아침과 저녁에 제단 앞에서 피로 너희를 위하여 계속 간구해야 합니다. 또 그들은 주 앞에서 그것을 위하여 끊임없이 속죄하여, 그것을 지키고 뿌리째 뽑히지 않게 해야 합니다.
  rationale: 'The revision restores the source''s sequence: perpetual observance; daily morning-and-evening supplication with blood before the altar on behalf of ''you''; and continual atonement for ''it'' before the Lord. It also replaces the weakened final expression with ''뿌리째 뽑히지 않게'' to reflect the passive uprooting image. Unsupported footnote anchors are removed.'
  reviewer_model: gpt-5.6-terra
