  text: 'For the feasts and for memorials forever, and thus they are ordained. And they are recorded on the heavenly tablets: thirteen weeks, each one from another, for their memorials, from the first to the second, and from the second to the third, and from the third to the fourth.'
  footnotes:
  - marker: a
    text: Or 'And they were written'.
    reason: previous_rendering
translation:
  language: ko
  text: 절기와 영원한 기념을 위하여, 이렇게 정해졌습니다. 그리고 그것은 하늘의 판에 기록되어 있습니다. 곧 십삼 주간이며, 각각 서로에 이어지는 것입니다. 그 기념을 위하여, 첫째에서 둘째로, 둘째에서 셋째로, 셋째에서 넷째로 이어집니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበዓላት፡ ለተዝካር፡ *እስከ፡ለዓለም፡
  english_pob_choice: For the feasts and for memorials forever
  chosen_korean: 절기와 영원한 기념을 위하여
  alternatives_korean:
  - 명절과 기념들을 위하여
  - 축제들과 기념들을 위하여
  lexicon: 절기/기념
  rationale: 첫 구절의 축일적 의미를 살려 ለበዓላት을 ‘절기’로, תזכר의 기억·기념 의미를 ‘기념’으로 옮겼으며, ‘forever’는 문맥상 부사로 자연스럽게 ‘영원한’으로 처리했습니다.
- source_word: ወከመዝ፡ እማንቱ፡ ሥርዓት።
  english_pob_choice: and thus they are ordained
  chosen_korean: 그리고 이렇게 정해졌습니다
  alternatives_korean:
  - 그리고 그렇게 규정되었습니다
  - 그리고 이런 질서로 세워졌습니다
  lexicon: ordain / ordinance
  rationale: እማንቱ ሥርዓት은 단순한 ‘전통’이 아니라 정해진 제정·규정의 의미이므로, 문맥에 맞게 ‘정해졌습니다’로 옮겨 제정된 질서를 드러냈습니다.
- source_word: ወያዐርገዎን፡ ውስተ፡ ጽላት፡ ሰማይ።
  english_pob_choice: And they are recorded on the heavenly tablets
  chosen_korean: 그리고 그것은 하늘의 판에 기록되어 있습니다
  alternatives_korean:
  - 그리고 그것은 하늘의 돌판에 새겨져 있습니다
  - 그리고 그것들은 하늘의 판들에 기록되어 있습니다
  lexicon: heavenly tablets
  rationale: የሰማይ ጽላት을 직역에 가깝게 ‘하늘의 판’으로 두되, POB의 ‘recorded’에 맞춰 ‘기록되어 있습니다’로 옮겨 기록된 상태를 분명히 했습니다.
- source_word: ዓሥሩ፡ ወሠላስ፡ ሰንበታት፡ ... አሐቲ፡ አሐቲ፡ እምኔሆን፡
  english_pob_choice: thirteen weeks, each one from another
  chosen_korean: 곧 십삼 주간이며, 각각 서로에 이어지는 것입니다
  alternatives_korean:
  - 곧 열세 주간이며, 하나하나 서로 뒤따르는 것입니다
  - 곧 십삼 주간이며, 하나씩 서로 이어지는 것입니다
  lexicon: thirteen weeks / each one from another
  rationale: ‘each one from another’는 단순한 반복이 아니라 연속성을 가리키므로 ‘각각 서로에 이어지는’으로 자연스럽게 풀어, 주간들의 순차적 배열을 유지했습니다.
theological_decisions:
- issue: 하늘의 판에 기록됨의 종말론적·권위적 의미
  chosen_reading: 시간표 자체가 인간의 관습이 아니라 하늘에 이미 기록된 질서로 제시된다는 점을 살렸습니다.
  alternative_readings:
  - 단순한 비유적 표현으로 완화하는 읽기
  - 문학적 장치로만 처리하는 읽기
  rationale: 본문은 절기와 기념이 ‘하늘의 판’에 기록된 것으로 말하므로, 제정된 달력 질서의 상위 권위를 약화하지 않고 그대로 반영했습니다.
  doctrine_reference: 지혜문학/묵시문학의 하늘 기록 모티프
- issue: 이 절기의 규정성과 영속성
  chosen_reading: ‘영원한 기념’과 ‘정해졌습니다’를 함께 두어, 기억을 위한 절기들이 일시적 관습이 아니라 고정된 규정임을 드러냈습니다.
  alternative_readings:
  - ‘기념을 위해’만 강조하여 규범성을 약화하는 읽기
  - ‘정해졌습니다’를 생략해 서술로만 보는 읽기
  rationale: Ge'ez와 POB 모두 기념과 제정의 결합을 보이므로, 두 요소를 함께 살려 본문의 규범성을 유지했습니다.
  doctrine_reference: 계시된 절기 질서
