revisions:
- from: 산들의 꼭대기들이 나타났고, 노아는 기뻐했습니다. 그러므로 그는 그것들을 자신을 위해 영원한 명절들로 제정하였고, 이와 같이 그것들은 제정되었습니다.[a]
  to: 산봉우리들이 드러나자 노아는 기뻐했습니다. 그러므로 그는 그것들을 자신을 위하여 영원히 기념할 절기들로 정하였고, 이와 같이 그것들은 정해졌습니다.[a]
  rationale: 누락된 ‘기념을 위하여’를 검증된 본문 복원 및 영어 POB 감사 기록에 따라 회복했습니다. 동시에 ‘명절’ 대신 제정된 종교적 기념일에 더 알맞은 ‘절기’를 사용하고, 문장 구조를 현대 한국어 합쇼체에 맞게 다듬었습니다.
