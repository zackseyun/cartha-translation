  text: the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.
  footnotes:
  - marker: a
    text: Or 'as festivals forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 산봉우리들이 드러나자 노아는 기뻐했습니다. 그러므로 그는 그것들을 자신을 위하여 영원히 기념할 절기들로 정하였고, 이와 같이 그것들은 정해졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “영원한 절기들로”.
    reason: 영어 POB 감사 기록의 대안 번역(“as festivals forever”)을 보존합니다. 본문은 복원된 게에즈 구절의 ‘기념을 위하여’를 반영합니다.
lexical_decisions:
- source_word: أرْئِسْتِي / tops of the mountains
  english_pob_choice: the tops of the mountains appeared
  chosen_korean: 산들의 꼭대기들이 나타났고
  alternatives_korean:
  - 산꼭대기들이 드러났고
  - 산들의 봉우리들이 나타났고
  lexicon: 산들 / 꼭대기
  rationale: Geez 원문과 영어 POB의 핵심 이미지를 그대로 살려, ‘산들의 꼭대기들’이 물러난 홍수 뒤에 드러난 지점을 직역에 가깝게 옮겼습니다.
- source_word: ተፈሥሐ፡ ኖኅ።
  english_pob_choice: Noah rejoiced
  chosen_korean: 노아는 기뻐했습니다
  alternatives_korean:
  - 노아가 즐거워했습니다
  - 노아는 크게 기뻐했습니다
  lexicon: 기뻐하다
  rationale: 동사의 기본 의미를 자연스러운 현대 한국어로 옮기되, 서술체의 절제된 톤을 유지했습니다.
- source_word: ሠርዓን፡ ኪያሆን፡
  english_pob_choice: he ordained them for himself
  chosen_korean: 그는 그것들을 자신을 위해 영원한 명절들로 제정하였고
  alternatives_korean:
  - 그는 그것들을 자신에게 속한 영원한 절기로 정하였고
  - 그는 그것들을 자신을 위해 영원한 축제들로 마련하였고
  lexicon: 제정하다
  rationale: Geez의 ‘정하다/제정하다’ 계열 의미를 따라, 단순한 관습 형성이 아니라 규범적 제정임을 드러내는 ‘제정하였고’를 택했습니다.
- source_word: በዓላተ፡ ለተዝካር፡ ለዓለም፡
  english_pob_choice: as festivals for remembrance forever
  chosen_korean: 영원한 명절들로
  alternatives_korean:
  - 기억을 위한 영원한 절기로
  - 영원히 기념하는 명절들로
  lexicon: 명절
  rationale: 영어 POB의 ‘festivals’는 단순 휴일이 아니라 경축일의 성격을 가지므로, 한국어에서는 교회 전통어보다 중립적인 ‘명절들’이 원문의 반복적·공적 성격을 잘 살립니다.
theological_decisions:
- issue: ‘for remembrance’의 반영 여부
  chosen_reading: 본문에는 별도의 ‘기억/기념’ 표현을 두지 않고 ‘영원한 명절들’로 간명하게 옮겼습니다.
  alternative_readings:
  - 영원한 기억의 명절들로
  - 기념을 위한 영원한 절기로
  rationale: 제공된 Geez 본문 조각과 영어 POB 간에 보존 상태 차이가 있으나, 현재 원문 조각에 직접 확인되는 표현만으로는 ‘기억’을 본문에 삽입하기보다, 확인 가능한 핵심 의미를 우선 반영하는 편이 안전합니다.
  doctrine_reference: 텍스트 비평/본문 확정
