base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/012.yaml
  text: 'And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.'
translation:
  language: ko
  text: 이 증언은 너희를 두고 기록된 것이니, 너희는 이를 언제나 지켜야 합니다. 곧 너희는 땅이 존속하는 모든 날 동안 짐승이나 새나 가축의 어떤 피도 먹어서는 안 됩니다. 그리고 땅이 존속하는 모든 날 동안 짐승이나 가축이나 새의 피를 먹는 사람은 그와 그의 자손이 땅에서 뿌리째 뽑힐 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ*ጽሕፍት፡ ... ላዕሌክሙ፡
  english_pob_choice: this testimony is written concerning you
  chosen_korean: 이 증언은 너희를 위해 기록되어 있으니
  alternatives_korean:
  - 이 증언은 너희에 관하여 기록되어 있으니
  - 이 증언은 너희를 두고 기록되어 있으니
  lexicon: 증언 / 기록되어 있으니
  rationale: Geez의 ጽሕፍት은 단순한 ‘글’보다 권위 있는 기록된 증언의 뉘앙스가 있어, POB의 "testimony"를 따라 ‘증언’으로 옮겼습니다. ላዕሌክሙ는 직접 목적보다 ‘너희를 향한/너희를 위해’의 방향성을 띠어 문맥상 자연스럽게 처리했습니다.
- source_word: ከመ፡ ትዕቀብዋ፡ ኵሎ፡ መዋዕለ፡
  english_pob_choice: so that you may keep it always
  chosen_korean: 너희는 그것을 항상 지켜야 합니다
  alternatives_korean:
  - 너희가 그것을 언제나 지켜야 하도록
  - 너희가 그것을 늘 지키게 하려는 것입니다
  lexicon: 항상 지켜야 합니다
  rationale: 목적절을 한국어에서 자연스럽게 옮기기 위해 결과/의무 표현으로 정리했습니다. ትዕቀብዋ는 단순 보관이 아니라 규범을 준수하는 뜻이므로 ‘지키다’가 적절합니다.
- source_word: ኢትብልዑ፡ ... ደመ፡
  english_pob_choice: you must not eat any blood
  chosen_korean: 너희는 ... 어떤 피도 먹어서는 안 됩니다
  alternatives_korean:
  - 너희는 ... 피를 먹지 말아야 합니다
  - 너희는 ... 한 방울의 피도 먹어서는 안 됩니다
  lexicon: 피 / 먹어서는 안 됩니다
  rationale: 직역적 금지를 살리되 한국어에서 명령형보다 규범적 금지로 표현했습니다. ደመ는 반복적으로 ‘피’를 뜻하므로 전통적 회피 없이 직접 번역했습니다.
- source_word: ይስሮ፡ ... ወዘርኡ፡ እምድር።
  english_pob_choice: he and his seed shall be rooted out from the earth
  chosen_korean: 그와 그의 자손이 땅에서 끊어질 것입니다
  alternatives_korean:
  - 그와 그의 씨가 땅에서 뽑혀 나갈 것입니다
  - 그와 그의 후손이 땅에서 뿌리째 뽑힐 것입니다
  lexicon: 끊어질 것입니다 / 자손
  rationale: POB의 "rooted out"는 단순 추방보다 존재가 제거되는 강한 심판을 뜻하므로 ‘끊어지다’로 옮겼습니다. ዘር는 문맥상 ‘자손’이 자연스러워 혈통적 후속성을 드러냈습니다.
theological_decisions:
- issue: 피 금지의 범위
  chosen_reading: 본문은 동물의 혈액 섭취를 모든 시대(‘땅의 모든 날들’)에 금하는 규범으로 제시합니다.
  alternative_readings:
  - 특정 제의적 맥락에 한정된 금지
  - 노아 언약적 보편 규례로 읽는 해석
  rationale: Geez와 POB 모두 시간 범위를 넓게 반복해 강조하므로, 한국어도 보편적 지속 규범으로 드러냈습니다.
  doctrine_reference: Jubilees 6:12; POB audit text
