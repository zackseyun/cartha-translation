revisions:
- from: 이 증언은 너희를 위해 기록되어 있으니, 너희는 그것을 항상 지켜야 합니다. 곧 너희는 땅 위의 모든 날 동안 짐승이나 새나 가축의 어떤 피도 먹어서는 안 됩니다. 그리고 땅 위의 모든 날 동안 짐승이나 가축이나 새의 피를 먹는 사람은 그와 그의 자손이 땅에서 끊어질 것입니다.[a][b]
  to: 이 증언은 너희를 두고 기록된 것이니, 너희는 이를 언제나 지켜야 합니다. 곧 너희는 땅이 존속하는 모든 날 동안 짐승이나 새나 가축의 어떤 피도 먹어서는 안 됩니다. 그리고 땅이 존속하는 모든 날 동안 짐승이나 가축이나 새의 피를 먹는 사람은 그와 그의 자손이 땅에서 뿌리째 뽑힐 것입니다.
  rationale: The revision corrects the relation expressed by “concerning you,” preserves the enduring scope of “all the days of the earth,” and retains the rooted-out imagery of the judgment. It also removes unsupported footnote anchors. No doctrinal interpretation has been added.
  reviewer_model: gpt-5.6-terra
