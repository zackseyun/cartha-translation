  text: ወ*ጽሕፍት፡¹⁴ ዛቲ፡ ስምዕ፡ ላዕሌክሙ፡ ከመ፡ ትዕቀብዋ፡ ኵሎ፡ መዋዕለ፡ ከመ፡ ኢትብልዑ፡ በኵሉ፡ መዋዕል፡ ኵሎ፡ ደመ፡ አራዊት፡ ወአዕዋፍ፡ ወእንስሳ፡¹⁵ በኵሉ፡¹⁶ መዋዕለ፡ ምድር፡ ወሰብእ፡ ዘ*በልዐ፡ ደመ፡ አርዌ፡¹⁷ ወዘእንስሳ፡ ወዘአዕዋፍ፡ በኵሉ፡ መዋዕለ፡ ምድር፡ ይስሮ፡¹⁸ ውእቱ፡ ወዘርኡ፡ እምድር።
