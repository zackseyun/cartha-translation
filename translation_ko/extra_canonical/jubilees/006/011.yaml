  yaml_path: translation/extra_canonical/jubilees/006/011.yaml
  text: Therefore I have said that you also shall make a covenant with the children of Israel in this month on the mountain, with an oath; and you shall sprinkle blood on them because of all the words of the covenant that God made with them for all days.
translation:
  language: ko
  text: 그러므로 내가 말하였습니다. 너도 이 달에 그 산에서 이스라엘 자손과 언약을 맺고, 맹세와 명령을 그들에게 부과하며, 하나님께서 그들과 영원히 세우신 언약의 모든 말씀 때문에 그들에게 피를 뿌리십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን / covenant
  english_pob_choice: covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 맹약
  lexicon: standard biblical covenant terminology
  rationale: Geez ኪዳን은 성경 문맥에서 하나님과 백성 사이의 언약을 가리키므로, 한국어에서는 관용적이면서도 신학적 무게를 유지하는 ‘언약’이 가장 적절합니다.
- source_word: በዝ፡ ወርኅ፡ / in this month
  english_pob_choice: in this month
  chosen_korean: 이 달에
  alternatives_korean:
  - 이 달 안에
  - 이번 달에
  lexicon: temporal expression
  rationale: 달력상의 특정 시점을 자연스럽게 옮기되, 원문의 시간 지시를 그대로 살려 ‘이 달에’로 번역했습니다.
- source_word: በዲበ፡ ደብር፡ / on the mountain
  english_pob_choice: on the mountain
  chosen_korean: 산에서
  alternatives_korean:
  - 산 위에서
  - 그 산에서
  lexicon: locative expression
  rationale: 문맥상 장소 표지로서 산을 가리키므로, 한국어에서는 사건의 배경을 자연스럽게 드러내는 ‘산에서’로 옮겼습니다.
- source_word: ማሕላ / oath
  english_pob_choice: with an oath
  chosen_korean: 맹세와 함께
  alternatives_korean:
  - 맹세로
  - 맹세를 가지고
  lexicon: biblical oath terminology
  rationale: ‘맹세’는 서원보다 일반적이고, 원문의 동반 수단 표현을 살려 ‘와 함께’를 붙여 번역했습니다.
- source_word: እግዚአብሔር / God
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 주님
  lexicon: project default for Θεός/ʾĔlōhîm equivalents
  rationale: 히브리어/게즈 전승에서 하나님을 지칭하는 표준 번역으로 ‘하나님’을 유지하여, POB의 용례와 일치시켰습니다.
theological_decisions:
- issue: 언약 체결의 주체와 명령형의 방향
  chosen_reading: 화자는 자신이 이미 말한 내용을 근거로, 청자에게 이스라엘 자손과 언약을 맺으라고 명령하는 구조로 옮겼습니다.
  alternative_readings:
  - ‘그러므로 내가 말하였다’로 더 직설적으로 옮김
  - ‘너도’의 강조를 약화시킴
  rationale: 원문과 영어 POB 모두 ‘Therefore I have said that you also shall make…’의 논리를 가지므로, 화자의 선행 발언과 청자에 대한 명령을 분명히 드러내는 것이 중요합니다.
  doctrine_reference: covenant theology; narrative imperative
- issue: 피 뿌림의 의례적 의미
  chosen_reading: ‘그들에게 피를 뿌려야 합니다’로 직역적이되, 의례 행위의 강도를 유지했습니다.
  alternative_readings:
  - ‘피를 뿌리십시오’로 더 직접적 명령화
  - ‘피로 그들을 정결하게 하십시오’처럼 의미를 확장
  rationale: 원문은 정결의 해석을 덧붙이지 않고 단순히 피를 뿌리는 행위를 말하므로, 의미를 확장하지 않고 예식적 동작 자체를 보존했습니다.
  doctrine_reference: ritual covenant ratification
