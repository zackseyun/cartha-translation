revisions:
- from: 그러므로 내가 말하였노니, 너도 이 달에 산에서 이스라엘 자손과 언약을 맺되, 맹세와 함께 해야 하며, 하나님께서 그들과 맺으신 언약의 모든 말씀 때문에 그들에게 피를 뿌려야 합니다.[a]
  to: 그러므로 내가 말하였습니다. 너도 이 달에 그 산에서 이스라엘 자손과 언약을 맺고, 맹세와 명령을 그들에게 부과하며, 하나님께서 그들과 영원히 세우신 언약의 모든 말씀 때문에 그들에게 피를 뿌리십시오.
  rationale: 원문에 명시된 ‘명령’을 복원하고, 그 명령이 이스라엘 자손에게 부과된다는 관계를 분명히 했습니다. 또한 현대 합쇼체의 직접 지시문으로 문체를 통일했습니다. ‘영원히’는 ‘모든 날 동안’이라는 원문의 지속성을 자연스럽게 반영하며, 피 뿌림의 의례적 의미는 해설 없이 그대로 유지했습니다. 내용 없는 [a] 앵커는 제거했습니다.
