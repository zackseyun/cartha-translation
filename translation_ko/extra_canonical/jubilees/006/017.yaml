  lexicon: legal/administrative passive
  rationale: 하늘의 판에 적힌 규범이라는 법적·공식적 뉘앙스를 살려 ‘제정되다’와 ‘기록되다’를 함께 유지했습니다.
- source_word: ጽላተ፡ ሰማይ፡ / the heavenly tablets
