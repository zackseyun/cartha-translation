  text: For this reason it is ordained and written on the heavenly tablets that they should celebrate the Feast of Weeks in this month, once each year, to renew the covenant every year.
translation:
  language: ko
  text: 이러한 까닭에, 그들이 이 달에 해마다 한 번 칠칠절을 지켜 해마다 언약을 새롭게 하도록 하늘의 판들에 정해져 기록되어 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ፡ / For this reason
  english_pob_choice: For this reason
  chosen_korean: 이런 이유로
  alternatives_korean:
  - 그러므로
  - 이 때문에
  lexicon: source connective
  rationale: 원인-결과 연결을 자연스럽게 드러내되, 문맥상 앞선 규정의 근거를 가리키는 표현으로 옮겼습니다.
- source_word: ተሠርዐ፡ ወ*ተጽሕፈ፡ / it is ordained and written
