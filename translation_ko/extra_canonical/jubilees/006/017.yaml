  source_fidelity: 핵심 의미는 충실합니다. 다만 원문/영문이 ‘그들이 … 지키도록’이라는 내용절을 하늘의 판에 정해지고 기록된 대상으로 제시하는 구조인데, 초안의 ‘그것이’는 지시 대상이 불명확합니다. 또한 원문의 복수 ‘heavenly tablets’를 ‘판들’로 반영하는 편이 더 정확합니다.
  naturalness: ‘그것이 하늘의 판에 제정되고’는 한국어에서 무엇이 제정되었는지 다소 모호하고 어색합니다. 내용절을 직접 제시하고 ‘정해져 기록되어 있습니다’로 옮기면 현대 표준 합쇼체로 자연스럽습니다.
  terminology: ‘칠칠절’과 ‘언약’은 적절합니다. ‘하늘의 판들’은 천상 기록판이라는 고정적 이미지를 유지하면서 원문의 복수도 살립니다.
  issues:
