  to: 이러한 까닭에, 그들이 이 달에 해마다 한 번 칠칠절을 지켜 해마다 언약을 새롭게 하도록 하늘의 판들에 정해져 기록되어 있습니다.
  rationale: 불명확한 지시어와 내용 없는 각주 표지를 제거하고, ‘그들이 … 하도록’이라는 원문의 내용절 구조를 직접 드러냈습니다. 축제명과 언약 갱신의 표현은 유지했으며, ‘해마다 한 번’과 ‘해마다’의 반복도 원문에 따라 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:16Z'
