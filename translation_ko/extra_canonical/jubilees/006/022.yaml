  terminology: ‘절기’, ‘정해진 때’, ‘제사’, ‘기념’은 적절합니다. ‘율법책’은 가능하지만 여기서는 ‘첫 율법의 책’으로 옮겨 ‘book of the first law’의 의미를 보존합니다.
