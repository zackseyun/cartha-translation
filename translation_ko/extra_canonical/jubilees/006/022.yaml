revisions:
- from: 이 절기를, 그것에 관하여 기록되고 정해진 대로 지키십시오. 내가 첫 번째 율법책에 너를 위하여 기록한 것은, 네가 정한 때에, 해마다 하루 동안 그것을 지키게 하려는 것이었습니다. 그리고 나는 그 제사들에 대해 너에게 말하였으니, 그것들이 기념이 되게 하며, 이스라엘 자손이 그것을…[a][b]
  to: 이 절기는 그것에 관하여 기록되고 정해진 대로 지키십시오. 내가 너를 위하여 기록한 첫 율법의 책에, 네가 정한 때에 해마다 하루 동안 그것을 지키도록 기록하였습니다. 또 그 제사들에 관하여 너에게 일러 주었으니, 그것들이 기념이 되게 하고 이스라엘 자손이 그것을 …에서 지키게 하려는 것이었습니다.
  rationale: 불명확한 둘째 문장의 수식 관계를 원문에 맞게 정리하고, 원문에 없는 ‘대대로’를 보충하지 않았습니다. 마지막 ‘…에서’는 게즈어 ውስተ가 다음 절 첫머리와 이어지는 절 경계를 반영합니다. 근거 없는 각주 표지는 삭제했습니다. 찰스 판본의 첫 낱말은 전승상 문제로 지적되지만, 한국어 문장은 접속사를 덧붙이지 않아 그 논쟁적 복원을 강제하지 않습니다.
