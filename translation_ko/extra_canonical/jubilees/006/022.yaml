translation:
  language: ko
  text: 이 절기는 그것에 관하여 기록되고 정해진 대로 지키십시오. 내가 너를 위하여 기록한 첫 율법의 책에, 네가 정한 때에 해마다 하루 동안 그것을 지키도록 기록하였습니다. 또 그 제사들에 관하여 너에게 일러 주었으니, 그것들이 기념이 되게 하고 이스라엘 자손이 그것을 …에서 지키게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዛቲ በዓል
  english_pob_choice: For this festival
  chosen_korean: 이 절기
  alternatives_korean:
  - 이 축제
  - 이 명절
  lexicon: 절기
  rationale: 게즈어 በዓል은 단순한 ‘축제’보다 정해진 종교적 기념일의 뜻이 강하므로, 문맥에 맞게 ‘절기’로 옮겼습니다.
- source_word: በከመ ጽሑፍ ወቍሩጽ
  english_pob_choice: as it is written and ordained
  chosen_korean: 기록되고 정해진 대로
  alternatives_korean:
  - 기록되고 규정된 대로
  - 기록되고 명령된 대로
  lexicon: כתב/정하다 계열
  rationale: 기록됨과 함께 제정·규정됨을 함께 살려, 본문이 단순한 문자 기록이 아니라 공적으로 정해진 질서를 가리킨다는 점을 반영했습니다.
- source_word: መጽሐፈ ሕግ
  english_pob_choice: book of the first law
  chosen_korean: 첫 번째 율법책
  alternatives_korean:
  - 첫 율법책
  - 맨 처음의 율법책
  lexicon: book of the law
  rationale: 영어 본문의 ‘first law’를 직역하되, 문맥상 ‘율법책’으로 처리하여 전승 초반의 규범 문서를 가리키는 느낌을 살렸습니다.
- source_word: ይኩኑ ዝክራነ
  english_pob_choice: they should be a memorial
  chosen_korean: 그것들이 기념이 되게
  alternatives_korean:
  - 그것들이 기억이 되게
  - 그것이 기념이 되게
  lexicon: 기념/기억
  rationale: 제사 자체가 기억을 환기하는 표지가 된다는 뜻을 살려, 의도와 기능을 드러내는 ‘기념’으로 옮겼습니다.
theological_decisions:
- issue: 절기 준수의 규범적 어조
  chosen_reading: 명령형으로 옮겨 이 절기가 단순 권고가 아니라 지켜야 할 규정임을 드러냈습니다.
  alternative_readings:
  - 서술형으로 완화
  - 권면형으로 완화
  rationale: 게즈어 본문과 영어 본문 모두 절기의 준수를 분명히 명령하므로, 한국어에서도 규범성을 약화하지 않았습니다.
  doctrine_reference: 제의 규정의 권위와 의무성
- issue: 문장 끝의 미완결 처리
  chosen_reading: 마지막의 전치사구를 한국어에서 줄임표로 남겨 다음 절과의 연결을 보이게 했습니다.
  alternative_readings:
  - 문장을 임의로 완결
  - 다음 절의 내용을 끌어와 완역
  rationale: 원문과 영어 감사본이 모두 다음 절로 이어지는 미완결 구조를 보이므로, 본문을 인위적으로 끝맺지 않았습니다.
  doctrine_reference: 본문 경계 보존
