  - 혐오스러운
  - 부정한
  lexicon: abominable
  rationale: 경멸·부정의 강한 मूल्य를 보존하기 위해 성서적 상투어에 가까운 ‘가증한’을 택했습니다.
- source_word: ርኵስተ፡
  english_pob_choice: unclean
  chosen_korean: 부정한
  alternatives_korean:
  - 더러운
  - 속된
  - 불결한
  lexicon: unclean
  rationale: 의례적/정결 범주를 나타내는 원어의 의미에 맞춰 ‘부정한’으로 옮겼습니다.
- source_word: ወይገብሩ፡ ... ወ*ኵሎ፡ ... ይደምሩ፡
  english_pob_choice: they will mix up all the holy days with the unclean, and the unclean day with the holy
  chosen_korean: 모든 거룩한 날들과 부정한 날들을 뒤섞고, 부정한 날을 거룩한 날과 뒤섞을 것입니다
  alternatives_korean:
  - 모든 거룩한 날들과 부정한 날들을 섞고, 부정한 날을 거룩한 날과 섞을 것입니다
  - 모든 성일과 속된 날을 뒤바꾸고
  lexicon: mix up
  rationale: 원문의 ‘뒤섞다’는 달력 질서의 혼동을 더 직접적으로 드러내므로 이를 유지했고, 반복 구조도 보존했습니다.
theological_decisions:
- issue: calendar holiness and reversal of order
  chosen_reading: 거룩한 날과 부정한 날의 경계를 의도적으로 뒤섞는 타락한 달력 질서의 붕괴로 옮겼습니다.
  alternative_readings:
  - 단순히 예식일을 혼동하는 정도로 완화
  - 도덕적 부패 일반론으로 확장
  rationale: 문맥상 달·안식일·절기·희년의 질서가 핵심이므로, 달력의 거룩함이 전도되는 긴장을 유지했습니다.
  doctrine_reference: 제2성전 유대교 달력 전통과 절기 질서
