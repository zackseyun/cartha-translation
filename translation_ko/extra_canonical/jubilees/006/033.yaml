  text: 그리고 이스라엘의 모든 자손은 잊어버리고 연대의 길을 찾지 못하며, 신월과 지정된 때와 안식일을 잊어버리고, 연대의 온 질서에 대하여 어긋나게 될 것입니다.[a]
