lexical_decisions:
- source_word: ወአንትሙኒ
  english_pob_choice: And as for you
  chosen_korean: 너희는
  alternatives_korean:
  - 너희 또한
  - 그리고 너희는
  lexicon: second person plural pronoun
  rationale: 문맥상 직접 지시하는 2인칭 복수 대상을 분명히 드러내기 위해 간결하게 ‘너희는’으로 옮겼습니다.
- source_word: ለሀቁ
  english_pob_choice: be fruitful
  chosen_korean: 생육하고
  alternatives_korean:
  - 열매를 맺고
  - 번성하고
  lexicon: fruitfulness / be fruitful
  rationale: ‘be fruitful’의 기본 의미를 살려 생명·번식의 결과를 나타내는 ‘생육하다’를 택했습니다.
- source_word: ወ*ብዙአ
  english_pob_choice: multiply
  chosen_korean: 번성하십시오
  alternatives_korean:
  - 많아지십시오
  - 불어나십시오
  lexicon: increase / multiply
  rationale: 뒤이은 동사는 단순한 증가보다 수적 확장을 나타내므로 ‘번성하다’로 자연스럽고 의미 있게 번역했습니다.
- source_word: ዲበ፡ ምድር
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅 위에
  - 이 땅에서
  lexicon: earth / land
  rationale: 원문의 ‘위에/위에서’라는 관계를 살리면서 한국어에서 더 자연스러운 장소 부사구로 정리했습니다.
theological_decisions:
- issue: 명령형 어조의 보존
  chosen_reading: 명령으로 주어진 축복/파송의 어조를 살려 ‘하십시오’체로 번역했습니다.
  alternative_readings:
  - 평서형으로 완화하여 ‘너희는 생육하고 번성합니다’
  - 권유형으로 ‘생육하고 번성하시오’
  rationale: 원문은 단순 묘사가 아니라 후손에게 주는 직접 명령이므로, 한국어에서도 권고보다 지시의 힘을 유지하는 것이 맞습니다.
  doctrine_reference: 창세기적 축복-명령 전통
