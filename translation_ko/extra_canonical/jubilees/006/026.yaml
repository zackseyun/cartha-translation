translation:
  language: ko
  text: 그 위에 땅이 마르자, 그는 그것을 열어 땅을 보았습니다. 넷째 달 초하루에는 아래 깊은 곳, 곧 심연의 입들이 닫혔습니다. 그리고 일곱째 달 초하루에는 모든 입들이 열렸습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የብሰት ምድር
  english_pob_choice: the earth became dry
  chosen_korean: 땅이 마르자
  alternatives_korean:
  - 땅이 말랐습니다
  - 땅이 건조해졌습니다
  lexicon: 마르다
  rationale: 결과 상태를 자연스러운 서술로 옮기되, 원문의 ‘dry’라는 상태 변화를 분명히 드러냈습니다.
- source_word: ወአርኀወ
  english_pob_choice: and he opened it
  chosen_korean: 그는 그것을 열어
  alternatives_korean:
  - 그는 그것을 열었습니다
  - 그것을 열고
  lexicon: 열다
  rationale: 이 동사는 직전의 대상인 지면/땅의 맥락을 이어받는 대명사적 지시를 반영하여 ‘그것’을 두었습니다.
- source_word: አፈ መዓምቅቲሃ / ቀላይ ታሕቲት
  english_pob_choice: the mouths of the depths of the abyss beneath
  chosen_korean: 아래 깊은 곳, 곧 심연의 입들
  alternatives_korean:
  - 심연 아래의 깊은 곳의 입들
  - 아래의 심연의 입들
  lexicon: 심연 / 입
  rationale: ‘입들’은 물길·틈·출입구의 복수 이미지를 살리는 직역적 표현이며, ‘아래 깊은 곳’은 위치를 풀어 설명해 한국어 독자가 이해하기 쉽도록 했습니다.
- source_word: ተርኅወ
  english_pob_choice: were opened
  chosen_korean: 열렸습니다
  alternatives_korean:
  - 열리게 되었습니다
  - 개방되었습니다
  lexicon: 열리다
  rationale: 능동이 아닌 수동형 완료를 살려, 출처의 문법적 사건 전개를 그대로 반영했습니다.
theological_decisions:
- issue: 서술이 미완성인 채 끝나는 절의 처리
  chosen_reading: 일곱째 달 초하루에는 모든 입들이 열렸습니다.
  alternative_readings:
  - 일곱째 달 초하루에는 모든 입들이 열렸습니다…
  - 일곱째 달 초하루에는 모든 입들이 열렸습니다—
  rationale: 제공된 원문과 영어 POB가 모두 문장을 완결하지 않은 상태이므로, 부족한 말은 보태지 않고 끊긴 상태를 보존하되 본문은 자연스러운 종결형으로 옮겼습니다.
  doctrine_reference: text-critical restraint; source-bound translation
- issue: ‘심연’과 ‘아래 깊은 곳’의 이중 표현
  chosen_reading: 아래 깊은 곳, 곧 심연의 입들
  alternative_readings:
  - 심연 아래의 입들
  - 아래 깊은 심연의 입들
  rationale: 원문의 겹친 위치·깊이 표현을 한 번은 풀어 말하고 한 번은 핵심 용어로 남겨, 서술의 중첩을 약화시키지 않았습니다.
  doctrine_reference: source semantics and rhetorical preservation
