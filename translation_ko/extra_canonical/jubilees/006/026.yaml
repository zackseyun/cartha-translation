translation:
  language: ko
  text: 그 날에 땅이 말랐고, 그는 그것을 열고 땅을 보았습니다. 넷째 달 초하루에는 아래 심연의 깊은 곳들의 입구들이 닫혔습니다. 그리고 일곱째 달 초하루에는 모든 입구들이 열렸습니다—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 게에즈 본문은 여기서 끝나며, ‘모든 입구들’ 뒤에 이어질 수식어는 이 발췌문에 보존되어 있지 않습니다.
    reason: 영어 POB 감사 이력과 게에즈 발췌문 모두 마지막 절이 속격구 도중에 절단된 상태임을 보여 줍니다. 대시와 주석은 빠진 내용을 추정하여 보충하지 않고 그 상태를 명시합니다.
