revisions:
- from: 그리고 이 모든 절기는 창조의 날부터 노아의 시대까지 하늘에서 지켜졌습니다 — 곧 26희년과 5주간의 해입니다. 노아와 그의 아들들은 그것을 7희년과 1주간의 해 동안 지켰는데, 이는 노아가 죽는 날까지였습니다. 노아가 죽은 날부터는 그의 아들들이 그것을 더럽혔고, 아브라함의 시대까지 이르러서는 피를 먹었습니다.[a]
  to: 이 모든 절기는 창조의 날부터 노아의 시대까지 하늘에서 지켜졌습니다. 곧 26희년과 다섯 해의 주간[a]이었습니다. 노아와 그의 아들들은 노아가 죽는 날까지 일곱 희년과 한 해의 주간 동안 그것을 지켰습니다. 노아가 죽은 날부터 그의 아들들은 아브라함의 시대까지 그것을 훼손하고 피를 먹었습니다.
  rationale: 원문의 연대 계산과 절기 준수라는 의미를 유지하면서, ‘해의 주간’에 설명 주석을 붙였습니다. 또한 마지막 문장을 재구성하여 노아의 아들들이 아브라함 시대까지 절기를 훼손하고 피를 먹었다는 원문의 시간적·문법적 연결을 보존했습니다.
