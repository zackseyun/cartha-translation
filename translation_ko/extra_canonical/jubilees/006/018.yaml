base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006/018.yaml
  text: And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah's death. And from the day of Noah's death his sons corrupted it until the days of Abraham, and they ate blood.
translation:
  language: ko
  text: 이 모든 절기는 창조의 날부터 노아의 시대까지 하늘에서 지켜졌습니다. 곧 26희년과 다섯 해의 주간[a]이었습니다. 노아와 그의 아들들은 노아가 죽는 날까지 일곱 희년과 한 해의 주간 동안 그것을 지켰습니다. 노아가 죽은 날부터 그의 아들들은 아브라함의 시대까지 그것을 훼손하고 피를 먹었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해의 주간’은 일곱 해로 이루어진 기간 단위입니다.
    reason: ‘weeks of years’라는 본문의 특수 연대 단위를 명료하게 설명합니다.
lexical_decisions:
- source_word: ዛቲ፡ በዓል
  english_pob_choice: this whole festival
  chosen_korean: 이 모든 절기
  alternatives_korean:
  - 이 절기 전체
  - 이 모든 축제
  lexicon: በዓል
  rationale: 원문의 단수 표현을 영어 POB의 의미대로 집합적 개념으로 풀어, 하늘에서 지켜진 특정 절기 전통 전체를 자연스럽게 나타냈습니다.
- source_word: ትትገበር፡ በሰማይ
  english_pob_choice: was celebrated in heaven
  chosen_korean: 하늘에서 지켜졌습니다
  alternatives_korean:
  - 하늘에서 행해졌습니다
  - 하늘에서 기념되었습니다
  lexicon: ትትገበር
  rationale: 동사의 핵심은 단순한 사건 발생이 아니라 ‘실행/준수’에 있어, 절기 문맥에 맞게 ‘지켜지다’로 옮겼습니다.
- source_word: ዐሥራ፡ ወስድስተ፡ ኢዮቤልዉ፡ ወሱባዔ፡ ዓመት፡ ኃምስተ
  english_pob_choice: twenty-six jubilees and five weeks of years
  chosen_korean: 26희년과 5주간의 해
  alternatives_korean:
  - 26희년과 5주기의 해
  - 26희년과 5주간
  lexicon: ኢዮቤልዉ / ወሱባዔ፡ ዓመት
  rationale: 고유한 연대 단위는 음역형 ‘희년’을 유지하고, ‘weeks of years’는 문맥상 표준적인 연대 단위인 ‘주간의 해’로 간명하게 반영했습니다.
- source_word: ወ*ደቂቁ፡ ሰብዓተ፡ ኢዮቤልዉ
  english_pob_choice: his sons kept it for seven jubilees
  chosen_korean: 그의 아들들은 그것을 7희년 동안 지켰는데
  alternatives_korean:
  - 그의 아들들은 그것을 7희년을 지켰는데
  - 그의 아들들은 그것을 7희년 동안 준수했는데
  lexicon: ወደቂቁ
  rationale: 행위의 대상이 절기 자체의 준수이므로 ‘지켰다’가 가장 자연스럽고 문맥에 맞습니다.
theological_decisions:
- issue: 노아의 아들들이 절기를 ‘더럽혔다’는 표현
  chosen_reading: 노아의 죽음 이후 그 아들들이 그 절기를 더럽혔다고 직설적으로 옮겼습니다.
  alternative_readings:
  - 그것을 어겼다
  - 그것을 훼손했다
  rationale: 원문과 영어 POB 모두 전통을 단순히 소홀히 한 정도가 아니라 부정하게 만든다는 강한 도덕적 평가를 담고 있어 이를 약화하지 않았습니다.
  doctrine_reference: 전승의 타락과 언약 표지의 오염에 대한 본문 자체의 윤리적 진술
