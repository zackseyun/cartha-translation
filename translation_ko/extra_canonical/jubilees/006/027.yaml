theological_decisions:
- issue: 우주적 심판 서술의 이미지 유지
  chosen_reading: ‘땅의 깊은 곳들이 열렸고, 물들이 그 속으로 내려가기 시작했습니다’로 재난의 물리적 개방과 하강 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로 완화해 ‘땅속이 드러났고 물이 빠지기 시작했습니다’라고 옮길 수 있음
  - 문학적으로 다듬어 ‘지하 깊은 곳이 열리고 물이 쏟아져 들어가기 시작했습니다’라고 할 수 있음
  rationale: 본문은 홍수 사건의 전개를 묘사하는 서술이므로, 비유화나 완화 없이 사건성을 드러내는 쪽이 독자 이해에 더 충실합니다.
  doctrine_reference: 창세기 7장 홍수 전승과의 상호본문성
