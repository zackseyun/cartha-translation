  text: 'as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the Feast of Weeks, and it is the Feast of Firstfruits. It is of two kinds and of a double nature.'
translation:
  language: ko
  text: 그들에게는 해마다 이 달의 하루에 이 절기를 지키라는 명령이 있습니다. 이는 칠칠절이며 첫 열매의 절기입니다. 이 절기는 두 가지 절기이며, 이중의 성격을 지닙니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓለ፡ ባቲ። እስመ፡
  english_pob_choice: 'as a command for them: ... For it is...'
  chosen_korean: 그들에게는 ...라는 명령입니다. 그것은 ...입니다.
  alternatives_korean:
  - '그들에게 명령으로: ...'
  - '그들을 위한 규정으로: ...'
  lexicon: 명령 / 절기
  rationale: 서두의 지시성은 한국어에서 자연스럽게 풀어 '명령'으로 옮기되, 뒤의 설명문과 구분되도록 문장 경계를 분명히 했습니다.
- source_word: በዓለ፡ ሱባዔያት
  english_pob_choice: the Feast of Weeks
  chosen_korean: 칠칠절
  alternatives_korean:
  - 주간들의 절기
  - 오순절
  lexicon: 절기명
  rationale: 게에즈 원문의 'weeks'에 대응하는 전통적 절기명은 칠칠절이므로 이를 채택했습니다. 오순절은 신약적 관용이 강해 여기서는 덜 직접적입니다.
- source_word: ቀዳሜ፡ ፍሬ
  english_pob_choice: the Feast of Firstfruits
  chosen_korean: 첫 열매의 절기
  alternatives_korean:
  - 처음 열매의 절기
  - 초실절
  lexicon: 절기명
  rationale: 직역에 충실한 '첫 열매'를 사용해 원문의 구성요소를 드러냈고, 절기명으로서의 의미를 보존했습니다.
- source_word: ክልኤ፡ ... ወለክልኤ
  english_pob_choice: It is of two kinds and of a double nature.
  chosen_korean: 두 가지 성격을 지닌 절기이며, 이중적인 성격을 가집니다.
  alternatives_korean:
  - 두 가지 종류이며 이중의 본성을 지닙니다.
  - 둘로 된 절기이며 이중의 성격을 가집니다.
  lexicon: 두 겹의 서술
  rationale: 원문과 POB가 반복하는 '두 가지/이중' 표현을 모두 살리되, 한국어에서는 '성격'으로 자연스럽게 통합해 중복을 드러냈습니다.
theological_decisions:
- issue: 절기명 'Feast of Weeks'와 'Feast of Firstfruits'의 한국어 표기
  chosen_reading: 칠칠절 / 첫 열매의 절기
  alternative_readings:
  - 오순절 / 초실절
  rationale: 이 구절은 창세기/레위기적 절기 규정을 설명하는 문맥이므로, 신약 교회 전통 용어보다 원문의 절기 기능을 직접 보이는 번역이 더 적합합니다.
  doctrine_reference: 절기 용어의 역사적-문맥적 일치
- issue: 마지막 이중 서술의 중복 보존
  chosen_reading: 두 가지 성격을 지닌 절기이며, 이중적인 성격을 가집니다.
  alternative_readings:
  - 두 가지 종류이며 이중의 본성을 지닙니다.
  rationale: 원문은 단순 반복이 아니라 '두 가지/이중'의 강조를 통해 절기의 이중성을 강조하므로, 한국어에서도 중복을 일부 보존해 강조 효과를 유지했습니다.
  doctrine_reference: 문학적 반복의 보존
