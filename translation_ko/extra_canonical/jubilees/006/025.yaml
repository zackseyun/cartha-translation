translation:
  language: ko
  text: 그래서 그것들이 그에게 기념이 되었습니다. 그리고 첫째 달 초하루에 그는 방주를 만들라는 말을 들었습니다,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዝካረ
  english_pob_choice: a memorial
  chosen_korean: 기념
  alternatives_korean:
  - 기억
  - 기념물
  - 추모
  lexicon: Geez ተዝካረ
  rationale: 문맥상 단순한 기억이 아니라 어떤 사건이 계속 상기되게 하는 표지이므로 ‘기념’이 가장 자연스럽고 간결합니다.
- source_word: በሠርቀ ወርኅ
  english_pob_choice: on the new moon
  chosen_korean: 첫째 달의 초하루에
  alternatives_korean:
  - 새달에
  - 삭일에
  - 초승에
  lexicon: Geez lunar-date phrase
  rationale: 영문 POB의 ‘the new moon of the first month’를 따라, 달의 시작을 분명히 드러내는 한국어 관용인 ‘초하루’를 사용했습니다.
- source_word: ተብህለ ሎቱ
  english_pob_choice: it was said to him
  chosen_korean: 그에게 말해졌습니다
  alternatives_korean:
  - 그에게 일러졌습니다
  - 그에게 알려졌습니다
  - 그에게 명해졌습니다
  lexicon: Geez passive verbal construction
  rationale: 수동형을 살려 주체를 드러내지 않고 전달된 계시의 형식을 보존했습니다.
- source_word: ይግበር ታቦተ
  english_pob_choice: he should make the ark
  chosen_korean: 방주를 만들라고
  alternatives_korean:
  - 방주를 짓라고
  - 궤를 만들라고
  - 궤를 짓라고
  lexicon: Geez imperative/infinitive sense with ታቦተ
  rationale: 지시 내용의 목적을 자연스럽게 풀어 ‘-라고’로 옮겼고, 여기서는 ‘방주’가 독자의 이해에 가장 직접적입니다.
theological_decisions:
- issue: ‘기념’의 성격
  chosen_reading: 이 표현은 단순한 기억보다, 공동체의 기억을 지속시키는 표지/기념으로 이해해 번역했습니다.
  alternative_readings:
  - 기억
  - 추모
  rationale: 문맥이 사건의 기억을 남기는 기능을 가리키므로, 의미를 약화하지 않는 범위에서 ‘기념’으로 유지했습니다.
  doctrine_reference: 서사적 기억 표지의 기능
