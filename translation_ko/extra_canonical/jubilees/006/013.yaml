translation:
  language: ko
  text: 당신은 이스라엘 자손에게 모든 피를 먹지 말라고 명령하십시오. 그렇게 하여 그들의 이름과 그들의 씨가 항상 우리 하나님 야훼 앞에 있게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተ፡ አዝዞሙ፡
  english_pob_choice: And you, command
  chosen_korean: 당신은 … 명령하십시오
  alternatives_korean:
  - 그리고 당신은 … 명령하시오
  - 당신은 … 명령하시오
  lexicon: 직접 명령
  rationale: 원문은 2인칭 단수에게 주는 직접 명령이므로, 현대 합쇼체의 명령형으로 옮겼습니다.
- source_word: ለደቂቀ፡ እስራኤል፡
