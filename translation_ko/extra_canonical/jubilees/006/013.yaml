  - 이스라엘 사람들
  lexicon: 이스라엘 자손
  rationale: 혈연·언약 공동체를 가리키는 표준 성경 표현을 유지하되, 지나치게 일상적인 표현은 피했습니다.
- source_word: ኢይብልዑ፡ *ኵሎ፡ ደመ፡
  english_pob_choice: not to eat any blood
  chosen_korean: 모든 피를 먹지 말라고
  alternatives_korean:
