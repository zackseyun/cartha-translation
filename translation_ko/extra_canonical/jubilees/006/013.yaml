  source_fidelity: 게에즈어의 직접 명령, ‘이스라엘 자손’, 피 섭취의 전면 금지, 그리고 이름과 씨/후손이 하나님 앞에 항상 있게 된다는 목적절을 대체로 충실히 반영합니다. 다만 ‘모든 피를 먹지 말라’는 한국어에서 다소 부자연스럽고, 목적절의 연결을 더 분명히 할 필요가 있습니다.
