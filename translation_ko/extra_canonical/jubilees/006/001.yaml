- from: 그리고 셋째 달의 초하루에 그는 방주에서 나와 그 산 위에 제단을 쌓았습니다. 그리고 그는 땅을 위해 속죄하였고, 어린 숫염소를 가져다가 그 피로 땅의 모든 죄책을 속죄하였으니, 노아와 함께 방주 안에 있던 자들 외에는 그 위에 있던 모든 것이 멸망하였기 때문입니다.[a][b]
  to: 그리고 셋째 달의 초하루에 그는 방주에서 나와 그 산 위에 제단을 쌓았습니다. 그는 땅을 위하여 속죄하고, 어린 염소를 가져다가 땅의 모든 죄책을 위하여 그 피로 속죄하였습니다. 이는 노아와 함께 방주 안에 있던 이들 외에는 그 위에 있던 모든 것이 멸망하였기 때문입니다.
