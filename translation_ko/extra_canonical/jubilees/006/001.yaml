  text: And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.
translation:
  language: ko
  text: 그리고 셋째 달의 초하루에 그는 방주에서 나와 그 산 위에 제단을 쌓았습니다. 그리고 그는 땅을 위해 속죄하였고, 어린 숫염소를 가져다가 그 피로 땅의 모든 죄책을 속죄하였으니, 노아와 함께 방주 안에 있던 자들 외에는 그 위에 있던 모든 것이 멸망하였기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታቦት
  english_pob_choice: the ark
  chosen_korean: 방주
  alternatives_korean:
  - 궤
  - 배
  lexicon: Noahic ark
  rationale: 문맥상 노아의 방주를 가리키므로 한국어 성경에서 널리 쓰이는 ‘방주’를 사용해 의미를 분명히 했습니다.
- source_word: ምሥዋዐ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 단
  - 제물 바치는 곳
  lexicon: altar
  rationale: 제사를 드리는 구조물을 가리키므로 표준 성경어 ‘제단’이 가장 직접적입니다.
- source_word: አስተስረየ
  english_pob_choice: made atonement
  chosen_korean: 속죄하였고
  alternatives_korean:
  - 화목하게 하였고
  - 속량하였고
  lexicon: atonement
  rationale: 본문의 반복되는 속죄 동사를 한국어 성경어법에 맞게 ‘속죄하다’로 옮겨 제의적 죄 사함의 의미를 살렸습니다.
- source_word: መሐስአ፡ ጠሊ
  english_pob_choice: a young goat
  chosen_korean: 어린 숫염소
  alternatives_korean:
  - 새끼 염소
  - 어린 염소
  lexicon: young goat
  rationale: 희생제물의 종별을 더 분명히 드러내기 위해 ‘숫염소’를 보존하고, ‘young’을 ‘어린’으로 옮겼습니다.
- source_word: ኵሉ፡ አበሳ፡ ምድር
  english_pob_choice: all the guilt of the earth
  chosen_korean: 땅의 모든 죄책
  alternatives_korean:
  - 땅의 모든 죄
  - 땅의 모든 죄과
  lexicon: guilt
  rationale: 단순한 행위로서의 죄보다 책임/부담의 뉘앙스를 가진 ‘죄책’이 원문의 አበሳ를 더 직접적으로 반영합니다.
theological_decisions:
- issue: 속죄의 대상과 범위
  chosen_reading: 제단 위의 속죄가 ‘땅’을 위해, 그리고 ‘땅의 모든 죄책’에 대해 이루어진다고 옮겼습니다.
  alternative_readings:
  - 땅을 정결하게 하다
  - 땅을 화목하게 하다
  rationale: Geez 원문과 English POB 모두 땅 자체와 그 위에 있는 죄책 전체를 대상으로 하는 제의적 속죄를 말하므로, 이를 약화시키지 않고 유지했습니다.
  doctrine_reference: 제의적 속죄와 정결 개념
- issue: 예외 조항의 보존
  chosen_reading: ‘노아와 함께 방주 안에 있던 자들 외에는’이라는 예외를 그대로 살렸습니다.
  alternative_readings:
  - 노아 가족만 남았다
  - 방주 안의 자들만 구원되었다
  rationale: 원문은 멸망의 보편성과 방주 안 보존의 예외를 대조하므로, 이를 서술적으로 축약하지 않았습니다.
  doctrine_reference: 심판과 보존의 대비
