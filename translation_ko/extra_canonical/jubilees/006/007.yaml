  text: But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, so that your blood for your lives may not be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.
translation:
  language: ko
  text: 그러나 생명과 함께, 곧 피와 함께 있는 육체는 먹지 말아야 합니다. 모든 육체의 생명은 피에 있기 때문입니다. 그러므로 너희의 피가 너희의 생명 때문에 찾아지지 않게 하십시오. 모든 사람의 손에서, 모든 կենդ물의 손에서 나는 사람의 피를 요구하겠습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትብልዑ
  english_pob_choice: you shall not eat
  chosen_korean: 먹지 말아야 합니다
  alternatives_korean:
  - 먹어서는 안 됩니다
  - 먹지 마십시오
  lexicon: Ge'ez 동사 (금지/명령)
  rationale: 본문의 직접 금지 명령을 현대 합쇼체로 자연스럽게 옮기되, 법적·규범적 성격을 분명히 하려고 ‘먹지 말아야 합니다’를 택했습니다.
- source_word: ሥጋ፡ ዘምስለ፡ መንፈሱ፡ ምስለ፡ ደሙ
  english_pob_choice: But flesh with its life, with its blood
  chosen_korean: 생명과 함께, 곧 피와 함께 있는 육체
  alternatives_korean:
  - 그 영과 함께 있는 육체, 그 피와 함께
  - 그 생명과 그 피를 지닌 육체
  lexicon: 문맥상 ሥጋ / መንፈሱ / ደሙ
  rationale: ‘생명’과 ‘피’의 동격 관계를 살리면서도 직역투를 피하기 위해 ‘생명과 함께, 곧 피와 함께 있는 육체’로 옮겼습니다. 여기서 መንፈሱ는 문맥상 인간/동물의 생명력으로 보아 ‘생명’으로 처리했습니다.
- source_word: ነፍሰ፡ ኵሉ፡ ዘሥጋ፡ ውስተ፡ ደም፡ ውእቱ
  english_pob_choice: for the life of all flesh is in the blood
  chosen_korean: 모든 육체의 생명은 피에 있기 때문입니다
  alternatives_korean:
  - 모든 육체의 혼은 피에 있기 때문입니다
  - 모든 육체의 생명은 피 속에 있기 때문입니다
  lexicon: ነፍስ / ደም
  rationale: 여기서 ነፍስ는 문맥상 ‘생명’이 가장 자연스럽고, ‘혼’보다 출혈과 생명 보전의 논리를 분명히 드러냅니다.
- source_word: ከመ፡ ኢይትኀሠሥ፡ ደምክሙ፡ ውስተ፡ ነፍሳቲክሙ
  english_pob_choice: so that your blood for your lives may not be sought
  chosen_korean: 그러므로 너희의 피가 너희의 생명 때문에 찾아지지 않게 하십시오
  alternatives_korean:
  - 그래서 너희의 피가 너희의 생명을 위해 찾이지 않게 하십시오
  - 너희 생명의 피가 요구되지 않게 하십시오
  lexicon: 수동형/목적절
  rationale: 영어 POB의 수정된 목적절 의미를 반영해, ‘찾아지다’로 수동적 추궁·요구의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 피와 생명의 결속을 어떻게 한국어로 표현할지
  chosen_reading: ‘생명은 피에 있다’는 인과 관계를 유지하되, 피를 단순한 물질로 축소하지 않고 생명 보존의 신학적 표지로 읽힐 수 있게 번역했습니다.
  alternative_readings:
  - ‘생명은 피 속에 있다’로 더 물리적으로 옮길 수 있음
  - ‘생명은 피에 붙어 있다’처럼 관용적으로 풀 수 있음
  rationale: 본문은 혈액 금지 규례를 넘어 생명-피 연결을 근거로 제시하므로, 한국어에서도 그 결속을 선명하게 드러내는 것이 중요합니다.
  doctrine_reference: 생명 존중, 피의 신학(창세기 9:4와의 연관)
