  source_fidelity: 대체로 게에즈 본문과 영어 POB의 구조를 따르지만, ከመ ኢይትኀሠሥ의 수동적 ‘요구되다/추궁되다’ 의미를 ‘찾아지다’로 옮긴 것은 부정확합니다. 또한 마지막 병행구의 ‘모든 생물’에 명백한 오자가 있습니다.
  naturalness: ‘생명과 함께, 곧 피와 함께 있는 육체’ 및 ‘너희의 피가 너희의 생명 때문에 찾아지지 않게 하십시오’는 현대 한국어로 부자연스럽습니다. ‘고기’는 먹는 행위의 목적어로 자연스럽고, ‘요구되지 않도록’은 원문의 수동 목적절을 명료하게 보존합니다.
  terminology: 문맥상 መንፈስ 및 ነፍስ를 ‘생명’으로 옮긴 것은 적절합니다. ሥጋ는 첫 절에서는 ‘고기’, 둘째 절에서는 포괄적 표현인 ‘모든 육체’로 처리하여 문맥과 용례를 함께 살렸습니다. ‘모든 생물’은 영어 POB의 ‘every living thing’ 및 본문의 병행을 반영합니다.
