revisions:
- from: 그러나 생명과 함께, 곧 피와 함께 있는 육체는 먹지 말아야 합니다. 모든 육체의 생명은 피에 있기 때문입니다. 그러므로 너희의 피가 너희의 생명 때문에 찾아지지 않게 하십시오. 모든 사람의 손에서, 모든 կենդ물의 손에서 나는 사람의 피를 요구하겠습니다.[a][b]
  to: 그러나 그 생명과 함께, 곧 그 피와 함께 있는 고기는 먹지 마십시오. 모든 육체의 생명은 피에 있기 때문입니다. 이는 너희 생명의 피가 요구되지 않도록 하기 위함입니다. 모든 사람의 손에서, 모든 생물의 손에서 나는 사람의 피를 요구하겠습니다.
  rationale: 원문의 반복 구조(‘그 생명과 함께, 그 피와 함께’)와 피-생명의 연결을 유지하면서, 한국어의 자연스러운 금지 명령으로 다듬었습니다. 논쟁적일 수 있는 ‘너희의 피/너희 생명의 피’의 다소 압축된 표현은 원문의 난해성과 영어 POB의 ‘your blood for your lives’를 과도하게 해설하지 않도록 ‘너희 생명의 피’로 보존했습니다. 원문에 없는 각주 표지 [a][b]는 제공된 각주가 없으므로 제거했습니다.
  reviewer_model: gpt-5.6-terra
