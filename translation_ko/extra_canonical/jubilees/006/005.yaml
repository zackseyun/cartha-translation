  yaml_path: translation/extra_canonical/jubilees/006/005.yaml
  text: And as for you, be fruitful and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.
translation:
  language: ko
  text: 너희는 땅에서 생육하고 번성하여, 그 위에 많아지며, 그 위에 복이 되십시오. 너희에 대한 두려움과 너희에 대한 공포를 내가 땅 위와 바다 속에 있는 모든 것 위에 두겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተባዝኁ / ብዙኁ
  english_pob_choice: be fruitful and multiply / become many
  chosen_korean: 번성하고 많아지며, 그 위에서 수가 많아지고
  alternatives_korean:
  - 열매를 맺고 번성하며
  - 늘어나고 많아지며
  lexicon: source repetition
  rationale: Geez 원문은 ‘번성하다/많아지다’ 계열의 중첩 표현으로 번영과 수적 증대를 함께 강조하므로, 한국어도 두 겹의 표현을 살려 번역했습니다.
- source_word: ለበረከት
  english_pob_choice: be a blessing
  chosen_korean: 복이 되십시오
  alternatives_korean:
  - 복이 되십시오
  - 복이 되게 하십시오
  lexicon: blessing formula
  rationale: 문맥상 ‘축복의 통로가 되라’는 의미를 부드럽고 직접적으로 살리기 위해 ‘복이 되십시오’로 옮겼습니다.
- source_word: ፍርሀትክሙ / ረዓድክሙ
  english_pob_choice: fear of you and the dread of you
  chosen_korean: 너희에 대한 두려움과 너희에 대한 공포
  alternatives_korean:
  - 너희를 두려워함과 너희를 떪
  - 너희에 대한 경외와 떨림
  lexicon: paired dread terms
  rationale: 원문은 두 개의 명사형을 병렬로 두어 강한 반응을 강조하므로, ‘두려움’과 ‘공포’로 구별해 중복 강도를 유지했습니다.
- source_word: ላዕሌሃ
  english_pob_choice: upon it / on the earth
  chosen_korean: 그 위에서
  alternatives_korean:
  - 그 위에
  - 그 위에서
  lexicon: prepositional contrast
  rationale: 앞의 ‘땅에서’와 뒤의 ‘그 위에서’를 구분해, 번성의 위치와 결과가 땅 위에 미친다는 점을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 창세기 축복 공식의 반복 구조를 어떻게 살릴 것인가
  chosen_reading: ‘번성하고 많아지며… 복이 되십시오’로 축복 명령의 서술적 리듬을 유지했습니다.
  alternative_readings:
  - 단일 동사로 압축해 매끈하게 번역
  - ‘열매를 맺으라’로 더 명시적으로 재구성
  rationale: 이 구절은 축복 선언의 전형적 어조와 반복이 핵심이므로, 의미를 압축하기보다 원문의 축복적 리듬을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 창 1:28, 9:1
- issue: ‘두려움과 공포’를 완화할지 여부
  chosen_reading: 창조 질서 안에서 피조물의 실질적 두려움을 나타내는 표현을 그대로 유지했습니다.
  alternative_readings:
  - 경외심으로 순화
  - 존중으로 완화
  rationale: 문맥은 단순한 존중이 아니라 인간에 대한 피조물의 강한 반응을 말하므로, 어감을 약화시키지 않았습니다.
  doctrine_reference: 창 9:2
