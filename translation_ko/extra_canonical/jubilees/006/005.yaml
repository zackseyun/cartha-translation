revisions:
- from: 그리고 너희도 땅에서 번성하고 많아지며, 그 위에서 수가 많아지고, 그 위에 복이 되십시오. 너희에 대한 두려움과 너희에 대한 공포를 내가 땅 위의 모든 것과 바다 속의 모든 것에 두겠습니다.
  to: 너희는 땅에서 생육하고 번성하여, 그 위에 많아지며, 그 위에 복이 되십시오. 너희에 대한 두려움과 너희에 대한 공포를 내가 땅 위와 바다 속에 있는 모든 것 위에 두겠습니다.
  rationale: 첫 세 축복 표현의 점층적 반복을 ‘생육하고 번성하여 … 많아지며’로 보존하고, 공간 표현과 마지막 포괄 대상을 현대 한국어에서 자연스럽게 다듬었습니다. 공포 어휘와 ‘복이 되십시오’는 원문의 의미와 어조를 유지했습니다.
