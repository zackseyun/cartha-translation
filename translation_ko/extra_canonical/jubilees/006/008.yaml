translation:
  language: ko
  text: 누구든지 사람의 피를 흘리면, 그 피는 사람에 의해 흘려질 것입니다. 이는 하나님께서 사람을 그분의 형상으로 만드셨기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይከዑ / Whoever sheds
  english_pob_choice: Whoever sheds
  chosen_korean: 누구든지 ... 피를 흘리면
  alternatives_korean:
  - 사람의 피를 쏟는 자는
  - 누구든지 피를 흘리게 하면
  lexicon: 'source-note: conditional universal'
  rationale: 행위자를 보편적으로 지시하는 조건문으로 풀어, 행위의 주체성과 보응 구조를 자연스러운 한국어로 드러냈습니다.
- source_word: ደመ፡ ሰብእ / the blood of a man
  english_pob_choice: the blood of a man
  chosen_korean: 사람의 피
  alternatives_korean:
  - 인의 피
  - 한 사람의 피
  lexicon: 'source-note: human blood'
  rationale: 원문의 '사람'은 개별 인물보다 인간 일반을 가리키는 표현으로 읽히므로, 보편성을 살려 '사람의 피'로 옮겼습니다.
- source_word: በሰብእ፡ ደሙ፡ ይትከዐው / by a man shall his blood be shed
  english_pob_choice: by a man shall his blood be shed
  chosen_korean: 그 피는 사람에 의해 흘려질 것입니다
  alternatives_korean:
  - 사람에 의해 그의 피가 흘려질 것입니다
  - 사람이 그 피를 흘리게 할 것입니다
  lexicon: 'source-note: passive divine/passive legal equivalent'
  rationale: 수동형 보응 진술을 살리되, 한국어에서 자연스러운 수동 서술로 옮겨 법적 판결의 엄중함을 유지했습니다.
- source_word: በምስለ፡ እግዚአብሔር / in the likeness of God
  english_pob_choice: in the likeness of God
  chosen_korean: 하나님의 형상으로
  alternatives_korean:
  - 하나님의 모양대로
  - 하나님과 같은 모습으로
  lexicon: 'source-note: image/likeness formula'
  rationale: 이 구절의 창세기 인용 맥락을 따라 한국어 성서어휘인 '형상'을 사용하여, 인간 창조의 신학적 근거를 분명히 했습니다.
theological_decisions:
- issue: Ge'ez ለአዳም / English audit note 'man' vs previous 'Adam'
  chosen_reading: 사람으로 이해하여 번역하고, 고유명사 '아담'으로 옮기지 않았습니다.
  alternative_readings:
  - 아담
  - 인간
  rationale: 감사된 영어 개정이 지적하듯 여기서는 고유명사보다 창세기 9:6의 보편적 인류를 가리키는 뜻이므로, '사람'으로 유지해 인류 보편의 신학적 논지를 보존합니다.
  doctrine_reference: 창세기 1:26-27; 9:6 인용 맥락
