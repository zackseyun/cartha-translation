revisions:
- from: 그러나 아브라함만이 그것을 지켰고, 이삭과 야곱과 그의 자녀들도 그것을 지켰습니다. 그것은 당신의 시대까지 이어졌습니다. 그리고 당신의 시대에 이스라엘의 자녀들은 그것을 잊었고, 내가 이 산에서 그것을 그들에게 새롭게 해 주기까지 그랬습니다.
  to: 그러나 아브라함만이 그것을 지켰고, 이삭과 야곱과 야곱의 자녀들도 당신의 시대까지 그것을 지켰습니다. 그리고 당신의 시대에 이스라엘 자손들은 내가 이 산에서 그들을 위하여 그것을 새롭게 할 때까지 그것을 잊었습니다.
  rationale: 원문의 병렬 열거와 시간 수식어의 범위를 회복하고, ‘그의 자녀들’을 ‘야곱의 자녀들’로 명시했습니다. 원문이 밝히지 않는 ‘그것’의 내용을 보충하지 않았으며, ‘그들을 위하여’와 ‘이 산에서’를 보존해 갱신 행위의 수혜자와 장소를 유지했습니다.
  reviewer_model: gpt-5.6-terra
