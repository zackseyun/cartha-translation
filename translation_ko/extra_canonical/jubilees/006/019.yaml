  text: But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.
translation:
  language: ko
  text: 그러나 아브라함만이 그것을 지켰고, 이삭과 야곱과 그의 자녀들도 그것을 지켰습니다. 그것은 당신의 시대까지 이어졌습니다. 그리고 당신의 시대에 이스라엘의 자녀들은 그것을 잊었고, 내가 이 산에서 그것을 그들에게 새롭게 해 주기까지 그랬습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባሕቲቱ
  english_pob_choice: alone
  chosen_korean: 아브라함만이
  alternatives_korean:
  - 아브라함이 홀로
  - 오직 아브라함이
  lexicon: —
  rationale: 게에즈의 ‘혼자/단독으로’라는 대비를 한국어 부사어 ‘만이’로 간결하게 살려, 뒤의 족장들과의 대조를 유지했습니다.
- source_word: ዐቀበ / ዐቀብዋ
  english_pob_choice: kept
  chosen_korean: 지켰고 / 지켰습니다
  alternatives_korean:
  - 보존했고
  - 준수했고
  lexicon: —
  rationale: 문맥상 단순 보관이 아니라 전승된 것을 지속적으로 지켜 온 의미이므로 ‘지키다’를 택했습니다.
- source_word: ውሉዱ / ውሉደ እስራኤል
  english_pob_choice: his children / the children of Israel
  chosen_korean: 그의 자녀들 / 이스라엘의 자녀들
  alternatives_korean:
  - 그의 후손들 / 이스라엘 자손들
  - 그의 아이들 / 이스라엘 사람들
  lexicon: —
  rationale: 족장 계보의 연속성과 언약 공동체의 집단성을 함께 드러내기 위해 ‘자녀들’을 유지했습니다.
- source_word: ኀይስክዎሙ
  english_pob_choice: forgot
  chosen_korean: 잊었고
  alternatives_korean:
  - 기억하지 못했고
  - 잊어버렸고
  lexicon: —
  rationale: 문맥의 핵심은 기억 상실로 인한 전승 단절이므로 가장 مستقیم한 ‘잊다’를 사용했습니다.
theological_decisions:
- issue: 언약 전승의 지속과 단절
  chosen_reading: 아브라함에서 이삭·야곱과 자녀들로 이어지다가, 이스라엘이 잊어버린 뒤 산에서 다시 새롭게 주어졌다는 흐름을 그대로 살렸습니다.
  alternative_readings:
  - ‘그것’의 대상을 더 구체화해 설명하는 방식
  - 의미를 풀어 ‘율례/계명’으로 명시하는 방식
  rationale: 원문은 대상을 명시하지 않고 지시사로 가리키므로, 한국어도 ‘그것’을 유지해 전승된 항목의 불명시성과 재갱신의 대비를 보존했습니다.
  doctrine_reference: 전승 보존과 갱신의 서술 구조
