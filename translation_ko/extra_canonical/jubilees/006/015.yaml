  text: And he gave Noah and his sons a sign that there should never again be a flood upon the earth.
translation:
  language: ko
  text: 그리고 그분은 노아와 그의 아들들에게 표징을 주셔서, 다시는 땅 위에 홍수가 없게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእምርተ
  english_pob_choice: a sign
  chosen_korean: 표징
  alternatives_korean:
  - 표
  - 징조
  - 사인
  lexicon: source-note
  rationale: 게으즈어 ትእምርተ는 단순한 표시보다 의미를 드러내는 ‘표징’이 자연스러워, 문맥상 언약적 표지의 성격을 살렸습니다.
- source_word: ኢይኩን
  english_pob_choice: there should never again
  chosen_korean: 다시는 … 없게 하셨습니다
  alternatives_korean:
  - 결코 다시 … 없게 하셨습니다
  - 다시는 … 없도록 하셨습니다
  lexicon: source-note
  rationale: 부정적 미래/의지의 금지를 한국어에서는 결과절로 풀어, 반복 금지를 분명하게 전달했습니다.
- source_word: ዳግመ አይኅ
  english_pob_choice: a flood
  chosen_korean: 홍수
  alternatives_korean:
  - 대홍수
  - 물난리
  lexicon: source-note
  rationale: 여기서는 창조세계 심판의 물을 가리키므로 일반적이면서도 성서적 문맥에 맞는 ‘홍수’를 선택했습니다.
- source_word: ለኖኅ ወለደቂቁ
  english_pob_choice: Noah and his sons
  chosen_korean: 노아와 그의 아들들
  alternatives_korean:
  - 노아와 아들들
  - 노아와 그의 자손들
  lexicon: source-note
  rationale: 원문이 노아와 그에게 속한 아들들을 병렬로 제시하므로, 직역에 가까운 소유격 구조를 유지했습니다.
theological_decisions:
- issue: 표징의 기능
  chosen_reading: 하나님이 주시는 보호와 언약적 보증의 표징으로 읽었습니다.
  alternative_readings:
  - 단순한 예시적 표지로만 읽기
  - 사건 이후의 기억 장치로만 읽기
  rationale: 본문은 홍수가 다시 없을 것이라는 약속과 결합되어 있으므로, ‘표징’은 단순 표지보다 언약 보증의 의미를 내포합니다.
  doctrine_reference: 창세기 9장 및 홍수 서사와의 평행
