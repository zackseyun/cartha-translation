  source_fidelity: 게으즈어 본문은 ‘그가 노아와 그의 아들들에게 표징을 주었다. 다시는 땅 위에 홍수가 있지 않게 하려고/없게 하려고’라는 뜻입니다. 초안은 핵심 의미를 대체로 전달하지만, ‘없게 하셨습니다’는 표징을 주신 행위와 홍수가 없도록 하신 행위를 모두 과거에 완료하신 것으로 연결하여 원문의 목적·내용절 관계를 다소 흐립니다.
  naturalness: ‘표징을 주셔서’와 ‘홍수가 없게 하셨습니다’의 연결은 한국어로 가능하나, 표징이 ‘다시는 홍수가 없을 것’이라는 보증임을 직접적으로 표현하면 더 자연스럽고 원문 구조에도 가깝습니다. ‘땅 위에 홍수가 다시는 없도록’은 현대 문어체 합쇼체에 자연스럽습니다.
  terminology: ‘노아’, ‘표징’, ‘홍수’, ‘땅’은 적절합니다. 다만 이 한 절은 표징의 성격을 설명하지 않으므로 번역문 또는 주석에서 ‘언약적’이라는 해석을 덧붙일 필요는 없습니다. 현행 [a]에는 실제 각주 내용이 없어 삭제하는 것이 맞습니다.
