  text: He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.
translation:
  language: ko
  text: 그는 언약의 영원한 표로 하늘에 자기 활을 두었습니다. 이는 땅 위에 다시는 홍수물이 있어 그것을 멸하지 않게 하시려는 것이며, 땅의 모든 날 동안 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀስተ፡ ... ውስተ፡ ደመና፡
  english_pob_choice: He set his bow in the cloud
  chosen_korean: 하늘에 자기 활을 두었습니다
  alternatives_korean:
  - 구름 속에 그의 활을 두었습니다
  - 구름에 자기 활을 두었습니다
  lexicon: 활 / 구름
  rationale: Geez 원문과 영어 POB의 핵심 이미지는 ‘활’이 ‘구름/구름 속’에 놓인다는 뜻이므로, 자연스러운 현대 한국어로 옮기되 소유대명사와 장소 표지를 유지했습니다.
- source_word: ለትእምርተ፡ ኪዳን፡ ዘ*ለዓለም፡
  english_pob_choice: for a sign of the everlasting covenant
  chosen_korean: 언약의 영원한 표로
  alternatives_korean:
  - 영원한 언약의 표로
  - 영속하는 언약의 징표로
  lexicon: 표 / 언약 / 영원한
  rationale: ‘표’는 sign의 직접 대응어로 유지했고, ኪዳን은 문맥상 ‘언약’이 가장 적절합니다. ‘영원한’은 everlasting의 시간적 지속을 분명히 드러냅니다.
- source_word: ከመ፡ ኢይኩን፡ እንዘ፡ ማየ፡ አይኅ፡ ዲበ፡ ምድር፡ ለአማስኖታ፡
  english_pob_choice: that there should never again be floodwaters upon the earth to destroy it
  chosen_korean: 이는 땅 위에 다시는 홍수물이 있어 그것을 멸하지 않게 하시려는 것이며
  alternatives_korean:
  - 땅 위에 다시는 홍수물이 있어 그것을 멸망시키지 않게 하시려는 것이며
  - 땅 위에 다시는 홍수가 일어나 그것을 멸하지 않게 하시려는 것이며
  lexicon: 홍수물 / 멸하다
  rationale: 영어 POB의 floodwaters를 따라 ‘홍수물’을 써서 물 자체를 강조했고, ለአማስኖታ는 파괴 목적을 담은 ‘멸하다’로 옮겼습니다.
- source_word: ኵሎ፡ መዋዕለ፡ ምድር።
  english_pob_choice: all the days of the earth
  chosen_korean: 땅의 모든 날 동안 그러합니다
  alternatives_korean:
  - 땅이 있는 모든 날 동안 그러합니다
  - 땅의 모든 기간 동안 그러합니다
  lexicon: 땅의 모든 날
  rationale: 직역투를 줄이면서도 원문의 시간 지속 범위를 살려, ‘땅의 모든 날’이라는 표현을 자연스럽게 정리했습니다.
theological_decisions:
- issue: 노아 언약의 표지와 보존 약속의 관계
  chosen_reading: ‘언약의 영원한 표’와 ‘다시는 홍수물이 있어 그것을 멸하지 않게’라는 구조를 분리해, 표지와 약속을 둘 다 분명히 드러냈습니다.
  alternative_readings:
  - 표현을 하나로 묶어 ‘영원한 언약의 표로서’라고 풀어 쓰는 방식
  - ‘홍수’로 단순화해 물의 성격을 약화시키는 방식
  rationale: 원문은 표지와 약속을 두 겹으로 제시하므로, 둘을 함께 유지해야 독자가 언약의 기념 표와 재심판 금지를 모두 이해할 수 있습니다.
  doctrine_reference: 창 9:13-15와 평행하는 노아 언약의 표지 이해
