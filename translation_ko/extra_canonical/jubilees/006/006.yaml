  english_pob_choice: all the beasts and everything that flies and everything that moves ... and the fish in the waters
  chosen_korean: 모든 짐승과 날아다니는 모든 것과 땅에서 움직이는 모든 것, 그리고 물속의 물고기
  alternatives_korean:
  - 모든 짐승과 날개 달린 모든 것과 기어 다니는 모든 것, 그리고 물속의 물고기
  - 모든 짐승과 새들과 땅에서 움직이는 모든 것, 그리고 물속의 물고기
  lexicon: 창조 질서 목록
  rationale: 게에즈 원문과 수정된 POB 영어가 ‘날아다니는 것’과 ‘움직이는 것’을 구분하므로, 새를 포함할 수 있는 첫 항과 땅의 소형 생물을 포괄하는 둘째 항을 구분해 살렸습니다.
