translation:
  language: ko
  text: 보십시오, 내가 너희에게 모든 짐승과 날아다니는 모든 것과 땅에서 움직이는 모든 것과 물속의 물고기를 주었으며, 이 모든 것을 양식으로 삼도록 하였습니다. 푸른 풀처럼, 내가 너희에게 모든 것을 먹도록 주었습니다.
  philosophy: optimal-equivalence
