  rationale: 문맥상 먹을 수 있는 식물을 가리키는 관용을 살리되, 기존 POB의 ‘green plants’ 의미를 자연스러운 한국어로 옮겼습니다.
theological_decisions:
- issue: 먹을 수 있는 피조물의 포괄적 허락을 어떻게 드러낼지
  chosen_reading: ‘먹을 모든 것’으로 반복을 살려, 허락의 범위가 동물·새·기어 다니는 것·물고기까지 포괄됨을 분명히 했습니다.
  alternative_readings:
  - ‘먹을 수 있는 모든 것’
  - ‘양식으로 삼을 모든 것’
  rationale: 원문은 단순 열거가 아니라 창조물 전체에 대한 식용 허락을 선언하므로, 범위의 총체성을 드러내는 표현이 적절합니다.
  doctrine_reference: 창세기 1–9의 식용 허락 전승
