translation:
  language: ko
  text: 보십시오, 내가 너희에게 모든 짐승과 날아다니는 모든 것과 땅에서 움직이는 모든 것, 그리고 물속의 물고기와 먹을 모든 것을 주었습니다. 푸른 채소와 같이 내가 너희에게 먹을 모든 것을 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወናሁ
