  text: But if they transgress and do not observe them according to his command, then they will disturb all their seasons, and the years will be moved from this order, and they will transgress their ordinances.
  footnotes:
  - marker: a
    text: Or 'do not observe it'.
    reason: previous_rendering
  - marker: b
    text: Or 'all their seasons will be disturbed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 그들이 어기고 그의 명령에 따라 그것들을 지키지 않으면, 그들은 자기들의 모든 절기를 어지럽히고, 그 해들은 이 질서에서 옮겨지며, 자기들의 규례를 어기게 됩니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢገብርዎን
  english_pob_choice: do not observe them
  chosen_korean: 지키지 않으면
  alternatives_korean:
  - 준수하지 않으면
  - 따르지 않으면
  lexicon: Ge'ez verb with plural object reference
  rationale: 복수 목적어를 살려 ‘그것들을/지키다’로 옮기되, 한국어에서는 자연스럽게 ‘지키다’가 절기와 명령 모두에 걸맞아 간결하게 전달됩니다.
- source_word: በከመ፡ ትእዛዙ
  english_pob_choice: according to his command
  chosen_korean: 그의 명령에 따라
  alternatives_korean:
  - 그의 명령대로
  - 그의 계명에 따라
  lexicon: command/ordinance context
  rationale: 문맥상 단일한 명령/규정에 대한 준수를 가리키므로, ‘계명’보다 더 직접적인 ‘명령’을 택했습니다.
- source_word: ያማስኑ
  english_pob_choice: they will disturb all their seasons
  chosen_korean: 그들은 자기들의 모든 절기를 어지럽히고
  alternatives_korean:
  - 그들은 자기들의 모든 때를 혼란스럽게 하고
  - 그들은 자기들의 모든 계절을 뒤흔들고
  lexicon: causative verb disturbing/ruining
  rationale: 능동적 원인 행위를 살려 ‘어지럽히다’로 옮겼고, 절기/시기를 가리키는 문맥에 맞게 ‘절기’를 기본값으로 삼았습니다.
- source_word: ሥርዐቶሙ
  english_pob_choice: their ordinances
  chosen_korean: 자기들의 규례
  alternatives_korean:
  - 자기들의 법도
  - 자기들의 규정
  lexicon: ordinances/statutes
  rationale: 본문 마지막의 규범적 표현을 살려, 절기와 구분되는 제도적·규범적 의미를 담는 ‘규례’를 택했습니다.
theological_decisions:
- issue: 절기와 해의 질서가 어그러진다는 경고의 성격
  chosen_reading: 윤리적 불순종이 창조 질서와 시간 질서를 훼손한다는 경고로 옮겼습니다.
  alternative_readings:
  - 단순한 달력 혼란의 예언으로만 좁혀 읽기
  - 상징적 경고를 약화해 일반적인 무질서로 처리하기
  rationale: 문맥은 단순한 일정 혼선이 아니라, 불순종이 ‘절기’와 ‘해’의 질서를 무너뜨린다는 강한 신학적 경고를 담고 있습니다.
  doctrine_reference: 창조 질서, 순종과 언약 질서
