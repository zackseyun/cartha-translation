  language: ko
  text: '1[7a]. 요셉이 그들에게 해석해 준 대로 바로가 술 맡은 관원장을 그의 직위로 복귀시키고 떡 굽는 관원장을 죽였으니 요셉이 그들에게 해석한 대로 되니라. 술 맡은 관원장은 형무소에 있는 요셉을 잊어버렸으나 요셉이 자기에게 말한 것을 바로에게 고하는 일을 잊어버렸으므로 기억지 아니하고

    2. 그 때에 바로는 온 땅에 기근이 임할 것에 대하여 하룻밤에 두 가지 꿈을 꾸니라 그가 잠에서 깨어나 애굽에 있는 꿈 해석자와 점술가를 모두 불러서 그 꿈을 그들에게 말하였으나 그들이 능히 그 뜻을 알지 못하니라.

    3. 술 맡은 관원장이 요셉을 생각하고 그에 대하여 왕에게 아뢰매 왕이 그를 감옥에서 데리고 나오니 그가 그에게 두 꿈을 다 말하매

    4. 그가 바로 앞에서 그 꿈은 하나라고 말하여 이르되 온 애굽 땅에 일곱 해 풍년이 있겠고 그 후에는 일곱 해 흉년이 들 것이라 온 천하에 이 같은 흉년이 없으리라 하더라

    5. “이제 바로가 애굽 온 땅에 감독자들을 세워서 그들로 풍년에 각 성읍에 곡식을 저장하게 하여 일곱 해 흉년을 대비하게 하라 그 흉년이 심히 심하여 땅이 망하지 아니하리니”

    6. 주님께서 바로 앞에서 요셉에게 은혜와 은총을 주시매 바로가 그의 신하들에게 이르되 주님의 신이 그와 함께 계시니 이 사람처럼 지혜롭고 총명한 사람을 우리가 찾지 못하리라 하였더라

    7. 그리고 그는 그를 그의 온 나라의 둘째로 세워 이집트 전체의 통치자로 삼고 파라오의 두 번째 병거에 태워 주었습니다. 그리고 그에게 세마포 옷을 입히고 그의 목에 금사슬을 걸어 주었습니다. 그러자 그들이 그 앞에서 “엘, 엘, 아브레”라고 외쳤습니다. 인장 반지를 손에 쥐고 그를 온 집을 다스리게 한 다음 그를 크게 높여 이르되, “내가 너보다 큰 것은 오직 보좌뿐이니라.”

    8. 요셉이 애굽 온 땅에 두루 다니매 바로의 모든 고관과 그의 모든 신하와 왕의 역사하는 모든 사람이 그를 사랑하였으니 이는 그가 정직하게 행하고 그 마음에 교만도 없고 마음의 교만도 없고 낯을 가리는 것도 없고 사람을 인색함도 없었음이라 이는 그가 땅의 모든 족속을 위하여 공의로 판단하셨음이로다.

    9. 요셉으로 말미암아 애굽 땅이 바로 앞에서 평안하였으니 이는 주님께서 그와 함께 하시고 그를 아는 모든 자와 그의 소문을 듣는 모든 자 앞에서 그에게 은혜와 긍휼을 베푸셨음이라. 바로의 나라가 잘 되어 있어서 대적도 없고 악한 자도 없었더라.

    10. 그리고 왕은 요셉의 이름을 프손톰바네스라고 불렀습니다. 그리고 그는 헬리오폴리스 제사장의 딸이자 경호대장인 보디발의 딸을 요셉에게 아내로 주었습니다.

    11. 요셉이 바로 앞에 설 때에 나이 삼십 세라

    12. 그리고 그 해에 이삭이 죽었습니다. 요셉이 그 두 꿈의 해석을 말하여 그에게 말한 것과 같으니 애굽 온 땅에 일곱 해 풍년이 있었으므로 애굽 땅의 소출이 심히 심하여 한 붸아가 일천팔백 석이 되었더라

    13. 요셉은 곡식이 가득 차서 더 이상 셀 수 없을 때까지 각 성에 식량을 저장해 두었고, 그 풍부함으로 인해 더 이상 측량할 수 없게 되었습니다.'
