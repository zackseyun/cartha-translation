  text: '1[1]. And the place of judgment was made. And one of us said, “Let us teach Noah all their remedies, because

    2. the unclean demons began to lead astray the children of the sons of Noah, and to make them err and destroy them.”

    3. And he prayed before the Lord his God, and said, “God of the spirits of all flesh, who have shown mercy to me and saved me and my sons from the waters of the flood, and have not caused me to perish as you caused the sons of perdition to perish—

    4. for your grace has been great toward me, and great is your mercy toward my life—let your grace be lifted up over my sons, and do not let wicked spirits rule over them, lest they destroy them from the earth.

    5. But bless me and my sons, that we may increase and multiply and fill the earth.

    6. And you know how your Watchers, the fathers of these spirits, acted in my days[11]. As for these spirits that are living, imprison them and hold them fast in the place of judgment, and do not let them bring corruption upon the sons of your servant, my God, for these are malignant and were created in order to destroy.

    7. And let them not rule over the spirits of the living, for you alone know their judgment; and do not let them have power over the sons of the righteous from now and forevermore.”

    8. And the Lord our God told us to bind all of them.

    9. And the chief of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me, I will not be able to exercise the authority of my will over the sons of men. For these are for corruption and for leading astray before my judgment, because the wickedness of the sons of men is great.”

    10. And he said, “Let a tenth of them remain before him, and let nine parts descend into the place of judgment.”

    11. And one of us said that we should teach Noah all their medicines, because he knew that they were not walking in uprightness and were not striving in righteousness. And we acted according to all his word: all the evil ones that were cruel we bound in the place of judgment, and

    12. we left a tenth of them so that they might be subject before Satan on the earth. And we told Noah all their remedies for their errors, so that they might be healed by the plants of the earth.

    13. And Noah wrote down everything that we had taught him in a book, all the kinds of healing remedies; and the evil spirits were restrained from following the sons of Noah.

    14. And he gave all that he had written to Shem, his son, because he loved him much more than all his sons.

    15. And Noah slept with his fathers, and was buried on Mount Lubar in the land of Ararat.

    16. Nine hundred and fifty years he completed in his life,

    17. nineteen jubilees and two weeks of years and five years. And in his life on the earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was ordained as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.

    18. And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife whose name was Lomna, daughter of Sinaar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Look, the sons of men have become evil through their wicked purpose to build for themselves a city and a tower in the land of Shinar.”

    19. For they departed from the land of Ararat eastward to Shinar, and in his days they built the city and the tower, saying, “Come, let us ascend by it into heaven.”

    20. And they began to build, and in the fourth week they made brick with fire, and the bricks served them as stone, and the clay with which they plastered was asphalt that comes out of the sea and from the springs of water in the land of Shinar.

    21. And they built it for forty-three years. Its breadth was 204 cubits, and the height of a brick was the third of one; its height amounted to 5,433 cubits and 2 palms, and the extent of one wall was twelve stades, and of the other thirty stades.

    22. And the Lord our God said to us, “Look, they are one people, and this they have begun to do; and now nothing will be withheld from them. Come, let us go down and confuse their tongues, so that one will not hear another’s speech, and they will be scattered into cities and nations, and one purpose will no longer remain with them until the day of judgment.”

    23. And the Lord went down, and we went down with him, to see the city and the tower that the sons of men had built. And he confused all their tongues, and they no longer heard one another’s speech, and they ceased building the city and the tower. Therefore the whole land of Shinar was called Babel, because there the Lord confused all the tongues of the sons of men, and from there they were scattered into their cities, each according to his tongue and according to his nation.

    24. And the Lord sent a mighty wind against the tower, and it threw it down upon the earth; and look,

    25. it is between Asshur and Babylon in the land of Shinar. And he called its name Overthrow.

    26. In the fourth week, in the first year, in the thirty-fourth jubilee, they were scattered from the land of Shinar.

    27. And Ham and his sons went into the land that had fallen to him as his portion in the south land.

    28. And Canaan saw the land of Lebanon as far as the river of Egypt, that it was very good, and he did not go into the land of his inheritance to the west, that is, to the sea, but he dwelt in the land of Lebanon, from the east and from the west, from the border of the Jordan and from the border of the sea.

    29. And Ham his father, and Cush and Mizraim his brothers, said to him, “You have settled in a land that is not yours and that did not come out for us by lot. Do not do so,

    30. for if you do so, you and your sons will fall in the land and be accursed through rebellion; because by rebellion you have settled, and by rebellion your sons will fall, and you will be uprooted forever.

    31. Do not dwell in the dwelling of Shem, for to Shem and to his sons it came out by their lot.

    32. Cursed are you, and cursed you shall be beyond all the sons of Noah, by the curse by which we bound ourselves with an oath before the holy judge and before Noah our father.”

    33. But he did not listen to them, and he dwelt in the land of Lebanon from Hamath to the entrance of Egypt, he and his sons until this day.

    34. And for this reason that land was named Canaan.

    35. And Japheth and his sons went toward the sea and dwelt in the land of their portion. And Madai saw the land of the sea, and it did not please him, and he asked from Elam and Asshur and Arpachshad, his wife’s brother, a portion,

    36. and he dwelt in the land of Media, near his wife’s brother, until this day. And he called his dwelling-place, and the dwelling-place of his sons, Media[35][28][25][22][21][17], after Madai their father.'
  footnotes:
  - marker: '1'
    text: Verse 1 is incomplete in the surviving row of the provided Ethiopic corpus and clearly continues into the next verse. The translation follows the chapter's sense as preserved across the immediate context.
    reason: segmentation_note
  - marker: '11'
    text: The Ethiopic at the start of v. 11 is difficult. The sense appears to be that Noah needed instruction because the spirits were not acting with strength/uprightness/righteousness. The translation renders the broader contextual sense rather than forcing each difficult clause woodenly.
    reason: segmentation_note
  - marker: '17'
    text: The phrase about Enoch is textually dense. The translation understands it to mean that Noah surpassed all other humans in lifespan except Enoch, while Enoch's distinctive role was as a witness for future generations until the day of judgment.
    reason: alternative_reading
  - marker: '21'
    text: The tower measurements in the Ethiopic are notoriously difficult, and some numerals/units may be corrupt. The translation preserves the transmitted figures as literally as possible, but the exact dimensions remain uncertain.
    reason: textual_variant
  - marker: '22'
    text: The wording echoes the Babel account but should not be treated as a mere quotation of Genesis; Jubilees embeds it in the angelic first-person revelation framework.
    reason: cross_reference
  - marker: '25'
    text: The name rendered 'Overthrow' reflects a ruin-name after the tower's collapse. The underlying form is uncertain in the Ethiopic tradition.
    reason: lexical_alternative
  - marker: '28'
    text: The territorial description of Canaan's settlement is compressed and somewhat difficult. 'To the west, that is, to the sea' represents the inheritance region he should have taken rather than the Lebanon region where he actually settled.
    reason: segmentation_note
  - marker: '35'
    text: The clause about Madai and 'his wife's brother' is awkward in Ethiopic. The translation takes Elam, Asshur, and Arpachshad as the parties from whom he requested a portion, with Arpachshad especially linked by marriage.
    reason: segmentation_note
translation:
  language: ko
  text: '1[1]. 그리고 심판의 장소가 만들어졌습니다. 그리고 우리 중 한 사람이 말했습니다. “노아에게 그들의 모든 치료법을 가르치자.

    2. 더러운 귀신들이 노아의 아들들의 자손을 미혹하여 미혹하게 하고 멸망시키기 시작하였더라.”

    3. 그가 그의 하나님 주님 앞에 기도하여 이르되 모든 육체의 생명의 하나님이여 나를 긍휼히 여기사 나와 내 아들들을 홍수에서 구원하사 멸망의 아들들을 멸망시킨 것 같이 나를 멸망시키지 아니하셨으니

    4. 나에 대한 주의 은혜가 크시며 내 생명에 대한 주의 인자하심도 크시니이다. 주의 은혜가 내 아들들에게 임하게 하시고 악한 영들이 그들을 주관하지 못하게 하소서 그들이 땅에서 멸절할까 두렵나이다.

    5. 그러나 나와 내 아들들을 축복하여 우리가 생육하고 번성하여 땅에 충만하게 하라.

    6. 그리고 당신은 이 영혼들의 아버지인 당신의 감시자들이 나의 시대에 어떻게 행동했는지 알고 있습니다[11]. 내 하나님이여 이 살아 있는 영들을 가두어 심판하시는 곳에 가두사 그들로 주의 종의 아들들을 멸하지 마옵소서 그들은 악한 자라 멸하기 위하여 창조된 것임이니이다

    7. 그들로 산 자의 영혼을 주관하지 못하게 하소서 그들의 심판은 오직 주께서 아시나이다 이제부터 영원까지 그들이 의인의 아들들을 다스리지 못하게 하라.”

    8. 그리고 우리 하나님 주님께서는 그 모든 것을 묶어 두라고 우리에게 말씀하셨습니다.

    9. 영들의 우두머리 마스테마가 와서 이르되 주 창조주여 그들 중 몇 사람을 내 앞에 머물러 있게 하여 내 말을 듣고 내가 그들에게 이르는 대로 다 행하게 하여 그들 중에서 얼마를 내게 남겨 두지 아니하면 내가 사람의 아들들에게 내 뜻의 권위를 행사할 수 없느니라 그들은 멸망으로 인도하고 내 심판 앞에서 미혹하게 하려 함이라 인생의 죄악이 큼이라

    10. 그가 이르시되 그 십분의 일은 그 앞에 두고 아홉 부분은 재판하는 곳으로 내려가게 하라 하신지라

    11. 그리고 우리 중 한 사람은 노아에게 그들의 모든 약을 가르쳐야 한다고 말했습니다. 왜냐하면 그는 그들이 정직하게 걷지 않고 의롭게 싸우지 않는다는 것을 알았기 때문입니다. 우리는 그의 모든 말씀대로 행하여 잔인한 모든 악한 자를 재판장에 결박하고

    12. 우리는 그들 중 십분의 일을 남겨 두었습니다. 그것은 땅에서 사탄 앞에 복종하게 하려는 것이었습니다. 그리고 우리는 노아에게 그들의 잘못에 대한 모든 치료법을 알려 주었고, 땅의 식물로 그들이 고침을 받을 수 있도록 했습니다.

    13. 그리고 노아는 우리가 그에게 가르친 모든 것과 모든 치료법을 책에 기록했습니다. 악한 영들이 노아의 아들들을 따르지 못하게 되었습니다.

    14. 그리고 그가 기록한 모든 것을 그의 아들 셈에게 주었으니 이는 그가 그의 모든 아들보다 그를 더 사랑하였음이더라.

    15. 노아는 그의 조상들과 함께 자고, 아라랏 땅에 있는 루발 산에 장사되었습니다.

    16. 그의 생애가 구백오십 년을 채우고

    17. 열아홉 희년과 이 이레와 오년이요 그리고 그가 이 땅에 사는 동안, 그가 완전한 의로움으로 인해 에녹 외에는 사람의 아들들보다 뛰어났습니다. 에녹의 직무는 세상의 대대에 증거하기 위하여 작정되었으니 이는 그가 심판 날까지 대대로 모든 행위를 말하게 하려 함이라.

    18. 삼십삼째 희년 곧 둘째 주의 첫째 해에 벨렉이 아내를 맞이하였으니 그의 이름은 시나알의 딸 롬나라 그가 이번 주의 사년에 그에게 아들을 낳으니라. 그리고 그 이름을 르우라고 불렀습니다. “보라, 인생들이 악을 행하여 자기들을 위하여 시날 땅에 성읍과 탑을 건설하였다.”

    19. 그들은 아라랏 땅에서 동쪽으로 떠나 시날에 이르러 그의 시대에 성과 탑을 건축하고 이르기를 오라 우리가 그것으로 하늘에 올라가자 하였느니라.

    20. 그들이 건축을 시작하고 넷째 주에 불로 벽돌을 만들었으니 그 벽돌이 돌이 되고 그들이 바른 진흙은 시날 땅의 바다와 샘에서 나온 아스팔트였더라.

    21. 그리고 그들은 마흔삼 년 동안 그것을 건축했습니다. 그 너비는 204규빗이고 높이는 벽돌의 3분의 1이었습니다. 그 높이는 5,433규빗, 종려나무 2개이며, 한 성벽의 넓이는 열두 스타드요, 다른 성벽의 넓이는 삼십 스타드였습니다.

    22. 우리 하나님 주님께서 우리에게 이르시되 보라 그들이 한 민족이 되어 이 일을 시작하였으니 이제는 그들에게 숨길 것이 없느니라 자, 내려가서 그들의 혀를 혼잡하게 하여 그들이 다른 사람의 말을 듣지 못하게 하여 그들이 여러 성읍과 나라들로 흩어져서 심판 날까지 다시는 그들의 뜻이 변하지 아니하리로다 하셨느니라

    23. 주님께서 내려가시매 우리도 그와 함께 내려가서 사람의 아들들이 건축한 성과 탑을 보았는데 그리고 그분께서 그들의 모든 혀를 혼잡하게 하셔서 그들이 더 이상 서로 말하는 것을 듣지 않게 하시고, 그들이 그 도시와 탑 건설을 그쳤습니다. 그러므로 시날 온 땅을 바벨이라 부르니 이는 주님께서 거기서 인생의 모든 언어를 혼잡하게 하셨음이라 그들이 거기서부터 각 성읍으로 흩어졌으니 각각의 언어와 종족을 따르더라.

    24. 주님께서 그 망대에 강한 바람을 보내사 망대를 땅에 무너뜨리시매 그리고 봐,

    25. 그것은 시날 땅에 있는 앗수르와 바벨론 사이에 있습니다. 그리고 그는 그 이름을 Overthrow라고 불렀습니다.

    26. 첫째 해 넷째 주 곧 삼십사 희년이 되자 그들이 시날 땅에서 흩어졌습니다.

    27. 그리고 함과 그의 아들들은 남쪽 땅에서 자기에게 분배된 땅으로 들어갔습니다.

    28. 가나안은 레바논 땅을 애굽 강까지 보았고 그곳이 심히 좋았으므로 자기 기업의 땅 서쪽 곧 바다로 들어가지 아니하고 오직 레바논 땅 동쪽과 서쪽과 요단 경계선과 바다 경계선에서 거주하였더라.

    29. 그의 아버지 함과 그의 형제 구스와 미스라임이 그에게 이르되 너는 네 것이 아닌 땅 곧 우리를 위하여 제비 뽑아 나오지 아니한 땅에 거하였으니 그렇게 하지 말라

    30. 만일 그렇게 하면 너와 네 아들들은 그 땅에 쓰러지고 반역함으로 인해 저주를 받을 것이다. 왜냐하면 네가 반역함으로 자리를 잡았고, 반역함으로 네 아들들이 쓰러지고, 너는 영원히 뿌리 뽑힐 것이기 때문이다.

    31. 셈의 집에 거주하지 말라 셈과 그 아들들이 제비를 뽑아 얻은 것이니라

    32. 너는 저주를 받았으니 노아의 모든 아들보다 더 저주를 받을 것이라 우리가 거룩한 재판관과 우리 아버지 노아 앞에서 맹세로 맹세한 저주로 말미암아 네가 더 저주를 받을 것이라

    33. 그러나 그가 그들의 말을 듣지 아니하고, 그와 그의 아들들이 오늘까지 레바논 땅 하맛에서부터 애굽 어귀까지 거주하니라.

    34. 그래서 그 땅의 이름을 가나안이라 불렀다.

    35. 그리고 야벳과 그의 아들들은 바다로 가서 그들의 몫의 땅에 살았습니다. 마대가 바다를 보고도 기뻐하지 아니하여 엘람과 앗수르와 그의 아내의 아우 아르박삿에게 얼마를 구하되

    36. 그가 메디아 땅에 거주하여 오늘까지 그 처조와 함께하였더니 그가 자기 거처와 그 아들들의 거처를 그 아버지 마다이의 이름을 따서 메대라 칭하였더라.'
