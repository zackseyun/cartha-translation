base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/006.yaml
  text: '1[a]. And on the new moon of the third month he came out of the ark, and he built an altar on that mountain. And he made atonement for the earth, and he took a young goat and made atonement with its blood for all the guilt of the earth, because everything that had been on it had been destroyed, except those that were in the ark with Noah.

    2. And he placed the fat on the altar, and he took an ox and a ram and a sheep and kids and salt and a turtle-dove and a young pigeon, and he offered a burnt offering on the altar, and he set upon them an offering mixed with oil, and he poured out wine, and he put incense over everything, and he caused a pleasing fragrance to rise up, acceptable before the LORD.

    3. And the LORD smelled the pleasing fragrance, and he made a covenant with him that there should never again be floodwaters to destroy the earth

    4[b]. all the days of the earth: seedtime and harvest shall not cease, cold and heat, summer and winter, and day and night shall not change their order, nor shall they cease forever.

    5. And as for you, increase and multiply on the earth, and become many upon it, and be a blessing upon it. The fear of you and the dread of you I will put upon everything that is on the earth and in the sea.

    6. And behold, I have given you all the beasts and everything that moves and everything that lives on the earth, and the fish in the waters, and everything for food; like the green plants I have given you everything to eat.

    7. But flesh with its life, with its blood, you shall not eat; for the life of all flesh is in the blood, lest your blood of your lives be sought. From the hand of every man, from the hand of every living thing, I will require the blood of man.

    8. Whoever sheds the blood of a man, by a man shall his blood be shed; for in the likeness of God he made Adam.

    9. And as for you, increase greatly upon the earth.

    10. And Noah and his sons swore that they would not eat any blood that is in any flesh, and he made a covenant before the LORD God forever throughout all the generations of the earth in this month.

    11. Therefore I have said that you shall make a covenant, you also, with the children of Israel in this month upon the mountain, with an oath; and you shall sprinkle blood upon them because of all the words of the covenant that the LORD made with them for all days.

    12. And this testimony is written concerning you so that you may keep it always: that you must not eat any blood of beasts or birds or cattle during all the days of the earth. And the man who eats the blood of beast or cattle or birds during all the days of the earth—he and his seed shall be rooted out from the earth.

    13. And you, command the children of Israel not to eat any blood, so that their name and their seed may be before the LORD our God always.

    14. And there is no limit of days for this law, for it is forever. They shall keep it throughout their generations, so that they may continue supplicating on your behalf with blood before the altar every day and at the time of morning and evening. They shall seek atonement for themselves continually before the LORD, so that they may keep it and not be uprooted.

    15. And he gave Noah and his sons a sign that there should never again be a flood upon the earth.

    16. He set his bow in the cloud for a sign of the everlasting covenant, that there should never again be floodwaters upon the earth to destroy it all the days of the earth.

    17. For this reason it is ordained and written on the heavenly tablets that they should celebrate the feast of weeks in this month, once each year, to renew the covenant every year.

    18. And this whole festival was celebrated in heaven from the day of creation until the days of Noah—twenty-six jubilees and five weeks of years. And Noah and his sons kept it for seven jubilees and one week of years, until the day of Noah''s death. And from the day of Noah''s death his sons corrupted it until the days of Abraham, and they ate blood.

    19. But Abraham alone kept it, and Isaac and Jacob and his children kept it until your days. And in your days the children of Israel forgot it until I renewed it for them on this mountain.

    20. And you also, command the children of Israel that they keep this festival throughout their generations,

    21. as a command for them: one day in the year, in this month, they shall celebrate the festival. For it is the feast of weeks, and it is the feast of firstfruits. This festival is twofold and of two kinds.

    22. As it is written and engraved concerning it, celebrate it. For I have written in the book of the first law what I wrote for you, that you should celebrate it at its appointed time, one day in the year. And I told you its sacrifices, that they should be a memorial, and the children of Israel should celebrate it throughout their generations in

    23. this month, one day every year. And on the new moon of the first month, and on the new moon of the fourth month, and on the new moon of the seventh month, and on the new moon of the tenth month are the days of remembrance, and they are the days of the seasons in the four divisions of the year. They are written and ordained

    24. as a testimony forever. And Noah ordained them for himself as festivals for the generations forever,

    25. so that they became for him a memorial. And on the new moon of the first month it was said to him that he should make the ark,

    26. and on it the earth became dry and he opened it and saw the earth. And on the new moon of the fourth month the mouths of the depths of the abyss beneath were closed. And on the new moon of the seventh month all the mouths of

    27. the depths of the earth were opened, and the waters began to descend into them. And on the new moon of the tenth month

    28. the tops of the mountains appeared, and Noah rejoiced. Therefore he ordained them for himself as festivals for remembrance forever, and thus they are ordained.

    29. And they were placed on the heavenly tablets, each one thirteen weeks from one to another: from the first to the second, and from the second to the third, and from the third to the fourth.

    30. And all the days of the command are fifty-two weeks of days, and all of them make a complete year. Thus it is engraved and ordained on the heavenly tablets, and there is no transgressing a single year, from year to year.

    31. And command the children of Israel that they keep the years according to this reckoning: three hundred and sixty-four days, and it will be a complete year. And they shall not disturb its time from its days or from its festivals, for everything will fall in them according to their testimony, and they will not pass over a day nor disturb a festival.

    32. But if they transgress and do not observe them according to his command, then all their seasons will be disturbed, and the years will be moved from this order, and their seasons will be disturbed and the years will be moved.

    33. And all the children of Israel will forget, and will not find the path of the years, and they will forget the new moons and seasons and sabbaths, and they will go wrong as to the whole order of the years.

    34. For I know, and from now on I will make you know—not from my own heart, for the book is written before me, and it is ordained on the heavenly tablets—the divisions of the days, lest they forget the festivals of the covenant and walk according to the festivals of the nations, after their error and after their ignorance.

    35. For there will be those who will surely make observations of the moon—how it disturbs the seasons

    36. and comes in from year to year ten days too soon.

    37. Therefore years will come upon them when they disturb the order, and they will make an abominable day a day of testimony, and an unclean day a festival day, and they will mix up all the holy days with the unclean, and the unclean day with the holy; for they will go wrong as to months and sabbaths and festivals and jubilees.

    38. Therefore I command you and testify to you, so that you may testify to them; for after your death your children will corrupt it, so that they will not make the year only three hundred and sixty-four days. Therefore they will go wrong as to the new moons and seasons and sabbaths and festivals[j][i][h][g][f][e][d][c], and they will eat all kinds of blood with all kinds of flesh.'
  footnotes:
  - marker: a
    text: Verse 10 is textually awkward in the extracted row, but the sense is that Noah and his sons bound themselves by oath not to eat blood, and a perpetual covenant was established in that month.
    reason: segmentation_note
  - marker: b
    text: Verse 11 likely alludes to the Sinai covenant ceremony on the mountain, with blood applied in connection with the covenant's words; compare Exodus 24.
    reason: cross_reference
  - marker: c
    text: Verse 14 is difficult. The line appears to connect Israel's blood-rites at the altar with ongoing intercession/atonement, so the translation keeps both sacrificial and supplicatory senses in view.
    reason: segmentation_note
  - marker: d
    text: In verse 18, the translation 'twenty-six jubilees' follows the chronological math of the book (1309 years), though the specific Ge'ez manuscript text here reads 'sixteen' (ዐሥራ፡ ወስድስተ). The verse then contrasts Noah's observance with later corruption after his death.
    reason: textual_variant
  - marker: e
    text: Verse 21's 'twofold and of two kinds' is terse and somewhat obscure; it likely means the festival combines the themes of Weeks and Firstfruits.
    reason: lexical_alternative
  - marker: f
    text: Verses 23-29 use 'new moon' for the first day of the month. The chapter still rejects using lunar observation to regulate the year in vv. 35-38; the issue is not the existence of months but dependence on a moon-based calendar.
    reason: cultural_note
  - marker: g
    text: 'Verse 27 may sound paradoxical: the subterranean openings are ''opened'' as the waters descend into them. The translation preserves the wording rather than smoothing it away.'
    reason: segmentation_note
  - marker: h
    text: Verse 29 counts thirteen weeks between each memorial point, yielding four equal quarters in a 364-day year.
    reason: cross_reference
  - marker: i
    text: Verse 35's wording is difficult; the sense is that some will base reckoning on the moon, and this will throw the appointed times out of order.
    reason: segmentation_note
  - marker: j
    text: Verse 38's numerals are corrupted in the extracted row, but the intended total is the 364-day year already stated clearly in verse 31.
    reason: textual_variant
translation:
  language: ko
  text: '1[a]. 그리고 셋째 달 초하룻날에 그가 방주에서 나와서 그 산에 제단을 쌓았습니다. 땅을 위하여 속죄하시고 또 염소 새끼 하나를 취하여 땅의 모든 죄를 위하여 속죄하셨으니 이는 노아와 함께 방주에 있던 자들 외에 거기에 있던 모든 것이 다 멸망하였음이라.

    2. 그는 기름을 단 위에 놓고 소와 숫양과 양과 어린아이와 소금과 산비둘기와 집비둘기 새끼를 가져다가 단 위에 번제를 드리고 그 위에 기름 섞은 제물을 드리고 포도주를 붓고 모든 것에 향을 얹어 주님 앞에 기뻐하실 만한 향기가 오르게 하였느니라.

    3. 주님께서 그 향기를 받으시고 다시는 홍수가 나서 땅을 멸하지 아니하리라고 그와 언약을 세우시니라

    4[b]. 땅의 모든 날이라 심는 때와 추수하는 때가 그치지 아니하며 추위와 더위와 여름과 겨울과 낮과 밤이 그 순서를 바꾸지 아니하며 영원히 그치지 아니하리라.

    5. 그리고 너희는 땅에서 생육하고 번성하여 땅에서 번성하여 땅을 축복하라. 내가 땅과 바다에 있는 모든 것에 너를 두려워하고 너를 두려워하게 하리니

    6. 보라, 내가 모든 짐승과 움직이는 모든 것과 땅에 사는 모든 것과 물에 있는 물고기와 먹을 수 있는 모든 것을 너희에게 주노라. 푸른 풀처럼 내가 너희에게 먹을 것을 모두 주었느니라.

    7. 그러나 고기를 그 생명과 피는 먹지 말 것이니라. 모든 육체의 생명은 피에 있음이니 이는 너희 생명의 피를 찾지 않게 하려 함이라. 모든 사람의 손, 모든 생물의 손에서 내가 사람의 피를 요구하리라.

    8. 사람의 피를 흘리는 자는 그 사람도 그 피를 흘릴 것이니 왜냐하면 하나님이 아담을 하나님의 형상대로 만드셨기 때문입니다.

    9. 그리고 너희는 땅 위에 크게 번성하라.

    10. 노아와 그의 아들들은 육체의 피를 먹지 아니하리라 맹세하고 이 달에 땅 대대로 영원히 주님 하나님 앞에서 언약을 세웠느니라.

    11. 그러므로 내가 이르기를 너희도 이 달에 산에서 이스라엘 자손과 맹세하여 언약을 맺기로 하였느니라 주님께서 그들과 평생 동안 세우신 모든 언약의 말씀을 인하여 너는 그 위에 피를 뿌릴지니라

    12. 그리고 이 증거는 너희를 위하여 기록되었으니 너희로 이를 항상 지키라 곧 땅의 모든 날 동안에 짐승이나 새나 가축의 피를 먹지 말라 하였느니라. 땅에 있는 모든 날 동안 짐승이나 소나 새의 피를 먹는 사람은 그와 그의 자손이 땅에서 뽑히리라.

    13. 그리고 이스라엘 자손에게 명령하여 피를 먹지 말아서 그들의 이름과 자손이 우리 하나님 주님 앞에 영원히 있게 하옵소서.

    14. 이 율법은 날수에 제한이 없으니 이는 영원함이라. 그들은 그것을 대대로 간직하여 매일 아침 저녁 시간에 제단 앞에서 피로써 너희를 위하여 간구할 것이니라. 그들은 자기를 위하여 주님 앞에 항상 속죄를 구하여 그것을 지켜 뽑혀지지 아니하게 하라.

    15. 그리고 그는 노아와 그의 아들들에게 땅에 다시는 홍수가 일어나지 않을 것이라는 표징을 주셨습니다.

    16. 그분께서 그 무지개를 구름 속에 두어 영원한 언약의 표를 삼으셨으니 이는 땅의 모든 날에 다시는 땅에 홍수가 나서 땅을 멸하지 아니하게 하려 하심이니라

    17. 그러므로 그들은 매년 이 달에 칠칠절을 기념하여 매년 언약을 갱신하라고 하늘 판에 정하고 기록되었느니라.

    18. 창조의 날부터 노아의 날까지 이 모든 절기를 하늘에서 지켰으니 곧 이십육 희년과 년간 오 이레라. 그리고 노아와 그의 아들들은 노아가 죽는 날까지 일곱 희년과 한 주 동안 그것을 지켰습니다. 노아가 죽은 날부터 그의 아들들이 아브라함의 때까지 그것을 더럽혀 피를 먹었느니라.

    19. 그러나 아브라함만이 그것을 지켰고 이삭과 야곱과 그의 자손들이 너희 시대까지 이를 지켰느니라. 너희 시대에 이스라엘 자손은 내가 이 산에서 그들을 위하여 새롭게 할 때까지 그것을 잊어버렸느니라.

    20. 그리고 당신은 이스라엘 자손에게 명령하여 대대로 이 절기를 지키도록 하십시오.

    21. 그들의 명령은 일년 중 어느 날, 이 달에 축제를 지킬 것이니라. 이는 칠칠절이요 첫 열매의 절기라. 이 축제는 두 가지 종류로 이루어져 있습니다.

    22. 그것에 기록되고 새겨져 있는 대로 기념하여라. 내가 너희를 위하여 쓴 것을 첫 번째 율법 책에 기록하였으니 너희는 정한 때 곧 일년 중 하루를 지키라 하였느니라. 내가 이 제사를 너희에게 말하였나니 이는 기념물이 되어 이스라엘 자손이 대대로 이를 기념하게 하려 함이라.

    23. 이번 달, 매년 하루. 그리고 첫째 달 초승달과 넷째 달 초승달과 일곱째 달 초승달과 열째 달 초승달을 기념하는 날로 삼아 일 년을 사방으로 나누는 절기니라. 그들은 기록되고 성임되었습니다

    24. 영원히 증거로 삼으리로다 노아가 이를 자기를 위하여 정하여 대대로 영원한 절기로 삼았으니

    25. 그래서 그것은 그분을 위한 기념물이 되었습니다. 첫째 달 초삭에 방주를 만들라 명하시되

    26. 그 위에 땅이 마르매 그가 땅을 열어 보니 땅이 보이더라. 그리고 넷째 달의 초승달에는 그 아래 깊은 바다의 어귀들이 닫혔습니다. 일곱째 달 초삭에 모든 입이

    27. 땅의 깊은 곳이 열리고 물이 그곳으로 흘러 들어가기 시작했습니다. 그리고 열째 달 초승달에

    28. 산들의 꼭대기가 보이고 노아는 기뻐하였다. 그러므로 하나님은 이것을 자기를 위하여 영원히 기억할 절기로 정하셨고, 그리하여 정하신 것입니다.

    29. 그것들은 각각 십삼 이레씩 하늘의 판들 위에 두었으니 첫째부터 둘째까지, 둘째부터 셋째까지, 셋째부터 넷째까지라.

    30. 명령의 모든 날은 오십이 이레이며 모두가 한 해를 이룬다. 그리하여 그것을 하늘의 판에 새기고 정해 두어 해마다 단 한 해도 범법함이 없느니라.

    31. 그리고 이스라엘 자손에게 명령하여 이 계산대로 연수를 지키게 하라. 삼백육십사 일이면 한 해가 되리라. 그들은 그 때와 그 절기를 방해하지 말지니 이는 모든 것이 그들의 증거대로 그들에게 임할 것임이니 하루도 넘기지 아니하며 절기를 어지럽히지도 아니하느니라.

    32. 만일 그들이 범죄하여 그의 명령대로 지키지 아니하면 그 모든 계절이 변하여 그 해가 이 순서에서 옮겨지리니 그 계절이 변하여 그 해가 변하리라.

    33. 이스라엘 자손이 다 잊어버리고 연한의 길을 찾지 못하며 월삭과 절기와 안식일을 잊어버리고 연한의 순서대로 어긋나리라

    34. 내가 아노니 이제부터 내가 너희에게 알게 하노니 내 마음에서가 아니라 이 책이 내 앞에 기록되었고 날의 구분을 하늘 판에 정하였음이라 이는 그들이 언약의 절기를 잊어버리고 민족들의 절기를 따라 자기들의 그릇됨과 무지함을 따라 행하지 않게 하려 함이라

    35. 달이 계절을 어떻게 바꾸는지 관찰하는 사람들이 있을 것이기 때문이다.

    36. 그리고 해마다 열흘이나 빨리 들어오곤 해요.

    37. 그러므로 그들이 질서를 어지럽히는 해가 그들에게 이르리니 그들이 가증한 날을 증거의 날로, 부정한 날을 절기로 삼을 것이며 모든 성일을 부정한 날과 부정한 날을 성일로 삼을 것이며 왜냐하면 그들은 달과 안식일과 축제와 희년을 잘못 지키게 될 것이기 때문입니다.

    38. 그러므로 내가 네게 명령하고 증거하는 것은 너로 그들에게 증거하게 하려 함이라. 네가 죽은 후에 네 자녀들이 그것을 부패시켜서 한 해가 삼백육십사 일밖에 되지 못하게 할 것이기 때문이다. 그러므로 그들이 월삭과 절기와 안식일과 절기를 위반하여 온갖 피와 온갖 고기를 먹을 것입니다.'
