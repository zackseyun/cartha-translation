base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001.yaml
  text: '1[a]. And it happened in the first year of the exodus of the children of Israel from Egypt, in the third month,

    2. on the sixteenth day of that month, the LORD spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written so that you may teach them.” And Moses went up onto the mountain of the LORD, and the glory of the LORD dwelt on Mount Sinai,

    3. and the cloud overshadowed it for six days.

    4. And on the seventh day he called to Moses from the midst of the cloud, and the glory of the LORD appeared like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.

    5. And the LORD taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book[b], so that their generations may see that I have not abandoned them because of all the evil that they have done in transgressing the ordinance that I establish today between me and you

    6. for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they in all their judgments and in all their deeds,

    7. and they will know that I have truly been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give a land flowing with milk and honey.’ And they will eat and be satisfied,

    8. and they will turn to foreign gods, to those who cannot deliver them from any of their distress.

    9. And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.

    10. And many will perish, and they will be seized and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.

    11. And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.

    12. And I will send witnesses to them so that I may testify to them, but they will not listen; and they will kill the witnesses also, and those who seek the law they will drive away, and they will overturn everything and begin to do evil

    13. before my eyes. And I will hide my face from them, and I will deliver them into the hand of the nations for captivity and for plunder and for devouring, and I will remove them from the midst of the land, and I will scatter them among the nations.

    14. And they will forget all my law and all my commandments and all my judgments, and they will go astray as to new moons,

    15. and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace with righteousness, and I will transplant them as an upright planting,

    16. with all my heart and with all my soul. And they will be for a blessing and not for a curse, and they will be the head and not the tail. And I will build my sanctuary in their midst, and I will dwell with them,

    17. and I will be their God, and they will be my people in truth and in righteousness.

    18. And I will not abandon them, nor will I estrange myself from them, for I am the LORD their God.” And Moses fell on his face,

    19. and he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people,

    20. and create for them an upright spirit, and do not let the spirit of Beliar rule over them so as to accuse them before you and ensnare them from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them

    21. a clean heart and a holy spirit, and do not let them be caught in their sins from now and forever.” And the LORD said to Moses, “I know their contrariness and their thoughts and their stiff neck, and they will not listen

    22. until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,

    23. and I will open the covering of their heart and the covering of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from me from that day and forever.

    24. And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.

    25. And they all will be called children of the living God, and every angel and every spirit will know—yes, they will know—that these are my children and that I am their Father in uprightness and righteousness, and that I love them.

    26. And now I will write down for you all these words that I make known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them through all the ages of eternity.”

    27. And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst for all the ages of eternity.

    28. And the LORD will appear to the eyes of all, and all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion for all the ages of eternity. And Zion and Jerusalem will be holy.”

    29. And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years—from the time of the creation—of the law and of the testimony, of the weeks of the jubilees, year by year in all their number, and the jubilees year by year, from the day of the new creation when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of the LORD is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel[g][f][e][d][c], and so that it may be thus from that day and throughout all the days of the earth.'
  footnotes:
  - marker: a
    text: Verse 5's phrase 'the account of the divisions of all the days of the law and the testimony' is difficult. The wording likely introduces the book's chronological framework rather than merely 'history.'
    reason: lexical_alternative
  - marker: b
    text: Verse 9's final list may also be rendered 'for offense, for affliction, for trouble, and for a snare.' The sequence is rhetorically cumulative.
    reason: lexical_alternative
  - marker: c
    text: Verse 11 contains several difficult cultic terms. 'High places and groves and carved images' reflects a best-effort rendering of a list of illicit worship objects/practices.
    reason: textual_variant
  - marker: d
    text: Verse 14's first item is uncertain in the transmitted Ethiopic. It is commonly understood to refer to calendrical observances such as new moons; the surrounding terms clearly concern sacred times.
    reason: textual_variant
  - marker: e
    text: Verse 23 literally speaks of opening or removing the 'covering' of the heart; this may overlap conceptually with uncircumcising/circumcising-heart imagery in biblical covenant texts.
    reason: cross_reference
  - marker: f
    text: Verse 26's 'weeks of their jubilees' preserves the technical heptadic chronology of Jubilees. It should not be reduced to ordinary seven-day weeks.
    reason: cultural_note
  - marker: g
    text: Verse 29 is syntactically dense and may reflect segmentation difficulties. The translation preserves the sense of a written heavenly record of years, law, testimony, and jubilee cycles extending from creation to final renewal.
    reason: segmentation_note
translation:
  language: ko
  text: '1[a]. 이스라엘 자손이 애굽에서 나온 지 첫째 해 셋째 달에 이런 일이 일어났으니

    2. 그 달 십육일에 주님께서 모세에게 말씀하여 이르시되 산으로 내게로 올라오라 내가 율법과 계명을 기록한 두 돌판을 네게 주리니 너로 가르치리라 하신지라 모세가 주님의 산에 올라가니 주님의 영광이 시내산에 머무르고

    3. 그리고 엿새 동안 구름이 그것을 덮었습니다.

    4. 일곱째 날에 그가 구름 가운데서 모세를 부르시니 주님의 영광이 산 꼭대기에 붙는 불 같이 나타나시니라 그리고 모세는 사십 주 사십 야를 산에 있었습니다.

    5. 주님께서 처음과 장래 일과 율법의 모든 날의 구분과 증거의 일을 그에게 가르치시니라 이르시되 내가 이 산에서 네게 이르는 모든 것을 너는 마음에 두고 책에 기록하라 이는 그들이 오늘 나와 너희 사이에 세우는 규례를 그들이 어겨 모든 악을 행하였으므로 내가 그들을 버리지 아니한 것을 그들의 후손으로 알게 하려 함이라

    6. 시내산에서 그들의 세대를 위하여.” 이러하리라 이 모든 일이 그들에게 임한 후에 그들은 자기의 모든 심판과 모든 행위에 있어서 내가 그들보다 의로운 줄 알리라

    7. 그러면 그들은 내가 진실로 그들과 함께 있었다는 것을 알게 될 것입니다. 내가 오늘 네게 알리는 모든 말을 너는 기록하라 내가 그들의 조상 아브라함과 이삭과 야곱을 향하여 맹세하여 이르기를 내가 젖과 꿀이 흐르는 땅을 네 자손에게 주리라 한 땅으로 그들을 인도하여 들이기 전에 나는 그들의 반역함과 그들의 목이 곧은 것을 아노라 그리하면 그들이 먹고 배부르리라

    8. 그들은 다른 신들에게로 향할 것인데, 그들은 자기들을 그 환난에서 건져내지 못하는 자들입니다.

    9. 그리고 이 증언은 그들에 대한 증언으로 들리게 될 것입니다. 그들은 나의 모든 계명과 내가 그들에게 명령하는 모든 것을 잊어버리고 이방인과 더러운 것과 수치스러운 일을 좇고 그들의 신들을 섬기리니 이것이 그들에게 거치는 것과 환난과 환난과 올무가 되리라.

    10. 많은 사람이 멸망하고 사로잡혀 원수의 손에 떨어지리니 이는 그들이 내 규례와 계명과 내 언약의 절기와 안식일과 내가 그들 중에서 나를 위하여 거룩하게 한 성물과 내 이름을 두려고 이 땅 가운데에 구별한 내 장막과 내 성소를 버렸음이라.

    11. 그들은 자기를 위하여 산당과 아세라와 조각한 형상을 만들고 각각 자기의 죄악에 절하며 마귀에게와 자기 마음의 그릇된 모든 일에게 자기 자녀를 제물로 드리리로다

    12. 그리고 내가 그들에게 증언하려고 증인을 보내겠지만 그들은 듣지 않을 것입니다. 증인들도 죽이고 율법을 구하는 자들을 쫓아내며 모든 것을 뒤엎고 악한 일을 시작하리라

    13. 내 눈앞에서. 내가 그들에게서 내 얼굴을 가리고 그들을 열방의 손에 넘겨 포로와 약탈과 삼키게 하며 그들을 땅 가운데에서 쫓아내며 열방 중에 흩으리로다

    14. 그들은 내 모든 율법과 내 모든 계명과 내 모든 규례를 잊어버리고 월삭과 같이 미혹하리라

    15. 안식일과 축제와 희년과 규례들입니다. 그 후에 그들이 마음을 다하고 뜻을 다하고 힘을 다하여 이방인 중에서 내게로 돌아올 것이라 내가 그들을 모든 이방인 중에서 모으리니 그들이 나를 찾아 발견되리라 그들이 마음을 다하고 성품을 다하여 나를 구하면 내가 의와 함께 풍성한 평안을 그들에게 나타내리니 내가 그들을 곧게 심은 식물처럼 심을 것이요

    16. 내 마음을 다하고 뜻을 다하여. 그리고 그들은 축복이 되고 저주가 되지 않을 것이며, 머리가 되고 꼬리가 되지 않을 것입니다. 내가 그들 가운데 내 성소를 건축하고 그들과 함께 거할 것이며

    17. 나는 그들의 하나님이 되고 그들은 진리와 정의로 나의 백성이 되리라.

    18. 나는 그들을 버리지 아니하며 그들에게서 떠나지도 아니하리니 나는 그들의 하나님 주님임이니라 그리고 모세는 얼굴을 땅에 대고 엎드렸습니다.

    19. 그가 기도하여 이르되 주 나의 하나님이여 주의 백성과 주의 기업을 버리지 마시고 그들의 마음의 그릇된 길로 행하지 마옵소서 그들을 그들의 원수 곧 이방인들의 손에 붙이지 마옵소서 그들이 그들을 주관하여 주께 범죄하게 할까 두려우니이다 주님여, 주의 백성 위에 주의 자비를 베푸소서

    20. 그들에게 정직한 영을 창조하시고 벨리알의 영이 그들을 주관하게 하사 그들을 주 앞에서 고소하지 못하게 하사 그들을 모든 의의 길에서 꾀어 그들이 주의 앞에서 멸망하게 하지 마옵소서 그러나 그들은 주의 큰 능력으로 애굽의 손에서 구원하신 주의 백성이요 주의 기업이로소이다. 그들을 위해 창조하세요

    21. 깨끗한 마음과 성령을 주시고 지금부터 영원히 죄에 빠지지 않게 하소서.” 주님께서 모세에게 이르시되 내가 그들의 반역과 생각과 목이 곧은 것을 아노니 그들이 듣지 아니하고

    22. 자기 죄와 자기 조상의 죄를 깨달을 때까지라 그 후에는 그들이 정직하고 마음을 다하고 뜻을 다하여 내게로 돌아오리라

    23. 그리고 내가 그들의 마음의 덮개와 그들의 후손의 마음의 덮개를 열고, 그들에게 성령을 창조하여, 그들이 그날부터 영원까지 나를 떠나지 않도록 깨끗하게 하겠다.

    24. 그리고 그들의 영혼은 나와 나의 모든 계명을 굳게 붙잡고 나의 계명을 행할 것이다. 그리고 나는 그들의 아버지가 되고 그들은 나의 자녀가 될 것이다.

    25. 그리고 그들 모두는 살아계신 하나님의 자녀라 일컬음을 받을 것이며 모든 천사와 모든 영은 그들이 내 자녀인 것과 내가 정직과 공의로 그들의 아버지인 것과 내가 그들을 사랑하는 것을 알 것이며 참으로 알리라.

    26. 이제 내가 이 산에서 너희에게 알게 한 이 모든 말 곧 처음이요 나중이며 장래에 올 일을 율법과 증거의 모든 날과 희년의 주간에 영원히 기록하리니 내가 강림하여 영원토록 저희와 함께 거하리라.”

    27. 그리고 앞을 내는 천사에게 말씀하셨다. “창조의 시작부터 영원토록 내 성소가 그들 가운데 세워질 때까지 모세를 위하여 기록하라.

    28. 주님께서 모든 사람의 눈에 나타나시리니 모든 사람이 내가 이스라엘의 하나님이요, 야곱의 모든 자손의 아버지요, 시온 산의 영원무궁토록 왕인 줄 알리라. 그리고 시온과 예루살렘이 거룩해질 것이다.”

    29. 이스라엘 진 앞에 가던 임재의 사자가 창조의 때로부터 율법과 증거와 해마다의 희년의 주간과 해마다의 희년을 기록한 판을 가져갔으니 곧 새 창조의 날부터 하늘과 땅과 그 모든 피조물이 하늘의 권능들과 땅의 모든 창조를 따라 새로워져 성소까지 이르리라 주님의 빛이 예루살렘 시온산에 창조되고 모든 빛이 새롭게 되어 이스라엘의 택하신 모든 자의 치료와 평강과 축복을 얻게 하려니와 그 날부터 세상의 모든 날에 이와 같으리라.'
