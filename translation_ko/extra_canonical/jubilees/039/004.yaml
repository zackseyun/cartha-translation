translation:
  language: ko
  text: 주님께서는 그가 하는 모든 일을 잘되게 하셨습니다. 요셉은 용모가 아름답고 보기에 매우 좋았습니다.[a] 그의 주인의 아내가 눈을 들어 요셉을 보고 그를 사랑했고, 그에게 청하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “보기에 매우 아름다웠습니다.”
    reason: 원문의 외모 묘사(특히 ‘보기에 매우 좋았다’)에 대한 자연스러운 대안 번역이며, 해당 구절 바로 뒤에 표지를 둡니다.
lexical_decisions:
- source_word: ሠናይ ... ራእዮ ... ጥቀ
  english_pob_choice: handsome in appearance and very good to look at
  chosen_korean: 용모가 아름답고 보기에 매우 좋았습니다
  alternatives_korean:
  - 용모가 아름답고 보기에 좋았습니다
  - 아름다운 용모를 지녔고 보기에 매우 좋았습니다
  lexicon: 용모 / 보이다
  rationale: Ge'ez의 ሠናይ는 외모의 아름다움을, ጥቀ는 그 정도를 강화하므로 ‘매우’를 살려 두 요소를 함께 반영했습니다.
- source_word: ወአንሥአት፡ አዕይንቲሃ
  english_pob_choice: lifted up her eyes
  chosen_korean: 눈을 들어
  alternatives_korean:
  - 눈을 치켜들고
  - 눈을 들어 올리고
  lexicon: 관용구
  rationale: 히브리계 관용 표현으로서 시선의 이동을 자연스럽게 나타내는 한국어 관용구를 사용했습니다.
- source_word: ወርእየቶ፡ ለዮሴፍ፡ ወአፍቀረቶ፡ ወአስተብቍዐቶ
  english_pob_choice: saw Joseph and loved him, and asked him
  chosen_korean: 요셉을 보고 그를 사랑하여 그에게 청하였습니다
  alternatives_korean:
  - 요셉을 보고 그를 사랑하여 그에게 구하였습니다
  - 요셉을 보고 그를 사랑하여 그에게 간청하였습니다
  lexicon: 청하다 / 구하다
  rationale: 문맥상 다음 동작은 요구나 간청을 뜻하므로, 과도한 해석 없이 ‘청하다’를 택해 행위의 방향을 분명히 했습니다.
theological_decisions:
