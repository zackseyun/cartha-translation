- from: 애굽 사람의 집에서, 요셉 때문에였습니다. 그리고 그가 하는 모든 것을 주님께서 형통하게 하셨습니다. 애굽 사람은 요셉의 손에 모든 것을 맡겼습니다. 그가 주님께서 자기와 함께 계신 것을 보았고, 그가 하는 모든 것을 주님께서 형통하게 하셨기 때문입니다.[a]
  to: 애굽 사람의 집에서 요셉 때문에, 그가 하는 모든 일을 주님께서 형통하게 하셨습니다. 애굽 사람은 요셉의 손에 모든 것을 맡겼습니다. 이는 그가 주님께서 요셉과 함께 계신 것을 보았고, 요셉이 하는 모든 일을 주님께서 형통하게 하셨기 때문입니다.
