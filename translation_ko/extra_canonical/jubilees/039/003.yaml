  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
  footnotes:
  - marker: a
    text: Or 'In the house of the Egyptian, because of Joseph, and everything that he did, the LORD made to prosper.'.
    reason: previous_rendering
translation:
  language: ko
  text: 애굽 사람의 집에서, 요셉 때문에였습니다. 그리고 그가 하는 모든 것을 주님께서 형통하게 하셨습니다. 애굽 사람은 요셉의 손에 모든 것을 맡겼습니다. 그가 주님께서 자기와 함께 계신 것을 보았고, 그가 하는 모든 것을 주님께서 형통하게 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ቤተ፡ ግብጻዊ፡ በእንተ፡ ዮሴፍ፡
  english_pob_choice: in the house of the Egyptian because of Joseph
  chosen_korean: 애굽 사람의 집에서, 요셉 때문에였습니다
  alternatives_korean:
  - 애굽 사람의 집에서, 요셉 때문에
  - 애굽 사람의 집 안에서, 요셉 때문에
  lexicon: 집에서 / 때문에
  rationale: 서두의 전치사구를 독립적인 상황 설명으로 살려, 문맥상 뒤의 형통 구절과 섞이지 않도록 했습니다. ‘요셉 때문에’를 통해 원문의 원인 표지를 직접적으로 드러냈습니다.
- source_word: ዘገብረ፡ ... ይሴርሖ።
  english_pob_choice: everything that he did, the LORD made to prosper
  chosen_korean: 그가 하는 모든 것을 주님께서 형통하게 하셨습니다
  alternatives_korean:
  - 그가 한 모든 것을 주님께서 번영하게 하셨습니다
  - 그가 하는 모든 일을 주님께서 잘되게 하셨습니다
  lexicon: 형통하게 하다
  rationale: 문맥상 단순한 성공보다 하나님의 주권적 번영/성취를 뜻하므로 ‘형통하게 하다’를 택했습니다. 한국 교회어의 익숙함은 유지하되, 원문의 결과적 축복 의미를 보존했습니다.
- source_word: ግብጻዊ፡ ኵሎ፡ በእዴሁ፡ ለዮሴፍ፡
  english_pob_choice: And the Egyptian left everything in Joseph’s hand
  chosen_korean: 애굽 사람은 요셉의 손에 모든 것을 맡겼습니다
  alternatives_korean:
  - 애굽 사람은 모든 것을 요셉의 손에 맡겼습니다
  - 애굽 사람은 모든 것을 요셉에게 맡겼습니다
  lexicon: 손에 맡기다
  rationale: ‘손’은 통치·관리 위임의 관용적 표현을 살려 주는 핵심 이미지이므로 유지했습니다. 단순 목적어로 평준화하기보다 책임 위임의 뉘앙스를 살렸습니다.
- source_word: ርእየ፡ ከመ፡ እግዚአብሔር፡ ምስሌሁ፡
  english_pob_choice: because he saw that the LORD was with him
  chosen_korean: 그가 주님께서 자기와 함께 계신 것을 보았고
  alternatives_korean:
  - 주님께서 그와 함께 계신 것을 보았고
  - 주님이 그와 함께 계신 것을 보고
  lexicon: 함께 계신
  rationale: 직접 신적 임재를 나타내는 표현이므로 단순한 동반보다 ‘함께 계신’으로 옮겼습니다. 주어가 ‘그가’인 이유는 원문의 관찰 주체를 분명히 하기 위함입니다.
theological_decisions:
- issue: 여호와/주님 표기
  chosen_reading: 본문의 ἐ/እግዚአብሔር에 해당하는 신명은 ‘주님’으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 주어진 영어 POB가 LORD를 사용하고 있으며, 이 구절은 서술문 안에서 일반 독자에게 자연스럽고 일관된 한국어 성경 어감을 위해 ‘주님’을 택했습니다. 특별한 야훼 표기 의무가 직접 주어진 원문/주석에 없고, 반복되는 신명 호칭을 흐리지 않는 범위에서 번역했습니다.
  doctrine_reference: 신명 번역 일관성
- issue: 형통의 반복
  chosen_reading: 두 번 나타나는 형통 진술을 모두 살려, 요셉에게서 본 하나님의 임재와 그 결과를 강조했습니다.
  alternative_readings:
  - 첫 번째 형통 구절만 번역
  - 뒤의 반복 구절을 생략
  rationale: 개정 이력과 영어 POB가 반복을 보존하고 있으므로, 수사적 중복을 제거하지 않고 그대로 살리는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 본문 반복 보존
