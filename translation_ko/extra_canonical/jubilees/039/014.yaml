    issue: 종결 서술어 ‘입니다’의 첨가
    rationale: 원문과 영어 POB는 모두 장소구의 연쇄이며, 원문에는 이를 명사 동일시 문장으로 만드는 계사가 없습니다. ‘입니다’는 구문 기능을 변경합니다.
  - severity: medium
    issue: 방향·장소 관계의 약화
    rationale: 원문의 반복된 ውስተ(안으로/안에)는 ‘집 안에 있는 감옥으로’라는 장소·방향 표현으로 드러내는 편이 충실합니다. 현행 ‘집 안에 있는 감옥’은 첫 감옥과의 방향 관계를 충분히 반영하지 못합니다.
