lexical_decisions:
- source_word: ሞቅሕ
  english_pob_choice: the prison
  chosen_korean: 그 감옥
  alternatives_korean:
  - 감옥
  - 그 감옥 안
  - 옥
  lexicon: 감옥
  rationale: 원문은 장소를 두 번 반복해 강조하므로, 첫머리에는 자연스러운 지시 표현을 살려 ‘그 감옥’으로 시작했습니다.
- source_word: ውስተ፡ ቤቱ፡ ለሊቀ፡ ዐቀብተ፡
  english_pob_choice: into the house of the chief of the keepers
  chosen_korean: 경비 책임자의 집 안에 있는
  alternatives_korean:
  - 경비원들의 우두머리의 집으로 들어간
  - 간수장 집 안의
  lexicon: 집 / 책임자 / 경비
  rationale: 직역적이되 한국어에서 어색하지 않도록 ‘chief of the keepers’를 ‘경비 책임자’로 풀어, 장소 관계는 ‘집 안에 있는’으로 표현했습니다.
- source_word: ኀበ፡ ሀሎ፡ ዮሴፍ፡ እኁዝ፡
  english_pob_choice: where Joseph was confined
  chosen_korean: 요셉이 갇혀 있던
  alternatives_korean:
  - 요셉이 갇혀 있는
  - 요셉이 구금되어 있던
  lexicon: 갇히다
  rationale: 수동적 구금 상태를 자연스럽게 살리기 위해 ‘갇혀 있던’으로 옮겼습니다.
theological_decisions:
- issue: 장소 반복의 보존
  chosen_reading: ‘감옥’의 반복을 유지해 원문의 중첩된 장소 표지를 드러냈습니다.
