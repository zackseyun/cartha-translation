  lexicon: Ge'ez prepositional phrase
  rationale: 장소를 분명히 하되, 한국어 서술 흐름상 ‘집 안에서’가 가장 자연스럽습니다.
- source_word: ትትበአስ
  english_pob_choice: to force him to lie with her
  chosen_korean: 함께 눕게 하려 하였으며
  alternatives_korean:
  - 그와 잠자리를 같이하게 하려 하였으며
  - 그와 동침하게 하려 하였으며
  lexicon: Ge'ez infinitival construction
  rationale: 직설적이면서도 원문의 강제성을 살리기 위해 ‘함께 눕게 하다’로 옮겼고, 과도한 완곡화는 피했습니다.
- source_word: ማዕጾ
  english_pob_choice: door-bar
  chosen_korean: 문빗장
  alternatives_korean:
  - 빗장
  - 문장대
  lexicon: Ge'ez noun for bar/bolt
  rationale: 문을 잠그는 빗장을 뜻하는 구체성을 살려 ‘문빗장’으로 옮겼습니다.
- source_word: ወርእየት
  english_pob_choice: And she saw
  chosen_korean: 그리고 그녀가 보았습니다
  alternatives_korean:
