translation:
  language: ko
  text: 그리고 그녀가 집 안에서 그를 붙잡아 함께 눕도록 강요하려고 하였으며, 집 안의 문들을 닫고 그를 붙잡았으나, 그는 자기 옷을 그녀의 손에 남겨 둔 채 문빗장을 부수고 그녀를 피해 밖으로 달아났습니다. 그리고 그녀가 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 사건 순서는 압축되어 있어 해석하기 어렵습니다. 에티오피아어 본문은 그녀가 문들을 닫고 그를 붙잡으며, 그가 옷을 남겨 두고 문빗장을 부수어 달아나는 순서를 압축하여 서술할 수 있습니다.
    reason: segmentation_note
