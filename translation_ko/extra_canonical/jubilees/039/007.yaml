translation:
  language: ko
  text: 그리고 그녀가 집 안에서 그를 붙잡아 함께 눕게 하려 하였으며, 그녀는 집의 문들을 닫고 그를 붙잡았으나, 그는 자기 옷을 그녀의 손에 남겨 둔 채 문빗장을 부수고 그녀의 얼굴 앞에서 밖으로 달아났습니다. 그리고 그녀가 보았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንዘተ
  english_pob_choice: she seized him
  chosen_korean: 그녀가 그를 붙잡아
  alternatives_korean:
  - 그녀가 그를 잡아
  - 그녀가 그를 움켜잡아
  lexicon: Ge'ez verb አንዘተ
  rationale: 첫 동사 ወአንዘተ를 빠뜨리지 않고, 뒤의 또 다른 ‘붙잡다’와 구별되도록 앞부분은 자연스러운 진행형 연결로 처리했습니다.
- source_word: በቤት
