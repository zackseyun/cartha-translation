  text: For Pharaoh, the chief of the guards. And he appointed Joseph over all his house, and the blessing of the LORD came to be.
translation:
  language: ko
  text: 파라오의 경호대장은 요셉에게 자기 집안 전체를 맡겼고, 야훼의 복이 있게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለፈርዖን፡ ሊቀ፡ ዐቀብት
  english_pob_choice: For Pharaoh, the chief of the guards.
  chosen_korean: 바로를 위해서입니다. 그리고 … 무리의 감독
  alternatives_korean:
  - 바로의 친위대장
  - 바로의 경호대장
  - 바로의 시종장
  lexicon: 포로/궁정 문맥의 직책 표현
  rationale: ge‘ez의 ‘chief of the guards’는 단순 호칭보다 바로 궁정의 경호 책임자를 가리키므로, 직책성을 살리되 한국어에서 통용되는 과도하게 특정한 관직명은 피했습니다.
- source_word: ወሤሞ፡ ለዮሴፍ፡ ዲበ፡ ኵሉ፡ ቤቱ
  english_pob_choice: And he appointed Joseph over all his house
  chosen_korean: 그는 요셉을 자기 집의 모든 것 위에 세웠고
  alternatives_korean:
  - 요셉을 자기 집 전체를 맡겼고
  - 요셉을 자기 집의 모든 일 위에 임명했고
  lexicon: appoint over + house
  rationale: ‘위에 세우다’는 임명과 통치 위임을 함께 드러내며, ‘집’은 왕궁/가문 전체를 뜻하는 소유적 표현으로 유지했습니다.
- source_word: ወኮነት፡ በረከተ፡ እግዚአብሔር
  english_pob_choice: and the blessing of the LORD came to be
  chosen_korean: 야훼의 복이 임하게 되었습니다
  alternatives_korean:
  - 주님의 복이 있게 되었습니다
  - 야훼의 복이 오게 되었습니다
  lexicon: blessing of the LORD
  rationale: 원문의 ‘되었다/있게 되었다’는 발생·현현을 나타내므로, 단순한 상태가 아니라 ‘임하다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: YHWH의 번역
  chosen_reading: 기본 용례에 따라 ‘야훼’로 옮겼습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 본문의 ‘하느님/주’ 일반어가 아니라 고유신명יהוה에 해당하는 하나님의 이름이므로, 프로젝트 기본값인 ‘야훼’를 적용했습니다.
  doctrine_reference: 전통적 독법보다 स्रोत-직역 우선 원칙
