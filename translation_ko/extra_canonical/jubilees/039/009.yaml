    text: Or 'door-bar'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 소리를 높이니, 그가 달아나며 내가 그를 붙잡는 바람에 자기 겉옷을 내 손에 남겨 두고, 문을 부수었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልዐልኩ፡ ቃለየ፡
  english_pob_choice: I raised my voice
  chosen_korean: 제가 소리를 높이니
  alternatives_korean:
  - 제가 목소리를 높이니
  - 제가 소리를 쳤더니
  lexicon: 소리 / 목소리
  rationale: 문맥상 단순한 발성의 크기를 나타내므로, 자연스럽고 직접적인 표현인 ‘소리를 높이다’로 옮겼습니다.
- source_word: ጐየ
  english_pob_choice: he ran
  chosen_korean: 그가 달아나며
  alternatives_korean:
  - 그가 달렸고
  - 그가 도망쳤고
  lexicon: 달아나다
  rationale: 앞뒤 문맥이 추격과 도주를 분명히 보여 주므로, 단순한 이동보다 도주 뉘앙스가 살아 있는 ‘달아나다’를 택했습니다.
- source_word: ወኀደገ፡ ልብሶ፡
  english_pob_choice: left his garment
  chosen_korean: 자기 겉옷을 내 손에 남겨 두고
  alternatives_korean:
  - 자기 옷을 내 손에 두고
  - 자기 옷을 내 손에 버려 두고
  lexicon: 겉옷 / 옷
  rationale: 원문의 ልብስ는 일반적으로 ‘옷’이지만, 도주 장면에서 붙잡힌 채 남겨진 의복의 구체성을 살려 ‘겉옷’으로 옮겼습니다.
- source_word: በጊዜ፡ አንተ፡ አኀዝክዎ፡
  english_pob_choice: when I seized him
  chosen_korean: 내가 그를 붙잡는 바람에
  alternatives_korean:
  - 내가 그를 붙잡았을 때
  - 내가 그를 잡았을 때
  lexicon: 붙잡다
  rationale: 우연한 접촉이 아니라 실제로 붙드는 동작을 나타내므로 ‘붙잡다’를 사용했고, 결과적으로 옷이 남겨졌다는 인과를 살렸습니다.
- source_word: ወሰበረ፡ ማዕጾ።
  english_pob_choice: he broke the door
  chosen_korean: 문을 부수었습니다
  alternatives_korean:
  - 문을 깨뜨렸습니다
  - 문을 부쉈습니다
  lexicon: 문
  rationale: 英본의 최종 채택이 ‘door’이므로 ‘문’으로 직역하되, 동작은 강한 파괴를 나타내는 ‘부수다’로 자연스럽게 렌더링했습니다.
theological_decisions:
- issue: 서사 장면의 폭력성·긴박성 표현
  chosen_reading: 도망, 붙잡음, 문 파괴를 그대로 살려 사건의 긴장감을 약화시키지 않았습니다.
  alternative_readings:
  - 더 완곡하게 ‘나가다’, ‘손에 남다’, ‘문을 열다’로 순화
  rationale: 이 절은 도피와 저항, 물리적 파괴를 강조하는 서술이므로, 독자가 장면의 도덕적·서사적 압력을 그대로 느끼도록 직설적으로 옮겼습니다.
  doctrine_reference: 서사 본문의 사실성 보존 원칙
