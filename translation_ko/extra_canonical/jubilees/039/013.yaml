  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: ko
  text: 그는 그곳에 두 해 동안 머물렀습니다. 그 무렵 이집트 왕 바로는 자기의 두 내시, 곧 술 맡은 관원장과 빵 굽는 관원장에게 화를 내어 그들을 감옥에 가두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየ / መበረ
  english_pob_choice: he remained there
  chosen_korean: 그는 그곳에 두 해 동안 머물렀습니다
  alternatives_korean:
  - 그는 거기서 두 해를 지냈습니다
  - 그는 그곳에 두 해 동안 있었습니다
  lexicon: 머물다
  rationale: 게으/게에즈의 단순한 존재·체류를 자연스러운 서술로 살리면서, 앞뒤 문맥상 감옥 이전의 체류 상태를 과장 없이 전달합니다.
- source_word: ሕፁዋኒሁ
  english_pob_choice: his two eunuchs
  chosen_korean: 자기의 두 내시
  alternatives_korean:
  - 자기의 두 환관
  - 자기 두 궁정 내시
  lexicon: 내시
  rationale: 원문의 직무적·궁정적 신분을 드러내되 현대 한국어에서 이해 가능한 표준어로 옮겼습니다.
- source_word: ሊቀ መዛርት / ሊቀ ሐበዝት
  english_pob_choice: the chief cupbearer / the chief baker
  chosen_korean: 술 맡은 신하와 빵 맡은 신하
  alternatives_korean:
  - 술 맡은 자와 빵 맡은 자
  - 술 관원과 빵 관원
  lexicon: 신하
  rationale: 직함의 기능을 직접적으로 살려, 궁정 고위 시종이라는 의미가 드러나도록 했습니다. 'chief'는 관계상 '맡은 신하'로 풀었습니다.
- source_word: ወወደዮሙ ውስተ
  english_pob_choice: and he put them into prison
  chosen_korean: 그들을 감옥에 가두었습니다
  alternatives_korean:
  - 그들을 감옥에 넣었습니다
  - 그들을 옥에 가두었습니다
  lexicon: 감옥
  rationale: 영문 POB가 완결한 'prison'을 분명히 반영하여, 동사의 목적지 의미를 한국어에서도 명시했습니다.
theological_decisions:
- issue: 왕의 분노와 투옥의 서술을 도덕화하거나 완화할지 여부
  chosen_reading: 본문의 사건 보고를 그대로 유지하여, 바로의 분노와 즉각적인 투옥을 중립적으로 서술했습니다.
  alternative_readings:
  - 왕이 몹시 노하여 그들을 옥에 가두었습니다
  - 왕이 그들을 노하여 옥에 넣었습니다
  rationale: 본문은 인물 평가보다 사건 전개를 전달하므로, 도덕적 해석을 덧붙이지 않고 서술적 긴장을 유지하는 것이 원문에 가깝습니다.
  doctrine_reference: 서사 본문 해석 원칙
