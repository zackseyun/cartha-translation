revisions:
- from: 그와 함께 눕는 일이었습니다. 그러나 그는 자기 영혼을 지키고 야훼를 기억했으며, 아버지 야곱이 아브라함의 말들에서 외우던 말들을 기억했습니다[a]. 곧 남편이 있는 여자와 음행을 범해서는 안 되며, 가장 높으신 하나님 앞에서 하늘에 그에게 죽음의 판결이 정해졌고, 그 죄는 영원한 책들에 계속 기록되어 있다는 것이었습니다.
  to: 그녀와 함께 눕는 일이었습니다. 그러나 그는 자기 영혼을 지키고 야훼를 기억했으며, 아버지 야곱이 아브라함의 말씀 가운데서 낭송하곤 하던 말씀도 기억했습니다[a]. 곧 남편이 있는 여자와 음행을 범해서는 안 되며, 그런 사람을 위한 죽음의 심판이 하늘에서 지극히 높으신 하나님 앞에 정해져 있고, 그 죄가 영원한 책들에 그를 거슬러 계속 기록된다는 말씀이었습니다.
  rationale: 여성 대명사, 천상 판결의 위치, 범죄자에게 불리하게 기록되는 죄의 방향성을 원문에 맞게 보완했습니다. 반복 낭송된 족장 전승이라는 표현도 현대 한국어에서 자연스럽게 다듬었습니다. 원문의 규범적 금지와 지속적 기록의 의미는 유지했습니다.
