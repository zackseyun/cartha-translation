  lexicon: 영혼/생명 표현
  rationale: Ge‘ez의 ‘영혼’을 살리면서 POB의 심리·윤리적 자제 의미를 보존하기 위해 ‘자기 영혼을 지키다’로 직역에 가깝게 두었습니다.
- source_word: ወቃላተ፡ ዘያነብብ፡ ያዕቆብ፡ አቡሁ
  english_pob_choice: the words that Jacob his father used to recite
  chosen_korean: 아버지 야곱이 아브라함의 말들에서 외우던 말들
  alternatives_korean:
  - 아버지 야곱이 아브라함에게서 전해 받아 읊던 말들
  - 아버지 야곱이 아브라함의 말 가운데 낭독하던 말들
  lexicon: 전승된 말/낭독
  rationale: 본문의 ‘읽다/읊다’ 뉘앙스를 살리되, 아브라함-야곱-요셉으로 이어지는 전승 구조가 드러나도록 ‘외우다’로 옮겼습니다.
- source_word: ከመ፡ አልቦ፡ *መነሂ፡ እምሰብእ፡ ዘይዜሙ፡ በብእሲት፡ እንተ፡ ባቲ፡ ምት
  english_pob_choice: that no man should commit fornication with a woman who has a husband
  chosen_korean: 남편이 있는 여자와 음행을 범해서는 안 되며
  alternatives_korean:
  - 남편이 있는 여자와 음행해서는 안 되며
  - 유부녀와 음행을 범해서는 안 되며
  lexicon: 음행/혼인 관계
  rationale: POB의 규범적 금지를 반영해 조동사적 금지형으로 옮기고, ‘woman who has a husband’를 한국어 관용인 ‘남편이 있는 여자’로 풀었습니다.
- source_word: በኵሉ፡
