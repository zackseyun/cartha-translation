base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/005.yaml
  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
  footnotes:
  - marker: a
    text: The clause about Jacob reciting words received from Abraham is an expansion characteristic of Jubilees, grounding Joseph’s refusal in transmitted patriarchal instruction rather than only personal scruple.
    reason: cross_reference
    anchor_ref: '39:5'
  - marker: b
    text: Or 'continually before the LORD.'.
    reason: previous_rendering
  - marker: c
    text: Or 'that there is no man who commits fornication'.
    reason: previous_rendering
translation:
  language: ko
  text: 그와 함께 눕는 일이었습니다. 그러나 그는 자기 영혼을 지키고 야훼를 기억했으며, 아버지 야곱이 아브라함의 말들에서 외우던 말들을 기억했습니다[a]. 곧 남편이 있는 여자와 음행을 범해서는 안 되며, 가장 높으신 하나님 앞에서 하늘에 그에게 죽음의 판결이 정해졌고, 그 죄는 영원한 책들에 계속 기록되어 있다는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመ፡ ይስከብ፡ ምስሌሃ
  english_pob_choice: to lie with her
  chosen_korean: 그와 함께 눕는 일
  alternatives_korean:
  - 그녀와 동침하는 일
  - 그와 잠자리를 같이하는 일
  lexicon: 동사구
  rationale: 직역의 성행위 완곡어를 유지하되 현대 한국어에서 과도하게 노골적이거나 부자연스럽지 않게 ‘함께 눕다’로 옮겼습니다.
- source_word: ወአመጠወ፡ ነፍሶ
  english_pob_choice: he guarded his soul
  chosen_korean: 그는 자기 영혼을 지켰습니다
  alternatives_korean:
  - 그는 자기 생명을 지켰습니다
  - 그는 자신의 마음을 지켰습니다
  lexicon: 영혼/생명 표현
  rationale: Ge‘ez의 ‘영혼’을 살리면서 POB의 심리·윤리적 자제 의미를 보존하기 위해 ‘자기 영혼을 지키다’로 직역에 가깝게 두었습니다.
- source_word: ወቃላተ፡ ዘያነብብ፡ ያዕቆብ፡ አቡሁ
  english_pob_choice: the words that Jacob his father used to recite
  chosen_korean: 아버지 야곱이 아브라함의 말들에서 외우던 말들
  alternatives_korean:
  - 아버지 야곱이 아브라함에게서 전해 받아 읊던 말들
  - 아버지 야곱이 아브라함의 말 가운데 낭독하던 말들
  lexicon: 전승된 말/낭독
  rationale: 본문의 ‘읽다/읊다’ 뉘앙스를 살리되, 아브라함-야곱-요셉으로 이어지는 전승 구조가 드러나도록 ‘외우다’로 옮겼습니다.
- source_word: ከመ፡ አልቦ፡ *መነሂ፡ እምሰብእ፡ ዘይዜሙ፡ በብእሲት፡ እንተ፡ ባቲ፡ ምት
  english_pob_choice: that no man should commit fornication with a woman who has a husband
  chosen_korean: 남편이 있는 여자와 음행을 범해서는 안 되며
  alternatives_korean:
  - 남편이 있는 여자와 음행해서는 안 되며
  - 유부녀와 음행을 범해서는 안 되며
  lexicon: 음행/혼인 관계
  rationale: POB의 규범적 금지를 반영해 조동사적 금지형으로 옮기고, ‘woman who has a husband’를 한국어 관용인 ‘남편이 있는 여자’로 풀었습니다.
- source_word: በኵሉ፡
  english_pob_choice: continually
  chosen_korean: 계속
  alternatives_korean:
  - 항상
  - 끊임없이
  lexicon: 부사
  rationale: 본문 말미의 단독 부사는 앞의 ‘영원한 책들’과 자연스럽게 연결되도록 ‘계속’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 하늘에 정해진 죽음의 판결과 영원한 책들에 기록된 죄의 관계
  chosen_reading: 죄와 형벌이 인간 법정이 아니라 하늘의 선재적 판결과 기록 안에 놓여 있다는 점을 그대로 드러냈습니다.
  alternative_readings:
  - 도덕적 경고로 완화하여 옮길 수 있음
  - 단순한 신적 예지로 완곡하게 표현할 수 있음
  rationale: 후반부는 단지 하나님이 아신다는 뜻이 아니라, 하늘에 이미 정해진 심판과 기록이라는 강한 예정적 표현이므로 이를 약화하지 않았습니다.
  doctrine_reference: Jubilees의 천상 기록과 판결 모티프
