theological_decisions:
- issue: 하늘에 정해진 죽음의 판결과 영원한 책들에 기록된 죄의 관계
  chosen_reading: 죄와 형벌이 인간 법정이 아니라 하늘의 선재적 판결과 기록 안에 놓여 있다는 점을 그대로 드러냈습니다.
  alternative_readings:
  - 도덕적 경고로 완화하여 옮길 수 있음
  - 단순한 신적 예지로 완곡하게 표현할 수 있음
  rationale: 후반부는 단지 하나님이 아신다는 뜻이 아니라, 하늘에 이미 정해진 심판과 기록이라는 강한 예정적 표현이므로 이를 약화하지 않았습니다.
  doctrine_reference: Jubilees의 천상 기록과 판결 모티프
