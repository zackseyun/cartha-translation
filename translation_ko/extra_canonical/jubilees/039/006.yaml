  source_fidelity: 초두의 መዋዕለ፡ ቅድመ፡ እግዚአብሔር는 동사가 없는 절 단편이므로, 초안의 완결 문장 ‘하나님 앞의 날들이었습니다’는 원문에 없는 서술어와 시제를 보탭니다. 또한 말미의 ወአጠየቀ፡(‘그리고 그가 물었다/요청했다’)가 번역에서 빠져 있습니다. 나머지 요셉의 거절과 여인의 지속적인 재촉은 원문에 충실합니다.
  naturalness: ‘그녀와 함께 눕다’는 성적 함의를 보존하면서도 현대 한국어 문어체에서 자연스럽습니다. 초두는 원문 자체가 절 단절 상태이므로 한국어에서도 단편으로 남기는 것이 가장 신중합니다. 끝의 목적어 없는 ‘그는 물었습니다’도 원문이 목적어를 제시하지 않으므로 그대로 유지합니다.
  terminology: ‘하나님’, ‘요셉’, ‘함께 눕다’, ‘재촉하다’는 표준어 합쇼체와 서사 문맥에 적절합니다. 영어 감사 기록의 각주 a는 현 번역과 실질적으로 중복되고, 각주 b의 ‘그녀가 그를 껴안았다’는 제공된 게에즈 구절에 근거하지 않으므로 제거해야 합니다.
  issues:
