translation:
  language: ko
  text: 하나님 앞의 날들이었습니다. 요셉은 이 일을 기억하고 그녀와 함께 눕기를 거부하였습니다. 그리고 그녀는 그를 한 해와 또 한 해 동안 재촉하였지만, 그는 듣지 않으려 하였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ቅድመ፡ እግዚአብሔር
  english_pob_choice: days before God
  chosen_korean: 하나님 앞의 날들이었습니다
  alternatives_korean:
  - 하나님 앞의 날들
  - 하나님 앞에서의 날들이었습니다
  lexicon: Source-note rendering
  rationale: 제공된 게에즈 본문에 앞 절에서 넘어온 것으로 보이는 단편 표현이 남아 있어, 의미를 크게 풀지 않고 ‘하나님 앞의 날들’로 옮겨 본문에 남은 어휘 신호를 보존했습니다.
- source_word: ዘንተ፡ ነገረ፡
  english_pob_choice: this matter
  chosen_korean: 이 일을
  alternatives_korean:
  - 이 일
  - 이 사정
  lexicon: ነገር
  rationale: ‘matter’에 해당하는 중립적 사건 명칭으로 이해하여, 서사체에 자연스러운 ‘일’을 택했습니다.
- source_word: ወአፈቀደ፡ ይስክብ፡ ምስሌሃ
  english_pob_choice: refused to lie with her
  chosen_korean: 그녀와 함께 눕기를 거부하였습니다
  alternatives_korean:
  - 그녀와 동침하기를 거부하였습니다
  - 그녀와 함께 자기를 거부하였습니다
  lexicon: 동침 표현
  rationale: 성적 의미의 동사를 직접 드러내되, 과도한 완곡화를 피하기 위해 ‘함께 눕다’로 직역에 가깝게 유지했습니다.
- source_word: '*ዓመተ፡ አሐደ፡ ወካልአ፡'
  english_pob_choice: for one year and a second
  chosen_korean: 한 해와 또 한 해 동안
  alternatives_korean:
  - 한 해와 두 번째 해 동안
  - 한 해와 다음 한 해 동안
  lexicon: 기간 표현
  rationale: 게에즈의 반복 구조를 살려 ‘one year and a second’를 한국어 자연문으로 옮기되, 숫자 감각을 보존했습니다.
- source_word: ወአበየ፡ ሰሚዐ
  english_pob_choice: but he refused to listen
  chosen_korean: 그는 듣지 않으려 하였습니다
  alternatives_korean:
  - 그러나 그는 들으려 하지 않았습니다
  - 하지만 그는 귀를 기울이지 않았습니다
  lexicon: 듣다/귀 기울이다
  rationale: 단순한 청취 거부가 아니라 계속된 요구를 받아들이지 않는 태도를 나타내므로, 의도적 거절의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 제공 본문 말미의 단절된 표현을 어떻게 처리할 것인가
  chosen_reading: ‘하나님 앞의 날들’이라는 남은 구절 신호를 본문에 반영하되, 후속 서술로 확장하지 않았습니다.
  alternative_readings:
  - 해당 부분을 완전히 생략
  - 이전 절과 결합해 ‘하나님 앞의 날들에’로 재구성
  rationale: English audit trail가 본문 초두의 누락 가능성을 명시하지만, 실제 제공 게에즈 문자열을 우선해 과잉 복원을 피했습니다.
  doctrine_reference: source transparency and textual caution
