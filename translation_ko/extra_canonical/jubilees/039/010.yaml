  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: ko
  text: 그리고 그 이집트 사람은 요셉의 옷과 부서진 문빗장을 보았고, 그의 아내의 말을 들었습니다. 그리고 그는 요셉을 감옥집, 곧 왕의 죄수들이 갇혀 있던 곳에 가두었습니다. 그리고 그는 거기에 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  english_pob_choice: the Egyptian
  chosen_korean: 그 이집트 사람
  alternatives_korean:
  - 그 애굽 사람
  - 이집트인
  lexicon: Geez ethnonym
  rationale: 원문의 민족/출신 표지를 자연스럽게 살리되, 현대 한국어에서 이해하기 쉬운 표준형으로 옮겼습니다.
- source_word: ልብሶ
  english_pob_choice: garment
  chosen_korean: 옷
  alternatives_korean:
  - 겉옷
  - 의복
  lexicon: Geez noun
  rationale: 요셉의 옷이 증거물로 제시되는 문맥이라, 과장 없이 가장 직접적인 한국어인 ‘옷’을 택했습니다.
- source_word: ማዕጾ፡ ስቡረ
  english_pob_choice: the broken door-bar
  chosen_korean: 부서진 문빗장
  alternatives_korean:
  - 부러진 문빗장
  - 꺾어진 문빗장
  lexicon: Geez phrase
  rationale: 문을 잠그는 막대가 부러진 상태를 드러내기 위해 ‘문빗장’으로 구체화했고, ‘부서진’으로 상태를 직설적으로 옮겼습니다.
- source_word: ቤተ፡ ሞቅሕ
  english_pob_choice: the prison-house
  chosen_korean: 감옥, 곧 감옥집
  alternatives_korean:
  - 옥사, 곧 감옥집
  - 감옥집
  lexicon: Geez phrase
  rationale: 장소를 설명하는 두 겹의 표현을 살려, ‘감옥’과 ‘감옥집’을 병기해 원문의 구체성을 유지했습니다.
theological_decisions:
- issue: 마지막 절의 간결한 종결문
  chosen_reading: “그리고 그는 거기에 있었습니다”로 마감해, 원문이 단지 요셉의 수감 상태의 지속을 말하는 정도로 유지했습니다.
  alternative_readings:
  - “그리고 그는 그곳에서 감옥에 있었습니다”
  - “그리고 그는 그 안에 있었습니다”
  rationale: 히브리/게에즈 계열의 짧은 상태 진술을 과도하게 해설하지 않고, 수정판에서 삭제된 ‘in prison’ 보강을 피했습니다.
  doctrine_reference: source-primacy / non-expansive translation
