  text: And both of them dreamed a dream[a], the chief cupbearer and the chief baker, and they told Joseph.
  footnotes:
  - marker: a
    text: The Ethiopic row reads literally “and they told them to Joseph”; this is understood as “they told them to Joseph,” i.e., they related their dreams to him.
    reason: segmentation_note
    anchor_ref: '39:16'
translation:
  language: ko
  text: 술 맡은 관원장과 떡 굽는 관원장, 이 두 사람 모두 꿈을 꾸고 그 꿈을 요셉에게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 본문은 직역하면 “그들이 그것을 요셉에게 말하였다”입니다. 여기서 “그것”은 앞서 언급한 그들의 꿈을 가리킵니다.
    reason: 원문의 대명사 목적어와, 그것이 꿈을 가리킨다는 문맥상의 이해를 밝혀 줍니다.
lexical_decisions:
- source_word: ወሐለሙ፡ ክልኤሆሙ፡ ሕልመ
  english_pob_choice: And both of them dreamed a dream
  chosen_korean: 그들 둘 다 꿈을 꾸었습니다
  alternatives_korean:
  - 두 사람 모두 꿈을 꾸었습니다
  - 그들 둘이 꿈을 꾸었습니다
  lexicon: 꿈을 꾸다 / 두 사람
  rationale: 게으즈어의 반복적 표현(‘dreamed a dream’)을 자연스러운 한국어로 옮기되, 두 사람이 각각 꿈을 꾸었다는 점을 분명히 살렸습니다.
- source_word: ሊቀ፡ መዛርት፡ ወሊቀ፡ ሐበዝት
  english_pob_choice: the chief cupbearer and the chief baker
  chosen_korean: 술 맡은 관원장과 떡 굽는 관원장
  alternatives_korean:
  - 술잔 맡은 관원장과 빵 굽는 관원장
  - 술 시중드는 관원장과 떡 굽는 관원장
  lexicon: 관원장 / 술 맡은 / 떡 굽는
  rationale: 기존 한국어 성경에서 널리 알려진 직함을 유지하되, 소스의 직능적 표현을 직접 살려 두 관원장의 구분을 분명하게 했습니다.
- source_word: ወነገርዎ፡ ለዮሴፍ
  english_pob_choice: and they told Joseph
  chosen_korean: 그들은 요셉에게 그 꿈을 말했습니다
  alternatives_korean:
  - 그리고 그들은 요셉에게 그것을 말했습니다
  - 그리고 요셉에게 그들의 꿈을 이야기했습니다
  lexicon: 말하다 / 이야기하다
  rationale: 영어 POB의 수정된 이해처럼, 목적어는 요셉이 아니라 꿈의 내용이므로 ‘요셉에게 그 꿈을 말했습니다’로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 꿈의 주체와 전달 방식
  chosen_reading: 두 관원장이 각각 꿈을 꾸었고, 그 꿈을 요셉에게 말한 것으로 이해했습니다.
  alternative_readings:
  - 둘이 하나의 꿈을 함께 꾸었다는 해석
  - ‘그들이 그에게 말하였다’의 대상을 모호하게 두는 해석
  rationale: 게으즈어 문맥과 영어 POB의 audit note가 모두 개별적인 꿈과 그 내용을 요셉에게 전한 뜻을 지지하므로, 의미의 흐름을 분명히 했습니다.
  doctrine_reference: 본문 의미 및 서사 문맥
