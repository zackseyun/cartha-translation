  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: ko
  text: 야곱은 그의 아버지가 머무르던 땅, 가나안 땅에 살았습니다. 이것이 야곱의 계보입니다. 요셉은 열일곱 살이었고, 이집트로 끌려 내려갔습니다. 그리고 바로의 관리이자 경호대장인 보디발이 그를 샀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኀደረ / dwelt
  english_pob_choice: dwelt
  chosen_korean: 살았습니다
  alternatives_korean:
  - 거주했습니다
  - 머물렀습니다
  lexicon: Geez ወኀደረ
  rationale: 정착하여 지내는 지속적 거주를 자연스럽게 나타내기 위해 ‘살았습니다’를 택했습니다.
- source_word: ምድረ፡ ፍልሰተ፡ አቡሁ / the land of his father’s sojourning
  english_pob_choice: the land of his father’s sojourning
  chosen_korean: 그의 아버지가 머무르던 땅
  alternatives_korean:
  - 그의 아버지의 나그네 됨의 땅
  - 그의 아버지가 유숙하던 땅
  lexicon: Geez ምድረ፡ ፍልሰተ፡ አቡሁ
  rationale: ‘sojourning’의 임시 체류 의미를 살리되 한국어에서 지나치게 낯선 명사구를 피하기 위해 서술형으로 옮겼습니다.
- source_word: ትዝምደ፡ ያዕቆብ / These are the generations of Jacob
  english_pob_choice: These are the generations of Jacob
  chosen_korean: 이것이 야곱의 계보입니다
  alternatives_korean:
  - 야곱의 후손들이 이러합니다
  - 야곱의 계보는 이러합니다
  lexicon: Geez 족보 서식 표현
  rationale: 성경의 족보 도입 공식을 한국어 독자가 즉시 알아볼 수 있도록 ‘계보’로 표준적으로 옮겼습니다.
- source_word: ወዮሴፍ፡ ወልደ፡ ፲ወ፯ዓመት / Joseph, being seventeen years old
  english_pob_choice: Joseph, being seventeen years old
  chosen_korean: 요셉은 열일곱 살이었고
  alternatives_korean:
  - 요셉은 열일곱 해였고
  - 요셉이 열일곱 살이었을 때
  lexicon: Geez 연령 표현
  rationale: 연령 정보의 상태를 간결하게 제시해 다음 동사와 자연스럽게 연결되도록 했습니다.
- source_word: አውረድዎ ውስተ ግብጽ / was brought down into Egypt
  english_pob_choice: was brought down into Egypt
  chosen_korean: 이집트로 끌려 내려갔습니다
  alternatives_korean:
  - 이집트로 내려가게 되었습니다
  - 이집트로 내려졌습니다
  lexicon: Geez 수동 이동 표현
  rationale: ‘down’의 지리적 하강과 수동적 강제 이송을 함께 드러내기 위해 ‘끌려 내려갔습니다’를 선택했습니다.
- source_word: ጰጢፋሬን ኅፅዉ / Potiphar ... bought him
  english_pob_choice: Potiphar ... bought him
  chosen_korean: 보디발이 그를 샀습니다
  alternatives_korean:
  - 보디발이 그를 매입했습니다
  - 보디발이 그를 사들였습니다
  lexicon: Geez ጰጢፋሬን ኅፅዉ
  rationale: 행위의 거래성을 직접 드러내는 ‘샀습니다’를 사용하되, 주체 이름은 한국어 성경에서 널리 알려진 보디발로 옮겼습니다.
theological_decisions:
- issue: ‘officer of Pharaoh, chief of the guards’의 직분 표현
  chosen_reading: 바로의 관리이자 경호대장
  alternative_readings:
  - 바로의 내시이자 경호대장
  - 바로의 고관이자 호위대장
  rationale: 영어 POB의 revision이 ‘eunuch’보다 공적 직분성을 강조하므로, 본문 의미를 살려 ‘관리’로 옮기고 뒤의 ‘chief of the guards’를 병렬로 풀었습니다.
  doctrine_reference: 서술 직분어의 역사적-문맥적 정확성
- issue: ‘land of Canaan’의 중복 표기
  chosen_reading: 가나안 땅
  alternative_readings:
  - 가나안
  - 가나안의 땅
  rationale: 본문의 지명 강조를 유지하되 한국어에서 가장 자연스러운 형태인 ‘가나안 땅’으로 처리했습니다.
  doctrine_reference: 지명 표기 관례
