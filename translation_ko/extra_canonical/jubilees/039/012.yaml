  - severity: medium
    issue: ‘그와 함께 있는 것’의 부자연스럽고 불명확한 표현
    rationale: 원문의 표현은 요셉과 관련되거나 요셉에게 맡겨진 것에 대해 간수장이 알지 못했다는 뜻입니다. 현 번역은 물리적으로 ‘함께 있는 것’처럼 들립니다.
  - severity: low
    issue: 근거 없는 각주 표지 [a]
