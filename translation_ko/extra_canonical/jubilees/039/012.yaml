  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: ko
  text: 요셉이 무엇을 하든지 야훼께서 그것을 형통하게 하셨습니다. 간수장은 모든 것을 요셉의 손에 맡겼으며, 감옥의 간수장은 요셉에게 맡겨진 일에 관하여는 아무것도 알지 못했습니다. 이는 요셉이 모든 일을 하였고, 야훼께서 그것을 완성하셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሴርሖ
  english_pob_choice: made to prosper
  chosen_korean: 형통하게 하셨습니다
  alternatives_korean:
  - 잘되게 하셨습니다
  - 번성하게 하셨습니다
  lexicon: Geʽez ሰረሐ/ይሴርሕ 계열
  rationale: 문맥상 요셉의 모든 행동에 대한 하나님의 결과적 성공을 뜻하므로, 단순한 ‘성공’보다 원인-결과를 살리는 ‘형통하게 하다’가 가장 가깝습니다.
- source_word: አልቦ ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  english_pob_choice: the chief keeper of the prison
  chosen_korean: 감옥의 간수장
  alternatives_korean:
  - 옥의 우두머리 간수
  - 감옥 책임자
  lexicon: Geʽez 직책 표현
  rationale: 직역형 ‘간수장’이 본문의 직책과 상응하며, ‘chief keeper’의 계층적 의미를 간결하게 전달합니다.
- source_word: ወፍጸም
  english_pob_choice: brought it to completion
  chosen_korean: 그것을 완성하셨습니다
  alternatives_korean:
  - 그것을 이루셨습니다
  - 그것을 끝내셨습니다
  lexicon: Geʽez ፈጸመ 계열
  rationale: 문장의 마지막에서 하나님의 사역을 종결·성취로 마무리하는 뜻이므로, ‘완성하다’가 결과의 성취를 가장 잘 드러냅니다.
- source_word: ወኀደገ፡ ኵሎ፡ በእዴሁ
  english_pob_choice: he left everything in his hand
  chosen_korean: 그는 모든 것을 그의 손에 맡겼으며
  alternatives_korean:
  - 그는 모든 것을 그의 손에 두었으며
  - 그는 모든 것을 그에게 넘겼으며
  lexicon: Geʽez 관용구
  rationale: ‘손에’는 권한 위임의 관용구이므로, 한국어에서는 자연스럽게 ‘맡기다’로 옮겨 의미를 보존했습니다.
theological_decisions:
- issue: 야훼의 주권적 섭리와 인간 행위의 병행
  chosen_reading: 요셉이 하는 일을 다 하였지만, 그 결과를 형통하게 하시고 완성하시는 분은 야훼이십니다.
  alternative_readings:
  - 요셉의 능력이 성공을 가져왔다는 읽기
  - 하나님의 개입을 배경으로만 두는 읽기
  rationale: 원문은 요셉의 활동성과 하나님의 결정적 성취를 나란히 놓아, 인간의 성실과 하나님의 섭리가 함께 작동함을 강조합니다.
  doctrine_reference: 섭리론
