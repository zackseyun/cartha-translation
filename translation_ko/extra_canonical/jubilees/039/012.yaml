revisions:
- from: 그가 무엇을 하든지, 야훼께서 그것을 형통하게 하셨습니다. 그리고 그는 모든 것을 그의 손에 맡겼으며, 감옥의 간수장도 그와 함께 있는 것에 대해 아무것도 알지 못했습니다. 이는 요셉이 하는 일을 다 하였고, 야훼께서 그것을 완성하셨기 때문입니다.[a]
  to: 요셉이 무엇을 하든지 야훼께서 그것을 형통하게 하셨습니다. 간수장은 모든 것을 요셉의 손에 맡겼으며, 감옥의 간수장은 요셉에게 맡겨진 일에 관하여는 아무것도 알지 못했습니다. 이는 요셉이 모든 일을 하였고, 야훼께서 그것을 완성하셨기 때문입니다.
  rationale: 문맥상 선행사가 분명한 명사(간수장, 요셉)를 사용하여 위임 관계를 명료하게 했고, ‘그와 함께 있는 것’이라는 직역투를 ‘요셉에게 맡겨진 일’로 옮겼습니다. 마지막의 ‘그것’은 원문의 목적어가 구체적으로 한정되지 않은 점을 보존합니다. 내용 없는 각주 표지는 삭제했습니다.
