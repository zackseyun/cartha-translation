  - 야훼께서 … 허락하셨습니다
  lexicon: YHWH
  rationale: 원문 주어는 יהוה 계열로 보이므로 본문에서는 야훼를 유지하고, 동사는 자연스러운 ‘주다’로 옮겼습니다.
- source_word: ሞገሰ፡ ለዮሴፍ፡ … ወምሕረተ፡
  english_pob_choice: gave Joseph favor and mercy
  chosen_korean: 요셉에게 … 호의와 긍휼을
  alternatives_korean:
  - 요셉에게 … 은총과 자비를
  - 요셉에게 … 호의와 은혜를
  lexicon: favor/mercy
  rationale: 영문 POB의 두 개념을 분리해 살리되, ‘mercy’는 일상적 ‘자비’보다 더 강한 긍휼의 뉘앙스를 주는 ‘긍휼’로 옮겼습니다.
- source_word: ለሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ፡
  english_pob_choice: before the chief of the keepers of the prison-house
  chosen_korean: 감옥 간수장 앞에서
