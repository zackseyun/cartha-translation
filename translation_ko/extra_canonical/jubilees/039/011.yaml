  lexicon: location phrase
  rationale: 장소 부사구를 먼저 살려 감옥 내부라는 구체적 상황을 분명히 드러냈습니다.
- source_word: ወወሀቦ፡ እግዚአብሔር፡
  english_pob_choice: the LORD gave
  chosen_korean: 야훼께서 … 주셨습니다
  alternatives_korean:
