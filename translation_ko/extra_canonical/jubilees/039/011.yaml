  - 감옥 경비 책임자 앞에서
  lexicon: title/office
  rationale: 문맥상 궁전 관리가 아니라 감옥 관리 직책이므로, POB 각주 취지를 반영해 직책을 간결하게 풀었습니다.
theological_decisions:
- issue: 야훼의 임재가 요셉의 호의 획득의 근거로 제시됨
  chosen_reading: ‘야훼께서 그와 함께 계심’을 보고 그 결과로 호의와 긍휼이 주어진 것으로 옮겼습니다.
  alternative_readings:
  - ‘야훼가 그와 함께 계셨기 때문에’
  - ‘야훼가 그와 함께 계신 것을 보았기 때문에’
  rationale: 원문의 인과 관계를 보존하면서, 감옥 간수장의 관찰이 결과의 직접 근거가 되는 서술 구조를 살렸습니다.
  doctrine_reference: 섭리와 임재
