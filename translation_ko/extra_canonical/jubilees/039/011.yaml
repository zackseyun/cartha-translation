  text: 거기 감옥 안에서 야훼께서 요셉에게 감옥 간수장 앞에서 호의와 긍휼을 주셨습니다. 이는 그가 야훼께서 그와 함께 계심을 보고, 또 모든 것이…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ፡
  english_pob_choice: There in the prison
  chosen_korean: 거기 감옥 안에서
  alternatives_korean:
