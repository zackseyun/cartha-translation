translation:
  language: ko
  text: 그곳 감옥에서 야훼께서는 요셉에게 감옥 간수들의 우두머리[a] 앞에서 호의와 자비를 베푸셨습니다. 이는 그 감옥 간수들의 우두머리가 야훼께서 요셉과 함께 계신 것과 모든 것이 …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기의 직책명은 앞서 나온 ‘지키다/경비하다’와 같은 어근을 사용하지만, 감옥이라는 문맥에서는 보디발 집안의 직책이 아니라 감옥 관리인을 가리킵니다.
    reason: lexical_alternative
