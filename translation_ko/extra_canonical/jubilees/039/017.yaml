  naturalness: ‘감옥에 있는 요셉을 잊어버렸습니다’와 ‘바로에게 알리는 일을 잊었습니다’가 현대 표준 한국어 합쇼체에서 자연스럽고, 원문의 기억·망각 어휘 반복도 보존합니다.
  terminology: ‘술 맡은 관원’, ‘빵 굽는 자’, ‘바로’, ‘요셉’은 문맥과 한국어 성서적 관용에 적절합니다. ‘감옥에 있는 요셉’은 ‘옥중에서 요셉을’보다 수식 관계가 명료합니다.
