base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/017.yaml
  text: 'And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen[a], and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.[b]'
  footnotes:
  - marker: b
    text: The final sentence is awkward in the transmitted Ethiopic. The sense appears to be that the chief cupbearer forgot Joseph and did not report Joseph’s interpretation to Pharaoh, despite knowing its truth.
    reason: textual_variant
    anchor_ref: '39:17'
  - marker: a
    text: Or 'though he knew what would happen'.
    reason: previous_rendering
  - marker: c
    text: 'Or ''And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen, and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그들에게 해석한 그대로 그들에게 일어났습니다. 바로는 술 맡은 관원을 그의 직분으로 다시 세우고 빵 굽는 자는 죽였습니다. 이는 요셉이 그들에게 해석한 그대로였습니다. 그러나 술 맡은 관원은 요셉을 옥중에서 잊어버렸습니다. 비록 요셉이 그에게 앞으로 일어날 일을 말해 주었지만[a], 그는 요셉이 자기에게 말한 것을 바로에게 알리려고 기억하지 않았습니다. 그는 그저 잊어버렸기 때문입니다[b].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈከረ / ከማሁ ኮኖሙ
  english_pob_choice: as he interpreted for them, so it happened to them
  chosen_korean: 그가 그들에게 해석한 그대로 그들에게 일어났습니다
  alternatives_korean:
  - 그가 그들을 위해 해석한 대로 그렇게 되었습니다
  - 그가 그들에게 풀이한 대로 그렇게 되었습니다
  lexicon: 해석하다
  rationale: 예언적 꿈풀이의 결과가 그대로 성취되었다는 대응 구조를 살리기 위해, 단순한 ‘설명’보다 ‘해석’이 적절합니다.
- source_word: ሊቀ፡ መዘርት
  english_pob_choice: chief cupbearer
  chosen_korean: 술 맡은 관원
  alternatives_korean:
  - 잔을 드는 우두머리
  - 왕의 술 시종장
  lexicon: 관원
  rationale: 궁정 직책을 한국어로 자연스럽게 옮기되, 직분의 핵심인 술 시중/시종 기능이 드러나도록 ‘술 맡은 관원’을 택했습니다.
- source_word: ሐባዚስ
  english_pob_choice: the baker
  chosen_korean: 빵 굽는 자
  alternatives_korean:
  - 제빵관
  - 빵 굽는 관원
  lexicon: 굽다
  rationale: 원문의 직책명은 궁정에서 빵을 굽는 사람을 가리키므로, 과도한 제도화보다 직무를 직접 드러내는 표현을 사용했습니다.
- source_word: ቤተ፡ ሞቅሕ
  english_pob_choice: prison-house
  chosen_korean: 옥중
  alternatives_korean:
  - 감옥
  - 감옥집
  lexicon: 옥
  rationale: 문맥상 수감 장소를 가리키며, 한국어에서 간결하고 자연스럽게 원문의 구금 장소를 나타내는 표현입니다.
theological_decisions:
- issue: 꿈 해석의 성취와 인간 기억의 실패가 함께 제시되는 구조
  chosen_reading: 해석이 그대로 성취되었지만, 술 맡은 관원은 요셉을 잊어버려 바로에게 알리지 않았다는 두 층위를 모두 유지했습니다.
  alternative_readings:
  - 술 맡은 관원이 단순히 요셉을 잊었다고만 정리하는 읽기
  - 성취 구절과 망각 구절을 분리해 약화시키는 읽기
  rationale: 본문은 예언/해석의 정확한 성취와 그 뒤의 인간적 망각을 함께 강조하므로, 둘 중 하나를 희석하지 않고 병치해야 합니다.
  doctrine_reference: 서술의 성취와 인간 책임의 병행
