translation:
  language: ko
  text: 그 여인은 그가 그 여인과 동침하지 않으려는 것을 보고, 주인 앞에서 그를 고발하며 말했습니다. 「당신이 사랑하는 히브리인 종이 나를 강제로 범하여[a] 나와 동침하려 했습니다. 그런데 마침 그때…」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 강제로 범하여’로 옮긴 고발 동사는 더 넓게는 ‘나를 공격하다’ 또는 ‘나를 모욕하다’로도 이해될 수 있습니다. 그러나 뒤따르는 절들은 성적 강요에 관한 고발을 가리킵니다.
    reason: lexical_alternative
