translation:
  language: ko
  text: 그 여인은 그가 자기와 동침하지 않으려는 것을 보고, 주인 앞에서 그를 고발하며 말했습니다. 「당신이 사랑하는 히브리인 종이 나를 강제로 범하려고 했습니다[a]—그래서 나와 동침하려 했습니다. 그리고 일이 마침 그때…」
  philosophy: optimal-equivalence
