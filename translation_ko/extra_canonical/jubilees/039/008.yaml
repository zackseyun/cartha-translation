  naturalness: ‘그 여인과 동침하지 않으려는 것’으로 대상 지시를 분명히 하고, ‘나를 강제로 범하여 나와 동침하려’로 목적 관계를 자연스럽게 유지하는 편이 현대 표준 한국어 합쇼체에 적절합니다. 미완결 문장은 ‘그런데 마침 그때…’로 보존할 수 있습니다.
  terminology: ‘동침’은 원문의 성적 의미를 적절히 반영합니다. ‘히브리인 종’은 영어 감사본 및 원문의 사회적 신분 표지에 부합합니다. ‘범하다’는 성적 강요라는 고발 맥락을 명확히 하지만, 해당 동사의 더 넓은 의미 가능성은 각주로 유지해야 합니다.
