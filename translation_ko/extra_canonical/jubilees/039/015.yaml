  text: And the chief of the keepers of the prison appointed Joseph to attend them and to minister before them.
translation:
  language: ko
  text: 그리고 감옥의 간수장들은 요셉에게 그들을 돌보게 하고, 그들 앞에서 시중들게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  english_pob_choice: the chief of the keepers of the prison
  chosen_korean: 감옥의 간수장
  alternatives_korean:
  - 옥의 책임자
  - 감옥의 우두머리
  lexicon: source phrase refers to the chief/leader over prison keepers, not merely a generic guard; "간수장" best preserves the administrative rank in natural Korean.
  rationale: 직책의 상하 관계를 드러내면서도 현대 한국어에서 이해하기 쉬운 표현으로 옮겼습니다.
- source_word: ይትአከኮሙ
  english_pob_choice: to attend them
  chosen_korean: 그들을 돌보게
  alternatives_korean:
  - 그들을 시중들게
  - 그들을 섬기게
  lexicon: The verb indicates personal attendance/service to the prisoners; "돌보다" captures attentive care without over-ecclesial coloring.
  rationale: 단순한 심부름보다 지속적이고 실제적인 돌봄의 뉘앙스를 살렸습니다.
- source_word: ወይትለአክ፡ ቅድሜሆሙ
  english_pob_choice: to minister before them
  chosen_korean: 그들 앞에서 시중들게
  alternatives_korean:
  - 그들 앞에서 봉사하게
  - 그들 앞에서 섬기게
  lexicon: The source has a before-them/deliberate service sense; "시중들다" keeps the visible, attendant action that the English POB renders with "minister."
  rationale: 여기서는 종교적 '사역'보다 구체적 대면 봉사의 의미가 더 분명하므로 자연스럽게 표현했습니다.
