  lexicon: 대적, 악한 것
  rationale: Ge'ez의 병렬 부정구조를 따라 ‘대적’과 ‘악한 것’을 분리해 옮기되, POB의 ‘adversary and nothing evil’이 주는 폭넓은 부정 범위를 한국어에서 자연스럽게 살렸습니다.
- source_word: መዋዕለ፡ ሕይወቱ፡ ለዮሴፍ፡ እለ፡ ሐይወ፡ እምድኅረ፡ አቡሁ፡ ያዕቆብ።
  english_pob_choice: through all the days of Joseph's life that he lived after his father Jacob
  chosen_korean: 요셉이 아버지 야곱 뒤에 살아 있는 동안 그의 모든 날에는
  alternatives_korean:
  - 야곱 그의 아버지 이후로 요셉의 생애 모든 날에는
  - 아버지 야곱 이후 요셉이 산 모든 날에는
  lexicon: 살아 있는 동안, 그의 모든 날
  rationale: 영어의 ‘that he lived’에 해당하는 상대절을 반영하여 ‘살아 있는 동안’으로 풀었고, ‘after his father Jacob’는 직역적이면서도 한국어에서 자연스러운 ‘아버지 야곱 뒤에’로 처리했습니다.
- source_word: ኵሎሙ፡ ግብጽ፡ ያከብ
  english_pob_choice: because all Egypt honored him
  chosen_korean: 온 이집트가 그를 존중하였기 때문입니다
  alternatives_korean:
  - 온 이집트가 그를 영예롭게 하였기 때문입니다
  - 온 이집트가 그를 공경하였기 때문입니다
  lexicon: 존중하다, 이집트
  rationale: Ge'ez의 완료적 의미를 살리면서 ‘honored’의 공적·사회적 뉘앙스를 한국어에서 가장 무난하게 드러내기 위해 ‘존중하다’를 선택했습니다.
