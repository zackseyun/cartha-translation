translation:
  language: ko
  text: 아버지 야곱 이후에 요셉이 살았던 모든 날 동안에는 대적도 없었고 어떤 악도 없었습니다.[a] 이는 온 이집트가 그를 존중하였기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 아버지 야곱 이후의 요셉의 생애 동안.”
    reason: 원문의 관계절을 명시하지 않고 ‘요셉의 생애’에 직접 연결하여 옮길 수 있는 대안 표현을 제시합니다. 영어 POB 감사 기록의 각주 의미를 해당 시간절에 맞추어 보존합니다.
