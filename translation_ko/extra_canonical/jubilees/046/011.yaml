translation:
  language: ko
  text: 헤브론이었습니다. 그리고 당신의 아버지 아브람은 그들과 함께 남아 있었습니다. 그리고 가나안 왕이 이집트 왕을 쳐이겼습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 헤브룬
  lexicon: 고유명사
  rationale: 지명 ኬብሮን은 통용되는 성경식 음역인 ‘헤브론’으로 옮겨 현대 한국어 독자가 즉시 인식하도록 했습니다.
- source_word: ወተረፈ፡ አብራም፡ አቡከ፡ ምስሌሆሙ
  english_pob_choice: and your father Abram remained with them
  chosen_korean: 당신의 아버지 아브람은 그들과 함께 남아 있었습니다
  alternatives_korean:
  - 당신의 아버지 아브람은 그들 가운데 있었습니다
  - 당신의 아버지 아브람은 그들과 함께 있었습니다
  lexicon: 동사 어휘
  rationale: 동사 ‘remain’의 지속 상태를 살려 ‘남아 있었습니다’로 옮겼고, 관계를 명확히 하기 위해 ‘그들과 함께’를 유지했습니다.
- source_word: አብራም
  english_pob_choice: Abram
  chosen_korean: 아브람
  alternatives_korean:
  - 아므람
  lexicon: 고유명사
  rationale: 원문 게에즈는 አብራም(아브람)으로 읽히므로 본문에는 이를 반영했습니다. 다만 영어 POB의 교정 전통과 본문 맥락상 다른 전승 가능성은 주석으로 처리할 수 있습니다.
- source_word: ወሞአ፡ ንጉሠ፡ ከናአን፡ ለንጉሠ፡ ግብጽ፡
  english_pob_choice: And the king of Canaan defeated the king of Egypt
  chosen_korean: 가나안 왕이 이집트 왕을 쳐이겼습니다
  alternatives_korean:
  - 가나안 왕이 이집트 왕을 이겼습니다
  - 가나안 왕이 이집트 왕을 패배시켰습니다
  lexicon: 동사 어휘
  rationale: 동사 ሞአ는 ‘이기다/정복하다/쳐이기다’의 뜻이므로 영어 POB의 최종 판독에 따라 승패 관계를 분명히 드러내는 방향으로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 인물명 전승 차이(아브람/아므람)
  chosen_reading: 본문은 게에즈 원문을 따라 아브람으로 두었습니다.
  alternative_readings:
  - 아므람으로 본문 정정
  - 주석으로만 아브람 표기
  rationale: 제공된 원문에는 አብራም이므로, 본문에서는 원문 가독성을 우선해 아브람을 유지하고, 전승상 혼동 가능성은 별도 주석 처리하는 편이 소스 충실성이 높습니다.
  doctrine_reference: 본문비평 및 고유명사 전승 처리
- issue: ወሞአ의 의미
  chosen_reading: ‘쳐이겼습니다’로 옮겨 승리/패배 관계를 직접 표현했습니다.
  alternative_readings:
  - ‘이겼습니다’
  - ‘정복했습니다’
  - ‘죽었습니다’
  rationale: 게에즈 동사 ሞአ는 ‘패배시키다/정복하다’의 계열이므로, 본문 의미를 왜곡하는 ‘죽었습니다’는 배제하고 한국어에서 자연스러운 승리 표현을 택했습니다.
  doctrine_reference: 어휘 의미 및 본문 신뢰성
