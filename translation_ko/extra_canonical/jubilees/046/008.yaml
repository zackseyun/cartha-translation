lexical_decisions:
- source_word: ወሞተ፡ ዮሴፍ፡
  english_pob_choice: And Joseph died
  chosen_korean: 요셉은 죽었습니다
  alternatives_korean:
  - 요셉이 죽었습니다
  - 요셉이 세상을 떠났습니다
  lexicon: 사망 서술
  rationale: 원문은 단순한 사망 사실을 말하므로, 완곡한 표현보다 직접적인 ‘죽었습니다’가 서술의 힘을 가장 가깝게 반영합니다.
- source_word: በዘአርብዓ፡ ወስድስቱ፡ ኢዮቤልው፡
  english_pob_choice: in the forty-sixth jubilee
  chosen_korean: 마흔여섯 번째 희년
  alternatives_korean:
  - 마흔여섯째 희년
  - 46번째 희년
  lexicon: 희년 (calendrical unit)
  rationale: Geez의 숫자표현은 달력 단위를 가리키므로, 연속 서수로 자연스럽게 옮겨 ‘마흔여섯 번째 희년’으로 유지했습니다.
- source_word: በሱባዔ፡ ሳድስ፡
  english_pob_choice: in the sixth week
  chosen_korean: 여섯째 주
  alternatives_korean:
  - 여섯 번째 주
  - 여섯째 주간
  lexicon: 주(week)
  rationale: POB의 개정된 영어가 ‘sixth week’로 정리한 calendrical sense를 따라, 한국어도 달력 단위로 읽히는 ‘여섯째 주’로 옮겼습니다.
- source_word: ወቀበርዎ፡
  english_pob_choice: and they buried him
  chosen_korean: 그를 장사했습니다
  alternatives_korean:
  - 그를 묻었습니다
  - 그를 매장했습니다
  lexicon: 매장/장사
  rationale: 문맥상 장례 행위를 뜻하므로, 한국어 성경 문체에서 자연스러운 ‘장사했습니다’를 택하되, 고어체로 과도하게 치우치지 않도록 했습니다.
