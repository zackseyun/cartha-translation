  lexicon: devise plan / evil plan → 계책을 꾸미다
  rationale: 행동으로 이어지는 의도적 음모를 나타내므로 단순한 ‘생각’보다 ‘계책/계략’이 원문과 영어 POB의 중간층위를 더 잘 반영합니다.
