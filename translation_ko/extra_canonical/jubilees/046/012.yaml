  lexicon: sons of Israel → 아들들
  rationale: 영어 POB의 ‘sons’를 따라 직역하여 혈연·언약 공동체를 함께 드러내며, 익숙한 ‘이스라엘 자손’보다 원문 표면을 더 가깝게 보존합니다.
theological_decisions:
- issue: 본문의 종속절이 미완성으로 끝남
  chosen_reading: 마지막 ‘so that’에 맞춰 한국어도 ‘그래서’로 끝내어, 뒤이어 올 목적/결과절이 생략된 상태를 그대로 드러냈습니다.
  alternative_readings:
  - 의미를 보완하여 완전한 문장으로 매끈하게 마무리함
  - 생략을 메우지 않고 문장을 한국어식으로 재구성함
  rationale: 영어 POB와 게어즈 원문이 모두 다음 절로 이어지는 미완성 구조이므로, 이를 매끈하게 봉합하지 않고 열린 종속 구조를 보존하는 것이 더 충실합니다.
