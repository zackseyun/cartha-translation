  text: and shut the gate of Egypt. And he devised an evil plan against the sons of Israel, so that
translation:
  language: ko
  text: 그리고 그는 이집트의 문을 닫았습니다. 그리고 이스라엘의 아들들을 대적하여 악한 계책을 꾸몄으니, 그래서[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዐጸወ፡ አንቀጸ፡ ግብጽ።
  english_pob_choice: and shut the gate of Egypt.
  chosen_korean: “이집트의 문을 닫았습니다”
  alternatives_korean:
  - “이집트의 성문을 닫았습니다”
  - “이집트의 관문을 닫았습니다”
  lexicon: gate → 문
  rationale: 게이트의 기본 의미를 살려 직역하되, 성문처럼 성곽을 전제하는 표현은 원문이 요구하지 않으므로 피했습니다.
- source_word: ወሐለየ፡ እኩየ፡ ሕሊና፡
  english_pob_choice: And he devised an evil plan
  chosen_korean: “악한 계책을 꾸몄습니다”
  alternatives_korean:
  - “악한 생각을 품었습니다”
  - “사악한 계략을 세웠습니다”
  lexicon: devise plan / evil plan → 계책을 꾸미다
  rationale: 행동으로 이어지는 의도적 음모를 나타내므로 단순한 ‘생각’보다 ‘계책/계략’이 원문과 영어 POB의 중간층위를 더 잘 반영합니다.
- source_word: ውሉደ፡ እስራኤል፡
  english_pob_choice: the sons of Israel
  chosen_korean: “이스라엘의 아들들”
  alternatives_korean:
  - “이스라엘 자손”
  - “이스라엘 사람들”
  lexicon: sons of Israel → 아들들
  rationale: 영어 POB의 ‘sons’를 따라 직역하여 혈연·언약 공동체를 함께 드러내며, 익숙한 ‘이스라엘 자손’보다 원문 표면을 더 가깝게 보존합니다.
theological_decisions:
- issue: 본문의 종속절이 미완성으로 끝남
  chosen_reading: 마지막 ‘so that’에 맞춰 한국어도 ‘그래서’로 끝내어, 뒤이어 올 목적/결과절이 생략된 상태를 그대로 드러냈습니다.
  alternative_readings:
  - 의미를 보완하여 완전한 문장으로 매끈하게 마무리함
  - 생략을 메우지 않고 문장을 한국어식으로 재구성함
  rationale: 영어 POB와 게어즈 원문이 모두 다음 절로 이어지는 미완성 구조이므로, 이를 매끈하게 봉합하지 않고 열린 종속 구조를 보존하는 것이 더 충실합니다.
  doctrine_reference: source fidelity / discourse structure
