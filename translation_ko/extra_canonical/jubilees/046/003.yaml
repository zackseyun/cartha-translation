  text: the sons of Israel throughout all the days of Joseph's life. And Joseph died at the age of one hundred and ten years. Seventeen years he lived in the land of Canaan, and ten years while he was serving, and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt.
  footnotes:
  - marker: a
    text: Or 'and eighty years in the land of Egypt.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 생애의 모든 날 동안 이스라엘 자손에게 그러했습니다. 요셉은 백십 세에 죽었습니다. 그는 가나안 땅에서 십칠 년을 살았고, 섬기는 동안 십 년을 살았으며, 감옥에서 삼 년을 보냈고, 이집트 왕 바로의 권세 아래서 팔십 년을 지냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርዎሙ፡ ለውሉደ፡ እስራኤል፡ ኵሎ፡ መዋዕለ፡ ሕይወቱ፡ ለዮሴፍ
  english_pob_choice: the sons of Israel throughout all the days of Joseph's life
  chosen_korean: 그의 생애의 모든 날 동안 이스라엘 자손에게 그러했습니다
  alternatives_korean:
  - 이스라엘 자손에게 그의 생애의 모든 날 동안
  - 요셉의 생애 내내 이스라엘 자손에게
  lexicon: ውሉደ እስራኤል / ἰsrael
  rationale: 문장 첫머리는 서술이 압축된 연결구로 보이므로, 한국어에서는 앞 문장의 내용을 받는 자연스러운 요약형으로 옮기되 ‘이스라엘 자손’이라는 집단을 유지했습니다.
- source_word: ወሞተ፡ ዮሴፍ፡ ወልደ፡ *ምእት፡ ወዓሠርቱ፡ ዓመት
  english_pob_choice: And Joseph died at the age of one hundred and ten years
  chosen_korean: 요셉은 백십 세에 죽었습니다
  alternatives_korean:
  - 요셉은 백십 년의 나이에 죽었습니다
  - 요셉은 나이 백십 세로 죽었습니다
  lexicon: 나이 표현
  rationale: 연령 표현은 한국어 성경 문체에 맞춰 ‘세’를 사용해 간결하고 직접적으로 옮겼습니다.
- source_word: ወዓሠርተ፡ ወሰብዓተ፡ ዓመተ፡ ነበረ፡ ምድረ፡ ከናአን
  english_pob_choice: Seventeen years he lived in the land of Canaan
  chosen_korean: 그는 가나안 땅에서 십칠 년을 살았고
  alternatives_korean:
  - 가나안 땅에서 십칠 년을 살았고
  - 그는 가나안에서 십칠 년을 살았고
  lexicon: 가나안 땅 / 년 수
  rationale: ‘땅’은 מקור 위치를 분명히 하며, ‘십칠’은 동아시아식 수사체계를 유지하면서도 현대 문장에 맞게 사용했습니다.
- source_word: ወሠለስተ፡ ዓመተ፡ ውስተ፡ ቤተ፡ ሞቅሕ፡ ወሰማንያ፡ ዓመተ
  english_pob_choice: and three years in the prison-house, and eighty years he was under the authority of Pharaoh, king of Egypt
  chosen_korean: 감옥에서 삼 년을 보냈고, 이집트 왕 바로의 권세 아래서 팔십 년을 지냈습니다
  alternatives_korean:
  - 감옥에서 삼 년을 보냈고, 이집트에서 팔십 년을 지냈습니다
  - 감옥에서 삼 년을 지냈고, 바로 왕의 통치 아래서 팔십 년을 지냈습니다
  lexicon: ቤተ ሞቅሕ / ፈርዖን
  rationale: ‘감옥’은 1차적으로 ‘prison-house’의 의미를 분명히 하며, 마지막 절은 출처 본문의 ‘바로의 아래’라는 종속 관계를 살려 ‘권세 아래서’로 옮겼습니다.
theological_decisions:
- issue: 마지막 구절의 80년을 ‘이집트 땅에서’로 보지 않고 ‘바로의 권세 아래서’로 옮길지 여부
  chosen_reading: 문맥상 요셉의 후반 80년은 거처보다 통치 관계를 강조하므로, 바로의 권세 아래서로 번역했습니다.
  alternative_readings:
  - 이집트 땅에서 팔십 년을 지냈습니다
  - 이집트에서 팔십 년을 지냈습니다
  rationale: 아후(후속) 교정 메모가 지적하듯, 게에즈 원문은 단순한 위치보다 ‘바로 아래에 있었다’는 종속 상태를 말합니다. 따라서 역사적 의미를 보존하려면 권세/통치 관계를 드러내는 것이 더 정확합니다.
  doctrine_reference: 본문 해석상 문제이며 교리 쟁점은 아닙니다.
