  to: 요셉은 생애의 모든 날 동안 이스라엘 자손을 다스렸습니다. 요셉은 백십 세에 죽었습니다. 그는 가나안 땅에서 십칠 년을 살았고, 섬기며 십 년을 지냈고, 감옥에서 삼 년을 지냈으며, 이집트 왕 바로의 통치 아래에서 팔십 년을 지냈습니다.
