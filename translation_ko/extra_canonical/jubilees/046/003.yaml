  source_fidelity: 첫 절의 게에즈어는 문맥상 요셉이 이스라엘 자손을 그의 생애 동안 다스렸다는 뜻인데, 초안의 ‘이스라엘 자손에게 그러했습니다’는 선행 내용을 필요로 하는 불명확한 표현이며 ‘다스리다’라는 핵심 동사를 드러내지 못합니다. 연령 및 17년·10년·3년·80년의 구분은 대체로 충실합니다. 마지막 80년은 제공된 영어 감사 이력에 보존된 완전한 게에즈어 독법에 따라 바로, 곧 이집트 왕의 권위 아래에 있었던 기간으로 옮겨야 합니다.
  naturalness: ‘십칠 년’, ‘삼 년’ 등의 표기는 현대적인 정식 문체에서 자연스럽습니다. 다만 ‘섬기는 동안 십 년을 살았으며’는 시간 경과를 중복해 다소 어색하게 들리므로 ‘섬기며 십 년을 지냈고’로 다듬는 편이 좋습니다. ‘권세 아래서’도 가능하나, 여기서는 통치자의 권위·지배 아래라는 관계를 더 직접적으로 나타내는 ‘통치 아래에서’가 자연스럽습니다.
  terminology: ‘이스라엘 자손’, ‘가나안 땅’, ‘바로’, ‘이집트 왕’, ‘감옥’은 적절합니다. 마지막 표현은 위치인 ‘이집트 땅에서’가 아니라 바로의 통치 관계를 나타내야 합니다. 영어 감사 기록의 구(‘Or and eighty years in the land of Egypt’)는 현재 확정된 본문 독법과 맞지 않는 이전 번역 관련 주석이므로 유지하지 않습니다.
  issues:
