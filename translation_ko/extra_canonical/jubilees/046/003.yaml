    rationale: 이 표현은 한국어로 지시 대상이 불분명하고, 원문의 핵심 서술인 요셉의 통치 행위를 누락합니다. ‘요셉은 생애의 모든 날 동안 이스라엘 자손을 다스렸습니다’로 명시해야 합니다.
