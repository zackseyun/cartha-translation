  chosen_reading: 이 구절은 신학적 쟁점보다 지리적 서술이 핵심이므로, ‘산지’라는 범위를 드러내는 번역을 유지했습니다.
  alternative_readings:
  - 단순히 ‘산’으로 옮겨 더 직역할 수 있음
  - ‘산악 지대’로 풀어 쓸 수 있음
  rationale: 뒤이어 붙는 헤브론과의 결합을 해치지 않으면서 원문의 공간적 의미를 보존하기 위함입니다.
  doctrine_reference: 문맥 중심의 서술 번역 원칙
