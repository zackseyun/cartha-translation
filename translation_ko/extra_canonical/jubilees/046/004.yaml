  source_fidelity: The draft accurately conveys the governing relationship, the contemporaneous force of እንዘ, Joseph's rule over all Egypt, and the unfinished continuation after the death notice. However, ‘왕 아래에서’ can be read spatially in Korean and is not an idiomatic expression for political subordination.
  naturalness: ‘왕 아래에서’ is awkward in modern Korean for this context. ‘왕의 통치 아래에서’ naturally expresses the intended relationship. The verse's deliberately incomplete final coordination should remain incomplete.
  terminology: ‘다스리다,’ ‘온 이집트 땅,’ and ‘모든 형제들’ are suitable, neutral renderings. No theological terminology is implicated.
