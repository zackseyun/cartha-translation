translation:
  language: ko
  text: 왕 아래에서, 그가 온 이집트 땅을 다스리고 있을 때였습니다. 그리고 그는 죽었고, 그의 모든 형제들도[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምታሕተ፡ ንጉሥ፡
  english_pob_choice: under the king
  chosen_korean: 왕 아래에서
  alternatives_korean:
  - 왕 밑에서
  - 왕의 통치 아래에서
  lexicon: 왕
  rationale: 지배 관계를 간결하게 드러내면서도 ‘under’를 직역한 느낌을 살리기 위해 ‘왕 아래에서’로 옮겼습니다.
- source_word: እንዘ፡ ይኴንን፡
  english_pob_choice: while he was ruling
  chosen_korean: 그가 … 다스리고 있을 때
  alternatives_korean:
  - 그가 … 통치하는 동안
  - 그가 … 다스릴 때
  lexicon: 다스리다
  rationale: እንዘ가 동시적 진행을 나타내므로, 단순 현재 서술보다 ‘-고 있을 때’로 그 진행성을 살렸습니다.
- source_word: ኵላ፡ ምድረ፡ ግብጽ።
  english_pob_choice: all the land of Egypt
  chosen_korean: 온 이집트 땅
  alternatives_korean:
  - 이집트 온 땅
  - 이집트 전역
  lexicon: 땅
  rationale: ‘land’를 문자적으로 유지하되 현대 한국어에서 자연스럽게 읽히도록 ‘온 이집트 땅’으로 정리했습니다.
- source_word: ወሞተ፡ ወኵሎሙ፡ አኅዊሁ፡
  english_pob_choice: And he died, and all his brothers,
  chosen_korean: 그리고 그는 죽었고, 그의 모든 형제들도
  alternatives_korean:
  - 그리고 그가 죽었고, 그의 모든 형제들도
  - 그는 죽었고, 그의 형제들 모두도
  lexicon: 죽다
  rationale: 원문이 다음 대목으로 이어지는 미완의 열거 구조이므로, 한국어도 문장 종결을 완성하지 않고 절을 그대로 보존했습니다.
theological_decisions:
- issue: 서술어 ‘다스리다’의 역사서적 톤
  chosen_reading: 왕의 통치 행위를 중립적으로 ‘다스리다’로 옮겼습니다.
  alternative_readings:
  - 통치하다
  - 군림하다
  rationale: 원문의 지배적 상태를 전달하되 과도하게 평가적인 뉘앙스는 피했습니다.
