    issue: ‘왕 아래에서’ is potentially spatial and unnatural.
    rationale: In contemporary Korean, political subordination is normally expressed as ‘왕의 통치 아래에서.’ This preserves the source's ‘under the king’ without introducing a different relationship.
  revised_text: 왕의 통치 아래에서, 그가 온 이집트 땅을 다스리고 있을 때였습니다. 그리고 그는 죽었고, 그의 모든 형제들도[a]
