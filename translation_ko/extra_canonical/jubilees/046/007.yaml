base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/007.yaml
  text: Egypt and killed him there; and he pursued after them to Egypt, as far as the entrance of Eromon. But he could not enter, because another new king had arisen over Egypt, stronger than he, and he returned to the land of Canaan, and the gate of Egypt was shut, and there was none who went out and none who came in to Egypt.
  footnotes:
  - marker: a
    text: Or 'he took possession of the land of Canaan and shut the gate of Egypt'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 그곳에서 그를 죽였습니다. 그리고 그는 그들을 뒤쫓아 이집트로, 에로몬의 입구까지 갔습니다. 그러나 이집트에 다른 새 왕이 일어나 그보다 강했기 때문에, 그는 들어갈 수 없었습니다. 그는 가나안 땅으로 돌아갔고, 이집트의 문은 닫혔습니다.[a] 나가는 자도 없고 이집트로 들어오는 자도 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 가나안 땅을 차지하고 이집트의 문을 닫았다.’
    reason: 영어 POB 감사 기록에 보존된 이전 번역의 대안 독법을 한국어로 충실히 제시합니다. 이 대안은 현행 본문의 ‘돌아갔고’ 및 수동형 ‘닫혔다’와 구별됩니다.
lexical_decisions:
- source_word: ግብጽ
  english_pob_choice: Egypt
  chosen_korean: 이집트
  alternatives_korean:
