  to: 그리고 그가 그곳에서 그를 죽였습니다. 그리고 그는 그들을 뒤쫓아 이집트로, 에로몬의 입구까지 갔습니다. 그러나 이집트에 다른 새 왕이 일어나 그보다 강했기 때문에, 그는 들어갈 수 없었습니다. 그는 가나안 땅으로 돌아갔고, 이집트의 문은 닫혔습니다.[a] 나가는 자도 없고 이집트로 들어오는 자도 없었습니다.
  rationale: 지명 오기를 ‘이집트’로 바로잡고, 통치자의 등장이 침입 불가의 이유라는 원문의 관계를 자연스러운 현대 한국어로 명확히 했습니다. 가나안으로 돌아감과 이집트 문이 닫힘은 최신 원문 검토 결과에 따라 각각 능동과 수동으로 유지했습니다. 각주는 대안 독법이 적용되는 두 절에 직접 연결했습니다.
