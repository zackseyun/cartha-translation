  lexicon: 지명
  rationale: 표준 현대 한국어 독자에게 자연스러운 음역을 택하되, 본문이 지명을 직접 가리키므로 성경 관용형보다 현대 표기를 사용했습니다.
- source_word: ወቐተሎ / killed him there
  english_pob_choice: killed him there
  chosen_korean: 그곳에서 그를 죽였습니다
  alternatives_korean:
  - 거기서 그를 죽였습니다
  - 그를 그곳에서 죽였습니다
  lexicon: 동사구
  rationale: 행위와 장소를 모두 분명히 살려, 원문의 단순한 서술을 직역 과잉 없이 자연스럽게 옮겼습니다.
- source_word: ወዴገነ
  english_pob_choice: he pursued after them
  chosen_korean: 그들을 뒤쫓아
  alternatives_korean:
  - 그들을 추격하여
  - 그들을 쫓아
  lexicon: 동사
  rationale: 복수 대상을 향한 추적을 드러내기 위해 ‘뒤쫓다’를 택했습니다.
- source_word: ሐዲስ ንጉሥ
  english_pob_choice: another new king
  chosen_korean: 다른 새 왕
  alternatives_korean:
  - 새로운 다른 왕
  - 또 다른 새 왕
  lexicon: 명사구
  rationale: ‘새 왕’과 ‘다른’의 이중성을 유지하여, 단순한 교체가 아니라 새 통치자의 등장을 드러냈습니다.
- source_word: ወተዐጽወ
  english_pob_choice: the gate of Egypt was shut
  chosen_korean: 이집트의 문은 닫혔으며
  alternatives_korean:
  - 이집트의 문이 닫혔으며
  - 이집트의 문은 잠겼으며
  lexicon: 동사
  rationale: 수동 의미를 살려 ‘닫혔습니다’로 옮겼고, 성문 이미지가 자연스럽게 전달되도록 했습니다.
theological_decisions:
- issue: 가나안 땅으로 돌아감과 이집트 문이 닫힘의 서술 관계
  chosen_reading: 본문의 인과를 약화하지 않고, 왕의 등장으로 인해 침입이 좌절되고 결과적으로 경계가 봉쇄된 흐름으로 읽었습니다.
  alternative_readings:
  - 왕이 가나안 땅을 점유한 뒤 이집트 문을 닫은 것으로 읽는 해석
  - 문이 닫힌 뒤에야 돌아갔다는 순서 재배열
  rationale: 에티오피아어 본문과 POB 영어 개정은 ‘그가 돌아갔고, 이집트의 문은 닫혔다’는 순서를 지지하므로, 서술 순서를 그대로 반영했습니다.
  doctrine_reference: source-critical textual sense
- issue: 에로몬의 입구의 음역 처리
  chosen_reading: 고유지명은 의미역보다 음역을 택해 ‘에로몬의 입구’로 남겼습니다.
  alternative_readings:
  - 에로몬의 성문
  - 에로몬 입구
  rationale: 원문의 지명이 불분명하므로 뜻을 추정해 일반화하기보다, 독자가 원문 계열을 추적할 수 있도록 음역을 보존했습니다.
  doctrine_reference: proper-name rendering
