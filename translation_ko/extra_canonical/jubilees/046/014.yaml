  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
  footnotes:
  - marker: a
    text: Or 'that had fallen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그들 위에 강제 노역 감독들을 세워 억압으로 그들을 괴롭히게 하였고, 그들은 바로를 위해 견고한 성읍들 곧 비돔과 라암셋을 건축하였습니다. 또한 그들은 무너졌던 모든 성벽과 모든 둑을 건축하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
  english_pob_choice: taskmasters
  chosen_korean: 강제 노역 감독들
  alternatives_korean:
  - 일꾼 감독들
  - 부역 감독들
  - 노역 감독들
  lexicon: job overseer / forced labor administrator
  rationale: 단순한 ‘감독’보다, 이어지는 ‘억압으로 괴롭히게 하다’와 문맥상 강제 노역을 부과하는 관리라는 점을 살려 ‘강제 노역 감독들’로 옮겼습니다.
- source_word: በቅኔ
  english_pob_choice: with oppression
  chosen_korean: 억압으로
  alternatives_korean:
  - 가혹하게
  - 압제함으로
  - 강제로
  lexicon: oppression / affliction
  rationale: 행위의 방식이면서 결과적으로 고통을 가하는 뜻을 살려, 원문의 압제적 성격을 직접 드러내는 ‘억압으로’를 택했습니다.
- source_word: አህጉረ፡ ጽኑዓተ
  english_pob_choice: fortified cities
  chosen_korean: 견고한 성읍들
  alternatives_korean:
  - 견고하게 요새화된 성읍들
  - 튼튼한 성읍들
  - 요새 성읍들
  lexicon: fortified cities
  rationale: ‘성읍들’은 도시 자체를, ‘견고한’은 방어적 요새화를 압축해 드러내므로 과도하게 풀지 않고 균형 있게 반영했습니다.
- source_word: ጥቆመ
  english_pob_choice: walls
  chosen_korean: 성벽
  alternatives_korean:
  - 벽
  - 담장
  - 담
  lexicon: walls
  rationale: 도시 방어 구조를 가리키는 말이므로 일반적 ‘벽’보다 성읍 방어에 맞는 ‘성벽’이 자연스럽습니다.
- source_word: ዐረፋተ
  english_pob_choice: embankments
  chosen_korean: 둑
  alternatives_korean:
  - 제방
  - 방죽
  - 둑과 제방
  lexicon: embankments
  rationale: 물길이나 지반을 막는 토목 구조를 가리키는 말로 보아, 가장 간결하고 현대 독자가 이해하기 쉬운 ‘둑’을 사용했습니다.
theological_decisions:
- issue: 파라오의 이름을 일반명사처럼 처리할지, 고유명사로 유지할지
  chosen_reading: ‘바로’를 고유명사로 유지했습니다.
  alternative_readings:
  - ‘파라오’로 음역
  - ‘왕’으로 일반화
  rationale: 본문은 특정 이집트 통치자를 가리키므로 한국 성경의 익숙한 고유명사형 ‘바로’를 유지하는 것이 가장 직접적입니다.
  doctrine_reference: source fidelity / proper noun convention
