  text: 'And he appointed over them taskmasters so that they might afflict them with oppression, and they built fortified cities for Pharaoh: Pithom and Raamses. And they built all the walls and all the embankments that had fallen.'
  footnotes:
  - marker: a
    text: Or 'that had fallen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그들을 감독하게 하여 억압으로 그들을 학대할 강제 노역 감독들을 세웠고, 그들은 바로를 위해 견고한 성읍들, 곧 비돔과 라암셋을 건축하였습니다. 또한 그들은 모든 성벽과 무너졌던 모든 둑을 건축하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무너졌던’은 성벽과 둑 모두를 수식하는 것으로도 이해할 수 있습니다.
    reason: 원문의 관계절이 가까운 선행사인 ‘둑’에만 연결되는지, 병렬된 ‘성벽과 둑’ 전체에 연결되는지 문법적으로 여지가 있으므로 그 모호성을 보존합니다.
lexical_decisions:
- source_word: ሊቃነ፡ ግብር
