- from: 그리고 그는 그들을 압제했습니다. 그리고 그는 이집트 백성에게 말했습니다. "보십시오. 이스라엘 자손의 백성이 우리보다 수가 많고 힘도 셉니다. 자, 우리가 그들에게 지혜롭게 대처하여 그들이 많아지지 못하게 하고, 노역으로 그들을 압제합시다. 전쟁이 우리에게 닥치고 그들도 우리 원수들과 합세하여 우리 땅에서 나갈까 두렵습니다. 그들의 마음과 얼굴은 가나안 땅을 향하고 있습니다."[a][b]
  to: 그는 그들을 압제했고, 이집트 백성에게 말했습니다. “보십시오. 이스라엘 자손의 백성이 우리보다 수가 많고 더 강합니다. 자, 그들이 수가 더 늘어나기 전에 우리가 그들에게 지혜롭게 대처하고, 노역으로 그들을 압제합시다. 전쟁이 우리에게 닥쳐 그들도 우리 원수들과 합세하여 우리 땅에서 나가 버릴까 염려됩니다. 그들의 마음과 얼굴은 가나안 땅을 향하고 있습니다.”
  rationale: ‘그들이 많아지지 못하게’를 ‘그들이 수가 더 늘어나기 전에’로 고쳐 게에즈어의 시간적 접속 의미를 반영했습니다. 출애굽기의 표현에 맞추어 ‘올라가다’로 조화시키지 않고, 원문의 ‘나가다’를 유지했습니다. 근거를 잃은 앵커와 각주를 제거했습니다.
