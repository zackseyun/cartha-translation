base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/046/013.yaml
  text: and he oppressed them, and he said to the people of Egypt, 'Look, the people of the children of Israel are more and stronger than we are. Come, let us deal wisely with them, before they multiply, and let us oppress them with servitude, lest war come upon us and they also join themselves to our enemies and go out from our land, for their hearts and their faces are toward the land of Canaan.'
  footnotes:
  - marker: a
    text: Or 'lest they multiply'.
    reason: previous_rendering
  - marker: b
    text: Or 'and go up from our land'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그들을 압제했고, 이집트 백성에게 말했습니다. “보십시오. 이스라엘 자손의 백성이 우리보다 수가 많고 더 강합니다. 자, 그들이 수가 더 늘어나기 전에 우리가 그들에게 지혜롭게 대처하고, 노역으로 그들을 압제합시다. 전쟁이 우리에게 닥쳐 그들도 우리 원수들과 합세하여 우리 땅에서 나가 버릴까 염려됩니다. 그들의 마음과 얼굴은 가나안 땅을 향하고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያሕምሞሙ
  english_pob_choice: and he oppressed them
  chosen_korean: 그는 그들을 압제했습니다
  alternatives_korean:
  - 그는 그들을 괴롭혔습니다
  - 그는 그들을 학대했습니다
  lexicon: አሕመመ / ያሕምሞ
  rationale: 본문의 동사는 단순한 괴롭힘보다 강한 억압·압박을 가리키므로, 영어 POB의 ‘oppressed’에 맞춰 ‘압제했습니다’로 옮겼습니다.
- source_word: ለሰብአ፡ ግብጽ
  english_pob_choice: the people of Egypt
  chosen_korean: 이집트 백성
  alternatives_korean:
  - 애굽 백성
  - 이집트 사람들
  lexicon: ሰብአ ግብጽ
  rationale: 지명-집단 표현을 자연스러운 현대 한국어로 옮기되, ‘백성’을 유지해 집단적 대상임을 살렸습니다.
- source_word: ውሉደ፡ እስራኤል
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 아들들
  - 이스라엘의 자녀들
  lexicon: ውሉደ እስራኤል
  rationale: 족속 전체를 가리키는 관용적 집합명사로서 ‘자손’이 가장 자연스럽고, POB의 ‘children’도 이 범주를 뜻합니다.
- source_word: ልህቁ፡ ወበዝኁ
  english_pob_choice: are more and stronger than we are
  chosen_korean: 우리보다 수가 많고 힘도 셉니다
  alternatives_korean:
  - 우리보다 많고 강합니다
  - 우리보다 더 많고 강합니다
  lexicon: መብዛት / ብርት
  rationale: 두 형용적 비교를 분리해 수적 우세와 힘의 우세를 모두 드러내도록 했습니다.
- source_word: ንጥበብ
  english_pob_choice: let us deal wisely with them
  chosen_korean: 우리가 그들에게 지혜롭게 대처하여
  alternatives_korean:
  - 우리가 그들에게 꾀를 부려
  - 우리가 그들을 지혜로 다뤄
  lexicon: ጥበብ
  rationale: ‘지혜롭게’는 원문의 지혜/지략 어휘를 살리되, 문맥상 실천적 대응을 나타내므로 ‘대처하다’를 보완했습니다.
- source_word: ዘእንበለ፡ ይብዝኁ
  english_pob_choice: lest they multiply
  chosen_korean: 그들이 많아지지 못하게
  alternatives_korean:
  - 그들이 번성하지 않게
  - 그들이 더 늘어나지 않게
  lexicon: ይብዝኁ
  rationale: 게에즈의 ዘእንበለ는 여기서 ‘~하지 않도록/하지 못하게’의 예방적 목적을 나타내므로, ‘before’나 단순 서술이 아니라 결과 방지 의미를 살렸습니다.
- source_word: ወናሕምሞሙ፡ በቅኔ
  english_pob_choice: and let us oppress them with servitude
  chosen_korean: 노역으로 그들을 압제합시다
  alternatives_korean:
  - 강제노동으로 그들을 억압합시다
  - 종살이로 그들을 괴롭게 합시다
  lexicon: ቅኔ
  rationale: 문맥상 강제 부역/노역을 뜻하므로, ‘servitude’의 종속 상태를 과장하지 않으면서도 억압의 수단을 분명히 했습니다.
- source_word: ወይወፅኡ፡ እምድርነ
  english_pob_choice: and go out from our land
  chosen_korean: 우리 땅에서 나갈까 두렵습니다
  alternatives_korean:
  - 우리 땅에서 떠날까 두렵습니다
  - 우리 땅에서 나가버릴까 두렵습니다
  lexicon: ወፅአ
  rationale: 게에즈 동사의 기본 의미인 ‘나가다’를 따라 ‘나가다’로 옮겼고, 지형적 ‘go up’로 harmonize하지 않았습니다.
theological_decisions:
- issue: 직접 인용 안의 선동적 발화와 두려움의 논리
  chosen_reading: 파라오의 억압과 집단적 경계심을 직접 인용부 안에서 그대로 드러냈습니다.
  alternative_readings:
  - 문장 전체를 더 완곡하게 풀어 쓸 수 있음
  - 두려움 표현을 약화시켜 정치적 판단처럼 보이게 할 수 있음
  rationale: 본문은 억압의 명령이 두려움에서 나왔음을 보여 주므로, 이를 완화하지 않고 독자가 서사의 도덕적 긴장을 이해하도록 했습니다.
  doctrine_reference: 서사 본문은 인물의 죄책과 동기를 드러내는 방식으로 읽어야 하며, 정당화된 관용으로 바꾸지 않습니다.
