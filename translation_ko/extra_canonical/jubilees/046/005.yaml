  text: and all that generation. And he commanded the sons of Israel before he died that they should carry
translation:
  language: ko
  text: 그리고 온 그 세대도 그러하였습니다. 그는 죽기 전에 이스라엘 자손에게 명하여 그들이 옮기게 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኵላ፡ ይእቲ፡ ትውልድ።
  english_pob_choice: and all that generation.
  chosen_korean: 그리고 온 그 세대도 그러하였습니다.
  alternatives_korean:
  - 그리고 그 모든 세대였습니다.
  - 그리고 그 세대 전체였습니다.
  lexicon: generation
  rationale: Geez의 분사적 서술을 한국어로는 자연스럽게 과거 서술로 옮기되, ‘온 그 세대’로 범위를 분명히 했습니다.
- source_word: ወአዘዞሙ፡
  english_pob_choice: And he commanded
  chosen_korean: 그는 … 명하여
  alternatives_korean:
  - 그는 … 명령하여
  - 그는 … 지시하여
  lexicon: command
  rationale: 권위 있는 명령을 담되 현대 문장에서는 ‘명하여’가 가장 자연스럽고 본문의 행위성을 잘 살립니다.
- source_word: ለውሉደ፡ እስራኤል፡
  english_pob_choice: the sons of Israel
  chosen_korean: 이스라엘 자손에게
  alternatives_korean:
  - 이스라엘의 아들들에게
  - 이스라엘의 자손들에게
  lexicon: sons of Israel
  rationale: 관용적이고도 원문의 집단 표현을 유지하는 표준적 성경어로 옮겼습니다.
- source_word: ዘእንበለ፡ ይሙት፡ ከመ፡ ይስዱ፡
  english_pob_choice: before he died that they should carry
  chosen_korean: 죽기 전에 … 옮기게 하였습니다.
  alternatives_korean:
  - 죽기 전에 … 들고 가게 하였습니다.
  - 죽기 전에 … 운반하게 하였습니다.
  lexicon: before he died / carry
  rationale: ‘before he died’는 문장 구조상 앞에 두기보다 한국어에서 자연스럽게 ‘죽기 전에’로 처리했고, ‘carry’는 문맥상 단순 이동을 뜻해 ‘옮기다’로 번역했습니다.
theological_decisions:
- issue: 서사적 명령문의 시제와 공적 문체
  chosen_reading: 직역보다 서사에 맞는 과거 완료적 흐름을 유지하면서도, ‘명하여’로 권위적 명령의 무게를 보존했습니다.
  alternative_readings:
  - ‘명령하였습니다’로 더 강하게 옮김
  - ‘지시하였습니다’로 완화
  rationale: 이 절은 단순 정보 전달이 아니라 족장/지도자의 권위를 드러내는 서술이므로, 현대 한국어의 자연스러움과 권위성을 함께 살렸습니다.
  doctrine_reference: 서사체의 문체 보존
- issue: Geez 원문과 영어 POB의 재배열된 절 구조
  chosen_reading: 한국어 본문은 원문의 두 절을 각각 살려 ‘그리고 온 그 세대도 그러하였습니다. 그는 죽기 전에…’로 구성했습니다.
  alternative_readings:
  - 영어처럼 한 문장으로 합침
  - 원문 어순을 더 강하게 모방
  rationale: 영어 POB가 출생/세대 서술과 명령 서술을 분리해 읽기 쉽게 만든 점을 따르되, 한국어에서도 두 절의 병치를 분명히 보여 주었습니다.
  doctrine_reference: 의미 대응과 가독성의 균형
