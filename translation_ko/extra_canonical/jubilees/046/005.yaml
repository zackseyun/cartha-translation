  source_fidelity: 첫 문장의 ‘온 그 세대도 그러하였습니다’는 원문의 생략된 술어를 유지하려는 의도는 있으나, ‘온 그 세대’는 현대 한국어에서 부자연스럽습니다. 둘째 문장은 명령의 내용을 ‘그들이 옮기게 하였습니다’로 인과적으로 표현하여, 원문의 ‘명령하였다’보다 다소 강한 사역의 뉘앙스를 냅니다. 목적어가 본 절의 제시된 원문 및 영어 감사 추적에도 명시되지 않았으므로 보충하지 않는 것이 안전합니다.
  naturalness: ‘그 세대 전체도 그러하였습니다’가 자연스럽고, ‘운반하도록 명령하였습니다’는 합쇼체 서사 문체에 맞으면서 목적어가 생략된 원문의 미완결성을 무리 없이 보존합니다.
  terminology: ‘이스라엘 자손’은 ለውሉደ፡ እስራኤል፡에 대한 관용적이고 적절한 번역입니다. ‘운반하다’는 ይስዱ፡/carry의 물리적 운반 의미를 ‘옮기다’보다 분명하게 전달합니다.
  issues:
  - severity: medium
    issue: 명령을 사역 구문으로 번역함
    rationale: ‘명하여 그들이 옮기게 하였습니다’는 명령의 결과를 직접 초래한 듯한 사역 표현입니다. 원문과 영어 POB의 명령절에 맞게 ‘운반하도록 명령하였습니다’로 옮기는 편이 정확합니다.
  - severity: low
