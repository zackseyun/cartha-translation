    rationale: 현대 표준 한국어에서는 ‘그 세대 전체’가 더 자연스럽습니다. 원문의 생략된 술어는 ‘그러하였습니다’로 유지할 수 있습니다.
  revised_text: 그리고 그 세대 전체도 그러하였습니다. 그는 죽기 전에 이스라엘 자손에게 운반하도록 명령하였습니다.
