revisions:
- from: 야곱이 죽은 뒤에 이스라엘 자손들은 이집트 땅에서 번성하여 수많은 백성이 되었고, 그들은 모두 마음이 하나가 되어, 각자가 자기 형제를 사랑하고 한 사람이 자기 형제를 도왔습니다. 그들은 요셉의 모든 날 동안 매우 크게 번성하고 더욱더 많아졌습니다. 곧 십 주간의 세월 동안이었습니다.[a][b]
  to: 야곱이 죽은 뒤에 이스라엘 자손들은 이집트 땅에서 번성하여 수많은 백성이 되었습니다. 그들은 모두 마음이 하나가 되어, 사람마다 자기 형제를 사랑하고 도왔습니다. 그들은 모든 십 주간의 해 동안 크게 번성하고 더욱더 많아졌습니다.
  rationale: 원어 본문에 없는 ‘요셉의 모든 날’을 삭제하고, 시간 단위 ዐሠርተ ሱባዔ ዓመታት를 해석으로 환원하지 않고 ‘십 주간의 해’로 보존했습니다. 반복된 증가 동사와 강화 표현은 ‘크게 번성하고 더욱더 많아졌습니다’로 유지했습니다. 또한 비자연적인 개별 행위 표현을 매끄러운 한국어 병렬 구문으로 다듬고, 본문에 연결되지 않는 영어 유래 각주를 제거했습니다.
  reviewer_model: gpt-5.6-terra
