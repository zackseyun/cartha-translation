  yaml_path: translation/extra_canonical/jubilees/046/001.yaml
  text: And it came to pass after Jacob died, the sons of Israel increased in the land of Egypt, and they became a numerous people; and they were all united in their hearts, so that each loved his brother and a man helped his brother. And they increased abundantly and multiplied exceedingly during all the days of Joseph, for ten weeks of years.
  footnotes:
  - marker: a
    text: Or 'and grew strong'.
    reason: previous_rendering
  - marker: b
    text: Or 'they were all united'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 죽은 뒤에 이스라엘 자손들은 이집트 땅에서 번성하여 수많은 백성이 되었습니다. 그들은 모두 마음이 하나가 되어, 사람마다 자기 형제를 사랑하고 도왔습니다. 그들은 모든 십 주간의 해 동안 크게 번성하고 더욱더 많아졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዝኁ / ፈድፋደ / ጥቀ
  english_pob_choice: increased abundantly / multiplied exceedingly
  chosen_korean: 번성하여… 매우 크게 번성하고 더욱더 많아졌습니다
  alternatives_korean:
  - 크게 불어났습니다
  - 크게 번성했습니다
  - 엄청나게 늘어났습니다
  lexicon: 번성하다 / 많아지다
  rationale: 게에즈 본문이 같은 동사 계열의 반복으로 ‘증가·번성’을 누적해 강조하므로, 한국어에서도 번성과 증가를 겹쳐 표현해 반복의 힘을 살렸습니다.
- source_word: በአልቦሙ
  english_pob_choice: united in their hearts
  chosen_korean: 모두 마음이 하나가 되어
  alternatives_korean:
  - 모두 한마음이 되어
  - 마음속으로 하나 되어
  - 뜻이 하나가 되어
  lexicon: 마음 / 하나가 되다
  rationale: 본문이 ‘마음 안에서’의 일치를 말하므로 단순한 외적 합의보다 내면적 일치를 드러내는 표현을 택했습니다.
- source_word: ያፍቅር… ይትራዳእ
  english_pob_choice: each loved his brother and a man helped his brother
  chosen_korean: 각자가 자기 형제를 사랑하고 한 사람이 자기 형제를 도왔습니다
  alternatives_korean:
  - 각자가 자기 형제를 사랑하고 서로 도왔습니다
  - 형제마다 서로 사랑하고 도왔습니다
  - 각자 형제를 사랑하며 서로 도왔습니다
  lexicon: 사랑하다 / 돕다
  rationale: 게에즈는 ‘형제를 사랑하다’와 ‘형제를 돕다’를 병렬로 제시하므로, 관계의 온정과 실제적 도움을 함께 보이도록 직역에 가깝게 옮겼습니다.
- source_word: ኵሎሙ ዕሩያነ
  english_pob_choice: they were all united
  chosen_korean: 그들은 모두 마음이 하나가 되어
  alternatives_korean:
  - 그들은 모두 연합되어
  - 그들은 모두 하나로 뭉쳐
  - 그들은 모두 뜻을 같이하여
  lexicon: 연합 / 일치
  rationale: 영문 수정본과 달리 본문은 단순한 집단 결속보다 ‘마음의 일치’를 강조하므로, 공동체적 연합을 내면화된 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘십 주간의 세월’의 종말론적 연대표현
  chosen_reading: 마지막 절은 연대 계산을 그대로 살려 ‘십 주간의 세월’로 옮겼습니다.
  alternative_readings:
  - ‘열 주간의 세월’
  - ‘열 주(週)의 세월’
  - 의미만 풀어 ‘오랜 세월’로 의역
  rationale: 본문의 시간 단위가 특유의 주간-연대 계산이므로, 해석해 버리기보다 독자가 원문 구조를 볼 수 있게 보존했습니다.
  doctrine_reference: 문학적·연대기적 본문 보존 원칙
