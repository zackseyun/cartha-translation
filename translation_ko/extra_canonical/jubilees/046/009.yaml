    text: Or 'in the field of the double cave'.
    reason: previous_rendering
translation:
  language: ko
  text: 이집트 땅에서였습니다. 그 뒤에 그의 모든 형제들도 죽었습니다. 이집트 왕은 제47희년의 둘째 주, 둘째 해에 가나안 왕과 싸우러 나갔습니다. 이스라엘 자손은 요셉의 뼈를 제외하고 야곱의 아들들의 모든 뼈를 꺼내어, 들판에, 산에 있는 이중 동굴 안에 장사했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘산에 있는 이중 동굴의 들판에’.
    reason: 반복된 전치사구의 결속 범위에 따라 장소 관계를 다르게 이해할 가능성을 표시합니다. 본문은 게에즈어의 반복 전치사 구조와 영어 감사 본문을 따라 병렬적으로 옮겼습니다.
lexical_decisions:
- source_word: ውስተ፡ ምድረ፡ ግብጽ፡
  english_pob_choice: in the land of Egypt
  chosen_korean: 이집트 땅에서
  alternatives_korean:
  - 이집트 땅에
  - 이집트 지역에서
  lexicon: 지명구
  rationale: 원문의 장소 표지를 자연스러운 한국어로 옮기되, ‘땅’으로 the land of Egypt의 범위를 살렸습니다.
- source_word: ኵሎሙ፡ አኀዊሁ፡ እምድኅሬሁ።
  english_pob_choice: all his brothers died after him
  chosen_korean: 그 뒤에 그의 모든 형제들이 죽었습니다
  alternatives_korean:
  - 그 후 그의 모든 형제들이 죽었습니다
  - 그의 모든 형제들이 그 뒤에 죽었습니다
  lexicon: 서술구
  rationale: ‘after him’을 시간 순서로 분명하게 드러내기 위해 ‘그 뒤에’로 옮겼습니다.
- source_word: በዘ፡ አርብዓ፡ ወሰብዐቱ፡ ኢዮቤልው፡ በዳግም፡ ሱባዔ፡ በካልእ፡ ዓመት፡
  english_pob_choice: in the forty-seventh jubilee, in the second week, in the second year
  chosen_korean: 제47희년의 둘째 주, 둘째 해에
  alternatives_korean:
  - 제47희년의 둘째 주간, 둘째 해에
  - 제47희년 둘째 주의 둘째 해에
  lexicon: 희년 연대기 구문
  rationale: POB의 희년 연대 표기를 따라 ‘희년’을 유지했고, applied_revision에 맞춰 ‘second week of years’가 아닌 간명한 ‘둘째 주’로 옮겼습니다.
- source_word: ወቀበርዎሙ፡ ውስተ፡ ገዳም፡ ውስተ፡ በዐት፡ ዘካዕበት፡
  english_pob_choice: they buried them in the field, in the double cave in the mountain
  chosen_korean: 들판, 곧 두 굴이 있는 동굴에 있는 무덤에 장사했습니다
  alternatives_korean:
  - 들판, 곧 두 굴이 있는 동굴에 묻었습니다
  - 들판과 두 굴이 있는 동굴에 있는 무덤에 장사했습니다
  lexicon: 매장 표현
  rationale: Ge'ez의 반복 전치사 구조를 반영해 ‘들판, 곧 … 동굴’로 나누어 옮기고, 전통적이지만 지나치게 교회화된 ‘장사하다’를 유지했습니다.
theological_decisions:
- issue: 졸지에 들어맞는 장소 구문과 반복 전치사 구조
  chosen_reading: ‘in the field, in the double cave’의 병렬 구조를 살려 ‘들판, 곧 두 굴이 있는 동굴’로 번역했습니다.
  alternative_readings:
  - ‘두 굴이 있는 동굴의 들판’
  - ‘들판 안의 두 굴 동굴’
  rationale: 최신 교정이 지적하듯 원문은 소유격이 아니라 전치사 반복으로 장소를 병렬 제시하므로, 한국어에서도 구조적 긴장을 지우지 않도록 분리해 표현했습니다.
  doctrine_reference: source-critical syntax
- issue: 희년 연대의 표기
  chosen_reading: ‘제47희년의 둘째 주, 둘째 해’로 표기했습니다.
  alternative_readings:
  - ‘47번째 희년의 둘째 주, 둘째 해’
  - ‘제47희년 둘째 주의 둘째 해’
  rationale: 본문의 연대 공식은 독자에게 희년 체계를 전제하므로, 숫자 서열과 시간 단위를 그대로 드러내는 표현을 택했습니다.
  doctrine_reference: jubilees chronology
