translation:
  language: ko
  text: 이집트 땅에서였습니다. 그 뒤에 그의 모든 형제들이 죽었습니다. 이집트 왕은 제47희년의 둘째 주, 둘째 해에 가나안 왕과 싸우러 나갔고, 이스라엘 자손은 요셉의 뼈를 제외한 야곱의 아들들의 모든 뼈를 가져다가 들판, 곧 두 굴이 있는 동굴에 있는 무덤에 장사했습니다.[a]
  philosophy: optimal-equivalence
