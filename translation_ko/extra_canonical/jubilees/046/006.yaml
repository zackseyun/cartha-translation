  lexicon: Geez negated future with burial phrase
  rationale: 원문의 이중 동작(데리고 나옴+매장)을 유지하면서, ‘장사하다’는 전통적 장례 용어를 자연스러운 현대 문장에 맞게 사용했습니다.
