translation:
  language: ko
  text: 그들의 뼈는 그들이 이집트 땅에서 나온 그 날에 있었습니다. 그는 자기 뼈에 관해 그들에게 맹세하게 하였는데, 이집트 사람들이 다시는 그를 데리고 나와 가나안 땅에 장사하지 않을 것을 알았기 때문입니다. 가나안 왕 마크마론은 아시리아 땅에 거주하면서 골짜기에서 왕과 함께 싸웠습니다.
  philosophy: optimal-equivalence
