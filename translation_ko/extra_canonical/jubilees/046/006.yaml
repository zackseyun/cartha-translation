  rationale: 맹세의 강제성을 살려 ‘맹세하게 하다’로 옮겼고, 전치사는 문맥상 ‘관해’로 간결하게 처리했습니다.
- source_word: አይድኅሙ፡ ... አውፅኦተ፡ ወቀቢሮተ፡ በምድረ፡ ከናአን
  english_pob_choice: would not again bring him out and bury him in the land of Canaan
