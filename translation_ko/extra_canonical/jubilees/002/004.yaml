  text: 'He made seven great works on the first day. And on the second day he made the firmament in the midst of the waters, and the waters were divided on that day: half of them went up above, and half of them went down beneath the firmament that is in the midst, over the face of the whole earth. And this alone he made.'
  footnotes:
  - marker: a
    text: Or 'beneath the firmament in the midst over the face of the whole earth'.
    reason: previous_rendering
  - marker: b
    text: Or 'And this alone.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 첫째 날에 큰 일곱 가지를 만드셨습니다. 둘째 날에는 물들 가운데에 궁창을 만드셨고, 그날 물들이 나뉘었습니다. 그들 가운데 절반은 위로 올라가고, 절반은 온 땅의 얼굴 위에 있는 가운데의 궁창 아래로 내려갔습니다. 그리고 이것만 그가 만드셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብዐተ፡ ግብረ፡ ዐበይተ፡
  english_pob_choice: seven great works
  chosen_korean: 큰 일곱 가지
  alternatives_korean:
  - 일곱 큰 일
  - 일곱 가지의 큰 일
  lexicon: 7, great works
  rationale: 원문의 수사적 표현을 그대로 살려 ‘일곱’과 ‘큰/위대한 일’을 함께 반영하되, 한국어에서는 자연스럽게 ‘큰 일곱 가지’로 옮겼습니다.
- source_word: ግብረ፡
  english_pob_choice: works
  chosen_korean: 일
  alternatives_korean:
  - 작업
  - 행위
  lexicon: work/deed
  rationale: 창조 행위 전체를 가리키는 말로서 ‘일’이 가장 직관적이며, 본문이 단순한 노동보다 창조적 행위를 말한다는 점도 담을 수 있습니다.
- source_word: ምጽናዓት፡ ማእከለ፡ ማይ፡
  english_pob_choice: the firmament in the midst of the waters
  chosen_korean: 물들 가운데에 궁창
  alternatives_korean:
  - 물 한가운데의 궁창
  - 물 가운데의 궁창
  lexicon: firmament / midst of the waters
  rationale: ‘궁창’은 전통적 천문-우주 표현을 유지하면서도, ‘물들 가운데에’로 위치 관계를 분명히 해 원문의 구조를 살렸습니다.
- source_word: ዲበ፡ ገጸ፡ ለ*ኵሉ፡ ምድር፡
  english_pob_choice: over the face of the whole earth
  chosen_korean: 온 땅의 얼굴 위에
  alternatives_korean:
  - 온 땅의 표면 위에
  - 온 땅 위에
  lexicon: over the face of the whole earth
  rationale: ‘얼굴’은 원문이 지닌 관용적 표지를 보존하기 위해 유지했고, 한국어 독자에게는 ‘위에’로 관계를 자연스럽게 연결했습니다.
- source_word: ወ*ዘንተ፡ ባሕቲቶ፡
  english_pob_choice: And this alone he made
  chosen_korean: 그리고 이것만 그가 만드셨습니다
  alternatives_korean:
  - 그리고 이것만 하셨습니다
  - 그리고 이것만 만드셨습니다
  lexicon: this alone
  rationale: 마지막 절의 제한성을 살리기 위해 ‘이것만’을 살렸고, 문맥상 생략된 행위 주어를 보완하여 한국어 문장을 매끄럽게 했습니다.
theological_decisions:
- issue: 창조주를 향한 서술에서 인칭과 높임말 처리
  chosen_reading: 본문 서술은 3인칭 역사 서술이므로 ‘그는… 만드셨습니다’로 유지했습니다.
  alternative_readings:
  - ‘그가… 만들었습니다’
  - ‘그는… 만들었습니다’
  rationale: 원문은 신적 직접화법이 아니라 서술문이므로, 하나님을 직접 호칭하는 장면처럼 ‘-십니다’를 쓰기보다 3인칭 높임 서술을 택했습니다.
  doctrine_reference: 서술 화자 높임과 신적 직접호칭 구분
