lexical_decisions:
- source_word: ፀሐየ፡ ወወርኀ፡ ወከዋክብተ፡
  english_pob_choice: the sun and the moon and the stars
  chosen_korean: 해와 달과 별들
  alternatives_korean:
  - 태양과 달과 별들
  - 해와 달과 별
  lexicon: 직역 어휘
  rationale: 게에즈 원문은 해·달·별의 삼중 목록이며, 한국어 성경에서 가장 자연스럽고 직접적인 표기는 ‘해와 달과 별들’입니다.
- source_word: ውስተ፡ ምጽናዓተ፡ ሰማይ፡
  english_pob_choice: in the firmament of heaven
  chosen_korean: 하늘의 궁창에
  alternatives_korean:
  - 하늘의 창공에
  - 하늘 궁창에
  lexicon: 직역 어휘
  rationale: 원문의 ‘firmament’에 해당하는 전통적 우주론 용어를 보존하되, 한국어에서는 자연스러운 속격 표현으로 ‘하늘의 궁창’이라 옮겼습니다.
- source_word: ወለኰንኖ፡
  english_pob_choice: and rule it
  chosen_korean: 그것을 다스리게
  alternatives_korean:
  - 그것을 통치하게
  - 그것을 지배하게
  lexicon: 동사 어휘
  rationale: 문맥상 해·달·별의 기능을 가리키며, 영어 POB의 ‘rule it’에 맞춰 목적어 ‘그것’을 분명히 드러내고 ‘다스리다’로 옮겼습니다.
theological_decisions:
- issue: 창조 질서 안에서 천체의 기능 표현
  chosen_reading: 해와 달과 별들은 온 땅에 빛을 비추고 땅을 다스리도록 정해진 존재로 묘사합니다.
  alternative_readings:
  - 단순히 빛을 내는 기능만 강조하는 읽기
  - 천체의 ‘통치’ 표현을 약화시키는 읽기
  rationale: 원문은 빛을 비추는 목적과 함께 ‘다스리게’라는 통치적 기능을 병기하므로, 두 요소를 모두 살려 창조 질서의 의도성을 드러냈습니다.
  doctrine_reference: 창세기 1장의 창조 질서와 천체의 지정된 기능
