  - 빛에서 어둠을 구별하게 하셨습니다
  lexicon: source_note
  rationale: 영어 POB의 목적 부정사 흐름을 따라 ‘나누다/분리하다’ 중 성경적 표현이 자연스러운 ‘나누게 하다’를 택했습니다.
- source_word: ወወሀበ፡ እግዚአብሔር፡ ፀሐየ፡
  english_pob_choice: And God appointed the sun
  chosen_korean: 그리고 하나님께서는 해를 땅 위에 놓으셔서
  alternatives_korean:
  - 그리고 하나님께서는 해를 정하셔서
  - 그리고 하나님께서는 해를 세우셔서
  lexicon: source_note
  rationale: 여기서 ‘appointed’는 해를 시간 표지로 지정하신 행위를 가리키므로, 목적을 드러내는 ‘놓으셔서/두셔서’보다 ‘지정하셔서’가 가능하지만, 뒤의 ‘큰 표징’과의 결합을 살려 위치·표징 부여의 뉘앙스를 함께 담아 번역했습니다.
- source_word: ለትእምርት፡ ዐቢይ፡
