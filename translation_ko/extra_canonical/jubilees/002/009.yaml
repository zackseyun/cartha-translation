  - 큰 징조가 되게 하셨습니다
  lexicon: source_note
  rationale: ‘표징’은 단순 자연현상보다 하나님이 뜻을 드러내는 표지라는 기능을 보존하며, ‘큰’도 원문의 수식어를 그대로 반영합니다.
- source_word: ለመዋዕል፡ ወለሰንበታት፡ ወለ*አውራኅ፡ ወለበዓላት፡ ወለዓመታት፡ ወለሰንበታት፡ ዓመታት፡ ወለ*አዮቤልውሳት፡
  english_pob_choice: for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees
  chosen_korean: 날들과 안식일들과 달들과 정해진 때들과 해들과 일곱째 해의 안식일들과 희년들과
  alternatives_korean:
  - 날들과 안식일들과 달들과 절기들과 해들과 해의 안식일들과 희년들과
  - 날들과 안식일들과 달들과 정한 때들과 해들과 안식년들과 희년들과
  lexicon: source_note
  rationale: 절기/정한 때의 구분은 전승별로 흔들리지만, 영어 POB의 audit를 따라 ‘appointed times’를 ‘정해진 때들’로, ‘sabbaths of years’를 ‘일곱째 해의 안식일들’로 보존했습니다.
