  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: ko
  text: 낮과 밤을 다스리게 하시고 빛과 어둠을 가르게 하셨습니다. 그리고 하나님께서는 날과 안식일과 달과 정해진 때와 해와 해의 안식일과 희년과 한 해의 모든 계절을 위한 큰 표징으로 해를 땅 위에 두셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዓልት፡ ወሌሊት፡
  english_pob_choice: over day and night
  chosen_korean: 낮과 밤을 다스리시고
  alternatives_korean:
