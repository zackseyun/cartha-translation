  text: over day and night and to separate light from darkness. And God appointed the sun as a great sign upon the earth for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees and for all the seasons of the years.
translation:
  language: ko
  text: 낮과 밤을 다스리시고 빛과 어둠을 나누게 하셨습니다. 그리고 하나님께서는 해를 땅 위에 놓으셔서 날들과 안식일들과 달들과 정해진 때들과 해들과 일곱째 해의 안식일들과 희년들과 모든 절기의 계절들을 위한 큰 표징이 되게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዓልት፡ ወሌሊት፡
  english_pob_choice: over day and night
  chosen_korean: 낮과 밤을 다스리시고
  alternatives_korean:
  - 낮과 밤을 가로질러
  - 낮과 밤 위에
  lexicon: source_note
  rationale: Ge'ez의 전치사적 용법을 반영해 단순 병치보다 ‘다스리다/관할하다’의 함의를 살려 자연스럽게 옮겼습니다.
- source_word: ወለፈሊጥ፡ ማዕከለ፡ ብርሃን፡ ወጽልመት።
  english_pob_choice: to separate light from darkness
  chosen_korean: 빛과 어둠을 나누게 하셨습니다
  alternatives_korean:
  - 빛과 어둠을 분리하게 하셨습니다
  - 빛에서 어둠을 구별하게 하셨습니다
  lexicon: source_note
  rationale: 영어 POB의 목적 부정사 흐름을 따라 ‘나누다/분리하다’ 중 성경적 표현이 자연스러운 ‘나누게 하다’를 택했습니다.
- source_word: ወወሀበ፡ እግዚአብሔር፡ ፀሐየ፡
  english_pob_choice: And God appointed the sun
  chosen_korean: 그리고 하나님께서는 해를 땅 위에 놓으셔서
  alternatives_korean:
  - 그리고 하나님께서는 해를 정하셔서
  - 그리고 하나님께서는 해를 세우셔서
  lexicon: source_note
  rationale: 여기서 ‘appointed’는 해를 시간 표지로 지정하신 행위를 가리키므로, 목적을 드러내는 ‘놓으셔서/두셔서’보다 ‘지정하셔서’가 가능하지만, 뒤의 ‘큰 표징’과의 결합을 살려 위치·표징 부여의 뉘앙스를 함께 담아 번역했습니다.
- source_word: ለትእምርት፡ ዐቢይ፡
  english_pob_choice: as a great sign
  chosen_korean: 큰 표징이 되게 하셨습니다
  alternatives_korean:
  - 큰 표징으로 삼으셨습니다
  - 큰 징조가 되게 하셨습니다
  lexicon: source_note
  rationale: ‘표징’은 단순 자연현상보다 하나님이 뜻을 드러내는 표지라는 기능을 보존하며, ‘큰’도 원문의 수식어를 그대로 반영합니다.
- source_word: ለመዋዕል፡ ወለሰንበታት፡ ወለ*አውራኅ፡ ወለበዓላት፡ ወለዓመታት፡ ወለሰንበታት፡ ዓመታት፡ ወለ*አዮቤልውሳት፡
  english_pob_choice: for days and for sabbaths and for months and for appointed times and for years and for sabbaths of years and for jubilees
  chosen_korean: 날들과 안식일들과 달들과 정해진 때들과 해들과 일곱째 해의 안식일들과 희년들과
  alternatives_korean:
  - 날들과 안식일들과 달들과 절기들과 해들과 해의 안식일들과 희년들과
  - 날들과 안식일들과 달들과 정한 때들과 해들과 안식년들과 희년들과
  lexicon: source_note
  rationale: 절기/정한 때의 구분은 전승별로 흔들리지만, 영어 POB의 audit를 따라 ‘appointed times’를 ‘정해진 때들’로, ‘sabbaths of years’를 ‘일곱째 해의 안식일들’로 보존했습니다.
theological_decisions:
- issue: 해의 역할을 단순 천문 설명이 아니라 창조 질서의 표징으로 제시하는 표현
  chosen_reading: 하나님께서는 해를 땅 위에 놓으셔서… 큰 표징이 되게 하셨습니다
  alternative_readings:
  - 하나님께서는 해를 정하셔서… 큰 표징으로 삼으셨습니다
  - 하나님께서는 해를 땅 위에 두셔서… 큰 징조가 되게 하셨습니다
  rationale: 이 구절은 해의 물리적 기능보다 시간과 절기의 질서를 드러내는 창조 신학을 강조하므로, 표징/징조의 기능을 분명히 살렸습니다.
  doctrine_reference: 창조 질서와 절기 표지에 대한 본문 고유의 신학
