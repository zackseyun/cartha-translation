base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/001.yaml
  text: 'And the angel of the presence said to Moses by the word of the LORD, saying, "Write the whole account of creation: how in six days the LORD God finished all his works and all that he created, and he rested on the seventh day and sanctified it for all ages, and appointed it as a sign for all."'
translation:
  language: ko
  text: 그리고 천사의 얼굴이 여호와의 말씀으로 모세에게 말하여 이르기를, "창조의 온갖 일을 기록하십시오. 여호와 하나님께서 엿새 동안 자기의 모든 일과 자기가 지으신 모든 것을 마치시고, 일곱째 날에 쉬시며 그것을 모든 시대를 위하여 거룩하게 하시고, 모든 이에게 표징으로 세우셨습니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ፡
  english_pob_choice: the angel of the presence
  chosen_korean: 천사의 얼굴
  alternatives_korean:
  - 임재의 천사
  - 임재 앞의 천사
  lexicon: Lex. proper phrase / source epithet
  rationale: Geez 표현은 직역하면 ‘얼굴의 천사’이며, POB 영어는 관용적으로 ‘the angel of the presence’로 옮겼습니다. 한국어에서는 소스의 이미지와 의미를 함께 살리기 위해 ‘천사의 얼굴’로 두었습니다.
- source_word: በቃለ፡ እግዚአብሔር፡
  english_pob_choice: by the word of the LORD
  chosen_korean: 여호와의 말씀으로
  alternatives_korean:
  - 주님의 말씀으로
  - 야훼의 말씀으로
  lexicon: Lex. divine speech formula
  rationale: 문맥상 모세에게 전달되는 신적 계시 공식이므로 ‘말씀으로’를 사용했고, 게에즈 본문의 고유명사 אלה와 대응하는 표준 프로젝트 용례에 따라 ‘여호와’를 택했습니다.
- source_word: ጸሐፍ፡ ኵሎ፡ ነገረ፡ ፍጥረት፡
  english_pob_choice: Write the whole account of creation
  chosen_korean: 창조의 온갖 일을 기록하십시오
  alternatives_korean:
  - 창조의 전체 기록을 쓰십시오
  - 창조의 온전한 이야기를 기록하십시오
  lexicon: Lex. imperative / narrative unit
  rationale: Geez의 ‘모든 창조의 일’은 단순한 ‘기록’보다 창조 서술 전체를 가리키므로, 자연스러운 한국어이면서 범위를 유지하도록 ‘창조의 온갖 일’을 선택했습니다.
- source_word: በስዱስ፡ ዕለት፡ ... ዕለት፡ ሳብዕት፡
  english_pob_choice: in six days ... on the seventh day
  chosen_korean: 엿새 동안 ... 일곱째 날에
  alternatives_korean:
  - 여섯 날 동안 ... 일곱째 날에
  - 6일 동안 ... 제7일에
  lexicon: Lex. temporal expression
  rationale: 서술의 흐름을 살리면서 표준적인 한국어 성경 어법에 맞게 ‘엿새 동안’과 ‘일곱째 날에’로 옮겼습니다.
- source_word: ወቀደሳ፡ ለኵሉ፡ ዓለማት፡ ወአንበራ፡ ትእምርተ፡ ለኵሉ፡
  english_pob_choice: and sanctified it for all ages, and appointed it as a sign for all
  chosen_korean: 그것을 모든 시대를 위하여 거룩하게 하시고, 모든 이에게 표징으로 세우셨습니다
  alternatives_korean:
  - 그것을 영원히 거룩하게 하시고, 모두에게 표징으로 정하셨습니다
  - 그것을 모든 세대를 위하여 거룩히 구별하시고, 모든 것의 표징으로 삼으셨습니다
  lexicon: Lex. sanctify / sign
  rationale: ‘거룩하게 하다’와 ‘표징’은 본문의 제의적·표지적 의미를 보존합니다. 마지막 ‘for all’은 POB 수정 취지에 따라 대상을 넓게 ‘모든 이에게’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: YHWH 표기
  chosen_reading: 본문의 እግዚአብሔር을 ‘여호와’로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 문맥은 구약적 하나님의 이름을 직접 가리키므로 프로젝트 기본 원칙에 따라 표준화된 예배어 대신 고유명 표기를 유지했습니다.
  doctrine_reference: 명칭 일관성 / 구약 신명 표기
- issue: 안식일 성별의 범위
  chosen_reading: ‘모든 시대를 위하여’와 ‘모든 이에게 표징’으로 옮겨, 안식일의 보편적·세대적 의미를 드러냈습니다.
  alternative_readings:
  - 모든 세대를 위하여
  - 영원히
  rationale: 본문은 안식일을 단지 한 민족의 관습이 아니라 시대를 관통하는 표징으로 제시하므로, 범위를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 창세기 2장 / 안식일 신학
