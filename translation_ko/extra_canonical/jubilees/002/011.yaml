  text: And on the fifth day he created the great sea monsters in the depths of the waters, for these were the first fleshly beings made by his hands, and every moving thing that moves in the waters, and everything that flies—
translation:
  language: ko
  text: 그리고 다섯째 날에 그는 물의 깊은 곳에서 큰 바다 괴물들을 창조하셨습니다. 이것들은 그의 손으로 지으신 첫 번째 살붙은 존재들이었고, 물속에서 움직이는 모든 것과 날아다니는 모든 것을 창조하셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃምስት / fifth day
  english_pob_choice: on the fifth day
  chosen_korean: 다섯째 날에
  alternatives_korean:
  - 다섯 날에
  - 제5일에
  lexicon: source temporal expression
  rationale: 게에즈 원문의 날짜 표현을 자연스러운 한국어 서술 순서로 옮기되, 창조 서술의 연속성을 살려 ‘다섯째 날에’로 간결하게 렌더링했습니다.
- source_word: አናብርት ዐበይተ
  english_pob_choice: the great sea monsters
  chosen_korean: 큰 바다 괴물들을
  alternatives_korean:
  - 큰 바다짐승들을
  - 큰 바다 생물들을
  lexicon: source noun phrase
  rationale: ‘great’와 바다의 거대한 생물을 가리키는 표현을 함께 살리되, 현대 한국어에서 신화적·창조론적 뉘앙스를 전달할 수 있는 ‘바다 괴물들’을 택했습니다.
- source_word: በአደዊሁ
  english_pob_choice: by his hands
  chosen_korean: 그의 손으로
  alternatives_korean:
  - 그의 손들로
  - 그의 손에 의해
  lexicon: agency expression
  rationale: 원문의 도구적 표현을 자연스럽게 살려 ‘그의 손으로’로 옮겼으며, 창조 행위의 직접성을 유지했습니다.
- source_word: ዘሥጋ ኖዓተ
  english_pob_choice: fleshly beings
  chosen_korean: 살붙은 존재들
  alternatives_korean:
  - 육체를 지닌 존재들
  - 살로 된 존재들
  lexicon: anthropological descriptor
  rationale: 직역적 ‘육신적’보다 원문의 물질성 대비를 더 분명히 드러내는 ‘살붙은’ 표현을 사용해, 이들이 최초의 물질적 생명체라는 점을 살렸습니다.
- source_word: ወኵሎ ዘይትነወስ ... ወኵሎ ዘይሰርር
  english_pob_choice: every moving thing that moves in the waters, and everything that flies
  chosen_korean: 물속에서 움직이는 모든 것과 날아다니는 모든 것
  alternatives_korean:
  - 물속에서 움직이는 모든 것과 날아다니는 모든 새
  - 물속에서 움직이는 모든 생물과 날아다니는 모든 것
  lexicon: participial clause
  rationale: 중복 동사 구조를 한국어의 평행 표현으로 옮겨 물속의 움직이는 것들과 공중을 나는 것들의 포괄성을 유지했습니다.
theological_decisions:
- issue: 창조 서술에서 ‘살붙은 존재들’의 의미
  chosen_reading: 이 표현을 단순한 생물학적 분류가 아니라, 이어지는 창조 질서 속에서 ‘첫 번째 육체적 존재들’이라는 대비적 강조로 이해해 한국어에서도 그 긴장을 살렸습니다.
  alternative_readings:
  - 단순히 ‘육신을 가진 존재들’로 완화
  - ‘동물들’로 일반화
  rationale: 문맥상 인간 이전의 최초 피조 생명체를 강조하는 서술이므로, 지나치게 일반화하면 본문의 창조론적 초점을 약화시킵니다.
  doctrine_reference: 창세기적 창조 서술의 피조 질서 강조
