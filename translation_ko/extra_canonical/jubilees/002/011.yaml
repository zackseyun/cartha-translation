  - severity: medium
    issue: ‘살붙은 존재들’의 현대어 자연성
    rationale: 의미는 짐작할 수 있으나 현대 표준어 성서 문체로는 어색합니다. ‘육체를 지닌 존재들’이 원문의 fleshly 의미를 더 명료하게 전달합니다.
  - severity: low
