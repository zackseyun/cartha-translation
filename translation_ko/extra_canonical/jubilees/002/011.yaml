  source_fidelity: 원문과 영어 감사본의 핵심 구조(다섯째 날, 물 깊은 곳의 큰 바다 생물, 손으로 지으신 최초의 육체적 존재, 물속에서 움직이는 것, 날아다니는 것)를 유지했습니다. 원문과 영어본이 대시로 끝나는 미완결 구절이므로 한국어도 이를 보존했습니다.
  naturalness: 초안의 ‘그는 … 창조하셨습니다’는 대명사와 높임말의 결합이 다소 어색하고, ‘살붙은 존재들’은 현대 표준어에서 다소 비문학적입니다. 주어를 생략하고 ‘육체를 지닌 존재들’로 고쳐 현대 합쇼체 문장으로 다듬었습니다.
  terminology: ‘큰 바다짐승들’은 성서적 문맥에서 ‘큰 바다 괴물들’보다 자연스럽고 불필요한 신화적 함의를 줄입니다. ‘육체를 지닌 존재들’은 fleshly beings의 물질적·육체적 대조를 보존합니다.
  issues:
