- from: 그리고 다섯째 날에 그는 물의 깊은 곳에서 큰 바다 괴물들을 창조하셨습니다. 이것들은 그의 손으로 지으신 첫 번째 살붙은 존재들이었고, 물속에서 움직이는 모든 것과 날아다니는 모든 것을 창조하셨습니다.[a][b]
  to: 다섯째 날에 그분께서는 물 깊은 곳에서 큰 바다짐승들을 창조하셨습니다. 이것들은 그분의 손으로 지으신 최초의 육체를 지닌 존재들이었으며, 물속에서 움직이는 모든 것과 날아다니는 모든 것을 창조하셨습니다—
  rationale: 존대 문체를 일관되게 하고, 어색하거나 과도하게 신화적인 어휘를 현대 성서 한국어에 맞게 조정했습니다. 또한 원문 및 영어 감사본의 끝맺지 않은 대시를 보존했으며, 제공되지 않은 내용을 가리키는 각주 표지는 삭제했습니다.
