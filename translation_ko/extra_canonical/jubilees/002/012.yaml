  language: ko
  text: 새와 그 종류들, 그리고 해가 그들 위에 떠올라 번성하게 하셨으며, 땅 위에 있는 모든 것과 땅에서 돋아나는 모든 것, 열매 맺는 모든 나무, 그리고 모든 육체 위에도 그러하셨습니다. 이 셋째 종류를 그는 다섯째 날에 만드셨습니다. 여섯째 날에는 땅의 모든 짐승과 모든 가축과 땅 위를 움직이는 모든 것을 만드셨습니다. 그리고 이 모든 뒤에 사람을 만드셨습니다. 남자와 여자를 그가 만드셨고, 땅 위와 바다 가운데 있는 모든 것과 날아다니는 모든 것과 짐승과 가축과 땅 위를 움직이는 모든 것과 온 땅 위의 모든 것에 대한 권위를 그들에게 주셨습니다. 이 모든 것 위에 그들에게 권위를 주셨습니다. 그리고 여섯째 날에 네 종류를 만드셨습니다. 그리고 모든 것은 스물두 종류였습니다. 그는 여섯째 날에 자기의 모든 일을 마치셨습니다. 하늘에 있는 것과 땅에 있는 것과 바다에 있는 것과 깊은 곳에 있는 것과 빛 가운데 있는 것과 어둠 가운데 있는 것과 모든 것에 있는 것을 모두 마치셨습니다. 그리고 우리에게 큰 표징인 안식일을 주셔서, 우리가 엿새 동안 일하고 일곱째 날에는 모든 일에서 쉬도록 하셨습니다. 그리고 임재의 천사들과 거룩하게 하는 천사들 — 이 두 큰 종류 — 에게 그분은 우리에게 말씀하셨습니다. "그와 함께 하늘과 땅에서 쉬자." 그리고 그분이 제게 말씀하셨습니다. "보라, 내가 모든 민족 가운데서 내 백성을 내게 위해 구별하리니, 그들은 안식일을 지킬 것이며, 내가 그들을 내 백성으로 삼아 나를 위해 거룩하게 하고 그들을 복 주리라. 내가 안식일을 거룩하게 한 것처럼, 나도 그들을 나를 위해 거룩하게 하고 복 주리니, 그들은 내 백성이 되고 나는 그들의 하나님이 되겠다. 그리고 나는 내가 본 모든 것 가운데서 야곱의 씨를 택하여 내 맏아들로 기록하였고, 그를 영원무궁토록 나를 위해 거룩하게 하였다. 또 그들이 모든 일에서 쉬도록 안식일을 그들에게 알게 하겠다." 그러므로 그가 일곱째 날에 우리와 함께 안식하며, 먹고 마시고 모든 것을 지으신 분을
    찬송하도록 표징을 세우셨습니다. 그분이 모든 민족 가운데서 소유로 삼으실 백성을 복 주시고 거룩하게 하신 것처럼, 그들도 우리와 함께 안식하게 하려 하신 것입니다. 그리고 그의 뜻은 모든 날마다 그 앞에 향기로운 냄새로 올라가게 하셨습니다. 아담부터 야곱까지 사람의 머리들이 스물두였고, 여섯째 날까지 이루어진 일의 종류도 스물두였습니다. 이것은 복되고 거룩하며, 이것도 복되고 거룩합니다. 이 하나와 저 하나는 거룩함을 위한 것이며 복을 위한 것입니다. 그리고 이 하나에게는 증언과 첫 율법에 따라, 일곱째 날에 거룩하게 되고 복을 받은 것처럼, 모든 날 동안 복되고 거룩하게 되도록 주어졌습니다. 그는 엿새 동안 하늘과 땅과 그가 만드신 모든 것을 창조하셨고, 하나님은 자기의 모든 일을 위하여 일곱째 날을 거룩하게 하셨습니다. 그러므로 그날에 관하여 그는 명령하셨습니다. 그날에 어떤 일을 하는 사람은 누구나 죽어야 하며, 그날을 더럽히는 자도 반드시 죽어야 합니다. 이스라엘 자손에게 명령하여 이 날을 지키게 하십시오. 그들이 이 날을 거룩하게 하고, 그날에 어떤 일도 하지 않으며, 그날을 더럽히지 않게 하십시오. 이 날은 모든 날보다 더 거룩하기 때문입니다. 그날을 더럽히는 자는 반드시 죽을 것이며, 그날에 어떤 일이나 하는 자는 영원히 반드시 죽을 것입니다. 이스라엘 자손이 대대로 이 날을 지키고 땅에서 뽑혀 나가지 않게 하려는 것입니다. 이는 거룩한 날이며 복된 날이기 때문입니다. 그리고 이 날을 지키며 자기의 모든 일에서 쉬는 사람은 우리와 같이 모든 날 동안 거룩하고 복되게 될 것입니다.[12]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕዋፈ / birds
  english_pob_choice: the birds
  chosen_korean: 새
  alternatives_korean:
  - 새들
  - 조류
  lexicon: standard
  rationale: 지혜문맥이 아닌 창조 서술이므로 자연스러운 현대어인 ‘새’로 두되, 군집을 문맥상 다음의 ‘그 종류들’이 보완합니다.
- source_word: ፀሐይ ላዕሌሆሙ ... ለጥዒና
  english_pob_choice: the sun rose over them for prosperity
  chosen_korean: 해가 그들 위에 떠올라 번성하게 하셨으며
  alternatives_korean:
  - 해가 그들 위에 떠올랐으며
  - 해가 그들 위에 떠올라 복되게 하셨으며
  lexicon: standard
  rationale: Geʽez의 ‘떠오르다/올라가다’와 번성의 효과를 함께 살려, POB의 ‘for prosperity’를 한국어 동사구로 풀었습니다.
- source_word: ወላዕለ ... ዘይሠርፅ፡ እምድር
  english_pob_choice: everything that sprouts from the earth ... everything that flies / creeps
  chosen_korean: 땅에서 돋아나는 모든 것 ... 날아다니는 모든 것
  alternatives_korean:
  - 땅에서 나는 모든 것
  - 땅에서 솟는 모든 것
  lexicon: standard
  rationale: 뒤의 ‘땅 위를 움직이는 모든 것’과 구별되게, 식물 생장을 ‘돋아나는’으로 옮겨 반복을 피했습니다.
- source_word: ዘይትነወስ ዲበ ምድር
  english_pob_choice: everything that moves upon the earth
  chosen_korean: 땅 위를 움직이는 모든 것
  alternatives_korean:
  - 땅 위를 기어다니는 모든 것
  - 땅 위를 다니는 모든 것
  lexicon: standard
  rationale: POB의 final revision history에서 이 표현이 별도 범주로 정리되므로, ‘기어다니는’으로 좁히지 않고 포괄적인 ‘움직이는’으로 두었습니다.
- source_word: ወአስለጦ ... ላዕለ ኵሉ ዘዲበ ምድር
  english_pob_choice: gave them authority over everything ...
  chosen_korean: 권위를 그들에게 주셨습니다
  alternatives_korean:
  - 주권을 그들에게 주셨습니다
  - 통치권을 그들에게 주셨습니다
  lexicon: standard
  rationale: 히브리적 통치 위임을 현대 한국어로 자연스럽게 드러내는 표준어로서 ‘권위’를 선택했습니다.
- source_word: ዕለተ ሰንበታት
  english_pob_choice: the sabbath day
  chosen_korean: 안식일
  alternatives_korean:
  - 안식의 날
  - 안식일의 날
  lexicon: standard
  rationale: 이 전승의 고정 용례를 따라 ‘안식일’로 옮기되, ‘큰 표징’과 함께 서술하여 단순 관습어가 아니라 창조 표징임을 살렸습니다.
theological_decisions:
- issue: 안식일의 언약적 지위와 형벌 언어
  chosen_reading: 안식일은 ‘큰 표징’이며, 그것을 더럽히는 자에 대한 죽음 선고를 그대로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘엄중한 경고’로 낮추는 번역
  - ‘반드시 죽는다’를 약화시켜 도덕적 경고로 일반화하는 번역
  rationale: 본문은 안식일을 단순한 휴식 규범이 아니라 거룩한 표징과 언약적 분리의 기준으로 제시하므로, 형벌 표현을 약화하지 않았습니다.
  doctrine_reference: 창 2:3의 안식일 거룩성; 제2성전 문헌의 언약 표징 읽기
- issue: ‘내 백성, 그들의 하나님’ 서술의 직접성
  chosen_reading: 하나님께서 ‘그들은 내 백성이 되고 나는 그들의 하나님이 되겠다’고 직접 말씀하시는 형태를 유지했습니다.
  alternative_readings:
  - 서술형으로 돌려 간접화하는 번역
  - ‘우리의 하나님’으로 공동체적 화자를 앞세우는 번역
  rationale: 인용문 안의 1인칭-3인칭 언약 공식을 직접 보존해야, 선택과 성화의 신학적 긴장이 흐려지지 않습니다.
  doctrine_reference: 출 6:7; 렘 31:33의 언약 공식
