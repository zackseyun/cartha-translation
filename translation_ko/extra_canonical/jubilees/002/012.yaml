  language: ko
  text: 새와 그 모든 종류였습니다. 해가 그들 위에 떠올라 번성하게 하셨고, 땅 위에 있는 모든 것, 땅에서 돋아나는 모든 것, 열매 맺는 모든 나무, 그리고 모든 육체 위에도 그러하셨습니다. 그분은 이 세 종류를 다섯째 날에 만드셨습니다. 여섯째 날에는 땅의 모든 짐승과 모든 가축과 땅 위에서 움직이는 모든 것을 만드셨습니다. 이 모든 것 뒤에 사람을 만드셨습니다. 남자와 여자로 그들을 만드셨고, 땅 위에 있는 모든 것과 바다에 있는 모든 것과 날아다니는 모든 것과 짐승과 가축과 땅 위에서 움직이는 모든 것과 온 땅에 대한 권위를 그들에게 주셨습니다. 이 모든 것 위에 그들에게 권위를 주셨습니다. 여섯째 날에 네 종류를 만드셨습니다. 모두 스물두 종류였습니다. 그분은 여섯째 날에 모든 일을 마치셨습니다. 곧 하늘과 땅과 바다와 깊은 곳과 빛과 어둠과 그 모든 것 안에 있는 모든 일을 마치셨습니다. 그리고 우리에게 큰 표징, 곧 안식일을 주셔서 우리가 엿새 동안 일하고 일곱째 날에는 모든 일에서 쉬게 하셨습니다. 임재의 모든 천사들과 거룩함의 모든 천사들, 이 두 큰 부류에게 그분은 말씀하셨습니다. “그와 함께 하늘과 땅에서 쉬자.” 또 그분이 제게 말씀하셨습니다. “보라, 내가 모든 민족 가운데서 한 백성을 나를 위하여 구별하겠다. 그들은 안식일을 지킬 것이며, 내가 그들을 나를 위한 내 백성으로 거룩하게 하고 그들에게 복을 주겠다. 내가 안식일을 거룩하게 한 것처럼, 나도 그들을 나를 위하여 거룩하게 하고 그들에게 복을 주겠다. 그들은 내 백성이 되고, 나는 그들의 하나님이 되겠다. 나는 내가 본 모든 것 가운데서 야곱의 씨를 택하고 그를 내 맏아들로 기록하였으며, 그를 나를 위하여 영원무궁토록 거룩하게 하였다. 또 그들이 모든 일에서 쉬도록 안식일을 그들에게 알게 하겠다.” 이와 같이 그분은 그들이 일곱째 날에 우리와 함께 안식하고, 먹고 마시며 모든 것을 창조하신 분을 찬송하게 하시려고 표징을 세우셨습니다. 그분은 모든 민족 가운데서 자신의 소유로
    삼으실 백성을 복 주시고 거룩하게 하신 것처럼, 그들도 우리와 함께 안식하게 하셨습니다. 또 그분은 자신의 뜻이 모든 날 동안 그 앞에 받아들여지는 향기로운 냄새처럼 올라가게 하셨습니다. 아담부터 야곱까지 사람의 우두머리는 스물두 명이었고, 일곱째 날까지 이루어진 일의 종류도 스물두 가지였습니다. 이것은 복되고 거룩하며, 저것도 복되고 거룩합니다. 이 하나와 저 하나는 거룩함과 복을 위한 것이었습니다. 또 이 하나에게는 증언과 첫 율법에 따라, 일곱째 날에 거룩하게 되고 복을 받은 것처럼 모든 날 동안 복되고 거룩하게 될 것이 주어졌습니다. 그분은 엿새 동안 하늘과 땅과 그가 창조하신 모든 것을 창조하셨고, 하나님은 자신의 모든 일을 위하여 일곱째 날을 거룩하게 하셨습니다. 그러므로 그분은 그날에 관하여 명령하셨습니다. 그날에 어떤 일이든 하는 사람은 죽어야 하며, 그날을 더럽히는 자는 반드시 죽어야 합니다. 이스라엘 자손에게 명령하십시오. 그들이 이 날을 지켜 거룩하게 하고, 그날에 어떤 일도 하지 않으며, 그날을 더럽히지 않게 하십시오. 이 날은 모든 날보다 더 거룩하기 때문입니다. 그날을 속되게 하는 자는 반드시 죽을 것이며, 그날에 어떤 일이든 하는 자는 영원히 반드시 죽을 것입니다. 이는 이스라엘 자손이 대대로 이 날을 지키고 땅에서 뽑혀 나가지 않게 하려는 것입니다. 이 날은 거룩한 날이며 복된 날이기 때문입니다. 이 날을 지키고 자기의 모든 일에서 쉬는 사람은 우리와 같이 모든 날 동안 거룩하고 복되게 될 것입니다.[12]
