theological_decisions:
- issue: 해와 달과 별의 기능을 창조 질서 안에서 서술하는 방식
  chosen_reading: 본문은 천체를 단순한 표지가 아니라, 빛과 어둠을 구별하고 땅의 생장을 돕도록 하나님이 정하신 질서의 일부로 제시합니다.
  alternative_readings:
  - 천체를 단지 시간 표지로만 이해함
  - '''번성''을 일반적 성공 개념으로 축소함'
  rationale: 게에즈 원문과 영문 POB 모두 천체의 유익한 작용을 강조하므로, 이를 창조의 목적론적 배열로 반영했습니다.
  doctrine_reference: 창세기 1장 창조 질서, 해·달·별의 기능에 대한 성경적 이해
- issue: ‘번성’의 범위
  chosen_reading: 여기서의 번성은 땅의 생명과 농작물의 자람을 살리는 유익한 작용을 가리킵니다.
  alternative_readings:
  - 육체 치유의 의미로 제한
  - 부와 성공의 번영으로 일반화
  rationale: 영문 각주가 'healing'과 'making flourish'의 가능성을 열어 두지만, 문맥상 식생의 번성에 초점을 두는 것이 가장 직접적입니다.
  doctrine_reference: 창조 세계에 대한 하나님의 선한 섭리
