  text: And it separates between light and darkness[10], and for prosperity, so that everything that sprouts and grows on the earth may prosper. These three kinds he made on the fourth day.
  footnotes:
  - marker: '10'
    text: The clause rendered 'for prosperity' may also be understood as 'for healing' or 'for making flourish,' referring to the beneficial effect of the heavenly lights on earthly growth.
    reason: lexical_alternative
  - marker: a
    text: Or 'between the midst of the light and the midst of the darkness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그것은 빛과 어둠 사이를 나누며, 번성하게 하려고, 땅 위에서 싹트고 자라는 모든 것이 번성하도록 하셨습니다. 이 세 종류를 넷째 날에 만드셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይፈሊጥ፡ ማእከለ፡ ብርሃን፡ ወማእከለ፡ ጽልመት፡
  english_pob_choice: it separates between light and darkness
  chosen_korean: 빛과 어둠 사이를 나누며
  alternatives_korean:
  - 빛과 어둠을 가르며
  - 빛과 어둠의 중간 사이를 나누며
  lexicon: 나누다 / 사이
  rationale: 게에즈의 'māʾekala ... wa-māʾekala ...'는 'A와 B 사이'의 관용구로 기능하므로, 원문의 대비를 살리되 자연스러운 한국어로 옮겼습니다.
- source_word: ወለ*ጠዐዮ፡ *ከመ፡ ይጥዐይ፡
  english_pob_choice: for prosperity
  chosen_korean: 번성하게 하려고
  alternatives_korean:
  - 번영을 위해
  - 잘되게 하려고
  - 번성하도록
  lexicon: 번성하다
  rationale: 영문 POB의 각주가 시사하듯 이 구절은 단순한 물질적 성공보다 생장과 유익을 돕는 효과를 가리키므로, 식물성장 문맥에 맞게 '번성'으로 풀었습니다.
- source_word: ኵሉ፡ ዘይሠርፅ፡ ወይለቍፅ፡ ዲበ፡ ምድር፤
  english_pob_choice: everything that sprouts and grows on the earth
  chosen_korean: 땅 위에서 싹트고 자라는 모든 것
  alternatives_korean:
  - 땅에서 돋아나고 자라는 모든 것
  - 땅 위에서 싹이 나고 자라는 모든 것
  lexicon: 싹트다 / 자라다
  rationale: 두 동사를 중복해 식생의 시작과 성장 모두를 살렸으며, '땅 위에서'로 장소를 분명히 하여 원문의 지시를 유지했습니다.
theological_decisions:
- issue: 해와 달과 별의 기능을 창조 질서 안에서 서술하는 방식
  chosen_reading: 본문은 천체를 단순한 표지가 아니라, 빛과 어둠을 구별하고 땅의 생장을 돕도록 하나님이 정하신 질서의 일부로 제시합니다.
  alternative_readings:
  - 천체를 단지 시간 표지로만 이해함
  - '''번성''을 일반적 성공 개념으로 축소함'
  rationale: 게에즈 원문과 영문 POB 모두 천체의 유익한 작용을 강조하므로, 이를 창조의 목적론적 배열로 반영했습니다.
  doctrine_reference: 창세기 1장 창조 질서, 해·달·별의 기능에 대한 성경적 이해
- issue: ‘번성’의 범위
  chosen_reading: 여기서의 번성은 땅의 생명과 농작물의 자람을 살리는 유익한 작용을 가리킵니다.
  alternative_readings:
  - 육체 치유의 의미로 제한
  - 부와 성공의 번영으로 일반화
  rationale: 영문 각주가 'healing'과 'making flourish'의 가능성을 열어 두지만, 문맥상 식생의 번성에 초점을 두는 것이 가장 직접적입니다.
  doctrine_reference: 창조 세계에 대한 하나님의 선한 섭리
