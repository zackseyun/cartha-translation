- from: 그리고 그것은 빛과 어둠 사이를 나누며, 번성하게 하려고, 땅 위에서 싹트고 자라는 모든 것이 번성하도록 하셨습니다. 이 세 종류를 넷째 날에 만드셨습니다.[a]
