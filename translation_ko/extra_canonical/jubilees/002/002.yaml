base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/002.yaml
  text: 'For on the first day he created the heavens above and the earth and the waters and all the spirits that minister before him: the angels of the presence[2], and the angels of sanctification, and the angels of the spirit of fire, and the angels of the spirit of clouds, and of darkness, and of snow and hail and frost, and the angels of the voices and thunder and lightning, and the angels of the spirits of cold and heat and winter and spring and harvest and summer, and all the spirits of his works that are in the heavens and on the earth and in the seas and in the depths and in darkness and in night and in light and in dawn and in morning, which he prepared in the knowledge of his heart.'
  footnotes:
  - marker: '2'
    text: The list of created angelic and elemental spirits is textually dense and may reflect some local corruption or compression in the Ethiopic tradition. The translation stays close to the sequence rather than smoothing the catalog.
    reason: segmentation_note
  - marker: a
    text: Or 'and in evening'.
    reason: previous_rendering
  - marker: b
    text: Or 'and in darkness and in light'.
    reason: previous_rendering
  - marker: c
    text: Or 'purpose of his heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 첫째 날에 그분께서는 위에 있는 하늘들과 땅과 물들과, 그분 앞에서 섬기는 모든 영들을 창조하셨습니다. 곧 임재의 천사들[2], 성결의 천사들, 불의 영들을 맡은 천사들, 구름의 영들을 맡은 천사들, 어둠과 눈과 우박과 서리의 영들을 맡은 천사들, 소리와 천둥과 번개를 맡은 천사들, 그리고 추위와 더위와 겨울과 봄과 추수와 여름의 영들을 맡은 천사들, 또 하늘과 땅과 바다와 깊음과 어둠과 밤과 빛과 새벽과 아침에 있는 그분의 모든 일의 영들을 창조하셨습니다. 이 모든 것을 그분께서는 마음의 지식으로 마련하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '2'
    text: 창조된 천사들과 자연 현상의 영들을 나열하는 이 목록은 에티오피아어 전승에서 문장 구획이 매우 빽빽하며, 일부 구절은 전승상 압축되었거나 손상되었을 가능성이 있습니다. 번역은 목록을 매끈하게 재구성하지 않고 그 순서를 가능한 한 따랐습니다.
    reason: segmentation_note
