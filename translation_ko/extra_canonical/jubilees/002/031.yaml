  yaml_path: translation/extra_canonical/jubilees/002/031.yaml
  text: And the Creator of all blessed it[31], but he did not sanctify all peoples and nations to keep sabbath on it; Israel alone—to it alone he granted to eat and drink and keep sabbath on it upon the earth.
  footnotes:
  - marker: '31'
    text: The text states that the Creator blessed the day but did not sanctify all peoples and nations to keep Sabbath on it; Israel alone receives that sanctified earthly observance. This is a theological claim of election in sacred time, not merely an ethnic aside.
    reason: cross_reference
  - marker: a
    text: Or 'he gave to eat and drink'.
    reason: previous_rendering
translation:
  language: ko
  text: 만물의 창조주께서는 그것을 복되게 하셨습니다.[31] 그러나 그분께서는 모든 백성과 민족이 그 날에 안식일을 지키도록 거룩하게 하시지는 않았습니다. 오직 이스라엘에게만 땅에서 그 날에 먹고 마시며 안식일을 지키도록 허락하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '31'
    text: 본문은 창조주께서 그 날을 복되게 하셨으나, 모든 백성과 민족을 그 날에 안식일을 지키도록 거룩하게 하시지는 않았다고 말합니다. 이스라엘만이 땅에서 그 거룩한 준수를 받습니다. 이는 단순한 민족적 덧붙임이 아니라 성스러운 시간에서의 선택에 관한 신학적 주장입니다.
    reason: cross_reference
  - marker: a
    text: 또는 “먹고 마시도록 주셨습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: ባረከ
  english_pob_choice: blessed
  chosen_korean: 복되게 하셨습니다
  alternatives_korean:
  - 복 주셨습니다
  - 축복하셨습니다
  lexicon: barak
  rationale: 창조주가 절기를 ‘복되게’ 하셨다는 시간의 축복 의미를 살리되, 단순한 종교적 인사말처럼 좁아지지 않도록 했습니다.
- source_word: ወአቀደሰ
  english_pob_choice: did not sanctify
  chosen_korean: 거룩하게 하시지는 않았습니다
  alternatives_korean:
  - 성별하지 않으셨습니다
  - 성화하지 않으셨습니다
  lexicon: qaddes
  rationale: ‘거룩하게 하다’는 성별·봉헌의 의미를 가장 직접적으로 드러내며, 안식일 준수의 특권이 모든 민족에게 동일하게 주어진 것이 아님을 분명히 합니다.
- source_word: ይብላዕ / ይስተይ
  english_pob_choice: to eat and drink
  chosen_korean: 먹고 마시며
  alternatives_korean:
  - 먹고 마시도록
  - 먹고 마실 수 있도록
  lexicon: akal / sheti
  rationale: 게으른 직역을 피하면서도 축제적 안식일의 실제 행위를 자연스럽게 드러내는 기본 표현으로 옮겼습니다.
- source_word: ባሕቲቱ / ለባሕቲቱ
  english_pob_choice: Israel alone—to it alone
  chosen_korean: 이스라엘만—그들에게만
  alternatives_korean:
  - 이스라엘만—그에게만
  - 오직 이스라엘에게만
  lexicon: bäḥtitu
  rationale: 반복되는 ‘오직/홀로’의 배타성을 한국어에서도 분명히 살리되, 공동체적 대상인 이스라엘을 자연스럽게 받도록 했습니다.
theological_decisions:
- issue: 안식일의 선택성과 언약적 특권
  chosen_reading: 모든 민족에게 동일한 거룩한 안식일 의무가 주어진 것이 아니라, 이스라엘에게만 그 거룩한 안식일을 누리도록 허락된 것으로 옮겼습니다.
  alternative_readings:
  - 모든 민족이 제외되었다는 단순 민족 구분
  - 이스라엘의 사회적 관습만을 말하는 것으로 완화
  rationale: 본문과 영어 POB의 audit note가 강조하듯, 이는 단순한 민족적 언급이 아니라 성스러운 시간에 대한 선택과 부여의 진술입니다.
  doctrine_reference: 언약, 선택, 거룩한 시간의 구별
