revisions:
- from: 만물의 창조주께서 그것을 복되게 하셨습니다. 그러나 그분은 모든 백성과 민족을 그것 위에서 안식일을 지키도록 거룩하게 하시지는 않았습니다. 이스라엘만—그들에게만—그 위에서 먹고 마시며 안식일을 지키도록 허락하셨습니다.[31][a]
  to: 만물의 창조주께서는 그것을 복되게 하셨습니다.[31] 그러나 그분께서는 모든 백성과 민족이 그 날에 안식일을 지키도록 거룩하게 하시지는 않았습니다. 오직 이스라엘에게만 땅에서 그 날에 먹고 마시며 안식일을 지키도록 허락하셨습니다.[a]
  rationale: 원문의 ‘땅에서’를 복원하고, 안식일을 가리키는 시간 표현을 ‘그 날에’로 명료하게 했습니다. 또한 이스라엘에 대한 반복적 배타성은 ‘오직 이스라엘에게만’으로 자연스럽게 유지했으며, 두 각주 표지를 각각의 해당 표현으로 옮겼습니다.
