  lexicon: 분류어
  rationale: 열거된 항목들을 넷의 큰 묶음으로 요약한 문맥을 반영해, ‘종류’로 범주적 의미를 유지했습니다.
theological_decisions:
- issue: 창조 기사에서 열거된 항목을 압축 요약하는 ‘네 가지 큰 종류’의 해석
  chosen_reading: 본문의 압축된 분류를 그대로 살려, 세부 항목을 모두 나열한 뒤 마지막에 요약문을 붙였습니다.
  alternative_readings:
  - 요약문을 생략하고 항목만 길게 나열
  - ‘네 가지 큰 종류’를 항목 각각에 분배
  rationale: 게에즈 본문과 영어 주석은 이 표현이 모든 항목을 개별 분류한 것이 아니라 묶음 요약임을 보여 주므로, 독자가 압축 구조를 보게 하는 것이 가장 충실합니다.
  doctrine_reference: 창조 질서의 선함과 구조성
- issue: 에덴의 동산과 ‘낙원’의 관계
  chosen_reading: ‘에덴의 동산, 곧 에덴 가운데 있는 낙원’으로 병기했습니다.
  alternative_readings:
  - ‘에덴의 낙원’으로 단순화
  - ‘기쁨을 위한 동산’으로 직역
  rationale: 원문의 목적어적 뉘앙스(‘for delight’)와 고유명사적 구조를 함께 보존해, 에덴 동산을 단순 지리명으로 축소하지 않도록 했습니다.
  doctrine_reference: 에덴-낙원 전통의 서술 보존
