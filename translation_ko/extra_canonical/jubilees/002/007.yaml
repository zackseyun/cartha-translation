translation:
  language: ko
  text: 그날에 그는 물 위의 모든 근원과 산에 있는 모든 물의 모임과 온 땅에 있는 모든 물의 모임, 그리고 온 땅의 이슬과 씨를 뿌리는 씨앗과 싹트는 모든 것과 열매 맺는 나무와 숲과 에덴의 동산, 곧 에덴 가운데 있는 낙원을 만들었습니다. 이 네 가지 큰 종류를 셋째 날에 만드셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ*አስተርአየ፡ የብስ።
  english_pob_choice: and the dry land appeared
  chosen_korean: 물이 드러나게 하다 / 마른 땅이 나타나다
  alternatives_korean:
  - 마른 땅이 나타났습니다
  - 땅이 드러났습니다
  lexicon: 표현 대응
  rationale: 지면이 물에서 드러나는 장면을 자연스럽게 살리되, 창조 기사 특유의 수동적 출현을 유지했습니다.
- source_word: ምጉባኢሆሙ ለማያት
  english_pob_choice: the gatherings of the waters
  chosen_korean: 물의 모임
  alternatives_korean:
  - 물의 집합
  - 물의 모아짐
  lexicon: 집합/모임
  rationale: ‘모임’은 물이 구획되어 모인 상태를 비교적 직역하면서도 한국어로 읽히는 형태로 옮깁니다.
- source_word: ወአማተ
  english_pob_choice: woods
  chosen_korean: 숲
  alternatives_korean:
  - 나무숲
  - 삼림
  lexicon: 자연물
  rationale: 누락된 항목인 ‘woods/forests’를 별도로 살려, 나무와는 구분되는 목질 지형 요소를 드러냈습니다.
- source_word: በኤዶም ለ*ተድላ
  english_pob_choice: in Eden for delight
  chosen_korean: 에덴의 동산, 곧 에덴 가운데 있는 낙원
  alternatives_korean:
  - 에덴에서 기쁨을 위한 동산
  - 에덴의 즐거움을 위한 동산
  lexicon: 고유명사/의미
  rationale: ‘for delight’의 목적성은 ‘낙원’으로 축약해 살리되, 에덴 안의 위치를 덧붙여 문맥을 보존했습니다.
- source_word: አርባዕተ ዘንተ ዐበይተ ትውልደ
  english_pob_choice: all these four great kinds
  chosen_korean: 이 네 가지 큰 종류
  alternatives_korean:
  - 이 네 가지 큰 부류
  - 이 네 가지 큰 범주
  lexicon: 분류어
  rationale: 열거된 항목들을 넷의 큰 묶음으로 요약한 문맥을 반영해, ‘종류’로 범주적 의미를 유지했습니다.
theological_decisions:
- issue: 창조 기사에서 열거된 항목을 압축 요약하는 ‘네 가지 큰 종류’의 해석
  chosen_reading: 본문의 압축된 분류를 그대로 살려, 세부 항목을 모두 나열한 뒤 마지막에 요약문을 붙였습니다.
  alternative_readings:
  - 요약문을 생략하고 항목만 길게 나열
  - ‘네 가지 큰 종류’를 항목 각각에 분배
  rationale: 게에즈 본문과 영어 주석은 이 표현이 모든 항목을 개별 분류한 것이 아니라 묶음 요약임을 보여 주므로, 독자가 압축 구조를 보게 하는 것이 가장 충실합니다.
  doctrine_reference: 창조 질서의 선함과 구조성
- issue: 에덴의 동산과 ‘낙원’의 관계
  chosen_reading: ‘에덴의 동산, 곧 에덴 가운데 있는 낙원’으로 병기했습니다.
  alternative_readings:
  - ‘에덴의 낙원’으로 단순화
  - ‘기쁨을 위한 동산’으로 직역
  rationale: 원문의 목적어적 뉘앙스(‘for delight’)와 고유명사적 구조를 함께 보존해, 에덴 동산을 단순 지리명으로 축소하지 않도록 했습니다.
  doctrine_reference: 에덴-낙원 전통의 서술 보존
