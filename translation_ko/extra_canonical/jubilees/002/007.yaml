translation:
  language: ko
  text: 궁창 밖의 한 곳이 있었고,[7] 마른 땅이 나타났습니다. 그날에 그는 그곳에 각기 모인 모든 바다와 모든 강과, 산들과 온 땅에 있는 물의 모든 모임과, 모든 호수와 땅의 모든 이슬과, 뿌려지는 씨와 싹트는 모든 것과 열매 맺는 나무와 숲과, 에덴에 있는 기쁨의 동산을 만드셨습니다. 이 모든 네 가지 큰 부류를 그는 셋째 날에 만드셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '7'
    text: ‘이 모든 네 가지 큰 부류’라는 표현은 지형 요소, 식물, 에덴 동산을 압축하여 열거하므로 이해하기 어렵습니다. 이 수는 열거된 모든 항목을 각각 세는 수라기보다, 몇 개의 묶음으로 요약하는 것으로 보입니다.
    reason: 영어 POB의 분절 주석을 보존하고, 본문의 압축된 분류 및 수사의 불확실성을 설명합니다.
