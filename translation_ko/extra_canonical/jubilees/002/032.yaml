translation:
  language: ko
  text: 그 위에, 곧 땅 위에였습니다. 그리고 만물의 창조주께서, 복과 거룩함을 위해 자신이 지으신 이 날을 복 주셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባቲ፡ በ''ዲበ፡ ምድር።
  english_pob_choice: on it upon the earth.
  chosen_korean: “그 위에, 곧 땅 위에였습니다.”
  alternatives_korean:
  - “땅 위에 있었습니다.”
  - “그것 위에, 땅 위에였습니다.”
  lexicon: source phrase opening clause
  rationale: Ge‘ez의 첫 구절은 위치를 먼저 제시하는 짧은 도입구이므로, 한국어에서도 서술을 생략하지 않고 ‘그 위에, 곧 땅 위에’로 살려 앞 문맥의 대상을 가리키게 했습니다.
- source_word: ወባረካ፡ ፈጣሪ፡ ኵሉ፡
  english_pob_choice: And the Creator of all blessed it
  chosen_korean: “만물의 창조주께서 … 복 주셨습니다”
  alternatives_korean:
  - “만물을 창조하신 분께서 … 축복하셨습니다”
  - “만물의 창조주께서 … 복을 주셨습니다”
  lexicon: creator of all
  rationale: ‘ፈጣሪ ኵሉ’는 직역상 ‘만물의 창조주’가 가장 투명하며, 동사는 성경적 한국어의 ‘복 주다’를 사용해 축복 행위를 분명히 했습니다.
- source_word: ዘፈጠረ፡ *ዛተ፡ ዕለተ፡" ለበረከት፡ ወለቅድሳት፡
  english_pob_choice: he who created this day for blessing and holiness
  chosen_korean: “복과 거룩함을 위해 자신이 지으신 이 날”
  alternatives_korean:
  - “복과 거룩함을 위해 그가 창조하신 이 날”
  - “복과 거룩함을 위해 만드신 이 날”
  lexicon: created / blessing / holiness
  rationale: 관계절의 주어를 분명히 하되, ‘지으신’으로 창조 행위를 유지하고 ‘복’과 ‘거룩함’을 병렬로 살려 목적구를 그대로 드러냈습니다.
theological_decisions:
- issue: The day is blessed as a created reality, not merely described as blessed in a general sense.
  chosen_reading: ‘이 날을 복 주셨습니다’와 ‘복과 거룩함을 위해 자신이 지으신 이 날’을 함께 두어, 창조된 날 자체가 축복과 거룩함의 대상으로 구별되었음을 드러냈습니다.
  alternative_readings:
  - “이 날이 복과 거룩함을 위해 지어졌습니다”
  - “이 날을 복 주셨습니다, 곧 복과 거룩함을 위해 지으신 날입니다”
  rationale: Ge‘ez 문장은 ‘복 주다’와 ‘복과 거룩함을 위해 지으신’ 두 요소를 함께 갖고 있으므로, 둘 중 하나를 지우지 않고 병렬로 보존하는 것이 원문 의미를 가장 잘 전달합니다.
  doctrine_reference: 창조 질서와 날의 성별(창 2:3; 출 20:11과의 주제적 연관)
