  text: 그것 위에, 곧 땅 위에. 그리고 만물의 창조주께서 그것을 복을 주셨습니다. 곧 복과 거룩함을 위하여 이 날을 지으신 분이십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “만물의 창조주께서 복과 거룩함을 위하여 자신이 지으신 이 날을 복을 주셨습니다.”
    reason: 영어 POB 감사 기록에 보존된 대안적 구문, 즉 ‘그것’을 ‘이 날’과 직접 결부하는 해석을 제시합니다. 본문은 원문의 대명사 목적어와 관계절을 구별하여 보존합니다.
lexical_decisions:
- source_word: ባቲ፡ በ''ዲበ፡ ምድር።
  english_pob_choice: on it upon the earth.
  chosen_korean: “그 위에, 곧 땅 위에였습니다.”
