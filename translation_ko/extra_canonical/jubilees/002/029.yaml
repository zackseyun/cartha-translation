base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/029.yaml
  text: 'Likewise declare and say to the children of Israel the law of this day: that they are to keep sabbath on it, and that they are not to forsake it in the error of their hearts so as to do any work on it that is not fitting, or to do on it their own pleasure, or to prepare on it anything to be eaten or drunk, or to draw water, or to bring in or take out through their gates any burden that they had not prepared for themselves on the sixth day.'
  footnotes:
  - marker: a
    text: Or 'prepared for themselves in their dwellings on the sixth day.'.
    reason: previous_rendering
  - marker: b
    text: Or 'And declare and say'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이[b] 이스라엘 자손에게 이 날의 율법을 선포하여 말하십시오. 그들이 이 날에 안식일을 지키고, 마음의 잘못으로 이 날을 저버려 이 날에 합당하지 않은 어떤 일도 하지 않으며, 이 날에 자기들의 뜻대로 행하지 않으며, 먹거나 마실 것은 무엇이든 준비하지 않으며, 물을 긷지 않으며, 여섯째 날에 자신들을 위해 미리 준비해 두지 않은 어떤 짐도[a] 그들의 문들을 통해 들여오거나 내어가지 않게 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여섯째 날에 자신들을 위해 그들의 거처에서 미리 준비해 두지 않은 어떤 짐도’로 옮길 수 있습니다.
    reason: 이전 번역 전통에는 ‘그들의 거처에서’라는 독법이 있으나, 제시된 게에즈 본문에는 그 말이 없으므로 본문에는 넣지 않고 대안으로만 제시합니다.
  - marker: b
    text: 또는 ‘그리고 선포하여 말하십시오’.
    reason: 게에즈어 ከማሁ는 ‘이와 같이’로 이해하는 것이 우선이나, 접속사적으로 옮긴 이전 번역 전통을 반영한 대안입니다.
lexical_decisions:
- source_word: ከማሁ
  english_pob_choice: Likewise declare and say
  chosen_korean: 이와 같이 … 선포하고 말하십시오
  alternatives_korean:
  - 또한 … 선포하고 말하십시오
  - 그리고 … 선포하고 말하십시오
  lexicon: Ge'ez ከማሁ
  rationale: 본문의 ከማሁ는 단순 접속이 아니라 ‘이와 같이/그와 같이’의 부사적 연결이므로, 영어 POB의 수정된 의미를 따라 ‘이와 같이’로 옮겼습니다.
- source_word: ዘኢይከውን
  english_pob_choice: that is not fitting
  chosen_korean: 합당하지 않은
  alternatives_korean:
  - 어울리지 않는
  - 마땅하지 않은
  lexicon: Geez verbal adjective/relative construction
  rationale: 행위의 도덕적·규범적 부적합을 가리키므로, 자연스러운 현대 한국어로 ‘합당하지 않은’이 가장 직접적입니다.
- source_word: በስሕተት ልቦሙ
  english_pob_choice: in the error of their hearts
  chosen_korean: 마음의 오류에 빠져
  alternatives_korean:
  - 마음의 잘못 속에서
  - 마음의 미혹에 빠져
  lexicon: Ge'ez phrase ስሕተት + ልብ
  rationale: 직역하면 ‘그들의 마음의 오류’이지만, 한국어에서는 상태·원인을 드러내는 ‘~에 빠져’가 의미를 더 분명히 전달합니다.
- source_word: በአናቅጺሆሙ
  english_pob_choice: through their gates
  chosen_korean: 성문들을 통해
  alternatives_korean:
  - 그들의 문들을 통해
  - 성문으로
  lexicon: Ge'ez noun for gates/doorways
  rationale: 문맥상 공동체의 출입 통로를 가리키므로 ‘성문들’로 옮기되, 복수성을 살려 ‘들을’을 유지했습니다.
theological_decisions:
- issue: 안식 준수의 범위와 금지 항목의 열거
  chosen_reading: 이 절은 안식일을 ‘지키는’ 적극적 준수와, 일·사사로운 뜻·사전 준비 없는 운반을 함께 금하는 규범을 제시합니다.
  alternative_readings:
  - 단순한 휴식 권고
  - 예배적 휴일 준수
  rationale: 게에즈 원문은 안식의 보존뿐 아니라 노동, 사적 기쁨의 추구, 운반 행위를 구체적으로 금지하므로, 이를 흐리지 않고 모두 드러내야 합니다.
  doctrine_reference: Jubilees 2:29; 창 2:2-3 배경의 안식일 규정
