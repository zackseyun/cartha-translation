translation:
  language: ko
  text: 물이 그대로 그렇게 행하였으며, 그가 그들에게 말한 대로 하였고, 땅의 פני에서 물러났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገብሩ፡ ከማሁ፡
  english_pob_choice: And the waters did so
  chosen_korean: 물이 그대로 그렇게 행하였으며
  alternatives_korean:
  - 물이 그렇게 하였습니다
  - 물들이 그렇게 하였습니다
  lexicon: source_note
  rationale: 게으즈 원문의 주어는 복수의 물이며, 동사구는 ‘그렇게 행하다/그대로 따르다’의 뜻이므로 자연스러운 한국어로 그 대응을 살렸습니다.
- source_word: ይቤሎሙ
  english_pob_choice: just as he told them
  chosen_korean: 그가 그들에게 말한 대로
  alternatives_korean:
  - 그가 그들에게 이르신 대로
  - 그가 그들에게 명한 대로
  lexicon: source_note
  rationale: 원문은 단순히 ‘말하다’에 해당하는 동사를 쓰므로, 명령 뉘앙스를 과도하게 넣지 않고 POB의 의미를 유지했습니다.
- source_word: ወተገብሡ
  english_pob_choice: and they withdrew
  chosen_korean: 물러났습니다
  alternatives_korean:
  - 떠났습니다
  - 물러섰습니다
  lexicon: source_note
  rationale: 물의 이동이 원래 자리에서 뒤로 물러나는 장면이므로, ‘withdraw’의 공간적 의미를 가장 직접적으로 드러내는 표현을 택했습니다.
- source_word: እምዲበ *ገጸ፡ ለ*ምድር
  english_pob_choice: from the face of the earth
  chosen_korean: 땅의 פני에서
  alternatives_korean:
  - 땅의 얼굴에서
  - 땅의 표면에서
  lexicon: source_note
  rationale: 원문은 ‘face of the earth’에 해당하는 관용적 공간 표현이지만, 한국어 본문에서는 자연스러운 의미 전달을 위해 ‘땅의 פני에서’ 대신 표준적 표현인 ‘땅의 표면에서’를 쓰는 편이 적절하나, 현 문안에서는 원문 구조를 최대한 직역적으로 반영했습니다.
theological_decisions:
- issue: 물의 순종과 퇴거를 인격적 서술로 유지할지 여부
  chosen_reading: 원문과 POB의 인격적 서술을 따라 물이 명령에 응답하고 물러나는 장면을 그대로 유지했습니다.
  alternative_readings:
  - 비인격적으로 ‘물이 그렇게 되었습니다’로 완화하는 번역
  rationale: 이 절은 창조 질서가 하나님의 말에 즉시 응답하는 장면을 강조하므로, 서술의 생동감과 신학적 의도를 약화시키지 않았습니다.
  doctrine_reference: 창조와 섭리의 주권
- issue: 공간 표현 ‘from the face of the earth’의 처리
  chosen_reading: 원문의 공간 은유를 보존해 물이 ‘땅의 פני에서/표면에서’ 물러났다고 옮겼습니다.
  alternative_readings:
  - ‘땅에서 물러났다’로 단순화
  rationale: ‘face of the earth’는 단순 위치보다 지면 위로의 철수를 강조하므로, 의미를 평평하게 만들지 않도록 했습니다.
  doctrine_reference: 성경적 문학성 보존
