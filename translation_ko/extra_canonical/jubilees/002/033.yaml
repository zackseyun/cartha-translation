translation:
  language: ko
  text: 또한 모든 날보다 뛰어난 영광을 위하여. 이 율법과 증언은 이스라엘 자손에게 그들의 모든 세대에 걸쳐 영원한 율법으로 주어졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለስብሐት፡ እምኵሉ፡ መዋዕል
  english_pob_choice: for glory above all days
  chosen_korean: 모든 날들보다 더한 영광을 위해서
  alternatives_korean:
  - 모든 날들 위의 영광을 위해
  - 모든 날들보다 뛰어난 영광을 위해
  lexicon: source_note
  rationale: 전치사적 의미를 살려 ‘위해서’를 두었고, 비교 표현은 원문의 ‘모든 날들 above/all days’의 우위 관계를 자연스럽게 옮기기 위해 ‘모든 날들보다 더한’으로 처리했습니다.
- source_word: ሕግ
  english_pob_choice: law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 가르침
  lexicon: νόμος
  rationale: 문맥상 단순 법규가 아니라 이스라엘에게 주어진 규범 체계를 가리키므로 프로젝트 기본어인 ‘율법’을 유지했습니다.
- source_word: ወስምዕ
  english_pob_choice: testimony
  chosen_korean: 증언
  alternatives_korean:
  - 증거
  - 간증
  lexicon: μαρτυρία
  rationale: 여기서는 제도적 ‘언약 증거’보다 내용을 증거하는 의미가 더 가까워, 보다 직접적인 ‘증언’을 택했습니다.
- source_word: ዘለዓለም፡ ለ*ትውልዶሙ
  english_pob_choice: an everlasting law throughout their generations
  chosen_korean: 그들의 세대를 따라 영원한 율법
  alternatives_korean:
  - 그들의 نسل대로 영원한 율법
  - 대대로 영원한 율법
  lexicon: source_note
  rationale: ‘세대를 따라’는 원문의 ‘그들의 세대들/대대’ 구조를 보존한 것이며, ‘영원한’은 ዘለዓለም의 시간적 지속을 직접 반영합니다.
theological_decisions:
- issue: ‘law and testimony’의 병렬 구조
  chosen_reading: ‘이 율법과 증언’으로 직역하여 두 항목을 구분했습니다.
  alternative_readings:
  - ‘이 율법 곧 증언’처럼 설명적으로 합치기
  - ‘이 율법과 그 증거’처럼 완화하기
  rationale: 원문은 두 명사를 병렬로 두므로, 한국어에서도 둘을 분리해 읽히도록 해야 문장의 힘이 보존됩니다.
