revisions:
- from: 이것이 둘째 날에 그가 하신 일이었습니다. 그리고 셋째 날에는 물에게 온 땅의 얼굴 앞에서 한 곳으로 물러가게 하시고, 마른 땅이 드러나게 하셨습니다.[a]
  to: 이것이 둘째 날에 그가 하신 일이었습니다. 그리고 셋째 날에는 물에게 “온 땅의 표면에서 한 곳으로 물러가라. 마른 땅이 드러나게 하라” 하고 명령하셨습니다.[a]
  rationale: 원문의 명령 동사와 두 동작의 병렬 구조를 보존하고, 한국어에서 어색한 ‘땅의 얼굴 앞’이라는 직역을 문맥상 정확한 ‘땅의 표면에서’로 바로잡았습니다. 직접 인용과 간접 명령의 번역상 선택지는 각주로 남겨 원문의 문법적 여지를 보존했습니다.
