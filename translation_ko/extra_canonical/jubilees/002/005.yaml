  text: This was the work that he did on the second day. And on the third day he commanded the waters to pass away from before the face of the whole earth into one place, and the dry land to appear.
  footnotes:
  - marker: a
    text: Or 'to pass away from before the face of the whole earth into one place, and let the dry land appear.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것이 둘째 날에 그가 하신 일이었습니다. 그리고 셋째 날에는 물에게 온 땅의 얼굴 앞에서 한 곳으로 물러가게 하시고, 마른 땅이 드러나게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብረ፡ ገብረ፡ / he did
  english_pob_choice: This was the work that he did on the second day.
  chosen_korean: 이것이 둘째 날에 그가 하신 일이었습니다.
  alternatives_korean:
  - 이것이 둘째 날에 그가 만드신 일이었습니다.
  - 이것이 둘째 날에 그가 하신 일이었습니다.
  lexicon: 일
  rationale: Geez의 반복 동사는 단순한 ‘만들다’보다 ‘하다/행하다’가 더 직접적으로 대응하며, 영어 POB의 did를 따라 ‘하신 일’로 자연스럽게 옮겼습니다.
- source_word: ወ... ይቤ ... ይኅለፉ
  english_pob_choice: he commanded the waters to pass away
  chosen_korean: 물에게 ... 물러가게 하시고
  alternatives_korean:
  - 물에게 ... 지나가게 하시고
  - 물에게 ... 사라지게 하시고
  lexicon: 물러가다
  rationale: ‘pass away’는 여기서 소멸보다 이동/물러남의 의미가 강하므로, 물이 한곳으로 물러나는 장면을 살려 옮겼습니다.
- source_word: እምቅድመ፡ ገጸ፡ ለኵላ፡ ምድር፡ ውስተ፡ መካን፡ አሐዱ
  english_pob_choice: from before the face of the whole earth into one place
  chosen_korean: 온 땅의 얼굴 앞에서 한 곳으로
  alternatives_korean:
  - 온 땅 앞에서 한 곳으로
  - 온 땅의 표면 앞에서 한 곳으로
  lexicon: 얼굴 / 한 곳
  rationale: Geez의 ‘face’는 여기서 지면의 표면을 가리키는 관용이므로, 영어 POB의 ‘face’를 살려 ‘얼굴’로 두되 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: የብስ።
  english_pob_choice: the dry land to appear
  chosen_korean: 마른 땅이 드러나게 하셨습니다.
  alternatives_korean:
  - 마른 땅이 나타나게 하셨습니다.
  - 마른 땅이 드러나게 하셨습니다.
  lexicon: 마른 땅
  rationale: 마른 땅은 단순한 육지가 아니라 물이 물러난 뒤 드러나는 상태를 강조하므로, ‘드러나게 하다’가 source의 결과상을 잘 반영합니다.
theological_decisions:
- issue: 창조 행위의 직접성 표현
  chosen_reading: ‘그가 하신 일’과 ‘물에게 ... 물러가게 하시고 ... 드러나게 하셨습니다’로 하나님의 직접 명령과 실행을 분명히 드러냈습니다.
  alternative_readings:
  - ‘그가 만든 일’로 완화
  - ‘물러가게 하였다’로 비인칭화
  rationale: 본문은 창조주 하나님의 주권적 명령과 질서 부여를 보여 주므로, 행위 주체를 약화시키지 않고 직접적으로 표현했습니다.
  doctrine_reference: 창조론 / 하나님의 주권
