base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/002/030.yaml
  text: And they shall not bring in or take out from house to house on this day[30], for it is holy and blessed more than any jubilee day of jubilees. On this one we kept sabbath in the heavens before it was made known to any flesh to keep sabbath on it upon the earth.
  footnotes:
  - marker: '30'
    text: The phrase 'holy and blessed more than any jubilee day of jubilees' is difficult and may be an emphatic comparison elevating the weekly Sabbath above even the highest festal cycles.
    reason: alternative_reading
  - marker: a
    text: Or 'any day of jubilees'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 이날에 집에서 집으로 들여오거나 내보내지 말아야 합니다. 이는 이 날이 거룩하고 복되며 희년들의 희년의 어느 날보다도 뛰어나기 때문입니다. 이 날에 우리는 하늘에서 안식하였습니다. 그것은 땅 위의 어떤 육체에게도 이 날에 안식하는 것이 알려지기 전에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘희년들의 희년의 어느 날’은 원문의 난해하고 강조적인 표현입니다. ‘모든 희년 주기 가운데 가장 높은 날’ 또는 ‘희년들의 어느 날’로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወኢያብኡ፡ ወኢያውፅኡ፡ ... እምቤት፡ ቤተ፡
  english_pob_choice: they shall not bring in or take out from house to house
  chosen_korean: 집에서 집으로 들여오거나 내보내지 말아야 합니다
  alternatives_korean:
  - 집에서 집으로 가져오거나 가져가서는 안 됩니다
  - 한 집에서 다른 집으로 들여오거나 내보내지 말아야 합니다
  lexicon: 들여오다/내보내다
  rationale: 이동 방향의 대칭을 살리면서, 단순한 '가져오다'보다 출입·운반의 금지라는 행위성을 더 분명히 드러냅니다.
- source_word: ቅድስት ... ወቡርክት
  english_pob_choice: holy and blessed
  chosen_korean: 거룩하고 복되기
  alternatives_korean:
  - 거룩하고 복된
  - 성스럽고 복된
  lexicon: 거룩하다 / 복되다
  rationale: 주어진 비교구문을 직역에 가깝게 살리면서, 예배적·종교적 뉘앙스를 유지하는 표준어 표현으로 옮겼습니다.
- source_word: እምኵሉ፡ ዕለት፡' ኢዮቤል፡" ዘኢዮቤልውሳት፡
  english_pob_choice: more than any jubilee day of jubilees
  chosen_korean: 모든 희년의 날보다
  alternatives_korean:
  - 어떤 희년의 날보다
  - 희년의 모든 날보다
  lexicon: 희년
  rationale: 게에즈의 중첩된 '희년' 표현을 반영하되 한국어에서는 과도한 중복을 피하고, 비교의 핵심만 자연스럽게 전달했습니다.
- source_word: በዛቲ፡ አሰንበትነ፡ በሰማያት፡
  english_pob_choice: On this one we kept sabbath in the heavens
  chosen_korean: 이 날에 대하여 우리는 하늘에서 안식하였으니
  alternatives_korean:
  - 이 날에 우리는 하늘에서 안식하였으니
  - 이 날에 대하여 하늘에서 안식하였으니
  lexicon: 안식하다
  rationale: 명시적 주어 'we'를 살리면서, 'keeping sabbath'의 동작을 한국어 성경체에서 자연스러운 '안식하다'로 옮겼습니다.
theological_decisions:
- issue: 주간 안식일의 선재성 진술
  chosen_reading: 하늘에서 먼저 안식한 뒤에야 땅의 모든 육체에게 이 날을 지키라고 알려졌다고 옮겼습니다.
  alternative_readings:
  - 하늘에서 이 날을 지켰다고만 옮기는 방식
  - 땅에서의 안식일 준수 명령만 강조하는 방식
  rationale: 원문은 지상의 계명보다 앞선 하늘의 선행적 안식을 말하므로, 시간적 우선성과 계시 이전성을 함께 보존했습니다.
  doctrine_reference: 창조 질서와 안식일의 선재적 거룩성
