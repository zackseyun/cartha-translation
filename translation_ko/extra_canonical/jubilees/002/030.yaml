  terminology: ‘거룩하다’, ‘복되다’, ‘희년’, ‘안식하다’, ‘육체’는 본문의 종교적 어휘와 문체에 알맞습니다. ‘육체’는 모든 인간/피조물을 가리키는 원문의 표현을 보존하므로 유지합니다.
