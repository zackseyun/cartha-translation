translation:
  language: ko
  text: 그리고 그때 우리는 그의 행위들을 보았고, 그의 모든 행위 때문에 그를 축복하고 그 앞에서 찬양을 드렸습니다. 왜냐하면[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 앞에서 그를 찬양했습니다.’
    reason: 원문의 찬양 동사와 ‘그 앞에서’의 결합은 직접 목적어를 명시하는 방식으로도 옮길 수 있으나, 본문은 원문의 관계 표현을 자연스럽게 보존하기 위해 ‘그 앞에서 찬양을 드렸습니다’로 번역했습니다.
lexical_decisions:
- source_word: וְאַחְמָה / And then we saw
  english_pob_choice: And then we saw
  chosen_korean: 그리고 그때 우리는 보았습니다
  alternatives_korean:
  - 그때 우리는 보았습니다
  - 그리하여 우리는 보았습니다
  lexicon: Geez מ-ראה / English past narrative
  rationale: 서술 흐름을 자연스럽게 살리되, 원문의 순차적 연결을 드러내기 위해 ‘그리고 그때’를 택했습니다.
- source_word: מִגְבָּרוֹ / his works
  english_pob_choice: his works
  chosen_korean: 그의 행위들
  alternatives_korean:
  - 그의 일들
  - 그의 작품들
  lexicon: Geez ግብር / deeds, works
  rationale: 문맥상 창조 행위나 행적을 가리키므로 ‘행위들’이 가장 직접적이며, ‘작품들’처럼 미학적으로 좁히지 않았습니다.
- source_word: וַבָּרַכְנָהוּ / we blessed him
  english_pob_choice: we blessed him
  chosen_korean: 그를 축복하고
  alternatives_korean:
  - 그를 복되다 하였고
  - 그에게 복을 빌며
  lexicon: Geez bless / ברך
  rationale: ‘축복하다’가 원문의 직접적 동사 의미를 가장 잘 살리며, 한국어에서 예배적 문맥에도 자연스럽습니다.
- source_word: וְסַבַּחְנָה קְדָמֵיהוּ / offered praise before him
  english_pob_choice: offered praise before him
  chosen_korean: 그 앞에서 찬양드렸습니다
  alternatives_korean:
  - 그 앞에서 찬양했습니다
  - 그 앞에서 그를 찬양했습니다
  lexicon: Geez praise before him
  rationale: 원문은 ‘그 앞에서’라는 위치 관계를 포함하므로 유지했고, POB의 수정 흐름을 반영해 중복된 목적어를 피했습니다.
theological_decisions:
- issue: “before him”의 관계를 한국어로 어떻게 드러낼지
  chosen_reading: ‘그 앞에서’로 옮겨, 찬양의 방향성과 경배의 자리성을 보존했습니다.
  alternative_readings:
  - ‘그를 향해’
  - ‘그에게’
  rationale: 원문은 단순 대상이 아니라 하나님 앞에서의 행위를 말하므로, 장소/관계 표현을 살리는 편이 더 충실합니다.
  doctrine_reference: 예배의 지향성; 하나님 앞에서의 경배
