revisions:
- from: 그는 자기 창조주를 찬양하였는데, 그분이 그를 자기 세대 가운데서 창조하셨기 때문입니다. 그분이 자신의 선하신 뜻에 따라 그를 창조하셨으므로, 그는 알았고 또 깨달았습니다. 자기에게서 의의 나무가 영원한 세대들을 위하여 나올 것이며, 자기에게서 거룩한 씨가 나와 모든 것을 만드신 분과 같아질 것임을.
  to: 그는 자신을 그의 세대 가운데 창조하신 자기 창조주를 송축하였습니다. 그분께서 자신의 기뻐하심에 따라 그를 창조하셨기 때문입니다. 그는 자기에게서 영원한 세대들을 위한 의의 심긴 것이 나올 것이며, 자기에게서 거룩한 씨가 나와 모든 것을 만드신 분과 같이 될 것을 알고 깨달았습니다.
  rationale: 문장 파편을 해소하고, 원문의 식물 및 씨 은유와 최종부의 ‘모든 것’을 보존했습니다. 창조주를 향한 ባረከ는 ‘송축하다’로, ሥምረት은 해석적 확대를 피한 ‘기뻐하심’으로 조정했습니다.
