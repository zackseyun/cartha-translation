base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/026.yaml
  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: ko
  text: 그는 자신을 그의 세대 가운데 창조하신 자기 창조주를 송축하였습니다. 그분께서 자신의 기뻐하심에 따라 그를 창조하셨기 때문입니다. 그는 자기에게서 영원한 세대들을 위한 의의 심긴 것이 나올 것이며, 자기에게서 거룩한 씨가 나와 모든 것을 만드신 분과 같이 될 것을 알고 깨달았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባረኮ፡
  english_pob_choice: And he blessed
  chosen_korean: 찬양하였는데
  alternatives_korean:
  - 복을 빌었습니다
  - 축복하였습니다
  - 감사하며 찬양하였습니다
  lexicon: Leslau
  rationale: 이 문맥에서는 단순한 축복의 선언보다 창조주를 향한 찬미와 송축의 의미가 강하므로, ‘찬양하다’로 옮겨 예배적 뉘앙스를 살렸습니다.
- source_word: ለፈጣሪሁ፡ ዘፈጠሮ፡
  english_pob_choice: his Creator, who had created him
  chosen_korean: 자기 창조주를… 그분이 그를… 창조하셨기 때문입니다
  alternatives_korean:
  - 그의 창조주를… 그분이 그를… 지으셨기 때문입니다
  - 자기를 만드신 이… 그분이 그를… 만드셨기 때문입니다
  lexicon: Geʿez source + POB audit
  rationale: ‘창조주/창조하다’의 반복을 유지해 원문의 소유 관계와 창조 행위를 분명히 드러냈습니다.
- source_word: በሥምረቱ፡
  english_pob_choice: according to His good pleasure
  chosen_korean: 자신의 선하신 뜻에 따라
  alternatives_korean:
  - 그분의 기뻐하심에 따라
  - 그분의 선한 기쁨에 따라
  - 그분의 뜻대로
  lexicon: Leslau
  rationale: 단순한 ‘뜻’보다 하나님의 주권적 호의와 선하심을 함께 담아, 본문이 가진 신학적 무게를 보존했습니다.
- source_word: ከመ፡ እምኔሁ፡ ይከውን፡ ተከለ፡ ጽድቅ፡ ... ወእምኔሁ፡ ዘርእ፡ ቅዱስ፡
  english_pob_choice: that from him there would be a plant of righteousness ... and from him a holy seed
  chosen_korean: 자기에게서 의의 나무가 … 나올 것이며, 자기에게서 거룩한 씨가 나와
  alternatives_korean:
  - 그에게서 의의 심기움이 … 있을 것이며, 그에게서 거룩한 후손이 나와
  - 그에게서 의의 싹이 … 생길 것이며, 그에게서 거룩한 씨가 나와
  lexicon: Geʿez source + POB audit
  rationale: ‘plant of righteousness’를 직역하기보다 본문 이미지와 한국어 자연성을 함께 고려해 ‘의의 나무’로 옮겼고, ‘holy seed’는 혈통적·언약적 후손을 살릴 수 있는 ‘거룩한 씨’로 유지했습니다.
- source_word: ዘገብረ፡
  english_pob_choice: who had made all things / who had made it
  chosen_korean: 만드신 분과 같아질
  alternatives_korean:
  - 만드신 분처럼 될
  - 모든 것을 만드신 분과 같아질
  lexicon: Geʿez source + revision audit
  rationale: 최신 수정에 따라 ‘all things’는 반영하지 않고, 원문이 가리키는 대상인 ‘그것/그분’을 살려 ‘만드신 분’으로 처리했습니다.
theological_decisions:
- issue: ‘plant of righteousness’의 은유 처리
  chosen_reading: 직역적 이미지를 살려 ‘의의 나무’로 두었습니다.
  alternative_readings:
  - 의의 새싹
  - 의의 심긴 것
  - 의로운 나무
  rationale: 원문의 식물 은유를 희석하지 않고 유지하는 편이, 언약적 후손과 성장의 이미지를 더 분명히 전달합니다.
  doctrine_reference: 문학적 은유 보존 및 언약 후손 이미지
- issue: ‘holy seed’와 최종 목적절의 관계
  chosen_reading: ‘거룩한 씨’가 ‘만드신 분과 같아질 것’이라는 목적/결과 구조를 그대로 살렸습니다.
  alternative_readings:
  - 거룩한 후손
  - 거룩한 씨가 되도록
  - 만드신 분을 닮게
  rationale: 본문은 씨의 거룩함과 창조주를 닮는 결과를 연결하므로, 설명을 덧붙여 완화하기보다 원문의 긴장을 유지했습니다.
  doctrine_reference: 언약적 계승과 하나님의 형상 이미지
