  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
  footnotes:
  - marker: a
    text: Or 'costus, and cassia'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 아침과 저녁에 유향, 풍자향, 스타크테, 나르드, 몰약, 계피, 코스투스로 만든 향기로운 향을 피웠습니다.[a] 이 일곱 가지를 모두 함께 섞어 순수하게 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “코스투스와 계피”.
    reason: 영어 POB 감사 기록에 보존된 cassia와 costus의 순서에 관한 대안 배열을 해당 목록에 연결합니다. 본문은 게에즈어 열거 순서인 계피, 코스투스를 따릅니다.
lexical_decisions:
- source_word: ብሔር ... ወበጽባሕ ... ወሰርክኒ
  english_pob_choice: And morning and evening
  chosen_korean: 아침과 저녁에
  alternatives_korean:
  - 아침마다 저녁마다
  - 아침과 저녁마다
  lexicon: 시간 표현
  rationale: 두 시점을 병렬로 제시하는 구조를 자연스럽게 살리되, 반복성은 문맥상 분명하므로 한국어에서는 간결하게 처리했습니다.
- source_word: የዐጥን እፈወ
  english_pob_choice: he burned fragrant incense
  chosen_korean: 향기로운 향을 피웠습니다
  alternatives_korean:
  - 향을 피웠습니다
  - 향기로운 향을 사르셨습니다
  lexicon: 향/분향 표현
  rationale: 문맥상 단순한 향료 나열이 아니라 향을 태워 드리는 행위를 가리키므로, 동작성을 드러내는 ‘피우다’를 택했습니다.
- source_word: ወስኂነ ... ወማየ ልብን ወናርድስ ወከርቤ ወሰንበልተ ወኵስተ
  english_pob_choice: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus
  chosen_korean: 유향, 풍자향, 침향, 나르드, 몰약, 계수나무, 그리고 순수한 향부자
  alternatives_korean:
  - 유향, 풍자향, 침향, 나르드, 몰약, 계수나무, 그리고 향부자
  - 유향, 풍자향, 침향, 나르드, 몰약, 계수나무, 그리고 창포
  lexicon: 향료 명칭
  rationale: POB의 순서를 따르되, 지시된 어휘를 한국어로 옮겼습니다. 마지막 항목은 전통 번역어가 분분하므로 POB의 ‘costus’에 맞춰 ‘향부자’로 두었습니다.
- source_word: ሰብዐቲሆሙ
  english_pob_choice: seven of these
  chosen_korean: 이 일곱 가지를 모두
  alternatives_korean:
  - 이것들 가운데 일곱 가지를
  - 그 일곱 가지를
  lexicon: 수량 표현
  rationale: 원문의 ‘일곱’은 향료 목록의 완결 수를 강조하므로, 한국어에서도 자연스럽게 그 수량을 살렸습니다.
theological_decisions:
- issue: 향을 ‘향기로운 향’으로 옮길지, 단순히 ‘향’으로 옮길지
  chosen_reading: ‘향기로운 향’을 사용해 예배용 분향의 성격을 분명히 했습니다.
  alternative_readings:
  - ‘향’을 사용해 더 간결하게 옮김
  - ‘향료’를 사용해 재료 목록으로만 처리
  rationale: 문맥은 재료 나열만이 아니라 제의적 분향 행위이므로, 향기와 제의성을 함께 드러내는 표현이 본문의 의도를 더 잘 전달합니다.
  doctrine_reference: 제의적 언어의 서술적 보존
- issue: ‘pure’를 향의 상태로 볼지, 전체 제물의 성격으로 볼지
  chosen_reading: ‘순수한 향부자였습니다’로 두어 마지막 수식이 혼합물 전체의 정결함을 가리키도록 옮겼습니다.
  alternative_readings:
  - ‘순수하게 섞어 바쳤습니다’로 처리
  - ‘정결하게’라는 부사를 별도로 부여
  rationale: 영문 POB의 ‘pure’는 마지막 열거 항목에 걸리면서 동시에 혼합물의 정결성을 암시하므로, 과잉 해석 없이 종결부에서 자연스럽게 연결했습니다.
  doctrine_reference: 본문 수식 범위의 보존
