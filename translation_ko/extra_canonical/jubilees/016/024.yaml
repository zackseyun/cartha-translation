  source_fidelity: 수정이 필요합니다. 초안은 마지막 향료인 costus를 ‘향부자’로 옮겼는데, 향부자는 다른 식물명이므로 안전하지 않습니다. 또한 ‘pure’를 ‘순수한 향부자’로 처리하여 원문의 ‘모두 함께 섞어 … 바쳤다’라는 수식·서술 관계를 훼손합니다. 일곱 향료의 순서는 원문 및 영어 POB를 따라 계피(또는 카시아) 다음 코스투스로 유지해야 합니다.
  naturalness: ‘향기로운 향을 피웠습니다’도 이해되지만, 향료 목록을 먼저 자연스럽게 묶어 ‘…로 만든 향기로운 향을 피웠습니다’라고 하면 목록과 분향 행위의 관계가 명료해집니다. ‘순수한 향부자였습니다’라는 문장은 문맥과 문법 양쪽에서 부자연스럽습니다.
  terminology: frankincense=유향, galbanum=풍자향, stacte=스타크테, nard=나르드, myrrh=몰약으로 처리했습니다. cassia는 향료 문맥에서 ‘계피’로, costus는 잘못된 식물 동정어를 피하여 음역 ‘코스투스’로 처리했습니다. ‘순수하게’는 혼합하여 바친 제물의 상태/방식을 수식하도록 옮겨 수식 범위의 불확실성을 과도하게 해석하지 않았습니다.
