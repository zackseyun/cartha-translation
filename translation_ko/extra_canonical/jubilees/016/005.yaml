revisions:
- from: 그가 아들을 잉태하였습니다. 그리고 이 달에 주께서는 소돔과 고모라와 아드마와 요르단의 온 지역에 심판을 집행하셨으며, 불과 유황으로 그들을 태우시고 오늘에 이르기까지 멸망시키셨습니다. 이는 내가 이제 너희에게 그들의 모든 행위를 밝히 말하였기 때문입니다. 그들은 지극히 사악하며 죄인들이기 때문입니다.[a][b][c]
  to: 그녀는 아들을 잉태하였습니다. 이 달에 주께서는 소돔과 고모라와 돔[a]과 요르단의 모든 지역에 심판을 집행하셨으며, 불과 유황으로 그들을 태우시고 오늘날까지 멸망시키셨습니다. 내가 이제 너희에게 그들의 모든 행위를 밝혀 알린 바와 같이, 그들은 지극히 사악하고 죄가 많았습니다.
  rationale: 여성 주어를 명시하고, 논쟁적인 지명 ዶም을 아드마로 단정하지 않았습니다. 또한 ‘내가 이제 너희에게 … 밝혀 알린’ 화자의 진술을 복원하고, 그 뒤의 사악함과 죄됨을 독립된 서술로 옮겨 원문의 의미와 문장 흐름을 보존했습니다. 기존의 영문 대안 각주는 현 한국어 본문과 연결되지 않으므로 제거하고 지명에 관한 직접 주석 하나로 교체했습니다.
