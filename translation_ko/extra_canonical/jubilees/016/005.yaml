base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
  footnotes:
  - marker: a
    text: Or 'according to all their deeds, because they were utterly lawless and sinful.'.
    reason: previous_rendering
  - marker: b
    text: Or 'and Zoar'.
    reason: previous_rendering
  - marker: c
    text: Or 'And in this month'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀는 아들을 잉태하였습니다. 이 달에 주께서는 소돔과 고모라와 돔[a]과 요르단의 모든 지역에 심판을 집행하셨으며, 불과 유황으로 그들을 태우시고 오늘날까지 멸망시키셨습니다. 내가 이제 너희에게 그들의 모든 행위를 밝혀 알린 바와 같이, 그들은 지극히 사악하고 죄가 많았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아드마’. 게으즈 본문은 ‘돔’을 읽으며, 문맥상 멸망한 도시 아드마를 가리키는 것으로 보기도 합니다.
    reason: 게으즈 ዶም의 지명 식별은 확정되지 않았습니다. 본문에는 원문 음역을 유지하고, 가능한 동일시를 각주로 제시하여 불확실성을 보존합니다.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ።
  english_pob_choice: She conceived a son.
  chosen_korean: 그가 아들을 잉태하였습니다.
  alternatives_korean:
  - 그가 아들을 배었습니다.
  - 여자가 아들을 잉태하였습니다.
  lexicon: 잉태하다
  rationale: 게으즈 원문은 ‘아들을 잉태하였다’는 사건 진술이며, 성별 표지 없이도 문맥상 여성 주어를 가리키므로 한국어에서는 자연스럽게 축약해 번역하되, POB의 사건 중심 표현을 유지했습니다.
- source_word: ዘነኒሆሙ፡ ለሰዶም፡ ወለገሞራ፡ *ወለዶም፡ ወለኵሉ፡ አደያመ፡* ዮርዳኖስ፡
  english_pob_choice: on Sodom and Gomorrah ... and all the region of the Jordan
  chosen_korean: 소돔과 고모라와 아드마와 요르단의 온 지역에
  alternatives_korean:
  - 소돔과 고모라와 아드마와 요르단의 모든 평야에
  - 소돔과 고모라와 아드마와 요르단 주변의 모든 지역에
  lexicon: 지명 표기
  rationale: ‘아드마’는 보편적 표기 관습을 따르고, ‘온 지역’은 범위를 넓게 포괄하는 원문의 지역성 표현을 직역해 유지했습니다.
- source_word: ወአውዐዮሙ፡ በእሳት፡ ወበተይ፡
  english_pob_choice: and he burned them with fire and sulfur
  chosen_korean: 불과 유황으로 그들을 태우시고
  alternatives_korean:
  - 불과 유황으로 그들을 사르시고
  - 불과 유황으로 그들을 불태우시고
  lexicon: 불과 유황
  rationale: 게으즈 본문의 도구격을 한국어로 자연스럽게 옮겨, 심판의 수단이 ‘불과 유황’임을 분명히 드러내었습니다.
- source_word: እስከ፡ ዛቲ፡* ዕለት፡
  english_pob_choice: to this day
  chosen_korean: 오늘에 이르기까지
  alternatives_korean:
  - 이 날까지
  - 오늘날까지
  lexicon: 관용 표현
  rationale: 현재까지의 지속을 강조하는 관용 표현으로, 원문의 완료-지속 의미를 현대 한국어로 자연스럽게 살렸습니다.
- source_word: ፀዋጋን፡ ወኃጥኣን፡ ጥቀ፡
  english_pob_choice: utterly wicked and sinful
  chosen_korean: 지극히 사악하며 죄인들이기 때문입니다
  alternatives_korean:
  - 극도로 악하며 죄인들이기 때문입니다
  - 몹시 악하고 죄를 지은 자들이기 때문입니다
  lexicon: 평가 형용사
  rationale: 마지막 절은 그들의 행위를 해설하는 결론이므로, ‘지극히’로 강도를 살리고 ‘사악하며 죄인들’로 두 개의 평가를 병렬로 유지했습니다.
theological_decisions:
- issue: 하나님의 심판 행위의 직접성
  chosen_reading: 주께서 소돔과 고모라 및 인근 지역에 심판을 직접 집행하셨다고 옮겼습니다.
  alternative_readings:
  - 하나님께서 심판하셨다고 완곡하게 옮길 수 있음
  - 심판을 내리셨다고 표현할 수 있음
  rationale: 원문은 하나님의 주권적, 직접적 심판을 분명히 말하므로 이를 약화시키지 않고 ‘집행하셨다’로 번역했습니다.
  doctrine_reference: 신적 심판의 주권성과 역사성
