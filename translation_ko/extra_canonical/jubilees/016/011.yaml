  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: ko
  text: 그는 가데스와 술 사이인 그랄 산지에 머물렀습니다. 그리고 다섯째 달 중순에 그곳을 떠나 맹세의 우물에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኀደረ፡
  english_pob_choice: dwelt
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 거주했습니다
  - 살았습니다
  lexicon: 거주/체류 동사
  rationale: 장소에 계속 머무는 뜻을 살리되, 문맥상 임시 체류도 가능한 동사로 '머물렀습니다'를 택했습니다.
- source_word: ማእከለ፡ ቃዴስ፡ ወሱር፡
  english_pob_choice: between Kadesh and Shur
  chosen_korean: 가데스와 술 사이
  alternatives_korean:
  - 가데스와 쉬르 사이
  - 가데스와 수르 사이
  lexicon: 지명 전치사구
  rationale: 히브리계 지명 표기를 현대 한국어 관행에 맞춰 옮기되, '사이'로 관계를 직접 드러냈습니다.
- source_word: አደባረ፡* ጌራሮን።
  english_pob_choice: in the mountains of Gerar
  chosen_korean: 그리라 산지
  alternatives_korean:
  - 그랄의 산지
  - 게랄의 산지
  lexicon: 지명 구문
  rationale: Gerar를 음역한 뒤 산지라는 지리적 의미를 보존해 원문과 POB 번역의 지시 관계를 반영했습니다.
- source_word: ውስተ፡ አደባረ፡* ጌራሮን።
  english_pob_choice: in the mountains of Gerar
  chosen_korean: 그리라 산지에
  alternatives_korean:
  - 그랄 산들에
  lexicon: 전치사+명사구
  rationale: ‘산들’보다 지형 집합을 뜻하는 ‘산지’가 한국어 성경 문체에 더 자연스럽고 간결합니다.
- source_word: በመንፈቀ፡ ወርኅ፡ ኃምስ፡
  english_pob_choice: in the middle of the fifth month
  chosen_korean: 다섯째 달 한가운데에
  alternatives_korean:
  - 다섯째 달 중간에
  - 다섯째 달 한복판에
  lexicon: 시간 표현
  rationale: 원문의 '가운데'를 살려 달의 중앙 시점을 직접적으로 드러냈습니다.
- source_word: ፯ዐዘ፡
  english_pob_choice: the Well of the Oath
  chosen_korean: 맹세의 우물
  alternatives_korean:
  - 맹약의 우물
  - 서약의 우물
  lexicon: 지명/명사구
  rationale: POB의 영어 표현을 따르되, 'oath'의 핵심 의미를 한국어에서 가장 직접적으로 드러내는 '맹세'를 선택했습니다.
