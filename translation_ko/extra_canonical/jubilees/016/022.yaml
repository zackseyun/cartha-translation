base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/022.yaml
  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
  footnotes:
  - marker: a
    text: Or 'for this feast,'.
    reason: previous_rendering
  - marker: b
    text: Or 'he brought, day by day, on the altar'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 절기 때에 그는 땅에서 초막절을 처음으로 지켰습니다. 그리고 이 일곱 날 동안 그는 날마다 제단 위에서 주님께 수소 두 마리와 숫양 두 마리와 양 일곱 마리와 속죄제를 위한 숫염소 한 마리를 바쳤습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 절기를 위해.’
    reason: Ge'ez 전치사구는 문맥에 따라 ‘이 절기 때에’ 또는 ‘이 절기를 위해’로 이해될 수 있으며, 영어 POB 감사 기록의 대안을 보존합니다.
  - marker: b
    text: 또는 ‘그는 날마다 제단 위에 가져왔습니다.’
    reason: 희생제물을 ‘바쳤다’로 옮긴 본문과 달리, 동사 본래의 ‘가져오다/가까이 가져오다’라는 번역 가능성을 영어 POB 감사 기록에 따라 보존합니다.
lexical_decisions:
- source_word: በዛቲ፡ በዓል፡
  english_pob_choice: at this feast
  chosen_korean: 이 절기 때에
  alternatives_korean:
  - 이 절기에서
  - 이 절기를 위해
  lexicon: 절기
  rationale: Ge'ez의 በ(“at/during”)를 반영해 ‘때에’로 시간적 배경을 살렸고, POB의 수정 방향에 맞춰 ‘for’가 아니라 ‘at/during’의 뜻을 살렸습니다.
- source_word: መቅድመ፡ ገብረ፡
  english_pob_choice: he was the first to celebrate
  chosen_korean: 처음으로 지켰습니다
  alternatives_korean:
  - 처음으로 기념했습니다
  - 맨 처음으로 열었습니다
  lexicon: 절기 준수 표현
  rationale: ‘지키다’는 절기를 실제로 준수한다는 의미를 자연스럽게 담아, 단순한 행사 개최보다 원문의 종교적 준수 의미를 살렸습니다.
- source_word: ውስተ፡ *ምሥዋዐ፡ ጽንሓሕ፡
  english_pob_choice: on the altar
  chosen_korean: 제단 위에
  alternatives_korean:
  - 제단에서
  - 제단에
  lexicon: 제의 용어
  rationale: 희생제사 문맥이므로 제물의 봉헌 장소를 분명하게 드러내는 ‘제단 위에’가 가장 자연스럽고 직역에 가깝습니다.
- source_word: ለእግዚአብሔር፡
  english_pob_choice: to the Lord
  chosen_korean: 주님께
  alternatives_korean:
  - 야훼께
  - 주께
  lexicon: 하나님 호칭
  rationale: 본문의 제의적 헌납 방향을 살리면서 한국어 문장에서는 ‘주님께’가 가장 자연스럽고 공경의 뉘앙스를 유지합니다.
- source_word: ምሥዋዐ፡ ጽንሓሕ፡'፫
  english_pob_choice: for a sin offering
  chosen_korean: 속죄제를 위한 숫염소 한 마리
  alternatives_korean:
  - 죄제물을 위한 숫염소 한 마리
  - 속죄제물로 숫염소 한 마리
  lexicon: 제사 용어
  rationale: Ge'ez의 제의적 용례를 따라 ‘속죄제’로 옮기되, 동물 종류와 수를 한 흐름으로 읽히게 했습니다.
theological_decisions:
- issue: 절기 이름의 표현과 역사적 설명
  chosen_reading: ‘초막절’로 옮기되, 앞의 ‘이 절기 때에’와 함께 두어 절기 일반 설명이 아니라 특정 절기의 역사적 첫 준수라는 점을 드러냈습니다.
  alternative_readings:
  - ‘장막절’
  - ‘초막절 절기’
  rationale: 문맥상 절기 명칭과 최초 준수의 역사성이 중요하므로, 전통적 한국 교회 용어를 쓰되 문장 구조로 원문의 강조를 유지했습니다.
  doctrine_reference: 성경 서사의 역사성 보존
