translation:
  language: ko
  text: 그는 축복하고 기뻐하며, 이 절기의 이름을 ‘주님의 절기, 기쁨’이라고 불렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘주님의 절기, 기쁨’입니다.
    reason: 원문의 명사적 병치와 영어 POB 감사 이력에서 논의된 끝말 ‘joy’의 표현을 설명합니다.
lexical_decisions:
- source_word: he blessed
  english_pob_choice: And he blessed
  chosen_korean: 복을 빌고
  alternatives_korean:
  - 복을 빌며
  - 축복했고
  lexicon: ברך
  rationale: Geez 원문의 ‘복을 빌다/축복하다’에 해당하는 동작을 한국어에서 가장 직접적으로 살리면서, 뒤의 ‘기뻐했다’와 병렬 구조를 자연스럽게 맞췄습니다.
- source_word: rejoiced
  english_pob_choice: rejoiced
  chosen_korean: 기뻐했으며
  alternatives_korean:
  - 즐거워했으며
  - 환희했습니다
  lexicon: שמח/ፈሥሐ 계열
  rationale: 원문의 ‘기쁨/환희’ 어휘를 반영하되, 서술문 체계에 맞게 과장 없이 표준어 합쇼체로 옮겼습니다.
- source_word: the feast of the Lord
  english_pob_choice: the feast of the Lord
  chosen_korean: ‘주님의 절기’
  alternatives_korean:
  - ‘주님의 명절’
  - ‘주님의 축제’
  lexicon: በዓል እግዚአብሔር
  rationale: በዓል은 여기서 종교적 축제/절기를 가리키므로, 교회 전통 용어에 너무 고정되지 않게 ‘절기’로 옮겼습니다. ‘주님’은 문맥상 주어가 되는 하나님 호칭에 맞춘 표현입니다.
- source_word: joy
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 환희
  - 즐거움
  lexicon: ፍሥሓ
  rationale: 원문 끝의 명사적 결말을 한국어에서는 자연스럽게 ‘기쁨’으로 처리해, POB의 ‘a joy’/‘joy’ 변동이 드러내는 apposition을 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: ‘the feast of the Lord’의 신학적 귀속
  chosen_reading: 이 절기는 단순한 인간의 기념행사가 아니라 ‘주님의 절기’로 명명됩니다.
  alternative_readings:
  - ‘야훼의 절기’로 음역해 더 직접적으로 옮김
  - ‘하나님의 절기’로 일반화함
  rationale: 원문이 절기의 소유/귀속을 분명히 하므로, 한국어에서도 그 귀속 관계를 유지했습니다. 문맥상 인격적 호칭은 ‘주님’으로 처리하되, 정경 본문이 아닌 점을 고려해 야훼 표기는 사용하지 않았습니다.
  doctrine_reference: 명명 행위는 절기의 의미를 규정하는 서술로 읽어야 하며, 예배 용어의 귀속을 보존합니다.
