  lexicon: korean biblical terminology
  rationale: ‘holy people’의 언약적 공동체 의미를 살려 ‘백성’으로 옮겼고, ‘거룩한’으로 형용했습니다.
- source_word: ለፈጣሬ፡ ኵሉ፡
  english_pob_choice: the Creator of all
  chosen_korean: 만물의 창조주
  alternatives_korean:
