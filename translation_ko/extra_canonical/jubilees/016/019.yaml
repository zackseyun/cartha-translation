translation:
  language: ko
  text: 제사장직과 거룩한 백성이 되었습니다. 그는 길을 떠났고, 기뻐하며 우리가 그에게 말해 준 것 때문에 만물의 창조주를 찬양했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이전 번역은 “우리가 그에게 말해 준 모든 일에 대하여 주님을 찬양했습니다”라고 옮겼습니다.
    reason: 원문의 ‘만물의 창조주’라는 호칭과 인과 구문을 보존한 본문과, 영어 감사 이력에 기록된 이전 표현을 구별합니다.
lexical_decisions:
- source_word: ዘክህነት
  english_pob_choice: a priesthood
