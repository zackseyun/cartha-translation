translation:
  language: ko
  text: 제사장직과 거룩한 백성이었습니다. 그는 길을 떠났고, 기뻐하며 우리가 그에게 말해 준 것 때문에 만물의 창조주를 찬양했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘክህነት
  english_pob_choice: a priesthood
  chosen_korean: 제사장직
  alternatives_korean:
  - 제사장 무리
  - 제사장단
  - 제사장 집단
  lexicon: korean biblical terminology
  rationale: Ge'ez의 집합명사에 맞춰 개인들의 목록이 아니라 직분/집단을 가리키는 말로 옮겼습니다.
- source_word: ወሕዝበ፡ ቅዱሰ
  english_pob_choice: a holy people
  chosen_korean: 거룩한 백성
  alternatives_korean:
  - 거룩한 민족
  - 거룩한 ժողովուրդ
  - 성스러운 백성
  lexicon: korean biblical terminology
  rationale: ‘holy people’의 언약적 공동체 의미를 살려 ‘백성’으로 옮겼고, ‘거룩한’으로 형용했습니다.
- source_word: ለፈጣሬ፡ ኵሉ፡
  english_pob_choice: the Creator of all
  chosen_korean: 만물의 창조주
  alternatives_korean:
  - 모든 것의 창조주
  - 만유의 창조주
  - 만물을 지으신 분
  lexicon: divine title
  rationale: 원문의 고유한 호칭은 ‘주’가 아니라 ‘창조주’이며, ‘ኵሉ’는 ‘all/everything’이므로 ‘만물의’로 정리했습니다.
- source_word: ዘነገርናሁ
  english_pob_choice: because we had told him
  chosen_korean: 우리가 그에게 말해 준 것 때문에
  alternatives_korean:
  - 우리가 그에게 알렸기 때문에
  - 우리가 그에게 말했기 때문에
  - 우리가 그에게 전해 주었기 때문에
  lexicon: causal construction
  rationale: 문맥상 결과 사유를 나타내므로 ‘때문에’ 구조로 처리해, ‘all’에 매달리지 않도록 했습니다.
theological_decisions:
- issue: 주체의 찬양 대상
  chosen_reading: 그는 만물의 창조주를 찬양했습니다.
  alternative_readings:
  - 그는 주님을 찬양했습니다.
  - 그는 하나님을 찬양했습니다.
  rationale: 게에즈 본문과 영어 수정본이 모두 특정 호칭 ‘만물의 창조주’를 지시하므로, 일반적인 ‘주님/하나님’으로 평준화하지 않았습니다.
  doctrine_reference: 창조주 호칭의 직접성 유지
