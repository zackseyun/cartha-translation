  - 만유의 창조주
  - 만물을 지으신 분
  lexicon: divine title
  rationale: 원문의 고유한 호칭은 ‘주’가 아니라 ‘창조주’이며, ‘ኵሉ’는 ‘all/everything’이므로 ‘만물의’로 정리했습니다.
- source_word: ዘነገርናሁ
  english_pob_choice: because we had told him
  chosen_korean: 우리가 그에게 말해 준 것 때문에
  alternatives_korean:
  - 우리가 그에게 알렸기 때문에
  - 우리가 그에게 말했기 때문에
  - 우리가 그에게 전해 주었기 때문에
  lexicon: causal construction
  rationale: 문맥상 결과 사유를 나타내므로 ‘때문에’ 구조로 처리해, ‘all’에 매달리지 않도록 했습니다.
