  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: ko
  text: 그러므로 이스라엘이 일곱째 달에 기쁨으로 칠 일 동안 초막절을 지키는 것이 주 앞에서 받아들여지도록 하늘의 판들에 규정되어 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ / it is ordained
  english_pob_choice: it is ordained
  chosen_korean: 제정되었으니
  alternatives_korean:
  - 정해졌으니
  - 규정되었으니
  lexicon: 지정된 법규·명령의 제정
  rationale: 하늘의 판에 기록된 규정이라는 뜻을 살려, 단순한 '정하다'보다 공식적이고 문서화된 뉘앙스의 '제정되다'를 택했습니다.
- source_word: ውስተ ጽላተ ሰማይ / heavenly tablets
  english_pob_choice: heavenly tablets
  chosen_korean: 하늘의 판
  alternatives_korean:
  - 하늘의 돌판
  - 천상의 판
  lexicon: 천상에 있는 기록 판
  rationale: 주어진 아브외 경전 문맥에서 'heavenly tablets'는 기록·명령의 판을 가리키므로, 직역적이면서도 한국어에서 자연스러운 '하늘의 판'으로 옮겼습니다.
- source_word: በፍሥሓ / with joy
  english_pob_choice: with joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환희로
  lexicon: 기쁨의 방식·상태
  rationale: 행위의 태도를 나타내는 전치사구로 이해하여, 한국어에서도 자연스러운 부사격 '기쁨으로'를 사용했습니다.
- source_word: በቅድመ እግዚአብሔር / before the Lord
  english_pob_choice: before the Lord
  chosen_korean: 주 앞에서 기쁘게 받아들여져야 합니다
  alternatives_korean:
  - 주 앞에서
  - 주님 앞에서
  lexicon: 하나님 앞에서의 수용성
  rationale: 원문의 '받아들여지다'에 해당하는 수용의 의미를 살리기 위해, 단순한 위치 표현보다 결과적 의미를 드러내는 종결 구문으로 옮겼습니다.
theological_decisions:
- issue: '''heavenly tablets''의 수사적·권위적 기능'
  chosen_reading: 하늘의 판에 기록된 규정으로 번역해, 인간 전통이 아니라 하늘에서 기원한 규범임을 드러냈습니다.
  alternative_readings:
  - 하늘의 돌판에
  - 천상의 서판에
  rationale: 이 표현은 성경 본문 내에서 명령의 초월적 권위를 강조하므로, 독자가 천상 문서의 권위를 바로 이해하도록 했습니다.
  doctrine_reference: 계시의 권위와 하늘의 기록 문서라는 제2성전기 표현
