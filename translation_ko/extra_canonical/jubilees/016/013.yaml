  - severity: medium
    issue: 본문의 [a] 각주 표지에 대응하는 한국어 각주가 제공되지 않았습니다.
    rationale: 영어 POB 감사 추적에 있는 ‘Or Isaac was born’ 대안을 한국어 각주로 제공해야 표지와 주석의 구조가 일치합니다.
  - severity: low
    issue: ‘곡식의 첫 열매 절기’는 원문/영어의 추수 관련 수식을 충분히 드러내지 못합니다.
    rationale: 영어 감사 추적의 ‘firstfruits of the harvest’와 원문의 절기 표현을 따라 ‘추수의 첫 열매 절기’가 더 정확합니다.
