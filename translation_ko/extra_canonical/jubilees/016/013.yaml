  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
  footnotes:
  - marker: a
    text: Or 'Isaac was born'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 사라에게 말씀하신 대로 해 주셨습니다. 사라는 잉태하여 셋째 달, 그 달 중순에, 주께서 아브라함에게 말씀하신 때에 아들을 낳았습니다. 추수의 첫 열매 절기에 그가 태어났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이삭이 태어났습니다.”
    reason: 게에즈어 본문은 이 절의 마지막 문장에서 이름을 명시하지 않고 ‘그가 태어났다’고 합니다. 영어 POB 감사 추적의 대안 독법을 번역하되, 본문에는 원문의 비명시성을 유지합니다.
lexical_decisions:
- source_word: ወገብረ፡ ላቲ፡ በከመ፡ ይቤ።
  english_pob_choice: And he did to Sarah as he had said.
  chosen_korean: 그는 말씀하신 대로 사라에게 행하셨습니다.
  alternatives_korean:
  - 그는 말씀하신 대로 사라에게 그렇게 하셨습니다.
  - 그는 사라에게 그가 말씀하신 대로 행하셨습니다.
  lexicon: Ge'ez 동사 표현
  rationale: 주어를 분명히 살리면서도, 원문의 ‘말씀하신 대로 행하다’라는 이행 의미를 자연스러운 합쇼체로 옮겼습니다.
- source_word: ወፀንሰት፡ ወወለደት፡ ወልደ፡
  english_pob_choice: And she conceived and bore a son
  chosen_korean: 그녀는 잉태하여 … 아들을 낳았습니다.
  alternatives_korean:
  - 그녀는 잉태하고 아들을 낳았습니다.
  - 그녀는 수태하여 아들을 낳았습니다.
  lexicon: conceive / bore
  rationale: ‘잉태하다’는 임신의 시작을, ‘낳다’는 출산을 구분해 원문의 연속 동작을 보존했습니다.
- source_word: በወርኅ፡ ሣልስ፡ ወበመንፈቀ፡ ወርኅ፡
  english_pob_choice: in the third month, in the middle of the month
  chosen_korean: 셋째 달, 그 달의 한가운데
  alternatives_korean:
  - 셋째 달, 한 달의 중간에
  - 세 번째 달, 그 달 중간에
  lexicon: temporal phrase
  rationale: 달의 중간이라는 시간 표지를 직역에 가깝게 유지하되, 한국어 흐름을 위해 ‘그 달의 한가운데’로 다듬었습니다.
- source_word: በበዓለ፡ ቀዳሜ፡* ማእረር፡
  english_pob_choice: on the feast of the firstfruits of the harvest
  chosen_korean: 곡식의 첫 열매 절기에
  alternatives_korean:
  - 추수의 첫 열매 절기에
  - 첫 열매 거둠의 절기에
  lexicon: festival phrase
  rationale: 원문의 절기 명칭을 지나치게 해석하지 않고, ‘첫 열매’와 ‘절기’를 살려 성경적 축제 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘he’의 지시 대상 유지와 최종 출생 문장의 중성적 처리
  chosen_reading: 앞 문맥의 주어를 살려 마지막 문장은 ‘그는 태어났습니다’로 두어, 원문이 이름을 명시하지 않는 긴장과 English POB의 수정 방향을 반영했습니다.
  alternative_readings:
  - ‘이삭이 태어났습니다’
  - ‘그 아들이 태어났습니다’
  rationale: Geez 본문은 여기서 이름을 직접 쓰지 않으므로, 본문 수준에서는 명시를 피하는 편이 원문 충실도에 더 가깝습니다.
  doctrine_reference: source transparency / textual restraint
