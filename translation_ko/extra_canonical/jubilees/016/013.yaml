  to: 그리고 그는 사라에게 말씀하신 대로 해 주셨습니다. 사라는 잉태하여 셋째 달, 그 달 중순에, 주께서 아브라함에게 말씀하신 때에 아들을 낳았습니다. 추수의 첫 열매 절기에 그가 태어났습니다.[a]
