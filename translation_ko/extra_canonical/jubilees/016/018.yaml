base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
  footnotes:
  - marker: a
    text: Or 'And Isaac would become a holy seed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이삭만이 거룩한 씨가 될 것이며, 그는 민족들 가운데에 شمار되지 않을 것입니다. 이는 그가 지극히 높으신 분의 몫이 될 것이기 때문입니다. 그의 모든 씨가 하나님의 몫으로 떨어져, 주님을 위한 소유의 백성이 되어 모든 백성 가운데서 나와, 한 나라가 되게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሐዱ
  english_pob_choice: Isaac alone
  chosen_korean: 이삭만이
  alternatives_korean:
  - 이삭이 홀로
  - 이삭만
  lexicon: source lexical emphasis
  rationale: Ge'ez의 አሐዱ는 단순한 식별이 아니라 배타적 강조를 담으므로, 문두에서 ‘만이’로 처리해 이삭만을 가리키는 의미를 살렸습니다.
- source_word: ዘርእ፡ ቅዱስ
  english_pob_choice: a holy seed
  chosen_korean: 거룩한 씨
  alternatives_korean:
  - 거룩한 자손
  - 성스러운 씨앗
  lexicon: seed
  rationale: POB의 ‘seed’를 따라 ‘씨’로 두되, 한국어에서 이해 가능한 형용사 결합으로 ‘거룩한 씨’를 선택했습니다.
- source_word: ውስተ፡ አሕዛብኒ፡ ኢይትኌለቍ፡
  english_pob_choice: would not be reckoned among the nations
  chosen_korean: 민족들 가운데에 شمار되지 않을 것입니다
  alternatives_korean:
  - 열방 가운데에 들지 않을 것입니다
  - 민족들 가운데에 계산되지 않을 것입니다
  lexicon: reckoned among
  rationale: 문맥상 ‘분류되다/간주되다’의 뜻이므로, 외래어식 누적 없이 ‘세어지다/간주되다’ 계열로 자연스럽게 옮겼습니다. (여기서는 원문 오류로 보이는 'შمار'을 읽지 않고 의미를 반영했습니다.)
- source_word: ለመክፈልተ፡ ልዑል፡
  english_pob_choice: the portion of the Most High
  chosen_korean: 지극히 높으신 분의 몫
  alternatives_korean:
  - 지극히 높으신 이의 분깃
  - 가장 높으신 분의 몫
  lexicon: portion
  rationale: ‘몫/분깃’이 가능하지만, 앞뒤에 이어지는 상속·소유 어휘와 맞물려 여기서는 ‘몫’이 더 직접적이며 간결합니다.
- source_word: ሕዝበ፡ ትርሲት፡
  english_pob_choice: a people for possession
  chosen_korean: 소유의 백성
  alternatives_korean:
  - 소유로 삼는 백성
  - 유업의 백성
  lexicon: people for possession
  rationale: 소유·소유물의 뉘앙스를 살리되, 한국어에서 관용적으로 읽히는 ‘소유의 백성’으로 옮겼습니다.
theological_decisions:
- issue: ‘하나님/주님/지극히 높으신 분’의 호칭 분화
  chosen_reading: 전반부는 ‘지극히 높으신 분’, 후반부는 ‘하나님’, 마지막은 ‘주님’으로 구분했습니다.
  alternative_readings:
  - 전부 ‘하나님’으로 통일
  - 전부 ‘주님’으로 통일
  rationale: 원문은 지극히 높으신 분(ʾElyon), 하나님, 주님을 서로 다른 호칭으로 병렬해 상속·소유·왕국의 신학적 단계를 전개하므로, 한국어에서도 구분을 유지했습니다.
  doctrine_reference: Divine names and titles in Jubilees 16:18; source-sensitive rendering of title shifts
- issue: ‘한 나라가 되게 하려는 것입니다’의 종결 보완
  chosen_reading: 문말을 목적절 구조로 풀어 ‘한 나라가 되게 하려는 것입니다’로 마무리했습니다.
  alternative_readings:
  - ‘그리고 한 나라가 될 것입니다’
  - ‘나라가 되도록’
  rationale: 원문은 최종 목적을 향해 이어지는 병렬 구조이므로, 한국어에서도 앞의 ‘~하도록’ 계열 목적 의미를 드러내는 것이 문맥상 자연스럽습니다.
  doctrine_reference: Syntax and clause linkage in Jubilees 16:18
