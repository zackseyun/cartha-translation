translation:
  language: ko
  text: 그곳에서 그는 옮겨 가서 맹세의 우물 곁에 거하였고, 여섯째 달 한가운데에 주께서 사라를 찾아오셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ፡
  english_pob_choice: From there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 거기서
  - 그리하여
  lexicon: 직접 대응 부사구
  rationale: 출발점을 가리키는 표현이므로 ‘그곳에서’로 자연스럽게 옮겨, 앞선 이동을 이어 받는 느낌을 살렸습니다.
- source_word: ወኀደረ፡ ኀበ፡ ዐዘቅት፡ መሐላ።
  english_pob_choice: he dwelt by the Well of the Oath
  chosen_korean: 맹세의 우물 곁에 거하였고
  alternatives_korean:
  - 맹세의 우물에 살았고
  - 맹세의 우물가에 머물렀고
  lexicon: 거하다 / 지명구
  rationale: ‘거하다’는 지속적 거주를 나타내며, ‘Well of the Oath’는 원문과 기존 영어 번역을 따라 직역해 ‘맹세의 우물’로 옮겼습니다.
- source_word: ሐወጻ፡* እግዚአብሔር፡
  english_pob_choice: the Lord visited Sarah
  chosen_korean: 주께서 사라를 찾아오셨습니다
  alternatives_korean:
  - 주께서 사라를 방문하셨습니다
  - 주께서 사라를 살피셨습니다
  lexicon: visit / 찾아오다
  rationale: 문맥상 단순 방문보다 은혜로운 임재와 돌보심이 드러나는 ‘찾아오다’가 가장 무난하며, 기존 영어의 ‘visited’도 이 의미를 담을 수 있습니다.
theological_decisions:
- issue: ‘주’의 표기
  chosen_reading: 여기서는 야훼가 아니라 영어 POB의 ‘the Lord’에 맞춰 ‘주’로 번역했습니다.
  alternative_readings:
  - 야훼께서 사라를 찾아오셨습니다
  rationale: 이 구절의 게에즈 본문은 일반적 ‘주’를 가리키며, 인용된 히브리 성호 উদ্ধાર 여부를 확정할 근거가 부족하므로 본문 그대로 ‘주’를 유지했습니다.
  doctrine_reference: 고유명성/본문비평 원칙
