  - 여호와
  rationale: 이 본문은 창세기 21장의 제단/맹세 우물 전승을 가리키며, 텍스트 자체가 신적 이름을 직접 쓰므로 프로젝트 기준에 따라 ‘야훼’로 통일했습니다.
  doctrine_reference: source-based divine name policy
