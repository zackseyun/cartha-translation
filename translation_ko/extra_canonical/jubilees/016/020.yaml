  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: ko
  text: 그는 그곳에 야훼를 위하여 제단을 쌓았습니다. 야훼께서는 그를 구원하시고, 그의 나그네살이하는 땅에서 그를 기쁘게 하셨습니다. 그리고 그는 이 달에 그 제단 곁에서, 곧 그가 맹세의 우물에서 쌓은 제단 곁에서, 즐거움의 절기를 칠 일 동안 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: Yahweh
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: project default / source name of God
  rationale: Geʿez의 신적 호칭은 English POB의 Yahweh를 따르므로, 한국어도 프로젝트 기본값인 ‘야훼’로 옮겨 원문 고유명성을 보존했습니다.
- source_word: ፈላስነቱ
  english_pob_choice: his sojourning
  chosen_korean: 나그네살이하는 땅
  alternatives_korean:
  - 그의 유랑의 땅
  - 그의 거류의 땅
  lexicon: Leslau / source sense
  rationale: 단순한 이동이 아니라 임시 거주자 상태를 가리키므로, ‘sojourning’의 의미를 살려 ‘나그네살이하는 땅’으로 옮겼습니다.
- source_word: በዐዘቅተ ፡ መሐላ
  english_pob_choice: at the Well of the Oath
  chosen_korean: 맹세의 우물
  alternatives_korean:
  - 브엘세바
  - 맹세 우물
  lexicon: Leslau / English POB audit trail
  rationale: Geʿez가 히브리어 지명을 뜻풀이한 표현이므로, English POB의 직역 방침에 맞춰 ‘맹세의 우물’로 유지했습니다.
- source_word: በዓለ ፡ ትፍሥሕት
  english_pob_choice: a festival of joy
  chosen_korean: 즐거움의 절기
  alternatives_korean:
  - 기쁨의 축제
  - 환희의 절기
  lexicon: source sense
  rationale: 행사의 성격이 단순한 잔치가 아니라 절기이므로, ‘festival’의 종교적·기념일적 뉘앙스를 살려 ‘절기’로 옮겼습니다.
theological_decisions:
- issue: divine name rendering
  chosen_reading: 야훼
  alternative_readings:
