translation:
  language: ko
  text: 그는 서약의 우물 곁에 자기가 세운 제단 근처에 있었으며, 자기와 자기의 종들을 위해 초막들을 지었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅሩበ፡ ምሥዋዕ፡ ዘሐነጸ፡ ኀበ፡'° ዐዘቅተ፡ መሐላ
  english_pob_choice: near the altar that he had built at the Well of the Oath
  chosen_korean: 서약의 우물 곁에 자기가 세운 제단 근처
  alternatives_korean:
  - 맹세의 우물 곁에 그가 세운 제단 근처
  - 서약의 우물에 그가 세운 제단 가까이
  lexicon: altar=제단; Well of the Oath=서약의 우물
  rationale: Ge'ez는 '그가 세운 제단'이 '서약의 우물'과 가까이 있음을 말하므로, 영어의 근접 관계를 따라 자연스럽게 옮기되 고유 지명은 직역형으로 유지했습니다.
- source_word: ዐዘቅተ፡ መሐላ
  english_pob_choice: Well of the Oath
  chosen_korean: 서약의 우물
  alternatives_korean:
  - 맹세의 우물
  - 서원의 우물
  lexicon: proper place name
  rationale: 히브리적 서약 개념을 드러내면서도 지명 기능을 살리기 위해 '서약'을 택했습니다.
- source_word: ምጽላላተ፡
  english_pob_choice: booths
  chosen_korean: 초막들
  alternatives_korean:
  - 장막들
  - 숙영지
  lexicon: booths/temporary shelters
  rationale: 절기적 임시 거처라는 의미를 보존하기 위해 한국 교회 전통어 '초막'을 사용했습니다.
- source_word: ሎቱ፡ ወለአግብርቲሁ
  english_pob_choice: for himself and for his servants
  chosen_korean: 자기와 자기의 종들을 위해
  alternatives_korean:
  - 자신과 그의 종들을 위해
  - 그와 그의 종들을 위해
  lexicon: self and servants
  rationale: 주어의 자기 지시와 종속 관계를 분명히 드러내기 위해 '자기'를 반복해 원문의 소유 관계를 보존했습니다.
theological_decisions:
- issue: 절기 초막의 의미를 드러내는 번역 선택
  chosen_reading: '''booths''를 ''초막들''로 옮겨, 단순한 천막이 아니라 절기적·예배적 임시 거처의 뉘앙스를 유지했습니다.'
  alternative_readings:
  - '''장막들''로 일반화'
  - '''오두막들''로 일상화'
  rationale: 본문은 실제 거주용 건조물보다 절기적 표지를 가리키므로, 너무 일상적인 표현은 स्रोत의 예배적 배경을 약화시킵니다.
  doctrine_reference: 절기 전승과 성막/초막 모티프의 표지성
