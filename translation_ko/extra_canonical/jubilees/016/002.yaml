- from: 그러자 사라가 웃었습니다. 우리가 아브라함과 함께 이 말을 했다는 것을 들었기 때문입니다. 그리고 우리는 그녀를 꾸짖었습니다.[a]
  to: 사라는 우리가 아브라함과 이 말씀을 나누었다는 것을 듣고 웃었습니다. 그리고 우리는 사라를 꾸짖었습니다.
