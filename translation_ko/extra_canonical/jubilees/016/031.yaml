  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: ko
  text: 아브라함은 종려나무 가지들과 아름다운 나무의 열매를 가져다가, 매일 그 가지들을 들고 제단 주위를 일곱 번 돌았으며, 아침에는 기쁨으로 자기 하나님께 모든 일에 대해 찬양하고 감사드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: branches of palm trees
  english_pob_choice: branches of palm trees
  chosen_korean: 종려나무 가지들
  alternatives_korean:
  - 야자나무 가지들
  - 종려 가지들
  lexicon: branches of palm trees
  rationale: 게으즈 원문의 ‘종려나무 가지’에 직접 대응하면서 한국어 성경 문맥에서 자연스러운 식물명으로 옮겼습니다.
- source_word: fruit of beautiful trees
  english_pob_choice: fruit of beautiful trees
  chosen_korean: 아름다운 나무의 열매
  alternatives_korean:
  - 아름다운 나무들의 열매
  - 아름다운 나무에서 난 열매
  lexicon: fruit of beautiful trees
  rationale: 원문의 ‘좋은/아름다운 나무’와 그 열매라는 구조를 그대로 살려, 시적인 병렬을 유지했습니다.
- source_word: went around the altar
  english_pob_choice: went around the altar
  chosen_korean: 제단 주위를 … 돌았으며
  alternatives_korean:
  - 제단을 둘러 돌았으며
  - 제단 주위를 다녔으며
  lexicon: went around
  rationale: ‘둘러 돌다’의 동작을 자연스럽게 살리되, 제단 주변을 반복적으로 도는 행위를 분명히 드러냈습니다.
- source_word: praised and gave thanks
  english_pob_choice: praised and gave thanks
  chosen_korean: 찬양하고 감사드렸습니다
  alternatives_korean:
  - 찬양하고 감사했습니다
  - 찬미하고 감사드렸습니다
  lexicon: praised and gave thanks
  rationale: 하나님께 드리는 행위라는 점을 살리기 위해 ‘감사드리다’를 택했고, ‘찬양’은 원문의 두 동사를 간결하게 포괄하도록 했습니다.
theological_decisions:
- issue: Source’s repeated ritual action and devotional posture
  chosen_reading: 아브라함이 가지들을 들고 제단 주위를 일곱 번 도는 행위와, 아침에 기쁨으로 하나님께 찬양과 감사를 드리는 경건한 행동을 그대로 서술형으로 옮겼습니다.
  alternative_readings:
  - 의례적 행위를 약화시켜 단순한 산책처럼 표현하는 것
  - ‘기쁨으로’를 감정 부사로 약화시키는 것
  rationale: 원문은 아브라함의 제의적 반복 동작과 감사의 태도를 분명히 제시하므로, 그 긴장과 경건함을 보존하는 쪽이 문맥상 적절합니다.
  doctrine_reference: 서사 본문에서의 예배적 행위 묘사 보존
- issue: ‘his God’의 지시 대상
  chosen_reading: ‘자기 하나님’으로 옮겨, 아브라함 개인의 언약적 하나님을 가리키는 표현을 유지했습니다.
  alternative_readings:
  - ‘하나님’으로만 단순화
  - ‘그의 하나님’으로 직역
  rationale: 게으즈 원문의 소유 관계를 반영하되 한국어로는 자연스러운 ‘자기 하나님’이 더 명확합니다.
  doctrine_reference: 서사 내 인칭 소유 표현 보존
