base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
  footnotes:
  - marker: a
    text: Or 'that they should remove them and uproot them and execute their judgment like the judgment of Sodom, and that no seed of his should be left'.
    reason: previous_rendering
  - marker: b
    text: Or 'until his time'.
    reason: previous_rendering
translation:
  language: ko
  text: 아담 시대부터 그때까지[b], 한 사람이 자기 딸들과 동침하였기 때문입니다. 보십시오, 하늘의 판들에는 그의 모든 씨에 관하여, 그들을 제거하고 뿌리 뽑고, 그들의 심판을 소돔의 심판처럼 집행하며, 정죄의 날에 그의 씨를 땅에 하나도 남기지 말라고 명령되고 결정되어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들을 제거하고 뿌리 뽑고 그들의 심판을 소돔의 심판처럼 집행하며, 그의 씨가 하나도 남지 않게 하라고.”
    reason: 이전 번역의 대안적인 절 연결과 마지막 절의 결과문 독법을 표시합니다.
  - marker: b
    text: 또는 “그의 때까지.”
    reason: አሜሁ를 문자적으로 옮긴 대안입니다. 본문은 시간 부사 관용구에 따라 ‘그때까지’로 옮깁니다.
lexical_decisions:
- source_word: እመዋዕለ፡ አዳም፡ ... አሜሁ፡
  english_pob_choice: from the days of Adam until that time
  chosen_korean: 아담의 날들부터 그때까지
  alternatives_korean:
  - 아담의 날부터 그때까지
  - 아담 시대부터 그때까지
  lexicon: አሜሁ adverbial idiom; እመዋዕለ denotes 'days/time of'
  rationale: አሜሁ는 ‘그의 때’보다 ‘그때’/‘그 시점’이라는 시간 부사로 읽는 것이 주어진 영어 감사본과 원문 관용법에 더 맞습니다.
- source_word: በከበ፡ ብእሲ፡ ምስለ፡ አዋልዲሁ
  english_pob_choice: because a man lay with his daughters
  chosen_korean: 어떤 사람이 자기 딸들과 동침하였기 때문입니다
  alternatives_korean:
  - 한 남자가 자기 딸들과 관계하였기 때문입니다
  - 어떤 남자가 그의 딸들과 잠자리를 같이하였기 때문입니다
  lexicon: መዋሕይ/동침 계열의 성적 결합 표현
  rationale: 원문의 직설적 성행위 진술을 완화하지 않고, 문맥상 근친적 결합을 분명히 드러내는 ‘동침하다’를 택했습니다.
- source_word: ጽላተ፡ ሰማይ
  english_pob_choice: the heavenly tablets
  chosen_korean: 하늘 판
  alternatives_korean:
  - 하늘의 판
  - 하늘의 석판
  - 하늘 판들
  lexicon: heavenly tablets fixed phrase in Jubilees
  rationale: 쌍수적·고정 표현인 ‘heavenly tablets’를 관용적으로 ‘하늘 판’으로 옮겨, 본서의 문서-법정 이미지와 하늘 기록의 뜻을 유지했습니다.
- source_word: ተአዘዘ፡ ወተቈረጸ፡ ... ኵነኔሆሙ
  english_pob_choice: it was commanded and decreed ... that their judgment be executed
  chosen_korean: 명령되고 결정되었으니 ... 그들의 심판이 집행되게 하고
  alternatives_korean:
  - 명령되고 기록되었으니 ... 그들의 심판이 행해지게 하고
  - 명령되고 선포되었으니 ... 그들의 판결이 시행되게 하고
  lexicon: paired legal verbs; ኵነኔ = judgment
  rationale: 원문은 ‘명령되다’와 ‘결정되다’의 병렬로 법적 확정성을 강조하므로, 이를 그대로 살려 ‘명령되고 결정되었으니’로 옮겼습니다.
- source_word: ያአትትሙ፡ ወከመ፡ ይሠርዎሙ፡ ወከመ፡ ይገበር
  english_pob_choice: that he should remove them and uproot them, and that their judgment be executed
  chosen_korean: 그들을 제거하고 뿌리 뽑으며, ... 그들의 심판이 집행되게 하고
  alternatives_korean:
  - 그들을 없애고 뿌리째 뽑으며 ... 그들의 심판이 시행되게 하고
  - 그들을 없애고 뽑아내며 ... 그들의 판결이 내려지게 하고
  lexicon: sequential destructive verbs; passive/causative legal clause
  rationale: ‘제거하다/뿌리 뽑다’의 중첩은 단순 삭제가 아니라 완전한 소멸을 뜻하므로 두 동사를 모두 살렸고, ‘집행되게 하다’로 판결 실행의 수동성을 보존했습니다.
- source_word: ኢያትርፍ፡ ሎቱ፡ ኵሎ፡ ዘርአ፡
  english_pob_choice: that no seed of his should be left
  chosen_korean: 그의 씨가 땅에 하나도 남지 않게
  alternatives_korean:
  - 그의 씨가 하나도 남지 않게
  - 그의 후손이 하나도 남지 않게
  lexicon: ዘርእ seed/offspring
  rationale: ‘씨’는 후손을 가리키는 원문 상의 직역적 표현이므로 유지하되, 한국어 문장에서는 자연스럽게 ‘하나도 남지 않게’로 마무리했습니다.
theological_decisions:
- issue: 하늘 판(heavenly tablets)의 권위와 법정적 이미지
  chosen_reading: 하늘에 있는 기록판/판결판으로서, 죄에 대한 처분이 이미 공적으로 확정된 것으로 표현했습니다.
  alternative_readings:
  - 단순한 비유적 기록
  - 천상 비밀서의 상징
  rationale: 주석적 전통상 본서의 핵심 이미지이므로, ‘하늘 판’으로 옮겨 하늘의 기록과 판결이 결합된 법정적 긴장을 보존했습니다.
  doctrine_reference: Jubilees heavenly tablets motif
