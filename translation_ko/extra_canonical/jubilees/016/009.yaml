  source_fidelity: 원문의 시간 관용구는 ‘그때까지’로 옮긴 것이 적절합니다. 다만 하늘의 판들은 ‘그의 모든 씨에 관하여’ 명령과 결정이 보존된 장소이며, 원문의 연속된 동사는 단수 행위자에 의한 제거·뿌리 뽑음과 심판의 집행, 그리고 씨를 남기지 않음이라는 명령을 나타냅니다. 초안의 ‘남지 않게’는 마지막 능동 동사의 행위자성을 다소 약화하므로 명령문의 능동형으로 보완했습니다.
