  lexicon: Geez እምነ = from, ወሖረ = went/moved
  rationale: ‘from Hebron’과 ‘moved/went’를 한국어 서술 관용에 맞게 압축하되, 출발점을 분명히 드러내기 위해 ‘헤브론을 떠나’로 옮겼습니다.
- source_word: (revised completion) between Kadesh and Shur in the mountains of Gerar
  english_pob_choice: dwelt between Kadesh and Shur in the mountains of Gerar
  chosen_korean: 가데스와 수르 사이, 그랄의 산지에 머물렀습니다
