translation:
  language: ko
  text: 그리고 그 달에 아브라함은 헤브론을 떠나 그랄 산지에서 가데스와 수르 사이에 머물렀습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이전 번역문은 “그리고 이 달에 아브라함은 헤브론을 떠나 갔습니다”라고만 옮겼습니다.
    reason: 영어 POB 감사 기록의 각주가 보존하는 이전의 불완전한 번역 표현을 한국어로 명확히 제시합니다. 이는 원문 이문으로 오해되지 않도록 ‘이전 번역문’이라고 밝힙니다.
lexical_decisions:
- source_word: በዝንቱ ወርኅ
  english_pob_choice: And in this month
  chosen_korean: 그리고 이 달에
  alternatives_korean:
  - 이 달에
