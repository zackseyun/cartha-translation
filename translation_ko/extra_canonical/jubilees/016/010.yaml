  alternative_readings:
  - 원전 조각에 보이는 앞부분만 옮겨 ‘헤브론을 떠나고’로 끝냄
  rationale: 영어 POB 감사 기록이 원문 누락과 수정 완료를 명시하므로, 완전한 절 본문을 기준으로 자연스럽게 복원하는 것이 독자 이해에 합당합니다.
