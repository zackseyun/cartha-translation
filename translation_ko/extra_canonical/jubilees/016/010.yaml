translation:
  language: ko
  text: 그리고 이 달에 아브라함은 헤브론을 떠나 가데스와 수르 사이, 그랄의 산지에 머물렀습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዝንቱ ወርኅ
  english_pob_choice: And in this month
  chosen_korean: 그리고 이 달에
  alternatives_korean:
  - 이 달에
  - 그 달에
  lexicon: Geez ወርኅ = month
  rationale: 직전 문맥의 달을 가리키는 지시를 살려 ‘이 달에’로 옮겼고, 이야기 전개를 자연스럽게 잇기 위해 접속사 ‘그리고’를 보탰습니다.
- source_word: አብርሃም፡ እምነ፡ ኬብሮን፡ ወሖረ፡
  english_pob_choice: Abraham moved from Hebron, and went
  chosen_korean: 아브라함은 헤브론을 떠나
  alternatives_korean:
  - 아브라함은 헤브론에서 옮겨 가
  - 아브라함은 헤브론에서 떠나
  lexicon: Geez እምነ = from, ወሖረ = went/moved
  rationale: ‘from Hebron’과 ‘moved/went’를 한국어 서술 관용에 맞게 압축하되, 출발점을 분명히 드러내기 위해 ‘헤브론을 떠나’로 옮겼습니다.
- source_word: (revised completion) between Kadesh and Shur in the mountains of Gerar
  english_pob_choice: dwelt between Kadesh and Shur in the mountains of Gerar
  chosen_korean: 가데스와 수르 사이, 그랄의 산지에 머물렀습니다
  alternatives_korean:
  - 가데스와 수르 사이 그랄의 산지에서 살았습니다
  - 가데스와 수르 사이의 그랄 산지에 거했습니다
  lexicon: Hebrew/Greek audit context links this line to Gen 20:1 locale
  rationale: 수정된 영어 본문이 요구하는 후반부 지리표현을 그대로 반영했고, ‘dwelt’는 지속적 거주를 나타내는 ‘머물렀습니다’로 번역했습니다.
theological_decisions:
- issue: 본문 보완에 따른 지리 진술의 범위
  chosen_reading: 헤브론에서 출발하여 가데스와 수르 사이, 그랄의 산지에 거주했다는 두 단계 이동을 모두 본문으로 반영했습니다.
  alternative_readings:
  - 원전 조각에 보이는 앞부분만 옮겨 ‘헤브론을 떠나고’로 끝냄
  rationale: 영어 POB 감사 기록이 원문 누락과 수정 완료를 명시하므로, 완전한 절 본문을 기준으로 자연스럽게 복원하는 것이 독자 이해에 합당합니다.
  doctrine_reference: 본문비평/번역 복원 원칙
