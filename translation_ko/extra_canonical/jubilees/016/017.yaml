  text: 우리는 그를 축복하고, 그가 여섯 아들을 더 낳고 죽기 전에 그들을 볼 때까지 죽지 않을 것과 이삭에게서 그의 이름과 씨가 불릴 것이라고, 그에 관하여 정해진 모든 것을 그에게 말하였습니다.
