  text: the covenant that is established forever. And in the sixth year of the fourth week we came to Abraham at the Well of the Oath, and we appeared to him as we had told Sarah that we would return to her and she would conceive a son.
translation:
  language: ko
  text: 영원히 확립된 언약입니다. 그리고 넷째 주의 여섯째 해에 우리는 ‘맹세의 우물’에서 아브라함에게 갔고, 우리가 다시 사라에게 올 것이며 사라가 아들을 잉태할 것이라고 사라에게 말한 대로 그에게 나타났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '*ኪዳን፡ እንተ፡* ተሠርዐት፡'
  english_pob_choice: the covenant that is established forever
  chosen_korean: “영원히 확립된” 언약
  alternatives_korean:
  - 영원히 세워진 언약
  - 영원히 정해진 언약
  - 영원한 언약
  lexicon: ኪዳን / establish
  rationale: 원문의 핵심은 언약이 영구적으로 확정·세워졌다는 점이므로, ‘확립된’으로 안정성과 공적 성립을 함께 살렸습니다. ‘영원한’만으로는 ‘established’의 동작성을 덜 드러냅니다.
- source_word: ወበዓመት፡ ሳድስ፡ ዘሱባዔ፡ ራብዕ፡
  english_pob_choice: in the sixth year of the fourth week
  chosen_korean: 넷째 주의 여섯째 해
  alternatives_korean:
  - 넷째 주의 여섯째 해에
  - 네 번째 주의 여섯째 해
  - 넷째 주의 제6년
  lexicon: temporal calendrical expression
  rationale: 희년문헌의 주/해 계산을 한국어로 자연스럽게 옮기되, 원문의 계산 구조(주-해)를 보존했습니다.
- source_word: ኀበ፡ ዐዘቅተ፡ መሐላ፡
  english_pob_choice: at the Well of the Oath
  chosen_korean: ‘맹세의 우물’
  alternatives_korean:
  - ‘맹세의 샘’
  - ‘서약의 우물’
  - 브엘세바
  lexicon: place-name / paraphrase
  rationale: 원문은 지명 브엘세바의 의미를 풀어 쓴 표현이므로, 의미 번역인 ‘맹세의 우물’을 유지했습니다. 전통 지명으로 환원하면 원문의 설명성을 가립니다.
- source_word: ከመ፡ ንገብአ፡ ኀቤሃ፡ ወይእቲኒ፡
  english_pob_choice: we would return to her and she would conceive a son
  chosen_korean: 우리가 사라에게 돌아가면 그녀가 아들을 잉태할 것
  alternatives_korean:
  - 우리가 사라에게 돌아가면 그녀가 아들을 가지게 될 것
  - 우리가 사라에게 돌아가면 그녀가 아들을 임신할 것
  - 우리가 사라에게 돌아가면 그녀가 아들을 낳을 것
  lexicon: conceive / return
  rationale: 원문과 영어 모두 ‘잉태하다’의 의미이므로, 출산이 아니라 임신 시작을 뜻하는 동사를 택했습니다. ‘돌아가다’는 주어가 하나님/천사적 방문자임을 암시하는 원문의 내러티브를 그대로 살립니다.
theological_decisions:
- issue: 사라가 ‘아들을 잉태할 것’이라는 예고의 표현
  chosen_reading: 예고된 잉태를 미래형으로 평이하게 옮겨, 약속의 성취가 아직 도래하지 않았음을 드러냈습니다.
  alternative_readings:
  - ‘잉태하였다’로 완료된 성취처럼 옮김
  - ‘아들을 갖게 될 것이다’로 완곡하게 번역
  rationale: 원문과 POB 영어는 예고/약속의 시제를 분명히 하므로, 완료형으로 바꾸지 않고 미래 지향의 약속으로 보존했습니다.
  doctrine_reference: 서사적 예고와 약속의 시제 보존
