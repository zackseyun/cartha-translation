  to: 영원히 확립된 언약입니다. 그리고 넷째 주의 여섯째 해에 우리는 ‘맹세의 우물’에서 아브라함에게 갔고, 우리가 다시 사라에게 올 것이며 사라가 아들을 잉태할 것이라고 사라에게 말한 대로 그에게 나타났습니다.
