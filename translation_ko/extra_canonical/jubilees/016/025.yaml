    issue: ‘온 마음과 온 영으로’
    rationale: 원문의 ‘마음’과 ‘혼/영혼’의 병렬에서 ነፍስ은 여기서 별개의 ‘영’이라기보다 사람의 전 존재를 가리키는 ‘영혼/soul’에 가깝습니다. ‘영혼’이 원문의 병렬과 한국어 성경 문체를 더 잘 보존합니다.
  - severity: low
