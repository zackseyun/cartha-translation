  - 온 마음과 온 생명으로 기뻐했습니다
  lexicon: heart / soul
  rationale: ‘heart’와 ‘soul’의 이중 표현을 유지하되, 현대 한국어에서 자연스러운 ‘영’으로 옮겨 내적 전인성을 드러냈습니다.
- source_word: ወኵሎሙ፡ እለ፡ ውስተ፡ ቤቱ፡
  english_pob_choice: he and all who were in his house
  chosen_korean: 그와 그의 집에 있는 모든 사람도 그랬습니다
  alternatives_korean:
  - 그와 그의 집안에 있는 모든 사람도 그랬습니다
  - 그와 그의 집에 있는 모든 이들도 그랬습니다
  lexicon: house / household
  rationale: ‘집’이 건물보다 가문·가족 공동체를 포함하는 뉘앙스를 가지므로, 문맥상 ‘집에 있는 모든 사람’으로 풀어 가정 공동체를 드러냈습니다.
- source_word: አልቦ፡
  english_pob_choice: there was no foreigner with him, nor anyone uncircumcised
  chosen_korean: 그에게는 이방인도, 할례받지 않은 사람도 함께 있지 않았습니다
  alternatives_korean:
  - 그와 함께한 이방인도, 할례받지 않은 자도 없었습니다
  - 그에게는 타국인도, 무할례자도 없었습니다
  lexicon: foreigner / uncircumcised
  rationale: ‘이방인’과 ‘할례받지 않은 사람’은 본문의 배타적 경계를 드러내는 핵심 대비이므로, 종교적·사회적 함의를 유지하는 표준 번역을 택했습니다.
theological_decisions:
- issue: 집회/공동체의 순수성 경계
  chosen_reading: 절기를 지키는 행위와 함께, 집 안에 있는 사람들만 참여하고 이방인과 무할례자는 배제된 상태로 묘사했습니다.
  alternative_readings:
  - 단순한 손님 부재로 완화해서 읽기
  - 의례적 정결만을 강조해 공동체 경계를 약화시키기
  rationale: 원문과 영어 본문 모두 참여 범위를 제한하는 구조를 분명히 하므로, 그 사회·의례적 경계를 희석하지 않고 그대로 반영했습니다.
  doctrine_reference: 서술 본문 내 의례적 경계 표현; 신학 교리화보다 문맥 충실성 우선
