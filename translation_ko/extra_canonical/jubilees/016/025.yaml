  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: ko
  text: 그는 온 마음과 온 영혼으로 기뻐하며 이 절기를 이레 동안 지켰습니다. 그와 그의 집에 있는 모든 사람이 그러했습니다. 그와 함께 있는 이방인이나 할례받지 않은 사람은 아무도 없었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이방인’과 ‘할례받지 않은 사람’은 서로 겹칠 수 있으나, 원문은 두 표현을 병렬하여 언급합니다.
    reason: 병렬된 두 집단 표현을 하나로 축소하지 않고, 그 관계가 반드시 상호 배타적인 것은 아님을 독자에게 알립니다.
