  - 이 절기를 칠 일 동안 지켰으며
  lexicon: feast / seven days
  rationale: 원문의 절기와 기간을 그대로 살리되, 한국어 성경 문맥에 자연스러운 ‘이레 동안’으로 옮겨 반복되는 시간 표현을 간결하게 반영했습니다.
- source_word: ይትፌሣሕ፡ በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ፡
  english_pob_choice: rejoicing with all his heart and with all his soul
  chosen_korean: 온 마음과 온 영으로 기뻐했습니다
  alternatives_korean:
