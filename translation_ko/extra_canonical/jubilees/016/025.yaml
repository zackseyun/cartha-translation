  source_fidelity: 핵심 내용은 대체로 충실합니다. 다만 ልቡ/ነፍሱ의 병렬은 ‘마음과 영혼’으로 옮기는 것이 ‘마음과 영’보다 원문의 anthropological 표현을 더 정확히 보존합니다. 또한 ‘그와 그의 집에 있는 모든 사람도 그랬습니다’는 원문의 주어 병렬을 한국어에서 다소 불명확하게 만듭니다.
  naturalness: 합쇼체와 전반적 문체는 적절하지만, ‘그와 그의 집에 있는 모든 사람도 그랬습니다’는 앞 문장의 ‘기뻐했습니다’와 연결되면서 다소 구어적이고 지시 대상이 흐립니다. ‘그와 그의 집에 있는 모든 사람이 그러했습니다’가 더 자연스럽고 명료합니다.
  terminology: ‘절기’, ‘이방인’, ‘할례받지 않은 사람’은 적절합니다. 다만 ነፍስ(soul)에 대응하는 ‘영’은 ‘영혼’보다 의미 범위가 좁아질 수 있으므로 ‘영혼’으로 고칩니다.
  issues:
