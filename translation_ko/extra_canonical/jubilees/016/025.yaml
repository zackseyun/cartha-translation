  revised_text: 그는 온 마음과 온 영혼으로 기뻐하며 이 절기를 이레 동안 지켰습니다. 그와 그의 집에 있는 모든 사람이 그러했습니다. 그와 함께 있는 이방인이나 할례받지 않은 사람은 아무도 없었습니다.[a]
