  verdict: revise
  source_fidelity: 첫 문장은 게에즈어의 동사 순서와 수식 관계를 일부 흐립니다. በሥጋሆሙ(‘그들의 육체로/육체 안에서’)는 음행(ይዜምዉ)을 수식하는데, 현 번역은 ‘자기 육체를 더럽히고’로 연결하여 음행의 영역을 첫 동사에 붙였습니다. 또한 ‘음행’이 ‘땅에서’를 수식하는 듯한 배열이 되었습니다. 수정문은 음행이 ‘자기 육체로’ 이루어졌고 부정이 ‘땅에서’ 행해졌다는 관계를 보존합니다. 후반부의 ‘그 곳들’은 심판의 대상인 장소와 그곳에서의 행위를 자연스럽게 연결합니다.
  naturalness: ‘그들이 … 행한 그 곳들에 심판을 내리실 것입니다’는 현대 표준 한국어의 격식 있는 문체로 자연스럽고, ‘심판을 집행하다’보다 성서 한국어에서 더 관용적인 표현입니다. ‘자기 육체로 음행하며’는 다소 직역적이지만 원문의 수식 범위를 보존하는 데 필요한 절제된 표현입니다.
  terminology: ‘음행’, ‘부정’, ‘심판’, ‘소돔’, ‘주님’은 문맥과 등록에 적절합니다. 근거가 제공되지 않은 [a][b] 표지는 삭제하여 본문과 주석 체계의 불일치를 피합니다.
