  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: ko
  text: 그들은 자기 육체를 더럽히고 땅에서 음행을 행하며 부정을 저질렀습니다. 그와 같이 주님께서는 그들이 소돔의 부정에 따라 행한 곳들에 심판을 집행하실 것이며, 소돔을 심판하신 것과 같이 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይትራኩሱ፡ ወይዜምዉ፡* በሥጋሆሙ፡
  english_pob_choice: they defiled themselves and committed fornication in their flesh
  chosen_korean: 그들은 자기 육체를 더럽히고
  alternatives_korean:
  - 그들은 몸을 더럽히고
  - 그들은 육체로 더럽혀지고
  lexicon: 더럽히다 / 육체
  rationale: 첫 동사는 도덕적·의례적 오염을 함께 담는 ‘더럽히다’가 적절하고, በሥጋሆሙ는 행위의 영역을 가리키므로 ‘자기 육체를’로 옮겼습니다.
- source_word: ወይገብሩ፡ ርኵሰ፡ በዲበ፡ ምድር።
  english_pob_choice: and did uncleanness on the earth
  chosen_korean: 땅에서 음행을 행하며 부정을 저질렀습니다
  alternatives_korean:
  - 땅에서 부정을 행했습니다
  - 땅 위에서 더러운 일을 했습니다
  lexicon: 음행 / 부정
  rationale: 영어 본문의 ‘uncleanness’는 단순한 위생이 아니라 성적·종교적 타락을 포함하는 소스이므로 ‘부정’으로, 앞의 행위는 문맥상 음행을 분명히 드러내어 ‘음행을 행하다’로 살렸습니다.
- source_word: ይገብር፡ እግዚአብሔር፡ ኵነኔ፡ በመካናት፡
  english_pob_choice: the Lord will execute judgment on the places
  chosen_korean: 주님께서는 … 곳들에 심판을 집행하실 것이며
  alternatives_korean:
  - 주님께서는 … 장소들에 심판을 내리실 것이며
  - 주님께서는 … 지역들에 판결을 실행하실 것이며
  lexicon: 심판을 집행하다
  rationale: ኵነኔ는 단순한 ‘판결’보다 공적 실행의 뉘앙스가 있어, POB의 ‘execute judgment’를 따라 ‘심판을 집행하다’로 옮겼습니다.
- source_word: በከመ፡ ርኵሶሙ፡ ለሰዶም፡ ከመ፡ ኰነና፡*
  english_pob_choice: just as he judged Sodom
  chosen_korean: 소돔을 심판하신 것과 같이 하실 것입니다
  alternatives_korean:
  - 소돔을 심판하신 것처럼 하실 것입니다
  - 소돔에 내리신 심판과 같이 하실 것입니다
  lexicon: 소돔을 심판하다
  rationale: 마지막 비교절은 동사의 반복을 살려 ‘심판하신 것과 같이’로 번역해, 앞의 실행될 심판과 소돔 심판의 평행을 분명히 했습니다.
theological_decisions:
- issue: ‘주님’과 심판 주체 표현
  chosen_reading: እግዚአብሔር을 ‘주님’으로 옮기고, 미래형으로 하나님의 계속되는 심판 행위를 표현했습니다.
  alternative_readings:
  - 하나님
  - 야훼
  rationale: 외경/제2성전 문맥에서 POB의 본문 표기를 따르는 것이 자연스럽고, 여기서는 직접적인 야훼 인용 표지가 없어 ‘주님’이 무난합니다.
  doctrine_reference: divine name rendering policy; apocrypha/proto-canonical contextual usage
