translation:
  language: ko
  text: 아브라함은 여드레째 되는 날에 그의 아들 이삭에게 할례를 행하였습니다. 그는 영원히 제정된 규례에 따라 그렇게 할례를 받은 첫사람이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስሐቅ
  english_pob_choice: his son
  chosen_korean: 이삭
  alternatives_korean:
  - 그의 아들
  lexicon: 고유명사
  rationale: 원문에 직접 나타난 고유명사 이삭을 본문에 살렸고, 이어지는 소유 표현으로 관계를 분명히 했습니다.
- source_word: ወከበቦ፡ አብርሃም፡ ለወልዱ
  english_pob_choice: And Abraham circumcised his son
  chosen_korean: 아브라함은 ... 그의 아들 이삭에게 할례를 행하였습니다
  alternatives_korean:
  - 아브라함은 ... 그의 아들을 할례하였습니다
  - 아브라함은 ... 그의 아들에게 할례를 베풀었습니다
  lexicon: 할례하다
  rationale: Geez 동사는 할례 행위를 직접 가리키므로, 관용적으로 ‘할례를 행하다’로 옮겨 행위의 직접성을 유지했습니다.
- source_word: እመ፡ ሳምንት፡
  english_pob_choice: on the eighth day
  chosen_korean: 여드레째 되는 날에
  alternatives_korean:
  - 여덟째 날에
  - 8일째 되는 날에
  lexicon: 서수 표현
  rationale: 히브리적 날짜 표현을 자연스러운 현대 한국어로 옮기되, ‘여드레째’로 고대적 리듬을 과도하게 고정하지 않았습니다.
- source_word: በከመ፡ / ሥርዓት ፡ ዘተሠርዓ ፡ ለዘለዓለም
  english_pob_choice: according to the ordinance ordained forever
  chosen_korean: 영원히 제정된 규례에 따라
  alternatives_korean:
  - 영원히 제정된 규례대로
  - 영원히 정해진 규례에 따라
  lexicon: 규례
  rationale: 문맥상 단순한 ‘방법’이 아니라 영구적으로 제정된 규범을 가리키므로 ‘규례’로 옮겼고, ‘따라’로 preposition의 순응 의미를 살렸습니다.
theological_decisions:
- issue: ‘the first to be circumcised’의 의미
  chosen_reading: 그는 영원히 제정된 규례에 따라 그렇게 할례를 받은 첫사람이었습니다
  alternative_readings:
  - 그는 할례를 받은 첫사람이었습니다
  - 그는 그 규례에 따라 처음으로 할례를 받았습니다
  rationale: 원문은 단순한 최초성만이 아니라 ‘영원히 제정된 규례’와의 결속을 강조하므로, 최초성과 규례 준수를 함께 드러내도록 옮겼습니다.
  doctrine_reference: 언약 표지로서의 할례와 율례의 지속성
