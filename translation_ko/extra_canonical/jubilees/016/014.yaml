revisions:
- from: 아브라함은 여드레째 되는 날에 그의 아들 이삭에게 할례를 행하였습니다. 그는 영원히 제정된 규례에 따라 그렇게 할례를 받은 첫사람이었습니다.[a]
  to: 아브라함은 여드레째 되는 날에 그의 아들 이삭에게 할례를 행하였습니다. 그는 영원히 제정된 규례에 따라 할례를 받은 첫 사람이었습니다.
  rationale: 불필요한 ‘그렇게’와 그에 딸린 잔존 각주를 제거하고, ‘영원히 제정된 규례에 따라’가 ‘할례를 받은’ 행위와 직접 연결되게 하였습니다. 이로써 원문의 규례 준수와 최초성이라는 두 요소를 유지하면서 자연스러운 합쇼체 문장으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:24:54Z'
review_pass:
  verdict: revise
  source_fidelity: 게에즈의 በከመ 및 (제시된 감사 이력에서 보완된) ‘영원히 제정된 규례’ 절은 ‘그렇게’가 아니라 규례에 따른다는 뜻으로 옮겨야 합니다. 초안은 이 핵심 절을 대체로 반영했으나, ‘그렇게’는 원문에 없는 별도 지시를 더하고 문장을 어색하게 합니다.
  naturalness: ‘그렇게 할례를 받은 첫사람’은 한국어에서 지시 대상이 불분명하고 ‘첫사람’도 다소 부자연스럽습니다. ‘…따라 할례를 받은 첫 사람이었습니다’가 자연스럽고 원문의 최초성도 보존합니다.
  terminology: ‘할례’, ‘규례’, ‘영원히 제정된’은 종교·법규적 문맥에 적절합니다. ‘이삭’이라는 원문의 고유명사를 유지한 것도 적절합니다.
  issues:
  - severity: medium
    issue: ‘그렇게’가 원문에 없는 지시 의미를 첨가합니다.
    rationale: 원문의 በከመ는 뒤따르는 ‘영원히 제정된 규례’에 연결되어 ‘…에 따라’로 번역되어야 합니다. 감사 이력도 이 절의 복원을 확인합니다.
  - severity: low
    issue: ‘그렇게 할례를 받은 첫사람’의 표현이 어색하고 의미 결속이 불명확합니다.
    rationale: ‘그렇게’의 선행 내용이 없으며, ‘첫 사람’으로 띄어 쓰고 규례구를 직접 수식하도록 하면 현대 한국어에서 명료합니다.
  - severity: low
    issue: 각주 a는 본문 번역에 대응하지 않습니다.
    rationale: 영어의 이전 번역 ‘thus’에 관한 잔존 각주이며, 개정 한국어 본문에는 해당 대안이나 앵커가 없습니다. 삭제하는 것이 앵커 정합성에 맞습니다.
  revised_text: 아브라함은 여드레째 되는 날에 그의 아들 이삭에게 할례를 행하였습니다. 그는 영원히 제정된 규례에 따라 할례를 받은 첫 사람이었습니다.
