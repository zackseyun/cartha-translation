base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
  footnotes:
  - marker: a
    text: Or 'seven bulls, seven rams, seven sheep, and seven male goats'.
    reason: previous_rendering
  - marker: b
    text: Or 'for sin, to make atonement for himself and for his seed.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것으로 자기와 자기의 자손을 위하여 죄에 대한 속죄를 드리고, 화목제물로는 숫양 일곱, 숫염소 일곱, 숫양들 일곱, 그리고 수송아지 일곱을 드렸습니다. 또 그들의 곡식제물과 그들의 음료제물을 드렸습니다. 그는 그 모든 기름을 제단 위에서 불살라, 주님께 올린 선택된 제물, 곧 향기로운 냄새가 되게 하였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀጢአት
  english_pob_choice: for sin / to make atonement for sin
  chosen_korean: 죄에 대한
  alternatives_korean:
  - 죄를 위하여
  - 죄를 속하기 위한
  lexicon: 속죄
  rationale: 문두의 ኀጢአት은 단순 배경어가 아니라 속죄의 대상이 되는 ‘죄’를 가리키므로, ‘죄에 대한 속죄’처럼 관계를 드러내는 표현이 원문 구조를 가장 잘 반영합니다.
- source_word: ከመ፡ ያስተስሪ፡ ቦቱ፡ በእንቲአሁ፡ ወበእንተ፡ ዘርኡ
  english_pob_choice: to make atonement for sin by it, for himself and for his seed
  chosen_korean: 그것으로 자기와 자기의 자손을 위하여 속죄를 드리고
  alternatives_korean:
  - 그것으로 자기와 자기의 자손을 위해 속죄하고
  - 그로써 자기와 자기의 씨를 위하여 화목하게 하고
  lexicon: 속죄
  rationale: ቦቱ의 ‘그것으로/by it’와 ‘자기와 자기의 자손을 위하여’의 목적 관계를 살려, 제사가 속죄 행위임을 분명하게 풀었습니다.
- source_word: መሥዋዕተ፡ መድኀኒት
  english_pob_choice: a sacrifice of well-being
  chosen_korean: 화목제물
  alternatives_korean:
  - 평안제물
  - 평강제물
  lexicon: 화목제물
  rationale: 이 표현은 제사의 결과가 하나님과의 관계 회복과 공동체적 평안을 포함하는 제사이므로, 한국어 독자가 의미를 바로 파악할 수 있는 ‘화목제물’로 옮겼습니다.
- source_word: አብሐኩ… ወመሐስአ… ወአባግዐ… ወደቤላት
  english_pob_choice: seven rams, seven kids, seven sheep, and seven male goats
  chosen_korean: 숫양 일곱, 숫염소 일곱, 숫양들 일곱, 그리고 수송아지 일곱
  alternatives_korean:
  - 숫양 일곱, 어린염소 일곱, 양 일곱, 숫염소 일곱
  - 숫양 일곱, 새끼염소 일곱, 양 일곱, 숫염소 일곱
  lexicon: 희생제물
  rationale: 게으즈 동물명에 대한 정정된 영어 감사본을 따라 제물 목록을 한국어로 옮겼습니다. 앞의 አብሐኩ는 숫양, መሐስአ는 새끼/어린 동물 계열, አባግዐ는 양, ደቤላት은 수송아지에 해당하므로 제물 열거를 유지했습니다.
- source_word: ሥብሖሙ፡ የዐጥን፡
  english_pob_choice: he burned all their fat
  chosen_korean: 그는 그 모든 기름을 제단 위에서 불살라
  alternatives_korean:
  - 그는 그 모든 기름을 태워
  - 그는 그 모든 기름을 살라
  lexicon: 제사
  rationale: 제사 문맥에서 ሥብሖሙ는 단순한 지방보다 제물의 ‘기름/지방 부분’을 가리키므로, 제단 위에서 불살랐다는 제의적 동작을 살렸습니다.
theological_decisions:
- issue: 제사 명칭의 한국어 범주
  chosen_reading: ‘화목제물’로 번역해 하나님과의 관계 회복이라는 제사 의미를 드러냈습니다.
  alternative_readings:
  - 평안제물
  - 감사제물
  rationale: 원문 መድኀኒት은 단순 ‘안녕’보다 제의적 평화와 화해의 뉘앙스를 가지므로, 한국어 교회 전통에서 이미 기능하는 ‘화목제물’이 가장 설명력이 높습니다.
  doctrine_reference: 제사/속죄 언어는 관계 회복과 언약적 평화를 함께 지시함
- issue: ‘주님께’의 경칭 처리
  chosen_reading: 야훼를 직접 표기하지 않는 본문이지만, 원문의 እግዚአብሔር 계열 경칭을 살려 ‘주님께’로 옮겼습니다.
  alternative_readings:
  - 하나님께
  - 주께
  rationale: 청중이 제의적 헌물을 누구에게 드리는지 분명히 알 수 있도록 하면서도, 현대 표준어 합쇼체 흐름을 유지했습니다.
  doctrine_reference: 예배 대상의 명시성과 문체 일관성
