  text: But Lot we saved, because God remembered Abraham and brought him out from the midst of the overthrow.
translation:
  language: ko
  text: 그러나 우리는 롯을 구해 냈습니다. 하나님께서 아브라함을 기억하시고 롯을 멸망의 한가운데서 이끌어 내셨기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናድኅኖ
  english_pob_choice: we saved
  chosen_korean: 우리는 구해 냈습니다
  alternatives_korean:
  - 우리가 구원했습니다
  - 우리는 건져 냈습니다
  lexicon: 구하다/구원하다
  rationale: 행위의 주어가 복수 1인칭이므로 직접적으로 ‘우리는’으로 옮기되, 결과를 살린 ‘구해 냈습니다’가 본문 의미를 가장 자연스럽게 드러냅니다.
- source_word: እግዚአብሔር
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 야훼
  lexicon: 하나님
  rationale: 본절은 일반 서술에서 신을 가리키며, 영어 POB도 ‘God’으로 처리하므로 한국어 기본어인 ‘하나님’이 적절합니다.
- source_word: ተዘከሮ እግዚአብሔር ለአብርሃም
  english_pob_choice: God remembered Abraham
  chosen_korean: 하나님께서 아브라함을 기억하시고
  alternatives_korean:
  - 하나님께서 아브라함을 생각하시고
  - 하나님께서 아브라함을 기억해 주시고
  lexicon: 기억하다
  rationale: 기억함이 단순 회상이 아니라 언약적 관심과 행동의 계기를 뜻하므로, 직역하면서도 한국어에서 가장 자연스러운 ‘기억하시고’를 유지했습니다.
- source_word: እማእከለ
  english_pob_choice: from the midst of the overthrow
  chosen_korean: 파멸의 한가운데서
  alternatives_korean:
  - 멸망의 한가운데서
  - 뒤엎음의 한가운데서
  lexicon: 가운데/한가운데
  rationale: Geez의 ‘중간/한가운데’와 영어 POB의 ‘midst’를 반영하되, 소돔의 멸망 맥락을 살려 ‘파멸’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 ‘기억하심’의 의미
  chosen_reading: 하나님께서 아브라함을 기억하시고 그 결과 롯을 구해 내셨다는 인과를 살렸습니다.
  alternative_readings:
  - 하나님께서 아브라함을 기억하셨기 때문에
  - 하나님께서 아브라함을 기억하셔서
  rationale: 본문의 이유절이 구원의 행위와 결속되어 있으므로, 단순한 인지 행위가 아니라 구원의 실행을 촉발하는 언약적 기억으로 읽어야 합니다.
  doctrine_reference: 창세기/출애굽기 전반의 언약적 ‘기억’ 용례
