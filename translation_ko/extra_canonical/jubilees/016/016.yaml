  text: 우리는 일곱째 달에 돌아와 우리 앞에서 사라가 임신한 것을 발견했습니다. 그리고 주님을 찬송하고, 하나님께서 아브라함에 관하여 말씀하신 모든 것을 그에게 알렸습니다. 하나님께서는 그 일들을 반드시 이루실 것이었습니다.
