- from: 일곱째 달에 우리가 돌아와서 사라가 우리보다 먼저 임신한 것을 보고 주님를 찬송하고 그에 대하여 말씀하신 모든 것을 그에게 전하였으니 그가 반드시 이루시리이다.
  to: 우리는 일곱째 달에 돌아와 우리 앞에서 사라가 임신한 것을 발견했습니다. 그리고 주님을 찬송하고, 하나님께서 아브라함에 관하여 말씀하신 모든 것을 그에게 알렸습니다. 하나님께서는 그 일들을 반드시 이루실 것이었습니다.
  rationale: 문법 오류를 바로잡고, 원문 및 영어 POB 감사 기록이 보존하는 인칭 관계를 명시했습니다. ‘그 일들’은 복수의 약속/말씀을 가리키며, 원문의 약속 성취 진술을 자연스러운 과거 서술 문맥으로 옮겼습니다.
