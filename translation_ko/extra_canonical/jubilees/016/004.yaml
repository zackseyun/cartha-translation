  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
  footnotes:
  - marker: a
    text: Or 'and his name was written on the heavenly tablets, Isaac.'.
    reason: previous_rendering
  - marker: b
