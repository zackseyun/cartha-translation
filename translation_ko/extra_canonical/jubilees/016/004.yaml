translation:
  language: ko
  text: 그리고 그의 이름, 이삭이 하늘의 돌판들에 기록되어 있었습니다. 그리고 우리가 정한 때에 그녀에게 돌아갔을 때, 그녀는 잉태하여 아들을 낳았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስሙ
  english_pob_choice: his name
  chosen_korean: 그의 이름
  alternatives_korean:
  - 이름
  - 그 이름
  lexicon: 소유격 표현
  rationale: Ge'ez의 ስሙ는 단순한 ‘이름’이 아니라 ‘그의 이름’이라는 소유 관계를 분명히 하므로 이를 반영했습니다.
- source_word: ጽላተ፡ ሰማይ
  english_pob_choice: heavenly tablets
  chosen_korean: 하늘의 돌판들
  alternatives_korean:
  - 하늘의 판들
  - 하늘의 석판들
  lexicon: 천상 기록 매체 표현
  rationale: 직역하면 ‘하늘의 돌판들’이며, 본문이 말하는 천상 기록 매체의 구체성을 살리기 위해 ‘돌판들’로 옮겼습니다.
- source_word: ወጽሑፍ፡ ... ውስተ፡ ጽላተ፡ ሰማይ፡
  english_pob_choice: was written on the heavenly tablets
  chosen_korean: 하늘의 돌판들에 기록되어 있었습니다
  alternatives_korean:
  - 하늘의 돌판들에 쓰여 있었습니다
  - 하늘의 돌판들에 적혀 있었습니다
  lexicon: 수동태 표현
  rationale: 문맥상 단순한 ‘쓰기’보다 공식적 기록을 뜻하므로 ‘기록되어 있었습니다’가 적합합니다.
- source_word: ገባእነ
  english_pob_choice: we returned
  chosen_korean: 우리가 ... 돌아갔을 때
  alternatives_korean:
  - 우리가 ... 갔을 때
  - 우리가 ... 왔을 때
  lexicon: 동사 의미
  rationale: 검증된 어형이 ‘returned’이므로 ‘돌아가다’로 반영했습니다.
theological_decisions:
- issue: 천상 돌판에 이름이 기록된다는 표현
  chosen_reading: 본문의 천상 기록 이미지를 그대로 살려, 문자 그대로의 천상 기록 행위로 옮겼습니다.
  alternative_readings:
  - 상징적으로 완곡하게 ‘하늘에 알려져 있었습니다’로 완화
  - 전통적 교회 문체로 ‘하늘의 책에 기록되었나이다’로 고정
  rationale: 본문은 출생 전부터 이름이 천상에 기록되었다는 묵시적-문서적 이미지를 전달하므로, 이를 약화하지 않는 쪽을 택했습니다.
  doctrine_reference: Second Temple Jewish apocalyptic imagery
- issue: ‘우리가’의 화자 보존
  chosen_reading: English POB의 ‘we’에 맞추어 화자 복수를 그대로 유지했습니다.
  alternative_readings:
  - ‘그들이’로 중성화
  - 문맥상 단수로 정리
  rationale: 게젤 원문과 POB 둘 다 복수 화자를 유지하므로, 서술 주체의 집단성을 그대로 드러냈습니다.
  doctrine_reference: Narrative voice fidelity
