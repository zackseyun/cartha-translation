  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
  footnotes:
  - marker: a
    text: Or 'and willows from the brook.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것은 그들의 세대마다 해마다 지켜야 할 영원한 규례입니다. 또 이것에 대해 날수의 제한이 없습니다. 이는 그것이 이스라엘을 위해 영원히 제정되었기 때문입니다. 그래서 그들은 그것을 지키고 초막에 거하며, 머리에는 관을 쓰고, 잎이 무성한 가지와 버드나무를 취해야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም፡
  english_pob_choice: an everlasting statute
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영원한 율례
  - 영속하는 규례
  lexicon: 규례
  rationale: Ge'ez의 법적·공동체적 규정 표현을 한국어로는 ‘규례’가 가장 자연스럽고, ‘율법’보다 특정 절기의 제정 조항이라는 점을 잘 드러냅니다.
- source_word: በትውልዶሙ፡ በኵሉ፡ ዓመት፡ ወዓመት።
  english_pob_choice: throughout their generations, year by year
  chosen_korean: 그들의 세대마다 해마다
  alternatives_korean:
  - 대대로 해마다
  - 세대마다 매년
  lexicon: 세대 / 해마다
  rationale: ‘세대마다’와 ‘해마다’를 병렬로 두어, 반복성과 세대 지속성을 모두 자연스럽게 살렸습니다.
- source_word: ወአልቦ፡ ለዝንቱ፡ ወሰነ፡ መዋዕል።
  english_pob_choice: there is no limit of days for this
  chosen_korean: 이것에 대해 날수의 제한이 없습니다
  alternatives_korean:
  - 이것의 기간에는 한계가 없습니다
  - 이 일에는 정해진 날수가 없습니다
  lexicon: 날수의 제한
  rationale: Ge'ez의 ‘날들의 정한 경계/한정’이라는 뜻을 직역하되, 한국어에서는 ‘날수의 제한’이 가장 명료하게 대응합니다.
- source_word: ይግበርዎ፡ ወይነበሩ፡ ውስተ፡ ምጽላል፡
  english_pob_choice: that they should celebrate it and dwell in booths
  chosen_korean: 그들은 그것을 지키고 초막에 거해야 합니다
  alternatives_korean:
  - 그들이 그것을 기념하고 초막에 살아야 합니다
  - 그들이 이를 준수하며 초막에 거해야 합니다
  lexicon: 초막에 거하다
  rationale: 문맥상 절기 준수와 초막 거주를 함께 말하므로, ‘지키다’로 절기 준수를, ‘초막에 거하다’로 거처 행위를 자연스럽게 옮겼습니다.
- source_word: ወከመ፡ ይንበሩ፡ አክሊላተ፡ ውስተ፡ ርእሶሙ፡
  english_pob_choice: and wear crowns on their heads
  chosen_korean: 머리에는 관을 쓰고
  alternatives_korean:
  - 머리에 관을 쓰고
  - 그들의 머리에 관을 두르고
  lexicon: 관을 쓰고
  rationale: ‘wear crowns’에 대응하여 한국어 관용에 맞는 ‘관을 쓰다’를 사용했습니다. ‘머리에는’은 위치를 분명히 합니다.
- source_word: ወከመ፡ ይንሥኡ፡ ዐጽቀ፡ ቈጽል፡ ውኩሓ፡
  english_pob_choice: and take leafy branches and willows
  chosen_korean: 잎이 무성한 가지와 버드나무를 취해야 합니다
  alternatives_korean:
  - 잎이 무성한 가지와 버드나무 가지를 취해야 합니다
  - 무성한 잎의 가지들과 버드나무를 취해야 합니다
  lexicon: 잎이 무성한 가지 / 버드나무
  rationale: Ge'ez 본문은 ‘잎이 무성한 가지’와 ‘버드나무’를 분리해 말하므로, 영어 POB의 보강을 따르지 않고 본문에 충실하게 옮겼습니다.
theological_decisions:
- issue: 절기 규정의 지속성 표현
  chosen_reading: 그것은 그들의 세대마다 해마다 지켜야 할 영원한 규례입니다.
  alternative_readings:
  - 그것은 영원한 규례입니다
  - 세대마다 계속 지켜야 하는 규례입니다
  rationale: 본문의 반복·영속성을 모두 살리기 위해 ‘영원한 규례’와 ‘세대마다 해마다’를 함께 배치했습니다.
  doctrine_reference: 계속적 율례/절기 규정의 영속성
- issue: ‘이것에 대해 날수의 제한이 없습니다’의 해석
  chosen_reading: 이것에 대해 날수의 제한이 없습니다
  alternative_readings:
  - 정해진 기간이 없습니다
  - 끝나는 날이 없습니다
  rationale: Ge'ez의 ‘날수의 경계 없음’을 과도하게 풀지 않고, 제정된 절기의 비종결성을 직접 드러냈습니다.
  doctrine_reference: 본문의 법적·절기적 성격
