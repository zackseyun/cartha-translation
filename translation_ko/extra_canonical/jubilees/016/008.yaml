translation:
  language: ko
  text: 그가 그것을 뒤엎었습니다. 그리고 그와 그의 딸들도 땅 위에서 죄를 지었는데, 그것은 땅 위에 전례가 없었던 죄였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그도 땅 위에서 전례가 없었던 죄를 지었고, 그의 딸들도 그러했습니다.”
    reason: 원문의 주어 및 접속 관계는 ‘그와 그의 딸들’의 공동 주어로 읽을 수도 있고, 그와 딸들을 병렬적으로 분리해 읽을 수도 있어, 영어 POB 감사 기록의 대안 읽기를 반영합니다.
lexical_decisions:
- source_word: ገፍታአ።
  english_pob_choice: He overthrew it.
  chosen_korean: 그가 그것을 뒤엎었습니다.
  alternatives_korean:
  - 그가 그것을 무너뜨렸습니다.
  - 그가 그것을 전복했습니다.
  lexicon: Geez verbal action clause
  rationale: 첫 절의 동사는 소돔에 대한 심판의 결과를 가리키므로, 문맥상 가장 직접적인 ‘뒤엎다’를 택해 파괴·전도 의미를 살렸습니다.
- source_word: ወገብረ፡ ውእቱኒ፡ ወአዋልዲሁኒ፡ ኀጢአተ፡
  english_pob_choice: And he and his daughters also committed sin
  chosen_korean: 그리고 그와 그의 딸들도 … 죄를 지었습니다.
  alternatives_korean:
  - 그리고 그와 그의 딸들도 … 죄를 범했습니다.
  - 그리고 그와 그의 딸들도 … 죄악을 행했습니다.
  lexicon: Geez narrative clause with plural subject
  rationale: 주어는 ‘그와 그의 딸들’이므로 한국어도 이를 분명히 드러내고, ‘죄를 지었습니다’로 단순하고 직설적인 행위를 옮겼습니다.
- source_word: ዲበ፡ … ምድር፡
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅에서
  - 이 땅 위에서
  lexicon: Geez locative preposition
  rationale: 반복되는 위치 표현은 서술의 리듬을 살리면서도 과도한 중복을 피하기 위해 ‘땅 위에서’로 옮겼습니다.
- source_word: ዘአኮ፡ ዲበ፡ ምድር፡
  english_pob_choice: such as had not been on the earth
  chosen_korean: 전례가 없었던 그런
  alternatives_korean:
  - 땅 위에 일찍이 없었던 그런
  - 땅 위에서 전혀 없었던 그런
  lexicon: Geez relative clause of unprecedentedness
  rationale: 기존에 없었던 유례없음을 자연스러운 현대어로 옮기기 위해 ‘전례가 없었던’으로 번역했습니다.
theological_decisions:
- issue: 문장의 중복된 ‘땅 위에서’ 표현 처리
  chosen_reading: 두 번 모두 살려, 죄의 범위와 전례 없음이 ‘땅’에 대해 강조되도록 했습니다.
  alternative_readings:
  - 한 번만 옮겨 문장을 매끈하게 다듬는 읽기
  - 뒤의 표현을 ‘땅 위에서 일찍이 없었던’으로 합치는 읽기
  rationale: 게으적으로는 중복처럼 보이지만, 원문은 동일한 위치 표현을 반복해 죄의 장소성과 전무성을 강조하므로 이를 보존하는 편이 출처 충실합니다.
  doctrine_reference: Source-text emphasis and repetition
- issue: 주어와 서술의 연결 방식
  chosen_reading: ‘그와 그의 딸들도’로 주어를 명시해 함께 범한 죄임을 분명히 했습니다.
  alternative_readings:
  - ‘그도 또한 그의 딸들도’처럼 분리하는 읽기
  - ‘그와 딸들 또한’으로 더 압축하는 읽기
  rationale: 영어 POB의 수정본이 뜻한 바대로, 원문은 롯과 딸들의 공동 행위를 말하므로 한국어에서도 공동 주어를 분명히 드러내는 것이 적절합니다.
  doctrine_reference: Narrative syntax and participant reference
