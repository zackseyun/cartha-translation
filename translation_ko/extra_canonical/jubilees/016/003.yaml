translation:
  language: ko
  text: 그녀는 두려워하여 그 말 때문에 자기가 웃었다는 것을 부인했습니다. 그리고 우리는 정해진 대로 그녀의 아들의 이름을 알려 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈርት / afraid
  english_pob_choice: was afraid
  chosen_korean: 두려워하며
  alternatives_korean:
  - 무서워하며
  - 두려움을 느끼며
  lexicon: 두려워하다
  rationale: 과거 서술의 흐름을 살리면서 내적 반응을 자연스럽게 나타내는 동사로 옮겼습니다.
- source_word: ወሐሰወት / denied
  english_pob_choice: denied
  chosen_korean: 부인했습니다
  alternatives_korean:
  - 아니라고 했습니다
  - 부정했습니다
  lexicon: 부인하다
  rationale: 말한 사실을 인정하지 않는다는 의미를 가장 직접적으로 전달하는 표현입니다.
- source_word: በእንተ፡ ቃል / because of the word
  english_pob_choice: because of the word
  chosen_korean: 그 말 때문에
  alternatives_korean:
  - 그 말씀 때문에
  - 그 말로 인해
  lexicon: 말/말씀
  rationale: 게으즈 본문의 ‘말’을 직접 반영하되, 한국어에서는 원인 구문으로 자연스럽게 풀었습니다.
- source_word: በከመ፡ ሥሩዕ / as it had been ordained
  english_pob_choice: as it had been ordained
  chosen_korean: 정해진 대로
  alternatives_korean:
  - 명정된 대로
  - 규정된 대로
  lexicon: 정하다
  rationale: 본문의 수동적 운명/규정 뉘앙스를 살리면서도 한국어에서 과도하게 문어적인 종교용어를 피했습니다.
theological_decisions:
- issue: ‘it had been ordained’의 예정/정함 표현
  chosen_reading: 정해진 대로
  alternative_readings:
