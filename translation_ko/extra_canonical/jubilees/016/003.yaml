  - 명정된 대로
  rationale: 창세기 재서술 문맥에서 인물의 이름이 이미 정해졌음을 전달하는 것이 핵심이므로, 신학적 과잉 해석을 피하면서도 ‘정함’의 의미를 보존했습니다.
  doctrine_reference: 서술적 예정/섭리 표현
- issue: ‘the word’의 문맥 처리
  chosen_reading: 그 말
  alternative_readings:
  - 그 말씀
  - 그 문장
  rationale: 여기서는 신적 말씀 일반보다 바로 앞의 발화 내용에 대한 지시가 더 자연스러워 ‘그 말’로 좁혀 번역했습니다.
  doctrine_reference: 문맥적 지시대명사 처리
