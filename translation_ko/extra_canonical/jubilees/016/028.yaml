  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: ko
  text: 둘 모두에게 매우 큰 기쁨이 있었습니다. 그는 거기에 자신이 복을 받은 주님께, 또 자신이 나그네로 머무는 땅에서 기뻐하게 하신 주님께 제단을 세웠습니다. 그리고 그는 이 달에 칠 일 동안 기쁨의 잔치를 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ፡ ፍሥሓ፡ ዐቢየ፡ ጥቀ።
  english_pob_choice: And both of them had very great joy.
  chosen_korean: 둘 모두에게 매우 큰 기쁨이 있었습니다.
  alternatives_korean:
  - 두 사람 모두 매우 기뻐했습니다.
  - 둘 다 아주 크게 기뻐했습니다.
  lexicon: 기쁨
  rationale: 주어가 두 사람 모두임을 분명히 하고, ዐቢየ፡ ጥቀ፡의 강한 강조를 ‘매우 큰’으로 옮겨 영어 POB의 의미를 그대로 반영했습니다.
- source_word: ወሐነጸ፡ በህየ፡ ምሥዋዐ፡
  english_pob_choice: And he built there an altar
  chosen_korean: 그는 거기에 … 제단을 세웠습니다.
  alternatives_korean:
  - 그는 거기에 제단을 쌓았습니다.
  - 그는 거기에 제단을 만들었습니다.
  lexicon: 제단
  rationale: ምሥዋዐ는 예배용 제단을 가리키므로 관용적으로 ‘제단을 세우다’를 택해 건축 행위를 자연스럽게 표현했습니다.
- source_word: ለእግዚአብሔር፡ ዘባረኮ፡ ወለዘ *ያስተፈሥሖ፡'
  english_pob_choice: to the Lord, who had blessed him and who had made him rejoice
  chosen_korean: 자신이 복을 받은 주님께, 또 자신이 … 기뻐하게 하신 주님께
  alternatives_korean:
  - 자신을 복 주신 주님께, 또 자신을 기쁘게 하신 주님께
  - 자신에게 복을 주시고 기뻐하게 하신 주님께
  lexicon: 주님
  rationale: 둘 다 주님을 수식하는 관계절이므로 영어 POB의 구조를 따라 두 번의 관계절을 살리되, 반복을 약간 다듬어 한국어로 자연스럽게 정리했습니다.
- source_word: በምድረ፡ ፍልሰቱ፡
  english_pob_choice: in the land of his sojourning
  chosen_korean: 자신이 나그네로 머무는 땅
  alternatives_korean:
  - 그의 나그네 된 땅
  - 그가 거류하는 땅
  lexicon: 나그네
  rationale: ፍልሰት은 일시적 거주/체류의 뉘앙스가 있어, 성경적이면서도 현대 한국어에서 이해되는 ‘나그네로 머무는 땅’으로 옮겼습니다.
- source_word: ወገብረ፡ በዓለ፡ ፍሥሓ፡
  english_pob_choice: And he made a feast of joy
  chosen_korean: 기쁨의 잔치를 지켰습니다.
  alternatives_korean:
  - 기쁨의 절기를 지켰습니다.
  - 기쁨의 잔치를 열었습니다.
  lexicon: 잔치
  rationale: በዓለ는 절기/잔치의 폭이 있으나, 뒤의 ‘칠 일 동안’과 함께 행사성 의미가 분명하므로 ‘기쁨의 잔치’로 번역했습니다.
theological_decisions:
- issue: YHWH/주님의 호칭을 어떻게 처리할 것인가
  chosen_reading: 본문의 እግዚአብሔር은 ‘주님’으로 번역했습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 절은 게에즈 본문 안에서 YHWH 고유표기라기보다 통상적 신명 호칭으로 기능하며, 영어 POB도 Lord를 택하고 있어 한국어에서는 문맥상 자연스러운 ‘주님’이 가장 적절합니다.
  doctrine_reference: 호칭의 문맥적 기능 보존
