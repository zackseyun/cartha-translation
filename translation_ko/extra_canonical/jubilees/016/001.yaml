base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
  footnotes:
  - marker: a
    text: Or 'And we announced to Abraham that Sarah had conceived,'.
    reason: previous_rendering
  - marker: b
    text: Or 'and had seen Isaac, and that in Isaac a name and seed would be named for him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀는 아들을 잉태했습니다. 그리고 우리는 일곱째 달에 사라에게로 돌아가 그녀가 우리 앞에서 이미 잉태했음을 발견했습니다. 우리는 그를 축복했고, 그에게 명령된 모든 것을 그에게 말했습니다. 곧 그가 죽기 전에 여섯 아들을 낳고 그들을 보게 될 것이며, 이삭 안에서 그의 이름과 씨가 불리게 될 것이라는 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ።
  english_pob_choice: She conceived a son.
  chosen_korean: 그녀는 아들을 잉태했습니다.
  alternatives_korean:
  - 그녀는 아들을 배었습니다.
  - 그녀는 아들을 가졌습니다.
  lexicon: 잉태하다
  rationale: 게으즈 원문은 ‘아들을 잉태했다’는 직접적 진술이므로, 현대 한국어에서도 생물학적·서술적 의미를 살리는 ‘잉태했습니다’를 택했습니다.
- source_word: በወርኅ፡ ሳብዕ፡
  english_pob_choice: in the seventh month
  chosen_korean: 일곱째 달에
  alternatives_korean:
  - 일곱째 달에
  - 7월에
  lexicon: 월/달
  rationale: 원문은 달의 서수 표현이므로 달력 명칭인 ‘7월’보다 ‘일곱째 달’이 원문 구조를 더 정확히 반영합니다.
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት፡
  english_pob_choice: and would see them before he died
  chosen_korean: 그들을 보게 될 것이며, ... 죽기 전에
  alternatives_korean:
  - 그가 죽기 전에 그들을 보게 될 것이며
  - 그가 죽지 전에 그들을 보게 될 것이며
  lexicon: 보다 / 죽다
  rationale: 원문은 ‘죽기 전에’라는 시간 부사구가 ‘보다’와 결합되어 있으므로, 한국어에서도 사건 순서를 분명히 드러내어 옮겼습니다.
- source_word: ይጼዋዕ
  english_pob_choice: would be called
  chosen_korean: 불리게 될 것이라는 것입니다
  alternatives_korean:
  - 불리게 될 것입니다
  - 이름이 지어질 것입니다
  lexicon: 부르다
  rationale: 원문의 수동적 ‘불리다’는 단순한 명명보다 호명·호칭의 뉘앙스를 담으므로 ‘불리게 될 것’이 더 가깝습니다.
theological_decisions:
- issue: 이삭 안에서 ‘이름과 씨’가 불린다는 표현
  chosen_reading: 이삭 안에서 그의 이름과 씨가 불리게 된다고 옮겼습니다.
  alternative_readings:
  - 이삭에게서 그의 이름과 씨가 이어진다고 옮길 수 있습니다.
  - 이삭으로 말미암아 그의 이름과 씨가 불린다고 옮길 수 있습니다.
  rationale: 원문 전치사 구조를 그대로 살려 ‘안에서’로 옮기되, 상속·언약의 계승 의미가 암시되는 표현을 과도하게 해석하지 않도록 했습니다.
  doctrine_reference: 언약 계승과 후손 약속의 문맥을 유지하되, 본문이 허용하는 범위를 넘는 신학적 확장을 피함
