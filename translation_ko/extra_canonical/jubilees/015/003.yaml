revisions:
- from: 야훼께서 아브람에게 나타나셔서 그에게 말씀하셨습니다. 「나는 하나님 샷다이이다. 내 앞에서 기쁘게 행하고, 흠이 없으라」[a]
  to: 주님께서 아브람에게 나타나셔서 그에게 말씀하셨습니다. “나는 하나님 샷다이이다. 내 앞에서 나를 기쁘게 하시고, 흠이 없으십시오.”
  rationale: 원문 우선 원칙에 따라 እግዚአብሔር는 ‘주님’으로, አሥምር는 ‘내 앞에서 나를 기쁘게 하십시오’로 옮겼습니다. 따라서 히브리어 창세기 본문의 ‘걷다’로 조화시키지 않았습니다. ‘하나님 샷다이’는 음역 신칭을 보존했고, 현대 합쇼체에 맞게 두 명령을 정중한 명령형으로 고쳤습니다. 내용이 없는 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
