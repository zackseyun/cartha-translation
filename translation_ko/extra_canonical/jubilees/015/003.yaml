translation:
  language: ko
  text: 야훼께서 아브람에게 나타나셔서 그에게 말씀하셨습니다. 「나는 하나님 샷다이이다. 내 앞에서 기쁘게 행하고, 흠이 없으라」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 하나님
  lexicon: YHWH
  rationale: 게에즈 본문은 ‘주’에 해당하는 호칭으로 야훼를 가리키며, 본문 전체의 신명 사용을 소스-직접적으로 드러내기 위해 한국어 본문에는 ‘야훼’로 옮겼습니다.
- source_word: ለአብራም
  english_pob_choice: Abram
  chosen_korean: 아브람에게
  alternatives_korean:
  - 아브라함에게
  lexicon: Abram
  rationale: 본문 인물은 아직 이름이 바뀌기 전의 아브람이므로, 표준 음역을 유지했습니다.
- source_word: አምላክ፡ ሰዳይ
  english_pob_choice: God Shaddai
  chosen_korean: 하나님 샷다이
  alternatives_korean:
  - 전능하신 하나님
  - 하나님 엘 샷다이
  lexicon: El Shaddai
  rationale: 게에즈의 신칭 구조를 반영해 ‘하나님’과 고유 신칭 ‘샷다이’를 함께 살렸고, 관용적 신학적 풀이인 ‘전능하신’은 원문에 없는 해석이므로 본문에서는 피했습니다.
- source_word: አሥምር
  english_pob_choice: be pleasing before me
  chosen_korean: 내 앞에서 기쁘게 행하고
  alternatives_korean:
  - 내 앞에서 기쁘게 있으라
  - 내 앞에서 기쁘게 살고
  lexicon: asmar
  rationale: English audit trail가 ‘be pleasing before me’로 복원되었고, 이 동사는 ‘기쁘게 하다/행하다’의 의미를 가져 ‘내 앞에서 기쁘게 행하고’로 자연스럽게 살렸습니다.
- source_word: ፍጹመ
  english_pob_choice: blameless
  chosen_korean: 흠이 없으라
  alternatives_korean:
  - 완전하라
  - 온전하라
  lexicon: tamim
  rationale: 도덕적·언약적 결함 없음의 요구를 한국어 성경어법에 맞게 간결히 표현하되, ‘완전’보다 ‘흠이 없으라’가 문맥상 더 직접적입니다.
theological_decisions:
- issue: ‘walk before me’로의 해석적 전환을 피하고 게에즈 본문에 따라 번역할지 여부
  chosen_reading: 본문은 ‘내 앞에서 기쁘게 행하고’로 번역해, 창세기 히브리어식 ‘걷다’가 아니라 게에즈 본문의 ‘기쁘게 하다/행하다’ 의미를 따랐습니다.
  alternative_readings:
  - 내 앞에서 걸으며
  - 내 앞에서 살아가며
  rationale: 영문 POB의 수정 이력은 다시 보정되었고, source_payload의 게에즈 동사 አሥምር는 ‘기쁘게 하다’ 계열이므로 히브리어 본문과의 조화를 위해 의미를 바꾸지 않았습니다.
  doctrine_reference: source-primacy and intertextual caution
- issue: 하나님의 자기 계시 호칭을 ‘전능하신 하나님’으로 풀어쓸지 여부
  chosen_reading: ‘하나님 샷다이’로 유지했습니다.
  alternative_readings:
  - 전능하신 하나님
  - 샷다이 하나님
  rationale: 전능성은 신학적으로 타당하지만 본문에는 없는 해석적 확장이므로, 독자가 원어의 신칭을 추적할 수 있도록 음역을 보존했습니다.
  doctrine_reference: lexical transparency and divine-name caution
