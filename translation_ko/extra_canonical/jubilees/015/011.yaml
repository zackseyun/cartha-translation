revisions:
- from: 주님께서 아브라함에게 말씀하셨습니다. "너는 내 언약을 지켜라. 너와 너의 뒤에 오는 네 씨가 그러하여라. 너희의 모든 남자는 할례를 받아라. 너희의 포피 살을 베어라. 그것은 나와 너희 사이의 영원한 규례의 표징이 될 것이다. 너희 가운데 난 지 여덟째 날의 아들은 모두 할례를 받아야 한다. 집에서 난 자와, 너희 씨가 아닌 이방인의 아들들 가운데서 너희의 금으로[a] 산 자도 그렇다. 네 집에서 난 자는 반드시 할례를 받아야 하고, 네 금으로 산 자도 할례를 받아야 한다. 그러면 내 언약이 너희의 살에 영원한 규례가 될 것이다. 그러나 포피의 살이 여덟째 날에 할례를 받지 않은 무할례 남자는, 그 사람은 그의 친족 가운데서 끊어질 것이다. 그는 내 언약을 깨뜨렸기 때문이다." 주님께서 또 아브라함에게 말씀하셨습니다. "너의 아내 사래는 이제 더 이상 사래라고 부르지 마라. 사라는 그의 이름이다. 내가 그를 복 주고, 그에게서 너에게 아들을 줄 것이며, 내가 그를 복 주면 그는 한 나라가 되고, 민족들의 왕들이 그에게서 나올 것이다."
  to: '주님께서 아브라함에게 말씀하셨습니다. “너는 내 언약을 지키십시오. 너와 네 뒤를 이을 네 자손도 그렇게 해야 합니다. 너희 가운데 있는 모든 남자는 할례를 받으십시오. 너희 포피의 살을 할례하십시오. 이것이 나와 너희 사이에 영원한 규례의 표징이 될 것입니다. 너희 가운데 있는 모든 남자는 난 지 여드레째 되는 날 할례를 받아야 합니다. 곧 집에서 난 자와, 너희 자손에게서 나지 않은 이방인의 아들들 가운데 너희가 금으로[a] 산 자도 할례를 받아야 합니다. 네 집에서 난 자는 반드시 할례를 받아야 하고, 네가 금으로 산 자도 할례를 받아야 합니다. 그러면 내 언약이 너희의 살에 영원한 규례로 있을 것입니다. 그러나 포피의 살에 할례를 받지 않은 무할례 남자, 곧 여드레째 되는 날 할례를 받지 않은 사람은 자기 친족에게서 끊어질 것입니다. 그가 내 언약을 깨뜨렸기 때문입니다.”


    주님께서 아브라함에게 또 말씀하셨습니다. “네 아내 사래는 이제 더 이상 사래라는 이름으로 부르지 마십시오. 그의 이름은 사라입니다. 내가 그를 복 주고, 그에게서 네게 아들을 주겠습니다. 내가 그 아들을 복 주겠고, 그는 한 민족이 될 것이며, 여러 민족의 왕들이 그에게서 나올 것입니다.”


    아브라함은 얼굴을 땅에 대고 엎드려 기뻐하며 마음속으로 말했습니다. “백 살 된 사람에게 아들이 태어날 수 있겠는가? 아흔 살 된 사라가 아이를 낳을 수 있겠는가?” 아브라함이 주님께 말했습니다. “부디 이스마엘이 주님 앞에서 살게 해 주십시오!”


    하나님께서 말씀하셨습니다. “그렇습니다. 네 아내 사라가 네게 아들을 낳을 것이니, 너는 그의 이름을 이삭이라 부르십시오. 내가 그와 더불어 내 언약을 세우겠습니다. 그것은 그의 뒤를 이을 그의 자손과 맺는 영원한 언약이 될 것입니다. 이스마엘에 관해서도 내가 네 말을 들었습니다. 보십시오, 내가 그를 복 주고 번성하게 하며, 그를 매우 크게 번성하게 하겠습니다. 그는 열두 통치자를 낳을 것이며, 내가 그를 큰 민족이 되게 하겠습니다. 그러나 내가 내 언약은 이삭과 더불어 세우겠습니다. 사라가 내년 이맘때 그를 네게 낳을 것입니다.”


    하나님께서는 그와 말씀을 마치시고 아브라함에게서 올라가셨습니다. 아브라함은 주님께서 그에게 말씀하신 대로 행했습니다. 그는 자기 아들 이스마엘과 자기 집에서 난 모든 사람과 금으로 산 모든 사람, 곧 자기 집에 있는 모든 남자를 데리고 그들의 포피의 살을 할례했습니다. 바로 그날 아브라함도 할례를 받았고, 그의 집의 모든 남자, 곧 그의 집에서 난 자들과 이방인의 아들들 가운데 금으로 산 모든 자도 그와 함께 할례를 받았습니다.


    이것은 모든 세대를 위한 영원한 법입니다. 날을 미루어서도 안 되며, 여드레 가운데 단 하루도 빠뜨려서는 안 됩니다. 이는 하늘의 서판에 정해지고 기록된 영원한 규례이기 때문입니다. 난 지 여드레째 되는 날 포피의 살에 할례를 받지 않은 모든 사람은 주님께서 아브라함과 맺으신 언약의 자손에 속하지 않습니다. 그는 멸망의 자손에 속하며, 그에게는 자신이 주님께 속했다는 표징이 없습니다. 그는 멸망하도록, 땅에서 멸망당하도록, 땅에서 뿌리째 뽑히도록 정해졌습니다. 그가 주 우리 하나님의 언약을 깨뜨렸기 때문입니다.'
  rationale: 원문에 있는 전체 단락을 빠짐없이 번역했습니다. ‘금’과 아들에 대한 남성 지시를 유지했으며, 원문의 반복과 법적·의례적 표현을 보존하되 한국어 문장을 현대 공식적 합쇼체로 다듬었습니다. 결말의 멸망·땅에서의 멸망·뿌리째 뽑힘이라는 세 겹의 표현도 생략하지 않았습니다.
