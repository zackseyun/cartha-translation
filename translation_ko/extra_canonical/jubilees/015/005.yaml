  to: 아브람이 얼굴을 땅에 대고 엎드리자 하나님께서 그에게 말씀하여 이르셨습니다. “보십시오, 내 언약이 너와 함께 있으며, 너는 많은 민족의 아버지가 될 것입니다.”
