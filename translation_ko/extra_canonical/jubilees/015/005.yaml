  text: And Abram fell on his face, and God spoke with him and said, “Behold, my covenant is with you, and you shall become the father of many nations.”
translation:
  language: ko
  text: 아브람이 얼굴을 땅에 대고 엎드리자 하나님께서 그와 말씀하시며 말씀하셨습니다. "보십시오, 내 언약이 너와 함께 있으며, 너는 많은 민족의 아버지가 될 것입니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዓትየ
  english_pob_choice: my covenant
  chosen_korean: 내 언약
  alternatives_korean:
  - 내 규례
  - 내 법도
  - 내 제정
  lexicon: covenant
  rationale: 문맥상 단순한 규정이나 제도가 아니라 하나님이 아브람과 맺는 관계적 약속이므로, 수정된 영어 POB의 ‘covenant’를 따라 ‘언약’으로 옮겼습니다.
- source_word: ወድቀ … በገጹ
  english_pob_choice: fell on his face
  chosen_korean: 얼굴을 땅에 대고 엎드리자
  alternatives_korean:
  - 얼굴에 엎드리자
  - 얼굴을 땅에 대고 쓰러지자
  lexicon: prostration
  rationale: 직역의 생경함을 줄이면서도, 경배·두려움의 자세인 ‘엎드리다’의 의미를 분명히 드러내기 위해 이렇게 옮겼습니다.
- source_word: አበ፡ ለብዙኃን፡ አሕዛብ
  english_pob_choice: the father of many nations
  chosen_korean: 많은 민족의 아버지
  alternatives_korean:
  - 많은 나라들의 아버지
  - 수많은 민족들의 조상
  lexicon: father of many nations
  rationale: ‘아버지’는 혈연보다 기원·대표성을 가리키는 성경적 표현이므로 그대로 유지했고, ‘민족’은 복수의 집단을 자연스럽게 나타내는 표준어로 선택했습니다.
theological_decisions:
- issue: 하나님의 직접 화법의 인용부 표기
  chosen_reading: 하나님께서 ... 말씀하셨습니다. "보십시오, ..."
  alternative_readings:
  - 하나님이 ... 이르셨습니다. "보라, ..."
  - 하나님께서 ... 말씀하시며 이르셨습니다. "보라, ..."
  rationale: Geez 본문의 직접 발화 구조를 살리면서도, 한국어에서는 반복 동사보다 자연스러운 서술을 위해 ‘말씀하셨습니다’로 정리했습니다. 명령형 ‘보라’는 현대 독자에게 덜 자연스러워 ‘보십시오’로 다듬었지만, 신적 선언의 강조는 유지했습니다.
  doctrine_reference: 서사적 직접 화법과 예언/계시 문체
