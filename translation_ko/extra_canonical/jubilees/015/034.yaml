base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/034.yaml
  text: And there will be great wrath from the Lord against the children of Israel, because they have forsaken his covenant and turned aside from his word and provoked and blasphemed, in that they do not perform the ordinance of this law; for they have made themselves like the nations, for uprooting and destruction from the earth. And there will no longer be for them pardon or forgiveness, that they should be forgiven and pardoned for all the sin of this eternal error.
  footnotes:
  - marker: a
    text: Or 'for all this eternal error.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이스라엘 자손에게 주님으로부터 큰 진노가 있을 것입니다. 그들이 그의 언약을 버리고 그의 말씀에서 돌아서며, 주님을 격노하게 하고 모독했기 때문입니다. 이는 그들이 이 법의 규례를 지키지 않았기 때문입니다. 그들은 민족들처럼 되어 땅에서 뿌리째 뽑혀 멸망할 것입니다. 또한 그들에게는 이 영원한 그릇됨의 모든 죄에 대하여 더 이상 용서나 사함이 없을 것이며, 그들은 용서받거나 사함을 받지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 영원한 그릇됨 전체에 대하여.”
    reason: 영어 POB 감사 기록에 보존된 대안적 구문 분석을 반영합니다. 본문은 원문에 명시된 ‘모든 죄’를 보존하는 번역을 채택합니다.
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 야훼
  lexicon: YHWH
  rationale: 본문의 Ge'ez가 언약의 주체를 가리키는 하나님의 칭호를 사용하므로, POB의 NT/LXX 관행상 '주님'으로 옮기되 여기서는 직접적인 야훼 표기를 요구하는 인용 맥락이 아니어서 본문은 자연스러운 호칭을 택했습니다.
- source_word: ኪዳኖ
  english_pob_choice: his covenant
  chosen_korean: 그의 언약
  alternatives_korean:
  - 그의 계약
  - 그의 조약
  lexicon: ברית / covenant
  rationale: 언약은 성경적 관계를 가리키는 핵심 용어이므로 현대 한국어에서도 신학적 함의가 살아 있는 '언약'을 유지했습니다.
- source_word: ኢይገብሩ፡ ሥርዐተ፡ ለዝ፡ ሕግ
  english_pob_choice: they do not perform the ordinance of this law
  chosen_korean: 이 법의 규례를 지키지 않아
  alternatives_korean:
  - 이 율법의 규례를 행하지 않아
  - 이 법의 명령을 따르지 않아
  lexicon: ordinance / law
  rationale: 여기서 ሥርዐተ는 단순한 추상 규칙보다 '규례'가 더 정확하며, ሕግ는 문맥상 토라/율법이지만 문장의 흐름을 살려 '법'을 택했습니다.
- source_word: ገብሩ፡ ነፍሳቲሆሙ፡ ከመ፡ አሕዛብ
  english_pob_choice: they have made themselves like the nations
  chosen_korean: 그들이 민족들처럼 자신들을 만들어
  alternatives_korean:
  - 그들이 이방 민족들처럼 되게 하여
  - 그들이 열방과 같이 자신들을 만들었기 때문입니다
  lexicon: make themselves like / nations
  rationale: 원문의 '스스로를 만들다'는 자기 형성의 책임을 강조하므로, 민족들(아합/이방 민족들)에 닮게 만든 자기동태를 그대로 살렸습니다.
- source_word: ለስስሎ፡ ወለተሠርዎ፡ እምድር
  english_pob_choice: for uprooting and destruction from the earth
  chosen_korean: 땅에서 뿌리째 뽑히고 멸망하게
  alternatives_korean:
  - 땅에서 뽑혀 없어지고 멸망하게
  - 땅에서 제거되고 파멸하게
  lexicon: uprooting / destruction
  rationale: POB의 'uprooting'을 한국어로 이미지가 살아 있는 '뿌리째 뽑히고'로 옮겨 심판의 강도를 보존했습니다.
theological_decisions:
- issue: 최종 경고의 어조와 회개의 가능성 차단
  chosen_reading: 본문은 언약 파기와 모독 이후 '더 이상 용서나 사함이 없다'고 말하는 강한 심판 선언으로 옮겼습니다.
  alternative_readings:
  - 조건적 경고로 완화하는 번역
  - 일반적 징계로 약화시키는 번역
  rationale: Ge'ez와 POB 모두 반복적으로 '없을 것이다'를 사용해 회복 불능의 심판을 강조하므로, 완곡화하지 않고 그대로 유지했습니다.
  doctrine_reference: 언약 저주와 종말론적 심판
- issue: ‘이 영원한 죄의 오류’의 잔존 의미
  chosen_reading: '''이 영원한 죄의 오류''를 문맥상 보존하고, 뒤의 ''모든 죄에서''와 연결해 중복된 강조로 처리했습니다.'
  alternative_readings:
  - '''이 영원한 오류''로 단순화'
  - '''이 영원한 죄''로 축약'
  rationale: 아람/에티오피아계 문맥의 '오류/그릇됨'과 죄책을 함께 드러내는 중첩 표현이므로, 하나로 평탄화하지 않았습니다.
  doctrine_reference: 죄와 그릇됨에 대한 묵시문학적 표현
