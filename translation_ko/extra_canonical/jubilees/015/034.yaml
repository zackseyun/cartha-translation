revisions:
- from: 그리고 이스라엘 자손에게는 주님으로부터 큰 진노가 있을 것입니다. 이는 그들이 그의 언약을 버리고 그의 말씀에서 돌아서며, 이 법의 규례를 지키지 않아 그를 격노하게 하고 모독하였기 때문입니다. 그들이 민족들처럼 자신들을 만들어, 땅에서 뿌리째 뽑히고 멸망하게 되었기 때문입니다. 또한 이 영원한 죄의 오류와 관련하여, 그들에게는 더 이상 용서나 사함이 없을 것입니다. 그래서 그들이 모든 죄에서 용서받고 사함을 받지 못할 것입니다.[a]
  to: 그리고 이스라엘 자손에게 주님으로부터 큰 진노가 있을 것입니다. 그들이 그의 언약을 버리고 그의 말씀에서 돌아서며, 주님을 격노하게 하고 모독했기 때문입니다. 이는 그들이 이 법의 규례를 지키지 않았기 때문입니다. 그들은 민족들처럼 되어 땅에서 뿌리째 뽑혀 멸망할 것입니다. 또한 그들에게는 이 영원한 그릇됨의 모든 죄에 대하여 더 이상 용서나 사함이 없을 것이며, 그들은 용서받거나 사함을 받지 못할 것입니다.[a]
  rationale: 원문의 열거와 인과를 더 충실히 반영하도록 ‘언약을 버림—말씀에서 돌아섬—격노하게 함과 모독—규례 불이행’을 정리했습니다. ‘민족들처럼 자신들을 만들었다’는 표현은 자연스러운 한국어인 ‘민족들처럼 되어’로 다듬고, 그 결과인 뿌리 뽑힘과 멸망을 미래 심판으로 명확히 했습니다. 마지막으로 ‘모든 죄’의 명시와 ‘용서나 사함이 없음’이라는 반복적 심판 선언을 보존했으며, 논쟁 가능한 수식 범위는 각주로 남겼습니다.
