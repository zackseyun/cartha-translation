  text: And I will establish my covenant between me and you, and I will multiply you greatly.
translation:
  language: ko
  text: 내 언약을 나와 너 사이에 세우고, 너를 크게 번성하게 하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእሁብ፡ ኪዳንየ፡
  english_pob_choice: I will establish my covenant
  chosen_korean: 내 언약을 … 세우고
  alternatives_korean:
  - 내 언약을 주고
  - 내 언약을 맺고
  lexicon: covenant
  rationale: Geez 본문과 POB 수정본의 핵심은 ‘주다’가 아니라 언약을 ‘세우다/확립하다’는 뜻이므로, 한국어도 언약의 성립을 드러내는 ‘세우다’를 택했습니다.
- source_word: ማእከሌየ፡ ወማእከሌከ፡
  english_pob_choice: between me and you
  chosen_korean: 나와 너 사이에
  alternatives_korean:
  - 나와 너 가운데
  - 내가 너와 함께
  lexicon: between
  rationale: 양자 사이의 관계 설정을 직접 드러내는 가장 자연스러운 현대 한국어 표현으로 옮겼습니다.
- source_word: ወአአብቀከ፡ ጥቀ።
  english_pob_choice: and I will multiply you greatly
  chosen_korean: 너를 크게 번성하게 하겠습니다
  alternatives_korean:
  - 너를 크게 많게 하겠습니다
  - 너를 심히 번성하게 하겠습니다
  lexicon: multiply
  rationale: 동사 자체의 ‘증가/번성’ 의미를 살리되, 한국어에서 인물·후손의 증식을 자연스럽게 나타내는 ‘번성하다’를 사용했습니다.
theological_decisions:
- issue: 언약 동사의 의미
  chosen_reading: 언약을 ‘주다’가 아니라 ‘세우다’로 번역했습니다.
  alternative_readings:
  - 언약을 주겠습니다
  - 언약을 맺겠습니다
  rationale: 공식본의 수정 이력과 게에즈 원문이 함께 언약의 확립/설립을 가리키므로, 언약 신학의 뉘앙스를 흐리지 않도록 ‘세우다’를 택했습니다.
  doctrine_reference: 언약 성립 표현의 정확성
- issue: 축복의 증식 표현
  chosen_reading: ‘크게 번성하게 하겠습니다’로 결과의 강도를 유지했습니다.
  alternative_readings:
  - 많이 번성하게 하겠습니다
  - 크게 많게 하겠습니다
  rationale: 원문과 POB가 모두 단순한 증가가 아니라 강한 증식 약속을 말하므로, 한국어에서도 약속의 강도를 살렸습니다.
  doctrine_reference: 아브라함 언약의 번성 약속
