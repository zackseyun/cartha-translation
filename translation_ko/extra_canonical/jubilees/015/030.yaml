  text: For Ishmael and his sons and his brothers and Esau, the Lord did not bring near to himself, and he did not choose them, though they are the children of Abraham, because he knew them; and he chose Israel to be his people.
  footnotes:
  - marker: a
    text: Or 'Abraham; but he knew them, and he chose'.
    reason: previous_rendering
translation:
  language: ko
  text: 이시마엘과 그의 아들들과 그의 형제들과 에서는, 주께서 그들을 자신에게 가까이 이끌지 않으셨고 그들을 선택하지도 않으셨습니다. 비록 그들이 아브라함의 자녀들이었지만, 그분이 그들을 아셨기 때문입니다. 그리고 이스라엘을 자기 백성이 되게 선택하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር / Lord
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 하나님
  - 주님
  lexicon: κύριος
  rationale: 지칭 대상이 야훼이지만, 본문은 서술형 문맥에서 ‘the Lord’로 제시하므로 한국어 본문에서는 자연스러운 합쇼체의 ‘주’로 옮기고, 별도의 야훼 표기는 본문에 요구되지 않는다고 보았습니다.
- source_word: ኢያቅረቦ፡ ኀቤሁ
  english_pob_choice: did not bring near to himself
  chosen_korean: 자신에게 가까이 이끌지 않으셨고
  alternatives_korean:
  - 자기에게 가까이 오게 하지 않으셨고
  - 자기에게 가까이 데려오지 않으셨고
  lexicon: קרב / bring near
  rationale: 히브리어적 ‘가까이 데려오다/가까이 나아가게 하다’의 관계적 의미를 살려, 단순한 공간 이동보다 선택과 접근 거부의 뉘앙스가 드러나도록 옮겼습니다.
- source_word: አእመሮሙ
  english_pob_choice: he knew them
  chosen_korean: 그분이 그들을 아셨기 때문입니다
  alternatives_korean:
  - 그분이 그들을 알고 계셨기 때문입니다
  - 그분이 그들을 아셨습니다
  lexicon: ידע
  rationale: 공동체를 향한 인식과 분별의 의미를 살리되, 영어 POB의 인과구조를 반영해 ‘~때문입니다’로 연결했습니다.
- source_word: ሕዝበ
  english_pob_choice: his people
  chosen_korean: 자기 백성
  alternatives_korean:
  - 그의 백성
  - 그분의 백성
  lexicon: עם
  rationale: 결과 목적을 나타내는 표현으로 자연스럽게 ‘자기 백성’이라 옮겨, 하나님의 소유와 언약적 귀속을 분명히 했습니다.
theological_decisions:
- issue: ‘선택하지 않으셨다’와 ‘그들을 아셨기 때문’의 관계
  chosen_reading: 하나님이 이스마엘과 에서를 배제하신 이유를 그들의 출신이 아니라 ‘그들을 아심’에 둔 인과 구조로 유지했습니다.
  alternative_readings:
  - ‘그들을 아셨고, 또 선택하지 않으셨다’처럼 병렬적으로 약화하는 번역
  - ‘비록 … 하지만’으로 대조를 강화하는 번역
  rationale: 게으즈의 እስመ는 여기서 ‘왜냐하면/때문에’로 읽는 것이 문법과 영어 POB 수정 이력에 부합하며, 본문의 신학적 논점을 흐리지 않습니다.
  doctrine_reference: 예지와 선택의 관계에 대한 본문 고유의 서술
- issue: ‘그의 백성’의 관계성
  chosen_reading: ‘자기 백성’으로 번역해 언약적 소유와 귀속을 드러냈습니다.
  alternative_readings:
  - ‘그의 백성’
  - ‘백성’
  rationale: 본문이 단지 집단적 호칭이 아니라 하나님께 속한 공동체 형성을 말하므로, 소유 대명사를 살렸습니다.
  doctrine_reference: 언약 백성의 선택
