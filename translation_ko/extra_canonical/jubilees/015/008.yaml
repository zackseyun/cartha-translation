  yaml_path: translation/extra_canonical/jubilees/015/008.yaml
  text: And I will make you very great, and I will make you into nations, and kings shall come out from you. And I will establish my covenant between me and you and between your seed after you throughout their generations, as an everlasting ordinance, so that I may be God to you and to your seed after you.
translation:
  language: ko
  text: 내가 너를 매우 크게 하며, 너에게서 여러 민족이 나오게 하겠고, 왕들도 너에게서 나올 것입니다. 또 내가 나와 너와 네 뒤를 이을 네 후손 사이에 내 언약을 세워, 그들의 대대로 영원한 규례가 되게 하겠습니다. 이는 내가 너와 네 뒤를 이을 네 후손에게 하나님이 되기 위함입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዐብየከ፡²⁸ ጥቀ፡
  english_pob_choice: And I will make you very great
  chosen_korean: 내가 너를 매우 크게 하겠고
  alternatives_korean:
  - 내가 너를 크게 하겠고
  - 내가 너를 지극히 크게 하겠고
  lexicon: 없음
  rationale: 동사형 ‘크게 하다’로 원문의 ‘매우 크게’라는 강조를 자연스럽게 살렸고, 과도한 의역 없이 정도부사 ‘매우’를 유지했습니다.
- source_word: ወእሁበከ፡ ውስተ፡ አሕዛብ፡ ወነገሥት፡ ይወፅኡ፡ እምኔከ።
  english_pob_choice: and I will make you into nations, and kings shall come out from you
  chosen_korean: 너를 민족들이 되게 하겠으며, 왕들이 너에게서 나올 것입니다
  alternatives_korean:
  - 너를 여러 민족으로 만들겠으며, 왕들이 너에게서 나오게 하겠습니다
  - 너를 민족들로 이루게 하겠으며, 왕들이 너에게서 나올 것입니다
  lexicon: 아흐자브/네가스트
  rationale: 아ሕዛብ은 ‘민족들’로, 왕들의 출처를 나타내는 እምኔከ는 ‘너에게서’로 옮겨 출생/기원 관계를 분명히 했습니다.
- source_word: ኪዳንየ፡ ማእከሌየ፡ ወማእከሌከ፡ ወማእከለ፡ ዘርእከ፡ እምድኅሬከ፡
  english_pob_choice: I will establish my covenant between me and you and between your seed after you
  chosen_korean: 내 언약을 나와 너 사이, 그리고 너의 뒤에 올 네 씨 사이에 세워
  alternatives_korean:
  - 내 언약을 나와 너 사이와 너의 뒤에 올 네 씨 사이에 세워
  - 내 언약을 나와 너와 네 씨 사이에 세워
  lexicon: ኪዳን / ዘር
  rationale: ‘언약’은 고정 번역을 따르고, ዘርእ은 혈통적·언약적 후손을 드러내기 위해 ‘씨’로 유지했습니다.
- source_word: በትዝምዶሙ፡ ለሥርዓት፡ ዘለዓለም፡
  english_pob_choice: throughout their generations, as an everlasting ordinance
  chosen_korean: 그들의 대대로 영원한 규례가 되게 하겠습니다
  alternatives_korean:
  - 그들의 대대로 영원한 법도로 삼겠습니다
  - 그들의 세대마다 영원한 규례가 되게 하겠습니다
  lexicon: ትዝምዶ / ሥርዓት
  rationale: 세대의 연속성을 ‘대대로’로, ሥርዓት은 제도적·규범적 성격을 살려 ‘규례’로 옮겼습니다.
- source_word: ከመ፡ እኩንከ፡ አምላከ፡ ወለዘርእከ፡ እምድኅሬከ።
  english_pob_choice: so that I may be God to you and to your seed after you
  chosen_korean: 그렇게 하여 내가 너와 너의 뒤에 올 네 씨에게 하나님이 되겠습니다
  alternatives_korean:
  - 그리하여 내가 너와 네 뒤의 씨에게 하나님이 되겠습니다
  - 내가 너와 너의 뒤에 올 네 씨의 하나님이 되겠습니다
  lexicon: አምላክ
  rationale: 관계적 표현을 살려 ‘~에게 하나님이 되다’로 옮겨, 언약의 목적절을 분명히 했습니다.
theological_decisions:
- issue: 언약 상대의 범위와 목적
  chosen_reading: 하나님이 아브라함과 그의 씨 사이에 언약을 세워, 세대를 넘어 지속되는 관계를 확립하신다는 의미를 분명히 했습니다.
  alternative_readings:
  - 언약을 단순히 ‘맺는다’로 완화하는 읽기
  - ‘하나님이 되겠다’를 일반적 소속 표현으로 약화하는 읽기
  rationale: 원문은 언약의 제정과 그 목적(관계적 소속)을 함께 말하므로, 둘을 한 문장 흐름 안에서 그대로 드러냈습니다.
  doctrine_reference: 창세기 17:7의 언약 공식과 평행
