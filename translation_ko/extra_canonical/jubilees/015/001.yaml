translation:
  language: ko
  text: 이 희년의 넷째 주 다섯째 해, 셋째 달 중순에 아브람은 밀 수확의 첫 열매 절기를 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዓመተ፡ ኃምስ፡ ዘሰብዐ፡ ዘ¹¹ራብዑ፡ ለ*ኢዮቤልዉን፡
  english_pob_choice: In the fifth year of the fourth week of this jubilee
  chosen_korean: 이 희년의 넷째 주의 다섯째 해
  alternatives_korean:
  - 이 희년의 네 번째 주의 다섯째 해
  - 희년의 넷째 주 다섯째 해
  lexicon: 희년 / 주 / 해
  rationale: 원문은 희년-주-연도 단위를 순서대로 제시하므로 그 구조를 보존했습니다. '주'는 여기서 주간이 아니라 희년 안의 7년 단위를 가리키므로 문맥상 '주'로 옮겼습니다.
- source_word: በወርኀ፡ ሣልስ፡ *በመንፈቀ፡ ወርኀ፡
  english_pob_choice: in the third month, in the middle of the month
  chosen_korean: 셋째 달, 그 달의 한가운데에
  alternatives_korean:
  - 셋째 달, 달의 중간에
  - 셋째 달, 그 달의 중간에
  lexicon: 달 / 한가운데
  rationale: 원문의 '월의 중간'은 절기 시점을 분명히 하는 표현이므로, 자연스러운 현대 한국어로 '그 달의 한가운데'라고 옮겼습니다.
- source_word: ገብረ፡ አብራም፡ በዓለ፡
  english_pob_choice: Abram celebrated the festival
  chosen_korean: 아브람은 … 절기를 지켰습니다
  alternatives_korean:
  - 아브람은 … 축제를 지켰습니다
  - 아브람은 … 명절을 지켰습니다
  lexicon: 절기 / 지키다
  rationale: 문맥상 단순한 축하가 아니라 지정된 제의적 절기 준수를 뜻하므로, 한국어 성경에서 널리 쓰이는 '절기를 지키다'를 사용했습니다.
- source_word: ቀዳሜ፡ ማእረር፡ ዘዘርአ፡ ስርናይ
  english_pob_choice: the festival of the firstfruits of the wheat harvest
  chosen_korean: 밀 추수의 첫 열매 절기
  alternatives_korean:
  - 밀 수확의 첫 열매 절기
  - 밀 수확 첫 열매의 절기
  lexicon: 첫 열매 / 밀 추수
  rationale: '''ስርናይ''는 일반 곡물이 아니라 ''밀''을 가리키므로, 최신 POB 수정처럼 ''grain harvest''보다 좁은 의미를 반영해 ''밀 추수''로 옮겼습니다. ''첫 열매''는 제의적 첫 수확을 유지합니다.'
theological_decisions:
- issue: 절기의 성격을 서술하는 동사 선택
  chosen_reading: '''축하했다''보다 ''절기를 지켰다''를 사용해 율례 준수의 의미를 드러냈습니다.'
  alternative_readings:
  - 절기를 축하했습니다
  - 절기를 기념했습니다
  rationale: 희년 문맥에서 이는 단순한 행사보다 규정된 절기 이행을 말하므로, 본문의 제의적 성격을 살렸습니다.
  doctrine_reference: 희년/절기 규례의 서술적 성격
