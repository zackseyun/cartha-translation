    text: Or 'opposite all the angels of the presence and all the angels of holiness'.
    reason: previous_rendering
  - marker: b
    text: Or 'thus he created them'.
    reason: previous_rendering
translation:
  language: ko
  text: 모든 임재의 천사들과 모든 거룩함의 천사들의 창조는 창조된 날부터 이와 같았습니다. 그는 임재의 천사들과 거룩함의 천사들 앞에서 이스라엘을 거룩하게 하셨으니, 그들이 그와 그의 거룩한 천사들과 함께 있게 하시려는 것이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘임재의 천사들과 거룩함의 천사들을 마주하여’.
    reason: ወአንጻሮሙ의 기본 공간 의미는 ‘맞은편에/마주하여’이며, 문맥상 본문에서는 자연스럽게 ‘앞에서’로 옮겼습니다.
  - marker: b
    text: 또는 ‘이와 같이 그들을 창조하셨습니다’.
    reason: ከመዝ፡ ፍጥረቶሙ는 명사구로 ‘그들의 창조는 이와 같았다’로 옮기는 것이 우선이나, 동사형으로 이해하는 번역 전통도 있어 대안을 제시합니다.
lexical_decisions:
- source_word: ኵሎሙ መላእክተ ገጽ
  english_pob_choice: the angels of the presence
  chosen_korean: 현존의 천사들
  alternatives_korean:
  - 임재의 천사들
  - 얼굴의 천사들
  lexicon: source phrase መላእክተ ገጽ
  rationale: POB의 ‘presence’를 한국어에서 가장 직접적으로 풀어 옮기되, ‘임재’보다 더 문자적인 ‘현존’을 택해 천사들의 지위를 보존했습니다.
- source_word: መላእክተ ቅዳሴ
  english_pob_choice: the angels of holiness
  chosen_korean: 거룩함의 천사들
  alternatives_korean:
  - 거룩한 천사들
  - 성결의 천사들
  lexicon: source phrase መላእክተ ቅዳሴ
  rationale: 형용사화한 ‘거룩한’보다 원문의 속성 명사 구조를 살려 ‘거룩함의 천사들’로 옮겼습니다.
- source_word: ከመዝ፡ ፍጥረቶሙ
  english_pob_choice: thus was their creation
  chosen_korean: 곧 그들의 창조는 … 그러하였으며
  alternatives_korean:
  - 이렇게 그들이 창조되었으며
  - 그들의 창조는 이와 같았으며
  lexicon: source phrase ከመዝ + ፍጥረቶሙ
  rationale: 개정된 영어본의 해석적 ‘he created them’보다, 게에즈의 명사구 ‘그들의 창조’를 따라 창조 상태를 진술하는 한국어 구조로 재현했습니다.
- source_word: ወአንጻሮሙ
  english_pob_choice: before the angels of the presence and the angels of holiness
  chosen_korean: … 앞에서
  alternatives_korean:
  - … 맞은편에서
  - … 앞에
  lexicon: source adverb አንጻር
  rationale: 영어 POB의 최신 수정과 일치하게, ‘opposite’보다 문맥상 자연스러운 ‘앞에서’를 택하되 대조 관계는 유지했습니다.
theological_decisions:
- issue: ‘거룩하게 하셨으니’의 주체와 목적
  chosen_reading: 하나님이 이스라엘을 거룩하게 하셔서 그와 그의 거룩한 천사들과 함께 있게 하셨다는 진술로 읽었습니다.
  alternative_readings:
  - ‘거룩하게 하셨으니’만 단순 과거 사실로 읽을 수 있음
  - 이스라엘이 천사들과 동일한 반열이 된다는 의미로 오독될 수 있음
  rationale: 원문과 영어 POB 모두 이스라엘의 성별 목적을 말하며, 천사들과의 동반은 종속절의 목적에 해당하므로 평행을 살리면서도 위계를 흐리지 않도록 옮겼습니다.
  doctrine_reference: 성별(거룩하게 하심)과 천사론의 위계 구분
- issue: ‘모든 현존의 천사들과 모든 거룩함의 천사들’의 반복
  chosen_reading: 두 범주의 천사를 모두 두 번 언급하는 구조를 유지했습니다.
  alternative_readings:
  - 중복으로 보고 한 번만 번역
  - 의미상 통합하여 ‘모든 천사들’로 축약
  rationale: 게에즈 본문과 영어 POB의 구조를 따라 반복을 보존해야, 의도된 강조와 평행법이 사라지지 않습니다.
  doctrine_reference: 본문 구조 보존 원칙
