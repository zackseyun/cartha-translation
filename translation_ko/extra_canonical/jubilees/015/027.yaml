revisions:
- from: 이는 모든 현존의 천사들과 모든 거룩함의 천사들—곧 그들의 창조는 창조된 날부터 그러하였으며—모든 현존의 천사들과 모든 거룩함의 천사들 앞에서 그가 이스라엘을 거룩하게 하셨으니, 이는 그들이 그와 그의 거룩한 천사들과 함께 있게 하려는 것이었습니다.[a][b]
  to: 모든 임재의 천사들과 모든 거룩함의 천사들의 창조는 창조된 날부터 이와 같았습니다. 그는 임재의 천사들과 거룩함의 천사들 앞에서 이스라엘을 거룩하게 하셨으니, 그들이 그와 그의 거룩한 천사들과 함께 있게 하시려는 것이었습니다.[a][b]
  rationale: Second-occurrence ‘모든’을 삭제하여 게ʽ즈어의 수식 범위를 보존했습니다. ‘임재의 천사들’로 용어를 자연스럽고 관용적인 한국어로 다듬었으며, 첫 절을 완결된 문장으로 재구성했습니다. 두 번의 천사 집단 언급, 창조에 관한 명사구, ‘앞에서’라는 문맥적 번역, 그리고 이스라엘이 하나님 및 그의 거룩한 천사들과 함께 있게 되는 목적은 모두 유지했습니다.
