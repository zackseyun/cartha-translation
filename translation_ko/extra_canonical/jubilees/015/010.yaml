  to: 내가 너와 네 뒤를 이을 네 씨에게, 네가 나그네로 머물렀던 땅 곧 가나안 땅을 영원한 소유로 줄 것이며, 그들의 하나님이 되겠습니다.”
  rationale: 원문의 두 미래 약속을 ‘줄 것이며 ... 되겠습니다’로 병렬하여 보존하고, 초안에 추가된 ‘말하겠다’의 의미를 제거했습니다. 가나안이 나그네로 머물던 땅이라는 동격 관계와 ‘너와 네 씨’라는 수여 대상을 명료하게 유지했습니다.
