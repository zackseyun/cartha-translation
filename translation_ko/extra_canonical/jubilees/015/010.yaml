  yaml_path: translation/extra_canonical/jubilees/015/010.yaml
  text: And I will give to you and to your seed after you the land where you have resided as a foreigner, the land of Canaan, for an everlasting possession, and I will be their God.”
translation:
  language: ko
  text: 내가 너와 네 뒤에 오는 네 씨에게, 너희가 나그네로 머물렀던 가나안 땅을 영원한 소유로 주고, 나는 그들의 하나님이 되겠다고 하겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሁብ
  english_pob_choice: I will give
  chosen_korean: 주고
  alternatives_korean:
  - 드리고
  - 내어 주고
  lexicon: give
  rationale: 미래 시상의 약속을 자연스럽게 살리면서, 뒤의 ‘나는…되겠다’와 병렬을 이루도록 간결하게 옮겼습니다.
- source_word: ለከ፡ ወለዘርእከ፡ እምድኅሬከ፡
  english_pob_choice: to you and to your seed after you
  chosen_korean: 너와 네 뒤에 오는 네 씨에게
  alternatives_korean:
  - 너와 네 자손에게
  - 너와 너 뒤의 네 씨에게
  lexicon: seed / after you
  rationale: ‘씨’는 언약 계열을 드러내는 직역적 표현이므로 유지했고, ‘after you’를 ‘네 뒤에 오는’으로 풀어 시간적 계승을 분명히 했습니다.
- source_word: ፈለስከ፡
  english_pob_choice: you have resided as a foreigner
  chosen_korean: 나그네로 머물렀던
  alternatives_korean:
  - 외국인으로 거주했던
  - 이방인으로 살았던
  lexicon: sojourn as alien
  rationale: 단순한 거주가 아니라 타지에서 임시로 머문 상태를 나타내므로 ‘나그네로 머물렀던’이 원뜻을 가장 잘 살립니다.
- source_word: ዘትኳን፡ ለዓለም፡
  english_pob_choice: for an everlasting possession
  chosen_korean: 영원한 소유로
  alternatives_korean:
  - 영원한 기업으로
  - 영구한 소유로
  lexicon: perpetual possession
  rationale: ‘소유’는 소유권의 지속성을, ‘영원한’은 ለዓለም의 무기한성을 직접 반영합니다. 전통적 ‘기업’은 문맥상 가능하지만 소유권 강조가 더 분명합니다.
- source_word: እከውኖሙ አምላከ
  english_pob_choice: I will be their God
  chosen_korean: 나는 그들의 하나님이 되겠다고 하겠습니다
  alternatives_korean:
  - 나는 그들의 하나님이 되겠습니다
  - 내가 그들의 하나님이 되겠다고 하겠습니다
  lexicon: be their God
  rationale: Geez의 1인칭 서약형을 현대 한국어에서 약속 진술로 자연스럽게 풀었고, 목적어 ‘그들의’를 유지해 공동체적 언약 관계를 분명히 했습니다.
theological_decisions:
- issue: 언약 소유 약속의 강조
  chosen_reading: 가나안 땅을 ‘영원한 소유’로 주겠다는 약속을 그대로 유지했습니다.
  alternative_readings:
  - ‘기업’으로 완화해 번역
  - ‘영구한 기업’으로 번역
  rationale: 본문은 단순한 거주 허가가 아니라 지속적 언약 소유를 말하므로, 소유권의 강한 표현을 보존하는 것이 문맥에 더 충실합니다.
  doctrine_reference: 언약 약속 / 땅 소유
