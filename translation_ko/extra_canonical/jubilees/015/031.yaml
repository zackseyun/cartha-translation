  yaml_path: translation/extra_canonical/jubilees/015/031.yaml
  text: And he sanctified him and gathered him from all the children of men; for there are many nations and many peoples, and all are his, and over all he appointed spirits to lead them astray from following him.
  footnotes:
  - marker: a
    text: Or 'from after him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그를 거룩하게 하시고 모든 사람의 자손 가운데서 그를 모으셨습니다. 이는 많은 민족과 많은 백성이 있고, 그들 모두는 그의 것이며, 그들 모두 위에 영들을 두셔서 그들이 그를 따르지 않도록 미혹하게 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그의 뒤에서 떠나’입니다.
    reason: 게에즈어 እምድኅሬሁ의 문자적 ‘뒤/후’ 표현을 밝혀, 본문의 관용적 의미인 ‘그를 따르는 데서 벗어남’을 뒷받침합니다.
lexical_decisions:
- source_word: ወቀደሶ፡
  english_pob_choice: he sanctified him
  chosen_korean: 그를 거룩하게 하시고
  alternatives_korean:
  - 그를 성별하시고
  - 그를 거룩히 하시고
  lexicon: 거룩하게 하다
  rationale: 거룩함을 부여하거나 구별하는 행위를 자연스러운 합쇼체로 옮기되, 전통적 기독교 용어인 ‘성별하다’보다 원문의 직접적 의미가 드러나도록 했습니다.
- source_word: ወአስተጋብኦ፡ እምኵሉ፡ ውሉደ፡ ሰብእ፡
  english_pob_choice: and gathered him from all the children of men
  chosen_korean: 모든 사람의 자손 가운데서 그를 모으셨습니다
  alternatives_korean:
  - 모든 사람의 자손 가운데서 그를 거두셨습니다
  - 모든 사람의 자손 가운데서 그를 불러 모으셨습니다
  lexicon: 모으다
  rationale: ‘자손/children’과 ‘사람/men’의 중첩을 살리면서도, ‘가운데서’로 출처를 분명히 드러내 원문의 분리·선별 뉘앙스를 유지했습니다.
- source_word: ወዲበ፡ ኵሉ፡ አሰለመ፡ መናፍስተ፡
  english_pob_choice: and over all he appointed spirits
  chosen_korean: 또한 그들 모두 위에 영들을 두어
  alternatives_korean:
  - 또한 그들 모두 위에 영들을 세워
  - 또한 그들 모두 위에 영들을 नियुक्त하여
  lexicon: 영
  rationale: ‘spirits’는 여기서 인격적 존재 일반을 가리키므로 성령이 아니라 ‘영들’로 옮겼고, ‘두다’는 배치·임명 모두를 포괄하는 자연스러운 대응입니다.
- source_word: ከመ፡ ያስሕትዎሙ፡ እምድኅሬሁ።
  english_pob_choice: to lead them astray from after him
  chosen_korean: 그가 뒤따르지 못하게 하셨습니다
  alternatives_korean:
  - 그들이 그를 뒤따르지 못하게 하셨습니다
  - 그 뒤를 따르지 않게 하셨습니다
  lexicon: 뒤따르다
  rationale: POB 개정 이력의 ‘from after him’과 게이즈 관용구 እምድኅሬሁ를 함께 반영해, 단순한 ‘따르다’보다 방향성을 지닌 ‘뒤따르다’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 영들을 두어 사람들을 미혹하게 하신다는 표현의 보존
  chosen_reading: 원문의 원인적·주권적 진술을 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - ‘허락하셨습니다’처럼 약화하는 번역
  - ‘유혹할 영들’로 풀어 설명하는 번역
  rationale: 본문은 신학적으로 불편할 수 있는 대목이지만, 기록된 내용은 하나님이 영들을 배치해 사람들을 그분에게서 멀어지게 하게 하신다는 직설적 진술이므로 이를 순화하지 않았습니다.
  doctrine_reference: 섭리와 심판에 대한 본문 직시; 서술적 주권 진술
