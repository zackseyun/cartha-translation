translation:
  language: ko
  text: 그는 제단 위에 새 제물을 바쳤습니다. 곧 소산의 첫 열매를 주님께 드린 것입니다. 그는 황소와 염소[a]와 양을 제단 위에서 주님께 향기로운 냄새가 되도록 바쳤고, 그에 딸린 소제와 전제를 향과 함께 제단 위에 바쳤습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘황소와 숫양과 양’.
    reason: 영어 POB 감사 기록에 보존된 둘째 동물의 이문 가능성을 해당 단어에 직접 연결합니다.
lexical_decisions:
- source_word: መሥዋዕተ፡ ሐዲስ፡
  english_pob_choice: a new sacrifice
  chosen_korean: 새 제물
  alternatives_korean:
  - 새 희생제물
  - 새 제사
  lexicon: 제물
  rationale: Ge‘ez의 ‘새로운 제사/제물’은 문맥상 제단에 드리는 헌납을 가리키므로, 현대 한국어에서는 ‘새 제물’이 가장 자연스럽고 원문의 의미를 직접 살립니다.
- source_word: ቀዳሜ፡ እክል፡
  english_pob_choice: the firstfruits of the produce
  chosen_korean: 열매의 첫 소산
  alternatives_korean:
  - 곡식의 첫 열매
  - 첫 열매의 소산
  lexicon: 첫 소산
  rationale: ‘firstfruits of the produce’는 단순한 과일이 아니라 수확물 전체의 첫 몫을 뜻하므로, ‘열매의 첫 소산’으로 넓게 잡아 소산/수확의 감각을 살렸습니다.
- source_word: ላህመ፡ ወበሐኮ፡ ወበግዐ፡
  english_pob_choice: a bull and a goat and a sheep
  chosen_korean: 수송아지와 염소와 양
  alternatives_korean:
  - 황소와 염소 새끼와 양
  - 송아지와 염소와 양
  lexicon: 수송아지
  rationale: review trail상 첫 동물은 ‘bull’보다 ‘calf/young bull’에 가깝고, 둘째는 ‘goat/young goat’로 확인되므로, 각각 한국어에서 가장 무난한 가축 명칭으로 옮겼습니다.
- source_word: ጽንሓሐ፡
  english_pob_choice: a pleasing aroma
  chosen_korean: 향기로운 제물
  alternatives_korean:
  - 기쁜 향기
  - 향기로운 향
  lexicon: 향기
  rationale: 문자적 ‘향기/냄새’ 표현을 살리되, 한국어에서는 제사 문맥을 위해 ‘향기로운 제물’로 풀어 원문의 수용적 뉘앙스를 유지했습니다.
- source_word: ምስለ፡ ስኂን።
  english_pob_choice: with incense
  chosen_korean: 향과 함께
  alternatives_korean:
  - 유향과 함께
  - 향내와 함께
  lexicon: 향
  rationale: Ge‘ez의 일반적 ‘향/향료’ 범위를 과도하게 특정하지 않고, 영어 POB의 broad ‘incense’를 반영해 ‘향’으로 번역했습니다.
theological_decisions:
- issue: ‘향기로운 제물’의 기능적 표현 여부
  chosen_reading: 제단 위에 드린 짐승 제물을 하나님께서 받으실 만한 향기로운 예물로 제시했습니다.
  alternative_readings:
  - ‘번제’로 이해할 수 있게 옮김
  - 직역적으로 ‘향기로운 냄새’로만 옮김
  rationale: 원문은 제물의 종류와 함께 수용 가능한 향기 이미지를 결합하므로, 제사 용어를 과도하게 특정하지 않으면서도 제의적 수용성을 드러내는 표현이 적절합니다.
  doctrine_reference: 제의 문맥의 관용적 표현
