  text: And your name shall no longer be called Abram, but from now and forever your name shall be Abraham, for I have made you the father of many nations.
translation:
  language: ko
  text: 다시는 당신의 이름을 아브람이라 부르지 않고, 이제부터 영원히 당신의 이름은 아브라함이 될 것입니다. 이는 내가 당신을 많은 민족의 아버지로 삼았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢይጼዋዕ… አብራም… አብርሃም
  english_pob_choice: your name shall no longer be called Abram ... your name shall be Abraham
  chosen_korean: “다시는 …이라 부르지 않고 … 이름은 …이 될 것입니다”
  alternatives_korean:
  - “더 이상 …라고 불리지 않고 …라고 불릴 것입니다”
