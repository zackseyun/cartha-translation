base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/015/028.yaml
  text: And you, command the children of Israel, and let them keep the sign of the covenant throughout their generations as an everlasting ordinance, and they shall not be uprooted from the land.
translation:
  language: ko
  text: 그리고 당신은 이스라엘 자손에게 명령하여, 그들이 대대로 영원한 규례로 언약의 표를 지키게 하십시오. 그들은 그 땅에서 뽑히지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተኒ፡ አዝዝ፡
  english_pob_choice: And you, command
  chosen_korean: “그리고 당신은 … 명하여”
  alternatives_korean:
  - “그리고 당신은 … 명령하십시오”
  - “당신은 … 지시하십시오”
  lexicon: 명하다
  rationale: Geez 원문의 명령형을 자연스러운 현대 한국어로 옮기되, 직설적이고 권위 있는 어조를 유지하기 위해 ‘명하다’를 택했습니다.
- source_word: ለውሉደ፡ እስራኤል፡
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: 이스라엘 자손
  rationale: 족장·언약 문맥에서 게으름 없이 혈통/언약 공동체를 가리키는 전형적 표현이므로 직역에 가까운 ‘이스라엘 자손’을 사용했습니다.
- source_word: ትእምርተ፡ ኪዳን፡
  english_pob_choice: the sign of the covenant
  chosen_korean: 언약의 표
  alternatives_korean:
  - 언약의 표징
  - 언약의 징표
  lexicon: 표/표징
  rationale: ‘표’는 Geez 원문의 ትእምርት(표, 징표)와 가장 직접적으로 대응하며, ‘표징’보다 간결하게 상징적 기능을 유지합니다.
- source_word: ሥርዐት፡ ዘለዓለም፡
  english_pob_choice: an everlasting ordinance
  chosen_korean: 영원한 규례
  alternatives_korean:
  - 영속하는 규정
  - 영원한 율례
  lexicon: 규례
  rationale: 이 문맥에서 ሥርዐት은 법적·언약적 규정이므로 ‘규례’가 가장 안정적이며, ‘영원한’은 ዘለዓለም의 지속성을 살립니다.
- source_word: ወኢይሠረዉ፡ እምነ፡ ምድር።
  english_pob_choice: and they shall not be uprooted from the land
  chosen_korean: 그들은 그 땅에서 뽑히지 않을 것입니다
  alternatives_korean:
  - 그들은 그 땅에서 제거되지 않을 것입니다
  - 그들은 그 땅에서 쫓겨나지 않을 것입니다
  lexicon: 뽑히다
  rationale: Geez 동사 어근은 ‘뽑다/근절하다’의 이미지를 가지므로, 토지에서의 추방을 완곡화하지 않도록 ‘뽑히지 않다’로 직역했습니다.
theological_decisions:
- issue: 언약 표의 성격
  chosen_reading: ‘언약의 표’로 유지해, 상징과 실천을 함께 가리키는 문맥을 드러냈습니다.
  alternative_readings:
  - ‘언약의 표징’으로 보다 해석적으로 옮김
  - ‘언약의 표시’로 약화시킴
  rationale: 원문은 단순한 표시가 아니라 언약 공동체를 규정하는 표지라는 점을 강조하므로, 중립적이면서도 강한 ‘표’를 택했습니다.
  doctrine_reference: 언약 표지/징표에 대한 족장기 전승의 문맥
