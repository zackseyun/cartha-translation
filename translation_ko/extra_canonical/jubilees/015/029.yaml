  language: ko
  text: 이는 명령이 언약으로 제정되었으니, 그들이 그것을 영원히 이스라엘의 모든 자손 가운데 지키게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትእዛዝ
  english_pob_choice: the command
  chosen_korean: 명령
  alternatives_korean:
  - 계명
  - 지시
  - 법령
  lexicon: N/A
  rationale: Geez의 ትእዛዝ는 단순한 권고보다 규범적 명령을 가리키므로, 영어 POB의 ‘the command’에 맞춰 ‘명령’으로 옮겼습니다.
- source_word: ተሠርዐ
  english_pob_choice: has been ordained
  chosen_korean: 제정되었으니
  alternatives_korean:
  - 정해졌으니
  - 명해졌으니
  - 세워졌으니
  lexicon: N/A
  rationale: 수동형 완료 의미를 살려 ‘제정되다’를 택해, 단순한 지정이 아니라 공식적으로 확립된 상태를 드러냈습니다.
- source_word: ለኪዳን
  english_pob_choice: as a covenant
  chosen_korean: 언약으로
  alternatives_korean:
  - 언약으로서
  - 언약이 되도록
  - 언약으로 삼아
  lexicon: N/A
  rationale: ‘~로’는 결과·성격을 함께 담아, 명령이 언약의 형태와 기능을 띠게 되었다는 점을 자연스럽게 표현합니다.
- source_word: ዲበ ኵሎሙ ደቂቀ እስራኤል
  english_pob_choice: among all the children of Israel
  chosen_korean: 이스라엘의 모든 자손 가운데
  alternatives_korean:
  - 이스라엘 자손 전체에게
  - 이스라엘의 모든 자손들 가운데
  - 이스라엘의 모든 자녀들 가운데
  lexicon: N/A
  rationale: ‘children of Israel’을 관용적이면서도 직역에 가까운 ‘이스라엘의 모든 자손’으로 유지하고, 전치사적 범위를 ‘가운데’로 살렸습니다.
theological_decisions:
- issue: 명령과 언약의 결합
  chosen_reading: ‘명령이 언약으로 제정되었다’는 구조를 그대로 살려, 규례가 단순한 법조항이 아니라 언약적 표지로 기능함을 드러냈습니다.
  alternative_readings:
  - 명령이 언약으로 세워졌다
  - 명령을 언약으로 삼으셨다
  rationale: 본문의 수동형은 인간의 행위보다 제정된 질서를 강조하므로, 이를 약화시키지 않는 표현을 선택했습니다.
  doctrine_reference: 언약신학 / 율법-언약 관계
