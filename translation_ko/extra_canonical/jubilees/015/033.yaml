  - marker: a
    text: Or 'for they will leave some of the flesh of their circumcision, and all the sons of Belial'.
    reason: previous_rendering
  - marker: b
    text: Or 'all this law'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제 내가 너희에게 말합니다. 이스라엘 자손은 이 규례를 지키지 않을 것이며, 율법 전체에 따라 자기 아들들에게 할례를 행하지도 않을 것입니다. 그들은 아들들에게 할례를 행할 때 잘라 내야 할 살 일부를 남겨 둘 것이며, 벨리알의 모든 자손은 태어날 때 그대로 자기 아들들을 할례받지 않은 채로 둘 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ፡ አነ፡ አዜንወከ፡
  english_pob_choice: And now I am telling you
  chosen_korean: 그리고 이제 내가 너희에게 말합니다
  alternatives_korean:
