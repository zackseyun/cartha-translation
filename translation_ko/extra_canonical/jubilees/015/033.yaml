  text: And now I am telling you that the children of Israel will not keep this ordinance, and they will not circumcise their sons according to all the law; for they will leave some of the flesh of their circumcision in the circumcision of their sons, and all the sons of Belial will leave their sons uncircumcised as they were born.
  footnotes:
  - marker: a
    text: Or 'for they will leave some of the flesh of their circumcision, and all the sons of Belial'.
    reason: previous_rendering
  - marker: b
    text: Or 'all this law'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제 내가 너희에게 말합니다. 이스라엘 자손은 이 규례를 지키지 않을 것이며, 모든 율법대로 그들의 아들들에게 할례를 행하지도 않을 것입니다. 그들은 아들들의 할례에서 할례받은 살의 일부를 남겨 둘 것이며, 벨리알의 모든 자손은 태어날 때 그대로 자기 아들들을 할례받지 않은 채로 둘 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ፡ አነ፡ አዜንወከ፡
  english_pob_choice: And now I am telling you
  chosen_korean: 그리고 이제 내가 너희에게 말합니다
  alternatives_korean:
  - 그리고 지금 내가 너희에게 말합니다
  - 이제 내가 너희에게 말합니다
  lexicon: source note
  rationale: 현재 시점의 선언을 자연스럽게 옮기되, 예언적/경고적 발화의 직접성을 살려 합쇼체로 처리했습니다.
- source_word: ሥርዐት፡
  english_pob_choice: this ordinance
  chosen_korean: 이 규례
  alternatives_korean:
  - 이 명령
  - 이 조례
  lexicon: 법/의례 용례
  rationale: 문맥상 율법적 의무를 가리키므로 ‘규례’가 가장 직접적입니다.
- source_word: ኵሉ፡ ሕግ
  english_pob_choice: all the law
  chosen_korean: 모든 율법
  alternatives_korean:
  - 그 모든 율법
  - 온 율법
  lexicon: 율법
  rationale: 지시어를 덧붙이지 않고 원문의 단순한 ‘모든 율법’을 살렸습니다.
- source_word: ውሉደ፡ ቤልአር፡
  english_pob_choice: the sons of Belial
  chosen_korean: 벨리알의 모든 자손
  alternatives_korean:
  - 벨리알의 아들들
  - 벨리알의 자손들
  lexicon: 고유명사/관용구
  rationale: ‘sons of Belial’은 집단적 악인들을 가리키는 관용적 표현이므로 직역과 집합성을 함께 살려 ‘자손’으로 옮겼습니다.
- source_word: ዘእንበለ፡ ክስበት፡ በከመ፡ ተወልዱ።
  english_pob_choice: uncircumcised as they were born
  chosen_korean: 태어날 때 그대로 … 할례받지 않은 채로 둘 것입니다
  alternatives_korean:
  - 태어난 그대로 … 할례받지 않은 채로 둘 것입니다
  - 태어났을 때처럼 … 할례하지 않은 상태로 둘 것입니다
  lexicon: 서술 표현
  rationale: 출생 상태를 강조하는 표현이므로 ‘태어날 때 그대로’로 살리고, 결과 상태를 ‘할례받지 않은 채로’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 할례 절차의 결함 표현
  chosen_reading: ‘아들들의 할례에서 할례받은 살의 일부를 남겨 둘 것이며’로, 단순히 할례를 생략하는 것이 아니라 의례를 불완전하게 수행하는 의미를 드러냈습니다.
  alternative_readings:
  - ‘할례할 때 살의 일부를 남겨 둘 것이며’
  - ‘할례의 살을 조금 남길 것이며’
  rationale: 게에즈 원문과 영어 POB 모두 ‘할례의 살 일부를 남겨 두는’ 불완전한 집행을 말하므로, 이를 모호하게 약화하지 않도록 했습니다.
  doctrine_reference: 출생 표징으로서의 할례 규정(창 17장 배경)
