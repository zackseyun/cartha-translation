revisions:
- from: 그리고 이제 내가 너희에게 말합니다. 이스라엘 자손은 이 규례를 지키지 않을 것이며, 모든 율법대로 그들의 아들들에게 할례를 행하지도 않을 것입니다. 그들은 아들들의 할례에서 할례받은 살의 일부를 남겨 둘 것이며, 벨리알의 모든 자손은 태어날 때 그대로 자기 아들들을 할례받지 않은 채로 둘 것입니다.[a][b]
  to: 그리고 이제 내가 너희에게 말합니다. 이스라엘 자손은 이 규례를 지키지 않을 것이며, 율법 전체에 따라 자기 아들들에게 할례를 행하지도 않을 것입니다. 그들은 아들들에게 할례를 행할 때 잘라 내야 할 살 일부를 남겨 둘 것이며, 벨리알의 모든 자손은 태어날 때 그대로 자기 아들들을 할례받지 않은 채로 둘 것입니다.
  rationale: 불완전한 할례를 가리키는 구절을 현대 한국어에서 명료하게 ‘잘라 내야 할 살 일부를 남겨 둘 것’으로 옮겼습니다. 이는 원문의 ‘할례의 살 일부를 … 아들들의 할례에서 남겨 둔다’는 의미와 영어 POB의 보완된 독법을 반영합니다. 근거 없는 한국어 각주 앵커는 삭제했습니다.
