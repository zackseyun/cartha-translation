  text: But over Israel he did not hand over or entrust any angel or spirit, for he alone is their ruler, and he will guard them and require them from the hand of his angels and from the hand of his spirits and from the hand of all his authorities, so that he may guard them and bless them, and that they may be his and he may be theirs from now and forever.
  footnotes:
  - marker: a
    text: Or 'he did not appoint'.
    reason: previous_rendering
  - marker: b
    text: Or 'seek them from the hand of'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 이스라엘 위에는 어떤 천사나 영도 넘겨 주거나 맡기지 않으셨습니다. 그분만이 그들의 통치자이시기 때문입니다. 그분은 자기 천사들의 손에서, 자기 영들의 손에서, 그리고 자기 모든 권위의 손에서 그들을 지키시고 찾아내시며, 그들을 지키고 복 주시려는 것이며, 그들이 그분의 것이 되고 그분이 그들의 것이 되게 하시려는 것이니, 이제부터 영원까지 그러하실 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢያሰለመ፡ ወአመነሂ፡
  english_pob_choice: did not hand over or entrust
  chosen_korean: 넘겨 주거나 맡기지 않으셨습니다
  alternatives_korean:
  - 지정하지 않으셨습니다
  - 임명하지 않으셨습니다
  lexicon: 개념어
  rationale: 게에즈 본문의 두 동사에는 ‘넘겨 주다/맡기다’의 뉘앙스가 함께 있어, 단순한 임명보다 위탁·양도의 의미를 살리는 쪽이 본문에 더 가깝습니다.
- source_word: መኰንኖሙ
  english_pob_choice: their ruler
  chosen_korean: 그들의 통치자
  alternatives_korean:
  - 그들의 주권자
  - 그들의 지배자
  lexicon: 개념어
  rationale: 문맥상 단순한 지도자보다 위에 군림하는 통치 권위를 가리키므로 ‘통치자’가 가장 무난하게 대응합니다.
- source_word: የዐቅቦሙ
  english_pob_choice: guard them
  chosen_korean: 지키시고
  alternatives_korean:
  - 보호하시고
  - 간수하시고
  lexicon: 동사어휘
  rationale: 반복되는 보호 동사로서 ‘지키다’가 가장 직접적이며, 뒤의 반복과도 자연스럽게 대응합니다.
- source_word: ይትኀሠሦሙ
  english_pob_choice: seek them from the hand of
  chosen_korean: 찾아내시며
  alternatives_korean:
  - 요구하시며
  - 찾으시며
  lexicon: 동사어휘
  rationale: ‘손에서 찾다/요구하다’는 헬과 게에즈 관용구의 의미를 함께 담고 있어, 한국어에서는 ‘찾아내다’로 재현해 회수·소명 책임의 뉘앙스를 살렸습니다.
- source_word: ትእዛዝያኒሁ
  english_pob_choice: all his authorities
  chosen_korean: 자기 모든 권위
  alternatives_korean:
  - 자기 모든 권세
  - 자기 모든 권력
  lexicon: 개념어
  rationale: 단순한 능력보다 질서 있는 통치 권한을 뜻하므로 ‘권위’가 가장 가깝고, 영어 POB의 ‘authorities’와도 맞닿습니다.
theological_decisions:
- issue: 이스라엘에 대한 천사/영의 비위탁과 하나님의 직접 통치
  chosen_reading: 이스라엘은 어떤 천사나 영에게도 넘겨지지 않고, 야훼께서 직접 그들의 통치자이시며 보호와 보충을 담당하신다는 구조를 유지했습니다.
  alternative_readings:
  - 천사나 영을 임명하지 않으셨습니다
  - 천사나 영을 세우지 않으셨습니다
  rationale: 본문의 핵심은 ‘임명’보다 ‘넘겨 주거나 맡기지 않음’에 있으며, 이 대비가 이스라엘의 특별한 보호와 직접 통치를 강조합니다.
