base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/021.yaml
  text: '1[13]. And in the sixth year of the seventh week of years of this jubilee, Abraham called Isaac his son and instructed him, saying, “I have grown old, and I do not know the day of my death, and my days are completed.

    2. And behold, I am one hundred seventy-five years old, and through all the days of my life I have remained mindful of the Lord, seeking with all my heart to do his will

    3. and to walk uprightly in all his paths. My soul hated idols, so that I might guard myself to do

    4. the will of him who created me. For he is the living God, and he is holy and faithful and righteous above all; and with him there is no partiality and no accepting of gifts, for he is a righteous God and one who executes judgment on all who transgress his commandment and his covenant.

    5. And you also, my son, keep his commandment and his statutes and his judgments, and do not walk after the impurities,

    6. or after the carved images, or after the molten images. And do not eat any blood

    7. of beasts or cattle or of any bird that flies in the sky. And if you slaughter a sacrifice for a thanksgiving of peace, slaughter it so that its blood is poured out upon the altar; and all the fat of the offering you shall offer up on the altar, together with fine flour mixed with oil and with its drink offering you shall offer it all together on the altar as an offering of a pleasing fragrance before

    8. the Lord. And the fat of the sacrifice of deliverance you shall place on the fire that is on the altar: the fat that is on the entrails[13], and all the fat that is on the inward parts, and the two kidneys, and all

    9. the fat that is on them, and that which is on the loins, and the liver with the kidneys, you shall remove. And you shall offer all this as a pleasing fragrance acceptable before the Lord, with its grain offering

    10. and with its drink offering, as an offering of pleasing fragrance to the Lord. And eat its flesh on that day and on the second day, and do not let the sun set on it until the second day before it is eaten; and do not leave any of it for the third day, because it is not acceptable, for it is an evil thing set apart, and it must not be eaten; and all who eat it will bear their sin. For thus I found written in the books of my forefathers, the former ones, and in the words of Enoch and in the words of Noah.

    11. And on all your offerings put salt, and do not let the salt of the covenant be lacking from any of

    12. your offerings before the Lord. And take care with the wood of the offering, so that you do not bring wood for the altar from these: vine, fig, myrtle, laurel, cypress, cedar, juniper, date-palm, almond, olive, myrrh, bay, and ash-wood,

    13. [called] arsatna and besem; but from among these woods place under the sacrifice such as have been tested in appearance. And do not place any split wood, but hard and clean wood, without blemish, sound and new-grown; and do not place old wood, because its fragrance has gone out

    14. and there is no longer fragrance on it as at first. Other than these woods, do not place any different kind, because its fragrance is known and the scent of its fragrance goes up to heaven.

    15. Keep this command and do it, my son, so that you may walk rightly in all your deeds. And at all times be pure in your body, and wash yourself with water before you come to offer on the altar; and wash your hands and your feet before you approach the altar; and when you have finished offering, go in

    17. and wash your hands and your feet. And let no blood be seen on you or on your garments.

    18. Take care, my son, concerning blood; take care to cover it with dust in the earth. And do not eat

    19. blood at all, because it is the life; and do not eat any blood. And do not accept a gift concerning any human blood, lest it be exacted from you without judgment; for it is the blood that is shed which pollutes the earth, and the earth cannot be cleansed from the blood of a man except by the blood of the one who shed it.

    20. And do not accept gifts and do not be partial in a case of human blood; blood for blood is to be rendered before the Lord, the Most High God. And it will be good as a memorial for you, so that you may be kept from every evil and so that he may save you from every death. I see, my son, all the works of the children of men, that all their sin and evil and all their deeds are uncleanness and abomination and defilement, and there is no righteousness with them. Take care not to walk in their ways and not to tread in their paths, and do not sin a sin leading to death before the Most High God, lest he hide his face from you and give you into the hand of your offense and root you out from the earth, and your seed from under heaven, and your name and your seed be destroyed from all the earth. Turn away from all their deeds and from all their uncleanness, and keep the charge of the Most High God, and do his will and be upright in everything. And he will bless you in all your deeds, and he
    will raise up from you a plant of righteousness in all the earth throughout all generations of the earth. And my name and your name will not be forgotten under heaven forever. Go, my son, in peace. May the Most High God, my God and your God, strengthen you to do his will; and may he bless all your seed and the remnant of your seed for the generations forever with every righteous blessing[20][15], so that you may become a blessing on all the earth.” And he went out from before him rejoicing.'
  footnotes:
  - marker: '13'
    text: The list of woods in vv. 12-14 contains several difficult plant names in Ethiopic transliteration. Some identifications are uncertain, and the sequence may reflect borrowed or regional botanical terms rather than stable English species equivalents.
    reason: lexical_alternative
  - marker: '13'
    text: 'The phrase rendered ''[called] arsatna and besem'' is textually awkward and may preserve corrupt or poorly understood tree names. The sense of the larger instruction is clear: only select, sound, fragrant wood is to be used for the altar fire.'
    reason: textual_variant
  - marker: '15'
    text: The chapter numbering in the source rows appears to skip from v. 15 to v. 17. No separate English v. 16 is supplied because the provided Ge'ez segmentation contains no distinct row for it.
    reason: segmentation_note
  - marker: '20'
    text: The clause 'give you into the hand of your offense' is difficult. It may mean 'into the hand of your enemies' or preserve a corrupted reading. The translation stays close to the transmitted wording while signaling the warning of judgment.
    reason: textual_variant
translation:
  language: ko
  text: '1[13]. 그리고 이 희년 일곱째 주의 여섯째 해에 아브라함이 그의 아들 이삭을 불러서 그에게 지시하여 이르되, “내가 늙어서 나의 죽을 날을 알지 못하며 나의 날이 다 찼으니.

    2. 보라, 내 나이 백칠십오 세라 내 평생에 내가 주님를 생각하며 그의 뜻을 행하기를 온 마음으로 구하였노라

    3. 그의 모든 길을 정직하게 행하게 하소서. 내 마음이 우상을 미워하여 스스로 경계하여 행하려 하였더니

    4. 나를 창조하신 분의 뜻. 그는 살아 계신 하나님이시며 모든 것보다 거룩하고 신실하시며 의로우시며 그에게는 사람을 외모로 취하심이 없으시며 선물을 받으심이 없으시니 그는 의로우신 하나님이시라 그의 계명과 언약을 범하는 자를 다 심판하시는 자이심이라

    5. 내 아들아 너도 그의 명령과 율례와 법도를 지키며 더러운 것을 좇지 말라

    6. 조각한 형상 뒤에나 녹인 형상 뒤에. 그리고 피는 먹지 마세요.

    7. 짐승이나 가축이나 하늘을 나는 모든 새의 것. 그리고 평화의 감사제물을 잡으려면, 그 피가 제단에 쏟아지도록 잡으십시오. 제물의 모든 기름을 제단에 드리되 고운 가루에 기름을 섞은 것과 그 전제와 함께 다 함께 제단 위에 드려 향기로운 제사를 드릴지니라

    8. 주님. 또 구원 희생의 기름을 제단 위 불 위에 둘지니 곧 내장에 있는 기름과 내장에 있는 모든 기름과 두 콩팥과

    9. 그 위에 있는 기름과 허리에 있는 것과 간과 콩팥을 떼어내라. 너는 이 모든 것을 소제물과 함께 주님 앞에 받으실 만한 향기로운 냄새로 드릴지니라

    10. 그 전제와 함께 주님께 향기로운 제물을 드리며 그 고기를 그 날과 그 둘째 날에 먹고 둘째 날까지 해가 지지 않게 한 후에 먹되 그리고 삼일 동안에는 조금도 남기지 마십시오. 그것은 받아들일 만한 것이 아닙니다. 그것은 악한 것이므로 먹어서는 안 되는 것입니다. 그것을 먹는 사람은 모두 자기 죄를 당할 것이다. 나는 내 조상들의 책과 에녹의 말과 노아의 말에 이같이 기록된 것을 보았노라.

    11. 네 모든 예물에 소금을 더할지니 모든 것 중에 언약의 소금을 빼지 말라

    12. 주님 앞에 너희의 제물을 드리라 제단에 쓸 나무는 삼가서 포도나무와 무화과나무와 화석류와 월계수와 잣나무와 백향목과 로간주나무와 대추나무와 살구나무와 감람나무와 몰약과 월계수와 물푸레나무와

    13. [called] arsatna 및 besem; 그러나 이 숲 중에서 겉모습이 시험된 나무를 제물로 바쳐라. 그리고 쪼개진 나무를 놓지 말고, 단단하고 깨끗한 나무, 흠 없고 튼튼하고 새로 자란 나무를 놓아라. 낡은 나무를 두지 말라 그 향기가 빠졌느니라

    14. 그리고 더 이상 처음처럼 향기가 나지 않습니다. 이 숲 외에는 다른 종류를 두지 말라 그 향기가 알려지고 그 향기가 하늘에 사무치느니라.

    15. 내 아들아, 이 명령을 지켜 행하라. 그러면 네가 네 모든 행위를 올바로 행할 것이다. 그리고 제단에 제물을 드리러 오기 전에는 항상 몸을 깨끗하게 하고 물로 몸을 씻으십시오. 그리고 제단에 다가가기 전에 손과 발을 씻으십시오. 그리고 제사를 마친 후에 들어가라.

    17. 그리고 손과 발을 씻으십시오. 그리고 당신과 당신의 옷에 피가 묻어나지 않게 하십시오.

    18. 내 아들아, 피에 대하여 조심하라. 땅의 먼지로 덮어 두십시오. 그리고 먹지 마세요

    19. 피가 생명이니 이는 피라. 피도 먹지 마세요. 그리고 사람의 피에 관한 선물은 받지 마십시오. 심판 없이 빼앗기지 않도록 하십시오. 흘린 피가 땅을 더럽히느니라. 사람의 피를 흘리신 이의 피가 아니면 땅을 정결하게 할 수 없느니라.

    20. 선물을 받지 말며 사람의 피를 흘릴 때 편파적인 태도를 취하지 마십시오. 피에는 피를 지극히 높으신 하나님 주님 앞에 드려야 합니다. 이 일이 너희에게 좋은 기념이 되어 너희를 지켜 모든 환난에서 지켜지게 하시고 또 주님께서 너희를 모든 사망에서 구원하실 것임이니라 내 아들아, 내가 사람의 자녀들의 모든 행위를 보노니, 그들의 모든 죄와 악과 그들의 모든 행위는 더러움과 가증함과 더러움이며 그들에게는 의가 없느니라. 너는 삼가 그 길로 행하지 말며 그 길을 밟지 말며 지극히 높으신 하나님 앞에서 사망에 이르는 죄를 짓지 말라 그렇지 아니하면 그가 그의 얼굴을 네게서 가리우사 너를 범죄케 하는 손에 붙이시며 너를 땅에서 뿌리째 뽑으실 것이며 네 자손이 천하에서 끊어지며 네 이름과 네 자손이 온 땅에서 끊어질까 하노라 모든 행위와 모든 더러운 것에서 떠나 지극히 높으신 하나님의 직분을 지켜 그의 뜻을 행하며 범사에 정직하라. 그리고 그분께서는 네 모든 일에 네게 복을 주시며, 땅의 모든 세대에 걸쳐 온 땅에 의로운 나무가 자라게 하실 것이다. 그리고 내 이름과 당신의 이름은 하늘 아래서 영원히 잊혀지지 않을 것입니다. 내 아들아, 평안히 가라. 지극히 높으신 하나님, 나의 하나님, 너희 하나님이 너희를 강하게 하여 그의 뜻을 행하게 하시기를 원하노라 그리고 그가 모든 의로운 축복으로 너희 모든 자손과 너희 자손의 남은 자에게 대대로 영원히 복을 주시리니 너희가 온 땅에서 복이 되게 하시기를 원하노라.” 그리고 그는 기뻐하며 그 앞에서 나갔다.'
