translation:
  language: ko
  text: 그것은 정해진 것이며, 이 해에서 오는 해로 넘겨 둘 것이 없습니다. 그 해에는 씨앗이 먹히되, 이듬해의 씨앗을 거두는 날들까지이며, 포도주는 …까지입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተኀርየ
  english_pob_choice: It has been ordained
  chosen_korean: 정해진 것입니다
  alternatives_korean:
  - 명정된 것입니다
  - 지정된 것입니다
  - 판정된 것입니다
  lexicon: Geez verb root ተኀርየ
  rationale: 문맥상 단순한 ‘부족함’이 아니라 규정·명령된 상태를 가리키므로, 결정된 뜻을 살리되 한국어로는 가장 자연스러운 ‘정해진 것’으로 옮겼습니다.
- source_word: ወአልቦ፡ ለአትርፎ፡ እምኔሁ
  english_pob_choice: and there is no keeping it over from this year to the year that is coming
  chosen_korean: 이 해에서 오는 해로 넘겨 둘 것이 없습니다
  alternatives_korean:
  - 이 해에서 다음 해로 남겨 둘 것이 없습니다
  - 이 해에서 오는 해까지 보존해 둘 수 없습니다
  lexicon: Geez negative existence + verb of remaining/overkeeping
  rationale: POB의 수정된 audit trail처럼 ‘남아 있지 않다/넘겨 두지 못하다’의 의미를 반영했고, 농경 맥락의 ‘남겨 두기’보다 ‘넘겨 두기’가 자연스럽습니다.
- source_word: ይትበላዕ፡ ዘርእ
  english_pob_choice: the seed is eaten
  chosen_korean: 씨앗이 먹히되
  alternatives_korean:
  - 씨앗이 먹힙니다
  - 씨앗을 먹습니다
  - 종자가 소비되되
  lexicon: Geez passive construction; agricultural idiom
  rationale: 수동형을 보존해 ‘먹히다’로 옮기고, 농경 관용 표현이라는 점을 드러내기 위해 평서형보다 문맥 연결형 ‘먹히되’를 택했습니다.
- source_word: እስከ፡ አመ፡ መዋዕለ፡ ሐፊረ፡
  english_pob_choice: until the days of the gathering of the seed of the year
  chosen_korean: 이듬해의 씨앗을 거두는 날들까지
  alternatives_korean:
  - 씨앗을 거두는 날들까지
  - 추수의 날들까지
  - 이 해의 씨앗을 거두는 때까지
  lexicon: Geez temporal phrase with harvest/gathering sense
  rationale: 반복되는 농사 절차를 살려 ‘거두는 날들’로 풀었고, ‘이듬해의 씨앗’은 뒤 문장의 연대 관계를 자연스럽게 연결합니다.
theological_decisions:
- issue: 본문이 끝에서 끊긴 채 전승되는 문제
  chosen_reading: 번역도 마지막을 줄임표로 남겨 본문의 절단 상태를 드러냈습니다.
  alternative_readings:
  - 완결된 문장처럼 매끈하게 보정함
  - 의미를 추정해 보충함
  rationale: 게제즈 원문과 POB 영어가 모두 문장 끝이 미완성이므로, 독자가 결락을 오해하지 않도록 미완결성을 그대로 보존하는 것이 정직합니다.
  doctrine_reference: 본문 비평 및 번역 윤리
- issue: ‘정해진 것’의 운명론적 뉘앙스
  chosen_reading: ‘정해진 것입니다’로 옮겨 규정된 질서의 뉘앙스를 살리되, 인격적 하나님 명시를 덧붙이지는 않았습니다.
  alternative_readings:
  - ‘운명지어진 것입니다’
  - ‘명령된 것입니다’
  rationale: 본문은 추상적 규정의 진술이지 직접적인 신학 명제 확장이 아니므로, 과도한 해석을 피하면서도 문맥의 확정성을 유지했습니다.
  doctrine_reference: 번역 투명성
