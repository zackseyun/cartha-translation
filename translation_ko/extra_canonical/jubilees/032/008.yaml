base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/008.yaml
  text: they shall burn her with fire, because she has defiled the name of her father’s house, and she shall be rooted out from Israel. And let no fornication or uncleanness be found in Israel through all the days of the generations of the earth, for Israel is holy to the LORD; and everyone who defiles it shall surely die; they shall stone him with stones.
translation:
  language: ko
  text: 그들은 그 여인을 불에 태워야 합니다. 이는 그 여인이 자기 아버지 집의 이름을 더럽혔기 때문이며, 그 여인은 이스라엘에서 끊어져야 합니다. 땅의 모든 세대에 걸쳐 이스라엘 가운데 음행이나 부정함이 발견되어서는 안 됩니다. 이스라엘은 주님께 거룩하기 때문입니다. 이스라엘을 더럽히는 사람은 누구든지 반드시 죽어야 하며, 그들은 그를 돌로 쳐야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያውዕይዋ
  english_pob_choice: they shall burn her with fire
  chosen_korean: 그들은 그녀를 불로 태워야 합니다
  alternatives_korean:
  - 그들은 그녀를 불에 태워야 합니다
  - 그들은 그녀를 불로 불사라야 합니다
  lexicon: Geez ውዐየ / related burn verb
  rationale: 목적어가 여성 단수임을 분명히 드러내기 위해 ‘그녀를’를 살렸고, 형벌의 수단인 ‘불로’는 영어 POB의 audit trail과 직접 대응하게 옮겼습니다.
- source_word: ቤተ፡ አቡሃ፡
  english_pob_choice: her father’s house
  chosen_korean: 아버지 집의 이름
  alternatives_korean:
  - 아버지의 집
  - 그녀의 아버지 집
  lexicon: house/family name idiom
  rationale: 영어 POB가 ‘name of her father’s house’로 풀어 쓴 점을 따라, 가문과 명예를 함께 가리키는 표현으로 ‘아버지 집의 이름’을 유지했습니다.
- source_word: ቅዱስ፡ እስራኤል፡ ለእግዚአብሔር፡
  english_pob_choice: Israel is holy to the LORD
  chosen_korean: 이스라엘은 주님께 거룩하기 때문입니다
  alternatives_korean:
  - 이스라엘은 야훼께 거룩하기 때문입니다
  - 이스라엘은 주님께 속한 거룩한 백성이기 때문입니다
  lexicon: holy / LORD
  rationale: 본문의 ‘거룩함’과 ‘주님께’라는 소속 관계를 간결하게 살렸으며, 이 구절은 직접적인 야훼 인용보다는 서술적 진술로 보여 POB의 ‘LORD’를 주님으로 처리했습니다.
- source_word: ይውግርዎ
  english_pob_choice: they shall stone him with stones
  chosen_korean: 그들은 그를 돌로 쳐야 합니다
  alternatives_korean:
  - 그들은 그를 돌로 쳐야 합니다
  - 그들은 그에게 돌을 던져야 합니다
  lexicon: stone with stones
  rationale: 히브리-에티오피아 법문 형벌 관용구를 한국어 법률 문체로 자연스럽게 옮겼고, ‘돌로 치다’가 처형 방식을 가장 직접적으로 드러냅니다.
theological_decisions:
- issue: 이스라엘의 성결과 형벌 조항의 연결
  chosen_reading: 이스라엘의 거룩함 때문에 성적 부정과 오염이 공동체 안에 허용될 수 없으며, 더럽히는 자는 반드시 죽어야 한다는 규범적 선언으로 옮겼습니다.
  alternative_readings:
  - 이스라엘의 의례적 정결 규정으로만 제한하는 읽기
  - 문장들을 완화하여 경고문 수준으로 보는 읽기
  rationale: 본문은 단순한 도덕 권고가 아니라 공동체 정체성과 생명형벌을 연결하는 강한 규범 진술이므로, 그 강도를 그대로 보존했습니다.
  doctrine_reference: 공동체 성결, 율법적 형벌, 언약 백성의 구별
