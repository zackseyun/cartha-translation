base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/015.yaml
  text: the daughters of the nations. And if there is any from his daughters whom he gives to a man from any of the nations, for it is plague upon plague, and curse upon curse; and all this plague and curse shall come if he does this thing, and if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together shall be judged for all the uncleanness and profanation.
  footnotes:
  - marker: a
    text: Or 'from your daughters'.
    reason: previous_rendering
  - marker: b
    text: Or 'above the daughters of the nations.'.
    reason: previous_rendering
  - marker: c
    text: Or 'plague upon plague shall be upon him'.
    reason: previous_rendering
translation:
  language: ko
  text: 열방의 딸들이며, 또 그의 딸들 가운데 누구든지 그가 열방 가운데 어떤 남자에게 준 자가 있다면, 이는 재앙 위에 재앙이요 저주 위에 저주입니다. 그가 이 일을 행하거나 부정한 일을 행하는 자들, 주님의 성소를 더럽히는 자들, 그의 거룩한 이름을 모독하는 자들에게 눈감는다면, 이 모든 재앙과 저주가 임할 것입니다. 모든 백성이 함께 그 모든 부정함과 모독 때문에 심판을 받을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዋልደ፡ አሕዛብ፡
  english_pob_choice: the daughters of the nations
  chosen_korean: 열방의 딸들
  alternatives_korean:
  - 민족들의 딸들
  - 나라들의 딸들
  lexicon: 아들/딸; 민족/열방
  rationale: 지시 대상을 직역하되, 성서적 문맥에서 ἔθνη/아무족류에 해당하는 표현을 한국어 성경 어법에 맞게 ‘열방’으로 옮겼습니다.
- source_word: ዘወሀቦ፡ ለብእሲ፡
  english_pob_choice: whom he gives to a man
  chosen_korean: 그가 어떤 사람에게 준 자
  alternatives_korean:
  - 그가 남자에게 준 자
  - 그가 사람에게 준 자
  lexicon: 주다; 사람
  rationale: 수동적/관계적 구조를 살려 ‘준 자’로 옮기고, 특정 성별을 굳이 보강하지 않도록 ‘어떤 사람’으로 처리했습니다.
- source_word: መቅሠፍት፡ ... ወመርገም፡
  english_pob_choice: plague upon plague, and curse upon curse
  chosen_korean: 재앙 위에 재앙이요 저주 위에 저주
  alternatives_korean:
  - 재앙에 재앙이요 저주에 저주
  - 재앙이 거듭되고 저주가 거듭되며
  lexicon: 재앙; 저주
  rationale: 반복 강조 구조를 한국어의 ‘~위에 ~’로 살려 누적성과 강도를 보존했습니다.
- source_word: ይጌምኑ፡ ስሞ፡ ቅዱሰ፡
  english_pob_choice: profane his holy name
  chosen_korean: 그의 거룩한 이름을 모독하는
  alternatives_korean:
  - 그의 거룩한 이름을 더럽히는
  - 그의 거룩한 이름을 욕되게 하는
  lexicon: 이름; 거룩하다; 모독하다
  rationale: ‘profane’의 공적·성소적 훼손 뉘앙스를 ‘모독하다’로 유지해, 단순 오염보다 강한 신성 침해를 드러냈습니다.
theological_decisions:
- issue: ‘the LORD’의 대응과 성소/이름 모독의 신학적 강도
  chosen_reading: ‘주님’과 ‘그의 거룩한 이름’으로 옮겨, 성소를 더럽히는 행위와 이름을 모독하는 행위를 병렬된 언약 위반으로 드러냈습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 단락의 주어가 신성 모독과 성소 훼손을 병렬로 고발하므로, 관계적·예배적 강도를 살리는 표준 경어형 ‘주님’을 택했습니다.
  doctrine_reference: 언약적 거룩함과 성소 보존
