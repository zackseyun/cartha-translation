revisions:
- from: 그들에게는 이것을 행하고 친구들로 기록되게 하는 것이 정해져 있습니다. 그러나 만일 그들이 어기고 그 모든 길에서 부정하게 행하면, 그들은 하늘의 판에 적대자들로 기록되고, 생명의 책에서 지워지며, 멸망할 자들의 책과 그들과 함께 있는 이들 가운데 기록될 것입니다.[a]
  to: 그들은 이것을 행하고 친구들로 기록되도록 정해져 있습니다. 그러나 만일 그들이 어기고 그 모든 길에서 부정하게 행하면, 그들은 하늘의 판에 적대자들로 기록되고, 생명의 책에서 지워지며, 멸망할 자들의 책에, 그리고 …하는 이들과 함께 기록될 것입니다.
  rationale: 첫 절을 수동적·규정적 의미가 분명한 표현으로 고쳤습니다. 종결부에서는 원문이 ‘…하는 이들과 함께’라는 관계절 도중에 끝나는 상태를 줄임표로 보존하여, 임의의 보충 없이 영어 POB 감사본의 미완성도 반영했습니다. 이에 따라 현재 본문과 맞지 않는 이전 번역 각주와 그 표지를 제거했습니다.
