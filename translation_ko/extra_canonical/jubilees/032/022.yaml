translation:
  language: ko
  text: 그들에게는 이것을 행하고 친구들로 기록되게 하는 것이 정해져 있습니다. 그러나 만일 그들이 어기고 그 모든 길에서 부정하게 행하면, 그들은 하늘의 판에 적대자들로 기록되고, 생명의 책에서 지워지며, 멸망할 자들의 책과 그들과 함께 있는 이들 가운데 기록될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሤሠርዐት
  english_pob_choice: It is ordained for them
  chosen_korean: 그들에게는 … 하는 것이 정해져 있습니다
  alternatives_korean:
  - 그들에게 명령되어 있습니다
  - 그들에게 규례로 정해져 있습니다
  lexicon: 정하다 / 정해지다
  rationale: 게으즈 원문은 단순 명령보다 이미 정해진 규정의 성격을 띠므로, ‘정해져 있습니다’로 수동·상태적 의미를 살렸습니다.
- source_word: ወይጸሐፉ፡ አዕርክተ
  english_pob_choice: be recorded as friends
  chosen_korean: 친구들로 기록되게 하는
  alternatives_korean:
  - 친구들로 기록되는
  - 벗들로 적히는
  lexicon: 기록되다 / 친구
  rationale: 원문은 ‘기록되다’와 ‘친구들(복수)’의 결합이므로, 행위 결과를 나타내는 표현으로 옮기고 ‘친구들’은 관계적 표지를 살리기 위해 유지했습니다.
- source_word: ጸላእተ
  english_pob_choice: adversaries
  chosen_korean: 적대자들
  alternatives_korean:
  - 원수들
  - 대적자들
  lexicon: 적대자
  rationale: ‘adversaries’의 법정·대립적 뉘앙스를 살리기 위해 ‘적대자들’을 선택했고, 전통적 신앙 문체의 ‘원수들’보다 원문의 선언적 대조가 분명합니다.
- source_word: መጽሐፈ፡ ሕይወት
  english_pob_choice: book of life
  chosen_korean: 생명의 책
  alternatives_korean:
  - 생명책
  - 생명에 관한 책
  lexicon: 생명의 책
  rationale: 이 관용구는 종말론적 등록 명부를 가리키므로, 직역형인 ‘생명의 책’으로 보존했습니다.
theological_decisions:
- issue: 친구들/적대자들의 대조
  chosen_reading: ‘친구들로 기록되게 하는 것’과 ‘적대자들로 기록됨’의 대조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘의인들’/‘악인들’ 같은 도덕적 범주로 완화함
  - ‘벗’/‘원수’로 보다 친숙하게 표현함
  rationale: 본문은 단순한 감정적 관계가 아니라 하늘 기록부에 등재되는 언약적·공적 신분 대조를 말하므로, 대조를 약화하지 않고 유지했습니다.
  doctrine_reference: 하늘의 판과 생명의 책이라는 종말론적 기록 이미지
