base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/018.yaml
  text: Blessed be everyone who blesses you, and all the people who curse you shall be cursed. And to Judah he said, "May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go forth and be spoken of throughout all the earth and regions. Then nations will fear before your face.
  footnotes:
  - marker: a
    text: Or 'and its regions'.
    reason: previous_rendering
  - marker: b
    text: Or 'before your face,"'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신을 축복하는 모든 사람은 복을 받을 것이며, 당신을 저주하는 모든 백성은 저주를 받을 것입니다. 그리고 유다에게는 이렇게 말했습니다. "주께서 당신에게 힘과 능력을 주셔서, 당신을 미워하는 모든 사람을 짓밟게 하십시오. 당신과 당신의 아들 한 사람을 야곱의 아들들 위에 다스리는 통치자가 되게 하십시오. 당신의 이름과 당신의 아들들의 이름이 온 땅과 모든 지역에 널리 알려지게 하십시오. 그러면 민족들이 당신의 얼굴 앞에서 두려워할 것입니다."[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቡሩክ፡ ወኵሉ፡ ሕዝብ፡ ዘይረግመከ፡ ይኩን፡ ርጉመ።
  english_pob_choice: Blessed be everyone who blesses you, and all the people who curse you shall be cursed.
  chosen_korean: 당신을 축복하는 모든 사람은 복을 받을 것이며, 당신을 저주하는 모든 백성은 저주를 받을 것입니다.
  alternatives_korean:
  - 당신을 축복하는 이는 모두 복을 받을 것이며, 당신을 저주하는 백성은 모두 저주를 받을 것입니다.
  - 당신을 축복하는 모든 이는 복되며, 당신을 저주하는 모든 사람은 저주를 받을 것입니다.
  lexicon: ቡሩክ / ርጉመ
  rationale: 앞뒤 대구를 살려 수동적 선언형으로 옮겼고, ወኵሉ ሕዝብ은 ‘모든 사람/백성’으로 자연스럽게 받되 POB의 복수 감각을 유지했습니다.
- source_word: የሀብከ፡ እግዚአ ብሔር፡ ኃይለ፡ ወጽንዐ፡
  english_pob_choice: May the Lord give you strength and power
  chosen_korean: 주께서 당신에게 힘과 능력을 주셔서
  alternatives_korean:
  - 주께서 당신에게 힘과 권능을 주셔서
  - 주님이 당신에게 힘과 능력을 주셔서
  lexicon: እግዚአ ብሔር / ኃይለ / ወጽንዐ
  rationale: 신적 호칭은 본문 그대로 ‘주’로 두고, ኃይለ와 ወጽንዐ는 의미 중복을 피하면서도 서로 구분되는 ‘힘과 능력’으로 옮겼습니다.
- source_word: መኰንነ፡ ኩን፡ አንተ፡ ወአሐዱ፡ እምነ፡ ውሉደከ፡
  english_pob_choice: Be a ruler, you and one of your sons, over the sons of Jacob.
  chosen_korean: 당신과 당신의 아들 한 사람을 야곱의 아들들 위에 다스리는 통치자가 되게 하십시오.
  alternatives_korean:
  - 당신과 당신의 아들 한 사람이 야곱의 아들들 위에 통치자가 되게 하십시오.
  - 당신과 당신의 아들 한 사람을 야곱의 아들들 위에 군주로 삼으십시오.
  lexicon: መኰንን / ውሉደ
  rationale: ‘통치자’는 መኰንን의 권위적 지위를 살리면서 한국어에서 자연스럽고, ‘한 사람’을 덧붙여 POB의 ‘one of your sons’와 본문의 단수성을 분명히 했습니다.
- source_word: ወስመ፡ ውሉደከ፡ ይኩን፡ *ዘየሐውር፡ ወዘያንበቡ፡ ውስተ፡ ኵሉ፡ ምድር፡ ወአህጉር፡
  english_pob_choice: May your name and the name of your sons go forth and be spoken of throughout all the earth and regions.
  chosen_korean: 당신의 이름과 당신의 아들들의 이름이 온 땅과 모든 지역에 널리 알려지게 하십시오.
  alternatives_korean:
  - 당신의 이름과 당신의 아들들의 이름이 온 땅과 지역들에 전파되게 하십시오.
  - 당신의 이름과 당신의 아들들의 이름이 온 땅과 그 모든 지역에 퍼지게 하십시오.
  lexicon: የሐውር / ዘያንበቡ / ኵሉ ምድር / አህጉር
  rationale: ‘go forth and be spoken of’의 이중 동작을 한국어에서는 ‘널리 알려지다’로 한 번에 살렸고, ኵሉ ምድር과 አህጉር은 과도한 소유격 없이 ‘온 땅과 모든 지역’으로 옮겼습니다.
- source_word: አሜሃ፡ ይፈርሁ፡ አሕዛብ፡ እምቅድመ፡ ገጽከ፡
  english_pob_choice: Then nations will fear before your face.
  chosen_korean: 그러면 민족들이 당신의 얼굴 앞에서 두려워할 것입니다.
  alternatives_korean:
  - 그러면 민족들이 당신 앞에서 두려워할 것입니다.
  - 그때 민족들이 당신의 얼굴 앞에서 떨 것입니다.
  lexicon: ፈርሁ / ገጽ
  rationale: 직역적 이미지인 ‘얼굴 앞에서’를 유지해 원문의 강한 현전 표현을 보존하되, 한국어에서 어색하지 않도록 ‘두려워할 것입니다’로 정리했습니다.
theological_decisions:
- issue: 유다에게 주어지는 통치 약속의 표현
  chosen_reading: 명령형/축원형으로 유지하되, ‘통치자’라는 권위 표현을 분명히 했습니다.
  alternative_readings:
  - 더 완곡하게 ‘다스리는 이’로 풀어 쓰기
  - 왕권 암시를 약화해 ‘지도자’로 번역하기
  rationale: 본문은 단순한 지도력보다 지배적 통치의 성격을 강하게 말하므로, 이를 약화하지 않으면서도 한국어에서 이해 가능한 표현을 택했습니다.
  doctrine_reference: source fidelity; messianic/patriarchal promise imagery
