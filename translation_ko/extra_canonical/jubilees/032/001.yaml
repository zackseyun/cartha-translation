base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/001.yaml
  text: And Judah saw and rejoiced, and he blessed the God of his fathers, Abraham and Isaac. And he said, "Now I know that I have an eternal hope, and my children also, before the God of all. And thus it is ordained concerning the two of them, and it will be recorded for them as an everlasting testimony in the heavenly tablets, according to how Isaac blessed them."
  footnotes:
  - marker: a
    text: Or 'And Judah rejoiced'.
    reason: previous_rendering
translation:
  language: ko
  text: 유다가 이를 보고 기뻐하며, 그의 조상들인 아브라함과 이삭의 하나님을 찬양했습니다. 그리고 말했습니다. “이제 나는 내게 영원한 소망이 있으며, 내 자녀들도 모든 이의 하나님 앞에 있습니다. 그리고 두 사람에 관하여는 이렇게 정해졌으니, 하늘의 판에 영원한 증언으로 그들을 위해 기록될 것입니다. 이는 이삭이 그들을 축복한 것과 같습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይሁዳሃ፡ / saw and rejoiced
  english_pob_choice: And Judah saw and rejoiced
  chosen_korean: 유다가 이를 보고 기뻐하며
  alternatives_korean:
  - 유다가 기뻐했습니다
  - 유다가 보고 기뻐했습니다
  lexicon: Geez ይሁዳ + ርእየ/보았다 + ተፈሥሐ/기뻐하였다
  rationale: POB의 개정된 영어처럼 ‘보았다’와 ‘기뻐하였다’를 함께 살려, 단순 감정 반응이 아니라 어떤 상황을 보고 기뻐한 흐름을 드러냈습니다.
- source_word: አምላከ፡ አበዊሁ፡ አብርሃም፡ ወይስሐቅ።
  english_pob_choice: the God of his fathers, Abraham and Isaac
  chosen_korean: 그의 조상들인 아브라함과 이삭의 하나님
  alternatives_korean:
  - 그 조상 아브라함과 이삭의 하나님
  - 아브라함과 이삭, 그의 조상들의 하나님
  lexicon: 하나님 + 조상들/fathers
  rationale: 원문의 소유관계를 살려 ‘아브라함과 이삭’이 바로 ‘조상들’로 수식되도록 옮겼습니다.
- source_word: ተስፋ፡ ዘለዓለም
  english_pob_choice: an eternal hope
  chosen_korean: 영원한 소망
  alternatives_korean:
  - 영원한 희망
  - 끝없는 소망
  lexicon: 소망/hope
  rationale: 기독교 한국어에서 익숙하지만 본문의 종말론적 확실성을 충분히 담는 ‘소망’을 택했습니다.
- source_word: በስምዕ፡ ዘለዓለም፡ ውስተ፡ ጽላተ፡ ሰማይ
  english_pob_choice: in the heavenly tablets
  chosen_korean: 하늘의 판에
  alternatives_korean:
  - 하늘의 서판에
  - 천상의 판에
  lexicon: heavenly tablets
  rationale: 에녹/희년서의 고유 표현을 직역하되, 한국어에서 자연스러운 ‘판’으로 유지해 기록 매체 이미지를 보존했습니다.
- source_word: በከመ፡ ባረኮሙ፡ ይስሐቅ።
  english_pob_choice: according to how Isaac blessed them
  chosen_korean: 이는 이삭이 그들을 축복한 것과 같습니다
  alternatives_korean:
  - 이삭이 그들을 축복한 대로
  - 이삭이 그들을 축복한 방식에 따라
  lexicon: according to how + blessed
  rationale: 원문의 비교·준거 관계를 분명히 하면서, 축복의 내용이 이삭의 축복과 연결된다는 점을 드러냈습니다.
theological_decisions:
- issue: ‘모든 이의 하나님 앞에’의 범위와 어조
  chosen_reading: 모든 피조물 위에 계신 초월적 하나님 앞에 있다는 뜻으로, 직역을 유지해 서술했습니다.
  alternative_readings:
  - 온 세상의 하나님 앞에
  - 만물의 하나님 앞에
  rationale: 원문의 보편성을 약화시키지 않기 위해 ‘모든 이의 하나님’ 구조를 살렸습니다.
  doctrine_reference: 창조주 하나님의 보편 통치
