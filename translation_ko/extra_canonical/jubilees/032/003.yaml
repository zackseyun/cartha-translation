base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/003.yaml
  text: And in those days Rachel became pregnant with Benjamin, and Jacob counted his sons starting from him, and Levi came up in the portion of the LORD, and his father clothed him.
  footnotes:
  - marker: a
    text: Or 'Jacob counted his sons, and Levi came up'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 라헬은 베냐민을 가졌고, 야곱은 베냐민부터 시작하여 자기 아들들을 세었으며, 레위는 여호와의 몫으로 올라갔고, 레위의 아버지는 그에게 옷을 입혔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “야곱은 자기 아들들을 세었고, 레위는 올라갔습니다.”
    reason: 이전 번역 표현을 반영한 대안적 생략형입니다. 본문은 게에즈어 እምኔሁ에 따라 베냐민을 시작점으로 삼는다는 뜻을 유지합니다.
lexical_decisions:
- source_word: ፀንሰት / became pregnant
  english_pob_choice: became pregnant
  chosen_korean: 배었습니다
  alternatives_korean:
  - 임신했습니다
  - 아이를 가졌습니다
  lexicon: —
  rationale: 라헬의 상태 변화를 직접적으로 나타내되, 현대 한국어에서 가장 자연스럽고 성경적 서술에도 무리 없는 표현으로 옮겼습니다.
- source_word: ውሉዶ / his sons
  english_pob_choice: his sons
  chosen_korean: 자기 아들들을
  alternatives_korean:
  - 아들들을
  - 그의 아들들을
  lexicon: —
  rationale: 이어지는 'starting from him'의 수학적·서사적 의미를 살리기 위해, 야곱이 자기 아들들을 기준으로 세었다는 점을 분명히 했습니다.
- source_word: እምኔሁ / starting from him
  english_pob_choice: starting from him
  chosen_korean: 세었으며
  alternatives_korean:
  - 그로부터 시작하여 세었으며
  - 그를 시작점으로 세었으며
  lexicon: —
  rationale: 기존 영어 개정본이 본문 흐름상 이 요소를 약화했지만, 지적된 게에즈 표현은 야곱이 베냐민 쪽에서부터 거슬러 올라가 아들들을 계산하는 서사적·수치적 암시를 담으므로, 문맥상 자연스러운 한국어 속에 그 의미를 유지했습니다.
- source_word: በመክፈሊተ እግዚአብሔር / in the portion of the LORD
  english_pob_choice: in the portion of the LORD
  chosen_korean: 여호와의 몫으로
  alternatives_korean:
  - 주님의 몫으로
  - 여호와의 분깃으로
  lexicon: —
  rationale: ‘portion’은 단순한 위치가 아니라 분배된 몫을 가리키므로, 유산·분깃의 뉘앙스를 살려 ‘몫’으로 옮겼습니다. 야훼는 본문이 명시하는 신명칭에 따라 음역형보다 전통적으로 덜 가리지 않는 ‘여호와’를 사용했습니다.
theological_decisions:
- issue: 레위가 '여호와의 몫'에 올라간다는 표현의 의미
  chosen_reading: 레위는 단순히 장소적으로 올라간 것이 아니라, 서사 안에서 여호와께 속한 몫으로 구별되는 존재가 됩니다.
  alternative_readings:
  - 단순 이동 묘사로 읽기
  - 제사장적 선택의 예표로만 읽기
  rationale: 문맥은 레위의 특별한 구분을 강조하지만, 본문 자체는 후대 제도 설명을 직접 말하지 않으므로 과도한 신학적 확대는 피하고 기본 의미만 유지했습니다.
  doctrine_reference: 구별과 몫의 신학
- issue: ‘그의 아버지는 그를 입혔습니다’의 주어 해석
  chosen_reading: ‘그의 아버지’는 야곱을 가리키며, 본문대로 직설적으로 유지했습니다.
  alternative_readings:
  - 라헬의 아버지로 오해될 가능성
  - ‘옷을 입혔다’보다 더 해석적인 표현
  rationale: 게에즈 본문은 주어를 분명하게 야곱의 맥락으로 이어가므로, 인물을 바꾸거나 의미를 확장하지 않고 그대로 옮기는 것이 가장 안전합니다.
  doctrine_reference: 본문 충실성
