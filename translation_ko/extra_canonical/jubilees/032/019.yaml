translation:
  language: ko
  text: 인자들의 모든 자손에게. 나는 하늘 아래에 있는 온 땅을 네 씨에게 주겠습니다. 그들은 원하는 대로 모든 민족들 위를 다스릴 것이며, 그 후에는 온 땅을 자기들에게로 모아 그것을 상속할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ፡ ሰብእ
  english_pob_choice: all the children of men
  chosen_korean: 인자들의 모든 자손
  alternatives_korean:
  - 사람의 모든 자녀
  - 모든 사람의 자손
  lexicon: extra-canonical/Jubilees
  rationale: Geez의 직역상 ‘사람의 자손들’에 해당하므로, 인류 전체를 가리키는 일반적 표현으로 옮겼습니다. ‘인자’는 한국어 성경 관용어를 피하기 위해 인간 남성 중심처럼 들릴 수 있어 ‘인자들의’는 문맥적 보완으로만 최소화했습니다.
- source_word: ኵላ፡ ምድረ፡ ከመትሕተ፡ ሰማይ
  english_pob_choice: all the earth that is under heaven
  chosen_korean: 하늘 아래에 있는 온 땅
  alternatives_korean:
  - 하늘 아래의 모든 땅
  - 하늘 아래 온 땅
  lexicon: extra-canonical/Jubilees
  rationale: 지리적 총칭을 자연스러운 현대 한국어로 옮기되, ‘하늘 아래’라는 원문의 관용적 범위를 유지했습니다.
- source_word: ይኴንኑ፡ ... በከመ፡ ፈቀዱ
  english_pob_choice: they will rule over all the nations as they desire
  chosen_korean: 그들은 원하는 대로 모든 민족들 위를 다스릴 것이며
  alternatives_korean:
  - 그들은 뜻하는 대로 모든 민족들을 다스릴 것이며
  - 그들은 원하는 대로 모든 민족들 가운데서 다스릴 것이며
  lexicon: extra-canonical/Jubilees
  rationale: POB의 수정 반영에 따라 ‘over’를 살려 지배·통치의 방향성을 분명히 했습니다. ‘원하는 대로’는 ፈቀዱ의 자발적 의지 뉘앙스를 그대로 살립니다.
- source_word: ያስተጋብኡ
  english_pob_choice: they will draw the whole earth to themselves
  chosen_korean: 그 후에는 온 땅을 자기들에게로 모아
  alternatives_korean:
  - 그 후에는 온 땅을 자기들에게로 끌어모아
  - 그 후에는 온 땅을 자기들 쪽으로 모아
  lexicon: extra-canonical/Jubilees
  rationale: 개정된 영어 감사본의 ‘draw ... to themselves’를 반영해, 단순히 ‘모으다’보다 자기들에게로 끌어당겨 결집시키는 뉘앙스를 살렸습니다.
- source_word: ወይወርስዋ
  english_pob_choice: and inherit it
  chosen_korean: 그것을 상속할 것입니다
  alternatives_korean:
  - 그것을 차지할 것입니다
  - 그것을 유업으로 받을 것입니다
  lexicon: extra-canonical/Jubilees
  rationale: 상속/유업의 법적·언약적 의미를 보존하기 위해 ‘상속하다’를 택했습니다. 한국어에서 더 자연스러운 표현은 ‘유업으로 받다’이지만, 문맥의 소유 이전을 직접적으로 드러내기 위해 본문에는 ‘상속할 것입니다’를 두었습니다.
theological_decisions:
- issue: 민족들 위를 다스림의 통치성
  chosen_reading: ‘모든 민족들 위를 다스릴’로 옮겨, 단순한 공존이 아니라 우위적 지배를 드러냈습니다.
  alternative_readings:
  - 모든 민족들 가운데서 다스릴
  - 모든 민족들 사이에서 다스릴
  rationale: 개정된 영어 감사본이 ‘among’에서 ‘over’로 수정한 이유를 따르며, 원문과 문맥상 통치 우위를 완화하지 않기 위함입니다.
  doctrine_reference: 언약적 통치와 종말론적 지배의 표현
