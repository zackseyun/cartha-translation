  source_fidelity: 게에즈의 ‘사람의 자손들’, ‘하늘 아래의 온 땅’, 모든 민족에 대한 통치, 그리고 온 땅을 자신들에게로 모아 유업으로 받는다는 흐름은 대체로 충실히 반영되었습니다. 다만 ‘인자들’은 여기서 일반 인류를 가리키는 표현에 부적절한 신학적·성경 관용적 연상을 일으키며, ያስተጋብኡ의 재귀적 방향은 더 자연스러운 한국어로 명료하게 드러낼 수 있습니다.
  naturalness: ‘인자들의 모든 자손에게’와 ‘모든 민족들 위를 다스리다’는 현대 표준 한국어에서 어색합니다. ‘모든 사람의 자손에게’, ‘모든 민족을 … 다스리다’가 자연스럽고 원문의 통치 관계도 유지합니다. 토지의 상속에는 ‘유업으로 받다’가 현대 성서 문체와 자연스러운 결합을 이룹니다.
