  to: 누구든지 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐 죽임을 당할 것입니다. 이 법에는 기간 제한이 없고, 면제도 어떤 속죄도 없습니다. 다만 자기 딸을 온 이스라엘 가운데서 더럽힌 그 사람은 뿌리째 뽑힐 것입니다.[a] 이는 그가 자기 씨 가운데서 몰렉에게 바쳤고, 그것을 더럽혀 악을 행했기 때문입니다.[b]
