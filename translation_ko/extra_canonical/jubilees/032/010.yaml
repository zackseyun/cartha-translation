base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/010.yaml
  text: Whoever defiles shall surely die, and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man be rooted out who has defiled his daughter in the midst of all Israel, because from his seed he has given to Molech and has acted wickedly by defiling it.
  footnotes:
  - marker: a
    text: Or 'except that they root out the man'.
    reason: previous_rendering
  - marker: b
    text: Or 'by defiling her'.
    reason: previous_rendering
translation:
  language: ko
  text: 누구든지 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐 죽임을 당할 것입니다. 이 법에는 기간 제한이 없고, 면제도 어떤 속죄도 없습니다. 다만 자기 딸을 온 이스라엘 가운데서 더럽힌 그 사람은 뿌리째 뽑힐 것입니다.[a] 이는 그가 자기 씨 가운데서 몰렉에게 바쳤고, 그것을 더럽혀 악을 행했기 때문입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들이 자기 딸을 온 이스라엘 가운데서 더럽힌 그 사람을 뿌리째 뽑아 낼 것입니다.’
    reason: 원문 동사의 해석에 따라 수동형 대신 능동 복수형으로 이해할 수 있는 대안 독법을 제시합니다.
  - marker: b
    text: 또는 ‘그녀를 더럽혀.’
    reason: 마지막 접미사의 지시 대상을 앞선 ‘딸’로 이해하는 대안 독법을 제시합니다. 본문은 원문의 남성 단수 형태에 따라 지시 대상을 확정하지 않는 ‘그것’을 유지합니다.
lexical_decisions:
- source_word: ዘያረኵስ
  english_pob_choice: Whoever defiles
  chosen_korean: 더럽히는 자
  alternatives_korean:
  - 더럽히는 사람
  - 부정을 행하는 자
  lexicon: Ge'ez 동사 어근의 일반적 성적/의례적 오염 의미
  rationale: 원문의 행위 초점을 살려 ‘더럽히는 자’로 옮겼고, 문맥상 단순 오염이 아니라 율법적 더러움을 가리킵니다.
- source_word: ወበእብን፡ ይትወገር
  english_pob_choice: and he shall be stoned with stones
  chosen_korean: 돌로 돌을 던져 쳐죽여야 합니다
  alternatives_korean:
  - 돌로 쳐서 죽여야 합니다
  - 돌로 돌을 던질 것입니다
  lexicon: Ge'ez 수동형과 처형 수단 표현
  rationale: 처형 방식이 분명하므로 단순한 ‘돌로 치다’보다 반복적 수단을 드러내는 ‘돌로 돌을 던져’로 옮겼습니다.
- source_word: ወአልቦ፡ ለዝ፡ ሕግ፡ ዐቅመ፡ መዋዕለ፡ ወአልቦ፡ ኅድገተ፡ ወኵሎ፡ ስርየተ፡
  english_pob_choice: there is no limit of days for this law, and no remission or any atonement
  chosen_korean: 이 율법에는 기간의 제한이 없고, 면제도 어떤 속죄도 없습니다
  alternatives_korean:
  - 이 율법에는 기한이 없고, 사면도 어떤 속죄도 없습니다
  - 이 법에는 기간의 한계가 없고, 용서도 속죄도 없습니다
  lexicon: ‘기간의 제한’, ‘면제’, ‘속죄’
  rationale: ‘없다’의 이중 부정을 자연스럽게 살리면서도, POB의 ‘remission / atonement’ 구분을 한국어로 분리해 유지했습니다.
- source_word: ብእሲ፡ ዘአርኰሰ
  english_pob_choice: the man who has defiled
  chosen_korean: 더럽힌 그 사람
  alternatives_korean:
  - 더럽힌 그 남자
  - 더럽힌 사람
  lexicon: Ge'ez 명사 ብእሲ의 인격적 남성 지시
  rationale: 문맥상 법정적 책임 주체를 가리키므로, 성중립적 ‘사람’보다 문장 내 인용 지시를 살려 ‘그 사람’으로 옮겼습니다.
- source_word: በአርኵሶ
  english_pob_choice: by defiling her/it
  chosen_korean: 더럽혀
  alternatives_korean:
  - 더럽혀서
  - 더럽히므로
  lexicon: Ge'ez 접미 목적격/지시 대상의 불명확성
  rationale: 영문 개정에서는 ‘her’로 다듬었지만, 원문형과 주석 전통상 지시 대상이 단정되지 않으므로 한국어도 의미를 열어 둔 ‘더럽혀’로 처리했습니다.
theological_decisions:
- issue: 속죄 가능성의 완전 부정
  chosen_reading: ‘면제도 어떤 속죄도 없습니다’로 옮겨, 이 죄에 대한 율법적 구제 불가를 강하게 유지했습니다.
  alternative_readings:
  - ‘면제도 속죄도 없습니다’
  - ‘사면도 속죄도 없습니다’
  rationale: 원문은 이 행위에 대해 기간 제한 없는 처벌과 함께 예외 없는 면제/속죄 부정을 병렬로 말하므로, 완화하지 않고 직설적으로 유지해야 합니다.
  doctrine_reference: 율법-형벌 문맥의 절대성; 레위기 20:2-5 계열의 심판 구조
