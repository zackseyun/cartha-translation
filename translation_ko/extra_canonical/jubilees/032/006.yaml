base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/006.yaml
  text: from the prayer that he had prayed, that he should tithe together with their sacrifices and their drink offerings. And when the fire had consumed it, he burned frankincense upon it in the fire, and for the sacrifice of deliverance he offered two oxen and four rams and four sheep and four he-goats and four yearling sheep.
  footnotes:
  - marker: a
    text: Or 'And when the fire had consumed the burnt offering, he offered for the sacrifice of deliverance'.
    reason: previous_rendering
  - marker: b
    text: Or 'five he-goats and four yearling sheep'.
    reason: previous_rendering
  - marker: c
    text: Or 'his sacrifices and his drink offerings'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 기도한 것에서, 그들의 희생제물과 그들의 전제물과 함께 십일조를 바치도록 하셨습니다. 그리고 불이 그것을 삼키자, 그는 그 위에 불 가운데서 유향을 피웠으며, 화목제물로는 수소 두 마리와 숫양 넷과 양 넷과 숫염소 넷과 한 살 된 양 넷을 드렸습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መበአ፡ እምጸሎት፡ እንተ፡ ጸለየ፡
  english_pob_choice: from the prayer that he had prayed
  chosen_korean: 그가 기도한 것에서
  alternatives_korean:
  - 그가 드린 기도에서
  - 그가 기도한 기도에서
  lexicon: source_note
  rationale: 게에즈 원문은 기도 행위의 결과물/내용을 가리키며, 문맥상 ‘기도한 것에서’가 가장 직접적으로 원문 구조를 반영합니다.
- source_word: መሥዋዕተሙ፡ ወጥዓሕቶሙ
  english_pob_choice: their sacrifices and their drink offerings
  chosen_korean: 그들의 희생제물과 그들의 전제물
  alternatives_korean:
  - 그들의 제물과 그들의 전제물
  - 그들의 희생제물과 그들의 술붓는 제물
  lexicon: source_note
  rationale: 복수 소유격이 분명하므로 ‘그들의’로 살렸고, ὅ/희생제물·전제물의 대응을 위해 ‘희생제물’과 ‘전제물’을 유지했습니다.
- source_word: የዐጥን፡ ስኂነ፡ ዴቤሁ፡ በእሳት፡
  english_pob_choice: he burned frankincense upon it in the fire
  chosen_korean: 그 위에 불 가운데서 유향을 피웠으며
  alternatives_korean:
  - 그 위에 불 속에서 유향을 태웠으며
  - 그 위에 불에 유향을 피웠으며
  lexicon: source_note
  rationale: 원문은 제물 위에 불과 관련하여 향을 태우는 동작을 말하므로, 제의적 의미를 살려 ‘유향을 피우다’로 옮겼습니다.
- source_word: መሥዋዕተ፡ መድኃኒት፡
  english_pob_choice: the sacrifice of deliverance
  chosen_korean: 화목제물
  alternatives_korean:
  - 구원의 제물
  - 구출의 제사
  lexicon: source_note
  rationale: 영어 POB의 ‘deliverance’는 이 문맥에서 구원/해방의 제의적 제물을 가리키지만, 한국어에서는 제사 용례상 ‘화목제물’이 가장 자연스럽고 소리값도 안정적입니다.
- source_word: ወአባግዐ፡ አርባዕተ፡ ፭ ወአባግዐ፡ ዘዘ፡ ዓመት፡
  english_pob_choice: four he-goats and four yearling sheep
  chosen_korean: 숫염소 넷과 한 살 된 양 넷
  alternatives_korean:
  - 숫염소 넷과 어린 양 넷
  - 숫염소 넷과 일 년 된 양 넷
  lexicon: source_note
  rationale: 게에즈 본문이 숫염소 넷과 연령이 표시된 양 넷을 말하므로, 번역은 수량과 나이 표현을 그대로 반영했습니다. 수량 표지 ፭는 본문 숫자가 아니라 주석 표지이므로 본문 번역에 포함하지 않았습니다.
theological_decisions:
- issue: 제의적 표현 'deliverance'의 한국어 대응
  chosen_reading: 화목제물
  alternative_readings:
  - 구원의 제물
  - 해방제물
  rationale: 이 단락은 번제와 전제, 그리고 향을 태우는 제의 행위를 나열하므로, 한국어 독자에게 제의적 기능이 즉시 드러나는 전통적 제물 용어를 택했습니다. 다만 ‘화목제물’은 의미를 좁히는 면이 있어, source_note에서 원문 의미를 함께 밝혔습니다.
  doctrine_reference: 제의어 번역 원칙
- issue: 유향을 태우는 동작의 제의적 해석
  chosen_reading: 그 위에 불 가운데서 유향을 피웠으며
  alternative_readings:
  - 그 위에 불 가운데서 향을 사르며
  - 그 위에 불 속에서 유향을 태웠으며
  rationale: 원문은 단순한 연소가 아니라 제사 위에서 향을 드리는 장면을 나타내므로, 제의적 경건 행위를 살리는 ‘피우다’를 사용했습니다.
  doctrine_reference: 제사 서술의 문맥 보존
