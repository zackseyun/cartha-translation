base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/017.yaml
  text: 'every man and woman in Israel who defiles his sanctuary. Because of this I have commanded you, saying, "Bear this testimony over Israel: see what happened to Shechem and to his sons, how they were given into the hand of the two sons of Jacob, and they killed them in agony, and it was reckoned to them as righteousness, and it was written down for them as righteousness."'
  footnotes:
  - marker: a
    text: Or 'with the sword'.
    reason: previous_rendering
  - marker: b
    text: Or 'Make this report heard'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스라엘 가운데 자기 성소를 더럽히는 모든 남자와 여자입니다. 그러므로 내가 너에게 명령하여 말한다. 「이스라엘에게 이 증언을 들려주십시오. 세겜과 그의 아들들에게 무슨 일이 일어났는지 보십시오. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들이 그들을 고통 중에 죽였으며, 그것이 그들에게 의로 여겨졌고, 그것이 그들을 위하여 의로 기록되었습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አስምዕ፡ ዛተ፡ ስምዐ
  english_pob_choice: Make this report heard
  chosen_korean: 이 증언을 알리십시오
  alternatives_korean:
  - 이 보고를 들리십시오
  - 이 증언을 선포하십시오
  - 이 증언을 들려주십시오
  lexicon: ስምዐ = 증언 / 증거
  rationale: Geez의 ‘증언/증거’ 뉘앙스를 살려 법정적·언약적 무게를 유지하면서, 한국어에서는 자연스러운 명령형으로 ‘알리십시오’를 택했습니다.
- source_word: በእዴ፡ ክልኤሆሙ
  english_pob_choice: into the hand of the two sons of Jacob
  chosen_korean: 야곱의 두 아들의 손에
  alternatives_korean:
  - 야곱의 두 아들의 손아귀에
  - 야곱의 두 아들에게
  - 야곱의 두 아들의 권한 아래
  lexicon: hand = 손
  rationale: 히브리식 관용구를 그대로 반영해 ‘손에’로 옮겼고, 주도권이 넘어간 상황을 드러냅니다.
- source_word: ወቀተልዎሙ
  english_pob_choice: they killed them in agony
  chosen_korean: 그들이 그들을 극심한 고통 가운데서 죽였으며
  alternatives_korean:
  - 그들이 그들을 고통 중에 죽였으며
  - 그들이 그들을 괴로운 상태에서 죽였으며
  - 그들이 그들을 칼로 죽였으며
  lexicon: قتل/kill
  rationale: 최근 개정의 ‘with the sword’는 본문 근거가 약하므로, Geez의 고통/통증 의미를 따라 사건의 상황을 살린 표현으로 옮겼습니다.
- source_word: ወኮነቶሙ፡ ጽድቀ፡ ወተጽሕፎሙ፡ ለጽድቅ
  english_pob_choice: it was reckoned to them as righteousness, and it was written down for them as righteousness
  chosen_korean: 그것이 그들에게 의로 여겨졌고, 그것이 그들을 위해 의로 기록되었습니다
  alternatives_korean:
  - 그것이 그들에게 의로 계산되었고, 그것이 그들을 위해 의로 적혔습니다
  - 그것이 그들에게 의로 인정되었고, 그것이 그들을 위해 의로 기록되었습니다
  lexicon: צדק = 의
  rationale: ‘reckoned’와 ‘written down’의 두 동사를 구분하면서, 반복되는 ‘의’ 표현을 유지해 본문의 강조를 살렸습니다.
theological_decisions:
- issue: 『증언』을 알리라는 명령의 성격
  chosen_reading: 개인적 정보 전달이 아니라 이스라엘 공동체를 향한 공적 증언 선포로 이해해 ‘알리십시오’와 ‘증언’을 함께 살렸습니다.
  alternative_readings:
  - 이 보고를 전하십시오
  - 이 사실을 들려주십시오
  rationale: 문맥상 법정적·공동체적 경고가 포함되어 있어, 단순 보고보다 증언의 성격을 유지하는 편이 소스에 더 충실합니다.
  doctrine_reference: 언약적 경고와 공적 증언의 문맥
- issue: 세겜 사건의 평가가 의로 ‘여겨짐/기록됨’
  chosen_reading: 폭력 행위 자체를 옹호하지 않고, 본문이 말하는 서사 내부의 평가 문구를 그대로 유지했습니다.
  alternative_readings:
  - 그것이 그들에게 의로 계산되었고
  - 그것이 그들을 위해 의로 인정되었습니다
  rationale: 원문은 사건의 윤리적 판단을 직접 해설하기보다, 기록된 판정을 전달하므로 그 긴장을 완화하지 않았습니다.
  doctrine_reference: 서사 내 신적 판정 표현
