base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/016.yaml
  text: The LORD will put it in their mouths, that they may bless all the seed of the beloved. Your mother called you Levi, and in truth she called you so that you would be joined to God and be a companion to all the sons of Jacob. Let his table be yours, and you and your sons shall eat, and for all.
  footnotes:
  - marker: a
    text: Or 'For he has called you from among them, like Levi, and in truth he has called you'.
    reason: previous_rendering
  - marker: b
    text: Or 'to draw near to the LORD, that you may be his, and that all the sons of Jacob may eat at your table'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 그들의 입에 그것을 넣으셔서, 사랑받는 이의 모든 씨를 축복하게 하실 것입니다. 당신의 어머니가 당신을 레위라 불렀고, 참으로 그녀가 당신을 그렇게 불렀으니—당신이 하나님께 속하게 되고, 야곱의 모든 아들들의 동반자가 되게 하려는 것입니다. 그의 식탁이 당신의 것이 되게 하십시오. 당신과 당신의 아들들이 먹을 것이며, 그리고 모든 사람을 위해서도 그러합니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አብሔር / יהוה
  english_pob_choice: The LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  - 주
  lexicon: YHWH
  rationale: 영문 POB의 ‘The LORD’를 한국어 합쇼체에서 직접 경배 대상 호칭으로 옮기되, 문맥상 하나님 호칭이 자연스러운 ‘주님’으로 처리했습니다.
- source_word: ይትወሀብ ... ውስተ አፉሆሙ
  english_pob_choice: will put it in their mouths
  chosen_korean: 그들의 입에 그것을 넣으셔서
  alternatives_korean:
  - 그들의 입에 그것을 두셔서
  - 그들의 입에 그것을 주셔서
  lexicon: WLC/semantic equivalent for idiomatic causation
  rationale: 입에 넣는다는 직접적인 행위를 살려, 예언적 주권 행위라는 소스를 과도하게 완화하지 않도록 했습니다.
- source_word: ዘርአ ለፍቅር
  english_pob_choice: the seed of the beloved
  chosen_korean: 사랑받는 이의 모든 씨
  alternatives_korean:
  - 사랑하는 자의 씨
  - 사랑받는 자의 씨
  lexicon: seed/offspring
  rationale: ‘seed’의 후손 의미를 살리면서, ‘beloved’를 수동형으로 반영해 ‘사랑받는 이’로 옮겼습니다. ‘모든’은 원문과 영문 모두에 맞춰 보존했습니다.
- source_word: እምከ
  english_pob_choice: your mother
  chosen_korean: 당신의 어머니
  alternatives_korean:
  - 네 어머니
  - 어머니
  lexicon: kinship term
  rationale: 레위의 이름 짓는 장면을 가리키므로, ‘from among them’이 아니라 어머니의 명명 행위로 바로 드러나게 했습니다.
- source_word: ጸውዑት ... ከመከ ... አጸቁ
  english_pob_choice: she called you so that you would be joined to God
  chosen_korean: 그녀가 당신을 그렇게 불렀으니—당신이 하나님께 속하게 되고
  alternatives_korean:
  - 당신이 하나님과 연합하게 되고
  - 당신이 하나님께 가까이 나아가게 되고
  lexicon: name etymology / relation to God
  rationale: 영문 POB의 해석적 요지를 따르되, 레위의 이름과 연결된 ‘연합/속함’의 의미를 한국어로 자연스럽게 표현했습니다.
- source_word: ወሱታፌ
  english_pob_choice: be a companion to all the sons of Jacob
  chosen_korean: 야곱의 모든 아들들의 동반자가 되게 하려는 것입니다
  alternatives_korean:
  - 야곱의 모든 아들들과 함께하는 이가 되게 하려는 것입니다
  - 야곱의 모든 아들들과의 동료가 되게 하려는 것입니다
  lexicon: companionship
  rationale: 동반/동료의 관계성을 살리되, 예배적·공동체적 연대를 드러내는 ‘동반자’를 선택했습니다.
- source_word: ማእዳ ለከ ትኩን
  english_pob_choice: Let his table be yours
  chosen_korean: 그의 식탁이 당신의 것이 되게 하십시오
  alternatives_korean:
  - 그의 상이 당신의 것이 되게 하십시오
  - 그의 식탁을 당신에게 주십시오
  lexicon: table/meal table
  rationale: 식탁은 단순한 가구가 아니라 식사와 교제의 상징이므로, 한국어에서도 그 상징을 유지했습니다.
theological_decisions:
- issue: 레위에 대한 명명과 소명 표현
  chosen_reading: 본문은 레위의 이름 짓기와 그 이름의 의미를 연결하여, 하나님께 속함과 공동체적 동반자 됨을 말합니다.
  alternative_readings:
  - 레위가 단순히 어떤 집단에서 불려 나온 것으로 읽는 해석
  - ‘하나님께 가까이 나아감’만 강조하는 해석
  rationale: 게에즈 본문과 최신 교정 기록에 따라, 본문은 출애굽적 소명이 아니라 레위 이름의 기원과 그 신학적 의미를 설명합니다.
  doctrine_reference: 창세기 29:34; 레위 지파 기원 전승
