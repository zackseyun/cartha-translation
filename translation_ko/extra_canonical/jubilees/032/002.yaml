base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/002.yaml
  text: And Jacob rose early in the morning on the fourteenth of this month, and he gave a tenth of everything that had come with him, from people to cattle, from gold to all possessions; and he brought it and gave a tenth of everything.
  footnotes:
  - marker: a
    text: Or 'and he took'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께. 야곱은 이 달 열나흗날 이른 아침에 일어나, 그와 함께 온 모든 것, 곧 사람부터 가축까지, 금부터 모든 재산까지에서 십분의 일을 드렸습니다. 그리고 그것을 가져와, 모든 것에서 십분의 일을 드렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጌሰ፡ ... በነግህ
  english_pob_choice: rose early in the morning
  chosen_korean: 아침 일찍 일어나서
  alternatives_korean:
  - 이른 아침에 일어나서
  - 아침에 일찍 일어나서
  lexicon: 게즈 서술 표현
  rationale: 동작의 즉시성과 이른 시각을 자연스럽게 살리되, 한국어 문장 흐름을 해치지 않도록 간결하게 옮겼습니다.
- source_word: ዐሡሩ፡ ወረቡዑ፡ ለዝ፡ ወርኅ፡
  english_pob_choice: on the fourteenth of this month
  chosen_korean: 이 달의 열나흗날
  alternatives_korean:
  - 이 달의 열넷째 날
  - 이 달의 십사일
  lexicon: 서수/날짜 표현
  rationale: 게즈의 날짜 표지를 한국어 관용에 맞게 ‘열나흗날’로 옮겨, 달력 날짜를 분명하게 전달했습니다.
- source_word: ወዐሠረ፡ እምኵሉ፡
  english_pob_choice: he gave a tenth of everything
  chosen_korean: 모든 것 중에서 ... 십분의 일을 드렸습니다
  alternatives_korean:
  - 모든 것에서 ... 십일조를 드렸습니다
  - 모든 것의 십분의 일을 바쳤습니다
  lexicon: 십분의 일 / 십일조
  rationale: 본문과 POB가 단순히 ‘가난한 자의 헌금’이 아니라 전체 재산의 10분의 1을 가리키므로, 본문 의미를 직접 드러내는 ‘십분의 일’을 사용했습니다.
- source_word: ወአብአ
  english_pob_choice: he brought it
  chosen_korean: 그것을 가져다
  alternatives_korean:
  - 그것을 가져왔고
  - 그것을 들여놓고
  lexicon: 동사 선택
  rationale: 게즈 동사는 ‘가져오다/들여오다/바치다’의 방향성을 가지므로, 앞선 십분의 일 계산을 이어 주는 중립적이고도 구체적인 ‘가져다’로 옮겼습니다.
theological_decisions:
- issue: 본문의 반복된 십분의 일 진술을 어떻게 처리할 것인가
  chosen_reading: 첫째 문장은 야곱이 함께 온 모든 것에서 십분의 일을 드린 행위를 진술하고, 둘째 문장은 그 행위를 다시 요약해 강조하는 반복으로 옮겼습니다.
  alternative_readings:
  - 둘째 문장을 생략하거나 하나의 문장으로 합쳐 단순화한다
  - 둘째 문장을 ‘그리고 그는 그것을 가져다 모든 것의 십분의 일을 드렸다’로 직역한다
  rationale: 게즈 본문은 ‘그리고’로 이어지는 반복을 통해 행위의 완결성과 강조를 나타내므로, 한국어에서도 중복을 유지해 서술상의 강조를 보존했습니다.
  doctrine_reference: 문학적 반복 보존 원칙
- issue: '''가져다''와 ''드렸습니다''의 결합을 어떻게 이해할 것인가'
  chosen_reading: ‘가져다’는 헌납 대상의 이동을, ‘드렸습니다’는 헌납 행위의 결과를 나타내는 것으로 처리했습니다.
  alternative_readings:
  - ‘가져다’ 대신 단순히 ‘드렸습니다’만 사용한다
  - ‘가져다 바쳤습니다’로 합쳐 번역한다
  rationale: source_review에서 지적된 동사 ወአብአ의 방향성을 살리면서도, 한국어에서는 헌납의 종결 의미를 ‘드렸습니다’로 분명히 해 본문의 흐름을 유지했습니다.
  doctrine_reference: 게즈 동사 의미 보존
