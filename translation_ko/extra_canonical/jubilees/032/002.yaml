revisions:
- from: 야곱은 이 달의 열나흗날 아침 일찍 일어나서, 자기와 함께 온 모든 것 중에서 사람에게서부터 가축에 이르기까지, 금에서부터 모든 재산에 이르기까지 십분의 일을 드렸습니다. 그리고 그는 그것을 가져다 모든 것의 십분의 일을 드렸습니다.[a]
  to: 하나님께. 야곱은 이 달 열나흗날 이른 아침에 일어나, 그와 함께 온 모든 것, 곧 사람부터 가축까지, 금부터 모든 재산까지에서 십분의 일을 드렸습니다. 그리고 그것을 가져와, 모든 것에서 십분의 일을 드렸습니다.
  rationale: 원문에 명시된 ‘하나님께’를 보존하고, ወአብአ의 ‘가져오다’ 의미를 ‘그것을 가져와’로 유지했습니다. 원문의 반복적 십분의 일 진술을 삭제하거나 조화시키지 않았으며, 한국어의 병렬 표현과 문장 경계를 다듬었습니다. 기존 영어 각주 a는 이전의 ‘took’ 독법에 관한 것이며, 현재 본문과 한국어 번역에는 적용되지 않으므로 포함하지 않았습니다.
  reviewer_model: gpt-5.6-terra
