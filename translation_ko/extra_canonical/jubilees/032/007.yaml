  alternative_readings:
  - 의역하여 문장을 완결시키기
  - 후속 절을 추정해 보완하기
  rationale: 원문과 POB 영어가 모두 절단된 상태이므로, 미완성 자체를 드러내는 것이 사본학적 현실을 더 충실히 반영합니다.
  doctrine_reference: textual criticism / source fidelity
