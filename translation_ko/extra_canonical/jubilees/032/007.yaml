base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/007.yaml
  text: 'Therefore thus it is ordained in Israel concerning the defilement of an Israelite virgin: and if there is a man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed disgrace in Israel; and the woman'
  footnotes:
  - marker: a
    text: Or 'concerning a virgin daughter of Israel who has been defiled'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이스라엘 안에서 이스라엘 사람인 처녀를 더럽히는 일에 관하여 이렇게 정해졌습니다. 이스라엘 안에 자기 딸이나 심지어 자기 누이까지도 민족들의 씨에서 난 어떤 남자에게 주고자 하는 사람이 있으면, 그는 반드시 죽임을 당해야 하며, 그들이 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 안에서 수치스러운 일을 저질렀기 때문입니다. 그리고 그 여인은[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “더럽혀진 이스라엘 사람인 처녀에 관하여.”
    reason: 영어 POB 감사 기록의 대안 번역을 보존합니다. 본문의 ‘더럽히는 일’은 원문의 명사형을 한국어에서 자연스럽게 살린 번역입니다.
lexical_decisions:
- source_word: በአርኵሰ፡ ድንግል፡ እስራኤላዊት
  english_pob_choice: concerning the defilement of an Israelite virgin
  chosen_korean: 이스라엘 처녀의 더러움에 관하여
  alternatives_korean:
  - 이스라엘 처녀가 더러워진 일에 관하여
  - 이스라엘의 처녀의 부정에 관하여
  lexicon: 더러움
  rationale: Ge'ez의 명사형 표현을 살려 ‘더러움’으로 옮기고, ድንግል과 እስራኤላዊት은 각각 ‘처녀’, ‘이스라엘’로 간결하게 반영했습니다.
- source_word: ወለተ፡ ወእመኒ፡ እኅተ፡
  english_pob_choice: his daughter, or even his sister
  chosen_korean: 자기 딸이나 심지어 자기 누이까지도
  alternatives_korean:
  - 자기 딸이나 자기 누이
  - 자기 딸은 물론 자기 누이까지도
  lexicon: 누이
  rationale: 원문의 병렬과 강조(‘심지어’)를 살리되, 한국어에서 자연스럽게 읽히도록 ‘누이’로 옮겼습니다.
- source_word: ዘእምዘርአ፡ አሕዛብ
  english_pob_choice: from the seed of the nations
  chosen_korean: 민족들의 씨에서 난
  alternatives_korean:
  - 민족들의 씨에서
  - 이방 민족의 씨에서 난
  lexicon: 씨
  rationale: ‘씨’(seed)를 직역하되 한국어에서 의미가 통하도록 ‘난’을 보태어 혈통적 출신을 드러냈습니다.
- source_word: ይውግሮዎ፡ እስመ፡ ገብረ፡ ኀፍረተ፡
  english_pob_choice: they shall stone him with stones, because he has committed disgrace
  chosen_korean: 그들이 돌들로 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 안에서 수치를 행했기 때문입니다.
  alternatives_korean:
  - 그들이 돌로 그를 쳐야 합니다. 이는 그가 이스라엘 안에서 수치를 저질렀기 때문입니다.
  - 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 안에서 수치를 행했기 때문입니다.
  lexicon: 수치
  rationale: ‘돌들로… 돌로 쳐야 합니다’는 형벌의 구체성을 살린 것이고, ኀፍረተ는 도덕적 비난의 결과를 ‘수치’로 옮겼습니다.
