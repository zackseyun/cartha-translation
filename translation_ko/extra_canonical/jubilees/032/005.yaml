base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/005.yaml
  text: from the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the fourth week, in the seventh year, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban pursued after him and overtook Jacob at the mountain of Gilead in the third month, in the thirteenth year. But the LORD did not allow him to harm Jacob, for he appeared to him in a dream at night and Laban told Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent at the mountain,
  footnotes:
  - marker: a
    text: Or 'departed from Gilead on the first day of the month, in the tenth year; and they told Laban, and he'.
    reason: previous_rendering
  - marker: b
    text: Or 'and spoke to Laban concerning Jacob'.
    reason: previous_rendering
translation:
  language: ko
  text: 길르앗 땅에서. 야곱은 라반에게 자신의 마음을 숨기고 알리지 않았습니다. 그리고 넷째 주, 일곱째 해에 야곱은 첫째 달 스물하루에 길르앗 쪽으로 돌아갔고, 라반이 그를 뒤쫓아 길르앗 산에서 따라잡았으니, 곧 셋째 달 열셋째 해였습니다. 그러나 주께서는 그가 야곱에게 해를 끼치도록 허락하지 않으셨습니다. 그 밤에 꿈으로 그에게 나타나셨기 때문이며, 라반이 야곱에 관하여 그에게 말했습니다. 그리고 그날들 가운데 열다섯째 날에 야곱은 라반과 그와 함께 온 모든 사람을 위해 잔치를 베풀었고, 야곱은 그날 라반에게 맹세했고 라반도 야곱에게 맹세하여, 그 산에서 서로를 향해 악한 뜻으로 건너지 않겠다고 했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ፡ ገለአድ፡
  english_pob_choice: from the land of Gilead
  chosen_korean: 길르앗 땅에서
  alternatives_korean:
  - 길르앗에서
  - 길르앗 땅으로부터
  lexicon: 지명
  rationale: 문맥상 출발점/배경을 나타내는 표현으로, 한국어에서는 간결하게 ‘길르앗 땅에서’가 가장 자연스럽습니다.
- source_word: ወኀብአ፡ ያዕቆብ፡ ልቦ፡ ላባን፡
  english_pob_choice: Jacob concealed his heart from Laban
  chosen_korean: 야곱은 라반에게 자신의 마음을 숨기고
  alternatives_korean:
  - 야곱은 라반에게 마음을 감추고
  - 야곱은 라반에게 의도를 숨기고
  lexicon: 심장/마음 표현
  rationale: 게에즈의 ‘마음/심장’을 직역하되, 한국어에서는 의도와 내면을 함께 담는 ‘자신의 마음을 숨기다’가 가장 근접합니다.
- source_word: ወበሳብዕ፡ ዓም፡ ... በቅዳሜ፡ ወርኅ፡ አመ፡ ዐሥራሁ
  english_pob_choice: in the fourth week, in the seventh year ... in the first month, on the twenty-first
  chosen_korean: 넷째 주, 일곱째 해에 ... 첫째 달 스물하루에
  alternatives_korean:
  - 넷째 주, 일곱째 해에 ... 첫째 달 스물한째 날에
  - 넷째 주, 일곱째 해에 ... 첫째 달 이십일일에
  lexicon: 달력/서수 표현
  rationale: 본문의 절대적 연대 표지를 그대로 살리면서, 한국어 표준 표기인 ‘스물하루’로 자연스럽게 옮겼습니다.
- source_word: እግዚአብሔር፡
  english_pob_choice: the LORD
  chosen_korean: 주께서는
  alternatives_korean:
  - 주님은
  - 야훼께서는
  lexicon: 신명 칭호
  rationale: 이 본문은 야훼를 가리키는 주어로 쓰였으나, 주석 없는 본문에서는 예배적 문맥을 해치지 않도록 ‘주께서는’으로 옮겼습니다.
- source_word: ወነገሮ፡ ላባ፡ ለያዕቆብ፡
  english_pob_choice: and Laban told Jacob
  chosen_korean: 라반이 야곱에 관하여 그에게 말했습니다
  alternatives_korean:
  - 라반이 야곱에게 말했습니다
  - 라반이 야곱에게 그 사실을 말했습니다
  lexicon: 동사 구문
  rationale: 게에즈는 ‘라반이 야곱에게 말하다’의 구조이지만, 직전 문맥의 ‘꿈으로 나타나셨다’와 결합될 때 대상이 야곱에 관한 내용임을 드러내어 한국어에서는 뜻을 명료하게 했습니다.
theological_decisions:
- issue: 야훼를 가리키는 እግዚአብሔር의 표기
  chosen_reading: 본문에서는 ‘주께서는’으로 두고, 주석 없이 야훼 음역을 본문에 직접 넣지 않았습니다.
  alternative_readings:
  - 야훼께서는
  - 주님께서는
  rationale: 이 문서는 외경/희년서의 서술 본문이므로, 합쇼체의 자연스러움과 독자 가독성을 우선해 ‘주께서는’으로 처리했습니다. 다만 이는 신명 지칭을 완화한 번역이 아니라 한국어 본문 관습에 따른 표기 선택입니다.
  doctrine_reference: 신명 호칭의 번역 관례
- issue: ‘그 산에서 서로를 향해 악한 뜻으로 건너지 않겠다’의 맹세
  chosen_reading: 서로를 향해 악한 뜻으로 건너지 않겠다고 했습니다
  alternative_readings:
  - 서로에게 해를 끼치지 않겠다고 했습니다
  - 악한 뜻으로 서로를 넘지 않겠다고 했습니다
  rationale: 본문의 핵심은 상호 불가침 맹세입니다. ‘건너지 않다’는 동사 이미지를 살리되, 한국어에서는 목적을 분명히 하도록 ‘악한 뜻으로’와 결합했습니다.
  doctrine_reference: 서약/평화 보존의 서술
