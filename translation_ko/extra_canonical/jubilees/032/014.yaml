base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/014.yaml
  text: and so are your children through all the ages. And may the LORD give to you and to your seed greatness of heart for his glory; and may he bring you and your seed near to him from all flesh, so that they may minister in his sanctuary like the angels of the presence and like the holy ones. Like them shall the seed of your children be for glory and greatness.
  footnotes:
  - marker: a
    text: Or 'so that you may minister'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희 자손도 모든 시대에 그러할 것입니다. 야훼께서 너와 네 씨에게 그의 영광을 위하여 마음의 위대함을 주시고, 또 너와 네 씨를 모든 육체 가운데서 그에게 가까이 이끄셔서 그들이 그의 성소에서 임무를 수행하게 하시기를 바랍니다 — 만군의 얼굴 천사들과 거룩한 이들처럼 말입니다. 그들과 같이 너희 자손의 씨도 영광과 위대함을 얻게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወውሉደከ
  english_pob_choice: and so are your children through all the ages
  chosen_korean: 너희 자손도 모든 시대에 그러할 것입니다
  alternatives_korean:
  - 그리고 너희 자녀들도 모든 세대에 그러할 것입니다
  - 그래서 네 자손은 대대로 그러할 것입니다
  lexicon: source note
  rationale: Geʽez의 복수 표현을 살려 단순한 2인칭 단수보다 ‘너희 자손’으로 옮기고, ‘through all the ages’를 ‘모든 시대에’로 자연스럽게 풀었습니다.
- source_word: ወየሀብከ ... ዐበየ፡ ልበየ
  english_pob_choice: may the LORD give to you and to your seed greatness of heart
  chosen_korean: 야훼께서 너와 네 씨에게 그의 영광을 위하여 마음의 위대함을 주시고
  alternatives_korean:
  - 주님께서 너와 네 씨에게 마음의 위대함을 주시고
  - 야훼께서 너와 네 자손에게 큰 마음을 주시고
  lexicon: source note
  rationale: ‘마음의 위대함’은 직역에 가까우나 원문의 큰마음/고결한 마음의 뉘앙스를 보존하며, 목적구 ‘for his glory’를 분리해 뜻을 드러냈습니다.
- source_word: ይትአዘዙ ውስተ መቅደሱ
  english_pob_choice: so that they may minister in his sanctuary
  chosen_korean: 그들이 그의 성소에서 임무를 수행하게 하시기를 바랍니다
  alternatives_korean:
  - 그들이 그의 성소에서 섬기게 하시기를 바랍니다
  - 그들이 그의 성소에서 봉사하게 하시기를 바랍니다
  lexicon: source note
  rationale: 주어가 3인칭 복수임을 반영해 ‘그들이’로 옮겼고, 성소에서의 봉사를 한국어로는 비교적 중립적인 ‘임무를 수행하다’로 처리해 원문의 기능적 의미를 살렸습니다.
- source_word: መላእክተ፡ ገጽ፡ ወከመ፡ ቅዱሳን
  english_pob_choice: like the angels of the presence and like the holy ones
  chosen_korean: 만군의 얼굴 천사들과 거룩한 이들처럼
  alternatives_korean:
  - 임재의 천사들과 거룩한 이들처럼
  - 얼굴 앞의 천사들과 성도들처럼
  lexicon: source note
  rationale: 영문 POB의 ‘angels of the presence’를 Geʽez의 직역적 의미에 가깝게 ‘얼굴 천사들’로 두어, 후기 전통 용어를 임의로 대체하지 않았습니다.
theological_decisions:
- issue: YHWH의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값에 따라 하나님의 고유명은 학술적 음역인 ‘야훼’를 사용해 원문 고유성을 드러냈습니다.
  doctrine_reference: project glossary / source-grounded naming
- issue: ‘for his glory’와 성소 봉사의 목적
  chosen_reading: 그의 영광을 위하여 ... 그들이 그의 성소에서 임무를 수행하게 하시기를 바랍니다
  alternative_readings:
  - 그의 영광을 위해 ... 그들이 그의 성소에서 섬기게 하시기를 바랍니다
  rationale: 문장 내부의 목적 구조를 분리해, 자손의 위대함과 성소 봉사가 모두 하나님의 영광을 향한 목적 아래 있음을 분명히 했습니다.
  doctrine_reference: source syntax and literary context
