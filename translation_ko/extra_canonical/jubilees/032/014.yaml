  terminology: 야훼, 성소, 임재의 천사들, 거룩한 이들은 원문 및 영어 POB의 용어와 잘 대응합니다. 성소에서의 행위는 일반적 ‘임무 수행’보다 예배·성소 문맥을 보존하는 ‘섬기다’가 적절합니다.
