revisions:
- from: 그리고 너희 자손도 모든 시대에 그러할 것입니다. 야훼께서 너와 네 씨에게 그의 영광을 위하여 마음의 위대함을 주시고, 또 너와 네 씨를 모든 육체 가운데서 그에게 가까이 이끄셔서 그들이 그의 성소에서 임무를 수행하게 하시기를 바랍니다 — 만군의 얼굴 천사들과 거룩한 이들처럼 말입니다. 그들과 같이 너희 자손의 씨도 영광과 위대함을 얻게 될 것입니다.[a]
  to: 그리하여 네 자녀도 모든 시대에 그러할 것입니다. 야훼께서 너와 네 자손에게 그의 영광을 위하여 큰마음을 주시기를, 또 너와 네 자손을 모든 사람 가운데서 그에게 가까이 이끄셔서 그들이 그의 성소에서 임재의 천사들과 거룩한 이들처럼 섬기게 하시기를 바랍니다. 그들처럼 네 자녀의 자손도 영광과 위대함을 얻게 될 것입니다.
  rationale: 원문의 축원 형식, 3인칭 복수 봉사 주어, ‘임재의 천사들’이라는 표현, 그리고 마지막의 ‘자녀의 자손’을 보존했습니다. ‘모든 육체’는 한국어에서 사람들을 가리키는 문맥상 ‘모든 사람 가운데서’로 자연스럽게 옮겼습니다. 영어 POB의 이전 대안에만 근거한 각주는 한국어 본문에 필요한 텍스트 비평적 또는 의미상 불확실성을 제공하지 않으므로 두지 않았습니다.
