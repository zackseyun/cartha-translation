    issue: ‘사람’은 원문의 남성 명사에 비해 성별 정보를 약화합니다.
    rationale: 이 문맥의 혼인 상대를 가리키는 원문 ብእሲ는 ‘남자’로 옮기는 편이 더 직접적입니다.
