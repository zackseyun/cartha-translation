base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/013.yaml
  text: Let us not give our daughter to a man who has a foreskin, for that is a reproach to us. And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.
translation:
  language: ko
  text: 우리 딸을 할례받지 않은 남자에게 주지 맙시다. 그것은 우리에게 수치입니다. 또한 그것은 이스라엘에게도 수치이며, 이방 민족의 딸들에게 딸을 내주는 사람들과 그들에게서 아내를 맞아들이는 사람들에게도 수치입니다. 이는 부정한 일이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘부정한’은 위생상의 더러움이라기보다, 본문이 사용하는 의례적·언약적 정결 범주의 표현입니다.
    reason: 본문의 ርኩስ(‘부정한, 깨끗하지 않은’)가 지닌 종교적·의례적 의미를 명확히 하면서도 번역 본문의 의미를 변경하지 않습니다.
lexical_decisions:
- source_word: ብእሲ ዘቦ፡ ቍልፈተ
  english_pob_choice: a man who has a foreskin
  chosen_korean: 할례받지 않은 사람
  alternatives_korean:
  - 무할례자
  - 포피가 있는 사람
  - 포피를 가진 사람
  lexicon: halley / foreskin
  rationale: 문맥상 핵심은 할례 여부이므로 직역적 해부학 표현보다 의미를 바로 드러내는 ‘할례받지 않은 사람’을 택하되, 원문의 수치를 유지했습니다.
- source_word: ጽእለት
  english_pob_choice: reproach
  chosen_korean: 수치
  alternatives_korean:
  - 모욕
  - 비난
  - 치욕
  lexicon: reproach
  rationale: 가문과 이스라엘 공동체에 돌아오는 공개적 불명예를 가리키므로, 단순 비난보다 공동체적 shame을 나타내는 ‘수치’가 더 적절합니다.
- source_word: እምአዋልደ፡ አሕዛብ
  english_pob_choice: the daughters of the nations
  chosen_korean: 이방의 딸들
  alternatives_korean:
  - 열국의 딸들
  - 민족들의 딸들
  lexicon: nations/daughters
  rationale: ‘아와르드(딸들)’를 유지하되 한국어 자연성을 위해 ‘이방의 딸들’로 옮겨, 이방 출신 여성들과의 혼인을 지시하는 대목임을 분명히 했습니다.
- source_word: ርኩስ
  english_pob_choice: unclean
  chosen_korean: 부정하다
  alternatives_korean:
  - 더럽다
  - 깨끗하지 않다
  - 불결하다
  lexicon: unclean
  rationale: 의례적·언약적 부정 상태를 가리키므로 단순 위생적 의미의 ‘불결하다’보다 종교적 범주를 드러내는 ‘부정하다’가 더 가깝습니다.
theological_decisions:
- issue: 혼인 금지의 근거를 어떻게 드러낼 것인가
  chosen_reading: 할례 여부와 부정 개념을 함께 살려, 이 본문이 언약 표지의 경계와 정결 언어를 사용해 이스라엘의 혼인 정체성을 규정하는 것으로 번역했습니다.
  alternative_readings:
  - 문화적 차별 선언으로 약화해 번역
  - 단순한 민족적 배타로만 번역
  rationale: 원문은 단순한 민족 감정이 아니라 할례/부정의 언약-의례적 틀로 논지를 세우므로, 그 긴장을 보존해야 합니다.
  doctrine_reference: 언약 표지와 정결/부정의 성경적 어휘
