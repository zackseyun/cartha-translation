  english_pob_choice: from the cattle fourteen oxen and twenty-eight rams, and forty-nine sheep and seven lambs and twenty-one kids
  chosen_korean: 수소 열네 마리와 숫양 스물여덟 마리, 양 마흔아홉 마리와 어린양 일곱 마리, 염소 새끼 스물한 마리
  alternatives_korean:
