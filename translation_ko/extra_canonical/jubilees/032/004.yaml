  lexicon: 직역 관용구
  rationale: 게에즈의 관용 표현을 그대로 살려, 제사장 위임/취임을 암시하는 본문 의미를 유지했습니다. ‘위임받다’로 풀지 않고 원문 이미지도 보존했습니다.
- source_word: ወአብአ፡ ውስተ፡ ምሥዋዕ፡
