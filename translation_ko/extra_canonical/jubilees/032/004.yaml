  - 소 떼 가운데서 수소 열네 마리와 숫양 스물여덟 마리, 양 마흔아홉 마리와 어린양 일곱 마리, 염소 새끼 스물한 마리
  lexicon: 가축 제물 목록
  rationale: 영어 POB의 수량과 동물 명칭을 그대로 반영하되, ‘from the cattle’는 목록이 제물의 출처 범주임을 드러내는 방식으로 처리했습니다. ‘수소’는 bulls에 가장 직접적입니다.
theological_decisions:
- issue: 제사장 행위의 표현 방식
  chosen_reading: ‘손을 채웠습니다’와 ‘제단으로 가져왔습니다’로 옮겨, 제사장 위임과 제의 행위를 해설 없이 드러냈습니다.
  alternative_readings:
  - ‘제사장 직분을 수행했습니다’
  - ‘제단에 바쳤습니다’
  rationale: 본문은 제사장 복식 착용과 제의 준비 및 제물 이동을 연속적으로 제시합니다. 관용구를 설명으로 풀면 원문의 제의적 긴장과 의례적 이미지를 약화시킬 수 있습니다.
  doctrine_reference: 제사장 직무/위임의 서술적 표현
