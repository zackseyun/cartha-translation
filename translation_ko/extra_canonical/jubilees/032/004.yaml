- from: 그는 제사장의 옷을 입고 손을 채웠습니다. 그리고 이 달의 열다섯째 날에 그는 수소 열네 마리와 숫양 스물여덟 마리, 양 마흔아홉 마리와 어린양 일곱 마리, 염소 새끼 스물한 마리를 제단으로 가져왔습니다.[a]
  to: 그는 그에게 제사장 옷을 입히고 그의 손을 채웠습니다. 그리고 이 달 열다섯째 날에 그는 가축 가운데서 수소 열네 마리와 숫양 스물여덟 마리, 양 마흔아홉 마리와 어린양 일곱 마리와 염소 새끼 스물한 마리를 제단으로 가져왔습니다.
