  - severity: medium
    issue: ‘가축 가운데서’라는 출처·범주 표현이 누락됨
    rationale: እምአልህምት 및 영어 감사본의 ‘from the cattle’에 해당하는 표현을 번역문에도 반영해야 합니다.
