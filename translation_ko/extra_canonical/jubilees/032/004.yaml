translation:
  language: ko
  text: 그는 제사장의 옷을 입고 손을 채웠습니다. 그리고 이 달의 열다섯째 날에 그는 수소 열네 마리와 숫양 스물여덟 마리, 양 마흔아홉 마리와 어린양 일곱 마리, 염소 새끼 스물한 마리를 제단으로 가져왔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ክህነት፡
  english_pob_choice: He put on priestly garments
  chosen_korean: 제사장의 옷을 입고
  alternatives_korean:
