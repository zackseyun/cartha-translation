  source_fidelity: 게에즈 አልባሰ는 ‘입었다’라기보다 ‘입혔다’로 읽는 것이 자연스럽습니다. 앞 절의 레위 제사장 임명 문맥에서도 야곱이 레위에게 제사장 옷을 입히고 그의 손을 채우는 행위가 적절합니다. 또한 እምአልህምት(‘가축 가운데서/가축에서’)가 번역문에서 빠져 있었습니다.
  naturalness: ‘그에게 제사장 옷을 입히고 그의 손을 채웠습니다’는 원문의 의례적 관용구를 해설로 바꾸지 않으면서도 현대 한국어 합쇼체로 자연스럽습니다. 수량 목록 앞에 ‘가축 가운데서’를 두어 출처·범주 표현을 보존했습니다.
  terminology: ‘제사장 옷’, ‘손을 채우다’, ‘제단’은 제의 문맥과 원문의 표현을 충실히 반영합니다. ‘제단으로 가져왔습니다’는 바치다라는 해석적 동사를 보태지 않아 적절합니다.
  issues:
