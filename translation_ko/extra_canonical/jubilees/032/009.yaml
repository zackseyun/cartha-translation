revisions:
- from: 이것은 이와 같은 기쁨의 증언입니다. 그리고 이전에는 길르앗 땅을 르바임의 땅이라고 불렀는데, 그것은 르바임의 땅이기 때문입니다. 그곳에서 르바임이 태어났는데, 키가 열 규빗, 아홉 규빗, 여덟 규빗, 그리고 일곱 규빗에 이르는 거인들이었습니다.[a][b]
  to: 이것은 이와 같은 기쁨에 관한 증언입니다. 이전에는 길르앗 땅을 르바임의 땅이라고 불렀습니다. 그곳이 르바임의 땅이었기 때문입니다. 그곳에서 르바임이 태어났으며, 그들은 키가 열 규빗, 아홉 규빗, 여덟 규빗, 그리고 일곱 규빗에 이르는 거인들이었습니다.
  rationale: 서두를 ‘이와 같은 기쁨에 관한 증언’으로 다듬어 ‘기쁨’의 반복과 비교 관계를 자연스럽게 보존했습니다. 또한 르바임이 태어난 뒤 그들을 거인으로 설명하는 원문의 관계를 명료하게 했습니다. 본문이 확정적으로 제시하는 네 수치를 모두 유지했습니다. 제공된 영어 각주는 현행 본문에 실질적인 대안 독법이나 번역상 필요한 정보를 더하지 않으며, 특히 b는 본문 수열을 반복할 뿐이므로 유지하지 않았습니다.
