  yaml_path: translation/extra_canonical/jubilees/032/009.yaml
  text: This is a testimony of joy like this joy. And formerly they used to call the land of Gilead the land of the Rephaim, because it is the land of the Rephaim; and Rephaim were born there, giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits.
  footnotes:
  - marker: a
    text: Or 'according to this testimony'.
    reason: previous_rendering
  - marker: b
    text: Or 'nine cubits, and eight cubits, and down to seven cubits'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 이와 같은 기쁨에 관한 증언입니다. 이전에는 길르앗 땅을 르바임의 땅이라고 불렀습니다. 그곳이 르바임의 땅이었기 때문입니다. 그곳에서 르바임이 태어났으며, 그들은 키가 열 규빗, 아홉 규빗, 여덟 규빗, 그리고 일곱 규빗에 이르는 거인들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዕ
  english_pob_choice: This is a testimony of joy
  chosen_korean: 이것은 이와 같은 기쁨의 증언입니다
  alternatives_korean:
  - 이것은 기쁨의 증언입니다
  - 이것은 이와 같은 기쁨의 증거입니다
  lexicon: ፍሥሐ / ስምዕ
  rationale: 앞의 ፍሥሐ는 '기쁨', ስምዕ은 '증언/증거'의 뜻이므로 둘을 분리해 살리고, English POB의 반복 구조를 따라 '이와 같은'으로 비교를 나타냈습니다.
- source_word: ምድረ፡ ገለአድ / ምድረ፡ ራፋኤል
  english_pob_choice: the land of Gilead / the land of the Rephaim
  chosen_korean: 길르앗 땅 / 르바임의 땅
  alternatives_korean:
  - 길르앗 땅 / 레파임의 땅
  - 길르앗 지역 / 거인들의 땅
  lexicon: 고유지명
  rationale: 지명은 통용되는 성경 음역을 따르되, ራፋኤም은 POB의 'Rephaim'에 맞춰 르바임으로 옮겨 반복 대구를 보존했습니다.
- source_word: ረዐይት
  english_pob_choice: giants
  chosen_korean: 거인들
  alternatives_korean:
  - 키 큰 자들
  - 장대한 자들
  lexicon: 장대한 체격을 가진 존재를 가리키는 일반 명사
  rationale: 문맥상 단순한 큰 사람보다 신체적 비범성을 강조하는 표현이므로 '거인들'로 옮겨, 이어지는 규빗 수치와 연결되게 했습니다.
- source_word: ፱ሥር፡ ... ወእስከ፡ ስብዕ
  english_pob_choice: ten cubits, and nine cubits, and eight cubits, and down to seven cubits
  chosen_korean: 열 규빗, 아홉 규빗, 여덟 규빗, 그리고 일곱 규빗
  alternatives_korean:
  - 아홉 규빗, 여덟 규빗, 그리고 일곱 규빗
  - 열 규빗에서 일곱 규빗까지
  lexicon: 규빗 수열
  rationale: Ge'ez 본문과 최신 검토에 따라 열-아홉-여덟-일곱의 네 단계 수치를 모두 살렸고, '그리고 …까지'로 하강 범위를 드러냈습니다.
theological_decisions:
- issue: '''증언''과 ''기쁨''의 결합'
  chosen_reading: 이 구절은 법규라기보다 기쁨에 관한 증언으로 읽고, 서두의 반복어를 '기쁨의 증언'으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 증거로서의 기쁨
  - 기쁨에 관한 규례
  rationale: 개정 전 영어의 ordinance/forever 해석을 따르지 않고, Ge'ez의 ፍሥሐተ와 ስምዕ의 반복을 따라 의미 충돌을 피했습니다.
  doctrine_reference: source-language priority; lexical semantics
