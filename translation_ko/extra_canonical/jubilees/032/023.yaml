theological_decisions:
- issue: ‘의’가 주어지는 방식
  chosen_reading: 야곱의 행위가 하나님 앞에서 ‘의로 여겨졌습니다’라고 옮겨, 행위가 구원의 공로가 아니라 판정/인정의 언어임을 유지했습니다.
  alternative_readings:
  - ‘의로 계산되었습니다’로 더 법정적 표현을 쓰는 방식
  - ‘의로 인정받았습니다’로 완화하는 방식
  rationale: 본문은 결과를 선언하지만, 전통적 공로 언어로 오해되지 않도록 수동 판정을 보존하면서도 한국어의 자연성을 살렸습니다.
  doctrine_reference: 의의 귀속/선언
- issue: 리브가에게 주는 명령의 화자
  chosen_reading: ‘그리고 그는 리브가에게…’로 이삭을 화자로 분명히 하여, 잘못된 화자 전이를 막았습니다.
  alternative_readings:
  - 리브가가 스스로 말한 것으로 읽는 방식
  - 생략된 주어로 모호하게 두는 방식
  rationale: 게으른 대명사 해소가 서술 의미를 바꾸므로, 문맥상 화자를 명시해 사건의 논리와 가족 관계를 정확히 드러냈습니다.
  doctrine_reference: 서사 문맥 정확성
