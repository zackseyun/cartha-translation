translation:
  language: ko
  text: 기쁨으로. 야곱은 자기 두 아들을[23] 오른편 하나와 왼편 하나로 세웠고, 그것이 그에게 의로 여겨졌습니다. 그리고 야곱은 밤에 아버지에게, 주님께서 자기에게 큰 긍휼로 어떻게 대해 주셨는지, 또 자기의 모든 길을 어떻게 형통하게 하시고 모든 악에서 어떻게 보호하셨는지를 모두 말했습니다. 이삭은 그의 아버지 아브라함의 하나님을 축복하며, 자신의 종 이삭의 아들에게서 긍휼과 의를 거두지 않으신 분을 찬송했습니다. 그리고 아침에 야곱은 아버지 이삭에게, 주님께 드렸던 기도와 자신이 본 환상, 또 어떻게 제단을 쌓았는지, 그리고 기도한 대로 주님 앞에 드리려고 준비한 제물과 어떻게 나귀를 타고 그를 데리러 왔는지를 말했습니다. 이삭이 야곱에게 말했습니다. 「내 아들아, 나는 네와 함께 갈 수가 없다. 나는 늙어서 길을 견딜 수가 없다. 내 아들아, 평안히 가라. 나는 오늘로 백육십오 세가 되었구나. 나는 더 이상 여행할 수 없으니, 네 어머니를 짐승에 태워 너와 함께 가게 하여라. 그리고 내 아들아, 네가 나를 위해 왔음을 나는 안다. 오늘은 네가 나를 살아 있는 모습으로 보았고, 나도 너를 보았으니 복된 날이다. 형통하여 네가 드린 기도를 실행하고, 네 기도를 지체하지 말아라. 그것은 간구받고 있기 때문이다. 이제 서둘러 행하라. 그리고 모든 것을 행하시는 분께서 네가 기도한 그 기도에 형통함을 주시기를 바란다.」 그리고 그는 리브가에게 「네 아들 야곱과 함께 가라」고 말했습니다. 리브가는 자기 아들 야곱과 함께 갔고, 드보라도 그와 함께 있었으며, 그들은 베델에 이르렀습니다. 야곱은 아버지가 자기에게 복 주었던 그 기도와 자기 두 아들, 레위와 유다를 기억하고 기뻐하며 자기 조상들인 아브라함과 이삭의 하나님을 찬송했습니다. 그리고 그는 말했습니다. 「이제 나는 내게 영원한 소망이 있고, 내 자녀에게도 소망이 있다는 것을, 모든 이의 하나님 앞에서 알게 되었습니다.」 이처럼 두 아들에 관하여 그것이 규정되었고, 이삭이 그들에게 복 준 것처럼 하늘의 판에
    영원한 증언으로 그들을 위해 일으켜질 것입니다. 그리고 그는 그날 밤 베델에 머물렀고, 레위는 지극히 높으신 하나님의 제사장으로, 곧 자신과 그의 자손이 영원히 그렇게 세워지고 임명되는 꿈을 꾸었습니다. 그는 잠에서 깨어 주님을 찬송했습니다. 야곱은 이달 십사일 아침 일찍 일어나 자신과 함께 온 모든 것에서—사람에서 가축까지, 금에서 모든 소유까지—십일조를 드렸고, 모든 것에서 십일조를 떼어 바쳤습니다. 그 무렵 라헬은 베냐민을 잉태했고, 야곱은 자기 아들들을 헤아렸으며, 레위가 주님의 몫 가운데 올라왔습니다. 그의 아버지는 그에게 제사장의 옷을 입히고 그의 손을 채웠습니다. 그리고 이달 십오일에 그는 소 떼에서 수소 열네 마리와 숫양 열여덟 마리와 어린 양 마흔아홉 마리와 새끼 양 일곱 마리와 숫염소 스물한 마리를 제단에 번제물로 드렸습니다.[23]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በፍሥሐ
  english_pob_choice: in joy
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 기뻐하며
  - 즐거움으로
  lexicon: source phrasing
  rationale: 문두의 부사구로서 상태를 자연스럽게 살리되, 과도하게 해석하지 않고 ‘기쁨’의 정서를 간결하게 반영했습니다.
- source_word: ወተብቈ፡ ሎቱ፡ ጽድቀ
  english_pob_choice: and it was counted to him as righteousness
  chosen_korean: 그것이 그에게 의로 여겨졌습니다
  alternatives_korean:
  - 그것이 그에게 의로 계산되었습니다
  - 그것이 그에게 의로 간주되었습니다
  lexicon: δικαιοσύνη
  rationale: 회계적 느낌의 ‘계산’도 가능하지만, 한국어에서 성경적 문맥의 수용성이 높은 ‘의로 여겨지다’를 택하되 원문의 수동적 판정을 보존했습니다.
- source_word: ይጽዐኖ
  english_pob_choice: to carry him on a donkey
  chosen_korean: 나귀를 타고 그를 데리러 왔는지
  alternatives_korean:
  - 나귀에 그를 태우러 왔는지
  - 나귀를 타고 그를 데려오게 되었는지
  lexicon: source verb
  rationale: 기존 오역 가능성을 피하고, 목적어 ‘그를’이 누구인지 분명히 하면서 야곱이 이삭을 데리러 왔다는 의미를 반영했습니다.
- source_word: ጻዕና፡ ለአምካ፡ ወትሖር፡ ምስሌከ
  english_pob_choice: set your mother on a beast and let her go with you
