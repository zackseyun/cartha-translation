base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/032/020.yaml
  text: And through you the salvation of Israel will be found. And on the day you sit on the throne of the glory of your righteousness, there will be great peace for all the seed of the sons of the beloved. Whoever blesses you shall be blessed, and all who hate you and afflict you, and also those who curse you, shall be destroyed and cut off.
  footnotes:
  - marker: a
    text: Or 'And in that day you will dwell on the throne of the glory of your righteousness. There will be great peace'.
    reason: previous_rendering
  - marker: b
    text: Or 'his beloved sons'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너를 통해 이스라엘의 구원이 발견될 것입니다. 그리고 그날에는 너는 네 의의 영광의 보좌에 거할 것입니다. 그의 사랑받는 아들들의 모든 씨에게는 큰 평강이 있을 것입니다. 너를 복 주는 사람은 복을 받을 것이며, 너를 미워하고 너를 괴롭히는 모든 사람, 그리고 너를 저주하는 사람들은 모두 멸망하여 끊어질 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትረከብ መድኃኒተ እስራኤል
  english_pob_choice: the salvation of Israel will be found
  chosen_korean: 이스라엘의 구원이 발견될 것입니다
  alternatives_korean:
  - 이스라엘의 구원이 찾아질 것입니다
  - 이스라엘이 구원을 얻게 될 것입니다
  lexicon: ትትረከብ / found
  rationale: Ge'ez의 수동적 ‘found’에 맞춰 ‘발견될 것입니다’로 옮겨, ‘주어가 얻게 된다’는 해석으로 완만하게 바꾸지 않고 구원의 현현·발견성을 살렸습니다.
- source_word: መንበረ ክብር ጽድቅከ
  english_pob_choice: the throne of the glory of your righteousness
  chosen_korean: 네 의의 영광의 보좌
  alternatives_korean:
  - 네 의의 영광의 왕좌
  - 네 의의 영예의 보좌
  lexicon: መንበር / throne, ክብር / glory, ጽድቅ / righteousness
  rationale: ‘영광’과 ‘의’를 둘 다 보존해 원문의 중첩된 소유 구조를 반영했습니다. ‘보좌’는 왕권적 자리를 드러내는 표준 표현입니다.
- source_word: ዐቢየ ሰላም
  english_pob_choice: great peace
  chosen_korean: 큰 평강
  alternatives_korean:
  - 큰 평화
  - 지극한 평강
  lexicon: ሰላም / peace
  rationale: PB0의 ‘great peace’를 자연스러운 합쇼체로 옮기되, 프로젝트 기본어휘에 따라 ‘평강’을 유지했습니다.
- source_word: ዘርአ ውሉዱ ለፍቅር
  english_pob_choice: all the seed of the sons of the beloved / the sons of the beloved
  chosen_korean: 사랑받는 아들들의 모든 씨
  alternatives_korean:
  - 사랑하는 이의 아들들의 모든 씨
  - 사랑받는 이의 자손 모두
  lexicon: ዘር / seed, ውሉድ / sons, ፍቅር / beloved
  rationale: 검토 기록의 문법 판단을 따라 ‘the sons of the beloved’ 구조를 보존했습니다. ‘씨’는 직계 후손/자손을 가리키는 원문 대비를 살리기 위해 유지했습니다.
- source_word: ዘይባርከከ ቡሩክ
  english_pob_choice: Whoever blesses you shall be blessed
  chosen_korean: 너를 복 주는 사람은 복을 받을 것이며
  alternatives_korean:
  - 너를 축복하는 사람은 복을 받을 것이며
  - 너를 복 주는 자는 복을 받을 것이며
  lexicon: ברך 계열 / bless
  rationale: ‘복 주다’는 한국어 성서어법에 가깝고, ‘복을 받을 것이다’의 상응 구조를 그대로 살려 상호적 축복 선언을 분명히 했습니다.
- source_word: ይሠረዉ ወይትሐጐሉ
  english_pob_choice: shall be destroyed and cut off
  chosen_korean: 멸망하여 끊어질 것입니다
  alternatives_korean:
  - 파멸되고 끊어질 것입니다
  - 멸절되어 잘려 나갈 것입니다
  lexicon: to be destroyed / to be cut off
  rationale: 두 동사의 연속을 하나의 한국어 연결로 묶되, 심판의 강도를 약화하지 않기 위해 ‘멸망’과 ‘끊어짐’을 함께 보존했습니다.
theological_decisions:
- issue: ‘그날’의 시간절 처리
  chosen_reading: ‘그리고 그날에는 너는 … 거할 것입니다’로, 원문의 시간절을 독립된 미래 서술로 번역했습니다.
  alternative_readings:
  - ‘그리고 그날 너는 … 앉을 것입니다’
  - ‘그날에 너는 … 위에 거하실 것입니다’
  rationale: 검토 기록이 지적한 대로 원문은 ‘그날에’가 좌정/거주와 평강 선포를 연결합니다. 한국어에서도 이를 분리하지 않고 시간적 종속성을 살렸습니다.
  doctrine_reference: source-syntax fidelity
- issue: ‘사랑받는 아들들’의 소유구조
  chosen_reading: ‘사랑받는 아들들의 모든 씨’로 번역해 ‘beloved’를 형용사보다 명사적 표지로 보이게 했습니다.
  alternative_readings:
  - ‘그의 사랑받는 아들들’
  - ‘사랑하는 아들들’
  rationale: 주석 및 개정 기록에 따라 ‘the sons of the beloved’라는 문법 구조를 보존했습니다. 이를 ‘그의 사랑받는 아들들’로 풀면 원문의 실질 명사성(‘the beloved’)이 흐려집니다.
  doctrine_reference: source-grammar fidelity
