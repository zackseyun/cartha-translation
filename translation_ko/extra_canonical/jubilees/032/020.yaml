revisions:
- from: 그리고 너를 통해 이스라엘의 구원이 발견될 것입니다. 그리고 그날에는 너는 네 의의 영광의 보좌에 거할 것입니다. 그의 사랑받는 아들들의 모든 씨에게는 큰 평강이 있을 것입니다. 너를 복 주는 사람은 복을 받을 것이며, 너를 미워하고 너를 괴롭히는 모든 사람, 그리고 너를 저주하는 사람들은 모두 멸망하여 끊어질 것입니다.[a][b]
  to: 그리고 너를 통해 이스라엘의 구원이 발견될 것입니다. 네 의의 영광의 보좌에 앉는 날에는[a] 사랑받는 이의 아들들의 모든 자손에게[b] 큰 평강이 있을 것입니다. 너를 축복하는 사람은 복을 받을 것이며, 너를 미워하고 괴롭히는 모든 사람과 또 너를 저주하는 사람들은 멸망하고 끊어질 것입니다.
  rationale: 시간절을 평강의 선언과 한 문장으로 연결하여 원문의 구문을 회복했습니다. ‘사랑받는 이’를 실질 명사로 유지하고 ‘모든 씨’는 현대 한국어에서 명확한 ‘모든 자손’으로 옮겼습니다. 축복 동사는 자연스러운 현대 한국어인 ‘축복하다’를 사용하되, ‘복을 받을 것이다’라는 상응 구조는 보존했습니다. 각주 표지도 각각의 해당 표현 뒤로 옮겼습니다.
