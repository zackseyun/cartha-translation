  source_fidelity: 첫 문장의 수동 표현과 축복·저주 선언은 대체로 원문에 충실합니다. 그러나 ወአመ፡ ዕለት 이하의 시간절은 보좌에 앉는 때와 큰 평강을 직접 연결하므로, 초안처럼 독립 미래문으로 분리하지 않는 편이 원문 구문에 더 충실합니다. 또한 ለፍቅር는 ‘사랑받는 이’라는 명사적 표현으로 보존하는 것이 안전합니다.
  naturalness: ‘그리고 그날에는 너는’은 현대 한국어에서 부자연스럽고, ‘사랑받는 아들들의 모든 씨’도 의미 관계가 불명확합니다. 시간절을 ‘…앉는 날에는’으로 처리하고 ‘…아들들의 모든 자손’으로 옮기면 자연스럽고 명료합니다.
