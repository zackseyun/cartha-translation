  language: ko
  text: 그러므로 이 악한 벌은 벌 위에 벌로, 상처 위에 상처로, 고통 위에 고통으로, 악한 소식 위에 악한 소식으로, 병 위에 병으로, 그리고 이런 것들과 같은 모든 악으로 — 질병과 붕괴와 우박과 눈과 열병과 오한과 혼미와 기근과 죽음과 칼과 포로 됨과 모든 재앙과 병으로 — 이어집니다.[a]
  philosophy: optimal-equivalence
