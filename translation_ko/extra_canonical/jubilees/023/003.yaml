  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
  footnotes:
  - marker: a
    text: Or 'Abraham had grown cold;'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 잠에서 깨어났습니다. 보니 아브라함은 얼음처럼 차가워졌고, 그가 말했습니다. “아버지, 아버지!” 그러나 말하는 이는 아무도 없었고, 그는 그가 죽었다는 것을 알았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነቅሀ፡ ... እምንዋሙ
  english_pob_choice: awoke from his sleep
  chosen_korean: “잠에서 깨어났습니다”
  alternatives_korean:
  - “잠에서 일어났습니다”
  - “잠에서 깼습니다”
  lexicon: 깨어나다
  rationale: 원문은 수면 상태에서의 각성을 직접 말하므로, 자연스러운 현대문체로 ‘잠에서 깨어났습니다’라고 옮겼습니다.
- source_word: ከመ፡ ባረድ፡
  english_pob_choice: had grown cold as ice
  chosen_korean: “얼음처럼 차가워졌고”
  alternatives_korean:
  - “차갑게 식었고”
  - “얼음같이 차가워졌고”
  lexicon: 차갑다
  rationale: Ge'ez의 비교구문은 단순히 ‘차가워졌다’보다 강한 비유를 담으므로, 영어 POB의 보정에 맞춰 ‘얼음처럼 차가워졌고’로 반영했습니다.
- source_word: ወይቤ፡ *አባ፡ አባ፡
  english_pob_choice: and he said, “Father, father!”
  chosen_korean: “아버지, 아버지!”
  alternatives_korean:
  - “아빠, 아빠!”
  - “아버님, 아버님!”
  lexicon: 아버지
  rationale: 원문의 직접호칭은 친밀한 부름이지만, 한국어 성경 문체에서는 지나치게 구어적인 ‘아빠’보다 ‘아버지’가 더 적절합니다.
- source_word: ወአእመረ፡ ከመ፡ ሞተ
  english_pob_choice: he knew that he had died
  chosen_korean: “그는 그가 죽었다는 것을 알았습니다”
  alternatives_korean:
  - “그가 죽었음을 알았습니다”
  - “그가 죽었다는 사실을 알았습니다”
  lexicon: 알다
  rationale: 원문의 인지 동사는 결과를 파악했다는 의미이므로, 문어적이면서도 직설적인 ‘알았습니다’로 유지했습니다.
theological_decisions:
- issue: 죽음의 인식과 서술 시점
  chosen_reading: 야곱이 아브라함의 죽음을 직접 확인하고 그 사실을 인지한 장면으로 읽었습니다.
  alternative_readings:
  - 단순한 기절 상태를 오인한 장면
  - 꿈/환시 안에서의 상징적 죽음
  rationale: 본문은 ‘말하는 이가 없었다’와 ‘죽었다는 것을 알았다’가 연속되어 있어, 실제 죽음의 확인을 서술하는 쪽이 원문 흐름에 가장 충실합니다.
  doctrine_reference: 서사 문맥의 표면 의미 우선
