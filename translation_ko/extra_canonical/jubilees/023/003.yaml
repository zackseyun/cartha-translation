  source_fidelity: 핵심 사건 순서와 ‘얼음/우박처럼’이라는 비교 표현은 대체로 충실합니다. 다만 원문의 발화자는 야곱인데, 현행 한국어의 ‘그가 말했습니다’는 바로 앞의 아브라함을 자연스러운 선행사로 삼게 되어 발화자가 아브라함인 것처럼 읽힐 수 있습니다. 발화자와 죽음을 인지한 인물을 각각 야곱으로 명시하는 것이 필요합니다.
  naturalness: ‘잠에서 깨어나 보니’, ‘아무도 말을 하지 않았고’, ‘아브라함이 죽었다는 것을 알았습니다’가 현행 문장보다 자연스럽고 선행사가 분명한 현대 한국어 합쇼체입니다.
  terminology: ‘아브라함’, ‘야곱’, ‘아버지’는 적절합니다. ከመ፡ ባረድ፡의 비교 표현은 ‘얼음처럼’으로 유지해야 합니다. 영어 감사 이력의 대안 독법에 대응하는 각주는 비교구에 직접 붙이고, 원문 표현을 생략한 번역 대안을 제한적으로 밝혀야 합니다.
