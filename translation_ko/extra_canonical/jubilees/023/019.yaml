base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: ko
  text: 보십시오, 그들의 모든 행위 때문에 땅이 멸망할 것이며, 씨앗도 포도주도 기름도 없을 것입니다. 그들의 모든 행위가 배반적이기 때문입니다. 그리고 들짐승과 집짐승과 새와 바다의 모든 물고기가 사람의 아들들 때문에 모두 함께 멸망할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድር
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 지면
  - 세상
  lexicon: Ge'ez ምድር
  rationale: 창조세계 전체를 가리키는 문맥이지만, 한국어에서는 멸망의 대상인 물질적 토대를 자연스럽게 드러내는 ‘땅’이 가장 직접적입니다.
- source_word: ትትሐጐል
  english_pob_choice: will be destroyed
  chosen_korean: 멸망할 것입니다
  alternatives_korean:
  - 파괴될 것입니다
  - 무너질 것입니다
  - 멸망할 것입니다
  lexicon: Ge'ez ትትሐጐል
  rationale: 단순한 손상보다 종말적 파멸을 뜻하는 강한 결과를 살리기 위해 ‘멸망하다’를 택했습니다.
- source_word: ዘርእ፡ ወይን፡ / ቅብዐ፡
  english_pob_choice: no grain, no wine, and no oil
  chosen_korean: 곡식도 포도주도 기름도
  alternatives_korean:
  - 곡식도 포도주도 기름도
  - 포도나무의 씨도 기름도
  - 곡식도 포도즙도 기름도
  lexicon: Ge'ez agricultural list
  rationale: 본문의 농산물 목록을 한국어 성경 관용에 맞추되, 수정본의 의도를 반영해 ‘grain, wine, oil’의 세 항목을 분명히 살렸습니다.
- source_word: ካሕደ፡ ምግባሪሆሙ
  english_pob_choice: faithless
  chosen_korean: 신실하지 않기
  alternatives_korean:
  - 믿음이 없기
  - 불충하기
  - 신실하지 않기
  lexicon: Ge'ez ካሕደ
  rationale: EN POB의 ‘faithless’를 단순한 도덕적 악행보다 언약적 불충실로 읽어, ‘신실하지 않다’로 옮겼습니다.
- source_word: ኵሉሙ፡ ይትሐጐሉ
  english_pob_choice: they will all perish together
  chosen_korean: 함께 모두 멸망할 것입니다
  alternatives_korean:
  - 함께 다 죽을 것입니다
  - 모두 함께 사라질 것입니다
  - 함께 모두 멸망할 것입니다
  lexicon: Ge'ez collective verb phrase
  rationale: 동물들의 집단적 소멸을 분명히 하면서도, 문맥상 종말론적 판결을 드러내는 ‘멸망’이 가장 적절합니다.
theological_decisions:
- issue: ‘because of the sons of men’의 범위
  chosen_reading: 인간의 죄가 피조세계 전반의 붕괴를 불러온다는 인과를 그대로 유지했습니다.
  alternative_readings:
  - ‘사람의 아들들 때문에’로 직역
  - ‘인류 때문에’로 완화
  rationale: 본문은 인간 행위가 땅과 동물 세계에 미치는 심판의 연쇄를 강조하므로, 인과를 약화시키지 않는 방향으로 번역했습니다.
  doctrine_reference: 창세기 3장의 타락-피조세계 저주의 연관, 로마서 8장의 피조물 탄식
