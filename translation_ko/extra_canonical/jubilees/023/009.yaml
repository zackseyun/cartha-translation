  text: And he lived three jubilees and four weeks of years, one hundred and seventy-five years, and he completed the days of his life, old and full of days.
translation:
  language: ko
  text: 그는 세 주빌리와 네 주의 해, 곧 백칠십오 년을 살았으며, 그의 생애의 날들을 마치고, 늙어 날이 가득한 채로 죽었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሠለስተ፡ ኢዮቤልው፡ ሐይወ፡ ወአርባዕተ፡ ሱባዔ፡ ዓመተ፡ *ምእተ፡ ወሰብዓ፡ ወኃምስተ፡ ዓመተ፡
  english_pob_choice: And he lived three jubilees and four weeks of years, one hundred and seventy-five years
  chosen_korean: 세 주빌리와 네 주의 해, 곧 백칠십오 년
  alternatives_korean:
  - 세 희년과 네 이레의 해, 곧 백칠십오 년
  - 세 희년과 네 주기의 해, 곧 백칠십오 년
  lexicon: 주빌리 / 희년
  rationale: Geez의 ኢዮቤልው는 유대 달력의 ‘jubilee’에 해당하므로, 본문 전통을 살려 음역 ‘주빌리’를 쓰고, 뒤에 뜻이 분명한 ‘해’로 수량 표현을 정리했습니다.
- source_word: ወፈጸመ፡ መዋዕለ፡ ሕይወቱ፡
  english_pob_choice: and he completed the days of his life
  chosen_korean: 그의 생애의 날들을 마치고
  alternatives_korean:
  - 그의 생애의 날들을 완성하고
  - 그 생애의 날들을 끝마치고
  lexicon: 완성하다 / 마치다
  rationale: 원문의 ‘완료하다’는 생애의 기간이 다 차서 끝났다는 뜻이므로, 한국어에서는 자연스럽고 문어적인 ‘마치고’로 옮겼습니다.
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕለ።
  english_pob_choice: old and full of days
  chosen_korean: 늙어 날이 가득한 채로 죽었습니다
  alternatives_korean:
  - 늙고 날이 가득하여 죽었습니다
  - 연로하고 날수가 차서 죽었습니다
  lexicon: 날이 가득하다
  rationale: 히브리식 관용구에 가까운 ‘full of days’를 직역에 가깝게 살리되, 한국어 문맥에서는 죽음을 암시해야 하므로 마지막에 ‘죽었습니다’를 보충했습니다.
theological_decisions:
- issue: ‘full of days’의 종결 방식
  chosen_reading: ‘늙어 날이 가득한 채로 죽었습니다’처럼 상태와 죽음을 함께 드러내어, 단순한 노쇠가 아니라 생애가 충만하게 마감되었음을 보이게 했습니다.
  alternative_readings:
  - ‘늙어 날이 가득했습니다’
  - ‘연로하여 날이 가득한 자였습니다’
  rationale: POB의 ‘old and full of days’는 성서적 장수의 축복을 강조하는 종결 표현이므로, 한국어에서도 축복된 완결감을 유지하는 것이 적절합니다.
  doctrine_reference: 창세기 25:8; 욥기 42:17
