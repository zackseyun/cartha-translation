review_pass:
  verdict: revise
  source_fidelity: 원문의 세 이미지를 모두 보존합니다. 다만 초안의 ‘백발이 되어 하얘지다’는 같은 뜻을 중복하며, ‘백 년 된 사람’은 사람의 나이를 나타내는 자연스러운 한국어 표현이 아닙니다. 마지막 구절의 ‘키가 무너지다’도 신장·체격을 가리키는 원문의 표현을 부자연스럽게 좁힙니다.
  naturalness: ‘머리털은 백발이 되다’, ‘백 살 된 사람처럼’, ‘체구는 … 쇠약해지다’는 현대 표준 한국어의 격식 있는 문체에서 자연스럽습니다. 예언적 묘사의 강도도 유지됩니다.
  terminology: ‘백발’, ‘세 주 된 어린아이’, ‘고난과 괴로움’은 본문의 노쇠와 고통의 병렬을 적절히 전달합니다. ‘체구’는 여기서 신장/체격을 뜻하는 표현으로 ‘키’보다 포괄적입니다.
  issues:
  - severity: medium
    issue: ‘백발이 되어 하얘질 것’의 의미 중복
    rationale: 백발 자체가 머리털이 희어진 상태를 뜻하므로 원문의 단일한 노쇠 이미지를 불필요하게 중복합니다.
  - severity: medium
    issue: ‘백 년 된 사람’이라는 연령 표현
    rationale: 한국어에서 사람의 나이는 일반적으로 ‘백 살 된 사람’ 또는 ‘백 살 노인’처럼 표현합니다.
  - severity: medium
    issue: ‘키는 … 무너질 것입니다’의 부자연스러움
    rationale: 원문의 ‘stature’는 키만이 아니라 체격·몸의 형세를 가리키며, 한국어에서 키가 ‘무너지다’라고 하지는 않습니다.
  revised_text: 그리고 아이들의 머리털은 백발이 될 것이며, 세 주 된 어린아이는 백 살 된 사람처럼 늙어 보일 것이고, 그들의 체구는 고난과 괴로움으로 쇠약해질 것입니다.
