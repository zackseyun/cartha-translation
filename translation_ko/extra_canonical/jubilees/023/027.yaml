  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: ko
  text: 그리고 아이들의 머리들은 백발이 되어 하얘질 것이며, 세 주 된 아이도 백 년 된 사람처럼 늙어 보일 것이고, 그들의 키는 고난과 괴로움으로 인해 무너질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርእስተ ደቂቅ
  english_pob_choice: the heads of the children will become white with gray hair
  chosen_korean: 아이들의 머리들은 백발이 되어 하얘질 것이며
  alternatives_korean:
  - 아이들의 머리는 희어질 것이며
  - 아이들의 머리털은 백발이 될 것이며
  lexicon: 머리 / 백발
  rationale: 원문의 '머리들'과 영어 POB의 'heads'를 살리되, 한국어에서는 노화의 표지인 '백발'로 자연스럽게 옮겼습니다.
- source_word: ሕፃን ወልደ ሠለስት ሱባዔ
  english_pob_choice: a child of three weeks
  chosen_korean: 세 주 된 아이도
  alternatives_korean:
  - 세 주 된 어린아이도
  - 세 주짜리 아이도
  lexicon: 세 주 된 아이
  rationale: 수식 구조를 직역하기보다 한국어에서 가장 자연스럽게 이해되는 기간 표현으로 옮겼습니다.
- source_word: ከመ ዘምእት ዓመት
  english_pob_choice: like one of a hundred years
  chosen_korean: 백 년 된 사람처럼
  alternatives_korean:
  - 백 살 먹은 사람처럼
  - 백 년을 산 사람처럼
  lexicon: 백 년 된 사람
  rationale: 비교 대상을 살린 직역형 표현으로, '백 년'의 시간 길이와 노쇠의 이미지를 함께 전달합니다.
- source_word: ይትሐጐል ቍመቶሙ
  english_pob_choice: their stature will be destroyed
  chosen_korean: 그들의 키는 무너질 것입니다
  alternatives_korean:
  - 그들의 체구는 망가질 것입니다
  - 그들의 신체는 쇠약해질 것입니다
  lexicon: 키 / 무너지다
  rationale: 원문의 '신장/체격'이 고난으로 훼손되는 이미지를 살리기 위해 '키'와 '무너지다'를 결합했습니다.
theological_decisions:
- issue: 노쇠와 고난의 묘사를 과도하게 완화하지 않는 번역
  chosen_reading: 노화, 고난, 괴로움의 삼중 이미지를 그대로 드러내어 종말적 쇠락의 강도를 보존했습니다.
  alternative_readings:
  - 부드럽게 의역하여 단순히 '늙어 보일 것이다'만 강조하는 읽기
  - 도덕적 해석을 덧씌워 상징화하는 읽기
  rationale: 이 절은 구체적 신체 변화와 사회적 고난을 함께 제시하므로, 수사적 긴장을 줄이지 않는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문학적-예언적 묘사 보존
- issue: '''고난과 괴로움''의 이중 표현 유지'
  chosen_reading: '''고난과 괴로움''으로 병렬하여 원문의 압박감과 반복을 살렸습니다.'
  alternative_readings:
  - 하나의 단어로 압축하는 읽기
  - '''환난''으로 교회적 관용어만 쓰는 읽기'
  rationale: 영어 POB의 'distress and affliction'을 따라, 두 겹의 고통이 겹치는 느낌을 보존했습니다.
  doctrine_reference: 서술적 반복 보존
