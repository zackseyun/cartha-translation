  lexicon: Geez ደም
  rationale: 피의 유출 이미지를 직접적으로 살리되, 한국어에서 자연스러운 수동·사동 혼합 표현으로 ‘쏟아질’이 문맥상 가장 근접합니다.
- source_word: ዘያስተጋብእ ... ዘይቀብር
  english_pob_choice: there will be none to gather and none to bury
  chosen_korean: 거두는 사람도 묻는 사람도 없을 것입니다
  alternatives_korean:
  - 수습하는 사람도 장사 지내는 사람도 없을 것입니다
  - 모아 거두는 자도 매장하는 자도 없을 것입니다
  lexicon: Geez verbs of collecting and burying
  rationale: 장면의 비통함을 한국어로 간결하게 전달하기 위해 ‘거두다/묻다’를 병렬로 두었고, 매장이라는 보다 예식적인 표현은 과잉 정형화를 피하려고 채택하지 않았습니다.
