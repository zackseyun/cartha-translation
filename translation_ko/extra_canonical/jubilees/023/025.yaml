  source_fidelity: The rendering correctly preserves the future sequence, the distinction between ‘in Israel’ (ውስተ) and ‘against/upon Jacob’ (ዲበ), the violence and bloodshed imagery, and the paired lack of anyone to gather or bury. The alternative reflected in the English audit trail should be retained in a Korean footnote.
