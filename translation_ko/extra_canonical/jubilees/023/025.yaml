  lexicon: Geez ዲበ
  rationale: 같은 절 앞부분의 ‘이스라엘 안에서’와 달리, 여기서는 ‘against/upon’의 대조를 살려 ‘거슬러’로 옮겨 반복된 ‘안에서’의 평준화를 피했습니다.
