  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
  footnotes:
  - marker: a
    text: Or 'in Jacob'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 이스라엘 안에서 폭력을 저지르고 야곱을 거슬러 죄를 지을 것이며, 땅 위에 많은 피가 쏟아질 것이고, 거두는 사람도 묻는 사람도 없을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይገብሩ፡ ... ሀከከ፡
  english_pob_choice: commit violence
  chosen_korean: 폭력을 저지르다
  alternatives_korean:
  - 억압을 행하다
  - 포학을 저지르다
  lexicon: Geez ሀከከ
  rationale: English audit trail이 ‘work oppression’에서 ‘commit violence’로 수정된 점을 반영해, 한국어에서도 결과보다 행위성을 드러내는 ‘폭력을 저지르다’를 택했습니다.
- source_word: ዲበ፡ ያዕቆብ፡
  english_pob_choice: against Jacob
  chosen_korean: 야곱을 거슬러
  alternatives_korean:
  - 야곱 안에서
  - 야곱에게
  lexicon: Geez ዲበ
  rationale: 같은 절 앞부분의 ‘이스라엘 안에서’와 달리, 여기서는 ‘against/upon’의 대조를 살려 ‘거슬러’로 옮겨 반복된 ‘안에서’의 평준화를 피했습니다.
- source_word: ደም፡ ብዙኅ፡ ዲበ፡ ምድር፡
  english_pob_choice: much blood will be poured out on the earth
  chosen_korean: 땅 위에 많은 피가 쏟아질 것이고
  alternatives_korean:
  - 땅에 많은 피가 흘러내릴 것이고
  - 땅 위에 많은 피가 흘려질 것이고
  lexicon: Geez ደም
  rationale: 피의 유출 이미지를 직접적으로 살리되, 한국어에서 자연스러운 수동·사동 혼합 표현으로 ‘쏟아질’이 문맥상 가장 근접합니다.
- source_word: ዘያስተጋብእ ... ዘይቀብር
  english_pob_choice: there will be none to gather and none to bury
  chosen_korean: 거두는 사람도 묻는 사람도 없을 것입니다
  alternatives_korean:
  - 수습하는 사람도 장사 지내는 사람도 없을 것입니다
  - 모아 거두는 자도 매장하는 자도 없을 것입니다
  lexicon: Geez verbs of collecting and burying
  rationale: 장면의 비통함을 한국어로 간결하게 전달하기 위해 ‘거두다/묻다’를 병렬로 두었고, 매장이라는 보다 예식적인 표현은 과잉 정형화를 피하려고 채택하지 않았습니다.
theological_decisions:
- issue: 폭력과 피흘림의 종말론적 경고
  chosen_reading: 본문을 윤리적 일반론보다 미래형 경고로 읽어, 이스라엘과 야곱에 대한 공동체적 파괴를 드러냈습니다.
  alternative_readings:
  - 과거 사건에 대한 회상
  - 비유적 죄책 진술
  rationale: 문장 전체가 연속 미래형 예언으로 구성되어 있어, 한국어도 예언적 경고의 긴장을 유지하는 것이 source-grounded합니다.
  doctrine_reference: 예언문체와 심판 경고의 서술 기능
