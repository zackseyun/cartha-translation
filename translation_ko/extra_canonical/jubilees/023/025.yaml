  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
  footnotes:
  - marker: a
    text: Or 'in Jacob'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 이스라엘 안에서 폭력을 저지르고 야곱을 거슬러[a] 죄를 지을 것이며, 땅 위에 많은 피가 쏟아질 것이고, 거두는 사람도 묻는 사람도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘야곱 안에서’.
    reason: 게에즈어 전치사 ዲበ는 이 문맥에서 ‘거슬러/위에’로 이해하는 것이 앞선 ‘이스라엘 안에서’와의 대조를 가장 잘 보존하지만, ‘야곱 안에서’라는 번역 가능성도 있어 이를 각주로 남깁니다.
lexical_decisions:
- source_word: ወይገብሩ፡ ... ሀከከ፡
  english_pob_choice: commit violence
  chosen_korean: 폭력을 저지르다
  alternatives_korean:
