  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: ko
  text: 그때 그들은 말할 것입니다. “옛사람들의 날수는 많아 천 년까지 이르렀고 좋았습니다. 그러나 보십시오, 우리 생애의 날수는 사람이 오래 살면 칠십 년이고, 강건하면 팔십 년이며, 그 날들은 악합니다. 이 악한 세대의 날들에는 평강이 없습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕሊሆሙ / መዋዕለ፡ ሕይወትነ
  english_pob_choice: the days of the former ones / the days of our life
  chosen_korean: 옛사람들의 날들 / 우리의 생명의 날들
  alternatives_korean:
  - 옛이들의 날들 / 우리의 삶의 날들
  - 선조들의 날들 / 우리의 생애의 날들
  lexicon: 날들, 생명, 삶
  rationale: 게으름없이 기간 자체를 가리키는 표현으로 옮기고, ‘우리의 생명’은 소유격 구조를 살려 인간 생애의 유한함을 드러내었습니다.
- source_word: ዐሠርቱ ምእት ዓመት
  english_pob_choice: up to a thousand years
  chosen_korean: 천 년까지 이르렀고
  alternatives_korean:
  - 천 년에까지
  - 천 년에 달했고
  lexicon: 천 년
  rationale: 수량의 상한을 나타내는 표현이어서 ‘까지 이르렀고’로 자연스럽게 처리하되, 원문의 최대치 의미를 유지했습니다.
- source_word: ሰብዓ ዓመተ / ሰማንያ ዓመተ
  english_pob_choice: seventy years / eighty years
  chosen_korean: 칠십 년 / 팔십 년
  alternatives_korean:
  - 70년 / 80년
  - 일흔 해 / 여든 해
  lexicon: 칠십, 팔십
  rationale: 전승적 숫자 표현을 현대 한국어의 표준적인 한자어 수사로 옮겨 문체를 통일했습니다.
- source_word: እኩይ
  english_pob_choice: evil
  chosen_korean: 악한
  alternatives_korean:
  - 나쁜
  - 사악한
  lexicon: 악, 악한
  rationale: 도덕적 평가를 담은 형용사이므로 단순한 ‘나쁜’보다 source의 강한 판단을 반영하는 ‘악한’이 적합합니다.
theological_decisions:
- issue: 평강의 부재를 개인 심리보다 세대 전체의 상태로 제시하는 방식
  chosen_reading: 「이 악한 세대의 날들에는 평강이 없습니다」라고 옮겨, 문맥상 집단적·시대적 현실을 유지했습니다.
  alternative_readings:
  - ‘이 악한 세대에는 평화가 없습니다’
  - ‘이 악한 세대의 삶에는 평강이 없습니다’
  rationale: 원문은 특정 개인보다 ‘세대의 날들’ 전체를 평가하므로, 개인화하지 않고 세대적 진술로 보존하는 편이 소스 충실도가 높습니다.
  doctrine_reference: 문맥적/서사적 진술
- issue: ‘평강’과 ‘평화’ 중 선택
  chosen_reading: ‘평강’
  alternative_readings:
  - 평화
  rationale: POB 용어 정합성을 따라 eirēnē의 기본 대응을 ‘평강’으로 두되, 여기서는 세상의 안정과 안녕이 부재함을 담는 표현으로 사용했습니다.
  doctrine_reference: 용어 일관성
