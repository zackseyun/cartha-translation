theological_decisions:
- issue: 문장 끝의 ‘사탄’과 ‘악한 멸망자’
  chosen_reading: 원문의 부정 병렬을 따라 사탄과 악한 파괴자/멸망자를 모두 부정했습니다.
  alternative_readings:
  - 악한 자
  - 파괴하는 악
  rationale: 게에즈 원문은 ‘사탄’과 별도로 ‘악한 destroyer’를 병렬로 제시하므로, 둘을 합치거나 약화하지 않고 구분해 옮겼습니다.
  doctrine_reference: 악의 인격적/파괴적 작용에 대한 이중 부정
- issue: ‘평강과 기쁨 가운데 마치고 살아갈 것입니다’
  chosen_reading: 완결과 생존을 함께 살려, 삶이 단지 오래 지속될 뿐 아니라 평강과 기쁨 속에서 충만히 마쳐짐을 표현했습니다.
  alternative_readings:
  - 평강과 기쁨 가운데 살 것입니다
  - 평강과 즐거움으로 날을 마칠 것입니다
  rationale: 원문은 ‘마치다’와 ‘살다’를 함께 사용해 삶의 종결과 지속을 모두 말하므로, 두 동사를 모두 반영했습니다.
  doctrine_reference: 종말적 복의 충만함과 생명의 지속
