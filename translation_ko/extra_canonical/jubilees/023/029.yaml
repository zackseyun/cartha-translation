revisions:
- from: 그리고 그 날들은 사람의 자손들 가운데서 점점 많아지고 늘어날 것입니다 — 세대마다, 날마다 — 마침내 그들의 날이 천 년에 가까워지고, 많은 날들보다 더 많은 여러 해에 이를 때까지입니다. 늙은 사람이 없고, 자기 날에 만족하지 못하는 사람도 없을 것입니다. 그들 모두는 어린아이들과 젊은이들처럼 될 것이기 때문입니다. 또한 그들의 모든 날을 평강과 기쁨 가운데 마치고 살아갈 것이며, 사탄도 없고 악한 멸망자도 없을 것입니다. 그들의 모든 날은 복과 치유의 날들이 될 것이기 때문입니다.[a]
  to: 그리고 사람들의 날수는 세대마다, 날마다 점점 많아지고 늘어나, 마침내 천 년에 가까워지고 날들의 수보다 해의 수가 훨씬 많아질 것입니다. 늙은 사람이 없고, 자기 날에 만족하지 못하는 사람도 없을 것입니다. 그들 모두가 어린아이들과 젊은이들처럼 될 것이기 때문입니다. 그들은 모든 날을 평안과 기쁨 가운데 마칠 것이며, 살 것입니다. 사탄도 없고 파괴하는 악한 자도 없을 것입니다. 그들의 모든 날이 복과 치유의 날들이 될 것이기 때문입니다.
  rationale: The revision preserves the verse’s prophetic future, its repeated temporal progression, the comparative statement about longevity, and the separate negations of Satan and destructive evil. It also removes the unmatched footnote anchor and improves natural modern Korean without adding theological interpretation.
