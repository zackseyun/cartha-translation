  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: ko
  text: 그리고 그 세대의 행위들 위에 야훼로부터 큰 재앙이 임할 것이며, 그분은 그들을 살육과 심판과 포로됨과 약탈과 멸망에 넘기실 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  english_pob_choice: a great punishment
  chosen_korean: 큰 재앙
  alternatives_korean:
  - 큰 벌
  - 거대한 형벌
  lexicon: መቅሠፍት
  rationale: 문맥상 단순한 감정적 '벌'보다 임박한 심판성 재난을 드러내는 '재앙'이 더 적합하며, 'great'은 크기와 강도를 함께 살려 '큰'으로 옮겼습니다.
- source_word: ግብረ
  english_pob_choice: the works
  chosen_korean: 행위들
  alternatives_korean:
  - 일들
  - 작업들
  - 행동들
  lexicon: ግብር
  rationale: POB의 'works'를 따라 행위의 누적된 결과를 뜻하는 복수형 '행위들'로 옮겨, 단순한 손일이나 노동이 아니라 그 세대의 책임 있는 행위들을 가리키게 했습니다.
- source_word: ወይሁቦሙ
  english_pob_choice: he will give them over
  chosen_korean: 그들을 넘기실 것입니다
  alternatives_korean:
  - 그들을 내주실 것입니다
  - 그들을 맡기실 것입니다
  lexicon: ሀበ
  rationale: 주권적 심판 행위를 나타내므로 단순 전달보다 심판 대상에게 '넘기다'가 더 직접적이며, 미래형을 존칭과 함께 자연스럽게 구성했습니다.
- source_word: መጥባሕት፡ ወለኵነኔ፡ ወለፂዋዌ፡ ወለሀደድ፡ ወለብልዐት
  english_pob_choice: slaughter and judgment and captivity and plundering and destruction
  chosen_korean: 살육과 심판과 포로됨과 약탈과 멸망
  alternatives_korean:
  - 도륙과 심판과 사로잡힘과 노략과 파멸
  - 도살과 재판과 포로 생활과 노략질과 삼킴
  lexicon: መጥባሕት / ፂዋዌ / ሀደድ / ብልዐት
  rationale: 열거 구조를 보존하면서, መጥባሕት는 'slaughter'의 잔혹성을 살려 '살육'으로, ወለኵነኔ는 사법적 판결을 넘어선 형벌 맥락의 '심판'으로, ፂዋዌ는 상태를 드러내는 '포로됨'으로, ሀደድ은 'plundering'에 해당하는 '약탈'로, ብልዐት은 POB의 'destruction'을 따라 '멸망'으로 옮겼습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: יהוה에 해당하는 신명 호칭을 본문에서 '야훼'로 표기했습니다.
  alternative_readings:
  - 여호와
  - 주님
  rationale: 프로젝트 기본값과 원문-직결성을 우선해 지명적·학술적 표기인 '야훼'를 사용했으며, 본문의 심판 주체를 흐리지 않도록 했습니다.
  doctrine_reference: POB proper-name convention for YHWH
- issue: 심판의 능동적 주권성
  chosen_reading: '''그들을 넘기실 것입니다''로 번역해 재앙이 단순 사건이 아니라 야훼의 주권적 심판 행위임을 드러냈습니다.'
  alternative_readings:
  - 그들에게 일어나게 될 것입니다
  - 그들을 버리실 것입니다
  rationale: 게으른 수동 표현보다 원문의 행위 주체를 살려, 재앙과 포로·약탈이 야훼의 심판 아래 있다는 점을 분명히 했습니다.
  doctrine_reference: divine judgment and agency
