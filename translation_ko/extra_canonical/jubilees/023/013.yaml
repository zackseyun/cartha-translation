  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: ko
  text: 그리고 그 시기에 사람이 한 희년 반의 세월을 살면, 사람들은 그에 대해 「오래 살았다」고 말할 것입니다. 그러나 그의 날들의 대부분은 고통과 수고와 곤경이며, 평강은 없습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እመ፡ ሐይወ፡ ብእሲ፡ ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት፡
  english_pob_choice: if a man lives a jubilee and a half of years
  chosen_korean: 사람이 한 희년 반의 세월을 살면
  alternatives_korean:
  - 한 희년 반 동안 살면
  - 희년과 반년의 세월을 살면
  lexicon: 희년
  rationale: Geez의 기간 표현을 그대로 살려 ‘희년 반’으로 옮기고, ‘years’를 자연스럽게 ‘세월’로 풀어 기간의 누적감을 유지했습니다.
- source_word: ይብሉ፡ በእንቲአሁ፡ አብዝኀ፡ ሐይወ፡
  english_pob_choice: they will say of him, “He has lived long”
  chosen_korean: 사람들은 그에 대해 「오래 살았다」고 말할 것입니다
  alternatives_korean:
  - 그를 두고 「오래 살았다」고 말할 것입니다
  - 그에 대해 「장수했다」고 말할 것입니다
  lexicon: 살다 / 오래 살다
  rationale: 원문의 평가적 표현을 직역하기보다 관용적인 한국어 평가형으로 옮겨, ‘살다’의 기간 평가를 자연스럽게 드러냈습니다.
- source_word: ሕማም፡ ወስራሕ፡ ወምንዳቤ፡
  english_pob_choice: pain and labor and distress
  chosen_korean: 고통과 수고와 곤경
  alternatives_korean:
  - 고통과 노동과 곤궁
  - 고통과 일과 괴로움
  lexicon: 고통 / 수고 / 곤경
  rationale: ‘labor’를 단순한 노동보다 삶의 고된 수고로 이해하여 ‘수고’로 옮겼고, ‘distress’는 문맥상 압박과 곤란을 포괄하는 ‘곤경’이 가장 가까워 보입니다.
- source_word: '*አልቦ፡ ሰላመ።'
  english_pob_choice: there is no peace
  chosen_korean: 평강은 없습니다
  alternatives_korean:
  - 평화는 없습니다
  - 평안은 없습니다
  lexicon: 평강
  rationale: POB의 기본 용례에 따라 ‘peace’를 ‘평강’으로 두어 공동체적·종말론적 평안의 부재를 유지했습니다.
theological_decisions:
- issue: 인간 생애의 평가를 묘사하는 서술의 톤
  chosen_reading: 본문은 장수 자체를 축복으로 단순화하지 않고, 긴 생애의 대부분이 고통이라는 역설을 담담하게 진술합니다.
  alternative_readings:
  - 장수를 긍정적으로 강조하는 교훈문으로 완화
  - 비관적 표현을 완곡하게 조정
  rationale: Geez 원문과 POB 영어 모두 ‘오래 삶’ 뒤에 고통·수고·곤경과 평강 없음이 이어지는 대비를 유지하므로, 그 긴장을 약화하지 않았습니다.
  doctrine_reference: 지혜문학/경구적 인간 실존의 묘사
