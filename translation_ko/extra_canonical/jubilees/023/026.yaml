  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
  footnotes:
  - marker: a
    text: Or 'but there will be none to save'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날에 그들은 악한 민족들의 손에서 구원을 받으려고 부르짖고, 외치고, 기도할 것입니다. 그러나 구원을 받을 사람은 아무도 없을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸርሑ
  english_pob_choice: they will cry out
  chosen_korean: 부르짖고
  alternatives_korean:
  - 외치고
  - 소리치고
  lexicon: 기본 동사 의미
  rationale: 절박한 탄원을 나타내는 동사로서, 단순한 말하기보다 강한 호소를 드러내는 ‘부르짖다’를 택했습니다.
- source_word: ወይጼውዑ
  english_pob_choice: and call
  chosen_korean: 외치고
  alternatives_korean:
  - 부르고
  - 호소하고
  lexicon: 기본 동사 의미
  rationale: 앞의 ‘부르짖다’와 병렬되는 또 다른 간청 동작으로, 같은 어휘를 반복하기보다 호소의 뉘앙스를 살린 ‘외치다’를 사용했습니다.
- source_word: ወይጼልዩ
  english_pob_choice: and pray
  chosen_korean: 기도할 것입니다
  alternatives_korean:
  - 간구할 것입니다
  - 빌 것입니다
  lexicon: 기본 동사 의미
  rationale: 하나님께 드리는 청원을 분명히 하기 위해 ‘기도하다’를 사용했습니다.
- source_word: ኃጥአን አሕዛብ
  english_pob_choice: the sinful nations
  chosen_korean: 악한 민족들
  alternatives_korean:
  - 죄 많은 민족들
  - 죄인인 민족들
  lexicon: 어휘 대응
  rationale: ‘nations’는 민족들로 옮기고, ‘sinful’은 도덕적 타락을 가리키는 기본 의미를 따라 ‘악한’으로 옮겼습니다.
- source_word: ይድኅኑ / ይድኅን
  english_pob_choice: be saved
  chosen_korean: 구원을 받을
  alternatives_korean:
  - 구원되다
  - 구원받다
  lexicon: 동사상/의미
  rationale: 수동적·비능동적 의미를 분명히 하기 위해 능동 ‘구원하다’가 아니라 ‘구원을 받다’로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 부정문 의미
  chosen_reading: ‘구원을 받을 사람은 아무도 없을 것입니다’로 옮겨, ‘구원해 줄 사람이 없다’는 뜻이 아니라 ‘구원받을 사람이 없다’는 의미를 드러냈습니다.
  alternative_readings:
  - 구원해 줄 사람은 아무도 없을 것입니다
  - 구원될 자가 아무도 없을 것입니다
  rationale: 게에즈 동사 ይድኅን은 타동적 ‘구원하다’가 아니라 자동적 ‘구원받다/구출되다’의 의미이므로, 문장의 초점은 구원의 행위자 부재가 아니라 구원의 결과 부재에 있습니다.
  doctrine_reference: source-language voice/aspect distinction
