  lexicon: 홍수
  rationale: POB가 대문자 Flood로 처리한 것은 특정 사건으로서의 홍수를 가리키기 때문이므로, 서술적 '홍수'보다 사건성을 살린 '홍수 이후'로 옮겼습니다.
- source_word: ይኅትጉ ... ወለአኅጽጾ፡ መዋዕለ፡ ሕይወቶሙ
  english_pob_choice: to grow old quickly, and to shorten the days of their lives
  chosen_korean: 생애의 날수도 급히 늙어 가며 짧아졌습니다
  alternatives_korean:
  - 생애의 날수도 빨리 늙고 짧아졌습니다
  - 삶의 날수도 급속히 늙어 가며 줄어들었습니다
  lexicon: 늙어 가다 / 짧아지다
  rationale: 원문의 두 동작(빨리 늙음, 날수의 단축)을 분리해, 노화와 수명 단축을 함께 드러내면서도 한국어 문장 흐름을 유지했습니다.
- source_word: ዘእንበለ፡ አብርሃም
  english_pob_choice: except Abraham
  chosen_korean: 아브라함은 제외하고
