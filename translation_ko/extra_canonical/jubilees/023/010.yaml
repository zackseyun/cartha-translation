  to: 옛 사람들의 수명은 열아홉 희년이었습니다. 그러나 홍수 뒤에는 아브라함을 제외하고, 그들이 열아홉 희년에서부터 줄어들기 시작했으며, 많은 고난과 그들의 행실의 악함 때문에 빨리 늙고 그들의 생애의 날수가 짧아졌습니다.
