base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: ko
  text: 옛 사람들의 날수는 그들의 생애에 있어 열아홉 희년이었습니다. 그러나 홍수 이후에는 그들이 열아홉 희년에서 점차 줄어들기 시작했고, 많은 고난과 그들의 행위의 악함 때문에 — 아브라함은 제외하고 — 생애의 날수도 급히 늙어 가며 짧아졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐሠርቱ ወተስዓቱ ኢዮቤልውሳት
  english_pob_choice: nineteen jubilees
  chosen_korean: 열아홉 희년
  alternatives_korean:
  - 열아홉 희년들
  - 열아홉 희년 주기
  lexicon: 희년
  rationale: 게으스 원문과 POB의 'jubilees'를 그대로 살려, 기간 단위로서의 의미를 한국어 성경 독자가 이해하기 쉬운 '희년'으로 옮겼습니다.
- source_word: እምድኅረ፡ አይኅ
  english_pob_choice: after the Flood
  chosen_korean: 홍수 이후에는
  alternatives_korean:
  - 대홍수 이후에는
  - 물난리 이후에는
  lexicon: 홍수
  rationale: POB가 대문자 Flood로 처리한 것은 특정 사건으로서의 홍수를 가리키기 때문이므로, 서술적 '홍수'보다 사건성을 살린 '홍수 이후'로 옮겼습니다.
- source_word: ይኅትጉ ... ወለአኅጽጾ፡ መዋዕለ፡ ሕይወቶሙ
  english_pob_choice: to grow old quickly, and to shorten the days of their lives
  chosen_korean: 생애의 날수도 급히 늙어 가며 짧아졌습니다
  alternatives_korean:
  - 생애의 날수도 빨리 늙고 짧아졌습니다
  - 삶의 날수도 급속히 늙어 가며 줄어들었습니다
  lexicon: 늙어 가다 / 짧아지다
  rationale: 원문의 두 동작(빨리 늙음, 날수의 단축)을 분리해, 노화와 수명 단축을 함께 드러내면서도 한국어 문장 흐름을 유지했습니다.
- source_word: ዘእንበለ፡ አብርሃም
  english_pob_choice: except Abraham
  chosen_korean: 아브라함은 제외하고
  alternatives_korean:
  - 아브라함을 제외하고
  - 아브라함만은 예외로 하고
  lexicon: 제외하다
  rationale: POB의 수정안이 'except Abraham'으로 정리한 점을 따라, 예외 표지를 명시적으로 유지한 한국어 표현을 택했습니다.
theological_decisions:
- issue: 홍수 이후 인간 수명 감축의 원인 진술
  chosen_reading: 많은 고난과 그들의 행위의 악함 때문에 수명이 줄어들었다는 인과를 본문대로 유지했습니다.
  alternative_readings:
  - 단순히 시간이 지나 수명이 줄었다고 완화해 옮김
  - 윤리적 원인을 약화시켜 일반적 쇠퇴로 처리함
  rationale: 원문은 수명 단축을 도덕적·역사적 원인과 직접 연결하므로, 그 긴장을 약화하지 않고 그대로 드러내는 것이 필요합니다.
  doctrine_reference: 창세기적 인류사 이해와 지혜문학적 인과 진술
