  terminology: ‘음행’은 ዝሙት에 적절하며, ‘부정’과 ‘불결함’은 원문의 구별된 부정·불결 관련 어휘를 무리하게 합치지 않고 유지합니다. ‘가증함’도 종결 항목의 추상 명사로 적절합니다.
