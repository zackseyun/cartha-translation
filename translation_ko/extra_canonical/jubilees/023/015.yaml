  verdict: approve
  source_fidelity: 게에즈어의 두 절 구조를 충실히 보존합니다. ትኤብስ는 ‘죄를 짓는’으로, በምድር는 ‘땅에서’로 옮겼으며, ገብርሙ를 ‘그들의 행위’로 독립시켜 뒤의 네 항목 전체에 걸리게 했습니다. ‘이 모든 것은 … 위에 임할 것입니다’도 ይመጽእ의 미래적 도래 표현에 적절합니다.
