translation:
  language: ko
  text: 그리고 이 모든 것은 땅에서 죄를 짓는 악한 세대 위에 임할 것입니다. 그들의 행위는 부정과 음행과 불결함과 가증함입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመጽእ
  english_pob_choice: will come upon
  chosen_korean: 임할 것입니다
  alternatives_korean:
  - 올 것입니다
  - 닥칠 것입니다
  lexicon: Geez verb of coming/upon judgment
  rationale: 단순한 도착보다 심판적 ‘임함’의 뉘앙스가 문맥에 더 맞고, 미래형으로 사건의 도래를 자연스럽게 살렸습니다.
- source_word: በምድር
  english_pob_choice: on the earth
  chosen_korean: 땅에서
  alternatives_korean:
  - 땅 위에
  - 세상에
  lexicon: Geez prepositional phrase
  rationale: 지리적·존재론적 범위를 과장하지 않으면서도, 원문의 ‘on the earth’를 가장 간결하게 옮겼습니다.
- source_word: ገብርሙ
  english_pob_choice: their deeds
  chosen_korean: 그들의 행위는
  alternatives_korean:
  - 그들의 일은
  - 그들의 행동은
  lexicon: Geez noun phrase
  rationale: 뒤따르는 악행 목록 전체에 걸리는 주어를 분명히 하기 위해 ‘행위는’으로 옮겼습니다.
- source_word: ወሳቀራር
  english_pob_choice: abomination
  chosen_korean: 가증함
  alternatives_korean:
  - 가증한 것
  - 가증스러운 일
  lexicon: Geez moral-abomination vocabulary
  rationale: 열거의 종결어로서 명사형을 유지해 앞선 ‘부정/음행/불결함’과 병렬을 맞췄습니다.
theological_decisions:
- issue: 원문의 두 절 구조를 한국어에서 어떻게 보존할지
  chosen_reading: ‘악한 세대 위에 임할 것입니다’와 ‘그들의 행위는 …입니다’를 분리해 옮겼습니다.
  alternative_readings:
  - ‘땅을 더럽히는 악한 세대’처럼 하나의 관계절로 합치는 번역
  - ‘땅에서 죄를 짓는 자들’로 축약하는 번역
  rationale: 게에즈 원문은 ‘악한 세대’와 ‘그들의 행위’에 대한 진술을 구별하므로, 이를 합치면 죄의 주체와 행위 목록의 관계가 흐려집니다.
  doctrine_reference: 본문 구조 보존 원칙
