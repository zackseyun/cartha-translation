  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: ko
  text: 아브라함의 집에 소리가 들리자, 그의 아들 이스마엘이 일어나 아버지 아브라함에게 갔고, 아브라함을 위해 울었습니다. 그와 아브라함의 온 집안이 함께 큰 통곡으로 울었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል፡ ተስምዐ፡
  english_pob_choice: a sound was heard
  chosen_korean: 소리가 들리자
  alternatives_korean:
  - 말씀이 들리자
  - 음성이 들리자
  - 소리가 들렸습니다
  lexicon: Geʽez ቃል
  rationale: 문맥상 사람의 말보다 집 안에서 들린 ‘소리/음성’으로 이해하는 편이 자연스럽고, 원문이 말하는 감각적 사건을 간명하게 살렸습니다.
- source_word: ወበከየ፡ ለአብርሃም፡ አቡሁ፡
  english_pob_choice: he wept for Abraham his father
  chosen_korean: 아브라함을 위해 울었습니다
  alternatives_korean:
  - 아브라함을 보고 울었습니다
  - 아버지 아브라함을 위해 통곡했습니다
  - 아브라함을 애도하며 울었습니다
  lexicon: Geʽez በከየ / ለ-
  rationale: 전치사 ለ-가 단순한 ‘대상’보다 애도·비탄의 방향성을 띨 수 있어, 개정된 영어 감사본의 의미를 따라 ‘위해 울다’로 옮겼습니다.
- source_word: ወበከዩ፡ ብካየ፡ ዐቢየ።
  english_pob_choice: they wept with great weeping
  chosen_korean: 함께 큰 통곡으로 울었습니다
  alternatives_korean:
  - 큰 울음으로 함께 울었습니다
  - 크게 통곡했습니다
  - 매우 크게 울었습니다
  lexicon: Geʽez ብካየ ዐቢየ
  rationale: 반복구는 단순한 ‘울다’보다 강한 애도와 집단적 비탄을 나타내므로, 한국어의 관용적 표현인 ‘큰 통곡’으로 보존했습니다.
theological_decisions:
- issue: 아브라함의 죽음에 대한 애도의 방향성
  chosen_reading: 본문은 개인적 슬픔뿐 아니라 가족 전체의 공개적 애도를 함께 강조합니다.
  alternative_readings:
  - 개인의 감정 표현으로만 읽는 해석
  - 의례적 통곡으로만 축소하는 해석
  rationale: ‘그와 아브라함의 온 집안이’와 ‘큰 통곡’의 병치는 애도가 공동체적이고 집중된 반응임을 보여 주므로, 이를 드러내는 번역이 본문의 효과를 가장 잘 보존합니다.
  doctrine_reference: 서사 본문 읽기; 장례 애도 관습
