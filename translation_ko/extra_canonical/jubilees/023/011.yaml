  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
  footnotes:
  - marker: a
    text: Or 'before the LORD'.
    reason: previous_rendering
  - marker: b
    text: Or 'in the presence of evil'.
    reason: previous_rendering
  - marker: c
    text: Or 'his days were fulfilled'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함은 야훼와 함께한 모든 행위에서 온전하였고, 그의 평생 동안 의롭게 행하여 기쁨을 드렸습니다. 보십시오, 그는 악 때문에 늙을 때까지 자기 생애에 네 희년을 채우지 못하였고, 그의 날은 가득 찼습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አብርሃምሰ / Abraham
  english_pob_choice: Abraham
  chosen_korean: 아브라함
  alternatives_korean:
  - 아브람
  lexicon: 고유명사
  rationale: 한국어 성경에서 널리 정착된 형태를 따랐습니다.
- source_word: ምስለ፡ እግዚአብሔር
  english_pob_choice: with the LORD
  chosen_korean: 야훼와 함께한
  alternatives_korean:
  - 주님 앞에서
  - 야훼 앞에서
  lexicon: חֶסֶד/공동체 표현은 아니고 preposition + divine name 관계표현
  rationale: Geez의 ምስለ는 ‘~와 함께’이므로 ‘앞에서’가 아니라 동반 관계를 직접 살려 옮겼습니다. 신명칭은 프로젝트 기본어인 야훼를 사용했습니다.
- source_word: ፍጹም
  english_pob_choice: perfect
  chosen_korean: 온전하였고
  alternatives_korean:
  - 완전하였고
  - 흠이 없었고
  lexicon: 완전/온전 어휘
  rationale: 도덕적·언약적 완전성을 과도하게 절대화하지 않으면서, 인물의 충실함을 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: ይሠምር፡ በጽድቅ
  english_pob_choice: he was pleasing in righteousness
  chosen_korean: 의롭게 행하여 기쁨을 드렸습니다
  alternatives_korean:
  - 의 안에서 기뻐하였습니다
  - 의롭게 기뻐하였습니다
  lexicon: שמꜥ/pleasing + righteousness
  rationale: Geez 동사의 ‘기쁘게 하다/마음에 들다’ 뉘앙스를 살리되, ‘의롭게’와 자연스럽게 연결되도록 한국어 동사구로 풀었습니다.
- source_word: ኢፈጸመ፡ አርባዕተ፡ ኢዮቤልውሳተ
  english_pob_choice: he did not complete four jubilees
  chosen_korean: 네 희년을 채우지 못하였고
  alternatives_korean:
  - 네 희년을 완료하지 못하였고
  - 네 희년을 다 채우지 못하였고
  lexicon: jubilee / complete
  rationale: ‘희년’은 본문 맥락의 기술용어이므로 유지했고, ‘complete’는 한국어에서 기간을 ‘채우다’로 옮기는 것이 가장 자연스럽습니다.
- source_word: ወጸገበ፡ መዋዕሊሁ
  english_pob_choice: he was full of days
  chosen_korean: 그의 날은 가득 찼습니다
  alternatives_korean:
  - 그는 날들로 가득하였습니다
  - 그의 생애는 충만하였습니다
  lexicon: idiom / days filled
  rationale: 영문 각주가 지적하듯 수동형 ‘his days were fulfilled’보다, 인물의 삶이 ‘날들로 가득함’이라는 관용을 보존하는 쪽이 원문 의미를 더 잘 드러냅니다.
theological_decisions:
- issue: ‘with the LORD’의 관계표현과 신명칭
  chosen_reading: 아브라함의 행위가 야훼와 함께한 삶의 자리에서 평가된다는 뜻으로 읽고, ‘야훼와 함께한’으로 옮겼습니다.
  alternative_readings:
  - 야훼 앞에서
  - 주님 앞에서
  rationale: Ge'ez 전치사 ምስለ는 동반 관계를 뜻하므로, 단순한 법정적·공간적 ‘앞에서’로 약화하지 않았습니다.
  doctrine_reference: 창세기 17장, 26장에 나타나는 아브라함의 언약적 충실성
