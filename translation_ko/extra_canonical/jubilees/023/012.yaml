translation:
  language: ko
  text: 그리고 지금부터 큰 심판의 날에 이르기까지 일어날 모든 세대는 두 희년을 채우기도 전에 급히 늙어 갈 것이며, 그들의 지식은 그들의 영에서 떠나고, 그들의 모든 지식은 사라질 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኵሉ፡ ትውልድ፡ ዘይትነሣእ፡ እምይእዜ፡ ወእስከ፡ ዕለተ፡ ደይን፡ ዐባይ፡
  english_pob_choice: all the generations that will arise from now until the day of the great judgment
  chosen_korean: 지금부터 큰 심판의 날에 이르기까지 일어날 모든 세대
  alternatives_korean:
  - 이제부터 큰 심판의 날까지 생겨날 모든 세대
  - 현재부터 큰 심판의 날에 이르기까지 일어나는 모든 세대
  lexicon: 세대
  rationale: 세대는 집단적 후손을 가리키는 기본 뜻을 살리고, ይትነሣእ의 ‘일어나다/생겨나다’는 미래 발생을 자연스럽게 옮겼습니다.
- source_word: ፍጡነ፡ ይረሰኡ፡
  english_pob_choice: will grow old quickly
  chosen_korean: 급히 늙어 갈 것이며
  alternatives_korean:
  - 빠르게 늙어 갈 것이며
  - 서둘러 늙을 것이며
  lexicon: 늙다
  rationale: ‘늙어 가다’는 진행성과 쇠퇴의 뉘앙스를 함께 담고, ፍጡነ의 속도를 ‘급히’로 간결하게 반영합니다.
- source_word: ይፈጽሙ፡ ክልኤ፡ ኢዮቤልወ፡
  english_pob_choice: before they complete two jubilees
  chosen_korean: 두 희년을 채우기도 전에
  alternatives_korean:
  - 두 희년을 다 채우기 전에
  - 두 희년을 마치기도 전에
  lexicon: 희년
  rationale: 이 문맥의 ኢዮቤልወ는 율법적 주기인 ‘희년’을 가리키므로, 완료 전이라는 의미를 자연스럽게 ‘채우기도 전에’로 옮겼습니다.
- source_word: እመንፈሶሙ
  english_pob_choice: from them, from their spirit
  chosen_korean: 그들의 영에서 떠나고
  alternatives_korean:
  - 그들의 영으로부터 떠나고
  - 그들의 영에서 물러나고
  lexicon: 영
  rationale: source의 ‘from their spirit’는 단순한 마음보다 영적 내면을 가리키므로 ‘영’으로 옮기고, ‘떠나고’로 분리/이탈의 동사를 살렸습니다.
- source_word: ወትከውን፡ እንዘ፡ ተኀድጎሙ፡ አእምሮቶሙ፡
  english_pob_choice: and their knowledge will depart from them
  chosen_korean: 그들의 지식은 그들의 영에서 떠나고
  alternatives_korean:
  - 그들의 지식은 그들에게서 떠나고
  - 그들의 앎은 그들의 영에서 떠나고
  lexicon: 지식
  rationale: 앞뒤의 반복을 고려해 한 번은 ‘지식’으로, 마지막은 ‘모든 지식’으로 유지하여 원문의 점층을 보존했습니다.
theological_decisions:
