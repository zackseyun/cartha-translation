  text: And through all this Jacob was lying in his bosom, and he did not know that Abraham, his father's father, had died.
translation:
  language: ko
  text: 그런데 이 일들이 모두 일어나는 동안 야곱은 그의 품에 기대어 누워 있었고, 아브라함, 곧 그의 아버지의 아버지가 죽은 줄은 알지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስክብ፡ ውስተ፡ ሕፅኑ
  english_pob_choice: was lying in his bosom
  chosen_korean: 그의 품에 기대어 누워 있었고
  alternatives_korean:
  - 그의 품에 누워 있었고
  - 그의 품 안에 누워 있었고
  - 그의 품에 기대고 있었고
  lexicon: bosom / lap / chest
  rationale: 문맥상 단순한 위치보다 안기거나 기대어 있는 친밀한 자세를 나타내므로, ‘품에 기대어 누워 있었다’로 자연스럽게 살렸습니다.
- source_word: ወኢያእመረ፡
  english_pob_choice: and he did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 알고 있지 못했습니다
  - 모르고 있었습니다
  lexicon: know / not know
  rationale: 서술 흐름에 맞는 평이한 부정 인식 표현으로 옮겼습니다.
- source_word: ከመ፡ ሞተ፡ አብርሃም፡ አቡ፡ አቡሁ
  english_pob_choice: that Abraham, his father's father, had died
  chosen_korean: 아브라함, 곧 그의 아버지의 아버지가 죽은 줄은
  alternatives_korean:
  - 아브라함, 그의 아버지의 아버지가 죽었다는 것을
  - 아브라함, 곧 그의 조부가 죽은 줄은
  - 아브라함, 곧 그의 아버지의 아버지가 죽었다는 사실을
  lexicon: his father's father / died
  rationale: 원문은 아브라함을 관계절 없이 ‘그의 아버지의 아버지’로 풀이하므로, 이를 그대로 풀어 설명하되 ‘곧’으로 동일 인물을 분명히 했습니다.
- source_word: ወበዝ፡ ኵሉ፡
  english_pob_choice: And through all this
  chosen_korean: 그런데 이 일들이 모두 일어나는 동안
  alternatives_korean:
  - 그리고 이 모든 동안
  - 이 모든 일 가운데
  - 그 모든 일 사이에
  lexicon: through all this
  rationale: 사건이 진행되는 시간적 배경을 드러내는 표현이므로, 자연스러운 한국어 시간부사구로 옮겼습니다.
theological_decisions:
- issue: 아브라함의 죽음에 대한 인식 부재를 어떻게 전달할지
  chosen_reading: 야곱이 아브라함의 죽음을 알지 못한 상태로 계속 잠들어 있었다는 서술로 옮겼습니다.
  alternative_readings:
  - 야곱이 자는 동안 아브라함의 죽음을 전혀 몰랐다
  - 야곱은 아브라함이 죽었다는 사실을 알지 못했다
  rationale: 원문은 단순한 정보 결핍이 아니라 사건 진행 중 인식되지 않은 상태를 말하므로, 시간 진행과 무지의 상태를 함께 드러내는 번역이 적절합니다.
