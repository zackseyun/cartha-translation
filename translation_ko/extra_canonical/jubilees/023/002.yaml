  chosen_reading: 야곱이 아브라함의 죽음을 알지 못한 상태로 계속 잠들어 있었다는 서술로 옮겼습니다.
  alternative_readings:
  - 야곱이 자는 동안 아브라함의 죽음을 전혀 몰랐다
  - 야곱은 아브라함이 죽었다는 사실을 알지 못했다
  rationale: 원문은 단순한 정보 결핍이 아니라 사건 진행 중 인식되지 않은 상태를 말하므로, 시간 진행과 무지의 상태를 함께 드러내는 번역이 적절합니다.
