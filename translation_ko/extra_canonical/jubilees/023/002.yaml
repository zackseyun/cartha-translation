  source_fidelity: 원문은 야곱이 ‘그의 품’(문맥상 아브라함의 품)에 누워 있었으며, 아브라함 곧 자기 아버지의 아버지가 죽은 것을 알지 못했다고 말합니다. 초안의 ‘기대어’는 원문에 없는 자세의 뉘앙스를 보태므로 제거하는 것이 안전합니다. 또한 ‘그의 품’은 한국어에서 야곱 자신의 품으로도 읽힐 수 있어 선행사를 명시할 필요가 있습니다.
  naturalness: ‘이 모든 일이 일어나는 동안’과 ‘죽었다는 것을 알지 못했습니다’는 현대 한국어 합쇼체 서술로 자연스럽습니다. 문두의 ‘그런데’는 원문의 단순 접속을 불필요하게 대조적으로 만들 수 있어 ‘이 모든 동안’으로 처리했습니다.
