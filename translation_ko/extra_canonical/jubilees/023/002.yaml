  - 아브라함, 곧 그의 아버지의 아버지가 죽었다는 사실을
  lexicon: his father's father / died
  rationale: 원문은 아브라함을 관계절 없이 ‘그의 아버지의 아버지’로 풀이하므로, 이를 그대로 풀어 설명하되 ‘곧’으로 동일 인물을 분명히 했습니다.
- source_word: ወበዝ፡ ኵሉ፡
  english_pob_choice: And through all this
  chosen_korean: 그런데 이 일들이 모두 일어나는 동안
