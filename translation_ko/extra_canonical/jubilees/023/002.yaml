  text: 이 모든 동안 야곱은 아브라함의 품에 누워 있었고, 아브라함, 그의 아버지의 아버지가 죽었다는 것을 알지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስክብ፡ ውስተ፡ ሕፅኑ
  english_pob_choice: was lying in his bosom
  chosen_korean: 그의 품에 기대어 누워 있었고
  alternatives_korean:
  - 그의 품에 누워 있었고
  - 그의 품 안에 누워 있었고
  - 그의 품에 기대고 있었고
  lexicon: bosom / lap / chest
  rationale: 문맥상 단순한 위치보다 안기거나 기대어 있는 친밀한 자세를 나타내므로, ‘품에 기대어 누워 있었다’로 자연스럽게 살렸습니다.
- source_word: ወኢያእመረ፡
  english_pob_choice: and he did not know
  chosen_korean: 알지 못했습니다
  alternatives_korean:
  - 알지 못했습니다
  - 알고 있지 못했습니다
  - 모르고 있었습니다
  lexicon: know / not know
  rationale: 서술 흐름에 맞는 평이한 부정 인식 표현으로 옮겼습니다.
- source_word: ከመ፡ ሞተ፡ አብርሃም፡ አቡ፡ አቡሁ
  english_pob_choice: that Abraham, his father's father, had died
  chosen_korean: 아브라함, 곧 그의 아버지의 아버지가 죽은 줄은
  alternatives_korean:
  - 아브라함, 그의 아버지의 아버지가 죽었다는 것을
