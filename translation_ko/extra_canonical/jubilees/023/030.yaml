revisions:
- from: 그때에 주께서 그의 종들을 고치실 것이며, 그들은 일어나 큰 평강을 보고, 자기들의 원수들을 쫓아낼 것이며, 의인들은 보고 감사하며 영원무궁토록 기쁨으로 즐거워할 것입니다.[a][b]
  to: 그러고 나서 주께서 그의 종들을 고치실 것이며, 그들은 일어나 큰 평강을 보고 자기들의 원수들을 쫓아낼 것입니다. 의인들은 보고 감사하며, 기쁨으로 영원무궁토록 즐거워할 것입니다.
  rationale: 원문의 연결 표현을 ‘그러고 나서’로 조정하고, 두 주어 집단의 절 경계를 한국어 문장으로 명확히 했습니다. 의미를 보충하거나 신학적으로 특정 해석을 강요하지 않았으며, 대응 각주가 없는 표지는 제거했습니다.
