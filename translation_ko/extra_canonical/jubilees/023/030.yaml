  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: ko
  text: 그때에 주께서 그의 종들을 고치실 것이며, 그들은 일어나 큰 평강을 보고, 자기들의 원수들을 쫓아낼 것이며, 의인들은 보고 감사하며 영원무궁토록 기쁨으로 즐거워할 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይፈውሶ (heal)
  english_pob_choice: will heal his servants
  chosen_korean: 그의 종들을 고치실 것이며
  alternatives_korean:
  - 그의 종들을 치유하실 것이며
  - 그의 종들을 낫게 하실 것이며
  lexicon: Geez ይፈውሶ → 치유/고치다
  rationale: ‘고치다’는 몸과 상태를 회복시키는 넓은 의미를 살리면서도, 한국어에서 자연스럽고 직접적인 회복 행위를 나타냅니다.
- source_word: ሰላመ ዐቢየ (great peace)
  english_pob_choice: great peace
  chosen_korean: 큰 평강
  alternatives_korean:
  - 큰 평화
  - 엄청난 평강
  lexicon: Geez ሰላመ → 평강
  rationale: 이 전승의 ‘평안’보다 소스의 종교적·관계적 안정감을 살리기 위해 ‘평강’을 유지했고, ‘큰’으로 ‘great’를 옮겼습니다.
- source_word: ጸላእቶሙ (their enemies)
  english_pob_choice: their enemies
  chosen_korean: 자기들의 원수들을 쫓아낼 것이며
  alternatives_korean:
  - 그들의 원수들을 몰아낼 것이며
  - 원수들을 쫓아버릴 것이며
  lexicon: Geez ጸላእቶሙ → 원수들
  rationale: ‘drive out’는 단순 관찰이 아니라 적극적 축출을 뜻하므로 ‘쫓아내다’로 옮겨 동작성을 분명히 했습니다.
- source_word: ጻድቃን (the righteous)
  english_pob_choice: the righteous
  chosen_korean: 의인들은
  alternatives_korean:
  - 의로운 사람들은
  - 의인들이
  lexicon: Geez ጻድቃን → 의인
  rationale: 본문의 대조 구조를 살리기 위해 집합명사형 ‘의인들’을 택해 의인들의 응답을 분명히 했습니다.
- source_word: በፍሥሐ (with joy)
  english_pob_choice: with joy
  chosen_korean: 기쁨으로 즐거워할 것입니다
  alternatives_korean:
  - 기쁨 가운데 즐거워할 것입니다
  - 기쁨으로 기뻐할 것입니다
  lexicon: Geez ፍሥሐ → 기쁨
  rationale: 끝맺음의 반복적 기쁨을 한국어의 자연스러운 동사구로 살리되, 소스의 강조를 유지했습니다.
theological_decisions:
- issue: 여호와/주를 어떻게 표기할지
  chosen_reading: 주
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 제공된 영어 POB가 ‘LORD’로 표기하는 본문이지만, 이 외경 구절은 히브리어/그리스어 인용관계가 제시되지 않아 본문 내 관습적 예외를 두지 않고 한국어 독자에게 가장 중립적인 ‘주’를 사용했습니다.
  doctrine_reference: 서지·표기 관행
