  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
  footnotes:
  - marker: a
    text: Or 'uncleanness and corruption'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 모두가 악을 행하였기 때문입니다. 모든 입은 죄를 말하고, 그들의 모든 행위는 부정함과 가증함이며, 그들의 모든 길은 더러움과 부정함과 파멸입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부정함과 부패’.
    reason: 제공된 영어 POB 감사 기록의 대안 번역(‘uncleanness and corruption’)을 한국어로 보존합니다.
lexical_decisions:
- source_word: ኵሎሙ፡ አእከዩ፡
  english_pob_choice: For all of them have acted wickedly
  chosen_korean: 그들 모두가 악을 행하였기 때문입니다
  alternatives_korean:
  - 그들 모두가 사악하게 행하였습니다
  - 그들 모두가 악하게 행하였습니다
  lexicon: አእከዩ
  rationale: 행위 전체를 가리키는 도덕적 비난을 살리되, 한국어에서는 자연스럽게 ‘악을 행하다’로 옮겨 원문의 강한 평가를 보존했습니다.
- source_word: ወኵሉ፡ አፍ፡ ይትናገር፡ ዐበሳ፡
  english_pob_choice: and every mouth speaks sin
  chosen_korean: 모든 입이 죄를 말하며
  alternatives_korean:
  - 모든 입이 죄악을 말하며
  - 모든 입이 죄를 이야기하며
  lexicon: ዐበሳ
  rationale: POB의 수정본이 ‘guilt’보다 ‘sin’을 택한 점을 반영해, 한국어에서도 직접적으로 ‘죄’를 유지했습니다.
- source_word: ወኵሉ፡ ግብሮሙ፡ ርኵስ፡ ወስቈራር፡
  english_pob_choice: and all their works are uncleanness and abomination
  chosen_korean: 그들의 모든 일은 부정함과 가증함이며
  alternatives_korean:
  - 그들의 모든 일은 부정함과 혐오함이며
  - 그들의 모든 행위는 더러움과 가증함이며
  lexicon: ርኵስ፡ / ስቈራር፡
  rationale: ‘uncleanness’와 ‘abomination’의 이중 표현을 구분해, 첫 항은 윤리적·제의적 부정성을 드러내는 ‘부정함’, 둘째 항은 강한 혐오와 가증의 뉘앙스를 지닌 ‘가증함’으로 옮겼습니다.
- source_word: ወኵሉ፡ ፍኖቶሙ፡ ግማኔ፡ ወርኵስ፡ ወሙስና፡
  english_pob_choice: and all their ways are defilement and uncleanness and destruction
  chosen_korean: 그들의 모든 길은 더러움과 부정함과 파멸입니다
  alternatives_korean:
  - 그들의 모든 길은 더러움과 부정함과 멸망입니다
  - 그들의 모든 길은 더러움과 부정함과 파괴입니다
  lexicon: ግማኔ፡ / ርኵስ፡ / ሙስና፡
  rationale: 마지막 항은 POB 수정본이 ‘ruin’ 대신 ‘destruction’을 채택한 점을 따라, 한국어에서도 종말적 소멸을 나타내는 ‘파멸’로 번역했습니다.
theological_decisions:
- issue: 도덕적 열거의 강도와 반복 구조
  chosen_reading: 본문의 반복적 ‘모든’과 세 항의 열거를 그대로 살려, 총체적 타락의 진술로 읽히게 했습니다.
  alternative_readings:
  - 문장을 매끄럽게 다듬어 한 번의 열거로 축소하는 읽기
  - ‘부정함’과 ‘더러움’을 하나로 통합하는 읽기
  rationale: 원문은 각 항을 중첩해 죄의 전면성을 강조하므로, 한국어도 반복과 병렬을 유지해 그 강조를 약화시키지 않았습니다.
  doctrine_reference: 인간의 전적 타락에 대한 묵시적 진술
- issue: ‘가증함’의 강한 평가
  chosen_reading: ስቈራር의 강한 혐오·가증 의미를 ‘가증함’으로 직역에 가깝게 보존했습니다.
  alternative_readings:
  - ‘역겨움’으로 완화하는 읽기
  - ‘부패’로 일반화하는 읽기
  rationale: 최근 대조본이 ‘corruption’보다 ‘abomination’을 지지하므로, 본문이 단순한 부패가 아니라 도덕적 혐오의 대상임을 분명히 해야 합니다.
  doctrine_reference: 죄에 대한 예언적/지혜문학적 고발의 강도
