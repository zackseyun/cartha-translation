  text: And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.
translation:
  language: ko
  text: 그때에 그 자녀들은 율법을 찾기 시작하고, 계명을 구하며, 의의 길로 돌아오게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕገገ፡
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 교훈
  lexicon: Torah/Instruction
  rationale: English POB가 ‘the law’로 옮긴 대상을 따라, 여기서는 일반 법규보다 하나님의 규범인 율법으로 보는 것이 가장 자연스럽습니다.
- source_word: ትእዛዝ፡
  english_pob_choice: the commandments
  chosen_korean: 계명
  alternatives_korean:
  - 명령
  - 훈계
  lexicon: commandment/command
  rationale: 복수형의 ‘명령들’보다 성경적 관용이 강한 ‘계명’이 원문의 종교적·규범적 뉘앙스를 더 정확히 드러냅니다.
- source_word: ፍኖተ፡ ጽድቅ።
  english_pob_choice: the way of righteousness
  chosen_korean: 의의 길
  alternatives_korean:
  - 의로운 길
  - 공의의 길
  lexicon: path of righteousness
  rationale: 직역하면 ‘의의 길’이 원문 구조를 가장 가깝게 보존하며, POB의 ‘way of righteousness’를 간결하게 반영합니다.
theological_decisions:
- issue: ‘돌아오다’의 방향성
  chosen_reading: ‘의의 길로 돌아오게 될 것입니다’로 미래적 회복과 전환을 함께 드러냈습니다.
  alternative_readings:
  - ‘의의 길로 돌아갈 것입니다’
  - ‘의로운 길로 돌아서게 될 것입니다’
  rationale: 원문은 단순한 이동이 아니라 이전의 길에서 벗어나 바른 길로 전환하는 의미를 담고 있으므로, 회복의 방향성을 분명히 했습니다.
  doctrine_reference: 회개/돌이킴의 성경적 모티프
- issue: ‘자녀들’의 집합적 의미
  chosen_reading: ‘그 자녀들’로 집합적 표현을 유지했습니다.
  alternative_readings:
  - ‘그 아이들’
  - ‘그 후손들’
  rationale: 문맥상 특정 개인이 아니라 공동체적 후손 전체를 가리키므로, 중립적이고 포괄적인 ‘자녀들’이 적절합니다.
  doctrine_reference: 언약 공동체/세대적 표현
