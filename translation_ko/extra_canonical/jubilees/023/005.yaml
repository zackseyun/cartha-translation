  lexicon: fall upon / face
  rationale: Geez의 ‘떨어지다/엎드리다’와 위치 표현 ‘얼굴에’의 결합을 자연스러운 한국어 동작으로 옮기되, 단순한 접촉보다 격한 애도와 경의의 몸짓이 드러나도록 ‘엎드려’로 처리했습니다.
