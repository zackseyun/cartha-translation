  - 눈물을 흘리며
  lexicon: weep
  rationale: 서술의 연속성을 살리기 위해 동사구 안에서 현재분사형 ‘울며’를 사용해, 다음 동작인 입맞춤과 병렬적으로 읽히게 했습니다.
- source_word: ወሰዐሞ።
  english_pob_choice: kissed him
  chosen_korean: 그에게 입맞추었습니다
  alternatives_korean:
  - 그를 입맞추었습니다
  - 그의 입에 입을 맞추었습니다
  lexicon: kiss
  rationale: Geez의 목적어 대명사를 반영해 ‘그에게’로 옮기고, 한국어에서 자연스러운 관용 표현인 ‘입맞추었습니다’를 택했습니다.
