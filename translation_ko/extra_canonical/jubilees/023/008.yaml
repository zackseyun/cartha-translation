  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: ko
  text: 그의 집에 속한 모든 남자들은 그를 위하여 마흔 날 동안 애곡하였으며, 이삭과 이스마엘과 그들의 모든 아들들, 그리고 그두라의 모든 아들들도 각자의 자리에서 애곡하였습니다. 아브라함을 위한 애도의 날들이 끝났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርብዓ፡ መዋዕለ፡
  english_pob_choice: forty days
  chosen_korean: 마흔 날 동안
  alternatives_korean:
  - 사십 일 동안
  - 마흔 동안
  lexicon: 수사 표현
  rationale: Geez의 기간 표현을 자연스러운 한국어 시간 표현으로 옮기되, ‘일’보다 원문의 날 수를 분명히 드러내기 위해 ‘마흔 날 동안’으로 렌더링했습니다.
- source_word: ወከይዎ፡ / ብካዩ፡
  english_pob_choice: wept / days of weeping
  chosen_korean: 울었으며 / 통곡의 날들이
  alternatives_korean:
  - 곡하고 / 곡하는 날들이
  - 슬퍼하고 / 슬픔의 날들이
  lexicon: 애도 동사/명사
  rationale: 본문은 단순한 슬픔보다 공개적 애곡을 나타내므로 ‘울다’와 ‘통곡’으로 구분해 애도의 강도를 살렸습니다.
- source_word: በመካኖሙ፡
  english_pob_choice: in their places
  chosen_korean: 그들의 자리에서
  alternatives_korean:
  - 그 자리에
  - 각자의 자리에서
  lexicon: 공간 표현
  rationale: 직역하면 ‘그들의 자리에서’이지만, 한국어에서 어색한 병렬을 피하면서도 각 사람이 정해진 자리에서 있었다는 뜻을 보존했습니다.
- source_word: ኵሎሙ፡ ሰብአ፡ ቤቱ፡
  english_pob_choice: all the men of his house
  chosen_korean: 그의 집안의 모든 남자들은
  alternatives_korean:
  - 그 집의 모든 남자들은
  - 그의 집 사람들은 모두
  lexicon: 가계/가정 표현
  rationale: ‘집안의 남자들’은 가문의 남성 구성원을 가리키는 소유격 구조로 이해하여, 집안의 구성원이라는 의미를 분명히 했습니다.
theological_decisions:
- issue: 마지막 절의 주체가 아브라함인지, 아브라함을 위한 애도인지
  chosen_reading: ‘아브라함을 위한 통곡의 날들이 끝났습니다’로 옮겨, 아브라함이 우는 것이 아니라 그를 애도하는 기간이 끝난 것으로 이해했습니다.
  alternative_readings:
  - ‘아브라함의 통곡의 날들이 끝났습니다’
  - ‘아브라함이 우는 날들이 끝났습니다’
  rationale: 영어 POB 수정 이력과 Geez 문맥은 마지막 절을 애도 대상에 관한 표현으로 읽게 하며, 이를 반영하지 않으면 주체가 뒤바뀝니다.
  doctrine_reference: 서사 문맥 해석과 대명사/목적격 구분
