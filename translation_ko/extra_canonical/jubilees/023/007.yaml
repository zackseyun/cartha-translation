    reason: 원문의 ‘double cave’가 가리키는 공간적 표현을 설명하며, 본문에서는 자연스러운 한국어 표현을 유지합니다.
lexical_decisions:
- source_word: በዓተ ካዕበት
  english_pob_choice: the double cave
  chosen_korean: 쌍동굴
  alternatives_korean:
  - 두 겹의 동굴
