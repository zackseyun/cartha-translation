  text: 그의 아들 이삭과 이스마엘이 그를 사라 그의 아내 가까이 있는 쌍동굴에 장사하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዓተ ካዕበት
  english_pob_choice: the double cave
  chosen_korean: 쌍동굴
  alternatives_korean:
  - 두 겹의 동굴
  - 이중 동굴
  - 두 개의 굴
  lexicon: source_phrase
  rationale: 게에즈의 ‘double cave’에 대응하는 고유한 매장 지명을 직역하되, 본문의 지리적·전승적 의미를 살려 자연스러운 한국어 합성어인 ‘쌍동굴’로 옮겼습니다.
- source_word: ወቀበርዎ
  english_pob_choice: buried him
  chosen_korean: 장사하였습니다
  alternatives_korean:
  - 묻었습니다
  - 장례를 치렀습니다
  - 매장하였습니다
  lexicon: source_verb
  rationale: 문맥상 시신을 매장하는 행위이므로 ‘장사하다’를 택해 장례 행위의 의미를 분명히 했습니다.
- source_word: ውሉዱ ይስሐቅ ወእስማዔል
  english_pob_choice: his sons Isaac and Ishmael
  chosen_korean: 그의 아들 이삭과 이스마엘이
  alternatives_korean:
  - 이삭과 이스마엘, 그의 아들들이
  - 그의 아들들인 이삭과 이스마엘이
  lexicon: syntax
  rationale: 영어 POB의 최신 수정처럼 장례 행위의 주어가 ‘이삭과 이스마엘’임을 앞에 두어, 게에즈 문장의 주어-동사 관계를 한국어에서도 분명히 드러냈습니다.
- source_word: ቅሩበ ሳራ ብእሲቱ
  english_pob_choice: near Sarah his wife
  chosen_korean: 사라 그의 아내 가까이 있는
  alternatives_korean:
  - 그의 아내 사라 곁에 있는
  - 아내 사라의 가까이에 있는
  lexicon: source_phrase
  rationale: ‘near’를 공간적으로 풀어 ‘가까이 있는’으로 옮겨, 무덤의 위치를 설명하는 구문을 자연스럽게 유지했습니다.
theological_decisions:
- issue: 매장 행위의 서술 방식
  chosen_reading: 중립적인 서술로 ‘장사하였습니다’를 사용해, 본문의 사실 진술을 보존했습니다.
  alternative_readings:
  - ‘묻었습니다’처럼 더 일상적인 표현
  - ‘장례를 치렀습니다’처럼 의례성을 강화한 표현
  rationale: 게에즈 원문은 단순한 매장 사실을 말하며, 추가적인 장례 의례나 해석을 덧붙이지 않습니다.
  doctrine_reference: 본문 서사 존중
