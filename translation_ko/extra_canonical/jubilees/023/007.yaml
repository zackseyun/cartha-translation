  lexicon: source_phrase
  rationale: 게에즈의 ‘double cave’에 대응하는 고유한 매장 지명을 직역하되, 본문의 지리적·전승적 의미를 살려 자연스러운 한국어 합성어인 ‘쌍동굴’로 옮겼습니다.
