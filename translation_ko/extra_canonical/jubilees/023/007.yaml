  lexicon: syntax
  rationale: 영어 POB의 최신 수정처럼 장례 행위의 주어가 ‘이삭과 이스마엘’임을 앞에 두어, 게에즈 문장의 주어-동사 관계를 한국어에서도 분명히 드러냈습니다.
- source_word: ቅሩበ ሳራ ብእሲቱ
  english_pob_choice: near Sarah his wife
  chosen_korean: 사라 그의 아내 가까이 있는
  alternatives_korean:
