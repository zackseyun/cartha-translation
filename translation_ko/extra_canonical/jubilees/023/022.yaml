base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: ko
  text: 그리고 살아남은 자들은 자기들의 악함에서 의의 길로 돌이키지 않을 것입니다. 그들 모두는 기만과 부를 위하여 일어날 것이며, 각자 자기 이웃의 모든 것을 빼앗을 것입니다. 그들은 큰 이름을 떨치겠지만, 그것은 진리나 의에 근거한 것이 아닐 것입니다. 또 그들은 자신들의 더러움과 그 더러움의 부패로 지성소를 더럽힐 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በፍኖተ፡ ጽድቅ፡ ኢይትመየጡ፡ እምነ፡ እከዮሙ
  english_pob_choice: will not turn from their wickedness to the way of righteousness
  chosen_korean: 불의의 길에서 의의 길로 돌아서지 않을 것입니다
  alternatives_korean:
  - 자기 악함에서 의의 길로 돌이키지 않을 것입니다
  - 악한 행실에서 의로운 길로 되돌아가지 않을 것입니다
  lexicon: 의 / 악 / 길
  rationale: Geez의 ‘돌아서다/돌이키다’와 ‘의의 길’ 대비를 살려, 단순한 내적 변화가 아니라 행로의 전환을 분명히 드러냈습니다.
- source_word: ኵሎሙ ለትዕግልት ወውስተ ብዕል ይትነሥኡ
  english_pob_choice: all of them will rise up for deceit and wealth
  chosen_korean: 그들 모두는 속임수와 부를 위해 일어나며
  alternatives_korean:
  - 그들 모두는 속임수와 부를 얻으려고 일어나며
  - 그들 모두는 속임과 재물을 위해 들고일어나며
  lexicon: 속임수 / 부 / 일어나다
  rationale: 원문은 ‘무엇을 향해 일어나는지’를 묘사하므로, 목적어를 자연스럽게 살리면서도 ‘부’의 축적 욕망을 유지했습니다.
- source_word: ወአኮ፡ በሀልወ፡ ወአኮ፡ በጽድቅ
  english_pob_choice: but not in truth and not in righteousness
  chosen_korean: 진리 안에서도 의 안에서도 그렇지 않을 것입니다
  alternatives_korean:
  - 진리로도 의로도 그러하지 않을 것입니다
  - 진실과 의 안에서가 아니라
  lexicon: 진리 / 의
  rationale: Geez의 부정 병렬을 한국어에서도 ‘안에서도… 그렇지 않을 것입니다’로 반복해, 행위의 기준 부재를 강조했습니다.
- source_word: ወቅድስተ፡ ቅዱሳን፡ ያረኵሱ
  english_pob_choice: they will profane the holy of holies
  chosen_korean: 지성소를 더럽힐 것입니다
  alternatives_korean:
  - 지성소를 속되게 할 것입니다
  - 가장 거룩한 곳을 더럽힐 것입니다
  lexicon: 지성소 / 더럽히다
  rationale: 본문의 ‘거룩한 것 중의 거룩한 것’은 한국어 성경 전통의 ‘지성소’가 가장 직접적이므로 이를 택했습니다.
theological_decisions:
- issue: 부패와 더러움이 지성소를 더럽힌다는 종말론적/제의적 이미지
  chosen_reading: 개인의 도덕적 타락이 공동체의 가장 거룩한 영역까지 침범하는 심판적 묘사로 읽었습니다.
  alternative_readings:
  - 단순히 성전을 향한 역사적 훼손 예고로 읽을 수 있습니다
  - 상징적으로 공동체 질서의 붕괴를 가리킬 수 있습니다
  rationale: 문맥상 이 구절은 악인의 탐욕과 기만이 결국 성스러운 영역을 모독하는 데까지 이른다는 경고를 강화합니다.
  doctrine_reference: 성전/성소의 거룩함, 도덕적 타락의 공동체적 파급
- issue: ‘큰 이름’을 만들지만 ‘진리’와 ‘의’가 아니라는 대조
  chosen_reading: 명성 자체는 가능하지만, 그 명성은 참됨과 의로 정당화되지 않는다는 역설로 읽었습니다.
  alternative_readings:
  - 자기 이름을 자랑한다는 뜻으로 더 강하게 읽을 수 있습니다
  - 명사적 과시보다 평판 형성으로 이해할 수 있습니다
  rationale: 원문이 명성의 성취와 그 도덕적 공허를 함께 말하므로, 이름의 크기와 진리/의의 결여를 동시에 살렸습니다.
  doctrine_reference: 명예와 의의 분리, 참된 평가의 기준
