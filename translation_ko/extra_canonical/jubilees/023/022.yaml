  source_fidelity: 첫 절의 원문은 ‘그들의 악함에서 의의 길로 돌이키지 않을 것’을 말하는데, 초안의 ‘불의의 길에서’는 ‘악함’을 하나의 길로 바꾸어 표현합니다. 또한 마지막의 ‘부패한 추악함’은 원문이 말하는 ‘그들의 더러움의 부패’를 넘어 ‘추악함’을 첨가합니다. ‘큰 이름’과 진리·의의 부정은 더 자연스럽고 명료하게 연결할 필요가 있습니다.
  naturalness: ‘자기들에 대해 큰 이름을 만들겠지만’ 및 ‘진리 안에서도 의 안에서도 그렇지 않을 것입니다’는 현대 한국어로 다소 부자연스럽고 선행 내용을 가리키는 방식이 모호합니다. 이를 ‘큰 이름을 떨치겠지만, 그것은 진리나 의에 근거한 것이 아닐 것입니다’로 다듬는 것이 자연스럽습니다.
