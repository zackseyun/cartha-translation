revisions:
- from: 그리고 살아남은 자들은 불의의 길에서 의의 길로 돌아서지 않을 것입니다. 그들 모두는 속임수와 부를 위해 일어나며, 각자 자기 이웃의 모든 것을 차지하려 할 것입니다. 또 그들은 자기들에 대해 큰 이름을 만들겠지만, 진리 안에서도 의 안에서도 그렇지 않을 것입니다. 그리고 그들은 자신들의 더러움과 부패한 추악함으로 지성소를 더럽힐 것입니다.[a][b]
  to: 그리고 살아남은 자들은 자기들의 악함에서 의의 길로 돌이키지 않을 것입니다. 그들 모두는 기만과 부를 위하여 일어날 것이며, 각자 자기 이웃의 모든 것을 빼앗을 것입니다. 그들은 큰 이름을 떨치겠지만, 그것은 진리나 의에 근거한 것이 아닐 것입니다. 또 그들은 자신들의 더러움과 그 더러움의 부패로 지성소를 더럽힐 것입니다.
  rationale: 원문의 악함과 의의 길의 대조를 그대로 보존하고, 이웃의 소유를 탈취하는 의미를 명확히 했습니다. ‘큰 이름’의 획득과 진리·의의 결여를 자연스러운 한국어 문장으로 연결했습니다. 마지막 절에서는 원문에 없는 ‘추악함’을 삭제하고 더러움 및 그 부패라는 병렬을 유지했습니다. 내용 없는 각주 표지도 제거했습니다.
  reviewer_model: gpt-5.6-terra
