  yaml_path: translation/extra_canonical/jubilees/023/020.yaml
  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: ko
  text: 그리고 그들은 다투게 될 것입니다. 이들은 저들과, 젊은 자는 늙은 자와, 늙은 자는 젊은 자와, 가난한 자는 부한 자와, 비천한 자는 높은 자와, 궁핍한 자는 통치자와 율법과 언약을 두고 다투게 될 것입니다. 이는 그들이 계명과 언약과 절기와 달과 안식일과 희년과 정하여진 모든 것을 잊었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትባአሱ
  english_pob_choice: will contend
  chosen_korean: 다투게 될 것입니다
  alternatives_korean:
  - 논쟁하게 될 것입니다
  - 대립하게 될 것입니다
  lexicon: Geez verbal form of contention/strife
  rationale: 문맥상 단순한 의견 차이보다 서로 맞서는 분쟁을 가리키므로, POB의 'contend'에 맞춰 ‘다투다’를 택했습니다.
- source_word: ሕግ
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 규례
  lexicon: law/Torah
  rationale: 언약과 짝을 이루는 종교적·언약적 범주의 ‘법’이므로, 토라를 가리키는 표준어 ‘율법’이 가장 자연스럽습니다.
- source_word: ኪዳን
  english_pob_choice: the covenant
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 맹세
  lexicon: covenant
  rationale: 하나님과의 관계를 전제하는 성서적 covenant이므로, 신학적 관용어인 ‘언약’을 유지했습니다.
- source_word: ወበዓለ፡ ወወርኀ፡ ወሰንበተ፡ ወእዮቤሌወ፡
  english_pob_choice: festival and month and Sabbath and Jubilee
  chosen_korean: 절기와 달과 안식일과 희년
  alternatives_korean:
  - 명절과 달과 안식일과 희년
  - 축제와 달과 안식일과 희년
  lexicon: festival / month / Sabbath / Jubilee
  rationale: POB의 ‘festival’을 따라 ‘절기’로 옮기고, ‘month’는 달력상의 ‘달’, 고정된 성일은 ‘안식일’, 법정 주기는 ‘희년’으로 번역했습니다.
theological_decisions:
- issue: 문장의 반복 구조와 갈등의 방향
  chosen_reading: 서로 맞서는 집단 간의 총체적 사회·종교적 분열로 읽었습니다.
  alternative_readings:
  - 단순한 세대 갈등으로만 좁혀 읽는 방식
  - 계층 갈등만을 강조하는 방식
  rationale: 원문은 젊은/늙은, 가난한/부한, 낮은/큰, 궁핍한/통치자의 병렬을 통해 전면적 혼란을 묘사하므로, 특정 한 축으로 축소하지 않고 그대로 살렸습니다.
  doctrine_reference: 지혜문학적·예언적 경고의 사회적 심판 이미지
