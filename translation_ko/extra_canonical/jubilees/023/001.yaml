  yaml_path: translation/extra_canonical/jubilees/023/001.yaml
  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: ko
  text: 그리고 야곱의 두 손가락을 자신의 눈 위에 놓고, 신들의 하나님을 찬송하고, 자신의 얼굴을 가리고 발을 펴고, 영원의 잠을 잔 뒤 그의 조상들에게로 모였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘영원의 잠’입니다. 죽음을 가리키는 장엄한 표현입니다.
    reason: ወኖመ፡ ንዋመ፡ ዘለዓለም(‘영원의 잠을 잤다’)의 관용적 죽음 묘사를 설명합니다.
  - marker: b
    text: ‘그의 조상들에게로 모였다’는 죽은 이가 조상들과 함께하게 되었음을 나타내는 전통적 관용구입니다.
    reason: ወተጋብአ፡ *ኀበ፡ አበዊሁ의 의미와 소유 관계를 설명합니다.
lexical_decisions:
- source_word: ወአንበረ፡ ክልኤሆን፡ *አጻብዐ፡ ያዕቆብ፡ *ዲበ፡ አዕይንቲሁ፡
  english_pob_choice: he placed Jacob's two fingers upon his eyes
  chosen_korean: 야곱의 두 손가락을 그의 눈 위에 놓고
  alternatives_korean:
  - 야곱의 두 손가락을 그의 눈에 대고
  - 야곱의 두 손가락을 그의 눈 위에 두고
  lexicon: 위에 놓다
  rationale: Geez 원문은 ‘두 손가락’을 ‘그의 눈 위에’ 놓는 동작을 말하므로, 자연스러운 한국어로 ‘놓고’라고 옮겨 동작의 직접성을 살렸습니다.
- source_word: ወባረኮ፡ ለአምላክ፡ አማልክት፡
  english_pob_choice: he blessed the God of gods
  chosen_korean: 신들의 하나님을 찬송하며
  alternatives_korean:
  - 신들의 하나님을 축복하며
  - 신들 중의 하나님을 찬송하며
  lexicon: 찬송하다 / 신들의 하나님
  rationale: 원문의 ‘God of gods’는 단순 호칭보다 최고 신격에 대한 찬양을 나타내므로, 한국어에서는 예배적 뉘앙스를 살린 ‘찬송하며’로 옮겼습니다.
- source_word: ወኖመ፡ ንዋመ፡ ዘለዓለም፡
  english_pob_choice: and slept the sleep of eternity
  chosen_korean: 영원한 잠을 자고
  alternatives_korean:
  - 영원의 잠을 자고
  - 영원한 수면을 하고
  lexicon: 영원한 잠
  rationale: 직역하면 ‘영원의 잠’이지만 한국어에서는 죽음을 완곡하면서도 원문의 지속성을 보존하는 ‘영원한 잠’을 선택했습니다.
- source_word: ወተጋብአ፡ *ኀበ፡ አበዊሁ፡
  english_pob_choice: and was gathered to his fathers
  chosen_korean: 조상들에게로 모였습니다
  alternatives_korean:
  - 조상들에게로 모여졌습니다
  - 그의 조상들에게로 모였습니다
  lexicon: 모이다
  rationale: 수동형의 관용구를 한국어 성서체에 맞게 자연스럽게 풀어, 죽은 뒤 조상들과 합류함을 나타냈습니다.
theological_decisions:
- issue: 죽음 묘사의 표현
  chosen_reading: ‘영원한 잠’과 ‘조상들에게로 모였습니다’를 함께 두어, 생물학적 죽음과 족장 전승의 장례 관용구를 모두 보존했습니다.
  alternative_readings:
  - ‘영원한 잠’만 두기
  - ‘죽었다’로 단순화하기
  rationale: 원문은 단순 사망 통보가 아니라 장엄한 죽음의 묘사와 족장 귀환 관용구를 병치하므로, 둘 다 살려 서술의 무게를 유지했습니다.
  doctrine_reference: 문맥 보존과 관용구 재현
- issue: ‘God of gods’의 신학적 뉘앙스
  chosen_reading: ‘신들의 하나님’을 유지해 최고신 선언의 수사적 강도를 보존했습니다.
  alternative_readings:
  - ‘모든 신 위의 하나님’
  - ‘신들 가운데 하나님’
  rationale: 원문은 신들 가운데 한 분이 아니라 그 위에 계신 하나님을 말하므로, 한국어에서도 위계적 선언이 드러나도록 했습니다.
  doctrine_reference: 수사적 위계와 유일신 고백
