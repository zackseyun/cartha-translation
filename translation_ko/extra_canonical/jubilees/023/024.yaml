  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: ko
  text: 그리고 그는 그들에게 민족들의 죄인들을 일으키실 것입니다. 그들은 그들에게 자비도 동정도 없고, 늙은이에게도 젊은이에게도, 아무에게도 호의를 보이지 않습니다. 이는 그들이 악하고 강하여 모든 사람의 아들들보다 더 악을 행하게 되기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃጥአኒሆሙ
  english_pob_choice: the sinners of the nations
  chosen_korean: 민족들의 죄인들
  alternatives_korean:
  - 열방의 죄인들
  - 나라들의 죄인들
  lexicon: Geez ኃጥአኒ = 죄인들 / 영어 POB nation(s)
  rationale: 게으즈 원문과 영어 POB의 “nations”를 반영해 민족들의 죄인들로 옮겨, 단순히 이방인 전체가 아니라 그들 가운데 죄인들을 가리킨다는 점을 살렸습니다.
- source_word: ምሕረተ፡ ወሣህለ፡
  english_pob_choice: no mercy or compassion
  chosen_korean: 자비도 동정도
  alternatives_korean:
  - 긍휼도 불쌍히 여김도
  - 자비도 연민도
  lexicon: Geez ምሕረት = 자비, ሣህል = 동정/연민
  rationale: 두 개의 병렬 명사를 구별해 한국어에서도 ‘자비’와 ‘동정’을 나란히 두어 무자비함의 총체성을 드러냈습니다.
- source_word: ኢያደልዉ፡ አሰልሂቅ፡ ወኢ*ለወሬዛ፡ ወኢ*ለመኑሂ፡
  english_pob_choice: show no favor to old or young, to no one at all
  chosen_korean: 늙은이에게도 젊은이에게도, 아무에게도 호의를 보이지 않습니다
  alternatives_korean:
  - 노인에게도 젊은이에게도, 누구에게도 은혜를 베풀지 않습니다
  - 노인이나 젊은이에게도, 어떤 이에게도 편들지 않습니다
  lexicon: Geez 어근들에 대한 부정형 병렬
  rationale: 원문의 부정 반복을 살려 ‘~에게도 …에게도, 아무에게도’로 옮겼고, 영어 POB의 favor를 ‘호의’로 대응해 공정하지 않은 편애의 부재를 표현했습니다.
- source_word: እኩያን፡ ወኀያላን፡ ከመ፡ ይእከዩ፡ እምኵሉ፡ ውሉደ፡ ሰብእ
  english_pob_choice: for they are evil and strong, so as to do evil more than all the sons of men
  chosen_korean: 그들이 악하고 강하여 모든 사람의 아들들보다 더 악을 행하게 되기 때문입니다
  alternatives_korean:
  - 그들이 악하고 강하여 모든 사람의 아들들보다 더 악을 행할 수 있기 때문입니다
  - 그들이 악하고 강해서 모든 인간보다 더 악을 저지르기 때문입니다
  lexicon: Geez እኩያን = 악한들, ኀያላን = 강한들
  rationale: ‘강하다’와 ‘악하다’의 병치를 유지하면서, 결과절을 영어 POB의 ‘so as to do evil’에 맞춰 자연스러운 합쇼체 문장으로 구성했습니다.
theological_decisions:
- issue: 대상 민족의 범주
  chosen_reading: ‘민족들의 죄인들’로 옮겨, 심판의 대상이 민족 전체가 아니라 그 가운데 죄인들임을 드러냈습니다.
  alternative_readings:
  - ‘열방의 죄인들’
  - ‘이방의 죄인들’
  rationale: 원문과 영어 POB 모두 집합 전체보다 그 안의 죄인들을 지시하므로, 민족 일반을 단정적으로 악마화하지 않도록 범위를 보존했습니다.
  doctrine_reference: 심판의 공의와 개별 책임
- issue: 무자비함의 범위
  chosen_reading: 자비/동정을 모두 부정하는 이중 표현을 유지했습니다.
  alternative_readings:
  - 자비만 부정
  - 긍휼만 부정
  rationale: 원문의 병렬 부정은 단순한 냉정함이 아니라 전면적인 무자비함을 강조하므로, 두 항을 모두 살려 심판 주체의 잔혹성을 보존했습니다.
  doctrine_reference: 악의 총체성
