  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
  footnotes:
  - marker: a
    text: Or 'from his bed'.
    reason: previous_rendering
  - marker: b
    text: Or 'torches were in their hands'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 품에서 일어나 달려가 자기 어머니 리브가에게 알렸습니다. 밤에 리브가는 이삭에게 가서 그에게 말했고, 그들은 함께 갔으며 야곱도 그들과 함께 갔습니다. 손에는 횃불이 하나 있었습니다. 그들이 가 보니 아브라함은 죽어 누워 있었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሕፅኑ
  english_pob_choice: from his bosom
  chosen_korean: 품에서
  alternatives_korean:
  - 침상에서
  - 가슴에서
  lexicon: geez እም + ሕፅን
  rationale: 게에즈 원문의 ‘품’은 인물과의 밀착된 자세를 가리키며, 직전 문맥의 잠든 상태를 보존하면서도 영어 POB의 최종 판정인 'from his bosom'을 따라 자연스럽게 옮겼습니다.
- source_word: ወሮጸ፡ ወነገራ፡ ለርብቃ፡ እሙ፡
  english_pob_choice: ran and told Rebekah his mother
  chosen_korean: 달려가 자기 어머니 리브가에게 알렸습니다
  alternatives_korean:
  - 달려가서 어머니 리브가에게 말했습니다
  - 달려가서 리브가 그의 어머니에게 알렸습니다
  lexicon: geez ወሮጸ / ወነገራ
  rationale: ‘달려가다’와 ‘알리다’의 동작을 분리해 서술하되, ‘그의 어머니’ 관계를 분명히 하여 서사의 진행을 유지했습니다.
- source_word: ሌሊተ
  english_pob_choice: by night
  chosen_korean: 밤에
  alternatives_korean:
  - 한밤에
  - 야간에
  lexicon: geez ሌሊት
  rationale: 시간 부사로서 단순하고 직설적인 ‘밤에’가 원문의 사건 진행을 가장 잘 전달합니다.
- source_word: ወማኅቶት፡ ውስተ፡ እዴሁ፡
  english_pob_choice: a torch was in his hand
  chosen_korean: 손에는 횃불이 하나 있었습니다
  alternatives_korean:
  - 그의 손에 횃불이 하나 있었습니다
  - 횃불 하나를 손에 들고 있었습니다
  lexicon: geez ማኅቶት / እዴ
  rationale: 게에즈의 단수 표현과 3인칭 단수 소유 접미사를 반영해 단수로 옮겼습니다. 한국어에서는 ‘손에는’이 장면을 가장 간결하게 드러냅니다.
- source_word: እንዘ፡ ይስክብ፡ በድኖ
  english_pob_choice: lying dead
  chosen_korean: 죽어 누워 있었습니다
  alternatives_korean:
  - 죽은 채 누워 있었습니다
  - 시신으로 누워 있었습니다
  lexicon: geez በድን
  rationale: ‘죽다’와 ‘누워 있다’를 함께 살려, 단순한 사망 통보가 아니라 시신의 상태를 묘사하는 원문의 뉘앙스를 보존했습니다.
theological_decisions:
- issue: 야곱과 함께한 장면의 서술 register
  chosen_reading: 서술문 전체를 현대 합쇼체로 유지하되, 인물 행위의 연쇄를 끊지 않고 한 장면처럼 제시했습니다.
  alternative_readings:
  - 문장별로 더 강하게 끊어 번역하기
  - ‘알렸습니다’ 대신 ‘전했습니다’로 완화하기
  rationale: 이 절은 사건 진행의 속도와 긴박함이 핵심이므로, 원문에 있는 연속 동사를 유지하는 쪽이 서사의 힘을 살립니다.
  doctrine_reference: narrative fidelity
- issue: ‘품’의 해석
  chosen_reading: ‘품에서’로 옮겨 직전 문맥의 수면 장면과 연결했습니다.
  alternative_readings:
  - ‘침상에서’로 일반화하기
  - ‘가슴에서’로 직역하기
  rationale: 이 절의 게에즈 표현은 단순한 침상보다 인물의 품/품안에 가까운 구체성을 가지므로, 문맥 연결을 해치지 않는 범위에서 직접성을 살렸습니다.
  doctrine_reference: source-language specificity
