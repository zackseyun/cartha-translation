- from: 그가 품에서 일어나 달려가 자기 어머니 리브가에게 알렸습니다. 밤에 리브가는 이삭에게 가서 그에게 말했고, 그들은 함께 갔으며 야곱도 그들과 함께 갔습니다. 손에는 횃불이 하나 있었습니다. 그들이 가 보니 아브라함은 죽어 누워 있었습니다.[a][b]
  to: 그가 품에서 일어나 달려가 자기 어머니 리브가에게 알렸습니다. 밤에 리브가는 이삭에게 가서 그에게 말했고, 그들은 함께 갔으며 야곱도 그들과 함께 갔습니다. 그의 손에는 횃불 하나가 있었습니다. 그들이 가서 보니 아브라함은 죽어 누워 있었습니다.
