  source_fidelity: 핵심 어휘인 እምሕፅኑ를 ‘품에서’로, 단수 횃불과 남성 단수 소유 표현을 유지한 점, 그리고 아브라함이 죽은 채 누워 있는 상태를 옮긴 점은 게에즈 원문 및 영어 POB의 최종 감사 이력에 충실합니다. 다만 ‘손에는’은 원문의 소유·지시 대상이 한국어에서 불분명해지므로 ‘그의 손에는’으로 밝혀 주는 편이 낫습니다.
  naturalness: 전반적으로 현대 표준어 합쇼체에 맞고 자연스럽습니다. ‘그들이 가 보니’도 자연스럽지만, 원문의 ‘가서 발견하였다’라는 연결을 더 직접적으로 반영하도록 ‘그들이 가서 보니’로 다듬을 수 있습니다.
  terminology: 리브가, 이삭, 야곱, 아브라함 및 ‘품’, ‘횃불’의 선택은 적절합니다. 원문의 단수 횃불을 복수로 바꾸지 않아야 합니다.
