  - 그들이 내뱉는 말
  lexicon: speech
  rationale: 직역에 가까운 표현을 유지해, 죄의 항목 가운데 ‘입의 말’이 별도로 열거된 구조를 보존했습니다.
- source_word: ወአልቦ፡ ተኃኅቶ፡ የማነ፡ ወፀጋመ።
  english_pob_choice: without turning aside to the right hand or to the left
  chosen_korean: 오른쪽이나 왼쪽으로 치우치지 말아야 한다는 것이었습니다
  alternatives_korean:
  - 오른쪽이나 왼쪽으로 빗나가지 말아야 한다는 것이었습니다
  - 좌우로 벗어나지 말아야 한다는 것이었습니다
  lexicon: right or left
  rationale: 관용구의 의미를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘치우치다’로 옮겼습니다.
theological_decisions:
- issue: 언약의 주어와 관계 표현
  chosen_reading: ‘주께서 그들과 자기 사이에 세워 주신 언약’으로 옮겨, 언약의 수여자가 하나님이시고 언약 관계의 당사자가 ‘그들과 자기’임을 분명히 했습니다.
  alternative_readings:
  - ‘주께서 그들과 맺으신 언약’
  - ‘주께서 그들 사이에 세우신 언약’
  rationale: 원문은 하나님이 언약을 세우셨고 그들 사이에 관계를 설정하셨다는 점을 함께 말하므로, 관계성을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 언약신학 / 신적-인간적 계약 관계
