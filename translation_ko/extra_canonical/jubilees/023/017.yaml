  - 모욕할 것입니다
  lexicon: reproach
  rationale: 문맥상 단순한 감정표현이 아니라 윗세대의 잘못을 책망하는 의미이므로 ‘꾸짖다’가 가장 직접적입니다.
- source_word: ነባበ፡ አፉሆሙ
  english_pob_choice: the speech of their mouth
  chosen_korean: 그들의 입의 말
  alternatives_korean:
  - 그들의 입에서 나온 말
