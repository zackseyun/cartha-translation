  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
  footnotes:
  - marker: a
    text: Or 'sons'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 세대에는 자녀들이 죄와 불의와 그들의 입의 말과 그들이 행하는 큰 악들 때문에, 또 주께서 그들과 자기 사이에 세워 주신 언약을 그들이 버렸기 때문에 자기 아버지들과 자기 장로들을 꾸짖을 것입니다. 그 언약은 그들이 그의 모든 계명과 그의 규례와 그의 모든 율법을 지키고 행하며, 오른쪽이나 왼쪽으로 치우치지 말아야 한다는 것이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቅ
  english_pob_choice: children
  chosen_korean: 자녀들
  alternatives_korean:
  - 아이들
  - 자식들
  - 아들들
  lexicon: children
  rationale: Geez ደቂቅ은 이 절에서 ‘아들들’보다 포괄적인 ‘자녀들’이 더 자연스럽고, 아버지들과 장로들과의 대조도 분명하게 살립니다.
- source_word: ይዘልፉ
  english_pob_choice: reproach
  chosen_korean: 꾸짖을 것입니다
  alternatives_korean:
  - 비난할 것입니다
  - 책망할 것입니다
  - 모욕할 것입니다
  lexicon: reproach
  rationale: 문맥상 단순한 감정표현이 아니라 윗세대의 잘못을 책망하는 의미이므로 ‘꾸짖다’가 가장 직접적입니다.
- source_word: ነባበ፡ አፉሆሙ
  english_pob_choice: the speech of their mouth
  chosen_korean: 그들의 입의 말
  alternatives_korean:
  - 그들의 입에서 나온 말
  - 그들의 입술의 말
  - 그들이 내뱉는 말
  lexicon: speech
  rationale: 직역에 가까운 표현을 유지해, 죄의 항목 가운데 ‘입의 말’이 별도로 열거된 구조를 보존했습니다.
- source_word: ወአልቦ፡ ተኃኅቶ፡ የማነ፡ ወፀጋመ።
  english_pob_choice: without turning aside to the right hand or to the left
  chosen_korean: 오른쪽이나 왼쪽으로 치우치지 말아야 한다는 것이었습니다
  alternatives_korean:
  - 오른쪽이나 왼쪽으로 빗나가지 말아야 한다는 것이었습니다
  - 좌우로 벗어나지 말아야 한다는 것이었습니다
  lexicon: right or left
  rationale: 관용구의 의미를 살리되 현대 한국어에서 자연스럽게 읽히도록 ‘치우치다’로 옮겼습니다.
theological_decisions:
- issue: 언약의 주어와 관계 표현
  chosen_reading: ‘주께서 그들과 자기 사이에 세워 주신 언약’으로 옮겨, 언약의 수여자가 하나님이시고 언약 관계의 당사자가 ‘그들과 자기’임을 분명히 했습니다.
  alternative_readings:
  - ‘주께서 그들과 맺으신 언약’
  - ‘주께서 그들 사이에 세우신 언약’
  rationale: 원문은 하나님이 언약을 세우셨고 그들 사이에 관계를 설정하셨다는 점을 함께 말하므로, 관계성을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 언약신학 / 신적-인간적 계약 관계
