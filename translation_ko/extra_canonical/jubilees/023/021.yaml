  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
  footnotes:
  - marker: a
    text: Or 'to drive them from the way'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 활과 칼과 살육으로 일어나 그들을 길로 되돌려 놓을 것이며, 땅 위에 많은 피가 쏟아질 때까지는 돌아서지 않을 것입니다. 이것들은 저것들로 말미암아 그렇게 될 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቀውሙ
  english_pob_choice: will rise up
  chosen_korean: 일어나
  alternatives_korean:
  - 서다
  - 일어서다
  lexicon: Ge'ez verbal form of rising/standing up in hostile action context
  rationale: 문맥상 단순한 ‘서다’보다 공격적 행동을 시작하는 ‘일어나’가 영어 POB의 ‘rise up’과 원문의 움직임을 더 잘 반영합니다.
- source_word: በቀስት፡ ወበአስይፍት፡ ወበቅትል
  english_pob_choice: with bow and with swords and with slaughter
  chosen_korean: 활과 칼과 살육으로
  alternatives_korean:
  - 활과 칼과 도륙으로
  - 활과 칼과 죽임으로
  lexicon: instrumental/means phrase plus noun of killing
  rationale: 세 요소를 병렬로 살려 도구와 수단을 함께 나타냈고, 마지막 항목은 단순한 ‘죽임’보다 전쟁적 잔혹성을 드러내는 ‘살육’이 원문의 강도를 더 가깝게 전합니다.
- source_word: ከመ፡ ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  english_pob_choice: to turn them back to the way
  chosen_korean: 그들을 길로 되돌려 놓을 것이며
  alternatives_korean:
  - 그들을 길로 돌이키게 할 것이며
  - 그들을 길에서 돌려세울 것이며
  lexicon: causative motion back into the way/path
  rationale: 주어진 주석처럼 ‘from the way’가 아니라 ‘to the way’이므로, 목표 지점인 ‘길’로 다시 돌려놓는 뜻을 살려 번역했습니다.
- source_word: እስከ፡ ይትከዐው፡ ደም፡ ብዙኅ፡ ዲበ፡ ምድር
  english_pob_choice: until much blood is poured out on the earth
  chosen_korean: 땅 위에 많은 피가 쏟아질 때까지
  alternatives_korean:
  - 땅에 많은 피가 흘릴 때까지
  - 땅 위에 피가 많이 쏟아질 때까지
  lexicon: idiom of bloodshed on the earth
  rationale: 수동 표현과 장소 표현을 자연스럽게 옮기되, 피 흘림의 대량성을 ‘많은 피’로 보존했습니다.
theological_decisions:
- issue: 마지막 reciprocal phrase 'እሉ፡ በእሉ።'의 의미
  chosen_reading: 이것들은 저것들로 말미암아 그렇게 될 것입니다.
  alternative_readings:
  - 이것들은 저것들에 의하여 그러할 것입니다
  - 이것들은 저것들로 인해 그렇게 될 것입니다
  rationale: 원문의 상호지시적 표현을 직역에 가깝게 살려, 어느 한쪽만을 규정하지 않고 ‘이것들은 저것들로 말미암아’라는 상호적 인과를 드러냈습니다.
  doctrine_reference: 문맥상 종말론적 폭력의 상호성에 대한 서술이며 별도의 교리화는 하지 않습니다.
