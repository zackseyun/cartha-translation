- from: 그가 그에게 입맞추고 축복하며 말했습니다. 「야곱아, 내 사랑하는 아들아, 내 영이 사랑하는 자야, 야훼께서 하늘의 창공 위에서 너를 복 주시고, 아담과 에녹과 노아와 셈에게 복 주신 모든 복을 너에게 주시며, 그가 내게 말씀하신 것과 내게 주겠다고 말씀하신 모든 것을 너와 너의 씨 위에 영원히 머물게 하시기를 바랍니다. 곧 하늘이 땅 위에 있는 날들과 같이 말입니다. 또 마스테마의 영들이 너와 너의 씨에게 닥치지 않아서 너를 야훼를 따라가는 데서 떠나게 하지 못하게 하시기를 바랍니다. 야훼, 곧 너의 하나님이 이제부터 영원히 너의 하나님이 되시기를 바랍니다. 그리고 주 하나님께서 너에게 아버지가 되시고, 너는 그의 맏아들이 되며, 백성에게는 언제나 그러하기를 바랍니다. 내 아들아, 평안히 가십시오.」 그리고 그 두 사람은 아브라함에게서 함께 나왔습니다. 그리고 리브가가 온 마음과 온 영혼으로 야곱을 사랑했으니, 에서보다 훨씬 더 그를 사랑했으며, 이삭은 야곱보다 에서를 훨씬 더 사랑했습니다.[a][b][c]
