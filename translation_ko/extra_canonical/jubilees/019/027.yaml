  rationale: 원문의 기원문 연쇄와 호칭을 유지하면서, ‘너의 하나님이신 주’가 ‘따르는 데서’의 수식어임을 회복했습니다. ‘궁창 위에 계신 하나님’으로 ‘God from above the firmament’의 우주론적 표현을 보존했고, 원문의 모호하고 압축된 ‘백성에게’ 병렬은 앞선 ‘아버지’ 술어를 보충하여 한국어 문장으로 명료화했습니다. 불일치하는 기존 각주 표지는 삭제했습니다.
