translation:
  language: ko
  text: 그가 그에게 입맞추고 축복하며 말했습니다. 「야곱아, 내 사랑하는 아들아, 내 영이 사랑하는 자야, 야훼께서 하늘의 창공 위에서 너를 복 주시고, 아담과 에녹과 노아와 셈에게 복 주신 모든 복을 너에게 주시며, 그가 내게 말씀하신 것과 내게 주겠다고 말씀하신 모든 것을 너와 너의 씨 위에 영원히 머물게 하시기를 바랍니다. 곧 하늘이 땅 위에 있는 날들과 같이 말입니다. 또 마스테마의 영들이 너와 너의 씨에게 닥치지 않아서 너를 야훼를 따라가는 데서 떠나게 하지 못하게 하시기를 바랍니다. 야훼, 곧 너의 하나님이 이제부터 영원히 너의 하나님이 되시기를 바랍니다. 그리고 주 하나님께서 너에게 아버지가 되시고, 너는 그의 맏아들이 되며, 백성에게는 언제나 그러하기를 바랍니다. 내 아들아, 평안히 가십시오.」 그리고 그 두 사람은 아브라함에게서 함께 나왔습니다. 그리고 리브가가 온 마음과 온 영혼으로 야곱을 사랑했으니, 에서보다 훨씬 더 그를 사랑했으며, 이삭은 야곱보다 에서를 훨씬 더 사랑했습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ እመልዕልተ፡ ምጽናዓት፡
  english_pob_choice: God from above the firmament
  chosen_korean: 하늘의 창공 위에서
  alternatives_korean:
  - 궁창 위에서
  - 궁창 너머에서
  - 하늘 위에서
  lexicon: 하나님
  rationale: 완화된 ‘지극히 높으신 하나님’보다, 주석된 영어와 게에즈의 직역 구조를 따라 우주론적 표현인 ‘하늘의 창공 위에서’를 살렸습니다.
- source_word: ኵሎን፡ በረከታተ፡
  english_pob_choice: all the blessings
  chosen_korean: 모든 복
  alternatives_korean:
  - 온갖 복
  - 모든 축복
  lexicon: 복
  rationale: 기복적 뉘앙스를 피하면서도 원문의 단순한 복의 총체성을 자연스럽게 옮겼습니다.
- source_word: መናፍስተ፡ መስቴማ፡
  english_pob_choice: the spirits of Mastema
  chosen_korean: 마스테마의 영들
  alternatives_korean:
  - 마스테마의 귀신들
  - 마스테마의 악령들
  lexicon: 영
  rationale: 고유명사 ‘마스테마’를 유지하고, 원문이 특정한 복수의 영적 존재를 가리키므로 ‘영들’로 옮겼습니다.
- source_word: እምድኅረ፡ እግዚአብሔር፡
  english_pob_choice: following the LORD
  chosen_korean: 야훼를 따라가는 데서
  alternatives_korean:
  - 야훼를 따르지 않도록
  - 야훼에게서 멀어지도록
  lexicon: 야훼
  rationale: ‘뒤를 좇다’의 공간적/제자도적 이미지를 살리기 위해 ‘따라가는 데서’로 풀었고, 여기서는 본문이 야훼를 가리키므로 주석적 전통에 따라 ‘야훼’를 사용했습니다.
- source_word: ወይኩንከ፡ እግዚአብሔር፡ አምላከ፡ አበ፡
  english_pob_choice: may the Lord God be a father to you
  chosen_korean: 주 하나님께서 너에게 아버지가 되시고
  alternatives_korean:
  - 주 하나님이 너의 아버지가 되시고
  - 주께서 하나님 아버지가 되시고
  lexicon: 하나님
  rationale: 게에즈의 ‘주 하나님’(Lord God)을 그대로 반영하되, 한국어에서는 자연스러운 서술형으로 다듬었습니다.
- source_word: ወአንተ'ሂ፡ ወልደ፡ በኵረ፡
  english_pob_choice: and you be his firstborn son
  chosen_korean: 너는 그의 맏아들이 되며
  alternatives_korean:
  - 너는 그의 처음 난 아들이 되며
  - 너는 그의 첫째 아들이 되며
  lexicon: 맏아들
  rationale: ‘맏아들’이 출생 순서와 지위의 둘 다를 가장 간결하게 전달합니다.
theological_decisions:
- issue: 야훼/주 하나님의 구분
  chosen_reading: 본문의 결론부는 ‘야훼, 곧 너의 하나님’과 ‘주 하나님’을 구분해 옮겼습니다.
  alternative_readings:
  - ‘여호와 하나님’으로 통일
  - ‘주님’으로만 통일
  rationale: 게에즈 원문이 동일 문맥 안에서 호칭을 병렬적으로 사용하므로, 한국어에서도 관계의 뉘앙스를 유지하기 위해 분리해 표기했습니다.
  doctrine_reference: 본문 수사와 호칭 일관성
- issue: 마스테마의 영들의 작용
  chosen_reading: ‘닥치지 않아서… 떠나게 하지 못하게’로 옮겨, 영적 영향이 외부에서 덮쳐 오는 이미지를 살렸습니다.
  alternative_readings:
  - ‘다스리지 못하게’
  - ‘지배하지 못하게’
  rationale: 영들이 단순한 통치자가 아니라 야곱과 그 씨를 ‘야훼를 따라가는 데서’ 돌이키게 하려는 공격적 존재로 묘사되므로, 지배어보다 도래/침투 이미지를 우선했습니다.
  doctrine_reference: 영적 존재와 유혹의 서술
