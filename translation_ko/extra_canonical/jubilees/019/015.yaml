base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/015.yaml
  text: And all his deeds were fierce. And Abraham loved Jacob, but Isaac loved Esau. And Abraham saw the deeds of Esau, and he knew that in Jacob his name and seed would be called. And he called Rebekah and commanded her concerning Jacob, because he knew that she loved Jacob much more.
translation:
  language: ko
  text: 그리고 에서가 한 모든 일은 사나웠습니다. 아브라함은 야곱을 사랑했고, 이삭은 에서를 사랑했습니다. 아브라함은 에서가 한 일들을 보고, 야곱을 통하여 자신의 이름과 후손이 불리게 될 것을 알았습니다. 그래서 그는 리브가를 불러 야곱에 관하여 그에게 명령하셨습니다. 그가 리브가가 야곱을 더욱 사랑한다는 것을 알고 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብሩ
  english_pob_choice: all his deeds were fierce
  chosen_korean: 그의 모든 행위는 거칠었습니다
  alternatives_korean:
  - 그의 모든 일은 사나웠습니다
  - 그의 모든 행위는 맹렬했습니다
  lexicon: N/A
  rationale: Geez ግብር는 여기서 ‘행위/일’의 뜻이며, POB의 fierce를 살려 ‘거칠었습니다’로 옮겨 그의 삶의 성향이 강하고 난폭했음을 드러냈습니다.
- source_word: ወያፈቅሮ
  english_pob_choice: loved
  chosen_korean: 사랑했고
  alternatives_korean:
  - 좋아했고
  - 애정했고
  lexicon: N/A
  rationale: 아브라함과 이삭의 자녀에 대한 애정을 나타내므로, POB의 loved를 가장 सीधे하게 반영하는 ‘사랑하다’를 사용했습니다.
- source_word: ይጼዋዕ ሎቱ ስም ወዘርእ
  english_pob_choice: his name and seed would be called
  chosen_korean: 자기의 이름과 씨가 불리게 될 것을
  alternatives_korean:
  - 그의 이름과 후손이 불리게 될 것을
  - 자기 이름과 자손이 불리게 될 것을
  lexicon: N/A
  rationale: ‘이름과 씨’는 직역적이지만, 여기서는 야곱을 통해 계보가 이어질 것을 뜻하므로 ‘불리게 될 것’을 유지해 source의 예언적 표현을 살렸습니다.
- source_word: አዘዘ
  english_pob_choice: commanded her concerning Jacob
  chosen_korean: 야곱에 관해 명령했는데
  alternatives_korean:
  - 야곱에 관해 지시했는데
  - 야곱을 두고 명령했는데
  lexicon: N/A
  rationale: 히브리적 서술에서의 አዘዘ는 단순 요청보다 강한 ‘명령’이 적합하며, 리브가를 향한 직접 목적을 문맥상 자연스럽게 풀었습니다.
theological_decisions:
- issue: 아브라함이 야곱을 사랑한 이유의 진술 방식
  chosen_reading: 야곱 안에서 자기의 이름과 씨가 불리게 될 것을 알았습니다
  alternative_readings:
  - 야곱에게서 자기 이름과 씨가 불리게 될 것을 알았습니다
  - 야곱에게서 자기 이름과 후손이 불리게 될 것을 알았습니다
  rationale: 원문과 POB는 아브라함이 언약 계보의 계승을 분별했음을 말하므로, ‘안에서’로 인물 자체가 언약의 매개가 됨을 유지했습니다.
  doctrine_reference: 족장 서사의 언약 계보 이해
