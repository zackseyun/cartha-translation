revisions:
- from: 그리고 그의 모든 행위는 거칠었습니다. 아브라함은 야곱을 사랑했고, 이삭은 에서를 사랑했습니다. 아브라함은 에서의 행위를 보고, 야곱 안에서 자기의 이름과 씨가 불리게 될 것을 알았습니다. 그래서 그는 리브가를 불러 야곱에 관해 명령했는데, 그가 리브가가 야곱을 훨씬 더 사랑한다는 것을 알고 있었기 때문입니다.[a]
  to: 그리고 에서가 한 모든 일은 사나웠습니다. 아브라함은 야곱을 사랑했고, 이삭은 에서를 사랑했습니다. 아브라함은 에서가 한 일들을 보고, 야곱을 통하여 자신의 이름과 후손이 불리게 될 것을 알았습니다. 그래서 그는 리브가를 불러 야곱에 관하여 그에게 명령하셨습니다. 그가 리브가가 야곱을 더욱 사랑한다는 것을 알고 있었기 때문입니다.
  rationale: The revision retains all clauses and their causal relation while resolving an opaque literalism, clarifying the referents required by Korean syntax, and removing an unprovided footnote marker. It does not specify what Abraham commanded or expand the implied comparison in Rebekah's greater love.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:24:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the sequence of statements and the contrast between Abraham's love for Jacob and Isaac's love for Esau. However, ‘야곱 안에서 자기의 이름과 씨가 불리게’ is overly literal and unnatural in Korean; ‘야곱을 통하여 자신의 이름과 후손이 불리게’ communicates the source/English idiom without adding doctrinal interpretation. The initial pronoun is also best made explicit as Esau in Korean for a self-contained verse.
  naturalness: The formal-polite register is consistent. Recasting the impersonal and awkward ‘야곱에 관해 명령했는데’ as ‘야곱에 관하여 그에게 명령하셨습니다’ makes clear that Rebekah is the recipient of Abraham's command. ‘더욱 사랑한다’ is more idiomatic than ‘훨씬 더 사랑한다’ where the comparator remains implicit.
  terminology: Use conventional biblical Korean names ‘에서,’ ‘야곱,’ and ‘리브가.’ ‘후손’ is natural Korean for ‘seed’ in this genealogical context, while preserving the referential sense. ‘사나웠습니다’ retains the force of ‘fierce’ for Esau's deeds.
  issues:
  - severity: medium
    issue: ‘야곱 안에서 자기의 이름과 씨가 불리게’ is syntactically and idiomatically unnatural Korean.
    rationale: The source and English retain a Semitic idiom concerning name and seed being called in/through Jacob. Korean requires a natural mediating expression; ‘야곱을 통하여’ preserves the intended genealogical relationship without overinterpreting it.
  - severity: low
    issue: The opening ‘그의’ has no explicit antecedent within the Korean verse, and the draft contains an unsupported [a] marker.
    rationale: Making Esau explicit improves self-contained readability. No footnote content or disputed textual issue has been supplied that would justify retaining the marker.
  - severity: low
    issue: ‘야곱에 관해 명령했는데’ does not clearly identify Rebekah as the person commanded.
    rationale: The source states that Abraham called Rebekah and commanded her concerning Jacob. Adding ‘그에게’ supplies this grammatical relation naturally.
  revised_text: 그리고 에서가 한 모든 일은 사나웠습니다. 아브라함은 야곱을 사랑했고, 이삭은 에서를 사랑했습니다. 아브라함은 에서가 한 일들을 보고, 야곱을 통하여 자신의 이름과 후손이 불리게 될 것을 알았습니다. 그래서 그는 리브가를 불러 야곱에 관하여 그에게 명령하셨습니다. 그가 리브가가 야곱을 더욱 사랑한다는 것을 알고 있었기 때문입니다.
