  lexicon: 거주하다
  rationale: 문맥상 일시적 체류보다 정착에 가까운 지속적 거주를 나타내므로, 문어체이면서도 자연한 ‘머물렀습니다’로 옮겼습니다.
theological_decisions:
- issue: Jubilees의 계산 단위인 ‘주간의 해’ 보존
  chosen_reading: 달력·연대기 용어로서 ‘주간의 해’를 그대로 드러냈습니다.
  alternative_readings:
  - ‘일곱 해’로 의미만 풀어쓰기
  - ‘7년’으로 현대화
  rationale: 이 구절은 단순한 기간 정보가 아니라 희년서의 시간 구조를 전제로 하므로, 용어의 특수성을 보존하는 것이 본문 이해에 더 충실합니다.
  doctrine_reference: 희년서의 연대기적·묵시적 시간 개념
