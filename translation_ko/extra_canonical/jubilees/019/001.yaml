  - 일곱 해
  - 한 주의 해
  lexicon: 주간
  rationale: 주기적 칠년 단위를 가리키는 주제어를 유지하기 위해 ‘주간의 해’로 옮겨, 단순히 ‘일곱 해’로 풀어쓴 의미 약화를 피했습니다.
- source_word: ወኀደረ
