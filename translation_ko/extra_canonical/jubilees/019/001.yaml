  text: 그리고 쉰여덟째 희년의 첫째 주의 첫해에 아브라함은 돌아와 헤브론 맞은편, 곧 기럇아르바에 또 한 주간의 해 동안 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፶ወ፰
  english_pob_choice: fifty-eighth jubilee
  chosen_korean: 쉰여덟째 희년
  alternatives_korean:
  - 마흔여덟째 희년
  - 쉰여덟 번째 희년
  lexicon: 희년
  rationale: 제공된 게에즈 수사 ፶ወ፰는 50+8이므로 ‘쉰여덟째’가 맞으며, POB의 수정 이력도 이를 지지합니다.
- source_word: አንጻረ
