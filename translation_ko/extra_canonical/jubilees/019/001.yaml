  lexicon: 맞은편
  rationale: 게에즈 አንጻረ는 단순한 근접이 아니라 ‘맞은편/마주한’의 공간 관계를 가리켜, 그 의미를 살렸습니다.
- source_word: ሱባዔ፡ ዓመት
