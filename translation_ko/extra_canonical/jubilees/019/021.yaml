  text: For a blessing on the earth from now and throughout all the generations of the earth. Let your hands be strong, and let your heart rejoice in your son Jacob, because I have loved him far more than all of them.
translation:
  language: ko
  text: 이는 이제부터 그리고 땅의 모든 세대에 걸쳐 땅 위의 복이 되게 하려는 것입니다. 당신의 손은 강건해지고, 당신의 마음은 당신의 아들 야곱으로 말미암아 기뻐하십시오. 내가 그를 그들 모두보다 훨씬 더 사랑했기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበረከት፡ ዲበ፡ ምድር፡ እምይእዜ፡ ወእስከ፡ ኵሉ፡ *ትውልደ፡ ምድር።
  english_pob_choice: For a blessing on the earth from now and throughout all the generations of the earth.
  chosen_korean: 이는 이제부터 그리고 땅의 모든 세대에 걸쳐 땅 위의 복이 되게 하려는 것입니다.
  alternatives_korean:
  - 땅 위에 복이 되게 하려는 것입니다
  - 이제부터 땅의 모든 세대 동안 복이 되게 하려는 것입니다
  lexicon: source_note
  rationale: 원문의 시작 절을 생략하지 않고, ‘복’과 ‘땅’의 반복을 살리되 한국어에서는 ‘땅 위의 복’으로 자연스럽게 압축했습니다.
- source_word: ይጽንዓ፡²⁴ እደዊኪ፡
  english_pob_choice: Let your hands be strong
  chosen_korean: 당신의 손은 강건해지고
  alternatives_korean:
  - 당신의 손이 강해지게 하십시오
  - 당신의 손을 굳세게 하십시오
  lexicon: source_note
  rationale: 직역의 명령형보다 축복적 선언에 맞게 ‘강건해지고’로 옮겨, 손의 힘이 견고해지는 뜻을 살렸습니다.
- source_word: ወ*ትትፈሣሕ፡²⁵ ልብኪ፡²⁶
  english_pob_choice: and let your heart rejoice
  chosen_korean: 당신의 마음은 … 기뻐하십시오
  alternatives_korean:
  - 당신의 마음이 즐거워지게 하십시오
  - 당신의 마음은 즐거워할 것입니다
  lexicon: source_note
  rationale: 원문의 감정 동사를 자연스럽게 살려 ‘기뻐하십시오’로 번역했습니다.
- source_word: በወልድኪ፡ ያዕቆብ፡
  english_pob_choice: in your son Jacob
  chosen_korean: 당신의 아들 야곱으로 말미암아
  alternatives_korean:
  - 당신의 아들 야곱 안에서
  - 당신의 아들 야곱 때문에
  lexicon: source_note
  rationale: ‘ἐν’류 관계가 아니라 자녀를 매개로 한 기쁨의 원인을 나타내므로 한국어에서는 ‘으로 말미암아’가 가장 자연스럽습니다.
- source_word: እስመ፡ ኪያሁ፡ አፍቀርኩ፡ ፈድፋደ፡ እምኵሎሙ፡
  english_pob_choice: because I have loved him far more than all of them.
  chosen_korean: 내가 그를 그들 모두보다 훨씬 더 사랑했기 때문입니다.
  alternatives_korean:
  - 내가 그를 그들 모두보다 더욱 사랑했기 때문입니다
  - 내가 그를 모든 사람보다 더 사랑했기 때문입니다
  lexicon: source_note
  rationale: 비교급의 강도를 살리기 위해 ‘훨씬 더’로 옮겼고, ‘그들 모두’는 원문의 비교 대상 집합을 보존합니다.
theological_decisions:
- issue: 축복 선언의 문장 형식
  chosen_reading: 본문은 단순 미래 예언이 아니라 축복을 선언하는 형식으로 읽었습니다.
  alternative_readings:
  - 서술적 미래 진술로만 읽을 수 있습니다
  - 부탁/명령형으로도 볼 수 있습니다
  rationale: 원문 첫 절의 ‘For a blessing’는 결과 목적을 넘어 축복문 전체의 성격을 규정하므로, 한국어에서도 선언적 축복의 어조를 유지했습니다.
  doctrine_reference: 문맥적 장르 판단
- issue: 직접화법의 화자-수신자 관계
  chosen_reading: 화자는 이삭의 축복/예언적 خطاب로서 야곱의 어머니가 아닌 수신자를 향한 직접 축복을 합니다.
  alternative_readings:
  - 일반 서술로 평면화할 수 있습니다
  rationale: 원문 2인칭 소유격과 명령적/소원적 동사가 이어지므로, 한국어에서도 직접 축복의 대상을 분명히 드러내는 것이 필요합니다.
  doctrine_reference: 문맥적 화행
