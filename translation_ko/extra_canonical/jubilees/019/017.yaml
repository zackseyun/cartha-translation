translation:
  language: ko
  text: 에서보다 더하였습니다. 그리고 그가 그에게 말했습니다. 「내 딸아, 내 아들 야곱을 지키십시오. 그는 땅 위에서 나를 대신할 것이며, 사람들 가운데에서 복이 될 것이며, 셈의 모든 자손을 위할 것입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤላ
  english_pob_choice: And he said to her
  chosen_korean: 그가 그녀에게 말했습니다
  alternatives_korean:
  - 그가 그녀에게 이르렀습니다
  - 그가 그녀에게 말하였습니다
  lexicon: Ge'ez narrative verb
  rationale: 서사적 발화 동사를 자연스러운 현대 합쇼체로 옮기되, 추가적인 의미를 덧붙이지 않기 위해 가장 평이한 ‘말했습니다’를 택했습니다.
- source_word: ወለቲየ፡ ዐቀቢ፡ *ወልድየ፡ ያዕቆብሃ
  english_pob_choice: My daughter, keep my son Jacob
  chosen_korean: 내 딸아, 내 아들 야곱을 지키십시오
  alternatives_korean:
  - 내 딸아, 내 아들 야곱을 간직하십시오
  - 내 딸아, 내 아들 야곱을 보존하십시오
  lexicon: imperative / care-keeping vocabulary
  rationale: 문맥상 단순 소유가 아니라 보호하고 맡아 두라는 뜻이므로 ‘지키십시오’로 옮겼습니다. 직접 호칭 ‘내 딸아’는 원문의 친밀한 부름을 드러냅니다.
- source_word: ይከውን፡ ህየንቴየ፡ ዲበ፡ ምድር፡
  english_pob_choice: he will be in my place on the earth
  chosen_korean: 그는 땅에서 내 자리를 대신할 것이며
  alternatives_korean:
  - 그는 땅에서 내 대신이 될 것이며
  - 그는 땅 위에서 나의 자리에 있을 것이며
  lexicon: substitution / representation
  rationale: ‘내 자리를 대신하다’는 표현이 원문의 대리·대표 의미를 가장 직접적으로 반영합니다. ‘땅에서’는 지상에서의 존재 범위를 분명히 합니다.
- source_word: ወለበረከት፡ በማእከለ፡ ውሉደ፡ ሰብእ፡
  english_pob_choice: and for a blessing in the midst of the sons of men
  chosen_korean: 사람들 가운데에서 복이 될 것이며
  alternatives_korean:
  - 사람들 가운데에서 복이 될 것이며
  - 사람들 한가운데서 복이 될 것이며
  lexicon: blessing phrase
  rationale: ‘복’은 결과 상태를, ‘사람들 가운데에서’는 공동체 한가운데라는 범위를 자연스럽게 살립니다. 원문의 목적격/서술적 뉘앙스를 문맥에 맞게 풀어 옮겼습니다.
- source_word: ወለኵሉ፡ ዘርኡ¹³ ሴም
  english_pob_choice: and for all the seed of Shem
  chosen_korean: 셈의 모든 자손을 위할 것입니다
  alternatives_korean:
  - 셈의 모든 자손을 위할 것입니다
  - 셈의 모든 씨를 위한 것이며
  lexicon: seed / descendants
  rationale: ‘씨’는 직역이지만 한국어에서는 불필요하게 낯설 수 있어, 혈통적 후손을 뜻하는 문맥에 맞게 ‘자손’으로 옮겼습니다.
theological_decisions:
- issue: English audit trail’s prior 'glory' wording was removed after source review
  chosen_reading: 최종 본문에는 ‘영광’이 아니라 단순한 ‘셈의 모든 자손’을 반영했습니다.
  alternative_readings:
  - ‘셈의 모든 자손의 영광을 위할 것입니다’
  - ‘셈의 모든 자손에게 영광이 될 것입니다’
  rationale: 게에즈 원문에는 ‘영광’에 해당하는 어휘가 없으므로, POB 감사 이력의 정정에 따라 의미를 확장하지 않았습니다.
  doctrine_reference: source fidelity / textual criticism
