    rationale: 독자가 확인할 수 없는 표지는 구조적으로 부적절합니다. 또한 게에즈 본문에는 ‘영광’이 없으므로 이 절의 한국어 본문에 각주로 유지할 필요가 없습니다.
  revised_text: 에서보다 더하였습니다. 그리고 그가 그에게 말했습니다. 「내 딸아, 내 아들 야곱을 지키십시오. 그는 땅 위에서 나를 대신할 것이며, 사람들 가운데에서 복이 될 것이며, 셈의 모든 자손을 위할 것입니다.」
