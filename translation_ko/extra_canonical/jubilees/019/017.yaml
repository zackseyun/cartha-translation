- from: 에서보다. 그리고 그가 그녀에게 말했습니다. 「내 딸아, 내 아들 야곱을 지키십시오. 그는 땅에서 내 자리를 대신할 것이며, 사람들 가운데에서 복이 될 것이며, 셈의 모든 자손을 위할 것입니다.」[a]
