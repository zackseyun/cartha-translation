  text: May God be mine and my seed's, Jacob's and his seed's, forever. And in his seed my name and the name of my fathers—Shem and Noah and Enoch and Mahalalel and Enosh and Seth—shall be blessed.
  footnotes:
  - marker: a
    text: Or 'and my seed shall belong to Jacob and to his seed forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 제 것이 되시고 제 자손의 것이 되시며, 야곱의 것과 그의 자손의 것이 영원히 되게 하소서. 그리고 그의 자손 안에서 제 이름과 제 조상들—셈과 노아와 에녹과 마할랄엘과 에노스와 셋—의 이름이 복을 받게 하소서.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 주님
  - 하느님
  lexicon: standard biblical theology term
  rationale: 기초 문구의 주어는 ‘God’이므로 표준 개신교 용례에 따라 ‘하나님’으로 옮겼습니다.
- source_word: ኪያየ
  english_pob_choice: mine / my
  chosen_korean: 제 것이 되시고
  alternatives_korean:
  - 제 것
  - 저의 것
  - 제 몫
  lexicon: possessive/relational
  rationale: 단순 소유보다 관계적 귀속을 드러내는 문맥이므로 ‘제 것이 되시고’로 옮겨, 하나님과 화자의 언약적 소속을 살렸습니다.
- source_word: ይኩን
  english_pob_choice: May ... be
  chosen_korean: 되게 하소서
  alternatives_korean:
  - 되기를 바랍니다
  - 되십니다
  lexicon: jussive/optative
  rationale: 기원형 동사이므로 청원/축복의 뉘앙스를 살려 ‘되게 하소서’로 옮겼습니다.
- source_word: ይትባረክ
  english_pob_choice: shall be blessed
  chosen_korean: 복을 받게 하소서
  alternatives_korean:
  - 복을 받으리라
  - 복을 받게 되리라
  lexicon: passive blessing formula
  rationale: 수동적 축복 표현을 자연스러운 기원형으로 재현해, 후반부 전체가 축복 선포문처럼 들리도록 했습니다.
theological_decisions:
- issue: ‘내 씨’와 ‘야곱의 씨’의 관계를 어떻게 읽을 것인가
  chosen_reading: 두 번째 절구를 ‘제 자손의 것과 야곱의 것과 그의 자손의 것이 영원히 되게 하소서’가 아니라, 하나님께서 화자와 화자의 자손에게, 그리고 야곱과 그의 자손에게 속하신다는 서원으로 이해해 번역했습니다.
  alternative_readings:
  - 화자의 자손이 야곱과 그의 자손에게 속한다는 해석
  - 문장 일부를 생략하거나 평면적으로 소유 관계로만 읽는 해석
  rationale: 본문 첫머리의 하나님 주어와 1인칭 소유대명사가 함께 놓여 있어, 단순한 혈통 소유문보다 언약적 귀속 선언으로 읽는 편이 원문 흐름을 더 잘 보존합니다.
  doctrine_reference: 언약적 귀속/축복 서원
- issue: 축복 대상 목록의 이름을 한국어 음역으로 유지할 것인가
  chosen_reading: 셈, 노아, 에녹, 마할랄엘, 에노스, 셋으로 옮겼습니다.
  alternative_readings:
  - 전통적 혹은 다른 음역 표기
  - 의미 번역
  rationale: 고유명사는 현대 독자에게 익숙한 표기를 우선하되, 본문이 제시한 족장 명단의 역사성을 보존하기 위해 음역을 유지했습니다.
  doctrine_reference: 고유명사 표기 원칙
