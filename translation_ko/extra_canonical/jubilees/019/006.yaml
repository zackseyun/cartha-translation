  text: that is, Hebron—for four hundred pieces of silver. And they urged him, saying, “We will give it to you for nothing,” but he did not take it from their hands for nothing, because he gave the full price in silver for the place.
  footnotes:
  - marker: a
    text: Or 'but he did not take it from their hands, because'.
    reason: previous_rendering
translation:
  language: ko
  text: 곧바로 헤브론이니, 은 사백 세겔이었습니다. 그들이 그에게 말하기를, “우리는 당신에게 거저 드리겠습니다” 하였으나, 그는 그 땅 값을 은으로 온전히 치르고 샀기 때문에 그들의 손에서 그것을 거저 받지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኬብሮን
  english_pob_choice: Hebron
  chosen_korean: 헤브론
  alternatives_korean:
  - 헤브론
  - 헤브론 성
  lexicon: 고유명사
  rationale: 정착지 이름은 현대 한국어 음역인 헤브론이 가장 자연스럽고, 본문은 장소 식별을 요구하므로 장식적 명칭은 덧붙이지 않았습니다.
- source_word: በ*አርባዕቱ፡ ምእት፡' ብሩር
  english_pob_choice: for four hundred pieces of silver / in silver
  chosen_korean: 은 사백 세겔
  alternatives_korean:
  - 은 사백 개
  - 은 사백 조각
  - 사백 세겔의 은
  lexicon: 수량표현
  rationale: Ge'ez의 수량+은 화폐표현을 한국어 관용에 맞게 ‘은 사백 세겔’로 옮겨, 가격 규모와 화폐 단위를 함께 드러냈습니다.
- source_word: ያስተበቍዕዎ
  english_pob_choice: they urged him
  chosen_korean: 그들이 그에게 말하기를
  alternatives_korean:
  - 그들이 그를 재촉하며
  - 그들이 그에게 간청하며
  - 그들이 그에게 권하며
  lexicon: 동사 의미
  rationale: 문맥상 단순 발화보다 ‘거저 주겠다’는 제안이 이어지므로, 압박과 회유를 함께 담는 중립적 표현으로 정리했습니다.
- source_word: በከ፡ ... በከ፡
  english_pob_choice: for nothing ... for nothing
  chosen_korean: 거저
  alternatives_korean:
  - 무상으로
  - 대가 없이
  - 공짜로
  lexicon: 반복 부사
  rationale: 원문과 영어 본문이 반복하는 ‘for nothing’을 한국어의 짧고 분명한 ‘거저’로 살려, 공짜 제안과 그 거절을 모두 드러냈습니다.
theological_decisions:
- issue: 가격을 온전히 치른 점의 강조
  chosen_reading: 아브라함이 땅 값을 은으로 온전히 치렀다고 분명히 번역했습니다.
  alternative_readings:
  - 그는 그 땅을 샀다
  - 그는 돈을 다 지불했다
  rationale: 본문은 단순한 매입이 아니라 ‘온전히’ 지불한 정당성을 강조하므로, 거래의 완결성과 적법성을 분명히 해야 합니다.
  doctrine_reference: 재산권/언약적 정당성
- issue: 거저 받지 않음의 반복
  chosen_reading: ‘거저’ 표현을 제안과 거절 양쪽에 모두 살렸습니다.
  alternative_readings:
  - 무료로
  - 아무 대가 없이
  rationale: Ge'ez 원문에서 같은 어근이 반복되어 무상 제안과 무상 수령 거부를 대조하므로, 같은 한국어 낱말로 대응해 반복 효과를 보존했습니다.
  doctrine_reference: 문학적 반복 보존
