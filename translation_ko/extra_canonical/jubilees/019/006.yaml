revisions:
- from: 곧바로 헤브론이니, 은 사백 세겔이었습니다. 그들이 그에게 말하기를, “우리는 당신에게 거저 드리겠습니다” 하였으나, 그는 그 땅 값을 은으로 온전히 치르고 샀기 때문에 그들의 손에서 그것을 거저 받지 않았습니다.[a]
  to: 곧 헤브론, 은 사백 개였습니다. 그들은 그에게 권하며 말했습니다. “우리가 당신에게 그것을 거저 드리겠습니다.” 그러나 그는 그곳을 위해 은으로 온전한 값을 치렀으므로, 그것을 그들의 손에서 거저 받지 않았습니다.[a]
  rationale: 동격 표현을 바로잡고, 권유의 동사적 뉘앙스와 ‘거저’의 반복을 보존했습니다. 원문에 명시되지 않은 세겔 단위와 매매 동사를 제거하고, ‘장소’의 의미 범위를 ‘그곳’으로 유지했습니다.
