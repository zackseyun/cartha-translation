  text: 그리고 이 희년의 셋째 주 첫해에 사라가 살았던 날들이 다하고, 그녀는 헤브론에서 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “the first year of the third week of this jubilee”
  english_pob_choice: the first year of the third week of this jubilee
  chosen_korean: “이 희년의 셋째 주의 첫해”
  alternatives_korean:
  - “이 희년의 셋째 주 첫해”
  - “이 희년의 셋째 주의 첫 해”
  lexicon: 희년 / 주 / 첫해
  rationale: Geez의 연대 표지를 영어 POB처럼 직역적으로 살리되, 한국어에서는 자연스럽게 ‘첫해’로 압축해 시간표현의 구조를 유지했습니다.
- source_word: “the days of Sarah’s life were completed”
  english_pob_choice: the days of Sarah’s life were completed
  chosen_korean: “사라의 생애의 날이 끝나고”
  alternatives_korean:
  - “사라의 생애의 날들이 완료되고”
  - “사라의 생애가 다하고”
  lexicon: 생애의 날 / 끝나다
  rationale: ‘날들’의 종결을 삶의 기간 완결로 옮기되, 한국어 문장에서는 더 자연스러운 ‘끝나다’로 처리해 원문의 완료 의미를 보존했습니다.
- source_word: “in Hebron”
  english_pob_choice: in Hebron
  chosen_korean: “헤브론에서”
  alternatives_korean:
  - “헤브론에서”
  - “헤브론 안에서”
  lexicon: 헤브론
  rationale: 지명은 통용 표기 ‘헤브론’을 사용했고, 위치 부사는 한국어 기본 조사 ‘-에서’로 간결하게 옮겼습니다.
