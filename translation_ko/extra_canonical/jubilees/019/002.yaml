  text: And in the first year of the third week of this jubilee[2], the days of Sarah’s life were completed, and she died in Hebron.
  footnotes:
  - marker: '2'
    text: '''The double cave'' reflects the Ge''ez wording literally. It corresponds conceptually to the burial cave known from Genesis, but the translation avoids importing the familiar place-name into the main text where the Ethiopic phrase is descriptive.'
