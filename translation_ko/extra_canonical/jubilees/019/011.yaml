  - 후에 또 아내를 맞이하였습니다
  rationale: 본문은 아브라함의 혼인 수를 서술적으로 제시하므로, 독자가 그 사실을 직접 인지하도록 하는 편이 소스를 더 충실하게 반영합니다.
