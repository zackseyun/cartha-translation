  text: And Abraham took for himself a third wife, and her name was Keturah, from among the daughters of the servants of his household.
translation:
  language: ko
  text: 그리고 아브라함은 자신을 위해 세 번째 아내를 맞이하였는데, 그녀의 이름은 게두라였으며, 그의 집안 종들의 딸들 가운데서 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲተ፡ ሣልስተ
  english_pob_choice: a third wife
  chosen_korean: 세 번째 아내
  alternatives_korean:
  - 세 번째 부인
  - 세 번째 아내를 삼았습니다
  lexicon: third wife
  rationale: 수량 표현과 혼인 관계를 직접 살려, 아브라함이 이미 혼인 상태에서 한 사람을 추가로 맞이했다는 소스를 분명하게 드러냈습니다.
- source_word: ኬጡራ፡
  english_pob_choice: Keturah
  chosen_korean: 게두라
  alternatives_korean:
  - 케투라
  - 케투라흐
  lexicon: proper name
  rationale: 게으즈형 고유명을 한국어 음역으로 옮기되, 성경 인명으로 독자가 알아보기 쉬운 현대 표기를 택했습니다.
- source_word: አዋልደ፡ ልደ፡ ቤቱ፡
