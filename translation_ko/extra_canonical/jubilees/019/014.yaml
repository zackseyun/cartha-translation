  text: and hairy. And Jacob dwelt in tents. And the youths grew, and Jacob learned writing, but Esau did not learn, because he was a man of the field and a hunter, and he learned warfare.
translation:
  language: ko
  text: 그리고 털이 많았습니다. 야곱은 천막에서 살았습니다. 소년들이 자라났고, 야곱은 글쓰기를 배웠으나 에서는 배우지 않았습니다. 이는 그가 들판의 사람이자 사냥꾼이었고, 전쟁을 익혔기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸጕር
  english_pob_choice: and hairy
  chosen_korean: 그리고 털이 많았습니다
  alternatives_korean:
  - 그리고 털이 많았습니다
  - 그리고 털이 수북했습니다
  lexicon: source_note
  rationale: 형용사적 상태를 자연스러운 현대 한국어로 옮기되, 단순히 ‘털이 있었다’보다 외형의 특징이 드러나도록 했습니다.
- source_word: ኀደረ፡ ውስተ፡ ምጽላላት
  english_pob_choice: dwelt in tents
  chosen_korean: 천막에 거주했습니다
  alternatives_korean:
  - 천막에서 살았습니다
  - 장막에 거주했습니다
  lexicon: source_note
  rationale: ‘dwelt’를 서사체에 맞게 ‘거주했습니다’로 옮기고, tents는 문맥상 ‘천막’이 자연스러워 이를 택했습니다.
- source_word: ወተምህረ፡ ያዕቆብ፡ መጽሐፈ
  english_pob_choice: Jacob learned writing
  chosen_korean: 야곱은 글쓰기를 배웠습니다
  alternatives_korean:
  - 야곱은 글을 배웠습니다
  - 야곱은 글쓰기 기술을 배웠습니다
  lexicon: source_note
  rationale: ‘writing’의 대상이 단순 문해가 아니라 기록/필사 능력까지 포함할 수 있어, 직역을 유지하면서도 한국어에서 가장 자연스러운 표현으로 옮겼습니다.
- source_word: ብእሲ፡ ሐቃላዊ፡ ... ወተምህረ፡ ፀብአ
  english_pob_choice: a man of the field and a hunter, and he learned warfare
  chosen_korean: 그는 들판의 사람이요 사냥꾼이었으며, 전쟁을 배웠기 때문입니다
  alternatives_korean:
  - 그는 들의 사람이요 사냥꾼이었으며, 전쟁을 배웠기 때문입니다
  - 그는 들판 사람이며 사냥꾼이었고 전쟁을 익혔습니다
  lexicon: source_note
  rationale: ‘man of the field’를 직역하되 한국어에서 어색하지 않게 ‘들판의 사람’으로 처리했고, revision pass를 반영해 ‘war’가 아니라 ‘warfare’의 성격을 살려 ‘전쟁을 배웠습니다’로 옮겼습니다.
theological_decisions:
- issue: 에서는 배운 것이 ‘전쟁’인지 ‘전쟁 기술/전쟁 수행’인지
  chosen_reading: 본문의 대조점은 야곱의 문서/글쓰기와 에서의 무장된 삶을 대비하는 서술로 보고, ‘전쟁을 배웠습니다’로 간결히 옮겼습니다.
  alternative_readings:
  - 전쟁 기술을 익혔습니다
  - 전투를 배웠습니다
  rationale: 영어 POB의 최신 수정이 war가 아닌 warfare를 택했으므로, 단순 사건이 아니라 생활양식·훈련의 영역임을 드러내는 방향을 유지했습니다.
  doctrine_reference: source-structure and narrative emphasis
