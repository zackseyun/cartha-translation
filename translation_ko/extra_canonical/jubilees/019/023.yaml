- source_word: ይክል፡ ሰብእ፡ ኈልቆ፡ ኖላ፡ ምድር፡²⁹ ይትኌለቍ፡³⁰ ዘርኡሂ።
  english_pob_choice: If a man can count the sand of the earth, then his seed also will be counted.
  chosen_korean: “사람이 땅의 모래를 셀 수 있으면, 그의 씨도 셀 수 있을 것입니다.”
  alternatives_korean:
  - “사람이 땅의 흙을 셀 수 있으면, 그의 씨도 셀 수 있을 것입니다.”
  - “사람이 땅의 모래알을 셀 수 있으면, 그의 씨도 역시 셀 수 있을 것입니다.”
  lexicon: 수량 표현
  rationale: Geʽez의 `ኖላ ምድር`는 문맥상 땅의 모래/모래처럼 셀 수 없는 것을 가리키는 관용으로 읽히므로, English POB의 ‘sand of the earth’를 따라 ‘땅의 모래’로 옮겼습니다. `ዘር`는 혈통·후손을 가리키는 표준적 표현으로 ‘씨’가 가장 직접적입니다.
- source_word: ወኵሉን፡³¹ በረከት፡ እለ፡ ባረከኒ።
  english_pob_choice: And all the blessings with which he blessed me
  chosen_korean: “그리고 그가 나에게 복을 주신 모든 복은”
  alternatives_korean:
  - “그리고 그가 나에게 복 주신 모든 복은”
  - “그리고 그가 내게 베푸신 모든 복은”
  lexicon: 복/축복 표현
  rationale: '`በረከት`는 반복되는 명사형 ‘복’을 살리는 것이 원문 구조를 가장 잘 반영합니다. 동사 `ባረከኒ`는 최신 주석대로 명시된 ‘주님’이 아니라 단순히 ‘그가 나에게 복을 주셨다’이므로, 주어를 임의로 보충하지 않고 그대로 옮겼습니다.'
- source_word: ባረከኒ
  english_pob_choice: he blessed me
  chosen_korean: 그가 나에게 복을 주신
  alternatives_korean:
  - 주님이 나에게 복을 주신
  - 그분이 나에게 복을 주신
  lexicon: 인칭 대명사
  rationale: 개정된 영어 주해가 지적하듯 이 구절의 게에즈 본문에는 ‘주님’이 아니라 단지 ‘그가’만 있습니다. 따라서 본문에는 주어를 확장하지 않고, 필요하면 독자가 주석에서 확인하도록 두는 편이 source-grounded합니다.
