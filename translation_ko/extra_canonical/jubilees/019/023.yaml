  source_fidelity: 첫 절은 게에즈의 조건문과 수동 표현(‘그의 씨/후손도 헤아려질 것이다’)을 대체로 충실히 반영합니다. 그러나 둘째 절의 주어는 원문에 명시되지 않은 3인칭 단수이므로 ‘그가’를 유지해야 하며, 현존 각주는 이를 ‘주님’으로 단정하는 선택지를 제시하여 원문 및 최신 영어 감사 이력과 맞지 않습니다.
  naturalness: ‘그의 씨’는 한국어에서 다소 부자연스럽고 의미 범위가 넓습니다. 이 문맥의 혈통적 의미를 자연스럽게 전달하는 ‘그의 자손’이 적절합니다. ‘그가 나에게 복을 주신’의 주체 높임은 원문에 없는 경의를 덧붙이는 인상을 줄 수 있으므로, 현대적인 문어체로 ‘그가 내게 복을 베푼’으로 옮깁니다. 본문 자체가 미완의 절로 끝나는 것은 원문을 보존한 것이므로 완결시키지 않습니다.
  terminology: ‘자손’은 여기서 ዘር(씨, 후손)의 문맥상 의미를 정확히 전달합니다. ‘복’과 ‘복을 베풀다’는 በረከት/ባረከኒ의 반복 및 축복 어휘를 유지합니다. ‘주님’이라는 명시적 신적 주어는 삽입하지 않습니다.
  issues:
