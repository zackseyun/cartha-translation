  text: and Adam. And they shall be to establish heaven and to strengthen the earth and to renew all.
  footnotes:
  - marker: a
    text: Or 'for the support of heaven and for the strengthening of the earth and for the renewal of all'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 아담에 관하여 말하면, 그들은 하늘을 세우고 땅을 굳게 하며 모든 것을 새롭게 하는 데 쓰일 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኩኑ
  english_pob_choice: they shall be
  chosen_korean: 그들은 … 쓰일 것입니다
  alternatives_korean:
  - 그들은 … 될 것입니다
  - 그들은 … 있습니다
  lexicon: Ge'ez ይኩኑ (jəkunu), future/volitive of 'to be' in purpose construction
  rationale: 이 절에서는 단순 존재 예고보다 목적·용도를 나타내는 흐름이 강하므로, 한국어로는 ‘쓰일 것입니다’로 옮겨 원문의 기능적 의미를 드러냈습니다.
- source_word: ለሳርረ፡ ሰማይ፡
  english_pob_choice: to establish heaven
  chosen_korean: 하늘을 세우고
  alternatives_korean:
  - 하늘을 지탱하고
  - 하늘의 기초를 놓고
  lexicon: Ge'ez ሳርረ (s-r-r), 'found/establish'
  rationale: 영어 POB의 최신 수정과 일치하게 ‘support’보다 ‘establish’가 원문 어근에 더 가깝기 때문에, 하늘을 ‘세우고’로 옮겼습니다.
- source_word: ለአጽንዖ፡ ምድር፡
  english_pob_choice: to strengthen the earth
  chosen_korean: 땅을 굳게 하며
  alternatives_korean:
  - 땅을 강하게 하며
  - 땅을 견고하게 하며
  lexicon: Ge'ez አጽንዖ (ʾaṣnəʾo), 'strengthen/make firm'
  rationale: ‘strengthen’의 물리적·구조적 뉘앙스를 살리기 위해 ‘굳게 하다/견고하게 하다’ 중 자연스러운 합쇼체 표현인 ‘굳게 하며’를 선택했습니다.
- source_word: ለኀድሶ፡ ኵሉ፡
  english_pob_choice: to renew all
  chosen_korean: 모든 것을 새롭게 하는 데
  alternatives_korean:
  - 모든 것을 갱신하는 데
  - 만물을 새롭게 하는 데
  lexicon: Ge'ez ኀድሶ (ḥaddəso), 'renew'
  rationale: ‘renew’의 의미를 현대 한국어에서 가장 직접적으로 드러내는 ‘새롭게 하다’를 택했고, ‘all’은 문맥상 ‘모든 것’을 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 아담에 관한 도입구의 처리
  chosen_reading: ‘그리고 아담에 관하여 말하면’로 시작해, 인물 이름을 주어로 확정하지 않고 앞문맥의 설명적 전환으로 처리했습니다.
  alternative_readings:
  - ‘그리고 아담은’
  - ‘또 아담은’
  rationale: 게에즈 원문은 접속과 전환을 표시할 뿐, 이 부분만으로 아담을 주어로 단정하기보다 문맥적 연결을 살리는 편이 더 안전합니다.
  doctrine_reference: 문맥 우선의 번역 원칙
- issue: ‘하늘을 세우고 땅을 굳게 하며’의 목적 진술
  chosen_reading: 행위의 결과 설명이 아니라 목적·용도를 나타내는 구조로 번역했습니다.
  alternative_readings:
  - 서술적 미래로 ‘하늘을 세우고 땅을 굳게 할 것입니다’
  - 도구적 표현으로 ‘하늘과 땅을 위한 것입니다’
  rationale: 영어 POB의 최신 판정도 목적 부정사 구조를 반영하므로, 원문의 기능을 살려 ‘…하는 데 쓰일 것입니다’로 자연스럽게 연결했습니다.
  doctrine_reference: 문법-의미 대응 원칙
