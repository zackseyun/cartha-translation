translation:
  language: ko
  text: 그는 그들에게 다시 몸을 굽혔습니다. 그리고 그 뒤에 그는 두 겹 굴에 자기의 죽은 이를 장사하였습니다. 사라의 생애의 모든 날은 백이십칠 년이었습니다 — 두 희년과 사주입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ካዕበ
  english_pob_choice: again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 거듭
  lexicon: Geez ካዕበ
  rationale: 문맥상 이미 한 번 절한 뒤 ‘다시’ 절했다는 반복을 분명하게 드러내는 것이 가장 자연스럽습니다.
