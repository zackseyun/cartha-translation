revisions:
- from: 그는 그들에게 다시 몸을 굽혔습니다. 그리고 그 뒤에 그는 두 겹 굴에 자기의 죽은 이를 장사하였습니다. 사라의 생애의 모든 날은 백이십칠 년이었습니다 — 두 희년과 사주입니다.[a]
  to: 그는 그들에게 다시 몸을 굽혔습니다. 그 뒤에 그는 죽은 이를 그 두 겹으로 된 동굴에 장사하였습니다. 사라가 산 날은 모두 백이십칠 년이었습니다. 곧 두 희년과 네 주간의 해였습니다.
  rationale: 반복 표지 ‘다시’와 ‘double cave’를 보존하되, 한국어 관용에 맞게 ‘두 겹으로 된 동굴’로 다듬었습니다. ‘four weeks of years’는 ‘네 주간의 해’로 풀어 고대 연대 계산 단위임을 보존했습니다. 원문의 수치와 병렬 연대 표기 사이에 보이는 긴장은 조화시키거나 해설로 해결하지 않았습니다. 대응하는 한국어 각주가 없는 [a]는 제거했습니다.
