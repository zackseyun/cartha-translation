theological_decisions:
- issue: 장례와 연대 표기의 서술 방식
  chosen_reading: 사라의 죽음과 장사를 사실 서술로 평이하게 옮기고, 이어지는 연대 계산을 본문 구조대로 보존했습니다.
  alternative_readings:
  - 의례적·완곡한 표현으로 바꾸는 번역
  - 연대 계산을 주석으로만 돌리는 번역
  rationale: 이 절은 신학적 해설보다 서술과 연대 기록이 핵심이므로, 원문의 기록체를 유지하는 것이 독자 이해에 가장 충실합니다.
  doctrine_reference: 서술 본문 보존 원칙
- issue: ‘희년’과 ‘주’ 단위의 계산법
  chosen_reading: 본문의 고대 달력적 계산을 그대로 살려 ‘두 희년과 사주’로 옮겼습니다.
  alternative_readings:
  - ‘두 희년과 네 주의 해’로 풀어 쓰는 번역
  - 현대식 연도로 환산해 제시하는 번역
  rationale: 이 수치는 상징적·전승적 연대 표지이므로, 현대식 환산보다 원문 계산 단위를 보존하는 편이 텍스트의 의도를 더 잘 드러냅니다.
  doctrine_reference: 고대 연대 표기 보존
- issue: ‘다시’의 반복 표지
  chosen_reading: ‘그들에게 다시 몸을 굽혔습니다’로 반복을 명시했습니다.
  alternative_readings:
  - ‘그들에게 몸을 굽혔습니다’
  - ‘그들에게 또 몸을 굽혔습니다’
  rationale: 게으즈어 ካዕበ는 반복을 분명히 표시하므로, 이를 생략하면 본문 의미의 한 층이 사라집니다.
  doctrine_reference: 원문 반복 표지 보존
