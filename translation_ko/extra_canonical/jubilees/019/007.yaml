    rationale: 한국어 ‘사주’는 통상 다른 뜻으로 이해되거나 단순 4주로 읽힐 수 있습니다. 원문의 연대 단위임을 드러내는 표현이 필요합니다.
  - severity: low
    issue: ‘두 겹 굴’ 및 ‘자기의 죽은 이’가 현대 한국어로 어색합니다.
