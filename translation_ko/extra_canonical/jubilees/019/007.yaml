  - severity: low
    issue: 초안의 [a] 표지에 대응하는 한국어 각주가 없습니다.
    rationale: 영어 감사 이력의 각주는 이전 번역에 관한 대안 표기이며, 현 본문에는 ‘다시’가 명시되어 있습니다. 구조상 고아 표지를 제거하는 것이 적절합니다.
  revised_text: 그는 그들에게 다시 몸을 굽혔습니다. 그 뒤에 그는 죽은 이를 그 두 겹으로 된 동굴에 장사하였습니다. 사라가 산 날은 모두 백이십칠 년이었습니다. 곧 두 희년과 네 주간의 해였습니다.
