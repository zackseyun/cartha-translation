translation:
  language: ko
  text: 그는 그들에게 다시 몸을 굽혔습니다. 그 뒤에 그는 죽은 이를 그 두 겹으로 된 동굴에 장사하였습니다. 사라가 산 날은 모두 백이십칠 년이었습니다. 곧 두 희년과 네 주간의 해였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
