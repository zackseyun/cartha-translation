  text: my sons. Forever let him be blessed, and let his seed be that which fills the whole earth.
translation:
  language: ko
  text: “내 아들들아, 영원토록 그가 복을 받기를 바라며, 그의 씨가 온 땅을 채우는 자가 되기를 바랍니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉድ*የ፡²
  english_pob_choice: my sons
  chosen_korean: 내 아들들아
  alternatives_korean:
  - 내 아들들이여
  - 내 아들들아
  lexicon: 아들
  rationale: Geez 원문의 복수 호격을 자연스러운 현대 한국어 호칭으로 옮겼습니다. POB의 영어는 직접 호칭을 유지하므로, 문맥상 감탄적 부름을 살려 ‘-아’ 형식을 택했습니다.
- source_word: ይትባረክ፡
  english_pob_choice: let him be blessed
  chosen_korean: 그가 복을 받기를 바라며
  alternatives_korean:
  - 그가 복을 받게 되기를 바라며
  - 그에게 복이 있기를 바라며
  lexicon: 복을 받다 / 복
  rationale: 수동적 축복 표현을 그대로 살리되, 한국어에서 자연스럽게 읽히는 기원형으로 옮겼습니다. ‘복이 있기를’은 의미는 가깝지만 원문의 ‘받다’의 수동성을 다소 약화합니다.
- source_word: ዘይመልእ፡²⁸ ኵላ፡ ምድረ።
  english_pob_choice: that which fills the whole earth
  chosen_korean: 온 땅을 채우는 자
  alternatives_korean:
  - 온 땅을 채우는 것
  - 온 땅을 채울 자
  lexicon: 채우다
  rationale: 원문의 관계절 구조와 POB의 ‘that which fills’를 반영해, 씨를 능동적으로 ‘채우는 자’로 옮겼습니다. ‘것’보다 인격적/종자적 뉘앙스를 더 잘 드러냅니다.
theological_decisions:
- issue: 축복의 기원적 표현과 씨의 확장 표현을 어떻게 보존할지
  chosen_reading: 문장을 직접적 기원형으로 유지해 ‘복을 받기를 바랍니다’와 ‘되기를 바랍니다’를 병렬로 두었습니다.
  alternative_readings:
  - '서술형으로 평탄화: ‘그가 복을 받습니다’'
  - '명령형으로 직역: ‘그가 복을 받게 하십시오’'
  rationale: 본문은 선언이라기보다 축복/기원의 말로 읽히므로, 한국어에서도 그 기능을 유지하는 편이 원문 의도를 더 잘 전달합니다.
  doctrine_reference: 축복 기원문 양식
