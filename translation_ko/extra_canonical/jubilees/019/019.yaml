  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይቀውም
  english_pob_choice: who will stand out
  chosen_korean: 두드러지게 될 자입니다
  alternatives_korean:
  - 서게 될 자입니다
  - 우뚝 설 자입니다
  - 나타날 자입니다
  lexicon: stand out
  rationale: 문맥상 단순히 '서다'보다 여러 민족 가운데서 구별되어 두드러진다는 의미가 더 잘 드러나므로 '두드러지게 될'로 옮겼습니다.
- source_word: እምኵሎሙ አሕዛብ
  english_pob_choice: from among all the nations
  chosen_korean: 모든 민족들 가운데서
  alternatives_korean:
  - 모든 나라들 가운데서
  - 모든 이방 민족들 가운데서
  lexicon: nations
  rationale: 게에즈의 '아흐자브'는 민족/나라들을 가리키므로, 한국어에서는 가장 자연스러운 '민족들'을 택했습니다.
- source_word: ዲበ ገጸ ምድር
  english_pob_choice: on the face of the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅의 표면 위에서
  - 지면 위에서
  - 온 땅 위에서
  lexicon: face of the earth
  rationale: 관용적 표현의 직역을 유지하되 한국어에서는 불필요한 중복을 줄여 '땅 위에서'로 간명하게 옮겼습니다.
- source_word: ወናሁ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 자, 이제
  lexicon: and now
  rationale: 서술 전환 표지로서의 기능을 살려 '이제'로 옮기고, 영어 개정본의 쉼표 처리도 반영했습니다.
theological_decisions:
- issue: 민족들 가운데서의 '두드러짐'의 의미
  chosen_reading: 이 표현은 단순한 출현이 아니라 하나님이 정하신 구별과 우월성을 암시하는 서술로 읽고, 이를 과도하게 신학화하지 않고 문면 그대로 살렸습니다.
  alternative_readings:
  - 메시아적 승귀를 직접 암시하는 표현
  - 이스라엘의 정치적 우세를 뜻하는 표현
  rationale: 문맥이 야곱의 축복/예언 전환부이므로, 원문이 허용하는 범위 안에서 구별성과 현저성을 보존하는 것이 가장 안전합니다.
  doctrine_reference: 창세기/희년서의 족장 축복 문맥
- issue: 호칭 '내 아들 이삭아'
  chosen_reading: 게에즈 원문은 친밀한 직접 호칭을 담고 있으므로, 이를 한국어에서 쉼표로 분리한 직접 호칭으로 살렸습니다.
  alternative_readings:
  - 이삭 내 아들
  - 내 아들 이삭
  rationale: 발화의 리듬과 호소를 보존하기 위해 '이삭아'를 사용하되, 현대 한국어 합쇼체 서술과 충돌하지 않도록 정리했습니다.
  doctrine_reference: 서술체/직접 화법의 화용론
