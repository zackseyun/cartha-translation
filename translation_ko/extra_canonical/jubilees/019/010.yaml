  source_fidelity: 초안은 족보의 주요 관계를 대체로 보존하지만, 첫 절의 ‘그분’은 앞선 문맥의 신적 명칭을 이 절의 혼인 주선 주어로 잘못 연결할 위험이 있습니다. 게에즈어의 동사 주어와 영어 감사본의 he는 문맥상 아브라함으로 보는 것이 자연스럽습니다. 또한 원문과 영어 감사본에 있는 ‘브두엘의 딸’의 반복 및 마지막 절의 ‘아브라함의 형제’ 반복을 빠뜨리지 않아야 합니다.
  naturalness: ‘그해 넷째 해’는 중복적이며, ‘아내를 맞아 주셨는데’는 존대 주어를 불필요하게 암시하고 혼인 마련 행위에도 다소 부자연스럽습니다. ‘그 넷째 해에 아브라함은 … 아내를 맞이하게 하였는데’가 현대 한국어의 격식 있는 역사 서술에 더 자연스럽습니다.
  terminology: 이삭, 리브가, 브두엘, 나홀, 라반, 밀가는 통상적인 성서 인명 표기를 따릅니다. 족보의 반복은 현대어에서 어색하더라도 원문 전승 및 영어 감사본의 반복을 보존하여 번역합니다.
