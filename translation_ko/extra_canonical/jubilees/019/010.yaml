theological_decisions:
- issue: 족보 서술의 반복과 누적
  chosen_reading: 본절은 단순한 정보 반복이 아니라, 리브가의 혈통을 여러 방향에서 겹쳐 확인하는 족보 서술로 읽었습니다.
  alternative_readings:
  - 중복된 표현으로 보고 일부를 압축
  - 현대어에서 자연스럽게 한 번만 언급
  rationale: 원문과 영어 감사본 모두 반복을 유지하므로, 한국어에서도 반복을 줄이지 않고 계보의 확증 효과를 드러냈습니다.
  doctrine_reference: 성경의 족보는 역사적 연속성과 언약 계보를 증언함
- issue: 주어 표지와 서술 인칭
  chosen_reading: 게으한 주어 생략 대신 ‘그분은’으로 시작해 서술의 주체를 분명히 했습니다.
  alternative_readings:
  - 주어 생략
  - ‘그는’으로 단순화
  rationale: 게즈 원문에서 서술 주체가 명시되며, 한국어에서도 역사 서술의 문맥을 유지하기 위해 주어를 드러냈습니다.
  doctrine_reference: 본문의 서술 구조 보존
