  source_fidelity: 게즈어 본문은 리브가가 이삭에게 야곱과 에서, 두 아들을 낳았다고 한 뒤 야곱을 ‘매끈하고 올곧은’ 사람으로, 에서를 ‘사나운/거친’ 사람 तथा ‘들의 사람’으로 묘사합니다. 초안의 핵심 의미는 이를 충실히 반영합니다. 특히 에서의 묘사는 ‘털이 많은’으로 조화시키지 않고 ድሩክ의 ‘사나운/거친’ 의미를 따른 점이 적절합니다.
  naturalness: ‘들의 사람’은 원문 구조를 보존하지만 현대 표준 한국어에서는 다소 부자연스럽습니다. ‘들에서 사는 사람’은 ‘a man of the field’를 자연스럽게 옮기면서도 그가 들과 관련된 사람이라는 표현을 유지합니다. 또한 본문에 실제 내용이 없는 [a] 표지는 삭제해야 합니다.
