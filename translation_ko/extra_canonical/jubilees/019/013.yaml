translation:
  language: ko
  text: 그리고 여섯째 주의 둘째 해에 리브가가 이삭에게 두 아들, 야곱과 에서를 낳았습니다. 야곱은 매끈하고 올곧은 사람이었지만, 에서는 사나운 사람이었고 들에서 사는 사람이었습니다.
  philosophy: optimal-equivalence
