    reason: previous_rendering
  revision_rationale: 직접적인 ‘울다’와 ‘장사 지내다’를 보존하고, 시험의 대상인 아브라함의 ‘영’을 유지했습니다. 손상된 게에즈 제시문에서 보정이 필요한 시험 및 마지막 절은 영어 POB 감사 기록의 읽기를 따르되, 마지막 표현을 현대 한국어 합쇼체로 자연스럽게 다듬었습니다. 이전 번역 각주는 감사 이력을 보존하되 현행 읽기와 구별하도록 수정했습니다.
