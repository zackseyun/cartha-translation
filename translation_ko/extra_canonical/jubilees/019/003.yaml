  text: And Abraham went to weep for her and to bury her, and we tested him to see if his spirit was patient, and he did not become violent in the speech of his mouth.
  footnotes:
  - marker: '3'
    text: Verse 8 likely means that Sarah’s death constituted the tenth test by which Abraham was tested. The syntax is compressed in the source, so the English makes the implied connection explicit.
    reason: segmentation_note
  - marker: a
    text: Or 'mourn for her and to weep for her[3], and to remember her with restraint of spirit'.
    reason: previous_rendering
translation:
  language: ko
  text: 아브라함은 그녀를 위해 애도하고 장사하려고 갔으며, 우리는 그의 영이 참을성 있는지 그를 시험했고, 그는 입술의 말에서 난폭해지지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረ፡ አብርሃም፡ ከመ፡ ይብክያ፡' ወይቅበራ፡
  english_pob_choice: went to weep for her and to bury her
  chosen_korean: 그녀를 위해 애도하고 장사하려고 갔으며
  alternatives_korean:
  - 그녀를 위해 울고 장사하려고 갔으며
  - 그녀를 위해 곡하고 장사하려고 갔으며
  lexicon: wept/mourned; bury
  rationale: 게에즈 본문은 ‘울다’와 ‘장사하다’를 함께 담고 있어, 영어 POB의 ‘weep for her and to bury her’를 따르되 한국어에서는 자연스럽게 ‘애도하다’로 묶어 장례 행위를 분명히 했습니다.
- source_word: ወናዝከሮ / corrected reading to ወመከርኖ
  english_pob_choice: we tested him to see if his spirit was patient
  chosen_korean: 우리는 그의 영이 참을성 있는지 그를 시험했고
  alternatives_korean:
  - 우리는 그의 영이 인내하는지 그를 시험했고
  - 우리는 그의 영이 오래 참는지 그를 시험했고
  lexicon: test; spirit; patient
  rationale: 검토된 회복 본문은 ‘기억하다’가 아니라 ‘시험하다’이므로, 영어 POB의 보정된 의미를 따라 시험의 목적과 ‘영’의 상태를 직접 드러냈습니다.
- source_word: መንፈሱ
  english_pob_choice: his spirit
  chosen_korean: 그의 영
  alternatives_korean:
  - 그의 마음
  - 그의 정신
  lexicon: spirit
  rationale: 게에즈의 መንፈስ은 인간 내부의 내적 태도를 가리키므로, ‘영’으로 직역해 원문의 표현을 살렸습니다.
- source_word: ወእ*ይት...
  english_pob_choice: he did not become violent in the speech of his mouth
  chosen_korean: 그는 입술의 말에서 난폭해지지 않았습니다
  alternatives_korean:
  - 그는 입의 말로 난폭해지지 않았습니다
  - 그는 입에서 나온 말로 격해지지 않았습니다
  lexicon: violent in speech; mouth
  rationale: 말의 거침/폭력성을 나타내는 표현을 직역해, 아브라함이 슬픔 속에서도 말로 폭력적으로 변하지 않았다는 대비를 보존했습니다.
theological_decisions:
- issue: 아브라함의 슬픔과 하나님의 시험의 결합
  chosen_reading: 장사와 애도의 장면을 곧바로 ‘시험’과 연결해, 죽음 앞에서 아브라함의 인내가 검증되는 구도를 유지했습니다.
  alternative_readings:
  - 단순한 장례 서술로만 읽기
  - 슬픔의 정도를 심리 묘사로만 완화하기
  rationale: 주어진 영어 POB와 수정 내역은 이 절을 아브라함의 열 번째 시험 맥락으로 읽으므로, 사건 서술보다 시험 모티프를 흐리지 않도록 했습니다.
  doctrine_reference: 성경의 시험과 인내 주제
