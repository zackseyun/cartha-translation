- from: 그는 히에트의 아들들과 말하여 그들이 자기의 죽은 자를 장사할 곳을 자기에게 주게 하였습니다. 야훼께서 그를 보는 모든 사람 앞에서 호의를 베푸셨고[5], 그는 히에트의 아들들에게 정중하게 간청하였으며, 그들이 마므레 맞은편의 두 굴의 땅을 그에게 주었습니다.
  to: 그는 헷의 자손들과 말하여, 그들이 그에게 그의 죽은 이를 장사할 곳을 주도록 하였습니다. 야훼께서는 그를 보는 모든 사람 앞에서 그에게 호의를 베푸셨고, 그는 헷의 자손들에게 정중하게 간청하였습니다. 그들은 마므레 맞은편에 있는 두 굴의 땅을 그에게 주었습니다.
  rationale: 한국어 성서 관용에 맞춰 ‘히에트’를 ‘헷’으로 고치고, 죽은 이의 소유자를 명시하여 지시 대상의 모호성을 제거했습니다. 문장을 현대적인 합쇼체로 다듬되, 화자와 헷의 자손들의 대화, 매장지 요청, 야훼께서 주신 호의, 정중한 간청, 마므레 맞은편의 두 굴의 땅이라는 원문의 모든 요소를 보존했습니다. 본문과 무관한 [5] 각주는 삭제했습니다.
