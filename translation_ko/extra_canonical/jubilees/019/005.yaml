base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/019/005.yaml
  text: He spoke with the sons of Heth so that they might give him a place in which to bury his dead. And the LORD gave him favor before all who saw him[5], and he entreated courteously of the sons of Heth, and they gave him the land of the double cave, which is opposite Mamre—
  footnotes:
  - marker: '5'
    text: 'Verses 24-26 use elevated cosmological language: ''support heaven,'' ''strengthen the earth,'' and ''renew all the lights above the firmament.'' This is preserved as-is rather than reduced to a mere metaphor for prosperity.'
    reason: cultural_note
  - marker: a
    text: Or 'so that they might give him a place'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 헷의 자손들과 말하여, 그들이 그에게 그의 죽은 이를 장사할 곳을 주도록 하였습니다. 야훼께서는 그를 보는 모든 사람 앞에서 그에게 호의를 베푸셨고, 그는 헷의 자손들에게 정중하게 간청하였습니다. 그들은 마므레 맞은편에 있는 두 굴의 땅을 그에게 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተናገረ፡ ምስለ፡ ውሉደ፡ ኬጥ፡
  english_pob_choice: He spoke with the sons of Heth
  chosen_korean: 히에트의 아들들과 말하여
  alternatives_korean:
  - 헷의 아들들과 말하여
  - 헤트의 아들들과 말하여
  lexicon: 고유명사 음역
  rationale: Ge'ez의 ‘sons of Heth’를 자연스럽게 옮기되, 성경 문맥에서 익숙한 ‘헷’보다 원음에 가까운 ‘히에트’를 택했습니다.
- source_word: የሀብዎ፡ መካነ፡
  english_pob_choice: they might give him a place
  chosen_korean: 그들이 자기의 죽은 자를 장사할 곳을 자기에게 주게 하였습니다
  alternatives_korean:
  - 그들이 그에게 한 장소를 주게 하였습니다
  - 그들이 장사할 곳을 그에게 주게 하였습니다
  lexicon: 장소 / 곳
  rationale: 본문의 목적이 단순한 ‘장소’가 아니라 ‘장사할 곳’이므로 목적절의 의미를 드러내어 번역했습니다.
- source_word: ወወሀብዎ፡ ምድረ፡ ባዓት፡' ዘካዕበት፡
  english_pob_choice: they gave him the land of the double cave
  chosen_korean: 두 굴의 땅을 그에게 주었습니다
  alternatives_korean:
  - 쌍굴의 땅을 그에게 주었습니다
  - 마므레 맞은편의 두 굴 땅을 주었습니다
  lexicon: 지명/서술 표현
  rationale: ‘double cave’의 뜻을 직역해 복합명사화하지 않고, 이어지는 절에서 위치 설명을 분리해 읽기 쉽게 했습니다.
- source_word: ዘአንጻረ፡ መምብሬም፡
  english_pob_choice: which is opposite Mamre
  chosen_korean: 마므레 맞은편의
  alternatives_korean:
  - 마므레를 마주한
  - 마므레 맞은편에 있는
  lexicon: 전치사/관계절
  rationale: 위치 관계를 한국어 관형어로 압축해, 문맥상 ‘두 굴의 땅’에 직접 수식되도록 했습니다.
theological_decisions:
- issue: 야훼의 호의/은총 표현
  chosen_reading: ‘야훼께서 그를 보는 모든 사람 앞에서 호의를 베푸셨고’로 옮겨, 본문의 외적 호의와 사회적 승인 효과를 드러냈습니다.
  alternative_readings:
  - ‘은혜를 주셨고’
  - ‘호감을 주셨고’
  rationale: 여기서는 구원론적 ‘은혜’보다 사람들 앞에서의 호의와 인정이라는 서술이 강하므로, 더 직접적인 표현을 택했습니다.
  doctrine_reference: 창세기 39:21의 유사한 ‘호의’ 서술
