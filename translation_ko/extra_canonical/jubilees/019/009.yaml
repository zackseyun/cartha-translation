revisions:
- from: 이 일에서 아브라함은 신실하고 영이 오래 참는 사람으로 드러났습니다. 그리고 그는 야훼께서 자신과 그의 씨에게 뒤에 그 땅을 주시겠다고 하신 약속에 관하여 한마디도 하지 않았습니다. 그러나 그는 거기서 자기 죽은 자를 묻을 장소를 요청했습니다. 이는 그가 신실한 사람으로 드러났기 때문이며, 하늘의 돌판들에 야훼의 친구로 기록되었습니다.[a][b]
  to: 이 일에서 아브라함은 신실하고 마음이 인내하는 이로 인정받았습니다.[a] 그는 야훼께서 그 땅을 그와 그의 뒤를 이을 후손에게 주겠다고 말씀하신 약속에 관하여 한마디도 하지 않았습니다. 그러나 그는 거기서 자기 죽은 자를 묻을 곳을 청했습니다. 이는 그가 신실한 이로 인정받았기 때문이며, 그는 하늘의 돌판들에 야훼의 친구로 기록되었습니다.[b]
  rationale: 자연스럽지 않은 성격 묘사와 후손 관련 어순을 바로잡고, 매장지 요청의 어조를 문맥에 맞게 다듬었습니다. 또한 두 각주 표지를 해당 본문 요소에 연결했으며, 본문의 의미나 신학적 함의를 추가하지 않았습니다.
