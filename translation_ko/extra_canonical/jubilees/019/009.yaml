  source_fidelity: 원문의 지시어 ቦቱ를 ‘이 일에서’로 보존하고, 아브라함이 땅의 약속에 관해 말하지 않고 매장지를 청한 사실 및 하늘의 돌판에 친구로 기록된 내용을 충실히 반영합니다. 다만 ‘영이 오래 참는 사람’과 ‘그의 씨에게 뒤에’는 각각 원문의 성격 묘사와 ‘그 뒤를 이을 후손’의 뜻을 한국어로 부자연스럽게 전달합니다.
  naturalness: ‘마음이 인내하는’은 ‘patient in spirit’를 현대 표준 한국어로 자연스럽고 과도한 해석 없이 옮깁니다. ‘그와 그의 뒤를 이을 후손에게’ 및 ‘묻을 곳을 청했습니다’도 문장 흐름과 격조를 개선합니다.
  terminology: ‘신실한 이’, ‘후손’, ‘하늘의 돌판들’, ‘야훼의 친구’는 본문의 어휘와 제2성전기 문헌의 천상 기록 표상을 유지합니다. ‘씨’는 한국어에서 비유가 불분명할 수 있어 문맥상 ‘후손’으로 옮깁니다.
