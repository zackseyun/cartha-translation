  yaml_path: translation/extra_canonical/jubilees/019/009.yaml
  text: In this, Abraham was found faithful, patient in spirit. And he did not speak a word concerning the promise of the land, which the LORD had said he would give to him and to his seed after him, yet he asked there for a place to bury his dead, because he was found faithful, and he was recorded as a friend of the LORD on the heavenly tablets.
  footnotes:
  - marker: a
    text: Or 'and Abraham was found faithful'.
    reason: previous_rendering
  - marker: b
    text: Or 'and it was written down for him as a friend'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 일에서 아브라함은 신실하고 마음이 인내하는 이로 인정받았습니다.[a] 그는 야훼께서 그 땅을 그와 그의 뒤를 이을 후손에게 주겠다고 말씀하신 약속에 관하여 한마디도 하지 않았습니다. 그러나 그는 거기서 자기 죽은 자를 묻을 곳을 청했습니다. 이는 그가 신실한 이로 인정받았기 때문이며, 그는 하늘의 돌판들에 야훼의 친구로 기록되었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그리고 아브라함은 신실하고 마음이 인내하는 이로 인정받았습니다.”
    reason: 원문 첫 지시어 ቦቱ(‘이 일에서/이 일에 있어서’)를 생략하는 이전 번역 가능성을 밝혀, 본문 번역이 앞 절의 사건을 가리킴을 보입니다.
  - marker: b
    text: 또는 “그를 야훼의 친구로 기록하였습니다.”
    reason: 수동형 ‘그는 … 기록되었습니다’와 기록 행위를 전면에 내세우는 번역 가능성을 제시합니다. 본문은 아브라함이 기록된 대상임을 분명히 합니다.
lexical_decisions:
- source_word: ቦቱ
  english_pob_choice: In this
  chosen_korean: 이 일에서
  alternatives_korean:
  - 이 가운데서
  - 이 일로 말미암아
  lexicon: Ge'ez ቦቱ는 앞선 사건을 가리키는 지시 표현입니다.
  rationale: 바로 앞 문맥의 시험/상황을 가리키는 연결어이므로 단순한 ‘그 안에서’보다 원인·상황 연결이 드러나는 ‘이 일에서’로 옮겼습니다.
- source_word: ምእመነ፡ ዕጉሠ፡ መንፈስ
  english_pob_choice: faithful, patient in spirit
  chosen_korean: 신실하고 영이 오래 참는 사람
  alternatives_korean:
  - 믿음직하고 영으로 인내하는 사람
  - 신실하며 영에 있어 인내한 사람
  lexicon: 핵심 형용사군과 성격 묘사 표현입니다.
  rationale: ‘faithful’는 신실함으로, ‘patient in spirit’는 직역보다 인격적 지속성을 살려 ‘영이 오래 참는’으로 옮겨 원문의 긴장과 장점을 함께 드러냈습니다.
- source_word: መካነ፡ አስተብቍዐ፡ በህየ፡ ከመ፡ ይቅበር፡ ቤድኖ፡
  english_pob_choice: he asked there for a place to bury his dead
  chosen_korean: 그는 거기서 자기 죽은 자를 묻을 장소를 요청했습니다
  alternatives_korean:
  - 그는 거기서 자기 죽은 자를 장사할 땅을 구했습니다
  - 그는 거기서 자신의 죽은 이들을 묻을 곳을 청했습니다
  lexicon: 장례 매장 요청을 나타내는 동사와 명사구입니다.
  rationale: 본문은 매장할 ‘장소’를 요청하는 의미이므로, 전통적 ‘장사’보다 장소성과 청원의 동작을 살린 ‘묻을 장소를 요청했습니다’로 처리했습니다.
- source_word: ወመካነ፡ ... ይቅበር
  english_pob_choice: a place to bury his dead
  chosen_korean: 자기 죽은 자를 묻을 장소
  alternatives_korean:
  - 자기 죽은 사람들을 묻을 곳
  - 죽은 자를 묻을 땅
  lexicon: 단수·복수보다 집합적 죽은 자를 가리키는 표현입니다.
  rationale: 지시 대상이 아브라함의 가족/가문 맥락이므로 복수 감각을 살리되, 과도한 해석을 피해서 ‘자기 죽은 자’로 옮겼습니다.
theological_decisions:
- issue: 하늘의 돌판들에 기록됨
  chosen_reading: 하늘의 돌판들에 기록되었습니다
  alternative_readings:
  - 하늘의 판들에 기록되었습니다
  - 하늘의 석판들에 새겨졌습니다
  rationale: 원문의 ‘heavenly tablets’는 에녹-희년 전승의 천상 기록 문서이므로, 일반적 비유로 약화하지 않고 직역 성격을 유지했습니다.
  doctrine_reference: 제2성전기 유대 문헌의 천상 기록 도상
