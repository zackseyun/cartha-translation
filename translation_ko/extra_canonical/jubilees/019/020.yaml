  yaml_path: translation/extra_canonical/jubilees/019/020.yaml
  text: He loves Esau more than Jacob, but I see your righteous affection for Jacob. And continue still to show him kindness, and let your eyes be upon him in love, because he will be a blessing on the earth from now and through all the generations of the earth.
  footnotes:
  - marker: a
    text: Or 'loves Esau'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 에서를 야곱보다 더 사랑합니다[a]. 그러나 나는 그대가 야곱을 향해 지닌 의로운 사랑을 봅니다. 계속해서 그에게 친절을 베풀고, 사랑으로 그를 바라보십시오. 그는 이제부터 땅의 모든 세대에 걸쳐 땅 위의 복이 될 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 에서를 사랑합니다.”
    reason: 영어 POB 감사 추적에 보존된 첫 절의 이전 번역 대안을, 관련 동사 바로 뒤에 배치했습니다.
lexical_decisions:
- source_word: ያፈቅሮ
  english_pob_choice: He loves Esau
  chosen_korean: 그가 에서를 야곱보다 더 사랑하십니다
  alternatives_korean:
  - 그는 에서를 사랑합니다
  - 그가 에서를 사랑하십니다
  lexicon: Geez verb of loving/affection; subject is implicit in the verb
  rationale: 원문의 동사는 3인칭 주어를 포함하므로, POB의 정리된 영어처럼 주어를 드러내되 한국어에서는 비교 구문을 살려 ‘야곱보다 더’로 의미를 분명히 했습니다.
- source_word: መፍቀሪተ፡ ጽድቅ፡ ያዕቆብሃ
  english_pob_choice: your righteous affection for Jacob
  chosen_korean: 당신이 야곱을 향해 지닌 의로운 애정
  alternatives_korean:
  - 야곱을 향한 의로운 사랑
  - 야곱에 대한 의로운 애정
  lexicon: ‘righteous’ + noun of affection/love
  rationale: 원문의 ‘의로운’과 ‘애정/사랑’의 결합을 보존하되, 대상이 야곱을 향한다는 방향성을 한국어 자연문으로 옮겼습니다.
- source_word: ለፍቅር
  english_pob_choice: in love
  chosen_korean: 사랑으로
  alternatives_korean:
  - 사랑 안에서
  - 사랑 가운데
  lexicon: prepositional phrase expressing loving regard
  rationale: 행동의 방식으로 제시된 사랑의 태도를 간결하게 드러내기 위해 ‘사랑으로’를 택했습니다.
- source_word: ይከውን
  english_pob_choice: he will be a blessing
  chosen_korean: 복이 될 것이기 때문입니다
  alternatives_korean:
  - 복이 될 것입니다
  - 축복이 될 것이기 때문입니다
  lexicon: to become / be
  rationale: 결과를 설명하는 종결 구조를 살려, 장차의 상태를 ‘복이 될 것’으로 옮겼습니다.
theological_decisions:
- issue: 에서에 대한 ‘더 사랑함’과 야곱에 대한 ‘의로운 애정’의 긴장
  chosen_reading: 하나님의 선택 서사 안에서 에서를 더 사랑하신다는 진술과, 야곱을 향한 의로운 애정의 관찰을 병치해 유지했습니다.
  alternative_readings:
  - 에서를 사랑하신다로 단순화
  - 야곱을 더 사랑하신다로 조정
  rationale: 원문과 POB가 함께 유지하는 비교·대조의 긴장을 약화시키지 않고, 두 문장을 그대로 병렬로 살려 독자가 서술의 역설을 보게 했습니다.
  doctrine_reference: 선택과 섭리의 서술을 평탄화하지 않음
- issue: ‘복이 될 것’의 미래적 선언
  chosen_reading: 야곱이 장차 땅 위의 복이 될 것이라는 예언적 진술로 유지했습니다.
  alternative_readings:
  - 현재형 일반 진술로 완화
  - 도덕적 모범으로만 해석
  rationale: 원문은 미래와 범세대적 확장을 분명히 하므로, 예언적 미래를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 예언적 약속의 미래 시제 보존
