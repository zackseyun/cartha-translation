- from: 그가 에서를 야곱보다 더 사랑하십니다. 그러나 나는 당신이 야곱을 향해 지닌 의로운 애정을 봅니다. 그러므로 계속해서 그에게 친절을 베풀고, 사랑으로 그를 바라보십시오. 그는 이제부터 그리고 땅의 모든 세대를 통하여 땅 위의 복이 될 것이기 때문입니다.[a]
  to: 그는 에서를 야곱보다 더 사랑합니다[a]. 그러나 나는 그대가 야곱을 향해 지닌 의로운 사랑을 봅니다. 계속해서 그에게 친절을 베풀고, 사랑으로 그를 바라보십시오. 그는 이제부터 땅의 모든 세대에 걸쳐 땅 위의 복이 될 것이기 때문입니다.
  rationale: 원문이 명시하지 않는 주체 높임을 제거하고, 직접 호칭과 세대 표현을 현대적이면서도 문어적인 표준 한국어로 다듬었습니다. 비교, 대조, 친절의 지속, 사랑의 태도, 그리고 야곱이 장차 땅 위의 복이 된다는 선언은 유지했습니다. 각주는 해당 첫 절로 옮겨 구조와 참조 범위를 바로잡았습니다.
