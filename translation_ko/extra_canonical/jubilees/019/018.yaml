    reason: 원문의 재귀적 귀속 표현을 보존하면서, 한국어 ‘자신’의 지시 대상을 분명히 합니다.
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주
  alternatives_korean:
  - 여호와
  - 야훼
  - 주님
  lexicon: proper divine name
  rationale: 영어 POB의 LORD를 Geez 원문에 따라 하나님의 이름으로 읽되, 한국어 본문에서는 문맥상 자연스러운 ‘주’로 옮겨 고유신명 호칭을 유지했습니다.
- source_word: ያኀሪ
  english_pob_choice: will choose
  chosen_korean: 택하실
  alternatives_korean:
  - 선택하실
  - 고르실
  - 뽑으실
  lexicon: בחר/choose
  rationale: 행위의 주권성과 의도성을 살리기 위해 ‘택하실’을 선택했습니다.
- source_word: ለሕዝብ
  english_pob_choice: as a people
  chosen_korean: 한 백성으로
  alternatives_korean:
  - 백성으로
  - 한 민족으로
  - 자기 백성으로
  lexicon: עם/people
  rationale: 원문의 목적격 용법을 자연스럽게 풀어 ‘한 백성으로’라고 옮겨, 단순 신분이 아니라 소속의 형성을 드러냈습니다.
- source_word: ኪያሁ
  english_pob_choice: for himself
  chosen_korean: 당신을 위해
  alternatives_korean:
  - 그를 위해
  - 자기를 위해
  - 자기 자신을 위해
  lexicon: prep+pronoun
  rationale: 히브리/게에즈식 소유·귀속 표현으로 이해하여, 선택의 목적과 귀속을 드러내는 한국어로 옮겼습니다.
theological_decisions:
- issue: 하나님의 선택과 귀속의 표현
  chosen_reading: ‘그를 당신을 위해 한 백성으로 택하실’로 옮겨 선택의 주체가 하나님이며 결과가 하나님께 속한 백성의 형성임을 드러냈습니다.
  alternative_readings:
  - ‘그를 위해 한 백성을 택하실’
  - ‘그를 자기 백성으로 택하실’
  rationale: 원문과 영어 POB는 선택의 대상(그)과 결과(한 백성)를 함께 말하므로, ‘자기 백성’처럼 익숙한 교회어로 축약하기보다 귀속 관계를 분명히 했습니다.
  doctrine_reference: 신적 주권과 언약적 소속
- issue: ‘주’의 표기
  chosen_reading: 본문에는 ‘주’로 두되, 원문 신명호칭임을 번역층에서 보존했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 외경/희년서로서 독자층 가독성을 고려할 때 ‘주’가 가장 자연스럽지만, 원문이 하나님의 고유호칭임은 해석상 유지해야 합니다.
  doctrine_reference: 신명호칭 번역 원칙
