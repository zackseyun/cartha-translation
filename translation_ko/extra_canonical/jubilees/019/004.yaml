  text: And he was patient in spirit[4], and he spoke with the sons of Heth.
  footnotes:
  - marker: '4'
    text: In verse 9, 'the report about the land' is textually difficult. The sense appears to be that Abraham did not complain about the promise of the land even though he had to request a burial place within it.
    reason: textual_variant
translation:
  language: ko
  text: 그는 마음속으로 인내하며 헷의 자손들에게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትዕግሥተ መንፈስ
  english_pob_choice: patient in spirit
  chosen_korean: 영으로 인내하였고
  alternatives_korean:
  - 마음이 인내로 가득하였고
  - 영 안에서 참을성 있었습니다
  - 영이 인내로 충만하였고
  lexicon: ትዕግሥት / መንፈስ
  rationale: 문맥은 내적 태도/상태를 말하므로, 영어 POB의 ‘patient in spirit’를 따라 ‘영으로 인내하다’로 간명하게 옮겼습니다. '마음'은 의미를 다소 현대화하지만 원문의 영(Spirit/inner spirit) 중첩을 약화시킬 수 있어 피했습니다.
- source_word: ወተረክበ ... ወእተህውከ
  english_pob_choice: and he spoke
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이야기했습니다
  - 말을 건넸습니다
  - 대답했습니다
  lexicon: ረከበ / ነገረ
  rationale: 동사의 핵심은 히브리/게에즈 문맥에서 실제 발화 행위를 나타내므로, 군더더기 없이 ‘말했습니다’로 처리했습니다. 상대가 특정 집단(헷의 자손들)이라는 점을 살려 장황한 서술은 피했습니다.
- source_word: በዝኒ ዕጉሰ
  english_pob_choice: with the sons of Heth
  chosen_korean: 헷의 자손들에게
  alternatives_korean:
  - 헷 사람들에게
  - 헷의 아들들에게
  - 헷 사람의 자손들에게
  lexicon: בְּנֵי־חֵת / sons of Heth
  rationale: 고유 집단명은 영어 POB의 ‘sons of Heth’를 따라 직역하면서도 자연스러운 한국어 인명/족속 표기인 ‘헷의 자손들’로 옮겼습니다. ‘헷 사람들’보다 족보적·성경적 호칭을 더 분명하게 드러냅니다.
theological_decisions:
- issue: ‘영’의 번역과 내적 상태 표현
  chosen_reading: 여기서는 성령이 아니라 인내하는 내적 상태를 가리키므로 ‘영’으로 번역했습니다.
  alternative_readings:
  - 성령으로 인내하였고
  - 마음으로 인내하였고
  rationale: 게에즈 원문과 영어 POB 모두 ‘in spirit’의 상태적 의미를 유지하므로, 신적 영으로 확정하지 않고 인간 내면의 태도로 옮기는 것이 안전합니다. ‘성령’로 옮기면 원문이 주는 심리적/인격적 뉘앙스를 과도하게 신학화할 수 있습니다.
  doctrine_reference: 성령/인간 영 구별
