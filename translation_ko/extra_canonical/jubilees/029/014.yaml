translation:
  language: ko
  text: 그는 그에게서 떠나 세일 땅으로 갔습니다. 그러나 야곱은 천막에서 살았습니다. 이 희년의 다섯째 주의 첫째 해에 그는 요르단을 건너 요르단 건너편에 머물렀고, 무더기의 바다[a]에서 벧산까지, 또 도단까지, 또…에 이르는 곳에서 양 떼를 먹였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무더기의 바다’는 게에즈어 본문에서 확실하지 않은 지명입니다. 그 배후에는 다른 지명이 있었을 수도 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድረ ሴኢር
  english_pob_choice: the land of Seir
  chosen_korean: 세일 땅
  alternatives_korean:
  - 세일 지역
  - 세일의 땅
  lexicon: Seir
  rationale: 지명은 음역을 유지하되, 지배적 한국어 성경 관용형보다 더 직역적인 ‘땅’을 붙여 원문의 영토 표지를 살렸습니다.
- source_word: ኀደረ፡ በምጽላላት
  english_pob_choice: dwelt in tents
  chosen_korean: 천막에 살았습니다
  alternatives_korean:
  - 장막에 살았습니다
  - 천막에서 거주했습니다
  lexicon: tent / dwell
  rationale: 야곱의 유목적 거주 방식을 분명하게 드러내기 위해 ‘천막’으로 옮겼고, 동사는 평이한 ‘살았습니다’를 택했습니다.
- source_word: ዐደወ፡ ዮርዳኖስ፡ ... ማዕዶተ፡ ዮርዳኖስ
  english_pob_choice: he crossed the Jordan and dwelt beyond the Jordan
  chosen_korean: 요르단을 건너 요르단 저편에 살았고
  alternatives_korean:
  - 요단강을 건너 강 건너편에 살았고
  - 요르단을 건너 그 너머에 살았고
