  source_fidelity: 현 초안은 절의 큰 흐름과 끝의 미완성을 대체로 보존합니다. 그러나 원문에 명시되지 않은 ‘에서’를 보충하고, 불확실한 지명 ‘Sea of Heaps’의 주석 표지가 문장 끝에 잘못 붙어 있으며 해당 한국어 각주도 없습니다. ‘모음의 바다’보다 ‘무더기의 바다’가 영어 감사 기록과 어휘 의미를 더 충실히 반영합니다.
  naturalness: ‘다섯째 주 첫해’는 현대 한국어에서 다소 어색하므로 ‘다섯째 주의 첫째 해’가 자연스럽습니다. ‘요르단 저편에 살았고’는 ‘요르단 건너편에 머물렀고’로, 목축 행위는 ‘양 떼를 먹였습니다’로 다듬는 것이 자연스럽습니다.
  terminology: 세일, 요르단, 벧산, 도단은 통용되는 성서식 지명 표기에 맞추었습니다. 불확실한 지명은 의미를 단정하지 않고 ‘무더기의 바다’로 옮긴 뒤 각주에서 불확실성을 밝혔습니다.
  issues:
  - severity: medium
    issue: 원문에 없는 ‘에서’를 보충함
