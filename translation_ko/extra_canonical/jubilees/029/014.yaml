translation:
  language: ko
  text: 그는 에서에게서 떠나 세일 땅으로 갔습니다. 야곱은 천막에 살았습니다. 그리고 이 희년의 다섯째 주 첫해에 그는 요르단을 건너 요르단 저편에 살았고, 양 떼를 모음의 바다에서 베이트-산에 이르기까지, 또 도단에 이르기까지, 또…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድረ ሴኢር
  english_pob_choice: the land of Seir
  chosen_korean: 세일 땅
  alternatives_korean:
  - 세일 지역
  - 세일의 땅
  lexicon: Seir
  rationale: 지명은 음역을 유지하되, 지배적 한국어 성경 관용형보다 더 직역적인 ‘땅’을 붙여 원문의 영토 표지를 살렸습니다.
