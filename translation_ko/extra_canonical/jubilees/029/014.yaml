  rationale: 원문의 반복 구조를 살려 ‘요르단’과 ‘요르단 저편’을 대응시켰으며, 지리적 방향성을 분명히 했습니다.
- source_word: በምጽላላት፡ ... እስከ፡ ቤተስን፡ ወእስከ፡ ዶታኤም
  english_pob_choice: from the Sea of Heaps as far as Beth-shan and as far as Dothan
  chosen_korean: 양 떼를 모음의 바다에서 베이트-산에 이르기까지, 또 도단에 이르기까지
  alternatives_korean:
  - 무더기의 바다에서 베이트-산까지, 또 도단까지
  - 무더기의 바다에서부터 베이트-산과 도단까지
  lexicon: Sea of Heaps / Beth-shan / Dothan
  rationale: ‘Sea of Heaps’는 POB가 불확실한 지명으로 표시한 표현이므로 의미를 풀이하지 않고 ‘모음의 바다’로 직역해 모호성을 보존했습니다. 베이트-산과 도단은 음역을 따랐습니다.
theological_decisions:
- issue: 이 절의 끝이 현존 본문에서 미완성임
