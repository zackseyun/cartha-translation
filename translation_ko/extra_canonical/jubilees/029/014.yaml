  lexicon: tent / dwell
  rationale: 야곱의 유목적 거주 방식을 분명하게 드러내기 위해 ‘천막’으로 옮겼고, 동사는 평이한 ‘살았습니다’를 택했습니다.
- source_word: ዐደወ፡ ዮርዳኖስ፡ ... ማዕዶተ፡ ዮርዳኖስ
  english_pob_choice: he crossed the Jordan and dwelt beyond the Jordan
  chosen_korean: 요르단을 건너 요르단 저편에 살았고
  alternatives_korean:
  - 요단강을 건너 강 건너편에 살았고
  - 요르단을 건너 그 너머에 살았고
  lexicon: Jordan / beyond the Jordan
  rationale: 원문의 반복 구조를 살려 ‘요르단’과 ‘요르단 저편’을 대응시켰으며, 지리적 방향성을 분명히 했습니다.
- source_word: በምጽላላት፡ ... እስከ፡ ቤተስን፡ ወእስከ፡ ዶታኤም
  english_pob_choice: from the Sea of Heaps as far as Beth-shan and as far as Dothan
  chosen_korean: 양 떼를 모음의 바다에서 베이트-산에 이르기까지, 또 도단에 이르기까지
  alternatives_korean:
