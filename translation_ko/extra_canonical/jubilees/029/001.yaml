  text: And it came to pass, after Rachel had borne Joseph, that Laban went to shear his sheep, for he was a three days' journey away from him.
translation:
  language: ko
  text: 라헬이 요셉을 낳은 뒤에, 라반이 자기 양털을 깎으러 갔습니다. 그는 그에게서 사흘 길 떨어져 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ፡ እምዘ፡
  english_pob_choice: And it came to pass, after...
  chosen_korean: …한 뒤에
  alternatives_korean:
  - 그리고 일이 이르러
  - 그 일이 있고 나서
  - …하고 나서
  lexicon: Geez narrative sequencing
  rationale: 서사 진행을 자연스럽게 잇되, 원문의 사건 선후 관계를 유지하기 위해 관용적 연결어구로 옮겼습니다.
- source_word: ወለደት፡ *ራሔል፡ ዮሴፍሃ፡
  english_pob_choice: after Rachel had borne Joseph
  chosen_korean: 라헬이 요셉을 낳은 뒤에
  alternatives_korean:
  - 라헬이 요셉을 낳은 후에
  - 라헬이 요셉을 출산한 뒤에
  lexicon: birth verb / proper noun
  rationale: ‘낳다’는 출산을 가장 자연스럽고 직역에 가깝게 표현하며, 인명은 한국어 성경에서 널리 쓰이는 음역을 따랐습니다.
- source_word: ወሖረ፡ ላባ፡ ይቅርጽ፡ አባግዒሁ፡
  english_pob_choice: Laban went to shear his sheep
  chosen_korean: 라반이 자기 양털을 깎으러 갔습니다
  alternatives_korean:
  - 라반이 자기 양 떼의 털을 깎으러 갔습니다
  - 라반이 자기 양을 깎으러 갔습니다
  lexicon: shear sheep
  rationale: ‘양털을 깎다’는 한국어에서 양의 털을 깎는 행위를 자연스럽게 드러내며, 목적 구문 ‘-으러 갔습니다’를 살렸습니다.
- source_word: '*እስመ፡ ርሑቅ፡ ሀሎ፡ እምኔሁ፡ ምሕዋረ፡ ሠሉስ፡ ዕለት።'
  english_pob_choice: for he was a three days' journey away from him
  chosen_korean: 그는 그에게서 사흘 길이나 떨어져 있었습니다
  alternatives_korean:
  - 그는 그에게서 사흘 길 떨어져 있었습니다
  - 그는 그와 사흘 길 떨어져 있었습니다
  lexicon: distance idiom
  rationale: ‘사흘 길’은 원문의 여행 거리 표현을 보존하고, ‘떨어져 있었습니다’로 공간적 분리를 분명히 했습니다.
theological_decisions:
- issue: 서사적 시작 공식 ‘And it came to pass’ 처리
  chosen_reading: 한국어에서는 별도의 종교적 관용구를 덧붙이지 않고 사건 전개를 매끄럽게 연결했습니다.
  alternative_readings:
  - ‘그 일이 있었습니다’처럼 더 직설적으로 옮김
  - ‘그리고 이 일은 일어났습니다’처럼 문어체 강화
  rationale: 원문은 단순 서사 접속부이므로, 의미를 보존하되 한국어 읽기 흐름을 해치지 않는 방식이 적절합니다.
  doctrine_reference: 서사 문체의 등가성
- issue: ‘three days' journey’의 거리성
  chosen_reading: 시간 표현이 아니라 이동 거리 표현으로 이해해 ‘사흘 길’로 옮겼습니다.
  alternative_readings:
  - ‘사흘 동안 가야 하는 거리’
  - ‘사흘 길의 거리’
  rationale: 원문은 소요 시간보다 지리적 거리감을 나타내며, 라반과의 분리 정도를 강조합니다.
  doctrine_reference: 본문의 지리·서사 정보 보존
