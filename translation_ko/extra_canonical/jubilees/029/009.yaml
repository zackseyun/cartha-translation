  text: “The Heap of Witness,” according to this heap. But formerly they used to call the land of Gilead the land of the Rephaim[9], for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.
  footnotes:
  - marker: '9'
    text: The place-name explanation combines 'Gilead' with a memorial feast/witness etymology and then adds an older designation connected with the Rephaim. The chapter intentionally layers these traditions.
    reason: cross_reference
  - marker: a
    text: Or '“The Feast of Witness,” according to this feast.'.
    reason: previous_rendering
translation:
  language: ko
  text: 「증인의 더미」라고, 이 더미에 따라 부릅니다. 그러나 이전에는 길르앗 땅을 르바임의 땅이라고 불렀습니다[9]. 이는 그곳이 르바임의 땅이며, 르바임이 바로 거기에서 태어났기 때문입니다. 그들은 키가 10규빗, 9규빗, 8규빗이었으며, 높이가 7규빗에 이르기까지 하는 거인들이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐተ፡ ስምዐ፡
  english_pob_choice: The Heap of Witness
  chosen_korean: 「증인의 더미」
  alternatives_korean:
  - 「증인의 축제」
  - 「증인의 기념」
  lexicon: heap = 더미; witness = 증인
  rationale: 개정된 POB 영어가 ፍሥሐተ를 ‘Heap’으로 바로잡아 길르앗 어원의 핵심인 ‘증인의 더미’를 살리므로, 한국어도 그 지시를 따라 ‘더미’로 옮겼습니다.
- source_word: ገለአድ
  english_pob_choice: Gilead
  chosen_korean: 길르앗
  alternatives_korean:
  - 길레아드
  lexicon: 고유명사 음역
  rationale: 성서에서 이미 널리 정착한 한국어 형태인 ‘길르앗’을 사용해 가독성과 식별성을 유지했습니다.
- source_word: ምድረ፡ ራፋኤል፡ / ረፋኤም፡
  english_pob_choice: the land of the Rephaim / the Rephaim
  chosen_korean: 르바임의 땅 / 르바임
  alternatives_korean:
  - 레파임의 땅 / 레파임
  lexicon: 고유명사 음역
  rationale: 히브리 성경 전승과 한국어 성서 관용을 고려해 ‘르바임’을 택했고, 반복되는 지명 설명도 같은 음역으로 통일했습니다.
- source_word: ረዐይት፡ እለ፡ ፲ሥር፡ ... ወእስከ፡ ስብዕ፡ በአመት፡
  english_pob_choice: giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature
  chosen_korean: 키가 10규빗, 9규빗, 8규빗이었으며, 높이가 7규빗에 이르기까지 하는 거인들
  alternatives_korean:
  - 키가 10규빗, 9규빗, 8규빗에서 7규빗까지인 거인들
  lexicon: cubits = 규빗; stature/height = 키/높이
  rationale: 길이 단위는 본문을 따라 ‘규빗’으로 직역하고, 반복된 수치를 보존해 거인의 과장된 체격을 그대로 드러냈습니다.
theological_decisions:
- issue: 이 구절의 지명 설명이 전승적으로 중첩되어 있는 방식
  chosen_reading: ‘증인의 더미’와 ‘르바임의 땅’이라는 두 층위의 설명을 모두 보존했습니다.
  alternative_readings:
  - 축제/기쁨을 뜻하는 것으로 평탄화해 번역
  - 르바임 전승만 남기고 더미 어원 설명을 생략
  rationale: 본문은 길르앗의 이름 풀이와 더 오래된 르바임 명칭을 의도적으로 겹쳐 제시하므로, 어느 한 층위로 단순화하지 않고 둘 다 살렸습니다.
  doctrine_reference: 성서 본문 내 전승 보존과 역사적 층위의 공존
