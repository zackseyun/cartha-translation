revisions:
- from: 「증인의 더미」라고, 이 더미에 따라 부릅니다. 그러나 이전에는 길르앗 땅을 르바임의 땅이라고 불렀습니다[9]. 이는 그곳이 르바임의 땅이며, 르바임이 바로 거기에서 태어났기 때문입니다. 그들은 키가 10규빗, 9규빗, 8규빗이었으며, 높이가 7규빗에 이르기까지 하는 거인들이었습니다.
  to: 이 더미를 따라 「증인의 더미」라고 불렀습니다. 그러나 예전에는 길르앗 땅을 르바임의 땅이라고 불렀습니다[9]. 그곳이 르바임의 땅이었고 르바임이 그곳에서 태어났기 때문입니다. 그들은 키가 열 규빗에서 아홉 규빗, 여덟 규빗, 일곱 규빗까지인 거인들이었습니다.
  rationale: 명명 행위의 대상과 과거 서사 시제를 명확히 하고, 거인들의 키를 열 규빗부터 일곱 규빗까지의 나열로 자연스럽게 고쳤습니다. ‘증인의 더미’라는 본문상 지명 풀이, 길르앗과 르바임의 음역, 규빗 단위, 그리고 전승이 중첩된다는 각주는 유지했습니다.
