  rationale: Geez의 소유격 표현을 자연스럽게 옮기되, 성경체에서 익숙한 ‘자손’을 유지해 혈통·집단 표지를 살렸습니다.
- source_word: ደብረ ሔርሞን
  english_pob_choice: Mount Hermon
  chosen_korean: 헤르몬 산
  alternatives_korean:
  - 헤르몬산
  - 헤르몬
  lexicon: source-note
  rationale: 지명은 현대 표기 관행에 따라 ‘헤르몬 산’으로 옮겨 가독성을 높였습니다.
