  english_pob_choice: and the house of
  chosen_korean: 그리고 베이트의…
  alternatives_korean:
  - 그리고 집의…
  - 그리고 그 집의…
  - 그리고 벧의…
  lexicon: source-note
  rationale: 문맥상 Geez의 ወቤተ는 완결된 고유명사 ‘베델’이 아니라 미완의 구성형 ‘그리고 ~의 집/지역’이므로, 의미를 과잉 보충하지 않고 미완성을 드러내어 옮겼습니다.
