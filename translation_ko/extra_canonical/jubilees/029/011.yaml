  source_fidelity: 원문과 영어 감사 기록에 따라 መንግሥቶሙ는 복수로 옮겨야 합니다. 또한 지명 목록의 전승상 불확실성을 설명하는 주석은 목록 끝에 붙어야 합니다. 나머지 내용, 곧 악한 행위로 인한 멸망, 아모리 사람들의 대체 거주, 그리고 죄를 다 채운 민족과 멸절에 관한 진술은 대체로 충실합니다.
  naturalness: 합쇼체 문체는 전반적으로 자연스럽습니다. 다만 ‘그들의 왕국은’은 복수 지명 열거와 맞지 않으므로 ‘그들의 왕국들은’으로 고치는 것이 문법적·의미상 적절합니다. ‘그들 대신 거주하게 하셨으니’도 자연스럽고 원문의 대체 거주 의미를 보존합니다.
  terminology: ‘주님’, ‘아모리 사람들’, ‘무법한’, ‘악하고 죄 많은 백성’은 현대 표준 한국어 성서 문체 안에서 적절합니다. 카르나임·아스다롯·에드레이·미수르·베온은 보수적 음역으로 유지하되, 지명 목록 뒤에 전승상의 난점을 알리는 주석을 둡니다.
