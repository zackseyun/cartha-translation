base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029/011.yaml
  text: their kingdoms were Karnaim and Ashtaroth and Edrei and Misur and Beon[11]. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people to this day that has completed all their sins, and they no longer exist.
  footnotes:
  - marker: '11'
    text: Several place-names in the Rephaim territory list are difficult in Ethiopic transmission; the English transliterations are conservative.
    reason: textual_variant
  - marker: a
    text: Or 'Beon. And the Lord destroyed them because of the evil of their deeds[11]'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 왕국들은 카르나임과 아스다롯과 에드레이와 미수르와 베온이었습니다.[11] 주님께서는 그들의 행위의 악함 때문에 그들을 멸하셨습니다. 그들은 매우 무법한 사람들이었기 때문입니다. 그리고 그분은 아모리 사람들을 그들 대신 거주하게 하셨으니, 그들은 악하고 죄 많은 백성이었습니다. 오늘에 이르기까지 자기들의 모든 죄를 다 채운 민족은 없으며, 그들은 더 이상 존재하지 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '11'
    text: 르바임 지역의 지명 목록에 있는 몇몇 지명은 에티오피아어 전승에서 판독이 어렵습니다. 여기의 음역은 보수적으로 처리했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: መንግሥቶሙ
  english_pob_choice: their kingdoms
  chosen_korean: 그들의 왕국은
  alternatives_korean:
  - 그들의 나라들은
  - 그들의 통치권은
  lexicon: መንግሥት
  rationale: 복수 소유를 살려 ‘왕국은’으로 옮겼습니다. 본문이 여러 지명에 대응하는 복수 영역을 말하므로 단수화하지 않았습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님께서는
  alternatives_korean:
  - 야훼께서는
  - 하나님께서는
  lexicon: יהוה / κύριος
  rationale: 게에즈 본문은 하나님의 주권적 행위를 가리키므로 한국어 본문에서는 ‘주님’으로 자연스럽게 옮겼습니다. 여기서는 명시적 야훼 표기보다 서술 흐름을 우선했습니다.
- source_word: እምእኩየ ምግባሮሙ
  english_pob_choice: because of the evil of their deeds
  chosen_korean: 그들의 행위의 악함 때문에
  alternatives_korean:
  - 그들의 악한 행위 때문에
  - 그들의 악행 때문에
  lexicon: እኩይ / ምግባር
  rationale: 원인의 핵심인 ‘행위의 악함’을 보존해 단순히 ‘악행’으로 축약하지 않았습니다.
- source_word: ጸዋጋን ጥቀ እሙንቱ
  english_pob_choice: they were very lawless
  chosen_korean: 그들은 매우 무법한 사람들이었기 때문입니다
  alternatives_korean:
  - 그들은 몹시 법을 어기는 자들이었기 때문입니다
  - 그들은 매우 법 없는 사람들이었기 때문입니다
  lexicon: ጸዋጋን
  rationale: 영 POB의 ‘lawless’를 따라 도덕적·법적 무질서를 드러내는 ‘무법한’으로 옮겼습니다.
- source_word: ወአኅደረ ... ህየንቴሆሙ
  english_pob_choice: and he caused the Amorites to dwell in their place
  chosen_korean: 그리고 그분은 아모리 사람들을 그들 대신 거주하게 하셨으니
  alternatives_korean:
  - 그리고 그분은 아모리 사람들을 그들 자리에 살게 하셨으니
  - 그리고 그분은 아모리 사람들을 그들의 자리로 옮기셨으니
  lexicon: አኅደረ
  rationale: ‘거주하게 하다’가 정착·대체 거주의 의미를 가장 직접적으로 보존합니다. ‘자리’보다 문어적으로 안정적인 ‘대신’ 구조를 택했습니다.
- source_word: ወአልቦ፡ ... ዮም
  english_pob_choice: there is no people to this day
  chosen_korean: 오늘에 이르기까지 ... 민족은 없으며
  alternatives_korean:
  - 이날까지 ... 민족은 없으며
  - 지금까지 ... 민족은 없으며
  lexicon: ዮም
  rationale: English audit trail의 ‘to this day’를 반영해 현재 지속을 드러내는 관용적 표현으로 옮겼습니다.
theological_decisions:
- issue: 아모리 사람들의 거주가 하나님의 심판 행위로 제시됨
  chosen_reading: 그분은 아모리 사람들을 그들 대신 거주하게 하셨습니다
  alternative_readings:
  - 아모리 사람들을 그들 자리에 두셨습니다
  - 아모리 사람들을 그들 곁에 살게 하셨습니다
  rationale: 본문은 단순한 인구 이동이 아니라 선행하는 멸망과 연결된 심판-대체의 서술이므로, ‘대신 거주하게 하셨다’로 인과를 분명히 했습니다.
  doctrine_reference: 섭리와 심판의 역사 서술
