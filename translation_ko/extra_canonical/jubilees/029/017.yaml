  language: ko
  text: 봄과 비와 한겨울과 여름이 아브라함의 탑[a]에 있었습니다. 이삭은 맹세의 우물에서 돌아와 자기 아버지 아브라함의 탑[a]으로 올라갔습니다.
  philosophy: optimal-equivalence
  footnotes:
