  source_fidelity: 게에즈 본문에서 ማኅፈደ(maḫfäd)가 두 차례 모두 사용되므로, 두 번째 장소도 첫 번째와 동일하게 ‘탑’으로 번역해야 합니다. 초안의 ‘굴’은 원문과 일치하지 않습니다. 계절·기후의 열거와 ‘맹세의 우물’에서 돌아온 뒤 올라갔다는 서술은 보존했습니다.
