    text: 또는 ‘굴’.
    reason: 게에즈어 ማኅፈደ의 대안적 번역 가능성을 알립니다. 그러나 이 절에서는 같은 단어가 두 번 나오므로 본문은 일관되게 ‘탑’으로 번역하고, 두 용례 모두에 표지를 붙였습니다.
