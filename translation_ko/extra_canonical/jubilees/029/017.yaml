  terminology: 아브라함, 이삭, 맹세의 우물, 탑을 일관되게 사용했습니다. ‘굴’이라는 대안은 본문이 아니라 각주에서만 어휘적 가능성으로 제시하여, 영어 POB 감사 기록의 각주 취지를 보존합니다.
