translation:
  language: ko
  text: 야곱은 라반이 자기 양털을 깎으러 갔음을 보고, 레아와 라헬을 불러 그들에게 말하여, 그와 함께 가나안 땅으로 오게 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐውር፡ ላባ፡ ይቅርጽ፡ አባግዒሁ፡
  english_pob_choice: that Laban had gone to shear his sheep
  chosen_korean: 라반이 자기 양털을 깎으러 갔음을
  alternatives_korean:
  - 라반이 자기 양들을 깎으러 갔음을
  - 라반이 자기 양 떼를 깎으러 갔음을
  lexicon: Ge'ez verb phrase describing Laban's departure for sheep-shearing
  rationale: 문맥상 목양 대상은 ‘양’이며, 한국어에서는 ‘양털을 깎다’가 자연스럽고 행위의 목적을 분명히 드러냅니다.
- source_word: ወጸውዖን፡
  english_pob_choice: called Leah and Rachel
  chosen_korean: 레아와 라헬을 불러
  alternatives_korean:
  - 레아와 라헬을 부르고
  - 레아와 라헬을 소집하여
  lexicon: verb of summoning/calling
  rationale: 본문의 단순한 호출을 살려 ‘불러’로 옮겼습니다.
- source_word: ውስተ፡ ልቦን፡
  english_pob_choice: spoke to them
  chosen_korean: 그들에게 말하여
  alternatives_korean:
  - 그들의 마음에 말하여
  - 그들의 마음에 이르러 말하여
  lexicon: Semitic idiom literally 'into their hearts'
  rationale: 게에즈 원문은 ‘그들의 마음 안으로’라는 표현이지만, 한국어 본문은 유창성을 위해 직접형으로 두고 이 뉘앙스는 본문 의미에 반영했습니다.
- source_word: ምድረ፡ ከናአን።
  english_pob_choice: the land of Canaan
  chosen_korean: 가나안 땅
  alternatives_korean:
  - 가나안의 땅
  - 가나안 지역
  lexicon: standard biblical place-name
  rationale: 성서 지리명으로서 관용적인 한국어 표현을 사용했습니다.
theological_decisions:
- issue: ‘spoke to their hearts’의 처리
  chosen_reading: 본문에는 직접적 의미를 살린 ‘그들에게 말하여’로 두고, 내면을 겨냥한 설득의 뉘앙스는 과도하게 해석하지 않았습니다.
  alternative_readings:
  - ‘그들의 마음에 말하여’
  - ‘마음을 움직이려고 말하여’
  rationale: 게에즈 표현은 강한 정서적·설득적 뉘앙스를 가질 수 있으나, 여기서는 서술의 간결함과 출판용 가독성을 우선해 과잉 해석을 피했습니다.
  doctrine_reference: 서사 본문 번역 원칙
