translation:
  language: ko
  text: 야곱은 라반이 자기 양털을 깎으러 갔음을 보고, 레아와 라헬을 불러 그들의 마음에 말하여,[a] 그들이 그와 함께 가나안 땅으로 가도록 말하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그들의 마음에 말하여’입니다. 마음을 향해 말하는, 친밀하거나 설득력 있는 말하기를 나타내는 표현일 수 있습니다.
    reason: 게에즈어 관용 표현의 문자적 형태와 가능한 정서적·설득적 뉘앙스를 보존하되, 특정 해석으로 한정하지 않습니다.
