  yaml_path: translation/extra_canonical/jubilees/029/007.yaml
  text: by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain.
translation:
  language: ko
  text: 그리고 밤에 라반에게 야곱에 관해 말했습니다. 그리고 그 기간의 열다섯째 날에 야곱은 라반과 라반과 함께 온 모든 사람을 위하여 잔치를 베풀었습니다. 야곱은 그날 라반에게 맹세했고, 라반도 야곱에게 맹세했습니다. 그 산에서, 어느 쪽도 악한 의도를 품고 상대방에게 건너가지 않겠다고 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሌሊተ፡ ... ወነገሮ፡ ላባ፡ ለያዕቆብ።
  english_pob_choice: by night and told Laban concerning Jacob
  chosen_korean: 그리고 밤에 라반에게 야곱에 관해 말했습니다
  alternatives_korean:
  - 밤에 라반에게 야곱을 알렸습니다
  - 밤에 라반에게 야곱에 대하여 이야기했습니다
  lexicon: 밤 / 말하다
  rationale: Geez 원문은 ‘밤에’와 ‘라반에게 말하다’를 분명히 하며, 영어 POB의 ‘concerning Jacob’은 야곱을 주제로 한 진술임을 보여 주므로 한국어에서도 ‘야곱에 관해 말했습니다’로 옮겼습니다.
- source_word: ገብረ፡ ያዕቆብ፡ ግዝአ፡ ለላባ፡ ወለኵሎሙ፡ እለ፡ መጽኡ፡ ምስሌሁ።
  english_pob_choice: Jacob made a feast for Laban and for all who had come with him
  chosen_korean: 야곱은 라반과 그와 함께 온 모든 사람을 위해 잔치를 베풀었습니다
  alternatives_korean:
  - 야곱은 라반과 그와 함께 온 모든 사람에게 잔치를 차렸습니다
  - 야곱은 라반과 그와 함께 온 모든 사람을 위해 연회를 베풀었습니다
  lexicon: 잔치를 베풀다
  rationale: ‘feast’는 단순 식사가 아니라 접대를 포함한 잔치/연회의 뜻이므로, 현대 한국어에서도 자연스럽고 격식 있는 ‘잔치를 베풀었습니다’가 원문의 행위를 잘 드러냅니다.
- source_word: መሐለ፡ ... ከመ፡ ኢይትዐደዉ፡ አሐዱ፡ ኀበ፡ ካልኡ፡ በእኩይ፡
  english_pob_choice: swore ... that neither would cross over to the other with evil intent
  chosen_korean: 맹세하여, 둘 다 악한 의도를 품고 서로를 향해 건너지 않겠다고
  alternatives_korean:
  - 맹세하여, 서로를 악의로 넘어가지 않겠다고
  - 맹세하여, 서로에게 해를 끼치러 건너지 않겠다고
  lexicon: 건너지 않다 / 악한 의도
  rationale: 원문 동사는 ‘건너다/넘다’의 물리적 이동을 유지하며, POB의 ‘with evil intent’를 ‘악한 의도를 품고’로 옮겨 의미를 명시했습니다.
- source_word: በደብረ፡
  english_pob_choice: on the mountain
  chosen_korean: — 그 산에서
  alternatives_korean:
  - — 산에서
  - — 그 산 위에서
  lexicon: 산
  rationale: 아랍/게에즈 계열 전승의 지시가 뒤에 생략되어 있으나, 현존 원문과 최신 POB 개정이 단순히 ‘the mountain’으로 끝나므로, 불필요한 보충 없이 한국어에서도 ‘그 산에서’로 마무리했습니다.
theological_decisions:
- issue: 형제/동맹 간 상호 불가침 맹세의 표현
  chosen_reading: 서로를 향해 악한 의도를 품고 건너지 않겠다는 상호 맹세로 분명히 옮겼습니다.
  alternative_readings:
  - 단순히 서로 해치지 않겠다고 완화
  - 추상적으로 화해했다고 요약
  rationale: 본문은 단순한 화해 진술보다 ‘악한 의도’와 ‘건너감’의 금지를 포함한 서약을 강조하므로, 그 긴장을 보존해야 합니다.
  doctrine_reference: 서약과 언약적 신실성의 서술적 표현
