translation:
  language: ko
  text: 그리하여 땅 위에 생명이 더 이상 없었습니다.[a] 야곱은 라반을 보내고, 동쪽 땅 메소포타미아로 갔으며, 야곱은 길르앗 땅으로 돌아왔습니다. 그는 아홉째 달 열하루에 얍복을 건넜고, 바로 그날 그의 형 에서가 그에게 왔으며, 그는 그와 화해하였습니다.
  philosophy: optimal-equivalence
