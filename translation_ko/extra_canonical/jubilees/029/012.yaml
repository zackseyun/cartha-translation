theological_decisions:
- issue: ‘life upon the earth’의 종결성
  chosen_reading: 지상에 더 이상 생명이 남지 않은 상태를 가리키는 종결 서술로 읽었습니다.
  alternative_readings:
  - 땅 위에 생명이 전혀 없었다는 단순 진술
  - 남은 생명의 흔적이 없었다는 완곡한 진술
  rationale: 영문 POB 주석도 이 구절이 ‘남은 생명’의 의미일 수 있음을 밝히므로, 단순한 무생물 진술보다 소멸/잔존 없음의 뉘앙스를 살렸습니다.
  doctrine_reference: textual sense and narrative context
- issue: 이 구절의 문장 연결 방식
  chosen_reading: 첫 문장을 독립적으로 마무리한 뒤 야곱의 이동 서술을 이어서 번역했습니다.
  alternative_readings:
  - 첫 문장과 다음 사건을 더 강하게 연결하는 방식
  - 주석 표지를 문장 끝에 붙여 연속성을 강조하는 방식
  rationale: 영문 POB의 수정 이력처럼 주석 표지는 ‘life upon the earth’에 붙어야 하므로, 본문 의미와 주석 위치를 분리해 가독성과 감사 가능성을 함께 확보했습니다.
  doctrine_reference: editorial alignment
