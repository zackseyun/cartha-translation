translation:
  language: ko
  text: 그리하여 땅 위에 생명이 더 이상 없었습니다.[a] 야곱은 라반을 떠나보내고 동쪽 땅 메소포타미아로 갔으며, 야곱은 길르앗 땅으로 돌아왔습니다. 그는 아홉째 달 열한째 날에 얍복을 건넜고, 바로 그날 그의 형 에서가 그에게 와서 야곱과 화해하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들에게는 땅 위에 더 이상 생명이 없었다’는 말은 ‘그들에게 땅 위에 남아 있는 생명의 흔적이 없었다’로도 이해할 수 있습니다.
    reason: alternative_reading
