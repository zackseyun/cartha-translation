  text: And he journeyed on the next morning to the land of Gilead. And Jacob crossed the Jabbok in the ninth month, on the eleventh of it, and on this day Esau his brother came to him, and they were reconciled.
  footnotes:
  - marker: a
    text: Or 'in the first year of the tenth week'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 이튿날 아침 길르앗 땅으로 갔습니다. 야곱은 아홉째 달, 그 달 열하루째 되는 날에[a] 얍복을 건넜고, 바로 그날 그의 형 에서가 그에게 왔으며, 그들은 화해했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “열째 주간의 첫째 해에.”
    reason: 영어 POB 감사 기록에 보존된 대안 독법입니다. 본문은 게에즈어와 최신 본문 검토에 따라 ‘그 달 열하루째 되는 날’로 번역합니다.
