  rationale: 동사의 핵심 의미는 강/경계의 ‘건넘’이므로 ‘건넜고’로 옮기고, 고유지명 얍복은 한국어 관용 표기를 따랐습니다.
- source_word: በታስዕ፡ ወርኅ፡ ... አመ፡ ፲ሡሩ፡ ወአሚሩ፡
  english_pob_choice: in the ninth month, on the eleventh of it
  chosen_korean: 아홉째 달, 그 달의 열한째 날
  alternatives_korean:
  - 제9월, 그 달의 11일
  - 아홉째 달, 그 달의 열하루째
  lexicon: 달
  rationale: 본문의 연대 표현은 ‘열한째 날’이므로 ‘11일’로 단순화하지 않고, 월과 일의 구조를 그대로 살렸습니다.
- source_word: ወተኂነኖ፡
  english_pob_choice: and they were reconciled
  chosen_korean: 그들은 화해했습니다
  alternatives_korean:
  - 그들은 화목해졌습니다
  - 그들은 서로 화해했습니다
  lexicon: 화해하다
  rationale: 관계 회복의 결과를 가장 직접적으로 드러내는 동사로 ‘화해했습니다’를 선택했습니다.
theological_decisions:
- issue: 에서와 야곱의 관계 회복 표현
  chosen_reading: ‘화해했습니다’로 관계의 실제 회복을 분명히 나타냈습니다.
  alternative_readings:
  - ‘화목해졌습니다’
  - ‘서로 마음을 풀었습니다’
  rationale: 본문의 결말은 단순한 만남이 아니라 갈등 해소와 관계 회복을 가리키므로, 그 의미를 약화시키지 않는 표현을 택했습니다.
