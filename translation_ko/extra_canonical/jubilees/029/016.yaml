translation:
  language: ko
  text: 그리고 마시고, 우유와 버터와 우유로 만든 빵과 모든 이의 가르침에서 비롯된 것[16]을 주었습니다. 또한 그의 어머니 리브가를 위해서는 해의 사분의 일 동안, 달의 기간들 가운데 한가운데에서, 밭갈이와 거두기 사이의 때에, 곧 한가운데에 있었습니다.
  philosophy: optimal-equivalence
