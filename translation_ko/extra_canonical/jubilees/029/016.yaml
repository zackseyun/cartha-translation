  lexicon: Geez time expression
  rationale: ‘a fourth of the year’를 자연스러운 현대 한국어로 풀어 ‘해의 사분의 일’로 옮겼습니다.
- source_word: ማእከለ፡ ጊዜያቲሆሙ፡ ለአውራኅ፡ ወማእከለ፡ ሐፅኒ፡ ወለ'ዐጺድ፡ ወማእከለ፡
  english_pob_choice: in the middle of their times of the months ... between plowing and reaping ... and in the middle
