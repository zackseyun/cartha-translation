  yaml_path: translation/extra_canonical/jubilees/029/005.yaml
  text: the land of Gilead. And Jacob concealed his heart from Laban and did not tell him. And in the seventh year of the fourth week[5], Jacob set out for Gilead in the first month, on the twenty-first; and Laban pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.
  footnotes:
  - marker: '5'
    text: The chronology in this verse is difficult because the pursuit and overtaking are linked across months. The translation preserves the stated dates rather than harmonizing them.
    reason: segmentation_note
  - marker: a
    text: Or 'and Laban heard and pursued after him'.
    reason: previous_rendering
translation:
  language: ko
  text: 길르앗 땅. 야곱은 라반에게 자기 마음을 숨기고 알리지 않았습니다. 그리고 넷째 주의 일곱째 해 첫째 달 스물하루에 야곱은 길르앗으로 떠났고, 라반은 그를 뒤쫓아 갔으며, 셋째 달 열셋째 날 길르앗 산에서 야곱을 따라잡았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልቦ
  english_pob_choice: concealed his heart
  chosen_korean: 자기 마음을 숨기고
  alternatives_korean:
  - 자기 뜻을 숨기고
  - 속마음을 숨기고
  lexicon: 심장/마음의 비유적 용례
  rationale: 게에즈의 ‘마음/심장’을 영어 POB처럼 의도나 계획보다 더 직접적으로 ‘마음’으로 옮기되, 한국어에서는 자연스럽게 ‘자기 마음을 숨기고’로 표현했습니다.
- source_word: ወኀብአ ... ወአነገሮ
  english_pob_choice: did not tell him
  chosen_korean: 알리지 않았습니다
  alternatives_korean:
  - 말하지 않았습니다
  - 알려 주지 않았습니다
  lexicon: 알리다/말하다
  rationale: 문맥상 단순한 침묵보다 상대에게 정보를 전달하지 않았다는 뜻이므로 ‘알리지 않았습니다’가 가장 간결하고 정확합니다.
- source_word: በሳብዕ ዓም ... በቀዳሚ ወርኅ አመ ፳ሥራሁ
  english_pob_choice: in the seventh year of the fourth week ... in the first month, on the twenty-first
  chosen_korean: 넷째 주의 일곱째 해 첫째 달 스물하루에
  alternatives_korean:
  - 넷째 주의 일곱째 해 첫째 달 21일에
  - 넷째 주의 일곱째 해 첫째 달 스물한 날에
  lexicon: 주/해/달/날짜 표현
  rationale: 희년서의 연대기 표현을 직역하되 한국어 읽기 흐름을 살려 ‘스물하루에’로 자연스럽게 정리했습니다.
- source_word: ወደገኖ ... ድኅሬሁ
  english_pob_choice: Laban pursued after him
  chosen_korean: 라반은 그를 뒤쫓아 갔으며
  alternatives_korean:
  - 라반은 그를 추격했으며
  - 라반은 그 뒤를 쫓았으며
  lexicon: 뒤쫓다/추격하다
  rationale: 게에즈 동사의 단순한 추격 의미를 살리면서도, 서술체에서 자연스러운 ‘뒤쫓아 갔으며’로 옮겼습니다.
- source_word: በደብረ፡ ገላአድ
  english_pob_choice: on the mountain of Gilead
  chosen_korean: 길르앗 산에서
  alternatives_korean:
  - 길르앗 산 위에서
  - 길르앗의 산에서
  lexicon: 지명+산
  rationale: 관용적으로 굳어진 성경 지명 표현을 따라 ‘길르앗 산’으로 옮겼습니다.
theological_decisions:
- issue: 희년서의 절기/주간 연대기 표현을 한국어에서 어떻게 보존할지
  chosen_reading: ‘넷째 주의 일곱째 해’와 같은 구조를 그대로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘해당 주기의 일곱째 해’로 의역하기
  - 현대 달력식으로 재구성하기
  rationale: 본문의 연대기 체계 자체가 정보이므로, 독자가 원문 구조를 추적할 수 있도록 평준화하지 않고 보존했습니다.
  doctrine_reference: 본문 충실성과 원문 구조 보존 원칙
- issue: ‘마음을 숨기다’의 해석 범위
  chosen_reading: 행동의 속임수보다 내면/의도를 감추는 표현으로 읽었습니다.
  alternative_readings:
  - 단순히 ‘말하지 않았다’로 축소하기
  - ‘의도를 숨기다’로 재해석하기
  rationale: 영어 POB가 ‘heart’를 유지했고, 게에즈 원문도 내면을 가리키므로 도덕적 평가를 덧씌우지 않은 채 내적 비밀성만 드러냈습니다.
  doctrine_reference: 어휘적 등가성과 내면 표현의 보존
