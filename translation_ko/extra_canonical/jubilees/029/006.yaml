  text: And the Lord did not allow him to devise harm against Jacob, because he had appeared to him in a dream.
translation:
  language: ko
  text: 그리고 주님께서는 그가 야곱에게 해를 꾀하도록 허락하지 않으셨습니다. 그분이 꿈에서 그에게 나타나셨기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 주
  lexicon: God / Lord
  rationale: 게에즈 원문의 신적 주어를 영어 POB의 'the Lord'에 맞춰 한국어에서는 관계적·경칭적 자연성을 살려 '주님'으로 옮겼습니다.
- source_word: ከመ፡ ይሕስም፡
  english_pob_choice: devise harm
  chosen_korean: 해를 꾀하다
  alternatives_korean:
  - 해를 계획하다
  - 악을 도모하다
  - 해를 생각하다
  lexicon: harm / devise
  rationale: 동사의 핵심은 단순한 생각이 아니라 야곱에게 해를 꾸미는 의도적 계략이므로, '해를 꾀하다'로 간결하게 반영했습니다.
- source_word: በሕልም፡
  english_pob_choice: in a dream
  chosen_korean: 꿈에서
  alternatives_korean:
  - 꿈속에서
  - 한 꿈으로
  lexicon: dream
  rationale: 원문은 계시의 수단으로서 꿈을 가리키며, 한국어에서는 자연스럽고 문맥상 분명한 '꿈에서'가 적절합니다.
theological_decisions:
- issue: 신적 개입의 인과 관계 표현
  chosen_reading: 주님께서 미리 꿈으로 나타나셨기 때문에 그가 야곱에게 해를 꾀하지 못하도록 허락하지 않으셨다는 인과를 분명히 드러냈습니다.
  alternative_readings:
  - '''왜냐하면''으로 직역해 앞뒤를 평행하게 배열하는 방식'
  - 단순히 두 절을 나란히 놓아 인과를 약화시키는 방식
  rationale: 영어 POB의 개정판이 'because he had appeared'로 바꾸어 선행한 현현이 금지의 이유임을 분명히 했으므로, 한국어도 그 인과성을 유지해야 합니다.
  doctrine_reference: 섭리와 계시의 선행성
- issue: 꿈을 통한 계시의 현실성
  chosen_reading: '''그분이 꿈에서 그에게 나타나셨기 때문입니다''로 옮겨, 꿈을 단순한 내적 감정이 아니라 실제 계시의 매개로 표현했습니다.'
  alternative_readings:
  - '''그가 꿈을 꾸었기 때문입니다'''
  - '''꿈을 통해 알려주셨기 때문입니다'''
  rationale: 원문 동사는 실제 '나타나다'를 뜻하며, 문맥상 야곱의 상대방에게 미친 제지의 근거이므로 계시적 현현을 유지하는 것이 맞습니다.
  doctrine_reference: 계시와 섭리
