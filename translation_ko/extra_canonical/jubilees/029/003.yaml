  text: For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should return to his father's house; and he said to him, “Go to every place, wherever you go.””
  footnotes:
  - marker: a
    text: Or 'enter'.
    reason: previous_rendering
  - marker: b
    text: Or 'and I will be with you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 꿈에서 본 모든 것과 아버지의 집으로 돌아가야 한다고 그에게 말해진 모든 것을 그들에게 말하였습니다. 그리고 그에게 이렇게 말하였습니다. 「모든 곳으로 가십시오. 어디로 가든지.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገሮን
  english_pob_choice: For he told them
  chosen_korean: 그는 그들에게 말하였습니다
  alternatives_korean:
  - 그는 그들에게 알렸습니다
  - 그는 그들에게 이야기하였습니다
  lexicon: Geez ነገረ / 말하다 계열
  rationale: 서술형으로 단순히 ‘말하다/알리다’의 핵심 행위를 살리되, 본문의 반복 구조에 맞게 과도한 해석 없이 옮겼습니다.
- source_word: በህልም
  english_pob_choice: what he had seen in the dream
  chosen_korean: 꿈에서 본 모든 것
  alternatives_korean:
  - 꿈에서 본 것 모두
  - 꿈에서 보았던 모든 것
  lexicon: Geez ሕልም / 꿈
  rationale: ‘본 것’이라는 시각적 경험과 ‘모든 것’의 총괄성을 함께 살려, 영어 POB의 어순보다 원문의 포괄성을 우선했습니다.
- source_word: ዘተናገረ ሎቱ
  english_pob_choice: what had been spoken to him
  chosen_korean: 그에게 말해진 모든 것을
  alternatives_korean:
  - 그에게 전해진 모든 것을
  - 그에게 언급된 모든 것을
  lexicon: Geez ተናገረ / 말해지다
  rationale: 수동적 전달을 드러내기 위해 ‘말해진’으로 옮겨, 단순 능동 ‘들었다’보다 원문의 피동 뉘앙스를 보존했습니다.
- source_word: ከመ ይግባእ ቤተ አቡሁ
  english_pob_choice: that he should return to his father's house
  chosen_korean: 아버지의 집으로 돌아가야 한다고
  alternatives_korean:
  - 아버지의 집으로 돌아가야 한다는
  - 아버지의 집으로 돌아가야 하리라고
  lexicon: Geez ይግባእ / 돌아가다
  rationale: 주석된 영어 개정에 따라 ‘enter’가 아니라 ‘return’의 의미를 반영해야 하므로, 집 안으로 들어감이 아니라 귀향의 방향성을 살렸습니다.
- source_word: ሖውር ውስተ ኵሉ መካን ወአይ ተሐውር
  english_pob_choice: Go to every place, wherever you go.
  chosen_korean: 모든 곳으로 가십시오. 어디로 가든지.
  alternatives_korean:
  - 모든 곳으로 가십시오. 당신이 가는 어디든지.
  - 모든 장소로 가십시오. 어디를 가든지.
  lexicon: Geez ሖውር / 가다, ውስተ ኵሉ መካን / 모든 곳
  rationale: 본문의 이동 명령과 장소 범위를 자연스러운 현대 한국어로 옮기되, 영어 POB의 최종 수정처럼 ‘with you’를 보강하지 않고 현존하는 게에즈 본문을 따랐습니다.
theological_decisions:
- issue: 영문 전승 보강구절('I will be with you')을 한국어 본문에 넣을지 여부
  chosen_reading: 현존 게에즈 본문에 따라 보강구절 없이 번역했습니다.
  alternative_readings:
  - ‘내가 너와 함께하겠다’를 포함하는 교차본문식 복원
  - 영문 POB 초기형을 따라 보강구절을 반영
  rationale: 최신 검토가 이 구절을 후대적/복원적 삽입으로 보았으므로, 번역문에서는 현전하는 원문을 우선해 독자에게 실제 전승 상태를 그대로 보여주는 편이 더 투명합니다.
  doctrine_reference: 본문비평 원칙
