- from: 그는 꿈에서 본 모든 것과, 아버지의 집으로 돌아가야 한다고 그에게 말해진 모든 것을 그들에게 말하였습니다. 그리고 그에게 말하였습니다. 「모든 곳으로 가십시오. 어디로 가든지.」
  to: 그는 꿈에서 본 모든 것과 아버지의 집으로 돌아가야 한다고 그에게 말해진 모든 것을 그들에게 말하였습니다. 그리고 그에게 이렇게 말하였습니다. 「모든 곳으로 가십시오. 어디로 가든지.」
  rationale: 직접 인용을 이끄는 두 번째 발화문에 ‘이렇게’를 보태어 현대 한국어 문장을 자연스럽게 했습니다. ‘돌아가야 한다’와 마지막의 ‘어디로 가든지’는 현존 게에즈 본문 및 최신 영어 POB 감사 이력을 따라 유지했으며, 결락 또는 논쟁적 보강으로 보이는 ‘내가 너와 함께하겠다’는 추가하지 않았습니다. 제공된 초안에는 주석 표지가 없으므로 독립된 주석을 새로 달지 않았습니다.
