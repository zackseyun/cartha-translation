  text: Abraham his father, on the mountain of Hebron. And there Jacob kept sending to his father and to his mother, from time to time, everything they needed; and they blessed Jacob with all their heart and with all their soul.
  footnotes:
  - marker: a
    text: Or 'And Jacob kept sending'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아버지 아브라함은 헤브론 산에 있었습니다. 그곳에서 야곱은 때때로 그의 아버지와 어머니에게 그들이 필요로 하는 모든 것을 계속 보냈습니다. 그들은 온 마음과 온 영혼을 다해 야곱을 축복했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውስተ፡ ደብረ፡ ኬብሮን / on the mountain of Hebron
  english_pob_choice: on the mountain of Hebron
  chosen_korean: 헤브론 산에
  alternatives_korean:
  - 헤브론 산 위에
  - 헤브론의 산에
  lexicon: 지명·지형 표현
  rationale: 지시된 장소성을 자연스럽게 살리되, Ge'ez의 ‘~ 안/위에’보다 한국어에서는 고정 지명구로 간결하게 처리했습니다.
- source_word: ወ'ህየ፡ / And there
  english_pob_choice: And there
  chosen_korean: 그곳에서
  alternatives_korean:
  - 그리고 거기서
  - 거기서
  lexicon: 부사구
  rationale: 선행 장소인 헤브론 산을 다시 받아, 위치 연결을 분명히 하는 ‘그곳에서’로 옮겼습니다.
- source_word: ይፈኑ፡ / kept sending
  english_pob_choice: kept sending
  chosen_korean: 계속 보냈고
  alternatives_korean:
  - 계속 보내고
  - 보내곤 했고
  lexicon: 동작상의 지속
  rationale: 반복·지속의 의미를 살리기 위해 과거 서술 속 진행성을 드러내는 표현을 택했습니다.
- source_word: ኵሎ፡ ዘይፈኑ፡ / everything they needed
  english_pob_choice: everything they needed
  chosen_korean: 그들이 필요로 하는 모든 것을
  alternatives_korean:
  - 필요한 모든 것을
  - 그들에게 필요한 모든 것을
  lexicon: 목적어 구문
  rationale: ‘필요한 것’보다 원문의 관계를 더 분명히 드러내기 위해 ‘필요로 하는’으로 옮겼습니다.
- source_word: በኵሉ፡ ልቦሙ፡ ወበኵሉ፡ ነፍሶሙ፡ / with all their heart and with all their soul
  english_pob_choice: with all their heart and with all their soul
  chosen_korean: 온 마음과 온 영혼으로
  alternatives_korean:
  - 마음을 다하고 영혼을 다해
  - 온 마음과 온 혼으로
  lexicon: 감정·존재의 총체성 표현
  rationale: 성경적 관용을 유지하면서도 현대 한국어에서 자연스럽고 온전한 전심성을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 지속적 공급의 의미
  chosen_reading: 야곱이 아버지와 어머니에게 필요한 것을 정기적으로 계속 보냈다는 뜻으로 번역했습니다.
  alternative_readings:
  - 야곱이 계속 보내고 있었다
  - 야곱이 보내곤 했다
  rationale: 본문과 영어 POB의 ‘from time to time’가 반복적·주기적 공급을 가리키므로, 단발적 행위가 아니라 지속적 돌봄의 의미를 보존했습니다.
  doctrine_reference: 가족 부양과 효의 서술적 본문
