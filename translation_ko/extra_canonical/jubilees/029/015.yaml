lexical_decisions:
- source_word: አመ፡ አቅራቦት
  english_pob_choice: at the time of autumn
  chosen_korean: 가을철에
  alternatives_korean:
  - 가을에
  - 추수 때에
  lexicon: source-note seasonal expression
  rationale: 게에즈 표현은 계절을 가리키므로, 영어 POB의 'at the time of autumn'에 맞춰 자연스러운 계절 표현인 '가을철에'로 옮겼습니다.
- source_word: ወይፌኑ፡ ለአቡሁ፡ ይስሐቅ፡
  english_pob_choice: And he sent to his father Isaac
  chosen_korean: 그는 ... 아버지 이삭에게 보냈습니다
  alternatives_korean:
  - 그는 ... 아버지 이삭에게 가져갔습니다
  - 그는 ... 아버지 이삭에게 보냈습니다
  lexicon: source-note verb of sending
  rationale: 게에즈 동사 뜻과 최근 수정 내역이 모두 '보내다'를 지지하므로, 잘못된 '가져가다/가져오다'를 피하고 '보냈습니다'로 살렸습니다.
- source_word: ልብሰ፡
  english_pob_choice: clothing
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 입을 것
  lexicon: source-note garment
  rationale: 일반적인 의복 항목이므로 현대 한국어에서 가장 सीधे하고 자연스러운 '옷'을 택했습니다.
- source_word: ወሲሲተ፡ ሥጋ፡
  english_pob_choice: food, meat
  chosen_korean: 음식, 곧 고기
  alternatives_korean:
  - 음식과 고기
  - 식량, 곧 고기
  lexicon: source-note food/meat
  rationale: 문구는 'firstfruits'가 아니라 '음식, 고기'이므로, 의미를 과장하지 않으면서도 'ሥጋ'의 구체성을 살려 '음식, 곧 고기'로 옮겼습니다.
