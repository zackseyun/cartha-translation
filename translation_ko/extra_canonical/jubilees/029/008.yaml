  lexicon: 고유명사
  rationale: 지명 ገለአድ는 한국어 성경에서 통용되는 음역인 ‘길르앗’으로 옮겨 자연스러운 식별성을 살렸습니다.
- source_word: ፍሥሐተ ለስምዐ
  english_pob_choice: a feast for a witness
  chosen_korean: 증거를 위한 잔치
  alternatives_korean:
  - 증언을 위한 잔치
  - 증거의 잔치
  lexicon: 증거/증언 어휘
  rationale: 문맥상 잔치가 단순한 연회가 아니라 ‘증거/증언’의 기능을 가진 행사임을 살려 직역에 가깝게 옮겼습니다.
- source_word: ተጸውዐ ስሙ
  english_pob_choice: the name ... was called
  chosen_korean: 이렇게 불리게 되었습니다
