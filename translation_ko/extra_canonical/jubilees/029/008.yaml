  lexicon: 호칭 수동 표현
  rationale: 게에즈 수동 표현을 현대 한국어의 자연스러운 피동 서술로 풀어, 명명 결과를 분명히 나타냈습니다.
theological_decisions:
- issue: 명명 서술의 기능
  chosen_reading: ‘그 곳의 이름이 이렇게 불리게 되었습니다’로 결과를 서술해, 지명 명명이 증거 행위와 연결됨을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘그 곳의 이름이 불렸습니다’라고 중립적으로 처리하는 방식
  rationale: 이 절의 핵심은 이름 붙임의 결과보다 그 명명 행위가 증거를 위해 이루어졌다는 점이므로, 원문의 인과를 한국어에서도 분명하게 보이게 했습니다.
  doctrine_reference: 서사 문맥 보존
