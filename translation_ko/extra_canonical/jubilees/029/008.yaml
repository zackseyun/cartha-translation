  source_fidelity: 게에즈 본문과 영어 감사본은 절 첫머리에 독립적으로 남아 있는 “길르앗” 다음, 그가 그곳에서 증거를 위한 잔치를 베풀었고 그 결과 그곳의 이름이 불렸다는 서술을 제시합니다. 초안의 핵심 의미는 대체로 보존하지만, 첫 단어를 서술문 종결형으로 처리하여 원문의 단편적 절 경계를 바꾸었습니다.
  naturalness: ‘길르앗입니다’는 앞 문맥 없이 독립된 절 첫머리에 놓일 때 부자연스럽고, 원문에 없는 설명·단정의 말투를 더합니다. ‘그곳’은 붙여 쓰며, 명명 결과에는 ‘그렇게’를 사용하면 앞선 지명과의 연결을 자연스럽게 유지할 수 있습니다.
  terminology: 지명 ‘길르앗’은 한국어 성경의 통용 표기와 부합합니다. ፍሥሐተ ለስምዐ는 영어 감사본의 ‘a feast for a witness’를 따라 ‘증거를 위한 잔치’로 유지할 수 있습니다. ‘증인’으로 한정하지 않아 해당 표현의 기능적 의미를 보존합니다.
