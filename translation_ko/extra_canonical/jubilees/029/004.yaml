  text: And Jacob blessed the God of Isaac his father, and the God of Abraham, the father of his father; and he arose and set his wives and his children on animals, and took all his possessions, and crossed the River and arrived.
  footnotes:
  - marker: a
    text: Or 'took his wives and his children and all his possessions'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 그의 아버지 이삭의 하나님과 그의 아버지의 아버지 아브라함의 하나님을 찬송하였습니다. 그리고 그는 일어나 아내들과 자녀들을 짐승들 위에 태우고 모든 소유를 가져다가 강을 건너 도착하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ
  english_pob_choice: blessed
  chosen_korean: 찬송하였습니다
  alternatives_korean:
  - 복을 빌었습니다
  - 축복하였습니다
  lexicon: ברך / bless
  rationale: 여기서는 야곱이 하나님을 향해 말하는 행위이므로 ‘복을 빌다’보다 하나님을 높여 말하는 ‘찬송하다’가 문맥상 자연스럽고 경배의 뉘앙스를 살립니다.
- source_word: ወጸዐ
  english_pob_choice: set ... on animals
  chosen_korean: 짐승들 위에 태우고
  alternatives_korean:
  - 짐승들 위에 실어
  - 짐승들에 올려
  lexicon: Gen 31:17 parallel / load upon beasts
  rationale: 개인 소지품을 옮기는 일반적 ‘가져가다’와 분리하여, 가족을 짐승 위에 올리는 동작을 드러내기 위해 ‘태우다’를 택했습니다.
- source_word: ፈለገ
  english_pob_choice: the River
  chosen_korean: 강
  alternatives_korean:
  - 강을
  - 하천을
  lexicon: General river term / crossing formula
  rationale: 정관사에 해당하는 특정 지시가 본문에 드러나지 않으므로, 한국어에서는 자연스러운 일반 명사 ‘강’으로 옮겼습니다.
- source_word: አምላከ ... አቡሁ / አበ ... አቡሁ
  english_pob_choice: the God of Isaac his father ... the father of his father
  chosen_korean: 그의 아버지 이삭의 하나님 ... 그의 아버지의 아버지 아브라함의 하나님
  alternatives_korean:
  - 아버지 이삭의 하나님 ... 아버지의 아버지 아브라함의 하나님
  - 그 아버지 이삭의 하나님 ... 그 아버지의 아버지 아브라함의 하나님
  lexicon: Possessive chain / kinship construction
  rationale: 지속되는 소유 관계를 그대로 보여 주기 위해 ‘그의 아버지’와 ‘그의 아버지의 아버지’를 유지하여 족보적 연결을 보존했습니다.
theological_decisions:
- issue: 야곱의 하나님 찬송 동사 의미
  chosen_reading: 여기서는 단순한 말하기가 아니라 하나님을 높이는 경배 행위로 이해하여 ‘찬송하였습니다’로 옮겼습니다.
  alternative_readings:
  - 복을 빌었습니다
  - 축복하였습니다
  rationale: 히브리적/세미틱 계열 용례에서 하나님을 대상으로 한 bless는 수직적 경배 표현으로 읽히는 경우가 많아, 한국어에서도 그 방향성을 살렸습니다.
  doctrine_reference: 창세기 31:53의 야곱 서술과 족장 서사 맥락
- issue: ‘강을 건너 도착하였습니다’의 종결
  chosen_reading: 도착 목적지가 본문에 명시되지 않으므로, 도착 동작만을 보존하고 목적지는 추가하지 않았습니다.
  alternative_readings:
  - 건너고 이르렀습니다
  - 강을 건너 그곳에 도착하였습니다
  rationale: 원문과 영어 POB 모두 도착의 결과만 말하며 목적지를 제시하지 않으므로, 한국어에서도 여백을 유지했습니다.
  doctrine_reference: 본문 비명시 정보 보존 원칙
