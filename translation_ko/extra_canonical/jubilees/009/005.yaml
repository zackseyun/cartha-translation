  source_fidelity: 초안은 지명·방향·범위라는 핵심 지리 정보를 대체로 보존합니다. 그러나 원문과 영어 감사본에서 ‘셋째 몫이 나왔다’는 표현의 주어는 야벳이 아니라 분배된 ‘몫’입니다. 이를 ‘야벳은 … 나왔으니’로 옮기면 분배의 주체와 내용이 바뀝니다.
  naturalness: ‘그 물이 흘러 나오는 곳 북쪽으로 나왔으니’는 수식 관계가 불분명하고 현대 한국어로 부자연스럽습니다. ‘야벳에게는 … 셋째 몫이 나왔습니다’로 하면 분배 서술과 지리적 수식이 명료해집니다.
  terminology: Japheth, Tina, Gog는 각각 ‘야벳’, ‘티나’, ‘곡’으로 음역하는 것이 적절합니다. ‘부분’보다 토지 분배 문맥의 ‘몫’이 자연스럽고 원문의 의미를 잘 반영합니다.
