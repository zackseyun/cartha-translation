  text: 야벳에게는 티나 강 건너편, 그 물이 흘러나오는 곳의 북쪽에 있는 셋째 몫이 나왔습니다. 그것은 북동쪽으로 곡의 온 지역과 그 동쪽의 온 땅까지 뻗어 있습니다.
