translation:
  language: ko
  text: 그는 아라랏 땅의 루바르 산에 장사되었고, 그의 생애를 950년으로 마치셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተቀብረ፡
  english_pob_choice: And he was buried
  chosen_korean: 장사되었고
  alternatives_korean:
  - 묻혔고
  - 매장되었고
  lexicon: 장사되다
  rationale: 수동적 매장 사건을 자연스럽고 격식 있게 옮기되, 본문의 단순 서술을 과장하지 않도록 했습니다.
- source_word: '*ውስተ፡ ሉባር፡ ደብር፡'
  english_pob_choice: on Mount Lubar
  chosen_korean: 루바르 산에
  alternatives_korean:
  - 루바르 산 위에
  - 루바르의 산에
  lexicon: 산 / 지명 음역
  rationale: Ge'ez의 'Lubar dabr'를 산 이름으로 이해하여, 영어 개정본의 'Mount Lubar'에 맞게 간결한 지명 표현으로 옮겼습니다.
- source_word: በምድረ፡ አራራት።
  english_pob_choice: in the land of Ararat
  chosen_korean: 아라랏 땅의
  alternatives_korean:
  - 아라랏 땅에 있는
  - 아라랏 지방의
  lexicon: 땅
  rationale: 히브리식 지리 표현을 보존하여, 단순한 위치 부사보다 소속·영역의 뉘앙스를 드러냈습니다.
- source_word: ፱፻ወ፶ዓመተ፡ ፈጸመ፡ በሕይወቱ፡
  english_pob_choice: he completed 950 years of his life
  chosen_korean: 그의 생애를 950년으로 마치셨습니다
  alternatives_korean:
  - 그는 그의 생애 950년을 채우셨습니다
  - 그는 자기 생애의 950년을 마치셨습니다
  lexicon: 생애
  rationale: 완결 동사 'completed'를 '마치셨습니다'로 옮겨 기간의 완성을 살리고, 'of his life'는 자연스러운 한국어로 '그의 생애를'로 반영했습니다.
theological_decisions:
- issue: 본절의 인물 호칭과 서술 어조
  chosen_reading: 서술문 전체를 합쇼체로 유지하되, 고유명사와 시간표현에 신학적 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 인물의 존칭을 더 강하게 드러내는 번역
  - 문어체적 고전 문장으로 조정
  rationale: 본문은 장례와 수명을 사실적으로 기록하는 문장이라, 해석적 확장 없이 평이한 서술을 유지하는 것이 원문에 가장 충실합니다.
  doctrine_reference: source_text_fidelity
