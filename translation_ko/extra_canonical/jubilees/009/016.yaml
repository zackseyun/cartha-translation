  naturalness: ‘장사되었고’ 뒤에 ‘마치셨습니다’를 쓰면 같은 인물에 대한 높임의 적용이 일관되지 않습니다. 현대 표준 한국어 합쇼체 서술에서는 존대 선어말 없이 ‘마쳤습니다’로 통일하는 편이 자연스럽습니다.
  terminology: ‘장사되다’, ‘아라랏’, ‘루바르 산’은 적절합니다. 원문의 수명 진술은 ‘950년의 생애를 마쳤습니다’로 옮기는 것이 명확합니다.
