translation:
  language: ko
  text: 그는 자기 아들들 모두보다 그를 더 사랑하였습니다. 그리고 노아는 자기 조상들과 함께 잠들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ
  english_pob_choice: For
  chosen_korean: 그는
  alternatives_korean:
  - 왜냐하면
  - 이에
  - 그 까닭은
  lexicon: 접속사/전개 표지
  rationale: 지시된 Ge'ez 문장은 앞선 서술을 이어 주는 원인·설명 표지로 쓰였으므로, 한국어에서는 자연스러운 주어 도입 없이 바로 서술을 시작하기보다 문맥상 연결되는 주어를 살려 매끈하게 옮겼습니다.
- source_word: ያፈቅር፡ ፈድፋደ፡ እምኵሉ፡ ውሉዱ
  english_pob_choice: he loved him more than all his sons
  chosen_korean: 자기 아들들 모두보다 그를 더 사랑하였습니다
  alternatives_korean:
  - 모든 아들들보다 그를 더 사랑하였습니다
  - 그를 자기의 모든 아들보다 더 사랑하였습니다
  lexicon: 비교 구문 / 대명사
  rationale: ፈድፋደ는 비교 의미의 '더'를, እምኵሉ ውሉዱ는 '그의 모든 아들들보다'를 나타내므로, 비교 대상을 분명히 드러내어 '아들들 모두보다'로 옮겼습니다.
- source_word: ወኖመ ኖኅ ምስለ አበዊሁ
  english_pob_choice: And Noah slept with his fathers
  chosen_korean: 그리고 노아는 자기 조상들과 함께 잠들었습니다
  alternatives_korean:
  - 그리고 노아는 그의 조상들과 함께 잠들었습니다
  - 그리고 노아는 조상들과 함께 잠들었습니다
  lexicon: 완곡한 죽음 표현
  rationale: Ge'ez의 '잠들다' 표현을 한국어에서도 그대로 살려, 문자적 의미를 유지하면서 죽음을 완곡하게 나타냈습니다. '아버지들/조상들' 중에서는 문맥상 세대적 선조를 포괄하는 '조상들'이 자연스럽습니다.
theological_decisions:
- issue: 죽음의 완곡 표현
  chosen_reading: 노아는 '잠들었습니다'로 번역하여 죽음을 직접 진술하되 성경적 관용구를 유지했습니다.
  alternative_readings:
  - 노아는 죽었습니다
  - 노아는 그의 조상들과 함께 누웠습니다
  rationale: 원문의 관용적 죽음 표현을 보존하는 것이 본문의 어조와 서술 방식을 가장 잘 드러냅니다.
  doctrine_reference: 성경의 관용적 사망 표현 보존
