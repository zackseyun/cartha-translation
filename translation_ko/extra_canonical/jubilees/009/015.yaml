    text: Or 'And in the thirty-third jubilee, in the first year of the second week, Peleg took for himself a wife, whose name was Lomna, daughter of Sinaar; and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, "Look, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land of Shinar."'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 그가 자기의 모든 아들보다 그를 더 사랑하였기 때문입니다. 그리고 노아는 자기 조상들과 함께 잠들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “서른세 번째 희년, 둘째 주 첫째 해에 벨렉이 시나알의 딸 롬나라는 아내를 맞이하였고, 이 주의 넷째 해에 그가 아들을 낳았다. 그가 그 이름을 르우라 하였으니, ‘보라, 사람들이 시날 땅에 자기들을 위하여 성읍과 탑을 세우려는 악한 계획 때문에 악해졌다’라고 말하였기 때문이다.”
    reason: 이전 번역문을 기록한 감사 추적 각주입니다.
