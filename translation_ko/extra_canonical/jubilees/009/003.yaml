  text: 그 경계는 북쪽으로 뻗어 가디르의 경계에 이르고, 큰 바다의 물가로 뻗어 기혼 강에 가까이 이르며, 기혼의 물 남쪽을 따라 이 강의 강둑에 이릅니다.[a]
