  yaml_path: translation/extra_canonical/jubilees/009/018.yaml
  text: And in the thirty-third jubilee[18], in the first year of the second week, Peleg took for himself a wife whose name was Lomna, the daughter of Shinar, and she bore him a son in the fourth year of this week. And he called his name Reu, for he said, “Behold, the children of men have become evil through the wicked purpose to build for themselves a city and a tower in the land.”
  footnotes:
  - marker: '18'
    text: The tower measurements are textually difficult in Ethiopic transmission. The numbers are translated conservatively from the supplied text and may reflect a corrupt or compressed measurement tradition.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 삼십삼 번째 희년[a] 첫째 해, 둘째 주의 첫해에, 팔렉이 스스로 아내를 맞이하니 그 이름은 롬나였고, 시나르의 딸이었습니다. 그가 그 여자에게서 이 주의 넷째 해에 아들을 낳았고, 그의 이름을 르우라고 불렀습니다. 이는 그가 말하기를 “보라, 사람의 자녀들이 땅에 성읍과 탑을 세우려고 악한 뜻을 품어 악해졌습니다”라고 했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትውልድ፡ ለዕለተ፡ ደይን
  english_pob_choice: And in the thirty-third jubilee[18]
  chosen_korean: 삼십삼 번째 희년
  alternatives_korean:
  - 삼십삼 희년
  - 33번째 희년
  lexicon: 희년
  rationale: source의 연대 표지를 그대로 살리되, POB의 ‘jubilee’를 한국어 ‘희년’으로 옮겨 독자가 절기 단위를 즉시 알아보게 했습니다.
- source_word: ፋሌክ፡ ... ብእሲተ፡ እንተ፡ ስማ፡ ሎምና፡ ወለተ፡ ሲናአር
  english_pob_choice: Peleg took for himself a wife whose name was Lomna, the daughter of Shinar
  chosen_korean: 팔렉이 스스로 아내를 맞이하니 그 이름은 롬나였고, 시나르의 딸이었습니다
  alternatives_korean:
  - 팔렉이 아내를 맞이하였는데 그 이름은 롬나였고, 시나르의 딸이었습니다
  - 팔렉이 롬나를 아내로 삼았는데, 그녀는 시나르의 딸이었습니다
  lexicon: 아내를 맞이하다
  rationale: 아내를 ‘취하다/데려오다’보다 한국어 성경체에 맞는 ‘아내를 맞이하다’로 옮기되, 자발성을 드러내는 ‘스스로’로 source의 주체성을 보완했습니다.
- source_word: ወጸውዐ፡ ስሞ፡ ራገው
  english_pob_choice: And he called his name Reu
  chosen_korean: 그의 이름을 르우라고 불렀습니다
  alternatives_korean:
  - 그 이름을 르우라 불렀습니다
  - 르우라 이름하였습니다
  lexicon: 이름을 부르다
  rationale: 명명 행위를 자연스럽고 직역에 가깝게 처리하여, 히브리/게에즈 서사에서 흔한 공식 표현을 한국어로 유지했습니다.
- source_word: እኩያነ፡ በምክረ፡ ዐግ
  english_pob_choice: through the wicked purpose
  chosen_korean: 악한 뜻을 품어 악해졌습니다
  alternatives_korean:
  - 악한 계획 때문에
  - 사악한 의도로
  lexicon: 악한 뜻 / 품다
  rationale: POB의 ‘wicked purpose’를 단순한 ‘계획’보다 내면의 의도까지 드러내는 ‘악한 뜻’으로 옮겨, 사람들의 도덕적 타락 원인을 보존했습니다.
theological_decisions:
- issue: 사람의 타락 원인 설명
  chosen_reading: 인간이 성읍과 탑을 세우려는 악한 뜻 때문에 악해졌다는 설명을 본문 그대로 유지했습니다.
  alternative_readings:
  - 단순한 도시 건설 의도에 대한 중립적 진술
  - 문명 발전에 대한 비판으로 완화하는 해석
  rationale: 본문은 건설 행위 자체보다 그 배후의 악한 의도를 문제 삼으므로, 도덕적 평가를 약화시키지 않았습니다.
  doctrine_reference: 창세기 11장 전승과 연결되는 인간 교만/타락의 서술
- issue: 직접 화법의 인용부호
  chosen_reading: “보라 …”의 직접 화법을 따옴표로 분리해 서술자의 설명과 발화의 경계를 분명히 했습니다.
  alternative_readings:
  - 직접 화법 없이 이어서 번역
  - 간접화법으로 전환
  rationale: 서술자의 설명과 인용된 발언을 구분해야 ‘그가 말하기를’의 기능이 살아납니다.
  doctrine_reference: 성서 서사의 인용 구조 보존
