- from: 그리고 삼십삼 번째 희년[a] 첫째 해, 둘째 주의 첫해에, 팔렉이 스스로 아내를 맞이하니 그 이름은 롬나였고, 시나르의 딸이었습니다. 그가 그 여자에게서 이 주의 넷째 해에 아들을 낳았고, 그의 이름을 르우라고 불렀습니다. 이는 그가 말하기를 “보라, 사람의 자녀들이 땅에 성읍과 탑을 세우려고 악한 뜻을 품어 악해졌습니다”라고 했기 때문입니다.
  to: 그리고 제삼십삼 희년, 둘째 주 첫째 해에 팔렉은 시나르의 딸 롬나를 아내로 맞이하였습니다. 롬나는 이 주의 넷째 해에 그에게 아들을 낳아 주었습니다. 팔렉은 그 아들의 이름을 르우라 하였습니다. 그가 말하였습니다. “보십시오, 사람의 자녀들이 땅에 자기들을 위하여 성읍과 탑을 세우려는 악한 꾀로 악해졌습니다.”
