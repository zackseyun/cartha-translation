base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/008.yaml
  text: And the angel of the spirits, Mastema, came and said, “Lord, Creator, let some of them remain before me, and let them listen to my voice and do all that I tell them; for if some of them are not left to me from among them, I will not be able to exercise the authority of my will over the children of men, for these are for corrupting and leading astray before my judgment, for great is the wickedness of the children of men.”
  footnotes:
  - marker: a
    text: Or 'And the angel of the spirits who were left came'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 영들의 천사 마스테마가 와서 말하였습니다. “주님, 창조주여, 그들 가운데 일부를 내게 남겨 주시어, 그들이 내 목소리를 듣고 내가 그들에게 말하는 모든 것을 행하게 하소서. 그들 가운데 일부를 내게 남겨 주지 않으시면, 저는 사람의 자손들에게 내 의지에 따른 권세를 행사할 수 없습니다. 그들은 내 심판 전에 사람의 자손들을 타락시키고 미혹시키기 위한 자들이며, 사람의 자손들의 악이 매우 크기 때문입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ መናፍስት፡
  english_pob_choice: the angel of the spirits
  chosen_korean: 영들의 천사
  alternatives_korean:
  - 영의 천사
  - 영들에 속한 천사
  lexicon: 영 / 천사
  rationale: geēz의 복수 ‘spirits’를 살려 ‘영들의 천사’로 옮겨, 단일한 성령이 아니라 영적 존재들에 관한 표현임을 드러냈습니다.
- source_word: መስተማ፡
  english_pob_choice: Mastema
  chosen_korean: 마스테마
  alternatives_korean:
  - 마스테마
  lexicon: 고유명사
  rationale: 본문에 직접 나타난 고유명사를 음역으로 보존했습니다.
- source_word: እግዚኦ፡ ፈጣሪ፡
  english_pob_choice: Lord, Creator
  chosen_korean: 주님, 창조주여
  alternatives_korean:
  - 주여, 창조주여
  - 주님, 조물주여
  lexicon: 호칭 / 창조주
  rationale: 대화체 기도에서의 직접 호칭이므로 ‘창조주여’로 옮기고, 자연스러운 합쇼체 문맥을 유지했습니다.
- source_word: ስልጣነ፡ ፈቃድየ፡
  english_pob_choice: the authority of my will
  chosen_korean: 내 뜻의 권위
  alternatives_korean:
  - 내 의지의 권위
  - 내 뜻의 권세
  lexicon: 권위 / 뜻
  rationale: ‘authority’를 단순한 힘이 아니라 의지의 통치적 권한으로 보고 ‘내 뜻의 권위’로 옮겼습니다.
theological_decisions:
- issue: 마스테마의 호칭과 악한 역할을 어떻게 드러낼지
  chosen_reading: 본문의 직함을 그대로 살려 ‘영들의 천사 마스테마’로 두고, 뒤의 자기 진술도 본문 범위 안에서 그대로 옮겼습니다.
  alternative_readings:
  - ‘사악한 영들의 천사’처럼 설명적 처리
  - 고유명사 없이 기능적으로만 번역
  rationale: 본문은 단순한 기능 설명이 아니라 고유명사와 직함을 함께 제시하므로, 둘 다 보존하는 편이 독자가 원문 구조를 이해하는 데 유리합니다.
  doctrine_reference: 에녹계/희년서 전승의 악한 영 존재 표지
- issue: ‘내 뜻의 권위’를 ‘내가 원하는 대로 할 권한’으로 완화할지
  chosen_reading: 직역에 가깝게 ‘내 뜻의 권위’를 유지했습니다.
  alternative_readings:
  - ‘내가 원하는 대로 할 수 있는 권한’
  - ‘내 의지를 행사할 권세’
  rationale: 원문은 마스테마가 인간 위에 행사하려는 통치권을 말하므로, 권한을 약화시키지 않되 한국어로 자연스럽게 ‘뜻의 권위’로 형상화했습니다.
  doctrine_reference: 악한 영에 대한 통치/지배 개념
