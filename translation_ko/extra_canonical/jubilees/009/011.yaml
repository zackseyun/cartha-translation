  text: And for Tubal there came out a fifth portion in the midst of the tongue that approaches toward the portion of Lud, as far as the other tongue, into the region beyond the other tongue.
  footnotes:
  - marker: a
    text: Or 'And for Lud'.
    reason: previous_rendering
  - marker: b
    text: Or 'within the region of the other tongue'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 투발에게는, 룻의 몫을 향해 다가가는 가운데에 있는 혀의 한가운데에서 다섯째 몫이 나왔습니다. 그것은 다른 혀, 곧 그 다른 혀의 지역 너머로까지 이릅니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለቱቤልሂ
  english_pob_choice: And for Tubal
  chosen_korean: 그리고 투발에게는
  alternatives_korean:
  - 그리고 룻에게는
  - 그리고 투발을 위해
  lexicon: 투발
  rationale: 게에즈 본문과 영어 POB 수정본은 이 절의 몫을 투발에게 귀속시킵니다. 한국어도 대상 표지를 분명히 살려 ‘투발에게는’으로 옮겼습니다.
- source_word: መክፈልት፡ ኃምስ፡
  english_pob_choice: a fifth portion
  chosen_korean: 다섯째 몫
  alternatives_korean:
  - 다섯 몫
  - 제5분깃
  lexicon: 몫
  rationale: 분배된 지분을 가리키는 표현이므로 ‘몫’이 자연스럽고, 수량 정보는 ‘다섯째’로 보존했습니다.
- source_word: ልሳን
  english_pob_choice: tongue
  chosen_korean: 혀
  alternatives_korean:
  - 언어
  - 말
  lexicon: 혀
  rationale: 지리적 경계 비유를 이루는 원문 이미지를 살리기 위해 일반적 비유어인 ‘혀’를 유지했습니다. 영어 POB도 이를 그대로 반영합니다.
- source_word: ማዕዶተ፡
  english_pob_choice: beyond
  chosen_korean: 너머
  alternatives_korean:
  - 밖으로
  - 건너
  - 안쪽으로
  lexicon: 너머
  rationale: 최근 수정에서 확인된 핵심 의미가 ‘within’이 아니라 ‘across/beyond’이므로, 경계선을 넘는 뜻을 가장 간결하게 나타내는 ‘너머’를 택했습니다.
theological_decisions:
- issue: 지리 비유의 난해한 표현을 어떻게 보존할지
  chosen_reading: ‘혀’와 ‘너머’의 이미지를 그대로 살려, 정확한 지형명으로 풀어 쓰지 않고 경계 분배의 비유성을 유지했습니다.
  alternative_readings:
  - ‘언어’로 해석하여 민족 경계로 바꾸기
  - 의역하여 ‘지역 바깥’으로 평탄화하기
  rationale: 본문은 지리적 경계에 대한 고대적 은유를 사용하므로, 의미를 과도하게 현대화하면 원문의 모호성과 힘이 사라집니다. 따라서 해석을 최소화하고 독자가 본문의 난해함을 그대로 보도록 했습니다.
  doctrine_reference: '본문 해석 원칙: 원문 이미지 보존'
