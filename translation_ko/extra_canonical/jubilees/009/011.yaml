  source_fidelity: 투발(두발)에게 돌아간 다섯째 몫, 룻의 몫 쪽으로 뻗은 ‘혀’, 다른 혀 및 그 너머 지역이라는 지리적 묘사는 대체로 반영했습니다. 그러나 ‘가운데에 있는 혀의 한가운데’는 원문의 관계절을 부자연스럽게 중복시키며, 범위 표현도 더 직접적으로 연결할 필요가 있습니다.
