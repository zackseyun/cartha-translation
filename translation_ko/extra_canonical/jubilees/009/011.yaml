revisions:
- from: 그리고 투발에게는, 룻의 몫을 향해 다가가는 가운데에 있는 혀의 한가운데에서 다섯째 몫이 나왔습니다. 그것은 다른 혀, 곧 그 다른 혀의 지역 너머로까지 이릅니다.[a][b]
  to: 그리고 두발에게는 룻의 몫 쪽으로 뻗어 있는 혀의 한가운데에서, 다른 혀에 이르고 그 다른 혀 너머의 지역에 이르는 다섯째 몫이 나왔습니다.
  rationale: 원문의 배정 대상(두발), 다섯째 몫, 룻의 몫 쪽으로 뻗은 ‘혀’의 한가운데, 다른 혀 및 그 너머 지역이라는 범위를 모두 유지했습니다. 지리적 은유를 지명이나 해석적 표현으로 바꾸지 않았으며, 불필요한 중복을 제거하고 한국어 성경 인명 관례에 맞추었습니다. 영문 감사 기록의 대안 각주들은 본문에 적용되지 않는 이전 독법 또는 이미 배제된 ‘within’ 독법이므로 한국어 본문에는 각주 표지를 두지 않았습니다.
