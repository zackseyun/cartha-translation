revisions:
- from: 그리고 영의 왕자인 마스테마가 와서 말하였다. "주 창조주여, 그들 중 얼마를 내게 맡겨 그들로 내 음성을 듣고 내가 그들에게 말하는 모든 것을 행하게 하여라. 만일 그들 중에 한 사람도 내게 남겨지지 아니하면 내가 인생 가운데서 내 뜻의 권위를 행할 수 없으리라. 그들은 내 심판 앞에서 패괴시키고 궤멸하게 하는 자니, 인생의 악이 큼이니라."
  to: 그리고 영들의 천사 마스테마[9]가 와서 말하였습니다. “주님, 창조주님, 그들 가운데 얼마를 제게 남겨 주시고, 그들이 제 말을 듣고 제가 그들에게 말하는 모든 것을 행하게 해 주십시오. 그들 가운데 아무도 제게 남겨지지 않으면, 저는 사람들 가운데서 제 뜻에 따른 권세를 행사할 수 없을 것입니다. 그들은 제 심판 전에 타락시키고 미혹하게 할 자들이기 때문입니다. 사람의 자손들의 악이 크기 때문입니다.”
  rationale: 원문의 ‘영들의’와 마스테마의 이름을 보존하고, 타락과 미혹이라는 핵심 행위를 정확히 복원했습니다. 원문에서 타락·미혹의 목적어가 명시되지 않은 점도 유지했으며, 논쟁적 직함의 번역 가능성은 각주로 처리했습니다.
