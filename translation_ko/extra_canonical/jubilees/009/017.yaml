base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/009/017.yaml
  text: Nineteen jubilees, two weeks, and five years—which he lived on earth longer than the children of men because of the righteousness in which he was perfect, except for Enoch. For Enoch's role was created as a testimony to the generations of the world, so that he might recount all the deeds to the generations.
  footnotes:
  - marker: a
    text: Or 'And they began to build, and in the fourth week they made brick with fire, and the bricks served them for stone, and the clay with which they plastered was asphalt that comes out from the sea and from the springs of water in the land of Shinar.'.
    reason: previous_rendering
translation:
  language: ko
  text: 열아홉 희년과 두 주와 다섯 해였습니다. 그는 인간의 자손보다 더 오래 땅에 살았는데, 에녹은 예외입니다. 이는 에녹의 역할이 세상의 세대들에게 증언이 되도록 지어졌기 때문이니, 그가 모든 행위를 세대들에게 전하게 하려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተ ጽድቅ ዘባቲ ፍጹመ ኮነ
  english_pob_choice: because of the righteousness in which he was perfect
  chosen_korean: “의로우심 안에서 완전하였습니다”
  alternatives_korean:
  - “그가 완전하였던 의 때문에”
  - “그가 완전한 의를 지녔기 때문에”
  lexicon: ጽድቅ → 의
  rationale: 원문의 핵심은 에녹의 ‘완전함’이 ‘의’와 결합되어 있다는 점이므로, 자연스러운 현대 한국어로 “의로우심 안에서 완전하였습니다”처럼 상태 관계를 살렸습니다.
- source_word: ዘእንበለ፡ ሄኖክ
  english_pob_choice: except for Enoch
  chosen_korean: 에녹은 예외입니다
  alternatives_korean:
  - 에녹만은 제외됩니다
  - 다만 에녹은 그렇지 않았습니다
  lexicon: 예외 표현
  rationale: 문맥상 앞선 진술 전체에 대한 예외를 간명하게 밝히는 표현이므로, 직역의 틀을 유지하면서도 한국어로 자연스럽게 “예외입니다”로 옮겼습니다.
- source_word: ተፈጥሮተ ለስምዕ ለትዝምደ ዓለም
  english_pob_choice: created as a testimony to the generations of the world
  chosen_korean: 세상의 세대들에게 증언이 되도록 지어졌기 때문입니다
  alternatives_korean:
  - 세상의 세대들을 위한 증언으로 창조되었기 때문입니다
  - 세상 세대에 대한 증거로 마련되었기 때문입니다
  lexicon: 증언/세대
  rationale: ‘증언’은 역할의 목적을, ‘세대들’은 원문의 복수적 역사 범위를 살립니다. ‘지어졌기 때문입니다’는 피동적 창조 목적을 무리 없이 반영합니다.
- source_word: ይንገር ኵሎ ግብረ
  english_pob_choice: so that he might recount all the deeds
  chosen_korean: 그가 모든 행위를 세대들에게 전하게 하려는 것이었습니다
  alternatives_korean:
  - 그가 모든 행위를 말하게 하려는 것이었습니다
  - 그가 모든 일을 낱낱이 전하도록 하려는 것이었습니다
  lexicon: 전하다/행위
  rationale: 원문의 ‘말하다/전하다’는 기능을 살리면서, ‘모든 행위’로 deed의 포괄적 의미를 보존했습니다.
theological_decisions:
- issue: 에녹의 ‘의로움’과 ‘완전함’의 결합
  chosen_reading: 도덕적 무결성과 언약적 의가 함께 제시된 것으로 읽고, 이를 “의로우심 안에서 완전하였습니다”로 함께 살렸습니다.
  alternative_readings:
  - 단순히 ‘완전하였다’로만 처리
  - ‘의로움 때문에 완전하였다’로 인과만 강조
  rationale: 원문은 에녹의 탁월함을 단순 완전성보다 ‘의’와 연결해 설명하므로, 두 요소를 분리하지 않고 함께 드러내는 편이 소스 충실적입니다.
  doctrine_reference: 창세기 5장, 히브리서 11장 5절의 에녹 전승과 합치되는 인물 서술
- issue: 에녹의 역할을 ‘증언’으로 규정하는 표현
  chosen_reading: 에녹을 인류 역사에 대한 하나님의 증언 매개로 제시하는 문맥을 그대로 유지했습니다.
  alternative_readings:
  - ‘경고’나 ‘예언’으로 강화
  - ‘기록자’로 축소
  rationale: 원문은 에녹의 사명을 ‘증언’과 ‘전달’로 규정하므로, 이를 설교적 확장 없이 유지하는 것이 적절합니다.
  doctrine_reference: 지혜문학적·묵시문학적 증언 개념
