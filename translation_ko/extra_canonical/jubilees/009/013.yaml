  yaml_path: translation/extra_canonical/jubilees/009/013.yaml
  text: And we told Noah along with their deceptions, so that they might be healed by the plants of the earth. And Noah wrote down everything that we had taught him in a book concerning every kind of healing, and the spirits were restrained.
  footnotes:
  - marker: a
    text: Or 'about all their errors'.
    reason: previous_rendering
  - marker: b
    text: Or 'the evil spirits'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리는 노아에게 그들의 속임수와 함께[a] 일러 주어, 그들이 땅의 식물들로 치유를 받게 하였습니다. 노아는 우리가 그에게 가르친 모든 것을 온갖 치유에 관한 책에 적었고, 영들이[b] 억제되었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들의 오류와 함께”.
    reason: አስሕተትሙ는 ‘속임수’ 또는 ‘오류’로 옮길 수 있으나, ምስለ의 ‘~와 함께’ 관계는 유지합니다.
  - marker: b
    text: 또는 “악한 영들”.
    reason: 문맥상 가능한 해석이지만, 본문 መናፍስት 자체는 단지 ‘영들’이므로 본문에서는 확대하지 않습니다.
lexical_decisions:
- source_word: ምስለ፡ አስሕተትሙ፡
  english_pob_choice: along with their deceptions
  chosen_korean: 그들의 속임수에 관하여
  alternatives_korean:
  - 그들의 속임수와 함께
  - 그들의 오류와 함께
  lexicon: source_note
  rationale: 게에즈 표현은 ‘with/along with’의 관계를 가지므로, 내용상 노아에게 전해진 것이 그들의 속임수에 대한 설명이라는 점을 드러내되 과도하게 해석하지 않도록 ‘관하여’로 옮겼습니다.
- source_word: ይፈውሱ፡ በዕፀወ፡ ምድር።
  english_pob_choice: they might be healed by the plants of the earth
  chosen_korean: 땅의 식물들로 치유를 받을 수 있게
  alternatives_korean:
  - 땅의 식물들로 고침을 받을 수 있게
  - 땅의 약초로 낫게
  lexicon: source_note
  rationale: 원문의 수동적 치유 의미를 살려 ‘치유를 받다’로 옮기고, ‘plants of the earth’는 직역에 가깝게 ‘땅의 식물들’로 두었습니다.
- source_word: በኵሉ፡ ትዝምደ፡ ፈውሳት፡
  english_pob_choice: concerning every kind of healing
  chosen_korean: 각종 치유에 관한
  alternatives_korean:
  - 온갖 치유에 관한
  - 모든 치유의
  lexicon: source_note
  rationale: ‘every kind of healing’의 범주성을 살리기 위해 ‘각종 치유’로 옮겨, 노아가 치료법 전반을 정리했다는 점이 보이도록 했습니다.
- source_word: መናፍስት፡
  english_pob_choice: the spirits
  chosen_korean: 영들
  alternatives_korean:
  - 영들이
  - 귀신들이
  lexicon: source_note
  rationale: 게에즈 본문은 단순히 ‘spirits’이므로, 영어 POB의 축소된 표현을 따라 ‘영들’로 옮기고 악령으로 특정하지 않았습니다.
theological_decisions:
- issue: 영들의 상태를 ‘evil spirits’로 확장할지 여부
  chosen_reading: 본문 그대로 ‘영들’이라고 두었습니다.
  alternative_readings:
  - 악한 영들
  - 귀신들
  rationale: 게에즈 본문에는 ‘evil’에 해당하는 형용사가 없고, 영어 POB도 최종적으로 ‘the spirits’로 수정했으므로, 해석을 확대하지 않고 본문이 말하는 억제 상태만 반영했습니다.
  doctrine_reference: 본문충실성 및 절제된 확정
- issue: 치유의 수단을 ‘plants of the earth’로 직역할지 여부
  chosen_reading: ‘땅의 식물들’로 직역했습니다.
  alternative_readings:
  - 땅의 약초들
  - 땅의 식물
  rationale: 원문은 자연계의 식물을 통해 치유가 이루어진다는 점을 말하므로, 전통적 약초 표현으로 좁히기보다 원문의 범위를 그대로 살렸습니다.
  doctrine_reference: 원문 의미 보존
