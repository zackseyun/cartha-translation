  to: 그리고 우리는 노아에게 그들의 속임수와 함께[a] 일러 주어, 그들이 땅의 식물들로 치유를 받게 하였습니다. 노아는 우리가 그에게 가르친 모든 것을 온갖 치유에 관한 책에 적었고, 영들이[b] 억제되었습니다.
