  text: The third tongue. And for Mesek came forth the sixth portion, all the region beyond the third tongue.
  footnotes:
  - marker: a
    text: Or 'region of'.
    reason: previous_rendering
translation:
  language: ko
  text: 세 번째 언어입니다. 그리고 메섹에게는 여섯째 몫이 나왔으니, 세 번째 언어의 모든 지역입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልሳን
  english_pob_choice: the third tongue
  chosen_korean: 세 번째 언어
  alternatives_korean:
  - 세 번째 혀
  - 제삼의 언어
  lexicon: Ge'ez ልሳን
  rationale: 문맥상 문자적 ‘혀’보다 언어/방언을 뜻하는 표현이어서, 한국어에서는 자연스럽게 ‘언어’로 옮겼습니다.
- source_word: ወለሞስክ
  english_pob_choice: for Mesek
  chosen_korean: 메섹에게는
  alternatives_korean:
  - 메섹을 위해
  - 메섹에게
  lexicon: Ge'ez 고유명사
  rationale: 전치사적 관계를 자연스럽게 풀어, 분배의 대상임을 드러내는 조사 ‘-에게는’을 사용했습니다.
- source_word: መክፈልት ሳድስ
  english_pob_choice: the sixth portion
  chosen_korean: 여섯째 몫
  alternatives_korean:
  - 여섯째 분깃
  - 여섯째 몫의 몫
  lexicon: Ge'ez 분배 어휘
  rationale: ‘portion’은 분배된 몫의 의미이므로, 현대 한국어에서는 간결한 ‘몫’이 가장 직접적입니다.
- source_word: ኵሉ ማዕዶተ
  english_pob_choice: all the region beyond
  chosen_korean: 모든 지역입니다
  alternatives_korean:
  - 그 너머의 모든 지역입니다
  - 세 번째 언어 건너편의 모든 지역입니다
  lexicon: Ge'ez 공간 표현
  rationale: POB 개정본의 ‘region beyond’는 지리적 경계를 가리키므로, 핵심 의미를 살리되 한국어 문장 흐름상 ‘모든 지역’으로 옮기고 앞 절에서 ‘세 번째 언어’를 재지시했습니다.
theological_decisions:
- issue: 이 절은 창조 기사나 교리 진술이 아니라 분배 목록의 한 항목으로 보이는지 여부
  chosen_reading: 서술을 그대로 따라, 신학적 확장 없이 지리·분배 진술로 옮겼습니다.
  alternative_readings:
  - 상징적 민족 구분으로 확대 해석
  - 후대 지리 개념을 덧붙여 설명
  rationale: 원문과 POB 영문은 단순한 분배와 경계의 진술이므로, 해석을 덧붙이지 않는 것이 가장 충실합니다.
  doctrine_reference: 본문 고유의 역사·지리 진술 우선 원칙
