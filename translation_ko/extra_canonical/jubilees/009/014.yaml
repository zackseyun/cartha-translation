  text: And Noah slept with his fathers[14], and he was buried on Mount Lubar in the land of Ararat. Nine hundred and fifty years he completed in his life, nineteen jubilees and two weeks and five years. And in his life on earth he surpassed the sons of men, except Enoch, because of the righteousness in which he was perfect. For Enoch’s task was created as a testimony for the generations of the world, so that he should recount all the deeds of generation after generation until the day of judgment.
  footnotes:
  - marker: '14'
    text: '''Nineteen jubilees and two weeks and five years'' equals 950 years. The chapter intentionally preserves both the total and the jubilean reckoning.'
    reason: cultural_note
translation:
  language: ko
  text: 이 모든 것의 경계는 노아의 아들들을 위한 것이었습니다. 그리고 그는 자신이 기록한 모든 것을 자기 아들 셈에게 주었는데, 이는 그를 매우 사랑했기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “The boundaries of all these” / እኩያን፡ እምድኅሬሆሙ
  english_pob_choice: The boundaries of all these were for the sons of Noah.
  chosen_korean: 이 모든 것의 경계는 노아의 아들들을 위한 것이었습니다.
  alternatives_korean:
  - 이 모든 것의 분깃은 노아의 아들들을 위한 것이었습니다.
  - 이 모든 것의 한계는 노아의 아들들을 위한 것이었습니다.
  lexicon: 경계
  rationale: Ge'ez의 분배·구획 뉘앙스를 살리되, 문맥상 상속/할당의 결과를 자연스럽게 드러내기 위해 ‘경계’를 택했습니다.
- source_word: sons of Noah
  english_pob_choice: the sons of Noah
  chosen_korean: 노아의 아들들
  alternatives_korean:
  - 노아의 자손들
  - 노아의 아들들
  lexicon: 아들
  rationale: English POB의 직접 대응을 유지하면서, 혈연적 수혜자라는 점을 분명히 하기 위해 직역했습니다.
- source_word: he gave all that he had written to Shem his son
  english_pob_choice: he gave all that he had written to Shem his son
  chosen_korean: 그는 자신이 기록한 모든 것을 자기 아들 셈에게 주었는데
  alternatives_korean:
  - 그가 쓴 모든 것을 셈에게 주었는데
  - 그가 기록한 모든 것을 그의 아들 셈에게 주었는데
  lexicon: 기록하다
  rationale: Ge'ez의 ‘기록한 것’은 단순 소유물이 아니라 문서/전승의 내용을 가리키므로 ‘기록한’으로 옮겼습니다.
- source_word: because he loved him exceedingly
  english_pob_choice: because he loved him exceedingly
  chosen_korean: 이는 그를 매우 사랑했기 때문입니다.
  alternatives_korean:
  - 이는 그를 극진히 사랑했기 때문입니다.
  - 이는 그를 지극히 사랑했기 때문입니다.
  lexicon: 매우 사랑하다
  rationale: exceedingly의 강도를 과장 없이 살리기 위해 ‘매우’로 번역했습니다.
theological_decisions:
- issue: 노아가 셈에게 ‘기록한 모든 것’을 넘겨주는 행위의 의미
  chosen_reading: 가문/전승의 계승을 위한 의도적 전달로 읽었습니다.
  alternative_readings:
  - 단순한 개인 재산의 증여로 읽기
  - 문서적·계시적 전승의 공식 인도로 읽기
  rationale: 문맥상 소유 이전보다 기록된 전승의 보존과 계승이 더 두드러지므로, 과도한 계시론적 해석은 피하면서도 전승적 의미를 살렸습니다.
  doctrine_reference: 전승 보존과 가르침의 계승에 대한 일반적 성서 서술
- issue: ‘그를 매우 사랑했기 때문입니다’의 동기 절
  chosen_reading: 부정적 뉘앙스 없이 노아의 친자적 애정을 강조하는 표현으로 유지했습니다.
  alternative_readings:
  - 선택적 편애로 읽기
  - 언약적 사랑으로 확장해 읽기
  rationale: 원문은 사랑의 강도를 말할 뿐 선택/배제의 신학을 직접 말하지 않으므로, 추가 의미를 덧붙이지 않았습니다.
  doctrine_reference: 본문 우선 해석 원칙
