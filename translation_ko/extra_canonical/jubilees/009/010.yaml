  text: And he said[10], "Let a tenth of them remain before him, and let nine parts descend into the place of judgment." And he told one of us that we should teach Noah all their remedies, for
  footnotes:
  - marker: '10'
    text: The phrase 'let a tenth of them remain' preserves the chapter's distinctive explanation for ongoing demonic activity after the flood.
    reason: cross_reference
  - marker: a
    text: Or 'And one of us said that we should teach Noah'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 말했습니다[10]. “그들 중 열 분의 일은 그의 앞에 남겨 두고, 아홉 몫은 심판의 자리로 내려가게 하십시오.” 그리고 그는 우리 중 한 사람에게 노아에게 그들의 모든 치료법을 가르치게 하셨습니다. 이는[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መካነ፡ ደይን።
  english_pob_choice: the place of judgment
  chosen_korean: 심판의 자리
  alternatives_korean:
  - 심판의 곳
  - 재판의 자리
  - 심판 장소
  lexicon: place of judgment
  rationale: 문맥상 단순한 ‘장소’보다 심판이 집행되는 자리라는 기능이 중요하므로, 직역의 차가움은 유지하되 한국어로 자연스러운 ‘심판의 자리’로 옮겼습니다.
- source_word: ከመ፡ ንምሀር፡ ለኖኅ፡ ኵሎ፡ ፈውሶሙ፡
  english_pob_choice: we should teach Noah all their remedies
  chosen_korean: 노아에게 그들의 모든 치료법을 가르치게 하셨습니다
  alternatives_korean:
  - 노아에게 그들의 모든 치료 수단을 가르치게 하셨습니다
  - 노아에게 그들의 모든 치유법을 가르치게 하셨습니다
  lexicon: all their remedies
  rationale: '`ፈውሶሙ`는 ‘치료, 치유 수단, 약’의 뜻을 가질 수 있어 ‘치료법’이 가장 중립적이며, 목록성 있는 ‘모든’과도 잘 맞습니다.'
- source_word: ወለአሐዱ፡ እምኔነ፡ ይቤ፡
  english_pob_choice: And he told one of us
  chosen_korean: 그리고 그는 우리 중 한 사람에게 … 하셨습니다
  alternatives_korean:
  - 그리고 우리 중 한 사람에게 … 말씀하셨습니다
  - 그리고 우리 중 한 사람에게 … 말했습니다
  lexicon: he told one of us
  rationale: 수정 반영본에 따라 동사의 주어는 ‘우리 중 한 사람’이 아니라 앞선 화자이며, `ለ`의 방향/대상 관계를 살려 ‘~에게’로 처리했습니다.
theological_decisions:
- issue: ‘열 분의 일’과 ‘아홉 몫’의 분배 표현
  chosen_reading: 영적 존재의 일부는 남기고 나머지는 심판의 자리로 내려가게 하는, 본문의 특유한 악령 기원 설명을 그대로 살렸습니다.
  alternative_readings:
  - 도덕적 비유로 완화하는 읽기
  - 단순한 수량 분배로 일반화하는 읽기
  rationale: 족장기 경전 특유의 악령 설명을 약화하지 않고, 영어 POB 주석이 지적한 장의 독특한 신학을 보존하기 위해서입니다.
  doctrine_reference: 율법 밖 전승에 대한 서사적 묘사
