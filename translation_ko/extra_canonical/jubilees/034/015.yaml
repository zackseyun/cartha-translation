translation:
  language: ko
  text: 그 날 빌하는 요셉이 죽었다는 소식을 듣고 그를 위하여 애곡하던 중 카프라테프[15]에서 죽었습니다. 요셉이 죽은 뒤에는 야곱의 딸 디나도 죽었습니다.
  philosophy: optimal-equivalence
