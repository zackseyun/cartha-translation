  source_fidelity: 빌하가 요셉의 죽음 소식을 듣고 애곡하던 중 카프라테프에서 죽었으며, 이어 디나도 요셉이 죽은 뒤 죽었다는 내용은 대체로 충실합니다. 그러나 초안의 ‘그의 딸 디나’는 바로 앞의 요셉을 가리키는 것으로 읽힐 수 있어, 원문의 계보 관계(야곱의 딸)를 한국어에서 명시해야 합니다. 또한 지명 불확실성 주석의 표지가 지명에 붙어야 합니다.
  naturalness: 합쇼체는 자연스럽지만, 모호한 소유 표현을 ‘야곱의 딸 디나’로 풀면 현대 한국어에서 더 명료하고 자연스럽습니다.
