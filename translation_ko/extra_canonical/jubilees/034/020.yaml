base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/020.yaml
  text: And after Joseph was taken away, the sons of Jacob took wives. The name of Reuben’s wife was Ada, and the name of Simeon’s wife was Adiba, a Canaanite; and the name of Levi’s wife was Melka, from the daughters of Aram, from the seed of the sons of Terah; and the name of Judah’s wife was Bethasu’el, a Canaanite; and the name of Issachar’s wife was Hezaqa; and the name of Zebulun’s wife was Ni’aman; and the name of Dan’s wife was Egla; and the name of Naphtali’s wife was Rasu’a, from Mesopotamia; and the name of Gad’s wife was Maka; and the name of Asher’s wife was Ijona; and the name of Joseph’s wife was Asenath, an Egyptian; and the name of Benjamin’s wife was Iyasaka.
translation:
  language: ko
  text: 요셉이 사라진 뒤에 야곱의 아들들이 아내를 맞이했습니다. 르우벤의 아내의 이름은 아다였고, 시므온의 아내의 이름은 가나안 여인 아디바였으며, 레위의 아내의 이름은 아람의 딸들 가운데 한 사람이며 데라의 아들들의 후손인 멜카였습니다. 유다의 아내의 이름은 가나안 여인 베타수엘이었고, 잇사갈의 아내의 이름은 헤자카였으며, 스불론의 아내의 이름은 니아만이었습니다. 단의 아내의 이름은 에글라였고, 납달리의 아내의 이름은 메소포타미아 출신 라수아였으며, 갓의 아내의 이름은 마카였습니다. 아셀의 아내의 이름은 이요나였고, 요셉의 아내의 이름은 이집트 여인 아세낫이었으며, 베냐민의 아내의 이름은 이야사카였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐጕለ፡ ዮሴፍ፡
  english_pob_choice: And after Joseph was taken away
  chosen_korean: 요셉이 사라진 뒤에
  alternatives_korean:
  - 요셉이 제거된 뒤에
  - 요셉이 데려가진 뒤에
  - 요셉이 떠난 뒤에
  lexicon: source note
  rationale: 동사는 문맥상 요셉이 더 이상 함께 있지 않게 된 상태를 가리키므로, 한국어에서는 과도하게 특정하지 않으면서도 사건의 결과를 드러내는 표현으로 옮겼습니다.
- source_word: ነሥኡ፡ *ሰርእሶሙ፡
  english_pob_choice: the sons of Jacob took wives
  chosen_korean: 야곱의 아들들이 아내를 맞이했습니다
  alternatives_korean:
  - 야곱의 아들들이 아내를 취했습니다
  - 야곱의 아들들이 장가들었습니다
  lexicon: source note
  rationale: 직역식 ‘취하다’보다 한국어 서술문에서 자연스럽고 혼인 행위를 분명히 드러내는 ‘아내를 맞이하다’를 택했습니다.
- source_word: አንስትያ፡
  english_pob_choice: wives / wife of
  chosen_korean: 아내의 이름은
  alternatives_korean:
  - 아내는
  - 배필의 이름은
  lexicon: source note
  rationale: 본문이 각 족장의 배우자 이름을 열거하므로, 한국어에서는 반복 구조를 살려 ‘아내의 이름은’으로 통일했습니다.
- source_word: ከናዊት
  english_pob_choice: a Canaanite
  chosen_korean: 가나안 여자
  alternatives_korean:
  - 가나안 사람
  - 가나안 출신 여자
  lexicon: source note
  rationale: 여성 배우자를 가리키는 문맥이므로 성별을 분명히 하는 한국어 관용을 따랐습니다.
- source_word: እምዘርአ፡ ውሉደ፡ ታራን፡
  english_pob_choice: from the seed of the sons of Terah
  chosen_korean: 다라의 아들들의 씨에서 나온 사람이었습니다
  alternatives_korean:
  - 다라의 아들들의 후손이었습니다
  - 다라의 자손의 씨에서 나왔습니다
  lexicon: source note
  rationale: ‘씨’와 계보적 기원을 함께 유지해야 하므로, 직설적이지만 문맥상 이해 가능한 형태로 옮겼습니다.
- source_word: ሜስጶጦምያ፡
  english_pob_choice: Mesopotamia
  chosen_korean: 메소포타미아
  alternatives_korean:
  - 메소포타미아 지역
  - 메소포타미아 땅
  lexicon: source note
  rationale: 고유 지명은 현대 표기법에 맞춰 음역했습니다.
- source_word: ግብጻዊት፡
  english_pob_choice: an Egyptian
  chosen_korean: 이집트 사람
  alternatives_korean:
  - 이집트 여자
  - 이집트인
  lexicon: source note
  rationale: 영어 본문의 수정처럼 정관사적 느낌을 피하고, 여성 인물에 맞는 자연스러운 민족 출신 표현으로 처리했습니다.
