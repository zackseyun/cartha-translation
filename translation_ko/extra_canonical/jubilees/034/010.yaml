translation:
  language: ko
  text: 그의 종들에 관해서는, 그와 그의 아들들이 이집트로 내려간 날까지였습니다. 그리고 이 주기의 일곱째 해에 그는 요셉을 그의 집에서 보내어 형제들의 안부를 알게 하였는데, 그 땅의…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አግብርተ፡
  english_pob_choice: his servants
  chosen_korean: 그의 종들
  alternatives_korean:
  - 그의 노예들
  - 그의 하인들
  lexicon: Geez አግብርተ፡ (servants/slaves)
  rationale: 본문의 관계적 종속성을 드러내되, 한국어에서는 가장 중립적인 ‘종들’로 옮겨 영어 POB의 ‘servants’를 반영했습니다.
- source_word: ወረዱ፡ ... ውስተ፡ ግብጽ።
  english_pob_choice: went down into Egypt
  chosen_korean: 이집트로 내려간
  alternatives_korean:
  - 이집트로 내려가신
  - 이집트로 갔던
  lexicon: Geez 하강 동사 + 목적지 표현
  rationale: ‘내려가다’는 지리적 하강과 출애굽기 전 가족 이동의 관용을 살리므로 직역에 가깝게 유지했습니다.
- source_word: ዮሴፍሃ፡ ከመ፡ ያእምር፡ ሰላሞሙ፡ ለአኀዊሁ፡
  english_pob_choice: to learn of the welfare of his brothers
  chosen_korean: 형제들의 안부를 알게 하였는데
  alternatives_korean:
  - 형제들의 평안을 알아보게 하였는데
  - 형제들이 평안한지를 알게 하였는데
  lexicon: Geez ያእምር + ሰላም
  rationale: ‘안부’는 평강/평안을 단순 감정 상태로 좁히지 않으면서도 ‘그들의 형편을 알아봄’이라는 조사 목적을 자연스럽게 드러냅니다.
- source_word: ውስተ፡ ምድረ፡
  english_pob_choice: in the land of
  chosen_korean: 그 땅의…
  alternatives_korean:
  - 그 땅에서
  - 그 땅의
  lexicon: Geez construct state ምድረ
  rationale: 주어진 게에즈가 속격/연결형 ‘land of’를 요구하고, 절이 본문상 미완으로 끝나므로 한국어도 미완의 표시를 살려 ‘그 땅의…’로 옮겼습니다.
theological_decisions:
- issue: 본문이 미완으로 끝나는 절 처리
  chosen_reading: 의도적으로 문장을 매끈하게 완결하지 않고 ‘그 땅의…’로 남겨, 주어진 원문과 영어 POB가 보이는 절단/누락 상태를 반영했습니다.
  alternative_readings:
  - 문장을 완결시켜 ‘그 땅에서’로 옮김
  - 누락을 보충해 지명까지 추정함
  rationale: 수정본과 원문 검토가 모두 절의 끝이 속격형으로 남아 있음을 지적하므로, 번역에서도 미완성을 보존하는 것이 텍스트 충실성에 부합합니다.
  doctrine_reference: textual fidelity / source criticism
- issue: 요셉의 파견 목적 표현
  chosen_reading: ‘형제들의 안부를 알게 하였는데’로 번역해 평강/형편을 확인하는 목적을 드러냈습니다.
  alternative_readings:
  - ‘형제들의 평안을 알아보게’
  - ‘형제들의 안부를 살피게’
  rationale: 히브리/게에즈 계열의 평강 어휘는 단순 인사말이 아니라 상대의 상태와 안녕 전체를 확인하는 뜻이 있어, 한국어 ‘안부’가 가장 균형 잡힌 대응입니다.
  doctrine_reference: semantic range of שָׁלוֹם / ሰላም
