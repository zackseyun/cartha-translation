  rationale: 원문과 English POB가 모두 다음 내용으로 이어지는 도입부만 제공하므로, 완결되지 않은 발화를 그대로 보존하는 것이 출처 충실성에 맞습니다.
  doctrine_reference: source fidelity / discourse continuity
