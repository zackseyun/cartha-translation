lexical_decisions:
- source_word: እም ምድረ ከናዓን
  english_pob_choice: from the land of Canaan
  chosen_korean: 가나안 땅에서였습니다
  alternatives_korean:
  - 가나안 땅에서
  - 가나안 땅으로부터였습니다
  lexicon: source preposition + place phrase
  rationale: Ge'ez의 እም은 ‘~에서/~로부터’의 출발을 나타내므로, English POB의 수정된 읽기처럼 ‘가나안 땅에서’로 옮겼습니다.
- source_word: ወዜነዉዎ ለያዕቆብ
  english_pob_choice: And they told Jacob
  chosen_korean: 그리고 그들이 야곱에게 말하여 이르기를
  alternatives_korean:
  - 그리고 그들이 야곱에게 알렸습니다
  - 그들이 야곱에게 말했습니다
  lexicon: reporting verb + indirect speech
  rationale: 서술형 보고 동사를 자연스럽게 살리되, 뒤의 인용문과 맞도록 ‘말하여 이르기를’로 처리했습니다.
- source_word: ናሁ
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: deictic attention marker
  rationale: 청자 주의를 끄는 감탄사로서 현대 한국어에서는 ‘보십시오’가 가장 자연스럽고 공손한 대응입니다.
- source_word: ነገሥተ አሞሬዎን
  english_pob_choice: the kings of the Amorites
  chosen_korean: 아모리 사람들의 왕들
  alternatives_korean:
  - 아모리족의 왕들
  - 아모리인들의 왕들
  lexicon: ethnonym + genitive construction
  rationale: 민족명 아모리인을 표준적으로 풀어 ‘아모리 사람들’로 옮기고, 지배자 복수는 ‘왕들’로 유지했습니다.
