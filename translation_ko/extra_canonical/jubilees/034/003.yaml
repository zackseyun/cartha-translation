  to: 나무들 아래에서 그들의 가축을 빼앗으려 하였습니다. 그러나 야곱과 레위와 유다와 요셉은 아버지 이삭과 함께 집에 있었는데, 이삭의 영이 괴로웠고 그들이 이삭을 떠날 수 없었기 때문입니다.
