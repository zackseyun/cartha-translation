  text: under the trees, and to seize their cattle. But Jacob, and Levi, and Judah, and Joseph were in the house with Isaac their father, because his spirit was grieved and they could not leave him.
translation:
  language: ko
  text: 나무들 아래에서 그들의 가축을 빼앗으려 하였습니다. 그러나 야곱과 레위와 유다와 요셉은 아버지 이삭과 함께 집에 있었는데, 그의 영이 괴로워져서 그를 떠날 수 없었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታሕተ፡ አም፡
  english_pob_choice: under the trees
  chosen_korean: 나무들 아래에서
  alternatives_korean:
  - 그 나무들 아래에서
  - 수풀 아래에서
  lexicon: ጽ/under + trees
  rationale: 장소 부사구를 자연스러운 현대 한국어로 옮기되, 원문의 복수성도 보이도록 ‘나무들’로 처리했습니다.
- source_word: ወከመ፡ ይማርኩ፡ እንስሳሆሙ።
  english_pob_choice: and to seize their cattle
  chosen_korean: 그들의 가축을 빼앗으려 하였습니다
  alternatives_korean:
  - 그들의 가축을 잡으려 하였습니다
  - 그들의 가축을 노획하려 하였습니다
  lexicon: seize / cattle
  rationale: ‘빼앗다’가 강탈·노획의 의미를 가장 자연스럽게 전달하며, 가축의 소유를 함의하는 목적 구조를 잘 살립니다.
- source_word: መንፈሱ፡
  english_pob_choice: his spirit
  chosen_korean: 그의 영
  alternatives_korean:
  - 그의 마음
  - 그의 정신
  lexicon: πνεῦμα / spirit
  rationale: 게에즈 원문의 ‘영’을 그대로 살려, 단순 심리 상태로 축소하지 않았습니다.
- source_word: ወስእኑ፡ ኀዲጎተ፡
  english_pob_choice: they could not leave him
  chosen_korean: 그를 떠날 수 없었기 때문입니다
  alternatives_korean:
  - 그를 두고 갈 수 없었기 때문입니다
  - 그를 남겨둘 수 없었기 때문입니다
  lexicon: could not leave
  rationale: 원인의 연결을 분명히 하면서도, 한국어에서 가장 자연스러운 서술로 ‘떠날 수 없었다’를 택했습니다.
theological_decisions:
- issue: 이삭의 상태를 나타내는 표현
  chosen_reading: ‘그의 영이 괴로워져서’로 옮겨, 단순한 감정적 슬픔보다 더 강한 내적 고통을 드러냈습니다.
  alternative_readings:
  - 그의 영이 슬퍼서
  - 그의 영이 근심하여
  rationale: 영의 상태를 표지하는 원문의 표현을 약화시키지 않기 위해, POB의 ‘grieved’를 한국어에서 더 강한 ‘괴로워져서’로 반영했습니다.
  doctrine_reference: 인간 내면의 ‘영’과 정서적 고통을 함께 나타내는 서술
