base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/018.yaml
  text: Therefore it was ordained for the sons of Israel that they should afflict themselves on the tenth of the seventh month[a], on the day when the news about Joseph reached Jacob his father, and that they should make atonement for themselves on it with a young goat on the tenth of the seventh month, once each year, because of their sins; for they had grieved the affection of their father for Joseph his son.
  footnotes:
  - marker: a
    text: The chapter links the annual self-affliction on the tenth of the seventh month with Joseph's bloodied garment and Jacob's mourning, functioning as an etiology for the observance of the Day of Atonement (Yom Kippur).
    reason: cross_reference
translation:
  language: ko
  text: 그러므로 이스라엘 자손에게는 일곱째 달의 열흘째 날, 곧 요셉에 관한 소식이 그의 아버지 야곱에게 전해진 그 날에 스스로를 괴롭게 하도록 정해졌습니다. 또한 그들은 자기들의 죄 때문에 해마다 한 번, 일곱째 달의 열흘째 날에 어린 염소로 그것 위에서 자신들을 속죄해야 했습니다. 이는 그들이 요셉, 곧 자기 아들 때문에 아버지의 사랑을 아프게 했기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  english_pob_choice: it was ordained
  chosen_korean: 정해졌습니다
  alternatives_korean:
  - 제정되었습니다
  - 명령되었습니다
  lexicon: —
  rationale: 의례 규정의 성격을 살리되, 단순 행정적 ‘명령’보다 제도적으로 정해진 상태를 자연스럽게 드러냅니다.
- source_word: ይሕመሙ
  english_pob_choice: they should afflict themselves
  chosen_korean: 스스로를 괴롭게 하도록
  alternatives_korean:
  - 자신을 괴롭히도록
  - 금식하도록
  lexicon: —
  rationale: 히브리어 관용적 ‘자기 몸을 낮추다/괴롭게 하다’에 맞춰, 금식으로만 좁히지 않고 자기 겸비의 의미를 보존합니다.
- source_word: ጠሊ
  english_pob_choice: young goat
  chosen_korean: 어린 염소
  alternatives_korean:
  - 새끼 염소
  - 염소 새끼
  lexicon: Leslau
  rationale: 제사 제물로 바치는 어린 염소를 가장 자연스럽고 분명하게 옮겼습니다.
- source_word: አሕዘኑ ምሕረቶ
  english_pob_choice: they had grieved the affection
  chosen_korean: 아버지의 사랑을 아프게 했기 때문입니다
  alternatives_korean:
  - 아버지의 애정을 슬프게 했기 때문입니다
  - 아버지의 마음을 아프게 했기 때문입니다
  lexicon: —
  rationale: 관계적 정서를 드러내는 표현으로, 단순 감정이 아니라 야곱과 요셉 사이의 부자 관계의 상처를 살렸습니다.
- source_word: ዜናሁ ... በጽሐ
  english_pob_choice: the news about Joseph reached Jacob his father
  chosen_korean: 요셉에 관한 소식이 그의 아버지 야곱에게 전해진
  alternatives_korean:
  - 요셉에 대한 소식이 그의 아버지 야곱에게 পৌঁ한
  - 요셉 소식이 그의 아버지 야곱에게 닿은
  lexicon: —
  rationale: 소식이 ‘도착했다/전해졌다’는 사건성을 유지하고, 원문이 말하는 것은 죽음의 소식이 아니라 요셉에 관한 소식임을 반영합니다.
theological_decisions:
- issue: 속죄 의례의 근거를 요셉 사건과 연결하는 이집트-탈출 전승의 기원 설명
  chosen_reading: 본문의 규범적 조항은 해마다 반복되는 속죄와 자기 괴로움의 관습을 요셉 사건의 애통과 연결하는 기원 설명으로 옮겼습니다.
  alternative_readings:
  - 단순한 역사 서술로만 처리
  - 유월절/속죄일 전통과의 연결을 약화
  rationale: 영문 POB의 주석과 원문이 이 절을 연례 관습의 기원으로 설명하므로, 제의적-기억 공동체의 해석을 보존해야 합니다.
  doctrine_reference: 기억-의례의 기원 설명; 속죄일 전승과의 연결
