    text: 이 장은 일곱째 달 열흘째 날의 해마다 하는 자기 괴로움과 속죄를 요셉의 피 묻은 옷과 야곱의 애통에 연결하며, 이 의례의 기원을 설명합니다. 이는 속죄일(욤 키푸르) 의식의 기원 설명으로 기능합니다.
    reason: cross_reference
  revision_rationale: Replaced the non-temporal, unnatural ‘그것 위에서’ with ‘그 날에’; clarified the father–son referents in the final clause; and recast the coordinated requirements as one ordinance, preserving the source’s syntax and meaning. The note retains the English audit trail’s explanatory function while avoiding a claim stronger than the passage’s etiological connection.
