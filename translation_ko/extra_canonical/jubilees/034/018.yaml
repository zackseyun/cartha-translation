revisions:
- from: 그러므로 이스라엘 자손에게는 일곱째 달의 열흘째 날, 곧 요셉에 관한 소식이 그의 아버지 야곱에게 전해진 그 날에 스스로를 괴롭게 하도록 정해졌습니다. 또한 그들은 자기들의 죄 때문에 해마다 한 번, 일곱째 달의 열흘째 날에 어린 염소로 그것 위에서 자신들을 속죄해야 했습니다. 이는 그들이 요셉, 곧 자기 아들 때문에 아버지의 사랑을 아프게 했기 때문입니다.[a]
  to: 그러므로 이스라엘 자손에게는 일곱째 달 열흘째 날, 곧 요셉에 관한 소식이 그의 아버지 야곱에게 전해진 그 날에 스스로를 괴롭게 하고, 해마다 한 번 그 날에 어린 염소로 자기들의 죄를 위하여 자신들을 속죄하도록 정해졌습니다.[a] 이는 그들이 아들 요셉을 향해 그들의 아버지가 품은 애정을 슬프게 했기 때문입니다.
  rationale: Replaced the non-temporal, unnatural ‘그것 위에서’ with ‘그 날에’; clarified the father–son referents in the final clause; and recast the coordinated requirements as one ordinance, preserving the source’s syntax and meaning. The note retains the English audit trail’s explanatory function while avoiding a claim stronger than the passage’s etiological connection.
