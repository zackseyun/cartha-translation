  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
  footnotes:
  - marker: '21'
    text: The verb for Simeon may mean 'repented,' 'changed his mind,' or more generally 'turned'; the sense is that he took another wife from Mesopotamia like his brothers.
    reason: alternative_reading
  - marker: a
    text: Or 'And Simeon regretted it'.
    reason: previous_rendering
translation:
  language: ko
  text: 베냐민의 아내는 이야사카였습니다. 그리고 시므온은 그것을 후회하고 메소포타미아에서 둘째 아내를 맞았는데, 그의 형제들처럼 그랬습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለብእሲተ፡ ብንያም፡ ኢያስካ፡
  english_pob_choice: The wife of Benjamin was Iyasaka.
  chosen_korean: 베냐민의 아내는 이야사카였습니다.
  alternatives_korean:
  - 베냐민의 아내는 이야사카였습니다.
  - 베냐민의 아내가 이야사카였습니다.
  lexicon: 고유명사
  rationale: 게으즈 원문은 베냐민의 아내를 먼저 제시하고 이름을 붙이므로, 한국어도 동일한 정보 순서를 유지해 자연스럽게 옮겼습니다.
- source_word: ወተመይጠ፡
  english_pob_choice: Simeon regretted it
  chosen_korean: 시므온은 그것을 후회하고
  alternatives_korean:
  - 시므온은 그것을 후회하고
  - 시므온은 돌이키고
  - 시므온은 마음을 바꾸고
  lexicon: 번역어 선택
  rationale: 영어 POB가 주석으로 이 동사가 ‘repented / changed his mind / turned’일 수 있다고 밝혀, 문맥상 가장 무난한 ‘후회하고’를 본문에 두었습니다.
- source_word: ካልእተ፡
  english_pob_choice: a second wife
  chosen_korean: 둘째 아내
  alternatives_korean:
  - 두 번째 아내
  - 다른 아내
  - 둘째 부인
  lexicon: 수량/관계 표현
  rationale: 원문은 ‘another/second wife’의 관계를 나타내므로, 가족 서술 문맥에 맞는 ‘둘째 아내’를 사용했습니다.
- source_word: እም፡ ሜስጶ ጦምያ፡
  english_pob_choice: from Mesopotamia
  chosen_korean: 메소포타미아에서
  alternatives_korean:
  - 메소포타미아에서
  - 메소포타미아로부터
  lexicon: 지명
  rationale: 지명은 현대 한국어 표기를 따르되, 출처가 분명히 ‘from’이므로 출신지를 나타내는 ‘에서’를 썼습니다.
theological_decisions:
- issue: 시므온의 동사 의미가 단순 후회인지, 회개인지, 방향 전환인지
  chosen_reading: 본문에는 ‘후회하고’로 두되, 회개라는 신학적 의미를 본문에 강하게 부여하지 않았습니다.
  alternative_readings:
  - 회개하고
  - 돌이키고
  - 마음을 바꾸고
  rationale: 영어 POB 주석이 의미 범위를 넓게 열어 두고 있어, 회개를 단정하면 원문보다 신학적 강도를 높일 수 있으므로 중립적인 ‘후회하고’를 택했습니다.
  doctrine_reference: 문맥 해석 및 의미 범위 보존
