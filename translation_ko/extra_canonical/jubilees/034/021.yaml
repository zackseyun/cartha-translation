  lexicon: 지명
  rationale: 지명은 현대 한국어 표기를 따르되, 출처가 분명히 ‘from’이므로 출신지를 나타내는 ‘에서’를 썼습니다.
theological_decisions:
- issue: 시므온의 동사 의미가 단순 후회인지, 회개인지, 방향 전환인지
  chosen_reading: 본문에는 ‘후회하고’로 두되, 회개라는 신학적 의미를 본문에 강하게 부여하지 않았습니다.
  alternative_readings:
  - 회개하고
  - 돌이키고
  - 마음을 바꾸고
  rationale: 영어 POB 주석이 의미 범위를 넓게 열어 두고 있어, 회개를 단정하면 원문보다 신학적 강도를 높일 수 있으므로 중립적인 ‘후회하고’를 택했습니다.
  doctrine_reference: 문맥 해석 및 의미 범위 보존
