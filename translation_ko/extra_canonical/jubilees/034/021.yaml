  - 둘째 부인
  lexicon: 수량/관계 표현
  rationale: 원문은 ‘another/second wife’의 관계를 나타내므로, 가족 서술 문맥에 맞는 ‘둘째 아내’를 사용했습니다.
- source_word: እም፡ ሜስጶ ጦምያ፡
