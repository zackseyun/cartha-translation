  text: The wife of Benjamin was Iyasaka. And Simeon regretted it and took a second wife from Mesopotamia[21], like his brothers.
  footnotes:
  - marker: '21'
    text: The verb for Simeon may mean 'repented,' 'changed his mind,' or more generally 'turned'; the sense is that he took another wife from Mesopotamia like his brothers.
    reason: alternative_reading
  - marker: a
    text: Or 'And Simeon regretted it'.
    reason: previous_rendering
translation:
  language: ko
  text: 베냐민의 아내는 이야사카였습니다. 시므온은 후회하여 그의 형제들처럼 메소포타미아에서 온 둘째 아내를 맞았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘후회하여’로 옮긴 동사는 ‘회개하다’, ‘마음을 바꾸다’, 또는 더 일반적으로 ‘돌이키다’를 뜻할 수도 있습니다. 여기서는 시므온이 그의 형제들처럼 메소포타미아에서 또 한 아내를 맞았다는 뜻입니다.
    reason: alternative_reading
