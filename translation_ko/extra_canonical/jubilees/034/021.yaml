  lexicon: 번역어 선택
  rationale: 영어 POB가 주석으로 이 동사가 ‘repented / changed his mind / turned’일 수 있다고 밝혀, 문맥상 가장 무난한 ‘후회하고’를 본문에 두었습니다.
- source_word: ካልእተ፡
  english_pob_choice: a second wife
  chosen_korean: 둘째 아내
