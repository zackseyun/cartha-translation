translation:
  language: ko
  text: 그는 무기를 든 육천 명을 죽였습니다. 또 세겜의 내리막[a]에서 그들을 죽이고, 달아난 자들을 추격하여 칼날로 죽였으며, 아레스와 타푸와 세라간도 죽였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘평야’.
    reason: 제공된 영어 POB 감사 이력의 기존 각주(“Or ‘plain’”)를 ‘세겜의 내리막’에 올바르게 연결합니다. 본문은 원어 및 최신 검토에 따라 ‘내리막’으로 유지합니다.
lexical_decisions:
- source_word: በውስተ፡ ጸአተ፡ ዘሴቄም
  english_pob_choice: in the descent of Shechem
  chosen_korean: 세겜의 내리막에서
  alternatives_korean:
  - 세겜의 산길에서
  - 세겜의 비탈에서
  - 세겜의 평야에서
  lexicon: 지형어
  rationale: 검증 이력상 ጸአተ는 ‘plain’이 아니라 ‘descent’로 바로잡혔으므로, 지형의 하강을 드러내는 ‘내리막’으로 옮겼습니다.
- source_word: ወቀተሎሙ፡ እለ፡ ጐዩ
