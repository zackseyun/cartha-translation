  verdict: revise
  source_fidelity: መራዕይሁ는 가축으로 한정하기보다 ‘소유물/재산’으로 포괄적으로 옮기는 것이 안전합니다. 정복, 공물 부과, 토지 소산의 오분의 일이라는 관계와 수량은 충실히 보존되었습니다. 마지막 ወሐነጸ፡는 목적어가 다음 문맥에 걸린 미완의 ‘그리고 그는 세웠습니다’로 남겨야 합니다.
  naturalness: 원안의 첫 문장 ‘…가가아스입니다’는 앞 절에서 이어지는 이름 열거를 독립적인 존대 종결문처럼 보이게 하므로 자연스럽지 않습니다. 이름 열거를 쉼표로 다음 절에 연결하고, ‘그들 위에 공물을 부과하여’는 현대 한국어에 맞게 ‘그들에게 공물을 부과하여’로 고쳤습니다.
  terminology: ‘소유물’, ‘공물’, ‘소산’, ‘오분의 일’은 각각 본문의 포괄성, 정복 뒤의 종속적 납부, 농지 산출물, 분량을 적절히 나타냅니다. 인명은 제공된 영어 감사본의 표기와 일치하게 세로, 아마니스케르, 가가아스로 유지했습니다.
  issues:
  - severity: medium
    issue: 첫 이름 열거가 ‘입니다’로 종결됨
