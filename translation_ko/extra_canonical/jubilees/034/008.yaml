  text: and Selo and Amanisker and Gagaas. And he recovered his built[8], and prevailed over them, and imposed tribute on them, so that they gave him tribute, a fifth of the produce of their land. And he built
  footnotes:
  - marker: '8'
    text: The two built places are textually uncertain in form; 'Robel' and 'Tamnatares' are provisional transliterations from the Ethiopic.
    reason: textual_variant
  - marker: a
    text: Or 'possessions[8]'.
    reason: previous_rendering
translation:
  language: ko
  text: 세로와 아마니스케르와 가가아스, 그리고 그는 자기 소유물을 되찾고 그들을 물리쳐 그들에게 공물을 부과하였습니다. 그리하여 그들은 그에게 자기네 땅의 소산 가운데 오분의 일을 공물로 바쳤습니다. 그리고 그는 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 세워진 두 장소의 이름 형태는 본문상 불확실합니다. ‘로벨’과 ‘탐나타레스’는 에티오피아어 본문에 따른 잠정적 음역입니다.
    reason: textual_variant
lexical_decisions:
- source_word: መራዕይሁ
  english_pob_choice: his built[8] / his possessions
  chosen_korean: 자기의 소유
  alternatives_korean:
  - 자기의 재산
  - 자기의 소유물
  - 자기 소유의 것들
  lexicon: 'Geez መራዕይ / English audit: possessions'
  rationale: 영어 감사본이 'possessions'로 갱신되었으므로, 가축에만 한정되지 않는 포괄적 의미를 살려 '소유'로 옮겼습니다.
- source_word: ወሠርዐ፡ ፀባሕተ፡ ላዕሌሆሙ፡
  english_pob_choice: imposed tribute on them
  chosen_korean: 그들 위에 공물을 부과하여
  alternatives_korean:
  - 그들에게 조공을 매겨
  - 그들에게 세금을 부과하여
  - 그들 위에 조세를 부과하여
  lexicon: 'Geez tribute language / English audit: tribute'
  rationale: ‘tribute’의 종속적·정복 관계를 드러내기 위해 현대어로는 '공물'을 택했고, 동사구는 원문의 강한 강제성을 살려 '부과하여'로 옮겼습니다.
- source_word: ኀምስተ፡ ፍሬ፡ ምድርሙ፡
  english_pob_choice: a fifth of the produce of their land
  chosen_korean: 그 땅의 소산의 오분의 일을
  alternatives_korean:
  - 그 땅의 생산물의 오분의 일을
  - 그 땅의 소출의 오분의 일을
  - 그들의 땅에서 난 것의 오분의 일을
  lexicon: 'Geez produce of their land / English audit: a fifth of the produce'
  rationale: ‘produce’를 '소산'으로 옮겨 토지에서 나는 산출물 전체를 포괄하게 했고, 분량 표현은 원문의 '오분의 일'을 그대로 반영했습니다.
- source_word: ወሐነጸ፡
  english_pob_choice: And he built
  chosen_korean: 그리고 그는 세웠습니다
  alternatives_korean:
  - 그리고 그는 건축하였습니다
  - 그리고 그는 건설하였습니다
  - 그리고 그는 지었습니다
  lexicon: 'Geez build / English audit: built[8]'
  rationale: 이 동사는 절 끝에 남아 있고, 주석의 'built' 표지가 붙어 있으므로 다음 절로 이어질 문두를 예고하는 형태로 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: 정복 후 공물 부과의 정치·사회적 함의
  chosen_reading: 본문의 '공물'은 단순한 세금이 아니라 정복자의 종속을 드러내는 제도적 징표로 읽어야 합니다.
  alternative_readings:
  - 중립적 재정 조달로 보는 읽기
  - 조공/세금으로 약화해 보는 읽기
  rationale: 문맥상 그는 '그들을 이겨' 곧바로 공물을 부과하므로, 종속 관계를 흐리지 않도록 정복-조공 구조를 보존했습니다.
  doctrine_reference: 역사 서술의 문자적·서사적 의미 보존
- issue: 끝의 '그리고 그는 세웠습니다'의 미완 결말
  chosen_reading: 문장이 절단된 상태를 보존하여 완결하지 않았습니다.
  alternative_readings:
  - 이전 문맥을 따라 보완 번역하기
  - 자연스러운 한국어를 위해 문장을 매끄럽게 마무리하기
  rationale: 주어진 원문이 다음 절로 이어지는 미완형이므로, 번역에서도 종결 어미만 맞추고 내용 보충은 하지 않았습니다.
  doctrine_reference: 본문 비평상 불완전 구절의 보존 원칙
