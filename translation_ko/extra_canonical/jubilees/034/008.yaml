  to: 세로와 아마니스케르와 가가아스, 그리고 그는 자기 소유물을 되찾고 그들을 물리쳐 그들에게 공물을 부과하였습니다. 그리하여 그들은 그에게 자기네 땅의 소산 가운데 오분의 일을 공물로 바쳤습니다. 그리고 그는 세웠습니다.[a]
  rationale: 인명 열거를 부자연스러운 독립 종결문으로 만들지 않고 다음 서술에 연결했습니다. 공물 부과의 대상을 자연스러운 한국어로 조정했으며, 원문의 정복-공물 관계와 오분의 일이라는 수량을 유지했습니다. 절 끝의 목적어 없는 건축 동사는 다음 문맥으로 이어지는 형태를 보존했고, 이에 관련된 본문 불확실성 각주를 해당 동사에 붙였습니다.
