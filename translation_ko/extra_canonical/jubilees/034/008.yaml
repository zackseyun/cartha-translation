  - severity: low
    issue: ‘그들 위에 공물을 부과하여’의 비자연스러운 결합
    rationale: 원문의 ‘그들 위에’는 공물 부과의 대상·종속 관계를 뜻합니다. 한국어에서는 ‘그들에게 공물을 부과하여’가 자연스럽고 의미를 보존합니다.
  - severity: low
    issue: 각주 표지의 내용과 위치를 명시할 필요
    rationale: 영어 감사 이력상 표지는 마지막 ‘built’에 붙어야 하며, 세워진 두 장소의 형태가 불확실하다는 각주를 한국어에도 해당 위치에 유지해야 합니다.
