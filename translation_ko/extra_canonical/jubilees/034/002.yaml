  text: And the seven kings of the Amorites gathered against them to kill them secretly.
translation:
  language: ko
  text: 그리고 아모리 사람 일곱 왕이 그들에게 몰래 그들을 죽이려고 모였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገሥተ፡ አሞሬዎን፡
  english_pob_choice: the seven kings of the Amorites
  chosen_korean: 아모리 사람 일곱 왕
  alternatives_korean:
  - 아모리 사람의 일곱 왕
  - 아모리 족속의 일곱 왕
  lexicon: 아모리 사람
  rationale: 지명·민족 표지를 자연스럽게 살리면서도 원문의 ‘일곱 왕’ 구조를 그대로 보존했습니다.
- source_word: ወተጋብኡ፡ ላዕሌሆሙ፡
  english_pob_choice: gathered against them
  chosen_korean: 그들에게 … 모였습니다
  alternatives_korean:
  - 그들을 향해 모였습니다
  - 그들에 대항하여 모였습니다
  lexicon: 모이다
  rationale: 원문의 집결 동작을 살리되, 영어 POB의 ‘against them’이 드러내는 적대 방향은 다음 절의 살해 의도에서 자연스럽게 드러나므로 과도한 군사적 표현은 피했습니다.
- source_word: ኀብኢኦሙ፡
  english_pob_choice: secretly
  chosen_korean: 몰래
  alternatives_korean:
  - 은밀히
  - 숨겨서
  lexicon: 몰래
  rationale: 어근의 ‘숨김/은폐’ 의미와 영어 수정본의 부사적 의미를 가장 간결하게 반영했습니다.
theological_decisions:
- issue: 암살 의도의 표현
  chosen_reading: ‘몰래 그들을 죽이려고’로 옮겨, 집결의 목적이 공개 전투가 아니라 은밀한 살해임을 분명히 했습니다.
  alternative_readings:
  - ‘그들을 죽이기 위해’
  - ‘숨은 채 그들을 죽이려고’
  rationale: 본문의 서술은 단순한 공격이 아니라 비밀 암살 시도를 강조하므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 서사 본문에서의 의도·행위 묘사
