  text: And in the sixth year of this week, of this forty-fourth jubilee, Jacob sent his sons to pasture their sheep, and their servants also with them, in the pasture of Shechem.
  footnotes:
  - marker: a
    text: Or 'his servants'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 주간의 여섯째 해, 이 마흔넷째 희년의 해에 야곱은 그의 아들들을 보내어 양떼를 먹이게 하였고, 그의 종들도 그들과 함께 세겜의 목초지에 있었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዝ ሱባዔ
  english_pob_choice: this week
  chosen_korean: 이 주간
  alternatives_korean:
  - 이 주의 기간
  - 이 주간의 해
  lexicon: 주간
  rationale: Ge'ez의 ሱባዔ는 POB의 영어처럼 ‘week’로 이해하는 것이 자연스럽고, 여기서는 연속된 희년 계산 단위를 가리키므로 ‘주간’으로 옮겼습니다.
- source_word: እምዝንቱ ዘአርብዓ ወረባዕቱ እዮቤልው
  english_pob_choice: this forty-fourth jubilee
  chosen_korean: 이 마흔넷째 희년
  alternatives_korean:
  - 이 사십사 번째 희년
  - 이 마흔네 번째 희년
  lexicon: 희년
  rationale: 희년 문맥은 유대력의 기술 용어이므로 ‘희년’을 유지했고, 서수는 현대 한국어에서 자연스러운 ‘마흔넷째’로 처리했습니다.
- source_word: ፈነዎሙ ያዕቆብ ለውሉዱ
  english_pob_choice: Jacob sent his sons
  chosen_korean: 야곱은 그의 아들들을 보내어
  alternatives_korean:
  - 야곱이 자기 아들들을 보냈고
  - 야곱은 아들들을 보냈습니다
  lexicon: 보내다
  rationale: 히브리/게에즈 계열 서술에서 단순 파견 동사를 유지해, 목축을 위해 아들들을 내보낸 사건성을 분명히 했습니다.
- source_word: ይርዐዩ አባግዒሆሙ ወአግብርቲሆሙኒ
  english_pob_choice: to pasture their sheep, and their servants also with them
  chosen_korean: 양떼를 먹이게 하였고, 그의 종들도 그들과 함께
  alternatives_korean:
  - 양 떼를 치게 하였고, 그의 종들도 그들과 함께
  - 양들을 목초지로 데려가게 하였고, 그의 종들도 그들과 함께
  lexicon: 먹이다
  rationale: 목축 동사의 핵심은 ‘풀을 뜯게 하다/방목하다’이므로, 현대 한국어에서 의미가 드러나도록 ‘양떼를 먹이다’로 옮겼습니다. POB의 ‘servants’는 본문 지시가 분명한 ‘그의 종들’로 반영했습니다.
- source_word: ውስተ ጸአተ ሴቄም
  english_pob_choice: in the pasture of Shechem
  chosen_korean: 세겜의 목초지에
  alternatives_korean:
  - 세겜의 목초지에서
  - 세겜 목초지에
  lexicon: 목초지
  rationale: 장소 격은 한국어에서 자연스럽게 ‘-에’로 처리했고, ጸአተ는 단수의 목초지/방목지로 이해하여 POB의 수정판과 맞췄습니다.
theological_decisions:
- issue: Jacob's sons and servants as pastoral agents
  chosen_reading: 야곱이 아들들과 종들을 세겜의 목초지로 보내어 가축을 돌보게 한 단순 서술로 유지했습니다.
  alternative_readings:
  - 가축을 먹이게 하였다는 기능 중심 표현
  - 아들들과 종들이 자발적으로 간 것으로 읽는 해석
  rationale: 본문은 명령과 실행의 역사 서술이며, 추가적 신학적 의미를 덧붙일 근거가 없습니다. 따라서 사건의 사실성과 가족-종 관계의 질서를 그대로 드러냈습니다.
  doctrine_reference: 서술 본문 해석의 절제 원칙
- issue: Possessive reference for servants
  chosen_reading: ‘그의 종들’로 옮겨 야곱 소속임을 분명히 했습니다.
  alternative_readings:
  - ‘그들의 종들’
  - ‘종들’
  rationale: 게에즈의 소유격이 아들들에 의해 중개되는 문맥이 아니라 야곱의 소유를 가리키므로, POB의 정정 취지를 따라 한국어에서도 소유 관계를 명시했습니다.
  doctrine_reference: 본문 비평 및 대명사 지시어 일치
