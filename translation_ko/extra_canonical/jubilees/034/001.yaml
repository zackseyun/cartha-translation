revisions:
- from: 그리고 이 주간의 여섯째 해, 이 마흔넷째 희년의 해에 야곱은 그의 아들들을 보내어 양떼를 먹이게 하였고, 그의 종들도 그들과 함께 세겜의 목초지에 있었습니다.[a]
  to: 그리고 이 마흔넷째 희년에 속한 이 주간의 여섯째 해에, 야곱은 아들들을 보내어 그들의 양떼를 치게 하고, 그들의 종들도 그들과 함께 세겜의 목초지로 보냈습니다.
  rationale: 복수 소유격을 ‘그들의’로 바로잡고, 아들들과 그들의 종들이 함께 세겜의 목초지로 파견되어 양떼를 치게 되었다는 원문의 통사 관계를 자연스러운 합쇼체로 재구성했습니다. 초안의 [a]는 잘못된 단수 소유격을 전제로 한 영어 감사 이력용 주석이므로 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:58Z'
review_pass:
  verdict: revise
  source_fidelity: 게에즈 ወአግብርቲሆሙኒ의 소유 접미사는 복수이므로 ‘그의 종들’은 원문 및 영어 POB의 정정된 ‘their servants’와 일치하지 않습니다. 또한 종들이 아들들과 함께 파견되었다는 구조를 한국어 문장에서도 분명히 드러내는 것이 좋습니다.
  naturalness: 초안은 종결이 ‘있었습니다’로 되어 있어 야곱이 보낸 행위와 장소구의 관계가 다소 흐려집니다. ‘아들들과 그들의 종들을 함께 … 보냈습니다’로 하면 현대 한국어 합쇼체로 자연스럽고 사건 구조가 명료합니다.
  terminology: ‘희년’, ‘세겜’, ‘목초지’는 적절합니다. 목축 행위는 ‘양떼를 치다’가 현대 한국어 성경 문체와 일반 용법에서 자연스럽습니다.
  issues:
  - severity: high
    issue: ‘그의 종들’이라고 한 소유격
    rationale: 원문의 -homu는 복수 소유격이며, 문맥상 야곱의 아들들을 가리킵니다. 따라서 ‘그들의 종들’로 옮겨야 합니다.
  - severity: medium
    issue: 종들과 장소구의 문장 연결
    rationale: ‘그의 종들도 그들과 함께 세겜의 목초지에 있었습니다’는 파견의 목적·도착을 서술하는 원문의 구조를 약화합니다. 종들도 아들들과 함께 세겜의 목초지로 보냈다고 명시하는 편이 충실합니다.
  revised_text: 그리고 이 마흔넷째 희년에 속한 이 주간의 여섯째 해에, 야곱은 아들들을 보내어 그들의 양떼를 치게 하고, 그들의 종들도 그들과 함께 세겜의 목초지로 보냈습니다.
