translation:
  language: ko
  text: “너희 아들들을 포위하였고, 그들의 가축은 빼앗겼습니다.” 그는 집에서 일어나 자기와 그의 세 아들, 그리고 그의 아버지의 모든 집안 종들과 함께 그들을 향해 나아갔습니다. 육천 명을 거느리고서입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐገትዎሙ / have surrounded
  english_pob_choice: have surrounded
  chosen_korean: 포위하였고
  alternatives_korean:
  - 둘러쌌고
  - 에워쌌고
  lexicon: source verbal phrase
  rationale: 군사적 둘러쌈을 자연스럽게 드러내면서도 원문의 강한 압박감을 보존하기 위해 ‘포위하다’를 택했습니다.
- source_word: መራዕዮሙ / their flocks
  english_pob_choice: their flocks
  chosen_korean: 그들의 가축
  alternatives_korean:
  - 그들의 떼
  - 그들의 양 떼
  lexicon: source noun phrase
  rationale: 본문의 기본 뜻은 가축 무리이므로, 한국어 독자가 즉시 이해할 수 있는 ‘가축’으로 옮겼습니다. 영어 주석이 시사하는 동물 집단 의미를 유지합니다.
- source_word: ወኵሎሙ ደቂ አቡሁ / and all his father’s servants
  english_pob_choice: and all his father’s servants
  chosen_korean: 그리고 그의 아버지의 모든 집안 종들
  alternatives_korean:
  - 그리고 그의 아버지의 모든 종들
  - 그리고 그의 아버지 집의 모든 종들
  lexicon: source noun phrase
  rationale: 주석과 개정 이력을 따라, 단순한 ‘아버지의 종들’보다 집안에 속한 종들임을 분명히 하되, 두 집단을 구분하는 원문의 뉘앙스를 살렸습니다.
- source_word: በስሳ / with six thousand
  english_pob_choice: with six thousand men
  chosen_korean: 육천 명을 거느리고서입니다
  alternatives_korean:
  - 육천 명과 함께였습니다
  - 육천 명을 이끌고 갔습니다
  lexicon: source numeral phrase
  rationale: OCR의 혼선에도 불구하고 최종 검토가 확정한 ‘육천’의 수치를 반영했고, 전투 행진 맥락에 맞게 ‘거느리고서’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 가축과 병력의 동시 제시
  chosen_reading: 전리품으로서의 가축 약탈과 전투 인력 동원이라는 두 요소를 모두 본문 그대로 드러냈습니다.
  alternative_readings:
  - 가축을 ‘떼’로 완화해 서술하기
  - 전투 병력만 강조하고 가축 언급을 약화하기
  rationale: 게에즈 본문과 영어 POB의 주석 흐름상, 이 절은 피해 내용(가축)과 즉각적인 대응(육천 명) 모두가 핵심이므로 둘 다 유지해야 합니다.
  doctrine_reference: 서사 본문 보존 원칙
