    rationale: 현대 정중한 종결형 ‘보냈습니다’를 사용해야 합니다.
  - severity: low
    issue: ‘그것을’의 선행사가 한국어 문장 안에서 다소 불분명합니다.
    rationale: 보낸 대상은 요셉의 옷이므로 ‘그 옷을’로 명시하는 것이 자연스럽습니다.
