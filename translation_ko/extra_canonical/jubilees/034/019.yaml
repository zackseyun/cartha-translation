  source_fidelity: 첫 절의 አኅዘኑ፡ ምሕረተ፡ አቡሆሙ는 아버지의 ‘긍휼/긍휼한 마음’에 슬픔을 초래한 것을 말합니다. 초안의 ‘긍휼에 슬픔을 안겨 드린’은 원뜻을 대체로 보존하지만, 추상명사 ‘긍휼’에 높임 보조 동사 ‘드리다’를 결합하여 의미 관계가 불명료해집니다. 또한 후반의 죄·범법·잘못, 그날의 애도, 연례적 자기 정결의 의미는 충실히 반영합니다.
