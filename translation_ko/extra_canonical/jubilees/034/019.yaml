  text: Their sin was that they had brought grief to the compassion of their father because of Joseph his son. And this day was ordained so that they should grieve on it for their sins, and for all their transgressions, and for all their errors, so as to cleanse themselves on this day once each year.
translation:
  language: ko
  text: 그들의 죄는 요셉, 곧 그 아들 때문에 아버지의 긍휼에 슬픔을 안겨 드린 것이었습니다. 그리고 이 날은 그들이 자기들의 죄와 모든 범법과 모든 잘못 때문에 이 날에 슬퍼하여, 일 년에 한 번씩 이 날에 스스로를 깨끗하게 하도록 정해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኃጢአቶሙ
  english_pob_choice: Their sin
  chosen_korean: 그들의 죄
  alternatives_korean:
  - 그들의 범죄
  - 그들의 허물
  lexicon: source lexical root for sin
  rationale: 문장 첫머리의 총괄적 죄 개념을 가장 직접적으로 살리기 위해 ‘죄’로 옮겼습니다.
- source_word: አኅዘኑ፡ ምሕረተ፡ አቡሆሙ
  english_pob_choice: they had brought grief to the compassion of their father
  chosen_korean: 아버지의 긍휼에 슬픔을 안겨 드린
  alternatives_korean:
  - 아버지의 자비를 슬프게 한
  - 아버지의 긍휼을 근심하게 한
  lexicon: compassion/mercy expression
  rationale: ‘긍휼’은 아버지의 내적 자비심을 가리키는 표현으로 유지하고, 동사는 관계적 손상을 드러내는 ‘슬픔을 안겨 드리다’로 옮겼습니다.
- source_word: ዮሴፍ፡ ወልዱ
  english_pob_choice: Joseph his son
  chosen_korean: 요셉, 곧 그 아들
  alternatives_korean:
  - 그의 아들 요셉
  - 요셉 그의 아들
  lexicon: appositional clarification
  rationale: 게에즈의 소유 관계를 한국어에서 자연스럽게 풀어, ‘요셉’이 곧 ‘그 아들’임을 분명히 했습니다.
- source_word: ወተሠርዐት፡ ዛቲ፡ ዕለት
  english_pob_choice: And this day was ordained
  chosen_korean: 이 날은 ... 정해졌습니다
  alternatives_korean:
  - 이 날은 ... 제정되었습니다
  - 이 날은 ... 지정되었습니다
  lexicon: ordain/appoint
  rationale: 의례적·규정적 의미를 살리기 위해 ‘정해졌습니다’를 택해, 단순한 행정적 지정보다 신적/규정적 설정의 뉘앙스를 남겼습니다.
- source_word: ይሕዝኑ፡ ባቲ
  english_pob_choice: they should grieve on it
  chosen_korean: 이 날에 슬퍼하여
  alternatives_korean:
  - 그 날에 애통하여
  - 그 날에 슬퍼하도록
  lexicon: grieve/mourn
  rationale: 반복 절기 맥락에서 지속적 애도 행위를 나타내므로 ‘슬퍼하다’를 사용했습니다.
theological_decisions:
- issue: 연례 속죄/정결 목적의 표현
  chosen_reading: 일 년에 한 번씩 이 날에 스스로를 깨끗하게 하도록
  alternative_readings:
  - 일 년에 한 번씩 이 날에 자신을 정결하게 하도록
  - 해마다 한 번 이 날에 스스로를 깨끗하게 하도록
  rationale: 뒤의 목적절은 의례적 정결 행위를 가리키므로 ‘스스로를 깨끗하게 하다’로 유지해, 본문이 말하는 반복적 속죄·정결 목적을 드러냈습니다.
  doctrine_reference: 의례적 정결과 속죄 개념
