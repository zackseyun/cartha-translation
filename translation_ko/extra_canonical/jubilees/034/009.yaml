lexical_decisions:
- source_word: '*ርቤአሃ፡ ወትምናታሬስሃ።'
  english_pob_choice: Robel and Tamnatares.
  chosen_korean: 로벨과 탐나타레스였습니다.
  alternatives_korean:
  - 로벨과 탐나타레스입니다.
  - 로벨과 탐나타레스였습니다
  lexicon: 고유명사 음역
  rationale: 게에즈 원문은 두 인명만 제시하므로 한국어에서도 음역으로 보존했고, 앞 문장과 이어지는 서술형 진술로 자연스럽게 마무리했습니다.
- source_word: ወተመይጠ፡ በሰላም፡
  english_pob_choice: And he returned in peace
  chosen_korean: 그리고 그는 평안 중에 돌아와
  alternatives_korean:
  - 그리고 그는 평안히 돌아와
  - 그리고 그는 평강 가운데 돌아와
  lexicon: 평안 / 돌아오다
  rationale: '''በሰላም''은 단순한 이동 상태보다 평화로운 상태를 나타내므로, 한국어에서는 ''평안 중에''로 상태를 드러냈습니다.'
- source_word: ወገብረ፡ ምስሌሆሙ፡ ሰላመ፡
  english_pob_choice: and made peace with them
  chosen_korean: 그들과 화평을 이루었고
  alternatives_korean:
  - 그들과 평화를 만들었고
  - 그들과 화목을 이루었고
  lexicon: 평화/화평
  rationale: 원문의 동사-목적어 표현은 상호적 평화 수립을 뜻하므로, 한국어에서는 성경적·자연스러운 '화평을 이루다'로 옮겼습니다.
- source_word: ወኮንዎ፡
  english_pob_choice: and they became his
  chosen_korean: 그들은 그의 것이 되었습니다.
  alternatives_korean:
  - 그들은 그의 사람이 되었습니다.
  - 그들은 그의 종이 되었습니다.
  lexicon: 소유 관계를 나타내는 인칭접미사
  rationale: 영어본의 최근 수정처럼 게에즈 동사는 단순 '되었다'보다 '그의 것으로/그에게 속하게 되었다'는 관계를 시사하므로, 한국어에서도 소유·귀속 의미를 살렸습니다.
theological_decisions:
- issue: 마지막 동사의 관계성
  chosen_reading: '''그들은 그의 것이 되었습니다''로 번역해 귀속 관계를 드러냈습니다.'
  alternative_readings:
  - '''그들은 그와 함께 있었습니다'''
  - '''그들은 그의 사람이 되었습니다'''
  rationale: 원문 동사의 인칭접미사가 관계적 귀속을 암시하므로, 단순 존재나 막연한 변화로 약화시키지 않고 소유/귀속 의미를 보존했습니다.
  doctrine_reference: 문맥상 정복·동맹·종속 관계를 암시할 수 있으나, 본 절만으로 지배 구조를 단정하지 않도록 중립적으로 처리했습니다.
