base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/034/011.yaml
  text: Shechem[11], and he found them in the land of Dothan. And they dealt treacherously with him and made a plan against him to kill him; but changing their minds, they sold him to Ishmaelite merchants, and they brought him down to Egypt and sold him to Potiphar, an officer of Pharaoh, the chief of the guards, priest of the city of Heliopolis.
  footnotes:
  - marker: '11'
    text: The title rendered 'chief of the cooks' is difficult and has been rendered differently by interpreters. The translation follows the immediate Ethiopic sense rather than the more familiar Genesis wording.
    reason: lexical_alternative
  - marker: a
    text: Or 'hated him'.
    reason: previous_rendering
  - marker: b
    text: Or 'the chief of the cooks'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 세겜으로 갔으나 도단 땅에서 그들을 찾았습니다. 그들은 그에게 배신을 꾀하고 그를 죽이려는 계획을 세웠습니다.[a] 그러나 마음을 바꾸어 그를 이스마엘 사람 상인들에게 팔았고, 그를 이집트로 데려가 파라오의 관리이며 경호대장이고 헬리오폴리스 성읍의 제사장인 포티파르에게 팔았습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 속였다’.
    reason: ሐበየ는 단순한 감정인 ‘미워하다’가 아니라 기만적으로 대하거나 배신을 꾀한다는 뜻으로 이해됩니다.
  - marker: b
    text: 또는 ‘요리장’.
    reason: 직함에 대한 전통적 번역이 있으나, 게에즈 본문의 ሊቀ ዐቀብት는 직역하면 ‘경호대의 우두머리’에 가깝습니다.
lexical_decisions:
- source_word: በምክረ፡ ... ወገብሩ፡ ላዕሌሁ፡
  english_pob_choice: they dealt treacherously with him and made a plan against him to kill him
  chosen_korean: 그를 속이고 죽이려는 계획을 세웠고
  alternatives_korean:
  - 그를 배반하고 죽이려는 계획을 세웠고
  - 그에게 배신을 저지르고 죽이려는 계략을 꾸몄고
  lexicon: 속이다 / 계획을 세우다
  rationale: 게에즈 동사는 단순한 감정보다 속임수·기만의 행위를 가리키므로, 한국어도 ‘속이고’로 옮겨 실제 행위를 드러냈습니다. ‘죽이려는 계획’은 목적절을 직역해 긴장을 유지합니다.
- source_word: ወተመይጦሙ፡
  english_pob_choice: but changing their minds
  chosen_korean: 마음을 돌이켜
  alternatives_korean:
  - 뜻을 바꾸어
  - 마음을 바꾸어
  lexicon: 마음을 돌이키다
  rationale: 행동의 전환을 나타내는 표현이므로, 관용적이면서도 원문의 방향 전환을 살릴 수 있는 ‘마음을 돌이켜’를 택했습니다.
- source_word: ወአከበይዎ፡ ለኢጥፋራ፡ ... ሊቀ፡ ዐቀብት፡
  english_pob_choice: they sold him to Potiphar, an officer of Pharaoh, the chief of the guards
  chosen_korean: 파라오의 관리이며 경호대장의 우두머리인 포티파르에게 팔았습니다
  alternatives_korean:
  - 파라오의 관리이며 경호대장인 포티파르에게 팔았습니다
  - 파라오의 관리이며 경호 책임자인 포티파르에게 팔았습니다
  lexicon: 관리 / 경호대장의 우두머리
  rationale: 게에즈의 ሊቀ ዐቀብት는 ‘chief of the guards’에 해당하므로, POB의 검토 결론을 따라 ‘경호대장의 우두머리’로 반영했습니다. 기존 친숙한 ‘요리장’ 계열 표현은 본문 어휘와 맞지 않아 배제했습니다.
- source_word: ሣውዕ፡ ዘሀገረ፡ ኤሌው።
  english_pob_choice: priest of the city of Heliopolis
  chosen_korean: 헬리오폴리스의 제사장
  alternatives_korean:
  - 헬리오폴리스 성읍의 제사장
  - 헬리오폴리스 도시의 제사장
  lexicon: 제사장 / 헬리오폴리스
  rationale: 지명은 음역 형태를 유지하고, 직책은 본문의 종교적 직함에 맞게 ‘제사장’으로 옮겼습니다.
theological_decisions:
- issue: ‘그를 속이고’와 ‘죽이려는 계획’의 병렬이 원문이 전하는 윤리적 강도를 충분히 보존하는지
  chosen_reading: 행위의 기만성과 살해 의도의 이중 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘그를 배반하고’로 완화하는 읽기
  - ‘그를 해치려는 계획’을 쓰는 완화된 읽기
  rationale: 이 구절은 단순한 가족 갈등이 아니라 의도적 기만과 살해 계획을 함께 제시하므로, 둘 중 어느 하나도 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 본문 내 서사 윤리와 죄의 의도성 보존
