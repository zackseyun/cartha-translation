revisions:
- from: 저녁때에 사람들이 그것을 요셉에게 가져왔으므로 그가 밤새도록 슬퍼하며 그의 죽음으로 인해 심히 괴로워하며 이르되 야수가 요셉을 잡아먹었다 하였더라 그 날에 그 집의 모든 백성이 그와 함께 애통하여 그 날 종일 그와 함께 슬퍼하며 애통하였더라.
  to: 저녁에 그들이 그것을 그에게 가져왔기 때문에, 그는 밤새도록 슬퍼했습니다. 그는 그 죽음으로 말미암아 슬픔에 사무쳐 열병이 났으며, “야수가 요셉을 잡아먹었습니다”라고 말했습니다. 그날 그의 집안 모든 사람이 그와 함께 애통해했고, 그날 종일 그와 함께 슬퍼하며 애통해했습니다.
  rationale: 수령자를 야곱으로 바로잡되, 이 절에서 선행사가 명시되지 않은 ‘그것’은 특정하지 않았습니다. 요셉의 죽음을 사실로 단정하지 않고 야곱의 인식과 발화 안에서 표현했으며, 원문의 애도와 슬픔으로 인한 병듦을 보존했습니다.
