  source_fidelity: 원문의 ‘이 세 가지 애통이 이스라엘에게 한 달 안에 닥쳤다’와 빌하 및 디나의 매장 장소를 충실히 반영합니다. ‘그의 딸 디나’에서 ‘그’는 문맥상 이스라엘(야곱)을 가리키며, 이를 유지했습니다.
