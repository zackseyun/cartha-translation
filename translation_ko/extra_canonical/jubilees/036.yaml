base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/036.yaml
  text: '1[10]. And in the sixth year of this week, Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.

    2. And bury me near Abraham my father, in the double cave in the field of Ephron the Hittite, which Abraham acquired for a burial place there. In the tomb which I dug for myself there, bury me.

    3. And this I command you, my sons: do righteousness and uprightness upon the earth, so that the LORD may bring upon you all that the LORD said he would do for Abraham and for his seed.

    4. And be, my sons, loving one another, each loving his brother as a man loves his own life, and let each seek for his brother what is good for him; and act together on the earth[10], and let them love one another as themselves.

    5. And concerning the matter of idols, I command you and exhort you that you should despise them and reject them, and that you should not love them, because they are full of error for those who worship them and for those who bow down to them.

    6. Remember, my sons, the LORD, the God of Abraham your father; and I also have been devoted to him in righteousness and in joy, so that he may multiply you and make your seed numerous like the stars of heaven in multitude, and plant you in the earth as a plant of righteousness that will not be uprooted for all generations forever.

    7. And now I will make you swear by a great oath—for there is no oath greater than it—by the glorious and honored and great and splendid and marvelous and mighty name of him who made the heavens and the earth and all things together, that you will be those who fear him and those who worship him.

    8. And let each one love his brother with mercy and with righteousness, and let not a man desire evil against his brother from now and forever, all the days of your life, so that you may prosper in all your deeds and not be destroyed.

    9. But if there is one among you who devises evil against his brother, know from now on that everyone who devises evil against his brother will fall into his hand, and he will be cut off from the land of the living, and his seed will be blotted out from under heaven.

    10. And on the day of turmoil and cursing and wrath and anger, and with blazing, devouring fire, just as he burned Sodom, so he will burn his land and his city and everything that is his; and he will be erased from the book of the discipline of the children of men, and he will not ascend into the book of life, but into that which is appointed for destruction, and he will pass into the eternal curse, so that for all days they may denounce him in cursing and in execration and in wrath and in torment and in anger and in plagues and in everlasting disease.

    11. I declare and testify to you, my sons, according to the judgment that will come upon the man who wishes to do harm against his brother.”

    12. And he divided all that he had between them on that day, and he gave the larger share to the one who was born first, and the tower and all that was around it, and all that Abraham had acquired at the Well of the Oath.

    13. And he said, “I give this larger share to the one who was born first.”

    14. And Esau said, “I sold it to Jacob, and I gave my birthright to Jacob; let it be given to him, and I have nothing to say about it, for it belongs to him.”

    15. And Isaac said, “May a blessing rest upon you, my sons, and upon your seed this day, because you have given me rest.

    16. And my heart has been gladdened concerning the birthright, that no violence was done because of it. May the LORD Most High bless

    17. the man who does righteousness, him and his seed forever.” And he finished commanding them and blessing them, and they ate and drank together before him and rejoiced,

    18. because there was harmony among them. And they went out from him and rested that day and slept. And Isaac slept on his bed that day rejoicing, and he slept the eternal sleep and died. He completed one hundred and eighty years, that is, twenty-five weeks and five years. And his two sons, Esau and Jacob, buried him.

    19. And Esau went to the land of Edom, to Mount Seir, and lived there.

    20. But Jacob dwelt on Mount Hebron, in the tower of the sojourning of Abraham his father, and he worshiped the LORD with all his heart and according to the commands as they were manifest,

    21. according to the way he knew from the days of his birth. And Leah his wife died in the fourth year of the second week of the forty-fifth jubilee, and he buried her in the double cave near Rebekah his mother,

    22. to the left of the grave of Sarah, his father’s mother. And all her sons and his sons came to mourn Leah his wife with him and to comfort him for her, because he was grieving for her.

    23. For he loved her exceedingly after Rachel her sister had died, because she was perfect and upright in all her ways and honored Jacob; and in all the days of her life with him he had not heard from her mouth a harsh word, because she was gentle and peaceable and upright and honorable.

    24. And he remembered all her deeds that she had done in her life, and he mourned for her greatly[21][18][12], because he loved her with all his heart and with all his soul.'
  footnotes:
  - marker: '10'
    text: The clause 'he will be erased from the book of the discipline of the children of men' is textually difficult. The Ge'ez appears to distinguish this record from 'the book of life'; the exact nuance of the first book is uncertain.
    reason: textual_variant
  - marker: '10'
    text: The final sequence piles up near-synonymous curse terms. The translation preserves the accumulation rather than compressing it, because the rhetoric is part of the warning.
    reason: segmentation_note
  - marker: '12'
    text: '''The tower'' may refer to a specific estate feature included in Isaac''s holdings. The surrounding inheritance list is terse and may reflect a difficult underlying text.'
    reason: cultural_note
  - marker: '18'
    text: The age notice literally combines 180 years with the calendrical summary 'twenty-five weeks and five years,' i.e., 25 weeks of years (175) plus 5 years.
    reason: cross_reference
  - marker: '21'
    text: '''The double cave'' corresponds to the ancestral burial cave known from Genesis tradition as Machpelah.'
    reason: cross_reference
translation:
  language: ko
  text: '1[10]. 그리고 이번 주의 여섯째 해에 이삭이 그의 두 아들 에서와 야곱을 부르니, 그들이 그에게로 왔습니다. 그리고 그는 그들에게 말했다. “내 아들들아, 나는 내 조상의 길을 가며 내 조상들이 계신 영원한 집으로 가노라.

    2. 그리고 나를 내 아버지 아브라함 근처, 헷 족속 에브론의 밭에 있는 막다른 굴에 장사하십시오. 이 굴은 아브라함이 그곳에서 매장지로 구입한 것입니다. 내가 직접 파 놓은 무덤에 나를 묻어 주십시오.

    3. 내 아들들아 내가 너희에게 이것을 명하노니 땅에서 공의와 공의를 행하라. 그러면 주님께서 아브라함과 그 자손에게 행하시리라 말씀하신 모든 일을 너희에게 이루시리라.

    4. 그리고 내 아들들아, 서로 사랑하고, 각각 자기 생명을 사랑하는 것처럼 자기 형제를 사랑하여, 자기에게 좋은 것이 무엇인지 자기 형제를 구하십시오. 땅에서 함께 행동하고[10] 그들이 서로를 자신처럼 사랑하게 하십시오.

    5. 우상에 관하여는 내가 너희에게 명령하고 권하노니 그것들을 업신여기고 버리며 사랑하지도 말라 그것들은 숭배하는 자들과 그들에게 절하는 자들에게 거짓이 가득함이라.

    6. 내 아들들아, 너희 조상 아브라함의 하나님 주님를 기억하라. 나도 의와 기쁨으로 그에게 헌신하노니 이는 그가 너희를 번성케 하시고 너희 자손을 하늘의 별과 같이 많게 하시고 너를 땅에 심으사 대대에 영원히 뽑히지 아니하는 의의 나무가 되게 하려 하심이니라

    7. 이제 내가 너로 천지와 만물을 지으신 이의 영화롭고 존귀하며 크고 위대하고 놀랍고 위대하고 능한 이름을 두고 큰 맹세로 너로 맹세하게 하리니 이보다 더 큰 맹세가 없느니라.

    8. 그리고 각각 자비와 정의로 자기 형제를 사랑하십시오. 그리고 지금부터 영원까지, 네 평생에 자기 형제에게 악을 원하지 마십시오. 그러면 네 모든 일이 형통하고 멸망되지 않을 것입니다.

    9. 그러나 너희 중에 자기 형제를 해하려고 악을 꾀하는 자가 있거든 이제부터 알지니 무릇 자기 형제를 해하려고 악을 꾀하는 자는 다 그의 손에 빠지고 그는 산 자의 땅에서 끊어지며 그의 자손은 천하에서 끊어지리라

    10. 그리고 혼란과 저주와 진노와 분노의 날에, 그가 소돔을 불태웠던 것처럼 맹렬하고 삼키는 불로 그의 땅과 그의 성읍과 그의 모든 소유를 불사르고 그러면 그는 사람의 자녀들의 징계의 책에서 지워질 것입니다. 그리고 그는 생명의 책에 올라가지 않고, 멸망하기로 정한 책에 들어가게 될 것입니다. 그는 영원한 저주에 들어가게 될 것입니다. 그리하여 사람들은 저주와 저주와 진노와 고통과 분냄과 재앙과 영원한 질병으로 종일 그를 비난하게 될 것입니다.

    11. 내 아들들아, 내가 자기 형제를 해하려고 하는 사람에게 임할 심판에 따라 너희에게 말하고 증거하노라.”

    12. 그 날에 그는 자기가 가진 모든 것을 그들 사이에 나누어 더 많은 몫을 먼저 태어난 사람에게 주었고, 탑과 그 주변의 모든 것과 아브라함이 맹세의 우물에서 얻은 모든 것을 주었다.

    13. 그리고 예수님께서 말씀하셨다. “내가 먼저 태어난 사람에게 더 많은 몫을 주겠다.”

    14. 에서가 이르되 내가 그것을 야곱에게 팔아 내 장자의 명분을 야곱에게 주었으니 그에게 주어라 그것이 그에게 있으므로 내가 할 말이 없노라 하고

    15. 이삭이 말하였다. “내 아들들아, 너희가 나에게 안식을 주었으니 오늘 너희와 너희 자손에게 복이 있기를 원하노라.

    16. 장자의 명분을 인하여 폭력이 행하지 아니하였으므로 내 마음이 기쁘도다 지극히 높으신 주님께서 복을 주시기를 원하노라

    17. 공의를 행하는 사람은 그와 그의 자손이 영원히 있으리라 하시니라 이에 명하시고 축복하시기를 마치시매 그들이 그 앞에서 함께 먹고 마시며 즐거워하니라

    18. 그들 사이에 화합이 있었기 때문입니다. 그리고 그들은 그에게서 나가서 그 날 쉬고 잤다. 그리고 이삭은 그 날 침대에서 기뻐하며 잠을 자다가 영원한 잠에 빠져 죽었습니다. 그는 180년, 즉 25주 5년을 채웠습니다. 그리고 그의 두 아들 에서와 야곱이 그를 장사했습니다.

    19. 에서는 에돔 땅 세일 산으로 가서 거기 살았습니다.

    20. 야곱은 헤브론 산에 거하며 그의 아버지 아브라함이 우거하는 망대에 살면서 온 마음으로 주님께 경배하고 나타난 계명을 따라 행하였으며

    21. 그가 태어났을 때부터 알고 있던 도를 따라 행하였느니라. 그 아내 레아가 마흔다섯째 희년 둘째 주 넷째 해에 죽어 그의 어머니 리브가 곁에 있는 굴에 그를 장사하였더라

    22. 그의 아버지의 어머니 사라의 무덤 왼쪽에 있다. 그 여자의 모든 아들들과 그의 아들들이 와서 그 아내 레아를 위하여 슬퍼하며 그와 함께 슬퍼하고 그를 위로하려 하였더라.

    23. 그의 동생 라헬이 죽은 후에도 그가 그를 심히 사랑하였으니 이는 그가 모든 일에 완전하고 정직하여 야곱을 존경하였음이라. 그 여자가 그와 함께 사는 모든 날 동안에 그는 그 입에서 거친 말을 듣지도 못하였으니 이는 그 여자가 온유하고 화평하며 정직하고 존귀함 때문이었더라.

    24. 그리고 그는 그녀가 평생에 행한 모든 일을 기억하고 그녀를 위해 크게 슬퍼했습니다. FN2__[18][12] 마음을 다하고 영혼을 다해 그녀를 사랑했기 때문입니다.'
