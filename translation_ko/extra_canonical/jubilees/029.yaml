base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/029.yaml
  text: '1[5]. And it came to pass, after Rachel had borne Joseph, that Laban went to shear his sheep, for he was three days'' journey away from him.

    2. And Jacob saw that Laban had gone to shear his sheep, and Jacob called Leah and Rachel and spoke to their hearts, that they should come with him to the land of Canaan.

    3. For he told them everything that he had seen in the dream, and everything that had been spoken to him, that he should go into his father''s house; and he had said to him, “Go in every place, and I will be with you.”

    4. And Jacob blessed the God of Isaac his father, and the God of Abraham[9], the father of his father; and he arose and took his wives and his children and all his possessions, and he crossed the River and arrived at

    5. the land of Gilead. And Jacob concealed his intention from Laban and did not tell him. And in the seventh year of the fourth week, Jacob turned toward Gilead in the first month, on the twenty-first; and Laban heard and pursued after him, and he overtook Jacob on the mountain of Gilead in the third month, on the thirteenth.

    6. And the Lord did not allow him to devise harm against Jacob, for he appeared to him in a dream

    7. by night and told Laban concerning Jacob. And on the fifteenth of those days Jacob made a feast for Laban and for all who had come with him, and Jacob swore to Laban on that day, and Laban also to Jacob, that neither would cross over to the other with evil intent, on the mountain of

    8. Gilead. And he made there a feast for a witness; therefore the name of that place was called

    9. “The Feast of Witness,” according to this feast. But formerly they used to call the land of Gilead the land of the Rephaim, for it is the land of the Rephaim, and the Rephaim were born there—giants whose height was ten cubits, and nine cubits, and eight cubits, and down to seven cubits was their stature.

    10. And their dwelling was from the land of the sons of Ammon as far as Mount Hermon, and the seats of

    11. their kingdom were Karnaim and Ashtaroth and Edrei and Misur and Beon. And the Lord destroyed them because of the evil of their deeds, for they were very lawless, and he caused the Amorites to dwell in their place—an evil and sinful people—and there is no people today that has completed the full measure of their sins, and they no longer have

    12. life upon the earth. And Jacob sent away Laban, and he went into Mesopotamia, the land of the east; and Jacob returned to the land of Gilead. And he crossed the Jabbok in the ninth month, on the eleventh; and on that day Esau his brother came to him, and he was reconciled with him,

    13. and he went away from him to the land of Seir, but Jacob dwelt in booths. And in the first year of the fifth week in this jubilee he crossed the Jordan and dwelt beyond the Jordan, and he pastured his sheep from the Sea of Heaps as far as Beth-shan, and as far as Dothan, and as far as

    14. the forest of Akrabboth. And he sent to Isaac his father from all his possessions clothing and food and drink and milk and butter and cheese,

    15. and some dates of the valley. And to his mother Rebekah also, four times in the year, between the times of the months, and between plowing and harvest, and between

    16. autumn and rain, and between winter and summer, to the cave of Abraham.

    17. For Isaac had returned from the Well of the Oath and had gone up to the cave of his father Abraham.

    18. And he dwelt there apart from Esau his son. For in the days when Jacob went to Mesopotamia, Esau took for himself Mahalath, the daughter of Ishmael, as a wife, and he gathered together all his father''s flocks and his wives, and he went up and dwelt on Mount Seir, and he left Isaac his father at

    19. the Well of the Oath alone. And Isaac went up from the Well of the Oath and dwelt in the cave of

    20. Abraham his father, on the mountain of Hebron. And there Jacob kept sending everything that he would send to his father and to his mother, from time to time, all that they needed[16][14][12][11]; and they blessed Jacob with all their heart and with all their soul.'
  footnotes:
  - marker: '5'
    text: The chronology in this verse is difficult because the pursuit and overtaking are linked across months. The translation preserves the stated dates rather than harmonizing them.
    reason: segmentation_note
  - marker: '9'
    text: The place-name explanation combines 'Gilead' with a memorial feast/witness etymology and then adds an older designation connected with the Rephaim. The chapter intentionally layers these traditions.
    reason: cross_reference
  - marker: '11'
    text: Several place-names in the Rephaim territory list are difficult in Ethiopic transmission; the English transliterations are conservative.
    reason: textual_variant
  - marker: '12'
    text: The clause 'they no longer have life upon the earth' may also be understood as 'there was no remnant of life left for them on the earth.'
    reason: alternative_reading
  - marker: '14'
    text: '''Sea of Heaps'' is an uncertain toponym in the Ethiopic. A different underlying place-name may stand behind it.'
    reason: lexical_alternative
  - marker: '16'
    text: The gift list includes dairy products and a difficult final produce term. 'Dates of the valley' is a cautious rendering of an uncertain phrase.
    reason: lexical_alternative
translation:
  language: ko
  text: '1[5]. 라헬이 요셉을 낳은 후에 라반이 자기 양털을 깎으러 갔으니 그에게서 사흘 길이 있었음이라.

    2. 야곱은 라반이 자기 양털을 깎으러 간 것을 보고 레아와 라헬을 불러서 그와 함께 가나안 땅으로 가자고 그들의 마음에 말하였더라.

    3. 요셉이 꿈에서 본 모든 것과 자기에게 말한 모든 것을 그들에게 말하여 자기 아버지 집으로 돌아가리라 하였음이더라 그리고 그분은 그에게 “어디로 가든지 내가 너와 함께 있으리라”고 말씀하셨습니다.

    4. 야곱은 자기 아버지 이삭의 하나님과 자기 아버지 아브라함의 하나님을 찬양했습니다. 그가 일어나서 아내들과 자녀들과 모든 소유물을 데리고 강을 건너 거기에 이르니라

    5. 길르앗 땅. 그리고 야곱은 라반에게 자신의 뜻을 숨기고 그에게 알리지 않았습니다. 그리고 넷째 주 일곱째 해, 첫째 달 이십일월에 야곱이 길르앗으로 향했습니다. 라반이 듣고 그를 쫓아가서 셋째 달 곧 길르앗 산에서 야곱을 따라잡으니라.

    6. 주님께서 그가 야곱을 해하려는 꾀를 허락하지 아니하셨으니 이는 그가 꿈에 그에게 나타나셨음이니라

    7. 밤에 라반에게 야곱의 일을 알렸다. 그 날 열다섯째 날에 야곱이 라반과 그와 함께 온 모든 사람을 위하여 잔치를 베푸니라 그 날에 야곱이 라반에게 맹세하고 라반도 야곱에게 맹세하기를 악한 의도로 저 사람에게 산에서 건너가지 아니하리라 하였더라

    8. 길르앗. 그리고 그는 그곳에서 증인을 위해 잔치를 베풀었습니다. 그러므로 그 곳의 이름을 칭하였더라

    9. 이 축일에 따르면 “증인의 축일”. 본래 길르앗 땅은 르바임 땅이라 일컬었으니 그 곳은 르바임의 땅임이더라 르바임이 거기서 났음이라 그들의 키는 십 규빗, 구 규빗, 여덟 규빗이요 키는 일곱 규빗이었더라.

    10. 그들의 거주지는 암몬 자손의 땅에서부터 헤르몬 산까지와

    11. 그들의 나라는 카르나임과 아스다롯과 에드레이와 미수르와 브온이었더라 주님께서 그들의 행위가 악하므로 그들을 멸하셨으니 이는 그들의 불법이 심함이라 주님께서 아모리 족속을 그 땅에 거하게 하셨으니 곧 악하고 죄악이 있는 백성이라 오늘날 그 죄를 온전히 한 자가 없고 다시는 없느니라

    12. 지상에서의 생명. 야곱이 라반을 보내니 그가 동방 땅 메소포타미아로 가니라. 야곱은 길르앗 땅으로 돌아갔습니다. 그는 아홉째 달 열한째 날에 얍복강을 건넜다. 그 날에 그의 형 에서가 그에게 와서 그와 화해하고

    13. 야곱이 그를 떠나 세일 땅으로 갔으나 야곱은 초막에 거주하였더라. 이 희년 다섯째 주의 첫째 해에 그가 요단강을 건너 요단 저편에 거주하며 무더기 바다에서 그 양 떼를 치되 벧산과 도단과 에덴까지 이르고

    14. Akrabboth 숲. 그가 그의 모든 소유 중에서 그의 아버지 이삭에게 의복과 먹을 것과 마실 것과 젖과 버터와 치즈를 보냈으니

    15. 그리고 계곡의 일부 날짜. 그리고 그의 어머니 리브가에게도 일 년에 네 번씩, 월중 때와 밭갈 때와 추수 때와 사이에

    16. 가을과 비, 겨울과 여름 사이, 아브라함의 굴로.

    17. 이삭은 맹세의 우물에서 돌아와 그의 아버지 아브라함의 굴로 올라갔었습니다.

    18. 그리고 그는 그의 아들 에서와 별도로 거기에 살았습니다. 야곱이 메소포타미아로 갈 때에 에서가 이스마엘의 딸 마할랏을 아내로 맞이하고 그의 아버지의 모든 양 떼와 아내들을 모아 세일 산에 올라가서 거주하며 그의 아버지 이삭을

    19. 맹세의 우물만. 이삭이 맹세의 우물에서 올라가서 그 굴에 거하였더니

    20. 헤브론 산에 있던 그의 아버지 아브라함. 그리고 그곳에서 야곱은 자신이 보낼 모든 것을 그의 아버지와 어머니에게 때때로 그들이 필요로 하는 모든 것을 계속 보냈습니다.[16][14][12][11]; 그리고 그들은 마음을 다하고 뜻을 다하여 야곱을 축복했습니다.'
