  text: And your seed will be like the dust of the earth, and you will spread out to the sea and to the east and to the north and to the south. And in you and in your seed all the lands of the nations will be blessed.
  footnotes:
  - marker: a
    text: Or 'families of the nations'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 당신의 씨는 땅의 티끌과 같아질 것이며, 당신은 바다와 동쪽과 북쪽과 남쪽으로 퍼질 것입니다. 그리고 당신과 당신의 씨 안에서 모든 민족의 땅들이 복을 받을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርከ / seed
  english_pob_choice: your seed
  chosen_korean: 당신의 씨
  alternatives_korean:
  - 당신의 후손
  - 당신의 자손
  lexicon: seed
  rationale: 족보적 ‘후손’ 의미를 담되, 아브라함 언약 문맥의 단수-집합성을 살리기 위해 ‘씨’를 기본으로 유지했습니다.
- source_word: ኖላ / spread out
  english_pob_choice: spread out
  chosen_korean: 퍼질 것입니다
  alternatives_korean:
  - 널리 퍼질 것입니다
  - 번성할 것입니다
  lexicon: spread out
  rationale: 지리적 확장과 흩어짐의 이미지를 살리면서도 한국어에서 자연스럽게 읽히는 동사를 택했습니다.
- source_word: ባሕር / sea
  english_pob_choice: to the sea
  chosen_korean: 바다
  alternatives_korean:
  - 서쪽
  - 서해
  lexicon: sea
  rationale: 개정된 영어 POB가 ‘west’가 아니라 원문 그대로 ‘sea’로 바로잡은 점을 반영하여, 방향 관용구를 직역에 가깝게 옮겼습니다.
- source_word: በሐውርተ አሕዛብ
  english_pob_choice: lands of the nations
  chosen_korean: 모든 민족의 땅들
  alternatives_korean:
  - 민족들의 가족들
  - 민족들의 땅
  lexicon: land/countries
  rationale: 게에즈어가 ‘가족들’이 아니라 ‘땅들/나라들’의 뜻이라는 주석에 따라, 민족이 차지한 땅이라는 의미를 살려 옮겼습니다.
theological_decisions:
- issue: 아브라함 언약의 보편적 축복 범위
  chosen_reading: ‘당신과 당신의 씨 안에서’ 모든 민족의 땅들이 복을 받는다는, 개인과 후손을 매개로 한 열방 축복의 약속으로 유지했습니다.
  alternative_readings:
  - 후손 중심의 단순 번영 약속
  - 민족 전체에 대한 일반적 호의
  rationale: 원문은 축복의 근거를 아브라함과 그의 씨에 두면서도 그 결과를 열방의 땅들까지 확장하므로, 이 긴장을 약화시키지 않았습니다.
  doctrine_reference: 아브라함 언약, 열방 축복
