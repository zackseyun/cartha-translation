translation:
  language: ko
  text: 야곱이 말했습니다. “저는 두렵지 않습니다. 그가 저를 죽이고자 한다면, 저는 그를 죽일 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤ፡ ያዕቆብ፡
  english_pob_choice: And Jacob said
  chosen_korean: 야곱이 말했습니다
  alternatives_korean:
  - 그리고 야곱이 말했습니다
  - 야곱이 말했습니다
  lexicon: 고유명사
  rationale: 서술 도입의 단순한 'said'는 한국어 자연문맥에 맞게 평서형으로 옮기되, 원문의 화자 표지를 유지했습니다.
- source_word: እይፈርህ
  english_pob_choice: I am not afraid
  chosen_korean: 저는 두렵지 않습니다
  alternatives_korean:
  - 나는 두렵지 않습니다
  - 저는 무섭지 않습니다
  lexicon: 형용사/감정 표현
  rationale: 원문의 부정은 단순한 감정 상태의 부정이므로 '두렵지 않다'가 가장 직접적이며, 합쇼체 화자 표지로 '저는'을 사용했습니다.
- source_word: እመ፡ ፈቀደ፡ ይቅትለኒ፡ እቅትሎ።
  english_pob_choice: If he wants to kill me, I will kill him
  chosen_korean: 그가 저를 죽이려 한다면, 저는 그를 죽일 것입니다
  alternatives_korean:
  - 그가 저를 죽이고자 한다면, 저는 그를 죽일 것입니다
  - 그가 저를 죽이려 하면, 저도 그를 죽일 것입니다
  lexicon: 동사구/조건문
  rationale: 원문의 조건문과 상호보복의 대칭을 유지하면서, '원한다'보다 목적을 드러내는 '죽이려 하다'가 Geez의 의도 표현을 더 정확히 반영합니다.
theological_decisions:
- issue: 자기방어/보복 발언의 직접성
  chosen_reading: 발언의 공격적 대칭을 완화하지 않고 그대로 옮겼습니다.
  alternative_readings:
  - '''그가 나를 죽이려 하면 나도 그를 죽이겠다''로 완화'
  - '''그가 나를 해치려 한다면''으로 일반화'
  rationale: 본문은 단순한 방어 의지보다 상호 살해의 극단적 대칭을 드러내므로, 그 긴장을 약화하지 않는 번역이 필요합니다.
  doctrine_reference: 서사 본문에서의 서술 충실성
