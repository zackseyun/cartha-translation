  text: And Jacob awoke from his sleep and said, “Surely this place is the house of the Lord, and I did not know it.” And he was afraid and said, “How awesome this place is! This is none other than the house of the Lord, and this is the gate of heaven.”
translation:
  language: ko
  text: 야곱은 잠에서 깨어나 말했습니다. 「분명히 이곳은 주님의 집인데, 내가 알지 못했습니다.」 그는 두려워하며 말했습니다. 「이곳이 얼마나 두려운 곳인지! 이는 주님의 집이 아니고는 다른 곳이 아니며, 이는 하늘의 문입니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤቱ ለእግዚአብሔር
  english_pob_choice: the house of the Lord
  chosen_korean: 주님의 집
  alternatives_korean:
  - 야훼의 집
  - 주의 집
  lexicon: house of the Lord
  rationale: 지시어 '이곳'과 결합된 소유 표현을 자연스럽게 살리되, 본문의 신적 호칭을 '주님'으로 옮겨 POB의 기본 용례를 따랐습니다.
- source_word: ዝመካን / ግሩም
  english_pob_choice: this place is… / How awesome this place is!
  chosen_korean: 이곳은… / 이곳이 얼마나 두려운 곳인지!
  alternatives_korean:
  - 이곳은… / 이곳이 얼마나 놀라운 곳인지!
  - 이곳은… / 참으로 경외로운 곳입니다!
  lexicon: awesome / fearful
  rationale: 첫 절의 판정문과 두 번째 절의 감탄을 구분해, 'awesome'의 경외감·두려움이 함께 있는 뉘앙스를 '두려운 곳'으로 보존했습니다.
- source_word: ዘአኮ ምንትኒ ዘእንበለ
  english_pob_choice: none other than
  chosen_korean: …아니고는 다른 곳이 아니며
  alternatives_korean:
  - …외에는 다른 곳이 아니며
  - …말고는 다른 곳이 아니며
  lexicon: none other than
  rationale: 부정-배제 구조를 직역적으로 살리면서도 한국어에서 자연스럽게 들리도록 '아니고는 다른 곳이 아니며'로 옮겼습니다.
- source_word: ወዛቲ አንቀጸ ሰማይ
  english_pob_choice: the gate of heaven
  chosen_korean: 하늘의 문
  alternatives_korean:
  - 하늘의 문
  - 하늘 문
  lexicon: gate of heaven
  rationale: 게이트의 관문 이미지를 표준적인 현대 한국어로 옮겨 '하늘의 문'을 택했습니다.
theological_decisions:
- issue: 여호와/야훼 표기
  chosen_reading: 본문의 እግዚአብሔር은 한국어 본문에서 '주님'으로 옮겼습니다.
  alternative_readings:
  - 야훼
  - 주
  rationale: 이 구절은 창 28:17의 전승을 반영하지만, 본문 단독에서는 POB 기본 용례에 따라 경건한 호칭 '주님'을 사용하고, 야훼 표기는 본문에 직접 삽입하지 않았습니다.
  doctrine_reference: POB divine-name convention
