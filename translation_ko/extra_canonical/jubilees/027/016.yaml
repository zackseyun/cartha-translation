  text: And after Jacob had arisen to go to Mesopotamia, the spirit of Rebekah was grieved over her son, and she wept.
translation:
  language: ko
  text: 야곱이 메소포타미아로 가려고 일어난 뒤에, 리브가의 영은 자기 아들 때문에 근심하였고, 그녀는 울었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '“ἔστη / ἀνίστημι” (in context: Jacob rising to depart)'
  english_pob_choice: had arisen
  chosen_korean: 일어난 뒤에
  alternatives_korean:
  - 일어난 후에
  - 떠나려 일어난 뒤에
  lexicon: 기본 동사 의미
  rationale: 출발을 위한 기상을 자연스럽게 살리되, 단순한 시간 순서를 분명히 하기 위해 ‘일어난 뒤에’로 옮겼습니다.
- source_word: መስጶጦሚያ
  english_pob_choice: Mesopotamia
  chosen_korean: 메소포타미아
  alternatives_korean:
  - 메소포타미아 지역
  lexicon: 고유명사 표기
  rationale: 지명은 현대 외래어 표기를 따르는 것이 가장 자연스럽고, 본문의 지역명을 그대로 보존합니다.
- source_word: መንፈሰ፡ ርብቃ
  english_pob_choice: the spirit of Rebekah
  chosen_korean: 리브가의 영
  alternatives_korean:
  - 리브가의 마음
  - 리브가의 속마음
  lexicon: መንፈስ
  rationale: 문자적으로는 ‘영’이 맞으며, 본문이 리브가의 내적 존재/정서를 가리키는 것으로 보이므로 ‘마음’으로 완화하지 않았습니다.
- source_word: ድኅረ፡ ወልዳ፡
  english_pob_choice: over her son
  chosen_korean: 자기 아들 때문에
  alternatives_korean:
  - 아들로 인해
  - 아들을 두고
  lexicon: 관계·원인 표현
  rationale: 영문 수정본이 뜻한 애도/슬픔의 방향을 따라, ‘after her son’처럼 시간 순서로 오해되지 않도록 원인적 슬픔을 한국어로 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 리브가의 ‘영’(spirit)을 심리적 표현으로 완화할지 여부
  chosen_reading: 내적 실재를 가리키는 표현으로 유지하여 ‘영’이라고 번역했습니다.
  alternative_readings:
  - 마음
  - 속마음
  - 마음이 상하였다
  rationale: 본문은 단순한 감정 묘사보다 인물의 내적 상태를 직접 말하므로, 창조적으로 심리화하기보다 원문 표현의 긴장을 유지하는 것이 적절합니다.
  doctrine_reference: 인간의 내면을 가리키는 성경적 ‘영’ 용례 보존
