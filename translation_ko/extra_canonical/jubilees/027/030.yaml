  text: And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,
translation:
  language: ko
  text: 야곱은 주님께 기도하며 말했습니다. “주님께서 저와 함께하시고, 제가 가는 이 길에서 저를 지켜 주시며, 먹을 빵과 입을 옷을 주신다면,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸለየ ... ጸሎተ
  english_pob_choice: prayed a prayer
  chosen_korean: 기도하며 말했습니다
  alternatives_korean:
  - 간절히 기도하며 말했습니다
  - 기도를 드리며 말했습니다
  lexicon: prayer/verb repetition
  rationale: 게에즈 원문은 ‘기도하다’와 ‘기도’를 겹쳐 말해 행위의 강도를 보이므로, 한국어에서는 자연스럽게 ‘기도하며’로 그 반복 효과를 살렸습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: divine title
  rationale: 영어 POB의 ‘the Lord’를 한국어에서 직접적인 신뢰와 호칭의 뉘앙스를 살려 ‘주님’으로 옮겼습니다.
- source_word: ምስሌየ
  english_pob_choice: with me
  chosen_korean: 저와 함께하시고
  alternatives_korean:
  - 제 곁에 계시고
  - 저와 함께 계시고
  lexicon: presence formula
  rationale: 하나님이 단순히 동반한다는 뜻을 넘어 언약적 동행을 나타내므로, 합쇼체 화법에 맞게 ‘함께하시고’로 옮겼습니다.
- source_word: ወዐቀበኒ ... ይወል
  english_pob_choice: keeps me on this road ... gives me bread ... and clothing
  chosen_korean: 제가 가는 이 길에서 저를 지켜 주시며, 먹을 빵과 입을 옷을 주신다면
  alternatives_korean:
  - 제가 가는 이 길을 지켜 주시며, 먹을 양식과 입을 옷을 주신다면
  - 이 길에서 저를 보호하시고 빵과 옷을 주신다면
  lexicon: provision and protection
  rationale: 보호와 공급의 연쇄를 분명히 드러내기 위해 ‘지켜 주시며’와 ‘먹을 빵’, ‘입을 옷’으로 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: 야훼가 아닌 ‘주님’ 표기
  chosen_reading: 본문의 직접 화법에서는 존칭 호칭인 ‘주님’을 사용했습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 구절의 원문은 기도 중 직접 호칭이므로, 서술 본문에서의 신명 표기 규칙보다 예배적 발화의 자연스러움을 우선해 ‘주님’으로 번역했습니다.
  doctrine_reference: 경배/기도 화법에서의 직접 호칭 관례
