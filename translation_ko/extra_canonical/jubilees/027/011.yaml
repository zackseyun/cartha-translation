  text: And Isaac called Jacob and blessed him and charged him and said to him, “Do not take a wife for yourself from any of the daughters of Canaan.
translation:
  language: ko
  text: 이삭이 야곱을 불러 그에게 복을 주고 그에게 명령하며 말하였습니다. 「네가 가나안의 딸들 가운데서 아내를 맞이하지 마라.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዐ / called
  english_pob_choice: called Jacob
  chosen_korean: 야곱을 불러
  alternatives_korean:
  - 야곱을 부르고
  - 야곱을 소집하고
  lexicon: 호출하다/부르다
  rationale: 서사 문맥에서 단순한 부름을 자연스럽게 살리되, 이어지는 축복과 명령의 장면으로 연결되도록 ‘불러’로 옮겼습니다.
- source_word: ወባረኮ / blessed him
  english_pob_choice: blessed him
  chosen_korean: 그에게 복을 주고
  alternatives_korean:
  - 그를 축복하고
  - 그에게 축복하며
  lexicon: 복을 주다
  rationale: 예언적·가문적 맥락에서 ‘복을 주다’가 직역성과 의미 전달을 함께 유지합니다.
- source_word: ወ'ነሠጾ / charged him
  english_pob_choice: charged him
  chosen_korean: 그에게 명령하며
  alternatives_korean:
  - 그에게 엄히 명하며
  - 그에게 지시하며
  lexicon: 명령하다
  rationale: 영어 POB의 charged는 단순한 권고보다 강한 위임·훈계를 포함하므로 ‘명령하며’가 가장 직접적입니다.
- source_word: ኢትነሣእ ለከ ብእሲተ ... አዋልደ ከናአን
  english_pob_choice: Do not take a wife for yourself from any of the daughters of Canaan.
  chosen_korean: 네가 가나안의 딸들 가운데서 아내를 맞이하지 마라
  alternatives_korean:
  - 가나안의 딸들 가운데서 아내를 취하지 마라
  - 가나안의 딸들 중 아무에게서도 아내를 얻지 마라
  lexicon: 아내를 맞이하다
  rationale: 게에즈 원문의 ‘여자를 취하다’에 해당하는 결혼 표현을 현대 한국어로 자연스럽게 풀되, 금지의 범위를 ‘가나안의 딸들 가운데서’로 유지했습니다.
theological_decisions:
- issue: 가나안 혼인 금지 명령의 표현 방식
  chosen_reading: 직접적 금지 명령으로 옮기고, 결혼 결정을 지시하는 문맥을 유지했습니다.
  alternative_readings:
  - 권고형으로 완화해 번역
  - 문화적 배경 설명을 본문에 덧붙임
  rationale: 본문은 단순한 조언이 아니라 이삭의 권위 있는 지시를 전달하므로, 명령형을 분명하게 드러내는 것이 원문 의미에 충실합니다.
  doctrine_reference: 가문/언약 계승 문맥에서의 결혼 금지 명령
- issue: 따옴표 안 직접화법의 존대 수준
  chosen_reading: 아버지 이삭의 권위 있는 발화로서 3인칭 서술은 합쇼체를 유지하고, 직접 명령은 평서형 금지문으로 처리했습니다.
  alternative_readings:
  - 직접화법을 더 높임말로 조정
  - 모든 문장을 동일한 존대체로 통일
  rationale: 한국어 성경 문체에서는 인용문 내부의 금지 명령을 자연스럽고 또렷하게 전달하는 것이 우선이며, 인물 관계를 과도하게 평준화하지 않도록 했습니다.
  doctrine_reference: 서사적 직접화법의 화용적 재현
