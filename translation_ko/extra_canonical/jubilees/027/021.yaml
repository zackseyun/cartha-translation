  text: And Isaac comforted Rebekah concerning Jacob her son, and he blessed him.
translation:
  language: ko
  text: 이삭은 아들 야곱 때문에 리브가를 위로하고, 그를 축복했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይናዘዛ
  english_pob_choice: comforted
  chosen_korean: 위로하고
  alternatives_korean:
  - 위안을 주고
  - 달래고
  lexicon: 위로하다
  rationale: 아들의 일로 근심하는 리브가를 이삭이 진정시키는 의미를 자연스럽게 살리되, 단순 감정적 달램보다 상담적·정서적 위안을 담을 수 있어 선택했습니다.
- source_word: ለርብቃ፡ ... በእንተ፡ ያዕቆብ፡ ወልዳ፡
  english_pob_choice: Rebekah concerning Jacob her son
  chosen_korean: 리브가를 ... 아들 야곱 때문에
  alternatives_korean:
  - 리브가를 ... 야곱, 그의 아들을 두고
  - 리브가에게 ... 아들 야곱에 관하여
  lexicon: 전치사구 처리
  rationale: 원문의 관계는 ‘야곱, 그녀의 아들’에 대한 사정으로 리브가가 마음에 부담을 가진 상황을 가리키므로, 한국어에서는 원인·사유를 드러내는 ‘때문에’로 옮겨 문장 흐름을 살렸습니다.
- source_word: ወባረኮ
  english_pob_choice: he blessed him
  chosen_korean: 그를 축복했습니다
  alternatives_korean:
  - 그에게 복을 빌어 주었습니다
  - 그에게 복을 주었습니다
  lexicon: 축복하다
  rationale: 족장 서사에서 말하는 ‘복을 빌어 주는’ 행위를 분명히 하기 위해 ‘축복했습니다’로 옮겼습니다. 대명사 ‘그를’은 앞선 문맥의 야곱을 가리키도록 유지했습니다.
theological_decisions:
- issue: 축복의 주체와 대상이 긴박하게 이어지는 족장 서술의 문체
  chosen_reading: 이삭이 리브가를 위로한 뒤, 이어 야곱을 축복하는 두 동작을 한 절 안에서 간결하게 연결했습니다.
  alternative_readings:
  - ‘리브가에 대하여 야곱을 축복했다’로 더 직역하는 방식
  - 두 동작을 쉼표로만 분리해 더 느슨하게 옮기는 방식
  rationale: 게에즈 원문과 영어 POB 모두 위로와 축복을 연속 동작으로 제시하므로, 한국어에서도 그 서술 순서를 보존해 족장 축복 장면의 흐름을 살렸습니다.
  doctrine_reference: 서사 문맥 보존
- issue: 아들 야곱에 대한 리브가의 연관 표현
  chosen_reading: ‘아들 야곱’으로 옮겨 리브가와 야곱의 모자 관계를 분명히 했습니다.
  alternative_readings:
  - ‘그의 아들 야곱’으로 바꾸는 방식
  - ‘야곱’만 남기고 관계 표지를 생략하는 방식
  rationale: 원문이 리브가의 아들임을 직접 밝혀 주므로, 한국어에서도 관계를 드러내어 서사의 인물 구도를 명확히 했습니다.
  doctrine_reference: 서사 인물 관계
