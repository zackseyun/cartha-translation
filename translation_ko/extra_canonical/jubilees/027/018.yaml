  text: The Most High God will guard him from every evil and will be with him, for he will not forsake him all his days.
translation:
  language: ko
  text: 지극히 높으신 하나님께서는 그의 모든 날 동안 그를 버리지 않으실 것이므로, 그를 모든 악에서 지키시고 그와 함께 계실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል፡
  english_pob_choice: The Most High God
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지극히 높으신 하느님
  lexicon: 하나님
  rationale: 지극히 높으신이라는 최상급 표현으로 Geez의 지고성(“Most High”)을 살리고, Protestant 표준 용례에 따라 하나님을 선택했습니다.
- source_word: የዐቅቦ፡
  english_pob_choice: will guard
  chosen_korean: 지키시고
  alternatives_korean:
  - 보호하시고
  - 지키실 것이며
  lexicon: 지키다
  rationale: 보호의 일반적 의미보다 지속적인 보호·보존을 포함하는 ‘지키다’가 본문의 약속을 더 직접적으로 드러냅니다.
- source_word: እምኵሉ፡ እኩይ፡
  english_pob_choice: from every evil
  chosen_korean: 모든 악에서
  alternatives_korean:
  - 모든 재앙에서
  - 온갖 악에서
  lexicon: 악
  rationale: Geez의 ‘모든 악’은 도덕적 악과 해악을 함께 포괄하므로 직역에 가까운 ‘모든 악에서’가 가장 무난합니다.
- source_word: ወይሄሉ፡ ምስሌሁ፡
  english_pob_choice: and will be with him
  chosen_korean: 그와 함께 계실 것입니다
  alternatives_korean:
  - 그와 함께하실 것입니다
  - 그와 동행하실 것입니다
  lexicon: 함께 계시다
  rationale: 하나님의 지속적인 동반을 나타내므로 ‘함께 계시다’가 한국어에서 가장 자연스럽고 존중되는 표현입니다.
theological_decisions:
- issue: ‘버리지 않으실 것이기 때문입니다’의 인과 관계와 인칭 유지
  chosen_reading: 뒤의 이유절을 그대로 살려, 하나님이 평생 버리지 않으시는 이유가 앞선 보호와 동반의 근거임을 드러냈습니다.
  alternative_readings:
  - ‘…그가 그의 모든 날 동안 그를 버리지 않으실 것이기 때문입니다’의 더 직역형
  - ‘…평생 그를 저버리지 않으시기 때문입니다’
  rationale: Geez의 이중 행위(보호/동반)와 이유절을 모두 유지해야 본문의 약속 구조가 보입니다.
  doctrine_reference: 성경의 신실하심과 보존 약속
- issue: ‘그의 모든 날’의 시간 범위
  chosen_reading: ‘그의 모든 날 동안’을 유지해 평생 지속되는 보장을 강조했습니다.
  alternative_readings:
  - ‘평생 동안’
  - ‘그의 모든 생애 동안’
  rationale: 원문의 총체적 시간 표현을 손상하지 않으면서 한국어로도 자연스럽게 옮길 수 있습니다.
  doctrine_reference: 언약적 지속성
