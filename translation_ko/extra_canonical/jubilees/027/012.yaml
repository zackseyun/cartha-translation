  text: Rise and go to Mesopotamia, to the house of Bethuel, your mother’s father, and take for yourself a wife from there, from the daughters of Laban, your mother’s brother.
translation:
  language: ko
  text: 일어나 메소포타미아로 가서, 네 어머니의 아버지인 브두엘의 집으로 가고, 거기서 네 어머니의 형제 라반의 딸들 가운데서 아내를 너를 위해 데려오너라.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥእ፡ ወሖር፡
  english_pob_choice: Rise and go
  chosen_korean: 일어나 … 가서
  alternatives_korean:
  - 일어나서 가라
