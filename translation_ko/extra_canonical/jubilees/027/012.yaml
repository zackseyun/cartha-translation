translation:
  language: ko
  text: 일어나 메소포타미아, 곧 네 어머니의 아버지 브두엘의 집으로 가십시오. 그곳에서 네 어머니의 형제 라반의 딸들 가운데 한 사람을 아내로 맞이하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተንሥእ፡ ወሖር፡
  english_pob_choice: Rise and go
  chosen_korean: 일어나 … 가서
  alternatives_korean:
  - 일어나서 가라
