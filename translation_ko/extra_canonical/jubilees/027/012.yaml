  lexicon: Geez imperative sequence
  rationale: 연속된 명령형을 자연스럽게 살리면서도, 문어체 합쇼체에서 과도한 직역감을 줄이기 위해 ‘일어나 … 가서’로 연결했습니다.
- source_word: ፄስጶጦሚያ፡
