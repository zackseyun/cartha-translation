  text: And behold, I will be with you and will keep you wherever you go, and I will bring you back into this land in peace. For I will not leave you until I have done everything that I have told you.
translation:
  language: ko
  text: 보십시오, 내가 당신과 함께 있을 것이며 당신이 어디로 가든지 당신을 지켜 주고, 당신을 이 땅으로 평안히 데려오겠습니다. 내가 당신에게 말한 모든 것을 이루기까지는 당신을 버리지 않겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “behold” (Ge'ez opening particle ወነየ)
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  - 보십시오, 보라
  lexicon: 입자/감탄사
  rationale: 서술을 여는 경고·주목 표지를 한국어에서 가장 자연스럽고 격식 있게 살리기 위해 명령형 감탄사보다 공손한 주의 환기 표현을 택했습니다.
- source_word: ምስሌከ / with you
  english_pob_choice: I will be with you
  chosen_korean: 당신과 함께 있을 것이며
  alternatives_korean:
  - 너와 함께 있을 것이며
  - 당신과 동행하겠으며
  lexicon: 전치사구
  rationale: 동반 약속의 관계를 직접적으로 드러내기 위해 ‘함께 있다’를 사용했고, 본문이 개인적 언약 어조이므로 ‘당신’으로 일관했습니다.
- source_word: ወእዐቅበከ / keep you
  english_pob_choice: will keep you
  chosen_korean: 당신을 지켜 주고
  alternatives_korean:
  - 당신을 보호하고
  - 당신을 지키며
  lexicon: 동사
  rationale: 단순 보존보다 보호·보살핌의 뜻을 함께 담는 ‘지켜 주다’가 문맥상 더 정확해, 언약적 보호의 뉘앙스를 살렸습니다.
- source_word: ውስተ፡ ዛ፡ ምድር፡ በሰላም
  english_pob_choice: into this land in peace
  chosen_korean: 이 땅으로 평안히 데려오겠습니다
  alternatives_korean:
  - 이 땅으로 평안 가운데 데려오겠습니다
  - 이 땅으로 평안하게 돌려보내겠습니다
  lexicon: 부사구
  rationale: ‘이 땅으로’는 목적지 이동을, ‘평안히’는 전쟁 없이 안전하게 돌아옴을 압축해 전달하므로 그대로 살렸습니다.
- source_word: ኢየኀድገከ / I will not leave you
  english_pob_choice: I will not leave you
  chosen_korean: 당신을 버리지 않겠습니다
  alternatives_korean:
  - 당신을 떠나지 않겠습니다
  - 당신을 포기하지 않겠습니다
  lexicon: 동사
  rationale: 여기서는 단순한 물리적 이탈보다 보호와 동행의 중단 부재가 핵심이므로 ‘버리다’로 언약적 안정감을 표현했습니다.
theological_decisions:
- issue: 하나님의 약속이 단순 예언이 아니라 언약적 보증으로 들리는 어조
  chosen_reading: ‘당신과 함께 있을 것이며… 당신을 버리지 않겠습니다’로, 동행과 보존의 서약성을 유지했습니다.
  alternative_readings:
  - 중립적인 미래 서술로 약화할 수 있음
  - ‘떠나지 않겠습니다’로만 옮길 수 있음
  rationale: 본절은 행위 예고가 아니라 보호와 귀환을 보증하는 약속이므로, 한국어도 서약적 강도를 유지하는 편이 원문 기능을 더 잘 반영합니다.
  doctrine_reference: 하나님의 신실하심, 언약적 보존
