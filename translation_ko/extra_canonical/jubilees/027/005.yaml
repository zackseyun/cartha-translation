lexical_decisions:
- source_word: ወትቤሎ
  english_pob_choice: And she said to him
  chosen_korean: 그녀가 그에게 말했습니다
  alternatives_korean:
  - 그리고 그녀가 그에게 말했습니다
  - 그녀가 그에게 말하였습니다
  lexicon: 말하다
  rationale: Geez 동사는 단순 발화 서술이므로, 현대 합쇼체로 자연스럽게 옮기되 불필요한 접속사 ‘그리고’는 생략해도 원문의 사건 진행을 유지할 수 있습니다.
- source_word: ኢይሥአን
  english_pob_choice: Let me not be bereaved
  chosen_korean: 잃게 하지 말아 주십시오
  alternatives_korean:
  - 상실되지 않게 해 주십시오
  - 빼앗기지 않게 해 주십시오
  lexicon: bereaved / lose children
  rationale: 문맥상 ‘상실하다’보다 자녀를 잃는 슬픔이 강한 ‘잃다’가 직접적이며, 간청형을 한국어의 정중한 요청으로 자연화했습니다.
- source_word: እምክልኤቱ
  english_pob_choice: of both
  chosen_korean: 두
  alternatives_korean:
  - 양쪽의
  - 둘 다의
  lexicon: both
  rationale: ‘두 아들’이라는 수량 표현으로 원문의 ‘둘 모두’를 가장 간결하게 드러냅니다.
- source_word: ውሉድየ
  english_pob_choice: my sons
  chosen_korean: 제 두 아들
  alternatives_korean:
  - 제 아들 둘
  - 내 아들 둘
  lexicon: sons
  rationale: 첫인칭 소유를 살리되, 한국어에서는 자연스러운 존칭 소유격 ‘제’를 사용했습니다.
theological_decisions:
- issue: 직접 화법의 정중한 간청 어조
  chosen_reading: “제 두 아들을 하루에 둘 다 잃게 하지 말아 주십시오.”
  alternative_readings:
  - “제 두 아들을 하루에 둘 다 잃지 않게 해 주십시오.”
  - “제 두 아들을 하루에 모두 잃지 않게 해 주십시오.”
  rationale: 원문의 간구는 비탄 속의 간절한 요청이므로, 한국어에서도 명령형을 완화한 정중한 청유/간청으로 유지하는 것이 적절합니다.
  doctrine_reference: 서사문 직역의 화행 보존
