revisions:
- from: 리브가에게 맏아들 에서의 일이 꿈으로 알려졌습니다. 리브가는 보내어 작은아들 야곱을 불러 그에게 말했습니다. “보십시오, 당신의 형 에서가 당신을 죽이려고 당신에게 원한을 품고 있습니다.”[a]
  to: 리브가의 맏아들 에서에 관한 일이 꿈에 리브가에게 알려졌습니다. 리브가는 사람을 보내어 작은아들 야곱을 불러 그에게 말했습니다. “보아라, 네 형 에서가 너를 죽이려고 네게 원한을 품고 있다.”[a]
  rationale: 리브가와 에서의 관계를 명료하게 하고, ‘보내어 불렀다’는 동작을 자연스럽게 드러냈으며, 직접화법을 어머니와 아들의 관계에 맞는 현대 한국어로 고쳤습니다. 핵심 동사는 게에즈 본문에 따라 ‘원한을 품다’로 유지하고, 다른 전통적 번역은 각주에만 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:01Z'
review_pass:
  verdict: revise
  source_fidelity: 게에즈 본문의 수동 전달, ‘꿈 안에서/꿈으로’라는 전달 방식, 에서가 리브가의 연장자인 아들이라는 관계, 야곱이 더 어린 아들이라는 관계, 그리고 에서가 야곱에게 원한을 품어 죽이려 한다는 뜻을 전반적으로 잘 반영했습니다. 다만 ‘맏아들 에서의 일’은 한국어에서 다소 어색하고 소유·관계가 불분명하므로 ‘리브가의 맏아들 에서에 관한 일’로 명료하게 하는 것이 좋습니다.
  naturalness: 서술문은 합쇼체에 맞지만, 어머니가 아들에게 ‘당신’과 ‘보십시오’라고 하는 직접화법은 현대 한국어에서 부자연스럽습니다. 인용문은 등장인물 간의 자연스러운 말투로 ‘보아라, 네 형 에서가…’라고 옮기는 편이 적절합니다. ‘사람을 보내어’는 보내어 불렀다는 연속 동작을 자연스럽게 드러냅니다.
  terminology: ‘원한을 품고 있다’는 ይትቄየመከ의 ‘원한을 품다/앙심을 품다’라는 의미를 잘 살리며, 히브리어 평행본문의 관용구를 따라 ‘스스로 위로하다’로 되돌리지 않습니다. 각주에는 그 이전 번역 가능성을 단지 대안으로 제시할 수 있습니다.
  issues:
