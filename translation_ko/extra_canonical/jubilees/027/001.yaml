translation:
  language: ko
  text: 리브가에게 맏아들 에서의 일이 꿈으로 알려졌습니다. 리브가는 보내어 작은아들 야곱을 불러 그에게 말했습니다. “보십시오, 당신의 형 에서가 당신을 죽이려고 당신에게 원한을 품고 있습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተነግረ ... በሕልም
  english_pob_choice: was told ... in a dream
  chosen_korean: 꿈으로 알려졌습니다
  alternatives_korean:
  - 꿈에서 전해졌습니다
  - 꿈으로 들려왔습니다
  lexicon: unknown
  rationale: 수동적 전달과 꿈의 매개를 함께 살려, ‘꿈속 계시’처럼 과도하게 신비화하지 않으면서도 사건의 전달 방식을 자연스럽게 표현했습니다.
- source_word: ነገሩ
  english_pob_choice: the matter
  chosen_korean: 일
  alternatives_korean:
  - 사정
  - 말
  lexicon: unknown
  rationale: POB의 ‘the matter’에 맞춰 단순한 ‘말’보다 상황 전체를 가리키는 ‘일’로 옮겼습니다.
- source_word: ዘይሌህቅ
  english_pob_choice: older son
  chosen_korean: 맏아들
  alternatives_korean:
  - 큰아들
  - 연장자인 아들
  lexicon: unknown
  rationale: 가문 내 연장자 지위를 드러내는 표현으로 ‘맏아들’이 가장 간결하고 문맥에 맞습니다.
- source_word: ዘይንእስ
  english_pob_choice: younger son
  chosen_korean: 작은아들
  alternatives_korean:
  - 막내아들
  - 어린아들
  lexicon: unknown
  rationale: 형제 대비를 분명히 하면서도 현대 한국어에서 자연스러운 호칭으로 옮겼습니다.
- source_word: ይትቄየመከ
  english_pob_choice: is bearing a grudge against you
  chosen_korean: 당신에게 원한을 품고 있습니다
  alternatives_korean:
  - 당신을 미워하고 있습니다
  - 당신에게 앙심을 품고 있습니다
  lexicon: unknown
  rationale: 게에즈 동사의 의미를 POB 개정에 따라 ‘원한을 품다’로 반영하여, 단순한 위협보다 복수심과 적대의 상태를 드러냈습니다.
theological_decisions:
- issue: 꿈을 통한 정보 전달의 성격
  chosen_reading: 꿈으로 알려졌습니다
  alternative_readings:
  - 하나님이 꿈으로 알게 하셨습니다
  - 꿈에서 계시를 받았습니다
  rationale: 본문은 알려짐의 방식만 말하며, 꿈의 출처를 명시하지 않으므로 하나님의 직접 계시로 좁히지 않고 서술만 유지했습니다.
  doctrine_reference: 서사적 절제와 본문 한정 해석
