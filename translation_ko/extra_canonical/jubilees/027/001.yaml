  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
  footnotes:
  - marker: a
    text: Or 'is consoling himself concerning you'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가의 맏아들 에서에 관한 일이 꿈에 리브가에게 알려졌습니다. 리브가는 사람을 보내어 작은아들 야곱을 불러 그에게 말했습니다. “보아라, 네 형 에서가 너를 죽이려고 네게 원한을 품고 있다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너에 관하여 스스로 위로하고 있다’.
    reason: 게에즈 본문은 ‘원한을 품고 있다’라는 뜻의 동사를 사용하므로 본문은 이를 따릅니다. 이 대안은 창세기 27:42의 히브리어 평행본문에 나타나는 관용적 표현을 반영한 이전 번역 가능성입니다.
