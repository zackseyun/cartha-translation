  - severity: medium
    issue: 마지막 인과절의 표현이 부자연스럽고 의미 관계가 흐려짐
    rationale: ‘내가 그를 떠나면, 내가 그를 떠나 당신에게서 가 버렸기 때문에’는 동일 동사의 반복과 ‘당신’ 표현 때문에 원문의 완료된 ‘그를 버리고 너희에게서 떠나갔다’는 근거가 명료하지 않습니다.
