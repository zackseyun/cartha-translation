revisions:
- from: 야곱이 그의 어머니 레베카에게 말했습니다. "보십시오, 아버지께서 이미 늙으셔서 보지 못하신다는 것을 아시지요. 그의 눈이 흐릿해졌기 때문입니다. 내가 그를 떠나면, 내가 그를 떠나 당신에게서 가 버렸기 때문에 아버지 눈에는 나쁜 일이 될 것입니다."[a][b]
  to: 야곱이 그의 어머니 레베카에게 말했습니다. “보십시오, 아버지께서 늙으셔서 보지 못하신다는 것을 어머니도 아십니다. 아버지의 눈이 흐려졌기 때문입니다. 제가 아버지를 떠나면, 제가 아버지를 버리고 어머니 곁을 떠나갔기 때문에 아버지께서 보시기에 악한 일이 될 것입니다.”
  rationale: 호칭과 종결을 현대 격식체에 맞추고, 어머니를 향한 ‘당신’을 자연스러운 ‘어머니’로 바꾸었습니다. 원문의 ‘떠나다/버리다’와 완료된 ‘떠나갔다’를 구분해 반영했으며, ‘evil in his sight’는 교리적 해석을 더하지 않고 ‘아버지께서 보시기에 악한 일’로 옮겼습니다. 원문에 나타나는 복수형 ‘너희에게서’는 이 대화의 단일 청자인 레베카와 충돌할 수 있으므로, 수를 단정하지 않는 ‘어머니 곁을’로 처리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:04Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 서술은 대체로 원문에 충실합니다. 그러나 마지막 절의 ‘그를 떠나고 너희에게서 떠나갔다’라는 완료된 표현이 초안에서는 다소 어색하게 중복되며, ‘나쁜 일이’는 እኩይ(악한/나쁜)의 평가적 뉘앙스를 충분히 드러내지 못합니다. 원문의 다소 긴장된 시제와 인과관계는 유지하되 한국어 문장을 명료하게 다듬는 것이 안전합니다.
  naturalness: ‘아시지요’는 합쇼체로 제시된 번역 안에서 종결체가 일관되지 않습니다. 또한 어머니에게 ‘당신’이라고 하는 표현은 현대 한국어에서 어색하거나 거리감 있게 들릴 수 있습니다. ‘어머니 곁을’로 자연스럽게 처리했습니다.
  terminology: 야곱과 레베카는 통용 표기로 무방합니다. ‘아버지 보시기에 악한 일이 될 것입니다’는 원문의 ‘그의 눈에 악하다’를 자연스럽고도 비교적 직역적으로 반영합니다.
  issues:
  - severity: medium
    issue: 합쇼체 종결의 불일치
