  text: And Jacob said to Rebekah his mother, “Look, you know that my father has become old and does not see, because his eyes are dim. And if I leave him, it will be evil in his sight, because I have left him and gone away from you.”
translation:
  language: ko
  text: 야곱이 그의 어머니 레베카에게 말했습니다. "보십시오, 아버지께서 이미 늙으셔서 보지 못하신다는 것을 아시지요. 그의 눈이 흐릿해졌기 때문입니다. 내가 그를 떠나면, 내가 그를 떠나 당신에게서 가 버렸기 때문에 아버지 눈에는 나쁜 일이 될 것입니다."[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዕቆብ / Jacob
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 야코브
  - 자콥
  lexicon: 고유명사
  rationale: 성경에서 이미 널리 정착된 표기를 따랐습니다.
- source_word: ለርብቃ፡ እሙ፡ / to Rebekah his mother
  english_pob_choice: Rebekah his mother
  chosen_korean: 그의 어머니 레베카에게
  alternatives_korean:
  - 어머니 레베카에게
  - 리브가 그의 어머니에게
  lexicon: 고유명사
  rationale: 인물 관계를 자연스럽게 드러내기 위해 소유 표현을 앞세웠고, 인명은 현대 표기인 레베카를 채택했습니다.
- source_word: ረሰአ፡ ... ወኢይሬኢ፡ / has become old and does not see
  english_pob_choice: has become old and does not see
  chosen_korean: 이미 늙으셔서 보지 못하신다는 것을
  alternatives_korean:
  - 늙으시고 보지 못하신다는 것을
  - 나이가 많으시고 보지 못하신다는 것을
  lexicon: 동사구
  rationale: 노쇠와 실명 상태를 함께 살리되, 한국어에서 자연스럽게 이어지도록 합쳤습니다.
- source_word: ክቡዳ፡ አዕይንቲሁ፡ / his eyes are dim
  english_pob_choice: his eyes are dim
  chosen_korean: 그의 눈이 흐릿해졌기 때문입니다
  alternatives_korean:
  - 그의 눈이 어두워졌기 때문입니다
  - 그의 눈이 흐려졌기 때문입니다
  lexicon: 표현
  rationale: 눈의 기능 저하를 직접적으로 전달하는 표현으로 옮겼으며, 단순한 ‘어두움’보다 시각 저하를 더 분명히 드러냅니다.
- source_word: እኩይ፡ ውእቱ፡ / it will be evil
  english_pob_choice: it will be evil
  chosen_korean: 아버지 눈에는 나쁜 일이 될 것입니다
  alternatives_korean:
  - 아버지께 악하게 보일 것입니다
  - 아버지 보시기에 악한 일이 될 것입니다
  lexicon: 평가 표현
  rationale: 직역의 딱딱함을 줄이면서도, 행위가 아버지에게 해롭게 보인다는 평가를 유지했습니다.
theological_decisions:
- issue: ‘evil in his sight’의 평서적 판단을 한국어로 어떻게 표현할지
  chosen_reading: 행위의 도덕적 평가보다는 아버지에게 불길하고 좋지 않은 일이라는 의미로 옮겼습니다.
  alternative_readings:
  - 도덕적으로 악한 일
  - 아버지 보시기에 악한 일
  rationale: 문맥상 야곱의 출발이 이삭에게 미칠 부정적 반응을 말하는 것으로, 한국어에서 과도한 윤리적 단정을 피하는 것이 자연스럽습니다.
  doctrine_reference: 서사 문맥 해석
