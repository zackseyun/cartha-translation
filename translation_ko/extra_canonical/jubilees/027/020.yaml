translation:
  language: ko
  text: 그를 두고 두려워하지 마십시오, 내 누이여. 그는 자기 길에서 바르고, 흠 없는 사람이며, 신실하고, 버려지지 않을 것입니다. 울지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 신실합니다. 울지 마십시오.”
    reason: 영어 POB 감사 기록의 이문 각주(‘and he is faithful. Do not weep.’)를 한국어로 옮겨, 본문에 남아 있는 [a] 표지를 뒷받침합니다.
