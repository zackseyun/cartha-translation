  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
  footnotes:
  - marker: a
    text: Or 'and he is faithful. Do not weep.'.
    reason: previous_rendering
  - marker: b
    text: Or 'in his ways'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 일 때문에 두려워하지 마십시오, 내 누이여. 그는 그의 길에서 올바르고, 흠 없는 사람이며, 신실하고, 버려지지 않을 것입니다. 울지 마십시오.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትፍርሂ
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: Geez imperative/negative
  rationale: 직접적인 금지 명령을 현대 합쇼체로 옮겼으며, 문맥상 단순 감정 억제가 아니라 실제 두려움의 금지를 나타내므로 ‘두려워하지 마십시오’가 가장 자연스럽습니다.
- source_word: በፍኖቱ
  english_pob_choice: in his way
  chosen_korean: 그의 길에서
  alternatives_korean:
  - 그의 길 안에서
  - 그의 방식으로
  lexicon: Geez prepositional phrase
  rationale: 단수형 ‘his way’에 맞춰 ‘길에서’로 옮겨, POB의 수정 취지인 단수 의미를 유지했습니다.
- source_word: '*ሪትዕ'
  english_pob_choice: upright
  chosen_korean: 올바르고
  alternatives_korean:
  - 정직하고
  - 바르고
  lexicon: Geez adjective
  rationale: 행위와 삶의 방향이 곧다는 의미를 살려 ‘올바르고’로 옮겼습니다. 문맥상 도덕적 정당성과 직행성을 함께 담을 수 있습니다.
- source_word: ፍጹም ብእሲ
  english_pob_choice: a blameless man
  chosen_korean: 흠 없는 사람
  alternatives_korean:
  - 완전한 사람
  - 결점 없는 사람
  lexicon: Geez moral descriptor
  rationale: 개정된 영어가 반영한 ‘blameless’의 도덕적 무흠함을 살려, 한국어에서는 성경적 문맥에 자연스러운 ‘흠 없는 사람’을 선택했습니다.
- source_word: ወኢይትገደፍ
  english_pob_choice: he will not be forsaken
  chosen_korean: 버려지지 않을 것입니다
  alternatives_korean:
  - 내버려지지 않을 것입니다
  - 포기되지 않을 것입니다
  lexicon: Geez passive verb
  rationale: 누가 그를 버리는가가 암시된 수동 표현을 한국어 수동으로 옮겨, 단순한 생존이 아니라 보호와 보존의 의미를 드러냈습니다.
theological_decisions:
- issue: ‘faithful’와 ‘will not be forsaken’의 연결
  chosen_reading: 신실하고, 버려지지 않을 것입니다
  alternative_readings:
  - 신실하며, 버려지지 않을 것입니다
  - 믿음직하고, 버려지지 않을 것입니다
  rationale: 원문은 인물의 신실함과 그가 버려지지 않을 미래를 병렬로 제시하므로, 두 진술을 분리해 그대로 유지했습니다.
  doctrine_reference: 서술 구조 보존 및 문장 병렬성
- issue: ‘my sister’의 호칭
  chosen_reading: 내 누이여
  alternative_readings:
  - 내 자매여
  - 누이야
  rationale: 직접 호칭을 살리되, 현대 합쇼체 본문과 어울리도록 ‘내 누이여’로 옮겼습니다. 과도한 경어화나 구어화는 피했습니다.
  doctrine_reference: 화자-청자 관계의 문체 보존
