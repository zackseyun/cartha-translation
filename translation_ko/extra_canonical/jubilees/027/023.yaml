translation:
  language: ko
  text: 그리고 그곳의 돌들 가운데 하나를 가져다가 그 나무 아래에 두었으며, 그는 홀로 여행하고 있었습니다. 그리고 잠들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእብነ
  english_pob_choice: one of the stones of that place
  chosen_korean: 그곳의 돌들 가운데 하나
  alternatives_korean:
  - 그곳의 돌 하나
  - 그곳의 돌 중 하나
  lexicon: stone
  rationale: 원문의 ‘하나’를 살리면서, 단순한 단일 돌이 아니라 그 장소의 돌들 가운데 하나를 가리키는 의미를 자연스럽게 옮겼습니다.
- source_word: ውእቱ ዕፅ
  english_pob_choice: that tree
  chosen_korean: 그 나무
  alternatives_korean:
  - 그 나무 아래
  - 그 그 나무
  lexicon: tree
  rationale: 지시어를 반영해 특정한 나무를 가리키는 표현으로 옮겼으며, ‘아래’는 뒤의 위치 관계를 자연스럽게 보완합니다.
- source_word: ወውእቱ ባሕቲቱ የሐውር
  english_pob_choice: he was traveling alone
  chosen_korean: 그는 홀로 여행하고 있었습니다
  alternatives_korean:
  - 그는 홀로 걷고 있었습니다
  - 그는 혼자 길을 가고 있었습니다
  lexicon: הלך/הלך-journey verb
  rationale: 게에즈 동사는 단순 보행보다 이동·여행의 뉘앙스가 있어, POB의 최종 영어 선택인 ‘traveling’에 맞추어 옮겼습니다.
- source_word: ወኖመ
  english_pob_choice: and he slept
  chosen_korean: 그리고 잠들었습니다
  alternatives_korean:
  - 그리고 잤습니다
  - 그리고 잠이 들었습니다
  lexicon: sleep
  rationale: 서술 흐름을 살리면서도 문어체로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 여행 동사의 의미 범위
  chosen_reading: ‘여행하고 있었습니다’로 옮겨 장거리 이동 중의 상황을 드러냈습니다.
  alternative_readings:
  - ‘걷고 있었습니다’
  - ‘길을 가고 있었습니다’
  rationale: 문맥상 야곱의 이동은 단순한 산책이 아니라 여정이므로, 영어 POB의 최종 판단과 원문 동사의 범위를 함께 반영했습니다.
