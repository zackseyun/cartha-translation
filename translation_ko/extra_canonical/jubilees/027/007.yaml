  text: and my father will be angry and curse me. I will not go; only if he sends me will I go.”
translation:
  language: ko
  text: “아버지께서 화를 내시고 저를 저주하실 것입니다. 저는 가지 않겠습니다. 아버지께서 저를 보내실 때에만 가겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይትመዓዕ
  english_pob_choice: will be angry
  chosen_korean: 화를 내시며
  alternatives_korean:
  - 성내시며
  - 노하시며
  lexicon: Geez verb of anger
  rationale: 아버지의 분노를 자연스러운 현대 한국어로 옮기되, 단순 감정 상태보다 표출되는 분노의 행위를 살려 “화를 내시며”로 처리했습니다.
- source_word: ይረግመኒ
  english_pob_choice: curse me
  chosen_korean: 저를 저주하실 것입니다
  alternatives_korean:
  - 저주하실 것입니다
  - 저주하시리라
  lexicon: Geez verb of cursing
  rationale: 직접적인 저주 행위를 분명히 드러내기 위해 “저주하실 것입니다”를 사용했습니다.
- source_word: ኢየሐውር
  english_pob_choice: I will not go
  chosen_korean: 저는 가지 않겠습니다
  alternatives_korean:
  - 나는 가지 않겠습니다
  - 가려 하지 않겠습니다
  lexicon: Geez negated first-person future
  rationale: 서술의 단순한 의지 부정으로 보아 현대 문어체의 자연스러운 부정 미래형으로 옮겼습니다.
- source_word: ባሕቱ አሐውር
  english_pob_choice: only if he sends me will I go
  chosen_korean: 다만 그분이 저를 보내시면 가겠습니다
  alternatives_korean:
  - 오직 그가 나를 보내면 가겠습니다
  - 그분이 보내지 않으시면 가지 않겠습니다
  lexicon: Geez restrictive conditional + sending verb
  rationale: 조건절의 제한 의미를 “다만”으로 살리고, 파견/보냄의 행위를 한국어에서 자연스럽게 “보내시면”로 옮겼습니다.
theological_decisions:
- issue: 직접화법 내부의 인칭과 존대 처리
  chosen_reading: 아버지에 대한 3인칭 존대와 화자 1인칭의 직접 진술을 유지했습니다.
  alternative_readings:
  - 아버지는 화가 나서 저를 저주하실 것입니다
  - 아버지가 화를 내며 나를 저주할 것이다
  rationale: 본문은 화자의 자가진술이므로 합쇼체 서술을 유지하되, 아버지에 대한 존대형을 써서 관계의 긴장을 자연스럽게 드러냈습니다.
  doctrine_reference: 서사적 직접화법의 화자 관점 보존
