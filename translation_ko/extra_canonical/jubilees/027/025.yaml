  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: ko
  text: 그가 야곱에게 말씀하셨습니다. 「나는 주님입니다. 나는 네 조상 아브라함의 하나님이며 이삭의 하나님입니다. 네가 누워 자고 있는 이 땅을 내가 너와 네 뒤를 이을 네 씨에게 주겠습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘네 아버지 아브라함’입니다. 여기서 ‘아버지’는 조상을 가리키는 친족 호칭으로 쓰였습니다.
    reason: 원문의 친족 호칭을 투명하게 알리면서, 야곱에게 아브라함이 조상이라는 한국어의 자연스러운 표현을 보완합니다.
