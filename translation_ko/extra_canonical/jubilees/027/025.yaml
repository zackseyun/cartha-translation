  naturalness: ‘이르시되’ 뒤에 직접 인용을 둔 뒤 다시 ‘하셨습니다’를 덧붙인 초안은 문장 구조가 어색합니다. 현대 합쇼체로 직접 인용과 발화 동사를 정리하고, ‘네 뒤의 네 씨’는 자연스러운 ‘네 뒤를 이을 네 씨’로 다듬는 것이 좋습니다.
  terminology: ‘주님’은 원문의 신명 호칭을 무리 없이 반영하며, ‘하나님’은 뒤따르는 관계 호칭에 유지했습니다. ‘씨’는 약속의 후손을 가리키는 원문의 표현을 보존했습니다.
