  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: ko
  text: 그가 야곱에게 말씀하여 이르시되, 「나는 야훼이니, 네 아버지 아브라함의 하나님이요 이삭의 하나님이다. 네가 누워 있는 이 땅을 내가 너와 네 뒤의 네 씨에게 주겠다」 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተናገረ፡ ምስለ፡ ያዕቆብ፡ ወይቤ፡
  english_pob_choice: And he spoke with Jacob and said
  chosen_korean: 그가 야곱에게 말씀하여 이르시되
  alternatives_korean:
  - 그리고 야곱과 말씀하셔서 이르시되
  - 야곱과 함께 말씀하시고 이르시되
  lexicon: Geez narratival formula
  rationale: 히브리식/게에즈식 서술 공식을 자연스러운 문어체로 옮기되, ‘말씀하여 이르시되’로 직접 화행을 유지했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 원문에서 신명칭이 직접 나오므로 POB 기본값에 따라 ‘야훼’를 사용해 구약적 신명성을 분명히 했습니다.
- source_word: አምላከ፡ አብርሃም፡ አቡከ፡ ወአምላከ፡ ይስሐቅ፡
  english_pob_choice: the God of Abraham your father and the God of Isaac
  chosen_korean: 네 아버지 아브라함의 하나님이요 이삭의 하나님
  alternatives_korean:
  - 네 아버지 아브라함의 하나님이며 이삭의 하나님
  - 아브라함 네 아버지의 하나님이요 이삭의 하나님
  lexicon: Construct chain / genitive relation
  rationale: 아브라함에 대한 관계를 ‘네 아버지’로 유지해 친족 표지를 살리고, 병렬 구조는 한국어의 ‘-이요’로 자연스럽게 재현했습니다.
- source_word: ምድረ፡ እንተ፡ ዲቤሃ፡ አንተ፡ ትነውም፡
  english_pob_choice: The land on which you are lying asleep
  chosen_korean: 네가 누워 있는 이 땅
  alternatives_korean:
  - 네가 누워 자는 이 땅
  - 네가 잠들어 있는 이 땅
  lexicon: Participial verbal phrase
  rationale: 상태를 나타내는 원문의 뉘앙스를 살려 ‘누워 있는’으로 옮겼고, POB 개정의 ‘lying asleep’에 맞춰 과도한 ‘잠들다’보다 덜 단정적으로 처리했습니다.
- source_word: እሁብ፡ ወለዘርእከ፡ እምድኅሬከ።
  english_pob_choice: I will give to you and to your seed after you
  chosen_korean: 내가 너와 네 뒤의 네 씨에게 주겠다
  alternatives_korean:
  - 내가 너와 네 후손에게 주겠다
  - 내가 너와 네 뒤를 이을 씨에게 주겠다
  lexicon: Seed / offspring
  rationale: ‘씨’는 약속 언어의 핵심 용어이므로 그대로 살렸고, ‘after you’는 직역적이면서도 한국어로 자연한 ‘네 뒤의’로 옮겼습니다.
theological_decisions:
- issue: 하나님 자기계시에서 신명칭을 어떻게 둘 것인가
  chosen_reading: ‘나는 야훼이니’로 옮겨, 원문의 신명칭과 언약적 자기계시를 직접 드러냈습니다.
  alternative_readings:
  - ‘나는 주님이다’
  - ‘나는 여호와다’
  rationale: 이 장면은 단순한 호칭이 아니라 언약 하나님이 스스로를 밝히는 선언이므로, POB 기본 신명칭을 따라 ‘야훼’로 유지하는 것이 문맥상 가장 투명합니다.
  doctrine_reference: 구약 신명 계시 / 언약 신학
