    issue: Subject mismatch in '그의 길이 어디를 가든지'
    rationale: The source has 'wherever he goes,' not 'wherever his way goes.' Korean should make the person the subject of going and retain 'his ways' as the subject of prospering.
  - severity: low
    issue: Unresolved footnote anchor [a]
    rationale: The draft contains an anchor but supplies no corresponding footnote. No note is required for this verse, so the unsupported anchor should be removed.
