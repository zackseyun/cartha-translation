  text: For I know that his ways will prosper in everything wherever he goes, until he returns to us in peace and we see him in peace.
translation:
  language: ko
  text: 그가 평안히 우리에게 돌아와 우리가 평안히 그를 볼 때까지, 그가 어디로 가든지 그의 길이 모든 일에서 형통할 것을 나는 압니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ፡ አአምር
  english_pob_choice: For I know
  chosen_korean: 내가 아는 바로는
  alternatives_korean:
  - 나는 압니다
  - 내가 압니다
  - 내가 알기로는
  lexicon: source clause introducing the speaker's certainty
  rationale: 접속사와 동사구를 단순히 직역하기보다, 발화자의 확신을 자연스럽게 드러내는 한국어 표현으로 옮겼습니다.
- source_word: ይሤራኅ፡ ፍኖዊሁ፡ በኵሉ፡ ውእደ፡ ሖረ፡
  english_pob_choice: his ways will prosper in everything wherever he goes
  chosen_korean: 그의 길이 어디를 가든지 모든 일에서 형통할 것이며
  alternatives_korean:
  - 그의 길이 모든 곳에서 잘될 것이며
  - 그가 가는 곳마다 그의 길이 번성할 것이며
  lexicon: דרך/ways + prosperity/prosper
  rationale: ‘길’은 행적과 삶의 진로를 함께 담고, ‘형통하다’는 POB의 prosper를 한국어로 가장 직접적으로 살립니다.
- source_word: እስከ፡ አመ፡ ይገብእ፡ በሰላም፡ ኀቤነ፡
  english_pob_choice: until he returns to us in peace
  chosen_korean: 그가 평안히 우리에게 돌아올 때까지
  alternatives_korean:
  - 그가 평강 가운데 우리에게 돌아올 때까지
  - 그가 안전하게 우리에게 돌아올 때까지
  lexicon: return in peace
  rationale: ‘평안히’는 단순한 무사 귀환보다 관계적·상태적 평화를 함께 살리는 표현입니다.
- source_word: ወንሬእዮ፡ በሰላም
  english_pob_choice: and we see him in peace
  chosen_korean: 우리는 그를 평안히 보게 될 것입니다
  alternatives_korean:
  - 우리는 그를 평안 가운데 보게 될 것입니다
  - 우리는 그를 평화롭게 보게 될 것입니다
  lexicon: see him in peace
  rationale: 마지막 반복도 같은 어휘를 유지해 히브리식 병렬과 종결의 안정감을 살렸습니다.
theological_decisions:
- issue: ‘형통’의 번영 개념
  chosen_reading: 이 구절의 prosper는 단순한 물질적 번영보다, 주어진 길이 성공적으로 이루어지는 전체적 번성으로 읽었습니다.
  alternative_readings:
  - 재물 중심의 번영으로 좁혀 읽는 해석
  - 일반적 성공으로만 약화시키는 해석
  rationale: 문맥은 인물의 ‘길’과 ‘어디를 가든지’를 말하므로, 결과의 총체적 잘됨을 뜻하는 표현이 적절합니다.
  doctrine_reference: 서사 문맥의 인도와 섭리
