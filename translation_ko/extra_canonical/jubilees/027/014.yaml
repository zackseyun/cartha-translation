  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
  footnotes:
  - marker: a
    text: Or 'the blessing'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분께서 내 아버지 아브라함의 축복들[a]을 너와 네 뒤를 이을 네 씨에게 주셔서, 네가 네가 나그네로 머무는 땅과 하나님께서 아브라함에게 주신 모든 땅을 상속받게 하시기를 바랍니다. 가십시오, 내 아들아. 평안히.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘축복’.
    reason: 게에즈어 본문은 복수형 ‘축복들’을 사용하지만, 단수로 이해하거나 옮길 가능성을 알려 줍니다.
lexical_decisions:
- source_word: በረከታቲሁ
  english_pob_choice: the blessings
  chosen_korean: 복들
  alternatives_korean:
  - 복
  - 축복들
  lexicon: Ge'ez በረከት 계열
  rationale: 게에즈 복수형이므로 단수 ‘복’보다 복수성을 드러내는 ‘복들’이 원문을 더 정확히 반영합니다.
- source_word: ለአቡየ፡ አብርሃም፡
  english_pob_choice: my father Abraham
  chosen_korean: 내 아버지 아브라함
  alternatives_korean:
  - 내 아버지인 아브라함
  - 아버지 아브라함
  lexicon: 친족 호칭 + 고유명사
  rationale: 관계 호칭을 살려 아브라함과의 계승 관계를 직접적으로 보여 주되, 한국어 문장 흐름은 자연스럽게 유지했습니다.
- source_word: ወወለዘርእከ፡ እምድኅሬከ፡
  english_pob_choice: to you and to your seed after you
  chosen_korean: 너와 너의 뒤에 올 네 씨에게
  alternatives_korean:
  - 너와 네 뒤의 네 씨에게
  - 너와 네 후손에게
  lexicon: 씨 / 후손
  rationale: POB의 ‘seed’를 따라 전승적·언약적 뉘앙스를 유지하기 위해 ‘후손’보다 ‘씨’를 사용했고, 뒤에 올 순서를 분명히 했습니다.
- source_word: ምድረ፡ ፍልሰትከ፡ ወኵላ፡ ምድረ፡ እንተ፡ ወሀቦ፡ እግዚአብሔር፡ ለአብርሃም፡
  english_pob_choice: the land of your sojourning and all the land that God gave to Abraham
  chosen_korean: 네 나그네 삶의 땅과 하나님이 아브라함에게 주신 온 땅
  alternatives_korean:
  - 네 거류의 땅과 하나님이 아브라함에게 주신 모든 땅
  - 네 체류의 땅과…
  lexicon: sojourning / land
  rationale: ‘sojourning’을 단순 거주가 아니라 임시 체류·나그네 상태로 나타내는 ‘나그네 삶’으로 옮겨, 언약적 체류 상황을 보존했습니다.
theological_decisions:
- issue: 평안히”의 마무리 인사 어조
  chosen_reading: 명령형/축복형의 간결한 작별 인사로 보존했습니다.
  alternative_readings:
  - 완곡한 소망형으로 약화
  - 평안히 가십시오로 보완
  rationale: 원문과 POB는 짧은 송별/축복 발화를 유지하므로, 한국어에서도 장황하게 풀지 않고 간명한 종결로 살렸습니다.
  doctrine_reference: 서사적 축복 발화의 직접성 보존
