translation:
  language: ko
  text: 리브가가 야곱에게 말했습니다. “제가 들어가서 말하겠습니다. 그러면 그가 당신을 보낼 것입니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትቤሎ፡ ... ለያዕቆብ፡
  english_pob_choice: And Rebekah said to Jacob
  chosen_korean: 리브가가 야곱에게 말했습니다
  alternatives_korean:
  - 리브가가 야곱에게 이르렀습니다
  - 리브가가 야곱에게 말하였습니다
  lexicon: 고유명사/서술동사
  rationale: 서술 동사는 현대 문체의 자연스러운 과거형인 ‘말했습니다’를 택했고, 지시 대상은 원문과 같이 ‘야곱에게’로 분명히 했습니다.
- source_word: አነ፡ እበውእ፡ ወእነግር፡
  english_pob_choice: I will go in and speak
  chosen_korean: 제가 들어가서 말하겠습니다
  alternatives_korean:
  - 제가 들어가서 이야기하겠습니다
  - 제가 들어가서 말할 것입니다
  lexicon: 동사구
  rationale: Ge‘ez의 연속 동작을 한국어의 ‘들어가서 말하겠습니다’로 옮겨, 단순히 내부로 가는 것과 말하는 행위를 모두 살렸습니다.
- source_word: ወይፈንወከ።
  english_pob_choice: and he will send you
  chosen_korean: 그러면 그가 당신을 보낼 것입니다
  alternatives_korean:
  - 그러면 그가 당신을 보내실 것입니다
  - 그러면 그가 당신을 보내줄 것입니다
  lexicon: 동사
  rationale: 공인된 영어 POB의 교정 이력이 ‘send for you’가 아니라 ‘send you’임을 반영하여, 소환이 아니라 야곱을 보내는 의미로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 리브가의 말투와 전달 방식
  chosen_reading: 직접화법 내부는 평이한 예고문 형태로 유지하고, 전체 서술은 합쇼체로 통일했습니다.
  alternative_readings:
  - 직접화법도 더 공손한 표현으로 완화
  - 고전적 서술체로 조정
  rationale: 원문은 단순한 서술과 예고로 이루어져 있어, 한국어에서도 불필요한 격식 상승이나 성경투를 피하고 사건 전개의 명료성을 유지하는 것이 적절합니다.
  doctrine_reference: 서사문 문체 일관성
