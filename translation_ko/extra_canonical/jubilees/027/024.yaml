  source_fidelity: 전반적으로 게에즈 본문을 충실히 옮겼습니다. መዓርግ은 ‘사닥다리’, የዐርጉ፡ ወይወርዱ፡는 진행 중인 ‘오르내리다’, ውስቴታ는 주된 뜻인 ‘그 위에’로 적절히 반영되었습니다. 마지막 위치 표현은 사닥다리를 가리키는 것이 분명하므로 한국어 본문에서 이를 밝혀 주는 것이 안전합니다.
  naturalness: 합쇼체 문장으로 자연스럽고 읽기 쉽습니다. 다만 ‘그 위로’와 마지막의 ‘그 위’는 한국어에서 선행사를 잠시 모호하게 할 수 있으므로 ‘그 사닥다리’로 한 번 명시하면 장면이 더 분명해집니다.
  terminology: ‘하나님’, ‘천사들’, ‘사닥다리’는 현대 표준 한국어 성서 문맥에 알맞고, 원문의 명칭과 의미를 무리 없이 보존합니다.
