  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
  footnotes:
  - marker: a
    text: Or 'above it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 밤에 그가 꿈을 꾸었습니다. 보라, 사닥다리가 땅 위에 놓여 있었고 그 꼭대기는 하늘에 닿아 있었습니다. 보라, 하나님의 천사들이 그 위로 오르내리고 있었고, 보라, 하나님께서 그 위에 서 계셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐለመ፡ በይእቲ፡ ሌሊት፡
  english_pob_choice: And he dreamed that night
  chosen_korean: 그 밤에 그가 꿈을 꾸었습니다
  alternatives_korean:
  - 그 밤에 그는 꿈을 꾸었습니다
  - 그 밤에 꿈을 꾸었습니다
  lexicon: source_note
  rationale: 주어가 전후 문맥상 야곱임을 암시하지만, 본문 자체의 인칭을 크게 확장하지 않고 자연스러운 서술로 옮겼습니다.
- source_word: መዓርግ፡ ትክልት፡
  english_pob_choice: a ladder was set on the earth
  chosen_korean: 사닥다리가 땅 위에 놓여 있었고
  alternatives_korean:
  - 사닥다리가 땅에 세워져 있었고
  - 사닥다리가 땅 위에 놓여 있었으니
  lexicon: source_note
  rationale: Geez의 ‘놓이다/세워지다’에 해당하는 상태를 살리면서, 한국어에서 ‘사닥다리’는 전통적으로 인지되지만 현대어로도 읽히는 표현을 택했습니다.
- source_word: ወርእሳ፡ ትበጽፍ፡ ውስተ፡ ሰማይ፡
  english_pob_choice: and its top reached to heaven
  chosen_korean: 그 꼭대기는 하늘에 닿아 있었습니다
  alternatives_korean:
  - 그 꼭대기는 하늘까지 닿아 있었습니다
  - 그 꼭대기가 하늘에 이르렀습니다
  lexicon: source_note
  rationale: ‘이르다’보다 ‘닿다’가 끝점 도달의 시각적 이미지를 더 직접적으로 살립니다.
- source_word: መላእክተ፡ እግዚአብሔር፡
  english_pob_choice: the angels of God
  chosen_korean: 하나님의 천사들
  alternatives_korean:
  - 하나님께 속한 천사들
  - 하나님의 사자들
  lexicon: source_note
  rationale: 소유격을 자연스럽게 반영하면서, 본문이 말하는 천사들의 출처를 분명히 했습니다.
- source_word: የዐርጉ፡ ወይወርዱ፡
  english_pob_choice: were going up and coming down
  chosen_korean: 오르내리고 있었고
  alternatives_korean:
  - 올라가고 내려오고 있었고
  - 오르고 내려오고 있었고
  lexicon: source_note
  rationale: 반복 동작을 한국어 관용구인 ‘오르내리다’로 응축하되, 진행상을 유지했습니다.
- source_word: ይቀውም፡ ውስቴታ።
  english_pob_choice: God stood upon it / above it
  chosen_korean: 하나님께서 그 위에 서 계셨습니다
  alternatives_korean:
  - 하나님께서 그 위에 서 있었습니다
  - 하나님께서 그 위에 서 계셨습니다
  lexicon: source_note
  rationale: Ge'ez의 ውስቴታ는 ‘그 위에/그 위에서’의 뜻으로 읽히므로, ‘위에 서 계셨다’로 직역 과잉 없이 처리했습니다.
theological_decisions:
- issue: 마지막 구절의 전치사 의미
  chosen_reading: ‘그 위에’로 번역하여 하나님께서 사닥다리 위에 서 계신 장면을 유지했습니다.
  alternative_readings:
  - ‘그 위에’ 대신 ‘그 위에서’
  - ‘그 위에’ 대신 ‘그 위로’
  rationale: English audit trail의 'above it'는 후속 교정에서 'upon it'으로 수정되었고, Ge'ez도 직접적으로는 위치 관계를 말하므로, 본문 이미지를 유지하는 쪽이 더 안전합니다.
  doctrine_reference: source fidelity / textual imagery
