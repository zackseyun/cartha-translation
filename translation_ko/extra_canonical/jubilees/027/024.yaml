- from: 그 밤에 그가 꿈을 꾸었습니다. 보라, 사닥다리가 땅 위에 놓여 있었고 그 꼭대기는 하늘에 닿아 있었습니다. 보라, 하나님의 천사들이 그 위로 오르내리고 있었고, 보라, 하나님께서 그 위에 서 계셨습니다.[a]
  to: 그 밤에 그가 꿈을 꾸었습니다. 보라, 사닥다리가 땅 위에 놓여 있었고 그 꼭대기는 하늘에 닿아 있었습니다. 보라, 하나님의 천사들이 그 사닥다리 위로 오르내리고 있었고, 보라, 하나님께서 그 사닥다리 위에 서 계셨습니다.[a]
