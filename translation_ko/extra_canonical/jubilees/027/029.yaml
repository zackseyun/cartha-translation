  source_fidelity: 게에즈어 본문의 동작 순서(일찍 일어남, 머리맡에 둔 돌을 가져감, 그것을 표징을 위한 기둥으로 세움, 꼭대기에 기름을 부음)와 루스라는 이전 지역명에 대한 설명은 대체로 충실합니다. 다만 ‘기념 표지로 기둥을 세우고’는 ‘기둥’과 ‘표지’의 관계가 다소 불명확하므로, 돌을 표징이 되도록 기둥으로 세웠다는 관계를 더 직접적으로 밝혀야 합니다.
  naturalness: ‘자기 머리맡에 두었던 돌을 가져다가’와 ‘그 꼭대기에 기름을 부었습니다’는 자연스럽고 합쇼체 문체에도 적합합니다. 다만 기둥을 세우는 목적을 ‘표징이 되도록’으로 표현하면 현대 한국어에서 더 명료합니다.
  terminology: 성서 지명으로 널리 정착한 표기는 ‘벧엘’입니다. ‘베델’은 일반 외래어 표기보다 성서 고유명사의 관용 표기를 우선해야 하는 이 문맥에서는 적절하지 않습니다. ‘루스’는 유지할 수 있습니다. 원문의 ‘sign’을 ‘표징’으로 옮겨 기둥의 기능을 보존했습니다.
  issues:
