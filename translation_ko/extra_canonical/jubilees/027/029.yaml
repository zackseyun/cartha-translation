  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: ko
  text: 야곱은 아침 일찍 일어나, 자기 머리맡에 두었던 돌을 가져다가 기념 표지로 기둥을 세우고 그 꼭대기에 기름을 부었습니다. 그는 그곳의 이름을 베델이라 불렀는데, 그 지역의 옛 이름은 루스였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ / took (placed by his head)
  english_pob_choice: took the stone that he had placed by his head
  chosen_korean: 자기 머리맡에 두었던 돌을 가져다가
  alternatives_korean:
  - 자기 머리맡에 놓아 두었던 돌을 취하여
  - 머리맡에 있던 돌을 집어다가
  lexicon: take / place
  rationale: 돌을 ‘가져다가’로 옮겨, 단순한 집기가 아니라 이미 두었던 돌을 다시 취하는 동작을 자연스럽게 드러냈습니다.
- source_word: ሐውልተ ለትእምርት / pillar for a sign
  english_pob_choice: as a pillar for a sign
  chosen_korean: 기념 표지로 기둥을 세우고
  alternatives_korean:
  - 표징이 되는 기둥으로 세우고
  - 표지 기둥으로 세우고
  lexicon: pillar / sign
  rationale: ‘표지’를 유지하되, 기둥 자체가 표지가 되는 기능을 한국어로 간결하게 드러내기 위해 ‘기념 표지로’라고 옮겼습니다.
- source_word: ቅብአ ዲበ ርእሱ / poured oil on its top
  english_pob_choice: he poured oil on its top
  chosen_korean: 그 꼭대기에 기름을 부었습니다
  alternatives_korean:
  - 그 위에 기름을 쏟아 부었습니다
  - 꼭대기에 기름을 부었습니다
  lexicon: pour oil
  rationale: 의식적 도유 행위를 지나치게 장식하지 않고, 본문의 직설적 묘사를 살려 옮겼습니다.
- source_word: ቤቴል / Bethel
  english_pob_choice: Bethel
  chosen_korean: 베델
  alternatives_korean:
  - 벧엘
  - 베이트엘
  lexicon: proper noun
  rationale: 고유명사는 현행 외래어 표기법에 따라 ‘베델’로 옮기되, 성서 지명으로 충분히 식별 가능하게 했습니다.
theological_decisions:
- issue: 장소명 변경의 의미
  chosen_reading: 야곱이 그곳의 이름을 새로 ‘베델’이라 부르며, 이전 지역명 ‘루스’를 대비시킨 것으로 보존했습니다.
  alternative_readings:
  - 단순한 지명 설명으로 약화할 수 있음
  - 전통 교회 용어에 맞춰 지명 의미를 덧붙일 수 있음
  rationale: 본문은 명명 행위를 통해 장소의 신학적 전환을 보여 주므로, 그 구조를 그대로 살려 독자가 새 이름의 의미를 따라가게 했습니다.
  doctrine_reference: 창세기 28장 평행 본문과의 서사적 연관
- issue: 기념 표지의 기능
  chosen_reading: 돌기둥은 단순 장식이 아니라 ‘표지’로 세워진 의례적 기념물로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘기둥’으로만 번역
  - ‘제단’으로 해석
  rationale: 원문은 제단이 아니라 표지 기능을 가진 기둥을 말하므로, 종교적 기능을 과장하지 않으면서도 기념성을 보존했습니다.
  doctrine_reference: 서사적 기념 표지/표석 개념
