  text: And Isaac said to Rebekah, “My sister, do not weep because of Jacob my son, for he will go in peace and return in peace.
translation:
  language: ko
  text: 이삭이 리브가에게 말했습니다. “내 누이여, 내 아들 야곱 때문에 울지 마십시오. 그가 평안히 갈 것이며 평안히 돌아올 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤላ / said to her
  english_pob_choice: And Isaac said to Rebekah
  chosen_korean: “이삭이 리브가에게 말했습니다”
  alternatives_korean:
  - “이삭이 리브가에게 이르렀습니다”
  - “이삭이 리브가에게 말하였습니다”
  lexicon: 말하다
  rationale: 서술체의 평이한 대화 도입으로 자연스럽게 옮기되, 고어체나 과도한 성서투를 피했습니다.
- source_word: እኅትየ / my sister
  english_pob_choice: My sister
  chosen_korean: “내 누이여”
  alternatives_korean:
  - “내 자매여”
  - “내 누이”
  lexicon: 누이
  rationale: 직설적 호칭을 살리면서 한국어 성서 문맥에서 자연스러운 친족 호칭으로 옮겼습니다.
- source_word: ኢትብከዪ / do not weep
  english_pob_choice: do not weep
  chosen_korean: “울지 마십시오”
  alternatives_korean:
  - “울지 마세요”
  - “슬퍼하지 마십시오”
  lexicon: 울다
  rationale: 원문의 직접적인 금지를 그대로 반영해 ‘울다’를 유지했습니다.
- source_word: በሰላም ... ወበሰላም / in peace ... and in peace
  english_pob_choice: he will go in peace and return in peace
  chosen_korean: “평안히 갈 것이며 평안히 돌아올 것입니다”
  alternatives_korean:
  - “평안히 떠나서 평안히 돌아올 것입니다”
  - “평안 가운데 갈 것이며 평안 가운데 돌아올 것입니다”
  lexicon: 평안
  rationale: 반복된 ‘평안’(peace)을 두 번 살려 출발과 귀환 모두에 동일한 보장을 강조했습니다.
theological_decisions:
- issue: 야곱의 여정에 대한 보호 약속의 어조
  chosen_reading: 약속은 단순한 감정 위로가 아니라, 평안한 왕래를 보장하는 선언으로 옮겼습니다.
  alternative_readings:
  - 단순한 위로의 말로만 완화
  - ‘안전하게’로 일반화
  rationale: 원문과 POB 영어는 출발과 귀환 모두에 ‘peace’를 반복하여 붙여, 여정의 온전한 보전을 강조합니다.
  doctrine_reference: 서사적 보호/섭리의 표현
