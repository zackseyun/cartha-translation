translation:
  language: ko
  text: 그리고 네 형제의 분노가 너에게서 돌아서고, 그가 네가 그에게 한 모든 것을 잊을 때까지입니다. 그러면 내가 거기에서 너를 보내어 다시 데려오겠습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወየኀድግ ... መዐተ
  english_pob_choice: and until he turns his anger away from you
  chosen_korean: 그리고 네 형제의 분노가 너에게서 돌아서고
  alternatives_korean:
  - 그리고 네 형제의 분노가 너에게서 떠나고
  - 그리고 네 형제가 너를 향한 분노를 거두고
  lexicon: 감정의 이동/전환 표현
  rationale: 게에즈 본문은 ‘분노’를 주어가 아닌 목적어로 두고 있어, 분노가 ‘떠나다’보다 ‘(너에게서) 돌아서다’로 옮기는 편이 주체-목적 관계를 더 잘 드러냅니다.
- source_word: ወይረስዕ፡ ኵሎ፡ ዘመጠነ፡ ረሰይኮ
  english_pob_choice: and he forgets all that you did to him
  chosen_korean: 그가 네가 그에게 한 모든 것을 잊을 때까지입니다
  alternatives_korean:
  - 그가 네가 그에게 한 모든 일을 다 잊을 때까지입니다
  - 그가 네가 그에게 저지른 모든 것을 잊을 때까지입니다
  lexicon: 기억/망각 동사와 완결된 상대행위
  rationale: 원문은 ‘네가 그에게 한 모든 것’을 전부 잊는다는 뜻이므로, 단순히 ‘행동’을 일반화하지 않고 관계적 상호행위를 그대로 살렸습니다.
- source_word: ወፈነውየ ... እምህየ
  english_pob_choice: Then I will send and bring you back from there.
  chosen_korean: 그러면 내가 거기에서 너를 보내어 다시 데려오겠습니다.
  alternatives_korean:
  - 그러면 내가 거기에서 너를 보내고 다시 데려오겠습니다.
  - 그러면 내가 거기에서 너를 불러내어 데려오겠습니다.
  lexicon: 파견-귀환 동사구
  rationale: 게에즈의 ‘보내다’와 ‘다시 데려오다’를 분리해 옮기되, 결과적으로는 그곳에서의 귀환을 나타내는 흐름을 유지했습니다.
theological_decisions:
- issue: 형제의 분노와 회복 조건의 표현
  chosen_reading: 분노가 가라앉는 것이 아니라 ‘너에게서 돌아서는’ 것으로 번역해 관계적 분리를 강조했습니다.
  alternative_readings:
  - 분노가 사라질 때까지
  - 분노가 너를 떠날 때까지
  rationale: 본문의 문법은 분노를 하나의 대상처럼 다루며, 형제의 내적 상태 변화가 관계 회복의 전제임을 보여 줍니다. 한국어에서도 그 긴장을 보존하는 것이 자연스럽습니다.
  doctrine_reference: 관계 회복, 용서와 화해의 선행 조건
