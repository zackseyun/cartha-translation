  source_fidelity: 첫 절의 게에즈어는 ‘분노’를 동사의 대상으로 두며, 형제(문맥상 에서)가 자신이 품은 분노를 너에게서 거두는 뜻입니다. 따라서 ‘분노가 너에게서 돌아서고’보다 ‘형제가 너를 향한 분노를 거두고’가 주어-목적어 관계를 더 충실히 반영합니다. 마지막 절의 ‘보내고’는 데려올 사람을 보내는 뜻으로 이해하는 것이 자연스럽습니다.
  naturalness: ‘…때까지입니다’는 앞 절에 종속된 문장 조각이라는 본문의 형식을 유지할 수 있으나, ‘네 형제의 분노가 너에게서 돌아서고’는 현대 한국어에서 다소 부자연스럽고 행위 주체가 흐려집니다. ‘사람을 보내어’는 생략된 파견 대상을 한국어 관용에 맞게 보충합니다.
