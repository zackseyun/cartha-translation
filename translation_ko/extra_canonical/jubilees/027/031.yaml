  yaml_path: translation/extra_canonical/jubilees/027/031.yaml
  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: ko
  text: 그리고 제가 평안히 제 아버지의 집으로 돌아가면, 야훼께서 저의 하나님이 되실 것이며, 제가 표징으로 세운 이 돌은 이곳에서 야훼의 집이 될 것입니다. 또 야훼께서 제게 주시는 모든 것에서 십분의 일을 반드시 야훼께 드리겠습니다, 저의 하나님이시여.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 야훼
  alternatives_korean:
  - 주
  - 여호와
  lexicon: YHWH
  rationale: 게으즈 본문은 언약명 YHWH를 가리키며, POB 기본값에 따라 ‘야훼’로 옮겨 신명과 일반적 ‘주’ 용례를 구분했습니다.
- source_word: ቤተ፡ እግዚአብሔር
  english_pob_choice: the house of the Lord
  chosen_korean: 야훼의 집
  alternatives_korean:
  - 주님의 집
  - 하나님의 집
  lexicon: בַּיִת / οἶκος + YHWH
  rationale: 문맥상 돌이 세워진 장소가 YHWH의 소속 공간이 된다는 뜻을 살려, 관용적 교회 용어보다 직접적으로 ‘야훼의 집’으로 표현했습니다.
- source_word: አሡር
  english_pob_choice: a tenth
  chosen_korean: 십분의 일
  alternatives_korean:
  - 십일조
  - 열의 한 몫
  lexicon: עַשְׂרֵה / מעשר 개념
  rationale: 수량적 약속을 그대로 드러내기 위해 본문 의미를 직역해 ‘십분의 일’로 두었고, 제도명으로 굳힌 ‘십일조’는 피했습니다.
- source_word: ሐውልተ፡ ለትእምርት
  english_pob_choice: as a pillar for a sign
  chosen_korean: 기념으로 세운 … 돌
  alternatives_korean:
  - 표징으로 세운 기둥
  - 징표가 되는 기둥
  lexicon: מַצֵּבָה / אוֹת
  rationale: 게으즈 본문의 ‘기둥/표지’ 결합을 한국어에서 자연스럽게 풀어, 세운 돌이 기억과 표지의 기능을 가진다는 점을 살렸습니다.
- source_word: በሰላም
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평화롭게
  - 안전하게
  lexicon: שָׁלוֹם
  rationale: 샬롬의 상태적 의미를 살려, 귀환의 안녕을 나타내는 부사로 ‘평안히’를 선택했습니다.
theological_decisions:
- issue: 서원문의 조건과 보상 구조
  chosen_reading: ‘내가 … 돌아가면’이라는 조건절과 그에 뒤따르는 서원(야훼가 나의 하나님이 되심, 돌의 전환, 십분의 일 헌납)을 그대로 유지했습니다.
  alternative_readings:
  - 조건을 완화해 서술형으로 바꾸는 번역
  - 예배적 고백만 강조하는 번역
  rationale: 본문은 야곱의 서원 형식으로 조건-응답-헌납의 구조가 핵심이므로, 이를 흐리지 않고 한국어에서도 분명하게 드러냈습니다.
  doctrine_reference: 창세기 28장의 서원 전통과 본문 평행 구조
- issue: ‘내가 내 아버지의 집으로’의 귀환 방향
  chosen_reading: ‘내 아버지의 집으로’라는 소유격을 유지해 가정 귀환의 구체성을 보존했습니다.
  alternative_readings:
  - ‘아버지 집으로’처럼 축약
  - ‘고향으로’처럼 일반화
  rationale: 게으즈 원문과 영어 POB 모두 귀환 목적지를 분명히 말하므로, 관계성과 약속의 장소성을 살리는 표현을 택했습니다.
  doctrine_reference: 서원 서사의 서정성과 지리적 구체성
