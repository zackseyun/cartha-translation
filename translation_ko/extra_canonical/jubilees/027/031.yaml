    rationale: 원문과 영어 감사본은 세운 돌이 ‘이곳에서’ 야훼의 집이 될 것이라고 말합니다. 현 번역은 ‘이곳에 기념으로 세운’으로 처리하여 장소 표지가 돌을 세운 행위에만 붙는 것으로 읽힐 수 있습니다.
  - severity: low
    issue: ‘기념’은 ‘표징’의 의미를 다소 약화함
    rationale: ለትእምርት는 표지·징표의 기능을 나타내므로, 본문 어휘의 기능적 의미를 보존하려면 ‘표징’이 더 적절합니다.
  - severity: low
