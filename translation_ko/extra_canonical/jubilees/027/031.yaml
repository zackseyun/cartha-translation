- from: 그리고 내가 평안히 내 아버지의 집으로 돌아가면, 야훼께서 나의 하나님이 되실 것이며, 내가 이곳에 기념으로 세운 이 돌은 야훼의 집이 될 것입니다. 그리고 주께서 내게 주신 모든 것의 십분의 일을 반드시 주께 드리겠습니다, 나의 하나님이시여.[a]
  to: 그리고 제가 평안히 제 아버지의 집으로 돌아가면, 야훼께서 저의 하나님이 되실 것이며, 제가 표징으로 세운 이 돌은 이곳에서 야훼의 집이 될 것입니다. 또 야훼께서 제게 주시는 모든 것에서 십분의 일을 반드시 야훼께 드리겠습니다, 저의 하나님이시여.
  rationale: 원문의 조건-서원 구조를 유지하면서, 표징으로 세운 돌과 ‘이곳에서 야훼의 집이 됨’의 관계를 분명히 했습니다. 불필요한 각주 표지를 제거하고, 신명 표기를 ‘야훼’로 일관시켰습니다.
