  to: 야곱은 제44희년 둘째 주간 첫해에 맹세의 우물에서 나와 하란으로 가려고 했습니다. 그는 그 주간 첫째 달 초하루에 산지에 있는 루스, 곧 벧엘에 도착했습니다. 그리고 저녁에 어떤 곳에 이르러, 그날 밤 자기 길에서 벗어나 길 서쪽으로 비켜갔습니다. 해가 졌으므로 그는 거기서 잠들었습니다.
