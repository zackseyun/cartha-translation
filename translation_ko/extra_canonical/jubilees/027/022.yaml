  - severity: medium
    issue: 출발 동작의 중복 표현
    rationale: ‘맹세의 우물에서 떠나 … 나왔습니다’는 한국어에서 의미가 겹칩니다. ‘나와 하란으로 가려고 했습니다’가 원문의 목적을 자연스럽게 전달합니다.
