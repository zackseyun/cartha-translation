  lexicon: causal clause + perfective time reference
  rationale: 게에즈의 완료 의미를 살려 ‘이미’로 시간적 완료를 분명히 했고, ‘해가 졌기 때문입니다’는 원인의 설명을 직접적으로 전달합니다.
