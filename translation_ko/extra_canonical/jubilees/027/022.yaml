base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
  footnotes:
  - marker: a
    text: Or 'and he turned aside from the road that night'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 제44희년 둘째 주간 첫해에 맹세의 우물에서 나와 하란으로 가려고 했습니다. 그는 그 주간 첫째 달 초하루에 산지에 있는 루스, 곧 벧엘에 도착했습니다. 그리고 저녁에 어떤 곳에 이르러, 그날 밤 자기 길에서 벗어나 길 서쪽으로 비켜갔습니다. 해가 졌으므로 그는 거기서 잠들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወፅአ፡ ... እምዐዘቆተ፡ መሐላ፡
  english_pob_choice: went out from the Well of the Oath
  chosen_korean: 맹세의 우물에서 떠나
  alternatives_korean:
  - 서약의 우물에서 떠나
  - 맹세 우물에서 나와
  lexicon: source phrase with place-name/title equivalent
  rationale: ‘Well of the Oath’는 지명을 설명하는 표현이므로 직역적이되 자연스러운 소유격 구조로 옮겼습니다. ‘맹세’가 독자에게 더 분명하고, ‘떠나’는 출발 동작을 잘 나타냅니다.
- source_word: '*ሉዛ፡ እንተ፡ ውስተ፡ ደብር፡ ... ቤቴል፡'
  english_pob_choice: Luz, which is in the mountains, that is, Bethel
  chosen_korean: 산지에 있는 루스, 곧 벧엘
  alternatives_korean:
  - 산에 있는 루스, 곧 벧엘
  - 산지의 루스, 곧 벧엘
  lexicon: toponym + appositive identification
  rationale: ‘산지에 있는’은 게에즈의 ‘산들 안에/산지에’라는 위치 정보를 현대 한국어로 자연스럽게 반영합니다. ‘곧’은 동일 장소임을 밝히는 설명구를 유지합니다.
- source_word: ወተገኅሠ፡ እምፍኖቱ፡ እንተ፡ ዐረበን፡ ለመንገደ፡
  english_pob_choice: he turned aside from his road to the west of the road
  chosen_korean: 그날 밤 길에서 서쪽으로 비켜났으며
  alternatives_korean:
  - 그날 밤 자기 길에서 서쪽으로 비켜났으며
  - 그날 밤 길에서 서쪽으로 돌아서며
  lexicon: directional verb + idiomatic motion phrase
  rationale: 핵심 의미는 단순한 ‘길을 벗어남’이 아니라 ‘서쪽으로 비켜남’이라는 방향 정보이므로 이를 본문에 반영했습니다. ‘비켜났으며’는 이동의 결과 상태를 자연스럽게 드러냅니다.
- source_word: እስመ፡ ዐረበ፡ ፀሐይ።
  english_pob_choice: because the sun had set
  chosen_korean: 해가 이미 졌기 때문입니다
  alternatives_korean:
  - 해가 졌기 때문입니다
  - 해가 이미 저물었기 때문입니다
  lexicon: causal clause + perfective time reference
  rationale: 게에즈의 완료 의미를 살려 ‘이미’로 시간적 완료를 분명히 했고, ‘해가 졌기 때문입니다’는 원인의 설명을 직접적으로 전달합니다.
theological_decisions:
- issue: 서사문체의 시제와 종결
  chosen_reading: 과거 서술을 현대 한국어 합쇼체로 일관되게 옮겼습니다.
  alternative_readings:
  - 과거형 평서체로 단순화
  - 더 성경적인 문어체로 고정
  rationale: 이 본문은 서사적 사실 진술이므로 현대 표준어 서술체가 원문의 정보 전달을 가장 분명히 보존합니다. 다만 고어체로 높이지 않고도 경건성을 유지하도록 합쇼체를 택했습니다.
  doctrine_reference: 번역 शैली 원칙
