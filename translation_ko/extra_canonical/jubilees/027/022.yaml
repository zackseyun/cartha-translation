    text: Or 'and he turned aside from the road that night'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱은 맹세의 우물에서 떠나 하란으로 가려고 나왔습니다. 그는 이 주간의 첫째 달 초하루에 산지에 있는 루스, 곧 벧엘에 도착했습니다. 그리고 저녁에 어떤 곳에 이르러 그날 밤 길에서 서쪽으로 비켜났으며—해가 이미 졌기 때문입니다—거기서 잠들었습니다.[a]
  philosophy: optimal-equivalence
