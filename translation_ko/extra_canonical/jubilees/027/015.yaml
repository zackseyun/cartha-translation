  - marker: a
    text: Or 'his mother'.
    reason: previous_rendering
translation:
  language: ko
  text: 이스삭이 야곱을 떠나보내고, 그가 메소포타미아로 가서 밧울의 아들인 아람 사람 라반에게, 곧 야곱의 어머니 리브가의 형제에게 갔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወፈነዎ፡ ይስሐቅ፡ ለያዕቆብ፡
  english_pob_choice: And Isaac sent Jacob away
  chosen_korean: 이스삭이 야곱을 떠나보내고
  alternatives_korean:
  - 이스삭이 야곱을 보냈고
  - 이스삭이 야곱을 떠나게 하고
  lexicon: 보내다 / 떠나보내다
  rationale: 문맥상 단순 이동이 아니라 집에서 떠나게 하는 파송의 뉘앙스가 있어 ‘떠나보내다’로 자연스럽게 옮겼습니다.
- source_word: መስጶጦሚያ፡
  english_pob_choice: Mesopotamia
  chosen_korean: 메소포타미아
  alternatives_korean:
  - 메소포타미아 지역
  - 메소포타미아 땅
  lexicon: 고유명사
  rationale: 지명은 현대 외래어 표기법에 따라 음역하고, 본문이 가리키는 지역명 자체를 유지했습니다.
- source_word: ላባ፡³⁶ ወልደ፡ ባቱኤል፡ ሶርያዊ፡
  english_pob_choice: Laban son of Bethuel the Syrian
  chosen_korean: 밧울의 아들인 아람 사람 라반
  alternatives_korean:
  - 밧울의 아들 라반, 아람 사람
  - 밧울의 아들인 시리아 사람 라반
  lexicon: 아람 사람 / 시리아 사람
  rationale: 영어 POB의 ‘the Syrian’은 성경적·지리적 맥락에서 아람 계열을 가리키므로, 한국어에서는 보다 직접적인 ‘아람 사람’이 원문 의미를 잘 드러냅니다.
- source_word: እሙ፡³⁷ ለያዕቆብ።
  english_pob_choice: Jacob's mother
  chosen_korean: 야곱의 어머니 리브가
  alternatives_korean:
  - 그의 어머니 리브가
  - 리브가, 야곱의 어머니
  lexicon: 어머니 / 소유격 구성
  rationale: 게에즈의 소유 구문은 야곱과의 관계를 분명히 하므로, ‘야곱의 어머니’로 옮겨 마지막 관계 표지를 살렸습니다.
theological_decisions:
- issue: ‘the Syrian’의 민족/지리 표지
  chosen_reading: ‘아람 사람’으로 옮겨 족보·정체성 표지를 유지했습니다.
  alternative_readings:
  - ‘시리아 사람’으로 표기
  - 음역만 유지
  rationale: 이 구절은 단순 출신지 설명이 아니라 족보 서술 속 인물 정체성을 표시하므로, 성경 문맥에서 더 직접적인 ‘아람 사람’이 적절합니다.
  doctrine_reference: 성경 지명·민족 표지의 문맥적 등가성
