  rationale: 원문의 사건 순서와 명시된 관계(리브가는 야곱의 어머니이며 라반은 그의 형제)를 보존했습니다. ‘시리아 사람’은 원문의 표지를 그대로 옮겼고, 동격 구성을 다듬어 현대 한국어 합쇼체 문장으로 자연스럽게 만들었습니다.
