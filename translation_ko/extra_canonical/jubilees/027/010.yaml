  text: And if Jacob takes a wife from among the daughters of the land like these, why should I still live? For the daughters of Canaan are evil.”
translation:
  language: ko
  text: «야곱이 이 땅의 딸들 가운데서 이들과 같은 여자를 아내로 맞이한다면, 제가 왜 더 살아야 합니까? 가나안의 딸들은 악하기 때문입니다.»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ ... ብእሲተ
  english_pob_choice: takes a wife
  chosen_korean: 아내로 맞이한다면
  alternatives_korean:
  - 아내를 취한다면
  - 아내를 데려온다면
  lexicon: መንሥአ/취하다 계열
  rationale: 결혼 관계의 형성이라는 뜻을 살리되, 한국어에서 자연스러운 혼인 표현인 ‘아내로 맞이하다’를 사용했습니다.
- source_word: እምውስተ አዋልደ ምድር
  english_pob_choice: from among the daughters of the land
  chosen_korean: 이 땅의 딸들 가운데서
  alternatives_korean:
  - 그 땅의 딸들 가운데서
  - 땅의 딸들 중에서
  lexicon: ‘daughters of the land’
  rationale: 히브리식 관용구를 직역에 가깝게 옮겨, 출신 집단을 가리키는 표현임을 드러냈습니다.
- source_word: እለ ከመ እሉ
  english_pob_choice: like these
  chosen_korean: 이런 여자들 중 하나
  alternatives_korean:
  - 이런 자들처럼
  - 이들과 같은 여자들
  lexicon: 비교구문
  rationale: 문맥상 ‘이러한 종류의 여자들’이라는 비교를 한국어로 분명히 전달하기 위해 풀어 옮겼습니다.
- source_word: እኩያት
  english_pob_choice: evil
  chosen_korean: 악하기
  alternatives_korean:
  - 악합니다
  - 나쁘기
  lexicon: 악함/악성
  rationale: 이 용례는 도덕적 평가를 직접 말하므로 ‘악하다’로 옮겨, 가벼운 ‘나쁘다’보다 강도를 유지했습니다.
theological_decisions:
- issue: 야곱의 발화가 수사적 탄식인지 실제 자기파괴적 질문인지
  chosen_reading: 한국어는 ‘내가 왜 아직 살아야 합니까?’로 옮겨, 히브리식/게에즈식 수사적 비탄을 자연스럽게 살렸습니다.
  alternative_readings:
  - 내가 왜 더 살아야 하겠습니까?
  - 내가 차라리 죽어야 합니까?
  rationale: 원문의 감정적 강도를 보존하되, 독자가 실제 자살 의도보다 절망의 수사로 읽도록 했습니다.
  doctrine_reference: 수사적 질문의 문체 보존
- issue: 가나안의 딸들에 대한 도덕 평가
  chosen_reading: ‘가나안의 딸들은 악하기 때문입니다’로 직역해, 본문이 부정적 윤리 판단을 명시하는 점을 유지했습니다.
  alternative_readings:
  - 가나안의 딸들은 좋지 않기 때문입니다
  - 가나안의 딸들은 부정하기 때문입니다
  rationale: 원문과 POB의 ‘evil’을 약화하지 않도록, 전통적 완곡화 대신 직접적인 윤리 어휘를 선택했습니다.
  doctrine_reference: 도덕적 평가의 직접성
