  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: ko
  text: 전능하신 하나님께서 당신을 복 주시고, 당신을 번성하게 하시며 불어나게 하시고, 당신이 민족들의 회중이 되게 하시기를 바랍니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአምላከ፡ ሰዳይ፡
  english_pob_choice: God Almighty
  chosen_korean: 전능하신 하나님
  alternatives_korean:
  - 전능하신 주 하나님
  - 만군의 하나님
  lexicon: God / divine title
  rationale: Geez 원문과 English POB의 ‘God Almighty’에 맞추어 하나님의 전능하심을 직접 드러내기 위해 ‘전능하신 하나님’으로 옮겼습니다.
- source_word: ይባርከ፡
  english_pob_choice: bless
  chosen_korean: 복 주시고
  alternatives_korean:
  - 축복하시고
  - 은혜를 주시고
  lexicon: bless
  rationale: ‘복 주다’는 축복 행위를 자연스럽게 나타내면서도 본문의 청원형 어조를 유지합니다.
- source_word: ወ³⁰ያልህቀ፡ ወያብዝኀከ፡
  english_pob_choice: make you fruitful, and multiply you
  chosen_korean: 당신을 번성하게 하시며 불어나게 하시고
  alternatives_korean:
  - 열매 맺게 하시며 많게 하시고
  - 열매를 주시고 번성하게 하시고
  lexicon: fruitful / multiply
  rationale: 두 동사는 비슷하지만 중복된 증강 표현이므로 ‘번성하게 하시며 불어나게 하시고’로 나누어 원문의 점층적 강조를 살렸습니다.
- source_word: ወኩን፡ መክብበ፡ አሕዛብ፡
  english_pob_choice: you become an assembly of nations
  chosen_korean: 당신이 민족들의 회중이 되게 하시기를 바랍니다
  alternatives_korean:
  - 당신이 민족들의 모임이 되게 하시기를 바랍니다
  - 당신이 여러 민족의 집회가 되게 하시기를 바랍니다
  lexicon: assembly of nations
  rationale: ‘መክብበ’는 단순한 ‘무리’보다 모인 공동체를 뜻하므로 ‘회중’으로 옮겨, ‘민족들’과 결합된 집합체 이미지를 살렸습니다.
theological_decisions:
- issue: 축복문에서의 청원형 표현
  chosen_reading: ‘~하시기를 바랍니다’로 끝내어 축복 선언이자 청원인 문맥을 살렸습니다.
  alternative_readings:
  - ‘~하게 되시기를 바랍니다’
  - ‘~되기를 바랍니다’
  rationale: 원문과 영어 모두 미래적 축복/기원 형식을 가지므로, 한국어에서도 정중한 소망 표현으로 전달하는 것이 가장 자연스럽습니다.
  doctrine_reference: 서사·축복문 형식의 문법적 수사
- issue: ‘assembly of nations’의 공동체성
  chosen_reading: 민족들이 모인 공동체라는 의미를 살려 ‘민족들의 회중’으로 번역했습니다.
  alternative_readings:
  - ‘민족들의 집회’
  - ‘민족들의 모임’
  rationale: 본절은 단순한 수적 증가가 아니라, 여러 민족이 한 공동체로 형성되는 약속을 가리키므로 공동체성을 드러냈습니다.
  doctrine_reference: 아브라함 언약의 후손/열방 축복 모티프
