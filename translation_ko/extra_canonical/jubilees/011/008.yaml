translation:
  language: ko
  text: 그들이 그것들을 숭배하고 찬양하게 하려는 것이었습니다. "잠잠하라, 내 아들아. 그들이 너를 죽일까 하노라." 그리고 그는 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያምልክዎሙ / ይስብሕዎሙ
  english_pob_choice: that they may worship them and praise them
  chosen_korean: 그들이 그것들을 숭배하고 찬양하게 하려는 것이었습니다
  alternatives_korean:
  - 그들이 그것들을 예배하고 찬양하게 하려는 것이었습니다
  - 그들이 그것들에게 경배하고 찬양하게 하려는 것이었습니다
  lexicon: worship / praise
  rationale: Ge'ez의 3인칭 복수 주어를 반영하여 ‘그들이’로 옮기고, 우상 대상의 종교적 행위를 ‘숭배’와 ‘찬양’으로 나누어 원문의 병렬성을 살렸습니다.
- source_word: አርምም
  english_pob_choice: Be silent
  chosen_korean: 잠잠하라
  alternatives_korean:
  - 조용히 하라
  - 침묵하라
  lexicon: be silent
  rationale: 짧고 경고적인 명령의 힘을 살리기 위해 한국어 성서문체에서 자연스러운 ‘잠잠하라’를 택했습니다.
- source_word: ወልድየ
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: my son
  rationale: 호칭의 직접성을 살리면서도 한국어 경고문 맥락에 맞게 vocative ‘-아’를 붙였습니다.
- source_word: ከመ፡ አይቅትሉከ
  english_pob_choice: lest they kill you
  chosen_korean: 그들이 너를 죽일까 하노라
  alternatives_korean:
  - 그들이 너를 죽일까 두렵다
  - 그들이 너를 죽이지 않도록
  lexicon: lest they kill you
  rationale: 위협의 결과를 나타내는 목적/경계 구조를 한국어의 ‘-까 하노라’로 옮겨, 경고의 긴박감을 유지했습니다.
theological_decisions:
- issue: 우상숭배 행위의 표현 강도
  chosen_reading: ‘숭배’와 ‘찬양’으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘예배’와 ‘찬양’으로 완화할 수 있음
  - ‘경배’로 통일할 수 있음
  rationale: 본문은 단순한 존중이 아니라 신적 대상에 대한 종교적 행위를 말하므로, 한국 교회어의 익숙함보다 원문의 강도를 우선했습니다.
  doctrine_reference: 우상숭배 금지(출 20:3-5의 일반 원리)와 관련된 서술적 경고
