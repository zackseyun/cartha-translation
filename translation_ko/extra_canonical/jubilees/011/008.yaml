  text: 그들이 그것들을 숭배하고 찬양하게 하려는 것이었습니다.[a] “조용히 하십시오, 내 아들아. 그들이 너를 죽일까 염려됩니다.” 그리고 그는 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
