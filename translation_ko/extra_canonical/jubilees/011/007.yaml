  text: And if I tell them the truth, they will kill me, for their souls are attached to them.
translation:
  language: ko
  text: 그리고 내가 그들에게 진실을 말하면, 그들은 나를 죽일 것입니다. 그들의 영혼이 그들에게 달려 있기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  english_pob_choice: the truth
  chosen_korean: 진실
  alternatives_korean:
  - 진리
  - 참말
  lexicon: Geez ጽድቀ
  rationale: 문맥상 ‘옳은 것/참된 것’을 뜻하는 말로, 한국어에서는 간결하고 자연스러운 ‘진실’이 가장 잘 대응합니다.
- source_word: ይቀትሉኒ
  english_pob_choice: they will kill me
  chosen_korean: 그들은 나를 죽일 것입니다
  alternatives_korean:
  - 그들이 나를 죽이겠습니다
  - 그들이 나를 살해할 것입니다
  lexicon: Geez ቀተለ
  rationale: 직역의 강도를 살리되 현대 합쇼체에 맞게 평이한 ‘죽일 것입니다’로 옮겼습니다.
- source_word: ተለውት
  english_pob_choice: are attached
  chosen_korean: 달려 있기
  alternatives_korean:
  - 매여 있기
  - 붙어 있기
  - 연결되어 있기
  lexicon: Geez ተለወተ
  rationale: 영혼이 어떤 대상에 강하게 붙어 있는 상태를 자연스럽게 나타내기 위해 ‘달려 있다’는 관용적 표현을 선택했습니다.
- source_word: ነፍሶሙ ኀቤሆሙ
  english_pob_choice: their souls ... to them
  chosen_korean: 그들의 영혼이 그들에게
  alternatives_korean:
  - 그들의 혼이 그들에게
  - 그들의 생명이 그들에게
  lexicon: Geez ነፍስ
  rationale: 여기서는 육체적 생명보다 내적 존재/영혼의 지향을 가리키므로 ‘영혼’을 유지했습니다.
theological_decisions:
- issue: ‘their souls are attached to them’의 문장 의미
  chosen_reading: 대상에 대한 강한 애착 또는 결속을 뜻하는 비교적 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 그들이 그것들을 숭배한다
  - 그들의 마음이 그것들에 사로잡혀 있다
  rationale: 최신 POB 개정이 해석적 확장인 ‘숭배한다’를 हट하고 더 문자적인 표현으로 수정했으므로, 한국어도 그 긴장을 보존했습니다.
  doctrine_reference: 본문 주해/번역학적 판단
- issue: ‘진실’과 ‘죽일 것입니다’의 대비
  chosen_reading: 진실을 말하는 것과 그에 대한 살해 위협을 직접 병렬로 제시했습니다.
  alternative_readings:
  - 진리를 말하면
  - 정직하게 말하면
  rationale: 원문은 조건절과 결과절의 긴장을 분명히 드러내므로, 완곡하게 누그러뜨리지 않고 직접적으로 번역했습니다.
  doctrine_reference: 서사적 직설성 유지
