  verdict: revise
  source_fidelity: 원문의 조건문과 결과절, 그리고 마지막 절의 ‘그들의 영혼이 그것들에 붙들려 있음’이라는 결속의 의미를 유지했습니다. 다만 현 번역의 ‘그들의 영혼이 그들에게 달려’는 동일한 사람들 자신에게 영혼이 의존한다는 뜻으로 읽히기 쉬워, 원문의 대명사가 가리키는 앞선 대상과의 결속을 충분히 드러내지 못합니다.
  naturalness: ‘영혼이 그들에게 달려 있다’는 한국어에서 지시 대상이 혼동되고 ‘의존하다’의 뜻으로도 자연스럽게 읽힙니다. ‘영혼이 그것들에 매여 있다’는 애착·결박의 의미를 자연스러운 현대 합쇼체로 전달합니다.
  terminology: ‘진실’, ‘영혼’, ‘죽일 것입니다’는 영어 POB의 선택 및 원문의 직설적 문체와 대체로 잘 맞습니다. 마지막 대상은 본문 문맥상 앞서 언급된 물건들을 가리키므로 ‘그것들’로 명시하되, 숭배라는 해석적 확장을 추가하지 않았습니다.
  issues:
