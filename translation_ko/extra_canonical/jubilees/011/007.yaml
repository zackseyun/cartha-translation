  to: 그리고 내가 그들에게 진실을 말하면, 그들은 나를 죽일 것입니다. 그들의 영혼이 그것들에 매여 있기 때문입니다.
  rationale: 마지막 절의 지시 대상을 한국어에서 혼동 없이 나타내고, ‘attached’의 결속 의미를 ‘매여 있다’로 옮겼습니다. ‘그것들’이 무엇인지는 문맥에 맡기며, ‘숭배하다’와 같은 해석적 보충은 하지 않았습니다. 대응하지 않는 각주 표지도 삭제했습니다.
