    rationale: 원문과 영어 감사 이력의 ‘their souls are attached to them’은 영혼이 앞서 언급된 대상들에 결속되어 있다는 뜻을 보존합니다. 한국어에서는 사람 지시 대명사를 반복하면 ‘그들 자신에게 달려 있다’로 이해되기 쉽습니다.
