  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
  footnotes:
  - marker: '1'
    text: The Ge'ez text reads 'thirty-fifth' (or a corrupted form thereof), corrected here from the previous draft's 'seventy-fifth' to align with the internal chronological sequence of Jubilees.
    reason: textual_correction
translation:
  language: ko
  text: 서른다섯 번째 희년, 셋째 주의 첫해에 르우가 아내를 맞이하였는데, 그녀의 이름은 오라였으며 우르의 딸, 케세드의 아들이었습니다. 그녀가 그에게 아들을 낳아 주자, 그는 그의 이름을 세로흐라 하였고, 그것은 이 희년의 이 주의 일곱째 해였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበ*ሰባሳ፡ ወኃምስቱ፡ እዮቤልው፡
  english_pob_choice: In the thirty-fifth jubilee
  chosen_korean: 서른다섯 번째 희년
  alternatives_korean:
  - 서른다섯째 희년
  - 삼십오 번째 희년
  lexicon: 희년
  rationale: 게에즈 본문과 영어 POB의 정정된 수치를 따라 ‘thirty-fifth jubilee’를 반영했고, 한국어에서는 자연스러운 서수 표현으로 옮겼습니다.
- source_word: በሱባዔ፡ ሣልስ፡
  english_pob_choice: in the third week
  chosen_korean: 셋째 주
  alternatives_korean:
  - 세 번째 주
  - 세 주
  lexicon: 주
  rationale: 영어 POB가 ‘of years’를 덜어낸 주기 표현을 따르므로, 율리희 문맥의 연대 단위인 ‘주’를 간결하게 살렸습니다.
- source_word: ነሥአ፡ ሎቱ፡ ራግው፡ ብእሲተ፡
  english_pob_choice: Reu took for himself a wife
  chosen_korean: 르우가 아내를 맞이하였는데
  alternatives_korean:
  - 르우가 아내를 얻었는데
  - 르우가 자신을 위하여 아내를 취하였는데
  lexicon: 아내를 맞이하다
  rationale: 직역의 ‘취하다’는 한국어에서 다소 딱딱하므로, 결혼 성립을 드러내면서도 원문의 행위성을 보존하는 표현을 택했습니다.
- source_word: ጸውዐ፡ ስሞ፡ ሴሮኅ፡
  english_pob_choice: he called his name Seroh
  chosen_korean: 그는 그의 이름을 세로흐라 하였고
  alternatives_korean:
  - 그 이름을 세로흐라 불렀고
  - 그의 이름을 세로흐라 지었고
  lexicon: 이름을 부르다
  rationale: 셈어식 명명 공식을 한국어의 ‘이름을 …라 하다’로 옮겨, 단순한 호칭이 아니라 명명 행위를 드러냈습니다.
theological_decisions:
- issue: 성경 외전/희년서의 연대기 표현 처리
  chosen_reading: 희년과 주(week)를 시간 단위로 있는 그대로 옮기되, 설명을 덧붙이지 않았습니다.
  alternative_readings:
  - 현대 달력식으로 풀어 설명하기
  - ‘세대’나 ‘기간’으로 일반화하기
  rationale: 본문은 신학적 논변보다 연대 기록을 제공하므로, 독자가 희년서 고유의 계산법을 접하도록 원문 구조를 보존하는 편이 더 충실합니다.
  doctrine_reference: 본문-기록체 보존 원칙
