  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
  footnotes:
  - marker: '9'
    text: The phrase 'the daughter of his father' is left as transmitted in the supplied text rather than harmonized to Genesis. It may reflect a textual problem or a different kinship expression in this tradition.
    reason: textual_variant
  - marker: a
    text: Or 'he kept silent'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 이 일을 자기의 두 형제에게 말하였고, 그들은 그에게 분노하였으며 잠잠하였습니다. 그리고 마흔째 희년의 둘째 주, 그 주의 일곱째 해에 아브람은 아내를 맞이하였습니다. 그녀의 이름은 사래였으며, 그녀는 그의 아내가 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘንተ፡ ነገረ፡
  english_pob_choice: this matter
  chosen_korean: 이 일
  alternatives_korean:
  - 이 문제
  - 이 이야기
  - 이 사건
  lexicon: source_note
  rationale: Ge'ez ነገረ는 여기서 구체적 ‘사건’이라기보다 ‘말해진 일/일’에 가깝기 때문에, 간결하고 자연스러운 ‘이 일’로 옮겼습니다.
- source_word: ለክልኤ፡ አሐዊሁ፡
  english_pob_choice: to his two brothers
  chosen_korean: 자기 두 형제에게
  alternatives_korean:
  - 그의 두 형제에게
  - 두 형제에게
  lexicon: source_note
  rationale: 관계 표지를 살려 ‘자기 두 형제에게’로 옮겨 소유 관계를 분명히 했습니다.
- source_word: ወተምዑ፡ ላዕሌሁ፡
  english_pob_choice: they were angry with him
  chosen_korean: 그들은 그에게 분노하였으며
  alternatives_korean:
  - 그들은 그에게 화를 냈으며
  - 그들은 그를 노하여
  lexicon: source_note
  rationale: 원문의 분노 동사를 직접 반영해 감정을 약화하지 않고 ‘분노하였으며’로 옮겼습니다.
- source_word: ወአርመሙ፡
  english_pob_choice: they kept silent
  chosen_korean: 그들은 잠잠하였습니다
  alternatives_korean:
  - 그들은 침묵하였습니다
  - 그들은 말이 없었습니다
  lexicon: source_note
  rationale: 복수 동사로서 ‘그들’이 침묵한 점을 반영했고, 한국어에서는 자연스럽고 절제된 ‘잠잠하였습니다’를 선택했습니다.
- source_word: ነሥአ፡ ሎቱ፡ አብራም፡ ብእሲተ፡
  english_pob_choice: Abram took for himself a wife
  chosen_korean: 아브람은 자기에게 아내를 맞이하였는데
  alternatives_korean:
  - 아브람은 아내를 취하였는데
  - 아브람은 아내를 맞이하였는데
  lexicon: source_note
  rationale: ‘취하다’보다 혼인 맥락이 드러나는 ‘아내를 맞이하다’를 택하되, ሎቱ의 재귀성을 살려 ‘자기에게’로 보완했습니다.
theological_decisions:
- issue: ‘희년’ 연대 표현의 직역 여부
  chosen_reading: ‘마흔 번째 희년의 둘째 주, 그 일곱째 해’로 직역했습니다.
  alternative_readings:
  - 의미를 풀어 ‘제40희년 제2주 제7년’으로 정리
  - 연대 표현을 완화해 자연스럽게 재구성
  rationale: 주어진 전승의 연대 체계를 보존하는 것이 본문의 역사 서술 방식과 일치하므로, 해설 없이 그대로 옮겼습니다.
  doctrine_reference: 본문 연대 전승 보존
- issue: ‘그녀는 그의 아내가 되었습니다’의 상태 진술
  chosen_reading: 상태 변화와 혼인 성립을 드러내는 직역형을 유지했습니다.
  alternative_readings:
  - ‘그는 그녀와 결혼하였습니다’
  - ‘그녀가 그의 아내가 되었습니다’
  rationale: 원문은 결과 상태를 분명히 하므로, 혼인 행위와 상태 성립을 함께 보이도록 옮겼습니다.
  doctrine_reference: 서술문 의미 보존
