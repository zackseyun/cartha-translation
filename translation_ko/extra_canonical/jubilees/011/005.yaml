  revised_text: 제삼십오 희년, 제삼 주간 첫째 해에 르우는 케셋의 아들 우르의 딸 오라를 아내로 맞이하였습니다. 오라는 그 희년의 그 주간 일곱째 해에 그에게 아들을 낳아 주었고, 그는 그의 이름을 세로흐라 하였습니다.
