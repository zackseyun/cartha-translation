    issue: 현 번역은 제시된 게에즈 원문과 전혀 다른 마스테마 관련 문장을 번역합니다.
    rationale: 원문은 제35희년 제3주간 첫째 해의 혼인과 그 주간 일곱째 해의 세로흐 출생을 기록합니다. 마스테마, 하위 영들, 죄악, 피 흘림은 이 원문에 없습니다.
