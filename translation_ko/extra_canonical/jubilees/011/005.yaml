  terminology: 인명은 원문의 형태를 따라 르우, 오라, 우르, 케셋, 세로흐로 옮겼습니다. 세로흐는 통상 성서 계보의 ‘스룩’과 다른 전승상의 표기일 수 있으므로 원문 표기를 보존했습니다.
  issues:
