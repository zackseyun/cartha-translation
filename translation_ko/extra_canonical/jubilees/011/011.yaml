lexical_decisions:
- source_word: ስሞ፡ ሎጥ።
  english_pob_choice: his name was Lot.
  chosen_korean: 그의 이름은 롯이었습니다.
  alternatives_korean:
  - 그 이름은 롯이었습니다.
  - 롯이라는 이름이었습니다.
  lexicon: proper noun / naming clause
  rationale: Geez의 이름표현을 자연스러운 서술문으로 옮기되, 단순한 존재 진술로 처리해 원문의 이름 지정 기능을 유지했습니다.
- source_word: ወናኮር፡ እኁሁ፡ ነሥአ፡ ሎቱ፡ ብእሲተ።
  english_pob_choice: And Nahor his brother took for himself a wife.
  chosen_korean: 그리고 그의 형제 나홀이 자신을 위해 아내를 맞이하였습니다.
  alternatives_korean:
  - 그리고 그의 형제 나홀이 아내를 얻었습니다.
  - 그리고 그의 형제 나홀이 아내를 취했습니다.
  lexicon: took for himself a wife
  rationale: ‘자신을 위해’는 수동적으로가 아니라 나홀이 직접 결혼 상대를 취한 행위를 드러내며, 에둘러 말하기보다 원문의 동사를 비교적 직접적으로 반영합니다.
- source_word: ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ፡
  english_pob_choice: And in the sixtieth year of his life,
  chosen_korean: 그리고 그의 삶의 육십 년에,
  alternatives_korean:
  - 그리고 그의 생애 육십 년에,
  - 그리고 그의 인생 육십 년에,
  lexicon: year of his life
  rationale: 원문은 특정 인물명(아브람 등)을 포함하지 않고 단지 ‘그의 삶/생애의 육십 년’이라고 하므로, POB 수정본을 따라 그 범위를 그대로 살렸습니다.
theological_decisions:
- issue: Final temporal phrase lacks an explicit subject in the source.
  chosen_reading: ‘그리고 그의 삶의 육십 년에’로 끝내어, 이어질 사건을 예고하는 절로 유지했습니다.
  alternative_readings:
  - ‘그리고 그의 삶의 육십 년이 되었습니다.’
  - ‘그리고 그의 삶의 육십 년이 되던 때에,’
  rationale: 게으즈 원문은 완결된 사건 서술보다 다음 문맥으로 이어지는 시간표지에 가깝기 때문에, 한국어도 종결을 늦춰 원문의 연결성을 보존했습니다.
  doctrine_reference: source-literary fidelity
