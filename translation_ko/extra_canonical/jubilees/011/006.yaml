    reason: previous_rendering
translation:
  language: ko
  text: 그것들을 만드는 자들에게는, 또 그것들을 숭배하는 자들에게는 마음의 미혹이 있습니다[a]. “그것들을 숭배하지 마십시오.” 그러자 그의 아버지가 그에게 말했습니다. “나도 알고 있습니다, 아들아. 그러나 나를 그들에게 복종하게 만든 이 백성을 위해 내가 무엇을 할 수 있겠습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것들을 숭배하는 자들에게는 마음의 미혹이 있습니다’로 옮긴 구절은 제시된 게에즈어 본문에서 문법과 의미가 난해합니다. 직역하면 ‘그것들을 만드는 자들에게, 그리고 그것들을 숭배하는 자들에게 마음의 빗나감’입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብርዎሙ
  english_pob_choice: those who make them
  chosen_korean: 그것들을 만드는 자들
  alternatives_korean:
  - 그것들을 만드는 사람들
  - 그것들을 만드는 이들
  lexicon: Geez ይገብር ‘make, do’
  rationale: 우상 자체를 ‘만드는 자들’로 직접 옮겨 행위 주체를 분명히 했습니다.
- source_word: ወከሕተት፡ ልብ፡
  english_pob_choice: a straying of heart
  chosen_korean: 마음이 미혹됩니다
  alternatives_korean:
  - 마음의 빗나감
  - 마음의 길 잃음
  lexicon: Geez ልብ ‘heart’
  rationale: 게에즈 구문이 어색하고 의미상 난점이 있어, 마음이 잘못 이끌리는 상태를 간결하게 한국어로 자연화했습니다.
- source_word: ያመልክዎሙ
  english_pob_choice: those who worship them
  chosen_korean: 그것들을 숭배하는 자들
  alternatives_korean:
  - 그것들을 경배하는 자들
  - 그것들에게 예배하는 자들
  lexicon: Geez ያመልክ ‘worship’
  rationale: 문맥상 단순한 존중이 아니라 우상에 대한 종교적 숭배이므로 ‘숭배하다’로 옮겼습니다.
- source_word: እትአዘዝ
  english_pob_choice: made me subject to them
  chosen_korean: 나를 그들에게 복종하게 만든
  alternatives_korean:
  - 나를 그들에게 종속하게 만든
  - 나를 그들 아래에 두게 만든
  lexicon: Geez ተአዘዘ ‘obey, be subject to’
  rationale: 기존 오독처럼 ‘틀리다/죄짓다’가 아니라 ‘복종하다, 종속되다’의 의미를 따라, 주체가 자신이 아니라 백성이라는 점을 살렸습니다.
theological_decisions:
- issue: 우상 숭배 금지 발화의 직접성
  chosen_reading: '"그것들을 숭배하지 마십시오."'
  alternative_readings:
  - '"그것들을 섬기지 마십시오."'
  - '"그것들에게 절하지 마십시오."'
  rationale: 본문의 핵심 금지 행위는 단순한 공손한 대우가 아니라 종교적 숭배이므로, 독자에게 경고의 강도를 유지하는 표현을 택했습니다.
  doctrine_reference: 우상 숭배 금지의 일반적 성서 윤리
