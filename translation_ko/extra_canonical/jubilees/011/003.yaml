  text: 스룩의 날에 전쟁이 일어났습니다. 모든 사람들이 새긴 우상과 조각한 우상과 부정한 것들을 만들기 시작했고, 악한 영들이 그들을 도우며 미혹하여 범법과 부정을 행하게 했습니다.
