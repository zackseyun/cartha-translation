- from: 스룩의 날에 전쟁이 나니 모든 사람의 아들들이 돌이켜 조각한 신상과 조각한 신상과 부정한 것을 만들매 악귀들이 그들을 도와 미혹하여 범법과 더러움을 행하게 하였느니라.
  to: 스룩의 날에 전쟁이 일어났습니다. 모든 사람들이 새긴 우상과 조각한 우상과 부정한 것들을 만들기 시작했고, 악한 영들이 그들을 도우며 미혹하여 범법과 부정을 행하게 했습니다.
  rationale: 영어 POB 감사본의 의미를 보존하면서, 두 종류의 우상 표현을 구별하고 uncleanness를 ‘부정’으로 옮겼습니다. 또한 부자연스러운 직역과 고전체 종결을 현대 표준어 합쇼체로 고쳤습니다. 영어판의 Seroh 이문 각주는 현 한국어 본문이 통상 표기인 ‘스룩’을 사용하므로 별도 각주가 필요하지 않습니다.
