  lexicon: source_note
  rationale: 게에즈 구문이 관계절이나 시간절보다 ‘아버지 데라 앞에/면전에서’라는 상태를 가리키므로, 한국어도 사건 서술보다 앞선 위치·상태를 간결히 드러냈습니다.
