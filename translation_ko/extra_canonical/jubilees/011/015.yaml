  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: ko
  text: 그의 아버지 데라보다 앞서. 그들은 그를 갈대아 우르에 장사했습니다. 데라는 아들들과 함께 레바논 땅과 가나안 땅으로 가기 위해 갈대아 우르에서 나왔습니다. 그는 하란 땅에 정착했고, 아브람은 하란에서 그의 아버지 데라와 함께 살았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ ታራ፡ አቡሁ፡
  english_pob_choice: before Terah his father
  chosen_korean: 아버지 데라 앞에 있었습니다
  alternatives_korean:
  - 데라 아버지 앞에서
  - 데라보다 앞서
  lexicon: source_note
  rationale: 게에즈 구문이 관계절이나 시간절보다 ‘아버지 데라 앞에/면전에서’라는 상태를 가리키므로, 한국어도 사건 서술보다 앞선 위치·상태를 간결히 드러냈습니다.
- source_word: ወቀበርዎ፡
  english_pob_choice: And they buried him
  chosen_korean: 그들은 그를 장사했습니다
  alternatives_korean:
  - 그를 묻었습니다
  - 그를 매장했습니다
  lexicon: source_note
  rationale: 장사하다는 죽은 이를 묻는 서술을 자연스럽게 옮기며, 서술체의 중립성을 유지합니다.
- source_word: ኡር፡ ዘከለዳዊያን።
  english_pob_choice: Ur of the Chaldeans
  chosen_korean: 갈대아 우르
  alternatives_korean:
  - 갈대아인의 우르
  - 우르, 갈대아 사람들의 땅
  lexicon: source_note
  rationale: 지명 관용형을 따르되, 소유격을 풀어 한국어 지명 구성으로 자연화했습니다.
- source_word: ከመ፡ ይምጽኡ፡
  english_pob_choice: to go into
  chosen_korean: 가려고 했으나
  alternatives_korean:
  - 들어가려고
  - 가도록
  lexicon: source_note
  rationale: 뒤의 하란 정착과 연결되는 이동 의도를 한국어로 분명히 하되, 실제 도착/진입이 아니라 의도를 나타내도록 처리했습니다.
- source_word: ምድረ፡ ሊባኖስ፡ ወውስተ፡ ምድረ፡ ከናአን፡
  english_pob_choice: the land of Lebanon and into the land of Canaan
  chosen_korean: 레바논 땅과 가나안 땅
  alternatives_korean:
  - 레바논 땅과 가나안으로
  - 레바논과 가나안 땅
  lexicon: source_note
  rationale: 두 목적지를 병렬로 보존하면서, 전치사의 중복을 한국어에서 과도하게 반복하지 않도록 정리했습니다.
theological_decisions:
- issue: 이 구절은 족보·이동 서술로서 신학적 해석을 덧붙이지 않고 지리·가계 정보만 전달해야 합니다.
  chosen_reading: 본문의 행위 순서와 정착지를 그대로 옮겨 서사 정보를 보존했습니다.
  alternative_readings:
  - 아브라함 중심의 서사로 재구성
  - 데라의 이동을 더 해설적으로 풀어씀
  rationale: 이 장은 사건의 연속을 기록하는 문맥이므로, 해석적 요약이나 신학적 강조를 추가하면 원문의 정보량을 넘게 됩니다.
  doctrine_reference: source-plain-sense
