translation:
  language: ko
  text: 그들을 구하려고 했습니다. 그리고 그의 위에 불이 붙었고, 그는 그 불에 타고 갈대아 사람들의 우르에서 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያድኅኖሙ
  english_pob_choice: to save them
  chosen_korean: 그들을 구하려고 했습니다
  alternatives_korean:
  - 그들을 구원하려고 했습니다
  - 그들을 살리려고 했습니다
  lexicon: ያድኅነ-
  rationale: 원문의 목적 의미를 살려 ‘구하다’로 옮기되, 서술 흐름에 맞게 과거 시제의 의도 표현으로 처리했습니다.
- source_word: ወነደደ እሳት ላዕሌሁ
  english_pob_choice: fire was kindled over him
  chosen_korean: 그 위에 불이 붙었고
  alternatives_korean:
  - 그 위에 불이 타올랐고
  - 그 위에 불이 일어났고
  lexicon: ነደደ / እሳት
  rationale: ‘불이 붙다’는 원문의 수동적 발생과 POB의 ‘kindled’에 가장 가깝고, ‘위에’는 ላዕሌሁ의 공간적 관계를 반영합니다.
- source_word: ወውዐየ በእሳት
  english_pob_choice: and he was burned in the fire
  chosen_korean: 그 불 속에서 타 죽었으며
  alternatives_korean:
  - 그 불에 타 버렸으며
  - 그 불 속에서 불타 버렸으며
  lexicon: ወውዐየ / በእሳት
  rationale: ‘타 죽다’는 단순 소멸보다 치명적 결과를 분명히 드러내며, 전치사구는 ‘불 속에서’로 자연스럽게 옮겼습니다.
- source_word: ወሞተ በኡር ዘከለዳዊያን
  english_pob_choice: and he died in Ur of the Chaldeans
  chosen_korean: 갈대아인의 우르에서 죽었습니다
  alternatives_korean:
  - 갈대아인의 우르에서 죽었으며
  - 갈대아 사람들의 우르에서 죽었습니다
  lexicon: Ur of the Chaldeans
  rationale: 지명은 통용되는 성서 지명 ‘우르’로 두고, 속격 관계는 ‘갈대아인의’로 직역해 원문 구조를 보존했습니다.
