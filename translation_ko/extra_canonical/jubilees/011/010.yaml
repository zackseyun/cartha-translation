  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
  footnotes:
  - marker: a
    text: Or 'and he called'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 형제 아란은 셋째 주의 셋째 해에 아내를 맞이하였고, 이 주의 일곱째 해에 그 여자가 그에게 아들을 낳았으며, 그는 그 아들의 이름을 우르라고 지었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그는 불렀습니다.”
    reason: 영어 POB 감사 기록의 각주(“Or ‘and he called’”)를 한국어로 유지합니다. 현 구절은 인접 본문에서 보충된 목적어를 따라 명명 행위로 완결하여 번역했습니다.
lexical_decisions:
- source_word: ነሥአ ሎቱ ብእሲተ
  english_pob_choice: took for himself a wife
  chosen_korean: 자기에게 아내를 맞이하였고
  alternatives_korean:
  - 아내를 얻었고
  - 자기에게 아내를 데려왔고
  lexicon: 동사 + 목적어구
  rationale: 관계 형성의 결과를 자연스럽게 나타내되, 단순한 ‘취하다’보다 혼인 시작을 드러내는 표현으로 옮겼습니다.
- source_word: በዓመት ሣልስ ዘሱባዔ ሣልስ
  english_pob_choice: in the third year of the third week
  chosen_korean: 셋째 주의 셋째 해에
  alternatives_korean:
  - 세 번째 주의 세 번째 해에
  - 제3주의 제3년에
  lexicon: 시간 표현
  rationale: 주(week)와 해(year)의 중첩 구조를 그대로 보존하여 희년서 특유의 연대 표기를 드러냈습니다.
- source_word: በዓመት ሳብዕ ዘሱባዔ ዝንቱ
  english_pob_choice: in the seventh year of this week
  chosen_korean: 이 주의 일곱째 해에
  alternatives_korean:
  - 이 주의 제7년에
  - 그 주의 일곱째 해에
  lexicon: 시간 표현
  rationale: 지시어 ‘this week’를 ‘이 주’로 살려 앞선 시간 단위를 이어 주었습니다.
- source_word: ወጸውዐ
  english_pob_choice: he called his name Ur
  chosen_korean: 그가 그의 이름을 우르라고 불렀습니다
  alternatives_korean:
  - 그가 이름을 우르라고 불렀습니다
  - 그가 그의 이름을 우르라 하였습니다
  lexicon: 호칭 동사
  rationale: 영문 보정본의 완결된 독법을 반영해 목적어 ‘그의 이름’을 보충하되, 본문이 가리키는 명명 행위를 분명히 했습니다.
theological_decisions:
- issue: 가계 서술의 평서체와 인명 표기
  chosen_reading: 서술문을 중립적 역사 서술로 유지하고, 고유명사 Aran/Ur는 각각 아란/우르로 음역했습니다.
  alternative_readings:
  - 아란을 아론과 혼동될 수 있게 표기
  - 우르를 고유명사 대신 지명식으로 처리
  rationale: 본문은 족보·연대 서술이므로 신학적 해석을 덧씌우지 않고, 고유명사는 현대 표기 관행에 맞게 옮겼습니다.
  doctrine_reference: 서사·족보 본문 번역 원칙
