  yaml_path: translation/extra_canonical/jubilees/011/012.yaml
  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
  footnotes:
  - marker: a
    text: Or 'that is, the fourth week,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 넷째 주의 넷째 해에[a] 아브람이 밤에 일어나 우상들의 집을 불태우고, 그 집 안에 있는 모든 것을 불태웠으며, 아무도 그것을 알지 못했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “곧 넷째 주에”라고 옮길 수 있습니다.
    reason: 영어 POB 감사 기록에 있는 시간 표현 관련 각주를 한국어로 옮기고, 표지를 해당 시간 부사구에 배치했습니다.
lexical_decisions:
- source_word: ውእቱ፡ ሱባዔ፡ ራብዕ፡ በዓመት፡ ራብዕ፡
  english_pob_choice: In that fourth week, in its fourth year
  chosen_korean: 그 넷째 주, 그 넷째 해에
  alternatives_korean:
  - 그 넷째 주에, 그 넷째 해에
  - 그 넷째 주, 곧 넷째 해에
  lexicon: week/period phrase; temporal adverbial
  rationale: 게즈어의 시간 표현을 자연스러운 한국어 시간 부사구로 옮기되, POB가 유지한 주기적 구조(넷째 주/넷째 해)를 그대로 살렸습니다.
- source_word: ቤተ፡ ጣዖታት፡
  english_pob_choice: the house of idols
  chosen_korean: 우상들의 집
  alternatives_korean:
  - 우상의 집
  - 우상 신상들의 집
  lexicon: house; idols
  rationale: ‘בית’의 단순한 소유격보다 복수 ‘우상들’이 문맥상 더 분명하여, 우상 숭배 공간임을 직관적으로 드러내는 표현으로 옮겼습니다.
- source_word: ወአውዐየ፡ ኵሎ፡ በውስተ፡ ቤት፡
  english_pob_choice: and he burned everything that was in the house
  chosen_korean: 그 집 안에 있는 모든 것을 불태웠으며
  alternatives_korean:
  - 그 집 안의 모든 것을 불태웠으며
  - 집 안에 있는 모든 것을 태웠으며
  lexicon: everything in the house; burned
  rationale: ‘모든 것’의 전면성을 살리면서, 동작의 반복성을 유지한 채 한국어에서 가장 직접적인 ‘불태우다’를 택했습니다.
- source_word: ወሰብእ፡ አልቦ፡ ዘአእመረ።
  english_pob_choice: and no person knew it
  chosen_korean: 아무도 그것을 알지 못했습니다
  alternatives_korean:
  - 아무도 알지 못했습니다
  - 사람은 아무도 그것을 알지 못했습니다
  lexicon: no person knew it
  rationale: 게즈어의 부정 인칭을 자연스럽게 압축하되, POB 수정안이 반영한 간결한 종결을 따라 사건의 은밀함을 분명히 했습니다.
theological_decisions:
- issue: 아브람의 우상 파괴 행위를 본문이 직접 서술하는 방식
  chosen_reading: 이 구절은 아브람이 밤에 우상 숭배의 집과 그 안의 모든 것을 불태운 사건을 사실 진술로 제시합니다.
  alternative_readings:
  - 상징적 행위로 완화하여 옮김
  - ‘우상들의 집’을 ‘우상 신당’처럼 종교적 해설어로 바꿈
  rationale: 본문은 서술적·사실적 어조를 취하므로, 해설을 덧붙이기보다 행위 자체를 직접적으로 드러내는 것이 원문 의도에 가깝습니다.
  doctrine_reference: 서사 본문 해석 원칙; 우상숭배 거부의 서술적 강조
- issue: ‘아무도 그것을 알지 못했습니다’의 은밀성
  chosen_reading: 행위가 비밀리에 이루어졌음을 그대로 유지했습니다.
  alternative_readings:
  - ‘아무도 눈치채지 못했습니다’로 의역
  - ‘알아낸 사람이 없었습니다’로 완화
  rationale: 게즈어의 단정적 부정은 사건의 은밀함을 강조하므로, 이를 약화시키지 않고 직설적으로 옮겼습니다.
  doctrine_reference: 본문의 서술 강조 보존
