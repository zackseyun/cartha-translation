translation:
  language: ko
  text: 그들은 밤에 일어나 불 가운데서 자기들의 신들을 구하려고 했습니다. 그리고 하란이 달려들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያድኅኑ
  english_pob_choice: wanted to save
  chosen_korean: 구하려고 했습니다
  alternatives_korean:
  - 살리려고 했습니다
  - 구원하려고 했습니다
  lexicon: አድኀነ / save, rescue
  rationale: 문맥상 불 가운데서 신들을 건져내려는 시도를 나타내므로, ‘구하다’가 가장 자연스럽고 소스의 구출 의미를 잘 살립니다.
- source_word: አማልክቲሆሙ
  english_pob_choice: their gods
  chosen_korean: 자기들의 신들을
  alternatives_korean:
  - 그들의 신들을
  - 자기들의 우상들을
  lexicon: አማልክት / gods
  rationale: Geez 복수형을 따라 ‘신들’을 유지하고, 소유 관계는 본문의 긴박한 행동을 살려 ‘자기들의’로 옮겼습니다.
- source_word: እማእከለ፡ እሳት
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 가운데서
  alternatives_korean:
  - 불 한가운데서
  - 불 속에서
  lexicon: '''inside / midst of'' + fire'
  rationale: ‘한가운데서’는 직역성이 높지만 한국어에서는 ‘불 가운데서’가 보다 자연스럽고 원문의 중심부 의미를 유지합니다.
- source_word: ወሰረረ፡ አራን፡
  english_pob_choice: And Haran rushed
  chosen_korean: 그리고 하란이 달려들었습니다
  alternatives_korean:
  - 그리고 하란이 급히 달렸습니다
  - 그리고 하란이 뛰어들었습니다
  lexicon: sarara / leap, spring, rush
  rationale: 개정된 영어 주석처럼 동사는 단순히 ‘달리다’보다 ‘급히 돌진하다/달려들다’가 더 가깝고, 불속으로 뛰어드는 급박함을 드러냅니다.
theological_decisions:
- issue: 이 장면의 ‘신들’ 표현을 어떻게 옮길지
  chosen_reading: 문자적으로 ‘신들’을 유지했습니다.
  alternative_readings:
  - 우상들
  - 가짜 신들
  rationale: 본문은 그들이 실제로 자기들의 ‘신들’을 구하려 했다고 서술하므로, 해석을 덧붙여 우상으로 바꾸기보다 원문 표면 의미를 유지하는 편이 더 투명합니다.
  doctrine_reference: 서술문은 해석을 최소화하고 본문이 말하는 행위를 그대로 반영해야 한다는 번역 원칙
