    rationale: 각주는 다음 절로 이관될 동사·이름 구절을 대상으로 하므로, 11:13에서는 삭제해야 합니다.
  revised_text: 그들은 밤에 일어나 불 가운데서 자기들의 신들을 구하려고 했습니다.
