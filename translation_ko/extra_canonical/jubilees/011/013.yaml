  verdict: revise
  source_fidelity: 첫 문장은 게에즈어의 ‘밤에 일어나 ... 불 가운데에서 자기들의 신들을 구하려 했다’를 충실히 옮깁니다. 그러나 ‘그리고 하란이 달려들었습니다’(ወሰረረ፡ አራን፡)는 제공된 판본 문자열에는 이어져 있으나, 문맥 및 감사 이력에서 확인되듯 다음 절(11:14)의 시작에 속하는 절 분할 오류입니다. 따라서 11:13 본문에는 포함하지 않는 것이 절 경계와 본문 충실성에 맞습니다.
  naturalness: ‘그들은 밤에 일어나 불 가운데서 자기들의 신들을 구하려고 했습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘불 가운데서’는 불속에서 구출하려는 뜻을 문맥상 충분히 전달합니다.
  terminology: ‘신들’은 አማልክት의 복수와 서술의 비평가적 중립성을 보존합니다. ‘구하려고 했습니다’는 ያድኅኑ의 의도·시도 의미에 적절합니다. 하란은 다음 절로 이관하므로 이 절의 이름 표기 및 관련 각주는 삭제합니다.
  issues:
  - severity: high
    issue: 11:13에 다음 절에 속하는 하란의 행동이 포함되어 있습니다.
    rationale: 감사 이력은 ወሰረረ፡ አራን፡을 절 분할 오류로 명시하며, 이 구절은 11:14의 시작에 속합니다. 이를 11:13에 남기면 절 경계가 틀어지고 11:14에서 내용이 중복될 수 있습니다.
  - severity: medium
