base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/016.yaml
  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
  footnotes:
  - marker: '16'
    text: Literally 'for two weeks of years,' that is, two heptads of years. Jubilees regularly counts time in these schematic units.
    reason: cultural_note
  - marker: a
    text: Or 'for two weeks of years. And in the sixth week[16]'.
    reason: previous_rendering
translation:
  language: ko
  text: 두 주간의 해[16]. 그리고 여섯째 주의 다섯째 해에, 아브람은 일곱째 달의 시작에 밤을 새우며, 저녁부터 새벽까지 별들을 살펴보아 비가 오는 해의 형편이 어떠할지 보려고 했습니다. 그는 혼자 그곳에 앉아 지켜보고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት።
  english_pob_choice: for two weeks of years.
  chosen_korean: 두 주간의 해
  alternatives_korean:
  - 두 이레의 해
  - 두 주기의 해
  lexicon: two weeks of years / schematic heptads
  rationale: Geʽez의 수량 표현을 직역하면 ‘두 주간의 해’가 되어, 주(week)로 해를 세는 주기적 계산법을 한국어에서 비교적 자연스럽게 드러냅니다.
- source_word: ወበሳድስ፡ ሱባዔ፡ በዓመት፡ ኃምስ፡
  english_pob_choice: And in the sixth week, in its fifth year
  chosen_korean: 그리고 여섯째 주의 다섯째 해에
  alternatives_korean:
  - 그리고 여섯째 주의 다섯째 해에
  - 그리고 여섯째 주기 안의 다섯째 해에
  lexicon: sixth week / fifth year
  rationale: 원문의 구조는 ‘여섯째 주’와 그 ‘다섯째 해’를 함께 표시하므로, 시간의 도식적 배열을 보존하는 방식으로 옮겼습니다.
- source_word: በሌሊት፡ በሠርቀ፡ ወርኅ፡ ሳብዕ፡ ከመ፡ ያበይነ፡ ከዋክብተ፡ እምበርክ፡ እስከ፡ ነግህ፡
  english_pob_choice: Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn
  chosen_korean: 일곱째 달의 시작에 밤을 새우며, 저녁부터 새벽까지 별들을 살펴보아
  alternatives_korean:
  - 일곱째 달의 시작에 밤을 새우며, 저녁부터 새벽까지 별들을 살펴보아
  - 일곱째 달이 시작될 무렵 밤을 지새우며, 저녁에서 새벽까지 별들을 살펴보려고
  lexicon: at the beginning of the seventh month / observe the stars from evening until dawn
  rationale: ‘밤을 새우다’와 ‘살펴보다’는 관찰 행위와 지속성을 함께 살리며, ‘저녁부터 새벽까지’는 시간 범위를 분명히 드러냅니다.
- source_word: ከመ፡ ይርአይ፡ ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት፡
  english_pob_choice: to see what would be the character of the year with respect to the rains
  chosen_korean: 비가 오는 해의 형편이 어떠할지 보려고
  alternatives_korean:
  - 비에 관한 그 해의 성격이 어떠할지 보려고
  - 그 해의 비의 양상이 어떠할지 보려고
  lexicon: what would be the character of the year with respect to the rains
  rationale: 원문은 ‘해의 성격/형편’을 비와 연결해 묻고 있으므로, 너무 현대적 기상 용어로 좁히지 않으면서도 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 시간 계산의 도식성 유지
  chosen_reading: ‘두 주간의 해’와 ‘여섯째 주의 다섯째 해’로 옮겨, 희년서의 연대기적·주기적 시간 계산을 그대로 드러냈습니다.
  alternative_readings:
  - ‘두 이레의 해’로 성경적 어감을 강조하는 번역
  - ‘두 주기의 해’로 설명적 번역
  rationale: 본문은 역사 서술이라기보다 도식적 연대 계산을 전제하므로, 전통적 익숙함보다 원문의 계산 체계를 보존하는 것이 더 충실합니다.
  doctrine_reference: 텍스트 구조와 연대기 표현에 관한 번역 원칙
- issue: 밤샘 관찰의 묘사
  chosen_reading: 아브람이 혼자 밤을 새우며 별을 관찰하는 장면을 그대로 살려, 해석적 윤색 없이 관찰 목적과 고독을 드러냈습니다.
  alternative_readings:
  - 간단히 사건만 요약하는 번역
  - 감정적 해설을 덧붙이는 번역
  rationale: 원문은 관찰 행위와 고독한 상태를 함께 제시하므로, 그 긴장감을 보존하는 것이 서술의 의도를 잘 반영합니다.
  doctrine_reference: 서술 충실성 및 문학적 효과 보존
