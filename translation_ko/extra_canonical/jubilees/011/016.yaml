  rationale: 원문은 ‘해의 성격/형편’을 비와 연결해 묻고 있으므로, 너무 현대적 기상 용어로 좁히지 않으면서도 의미를 자연스럽게 전달했습니다.
theological_decisions:
- issue: 시간 계산의 도식성 유지
  chosen_reading: ‘두 주간의 해’와 ‘여섯째 주의 다섯째 해’로 옮겨, 희년서의 연대기적·주기적 시간 계산을 그대로 드러냈습니다.
  alternative_readings:
  - ‘두 이레의 해’로 성경적 어감을 강조하는 번역
  - ‘두 주기의 해’로 설명적 번역
  rationale: 본문은 역사 서술이라기보다 도식적 연대 계산을 전제하므로, 전통적 익숙함보다 원문의 계산 체계를 보존하는 것이 더 충실합니다.
  doctrine_reference: 텍스트 구조와 연대기 표현에 관한 번역 원칙
- issue: 밤샘 관찰의 묘사
  chosen_reading: 아브람이 혼자 밤을 새우며 별을 관찰하는 장면을 그대로 살려, 해석적 윤색 없이 관찰 목적과 고독을 드러냈습니다.
  alternative_readings:
  - 간단히 사건만 요약하는 번역
  - 감정적 해설을 덧붙이는 번역
  rationale: 원문은 관찰 행위와 고독한 상태를 함께 제시하므로, 그 긴장감을 보존하는 것이 서술의 의도를 잘 반영합니다.
  doctrine_reference: 서술 충실성 및 문학적 효과 보존
