  lexicon: at the beginning of the seventh month / observe the stars from evening until dawn
  rationale: ‘밤을 새우다’와 ‘살펴보다’는 관찰 행위와 지속성을 함께 살리며, ‘저녁부터 새벽까지’는 시간 범위를 분명히 드러냅니다.
- source_word: ከመ፡ ይርአይ፡ ምንተ፡ ይከውን፡ ግብረ፡ ዓመት፡ በዝናማት፡
  english_pob_choice: to see what would be the character of the year with respect to the rains
  chosen_korean: 비가 오는 해의 형편이 어떠할지 보려고
  alternatives_korean:
