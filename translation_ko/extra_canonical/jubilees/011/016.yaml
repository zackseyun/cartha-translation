  lexicon: two weeks of years / schematic heptads
  rationale: Geʽez의 수량 표현을 직역하면 ‘두 주간의 해’가 되어, 주(week)로 해를 세는 주기적 계산법을 한국어에서 비교적 자연스럽게 드러냅니다.
- source_word: ወበሳድስ፡ ሱባዔ፡ በዓመት፡ ኃምስ፡
  english_pob_choice: And in the sixth week, in its fifth year
  chosen_korean: 그리고 여섯째 주의 다섯째 해에
  alternatives_korean:
  - 그리고 여섯째 주의 다섯째 해에
  - 그리고 여섯째 주기 안의 다섯째 해에
  lexicon: sixth week / fifth year
  rationale: 원문의 구조는 ‘여섯째 주’와 그 ‘다섯째 해’를 함께 표시하므로, 시간의 도식적 배열을 보존하는 방식으로 옮겼습니다.
- source_word: በሌሊት፡ በሠርቀ፡ ወርኅ፡ ሳብዕ፡ ከመ፡ ያበይነ፡ ከዋክብተ፡ እምበርክ፡ እስከ፡ ነግህ፡
  english_pob_choice: Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn
  chosen_korean: 일곱째 달의 시작에 밤을 새우며, 저녁부터 새벽까지 별들을 살펴보아
  alternatives_korean:
  - 일곱째 달의 시작에 밤을 새우며, 저녁부터 새벽까지 별들을 살펴보아
