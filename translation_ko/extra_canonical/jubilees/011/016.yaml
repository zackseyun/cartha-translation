base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/016.yaml
  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
  footnotes:
  - marker: '16'
    text: Literally 'for two weeks of years,' that is, two heptads of years. Jubilees regularly counts time in these schematic units.
    reason: cultural_note
  - marker: a
    text: Or 'for two weeks of years. And in the sixth week[16]'.
    reason: previous_rendering
translation:
  language: ko
  text: 두 이레의 해 동안.[16] 그리고 여섯째 이레의 다섯째 해에, 아브람은 일곱째 달이 시작될 때 밤을 새우며 저녁부터 새벽까지 별들을 살펴보았습니다. 그는 그해 비의 양상이 어떠할지 보려고 혼자 그곳에 앉아 지켜보고 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '16'
    text: 직역하면 ‘두 이레의 해 동안’입니다. 곧 일곱 해씩을 한 단위로 세는 두 기간을 뜻합니다. 희년서는 이러한 도식적 단위로 시간을 자주 계산합니다.
    reason: ‘두 이레의 해’라는 직역적 시간 표현이 14일이 아니라 두 칠년 단위를 가리킴을 설명합니다.
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት።
  english_pob_choice: for two weeks of years.
  chosen_korean: 두 주간의 해
  alternatives_korean:
  - 두 이레의 해
