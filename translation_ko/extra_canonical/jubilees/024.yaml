base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/024.yaml
  text: '1[a]. And it came to pass after Abraham died that the LORD blessed Isaac his son. And he rose up from Hebron and went and dwelt at the Well of the Vision in the first year of the third week of this jubilee, seven years.

    2. And in the first year of the fourth week a famine came upon the land, besides the former famine that had been in the days of Abraham.

    3. And Jacob cooked lentil stew, and Esau came from the field hungry. And he said to Jacob his brother, "Give me some of this red stew of lentils." And Jacob said to him, "Sell to me your birthright, the firstborn share."

    4. "And I will give you bread and also some of this lentil stew." And Esau said in his heart, "I am about to die;

    5. of what use to me is this firstborn birthright?" And he said to Jacob, "I give it to you." And Jacob said,

    6. "Swear to me today." And he swore to him. And Jacob gave to Esau his brother bread and stew[b], and he ate until he was satisfied. And Esau despised his birthright. Therefore his name was called Edom, because of the red lentil stew that Jacob gave him in exchange for his birthright.

    7. And Jacob became greater, and Esau was brought low from the command of his father. And there was famine upon the land, and

    8. Isaac set out to go down to Egypt in the second year of the sixth week. And he went to Gerar, to Abimelech king of the Philistines.

    9. And the LORD appeared to him and said to him, "Do not go down to Egypt. Dwell in the land that I tell you, and stay in this land, and I will be with you and bless you. For to you

    10. and to your seed I will give all this land, and I will establish my oath that I swore to Abraham your father. And I will multiply your seed like the stars of heaven, and I will give to your seed all this land. And all the nations of the earth will bless themselves

    11. by your seed, because your father obeyed my voice and kept my charge and my commandments and my statutes and my covenant. And now, listen to my voice and dwell in this land." And he dwelt in Gerar three weeks of years. And Abimelech gave command concerning him

    12. and concerning all that was his, saying, "Every man who touches him or anything that is his,

    13. let him surely die." And Isaac prospered among the Philistines, and he had much property,

    14. cattle and sheep and camels and donkeys and much wealth. And he sowed in the land

    15. of the Philistines and brought in a hundredfold. And Isaac became very great, and the Philistines envied him. And all the wells that the servants of Abraham had dug during Abraham''s lifetime the Philistines stopped up

    16. after Abraham died, and filled them with earth. And Abimelech said to Isaac, "Go away from us, for you have become much mightier than we." And Isaac departed from there in the first year of the seventh week and camped in the valley of Gerar. And they dug again the wells of water that the servants of Abraham his father had dug, and that the Philistines had stopped up after Abraham his father died; and they called their names by the names that Abraham his father had called them. And Isaac''s servants dug a well in the wadi and found living water. And the shepherds of Gerar quarreled with Isaac''s shepherds, saying, "The water is ours." And Isaac called the name of that well Contention, because they contended with us. And they dug another well, and they quarreled over that one also, and he called its name Hostility. And he moved on from there and dug another well, and they did not quarrel over it, and he called its name Broad Place. And Isaac said, "Now the LORD has made room for us,
    and we have become fruitful in the land." And he went up from there to the Well of the Oath in the first year of the first week in the forty-fourth jubilee. And the LORD appeared to him that night, on the new moon of the first month, and said to him, "I am the God of Abraham your father. Do not fear, for I am with you, and I will bless you and greatly multiply your seed like the sand of the earth, for the sake of Abraham my servant." And he built there an altar that Abraham his father had first built, and he called on the name of the LORD, and he offered sacrifice to the God of Abraham his father. And they dug a well and found living water. And Isaac''s servants dug another well and did not find water, and they came and told Isaac that they had not found water. And Isaac said, "On this day I have sworn to the Philistines, and this thing has happened to us." And he called the name of that place Well of the Oath, because there he swore to Abimelech and to Ahuzzath his companion and to
    Phicol the captain of his army. And Isaac knew on that day that he had sworn under compulsion, to make peace with them. And on that day Isaac cursed the Philistines and said, "Cursed be the Philistines with wrath and indignation among all the nations. May the LORD give them over for reproach and for cursing and for wrath and for indignation into the hand of sinful nations, into the hand of the Kittim. And those who escape from the sword of the enemy and from the Kittim, let a righteous people root them out from under heaven, because they will be enemies and haters of my children in their generations upon the earth. And there will not be left to them any survivor or anyone who escapes in the day of wrathful judgment. For all the seed of the Philistines is destined for destruction and uprooting and removal from the earth, and there will no longer remain for these Caphtorim a name or seed upon the earth. For even if he goes up to heaven, from there he will be brought down; and if he makes
    his nest in the earth, from there he will be torn away; and if he hides among the nations, from there he will be rooted out; and if he goes down into Sheol, there also his judgment will increase, and there will be no peace for him there. And if he goes into captivity, by the hand of those who seek his life on the highways they will kill him, and there will be left for him neither name nor seed in all the earth, for he will go into eternal curse." And thus it is written and ordained concerning him on the heavenly tablets, to do to him on the day of judgment[c][d][e][f], so that he should be rooted out from the earth.'
  footnotes:
  - marker: a
    text: The place-name is rendered literally from the Ge'ez as 'Well of the Vision.' It likely corresponds to the site known from Genesis, but the translation avoids importing the fuller traditional form into the main text.
    reason: cross_reference
    anchor_ref: '24:1'
  - marker: b
    text: The legal list in the divine speech is textually dense and partially overlapping. The English keeps the sequence distinct rather than collapsing it into a single term like 'laws.'
    reason: segmentation_note
    anchor_ref: '24:11'
  - marker: f
    text: This verse is exceptionally long in the source and appears to combine material parallel to Genesis 26 with Jubilees' own expansions, including chronological notices, covenant language, and an extended curse oracle.
    reason: segmentation_note
    anchor_ref: 24:16a
  - marker: e
    text: The well-names are translated by sense ('Contention,' 'Hostility,' 'Broad Place') rather than transliterated, so the explanatory wordplay remains visible in English.
    reason: lexical_alternative
    anchor_ref: 24:16b
  - marker: d
    text: '''Kittim'' is a traditional ancient ethnonym in Second Temple literature; its exact historical referent can shift by context.'
    reason: cultural_note
    anchor_ref: 24:16c
  - marker: c
    text: '''Heavenly tablets'' is a key Jubilees motif for decrees recorded in heaven; the phrase is preserved explicitly here.'
    reason: cross_reference
    anchor_ref: 24:16d
translation:
  language: ko
  text: '1[a]. 아브라함이 죽은 후에 주님께서 그의 아들 이삭에게 복을 주셨더라. 이 희년 셋째 주 첫째 해 곧 칠 년에 그가 헤브론에서 일어나 가서 환상의 우물에 가서 거하였더라.

    2. 그리고 넷째 주의 첫째 해에, 아브라함 시대에 있었던 이전 흉년 외에, 흉년이 땅에 들었습니다.

    3. 야곱은 팥죽을 끓였고, 에서는 배고픈 들판에서 돌아왔습니다. 그리고 그가 그의 형 야곱에게 말했습니다. "이 팥죽을 나에게 좀 주십시오." 야곱이 그에게 이르되 네 장자의 명분 곧 장자의 몫을 내게 팔아라.

    4. "그리고 빵과 이 렌즈콩 스튜도 좀 주겠습니다." 그리고 에서는 마음속으로 말했습니다. “나는 이제 죽게 되었습니다.

    5. 이 장자권이 나에게 무슨 소용이 있습니까?" 그리고 야곱에게 “내가 그것을 네게 주노라”고 말씀하셨습니다. 그러자 야곱이 말했습니다.

    6. "오늘 나에게 맹세하세요." 그리고 그는 그에게 맹세했습니다. 야곱이 그의 형 에서에게 빵과 죽을 주었더니 그가 배부르게 먹었습니다. 그리고 에서는 자기의 장자권을 경멸했습니다. 그러므로 그의 이름을 에돔이라 불렀으니 이는 야곱이 장자의 명분 대신에 그에게 준 붉은 팥죽이었더라.

    7. 야곱은 더욱 강해지고, 에서는 그의 아버지의 명령으로 인해 낮아졌습니다. 그리고 그 땅에 기근이 들었습니다.

    8. 이삭은 여섯째 주 둘째 해에 이집트로 내려가려고 길을 떠났습니다. 그리고 그는 그랄로 가서 블레셋 왕 아비멜렉에게 이르렀습니다.

    9. 주님께서 그에게 나타나 이르시되 애굽으로 내려가지 말고 내가 네게 지시하는 땅에 거하며 이 땅에 거하라 내가 너와 함께 있어 네게 복을 주리라

    10. 그리고 내가 이 땅을 모두 네 자손에게 주겠다. 그리고 내가 네 아버지 아브라함에게 맹세한 것을 이루어 주겠다. 그리고 내가 네 씨를 하늘의 별처럼 번성하게 하고, 이 온 땅을 네 씨에게 주리라. 그리고 땅의 모든 민족들이 스스로를 축복할 것이다.

    11. 네 씨로 말미암아 난 것은 네 아버지가 내 말을 순종하고 내 직임과 내 계명과 내 율례와 내 언약을 지켰음이라 이제 내 목소리를 듣고 이 땅에 거하여라.” 그리고 그는 그랄에 3주 동안 머물렀다. 아비멜렉이 그에게 대하여 명령을 내리매

    12. 그리고 그의 소유에 관한 모든 것에 대하여 이르시되 누구든지 그 사람이나 그의 소유물에 접촉하는 자마다

    13. 반드시 죽게 하라." 이삭이 블레셋 사람 중에서 형통하여 재산이 많았으나

    14. 소와 양과 낙타와 당나귀와 많은 재물을 얻었느니라 그리고 그가 땅에 씨를 뿌렸다.

    15. 블레셋 사람에게서는 백 배나 가져왔느니라 이삭이 심히 커지매 블레셋 사람들이 그를 시기하여 그리고 아브라함의 종들이 아브라함 사는 동안에 판 모든 우물을 블레셋 사람들이 막았느니라.

    16. 아브라함이 죽은 후에 거기에 흙이 가득하였느니라 아비멜렉이 이삭에게 이르되 우리를 떠나라 네가 우리보다 훨씬 강하였으니 이삭이 일곱째 주의 첫째 해에 그곳을 떠나 그랄 골짜기에 장막을 치고 그 아버지 아브라함의 종들이 팠던 우물들을 다시 팠고, 그 아버지 아브라함이 죽은 후에 블레셋 사람들이 막았더라. 그리고 그들은 그의 아버지 아브라함이 부르던 이름으로 그들의 이름을 불렀습니다. 그리고 이삭의 종들은 시내에 우물을 파서 생수를 얻었습니다. 그랄 목자들이 이삭의 목자들과 다투어 이르되 이 물은 우리의 것이라 하매 그리고 이삭은 그 우물 이름을 다툼이라 불렀습니다. 그들이 우리와 다투었기 때문입니다. 그들이 또 다른 우물을 팠더니 그들이 또 그것으로 다투었으므로 그 이름을 원수라 불렀더라. 그가 거기서 옮겨 다른 우물을 팠더니 그들이 그것으로 인해 다투지 아니하였더라 그가 그 이름을 넓은 곳이라 불렀더라 이삭이 이르되 이제 주님께서 우리를 위하여 공간을 마련하셨으므로 우리가 이 땅에서 번성하게 되었느니라 그리고 그는 마흔넷째 희년 첫째 주의 첫째 해에 거기서 맹세의 우물로 올라갔다. 그 날 정월 초하루 밤에 주님께서 그에게 나타나 이르시되 나는 네 아버지 아브라함의 하나님이니 두려워하지 말라 내 종 아브라함을 위하여 내가 너와 함께 있어 네게 복을 주어 네 자손이 땅의 모래와 같이 크게 번성하게 하리라 하신지라 그리고 그는 그의 아버지 아브라함이 처음 쌓은 제단을 거기서 쌓고 주님의 이름을 부르고 그의 아버지 아브라함의 하나님께 희생을 바쳤습니다. 그리고 그들은 우물을 파서 생수를 얻었습니다. 이삭의 종들이 다른 우물을 팠으나 물을 얻지 못하여 와서 이삭에게 물을 얻지 못하였다고 말하니라. 이삭이 이르되 내가 오늘 블레셋 사람들에게 맹세하였더니 이런 일이 우리에게 일어났느니라. 그가 그 곳 이름을 맹세의 우물이라 불렀으니 이는 그가 거기서 아비멜렉과 그의 친구 아훗삿과 그의 군대 장관 비골에게 맹세하였음이더라. 이삭은 그 날에 자기가 그들과 화친하기로
    강제로 맹세한 줄을 알았더라. 그 날에 이삭이 블레셋 사람을 저주하여 이르되 블레셋 사람이 모든 나라 가운데서 진노와 분으로 저주를 받을지어다 주님께서 그들을 치욕과 저주와 분냄과 분으로 죄 많은 나라의 손 곧 깃딤의 손에 붙이시기를 원하며 원수의 칼과 깃딤의 칼을 피하는 자들은 의로운 자들이 그들을 천하에서 뽑아 버리게 하소서 그들은 원수요 미워함이 되리이다 블레셋 사람의 모든 자손은 다 멸망하여 땅에서 뽑힐 것이며 이 갑도리 사람의 이름이나 자손이 다시는 땅에 남지 아니하리라. 그가 열국 중에 숨어 거기서 뽑히리라 만일 그가 음부(히브리어: Sheol)에 떨어지면 거기서는 그의 심판이 더할 것이요 거기서는 그에게 평안이 없으리라 만일 그가 사로잡혀 가면 길에서 그의 생명을 노리는 자들의 손에 죽임을 당하고 온 땅에 이름도 없고 자손도 남지 않게 되리니 그가 영원한 저주를 받을 것임이니라 이에 대하여 그에 관하여 하늘 판에 기록되고 정해졌으니 심판 날에 그에게 행하여 땅에서 뽑히리라 하였느니라.'
