revisions:
- from: 그리고 이 일 때문에 하늘의 돌판에 이렇게 기록되어 있습니다. 「이웃을 악의로 쳐서 상하게 하는 자는 저주를 받을 것이다」; 그리고 보는 모든 사람과 듣는 모든 사람은 「그렇게 되기를」이라고 말해야 합니다. 또 보고도 신고하지 않은 사람도 그와 같이 저주를 받을 것입니다.[a]
  to: 그리고 이 일 때문에 하늘의 서판들에 이렇게 기록되어 있습니다. “이웃을 악의로 치는 자는 저주를 받을 것입니다.” 그리고 보고 듣는 모든 사람은 “그리되기를”이라고 말해야 합니다. 또 보고도 알리지 않은 사람은 그와 같이 저주를 받을 것입니다.
  rationale: 복수형 ‘하늘의 서판들’을 회복하고, 불필요한 결과 의미와 제도적 ‘신고’의 뉘앙스를 제거했습니다. 마지막 절은 영어 POB 감사 이력과 문맥이 지지하는 부정 독법을 그대로 반영했으며, 이에 어긋나는 이전 대안 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
