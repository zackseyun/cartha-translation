base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/005.yaml
  text: 'And because of this it is written on the heavenly tablets: “Cursed is he who strikes his neighbor maliciously”; and let all who see and hear say, “So be it”; and the man who has seen and not reported, let him be cursed in the same way.'
  footnotes:
  - marker: a
    text: Or 'and reported'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 때문에 하늘의 돌판에 이렇게 기록되어 있습니다. 「이웃을 악의로 쳐서 상하게 하는 자는 저주를 받을 것이다」; 그리고 보는 모든 사람과 듣는 모든 사람은 「그렇게 되기를」이라고 말해야 합니다. 또 보고도 신고하지 않은 사람도 그와 같이 저주를 받을 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: heavenly tablets
  english_pob_choice: heavenly tablets
  chosen_korean: 하늘의 돌판
  alternatives_korean:
  - 하늘 판
  - 천상 판
  - 하늘의 서판
  lexicon: 돌판
  rationale: 문맥상 기록이 새겨진 물질적 판을 가리키므로, 관용적이면서도 원문 이미지가 살아 있는 ‘돌판’으로 옮겼습니다.
- source_word: strikes his neighbor maliciously
  english_pob_choice: Cursed is he who strikes his neighbor maliciously
  chosen_korean: 이웃을 악의로 쳐서 상하게 하는 자
  alternatives_korean:
  - 이웃을 악의로 치는 자
  - 이웃을 고의로 상하게 하는 자
  - 이웃을 악의로 때리는 자
  lexicon: 악의로 치다
  rationale: 단순한 ‘치다’보다 해악을 의도한 공격임을 드러내기 위해 ‘악의로 쳐서 상하게 하는’으로 풀어, POB의 ‘maliciously’와 게즈 원문의 비난 강도를 반영했습니다.
- source_word: say, “So be it”
  english_pob_choice: let all who see and hear say, “So be it”
  chosen_korean: 「그렇게 되기를」이라고 말해야 합니다
  alternatives_korean:
  - 「아멘」이라고 말해야 합니다
  - 「그리하소서」라고 말해야 합니다
  - 「그렇게 하십시오」라고 말해야 합니다
  lexicon: 그렇게 되기를
  rationale: 원문은 공동의 동의·승인을 요구하는 응답 공식이므로, 교회적 관용구인 ‘아멘’보다 의미를 직접 드러내는 표현을 기본으로 삼았습니다.
- source_word: has seen and not reported
  english_pob_choice: the man who has seen and not reported
  chosen_korean: 보고도 신고하지 않은 사람
  alternatives_korean:
  - 보고도 알리지 않은 사람
  - 보고도 고발하지 않은 사람
  - 보고도 보고하지 않은 사람
  lexicon: 신고하다
  rationale: 여기서는 목격 사실을 관계 당국이나 공동체에 전달하지 않은 책임을 가리키므로, 한국어에서 가장 직접적인 ‘신고하다’를 선택했습니다.
theological_decisions:
- issue: 공동체적 저주의 선언을 한국어로 어떻게 보존할 것인가
  chosen_reading: 저주를 받을 것이다 / 저주를 받을 것입니다의 선언적 어법으로 유지했습니다.
  alternative_readings:
  - 하나님의 저주 아래 놓이게 될 것입니다
  - 저주받을 것입니다
  rationale: 원문과 POB는 법적-언약적 선언 형식을 유지하므로, 그 선포성을 약화시키지 않으면서도 현대 한국어에서 자연스러운 미래·선언형으로 옮겼습니다.
  doctrine_reference: 언약 저주 선언의 문체 보존
- issue: 문장 끝의 공동 응답을 어떻게 처리할 것인가
  chosen_reading: 모든 사람이 ‘그렇게 되기를’이라고 말하는 공동 동의 구조를 유지했습니다.
  alternative_readings:
  - ‘아멘’이라고 말하다
  - ‘그러하소서’라고 말하다
  rationale: 예전적 기도문보다 본문 자체의 공적 승인 기능이 핵심이므로, 응답의 의미를 직접 드러내는 표현을 택했습니다.
  doctrine_reference: 공동체적 재가(assent) 의례
