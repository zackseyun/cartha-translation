  text: And in the fifth week she bore him his daughter Awan. And in the first year of the third jubilee Cain killed Abel, because Abel’s offering was accepted, but Cain’s sacrifice was not accepted.
translation:
  language: ko
  text: 그리고 다섯째 주간에 그녀는 그에게서 딸 아완을 낳았습니다. 그리고 세 번째 희년의 첫해에 카인이 아벨을 죽였는데, 아벨의 제물은 받아들여졌지만 카인의 제사는 받아들여지지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበኃምስ፡ ... ወለደታ፡ ለአዋን፡ ወለቱ።
  english_pob_choice: And in the fifth week she bore him his daughter Awan.
  chosen_korean: 그리고 다섯째 주간에 그녀는 그에게서 딸 아완을 낳았습니다.
  alternatives_korean:
  - 그리고 다섯째 주에 그녀는 그에게 딸 아완을 낳았습니다.
  - 그리고 다섯째 주간에 그녀는 아완을 딸로 낳았습니다.
  lexicon: 주간
  rationale: Geez 원문과 POB 영어는 시간을 ‘week’로 제시하므로, 희년서의 계산 단위를 살려 ‘주간’으로 옮기고 이름은 현대 음역 ‘아완’으로 표기했습니다.
- source_word: ቀተሎ፡ ... ለአቤል፡
  english_pob_choice: Cain killed Abel
  chosen_korean: 카인이 아벨을 죽였는데
  alternatives_korean:
  - 카인이 아벨을 죽였습니다.
  - 가인이 아벨을 죽였는데
  lexicon: 살해 동사
  rationale: 원문은 단순한 사망이 아니라 명시적 살해를 뜻하므로 ‘죽였습니다’보다 사건성을 드러내는 ‘죽였는데’로 문맥을 연결했습니다.
- source_word: ቍርባኖ፡ / መሥዋዕቶ።
  english_pob_choice: offering / sacrifice
  chosen_korean: 제물 / 제사
  alternatives_korean:
  - 예물 / 희생제물
  - 헌물 / 제사
  lexicon: 제물
  rationale: 아벨의 경우 POB가 ‘offering’을, 카인의 경우 ‘sacrifice’를 구분하므로 한국어도 ‘제물’과 ‘제사’로 가볍게 구분해 대조를 살렸습니다.
theological_decisions:
- issue: ‘받아들여졌다’의 수동적 결과와 거절의 대조
  chosen_reading: 아벨의 제물은 받아들여졌지만 카인의 제사는 받아들여지지 않았습니다
  alternative_readings:
  - 아벨의 제물은 하나님께서 받으셨지만 카인의 제사는 받지 않으셨습니다.
  - 아벨의 제물은 인정을 받았지만 카인의 제사는 인정받지 못했습니다.
  rationale: Geez 원문은 ‘받아들이다/받지 않다’의 대조를 직접 제시하므로, 신학적 해설을 덧붙이지 않고 수동적 수용/거절 구조를 유지했습니다.
  doctrine_reference: 헌물의 수용 여부를 통한 의인-악인의 대조(창 4장 전승과 일치)
