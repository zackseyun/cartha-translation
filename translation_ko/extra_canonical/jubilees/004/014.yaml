revisions:
- from: 열두째 희년 곧 일곱째 주에 그가 아내를 맞이하였으니 그 이름은 에드니니 그의 아버지의 형의 딸이요 단엘의 딸이더라 이번 주 여섯째 해에 그가 아들을 낳으매 그가 그의 이름을 므두셀라라 불렀더라.
  to: 열두 번째 희년의 일곱째 주에 에녹이 아내를 맞이했습니다. 그의 이름은 에드니였으며, 그는 에녹의 아버지의 형제인 다넬의 딸이었습니다. 이 주의 여섯째 해에 에드니가 아들을 낳았고, 에녹은 그의 이름을 므두셀라라고 불렀습니다.
  rationale: 출산 주체를 에드니로 바로잡고, ‘아버지의 형’을 ‘아버지의 형제’로 수정하여 원문의 친족 관계를 보존했습니다. 문체는 현대 표준 한국어 합쇼체로 통일했습니다. 문맥상 ‘그’가 에녹임을 명시하여 독립된 절에서도 자연스럽게 이해되도록 했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:08Z'
