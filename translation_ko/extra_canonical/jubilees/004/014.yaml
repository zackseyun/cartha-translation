  naturalness: 초안은 성서 문체의 평서형 ‘-더라’를 사용하여 요청된 현대 표준 한국어 합쇼체와 맞지 않습니다. 문장을 현대적인 합쇼체로 다듬었습니다.
  terminology: ‘희년’, ‘에드니’, ‘다넬’, ‘므두셀라’를 유지했습니다. 혈연 관계는 ‘아버지의 형제인 다넬의 딸’로 옮겨 원문의 관계를 자연스럽고 정확하게 나타냈습니다.
