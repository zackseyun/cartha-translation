  text: 열두째 희년 곧 일곱째 주에 그가 아내를 맞이하였으니 그 이름은 에드니니 그의 아버지의 형의 딸이요 단엘의 딸이더라 이번 주 여섯째 해에 그가 아들을 낳으매 그가 그의 이름을 므두셀라라 불렀더라.
