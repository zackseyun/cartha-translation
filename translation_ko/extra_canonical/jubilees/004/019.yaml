base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/019.yaml
  text: And he recounted the sabbaths of years, as we made known to him. And he saw what was and what will be in a vision of his sleep, how it will happen to the children of men in their generations until the day of judgment. He saw and understood everything, and wrote his testimony, and placed the testimony on earth...
  footnotes:
  - marker: a
    text: Or 'And he lacked seventy years of one thousand years, for one thousand years are like one day in the testimony of heaven. Therefore it is written concerning the tree of knowledge, “On the day you eat from it you will die.” For this reason he did not complete the years of this day, because in it he died.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 우리가 그에게 알려 준 대로 안식년들을 헤아렸고, 잠의 환상 가운데서 있었던 일과 있을 일을 보았으며, 사람의 자손들에게 그들의 세대들 가운데서 심판의 날까지 어떻게 일이 일어날지를 보았습니다. 그는 모든 것을 보고 깨달았으며, 자신의 증언을 기록하고 그 증언을 땅 위에 두었습니다…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰንበታት፡ ዓመታት፡
  english_pob_choice: the sabbaths of years
  chosen_korean: 연수의 안식일들
  alternatives_korean:
  - 해마다의 안식일들
  - 해의 안식일들
  - 연간 안식일들
  lexicon: 안식일, 연수
  rationale: 게즈어의 복합 표현을 단순히 ‘안식년’으로 좁히지 않고, POB의 영어 ‘sabbaths of years’를 따라 시간 단위의 반복되는 안식일 개념을 드러내기 위해 ‘연수의 안식일들’로 옮겼습니다.
- source_word: በራእየ፡ ንዋሙ፡
  english_pob_choice: in a vision of his sleep
  chosen_korean: 잠의 환상 가운데서
  alternatives_korean:
  - 그의 잠의 환상 가운데서
  - 수면 중의 환상 가운데서
  - 잠속의 환상 가운데서
  lexicon: 환상, 잠
  rationale: 꿈인지 환상인지의 뉘앙스를 살리면서도, 본문의 ‘수면의 환상’이라는 구조를 자연스러운 한국어로 보이기 위해 ‘잠의 환상 가운데서’로 번역했습니다.
- source_word: ደቂቀ፡ እጓለ፡ እመሕያው፡
  english_pob_choice: the children of men
  chosen_korean: 사람의 자손들
  alternatives_korean:
  - 인자들의 자녀들
  - 인류
  - 사람의 아이들
  lexicon: 사람의 자손들
  rationale: 히브리적 관용구를 직역에 가깝게 유지하여, 단순한 ‘인류’보다 세대성과 혈통적 표현을 드러내는 ‘사람의 자손들’을 택했습니다.
- source_word: ዕለተ፡ ደይን፡
  english_pob_choice: the day of judgment
  chosen_korean: 심판의 날
  alternatives_korean:
  - 재판의 날
  - 판결의 날
  - 심판 날
  lexicon: 심판, 날
  rationale: 종말론적 공적 심판의 의미를 분명히 하기 위해, 한국어 성경에서 널리 통용되는 표현인 ‘심판의 날’을 사용했습니다.
- source_word: ወጸሐፈ፡ ስምዖ፡ ወአንበረ፡ ሰስምዐ፡
  english_pob_choice: wrote his testimony, and placed the testimony on earth
  chosen_korean: 자신의 증언을 기록하고 그 증언을 땅 위에 두었습니다
  alternatives_korean:
  - 자신의 증언을 써서 땅에 두었습니다
  - 증언을 기록하여 땅에 놓았습니다
  - 증언을 써 놓고 땅에 두었습니다
  lexicon: 증언, 기록하다, 두다
  rationale: ‘증언’과 ‘두다’를 보존해, 기록 행위와 보관/안치 행위를 분리하는 본문의 두 동사를 드러냈습니다.
theological_decisions:
- issue: 예언적 계시의 형식
  chosen_reading: 에녹이 미래와 심판의 날까지의 역사를 환상 가운데 보고 이해한 예언자로 제시됩니다.
  alternative_readings:
  - 단순한 꿈 이야기로 축소하는 읽기
  - 후대 문헌적 장식으로만 보는 읽기
  rationale: 본문은 계시의 내용이 미래와 심판까지 확장된다고 분명히 말하므로, 환상과 이해, 기록이라는 예언자적 구조를 그대로 살렸습니다.
  doctrine_reference: 계시, 예언, 종말론
