base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/020.yaml
  text: And in the twelfth jubilee, in its seventh week, he took a wife for himself, and her name was Edni, the daughter of Daniel, the daughter of his father's sister; and in the sixth year of this week she bore him a son, and he called his name
translation:
  language: ko
  text: 그리고 열두 번째 희년의 일곱째 주에 그는 아내를 맞이했습니다. 그의 아내의 이름은 에드니였으며, 그는 다니엘의 딸이자 그의 아버지의 누이의 딸이었습니다. 이 주의 여섯째 해에 그녀가 그에게 아들을 낳았고, 그는 그의 이름을 …이라고 불렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበአሠርቱ ወክልኤቱ ኢዮቤልዉ በሳብዕ ሱባዔሁ
  english_pob_choice: And in the twelfth jubilee, in its seventh week
  chosen_korean: 열두 번째 희년, 그 일곱째 주
  alternatives_korean:
  - 열두 희년과 그 일곱째 주
  - 열두 번째 희년의 일곱째 주
  lexicon: 희년 / 주
  rationale: Ge'ez의 축제·연대 구분어를 영어 POB의 구조에 맞춰 간결하게 옮기되, 순서를 살려 연대 표현임을 분명히 했습니다.
- source_word: ነሥአ ሎቱ ብእሲተ
  english_pob_choice: he took a wife for himself
  chosen_korean: 그는 자신을 위해 아내를 맞이했는데
  alternatives_korean:
  - 그는 자기에게 아내를 취했는데
  - 그는 아내를 얻었는데
  lexicon: 아내를 맞이하다
  rationale: 원문의 ‘취하다/맞이하다’ 계열 동사를 한국어에서 자연스럽게 풀되, 단순한 사교적 만남이 아니라 결혼의 성격을 살렸습니다.
- source_word: ወስማ እድኒ
  english_pob_choice: and her name was Edni
  chosen_korean: 그녀의 이름은 에드니였고
  alternatives_korean:
  - 그 이름은 에드니였고
  - 이름이 에드니였고
  lexicon: 에드니
  rationale: 고유명사는 현대 음역을 사용하고, 영어 POB의 서술 흐름을 따라 이름 소개를 자연스럽게 연결했습니다.
- source_word: ወለተ ዳንኤል ወለተ እኅተ አቡሁ
  english_pob_choice: the daughter of Daniel, the daughter of his father's sister
  chosen_korean: 다니엘의 딸, 곧 그의 아버지의 누이의 딸
  alternatives_korean:
  - 다니엘의 딸이자 그의 아버지의 누이의 딸
  - 다니엘의 딸, 그의 아버지 누이의 딸
  lexicon: 곧 / 누이
  rationale: 두 관계절을 단순 나열하면 모호해질 수 있어, ‘곧’으로 동격을 표시해 혈연 관계를 분명히 했습니다.
- source_word: ወለደት ሎቱ ወልደ
  english_pob_choice: she bore him a son
  chosen_korean: 그녀가 그에게 아들을 낳았고
  alternatives_korean:
  - 그가 아들을 낳았고
  - 그녀가 그에게 한 아들을 낳았고
  lexicon: 낳다
  rationale: 출산의 주체와 수혜 관계를 직접 반영해, 원문의 서술을 평이하게 유지했습니다.
