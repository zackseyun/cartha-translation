  source_fidelity: 혼인·출산 및 희년 연대의 기본 내용은 게에즈어 본문과 일치합니다. 그러나 ‘아버지의 형제’가 야렛의 아버지를 가리킨다는 소유 관계를 명시해야 하며, ‘그 일을 했습니다’는 혼인 동사를 불필요하게 대명사화하여 원문의 명료성을 약화합니다. ‘낳아 주었고’의 수혜 뉘앙스도 원문보다 추가적입니다.
  naturalness: 현대 표준 한국어 합쇼체로 대체로 자연스럽지만, ‘그 일을 했습니다’는 지시 대상이 모호하고 문체상 부자연스럽습니다. 친족 관계는 ‘곧 야렛의 아버지의 형제의 딸’로 풀어 쓰는 편이 명확합니다.
  terminology: 희년의 연대 단위인 ‘주’와 ‘해’는 적절합니다. ራሱያል은 게에즈어 음절 및 영어 POB의 Rasuyal에 맞추어 ‘라수얄’로 쓰는 것이 ‘라수야알’보다 자연스럽고 음역상 정확합니다. 현행 본문의 [a]에는 대응 한국어 각주가 필요합니다.
