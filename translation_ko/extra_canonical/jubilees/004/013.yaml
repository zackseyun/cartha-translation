base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/013.yaml
  text: And in the eleventh jubilee, Jared took for himself a wife whose name was Baraka, the daughter of Rasuyal,[a] a daughter of his father's brother, in the fourth week of this jubilee. And she bore him a son in the fifth week, in the fourth year of the jubilee, and he called his name Enoch.
  footnotes:
  - marker: a
    text: The name Rasuyal (ራሱያል) is transliterated as Rasujal in some older editions.
    reason: lexical_choice
translation:
  language: ko
  text: 열한 번째 희년의 넷째 주에 야렛은 바르카라는 아내를 맞이했습니다. 그녀는 라수얄의 딸, 곧 야렛의 아버지의 형제의 딸이었습니다.[a] 그녀는 그 희년의 다섯째 주 넷째 해에 그에게 아들을 낳았고, 그는 그 이름을 에녹이라 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라수얄(ራሱያል)이라는 이름은 일부 오래된 판본에서 라수잘(Rasujal)로 음역됩니다.
    reason: lexical_choice
