  yaml_path: translation/extra_canonical/jubilees/004/003.yaml
  text: And he killed him in the field, and his blood cried out from the ground to heaven, complaining about him.
  footnotes:
  - marker: a
    text: Or 'accusing because of him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 들판에서 그를 죽였습니다. 그의 피가 땅에서 하늘로 그를 두고 고발하며 부르짖었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에 관하여 고발하면서.”
    reason: 원문의 전치사구는 ‘그를 두고/그에 관하여’라는 뜻이며, 고발과 불평·호소의 의미 범위가 일부 겹칩니다.
lexical_decisions:
- source_word: ወቀተሎ*
  english_pob_choice: And he killed him
  chosen_korean: 그는 들판에서 그를 죽였습니다
  alternatives_korean:
  - 그리고 그를 들에서 죽였습니다
  - 그리고 그는 들판에서 그를 살해했습니다
  lexicon: kill / field
  rationale: 서술의 직접성을 살리되, 현대 한국어에서 자연스러운 ‘죽였습니다’를 택했고, 장소어 ‘field’는 본문 그대로 ‘들판’으로 옮겼습니다.
- source_word: ወጸርኀ፡ ደሙ፡ እምድር፡ ውስተ፡ ሰማይ
  english_pob_choice: his blood cried out from the ground to heaven
  chosen_korean: 그의 피는 땅에서 하늘에 이르도록 소리치며
  alternatives_korean:
  - 그의 피는 땅에서 하늘로 부르짖었습니다
  - 그의 피는 땅에서 하늘까지 외쳤습니다
  lexicon: cry out / from the ground to heaven
  rationale: ‘피가 소리치다’는 의인화된 원문 이미지를 살리면서, 공간적 방향성은 ‘땅에서 하늘에 이르도록’으로 자연스럽게 표현했습니다.
- source_word: እንዘ፡ ይስኪ፡ በእንተ፡
  english_pob_choice: complaining about him
  chosen_korean: 그를 두고 고발하였습니다
  alternatives_korean:
  - 그에 관해 항의하였습니다
  - 그에 대해 অভিযোগ하였습니다
  lexicon: accuse / complain about
  rationale: 영문 POB의 개정 흐름이 ‘accusing/complaining about him’의 직접성을 살리는 방향이므로, 문맥상 법정적 함의를 드러내는 ‘고발하다’를 택했습니다.
theological_decisions:
- issue: 피가 하늘에 이르러 고발하는 의인화 표현
  chosen_reading: 살해의 죄가 땅에서 하늘 앞에 증거처럼 호소한다는 이미지로 유지했습니다.
  alternative_readings:
  - 비유적으로 완화해 단순히 ‘슬퍼하다’로 옮길 수 있음
  - 도덕적 책임을 직접적으로 설명해 풀어쓸 수 있음
  rationale: 원문은 살해된 자의 피가 말하듯 외치는 장면을 통해 죄의 공개성과 하늘 앞의 호소를 강조하므로, 그 긴장을 약화시키지 않고 그대로 옮기는 것이 적절합니다.
  doctrine_reference: 창세기 4:10의 아벨의 피가 땅에서 부르짖는 전승과 연결되는 모티프
- issue: ‘고발’의 법정적 색채
  chosen_reading: 단순 감정 표현보다 책임 추궁과 하늘 법정의 이미지를 드러내는 표현으로 번역했습니다.
  alternative_readings:
  - ‘비난하다’로 옮기면 감정적 뉘앙스가 강해짐
  - ‘호소하다’로 옮기면 법정적 긴장이 약해짐
  rationale: Geez 원문과 POB의 개정 노트가 모두 ‘accuse/complain about’의 의미 범위를 가리키므로, 한국어에서는 책임을 따지는 법정적 동사를 쓰는 것이 가장 균형적입니다.
  doctrine_reference: 의인화된 피의 호소를 통한 도덕·재판적 진술
