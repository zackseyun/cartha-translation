  text: And he was still with the angels of God for six jubilees of years[21], and they showed him everything that is on the earth and in the heavens, the dominion of the sun, and he wrote down everything.
  footnotes:
  - marker: '21'
    text: 'The legal maxim echoes talionic justice: the instrument and manner of violence return upon the killer.'
    reason: cross_reference
translation:
  language: ko
  text: 그는 하나님의 천사들과 함께 여섯 희년 동안 계속 있었습니다. 그들은 땅 위와 하늘에 있는 모든 것, 곧 해의 통치권을 그에게 보여 주었습니다. 그리고 그는 모든 것을 기록했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስለ፡ መላእክት፡ አምላክ፡
  english_pob_choice: with the angels of God
  chosen_korean: 하나님의 천사들과 함께
  alternatives_korean:
  - 하나님의 사자들과 함께
  - 하나님의 천사들 가운데
  lexicon: 천사
  rationale: 게에즈의 ‘하나님의 천사들’이라는 직접 구조를 살려, 소속 관계는 ‘하나님의’로, 동반 관계는 ‘함께’로 자연스럽게 옮겼습니다.
- source_word: ስድስተ፡ ዘኢዮቤልውሳት፡ ዓመታት፡
  english_pob_choice: for six jubilees of years
  chosen_korean: 여섯 희년 동안
  alternatives_korean:
  - 여섯 희년의 해 동안
  - 여섯 희년 기간 동안
  lexicon: 희년
  rationale: 영문 POB의 ‘jubilees of years’는 연 단위 희년 기간을 가리키므로, 번잡한 반복을 줄이되 의미는 유지하는 ‘여섯 희년 동안’으로 옮겼습니다.
- source_word: ሥልጣነ፡ ለፀሐይ፡
  english_pob_choice: the dominion of the sun
  chosen_korean: 해의 통치권
  alternatives_korean:
  - 태양의 지배
  - 해의 주권
  lexicon: 통치권
  rationale: ‘ሥልጣን’의 지배/권세 의미를 반영해, 단순한 천문 현상 설명이 아니라 ‘해의 지배권’이라는 권위 범주를 드러내는 표현을 택했습니다.
- source_word: ወጸሐፈ፡ ኵሎ።
  english_pob_choice: and he wrote down everything
  chosen_korean: 그리고 그는 모든 것을 기록했습니다
  alternatives_korean:
  - 그리고 그는 모든 것을 썼습니다
  - 그리고 그는 그것을 모두 적었습니다
  lexicon: 기록하다
  rationale: 단순한 필기보다 목록화·보존의 뉘앙스를 살리기 위해 ‘기록했습니다’로 옮겼습니다.
theological_decisions:
- issue: 천사들과의 동행이 단순한 방문이 아니라 긴 기간의 계시적 동반인지 여부
  chosen_reading: 본문의 시간 표현과 ‘모든 것을 보여 주었습니다’라는 서술을 따라, 메투살라가 천사들과 함께 있으며 계시적 내용을 전달받는 장면으로 읽었습니다.
  alternative_readings:
  - 짧은 만남의 묘사로 읽기
  - 상징적 서술로 약화해 읽기
  rationale: 게에즈 원문과 영문 POB 모두 장기간 동행과 포괄적 계시를 함께 제시하므로, 본문이 말하는 계시적 장면을 약화하지 않았습니다.
  doctrine_reference: 계시 서술의 문자적-서사적 독해
