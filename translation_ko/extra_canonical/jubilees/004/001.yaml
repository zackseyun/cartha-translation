translation:
  language: ko
  text: 그리고 둘째 희년의 셋째 주간에 그녀가 가인을 낳고, 넷째 주간에 아벨을 낳고, 다섯째 주간에 자기 딸 아완을 낳았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘቀተሎ፡ ወዘለፎ፡ እግዚአብሔር፡ ለቃየን፡ በእንተ፡ አቤል፡ በእንተ፡ ዘቀተሎ፡ ወገብረ፡
  english_pob_choice: And in the third week in the second jubilee she gave birth to Cain, and in the fourth she gave birth to Abel, and in the fifth she gave birth to her daughter Awan.
  chosen_korean: “그리고 둘째 희년의 셋째 주간에 그녀가 가인을 낳고, 넷째 주간에 아벨을 낳고, 다섯째 주간에 자기 딸 아완을 낳았습니다.”
  alternatives_korean:
  - ~가 낳았습니다
  - ~을 낳았습니다
  lexicon: Geez narrative prose / birth formula
  rationale: 소스와 수정된 영어가 모두 출생 서술을 요구하므로, 한국어에서도 반복되는 '낳다' 구조로 평행을 살리고 문장 흐름을 자연스럽게 유지했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 주님
  alternatives_korean:
  - 야훼
  - 하나님
  lexicon: divine title / contextual reading
  rationale: 이 절의 최종 영어는 출생 서술이며, 해당 게이즈 문구는 본절에 직접 반영되지 않으므로 본문에는 넣지 않았습니다. 다만 관련 오독 이력은 별도 주석으로 남기지 않았습니다.
- source_word: ወገብረ፡
  english_pob_choice: gave birth
  chosen_korean: 낳고
  alternatives_korean:
  - 출산하고
  - 생산하고
  lexicon: birth verb
  rationale: 인물의 출생을 직접 서술하는 동사이므로 일상적이면서도 문어적인 '낳다'를 선택했습니다.
theological_decisions:
- issue: Genesis 4 전승과의 관계를 어떻게 반영할 것인가
  chosen_reading: 본절은 가인과 아벨의 죽음 서술이 아니라, 가인·아벨·아완의 출생을 말하는 족보적/서사적 진술로 번역했습니다.
  alternative_readings:
  - '''주님이 가인을 아벨 때문에 꾸짖으셨다''라는 이전 오독을 따르는 읽기'
  - 본문에 없는 해석적 보정을 넣어 창세기 전승과 맞추는 읽기
  rationale: 수정 이력이 명시하듯, 본문은 Jubilees 4:1의 출생 진술이므로 창세기식 징계 문장으로 읽으면 소스가 왜곡됩니다. 따라서 서술 기능을 그대로 살렸습니다.
  doctrine_reference: source fidelity / textual criticism
