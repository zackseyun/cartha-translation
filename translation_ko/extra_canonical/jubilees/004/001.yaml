  terminology: 가인, 아벨, 아완의 음역은 일관되고, ‘희년’과 ‘주간’은 희년서의 시간 단위를 적절히 반영합니다. 다만 현 영어 감사 기록의 각주 a는 이전의 잘못된 절 배정에서 나온 문장을 ‘또는’으로 제시하므로, 본 절의 번역 각주로 유지할 수 없습니다.
