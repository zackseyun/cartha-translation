  source_fidelity: 초안의 ‘육년 희년’은 여섯 해라는 뜻으로 읽히며, 원문의 기간 표현인 ‘six jubilees of years’(여섯 희년)를 정확히 옮기지 못합니다. 또한 원문의 ‘angels of God’은 ‘하나님의 천사들’로 일관되게 옮기는 것이 적절합니다. ‘rule of the sun’은 해의 ‘법칙’보다는 권세/통치 영역을 가리키므로 ‘해의 권세’가 더 가깝습니다.
  naturalness: 초안은 고어체 종결 ‘-느니라’와 현대 합쇼체 요구가 맞지 않고, ‘그가 … 있으니 … 보이니’의 연결도 현대 한국어에서 부자연스럽습니다. 문장을 자연스러운 현대 문어체 합쇼체로 정리했습니다.
  terminology: ‘희년’은 본문의 시간 단위로 유지했습니다. ‘하나님의 천사들’은 원문의 신적 소유 관계와 천사라는 명칭을 보존합니다. ‘해의 권세’는 원문의 의미 범위를 과도하게 해석하지 않으면서 반영합니다.
