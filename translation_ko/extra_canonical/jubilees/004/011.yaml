  text: 그는 땅에 태어난 이들 가운데 처음으로 글쓰기와 가르침과 지혜를 배우고, 하늘의 징조들을 그 달들의 순서에 따라 책에 기록하였습니다. 이는 사람의 자손들이 각 달의 순서에 따라 해들의 시기를 알게 하려는 것이었습니다.
