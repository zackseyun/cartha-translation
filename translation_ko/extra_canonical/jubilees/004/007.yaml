revisions:
- from: 하늘과 땅, 빛과 어둠, 그리고 모든 곳에 맡겨진 것들입니다. 아담과 그의 아내는 아벨로 인해 사십 주[7] 동안 슬퍼하였습니다. 그리고 다섯째 주의 넷째 해에 그들은 기뻐하게 되었고, 아담이 다시 그의 아내를 알았으며, 그녀는 그에게 아들을 낳았습니다. 그는 그의 이름을 셋이라 불렀습니다. 이는 그가 말하기를, “가인이 그를 죽였으므로 하나님께서 아벨 대신에 땅 위에 또 다른 씨를 나를 위해 일으키셨다” 하였기 때문입니다. 그리고 여섯째 주에 그는 그의 딸 아주라를 낳았습니다. 가인은 그의 누이 아완을 아내로 맞이하였고, 그녀는 그에게 네 번째 희년이 끝날 때 에녹을 낳았습니다. 그리고 다섯째 희년의 첫째 주 첫해에 땅 위에 집들이 세워졌고, 가인은 성읍을 건설하여 그것을 그의 아들 에녹의 이름으로 불렀습니다. 아담이 그의 아내 하와를 알았고, 그녀는 아홉 아들을 더 낳았습니다. 그리고 다섯째 희년의 다섯째 주에 셋은 그의 누이 아주라를 아내로 맞이하였고, 넷째 해에 그녀는 그에게 에노스를 낳았습니다. 그는 땅에서 주님의 이름을 부른 첫 사람이었습니다. 그리고 일곱째 희년, 셋째 주에 에노스는 그의 누이 노암을 아내로 맞이하였고, 그녀는 다섯째 주의 셋째 해에 그에게 아들을 낳았으며, 그는 그의 이름을 가이난이라 불렀습니다. 그리고 여덟째 희년이 끝날 무렵 가이난은 그의 누이 무알렐렛을 아내로 맞이하였고, 그녀는 아홉째 희년의 첫째 주, 그 주의 셋째 해에 그에게 아들을 낳았으며, 그들은 그의 이름을 마할랄렐이라 불렀습니다. 그리고 열째 희년의 둘째 주에 마할랄렐은 바라기엘의 딸, 곧 그의 아버지의 형제의 딸 디나를 아내로 맞이하였고, 그녀는 셋째 주, 그 주의 여섯째 해에 그에게 아들을 낳았으며, 그들은 그의 이름을 야렛이라 불렀습니다. 그의 시대에 주님의 천사들, 곧 감시자라 불리는 이들이 땅으로 내려왔기 때문입니다. 그들은 사람의 자손들을 가르치기 위함이었습니다.
  to: 하늘과 땅에서, 빛과 어둠 속에서, 그리고 모든 곳에서 행해지는 것들입니다. 아담과 그의 아내는 아벨 때문에 네 주[7] 동안 슬퍼하였습니다. 다섯째 주의 넷째 해에 그들은 기뻐하게 되었고, 아담은 다시 그의 아내를 알았으며, 그녀는 그에게 아들을 낳았습니다. 그는 그 이름을 셋이라 하였습니다. 이는 그가 말하기를, “가인이 그를 죽였으므로, 하나님께서 아벨 대신에 땅 위에서 나를 위하여 또 다른 씨를 일으키셨다” 하였기 때문입니다. 여섯째 주에 아담은 딸 아주라를 두었습니다. 가인은 그의 누이 아완을 아내로 맞이하였고, 그녀는 넷째 희년이 끝날 때 그에게 에녹을 낳았습니다. 다섯째 희년의 첫째 주, 첫째 해에 땅 위에 집들이 세워졌고, 가인은 성읍을 건설하여 그의 아들 에녹의 이름을 따라 그 이름을 지었습니다. 아담은 그의 아내 하와를 알았고, 그녀는 아홉 자녀를 더 낳았습니다. 다섯째 희년의 다섯째 주에 셋은 그의 누이 아주라를 아내로 맞이하였고, 넷째 해에 그녀는 그에게 에노스를 낳았습니다. 그는 땅 위에서 주님의 이름을 부른 첫 사람이었습니다. 일곱째 희년의 셋째 주에 에노스는 그의 누이 노암을 아내로 맞이하였고, 그녀는 다섯째 주의 셋째 해에 그에게 아들을 낳았으며, 그는 그 이름을 가이난이라 하였습니다. 여덟째 희년이 끝날 때 가이난은 그의 누이 무알렐렛을 아내로 맞이하였고, 그녀는 아홉째 희년의 첫째 주, 그 주의 셋째 해에 그에게 아들을 낳았으며, 그들은 그 이름을 마할랄렐이라 하였습니다. 열째 희년의 둘째 주에 마할랄렐은 바라기엘의 딸이며 그의 아버지의 형제의 딸인 디나를 아내로 맞이하였고, 그녀는 셋째 주의 여섯째 해에 그에게 아들을 낳았으며, 그들은 그 이름을 야렛이라 하였습니다. 그의 시대에 주님의 천사들, 곧 감시자라 불리는 이들이 사람의 자녀들을 가르치려고 땅으로 내려왔습니다.
  rationale: 원문 우선 원칙에 따라 ‘네 주’의 수량, 아담의 계보 동사, 성별 미지정 ‘자녀들’을 바로잡았습니다. 또한 도입부의 ‘맡겨진’이라는 과도한 의미를 제거하고, 시간·친족 관계 및 목적절을 현대 표준 한국어 합쇼체로 다듬었습니다. 신명 호칭은 원문의 일반적 신칭에 맞추어 ‘주님’으로 유지했으며, 논쟁적 해석이나 교리적 보충은 추가하지 않았습니다.
