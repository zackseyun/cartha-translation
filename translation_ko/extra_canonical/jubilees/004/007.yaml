  text: that are committed in heaven and on earth, and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks[7] of years. And in the fourth year of the fifth week they became joyful, and Adam again knew his wife, and she bore him a son, and he called his name Seth; for he said, “the Lord has raised up for me another seed on the earth in place of Abel, because Cain killed him.” And in the sixth week he fathered his daughter Azura. And Cain took Awan his sister as a wife, and she bore him Enoch at the end of the fourth jubilee. And in the first year of the first week of the fifth jubilee, houses were built on the earth, and Cain built a city and named it after his son Enoch. And Adam knew Eve his wife, and she bore nine more sons. And in the fifth week of the fifth jubilee Seth took Azura his sister as a wife, and in the fourth year she bore him Enos. He was the first to call on the name of the Lord on the earth. And in the seventh jubilee, in the
    third week, Enos took Noam his sister as a wife, and she bore him a son in the third year of the fifth week, and he called his name Kenan. And at the end of the eighth jubilee Kenan took Mualeleth his sister as a wife, and she bore him a son in the ninth jubilee, in the first week, in the third year of that week, and they called his name Mahalalel. And in the second week of the tenth jubilee Mahalalel took Dinah, the daughter of Barakiel, his father's brother's daughter, as a wife, and she bore him a son in the third week, in its sixth year, and they called his name Jared. For in his days the angels of the Lord descended to the earth, those who are called the Watchers, so that they might instruct the children of men,
  footnotes:
  - marker: '7'
    text: '''Week'' here and throughout the chapter refers to Jubilees’s chronological system, often a week of years. The main text keeps the shorter term while preserving ''jubilee'' explicitly.'
    reason: cultural_note
  - marker: a
    text: Or 'earth[7], and in light and in darkness, and in every place. And Adam and his wife mourned for Abel four weeks'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘과 땅, 빛과 어둠, 그리고 모든 곳에 맡겨진 것들입니다. 아담과 그의 아내는 아벨로 인해 사십 주[7] 동안 슬퍼하였습니다. 그리고 다섯째 주의 넷째 해에 그들은 기뻐하게 되었고, 아담이 다시 그의 아내를 알았으며, 그녀는 그에게 아들을 낳았습니다. 그는 그의 이름을 셋이라 불렀습니다. 이는 그가 말하기를, “가인이 그를 죽였으므로 하나님께서 아벨 대신에 땅 위에 또 다른 씨를 나를 위해 일으키셨다” 하였기 때문입니다. 그리고 여섯째 주에 그는 그의 딸 아주라를 낳았습니다. 가인은 그의 누이 아완을 아내로 맞이하였고, 그녀는 그에게 네 번째 희년이 끝날 때 에녹을 낳았습니다. 그리고 다섯째 희년의 첫째 주 첫해에 땅 위에 집들이 세워졌고, 가인은 성읍을 건설하여 그것을 그의 아들 에녹의 이름으로 불렀습니다. 아담이 그의 아내 하와를 알았고, 그녀는 아홉 아들을 더 낳았습니다. 그리고 다섯째 희년의 다섯째 주에 셋은 그의 누이 아주라를 아내로 맞이하였고, 넷째 해에 그녀는 그에게 에노스를 낳았습니다. 그는 땅에서 주님의 이름을 부른 첫 사람이었습니다. 그리고 일곱째 희년, 셋째 주에 에노스는 그의 누이 노암을 아내로 맞이하였고, 그녀는 다섯째 주의 셋째 해에 그에게 아들을 낳았으며, 그는 그의 이름을 가이난이라 불렀습니다. 그리고 여덟째 희년이 끝날 무렵 가이난은 그의 누이 무알렐렛을 아내로 맞이하였고, 그녀는 아홉째 희년의 첫째 주, 그 주의 셋째 해에 그에게 아들을 낳았으며, 그들은 그의 이름을 마할랄렐이라 불렀습니다. 그리고 열째 희년의 둘째 주에 마할랄렐은 바라기엘의 딸, 곧 그의 아버지의 형제의 딸 디나를 아내로 맞이하였고, 그녀는 셋째 주, 그 주의 여섯째 해에 그에게 아들을 낳았으며, 그들은 그의 이름을 야렛이라 불렀습니다. 그의 시대에 주님의 천사들, 곧 감시자라 불리는 이들이 땅으로 내려왔기 때문입니다. 그들은 사람의 자손들을 가르치기 위함이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘይከውን፡ ... ወበኵሉ፡
  english_pob_choice: that are committed in heaven and on earth, and in light and in darkness, and in every place
  chosen_korean: 하늘과 땅, 빛과 어둠, 그리고 모든 곳에 맡겨진 것들
  alternatives_korean:
  - 하늘과 땅, 빛과 어둠, 그리고 모든 곳에 있는 것들
  - 하늘과 땅, 빛과 어둠, 그리고 모든 곳에 기록된 것들
  lexicon: Geez ይከውን / passive participial phrase
  rationale: 도입부는 단순한 존재 진술보다 ‘맡겨진 것들’이라는 수동적·보관적 뉘앙스가 있어, 영어 POB의 committed를 살리되 한국어로는 자연스럽게 옮겼습니다.
- source_word: ሱባዔ
  english_pob_choice: weeks of years / week
  chosen_korean: 주
  alternatives_korean:
  - 주간
  - 주기
  - 칠년 주기
  lexicon: Jubilees chronology term
  rationale: 이 책의 연대 단위는 일반적 ‘주간’이 아니라 희년 체계의 계산 단위이므로, 본문에서는 간결하게 ‘주’로 두고 각주로 체계를 설명했습니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 야훼
  - 여호와
  lexicon: divine title
  rationale: 게에즈 본문은 신명문 야훼 표기가 아니라 일반적인 신칭을 사용하므로, 본문 호칭은 문맥에 맞게 ‘주님’으로 번역했습니다.
- source_word: መላእክተ፡ እግዚአብሔር ... ትጉሃነ፡
  english_pob_choice: the angels of the Lord ... Watchers
  chosen_korean: 주님의 천사들, 곧 감시자라 불리는 이들
  alternatives_korean:
  - 주님의 천사들, 곧 파수꾼이라 불리는 이들
  - 주님의 천사들, 즉 감시자들
  lexicon: Watchers / transliterated title
  rationale: 영문 POB의 Watchers는 한국어 관용어가 아니라 직역 가능한 직함이므로 ‘감시자’로 옮겨, 명칭성과 기능을 함께 드러냈습니다.
theological_decisions:
- issue: 하나님 칭호를 YHWH가 아닌 እግዚአብሔር로 처리하는 문제
  chosen_reading: 본문 전체에서 ‘주님’으로 번역하고, 야훼 표기는 사용하지 않았습니다.
  alternative_readings:
  - 야훼
  - 주
  - 여호와
  rationale: 이 절의 게에즈 본문은 여호와/야훼 고유명보다 일반적 존칭을 사용하므로, 번역도 신학적 고유명화보다 본문 표면을 따르는 것이 더 정확합니다.
  doctrine_reference: 본문 비평 및 신명 호칭 구분
