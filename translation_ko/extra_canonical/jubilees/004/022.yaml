base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/004/022.yaml
  text: And he testified to the Watchers, who had sinned with the daughters of men; for these had begun to unite themselves, so as to be defiled, with the daughters of men, and Enoch testified against them all.
  footnotes:
  - marker: a
    text: Or 'And in the fifteenth jubilee, in the third week, Lamech took for himself a wife, and her name was Betenos, the daughter of Baraki’el, his father’s brother’s daughter; and in this week she bore him a son, and he called his name Noah, saying, “This one will comfort me for my sorrow and for all my work and for the ground that Yahweh has cursed.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 사람의 딸들과 함께 죄를 지은 감시자들에게 증언했습니다. 이는 그들이 사람의 딸들과 결합하여 자신들을 더럽히기 시작했기 때문입니다. 에녹은 그들 모두를 거슬러 증언했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰትጉሃን
  english_pob_choice: the Watchers
  chosen_korean: 감시자들
  alternatives_korean:
  - 파수꾼들
  - 감찰자들
  - 지키는 자들
  lexicon: extra-canonical/Jubilees terminology
  rationale: 이 단어는 유대 묵시 전통의 고유 명칭인 Watchers를 가리키므로, 전통적 교회어보다 직역 성격의 ‘감시자들’을 택해 독자가 대상 집단을 바로 파악하도록 했습니다.
- source_word: አበሱ
  english_pob_choice: had sinned
  chosen_korean: 타락하여 ... 죄를 지은
  alternatives_korean:
  - 죄를 지은
  - 범죄한
  - 죄악을 행한
  lexicon: Geez verbal sense
  rationale: 단순한 과거 행위보다 도덕적·영적 타락의 뉘앙스가 있어 ‘타락하여’로 서두를 열고, 뒤이어 ‘죄를 지은’으로 원문의 죄책을 분명히 했습니다.
- source_word: ይደመሩ ... ይርኩሱ
  english_pob_choice: begin to unite themselves, so as to be defiled
  chosen_korean: 자신을 섞어 더럽혀지기 시작했기 때문입니다
  alternatives_korean:
  - 서로 합하여 더럽혀지기 시작했기 때문입니다
  - 결합하여 부정하게 되기 시작했기 때문입니다
  - 하나가 되어 더럽혀지기 시작했기 때문입니다
  lexicon: Geez idiom / purity language
  rationale: ‘섞다/더럽히다’는 성적·의례적 부정의 이미지를 그대로 살리면서, 원문의 ‘unite themselves’와 ‘be defiled’ 두 동작을 모두 드러내도록 했습니다.
- source_word: ወአስምዐ ... ላዕለ፡ ኵሎሙ
  english_pob_choice: Enoch testified against them all
  chosen_korean: 에녹은 그들 모두를 향해 증언했습니다
  alternatives_korean:
  - 에녹은 그들 모두를 거슬러 증언했습니다
  - 에녹은 그들 모두에 대해 증언했습니다
  - 에녹은 그들 모두를 상대로 증언했습니다
  lexicon: Geez משפט/증언 구문
  rationale: 영문 POB의 ‘against’는 대립성을 가지지만, 한국어에서는 법정적·대항적 느낌을 과장하지 않도록 ‘~을 향해 증언했습니다’로 옮겨 원문의 공적 증언 성격을 유지했습니다.
theological_decisions:
- issue: Watchers에 대한 성격과 죄의 묘사
  chosen_reading: 감시자들이 사람의 딸들과 결합하여 더럽혀지려 했다는 서술을 그대로 살려, 본문이 전제하는 초자연적 타락의 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - 천사들이 사람의 딸들과 결혼했다는 완곡한 해석
  - 단순한 인간 지도자들로 일반화하는 해석
  rationale: 이 절은 족장기·에녹 전승의 특유한 천상 존재 범주를 전제하므로, 해석을 일반화하기보다 본문이 말하는 범위를 보존하는 것이 적절합니다.
  doctrine_reference: Genesis 6:1-4 / 1 Enoch watchmen tradition
