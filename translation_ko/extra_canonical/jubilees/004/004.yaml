translation:
  language: ko
  text: 그러므로 주님께서는 가인이 그의 형제 아벨을 죽였기 때문에 가인을 저주하셨습니다.[4] 또 그 형제의 피 때문에 그가 땅에서 도망자가 되게 하셨고, 땅 위에서 그를 저주하셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '4'
    text: 현 작업 코퍼스에는 4절이 별도의 번호 행으로 보존되어 있지 않습니다. 이 절의 내용은 게에즈어 본문의 첫머리에 반복되어 있으며 5절로 이어집니다. 번역은 그 직접 문맥에 따라, 과도한 보충 없이 해당 내용을 재구성하였습니다.
    reason: segmentation_note
