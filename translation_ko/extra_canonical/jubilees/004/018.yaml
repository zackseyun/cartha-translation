translation:
  language: ko
  text: 그는 처음으로 증언을 기록하고, 땅의 여러 세대 가운데 사람의 자녀들에게 증언하였으며, 희년들의 주간들을 낱낱이 말하고 연도의 날들을 알렸으며, 달들을 차례대로 정하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዐ፡ ወአስምዐ፡
  english_pob_choice: write a testimony / testified
  chosen_korean: 증언을 기록하였고 … 증언하였으며
  alternatives_korean:
  - 증언을 남기고 … 증언하였으며
  - 증언을 써 두었고 … 알렸으며
  lexicon: 증언하다
  rationale: 동사군의 핵심은 단순한 말하기가 아니라, 기록과 증언의 이중 행위이므로 ‘증언을 기록하다’와 ‘증언하다’로 나누어 원문의 두 층위를 살렸습니다.
- source_word: ውስተ፡ ትዝምደ፡ ምድር፡
  english_pob_choice: among the generations of the earth
  chosen_korean: 땅의 세대들 가운데
  alternatives_korean:
  - 땅의 نسل 가운데
  - 세상 대대로
  lexicon: 세대
  rationale: ‘세대들’은 시간적 연속성과 인류 집단을 함께 드러내므로, 한국어에서도 ‘땅의 세대들 가운데’로 직역 성향을 유지했습니다.
- source_word: ወሱባዔሆሙ፡ ለኢዮቤልውሳት፡ ነገረ፡
  english_pob_choice: recounted the weeks of the jubilees
  chosen_korean: 희년의 주간들을 낱낱이 말하고
  alternatives_korean:
  - 희년의 주간들을 설명하고
  - 희년들의 주간들을 헤아리고
  lexicon: 주간
  rationale: ‘주간들’은 단순한 주 단위보다 구조화된 시간 구획을 가리키므로, 서술적 동사 ‘낱낱이 말하다’를 붙여 계산과 열거의 뉘앙스를 살렸습니다.
- source_word: ወአውራኅ፡ ሰርዐ፡
  english_pob_choice: set in order the months
  chosen_korean: 달들을 질서 있게 정하였으며
  alternatives_korean:
  - 달들을 ترتیب하였으며
  - 달들을 순서대로 배치하였으며
  lexicon: 질서 있게 정하다
  rationale: 달(月)을 단순히 ‘세우다’보다, 원문의 배열·정돈 의미를 드러내는 ‘질서 있게 정하다’가 더 직접적입니다.
theological_decisions:
- issue: 에녹의 행위를 서술하는 본문인지 여부
  chosen_reading: 이 절은 아담의 죽음이 아니라 에녹의 기록 행위를 말합니다.
  alternative_readings:
  - 아담이 죽고 장사되었다는 다른 절의 내용과 혼동해 번역하는 방식
  rationale: 제공된 게에즈 본문과 최신 개정 사유가 모두 이 절을 에녹의 증언과 달력 정리로 읽도록 지시하므로, 본문 정렬 오류를 반영해 번역했습니다.
  doctrine_reference: 본문대조/정렬 오류 교정
