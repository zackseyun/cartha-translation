  chosen_reading: 이 절은 아담의 죽음이 아니라 에녹의 기록 행위를 말합니다.
  alternative_readings:
  - 아담이 죽고 장사되었다는 다른 절의 내용과 혼동해 번역하는 방식
  rationale: 제공된 게에즈 본문과 최신 개정 사유가 모두 이 절을 에녹의 증언과 달력 정리로 읽도록 지시하므로, 본문 정렬 오류를 반영해 번역했습니다.
  doctrine_reference: 본문대조/정렬 오류 교정
