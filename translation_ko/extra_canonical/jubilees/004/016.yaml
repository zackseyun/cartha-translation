  text: And they did justice and uprightness upon the earth. And in the tenth jubilee[16], in the first week, Jared took for himself a wife, and her name was Baraka, the daughter of Rasujal, the daughter of his father's sister, as his wife, in the fourth year of this week; and she bore him a son in the fifth week, in the fourth year.
  footnotes:
  - marker: '16'
    text: The clause about the flood and 'the land of Eden' is difficult. The translation follows the Ethiopic as preserved, though the logic of the sentence may reflect a compressed or unstable textual tradition.
    reason: textual_variant
translation:
  language: ko
  text: 그들은 땅 위에서 정의와 올바름을 행하였습니다. 그리고 열째 희년, 첫째 주에 야렛은 아내를 맞아들였는데, 그의 이름은 바라카였습니다. 그는 라수야알의 딸, 곧 그의 아버지의 누이의 딸을 아내로 삼았으며, 이 주의 넷째 해였습니다. 그 여인은 다섯째 주의 넷째 해에 그에게 아들을 낳았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍትሐ፡ ወርተዐ፡
  english_pob_choice: justice and uprightness
  chosen_korean: 정의와 올바름
  alternatives_korean:
  - 정의와 의로움
  - 공의와 올바름
  lexicon: ፍትሕ/ፍትሐ
  rationale: 두 개의 병렬 명사로서 도덕적·사회적 바름을 함께 나타내므로, POB의 justice and uprightness를 따라 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ወበ፲ሥር፡ ወአሐዱ፡ ኢዮቤልዉ፡
  english_pob_choice: in the tenth jubilee, in the first week
  chosen_korean: 열째 희년, 첫째 주
  alternatives_korean:
  - 열 번째 희년, 첫 번째 주
  - 열째 희년, 첫째 칠일 단위
  lexicon: ኢዮቤልዉ / ሱባዔ
  rationale: 주기적 연대 표지를 그대로 살리기 위해 희년과 주를 유지했습니다. 문맥상 시간 단위의 기술이므로 통용되는 절기어휘보다 원문 구조를 우선했습니다.
- source_word: ነሥአ፡ ሎቱ፡ ያሬድ፡ ብእሲተ፡
  english_pob_choice: Jared took for himself a wife
  chosen_korean: 야렛은 아내를 맞아들였는데
  alternatives_korean:
  - 야렛은 아내를 취하였는데
  - 야렛은 자기 아내를 얻었는데
  lexicon: ነሥአ
  rationale: 히브리계 결혼 관용구로서 단순 ‘취하다’보다 혼인 개시를 드러내는 ‘아내를 맞아들이다’가 문맥을 더 분명하게 전달합니다.
- source_word: ወስማ፡ *ባረካ፡ ወለተ፡ ራሱያል፡ ወለተ፡ እኅተ፡ አቡሁ፡
  english_pob_choice: her name was Baraka, the daughter of Rasujal, the daughter of his father's sister
  chosen_korean: 그의 이름은 바라카였습니다. 그는 라수야알의 딸, 곧 그의 아버지의 누이의 딸을 아내로 삼았으며
  alternatives_korean:
  - 그의 이름은 바라카였습니다. 그는 라수야알의 딸이자 그의 아버지의 누이의 딸을 아내로 삼았으며
  - 그의 이름은 바라카였습니다. 라수야알의 딸, 그의 아버지의 누이의 딸이었습니다
  lexicon: 고유명사 및 친족 관계 표현
  rationale: 이 구절은 혼인 상대의 계보를 중첩적으로 제시하므로, 한국어에서는 ‘곧’으로 동격을 풀어 친족 관계가 같은 대상을 가리킨다는 점을 명확히 했습니다.
theological_decisions:
- issue: 희년 연대기와 혼인·출산 기록의 문체
  chosen_reading: 서사적 연대기 형식을 그대로 유지하여 사건과 연대를 평이하게 병렬했습니다.
  alternative_readings:
  - 의역하여 연대 표지를 간소화함
  - 역사 서술을 더 문학적으로 다듬음
  rationale: 이 본문은 교훈적 진술보다 연대기적 보고가 핵심이므로, 장르의 건조함을 유지하는 것이 원문의 의도에 충실합니다.
  doctrine_reference: 제1에녹·희년문학의 연대기 서술 관습
- issue: ‘정의와 올바름’의 윤리적 표현
  chosen_reading: 행위의 기준을 ‘정의와 올바름’으로 직역에 가깝게 옮겼습니다.
  alternative_readings:
  - ‘의와 바름’
  - ‘공의와 정직’
  rationale: 원문은 신앙적 칭찬을 일반 도덕어로 말하는데, 지나치게 교회식 어휘로 좁히지 않도록 했습니다.
  doctrine_reference: 성경 외경/유대 묵시문학의 윤리 언어
