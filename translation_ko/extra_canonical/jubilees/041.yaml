base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041.yaml
  text: '1[a]. And in the forty-fifth jubilee, in the second week, in the second year, Judah took

    2. for Er his firstborn a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.

    3. And Judah his father rebuked him. And that Er, Judah’s firstborn, was evil, and the LORD put him to death.

    4. And Judah said to Onan, his brother, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up

    5[b]. offspring for your brother.” And Onan knew that the offspring would not be his, as it would be his brother’s; and when he went in to his brother’s wife, he spilled the seed on the ground. And it was evil in the sight of

    6. the LORD, and he put him to death. And Judah said to Tamar his daughter-in-law, “Remain in your father’s house as a widow until my son Shelah grows up, and I will give you to him as a wife.” And he grew up, but Bedsuel, Judah’s wife, did not give Shelah her son so that he might marry her; and Bed-

    7. suel, Judah’s wife, died in the fifth year of this week. And in its sixth year Judah went up to shear his sheep at Timnah, and Tamar was told, “Look, your father-in-law is going up to Timnah to shear

    8. his sheep.” And she took off the clothes of her widowhood and put on a veil, and adorned herself,

    9. and sat at the gate that is on the road to Timnah. And as Judah was going along, he found her

    10. and thought her to be a prostitute. And he said to her, “Let me come in to you.” And she said to him, “Come in.” And he went in. And she said to him,

    11. “What will you give me?” And he said, “I will send you a kid from the goats.” And she said, “Give me a pledge until you send it.”

    27. And He will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.

    28. For he went according to the desire of his eyes and sought judgment, because from the judgment of Abraham, which he commanded his sons[c], Judah desired that she be burned with fire.'
  footnotes:
  - marker: a
    text: Verses 6–7 are segmented awkwardly in the source rows. The name Bedsuel appears as Judah’s wife, and her death belongs before Judah’s trip to Timnah. The English has been arranged to preserve the likely sense without smoothing away the textual roughness.
    reason: segmentation_note
  - marker: b
    text: The chapter rows supplied omit the middle portion of the Tamar narrative and jump from verse 11 to verses numbered 27–28. The translation reflects the fragmentary nature of the provided text.
    reason: textual_variant
  - marker: c
    text: '''Another tribe'' in verse 27 is difficult. The phrase may refer more generally to another lineage or clan rather than a formal Israelite tribe.'
    reason: lexical_alternative
translation:
  language: ko
  text: '1[a]. 그리고 제2년째 되는 제45번째 희년에 유다는

    2. 에르의 장자는 아람 여자 중에서 아내를 얻었으니 그 이름은 다말이더라 그러나 그가 그 여자를 버리고 그와 동침하지 아니하였으니 이는 그 어머니가 가나안 족속의 딸이요 또 그 어머니의 친족 중에서 아내를 삼고자 함이더라.

    3. 그리고 그의 아버지 유다가 그를 꾸짖었다. 그리고 유다의 장자 엘이 악하므로 주님께서 그를 죽이셨다.

    4. 유다가 그의 형 오난에게 이르되 네 형수에게로 들어가서 그에게 형의 의무를 행하고 그를 양육하라

    5[b]. 네 형의 자손이니라.” 그리고 오난은 그 씨가 자기 형의 것이 아니라 자기 것이 될 것임을 알았습니다. 그리고 형수에게 들어갔을 때, 그는 그 씨앗을 땅에 쏟았습니다. 그리고 그것은 보기에 악했다.

    6. 주님께서 그를 죽이셨도다 유다가 그 며느리 다말에게 이르되 내 아들 셀라가 장성할 때까지 네 아버지 집에 과부로 있어라. 내가 너를 그에게 아내로 주리라. 셀라가 장성하였으나 유다의 아내 브두엘이 셀라에게 자기 아들을 주지 아니하고 셀라와 결혼하게 하였더니 그리고 침대-

    7. 유다의 아내 수엘이 이번 주 오년에 죽었습니다. 여섯째 해에 유다가 자기 양털을 깎으러 딤나에 올라갔더니 다말이 어떤 사람에게 말하되 보라 네 시아버지가 머리털을 깎으러 딤나에 올라왔다 하였느니라

    8. 그의 양.” 그리고 그녀는 과부의 옷을 벗고 너울을 쓰고 자기를 단장하고

    9. 그리고 팀나로 가는 길 곁 문에 앉았습니다. 유다가 길을 가다가 그 여자를 만나매

    10. 그리고 그녀를 매춘부라고 생각했습니다. 그리고 그는 그녀에게 "내가 당신에게 들어가게 해주세요"라고 말했습니다. 그러자 그 여자가 그에게 “들어오세요.”라고 말했습니다. 그리고 그가 들어갔다. 그리고 그녀가 그에게 말했다.

    11. “나에게 무엇을 주실 건가요?” 그리고 그는 “내가 염소 중에서 새끼 하나를 네게 보내리라”고 말씀하셨습니다. 그리고 그녀는 “당신이 그것을 보낼 때까지 나에게 담보물을 주십시오”라고 말했습니다.

    27. 그리고 그분은 이스라엘에게서 진노와 형벌을 그치게 하실 것입니다. 그리고 유다에게는 그의 두 아들이 그 여자와 동침하지 않았으므로 그의 씨가 다른 지파를 위해 세워져 뽑히지 않았다고 말했습니다.

    28. 그가 그 눈의 뜻대로 행하며 판결을 구하였으니 이는 아브라함이 그 아들들에게 명하신 판결을 따라 유다가 그를 불에 살라버리기를 원하였음이라.'
