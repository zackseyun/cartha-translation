  text: 그들은 그들의 누이 디나를 세겜의 집에서 데리고 나왔습니다. 그리고 세겜에 있던 모든 것, 곧 그들의 양과 가축과 나귀와 모든 소유물과 모든 재물을 약탈하여, 그것을 모두 그들의 아버지 야곱에게 가져왔습니다.
