  text: And thus it must not be done from now on, to defile a daughter of Israel, for in heaven it has been ordained against them that all the men of Shechem be destroyed by the sword,
translation:
  language: ko
  text: 그러므로 이제부터는 이스라엘의 딸을 더럽히는 일을 해서는 안 됩니다. 하늘에서 세겜의 모든 남자들이 칼로 멸망하도록 그들에 대하여 정해졌기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “it must not be done from now on”
  english_pob_choice: it must not be done from now on
  chosen_korean: 이제부터는 더 이상 … 해서는 안 됩니다
  alternatives_korean:
  - 이제부터는 … 해서는 안 됩니다
  - 이제는 … 해선 안 됩니다
  lexicon: implied prohibition
  rationale: 원문의 금지·전환 표지를 살려 현재 시점 이후의 행위를 강하게 금지하는 표현으로 옮겼습니다.
- source_word: “to defile a daughter of Israel”
  english_pob_choice: to defile a daughter of Israel
  chosen_korean: 이스라엘의 딸을 더럽히는 일
  alternatives_korean:
  - 이스라엘의 딸을 욕되게 하는 일
  - 이스라엘의 딸을 부정하게 하는 일
  lexicon: defile
  rationale: ‘더럽히다’는 성적·의례적 오염의 폭을 함께 유지하면서도 본문의 직접적 의미를 자연스럽게 전달합니다.
- source_word: “in heaven it has been ordained against them”
  english_pob_choice: in heaven it has been ordained against them
  chosen_korean: 하늘에서 그들에 대해 이렇게 정해져 있었기 때문입니다
  alternatives_korean:
  - 하늘에서 그들에 대한 명령이 내려져 있었기 때문입니다
  - 하늘에서 그들에 대해 결정되어 있었기 때문입니다
  lexicon: ordained in heaven
  rationale: 천상적 결정의 수동형 의미를 살려, 단순한 계획이 아니라 이미 정해진 판결이라는 뉘앙스를 유지했습니다.
- source_word: “be destroyed by the sword”
  english_pob_choice: be destroyed by the sword
  chosen_korean: 칼에 의해 멸망해야 한다는 것입니다
  alternatives_korean:
  - 칼로 멸망해야 한다는 것입니다
  - 칼에 의해 진멸되어야 한다는 것입니다
  lexicon: destroyed by the sword
  rationale: 무기 수단을 드러내기 위해 ‘칼에 의해’를 유지했고, 전멸의 강도를 살리되 한국어에서 과도하게 기술적인 ‘진멸’보다 ‘멸망’을 택했습니다.
theological_decisions:
- issue: 천상에서의 ‘정해짐’과 인간 행위의 책임 관계
  chosen_reading: 본문은 세겜 남자들의 처벌이 우발적 보복이 아니라 하늘에서 이미 정해진 판결임을 강조합니다.
  alternative_readings:
  - 단순 예언적 진술로 완화하는 읽기
  - 사후적 정당화로만 보는 읽기
  rationale: 게즈 본문과 영어 POB의 ‘ordained’/‘be destroyed’ 흐름을 따라, 신적 결정을 전면에 두는 문맥을 보존했습니다.
  doctrine_reference: 섭리와 심판의 주권
