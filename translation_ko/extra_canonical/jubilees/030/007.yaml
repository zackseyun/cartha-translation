  to: 이와 같이 이스라엘에는 이스라엘 사람인 처녀를 더럽히는 자가 있어서는 안 됩니다. 또 이스라엘 안에서 어떤 사람이 자기 딸이나 심지어 자기 누이를 이방 민족의 후손인 어떤 남자에게 주려 하거든, 그는 반드시 죽어야 하며, 그들은 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 가운데서 수치스러운 일을 행했기 때문입니다. 그리고 그 여자에 대해서는,
