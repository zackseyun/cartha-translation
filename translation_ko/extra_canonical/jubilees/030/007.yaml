  text: Thus, there shall not be in Israel one who defiles an Israelite virgin. And if there is any man in Israel who wishes to give his daughter, or even his sister, to any man from the seed of the nations, he shall surely die, and they shall stone him with stones, because he has committed shame in Israel. And as for the woman,
  footnotes:
  - marker: a
    text: Or ', and the woman also.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 이스라엘에는 이스라엘 사람인 처녀를 더럽히는 자가 있어서는 안 됩니다. 또 이스라엘에서 어떤 사람이 자기 딸이나 심지어 자기 누이를 민족들의 씨에서 난 어떤 남자에게 주려 하거든, 그는 반드시 죽어야 하며, 그들은 그를 돌로 쳐야 합니다. 이는 그가 이스라엘 가운데서 수치스러운 일을 행했기 때문입니다. 그리고 여자도 마찬가지입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንከ፡ ከመዝ፡
  english_pob_choice: Thus
  chosen_korean: 이와 같이
  alternatives_korean:
