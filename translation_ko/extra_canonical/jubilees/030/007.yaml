  - 그리하여
  lexicon: source discourse marker
  rationale: 문두의 결론/요약 표지를 한국어로 자연스럽게 살리면서도, 단순 접속사보다 원문의 서술 시작 기능을 드러내기 위해 ‘이와 같이’를 선택했습니다.
- source_word: አርኵሶ፡ ድንግለ፡ እስራኤላዊት።
  english_pob_choice: one who defiles an Israelite virgin
  chosen_korean: 이스라엘 사람인 처녀를 더럽히는 자
  alternatives_korean:
  - 이스라엘 처녀를 욕보이는 자
  - 이스라엘의 동정을 더럽히는 자
  lexicon: source verb / noun phrase
  rationale: ‘더럽히다’는 원문의 성적·의례적 오염 감각을 보존하며, ‘처녀’는 Ge'ez의 ድንግለ와 문맥을 따라 직접 옮겼습니다.
- source_word: የሀብ፡ ወለተ፡ ወእመኒ፡ እኅተ፡
  english_pob_choice: give his daughter, or even his sister
  chosen_korean: 자기 딸이나 심지어 자기 누이를 주려 하거든
  alternatives_korean:
  - 자기 딸이나 자기 누이까지 주려 하거든
  - 자기 딸 또는 누이를 내주려 하거든
  lexicon: kinship terms / giving verb
  rationale: ‘주다’는 인도 행위로서의 결혼/양도 뉘앙스를 유지하고, ‘심지어’로 누이가 더 강한 충격을 주는 확장임을 드러냈습니다.
- source_word: ዘፈቀደ፡ በውስተ፡ እስራኤል፡
  english_pob_choice: because he has committed shame in Israel
  chosen_korean: 이는 그가 이스라엘 가운데서 수치스러운 일을 행했기 때문입니다
  alternatives_korean:
  - 이는 그가 이스라엘에서 수치를 저질렀기 때문입니다
  - 이는 그가 이스라엘 가운데서 부끄러운 일을 했기 때문입니다
  lexicon: shame idiom
  rationale: ‘수치스러운 일’을 통해 행위 자체의 객관적 수치를 살리고, ‘행했기 때문입니다’로 법적 판결문의 설명 구조를 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 마지막 절단형 표현 ‘And as for the woman,’의 처리
  chosen_reading: 문맥상 다음 절로 넘어가는 전면화 표현이므로 ‘그리고 여자도 마찬가지입니다’로 마무리했습니다.
  alternative_readings:
  - 그리고 여자에 대해서는
  - 그리고 여자도
  rationale: Ge'ez 원문과 영어 공시본의 개정 이력은 이 말이 다음 절의 처분 대상으로 여자를 끌어올리는 역할임을 보이므로, 한국어에서는 다음 절로 이어지는 장치를 드러내되 오독을 피하는 쪽을 택했습니다.
