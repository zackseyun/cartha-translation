  text: '이는 이스라엘의 모든 자손에 관하여 이와 같이 정해져 있고 하늘의 판들에 기록되어 있기 때문입니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  english_pob_choice: it has been ordained
  chosen_korean: 정해져 있고
  alternatives_korean:
  - 제정되어 있고
  - 규정되어 있고
  - 명령되어 있고
  lexicon: 공식적 결정·배정의 의미
  rationale: Geez 원문은 단순한 ‘기록’이 아니라 이미 정해진 질서를 뜻하므로, 과도한 법률 용어보다 자연스럽게 ‘정해져 있고’로 옮겼습니다.
- source_word: ወተጽሕፈ
  english_pob_choice: and written
  chosen_korean: 기록되어 있기
  alternatives_korean:
  - 쓰여 있기
  - 적혀 있기
  - 기재되어 있기
  lexicon: 기록/기재 의미
  rationale: 하늘의 판에 새겨진 내용을 가리키므로 ‘기록되어 있기’가 원문의 문어적이고 지속적인 상태를 잘 드러냅니다.
- source_word: ጽላተ ሰማይ
  english_pob_choice: the heavenly tablets
  chosen_korean: 하늘의 판
  alternatives_korean:
  - 하늘의 돌판
  - 하늘의 서판
  - 천상의 판
  lexicon: 천상 기록판
  rationale: ‘판’은 원문의 물질적·상징적 이미지를 살리면서도 한국어에서 과도하게 종교화된 표현을 피합니다.
- source_word: በእንተ
  english_pob_choice: concerning
  chosen_korean: —을 두고 한
  alternatives_korean:
  - —에 관해
  - —에 대하여
  - —을 두고
  lexicon: 전치사/주제 표지
  rationale: 문맥상 ‘모든 이스라엘의 씨에 관한’이라는 뜻이므로, ‘두고 한’으로 자연스럽게 연결했습니다.
- source_word: ዘርአ እስራኤል
  english_pob_choice: the seed of Israel
  chosen_korean: 이스라엘의 모든 씨
  alternatives_korean:
  - 이스라엘의 모든 자손
  - 이스라엘의 씨앗
  - 이스라엘의 후손
  lexicon: 씨/후손 표현
  rationale: POB의 ‘seed’ 선택을 따라 문자성을 유지하되, 한국어에서는 ‘씨’가 단독으로는 어색하므로 ‘모든 씨’로 옮겨 집합적 의미를 살렸습니다.
theological_decisions:
- issue: 천상 기록의 권위
  chosen_reading: ‘하늘의 판에 기록되어 있다’는 표현을 문자적으로 유지하여, 이 결정이 인간의 임의가 아니라 천상에서 이미 확정된 질서임을 드러냈습니다.
  alternative_readings:
  - 상징적으로 완곡하게 풀어 ‘하나님의 뜻으로 정해졌다’고 옮김
  - ‘천상의 책에 적혔다’로 일반화
  rationale: 외경적 우주 문서 이미지 자체가 본문의 신학적 핵심이므로, 의미를 약화시키지 않고 보존했습니다.
  doctrine_reference: 천상 기록/예정 모티프
