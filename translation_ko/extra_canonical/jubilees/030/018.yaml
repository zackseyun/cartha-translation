  terminology: ‘만유의 하나님’, ‘축복’, ‘의’는 적절합니다. 다만 ‘돌판’은 원문 및 영어 감사 문구의 heavenly tablets가 명시하지 않는 재질을 특정하므로 ‘판들’로 고칩니다.
