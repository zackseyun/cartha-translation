  source_fidelity: 초안은 ‘그를 위하여’, ‘하늘의 판들’, ‘축복과 의’, ‘만유의 하나님 앞에서’라는 핵심 요소를 대체로 충실히 옮겼습니다. 다만 ‘하늘의 돌판’은 원문의 ‘하늘의 판들/서판들’에 돌이라는 재질을 덧붙입니다. 본문은 ‘그들’과 ‘그’를 문맥상 특정하지 않으므로 그 모호성도 유지하는 것이 적절합니다.
