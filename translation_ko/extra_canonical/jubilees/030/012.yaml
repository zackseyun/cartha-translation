- from: 그것이 야훼 앞에 가증스러운 것이기 때문입니다. 그러므로 나는 율법의 말들로 너희를 위해 세켐 사람들이 디나에게 행한 모든 일과, 야곱의 아들들이 말한 것을 기록했습니다.[a]
  to: 그것은 야훼 앞에서 가증한 일이기 때문입니다. 그러므로 나는 너를 위하여 율법의 말씀 속에 세켐 사람들이 디나에게 행한 모든 일과 야곱의 아들들이 어떻게 말했는지를 기록했습니다:[a]
  rationale: 단수 수신자, ‘율법의 말씀 안에’라는 공간적 표현, 세켐 주민을 가리키는 복수형, 그리고 다음 절로 이어지는 인용 도입을 바로잡았습니다. 누락된 각주도 추가하여 표지와 각주의 구조를 일치시켰습니다.
