  text: because it is an abomination before the LORD. Therefore I have written for you in the words of the law all the deeds of the Shechemites that they did against Dinah, and how the sons of Jacob spoke, saying,
  footnotes:
  - marker: a
    text: Or 'the deeds of Shechem that they did'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것이 야훼 앞에 가증스러운 것이기 때문입니다. 그러므로 나는 율법의 말들로 너희를 위해 세켐 사람들이 디나에게 행한 모든 일과, 야곱의 아들들이 말한 것을 기록했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ እግዚአብሔር
  english_pob_choice: before the LORD
  chosen_korean: 야훼 앞에
  alternatives_korean:
  - 주 앞에
  - 여호와 앞에
  lexicon: YHWH
  rationale: 본문의 ‘the LORD’는 다름 아닌 야훼를 가리키므로, 프로젝트 기본어인 ‘야훼’로 옮겨 원천어의 신명 표지를 분명히 했습니다.
- source_word: ምኑን ውእቱ
  english_pob_choice: it is an abomination
  chosen_korean: 가증스러운 것
  alternatives_korean:
  - 가증한 일
  - 혐오스러운 것
  lexicon: תועבה / general abomination
  rationale: Geez 표현은 행위 자체를 ‘가증스러운 것’으로 규정하는 서술이므로, 명사구로 처리해 영어 수정본의 형식을 살리면서도 의미를 직역했습니다.
- source_word: ውስተ ቃለ ሕግ
  english_pob_choice: in the words of the law
  chosen_korean: 율법의 말들로
  alternatives_korean:
  - 율법의 말씀으로
  - 율법의 문구로
  lexicon: תורה
  rationale: ‘law’는 여기서 일반 법이 아니라 율법 전승을 뜻하므로 ‘율법’으로 두었고, ‘words’는 복수성을 살려 ‘말들’로 옮겼습니다.
- source_word: ግብሮሙ ለሴቄማ
  english_pob_choice: the deeds of the Shechemites
  chosen_korean: 세켐 사람들이 행한 모든 일
  alternatives_korean:
  - 세켐 사람들의 모든 행위
  - 세켐 사람들의 일
  lexicon: proper noun + collective plural
  rationale: 영어 수정본이 복수 주어를 반영해 ‘Shechemites’로 정리한 점을 따라, 지명형 고유명사보다 주민 집단을 나타내는 표현으로 옮겼습니다.
- source_word: ደቂ ያዕቆብ
  english_pob_choice: the sons of Jacob
  chosen_korean: 야곱의 아들들
  alternatives_korean:
  - 야곱의 자녀들
  - 야곱의 아들들이
  lexicon: patronymic
  rationale: 족보적 관용구를 그대로 살려 ‘야곱의 아들들’로 옮겨, 영어 수정본의 더 격식 있는 어순과도 맞췄습니다.
theological_decisions:
- issue: 야훼 표기 사용
  chosen_reading: 구약적 신명 표지를 본문에서 ‘야훼’로 직접 표기했습니다.
  alternative_readings:
  - 주
  - 여호와
  rationale: 공동체 전통어보다 원천어의 신명 기능을 드러내는 것이 이 사본의 공개 번역 철학에 더 부합합니다.
  doctrine_reference: 출 3:15; 시 83:18
