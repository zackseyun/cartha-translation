revisions:
- from: 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 그리고 그 땅에 사는 가나안 사람들과 브리스 사람들을 두려워하여 그들이 그 성읍을 멸망시켰다고 그들에게 말했습니다. 주님께서 세겜 주변 모든 성읍에 크게 두려우셨으므로 그들이 일어나 야곱의 아들들을 추격하지 못하였으니 이는 그들이 두려워함이었더라.
  to: 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 야곱은 그 땅에 사는 사람들, 곧 가나안 사람들과 브리스 사람들을 두려워했기 때문에, 그들이 그 성읍을 멸망시킨[a] 일에 대하여 그들과 말했습니다. 야훼의 공포가 세겜 주변의 모든 성읍에 임하였으므로, 그들은 일어나 야곱의 아들들을 추격하지 않았습니다. 두려움이 그들에게 내렸기 때문입니다.
  rationale: 야훼의 공포가 주변 성읍들에 임했다는 구문을 정확히 바로잡고, 야곱이 아들들과 성읍의 멸망에 관해 말한 상황 및 주민들을 두려워한 이유를 명료하게 했습니다. 원문의 폭력적 도시 의인화 표현은 본문에서 자연스럽게 번역하고 각주로 직역을 보존했습니다.
  reviewer_model: gpt-5.6-terra
