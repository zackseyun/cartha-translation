translation:
  language: ko
  text: 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 그리고 그 땅에 사는 가나안 사람들과 브리스 사람들을 두려워하여 그들이 그 성읍을 멸망시켰다고 그들에게 말했습니다. 주님께서 세겜 주변 모든 성읍에 크게 두려우셨으므로 그들이 일어나 야곱의 아들들을 추격하지 못하였으니 이는 그들이 두려워함이었더라.
