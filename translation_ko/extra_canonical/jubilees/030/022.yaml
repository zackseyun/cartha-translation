    text: Or 'killed the city'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그것을 모두 자기 아버지 야곱에게 가져왔습니다. 야곱은 그 땅에 사는 사람들, 곧 가나안 사람들과 브리스 사람들을 두려워했기 때문에, 그들이 그 성읍을 멸망시킨[a] 일에 대하여 그들과 말했습니다. 야훼의 공포가 세겜 주변의 모든 성읍에 임하였으므로, 그들은 일어나 야곱의 아들들을 추격하지 않았습니다. 두려움이 그들에게 내렸기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 성읍을 죽인’입니다.
    reason: 원문은 성읍을 목적어로 하여 ‘죽이다’라는 동사를 쓰는 관용적 표현입니다. 본문에서는 자연스러운 한국어 표현인 ‘멸망시키다’를 사용하되, 영어 POB 감사 기록의 대안 ‘killed the city’에 해당하는 직역 가능성을 보존합니다.
