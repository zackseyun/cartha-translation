  - 열두 해였습니다
  lexicon: —
  rationale: 연령을 자연스러운 현대 한국어로 옮기되, 단정적인 서술을 유지했습니다.
- source_word: ትትወሀብ፡ ሎቱ፡ ብእሲተ
