  text: And she was twelve years old. And he asked from her father and from her brothers that she be given to him as a wife. And Jacob and his sons were angry because of the men of Shechem, because they had defiled Dinah their sister.
  footnotes:
  - marker: a
    text: Or 'the city of Shechem'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀는 열두 살이었습니다. 그리고 그가 아버지와 형제들에게 그녀를 자기의 아내로 주어 달라고 요청했습니다. 야곱과 그의 아들들은 세겜의 남자들 때문에 분노했습니다. 그들이 그들의 누이 디나를 더럽혔기 때문입니다.
  philosophy: optimal-equivalence
