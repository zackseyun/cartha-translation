  lexicon: —
  rationale: 검증된 원문 의미인 ‘남자들’(남성들)을 살리면서 지명 구성을 한국어로 자연스럽게 처리했습니다.
- source_word: እስመ፡ አርኰስዋ፡ ለዲና፡ እኅቶሙ
  english_pob_choice: because they had defiled Dinah their sister
  chosen_korean: 그들이 그들의 누이 디나를 더럽혔기 때문입니다
