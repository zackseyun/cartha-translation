translation:
  language: ko
  text: 그때 소녀는 열두 살이었습니다. 그리고 그가 아버지와 형제들에게 그녀를 자기의 아내로 주어 달라고 요청했습니다. 야곱과 그의 아들들은 세겜의 남자들 때문에 분노했습니다. 그들이 그들의 누이 디나를 더럽혔기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፲ወ፪ዓመት
  english_pob_choice: And she was twelve years old.
  chosen_korean: 열두 살이었습니다
  alternatives_korean:
