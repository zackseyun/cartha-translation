review_pass:
  verdict: revise
  source_fidelity: 원문은 레위의 자손이 제사장직과 레위인의 직무를 위해 선택되었다고 하며, 그들이 화자인 천상 존재들과 같이 항상 주님 앞에서 섬기게 된다고 말합니다. 또한 레위의 열심의 대상은 이스라엘을 대적하여 일어난 자들입니다.
  naturalness: 초안의 ‘제사장의 직분과 레위 사람을 삼으셨으니’는 병렬 관계가 어색하고, ‘공의와 공의와 보수’는 명백한 중복 및 부자연스러운 표현입니다. 현대 표준어 합쇼체로 매끄럽게 고쳤습니다.
  terminology: ‘제사장직’, ‘레위인’, ‘주님 앞에서 섬기다’, ‘의와 심판과 보복’은 문맥과 원문의 법정적·서사적 어휘를 반영합니다. ‘보복’은 원문의 vengeance를 교리적으로 완화하지 않고 옮긴 것입니다.
  issues:
  - severity: high
    issue: ‘공의와 공의와 보수’
    rationale: 영어 감사본의 ‘righteousness and judgment and vengeance’ 및 원문의 세 항목을 반영하지 못하고 ‘공의’가 중복되었습니다. ‘보수’도 이 문맥에서 vengeance의 자연스러운 번역이 아닙니다.
  - severity: medium
    issue: ‘제사장의 직분과 레위 사람을 삼으셨으니’
    rationale: 레위 자손이 제사장직을 맡고 레위인이 되도록 택함을 받았다는 뜻이 불명확하고 한국어 병렬이 부자연스럽습니다.
  - severity: low
    issue: 각주 앵커의 설명 대상
    rationale: 각주는 ‘우리가 항상 하는 것 같이’라는 표현의 천상 화자 관점을 설명하므로 해당 구절 바로 뒤에 유지해야 합니다.
  revised_text: 레위의 자손은 제사장직을 맡고 레위인이 되도록 택함을 받았습니다. 이는 그들이 우리가 언제나 하는 것처럼 주님 앞에서 섬기게 하려 하심입니다._FN0__ 레위와 그의 아들들은 영원히 복을 받을 것입니다. 이는 그가 이스라엘을 대적하여 일어난 모든 자에게 의와 심판과 보복을 행하는 일에 열심을 냈기 때문입니다.
  revised_footnotes:
  - marker: FN0
    text: ‘우리가 언제나 하는 것처럼’은 희년서의 시내산 계시 틀 안에서 천상 화자가 말하는 관점을 반영합니다.
    reason: ‘우리가 언제나 하는 것처럼’의 화자 관점을 설명하는 교차 참고 각주입니다.
  revision_rationale: 레위 자손의 선택 목적을 ‘제사장직을 맡고 레위인이 되도록’으로 명료하게 옮기고, 세 개의 법정·윤리 용어를 ‘의와 심판과 보복’으로 복원했습니다. 천상 화자의 ‘우리’는 본문에 보존하고, 그 특수한 관점은 해당 구절에 붙인 각주로 설명했습니다.
