translation:
  language: ko
  text: 레위 자손은 제사장의 직분과 레위 사람을 삼으셨으니 이는 우리가 항상 하는 것 같이 그들도 주님 앞에서 섬기게 하려 하심이니_FN0__. 레위와 그의 아들들은 영원히 복을 받으리니 이는 그가 이스라엘을 대적하는 모든 자에게 공의와 공의와 보수를 행하기를 열심하였음이라.
  philosophy: optimal-equivalence
