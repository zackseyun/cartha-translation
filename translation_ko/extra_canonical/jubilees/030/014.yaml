translation:
  language: ko
  text: 그리고 그것은 이스라엘에게 가증한 것입니다. 그리고 이방 민족의 딸들 가운데 한 여자를 아내로 둔 이스라엘은 이 부정함에서 깨끗하게 되지 못할 것입니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: ወምኑን፡ ውእቱ፡
  english_pob_choice: And it is
  chosen_korean: 그리고 그것은
  alternatives_korean:
  - 그리고 그것은 ~입니다
  - 그리고 그것은 ~한 것입니다
  lexicon: source-note
  rationale: 게에즈 원문은 문장 주어를 분명히 하며, 영어 개정처럼 ‘it is’를 드러내 한국어도 ‘그것은’으로 보존했습니다.
- source_word: ለእስራኤል
  english_pob_choice: for Israel
  chosen_korean: 이스라엘에게
  alternatives_korean:
  - 이스라엘을 위해
  - 이스라엘에 대하여
  lexicon: source-note
  rationale: 여기서의 전치사 관계는 이스라엘을 향한 평가를 나타내므로 ‘이스라엘에게’가 가장 자연스럽고 직접적입니다.
- source_word: ኢይነጽሕ
  english_pob_choice: will not be cleansed
  chosen_korean: 깨끗하게 되지 못할 것입니다
  alternatives_korean:
  - 정결하게 되지 못할 것입니다
  - 깨끗해지지 않을 것입니다
  lexicon: source-note
  rationale: 부정된 수동 의미를 살리되, 의례적 ‘정결’에만 고정하지 않고 부정함에서 벗어나지 못한다는 의미를 한국어로 분명히 했습니다.
- source_word: ርኵስ
  english_pob_choice: uncleanness
  chosen_korean: 부정함
  alternatives_korean:
  - 더러움
  - 불결함
  - 부정
  lexicon: source-note
  rationale: 문맥상 제의적·도덕적 오염을 함께 가리키는 표현이므로, 한국어 성경에서 익숙하면서도 의미 범위가 넓은 ‘부정함’을 채택했습니다.
- source_word: ዘቦ፡ ብእሲት፡
  english_pob_choice: who has a wife
  chosen_korean: 아내로 둔
  alternatives_korean:
  - 아내가 있는
  - 한 여자를 가진
  lexicon: source-note
  rationale: 최신 검토가 지적하듯 이 구는 단순히 ‘여자가 있다’가 아니라 소유·관계 표현이므로, 유다인 남편이 이방 여자를 아내로 둔 상황을 드러내는 ‘아내로 둔’으로 옮겼습니다.
theological_decisions:
- issue: 이방 민족 여성과의 결혼을 정죄하는 서술의 강도
  chosen_reading: 직설적이고 규범적인 경고문으로 유지했습니다.
  alternative_readings:
  - 완곡하게 풀어 경계 설명으로 바꾸는 읽기
  - 문화사적 설명을 덧붙이는 읽기
  rationale: 원문은 이 관행을 ‘가증한 것’과 ‘부정함’으로 단정하므로, 한국어도 그 도덕·제의적 강도를 약화시키지 않았습니다.
  doctrine_reference: 율법/정결 규정의 서술적·규범적 성격
