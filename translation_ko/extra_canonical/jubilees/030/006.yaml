translation:
  language: ko
  text: 그들이 이스라엘에서 수치를 저질렀기 때문입니다. 주님께서는 야곱의 아들들의 손에 그들을 넘기셔서, 그 아들들이 칼로 그들을 멸하고 그들에게 이 일을 행하게 하셨으며, 다시는 그런 일이 일어나지 않게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘칼로 그들을 죽이고’.
    reason: 게에즈어 ሠረወ는 ‘멸하다, 근절하다’의 강한 의미를 지니지만, 문맥상 ‘죽이다’로도 옮길 수 있다는 영문 POB 감사 이력의 대안 독법을 반영합니다.
lexical_decisions:
- source_word: ኀፍረተ፡
  english_pob_choice: committed shame
  chosen_korean: 수치를 저질렀기 때문입니다
  alternatives_korean:
  - 부끄러운 일을 저질렀기 때문입니다
  - 수치스러운 일을 행했기 때문입니다
  lexicon: Ge'ez ኀፍረት
  rationale: 행위의 도덕적 수치와 공동체적 치욕을 함께 살리기 위해 ‘수치’를 택했고, 동사로는 자연스러운 현대 한국어 표현인 ‘저질렀다’를 썼습니다.
- source_word: ወመጠዎሙ፡ እግዚአብሔር፡ ውስተ፡ እዴ፡
  english_pob_choice: And the LORD delivered them into the hand of Jacob's sons
  chosen_korean: 주님께서는 야곱의 아들들의 손에 그들을 넘기셔서
  alternatives_korean:
  - 주님께서는 야곱의 아들들의 손에 그들을 넘겨주셔서
  - 야훼께서 야곱의 아들들의 손에 그들을 넘기셔서
  lexicon: Ge'ez እግዚአብሔር
  rationale: 이 문맥의 신적 주어는 POB 기본 관례에 따라 ‘주님’으로 옮겼고, 수동적 인도/인계의 의미는 ‘넘기셔서’로 자연스럽게 살렸습니다.
- source_word: ይሠርውዎሙ፡ በሰይፍ፡
  english_pob_choice: destroy them with the sword
  chosen_korean: 칼로 그들을 멸하고
  alternatives_korean:
  - 칼로 그들을 죽이고
  - 칼로 그들을 멸망시키고
  lexicon: Ge'ez ሠረወ
  rationale: 영문 POB의 ‘destroy’와 게에즈 동사의 강한 제거/근절 뉘앙스를 반영해, 단순 살해보다 강한 ‘멸하다’를 택했습니다.
- source_word: ከመ፡ ኢይኩን፡
  english_pob_choice: so that it might not be done again
  chosen_korean: 다시는 그런 일이 일어나지 않게 하셨습니다
  alternatives_korean:
  - 다시는 행해지지 않게 하셨습니다
  - 다시는 그렇게 되지 않게 하셨습니다
  lexicon: Ge'ez ኢይኩን
  rationale: 원문의 목적절을 미래 반복 금지로 옮기되, 한국어에서 가장 자연스럽게 이해되는 사건 지시 표현 ‘그런 일’로 압축했습니다.
theological_decisions:
- issue: 주님(신적 주어) 호칭의 번역
  chosen_reading: 주님
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 이 절은 역사 서술 속 신적 행위자이므로 본문 흐름을 해치지 않는 ‘주님’을 사용했고, 본문 자체가 구약 인용문이 아닌 이상 여기서는 고유명 표기를 전면화하지 않았습니다.
  doctrine_reference: divine_name_rendering
- issue: ‘멸하다’의 강도
  chosen_reading: 칼로 그들을 멸하고
  alternative_readings:
  - 칼로 그들을 죽이고
  - 칼로 그들을 없애고
  rationale: 게에즈 동사의 어감은 단순 살해보다 완전한 제거에 가깝기 때문에, 본문이 허용하는 범위 안에서 더 강한 파괴적 의미를 유지했습니다.
  doctrine_reference: lexical_semantics
