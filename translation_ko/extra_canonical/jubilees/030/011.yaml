  - 또 그들의 아들들을 위하여 이방 민족의 딸들 가운데서 아내를 맞이하지 못하게 하라
  lexicon: N/A
  rationale: 원문의 ‘take wives for their sons’를 직역하되, 혼인 주체와 대상의 관계를 분명히 드러내기 위해 ‘아내를 취하다’를 택했습니다.
theological_decisions:
- issue: 민족들(nations)과 혼인 금지의 범위
  chosen_reading: 원문이 특정 민족 하나가 아니라 ‘민족들’ 전체를 지칭하므로, 역사적·신학적 경계를 일반화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 이방인으로 일반화하여 번역
  - 가나안 족속으로 좁혀 번역
  rationale: 게으즈 본문과 POB 영어 모두 보편적 복수 표현을 유지하므로, 특정 집단으로 축소하지 않는 것이 원문 충실도에 부합합니다.
  doctrine_reference: 혼인·언약 경계에 관한 토라적 금지의 본문적 맥락 유지
- issue: ‘증언하다’의 법정적/권면적 뉘앙스
  chosen_reading: 단순 정보 전달이 아니라 경고를 동반한 공식 증언으로 이해해 ‘증언하다’를 사용했습니다.
  alternative_readings:
  - 들려주다
  - 알리다
  rationale: POB가 직전까지의 ‘make it heard to them’보다 ‘testify to them’을 채택한 점을 반영하여, 권위 있는 경고의 성격을 살렸습니다.
  doctrine_reference: 언약 규정 선포와 경고의 선지자적 기능
