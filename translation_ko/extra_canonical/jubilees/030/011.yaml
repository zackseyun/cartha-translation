  source_fidelity: 게에즈어 본문의 두 명령(이스라엘 자손에게 명령하라 / 그들에게 증언·경고하라)과, 딸들을 민족들에게 주지 말며 아들들을 위해 민족들의 딸 가운데서 아내를 취하지 말라는 두 금지를 충실히 반영합니다. 다만 초안의 ‘그들에게 증언하여’는 한국어에서 무엇을 증언하는지 불완전하게 들리고, ‘아들들을 위하여 … 아내를 취하다’도 현대 한국어로 다소 부자연스럽습니다.
  naturalness: ‘너 모세는’보다 직접 호칭인 ‘너 모세야’가 본문의 호격에 자연스럽고, ‘엄중히 경고하여라’는 해당 관용구의 공식적 경고 기능을 현대 합쇼체 성서 문체로 자연스럽게 전달합니다. ‘아들들을 위해 … 아내를 맞이하지 못하게’는 혼인을 부모·공동체가 아들을 위해 주선하는 원문의 구문을 보존하면서도 자연스럽습니다.
  terminology: ‘이스라엘 자손’, ‘민족들’, ‘아내’는 유지합니다. ‘민족들’을 ‘이방 민족’이나 특정 집단으로 좁히지 않았습니다. ‘증언하다’의 문자적 법정 뉘앙스는 문맥상 규범을 엄중히 알리고 경고하는 기능으로 옮겼습니다.
