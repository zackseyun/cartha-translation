base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/010.yaml
  text: whoever defiles it shall surely die[10], and he shall be stoned with stones. And there is no limit of days for this law, and no remission or any atonement, except that the man should be rooted out who has defiled a daughter in the midst of all Israel, because he has given of his seed to Molech and has acted wickedly so as to defile it.
  footnotes:
  - marker: '10'
    text: The Molech clause is abrupt in context. The Ethiopic text preserves it, and it may function as a broader analogy between illicit seed and cultic defilement.
    reason: textual_variant
  - marker: a
    text: Or 'they should put to death at once the man'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것을 더럽히는 자는 반드시 죽을 것이며, 돌로 쳐질 것입니다. 이 율법에는 기간 제한이 없고, 용서도 어떤 속죄도 없습니다. 오직 온 이스라엘 가운데서 딸을 더럽힌 그 사람은 뽑혀 나갈 것입니다. 이는 그가 자기 씨를 몰렉에게 주고 악을 행하여 그것을 더럽혔기 때문입니다.[10]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '10'
    text: 몰렉에 관한 절은 문맥에서 갑작스럽게 나타납니다. 에티오피아어 본문은 이 표현을 보존하고 있으며, 불법적인 씨와 제의적 더러움 사이의 더 넓은 유비로 기능할 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ዘያረኵስ / defiles
  english_pob_choice: whoever defiles it
  chosen_korean: 그것을 더럽히는 자
  alternatives_korean:
  - 그것을 속되게 하는 자
  - 그것을 부정하게 하는 자
  lexicon: defile/unclean
  rationale: 문맥상 성적·제의적 더러움이 함께 걸려 있으므로, 한국어에서는 가장 직접적이고 폭넓게 뜻을 드러내는 ‘더럽히다’를 택했습니다.
- source_word: ሞተ ለይሙት / shall surely die
  english_pob_choice: shall surely die
  chosen_korean: 반드시 죽임을 당하고
  alternatives_korean:
  - 반드시 죽을 것이고
  - 반드시 죽임을 받아
  lexicon: die
  rationale: 게으즈 원문의 강한 확정 표현을 살리되, 한국어에서 자연스럽게 형벌 집행을 드러내는 수동형으로 옮겼습니다.
- source_word: ወበእብን ይትወገር / stoned with stones
  english_pob_choice: stoned with stones
  chosen_korean: 돌로 쳐질 것입니다
  alternatives_korean:
  - 돌로 돌맞을 것입니다
  - 돌로 쳐 죽일 것입니다
  lexicon: stone
  rationale: ‘돌들로’라는 반복을 자연스럽게 풀어 주면서도, 실제 처형 방식이라는 점을 분명히 했습니다.
- source_word: ይሤረው / shall be rooted out
  english_pob_choice: the man should be rooted out
  chosen_korean: 그 사람은 뽑혀 나가야 합니다
  alternatives_korean:
  - 그 사람은 뿌리째 뽑혀야 합니다
  - 그 사람은 끊어져야 합니다
  lexicon: cut off/root out
  rationale: 영어 POB와 최신 주석이 지적한 대로 본 동사는 ‘죽이다’가 아니라 공동체에서 뽑혀 나가는 뜻이므로, 문자적 이미지가 살아 있는 표현을 택했습니다.
- source_word: ሕግ / law
  english_pob_choice: this law
  chosen_korean: 이 율법
  alternatives_korean:
  - 이 법
  - 이 규정
  lexicon: law/Torah
  rationale: 여기서는 일반 법이 아니라 공동체를 규정하는 규범이므로, 프로젝트 기본어인 ‘율법’을 유지했습니다.
theological_decisions:
- issue: 몰렉에게 씨를 주었다는 표현의 해석
  chosen_reading: 문맥이 갑작스럽더라도 ‘자기 씨를 몰렉에게 주어’라는 말을 그대로 살려, 제의적 타락과 성적/혈통적 더러움이 겹치는 표현으로 남겼습니다.
  alternative_readings:
  - 문맥을 따라 완화하여 ‘자손을 몰렉에게 바쳐’
  - 비유적 의미로 풀어 ‘우상 숭배에 가담해’
  rationale: 영어 POB 주석이 이 구절의 돌출성을 보존해야 함을 지적하므로, 의미를 매끈하게 정리하지 않고 원문의 긴장을 유지했습니다.
  doctrine_reference: 본문 보존 원칙 및 POB 주석의 문맥적 긴장 유지
- issue: ‘용서도 없으며 어떤 속죄도 없습니다’의 절대성
  chosen_reading: 문장의 절대적 부정을 그대로 옮겨, 이 규정이 예외 없는 형벌 규정임을 드러냈습니다.
  alternative_readings:
  - ‘용서가 거의 없으며’처럼 완화
  - 문맥상 경고로만 처리
  rationale: 게으즈 원문과 영어 POB가 모두 예외를 허용하지 않는 구조이므로, 신학적으로 완화하지 않고 그대로 번역했습니다.
  doctrine_reference: 율법 규정의 절대적 진술 유지
