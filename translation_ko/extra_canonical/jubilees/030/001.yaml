  lexicon: שלום/평강 계열
  rationale: 단순한 상태 묘사보다 본문이 강조하는 평화적 상태를 드러내기 위해 ‘평강’을 유지했습니다.
theological_decisions:
- issue: 본문의 시간 표지와 지리 표지의 처리
  chosen_reading: ‘여섯째 주의 첫해’와 ‘넷째 달’을 모두 본문에 반영했습니다.
  alternative_readings:
  - ‘첫째 해’만 번역하고 주기 표지를 약화하는 처리
  - ‘일곱째 달’로 바꾸는 처리
  rationale: 지속된 주기 연대와 달 표지는 본문의 서사적 위치를 형성하므로, 오독 가능성이 있는 대체 독법을 따르지 않고 표준 Ge'ez 판독을 반영했습니다.
  doctrine_reference: 본문 비평 및 연대 표지 보존 원칙
