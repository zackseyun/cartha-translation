  rationale: 지리적 상향 이동과 서사적 관용을 함께 살릴 수 있어 표준적인 ‘올라가다’를 택했습니다.
- source_word: “Salem, east of Shechem”
  english_pob_choice: Salem, east of Shechem
  chosen_korean: 세겜의 동쪽에 있는 살렘
  alternatives_korean:
  - 세겜 동쪽의 살렘
  - 세겜의 동편에 있는 살렘
  lexicon: proper noun + spatial relation
  rationale: 장소명과 관계절을 한국어에서 가장 자연스럽게 연결해, 지리적 위치를 분명히 했습니다.
- source_word: “in peace”
