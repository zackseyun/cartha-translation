  - 여섯째 주의 첫 번째 해
  lexicon: year/week temporal expression
  rationale: 주기 단위의 연대 표지를 자연스러운 한국어로 압축하되, ‘first year’와 ‘sixth week’의 구조는 그대로 살렸습니다.
- source_word: “he went up”
  english_pob_choice: he went up
