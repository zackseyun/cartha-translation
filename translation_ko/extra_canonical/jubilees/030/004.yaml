  yaml_path: translation/extra_canonical/jubilees/030/004.yaml
  text: And they spoke with them deceitfully and dealt treacherously with them and misled them. And Simeon and Levi entered Shechem unexpectedly and executed judgment on all the men of Shechem, and they killed every male whom they found in it, and they left none in it; they killed them all in agony, because they had disgraced Dinah their sister.
  footnotes:
  - marker: a
    text: Or 'with the edge of the sword'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그들과 속임수로 말하고, 그들과 배신적으로 행하며, 그들을 미혹했습니다. 시므온과 레위가 뜻밖에 세겜에 들어가 세겜의 모든 남자들에게 판결을 집행하고, 그 안에서 발견한 모든 남자를 죽였으며, 그 안에 아무도 남겨 두지 않았습니다. 그들은 누이 디나를 욕보인 일 때문에 그들을 모두 고통 속에서 죽였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በአኩይ
  english_pob_choice: deceitfully
  chosen_korean: 속임수로
  alternatives_korean:
  - 기만적으로
  - 속여서
  lexicon: Geez adverbial sense
  rationale: 상대방을 의도적으로 속이는 행위라는 점을 살려, 현대 한국어에서 가장 직접적인 ‘속임수로’를 택했습니다.
- source_word: ወኀብለይዎሙ
  english_pob_choice: dealt treacherously with them
  chosen_korean: 배신적으로 행하며
  alternatives_korean:
  - 배신하여
  - 간사하게 대하며
  lexicon: Geez verb of treachery
  rationale: 단순한 속임수보다 관계를 깨는 ‘배신’의 뉘앙스가 있어 이를 분리해 표현했습니다.
- source_word: ወአስፈጥዎሙ
  english_pob_choice: misled them
  chosen_korean: 미혹했습니다
  alternatives_korean:
  - 잘못 이끌었습니다
  - 그릇된 길로 이끌었습니다
  lexicon: Geez causative of leading astray
  rationale: 이 동사는 단순 오도보다 ‘그릇되게 이끔’의 종교적·윤리적 뉘앙스가 있어 ‘미혹하다’로 옮겼습니다.
- source_word: ሰቂማ
  english_pob_choice: in agony
  chosen_korean: 고통 속에서
  alternatives_korean:
  - 고뇌 속에서
  - 통증 속에서
  lexicon: Geez noun for pain/torment
  rationale: 검토 기록에 따라 본문은 ‘칼끝’이 아니라 할례의 고통을 가리키므로, 살상 방식보다 고통의 상태를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: Jubilees' explanation of the killings in Shechem
  chosen_reading: 본문은 시므온과 레위의 행위를 단순한 복수 살육이 아니라, 디나에 대한 모욕에 대한 ‘판결 집행’으로 제시합니다.
  alternative_readings:
  - Genesis 34와 같이 무력 충돌의 서술로 읽기
  - ‘판결 집행’을 약화시켜 단순히 죽였다고만 읽기
  rationale: 게오즈 본문에 있는 ‘판결’(ኵነኔ)과 ‘고통 속에서’라는 설명을 살려, 주석적 의도를 흐리지 않도록 했습니다.
  doctrine_reference: 본문 주해/내러티브 의도
