revisions:
- from: 그들은 그들과 속임수로 말하고, 그들과 배신적으로 행하며, 그들을 미혹했습니다. 시므온과 레위가 뜻밖에 세겜에 들어가 세겜의 모든 남자들에게 판결을 집행하고, 그 안에서 발견한 모든 남자를 죽였으며, 그 안에 아무도 남겨 두지 않았습니다. 그들은 누이 디나를 욕보인 일 때문에 그들을 모두 고통 속에서 죽였습니다.[a]
  to: 그들은 그들에게 거짓되이 말하고 배신적으로 대하며 그들을 잘못 이끌었습니다. 시므온과 레위는 뜻밖에 세겜에 들어가 세겜의 모든 남자들에게 판결을 집행했습니다. 그들은 그 안에서 찾은 모든 남자를 죽였고, 그 안에 아무도 남겨 두지 않았습니다. 그들은 누이 디나를 욕보였기 때문에, 고통 중에 있는 그들을 모두 죽였습니다.
  rationale: 현행 영어 POB의 ‘in agony’ 및 게에즈어의 고통 표현을 본문에 보존하되, 한국어에서 고통을 겪는 이가 피살자들이라는 점을 분명히 했습니다. ‘칼날’이라는 상충하는 이전 번역 각주는 삭제했습니다. 그 밖에는 판결 집행, 모든 남자의 살해, 디나를 욕보인 이유라는 본문의 서술을 유지했습니다.
