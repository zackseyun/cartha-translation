  terminology: ‘음행하는 자’, ‘부정한 자’, ‘거룩하다’, ‘주님’은 본문의 법규적·성결 어휘와 기존 POB 선택에 적절합니다. ‘아버지 집의 이름’은 한국어에서 다소 어색하므로 ‘그녀 아버지 집안의 이름’으로 하되, 원문의 ‘아버지의 집’ 및 명예 훼손의 비유를 보존합니다.
