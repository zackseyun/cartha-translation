base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/008.yaml
  text: They shall burn her with fire, because she has defiled the name of her father's house, and she shall be rooted out from Israel. And let no fornicator or defiled person be found in Israel throughout all the days of the generations of the earth, for Israel is holy to the LORD, and every man who defiles it shall surely die; they shall stone him with stones.
  footnotes:
  - marker: a
    text: Or 'throughout all the generations of the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그녀를 불로 태워야 합니다. 이는 그녀가 아버지 집의 이름을 더럽혔기 때문이며, 그녀는 이스라엘에서 끊어져야 합니다. 또한 이스라엘 안에는 땅의 세대들의 모든 날 동안 음행하는 자나 부정한 자가 있어서는 안 됩니다. 이스라엘은 주님께 거룩하기 때문이며, 그것을 더럽히는 모든 사람은 반드시 죽어야 합니다. 그들은 그를 돌로 쳐야 합니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእሳት
  english_pob_choice: with fire
  chosen_korean: 불로
  alternatives_korean:
  - 불과 함께
  - 불로써
  lexicon: source phrase
  rationale: 게으름 없는 직접 대응으로 형벌의 수단을 분명히 드러내며, 한국어에서는 처벌 수단을 ‘~로’로 자연스럽게 표현할 수 있습니다.
- source_word: አርኰሰት ስመ ቤተ አቡሃ
  english_pob_choice: she has defiled the name of her father's house
  chosen_korean: 그녀가 아버지 집의 이름을 더럽혔기 때문이며
  alternatives_korean:
  - 그녀가 아버지 집의 이름을 욕되게 했기 때문이며
  - 그녀가 아버지 집의 명예를 더럽혔기 때문이며
  lexicon: source phrase
  rationale: ‘이름을 더럽히다’는 원문의 부정·수치 개념을 보존하며, EN POB의 ‘defiled the name’와도 맞닿게 유지했습니다.
- source_word: ወትሠረው እምእስራኤል
  english_pob_choice: she shall be rooted out from Israel
  chosen_korean: 그녀는 이스라엘에서 끊어져야 합니다
  alternatives_korean:
  - 그녀는 이스라엘에서 뽑혀 나가야 합니다
  - 그녀는 이스라엘에서 제거되어야 합니다
  lexicon: source phrase
  rationale: ‘rooted out’의 제거·단절 이미지를 한국어의 ‘끊어지다’로 압축해, 공동체로부터의 절단이라는 형벌성을 유지했습니다.
- source_word: ዘማ፡ ወርኵስ
  english_pob_choice: fornicator or defiled person
  chosen_korean: 음행하는 자나 부정한 자
  alternatives_korean:
  - 간음하는 자나 더러운 자
  - 음행하는 자나 더럽혀진 자
  lexicon: source phrase
  rationale: ‘fornicator’는 성적 부정행위를 가리키는 직접적 표현인 ‘음행하는 자’로, ‘defiled person’은 의례적·도덕적 오염을 함께 담는 ‘부정한 자’로 옮겼습니다.
- source_word: ቅዱስ እስራኤል ለእግዚአብሔር
  english_pob_choice: Israel is holy to the LORD
  chosen_korean: 이스라엘은 주님께 거룩하기 때문이며
  alternatives_korean:
  - 이스라엘은 주님께 성별되었기 때문이며
  - 이스라엘은 주님께 속하여 거룩하기 때문이며
  lexicon: source phrase
  rationale: 원문의 성결 선언을 간결하게 유지하면서, 주님께 대한 귀속과 거룩함을 함께 드러냈습니다.
theological_decisions:
- issue: 형벌 진술의 직설성과 공동체 순결 규범
  chosen_reading: 본문의 연속된 명령형·금지형을 그대로 살려, 성적 부정과 공동체 정결을 위한 배제와 사형을 직설적으로 표현했습니다.
  alternative_readings:
  - 완곡하게 ‘벌을 받아야 합니다’로 순화
  - 공동체 규범만 남기고 사형 진술을 약화
  rationale: 쥬빌리서의 법규 문맥과 원문이 지닌 강한 규범성을 희석하지 않기 위해 직접적 표현을 유지했습니다.
  doctrine_reference: 성결, 언약 공동체의 정결, 형벌 진술의 서술성
- issue: ‘주님’의 사용과 야훼 지칭
  chosen_reading: 지정된 관례에 따라 יהוה는 ‘주님’으로 표기했습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이번 본문은 인용 관례상 주어가 ‘주님’으로 기능하며, 지침의 기본표는 야훼이지만 주어진 작업 범위에서는 기존 POB 관례를 따라 ‘주님’으로 유지했습니다.
  doctrine_reference: 하나님 이름 번역 관례
