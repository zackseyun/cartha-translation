  source_fidelity: 원문의 시간 관용구 መዋዕለ ትውልደ ምድር(‘땅의 세대들의 모든 날’)는 유지되어야 하며, 마지막 ‘그것을 더럽히는’은 선행사인 이스라엘을 명시하는 편이 원문의 뜻을 더 분명히 전달합니다. 돌로 치는 행위는 앞선 ‘반드시 죽어야 한다’와 결합되어 있으므로 한국어에서는 ‘돌로 쳐 죽여야 합니다’가 자연스럽고 의미상 충실합니다.
