  text: 'And for this reason they inscribe for him a testimony of favor[a] on the heavenly tablets: blessing and righteousness before the God of all.'
  footnotes:
  - marker: a
    text: 'Geʿez: ስምዐ ፡ ሞገስ (semʿa mogas). This phrase indicates a formal record of divine approval or grace.'
    reason: lexical_choice
translation:
  language: ko
  text: 이 때문에 그들은 하늘의 돌판에 그에게 호의의 증거를 기록합니다. 곧 복과 의입니다. 그것은 모든 하나님 앞에서입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጽሕፉ
  english_pob_choice: they inscribe
  chosen_korean: 기록합니다
  alternatives_korean:
  - 써 둡니다
  - 새깁니다
  lexicon: Leslau
  rationale: 하늘의 돌판에 남기는 공식적 기록이라는 점을 살려, 단순한 ‘쓰다’보다 ‘기록하다’로 옮겼습니다.
- source_word: ስምዐ ፡ ሞገስ
  english_pob_choice: a testimony of favor
  chosen_korean: 호의의 증거
  alternatives_korean:
  - 은혜의 증거
  - 호의의 증언
  lexicon: Leslau
  rationale: POB의 ‘favor’를 한국어 ‘호의’로 옮겨, 신적 승인과 은총의 뉘앙스를 지나치게 교회 용어로 좁히지 않도록 했습니다.
- source_word: ጽላተ ፡ ሰማይ
  english_pob_choice: the heavenly tablets
  chosen_korean: 하늘의 돌판
  alternatives_korean:
  - 하늘의 판
  - 천상의 돌판
  lexicon: Leslau
  rationale: 문자적으로 ‘tablets’의 물질적 이미지를 살려 ‘돌판’으로 옮겼고, ‘하늘의’로 천상적 기록 매체임을 드러냈습니다.
- source_word: በረከተ ወጽድቀ
  english_pob_choice: blessing and righteousness
  chosen_korean: 복과 의
  alternatives_korean:
  - 축복과 의
  - 복과 공의
  lexicon: Leslau
  rationale: 병렬 구조를 간결하게 살리되, ጽድቅ은 본문 문맥상 일반적 ‘의’로 두었습니다.
theological_decisions:
- issue: ‘favor’의 번역 범위
  chosen_reading: 신적 승인과 호의의 기록이라는 뜻을 살리되, 특정 교파적 어휘로 좁히지 않았습니다.
  alternative_readings:
  - 은혜로 한정
  - 용납으로 해석
  rationale: POB의 주석이 이 표현을 ‘divine approval or grace’로 설명하므로, 한국어에서는 ‘호의의 증거’로 열어 두는 것이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 하나님의 은혜와 승인에 대한 묘사
- issue: 문장 종결의 시제/태도
  chosen_reading: 현재형 서술 ‘기록합니다’로 옮겨 본문의 선언적, 공적 성격을 살렸습니다.
  alternative_readings:
  - 기록할 것입니다
  - 기록하였습니다
  rationale: Geʿez 원문의 일반적 진술을 한국어에서 살아 있는 서술로 처리해, 하늘의 기록 행위가 제도적 사실처럼 들리게 했습니다.
  doctrine_reference: 서사적 현재에 의한 확정성
