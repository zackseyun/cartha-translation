revisions:
- from: 또는 그 딸들 가운데서도 어떤 사람에게 자기 아내로 준 이가 있으면, 그는 여러 민족 가운데 한 사람에게 준 것입니다. 이것은 재앙 위에 재앙이요 — 저주 위에 저주입니다. 모든 심판과 재앙과 저주가 임할 것입니다. 그가 이 일을 하거나, 부정한 일을 행하는 자들과 성막을 더럽히는 자들과 주님의 거룩한 이름을 모독하는 자들을 보고도 눈을 감으면, 온 백성은 함께 모든 부정과 모독 때문에 심판을 받게 될 것입니다. 그리고 아무 차별도 없을 것이며, 그의 손에서 열매나 제물이나 번제물이나 기름이나 기쁨을 주는 향기로운 냄새를 위한 제물도 받지 않을 것입니다. 그것이 받아들여져야 하기 때문입니다. 이와 같이 이스라엘 가운데서 자기 성막을 더럽히는 모든 남자나 여자에게 그러할 것입니다.[15]
  to: 또는 그의 딸들 가운데 하나를 여러 민족 가운데 한 남자에게 주는 경우가 있으면, 재앙 위에 재앙이요 저주 위에 저주입니다.[15] 모든 심판과 재앙과 저주가 임할 것입니다. 그가 이 일을 행하거나, 부정한 일을 행하는 자들과 주님의 성소를 더럽히는 자들과 그분의 거룩한 이름을 모독하는 자들을 보고도 눈을 감으면, 온 백성이 함께 모든 부정과 모독 때문에 심판을 받을 것입니다. 편파도 없을 것이며, 받아들여질 수 있도록 그의 손에서 열매나 제물이나 번제나 기름이나 기쁨을 주는 향기로운 냄새를 받으시는 일도 없을 것입니다. 주님의 성소를 더럽히는 이스라엘의 모든 남자나 여자에게도 이와 같을 것입니다.
  rationale: 첫 조건절을 원문의 딸을 주는 행위로 바로잡고, 성소 및 소유격을 명확히 했습니다. 법정적 편파 금지와 제물 거절을 자연스러운 합쇼체로 옮겼으며, 수용 구문을 제물 열거와 연결해 초안의 모순을 제거했습니다. 난해하고 압축된 제의적 문맥은 각주로만 제한적으로 설명했습니다.
