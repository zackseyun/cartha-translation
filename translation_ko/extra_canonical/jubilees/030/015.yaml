base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/030/015.yaml
  text: or if there is one from his daughters whom he has given to a man from any of the nations. For it is plague upon plague[15], and curse upon curse; and every judgment and plague and curse will come. And if he does this thing, or if he closes his eyes to those who do uncleanness and to those who defile the sanctuary of the LORD and to those who profane his holy name, all the people together will be judged for all the uncleanness and profanation. And there will be no partiality, and no receiving from his hand fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted. So it is with every man or woman in Israel who defiles his sanctuary.
  footnotes:
  - marker: '15'
    text: Verse 15 is unusually dense and likely compresses several legal and cultic statements. The translation preserves the sequence of uncleanness, public guilt, lack of partiality, and rejected offerings without heavy smoothing.
    reason: segmentation_note
translation:
  language: ko
  text: 또는 그의 딸들 가운데 하나를 여러 민족 가운데 한 남자에게 주는 경우가 있으면, 재앙 위에 재앙이요 저주 위에 저주입니다.[15] 모든 심판과 재앙과 저주가 임할 것입니다. 그가 이 일을 행하거나, 부정한 일을 행하는 자들과 주님의 성소를 더럽히는 자들과 그분의 거룩한 이름을 모독하는 자들을 보고도 눈을 감으면, 온 백성이 함께 모든 부정과 모독 때문에 심판을 받을 것입니다. 편파도 없을 것이며, 받아들여질 수 있도록 그의 손에서 열매나 제물이나 번제나 기름이나 기쁨을 주는 향기로운 냄새를 받으시는 일도 없을 것입니다. 주님의 성소를 더럽히는 이스라엘의 모든 남자나 여자에게도 이와 같을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '15'
    text: 15절은 매우 압축되어 있으며, 여러 법적·제의적 진술을 한데 담고 있는 듯합니다. 이 번역은 부정, 공동의 책임, 편파 없음, 제물의 거절이라는 순서를 지나치게 매끄럽게 풀어쓰지 않고 보존합니다.
    reason: ‘재앙 위에 재앙’으로 시작되는 압축적 구절에 대한 영어 POB의 분절 주석을 해당 위치에 맞추어 번역했습니다.
lexical_decisions:
- source_word: ወእመቦ፡ እምአዋልዲሁ፡ ዘወሀቦ፡ ለብእሲ፡ ዘእምኵሉ፡ አሕዛብ
  english_pob_choice: one from his daughters whom he has given to a man from any of the nations
  chosen_korean: 그 딸들 가운데서도 어떤 사람에게 자기 아내로 준 이
  alternatives_korean:
  - 그 딸들 가운데 한 사람을 이방인에게 준 이
  - 그 딸들 중 하나를 민족들 가운데 한 사람에게 준 이
  lexicon: daughter / man / nations
  rationale: 문맥상 ‘준’ 대상은 딸이지만, 한국어에서는 뒤의 결과를 드러내기 위해 ‘자기 아내로 준 이’처럼 관계를 풀어 옮겼습니다. ‘아주방인/이방인’보다 원문의 ‘민족들’(아흐자브)을 살려 ‘여러 민족 가운데 한 사람’으로 옮겼습니다.
- source_word: እስመ፡ መቅሠፍት፡ ላዕለ፡ መቅሠፍት፡ ውእቱ፤ ወመርገም፡ ላዕለ፡ መርገም
  english_pob_choice: for it is plague upon plague, and curse upon curse
  chosen_korean: 이것은 재앙 위에 재앙이요 — 저주 위에 저주입니다
  alternatives_korean:
  - 재앙에 재앙이요 저주에 저주입니다
  - 재앙이 거듭되는 것이요 저주가 거듭되는 것입니다
  lexicon: plague / curse
  rationale: 반복 구조를 직역하되, 히브리식 중첩의 압박감을 살리기 위해 ‘위에’를 유지했습니다. ‘재앙/저주’는 POB의 대비를 그대로 따랐습니다.
- source_word: ይትኬነን፡ ኵሉ፡ ሕዝብ፡ ኅቡረ፡ በእንተ፡ ኵሉ፡ ርኵስ፡ ወግማኔዝ
  english_pob_choice: all the people together will be judged for all the uncleanness and profanation
  chosen_korean: 온 백성은 함께 모든 부정과 모독 때문에 심판을 받게 될 것입니다
  alternatives_korean:
  - 온 백성은 함께 모든 더러움과 신성모독 때문에 판단을 받을 것입니다
  - 온 백성은 함께 모든 부정과 성물을 더럽힘 때문에 심판을 받게 될 것입니다
  lexicon: judge / uncleanness / profanation
  rationale: ‘판단’보다 법정적 책임을 드러내는 ‘심판’을 택했고, ‘ግማኔዝ’는 문맥상 성소·거룩한 이름을 더럽히는 행위 전반을 가리키므로 ‘모독’으로 옮겼습니다.
- source_word: አልቦ፡ ነሢአ፡ ገጽ
  english_pob_choice: there will be no partiality
  chosen_korean: 아무 차별도 없을 것이며
  alternatives_korean:
  - 얼굴을 봐 주는 일은 없을 것이며
  - 편파가 없을 것이며
  lexicon: partiality / face
  rationale: 직역상 ‘얼굴을 받음’이지만, 한국어 독자가 즉시 이해할 법정적 의미는 ‘차별’입니다. POB의 무차별 심판 맥락을 보존하면서 자연스럽게 옮겼습니다.
- source_word: ፍሬ፡ ወመሥዋዕተ፡ ወጽንሓሐ፡ ወስብሐ፡ ወትምዐዘ፡ መዐዛ፡ ሠናይ፡ ከመ፡ ይትወከፎ
  english_pob_choice: fruit or sacrifice or burnt offering or fat or the fragrance of a pleasing aroma, so that it should be accepted
  chosen_korean: 열매나 제물이나 번제물이나 기름이나 기쁨을 주는 향기로운 냄새를 위한 제물도 받지 않을 것입니다. 그것이 받아들여져야 하기 때문입니다
  alternatives_korean:
  - 열매나 제물이나 번제나 기름이나 향기로운 향내를 받지 않을 것입니다. 그래서 받아들여질 것입니다
  - 열매나 제사나 번제물이나 기름이나 향기로운 냄새도 받지 않을 것입니다. 그것이 받아들여지기 위해서입니다
  lexicon: fruit / sacrifice / burnt offering / fat / pleasing aroma / accepted
  rationale: 열거는 원문 순서를 따르되, 마지막 구는 ‘받아들여져야’로 목적/결과를 살렸습니다. ‘gives a pleasing aroma’를 단순한 후각 표현으로 축소하지 않도록 ‘기쁨을 주는 향기로운 냄새’로 풀었습니다.
theological_decisions:
- issue: ‘주의 거룩한 이름’을 어떻게 옮길지
  chosen_reading: 주님의 거룩한 이름
  alternative_readings:
  - 야훼의 거룩한 이름
  - 주(主)의 거룩한 이름
  rationale: 이 절의 Geez 본문은 ‘하나님/주’ 표기가 직접적으로 뒤섞여 있어, POB의 영어 본문처럼 일반적으로는 주님을 취하되, 야훼 인용 여부가 분명한 정식 구약 인용은 아닙니다. 따라서 여기서는 한국어 독자에게 자연스러운 ‘주님의 거룩한 이름’으로 두었습니다.
  doctrine_reference: divine-name rendering consistency
