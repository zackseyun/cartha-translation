  text: '"We will not give our daughter to a man who has a foreskin, for that is a reproach to us." And it is a reproach to Israel, to those who give and to those who take from the daughters of the nations, because it is unclean.'
  footnotes:
  - marker: a
    text: Or 'We will not give our daughter to a man who has a foreskin, for that is a reproach to us.'.
    reason: previous_rendering
translation:
  language: ko
  text: “우리는 우리의 딸을 포피가 있는 남자에게 주지 않을 것입니다. 그것은 우리에게 수치이기 때문입니다.” 그리고 그것은 이스라엘에게, 이방의 딸들을 주는 자들과 받는 자들에게 수치입니다. 그것은 부정하기 때문입니다.[a]
  philosophy: optimal-equivalence
