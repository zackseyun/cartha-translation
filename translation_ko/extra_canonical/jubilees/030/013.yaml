- from: “우리는 우리의 딸을 포피가 있는 남자에게 주지 않을 것입니다. 그것은 우리에게 수치이기 때문입니다.” 그리고 그것은 이스라엘에게, 이방의 딸들을 주는 자들과 받는 자들에게 수치입니다. 그것은 부정하기 때문입니다.[a]
  to: “우리는 우리 딸을 포피가 있는 남자에게 주지 않을 것입니다. 그것은 우리에게 수치이기 때문입니다.” 그리고 그것은 이스라엘에게, 곧 이방 민족의 딸들을 주는 자들과 그들에게서 맞아들이는 자들에게 수치입니다. 그것은 부정한 일이기 때문입니다.
  rationale: 원문의 단수 표현을 회복하고, ‘부정하다’의 의례적 의미를 자연스러운 한국어 술어로 바로잡았습니다. ‘주는 자들’과 ‘이방 민족의 딸들에게서 맞아들이는 자들’의 병렬은 원문의 다소 압축된 표현과 영어 POB의 범위를 보존합니다. 내용 없는 각주 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
