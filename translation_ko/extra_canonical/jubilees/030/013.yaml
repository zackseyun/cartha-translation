translation:
  language: ko
  text: “우리는 우리 딸을 포피가 있는 남자에게 주지 않을 것입니다. 그것은 우리에게 수치이기 때문입니다.” 그리고 그것은 이스라엘에게, 곧 이방 민족의 딸들을 주는 자들과 그들에게서 맞아들이는 자들에게 수치입니다. 그것은 부정한 일이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቍልፈተ
  english_pob_choice: has a foreskin
  chosen_korean: 포피가 있는
  alternatives_korean:
  - 할례받지 않은
  - 포피를 지닌
  - 할례 없는
  lexicon: 포피
  rationale: 지시 대상이 신체 표지인 ‘foreskin’을 직접 드러내어, 단순히 종교적 상태로만 완화하지 않고 원문 의미를 가깝게 옮겼습니다.
- source_word: ጽእለት
  english_pob_choice: reproach
  chosen_korean: 수치
  alternatives_korean:
  - 치욕
  - 비난
  - 수치스러움
  lexicon: 수치
  rationale: 문맥상 공동체에 돌아오는 불명예와 수치를 뜻하므로, 한국어에서 자연스럽고 강한 대응어인 ‘수치’를 택했습니다.
- source_word: ወለእለ፡ ይነሥኡ፡ እምአዋልደ፡ አሕዛብ
  english_pob_choice: those who take from the daughters of the nations
  chosen_korean: 이방의 딸들을 받는 자들
  alternatives_korean:
  - 이방의 딸들을 취하는 자들
  - 민족들의 딸들을 받아들이는 자들
  - 이방 여인들을 맞는 자들
  lexicon: 받다
  rationale: 동사 ‘take’는 여기서 혼인 관계를 맺다/받아들이다의 뉘앙스가 있지만, 영어 POB의 ‘take’와 원문의 직설성을 살려 ‘받는’으로 두었습니다.
- source_word: ርኵስ
  english_pob_choice: unclean
  chosen_korean: 부정합니다
  alternatives_korean:
  - 더럽습니다
  - 부정합니다
  - 깨끗하지 않습니다
  lexicon: 부정하다
  rationale: 의례적·언약적 부정의 개념을 보존하기 위해 단순한 위생적 의미의 ‘더럽다’보다 ‘부정하다’를 사용했습니다.
