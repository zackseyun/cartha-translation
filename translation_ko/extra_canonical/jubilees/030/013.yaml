  - severity: high
    issue: ‘그것은 부정하기 때문입니다’는 의미·문법상 부정확함
    rationale: 원문의 ርኵስ은 ‘부정한, 깨끗하지 않은’이라는 술어인데, 초안의 표현은 ‘부인하기 때문이다’처럼 읽힙니다. ‘부정한 일이기 때문입니다’로 고쳐야 합니다.
