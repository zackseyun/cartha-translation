  text: 'Therefore I have commanded you, saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment[16], and it was reckoned to them as righteousness, and it was written for them for righteousness.'''
  footnotes:
  - marker: '16'
    text: '''With torment'' renders a difficult phrase that may also be understood as ''with distress'' or possibly ''with the sword'' in some textual traditions. The broader sense is that the Shechemites were violently struck down.'
    reason: lexical_alternative
  - marker: a
    text: 'Or "you[16], saying, ''Bear this witness to Israel: See what happened to the Shechemites and to their sons, how they were delivered into the hands of the two sons of Jacob, and they killed them with torment,".'
    reason: previous_rendering
  - marker: b
    text: Or 'written to them for righteousness.'.
    reason: previous_rendering
  - marker: c
    text: Or 'written to them for righteousness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 내가 네게 명령하여 말하였다. ‘이스라엘에게 이 증언을 하라. 세겜 사람들과 그들의 아들들에게 무슨 일이 일어났는지 보아라. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들은 그들을 고통을 가하여 죽였다[16]. 그 일이 그들에게 의로 여겨졌고, 그들을 위하여 의로 기록되었다.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: '16'
    text: ‘고통을 가하여’로 옮긴 표현은 해석하기 어렵습니다. ‘고난/고통 가운데’ 또는 일부 전승에 따라 ‘칼로’라는 뜻으로도 이해될 수 있습니다. 넓은 뜻은 세겜 사람들이 폭력적으로 죽임을 당했다는 것입니다.
    reason: 원문의 난해한 표현과 영어 POB의 lexical_alternative 각주를 보존합니다.
