  to: 그러므로 내가 네게 명령하여 말하였다. ‘이스라엘에게 이 증언을 하라. 세겜 사람들과 그들의 아들들에게 무슨 일이 일어났는지 보아라. 그들이 야곱의 두 아들의 손에 넘겨졌고, 그 두 아들은 그들을 고통을 가하여 죽였다[16]. 그 일이 그들에게 의로 여겨졌고, 그들을 위하여 의로 기록되었다.’
  rationale: 단수 수신자와 인용 구조를 바로잡고, 세겜 사람들을 죽인 주체가 야곱의 두 아들임을 명시했습니다. ‘의로 여겨짐’과 ‘의로 기록됨’은 원문의 평가 및 천상 기록 이미지를 유지하되, 불필요한 교리적 해석은 더하지 않았습니다.
