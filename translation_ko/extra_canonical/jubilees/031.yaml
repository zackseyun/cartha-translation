base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031.yaml
  text: '1[2]. And in the first month Jacob spoke to all the people of his house, saying, “Purify yourselves and wash your garments, and let us rise and go up to Bethel, to the place where I prayed to him in the day when I fled from the face of Esau my brother, and he was with me and brought me into this land in peace.” And they gave up

    2. the foreign gods that were among them, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and hid them under the oak that was in the land of Shechem.

    3. And he went up in the first month, in the seventh year, to Bethel. And he built an altar in the place where he had slept there, and he set up there a pillar, and he sent to his father Isaac that he should come to him

    4. to his sacrifice, and also to his mother Rebekah. And Isaac said, “Let my son Jacob come,

    5. and let me see him before I die.” And Jacob went to his father Isaac and to his mother Rebekah, to the house of his father Abraham. And he took with him two of his sons, Levi and Judah.

    6[15]. And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from her chamber to the gate of the house, to kiss Jacob and embrace him, for her spirit had revived when

    7. she heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing on the earth.”

    8. And Jacob went in to Isaac his father, into the room where he lay there, and his two children were with him. And he stretched out the hand of his father, and he bent down and kissed him. And Isaac clung to

    9. the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?

    10. For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly my grandsons.”

    11. And they came near to him, and he turned and kissed them and embraced them,

    12. both of them together. And a spirit of prophecy came down into his mouth. And he took Levi with his right hand

    13. and Judah with his left hand, and he turned toward Levi first and began to bless him first, and said to him: “May the God of all, the Lord of all the ages, bless you

    14. and your children throughout all the ages. And may the Lord give to you and to your seed greatness of heart for glory. And may he bring you and your seed near to him from all flesh, to serve in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your sons be for glory and greatness

    15. and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness, and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be given in their mouths

    16. that they may bless all the seed of the beloved. Your name was called Levi, and rightly was your name called. You shall be joined to the Lord, and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,

    17. and your food shall not fail through all the ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And blessed be the one who blesses you,

    18. and cursed be every nation that curses you.” And to Judah he said, “May the Lord give you strength and power to tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go out and pass through all the earth and the regions of it. Then nations shall fear before your face,

    19. and all the nations shall be shaken, and all the peoples shall be shaken. In you shall be the help of Jacob,

    20. and in you shall the salvation of Israel be found. And when you sit on the throne of the honor of your righteousness, there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed

    21. from the earth, and shall become accursed.” And he turned and kissed him again and embraced him, and he rejoiced greatly because

    22. he had seen the sons of Jacob his son in righteousness. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night, and they ate and drank with joy.

    23. And he made the two sons of Jacob lie down, one at his right hand and one at his left,

    24. and righteousness passed over him. And Jacob told his father during the night everything that God had done with him, the great mercy, and how he had prospered all his ways and protected him from all evil.

    25. And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.

    26. And in the morning Jacob told his father Isaac the vow that he had vowed to the Lord, and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord, as

    27. he had vowed, and that he had come to set him on a beast. And Isaac said to Jacob his son, “I am not able to go with you, for I am old and not able to endure the way. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to ride on the beast, and go

    28. with you. And I know, my son, that it was for my sake you came, and this day shall be blessed,

    29. the day on which you have seen me alive, and I also have seen you, my son. Prosper and do the vow that you have vowed, and do not delay your vow, for you will be sought out concerning the vow, and now hasten to perform it.

    30. And may he prosper all that you do, all for which you have vowed in prayer.” And he said to Rebekah, “Go with Jacob.” And she rose and went with Jacob her son, and Deborah with her, and they came to

    31. Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and they were recorded for them as an everlasting testimony on the heavenly tablets[30-31][26][22][20], just as Isaac blessed them.'
  footnotes:
  - marker: '2'
    text: The tree term may also be rendered 'terebinth'; the exact species behind the Ge'ez word is uncertain.
    reason: lexical_alternative
  - marker: '15'
    text: The clause rendered 'his paths to Israel' is textually difficult; some interpreters understand a stronger sense such as 'his ordinances' or 'his discipline' for Israel.
    reason: lexical_alternative
  - marker: '20'
    text: The phrase about sitting 'on the throne of the honor of your righteousness' is dense and may be construed more compactly as 'on the glorious throne of your righteousness.'
    reason: segmentation_note
  - marker: '22'
    text: The line 'he went out from between his feet' is obscure in English because it reflects a literal idiom in the source; it likely describes Jacob withdrawing from Isaac's immediate presence before bowing.
    reason: segmentation_note
  - marker: '26'
    text: Although the Ge'ez uses prayer-related wording, the immediate context of Bethel, altar, sacrifice, and Isaac's warning not to delay indicates a vow in view here.
    reason: alternative_reading
  - marker: 30-31
    text: The final transition is compressed in the source. The surviving row numbering skips from 30 to 32 in the corpus, but the sense clearly continues with their arrival at Bethel and Jacob's reflection on Isaac's blessing.
    reason: textual_variant
translation:
  language: ko
  text: '1[2]. 정월에 야곱이 온 집 사람에게 말하여 이르되 너희는 스스로 정결하게 하고 옷을 빨라 내가 일어나 벧엘로 올라가자 이는 내가 내 형 에서의 낯을 피하여 도망하던 날에 내가 그에게 기도하던 곳이요 그가 나와 함께 있어 나를 평안히 이 땅으로 인도하였느니라. 그리고 그들은 포기했어요

    2. 그들 중에 있는 이방 신들과 그들의 귀에 있는 것과 그들의 목에 있는 것과 라헬이 그의 오라버니 라반에게서 훔친 우상들이니라 그 여자가 그 모든 것을 야곱에게 주매 야곱이 그것을 불사르고 으깨어 세겜 땅 상수리나무 아래 묻었더라.

    3. 그는 일곱째 해 첫째 달에 벧엘로 올라갔습니다. 자기가 자던 곳에 제단을 쌓고 거기에 기둥을 세우고 그 아버지 이삭에게로 보내어 그에게로 오라 하였더라

    4. 그의 제물과 그의 어머니 리브가에게도 감사하였느니라 이삭이 이르되 내 아들 야곱을 오게 하라

    5. 그리고 죽기 전에 그 사람을 뵙게 해주세요.” 야곱은 그의 아버지 이삭과 그의 어머니 리브가에게, 그의 아버지 아브라함의 집으로 갔다. 그리고 그는 그의 두 아들 레위와 유다를 데리고 갔다.

    6[15]. 그리고 그가 그의 아버지 이삭과 그의 어머니 리브가에게로 돌아왔다. 리브가가 자기 방에서 집 문으로 나와서 야곱에게 입 맞추고 그를 안으니 이는 그 때에 그의 영이 살아났음이더라

    7. 그녀는 “보라, 네 아들 야곱이 왔다” 하는 말을 들었습니다. 그리고 그녀는 그에게 키스했습니다. 그 여자가 그의 두 아들을 보고 그들을 알아보고 그에게 “내 아들아, 이들이 네 아들들이냐?” 그리고 그들을 안고 입맞추며 축복하여 이르되, “아브라함의 자손이 너로 말미암아 영광을 얻을 것이요 너는 땅에서 복의 근원이 될지라.”

    8. 야곱이 그의 아버지 이삭에게로 들어가 그가 누웠던 방으로 들어갔고 그의 두 자녀도 그와 함께 있었더라. 그리고 그는 아버지의 손을 내밀고 몸을 굽혀 그에게 입을 맞추었습니다. 그리고 이삭은 매달렸다.

    9. 그 아들 야곱의 목을 안고 그 목을 안고 우니라 이삭의 눈이 어두워지고 야곱의 두 아들 레위와 유다를 보고 이르되 내 아들아 이들이 네 아들들이냐?

    10. 그들은 당신을 닮았기 때문입니다.” 그리고 그는 그들이 정말로 그의 아들들임을 그에게 말했습니다. 그리고는 “이제 보니 그 사람들이 정말 내 손자구나”라고 말했습니다.

    11. 그들이 예수에게 가까이 오매 예수께서 돌이켜 그들에게 입맞추시고 안으시고

    12. 둘 다 함께. 그리고 예언의 영이 그의 입에 내려왔습니다. 그리고 오른손으로 레위를 데리고

    13. 유다가 왼손으로 먼저 레위를 향하여 축복하여 이르되 만유의 하나님, 만세의 주께서 네게 복을 주시기를 원하노라

    14. 그리고 모든 시대의 여러분의 자녀들도 마찬가지입니다. 그리고 주님께서 당신과 당신의 자손에게 영광을 위한 마음의 위대함을 주시기를 빕니다. 또 그가 너희와 너희 자손을 모든 육체 가운데서 그에게 가까이 이끄시어 앞에 있는 천사들과 거룩한 자들과 같이 그의 성소에서 섬기게 하시기를 원하노라 이같이 네 아들의 자손도 영광과 위대함이 있으리로다

    15. 그리고 거룩함. 그리고 그분께서 그들을 모든 시대에 걸쳐 위대하게 만드시기를 바랍니다. 그리고 그들은 야곱의 아들들의 모든 자손의 방백들과 재판관들과 우두머리들이 될 것입니다. 그들은 주님의 말씀을 의롭게 전하며 그의 모든 판결을 공의로 판단하며 그의 길을 야곱에게, 그의 길을 이스라엘에게 알리리라 주님의 복이 그들의 입에 있으리라

    16. 사랑하는 자의 모든 자손에게 복을 주옵소서 네 이름은 레위라고 불렸는데, 네 이름도 그렇게 불린 것이 당연하다. 너는 주님와 연합하여 야곱의 모든 아들의 동반자가 될 것이다. 그의 상을 네 것이 되게 하라. 너와 네 아들들은 거기서 먹으리라. 너희 식탁은 대대에 가득 차리라.

    17. 그리고 너희 음식은 영원토록 실패하지 않을 것이다. 너를 미워하는 자들은 다 네 앞에 엎드러지고 네 대적들은 다 뽑혀 멸망할 것이요 그리고 너를 축복하는 사람은 축복받을 것이다.

    18. 너를 저주하는 나라마다 저주를 받을 것이다.” 유다에게 이르되 주님께서 네게 힘과 능력을 주사 너를 미워하는 모든 자를 밟게 하시기를 원하노라 너는 너와 네 아들 중 하나가 야곱의 아들들을 다스리는 통치자가 되라 네 이름과 네 아들들의 이름이 온 땅과 그 모든 지역에 널리 전파되게 하시기를 원하노라 그리하면 열방이 네 앞에서 경외하리니

    19. 그러면 모든 나라가 흔들리고 모든 민족이 흔들리리라. 너 안에서 야곱의 도움이 있으리라.

    20. 그리고 이스라엘의 구원이 당신에게서 발견되리이다. 그리고 당신이 당신의 의로움의 영광의 보좌에 앉으시면 사랑받는 아들들의 모든 자손에게 큰 평화가 있을 것입니다. 너를 축복하는 자는 복이 있으리로다 너를 미워하고 괴롭히고 저주하는 자는 다 뽑혀 멸망할 것이라

    21. 땅에서는 저주를 받을 것이요.” 그 사람이 돌이켜 다시 그에게 입맞추고 안고 그로 말미암아 크게 기뻐하니라

    22. 그는 그의 아들 야곱의 아들들의 의로움을 보셨으며 그리고 그는 그의 발 사이에서 나와서 그에게 엎드려 절하였다. 그가 그들에게 축복하고 그 밤에 거기 그의 아버지 이삭 곁에서 쉬매 그들이 즐겁게 먹고 마셨더라.

    23. 그리고 야곱의 두 아들을 하나는 자기 오른쪽에, 하나는 왼쪽에 눕혀 놓았습니다.

    24. 그리고 그에게 의로움이 넘쳤습니다. 야곱이 밤에 하나님이 자기에게 행하신 모든 일과 그 크신 긍휼과 그가 어떻게 형통하게 하였으며 모든 환난에서 그를 보호하신 것을 그 아버지에게 고하니라.

    25. 이삭은 그의 종 이삭의 아들에게 그의 자비와 의를 아끼지 아니하신 그의 아버지 아브라함의 하나님을 찬송하였더라.

    26. 아침에 야곱이 그의 아버지 이삭에게 그가 주님께 서원한 서원과 그가 본 환상과 그가 제단을 쌓은 것과 주님 앞에 제사를 드릴 모든 것이 준비되었음을 말하였으니

    27. 그가 서원하였거늘 자기를 짐승 위에 태우러 오셨느니라 이삭이 그 아들 야곱에게 이르되 내가 늙어서 그 길을 감당할 수 없으므로 너와 함께 갈 수 없나니 내 아들아 평안히 가라 내 나이 오늘 백육십오 세라 이제부터는 짐승을 타고 갈 수 없느니라

    28. 너와 함께. 그리고 내 아들아, 네가 나를 위해서 온 줄을 나는 안다. 그리고 오늘은 복된 날이 될 것이다.

    29. 내 아들아, 네가 나의 살아 있는 것을 본 날이고 나도 너를 보았다. 형통하고 네가 서원한 서원을 지키라 네 서원을 지체하지 말라 서원한 것을 네가 찾는 바가 되었으니 이제 속히 이루라

    30. 그리고 네가 하는 모든 일과 네가 기도로 서원한 모든 일이 형통하기를 빕니다.” 그리고 그는 리브가에게 “야곱과 함께 가라”고 말했습니다. 그가 일어나 그 아들 야곱과 드보라와 함께 나아가서

    31. 베델. 야곱은 그의 아버지가 레위와 유다를 축복했던 기도를 기억하고 기뻐하며 그의 조상 아브라함과 이삭의 하나님을 찬양하였다. 그리고 그는 “이제 나는 만유의 하나님 앞에서 나와 내 자녀들에게도 영원한 소망이 있는 줄을 아노라”고 말했습니다. 그리하여 이삭이 그들에게 축복한 것과 같이 이 두 사람을 위하여 정해졌으니 그들을 위하여 하늘 판에 영원한 증거로 기록되었느니라.'
