  language: ko
  text: 그리고 피째 먹는 사람처럼 되지 마십시오. 그러나 그들이 여러분 앞에서 피를 먹지 않도록 조심하십시오. 피를 가리라. 이는 내가 너희와 너희 자녀와 모든 육체에게 증언하라는 명령을 받았음이니라.
