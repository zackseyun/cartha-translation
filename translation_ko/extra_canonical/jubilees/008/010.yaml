  text: And it came to pass in the beginning of the thirty-third jubilee that they divided the earth into three portions for Shem and Ham and Japheth, each according to his inheritance, in the first year in the first week, while one of us who had been sent was dwelling with them.
translation:
  language: ko
  text: 제삼십삼 희년이 시작될 때에, 그들이 땅을 세 부분으로 나누어 셈과 함과 야벳에게, 각자 자기 기업에 따라 나누어 주었습니다. 이는 첫째 주간 첫째 해의 일이었으며, 보냄을 받은 우리 가운데 한 사람이 그들과 함께 거주하고 있었습니다.
