revisions:
- from: 삼십 삼년째 희년이 시작되매 그들이 땅을 세 부분으로 나누어 셈과 함과 야벳을 위하여 각각 자기 기업에 따라 첫째 해 첫째 주일에 보냄을 받은 우리 중 한 사람이 그들과 함께 거주하였더니
  to: 제삼십삼 희년이 시작될 때에, 그들이 땅을 세 부분으로 나누어 셈과 함과 야벳에게, 각자 자기 기업에 따라 나누어 주었습니다. 이는 첫째 주간 첫째 해의 일이었으며, 보냄을 받은 우리 가운데 한 사람이 그들과 함께 거주하고 있었습니다.
