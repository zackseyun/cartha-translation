  text: 이같이 네 아버지의 아버지 에녹이 그의 아들 므두셀라에게 명령하였고, 므두셀라는 그의 아들 라멕에게 명령하였고, 라멕은 그의 조상들이 그에게 명령한 모든 것을 내게 명령하였느니라.
