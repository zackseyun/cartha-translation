  to: 이처럼 네 아버지의 아버지인 에녹은 자기 아들 므두셀라에게 명령했고, 므두셀라는 자기 아들 라멕에게 명령했으며, 라멕은 그의 조상들이 그에게 명령한 모든 것을 내게 명령했습니다.
