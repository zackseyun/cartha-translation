translation:
  language: ko
  text: 에덴 온 땅과 홍해의 온 땅과 동쪽의 온 땅과 인도와 홍해와 그 산들, 그리고 바산의 온 땅과 레바논의 온 땅과 갑돌의 섬들과 세니르와 아마나의 산들, 그리고 북쪽으로 앗수르 산들 너머 바다 건너편의 온 지역은—복되고 넓은 땅이며, 그 안에 있는 모든 것은 매우 좋았습니다.[a]
  philosophy: optimal-equivalence
