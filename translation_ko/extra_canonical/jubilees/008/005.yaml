base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/005.yaml
  text: For he was afraid to tell Noah about it, lest he be angry with him because of it. And in the fifth jubilee, in the first week, in the first year, he took a wife, and her name was Melka, the daughter of Madai, the son of Japheth; and in the fourth year of it he fathered a son, and he called his name Salah.
  footnotes:
  - marker: a
    text: Or 'in the fourth year she bore him a son'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그것 때문에 노아에게 말하기를 두려워했습니다. 곧 그것 때문에 노아가 그에게 화를 낼까 염려했기 때문입니다. 그리고 다섯째 희년, 첫째 주의 첫째 해에 그는 아내를 맞이했는데, 그의 아내의 이름은 므다이의 딸이요 야벳의 아들인 멜카였습니다. 그리고 그 주의 넷째 해에 그는 아들을 낳았고, 그의 이름을 살라라고 불렀습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይፈርህ ... ከመ ኢይትመዐዐ ላዕሌሁ
  english_pob_choice: he was afraid ... lest he be angry with him
  chosen_korean: 말하기를 두려워했습니다 ... 화를 낼까 염려했기 때문입니다
  alternatives_korean:
  - 무서워했습니다 ... 노하여 그를 치실까 두려워했기 때문입니다
  - 겁이 나서 말하지 못했습니다 ... 성내실까 염려했기 때문입니다
  lexicon: fear / anger
  rationale: 원문의 두려움과 ‘그에게 화가 날까’라는 결과를 자연스럽게 살리되, 과도하게 신체적·형벌적 의미를 덧붙이지 않도록 ‘화를 내다’로 옮겼습니다.
- source_word: ነሥአ ሎቱ ብእሲተ
  english_pob_choice: he took a wife
  chosen_korean: 아내를 맞이했습니다
  alternatives_korean:
  - 아내를 데려왔습니다
  - 아내를 취했습니다
  lexicon: take a wife
  rationale: 결혼을 뜻하는 관용구로서의 ‘take a wife’를 현대 한국어에서 자연스럽고 품위 있게 ‘아내를 맞이하다’로 풀었습니다.
- source_word: ሜልካ ወለተ አመዳይ ወልደ ያፌት
  english_pob_choice: Melka, the daughter of Madai, the son of Japheth
  chosen_korean: 므다이의 딸이요 야벳의 아들인 멜카
  alternatives_korean:
  - 야벳의 아들 므다이의 딸 멜카
  - 야벳의 손자인 므다이의 딸 멜카
  lexicon: genealogical apposition
  rationale: 영어 POB의 계보 관계를 따라 소유격 중첩을 한국어 서술형 병렬로 풀어, 멜카의 출신 계보를 명료하게 드러냈습니다.
- source_word: ወበዓመት ራብዕ ሎቱ ወሊደ ወልደ
  english_pob_choice: in the fourth year of it he fathered a son
  chosen_korean: 그 주의 넷째 해에 그는 아들을 낳았고
  alternatives_korean:
  - 그의 넷째 해에 그는 아들을 낳았고
  - 넷째 해에 아들을 얻었고
  lexicon: fathered
  rationale: 수정된 POB 해석에 따라 주기의 넷째 해를 가리키는 것으로 옮기고, 주어가 남성형이라는 점을 반영해 ‘낳다’보다 계보 문맥에 맞는 ‘아들을 낳았다’로 처리했습니다.
- source_word: ወጸውዐ ስሞ ሳላ
  english_pob_choice: he called his name Salah
  chosen_korean: 그의 이름을 살라라고 불렀습니다
  alternatives_korean:
  - 그의 이름을 살라라 하였습니다
  - 그의 이름을 살라로 지었습니다
  lexicon: name-giving formula
  rationale: 명명 공식의 서술성을 살리면서도 현대 한국어에서 자연스럽게 들리도록 ‘이름을 …라고 불렀습니다’로 옮겼습니다.
theological_decisions:
- issue: 희년 연대기 표현의 번역
  chosen_reading: ‘다섯째 희년, 첫째 주의 첫째 해’ 및 ‘그 주의 넷째 해’로 옮겨, 달력·연대 구조를 해설하지 않고 원문 구성을 그대로 드러냈습니다.
  alternative_readings:
  - ‘다섯 번째 희년의 첫째 주 첫째 해’
  - ‘그의 넷째 해에’
  rationale: 원문은 희년-주-해의 층위가 중요한 연대기 형식이므로, 의미를 평준화하기보다 구조를 가시적으로 보존하는 것이 본문의 정보량을 더 정확히 전달합니다.
  doctrine_reference: 성경 외 전승 문헌의 서사-연대기 형식 보존 원칙
