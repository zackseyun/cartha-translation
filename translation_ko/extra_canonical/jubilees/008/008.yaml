  text: And in the sixth year she bore him a son, and he called his name Peleg, because in the days when he was born the sons of Noah began to divide the earth among themselves; therefore he called his name Peleg.
translation:
  language: ko
  text: 여섯째 해에 그가 아들을 낳으매 그가 그의 이름을 벨렉이라 하였으니 이는 그가 태어나던 때에 노아의 아들들이 그들끼리 땅을 나누기 시작하였음이더라. 그러므로 그는 그의 이름을 벨렉이라 불렀다.
