  text: 여섯째 해에 그녀가 그에게 아들을 낳아 주었고, 그는 그의 이름을 벨렉이라 하였습니다. 그가 태어난 날에 노아의 아들들이 그들끼리 땅을 나누기 시작하였으므로, 그는 그의 이름을 벨렉이라 하였습니다.
