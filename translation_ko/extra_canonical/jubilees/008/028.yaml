  text: And he blessed the God of gods, who had put the word of the Lord in his mouth.
translation:
  language: ko
  text: 그는 입에 주님의 말씀을 담아 주신 **신들의 하나님**을 찬양했습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ / blessed
  english_pob_choice: he blessed
  chosen_korean: 찬양했습니다
  alternatives_korean:
  - 축복했습니다
  - 복을 빌었습니다
  lexicon: 바라크/찬양
  rationale: 문맥상 그가 하나님을 대상으로 경배적 축복을 드린 것이므로, 한국어에서는 자연스럽고 의미를 분명히 드러내는 ‘찬양했습니다’로 옮겼습니다.
- source_word: አምላክ፡ አማልክት፡
  english_pob_choice: God of gods
  chosen_korean: 신들의 하나님
  alternatives_korean:
  - 신들 중의 하나님
  - 모든 신들의 하나님
  lexicon: 하나님
  rationale: Ge'ez의 소유/관계 구조를 직역하되, ‘God of gods’의 비교 우위를 보존하기 위해 ‘신들의 하나님’으로 간결하게 옮겼습니다.
- source_word: ዘወደየ፡ ውስተ፡ አፉሁ፡ ንባበ፡
  english_pob_choice: who had put the word of the Lord in his mouth
  chosen_korean: 입에 주님의 말씀을 담아 주신
  alternatives_korean:
  - 입에 주님의 말씀을 두신
  - 입에 주님의 말씀을 넣어 주신
  lexicon: 입에 말씀을 두다
  rationale: ‘입에 넣다/두다’의 관용적 의미를 살리면서도, 원문의 ‘그의 입에’라는 위치 관계와 신적 부여 행위를 자연스럽게 드러내기 위해 ‘담아 주신’으로 옮겼습니다.
theological_decisions:
- issue: ‘God of gods’의 위계 표현
  chosen_reading: ‘신들의 하나님’이라고 하여 다른 신적 존재들 위에 계신 유일하신 하나님이라는 비교 우위를 유지했습니다.
  alternative_readings:
  - ‘모든 신들의 하나님’으로 강화하여 설명
  - ‘신 중의 하나님’으로 축약
  rationale: 원문이 신적 존재들에 대한 우위를 분명히 말하므로, 이를 평준화하지 않고 직관적으로 드러내는 표현을 택했습니다.
  doctrine_reference: 신명기적 유일신 신앙과 시적 찬양의 비교 գեր월 표현
- issue: ‘주의 말씀’과 ‘주님의 말씀’
  chosen_reading: 여기서의 ‘주님’은 문맥상 야훼를 가리키는 주권자 표현으로 이해하여 ‘주님의 말씀’으로 옮겼습니다.
  alternative_readings:
  - ‘야훼의 말씀’으로 명시
  - ‘주의 말씀’으로 일반화
  rationale: 본문의 Ge'ez가 ‘주님의 말씀’을 직접 말하므로, 독자가 신적 발화를 분명히 인식하도록 ‘주님’으로 유지했습니다.
  doctrine_reference: 야훼-주 대응의 일반적 성경 번역 원칙
