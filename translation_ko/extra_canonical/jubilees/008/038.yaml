    reason: previous_rendering
translation:
  language: ko
  text: 여러분은 의와 올바름 가운데서 의롭게 될 것이며, 여러분이 심은 모든 것이 번성할 것입니다. 이는 여러분 아버지의 아버지인 에녹이[a] 자기 아들 므두셀라에게 명하였고, 므두셀라가 자기 아들 라멕에게 명하였으며, 라멕이…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “에녹이 여러분의 아버지 므두셀라에게 명하였습니다.”
    reason: 영어 POB 감사 흔적에 보존된 대안적 구문 분석을 제시합니다. 본문은 게에즈어의 명시적 표현을 따라 ‘여러분 아버지의 아버지’와 ‘자기 아들 므두셀라’를 유지합니다.
lexical_decisions:
- source_word: በጽድቅ፡ ወበርትዕ፡
  english_pob_choice: in righteousness and uprightness
  chosen_korean: 의로움과 올바름 가운데에서
  alternatives_korean:
  - 의와 정직 가운데에서
  - 의롭게와 올바르게
  - 의로움과 정직함 가운데에서
  lexicon: ጽድቅ=의/의로움, ርትዕ=곧음/올바름
  rationale: 두 개의 명사형 병치를 살려 도덕적 상태를 단순화하지 않고, 문맥상 행위의 기준이 되는 내적·외적 바름을 함께 드러냈습니다.
- source_word: ወትጸድቁ
