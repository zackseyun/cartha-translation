base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/038.yaml
  text: You, in righteousness and uprightness, shall be righteous, and all your plantings shall prosper. For thus Enoch, the father of your father, commanded Methuselah his son, and Methuselah his son Lamech, and Lamech...
  footnotes:
  - marker: a
    text: Or 'Enoch commanded your father Methuselah'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 의로움과 올바름 가운데에서 의롭게 되어야 하며, 당신의 모든 심은 것들이 번성할 것입니다. 이는 에녹, 곧 당신의 아버지의 아버지가 그의 아들 므두셀라에게 명했고, 므두셀라가 그의 아들 라멕에게, 그리고 라멕이…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጽድቅ፡ ወበርትዕ፡
  english_pob_choice: in righteousness and uprightness
  chosen_korean: 의로움과 올바름 가운데에서
  alternatives_korean:
  - 의와 정직 가운데에서
  - 의롭게와 올바르게
  - 의로움과 정직함 가운데에서
  lexicon: ጽድቅ=의/의로움, ርትዕ=곧음/올바름
  rationale: 두 개의 명사형 병치를 살려 도덕적 상태를 단순화하지 않고, 문맥상 행위의 기준이 되는 내적·외적 바름을 함께 드러냈습니다.
- source_word: ወትጸድቁ
  english_pob_choice: shall be righteous
  chosen_korean: 의롭게 되어야 하며
  alternatives_korean:
  - 의롭다 할 것입니다
  - 의롭게 될 것입니다
  - 의로운 자가 될 것입니다
  lexicon: ጸደቀ=의롭다/의롭게 되다
  rationale: 원문의 상태 서술을 살리되, 한국어에서 자연스러운 미래·명령적 권면의 긴장을 함께 보이기 위해 ‘되어야 하며’로 옮겼습니다.
- source_word: ወይረተው፡ ኵሉ፡ ተክሊክሙ
  english_pob_choice: and all your plantings shall prosper
  chosen_korean: 당신의 모든 심은 것들이 번성할 것입니다
  alternatives_korean:
  - 당신의 모든 심은 나무가 번성할 것입니다
  - 당신의 모든 심는 것이 잘될 것입니다
  - 당신의 모든 재배물이 번영할 것입니다
  lexicon: ተክል=심은 것/심는 것/식재
  rationale: ‘plantings’를 단순한 농작물보다 넓게 ‘심은 것들’로 풀어 원문의 포괄성을 보존했습니다.
- source_word: አቡሁ፡ ለአቡክሙ፡
  english_pob_choice: the father of your father
  chosen_korean: 당신의 아버지의 아버지
  alternatives_korean:
  - 당신의 조상의 아버지
  - 당신의 조부
  - 당신의 아버지의 조부
  lexicon: 아버지/아버지의 아버지
  rationale: 족보적 지칭을 직역하여 에녹이 므두셀라의 직접 호칭이 아니라, 한 세대 앞의 선조로 제시된 점을 분명히 했습니다.
- source_word: አቡሁ፡ ለአቡክሙ፡ ... ለማቱሳላ፡ ወልዱ፡ ወማቱሳላ፡ ለላሜክ፡ ወልዱ
  english_pob_choice: Enoch commanded Methuselah his son, and Methuselah his son Lamech
  chosen_korean: 에녹, 곧 당신의 아버지의 아버지가 그의 아들 므두셀라에게 명했고, 므두셀라가 그의 아들 라멕에게
  alternatives_korean:
  - 에녹이 당신의 조부 므두셀라에게 명했고, 므두셀라가 그의 아들 라멕에게
  - 에녹이 므두셀라에게, 그리고 므두셀라가 라멕에게 명했고
  - 에녹, 당신의 조상이 므두셀라에게 명했고, 므두셀라가 라멕에게
  lexicon: 명하다/아들/족보 관계
  rationale: 수정 이력의 핵심인 계보 전달 구조를 반영해, 에녹의 위치와 므두셀라·라멕의 부자 관계를 동시에 드러냈습니다.
theological_decisions:
- issue: 지시어 ‘당신’과 명령형의 체감
  chosen_reading: 문장은 예언적 권면으로서 2인칭 ‘당신’을 유지하고, 한국어에서는 ‘의롭게 되어야 하며’로 윤리적 권고의 압력을 살렸습니다.
  alternative_readings:
  - 직설 미래형으로 완화하는 읽기
  - 단순 권면형으로 낮추는 읽기
  rationale: 문맥은 축복 선언이면서도 계보 전승을 근거로 한 준명령적 권고이므로, 미래와 권고의 긴장을 함께 보존하는 표현이 적절합니다.
  doctrine_reference: 예언적 권면의 수사와 축복 진술의 병치
- issue: 끝이 끊긴 본문 처리
  chosen_reading: 원문이 중도에서 끊기므로 한국어도 말줄임표로 미완성을 보존했습니다.
  alternative_readings:
  - 의역으로 문장을 완결시키는 처리
  - 생략 없이 자연스럽게 마무리하는 처리
  rationale: 현존 게에즈 본문과 POB 영어 모두 미완성 종결을 전제하므로, 문장 완결을 보태지 않고 본문 상태를 그대로 반영했습니다.
  doctrine_reference: 본문 비평상 불완전 전승의 보존
