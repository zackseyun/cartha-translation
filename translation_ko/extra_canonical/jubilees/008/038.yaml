theological_decisions:
- issue: 지시어 ‘당신’과 명령형의 체감
  chosen_reading: 문장은 예언적 권면으로서 2인칭 ‘당신’을 유지하고, 한국어에서는 ‘의롭게 되어야 하며’로 윤리적 권고의 압력을 살렸습니다.
  alternative_readings:
  - 직설 미래형으로 완화하는 읽기
  - 단순 권면형으로 낮추는 읽기
  rationale: 문맥은 축복 선언이면서도 계보 전승을 근거로 한 준명령적 권고이므로, 미래와 권고의 긴장을 함께 보존하는 표현이 적절합니다.
  doctrine_reference: 예언적 권면의 수사와 축복 진술의 병치
- issue: 끝이 끊긴 본문 처리
  chosen_reading: 원문이 중도에서 끊기므로 한국어도 말줄임표로 미완성을 보존했습니다.
  alternative_readings:
  - 의역으로 문장을 완결시키는 처리
  - 생략 없이 자연스럽게 마무리하는 처리
  rationale: 현존 게에즈 본문과 POB 영어 모두 미완성 종결을 전제하므로, 문장 완결을 보태지 않고 본문 상태를 그대로 반영했습니다.
  doctrine_reference: 본문 비평상 불완전 전승의 보존
