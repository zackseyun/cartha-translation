base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/019.yaml
  text: '"...the LORD in the dwelling of Shem." And he knew and he knew that the Garden of Eden is the holy of holies and the dwelling of the LORD, and Mount Sinai is in the midst of the wilderness, and Mount Zion is in the midst of the navel of the earth; these three were created as holy places facing one another.'
  footnotes:
  - marker: a
    text: Or 'The LORD dwelt in the dwelling of Shem,'.
    reason: previous_rendering
translation:
  language: ko
  text: “…야훼께서 셈의 거처 안에 계셨습니다.” 그리고 그는 알고 또 알았습니다. 에덴동산이 지성소이며 야훼의 거처라는 것, 시내산이 광야 한가운데 있다는 것, 그리고 시온산이 땅의 배꼽 한가운데 있다는 것, 이 세 곳은 서로 마주 보도록 거룩한 곳으로 지어졌다는 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: POB 기본어인 야훼를 사용해 게에즈 원문의 신명적 호칭과 POB의 가시성을 유지했습니다.
- source_word: ውስተ፡ መሓድሪሁ፡ ለሴም
  english_pob_choice: in the dwelling of Shem
  chosen_korean: 셈의 거처 안에
  alternatives_korean:
  - 셈의 집 안에
  - 셈의 거주지에
  lexicon: בית/거처 어휘 대응
  rationale: 문맥상 단순한 ‘집’보다 ‘거처’가 원문의 거주 장소와 신적 임재의 긴장을 더 잘 살립니다.
- source_word: ቅድስተ፡ ቅዱሳን
  english_pob_choice: the holy of holies
  chosen_korean: 지성소
  alternatives_korean:
  - 가장 거룩한 곳
  - 지극히 거룩한 곳
  lexicon: 성소 최상급 표현
  rationale: 히브리 성소 용어로 굳어진 대응어이며, 문맥상 ‘가장 거룩한 곳’보다 용어적 식별성이 높습니다.
- source_word: ማእከለ፡ ገዳም / ማእከለ፡ ሕንብርት
  english_pob_choice: in the midst of the wilderness / in the midst of the navel of the earth
  chosen_korean: 광야 한가운데 / 땅의 배꼽 한가운데
  alternatives_korean:
  - 광야 가운데 / 세상의 중심
  lexicon: 중심 비유 어휘
  rationale: 원문의 ‘중앙’ 이미지를 살리기 위해 직설적으로 옮겼고, ‘배꼽’은 지리적 중심 비유를 그대로 반영합니다.
theological_decisions:
- issue: 절 시작이 과거 서술인지, 이전 절의 기원문을 잇는 절단면인지
  chosen_reading: 과거 서술처럼 단정하지 않고, 이전 절의 기원문을 이어 받는 완료/진술형으로 처리했습니다.
  alternative_readings:
  - “야훼께서 셈의 거처에 계시기를…”
  - “야훼께서 셈의 거처 안에 계셨습니다.”
  rationale: 게에즈 문장과 POB 주석은 이 절이 18절의 축복적 기원문을 잇는 절단면임을 보이므로, 한국어도 문맥 연결을 유지하되 지나친 과거 사건화는 피했습니다.
  doctrine_reference: 문맥-통사 판단
