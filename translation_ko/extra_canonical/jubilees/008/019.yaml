revisions:
- from: “…야훼께서 셈의 거처 안에 계셨습니다.” 그리고 그는 알고 또 알았습니다. 에덴동산이 지성소이며 야훼의 거처라는 것, 시내산이 광야 한가운데 있다는 것, 그리고 시온산이 땅의 배꼽 한가운데 있다는 것, 이 세 곳은 서로 마주 보도록 거룩한 곳으로 지어졌다는 것입니다.[a]
  to: “… 야훼께서 셈의 거처에 거하시기를.”[a] 그리고 그는 에덴동산이 지성소, 곧 야훼의 거처이고, 시내산은 광야 한가운데에 있으며, 시온산은 땅의 배꼽 한가운데에 있다는 것을 알았습니다. 이 세 곳은 서로 마주하도록 거룩한 곳으로 창조되었습니다.
  rationale: 게에즈어 원문과 문맥에 따라 첫 구절을 앞 절의 기원문으로 보존하고, 원문에 없는 ‘알고 또’의 반복을 삭제했습니다. 또한 세 성소에 관한 병렬 진술과 ‘서로 마주하도록 창조되었다’는 결론을 자연스러운 현대 한국어 합쇼체로 정리했습니다.
