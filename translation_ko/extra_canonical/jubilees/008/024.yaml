base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/024.yaml
  text: And the earth was filled with violence. And after this, they sinned against the beasts and the birds and everything that moves and everything that walks on the earth, and much blood was shed on the earth.
translation:
  language: ko
  text: 땅이 폭력으로 가득 찼습니다. 그리고 이 일 후에 그들은 들짐승과 새와 땅 위를 움직이는 모든 것과 땅 위를 걷는 모든 것에 죄를 지었고, 땅에는 많은 피가 흘렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐመፃ
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 폭행
  - 포악함
  - 난폭함
  lexicon: 일반 어휘
  rationale: 문맥상 땅을 채운 사회적·도덕적 파괴를 가리키므로, 과도하게 형사적이거나 성격 묘사로 좁혀지지 않는 ‘폭력’이 가장 자연스럽습니다.
- source_word: አበሱ፡ ሎሙ
  english_pob_choice: they sinned against
  chosen_korean: 그들은 …에 죄를 지었고
  alternatives_korean:
  - 그들은 …을 거슬러 죄를 지었고
  - 그들은 …에게 죄를 범했고
  lexicon: 일반 어휘
  rationale: 대상에 대한 죄를 직접 표현하되, 한국어에서 ‘against’의 관계를 너무 설명적으로 늘이지 않기 위해 ‘…에 죄를 짓다’를 택했습니다.
- source_word: ለአራዊት፡ ወለዐዋፍ፡ ወኵሉ ዘይትሐወስ ወዘያንሶሱ ዲበ ምድር
  english_pob_choice: the beasts and the birds and everything that moves and everything that walks on the earth
  chosen_korean: 들짐승과 새와 땅 위를 움직이는 모든 것과 땅 위를 걷는 모든 것
  alternatives_korean:
  - 짐승과 새와 움직이는 모든 것과 땅을 걷는 모든 것
  - 들짐승과 날짐승과 땅 위에서 움직이고 걷는 모든 것
  lexicon: 일반 어휘
  rationale: 열거 구조와 반복을 살리기 위해 ‘움직이는/걷는’과 ‘땅 위’를 그대로 나누어 옮겼고, ‘들짐승’은 포괄적 ‘beasts’에 가장 무난합니다.
- source_word: ትክዐወ፡ ደም፡ ብዙኅ
  english_pob_choice: much blood was shed
  chosen_korean: 많은 피가 흘렀습니다
  alternatives_korean:
  - 피가 많이 흘렀습니다
  - 많은 피가 쏟아졌습니다
  lexicon: 일반 어휘
  rationale: 수동적 유혈을 자연스럽게 표현하면서도, 원문의 과장된 양감을 유지하기 위해 ‘많은 피가 흘렀습니다’를 선택했습니다.
theological_decisions:
- issue: 폭력으로 가득 찬 땅의 상태와 뒤이은 피 흘림의 관계
  chosen_reading: 첫 문장은 도덕적·사회적 폭력의 충만함을, 뒤 문장은 그 결과로서의 실제 유혈을 구분해 옮겼습니다.
  alternative_readings:
  - ‘불의로 가득 찼습니다’로 도덕적 죄를 강조하는 읽기
  - ‘학살로 가득 찼습니다’로 사건성을 더 강하게 드러내는 읽기
  rationale: Ge'ez와 POB 모두 ‘violence’와 ‘much blood was shed’를 별도로 제시하므로, 두 층위를 합치지 않고 구분하는 편이 본문의 의미를 더 정확히 보존합니다.
  doctrine_reference: 창세기 6장 전통적 폭력-타락 모티프와 병행되는 묵시적 도덕 붕괴의 서술
- issue: 피조물 전체에 대한 죄의 범위
  chosen_reading: 짐승과 새뿐 아니라 ‘땅 위를 움직이는/걷는 모든 것’까지 포함해 비인간 피조물 전체를 포괄하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘동물들과 새들’로 단순화
  - ‘모든 생물’로 총괄
  rationale: 본문은 대상 범위를 단계적으로 넓히므로, 이를 단일 총칭으로 압축하면 열거의 강조점이 약해집니다.
  doctrine_reference: 피조세계 전체를 향한 인간의 죄책이라는 본문 내 내러티브 강조
