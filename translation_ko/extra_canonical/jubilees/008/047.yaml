review_pass:
  verdict: revise
  source_fidelity: The restrictive contrast is retained, but the draft's '피로부터 정결함을 받지 못할' is not idiomatic Korean for being cleansed of blood, and '흘리신 분' adds an unwarranted honorific to an indefinite perpetrator.
  naturalness: A revision is needed for natural modern formal-polite Korean. '피에서 정결해지다' and '그 피를 흘린 자' express the intended sense clearly and smoothly.
  terminology: Use '정결해지다' consistently for cleansing. '자' avoids the theological or social implication introduced by the honorific '분.'
  issues:
