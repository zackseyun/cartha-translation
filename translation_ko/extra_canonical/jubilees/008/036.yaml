revisions:
- from: 그리고 주님께서는 그들의 행위의 악함과 그들이 땅 한가운데에 쏟은 피 때문에 지면에서 모든 것을 멸하셨습니다. 그는 모든 것을 파괴했습니다.
  to: 그들의 악한 행위와 그들이 땅 한가운데에 흘린 피 때문에, 야훼께서는 지면에서 모든 것을 멸하셨습니다. 그분께서는 모든 것을 멸하셨습니다.
