revisions:
- from: 그들은 첫 포도주와 기름의 첫 열매를 넉넉히 가져와 그것을 받는 주님의 제단에 바쳐야 합니다. 남은 것은 주님의 집 종들이 그것을 받는 제단 앞에서 먹을지니라.
  to: 그들은 포도주와 기름의 맏물을 풍성히 가져와, 그것을 받는 야훼의 제단에 첫 열매로 바쳐야 합니다. 남은 것은 야훼의 집의 노예들이 그것을 받는 제단 앞에서 먹어야 합니다.
  rationale: 신명 및 노예 용어를 영어 POB 감사문에 맞추고, 맏물 표현과 문체를 현대 표준 합쇼체로 다듬었습니다. 제단이 ‘받는다’는 다소 낯선 수식은 원문의 표현을 보존하기 위해 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:18Z'
review_pass:
  verdict: revise
  source_fidelity: 초안은 포도주와 기름의 첫 열매 및 제단 앞에서 먹는다는 핵심 내용을 대체로 반영합니다. 그러나 영어 POB 감사문과 용어 정책에 따라 신명을 ‘주님’이 아니라 ‘야훼’로 옮겨야 하며, ‘slaves’는 ‘종들’보다 ‘노예들’이 정확합니다. 또한 두 번째 문장의 ‘먹을지니라’는 합쇼체와 일치하지 않습니다.
  naturalness: ‘첫 포도주’는 ‘포도주의 첫 열매’라는 뜻으로 오해될 수 있으므로 ‘포도주와 기름의 맏물’이 자연스럽고 정확합니다. ‘그것을 받는 제단’은 원문의 제단 수식 관계를 보존하면서도 문장 안에서 자연스럽게 처리했습니다.
  terminology: Yahweh는 ‘야훼’로, firstfruits는 ‘맏물’로, slaves는 ‘노예들’로 통일했습니다. ‘야훼의 집’과 ‘제단’은 본문의 제의적 표현을 중립적으로 보존합니다.
  issues:
