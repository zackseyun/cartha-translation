    rationale: 영어 POB 감사문은 Yahweh를 명시하며, 최신 개정도 LORD를 Yahweh로 바꾸었습니다. 따라서 ‘야훼’로 옮겨야 합니다.
  - severity: medium
    issue: ‘종들’이 ‘slaves’를 약화함
    rationale: 감사문이 servants를 slaves로 명시적으로 개정했으므로 ‘노예들’로 번역해야 합니다.
  - severity: low
    issue: ‘첫 포도주’의 의미가 불명확함
    rationale: 원문의 first of the wine and oil / firstfruits는 포도주와 기름의 맏물을 가리키므로 ‘포도주와 기름의 맏물’이 더 정확합니다.
  - severity: low
    issue: 문체 혼용
    rationale: ‘바쳐야 합니다’와 ‘먹을지니라’가 혼용되어 있으므로 표준 현대 합쇼체로 통일해야 합니다.
  revised_text: 그들은 포도주와 기름의 맏물을 풍성히 가져와, 그것을 받는 야훼의 제단에 첫 열매로 바쳐야 합니다. 남은 것은 야훼의 집의 노예들이 그것을 받는 제단 앞에서 먹어야 합니다.
