  rationale: 원문의 ‘내가 보니, 보라’라는 주목 촉구, 악령들의 오도, 화자가 청자들을 위하여 느끼는 염려, 그리고 죽음 이후의 피 흘림과 멸망이라는 경고를 현대적 합쇼체로 자연스럽게 재구성했습니다. 의미를 보태거나 교리적으로 해석하지 않았습니다.
