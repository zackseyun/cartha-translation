base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/027.yaml
  text: For I see, and behold, the demons have begun to lead you and your children astray. And now I fear for you, that after my death you will shed human blood upon the earth, and you too will be destroyed from the face of the earth.
  footnotes:
  - marker: a
    text: Or 'And now, my children, hear and do justice and righteousness, so that you may be planted in righteousness over the face of all the earth, and your glory may be lifted up before my God, who saved me from the waters of the flood.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니, 보십시오, 악령들이 이미 너희와 너희 자녀들을 잘못된 길로 이끌기 시작했습니다. 이제 나는 너희가 걱정됩니다. 내가 죽은 뒤에 너희가 땅 위에서 사람의 피를 흘리고, 너희도 땅에서 멸망할까 염려합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이제 내 자녀들아, 너희는 듣고 정의와 의를 행하여라. 그리하면 온 땅 위에 의롭게 세워지고, 홍수의 물에서 나를 구원하신 나의 하나님 앞에서 너희의 영광이 높아질 것이다.”
    reason: 이전 번역문을 보존하는 영어 POB 감사 추적 각주를 한국어로 옮겼습니다. 이는 본문 8:27의 대안 독법이 아니라 이전 렌더링에 관한 기록입니다.
lexical_decisions:
- source_word: እሬኢ፡ አነ፡ ወናሁ
  english_pob_choice: For I see, and behold
  chosen_korean: 내가 보기에는, 보십시오
  alternatives_korean:
  - 내가 보니, 보십시오
  - 나는 보며, 보라
  lexicon: see / behold
  rationale: 시각적 인식과 뒤따르는 주목 촉구를 함께 살리기 위해 ‘내가 보기에는’과 ‘보십시오’를 병치했습니다.
- source_word: አጋንንት
  english_pob_choice: the demons
  chosen_korean: 악귀들
  alternatives_korean:
  - 귀신들
  - 악령들
  lexicon: demon
  rationale: 본문의 초자연적 적대 존재를 직설적으로 드러내면서도, 한국어에서 비교적 널리 통용되는 ‘악귀들’을 선택했습니다.
- source_word: አበሱተ፡ ወጠኑ፡ ... ላዕሌክሙ፡ ወላዕለ፡ ውሉድክሙ፡
  english_pob_choice: have begun to lead you and your children astray
  chosen_korean: 너희와 너희 자녀들을 잘못된 길로 이끌기 시작했습니다
  alternatives_korean:
  - 너희와 너희 자녀들을 미혹하기 시작했습니다
  - 너희와 너희 자녀들을 속여 가기 시작했습니다
  lexicon: lead astray
  rationale: ‘잘못된 길로 이끌다’는 인도를 빙자한 오도라는 뉘앙스를 자연스럽게 살리며, ‘lead astray’의 결과적 방향성을 분명히 합니다.
- source_word: ደመ፡ ሰብእ
  english_pob_choice: human blood
  chosen_korean: 사람의 피
  alternatives_korean:
  - 인간의 피
  - 사람 피
  lexicon: blood of man
  rationale: 피 흘림의 직접성을 살리기 위해 관용적인 ‘사람의 피’를 택했습니다.
- source_word: እምገጸ፡ ምድር
  english_pob_choice: from the face of the earth
  chosen_korean: 땅의 얼굴에서
  alternatives_korean:
  - 땅의 표면에서
  - 땅에서
  lexicon: face of the earth
  rationale: 히브리계 관용구를 과도하게 평평화하지 않기 위해 직역성을 살린 ‘땅의 얼굴에서’를 유지했습니다.
theological_decisions:
- issue: 악귀가 사람과 자녀를 잘못된 길로 이끈다는 진술의 주체성
  chosen_reading: 본문의 인과를 그대로 살려, 악귀들이 실제로 공동체를 오도하기 시작한 것으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 타락 경향을 가리키는 표현으로 완화하기
  - 단순히 유혹했다로 약화하기
  rationale: 지혜·권면 문장이 아니라 실제로 작동하는 악의 세력을 전제하는 서술이므로, 그 긴장을 약화하지 않았습니다.
  doctrine_reference: 초자연적 악의 실재성
- issue: ‘땅의 얼굴에서 멸망할까 해서입니다’의 종결
  chosen_reading: ‘너희도 땅의 얼굴에서 멸망할까 해서입니다’로, 두려움의 대상이 개인과 공동체 모두에 미치는 심판 가능성을 유지했습니다.
  alternative_readings:
  - 너희도 땅에서 사라질까 해서입니다
  - 너희도 멸망할까 두렵습니다
  rationale: 원문의 병행 구조(너희 / 너희 자녀들, 피 흘림 / 멸망)를 살려 경고의 무게를 보존했습니다.
  doctrine_reference: 심판 경고의 문학적 보존
