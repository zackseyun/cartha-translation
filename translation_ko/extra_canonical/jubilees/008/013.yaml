    text: 또는 ‘심연들의 물’. 원문은 복수형입니다.
    reason: Preserves the plural form of the source term while maintaining natural Korean in the main text.
  revision_rationale: The revision transliterates the named sea, improves Korean flow and formal register, and retains the source’s plural ‘abysses’ through an anchored footnote. It does not resolve or expand the passage’s geographic identifications beyond the source wording.
