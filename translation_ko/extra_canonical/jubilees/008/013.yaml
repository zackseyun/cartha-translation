  language: ko
  text: 그 절반은 이 강 한가운데를 지나 서쪽으로 이어져, 이 강이 흘러나오는 심연의 물[a]에 이를 때까지 계속됩니다. 그 물은 메앗 바다로 흘러 들어가고, 이 강은 대해로 흘러 들어갑니다.
  philosophy: optimal-equivalence
  footnotes:
