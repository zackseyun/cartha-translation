  language: ko
  text: 그 절반은 이 강 가운데를 지나 서쪽으로 가다가, 이 강이 흘러나오는 심연의 물에 닿을 때까지 계속됩니다. 그리고 그 물은 Sea Me'at에 쏟아집니다. 그리고 이 강은 대해로 흘러 들어갑니다.
