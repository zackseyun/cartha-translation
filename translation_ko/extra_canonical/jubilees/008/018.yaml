translation:
  language: ko
  text: 셈과 그의 아들들이 그것을 영원히, 그들의 대대로 영원히 소유하도록 하셨습니다.[a] 노아는 이 몫이 셈과 그의 아들들에게 돌아왔으므로 기뻐하였고, 예언으로 자기 입으로 말한 모든 것을 기억하였습니다. 그는 이렇게 말하였습니다. 「셈의 하나님이신 야훼는 찬송받으소서. 그분이 거하시기를…」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것이 셈과 그의 아들들에게 영원한 소유로 돌아왔다’.
    reason: 원문의 ‘나오다/돌아오다’와 소유 목적 표현의 관계에 대한 가능한 대안 번역을 제시하며, 영어 POB 감사문의 각주 기능을 보존합니다.
lexical_decisions:
- source_word: ለእኂዞታ
  english_pob_choice: to possess it
  chosen_korean: 그것을 영원히 소유하는 몫으로
  alternatives_korean:
  - 그것을 차지하도록
  - 그것을 소유하도록
  lexicon: possession / infinitive with suffix
  rationale: 게에즈 형태가 ‘소유하다’의 목적적 표현이므로, 단순한 명사구보다 소유의 결과를 드러내되 한국어에서는 자연스럽게 ‘몫으로’ 풀어 옮겼습니다.
- source_word: ወተፈሥሐ ኖኅ
  english_pob_choice: Noah rejoiced
  chosen_korean: 노아는 … 기뻐하였고
  alternatives_korean:
  - 노아는 … 즐거워하였고
  - 노아는 … 환희하였고
  lexicon: rejoice / be glad
  rationale: 문맥상 분배가 셈에게 돌아온 것을 보고 한 반응이므로, 과장 없이 자연스러운 현대 한국어 동사 ‘기뻐하다’를 택했습니다.
- source_word: በትንቢት
  english_pob_choice: in prophecy
  chosen_korean: 예언 가운데
  alternatives_korean:
  - 예언으로
  - 예언 안에서
  lexicon: prophecy
  rationale: 노아가 한 말을 단순한 회상으로 줄이지 않고, 그 말이 예언적 발화였음을 분명히 드러내기 위해 ‘예언 가운데’로 옮겼습니다.
- source_word: እግዚአብሔር አምላኩ ለሴም
  english_pob_choice: the Lord God of Shem
  chosen_korean: 셈의 하나님 야훼
  alternatives_korean:
  - 셈의 주 하나님
  - 셈의 하나님 여호와
  lexicon: divine name / title
  rationale: 게에즈의 신명 호칭을 소스-직역 원칙에 따라 ‘야훼’로 옮기고, 소유격 구조는 한국어에서 자연스럽게 ‘셈의 하나님’으로 처리했습니다.
theological_decisions:
- issue: 노아의 말이 중간에서 끊기는 구절 처리
  chosen_reading: 마지막 축복문을 한국어에서 중단점과 말줄임표로 남겨, 원문이 이어지는 미완성 문장임을 드러냈습니다.
  alternative_readings:
  - 문장을 보완하여 완결된 축복문으로 옮김
  - 다음 절로 이어붙여 완성
  rationale: 제공된 게에즈 본문과 영어 감사문 모두 끝이 열려 있으므로, 한국어도 결말을 인위적으로 채우지 않는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 본문 비완결 보존 원칙
- issue: YHWH 대응어
  chosen_reading: 주석 없이 본문에서 ‘야훼’를 사용했습니다.
  alternative_readings:
  - 여호와
  - 주
  rationale: 프로젝트 기본어에 따라 원문 신명은 학술적 음역인 ‘야훼’로 직역해, 전통 교회어의 완화 없이 स्रोत의 호칭을 보존했습니다.
  doctrine_reference: YHWH transliteration policy
