revisions:
- from: 셈과 그의 아들들에게는 그것을 영원히 소유하는 몫으로, 그들의 대대로 영원히 주어졌습니다. 노아는 이 몫이 셈과 그의 아들들에게 나와 기뻐하였고, 자기 입으로 예언 가운데 말한 모든 것을 기억하였습니다. 그가 말하기를, 「셈의 하나님 야훼는 찬송받으소서. 그리고 그가 거하…」[a]
  to: 셈과 그의 아들들이 그것을 영원히, 그들의 대대로 영원히 소유하도록 하셨습니다.[a] 노아는 이 몫이 셈과 그의 아들들에게 돌아왔으므로 기뻐하였고, 예언으로 자기 입으로 말한 모든 것을 기억하였습니다. 그는 이렇게 말하였습니다. 「셈의 하나님이신 야훼는 찬송받으소서. 그분이 거하시기를…」
  rationale: 첫 구문은 원문의 목적적 무한사 표현을 살려 ‘소유하도록’으로 옮기고, 한국어에서 불가피하게 보충되는 서술어는 문맥상 배분의 주체를 과도하게 특정하지 않는 방식으로 처리했습니다. 노아가 기뻐한 이유는 ‘몫이 돌아왔다’로 자연스럽게 옮겼습니다. 예언적 발화와 신명 호칭, 그리고 제공된 원문이 인용 도중 끝나는 상태를 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:21Z'
