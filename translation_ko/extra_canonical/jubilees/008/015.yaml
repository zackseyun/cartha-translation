revisions:
- from: 이 바다는 애굽 바다의 혀라고 불립니다. 그리고 그곳에서 북쪽으로 큰 바다의 어귀, 곧 물가까지 뻗어 나가며, 서쪽으로 아프라를 향해 이어지고, 기혼 강의 물에 이르기까지 계속되니, 곧 기혼 물의 북쪽입니다.[a][b]
  to: 이 바다는 ‘애굽 바다의 혀’라고 불립니다. 그것은 그곳에서 북쪽으로 큰 바다의 어귀에 있는 물가까지 뻗어 나가고, 서쪽으로 아프라까지 이어지며, 기혼 강의 물에 가까이 이르기까지 나아가 그 물의 북쪽으로 갑니다.
  rationale: 원문의 지리적 진행을 한국어의 병렬 동사 구조로 재구성했습니다. ‘큰 바다의 어귀’와 ‘물가’의 관계는 ‘어귀에 있는 물가’로 표현하고, 마지막 두 지리 표현은 동격으로 처리하지 않고 ‘기혼 강의 물에 가까이 이르기까지’ 및 ‘그 물의 북쪽으로’로 각각 보존했습니다. 영어 감사 기록의 대안 각주는 한국어 본문에서 별도 대안 독법을 제공하지 않으므로 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:22Z'
