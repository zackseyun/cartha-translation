  yaml_path: translation/extra_canonical/jubilees/008/015.yaml
  text: This sea is named the tongue of the Egyptian Sea. And it extends from there northward to the mouth of the Great Sea, at the waters' edge, and it goes along toward the west to Afra, and it goes on until it approaches the waters of the Gihon River, on the north side of the waters of Gihon.
  footnotes:
  - marker: a
    text: Or 'toward the west of Afra'.
    reason: previous_rendering
  - marker: b
    text: Or 'waters of Gihon River'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 바다는 애굽 바다의 혀라고 불립니다. 그리고 그곳에서 북쪽으로 큰 바다의 어귀, 곧 물가까지 뻗어 나가며, 서쪽으로 아프라를 향해 이어지고, 기혼 강의 물에 이르기까지 계속되니, 곧 기혼 물의 북쪽입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዛቲ፡ ባሕር፡ ስማ፡ 'ልሳነ፡ ባሕረ፡ ገብጽ።
  english_pob_choice: This sea is named the tongue of the Egyptian Sea.
  chosen_korean: 이 바다는 애굽 바다의 혀라고 불립니다.
  alternatives_korean:
  - 이 바다는 애굽 바다의 언어라고 불립니다.
  - 이 바다는 애굽 바다의 혓바닥이라고 불립니다.
  lexicon: ባሕር / ልሳን
  rationale: ‘혀’가 지형의 모양을 빗댄 명칭을 가장 직접적으로 살리며, 영어 POB의 ‘tongue’를 자연스럽게 반영합니다.
- source_word: መንገበ፡ ሰሜን፡
  english_pob_choice: northward
  chosen_korean: 북쪽으로
  alternatives_korean:
  - 북으로
  - 북방으로
  lexicon: 방향 표현
  rationale: 지리적 진행 방향을 평이하고 현대적인 표준어로 나타내기 위해 ‘북쪽으로’를 택했습니다.
- source_word: መንገበ፡ አፉሃ፡ ለባሕር፡ ዐቢይ፡ ' ውስተ፡ ክናፍረ፡' ማያት፡
  english_pob_choice: to the mouth of the Great Sea, at the waters' edge
  chosen_korean: 큰 바다의 어귀, 곧 물가까지
  alternatives_korean:
  - 큰 바다의 입구, 곧 물가까지
  - 큰 바다의 어귀에서 물가까지
  lexicon: 아훔 / ክናፍር
  rationale: ‘어귀’는 강·바다의 입구를 가리키는 자연스러운 한국어이며, ‘waters’ edge’를 ‘물가’로 옮겨 위치 관계를 분명히 했습니다.
- source_word: ወተሐውር፡ መንገበ፡ ዐረብ፡' ዐፍራ፡'
  english_pob_choice: and it goes along toward the west to Afra
  chosen_korean: 서쪽으로 아프라를 향해 이어지고
  alternatives_korean:
  - 서쪽으로 아프라까지 이어지고
  - 아프라를 향해 서쪽으로 이어지고
  lexicon: መንገብ / ዐረብ / ዐፍራ
  rationale: 개정 근거에 따라 ‘toward the west to Afra’의 이중 방향을 살려, ‘서쪽으로’와 ‘아프라를 향해’를 함께 배치했습니다.
