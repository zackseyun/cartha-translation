  source_fidelity: 초안은 바다의 명칭, 북쪽 진행, 큰 바다의 어귀와 물가, 서쪽의 아프라, 기혼 강의 물이라는 주요 요소를 대체로 충실히 옮겼습니다. 그러나 마지막의 ‘곧 기혼 물의 북쪽입니다’는 원문의 연속된 경계 진행을 설명적 동격으로 바꾸어, 기혼의 물에 가까이 이른 뒤 그 북쪽으로 진행한다는 구문을 충분히 드러내지 못합니다.
