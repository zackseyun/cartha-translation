  text: 셈은 제비를 뽑아 땅 한가운데로 나왔는데, 셈은 그 자신과 그의 자손들을 위해 대대로 영원히 상속 재산을 차지하게 되었습니다. 라파 산맥 한가운데서, 티나 강 어귀에서 말입니다.
