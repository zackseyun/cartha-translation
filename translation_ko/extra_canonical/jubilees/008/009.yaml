  source_fidelity: 게에즈 본문의 해당 절은 ‘그들이 그것을 서로 비밀리에 나누고 노아에게 알렸다’는 뜻이며, 초안이 이를 충실히 옮깁니다. ‘그것’은 앞 절의 땅의 분할을 가리키지만, 본문의 대명사적 표현을 그대로 유지한 것이 적절합니다.
  naturalness: ‘그리고 그들은 그것을 서로 비밀리에 나누어 노아에게 알렸습니다.’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘서로 비밀리에’는 문맥상 ‘그들끼리 은밀히’라는 뜻을 무리 없이 전달합니다.
  terminology: 노아는 통용 표기이며, 특별한 신학 용어나 지명 문제가 없습니다. 절 내에 각주가 요구될 만한 본문상 난점이나 앵커도 없습니다.
