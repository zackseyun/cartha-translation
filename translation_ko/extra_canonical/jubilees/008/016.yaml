translation:
  language: ko
  text: 그리고 그것은 이 강의 경계 쪽으로 향하고[a], 동쪽으로 가서 에덴 동산에 가까워지며, 그 북쪽을 향하여 북쪽으로 갑니다[b]. 또 에덴 온 땅의 동쪽에서 모든 동쪽으로 나아가, 동쪽 안에서 돌아 그 산의 동쪽을 향하여 가까워지는데[c], 그 이름은
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 강의 경계를 향하여’.
    reason: መንገበ의 방향 표지와 ‘이 강의 경계’라는 소유 관계를 한국어에서 달리 결속할 수 있음을 밝힙니다.
  - marker: b
    text: 직역하면 ‘그 북쪽을 향하여, 북쪽으로’.
    reason: 원문의 반복된 북쪽 방향 표현을 보존하며, 이를 ‘북동쪽’으로 합성하지 않았음을 분명히 합니다.
  - marker: c
    text: 또는 ‘그 산의 동쪽에 가까워지는데’.
    reason: 마지막 방향구는 산 자체가 아니라 그 산의 동쪽을 가리키며, 한국어의 방향 표현과 도달 표현 사이의 가능한 차이를 제시합니다.
