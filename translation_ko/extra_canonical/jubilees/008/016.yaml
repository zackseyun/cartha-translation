    issue: 에덴 동산과 북쪽 방향의 관계가 불명확합니다.
    rationale: 원문은 에덴 동산에 가까워지는 동작 뒤에 ‘그 북쪽을 향하여, 북쪽으로’라는 방향을 덧붙입니다. 초안의 ‘에덴 동산의 북쪽, 곧 북쪽에 가까워지며’는 동산의 북쪽 자체에 가까워지는 뜻으로 재구성하고 ‘곧’이라는 해석적 등식을 추가합니다.
  - severity: medium
    issue: ‘그 모든 동쪽을 따라’가 원문의 방향 표지를 경로 표지로 변경합니다.
    rationale: 원문의 ‘to all the east’에 해당하는 부분은 ‘모든 동쪽으로’라는 방향을 보존하는 것이 안전합니다. ‘따라’는 원문에 없는 선형 경로의 의미를 넣습니다.
