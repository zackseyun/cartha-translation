translation:
  language: ko
  text: 그리고 그것은 이 강의 경계 쪽으로 향하고, 동쪽으로 가서 에덴 동산의 북쪽, 곧 북쪽에 가까워지며, 에덴의 온 땅의 동쪽에서부터 그리고 그 모든 동쪽을 따라 돌다가, 그 산의 동쪽에 이르는데, 그 이름은[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንገበ / mangaba
  english_pob_choice: toward
  chosen_korean: ~쪽으로 향하고
  alternatives_korean:
  - ~으로 가고
  - ~을 향하여
  lexicon: directional preposition
  rationale: Ge'ez의 방향 표시는 ‘길’이 아니라 ‘toward/방향’을 뜻하므로, 한국어에서도 이동 방향을 드러내는 표현으로 옮겼습니다.
- source_word: ድንጋጉ / dengagu
  english_pob_choice: border
  chosen_korean: 경계
  alternatives_korean:
  - 변두리
  - 강둑
  - 가장자리
  lexicon: boundary noun
  rationale: 본문과 POB 수정 이력에 따라 이것은 고유명사가 아니라 ‘경계/경계선’의 뜻이므로, 강의 물리적 경계를 드러내는 ‘경계’로 옮겼습니다.
- source_word: ገነት ዘኤዶም
  english_pob_choice: garden of Eden
  chosen_korean: 에덴 동산
  alternatives_korean:
  - 에덴의 동산
  - 낙원
  lexicon: proper noun
  rationale: 에덴은 고유명사로 보존하고, 문맥상 낯설지 않게 ‘동산’과 결합해 표준적인 성경 한국어 어감을 유지했습니다.
- source_word: መንገበ፡ ሰሜኑ ለሰሜን
  english_pob_choice: toward its north, to the north
  chosen_korean: 북쪽, 곧 북쪽에 가까워지며
  alternatives_korean:
  - 그 북쪽으로, 북쪽으로
  - 북북쪽으로
  lexicon: directional repetition
  rationale: 원문은 ‘북쪽’ 표현을 반복해 방향을 강조하므로, 단순히 하나의 방위어로 합치지 않고 반복을 살린 한국어로 옮겼습니다.
theological_decisions:
- issue: 서술이 미완으로 끝나는 형식
  chosen_reading: 마지막 절을 ‘그 이름은’에서 끊어, 원문이 이어질 다음 구절을 기다리는 미완의 문장으로 보존했습니다.
  alternative_readings:
  - 문장을 보충해 매끈하게 완결하기
  - 끝맺는 표현을 덧붙이기
  rationale: 주어진 원문과 POB 시안이 모두 명칭이 아직 제시되지 않은 상태에서 끝나므로, 번역이 내용을 임의로 보충하지 않도록 미완성을 그대로 살렸습니다.
  doctrine_reference: 본문 충실성 및 과잉보충 금지 원칙
