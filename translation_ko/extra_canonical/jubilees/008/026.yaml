  - marker: b
    text: Or 'that you have not walked in righteousness'.
    reason: previous_rendering
  - marker: c
    text: Or 'paths of corruption'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 땅 한가운데에 쏟은 피로 말미암아, 하나님께서는 모든 것을 멸하셨습니다.[a] 나와 너희, 내 자녀들과 우리와 함께 방주에 들어온 모든 사람만 남았습니다. 이제 보십시오. 나는 너희의 행위가 내 앞에 드러나 있는 것을 봅니다. 너희는 의로 걷고 있지 않습니다.[b] 너희는 부패의 길로 걷기 시작했고,[c] 각자 자기 이웃과 갈라서며, 서로 시기하고, 함께 하나로 연합하지도 않습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅 한가운데에 있던 자들을 그분께서 모두 멸하셨습니다.’
    reason: 이전 번역에 따른 대안 독법입니다. 본문은 ዘከዐዉ를 ‘쏟았다/흘렸다’로 이해하여, 앞 절에서 언급된 피를 받는 번역을 따릅니다.
  - marker: b
    text: 또는 ‘너희가 의로 걷지 않았다는 것을.’
    reason: 이전 번역에 따른 완료적 해석입니다. 본문은 미완료형의 현재·지속적 의미를 반영합니다.
  - marker: c
    text: 또는 ‘부패의 길들.’
    reason: 이전 번역에 따른 복수 해석입니다. 본문은 단수형 በፍኖተ를 따라 ‘길’로 옮깁니다.
lexical_decisions:
- source_word: ዘከዐዉ ... ኵሎ
  english_pob_choice: which they shed ... He destroyed everything
  chosen_korean: 그들이 땅 한가운데에 쏟은 피를 ... 모두 멸하셨습니다
  alternatives_korean:
  - 땅 한가운데에 쏟은 것을 ... 모두 멸하셨습니다
  - 그들이 땅 가운데서 흘린 피를 ... 전부 멸하셨습니다
  lexicon: source-note
  rationale: 게에즈 동사 `ዘከዐዉ`는 ‘쏟다/흘리다’의 뜻이므로, 영어 POB의 수정처럼 대상은 ‘피’로 이해하는 것이 문맥과 부합합니다. `ኵሎ`는 ‘모두/전부’이므로 멸망의 전면성을 살렸습니다.
- source_word: በፍኖተ ሙስና
  english_pob_choice: in the path of corruption
  chosen_korean: 부패의 길
  alternatives_korean:
  - 타락의 길
  - 부패로 가는 길
  lexicon: source-note
  rationale: '`በፍኖተ`가 단수 ‘길’이므로, 영어 POB의 수정에 맞춰 복수가 아니라 단수로 옮겼습니다. `ሙስና`는 도덕적 타락을 가리켜 ‘부패’가 가장 직접적입니다.'
- source_word: ትትፋለጡ ... እምነ ቢጹ
  english_pob_choice: you are separating, each one from his neighbor
  chosen_korean: 서로 각자가 자기 이웃에게서 갈라서며
  alternatives_korean:
  - 각자 이웃에게서 분리되며
  - 서로에게서 떨어져 나가며
  lexicon: source-note
  rationale: 분리의 상호성을 드러내기 위해 ‘서로’와 ‘각자’를 함께 살렸고, `ቢጹ`는 ‘이웃/동무’의 의미로 자연스럽게 ‘이웃’으로 옮겼습니다.
- source_word: ኅቡረ
  english_pob_choice: united together
  chosen_korean: 함께 하나로 연합하지도
  alternatives_korean:
  - 함께 모이지도
  - 한마음이 되지도
  lexicon: source-note
  rationale: '`ኅቡረ`는 ‘함께, 공동으로’의 뜻이므로 단순한 물리적 모임보다 공동체적 일치를 드러내는 ‘하나로 연합하다’가 적절합니다.'
theological_decisions:
- issue: 의로 걷지 않음과 부패의 길의 대조
  chosen_reading: ‘의로 걷고 있지 않습니다’와 ‘부패의 길로 걷기 시작했습니다’를 병렬해 현재 진행성과 전환을 함께 드러냈습니다.
  alternative_readings:
  - ‘의롭게 걷지 않았습니다’
  - ‘부패의 길에 들어섰습니다’
  rationale: 게에즈 시제와 영어 POB의 수정은 현재적 행위와 시작된 경로를 모두 보여 주므로, 단순 과거 완료로 고정하지 않고 진행성과 시작을 함께 표현하는 것이 좋습니다.
  doctrine_reference: 윤리적 경고의 현재성
