revisions:
- from: 그들이 땅 한가운데에 쏟은 피를 하나님께서 모두 멸하셨습니다. 그리고 나와 너희, 내 자녀들과 함께 방주에 들어온 모든 사람만 남았습니다. 이제 보십시오, 나는 너희의 행위를 내 앞에서 봅니다. 너희는 의로 걷고 있지 않습니다. 너희는 부패의 길로 걷기 시작했고, 서로 각자가 자기 이웃에게서 갈라서며, 서로를 시기하고, 함께 하나로 연합하지도 않습니다.[a][b]
  to: 그들이 땅 한가운데에 쏟은 피로 말미암아, 하나님께서는 모든 것을 멸하셨습니다.[a] 나와 너희, 내 자녀들과 우리와 함께 방주에 들어온 모든 사람만 남았습니다. 이제 보십시오. 나는 너희의 행위가 내 앞에 드러나 있는 것을 봅니다. 너희는 의로 걷고 있지 않습니다.[b] 너희는 부패의 길로 걷기 시작했고,[c] 각자 자기 이웃과 갈라서며, 서로 시기하고, 함께 하나로 연합하지도 않습니다.
  rationale: 첫 절의 목적어 관계를 바로잡아 피를 멸하셨다는 오독을 피하고, ‘모든 것’의 범위를 보존했습니다. 이어지는 권고는 현재적 비난, 부패의 길로 들어선 상태, 이웃과의 분열·시기·비연합이라는 병렬을 자연스러운 현대 한국어 합쇼체로 유지했습니다. 세 각주도 각각의 해당 본문에 표지를 배치했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:17Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 게에즈어와 영어 POB의 최근 교정처럼 ‘그들이 땅 한가운데에 쏟은 피’와 그 결과인 ‘모든 것을 멸하셨다’를 구별해야 합니다. 현 초안의 ‘피를 … 모두 멸하셨습니다’는 피 자체를 멸한 것으로 읽힙니다. 또한 ዘተሐውሩ의 현재적 의미와 단수 ‘부패의 길’은 유지되어야 합니다.
  naturalness: ‘나는 너희의 행위를 내 앞에서 봅니다’와 ‘서로 각자가 자기 이웃에게서 갈라서며’는 현대 한국어로 다소 어색합니다. ‘너희의 행위가 내 앞에 드러나 있는 것을 봅니다’, ‘각자 자기 이웃과 갈라서고’로 고치면 뜻과 격식 있는 합쇼체를 함께 살릴 수 있습니다.
  terminology: ‘의’, ‘부패의 길’, ‘방주’, ‘시기하다’, ‘연합하다’는 문맥상 적절합니다. 다만 원문의 ‘모든 것’은 사람들로 한정하지 않는 편이 안전합니다.
  issues:
  - severity: high
    issue: 첫 문장이 피를 멸하신 것으로 읽힘
