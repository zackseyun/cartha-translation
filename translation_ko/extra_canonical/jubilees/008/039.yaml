  to: 그는 자기 조상들이 그에게 명한 모든 것을 내게 명하였습니다. 나 역시 너희, 곧 내 자녀들에게 명합니다. 이는 에녹이 첫 희년들에, 그가 일곱째 세대에 살아 있을 때 자기 아들에게 명한 대로입니다. 그는 죽는 날까지 자기 아들과 그 아들의 자녀들에게 명하고 증언하였습니다.[a]
