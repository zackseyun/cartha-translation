base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/039.yaml
  text: He commanded me all that his fathers had commanded him. And I also command you, my children, according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation; he commanded and testified to his son and to his son's children until the day of his death.
  footnotes:
  - marker: a
    text: Or 'made it heard'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 자기 조상들이 그에게 명한 모든 것을 내게 명하였습니다. 나 역시 너희, 곧 내 자녀들에게 명합니다. 이는 에녹이 첫 희년들에, 그가 일곱째 세대에 살아 있을 때 자기 아들에게 명한 대로입니다. 그는 죽는 날까지 자기 아들과 그 아들의 자녀들에게 명하고 증언하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “듣게 하였다”.
    reason: 게에즈어 አስምዐ는 문자적으로는 ‘듣게 하였다’라는 사역 표현이며, 문맥상 ‘증언하였다’로도 이해될 수 있습니다.
lexical_decisions:
- source_word: አዘዘኒ፡ ኵሎ፡ ዘአዘዝዎ፡ አበዊሁ
  english_pob_choice: He commanded me all that his fathers had commanded him
  chosen_korean: 그는 자기 조상들이 그에게 명한 모든 것을 내게 명하였습니다
  alternatives_korean:
  - 그는 자기 아버지들이 그에게 명한 모든 것을 내게 명령하였습니다
  - 그는 자기 조상들이 그에게 지시한 모든 것을 내게 명하였습니다
  lexicon: 아버지들/조상들, 명하다
  rationale: Ge'ez는 ‘아버지들/조상들’과 ‘명하다’의 반복 구조를 사용하므로, 지시나 권고보다 강한 위계적 명령을 살리면서도 문맥상 ‘조상들’로 넓게 옮겼습니다.
- source_word: ወአነሂ፡ እኤዝዘክሙ፡ ውሉድየ፡
  english_pob_choice: And I also command you, my children
  chosen_korean: 나도 역시 너희, 내 자녀들에게 명하겠습니다
  alternatives_korean:
  - 나도 너희, 내 자녀들에게 명령하겠습니다
  - 나 역시 너희, 내 자녀들에게 지시하겠습니다
  lexicon: 명하다 / 자녀들
  rationale: 직역적 ‘자녀들’이 Ge'ez의 친족 호칭을 가장 잘 살리고, 미래형처럼 읽히는 문맥상 한국어는 의지적 현재-미래인 ‘명하겠습니다’로 자연스럽게 처리했습니다.
- source_word: በከመ፡ አዘዘ፡ ሄኖክ፡ ለወልዱ፡ *በቀዳሚ፡ እዮቤልውሳት፡ እንዘ፡ ሕያው፡ ውእቱ፡ ውስተ፡ ትዝምዳ፡ ሳባዕ፡
  english_pob_choice: according to how Enoch commanded his son in the first jubilees, while he was alive, in the seventh generation
  chosen_korean: 이는 에녹이 첫 희년 때, 곧 그가 살아 있던 일곱째 세대에 자기 아들에게 명한 것과 같으며
  alternatives_korean:
  - 에녹이 첫 희년 동안 살아 있을 때 자기 아들에게 명한 것처럼
  - 에녹이 처음 희년 때, 살아 있던 일곱째 세대에 자기 아들에게 명한 대로
  lexicon: 첫 희년, 일곱째 세대, 명하다
  rationale: ‘첫 희년’과 ‘일곱째 세대’는 본문의 시간 표지를 보존해야 하므로 분리해 옮겼고, 비교 구문 ‘according to how’는 한국어의 ‘것과 같으며’로 자연스럽게 대응했습니다.
- source_word: ወአስምዐ፡ ለወልዱ፡ ወለውሉደ፡ ውሉዱ፡
  english_pob_choice: he commanded and testified to his son and to his son's children
  chosen_korean: 그는 자기 아들과 그 아들의 자녀들에게 증언하여
  alternatives_korean:
  - 그는 자기 아들과 그 아들의 자녀들에게 증언하고
  - 그는 자기 아들과 그 아들의 자녀들에게 증거하고
  lexicon: 증언하다
  rationale: Ge'ez의 causative 동사는 단순한 전달보다 엄숙한 증언/증거 행위를 가리키므로, POB의 audit decision을 따라 ‘증언하여’로 옮겼습니다.
theological_decisions:
- issue: 세대적·계보적 전달 구조의 보존
  chosen_reading: 에녹→아들→손자/자녀들로 이어지는 권면과 증언의 계승을 그대로 드러내었습니다.
  alternative_readings:
  - 도덕적 교훈으로 완화하여 일반화하기
  - 가문 전승으로만 축소하기
  rationale: 본문은 단순한 개인 권면이 아니라 조상들의 명령이 후손에게 이어지는 언약적-가계적 전달을 강조하므로, 그 긴장을 약화하지 않았습니다.
  doctrine_reference: 전승/계보에 대한 본문 자체의 강조
- issue: ‘증언하다’의 법정적·엄숙한 뉘앙스
  chosen_reading: ‘증언하여’로 옮겨 단순한 말하기보다 공식적 증거의 성격을 살렸습니다.
  alternative_readings:
  - ‘말하여’
  - ‘가르쳐’
  rationale: 영어 POB가 ‘testified’를 채택한 것은 Ge'ez 동사의 의미를 엄숙한 증언으로 이해한 것이므로, 한국어에서도 그 어조를 보존했습니다.
  doctrine_reference: 증언/증거의 성격
