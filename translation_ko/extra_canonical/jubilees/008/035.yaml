  to: 그 후에 그들은 짐승과 새와 움직이는 모든 것과 땅 위를 다니는 모든 것에게 죄를 범하였고, 땅에 많은 피를 흘렸습니다. 사람의 마음에 품는 모든 생각과 욕망은 언제나 헛되고 악한 것을 향했습니다.
