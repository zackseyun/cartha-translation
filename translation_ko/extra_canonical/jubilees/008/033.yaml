revisions:
- from: 그리고 그들은 아들들을 낳았으니 곧 나비딤이라. 그리고 그들은 모두 서로 다르며, 서로를 잡아먹었습니다. 거인은 나필을 죽였고 나필은 엘리오와 엘리오 인류와 또 ​​한 사람을 죽였습니다.
  to: 그리고 그들은 아들들을 낳았는데, 곧 나피딤입니다. 그들은 모두 서로 달랐고, 서로를 잡아먹었습니다. 거인은 나필을 죽였고, 나필은 엘료를 죽였으며, 엘료는 인류를 죽였고, 사람들은 서로를 죽였습니다.
  rationale: 원문의 고유 명칭과 살해의 순차적 병렬 구조를 보존하되, 한국어에서 생략될 수 없는 주어·목적어·술어를 보충했습니다. ‘사람들은 서로를 죽였습니다’는 영어의 ‘one man another’를 자연스러운 상호 표현으로 옮긴 것입니다.
  reviewer_model: gpt-5.6-terra
