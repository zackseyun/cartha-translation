translation:
  language: ko
  text: …그리고 달과 별들이 하늘의 모든 징조들 가운데 있었습니다. 그리고 그는 그것을 적어 두고는 그것에 대해 아무 말도 하지 않았습니다…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወርኅ፡ ወከዋክብት፡
  english_pob_choice: the moon and the stars
  chosen_korean: 달과 별들
  alternatives_korean:
  - 달과 별
  - 달과 별무리
  lexicon: 달, 별
  rationale: 게에즈 원문과 POB 영어 모두 천체를 평이하게 병렬로 제시하므로, 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: ውስተ፡ ኵሉ፡ ትእምረ፡ ሰማይ።
  english_pob_choice: in all the signs of heaven
  chosen_korean: 하늘의 모든 징조들 가운데
  alternatives_korean:
  - 하늘의 모든 표징들 가운데
  - 하늘의 모든 징조 안에서
  lexicon: 징조, 하늘
  rationale: ትእምረ는 ‘징조/표징’의 뜻이므로, 점술적 뉘앙스를 살리면서도 현대 독자가 읽을 수 있는 ‘징조들’로 옮겼습니다.
- source_word: ወጸሐፋ፡
  english_pob_choice: And he wrote it down
  chosen_korean: 그리고 그는 그것을 적어 두고
  alternatives_korean:
  - 그리고 그는 그것을 기록하고
  - 그리고 그는 그것을 써 두고
  lexicon: 기록하다, 적어 두다
  rationale: POB의 개정된 영어가 ‘wrote it down’으로 읽히므로, 단순한 필기가 아니라 보존 목적의 기록 느낌을 살려 ‘적어 두고’로 옮겼습니다.
- source_word: ወአነገረ፡ በእንቲአሃ፡
  english_pob_choice: and said nothing about it
  chosen_korean: 그리고 그것에 대해 아무 말도 하지 않았습니다
  alternatives_korean:
  - 그리고 그것을 말하지 않았습니다
  - 그리고 그것에 관해 침묵했습니다
  lexicon: 말하다, 침묵하다
  rationale: 제공된 영어 및 개정 사유에 따라 이 부분은 ‘말하지 않다/아무 말도 하지 않다’의 의미로 처리했습니다.
theological_decisions:
- issue: 별과 달을 둘러싼 ‘하늘의 징조들’ 표현
  chosen_reading: 점성술적 관측이나 하늘의 표지 체계를 암시하는 표현으로 그대로 유지했습니다.
  alternative_readings:
  - 단순한 천문 현상 묘사로 순화
  - ‘표징’으로만 번역해 종교적 함의를 약화
  rationale: 원문과 POB 영어 모두 ‘signs/징조들’이라는 비일상적 어휘를 사용하므로, 전통적 교회어로 완화하지 않고 가능한 한 직접적으로 살렸습니다.
  doctrine_reference: 본문-수준의 문맥 보존 원칙
- issue: POB 개정 주석의 분절 오류 반영
  chosen_reading: 영어 주석이 가리키는 더 긴 대안문은 본문에 넣지 않고, 현재 주어진 게에즈 본문과 개정된 영어 본문에 맞춰 번역했습니다.
  alternative_readings:
  - ‘감시자들의 가르침’이 포함된 긴 대안문을 본문으로 채택
  - 두 전승을 본문과 각주로 병렬 제시
  rationale: 제공된 source_payload의 현행 본문은 짧은 문장 단위이며, 최신 수정은 해당 영어가 다른 절의 일부를 잘못 가져온 것으로 판정했기 때문에 본문은 현재 소스에만 맞추었습니다.
  doctrine_reference: 본문 비평 및 절 경계 정합성
