review_pass:
  verdict: revise
  source_fidelity: 후반절은 게에즈어 및 영어 POB의 의미를 대체로 따르지만, ‘피를 흘리게 하였습니다’는 원문의 능동 행위를 사역으로 바꿉니다. 첫 절은 제시된 게에즈어 본문과 영어 POB 모두 동사 없이 ‘사람은 그의 이웃을’로 끝나는 불완전한 구문이므로, ‘속였습니다’라는 보충은 근거가 없습니다.
  naturalness: ‘모든 사람이 스스로를 팔아 악을 행하고 많은 피를 흘리게 하였습니다’는 어색한 결합이며 사역 표현도 부정확합니다. 목적을 나타내는 ‘~하려고 자신을 팔았습니다’가 현대 한국어에서 자연스럽습니다. 첫 절의 보충은 대괄호와 주석으로 명시해야 합니다.
  terminology: ዐመፃ는 여기서 ‘악’보다 도덕적·사회적 불의를 포함하는 ‘불의’가 더 적절합니다. ‘많은 피를 흘리다’는 유혈과 살육을 관용적으로 충실히 전달합니다.
  issues:
  - severity: high
    issue: 첫 절에 ‘속였습니다’를 보충함
    rationale: 제시된 원문과 영어 POB에는 ‘사람은 자기 이웃을’ 뒤에 해당 동사가 없습니다. ‘속이다’는 본문이나 문맥 증거 없이 특정 의미를 부과합니다.
  - severity: medium
    issue: ‘많은 피를 흘리게 하였습니다’라는 사역 표현
    rationale: 원문은 각 사람이 많은 피를 ‘흘렸다’고 말하며, 다른 이에게 그렇게 하게 했다는 사역 의미를 표현하지 않습니다.
  - severity: medium
    issue: 각주 a가 무관한 이전 번역을 ‘또는’으로 제시함
    rationale: 각주의 내용은 현 게에즈어 본문의 이문이 아니라 다른 구절에 해당하는 이전의 잘못된 배정입니다. 본문의 불완전한 첫 구문을 설명하는 주석으로 교체해야 합니다.
  revised_text: 또 사람마다 자기 이웃을 [해쳤습니다]. [a] 모두가 불의를 행하고 많은 피를 흘리려고 자신을 팔았습니다.
  revised_footnotes:
  - marker: a
    text: 제시된 게에즈어 본문은 ‘사람은 그의 이웃을’이라고만 되어 있어 동사가 결여된 불완전한 구문입니다. 문맥상 최소한으로 ‘해쳤습니다’를 보충하였으나, 정확한 행위는 본문만으로 확정할 수 없습니다.
    reason: 원문에 없는 ‘속였습니다’라는 특정 보충을 제거하고, 본문의 결락 또는 불완전성을 독자에게 투명하게 알립니다.
  revision_rationale: 첫 절은 원문에 없는 특정 동사를 단정하지 않도록 대괄호 보충과 주석을 사용했습니다. 후반절은 ‘스스로를 팔아 … 하다’의 목적 관계를 자연스럽게 살리고, 능동적 유혈 행위를 그대로 옮겼습니다. 기존의 무관한 이전 번역 각주는 삭제하고 본문상 실제 문제를 설명하는 각주로 대체했습니다.
