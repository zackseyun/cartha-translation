  text: and a man his neighbor. And everyone sold himself to do iniquity and to shed much blood.
  footnotes:
  - marker: a
    text: 'Or ''And Ham knew that his father had cursed his youngest son, and he separated from his father, he and his sons with him: Cush and Mizraim and Put and Canaan.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 사람은 자기 이웃을 [속였습니다]. 그리고 모든 사람이 스스로를 팔아 악을 행하고 많은 피를 흘리게 하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰብእሂ፡ ቢጾ።
  english_pob_choice: and a man his neighbor.
  chosen_korean: 그리고 사람은 자기 이웃을
  alternatives_korean:
  - 그리고 한 사람은 그의 이웃을
  - 그리고 사람이 자기 이웃을
  lexicon: source_phrase
  rationale: 게에즈 구절의 첫 절은 사람과 이웃의 관계를 병렬적으로 제시하므로, 한국어도 간결하게 유지하되 관계어인 ‘자기 이웃’을 살려 원문의 대상을 보존했습니다.
- source_word: ተሰይጠ፡
  english_pob_choice: sold himself
  chosen_korean: 스스로를 팔아
  alternatives_korean:
  - 자기를 팔아
  - 몸을 팔아
  lexicon: sell oneself
  rationale: 영어 POB의 ‘sold himself’를 따라 자기 자신을 상품처럼 내어주는 의미를 직접적으로 옮겼습니다.
- source_word: ዐመፃ፡
  english_pob_choice: iniquity
  chosen_korean: 악을
  alternatives_korean:
  - 불의를
  - 죄악을
  lexicon: wickedness
  rationale: ‘iniquity’는 단순한 도덕적 결함보다 악행 전체를 가리키는 말이므로, 자연스럽고 직접적인 ‘악’을 택했습니다.
- source_word: ደመ፡ ብዙኀ፡
  english_pob_choice: much blood
  chosen_korean: 많은 피를 흘리게
  alternatives_korean:
  - 많은 피를
  - 피를 많이
  lexicon: bloodshed
  rationale: 게에즈의 ‘많은 피’는 결과적으로 유혈을 뜻하므로, 한국어에서는 동사구로 풀어 ‘피를 흘리게’ 하여 살육의 뉘앙스를 분명히 했습니다.
theological_decisions:
- issue: 구절의 전반적 윤리 진술 방식
  chosen_reading: 이 구절은 개인들의 적극적 자기-매매와 집단적 폭력성을 함께 말하는 도덕적 붕괴의 진술로 읽었습니다.
  alternative_readings:
  - 단순히 상거래나 사회적 불평등에 대한 묘사로만 읽는 것
  - 문자적으로만 혈연/법적 거래를 가리키는 것으로 제한하는 것
  rationale: 게에즈 원문과 POB 영어 모두 ‘스스로를 팔아’와 ‘많은 피를 흘리다’를 병치하여, 죄의 자기파괴성과 폭력성을 함께 강조합니다.
  doctrine_reference: 인간의 타락과 죄의 적극성
