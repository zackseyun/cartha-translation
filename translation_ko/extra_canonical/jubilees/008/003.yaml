  to: 그의 아버지가 그에게 글쓰기를 가르쳤습니다.[a] 그는 자신을 위하여 성읍을 차지할 곳을 찾으러 갔습니다. 그는 옛사람들이 바위에 새겨 놓은 글을 발견하고 그 안에 적힌 것을 읽었습니다. 그리고 그것을 옮겨 적었습니다.[b] 또 그는 그 안에서 감시자들의 가르침이 들어 있음을 알게 되었는데, 그들은 그것으로 해의 징조를 살피곤 하였습니다.
