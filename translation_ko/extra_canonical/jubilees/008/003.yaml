base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/003.yaml
  text: And his father taught him writing. And he went to seek for himself a place where he might seize a city for himself. And he found a writing which the ancients had cut on a rock, and he read what was in it. And he copied it, and he found from what was in it that there was in it the teaching of the Watchers, by which they used to observe the omens of the sun.
  footnotes:
  - marker: a
    text: Or 'And the boy grew, and his father'.
    reason: previous_rendering
  - marker: b
    text: Or 'And he understood it,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 아버지가 그에게 글쓰기를 가르쳤습니다.[a] 그는 자신을 위하여 성읍을 차지할 곳을 찾으러 갔습니다. 그는 옛사람들이 바위에 새겨 놓은 글을 발견하고 그 안에 적힌 것을 읽었습니다. 그리고 그것을 옮겨 적었습니다.[b] 또 그는 그 안에서 감시자들의 가르침이 들어 있음을 알게 되었는데, 그들은 그것으로 해의 징조를 살피곤 하였습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “소년이 자라서, 그의 아버지가”.
    reason: 영어 POB 감사 이력에 보존된 이전 번역의 이문을 반영합니다. 제시된 게에즈어 본문에는 이 구절이 없으므로 본문에는 넣지 않습니다.
  - marker: b
    text: 또는 “그리고 그는 그것을 이해했습니다.”
    reason: 영어 POB 감사 이력의 대체 번역을 보존합니다. 제시된 게에즈어 동사는 문맥상 ‘옮겨 적었다/베껴 썼다’로 번역하는 것이 적절합니다.
lexical_decisions:
- source_word: መሀሮ፡ አቡሁ፡ መጽሐፈ፡
  english_pob_choice: his father taught him writing
  chosen_korean: 그의 아버지가 그에게 글쓰기를 가르쳤습니다
  alternatives_korean:
  - 그의 아버지가 그에게 글을 가르쳤습니다
  - 아버지가 그에게 글쓰기를 익히게 했습니다
  lexicon: መጽሐፍ / መጽሐፈ
  rationale: 지시된 내용은 일반적인 '글'보다 기술로서의 '글쓰기'가 더 직접적이어서, 교육 행위를 분명하게 드러내는 표현을 택했습니다.
- source_word: ይኅሥሥ፡ ሎቱ፡ መካነ፡ ኀበ፡ ይእኅዝ፡ ሎቱ፡ ሀገረ።
  english_pob_choice: he went to seek for himself a place where he might seize a city for himself
  chosen_korean: 그는 자기에게 성읍을 차지할 곳을 찾으러 갔습니다
  alternatives_korean:
  - 그는 자기의 도시를 차지할 장소를 찾으러 갔습니다
  - 그는 자신이 성읍을 점령할 곳을 찾으러 갔습니다
  lexicon: መካነ / ሀገረ
  rationale: 장황한 목적구조를 한국어에서 자연스럽게 압축하되, '성읍을 차지하다'라는 폭력적·정복적 의미는 유지했습니다.
- source_word: ወአዕለዎ፡
  english_pob_choice: And he copied it
  chosen_korean: 그리고 그것을 베껴 썼습니다
  alternatives_korean:
  - 그리고 그것을 복사했습니다
  - 그리고 그것을 옮겨 적었습니다
  lexicon: copy / transcribe
  rationale: 문맥상 단순 이해가 아니라 서판/문자의 내용을 옮겨 적는 행위이므로, '베껴 쓰다'로 구체화했습니다.
- source_word: ትምህርተ፡ ትጉሃን፡
  english_pob_choice: the teaching of the Watchers
  chosen_korean: 감시자들의 가르침
  alternatives_korean:
  - 감시자들의 교훈
  - 감시자들의 교육
  lexicon: Watchers
  rationale: POB의 'Watchers'를 직역해 '감시자들'로 두고, 그들이 남긴 내용은 '가르침'으로 옮겼습니다.
- source_word: ሰገለ፡ *ፀሓይ፡
  english_pob_choice: observe the omens of the sun
  chosen_korean: 해의 징조를 살폈습니다
  alternatives_korean:
  - 해의 징조를 관찰했습니다
  - 태양의 징조를 살폈습니다
  lexicon: omens / sun
  rationale: '''징조''는 점성적·표징적 의미를 살리고, ''살폈습니다''는 그 해석 행위를 자연스럽게 전달합니다.'
theological_decisions:
- issue: Watchers의 번역어
  chosen_reading: 감시자들
  alternative_readings:
  - 파수자들
  - 천사들
  rationale: 본문 자체가 특정 존재 집단의 명칭을 설명 없이 사용하므로, POB의 서술적 대응을 따라 '감시자들'로 두어 독자가 본문의 용례를 바로 보게 했습니다.
  doctrine_reference: 에녹 전승/희년서의 고유 용례
- issue: 성읍을 차지하다라는 정복적 표현
  chosen_reading: 성읍을 차지할 곳을 찾으러 갔습니다
  alternative_readings:
  - 성읍을 빼앗을 곳을 찾으러 갔습니다
  - 성읍을 점령할 곳을 찾으러 갔습니다
  rationale: 히브리적 서사에서의 정복 의도를 너무 순화하지 않되, 한국어에서 과도하게 군사적 뉘앙스로만 읽히지 않도록 '차지하다'를 선택했습니다.
  doctrine_reference: 서사적 의미 보존
