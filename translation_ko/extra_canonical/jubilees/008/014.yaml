translation:
  language: ko
  text: 북쪽을 향한 모든 것은 야벳의 것이요, 남쪽을 향한 모든 것은 셈의 것이니라. 그리고 카라소에 가까워질 때까지 계속된다. 이것은 남쪽을 바라보는 혀의 품에 있다.
  philosophy: optimal-equivalence
