  - severity: high
    issue: 출산 주체를 ‘그가’로 번역함
    rationale: 원문 및 영어 POB는 여성이 아들을 낳았음을 나타냅니다. 한국어 ‘그가’는 남성 주체로 해석되므로 ‘그녀는’으로 고쳐야 합니다.
  revised_text: 그녀는 이 주간의 셋째 해에 그에게 아들을 낳아 주었고, 그는 그의 이름을 카이남이라 불렀습니다. 그리고 그 아이는 자랐습니다.[a]
