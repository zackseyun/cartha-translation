translation:
  language: ko
  text: 그녀는 이 주간의 셋째 해에 그에게 아들을 낳아 주었고, 그는 그의 이름을 카이남이라 불렀습니다. 그리고 그 아이는 자랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그녀는 이 주간의 셋째 해에 그에게 아들을 낳아 주었고, 그는 그의 이름을 카이남이라 불렀습니다.”
    reason: 이전 번역은 원문에 이어지는 ‘그리고 그 아이는 자랐습니다’를 포함하지 않았습니다.
lexical_decisions:
- source_word: ወልደ፡ / ወልህቀ፡ ወልድ፡
  english_pob_choice: And she bore him a son ... And the child grew,
  chosen_korean: “아들을 낳았고” / “그 아이는 자랐습니다”
  alternatives_korean:
  - “아들을 낳았습니다” / “그 아들은 자랐습니다”
  - “아들을 낳아 주었고” / “그 아들은 성장했습니다”
  lexicon: Geez ወለደ/ወልደ (to bear/give birth); ወልሀቀ/ወልህቀ (to grow)
  rationale: 첫 절은 출산 행위를 분명히 하고, 끝의 ወልህቀ፡ ወልድ፡은 단순한 생존이 아니라 성장의 진행을 가리키므로 ‘자랐습니다’로 직접 옮겼습니다.
- source_word: በዓመተ፡ ሣልስ፡ በሱባዔ፡ ዝንቱ፡
  english_pob_choice: in the third year of this week
  chosen_korean: “이 여섯째 주의 셋째 해”
  alternatives_korean:
  - “이 주의 셋째 해”
  - “이 주간의 셋째 해”
  lexicon: Ge'ez 시간표현 ሱባዔ (week/septenary period)
  rationale: Jubilees의 주간 단위 연대 표현을 그대로 살려 ‘주’로 옮기되, 문맥상 앞선 주를 가리키는 지시어를 포함해 자연스럽게 표현했습니다.
- source_word: ስሞ፡ ቃይናም፡
  english_pob_choice: he called his name Kainam
  chosen_korean: “그 이름을 카이남이라 불렀습니다”
  alternatives_korean:
  - “그의 이름을 카이남이라 지었습니다”
  - “카이남이라 이름 지었습니다”
  lexicon: Ge'ez 이름 부여 관용구
  rationale: 원문의 ‘이름을 …라 부르다’ 관용을 살려, 행위 주체와 이름 지정 사실을 모두 드러내는 표현으로 옮겼습니다.
theological_decisions:
