translation:
  language: ko
  text: 삼 년 동안에는 먹을 수 있는 어떤 것의 열매도 거두어서는 안 됩니다. 넷째 해에는 그 열매가 거룩하며, 처음 익은 열매는 하늘과 땅과 만물을 창조하신 지극히 높으신 주님 앞에 바쳐져 받아들여질 것입니다.
  philosophy: optimal-equivalence
