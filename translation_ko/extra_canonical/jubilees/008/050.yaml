revisions:
- from: 삼년 동안은 먹은 것의 열매를 거두지 못하리라. 넷째 해에는 그 열매가 거룩하니 처음 익은 열매는 천지와 만물을 창조하신 지극히 높으신 주님 앞에 받으실 만한 것이니라
  to: 삼 년 동안에는 먹을 수 있는 어떤 것의 열매도 거두어서는 안 됩니다. 넷째 해에는 그 열매가 거룩하며, 처음 익은 열매는 하늘과 땅과 만물을 창조하신 지극히 높으신 주님 앞에 바쳐져 받아들여질 것입니다.
  rationale: 영어 감사 기록의 명료화와 게에즈어의 범주 표현을 따라, 금지 대상이 ‘먹은 것’이 아니라 ‘먹을 수 있는 것의 열매’임을 분명히 했습니다. 넷째 해 열매의 거룩함과 첫 열매의 수납 가능성을 유지하되, 한국어 합쇼체 문장으로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:18Z'
review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘먹은 것의 열매’는 게에즈어와 영어 감사 기록이 가리키는 ‘먹을 수 있는 모든 것/어떤 것의 열매’를 잘못 옮긴 표현입니다. 넷째 해의 열매가 거룩하며 지극히 높으신 주님 앞에 받아들여질 첫 열매라는 구조는 유지해야 합니다.
  naturalness: ‘먹은 것의 열매’는 현대 한국어에서 의미가 불명확하고 어색합니다. ‘먹을 수 있는 어떤 것의 열매’로 고치고, 문장을 현대적인 합쇼체로 정리했습니다.
  terminology: ‘처음 익은 열매’는 ‘firstfruits’를 자연스럽게 나타내며, ‘지극히 높으신 주님’과 창조 표현은 원문의 경칭과 내용을 보존합니다.
