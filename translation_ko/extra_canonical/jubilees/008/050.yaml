  text: For three years the fruit of anything that is eaten shall not be gathered; but in the fourth year its fruit shall be holy, the firstfruits acceptable before the Most High LORD, who created heaven and earth and everything.
  footnotes:
  - marker: a
    text: Or 'its fruit shall not be gathered from anything that is eaten'.
