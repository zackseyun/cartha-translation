translation:
  language: ko
  text: 라파. 그리고 북쪽으로 내려가 티나 강의 둑에 이릅니다. 이 몫은 제비로 정해졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ራፋ
  english_pob_choice: Rafa.
  chosen_korean: 라파.
  alternatives_korean:
  - 라파
  - 라파.
  lexicon: 고유명사
  rationale: 본문 첫머리의 지명/호칭을 음역하여 보존했습니다. 영어 POB도 이를 생략하지 않고 남겨 두었으므로, 한국어도 그대로 옮기는 것이 원문 흐름에 맞습니다.
- source_word: ወይወርድ
  english_pob_choice: And it goes down
  chosen_korean: 그리고 그것은 북쪽으로 내려가서
  alternatives_korean:
  - 그리고 내려가서
  - 그리고 그것은 내려가서
  lexicon: 동사구
  rationale: Ge'ez의 하강 동작을 살리되, 개정판 논의에 따라 방향어는 뒤 문구가 아니라 앞 문맥에 붙여 자연스럽게 처리했습니다.
- source_word: መንገበ፡ ጽንፉ
  english_pob_choice: toward the bank
  chosen_korean: 티나 강의 둑으로
  alternatives_korean:
  - 티나 강둑으로
  - 티나 강의 언덕으로
  lexicon: 지형 어휘
  rationale: 영어 POB의 bank를 강둑으로 옮겨 수계 경계의 의미를 유지했습니다. '둑'보다 '강의 둑'이 문맥상 더 분명합니다.
- source_word: ለመጻእ፡ ጢና፡ ፈለገ።
  english_pob_choice: toward Tina River
  chosen_korean: 티나 강의
  alternatives_korean:
  - 티나 강으로
  - 티나 강을 향해
  lexicon: 고유명사/방향 표현
  rationale: Tina River를 고유명사로 음역하면서, 경계선의 종착지를 나타내는 방향 표현을 한국어 조사로 자연스럽게 살렸습니다.
- source_word: ዛቲ፡ መክፈልት፡ ወፅአት፡ በዕፁ፡
  english_pob_choice: This portion came out by lot.
  chosen_korean: 이 몫은 제비뽑기로 나왔습니다.
  alternatives_korean:
  - 이 몫은 제비로 나왔습니다.
  - 이 몫은 제비뽑기로 정해졌습니다.
  lexicon: 분배 표현
  rationale: መክፈልት은 분깃/몫의 뜻이므로 '몫'으로 옮겼고, 출현 방식을 분명히 하기 위해 '제비뽑기'를 사용했습니다.
theological_decisions:
- issue: 분배의 방식 표현
  chosen_reading: 제비뽑기로 나왔습니다
  alternative_readings:
  - 제비로 나왔습니다
  - 제비뽑기로 정해졌습니다
  rationale: 본문은 단순한 결과가 아니라 분배 절차의 결과임을 말하므로, 행위성과 우연성을 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 분배/기업의 형성은 본문 서술의 핵심이며, 이 구절 자체는 신학적 해석보다 서사적 사실 진술에 가깝습니다.
