  source_fidelity: ‘라파’는 원문 첫머리의 고유명사를 보존했고, 경계의 이동, 북쪽 방향, 티나 강의 둑, 제비에 의한 분배라는 핵심 내용도 반영했습니다. 다만 ‘그것은 … 갑니다’는 경계 기술 문맥에서 지시 대상이 불필요하게 모호하며, ‘북쪽으로 내려가서 … 갑니다’는 원문의 간결한 경계 서술을 다소 부자연스럽게 늘입니다.
  naturalness: ‘그리고 그것은’은 한국어 경계 서술에서 어색한 대명사 반복입니다. 주어를 생략하고 ‘내려가 … 이릅니다’로 옮기면 현대 표준어 합쇼체로 자연스럽고 원문의 진행을 더 정확히 드러냅니다. ‘제비뽑기로 나왔습니다’도 이해되지만, 분배 결과에는 ‘제비로 정해졌습니다’가 더 자연스럽습니다.
  terminology: 라파와 티나는 음역으로 유지합니다. ‘몫’은 분배된 부분을 적절히 나타내며, ‘제비’는 제비뽑기에 의한 배정을 간결하게 표현합니다.
