  source_fidelity: 내용상 영어 감사본 및 게에즈어 본문의 핵심 순서와 의미(노아가 아들들을 부르고, 그들과 자녀들이 가까이 오며, 세 아들이 차지할 몫으로 땅을 나누고, 노아의 품에서 기록을 꺼냄)를 대체로 반영합니다. 그러나 마지막 동사 '받았습니다'는 원문의 '취하였다'보다 다소 수동적이며, 문체가 앞부분과 불일치합니다.
  naturalness: 초안은 앞부분에서 종결이 없는 고전적 연결체(‘부르매… 나아왔더라’)를 사용하다가 마지막을 합쇼체 과거형(‘받았습니다’)으로 끝내어, 요구된 현대 표준어 합쇼체와 일관되지 않습니다. '제비대로'도 한국어에서 다소 부자연스럽습니다.
