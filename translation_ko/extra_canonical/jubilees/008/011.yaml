  text: 그가 그의 아들들을 부르매 그들과 그들의 자녀들이 그에게 가까이 나아왔더라 그가 땅을 그의 세 아들이 소유할 제비대로 나누었더라 그리고 그들은 손을 뻗어 그들의 아버지 노아의 품에서 그 글을 받았습니다.
