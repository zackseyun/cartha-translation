revisions:
- from: 그가 그의 아들들을 부르매 그들과 그들의 자녀들이 그에게 가까이 나아왔더라 그가 땅을 그의 세 아들이 소유할 제비대로 나누었더라 그리고 그들은 손을 뻗어 그들의 아버지 노아의 품에서 그 글을 받았습니다.
  to: 그가 아들들을 부르니, 그들과 그들의 자녀들이 그에게 가까이 왔습니다. 그가 땅을 그의 세 아들이 차지할 제비뽑기로 정해진 몫에 따라 나누었습니다. 그들은 손을 뻗어 그들의 아버지 노아의 품에서 그 기록을 가져갔습니다.
  rationale: 현대 표준어 합쇼체로 종결을 통일하고, 분배의 제비라는 의미를 자연스럽게 명시했습니다. 또한 마지막 동사를 원문의 능동적 ‘took’에 맞추어 수정했으며, ‘품’과 ‘기록’은 본문의 구체성을 보존합니다.
