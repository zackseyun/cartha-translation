base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/006.yaml
  text: For he said, “I was indeed sent,” and in the fourth year Shelah was born and grew up; and he took for himself a wife, and her name was Melka, the daughter of Kebed, his father’s brother, in the first year of the fifth week of the thirty-first jubilee.
  footnotes:
  - marker: a
    text: Or 'Shelah was born; and Shelah took for himself a wife, and her name was Melka, the daughter of Kebed, his father’s brother, in the first year of the third week of the fifth jubilee.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말하기를 「나는 참으로 보냄을 받았습니다」 하였으며, 넷째 해에 셀라가 태어나 자랐습니다. 그리고 그는 아내를 맞이하였는데, 그의 이름은 멜카였으며, 그녀는 그의 아버지의 형제인 케베드의 딸이었습니다. 그것은 서른한째 희년의 다섯째 주 첫해였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቤ / “I was indeed sent”
  english_pob_choice: I was indeed sent
  chosen_korean: 「나는 참으로 보냄을 받았습니다」
  alternatives_korean:
  - 「나는 정말로 보내심을 받았습니다」
  - 「나는 분명히 보냄을 받았습니다」
  lexicon: 보내다 / 보내심을 받다
  rationale: 원문은 완료된 수동 진술로 자신의 ‘파송됨’을 강조하므로, 능동적인 ‘보냈습니다’보다 수동 표현 ‘보냄을 받았습니다’가 더 정확합니다.
- source_word: ወልህቀ፡ / grew up
  english_pob_choice: grew up
  chosen_korean: 자랐습니다
  alternatives_korean:
  - 성장했습니다
  - 커졌습니다
  lexicon: 자라다
  rationale: 아동의 성장에 대한 평이한 서술이므로, 자연스럽고 과장되지 않은 ‘자랐습니다’가 적절합니다.
- source_word: ሎቱ፡ ብእሲተ፡ / took for himself a wife
  english_pob_choice: he took for himself a wife
  chosen_korean: 그는 아내를 맞이하였는데
  alternatives_korean:
  - 그는 아내를 얻었는데
  - 그는 자기에게 아내를 취하였는데
