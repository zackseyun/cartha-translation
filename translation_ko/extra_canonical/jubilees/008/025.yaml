base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/025.yaml
  text: The thoughts and desire of man imagine vanity and evil continually, and the Lord destroyed everything from the face of the earth because of their evil deeds and because of blood.
  footnotes:
  - marker: a
    text: Or 'were evil continually'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람의 생각과 욕구는 늘 헛된 것과 악한 것을 상상하였고, 주께서는 그들의 악한 행위와 피 때문에 땅 위에서 모든 것을 멸하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕሊናሁ፡ ወፈቃዱ፡ ለሰብእ፡
  english_pob_choice: The thoughts and desire of man
  chosen_korean: 사람의 생각과 욕구
  alternatives_korean:
  - 사람의 마음과 욕망
  - 사람의 생각과 바람
  lexicon: ሕሊና / ፈቃድ
  rationale: ሕሊና는 단순한 ‘생각’보다 내면의 생각 작용을, ፈቃዱ는 ‘의지/욕구’에 가까워 ‘욕구’로 옮겨 두 항목의 병행을 살렸습니다.
- source_word: ይኄሊ፡" ከንተ፡ ወእኩየ፡" በኵሉ፡ መዋዕል።
  english_pob_choice: imagine vanity and evil continually
  chosen_korean: 늘 헛된 것과 악한 것을 상상하며
  alternatives_korean:
  - 늘 허무와 악을 생각하며
  - 항상 헛됨과 악을 꾀하며
  lexicon: ከንተ / ይኄሊ / እኩይ
  rationale: English POB가 놓친 ‘vanity’와 ‘imagine/think’의 뉘앙스를 살려, ‘상상하다’와 ‘헛된 것’으로 옮겨 내적 작용과 내용 둘 다 드러냈습니다.
- source_word: ወደምሰሰ፡" እግዚአብሔር፡ ኵሎ፡" እምነ፡" ገጸ፡ ምድር፡
  english_pob_choice: and the Lord destroyed everything from the face of the earth
  chosen_korean: 주께서는 땅의 얼굴에서 모든 것을 멸하셨습니다
  alternatives_korean:
  - 주께서는 땅 위에서 모든 것을 멸하셨습니다
  - 주께서는 지면에서 모든 것을 쓸어버리셨습니다
  lexicon: እግዚአብሔር / ገጸ ምድር
  rationale: ‘땅의 얼굴’은 히브리식 관용구를 직접 반영한 표현이므로, 평이하게 풀기보다 원문 구조를 보존했습니다.
- source_word: በእንተ፡ እኩይ፡" ምግባሮሙ፡ ወበእንተ፡ ደም፡
  english_pob_choice: because of their evil deeds and because of blood
  chosen_korean: 그들의 악한 행위와 피 때문에
  alternatives_korean:
  - 그들의 악행과 피 흘림 때문에
  - 그들의 악한 행동과 유혈 때문에
  lexicon: ምግባር / ደም
  rationale: ‘악한 행위’는 행위의 도덕적 성격을 직접 드러내며, ‘피’는 본문이 축약해 말하는 폭력/살육의 징후를 남겨 두었습니다.
theological_decisions:
- issue: 인간 내면의 상태를 ‘evil continually’와 함께 어떻게 옮길 것인가
  chosen_reading: ‘늘 헛된 것과 악한 것을 상상하며’로 옮겨, 단순한 성향 진술이 아니라 지속적 내적 상상/기획의 문제로 드러냈습니다.
  alternative_readings:
  - ‘늘 악하다’
  - ‘늘 악한 생각을 품는다’
  rationale: 게에즈 본문과 영어 POB의 audit trail은 단순한 도덕 판정보다 인간 내면의 지속적 상상 작용을 강조하므로, 그 긴장을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 창 6:5와 평행하는 인간 내면의 부패에 대한 성경적 증언
