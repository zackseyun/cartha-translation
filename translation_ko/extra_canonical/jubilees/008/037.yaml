  source_fidelity: 첫 구절의 ምሥዋዕ는 ‘제단’으로 정확히 옮겼고, 다섯째 해의 2인칭 복수 명령도 합쇼체 명령형으로 적절히 반영했습니다. 다만 ዘይትወከፍ의 완료·상태적 수동 의미에는 ‘받아들여진’이 더 자연스럽고 충실합니다. ‘그것’은 원문의 목적어가 명시되지 않은 상태를 보존합니다.
  naturalness: ‘받아들여지는 제단’은 진행 중인 수용처럼 들릴 수 있어, 상태를 나타내는 ‘받아들여진 제단’이 현대 한국어에서 더 자연스럽습니다. ‘해제를 행하여 그것을 놓아주십시오’는 원문의 반복과 명령성을 유지하면서 ‘풀어 주십시오’보다 대상이 불명확한 상황에서도 덜 물리적으로 들립니다.
  terminology: ‘제단’은 해당 게에즈어에 맞으며 ‘제물/제사’로 바꾸지 않아야 합니다. ኅድገተ의 의미는 특정 교리적 제도로 과도하게 한정하지 않고 ‘해제’로 유지합니다.
