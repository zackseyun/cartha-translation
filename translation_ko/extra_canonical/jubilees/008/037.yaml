translation:
  language: ko
  text: 받아들여지는 제단 앞에서. 그리고 다섯째 해에는 해제를 시행하여 그것을 풀어 주십시오.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ
  english_pob_choice: Before
  chosen_korean: 앞에서
  alternatives_korean:
  - 앞에
  - 전에
  lexicon: Ge'ez ቅድመ
  rationale: 문맥상 장소/기준점을 나타내는 ‘before’로 읽히므로, 한국어에서는 자연스러운 위치 표현인 ‘앞에서’로 옮겼습니다.
- source_word: ምሥዋዕ
  english_pob_choice: altar
  chosen_korean: 제단
  alternatives_korean:
  - 단
  - 제사 제단
  lexicon: Ge'ez ምሥዋዕ
  rationale: 검토 기록에 따라 이 어휘는 ‘offering’이 아니라 ‘altar’이므로, 표준적이고 직역에 가까운 ‘제단’을 택했습니다.
- source_word: ዘይትወከፍ
  english_pob_choice: that is accepted
  chosen_korean: 받아들여지는
  alternatives_korean:
  - 받아들여진
  - 인정받는
  lexicon: Ge'ez participial clause
  rationale: 수동적/상태적 의미를 살려 제단의 성격을 나타내는 관형사형 ‘받아들여지는’으로 처리했습니다.
- source_word: ኅድገተ / ታሕድግዎ
  english_pob_choice: make a release, so that you may release it
  chosen_korean: 해제를 시행하여 그것을 풀어 주십시오
  alternatives_korean:
  - 면제를 실시하여 그것을 놓아 주십시오
  - 해방을 베풀어 그것을 놓아 주십시오
  lexicon: Ge'ez release verb
  rationale: 문맥상 단순 방치가 아니라 규정된 ‘release’의 시행이므로 ‘해제’를 택했고, 뒤의 동사는 동일 어근의 반복을 살려 ‘풀어 주십시오’로 옮겼습니다.
theological_decisions:
- issue: 명령형의 대상과 어조
  chosen_reading: 다섯째 해에 공동체에 대한 직접 명령으로 읽고, 한국어에서는 공손한 명령형 ‘-십시오’를 사용했습니다.
  alternative_readings:
  - 서술형으로 완화하여 ‘해제를 하게 됩니다’
  - 반말 명령형으로 직접 재현
  rationale: 원문은 규범적 지시문이므로 명령/지시의 힘을 유지해야 하며, 합쇼체 번역 관례에 따라 공손한 명령형으로 재현했습니다.
  doctrine_reference: 서술·법규 문체의 직접성 보존
