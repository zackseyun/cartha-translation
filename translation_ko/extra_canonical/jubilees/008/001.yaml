base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/001.yaml
  text: In the twenty-ninth jubilee, in the first week, in its first year, Arpachshad took a wife for himself, and her name was Rasu'eja, the daughter of Susan, the daughter of Elam, and she bore him
  footnotes:
  - marker: a
    text: Or 'forty-ninth'.
    reason: previous_rendering
  - marker: b
    text: Or 'and she bore to him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 스물아홉째 희년, 첫째 주, 첫해에 아르박삿이 자기에게 아내를 맞이하였는데, 그녀의 이름은 라수에야였으며, 수산의 딸, 엘람의 딸이었고, 그녀가 그에게 낳았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፬ሥራ / በሱባዔ ቀዳሚ
  english_pob_choice: In the twenty-ninth jubilee, in the first week, in its first year
  chosen_korean: 스물아홉째 희년, 첫째 주, 첫해
  alternatives_korean:
  - 마흔아홉째 희년
  - 첫 번째 주간
  - 그 해의 첫 해
  lexicon: 희년 / 주 / 해
  rationale: 영문 POB의 정정된 'twenty-ninth'를 따르고, 시간 표현은 원문의 축자적 연속을 살려 간결한 합쇼체로 옮겼습니다.
- source_word: ነሥአ ሎቱ ብእሲተ
  english_pob_choice: Arpachshad took a wife for himself
  chosen_korean: 아르박삿이 자기에게 아내를 맞이하였는데
  alternatives_korean:
  - 아르박삿이 아내를 맞이하였는데
  - 아르박삿이 자신을 위하여 아내를 취하였는데
  lexicon: 아내를 맞이하다 / 취하다
  rationale: 원문의 '취하다'를 직역하기보다, 결혼 맥락에서 자연스럽고 지나치게 현대적이지 않은 '아내를 맞이하다'로 옮겨 원문의 혼인 행위를 분명히 했습니다.
- source_word: ራሱእያ
  english_pob_choice: Rasu'eja
  chosen_korean: 라수에야
  alternatives_korean:
  - 라수에자
  - 라수에이야
  lexicon: 음역
  rationale: 고유명사는 현대 외래어 표기식으로 일관되게 음역했고, 게에즈 표기상의 모음을 반영해 '라수에야'로 옮겼습니다.
- source_word: ወለተ ሱሳን ወለተ ኤላም
  english_pob_choice: the daughter of Susan, the daughter of Elam
  chosen_korean: 수산의 딸, 엘람의 딸
  alternatives_korean:
  - 수산의 딸이며 엘람의 딸
  - 수산과 엘람의 딸
  lexicon: 딸
  rationale: 원문의 반복된 속격 구조를 그대로 살려, 혈통 정보를 축소하지 않고 병렬로 제시했습니다.
- source_word: ወወለደት ሎቱ
  english_pob_choice: and she bore him
  chosen_korean: 그녀가 그에게 낳았습니다
  alternatives_korean:
  - 그녀가 그에게 아이를 낳았습니다
  - 그녀가 그를 위하여 낳았습니다
  lexicon: 낳다
  rationale: 동사의 완료 의미를 살리되, 다음 절과 분리된 상태에서도 자연스럽게 읽히도록 간결하게 옮겼습니다.
theological_decisions:
- issue: 희년·주간 표기의 연속 시간 구조
  chosen_reading: 시간 표현을 모두 유지해 연대기를 분명히 드러냈습니다.
  alternative_readings:
  - 연대 표기를 하나로 묶어 의역
  - 첫째 주를 생략
  rationale: 『희년—주간—연도』의 삼중 구조는 본문의 연대기 정보이므로 축소하지 않고 보존하는 편이 원문 의미에 충실합니다.
  doctrine_reference: 문맥상 창세 연대기 전달
