  to: 그리고 내 아들들아, 나도 너희에게 명합니다. 에녹이 첫 희년들에 자기 아들에게 명령한 것처럼 말입니다. 그가 아직 살아 있던 제칠 세대에 그는 죽는 날까지 자기 아들과 아들의 아들들에게 명령하고 증언하였습니다.
