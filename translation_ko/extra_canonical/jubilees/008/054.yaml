  text: And I also command you, my sons, as Enoch commanded his son in the first jubilees while he was still alive, in the seventh generation. He commanded and testified to his son and to his sons' sons until the day of his death.
translation:
  language: ko
  text: 그리고 내 아들들아, 나도 너희에게 명한다. 에녹이 그의 아들, 곧 칠 대 동안 살아 있는 첫 번째 희년에 명령한 것과 같다. 그는 죽는 날까지 자기 아들과 손자들에게 명령하고 증언하였다.
