base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/007.yaml
  text: And in the sixth year she bore him a son, and he called his name Peleg, because in his days, when he was born, the sons of Noah began to divide the earth among themselves. For this reason he called his name Peleg.
  footnotes:
  - marker: a
    text: 'The name Peleg (Ge''ez: ፋሌክ, Fālēk) reflects the Hebrew root פלג (plg), meaning ''to divide'' or ''to split'', corresponding to the division of the earth described in this verse.'
    reason: lexical_choice
translation:
  language: ko
  text: 그리고 여섯째 해에 그녀가 그에게 아들을 낳고, 그는 그의 이름을 「벨렉」이라 지었습니다.[a] 그가 태어난 그 시대에 노아의 아들들이 서로 땅을 나누기 시작했기 때문입니다. 그러므로 그는 그의 이름을 「벨렉」이라 지었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘벨렉’(게에즈어: ፋሌክ, Fālēk)은 ‘나누다, 분할하다’를 뜻하는 히브리어 어근 פלג(plg)과 관련된 이름으로, 이 구절에서 말하는 땅의 분할과 연결됩니다.'
    reason: 인명의 어원적 말놀이와 본문의 인과 관계를 설명합니다.
lexical_decisions:
- source_word: ፋሌክ
  english_pob_choice: Peleg
  chosen_korean: 팔렉
  alternatives_korean:
  - 펠레그
  - 페렉
  lexicon: Leslau
  rationale: 게에즈 음가를 따라 음역하되, 본문 안에서 이름의 어원적 뜻을 주석으로 설명하기보다 한국어 음역만 본문에 두어 인물명으로서의 기능을 유지했습니다.
- source_word: ወለደት
  english_pob_choice: bore him a son
  chosen_korean: 그가 아들을 낳았고
  alternatives_korean:
  - 아들을 낳았습니다
  - 아들을 출산했고
  lexicon: Leslau
  rationale: 출산 행위를 직역하되 한국어 서사체에 맞게 자연스럽고 간결하게 옮겼습니다.
- source_word: ይትካፈሉ ምድረ በበይናቲሆሙ
  english_pob_choice: began to divide the earth among themselves
  chosen_korean: 서로 땅을 나누기 시작했기 때문입니다
  alternatives_korean:
  - 땅을 서로 분할하기 시작했기 때문입니다
  - 서로 그 땅을 나누기 시작했기 때문입니다
  lexicon: Leslau
  rationale: 핵심 의미는 ‘나누다/분할하다’이므로 한국어에서 가장 직접적인 동사 ‘나누다’를 사용했고, ‘서로’로 상호 분배의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 이름 'Peleg'의 어원적 중의성
  chosen_reading: 본문에는 이름의 음역만 두고, 의미 연결은 본문 자체의 서술로 드러나게 했습니다.
  alternative_readings:
  - 이름 뜻을 본문에 직접 덧붙여 ‘분할’로 옮김
  - 주석 없이 한국어 뜻 이름으로 처리
  rationale: 이 구절의 핵심은 이름 붙임의 이유를 서술로 설명하는 데 있으며, 본문 안에 의미풀이를 과도하게 삽입하면 서사 흐름을 해칠 수 있습니다.
  doctrine_reference: 서사 문맥 우선 원칙
