  to: 그리고 여섯째 해에 그녀가 그에게 아들을 낳고, 그는 그의 이름을 「벨렉」이라 지었습니다.[a] 그가 태어난 그 시대에 노아의 아들들이 서로 땅을 나누기 시작했기 때문입니다. 그러므로 그는 그의 이름을 「벨렉」이라 지었습니다.
