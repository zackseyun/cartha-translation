  lexicon: Leslau
  rationale: 출산 행위를 직역하되 한국어 서사체에 맞게 자연스럽고 간결하게 옮겼습니다.
- source_word: ይትካፈሉ ምድረ በበይናቲሆሙ
  english_pob_choice: began to divide the earth among themselves
  chosen_korean: 서로 땅을 나누기 시작했기 때문입니다
  alternatives_korean:
  - 땅을 서로 분할하기 시작했기 때문입니다
  - 서로 그 땅을 나누기 시작했기 때문입니다
  lexicon: Leslau
  rationale: 핵심 의미는 ‘나누다/분할하다’이므로 한국어에서 가장 직접적인 동사 ‘나누다’를 사용했고, ‘서로’로 상호 분배의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 이름 'Peleg'의 어원적 중의성
  chosen_reading: 본문에는 이름의 음역만 두고, 의미 연결은 본문 자체의 서술로 드러나게 했습니다.
  alternative_readings:
  - 이름 뜻을 본문에 직접 덧붙여 ‘분할’로 옮김
  - 주석 없이 한국어 뜻 이름으로 처리
  rationale: 이 구절의 핵심은 이름 붙임의 이유를 서술로 설명하는 데 있으며, 본문 안에 의미풀이를 과도하게 삽입하면 서사 흐름을 해칠 수 있습니다.
  doctrine_reference: 서사 문맥 우선 원칙
