revisions:
- from: 이것들은 노아의 아들들입니다. 그리고 이십팔 희년과 일곱째 주간에 노아는 자기 아들들의 자녀들에게 규례와 계명들을 명하기 시작했고, 그가 알고 있던 모든 의를 그들에게 증언했습니다. 그들이 의를 행하고, 자기 육신의 수치를 가리고, 자기 창조주를 찬양하며, 아버지와 어머니를 공경하고, 각각 자기 형제를 사랑하며, 음행에서 자기들의 생명을 지키게 하려는 것이었습니다.[a]
  to: 이들은 노아의 아들들입니다. 이십팔 번째 희년과 일곱째 주간에, 노아가 자기 아들들의 자녀들에게 규례와 계명과 자기가 알고 있는 모든 의를 명하고 있을 때, 그는 자기 아들들에게 그들이 의를 행하고, 자기 몸의 수치를 가리며, 그들을 지으신 분을 찬양하고, 아버지와 어머니를 공경하며, 각각 자기 형제를 사랑하고, 자기 영혼을 음행에서 지키도록 일러 주었습니다.
  rationale: 제시된 게에즈 본문의 접속·종속 구조를 따라 ‘노아가 … 명하고 있을 때’와 ‘그는 … 일러 주었습니다’를 구분했습니다. 영어 감사 이력의 ‘began’은 가능한 본문 교정에 따른 해석이므로 본문 번역에서 확정하지 않았습니다. 윤리적 권면의 병렬 구조와 가족 관계 표현, ‘영혼’, ‘음행’을 유지했으며, 대응 각주가 없는 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:24Z'
review_pass:
  verdict: revise
  source_fidelity: 현 초안은 절의 주요 윤리적 권면과 ‘이십팔 희년과 일곱째 주간’을 충실히 담고 있습니다. 그러나 제시된 게에즈 본문의 እንዘ는 통상 ‘~하고 있을 때/하면서’로 읽히므로, 본문 자체가 논쟁적인 ‘명하기 시작했다’로 단정하기보다 종속절로 옮기는 편이 안전합니다. 또한 ወአስምዐ는 노아가 아들들에게 이 권면을 알리거나 일러 주었다는 주절로 자연스럽게 처리할 수 있습니다.
  naturalness: ‘규례와 계명들을 명하기 시작했고’는 현대 한국어에서 목적어 결합이 다소 어색하며, 뒤의 ‘하려는 것이었습니다’는 원문에 없는 목적 설명을 더합니다. ‘~하도록 일러 주었습니다’로 권면의 내용을 직접 연결하면 합쇼체 문장으로 더 자연스럽고 원문의 통사도 보존됩니다. 사람을 가리키는 첫 지시어는 ‘이것들’보다 ‘이들’이 자연스럽습니다.
  terminology: ‘희년’, ‘주간’, ‘규례’, ‘계명’, ‘의’, ‘음행’은 적절합니다. ኃፍረተ ሥጋሆሙ는 ‘육신의 수치’보다 한국어에서 신체의 가려야 할 부끄러움을 더 분명히 나타내는 ‘몸의 수치’로 옮겼습니다. ‘자기 영혼을 음행에서 지키다’는 원문의 ‘영혼/자신’과 음행을 모두 보존합니다.
  issues:
  - severity: medium
    issue: 동사 እንዘ의 처리
    rationale: 제시된 원문은 ‘시작했다’가 아니라 ‘~하고 있을 때/하면서’로 읽히는 형태입니다. 영어 감사 이력에는 본문 교정 가능성에 근거한 ‘began’ 해석이 있으나, 현전 원문만으로 그 교정을 확정하지 않는 편이 안전합니다.
  - severity: medium
    issue: 원문에 없는 목적 설명의 첨가
    rationale: ‘그들이 … 하게 하려는 것이었습니다’는 노아의 증언을 목적 설명으로 재구성합니다. 원문은 그들이 그렇게 하도록 노아가 아들들에게 알렸다는 구조이므로 직접 권면으로 옮기는 것이 가깝습니다.
  - severity: low
    issue: 고아 상태의 각주 표지 [a]
    rationale: 번역문에는 [a]가 있으나 제공된 한국어 각주 세트에는 이에 대응하는 각주가 없습니다. 본문 번역에 필수인 본문비평 각주가 아니므로 표지를 제거해 구조를 정리합니다.
