base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/020.yaml
  text: These are the sons of Noah. And in the twenty-eighth jubilee and the seventh week, Noah began to command the ordinances and the commandments to the children of his sons, and all that he knew of justice; and he testified to his sons that they should do righteousness and cover the shame of their flesh, and bless their Creator, and honor father and mother, and love each his brother, and guard their souls from fornication,
  footnotes:
  - marker: a
    text: Or "But Noah's sons, in the twenty-eighth jubilee, while Noah was commanding the ordinances and the commandments for the children of his sons, and all that he knew of justice, and was testifying to his sons".
    reason: previous_rendering
  - marker: b
    text: Or 'in the twenty-eighth jubilee,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들은 노아의 아들들입니다. 이십팔 번째 희년과 일곱째 주간에, 노아가 자기 아들들의 자녀들에게 규례와 계명과 자기가 알고 있는 모든 의를 명하고 있을 때, 그는 자기 아들들에게 그들이 의를 행하고, 자기 몸의 수치를 가리며, 그들을 지으신 분을 찬양하고, 아버지와 어머니를 공경하며, 각각 자기 형제를 사랑하고, 자기 영혼을 음행에서 지키도록 일러 주었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሎ፡ ውሉደ፡ ኖኅ፡
  english_pob_choice: These are the sons of Noah.
  chosen_korean: 이것들은 노아의 아들들입니다.
  alternatives_korean:
  - 노아의 아들들은 이러합니다.
  - 이들은 노아의 아들들입니다.
  lexicon: source_note
  rationale: Ge'ez አሎ는 단순한 전환 접속이 아니라 지시 표현 ‘이것들은/이들은’에 가깝기 때문에, 문장을 끊지 않고 첫 진술로 살렸습니다.
- source_word: በ፳፰ ወስብዓቲቱ፡
  english_pob_choice: in the twenty-eighth jubilee and the seventh week
  chosen_korean: 이십팔 희년과 일곱째 주간에
  alternatives_korean:
  - 제이십팔 희년에
  - 이십팔 희년과 일곱째 주에
  lexicon: source_note
  rationale: 원문은 희년과 주간을 함께 말하므로 둘 다 보존했고, 한국어에서는 ‘주간’을 유지해 Jubilees의 기술적 연대 표지를 드러냈습니다.
- source_word: ሥርዐተ፡ ወትእዛዘ፡
  english_pob_choice: the ordinances and the commandments
  chosen_korean: 규례와 계명들
  alternatives_korean:
  - 율례와 계명들
  - 규정과 명령들
  lexicon: source_note
  rationale: 두 개의 병렬 명사로서 율법적 규범을 가리키므로, 지나치게 교회식이거나 추상적인 표현보다 직역성이 높은 ‘규례와 계명들’을 택했습니다.
- source_word: ጽድቀ፡
  english_pob_choice: justice / righteousness
  chosen_korean: 의
  alternatives_korean:
  - 정의
  - 의로움
  lexicon: source_note
  rationale: 영어 POB가 여기서 justice를 달았지만, 전체 맥락상 노아가 가르친 윤리적·언약적 올바름이므로 성서적 핵심어인 ‘의’로 옮겼습니다.
- source_word: ዘፈጠሮሙ፡
  english_pob_choice: their Creator
  chosen_korean: 자기 창조주
  alternatives_korean:
  - 그들을 지으신 이
  - 그들의 창조주
  lexicon: source_note
  rationale: 원문은 소유격 대명사를 가진 ‘그들의 창조주’이지만 한국어에서는 관계를 자연스럽게 보이도록 ‘자기 창조주’로 정리했습니다.
- source_word: ኃፍረተ፡ ሥጋሆሙ፡
  english_pob_choice: the shame of their flesh
  chosen_korean: 자기 육신의 수치
  alternatives_korean:
  - 그들의 육체의 수치
  - 벗은 몸의 부끄러움
  lexicon: source_note
  rationale: ‘육신의 수치’는 문자적으로는 노출과 수치를 함께 가리키므로, 출발점인 ‘flesh’의 물질성을 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: 도덕 명령의 연쇄를 한국어에서 어떻게 드러낼지
  chosen_reading: 노아가 후손들에게 규례와 계명을 명하고, 의를 행하며, 창조주를 찬양하고, 부모를 공경하고, 형제를 사랑하고, 음행을 피하라고 증언한 것으로 연쇄를 풀어 옮겼습니다.
  alternative_readings:
  - 병렬된 목적절을 더 압축해 한 문장으로 처리
  - ‘증언했다’보다 ‘경고했다’로 조정
  rationale: 원문은 단순 정보 나열이 아니라 세대에게 전해지는 규범적 증언이므로, 행위의 연쇄와 윤리적 무게가 보이도록 유지했습니다.
  doctrine_reference: 창세기적 언약 윤리와 지혜문학적 계명 전승
