  source_fidelity: 초안은 피를 드러내지 말라는 명령과 도살 대상의 열거를 대체로 보존합니다. 다만 '모든 날 동안에 있는 모든 피 중에서'는 원문의 반복적 시간 표현과 '피가 나타나다'라는 구문을 한국어에서 부자연스럽고 불명확하게 만듭니다.
  naturalness: '''너희에게 피가 보이지 않게 하라''와 그 앞의 긴 수식어열은 현대 표준 한국어로 매우 어색합니다. 조건절로 정리하고 ''앞에 드러나지 않게''로 옮기면 명령의 의미를 자연스럽게 전달합니다.'
  terminology: 짐승(beast), 가축(cattle), 새(bird)의 구별을 유지했습니다. '땅 위에서 움직이는 모든 것'은 원문의 포괄적 표현을 특정 동물군으로 과도하게 한정하지 않습니다.
  issues:
