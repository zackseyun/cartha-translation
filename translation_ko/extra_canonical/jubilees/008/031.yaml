    rationale: 초안은 ‘자기 아들들에게’라고 하나, 영어 감사 기록은 Noah began to command ‘his sons' sons’라고 하므로 손자들이 명령의 직접 대상임을 반영해야 합니다.
  - severity: medium
    issue: 현대 합쇼체 register 불일치
    rationale: ‘가리우며’, ‘증거하였느니라’는 고어적 문체이므로 지정된 현대 정중체로 수정해야 합니다.
  - severity: low
    issue: 규범 용어의 병렬 약화
    rationale: ‘율례와 계명과 모든 규례’는 ordinances와 judgments의 구별을 흐리므로 ‘율례와 계명과 모든 판결’로 구분했습니다.
  revised_text: 노아는 자기가 아는 율례와 계명과 모든 판결로 자기 아들들의 아들들에게 명하기 시작하였습니다. 또 자기 아들들에게 증언하여, 의를 행하고 자기 육체의 부끄러움을 가리며, 창조주를 찬양하고, 아버지와 어머니를 공경하며, 각 사람이 자기 형제를 사랑하고, 음행과 더러움과 모든 불의에서 자기 영혼을 지키라고 하였습니다.
