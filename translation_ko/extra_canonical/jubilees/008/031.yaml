  source_fidelity: 영어 감사 기록과 대조할 때, ‘his sons' sons’는 ‘자기 아들들’이 아니라 ‘자기 아들들의 아들들’(손자들)로 옮겨야 합니다. 또한 ‘ordinances and commandments and all the judgments’의 세 항목을 보존하는 것이 적절합니다.
  naturalness: 초안의 ‘가리우며’와 ‘증거하였느니라’는 현대 표준어 합쇼체에 맞지 않습니다. 문장을 현대적이면서도 원문의 병렬 구조를 유지하도록 다듬었습니다.
  terminology: ‘율례, 계명, 모든 판결’로 규범·명령·판단의 병렬을 보존했습니다. ‘육체의 부끄러움’은 원문의 관용적 표현을 유지했으며, ‘영혼’도 해석적으로 ‘삶’ 등으로 바꾸지 않았습니다.
  issues:
