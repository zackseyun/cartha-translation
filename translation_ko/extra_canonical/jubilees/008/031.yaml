revisions:
- from: 노아가 자기가 아는 율례와 계명과 모든 규례로 자기 아들들에게 명하기 시작하고, 자기 아들들에게 정의를 행하며 자기 육체의 부끄러움을 가리우며, 창조주를 찬송하고, 아버지와 어머니를 공경하고, 각각 자기 형제를 사랑하며, 음행과 더러움과 모든 불의에서 그들의 영혼을 지키라고 증거하였느니라.
  to: 노아는 자기가 아는 율례와 계명과 모든 판결로 자기 아들들의 아들들에게 명하기 시작하였습니다. 또 자기 아들들에게 증언하여, 의를 행하고 자기 육체의 부끄러움을 가리며, 창조주를 찬양하고, 아버지와 어머니를 공경하며, 각 사람이 자기 형제를 사랑하고, 음행과 더러움과 모든 불의에서 자기 영혼을 지키라고 하였습니다.
  rationale: 직접 명령을 받는 대상(아들들의 아들들)과 증언을 받는 대상(아들들)을 구별하여 원문의 문장 구조를 반영했습니다. 또한 현대 표준어 합쇼체로 바꾸되, 의·창조주·음행·불의 등 핵심 어휘와 병렬 권면의 범위를 보존했습니다.
