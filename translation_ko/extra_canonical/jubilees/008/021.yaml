revisions:
- from: '그리고 주님께서 영원히 계십니다. 그리고 그가 셈과 그의 아들들에게 영원한 세대를 위한 복된 몫과 복이 임한 것을 아셨습니다: 에돔의 온 땅과 홍해의 온 땅과 동방과 인도의 온 땅과 홍해와 그 산들, 바산의 온 땅과 레바논의 온 땅과 갑도르의 섬들, 세닐과 아마나의 모든 산들과 남쪽의 앗수르 산들, 엘람의 온 땅과 앗수르와 바빌론과 수사와 메대, 아라랏의 모든 산들, 그리고 바다 건너편의 모든 지역, 곧 북쪽을 향한 앗수르의 산들 너머입니다.[a][b]'
  to: 또 주님은 영원히 계십니다. 그리고 그가 셈과 그의 아들들에게 영원의 세대들을 위하여 복된 몫과 복이 이르렀음을 아셨습니다. 곧 에돔의 온 땅, 홍해의 온 땅, 동방과 인도의 온 땅, 홍해와 그 산들, 바산의 온 땅, 레바논의 온 땅과 갑돌의 섬들, 스닐과 아마나의 모든 산들, 남쪽의 앗수르 산들, 엘람과 앗수르와 바빌론과 수산과 메대의 온 땅, 아라랏의 모든 산들, 그리고 북쪽으로 앗수르 산들 너머에 있는 바다 건너편의 모든 지역입니다.
  rationale: 절 앞머리의 불완전하게 전승된 ‘그리고 주님은 영원히’는 앞 절을 잇는 선언으로서 자연스러운 한국어 서술문으로 보완하되, 그 밖의 내용을 보태지 않았습니다. ‘복된 몫과 복’의 두 항목을 유지하고, 영토 목록은 원문의 열거 구조를 따라 문장 끝의 서술어에 연결했습니다. 원문에 근거하지 않는 각주 표지는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:18Z'
