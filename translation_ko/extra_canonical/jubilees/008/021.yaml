base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/008/021.yaml
  text: 'and the Lord forever. And he knew that a blessed portion and a blessing had come to Shem and to his sons for the generations of eternity: all the land of Edom, and all the land of the Red Sea, and all the land of the east and India, and on the Red Sea and its mountains, and all the land of Bashan, and all the land of Lebanon and the islands of Caphtor, and all the mountains of Senir and Amana, and the mountains of Asshur in the south, and all the land of Elam, Asshur, and Babylon, and Susa and Media, and all the mountains of Ararat, and all the region beyond the sea, beyond the mountains of Asshur toward the north.'
  footnotes:
  - marker: a
    text: Or 'a blessed and broad portion'.
    reason: previous_rendering
  - marker: b
    text: Or 'And he knew'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 주님은 영원히 계십니다. 그리고 그가 셈과 그의 아들들에게 영원의 세대들을 위하여 복된 몫과 복이 이르렀음을 아셨습니다. 곧 에돔의 온 땅, 홍해의 온 땅, 동방과 인도의 온 땅, 홍해와 그 산들, 바산의 온 땅, 레바논의 온 땅과 갑돌의 섬들, 스닐과 아마나의 모든 산들, 남쪽의 앗수르 산들, 엘람과 앗수르와 바빌론과 수산과 메대의 온 땅, 아라랏의 모든 산들, 그리고 북쪽으로 앗수르 산들 너머에 있는 바다 건너편의 모든 지역입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእግዚአብሔር ... ለዓለም
  english_pob_choice: and the Lord forever
  chosen_korean: 그리고 주님께서 영원히 계십니다
  alternatives_korean:
  - 그리고 주님은 영원하십니다
  - 그리고 주님은 영원히 계십니다
  lexicon: 주님 / 영원히
  rationale: 문맥상 절의 첫머리는 앞 절의 결론처럼 이어지므로, 단순한 명사구보다 완결된 서술로 살려 자연스럽게 옮겼습니다.
- source_word: መክፈልተ፡ በረከት፡ ወቡራኬ፡
  english_pob_choice: a blessed portion and a blessing
  chosen_korean: 복된 몫과 복
  alternatives_korean:
  - 복된 몫과 축복
  - 복의 몫과 복
  lexicon: 몫 / 복
  rationale: 게에즈 원문은 'portion of blessing and a blessing'에 해당하므로, '넓은' 의미를 넣지 않고 몫과 복의 병렬을 유지했습니다.
- source_word: ለትውልድ ዘለዓለም
  english_pob_choice: for the generations of eternity
  chosen_korean: 영원한 세대를 위한
  alternatives_korean:
  - 영원의 세대들을 위한
  - 영원한 세대들에 대한
  lexicon: 세대 / 영원
  rationale: 시간 지속의 표현을 한국어에서 자연스럽게 살리되, '세대'와 '영원'의 결합을 통해 원문의 관용적 장구함을 보존했습니다.
- source_word: 지명 열거 전체
  english_pob_choice: Edom ... beyond the mountains of Asshur toward the north
  chosen_korean: 에돔... 앗수르의 산들 너머입니다
  alternatives_korean:
  - 에돔... 북쪽으로 앗수르의 산들 너머입니다
  - 에돔... 북쪽의 앗수르 산맥 너머입니다
  lexicon: 고유명사 / 지리표현
  rationale: 지명들은 본문이 열거하는 범위를 그대로 유지했고, 마지막 방향구는 한국어 어순에 맞춰 '너머'로 정리했습니다.
theological_decisions:
- issue: 본문의 종결부에 들어 있는 '주님께서 영원히 계십니다'의 처리
  chosen_reading: 독립된 선언문으로 옮기고, 뒤의 서술과 연결되는 문장부호를 유지했습니다.
  alternative_readings:
  - 앞 문장과 완전히 합쳐 번역
  - 생략하고 곧바로 지명 목록으로 시작
  rationale: 제공된 게에즈 본문에 실제로 포함된 문구이므로 삭제하지 않고, 앞 절에서 이어지는 축도적 결말처럼 드러내는 것이 source-grounded합니다.
  doctrine_reference: 본문 보존 원칙 / 절 경계 보존
