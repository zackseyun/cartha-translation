  verdict: revise
  source_fidelity: 게에즈어의 ‘복의 몫과 복’이라는 병렬과 셈에게 돌아간 영토 목록은 대체로 보존되었으나, 지명 목록의 수식 범위가 한국어에서 불균형하며, 마지막 ‘바다 건너편…앗수르 산들 너머…북쪽으로’의 관계를 더 분명히 해야 합니다. 또한 본문에 없는 각주 표지 [a][b]가 남아 있습니다.
  naturalness: ‘그가 … 아셨습니다’와 긴 열거는 합쇼체 문장으로 가능하나, ‘엘람의 온 땅과 앗수르와…’는 ‘온 땅’이 엘람에만 걸리는 듯 읽힙니다. 성경 번역 관례에 맞는 지명 표기와 목록 전체를 받는 ‘곧’을 사용하면 더 자연스럽고 정확합니다.
  terminology: 성경 표준 지명 표기에 따라 Caphtor는 ‘갑돌’, Senir는 ‘스닐’, Susa는 ‘수산’으로 통일하는 것이 적절합니다. ‘복된 몫과 복’은 원문의 병렬을 잘 살리므로 유지합니다.
