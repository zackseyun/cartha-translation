  yaml_path: translation/extra_canonical/jubilees/043/005.yaml
  text: of Canaan. How then should we steal any goods? Look, we and our sacks—search them. And with whomever you find the cup in the sack of any one man among us, let him be put to death; and we and our donkeys also will become slaves to our lord.
translation:
  language: ko
  text: 가나안 사람이여. 우리가 어찌 물건을 훔치겠습니까? 보십시오, 우리와 우리의 자루를 수색하십시오. 그리고 우리 가운데 어느 한 사람의 자루에서 그 잔을 찾게 되는 사람은 죽임을 당하게 하십시오. 우리와 우리의 나귀들도 우리 주님의 종이 되겠습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንዋየ
  english_pob_choice: any goods
  chosen_korean: 물건
  alternatives_korean:
  - 재물
  - 소지품
  - goods
  lexicon: 'source lexical sense: property / goods'
  rationale: 출발어는 단순한 ‘무엇이든’이 아니라 소유물·재산의 의미를 가지므로, 한국어에서는 일상적이면서도 범위를 과도하게 좁히지 않는 ‘물건’으로 옮겼습니다.
- source_word: ፍትን
  english_pob_choice: search them
  chosen_korean: 수색하십시오
  alternatives_korean:
  - 찾아보십시오
  - 뒤져보십시오
  - 검사하십시오
  lexicon: 'source lexical sense: examine, search'
  rationale: 도난 여부를 가리기 위해 자루를 실제로 조사하는 맥락이므로, 단순한 ‘찾다’보다 물리적 조사 뉘앙스가 드러나는 ‘수색하다’를 택했습니다.
- source_word: ይትቀተል
  english_pob_choice: let him be put to death
  chosen_korean: 죽임을 당하게 하십시오
  alternatives_korean:
  - 죽게 하십시오
  - 사형에 처하게 하십시오
  lexicon: 'source lexical sense: be killed / put to death'
  rationale: 행위 주체를 명시하지 않는 수동적 처형 표현을 살리기 위해 ‘죽임을 당하게 하십시오’로 옮겼습니다.
- source_word: ወንሕነሂ፡ ወአእዱጊነሂ
  english_pob_choice: and we and our donkeys also
  chosen_korean: 우리와 우리의 나귀들도
  alternatives_korean:
  - 우리와 우리의 당나귀들도
  - 우리와 우리의 짐승들도
  lexicon: 'source lexical sense: donkeys'
  rationale: 문맥상 가축 가운데 구체적으로 나귀가 맞으므로, 한국어 표준어에서 분명한 ‘나귀’를 사용했습니다.
theological_decisions:
- issue: 노예로 될 것을 자발적으로 서약하는 표현
  chosen_reading: ‘우리와 우리의 나귀들도 우리 주님의 종이 되겠습니다’로 옮겨, 헌신적 복속의 맥락을 드러냈습니다.
  alternative_readings:
  - ‘노예가 되겠습니다’
  - ‘종이 되겠습니다’
  rationale: 본문과 영어 POB는 강제 처벌이 아니라 책임을 걸고 복속을 자청하는 서약을 말하므로, 본문 의미를 해치지 않으면서도 현대 한국어에서 자연스러운 ‘종’으로 처리했습니다.
  doctrine_reference: 서약·책임 귀속의 문맥
- issue: 직설적 저주/형벌 서술의 공적 발화 톤
  chosen_reading: 문장 끝을 모두 합쇼체로 유지하되, 서약 부분은 공동체적 책임 선언으로 읽히도록 했습니다.
  alternative_readings:
  - 더 고어적인 종결
  - 비격식적 대화체
  rationale: 지혜문/서사체가 아니라 공개 발화의 진술이므로, 현대 표준어 합쇼체를 유지해 독자가 문맥의 긴장을 분명히 느끼도록 했습니다.
  doctrine_reference: 서사적 발화의 문체
