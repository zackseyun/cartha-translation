  source_fidelity: 원문과 영어 POB의 핵심 의미, 곧 요셉이 모두가 서로 선을 위해 하나 되어 있음을 보고 울었다는 내용은 대체로 충실합니다. 다만 ‘for good’은 단순히 ‘선을 향하는 방향’이라기보다 상호 관계 속의 선한 뜻/목적을 나타내므로, ‘선을 향하고’보다 ‘선한 뜻으로’가 더 직접적입니다.
