  language: ko
  text: 그리고 요셉은 그들 모두가 서로 선한 뜻으로 마음을 하나로 모으고 있는 것을 보고, 울었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ
  english_pob_choice: the heart of all of them
  chosen_korean: 그들 모두의 마음
  alternatives_korean:
  - 그들 모두의 심장
  - 그들 모두의 속마음
  lexicon: لب / heart
  rationale: 게으른 직역의 ‘심장’보다는 관계적·의지적 중심을 뜻하는 ‘마음’이 원문의 의미와 영어 POB의 해석을 자연스럽게 반영합니다.
- source_word: ዕሩይ፡ ብእሲ፡ ምስለ፡ ካልኡ
  english_pob_choice: united, each man with the other
  chosen_korean: 서로 하나로 연합하여
  alternatives_korean:
  - 서로 하나되어
  - 서로 결합하여
  lexicon: ‘united’ / togetherness
  rationale: 개별 인물들이 상호적으로 결속된 상태를 한국어로 간결하게 드러내기 위해 ‘서로 하나로 연합하다’로 옮겼습니다.
- source_word: ለሠናይ
  english_pob_choice: for good
  chosen_korean: 선을 향하고 있음을
  alternatives_korean:
  - 좋은 일을 위하여
  - 선한 뜻으로
  lexicon: good / beneficent
  rationale: 단순한 도덕적 ‘좋음’보다 의도와 방향성을 함께 살려, 전체 문맥상 공동체의 결속이 선한 목적을 향함을 드러냈습니다.
- source_word: ወበአከ
  english_pob_choice: and he wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 눈물을 흘렸습니다
  - 그리고 그는 울었습니다
  lexicon: weep
  rationale: 요셉의 정서적 반응을 자연스럽게 전달하는 기본 동사로 처리했습니다.
theological_decisions:
- issue: ‘마음’과 ‘연합’의 관계 표현
  chosen_reading: 요셉이 본 것은 단순한 감정의 일치가 아니라 사람들 사이의 내적 중심이 하나로 모인 상태입니다.
  alternative_readings:
  - 서로 친밀하게 지내는 정도로 완화할 수 있음
  - 단순한 외적 협동으로 읽을 수 있음
  rationale: 게즈어 원문의 ‘heart’와 ‘united’는 내적 합의와 공동의 의지를 가리키므로, 공동체적 결속의 강도를 약화하지 않도록 옮겼습니다.
  doctrine_reference: 문맥 주해
