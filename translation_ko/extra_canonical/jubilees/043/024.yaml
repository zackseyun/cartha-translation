  text: and ten donkeys carrying grain. And he sent them away. And they went up and told their father that Joseph was alive, and that he was distributing grain to all the peoples of the earth and ruling.
translation:
  language: ko
  text: 그리고 곡식 실은 나귀 열 필이었습니다. 그는 그들을 떠나보냈습니다. 그들은 올라가서 아버지에게 요셉이 살아 있으며, 그가 세상의 모든 민족에게 곡식을 나누어 주고 다스리고 있다고 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐሠርተ፡ አእዱገ፡ ... ስርናየ፡
  english_pob_choice: ten donkeys carrying grain
  chosen_korean: 곡식 실은 나귀 열 필
  alternatives_korean:
  - 곡식을 싣고 있는 나귀 열 마리
  - 곡식 운반용 나귀 열 필
  lexicon: አእዱገ / donkey; ስርናየ / grain
  rationale: 수량과 운반 내용을 함께 살리되, 본문이 말하는 것은 ‘곡식’을 운반하는 나귀 열 필이므로 현대 한국어에서 자연스러운 ‘곡식 실은 나귀 열 필’로 옮겼습니다.
- source_word: ወፈነዎሙ
  english_pob_choice: And he sent them away
  chosen_korean: 그들이 그를 떠나 보냈습니다
  alternatives_korean:
  - 그가 그들을 떠나 보냈습니다
  - 그들을 보내었습니다
  lexicon: send away
  rationale: 에티오피아어 본문은 앞뒤 문맥상 ‘그가 그들을 보냈다’는 뜻으로 읽히며, 영어 POB도 그 방향을 따릅니다. 한국어는 주어를 명시해 자연스럽게 풀었습니다.
- source_word: ይበፍር፡ ስርናየ፡ ለኵሉ፡ አሕዛበ፡ ምድር፡ ወይኴንን
  english_pob_choice: was distributing grain to all the peoples of the earth and ruling
  chosen_korean: 세상의 모든 민족에게 곡식을 나누어 주고 다스리고 있다고
  alternatives_korean:
  - 땅의 모든 민족에게 곡식을 나누어 주고 다스리고 있다고
  - 세상의 모든 백성에게 곡식을 공급하고 통치하고 있다고
  lexicon: distribute grain / peoples of the earth / ruling
  rationale: ‘나누어 주다’는 곡식을 분배하는 행위를, ‘모든 민족’은 አሕዛበ ምድር의 직접적 대응을, ‘다스리고’는 왕권적 통치를 드러내는 기본 의미를 살렸습니다.
- source_word: ዮሴፍ፡ ሕያው፡ ወከመ፡ ውእቱ
  english_pob_choice: Joseph was alive
  chosen_korean: 요셉이 살아 있으며
  alternatives_korean:
  - 요셉이 살아 있고
  - 요셉은 살아 있으며
  lexicon: alive
  rationale: 간접 화법 안에서 현재적 상태를 전달하는 표현이므로 ‘살아 있으며’로 연결해 뒤의 보고 내용과 자연스럽게 이어지게 했습니다.
theological_decisions:
- issue: 요셉의 통치와 곡식 분배의 병렬
  chosen_reading: 본문은 요셉의 생존 소식과 함께, 그가 실제로 곡식을 분배하며 다스린다는 정치·경제적 권위를 동시에 보고하게 합니다.
  alternative_readings:
  - 단순히 생존 사실만을 강조하는 읽기
  - 다스림을 상징적으로만 약화시키는 읽기
  rationale: 게즈 본문과 영어 POB는 두 요소를 모두 보존하므로, 통치와 분배를 함께 드러내는 번역을 택했습니다.
  doctrine_reference: 창세기 41장 요셉 서술과의 연속성
