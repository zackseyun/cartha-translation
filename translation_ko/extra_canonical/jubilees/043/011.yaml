  - 두 형제들
  lexicon: Geez kinship noun
  rationale: 겉으로는 자녀 관계를 가리키지만 원문이 ‘아들’이 아니라 ‘형제’(아두 형제 관계)를 쓰므로 그 어휘를 우선 반영했습니다.
- source_word: ወለደት
