  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
  footnotes:
  - marker: a
    text: Or 'Our father, your servant, had two sons from one mother.'.
    reason: previous_rendering
translation:
  language: ko
  text: 유다가 말했습니다. 「내 주여, 청하오니 이 종이 내 주의 귀에 한 말씀을 아뢰게 해 주십시오. 그의 어머니가 당신의 종인 우리 아버지에게 두 형제를 낳았습니다.[a] 그 하나는 나갔다가 행방을 잃었고, 아무도 그를 찾지 못했습니다. 그만이 그의 어머니에게서 남아 있으며, 이 종은…」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신의 종인 우리 아버지에게는 한 어머니에게서 난 두 아들이 있었습니다.”
    reason: 영어 POB 감사 기록의 대안 구문을 보존합니다. 본문은 게에즈어의 ‘두 형제’와 ‘낳았다’라는 표면 어휘를 우선 반영합니다.
