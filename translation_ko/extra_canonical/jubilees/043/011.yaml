  source_fidelity: 개정이 필요합니다. ወለደት(‘낳았다’)와 ክልኤተ አኀወ(‘두 형제’)를 보존한 점은 좋으나, 초안의 ‘나가서 잃어버렸고’는 한국어에서 그 사람이 무엇인가를 잃어버렸다는 뜻으로 읽히기 쉽습니다. 원문의 ‘나가서 잃어버린/사라진’ 상태는 ‘나갔다가 행방을 잃었고’로 옮기는 것이 자연스럽고 충실합니다. 또한 ለገብርከ ለአቡነ의 여격·동격 관계는 ‘당신의 종인 우리 아버지에게’로 드러내는 편이 낫습니다.
  naturalness: ‘제 주인의 들으시는 데’는 현대 표준 한국어 합쇼체의 궁정 청원 발화로 자연스럽지 않습니다. ‘이 종이 내 주의 귀에 한 말씀을 아뢰게 해 주십시오’는 자기비하적 법정·궁정 호칭과 공손한 발화 행위를 자연스럽게 전달합니다. ‘그만이 그의 어머니에게서 남아 있습니다’는 ባሕቲቱ(그만 홀로)와 እም እሙ(그의 어머니에게서)를 비교적 직역적으로 보존합니다.
  terminology: ‘종’은 ገብርከ의 신분·자기비하 표지에 적절합니다. ‘내 주’는 문맥상 화자가 상대에게 쓰는 호칭이므로 ‘제 주인’보다 자연스럽습니다. 영어 POB의 대안 독법은 본문에 a 표지를 두고 각주로 보존했습니다.
  issues:
  - severity: medium
