  text: And Judah said, "I beg you, my lord, let your servant speak a word in my lord's hearing. His mother bore two brothers to your servant, our father. One went out and was lost, and no one has found him; and he alone remains from his mother, and your servant..."
  footnotes:
  - marker: a
    text: Or 'Our father, your servant, had two sons from one mother.'.
    reason: previous_rendering
translation:
  language: ko
  text: 유다가 말했습니다. 「내 주여, 청하오니 당신의 종이 제 주인의 들으시는 데 한 말씀 드리게 하십시오. 그의 어머니는 당신의 종, 곧 우리의 아버지에게서 두 형제를 낳았습니다. 하나는 나가서 잃어버렸고, 아무도 그를 찾지 못했습니다. 그리고 그는 그의 어머니에게서만 홀로 남아 있으며, 당신의 종은…」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሳዕሌየ
  english_pob_choice: I beg you
  chosen_korean: 청하오니
  alternatives_korean:
  - 간청합니다
  - 부탁드립니다
  lexicon: Geez imperative/request formula
  rationale: 호소의 강도를 살리면서도 현대 한국어 합쇼체에 자연스럽게 맞는 공손한 청유로 옮겼습니다.
- source_word: ገብርከ / ገብርከሂ
