  - severity: medium
    issue: 궁정 청원의 부자연스러운 표현
    rationale: ‘당신의 종이 제 주인의 들으시는 데’는 호칭 체계와 문장 성분 결합이 어색합니다. 원문의 ‘your servant ... in my lord’s hearing’을 ‘이 종이 내 주의 귀에’로 옮기면 공손한 자기지칭과 청자의 호칭이 유지됩니다.
  - severity: low
