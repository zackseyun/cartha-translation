revisions:
- from: 유다가 말했습니다. 「내 주여, 청하오니 당신의 종이 제 주인의 들으시는 데 한 말씀 드리게 하십시오. 그의 어머니는 당신의 종, 곧 우리의 아버지에게서 두 형제를 낳았습니다. 하나는 나가서 잃어버렸고, 아무도 그를 찾지 못했습니다. 그리고 그는 그의 어머니에게서만 홀로 남아 있으며, 당신의 종은…」
  to: 유다가 말했습니다. 「내 주여, 청하오니 이 종이 내 주의 귀에 한 말씀을 아뢰게 해 주십시오. 그의 어머니가 당신의 종인 우리 아버지에게 두 형제를 낳았습니다.[a] 그 하나는 나갔다가 행방을 잃었고, 아무도 그를 찾지 못했습니다. 그만이 그의 어머니에게서 남아 있으며, 이 종은…」
  rationale: 원문의 미완성 절(‘그리고 당신의 종은…’)은 말줄임표로 유지했습니다. ‘그의 어머니’라는 다소 낯선 지시 관계와 ‘두 형제’라는 원문의 표현은, 더 매끈한 ‘한 어머니에게서 난 두 아들’로 본문을 평준화하지 않고 보존했습니다. 다만 한국어 문법상 오해를 부르는 ‘잃어버렸고’와 부자연스러운 청원 표현은 안전하게 수정했습니다.
