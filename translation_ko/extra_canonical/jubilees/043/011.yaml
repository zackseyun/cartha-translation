  - 주님의 종
  lexicon: Ge'ez servant/self-deprecating court address
  rationale: 본문의 자기비하적 신분 표지를 살리되, POB 기본어인 종을 유지했습니다. 끝의 미완성 표현은 말줄임표로 반영했습니다.
- source_word: ክልኤተ አኀወ
  english_pob_choice: two brothers
  chosen_korean: 두 형제
  alternatives_korean:
