  source_fidelity: 초두의 단편적 표현인 ‘그의 노예들입니다’와, 형제들 및 나귀들까지 모두 노예가 되겠다는 제안, 요셉의 강한 거절, 막내 동생만 남긴다는 선언, 잔으로 점친다는 주장을 유지했습니다. 다만 ‘우리 주님’은 인간 소유주 문맥에서 종교적 호칭으로 들릴 수 있어 ‘우리 주인’으로 바로잡았고, 마지막 의문문은 원문의 비교 구문과 ‘분명히’의 강조를 더 자연스럽게 반영했습니다.
  naturalness: 초안의 ‘사람이 자기 잔으로 점을 친다는 것을, 나처럼 하는 것을’은 목적절 안에 비교절이 중복되어 비문에 가깝습니다. 또한 ‘내가 이런 일을 하다니, 하나님께서 금하십니다’보다 ‘하나님께서 내가 이런 일을 하는 것을 금하십니다’가 현대 한국어에서 더 명료합니다.
