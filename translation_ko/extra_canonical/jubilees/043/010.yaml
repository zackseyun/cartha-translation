translation:
  language: ko
  text: “그의 노예들입니다. 보십시오, 우리는 우리 주인의 노예들이며, 우리 나귀들도 그렇습니다.” 요셉이 그들에게 말했습니다. “하나님께서 내가 이런 일을 하는 것을 금하십니다[10]. 여러분은 각자의 집으로 가십시오. 그러나 여러분의 막내 동생은 내 노예가 될 것입니다. 여러분이 악을 행했기 때문입니다. 내가 하듯이 사람이 자기 잔으로 반드시 점을 친다는 것을 여러분은 알지 못했습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '10'
    text: ‘하나님께서 내가 이런 일을 하는 것을 금하십니다’로 옮긴 구절은 해석하기 어렵습니다. 더 넓은 의미는 요셉이 형제들이 모두 노예가 되겠다는 제안을 단호히 거절하고, 이어서 잔이 발견된 사람만 남을 것이라고 주장한다는 것입니다.
    reason: textual_variant
lexical_decisions:
- source_word: አግብርት / δοῦλοι
  english_pob_choice: slaves
  chosen_korean: 노예
  alternatives_korean:
  - 종
  - 하인
  - 종들
  lexicon: δοῦλος
  rationale: 영어 POB가 ‘slaves’로 유지한 bonded-status를 따라, 완곡한 ‘종’ 대신 ‘노예’를 써서 신분의 구속성을 분명히 드러냈습니다.
- source_word: እግዚእነ / our lord
  english_pob_choice: our lord
  chosen_korean: 우리 주님
  alternatives_korean:
  - 우리 주인
  - 우리 임금
  - 우리 주
  lexicon: κύριος
  rationale: 여기서는 인간 상전을 가리키는 소유격 표현이므로, 문맥상 ‘주님’의 종교적 호칭보다 ‘우리 주님’으로 옮겨 상전-종의 관계를 드러냈습니다.
- source_word: እግዚአብሔር
  english_pob_choice: God
  chosen_korean: 하나님께서
  alternatives_korean:
  - 하나님이
  - 야훼께서
  - 주께서
  lexicon: Θεός
  rationale: 직접 거부를 나타내는 감탄적 표현을 한국어에서 자연스럽게 살리기 위해 주어를 함께 밝혀 ‘하나님께서 금하십니다’로 옮겼습니다.
- source_word: አፈረሀ፡ አንትሙሰ፡ ሑሩ፡ አብያቲክሙ፡
  english_pob_choice: You, go to your houses
  chosen_korean: 당신들은 집으로 가십시오
  alternatives_korean:
  - 여러분은 집으로 돌아가십시오
  - 당신들은 각자의 집으로 가십시오
  lexicon: imperative direct speech
  rationale: 명령의 핵심은 ‘돌아가라’보다 ‘가라’에 있어, 과도한 보충 없이 직접적인 명령형으로 옮겼습니다.
- source_word: እኑክሙሰ
  english_pob_choice: your youngest brother
  chosen_korean: 당신들의 막내 동생
  alternatives_korean:
  - 여러분의 막내 동생
  - 당신들의 막내 형제
  lexicon: kinship term
  rationale: 형제 관계의 자연스러운 한국어와 서사 흐름을 고려해 ‘막내 동생’으로 옮겼고, 성별 중립적 상위어보다 구체성을 택했습니다.
- source_word: ያስተቀስም ብእሲ ጽዋዖ
  english_pob_choice: a man surely divines with his cup
  chosen_korean: 사람이 자기 잔으로 점을 친다는 것
  alternatives_korean:
  - 사람이 잔으로 분명히 점을 친다는 것
  - 사람이 자기 잔으로 예언한다는 것
  lexicon: divine with his cup
  rationale: Geez의 점술/탐지 행위를 한국어 성서 문맥에 맞게 ‘점을 친다’로 옮기되, ‘자기 잔으로’로 수단을 분명히 했습니다.
- source_word: በከመ፡ አነ፡
  english_pob_choice: as I do
  chosen_korean: 나처럼 하는 것을
  alternatives_korean:
  - 내가 하는 것처럼
  - 나와 같이 하는 것을
  lexicon: comparative clause
  rationale: 문맥상 요셉의 자기 동일시를 강조하므로, 비교절을 자연스럽게 풀어 ‘나처럼 하는 것을’로 렌더링했습니다.
theological_decisions:
- issue: 요셉의 강한 거부 표현
  chosen_reading: ‘내가 이런 일을 하다니, 하나님께서 금하십니다’로 번역해, 영어 POB가 주는 강한 부정과 거절의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘그렇게 할 수 없습니다’
  - ‘하나님께서 그것을 막으십니다’
  rationale: 본문은 단순한 불허가 아니라 단호한 종교적 거절을 담고 있으므로, 한국어에서도 감탄형 거부를 유지해야 합니다.
  doctrine_reference: Narrative theology; fidelity to emphatic refusal in the source and POB audit note
- issue: ‘점을 친다’는 표현
  chosen_reading: 점술적 의미를 직접 드러내는 ‘점을 친다’를 유지했습니다.
  alternative_readings:
  - ‘분별한다’
  - ‘알아낸다’
  rationale: 영문 POB가 감추지 않은 행위의 성격을 유지해, 본문이 요셉의 초자연적 식별/점술적 주장처럼 들리는 긴장을 보존합니다.
  doctrine_reference: Source transparency and lexical tension retention
