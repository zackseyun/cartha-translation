  yaml_path: translation/extra_canonical/jubilees/043/003.yaml
  text: And it happened[3], when they had gone out from there, Joseph said to the man of his house, "Pursue them, run and overtake them, saying, 'Instead of good you have repaid me evil; you have stolen from me the silver cup from which my lord drinks.' And bring back to me their youngest brother, and bring him quickly before I enter into my judgment."
  footnotes:
  - marker: '3'
    text: The final clause of v.3 is textually difficult in this segmentation. The sense appears to be an urgent demand to bring the youngest brother back at once so the matter may be judged; the exact idiom is uncertain.
    reason: segmentation_note
  - marker: a
    text: Or '"Get up, run after them, and overtake them, saying, \'Why have you repaid me evil for good? You have stolen the silver cup from which my lord drinks, and you have brought blame upon your youngest brother. Quickly bring him, lest I enter into judgment.\'"'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 거기서 나가자, 요셉은 자기 집 사람에게 말했습니다. “그들을 뒤쫓아 달려가서 따라잡고 이렇게 말하십시오. ‘좋은 것을 악으로 갚았습니다. 당신들은 내 주인이 마시는 은잔을 내게서 훔쳤습니다.’” 그리고 그들의 막내 동생을 내게 데려오십시오. 내가 판결을 내리기 전에 그를 빨리 데려오십시오.[3]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '3'
    text: 이 절의 마지막 구절은 이 분절에서 본문상 해석이 어렵습니다. 막내 동생을 즉시 데려와 이 일을 처리하라는 긴급한 명령으로 보이지만, ‘빨리 데려오라’와 ‘내가 판결을 내리기 전에’의 정확한 구문 관계는 확실하지 않습니다.
    reason: segmentation_note
lexical_decisions:
- source_word: ደግፎሙ
  english_pob_choice: Pursue them, run and overtake them
  chosen_korean: 그들을 뒤쫓아 달려가서 따라잡고
  alternatives_korean:
  - 일어나서 그들을 뒤쫓아 따라잡고
