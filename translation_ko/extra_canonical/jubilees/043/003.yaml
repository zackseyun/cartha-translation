  lexicon: Ge'ez narrative imperative sequence
  rationale: 출발 동작보다 뒤쫓는 행위를 핵심으로 보아, ‘뒤쫓아 달려가서 따라잡고’로 옮겨 추격의 긴박함을 살렸습니다.
- source_word: ህየንተ፡ ሠናይት፡ ዐሠይክሙኒ፡ እኩየ፡
  english_pob_choice: Instead of good you have repaid me evil
  chosen_korean: 좋은 것을 악으로 갚았구나
  alternatives_korean:
  - 선한 일에 악으로 갚았구나
  - 좋음 대신 악으로 갚았구나
  lexicon: antithetic repayment formula
  rationale: '`ህየንተ`의 ‘~대신/~에 비해’ 관계와 보복적 대구를 자연스럽게 드러내기 위해 ‘좋은 것을 악으로 갚았다’로 처리했습니다.'
- source_word: ጽዋዐ፡ ብሩር፡ በዘይሰቲ፡ እግዚእየ፡
  english_pob_choice: the silver cup from which my lord drinks
  chosen_korean: 내 주인이 마시는 은잔
  alternatives_korean:
  - 내 주인이 마시는 은잔
  - 내 주군이 마시는 은잔
  lexicon: cup / lord phrase
  rationale: 은잔의 기능을 간명하게 살리고, `እግዚእየ`는 이 문맥에서 요셉의 상급자를 가리키므로 ‘내 주인’으로 옮겼습니다.
- source_word: ሊተ፡ ለ*አኁሆሙ፡ ዘይንእስ፡
  english_pob_choice: bring back to me their youngest brother
  chosen_korean: 그들의 막내 동생을 내게 데려오되
  alternatives_korean:
  - 그들의 막내 동생을 내게 데려오되
  - 그들의 가장 어린 동생을 내게 데려오라
  lexicon: youngest brother
  rationale: '`ዘይንእስ`는 ‘가장 어린/막내’를 뜻하므로 가족 관계를 분명히 하여 ‘막내 동생’으로 옮겼습니다.'
- source_word: ዘእንበለ፡ እባእ፡ ውስተ፡ ምኵናንየ።
  english_pob_choice: before I enter into my judgment
  chosen_korean: 내가 판결에 들어가기 전에
  alternatives_korean:
  - 내가 판결에 들어가기 전에
  - 내가 심판에 들어가기 전에
  lexicon: judgment clause
  rationale: '`ምኵናን`은 여기서 소송/판결 절차를 가리키므로 ‘판결’로 옮겨 절차적 긴박성을 살렸습니다.'
theological_decisions:
- issue: 마지막 절의 판결 표현
  chosen_reading: ‘내가 판결에 들어가기 전에’로 옮겨, 최종 명령이 즉각적인 송환 요구와 사법적 처리 사이의 긴장을 드러내게 했습니다.
  alternative_readings:
  - ‘내가 심판에 들어가기 전에’
  - ‘내가 재판을 시작하기 전에’
  rationale: 본문의 `ውስተ ምኵናንየ`는 단순한 감정적 ‘심판’보다 절차적 ‘판결/재판’의 뉘앙스가 강하므로, 문맥상 가장 자연스러운 법정 어휘를 택했습니다.
  doctrine_reference: 서사 문맥의 법정적 어휘는 사건 처리의 긴박함을 강조하며 교리적 확정 진술이 아닙니다.
