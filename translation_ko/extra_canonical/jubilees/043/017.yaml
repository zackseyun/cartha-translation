- from: 나 때문에 울지 말고, 서둘러 내 아버지를 내게로 데려오십시오. 그러면 여러분은 그것이 내 입이 말하고 있음을 알게 될 것이고, 내 동생 베냐민의 눈도 봅니다. 보십시오, 기근의 둘째 해입니다.[a][b]
  to: 나 때문에 울지 마십시오. 서둘러 내 아버지를 내게로 데려오십시오. 여러분은 내 입이 말하고 있는 것을 봅니다.[a] 내 동생 베냐민도 자기 눈으로 그것을 봅니다. 보십시오, 기근의 둘째 해입니다.[b]
  rationale: 원문의 명령, 직접 목격의 강조, 베냐민의 시각적 증언, 그리고 기근의 둘째 해라는 시간 지시를 보존했습니다. 특히 ‘입이 말한다’와 ‘베냐민의 눈이 본다’라는 수사를 한국어에서 이해 가능한 문장으로 다듬되, 베냐민이 직접 보고 있다는 강조를 유지했습니다. 현재/미래의 가능한 동사 해석과 기근 지속의 함의는 각주로 남겼습니다.
