  naturalness: 합쇼체의 명령과 진술은 대체로 적절하지만, 현행 문장의 ‘그것이 … 알게 될 것이고’는 한국어로 자연스럽지 않습니다. 또한 ‘내 동생 베냐민의 눈도 봅니다’는 문자성은 있으나 주어와 대상이 불명료하므로, ‘베냐민도 자기 눈으로 그것을 봅니다’로 자연스럽게 하되 직접 목격의 강조를 보존하는 것이 안전합니다.
  terminology: ‘기근’, ‘베냐민’, ‘보십시오’는 적절합니다. ‘내게로 데려오십시오’도 원문의 이동 방향을 잘 보존합니다.
