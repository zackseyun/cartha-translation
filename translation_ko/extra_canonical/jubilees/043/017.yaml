  lexicon: urgent imperative + motion toward speaker
  rationale: ‘서둘러’와 ‘데려오십시오’로 속도와 이동 방향을 분명히 살렸고, ‘내게로’로 목적지를 분명히 했습니다.
- source_word: ዘይነብብ፡ አፉየ፡
