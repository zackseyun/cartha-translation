theological_decisions:
- issue: ‘눈도 봅니다’라는 표현의 문자성
  chosen_reading: 육안의 시각을 통해 현재의 직접적 확인을 강조하는 표현으로 유지했습니다.
  alternative_readings:
  - ‘눈으로도 알아봅니다’로 완화
  - ‘눈도 그것을 봅니다’로 대상 명시
  rationale: 본문은 ‘내 입’과 ‘베냐민의 눈’이라는 감각 기관을 전면에 내세워 자신의 정체를 직접 확인시키는 수사이므로, 그 강한 대비를 약화시키지 않았습니다.
  doctrine_reference: 본문 수사와 직접 증언 강조
- issue: ‘기근의 둘째 해’의 시간 표현
  chosen_reading: 기근이 진행 중인 두 번째 해라는 시간 지시로 읽었습니다.
  alternative_readings:
  - 기근이 계속된 둘째 해
  - 기근의 두 번째 해
  rationale: 게에즈 원문은 단순히 ‘기근의 둘째 해’라고 말하며, 영문 개정도 과도한 ‘남은 해 수’ 표현을 제거했습니다. 따라서 추가 설명 없이 현재 시점을 제시했습니다.
  doctrine_reference: 본문의 시간 지시 보존
