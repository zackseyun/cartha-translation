translation:
  language: ko
  text: 나 때문에 울지 말고, 서둘러 내 아버지를 내게로 데려오십시오. 그러면 여러분은 그것이 내 입이 말하고 있음을 알게 될 것이고, 내 동생 베냐민의 눈도 봅니다. 보십시오, 기근의 둘째 해입니다.[a][b]
  philosophy: optimal-equivalence
