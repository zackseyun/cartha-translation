translation:
  language: ko
  text: 나 때문에 울지 마십시오. 서둘러 내 아버지를 내게로 데려오십시오. 여러분은 내 입이 말하고 있는 것을 봅니다.[a] 내 동생 베냐민도 자기 눈으로 그것을 봅니다. 보십시오, 기근의 둘째 해입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분은 보게 될 것입니다.’
    reason: 게에즈 미완료형은 문맥상 현재 또는 미래로 옮길 수 있습니다. 본문에서는 현재의 직접적인 확인으로 번역했습니다.
  - marker: b
    text: 또는 ‘기근이 계속된 둘째 해입니다.’
    reason: 원문은 간결하게 ‘기근의 둘째 해’라고 합니다. 지속의 뉘앙스를 풀어 쓴 대안을 제시합니다.
