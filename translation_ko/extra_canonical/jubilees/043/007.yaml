  text: I will take him as a slave, and you may go in peace to your houses." And while they were searching in their goods, beginning with the eldest and finishing with the youngest, it was found in Benjamin's sack.
  footnotes:
  - marker: a
    text: Or 'shall be taken as a slave'.
    reason: previous_rendering
translation:
  language: ko
  text: “나는 그를 노예로 삼겠습니다. 그리고 너희는 평안히 너희 집으로 가십시오.” 그리고 그들이 자기 물건들을 뒤지기 시작하여 맏이부터 막내에 이르기까지 찾는 동안, 그것은 베냐민의 자루에서 발견되었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እነሥእ
  english_pob_choice: I will take him as a slave
  chosen_korean: 나는 그를 노예로 삼겠습니다
  alternatives_korean:
  - 나는 그를 종으로 삼겠습니다
  - 그는 노예로 끌려가게 될 것입니다
  lexicon: 주어-능동 동사 선택
  rationale: 게에즈 원문은 1인칭 단수 능동형이므로, ‘잡히다/끌려가다’가 아니라 발화 주체가 직접 취하는 행위인 ‘노예로 삼겠습니다’로 옮겨야 합니다. POB의 ‘slave’ 선택도 지위의 강도를 유지합니다.
- source_word: በሰላም
  english_pob_choice: in peace
  chosen_korean: 평안히
  alternatives_korean:
  - 평강 가운데
  - 평안 가운데
  lexicon: 평안/평강 어휘
  rationale: 인사적 종결을 자연스러운 한국어 부사로 압축하되, 원문의 ‘평화/평안’ 의미를 유지했습니다.
- source_word: ወተረክበ
  english_pob_choice: it was found
  chosen_korean: 발견되었습니다
  alternatives_korean:
  - 찾아냈습니다
  - 드러났습니다
  lexicon: 수동 발견 표현
  rationale: 사건 결과를 객관적으로 서술하는 수동 표현이 원문의 서술 성격을 가장 잘 살립니다.
- source_word: በኀበ፡ ዘይንእስ
  english_pob_choice: beginning with the eldest and finishing with the youngest
  chosen_korean: 맏이부터 막내에 이르기까지
  alternatives_korean:
  - 가장 나이가 많은 사람부터 가장 어린 사람까지
  - 첫째부터 마지막까지
  lexicon: 서열 표현
  rationale: ‘eldest/youngest’의 대조를 한국어 관용으로 간결하게 옮기면서, 탐색 순서의 점진성을 보존했습니다.
theological_decisions:
- issue: 노예(status) 용어의 유지
  chosen_reading: ‘노예’로 직역해 종속 상태의 강도를 드러냈습니다.
  alternative_readings:
  - 종으로 완화하여 번역
  - 포로로 번역
  rationale: 이 장면은 단순한 고용 관계가 아니라 강제적 소속/처분의 뉘앙스를 띠므로, POB의 ‘slave’ 결정을 한국어에서도 약화시키지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: '번역 원칙: source-direct, lexical transparency'
- issue: 직설 화법의 현재적 선언
  chosen_reading: ‘나는 그를 노예로 삼겠습니다’로 직접 화자의 의지를 드러냈습니다.
  alternative_readings:
  - 그를 노예로 삼을 것입니다
  - 그는 노예가 될 것입니다
  rationale: 자동사/수동으로 바꾸면 책임 주체가 흐려지므로, 원문의 1인칭 능동 선언을 그대로 보존했습니다.
  doctrine_reference: 서사 발화의 행위 주체 보존
