  text: And they came to Joseph, and all of them bowed down before him with their faces to the ground. And Joseph said to them, "You have done evil." And they said, "What shall we say, and how shall we clear ourselves? Our Lord has found the guilt of your servants."
  footnotes:
  - marker: a
    text: Or 'Our lord has found the guilt of his servants.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 요셉에게 와서 모두 얼굴을 땅에 대고 그 앞에 절했습니다. 요셉이 그들에게 말했습니다. 「너희가 악을 행했습니다.」 그들이 대답했습니다. 「우리가 무엇을 말하겠습니까? 또 어떻게 우리 자신을 변명하겠습니까? 우리 주께서 당신의 종들의 죄를 찾아내셨습니다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሰገዱ ሎቱ ... በገጾሙ ውስተ ምድር
  english_pob_choice: bowed down before him with their faces to the ground
  chosen_korean: 얼굴을 땅에 대고 그 앞에 절했습니다
  alternatives_korean:
  - 엎드렸습니다
  - 몸을 숙여 땅에 이마를 댔습니다
  lexicon: 절하다
  rationale: Geez 본문과 POB 영어가 모두 단순한 접근이 아니라 경배/복종의 몸짓을 가리키므로, ‘절했습니다’로 자연스럽게 옮기되 ‘얼굴을 땅에 대고’로 자세를 유지했습니다.
- source_word: እኩየ ገበርክሙ
  english_pob_choice: You have done evil
  chosen_korean: 너희가 악을 행했습니다
  alternatives_korean:
  - 너희가 악을 저질렀습니다
  - 너희가 나쁜 일을 했습니다
  lexicon: 악을 행하다
  rationale: 직역보다 행위의 도덕적 성격을 드러내는 표현이 원문의 단정적 책망을 더 잘 살리므로 ‘악을 행했습니다’로 옮겼습니다.
- source_word: ወምነት ንትዋቀስ
  english_pob_choice: how shall we clear ourselves?
  chosen_korean: 어떻게 우리 자신을 변명하겠습니까
  alternatives_korean:
  - 어떻게 우리 죄를 씻어내겠습니까
  - 어떻게 우리를 깨끗하다고 하겠습니까
  lexicon: 변명하다
  rationale: 이 구절은 무죄 주장/정당화의 가능성을 묻는 문맥이므로, 한국어로는 ‘변명하다’가 책임을 피하려는 뉘앙스를 가장 분명히 전달합니다.
- source_word: እግዚእነ
  english_pob_choice: Our Lord
  chosen_korean: 우리 주
  alternatives_korean:
  - 우리 하나님
  - 주님
  lexicon: 주
  rationale: POB의 해석 흐름과 문맥상 이 표현은 요셉이 아니라 하나님을 가리키므로, 호칭은 ‘우리 주’로 유지하되 다음 절의 대상을 분명히 하도록 ‘당신의 종들’과 연결했습니다.
theological_decisions:
- issue: 문맥상 ‘우리 주’의 지시 대상
  chosen_reading: ‘우리 주께서’는 하나님을 가리키는 것으로 번역했습니다.
  alternative_readings:
  - 요셉을 가리키는 ‘우리 주님께서’
  - 단순한 존칭으로서의 ‘우리 주’
  rationale: 창세기 44:16 평행구와 POB 수정 이력을 따르면 여기의 ‘Lord’는 요셉이 아니라 하나님이므로, 한국어에서도 신적 지시를 분명히 해야 합니다.
  doctrine_reference: 본문 평행성 및 지시 대상 해석
- issue: ‘당신의 종들의’의 인칭 관계
  chosen_reading: 형제들이 자신들을 요셉의 종으로 낮추어 말하는 구조를 살려 ‘당신의 종들’로 옮겼습니다.
  alternative_readings:
  - ‘그의 종들’
  - ‘우리의 종들’
  rationale: Ge'ez와 POB audit trail이 가리키는 문맥상 소유격은 화자 자신들을 지칭하므로, 2인칭 존대 문맥에 맞게 ‘당신의 종들’이 가장 정확합니다.
  doctrine_reference: 서술 시점 및 대명사 지시 해석
