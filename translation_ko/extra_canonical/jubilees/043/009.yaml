  verdict: revise
  source_fidelity: 핵심 내용은 게에즈어 본문 및 영어 POB와 대체로 일치합니다. 다만 ‘어떻게 우리 자신을 변명하겠습니까?’는 ‘우리가 어떻게 무죄를 밝힐 수 있겠습니까?’라는 무죄 입증의 뜻을 충분히 정확하고 자연스럽게 드러내지 못합니다. ‘우리 주’는 문맥과 평행 본문상 하나님을 가리키며, ‘당신의 종들’은 요셉에게 말하는 형제들 자신을 가리키는 표현으로 유지해야 합니다.
  naturalness: 합쇼체 서술과 대화체는 적절합니다. 다만 ‘우리 자신을 변명하다’는 이 문맥에서 다소 방어적 변명으로 좁아질 수 있으므로, 무죄를 주장하거나 입증할 수 없다는 표현이 더 자연스럽고 정확합니다.
  terminology: ‘얼굴을 땅에 대고 그 앞에 절했습니다’, ‘악을 행했습니다’, ‘당신의 종들’은 적절합니다. 하나님을 가리키는 ‘우리 주님’은 본문의 호칭을 보존하면서 문맥상 지시 대상을 따릅니다. 영어 POB의 대안 독법에 대응하는 각주를 제공해 소유 대명사의 본문상 변이를 보존합니다.
