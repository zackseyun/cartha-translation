  yaml_path: translation/extra_canonical/jubilees/043/001.yaml
  text: And Joseph devised a plan by which he might know their thoughts, whether there was a thought of peace among them. And he said to the man who was over his house, "Fill all their sacks with grain, and put their money back in the middle of their bags; and put my silver cup, the cup from which I drink, in the sack of the youngest." And he sent them away.
  footnotes:
  - marker: a
    text: Or "put each man's money in the middle of his bag".
    reason: previous_rendering
translation:
  language: ko
  text: 요셉은 그들 가운데에 평강의 생각이 있는지, 곧 그들의 생각을 알 수 있는 계획을 세웠습니다. 그리고 그는 자기 집을 맡은 사람에게 말했습니다. "그들의 자루들을 모두 곡식으로 채우고, 그들의 돈을 자루 한가운데에 다시 넣고, 내가 마시는 그 은잔을 막내의 자루에 넣으십시오." 그리고 그들을 떠나보냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐለየ፡ ዮሴፍ፡ ሕሊና፡
  english_pob_choice: And Joseph devised a plan
  chosen_korean: 요셉은 ... 계획을 세웠습니다
  alternatives_korean:
  - 요셉은 ... 생각했습니다
  - 요셉은 ... 꾀했습니다
  lexicon: 요셉 / 계획을 세우다
  rationale: Ge'ez의 ሐለየ는 단순한 ‘생각하다’보다 목적을 가진 방책 마련의 뉘앙스가 강하므로, POB의 ‘devised a plan’을 따라 ‘계획을 세우다’로 옮겼습니다.
- source_word: በዘ፡ ያአምር፡ ሕሊናሆሙ፡ *እመ፡ ቦሙ፡ ሕሊና፡ ሰላም፡ በበይናቲሆሙ፡
  english_pob_choice: by which he might know their thoughts, whether there was a thought of peace among them
  chosen_korean: 그들 가운데에 평강의 생각이 있는지, 곧 그들의 생각을 알 수 있는
  alternatives_korean:
  - 그들의 마음을 알 수 있는지, 곧 그들 가운데 평강의 마음이 있는지
  - 그들 사이에 화평의 뜻이 있는지, 곧 그들의 생각을 알 수 있는
  lexicon: 평강 / 생각
  rationale: ያአምር와 ሕሊናሆሙ를 반영해 ‘생각을 알다’로, ሰላም은 POB와 일치하는 ‘평강’으로 옮겼습니다. ‘생각의 평화’보다 ‘평강의 생각’이 원문의 존재 여부를 더 직접적으로 드러냅니다.
- source_word: ምላእ፡ ሎሙ፡ ኵሎ፡ አሕስሊሆሙ፡ እክለ፡
  english_pob_choice: Fill all their sacks with grain
  chosen_korean: 그들의 자루들을 모두 곡식으로 채우고
  alternatives_korean:
  - 그들의 자루를 모두 곡식으로 채우고
  - 그들의 자루들을 모두 먹을 곡식으로 채우고
  lexicon: 자루 / 곡식
  rationale: 복수형 자루들과 እክለ(곡식)를 반영하여 자연스러운 현대 한국어로 옮겼습니다. 'bags'보다 곡식 운반용 자루라는 맥락이 분명하므로 '자루들'을 유지했습니다.
- source_word: ወ*ወርቆሙኒ፡ አግብእ፡ ሎሙ፡ ማእከለ፡ መዋዲቶሙ፡
  english_pob_choice: and put their money back in the middle of their bags
  chosen_korean: 그들의 돈을 자루 한가운데에 다시 넣고
  alternatives_korean:
  - 각 사람의 돈을 자루 한가운데에 다시 넣고
  - 그들의 돈을 자루 속 가운데에 다시 넣고
  lexicon: 돈 / 다시 넣다
  rationale: Ge'ez의 복수 소유격 ‘그들의 돈’과 ‘되돌려 넣다’의 의미를 따라 POB의 수정판을 반영했습니다. '다시 넣다'는 반환의 동작을 간결하게 드러냅니다.
- source_word: ወኮራየ፡ ... ዘ*ብሩር፡
  english_pob_choice: my silver cup, the cup from which I drink
  chosen_korean: 내가 마시는 그 은잔
  alternatives_korean:
  - 내가 마시는 은잔
  - 내 은잔, 곧 내가 마시는 잔
  lexicon: 은잔 / 내가 마시는
  rationale: 은으로 된 잔이라는 물질적 표현과 ‘내가 마시는’의 용도를 함께 살려, 단순한 소유물이 아니라 식탁에서 실제로 쓰는 잔임을 드러냈습니다.
theological_decisions:
- issue: ‘peace’의 번역에서 평강과 화평 중 무엇을 택할지
  chosen_reading: 평강
  alternative_readings:
  - 화평
  - 평화
  rationale: POB의 ‘thought of peace’는 관계적 적대 없음만이 아니라 안정과 선의를 포함하는 말로 읽히므로, 프로젝트 용어와도 맞는 ‘평강’을 유지했습니다.
  doctrine_reference: 용어 일관성 및 서사 맥락 보존
- issue: 요셉의 의도 설명을 과도한 심리화 없이 옮길지
  chosen_reading: 그들 가운데에 평강의 생각이 있는지, 곧 그들의 생각을 알 수 있는 계획
  alternative_readings:
  - 그들의 마음을 떠보는 계획
  - 그들의 속마음을 알기 위한 계획
  rationale: 원문은 추측적 심리 묘사보다 목적 있는 시험 계획을 말하므로, ‘떠보다’ 같은 관용적 표현보다 원문의 구조를 더 직접적으로 반영했습니다.
  doctrine_reference: 본문 의미 보존 및 서술 톤 유지
