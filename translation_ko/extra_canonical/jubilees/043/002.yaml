  text: And he did as Joseph told him, and filled all their sacks with grain, and put their money in their sacks; and he put the cup in Benjamin's sack. And when morning dawned, they went away.
  footnotes:
  - marker: a
    text: Or 'filled all their sacks with grain and their money, and put it in their sacks'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 요셉이 그에게 말한 대로 하여, 그들의 자루마다 곡식으로 채우고 그들의 돈도 그들의 자루에 넣었으며, 베냐민의 자루에는 잔을 넣었습니다. 그리고 아침이 밝자 그들이 떠났습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገብረ፡ በከመ፡ ይቤሎ፡ ዮሴፍ፡
  english_pob_choice: And he did as Joseph told him
  chosen_korean: 그리고 요셉이 그에게 말한 대로 하여
  alternatives_korean:
  - 그리고 요셉이 그에게 말한 대로 했으며
  - 요셉이 그에게 일러준 대로 행하였고
  lexicon: did as told
  rationale: 행위의 순응을 자연스럽게 살리면서도, 원문의 ‘말한 대로’라는 지시 관계를 분명히 드러냈습니다.
- source_word: ወመልአ፡ ሎሙ፡ አሕስሊሆሙ፡ ኵሎ፡ ሲሊተ፡
  english_pob_choice: and filled all their sacks with grain
  chosen_korean: 그들의 자루마다 곡식으로 채우고
  alternatives_korean:
  - 그들의 모든 자루를 곡식으로 채우고
  - 그들의 자루들을 모두 곡식으로 가득 채우고
  lexicon: filled sacks with grain
  rationale: ‘자루마다’는 각 자루를 대상으로 한 분배를 자연스럽게 살리며, ‘곡식으로 채우고’로 원문의 충실한 내용을 보존했습니다.
- source_word: ወወርቆሙኒ፡ ወደየ፡ ውስተ፡ አሕስሊሆሙ፡
  english_pob_choice: and put their money in their sacks
  chosen_korean: 그들의 돈도 그들의 자루에 넣었으며
  alternatives_korean:
  - 그들의 돈도 그들의 자루 속에 넣었으며
  - 그들의 돈까지도 그들의 자루에 넣었으며
  lexicon: put their money in their sacks
  rationale: ‘도’로 곡식과 돈의 두 행동을 분리해 주고, Ge'ez의 별도 동작을 한국어에서도 분명히 구분했습니다.
- source_word: ወደየ፡ ውስተ፡ ሐስለ፡ ብንያም።
  english_pob_choice: he put the cup in Benjamin's sack
  chosen_korean: 베냐민의 자루에는 잔을 넣었습니다
  alternatives_korean:
  - 베냐민의 자루에 잔을 넣었습니다
  - 잔을 베냐민의 자루에 넣었습니다
  lexicon: cup in Benjamin's sack
  rationale: 대조를 위해 베냐민의 자루를 앞으로 두었고, ‘잔’은 문맥상 성만찬 용어가 아닌 일반 용기 의미로 그대로 옮겼습니다.
- source_word: ወነግሀ፡ በጽባሕ፡ ሖሩ፡
  english_pob_choice: And when morning dawned, they went away
  chosen_korean: 그리고 아침이 밝자 그들이 떠났습니다
  alternatives_korean:
  - 그리고 아침이 밝자 그들이 길을 떠났습니다
  - 아침이 되자 그들이 떠났습니다
  lexicon: when morning dawned, they went away
  rationale: ‘아침이 밝자’는 원문의 새벽 도래를 자연스럽게 살리고, ‘떠났습니다’로 단순 이동을 간결하게 표현했습니다.
theological_decisions:
- issue: 서술의 순서와 반복 주어 처리
  chosen_reading: 한국어에서는 행동의 순서를 유지하되, 반복되는 주어는 생략하거나 ‘도’로 연결해 문장 흐름을 자연스럽게 만들었습니다.
  alternative_readings:
  - 각 동작마다 ‘그가’/‘그들은’ 주어를 반복하는 번역
  - 영어식 병렬을 그대로 따라 매우 평면적으로 옮기는 번역
  rationale: 원문의 사건 진행은 보존하면서도, 한국어 합쇼체 서술로 읽히도록 최소한의 재배열을 허용했습니다.
  doctrine_reference: 문체·가독성 원칙
- issue: ‘잔’의 의미 범주
  chosen_reading: 문맥상 제의적 용어가 아니라 일반적인 식기인 ‘잔’으로 옮겼습니다.
  alternative_readings:
  - ‘컵’으로 옮기는 번역
  - ‘술잔’으로 구체화하는 번역
  rationale: 이 절의 대상은 요셉의 물건으로 보이는 일반 용기이므로, 원문이 요구하지 않는 구체화는 피했습니다.
  doctrine_reference: 문맥 우선 번역 원칙
