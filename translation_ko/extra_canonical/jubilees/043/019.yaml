  text: for preservation[19], go down, you and your households, so that you may not be consumed by the famine and not be distressed on account of your possessions. For God sent me before you quickly, so that they may live.
  footnotes:
  - marker: '19'
    text: The phrase rendered 'for preservation' could also be understood more specifically as 'for a remnant' or 'for survival.'
    reason: lexical_alternative
  - marker: a
    text: Or 'and not perish'.
    reason: previous_rendering
  - marker: b
    text: Or 'so that he might keep you alive'.
    reason: previous_rendering
translation:
  language: ko
  text: 서두르십시오. 당신들과 당신들의 가족은 내려가십시오. 그러면 기근으로 멸망하지 않고, 당신들의 소유 때문에 근심하지 않게 될 것입니다. 하나님께서 그들이 살도록, 당신들보다 앞서 저를 생존을 위하여[19] 보내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '19'
    text: ‘생존을 위하여’는 더 구체적으로 ‘남은 자를 위하여’ 또는 ‘보존을 위하여’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ለሠሪዕ
  english_pob_choice: for preservation
  chosen_korean: 보전을 위해
  alternatives_korean:
  - 살아남기 위해
  - 남은 자를 위해
  - 생존을 위해
  lexicon: 보전
  rationale: 문맥상 단순한 ‘급히’가 아니라, 앞선 문장의 기근과 대조되는 보존/생존 목적을 드러내므로 ‘보전’을 택했습니다.
- source_word: ትትሐጐሉ
  english_pob_choice: consumed by the famine
  chosen_korean: 기근에 삼켜지지 않고
  alternatives_korean:
  - 기근으로 멸망하지 않고
  - 기근에 파멸되지 않고
  lexicon: 삼키다
  rationale: 히브리/게에즈 계열의 ‘삼키다’ 이미지를 살려, 기근이 사람들을 집어삼키는 생생한 표현을 유지했습니다.
- source_word: ተከዙ
  english_pob_choice: distressed
  chosen_korean: 괴로워하지 않으실 것입니다
  alternatives_korean:
  - 근심하지 않으실 것입니다
  - 마음 아파하지 않으실 것입니다
  lexicon: 괴로워하다
  rationale: 이 동사는 ‘멸망’이 아니라 슬픔·근심·괴로움의 정서를 뜻하므로, 소유를 잃는 데 따른 심리적 고통을 반영했습니다.
- source_word: ይሕየዉ
  english_pob_choice: so that they may live
  chosen_korean: 그들이 살아 있게 하려는 것입니다
  alternatives_korean:
  - 그들이 살게 하려는 것입니다
  - 그들이 생존하게 하려는 것입니다
  lexicon: 살다
  rationale: 동사의 복수형과 목적절을 반영하여, 단수 행위가 아니라 집안/가축을 포함한 복수 주어의 생존을 살렸습니다.
theological_decisions:
- issue: ‘for preservation’의 범위
  chosen_reading: 보존/생존의 목적을 나타내는 표현으로 이해해, 문맥의 기근 구원과 연결했습니다.
  alternative_readings:
  - 남은 자를 위한 것
  - 생존을 위한 것
  rationale: 게에즈 원문과 영어 주해가 모두 ‘preservation’의 폭넓은 의미를 허용하므로, 본문 흐름을 해치지 않는 합쇼체 표현을 택했습니다.
  doctrine_reference: 섭리와 보존의 언어
- issue: 직접 화법의 동사형
  chosen_reading: 본문의 명령형을 ‘내려가십시오’로 유지하고, 하나님의 선행 행동은 평서형으로 구분했습니다.
  alternative_readings:
  - 내려가라
  - 내려가십시오
  rationale: 청중에게 주는 직접 명령은 공손한 합쇼체로 옮기되, 원문의 긴박성과 명령성을 약화하지 않도록 했습니다.
  doctrine_reference: 서사 속 명령의 화법
