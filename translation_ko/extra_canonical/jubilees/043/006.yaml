translation:
  language: ko
  text: “우리는 우리 주님의 종이 될 것입니다.” 그리고 그가 그들에게 말했습니다. “그렇지 않습니다. 내가 그것을 찾은 사람—그 사람만이”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንትቀነይ፡ ለእግዚእነ
  english_pob_choice: we will be slaves to our lord
  chosen_korean: “우리는 우리 주님의 종이 될 것입니다.”
  alternatives_korean:
  - “우리는 우리 주님의 노예가 될 것입니다.”
  - “우리는 우리 주님께 속한 종이 될 것입니다.”
  lexicon: δοῦλος
  rationale: Ge'ez의 자기 종속 표현을 한국어로는 기본값인 ‘종’으로 옮기되, 미래형 ‘될 것입니다’로 서원을 표현했습니다.
- source_word: ወይቤሎሙ
  english_pob_choice: And he said to them
  chosen_korean: 그리고 그가 그들에게 말했습니다
  alternatives_korean:
  - 그리고 그가 그들에게 이르렀습니다
  - 그리고 그가 그들에게 말하셨습니다
  lexicon: אמר/λέγω 계열 서술동사
  rationale: 서술 연결을 자연스럽게 유지하면서도, 영어 주해의 구두점 경계를 반영해 독립된 발화 도입으로 처리했습니다.
- source_word: አኮ፡ ከማሁ
  english_pob_choice: Not so
  chosen_korean: 그렇지 않습니다
  alternatives_korean:
  - 그렇게는 아닙니다
  - 아닙니다
  lexicon: 부정 응답 공식
  rationale: 짧은 반응형 부정을 한국어 합쇼체로 간결하게 옮겨, 원문의 단호한 거절을 살렸습니다.
- source_word: በኀበ፡ ብእሲ፡ ዘረከብክዎ፡ ኪያሁ፡ ባሕቲቶ
  english_pob_choice: The man with whom it is found—he alone
  chosen_korean: 내가 그것을 찾은 사람—그 사람만이
  alternatives_korean:
  - 그것이 발견된 사람—그 사람만이
  - 내가 그것을 발견한 사람—그 사람만이
  lexicon: ረከበ
  rationale: Ge'ez 동사 ረከብክዎ는 1인칭 능동 ‘내가 그것을 찾았다’의 형태이므로, 영어 개정안의 수동형보다 주체를 드러내는 표현을 우선했습니다.
theological_decisions:
- issue: ‘우리 주님’의 지시 대상
  chosen_reading: 여기서 ‘우리 주님’은 서술상 인간 주인을 가리키는 표현으로 보아 ‘주님’으로 두되, 야훼로 확장하지 않았습니다.
  alternative_readings:
  - 하나님
  - 야훼
  rationale: 문맥상 종속 관계의 주인을 뜻하며, 본문 자체에는 신적 호칭을 요구하는 단서가 없습니다.
  doctrine_reference: 문맥 지시 원칙
- issue: 종/노예 표현
  chosen_reading: ‘종’으로 번역해 예속 관계를 드러내되, 본문이 요구하는 강도 이상으로 법적·사회적 ‘노예’ 용어를 도입하지 않았습니다.
  alternative_readings:
  - 노예
  rationale: Ge'ez와 영어 주해 모두 종속 상태를 말하지만, 여기서는 특별히 제도적 노예제를 강조하는 문맥은 아닙니다.
  doctrine_reference: 용어 보존 원칙
