  text: And there are still five years in which there will be no plowing, and no fruit of trees, and no harvest.
translation:
  language: ko
  text: 그리고 아직도 다섯 해가 남아 있으며, 그동안 쟁기질도 없고 나무의 열매도 없고 수확도 없을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዓዲ፡ ኃምስቱ፡ ዓመት፡ ሀሎ፡
  english_pob_choice: And there are still five years
  chosen_korean: 그리고 아직 다섯 해가 더 남아 있어
  alternatives_korean:
  - 그리고 다섯 해가 더 있습니다
  - 또한 아직 다섯 해가 남아 있습니다
  lexicon: remaining time expression
  rationale: 게으름 없이 남은 기간을 뜻하는 문맥을 살려, 단순한 존재 진술보다 ‘아직 ... 더 남아 있어’로 자연스럽게 옮겼습니다.
- source_word: ማእረር
  english_pob_choice: plowing
  chosen_korean: 쟁기질
  alternatives_korean:
  - 갈이
  - 밭갈이
  lexicon: plowing
  rationale: 농경 행위를 가리키는 기본 의미를 직접적으로 드러내는 표준어로 옮겼습니다.
- source_word: ፍሬ፡ ዕፅ
  english_pob_choice: fruit of trees
  chosen_korean: 나무의 열매
  alternatives_korean:
  - 과목의 열매
  - 수목의 열매
  lexicon: fruit of trees
  rationale: 직역하되 한국어에서 자연스러운 소유·수식 구조로 바꾸어 원문의 ‘trees’ 범위를 유지했습니다.
- source_word: ሐፅስ
  english_pob_choice: harvest
  chosen_korean: 수확
  alternatives_korean:
  - 추수
  - 거둠
  lexicon: harvest
  rationale: 수확 행위를 포괄하는 현대 표준어를 사용해 문맥의 농업 금지를 분명하게 했습니다.
theological_decisions:
- issue: 반복되는 부정과 미래 시제의 처리
  chosen_reading: 앞의 남은 기간 진술과 뒤의 세 가지 부정(쟁기질·열매·수확 없음)을 그대로 살렸습니다.
  alternative_readings:
  - 앞의 기간 언급을 생략하고 결과만 번역함
  - 부정을 하나로 묶어 완화함
  rationale: 이 구절은 남은 5년과 그 기간의 결핍을 함께 말하므로, 둘을 분리하지 않고 모두 드러내는 것이 본문의 경고성을 보존합니다.
  doctrine_reference: source fidelity / narrative clarity
