  chosen_korean: 그리고 아직 다섯 해가 더 남아 있어
  alternatives_korean:
  - 그리고 다섯 해가 더 있습니다
  - 또한 아직 다섯 해가 남아 있습니다
  lexicon: remaining time expression
  rationale: 게으름 없이 남은 기간을 뜻하는 문맥을 살려, 단순한 존재 진술보다 ‘아직 ... 더 남아 있어’로 자연스럽게 옮겼습니다.
