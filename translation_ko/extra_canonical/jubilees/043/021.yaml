lexical_decisions:
- source_word: ወዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  english_pob_choice: and over all the land of Egypt
  chosen_korean: 이집트 온 땅 위에 있으며
  alternatives_korean:
  - 이집트의 온 땅 위에 있으며
  - 이집트 전역 위에 있으며
  lexicon: geez phrase with spatial/territorial sense
  rationale: 지배 범위를 나타내는 전치적 구문으로 보고, 한국어에서는 ‘위에’로 자연스럽게 옮겨 문맥상 앞선 서술과 이어지도록 했습니다.
- source_word: ወዜንውዎ፡ ለአቡየ፡
  english_pob_choice: And tell my father of
  chosen_korean: 내 아버지에게 ... 말해 주십시오
  alternatives_korean:
  - 내 아버지에게 ... 전해 주십시오
  - 내 아버지에게 ... 알리십시오
  lexicon: Ge'ez imperative with indirect object
  rationale: 직접 대화의 명령형을 살려 ‘말해 주십시오’로 옮겼고, 목적어 표지는 ‘에게’로 처리했습니다.
- source_word: ኵሎ፡ ክብረየ፡
  english_pob_choice: all my honor
  chosen_korean: 나의 모든 영광
  alternatives_korean:
  - 나의 모든 존귀
  - 나의 모든 명예
  lexicon: honor/glory term
  rationale: 문맥상 요셉이 자신에게 주어진 지위와 영화의 총체를 가리키므로, 전통적 종교어감의 ‘명예’보다 의미 범위가 넓은 ‘영광’을 택했습니다.
- source_word: ወኵሎ፡ ዘመጠነ፡ ወሀበኒ፡
  english_pob_choice: and all that has been given to me
  chosen_korean: 내게 주어진 모든 것
  alternatives_korean:
  - 내게 주신 모든 것
  - 내게 주어진 모든 소유
  lexicon: relative clause with passive sense
  rationale: 원문은 ‘하나님이 주신 부와 영광’처럼 해석을 확장하지 않고, 주어진 바의 총체를 그대로 드러내는 수동형으로 처리했습니다.
theological_decisions:
- issue: 본문의 선물/영광 표현을 신학적으로 확장할지 여부
  chosen_reading: 요셉의 ‘영광’과 ‘내게 주어진 모든 것’을 분리하여, 본문에 없는 ‘하나님’이나 ‘부와 영광’의 명시를 넣지 않았습니다.
  alternative_readings:
  - 하나님이 내게 주신 부와 영광
  - 내가 받은 모든 영화와 소유
  rationale: 개정된 영어 POB도 해석적 확장을 제거했고, 원문의 범위를 넘는 신학적 보충은 오히려 본문의 간결한 진술을 흐릴 수 있습니다.
  doctrine_reference: source fidelity / anti-expansion principle
