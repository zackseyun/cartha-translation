  language: ko
  text: 그리고 그들은 자기들의 옷을 찢고 나귀에 싣고, 성읍으로 돌아가 집에 이르렀습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሠጠጡ፡ አልባሲሆሙ፡
  english_pob_choice: they tore their garments
  chosen_korean: 자기들의 옷을 찢고
  alternatives_korean:
  - 옷을 찢고
  - 겉옷을 찢고
  lexicon: 옷
  rationale: Geez 원문은 ‘그들의 옷’을 가리키며, 통상적 애도/격분 표현을 자연스럽게 옮기되 특정한 ‘겉옷’으로 좁히지는 않았습니다.
- source_word: ወጸዐኑ፡ ዲበ፡ አእዱጊሆሙ፡
  english_pob_choice: and loaded their donkeys
  chosen_korean: 나귀에 싣고
  alternatives_korean:
  - 그들의 나귀에 싣고
  - 나귀에 짐을 싣고
  lexicon: 나귀
  rationale: 원문은 나귀 위에 무엇인가를 싣는 동작을 말하며, 한국어에서는 목적어가 생략된 간결한 서술이 가장 자연스럽습니다.
- source_word: ወተመይጡ፡ ሀገረ፡
  english_pob_choice: and returned to the city
  chosen_korean: 성읍으로 돌아가
  alternatives_korean:
  - 도성으로 돌아가
  - 도시로 돌아가
  lexicon: 성읍
  rationale: ወተመይጡ는 ‘되돌아가다/돌아오다’의 뜻이고, ሀገረ는 이 문맥에서 일반 도시보다 성읍이 더 원문에 가깝습니다.
- source_word: ወበጽሑ፡ ቤተ፡
  english_pob_choice: and came to the house
  chosen_korean: 집에 이르렀습니다
  alternatives_korean:
  - 집에 도착했습니다
  - 집에 왔습니다
  lexicon: 집
  rationale: 마지막 절을 반영해 ‘집에 이르다’로 옮겨 도착의 완료를 드러내면서, 문체는 합쇼체로 마무리했습니다.
