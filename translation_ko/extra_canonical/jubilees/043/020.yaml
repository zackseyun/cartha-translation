translation:
  language: ko
  text: 많은 백성. 내 아버지에게 내가 아직 살아 있다고 알리십시오. 보십시오, 여러분도 하나님께서 나를 바로의 아버지로, 또 바로의 집의 통치자로 삼으셨음을 보시지 않습니까?
