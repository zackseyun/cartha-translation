  text: a numerous people. And tell my father that I am still alive, and look, you yourselves see that God has made me as a father to Pharaoh and as ruler in his house,
translation:
  language: ko
  text: 그는 많은 백성입니다. 그리고 내 아버지에게 내가 아직 살아 있다고 말씀드리십시오. 보십시오, 여러분 자신이 하나님이 나를 바로의 아버지로, 그리고 그의 집의 통치자로 삼으셨음을 보고 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ፡ ብዙኃን
  english_pob_choice: a numerous people
  chosen_korean: 많은 백성
  alternatives_korean:
  - 수많은 백성
  - 많은 사람들
  lexicon: noun phrase
  rationale: 게에즈 원문의 수량 강조를 자연스러운 한국어로 옮기되, 단순한 ‘사람들’보다 집단성을 살리기 위해 ‘백성’을 택했습니다.
- source_word: ለአቡየ፡ ... አነ፡ ሕያው
  english_pob_choice: tell my father that I am still alive
  chosen_korean: 내 아버지에게 내가 아직 살아 있다고 말씀드리십시오
  alternatives_korean:
  - 내 아버지에게 내가 아직 살아 있다는 것을 전하십시오
  - 내 아버지에게 내가 아직 살아 있음을 알리십시오
  lexicon: verb phrase
  rationale: 직접 전달 명령을 한국어 공손형으로 살리기 위해 ‘말씀드리십시오’를 사용했고, ‘아직 살아 있다’는 상태를 분명히 했습니다.
- source_word: ሠርዐኒ፡ እግዚአብሔር
  english_pob_choice: God has made me as a father to Pharaoh
  chosen_korean: 하나님이 나를 바로의 아버지로 삼으셨음
  alternatives_korean:
  - 하나님이 나를 바로의 아버지처럼 두셨음
  - 하나님이 나를 바로의 아버지로 세우셨음
  lexicon: verb phrase
  rationale: 원문의 ‘~로 만들다/세우다’ 의미를 ‘삼으셨다’로 자연스럽게 옮겨, 요셉이 바로와 맺는 보호자적 관계를 살렸습니다.
- source_word: እመብል፡ ውስተ፡ ቤቱ
  english_pob_choice: as ruler in his house
  chosen_korean: 그의 집의 통치자로
  alternatives_korean:
  - 그의 집을 다스리는 자로
  - 그의 집의 관리자 겸 통치자로
  lexicon: noun phrase
  rationale: 원문의 지배/통치 의미를 보존하면서도 한국어에서 자연스러운 관직 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 세움과 요셉의 고위 지위 표현
  chosen_reading: 하나님이 요셉을 바로의 아버지이자 그의 집의 통치자로 ‘삼으셨다’는 주권적 세움으로 읽었습니다.
  alternative_readings:
  - 단순히 직책을 부여하셨다
  - 보호자적 역할만 강조한다
  rationale: 게에즈 원문과 영어 POB 모두 하나님을 행위의 주어로 두어, 요셉의 상승이 인간적 성공이 아니라 하나님의 배치임을 드러냅니다.
  doctrine_reference: 하나님의 섭리
