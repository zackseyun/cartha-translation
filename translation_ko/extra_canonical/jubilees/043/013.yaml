revisions:
- from: 그리고 나는, 당신의 종이므로, 그 소년 대신 홀로 남아 내 주님께 종이 되겠습니다. 젊은이는 자기 형제들과 함께 가게 하십시오. 내가 당신의 종인 우리 아버지의 손에서 그를 담보했기 때문입니다. 그리고 내가 그를 데려오지 못하면, 당신의 종은 우리 아버지 앞에서 평생 그 책임을 지겠습니다.’[a]
  to: 그러므로 이제 당신의 종인 제가 그 소년을 대신하여 홀로 내 주님의 종으로 남게 해 주십시오. 그 젊은이는 자기 형제들과 함께 가게 해 주십시오. 제가 당신의 종인 우리 아버지에게 그를 위하여 보증을 섰기 때문입니다. 그리고 제가 그를 데려오지 못하면, 당신의 종은 우리 아버지 앞에서 평생 그 책임을 지겠습니다.’[a]
  rationale: 자기호칭을 인과절이 아니라 직접 호칭으로 바로잡고, ‘담보하다’를 사람에 대한 보증 책임을 자연스럽게 나타내는 ‘보증을 서다’로 고쳤습니다. 또한 두 명령형을 청원형으로 명시하고, 본문에 있던 각주 표지에 대응하는 설명 각주를 보완했습니다. 원문의 다소 불규칙한 어순과 논리 연결은 각주에서 알리되, 본문에는 안전하게 확정할 수 있는 의미만 반영했습니다.
