  source_fidelity: 원문의 핵심 흐름, 즉 화자가 소년 대신 주인의 종으로 남고 젊은이를 형제들과 보내 달라고 청하며, 아버지에게 한 보증과 그에 따른 책임을 말하는 내용은 대체로 반영되었습니다. 그러나 “당신의 종이므로”는 원문의 자기호칭을 인과절로 바꾸고, “그를 담보했기 때문입니다”는 사람을 목적어로 하는 한국어 표현으로 부자연스러우며 보증의 상대인 아버지를 충분히 드러내지 못합니다.
  naturalness: 합쇼체는 대체로 유지되었으나, “나는, 당신의 종이므로”와 “그를 담보했습니다”는 현대 표준어 문장으로 어색합니다. 청원의 문맥에는 “남게 해 주십시오/가게 해 주십시오”가 자연스럽습니다.
  terminology: ገብርከ는 문맥상 “당신의 종”으로 유지할 수 있습니다. surety의 뜻은 “보증을 서다”가 자연스럽고 정확합니다. 마지막의 blame은 책임·책망의 의미를 함께 지니므로 “그 책임을 지겠습니다”는 허용되지만, 원문의 ‘아버지 앞에서’를 유지해야 합니다.
