base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/043/013.yaml
  text: And I[13], your slave, remain alone instead of the boy as a slave to my lord, and let the young man go with his brothers, for I became surety for him from the hand of your slave, our father. And if I do not bring him back, your slave will bear the blame before our father all our days.’
  footnotes:
  - marker: '13'
    text: 'This verse is compressed and somewhat irregular in the transmitted Ge''ez. The translation preserves the main sense: Judah offers himself in place of the boy and explains his obligation to his father.'
    reason: segmentation_note
  - marker: a
    text: Or 'became surety for the boy to my lord, so that the old man might live and the boy might remain with his brothers, because you entrusted him from his mother to your servant, our father, saying, ‘If I do not bring him back, your servant'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는, 당신의 종이므로, 그 소년 대신 홀로 남아 내 주님께 종이 되겠습니다. 젊은이는 자기 형제들과 함께 가게 하십시오. 내가 당신의 종인 우리 아버지의 손에서 그를 담보했기 때문입니다. 그리고 내가 그를 데려오지 못하면, 당신의 종은 우리 아버지 앞에서 평생 그 책임을 지겠습니다.’[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብርከ፡
  english_pob_choice: your slave
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 종이
  lexicon: δοῦλος / Ge'ez equivalent
  rationale: POB의 영어가 'your slave'를 유지하지만, 한국어 본문에서는 현대 문체의 자연스러움과 비하적 뉘앙스를 과도하게 강화하지 않으면서도 종속성을 분명히 하기 위해 '종'을 사용했습니다. 다만 주해/문맥상 예속성을 흐리지 않도록 동일 인물을 반복해 '당신의 종'으로 유지했습니다.
- source_word: ተሀበይክዎ፡
  english_pob_choice: I became surety for him
  chosen_korean: 그를 담보했습니다
  alternatives_korean:
  - 그를 보증했습니다
  - 그를 위해 보증인이 되었습니다
  lexicon: surety / guarantee
  rationale: 이 동사는 '대신 맡아 책임지다'는 보증·담보의 의미가 핵심이므로, 단순한 추측이나 약속보다 법적 책임이 드러나는 '담보하다'로 옮겼습니다.
- source_word: ይሌብከ፡
  english_pob_choice: will bear the blame
  chosen_korean: 그 책임을 지겠습니다
  alternatives_korean:
  - 비난을 받겠습니다
  - 책망을 감당하겠습니다
  lexicon: bear blame / responsibility
  rationale: 직역하면 '비난을 지다'이지만, 한국어에서 더 자연스럽고 문맥의 도덕적 책임을 분명히 드러내기 위해 '책임을 지다'로 옮겼습니다.
- source_word: ምስለ፡ አኀዊሁ፡
  english_pob_choice: with his brothers
  chosen_korean: 자기 형제들과 함께
  alternatives_korean:
  - 그의 형제들과 함께
  - 형제들과 함께
  lexicon: brothers
  rationale: 젊은이가 공동체 안으로 돌아가야 한다는 흐름을 살리기 위해 '자기 형제들과 함께'로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘slave’/‘종’ 표현의 유지
  chosen_reading: 본문의 예속 관계를 희석하지 않기 위해 호칭은 '종'으로 두고, 문맥상 반복되는 소속 관계를 그대로 드러냈습니다.
  alternative_readings:
  - '''종''을 ''일꾼''이나 ''시종''으로 완화'
  - '''노예''로 더 강하게 표기'
  rationale: 이 절은 자기희생과 책임 인수의 맥락이지만, 화자의 자기호칭과 주군-종 관계가 분명하므로 완화도 과장도 피해야 합니다. '종'은 현대 한국어에서 가장 무난하게 위계성과 소속을 함께 전달합니다.
  doctrine_reference: 서사적 예속 표현의 보존 및 문체 균형
- issue: 마지막 절의 책임 표현
  chosen_reading: '''우리 아버지 앞에서 평생 그 책임을 지겠습니다''로 옮겨, 단순한 감정이 아니라 언약적·가족적 책임을 강조했습니다.'
  alternative_readings:
  - '''우리 아버지 앞에서 평생 비난을 받겠습니다'''
  - '''우리 아버지 앞에서 평생 죄책을 짊어지겠습니다'''
  rationale: 히브리적/게에즈적 관용에서 'blame'은 공동체적 책임을 뜻하는 경우가 많으므로, 한국어에서도 도덕적·법적 책임을 함께 담는 표현을 선택했습니다.
  doctrine_reference: 보증 서약과 책임 귀속의 서사적 표현
