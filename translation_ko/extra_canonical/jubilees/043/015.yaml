    text: Or 'And he restrained himself,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 그는 더는 자신을 억제할 수 없어, 자신이 요셉이라고 그들에게 말했습니다. 그리고 그들과 히브리어로 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐገሦ
  english_pob_choice: And he could no longer restrain himself,
  chosen_korean: 더는 자신을 억제할 수 없어
  alternatives_korean:
  - 그는 자신을 억제했습니다
  - 그는 더 이상 참을 수 없었습니다
  lexicon: Source verb of self-restraint / holding back
  rationale: 게에즈 동사는 문자적으로는 ‘억제하다/참다’ 계열이며, 문맥상 형제들에게 정체를 밝히는 급박한 정서적 폭발을 자연스럽게 살리기 위해 ‘더는 자신을 억제할 수 없어’로 옮겼습니다.
- source_word: ከመ፡ ውእቱ፡ ዮሴፍ።
  english_pob_choice: that he was Joseph.
  chosen_korean: 자신이 요셉이라고
  alternatives_korean:
  - 그가 요셉이라고
  - 그 자신이 요셉이라고
  lexicon: Reported identity clause
  rationale: 직접화법의 내용임을 분명히 하면서 한국어 어순에 맞게 ‘자신이 요셉이라고’로 자연스럽게 정리했습니다.
- source_word: በከመ፡ ልሳነ፡ ዕብራይስጥ፡
  english_pob_choice: in the Hebrew language.
  chosen_korean: 히브리어로
  alternatives_korean:
  - 히브리 말로
  - 히브리어 언어로
  lexicon: Language expression
  rationale: ‘혀/언어’의 직역보다 한국어 관용 표현인 ‘히브리어로’가 본문의 의미를 정확하고 간결하게 전달합니다.
theological_decisions:
- issue: '이전 번역 전통과의 긴장: 게에즈 본문은 부정어 없이 ‘억제하였다’로 읽힐 수 있으나, 문맥은 억제 불능을 요구합니다.'
  chosen_reading: 본문의 서술 의도에 따라 ‘더는 자신을 억제할 수 없어’로 번역했습니다.
  alternative_readings:
  - 그는 자신을 억제했습니다
  - 그는 억제하고 말했습니다
  rationale: 형제들에게 신분을 밝히는 바로 앞뒤 문맥과 요셉 이야기의 평행(창세기 45장)에 비추어, 한국어 본문은 억제 불능의 의미를 드러내야 합니다. 이 선택은 게에즈의 간결한 서술을 문맥적으로 해석한 것입니다.
  doctrine_reference: 문맥 우선 원칙; 평행본문 조명
