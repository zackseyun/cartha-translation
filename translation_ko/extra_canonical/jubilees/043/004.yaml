    text: Or 'anything, whether silver or gold.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그들을 뒤쫓아 가서 이 말대로 그들에게 말했습니다. 그러자 그들이 그에게 말했습니다. "당신의 종들이 이런 일을 하는 것은 있을 수 없습니다. 또한 당신의 주인의 집에서 어떤 돈이나 금도 훔칠 수 없습니다. 전에 우리가 자루에서 찾아냈던 돈은 우리 종들이 아…[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሮጸ፡ ድኅሬሆሙ፡
  english_pob_choice: And he ran after them
  chosen_korean: 그가 그들을 뒤쫓아 가서
  alternatives_korean:
  - 그는 그들을 따라 달려가서
  - 그가 그들 뒤를 쫓아가서
  lexicon: 뒤쫓다
  rationale: 동작의 급박함을 살리면서도 현대 한국어에서 자연스럽게 ‘추격하다’의 의미를 전달하기 위해 ‘뒤쫓아 가다’를 택했습니다.
- source_word: በከመ፡ ዝንቱ፡ ነገር።
  english_pob_choice: according to this word
  chosen_korean: 이 말대로
  alternatives_korean:
  - 이런 말로
  - 이 말에 따라
  lexicon: 말대로
  rationale: Geez의 ‘이 말/이 표현에 따라’라는 구문을 간결한 합쇼체로 옮겨, 내용의 기준성을 분명히 했습니다.
- source_word: ሐሰ፡ ሎሙ፡ ለአግብርቲከ፡
  english_pob_choice: Far be it from your servants
  chosen_korean: 당신의 종들이 이런 일을 하는 것은 있을 수 없습니다
  alternatives_korean:
  - 당신의 종들이 이런 일을 할 리 없습니다
  - 당신의 종들로서는 결코 그런 일을 하지 않습니다
  lexicon: 종
  rationale: ‘아그브르티케’는 주인에게 속한 종들을 가리키므로, 프로젝트 기본어인 ‘종’을 유지하면서 한국어로는 금지·배척의 뉘앙스를 자연스럽게 살렸습니다.
- source_word: ንዋየ፡ ወወርቀኒ፡
  english_pob_choice: any money or gold
  chosen_korean: 어떤 돈이나 금도
  alternatives_korean:
  - 은이나 금도
  - 돈이든 금이든
  lexicon: 돈
  rationale: 개정 사유에 따라 Ge'ez의 ንዋየ를 ‘은’이 아니라 ‘돈/재물’ 계열로 옮겨, 문자상 ‘silver’로의 불필요한 조화를 피했습니다.
theological_decisions:
- issue: 주인/종 관계 표현
  chosen_reading: ‘당신의 종들’과 ‘당신의 주인의 집’을 그대로 살려, 사회적 소속과 권위 관계를 분명히 드러냈습니다.
  alternative_readings:
  - ‘당신의 종들’ 대신 ‘당신의 하인들’
  - ‘주인’ 대신 ‘주님’
  rationale: 본문은 가족적 친밀감이 아니라 소유·권위 구조를 전제하므로, 관계의 위계를 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 서사 문맥의 사회사적 정확성
