  yaml_path: translation/extra_canonical/jubilees/043/016.yaml
  text: And he embraced their necks and wept[16], but they did not recognize him, and they also wept. And he said to them,
  footnotes:
  - marker: '16'
    text: The clause 'they did not recognize him' may reflect either continued astonishment or delayed full recognition in the midst of Joseph's disclosure.
    reason: alternative_reading
translation:
  language: ko
  text: 그는 그들의 목을 끌어안고 울었습니다. 그러나 그들은 그를 알아보지 못했고[16], 그들도 울었습니다. 그리고 그는 그들에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '16'
    text: ‘그들이 그를 알아보지 못했다’는 말은 요셉이 자신을 밝히는 중에도 그들이 계속 놀랐다는 뜻일 수도 있고, 그들이 그를 완전히 알아보기까지 시간이 걸렸다는 뜻일 수도 있습니다.
    reason: alternative_reading
