translation:
  language: ko
  text: 그는 그들의 목을 끌어안고 울었습니다. 그러나 그들은 그를 알아보지 못했고, 그들도 울었습니다. 그리고 그가 그들에게 말했습니다.[16]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሐቀፈ፡ ክሳውዲሆሙ፡
  english_pob_choice: he embraced their necks
  chosen_korean: 그들의 목을 끌어안고
  alternatives_korean:
  - 그들의 목을 껴안고
  - 그들의 목을 포옹하고
  lexicon: ክሳውዲ / 목, ወሐቀፈ / 끌어안다
  rationale: 직역하되 한국어에서 자연스러운 신체적 친밀감을 살리기 위해 ‘목을 끌어안고’로 옮겼습니다.
- source_word: ወበከየ፡
  english_pob_choice: and wept
  chosen_korean: 울었습니다
  alternatives_korean:
  - 통곡했습니다
  - 울었고
  lexicon: በከየ / 울다
  rationale: 서술의 흐름을 유지하면서도 과장되지 않은 표준 현대어로 ‘울었습니다’를 선택했습니다.
- source_word: ኢያእመርዎ፡
  english_pob_choice: they did not recognize him
  chosen_korean: 그를 알아보지 못했고
  alternatives_korean:
  - 그를 알아보지 못하였고
  - 그를 알아차리지 못했고
  lexicon: አእመረ / 알아보다, 알아차리다
  rationale: 인물 인식의 부정을 가장 सीधे하게 드러내는 표현으로 ‘알아보지 못했고’를 택했습니다.
theological_decisions:
- issue: ‘they did not recognize him’의 의미 범위
  chosen_reading: 형식상으로는 단순한 비인식이지만, 서술 문맥상 충격·당혹으로 인한 즉각적 인지 실패까지 포괄할 수 있게 남겨 두었습니다.
  alternative_readings:
  - 계속된 놀라움으로 아직 알아보지 못했다
  - 완전히 알아보기 전의 지연된 인식이었다
  rationale: 영어 POB 주석이 인정하듯 문맥은 즉각적 미인지와 지연된 인식 가능성을 모두 열어 두므로, 한국어 본문도 단정적으로 해석을 좁히지 않았습니다.
  doctrine_reference: narrative ambiguity / source transparency
