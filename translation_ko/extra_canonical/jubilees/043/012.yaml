  to: 우리 아버지는 그 아이를 사랑하시며, 아버지의 생명은 그 아이의 생명에 매여 있습니다. 우리가 당신의 종인 우리 아버지께 갔을 때 그 아이가 우리와 함께 있지 않으면, 아버지는 죽으실 것이며,[b] 우리는 슬픔으로 우리 아버지를 괴롭게 하여 죽음에 이르게 할 것입니다.[a]
  rationale: 아버지와 아이의 생명을 명시적으로 구별하여 원문의 결속 관계를 보존했습니다. ‘그는 죽고 말 것이며’를 원문의 단순 미래에 맞추어 ‘아버지는 죽으실 것이며’로 고쳤고, ቀጽዐ의 고통을 가한다는 의미를 ‘괴롭게 하여’로 드러냈습니다. 각 감사용 대안 각주는 해당 절에 직접 연결되도록 앵커 위치도 바로잡았습니다.
