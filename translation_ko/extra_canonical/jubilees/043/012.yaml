  text: our father loves him, and his life is bound up with his life. And it will happen, when we go to your servant our father, if the boy is not with us, that he will die, and we will afflict our father with sorrow to death.
  footnotes:
  - marker: a
    text: Or 'we will bring down'.
    reason: previous_rendering
  - marker: b
    text: Or 'the old man will die'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리 아버지는 그를 사랑하시며, 그의 생명은 그의 생명에 매여 있습니다. 그리고 우리가 당신의 종인 우리 아버지에게 가서 그 아이가 우리와 함께 있지 않으면, 그는 죽고 말 것이며, 우리는 슬픔으로 우리 아버지를 죽음에 이르게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያፈቅሮ
  english_pob_choice: loves him
  chosen_korean: 그를 사랑하시며
  alternatives_korean:
  - 그를 사랑하며
  - 그를 사랑하고
  lexicon: ፈቅረ (love)
  rationale: 주어는 ‘우리 아버지’이고, 친족 맥락의 현재적 서술이므로 평서형 ‘사랑하시며’가 자연스럽고 원문 의미를 보존합니다.
- source_word: ወነፍሱኒ፡ እስርት፡ እምነፍስዝ
  english_pob_choice: his life is bound up with his life
  chosen_korean: 그의 생명은 그의 생명에 매여 있습니다
  alternatives_korean:
  - 그의 생명은 그의 생명과 하나로 묶여 있습니다
  - 그의 혼은 그의 혼과 얽혀 있습니다
  lexicon: ነፍስ (life, life-force) / እስረ (bind)
  rationale: ‘생명’은 본문의 중복 구조를 살리면서도 한국어로 자연스럽고, ‘매여 있습니다’는 결박된 상태를 직접 드러냅니다.
- source_word: ወሬዛ፡ ይመውት
  english_pob_choice: he will die
  chosen_korean: 그는 죽고 말 것이며
  alternatives_korean:
  - 그는 죽을 것이며
  - 그는 죽을 것입니다
  lexicon: ሞተ (die)
  rationale: 원문은 단순 미래 ‘죽다’이지만, 앞뒤 문맥상 아버지가 실제로 죽게 될 비극성을 살리기 위해 ‘죽고 말 것이며’로 옮겼습니다.
- source_word: ወንቀጽዕ፡ አባነ፡ በሐዘን፡ እስክ፡
  english_pob_choice: we will afflict our father with sorrow to death
  chosen_korean: 우리는 슬픔으로 우리 아버지를 죽음에 이르게 할 것입니다
  alternatives_korean:
  - 우리는 슬픔으로 우리 아버지를 괴롭게 할 것입니다
  - 우리는 슬픔으로 우리 아버지를 아프게 할 것입니다
  lexicon: ቀጽዐ (afflict, punish, chastise) / ሐዘን (sorrow)
  rationale: POB가 ‘we will afflict’로 수정한 동사를 따라 ‘죽음에 이르게 할 것입니다’로 옮겨, 단순 감정표현이 아니라 치명적 고통을 가하는 뜻을 반영했습니다.
theological_decisions:
- issue: ‘우리 아버지’와 ‘당신의 종’의 호칭 수준
  chosen_reading: 서술문은 현대 한국어의 존대 체계를 따라 ‘우리 아버지’, ‘당신의 종인 우리 아버지’로 유지했습니다.
  alternative_readings:
  - ‘우리의 아버지’
  - ‘당신의 종 우리 아버지’
  rationale: 원문은 가족 호칭과 예의 있는 자기비하를 함께 담고 있으므로, 과도하게 성서식 어법으로 굳히지 않고 관계의 긴장을 드러내는 표현을 택했습니다.
  doctrine_reference: 번역 스타일/화용론
- issue: ‘슬픔으로 … 죽음에 이르게 할 것입니다’의 강도
  chosen_reading: 직접적 우회어를 쓰지 않고 비극적 결과를 분명히 표현했습니다.
  alternative_readings:
  - ‘크게 슬프게 할 것입니다’
  - ‘마음 아프게 할 것입니다’
  rationale: 원문과 POB 수정안은 아버지가 슬픔 때문에 실제로 죽을 수 있음을 말하므로, 강도를 약화시키지 않는 것이 더 충실합니다.
  doctrine_reference: 서술 강도 보존
