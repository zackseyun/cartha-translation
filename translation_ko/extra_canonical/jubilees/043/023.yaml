  rationale: 영어 POB의 수정 이력과 주석이 이 표현을 창세기적 관용구로 읽고 있으므로, 오해를 줄이되 원문의 선물을 강조하는 쪽을 택했습니다.
  doctrine_reference: 창세기 45:22 평행본문
