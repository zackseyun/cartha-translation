translation:
  language: ko
  text: 그는 그들 모두에게 갈아입을 옷과 은을 주었습니다. 그리고 그들의 아버지에게도 옷과 은을 보냈습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅብር
  english_pob_choice: changes of garments
  chosen_korean: 갈아입을 옷
  alternatives_korean:
  - 옷의 변화
  - 다른 옷
  - 색다른 옷
  lexicon: Ge'ez ኅብር
  rationale: 문맥이 창세기 45:22의 관용구를 직접 반영하므로, 단순한 색채 묘사보다 ‘갈아입을 옷’이 의미를 가장 자연스럽고 정확하게 드러냅니다.
- source_word: አልባሰ
  english_pob_choice: garments
  chosen_korean: 옷
  alternatives_korean:
  - 의복
  - 겉옷
  lexicon: Ge'ez አልባስ
  rationale: 일반적인 의복을 가리키는 말이므로, 현대 한국어에서 가장 직관적인 ‘옷’으로 옮겼습니다.
- source_word: ብሩር
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은화
  - 은전
  lexicon: Ge'ez ብሩር
  rationale: 화폐 단위로 좁히지 않고 금속 자체를 가리키는 기본 의미를 살려 ‘은’으로 번역했습니다.
theological_decisions:
- issue: ‘changes of garments’의 관용구 처리
  chosen_reading: 색이 칠해진 옷이 아니라, 여러 벌로 갈아입을 수 있는 옷을 준 것으로 이해해 번역했습니다.
  alternative_readings:
  - 색깔 있는 옷
  - 다채로운 옷
  rationale: 영어 POB의 수정 이력과 주석이 이 표현을 창세기적 관용구로 읽고 있으므로, 오해를 줄이되 원문의 선물을 강조하는 쪽을 택했습니다.
  doctrine_reference: 창세기 45:22 평행본문
