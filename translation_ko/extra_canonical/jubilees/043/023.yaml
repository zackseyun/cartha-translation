translation:
  language: ko
  text: 그는 그들 모두에게 갈아입을 옷[a]과 은을 주었습니다. 또 그들의 아버지에게도 옷과 은을 보냈습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘갈아입을 옷’은 게에즈어 표현을 옮긴 것으로, ‘여러 종류의 옷’ 또는 ‘색깔 있는 옷’으로도 이해될 수 있습니다.
    reason: lexical_alternative
