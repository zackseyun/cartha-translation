theological_decisions:
- issue: ‘changes of garments’의 관용구 처리
  chosen_reading: 색이 칠해진 옷이 아니라, 여러 벌로 갈아입을 수 있는 옷을 준 것으로 이해해 번역했습니다.
  alternative_readings:
  - 색깔 있는 옷
