  text: over all the land of Egypt. And their father did not believe them, for his mind was stunned. But when he saw the wagons that Joseph had sent, the life of his spirit was renewed, and he said, "It is enough for me if Joseph is alive. I will go down and see him before I die."
translation:
  language: ko
  text: 온 이집트 땅에 걸쳐 있었습니다. 그들의 아버지는 마음이 멍해져서 그들을 믿지 않았습니다. 그러나 요셉이 보낸 수레들을 보고 나서 그의 영의 생명이 새로워졌고, 그는 말했습니다. "요셉이 살아 있기만 하면 내게는 충분합니다. 내가 죽기 전에 내려가 그를 보겠습니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዲበ፡ ኵሉ፡ ምድረ፡ ግብጽ
  english_pob_choice: over all the land of Egypt
  chosen_korean: 온 이집트 땅에 걸쳐
  alternatives_korean:
  - 이집트 온 땅에
  - 온 이집트 땅 전체에
  lexicon: 지리적 범위 표현
  rationale: Geez의 ዲበ ኵሉ는 범위를 덮는 뜻이므로, 한국어에서는 자연스럽게 ‘온 …에 걸쳐’로 옮겨 전체적 확장을 살렸습니다.
- source_word: ወአእምነ፡ አቡሆሙ
  english_pob_choice: their father did not believe them
  chosen_korean: 그들의 아버지는 … 그들을 믿지 않았습니다
  alternatives_korean:
  - 그들의 아버지는 믿지 않았습니다
  - 아버지는 그 말을 믿지 않았습니다
  lexicon: 문장 성분/지시대상
  rationale: 개정된 영어 본문이 ‘them’을 보강하듯, Geez의 문맥상 아버지가 아들들의 말을 믿지 않는다는 뜻을 분명히 하되 과도한 의역은 피했습니다.
- source_word: ተሐደሰት፡ ሕይወተ፡ መንፈሱ
  english_pob_choice: the life of his spirit was renewed
  chosen_korean: 그의 영의 생명이 새로워졌고
  alternatives_korean:
  - 그의 영의 생명이 회복되었고
  - 그의 마음이 되살아났고
  lexicon: literal-metaphorical overlap
  rationale: 직역하면 ‘영의 생명’이지만 한국어에서는 어색하지 않게 ‘새로워졌고’로 처리해, 내적 소생의 의미와 표현의 자연스러움을 함께 살렸습니다.
- source_word: ዐቢይ፡ ውእቱ፡ ሊተ፡ እመ፡ ዮሴፍ፡ ሕያው
  english_pob_choice: It is enough for me if Joseph is alive
  chosen_korean: 요셉이 살아 있기만 하면 내게는 충분합니다
  alternatives_korean:
  - 요셉이 살아 있기만 하면 족합니다
  - 요셉이 살아 있다면 그것으로 충분합니다
  lexicon: idiomatic sufficiency
  rationale: Geez의 ‘크다/충분하다’ 계열 표현을 한국어의 자연스러운 충분성 진술로 옮기되, 조건절의 의미를 유지했습니다.
theological_decisions:
- issue: ‘영’과 내적 생명의 표현
  chosen_reading: ‘영의 생명’은 단순 감정 변화가 아니라 인물의 내적 생기 회복을 가리키는 표현으로 보아 그대로 살렸습니다.
  alternative_readings:
  - ‘마음이 되살아났고’로 더 자연화
  - ‘기운이 회복되었고’로 완화
  rationale: 본문은 외적 안도보다 인물 내부의 생명력이 되살아나는 장면을 강조하므로, 영적-내적 차원을 약화시키지 않는 번역을 택했습니다.
  doctrine_reference: 문학적-서사적 인물 묘사
- issue: 아버지가 ‘그들을 믿지 않았다’는 진술
  chosen_reading: 아버지는 아들들의 보고를 믿지 않았다는 의미를 분명히 하여, 대상이 암시되는 영어 보강을 한국어 본문 안에 자연스럽게 반영했습니다.
  alternative_readings:
  - 대상을 생략해 ‘믿지 않았습니다’만 번역
  - ‘그 말을 믿지 않았습니다’로 명시
  rationale: Geez와 수정된 영어 둘 다 문맥상 복수의 아들들을 가리키므로, 의미를 흐리지 않도록 대상을 밝혔습니다.
  doctrine_reference: 문맥 명료화
- issue: 직접화법의 정서
  chosen_reading: 직접화법은 서술체와 같은 합쇼체를 유지하되, 요셉의 생존만으로 충분하다는 긴급한 확신을 드러내도록 했습니다.
  alternative_readings:
  - 더 경건한 어조로 완화
  - 감탄문으로 재구성
  rationale: 원문은 신앙 고백보다 가족 상봉의 절실함을 담으므로, 장엄화하지 않고 서사적 톤을 유지했습니다.
  doctrine_reference: 서사 문체 보존
