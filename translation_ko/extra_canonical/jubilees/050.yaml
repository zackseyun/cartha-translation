base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/050.yaml
  text: '1[v.4]. And after this I made known to you the law of the days of the sabbaths on Mount Sinai, which is between Elim and Sinai.

    2. And I told you about the sabbaths of the land on Mount Sinai, and the years of the jubilees I told you among the sabbaths of years; but the year of it I did not tell you until the time when you enter the land that you are to possess.

    3. And the land will keep its sabbaths while they dwell upon it, and they will know the year of the jubilee[v.4].

    4. Therefore I have ordained for you the weeks of years and the years and the jubilees: forty-nine jubilees from the days of Adam until this day, and one week and two years and still forty years remain for learning the commandments of the LORD, until they cross over into the land of Canaan, crossing the Jordan to its west.

    5. And the jubilees will pass by until Israel is cleansed from all guilt of fornication and uncleanness and pollution and sin and error, and dwells in all the land in confidence; and there will no longer be for them any satan or any evil one, and the land will be clean from that time and forever.

    6. And behold, I have written for you the command concerning the sabbaths, and all the judgments of its laws.

    7. Six days you shall do work, but the seventh day is a sabbath of the LORD your God. You shall do no work on it—you and your sons and your male servants and your female servants and all your animals and also the resident foreigner who is with you.

    8. And the man who does any work on it shall die—every man who defiles this day, or who lies with a woman, or who says he will do some matter on it so as to do business concerning all buying and selling, or who draws water on it that he had not prepared for himself on the sixth day, or who lifts any burden to carry it out from his tent or from his house—shall die.

    9. You shall do no work at all on the sabbath day except what you have prepared for yourselves on the sixth day, to eat and to drink and to rest and to keep sabbath from all work on this day, and to bless the LORD your God, who has given you a day of festival and a holy day and a holy day of kingship for all Israel—this day throughout their generations forever.

    10. For great is the honor that the LORD has given to Israel: to eat and to drink and to be satisfied on this festival day, and to rest on it from all work belonging to the labor of the children of men, except burning incense and bringing an offering and sacrifice before the LORD for the days and for the sabbaths.

    11. This alone shall be done on the sabbath days in the house of the sanctuary of the LORD your God, so that they may make atonement for Israel continually, day by day, as a memorial well-pleasing before the LORD, and he will receive them forever, day after day, according as you were commanded.

    12. And every person who does work on it, or goes on a journey, or tills his farm, whether in his house or in any place, or kindles a fire, or rides on any animal, or travels by ship on the sea, or strikes or kills anything, or slaughters an animal or a bird, or catches a wild beast or a bird or a fish, or fasts, or makes war on the sabbath day—

    13. the person who does any of these things on the sabbath day shall die, so that the children of Israel may keep the commandments of the sabbaths of the land[v.13][v.12][v.11][v.9][v.8], as it is written on the tablets that he gave into my hands so that I might write for you the laws of each appointed time according to the divisions of its days.'
  footnotes:
  - marker: v.4
    text: 'The chronological statement is dense and may reflect segmented units: ''forty-nine jubilees ... and one week and two years and still forty years remain.'' The translation preserves the sequence rather than smoothing it into a reconstructed total.'
    reason: segmentation_note
  - marker: v.4
    text: The final phrase likely means crossing the Jordan into Canaan on its western side; the Ethiopic wording is compressed.
    reason: lexical_alternative
  - marker: v.8
    text: The clause rendered 'buying and selling' comes from a difficult Ethiopic expression after 'who says he will do some matter on it.' The sense appears to concern planning or conducting business on the sabbath.
    reason: textual_variant
  - marker: v.9
    text: '''Holy day of kingship'' is a literal rendering of an unusual phrase. It may denote the sabbath''s royal dignity under God''s rule rather than a separate festival category.'
    reason: lexical_alternative
  - marker: v.11
    text: The phrase translated 'make atonement for Israel continually, day by day' is somewhat compressed in Ethiopic; the sense is ongoing cultic memorial and acceptance before the LORD.
    reason: segmentation_note
  - marker: v.12
    text: The verb rendered 'travels by ship on the sea' could also carry a commercial nuance ('does business by sea'). The broader travel sense fits the surrounding list of sabbath prohibitions.
    reason: lexical_alternative
  - marker: v.13
    text: The closing phrase 'according to the divisions of its days' preserves Jubilees's characteristic concern for ordered sacred times and calendrical partition.
    reason: cross_reference
translation:
  language: ko
  text: '1[4절]. 그 후에 내가 엘림과 시내 산 사이에 있는 시내 산에서 안식일의 규례를 너희에게 알게 하였느니라. 2. 내가 시내산 땅의 안식일과 안식년 중 희년을 너희에게 말하였노니 그러나 그 해는 너희가 차지할 땅에 들어갈 때까지 내가 너희에게 이르지 아니하였느니라. 3. 그 땅은 그들이 거기 거주하는 동안 안식일을 지키며 희년의 해를 알리라(4절). 4. 그러므로 내가 너희를 위하여 해와 해와 희년을 정하였나니 아담의 때부터 오늘까지 사십구 희년을 정하였으니 그들이 서쪽으로 요단을 건너 가나안 땅에 들어갈 때까지 주님의 계명을 배우는 데는 일 이레와 사십 년이 남았느니라. 5. 희년은 이스라엘이 모든 음행과 더러움과 오염과 죄와 오류에서 정결함을 받고 온 땅에 확신 가운데 거할 때까지 지나갈 것임이니라 그리고 더 이상 사탄이나 악한 자가 그들에게 있지 않을 것이며, 땅은 그때부터 영원히 깨끗할 것입니다. 6. 보라, 내가 너희를 위하여 안식일에 관한 계명과 그 규례의 모든 규례를 기록하였느니라. 7. 엿새 동안은 너희가 일할 것이나 일곱째 날은 너희 하나님 주님의 안식일인즉 너와 네 아들들과 남종들과 여종들과 네 모든 가축과 너와 함께 있는 외국인도 아무 일도 하지 말라. 8. 그 일을 하는 모든 남자는 죽을지니, 오늘 부정한 남자나 여자와 동침하는 자나 매매에 관하여 장사하기 위하여 이 물건을 하겠다고 말하는 자나 여섯째 날에 자기를 위하여 준비하지 아니한 물을 길는 자나 장막에서나 집에서 짐을 옮기는 자는 죽을지니라. 9. 안식일에는 너희가 자기를 위하여 준비한 것 외에는 아무 일도 하지 말찌니 곧 너희가 이 날에 먹고 마시고 쉬며 안식하여 모든 일을 하여 안식일을 지켜 너희 하나님 주님를 송축하게 하려 하심이니라 저가 너희에게 온 이스라엘을 위하여 절기 곧 성일, 왕이 되는 날을 대대로 지킬 절일과 성일, 왕이 되는 날을 이 날로 주셨느니라. 10. 주님께서 이스라엘에게 주신 영광이 크도다 이 명절에 먹고 마시고 배부르게 하고 그 날과 안식일을
    위하여 주님 앞에 분향하며 예물과 희생을 드리는 것 외에는 사람의 자손의 모든 수고를 쉬게 하였느니라. 11. 안식일에 네 하나님 주님의 전에서 이 일만 할찌니 이는 그들이 날마다 이스라엘을 위하여 항상 속죄하여 주님 앞에 아름다운 기념을 삼으시는 것이니라 너희가 명령하신 대로 주님께서 그것을 날마다 영원히 받으시리라 12. 안식일에 일하는 자, 여행하는 자, 집에서나 어느 곳에서나 밭을 가는 자, 불을 피우는 자, 짐승을 타는 자, 바다에서 배를 타고 여행하는 자, 무엇이든 쳐서 죽이는 자, 짐승이나 새를 잡는 자, 들짐승이나 새나 물고기를 잡는 자, 금식하는 자, 안식일에 전쟁하는 자,

    13. 안식일에 이런 일을 하는 자는 죽으리니 이는 이스라엘 자손이 이 땅의 안식일의 계명을 지키게 하려 함이라 그가 내 손에 주신 판에 기록한 대로 내가 너희를 위하여 날의 구분에 따라 각 시기의 율례를 기록하게 하려 하였느니라'
