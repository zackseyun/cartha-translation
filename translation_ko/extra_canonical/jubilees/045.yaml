base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/045.yaml
  text: '1[2]. And Israel entered the land of Egypt, into the land of Goshen, at the new moon of the fourth month.

    2. It was in the second year of the third week of the forty-second jubilee. And Joseph came to receive his father Jacob in the land of Goshen, and he embraced his father''s neck and wept.

    3. And Israel said to Joseph, "Now let me die, since I have seen you; and now may the LORD, the God of Israel, the God of Abraham and the God of Isaac[9], be blessed—he who has not withheld mercy and compassion

    4. from his servant Jacob. Great for me is this, that I have seen your face while I am still alive, because the vision that I saw at Bethel was truly established. May the LORD my God be blessed forever and ever, and blessed be his name."

    5. And Joseph and his brothers ate bread before their father, and they drank wine. And Jacob rejoiced with very great joy because he saw Joseph eating with his brothers and drinking before him. And he blessed the Creator of all, who had preserved him and had preserved for him his twelve sons.

    6. And Joseph gave his father and his brothers a possession so that they might dwell in the land of Goshen, and in Rameses and all its territory that was under Pharaoh''s authority before him. And Israel and his sons settled in the land of Goshen, the best part of the land of Egypt. And Israel was one hundred and thirty years old when he entered Egypt.

    7. And Joseph sustained his father and his brothers, and he provided for them and all that was theirs, as was sufficient for them during the seven years of famine.

    8. And the land of Egypt suffered because of the famine, and Joseph acquired all the land of Egypt for Pharaoh in exchange for grain, and their people and their livestock and everything became Pharaoh''s property.

    9. And the years of famine were completed, and Joseph gave the people who were in the land seed and food, so that they might sow the land in the seventh year, because the river had filled all the land of Egypt.

    10. For during the seven years of famine it had not overflowed and had not risen, except in a few places by the banks of the river; but now it overflowed, and Egypt sowed the land and gathered very much grain in that year.

    11. And that year was the first year of the fourth week of the forty-fourth jubilee.

    12. And Joseph took a fifth of everything that was produced for the king, and four parts he left to them for food and for seed.

    13. And Joseph made it an ordinance for the land of Egypt to this day. And Israel lived in the land of Egypt seventeen years, and all the days that he lived were three jubilees, one hundred and forty-seven years. And he died in the fourth year of the fifth week of the forty-fifth jubilee.

    14. And before he died, Israel blessed his sons and told them everything that would happen to them in the land of Egypt and in later days, as it would come upon them.

    15. And he blessed them, and he gave Joseph a double portion in the land. And he slept with his fathers and was buried in the double cave in the land of Canaan, near Abraham his father,

    16. in the tomb which he had dug for himself in the double cave in the land of Hebron. And he gave all his books and the books of his fathers to Levi his son[16][15][11], so that he might preserve them and renew them for his children until this day.'
  footnotes:
  - marker: '2'
    text: The Ge'ez text literally reads 'forty-second' (፵ወ፪), though the internal chronology of Jubilees requires this to be the forty-fifth jubilee.
    reason: textual_variant
  - marker: '9'
    text: The clause 'in the seventh year' is textually and contextually difficult. It may reflect the year following the seven-year famine, or a segmentation issue in the extracted row.
    reason: segmentation_note
  - marker: '11'
    text: The chronological notice appears difficult against the chapter's earlier dating formulas. The Ethiopic text is translated as given, but the jubilee numbering may reflect a textual problem or corruption in transmission.
    reason: textual_variant
  - marker: '15'
    text: Literally 'the double cave.' This corresponds to the ancestral burial cave known elsewhere as Machpelah.
    reason: cross_reference
  - marker: '16'
    text: '''Renew them'' may imply preserving the books by recopying, restoring, or transmitting them afresh to later generations.'
    reason: lexical_alternative
translation:
  language: ko
  text: '1[2]. 그리고 이스라엘은 넷째 달 초승달에 이집트 땅, 고센 땅에 들어갔습니다.

    2. 때는 마흔두째 희년 셋째 주일 둘째 해였습니다. 요셉이 고센 땅에 와서 그의 아버지 야곱을 영접하고 그의 아버지의 목을 끌어안고 울었더라.

    3. 이스라엘이 요셉에게 이르되 내가 너를 보았으니 이제 죽기를 원하노라 이스라엘의 하나님, 아브라함의 하나님, 이삭의 하나님 주님는 찬송을 받으실찌니 곧 긍휼과 긍휼을 아끼지 아니하시는 이에게로다

    4. 그의 종 야곱에게서. 내가 살아 있는 동안에 당신의 얼굴을 뵙게 된 것은 나에게 좋은 일입니다. 내가 벧엘에서 본 환상은 참으로 이루어졌기 때문입니다. 나의 하나님 주님는 영원무궁토록 찬송을 받으실지니 그의 이름이 찬송을 받으실지니이다''

    5. 요셉과 그의 형제들은 아버지 앞에서 빵을 먹고 포도주를 마셨습니다. 야곱은 요셉이 형들과 함께 먹고 자기 앞에서 마시는 것을 보고 심히 기뻐하니라. 그리고 그는 자신을 보호하시고 그를 위해 열두 아들을 보존해 주신 만물의 창조주를 찬양했습니다.

    6. 요셉은 그의 아버지와 형들에게 기업을 주어 고센 땅과 라암셋과 자기 앞에서 바로의 통치하에 있던 그 모든 지역에 거주하게 하였더라. 그리고 이스라엘과 그의 아들들은 이집트 땅의 가장 좋은 곳인 고센 땅에 정착했습니다. 이스라엘이 애굽에 들어갈 때에 나이가 백삼십 세였더라.

    7. 요셉은 자기 아버지와 형들을 부양하여 그들과 그들의 모든 소유를 식량으로 삼아 일곱 해 흉년 동안에 그들에게 풍족하였더라.

    8. 애굽 땅이 기근으로 어려움을 당하매 요셉이 곡식을 주고 바로를 위하여 애굽 온 땅을 얻었고 그들의 백성과 가축과 모든 것이 바로의 소유가 되었더라

    9. 흉년이 그치매 요셉이 그 땅 백성에게 종자와 양식을 주어 그들이 일곱째 해에 그 땅에 파종하게 하였으니 이는 강이 애굽 온 땅에 가득하였음이니라

    10. 일곱 해 동안 흉년이 들 때에도 강 가 몇 군데 외에는 흉년이 넘치지 않았고, 기근도 자라지 않았습니다. 그러나 이제 물이 넘쳐 이집트는 그 땅에 씨를 뿌리고 그 해에 매우 많은 곡식을 거두었습니다.

    11. 그리고 그 해는 마흔넷째 희년의 넷째 주의 첫째 해였습니다.

    12. 요셉은 왕을 위해 생산된 모든 것의 5분의 1을 가져갔고, 4부분은 음식과 종자로 그들에게 남겨 두었습니다.

    13. 요셉이 이를 애굽 땅의 규례로 삼았더니 오늘까지 이르느니라 이스라엘이 애굽 땅에 십칠년을 거주하였으니 그가 삼 희년을 삼아 일백사십칠년을 살았더라. 그리고 그는 마흔다섯째 희년 다섯째 주 넷째 해에 죽었습니다.

    14. 그가 죽기 전에 이스라엘은 그의 아들들을 축복하고 애굽 땅에서와 후일에 그들에게 당할 모든 일을 그들에게 고하였더라.

    15. 그리고 그분은 그들에게 축복하시고 그 땅에서 요셉에게 두 배의 몫을 주셨습니다. 그가 그의 조상들과 함께 자매 가나안 땅 그의 아버지 아브라함의 곁에 있는 막힌 굴에 장사되니라

    16. 그 무덤은 그가 헤브론 땅에 있는 두 굴에 자기를 위하여 판 무덤이라. 그리고 자기의 모든 책과 자기 조상의 책을 자기 아들 레위에게 주니, 이는 그가 그것을 보존하고, 자기 자손을 위하여 오늘까지 새롭게 하려 하였음이라.'
