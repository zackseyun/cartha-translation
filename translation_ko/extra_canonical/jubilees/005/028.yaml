  text: And the ark went and came to rest on the summit of Lubar, one of the mountains of Ararat.
translation:
  language: ko
  text: 그리고 그 방주가 가서 아라랏 산들 가운데 하나인 루바르 꼭대기에 머물렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረት ... ወአዕረፈት
  english_pob_choice: And the ark went and came to rest
  chosen_korean: “가서 … 머물렀습니다”
  alternatives_korean:
  - 가고 쉬었습니다
  - 가서 내려앉았습니다
  lexicon: 동사 어휘
  rationale: Geez의 연속 동사 ‘went’와 ‘came to rest’를 자연스럽게 살리되, 방주가 최종적으로 정지했다는 뜻을 분명히 하기 위해 ‘머물렀습니다’를 택했습니다.
- source_word: '*ዲበ፡ ርእሰ፡ ሉባር'
  english_pob_choice: on the summit of Lubar
  chosen_korean: “루바르 꼭대기에”
  alternatives_korean:
  - 루바르 정상에
  - 루바르 산꼭대기에
  lexicon: 지리 표현
  rationale: ‘summit’의 핵심 이미지를 직역에 가깝게 살려 ‘꼭대기’로 옮겼으며, 지명 루바르를 그대로 유지했습니다.
- source_word: አሐዱ፡ እምአድባረ፡ አራራት
  english_pob_choice: one of the mountains of Ararat
  chosen_korean: “아라랏 산들 가운데 하나인”
  alternatives_korean:
  - 아라랏의 산들 중 하나인
  - 아라랏 산들 중 하나인
  lexicon: 관계 표현
  rationale: Geez의 ‘하나’를 포함한 소속 관계를 한국어에서도 분명히 드러내기 위해 ‘가운데 하나인’으로 옮겼습니다.
