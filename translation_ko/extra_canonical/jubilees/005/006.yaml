- source_word: ብሕትዋን
  english_pob_choice: separated
  chosen_korean: 서로 분리되어 있습니다
  alternatives_korean:
  - 분리되어 있습니다
  - 고립되어 있습니다
  lexicon: 분리되다
  rationale: 끝의 상태 서술을 ‘separated’에 맞춰 재현하되, 앞뒤 관계가 분명하도록 ‘서로’를 보충했습니다.
theological_decisions:
- issue: 우주적 반란 천사들에 대한 심판 서술
  chosen_reading: 본문은 하나님이 반항한 천사들에게 분노하시고 그 권세를 박탈한 뒤, 땅의 깊은 곳에 결박하도록 명하신 것으로 옮겼습니다.
  alternative_readings:
  - 천사들이 스스로 권세를 잃었다는 중립적 표현
  - ‘땅의 깊은 곳’의 비유적 의미를 약화한 표현
  rationale: 게제스 본문의 심판적·구속사적 톤을 유지해야 하므로, 주체가 하나님이라는 점과 천사들의 실제 결박 상태를 분명히 드러냈습니다.
  doctrine_reference: 2 Peter 2:4; Jude 6의 유사한 타락 천사 결박 전통
