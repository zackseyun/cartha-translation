  text: And against his angels whom he had sent to the earth he was exceedingly angry[a], so as to strip them of all their dominion; and he told us to bind them in the depths of the earth, and behold, they are bound within them and separated.
  footnotes:
  - marker: a
    text: The first-person plural 'he told us' reflects the revelatory frame of Jubilees, in which the angelic mediator recounts divine actions. The verse likely refers to the binding of the offending angels in the subterranean depths.
    reason: cross_reference
    anchor_ref: '5:6'
  - marker: b
    text: Or 'angry, to strip them'.
    reason: previous_rendering
  - marker: c
    text: Or 'in their midst'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 땅으로 보낸 자기의 천사들에 대해 매우 분노하셔서 그들의 모든 통치권을 빼앗아 버리게 하셨고, 그들을 땅의 깊은 곳에 묶으라고 우리에게 말씀하셨습니다. 보십시오, 그들은 그 속에 묶여 있으며 서로 분리되어 있습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእክቲሁ
  english_pob_choice: his angels
  chosen_korean: 자기의 천사들
  alternatives_korean:
  - 그의 천사들
  - 하나님의 천사들
  lexicon: 천사
  rationale: 주어의 소유 관계를 그대로 살리되, 문맥상 하나님을 가리키는 것으로 보이는 ‘his’는 ‘자기의’로 옮겨 자연스럽고 과도한 해석을 피했습니다.
- source_word: ተምዐ ፈድፋደ
  english_pob_choice: he was exceedingly angry
  chosen_korean: 매우 분노하셔서
  alternatives_korean:
  - 몹시 노하셔서
  - 극도로 진노하셔서
  lexicon: 분노하다
  rationale: 강한 분노를 나타내되 현대 합쇼체 문맥에서 자연스러운 ‘매우 분노하셔서’로 옮겼습니다.
- source_word: ይሠርዎሙ
  english_pob_choice: strip them of all their dominion
  chosen_korean: 그들의 모든 통치권을 빼앗아 버리게 하셨고
  alternatives_korean:
  - 그들의 모든 지배권을 벗겨내게 하셨고
  - 그들의 모든 권세를 빼앗으라고 하셨고
  lexicon: 권세/통치권
  rationale: 기계적으로 ‘uproot’처럼 만들지 않고, 수정된 POB의 ‘strip them of all their dominion’에 맞게 권한 박탈의 의미를 분명히 드러냈습니다.
- source_word: ንእስሮሙ ውስተ መዓምቅቲሃ ለምድር
  english_pob_choice: bind them in the depths of the earth
  chosen_korean: 그들을 땅의 깊은 곳에 묶으라고
  alternatives_korean:
  - 그들을 땅의 깊은 곳에 결박하라고
  - 그들을 땅의 심연에 묶으라고
  lexicon: 묶다/결박하다
  rationale: ‘bind’의 직접성을 살리되, 지하 심연의 장소성을 ‘땅의 깊은 곳’으로 옮겨 과장 없이 표현했습니다.
- source_word: ብሕትዋን
  english_pob_choice: separated
  chosen_korean: 서로 분리되어 있습니다
  alternatives_korean:
  - 분리되어 있습니다
  - 고립되어 있습니다
  lexicon: 분리되다
  rationale: 끝의 상태 서술을 ‘separated’에 맞춰 재현하되, 앞뒤 관계가 분명하도록 ‘서로’를 보충했습니다.
theological_decisions:
- issue: 우주적 반란 천사들에 대한 심판 서술
  chosen_reading: 본문은 하나님이 반항한 천사들에게 분노하시고 그 권세를 박탈한 뒤, 땅의 깊은 곳에 결박하도록 명하신 것으로 옮겼습니다.
  alternative_readings:
  - 천사들이 스스로 권세를 잃었다는 중립적 표현
  - ‘땅의 깊은 곳’의 비유적 의미를 약화한 표현
  rationale: 게제스 본문의 심판적·구속사적 톤을 유지해야 하므로, 주체가 하나님이라는 점과 천사들의 실제 결박 상태를 분명히 드러냈습니다.
  doctrine_reference: 2 Peter 2:4; Jude 6의 유사한 타락 천사 결박 전통
