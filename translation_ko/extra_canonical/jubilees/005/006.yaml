  lexicon: 권세/통치권
  rationale: 기계적으로 ‘uproot’처럼 만들지 않고, 수정된 POB의 ‘strip them of all their dominion’에 맞게 권한 박탈의 의미를 분명히 드러냈습니다.
- source_word: ንእስሮሙ ውስተ መዓምቅቲሃ ለምድር
  english_pob_choice: bind them in the depths of the earth
  chosen_korean: 그들을 땅의 깊은 곳에 묶으라고
  alternatives_korean:
  - 그들을 땅의 깊은 곳에 결박하라고
  - 그들을 땅의 심연에 묶으라고
  lexicon: 묶다/결박하다
