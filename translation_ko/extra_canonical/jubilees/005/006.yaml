  lexicon: 천사
  rationale: 주어의 소유 관계를 그대로 살리되, 문맥상 하나님을 가리키는 것으로 보이는 ‘his’는 ‘자기의’로 옮겨 자연스럽고 과도한 해석을 피했습니다.
- source_word: ተምዐ ፈድፋደ
  english_pob_choice: he was exceedingly angry
  chosen_korean: 매우 분노하셔서
  alternatives_korean:
