  - 극도로 진노하셔서
  lexicon: 분노하다
  rationale: 강한 분노를 나타내되 현대 합쇼체 문맥에서 자연스러운 ‘매우 분노하셔서’로 옮겼습니다.
- source_word: ይሠርዎሙ
  english_pob_choice: strip them of all their dominion
  chosen_korean: 그들의 모든 통치권을 빼앗아 버리게 하셨고
  alternatives_korean:
