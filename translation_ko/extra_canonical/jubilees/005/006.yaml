revisions:
- from: 그리고 그가 땅으로 보낸 자기의 천사들에 대해 매우 분노하셔서 그들의 모든 통치권을 빼앗아 버리게 하셨고, 그들을 땅의 깊은 곳에 묶으라고 우리에게 말씀하셨습니다. 보십시오, 그들은 그 속에 묶여 있으며 서로 분리되어 있습니다.[a]
  to: 그리고 그분께서는 땅에 보내신 자신의 천사들에게 몹시 분노하셔서 그들의 모든 권세를 빼앗으셨으며, 그들을 땅의 깊은 곳에 묶으라고 우리에게 말씀하셨습니다.[a] 보십시오, 그들은 그곳에 묶여 있고 분리되어 있습니다.
  rationale: 직접적 권세 박탈을 사역형 없이 옮기고, 원문에 명시되지 않은 ‘서로’를 제거했습니다. 또한 존대 문체와 장소 지시를 자연스럽게 다듬었으며, 기존 주석의 설명적 기능은 유지했습니다.
