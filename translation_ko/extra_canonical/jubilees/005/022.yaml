  text: And Noah made the ark in every respect as He commanded him, in the twenty-sixth jubilee of years, in the fifth week, in the fifth year.
  footnotes:
  - marker: a
    text: Or 'as he had been commanded'.
    reason: previous_rendering
translation:
  language: ko
  text: 노아는 스물여섯 번째 희년의 다섯째 주, 다섯째 해에 하나님께서 그에게 명령하신 대로 모든 면에서 방주를 만들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገብረ፡ ... ታቦተ፡
  english_pob_choice: made the ark
  chosen_korean: 방주를 만들었습니다
  alternatives_korean:
  - 방주를 지었습니다
  - 방주를 세웠습니다
  lexicon: ታቦተ፡ → 방주
  rationale: 방주의 제작 행위를 자연스럽게 드러내면서도, 성경 서술에서 익숙한 ‘방주’를 유지했습니다.
- source_word: በኵሉ፡
  english_pob_choice: in every respect
  chosen_korean: 모든 면에서
  alternatives_korean:
  - 완전히
  - 전부
  - 모든 일에
  lexicon: በኵሉ፡ → in every respect / wholly
  rationale: 행동의 전면적 순종을 뜻하는 표현으로, 단순한 양적 ‘전부’보다 문맥상 더 정확한 ‘모든 면에서’를 선택했습니다.
- source_word: በከመ፡ አዘዞ፡
  english_pob_choice: as He commanded him
  chosen_korean: 하나님께서 그에게 명령하신 대로
  alternatives_korean:
  - 그에게 명령하신 대로
  - 명령받은 대로
  lexicon: አዘዞ፡ → 명령하셨다
  rationale: 주어가 분명히 하나님임을 살려 수동적으로 완화하지 않고, 명령의 주체를 명시했습니다.
- source_word: በ*ዕሥራ፡ ወስድስቱ፡ *ኢዮቤልው፡ ዓመታት፡
  english_pob_choice: in the twenty-sixth jubilee of years
  chosen_korean: 스물여섯 번째 희년
  alternatives_korean:
  - 스물일곱 번째 희년
  - 26번째 희년
  lexicon: '*ዕሥራ፡ ወስድስቱ፡ → twenty-sixth'
  rationale: 소스와 수정 이력을 따라 희년 수를 스물여섯 번째로 반영했습니다.
- source_word: በኃምስ፡ ሱባዔ፡ በኃምስ፡ ዓመት።
  english_pob_choice: in the fifth week, in the fifth year
  chosen_korean: 다섯째 주, 다섯째 해
  alternatives_korean:
  - 다섯 번째 주, 다섯 번째 해
  - 제5주, 제5년
  lexicon: ሱባዔ፡ / ዓመት፡ → week / year
  rationale: 희년 문맥의 연대 표기를 한국어로 옮기되, 달력적 ‘주’와 ‘해’의 평행 구조를 유지했습니다.
theological_decisions:
- issue: 명령의 주체를 수동형으로 완화할지 여부
  chosen_reading: 하나님께서 그에게 명령하신 대로
  alternative_readings:
  - 그에게 명령하신 대로
  - 명령받은 대로
  rationale: 지시동사 አዘዞ의 능동성과 명령 주체를 분명히 하여, 본문이 드러내는 하나님의 직접 명령을 보존했습니다.
  doctrine_reference: 본문의 서술 구조와 행위 주체 명시
