  text: And the fountains of the deep also sent up waters until the whole world was full of water.
translation:
  language: ko
  text: 그리고 깊은 샘들도 물을 솟아올려서 온 세상이 물로 가득 찰 때까지 이르렀습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንቅዐተ፡ ቀላይሂ፡
  english_pob_choice: the fountains of the deep
  chosen_korean: 깊은 샘들
  alternatives_korean:
  - 깊은 곳의 샘들
  - 심연의 샘들
  - 바닷속 샘들
  lexicon: Geez source phrase referring to the subterranean/deep springs
  rationale: POB의 ‘the fountains of the deep’를 따라, 지하의 깊은 물의 근원을 자연스러운 한국어로 간결하게 옮겼습니다. ‘심연’은 의미는 가깝지만 문맥상 과도하게 시적일 수 있어 보류했습니다.
- source_word: ያዐርጉ፡
  english_pob_choice: sent up
  chosen_korean: 물을 솟아올려서
  alternatives_korean:
  - 물을 올려서
  - 물을 끌어올려서
  - 물을 내보내어
  lexicon: Geez verb of rising/upward sending
  rationale: ‘sent up waters’의 상향 운동을 살려 ‘솟아올려서’로 옮겼습니다. 단순히 ‘나아갔다’고 하면 원문의 동적 이미지를 약화시킵니다.
- source_word: መልአ፡ *ኵሉ፡ ዓለም፡ ማየ።
  english_pob_choice: until the whole world was full of water
  chosen_korean: 온 세상이 물로 가득 찰 때까지
  alternatives_korean:
  - 온 세상이 물로 차기까지
  - 온 세계가 물로 가득할 때까지
  - 온 땅이 물로 덮일 때까지
  lexicon: Geez clause of completion and totality
  rationale: ‘whole world’의 총체성을 살리되, 한국어에서 자연스러운 완료 표현인 ‘가득 찰 때까지’로 처리했습니다. ‘덮일’은 홍수의 결과를 설명하지만 본문의 충만 이미지가 약해집니다.
theological_decisions:
- issue: 홍수의 총체적 범위
  chosen_reading: ‘온 세상’으로 옮겨, 물이 지면 일부가 아니라 세계 전체를 채웠다는 총체성을 드러냈습니다.
  alternative_readings:
  - ‘온 땅’
  - ‘온 세계’
  rationale: 게에즈 원문의 *ኵሉ፡ ዓለም*은 단순한 지역적 범위를 넘어 전면적 충만을 강조하므로, 한국어에서도 그 포괄성을 유지하는 번역이 적절합니다.
  doctrine_reference: 창세기 홍수 서술의 보편적 심판 모티프
