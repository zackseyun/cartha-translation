  text: 그러나 노아만이 주의 눈앞에서 은총을 얻었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኖኅ፡ ባሕቲቱ፡
  english_pob_choice: But Noah alone
  chosen_korean: 그러나 노아만이
  alternatives_korean:
  - 그런데 노아만
  - 오직 노아만
  lexicon: Noah
  rationale: 문두 접속사 ወ를 ‘그러나’로, ባሕቲቱ(only/alone)를 ‘-만이’로 살려 대조와 배타성을 함께 드러냈습니다.
- source_word: ረከበ፡ ሞገሰ፡
  english_pob_choice: found favor
  chosen_korean: 은총을 얻었습니다
  alternatives_korean:
  - 호의를 얻었습니다
  - 은혜를 입었습니다
  lexicon: find favor
  rationale: 히브리어/에티오피아 전승의 ‘호의/은총을 얻다’는 관용을 현대 한국어에서 자연스럽게 옮기되, 공적이고 신학적인 뉘앙스를 살리기 위해 ‘은총’을 택했습니다.
- source_word: በቅድመ፡ *አዕይንቲሁ፡
  english_pob_choice: before the eyes of
  chosen_korean: 주의 눈앞에서
  alternatives_korean:
  - 주의 눈에
  - 주 앞에서
  lexicon: before the eyes of
  rationale: 직역에 가깝게 ‘눈앞에서’로 옮겨, 단순한 장소가 아니라 시선 아래 있음과 평가의 의미를 드러냈습니다.
- source_word: ለእግዚአብሔር፡
  english_pob_choice: the Lord
  chosen_korean: 주
  alternatives_korean:
  - 야훼
  - 주님
  lexicon: YHWH
  rationale: 이 절의 Geez 본문은 ‘주’에 해당하는 신칭을 사용하므로, 본문 자체의 직접 대응을 따라 ‘주’로 옮겼습니다. 이탈리아식/구약적 고유명 표기인 야훼는 이 구절의 직항 대응에는 과도합니다.
theological_decisions:
- issue: ‘favor’의 한국어 신학적 어감
  chosen_reading: ‘은총’은 단순한 친절보다 하나님의 호의와 은혜의 결합된 의미를 전달합니다.
  alternative_readings:
  - 호의
  - 은혜
  rationale: 창세기/주빌리오스 맥락에서 노아가 하나님께 특별한 인정과 구원을 받는 장면이므로, 은혜적 성격을 분명히 하는 번역이 적합합니다.
  doctrine_reference: divine favor / grace in narrative election
