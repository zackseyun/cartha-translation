  text: And on the new moon of the tenth month the tops of the mountains appeared, and on the new moon of the first month the earth appeared.
translation:
  language: ko
  text: 그리고 열째 달의 초하루에 산꼭대기들이 드러났고, 첫째 달의 초하루에 땅이 드러났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበሠርቀ፡ ወርኀ፡ ዓሥር፡
  english_pob_choice: on the new moon of the tenth month
  chosen_korean: 열째 달의 초하루
  alternatives_korean:
  - 열 번째 달의 초하루
  - 열째 달의 신월
  lexicon: 월/초하루
  rationale: Geez의 ‘새달/초하루’ 표현을 한국어 성서체에서 자연스러운 ‘초하루’로 옮겨 달의 시작을 분명히 했습니다.
- source_word: አስተርአየ፡ አርእስተ፡ አድባር፡
  english_pob_choice: the tops of the mountains appeared
  chosen_korean: 산꼭대기들이 드러났고
  alternatives_korean:
  - 산들의 꼭대기들이 나타났고
  - 산봉우리들이 보였고
  lexicon: 산꼭대기/드러나다
  rationale: ‘아스테르아예(드러나 보이다)’의 수동적 뉘앙스를 살려 단순한 출현보다 ‘드러났고’로 옮겼습니다.
- source_word: አስተርአየት፡ ምድር።
  english_pob_choice: the earth appeared
  chosen_korean: 땅이 드러났습니다
  alternatives_korean:
  - 땅이 나타났습니다
  - 대지가 보였습니다
  lexicon: 땅/드러나다
  rationale: 영문 POB의 ‘earth’에 맞추되, 문맥상 물이 물러가 육지가 모습을 드러내는 장면을 자연스럽게 전달했습니다.
theological_decisions:
- issue: 창조/홍수 서술에서의 ‘드러남’ 표현 유지
  chosen_reading: 산꼭대기와 땅이 ‘드러났다’고 번역해, 가려져 있던 것이 물러난 뒤 모습을 드러내는 서술을 보존했습니다.
  alternative_readings:
  - ‘나타났다’로 완화하여 일반적 출현처럼 읽을 수 있음
  rationale: 원문의 동사는 단순한 출현보다 가려짐이 해소되는 시각적·서술적 효과가 있어 이를 유지하는 것이 본문 의미에 더 가깝습니다.
  doctrine_reference: 창세기 홍수 서술의 문자적 사건 진행
