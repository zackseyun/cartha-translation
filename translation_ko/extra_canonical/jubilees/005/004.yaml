translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. “내가 사람과, 내가 창조한 땅의 표면 위에 있는 모든 육체를 멸하겠습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤ፡
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그리고 그가 이르셨습니다
  lexicon: '-'
  rationale: 서술 표지로서의 동사이며, 문맥상 하나님이 하신 말씀을 자연스러운 문어체로 옮기기 위해 ‘말씀하셨습니다’를 택했습니다.
- source_word: አይመሰለ፡
  english_pob_choice: I will destroy
  chosen_korean: 내가 멸하겠습니다
  alternatives_korean:
  - 내가 없애겠습니다
  - 내가 파괴하겠습니다
  lexicon: '-'
  rationale: 게에즈 동사는 ‘닮다/비슷하다’가 아니라 멸망시키는 뜻으로 읽혀야 하므로, 하나님의 직접적 파멸 선언을 담는 ‘멸하겠습니다’로 옮겼습니다.
- source_word: ለሰብእ፡ ወለኵሉ፡ ዘሥጋ፡
  english_pob_choice: man and all flesh
  chosen_korean: 사람과… 모든 육체를
  alternatives_korean:
  - 인간과… 모든 육체를
  - 사람과… 모든 피조물의 육체를
  lexicon: '-'
  rationale: ‘사람’은 인간 개체를, ‘모든 육체’는 인간과 짐승을 포괄하는 생명체 전체를 가리키는 표현으로 유지했습니다.
- source_word: በመልዕልተ፡
  english_pob_choice: upon
  chosen_korean: 위에 있는
  alternatives_korean:
  - 위에
  - 위에 있는
  lexicon: '-'
  rationale: English audit trail의 ‘upon’에 맞춰, 지면 위의 위치 관계를 분명히 하는 ‘위에 있는’으로 옮겼습니다.
- source_word: ዘፈጠርኩ።
  english_pob_choice: which I created
  chosen_korean: 내가 창조한
  alternatives_korean:
  - 내가 지은
  - 내가 만든
  lexicon: '-'
  rationale: 창조 행위의 주어가 하나님임을 분명히 하기 위해 ‘창조한’을 유지했습니다.
theological_decisions:
- issue: 파괴 선언의 강도
  chosen_reading: 하나님의 직접적 심판 선언으로서 ‘멸하겠습니다’를 사용했습니다.
  alternative_readings:
  - 없애겠습니다
  - 파괴하겠습니다
  rationale: 본문은 단순한 제거가 아니라 창조주로서의 심판 선언을 담고 있으므로, 의미 강도를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 창조-심판의 주권
- issue: ‘사람’과 ‘모든 육체’의 병렬
  chosen_reading: ‘사람과… 모든 육체’로 두 범주를 병렬로 살렸습니다.
  alternative_readings:
  - 인간과… 모든 육체
  - 사람과 모든 생명
  rationale: 게에즈 원문의 병렬을 보존해야 대상이 인간만이 아니라 생명 전체로 확장됨이 드러납니다.
  doctrine_reference: 심판 범위의 보편성
