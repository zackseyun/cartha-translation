  text: And on the twenty-seventh thereof he opened the ark and sent out from it beasts and cattle and birds and everything that moves.
translation:
  language: ko
  text: 그리고 그 달의 스물일곱째 날에 그는 방주를 열고 그 안에서 짐승들과 가축들과 새들과 움직이는 모든 것을 내보냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአመ፡ *ዕሥራ፡ ወሰብዑ፡
  english_pob_choice: on the twenty-seventh thereof
  chosen_korean: 그 달의 스물일곱째 날에
  alternatives_korean:
  - 스물일곱째 날에
  - 그것의 스물일곱째 날에
  lexicon: temporal expression
  rationale: 원문은 특정한 ‘그 달/그것’의 27일째를 가리키므로, 한국어에서는 문맥상 자연한 ‘그 달의 스물일곱째 날’로 옮겼습니다.
- source_word: ሎቱ፡ አርኀዋ፡ ለታቦት፡
  english_pob_choice: he opened the ark
  chosen_korean: 그는 방주를 열고
  alternatives_korean:
  - 그는 방주를 열어
  - 그는 방주를 열었습니다
  lexicon: narrative verb
  rationale: 행위 순서를 살려 연결형 ‘열고’를 사용했고, ‘방주’는 해당 문맥의 표준적인 한국어 성경 용례를 따랐습니다.
- source_word: ወፈነወ፡ እምውስቴታ፡
  english_pob_choice: sent out from it
  chosen_korean: 그 안에서 … 내보냈습니다
  alternatives_korean:
  - 그것으로부터 내보냈습니다
  - 그 안에서 … 보냈습니다
  lexicon: motion verb
  rationale: ‘from it’의 공간적 출발점을 한국어에서는 자연스럽게 ‘그 안에서’로 풀어, 방주 내부에서 밖으로 내보내는 뜻을 분명히 했습니다.
- source_word: አራዊተ፡ ወእንስሳ፡ ወአዕዋፈ፡ ወዘይትነወስ።
  english_pob_choice: beasts and cattle and birds and everything that moves
  chosen_korean: 짐승들과 가축들과 새들과 움직이는 모든 것
  alternatives_korean:
  - 들짐승들과 가축들과 새들과 기어다니는 모든 것
  - 짐승과 가축과 새와 모든 움직이는 것
  lexicon: enumeration
  rationale: 원문의 세 범주와 마지막 포괄구를 그대로 살리되, ‘everything that moves’는 ‘움직이는 모든 것’으로 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 동물 범주 열거의 포괄성
  chosen_reading: ‘짐승들과 가축들과 새들과 움직이는 모든 것’으로 원문의 포괄열을 그대로 보존했습니다.
  alternative_readings:
  - 범주를 합쳐 더 매끈하게 옮기는 방식
  - ‘기어다니는 모든 것’처럼 관용적으로 풀어 옮기는 방식
  rationale: 본문은 방주에서 내보낸 생명체의 범위를 단계적으로 나열하므로, 범주를 합치면 원문의 리듬과 포괄성이 약해집니다.
  doctrine_reference: 창조 보존과 홍수 서사의 서술적 정확성
