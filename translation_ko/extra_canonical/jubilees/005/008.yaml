translation:
  language: ko
  text: 그리고 그가 말씀하셨습니다. “내 영은 사람 위에 영원히 머물지 못할 것이다. 그들도 육체이기 때문이다. 그리고 그들의 날수는 백이십 년이 될 것이다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤ
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 말씀하셨습니다
  alternatives_korean:
  - 그가 말하셨습니다
  - 그리고 그가 이르셨습니다
  lexicon: Ge'ez 서술 동사
  rationale: 서술 도입을 자연스럽게 살리되, 인칭 화자가 드러나도록 ‘말씀하셨습니다’를 택했습니다.
- source_word: ዲበ፡ ሰብእ
  english_pob_choice: upon man
  chosen_korean: 사람 위에
  alternatives_korean:
  - 사람 안에
  - 사람에게
  lexicon: Ge'ez 전치사구
  rationale: 게에즈 전치사 diba는 ‘위에/위로’의 의미를 가지므로, 영어 개정 전통보다 원문 표면형을 따라 ‘사람 위에’로 옮겼습니다.
- source_word: እሙንቱ*ኒ
  english_pob_choice: they too are flesh
  chosen_korean: 그들도 육체이기 때문이다
  alternatives_korean:
  - 그들도 육체이다
  - 그들도 또한 육체이기 때문이다
  lexicon: Ge'ez enclitic -ni
  rationale: -ni가 ‘또한/too’의 뉘앙스를 지니지만 한국어에서는 ‘그들도’로 이미 그 의미를 충분히 담을 수 있어 중복을 피했습니다.
- source_word: ሥጋ
  english_pob_choice: flesh
  chosen_korean: 육체
  alternatives_korean:
  - 살
  - 육신
  lexicon: Geez/semitic anthropological term
  rationale: 인간의 유한성과 피조성을 드러내는 인류학적 표현으로 ‘육체’를 사용해, 단순한 물질 신체보다 넓은 의미를 살렸습니다.
- source_word: መዋዕሊሆሙ *ምእት፡ ወዕሥራ፡ ዓመት
  english_pob_choice: their days shall be one hundred and twenty years
  chosen_korean: 그들의 날수는 백이십 년이 될 것이다
  alternatives_korean:
  - 그들의 날수는 백이십 년이다
  - 그들의 날은 백이십 년이 될 것이다
  lexicon: Ge'ez temporal expression
  rationale: ‘날수’로 수명을 뜻하는 표현을 살리고, 미래 서술 ‘될 것이다’로 원문의 선언적 예고를 반영했습니다.
theological_decisions:
- issue: ‘내 영’의 지시 대상과 인간 위/안 표현의 해석
  chosen_reading: 하나님의 영이 사람 위에 머무는 지속성이 제한된다는 선언으로 읽되, 게에즈의 표면형 ‘위에’를 보존했습니다.
  alternative_readings:
  - 사람 안에
  - 사람에게
  rationale: 본문은 인간 안에 내적 내주를 말하기보다, 하나님의 영이 인간에게 임하는 상태의 지속 불가를 진술하는 것으로 읽히며, 게에즈 전치사도 이를 지지합니다.
  doctrine_reference: 창세기 6:3 평행구 및 창세 전승의 심판 선언
