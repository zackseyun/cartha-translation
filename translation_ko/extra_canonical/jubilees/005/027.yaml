  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሀሎ፡ ማያት፡ ይቀውም፡
  english_pob_choice: the waters stood
  chosen_korean: 물이 … 머물러 있었습니다
  alternatives_korean:
  - 물이 … 서 있었습니다
  - 물이 … 머물렀습니다
  lexicon: water / remain_stand
  rationale: Geez 동사 ‘서 있다/머물다’의 상태 지속을 한국어에서는 ‘머물러 있다’로 자연스럽게 살렸고, 과거 서술의 완결성을 위해 ‘있었습니다’를 썼습니다.
- source_word: ዲበ፡ ገጸ፡ ምድር፡
  english_pob_choice: upon the surface of the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅의 표면 위에
  - 땅 위 표면에
  lexicon: surface / earth
  rationale: 원문은 ‘땅의 표면’이라는 뜻이지만, 한국어에서는 ‘땅 위에’가 같은 지시를 더 자연스럽고 과장 없이 전달합니다.
- source_word: ኃምስተ፡ አውራኀ፡ *ምእተ፡ ወኃምሳ፡ ዕለተ።
  english_pob_choice: for five months, one hundred and fifty days
  chosen_korean: 다섯 달, 곧 백오십 일 동안
  alternatives_korean:
  - 다섯 달 동안, 곧 백오십 일 동안
  - 다섯 달과 백오십 일 동안
  lexicon: duration / apposition
  rationale: ‘다섯 달’과 ‘백오십 일’의 병치는 원문의 동격적 설명을 반영하며, ‘곧’으로 두 표현이 같은 기간임을 드러냈습니다.
theological_decisions:
- issue: 시간 표현의 병행 의미
  chosen_reading: ‘다섯 달’과 ‘백오십 일’은 서로 다른 두 기간이 아니라 같은 지속 기간을 설명하는 병렬 표현으로 보았습니다.
  alternative_readings:
  - 두 기간을 연속된 서로 다른 시기로 읽는 해석
  rationale: 원문과 EN POB 모두 같은 사건의 지속 시간을 두 방식으로 제시하므로, 한국어도 동격적 설명으로 읽히게 했습니다.
  doctrine_reference: 본문 내 서사적 수치 표현의 해석
- issue: 장소 표현의 간결화
  chosen_reading: ‘땅의 표면’의 직역을 피하고 ‘땅 위’로 옮겨 동일한 공간 관계를 유지했습니다.
  alternative_readings:
  - 땅의 표면 위에
  rationale: 의미는 보존하되 현대 한국어 문장성에 맞추어 과도한 번역투를 줄였습니다.
  doctrine_reference: 번역 문체와 서사 명료성
