  text: Concerning all, he will judge the great according to his greatness, and the small according to his smallness, and each one according to his way.
translation:
  language: ko
  text: 모든 것에 관하여, 그는 큰 자는 그 큼에 따라, 작은 자는 그 작음에 따라, 각 사람은 자기 길에 따라[a] 심판하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 사람이 걸어온 길 또는 삶의 행로를 가리키는 비유적 표현입니다.
    reason: 게에즈어 ፍኖት의 기본 이미지인 ‘길’을 본문에서 보존하면서, 한국어 독자가 문맥상 의미를 이해하도록 돕습니다.
lexical_decisions:
- source_word: በእንተ፡ ኵሉ፡
  english_pob_choice: Concerning all
  chosen_korean: 모든 것에 관하여
  alternatives_korean:
  - 모든 일에 관하여
  - 모든 것에 대해
  lexicon: Geez በእንተ
  rationale: 문두의 주제 표지로 보이는 표현을 한국어로 자연스럽게 옮기되, 범위를 좁히지 않고 포괄적으로 유지했습니다.
- source_word: ለዐቢይ፡ ... በከመ፡ ዐበየ፡
  english_pob_choice: the great according to his greatness
  chosen_korean: 큰 자를 그의 큼에 따라
  alternatives_korean:
  - 위대한 자를 그의 위대함에 따라
  - 큰 사람을 그의 큼에 따라
  lexicon: Geez ዐቢይ / ዐበየ
  rationale: 형용사와 추상 명사의 대응을 살려, 신분·규모의 차이를 ‘큼’으로 직역에 가깝게 표현했습니다.
- source_word: ወለንኡስ*ሂ፡ ... በከመ፡ ንእሰ፡
  english_pob_choice: and the small according to his smallness
  chosen_korean: 작은 자를 그의 작음에 따라
  alternatives_korean:
  - 작은 이를 그의 작음에 따라
  - 낮은 자를 그의 낮음에 따라
  lexicon: Geez ንእስ / ንእሰ
  rationale: 앞 구문과 대칭을 이루는 구조를 보존해, 작은 자에 대한 동일한 기준의 심판이라는 평행법을 드러냈습니다.
- source_word: ወለለ፡ አሐዱ፡ በከመ፡ ፍኖቱ፡ ይኴንኖ።
  english_pob_choice: and each one according to his way
  chosen_korean: 그리고 각 사람을 그의 길에 따라 심판하실 것입니다
  alternatives_korean:
  - 그리고 각 사람을 그의 행위에 따라 심판하실 것입니다
  - 그리고 각 사람을 그의 길에 따라 판단하실 것입니다
  lexicon: Geez ፍኖት
  rationale: ፍኖት을 단순 행위가 아니라 ‘길/행로’로 살려, 사람이 걸어온 삶의 방향 전체를 기준으로 삼는 뜻을 반영했습니다.
theological_decisions:
- issue: 심판의 기준을 ‘크기/길’의 평행구로 보존할지, 의미를 풀어 ‘신분/행위’로 완화할지
  chosen_reading: 원문의 평행 구조를 살려 ‘큰 자/작은 자/각 사람의 길’이라는 직접 표현을 유지했습니다.
  alternative_readings:
  - 신분에 따라
  - 행위에 따라
  rationale: Geez 본문은 크기와 길이라는 이미지적 표현을 반복하므로, 이를 해석적으로 평준화하면 문장의 수사와 강조가 약해집니다.
  doctrine_reference: 공정한 심판의 개별성
