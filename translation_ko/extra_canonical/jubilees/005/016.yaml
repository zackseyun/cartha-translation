review_pass:
  verdict: revise
  source_fidelity: 핵심 어휘는 대체로 충실합니다. ይትሜጠው እምእዴሁ는 ‘그의 손에서 무엇인가를 받다’라는 직접적 수수 거부로 옮기는 것이 적절하며, ‘흔들리다’로 본문을 번역하지 않았습니다. 다만 첫 두 문장은 원문의 조건·시간 관계와 ‘심판을 각 사람에게 시행한다’는 내용을 한국어 문장 안에서 더 긴밀히 연결할 필요가 있습니다.
  naturalness: 초안의 “그가 각 사람에게 심판을 집행하겠다고 말할 때 그렇습니다”는 독립된 ‘그렇습니다’가 선행 진술을 어색하게 받습니다. 또한 신적 재판 행위에는 ‘심판을 내리다’가 ‘심판을 집행하다’보다 현대 한국어에서 자연스럽습니다.
  terminology: ‘편파적으로 대하다’, ‘뇌물을 받다’, ‘의로운 재판관’은 재판 문맥과 잘 맞습니다. 반복되는 수수 거부는 원문의 강조를 반영하므로 유지하되, 두 번째 목적어를 ‘아무것도’로 명시했습니다.
  issues:
  - severity: medium
    issue: 첫 문장과 ‘그렇습니다’ 문장의 연결이 부자연스럽고, 원문의 심판 선언과 무편파성의 관계가 분리되어 보입니다.
    rationale: 원문과 영어 POB는 그가 각 사람에게 심판을 시행한다고 말씀하시는 맥락에서 편파와 뇌물 수수를 거부하심을 진술합니다. 이를 한 문장으로 연결하면 의미 관계가 분명해집니다.
  - severity: low
    issue: ‘심판을 집행하다’는 한국어에서 다소 부자연스럽습니다.
    rationale: 재판관이 내리는 행위에는 ‘심판을 내리다’가 더 관용적이며 의미를 바꾸지 않습니다.
