base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/016.yaml
  text: And he is not one who shows partiality, nor one who accepts a bribe, when he says that he will execute judgment on each. Even if one gave everything that is on the earth, he would not show partiality or accept it, nor would he receive anything from his hand, for he is a righteous judge.
  footnotes:
  - marker: a
    text: Or 'nor would he be swayed from his hand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 각 사람에게 심판을 내리겠다고 말씀하실 때에도 편파적으로 대하거나 뇌물을 받는 분이 아니십니다. 누가 땅 위에 있는 모든 것을 드린다 해도, 그는 편파적으로 대하거나 그것을 받지 않으실 것이며, 그의 손에서 아무것도 받지 않으실 것입니다.[a] 그는 의로운 재판관이시기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 손에 흔들리지 않으실 것이다.”
    reason: 이전 번역 전통에는 ይትሜጠው를 ‘흔들리다/영향을 받다’로 이해한 표현이 있으나, 본문은 ‘그의 손에서 아무것도 받지 않으실 것이다’로 직접적인 수수 거부를 번역합니다.
lexical_decisions:
- source_word: ዘይነሥእ ገጸ
  english_pob_choice: one who shows partiality
  chosen_korean: 편파적으로 대하지도
  alternatives_korean:
  - 외모를 보지도
  - 사람을 차별하지도
  - 편애하지도
  lexicon: Ge'ez ነሥእ + ገጸ
  rationale: 문맥상 재판관의 공정성 여부를 말하므로, 단순한 ‘얼굴’보다 판결에서의 편파를 드러내는 표현으로 옮겼습니다.
- source_word: ዘይነሥእ ሕሊና
  english_pob_choice: one who accepts a bribe
  chosen_korean: 뇌물을 받지도
  alternatives_korean:
  - 선물을 받지도
  - 예물을 받지도
  - 부정한 뇌물을 취하지도
  lexicon: Ge'ez ሕሊና
  rationale: 영문 POB의 revised reading이 judicial context에서 ‘bribe’를 요구하므로, 한국어도 공적인 뇌물로 좁혀서 번역했습니다.
- source_word: ይትሜጠው እምእዴሁ
  english_pob_choice: would not receive anything from his hand
  chosen_korean: 그의 손에서 아무것도 받지 않을 것입니다
  alternatives_korean:
  - 그의 손에서 흔들리지 않을 것입니다
  - 그의 손에 의해 움직이지 않을 것입니다
  - 그의 손에 넘어가지 않을 것입니다
  lexicon: Ge'ez መጠወ
  rationale: 최신 검토에서 이 동사는 ‘receive/take/accept’ 계열로 정정되었으므로, ‘흔들리다’가 아니라 직접적인 수수 거부로 반영했습니다.
- source_word: መኰንን ጽድቅ
  english_pob_choice: a righteous judge
  chosen_korean: 의로운 재판관
  alternatives_korean:
  - 의로운 심판자
  - 의로운 판관
  - 의의 재판관
  lexicon: Ge'ez መኰንን
  rationale: ‘재판관’이 법정적 심판 맥락을 가장 자연스럽게 드러내며, ‘의로운’은 ጽድቅ의 성격을 간결하게 살립니다.
theological_decisions:
- issue: 하나님의 심판의 공정성 표현
  chosen_reading: 하나님은 외적 지위나 재물에 의해 판결이 흔들리지 않는 의로운 재판관으로 제시됩니다.
  alternative_readings:
  - 그는 단지 공정한 사람으로 묘사됩니다.
  - 심판의 무편파성만 강조됩니다.
  rationale: 본문은 재판 행위와 부패 거부를 함께 제시하여, 단순한 도덕적 공정보다 하나님의 사법적 공의와 불가매수성을 강조합니다.
  doctrine_reference: Divine justice and impartiality
