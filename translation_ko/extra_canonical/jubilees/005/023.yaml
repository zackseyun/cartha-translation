  text: And he entered it in its sixth year[a], in the second month, on the new moon of the second month, until the sixteenth; and he entered, he and all that we brought to him, into the ark, and the Lord shut it from outside on the seventeenth evening.
  footnotes:
  - marker: a
    text: The date line is difficult in this verse. 'On the new moon of the second month, until the sixteenth ... on the seventeenth evening' likely marks entry into the ark and the Lord's shutting it immediately before the onset of the Flood.
    reason: segmentation_note
    anchor_ref: '5:23'
  - marker: b
    text: Or 'in its six hundredth year'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 그 여섯째 해에, 둘째 달, 그 둘째 달의 초하루부터 십육일까지 들어갔습니다. 그리고 그와 우리가 그에게 데려온 모든 이가 방주로 들어갔고, 주께서 십칠일 저녁에 밖에서 그것을 닫으셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሳድስ
  english_pob_choice: in its sixth year
  chosen_korean: 그 여섯째 해에
  alternatives_korean:
  - 그 육백년째 해에
  - 그 여섯 해에
  lexicon: Jubilees chronology term
  rationale: 게어즈 본문은 `ሳድስ`로 ‘여섯째’를 뜻하므로, 창세기식 ‘육백년째’로 바꾸지 않고 주기 연대 표현을 그대로 살렸습니다.
- source_word: በሠርቅ
  english_pob_choice: on the new moon of the second month
  chosen_korean: 둘째 달의 초하루부터
  alternatives_korean:
  - 둘째 달의 신월에
  - 둘째 달 첫날부터
  lexicon: Jubilees calendrical usage
  rationale: Jubilees의 달력 용례를 반영하여 ‘새달/신월’보다 본문 전통에 맞는 ‘초하루’를 택했고, 기간의 시작점을 드러내기 위해 ‘부터’를 붙였습니다.
- source_word: ውስተ፡ ታቦት፡ ... ወዐጸዎ፡ እግዚአብሔር፡ እንተ፡ አፍአሁ፡
  english_pob_choice: into the ark, and the Lord shut it from outside
  chosen_korean: 방주로 들어갔고, 주께서 ... 밖에서 그것을 닫으셨습니다
  alternatives_korean:
  - 방주 안으로 들어갔고, 주께서 바깥에서 그것을 닫으셨습니다
  - 방주에 들어갔고, 주께서 밖에서 그것을 닫으셨습니다
  lexicon: ark / outside closure
  rationale: '`방주`는 노아 이야기의 표준 한국어 성경 용례를 따르되, 닫으신 주체와 위치 관계를 분명히 하기 위해 ‘밖에서’라고 옮겼습니다.'
theological_decisions:
- issue: 날짜 구절의 난해한 연결
  chosen_reading: ‘둘째 달의 초하루부터 십육일까지’와 ‘십칠일 저녁’ 사이의 연결을 그대로 보존했습니다.
  alternative_readings:
  - ‘둘째 달 초하루에, 곧 십육일까지’로 매끈하게 재구성
  - ‘둘째 달 초하루에서 십육일까지’로 단순화
  rationale: 본문은 입주 시점과 방주 봉쇄 시점을 촘촘히 나열하는 달력 문구이므로, 해석적으로 매끈하게 재구성하기보다 원문의 시간표시 긴장을 유지했습니다.
  doctrine_reference: 문헌학적 보존 원칙
