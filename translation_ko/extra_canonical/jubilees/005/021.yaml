  text: And he commanded Noah to make for himself an ark, so that he might be saved from the waters of the Flood.
translation:
  language: ko
  text: 그리고 그는 노아에게 방주를 만들어, 홍수의 물에서 구원받게 하라고 명령했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአዘዞ፡ ለኖኅ፡
  english_pob_choice: And he commanded Noah
  chosen_korean: 그는 노아에게 명령했습니다
  alternatives_korean:
  - 그리고 그는 노아에게 명령하였습니다
  - 그리고 그는 노아에게 이르렀습니다
  lexicon: አዘዘ
  rationale: 원문 동사는 단순한 지시가 아니라 권위를 가진 명령을 뜻하므로 ‘명령했습니다’로 옮겼습니다.
- source_word: ይግበር፡ ሎቱ፡ ታቦተ፡
  english_pob_choice: to make for himself an ark
  chosen_korean: 방주를 만들어
  alternatives_korean:
  - 그를 위해 방주를 만들도록
  - 자기에게 방주를 만들라고
  lexicon: ታቦት
  rationale: Geez의 ታቦተ는 여기서 노아가 만들 구조물을 가리키므로, 한국어에서는 자연스럽고 전통적으로도 통용되는 ‘방주’로 옮겼습니다.
- source_word: ይድኀኖ፡ እምነ፡ ማየ፡ አይኅ።
  english_pob_choice: so that he might be saved from the waters of the Flood
  chosen_korean: 홍수의 물에서 구원받게 하려고
  alternatives_korean:
  - 홍수의 물에서 구원받도록
  - 홍수의 물로부터 спас되게 하려고
  lexicon: ይድኀነ
  rationale: 목적절의 ‘구원받다’는 원문의 구출·생존을 그대로 살리며, ‘홍수의 물’은 마지막 구문을 직역해 의미를 보존합니다.
theological_decisions:
- issue: 방주 명령의 목적 표현
  chosen_reading: 구원 목적을 분명히 드러내는 ‘구원받게 하려고’로 번역했습니다.
  alternative_readings:
  - 단순히 ‘살게 하려고’
  - ‘보전되게 하려고’
  rationale: 원문은 방주 제작의 목적을 생존 차원이 아니라 구출/구원의 차원으로 제시하므로, POB의 의미를 따라 ‘구원’ 언어를 유지했습니다.
  doctrine_reference: 서사 문맥상 구원/보호의 목적절 유지
- issue: 홍수의 물
  chosen_reading: ‘홍수의 물’로 옮겨 물의 범주와 사건의 심판성을 함께 드러냈습니다.
  alternative_readings:
  - ‘홍수에서’
  - ‘큰 물에서’
  rationale: 원문은 ‘물’(마예)과 ‘홍수’(아이흐)를 함께 두어 재난의 실재성을 강조하므로 둘 다 보존했습니다.
  doctrine_reference: 서사적 심판 이미지 보존
