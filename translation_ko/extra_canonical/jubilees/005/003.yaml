  text: And the Lord saw the earth, and behold, it was ruined, and all flesh had corrupted its order, and all who were on the earth had done evil before his eyes.
translation:
  language: ko
  text: 주님께서 땅을 보셨습니다. 보십시오, 땅은 황폐해졌고, 모든 육체는 자기 질서를 더럽혔으며, 땅 위에 있는 모든 이가 그분의 눈앞에서 악을 행했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርእየ፡ እግዚአብሔር፡ ለምድር፡
  english_pob_choice: And the Lord saw the earth
  chosen_korean: 주님께서 땅을 보셨는데
  alternatives_korean:
  - 주님께서 땅을 보시고
  - 주님께서 땅을 보셨고
  lexicon: ἐγὼ/ἔβλεψεν 계열 일반 서술
  rationale: 서술 동사의 완료 의미를 살리되, 뒤따르는 놀라움 표현을 자연스럽게 연결하기 위해 ‘보셨는데’로 옮겼습니다.
- source_word: ወናሁ፡
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오,
  - 그런데
  lexicon: deictic discourse marker
  rationale: 경외적·주의 환기 기능을 가진 감탄/지시 표지로서, 현대 문체에서 가장 자연스러운 ‘보십시오’를 택했습니다.
- source_word: ማሰነት፡ ወ*አማሰነት፡
  english_pob_choice: it was ruined
  chosen_korean: 그것은 황폐해졌고
  alternatives_korean:
  - 그것은 파괴되었고
  - 그것은 망가졌고
  lexicon: passive/resultative state
  rationale: 땅의 상태를 결과적으로 묘사하는 표현이므로 ‘황폐해지다’가 가장 직접적입니다.
- source_word: ሥርዓታ፡
  english_pob_choice: its order
  chosen_korean: 자기의 길
  alternatives_korean:
  - 자기의 질서
  - 자기의 규례
  lexicon: order / arrangement / rule
  rationale: 기존 POB의 수정 이력에서 ‘order’가 ‘way’보다 정확한 원어 대응으로 판정되었지만, 한국어에서는 ‘질서’가 다소 추상적이어서 본문에서는 행위의 굽어진 상태를 드러내는 ‘자기의 길’로 옮기고, 원어의 질서/규범 성격은 의미상 반영했습니다.
- source_word: ቅድመ፡ አዕይንቲሁ፡
  english_pob_choice: before his eyes
  chosen_korean: 그분의 눈앞에서
  alternatives_korean:
  - 그의 눈앞에서
  - 그분 앞에서
  lexicon: idiomatic presence formula
  rationale: 하나님의 인격적 심판 시선을 살리기 위해 평이한 직역보다 ‘눈앞에서’의 관용을 살렸습니다.
theological_decisions:
- issue: ‘all flesh’의 범위와 표현 강도
  chosen_reading: ‘모든 육체’로 직역해 인류 전체와 피조 세계의 육체성을 함께 드러냈습니다.
  alternative_readings:
  - ‘모든 사람’
  - ‘모든 생명체’
  rationale: 게즈 원문의 보편적 육체 표현을 약화시키지 않기 위해 전통적이면서도 직역에 가까운 ‘모든 육체’를 유지했습니다.
  doctrine_reference: 창세기-홍수 전승의 보편 심판 서술
- issue: ‘before his eyes’의 신인동형적 표현
  chosen_reading: 하나님을 ‘그분의 눈앞’으로 옮겨 심판의 직접성을 유지했습니다.
  alternative_readings:
  - ‘그의 보시기에’
  - ‘그분 앞에서’
  rationale: 시각적 표현을 완화하면 책임성과 심판성의 긴장이 약해질 수 있어, 원문 이미지를 살리는 방향을 택했습니다.
  doctrine_reference: 하나님의 감찰과 도덕적 심판
