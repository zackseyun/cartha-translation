  text: And the Lord opened seven floodgates of heaven and the openings of the fountains of the great deep[a], seven openings in all, and the floodgates poured down water from heaven for forty days and forty nights.
  footnotes:
  - marker: a
    text: The phrase 'seven openings in all' (lit. 'seven mouths in number') is preserved from the Ge'ez, emphasizing the structured cosmology of the deep rather than reducing it to a generic flood description.
    reason: cultural_note
    anchor_ref: '5:24'
translation:
  language: ko
  text: 그리고 주님께서 하늘의 일곱 홍수문과 큰 깊음의 샘들의 열림을 여셨습니다[a]. 곧 일곱 열림이었고, 홍수문들이 하늘에서 물을 사십 일과 사십 밤 동안 쏟아냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 하나님
  - 주
  lexicon: 'Korean POB default: κύριος/주님'
  rationale: Geez 원문의 신명은 영어 POB의 the Lord에 맞춰 한국어에서 예배적이면서도 현대적인 ‘주님’으로 옮겼습니다.
- source_word: ሰብዐተ፡ መገብሕብሕተ፡ ሰማይ
  english_pob_choice: seven floodgates of heaven
  chosen_korean: 하늘의 일곱 홍수문
  alternatives_korean:
  - 하늘의 일곱 수문
  - 하늘의 일곱 물문
  lexicon: contextual hydro-cosmological imagery
  rationale: 문맥상 단순한 ‘문’이 아니라 하늘에서 물이 쏟아지는 구조를 가리키므로, POB의 floodgates를 따라 ‘홍수문’으로 구체화했습니다.
- source_word: አፈወ፡ አንቅዐተ፡ ቀላይ፡ ዐቢይ
  english_pob_choice: the openings of the fountains of the great deep
  chosen_korean: 큰 깊음의 샘들의 열림
  alternatives_korean:
  - 큰 깊음의 샘들의 틈
  - 큰 깊음의 샘들의 문
  lexicon: opening / fountain
  rationale: 영어 POB가 Ge'ez의 구조적 이미지를 ‘openings’로 풀어낸 점을 따라, 샘의 ‘열림’으로 번역해 지층적·우주론적 이미지를 보존했습니다.
- source_word: በሰብዑ፡ አፈወ፡ በ*ኍልቍ
  english_pob_choice: seven openings in all
  chosen_korean: 곧 일곱 열림이었고
  alternatives_korean:
  - 모두 일곱 열림이었고
  - 일곱 열림이 있었습니다
  lexicon: counting idiom
  rationale: Ge'ez의 수량 관용구를 반영해 ‘곧’으로 총계를 드러내되, 문맥에 맞게 자연스러운 합쇼체로 정리했습니다.
- source_word: ፵መዋዕለ፡ ወ፵ሌልየ፡
  english_pob_choice: for forty days and forty nights
  chosen_korean: 사십 일과 사십 밤 동안
  alternatives_korean:
  - 사십 일 낮과 사십 밤 동안
  - 사십 일과 사십 야간 동안
  lexicon: temporal duration formula
  rationale: 기간 표현은 원문의 병렬을 유지하면서 한국어의 자연스러운 시간 지속 표현인 ‘동안’을 붙여 옮겼습니다.
theological_decisions:
- issue: 우주론적 이미지를 평면적 홍수 서술로 약화시키지 않음
  chosen_reading: ‘큰 깊음의 샘들의 열림’과 ‘일곱 열림’의 구조를 유지해, 홍수가 질서 정연한 우주 구조의 개방으로 묘사되게 했습니다.
  alternative_readings:
  - ‘큰 깊음의 샘들’로만 단순화
  - ‘샘의 구멍’처럼 비유를 축소
  rationale: POB의 주해 취지를 따라, 본문이 전달하는 구조화된 깊음의 이미지를 보존하는 것이 문학적·신학적으로 중요합니다.
  doctrine_reference: 창세기 7장 홍수 전승의 우주론적 도상
- issue: ‘주님’의 선택
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  - 주
  rationale: 서술체에서는 현대 한국어에서 가장 자연스럽고, 동시에 신명 칭호의 존칭과 인격성을 유지하는 표현입니다.
  doctrine_reference: 신적 호칭의 번역 일관성
