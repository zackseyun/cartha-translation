theological_decisions:
- issue: 연례적 자비/속죄의 반복성
  chosen_reading: 본문의 ‘매년 한 번씩’은 단순 빈도 정보가 아니라 주기적으로 반복되는 자비의 질서를 뜻하는 것으로 유지했습니다.
  alternative_readings:
  - 연례적 속죄 제도
  - 매해 한 번의 은혜
  rationale: 영문 POB 주석이 지적하듯 주기적 속죄 또는 자비의 칼렌더 신학이 암시되므로, 이를 일반화하지 않고 반복 구조를 드러냈습니다.
  doctrine_reference: Jubilees 5:18 calendrical theology
- issue: ‘자비’의 주체를 명시하지 않음
  chosen_reading: 수동형 ‘자비가 베풀어질 것입니다’로 두어 행위 주체를 본문처럼 직접 특정하지 않았습니다.
  alternative_readings:
  - 그가 자비를 베푸실 것입니다
  - 하나님께서 자비를 베푸실 것입니다
  rationale: 영문 개정이 지적했듯 source-neutral passive가 더 자연스럽고, 지혜문학/제정문체의 일반 규범성을 보존합니다.
  doctrine_reference: source-neutral passive
