  text: 그것은 기록되고 제정되어, 매년 한 번씩 자기 모든 잘못에서 돌아서는 모든 사람에게 자비가 베풀어질 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  english_pob_choice: It has been written and ordained
  chosen_korean: 그것은 기록되고 제정되어
