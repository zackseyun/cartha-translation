translation:
  language: ko
  text: 자신의 모든 잘못에서 돌이키는 모든 이에게는 해마다 한 번씩[a] 자비가 베풀어질 것이라고 기록되어 있으며 규정되어 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘해마다 한 번씩’이라는 표현은 희년서의 달력 신학에서 반복되는 속죄 또는 자비를 가리킬 수 있습니다. 그 의미를 일반화하지 않고 명시적으로 옮겼습니다.
    reason: 연례적 빈도 표현의 가능한 달력·속죄 문맥을 설명하되, 본문의 반복성을 보존합니다.
