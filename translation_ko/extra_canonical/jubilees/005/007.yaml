review_pass:
  verdict: revise
  source_fidelity: 게에즈어의 두 동사는 각각 ‘치다/쳐서 쓰러뜨리다’와 ‘제거하다’의 뜻을 지니므로, ‘칼에 맞아 쓰러지고’와 ‘하늘 아래에서 제거되다’라는 핵심 이미지는 유지되어야 합니다. 다만 현 초안의 ‘말씀이 나와 … 하셨습니다’는 ‘말’이 주어인 문장에 하나님을 행위자로 하는 ‘하셨습니다’를 결합하여 문법적 주체가 어긋납니다. ‘…되리라는 말이 그의 앞에서 나왔습니다’로 고치면 원문의 선언 형식과 미래적 심판 내용을 충실히 전달합니다.
  naturalness: ‘그의 얼굴 앞에서 한 말씀이 나와’는 한국어로 다소 직역투이며, ‘한 말씀’은 불필요하게 신학적으로 특정한 뉘앙스를 더합니다. ‘그의 앞에서 … 말이 나왔습니다’는 현대 문어체에서 자연스럽고, 합쇼체 종결도 일관됩니다.
  terminology: ‘아들들’은 원문의 복수형을 보존합니다. ‘말’은 여기서 신적 칭호로서의 ‘말씀’을 확정하지 않고 선언·판결의 발화를 가리키는 원문에 더 중립적입니다. ‘제거되다’는 두 번째 동사의 구체적 의미를 보존하며, ‘멸망하다’로 평준화하지 않았습니다.
