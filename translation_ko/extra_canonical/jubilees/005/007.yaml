translation:
  language: ko
  text: 그들의 아들들에 관해서는, 그들이 칼에 맞아 쓰러지고 하늘 아래에서 제거되리라는 말이 그의 앞에서 나왔습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “칼로 쓸려 없어지고 하늘 아래에서 멸망하게.”
    reason: 영어 POB 감사 이력에 보존된 이전의 더 강한 의역적 표현을 반영한 대안 번역입니다. 본문은 게에즈어의 ‘쳐서 쓰러뜨리다’와 ‘제거하다’를 더 가깝게 따릅니다.
lexical_decisions:
- source_word: ወዲበ፡ ውሉዶሙ፡
