translation:
  language: ko
  text: 그들의 아들들에 관해서는, 그의 얼굴 앞에서 한 말씀이 나와 그들이 칼에 맞아 쓰러지고 하늘 아래에서 제거되게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዲበ፡ ውሉዶሙ፡
  english_pob_choice: And concerning their sons
  chosen_korean: 그들의 아들들에 관해서는
  alternatives_korean:
  - 그들의 아들들에 대하여는
  - 그들의 아들들에 관해서 말하자면
  lexicon: concerning
  rationale: 원문은 대상 전환을 나타내는 전치사구로, 한국어에서는 간결한 주제 전환 표현인 「…에 관해서는」이 가장 자연스럽습니다.
- source_word: ወፅአ፡ ቃል፡
  english_pob_choice: a word went out
  chosen_korean: 한 말씀이 나와
  alternatives_korean:
  - 말이 나와
  - 한 말이 나와
  lexicon: word
  rationale: Geez의 ‘word’는 단순한 말보다 선언적·권위 있는 발화를 가리키므로, POB의 ‘word’에 맞춰 「말씀」으로 옮겼습니다.
- source_word: እምቅድመ፡ ገጹ፡
  english_pob_choice: from before his face
  chosen_korean: 그의 얼굴 앞에서
  alternatives_korean:
  - 그의 앞에서
  - 그의 면전에서
  lexicon: face
  rationale: 직역의 ‘face’를 유지하되 한국어에서 자연스럽고 원문의 직접성을 살리기 위해 「얼굴 앞에서」로 옮겼습니다.
- source_word: ከመ፡ ይምሐጾሙ፡ በሰይፍ፡ ወያሰስሎሙ፡ እምታሕተ፡ ሰማይ።
  english_pob_choice: that they should be wiped out with the sword and destroyed from under heaven
  chosen_korean: 그들이 칼에 맞아 쓰러지고 하늘 아래에서 제거되게
  alternatives_korean:
  - 그들이 칼로 쳐서 제거되고 하늘 아래에서 사라지게
  - 그들이 칼에 맞아 죽고 하늘 아래에서 사라지게
  lexicon: struck down / removed
  rationale: 조정된 영어 POB의 핵심 어휘인 ‘struck down’과 ‘removed’를 따라, 수동적 피해와 제거의 두 요소를 모두 살리되 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: 폭력적 심판 언어의 직역성
  chosen_reading: ‘칼에 맞아 쓰러지고 하늘 아래에서 제거되게’라는 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 더 완화하여 ‘멸망하게’
  - 더 현대적으로 ‘죽임을 당하고 사라지게’
  rationale: 외경 본문의 심판 선언을 흐리지 않기 위해, 원문의 물리적·우주적 범위를 함께 드러내는 표현을 보존했습니다.
  doctrine_reference: 문맥상 역사적 심판 선언을 전달하는 번역 원칙
