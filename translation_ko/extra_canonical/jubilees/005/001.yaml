base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/001.yaml
  text: And it came to pass, when the children of men began to multiply on the face of the earth, and daughters were born to them, that in a certain year of this jubilee the angels of God saw them, that they were beautiful to look upon; and they took wives for themselves from all whom they chose, and they bore children for them, and these were the giants.
translation:
  language: ko
  text: 사람의 자녀가 땅의 표면 위에 번성하기 시작하고 딸들이 그들에게 태어났을 때, 이 희년의 어느 해에 하나님의 천사들이 그들을 보았는데, 그들이 보기에 아름다웠습니다. 그래서 그들은 자기들이 선택한 모든 여자들 가운데서 아내들을 데려갔고, 그들이 그들을 위하여 자녀들을 낳았으며, 그들은 거인들이었습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ወጠኑ፡ ደቂቀ፡ እጓለ፡ እመሕያው፡ ይብዝኁ፡ ዲበ፡ ገጸ፡ ለምድር፡
  english_pob_choice: when the children of men began to multiply on the face of the earth
  chosen_korean: 사람의 자녀가 땅의 표면 위에 번성하기 시작하고
  alternatives_korean:
  - 땅 위에 사람의 자녀가 불어나기 시작하고
  - 인간의 자녀가 땅의 얼굴 위에서 많아지기 시작하고
  lexicon: ደቂቀ፡ እጓለ፡ እመሕያው / ይብዝኁ / ገጸ፡ ለምድር
  rationale: 영어 POB의 ‘children of men’과 ‘multiply on the face of the earth’를 따라 ‘사람의 자녀’와 ‘땅의 표면 위에 번성하다’로 옮겨, 증식과 장소성을 함께 살렸습니다.
- source_word: አዋልድ፡ ተወልዳ፡ ሎሙ
  english_pob_choice: daughters were born to them
  chosen_korean: 딸들이 그들에게 태어났습니다
  alternatives_korean:
  - 딸들이 그들에게서 태어났습니다
  - 그들에게 딸들이 태어났습니다
  lexicon: ተወልዳ
  rationale: 수동형의 출생 사실을 그대로 살려 ‘태어났습니다’로 번역했습니다.
- source_word: መላእክተ፡ እግዚአብሔር
  english_pob_choice: the angels of God
  chosen_korean: 하나님의 천사들
  alternatives_korean:
  - 하나님의 사자들
  - 하나님께 속한 천사들
  lexicon: መላእክት / እግዚአብሔር
  rationale: 직역에 가까운 표준적 대응으로 ‘하나님의 천사들’을 택해, 소유 관계를 분명히 했습니다.
- source_word: ሠናያት፡ ለርእይ
  english_pob_choice: they were beautiful to look upon
  chosen_korean: 그들이 보기에 아름다웠습니다
  alternatives_korean:
  - 보기 좋았습니다
  - 눈에 아름다웠습니다
  lexicon: ሠናያት / ርእይ
  rationale: 외모에 대한 시각적 평가를 자연스럽게 전달하되, 과도하게 미화하지 않도록 ‘보기에 아름다웠습니다’로 옮겼습니다.
- source_word: ወነሥእዎን፡ ሎሙ፡ አንስቲያ
  english_pob_choice: and they took wives for themselves
  chosen_korean: 그래서 그들은 자기들이 선택한 모든 여자들 가운데서 아내들을 데려갔고
  alternatives_korean:
  - 그리고 그들은 아내들을 자기들을 위해 데려갔고
  - 그들은 스스로 아내들을 취하였고
  lexicon: ነሥአ / አንስቲ
  rationale: 후속구 ‘from all whom they chose’와 연결되므로, 단순히 ‘아내를 취하다’보다 선택과 취함의 동작을 함께 드러내는 표현을 택했습니다.
- source_word: ወወለዳ፡ ሎሙ፡ ውሉደ፡
  english_pob_choice: and they bore children for them
  chosen_korean: 그들이 그들을 위하여 자녀들을 낳았으며
  alternatives_korean:
  - 그들에게 자녀를 낳아 주었으며
  - 그리고 그들에게서 자녀들이 태어났으며
  lexicon: ወለደ
  rationale: 목적어 ‘그들을 위하여’를 보존해 원문이 말하는 관계를 드러냈습니다.
- source_word: ወእሙንቱ፡ ረዐይት
  english_pob_choice: and these were the giants
  chosen_korean: 그들은 거인들이었습니다
  alternatives_korean:
  - 그들은 거대한 자들이었습니다
  - 그리고 이것들이 네피림이었습니다
  lexicon: ረዐይት
  rationale: 본문의 직접적 명칭은 ‘거인들’이므로 이를 따르되, 본문이 여기서 별칭을 새로 붙이지 않도록 했습니다.
theological_decisions:
- issue: ‘하나님의 천사들’이 인간의 딸들을 보고 아내를 취하는 서술의 번역 톤
  chosen_reading: 서술적·직설적으로 옮겨, 본문이 드러내는 천상 존재와 인간 여성 사이의 긴장을 완화하지 않았습니다.
  alternative_readings:
  - 상징적으로 완화하는 번역
  - 해석을 덧붙여 비유적으로 처리하는 번역
  rationale: 외경/희년서의 본문 자체가 충돌을 의도적으로 드러내므로, 번역에서 그 긴장을 보존하는 것이 source-grounded입니다.
  doctrine_reference: 본문 충실성 및 해석 절제
- issue: ‘거인들’의 처리
  chosen_reading: 현행 영어 POB를 따라 ‘거인들’로 번역했습니다.
  alternative_readings:
  - 네피림
  - 장사들
  rationale: 이 절의 마무리 진술은 결과 집단을 지칭하는 직접 명칭이므로, 한국어 독자에게 가장 즉각적인 대응인 ‘거인들’을 유지했습니다.
  doctrine_reference: 본문 의미 보존
