  text: And he made for all his works a new and righteous nature[a], so that they should not sin in all their nature forever, but should all be righteous, each according to its kind, all the days.
  footnotes:
  - marker: a
    text: The clause is textually and semantically difficult. The translation preserves the sense of a renewed, righteous ordering of creation according to kind rather than smoothing it into a generic statement.
    reason: textual_variant
    anchor_ref: '5:12'
translation:
  language: ko
  text: 그분께서는 자신의 모든 일에 새롭고 의로운 본성을 주셔서, 그들이 영원히 그들의 모든 본성 안에서 죄를 짓지 않게 하시고, 모두 자기 종류대로, 모든 날 동안 의롭게 되게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሉ፡ ግብረ፡ ፍጥረተ፡ ሐዳሰ፡ ወጻድቅተ፡
  english_pob_choice: a new and righteous nature
  chosen_korean: 새롭고 의로운 본성
  alternatives_korean:
  - 새롭고 의로운 성품
  - 새로운 의로운 본성
  lexicon: nature / creation-order
  rationale: Geez의 ‘새롭고 의로운’은 단순한 상태 변화보다 창조 질서의 성격을 가리키므로, POB의 ‘nature’를 살려 ‘본성’으로 옮겼습니다.
- source_word: ከመ፡ እይረብቡ፡ በኵሉ፡ ፍጥረቶሙ፡ እስከ፡ ለዓለም፡
  english_pob_choice: so that they should not sin in all their nature forever
  chosen_korean: 그들이 영원히 그들의 모든 본성 안에서 죄를 짓지 않게 하시고
  alternatives_korean:
  - 그들이 영원토록 그들의 모든 본성으로 죄를 짓지 않게 하시고
  - 그들이 영원히 본성 전체로 죄를 짓지 않게 하시고
  lexicon: sin / forever / all their nature
  rationale: ‘죄를 짓다’는 행위 표지를 유지하고, ‘영원히’로 시간의 지속성을, ‘그들의 모든 본성 안에서’로 Geez의 내재적 표현을 보존했습니다.
- source_word: ወ*ይጸድቁ፡
  english_pob_choice: but should all be righteous
  chosen_korean: 모두 의롭게 되게 하시고
  alternatives_korean:
  - 모두 의롭게 되며
  - 모두 의인으로 되게 하시고
  lexicon: righteous / become righteous
  rationale: 결과 상태를 단순 묘사하기보다 ‘되게 하시고’로 앞 절의 목적절 구조를 살렸고, ‘의롭게’는 POB의 ‘righteous’를 직접 반영합니다.
- source_word: በበ፡ ትዝምዳ፡ ኵሉ፡ መዋዕለ።
  english_pob_choice: each according to its kind, all the days
  chosen_korean: 자기 종류대로, 모든 날 동안
  alternatives_korean:
  - 각각 그 종류에 따라, 모든 날 동안
  - 각기 그 종류에 따라, 모든 날
  lexicon: according to its kind / all the days
  rationale: ‘종류대로’는 창조 질서의 구분을 드러내며, ‘모든 날 동안’은 단순한 ‘항상’보다 원문 반복성을 더 직접적으로 살립니다.
theological_decisions:
- issue: ‘새롭고 의로운 본성’의 신학적 범위
  chosen_reading: 창조된 것들이 본래 질서에서 새롭게 재구성되어 죄를 짓지 않는 방향으로 정렬된 상태로 읽었습니다.
  alternative_readings:
  - 개별 인간의 내적 도덕성 변화로 제한하는 읽기
  - 종말론적 새창조 질서에 대한 예표로만 제한하는 읽기
  rationale: 문맥과 POB의 audit trail은 단순한 개인 윤리보다 피조세계의 종류별 질서와 지속성을 강조하므로, 이를 좁히지 않고 유지했습니다.
  doctrine_reference: 창조론 / 새창조
