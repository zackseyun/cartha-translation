theological_decisions:
- issue: ‘새롭고 의로운 본성’의 신학적 범위
  chosen_reading: 창조된 것들이 본래 질서에서 새롭게 재구성되어 죄를 짓지 않는 방향으로 정렬된 상태로 읽었습니다.
  alternative_readings:
  - 개별 인간의 내적 도덕성 변화로 제한하는 읽기
  - 종말론적 새창조 질서에 대한 예표로만 제한하는 읽기
  rationale: 문맥과 POB의 audit trail은 단순한 개인 윤리보다 피조세계의 종류별 질서와 지속성을 강조하므로, 이를 좁히지 않고 유지했습니다.
