revisions:
- from: 그리고 이 모든 것은 하늘의 돌판에 정해져 기록되었으며, 불의는 없습니다. 그리고 그들에게 정해진 길에서 벗어나는 모든 사람은—[a][b]
  to: 그리고 이 모든 일은 하늘의 서판들에 정해지고 기록되었으며, 불의는 없습니다.[a] 그리고 그들이 그 안에서 걸어가도록 정해진 길에서 벗어나는 모든 사람은—
  rationale: 원문의 두 번의 ‘정하다’ 어근을 ‘정해지고/정해진’으로 보존하고, 천상 서판의 복수형과 ‘그 안에서 걸어가도록’이라는 목적·용법을 복원했습니다. ‘불의는 없습니다’는 이어지는 이탈자 절과 분리하여, 이탈자들에게 불의가 없다는 뜻으로 오독되지 않게 했습니다. 대시는 다음 절에서 완결될 문장을 자연스럽게 표시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:17Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 초안은 ‘불의는 없습니다’와 이어지는 ‘...벗어나는 모든 사람’ 절을 분리한 점과 절이 다음 구절로 이어짐을 대시로 표시한 점은 원문 및 영어 POB의 최근 교정에 부합합니다. 그러나 ‘그들이 그 안에서 걸어가도록’이라는 경로의 목적·용법을 생략했고, 복수형 ‘하늘의 서판들’을 단수 ‘돌판’으로 옮겼습니다.
  naturalness: ‘하늘의 서판들’은 천상 기록판을 가리키는 문맥에서 ‘하늘의 돌판’보다 자연스럽고 수 일치도 맞습니다. ‘그들이 그 안에서 걸어가도록 정해진 길’은 원문의 관계절을 충실하면서도 현대 한국어로 명료하게 재현합니다.
  terminology: śar'a의 반복은 ‘정해지고/정해진’으로 유지합니다. ṣlāt는 복수형이므로 ‘서판들’로, ʿaməṣa는 영어 POB 및 문맥을 따라 ‘불의’로 유지합니다.
  issues:
  - severity: medium
    issue: ‘walk in’에 해당하는 표현이 번역문에서 빠졌습니다.
    rationale: 원문 ከመ ይሖሩ ባቲ와 영어 POB의 ‘for them to walk in’은 그 길이 그들이 그 안에서 걸어가도록 정해졌음을 명시합니다. 단순히 ‘그들에게 정해진 길’만으로는 이 요소가 탈락합니다.
  - severity: low
    issue: ‘heavenly tablets’의 복수성이 반영되지 않았습니다.
    rationale: ጽላተ ሰማይ는 복수의 천상 서판을 가리키므로 ‘하늘의 서판들’이 수와 문맥에 더 충실합니다.
  - severity: low
    issue: 현행 [a][b] 앵커는 문장 끝 대시 뒤에 함께 놓여 각주 대상이 불명확합니다.
    rationale: 해석 대안 각주는 ‘불의는 없습니다’ 절에, 문장 계속 표지는 번역문 자체의 대시로 처리하는 것이 명료합니다. 영어 감사 이력의 b는 현 번역의 대시가 이미 수행하는 절 경계 표지이므로 별도 한국어 각주로 유지할 필요가 없습니다.
