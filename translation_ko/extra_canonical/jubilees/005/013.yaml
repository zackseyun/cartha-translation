  text: And all this was ordained and written on the heavenly tablets, and there is no injustice; and all who depart from the path that was ordained for them to walk in—
  footnotes:
  - marker: a
    text: Or 'and there is no injustice for all who depart'.
    reason: previous_rendering
  - marker: b
    text: Or 'to walk in.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 모든 것은 하늘의 돌판에 정해져 기록되었으며, 불의는 없습니다. 그리고 그들에게 정해진 길에서 벗어나는 모든 사람은—[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርዐ / ተሠረዐ
  english_pob_choice: ordained
  chosen_korean: 정해져
  alternatives_korean:
  - 제정되어
  - 규정되어
  - 임명되어
  lexicon: Ge'ez śar'a
  rationale: 같은 어근이 앞부분의 ‘ordained’와 뒤의 ‘ordained for them’에 반복되므로, 한국어에서도 ‘정하다/정해지다’로 반복성을 살렸습니다.
- source_word: ጽላተ ሰማይ
  english_pob_choice: heavenly tablets
  chosen_korean: 하늘의 돌판
  alternatives_korean:
  - 하늘의 판
  - 하늘의 서판
  - 천상의 돌판
  lexicon: Ge'ez ṣlāt
  rationale: 문자 그대로 ‘판/돌판’의 이미지를 살리되, 한국어 성서 문맥에서 자연스럽게 읽히도록 ‘하늘의 돌판’으로 옮겼습니다.
- source_word: ዐመፃ
  english_pob_choice: injustice
  chosen_korean: 불의
  alternatives_korean:
  - 불공정
  - 부정
  - 부당함
  lexicon: Ge'ez ʿaməṣa
  rationale: 법적·도덕적 왜곡을 함께 담는 보다 성경적인 한국어로 ‘불의’를 택해, POB의 ‘injustice’ 의미를 직접 반영했습니다.
- source_word: በእንተ ሠርዐተ ሎሙ ከመ ይሖሩ ባቲ
  english_pob_choice: the path that was ordained for them to walk in
  chosen_korean: 그들에게 정해진 길
  alternatives_korean:
  - 그들이 걸어가도록 정해진 길
  - 그들이 그 안에서 걸어가야 할 길
  - 그들에게 마련된 길
  lexicon: Ge'ez ሠርዐተ / ይሖሩ
  rationale: 뒤의 절이 다음 절로 이어지므로, 여기서는 핵심 명사구를 먼저 제시해 문맥상 이어짐을 드러냈습니다. ‘walk in’은 다음 절과 함께 이어질 표현으로 남겨 두었습니다.
theological_decisions:
- issue: ‘불의가 없다’와 ‘길에서 벗어나는 자들’의 관계
  chosen_reading: ‘그리고 불의는 없습니다.’와 ‘그리고 그들에게 정해진 길에서 벗어나는 모든 사람은—’을 분리해 번역했습니다.
  alternative_readings:
  - ‘그리고 그들에게 불의는 없습니다.’
  - ‘그리고 벗어나는 모든 사람에게는 불의가 없습니다.’
  rationale: 수정된 POB 주해처럼 접속사 ‘그리고’를 분리해 처리해야, 불의의 부재가 이탈자들에게 귀속되는 오독을 막고 두 절의 긴장을 유지할 수 있습니다.
  doctrine_reference: 문맥상 공의와 심판의 진술을 훼손하지 않는 번역 원칙
