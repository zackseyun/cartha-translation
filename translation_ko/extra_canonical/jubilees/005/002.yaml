  text: And lawlessness increased on the earth, and all flesh corrupted its way, from men to cattle, and to beasts, and to birds, and to everything that moves on the earth. All of them corrupted their ways and their ordinances, and they began to devour one another; and lawlessness increased on the earth, and every imagination of the thoughts of all the children of men was thus evil all the days.
translation:
  language: ko
  text: 그리고 땅 위에 불법이 더 심해졌으며, 모든 육체가 자기의 길을 더럽혔습니다. 곧 사람에게서부터 가축과 들짐승과 새와 땅 위에서 움직이는 모든 것에 이르기까지 그랬습니다. 그들 모두가 자기의 길과 자기의 규례를 더럽혔고, 서로 잡아먹기 시작했습니다. 또 땅 위에 불법이 더 심해졌으며, 모든 사람 자녀들의 생각의 모든 상상은 모든 날 동안 이렇게 악했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቀት፡ ዐመፃ፡ / lawlessness
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 무법
  - 불의
  lexicon: standard biblical lexicon
  rationale: Geez의 ዐመፃ는 도덕적·언약적 질서의 파괴를 가리키므로, POB의 'lawlessness'를 가장 सीधे하게 반영하는 '불법'이 적절합니다.
- source_word: ዘሥጋ፡ / all flesh
  english_pob_choice: all flesh
  chosen_korean: 모든 육체
  alternatives_korean:
  - 모든 사람
  - 모든 생명
  lexicon: standard biblical lexicon
  rationale: 원문은 사람만이 아니라 가축·들짐승·새까지 포괄하므로, 문맥상 생물 전체를 묶는 '모든 육체'가 가장 정확합니다.
- source_word: ፍኖተ / ways
  english_pob_choice: their way
  chosen_korean: 길
  alternatives_korean:
  - 행로
  - 삶의 방식
  lexicon: standard biblical lexicon
  rationale: Geez의 '길'은 삶의 행실과 궤도를 뜻하므로, 문맥에 맞게 '자기의 길'로 옮겼습니다.
- source_word: ሥርዐቶሙ / ordinances
  english_pob_choice: their ordinances
  chosen_korean: 규례
  alternatives_korean:
  - 법규
  - 질서
  lexicon: standard biblical lexicon
  rationale: 영어 POB가 'ordinances'로 풀어낸 규범성은 한국어 성서어휘 '규례'가 가장 잘 전달합니다.
theological_decisions:
- issue: 자연과 인간의 보편적 타락을 어떻게 한국어로 드러낼지
  chosen_reading: 사람뿐 아니라 가축, 들짐승, 새, 땅 위의 모든 움직이는 것까지 포함하는 전면적 타락으로 옮겼습니다.
  alternative_readings:
  - 인간 사회의 타락에만 초점을 두는 번역
  - '''육체''를 사람에게만 한정하는 번역'
  rationale: 원문과 영어 POB 모두 범위를 피조세계 전반으로 넓히며, 뒤이은 '서로 잡아먹기 시작했습니다'까지 고려하면 보편적 붕괴를 드러내는 번역이 필요합니다.
  doctrine_reference: 창세기적 창조 질서의 붕괴, 피조세계의 타락
