base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/019.yaml
  text: But for all those who corrupted their ways and their plans before the Flood[a], no favor was shown, except to Noah alone; for favor was shown to him on behalf of his sons, whom he saved from the waters of the Flood because of him, since his heart was righteous in all his ways, according to what had been commanded concerning him, and he did not deviate from anything that had been appointed for him.
  footnotes:
  - marker: a
    text: The wording 'before the Flood' is interpretive for a difficult phrase involving 'the waters of the Flood.' The sense is that no one else received favorable regard in that generation except Noah.
    reason: lexical_alternative
    anchor_ref: '5:19'
  - marker: b
    text: Or 'on account of his sons'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 대홍수 전에 자기들의 길과 계획을 더럽힌 모든 사람에게는 아무 호의도 베풀어지지 않았습니다. 오직 노아에게만 그랬는데, 그의 아들들로 인해 그에게 호의가 베풀어졌고, 그는 그 때문에 대홍수의 물에서 그 아들들을 건져 냈습니다. 그의 마음은 그에 관해 명령된 대로 그의 모든 길에서 의로웠으며, 그에게 정해진 것 가운데 어떤 것에서도 벗어나지 않았기 때문입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አማሰኑ፡ ፍኖዊሆሙ፡ ወምክርሙ
  english_pob_choice: corrupted their ways and their plans
  chosen_korean: 자기들의 길과 계획을 더럽힌
  alternatives_korean:
  - 자기들의 길과 생각을 부패시킨
  - 자기들의 행실과 계책을 타락시킨
  lexicon: አማሰነ / ፍኖ / ምክር
  rationale: 행동과 의도를 함께 가리키는 병렬을 살리기 위해 ‘길과 계획’으로 옮기고, 도덕적 훼손을 나타내는 동사로 ‘더럽힌’을 선택했습니다.
- source_word: ኢተነሥአ ገጾሙ
  english_pob_choice: no favor was shown
  chosen_korean: 아무 호의도 베풀어지지 않았습니다
  alternatives_korean:
  - 어떠한 호의도 보이지 않았습니다
  - 아무 호의도 받지 못했습니다
  lexicon: ገጽ / ነሥአ
  rationale: 문맥상 단순한 ‘얼굴’이 아니라 호의적 시선·은총의 표지를 뜻하므로, 영어 POB의 ‘favor’에 맞춰 ‘호의’로 번역했습니다.
- source_word: በእንቲአሁ
  english_pob_choice: on behalf of his sons
  chosen_korean: 그의 아들들로 인해
  alternatives_korean:
  - 그의 아들들을 위하여
  - 그의 아들들을 대신하여
  lexicon: በእንተ
  rationale: 주석이 지적하듯 이 구는 ‘~때문에’가 아니라 ‘~을 위하여/대신하여’의 뜻을 가지므로, 뒤의 ‘그 때문에’와의 인과 관계를 살릴 수 있게 본문에는 자연스러운 한국어로 옮기고 각주로 보완했습니다.
- source_word: ጻድቅ ይእቲ ልቡ
  english_pob_choice: his heart was righteous
  chosen_korean: 그의 마음은 … 의로웠으며
  alternatives_korean:
  - 그의 심장은 … 의로웠으며
  - 그의 마음은 … 올바랐으며
  lexicon: צדיק / לב
  rationale: 히브리어적 관용을 반영해 ‘마음’과 ‘의로웠다’를 유지하여 도덕적·언약적 정당성을 드러냈습니다.
- source_word: ወኢተዐደወ እምኵሉ ዘሥሩዕ ሎቱ
  english_pob_choice: he did not deviate from anything that had been appointed for him
  chosen_korean: 그에게 정해진 것 가운데 어떤 것에서도 벗어나지 않았기 때문입니다
  alternatives_korean:
  - 그에게 맡겨진 어떤 것에서도 빗나가지 않았기 때문입니다
  - 그에게 규정된 모든 것에서 떠나지 않았기 때문입니다
  lexicon: ዘሥሩዕ / ነዓደወ
  rationale: ‘appointed’의 수동적 지정과 ‘deviate’의 이탈 의미를 함께 살려, 지나치게 법률적으로 굳지 않도록 ‘정해진 것’과 ‘벗어나지 않았다’를 택했습니다.
theological_decisions:
- issue: 노아에게 주어진 호의의 근거와 ‘아들들로 인해’의 관계
  chosen_reading: 노아 자신에게만 호의가 베풀어졌고, 그 호의는 그의 아들들을 위한/대신한 방향으로 나타나 그가 그들을 홍수에서 건져 냈다는 흐름으로 읽었습니다.
  alternative_readings:
  - 노아가 아들들 때문에 호의를 입었다
  - 노아가 아들들로 말미암아 호의를 받았다
  rationale: 게에즈 본문과 POB 주석은 ‘그의 아들들로 인해’가 뒤의 구절과 함께 읽혀야 함을 보여 주므로, 노아의 특별한 호의와 그 호의의 파생 효과를 분리해 표현했습니다.
  doctrine_reference: 문맥적 인과 관계 및 번역 주석(a, b)
