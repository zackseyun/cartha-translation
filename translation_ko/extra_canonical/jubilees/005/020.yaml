translation:
  language: ko
  text: 그리고 주께서 말씀하시기를, 땅 위에 있는 모든 것, 곧 사람으로부터 가축과 들짐승과 하늘의 새들과 땅에서 움직이는 모든 것을 내가 멸하겠다고 하셨습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቤ / said
  english_pob_choice: And the Lord said that He would destroy
  chosen_korean: 주께서 말씀하시기를
  alternatives_korean:
  - 주께서 말씀하셨습니다
  - 주께서 말씀하시되
  lexicon: 말씀하시다
  rationale: 지시동사 ‘말하다’보다 하나님의 발화에 자연스럽고 경건한 한국어 표현인 ‘말씀하시다’를 택해, 보고절의 성격을 유지했습니다.
- source_word: ይደመስስ
  english_pob_choice: He would destroy
  chosen_korean: 내가 멸하겠다고
  alternatives_korean:
  - 내가 파괴하겠다고
  - 내가 없애겠다고
  lexicon: 멸하다
  rationale: Ge'ez 동사는 능동적 미래/의지의 의미로 읽히므로, 수동 명령형이 아니라 ‘멸하겠다’로 옮겨 주체적 파괴 의도를 반영했습니다.
- source_word: ኵሎ ዘዲበ የብስ
  english_pob_choice: everything that is on the dry land
  chosen_korean: 땅 위에 있는 모든 것
  alternatives_korean:
  - 마른땅 위에 있는 모든 것
  - 지면 위에 있는 모든 것
  lexicon: dry land
  rationale: ‘dry land’는 홍수 심판 맥락의 ‘땅 위’로 자연스럽게 드러나며, 지나치게 기술적인 ‘마른땅’보다 문맥상 이해를 우선했습니다.
- source_word: እስከ ... ወእስከ
  english_pob_choice: from man to cattle, to beasts, and to the birds of heaven, and to whatever moves on the earth
  chosen_korean: 곧 사람으로부터 가축과 들짐승과 하늘의 새들과 땅에서 움직이는 모든 것
  alternatives_korean:
  - 사람에서부터 가축과 들짐승과 하늘의 새들과 땅에서 움직이는 모든 것까지
  - 사람부터 가축, 들짐승, 하늘의 새, 그리고 땅에서 기어다니는 모든 것
  lexicon: from ... to ...
  rationale: 열거의 범위를 나타내는 반복 구조를 한국어의 ‘곧 …로부터 …까지’ 계열로 풀어, 시작점과 종착점을 모두 드러냈습니다.
theological_decisions:
- issue: 직접화법과 간접화법
  chosen_reading: 서술자는 ‘주께서 말씀하시기를… 내가 멸하겠다’라는 간접화법으로 옮겼습니다.
  alternative_readings:
  - 주께서 말씀하시되, 내가 멸하겠다
  - ‘내가 멸하겠다’라고 주께서 말씀하셨습니다
  rationale: Ge'ez 본문은 보고동사 뒤에 종속절이 오는 구조이므로, 영어 POB의 수정 취지에 따라 직접 인용부호를 두지 않고 간접화법으로 재구성했습니다.
  doctrine_reference: 서사 문체와 인용 구조 보존
- issue: 심판 행위의 주체
  chosen_reading: 멸하시는 주체를 하나님으로 분명히 드러냈습니다.
  alternative_readings:
  - 자연재해가 모든 것을 멸한다는 식으로 완화
  - 주께서 없애신다고 완곡하게 처리
  rationale: 본문은 심판의 주체를 주께로 직접 돌리므로, 이를 약화하지 않고 능동적 신적 심판으로 보존했습니다.
  doctrine_reference: 신적 주권과 심판
