revisions:
- from: 그리고 주께서 말씀하시기를, 땅 위에 있는 모든 것, 곧 사람으로부터 가축과 들짐승과 하늘의 새들과 땅에서 움직이는 모든 것을 내가 멸하겠다고 하셨습니다.[a][b]
  to: 주께서 마른 땅 위에 있는 모든 것, 곧 사람과 가축과 짐승과 하늘의 새와 땅에서 움직이는 모든 것을 멸하시겠다고 말씀하셨습니다.[a][b]
  rationale: 간접화법을 일관되게 하여 원문의 3인칭 능동 동사와 영어 POB의 수정 취지를 반영했습니다. 또한 “마른 땅”을 복원하고, 열거를 자연스러운 한국어 병렬 구조로 정리했습니다. 직접화법 가능성은 본문에 강제하지 않고 각주에만 남겼습니다.
