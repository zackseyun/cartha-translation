  text: And their fathers were watching, and after this they were bound in the depths of the earth forever, until the day of the great judgment, for judgment upon all who corrupted their ways and their deeds before the Lord.
  footnotes:
  - marker: a
    text: Or 'for the judgment of all'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 아버지들은 지켜보고 있었습니다. 그리고 이 일 뒤에 그들은 땅의 깊은 곳에 영원히 묶여 있을 것이며, 큰 심판의 날까지, 주 앞에서 자기들의 길과 자기들의 행위를 더럽힌 모든 자들 위에 내릴 심판을 위하여 그러할 것입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኔጽሩ
  english_pob_choice: were watching
  chosen_korean: 지켜보고 있었습니다
  alternatives_korean:
  - 보고 있었습니다
  - 감시하고 있었습니다
  lexicon: watch/look on
  rationale: 단순한 시각 행위보다 진행 중인 관찰 상태를 살려 ‘지켜보고 있었습니다’로 옮겼습니다.
- source_word: ተአስሩ
  english_pob_choice: they were bound
  chosen_korean: 묶여 있을 것이며
  alternatives_korean:
  - 매여 있을 것이며
  - 구속될 것이며
  lexicon: bind
  rationale: 문맥상 지하의 깊은 곳에 갇힌 상태를 나타내므로 자연스러운 ‘묶여 있을 것’으로 처리했습니다.
- source_word: መዓምቅቲሃ ለምድር
  english_pob_choice: the depths of the earth
  chosen_korean: 땅의 깊은 곳
  alternatives_korean:
  - 땅의 깊은 심연
  - 땅속 깊은 곳
  lexicon: depths/earth
  rationale: 직역성을 유지하되 한국어에서 읽히는 표현으로 다듬었습니다.
- source_word: ዕለተ ኵነኔ ዐባይ
  english_pob_choice: the day of the great judgment
  chosen_korean: 큰 심판의 날
  alternatives_korean:
  - 위대한 심판의 날
  - 대심판의 날
  lexicon: judgment/day
  rationale: ‘큰 심판’은 형용 구조를 자연스럽게 살리면서도 종말론적 강조를 유지합니다.
- source_word: ኵሎሙ እለ አማሰኑ ፍኖቶሆሙ ወምግባሪሆሙ
  english_pob_choice: all who corrupted their ways and their deeds
  chosen_korean: 자기들의 길과 자기들의 행위를 더럽힌 모든 자들
  alternatives_korean:
  - 자기들의 길과 행실을 타락시킨 모든 사람들
  - 자기들의 길과 행위를 망친 모든 이들
  lexicon: corrupted ways and deeds
  rationale: ‘길’과 ‘행위’의 병렬을 유지하고, 도덕적 타락의 강도를 ‘더럽힌’으로 전달했습니다.
theological_decisions:
- issue: 마지막 절구의 목적/판정 구조
  chosen_reading: ‘큰 심판의 날까지’와 ‘심판을 위하여’의 이중 구조를 살려, 감금의 기간과 그 목적을 모두 드러냈습니다.
  alternative_readings:
  - ‘큰 심판의 날에 이를 때까지’로 단순화
  - ‘심판하기 위하여’로 목적만 강조
  rationale: 게에즈 원문은 시간 종결과 심판 목적을 함께 나타내므로 둘을 모두 보존하는 것이 좋습니다.
  doctrine_reference: 종말론적 심판과 보응의 기간성
- issue: ‘주 앞에서’의 표현
  chosen_reading: 경외적 서술을 유지하기 위해 ‘주 앞에서’로 직역했습니다.
  alternative_readings:
  - ‘야훼 앞에서’
  - ‘하나님 앞에서’
  rationale: 본문의 게에즈는 주권자 앞의 행위를 말하며, 여기서는 서술 내부의 일반적 주칭을 유지하는 것이 문맥상 가장 안정적입니다.
  doctrine_reference: 하나님 앞에서의 도덕적 책임
