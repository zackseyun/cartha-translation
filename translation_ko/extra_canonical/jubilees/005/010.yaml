  source_fidelity: 수동 과거형 ተአስሩ(‘그들은 묶였다/결박되었다’)를 초안의 미래·지속 표현 ‘묶여 있을 것이며’로 옮긴 것은 시제와 상을 바꿉니다. 원문의 ‘영원토록/큰 심판의 날까지’라는 긴장된 시간 표현과, 심판이 ‘모든 자들 위에’ 임한다는 범위는 보존해야 합니다.
  naturalness: 초안은 ‘큰 심판의 날까지, ... 심판을 위하여 그러할 것입니다’가 길고 지시어 ‘그러할 것입니다’의 선행 내용이 불분명합니다. 심판의 날을 뒤의 심판 절과 동격으로 연결하면 현대 한국어 합쇼체에서 더 자연스럽고 원문의 논리도 명료합니다.
