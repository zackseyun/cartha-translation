revisions:
- from: 그들의 아버지들은 지켜보고 있었습니다. 그리고 이 일 뒤에 그들은 땅의 깊은 곳에 영원히 묶여 있을 것이며, 큰 심판의 날까지, 주 앞에서 자기들의 길과 자기들의 행위를 더럽힌 모든 자들 위에 내릴 심판을 위하여 그러할 것입니다.[a]
  to: 그들의 아버지들은 지켜보고 있었습니다. 이 일 뒤에 그들은 땅의 깊은 곳에 영원토록, 큰 심판의 날, 곧 주 앞에서 자기들의 길과 행위를 타락시킨 모든 자들에게 심판이 내려질 날까지 묶였습니다.[a]
  rationale: 원문의 과거 수동형을 복원하고, ‘큰 심판의 날’과 뒤따르는 심판 대상 구절을 한국어의 자연스러운 동격 구조로 재구성했습니다. ‘영원토록’과 ‘그 날까지’가 함께 놓인 원문의 표현은 조화시키거나 해소하지 않고 그대로 유지했습니다. 대안적 속격/관계 해석은 주석으로 보존했습니다.
