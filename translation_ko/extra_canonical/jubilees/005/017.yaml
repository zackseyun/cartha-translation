  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: ko
  text: 그리고 이스라엘 자손에 관하여는 이렇게 기록되고 정해졌습니다. 그들이 의롭게 그에게 돌아오면, 그는 그들의 모든 허물을 용서하시고 그들의 모든 죄를 사하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  english_pob_choice: it has been written and ordained
  chosen_korean: 기록되고 정해졌습니다
  alternatives_korean:
  - 기록되었습니다
  - 기록되고 규정되었습니다
  - 기록되고 제정되었습니다
  lexicon: source-note
  rationale: 기록됨과 규정/제정됨이라는 이중 표현을 한국어에서 간결하게 묶어, 문서적 권위와 법적 확정성을 함께 살렸습니다.
