  text: 'And concerning the children of Israel it has been written and ordained: if they turn to him in righteousness, he will forgive all their transgressions and pardon all their sins.'
translation:
  language: ko
  text: 그리고 이스라엘 자손에 관하여는 이렇게 기록되고 정해졌습니다. 그들이 의로 그에게 돌아오면, 그는 그들의 모든 허물을 용서하고 그들의 모든 죄를 사하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ፡
  english_pob_choice: it has been written and ordained
  chosen_korean: 기록되고 정해졌습니다
  alternatives_korean:
  - 기록되었습니다
  - 기록되고 규정되었습니다
  - 기록되고 제정되었습니다
  lexicon: source-note
  rationale: 기록됨과 규정/제정됨이라는 이중 표현을 한국어에서 간결하게 묶어, 문서적 권위와 법적 확정성을 함께 살렸습니다.
- source_word: በጽድቅ፡
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
  - 의 안에서
  - 의롭게
  - 의 안에
  lexicon: δικαιοσύνη / 의
  rationale: 행위 상태를 나타내는 부사구로 자연스럽게 옮기되, 도덕적·언약적 정당성을 드러내는 '의'를 유지했습니다.
- source_word: የኀድግ፡ ኵሎ፡ አበሳሆሙ፡ ወ*ይስሬ፡ ኵሎ፡ ኀጢአቶሙ።
  english_pob_choice: he will forgive all their transgressions and pardon all their sins
  chosen_korean: 그들의 모든 허물을 용서하고 그들의 모든 죄를 사하실 것입니다
  alternatives_korean:
  - 그들의 모든 범법을 용서하고 그들의 모든 죄를 씻으실 것입니다
  - 그들의 모든 잘못을 용서하고 그들의 모든 죄를 없애실 것입니다
  lexicon: ἀφίημι / source-note
  rationale: '''허물''은 첫 항목의 위반·범죄 성격을, ''죄''는 두 번째 항목의 일반적 죄책을 구분해 English POB의 이중 동사를 자연스럽게 반영했습니다.'
- source_word: ደቂቀ፡ እስራኤል፡
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  - 이스라엘 사람들
  lexicon: קְדָשִׁים/정체성 용례
  rationale: 성서적 집단 표지로서의 관용 표현을 살리되, 현대 한국어에서 가장 익숙하고 간명한 '이스라엘 자손'을 택했습니다.
theological_decisions:
- issue: 회개/귀환의 방향을 나타내는 조건절
  chosen_reading: 그들이 의로 그에게 돌아오면
  alternative_readings:
  - 그들이 그에게 의롭게 돌아오면
  - 그들이 올바름 가운데 그에게 돌아오면
  rationale: 문맥상 단순한 방향 이동이 아니라 하나님께로의 언약적 귀환을 뜻하므로, '돌아오면'을 유지하면서 '의로'를 앞에 두어 조건의 성격을 드러냈습니다.
  doctrine_reference: 회개와 용서의 조건성에 대한 본문 수준의 진술
