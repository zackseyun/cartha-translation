- source_word: የኀድግ፡ ኵሎ፡ አበሳሆሙ፡ ወ*ይስሬ፡ ኵሎ፡ ኀጢአቶሙ።
  english_pob_choice: he will forgive all their transgressions and pardon all their sins
  chosen_korean: 그들의 모든 허물을 용서하고 그들의 모든 죄를 사하실 것입니다
  alternatives_korean:
  - 그들의 모든 범법을 용서하고 그들의 모든 죄를 씻으실 것입니다
  - 그들의 모든 잘못을 용서하고 그들의 모든 죄를 없애실 것입니다
  lexicon: ἀφίημι / source-note
  rationale: '''허물''은 첫 항목의 위반·범죄 성격을, ''죄''는 두 번째 항목의 일반적 죄책을 구분해 English POB의 이중 동사를 자연스럽게 반영했습니다.'
- source_word: ደቂቀ፡ እስራኤል፡
