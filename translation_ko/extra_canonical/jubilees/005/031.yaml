  text: And the waters receded from upon the earth in the fifth week, in its seventh year; and on the seventeenth day in the second month the earth was dry.
translation:
  language: ko
  text: 그리고 다섯째 주의 일곱째 해에 물이 땅 위에서 물러갔습니다. 그리고 둘째 달 열일곱째 날에 땅이 말랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነጽፈ፡ ማያት፡ አመልዐልተ፡ ምድር፡
  english_pob_choice: the waters receded from upon the earth
  chosen_korean: 물이 땅 위에서 물러갔습니다
  alternatives_korean:
  - 물이 땅 위에서 사라졌습니다
  - 물이 땅에서 물러났습니다
  lexicon: recede / receded
  rationale: Geʽez의 동사는 물이 ‘사라지다’보다 ‘물러가다’에 더 가깝고, POB의 수정된 영어도 같은 의미를 반영하므로 한국어도 이동·후퇴의 이미지를 살렸습니다.
- source_word: በሱባዔ፡ ኃምስ፡ በሳብዕ፡ ዓመት፡
  english_pob_choice: in the fifth week, in its seventh year
  chosen_korean: 다섯째 주, 그 일곱째 해에
  alternatives_korean:
  - 다섯째 주에, 그 해의 일곱째 해에
  - 다섯째 주의 일곱째 해에
  lexicon: week / year
  rationale: 수사 구조를 그대로 살려 ‘주’와 ‘해’를 대응시키되, 소유 대명사 ‘그’로 영어 POB의 자연스러운 관계를 반영했습니다.
- source_word: ወአመ፡ *ዐሡሩ፡ ወሰብዑ፡ ዕለት፡ በካልእ፡ ወርኀ፡
  english_pob_choice: on the seventeenth day in the second month
  chosen_korean: 둘째 달 열일곱째 날에
  alternatives_korean:
  - 둘째 달의 열일곱째 날에
  - 두 번째 달 열일곱째 날에
  lexicon: seventeenth day / second month
  rationale: 달과 날의 순서를 한국어 관용에 맞게 옮기면서도 날짜 정보는 원문과 동일하게 보존했습니다.
- source_word: የብሰት፡ ምድር።
  english_pob_choice: the earth was dry
  chosen_korean: 땅이 말랐습니다
  alternatives_korean:
  - 땅이 건조해졌습니다
  - 땅이 메말랐습니다
  lexicon: dry
  rationale: 결과 상태를 간결하고 자연스럽게 옮기되, 성경적 서술에서 흔한 ‘말라 있다’의 상태 전환을 살렸습니다.
theological_decisions:
- issue: 홍수 이후 물의 소멸/후퇴 표현
  chosen_reading: ‘물이 땅 위에서 물러갔습니다’로 번역해 단순한 소멸이 아니라 물이 빠져나가는 사건성을 드러냈습니다.
  alternative_readings:
  - 물이 사라졌습니다
  - 물이 없어졌습니다
  rationale: 본문은 홍수 물이 지표면에서 점차 물러나는 장면을 말하므로, 소멸보다 후퇴의 동사를 택하는 것이 서술 의도에 더 가깝습니다.
  doctrine_reference: 창세기 홍수 서술과 평행하는 시간표현의 서술적 정확성
