revisions:
- from: 그리고 그들이 그 안에서 걷지 않는다면, 모든 피조물과 모든 종류를 위한 심판이 기록되어 있습니다. 하늘에나 땅에나, 빛 가운데나 어둠 가운데나, 스올에나 깊음에나, 어둠의 장소에나 아무것도 없습니다[a] — 그들의 모든 심판은 정해져 있고, 기록되어 있고, 새겨져 있습니다.
  to: 그리고 그들이 그 길을 걷지 않으면, 모든 피조물과 모든 종류에 대한 심판이 기록되어 있습니다. 하늘에나 땅에나, 빛 가운데나 어둠 가운데나, 스올에나 깊음에나, 어둠의 장소에나 심판을 받지 않는 것은 하나도 없습니다. 그들 각자의 모든 심판은 정해져 있고, 기록되어 있고, 새겨져 있습니다.[a]
  rationale: 우주적 열거를 존재의 부정으로 번역한 문맥상 오류를 바로잡아, 심판의 보편적 적용을 드러냈습니다. ‘스올’과 ‘깊음’을 포함한 열거 및 법적 기록을 나타내는 마지막 삼중 병렬은 유지했습니다. 영어 감사본의 ‘there is nothing’이라는 압축된 문구보다 게에즈 본문과 문맥의 법정적 의미를 우선하여, 심판 범위 밖에 있는 것이 없다는 뜻을 한국어로 명시했습니다.
  reviewer_model: gpt-5.6-terra
