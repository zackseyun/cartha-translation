base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/005/014.yaml
  text: And if they do not walk in it[a], judgment is written for every creature and for every kind. And there is nothing in heaven or on earth, or in light or in darkness, or in Sheol or in the deep or in the place of darkness—all their judgments are ordained and written and engraved.
  footnotes:
  - marker: a
    text: The sequence 'in heaven ... on earth ... in light ... in darkness ... in Sheol ... in the deep ... in the place of darkness' reflects a comprehensive cosmological register. The final triad 'ordained and written and engraved' is retained to preserve the legal-record imagery.
    reason: cultural_note
    anchor_ref: '5:14'
  - marker: b
    text: Or 'everything is ordained'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들이 그 길을 걷지 않으면, 모든 피조물과 모든 종류에 대한 심판이 기록되어 있습니다. 하늘에나 땅에나, 빛 가운데나 어둠 가운데나, 스올에나 깊음에나, 어둠의 장소에나 심판을 받지 않는 것은 하나도 없습니다. 그들 각자의 모든 심판은 정해져 있고, 기록되어 있고, 새겨져 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘 … 땅 … 빛 … 어둠 … 스올 … 깊음 … 어둠의 장소’라는 연속 열거는 우주 전체를 포괄하는 표현입니다. 마지막의 ‘정해져 있고, 기록되어 있고, 새겨져 있습니다’라는 세 동사는 법적 기록의 이미지를 보존합니다.
    reason: cultural_note
lexical_decisions:
- source_word: ኵሉ፡ ፍጥረት፡ ወለኵሉ፡ ትዝምድ
  english_pob_choice: for every creature and for every kind
  chosen_korean: 모든 피조물과 모든 종류
  alternatives_korean:
  - 모든 창조물과 모든 부류
  - 모든 피조물과 모든 계열
  lexicon: 피조물 / 종류
  rationale: 피조물은 창조된 존재 전체를 가리키는 직접 대응어이고, ትዝምድ은 혈통·종류·계열의 포괄적 범주이므로 ‘종류’로 옮겨 범주성의 반복을 살렸습니다.
- source_word: ምኵናነ
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  lexicon: 심판
  rationale: 문맥이 법적 기록과 선언을 강조하므로 단순한 ‘판결’보다 선고적·종말론적 뉘앙스를 지닌 ‘심판’이 더 적절합니다.
- source_word: በሲኦል ... ወውስተ፡ መጽልም
  english_pob_choice: in Sheol or in the deep or in the place of darkness
  chosen_korean: 스올에나 깊음에나, 어둠의 장소에나
  alternatives_korean:
  - 스올에나 심연에나, 어둠의 곳에나
  - 스올에나 깊은 곳에나, 어둠의 장소에나
  lexicon: 스올 / 깊음 / 어둠의 장소
  rationale: 시퀀스를 보존하기 위해 스올, 깊음, 어둠의 장소를 병렬로 유지했고, መጽልም의 반복되는 darkness 어휘를 따라 ‘어둠의 장소’로 통일했습니다.
- source_word: ሥሩዕ፡ ወጽሑፍ፡ ወቅሩጽ
  english_pob_choice: ordained and written and engraved
  chosen_korean: 정해져 있고, 기록되어 있고, 새겨져 있습니다
  alternatives_korean:
  - 정해져 있고, 쓰여 있고, 새겨져 있습니다
  - 규정되어 있고, 기록되어 있고, 새겨져 있습니다
  lexicon: 정해지다 / 기록되다 / 새겨지다
  rationale: 법적 기록 이미지를 살리되 한국어에서 자연스러운 완료형 연결로 옮겨, 정해짐-기록-각인의 삼중 병렬을 보존했습니다.
theological_decisions:
- issue: 포괄적 우주 목록의 번역 범위
  chosen_reading: ‘하늘에나 땅에나, 빛 가운데나 어둠 가운데나, 스올에나 깊음에나, 어둠의 장소에나’로 우주 전 범위를 병렬적으로 드러냈습니다.
  alternative_readings:
  - ‘천상과 지상’처럼 압축
  - ‘지옥’으로 번역
  rationale: 본문은 창조 질서 전역을 열거하며 심판의 보편성을 강조하므로, 지리적·영적 범주를 압축하거나 교리적으로 특정화하지 않고 원문의 포괄성을 유지했습니다.
  doctrine_reference: 보편 심판 / 우주적 총괄성
- issue: ‘their judgments’의 명시
  chosen_reading: ‘그들의 모든 심판’으로 옮겨 법적 주체성과 개별 심판의 누적을 드러냈습니다.
  alternative_readings:
  - ‘모든 것이 정해져 있습니다’
  - ‘모든 심판이 정해져 있습니다’
  rationale: 개정 이력과 원문 독해상 마지막 절은 단순한 총괄 선언이 아니라 ‘그들의 심판’이라는 명사를 포함하므로, 그 주어를 유지해야 법적 초점이 살아납니다.
  doctrine_reference: 문자적-법정적 기록 이미지
