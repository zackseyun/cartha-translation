  text: And the waters rose upon the earth fifteen cubits; the waters rose high above all the high mountains, and the ark was lifted up from the earth and floated on the surface of the waters.
translation:
  language: ko
  text: 물은 땅 위로 십오 규빗이나 올라갔습니다. 물은 모든 높은 산들 위로 더욱 높이 올라갔고, 방주는 땅에서 들어 올려져 물 표면 위를 떠다녔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልህቀ፡ ማያት፡ ዲበ፡ ምድር፡ *ዐሠርት፡ ወኃምስተ፡ በእመት፡
  english_pob_choice: the waters rose upon the earth fifteen cubits
  chosen_korean: 물은 땅 위로 십오 규빗이나 올라갔습니다
  alternatives_korean:
  - 물은 땅 위에 십오 규빗 높이 있었습니다
  - 물이 땅 위로 십오 규빗까지 솟아올랐습니다
  lexicon: 규빗
  rationale: Geez 원문과 POB의 'fifteen cubits'를 그대로 반영해야 하므로, 길이 단위를 설명적으로 풀지 않고 '십오 규빗'으로 옮겼습니다. '이나'는 수량이 얼마나 크게 올랐는지를 자연스럽게 나타냅니다.
- source_word: ተለዐለ፡ ማያት፡ ዲበ፡ ኵሉ፡ ደብር፡ ነዋኅ፡
  english_pob_choice: the waters rose high above all the high mountains
  chosen_korean: 물은 모든 높은 산들 위로 더욱 높이 올라갔고
  alternatives_korean:
  - 물은 모든 높은 산들 위에 높이 올랐고
  - 물은 모든 높은 산들 위를 훨씬 넘어 올라갔고
  lexicon: 높이 올라가다
  rationale: 원문의 중첩된 상승 표현과 POB의 'rose high above'를 살려 단순 위치가 아니라 초과 상승을 나타내는 '더욱 높이 올라갔고'를 선택했습니다.
- source_word: ወተለዐለት፡ ታቦት፡ እምዲበ፡ ምድር፡ ወተንሰፈ፡ ዲበ፡ ገጸ፡ ማያት።
  english_pob_choice: and the ark was lifted up from the earth and floated on the surface of the waters
  chosen_korean: 방주는 땅에서 들어 올려져 물 표면 위를 떠다녔습니다
  alternatives_korean:
  - 방주는 땅에서 들려 올라가 물 위에 떠 있었습니다
  - 방주는 땅에서 들어 올려져 물 위에 떠 있었습니다
  lexicon: 방주
  rationale: '''tabot''는 문맥상 노아의 방주이므로 교회 전통 용어를 유지해 ''방주''로 옮겼습니다. ''떠다녔습니다''는 표면 위에 부유한 상태를 드러내며 POB의 ''floated''를 자연스럽게 반영합니다.'
theological_decisions:
- issue: 홍수의 규모를 수사적으로 어떻게 드러낼지
  chosen_reading: 물의 상승을 단순한 수위 증가가 아니라 '모든 높은 산들 위로' 올라가는 초월적 범람으로 번역했습니다.
  alternative_readings:
  - 보다 평이하게 '산들 위에'라고만 옮길 수 있음
  - 상징성을 약화시키지 않도록 높이의 초과를 명시적으로 표현함
  rationale: 원문은 반복과 과장을 통해 홍수의 전면성을 강조합니다. 이를 약화시키지 않기 위해 상승의 정도를 분명히 살렸습니다.
  doctrine_reference: 창세기 7장의 홍수 서술과 평행하는 심판-보존 모티프
- issue: 방주의 상태를 어떤 동사로 표현할지
  chosen_reading: 방주는 단순히 '있었다'가 아니라 '들려 올려져' '떠다녔습니다'로 옮겼습니다.
  alternative_readings:
  - '''떠 있었습니다''처럼 정적 상태로만 번역'
  - '''표면 위에 움직였습니다''처럼 동역학을 약화'
  rationale: 원문은 방주가 땅에서 분리되어 수면 위로 부양되는 장면을 묘사하므로, 수동적 부양과 부유를 함께 드러냈습니다.
  doctrine_reference: 노아 이야기의 구원 보존 서사
