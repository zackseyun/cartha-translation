  text: And he destroyed all from their places, and not one of them remained whom he had not judged according to all their wickedness.
translation:
  language: ko
  text: 그는 그들의 거처를 모두 멸하셨고, 그들 가운데서 그의 모든 악함에 따라 이미 심판받지 않은 사람은 하나도 남지 않았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወደምሰሰ፡ ኵሉ፡ እመካኖሙ
  english_pob_choice: he destroyed all from their places
  chosen_korean: 그는 그들의 거처를 모두 멸하셨고
  alternatives_korean:
  - 그는 그들의 자리를 모두 파괴하셨고
  - 그는 그들이 있던 곳을 다 없애셨고
  lexicon: 멸하다
  rationale: Geez의 ‘from their places’는 단순한 위치보다 거처·터전의 상실을 강하게 드러내므로, 문맥에 맞게 ‘거처’를 택해 파괴의 결과를 살렸습니다.
- source_word: ወኢ*ተርፈ፡ አሐዱ፡ እምኔሆሙ
  english_pob_choice: not one of them remained
  chosen_korean: 그들 가운데서 ... 사람은 하나도 남지 않았습니다
  alternatives_korean:
  - 그들 중 한 사람도 남지 않았습니다
  - 그들 가운데 하나도 남아 있지 않았습니다
  lexicon: 남다
  rationale: 원문의 ‘하나도 남지 않았다’는 전멸의 범위를 강조하므로, 수량 표현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ዘአኰነነ፡ ... በኵሉ፡ እኪዮሙ
  english_pob_choice: whom he had not judged according to all their wickedness
  chosen_korean: 그의 모든 악함에 따라 이미 심판받지 않은
  alternatives_korean:
  - 그의 모든 악행에 따라 아직 심판하지 않은
  - 그들의 모든 악함을 따라 판결하지 않은
  lexicon: 심판하다
  rationale: 원문의 핵심은 단순한 ‘판단’이 아니라 행위에 근거한 재판·정죄이므로 ‘심판’이 더 정확합니다. ‘악함’은 소유격 구조를 살려 그들의 전면적 악을 나타냈습니다.
theological_decisions:
- issue: ‘judge according to all their wickedness’의 법정적 뉘앙스
  chosen_reading: 하나님의 심판이 각자의 악행에 정확히 대응하는 공의로운 판결로 제시되도록 유지했습니다.
  alternative_readings:
  - 도덕적으로 꾸짖었다
  - 그들의 죄를 보았다
  rationale: 문맥상 단순한 평가가 아니라 멸망에 앞선 공적 심판을 말하므로, 정죄·판결의 법정적 의미를 약화하지 않았습니다.
  doctrine_reference: divine_judgment
