  source_fidelity: 초안의 ‘그들의 거처를 모두 멸하셨고’는 원문의 목적어인 ‘그들 모두’를 ‘거처’로 바꾸어, 거처 자체를 파괴한 것으로 의미를 변경합니다. 또한 ‘그의 모든 악함’은 소유격이 잘못되어 ‘그들’의 악을 가리켜야 합니다. 수정문은 멸망의 대상과 심판의 근거를 보존합니다.
  naturalness: ‘이미 심판받지 않은 사람’은 부정과 완료의 결합이 부자연스럽고 수식 범위가 불명확합니다. ‘심판을 받지 않은 채 남아 있던 사람’으로 옮기면 원문의 ‘심판하지 않은 자가 남지 않았다’는 관계절 구조가 자연스럽게 드러납니다.
  terminology: ‘심판’은 법정적 판단이라는 원문의 뜻에 적절합니다. ‘그들의 모든 악에 따라’는 ‘according to all their wickedness’를 현대 표준어로 자연스럽게 반영하며, ‘악함’보다 통용성이 높습니다.
