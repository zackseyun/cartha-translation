  text: And in the fourth month the fountains of the great deep were closed[a], and the floodgates of heaven were restrained; and at the beginning of the seventh month all the mouths of the depths of the earth were opened, and the waters began to descend into the lower deep.
  footnotes:
  - marker: a
    text: 'The wording may seem paradoxical: after the fountains of the deep are ''closed,'' the mouths of the earth''s depths are ''opened'' so that the waters descend into the lower deep. The translation preserves this cosmological sequence rather than harmonizing it away.'
    reason: textual_variant
    anchor_ref: '5:29'
translation:
  language: ko
  text: 넷째 달에는 큰 깊음의 샘들이 닫혔고, 하늘의 창문들이 억제되었으며, 일곱째 달의 시작에 땅의 깊음들의 모든 입이 열렸고, 물들은 아래 깊음으로 내려가기 시작했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “the fountains of the great deep were closed”
  english_pob_choice: were closed
  chosen_korean: 큰 깊음의 샘들이 닫혔고
  alternatives_korean:
  - 막혔고
  - 봉해졌고
  lexicon: 샘들 / 닫히다
  rationale: Geez 원문의 ‘깊음의 샘들’에 대응하여 ‘샘들’을 살리고, 물이 멈춘 상태를 ‘닫혔고’로 직역에 가깝게 유지했습니다.
- source_word: “the floodgates of heaven were restrained”
  english_pob_choice: were restrained
  chosen_korean: 하늘의 창문들이 억제되었으며
  alternatives_korean:
  - 하늘의 수문들이 닫혔으며
  - 하늘의 문들이 막혔으며
  lexicon: 창문들 / 억제되다
  rationale: 전통적 ‘창문들’ 이미지를 유지하되, 영어 POB의 ‘restrained’에 맞춰 단순 폐쇄보다 유출이 억제된 상태를 반영했습니다.
- source_word: “all the mouths of the depths of the earth were opened”
  english_pob_choice: all the mouths ... were opened
  chosen_korean: 땅의 깊음들의 모든 입이 열렸고
  alternatives_korean:
  - 땅의 깊음들의 모든 샘구멍이 열렸고
  - 땅의 깊은 곳들의 모든 입이 열렸고
  lexicon: 입 / 열리다
  rationale: Geez 원문의 ‘입’(mouths)을 보존해 원문 이미지를 살렸고, ‘깊음들의’ 복수도 그대로 반영했습니다.
- source_word: “the waters began to descend into the lower deep”
  english_pob_choice: began to descend into the lower deep
  chosen_korean: 물들은 아래 깊음으로 내려가기 시작했습니다
  alternatives_korean:
  - 물들은 낮은 깊음으로 흘러내리기 시작했습니다
  - 물들은 더 낮은 깊음으로 내려가기 시작했습니다
  lexicon: 아래 깊음 / 내려가기 시작하다
  rationale: 영어 POB의 ‘lower deep’를 직역하되, 한국어에서 자연스러운 ‘아래 깊음’으로 옮겨 물이 아래로 향하는 진행을 분명히 했습니다.
theological_decisions:
- issue: 우주론적 순서의 보존
  chosen_reading: 윗물의 샘이 닫힌 뒤, 땅의 깊음의 입이 열려 물이 아래 깊음으로 내려가는 순서를 그대로 유지했습니다.
  alternative_readings:
  - 앞뒤를 매끈하게 맞춰 단순히 '물이 빠졌다'로 정리하는 읽기
  rationale: 본문은 닫힘과 열림이 연속적으로 나타나는 역설적 우주론을 담고 있으므로, 이를 조화시키지 않고 그대로 드러내는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: 창세기 7장 홍수 서술의 고대 우주론 표현
- issue: 시간 표현 'at the beginning of the seventh month'
  chosen_reading: ‘일곱째 달의 시작에’로 옮겼습니다.
  alternative_readings:
  - ‘일곱째 달 초하루에’
  - ‘일곱째 달의 새달에’
  rationale: 영어 POB의 수정 의도를 반영하여, 절기적 해석을 고정하지 않고 시점만 자연스럽게 표현했습니다.
  doctrine_reference: 본문 시간표현의 서술적 중립성
