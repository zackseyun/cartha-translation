  text: the word of the LORD came to him by my hand, saying, "Go out from your land and from your kindred and from your father's house to the land that I will show you, and I will make you into a great and numerous nation, and I will bless you."
translation:
  language: ko
  text: 야훼의 말씀이 그에게 임하여 말씀하셨습니다. 「네 땅과 네 친족과 네 아버지의 집에서 나와, 내가 네게 보여 줄 땅으로 가라. 내가 너를 큰 민족, 많은 민족이 되게 하고, 너를 복 주겠다.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ፡ እግዚአብሔር፡
  english_pob_choice: the word of the LORD
  chosen_korean: 야훼의 말씀
  alternatives_korean:
  - 주님의 말씀
  - 하나님의 말씀
  lexicon: YHWH
  rationale: 본문의 ‘LORD’는 야훼를 가리키므로, 프로젝트 기본값에 따라 ‘야훼’로 옮기고 ‘말씀’으로 선포된 메시지를 유지했습니다.
- source_word: ኀቤሁ፡
  english_pob_choice: to him
  chosen_korean: 그에게
  alternatives_korean:
  - 그 사람에게
  - 아브람에게
  lexicon: dative pronoun
  rationale: 지시 대상은 문맥상 아브람이지만, 본문 자체는 대명사로 처리하므로 과도한 명시를 피하고 ‘그에게’로 유지했습니다.
- source_word: ፃእ፡
  english_pob_choice: Go out
  chosen_korean: 나와
  alternatives_korean:
  - 떠나
  - 나가
  lexicon: יצא / go out
  rationale: 명령형의 핵심 동작은 출발·이탈이므로, 직설적이면서도 자연스러운 ‘나와’를 선택했습니다.
- source_word: ወእሬስየከ፡ ሕዝበ፡ ዐቢየ፡ ወብዙኃ።
  english_pob_choice: and I will make you into a great and numerous nation
  chosen_korean: 내가 너를 큰 민족, 많은 민족이 되게 하고
  alternatives_korean:
  - 내가 너를 큰 민족이 되게 하고
  - 내가 너를 크고 많은 민족으로 만들고
  lexicon: nation / great and numerous
  rationale: ‘민족’은 집단 정체성을 살리면서도 ‘nation’의 범위를 유지하며, ‘큰 … 많은’의 병렬 구조를 그대로 반영했습니다.
- source_word: ወእባርከከ፡
  english_pob_choice: and I will bless you
  chosen_korean: 너를 복 주겠다
  alternatives_korean:
  - 너에게 복을 주겠다
  - 내가 너를 축복하겠다
  lexicon: ברך / bless
  rationale: 동사의 직접성을 살리기 위해 ‘복 주겠다’로 옮겨 축복의 선언적 어조를 유지했습니다.
theological_decisions:
- issue: ‘LORD’의 표기와 신명칭 전달
  chosen_reading: ‘LORD’는 야훼로 옮겨, 본문이 지시하는 언약적 신명칭을 드러냈습니다.
  alternative_readings:
  - 주님
  - 여호와
  rationale: 프로젝트 기본값은 야훼이며, 본문이 하나님의 직접 발화를 소개하는 문맥에서도 그 신명칭을 유지하는 것이 소스-직결에 가장 충실합니다.
  doctrine_reference: 출 3:15; 창 12:1
