revisions:
- from: 악한 영들이 사람 마음의 생각을 다스리는 그 손에서 저를 건져 주시고, 제 하나님, 당신을 따르다가 그들이 저를 미혹하지 못하게 해 주십시오. 그리고 저와 제 자손을 영원히 세워 주셔서, 우리가 이제부터 영원까지 길을 잃지 않게 해 주십시오.” 그리고 그가 말했습니다.[a]
  to: 사람의 마음속 생각을 지배하는 악한 영들의 손에서 저를 건져 주시고, 제 하나님, 제가 당신을 따르는 길에서 그들이 저를 미혹하지 못하게 해 주십시오. 또 저와 제 자손을 영원히 굳게 세워 주시어, 우리가 이제부터 영원까지 길을 잃지 않게 해 주십시오.” 그리고 그가 말했습니다.
  rationale: 원문의 소유 관계(‘악한 영들의 손’)와 ‘하나님을 따르는 데서 빗나가게 함’이라는 미혹의 방향을 한국어에서 명확히 했습니다. ኪያየ는 ‘나’이므로 ‘저와 제 자손’으로 유지했으며, 근거 없는 ‘before you/당신 앞에서’ 해석은 넣지 않았습니다. 대응 각주가 없고 원문상 성립하지 않는 대안에 연결된 [a] 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
