  text: Deliver me from the hand of evil spirits that rule over the thoughts of the heart of man, and do not let them lead me astray from following you, my God. And establish me and my seed forever, so that we may not go astray from now and forever." And he said,
  footnotes:
  - marker: a
    text: Or 'And establish me and my seed before you forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 악한 영들이 사람 마음의 생각을 다스리는 그 손에서 저를 건져 주시고, 제 하나님, 당신을 따르다가 그들이 저를 미혹하지 못하게 해 주십시오. 그리고 저와 제 자손을 영원히 세워 주셔서, 우리가 이제부터 영원까지 길을 잃지 않게 해 주십시오.” 그리고 그가 말했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምእዴ ... እኩያን መናፍስት
  english_pob_choice: evil spirits
  chosen_korean: 악한 영들
  alternatives_korean:
  - 악령들
  - 악한 귀신들
  lexicon: Source phrase እኩያን መናፍስት denotes morally evil spirits; the plural is kept explicit in Korean.
  rationale: POB의 'evil spirits'를 따라 영적 존재의 복수를 분명히 하되, 한국어에서는 가장 직접적인 '악한 영들'로 옮겼습니다.
- source_word: ይስልጡ ውስተ ሕሊና ልበ ሰብእ
  english_pob_choice: rule over the thoughts of the heart of man
  chosen_korean: 사람 마음의 생각을 다스리는
  alternatives_korean:
  - 사람의 마음 생각을 지배하는
  - 사람의 마음속 생각 위에 군림하는
  lexicon: The Ge'ez describes spirits exercising rule within the interior thought-life of the human heart; '다스리다' preserves governance language without over-specifying psychology.
  rationale: ‘rule over’의 통치 이미지를 살리면서도, ‘마음의 생각’을 한국어 자연어로 묶어 원문의 내면적 영역을 유지했습니다.
- source_word: ኪያየ
  english_pob_choice: before you
  chosen_korean: 당신을
  alternatives_korean:
  - 당신 앞에서
  - 당신 앞에
  lexicon: 'The audited revision pass was corrected: ኪያየ is not ''before you'' here, so no locative phrase is warranted in the main text.'
  rationale: 최근 감사에서 ‘before you’ 해석이 오류로 판정되었으므로, 본문에는 그 표현을 넣지 않고 단순 목적어로 처리했습니다.
- source_word: ወዘርእየ
  english_pob_choice: my seed
  chosen_korean: 제 자손
  alternatives_korean:
  - 내 씨
  - 제 씨앗
  lexicon: The kinship/offspring sense of seed is retained in a reverent but readable Korean biblical register.
  rationale: 문자적 ‘씨’보다 한국어 성경 문맥에서 더 명료한 ‘자손’을 사용해, 혈통·후손의 의미를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: Closing narrative formula
  chosen_reading: “그리고 그가 말했습니다.”를 본문에 포함했습니다.
  alternative_readings:
  - 절말을 닫는 인용부호만 두고 생략
  rationale: Ge'ez 원문과 최신 감사본 모두 서술 전환을 보여 주므로, 화자의 전환을 본문에 반영했습니다.
  doctrine_reference: Source fidelity / narrative continuity
- issue: Divine address pronouns and register
  chosen_reading: 하나님께 대한 직접 호칭은 ‘제 하나님, 당신’으로, 청원형은 ‘해 주십시오’로 유지했습니다.
  alternative_readings:
  - ‘주님’으로 의역
  - ‘하옵소서’ 같은 고어체
  rationale: 합쇼체를 유지하면서도 기도문 특유의 직접 호소를 살리기 위한 선택입니다.
  doctrine_reference: Register and reverence in prayer
