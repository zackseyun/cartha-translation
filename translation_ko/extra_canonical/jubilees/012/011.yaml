  source_fidelity: 첫 구절 ስሞ፡ ሎጥ።는 이 절만으로 독립 서술문이라기보다 앞 절의 ‘이름을 불렀다’에 이어지는 목적어구로 읽는 것이 문맥과 영어 POB 감사 이력에 더 부합합니다. 따라서 ‘그의 이름은 롯이었습니다’는 앞 절과의 통사적 연결을 끊습니다. 나머지 절은 나홀이 아내를 취했다는 뜻을 충실히 전달합니다.
  naturalness: ‘그의 이름을 롯이라 하였습니다’는 앞 절의 동사를 한국어에서 자연스럽게 보충하면서도, 원문의 절 경계상 생기는 연결성을 보존합니다. ‘스스로 아내를 맞았습니다’의 ‘스스로’는 한국어에서 다소 부자연스럽고 불필요하게 강조되므로 생략하는 편이 현대 격식체에 적절합니다.
  terminology: 고유명사 ‘롯’, ‘나홀’은 적절합니다. ‘아내를 맞았습니다’는 결혼하여 아내를 취했다는 고대 표현을 자연스럽고 중립적으로 옮깁니다.
