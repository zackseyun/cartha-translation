translation:
  language: ko
  text: 그의 이름은 롯이었습니다. 그리고 그의 형제 나홀이 스스로 아내를 맞았습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስሞ፡ ሎጥ።
  english_pob_choice: his name Lot.
  chosen_korean: 그의 이름은 롯이었습니다.
  alternatives_korean:
  - 그의 이름 롯입니다.
  - 그의 이름은 롯입니다.
  lexicon: 고유명사
  rationale: 게에즈의 명사구를 자연스러운 한국어 서술문으로 풀어 쓰되, 영어 POB의 수정된 문장처럼 ‘이었습니다’를 넣어 문법을 매끈하게 했습니다. 다만 바로 앞 절과의 연결 가능성을 해치지 않도록 단정적 의미는 과도하게 보강하지 않았습니다.
- source_word: ወናኮር፡ እኁሁ፡
  english_pob_choice: And Nahor his brother
  chosen_korean: 그리고 그의 형제 나홀이
  alternatives_korean:
  - 그리고 나홀 그의 형제가
  - 그리고 나홀은 그의 형제라
  lexicon: 고유명사 / 친족관계
  rationale: ‘그의 형제 나홀’의 어순을 한국어에 맞게 조정해, 소유 관계와 인물 식별이 분명하게 드러나도록 했습니다.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ።
  english_pob_choice: took for himself a wife.
  chosen_korean: 스스로 아내를 맞았습니다.
  alternatives_korean:
  - 아내를 맞았습니다.
  - 자기에게 아내를 취했습니다.
  lexicon: 동사구
  rationale: 게에즈의 목적어 표지와 재귀적 뉘앙스를 살려 단순히 ‘아내를 얻다’보다 ‘스스로 아내를 맞다’로 옮겨, 자신의 행위가 강조되도록 했습니다.
theological_decisions:
- issue: 이 절의 첫 구절은 독립된 완결문인지, 앞 절의 동사와 이어지는지 여부
  chosen_reading: 한국어 본문은 독립 문장처럼 읽히되, 직전 문맥이 보존될 수 있도록 단정적 연결어를 덧붙이지 않았습니다.
  alternative_readings:
  - 앞 절과 이어 ‘그리고 그의 이름은 롯이었습니다’처럼 처리하는 방식
  rationale: 영어 POB의 최신 보정은 문법을 위해 ‘was’를 넣었지만, 후속 검토는 이 구가 앞 절의 ‘그가 불렀다’와 연결될 수 있음을 지적했습니다. 한국어에서도 과도한 재구성을 피하고, 본문 자체가 허용하는 범위 안에서 자연스럽게 처리했습니다.
  doctrine_reference: 본문 연결성 / 문장 경계
