  to: 그의 아버지였으며, 그녀는 그의 아내가 되었습니다. 그리고 그의 형제 아란은 셋째 주의 셋째 해에 자신을 위해 아내를 맞이했고, 그녀는 이 주의 일곱째 해에 그에게 아들을 낳았으며, 그는 이름을 지었습니다.
