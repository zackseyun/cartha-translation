    rationale: 게즈어 본문은 ‘그리고 그는 이름을 지었다/불렀다’에서 끝나며, 이 절 안에는 아이를 명명했다는 목적어가 명시되지 않습니다. ‘그 아이의 이름’을 넣으면 문맥상 타당한 해석을 본문에 확정적으로 추가하게 됩니다.
  revised_text: 그의 아버지였으며, 그녀는 그의 아내가 되었습니다. 그리고 그의 형제 아란은 셋째 주의 셋째 해에 자신을 위해 아내를 맞이했고, 그녀는 이 주의 일곱째 해에 그에게 아들을 낳았으며, 그는 이름을 지었습니다.
