  source_fidelity: 대체로 게즈어의 가족관계·혼인·연대·출산 순서를 충실히 따릅니다. 그러나 마지막 ወጸውዐ(‘그리고 그는 이름을 지었다/불렀다’)는 이 절에서 이름이나 명명 대상이 명시되지 않은 채 끝나는데, 초안의 ‘그 아이의 이름을 지었습니다’는 명명 대상인 ‘그 아이’를 보충합니다. 문맥상 추정은 가능하지만, 절 경계에서 끝난 원문의 생략을 보존하는 편이 더 정확합니다.
  naturalness: 합쇼체 서술은 자연스럽고 연대기적 연결도 명료합니다. 다만 마지막은 ‘그는 이름을 지었습니다’로 하면 한국어에서 자연스럽게 독립절을 이루면서도 이름 또는 명명 대상의 미제시를 유지합니다.
  terminology: ‘아내를 맞이하다’, ‘아들을 낳다’, ‘이름을 짓다’는 현대 표준 한국어의 격식 있는 서사체에 적절합니다. 인명 ‘아란’도 영어 POB의 Aran에 부합합니다.
