  text: his father, and she became his wife. And Aran his brother took a wife for himself in the third year of the third week, and she bore him a son in the seventh year of this week, and he named him
translation:
  language: ko
  text: 그의 아버지였으며, 그녀는 그의 아내가 되었습니다. 그리고 그의 형제 아란은 셋째 주의 셋째 해에 자신을 위해 아내를 맞이했고, 그녀는 이 주의 일곱째 해에 그에게 아들을 낳았으며, 그가 그 아이의 이름을 지었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነት፡ ሎቱ፡ ብእሲተ።
  english_pob_choice: and she became his wife
  chosen_korean: 그녀는 그의 아내가 되었습니다
  alternatives_korean:
  - 그녀는 그의 아내가 되었습니다
  - 그의 아내가 되었습니다
  lexicon: become + wife
  rationale: 게즈 원문의 관계 성립을 그대로 살려 ‘되다’로 옮겼고, 한국어에서는 주어를 분명히 하여 문맥상의 여성 주어를 자연스럽게 드러냈습니다.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ፡
  english_pob_choice: took a wife for himself
  chosen_korean: 자신을 위해 아내를 맞이했고
  alternatives_korean:
  - 자신을 위해 아내를 맞이했고
  - 아내를 데려왔고
  - 아내를 취했고
  lexicon: take a wife
  rationale: 직역의 ‘취하다’는 한국어에서 다소 경직되므로, 결혼을 위한 배우자 취득을 드러내는 ‘아내를 맞이하다’를 사용해 원문의 결혼 행위를 보존했습니다.
- source_word: ወወለደት፡ ሎቱ፡ ወልደ፡
  english_pob_choice: she bore him a son
  chosen_korean: 그녀는 그에게 아들을 낳았으며
  alternatives_korean:
  - 그녀는 그에게 아들을 낳았으며
  - 그가 아들을 얻었으며
  - 그녀가 그에게 한 아들을 낳았으며
  lexicon: bear a son
  rationale: 원문의 출산 관계를 유지하면서 한국어 서술체에 맞게 ‘낳다’를 선택했습니다.
- source_word: ዝንቱ፡ ወጸውዐ፡
  english_pob_choice: and he named him
  chosen_korean: 그가 그 아이의 이름을 지었습니다
  alternatives_korean:
  - 그가 그 아이의 이름을 지었습니다
  - 그가 그를 불렀습니다
  - 그리고 그는 그 이름을 불렀습니다
  lexicon: name/call
  rationale: 영어 POB의 수정처럼, 이름 부여 공식이 문장 끝에서 끊어진 불완전한 형태를 반영하기 위해 ‘이름을 지었습니다’로 옮겼습니다.
theological_decisions:
- issue: 족보/연대기 서술의 누적 접속 구조
  chosen_reading: 원문의 사건 나열을 보존하여 시간 정보와 가족 관계를 평이하게 연결했습니다.
  alternative_readings:
  - 문장을 더 짧게 끊어 해설적으로 재배열하는 방식
  - 연대 표현을 현대식으로 풀어 쓰는 방식
  rationale: 이 구절은 신학적 해석보다 연대기적 사실 전달이 핵심이므로, 서술 순서를 유지하는 것이 본문의 의미를 가장 잘 드러냅니다.
  doctrine_reference: 서사 본문 보존 원칙
- issue: 불완전한 이름 짓기 공식
  chosen_reading: 마지막 동사를 ‘이름을 지었습니다’로 처리해, 뒤에 이어질 문맥이 생략된 상태를 드러냈습니다.
  alternative_readings:
  - ‘그를 불렀습니다’로 완결형처럼 처리하는 방식
  - 문장 끝을 보정해 완전한 이름 명시를 추정하는 방식
  rationale: 영어 POB의 audit trail이 ‘he named him’으로 수정한 점을 반영하여, 아직 이름이 제시되지 않은 서술의 미완성을 보존했습니다.
  doctrine_reference: 본문 비평/서사 미완성 보존
