  text: And I will make your name great, and you will be blessed in the earth, and in you all the nations of the earth will be blessed. And those who bless you I will bless, and those who curse you I will curse.
translation:
  language: ko
  text: 내가 네 이름을 크게 하며, 네가 땅에서 복을 받을 것이며, 네 안에서 땅의 모든 민족이 복을 받을 것입니다. 그리고 너를 축복하는 자는 내가 축복하고, 너를 저주하는 자는 내가 저주할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዐቢ ስመከ
  english_pob_choice: I will make your name great
  chosen_korean: 네 이름을 크게 하며
  alternatives_korean:
  - 네 이름을 크게 만들며
  - 네 이름을 영화롭게 하며
  lexicon: source direct
  rationale: 동사 አዐቢ는 ‘크게 하다/높이다’의 의미가 핵심이므로, POB의 영어처럼 이름의 ‘great’함을 자연스럽게 살려 ‘크게 하며’로 옮겼습니다.
- source_word: ቡሩከ፡ ውስተ፡ ምድር
  english_pob_choice: you will be blessed in the earth
  chosen_korean: 네가 땅에서 복을 받을 것이며
  alternatives_korean:
  - 네가 땅 위에서 복을 받을 것이며
  - 너는 땅에서 복되게 될 것이며
  lexicon: source direct
  rationale: 수동형 ‘복을 받다’로 옮겨 축복의 수혜를 분명히 했고, ‘땅에서’는 지상/세계 전체의 범위를 간결하게 살렸습니다.
- source_word: ኵሎሙ አሕዛበ፡ ምድር
  english_pob_choice: all the nations of the earth
  chosen_korean: 땅의 모든 민족
  alternatives_korean:
  - 세상의 모든 민족
  - 땅의 모든 나라
  lexicon: source direct
  rationale: 아히자브는 ‘민족들’로 이해하는 것이 가장 자연스럽고, ‘땅의’는 지리적·보편적 범위를 유지합니다.
- source_word: ወለእለ፡ ይባርኩከ / ይረግሙከ
  english_pob_choice: those who bless you / those who curse you
  chosen_korean: 너를 축복하는 자 / 너를 저주하는 자
  alternatives_korean:
  - 너를 복 주는 자 / 너를 저주하는 자
  - 너를 축복하는 사람 / 너를 저주하는 사람
  lexicon: source direct
  rationale: 대구 구조를 살리기 위해 동일한 명사구로 맞췄고, ‘축복하다/저주하다’는 행위의 방향을 분명히 했습니다.
theological_decisions:
- issue: 아브라함 언약의 보편적 축복 범위
  chosen_reading: ‘네 안에서 땅의 모든 민족이 복을 받을 것입니다’로, 복의 매개가 아브라함의 후손을 넘어 열방 전체로 확장됨을 분명히 했습니다.
  alternative_readings:
  - ‘네 안에서 땅의 모든 민족이 복되게 될 것입니다’
  - ‘네를 통해 땅의 모든 민족이 복을 받을 것입니다’
  rationale: 게에즈 원문과 POB 영어는 모두 ‘in you’를 유지하므로, 매개성을 약화시키지 않으면서 한국어에서는 ‘네 안에서’로 자연스럽게 표현했습니다.
  doctrine_reference: 창세기 12:2-3; 갈라디아서 3:8
