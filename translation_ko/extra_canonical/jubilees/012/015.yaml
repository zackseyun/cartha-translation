  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: ko
  text: 그의 아버지 테라흐보다 먼저였습니다. 그리고 그들은 그를 갈대아 우르에 묻었습니다. 테라흐는 갈대아 우르를 떠나 자신과 그의 아들들을 데리고 레바논 땅과 가나안 땅으로 가려 했지만, 하란 땅에 머물렀고, 아브람은 하란에서 그의 아버지 테라흐와 함께 살았습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀበርዎ / buried him
  english_pob_choice: they buried him
  chosen_korean: 그들은 그를 … 묻었습니다
  alternatives_korean:
  - 그를 장사했습니다
  - 그를 매장했습니다
  lexicon: 묻다
  rationale: 본문의 단순한 매장 행위를 직접적으로 살리되, 현대 한국어에서 자연스럽고 무난한 서술형으로 옮겼습니다.
- source_word: ወወፅአ ... እምነ ... ውስተ ...
  english_pob_choice: went out from ... to go into ...
  chosen_korean: …를 떠나 …로 가려 했지만
  alternatives_korean:
  - …에서 나와 …로 들어가려 했지만
  - …에서 떠나 …로 가려 했지만
  lexicon: 떠나다 / 가려 하다
  rationale: 출발 의도와 이동 방향을 함께 드러내는 구조를 살려, 영어 POB의 순차적 서술을 자연스럽게 재현했습니다.
- source_word: ወኀደረ / settled, lived
  english_pob_choice: he settled ... Abram lived with ...
  chosen_korean: 머물렀고 … 함께 살았습니다
  alternatives_korean:
  - 정착했고 …와 함께 거주했습니다
  - 거기 머물렀고 …와 함께 살았습니다
  lexicon: 머물다 / 살다
  rationale: 한절 안의 두 동사를 구분해, 첫 번째는 정착/체류의 결과로, 두 번째는 실제 동거 생활로 구별해 옮겼습니다.
- source_word: አቡሁ / his father
  english_pob_choice: his father
  chosen_korean: 그의 아버지
  alternatives_korean:
  - 아버지
  - 자기 아버지
  lexicon: 지시대명사+친족어
  rationale: 지시 관계를 분명히 하여 테라흐와 아브람의 관계가 흐려지지 않도록 했습니다.
theological_decisions:
- issue: 레바논과 가나안으로 가려 했다는 이동 목적의 표현
  chosen_reading: 본래의 이동 의도는 살리되, 실제 정착지는 하란으로 서술했습니다.
  alternative_readings:
  - 레바논과 가나안으로 갔다고 단정하는 번역
  - 하란에 살았다만 남기고 이동 목적을 약화하는 번역
  rationale: 게에즈 본문과 영어 POB는 ‘가려 하다’의 목적 구문과 ‘하란에 머물다’를 함께 전하므로, 의도와 결과를 모두 보존하는 쪽이 본문 충실도가 높습니다.
  doctrine_reference: 서사 문맥 보존
- issue: 첫 구절의 'before Terah his father'
  chosen_reading: 시간적 선행을 부드럽게 풀어 ‘그의 아버지 테라흐보다 먼저였습니다’로 옮겼습니다.
  alternative_readings:
  - 테라흐 그의 아버지보다 전에
  - 아버지 테라흐 앞에서
  rationale: 문맥상 앞선 사건을 가리키는 짧은 절로 보이므로, 한국어에서는 관계를 명확하게 풀어 주되 의미 범위를 넘지 않도록 했습니다.
  doctrine_reference: 서사적 선행 관계
