  text: And I opened his mouth and his ears and his lips, and I began to speak with him in Hebrew, in the language of creation. And he took the books of his fathers, and they were written in Hebrew, and he copied them and began from then on to study them. And I made known to him everything that he was unable to understand, and he studied them during the six rainy months.
translation:
  language: ko
  text: 내가 그의 입과 귀와 입술을 열고, 그와 함께 히브리어로, 곧 창조의 언어로 말하기 시작하였습니다. 그는 자기 조상의 책들, 곧 히브리어로 기록된 것들을 가져다가 그것들을 베껴 쓰고, 그때부터 그것들을 배우기 시작하였습니다. 또한 내가 그가 이해하지 못하는 모든 것을 그에게 알게 하였고, 그는 비가 오는 여섯 달 동안 그것들을 배웠습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አፉሁ / አዛኒሁ / ከናፍሪሁ
  english_pob_choice: his mouth and his ears and his lips
  chosen_korean: 그의 입과 귀와 입술
  alternatives_korean:
  - 입과 귀와 입술
  - 입과 귀와 입술들을
  lexicon: 인체 부위 일반어
  rationale: 지시대명사 없이도 원문의 ‘그의’가 관계를 분명히 하므로, 자연스러운 한국어로 직역에 가깝게 옮겼습니다.
- source_word: በዕብራይስጥ፡ በልሳነ፡ ፍጥረታት
  english_pob_choice: in Hebrew, in the language of creation
  chosen_korean: 히브리어로, 곧 창조의 언어로
  alternatives_korean:
  - 히브리어로, 창조의 언어로
  - 히브리어로, 피조물의 언어로
  lexicon: ‘language of creation’ 표현
  rationale: 영문 POB의 해석을 따라 ‘창조의 언어’로 옮기되, 연결어 ‘곧’을 넣어 히브리어와 동격 관계임을 분명히 했습니다.
- source_word: መጻሕፍተ፡ አበዊሁ / ጽሑፋት፡ እማንቱ፡ ዕብራይስጢ
  english_pob_choice: the books of his fathers, and they were written in Hebrew
  chosen_korean: 자기 조상의 책들, 곧 히브리어로 기록된 것들을
  alternatives_korean:
  - 자기 조상의 책들, 그리고 그것들은 히브리어로 기록되어 있었습니다
  - 자기 조상의 책들, 히브리어로 기록된 것들
  lexicon: ‘books of his fathers’ / ‘written in Hebrew’
  rationale: ‘조상들’은 소유격을 살린 자연어로 옮기고, 뒤의 설명절은 동격으로 처리해 원문의 반복 설명을 반영했습니다.
- source_word: ወተምህሮን ስድስተ ወርኀ ዘናም
  english_pob_choice: he studied them during the six rainy months
  chosen_korean: 비가 오는 여섯 달 동안 그것들을 배웠습니다
  alternatives_korean:
  - 여섯 우기 동안 그것들을 배웠습니다
  - 비 오는 여섯 달 동안 그것들을 공부했습니다
  lexicon: ‘rainy months’
  rationale: 고대 달력의 계절표현을 한국어 독자에게 이해되도록 ‘비가 오는 여섯 달’로 풀었고, 학습 동사는 앞선 ‘study’의 의미를 유지해 ‘배우다’로 옮겼습니다.
theological_decisions:
- issue: ‘language of creation’의 의미 범위
  chosen_reading: 히브리어를 단순 민족 언어가 아니라 창조와 연결된 원초적 언어로 제시합니다.
  alternative_readings:
  - 단순히 ‘창조의 언어’라는 상징적 표현으로만 읽기
  - 히브리어를 선민 언어로만 이해하기
  rationale: 원문과 POB는 히브리어를 창조와 결부시키므로, 그 신학적 함의를 약화하지 않도록 그대로 드러냈습니다.
  doctrine_reference: 창조 언어/원어의 신학적 상징성
