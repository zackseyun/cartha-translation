  text: There is no spirit in them, because they are the work of hands; and you carry them on your shoulders, and from them there is no help for you, except great shame.
  footnotes:
  - marker: a
    text: Or 'shoulders. They are a burden to you, and from them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 안에는 영이 없습니다. 그들은 손으로 만든 것이기 때문입니다. 그리고 당신은 그것들을 어깨에 메고 다니지만, 그것들로부터는 당신에게 아무런 도움이 없습니다. 오직 큰 수치만 있을 뿐입니다.[a]
  philosophy: formal
lexical_decisions:
- source_word: መንፈስ
  english_pob_choice: spirit
  chosen_korean: 영
  alternatives_korean:
  - 영혼
  - 숨
  - 생명
  lexicon: Geez መንፈስ
  rationale: 우상 안에 있는 내적 생기나 생명력을 가리키는 일반적 의미로 보아, 기독교적 고유어인 ‘성령’보다 중립적인 ‘영’이 원문과 더 가깝습니다.
- source_word: ግብረ፡ እደው
  english_pob_choice: the work of hands
  chosen_korean: 손으로 만든 것
  alternatives_korean:
  - 손의 일
  - 사람의 손이 만든 것
  - 손으로 지은 것
  lexicon: Geez ግብረ እደው
  rationale: 원문은 우상이 인간의 손작업 산물임을 강조하므로, 자연스럽고 직설적인 ‘손으로 만든 것’으로 옮겼습니다.
- source_word: ላዕሌሆሙ… እንትሙ ትጸውርዎሙ
  english_pob_choice: you carry them on your shoulders
  chosen_korean: 당신은 그것들을 어깨에 메고 다니지만
  alternatives_korean:
  - 당신은 그것들을 어깨에 짊어지고 가지만
  - 당신은 그것들을 어깨에 들고 다니지만
  lexicon: Geez ትጸውርዎሙ
  rationale: 어깨 위에 싣고 운반하는 동작을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘어깨에 메고 다니다’를 택했습니다.
- source_word: ረድኤት ዘእንበለ ሐሳር ዐቢይ
  english_pob_choice: no help for you, except great shame
  chosen_korean: 아무런 도움이 없습니다. 오직 큰 수치만 있을 뿐입니다
  alternatives_korean:
  - 전혀 도움이 없습니다. 다만 큰 수치만 있을 뿐입니다
  - 도움이 없고 큰 수치만 있을 뿐입니다
  lexicon: Geez ረድኤት / ሐሳር ዐቢይ
  rationale: 원문의 대조 구조를 따라 ‘도움’과 ‘큰 수치’를 분명히 살리되, 영어 본문의 불필요한 해설적 추가 없이 직역에 가깝게 다듬었습니다.
theological_decisions:
- issue: 우상의 무기력성에 대한 진술
  chosen_reading: 우상은 영이 없고, 인간의 손으로 만든 물건이라서 실질적 도움을 줄 수 없으며 결국 수치만 남깁니다.
  alternative_readings:
  - 우상에는 영이 없다는 존재론적 진술
  - 우상 숭배에 대한 풍자적 경고
  rationale: 본문은 우상의 제작성과 무력함을 병렬로 제시하여, 우상에 생명/능력이 없다는 점을 논증합니다. 한국어에서도 이 논증 구조가 드러나도록 옮겼습니다.
  doctrine_reference: 우상 무가치성 / 우상 비판
