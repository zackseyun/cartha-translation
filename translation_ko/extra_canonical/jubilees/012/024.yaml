  text: And I will be God to you and to your son and to your son's son and to all your seed. Do not fear from now and unto all the generations of the earth; I am your God." And he said to me,
  footnotes:
  - marker: a
    text: Or 'and forever, throughout'.
    reason: previous_rendering
translation:
  language: ko
  text: “내가 너와 네 아들과 네 아들의 아들과 네 모든 자손에게 하나님이 될 것입니다. 이제부터 땅의 모든 세대에 이르기까지 두려워하지 마십시오. 나는 너의 하나님입니다.” 그리고 그가 내게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእከውንከ፡ ለከ፡ ... አምላክከ
  english_pob_choice: And I will be God to you ... I am your God
  chosen_korean: “내가 … 하나님이 될 것입니다 / 나는 너의 하나님입니다”
  alternatives_korean:
  - “내가 … 너의 하나님이 되겠습니다 / 나는 너의 하나님입니다”
  - “내가 … 너의 하나님이 되리라 / 나는 너의 하나님이다”
  lexicon: እከውን / አነ አምላክከ
  rationale: 미래 서약과 वर्तमान적 자기계시를 살려, 앞부분은 ‘될 것입니다’, 끝의 자기선언은 ‘입니다’로 구분했습니다.
- source_word: ኢትፍራህ፡
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: የፍራህ
  rationale: 직접적인 금지 명령으로서 표준적인 현대 공손 명령형을 택했습니다.
- source_word: እምይእዜ፡ ወእስከ፡ ኵሉ፡ ትዝምደ፡ ምድር፡
  english_pob_choice: from now and unto all the generations of the earth
  chosen_korean: 이제부터 땅의 모든 세대에 이르기까지
  alternatives_korean:
  - 이제부터 땅의 모든 세대 동안
  - 지금부터 땅의 모든 세대에 걸쳐
  lexicon: እምይእዜ / ወእስከ / ትዝምደ ምድር
  rationale: 원문의 시간 범위를 ‘이제부터 …에 이르기까지’로 옮겨, 종말적/지속적 한계를 과장하지 않도록 했습니다.
- source_word: ወይቤለኒ፡
  english_pob_choice: And he said to me
  chosen_korean: 그리고 그가 나에게 말했습니다
  alternatives_korean:
  - 그리고 주님께서 나에게 말씀하셨습니다
  - 그리고 그분이 나에게 말씀하셨습니다
  lexicon: ወይቤለኒ
  rationale: 본문 자체는 단순히 ‘그가’라고 하므로, 영어 개정본의 축소를 반영해 하나님 호칭을 덧붙이지 않았습니다.
theological_decisions:
- issue: 하나님 자기계시의 지속성과 언약 범위
  chosen_reading: ‘너와 … 모든 씨에게 하나님이 될 것입니다’와 ‘땅의 모든 세대에 이르기까지’로 언약의 지속성을 분명히 드러냈습니다.
  alternative_readings:
  - ‘너에게 하나님이 되겠습니다’
  - ‘영원토록 땅의 모든 세대 동안’
  rationale: 게에즈 본문은 서약적 미래와 세대 범위를 말하므로, 영어 주석의 ‘from now and unto’ 취지를 따라 지속성을 보존하되 ‘영원토록’은 덧붙이지 않았습니다.
  doctrine_reference: 언약의 지속성, 창세기 17장 계열의 언약 공식
- issue: 직접화법의 화자 표기
  chosen_reading: 마지막에 ‘그리고 그가 나에게 말했습니다’로 끝내어, 본문에 없는 ‘주 하나님’을 보태지 않았습니다.
  alternative_readings:
  - ‘그리고 주 하나님께서 나에게 말씀하셨습니다’
  - ‘그리고 야훼 하나님이 나에게 말씀하셨습니다’
  rationale: 게에즈 원문은 단순 대명사/서술로 이어지므로, 화자를 명시적으로 해석하지 않고 최소한으로 옮겼습니다.
  doctrine_reference: 본문비평 및 직역 원칙
