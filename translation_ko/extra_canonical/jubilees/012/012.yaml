  text: And in the sixtieth year of the life of Abram, that is, in the fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no one knew it.
translation:
  language: ko
  text: 그리고 아브람의 생애의 육십 년째 되는 해, 곧 넷째 주의 넷째 해에 아브람이 밤에 일어나 우상들의 집을 불태우고, 집 안에 있는 모든 것을 불살랐으며, 아무도 그것을 알지 못했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አብራም፡ ... ተንሥአ፡ በሌሊት፡
  english_pob_choice: Abram arose by night
  chosen_korean: 아브람이 밤에 일어나
  alternatives_korean:
  - 아브람이 밤중에 일어나
  - 아브람이 야밤에 일어나
  lexicon: ተንሥአ
  rationale: 동사 핵심은 단순한 기상/일어섬이며, 밤에 이루어진 행위를 자연스럽게 현대 한국어로 옮기기 위해 ‘밤에 일어나’로 간결하게 처리했습니다.
- source_word: ቤተ፡ ጣዖታት፡
  english_pob_choice: the house of idols
  chosen_korean: 우상들의 집
  alternatives_korean:
  - 우상의 집
  - 우상 신상들의 집
  lexicon: ቤት + ጣዖት
  rationale: 복수형 의미를 살려 ‘우상들의 집’으로 옮겨, 단순한 우상 숭배의 장소가 아니라 우상들이 모여 있던 집이라는 점을 반영했습니다.
- source_word: ወአውዐየ፡ ኵሎ፡ በውስተ፡ ቤት፡
  english_pob_choice: he burned everything that was in the house
  chosen_korean: 집 안에 있는 모든 것을 불살랐으며
  alternatives_korean:
  - 집 안의 모든 것을 불태웠으며
  - 그 집 안의 모든 것을 불살랐으며
  lexicon: ኵሎ፡ በውስተ፡ ቤት
  rationale: ‘everything that was in the house’의 포괄성을 살리되, 앞의 ‘집’과 중복을 줄이기 위해 ‘집 안에 있는 모든 것’으로 풀었습니다.
- source_word: ወሰብእ፡ አልቦ፡ ዘአእመረ።
  english_pob_choice: and no one knew it
  chosen_korean: 아무도 그것을 알지 못했습니다
  alternatives_korean:
  - 아무도 알지 못했습니다
  - 그 일을 아는 사람은 아무도 없었습니다
  lexicon: አልቦ፡ ዘአእመረ
  rationale: 최신 POB 수정에 따라 ‘no one knew it’를 자연스러운 공식 문체로 반영했고, 대상 지시어 ‘그것’을 보존해 사건의 비밀성을 분명히 했습니다.
theological_decisions:
- issue: 서술시제와 사건의 비밀성
  chosen_reading: 역사 서술로서 과거 시제를 유지하고, ‘아무도 그것을 알지 못했습니다’로 사건의 은밀성을 드러냈습니다.
  alternative_readings:
  - 아무도 알지 못했습니다
  - 그 누구도 그것을 알지 못했습니다
  rationale: 본문은 아브람의 행동이 은밀하게 이루어졌음을 강조하므로, 과장 없이 명시적으로 비밀성을 전달하는 번역이 적절합니다.
  doctrine_reference: 내러티브 본문 해석 원칙
