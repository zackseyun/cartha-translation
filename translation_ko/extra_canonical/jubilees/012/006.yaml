  text: '[They are a deception] to those who make them, and confusion of heart to those who worship them. Do not worship them." And his father said to him, "I too know, my son, but what can I do for a people who have made me serve?'
  footnotes:
  - marker: a
    text: Or 'who have made me go astray?'.
    reason: previous_rendering
  - marker: b
    text: Or 'Shame belongs to those who make them'.
    reason: previous_rendering
translation:
  language: ko
  text: '[그것들은] 그것들을 만드는 이들에게는 속임수이며, 그것들을 숭배하는 이들에게는 마음의 혼란입니다. "그것들을 숭배하지 마십시오." 그리고 그의 아버지가 그에게 말했습니다. "나도 알고 있다, 내 아들아. 그러나 나를 섬기게 만든 백성을 위해 내가 무엇을 할 수 있겠느냐?"[a]'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእለ፡ ይገብርዎሙ፡
  english_pob_choice: to those who make them
  chosen_korean: 그것들을 만드는 이들에게는
  alternatives_korean:
  - 그것들을 만드는 자들에게는
  - 그것들을 제작하는 이들에게는
  lexicon: source phrase with ለ + relative clause
  rationale: 원문은 ‘만드는 이들’에 초점을 두며, 영어 POB가 뒤의 문장을 보충하지 않고 앞절과 연결해 읽은 점을 따라 한국어도 자연스럽게 이어지도록 했습니다.
- source_word: ወከሕተት፡ ልብ፡
  english_pob_choice: confusion of heart
  chosen_korean: 마음의 혼란
  alternatives_korean:
  - 마음의 당혹
  - 심장의 혼란
  - 마음의 어지러움
  lexicon: Ge'ez idiom for inner bewilderment
  rationale: ‘마음’은 성경적 내면 중심을 살리고, ‘혼란’은 원문의 인지적·정서적 뒤엉킴을 간결하게 드러냅니다.
- source_word: ያመልክዎሙ፡ / አታምልክዎሙ
  english_pob_choice: worship them / Do not worship them
  chosen_korean: 숭배하는 이들에게는 / 숭배하지 마십시오
  alternatives_korean:
  - 경배하는 이들에게는 / 경배하지 마십시오
  - 예배하는 이들에게는 / 예배하지 마십시오
  lexicon: worship terminology
  rationale: 우상에 대한 종교적 행위를 분명히 하면서도, 예배/경배보다 직접적인 ‘숭배’가 원문의 우상숭배 맥락을 더 정확히 반영합니다.
- source_word: እትአዘዝ፡
  english_pob_choice: have made me serve
  chosen_korean: 섬기게 만든
  alternatives_korean:
  - 복종하게 만든
  - 종노릇하게 만든
  - 섬기도록 만든
  lexicon: Ge'ez አዘዘ/ተአዘዘ semantic field
  rationale: 검토된 주석에 따라 이 동사는 ‘길을 잃다’가 아니라 ‘순종하다/섬기다’의 뜻이므로, 아브라함의 아버지가 우상에 종사하도록 강요된 뉘앙스를 살렸습니다.
- source_word: אֲנִי גַם / I too know
  english_pob_choice: I too know
  chosen_korean: 나도 알고 있다
  alternatives_korean:
  - 나도 안다
  - 나 역시 알고 있다
  lexicon: speaker acknowledgment
  rationale: 직접화법의 자연스러운 한국어로 옮기되, 아버지의 짧은 인정 발화를 보존했습니다.
theological_decisions:
- issue: 우상숭배 경고의 직설성 유지
  chosen_reading: '"그것들을 숭배하지 마십시오."를 그대로 두어 우상에 대한 금지를 완곡하게 바꾸지 않았습니다.'
  alternative_readings:
  - '"그것들을 섬기지 마십시오."'
  - '"그것들에게 예배하지 마십시오."'
  rationale: 원문은 우상에 대한 금지 명령을 직접적으로 제시하므로, 한국어도 종교적으로 덜 날카로운 표현으로 완화하지 않는 것이 더 충실합니다.
  doctrine_reference: 출애굽기 20:4-5의 우상 금지, 신명기 4:19의 천체 숭배 경고
- issue: 불완전한 문장 보완 방식
  chosen_reading: 마지막 절을 질문형으로 자연스럽게 마무리하되, 원문이 말하는 ‘나를 섬기게 만든 백성’의 원인관계를 유지했습니다.
  alternative_readings:
  - 문장미완으로 끊기기
  - '''나를 지배한 백성''으로 재구성하기'
  rationale: 에티오피아어 원문과 영어 POB는 문장 흐름이 압축되어 있으므로, 한국어에서는 의미를 보충하되 새로운 신학적 요소를 추가하지 않는 범위에서 자연스러운 종결을 택했습니다.
  doctrine_reference: 본문 비평 및 번역 형식의 적절성
