  text: 그는 이 일을 자기 두 형제에게 말하였고, 그들은 그에게 분노하였으며, 잠잠하였습니다. 그리고 사십 번째 희년, 둘째 주, 그 해의 일곱째 해에 아브람은 아내를 맞이하였는데, 그녀의 이름은 사라이였으며, 그의 아버지의 딸이었습니다.[a]
  philosophy: optimal-equivalence
