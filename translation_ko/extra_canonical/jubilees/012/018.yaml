translation:
  language: ko
  text: 그는 아침과 저녁에 비를 내리십니다. 그리고 그가 원하시면 비를 내리지 않으십니다. 또 모든 것이 그의 손에 있습니다.” 그리고 그는 기도하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያዘንም / He causes it to rain
  english_pob_choice: He causes it to rain
  chosen_korean: 비를 내리십니다
  alternatives_korean:
  - 비를 오게 하십니다
  - 비를 내리게 하십니다
  lexicon: 내리다
  rationale: 주어가 비를 ‘오게 하는’ 능동적 원인을 나타내므로, 자연스럽고 직접적인 표현인 ‘비를 내리십니다’로 옮겼습니다.
- source_word: ወሰርከ / morning and evening
  english_pob_choice: in the morning and in the evening
  chosen_korean: 아침과 저녁에
  alternatives_korean:
  - 아침에와 저녁에
  - 아침과 저녁때에
  lexicon: 아침, 저녁
  rationale: 장소가 아니라 시간 부사이므로 한국어의 자연스러운 시간 표현인 ‘아침과 저녁에’를 사용했습니다.
- source_word: ወኵሉ ውስተ እዴሁ / And everything is in his hand
  english_pob_choice: And everything is in his hand
  chosen_korean: 모든 것이 그의 손에 있습니다
  alternatives_korean:
  - 모든 것이 그의 권한 아래 있습니다
  - 모든 것이 그의 손 안에 있습니다
  lexicon: 손
  rationale: ‘손’은 권능과 주권을 나타내는 성경적 관용구이므로, 직역을 유지하면서도 한국어에서 자연스럽게 읽히도록 했습니다.
- source_word: ወጸለየ / And he prayed
  english_pob_choice: And he prayed
  chosen_korean: 그리고 그는 기도하였습니다
  alternatives_korean:
  - 그리고 그는 기도했습니다
  - 그리고 그는 기도했습니다.
  lexicon: 기도하다
  rationale: 제공된 원문 구절 말미에 실제로 포함된 동사를 반영해 번역하되, 다음 절로 넘어가는 연결감은 유지했습니다.
theological_decisions:
- issue: 조건절의 위치와 의미
  chosen_reading: 첫 절은 단순 서술(그는 비를 내리십니다)이고, ‘그가 원하시면’은 뒤 절의 유보 조건으로만 처리했습니다.
  alternative_readings:
  - 첫 절도 ‘그가 원하시면 비를 내리십니다’로 옮김
  rationale: 게에즈 원문과 영어 감사본 모두 첫 절에는 조건절이 없고, 조건은 ‘내리지 않으십니다’에만 붙어 있으므로 그 구분을 보존했습니다.
  doctrine_reference: source fidelity / clause-level syntax
