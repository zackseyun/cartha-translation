  naturalness: 서술은 대체로 자연스럽지만 ‘그가 이 말을 두 형제에게 하였는데’는 소유 관계가 드러나지 않고 연결이 다소 느슨합니다. ‘자기 두 형제에게 하니’가 원문의 관계와 순서를 더 자연스럽게 전달합니다. 인용문은 아버지가 아들에게 하는 직접 명령이므로 반말 명령형 ‘잠잠하라’를 유지할 수 있으나, 뒤의 ‘하노라’는 현대적이지 않습니다.
  terminology: ‘예배하고 찬양하다’는 숭배 대상에 대한 병렬 동사를 잘 반영합니다. ‘잠잠하다’도 원문의 반복 및 침묵 모티프를 보존합니다. 대상은 해설적으로 ‘우상들’이라 보태지 않고 ‘그것들’로 둔 것이 적절합니다.
