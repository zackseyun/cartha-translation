translation:
  language: ko
  text: 그들이 그것들을 예배하고 찬양하게 하려는 것이었습니다. “내 아들아, 잠잠하라. 그들이 너를 죽일지도 모른다.” 그리고 그가 이 말을 자기 두 형제에게 하니, 그들은 그에게 화를 냈고, 그는 잠잠하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, “그리고 그가 말했다.”
    reason: 영어 POB 각주(“Or ‘And he said,’”)에 대응하며, 후속 구절에서 말의 대상과 내용이 보완되는 원문의 간결한 동사를 설명합니다.
lexical_decisions:
- source_word: ያምልክዎሙ / worship them
  english_pob_choice: worship them
  chosen_korean: 그것들을 예배하게 하려는 것이었습니다
  alternatives_korean:
  - 그것들을 경배하게 하려는 것이었습니다
  - 그것들을 섬기게 하려는 것이었습니다
  lexicon: 예배하다
  rationale: 우상 앞의 종교적 행위를 드러내는 동사로서, 단순한 예절보다 더 강한 숭배 행위를 살리기 위해 ‘예배하다’를 택했습니다.
- source_word: ወይስብሕዎሙ / praise them
  english_pob_choice: praise them
  chosen_korean: 찬양하게
  alternatives_korean:
  - 칭송하게
  - 찬미하게
  lexicon: 찬양하다
  rationale: 예배와 병렬된 동작으로서 공개적 찬사를 뜻하므로, 현대 한국어에서 가장 자연스럽고 음성적으로 강한 ‘찬양하다’를 사용했습니다.
- source_word: አርምም / Be silent
  english_pob_choice: Be silent
  chosen_korean: 잠잠하라
  alternatives_korean:
  - 조용히 하라
  - 입 다물어라
  lexicon: 잠잠하다
  rationale: 명령의 급박함을 유지하면서도 성경 문체에서 널리 쓰이는 직설적 표현인 ‘잠잠하라’를 택했습니다.
- source_word: ከመ፡ አይቅትሉከ። / lest they kill you
  english_pob_choice: lest they kill you
  chosen_korean: 그들이 너를 죽일까 하노라
  alternatives_korean:
  - 그들이 너를 죽일까 두렵다
  - 그들이 너를 죽이지 않게 하려는 것이다
  lexicon: 죽이다
  rationale: 위협의 목적절을 한국어의 고전적 경고문형으로 옮겨, 경고의 긴박함과 결과 가능성을 함께 드러냈습니다.
- source_word: ወነገረ፡ / And he spoke / said
  english_pob_choice: And he said
  chosen_korean: 그리고 그가 이 말을 두 형제에게 하였는데
  alternatives_korean:
  - 그리고 그가 말했다
  - 그리고 그가 이 말을 전하였는데
  lexicon: 말하다
  rationale: 이 절은 뒤이어 두 형제에게 전해진 말을 다시 연결하는 서술이므로, 단순한 ‘말했다’보다 목적어를 드러내는 ‘이 말을 … 하였다’로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 우상 숭배와 찬양의 대상 표현
  chosen_reading: ‘그것들’을 가리키는 대명사를 유지해 우상적 대상임을 직접 드러냈습니다.
  alternative_readings:
  - ‘그들’을 사용해 사람을 가리키는 표현으로 완화하는 안
  - ‘우상들’로 해설적으로 풀어 쓰는 안
  rationale: 원문과 POB의 맥락상 예배와 찬양의 대상은 인격적 존재가 아니라 우상적 대상이므로, 지시 대상을 흐리지 않도록 중립적 대명사를 유지했습니다.
  doctrine_reference: 우상 숭배 경고의 직접성 유지
- issue: 명령문과 경고문의 긴박한 호흡
  chosen_reading: ‘잠잠하라. 그들이 너를 죽일까 하노라.’로 짧게 끊어 위협의 절박함을 살렸습니다.
  alternative_readings:
  - ‘조용히 하라. 그러면 죽지 않을 것이다.’처럼 완화하는 안
  - ‘침묵하라’처럼 격식을 높이는 안
  rationale: 원문의 경고는 즉각적 생명의 위협이 핵심이므로, 한국어에서도 호흡을 짧게 유지해 긴박감을 보존했습니다.
  doctrine_reference: 서사적 긴급성 보존
