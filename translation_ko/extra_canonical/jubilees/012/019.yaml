  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
  footnotes:
  - marker: a
    text: Or 'your praise'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날 밤에 그가 말했습니다. 「나의 하나님, 지극히 높으신 하나님, 오직 당신만이 나의 하나님이십니다. 당신은 모든 것을 지으셨고, 존재하는 모든 것은 당신의 손의 작품입니다. 저는 당신과 당신의 통치[a]를 택했습니다. 저를 구원해 주십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 게에즈어 표기는 ‘당신의 찬양’으로 읽힐 수 있습니다. 그러나 비평적 판독은 ‘당신의 통치’ 또는 ‘당신의 다스림’을 뜻하는 것으로 봅니다.
    reason: 제공된 본문 표기와 영어 POB 감사 이력에서 채택한 비평적 판독의 차이를 투명하게 보이면서, 논쟁 가능한 어휘의 모호성을 보존합니다.
