  text: And in that night he said, "My God, God Most High, you alone are God to me, and you created all things, and all that exists is the work of your hands. I have chosen you and your dominion; deliver me."
  footnotes:
  - marker: a
    text: Or 'your praise'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날 밤에 그가 말했습니다. 「나의 하나님, 지극히 높으신 하나님, 오직 당신만이 나의 하나님이십니다. 당신은 모든 것을 지으셨고, 존재하는 모든 것은 당신의 손의 작품입니다. 저는 당신과 당신의 통치를 택했습니다. 저를 구원해 주십시오.」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በይእቲ፡ ሌሊት፡
  english_pob_choice: And in that night
  chosen_korean: 그날 밤에
  alternatives_korean:
  - 그 밤에
  - 그날 밤
  lexicon: 시간부사구
  rationale: 서술적 배경 표현으로 자연스럽게 옮기되, 원문의 특정성을 살려 ‘그날 밤에’로 간결하게 표현했습니다.
- source_word: አምላከ፡ ልዑል፡
  english_pob_choice: God Most High
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지극히 높으신 분
  lexicon: 하나님 호칭
  rationale: ‘Most High’의 최상급 의미를 살리면서 한국어 성경 문체에 맞는 존칭형 표현으로 옮겼습니다.
- source_word: ወመሰክንከ
  english_pob_choice: your dominion
  chosen_korean: 당신의 통치
  alternatives_korean:
  - 당신의 다스림
  - 당신의 주권
  lexicon: 왕권/통치 어휘
  rationale: 공적·왕적 지배를 가리키는 의미를 살려 ‘통치’로 번역했고, 영어 POB의 최종 판독인 ‘dominion’을 반영했습니다.
- source_word: አድኅነኒ
  english_pob_choice: deliver me
  chosen_korean: 저를 구원해 주십시오
  alternatives_korean:
  - 저를 건져 주십시오
  - 저를 구출해 주십시오
  lexicon: 구원 청원
  rationale: 간구문의 직접성과 간절함을 살리면서 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: “오직 당신만이 나의 하나님이십니다”의 배타적 신앙 고백
  chosen_reading: 단일 예배 대상에 대한 배타적 고백으로 직역했습니다.
  alternative_readings:
  - 당신만이 내 하나님입니다
  - 오직 당신만이 하나님입니다
  rationale: 원문은 ‘당신만이 나에게 하나님’이라는 관계적·배타적 진술을 담고 있어, 이를 약화시키지 않도록 보존했습니다.
  doctrine_reference: 유일신 고백 / 언약적 충성
