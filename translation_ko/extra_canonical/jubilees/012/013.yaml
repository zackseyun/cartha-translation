    rationale: 영어 POB 감사 기록에 대안 인명·동사 표기가 있으며, 표지를 유지한다면 대응 각주도 함께 제시되어야 합니다.
  revised_text: 그들은 밤에 일어나 불 가운데에서 자기들의 신들을 구해 내고자 했습니다. 그리고 하란이 급히 달려갔습니다.[a]
