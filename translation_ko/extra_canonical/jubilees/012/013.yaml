review_pass:
  verdict: revise
  source_fidelity: 앞부분은 게에즈어의 ‘밤에 일어나 ... 불 가운데에서 자기들의 신들을 구하려 하였다’를 충실히 옮겼습니다. 마지막 ወሰረረ፡ አራን፡은 목적어 없이 ‘하란이 급히 달려갔습니다’ 정도로 옮기는 편이 안전합니다. 현 번역의 ‘달려들었습니다’는 무엇을 향해 달려들었는지를 원문보다 더 강하게 암시합니다. 제공된 원문에는 이 절이 포함되어 있으나, 편집상 다음 절의 시작일 가능성은 번역문에서 임의로 해결하지 않았습니다.
  naturalness: ‘그들은 밤에 일어나’와 ‘자기들의 신들을 구해 내고자 했습니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 목적어 없는 ‘하란이 달려들었습니다’는 다소 미완성적으로 들리므로 ‘급히 달려갔습니다’가 더 자연스럽습니다.
  terminology: ‘하란’은 성서 인명 관례 및 English POB의 Haran에 부합합니다. ‘자기들의 신들’은 원문의 소유 표현과 복수형을 보존하며, ‘우상들’로 해석을 좁히지 않아 적절합니다. 각주 표지는 본문에 있으므로, 영어 감사 기록의 대안 표기를 반영한 한국어 각주를 제공해야 합니다.
  issues:
