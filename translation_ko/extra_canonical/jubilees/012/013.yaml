translation:
  language: ko
  text: 그들은 밤에 일어나 불 가운데에서 자기들의 신들을 구해 내고자 했습니다. 그리고 하란이 달려들었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወተንሥኡ፡ በሌሊት፡
  english_pob_choice: And they arose in the night
  chosen_korean: 그들은 밤에 일어났습니다
  alternatives_korean:
  - 그들은 밤중에 일어났습니다
  - 그들은 밤에 일어섰습니다
  lexicon: 일어나다
  rationale: 행동의 시작을 자연스럽게 옮기되, 원문의 단순 서술과 시간 부사 ‘밤에’를 유지했습니다.
- source_word: ወፈቀዱ፡ ያድኅኑ፡ አማልክቲሆሙ፡
  english_pob_choice: and wanted to rescue their gods
  chosen_korean: 자기들의 신들을 구해 내고자 했습니다
  alternatives_korean:
  - 자기들의 신들을 구하려 했습니다
  - 자기들의 신들을 구원하고자 했습니다
  lexicon: 구해 내다 / 신들
  rationale: ‘rescue’의 구체성을 살려 ‘구해 내다’로 옮겼고, 문맥상 우상들을 가리키는 ‘their gods’는 직역에 가깝게 ‘자기들의 신들’로 두었습니다.
- source_word: እማእከለ፡ እሳት።
  english_pob_choice: from the midst of the fire
  chosen_korean: 불 가운데에서
  alternatives_korean:
  - 불 한가운데에서
  - 불 속에서
  lexicon: 가운데
  rationale: ‘midst’의 중심성을 간결하게 드러내되 한국어로 자연스러운 표현인 ‘가운데에서’를 선택했습니다.
- source_word: ወሰረረ፡ አራን፡
  english_pob_choice: And Haran rushed
  chosen_korean: 그리고 하란이 달려들었습니다
  alternatives_korean:
  - 그리고 하란이 급히 달려갔습니다
  - 그리고 하란이 뛰어들었습니다
  lexicon: 달려들다 / 하란
  rationale: 공개된 POB 수정안의 ‘rushed’를 반영하되, 불을 향해 돌진하는 뉘앙스를 살리기 위해 ‘달려들다’를 택했습니다. 인명은 표준적인 ‘하란’으로 옮겼습니다.
theological_decisions:
- issue: 이 구절에서 ‘their gods’를 어떻게 처리할지
  chosen_reading: 문맥상 참신한 신학 용어로 순화하지 않고, 우상에 대한 인물들의 소유 표현을 그대로 살려 ‘자기들의 신들’로 옮겼습니다.
  alternative_readings:
  - 자기들의 우상들
  - 그들이 섬기던 신들
  rationale: 원문은 실제 신적 존재 주장인지 우상 숭배 대상을 가리키는지 문맥상 긴장을 남겨 두며, 본문이 가진 다신교적 표면을 지우지 않는 번역이 필요합니다.
  doctrine_reference: 본문 문맥 보존 및 우상 숭배 표현의 직접성 유지
- issue: 공개된 분절 자료에서 마지막 절이 다음 절의 시작과 겹치는 문제
  chosen_reading: 이번 기록은 제공된 본문 범위에 맞춰 현재 문장까지만 번역하고, ‘And Haran rushed’는 다음 절로 넘어가는 연결문으로 자연스럽게 포함했습니다.
  alternative_readings:
  - 마침표로 끝내고 다음 절에서 재개
  - 다음 절 표기를 별도 처리
  rationale: 아람어/게에즈 본문과 English audit trail 모두 분절 오류 가능성을 시사하지만, 현재 요청은 이 한 절의 한국어 기록이므로 수용 가능한 범위 내에서 자연스럽게 마감했습니다.
  doctrine_reference: 본문 분절 처리와 번역 경계 설정
