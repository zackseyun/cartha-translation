    issue: ‘달려들었습니다’가 원문에 없는 목표·대상 쪽으로의 돌진을 암시합니다.
    rationale: 게에즈어 동사는 ‘달리다/급히 달려가다/돌진하다’의 뜻이지만, 이 짧은 절 자체에는 목적어나 방향이 명시되지 않습니다. ‘급히 달려갔습니다’는 속도와 행동을 유지하면서 불필요한 보충을 피합니다.
  - severity: low
