  text: 'The Lord God [said]: ''Open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.''[a]'
  footnotes:
  - marker: a
    text: 'The final phrase likely refers to the loss of the primordial language after the judgment associated with Babel; the Ge''ez wording is compressed: ''from the day of the overthrow.'''
    reason: cross_reference
    anchor_ref: '12:25'
  - marker: b
    text: Or 'May the Lord God open his mouth and his ears, so that he may hear and speak with his mouth in the language that has been revealed, for it has ceased from the mouths of all the children of men from the day of the overthrow.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주 하나님께서 말씀하셨습니다. "그의 입과 귀를 여십시오. 그러면 그는 들을 수 있고, 드러난 언어로 자기 입으로 말할 것입니다. 그것은 모든 사람의 입에서, 전복의 날부터 사라졌기 때문입니다."[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር፡ አምላክ፡
  english_pob_choice: The Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주님 하나님
  - 야훼 하나님
  lexicon: YHWH/κύριος
  rationale: Ge'ez opening invokes the divine title as 'the Lord God'; Korean 표준 성경 문체에서는 이를 자연스럽게 '주 하나님'으로 옮기되, 본문이 구약 인용식의 야훼 표기를 요구하는 경우가 아니므로 본 절에서는 전통적 합성 호칭을 유지했습니다.
- source_word: ፍታሕ
  english_pob_choice: Open
  chosen_korean: 여십시오
  alternatives_korean:
  - 열어 주십시오
  - 열으십시오
  lexicon: imperative
  rationale: 문맥상 2인칭 단수 명령형이므로 '여십시오'로 옮겨, POB가 바로잡은 명령의 직접성을 한국어에서도 보존했습니다.
- source_word: ወአዛኒሁ፡
  english_pob_choice: his ears
  chosen_korean: 귀
  alternatives_korean:
  - 귀들
  - 청력
  lexicon: body_part
  rationale: 직역적으로 '귀'가 적절하며, 입과 귀를 병렬로 제시하는 원문의 구체성을 살렸습니다.
- source_word: በልሳን፡ እንተ፡ ታስተርኢ፡
  english_pob_choice: in the language that has been revealed
  chosen_korean: 드러난 언어로
  alternatives_korean:
  - 계시된 언어로
  - 나타난 언어로
  lexicon: revealed language
  rationale: Ge'ez의 '드러난/나타난' 의미를 따라 '드러난 언어'로 간결하게 옮겼고, '계시된'은 신학적 색채가 더 강해 여기서는 원문의 서술적 뉘앙스를 우선했습니다.
- source_word: እምዕለተ፡ ድቀት።
  english_pob_choice: from the day of the overthrow
  chosen_korean: 전복의 날부터
  alternatives_korean:
  - 무너짐의 날부터
  - 전도(顚倒)의 날부터
  lexicon: overthrow
  rationale: POB의 'overthrow'를 직역해 사건의 심판적 붕괴를 유지했으며, '전복'은 한국어에서 권위 있는 전도·무너짐의 의미를 함께 전달합니다.
theological_decisions:
- issue: 원문이 명령문인지 간접화법인지
  chosen_reading: 주 하나님께서 직접 명령하시는 형식으로 옮겼습니다.
  alternative_readings:
  - 주 하나님께서 열어 달라고 하셨습니다
  - 그의 입과 귀를 열어 주시기를 원하셨습니다
  rationale: Ge'ez의 동사형과 POB 수정 내역이 'Open...' 명령을 지지하므로, 간접청유보다 직접 명령으로 번역해야 원문의 강도를 보존합니다.
  doctrine_reference: 서술 문맥과 명령법의 보존
- issue: '''드러난 언어''의 신학적 함의'
  chosen_reading: 특정 교단어휘인 '계시된 언어'보다 중립적인 '드러난 언어'를 사용했습니다.
  alternative_readings:
  - 계시된 언어
  - 원초 언어
  rationale: 본문은 바벨 이후 상실된 언어를 암시하지만, 본절 자체는 그 언어의 정체를 명시하지 않으므로 암시를 넘는 단정은 피했습니다.
  doctrine_reference: 바벨 전승 및 언어 상실 암시
