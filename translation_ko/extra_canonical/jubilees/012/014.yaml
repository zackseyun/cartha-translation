  text: 그들을 건져 내려고 하였는데, 그의 위로 불이 타올랐고 그는 불에 타 갈대아 사람들의 우르에서 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያድኅኖሙ
  english_pob_choice: to rescue them
  chosen_korean: 그들을 구원하려고 하였으나
  alternatives_korean:
  - 그들을 구원하려고
  - 그들을 건지려고
  lexicon: 구원하다
  rationale: 동사 의도 표현을 살려 목적절로 옮기되, 이어지는 심판 사건과의 대비가 드러나도록 ‘하려고 하였으나’를 덧붙였습니다.
- source_word: ወነደደ እሳት ላዕሌሁ
  english_pob_choice: fire was kindled over him
  chosen_korean: 불이 그 위에 붙었고
  alternatives_korean:
  - 불이 그 위에서 타올랐고
  - 불이 그 위에 일어났고
  lexicon: 불이 붙다
  rationale: 원문의 ‘불이 … 위에 붙다/일다’라는 수동적 발생을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ወውዐየ በእሳት
  english_pob_choice: he was burned with fire
  chosen_korean: 그가 불에 타서
  alternatives_korean:
  - 그가 불로 타서
  - 그가 불에 타 죽어서
  lexicon: 타다
  rationale: 반복된 ‘불’ 표현을 살리면서도 결과 상태를 간결하게 나타내기 위해 ‘불에 타서’로 옮겼습니다.
- source_word: በኡር ዘከለዳዊያን
  english_pob_choice: in Ur of the Chaldeans
  chosen_korean: 갈대아 사람들의 우르에서
  alternatives_korean:
  - 갈대아인의 우르에서
  - 갈대아의 우르에서
  lexicon: 우르 / 갈대아 사람들
  rationale: 지명은 통용 표기 ‘우르’를 유지하고, 소유/관계 구문은 원문대로 ‘갈대아 사람들의’로 직역했습니다.
theological_decisions:
- issue: 불로 인한 죽음의 중첩 표현
  chosen_reading: ‘불이 그 위에 붙었고… 그가 불에 타서’로 두 번의 불 관련 표현을 모두 살렸습니다.
  alternative_readings:
  - 한 번만 ‘불’ 표현을 쓰고 단순화하는 번역
  - ‘불길이 타올라’처럼 의미를 합쳐 번역
  rationale: 원문은 불의 개시와 그로 인한 소각을 연속적으로 말하므로, 반복을 줄여 의미를 희석하지 않도록 했습니다.
  doctrine_reference: 텍스트 충실성 원칙
- issue: ‘구원하다’의 미완결적 의도 표현
  chosen_reading: ‘그들을 구원하려고 하였으나’로 실패한 시도를 드러냈습니다.
  alternative_readings:
  - ‘그들을 구원하다가’
  - ‘그들을 구원하려고’
  rationale: 원문의 목적 표지를 그대로 살리면서 이후의 불 심판과 서사적 대비가 분명해지도록 했습니다.
  doctrine_reference: 서사 문맥 보존
