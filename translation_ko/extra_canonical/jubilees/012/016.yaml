  text: two weeks of years[a]. And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains. And he was there alone, sitting and observing, and a word came into his heart, and he said[a], “All the signs of the stars and their signs...
  footnotes:
  - marker: a
    text: '''Week'' here is calendrical shorthand for a week of years. Jubilees regularly counts time by jubilees, weeks, and years.'
    reason: cultural_note
    anchor_ref: '12:16'
  - marker: a
    text: The opening phrase of the month may also be understood more specifically as the rising or new-moon beginning of the seventh month.
    reason: lexical_alternative
    anchor_ref: '12:16'
translation:
  language: ko
  text: 두 주간[a]이었습니다. 그리고 여섯째 주의 다섯째 해에, 아브람은 일곱째 달의 시작에 밤을 새우며 해질 무렵부터 새벽까지 별들을 살펴보며, 비와 관련하여 그 해의 성격이 어떨지를 보려고 했습니다. 그는 거기에 혼자 앉아 살피고 있었는데, 그 마음에 한 말이 들어와 이렇게 말했습니다. “별들의 모든 징조와 그들의 징조들…”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤ፡ ሱባዔ፡ ዓመታት
  english_pob_choice: two weeks of years
  chosen_korean: 두 주간
  alternatives_korean:
  - 두 주의 해
  - 두 주간의 해
  - 두 주기
  lexicon: 주(weeks of years)
  rationale: 유빌리서의 주는 일반적 7일 주가 아니라 연대기 단위의 ‘주간’이므로, 본문 의미를 살리되 주석으로 보충하는 방식이 가장 자연스럽습니다.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  english_pob_choice: at the beginning of the seventh month
  chosen_korean: 일곱째 달의 시작에
  alternatives_korean:
  - 일곱째 달 초에
  - 일곱째 달의 초하루에
  - 일곱째 달의 시작 무렵에
  lexicon: 달/월
  rationale: 영문 POB의 ‘the beginning of the seventh month’를 직접 반영하되, 지시가 더 좁은 ‘초하루’는 원문이 확정하지 않으므로 피했습니다.
- source_word: ወመጽአ፡ ውስተ፡ ልቡ፡ ቃል
  english_pob_choice: a word came into his heart
  chosen_korean: 그 마음에 한 말이 들어와
  alternatives_korean:
  - 그 마음에 한 말씀이 들어와
  - 그 마음에 한 말이 떠올라
  - 그 마음에 말씀이 임해
  lexicon: 말/말씀
  rationale: 원문과 POB 모두 ‘word’이므로, 계시적 뉘앙스를 유지하되 한국어에서 과도한 신학적 확정을 피하기 위해 ‘한 말’로 옮겼습니다.
- source_word: ኵሉ፡ ተአምረ፡ ከዋክብት፡ ወተአምራሁ
  english_pob_choice: All the signs of the stars and their signs
  chosen_korean: 별들의 모든 징조와 그들의 징조들
  alternatives_korean:
  - 별들의 모든 표징과 그 표징들
  - 별들의 모든 징조와 그 징조들
  lexicon: 징조/표징
  rationale: source와 revision pass에 따라 마지막 누락분을 반영했고, 반복되는 ‘their signs’는 원문의 중복을 살려 직역적으로 유지했습니다.
theological_decisions:
- issue: ‘word came into his heart’의 계시성
  chosen_reading: 내적 감동이나 생각이 아니라, 본문이 말하는 계시적/예감적 진입을 살리되 ‘한 말이 들어와’로 절제해 번역했습니다.
  alternative_readings:
  - ‘말씀이 그의 마음에 임해’
  - ‘말이 그의 마음에 떠올라’
  rationale: 유빌리서의 서술은 단순한 심리 묘사보다 의미 있는 내적 전달을 가리키므로, 신학적 과잉을 피하면서도 전달성을 확보했습니다.
  doctrine_reference: 계시 언어의 서사적 재현
