  naturalness: ‘두 주간이었습니다’는 현대 한국어에서 14일로 자연스럽게 이해되어 오해의 소지가 큽니다. ‘그 마음에 한 말이 들어와 이렇게 말했습니다’도 누가 말했는지가 문법적으로 불분명합니다. 문장을 나누고 대명사를 명시하면 합쇼체 서술로 더 자연스럽습니다.
