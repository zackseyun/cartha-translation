translation:
  language: ko
  text: …해와 달의 것은 모두 주님의 손에 있습니다. 내가 왜 찾습니까? 그가 원하시면…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “해와 달은 모두 주님의 손안에 있습니다. 그가 원하신다면, 내가 왜 계속 찾겠습니까?”
    reason: 이전의 비절편적 연결 번역을 기록합니다. 본문은 게에즈어의 소유격 표지와 다음 문장으로 시작하는 조건절을 따라 절편성을 유지합니다.
lexical_decisions:
- source_word: ለፀሓይ፡ ወለወርኅ፡ ኵሉ፡
  english_pob_choice: of the sun and the moon, all
  chosen_korean: 해와 달의 것은 모두
  alternatives_korean:
  - 해와 달은 모두
  - 해와 달의 모든 것은
  - 태양과 달은 모두
  lexicon: la- + ṣaḥāy / warḫ
  rationale: 게에즈의 소유격 표지와 선행 문맥의 절편성을 반영해 ‘해와 달의 것은’으로 옮기고, ‘all’은 자연스러운 도치로 ‘모두’에 담았습니다.
- source_word: በእዴ፡ እግዚአብሔር፡
  english_pob_choice: in the hand of the Lord
  chosen_korean: 주님의 손안에
  alternatives_korean:
  - 주님의 손에
  - 주님의 권세 아래
  - 주님의 지배 아래
  lexicon: hand of the Lord
  rationale: 직역적 이미지인 ‘손안에’를 유지해 통치와 소유의 이미지를 살렸고, 주어를 ‘주님’으로 해 POB 관례를 따랐습니다.
- source_word: ለምንት፡ አነ፡ እትኃሠሥ።
  english_pob_choice: Why do I search?
  chosen_korean: 내가 왜 찾겠습니까?
  alternatives_korean:
  - 내가 왜 찾습니까?
  - 왜 내가 찾겠습니까?
  - 왜 내가 계속 찾겠습니까?
  lexicon: I search / seek
  rationale: 문맥상 ‘search/seek’의 의미를 살려 한국어 ‘찾다’로 옮기되, 수사 의문을 자연스럽게 살리기 위해 종결을 의문형으로 유지했습니다.
- source_word: በእመ፡ ፈቀደ
  english_pob_choice: if he wills
  chosen_korean: 그가 원하시면
  alternatives_korean:
  - 그가 뜻하시면
  - 그가 원하신다면
  - 그가 바라시면
  lexicon: if he wills
  rationale: 게에즈 조건절의 의미를 분리해 반영했고, 신적 의지를 한국어로 가장 직접적으로 드러내는 ‘원하시면’을 선택했습니다.
theological_decisions:
- issue: the divine name/title in this verse
  chosen_reading: ‘주님’으로 표기해 하나님의 주권적 소유와 통치를 드러냈습니다.
  alternative_readings:
  - 야훼
  - 하나님
  rationale: 본문은 신명(יהוה)의 직접 표지가 아니라 통상적인 주권 호칭에 해당하므로, 문맥상 가장 자연스러운 ‘주님’을 사용했습니다.
  doctrine_reference: divine address and reverential title usage
- issue: fragmented syntax across verse boundary
  chosen_reading: 본문의 절편성을 반영해 앞뒤를 모두 완결시키지 않고, 앞부분과 다음 절을 잇는 방식의 생략부호를 유지했습니다.
  alternative_readings:
  - 완결된 단일 문장으로 정리
  - 앞절 내용을 보충해 매끈하게 재구성
  rationale: 게에즈 원문과 영문 POB audit trail 모두가 분절을 전제하므로, 독자에게 원문 상태를 드러내는 편이 소스 충실성에 맞습니다.
  doctrine_reference: source integrity and segmentation fidelity
