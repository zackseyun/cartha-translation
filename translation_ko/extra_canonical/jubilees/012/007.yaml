  source_fidelity: 첫 구절의 단편적 의문 형식(‘before them?’)과 1인칭 화자 및 살해의 미래 위협은 충실히 보존되었습니다. ጽድቀ는 문맥상 ‘진실’로 옮길 수 있으나, ‘의’라는 대안도 주석으로 남기는 것이 원어의 의미 범위를 더 잘 반영합니다. 마지막 ‘그들의 영혼이 그들에게 달라붙어’는 한국어에서 동일 집단이 자기 자신에게 달라붙는다는 뜻으로 읽히기 쉬우므로, 문맥상 앞서 언급된 대상들을 가리키도록 ‘그것들’로 분명히 해야 합니다.
  naturalness: ‘그들 앞에서입니까?’는 앞 문맥에 의존하는 의문 단편으로서 가능하며, 원문의 갑작스러운 단편성을 보존합니다. 반면 ‘영혼이 그들에게 달라붙어’는 자연스럽지 않고 지시 대상이 혼동됩니다. ‘그것들에 매여’는 결속의 비유를 자연스러운 현대 한국어로 전달합니다.
