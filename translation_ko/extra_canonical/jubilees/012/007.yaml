translation:
  language: ko
  text: 그들 앞에서입니까? 제가 그들에게 진실[a]을 말하면, 그들이 저를 죽일 것입니다. 그들의 영혼이 그것들에 매여 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의를 말하면’.
    reason: ጽድቀ는 문맥상 ‘진실’로 번역할 수 있으나, ‘의/의로움’의 의미도 가능한 번역이므로 영어 POB 감사 기록의 대안을 보존합니다.
lexical_decisions:
- source_word: ቅድሜሆሙ
  english_pob_choice: before them?
  chosen_korean: 그들 앞에서입니까?
  alternatives_korean:
  - 그들 앞에서요?
  - 그들 앞입니까?
  lexicon: 전치사구/장소 부사구
  rationale: 문맥상 화자가 ‘그들 앞에서’ 말하는 상황을 묻는 표현이므로, 자연스러운 한국어 질문형으로 옮겼습니다.
- source_word: ጽድቀ
  english_pob_choice: speak the truth
  chosen_korean: 진실을 말하면
  alternatives_korean:
  - 의를 말하면
  - 의로 말하면
  - 옳은 말을 하면
  lexicon: ṣdq / truth-righteousness
  rationale: 영어 POB의 최신 판정처럼, 여기서는 추상명사 ‘의’보다 실제로 받아들여질 말의 내용인 ‘진실’이 문맥에 더 자연스럽고 정확합니다.
- source_word: ይቀትሉኒ
  english_pob_choice: they will kill me
  chosen_korean: 그들이 저를 죽일 것입니다
  alternatives_korean:
  - 그들이 나를 죽일 것입니다
  - 그들이 저를 죽이겠지요
  lexicon: 동사 قتל/kill
  rationale: 직접적인 살해 위협을 그대로 살리되, 현대 표준어와 합쇼체에 맞게 정리했습니다.
- source_word: ነፍሶሙ ኀቤሆሙ
  english_pob_choice: for their souls cling to them
  chosen_korean: 그들의 영혼이 그들에게 달라붙어 있기 때문입니다
  alternatives_korean:
  - 그들의 생명이 그들에게 붙어 있기 때문입니다
  - 그들의 혼이 그들에게 매여 있기 때문입니다
  lexicon: nefesh/soul + cling
  rationale: ‘영혼’과 ‘달라붙다’를 통해 원문의 강한 결속 이미지를 보존했습니다. ‘생명’은 의미를 약화할 수 있어 기본값으로 채택하지 않았습니다.
theological_decisions:
- issue: 문답형 수사 구조와 인칭 유지
  chosen_reading: 질문 형식을 살리고 화자의 1인칭 발화를 직접적으로 유지했습니다.
  alternative_readings:
  - 서술형으로 평탄화하기
  - 간접화법으로 바꾸기
  rationale: 본문의 긴장감은 ‘앞에서입니까?’라는 질문과 곧바로 이어지는 생명의 위협에서 나오므로, 이를 평탄화하지 않았습니다.
  doctrine_reference: source transparency / minimal paraphrase
