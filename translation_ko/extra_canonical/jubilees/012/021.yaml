    rationale: 원문의 난해한 분절을 보존하되, 한국어에서는 ‘당신의 종이 그것을 행하도록’으로 종이 능동적 행위자임을 분명히 해야 합니다. ‘손으로’는 원문에 있으므로 남기되 문장 안에서 자연스럽게 연결할 수 있습니다.
