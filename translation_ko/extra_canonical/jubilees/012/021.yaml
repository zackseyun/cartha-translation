  rationale: 원문의 논쟁적·난해한 중간 구절을 과도하게 해석하지 않으면서, 관계절의 목적 의미와 ‘종’이 행위자라는 능동성을 한국어에서 더 분명히 했습니다. ‘내 얼굴’과 ‘그들에게 돌아가다’는 원문 및 최신 영어 POB 감사 기록을 따라 유지했습니다. 각주 표지는 본문 끝의 [a]와 일치하게 하나만 두었습니다.
