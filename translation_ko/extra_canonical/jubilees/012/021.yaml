  yaml_path: translation/extra_canonical/jubilees/012/021.yaml
  text: And he said[a], "Shall I return to Ur of the Chaldeans, who seek my face so that I should return to them? And what shall I do here in this place? Make the right path straight before you in the hand of your servant, that he may do it, and let me not walk in the error of my heart, my God." And he finished speaking and praying, and behold, one was sent
  footnotes:
  - marker: a
    text: The middle of this verse is difficult in the segmented Ge'ez. The translation preserves the sense of Abram asking God to make the right path straight before him and not let him follow his own erring heart.
    reason: segmentation_note
    anchor_ref: '12:21'
  - marker: b
    text: Or 'where they seek my life so that I should go in to them?'.
    reason: previous_rendering
  - marker: c
    text: Or 'Make straight before me the right path, and let it be done by the hand of your servant,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. 「내가 갈대아인의 우르로 돌아가야 합니까? 그들이 나의 얼굴을 찾으니 내가 그들에게 돌아가야 합니까? 아니면 이곳에서 내가 무엇을 해야 합니까? 당신 앞에서 옳은 길을 곧게 하시고 — 당신의 종의 손으로 — 그가 그것을 행하게 하시며, 나의 하나님, 내 마음의 오류를 따라 걷지 않게 하십시오.」 그리고 그는 말하기와 기도하기를 마쳤습니다. 보라, 한 사람이 보내졌습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገጽየ
  english_pob_choice: my face
  chosen_korean: 나의 얼굴
  alternatives_korean:
  - 내 생명
  - 나를
  lexicon: Geez ገጽ
  rationale: 게으즈 원문은 ‘얼굴/낯’을 뜻하므로, 영어 POB의 주석적 보완을 따르되 본문에는 직접적으로 ‘나의 얼굴’로 두어 ‘찾다’가 곧 귀환을 바라는 표현임을 살렸습니다.
- source_word: እግባእ ኀቤሆሙ
  english_pob_choice: return to them
  chosen_korean: 그들에게 돌아가야 합니까
  alternatives_korean:
  - 그들에게 들어가야 합니까
  - 그들에게로 가야 합니까
  lexicon: Geez እግባእ + ኀቤ
  rationale: 원문 동사는 ‘돌아가다’의 뜻이므로, 영어 POB의 수정판보다 원어 의미를 따라 ‘돌아가야 합니까’로 옮겼습니다.
- source_word: በቅድሜከ
  english_pob_choice: before you
  chosen_korean: 당신 앞에서
  alternatives_korean:
  - 내 앞에서
  - 당신 면전에서
  lexicon: Geez ቅድም
  rationale: 게으즈의 전치사구는 ‘당신 앞에서’에 해당하므로, 기도의 청원 방향을 하나님께 두는 표현으로 유지했습니다.
- source_word: ይግበር
  english_pob_choice: that he may do it
  chosen_korean: 그가 그것을 행하게 하시며
  alternatives_korean:
  - 그가 하게 하시며
  - 그것이 행해지게 하시며
  lexicon: Geez ይግበር
  rationale: 원문은 능동형 ‘그가 하다’이므로 수동으로 바꾸지 않고, 주어가 ‘당신의 종’임을 분명히 하여 옮겼습니다.
- source_word: ፍኖተ ርቱዐ
  english_pob_choice: the right path
  chosen_korean: 옳은 길
  alternatives_korean:
  - 올바른 길
  - 바른 길
  lexicon: Geez ፍኖት + ርቱዕ
  rationale: ‘길’과 ‘옳다/바르다’의 결합을 자연스러운 한국어로 옮기되, 도덕적·방향적 의미를 함께 담기 위해 ‘옳은 길’로 했습니다.
theological_decisions:
- issue: 기도문에서 하나님을 직접 부르는 호칭과 명령형 청원 표현
  chosen_reading: 나의 하나님, … 하십시오
  alternative_readings:
  - 나의 하나님, … 하옵소서
  - 나의 하나님, … 해 주십시오
  rationale: 합쇼체를 유지하면서도 직접 호칭 뒤의 청원은 현대 문체로 자연스럽게 전달되도록 ‘하십시오’를 사용했습니다.
  doctrine_reference: 공동체 예배용 문체의 가독성 및 직역성 균형
- issue: ‘내 마음의 오류’의 해석
  chosen_reading: 나의 마음의 오류
  alternative_readings:
  - 내 마음의 잘못
  - 내 마음의 그릇됨
  rationale: 원문이 ‘마음의 오류/어긋남’이라는 내적 방황을 가리키므로, 죄책을 덧씌우기보다 원문의 긴장을 살려 ‘오류’로 남겼습니다.
  doctrine_reference: 내적 인도와 인간의 왜곡된 의지에 대한 성경적 진술
