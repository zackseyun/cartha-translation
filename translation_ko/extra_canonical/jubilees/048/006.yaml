    rationale: ዘከመ ትግበር은 ‘당신이 그것을 하도록/행하도록’이라는 목적을 나타내므로, 한국어에서도 ‘행하시도록 하였고’로 옮기는 것이 더 직접적입니다.
  - severity: low
    issue: ‘거기에’가 원문에 없는 장소 지시를 추가합니다.
    rationale: ወሀለወከ는 ‘당신이 계셨다/현존했다’라는 뜻이며, 특정 장소를 뜻하는 요소는 보이지 않습니다.
  - severity: low
