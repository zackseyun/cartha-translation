  yaml_path: translation/extra_canonical/jubilees/048/006.yaml
  text: And he burned them with fire. And everything was entrusted into your hand so that you might do it, before it was done, and you were present.
  footnotes:
  - marker: a
    text: Or 'and nothing was done apart from you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 그들을 불로 태웠습니다. 또 모든 것이 당신의 손에 맡겨져, 당신께서 그것을 행하시도록 하였고, 그것이 이루어지기 전에 당신께서는 이미 계셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신 없이 이루어진 일은 아무것도 없었습니다.”
    reason: 게에즈어 구절에 대해 이전 영어 본문이 채택했던 대안적 해석을 기록합니다. 본문은 최신 원문 검토를 따라 ‘그것이 이루어지기 전에’와 ‘당신께서 이미 계셨습니다’라는 독법을 따릅니다.
lexical_decisions:
- source_word: ወአውዐዮሙ፡ በእሳት።
  english_pob_choice: And he burned them with fire.
  chosen_korean: “그가 그들을 불로 태웠습니다”
  alternatives_korean:
  - “그가 그들을 불에 태웠습니다”
  - “그가 그들을 불길로 태웠습니다”
  lexicon: burn; fire
  rationale: 동사 ‘태우다’와 도구격 ‘불로’가 가장 직접적으로 원문의 행위를 살리며, 과도한 의역 없이 자연스러운 현대 한국어로 전달합니다.
- source_word: ወኵሉ፡ ተፈነወ፡ በእዴከ፡
  english_pob_choice: And everything was entrusted into your hand
  chosen_korean: “모든 것이 당신의 손에 맡겨져”
  alternatives_korean:
  - “모든 것이 당신의 손에 넘겨져”
  - “모든 것이 당신의 손에 주어져”
  lexicon: entrust; hand
  rationale: 영어 POB의 ‘entrusted’를 반영해 ‘맡겨지다’를 택했고, ‘손에’는 책임과 통제권을 나타내는 원문의 관용을 자연스럽게 옮깁니다.
- source_word: ዘእንበለ፡ ይትገበር፡
  english_pob_choice: before it was done
  chosen_korean: “그것이 이루어지기 전에”
  alternatives_korean:
  - “그것이 행해지기 전에”
  - “그것이 되기 전에”
  lexicon: before it was done
  rationale: 최신 검토에서 이 구는 ‘nothing was done apart from you’가 아니라 ‘before it was done’의 의미로 정정되었으므로, 시간적 선행을 분명히 드러내는 표현을 택했습니다.
- source_word: ወሀለወከ፡
  english_pob_choice: and you were present.
  chosen_korean: “당신이 거기에 계셨습니다”
  alternatives_korean:
  - “당신이 그곳에 계셨습니다”
  - “당신이 함께 계셨습니다”
  lexicon: be present; be there
  rationale: 원문의 ‘있다/존재하다’ 의미를 살리되, 하나님께 대한 존칭을 반영해 ‘계셨습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘before it was done’와 ‘you were present’의 병렬 의미
  chosen_reading: 모든 일이 당신의 손에 맡겨졌고, 그것이 이루어지기 전에 이미 당신이 거기에 계셨다는 의미로 이해했습니다.
  alternative_readings:
  - ‘당신 외에는 아무 일도 일어나지 않았다’는 식의 총괄적 배제 의미
  - ‘당신이 그것을 미리 알고 계셨다’는 단순한 예지 의미
  rationale: 게에즈 본문과 최신 영문 감수는 시간적 선행과 현존을 함께 말하므로, 단순한 부정 표현이나 예지 표현으로 축소하지 않았습니다.
  doctrine_reference: 섭리와 현존
- issue: 하나님께 대한 2인칭 존칭
  chosen_reading: 직접 호칭이 아니더라도 문맥상 신적 상대를 가리키므로 ‘당신’과 ‘계셨습니다’를 사용했습니다.
  alternative_readings:
  - 비인칭적으로 ‘그분’ 사용
  - 기도문식 ‘주님’ 사용
  rationale: 서사적 진술의 격식을 유지하면서도, 하나님께 대한 존칭을 해치지 않는 표준 한국어 표현을 택했습니다.
  doctrine_reference: 문체/신학적 경어
