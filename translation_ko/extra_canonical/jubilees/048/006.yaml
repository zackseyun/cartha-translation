review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 게에즈어의 ‘그가 그들을 불로 태웠다’를 충실히 반영합니다. 후반부도 최신 본문 판단에 따라 ‘당신 없이 아무 일도 이루어지지 않았다’가 아니라 ‘그 일이 이루어지기 전에, 당신이 계셨다’라는 시간적 선행과 현존을 보존해야 합니다. 다만 초안의 ‘당신이 그것을 행하게 되었고’는 목적을 나타내는 ‘~하도록’보다 결과·수동의 뉘앙스가 강하며, ‘거기에’는 원문에 없는 특정 장소를 보탭니다.
  naturalness: ‘모든 것이 당신의 손에 맡겨져, 당신께서 그것을 행하시도록 하였고’가 원문의 위임과 목적 관계를 더 자연스럽고 명료하게 드러냅니다. ‘이미 계셨습니다’는 현존을 자연스럽게 표현하면서도 ‘거기에’가 더하는 불필요한 장소성을 피합니다.
  terminology: ‘불로 태웠습니다’, ‘당신의 손에 맡겨져’, ‘이루어지기 전에’는 적절합니다. 문맥상 2인칭의 정체를 번역에서 ‘하나님’이나 ‘주님’으로 특정하지 않고, 원문의 직접 호칭을 유지합니다. 각주에는 폐기된 대안 해석을 명시하여 논쟁 지점을 투명하게 처리합니다.
  issues:
