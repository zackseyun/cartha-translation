  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the angel Mastema was bound and restrained from following after the children of Israel.
  footnotes:
  - marker: a
    text: The binding of Mastema across specific days highlights Jubilees' interest in exact calendrical sequence during Passover and the Exodus.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 열네째 날과 열다섯째 날과 열여섯째 날과 열일곱째 날과 열여덟째 날에 마스테마 천사는 묶였고 이스라엘 자손을 뒤쫓지 못하도록 제지되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተእስረ
  english_pob_choice: was bound
  chosen_korean: 묶여
  alternatives_korean:
  - 매여
  - 구속되어
  - 결박되어
  lexicon: Leslau
  rationale: Geʿez 수동형은 실제로 묶이거나 결박된 상태를 가리키므로, 영어 POB의 'was bound'를 자연스럽게 살려 '묶여'로 옮겼습니다.
- source_word: ተዐግሠ
  english_pob_choice: restrained
  chosen_korean: 뒤쫓지 못하게 되었습니다
  alternatives_korean:
  - 억제되었습니다
  - 제지되었습니다
  - 막혔습니다
  lexicon: Leslau
  rationale: 이 동사는 단순 정지가 아니라 뒤따라가서 해치려는 움직임이 제한된 뜻이어서, 문맥을 살려 '뒤쫓지 못하게 되었습니다'로 풀었습니다.
- source_word: መልአክ
  english_pob_choice: angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 메신저
  - 왕자
  lexicon: Leslau
  rationale: 해당 어휘의 기본 의미가 '천사/사자'이며, 이 문맥에서는 초월적 존재를 가리키므로 '천사'가 가장 직접적입니다.
- source_word: ደቂቀ እስራኤል
  english_pob_choice: the children of Israel
  chosen_korean: 이스라엘 자손
  alternatives_korean:
  - 이스라엘의 자녀들
  - 이스라엘 백성
  lexicon: standard biblical Korean usage
  rationale: 문자적으로는 '이스라엘의 자녀들'이지만, 고전적 성서 표현과 문맥상 집합적 의미를 살려 '이스라엘 자손'으로 옮겼습니다.
theological_decisions:
- issue: Mastema의 직함 처리
  chosen_reading: 고유명사 '마스테마'에 '천사'를 붙여, 본문의 서술을 그대로 반영했습니다.
  alternative_readings:
  - '''마스테마 군주'''
  - '''마스테마 사자'''
  rationale: 이 절의 Geʿez 본문은 መልአክ('천사')를 분명히 포함하므로, 직함을 약화시키거나 다른 전승의 호칭으로 바꾸지 않았습니다.
  doctrine_reference: 본문 표면 의미 보존 원칙
