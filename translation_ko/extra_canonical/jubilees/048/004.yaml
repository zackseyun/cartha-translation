  - severity: medium
    issue: 관계절의 한국어 수식 관계가 부자연스러움
    rationale: ‘너희가 보내진 그 표징들’은 ‘보내진’의 주체·목적이 불분명합니다. 원문의 ‘그것들을 하도록 보내졌다’는 뜻을 ‘네가 하도록 보내진 표징들과 기이한 일들’로 옮기는 것이 명료합니다.
  - severity: low
