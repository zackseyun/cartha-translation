translation:
  language: ko
  text: 그러나 내가 그의 손에서 너희를 구해 내었고, 너희는 이집트에서 바로와 그의 온 집안과 그의 종들과 그의 백성을 향해 너희가 보내진 그 표징들과 기이한 일들을 행했습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባላሕኩከ፡ እምእዴሁ
  english_pob_choice: I delivered you from his hand
  chosen_korean: 내가 그의 손에서 너희를 구해 내었고
  alternatives_korean:
  - 내가 그의 손에서 너희를 건져 내었고
  - 내가 그의 손에서 너희를 구원하였고
  lexicon: 구해 내다
  rationale: 손에서의 구출이라는 구체적 이미지를 살리면서도, 본문의 구원 행위를 자연스럽고 직접적으로 표현했습니다.
- source_word: ገበርከ፡ ተአምረ፡ ወመንክረ፡
  english_pob_choice: you did the signs and wonders
  chosen_korean: 너희는 … 표징들과 기이한 일들을 행했습니다
  alternatives_korean:
  - 너희는 … 표징들과 놀라운 일들을 했습니다
  - 너희는 … 이적과 기사를 행했습니다
  lexicon: 표징, 기이한 일 / 행하다
  rationale: source의 이중 표현을 따라 ‘표징들과 기이한 일들’로 두어 반복성을 살리고, ‘행하다’로 행위 동사를 보존했습니다.
- source_word: ለዛ፡ ተፈነውከ፡ ትግበር፡
  english_pob_choice: which you were sent to do
  chosen_korean: 너희가 보내진 그
  alternatives_korean:
  - 너희가 보내진 그것을
  - 그 일을 하도록 보내진
  lexicon: 보내지다, 하다
  rationale: 원문은 ‘보내심을 받은 목적’과 ‘그 표징과 기이한 일들’의 연결을 담으므로, 한국어에서도 목적절을 너무 풀지 않고 관계적으로 유지했습니다.
- source_word: ፈርዖን፡ ወላዕለ፡ ኵሉ፡ ቤቱ፡ ወላዕለ፡ አግብርቱ፡ ወላዕለ፡ ሕዝቡ
  english_pob_choice: against Pharaoh and against all his house and against his servants and against his people
  chosen_korean: 바로와 그의 온 집안과 그의 종들과 그의 백성을 향해
  alternatives_korean:
  - 바로와 그의 온 집안과 그의 종들과 그의 백성에게
  - 바로와 그의 온 집안과 그의 종들과 그의 백성에 맞서
  lexicon: ~을 향해
  rationale: 반복되는 전치사의 대립 관계를 유지하되, 한국어에서는 같은 전치사를 기계적으로 반복하기보다 ‘향해’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 표징과 기이한 일들의 목적절 결합
  chosen_reading: ‘너희가 보내진 그 표징들과 기이한 일들’로 목적 연결을 살려, 출애굽 사건에서 모세/아론에게 맡겨진 하나님의 사명을 드러냈습니다.
  alternative_readings:
  - ‘너희가 보내진 일을’로 일반화
  - ‘보내심을 받은 그 일들’로 재구성
  rationale: Geez의 관계절은 단순한 수행이 아니라 파견 목적을 강조하므로, 본문의 사명성과 소명 구조가 약해지지 않도록 유지했습니다.
  doctrine_reference: 성경 본문의 소명-사명 구조 보존
