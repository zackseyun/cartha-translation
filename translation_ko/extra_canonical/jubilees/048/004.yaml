  source_fidelity: 원문의 동사 접미사는 단수 2인칭이므로 ‘너희’가 아니라 ‘너’로 옮겨야 합니다. 또한 파견의 목적을 나타내는 관계절은 ‘네가 하도록 보내진’으로 자연스럽고 충실하게 표현할 수 있습니다. 대상을 향한 반복 전치사는 표징과 기이한 일이 바로와 그 집단을 대상으로 한 대항 행위임을 나타내므로 ‘거슬러’가 적절합니다.
  naturalness: 초안의 ‘너희가 보내진 그 표징들과 기이한 일들’은 수식 관계가 다소 어색합니다. ‘네가 하도록 보내진 표징들과 기이한 일들’은 현대 한국어 합쇼체에서 명확하고 자연스럽습니다.
  terminology: ‘표징들과 기이한 일들’ 및 ‘행했습니다’는 원문의 이중 표현과 격식 있는 성서 문체를 잘 반영하므로 유지합니다. ‘그의 온 집안’은 바로의 household를 충실히 옮깁니다.
