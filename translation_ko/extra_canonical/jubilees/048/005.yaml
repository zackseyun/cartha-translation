revisions:
- from: 야훼께서는 이스라엘을 위하여 그들에게 큰 보복을 행하셨습니다. 그분은 피와 개구리와 모기와 파리와, 물집이 생기며 터지는 악성 종기들로 그들을 치셨고, 그들의 가축은 죽음으로 치셨으며, 우박으로 치셔서 — 이로써 그들에게 남아 있던 모든 새싹을 멸하셨습니다 — 메뚜기가 우박에서 남은 것을 먹어 치우게 하셨고, 흑암과 사람과 짐승의 맏아들의 죽음으로 치셨습니다. 또한 그들의 모든 신들 위에도 야훼께서 보복을 행하셨습니다.[a]
