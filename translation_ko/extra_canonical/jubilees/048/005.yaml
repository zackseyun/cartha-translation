  yaml_path: translation/extra_canonical/jubilees/048/005.yaml
  text: 'And the LORD executed a great vengeance on them for Israel: he struck them with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters, and their livestock with death, and with hailstones—by this he destroyed everything that grew for them—and with locusts that devoured what had been left for them from the hail, and with darkness, and with the death of their firstborn, of man and beast; and on all their gods the LORD executed vengeance.'
translation:
  language: ko
  text: 야훼께서는 이스라엘을 위하여 그들에게 큰 보복을 행하셨습니다. 그분은 피와 개구리와 모기와 파리와, 물집이 생기며 터지는 악성 종기들로 그들을 치셨고, 그들의 가축은 죽음으로 치셨으며, 우박으로 치셔서 — 이로써 그들에게 남아 있던 모든 새싹을 멸하셨습니다 — 메뚜기가 우박에서 남은 것을 먹어 치우게 하셨고, 흑암과 사람과 짐승의 맏아들의 죽음으로 치셨습니다. 또한 그들의 모든 신들 위에도 야훼께서 보복을 행하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: the LORD
  chosen_korean: 야훼
  alternatives_korean:
  - 주님
  - 여호와
  lexicon: YHWH
  rationale: 사전 기본값대로 신명은 학술적 음역인 야훼를 사용해 원문 고유명성을 드러내고, 영어 POB의 LORD와도 대응시켰습니다.
- source_word: በቀለ / በቀለ፡ ዐቢየ
  english_pob_choice: great vengeance / executed vengeance
  chosen_korean: 큰 보복을 행하셨습니다 / 보복을 행하셨습니다
  alternatives_korean:
  - 큰 원수를 갚으셨습니다
  - 앙갚음을 하셨습니다
  lexicon: נקם / ἐκδίκησις 계열
  rationale: 문맥상 단순한 감정적 ‘복수’보다 공적 심판의 성격이 강하므로, 영어 POB의 vengeance를 따라 ‘보복’을 택하되 행위동사는 자연스러운 한국어로 풀었습니다.
- source_word: በደም፡ ወበቍርነነዓን፡ ወበትነንያ፡ ወበጽንጽያ፡ ክልብ፡ ወበእኩይ፡ ቍስል
  english_pob_choice: with blood, and with frogs, and with gnats, and with dog-flies, and with evil boils that burst out in blisters
  chosen_korean: 피와 개구리와 모기와 파리와, 물집이 생기며 터지는 악성 종기들로
  alternatives_korean:
  - 피와 개구리와 각다귀와 개파리와, 악한 종기들로
  - 피와 개구리와 곤충 떼와 파리와, 독한 종기들로
  lexicon: 출애굽 재앙 어휘
  rationale: 재앙 목록은 영어 POB의 구체성을 따라 직역하되, 고어적·불명확한 곤충 명칭은 한국어로는 의미가 분명한 일반 명칭으로 옮겼고, ‘burst out in blisters’는 ‘물집이 생기며 터지는’으로 반영했습니다.
- source_word: በረድ / አንበጣ / ጽልመት / ዘተረፎሙ
  english_pob_choice: hailstones / locusts / darkness / what had been left for them from the hail
  chosen_korean: 우박 / 메뚜기 / 흑암 / 우박에서 남은 것
  alternatives_korean:
  - 우박덩이 / 황충 / 어둠 / 우박 뒤에 남은 것
  - 우박 / 메뚜기 떼 / 캄캄함 / 우박으로 남겨진 것
  lexicon: 출애굽기 재앙 반복 표현
  rationale: 출애굽 재앙의 상호본문성을 살리기 위해 ‘우박, 메뚜기, 흑암’을 유지했고, 영어 POB의 ‘what had been left for them from the hail’을 따라 ‘우박에서 남은 것’으로 간결하게 옮겼습니다.
theological_decisions:
- issue: ‘보복’ 표현의 신학적 톤
  chosen_reading: 이 절은 출애굽 재앙을 하나님의 공적 심판으로 묘사하므로, 감정적 보복이 아니라 언약 백성을 위한 न्याय/심판적 보복으로 읽었습니다.
  alternative_readings:
  - 원수 갚음
  - 앙갚음
  - 징벌
  rationale: 히브리성/성서적 문맥에서는 단순 사적 복수보다 하나님이 역사 속에서 악에 대해 내리시는 응보적 심판을 강조하므로, 한국어로도 그 긴장을 유지해야 합니다.
  doctrine_reference: 출애굽기 재앙 본문과 성서의 신적 심판 전통
