base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/009.yaml
  text: And the prince Mastema stood up against you and sought to cast you into Pharaoh’s hand, and he helped the magicians of Egypt, and they stood and acted before you. We indeed permitted them to do evil, but we did not allow healing to be performed by their hands. But the LORD struck them with evil sores, and they were unable to continue resisting, because we made them incapable of performing even one sign of enchantment. And through all the signs and wonders the prince Mastema was put to shame, until, when he grew strong, he cried out to the Egyptians that they should pursue after you with all the power of Egypt, with their chariots and with their horses and with all the multitude of the people of Egypt. And I stood between the Egyptians and Israel, and we delivered Israel from his hand and from the hand of his people, and the LORD brought them out through the midst of the sea as on dry land.
  footnotes:
  - marker: a
    text: Or 'They indeed practiced their arts, and we permitted them so that they might be done by their hands.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 군주 마스테마가 당신을 거슬러 일어나 당신을 파라오의 손에 넘기려 하였으며, 이집트의 마술사들을 도왔고, 그들은 일어나 당신 앞에서 마술을 행했습니다. 우리는 참으로 그들이 악을 행하도록 허락했지만, 그들의 손으로 치유가 이루어지도록 허락하지는 않았습니다. 그러나 주님께서 그들을 악한 종기로 치셨고, 그들은 더는 맞설 수 없었습니다. 우리가 그들로 하여금 단 하나의 마술 표적도 행할 수 없게 하셨기 때문입니다. 온갖 표적과 기적을 통하여 군주 마스테마는 수치를 당하였습니다. 마침내 그가 기세를 얻자, 이집트인들에게 외쳐 이집트의 온 힘과 병거와 말과 이집트 백성의 온 무리를 이끌고 당신을 뒤쫓으라고 하였습니다. 그리고 제가 이집트 사람들과 이스라엘 사이에 섰으며, 우리는 이스라엘을 그의 손과 그의 백성의 손에서 구해 내었고, 주님께서는 그들을 바다 한가운데로 마른 땅처럼 지나가게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኰንን መስተማ
  english_pob_choice: the prince Mastema
  chosen_korean: 마스테마의 군주
  alternatives_korean:
  - 마스테마의 왕자
  - 마스테마 군주
  lexicon: 고유명사/직함
  rationale: 영문 POB의 ‘prince Mastema’를 직역하되, ‘마스테마’는 고유명사로 두고 ‘군주’로 옮겨 위계와 악의 지배성을 살렸습니다.
- source_word: እኩየስኬ
  english_pob_choice: do evil
  chosen_korean: 악을 행하도록
  alternatives_korean:
  - 악을 저지르도록
  - 악하게
  lexicon: 동사구
  rationale: 본문의 명시적 대조는 ‘악을 행하게 함’과 ‘치유를 막음’ 사이에 있으므로, 추상화하지 않고 행위 자체를 분명히 드러냈습니다.
- source_word: ፈውሳስ
  english_pob_choice: healing
  chosen_korean: 치유
  alternatives_korean:
  - 치료
  - 의술
  lexicon: 의미역
  rationale: 영문 본문과 주석이 ‘healing’으로 읽고 있으므로, 일반적이면서도 본문의 대조를 유지하는 ‘치유’를 택했습니다.
- source_word: ቍስል፡ እኩይ
  english_pob_choice: evil sores
  chosen_korean: 악한 종기
  alternatives_korean:
  - 악한 상처
  - 독한 종기
  lexicon: 의학적 표현
  rationale: ‘종기’가 피부의 부종성 병변을 가장 직접적으로 전달하며, 형용사 ‘악한’으로 심판성 질병의 강도를 살렸습니다.
theological_decisions:
- issue: 주님의 행위와 허용의 구분
  chosen_reading: 하나님께서 마술사들의 악행은 허락하셨지만, 치유 행위는 허락하지 않으셨다는 구분을 살렸습니다.
  alternative_readings:
  - 모든 일을 동일하게 허락하셨다는 완화된 표현
  - 단순히 그들의 기술을 막으셨다는 일반화
  rationale: 개정 근거가 된 히브리어/게에즈 흐름과 영문 POB는 ‘악은 허락, 치유는 금지’라는 대조를 강조하므로, 이를 흐리지 않도록 옮겼습니다.
  doctrine_reference: 섭리와 심판의 구분
