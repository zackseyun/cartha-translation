  text: Again, in the second year of the fiftieth jubilee, you know what was spoken to you on Mount Sinai, and what the prince Mastema desired to do to you when you were returning to Egypt.
  footnotes:
  - marker: a
    text: Or 'you shall know'.
    reason: previous_rendering
  - marker: b
    text: Or 'entering'.
    reason: previous_rendering
translation:
  language: ko
  text: 다시, 쉰 번째 희년의 둘째 해에, 시내 산에서 너에게 말씀하신 것과, 네가 이집트로 돌아가고 있을 때 그대적(Mastema) 왕자가 너에게 하려고 했던 일을 너는 압니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታአምር
  english_pob_choice: you know
  chosen_korean: 너는 압니다
  alternatives_korean:
  - 너는 알게 될 것입니다
  - 너는 알 것입니다
  lexicon: 없음
  rationale: 문맥상 이미 알려진 사건을 상기시키는 표현이므로, POB의 수정본처럼 현재적 인식인 ‘압니다’로 옮겼습니다.
- source_word: በዓመት ካልእ በውስተ ፶ኢዮቤሌው
  english_pob_choice: in the second year of the fiftieth jubilee
  chosen_korean: 쉰 번째 희년의 둘째 해에
  alternatives_korean:
  - 오십 번째 희년의 둘째 해에
  - 쉰째 희년의 두 번째 해에
  lexicon: 없음
  rationale: 희년을 서수식으로 자연스럽게 풀어 ‘쉰 번째 희년’으로 옮기고, 연대 표현은 한국어답게 ‘-의 둘째 해에’로 처리했습니다.
- source_word: መኰንን መስተማ
  english_pob_choice: the prince Mastema
  chosen_korean: 그대적(Mastema) 왕자
  alternatives_korean:
  - 마스테마 왕자
  - 그 왕자 마스테마
  lexicon: 고유명사 음역
  rationale: 마스테마는 음역을 유지하되, 지위를 나타내는 ‘왕자’는 직역해 본문 흐름과 의미를 보존했습니다.
- source_word: አመ፡ ትገብእ፡ ግብጸ፡
  english_pob_choice: when you were returning to Egypt
  chosen_korean: 네가 이집트로 돌아가고 있을 때
  alternatives_korean:
  - 네가 이집트로 돌아갈 때
  - 네가 이집트로 돌아오는 중에
  lexicon: 없음
  rationale: 게에즈 동사의 귀환 의미를 따라, POB 개정본의 ‘returning to’에 맞게 진행 중 상황으로 옮겼습니다.
theological_decisions:
- issue: 지시 대상의 2인칭 단수 유지
  chosen_reading: 본문의 ‘너/네가’로 일관되게 단수 خطاب을 유지했습니다.
  alternative_readings:
  - 당신은/당신이
  - 너희는/너희가
  rationale: 모세를 향한 직접 خطاب이므로 단수 인칭을 유지해야 하며, 한국어 합쇼체 안에서도 서술은 정중하게 하되 인칭은 보존하는 것이 원문에 가깝습니다.
  doctrine_reference: 본문 서사 정합성
- issue: Mastema의 표기
  chosen_reading: 음역 ‘마스테마’를 유지하고 지위어 ‘왕자’를 덧붙였습니다.
  alternative_readings:
  - 사탄
  - 악한 군주
  rationale: 본문 자체가 고유명사와 직위를 제시하므로 해석적으로 대체하지 않고, 독자가 인물명을 추적할 수 있게 음역을 보존했습니다.
  doctrine_reference: 본문 고유명사 보존 원칙
