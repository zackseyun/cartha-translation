- from: 다시, 쉰 번째 희년의 둘째 해에, 시내 산에서 너에게 말씀하신 것과, 네가 이집트로 돌아가고 있을 때 그대적(Mastema) 왕자가 너에게 하려고 했던 일을 너는 압니다.[a][b]
  to: 다시, 쉰 번째 희년의 둘째 해에, 당신은 시내 산에서 당신에게 말씀하신 것과, 당신이 이집트로 돌아가고 있을 때 통치자 마스테마가 당신에게 하려고 했던 일을 아십니다.[a][b]
  rationale: 고유명사 오기를 ‘마스테마’로 바로잡고, 직위어는 왕실 혈연을 암시하는 ‘왕자’ 대신 원문의 일반적 직위 의미를 살린 ‘통치자’로 옮겼습니다. 합쇼체와 조화되도록 2인칭 단수 خطاب은 ‘당신은 아십니다’로 다듬었습니다. 영어 POB 감사 이력과 게에즈 동사의 가능한 범위는 본문 의미를 바꾸지 않는 대안 각주로 보존했습니다.
