revisions:
- from: 그리고 그가 끌어내신 모든 백성이 이스라엘을 뒤쫓았습니다. 주 하나님은 그들을 바다 한가운데, 깊은 심연 속으로, 이스라엘 자손 아래로 던지셨습니다. 이는 이집트 백성이 자기 자녀들을 강에 던졌던 것과 같았습니다. 그분은 그들 가운데 백만 명에게 보복하셨고, 천 명의 용사가 멸망했으며, 그들을 뒤쫓던 자들은 시기로 말미암아 멸망했습니다.[a][b][c]
  to: 그리고 그가 끌어내신 모든 백성이 이스라엘을 뒤쫓았습니다. 주 하나님께서는 그들을 바다 한가운데, 깊은 심연 속으로, 이스라엘 자손 아래로 던지셨습니다. 이집트 백성이 자기 자녀들을 강에 던졌던 것처럼 하신 것입니다. 그분은 그들 중 백만 명에게 원수를 갚으셨고, 천 명의 강한 자들이 멸망했으며, 그들을 뒤쫓던 자들은 시기 때문에 멸망했습니다.
  rationale: 비교절을 원문의 직접적인 ‘…처럼’ 구조로 바로잡아 이집트인의 자녀 투기와 바다 심판의 대응 관계를 명확히 했습니다. 응보 동사는 현대 한국어에서 자연스럽고 원문의 뜻을 보존하는 ‘원수를 갚으셨고’로, ‘용사’는 불필요한 구체화를 피한 ‘강한 자들’로 조정했습니다. 기존 영어 감사 이력의 각주는 이전 번역의 오류 또는 영어의 대안적 분절 기록이므로, 한국어 번역에 의미 있는 대안으로 제시하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:23Z'
