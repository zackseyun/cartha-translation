  text: And all the people whom he had brought out pursued after Israel, and the Lord God cast them into the midst of the sea, into the depths of the abyss, beneath the children of Israel, just as the people of Egypt had cast their children into the river; He took vengeance on a million of them, and one thousand mighty men were destroyed, and those who pursued them perished because of envy.
  footnotes:
  - marker: a
    text: Or 'just as the children of Egypt had gone down into the river'.
    reason: previous_rendering
  - marker: b
    text: Or 'one hundred thousand and ten thousand mighty men were destroyed'.
    reason: previous_rendering
  - marker: c
    text: Or 'into its depths, beneath'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 끌어내신 모든 백성이 이스라엘을 뒤쫓았습니다. 주 하나님은 그들을 바다 한가운데, 깊은 심연 속으로, 이스라엘 자손 아래로 던지셨습니다. 이는 이집트 백성이 자기 자녀들을 강에 던졌던 것과 같았습니다. 그분은 그들 가운데 백만 명에게 보복하셨고, 천 명의 용사가 멸망했으며, 그들을 뒤쫓던 자들은 시기로 말미암아 멸망했습니다.[a][b][c]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ የብስ።
  english_pob_choice: And all the people whom he had brought out
  chosen_korean: 그가 끌어내신 모든 백성
  alternatives_korean:
  - 그가 이끌어 내신 모든 사람들
  - 그가 데리고 나오신 모든 백성
  lexicon: 출애굽/인도 동사
  rationale: Ge'ez의 ‘끌어내다/밖으로 내보내다’ 의미를 살려, 출애굽 맥락을 분명히 하는 표현을 택했습니다.
- source_word: ወረዎሙ፡ እግዚአብሔር፡ አምላክ፡
  english_pob_choice: the Lord God cast them
  chosen_korean: 주 하나님은 그들을 던지셨습니다
  alternatives_korean:
  - 주 하나님은 그들을 떨어뜨리셨습니다
  - 주 하나님은 그들을 빠뜨리셨습니다
  lexicon: 던지다/내던지다 동사
  rationale: 본문의 적극적 행위성을 살리기 위해 ‘던지셨습니다’로 옮겼으며, 단순한 추락보다 심판의 주도성을 드러냅니다.
- source_word: ሰቀላይ፡
  english_pob_choice: the depths of the abyss
  chosen_korean: 깊은 심연
  alternatives_korean:
  - 깊은 구렁
  - 무저갱의 깊은 곳
  lexicon: 심연/깊은 곳 명사
  rationale: '`ሰቀላይ`가 단순한 물의 깊이보다 ‘심연/깊음’의 뉘앙스를 지니므로, 한국어에서도 초월적 깊이를 드러내는 ‘심연’을 선택했습니다.'
- source_word: በእንተ፡ ሕሱዳ፡
  english_pob_choice: because of envy
  chosen_korean: 시기로 말미암아
  alternatives_korean:
  - 질투 때문에
  - 시기심으로 인해
  lexicon: 시기/질투 명사구
  rationale: 행위의 원인을 나타내는 전치사구로 이해하여, 원인의 뉘앙스를 자연스럽게 살린 ‘말미암아’를 사용했습니다.
theological_decisions:
- issue: 보복/심판의 언어
  chosen_reading: 그분은 그들 가운데 백만 명에게 보복하셨고
  alternative_readings:
  - 그분은 그들 가운데 백만 명을 벌하셨고
  - 그분은 그들 가운데 백만 명을 갚으셨고
  rationale: Ge'ez의 보복/응보 개념을 약화시키지 않기 위해, 단순한 처벌보다 응보적 심판을 드러내는 ‘보복하셨고’를 택했습니다.
  doctrine_reference: 공의와 응보적 심판
- issue: 수치 표현의 과장/기념적 숫자 유지
  chosen_reading: 백만 명
  alternative_readings:
  - 십만 명
  - 백만 명 정도
  rationale: 원문의 수사적 규모를 그대로 반영하기 위해 문자적 수치를 유지했으며, 영어 POB의 개정도 이를 지지합니다.
  doctrine_reference: 본문 수치 보존
