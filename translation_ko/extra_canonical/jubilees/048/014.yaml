  source_fidelity: 핵심 내용과 수치(백만 명, 천 명)는 게에즈어 본문 및 영어 POB 개정 이력에 대체로 충실합니다. 다만 비교절의 관계를 한국어에서 더 직접적으로 나타내고, ‘용사’의 해석적 뉘앙스를 피하는 편이 안전합니다.
