base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/015.yaml
  text: And on the fourteenth day, and on the fifteenth, and on the sixteenth, and on the seventeenth, and on the eighteenth, the prince Mastema was bound and imprisoned behind the children of Israel.
  footnotes:
  - marker: '15'
    text: The Ethiopic appears to mention silver, gold, and a third class of goods often understood as garments or valuable articles; 'articles of bronze' follows the most immediate lexical sense here, though the list is textually difficult.
    reason: textual_variant
  - marker: a
    text: Or 'And on the fourteenth day the guardian who had been appointed over all the powers among the peoples came from the wilderness of Etham[15], and his name was Mastema. And he wanted to accuse the children of Israel.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 열넷째 날과 열다섯째 날과 열여섯째 날과 열일곱째 날과 열여덟째 날에, 통치자 마스테마는 이스라엘 자손의 뒤에 결박되어 갇혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጠባቂት / guardian
  english_pob_choice: the guardian who had been appointed over all the powers among the peoples
  chosen_korean: 수호자
  alternatives_korean:
  - 감시자
  - 보호자
  - 파수꾼
  lexicon: 지정 용어 없음
  rationale: 지위와 기능을 함께 드러내는 중립적 표현으로, 본문의 초월적 존재를 과도하게 해석하지 않으면서도 단순한 인간 감시자보다 넓은 의미를 살립니다.
- source_word: ዘገደፉ / appointed over all the powers among the peoples
  english_pob_choice: who had been appointed over all the powers among the peoples
  chosen_korean: 민족들 가운데 있는 모든 권세 위에 세워진
  alternatives_korean:
  - 민족들 위의 모든 권세를 맡은
  - 백성들 사이의 모든 권능 위에 임명된
  lexicon: 지정 용어 없음
  rationale: 권세/권능의 통치적 뉘앙스를 살리되, 영어 POB의 audit trail과 어긋나지 않도록 ‘세워진’으로 임명·배치의 의미를 반영했습니다.
- source_word: ማእከለ፡ ፈለገ፡ እምውሉደ፡ ሕዝብከ / from the wilderness of Etham
  english_pob_choice: came from the wilderness of Etham
  chosen_korean: 에담 광야에서 와서
  alternatives_korean:
  - 에담의 광야에서 와서
  - 에담 들에서 와서
  lexicon: 지정 용어 없음
  rationale: 지명은 음역을 유지하고, 동사의 방향성을 자연스러운 한국어로 옮겨 ‘와서’로 처리했습니다.
- source_word: ወአመ... ዕለት / on the fourteenth day
  english_pob_choice: on the fourteenth day
  chosen_korean: 열넷째 날에
  alternatives_korean:
  - 십사일에
  - 열네째 날에
  lexicon: 지정 용어 없음
  rationale: 현대 한국어에서 가장 자연스러운 서수 표현으로 옮겼습니다.
- source_word: ወዐዐወ / he wanted to accuse
  english_pob_choice: He wanted to accuse
  chosen_korean: 고발하고자 했습니다
  alternatives_korean:
  - 고소하고자 했습니다
  - 비난하고자 했습니다
  - 참소하고자 했습니다
  lexicon: 지정 용어 없음
  rationale: 법정적·대적적 의미를 살리면서도 현대 독자가 이해하기 쉬운 동사로 옮겼습니다. 전통적 교회 용어인 ‘참소’도 가능하지만, 본문 의미를 더 직접적으로 드러내는 ‘고발’이 적절합니다.
theological_decisions:
- issue: Mastema의 지위 표현
  chosen_reading: ‘민족들 가운데 있는 모든 권세 위에 세워진 수호자’로 옮겨, 본문이 말하는 초자연적/권세적 존재의 성격을 유지했습니다.
  alternative_readings:
  - ‘민족들 위의 모든 권세를 맡은 자’
  - ‘모든 민족의 세력 위에 있는 존재’
  rationale: 본문은 단순한 인간 관리자가 아니라 권세들 위에 배치된 존재를 묘사하므로, 중립적이면서도 위계적 성격이 드러나는 표현을 택했습니다.
  doctrine_reference: 성경외경/유딧 전승과 구별되는 쥬빌리 계열의 악한 영적 존재 묘사
