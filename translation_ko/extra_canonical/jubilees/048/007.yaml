  text: 'And you were to speak before the king of Egypt, before all his servants and before his people. And everything happened at your word: ten great and grievous judgments came upon the land of Egypt, for you to carry out.'
  footnotes:
  - marker: a
    text: Or 'to be carried out.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 당신은 이집트 왕 앞에서, 그의 모든 신하들 앞에서, 그리고 그의 백성 앞에서 말해야 합니다. 그리고 모든 일이 당신의 말대로 일어났습니다. 곧 큰 재앙과 무거운 재앙 열 가지가 이집트 땅에 내려왔으니, 당신이 그것을 집행하게 하려는 것이었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትትናገር ... በቅድመ ...
  english_pob_choice: you were to speak before ...
  chosen_korean: 말해야 합니다
  alternatives_korean:
  - 말하도록 되어 있었습니다
  - 말하셔야 했습니다
  lexicon: Ge'ez 동사/서술 구문
  rationale: 명령·예정의 의미를 살려, 단순 과거보다 '말해야 합니다'로 장면의 지시성을 드러냈습니다.
- source_word: ኵሎሙ ላእካኒሁ ወበቅድመ ሕዝቡ
  english_pob_choice: before all his servants and before his people
  chosen_korean: 그의 모든 신하들 앞에서, 그리고 그의 백성 앞에서
  alternatives_korean:
  - 그의 모든 종들 앞에서, 그리고 그의 백성 앞에서
  - 그의 모든 일꾼들 앞에서, 그리고 그의 백성 앞에서
  lexicon: Geez ላእካኒሁ / ሕዝብ
  rationale: 왕실 문맥에서 ላእካኒሁ는 '신하들'이 자연스럽고, ሕዝቡ는 '백성'으로 옮겨 공개적 대면을 분명히 했습니다.
- source_word: ዐሥሩ ኵነኔ ዐበይት ወጸዋጋት
  english_pob_choice: ten great and grievous judgments
  chosen_korean: 큰 재앙과 무거운 재앙 열 가지
  alternatives_korean:
  - 열 가지 크고 무거운 심판
  - 열 가지 크고 중한 재앙
  lexicon: Ge'ez ኵነኔ / ዐበይት / ጸዋጋት
  rationale: 문맥상 'judgments'는 단순한 판결이 아니라 이집트에 내린 재난이므로 '재앙'으로 옮기되, '큰/무거운'을 분리해 강조를 보존했습니다.
- source_word: ከመ፡ ትግበር
  english_pob_choice: for you to carry out
  chosen_korean: 당신이 그것을 집행하게 하려는 것이었습니다
  alternatives_korean:
  - 당신이 그것을 실행하게 하려는 것이었습니다
  - 당신이 그것을 행하게 하려는 것이었습니다
  lexicon: Geez 동사 ትግበር
  rationale: 개정판에서 지적된 능동성을 반영해 모세의 주체적 수행을 살리면서, 재앙을 '집행'하는 공식적 표현으로 마무리했습니다.
theological_decisions:
- issue: 모세의 행위성 vs 재앙의 수동적 발생
  chosen_reading: 재앙이 '내려왔다'고 하면서도, 마지막 목적절은 '당신이 그것을 집행하게'로 옮겨 모세의 실제 수행을 분명히 했습니다.
  alternative_readings:
  - 재앙이 '내려와서' 저절로 이루어졌다는 식의 수동적 표현
  - '''당신이 그것을 행하게 하려는 것이었습니다''처럼 더 일반적인 표현'
  rationale: Ge'ez 동사의 능동형과 영어 개정 주석의 취지를 함께 반영해, 하나님이 정하신 재앙이지만 모세가 그것을 집행하는 서술이라는 긴장을 보존했습니다.
  doctrine_reference: 출애굽기의 재앙 서술에서 하나님의 주권과 대리자 모세의 순종을 함께 드러내는 본문 이해
