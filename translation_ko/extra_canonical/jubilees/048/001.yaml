  - 떠나 미디안 땅에서 다섯 주의 해와 한 해를 지냈으며
  lexicon: 여행/체류 동사
  rationale: 지속 기간을 그대로 보존해야 하므로 기간구를 명시했고, 5주+1년이라는 희년식 계산을 ‘다섯 주의 해와 한 해’로 직역에 가깝게 유지했습니다.
- source_word: ወገባእከ፡ ውስተ፡ ግብጽ፡
