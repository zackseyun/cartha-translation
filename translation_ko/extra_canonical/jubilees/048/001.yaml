  naturalness: ‘다섯 주의 해와 한 해’는 현대 표준어에서 비문에 가깝습니다. ‘다섯 이레와 한 해’로 옮기고, 여기서 이레가 7년 단위임을 주석으로 설명하면 문장을 과도하게 해설하지 않으면서도 읽기 쉽습니다. 또한 내용이 없는 [a][b] 표지는 제거해야 합니다.
