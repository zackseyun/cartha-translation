  - 이집트로 갔습니다
  lexicon: 동사 선택
  rationale: 검토된 영어 POB와 게에즈 동사 ገብአ의 의미를 따라 ‘들어가다’보다 ‘돌아가다’가 문맥에 더 정확합니다.
