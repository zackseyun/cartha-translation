base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/048/003.yaml
  text: On the way[3], at the lodging-place, he met you. Did he not desire with all his power to kill you and to save the Egyptians from your hand, when he saw that you had been sent to do this and to execute judgment upon Egypt?
  footnotes:
  - marker: '3'
    text: The verb at the lodging-place may carry the sense of hostile encounter or accusation; compare the Exodus episode where a deadly confrontation occurs on the journey.
    reason: lexical_alternative
  - marker: a
    text: Or 'he came against you to accuse you. And he desired'.
    reason: previous_rendering
  - marker: b
    text: Or 'execute judgment upon Egypt.'.
    reason: previous_rendering
translation:
  language: ko
  text: 여행길의 숙소에서[3] 그가 너를 만났습니다. 그가 네가 이 일을 하도록, 또 이집트에 심판을 집행하도록 보내진 것을 보았을 때, 모든 힘을 다해 너를 죽이고 네 손에서 이집트 사람들을 구하려 하지 않았습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: '3'
    text: ‘숙소에서 만났다’로 옮긴 동사는 문맥상 적대적으로 맞닥뜨리는 뉘앙스를 지닐 수 있습니다. 여행 중 치명적인 대결이 일어나는 출애굽기 사건과 비교하십시오.
    reason: lexical_alternative
lexical_decisions:
- source_word: በፍኖተ፡ ... በምጽላል፡፡
  english_pob_choice: On the way[3], at the lodging-place
  chosen_korean: 길 위의 숙소에서
  alternatives_korean:
  - 여정 중 머묾 자리에서
  - 길에서 묵는 곳에서
  lexicon: source lexical phrase
  rationale: 장소를 평이하게 살리되, 영어 POB가 주석으로 처리한 ‘lodging-place’의 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ትትቄበሎ
  english_pob_choice: he met you
  chosen_korean: 그가 너를 만났습니다
  alternatives_korean:
  - 그가 너를 대면했습니다
  - 그가 너를 맞닥뜨렸습니다
  lexicon: source verbal root
  rationale: 주어진 개정처럼 이 동사는 ‘비난하다’가 아니라 ‘만나다/대면하다’의 뜻이므로, 본문 의미를 해치지 않는 직접적 표현을 택했습니다.
- source_word: አኮሁ
  english_pob_choice: Did he not desire
  chosen_korean: 그가 모든 힘을 다해 너를 죽이고, 네 손에서 이집트 사람들을 구하려 하지 않았습니까?
  alternatives_korean:
  - 그가 정말 너를 죽이고 이집트 사람들을 구하려 하지 않았습니까?
  - 그가 온 힘을 다해 너를 죽이려 하고 이집트 사람들을 구하려 하지 않았습니까?
  lexicon: interrogative particle and clause structure
  rationale: 게에즈의 질문 구조를 한국어 수사 의문문으로 살려, 단정문이 아니라 물음으로 끝나게 했습니다.
- source_word: ይቅትልከ፡ ወያድኅኖሙ
  english_pob_choice: to kill you and to save the Egyptians from your hand
  chosen_korean: 너를 죽이고, 네 손에서 이집트 사람들을 구하려
  alternatives_korean:
  - 너를 죽이고 이집트 사람들을 네 손에서 구하려
  - 너를 죽이며 네 손에서 이집트 사람들을 구원하려
  lexicon: paired infinitives
  rationale: 두 동사의 병렬을 그대로 살려, 죽이려는 의도와 구하려는 의도를 함께 드러냈습니다.
- source_word: ዘንተ፡ ... ትግበር
  english_pob_choice: that you had been sent to do this
  chosen_korean: 네가 이 일을 하도록 보내진 것을
  alternatives_korean:
  - 네가 이것을 행하도록 보내졌음을
  - 네가 이 일을 수행하도록 파송된 것을
  lexicon: purpose clause
  rationale: ‘보내지다’의 수동성과 목적절의 의미를 유지하면서, 문맥상 ‘이 일’을 지시하게 했습니다.
- source_word: ወበቀለ፡ ላዕለ
  english_pob_choice: to execute judgment upon Egypt
  chosen_korean: 이집트에 심판을 집행하도록
  alternatives_korean:
  - 이집트에 심판을 내리도록
  - 이집트에 판결을 실행하도록
  lexicon: judicial action
  rationale: 영어 POB의 ‘execute judgment’를 따라, 단순한 벌주기보다 공적·사법적 집행의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 출애굽기 4:24의 적대적 만남을 어떻게 드러낼지
  chosen_reading: ‘그가 너를 만났습니다’로 두되, 뒤의 살해 의도와 심판 문맥이 그 만남의 적대성을 드러내게 했습니다.
  alternative_readings:
  - ‘그가 너에게 맞서 만났습니다’
  - ‘그가 너를 대적하여 만났습니다’
  rationale: 게에즈 동사 자체는 ‘만나다/대면하다’의 기본 뜻을 가지므로, 본문이 직접 말하지 않는 ‘고발하다’ 같은 의미를 추가하지 않고 문맥 전체로 긴장을 보여 주는 편이 소스에 충실합니다.
  doctrine_reference: 본문 의미 보존과 문맥적 해석의 균형
- issue: ‘심판’을 번역할 때 형벌 중심으로 좁히지 않기
  chosen_reading: ‘이집트에 심판을 집행하도록’으로 옮겨, 하나님의 공적 판단 행위라는 성격을 유지했습니다.
  alternative_readings:
  - ‘이집트를 벌하도록’
  - ‘이집트에 판결을 내리도록’
  rationale: 이 구절은 단순한 보복보다 하나님의 판결 집행을 말하므로, 법정적·신학적 무게를 가진 표현이 더 적절합니다.
  doctrine_reference: 하나님의 न्याय/심판 개념
