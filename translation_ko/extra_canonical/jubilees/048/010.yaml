translation:
  language: ko
  text: 그가 이끌어 낸 모든 백성이 그들을 쫓아갔으니 곧 이스라엘과 우리 하나님 주님께서 그들을 바다 가운데 깊은 데 던지셨으니 이스라엘 자손의 발 아래, 애굽 사람이 그 아들들을 강에 던진 것 같이 하였더라. 네 백성의 젖먹이 하나를 강에 빠뜨림으로 말미암아 용사가 일만만 명이 죽임을 당하였느니라.
