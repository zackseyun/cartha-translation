revisions:
- from: 그가 이끌어 낸 모든 백성이 그들을 쫓아갔으니 곧 이스라엘과 우리 하나님 주님께서 그들을 바다 가운데 깊은 데 던지셨으니 이스라엘 자손의 발 아래, 애굽 사람이 그 아들들을 강에 던진 것 같이 하였더라. 네 백성의 젖먹이 하나를 강에 빠뜨림으로 말미암아 용사가 일만만 명이 죽임을 당하였느니라.
  to: 그가 이끌어 낸 모든 백성이 이스라엘을 뒤쫓았습니다. 주 우리 하나님께서는 그들을 바다 한가운데, 그 깊은 곳으로, 이스라엘 자손들 아래로 던지셨습니다. 이는 애굽 사람들이 자기 아들들을 강에 던진 것과 같았습니다. 그들이 강에 던진 네 백성의 젖먹이 하나 때문에 백만 명과 만 명의 용사들이 멸망하였습니다.
  rationale: The revision separates the source's successive actions, corrects the numerical total, and restores the Egyptians' act of throwing the infant into the river. It maintains the source's 'your people' address and does not resolve beyond the text any broader historical or theological question.
  reviewer_model: gpt-5.6-terra
