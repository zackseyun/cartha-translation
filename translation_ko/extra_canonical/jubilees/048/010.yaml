translation:
  language: ko
  text: 그가 이끌어 낸 모든 백성이 이스라엘을 뒤쫓았습니다. 주 우리 하나님께서는 그들을 바다 한가운데, 그 깊은 곳으로, 이스라엘 자손들 아래로 던지셨습니다. 이는 애굽 사람들이 자기 아들들을 강에 던진 것과 같았습니다. 그들이 강에 던진 네 백성의 젖먹이 하나 때문에 백만 명과 만 명의 용사들이 멸망하였습니다.
