  text: Through him he took vengeance for Israel. And the LORD did everything for Israel, and according to his ordinance, which he established with Abraham, so that he might take vengeance on them just as they had enslaved them by force.
  footnotes:
  - marker: a
    text: Or 'so that he might execute vengeance for Israel.'.
    reason: previous_rendering
  - marker: b
    text: Or 'because they had oppressed them violently'.
    reason: previous_rendering
translation:
  language: ko
  text: 그를 통하여 이스라엘을 위하여 원수를 갚으셨습니다. 주님께서 이스라엘을 위하여 행하신 모든 일은 아브라함과 세우신 그 규례에 따른 것이었으니, 그들이 이스라엘을 강제로 노예로 삼은 것처럼 그들에게 보복하시기 위해서였습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리 번역하면, ‘이스라엘을 위하여 보복하셨습니다.’
    reason: 첫 문장의 በቀለ를 ‘원수를 갚다’ 대신 ‘보복하다’로 옮길 수 있음을 밝힙니다.
  - marker: b
    text: 달리 번역하면, ‘그들이 그들을 폭력적으로 억압했기 때문에.’
    reason: 기존 번역 전통의 ‘억압’ 및 인과적 해석을 기록하되, 본문에 더 잘 맞는 ‘…한 것처럼’과 ‘노예로 삼다’는 본문에 유지합니다.
lexical_decisions:
- source_word: ቦቱ፡ በቀለ፡ ለእስራኤል
  english_pob_choice: Through him he took vengeance for Israel.
  chosen_korean: 그를 통해서 그는 이스라엘을 위해 보복하셨습니다.
  alternatives_korean:
  - 그를 통해서 그는 이스라엘을 위해 원수를 갚으셨습니다.
  - 그를 통해서 그는 이스라엘을 위해 심판하셨습니다.
  lexicon: 보복하다
  rationale: 게어즈의 도구적 표현은 목적이 아니라 수단을 나타내므로 ‘그를 통해서’로 옮겼고, በቀለ의 응보 의미는 ‘보복하다’로 가장 직접적으로 반영했습니다.
- source_word: ወኵሎ፡ ገብረ፡ እግዚአብሔር፡ በእንተ፡ እስራኤል
  english_pob_choice: And the LORD did everything for Israel
  chosen_korean: 그리고 주님께서는 이스라엘을 위해 모든 일을 하셨고
  alternatives_korean:
  - 그리고 주님께서는 이스라엘을 위해 모든 것을 하셨고
  - 그리고 야훼께서는 이스라엘을 위해 모든 일을 하셨고
  lexicon: 주님 / 모든 일을 하다
  rationale: 본문의 እግዚአብሔር은 야훼를 가리키지만, 본절은 직접 인용된 찬양문이 아니라 서술문이므로 POB의 일반 관례에 따라 ‘주님’으로 옮겼습니다. ‘ወኵሎ ገብረ’는 포괄적 행위 완료를 나타내어 자연스럽게 ‘모든 일을 하셨고’로 처리했습니다.
- source_word: ሥርዐቱ፡
  english_pob_choice: his ordinance
  chosen_korean: 그 규례에
  alternatives_korean:
  - 그 명령에
  - 그 언약에
  lexicon: 규례
  rationale: 갈등 지점인 ሥርዐቱ는 여기서 ‘언약’보다 ‘규례/정해진 질서’에 가깝기 때문에, 본문의 문맥을 살려 ‘그 규례’로 옮겼습니다.
- source_word: ቀነይዎሙ፡ በግፍዕ
  english_pob_choice: they had enslaved them by force
  chosen_korean: 그들이 그들을 폭력으로 노예 삼은
  alternatives_korean:
  - 그들이 그들을 폭력으로 억압한
  - 그들이 그들을 힘으로 종으로 삼은
  lexicon: 노예 삼다
  rationale: Գեע즈의 ቀነይዎሙ는 단순 억압보다 지배·예속의 의미가 강하므로, POB의 영어 ‘enslaved’에 맞춰 ‘노예 삼다’로 옮겨 예속성을 분명히 했습니다.
theological_decisions:
- issue: 응보의 목적/수단 관계
  chosen_reading: 첫 절반은 ‘그를 통해서’라는 수단 표현으로, 뒤의 ‘그들이 … 한 것처럼 그들 위에 보복하시도록’은 결과·목적을 드러내는 구문으로 구분했습니다.
  alternative_readings:
  - 전체를 목적절로 읽는 번역
  - 전체를 단순 서술로만 처리하는 번역
  rationale: 게어즈 본문은 두 개의 በቀለ/ይትበቀል 계열 표현을 구별하므로, 앞부분의 실제 행위와 뒷부분의 대칭적 응보 의도를 한국어에서도 분리해 주어야 문맥이 살아납니다.
  doctrine_reference: 응보/보응의 성경적 수사
- issue: ‘주님’ 표기와 신명 의미
  chosen_reading: 본문의 እግዚአብሔር은 야훼 지시어지만, 이 단락에서는 전통적 신명 주석을 본문에 직접 삽입하지 않고 ‘주님’으로 두었습니다.
  alternative_readings:
  - 야훼
  - 여호와
  rationale: 이 절은 고유명 신명 표기보다 서술의 흐름이 중요하고, 제공된 POB 영어 본문도 LORD로 유지하므로 한국어 본문은 ‘주님’으로 일치시켰습니다. 다만 후속 편집에서 필요하면 주석으로 신명 대응을 밝힐 수 있습니다.
  doctrine_reference: 신명 표기 관례
