translation:
  language: ko
  text: 그리고 우리가 사랑과 평강 가운데, 사람은 자기 형제와 함께 머물며, 우리의 길을 부패시키지 않아야 한다고 하였습니다." 그러나 그들이 그에게 말하였습니다. "우리는 그와 화평을 이루기 위해 너의 말을 듣지 않겠소. 우리의 힘이 그의 힘보다 더 강하고, 우리는 그보다 더 강하오. 그를 치러 올라가 그를 죽이고 그의 아들들을 멸망시키시오. 그러나 당신이 올라가지 않으려 한다면[a]
  philosophy: optimal-equivalence
