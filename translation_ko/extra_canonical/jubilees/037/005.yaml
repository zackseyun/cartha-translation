translation:
  language: ko
  text: “그리고 우리가 사랑과 평화 가운데, 각 사람이 자기 형제와 더불어 지내며, 우리의 길들을 망치지 않아야 한다[a].” 그러나 그들이 그에게 말했습니다. “우리는 그와 화평을 이루라는 당신의 말을 듣지 않겠습니다. 우리의 힘이 그의 힘보다 더 강하고, 우리도 그보다 강합니다. 그에게 맞서 올라가십시오. 그를 죽이고 그의 아들들을 멸하십시오. 그러나 당신이 가지 않으려 한다면
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리의 길을 어지럽히지 않아야 한다.”
    reason: ፍኖዊነ는 문자적으로 ‘우리의 길들’이며, 문맥상 ‘행로/처신’을 가리킬 수 있습니다. 본문은 훼손·파괴의 의미를 반영해 ‘망치지’로 옮겼습니다.
