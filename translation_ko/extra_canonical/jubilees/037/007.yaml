translation:
  language: ko
  text: 그들의 아버지가 그들에게 말했습니다. “가지 말고, 그와 전쟁하지 마십시오. 그러다가 넘어질까 봐입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֹאמֶר לָהֶם אָבִיהֶם / And their father said to them
  english_pob_choice: And their father said to them
  chosen_korean: “그들의 아버지가 그들에게 말했습니다”
  alternatives_korean:
  - “그들의 아버지가 그들에게 말하였습니다”
  - “아버지가 그들에게 이르렀습니다”
  lexicon: source note
  rationale: 서술 동사는 현대 합쇼체의 자연스러운 직접화법 도입으로 옮기고, 원문의 단순 발화 행위를 그대로 살렸습니다.
- source_word: אִתְהֹורוּ / Do not go
  english_pob_choice: Do not go
  chosen_korean: “가지 말고”
  alternatives_korean:
  - “가지 마십시오”
  - “출발하지 마십시오”
  lexicon: source note
  rationale: 짧은 금지형을 간결하게 반영했습니다. 원문은 단순 이동 금지를 뜻하므로 과도한 구체화는 피했습니다.
- source_word: וְאִתְגְבְרוּ / and do not make war with him
  english_pob_choice: and do not make war with him
  chosen_korean: “그와 전쟁하지 마십시오”
  alternatives_korean:
  - “그와 싸우지 마십시오”
  - “그와 전쟁을 벌이지 마십시오”
  lexicon: source note
  rationale: 직역보다 한국어에서 자연스럽고도 ‘전쟁하다’의 대립적 의미를 유지하는 표현을 택했습니다.
- source_word: כְּמָא אִתְדְּקוּ / lest you fall
  english_pob_choice: lest you fall
  chosen_korean: “그러다가 넘어질까 봐입니다”
  alternatives_korean:
  - “그리하여 넘어질까 두렵습니다”
  - “넘어질까 염려됩니다”
  lexicon: source note
  rationale: 결과를 피하라는 목적/경계의 뉘앙스를 한국어의 ‘-까 봐’로 자연스럽게 살렸고, ‘넘어지다’로 원문의 낙하 이미지를 보존했습니다.
theological_decisions:
- issue: 경고문의 어조
  chosen_reading: 아버지가 아들들에게 전하는 직접적 금지와 경고로 옮겼습니다.
  alternative_readings:
  - 더 완곡한 권고문으로 옮김
  - 권위적 명령체로 단순화함
  rationale: 원문은 두 차례의 금지와 그 결과 경고를 분명히 제시하므로, 합쇼체를 유지하되 경고의 긴박함을 약화시키지 않았습니다.
  doctrine_reference: source fidelity
