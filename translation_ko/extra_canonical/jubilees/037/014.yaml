base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/014.yaml
  text: 'Throughout all this[14], Jacob did not know that they were coming against him to kill him. And he was mourning for Leah his wife until they came near to the tower with four thousand men, warriors and chosen fighters. And they sent to him honorable men, saying, "Behold, your brother has come against you to fight you, with four hundred men girded with the sword, and they carry shields and weapons of war." For they loved Jacob more than Esau, and they told him that Jacob was a gracious and merciful man, more than Esau. Then Jacob was alarmed when they came near to the tower, and he shut the gates of the tower and stood on the battlements and spoke with his brother Esau and said, "The comfort for which you have come is a fine comfort, to comfort me concerning my wife who has died. Is this the oath that you swore to your father and your mother? Again, before they have died, you have broken the oath, and at the moment you swore to your father you were condemned." And at that time Esau
    answered and said to him, "There is no righteous oath for the sons of men, nor for the beasts of the earth; for whatever they swear, they scheme one against another with evil[14], so that each may kill his enemy and foe. And you hate me and my children forever, and there is no observing brotherhood with you. Hear this word that I declare to you: if the boar can change its skin and its bristles become soft like wool, or if horns grow on its head like the horns of a stag or a sheep, then I will keep brotherhood with you. And if the breasts separated from their mother should return and suckle again, then I will be reconciled to you as a brother. And if wolves make peace with lambs so as not to devour or oppress them, and if their hearts are good toward them, then there will be peace in my heart toward you. And if the lion becomes the friend of the ox and is bound together with it under one yoke and plows with it and makes peace with it, then I will make peace with you. And when the raven
    becomes white like the raza-bird, then I will know that I have loved you and will make peace with you. Be destroyed, and may your sons be destroyed, and let there be no peace for you." And when Jacob saw that he was evil in his heart toward him, and with all his soul intended to kill him, and that he came raging like a wild boar rushing upon the spear that pierces and kills it and does not turn back from it, then he said to his own and to his servants that they should attack him and all his companions.'
  footnotes:
  - marker: '14'
    text: The comparison 'white like the raza-bird' reflects an uncertain bird name in the Ge'ez; some interpreters identify a notably white bird species, but the exact zoological reference is unclear.
    reason: lexical_alternative
  - marker: '14'
    text: The Ge'ez text reads 'four thousand' (፵፻) for the initial approach, but the messengers report 'four hundred' (፬፻). This discrepancy is preserved from the source manuscript.
    reason: textual_variant
  - marker: a
    text: Or 'until they came near to the tower with four hundred men'.
    reason: previous_rendering
  - marker: b
    text: Or 'You have broken the oath,'.
    reason: previous_rendering
translation:
  language: ko
  text: '이 모든 일이 일어나는 동안 야곱은 그들이 자기를 죽이려고 자기에게 오는 줄 알지 못했습니다. 그는 아내 레아를 애도하고 있었는데, 그들이 사천 명[a], 곧 용사들과 선발된 전사들을 거느리고 망대 가까이 이르렀습니다. 그들은 유력한 사람들을 야곱에게 보내어 이렇게 말하게 했습니다. 「보십시오, 당신의 형이 칼을 찬 사백 명과 함께 당신과 싸우러 왔습니다. 그들은 방패와 전쟁 무기를 들고 있습니다.」 그들은 야곱을 에서보다 더 사랑했기 때문에, 야곱이 에서보다 은혜롭고 자비로운 사람이라고 그에게 말했습니다.


    그들이 망대 가까이 이르자 야곱은 두려워하여 망대의 문들을 닫고 흉벽 위에 서서 그의 형 에서에게 말했습니다. 「당신이 가져온 위로는 참으로 훌륭한 위로로군요. 죽은 내 아내 때문에 나를 위로하려고 오신 것이니까요. 이것이 당신이 당신의 아버지와 어머니에게 맹세한 그 맹세입니까? 더구나 그들이 아직 죽기 전에 당신은 그 맹세를 깨뜨렸습니다. 당신이 당신의 아버지에게 맹세하던 바로 그때 당신은 정죄받았습니다.」


    그때 에서가 대답하여 그에게 말했습니다. 「사람의 자손에게나 땅의 짐승에게나 의로운 맹세란 없습니다. 그들이 무엇을 맹세하든, 서로를 해하려고 악한 꾀를 꾸며 저마다 자기 원수와 대적을 죽이려 하기 때문입니다. 당신은 나와 내 자녀들을 영원히 미워하며, 당신과는 형제의 의리를 지킬 수 없습니다. 내가 당신에게 말하는 이 말을 들으십시오. 멧돼지가 자기 가죽을 바꾸고 그 털이 양털처럼 부드러워지거나, 그 머리에 수사슴이나 양의 뿔 같은 뿔이 돋아난다면, 그때 나는 당신과 형제의 의리를 지키겠습니다. 또 어미에게서 떨어져 나온 젖가슴들이 다시 돌아와 젖을 먹인다면, 그때 나는 형제로서 당신과 화목하겠습니다. 또 늑대들이 어린양들과 평화롭게 지내어 그들을 잡아먹거나 억누르지 않고, 그들을 향한 그들의 마음이 선하다면, 그때 내 마음에는 당신을 향한 평화가 있을 것입니다. 또 사자가 소의 친구가 되어 한 멍에 아래 그것과 함께 매여 밭을 갈고 그것과 화목한다면, 그때 나는 당신과 화목하겠습니다. 까마귀가 라자새[b]처럼 희어지면, 그때 내가 당신을 사랑해 왔음을 알겠고 당신과 화목하겠습니다. 당신은 멸망하고 당신의 자녀들도 멸망할 것이며, 당신에게 평화가 없을 것입니다.」


    야곱은 그가 마음속으로 자기에게 악의를 품고 온 마음을 다해 자기를 죽이려 하며, 자기를 꿰뚫어 죽이고도 물러서지 않는 창을 향해 돌진하는 들멧돼지처럼 날뛰며 오는 것을 보았습니다. 그러자 그는 자기 사람들과 종들에게 그와 그의 모든 동료를 공격하라고 말했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 처음 망대에 접근한 인원을 ፵፻, 곧 사천 명으로 말하지만, 사자들은 이어서 에서가 사백 명(፬፻)과 함께 왔다고 보고합니다. 이 수치의 차이는 본문 그대로 보존했습니다.
    reason: textual_variant
  - marker: b
    text: ‘라자새’에 해당하는 게에즈어 새 이름의 정확한 동물학적 지칭은 확실하지 않습니다. 본문은 특히 흰 새와의 비교를 사용합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፵፻ / ፬፻
  english_pob_choice: four thousand men / four hundred men
  chosen_korean: 사천 명 / 사백 명
  alternatives_korean:
  - 사천 명 / 사천여 명
  - 사백 명
  lexicon: 수사 표현
  rationale: 게에즈 본문에는 처음 접근이 ፵፻(사천), 사자의 보고는 ፬፻(사백)로 구분되어 있어, 영어 POB의 주석처럼 이 수치 차이를 본문에서 그대로 살렸습니다.
- source_word: ዝንቱ ውእቱ መሐላ... ካዕበ ዘእንበለ ይመቱ
  english_pob_choice: Again, before they have died, you have broken the oath
  chosen_korean: 아니, 그들이 아직 죽기 전에 당신은 그 맹세를 깨뜨렸습니다
  alternatives_korean:
  - 당신은 그 맹세를 깨뜨렸습니다
  - 그들이 죽기도 전에 당신은 그 맹세를 깨뜨렸습니다
  lexicon: 동사구/부사구
  rationale: 야곱의 항변은 단순한 ‘맹세를 깨뜨림’보다 ‘아직 죽기 전에’라는 시간 부사가 핵심이므로, 영어 POB의 복원된 뉘앙스를 반영해 명시적으로 옮겼습니다.
- source_word: ጸጋዊ ወመሓሪ
  english_pob_choice: gracious and merciful
  chosen_korean: 은혜롭고 자비로운
  alternatives_korean:
  - 호의롭고 자비로운
  - 은총이 많고 자비로운
  lexicon: 형용사 쌍
  rationale: 인물 평가를 가리키는 두 형용사는 한국어 성경 문체에서 자연스러운 ‘은혜롭고 자비로운’으로 옮겨, 도덕적·관계적 긍정성을 유지했습니다.
- source_word: ሐቅል / ሰይፍ / ወልታ
  english_pob_choice: weapons of war / girded with the sword / shields
  chosen_korean: 전쟁 무기 / 칼을 찬 / 방패
  alternatives_korean:
