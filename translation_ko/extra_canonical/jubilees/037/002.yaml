  text: Isaac had given the rights of the firstborn to Jacob his younger son, and they were exceedingly angry. And they contended with their father, saying, "Why, did he give the rights of the firstborn to Jacob, who is younger, while you are the elder, and leave you aside?"
  footnotes:
  - marker: a
    text: Or 'while we were present, did you give the rights of the firstborn to Jacob, though he is younger, and leave us aside?'.
    reason: previous_rendering
translation:
  language: ko
  text: 이삭이 자기의 어린 아들 야곱에게 장자의 권리를 주었고, 그들은 몹시 화가 났습니다. 그들은 아버지와 논쟁하며 말했습니다. 「왜 그가 장자의 권리를, 당신이 장자인데도, 어린 야곱에게 주고 당신을 제쳐 두었습니까?」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሀቦ፡ ... ለያዕቆብ፡
  english_pob_choice: had given the rights of the firstborn to Jacob his younger son
  chosen_korean: 자기의 어린 아들 야곱에게 장자의 권리를 주었고
  alternatives_korean:
  - 맏아들의 권리를
  - 장자의 몫을
  lexicon: 권리/장자
  rationale: Ge'ez의 'rights of the firstborn'에 해당하는 표현을 자연스럽게 옮기되, 본문의 법적·가족적 의미를 살리기 위해 '장자의 권리'를 택했습니다.
- source_word: ዘይንእስ፡
  english_pob_choice: younger
  chosen_korean: 어린
  alternatives_korean:
  - 더 어린
  - 나이 어린
  lexicon: 연소
  rationale: 야곱이 형보다 어린 아들임을 나타내는 말로, 문맥상 관계를 분명히 하는 '어린'이 가장 간결합니다.
- source_word: ወተጋአዙ፡ ... ይብሉ፡
  english_pob_choice: they were exceedingly angry. And they contended with their father, saying
  chosen_korean: 그들은 몹시 화가 났습니다. 그들은 아버지와 논쟁하며 말했습니다
  alternatives_korean:
  - 몹시 분노했습니다
  - 아버지와 다투었습니다
  lexicon: 분노/논쟁
  rationale: 두 동사의 강도를 구분해 앞부분은 감정 상태('몹시 화가 났습니다'), 뒤는 그 결과로 벌어진 언쟁('논쟁하며')로 옮겼습니다.
- source_word: እንዘ፡ ሀሎከ፡ አንተ፡ ዘትልህቅ፡
  english_pob_choice: while you are the elder
  chosen_korean: 당신이 장자인데도
  alternatives_korean:
  - 당신이 연장자인데도
  - 당신이 먼저 태어났는데도
  lexicon: elder/firstborn
  rationale: 대조점은 단순한 연령이 아니라 출생 서열이므로, 직역보다 본문 의도를 분명히 하는 '장자'를 사용했습니다.
