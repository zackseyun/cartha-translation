revisions:
- from: 이삭이 자기의 어린 아들 야곱에게 장자의 권리를 주었고, 그들은 몹시 화가 났습니다. 그들은 아버지와 논쟁하며 말했습니다. 「왜 그가 장자의 권리를, 당신이 장자인데도, 어린 야곱에게 주고 당신을 제쳐 두었습니까?」[a]
  to: 이삭이 자신의 더 어린 아들 야곱에게 장자의 권리를 주었고, 그들은 몹시 화가 났습니다. 그들은 아버지와 다투며 말했습니다. 「왜 이삭은 당신이 장자인데도 나이 어린 야곱에게 장자의 권리를 주고 당신을 제쳐 두었습니까?」
  rationale: The revision makes the comparative force of 'younger' explicit, identifies Isaac unambiguously within the direct question, uses natural formal Korean for the dispute, and removes the unsupported anchor. It retains the source's distinction between Jacob as younger and the addressed father as the elder/firstborn, without adding interpretive claims.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'The main sense follows the Ge''ez and the adjudicated English audit trail: Isaac gave Jacob the birthright, and the speakers protest that their father, the elder/firstborn, was passed over. However, ''어린 아들'' and ''어린 야곱'' can mean a young child rather than specifically the younger son/brother; the comparative relationship should be stated. Naming Isaac in the direct question also prevents the Korean pronoun ''그가'' from being awkwardly or momentarily ambiguously linked to the immediately preceding ''아버지.'''
  naturalness: The passage is generally clear and maintains modern formal-polite 합쇼체. '아버지와 논쟁하며' is understandable but slightly bookish in this family dispute; '아버지와 다투며' is more idiomatic while retaining the sense of contention.
  terminology: '''장자의 권리'' accurately conveys the birthright. ''더 어린 아들'' and ''나이 어린 야곱'' preserve the source''s comparative ''younger'' without implying that Jacob was merely a child. ''장자'' correctly renders the contrast with the elder/firstborn.'
  issues:
  - severity: medium
    issue: The Korean renders 'younger' as '어린' in both narrative and quotation.
    rationale: Without a comparative marker, this may denote youth/childhood rather than Jacob's status as the younger son relative to Esau. The source and audit trail make that relationship central.
  - severity: low
    issue: The quoted subject '그가' is needlessly ambiguous in Korean after '그들은 아버지와 ... 말했습니다.'
    rationale: Although the antecedent is Isaac from the preceding sentence, explicitly naming 이삭 makes the historical referent and the contrast between Isaac and the addressed father immediately clear.
  - severity: low
    issue: The anchor [a] has no corresponding Korean footnote and the English footnote records a superseded alternative.
    rationale: The current adjudicated source reading is represented directly in the revised text, so retaining an unsupported anchor would be structurally misleading.
  revised_text: 이삭이 자신의 더 어린 아들 야곱에게 장자의 권리를 주었고, 그들은 몹시 화가 났습니다. 그들은 아버지와 다투며 말했습니다. 「왜 이삭은 당신이 장자인데도 나이 어린 야곱에게 장자의 권리를 주고 당신을 제쳐 두었습니까?」
  revised_footnotes: []
