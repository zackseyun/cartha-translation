theological_decisions:
- issue: 미완성된 문장의 처리
  chosen_reading: 문장을 완결된 번역으로 닫지 않고, 말이 이어질 것을 암시하는 생략부호로 남겼습니다.
  alternative_readings:
  - 완결형으로 의역해 끊어 번역함
  - 다음 절과 합쳐 자연스럽게 보완함
  rationale: 소스의 마지막 ወአንተ가 의도적으로 이어짐을 보여 주므로, 본절 자체의 불완전성을 보존하는 편이 본문 증거에 더 충실합니다.
  doctrine_reference: 본문 비평/번역 충실성
- issue: 직접화법의 존대 처리
  chosen_reading: 직접 인용문은 비난적 진술의 전달이므로 합쇼체를 유지하되, 화자 내부의 감정적 어조는 과장하지 않았습니다.
  alternative_readings:
  - 구어체로 낮춤
  - 더 강한 비난 어조로 조정함
  rationale: 청중에게 전달되는 서술 문체와 인용문의 내용은 구분해야 하므로, 표준적인 서술 존대를 유지하는 것이 적절합니다.
  doctrine_reference: 화법·문체 일관성
