    rationale: ‘당신은 버려 두었습니다’는 에서가 누군가를 버렸다는 뜻이 됩니다. 원문과 영어 감사본은 아버지가 에서를 버렸다고 말하므로 ‘당신을 버려두었습니다’로 고쳐야 합니다.
  - severity: medium
