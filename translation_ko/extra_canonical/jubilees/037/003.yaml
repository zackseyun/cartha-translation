  source_fidelity: 첫 인용문의 마지막 절은 ‘당신은 버려 두었습니다’가 아니라 아버지가 에서를 버렸다는 뜻이므로 목적격을 분명히 해야 합니다. 또한 원문의 ‘사냥하여 … 사냥감을 가져오다’, ‘음식과 마실 것’, ‘서로에게 악을 꾀하지 않다’의 의미를 보존했습니다. ‘그의 손 아래’는 원문의 대명사 지시 범위를 단정하지 않도록 유지했습니다.
  naturalness: 합쇼체 문장으로 다듬고, ‘잡은 고기’보다 원문과 한국어 용례에 맞는 ‘사냥감’을 사용했습니다. 마지막 맹세 절의 어순도 자연스럽게 정리했습니다.
  terminology: ‘장자의 권리’는 birthright에 적합하며, ‘렌틸콩 스튜 한 그릇’, ‘꾀를 써서’, ‘그의 손 아래’도 본문 의미와 문체에 부합합니다. 원문 주석을 제공하지 않는 영어 감사 이력용 각주 [a]는 한국어 본문에 남길 근거가 없습니다.
