revisions:
- from: “야곱은 더 어립니다. 당신의 아버지는 야곱에게 장자의 권리를 주었고, 당신은 버려 두었습니다.” 에서가 그들에게 말했습니다. “내가 장자의 권리를 야곱에게 렌틸콩 스튜 한 그릇에 팔았습니다. 아버지가 나를 사냥하러 보내어 잡은 고기를 가져오게 하신 날에, 아버지가 잡수시고 나를 축복하시게 하려고 야곱이 꾀를 써서 내 아버지에게 음식과 마실 것을 가져왔고, 내 아버지는 그를 축복하시고 나를 그의 손 아래에 두셨습니다. 그리고 이제 우리 아버지는 우리 둘, 곧 나와 그를 두고 맹세하게 하여, 우리가 서로에게 악을 도모하지 않게 하셨습니다.”[a]
  to: “야곱은 더 어립니다. 당신의 아버지는 야곱에게 장자의 권리를 주었고, 당신을 버려두었습니다.” 에서가 그들에게 말했습니다. “내가 장자의 권리를 야곱에게 렌틸콩 스튜 한 그릇에 팔았습니다. 아버지께서 나를 사냥하여 사냥감을 가져오게 하신 날, 아버지께서 잡수시고 나를 축복하시도록 야곱이 꾀를 써서 내 아버지께 음식과 마실 것을 가져왔습니다. 내 아버지께서는 그를 축복하시고 나를 그의 손 아래에 두셨습니다. 이제 우리 아버지께서는 나와 그에게 맹세하게 하셔서, 우리가 서로에게 악을 꾀하지 않도록 하셨습니다.”
  rationale: 핵심적인 문법 오류인 ‘당신은’(주격)을 ‘당신을’(목적격)로 바로잡아 첫 문장의 행위자를 원문대로 아버지로 회복했습니다. 나머지는 원문의 의미와 영어 POB 감사본의 명시 사항을 유지하면서 현대 표준 한국어 합쇼체로 자연스럽게 다듬었습니다. 대명사 ‘그의 손’은 원문이 제공하는 지시상의 여지를 보존하기 위해 해설적으로 특정하지 않았습니다.
