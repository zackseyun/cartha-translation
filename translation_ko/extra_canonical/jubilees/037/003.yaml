base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/037/003.yaml
  text: '"Jacob is younger; to Jacob your father gave the birthright, and you he abandoned." And Esau said to them, "For I sold my birthright to Jacob for a little dish of lentil stew. And on the day my father sent me to hunt and bring him game, so that he might eat and bless me, Jacob came by craftiness and brought my father food and drink, and my father blessed him and set me under his hand. And now our father has made us swear, me and him, that we will not seek evil, each against his brother."'
  footnotes:
  - marker: a
    text: Or 'And Esau said to them, "I sold'.
    reason: previous_rendering
translation:
  language: ko
  text: “야곱은 더 어립니다. 당신의 아버지는 야곱에게 장자의 권리를 주었고, 당신을 버려두었습니다.” 에서가 그들에게 말했습니다. “내가 장자의 권리를 야곱에게 렌틸콩 스튜 한 그릇에 팔았습니다. 아버지께서 나를 사냥하여 사냥감을 가져오게 하신 날, 아버지께서 잡수시고 나를 축복하시도록 야곱이 꾀를 써서 내 아버지께 음식과 마실 것을 가져왔습니다. 내 아버지께서는 그를 축복하시고 나를 그의 손 아래에 두셨습니다. 이제 우리 아버지께서는 나와 그에게 맹세하게 하셔서, 우리가 서로에게 악을 꾀하지 않도록 하셨습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይንእስ
  english_pob_choice: Jacob is younger
  chosen_korean: 야곱은 더 어립니다
  alternatives_korean:
  - 야곱은 더 젊습니다
  - 야곱은 나이가 더 적습니다
  lexicon: Geez ይንእስ
  rationale: 형제 간 우열을 말하는 비교 표현이므로 단순 연령 비교를 분명하게 살려 자연스럽게 옮겼습니다.
- source_word: ልህቃነ
  english_pob_choice: birthright
  chosen_korean: 장자의 권리
  alternatives_korean:
  - 맏아들의 권리
  - 맏이의 상속권
  lexicon: Geez ልህቃነ
  rationale: 문맥상 에서가 야곱에게 판 것은 ‘장자권’이므로, 한국어에서도 관용적으로 이해되는 표현을 택했습니다.
- source_word: በኅዳጥ ጸብሐ ብርስን
  english_pob_choice: a little dish of lentil stew
  chosen_korean: 렌틸콩 스튜 한 그릇
  alternatives_korean:
  - 렌틸콩 죽 한 그릇
  - 렌틸콩 국 한 그릇
  lexicon: Geez 식사 표현
  rationale: 콩 종류와 소량의 음식이라는 점을 살리되, 한국어 독자가 이해하기 쉬운 음식명으로 옮겼습니다.
- source_word: በተጠብቦት
  english_pob_choice: by craftiness
  chosen_korean: 꾀를 써서
  alternatives_korean:
  - 속임수로
  - 간계로
  lexicon: Geez ተጠብቦት
  rationale: 야곱의 행위를 평가하는 어조를 지나치게 완화하지 않으면서도, 본문이 요구하는 수단성을 자연스럽게 표현했습니다.
- source_word: ታሕተ፡ እዴሁ
  english_pob_choice: under his hand
  chosen_korean: 그의 손 아래에
  alternatives_korean:
  - 그의 지배 아래에
  - 그의 권세 아래에
  lexicon: Geez 관용구
  rationale: 원문 이미지인 ‘손 아래’를 보존하여 복종과 종속의 뉘앙스를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 장의권 양도와 야곱의 책략에 대한 서술 톤
  chosen_reading: 본문의 법적·관계적 결과를 분명히 하되, 야곱의 행동을 ‘꾀’로 직접 표현하여 도덕적 긴장을 유지했습니다.
  alternative_readings:
  - 완화하여 ‘지혜롭게’로 처리
  - 비난 강도를 높여 ‘속임수로’로만 처리
  rationale: 게젤 본문의 서술은 사건의 사실성과 도덕적 평가를 함께 지니므로, 어느 한쪽으로 과도하게 기울지 않도록 했습니다.
  doctrine_reference: 서술 신학/인물 평가
