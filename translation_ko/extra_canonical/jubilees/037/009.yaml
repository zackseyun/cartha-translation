  text: 그리고 그의 멍에 아래에 당신의 목을 굽히십시오. 우리는 이 말을 듣지 않겠습니다.” 그리고 그들은 아람에게, 또 아버지의 친구인 아두람에게 사람을 보내어, 그들과 함께 전투를 위한 용사 천 명을 고용했습니다.[a]
