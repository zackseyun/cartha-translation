translation:
  language: ko
  text: '유다가 자기 아버지 야곱에게 말했습니다.[15] “아버지, 활을 당기시고 화살을 쏘아 원수를 쓰러뜨리고 대적을 죽이십시오. 힘을 내십시오. 우리는 당신의 형제를 죽이지 않겠습니다. 그는 그러한 이이며 당신의 친족이므로, 우리가 그에게 존경을 보이겠습니다.” 그러자 야곱은 활을 당겨 화살을 쏘아 자기 형 에서의 오른쪽 가슴을 맞혀 죽였습니다. 그리고 다시 화살을 쏘아 아람 사람 아도란의 왼쪽 가슴을 맞혀 그를 물리치고 죽였습니다.


    그러자 야곱의 아들들과 그들의 종들이 망대의 사방에서 나왔습니다. 유다가 먼저 나왔고, 납달리와 갓과 종 오십 명이 그와 함께 망대 남쪽으로 나갔습니다. 그들은 자기들 앞에서 만나는 사람을 모두 죽였고, 한 사람도 피하지 못했습니다. 레위와 단과 아셀은 오십 명과 함께 망대 동쪽으로 나가서 모압과 암몬의 용사들을 죽였습니다. 르우벤과 잇사갈과 스불론은 오십 명과 함께 망대 북쪽으로 나가서 블레셋의 전사들을 죽였습니다. 시므온과 베냐민과 르우벤의 아들 에녹은 오십 명과 함께 망대 서쪽으로 나가서 에돔 사람들과 호리 사람들 가운데 강하고 용맹한 사백 명을 죽였습니다.


    육백 명이 도망했고, 에서의 아들 넷도 그들과 함께 도망했습니다. 그들은 아버지가 아두림에 있는 산에 쓰러져 죽임을 당한 채로 있는 것을 남겨 두었습니다. 야곱의 아들들은 그들을 세일 산까지 뒤쫓았습니다. 그러나 야곱은 아두림에 있는 산에 자기 형을 장사하고 자기 집으로 돌아왔으며, 그들은 거기서 그를 위로했습니다.'
  philosophy: optimal-equivalence
