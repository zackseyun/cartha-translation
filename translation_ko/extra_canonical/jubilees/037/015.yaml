translation:
  language: ko
  text: 유다가 그의 아버지 야곱에게 말하여 이르되 아버지여 활을 휘두르사 화살을 발사하여 대적을 쳐서 죽이소서 그리하시면 힘을 얻으소서 우리가 당신의 아우를 죽이지 아니하리니 그가 당신의 동족이므로 우리가 그에게 영광을 돌리리라 하였느니라 그러자 야곱은 활을 당겨 화살을 쏘아 그의 형 에서의 오른쪽 가슴을 쳐서 죽였습니다. 그리고 다시 화살을 보내어 아람 사람 아도란의 왼쪽 가슴을 쏘아 그를 뒤로 몰아쳐 죽였습니다. 그러자 야곱의 아들들과 그들의 종들이 망대 사방에서 나갔습니다. 유다가 먼저 나갔고 납달리와 갓이 그와 함께 하고 종 오십 ​​명이 그와 함께 망대 남쪽으로 나가서 그들 앞에서 만나는 자를 다 죽이고 한 사람도 피하지 못하였더라. 레위와 단과 아셀은 오십 명을 거느리고 망대 동쪽으로 나가서 모압과 암몬의 용사들을 죽였습니다. 르우벤과 잇사갈과 스불론은 오십 명을 거느리고 망대 북쪽으로 나가서 블레셋 군사들을 죽였습니다. 시므온과 베냐민과 르우벤의 아들 에녹이 오십 명을 거느리고 망대 서쪽으로 나가서 에돔과 호리 족속 중에서 강하고 용맹한 자 사백 명을 죽였더라. 육백 명이 도망하였고 에서의 아들 네 명이 그들과 함께 도망하였는데 그들의 아버지가 아두림 산에 쓰러져 죽임을 당한 채로 버려졌더라. 야곱의 아들들은 세일 산까지 그들을 뒤쫓았습니다. 그러나 야곱은 아두림 산에 자기 형을 장사하고 집으로 돌아가서 거기서 위로하였다.
