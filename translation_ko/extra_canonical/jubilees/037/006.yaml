  text: 'with us, we will harm you also. And now listen to us: let us send to Aram and to Philistia and to Moab and to Ammon, and let us choose for ourselves select men, eager for battle, and let us go against him and fight with him and uproot him from the land before he grows strong."'
translation:
  language: ko
  text: “우리와 함께하면, 우리도 너희를 해치겠습니다. 이제 우리의 말을 들으십시오. 아람과 블레셋과 모압과 암몬에 보내고, 우리를 위해 싸움에 능한 택한 사람들을 골라 그와 맞서 싸우고, 그가 강성해지기 전에 그를 그 땅에서 뿌리째 뽑아버립시다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ፡ ስምዐነ፡
  english_pob_choice: And now listen to us
  chosen_korean: 이제 우리의 말을 들으십시오
  alternatives_korean:
  - 이제 우리에게 귀를 기울이십시오
  - 이제 우리 말을 들으십시오
  lexicon: source-note
  rationale: 청유가 이어지는 문맥에서 단순 청취보다 ‘우리의 말을 받아들이라’는 호소를 살려 자연스러운 합쇼체로 옮겼습니다.
- source_word: ወንፈኑ፡ ውስተ፡ አራም፡ ወውስተ፡ ፊልስጥኤም፡ ወውስተ፡ ሞአብ፡ ወውስተ፡ አሞን፡
  english_pob_choice: let us send to Aram and to Philistia and to Moab and to Ammon
  chosen_korean: 아람과 블레셋과 모압과 암몬에 보내고
  alternatives_korean:
  - 아람과 블레셋과 모압과 암몬으로 보내고
  - 아람과 블레셋과 모압과 암몬에 사자를 보내고
  lexicon: source-note
  rationale: 목적지는 ‘to’의 방향성을 따라 ‘에’로 옮기되, 지명 자체는 통용되는 성서 표기인 아람·블레셋·모압·암몬을 유지했습니다.
- source_word: ኅሩያነ፡ ሰብአ፡ እለ፡ ይዳበጉ፡ ውስተ፡ ቀትል፡
  english_pob_choice: select men, eager for battle
  chosen_korean: 싸움에 능한 택한 사람들
  alternatives_korean:
  - 전투를 열망하는 택한 사람들
  - 싸움을 즐기는 택한 사람들
  lexicon: source-note
  rationale: ‘선택된 사람들’과 별도로 ‘전투에 능하고/익숙한’ 성격을 드러내기 위해 ‘싸움에 능한’으로 옮겼고, ኅሩያነ의 선택성은 ‘택한’으로 반영했습니다.
- source_word: ወንሠርዎ፡ እምድር፡
  english_pob_choice: uproot him from the land
  chosen_korean: 그를 그 땅에서 뿌리째 뽑아버립시다
  alternatives_korean:
  - 그를 그 땅에서 뽑아버립시다
  - 그를 그 땅에서 몰아내버립시다
  lexicon: source-note
  rationale: 영문 POB의 ‘uproot’는 단순 축출보다 더 강한 제거 이미지를 지니므로, 원문의 ሠረወ 계열 의미를 살려 식물 비유가 드러나는 표현으로 옮겼습니다.
