  - severity: medium
    issue: ‘그에게 맞서 나아가다’가 누락됨
    rationale: 원문은 그를 향해 나아가는 행위와 그와 싸우는 행위를 병렬로 제시합니다. 초안의 ‘그와 맞서 싸우고’는 이를 하나의 동작으로 합칩니다.
  - severity: low
