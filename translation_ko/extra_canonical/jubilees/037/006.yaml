  rationale: 첫 절반의 불완전해 보이는 조건·발화 관계는 제공된 원문과 영어 감사본 자체가 공유하는 형태이므로 추정으로 보완하지 않았습니다. 나머지는 ‘전투를 열망함’을 숙련으로 바꾸지 않도록 고치고, 나아감과 싸움의 연속을 복원했으며, 한국어의 생략된 ‘보내다’ 목적어를 최소한으로 보완했습니다. 대응 내용 없는 각주 표지도 제거했습니다.
