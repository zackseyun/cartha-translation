  to: 그러나 이제 우리 아버지께서는 나와 그, 곧 우리 둘이 서로에게 악을 꾀하지 않겠다고 맹세하게 하셨습니다.
  rationale: ‘우리’를 명시하고 이를 ‘나와 그, 곧 우리 둘’로 풀어 원문의 복수 목적어와 병렬 대명사를 보존했습니다. ‘서로에게’는 ‘각각 자기 형제에게’를 한국어답게 옮긴 것이며, 문장을 합쇼체의 완결된 서술문으로 다듬었습니다.
