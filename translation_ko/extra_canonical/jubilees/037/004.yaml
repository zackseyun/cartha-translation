  source_fidelity: 게에즈어의 1인칭 복수 목적어(‘우리에게’)와 뒤따르는 병렬 강조(‘나와 그’)를 반영해야 합니다. 현 초안은 ‘나와 그 사람으로 하여금’과 ‘우리에게’를 함께 써서 문장 구조와 지시 관계가 충돌합니다.
  naturalness: 현대 한국어에서는 ‘~으로 하여금 ~ 우리에게 맹세하게 하셨으니’가 부자연스럽고, 문장 종결도 본문의 독립 문장으로는 미완성입니다. ‘우리 둘이 … 맹세하게 하셨습니다’가 자연스럽습니다.
  terminology: ‘악을 꾀하다’는 여기서 ‘evil’을 도모하거나 행하려 한다는 뜻을 자연스럽게 전달하며, 특정 교리적 해석을 더하지 않습니다.
  issues:
  - severity: medium
    issue: 복수 목적어와 ‘나와 그’의 병렬 표현이 문법적으로 충돌함
    rationale: 원문과 영어 감사 기록은 아버지가 ‘우리’를, 곧 ‘나와 그’를 맹세하게 했다고 말합니다. 초안의 ‘나와 그 사람으로 하여금 … 우리에게’는 동일한 대상에 서로 다른 문법 역할을 부여합니다.
  - severity: low
    issue: ‘해를 끼치지 말라고’가 ‘악을 찾다/꾀하다’의 능동적 뉘앙스를 약화함
    rationale: 문맥상 형제에게 악을 도모하지 않겠다는 맹세이므로 ‘악을 꾀하지 않다’가 더 가깝습니다.
  revised_text: 그러나 이제 우리 아버지께서는 나와 그, 곧 우리 둘이 서로에게 악을 꾀하지 않겠다고 맹세하게 하셨습니다.
