  text: He went in front to lead them to Jacob his brother. Then he remembered all the evil that had been hidden in his heart against Jacob his brother, and he did not remember the oath that he had sworn to his father and to his mother, that he would not seek any evil against Jacob all his days.
  footnotes:
  - marker: a
    text: Or 'Then he remembered'.
    reason: previous_rendering
  - marker: b
    text: Or 'against Jacob his brother all his days'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 앞서 가며 그들을 그의 형 야곱에게로 인도하였습니다. 그러고 나서 그는 그의 마음에 야곱 그의 형을 향해 숨겨 두었던 모든 악을 기억하였고, 그의 아버지와 어머니에게 맹세한 맹세를 기억하지 않았습니다. 곧 야곱을 향해 자기의 모든 날 동안 어떤 악도 구하지 않겠다고 한 맹세였습니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይሖር፡ ቅድመ፡ ይምርሖሙ፡ ኀበ፡ ያዕቆብ፡ እኁሁ።
  english_pob_choice: He went in front to lead them to Jacob his brother.
  chosen_korean: 그는 앞서 가며 그들을 그의 형 야곱에게로 인도하였습니다.
  alternatives_korean:
  - 그는 그들 앞에 가서 그의 형 야곱에게로 그들을 이끌었습니다.
  - 그는 앞장서서 그들을 형 야곱에게로 데려갔습니다.
  lexicon: front/lead
  rationale: 게으즈 본문이 ‘앞서 가며’와 ‘인도하다’를 모두 포함하므로, 단순히 ‘기억하다’로 시작하는 식의 축약을 피하고 두 동작을 살렸습니다.
- source_word: ኵሎ፡ እኩየ፡ *እንተ፡ ሀለወት፡ ውስተ፡ ልቡ፡ ኅብእተ፡ ላዕለ፡ ያዕቆብ፡
  english_pob_choice: all the evil that had been hidden in his heart against Jacob his brother
  chosen_korean: 그의 마음에 야곱 그의 형을 향해 숨겨 두었던 모든 악
  alternatives_korean:
  - 그의 마음속에 야곱 그의 형에게 품고 있던 모든 악
  - 그 마음에 감추어 두었던 야곱을 향한 모든 악
  lexicon: evil / hidden in his heart
  rationale: ‘마음에 숨겨 두었던’이라는 내면적 보관 이미지를 유지하되, 명시된 대상이 야곱임을 분명히 했습니다.
- source_word: መሐላ፡ ዘመሐለ፡ ለአቡሁ፡ ወለእመ፡
  english_pob_choice: the oath that he had sworn to his father and to his mother
  chosen_korean: 그의 아버지와 어머니에게 맹세한 맹세
  alternatives_korean:
  - 그의 아버지와 어머니께 한 맹세
  - 그의 아버지와 어머니에게 서약한 서약
  lexicon: oath / swear
  rationale: 본문은 ‘맹세’와 그 행위 ‘맹세하다’의 반복 구조이므로, 한국어에서도 동일 어휘를 반복해 상응 구조를 드러냈습니다.
- source_word: ከመ፡ ኢይትኃሠሥ፡ ኵሎ፡ እኩየ፡ *ኵሎ፡ መዋዕሊሁ፡ *ላዕሌሁ፡ ለያዕቆብ፡
  english_pob_choice: that he would not seek any evil against Jacob all his days.
  chosen_korean: 곧 야곱을 향해 자기의 모든 날 동안 어떤 악도 구하지 않겠다고 한 맹세였습니다.
  alternatives_korean:
  - 자기 평생 야곱을 향한 어떤 악도 추구하지 않겠다고 한 맹세였습니다.
  - 야곱에게 해를 끼치지 않겠다고 평생 맹세한 것이었습니다.
  lexicon: seek any evil / all his days
  rationale: 게으즈의 ‘악을 찾다/구하다’는 단순 감정이 아니라 적극적 해악 추구를 가리키므로 ‘어떤 악도 구하지 않겠다’로 비교적 직접적으로 옮겼습니다.
theological_decisions:
- issue: 문장 종결과 서술 흐름
  chosen_reading: 서사체로 평서 종결을 유지하고, 맹세 내용은 직접인용이 아닌 간접화법으로 처리했습니다.
  alternative_readings:
  - 직접화법으로 ‘나는 … 하지 않겠다’라고 옮길 수 있음
  - 더 압축하여 한 문장으로 합칠 수 있음
  rationale: 게으즈 원문은 화자의 심리 회상과 맹세 내용을 서술적으로 연결하므로, 한국어도 서사 흐름을 살려 사건의 진행과 기억의 반전을 드러내는 편이 원문에 가깝습니다.
