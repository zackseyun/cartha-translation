revisions:
- from: 민족들과 백성들이 당신에게 절하게 하십시오. 당신은 형제들 위에 주가 되십시오. 그리고 당신의 어머니의 아들들이 당신에게 절하게 하십시오. 하나님이 저를 축복하시고 제 아버지 아브라함을 축복하신 모든 복이 당신과 당신의 씨에게 있기를 바랍니다.[a]
  to: 민족들과 백성들이 당신에게 절하게 되기를 바랍니다.[a] 당신이 형제들을 다스리시고, 당신의 어머니의 아들들이 당신에게 절하게 되기를 바랍니다. 하나님께서 저를 축복하시고 제 아버지 아브라함을 축복하신 모든 복이 당신과 당신의 후손에게 있기를 바랍니다.
  rationale: 축복문의 소망 어조를 한국어의 ‘…되기를 바랍니다’로 일관되게 구현했습니다. 원문에 있는 ‘민족들’과 ‘백성들’을 모두 유지하고, 형제들 위의 ‘주’라는 표현은 신적 칭호로 오독되지 않도록 통치 관계를 명확히 하는 ‘다스리다’로 옮겼습니다. 계보적 ‘씨’는 현대 한국어에서 의미가 분명한 ‘후손’으로 바꾸었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:16Z'
