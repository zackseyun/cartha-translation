    rationale: 한국어에서는 수신자가 민족들과 백성들에게 절을 시키거나 허락하라는 명령처럼 들릴 수 있습니다. 원문은 축복문 안의 제3인칭 소망/명령형이므로 ‘절하게 되기를 바랍니다’가 더 충실합니다.
