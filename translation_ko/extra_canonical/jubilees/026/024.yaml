  source_fidelity: 원문의 두 집합어(‘민족들’과 ‘백성들’), 형제들에 대한 우위, 어머니의 아들들의 복종, 하나님께서 화자와 아브라함에게 주신 복, 그리고 수신자와 그 후손에게 미치는 축복을 모두 옮겼습니다. 다만 초안의 ‘절하게 하십시오’는 한국어에서 수신자에게 타인을 절하게 만들라고 명하는 뜻으로 읽히기 쉬워, 원문의 축복적 소망 표현을 더 정확히 드러내도록 고쳤습니다.
  naturalness: 현대 표준어 합쇼체에서 ‘주가 되십시오’와 ‘당신의 씨’는 각각 신적 호칭 및 생물학적 의미를 강하게 연상시켜 문맥상 부자연스럽거나 오해될 수 있습니다. ‘다스리다’와 ‘후손’으로 뜻을 자연스럽게 밝혔습니다.
