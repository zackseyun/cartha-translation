  text: Let nations and peoples bow down to you. Be lord over your brothers, and let your mother’s sons bow down to you. And all the blessing with which God blessed me and blessed Abraham my father—let it be for you and for your seed.
  footnotes:
  - marker: a
    text: Or 'Let peoples bow down to you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 민족들과 백성들이 당신에게 절하게 하십시오. 당신은 형제들 위에 주가 되십시오. 그리고 당신의 어머니의 아들들이 당신에게 절하게 하십시오. 하나님이 저를 축복하시고 제 아버지 아브라함을 축복하신 모든 복이 당신과 당신의 씨에게 있기를 바랍니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሕዛብ / ሕዝብ
  english_pob_choice: nations and peoples
  chosen_korean: 민족들과 백성들
  alternatives_korean:
  - 나라들과 백성들
  - 민족과 백성
  lexicon: 아حزab = nations; ḥezb = peoples
  rationale: 원문에 두 집합어가 나란히 있어 둘 다 살려야 하므로, ‘민족들과 백성들’로 옮겨 중복을 살리고 한국어로도 자연스럽게 구성했습니다.
- source_word: ወይስግዱ
  english_pob_choice: bow down
  chosen_korean: 절하게 하십시오
  alternatives_korean:
  - 엎드리게 하십시오
  - 경배하게 하십시오
  lexicon: sgd = bow down / prostrate oneself
  rationale: 의례적·정치적 굴복을 함께 담는 동사이므로, 예배적 색채가 과도한 ‘경배하다’보다 ‘절하다’가 원문의 넓은 의미를 더 잘 보존합니다.
- source_word: እግዚአ
  english_pob_choice: Be lord over
  chosen_korean: 주가 되십시오
  alternatives_korean:
  - 군주가 되십시오
  - 주권을 가지십시오
  lexicon: egzi'a = lord, master
  rationale: 형제들 위에 군림하라는 뜻을 자연스럽게 드러내기 위해 ‘주가 되십시오’를 사용했고, ‘군림하다’보다 직접적 서열 관계를 유지합니다.
- source_word: ወኵሉን በረከት
  english_pob_choice: all the blessing
  chosen_korean: 모든 복
  alternatives_korean:
  - 모든 축복
  - 모든 복된 것
  lexicon: barakat = blessing
  rationale: 원문의 총칭적 명사구를 압축해 한국어에서 가장 직접적인 ‘복’으로 옮겼습니다.
- source_word: ዘባረከኒ… ወባረኮ…
  english_pob_choice: with which God blessed me and blessed Abraham my father
  chosen_korean: 하나님이 저를 축복하시고 제 아버지 아브라함을 축복하신
  alternatives_korean:
  - 하나님이 저를 복 주시고 제 아버지 아브라함에게 복 주신
  - 하나님께서 저와 제 아버지 아브라함을 축복하신
  lexicon: barak = bless
  rationale: 동일 동사 반복을 살려 축복의 연속성을 드러냈고, 주어를 분명히 하기 위해 ‘하나님’을 명시했습니다.
- source_word: ወለዘርእከ
  english_pob_choice: for your seed
  chosen_korean: 당신의 씨에게
  alternatives_korean:
  - 당신의 후손에게
  - 당신의 자손에게
  lexicon: zeraʿ = seed / offspring
  rationale: 이 문맥의 표지된 계보적 표현을 보존하기 위해, 관습적 ‘후손’보다 ‘씨’를 유지했습니다.
theological_decisions:
- issue: 축복문의 어조
  chosen_reading: 명령형이 아닌 축복/기원의 접속사적 표현으로 옮겨, ‘…하시기 바랍니다’로 마무리했습니다.
  alternative_readings:
  - 평서형 선언으로 옮김
  - 직접 명령형으로 옮김
  rationale: 원문과 영어 POB가 모두 축복적 요청의 문맥이므로, 한국어에서도 명령과 선언 사이의 기원형을 유지하는 것이 가장 충실합니다.
  doctrine_reference: patriarchal blessing form
- issue: 절하다와 주가 되다의 결합
  chosen_reading: 타민족의 절과 형제 위의 주권을 함께 유지했습니다.
  alternative_readings:
  - 둘을 모두 완화해 ‘존경하다/우두머리’로 처리
  - 정치적 복종만 강조
  rationale: 원문은 예배적 굴복과 가정/혈통 내 우위라는 두 층위를 모두 담고 있어, 이를 분리하지 않고 함께 보존해야 합니다.
  doctrine_reference: patriarchal primacy language
