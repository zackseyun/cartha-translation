  text: And Esau his brother came in from his hunting. And he also prepared food and brought it to his father, and said to his father, “Let my father arise and eat from my game, so that your soul may bless me.”
translation:
  language: ko
  text: 그의 형 에서도 사냥에서 돌아왔습니다. 그도 음식을 준비하여 아버지에게 가져다드리고, 아버지에게 말했습니다. “아버지, 일어나셔서 제가 사냥한 것을 드십시오. 그러면 아버지의 영혼이 저를 축복할 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዔሳውስ፡ እኁሁ፡" በጽሐ፡ እምነዓዊሁ
  english_pob_choice: And Esau his brother came in from his hunting.
  chosen_korean: 그의 형 에서도 사냥에서 돌아와 들어왔습니다.
  alternatives_korean:
  - 에서도 그의 형이 사냥에서 들어왔습니다.
  - 그리고 에서도 형이 사냥에서 돌아왔습니다.
  lexicon: 예서/이동 동사
  rationale: 히브리어/게즈의 동작 진행을 자연스럽게 살리기 위해 ‘돌아와 들어왔습니다’로 옮기되, 형제 관계를 앞에 두어 원문의 관계를 분명히 했습니다.
- source_word: ወገብረ፡ ውእቱሂ፡ መብልዐ፡
  english_pob_choice: And he also prepared food
  chosen_korean: 그도 음식을 준비하여
  alternatives_korean:
  - 그도 먹을 것을 마련하여
  - 그도 식사를 준비하여
  lexicon: 준비 동사
  rationale: 단순한 조리보다 이후 아버지에게 드리는 식사용 음식을 가리키므로, ‘음식을 준비하다’가 가장 무난합니다.
- source_word: እመሥገርትየ
  english_pob_choice: from my game
  chosen_korean: 제 사냥한 고기
  alternatives_korean:
  - 제 사냥감
  - 제가 잡은 짐승
  lexicon: 사냥/식용 표현
  rationale: 원문은 ‘사냥한 것’의 소유를 말하며, 식탁에 올릴 맥락이므로 한국어에서는 ‘사냥한 고기’가 의미를 가장 분명하게 전달합니다.
- source_word: ነፍስከ፡
  english_pob_choice: your soul may bless me
  chosen_korean: 아버지의 영혼이 저를 축복하도록 하십시오
  alternatives_korean:
  - 아버지의 영이 저를 축복하게 하십시오
  - 아버지께서 저를 축복하시게 하십시오
  lexicon: 영혼/영
  rationale: 게즈 원문이 ‘네 영혼’(life/soul)의 표현을 보존하므로, 전통적 신학적 완화 대신 ‘영혼’을 유지했습니다.
theological_decisions:
- issue: ‘your soul may bless me’의 인격화된 축복 주체를 어떻게 한국어로 유지할지
  chosen_reading: 아버지의 영혼이 저를 축복하도록 하십시오
  alternative_readings:
  - 아버지께서 저를 축복하시게 하십시오
  - 아버지의 영이 저를 축복하게 하십시오
  rationale: 본문은 축복을 단순한 형식적 인사보다 아버지의 내적 생명과 연결해 말하므로, 축복의 주체를 ‘영혼’으로 드러내 원문의 긴장을 보존했습니다.
  doctrine_reference: 원문 의미 보존 및 인격/생명 개념의 직접 번역
