  source_fidelity: 개정이 필요합니다. ዘርእ(‘씨, 후손’)와 ‘하늘 아래에서 뿌리째 제거됨’의 이미지는 보존되어야 하며, ይእዜኒ의 ‘이제’와 ‘가까이 오다’의 시간적 뉘앙스도 유지되어야 합니다. 그러나 እኁየ는 ‘내 형제/내 아우’이지 ‘내 형’이 아닙니다. 에서는 야곱의 형이므로 ‘내 형 야곱’은 관계를 반대로 만든 오류입니다.
  naturalness: ‘하늘 아래에서 뽑혀 나갈 것입니다’보다는 재배·제거의 비유를 자연스럽게 드러내는 ‘하늘 아래에서 뿌리째 뽑힐 것입니다’가 적절합니다. 또한 ‘애도의 날들이 가까이 오게 하자’는 한국어에서 화자가 그 날들을 작동시켜 오게 한다는 뜻으로 들려 부자연스럽습니다. ‘애도할 날들이 가까이 오기를 바랍니다’로 소망/결의를 나타내는 것이 자연스럽습니다.
  terminology: ‘씨’는 원문의 비유를 보존하는 선택으로 가능합니다. ‘애도할 날들’은 아버지의 죽음에 대한 상례 기간을 가리키는 문맥에 맞습니다. ‘내 아우 야곱’은 에서가 야곱보다 연상이라는 서사적 사실과 ‘my brother’를 한국어 친족어로 자연스럽게 옮깁니다.
