revisions:
- from: 그리고 너의 씨는 하늘 아래에서 뽑혀 나갈 것입니다.” 그리고 에서는 아버지가 자기에게 준 복 때문에 야곱을 미워하였고, 마음속으로 말했습니다. “이제 내 아버지를 위한 애도의 날들이 가까이 오게 하자. 그러면 내가 내 형 야곱을 죽이리라.”[a]
  to: 그리고 너의 씨는 하늘 아래에서 뿌리째 뽑힐 것입니다.” 에서는 아버지가 자기에게 베푼 복 때문에 야곱을 미워하였고, 마음속으로 말했습니다. “이제 내 아버지를 애도할 날들이 가까이 오기를 바랍니다. 그러면 내 아우 야곱을 죽이겠습니다.”[a]
  rationale: 야곱을 ‘형’으로 부른 관계 역전 오류를 ‘아우’로 바로잡았습니다. ‘이제’와 ‘가까이 오다’를 보존하면서 소망법을 자연스러운 현대 한국어로 옮겼고, ‘뿌리째 뽑힐’로 제거 비유를 명확히 했습니다. 폭력적 의도는 완화하지 않았습니다.
