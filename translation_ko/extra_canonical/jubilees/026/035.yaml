  text: and your seed will be uprooted from under heaven.” And Esau hated Jacob because of the blessing with which his father had blessed him, and he said in his heart, “Now let the days of mourning for my father come near, and I will kill Jacob my brother.”
  footnotes:
  - marker: a
    text: Or 'Let the days of mourning for my father come near'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너의 씨는 하늘 아래에서 뿌리째 뽑힐 것입니다.” 에서는 아버지가 자기에게 베푼 복 때문에 야곱을 미워하였고, 마음속으로 말했습니다. “이제 내 아버지를 애도할 날들이 가까이 오기를 바랍니다. 그러면 내 아우 야곱을 죽이겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이제 내 아버지를 애도할 날들이 가까이 오기를!”
    reason: 원문의 소망법적 표현은 ‘가까이 오기를 바랍니다’ 또는 감탄적 소망 표현으로 옮길 수 있습니다.
lexical_decisions:
- source_word: ዘርእከ፡ እመትሕተ፡ ሰማይ
  english_pob_choice: your seed will be uprooted from under heaven
  chosen_korean: 너의 씨는 하늘 아래에서 뽑혀 나갈 것입니다
  alternatives_korean:
  - 당신의 후손은 하늘 아래에서 뽑혀 나갈 것입니다
  - 네 자손은 하늘 아래에서 뿌리째 뽑힐 것입니다
  lexicon: 씨 / 후손 / 자손
  rationale: 원문의 ‘씨’와 영어 POB의 ‘seed’를 그대로 살리되, ‘뽑혀 나가다’로 uprooted의 강한 제거 이미지를 반영했습니다.
- source_word: ይእዜኒ
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 바로 이제
  lexicon: 이제 / 지금
  rationale: 게에즈의 시간 표지와 개정된 POB의 ‘Now’를 간결하게 반영했습니다.
- source_word: መዋዕለ፡ ላሐ፡ አቡየ፡
  english_pob_choice: the days of mourning for my father
  chosen_korean: 내 아버지를 위한 애도의 날들
  alternatives_korean:
  - 내 아버지의 애도의 날들
  - 아버지를 슬퍼하는 날들
  lexicon: 애도 / 슬픔
  rationale: ‘mourning’을 단순한 슬픔보다 상례적 뉘앙스가 있는 ‘애도’로 옮겨 문맥의 장례적 긴장을 살렸습니다.
- source_word: እኁየ
  english_pob_choice: my brother
  chosen_korean: 내 형
  alternatives_korean:
  - 내 형제
  - 내 동생
  lexicon: 형 / 형제
  rationale: 야곱-에서는 형제 관계이지만, 한국어 문맥에서 에서가 야곱을 향해 말하는 내적 독백의 뉘앙스를 고려해 ‘내 형 야곱’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 가계 약속과 저주/위협의 과장된 구문을 한국어에서 어떻게 유지할지
  chosen_reading: 직역에 가까운 ‘씨는 하늘 아래에서 뽑혀 나갈 것입니다’와 ‘내가 ... 죽이리라’를 유지했습니다.
  alternative_readings:
  - 의미를 완화한 ‘후손이 끊길 것입니다’
  - ‘죽여 버리겠다’처럼 구어적 강화
  rationale: 원문의 폭력적 의도와 서원/저주적 뉘앙스를 약화시키지 않기 위해, 한국어에서도 강한 제거 이미지와 살해 의도를 분명히 드러냈습니다.
  doctrine_reference: 서사 본문의 직접 진술 보존 원칙
- issue: 아버지 애도 기간을 기다리려는 에서의 계산된 복수 의도를 어떻게 표현할지
  chosen_reading: ‘이제 ... 가까이 오게 하자’로 시간적 접근성과 의도성을 함께 살렸습니다.
  alternative_readings:
  - ‘애도의 날들이 오게 하자’
  - ‘애도의 날들이 지나가게 하자’
  rationale: 게에즈의 ‘가까이 오게 하다/다가오게 하다’와 영어 POB의 최신 수정 ‘come near’에 맞추어, 복수 실행을 위한 의도적 지연을 드러냈습니다.
  doctrine_reference: 본문 서술의 서사적 긴장 유지
