  source_fidelity: 본문은 이삭이 그를 알아보지 못한 까닭을 그의 손이 에서의 손처럼 털이 많았다는 데 두고, 이어 복을 준 결과를 서술합니다. 초안의 의미는 대체로 충실하나, 대명사 배열이 한국어에서 이삭의 손을 가리키는 것으로도 잠시 읽힐 수 있습니다. 또한 현행 [a] 표지에는 대응 각주가 필요합니다.
  naturalness: ‘이삭은 그의 손이 그의 형 에서의 손처럼’은 ‘그의’가 연속되어 지시 대상이 불분명하고 다소 부자연스럽습니다. 문맥상 지시 대상을 야곱으로 밝혀 문장을 자연스럽게 정리하는 것이 안전합니다. 합쇼체 서술도 유지했습니다.
  terminology: ‘복을 주었습니다’는 서사적 blessing의 의미를 자연스럽고 과도하게 교회어화하지 않게 전달합니다. ‘형 에서’는 불필요한 소유 대명사를 덜어 자연스럽게 했습니다.
  issues:
  - severity: medium
    issue: 대명사 지시 대상의 일시적 모호성
