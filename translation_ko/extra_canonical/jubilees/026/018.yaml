  - severity: medium
    issue: 각주 표지 [a]에 대응하는 각주가 제시되지 않음
    rationale: 번역문에 [a]가 있으나 초안에는 한국어 각주 세트가 없습니다. 영어 감사 기록의 대안적 목적 해석을 한국어 각주로 제공하여 표지의 구조적 완결성과 본문상 가능한 뉘앙스를 보존해야 합니다.
