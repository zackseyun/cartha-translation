  - marker: a
    text: Or 'so that he might bless him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이삭은 그의 손이 그의 형 에서의 손처럼 털이 많았기 때문에 그를 알아보지 못하고, 그에게 복을 주었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኢያእመረ፡ ይስሐቅ፡
  english_pob_choice: And Isaac did not recognize him
  chosen_korean: 이삭은 그를 알아보지 못하고
  alternatives_korean:
  - 이삭은 그를 알아보지 못했습니다
  - 이삭은 그를 알아보지 못하였습니다
  lexicon: 알아보다
  rationale: 지각·판별의 부정을 간결하게 살려, 원문의 ‘recognize’에 해당하는 인식 실패를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: እስመ፡ እደዊሁ፡ ከመ፡' እደወ፡ ዔሳው፡
  english_pob_choice: because his hands were hairy like his brother Esau’s hands
  chosen_korean: 그의 손이 그의 형 에서의 손처럼 털이 많았기 때문에
  alternatives_korean:
  - 그의 손이 그의 형 에서의 손처럼 거칠고 털이 많았기 때문에
  - 그의 손이 형 에서의 손처럼 털이 많았기 때문에
  lexicon: 털이 많다
  rationale: 게으즈 원문의 손의 상태를 직접 반영해 ‘털이 많다’로 옮기고, 비교 대상인 에서의 손을 분명히 하여 서술의 근거를 보존했습니다.
- source_word: ይባርኮ።
  english_pob_choice: so he blessed him
  chosen_korean: 그에게 복을 주었습니다
  alternatives_korean:
  - 그를 축복했습니다
  - 그에게 축복하였습니다
  lexicon: 복을 주다
  rationale: 이 본문은 결과를 나타내는 연결로 읽히므로, 영어 POB 개정본의 ‘so he blessed him’을 따라 목적절처럼 만들지 않고 결과 서술로 처리했습니다.
theological_decisions:
- issue: ‘so that he might bless him’이 아니라 결과적 서술로 읽는 문제
  chosen_reading: 뒤의 행위는 목적이 아니라 결과이므로 ‘그리고… 복을 주었습니다’로 옮겼습니다.
  alternative_readings:
  - 그가 그를 축복하려고 하였습니다
  - 그가 그를 축복하도록 하였습니다
  rationale: 게으즈 구문과 영어 POB의 최신 수정이 모두 결과적 흐름을 지지하므로, 문맥상 자연스러운 서술형으로 유지했습니다.
  doctrine_reference: 본문 문법과 서사 흐름의 보존
- issue: ‘bless’의 번역
  chosen_reading: 전통적 교회어 ‘축복하다’보다, 본문이 복의 수여 행위를 말할 때는 ‘복을 주다’로 풀었습니다.
  alternative_readings:
  - 축복하다
  - 축복을 베풀다
  rationale: 행위의 결과와 전달성을 분명히 하면서도, 서술의 무게를 과도하게 신학화하지 않기 위해 직역적 표현을 택했습니다.
  doctrine_reference: 서사 본문의 평이한 행위 서술
