revisions:
- from: 영원합니다. 당신을 저주하는 사람은 저주를 받을 것이고, 당신에게 복을 빌어 주는 사람은 복을 받을 것입니다.” 그리고 이 일이 일어났습니다. 이삭이 자기 아들 야곱에게 축복을 마친 뒤, 그리고 야곱이 자기 아버지 이삭에게서 나간 뒤에 말입니다, 그가 자신을 숨겼습니다;[25]
  to: 영원토록. 당신을 저주하는 사람은 저주를 받을 것이고, 당신을 축복하는 사람은 복을 받을 것입니다.” 그 뒤에 이런 일이 있었습니다. 이삭이 자기 아들 야곱을 축복하기를 마치고, 야곱이 자기 아버지 이삭에게서 나간 뒤에, 야곱은 몸을 숨겼습니다.[25]
  rationale: 원문의 절단된 첫머리는 ‘영원토록’으로 보존하고, 저주와 축복의 직접 목적어 구조를 바로잡았습니다. 서사 전환을 자연스러운 현대 합쇼체로 다듬었으며, 영어 POB 감사 기록이 복원한 ‘몸을 숨겼다’는 내용을 유지했습니다. 각주는 해당 서술의 보존 근거를 간명하고 정확하게 설명하도록 고쳤습니다.
