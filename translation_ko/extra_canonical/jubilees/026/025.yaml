  yaml_path: translation/extra_canonical/jubilees/026/025.yaml
  text: forever. Whoever curses you will be cursed, and whoever blesses you will be blessed.” And it happened, after Isaac had finished blessing his son Jacob, and after Jacob had gone out from Isaac his father, that he hid himself;[25]
  footnotes:
  - marker: '25'
    text: The source includes a note-like element suggesting Jacob 'hid himself' after leaving Isaac. This detail is retained because it appears in the Ethiopic wording and is characteristic of Jubilees' retelling.
    reason: textual_variant
translation:
  language: ko
  text: 영원토록. 당신을 저주하는 사람은 저주를 받을 것이고, 당신을 축복하는 사람은 복을 받을 것입니다.” 그 뒤에 이런 일이 있었습니다. 이삭이 자기 아들 야곱을 축복하기를 마치고, 야곱이 자기 아버지 이삭에게서 나간 뒤에, 야곱은 몸을 숨겼습니다.[25]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '25'
    text: 야곱이 이삭에게서 나간 뒤 몸을 숨겼다는 서술은 에티오피아어 본문과 이 절의 번역 전승에 보존되어 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ዘይረግመከ፡ ... ዘይባርከከ፡
  english_pob_choice: Whoever curses you will be cursed, and whoever blesses you will be blessed.
  chosen_korean: 당신을 저주하는 사람은 저주를 받을 것이고, 당신에게 복을 빌어 주는 사람은 복을 받을 것입니다
  alternatives_korean:
  - 당신을 저주하는 자는 저주를 받을 것이고, 당신을 축복하는 자는 축복을 받을 것입니다
  - 당신을 저주하는 이는 저주를 받을 것이며, 당신을 축복하는 이는 축복을 받을 것입니다
  lexicon: 저주하다; 복을 빌다 / 복을 주다
  rationale: Ge'ez의 분사적 반복 구조를 조건문으로 자연스럽게 옮기되, POB의 의미를 따라 '복을 빌어 주다'로 축복 행위를 분명히 했습니다.
- source_word: አኅለቀ፡ እንዘ፡ ይባርኮ፡ ይስሐቅ፡ ለወልዱ፡
  english_pob_choice: after Isaac had finished blessing his son Jacob
  chosen_korean: 이삭이 자기 아들 야곱에게 축복을 마친 뒤
  alternatives_korean:
  - 이삭이 자기 아들 야곱을 축복하기를 마친 뒤
  - 이삭이 자기 아들 야곱에게 복을 주는 일을 마친 뒤
  lexicon: 축복하다
  rationale: Ge'ez의 '축복하다' 동사를 그대로 살리면서, 한국어에서 자연스러운 완료 표현 '축복을 마친 뒤'로 옮겼습니다.
- source_word: ወዅነ፡ ... ያዕቆብ፡ ወፅአ፡ ... እምይስሐቅ፡ አቡሁ
  english_pob_choice: after Jacob had gone out from Isaac his father
  chosen_korean: 야곱이 자기 아버지 이삭에게서 나간 뒤
  alternatives_korean:
  - 야곱이 그의 아버지 이삭에게서 나간 뒤
  - 야곱이 아버지 이삭에게서 나간 뒤
  lexicon: 나가다; 아버지
  rationale: 출발 동사 '나가다'를 직역하되, 관계를 분명히 하기 위해 '자기 아버지'를 보존했습니다.
- source_word: ይስሐቅ ... ያዕቆብ ... እምድኅረ ...
  english_pob_choice: that he hid himself;
  chosen_korean: 그가 자신을 숨겼습니다
  alternatives_korean:
  - 그가 몸을 숨겼습니다
  - 그가 숨었습니다
  lexicon: 숨다 / 숨기다
  rationale: 제공된 Ge'ez 절말의 행위성을 반영하여 수동적 '숨다'보다 능동적 반사 표현으로 옮겼습니다. 다만 본문이 끊겨 있는 형태를 고려해 문장 말미를 보수적으로 유지했습니다.
theological_decisions:
- issue: 축복과 저주의 상호 확증 공식
  chosen_reading: 저주와 축복의 결과가 선언적으로 맞물린 언약적 공식으로 읽었습니다.
  alternative_readings:
  - 일반적 도덕 격언으로 완화해 읽기
  - 단순 예언적 발화로만 제한해 읽기
  rationale: 히브리어 성경의 아브라함 언약 계열 공식과 유사한 구조가 Ge'ez 문장에도 분명하므로, 단순한 일반론보다 언약적 선언으로 유지하는 편이 원문의 힘을 살립니다.
  doctrine_reference: 창세기 12:3, 27:29의 축복/저주 공식
- issue: 마지막 절의 '숨다' 처리
  chosen_reading: 본문에 남아 있는 서술 요소를 그대로 반영해 '그가 자신을 숨겼습니다'를 유지했습니다.
  alternative_readings:
  - 해당 구를 삭제하기
  - '''그가 몸을 숨겼습니다''로 의역하기'
  rationale: English audit trail와 chapter-level source context가 이 구를 보존하도록 지시하므로, 누락보다 잔존 텍스트를 우선해 문헌적 흔적을 유지했습니다.
  doctrine_reference: 본문비평/전승사적 보존 원칙
