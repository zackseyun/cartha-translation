translation:
  language: ko
  text: “내 아들아, 나는 늙었고 이제 내 눈이 어두워져 보지 못합니다. 나는 내가 죽을 날을 알지 못합니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이전 번역은 “그리고 그가 말하였다, ‘내 아들아, 나는 늙었고 이제 내 눈이 보기에 너무 흐려졌으며, 내가 죽을 날을 알지 못한다.’”라고 하였습니다. 그러나 제공된 게에즈어 본문에는 ‘그리고 그가 말하였다’에 해당하는 도입절이 없습니다.
    reason: previous_rendering
