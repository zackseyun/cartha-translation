translation:
  language: ko
  text: “내 아들아, 나는 늙었고 이제 내 눈이 보기에 너무 흐려졌으며, 내가 죽을 날을 알지 못한다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወልድየ
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: 직접 호칭
  rationale: 지시 대상이 아들임을 분명히 하면서도, Ge'ez의 친밀한 호칭을 자연스러운 한국어 직접 발화로 옮기기 위해 ‘내 아들아’를 택했습니다.
- source_word: ረሳዕኩ
  english_pob_choice: I have grown old
  chosen_korean: 나는 늙었고
  alternatives_korean:
  - 나는 늙었습니다
  - 내가 늙었습니다
  - 나는 나이가 들었습니다
  lexicon: 동사/상태 서술
  rationale: 원문의 ‘늙음’ 상태를 간결하게 반영했고, 이어지는 감각 저하와 병렬을 이루도록 현재 상태를 서술형으로 옮겼습니다.
- source_word: አዕይንትየ፡ ከፍአ፡ ለርእይ
  english_pob_choice: my eyes are too dim to see
  chosen_korean: 이제 내 눈이 보기에 너무 흐려졌으며
  alternatives_korean:
  - 이제 내 눈이 너무 어두워져 보지 못하며
  - 이제 내 눈이 너무 침침해져 보지 못하며
  lexicon: 감각 저하 표현
  rationale: 직역하면 ‘보기에 흐리다’라는 의미가므로, 시력 저하를 과장하지 않으면서도 문맥상 자연스럽게 ‘보기에 너무 흐려졌으며’로 옮겼습니다.
- source_word: ዕለተ፡ ሞትየ
  english_pob_choice: the day of my death
  chosen_korean: 내가 죽을 날
  alternatives_korean:
  - 내 죽음의 날
  - 내가 죽게 될 날
  lexicon: 명사구
  rationale: 원문의 ‘죽음의 날’ 의미를 유지하되, 한국어에서 더 직접적이고 구어적인 예고 표현인 ‘내가 죽을 날’로 다듬었습니다.
theological_decisions:
- issue: 본문의 직접 발화 시작 여부
  chosen_reading: 본문은 ‘내 아들아’로 바로 시작하며, 별도의 ‘그가 말하였다’는 서술을 넣지 않았습니다.
  alternative_readings:
  - ‘그리고 그가 말하였다, “내 아들아…”’
  - ‘내 아들아…’ 앞에 서술문을 덧붙이는 번역
  rationale: 제공된 Ge'ez 본문은 ወልድየ(‘내 아들아’)로 바로 시작하므로, 영어 POB의 보정 사항을 반영해 삽입된 서술을 제거했습니다.
  doctrine_reference: source fidelity / textual audit trail
