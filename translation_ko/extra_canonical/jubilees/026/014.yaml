  chosen_reading: ‘네 하나님이 그것을 내 앞에 가져오셨기 때문입니다’로 옮겨, 사건의 배후에 있는 하나님의 작용을 직접적으로 드러냈습니다.
  alternative_readings:
  - 그것이 우연히 내 앞에 왔기 때문입니다
  - 네 하나님이 그것이 내게 오도록 하셨기 때문입니다
  rationale: 본문은 단순한 결과가 아니라 ‘네 하나님’의 행위를 원인으로 제시하므로, 그 신학적 뉘앙스를 약화하지 않도록 직역보다 직접적인 표현을 택했습니다.
