  text: And Jacob went in to his father and said, “I am your son; I have done as you told me. Rise, sit, and eat from what I have hunted, father, so that your soul may bless me.”
translation:
  language: ko
  text: 야곱이 아버지에게 들어가 말했습니다. “저는 아버지의 아들입니다. 아버지께서 제게 말씀하신 대로 했습니다. 일어나 앉으시고, 제가 사냥한 것을 드십시오, 아버지. 아버지의 영혼이 저를 축복하도록 하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영혼’은 원문을 따라 옮긴 말입니다. 여기서는 사람의 생명이나 사람 자신을 가리킬 수도 있습니다.
    reason: 원문의 ነፍስከ(‘당신의 영혼/생명’)를 보존하되, 이를 특정한 신학적 의미로 한정하지 않도록 설명합니다.
lexical_decisions:
- source_word: ወቦአ፡ ያዕቆብ፡ ኀበ፡ አቡሁ፡
  english_pob_choice: And Jacob went in to his father
  chosen_korean: 야곱이 그의 아버지에게 들어가
  alternatives_korean:
  - 야곱이 그의 아버지께로 갔습니다
  - 야곱이 그의 아버지에게로 들어갔습니다
  lexicon: n/a
  rationale: Geez의 ኀበ는 단순한 이동보다 ‘~에게/에게로’의 도착을 포함하므로, English POB의 went in to를 반영해 ‘들어가’로 옮겼습니다.
- source_word: አነ፡ ወልድከ፡
  english_pob_choice: I am your son
  chosen_korean: 저는 아버지의 아들입니다
  alternatives_korean:
  - 저는 당신의 아들입니다
  - 제가 아버지의 아들입니다
  lexicon: n/a
  rationale: 직접 호칭이 있는 대화에서 한국어는 2인칭 소유를 자연스럽게 ‘아버지의 아들’로 풀어도 원문의 관계가 유지되며, 존대 맥락을 살렸습니다.
- source_word: ገበርኩ፡ በከመ፡ ትቤለኒ፡
  english_pob_choice: I have done as you told me
  chosen_korean: 아버지께서 제게 말씀하신 대로 했습니다
  alternatives_korean:
  - 아버지께서 말씀하신 대로 했습니다
  - 아버지의 말씀대로 행했습니다
  lexicon: n/a
  rationale: ‘말했다/지시했다’의 의미를 살리면서, 한국어에서 더 자연스러운 관계 표현인 ‘아버지께서 제게 말씀하신 대로’로 옮겼습니다.
- source_word: ተንሥእ፡ ወንበር፡ ወብላዕ፡
  english_pob_choice: Rise, sit, and eat
  chosen_korean: 일어나 앉으시고, ... 드시며
  alternatives_korean:
  - 일어나 앉아서 드시고
  - 일어나 앉으시고 먹으십시오
  lexicon: n/a
  rationale: 명령형의 연속을 한국어 합쇼체로 재현하되, 부모를 향한 공손한 동작 호칭에 맞춰 ‘앉으시고, 드시며’로 처리했습니다.
- source_word: እምዘ፡ አሰገርኩ፡
  english_pob_choice: from what I have hunted
  chosen_korean: 제가 사냥해 온 것을
  alternatives_korean:
  - 제가 사냥한 것에서
  - 사냥한 것
  lexicon: n/a
  rationale: 원문의 ‘사냥한/사냥해 온’의 결과를 살려, 단순한 대상보다 출처가 드러나도록 ‘사냥해 온 것을’로 번역했습니다.
theological_decisions:
- issue: 야곱의 요청 목적절에서 ‘your soul may bless me’를 어떻게 처리할지
  chosen_reading: ‘아버지, 제 영혼이 저를 축복하도록 해 주십시오’로 옮겨, 축복의 주체를 아버지의 영혼/생명과 연결하는 표현을 보존했습니다.
  alternative_readings:
  - ‘아버지께서 저를 축복해 주십시오’
  - ‘아버지의 영혼이 저를 축복하게 해 주십시오’
  rationale: Geez 원문은 ‘네 영혼/생명’(ነፍስከ)을 직접 두어 축복의 매개를 분명히 하므로, 이를 평탄화하지 않고 살리는 쪽이 소스 충실합니다.
  doctrine_reference: 원문상 축복의 행위와 축복의 내적 주체를 분리해 읽을 수 있으므로, 인칭을 아버지로 단순 치환하지 않고 문법적 긴장을 유지했습니다.
