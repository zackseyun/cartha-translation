  text: And now take your hunting gear, your quiver and your bow, and go out to the field and hunt and catch game for me, my son, and prepare food for me such as my soul loves, and bring it to me so that I may eat, and my soul may bless you before I die.”
  footnotes:
  - marker: a
    text: Or 'and hunt game for me, my son'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이제 너의 사냥 도구, 곧 너의 화살통과 활을 가져다가 들에 나가 나를 위해 사냥하고, 또 잡아라, 내 아들아. 그리고 내 영혼이 사랑하는 음식으로 나를 위해 음식을 만들어 내게 가져오라. 그러면 내가 먹고, 죽기 전에 내 영혼이 너를 복 주리라.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንሣእ፡ ንዋየ፡ ነፃዊከ፡ ምትኃደከ፡ ወቀስትከ፡
  english_pob_choice: take your hunting gear, your quiver and your bow
  chosen_korean: 너의 사냥 도구, 곧 너의 화살통과 활을 가져다가
  alternatives_korean:
  - 사냥 장비, 네 화살통과 활을 가지고
  - 사냥 도구와 화살통과 활을 가져다가
  lexicon: 사냥 도구 / 화살통 / 활
  rationale: 기어를 포괄적으로 ‘사냥 도구’로 옮기고, 뒤의 두 명사 ‘화살통’과 ‘활’을 분리해 원문의 나열을 보존했습니다.
- source_word: ወነዐው፡ ሐቅለ፡ ወወአንዝ፡
  english_pob_choice: and hunt and catch game
  chosen_korean: 들에 나가 나를 위해 사냥하고, 또 잡아라
  alternatives_korean:
  - 들에 나가 나를 위해 사냥하여 잡아라
  - 들에 나가 나를 위해 사냥하고 짐승을 잡아라
  lexicon: 사냥하다 / 잡다
  rationale: 개정된 POB 감사기록이 반영한 두 동사 ‘hunt’와 ‘catch/seize’를 각각 살려, 사냥과 포획의 이중 동작을 구분했습니다.
- source_word: መብልዐ፡ ዘከመ፡ ታፈቅር፡ ነፍስየ፡
  english_pob_choice: food for me such as my soul loves
  chosen_korean: 내 영혼이 사랑하는 음식으로 나를 위해 음식을 만들어
  alternatives_korean:
  - 내 영혼이 좋아하는 음식으로 나를 위해 음식을 준비하여
  - 내 마음이 좋아하는 음식을 만들어
  lexicon: 음식 / 영혼이 사랑하다
  rationale: ‘영혼’과 ‘사랑하다’를 직접 살려, 단순한 취향 표현으로 약화시키지 않고 본문의 강한 선호를 유지했습니다.
- source_word: እብላዕ፡ ... ተባርከ፡ ነፍስየ፡
  english_pob_choice: so that I may eat, and my soul may bless you before I die
  chosen_korean: 그러면 내가 먹고, 죽기 전에 내 영혼이 너를 복 주리라
  alternatives_korean:
  - 그러면 내가 먹고, 죽기 전에 내 영혼이 너를 축복하리라
  - 그러면 내가 먹고, 죽기 전에 너를 축복하고
  lexicon: 복 주다 / 영혼
  rationale: 축복 행위를 한국어에서 자연스러운 ‘복 주다’로 옮기되, 주체가 ‘내 영혼’임을 유지했습니다.
theological_decisions:
- issue: ‘내 영혼’의 주체성과 축복의 표현
  chosen_reading: 축복의 주체를 화자의 ‘영혼’으로 그대로 두고, 본문이 가진 인격적·전인적 발화를 약화시키지 않았습니다.
  alternative_readings:
  - ‘내가 너를 축복하리라’처럼 단순화
  - ‘내 마음이 너를 축복하리라’로 완화
  rationale: 게에즈 원문과 POB 영어 모두 축복 주체를 ‘my soul’로 표시하므로, 이를 인위적으로 일반화하지 않는 것이 원문의 긴장을 보존합니다.
  doctrine_reference: anthropology / textual fidelity
- issue: 사냥과 포획의 이중 동작
  chosen_reading: ‘사냥하고, 또 잡아라’로 두 동사를 분리해 번역했습니다.
  alternative_readings:
  - ‘사냥하여 잡아라’로 합성
  - ‘사냥하라’로 단순화
  rationale: 최근 교정에서 지적된 누락을 반영해, 원문이 가진 반복·강조 효과를 한국어에서도 드러냈습니다.
  doctrine_reference: source fidelity / narrative precision
