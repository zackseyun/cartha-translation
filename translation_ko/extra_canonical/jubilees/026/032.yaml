  text: with grain and wine and oil I have sustained him. And for you, what can I do now, my son?” And Esau said to Isaac his father, “Do you have only one blessing, father? Bless me too, father!”
translation:
  language: ko
  text: 곡식과 포도주와 기름으로 내가 그를 부양하였습니다. 너에게는 내가 이제 무엇을 해 줄 수 있겠습니까, 내 아들아?” 에서가 자기 아버지 이삭에게 말하였습니다. “아버지, 축복이 하나뿐입니까? 저도 축복해 주십시오, 아버지!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስርናይ፡ ወወይን፡ ወቅብዕ፡
  english_pob_choice: with grain and wine and oil
  chosen_korean: 곡식과 포도주와 기름으로
  alternatives_korean:
  - 곡식과 포도주와 기름을 가지고
  - 곡식과 포도주와 기름으로써
  lexicon: source-level lexical choice
  rationale: 세 항목은 제공 수단을 나타내므로 한국어에서도 ‘-으로’로 자연스럽게 도구·수단 의미를 살렸습니다.
- source_word: አጽናዕክዎ፡
  english_pob_choice: I have sustained him
  chosen_korean: 내가 그를 부양하였습니다
  alternatives_korean:
  - 내가 그를 굳세게 하였습니다
  - 내가 그를 강하게 하였습니다
  - 내가 그를 붙들어 주었습니다
  lexicon: source-level lexical choice
  rationale: 문맥상 이 동사는 단순한 ‘강화’보다 먹을 것과 기름을 공급하여 생계를 유지하게 한다는 뜻이므로 ‘부양하다’가 가장 정확합니다.
- source_word: በረከት፡
  english_pob_choice: blessing
  chosen_korean: 축복
  alternatives_korean:
  - 복
  - 복을 주는 말
  - 은혜
  lexicon: source-level lexical choice
  rationale: 가부장적 맥락의 축복 발화를 한국어에서 명료하게 드러내기 위해 ‘축복’으로 옮겼습니다.
theological_decisions:
- issue: 에서의 요청을 직접화된 청원으로 옮길지 여부
  chosen_reading: “저도 축복해 주십시오, 아버지!”로 옮겨, 간청의 긴급성과 아버지에게 향한 직접 요청을 살렸습니다.
  alternative_readings:
  - “저에게도 축복이 있게 해 주십시오, 아버지!”
  - “저에게도 복을 주십시오, 아버지!”
  rationale: 원문과 영어 본문 모두 에서의 요청이 짧고 절박한 직접 화법이므로, 장황하게 풀지 않고 간결한 청원형으로 유지하는 것이 서사적 힘을 보존합니다.
  doctrine_reference: 서사 본문 번역의 화행 보존
- issue: ‘one blessing’의 수량 표현
  chosen_reading: ‘축복이 하나뿐입니까?’로 옮겨, 이삭이 가진 축복의 제한성과 에서의 소외를 분명히 했습니다.
  alternative_readings:
  - ‘복이 하나뿐입니까?’
  - ‘축복은 하나뿐입니까?’
  rationale: 질문이 단순히 축복의 개수를 묻는 것이므로 수량 표현을 분명히 드러내는 편이 원문의 긴장과 대비를 더 잘 전달합니다.
  doctrine_reference: 본문 내 수사적 대비 보존
