base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/026/007.yaml
  text: And Jacob said to Rebekah his mother[7], “Mother, will I not lack some of all that my father eats and that pleases him? But I am afraid, my mother, that he will recognize my voice and want to touch me. And you know that I am smooth, while Esau my brother is hairy, and I will appear in his eyes like one who mocks him, and I will do a deed that he did not command me, and he will be angry with me, and I will bring on myself a curse and not a blessing.”
  footnotes:
  - marker: '7'
    text: The verse is textually difficult. The Ge'ez seems to say Isaac would recognize or discern what he eats, then shifts to Jacob's fear that Isaac may detect him by his voice and touch. The translation preserves the sense without over-smoothing.
    reason: segmentation_note
  - marker: a
    text: Or 'does not my father recognize everything that he eats and discern it?'.
    reason: previous_rendering
  - marker: b
    text: Or 'that he may not recognize my voice and may not allow me to touch him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 야곱이 어머니 리브가에게 말했습니다. “어머니, 아버지께서 드시고 좋아하시는 모든 것 가운데 제게 부족한 것이 있겠습니까?[7][a] 그러나 어머니, 아버지께서 제 목소리를 알아보시고 저를 만지려고 하실까 두렵습니다.[b] 어머니도 아시다시피 저는 털이 없고, 제 형 에서는 털이 많습니다. 그러면 저는 아버지 눈에 아버지를 조롱하는 사람처럼 보일 것이며, 아버지께서 제게 명령하지 않으신 일을 하게 될 것입니다. 아버지께서는 제게 화를 내시고, 저는 복이 아니라 저주를 스스로 불러오게 될 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '7'
    text: 이 절은 본문상 난해합니다. 게에즈어는 처음에 아버지가 드시고 좋아하는 것에 관하여 말한 뒤, 야곱이 아버지가 자신의 목소리를 알아보고 자신을 만질 것을 두려워하는 말로 전환됩니다. 번역은 이 전환을 과도하게 매끄럽게 만들지 않고 보존합니다.
    reason: segmentation_note
  - marker: a
    text: 또는, 개시절을 다르게 분석하여 ‘아버지께서 드시고 좋아하시는 모든 것을 알아보고 분별하지 않으십니까?’로 옮길 수 있습니다. 그러나 여기서는 ኢይምሕክ를 ‘부족하다’라는 관용적 의미로 이해했습니다.
    reason: previous_rendering
  - marker: b
    text: 게에즈어의 부정 표기는 문법적으로 논의되지만, ‘두렵다’ 뒤에서는 아버지가 야곱의 목소리를 알아보고 그를 만지려 할 것이라는 우려를 나타내는 것으로 번역했습니다. 다른 분석은 ‘내 목소리를 알아보지 못하고 내가 그를 만지도록 허락하지 않을까’라고 이해합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ኢይምሕክ + ወያሠምሮ
  english_pob_choice: will I not lack some of all that my father eats and that pleases him?
  chosen_korean: 제가 빠질 수 없지 않습니까? … 아버지께서 드시고 좋아하시는 음식
  alternatives_korean:
  - 제가 부족하지 않습니까?
  - 아버지께서 드시는 모든 것 중에 빠지는 것이 없지 않습니까?
  lexicon: idiomatic clause + lexical sense of ሠምረ
  rationale: 개시 절은 ‘부족하다/빠지다’의 관용적 뜻이 강해 한국어도 자연스럽게 옮겼고, ወያሠምሮ는 ‘그를 기쁘게 하다/좋아하다’의 의미이므로 ‘좋아하시는 음식’으로 반영했습니다.
- source_word: ከመ፡ ኢይለቡ፡ ቃልየ፡
  english_pob_choice: that he will recognize my voice
  chosen_korean: 제가 제 목소리만으로도 알아보이고
  alternatives_korean:
  - 그가 제 목소리를 알아보지 못할까
  - 아버지께서 제 목소리를 알아차리실까
  lexicon: recognize + voice
  rationale: 이 문맥은 단순 청각이 아니라 화자를 식별하는 뜻이므로 ‘목소리로 알아보다’를 살려, 뒤의 ‘만지게 하실까’와 병행되도록 자연스럽게 구성했습니다.
- source_word: ይገሥሠኒ
  english_pob_choice: want to touch me
  chosen_korean: 저를 만지게 하실까
  alternatives_korean:
  - 저를 만지려 하실까
  - 저를 만지라고 하실까
  lexicon: touch
  rationale: Ge'ez 동사는 실제로 ‘만지다’이며, POB가 지적한 대로 ‘허락하다’가 아니라 접촉 자체를 뜻하므로 동작을 직접적으로 옮겼습니다.
- source_word: ዘይስተአኪ / ልሙጽ / ጸጓር
  english_pob_choice: I am smooth, while Esau my brother is hairy
  chosen_korean: 저는 매끈하고, 제 형 에서는 털이 많습니다
  alternatives_korean:
  - 저는 털이 없고, 제 형 에서는 털투성이입니다
  - 저는 매끄럽고, 에서는 거칩니다
  lexicon: descriptive physical contrast
  rationale: ‘매끈하다’와 ‘털이 많다’를 대조해 히브리식 신체 묘사의 대비를 유지했고, 현대 한국어에서도 즉시 이해되도록 했습니다.
- source_word: በረከተ / መርገመ
  english_pob_choice: a curse and not a blessing
  chosen_korean: 복이 아니라 저주
  alternatives_korean:
  - 축복이 아니라 저주
  - 저주가 되고 복이 아니
  lexicon: blessing/curse
  rationale: 종결부의 병렬 대비를 살리되, 한국어 성경 문체에서 자연스러운 ‘복/저주’ 대립으로 압축했습니다.
theological_decisions:
- issue: '문장 긴장의 보존: ‘알아보심’과 ‘만지심’의 두려움'
  chosen_reading: 아버지께서 목소리로 저를 알아보시고 또 저를 만지게 하실까 두렵습니다
  alternative_readings:
  - 아버지께서 제 목소리를 알아보지 못하게 하실까 두렵습니다
  - 아버지께서 저를 만지지 못하게 하실까 두렵습니다
  rationale: 게에즈 본문과 POB 보정이 모두 지적하듯, 이 절은 인식(목소리)과 접촉(만짐)의 이중 긴장을 함께 전달해야 하므로 둘을 모두 드러냈습니다.
  doctrine_reference: source text coherence / narrative tension
