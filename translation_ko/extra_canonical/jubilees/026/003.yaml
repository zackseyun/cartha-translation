  naturalness: 초안도 문법적으로 가능하나, ‘이삭이 에서를 향해 말하는 동안 듣고 있었습니다’는 ‘향해’가 다소 부자연스럽고, 누가 무엇을 듣는지의 결속도 약간 느슨합니다. ‘이삭이 에서에게 말하는 동안 듣고 있었습니다’가 현대 표준 한국어의 격 관계와 서사 문체에 더 자연스럽습니다.
  terminology: 리브가, 이삭, 에서는 한국어 성경권에서 널리 쓰이는 안정된 인명 표기입니다. 신학 용어는 없습니다.
