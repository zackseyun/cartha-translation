translation:
  language: ko
  text: “당신이 내게 명하신 대로입니다.” 그러자 이삭은 매우 심하게 떨며 말했습니다. “그렇다면 사냥하고 잡아서 나에게 가져온 그 사람은 누구입니까? 내가 당신이 오기 전에 모든 것을 먹었고, 그를 축복했는데?”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በከመ፡ አዘዝከኒ።
  english_pob_choice: as you commanded me
  chosen_korean: “당신이 내게 명하신 대로입니다.”
  alternatives_korean:
  - “당신이 내게 명령하신 대로입니다.”
  - “아버지께서 내게 명하신 대로입니다.”
  lexicon: አዘዘ / 명하다
  rationale: 원문의 순응 진술을 자연스러운 응답문으로 옮기되, 지시적·공적 뉘앙스를 살려 ‘명하셨다’로 번역했습니다.
- source_word: ወተደመ፡ ... ዐቢየ፡ ጥቀ፡
  english_pob_choice: Isaac trembled with a very great trembling
  chosen_korean: 이삭은 매우 심하게 떨며
  alternatives_korean:
  - 이삭은 몹시 크게 떨며
  - 이삭은 극도로 떨며
  lexicon: ደመ / 떨다
  rationale: 게으즈의 중복 표현이 강한 떨림을 강조하므로, 한국어에서도 부사 중첩으로 강도를 살렸습니다.
- source_word: ዘነዐወ፡ ወአሥገረ፡
  english_pob_choice: who hunted and caught game
  chosen_korean: 사냥하고 잡아서
  alternatives_korean:
  - 사냥하여 잡아서
  - 사냥하고 포획하여
  lexicon: 사냥하다 / 잡다
  rationale: 이 구절은 단순히 ‘사냥하다’만이 아니라 ‘사냥하여 잡다/포획하다’의 두 동작을 모두 담으므로, POB 개정 취지에 맞게 둘 다 드러냈습니다.
- source_word: ወበላዕኩ፡ እምኵሉ፡
  english_pob_choice: and I ate of everything
  chosen_korean: 내가 당신이 오기 전에 모든 것을 먹었고
  alternatives_korean:
  - 내가 당신이 오기 전에 그것을 다 먹었고
  - 내가 당신이 오기 전에 모든 것을 먹었고
  lexicon: እምኵሉ / 모두, 전부
  rationale: 원문의 ‘모든 것에서 먹었다’는 관용적 표현을 한국어에서 자연스럽게 ‘모든 것을 먹었다’로 옮겼습니다.
- source_word: ወባረክዎ
  english_pob_choice: and I blessed him
  chosen_korean: 그를 축복했는데
  alternatives_korean:
  - 그를 축복했는데
  - 그를 축복하였는데
  lexicon: ባረከ / 축복하다
  rationale: 아버지의 선언을 회상하는 문맥에서 축복 행위를 분명히 하되, 한국어 성경체의 자연스러운 연결을 위해 어미를 열어 두었습니다.
theological_decisions:
- issue: 이삭의 질문 형식과 절정의 긴장 유지
  chosen_reading: ‘그렇다면 사냥하고 잡아서 나에게 가져온 그 사람은 누구입니까?’로 옮겨, 원문의 충격과 혼란을 직설적으로 드러냈습니다.
  alternative_readings:
  - ‘그 사냥꾼은 누구입니까?’처럼 단순화하는 번역
  - ‘그가 누구였습니까?’로 일반화하는 번역
  rationale: 게으즈 본문은 축복이 이미 잘못 전달되었음을 폭로하는 장면이므로, 질문의 직접성과 서사적 긴장을 약화시키지 않았습니다.
  doctrine_reference: 서사적 문맥 보존
- issue: ‘축복하다’의 유지
  chosen_reading: ‘그를 축복했는데’로 직역적 요소를 살려, 아버지의 축복 선언이 돌이킬 수 없이 이루어졌음을 드러냈습니다.
  alternative_readings:
  - ‘복을 빌었는데’
  - ‘축복해 주었는데’
  rationale: 전통적 경어화보다 원문의 사건성·법적 효력을 보이기 위해 ‘축복하다’를 유지했습니다.
  doctrine_reference: 족장 축복의 결정성
