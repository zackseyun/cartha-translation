  text: 그는 포도주를 마셨습니다. 그의 아버지 이삭이 그에게 말했습니다. “가까이 와서 내게 입맞추어라, 내 아들아.” 그가 가까이 와서 그에게 입맞추었습니다.
  philosophy: optimal-equivalence
