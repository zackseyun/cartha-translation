  rationale: 원문은 권위 있는 아버지의 요청이면서도 친밀한 부자 관계를 드러내므로, 한국어에서도 자연스러운 거리감과 존중을 함께 반영했습니다.
  doctrine_reference: 서술체 번역에서 화자-청자 관계 보존
- issue: ‘입맞추어라’의 명령형
  chosen_reading: 명령의 직접성을 유지해 ‘입맞추어라’로 옮겼습니다.
  alternative_readings:
  - ‘입맞추어 주십시오’처럼 완곡화하는 방식
  - ‘입을 맞추십시오’처럼 높이는 방식
  rationale: 원문은 부탁이 아니라 직접 명령에 가까운 발화이므로, 의미 강도를 약화시키지 않기 위해 직설적 명령형을 사용했습니다.
  doctrine_reference: 원문 화행 보존
