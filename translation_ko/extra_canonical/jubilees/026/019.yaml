  language: ko
  text: 그가 말했습니다. “정말 네가 내 아들 에서입니까?” 그가 말했습니다. “제가 아버지의 아들입니다.” 그가 말했습니다. “그것을 내게 가까이 가져오십시오. 그러면 제가 먹겠습니다.”
