  text: And he said, “Are you really my son Esau?” And he said, “I am your son.” And he said, “Bring it near to me, and I will eat.”
translation:
  language: ko
  text: 그리고 그가 말했습니다. “네가 באמת 내 아들 에서이냐?” 그가 말했습니다. “제가 아버지의 아들입니다.” 그가 말했습니다. “가져다가 내게 가까이 오게 하십시오. 내가 먹겠습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: “Are you really my son Esau?”
  english_pob_choice: Are you really my son Esau?
  chosen_korean: “네가 באמת 내 아들 에서이냐?”
  alternatives_korean:
  - “네가 정말 내 아들 에서이냐?”
  - “네가 참으로 내 아들 에서이냐?”
  lexicon: 에서
  rationale: 질문은 혈연 확인을 위한 직접 확인 표현이므로 ‘정말/참으로’보다 강한 의심과 확인의 뉘앙스를 살린 ‘이냐’ 구문으로 옮겼습니다.
- source_word: “I am your son.”
  english_pob_choice: I am your son.
  chosen_korean: “제가 아버지의 아들입니다.”
  alternatives_korean:
  - “제가 아들입니다.”
  - “제가 당신의 아들입니다.”
  lexicon: 아버지 / 아들
  rationale: 히브리어식 가족관계 확인을 한국어로 자연스럽게 드러내기 위해 1인칭 응답을 ‘아버지의 아들’로 풀어, 앞선 질문의 관계를 분명히 했습니다.
- source_word: “Bring it near to me, and I will eat.”
  english_pob_choice: Bring it near to me, and I will eat.
  chosen_korean: “가져다가 내게 가까이 오게 하십시오. 내가 먹겠습니다.”
  alternatives_korean:
  - “가져와 내게 가까이 두십시오. 내가 먹겠습니다.”
  - “내게 가져오십시오. 그러면 먹겠습니다.”
  lexicon: 가져다가 / 가까이 오게 하다
  rationale: 원문의 연속 명령을 살려 ‘bring it near to me’를 단순한 이동이 아니라 화자에게 가까이 가져오라는 동작으로 표현했습니다.
theological_decisions:
