  text: And he smelled the fragrant smell of his garments and blessed him and said, “Look, the smell of my son is like the smell of a field.”
  footnotes:
  - marker: a
    text: Or 'the smell of his garments'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그의 옷의 향기로운 냄새를[a] 맡고 그를 축복하며 말했습니다. 「보십시오, 내 아들의 냄새는 들판의 냄새와 같습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그의 옷 냄새”.
    reason: 게으즈어 어구의 결합을 간결하게 이해하는 대안 독법을 보존하며, English POB 감사 기록의 ‘the smell of his garments’ 대안을 반영합니다.
lexical_decisions:
- source_word: መዐዛ / fragrant smell
  english_pob_choice: the fragrant smell of his garments
  chosen_korean: 향기로운 냄새
  alternatives_korean:
  - 향내
  - 향긋한 냄새
  - 향기
  lexicon: Geez መዐዛ
  rationale: 게으즈어 መዐዛ는 단순한 냄새보다 ‘향기로운/향내 나는 냄새’의 뉘앙스를 가지므로, English POB의 ‘fragrant smell’을 따라 의미를 분명히 살렸습니다.
- source_word: አልባሲሁ፡ / his garments
  english_pob_choice: his garments
  chosen_korean: 그의 옷
  alternatives_korean:
  - 그의 의복
  - 그의 겉옷
  lexicon: Geez አልባስ
  rationale: 문맥상 특정한 의복 전체를 가리키므로 가장 자연스럽고 직접적인 ‘옷’으로 옮겼습니다.
- source_word: ወባረኮ፡ / blessed him
  english_pob_choice: blessed him
  chosen_korean: 그를 축복하며
  alternatives_korean:
  - 그를 복 주며
  - 그에게 복을 빌며
  lexicon: Geez ባረከ
  rationale: 서술 동작으로 이어지는 축복 행위를 현대 한국어에서 자연스럽게 표현하되, 종교적 의미를 약화하지 않도록 ‘축복하다’를 사용했습니다.
- source_word: ጼና፡ ገዳም፡ / smell of a field
  english_pob_choice: the smell of a field
  chosen_korean: 들판의 냄새
  alternatives_korean:
  - 밭의 냄새
  - 경작지의 냄새
  lexicon: Geez ገዳም
  rationale: English POB의 ‘field’를 너무 농경 전문용어로 좁히지 않고, 본문의 비교 이미지를 살리는 일반적이고 이해하기 쉬운 ‘들판’으로 옮겼습니다.
theological_decisions:
- issue: 축복 언어의 서술 방식
  chosen_reading: 축복 행위를 과거 서술로 자연스럽게 옮기면서도, 예언적·가계적 축복의 무게를 유지했습니다.
  alternative_readings:
  - 그를 복 주며
  - 그에게 복을 빌며
  rationale: 이 장면은 단순한 감정 표현이 아니라 가문의 축복 선언이므로, 한국어에서도 경건한 서술을 유지하는 것이 본문의 기능을 잘 드러냅니다.
  doctrine_reference: 족장 축복 전승(창세기 27장 평행 본문)
