  text: And Rebekah his mother said to him, “Let your curse be on me, my son; only listen to my voice.”
translation:
  language: ko
  text: 그러자 그의 어머니 리브가가 그에게 말했습니다. “내 아들아, 네 저주가 내게 내리게 하십시오. 다만 내 말을 들으십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትቤሎ፡ ርብቃ፡ እሙ፡ ላዕሌየ፡ መርገምከ፡
  english_pob_choice: Let your curse be on me
  chosen_korean: “내 아들아, 네 저주는 내게 돌아오게 하십시오.”
  alternatives_korean:
  - “내 아들아, 네 저주는 내 위에 있게 하십시오.”
  - “내 아들아, 네 저주는 내게 미치게 하십시오.”
  lexicon: መርገም / curse
  rationale: 게으름 없이 직역하면 ‘저주는 내게’이지만, 한국어에서는 ‘돌아오게 하십시오’가 대속적 부담을 자청하는 뜻을 자연스럽게 드러내며 optative 뉘앙스를 살립니다.
- source_word: ዳእሙ፡
  english_pob_choice: only
  chosen_korean: 다만
  alternatives_korean:
  - 오직
  - 단지
  lexicon: only
  rationale: 제한적 강조를 나타내는 말로서, 한국어에서는 문맥상 연결이 자연스러운 ‘다만’이 적절합니다.
- source_word: ስማዕ፡ ቃልየ።
  english_pob_choice: listen to my voice
  chosen_korean: 내 말을 들으십시오.
  alternatives_korean:
  - 내 음성을 들으십시오.
  - 내 소리를 들으십시오.
  lexicon: hear / voice
  rationale: 직역의 ‘음성’보다, 요청의 실질을 드러내는 ‘말’이 본문 의미를 더 분명하게 전달합니다. 다만 ‘음성’은 다소 신체적/청각적 뉘앙스를 강하게 하므로 여기서는 ‘말’로 옮겼습니다.
- source_word: ወትቤሎ፡ ርብቃ፡ እሙ፡
  english_pob_choice: And Rebekah his mother said to him
  chosen_korean: 그러자 리브가가 그에게 말했습니다.
  alternatives_korean:
  - 리브가, 그의 어머니가 그에게 말했습니다.
  - 그리고 그의 어머니 리브가가 그에게 말했습니다.
  lexicon: proper name / apposition
  rationale: Geez의 apposition(‘리브가, 그의 어머니’)를 한국어에서는 관계를 풀어 ‘리브가가 그에게’로 자연스럽게 처리하되, 이미 앞에서 밝혀진 모성 관계를 반복하지 않아도 됩니다.
theological_decisions:
- issue: Rebekah’s request takes the form of an optative self-substitution
  chosen_reading: 그의 저주를 자신에게 돌리라고 요청하는 자기부담적 진술로 옮겼습니다.
  alternative_readings:
  - 직설적으로 ‘네 저주는 내게 있다’라고 옮김
  - 완곡하게 ‘내가 그 저주를 받겠다’로 옮김
  rationale: Geez와 영어 POB의 ‘Let your curse be on me’는 명령형이 아니라 부담을 자청하는 요청이므로, 한국어에서도 자발적 감수의 의미가 드러나야 합니다.
  doctrine_reference: 서사적 발화의 의도 보존
