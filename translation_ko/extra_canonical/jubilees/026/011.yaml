  lexicon: 주다
  rationale: 단순한 전달 행위를 자연스럽고 직접적으로 나타내며, 문맥상 특별한 뉘앙스가 없으므로 가장 기본적인 동사를 택했습니다.
- source_word: '*ትብሲሰ፡'
  english_pob_choice: the cooked dish
  chosen_korean: 익힌 음식
  alternatives_korean:
  - 조리한 음식
  - 삶은 음식
  - 익혀 만든 음식
  lexicon: 조리/익힘의 결과물 표현
  rationale: 게으즈어 원문은 준비된 먹거리를 가리키므로, 요리의 결과를 드러내되 과도하게 특정하지 않는 표현으로 옮겼습니다.
- source_word: ወኅብስተ፡ ዘገብረት፡
  english_pob_choice: and the bread that she had made
  chosen_korean: 그리고 자신이 만든 빵
  alternatives_korean:
  - 그리고 그녀가 만든 빵
  - 그리고 그녀가 지은 빵
  lexicon: 빵 + 제작 동사
  rationale: ‘만들다’는 본문의 제조 의미를 자연스럽게 살리며, ‘자신이’로 관계절을 간결하게 풀어 원문의 수식 관계를 분명히 했습니다.
- source_word: ውስተ፡ እዴ፡
  english_pob_choice: into the hand of
  chosen_korean: 손에
  alternatives_korean:
  - 손 안에
  - 손으로
  lexicon: 손/전달 방향
  rationale: 게으즈어의 방향 구문을 한국어에서는 ‘~의 손에’로 옮겨, 전달 대상과 수여의 이미지를 그대로 보존했습니다.
- source_word: ያዕቆብ፡ ወልዳ።
  english_pob_choice: Jacob her son
  chosen_korean: 아들 야곱
  alternatives_korean:
  - 그녀의 아들 야곱
  - 야곱인 아들
  lexicon: 고유명사 + 친족관계
  rationale: 관계는 ‘아들’로 간명하게 살리고, 고유명사 ‘야곱’은 익숙한 성경형을 사용했습니다.
theological_decisions:
- issue: 문장의 행위 순서와 전달성
  chosen_reading: ‘익힌 음식과 자신이 만든 빵을 … 손에 주었습니다’로, 두 항목을 병렬로 유지해 단순한 가사적 전달 장면을 드러냈습니다.
  alternative_readings:
  - ‘조리한 음식과 그가 만든 빵을…’
  - ‘밥과 빵을…’
  rationale: 원문은 일상적인 식품 전달을 기록하는 서술이므로, 의미를 확대하거나 현대식 식사 어휘로 바꾸지 않고 평이한 병렬 구조를 유지했습니다.
  doctrine_reference: 서사 본문의 최소 개입 원칙
