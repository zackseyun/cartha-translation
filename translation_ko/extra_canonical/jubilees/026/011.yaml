  lexicon: 손/전달 방향
  rationale: 게으즈어의 방향 구문을 한국어에서는 ‘~의 손에’로 옮겨, 전달 대상과 수여의 이미지를 그대로 보존했습니다.
- source_word: ያዕቆብ፡ ወልዳ።
  english_pob_choice: Jacob her son
  chosen_korean: 아들 야곱
  alternatives_korean:
  - 그녀의 아들 야곱
  - 야곱인 아들
  lexicon: 고유명사 + 친족관계
  rationale: 관계는 ‘아들’로 간명하게 살리고, 고유명사 ‘야곱’은 익숙한 성경형을 사용했습니다.
