  text: 'he cried out with a very great and bitter cry, and said to his father, “Bless me too, father!” And he said to him, “Your brother came with deceit and has taken away your blessings.” And he said, “Now I know why his name was called Jacob: he has supplanted me these two times. First he took my birthright, and now he has taken my blessing.”'
  footnotes:
  - marker: a
    text: Or 'your blessing.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 아주 크고 쓰라린 소리로 외치며 그의 아버지에게 말했습니다. “저도 축복해 주십시오, 아버지!” 그러자 아버지가 그에게 말했습니다. “네 형이 속임수로 와서 네 축복들을 빼앗아 갔다.” 그가 말했습니다. “이제야 그의 이름이 야곱으로 불린 이유를 알겠습니다. 그는 나를 이 두 번이나 속였습니다. 처음에는 내 장자권을 빼앗았고, 이제는 내 축복을 빼앗았습니다.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቃል፡ ዐቢይ፡ ወመሪር፡ ጥቀ፡
  english_pob_choice: with a very great and bitter cry
  chosen_korean: 아주 크고 쓰라린 소리로
  alternatives_korean:
  - 매우 크고 쓰라린 외침으로
  - 지극히 크고 쓰라린 부르짖음으로
  lexicon: 직역-의미 대응
  rationale: 원문은 ‘크다/매우 크다’와 ‘쓰라리다’를 함께 담고 있어, 감정을 과장하지 않으면서도 강도를 살려 ‘아주 크고 쓰라린 소리로’로 옮겼습니다.
- source_word: ባርከኒ፡ *ኪያየኒ፡ አባ።
  english_pob_choice: “Bless me too, father!”
  chosen_korean: “저도 축복해 주십시오, 아버지!”
  alternatives_korean:
  - “저를 축복해 주십시오, 아버지!”
  - “저도 복을 빌어 주십시오, 아버지!”
  lexicon: 청원 표현
  rationale: 기본 의미는 ‘축복하다’이지만, 한국어에서 아버지에게 드리는 간청은 ‘저도 축복해 주십시오’가 가장 자연스럽고 원문의 요청성을 잘 살립니다.
- source_word: በረከታቲከ
  english_pob_choice: your blessings
  chosen_korean: 네 축복들을
  alternatives_korean:
  - 네 축복
  - 네 복들을
  lexicon: 복/축복 어휘
  rationale: 게에즈 원문이 복수형이므로, 영어 POB의 최신 수정 취지와 원문 형태를 반영해 복수로 옮겼습니다.
- source_word: ይእዜ፡ ... ልደተየኒ፡ ነሥአ፡ ... በረከትየ።
  english_pob_choice: First he took my birthright, and now he has taken my blessing.
  chosen_korean: 처음에는 내 장자권을 빼앗았고, 이제는 내 축복을 빼앗았습니다.
  alternatives_korean:
  - 처음에는 내 맏아들 권리를 빼앗았고, 이제는 내 축복을 빼앗았습니다.
  - 처음에는 내 장자권을 취했고, 이제는 내 축복을 취했습니다.
  lexicon: 권리/상속 표현
  rationale: ‘장자권’은 히브리 서사에서 문맥상 가장 적절한 관용어이며, ‘빼앗다’는 원문의 강한 상실감을 살립니다.
