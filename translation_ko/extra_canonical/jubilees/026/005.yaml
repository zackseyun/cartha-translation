revisions:
- from: 리브가가 자기 아들 야곱을 불러 그에게 말했습니다. “보세요, 내가 들으니 당신의 아버지 이삭이 당신의 형 에서와 이야기하며 이렇게 말하더군요. ‘나를 위해 사냥감을 잡아 오고, 나를 위해 맛있는 음식을 준비하여 내게 가져오너라. 내가 먹고, 내가 죽기 전에 야훼 앞에서 너에게 복을 빌어 주겠다.’”[a]
  to: 리브가가 자기 아들 야곱을 불러 그에게 말했습니다. “보아라, 내가 네 아버지 이삭이 네 형 에서에게 이렇게 말하는 것을 들었다. ‘나를 위해 사냥감을 잡아라[a]. 나를 위해 음식을 준비하여 내게 가져와라. 내가 먹고, 내가 죽기 전에 주님 앞에서 너를 축복하겠다.’”
  rationale: 원문의 동작 순서(사냥하다–음식을 준비하다–가져오다)를 보존하고, 원문에 없는 ‘맛있는’을 제거했습니다. 신적 호칭은 원문과 영어 POB의 ‘the LORD’에 맞춰 ‘주님’으로 번역했습니다. 직접화법은 현대 표준 한국어의 자연스러운 가족 호칭으로 다듬었으며, 각주 표지를 관련 어구로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:56Z'
review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. አሰግር는 ‘사냥하다/사냥감을 잡다’이고 뒤의 ወአብእ가 ‘가져오다’이므로 두 동작을 구별해야 합니다. 또한 መብልዐ는 본문 자체로는 단지 ‘음식’이며, ‘맛있는’이라는 수식은 원문에 없습니다. እግዚአብሔር는 이 구절에서 ‘주님’(the LORD)에 해당하는 호칭으로 옮기는 것이 적절합니다.
  naturalness: 직접화법에서 리브가가 아들에게 하는 말은 ‘당신의’보다 ‘네’가 자연스럽습니다. ‘너에게 복을 빌어 주겠다’도 가능하지만, 축복 행위의 목적어를 직접 나타내는 ‘너를 축복하겠다’가 간결하고 자연스럽습니다.
  terminology: 인명 ‘리브가, 야곱, 이삭, 에서’는 한국어 성경 관습에 맞습니다. 신명으로 단정할 근거가 없는 እግዚአብሔር는 ‘야훼’ 대신 ‘주님’으로 옮겼습니다.
