  text: And Rebekah called Jacob her son and said to him, “Look, I heard Isaac your father speaking with Esau your brother, saying, ‘Hunt game for me and prepare food for me, and bring it to me, that I may eat and bless you before the LORD before I die.’”
  footnotes:
  - marker: a
    text: Or 'Bring me game'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가가 자기 아들 야곱을 불러 그에게 말했습니다. “보세요, 내가 들으니 당신의 아버지 이삭이 당신의 형 에서와 이야기하며 이렇게 말하더군요. ‘나를 위해 사냥감을 잡아 오고, 나를 위해 맛있는 음식을 준비하여 내게 가져오너라. 내가 먹고, 내가 죽기 전에 야훼 앞에서 너에게 복을 빌어 주겠다.’”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወጸውዐት
  english_pob_choice: called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 호출했습니다
  - 불러 말했습니다
  lexicon: source verb of summoning/calling
  rationale: 문맥상 리브가가 야곱을 자기 앞으로 불러 들이는 동작이므로, 자연스러운 현대 한국어로 ‘불렀습니다’를 택했습니다.
- source_word: ያዕቆብ
  english_pob_choice: Jacob
  chosen_korean: 야곱
  alternatives_korean:
  - 야코브
  lexicon: proper noun
  rationale: 성경에서 널리 확립된 한국어 인명형을 따랐습니다.
- source_word: አሰግር / ወአብእ
  english_pob_choice: Hunt game for me / bring it to me
  chosen_korean: 사냥감을 잡아 오고 / 내게 가져오너라
  alternatives_korean:
  - 사냥감을 잡아 오고 / 가져오너라
  - 사냥감을 구해 오고 / 내게 가져오너라
  lexicon: hunting and bringing verbs
  rationale: 첫 동사는 단순히 ‘가져오다’가 아니라 ‘사냥하다/사냥감을 잡다’의 의미가 있어 분리해 옮겼고, 뒤의 동사는 실제로 가져오는 동작으로 구분했습니다.
- source_word: መብልዐ
  english_pob_choice: food
  chosen_korean: 맛있는 음식
  alternatives_korean:
  - 음식
  - 먹을 것
  lexicon: meal/food
  rationale: 이 항목은 문맥상 단순한 ‘음식’보다 사냥한 고기를 요리한 식사 준비를 가리키므로, 영어 POB의 의미를 반영해 자연스럽게 ‘맛있는 음식’으로 옮겼습니다.
- source_word: በቅድመ እግዚአብሔር
  english_pob_choice: before the LORD
  chosen_korean: 야훼 앞에서
  alternatives_korean:
  - 주님 앞에서
  - 주 앞에서
  lexicon: divine name
  rationale: 원문은 야훼의 면전/앞을 뜻하므로 프로젝트 기본값대로 ‘야훼’로 옮겼습니다. '앞에서'는 행동의 공적·언약적 장면을 살립니다.
theological_decisions:
- issue: 축복의 시점과 조건
  chosen_reading: 이삭이 ‘내가 먹고… 너에게 복을 빌어 주겠다’고 말하는 미래 의도를 그대로 살렸습니다.
  alternative_readings:
  - ‘내가 먹고 나서 너를 축복하겠다’
  - ‘먹게 하여야 너를 축복하겠다’
  rationale: Ge'ez 원문은 식사 후 축복 의도를 분명히 하므로, 조건절을 과도하게 해석하지 않고 의도-결과 관계를 유지했습니다.
  doctrine_reference: 본문 충실성 / 내러티브 문맥 보존
