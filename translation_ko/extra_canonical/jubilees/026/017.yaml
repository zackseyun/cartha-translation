  text: “목소리는 야곱의 목소리인데, 손은 에서의 손입니다.” 그는 그를 알아보지 못했습니다. 그것은 그의 영을 거두기 위한 하늘로부터의 전환이었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 달리 옮기면, “그의 영을 돌이키기 위해 하늘로부터 일어난 일이었기 때문이다”입니다. 게에즈어 표현은 ‘전환’이라는 명사와 ‘영을 지나가게 하다/거두다’라는 동사를 함께 사용하므로, 그 정확한 함의는 단정하지 않았습니다.
    reason: 원문의 명사형 ‘전환’과 제거를 뜻하는 동사를 보존하면서, 구문의 해석상 여지를 밝혀 줍니다.
