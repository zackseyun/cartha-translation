translation:
  language: ko
  text: “목소리는 야곱의 목소리인데, 손은 에서의 손입니다.” 그는 그를 알아보지 못했습니다. 그것은 하늘로부터 그의 영을 돌이키게 하려는 전환이었기 때문입니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል፡ ቃለ፡ ያዕቆብ፡
  english_pob_choice: The voice is Jacob’s voice
  chosen_korean: “목소리는 야곱의 목소리인데”
  alternatives_korean:
  - “소리는 야곱의 소리인데”
  - “음성은 야곱의 음성인데”
  lexicon: voice
  rationale: 지각된 발화의 음성을 자연스러운 현대 한국어로 옮기되, 원문의 반복 구조를 살려 동일한 판단문 느낌을 유지했습니다.
- source_word: ወእደው፡ እደወ፡ ዔሳው፡
  english_pob_choice: but the hands are Esau’s hands
  chosen_korean: “손은 에서의 손입니다.”
  alternatives_korean:
  - “손은 에서의 손인데”
  - “손은 에서의 손입니다”
  lexicon: hand
  rationale: 손의 대조를 선명하게 유지하기 위해 직역에 가깝게 옮겼고, 앞절과의 병행을 살리기 위해 종결형을 맞췄습니다.
- source_word: ወኢያእመረ፡
  english_pob_choice: And he did not recognize him
  chosen_korean: 그는 그를 알아보지 못했습니다.
  alternatives_korean:
  - 그는 그를 알아차리지 못했습니다.
  - 그는 그를 알아보지 못하였습니다.
  lexicon: recognize
  rationale: 상황상 ‘인식하다’보다 관계적·직관적 의미의 ‘알아보다’가 자연스럽고, 인물 식별의 실패를 분명히 드러냅니다.
- source_word: እስመ፡ ሚጠት፡' ውእቱ፡ እምሰማይ፡
  english_pob_choice: because it was a turning from heaven
  chosen_korean: 그것은 하늘로부터의 전환이었기 때문입니다.
  alternatives_korean:
  - 그것은 하늘로부터의 돌이킴이었기 때문입니다.
  - 그것은 하늘에서 온 전환이었기 때문입니다.
  lexicon: turning / from heaven
  rationale: 게에즈의 명사형 ‘전환/돌이킴’을 살려 문법 구조를 보존했고, ‘하늘로부터’로 출처를 나타내어 원문의 신적 기원성을 유지했습니다.
- source_word: ለአሕልፎ፡ መንፈሱ፡
  english_pob_choice: to remove his spirit
  chosen_korean: 그의 영을 돌이키게 하려는
  alternatives_korean:
  - 그의 영을 떠나게 하려는
  - 그의 영을 빼앗으려는
  lexicon: spirit / remove
  rationale: 문맥상 물리적 제거보다 인식·감각의 전환을 가리키는 표현으로 읽혀, ‘돌이키게 하다’로 원문의 의도를 과도하게 확대하지 않으면서 반영했습니다.
theological_decisions:
- issue: 하늘에서 온 일의 성격
  chosen_reading: 하늘로부터의 전환이란 표현으로, 이 사건을 단순한 착오가 아니라 하나님 쪽에서 주어진 인식의 전환으로 읽었습니다.
  alternative_readings:
  - 하늘에서 내려온 속임수
  - 하늘이 그의 영을 제거하게 함
  rationale: 게에즈의 명사형과 동사형 조합은 ‘무언가를 제거’보다 ‘전환/돌이킴’의 흐름을 더 직접적으로 지시하므로, 신적 섭리의 개입을 드러내되 과도한 신학적 확장은 피했습니다.
  doctrine_reference: 섭리, 인식의 제한
