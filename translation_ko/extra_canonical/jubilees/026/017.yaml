  source_fidelity: 앞부분의 식별 공식과 ‘하늘로부터의 전환’이라는 명사 구조는 대체로 충실합니다. 그러나 ለአሕልፎ፡ መንፈሱ፡는 ‘그의 영을 돌이키게 하다’보다 ‘그의 영을 거두다/없애다’에 가까운 제거의 목적을 나타냅니다. ‘돌이키게 하려는’은 앞선 ‘전환’의 의미를 중복시키면서 원문의 제거 동작을 약화합니다.
  naturalness: ‘목소리는 …인데, 손은 …입니다’는 자연스럽고 현대적인 합쇼체입니다. 다만 종결 뒤의 인과절은 ‘그의 영을 거두기 위한 하늘로부터의 전환이었기 때문입니다’로 배열하면 한국어 문장 흐름과 원문의 명사-목적 구성이 모두 더 분명해집니다.
  terminology: ‘영’은 መንፈስ의 폭넓은 의미를 보존하는 적절한 표현입니다. ‘하늘’도 원문 표현을 그대로 반영합니다. ‘거두다’는 직설적인 ‘없애다’보다 자연스러우면서도 ‘돌이키다’처럼 의미를 전환시키지 않아 안전합니다.
