  yaml_path: translation/extra_canonical/jubilees/026/034.yaml
  text: shall be your dwelling[34], and from the dew of heaven above. And by your sword you shall live, and you shall serve your brother; and it shall be that when you rebel and remove the yoke from your neck, then you will commit a complete sin unto death,
  footnotes:
  - marker: '34'
    text: This verse is notably difficult and appears expanded in a way unlike Genesis 27:40. The Ge'ez includes language about sin unto death and the removal of Esau's seed from under heaven. The translation reflects that harder reading rather than normalizing it to the Genesis parallel.
    reason: textual_variant
  - marker: a
    text: Or 'when your father leaves you and removes his yoke'.
    reason: previous_rendering
  - marker: b
    text: Or 'commit all sin'.
    reason: previous_rendering
translation:
  language: ko
  text: 네 소유는 되며, 하늘의 이슬로부터 위에 있을 것입니다. 또 네 칼로 살 것이며, 네 형제를 섬길 것입니다. 그리고 네가 반역하여 목에서 멍에를 벗을 때에는, 그때 네가 죽음에 이르는 완전한 죄를 지을 것입니다.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኩን፡ ንብረትከ፡ ወእምጠለ፡ ሰማይ፡ እምላዕሉ።
  english_pob_choice: shall be your dwelling ... from the dew of heaven above
  chosen_korean: 네 소유는 되며, 하늘의 이슬로부터 위에 있을 것입니다
  alternatives_korean:
  - 네 거처가 될 것입니다
  - 하늘 위의 이슬로부터 너의 몫이 될 것입니다
  lexicon: source_note
  rationale: 게에즈 본문은 ‘네 소유/재산’(ንብረት)과 ‘하늘의 이슬’(ጠለ ሰማይ)을 함께 말하므로, 거주지로만 좁히지 않고 소유를 살려 옮겼습니다.
- source_word: ወበመጥባኅትከ፡ ትሐዩ፡
  english_pob_choice: by your sword you shall live
  chosen_korean: 네 칼로 살 것이며
  alternatives_korean:
  - 네 칼에 의지하여 살 것이며
  - 칼을 가지고 살아갈 것입니다
  lexicon: source_note
  rationale: 도구적 의미를 자연스럽게 살리되, 직역 어감을 유지하기 위해 ‘네 칼로’로 옮겼습니다.
- source_word: ወለእኁከ፡ ትትቀነይ፤
  english_pob_choice: you shall serve your brother
  chosen_korean: 네 형제를 섬길 것입니다
  alternatives_korean:
  - 네 형제에게 복종할 것입니다
  - 네 형제를 섬기게 될 것입니다
  lexicon: source_note
  rationale: 게에즈 본문은 ‘형제’(እኁ)와 ‘섬기다/종속되다’의 관계를 말하므로, 왕래어적이지만 과도하게 완화하지 않는 ‘섬길 것입니다’를 택했습니다.
- source_word: አርዑተ፡
  english_pob_choice: the yoke
  chosen_korean: 멍에
  alternatives_korean:
  - 고삐
  - 짐받이
  lexicon: source_note
  rationale: ‘멍에’는 한국어 성경 전통에서 지배·예속의 이미지를 가장 직접적으로 전달하는 표준 대응어입니다.
- source_word: ትኤብስ፡ አበሳ፡ ኵሎ
  english_pob_choice: you will commit a complete sin
  chosen_korean: 죽음에 이르는 완전한 죄를 지을 것입니다
  alternatives_korean:
  - 온전한 죄를 지을 것입니다
  - 모든 죄를 지을 것입니다
  lexicon: source_note
  rationale: 영어 POB의 ‘a complete sin unto death’를 따라 ‘완전한 죄’를 유지하되, 결과 절의 ‘unto death’를 한국어에서 자연스럽게 풀어 ‘죽음에 이르는’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 강한 죄-사망 진술
  chosen_reading: ‘죽음에 이르는 완전한 죄’로 옮겨, 본문의 윤리적 경고를 약화하지 않았습니다.
  alternative_readings:
  - ‘사형에 해당하는 죄’
  - ‘치명적인 죄’
  rationale: 게에즈 본문과 영어 POB 모두 단순한 실수나 일반적 죄가 아니라 사망에 이르는 완결된 반역을 강조하므로, 경고의 강도를 보존했습니다.
  doctrine_reference: source-text priority; avoid harmonizing to Genesis 27:40
