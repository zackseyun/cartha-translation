    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. “아버지, 제게도 한 번 복을 남겨 두지 않으셨습니까?” 이삭이 에서에게 대답하며 말했습니다. “보십시오, 나는 그를 당신 위에 주로 세웠고, 그의 모든 형제들을 그에게 종들로 주었습니다 — 그리고 풍성함으로.”[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከተ
  english_pob_choice: a blessing
  chosen_korean: 복
  alternatives_korean:
  - 복된 것
  - 축복
  - 한 번의 복
  lexicon: N/A
  rationale: 원문의 ‘a blessing’는 특정 정관사 ‘그 복’이 아니라 남겨 둘 복의 한 항목을 뜻하므로, 한국어에서는 간결하게 ‘복’을 사용했습니다.
- source_word: ሤምክዎ ለከ
  english_pob_choice: I have made him lord over you
  chosen_korean: 그를 당신 위에 주로 세웠고
  alternatives_korean:
  - 그를 당신의 주로 삼았고
  - 그를 당신 위에 주인으로 세웠고
  lexicon: N/A
  rationale: 동사구는 단순 소유가 아니라 지위 부여를 나타내므로 ‘주로 세우다’로 옮겨 위계 설정의 뉘앙스를 살렸습니다.
- source_word: አግብርተ ይኩንዎ
  english_pob_choice: I have given all his brothers to him as servants
  chosen_korean: 그의 모든 형제들을 그에게 종들로 주었습니다
  alternatives_korean:
  - 그의 모든 형제들을 그에게 종으로 주었습니다
  - 그의 모든 형제들을 그에게 하인으로 주었습니다
  lexicon: N/A
  rationale: 문맥상 예속 관계를 드러내는 표현이므로 완곡한 ‘하인’보다 ‘종’이 원문의 종속성을 더 분명히 반영합니다.
- source_word: ወበ*ብዝኀ
  english_pob_choice: and with abundance
  chosen_korean: 그리고 풍성함으로
  alternatives_korean:
  - 그리고 많음으로
  - 그리고 풍족하게
  - 그리고 넘치게
  lexicon: N/A
  rationale: 마지막 구는 영어 POB도 미완결적으로 남겨 두었으므로, 보충하지 않고 원문의 열린 종결을 살리는 ‘풍성함으로’로 처리했습니다.
theological_decisions:
- issue: 형제들을 ‘종들’로 준다는 표현의 위계성
  chosen_reading: 에서의 아래에 야곱과 그의 형제들이 예속된 지위에 놓였다는 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 사회적 예절이나 종속 없는 섬김의 비유로 약화할 수 있습니다.
  rationale: 원문은 지위 전복과 종속을 분명히 말하므로, 이를 약화하지 않고 그대로 드러내는 것이 서사와 축복-저주 구조를 보존합니다.
  doctrine_reference: 서사적 문맥 보존
- issue: 끝의 미완결 구문 처리
  chosen_reading: 마지막 절을 보충하지 않고 ‘그리고 풍성함으로’로 남겼습니다.
  alternative_readings:
  - 문장을 매끄럽게 완결하도록 한국어로 내용을 덧붙일 수 있습니다.
  rationale: 주어진 원문과 영어 POB 모두 종결을 완성하지 않았으므로, 해석을 추가하지 않고 열린 형태를 유지했습니다.
  doctrine_reference: 본문 보존 원칙
