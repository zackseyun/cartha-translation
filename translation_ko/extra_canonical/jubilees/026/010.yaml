  text: And Rebekah took the desirable garments of her elder son Esau, which were with her in the house, and clothed Jacob her younger son with them; and the skins of the young kids she put on his hands and on the bare part of his neck.
  footnotes:
  - marker: a
    text: Or 'and from the skins of the young kids she put them on his hands'.
    reason: previous_rendering
translation:
  language: ko
  text: 리브가가 집에 있던 큰아들 에서의 아름답고 탐스러운 옷을 가져다가 작은아들 야곱에게 입혔습니다. 또 어린 염소 새끼들의 가죽을 야곱의 손과 목의 드러난 부분에 덮었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ / clothed him with
  english_pob_choice: clothed Jacob her younger son with them
  chosen_korean: 입혔습니다
  alternatives_korean:
  - 옷을 입혔습니다
  - 덧입혔습니다
  lexicon: 입히다
  rationale: 의복을 다른 사람에게 씌워 주는 행위를 자연스럽게 드러내면서, 단순히 ‘입다’보다 행위의 주체가 리브가임을 분명히 합니다.
- source_word: ዘይሌህቅ፡ ዘይትፈተው / desirable garments
  english_pob_choice: the desirable garments
  chosen_korean: 좋아하고 귀히 여겨진 옷
  alternatives_korean:
  - 탐나는 옷
  - 사랑받는 옷
  lexicon: desired/precious
  rationale: 옷의 가치와 선호를 함께 담아, 단순한 ‘좋아하는’보다 소유자에게 특별한 옷이라는 뉘앙스를 살렸습니다.
- source_word: ዕርቃነ፡ ክሳዱ / bare part of his neck
  english_pob_choice: the bare part of his neck
  chosen_korean: 목의 벌거벗은 부분
  alternatives_korean:
  - 목의 드러난 부분
  - 목덜미의 맨살
  lexicon: bare/uncovered
  rationale: 문자적으로 ‘드러나 가려지지 않은 부위’를 유지하되, 한국어에서 이해가 쉬운 표현으로 옮겼습니다.
- source_word: መሓስአ፡ ጠሊ / skins of the young kids
  english_pob_choice: the skins of the young kids
  chosen_korean: 어린 염소 새끼의 가죽
  alternatives_korean:
  - 어린 염소 새끼들의 가죽
  - 새끼 염소의 가죽
  lexicon: skins / young kids
  rationale: 복수의 가죽이라는 점을 유지하면서도, 한국어에서는 자연스럽게 집합적으로 읽히는 표현을 택했습니다.
theological_decisions:
- issue: 에서의 옷을 ‘귀한/좋아하는’ 옷으로 옮기는 방식
  chosen_reading: 이 본문은 에서의 옷이 단순한 일상복이 아니라, 야곱의 신분을 바꾸어 보이게 하는 데 쓰인 특별한 옷이라는 점을 드러냅니다.
  alternative_readings:
  - ‘귀한 옷’으로 단순화
  - ‘사랑받는 옷’으로 감정 중심 번역
  rationale: 게으르게 일반화하면 서사적 대비가 약해지므로, 의복의 가치와 선별성을 함께 보여 주는 번역을 택했습니다.
  doctrine_reference: 서사 문맥의 표지성과 신분 전도
- issue: 가죽을 손과 목에 놓는 행위
  chosen_reading: 야곱을 에서로 속이기 위한 외형적 분장을 구체적으로 묘사하는 표현을 그대로 살렸습니다.
  alternative_readings:
  - 비유적으로 완화하여 번역
  - 행동의 잔혹성을 낮춰 표현
  rationale: 본문의 긴장과 속임수의 시각적 효과를 약화하지 않기 위해, 구체적 신체 부위를 직접 옮겼습니다.
  doctrine_reference: 본문의 서사적 사실성
