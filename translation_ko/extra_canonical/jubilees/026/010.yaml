revisions:
- from: 그리고 리브가가 집에 있던 큰아들 에서의, 곧 좋아하고 귀히 여겨진 옷을 가져다가 작은아들 야곱에게 입혔습니다. 또 어린 염소 새끼의 가죽을 그의 손에, 그리고 목의 벌거벗은 부분에 놓았습니다.[a]
  to: 리브가가 집에 있던 큰아들 에서의 아름답고 탐스러운 옷을 가져다가 작은아들 야곱에게 입혔습니다. 또 어린 염소 새끼들의 가죽을 야곱의 손과 목의 드러난 부분에 덮었습니다.
  rationale: 문장 첫머리의 ‘그리고’는 절 단위 번역에서 필수적이지 않아 생략하고 자연스러운 한국어 문장으로 정리했습니다. 의복의 이중 수식은 ‘아름답고 탐스러운’으로 옮겨 원문의 선호·가치의 뉘앙스를 보존했습니다. 신체 부위는 ‘목의 드러난 부분’으로, 가죽을 적용한 행위는 ‘덮었습니다’로 표현했습니다. 이전 영어 오독에 관한 각주는 번역상 필요하지 않아 삭제했습니다.
  reviewer_model: gpt-5.6-terra
