translation:
  language: ko
  text: “네 놀이로부터, 내 아들아, 내 영혼이 너를 축복하게 하려는 것이다.” 그리고 그는 그것을 그에게 가까이 가져갔고, 그가 먹었습니다. 그리고 그는 그를 그에게 데려왔습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምዘ፡ አደንከ፡
  english_pob_choice: from your game
  chosen_korean: “네 놀이로부터”
  alternatives_korean:
  - “네 사냥으로부터”
  - “네 들짐승 잡은 것으로부터”
  lexicon: Charles 1895; English POB audit trail
  rationale: Geʿez አደንከ፡는 포획·사냥과 관련된 행위를 가리키므로, 문맥상 자연스러운 의미를 살려 ‘네 놀이로부터’라고 옮겼습니다. 다만 한국어에서는 다소 낯설 수 있어, 전통적 의미의 ‘사냥’도 가능한 대안으로 남깁니다.
- source_word: ወልድየ፡
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 내 아가
  lexicon: Geʿez direct address
  rationale: 호격적 직접 부름이므로 ‘내 아들아’로 처리해 원문의 대화 감각을 살렸습니다.
- source_word: ከመ፡ ትባርከከ፡ ነፍስየ።
  english_pob_choice: so that my soul may bless you
  chosen_korean: 내 영혼이 너를 축복하게 하려는 것이다
  alternatives_korean:
  - 내 영혼이 너를 축복하도록
  - 내 영혼이 너를 축복할 수 있게 하려는 것이다
  lexicon: Geʿez direct sense; English POB
  rationale: 목적절 ከመ와 미완료형을 반영해 의도/목적을 나타내는 구조로 옮겼습니다. ‘영혼’은 원문의 ነፍስየ를 그대로 살렸습니다.
- source_word: ወአብአ፡ ሎቱ፡
  english_pob_choice: and he brought him
  chosen_korean: 그리고 그는 그를 그에게 데려왔습니다
  alternatives_korean:
  - 그리고 그는 그것을 그에게 가져왔습니다
  - 그리고 그는 그것을 그에게 가져다주었습니다
  lexicon: English POB revision trail; Geʿez segmentation note
  rationale: 본문 분절상 다음 절의 목적어가 다음 절로 넘어간 것으로 보이므로, 여기서는 false object를 만들지 않고 목적어를 비워 두어 다음 절과 자연스럽게 이어지도록 했습니다.
theological_decisions:
- issue: ‘soul’(ነፍስ) 표현의 처리
  chosen_reading: ‘내 영혼’으로 직역해 축복의 주체가 말하는 인격적/내적 실재를 드러냈습니다.
  alternative_readings:
  - ‘내 마음’
  - ‘내 생명’
  rationale: 원문의 ነፍስ을 일반화하지 않고, 인물의 내적 존재를 직접 가리키는 표현을 유지하는 것이 문맥상 가장 충실합니다.
  doctrine_reference: 인간 내면에 대한 성서적 어휘의 직접성 유지
- issue: 마지막 절의 목적어 누락 처리
  chosen_reading: 현 절에서는 목적어를 보충하지 않고 ‘그를 그에게 데려왔습니다’로 남겼습니다.
  alternative_readings:
  - ‘그것을 그에게 데려왔습니다’
  - ‘그를 그에게 데려왔습니다’
  rationale: 영문 POB 주석이 지적하듯 대상 ‘포도주’는 다음 절로 넘어가 있으며, 현 절에 그것을 삽입하면 경계가 왜곡됩니다. 따라서 분절된 본문 구조를 보존했습니다.
  doctrine_reference: 본문 분절 보존 및 절 경계 존중
