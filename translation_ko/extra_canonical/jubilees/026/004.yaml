  source_fidelity: 원문은 에서가 들판으로 나간 뒤의 완료된 행위들을 서술하기보다, 사냥하고 잡아 아버지에게 가져오려는 목적을 나타냅니다. 초안의 ‘사냥하고, 잡고, ... 가져갔습니다’는 그 목적 관계를 과거 완료 사건으로 바꾸므로 수정이 필요합니다. 중간의 ‘잡다’ 동작은 보존해야 합니다.
