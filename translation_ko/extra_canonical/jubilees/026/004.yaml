translation:
  language: ko
  text: 에서는 사냥하고 잡은 것을 아버지에게 가져오기 위해 들판으로 나갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገዳመ
  english_pob_choice: the open country
  chosen_korean: 들판
  alternatives_korean:
  - 열린 들
  - 벌판
  - 광야
  lexicon: ገዳመ
  rationale: 사냥하러 나간 장소를 자연스럽고 간결하게 나타내는 말로 ‘들판’을 택했습니다. ‘광야’는 너무 종교적·성서적 어감이 강해 여기서는 과도합니다.
- source_word: ያሥግር
  english_pob_choice: hunt
  chosen_korean: 사냥하고
  alternatives_korean:
  - 사냥하며
  - 짐승을 잡으러 가고
  lexicon: ሠገረ / 사냥 관련 동사군
  rationale: 행동의 목적과 문맥상 사냥 행위를 직접 드러내는 ‘사냥하고’가 가장 자연스럽습니다.
- source_word: ወየአንዝ
  english_pob_choice: catch
  chosen_korean: 잡고
  alternatives_korean:
  - 붙잡고
  - 포획하고
  - 사냥해
  lexicon: anaza
  rationale: 검토 기록이 이 동사를 ‘to catch’로 확정하므로, 사냥의 첫 동사와 구별되는 ‘잡고’로 옮겨 중간 동작을 살렸습니다.
- source_word: ወያምጽእ
  english_pob_choice: bring it to his father
  chosen_korean: 그것을 그의 아버지에게 가져갔습니다
  alternatives_korean:
  - 그것을 아버지에게 가져갔습니다
  - 그것을 아버지께 가져갔습니다
  lexicon: መጽአ
  rationale: 직역상 ‘가져오다/데려오다’의 방향성을 유지하되, 한국어 문맥에서 자연스럽게 ‘가져갔습니다’로 표현했습니다.
theological_decisions:
- issue: 사냥 동작의 연속을 어떻게 드러낼지
  chosen_reading: ‘사냥하고, 잡고, … 가져갔습니다’로 세 동작을 모두 분리해 표현했습니다.
  alternative_readings:
  - ‘사냥하여 아버지에게 가져갔습니다’처럼 압축
  - ‘사냥하여 그것을 잡아 아버지에게 가져갔습니다’처럼 결합
  rationale: 원문은 세 동작을 나열하며 중간 동사를 생략하지 않습니다. 따라서 한국어도 두 번째 동작을 별도로 보존해 서술의 긴장을 유지했습니다.
  doctrine_reference: source fidelity / lexical completeness
