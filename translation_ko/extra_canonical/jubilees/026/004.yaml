revisions:
- from: 그리고 에서우는 들판으로 나가 사냥하고, 잡고, 그것을 그의 아버지에게 가져갔습니다.[a]
  to: 에서는 사냥하고 잡은 것을 아버지에게 가져오기 위해 들판으로 나갔습니다.
  rationale: 사냥·포획·가져옴의 세 행위를 모두 유지하면서, 원문의 목적 관계를 ‘가져오기 위해’로 재현했습니다. 함축된 목적어는 한국어의 자연스러운 연결을 위해 ‘사냥하고 잡은 것’으로 표현했으며, 근거 없는 해석을 추가하지 않았습니다. 영어 감사 기록의 ‘catch’ 판단도 ‘잡은’으로 반영했습니다. 원문이나 영어 기준 본문에 대응하는 번역상 이문이 없으므로 각주 표지는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:00Z'
