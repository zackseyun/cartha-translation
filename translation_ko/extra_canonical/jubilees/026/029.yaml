  source_fidelity: ‘그의 모든 씨도 영원히 그러할 것입니다’는 앞선 ‘복을 받을 것’이라는 술어를 보충하여 이해하게 하지만, 원문의 축복 술어가 그와 그의 모든 씨 모두에 직접 적용된다는 점을 한국어 문장에서도 명시하는 편이 더 충실합니다. ‘그리고 에서가 … 들었을 때,’는 원문의 서사적 시간절을 보존합니다.
  naturalness: ‘영원히 그러할 것입니다’는 무엇이 영원히 지속되는지 다소 우회적으로 들립니다. ‘그와 그의 모든 씨가 영원히 복을 받을 것입니다’가 현대 표준 한국어의 합쇼체에서 더 명료하고 자연스럽습니다. 절 끝의 쉼표는 다음 절로 이어지는 원문상의 미완 시간절을 반영합니다.
  terminology: ‘씨’는 혈통적·계승적 의미를 지닌 원문의 직역어로 유지할 수 있습니다. ‘복을 받을 것입니다’는 축복 선언을 자연스럽고 비교적 직역적으로 전달합니다. 인명 ‘에서’, ‘이삭’도 표준 표기를 따릅니다.
