  chosen_korean: 내 아들아, 내가 네게 명하는 바를 듣거라
  alternatives_korean:
  - 내 아들아, 내가 네게 명령하는 것을 들어라
  - 내 아들아, 내 말을 들으라
  lexicon: 명령/청취 표현
  rationale: ‘듣다’와 ‘명하다’의 관계를 살려, 단순 청취가 아니라 순종을 요구하는 어조를 반영했습니다.
- source_word: መርዔትከ፡ ... ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ
  english_pob_choice: go to your flock and take for me two good young goats
  chosen_korean: 네 양 떼에게 가서, 좋은 염소 새끼 두 마리를 나를 위해 가져오너라
  alternatives_korean:
  - 네 떼로 가서 좋은 어린 염소 두 마리를 가져오너라
  - 네 양 떼에서 좋은 염소 두 마리를 가져오너라
  lexicon: 가축/희생 동물
  rationale: Geez의 መርዔት은 떼/양 떼를 가리키므로 ‘양 떼’로, መሓስአ ጠሊ ሠናያነ은 어린 염소를 뜻하므로 POB의 수정된 ‘young goats’에 맞추어 ‘염소 새끼’로 옮겼습니다.
- source_word: ይባርከ፡ ቅድመ፡ እግዚአብሔር
  english_pob_choice: he will bless you before the LORD
  chosen_korean: 아버지께서 잡수시고, 죽기 전에 야훼 앞에서 너를 축복하실 것이며
  alternatives_korean:
  - 아버지께서 먹으시고, 야훼 앞에서 너를 축복하실 것이며
  - 아버지께서 야훼 앞에서 너를 축복하실 것이며
  lexicon: 여호와/야훼 표기
  rationale: 원문의 እግዚአብሔር은 야훼를 가리키므로 프로젝트 기본어인 ‘야훼’를 사용했고, ‘before’는 ‘앞에서’로 직역했습니다.
theological_decisions:
- issue: 제사적 축복의 효력과 시점
  chosen_reading: 아버지가 음식을 드신 뒤, 죽기 전에 야훼 앞에서 야곱을 축복하는 구체적 서술을 그대로 살렸습니다.
  alternative_readings:
  - 축복의 종교적 의미를 약화시켜 일반적 격려로 옮김
  - ‘before the LORD’를 생략하거나 완화함
  rationale: 본절은 단순한 가족 대화가 아니라, 식사와 축복이 야훼 앞에서 이루어지는 언약적 장면이므로 그 종교적 무게를 보존해야 합니다.
  doctrine_reference: 창세기 27장의 축복 서사 및 야훼 앞에서의 언약적 축복
