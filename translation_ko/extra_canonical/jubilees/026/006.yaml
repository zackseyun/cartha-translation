  text: 'And now, my son, listen to my voice in what I command you: go to your flock and take for me two good young goats, and I will prepare them as food for your father, such as he loves, and you shall bring it to your father, and he will eat, and he will bless you before the LORD before he dies, and you shall be blessed.”'
translation:
  language: ko
  text: “이제 내 아들아, 내가 네게 명하는 바를 듣거라. 네 양 떼에게 가서, 좋은 염소 새끼 두 마리를 나를 위해 가져오너라. 그러면 내가 그것들을 네 아버지가 좋아하는 음식으로 만들어 드리겠다. 너는 그것을 네 아버지께 가져다 드려라. 그러면 아버지께서 잡수시고, 죽기 전에 야훼 앞에서 너를 축복하실 것이며, 너도 복을 받을 것이다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒኬ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
