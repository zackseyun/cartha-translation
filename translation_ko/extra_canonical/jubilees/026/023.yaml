translation:
  language: ko
  text: 주께서 복 주신 가득 찬 [들]입니다. 주께서 하늘의 이슬과 땅의 이슬[23]을 당신에게 주시고 당신을 번성하게 하시며, 곡식과 기름을 풍성하게 당신에게 더해 주시고, 그들이 당신을 섬기게 하시기를 빕니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '23'
    text: ‘땅의 이슬’로 옮긴 표현은 특이합니다. 어떤 독자는 창세기의 표현에 따라 ‘땅의 기름짐’을 예상할 수 있으나, 여기서는 조화시키지 않고 게으즈어 본문을 따랐습니다.
    reason: alternative_reading
