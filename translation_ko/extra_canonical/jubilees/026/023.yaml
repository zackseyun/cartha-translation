translation:
  language: ko
  text: 충만한 들이니, 주께서 복 주신 것입니다. 그리고 주께서 하늘의 이슬과 땅의 이슬에서 당신에게 주시고—당신을 번성하게 하시며—곡식과 기름의 풍성함으로 당신을 번성하게 하시며, 그들이 당신을 섬기게 하십니다.[23]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምሉእ
  english_pob_choice: full
  chosen_korean: 충만한
  alternatives_korean:
  - 가득 찬
  - 충분한
  - 온전한
  lexicon: Geez ምሉእ
  rationale: 문맥상 앞절의 밭/들판을 수식하는 상태 표현이므로 ‘복된’처럼 의미를 보태지 않고, 형태를 살려 ‘충만한’으로 옮겼습니다.
- source_word: ዘባረኮ፡ እግዚአብሔር
  english_pob_choice: which the LORD has blessed
  chosen_korean: 주께서 복 주신 것입니다
  alternatives_korean:
  - 야훼께서 복 주신 것입니다
  - 주께서 축복하신 것입니다
  lexicon: Geez divine formula with እግዚአብሔር
  rationale: 본문의 신명칭은 한국어 관례상 ‘주’로 처리하되, 동사는 직역에 가깝게 ‘복 주다’로 유지해 원문의 선언문을 살렸습니다.
- source_word: ወያብዝኅከ፡ እምጠለ፡ ሰማይ፡ ወእም'ጠለ፡ ምድር፡
  english_pob_choice: and multiply you—from the dew of heaven and from the dew of the earth
  chosen_korean: 하늘의 이슬과 땅의 이슬에서 당신에게 주시고—당신을 번성하게 하시며
  alternatives_korean:
  - 하늘의 이슬과 땅의 이슬로 당신을 번성하게 하시며
  - 하늘의 이슬과 땅의 이슬에서 당신에게 주시고
  lexicon: Geez prepositional phrase and verbal sequence
  rationale: ‘땅의 비옥함’으로 맞추지 않고, 게으즈의 특이한 표현인 ‘땅의 이슬’을 그대로 살렸습니다. ‘주시고’와 ‘번성하게 하시며’를 분리해 번역하면 원문의 나열과 강조를 드러낼 수 있습니다.
- source_word: ይትቀነዩ፡ ለከ
  english_pob_choice: Let them serve you
  chosen_korean: 그들이 당신을 섬기게 하십니다
  alternatives_korean:
  - 그들이 당신을 섬기게 하십시오
  - 그들이 당신을 섬깁니다
  lexicon: Geez passive/jussive serving clause
  rationale: 게으즈 본문에는 ‘민족들/백성들’이라는 주어가 없으므로, 영어의 보충을 따르지 않고 대명사적 ‘그들’로만 처리했습니다.
theological_decisions:
- issue: ‘주’와 야훼 표기의 처리
  chosen_reading: 본문에는 한국어 관례에 따라 ‘주’를 사용했습니다.
  alternative_readings:
  - 야훼
  - 주님
  rationale: 게으즈 원문이 እግዚአብሔር을 사용하지만, 이 문맥은 개인적 직접호칭이 아니라 축복 선언이므로 합쇼체의 자연스러운 본문 낭독을 우선해 ‘주’로 옮겼습니다.
  doctrine_reference: 신명칭 번역 원칙
- issue: Genesis 27:29과의 평행구에서의 보충 자제
  chosen_reading: ‘백성들/민족들’은 넣지 않고 ‘그들’로 유지했습니다.
  alternative_readings:
  - 백성들이 당신을 섬기게 하십니다
  - 민족들이 당신을 섬기게 하십니다
  rationale: 영어 POB의 최종 수정과 게으즈 본문 모두 명시적 복수 주어를 제시하지 않으므로, 평행본문에 끌려 의미를 확장하지 않는 것이 더 충실합니다.
  doctrine_reference: 본문비평 및 평행본문 처리 원칙
