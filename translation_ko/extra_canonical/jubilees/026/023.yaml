    rationale: ‘충만한 들이니’는 자연스러운 현대어가 아닙니다. 본문이 전절의 ‘들’을 이어받는 단편임을 대괄호로 표시한 ‘가득 찬 [들]’이 의미 보충을 최소화하면서 더 명료합니다.
