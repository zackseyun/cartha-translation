revisions:
- from: 충만한 들이니, 주께서 복 주신 것입니다. 그리고 주께서 하늘의 이슬과 땅의 이슬에서 당신에게 주시고—당신을 번성하게 하시며—곡식과 기름의 풍성함으로 당신을 번성하게 하시며, 그들이 당신을 섬기게 하십니다.[23]
  to: 주께서 복 주신 가득 찬 [들]입니다. 주께서 하늘의 이슬과 땅의 이슬[23]을 당신에게 주시고 당신을 번성하게 하시며, 곡식과 기름을 풍성하게 당신에게 더해 주시고, 그들이 당신을 섬기게 하시기를 빕니다.
  rationale: 원문의 축원 형식과 병렬 구조를 유지하되, 곡식과 기름의 풍성함을 수신자의 번성과 혼동하지 않도록 바로잡았습니다. ‘땅의 이슬’은 그대로 보존하고 각주를 해당 표현에 연결했습니다. 마지막 절에는 게으즈어에 없는 ‘백성들’이나 ‘민족들’을 보충하지 않았습니다.
  reviewer_model: gpt-5.6-terra
