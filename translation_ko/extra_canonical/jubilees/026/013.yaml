  text: And Isaac said to his son, “How is it that you found it so quickly, my son?”
translation:
  language: ko
  text: 이삭이 자기 아들에게 말했습니다. “내 아들아, 어떻게 이렇게 빨리 그것을 찾았습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይቤሎ፡ ይስሐቅ፡ ለወልዱ፡
  english_pob_choice: And Isaac said to his son
  chosen_korean: 이삭이 자기 아들에게 말했습니다
  alternatives_korean:
  - 이삭이 그의 아들에게 말했습니다
  - 이삭이 아들에게 말했습니다
  lexicon: 직설 화법
  rationale: 게으즈 원문은 단순히 ‘말하다’와 ‘그의 아들’이라는 관계를 표시하므로, 자연스러운 현대 한국어로 소유 관계를 명시해 오해를 줄이되 의미를 과장하지 않았습니다.
- source_word: ም*ንተ፡ ከመዝ፡
  english_pob_choice: How is it that
  chosen_korean: 어떻게 이렇게
  alternatives_korean:
  - 어찌하여 이렇게
  - 어떻게
  lexicon: 의문문
  rationale: 원문의 놀람 섞인 물음은 원인 질문보다 결과에 대한 놀라움에 가깝기 때문에, ‘어떻게 이렇게’로 자연스럽게 옮겼습니다.
- source_word: አፍጠንከ፡
  english_pob_choice: you found it so quickly
  chosen_korean: 그것을 찾았느냐
  alternatives_korean:
  - 그것을 그렇게 빨리 찾았느냐
  - 그것을 아주 빨리 찾았느냐
  lexicon: 속도 표현
  rationale: 영어 POB의 ‘so quickly’를 반영하되, 게으즈 동사의 핵심 의미는 ‘찾다/얻다’이므로 본문에는 간결하게 ‘찾았느냐’로 두고 속도감은 앞의 ‘어떻게 이렇게’가 담당하게 했습니다.
- source_word: ወልድየ።
  english_pob_choice: my son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 내 아들아,
  - 아들아
  lexicon: 호칭
  rationale: 게으즈의 친밀한 직접 호칭을 살려 한국어 호격 ‘-아’를 사용했고, 번역체가 되지 않도록 문장 흐름에 맞게 배치했습니다.
