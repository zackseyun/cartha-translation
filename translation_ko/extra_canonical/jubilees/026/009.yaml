revisions:
- from: 야곱은 자기 어머니 리브가의 말을 듣고, 가서 좋은 염소 새끼 두 마리를 가져다가 어머니에게 가져왔습니다. 그의 어머니는 그것을, 그가 좋아하는 음식으로 준비했습니다.[a]
  to: 야곱은 자기 어머니 리브가의 말을 듣고 가서 좋고 살진 염소 새끼 두 마리를 잡아 어머니에게 가져왔습니다. 그의 어머니는 그것들을 그가 좋아하는 음식으로 준비했습니다.
  rationale: 원문의 ‘good, fat young goats’를 ‘좋고 살진 염소 새끼 두 마리’로 완전하게 반영하고, 복수 대상을 ‘그것들을’로 바로잡았습니다. ‘그가 좋아하는’은 원문과 영어 감사 기록에 있는 남성 단수 지시의 문맥상 여지를 불필요하게 특정하지 않고 유지합니다. 불필요한 [a] 표지는 제공된 각주 내용이 없으므로 حذف했습니다.
