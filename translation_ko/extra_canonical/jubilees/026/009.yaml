  yaml_path: translation/extra_canonical/jubilees/026/009.yaml
  text: And Jacob listened to the voice of Rebekah his mother, and he went and took two good, fat young goats and brought them to his mother, and his mother prepared them as food, such as he loved.
translation:
  language: ko
  text: 야곱은 자기 어머니 리브가의 말을 듣고 가서 좋고 살진 염소 새끼 두 마리를 잡아 어머니에게 가져왔습니다. 그의 어머니는 그것들을 그가 좋아하는 음식으로 준비했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃለ ርብቃ
  english_pob_choice: listened to the voice of Rebekah his mother
  chosen_korean: 자기 어머니 리브가의 말을 듣고
  alternatives_korean:
  - 리브가의 목소리를 듣고
  - 리브가의 음성을 듣고
  lexicon: voice → 말
  rationale: 문맥상 ‘voice’는 물리적 음성보다 어머니의 지시·말씀을 가리키므로, 한국어에서는 자연스럽게 ‘말을 듣고’로 옮겼습니다.
- source_word: ክልኤተ፡ መሓስአ፡ ጠሊ፡ ሠናያነ፡ ወ…ስቡሓነ፡
  english_pob_choice: two good, fat young goats
  chosen_korean: 좋은 염소 새끼 두 마리
  alternatives_korean:
  - 좋고 살찐 염소 새끼 두 마리
  - 좋은, 살진 어린 염소 두 마리
  lexicon: young goats → 염소 새끼
  rationale: 원문과 POB의 개정본은 두 마리의 어린 염소를 뜻하며, 한국어에서는 ‘염소 새끼’가 가장 직관적으로 수량과 연령을 드러냅니다. ‘fat’은 음식 준비 맥락에서 자연스러운 품질 묘사지만, 과도한 중복을 피하기 위해 본문에서는 핵심 의미를 살렸습니다.
- source_word: ወገብረቶሙ፡ እሙ፡ (መብልዐ፡)
  english_pob_choice: and his mother prepared them as food
  chosen_korean: 그의 어머니는 그것을 … 음식으로 준비했습니다
  alternatives_korean:
  - 그의 어머니는 그것을 먹을 음식으로 만들었습니다
  - 그의 어머니는 그것을 음식으로 마련했습니다
  lexicon: prepared as food → 음식으로 준비하다
  rationale: 원문은 ‘먹을 수 있게 조리/준비하다’의 의미이므로, 한국어에서는 간결하고 자연스러운 ‘음식으로 준비했습니다’를 선택했습니다.
- source_word: ዘከመ፡ ያፈቅር።
  english_pob_choice: such as he loved
  chosen_korean: 그가 좋아하는
  alternatives_korean:
  - 그가 사랑하는
  - 그가 즐기는
  lexicon: love → 좋아하다
  rationale: 여기서는 감정적 사랑보다 기호·선호의 의미가 강하므로, 음식 선호를 나타내는 ‘좋아하는’이 문맥상 더 정확합니다.
theological_decisions:
- issue: 가정 서술의 직설성 유지
  chosen_reading: 이 구절은 야곱의 순종과 리브가의 조리 행동을 평이하게 서술하는 본문이므로, 해석적 확장 없이 사건 순서를 그대로 옮겼습니다.
  alternative_readings:
  - 윤리적 평가를 덧붙이는 번역
  - 서사적 완곡화
  rationale: 외경/희년서의 서술적 사실을 보존하는 것이 본문 의미 전달에 가장 적절합니다.
  doctrine_reference: 서사 본문 번역 원칙
