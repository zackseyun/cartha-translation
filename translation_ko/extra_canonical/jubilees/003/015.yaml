  text: And in the first week of the first jubilee, Adam and his wife were in the garden of Eden for seven years, tilling and keeping it.
translation:
  language: ko
  text: 그리고 첫째 희년의 첫째 주간에 아담과 그의 아내는 에덴 동산에서 칠 년을 지내며 그것을 가꾸고 지켰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለእስራኤል፡ ይዕቀቡ፡ ኵሎ፡ መዋዕለ።
  english_pob_choice: And ... were ... for seven years, tilling and keeping it
  chosen_korean: “칠 년을 지내며”
  alternatives_korean:
  - “칠 년 동안”
  - “일곱 해 동안”
  lexicon: 기간 표현
  rationale: 게으르기 쉬운 연대 표현을 한국어에서 자연스럽게 풀어, 앞뒤 동작(가꾸고 지키다)과 연결되는 체류 기간임을 분명히 했습니다.
- source_word: ውስተ፡ ገነት፡'' ኤዶም፡
  english_pob_choice: in the garden of Eden
  chosen_korean: “에덴 동산에서”
  alternatives_korean:
  - “에덴의 동산에서”
  - “에덴에 있는 동산에서”
  lexicon: 고유명사+지명구
  rationale: 기존 한국어 성경 관용에 가까운 ‘에덴 동산’을 쓰되, 장소 전치사 ‘에서’로 문장 구조를 자연스럽게 살렸습니다.
- source_word: እንዘ፡ ይትቀነይ፡ ወየዐቅብ።
  english_pob_choice: tilling and keeping it
  chosen_korean: “가꾸고 지켰습니다”
  alternatives_korean:
  - “경작하고 돌보았습니다”
  - “일구고 지켰습니다”
  lexicon: 동작 동사
  rationale: ‘tilling’의 경작·가꿈 의미와 ‘keeping’의 보호·관리 의미를 모두 살리되, 한국어에서 가장 읽기 자연스러운 동사쌍으로 옮겼습니다.
theological_decisions:
- issue: 희년·첫째 주간의 시간 구조를 어떻게 드러낼지
  chosen_reading: 서술어를 단순한 과거 진행이 아니라, ‘첫째 희년의 첫째 주간’이라는 연대 표지를 문장 앞에 두어 본문의 시간 질서를 그대로 보이게 했습니다.
  alternative_readings:
  - “첫째 희년의 첫째 주에”
  - “첫 번째 희년의 첫째 주간에”
  rationale: 본문은 연대 계산을 강조하므로, 시간 표지를 앞세워 독자가 창조 질서와 아담의 에덴 체류 기간을 바로 연결하도록 했습니다.
  doctrine_reference: 본문의 역사-연대 서술
- issue: ‘지키다’의 의미를 단순 보존으로 약화시키지 않음
  chosen_reading: ‘가꾸고 지켰습니다’로 옮겨, 인간에게 맡겨진 에덴의 적극적 관리와 보호 책임을 함께 드러냈습니다.
  alternative_readings:
  - “경작하고 보살폈습니다”
  - “일구고 지켰습니다”
  rationale: 본문의 두 동사는 단순한 관찰이 아니라 맡겨진 창조 세계에 대한 적극적 책임을 나타내므로, 관리와 보호의 양면을 살렸습니다.
  doctrine_reference: 창세기 2장에 대한 창조 청지기 책임
