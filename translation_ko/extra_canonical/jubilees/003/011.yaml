  source_fidelity: 본문은 남자아이와 여자아이의 경우를 구분하고, 여자아이의 경우 ‘처음 두 주와 같이’ 두 주 및 정결의 피 가운데서 육십육 일을 지내도록 한다는 핵심을 대체로 반영합니다. 그러나 ‘남자아이를 위해’는 출산한 남자아이를 위한 목적처럼 들릴 수 있어, 규례가 적용되는 경우를 나타내는 표현으로 고치는 것이 더 정확합니다.
