- from: 그녀가 남자아이를 위해 이 날들을 마칠 때까지입니다. 그러나 여자아이의 경우에는 부정함 가운데 첫 이 주와 같이 두 주이며, 그녀는 자기 정결의 피 가운데서 육십육 일을 지내야 합니다.[a][b]
  to: 그녀가 남자아이의 경우에 정해진 이 날들을 마칠 때까지입니다. 그러나 여자아이의 경우에는, 그녀의 부정함 가운데 처음 두 주와 같은 두 주 동안 지내고, 그녀의 정결의 피 가운데서 육십육 일을 지내야 합니다.
