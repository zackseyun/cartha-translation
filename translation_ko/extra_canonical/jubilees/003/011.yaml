  text: until she completes these days for a male. But for a female, two weeks, like the first two weeks, in her uncleanness, and sixty-six days she shall remain in the blood of her purification.
translation:
  language: ko
  text: 그녀가 남자아이의 경우에 정해진 이 날들을 마칠 때까지입니다. 그러나 여자아이의 경우에는, 그녀의 부정함 가운데 처음 두 주와 같은 두 주 동안 지내고, 그녀의 정결의 피 가운데서 육십육 일을 지내야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትፈጽም፡ ዘንተ፡ መዋዕለ፡
  english_pob_choice: completes these days
  chosen_korean: 이 날들을 마칠 때까지입니다
  alternatives_korean:
  - 이 날들을 완수할 때까지입니다
  - 이 기간을 채울 때까지입니다
  lexicon: Leslau
  rationale: Geʿez의 ‘완성하다/마치다’ 계열을 자연스러운 한국어로 옮기되, 기간의 완료를 분명히 드러내기 위해 ‘마치다’를 선택했습니다.
- source_word: ለተባዕት / በተባዕት
  english_pob_choice: for a male
  chosen_korean: 남자아이를 위해
  alternatives_korean:
  - 남자아이를 위한
  - 남자아이에 대하여
  lexicon: Leslau
  rationale: 문맥상 출산 후 정결 규례의 남자아이 출산을 가리키므로, 한국어에서는 대상격을 살려 ‘남자아이를 위해’로 옮겼습니다.
- source_word: ዘበአንስት፡ ክልኤ፡ ሰቡዓተ፡
  english_pob_choice: for a female, two weeks
  chosen_korean: 여자아이의 경우에는 부정함 가운데 첫 이 주와 같이 두 주
  alternatives_korean:
  - 여자아이의 경우 두 주
  - 여자아이의 경우에는 두 주, 곧 첫 두 주와 같이
  lexicon: Leslau
  rationale: english POB의 ‘like the first two weeks’에 해당하는 비교 구문을 살려, 첫 두 주와의 대응성을 드러내는 방식으로 번역했습니다.
- source_word: በርኵሳ፡ ወስሳ፡ መዋዕለ፡
  english_pob_choice: in her uncleanness, ... in the blood of her purification
  chosen_korean: 부정함 가운데 ... 그녀는 자기 정결의 피 가운데서
  alternatives_korean:
  - 그녀의 부정함 가운데
  - 그녀의 정결의 피 가운데서
  lexicon: Leslau
  rationale: 소스의 3인칭 여성 단수 소유접미사(‘her’)를 반영해 ‘그녀의/자기’로 표현했고, 규례 문맥의 상태를 나타내는 ‘부정함’과 ‘정결의 피’를 대응시켰습니다.
- source_word: ክልኤ፡ ሰቡዓተ፡ / ሰቡዓተ
  english_pob_choice: two weeks
  chosen_korean: 두 주
  alternatives_korean:
  - 두 주간
  - 두 번의 일주일
  lexicon: Leslau
  rationale: Leslau 주석과 POB의 판단을 따라, 문자적 ‘일곱들’이 아니라 규례 문맥의 기간 단위인 ‘주’로 옮겼습니다.
theological_decisions:
- issue: 정결 규례의 성별 구분을 어떻게 재현할지
  chosen_reading: 남자아이와 여자아이에 대한 기간 차이를 그대로 드러내는 규정문으로 옮겼습니다.
  alternative_readings:
  - 보다 완화된 일반 서술로 바꾸는 방식
  - 현대적 평등어로 재구성하는 방식
  rationale: 본문은 특정 규례의 차이를 제시하므로, 그 구분을 희석하지 않고 원문이 말하는 바를 그대로 전달하는 것이 필요합니다.
  doctrine_reference: 율법/정결 규례 본문 해석 원칙
- issue: ‘정결의 피’ 표현 유지
  chosen_reading: ‘자기 정결의 피’라는 직접적 표현을 유지했습니다.
  alternative_readings:
  - ‘정결해지는 기간’으로 의역하는 방식
  - ‘정결 의식’으로 완화하는 방식
  rationale: 소스는 ‘피’와 ‘정결’을 함께 말하므로, 이를 삭제하면 규례의 구체성과 긴장이 약화됩니다.
  doctrine_reference: 본문 충실성 원칙
