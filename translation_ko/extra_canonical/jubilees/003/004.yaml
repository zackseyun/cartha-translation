base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
  footnotes:
  - marker: a
    text: Or 'and made from it the woman'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 주께서 우리에게 말씀하셨습니다. "사람이 혼자 있는 것은 좋지 않습니다. 그와 같은 돕는 이를 그를 위하여 만들겠습니다." 주 하나님께서 그에게 깊은 잠이 들게 하시니, 그가 잠들었습니다. 그분은 그의 뼈들 가운데서 하나의 뼈를 가져다가 그 여자를 만드셨고, 그 뼈로 그 여자를 만드셨습니다. 그리고 그 자리에는 살을 지으셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሎቱ ... ዘይረድኦ ... ዘከማሁ
  english_pob_choice: a helper like him
  chosen_korean: 그와 같은 돕는 이
  alternatives_korean:
  - 그와 같은 도움을 주는 이
  - 그와 같은 조력자
  - 그와 같은 돕는 자
  lexicon: 돕다 / 돕는 이
  rationale: ‘돕는 이’는 관계적·인격적 의미를 살리면서도 ‘helper’를 자연스럽게 옮기며, ‘그와 같은’으로 원문의 상응성을 드러냅니다.
- source_word: እግዚአብሔር
  english_pob_choice: the Lord our God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주 우리 하나님
  - 주 우리의 하나님
  - 여호와 하나님
  lexicon: 주 / 하나님
  rationale: 본문의 호칭은 신적 주권을 드러내므로 ‘주 하나님’으로 옮기되, 문맥상 공동체적 호칭인 ‘우리’는 한국어에서 중복이 커 보여 본문에는 생략했습니다.
- source_word: ወነሥአ ... ዐጽመ፡ አሐደ ... ወይእቲ፡ ገቦ፡ ፍጥረት፡ ለብእሲት
  english_pob_choice: he took one bone from among his bones ... and made the woman from it
  chosen_korean: 그의 뼈들 가운데서 하나의 뼈를 가져다가 그 여자를 만드셨고, 그 뼈로 그 여자를 만드셨습니다
  alternatives_korean:
  - 그의 뼈들 가운데서 하나의 뼈를 가져다가 그 여자를 만드셨고, 그것으로 그 여자를 만드셨습니다
  - 그의 뼈들 중 하나를 가져다가 그 여자를 지으셨고, 그 뼈로 그 여자를 지으셨습니다
  - 그의 뼈들 가운데서 하나의 뼈를 취해 그 여자를 만드셨고, 그 뼈가 여자의 근원이었습니다
  lexicon: 뼈 / 만들다
  rationale: Ge'ez의 반복 구조(‘뼈들 가운데서 하나의 뼈’와 ‘그 뼈로’)를 유지했고, revision pass의 ‘bone’과 최종 source의 반복을 반영해 ‘뼈’로 직역했습니다.
- source_word: ሐነጸ፡ ሥጋ፡ ህየንቴሃ
  english_pob_choice: he built flesh in its place
  chosen_korean: 그 자리에는 살을 지으셨습니다
  alternatives_korean:
  - 그 자리에 살을 세우셨습니다
  - 그 대신 살을 지으셨습니다
  - 그 자리를 살로 메우셨습니다
  lexicon: 살 / 짓다
  rationale: ‘build’의 능동적 구성 이미지를 살리기 위해 ‘지으셨습니다’를 택했고, ‘in its place’는 자연스러운 한국어로 ‘그 자리에는’으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 화자 포함 표현 "우리에게"의 처리
  chosen_reading: '"사람이 혼자 있는 것은 좋지 않습니다" 앞에 ‘우리에게’가 포함된 직접 화법을 그대로 살렸습니다.'
  alternative_readings:
  - 직접 화법을 완화해 서술문으로 처리
  - ‘우리에게’ 없이 단순 인용으로 축약
  rationale: 원문과 EN POB가 모두 신적 발화를 공동체 수신 구조로 제시하므로, 한국어에서도 화자·수신자를 보존했습니다.
  doctrine_reference: 창조 서사 내 신적 의논 표현의 서술 방식
