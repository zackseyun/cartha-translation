  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
  footnotes:
  - marker: a
    text: 'The date is given precisely: second month, seventeenth day, after seven completed years in Eden. Jubilees regularly uses such chronology as part of its revelatory structure.'
    reason: cultural_note
    anchor_ref: '3:17'
  - marker: b
    text: Or 'twenty-six years which he had completed there, exactly twenty-seven years'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 자신과 자기 아내를 위해 지켜지고 있던 것을 보관했습니다. 그가 그곳에서 보낸 일곱 해가 끝났을 때, 곧 정확히 일곱 해가 지난 뒤, 둘째 달 열일곱째 날에[a] 뱀이 여자에게 다가와 말했습니다. “하나님께서 너희에게 ‘동산의 모든 나무에서 먹어서는 안 된다’고 명령하셨습니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 날짜는 그곳에서 일곱 해를 완전히 보낸 뒤의 둘째 달 열일곱째 날로 정확히 제시됩니다. 희년서는 이러한 연대 표지를 반복적으로 사용합니다.
    reason: 문화·문학적 주석; 본문의 정확한 연대 표지를 설명하며, 날짜 표현 바로 뒤에 연결했습니다.
