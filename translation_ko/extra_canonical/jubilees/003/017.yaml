  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
  footnotes:
  - marker: a
    text: 'The date is given precisely: second month, seventeenth day, after seven completed years in Eden. Jubilees regularly uses such chronology as part of its revelatory structure.'
    reason: cultural_note
    anchor_ref: '3:17'
  - marker: b
    text: Or 'twenty-six years which he had completed there, exactly twenty-seven years'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 자기와 자기 아내를 위해 이것을 저장해 두었습니다. 그리고 그가 그곳에서 보낸 일곱 해가 끝날 무렵, 곧 정확히 일곱 해째 되는 때, 둘째 달 열일곱째 날에 뱀이 여자에게 와서 다가와 말했습니다. 「하나님이 여러분에게 명하셔서, ‘너희는 동산의 모든 나무에서 먹어서는 안 된다’고 하셨습니까?」[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለብእሲቱ፡
  english_pob_choice: for himself and for his wife
  chosen_korean: 자기와 자기 아내를 위해
  alternatives_korean:
  - 자신과 자기 아내를 위해
  - 그와 그의 아내를 위해
  lexicon: 인칭대명사/소유 표현
  rationale: 원문과 EN POB가 모두 소유 목적을 분명히 하므로, 한국어에서는 자연스럽게 ‘자기와 자기 아내를 위해’로 옮겨 목적성을 살렸습니다.
- source_word: ወያነብር፡ ዘይትዐቀብ።
  english_pob_choice: and stored what was being kept
  chosen_korean: 이것을 저장해 두었습니다
  alternatives_korean:
  - 지켜지고 있던 것을 보관했습니다
  - 보존되고 있던 것을 간직했습니다
  lexicon: 동사구/대상 표현
  rationale: 직역하면 다소 어색하지만, 원문은 ‘보호·보존된 것’을 저장한다는 뜻이어서 한국어에서는 의미를 드러내되 과도한 해석 없이 ‘저장해 두었습니다’로 처리했습니다.
- source_word: ወኀሊቆ፡ ... ወበካልእ፡ ወርኅ፡ አመ፡ ...
  english_pob_choice: at the completion of ... in the second month, on the seventeenth day
  chosen_korean: 그가 그곳에서 보낸 일곱 해가 끝날 무렵, 곧 정확히 일곱 해째 되는 때, 둘째 달 열일곱째 날에
  alternatives_korean:
  - 그가 그곳에서 보낸 일곱 해가 끝났을 때, 둘째 달 열일곱째 날에
  - 일곱 해가 완전히 끝난 뒤, 둘째 달 열일곱째 날에
  lexicon: 시점 표현/연대기
  rationale: 에녹계 계열 문헌의 특징인 정밀한 연대 표지를 보존하기 위해, ‘끝날 무렵’과 ‘정확히 ... 되는 때’를 함께 살려 중복 강조를 반영했습니다.
- source_word: አርዌ፡ ምድር፡
  english_pob_choice: the serpent
  chosen_korean: 뱀
  alternatives_korean:
  - 그 뱀
  - 뱀뱀
  lexicon: 명사
  rationale: 본문의 표상은 창세기 전승의 ‘뱀’이므로 표준 한국어 성경 관용을 따르되, 불필요한 중복 수식을 피했습니다.
theological_decisions:
- issue: 하나님 발화의 직접화법에서 인칭과 예절 수준
  chosen_reading: 뱀의 질문은 직접 인용부호로 처리하고, 하나님의 말씀 인용은 ‘하나님이 여러분에게 명하셔서’로 옮겼습니다.
  alternative_readings:
  - 하나님이 너희에게 명하셔서
  - 하나님께서 여러분에게 명하셔서
  rationale: 원문이 직접 화법을 통해 유혹의 뉘앙스를 전달하므로, 한국어에서도 질문형 직인용을 유지했습니다. 하나님의 발화는 서술문 안에 인용이 겹치므로 합쇼체의 자연스러운 수준에서 존칭을 유지했습니다.
  doctrine_reference: 창세기 3장 전승의 유혹 대화 구조
