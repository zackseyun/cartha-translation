  alternative_readings:
  - 하나님이 너희에게 명하셔서
  - 하나님께서 여러분에게 명하셔서
  rationale: 원문이 직접 화법을 통해 유혹의 뉘앙스를 전달하므로, 한국어에서도 질문형 직인용을 유지했습니다. 하나님의 발화는 서술문 안에 인용이 겹치므로 합쇼체의 자연스러운 수준에서 존칭을 유지했습니다.
