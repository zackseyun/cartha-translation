  text: And Adam gave names to them all, each by its own name; and as he called them, so was their name.
translation:
  language: ko
  text: 아담은 그들 모두에게 각각 자기 이름대로 이름을 지어 주었습니다. 그가 그들을 부르는 대로, 그들의 이름이 그렇게 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא / gave names
  english_pob_choice: gave names
  chosen_korean: 이름을 지어 주었습니다
  alternatives_korean:
  - 이름을 붙였습니다
  - 이름을 주었습니다
  lexicon: קרא
  rationale: 히브리어 동사의 이름-부르기/지어 주기 의미를 살려, 단순히 부르는 행위보다 명명 행위를 드러내는 표현으로 옮겼습니다.
- source_word: לְכֻלָּם / to them all
  english_pob_choice: to them all
  chosen_korean: 그들 모두에게
  alternatives_korean:
  - 모든 것에게
  - 그것들 모두에게
  lexicon: כֹּל
  rationale: 본문은 사람보다 피조물 전체를 가리키는 문맥으로 이해되어, 대상의 총체성을 자연스럽게 드러내는 한국어로 옮겼습니다.
- source_word: בְּשֵׁמוֹ / each by its own name
  english_pob_choice: each by its own name
  chosen_korean: 각각 자기 이름대로
  alternatives_korean:
  - 각기 제 이름으로
  - 저마다 자기 이름으로
  lexicon: שֵׁם
  rationale: 각 대상에 고유한 이름이 부여되었다는 점을 살리기 위해 ‘자기 이름대로’로 옮겼습니다.
- source_word: כַּאֲשֶׁר / and as ... so was
  english_pob_choice: and as he called them, so was their name
  chosen_korean: 그가 그들을 부르는 대로, 그들의 이름이 그렇게 되었습니다
  alternatives_korean:
  - 그가 그들을 부른 대로 그 이름이 정해졌습니다
  - 그가 부르는 대로 그 이름이 되었습니다
  lexicon: כַּאֲשֶׁר
  rationale: 명명 행위와 결과의 일치라는 문장 구조를 보존하면서, 한국어에서 자연스러운 대응 구문으로 재구성했습니다.
theological_decisions:
- issue: 아담의 명명 행위의 의미
  chosen_reading: 아담이 피조물 각자에게 고유한 이름을 부여하는 창조 질서의 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 목록 작성
  - 상징적 지배 선언
  rationale: 문맥상 이름 짓기는 피조세계에 대한 질서 부여를 나타내며, 본문이 말하는 범위를 넘지 않도록 과도한 상징화를 피했습니다.
  doctrine_reference: 창조 질서와 인간의 청지기적 역할
