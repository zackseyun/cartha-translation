  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
  footnotes:
  - marker: a
    text: The chapter links Adam's and the woman's delayed entrance into Eden with later postpartum impurity periods for male and female births.
    reason: cross_reference
    anchor_ref: '3:8'
translation:
  language: ko
  text: 첫째 주에 아담이 창조되었고[a], 그리고 그의 아내인 갈빗대도 만들어졌습니다. 그리고 두 번째 주에 그는 그녀를 그에게 보여주었습니다. 그러므로 남자는 7일, 여자는 2주일을 불결하게 지키라는 명령이 주어졌습니다.
