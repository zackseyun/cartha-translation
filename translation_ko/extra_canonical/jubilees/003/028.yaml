    issue: ‘모든 육체’라는 표현
    rationale: 원문의 관용적 ‘all flesh’는 이 문맥에서 에덴에 있던 동물들을 포함한 모든 생물을 뜻합니다. 한국어 ‘모든 육체’는 신체나 육체성으로 읽히기 쉬워 의미 전달이 부정확해질 수 있습니다.
