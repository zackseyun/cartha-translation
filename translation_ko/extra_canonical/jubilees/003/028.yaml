  to: 그리고 그분께서는 에덴동산에 있던 모든 생물을 에덴동산에서 내보내셨습니다. 모든 생물은 각각 그 종류와 형태에 따라, 그들을 위하여 창조된 곳으로 흩어졌습니다.
