revisions:
- from: 그러므로 남자나 여자를 낳는 이에게 이 날들의 규례가 정하여졌습니다. 그는 거룩한 것은 아무것도 만지지 말고, 성소에도 들어가지 말아야 합니다. 그때까지는.[a]
  to: 그러므로 남자나 여자를 낳는 여자에 대하여 이 날들에 관한 규례가 정해졌습니다. 그 여자는 아무 거룩한 것도 만지지 말고 성소에도 들어가지 말아야 합니다. …까지.[a]
  rationale: 출산한 여성을 명시하여 지시 대상을 바로잡고, 절 끝의 미완결 ‘until’을 한국어의 의도적인 말줄임표와 주석으로 보존했습니다. 성소 및 거룩한 것이라는 의식 용어는 유지했습니다.
  reviewer_model: gpt-5.6-terra
