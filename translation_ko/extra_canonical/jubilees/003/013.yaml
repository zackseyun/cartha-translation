  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: ko
  text: 그러므로 남자나 여자를 낳는 이에게 이 날들의 규례가 정하여졌습니다. 그는 거룩한 것은 아무것도 만지지 말고, 성소에도 들어가지 말아야 합니다. 그때까지는.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ፡ ተሠርዐ፡
  english_pob_choice: was ordained
  chosen_korean: 정하여졌습니다
  alternatives_korean:
  - 규정되었습니다
  - 제정되었습니다
  lexicon: N/A
  rationale: 게에즈의 수동 표현과 English POB의 ‘was ordained’를 따라, 법적·의식적 규례가 공적으로 정해졌다는 뜻을 자연스럽게 살렸습니다.
- source_word: ለእኅተ፡ ትውልድ፡ ለተባዕት፡ ወለአንስት፡
  english_pob_choice: for her who bears a male or a female
  chosen_korean: 남자나 여자를 낳는 이에게
  alternatives_korean:
  - 아들을 낳든 딸을 낳든 하는 여자에게
  - 남자 아이나 여자 아이를 낳는 여인에게
  lexicon: N/A
  rationale: ‘bears a male or a female’의 생물학적 출산 표현을 직접 반영하되, 한국어에서 가장 자연스러운 문장 구조로 옮겼습니다.
- source_word: ቅዱስ።
  english_pob_choice: holy
  chosen_korean: 거룩한
  alternatives_korean:
  - 성한
  - 성물인
  lexicon: N/A
  rationale: 의식적으로 구별된 것이라는 일반적 성스러움의 의미를 살려 ‘거룩한’으로 옮겼습니다.
- source_word: መቅደስ
  english_pob_choice: sanctuary
  chosen_korean: 성소
  alternatives_korean:
  - 성전
  - 거룩한 곳
  lexicon: N/A
  rationale: 본문의 장소는 성전 일반이 아니라 성소에 해당하므로, 더 구체적인 ‘성소’를 선택했습니다.
theological_decisions:
- issue: 의식적 부정함에 따른 출입 제한의 지속성
  chosen_reading: 마지막을 ‘그때까지는’으로 끝내어, 다음 절로 이어지는 기간 제한이 아직 완료되지 않았음을 드러냈습니다.
  alternative_readings:
  - 문장을 완결형으로 마감하기
  - ‘기한이 찰 때까지’로 보완하기
  rationale: 영어 POB도 끝을 미완결 구문으로 남겨 다음 절과의 연결을 보존하므로, 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: 레 12장 정결 규례의 연속성
