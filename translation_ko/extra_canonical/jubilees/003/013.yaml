  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: ko
  text: 그러므로 남자나 여자를 낳는 여자에 대하여 이 날들에 관한 규례가 정해졌습니다. 그 여자는 아무 거룩한 것도 만지지 말고 성소에도 들어가지 말아야 합니다. …까지.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문장은 다음 절에서 기간을 밝히며 이어집니다.
    reason: 원문이 ‘until’로 끝나는 미완결 구문임을 한국어 독자에게 분명히 하면서, 기간의 내용을 이 절에 보충하지 않기 위함입니다.
