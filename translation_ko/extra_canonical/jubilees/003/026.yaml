    anchor_ref: '3:26'
translation:
  language: ko
  text: 아담이 동산에서 나온 그 날, 곧 그가 자기의 부끄러움을 가린 날부터, 그는 해가 떠오르는 아침에 유향과 풍자향과 소합향과 향료를 피워 향기로운 향을 드렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
