  source_fidelity: 초안은 아담의 동산 퇴장, 아침 해돋이, 향기로운 향이라는 큰 틀은 반영합니다. 그러나 ‘사랐더라’는 명백한 오기이며, 향료 명칭 가운데 ‘풍향’은 갈바눔/풍자향을 잘못 옮긴 것으로 보입니다. 또한 원문의 향료 열거와 ‘부끄러움을 가린 날부터’라는 시간 표현을 더 분명히 반영해야 합니다.
  naturalness: 현대 표준어 합쇼체에 맞추어 ‘피워 향기로운 향을 드렸습니다’로 다듬었습니다. ‘그 날부터’는 문맥상 다소 난해하지만, 원문의 표현을 보존하기 위해 유지하되 문장 안에서 자연스럽게 배치했습니다.
  terminology: 유향, 풍자향(갈바눔), 소합향(스타크테), 향료를 사용했습니다. ‘소합향’과 ‘풍자향’은 한국어 성서 전통에서 널리 쓰이는 향료 용어이며, 음역만으로 처리하는 것보다 독자에게 자연스럽습니다. 원문 전승상 향료 목록의 세부 식별에는 어려움이 있으므로 각주로 밝혔습니다.
