  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: ko
  text: 아담이 먹었고, 그의 눈이 열렸으며, 자신이 벌거벗은 것을 보았습니다. 그는 무화과나무 잎을 가져다가 꿰매어 자신을 위한 가리개를 만들고, 자신의 수치를 가렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ
  english_pob_choice: And he ate
  chosen_korean: 그가 먹었고
  alternatives_korean:
  - 그가 먹었습니다
  - 먹었고
  lexicon: Geez በልዐ
  rationale: 원문과 개정된 POB 영어 모두 시작 동작을 분명히 포함하므로, 서술 연결을 살려 ‘먹었고’로 옮겼습니다.
- source_word: ወተርኅወ፡ አዕይንቲሁ
  english_pob_choice: his eyes were opened
  chosen_korean: 그의 눈이 열렸으며
  alternatives_korean:
  - 그의 눈이 열렸고
  - 그 눈이 열렸으며
  lexicon: Geez ተርኅወ / አዕይንቲሁ
  rationale: 눈의 개방을 직역하되 한국어 서술 흐름에 맞춰 ‘열렸으며’로 자연스럽게 연결했습니다.
- source_word: ዕራቁ
  english_pob_choice: naked
  chosen_korean: 벌거벗은
  alternatives_korean:
  - 알몸인
  - 나체인
  lexicon: Geez ዕራቁ
  rationale: 원문이 단순한 ‘벗음’ 상태를 말하므로, 문학적이면서도 직접적인 ‘벌거벗은’을 택했습니다.
- source_word: ቈጽለ፡ በለስ
  english_pob_choice: fig leaves
  chosen_korean: 무화과나무 잎
  alternatives_korean:
  - 무화과 잎
  - 무화과 잎사귀
  lexicon: Geez ቈጽለ በለስ
  rationale: 원문의 식물 명칭을 살리되 한국어 성경에서 통용되는 자연한 표현으로 옮겼습니다.
- source_word: ወገብረ፡ ሎቱ፡ ምርአ፡
  english_pob_choice: and made himself a covering
  chosen_korean: 몸을 가리는 것을 만들고
  alternatives_korean:
  - 가리개를 만들고
  - 덮개를 만들어
  lexicon: Geez ገብረ / ምርአ
  rationale: ‘covering’의 기능을 살리면서도 뒤의 ‘수치’를 가리는 행위와 연결되도록 기능 중심으로 번역했습니다.
- source_word: ወከደነ፡ ኀፍረቶ
  english_pob_choice: covered his shame
  chosen_korean: 자신의 수치를 가렸습니다
  alternatives_korean:
  - 그의 부끄러움을 가렸습니다
  - 수치를 덮었습니다
  lexicon: Geez ከደነ / ኀፍረት
  rationale: 원문의 ‘수치/부끄러움’ 뉘앙스를 유지하되, 현대 한국어에서 의미가 분명한 ‘수치’를 기본어로 삼았습니다.
