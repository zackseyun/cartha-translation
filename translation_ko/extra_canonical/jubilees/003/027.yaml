  to: 그날 모든 짐승과 가축과 새와 걸어 다니는 것과 움직이는 것의 입이 모두 막혔습니다. 그들은 모두 한 입술과 한 혀로 서로 말하곤 했습니다.
  rationale: 현대 합쇼체로 문장을 정비하고 ‘육축’을 현대어 ‘가축’으로 교체했습니다. 동물들이 이전에는 한 언어로 서로 말했다는 원문의 진술과 ‘한 입술과 한 혀’라는 표현은 유지했습니다.
