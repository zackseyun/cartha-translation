  source_fidelity: 원문의 핵심 진술, 곧 그날 모든 동물의 말이 그쳤으며 이전에는 ‘한 입술과 한 혀’로 서로 말하였다는 내용은 초안에 보존되어 있습니다. 다만 ‘육축’은 현대 표준어에서 다소 낡은 표현이고, 문장 종결이 요구된 현대 합쇼체 서술문과 맞지 않습니다.
  naturalness: ‘그 날’은 ‘그날’로 붙여 쓰고, ‘말하던지라’는 현대 문어 합쇼체에 맞게 ‘서로 말하곤 했습니다’로 고치는 것이 자연스럽습니다. ‘입이 다 막혔으니’도 문자적 이미지는 살리되 한국어에서 의미가 명료하도록 ‘입이 모두 막혀’로 다듬었습니다.
  terminology: ‘cattle’은 현대적인 일반 성서 문체에 맞춰 ‘가축’으로 옮겼습니다. ‘one lip and one tongue’는 원문의 반복과 표현을 보존하여 ‘한 입술과 한 혀로’로 유지했습니다.
