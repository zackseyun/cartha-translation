translation:
  language: ko
  text: 그리고 모두 합쳐 여든 날이 될 것입니다. 그녀가 이 여든 날을 채운 뒤, 우리는 그녀를 에덴 동산으로 데려갔습니다. 에덴 동산은 온 땅보다 더 거룩하며, 그 안에 심긴 나무마다 거룩하기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎን፡ ሰማንያ፡ መዋዕለ
  english_pob_choice: And they shall be eighty days in all.
  chosen_korean: 그리고 모두 합쳐서 여든 날이 될 것입니다.
  alternatives_korean:
  - 그리고 전체가 여든 날이 됩니다.
  - 합하여 여든 날입니다.
  lexicon: n/a
  rationale: Ge'ez의 첫 문장은 전체 기간을 요약하는 진술이므로, '모두 합쳐서'로 총량의 의미를 분명하게 살렸습니다.
- source_word: ፈጺማ፡ ... አባእናሃ፡ ውስተ፡ ገነት፡ ኤዶም
  english_pob_choice: And when she had completed these eighty days, we brought her into the garden of Eden
  chosen_korean: 그녀가 이 여든 날을 마치자, 우리는 그녀를 에덴의 동산으로 데려갔습니다.
  alternatives_korean:
  - 그녀가 이 여든 날을 완료하자, 우리는 그녀를 에덴의 동산으로 인도했습니다.
  - 그녀가 이 여든 날을 끝내자, 우리는 그녀를 에덴의 동산으로 데려갔습니다.
  lexicon: n/a
  rationale: 완료 동사 '마치다'로 기간의 종료를 자연스럽게 표현했고, 1인칭 복수 '우리는'을 유지해 서술자의 공동 행위를 살렸습니다.
- source_word: ቅድስት፡ ... ዕፀ፡ *ዘትከል
  english_pob_choice: for it is holier than all the earth, and every tree that is planted in it is holy
  chosen_korean: 그것은 온 땅보다 더 거룩하며, 그 안에 심긴 나무마다 거룩하기 때문입니다.
  alternatives_korean:
  - 그것은 온 땅보다 거룩하며, 거기에 심긴 모든 나무는 거룩하기 때문입니다.
  - 온 땅보다 더 거룩하고, 그 안에 심어진 나무마다 거룩합니다.
  lexicon: n/a
  rationale: 비교급 '더 거룩하다'와 개별 나무의 성별을 모두 보존했고, '심긴'으로 수동적 상태를 간결하게 옮겼습니다.
