  text: And during these five days Adam saw them[a], male and female, of every kind that was on the earth, but he was alone, and no helper like him was found for him.
  footnotes:
  - marker: a
    text: The Ge'ez row numbering skips from verse 2 to 4, but the sense clearly includes a statement that during the five days Adam observed the creatures as male and female and found no helper corresponding to himself.
    reason: segmentation_note
    anchor_ref: '3:3'
translation:
  language: ko
  text: 이 닷새 동안 아담은 그것들을[a], 곧 땅에 있는 모든 종류의 수컷과 암컷을 보았습니다. 그러나 그는 홀로였고, 그에게는 그에 상응하는 돕는 이가 발견되지 않았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그으즈어 본문의 행 번호는 2절에서 4절로 건너뛰지만, 문맥상 이 닷새 동안 아담이 피조물들을 각 종류의 수컷과 암컷으로 보았고 자신에게 상응하는 돕는 이를 찾지 못했다는 진술이 포함됩니다.
    reason: 본문의 절·행 구분이 건너뛴 데 따른 문헌적 보충임을 밝혀, 번역의 근거와 본문 전승의 불확실성을 투명하게 제시합니다.
