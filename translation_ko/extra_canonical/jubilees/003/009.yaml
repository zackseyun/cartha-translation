  text: 아담이 창조된 땅에서 사십 일이 찬 뒤, 우리는 그가 그곳을 경작하고 지키도록 그를 에덴동산으로 인도했습니다. 그러나 그의 아내는 팔십 일 뒤에 들여보내졌고, 그 뒤에 에덴동산에 들어갔습니다.
