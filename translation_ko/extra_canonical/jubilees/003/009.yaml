  language: ko
  text: 아담이 창조된 땅에서 40일이 지난 후에 우리는 그를 에덴동산으로 인도하여 그곳을 경작하고 지키게 하였느니라. 그러나 그의 아내는 80일 후에 데려왔으며, 그 후에 그녀는 에덴동산으로 들어갔다.
