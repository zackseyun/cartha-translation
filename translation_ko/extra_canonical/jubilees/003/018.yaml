translation:
  language: ko
  text: …동산에 관하여 하나님께서 너희에게 명령하시며 말씀하시기를, ‘그것에서 먹지 말라.’ 하셨습니다. 그리고 그녀가 그에게 말했습니다. “동산의 나무들의 모든 열매는 하나님께서 우리에게 ‘먹으라’고 말씀하셨지만, 동산 한가운데 있는 나무의 열매는,”[a]
  philosophy: optimal-equivalence
