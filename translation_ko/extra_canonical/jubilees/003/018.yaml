translation:
  language: ko
  text: …동산에 관하여 하나님께서 너희에게 이렇게 명령하셨습니다. ‘그것에서 먹지 말라.’ 그리고 그녀는 그에게 이렇게 말했습니다.[a] “동산에 있는 나무들의 모든 열매에 관하여 하나님께서 우리에게 ‘먹으라’고 말씀하셨고, 동산 한가운데에 있는 나무의 열매는—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그녀가 그에게 말했습니다.’
    reason: 영어 POB 감사 흔적에 있는 해당 절의 대체 표현을 보존하고, 표지를 그 절에 직접 연결했습니다.
