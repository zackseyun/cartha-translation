  text: '*ይቤለነ፡ እግዚአብሔር፡፴፫ ኢትብልዑ፡ እምኔሁ፡ ወኢትልከፍዎ፡ ከመ፡ ኢትሙቱ። ወይቤላ፡ አርዌ፡ ምድር፡ ለብእሲት፡ አኮ፡ ሞተ፡ ዘትመውቱ፡ እስመ፡ ያአምር፡ እግዚአብሔር፡ አመ፡ ዕለተ፡'' ትበልዑ፡ እምኔሁ፡ ይትረኀዉ፡፴፬ አዕይንቲክሙ፡ ወትከውኑ፡ ከመ፡ አማልክት፡፴፭ ወታአምሩ፡ ሠናየ፡'
