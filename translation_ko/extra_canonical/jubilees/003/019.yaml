base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/019.yaml
  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
  footnotes:
  - marker: a
    text: Or 'knowing good'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님께서 우리에게 말씀하셨습니다. “그것에서 먹지 말고 그것을 만지지도 마십시오. 죽지 않도록 말입니다.” 그러자 뱀이 여자에게 말했습니다. “너희는 결코 죽지 않을 것입니다. 하나님께서는 너희가 그것에서 먹는 날에 너희 눈이 열리고, 너희가 신들과 같이 되어 선을 알게 될 줄 아시기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “선을 알며.”
    reason: 영어 POB 감사 이력에 남아 있는 ‘knowing good’이라는 대안적 연결 방식에 대응하되, 본문의 유한동사 ‘알게 될 것입니다’를 대체하지 않습니다.
lexical_decisions:
- source_word: እግዚአብሔር
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 주님
  - 야훼
  lexicon: 장절 본문 일반 호칭
  rationale: 이 본문은 일반 서술의 ‘God’에 해당하므로 프로젝트 기본값에 따라 ‘하나님’으로 옮기고, 본문 안의 직접 인용이나 야훼 인용 문맥은 아닙니다.
- source_word: ኢትብልዑ / ኢትልከፍዎ
  english_pob_choice: Do not eat from it, and do not touch it
  chosen_korean: 그것에서 먹지 말고, 그것을 만지지도 마십시오
  alternatives_korean:
  - 그것을 먹지 말고, 그것을 만지지도 마십시오
  - 그것에서 먹지 말고, 그것에 손대지도 마십시오
  lexicon: 동사 구문
  rationale: ‘먹다’의 전치사 관계를 자연스러운 한국어로 풀되, 금지의 병렬 구조를 유지하기 위해 ‘만지다’도 같은 금지형으로 대응했습니다.
- source_word: ከመ፡ ኢትሙቱ
  english_pob_choice: lest you die
  chosen_korean: 그렇게 하면 죽을까 봐입니다
  alternatives_korean:
  - 죽지 않도록입니다
  - 죽을까 해서입니다
  lexicon: 목적/결과절
  rationale: Ge'ez의 목적·경계 표현을 한국어에서 과도한 설명 없이 원인-결과의 경고로 자연스럽게 살렸습니다.
- source_word: ይትረኀዉ
  english_pob_choice: your eyes will be opened
  chosen_korean: 네 눈이 열리고
  alternatives_korean:
  - 너희 눈이 열리고
  - 눈이 열리고
  lexicon: 관용 표현
  rationale: 열림의 관용적 표현을 살리되, 영어 POB의 단수화된 대화 흐름에 맞춰 2인칭 단수로 옮겼습니다.
- source_word: ከመ፡ አማልክት
  english_pob_choice: like gods
  chosen_korean: 신들과 같이 되며
  alternatives_korean:
  - 신들처럼 되며
  - 하나님들처럼 되며
  lexicon: 명사 선택
  rationale: 복수형 ‘gods’를 그대로 드러내어, 창세기 본문에서 흔히 평준화되는 단어를 한국어에서도 완화하지 않았습니다.
- source_word: ወታአምሩ፡ ሠናየ
  english_pob_choice: and you will know good
  chosen_korean: 선을 알게 될 줄 아시기 때문이다
  alternatives_korean:
  - 좋은 것을 알게 될 줄 아시기 때문이다
  - 선과 악을 알게 될 줄 아시기 때문이다
  lexicon: 지식 대상
  rationale: 현재 확정된 영어 POB는 ‘know good’이며, 본문에 없는 ‘악’을 덧붙이지 않기 위해 ‘선을 알다’로 유지했습니다.
theological_decisions:
- issue: ‘신들과 같이 됨’의 다신론적 인상을 약화할지 여부
  chosen_reading: 복수형을 유지해 ‘신들과 같이 되며’로 옮겼습니다.
  alternative_readings:
  - 하나님과 같이 되며
  - 신과 같이 되며
  rationale: 게에즈 본문과 영어 POB가 모두 복수형을 반영하므로, 창세기 전승과의 관계를 평평하게 만들지 않고 그대로 드러냈습니다.
  doctrine_reference: 본문 비평/서사적 충실성
- issue: 마지막 구절의 의미를 ‘선과 악’으로 확장할지 여부
  chosen_reading: ‘선을 알게 될 줄 아시기 때문이다’로 번역했습니다.
  alternative_readings:
  - 선과 악을 알게 될 줄 아시기 때문이다
  - 좋은 것을 알게 될 줄 아시기 때문이다
  rationale: 제공된 영어 POB와 개정 내역이 ‘know good’로 확정하고 있으므로, 없는 요소를 보태지 않고 source-bound하게 유지했습니다.
  doctrine_reference: source fidelity
