  to: 그리고 우리는 그에게 일을 주었고, 그에게 경작에 알맞은 모든 것을 하도록 가르쳤습니다.[a] 그는 경작하고 있었고, 벌거벗은 줄을 알지 못했으며 부끄러워하지도 않았습니다. 그는 새들과 짐승들과 가축들로부터 정원을 지키고, 그 열매를 모아 먹고, 나머지는 자신을 위하여 남겨 두었습니다.
  rationale: 능동 주어를 원문에 맞게 일관되게 유지하고, 벌거벗음에 대한 무지를 현대 한국어 관용 표현으로 명료하게 옮겼습니다. 마지막 구절에서는 ‘자기 몫’의 과도한 구체화를 피하면서 ‘for himself’의 수혜 의미를 보존했습니다. 각주는 관련 구절로 옮기고 완결된 한국어 대안으로 제시했습니다.
