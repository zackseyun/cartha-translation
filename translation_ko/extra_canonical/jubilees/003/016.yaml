base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
  footnotes:
  - marker: a
    text: Or 'instructed him in everything'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 우리는 그에게 일을 주었고, 그에게 경작에 알맞은 모든 것을 하도록 가르쳤습니다.[a] 그는 경작하고 있었고, 벌거벗은 줄을 알지 못했으며 부끄러워하지도 않았습니다. 그는 새들과 짐승들과 가축들로부터 정원을 지키고, 그 열매를 모아 먹고, 나머지는 자신을 위하여 남겨 두었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 경작에 알맞은 모든 것을 가르쳤습니다.’
    reason: 영어 POB의 대안 독법(‘instructed him in everything’)을 해당 동사구에 맞추어 제시합니다.
lexical_decisions:
- source_word: ወሀብናሁ
  english_pob_choice: we gave him work
  chosen_korean: 우리는 그에게 일을 주었고
  alternatives_korean:
  - 우리는 그에게 과업을 주었고
  - 우리는 그에게 할 일을 주었고
  lexicon: 주다 / 일
  rationale: 원문의 동작은 단순한 '주다'이며, POB의 'work'는 한국어에서 가장 직접적으로 '일'로 옮기는 것이 자연스럽습니다.
- source_word: ወሀሎነ ... ንሜህሮ ገቢሮተ ኵሉ
  english_pob_choice: we instructed him to do everything suitable for cultivation
  chosen_korean: 그는 경작에 적합한 모든 일을 하도록 가르침을 받았습니다
  alternatives_korean:
  - 우리는 그에게 경작에 적합한 모든 것을 하도록 가르쳤습니다
  - 우리는 그에게 경작에 맞는 모든 일을 하라고 지시했습니다
  lexicon: 가르치다 / 경작 / 적합하다
  rationale: 게에즈의 ገቢሮተ는 단순한 '알려 줌'보다 '하도록 함'의 뉘앙스를 가지므로, '가르침을 받다'로 수동 구조를 살려 POB의 'instructed'를 반영했습니다.
- source_word: ይትቀነይ
  english_pob_choice: he was cultivating
  chosen_korean: 그는 경작하고 있었고
  alternatives_korean:
  - 그는 밭을 갈고 있었고
  - 그는 경작 중이었고
  lexicon: 경작하다
  rationale: 영문 POB가 'cultivating'을 택한 만큼, 농사 일반보다 범위가 넓은 '경작하다'를 써서 원문의 작업성을 유지했습니다.
- source_word: ዕራቁ ... ወኢየኀፍር
  english_pob_choice: he was naked and did not know it, and was not ashamed
  chosen_korean: 벗은 몸이었으나 그것을 알지 못했고 부끄러워하지도 않았습니다
  alternatives_korean:
  - 벌거벗었으나 그것을 알지 못했고 부끄러워하지도 않았습니다
  - 옷을 입지 않았으나 그것을 알지 못했고 부끄러워하지도 않았습니다
  lexicon: 벗은 몸 / 알다 / 부끄러워하다
  rationale: ‘벗은 몸’은 문어적이면서도 직설적인 표현으로, 원문의 신체 상태와 무지, 그리고 수치 없음의 병치를 그대로 살립니다.
- source_word: የዐቅብ ገነት
  english_pob_choice: he kept the garden
  chosen_korean: 정원을 지키고
  alternatives_korean:
  - 정원을 보살피고
  - 정원을 지켜
  lexicon: 지키다 / 정원
  rationale: POB의 'kept'는 단순 관리보다 보호와 보존의 의미를 함께 담으므로 '지키다'가 더 가깝습니다.
theological_decisions:
- issue: 마지막 절의 'for himself'를 어떻게 처리할지
  chosen_reading: '''남은 것은 자기 몫으로 따로 두었습니다''로 옮겨, 단순 보관이 아니라 자기에게 귀속된 몫을 남겨 두는 뜻을 드러냈습니다.'
  alternative_readings:
  - '''남은 것은 자신을 위해 따로 두었습니다'''
  - '''남은 것은 자신에게 남겨 두었습니다'''
  rationale: 게에즈 원문의 최종 표현은 단순히 남김을 넘어서 자기 몫의 분리를 암시하므로, 한국어에서도 그 소유 관계가 보이도록 했습니다.
  doctrine_reference: 본문 내 서술의 정확성; 본문 의미 보존 원칙
