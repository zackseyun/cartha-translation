base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
  footnotes:
  - marker: a
    text: Or 'And on the second day'.
    reason: previous_rendering
translation:
  language: ko
  text: 둘째 주의 여섯 날 동안[a] 우리는 주의 말씀에 따라 아담에게 모든 들짐승과 모든 가축과 모든 새와 땅에서 움직이는 모든 것과 물에서 움직이는 모든 것을 그것들의 종류대로, 그것들의 모습대로 데려갔습니다. 들짐승은 첫째 날에, 가축은 둘째 날에, 새는 셋째 날에, 땅에서 움직이는 모든 것은 넷째 날에, 물에서 움직이는 것은 다섯째 날에 데려갔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “둘째 날에”.
    reason: 영어 POB 감사 기록에 보존된 이전 번역의 대안 독법을 표시합니다. 본문은 게에즈어 ‘여섯 날 동안’ 및 이어지는 여러 날의 배정에 따라 본문 독법을 채택합니다.
lexical_decisions:
- source_word: ወበሰዱስ፡ መዋዕል
  english_pob_choice: during the six days
  chosen_korean: 둘째 주의 여섯 날 동안
  alternatives_korean:
  - 둘째 날에
  - 여섯 날 동안
  lexicon: source temporal phrase
  rationale: 게에즈 문맥과 영어 수정본을 따라 단일 ‘둘째 날’이 아니라 다섯 종류의 피조물을 여러 날에 걸쳐 데려온 기간 전체를 나타내도록 풀어 옮겼습니다.
- source_word: በቃለ፡ እግዚአብሔር፡
  english_pob_choice: by the word of the Lord
  chosen_korean: 주의 말씀으로
  alternatives_korean:
  - 주님의 말씀으로
  - 야훼의 말씀으로
  lexicon: divine speech formula
  rationale: 직접적인 말씀 매개를 자연스럽게 살리되, 이 문맥의 κύριος/주에 해당하는 경칭으로 ‘주’를 택했습니다.
- source_word: ኵሎ፡ አራዊተ፡ / ኵሎ፡ እንስሳ፡
  english_pob_choice: all the beasts / all the livestock
  chosen_korean: 모든 들짐승과 모든 가축
  alternatives_korean:
  - 모든 짐승과 모든 가축
  - 모든 들짐승과 모든 집짐승
  lexicon: animal categories
  rationale: 첫 항목은 야생 짐승을 가리키는 대비가 분명하므로 ‘들짐승’으로, 두 번째는 가축의 일반적 의미를 살려 ‘가축’으로 옮겼습니다.
- source_word: በበ፡ ዘመዶሙ፡ ወበበ፡ አምሳሎሙ፡
  english_pob_choice: according to their kinds and according to their forms
  chosen_korean: 그것들의 종류대로 그리고 그것들의 모습대로
  alternatives_korean:
  - 그 종류대로 그리고 그 형상대로
  - 각각의 종류와 모습에 따라
  lexicon: classification formula
  rationale: 분류와 외형의 이중 기준을 병렬로 살리기 위해 ‘종류’와 ‘모습’을 대응시켰고, ‘형상’은 신학적 뉘앙스가 과도할 수 있어 피했습니다.
theological_decisions:
- issue: ‘주의 말씀’의 주어를 어떻게 표기할 것인가
  chosen_reading: 본문에서는 ‘주의 말씀’으로 두어, 하나님의 발화권위를 분명히 하되 본문 자체에 없는 추가적 이름을 덧붙이지 않았습니다.
  alternative_readings:
  - 야훼의 말씀
  - 주님의 말씀
  rationale: 게에즈 원문은 ‘주’(እግዚአብሔር)를 사용하지만, 이 제3외경 문맥에서는 독자 친화성과 일관성을 위해 경칭형 ‘주’를 유지하는 것이 무리 없는 선택입니다.
  doctrine_reference: 명칭 전달의 정확성 및 경칭 유지
