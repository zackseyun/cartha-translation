  text: 아담에게 이르시되 네가 네 아내의 말을 듣고 내가 너더러 먹지 말라 명한 그 나무의 실과를 먹었은즉 땅은 너로 말미암아 저주를 받고 너로 말미암아 가시덤불과 엉겅퀴를 낼 것이며 네가 취함을 받은 땅으로 돌아갈 때까지 얼굴에 땀을 흘려야 식물을 먹으리라 너는 흙이니 흙으로 돌아갈 것임이니라 하시고
