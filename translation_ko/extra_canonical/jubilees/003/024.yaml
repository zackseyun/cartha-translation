revisions:
- from: 아담에게 이르시되 네가 네 아내의 말을 듣고 내가 너더러 먹지 말라 명한 그 나무의 실과를 먹었은즉 땅은 너로 말미암아 저주를 받고 너로 말미암아 가시덤불과 엉겅퀴를 낼 것이며 네가 취함을 받은 땅으로 돌아갈 때까지 얼굴에 땀을 흘려야 식물을 먹으리라 너는 흙이니 흙으로 돌아갈 것임이니라 하시고
  to: 아담에게도 말씀하셨습니다. “네가 네 아내의 말을 듣고, 내가 너에게 먹지 말라고 명령한 그 나무에서 먹었으므로, 땅은 너 때문에 저주를 받을 것이다. 땅은 네게 가시덤불과 엉겅퀴를 낼 것이며, 너는 네가 취함을 받은 땅으로 돌아갈 때까지 얼굴에 땀을 흘려 들의 풀을 먹을 것이다. 너는 흙이니, 흙으로 돌아갈 것이다.”
