  source_fidelity: 원문의 세 술어—나무가 감각적으로 즐거움/매력을 주는 것, 눈에 보기 좋은 것, 열매가 먹기에 좋은 것—와 이어지는 취함 및 먹음의 순서는 보존되어야 합니다. 초안의 ‘그것에서 따서’는 한국어로 부자연스러우며, ‘따다’는 원문의 단순한 ‘취하다’보다 구체적입니다.
  naturalness: ‘보기에 즐겁고 눈에 기쁘며’는 시각 표현이 중복되고 ‘눈에 기쁘다’는 현대 표준 한국어에서 어색합니다. ‘기쁨을 주며 눈에 보기 좋고’가 원문의 두 수식을 자연스럽게 구별합니다.
