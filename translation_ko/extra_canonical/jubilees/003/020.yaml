  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
  footnotes:
  - marker: a
    text: The Ge'ez word ʾaddām here functions as an adjective meaning 'pleasant' or 'delightful,' distinct from the proper name Adam.
    reason: lexical_choice
translation:
  language: ko
  text: 여자가 그 나무를 보니, 그것은 보기에 즐겁고 눈에 기쁘며, 그 열매는 먹기에 좋았고, 그래서 여자가 그것에서 따서 먹었습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዕፀ
  english_pob_choice: the tree
  chosen_korean: 그 나무
  alternatives_korean:
  - 나무
  - 그 열매 맺는 나무
  lexicon: Geʿez 일반 명사
  rationale: 문맥상 특정한 나무를 가리키므로 지시어를 살려 자연스럽게 옮겼습니다.
- source_word: አዳም
  english_pob_choice: delightful
  chosen_korean: 즐겁고
  alternatives_korean:
  - 기쁘고
  - 쾌적하고
  lexicon: Leslau
  rationale: Geʿez ʾaddām이 사람 이름이 아니라 감각적·심미적 즐거움을 뜻하므로, POB의 lexical note를 따라 '즐겁고'로 옮겼습니다.
- source_word: ለዐይን
  english_pob_choice: to the eye
  chosen_korean: 눈에 기쁘며
  alternatives_korean:
  - 눈에 보기 좋고
  - 눈에 아름다우며
  lexicon: Geʿez 일반 관용
  rationale: '''눈에''라는 직역을 유지하되 한국어 표현으로 다듬어 시각적 만족을 자연스럽게 드러냈습니다.'
- source_word: ለበሊዕ
  english_pob_choice: for food
  chosen_korean: 먹기에 좋았고
  alternatives_korean:
  - 먹을 만했고
  - 음식으로 좋았고
  lexicon: Leslau
  rationale: 단순히 '먹다'가 아니라 음식으로서의 적합성을 나타내는 표현이므로, 영어 POB의 'for food'를 의미상 살려 옮겼습니다.
theological_decisions:
- issue: 문장 끝의 행위 연속성
  chosen_reading: '''따서 먹었습니다''로 연결해 원문의 행동 순서를 그대로 드러냈습니다.'
  alternative_readings:
  - '''가지고 먹었습니다'''
  - '''따서 먹어 버렸습니다'''
  rationale: Geʿez의 동사 연쇄(취하고 먹음)를 유지해 서사의 긴장과 단순한 진행을 보존했습니다.
  doctrine_reference: 본문 서술의 사건 순서 보존
