  terminology: ‘하늘 판’은 복수형 및 관용적 표현을 반영하여 ‘하늘의 판들’로, ‘정결케 된 피’는 제의적 용어인 ‘정결의 피’로 바로잡았습니다. ‘부정’과 ‘성소’는 문맥에 맞는 용어입니다.
