revisions:
- from: 그러므로 해산하는 여인에 관한 계명이 하늘 판에 기록되었으니 만일 남자를 낳으면 처음 이레 동안은 이레 동안 부정한 가운데 있을 것이요 삼십삼 일 동안은 정결케 된 피 속에 머물러 있을 것이며 그녀는 남자 아이를 낳는 날이 다 차기까지는 거룩한 어떤 것도 만지지 말며 성소에 들어가지 말지니라.
  to: 그러므로 해산하는 여인에 관한 계명이 하늘의 판들에 기록되었습니다. 그 여인이 남자 아이를 낳으면, 처음의 이레와 같이 이레 동안 부정한 가운데 있을 것이며, 삼십삼 일 동안 정결의 피 가운데 머물러 있을 것입니다. 그 여인은 거룩한 것은 아무것도 만지지 말고, 남자 아이를 위한 이 날들을 모두 마칠 때까지 성소에 들어가지 말아야 합니다.
  rationale: 출산 후 남자 아이를 낳은 경우의 부정 기간과 정결 기간, 거룩한 것 및 성소에 관한 금지를 원문의 구조대로 유지하되, 마지막 절의 ‘이 날들’이 출산일이 아니라 앞서 규정된 기간을 가리키도록 명확히 바로잡았습니다.
