translation:
  language: ko
  text: 먹기에 좋았습니다. 그녀는 그것에서 가져다가 먹었습니다. 그리고 먼저 무화과나무 잎으로 자기 수치를 가리고, 그것을 아담에게 주었습니다. 그도 먹었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበሊዕ
  english_pob_choice: for food
  chosen_korean: 음식을 위해서였습니다
  alternatives_korean:
  - 먹을 것을 위해서였습니다
  - 식용으로였습니다
  lexicon: Geez ለ + ‘food/eating’
  rationale: 문맥상 열매를 먹을 수 있게 된 목적을 나타내므로 자연스러운 목적 표현으로 옮겼습니다.
- source_word: ወነሥአት ... ወበልዐት
  english_pob_choice: and she took from it and ate
  chosen_korean: 그리고 그녀는 그것에서 가져다가 먹었습니다
  alternatives_korean:
  - 그리고 그것에서 취하여 먹었습니다
  - 그리고 그것을 가져 먹었습니다
  lexicon: Geez 'take' + 'eat' sequence
  rationale: 연속 동작을 한국어에서 매끈하게 살리되, 원문의 ‘취함-먹음’ 순서를 유지했습니다.
- source_word: ዘቀዳሚ
  english_pob_choice: first
  chosen_korean: 먼저
  alternatives_korean:
  - 처음으로
  - 우선
  lexicon: Geez temporal adverb 'first/earlier'
  rationale: 기존 영어 초안의 누락을 바로잡아, 수치를 가린 행위가 먼저 있었음을 분명히 했습니다.
- source_word: ኀፍረታ
  english_pob_choice: her shame
  chosen_korean: 자기 수치
  alternatives_korean:
  - 그녀의 수치
  - 부끄러움
  lexicon: Geez 'shame/disgrace'
  rationale: 인격적·상태적 수치를 드러내는 표현으로 ‘자기 수치’를 선택해 문맥의 직접성을 살렸습니다.
theological_decisions:
- issue: 행위 순서의 보존
  chosen_reading: 먼저 무화과 잎으로 수치를 가린 뒤, 아담에게 주고 먹게 했다고 옮겼습니다.
  alternative_readings:
  - 무화과 잎으로 수치를 가리고 나서 그도 먹었습니다
  - 무화과 잎으로 수치를 가렸으며 또한 아담에게 주었습니다
  rationale: 게으름 없는 서술 순서를 따라, 수치를 가리는 행위가 선행했음을 본문대로 보존했습니다.
  doctrine_reference: 본문 내 서사 순서 보존
