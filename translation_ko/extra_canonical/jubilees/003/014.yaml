lexical_decisions:
- source_word: '*ይትፈጸማ፡ እላንቱ፡ መዋዕል፡''፰'
  english_pob_choice: until those days are completed
  chosen_korean: 그 날들이 남자와 여자에게 다 차기까지입니다
  alternatives_korean:
  - 그 날들이 남자와 여자에게 완성되기까지입니다
  - 그 날들이 남자와 여자에게 끝나기까지입니다
  lexicon: 완료/충만 표현
  rationale: Ge'ez의 ‘다 이루어지다/완료되다’에 맞추어 시간의 충만이 끝까지 차는 뜻을 살려 ‘다 차기까지’로 옮겼습니다.
- source_word: ለተባዕት፡ ወለአንስት።
  english_pob_choice: for a male and for a female
  chosen_korean: 남자와 여자에게
  alternatives_korean:
  - 남자와 여자에게
  - 남성과 여성에게
  - 한 남자와 한 여자에게
  lexicon: 성별 대구
  rationale: 원문은 남성과 여성의 대구를 직접 제시하므로, 자연스러운 현대 한국어로 ‘남자와 여자에게’라고 옮겼습니다.
- source_word: ዝንቱ፡ ሕግ፡ ወስምዕ፡
  english_pob_choice: This is the law and testimony
  chosen_korean: 이것은 기록된 율법과 증언입니다
  alternatives_korean:
  - 이것은 율법과 증언입니다
  - 이것은 율법과 증거입니다
  lexicon: 율법/증언
  rationale: ‘율법’은 토라적 규범을, ‘증언’은 법적·언약적 증거를 반영합니다. ‘기록된’은 뒤의 ‘that was written’과 연결해 문장을 매끈하게 했습니다.
- source_word: ዘተጽሕፈ፡
  english_pob_choice: that was written
  chosen_korean: 기록된
  alternatives_korean:
  - 기록된
  - 쓰인
  - 기록되어 있는
  lexicon: 기록/쓰기
  rationale: 수동 완료의 의미를 한국어 관용에 맞게 압축하여 ‘기록된’으로 옮겼습니다.
theological_decisions:
- issue: 율법과 증언의 병렬 표현
  chosen_reading: 문구를 토라적 규범과 언약적 증언의 병렬로 유지했습니다.
  alternative_readings:
  - 율법과 증거로 완화
