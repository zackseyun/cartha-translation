base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/001.yaml
  text: And it came to pass in the first week[1], in the forty-fourth jubilee, in the second year of that week—the year in which Abraham died—that Isaac and Ishmael came from the Well of the Oath to celebrate the Feast of Weeks, this feast of the firstfruits of the harvest, with Abraham their father.
  footnotes:
  - marker: '1'
    text: 'The opening chronology is literal: ''in the first week, in the forty-second jubilee, in the second year.'' Jubilees regularly dates events by jubilees and weeks of years; this should not be simplified away.'
    reason: cross_reference
  - marker: a
    text: Or 'forty-second'.
    reason: previous_rendering
  - marker: b
    text: Or 'that first feast of the harvest'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 마흔넷째 희년 첫째 주의 둘째 해, 곧 아브라함이 죽은 해에, 이삭과 이스마엘은 맹세의 우물에서 와서 그들의 아버지 아브라함과 함께 추수의 첫열매를 드리는 이 절기, 곧 칠칠절을 지키려고 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በ፪፡ አርብዓ፡ ወአርባዕቱ፡ ኢዮቤልዉ፡
  english_pob_choice: forty-fourth jubilee
  chosen_korean: 마흔넷째 희년
  alternatives_korean:
  - 마흔두째 희년
  - 44번째 희년
  lexicon: 희년
  rationale: 지시된 게에즈 수사 형태가 '마흔넷(44)'을 뜻하므로, 본문과 내부 연대를 보존하여 '마흔넷째 희년'으로 옮겼습니다.
- source_word: ዘሞተ፡ አብርሃም፡
  english_pob_choice: the year in which Abraham died
  chosen_korean: 아브라함이 죽은 그 해
  alternatives_korean:
  - 아브라함이 죽은 해
  - 아브라함의 죽음의 해
  lexicon: 문맥상 시간절
  rationale: 사건의 연대 표지이므로 자연스럽게 '그 해'를 넣되, 죽음 사건을 분명히 드러냈습니다.
- source_word: እምዐዘቅተ፡ መሐላ፡
  english_pob_choice: from the Well of the Oath
  chosen_korean: 맹세의 우물
  alternatives_korean:
  - 서약의 우물
  - 맹세 우물
  lexicon: 지명/어구
  rationale: 직역적 지명 표현을 유지했습니다. '맹세의 우물'은 영어 POB의 고유 지시를 따라 의미를 보존하면서도 한국어에서 읽히도록 한 형태입니다.
- source_word: በዓለ፡ ሱባዔያት፡
  english_pob_choice: the Feast of Weeks
  chosen_korean: 칠칠절
  alternatives_korean:
  - 주간절
  - 오순절
  lexicon: 절기명
  rationale: 출애굽기/신명기 전승과 연결되는 한국어 성경의 널리 알려진 명칭을 유지하되, 주석적 용어인 '절기'를 함께 두어 본문 기능을 드러냈습니다.
- source_word: ዘቀዳሚ፡ ማእረር፡
  english_pob_choice: this feast of the firstfruits of the harvest
  chosen_korean: 추수의 첫열매의 이 절기
  alternatives_korean:
  - 추수 첫열매의 이 절기
  - 수확 첫 열매의 이 절기
  lexicon: 농경 제의 표현
  rationale: 게에즈의 직설적 표현과 수정된 영어 주석을 반영해, 'firstfruits'의 제의적 의미를 '첫열매'로 살리고 '이'를 유지했습니다.
theological_decisions:
- issue: 희년·주간 표지의 연대 방식
  chosen_reading: 첫째 주, 마흔넷째 희년, 그 주 둘째 해라는 다층 연대 표지를 그대로 유지했습니다.
  alternative_readings:
  - 연대를 풀어쓴 일반 서술
  - 희년/주간 표지를 생략한 번역
  rationale: 이 문장은 족보적-연대기적 기능이 핵심이므로, 독자가 족보 표식을 따라가도록 축약하지 않았습니다.
