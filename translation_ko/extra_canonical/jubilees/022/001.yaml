revisions:
- from: 그리고 이 일은 첫째 주에, 마흔넷째 희년의 그 주 둘째 해—아브라함이 죽은 그 해에—이삭과 이스마엘이 맹세의 우물에서 와서, 그들의 아버지 아브라함과 함께 칠칠절, 곧 추수의 첫열매의 이 절기를 지키게 된 때였습니다.[a][b]
  to: 그리고 마흔넷째 희년 첫째 주의 둘째 해, 곧 아브라함이 죽은 해에, 이삭과 이스마엘은 맹세의 우물에서 와서 그들의 아버지 아브라함과 함께 추수의 첫열매를 드리는 이 절기, 곧 칠칠절을 지키려고 왔습니다.
  rationale: 원문의 연대 표지(제44희년·첫째 주·둘째 해)를 명료하게 결속하고, ‘아브라함이 죽은 해’라는 동격 설명을 보존했습니다. ‘왔다’와 ‘절기를 지키기 위해’라는 원문의 주된 사건 구조를 회복했으며, firstfruits의 제의적 의미는 ‘추수의 첫열매를 드리는’으로 자연스럽게 옮겼습니다. 근거 없이 남아 있던 주석 표지는 삭제했습니다.
