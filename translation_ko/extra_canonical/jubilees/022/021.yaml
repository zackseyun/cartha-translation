  text: But you, my son Jacob, may the Most High God help you, and may the God of heaven bless you and remove you from their uncleanness and from all their error.
translation:
  language: ko
  text: 그러나 너, 내 아들 야곱아, 지극히 높으신 하나님께서 너를 도와주시고, 하늘의 하나님께서 네게 복을 주시고, 너를 그들의 부정함과 그들의 모든 잘못에서 벗어나게 해 주시기를 바랍니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ *ልዑል፡
  english_pob_choice: the Most High God
  chosen_korean: 지극히 높으신 하나님
  alternatives_korean:
  - 가장 높으신 하나님
  - 지존하신 하나님
  lexicon: 하나님
  rationale: ‘Most High’의 경배적 칭호를 살리되, 한국어에서 자연스럽고 품위 있는 합쇼체 표현인 ‘지극히 높으신’으로 옮겼습니다.
- source_word: አምላከ፡ ሰማይ፡
  english_pob_choice: the God of heaven
  chosen_korean: 하늘의 하나님
  alternatives_korean:
  - 하늘의 하나님
  - 하늘 하나님
  lexicon: 하나님
  rationale: 소유격 구조를 직역하되, 한국어 성경 문맥에서 익숙하면서도 원문의 ‘하늘의’ 관계를 분명히 드러내는 표현을 택했습니다.
- source_word: ወያግኅሥከ፡
  english_pob_choice: remove you from
  chosen_korean: 너를 …에서 벗어나게 하시며
  alternatives_korean:
  - 너를 …에서 제거하시며
  - 너를 …에서 건지시며
  lexicon: 벗어나게 하다
  rationale: 단순한 공간 이동이 아니라 부정한 상태로부터의 분리라는 뜻을 살려, ‘remove from’의 결과를 한국어로 자연스럽게 표현했습니다.
- source_word: ርእዮሙ፡ / ስሕተቶሙ፡
  english_pob_choice: their uncleanness / all their error
  chosen_korean: 그들의 더러움 / 그들의 모든 잘못
  alternatives_korean:
  - 그들의 부정함 / 그들의 모든 오류
  - 그들의 불결함 / 그들의 모든 그릇됨
  lexicon: 더러움 / 잘못
  rationale: 의식적·도덕적 오염을 함께 포괄하는 ‘더러움’과, 판단과 행실의 어긋남을 아우르는 ‘잘못’으로 평행 구조를 살렸습니다.
theological_decisions:
- issue: 축복과 정결에서의 두 동사 관계
  chosen_reading: 하나님께서 도우시고 복을 주시며, 더러움과 오류에서 벗어나게 하시는 삼중의 축복으로 읽었습니다.
  alternative_readings:
  - ‘도우시고’와 ‘복을 주시며’만 축복이고, 뒤는 부수적 설명으로 보는 읽기
  - ‘벗어나게 하시며’를 별도의 기원으로 분리하는 읽기
  rationale: 원문과 영어 POB 모두 도움, 복, 분리의 세 동작을 연속된 복원/보호의 기도로 제시하므로, 이를 한 문장 안에서 자연스럽게 연결했습니다.
  doctrine_reference: 서사적 축복 기도 표현의 보존
- issue: 직접 호칭의 문체
  chosen_reading: ‘너, 내 아들 야곱아’로 직접 부르며, 기원문은 ‘바랍니다’로 현대 한국어의 기도체를 사용했습니다.
  alternative_readings:
  - 더 고전적인 ‘원하노라’
  - 직설형 ‘복을 주십시오’
  rationale: 본문이 인물에게 보내는 축복 선언이므로, 합쇼체 기원문이 한국어 독자에게 가장 자연스럽고 공손합니다.
  doctrine_reference: 현대 문체 선택
