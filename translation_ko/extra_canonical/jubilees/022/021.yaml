  rationale: ‘더러움’을 ‘부정함’으로 바로잡아 원문의 정결 관련 의미를 살렸고, 병렬 기원문의 동사 연결을 현대 한국어로 다듬었습니다. 대응되지 않는 [a] 표지는 삭제했습니다.
