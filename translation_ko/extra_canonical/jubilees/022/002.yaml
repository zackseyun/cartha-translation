lexical_decisions:
- source_word: ወተፈሥሐ፡ አብርሃም፡
  english_pob_choice: And Abraham rejoiced
  chosen_korean: 아브라함은 기뻐하였습니다
  alternatives_korean:
  - 아브라함은 즐거워하였습니다
  - 아브라함은 기뻐했습니다
  lexicon: Geez ተፈሥሐ (rejoice, be glad)
  rationale: 원문의 완료적 서술을 자연스러운 서사체로 옮기되, 단순한 감정 표출보다 사건의 성취에 대한 기쁨을 드러내기 위해 ‘기뻐하였습니다’를 선택했습니다.
- source_word: ክልኤሆሙ፡ ደቂቁ፡
  english_pob_choice: both his sons
  chosen_korean: 두 아들
  alternatives_korean:
  - 두 아들 모두
  - 그의 두 아들
  lexicon: Geez ክልኤ (two) + ደቂ (sons/children)
  rationale: 원문은 ‘둘’과 ‘아들들’을 직접 말하므로, 관계를 과하게 풀지 않고 간결하게 ‘두 아들’로 옮겼습니다. 소유격은 문맥상 아브라함의 아들임이 분명하므로 생략해도 의미가 유지됩니다.
- source_word: መጽኡ
  english_pob_choice: had come
  chosen_korean: 다 왔으므로
  alternatives_korean:
  - 왔으므로
  - 도착했으므로
  lexicon: Geez መጽአ (come, arrive)
  rationale: 완료된 도착을 나타내며, 기쁨의 이유를 분명히 하기 위해 결과 연결 표현 ‘다 왔으므로’를 사용했습니다.
theological_decisions:
- issue: 아브라함의 기쁨의 근거
  chosen_reading: 아브라함이 두 아들의 도착을 보고 기뻐한 사건으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 장차 이루어질 약속의 성취를 암시하는 표현으로 완곡하게 옮기기
  - 기쁨의 원인을 생략하고 단순 사실만 서술하기
  rationale: 원문과 영어 POB 모두 기쁨의 직접 원인을 ‘두 아들이 왔다’는 사실에 두고 있으므로, 해석을 덧붙이지 않고 명시적으로 유지했습니다.
  doctrine_reference: 서사 본문 직역 원칙
