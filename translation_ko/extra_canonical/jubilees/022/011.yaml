base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/011.yaml
  text: And he called Jacob and said, “My son Jacob, may the God of all bless you and strengthen you to do righteousness and his will before him. And may he choose you and your seed, that you may be for him a people of inheritance according to his will all the days.”
translation:
  language: ko
  text: 그가 야곱을 불러 말하였습니다. “내 아들 야곱아, 만물의 하나님께서 너를 복 주시고, 그의 앞에서 의를 행하고 그의 뜻을 행하도록 너를 강하게 하시기를 바랍니다. 또 그가 너와 네 씨를 택하셔서, 너희가 모든 날 동안 그의 뜻에 따라 그를 위한 기업의 백성이 되게 하시기를 바랍니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይባርከ አምላከ ኵሉ
  english_pob_choice: may the God of all bless you
  chosen_korean: 만물의 하나님께서 너를 복 주시기를 바랍니다
  alternatives_korean:
  - 모든 것의 하나님께서 너를 복 주시기를 바랍니다
  - 만유의 하나님께서 너를 복 주시기를 바랍니다
  lexicon: 아므라/아말라크 계열 인명 칭호
  rationale: ‘of all’은 대상 범위를 가리키므로 자연스럽게 ‘만물의 하나님’으로 옮기되, 하나님의 보편적 주권을 드러내는 표현을 유지했습니다.
- source_word: ያኃይለከ ለገቢረ ጽድቅ ወፈቃዱ
  english_pob_choice: and strengthen you to do righteousness and his will
  chosen_korean: 의를 행하고 그의 뜻을 행하도록 너를 강하게 하시기를 바랍니다
  alternatives_korean:
  - 의를 행하고 그의 뜻을 이루도록 너를 강하게 하시기를 바랍니다
  - 의를 행하며 그의 뜻을 따르도록 너를 강하게 하시기를 바랍니다
  lexicon: 강하게 하다 / 의 / 뜻
  rationale: 동사는 ‘강하게 하다’로 직접 살리고, ‘to do righteousness’는 행위성을 살려 ‘의를 행하다’로 옮겼습니다.
- source_word: ወይኅረይ ብከ ወ'በዘርእከ
  english_pob_choice: And may he choose you and your seed
  chosen_korean: 또 그가 너와 네 씨를 택하셔서
  alternatives_korean:
  - 또 그가 너와 네 후손을 택하셔서
  - 그리고 그가 너와 네 자손을 택하셔서
  lexicon: 선택 / 씨
  rationale: ‘seed’는 족장 약속의 상징어이므로 평이한 ‘후손’보다 원문 긴장을 보존하는 ‘씨’를 채택했습니다.
- source_word: ሕዝበ ዘርስት
  english_pob_choice: a people of inheritance
  chosen_korean: 기업의 백성이 되게 하시기를 바랍니다
  alternatives_korean:
  - 유업의 백성이 되게 하시기를 바랍니다
  - 상속의 백성이 되게 하시기를 바랍니다
  lexicon: 기업 / 백성
  rationale: ‘people of inheritance’는 소유·상속의 관계를 나타내므로 성경적 관용어인 ‘기업’과 ‘백성’을 결합해 옮겼습니다.
theological_decisions:
- issue: ‘his will’의 반복과 병렬 구조
  chosen_reading: ‘그의 뜻’과 ‘의를 행하다’를 병렬로 유지해, 내적 경건이 아니라 구체적 순종과 행위의 방향성을 드러냈습니다.
  alternative_readings:
  - ‘그의 뜻을 행하다’로 단일화하는 번역
  - ‘하나님의 뜻’으로 의미를 풀어쓰는 번역
  rationale: 원문은 ‘의를 행함’과 ‘그의 뜻’이 서로 다른 그러나 연결된 순종의 차원을 나란히 제시하므로, 둘을 구분해 살리는 편이 문맥에 더 충실합니다.
  doctrine_reference: 족장 축복 전승에서 순종과 선택의 결합
- issue: ‘people of inheritance’의 신학적 중성성
  chosen_reading: ‘기업의 백성’으로 옮겨, 이 표현이 소유권 선언이면서도 곧바로 특정 교회 용어로 환원되지 않게 했습니다.
  alternative_readings:
  - ‘유업의 백성’으로 보다 설명적으로 옮기는 방식
  - ‘상속받을 백성’으로 동사를 드러내는 방식
  rationale: 원문은 정체성 부여를 강조하므로, 한국어에서도 전통적이되 직역 가능한 표현을 택해 족장 언약의 소유-선택 의미를 보존했습니다.
  doctrine_reference: 언약 백성 정체성
