  text: And do not forsake him, and do not leave him, from now and unto the days of eternity. And let your eyes be open upon him and upon his seed, that you may keep him and bless him and sanctify him for a people of your inheritance. And bless him with all your blessings from now and for all the days forever, and renew your covenant and your mercy with him and with his seed according to all your will throughout all the generations of the earth.”
  footnotes:
  - marker: a
    text: Or 'open over him and over his seed'.
    reason: previous_rendering
  - marker: b
    text: Or 'from now and forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그를 저버리지 마시고, 그를 떠나지 마십시오. 이제부터 영원한 날들까지 그러하십시오. 또한 그와 그의 씨 위에 주님의 눈이 열려 있어, 그를 지키시고 그를 복 주시며 그를 거룩하게 하셔서 주님의 유산이 되는 한 백성이 되게 하십시오. 그리고 이제부터 영원히 모든 날 동안 주님의 모든 복으로 그를 복 주시고, 온 땅의 모든 세대를 따라 그와 그의 씨와 함께 주님의 언약과 주님의 인애를 새롭게 하십시오.[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአትኅድጎ / ወአትትሐየዮ
  english_pob_choice: do not forsake him / do not leave him
  chosen_korean: 그를 저버리지 마시고, 그를 떠나지 마십시오
  alternatives_korean:
  - 그를 버리지 마시고, 그를 떠나지 마십시오
  - 그를 포기하지 마시고, 그를 떠나지 마십시오
  lexicon: 별도 표준 렉시콘 없음(직역 범주)
  rationale: 두 동사 모두 관계를 끊지 말라는 간청으로 보이며, 첫 동사는 ‘저버리다’로 배신·유기를, 둘째 동사는 ‘떠나다’로 물리적 이탈을 살렸습니다.
- source_word: አዕይንቲ*ከ፡ ክሡታተ፡ ላዕሌሁ፡ ወላዕለ፡ ዘርኡ
  english_pob_choice: let your eyes be open over him and over his seed
  chosen_korean: 주님의 눈이 열려 있어, 그와 그의 씨 위에
  alternatives_korean:
  - 주님의 눈이 그와 그의 씨를 향해 열려 있어
  - 주님의 눈이 그와 그의 씨를 살펴
  lexicon: 별도 표준 렉시콘 없음(관용적 대응)
  rationale: ‘눈이 열려 있다’는 표현으로 감시·돌봄의 시선을 보존했고, ‘위에’로 Ge'ez의 지배적 전치 관계를 반영했습니다.
- source_word: ወከመ፡ ትቀድሶ
  english_pob_choice: and sanctify him
  chosen_korean: 그를 거룩하게 하셔서
  alternatives_korean:
  - 그를 성별하셔서
  - 그를 성화하셔서
  lexicon: 별도 표준 렉시콘 없음(성별/거룩하게 하다 범주)
  rationale: 문맥상 백성으로 따로 구별하시는 의미가 강하지만, 한국어에서는 ‘거룩하게 하다’가 더 직접적으로 어휘 긴장을 드러내어 유지했습니다.
- source_word: 'לְעַם / ''a people for your inheritance'' (EN audit: for a people of your inheritance)'
  english_pob_choice: for a people of your inheritance
  chosen_korean: 주님의 유산이 되는 한 백성이 되게 하십시오
  alternatives_korean:
  - 주님의 기업이 되는 한 백성이 되게 하십시오
  - 주님의 소유가 되는 한 백성이 되게 하십시오
  lexicon: 별도 표준 렉시콘 없음(유산/기업 범주)
  rationale: ‘유산’으로 번역해 소유·상속의 의미를 유지하면서도 현대 한국어에서 과도하게 교리화된 ‘기업’보다 자연스럽게 옮겼습니다.
- source_word: ወሣህለከ
  english_pob_choice: and your mercy
  chosen_korean: 주님의 인애를
  alternatives_korean:
  - 주님의 자비를
  - 주님의 긍휼을
  lexicon: 별도 표준 렉시콘 없음(자비/긍휼/인애 범주)
  rationale: 반복되는 언약 갱신 맥락에서 חסד 계열의 언약적 호의를 드러내기 위해 ‘인애’를 선택했습니다.
theological_decisions:
- issue: 직접 청원문에서 하나님의 호칭과 인칭 처리
  chosen_reading: ‘주님의 눈’, ‘주님의 복’, ‘주님의 언약’으로 옮겨 직접 간구의 대상으로 일관되게 처리했습니다.
  alternative_readings:
  - ‘당신의 눈’, ‘당신의 복’, ‘당신의 언약’
  - ‘하나님의 눈’, ‘하나님의 복’, ‘하나님의 언약’
  rationale: 기도문형 청원이라도 한국어 성경 문체의 공적 낭송성을 살리기 위해 주어를 ‘주님’으로 명시했습니다.
  doctrine_reference: 성경 문체의 화자-대상 일치와 공적 예전어법
