  to: 그는 먹고 마시고, 하늘과 땅을 창조하시며 땅의 모든 소산을 만드신 지극히 높으신 하나님을 찬송하였습니다. 하나님께서는 사람들이 먹고 마시며 그들의 창조주를 찬송하도록 그것을 사람의 자손에게 주셨습니다.
