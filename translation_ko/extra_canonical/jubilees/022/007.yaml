  text: And he ate and drank, and blessed the Most High God, who created heaven and earth, who made all the produce of the earth, and gave it to the children of men to eat and drink and bless their Creator.
translation:
  language: ko
  text: 그는 먹고 마시고, 가장 높으신 하나님을 찬송하였으니, 그분은 하늘과 땅을 창조하시고 땅의 모든 소산을 만드셔서, 사람의 자손에게 그것을 먹고 마시며 자기 창조주를 찬송하게 하셨습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ ልዑል
  english_pob_choice: the Most High God
  chosen_korean: 가장 높으신 하나님
  alternatives_korean:
  - 지극히 높으신 하나님
  - 지극히 높으신 하느님
  lexicon: Most High / supreme divine title
  rationale: ‘Most High’의 위계를 분명히 드러내기 위해 직역에 가까운 ‘가장 높으신’으로 옮겼습니다.
- source_word: ዘገብረ ኵሎ ስብሐ ምድር
  english_pob_choice: who made all the produce of the earth
  chosen_korean: 땅의 모든 소산을 만드셔서
  alternatives_korean:
  - 땅의 모든 풍성함을 만드셔서
  - 땅의 모든 기름진 것들을 만드셔서
  lexicon: produce / crops / yield
  rationale: 문맥상 ‘fatness’보다 농산물·산출물을 가리키는 뜻이므로 자연스럽고 넓게 포괄하는 ‘소산’으로 옮겼습니다.
- source_word: ወወሀቦሙ ለውሉደ ሰብእ
  english_pob_choice: and gave it to the children of men
  chosen_korean: 사람의 자손에게 그것을
  alternatives_korean:
  - 인생들에게 그것을
  - 사람들에게 그것을
  lexicon: children of men
  rationale: 직역적 표현을 살리되 현대 한국어에서 지나치게 고풍스럽지 않도록 ‘사람의 자손’으로 유지했습니다.
- source_word: ይብልዑ ወይስተዩ ወይባርኩ ፈጣሪሆሙ
  english_pob_choice: to eat and drink and bless their Creator
  chosen_korean: 먹고 마시며 자기 창조주를 찬송하게 하셨습니다
  alternatives_korean:
  - 먹고 마시며 그들의 창조주를 찬양하게 하셨습니다
  - 먹고 마시며 창조주를 복 주게 하셨습니다
  lexicon: bless / praise / bless their Creator
  rationale: 여기서 ‘bless’는 하나님을 향한 찬송·송축의 의미이므로 ‘찬송하다’로 옮기고, 목적을 분명히 하기 위해 ‘하게 하셨습니다’ 구조를 택했습니다.
theological_decisions:
- issue: 피조물의 목적 진술
  chosen_reading: 인간은 창조주께서 주신 것을 먹고 마시며 그 창조주를 찬송하도록 지음 받았습니다.
  alternative_readings:
  - 단순한 감사의 권고로만 읽기
  - 의례적 식사 축복으로만 축소하기
  rationale: 본문은 단순한 식사 예절이 아니라 창조와 공급, 그리고 인간의 응답 목적을 함께 진술하므로 목적론적 진술을 보존했습니다.
  doctrine_reference: 창조-섭리-예배의 연결
