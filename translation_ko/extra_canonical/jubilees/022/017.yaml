  revised_text: 그분께서 당신과 맺으신 언약을 새롭게 하시어, 당신이 모든 시대에 걸쳐 그분의 유업이 될 백성이 되게 하시고, 땅의 모든 날 동안 진실과 의로 당신과 당신의 씨에게 하나님이 되시기를 빕니다.
