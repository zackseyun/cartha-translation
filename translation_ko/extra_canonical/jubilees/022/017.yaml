  text: And may he renew his covenant with you, that you may be for him a people for an inheritance for all ages, and that he may be God to you and to your seed in truth and righteousness all the days of the earth.
translation:
  language: ko
  text: 그가 당신과 맺은 언약을 새롭게 하셔서, 당신이 모든 세대에 걸쳐 그에게 유업을 위한 백성이 되게 하시고, 그가 땅의 모든 날 동안 진실과 의로 당신과 당신의 씨에게 하나님이 되게 하소서.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐድስ፡ ኪዳኖ፡
  english_pob_choice: renew his covenant
  chosen_korean: 언약을 새롭게 하셔서
  alternatives_korean:
  - 언약을 갱신하셔서
  - 언약을 회복하셔서
  lexicon: renew / covenant
  rationale: 동사는 단순히 ‘맺다’가 아니라 이미 있는 언약을 다시 새롭게 하는 뜻이므로 ‘새롭게 하다’가 가장 직접적입니다.
- source_word: ሕዝበ፡ ለርስት፡
  english_pob_choice: a people for an inheritance
  chosen_korean: 유업을 위한 백성이 되게 하시고
  alternatives_korean:
  - 기업이 되는 백성이 되게 하시고
  - 유산이 되는 백성이 되게 하시고
  lexicon: people / inheritance
  rationale: ‘유업’은 상속받는 몫이라는 성격을 살리면서도 한국어 성경 문맥에서 자연스럽고, ‘백성’은 집단 정체성을 분명히 드러냅니다.
- source_word: በጽድቅ፡
  english_pob_choice: in truth and righteousness
  chosen_korean: 진실과 의로
  alternatives_korean:
  - 진리와 의로
  - 참됨과 의로
  lexicon: truth / righteousness
  rationale: Geez의 ‘bäṣǝdq’는 도덕적·언약적 ‘의’를 가리키므로 ‘의’가 적절하고, 앞의 ‘진실’은 POB의 truth를 반영합니다.
- source_word: ዘበሀልወ፡
  english_pob_choice: all the days of the earth
  chosen_korean: 땅의 모든 날 동안
  alternatives_korean:
  - 땅이 존재하는 모든 날 동안
  - 이 땅의 모든 날 동안
  lexicon: all the days of the earth
  rationale: 직역하면 ‘땅의 모든 날’이지만 한국어에서는 ‘동안’을 보충해 시간 지속을 자연스럽게 드러내는 것이 좋습니다.
theological_decisions:
- issue: ‘God to you and to your seed’의 언약적 자기계시
  chosen_reading: ‘하나님이 되게 하소서’로 번역해 관계적 언약 표현을 유지했습니다.
  alternative_readings:
  - ‘당신의 하나님이 되게 하소서’
  - ‘당신과 당신의 씨의 하나님이 되게 하소서’
  rationale: 단순 소유관계가 아니라 언약 안에서의 하나님-백성 관계를 말하므로, 직접성을 살리면서도 문맥의 언약 신학을 보존했습니다.
  doctrine_reference: 창 17:7의 언약 공식과 일치하는 관계적 표현
- issue: 기도문형 간청의 한국어 종결
  chosen_reading: 직역형 간청으로 ‘-게 하소서’를 사용했습니다.
  alternative_readings:
  - 서술형 ‘…되기를’
  - 명령형 ‘…되게 하십시오’
  rationale: 원문은 축복/간청의 뉘앙스를 가지므로, 하나님께 드리는 요청으로 자연스러운 합쇼체 기도문형이 적절합니다.
  doctrine_reference: 축복적 기원문 양식
