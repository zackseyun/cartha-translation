revisions:
- from: 그는 화목제물을 바치고, 형 이스마엘 앞에서 크게 기뻐하는 잔치를 베풀었습니다. 리브가가 새 곡식으로 갓 구운 빵을 만들어 아들 야곱에게 주어, 그가 그것을 아브라함에게 가져가서 땅의 첫 열매로 먹게 하고, 죽기 전에 모든 것의 창조주를 찬양하게 하려는 것이었습니다.[a]
  to: 그는 화목제물을 바치고 그의 형제 이스마엘 앞에서 크게 기뻐하는 잔치를 베풀었습니다. 리브가는 새 곡식으로 갓 만든 과자를 만들어 아들 야곱[5]에게 주었습니다. 이는 그가 땅의 첫 열매로 만든 그것들을 그의 아버지 아브라함에게 가져가, 아브라함이 먹고 죽기 전에 모든 것의 창조주를 찬송하게 하려는 것이었습니다.
  rationale: 출생 순서를 부가한 ‘형’을 제거하고, 새 곡식으로 만든 과자와 땅의 첫 열매의 관계를 명료하게 했습니다. 아브라함을 ‘그의 아버지’라고 부르는 원문의 고대적 조상 호칭은 해설적으로 바꾸지 않고 보존했습니다. 또한 고아 상태의 [a] 표지를 제공된 감사 기록에 따른 [5]와 그 각주로 교체했습니다.
