  source_fidelity: ‘형 이스마엘’은 원문의 እኁሁ(‘그의 형제’)를 출생 순서가 특정된 친족 호칭으로 좁히므로 ‘그의 형제 이스마엘’로 고쳐야 합니다. 또한 현 번역의 ‘땅의 첫 열매로 먹게 하고’는 첫 열매의 수식 관계와 먹는 주체를 흐리므로, 야곱이 첫 열매로 만든 빵을 아브라함에게 가져가게 하는 목적절로 재구성해야 합니다. ‘아브라함, 그의 아버지’는 고대 문헌의 조상 호칭을 보존합니다.
  naturalness: 수정문은 한국어의 목적절과 대명사 지시를 자연스럽게 정리하면서도, 원문의 반복된 목적 표현과 임박한 죽음의 시간 표현을 유지합니다. ‘갓 구운 빵’보다 원문 및 영어 감사 기록의 ‘fresh cakes’에 가까운 ‘갓 만든 과자’를 사용했습니다.
  terminology: ‘화목제물’, ‘새 곡식’, ‘땅의 첫 열매’, ‘모든 것의 창조주’는 제의·신학 용어를 적절히 보존합니다. ‘찬송하게 하다’는 창조주를 목적어로 하는 ‘bless’의 경배적 용법을 자연스럽게 반영합니다.
