- issue: '''before he died'' and the ancestral relation of Abraham'
  chosen_reading: '''죽기 전에''와 ''아브라함에게''를 그대로 유지해, 아브라함을 손자 야곱의 맥락에서 조상으로 부르는 표현을 보존했습니다.'
  alternative_readings:
  - '''죽기 전에''를 ''임종 전에''로 완화'
  - '''아브라함, 그의 아버지''를 ''아브라함, 그의 조상''으로 설명'
  rationale: 본문은 죽음이 임박한 아브라함에게 첫 열매를 가져가 복을 빌게 하는 장면을 직접적으로 말하므로, 의미를 약화시키지 않고 친족 호칭의 고대적 용례를 유지했습니다.
