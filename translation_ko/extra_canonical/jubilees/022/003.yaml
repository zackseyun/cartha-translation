translation:
  language: ko
  text: 이삭에게는 베르세바에 많은 재산이 있었으므로, 이삭은 자기 재산을 보러 갔다가 아버지에게 돌아가곤 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብዙኅ፡ ጥሪቱ፡
  english_pob_choice: had many possessions
  chosen_korean: 재산이 많았으므로
  alternatives_korean:
  - 소유가 많았으므로
  - 재물이 많았으므로
  - 소유물이 많았으므로
  lexicon: ጥሪት
  rationale: 문맥상 이삭의 소유물 전체를 가리키므로, 자연스럽고 문맥에 맞는 ‘재산’으로 옮겼습니다.
- source_word: በቤርሳቤ
  english_pob_choice: in Beer-sheba
  chosen_korean: 베르세바에서
  alternatives_korean:
  - 브엘세바에서
  - 브엘-세바에서
  lexicon: 지명 고유명사
  rationale: 현대 표기법을 따르되, 히브리어 지명 음가를 비교적 직접적으로 드러내는 ‘베르세바’를 택했습니다.
- source_word: ወየሐውር፡ ይስሐቅ፡ ወይዋሑ፡ ጥሪተ፡ ወይገብእ
  english_pob_choice: Isaac would go and look at his possessions and return to his father
  chosen_korean: 이삭은 자기 재산을 보러 가서 아버지에게 돌아가곤 했습니다
  alternatives_korean:
  - 이삭은 자기 재산을 살펴보러 가서 아버지에게 돌아가곤 했습니다
