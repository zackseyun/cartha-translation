  lexicon: 동사 연쇄(가다/보다/돌아가다)의 반복상
  rationale: 완료 사건이 아니라 반복적 습관을 나타내는 형태이므로 ‘-곤 했습니다’로 옮겨 원문의 상습적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 야훼 호칭의 처리
