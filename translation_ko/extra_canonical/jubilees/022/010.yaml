  text: My God, may your mercy and your peace be upon your servant and upon the seed of his sons, that they may be for you a chosen people and an inheritance from among all the nations of the earth, from now and for all the days of the generations of the earth, for all ages.
  footnotes:
  - marker: a
    text: Or 'May your mercy and your peace'.
    reason: previous_rendering
translation:
  language: ko
  text: 나의 하나님, 당신의 긍휼과 평강이 당신의 종과 그의 아들들의 씨 위에 있게 하셔서, 그들이 당신께서 모든 땅의 모든 민족들 가운데서 이제부터 땅의 모든 세대의 모든 시대에 이르기까지 택하신 백성이 되고 기업이 되게 하소서.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላኪየ
  english_pob_choice: My God
  chosen_korean: 나의 하나님
  alternatives_korean:
  - 내 하나님
  - 하나님이여
  lexicon: vocative
  rationale: Geez의 1인칭 호격 표현을 반영해 소유격을 살리고, 합쇼체 기도문에서 자연스러운 ‘나의 하나님’으로 옮겼습니다.
- source_word: ሣህልከ፡ ወሰላምከ፡
  english_pob_choice: your mercy and your peace
  chosen_korean: 당신의 긍휼과 평강
  alternatives_korean:
  - 당신의 자비와 평안
  - 당신의 은혜와 평강
  lexicon: mercy/peace
  rationale: ሣህል은 단순한 친절보다 자비·긍휼의 의미가 강하므로 ‘긍휼’을 택했고, በሰላም은 표준 교회어인 ‘평강’으로 옮겨 두 항을 구별했습니다.
- source_word: ገብርከ፡
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 노예
  - 당신의 종사
  lexicon: servant/slave
  rationale: 문맥상 하나님께 드리는 종속 호칭으로서 한국어 성경의 기본 용례인 ‘종’을 유지했습니다. 이 구절은 사회적 소유 관계를 강조하는 문맥이 아니므로 ‘노예’는 피했습니다.
- source_word: ሕዝበ፡ ኅሩየ፡
  english_pob_choice: a chosen people
  chosen_korean: 택하신 백성
  alternatives_korean:
  - 선택된 백성
  - 선민
  lexicon: chosen people
  rationale: 수동 분사적 의미를 살려 ‘택하신’으로 옮기고, 집합명사 ‘백성’으로 공동체 정체성을 드러냈습니다.
- source_word: ወርስተ፡
  english_pob_choice: an inheritance
  chosen_korean: 기업
  alternatives_korean:
  - 유업
  - 상속
  lexicon: inheritance
  rationale: 성경적 상속 개념을 압축적으로 담는 전통적이면서도 의미가 선명한 ‘기업’을 사용했습니다.
theological_decisions:
- issue: 호격과 청원문의 기도체 유지
  chosen_reading: 문두의 ‘나의 하나님’과 말미의 ‘~하게 하소서’로 전체를 청원 기도로 유지했습니다.
  alternative_readings:
  - 설명문형으로 완화
  - 직설형으로 번역
  rationale: 이 절은 단순 서술이 아니라 하나님께 드리는 축복/청원 형식이므로, 기도적 체험을 약화시키지 않도록 청원체를 유지했습니다.
  doctrine_reference: 기도와 축복의 언어 형식
- issue: ‘택하신 백성’과 ‘기업’의 병렬 보존
  chosen_reading: ‘택하신 백성’과 ‘기업’을 병렬로 두어 선택과 소유/상속의 이중 의미를 보존했습니다.
  alternative_readings:
  - 두 표현을 하나로 합침
  - ‘재산’으로 완화
  rationale: 원문은 공동체적 선택과 소유적 귀속을 함께 말하므로, 이를 합치거나 약화하면 신학적 긴장이 사라집니다.
  doctrine_reference: 언약 백성 / 기업 언어
