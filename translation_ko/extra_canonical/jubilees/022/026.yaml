base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/026.yaml
  text: This house I have built for myself[26], to put my name upon it on the earth. It is given to you and to your seed forever, and it will be called the house of Abraham. It is given to you and to your seed forever, because you will build my house and establish my name before God forever. Your seed and your name will stand throughout all the generations of the earth.”
  footnotes:
  - marker: '26'
    text: '''This house I have built for myself'' may refer to Abraham''s cultic site, but the following lines also sound dynastic (''house of Abraham''). The ambiguity is likely intentional.'
    reason: segmentation_note
  - marker: a
    text: Or 'and my people, the house of Abraham.'.
    reason: previous_rendering
  - marker: b
    text: Or 'because you have built my house and established my name'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 집은 내가 내 이름을 그 위에, 땅 위에 두려고 나 자신을 위해 지은 집입니다.[26] 이것은 너와 네 자손에게 영원히 주어졌으며, 아브라함의 집이라 불릴 것입니다. 이것은 너와 네 자손에게 영원히 주어졌습니다. 이는 네가 내 집을 짓고 하나님 앞에서 내 이름을 영원히 세울 것이기 때문입니다. 네 자손과 네 이름은 땅의 모든 세대에 걸쳐 서 있을 것입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: '26'
    text: ‘내가 나 자신을 위해 지은 이 집’은 아브라함의 예배 장소를 가리킬 수 있으나, 이어지는 ‘아브라함의 집’은 가문·왕조적 의미도 내포할 수 있습니다. 이 모호성은 유지했습니다.
    reason: 원문의 ‘집’이 실제 장소와 가문을 함께 암시할 수 있는 점을 설명하며, 영어 POB의 분절 주석에 대응합니다.
lexical_decisions:
- source_word: ቤተ፡ / house
  english_pob_choice: This house / the house of Abraham
  chosen_korean: 이 집
  alternatives_korean:
  - 이 집터
  - 이 성소
  - 아브라함의 집
  lexicon: 집
  rationale: 문맥상 실제 건물과 혈통/가문 표지를 함께 가리킬 수 있으므로 기본어는 ‘집’으로 두고, 뒤에서 ‘아브라함의 집’으로 이어지는 긴장을 살렸습니다.
- source_word: ስምየ፡ / my name
  english_pob_choice: my name
  chosen_korean: 내 이름
  alternatives_korean:
  - 내 이름
  - 나의 이름
  lexicon: 이름
  rationale: 하나님의 이름을 성전/기념 표지에 두는 표현을 직역하여 ‘내 이름’을 유지했습니다.
- source_word: በዲበ፡ ምድር፡ / on the earth
  english_pob_choice: on the earth
  chosen_korean: 그 위에
  alternatives_korean:
  - 땅 위에
  - 그 위에
  - 세상에
  lexicon: 위에
  rationale: ‘그것 위에’라는 지시 대상을 분명히 하면서도, 장소 부사를 자연스럽게 한국어로 옮기기 위해 ‘그 위에’를 택했습니다.
- source_word: ተውህበት፡ / it is given
  english_pob_choice: It is given
  chosen_korean: 주어졌으며
  alternatives_korean:
  - 주어졌으며
  - 주셨으며
  - 맡겨졌으며
  lexicon: 주다
  rationale: 수동형 선물을 그대로 반영해, 약속된 소유/수여의 뉘앙스를 유지했습니다.
- source_word: ወለዘርእከ፡ ለዓለም፡ / and to your seed forever
  english_pob_choice: and to your seed forever
  chosen_korean: 당신의 씨에게 영원히
  alternatives_korean:
  - 당신의 씨에게 영원히
  - 당신의 후손에게 영원히
  - 당신의 자손에게 영원히
  lexicon: 씨
  rationale: ‘씨’는 족속/후손을 가리키는 성서적 어휘를 가장 직접적으로 살리며, 약속의 계보를 유지합니다.
- source_word: ይቀውም፡ / will stand
  english_pob_choice: will stand
  chosen_korean: 서 있을 것입니다
  alternatives_korean:
  - 서 있을 것입니다
  - 견고할 것입니다
  - 굳게 설 것입니다
  lexicon: 서다
  rationale: 존재 지속과 공적 존립을 함께 드러내기 위해 직역에 가까운 ‘서 있을 것입니다’를 사용했습니다.
theological_decisions:
- issue: 반복되는 ‘주어졌다’와 미래형 약속의 긴장
  chosen_reading: 약속의 수여는 이미 선포된 사실로, 그 성취는 앞으로의 순종과 계보적 지속 속에서 드러난다는 구조를 살렸습니다.
  alternative_readings:
  - ‘주어질 것입니다’로 통일
  - ‘주셨습니다’로 적극화
  rationale: 게으름 없는 반복과 약속-성취 구조를 함께 보존해야 하므로, 수동 완료의 선포와 미래 약속을 구분해 옮겼습니다.
  doctrine_reference: 언약 약속과 성취의 점진적 전개
- issue: ‘하나님 앞에 내 이름을 영원히 세울 것’
  chosen_reading: 하나님의 이름을 단순히 ‘기억하다’로 약화시키지 않고, 공적·예배적 표지로 ‘세우다’를 유지했습니다.
  alternative_readings:
  - 내 이름을 영원히 기억할 것이다
  - 내 이름을 영원히 전할 것이다
  rationale: 원문은 이름의 보존이 아니라 확립/설립을 말하므로, 예배적 장소 표지의 강도를 살리는 번역이 필요합니다.
  doctrine_reference: 성전/기념 표지와 하나님의 이름
