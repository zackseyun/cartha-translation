  to: 이 집은 내가 내 이름을 그 위에, 땅 위에 두려고 나 자신을 위해 지은 집입니다.[26] 이것은 너와 네 자손에게 영원히 주어졌으며, 아브라함의 집이라 불릴 것입니다. 이것은 너와 네 자손에게 영원히 주어졌습니다. 이는 네가 내 집을 짓고 하나님 앞에서 내 이름을 영원히 세울 것이기 때문입니다. 네 자손과 네 이름은 땅의 모든 세대에 걸쳐 서 있을 것입니다.”
