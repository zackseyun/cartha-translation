revisions:
- from: 함의 범죄 때문에 가나안이 그릇되었고, 그의 모든 씨는 땅에서 멸망될 것이며, 심판의 날에는 그에게서 남은 자도, 도망하는 사람도 없을 것입니다.
  to: 함의 범죄 때문에 가나안이 잘못을 저질렀고, 그의 모든 후손은 땅에서 멸망될 것이며, 심판의 날에는 그에게서 남은 자도 피하여 벗어날 자도 없을 것입니다.
  rationale: 원문의 엄중한 선언과 병렬 구조를 유지하면서, 현대 합쇼체 한국어에서 어색하거나 의미가 흐려지는 표현을 바로잡았습니다. ‘후손’은 ‘씨’가 뜻하는 혈통적 의미를 자연스럽게 전달하며, ‘피하여 벗어날 자’는 남은 자와 구별되는 escape의 의미를 보존합니다.
