  text: For because of the transgression of Ham, Canaan erred, and all his seed will be destroyed from the earth; and there will be no remnant from him, nor anyone who escapes, on the day of judgment.
translation:
  language: ko
  text: 함의 범죄 때문에 가나안이 그릇되었고, 그의 모든 씨는 땅에서 멸망될 것이며, 심판의 날에는 그에게서 남은 자도, 도망하는 사람도 없을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በአበሳ፡ ካም፡
  english_pob_choice: because of the transgression of Ham
  chosen_korean: 함의 범죄 때문에
  alternatives_korean:
  - 함의 죄악 때문에
  - 함이 범죄했기 때문에
  lexicon: 범죄
  rationale: 게으름 없는 원인 표현을 살리되, 원문이 개인적 행위보다 ‘범죄/과오’라는 명사적 원인을 말하므로 한국어도 명사구로 맞췄습니다.
- source_word: ስሕተ፡ ከናአን፡
  english_pob_choice: Canaan erred
  chosen_korean: 가나안이 그릇되었고
  alternatives_korean:
  - 가나안이 잘못되었고
  - 가나안이 빗나갔고
  lexicon: 그르치다 / 그릇되다
  rationale: Geez의 동사는 단순한 ‘실수’보다 방향을 벗어난 상태를 나타내므로, 도덕적·행위적 일탈을 담는 ‘그릇되다’로 옮겼습니다.
- source_word: ወኵሉ፡ ዘርአ፡ ይደመሰስ፡ እምድር፡
  english_pob_choice: and all his seed will be destroyed from the earth
  chosen_korean: 그의 모든 씨는 땅에서 멸망될 것이며
  alternatives_korean:
  - 그의 모든 후손은 땅에서 멸절될 것이며
  - 그의 모든 자손은 땅에서 제거될 것이며
  lexicon: 씨
  rationale: POB의 ‘seed’를 그대로 살려 혈통·후손의 연속성을 유지했으며, ‘멸망’은 원문의 강한 파괴적 소멸을 자연스럽게 반영합니다.
- source_word: ወዘይድኅን፡ አልቦ፡ እምኔሁ፡
  english_pob_choice: nor anyone who escapes, from him
  chosen_korean: 그에게서 남은 자도, 도망하는 사람도 없을 것입니다
  alternatives_korean:
  - 그에게서 남은 자도, 피하는 자도 없을 것입니다
  - 그에게서 살아남는 자도, 도망치는 자도 없을 것입니다
  lexicon: 남은 자 / 도망하는 사람
  rationale: ‘남은 자’는 잔존을, ‘도망하는 사람’은 출생 계열에서 빠져나오는 예외를 구분해 주며, POB의 ‘anyone who escapes’도 과도하게 축소하지 않도록 했습니다.
theological_decisions:
- issue: 심판의 날 표현
  chosen_reading: ‘심판의 날’로 직역해 종말론적 판결 시점을 분명히 했습니다.
  alternative_readings:
  - ‘판결의 날’
  - ‘심판 날’
  rationale: Geez 원문의 ዕለተ፡ ደይን은 단순한 일반적 심사보다 최종 판결의 날을 가리키므로, 한국어에서도 종말론적 뉘앙스를 보존했습니다.
  doctrine_reference: 종말론 / 최후 심판
