  - severity: low
    issue: ‘도망하는 사람’의 의미 범위
    rationale: 원문과 영어의 ‘escapes’는 단순한 도주 행위보다 멸망 또는 심판에서 벗어남을 뜻합니다. ‘피하여 벗어날 자’가 이를 더 정확히 드러냅니다.
  revised_text: 함의 범죄 때문에 가나안이 잘못을 저질렀고, 그의 모든 후손은 땅에서 멸망될 것이며, 심판의 날에는 그에게서 남은 자도 피하여 벗어날 자도 없을 것입니다.
