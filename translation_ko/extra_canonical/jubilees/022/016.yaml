  rationale: 영어 POB가 지적하듯 이 구절은 의도적 범죄와 대비되는 인지 부족 상태의 죄를 가리키므로, 의미를 압축해 ‘무지의 죄’로 옮겼습니다.
- source_word: ያኃይለከ / strengthen you
  english_pob_choice: strengthen you
  chosen_korean: 강하게 하시다
