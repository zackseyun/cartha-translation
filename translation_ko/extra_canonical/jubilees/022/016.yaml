  - 굳세게 하시다
  lexicon: 강화/능력 부여 어휘
  rationale: 하나님이 백성을 실제로 견고하게 하신다는 동작을 자연스럽게 드러내는 표준 문어 표현으로 처리했습니다.
theological_decisions:
- issue: ‘inherit the whole earth’의 종말론적 상속 표현
  chosen_reading: ‘온 땅을 상속하게 하시다’로 직역해, 단순한 소유가 아니라 약속의 상속이라는 의미를 살렸습니다.
  alternative_readings:
  - ‘온 땅을 차지하게 하시다’
  - ‘세상을 물려받게 하시다’
  rationale: 본문은 축복의 결말을 상속 언어로 맺으므로, 약속-상속의 신학적 뉘앙스를 보존하는 것이 중요합니다.
  doctrine_reference: 상속/약속 신학
- issue: 절 전체의 기원형(간구형) 문체
  chosen_reading: ‘~하시기를 바랍니다’로 옮겨 축복 기원의 간구성을 유지했습니다.
  alternative_readings:
  - ‘~하시옵소서’
  - ‘~하기를 원합니다’
  rationale: 여기서는 서술이 아니라 축복 기도문이므로, 현대 합쇼체 안에서 공손하고 예전적인 간구 기능을 드러내야 합니다.
  doctrine_reference: 예전적 축복 기도
