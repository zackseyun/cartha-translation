  rationale: 앞의 어휘 쌍은 단순 반복이 아니라 포괄적 오염과 의례적 부정을 겹쳐 말하므로, ‘더러움과 부정함’으로 구분해 옮겼습니다.
- source_word: ጌገይከ / sins of ignorance
  english_pob_choice: sins of ignorance
  chosen_korean: 무지의 죄
