translation:
  language: ko
  text: 그들은 자기들의 제물을 죽은 자들에게 바치고, 악귀들을 숭배하며, 무덤들 안에서 먹습니다[19]. 그들의 모든 일은 헛됨과 공허함입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሥዋዕቶሙ / English 'sacrifice their sacrifices'
  english_pob_choice: They sacrifice their sacrifices
  chosen_korean: 자기들의 제물을 바치고
  alternatives_korean:
  - 자기들의 희생제물을 바치고
  - 자기들의 제사를 드리고
  lexicon: 제물 / 바치다
  rationale: 원문은 제의 행위를 가리키며, 영어 POB의 반복 구조를 살려 ‘제물’을 유지하되 현대 한국어에서는 ‘바치다’가 자연스럽습니다.
- source_word: ለአብድነት
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 이들
  - 망자들
  lexicon: 죽은 자
  rationale: 지시 대상이 분명한 일반적 표현으로 옮겼고, 문맥상 죽은 자들에게 제물을 바친다는 뜻을 분명히 드러냅니다.
- source_word: ወለአጋንንት
  english_pob_choice: demons
  chosen_korean: 악귀들
  alternatives_korean:
  - 귀신들
  - 마귀들
  lexicon: 악귀
  rationale: 게에즈 원어의 초자연적 악 존재를 한국어에서 직접적으로 드러내는 표현으로, 교회 전통어보다 비교적 중립적이면서도 강도를 유지합니다.
- source_word: ወበውስተ፡ መቃብራት፡ ይበልዑ
  english_pob_choice: they eat in the graves
  chosen_korean: 무덤들 안에서 먹습니다
  alternatives_korean:
  - 무덤들 속에서 먹습니다
  - 무덤에서 먹습니다
  lexicon: 무덤 안에서 먹다
  rationale: 영어 POB의 개정판처럼 ‘in the graves’에 맞춰 ‘안에서’로 옮겼고, 복수형을 살려 의례적 집단 행위를 보이게 했습니다.
- source_word: ወኵሉ፡ ግብሮሙ፡ ከንቱ፡ ወበከ።
  english_pob_choice: all their works are vanity and emptiness
  chosen_korean: 그들의 모든 일은 헛됨과 공허함입니다
  alternatives_korean:
  - 그들의 모든 행위는 헛되고 공허합니다
  - 그들의 모든 일은 허무와 공허입니다
  lexicon: 헛됨 / 공허함
  rationale: 개정된 영어 POB의 ‘emptiness’를 반영해 ‘공허함’으로 옮겼고, ‘vanity’는 도덕적·실존적 허무를 함께 담는 ‘헛됨’이 적절합니다.
theological_decisions:
- issue: 무덤에서 먹는 행위의 성격
  chosen_reading: 장례 또는 강신적 성격의 금기 행위로, 우상숭배 목록의 일부로 제시했습니다.
  alternative_readings:
  - 단순한 장례 식사
  - 조상 제의의 한 형태
  rationale: 영어 POB 주석이 지적하듯 문맥은 단순한 묘지 이용이 아니라 죽은 자와 관련된 제의적 식사를 암시하며, 악귀 숭배와 병렬로 배열됩니다.
  doctrine_reference: 주해적 문맥 판단
- issue: ‘악귀들’의 번역 강도
  chosen_reading: 귀신들보다 더 직접적인 ‘악귀들’을 사용해 우상숭배와 악령 숭배의 결합을 분명히 했습니다.
  alternative_readings:
  - 귀신들
  - 마귀들
  rationale: 원문이 종교적 배경의 초자연적 존재를 가리키므로, 현대 한국어에서 의미 강도와 비평적 뉘앙스를 유지하는 표현이 필요합니다.
  doctrine_reference: 성경의 우상숭배/영적 타락 묘사
