  source_fidelity: 'The draft accurately preserves the sequence and core sense of the Geʽez: sacrifices offered to the dead, worship of demons, eating in graves, and the concluding paired judgment of vanity and emptiness. The locative sense in ‘무덤들 안에서’ correctly follows the source and the audited English wording ‘in the graves.’'
