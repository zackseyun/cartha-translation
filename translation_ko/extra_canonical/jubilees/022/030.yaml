base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/030.yaml
  text: And he blessed Jacob and said[30], “My son, in whom with all my heart and all my affection I rejoice, may Your grace and Your mercy rest upon him and upon his seed always.”
  footnotes:
  - marker: '30'
    text: The wording shifts awkwardly between second and third person ('your grace ... upon him'). The translation preserves the prayer-like sense without forcing strict grammatical regularity.
    reason: textual_variant
  - marker: a
    text: Or 'my grace and my mercy rest upon him and upon all his seed always'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 야곱에게 복을 주며 말했습니다. “내 아들아, 내 온 마음과 내 온 애정으로 기뻐하는 너에게, 당신의 은혜와 당신의 긍휼이 그 위와 그의 씨 위에 영원히 머물기를 바랍니다.”[30]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባረኮ፡ ለያዕቆብ፡
  english_pob_choice: And he blessed Jacob
  chosen_korean: 야곱에게 복을 주며
  alternatives_korean:
  - 야곱에게 축복하며
  - 야곱을 축복하며
  lexicon: 복을 주다
  rationale: Geez 동사 ባረከ는 단순한 감정적 축하보다 신적/언약적 복을 주는 행위를 가리키므로, 한국어에서도 성경적 어감을 살린 ‘복을 주다’로 옮겼습니다.
- source_word: ወልድየ፡
  english_pob_choice: My son
  chosen_korean: 내 아들아
  alternatives_korean:
  - 내 아들
  - 아들아
  lexicon: 아들
  rationale: 직접 호칭이므로 한국어 대화체를 살려 ‘내 아들아’로 두었고, 이어지는 축복 기도문의 친밀한 호소를 드러냈습니다.
- source_word: ዘበኵሉ፡ ልብየ፡ ወዘበምሕረትየ፡
  english_pob_choice: in whom with all my heart and all my affection I rejoice
  chosen_korean: 내 온 마음과 내 온 애정으로 기뻐하는 너에게
  alternatives_korean:
  - 내 온 마음과 내 온 애정으로 기뻐하는 이에게
  - 온 마음과 애정으로 기뻐하는 너에게
  lexicon: 마음 / 애정 / 기뻐하다
  rationale: ʻ온 마음’은 ልብየ의 전면성을, ‘애정’은 ምሕረትየ가 문맥상 보이는 정서적 호의/사랑의 뉘앙스를 살립니다. 영어 POB의 기도문적 표현을 따라 관계절 구조로 자연스럽게 옮겼습니다.
- source_word: ወይኩን፡ ሣህለከ፡ ወምሕረትከ፡ ነዋኅ፡ ላዕሌሁ፡ ወላዕለ፡ ዘርኡ፡ ኵሎ፡ መዋዕለ።
  english_pob_choice: may Your grace and Your mercy rest upon him and upon his seed always
  chosen_korean: 당신의 은혜와 당신의 긍휼이 그 위와 그의 씨 위에 영원히 머물기를 바랍니다
  alternatives_korean:
  - 당신의 은혜와 당신의 긍휼이 그 위와 그의 씨 위에 항상 있게 하소서
  - 당신의 은혜와 당신의 긍휼이 그와 그의 자손 위에 영원히 머물기를 바랍니다
  lexicon: 은혜 / 긍휼 / 머물다 / 씨
  rationale: Ge'ez의 ሣህለከ·ምሕረትከ는 2인칭 단수 소유 접미사로 ‘당신의’가 맞습니다. ነዋኅ는 ‘머물다/임하다’의 지속성을 드러내므로 ‘머물기를 바랍니다’로 번역했습니다. ዘርኡ는 직역상 ‘씨’이지만, 주석 없이 구어적 ‘자손’으로 바꾸지 않고 본문은 ‘씨’로 유지했습니다.
theological_decisions:
- issue: 2인칭 소유형과 기도문적 발화의 지시 대상
  chosen_reading: ‘당신의 은혜와 당신의 긍휼’로 옮겨, 화자가 하나님께 직접 말하는 기도/축복 형식을 유지했습니다.
  alternative_readings:
  - ‘내 은혜와 내 긍휼’로 화자 소유로 바꾸는 읽기
  - 주어를 평서적으로 재구성하는 읽기
  rationale: Ge'ez 접미사 -ከ는 2인칭 남성 단수이므로 영어 POB의 수정 이력대로 ‘your’가 본문 의미에 더 가깝습니다. 이를 ‘my’로 바꾸면 원문이 가진 직접 호명과 기도적 긴장이 사라집니다.
  doctrine_reference: 텍스트 비평/문법적 소유 해석
