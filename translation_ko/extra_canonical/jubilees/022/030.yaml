  source_fidelity: 게에즈어의 2인칭 남성 단수 소유 접미사(-ከ)를 반영한 ‘당신의 은혜와 당신의 긍휼’은 적절합니다. 또한 ‘모든 날’은 ‘그의 씨’가 아니라 시간 표현을 수식하므로 ‘언제나’로 옮기는 것이 맞습니다. 다만 ‘그 위’는 ላዕሌሁ(그에게/그 위에)의 사람 지시를 한국어에서 부자연스럽게 처리하며, ‘그의 씨’는 이 문맥에서 자연스러운 한국어 표현인 ‘그의 자손’으로 옮기는 편이 의미를 더 정확히 전달합니다.
  naturalness: ‘내 온 마음과 내 온 애정으로 기뻐하는 너에게’는 호격 명사구와 관계절의 결합이 어색합니다. ‘내가 온 마음과 온 애정으로 기뻐하는 내 아들아’로 하면 원문의 직접 호칭과 관계절을 자연스러운 현대 한국어로 살릴 수 있습니다. 기도·축복의 청원은 ‘머물기를 빕니다’가 합쇼체 문체에 잘 맞습니다.
  terminology: ‘복을 주다’, ‘은혜’, ‘긍휼’은 적절합니다. ዘርኡ는 문자적으로 ‘그의 씨’이나 후손을 뜻하는 관용적 용법이므로, 현대 표준 한국어 본문에서는 ‘그의 자손’이 자연스럽고 의미도 보존합니다. ‘당신’은 원문의 직접적인 2인칭 지시를 보존하므로 유지합니다.
