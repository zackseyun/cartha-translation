base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/013.yaml
  text: And he came near and kissed him. And he said, “Blessed be my son Jacob and all his sons by the Lord Most High, to all the ages. May the Lord give you a righteous seed; and may he sanctify some of your offspring in the midst of all the earth. Let the nations serve you, and let all the nations bow down before your seed.”
  footnotes:
  - marker: a
    text: Or 'from your offspring may he sanctify himself'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 가까이 와서 그에게 입맞추고 말했습니다. “지극히 높으신 주께서 내 아들 야곱과 그의 모든 아들을 영원토록 복되게 하시기를. 주께서 너에게 의로운 씨를 주시고, 온 땅 가운데에서 네 자손 가운데 일부를 거룩하게 하시기를.[a] 민족들이 너를 섬기고, 모든 민족이 네 씨 앞에 엎드리게 하시기를.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 자손 가운데서 자신을 거룩하게 하시기를.”
    reason: 영어 POB 감사본에 보존된 대안 번역을 해당 게으즈 구절에 직접 연결합니다. 본문은 능동형 ይቀድስ 및 분할적 እም에 따라 ‘네 자손 가운데 일부를 거룩하게 하시기를’으로 유지합니다.
lexical_decisions:
- source_word: እግዚአብሔር ልዑል
  english_pob_choice: the Lord Most High
  chosen_korean: 지극히 높으신 주
  alternatives_korean:
  - 지극히 높으신 하나님
  - 가장 높으신 주님
  lexicon: κύριος / יהוה 계열 호칭
  rationale: 지존성을 드러내는 호칭이므로 ‘지극히 높으신’으로 살리고, 본문이 하나님 호칭을 가리키는 만큼 ‘주’로 옮겼습니다.
- source_word: ዘርአ ጽድቅ
  english_pob_choice: a righteous seed
  chosen_korean: 의로운 씨
  alternatives_korean:
  - 의의 씨
  - 의로운 자손
  lexicon: σπέρμα / זֶרַע
  rationale: 씨앗 이미지와 후손 의미를 함께 담는 기본 대응으로 ‘씨’를 유지하고, 형용사로 ‘의로운’을 붙여 영어 수정본의 직역성을 반영했습니다.
- source_word: እምውሉድከ ... ይቀድስ
  english_pob_choice: from your offspring may he sanctify himself
  chosen_korean: 네 자손 가운데 일부를 거룩하게 하시기를
  alternatives_korean:
  - 네 자손 중 일부를 거룩하게 하시기를
  - 네 자손에서 거룩하게 구별하시기를
  lexicon: ἁγιάζω / קדש
  rationale: 게으즈 전치사 እም은 분할적 의미로 읽을 수 있어 일부를 뜻하게 했고, 동사의 능동형을 반영해 ‘거룩하게 하시다’로 옮겼습니다.
- source_word: ይትቀነዩ ለከ
  english_pob_choice: Let the nations serve you
  chosen_korean: 민족들이 너를 섬기고
  alternatives_korean:
  - 민족들이 너를 섬기게 하고
  - 민족들이 너에게 복종하고
  lexicon: δουλεύω / עבד
  rationale: ‘serve’의 기본 의미를 따라 ‘섬기다’로 옮겼고, 축복/예언문맥의 청유형을 한국어 연결형으로 자연스럽게 처리했습니다.
theological_decisions:
- issue: ‘씨’와 ‘자손’의 병행 유지
  chosen_reading: ‘의로운 씨’와 ‘네 자손’의 두 표현을 함께 살려 메시아적 후손 약속과 집단적 후손 개념을 모두 드러냈습니다.
  alternative_readings:
  - 모두 ‘자손’으로 통일
  - 모두 ‘후손’으로 통일
  rationale: 원문은 씨/자손 이미지를 병행하므로 하나로 평준화하면 상징적 층위가 약화됩니다.
  doctrine_reference: 창세기 22장 계열의 언약 후손 약속
