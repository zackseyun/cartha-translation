translation:
  language: ko
  text: 사람들 앞에서 강건하십시오[14]. 그리고 세트의 모든 씨족 가운데서 다스리시는 동안, 당신의 길들과 당신의 아들들의 길들이 의롭다 인정받아 그들이 거룩한 백성이 되게 하십시오.
  philosophy: optimal-equivalence
