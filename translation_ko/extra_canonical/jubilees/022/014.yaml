  - marker: a
    text: Or 'your way and the way'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람들 앞에서 굳세십시오[14]. 셋의 모든 후손 가운데서 다스리시는 동안, 당신과 당신 아들들의 행로는 의롭다 인정받을 것이며, 그들은 거룩한 백성이 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '14'
    text: 표현이 난해합니다. 게에즈어 본문은 명시적으로 ‘셋의 씨’를 말합니다. 또한 그들 가운데서 야곱의 지위에 관한 절은 인류 가운데 높임을 받는다는 뜻으로도, 다스린다는 뜻으로도 이해될 수 있습니다.
    reason: 원문의 ‘셋의 씨’와 난해한 지위/통치 구문의 불확실성을 보존합니다.
