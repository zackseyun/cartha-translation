theological_decisions:
- issue: ‘will be justified’의 신학적 뉘앙스
  chosen_reading: 의롭다 인정받아
  alternative_readings:
  - 의롭게 되어
  - 의롭다 여김을 받아
  rationale: 문맥상 도덕적 성취보다 하나님의 평가/인정의 결과를 나타내므로, 행위 공로처럼 들리지 않도록 조심스럽게 표현했습니다.
  doctrine_reference: 칭의 표현의 법정적·선언적 차원
- issue: ‘holy people’의 공동체 정체성
  chosen_reading: 거룩한 백성
  alternative_readings:
  - 거룩한 민족
  - 성도들의 백성
  rationale: 개별 신자의 경건이 아니라 언약 공동체 전체의 구별됨을 나타내므로, 집단 정체성을 드러내는 표현을 유지했습니다.
  doctrine_reference: 언약 백성/성별된 공동체
