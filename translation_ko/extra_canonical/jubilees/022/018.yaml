base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/022/018.yaml
  text: And you, my son Jacob, remember my words and keep the commandments of Abraham your father. Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion; for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
translation:
  language: ko
  text: 그리고 내 아들 야곱아, 내 말을 기억하고 네 아버지 아브라함의 명령들을 지키십시오. 민족들에게서 스스로를 구별하고, 그들과 함께 먹지 말며, 그들의 행실대로 행하지 말고, 그들의 벗이 되지도 마십시오. 그들의 행실은 부정하고, 그들의 모든 길은 더러움과 가증함과 불결함이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወአንተ*ኒ ... ወልድየ፡ ያዕቆብ፡
  english_pob_choice: And you, my son Jacob,
  chosen_korean: 그리고 너, 내 아들 야곱아
  alternatives_korean:
  - 그리고 당신, 내 아들 야곱아
  - 내 아들 야곱아
  lexicon: 인칭대명사/호칭
  rationale: 직접 호명과 친밀한 아버지의 권면을 살리기 위해 2인칭 단수는 합쇼체 문맥 안에서 ‘너’로 두고, 호칭은 원문의 친자 관계를 따라 ‘내 아들 야곱아’로 옮겼습니다.
- source_word: ተዘከር፡ ቃለየ፡ ወዕቀብ፡ ትእዛዛተ፡ አብርሃም፡ አቡከ፡
  english_pob_choice: remember my words and keep the commandments of Abraham your father.
  chosen_korean: 내 말을 기억하고 네 아버지 아브라함의 명령들을 지키십시오
  alternatives_korean:
  - 내 말을 기억하고 네 아버지 아브라함의 계명들을 지키십시오
  - 내 말을 기억하고 네 아버지 아브라함의 명령을 지키십시오
  lexicon: “말/명령들”
  rationale: ‘말’은 ቃለየ의 직접 대응이고, ትእዛዛተ는 단수보다 복수 ‘명령들’이 원문의 반복성을 더 잘 드러내므로 POB의 복수 감각을 살렸습니다.
- source_word: ተፈለጥ፡ እምአሕዛብ፡ ወኢትብላዕ፡ ምስሌሆሙ፡ ወኢትግበር፡ በከመ፡ ምግባሪሆሙ፡ ወኢትኩኖሙ፡ ቢጸ፡
  english_pob_choice: Separate yourself from the nations, and do not eat with them, and do not act according to their deeds, and do not become their companion;
  chosen_korean: 민족들 가운데서 너 자신을 구별하고, 그들과 함께 먹지 말며, 그들의 행실대로 행하지 말고, 그들의 동무가 되지도 마십시오
  alternatives_korean:
  - 민족들로부터 분리되며, 그들과 함께 먹지 말며, 그들의 일들대로 행하지 말고, 그들의 친구가 되지도 마십시오
  - 민족들과 구별되어, 그들과 함께 먹지 말며, 그들의 행위대로 행하지 말고, 그들의 동반자가 되지도 마십시오
  lexicon: 구별/행실/동무
  rationale: 원문의 분리 명령을 능동적 자기 구별로 살렸고, ምግባሪሆሙ는 단순 ‘일’보다 도덕적 행위인 ‘행실’이 자연스럽습니다. ቢጸ는 관계적 동반을 뜻하므로 중립적이면서도 직설적인 ‘동무’로 옮겼습니다.
- source_word: ርኩስ፡ ወኵሉ፡ ፍናዊሆሙ፡ ጐግኒ፡ ወምናኔ፡ ወስቆራር።
  english_pob_choice: for their deeds are unclean, and all their ways are defilement and abomination and uncleanness.
  chosen_korean: 그들의 행실은 부정하고, 그들의 모든 길은 더러움과 가증함과 불결함이기 때문입니다
  alternatives_korean:
  - 그들의 행실은 부정하고, 그들의 모든 길은 더러움과 혐오와 불결함이기 때문입니다
  - 그들의 행실은 더럽고, 그들의 모든 길은 더러움과 가증함과 불결함이기 때문입니다
  lexicon: 부정/더러움/가증함/불결함
  rationale: POB의 revision에 맞춰 ርኩስ는 서술형 형용사 ‘부정하고’로, 이어지는 명사열은 도덕·의례적 오염의 누적을 살려 ‘더러움과 가증함과 불결함’으로 옮겼습니다.
theological_decisions:
- issue: 민족들로부터의 분리 명령의 성격
  chosen_reading: 본문은 단순한 사회적 거리두기보다 언약적 정체성을 지키기 위한 구별 명령으로 읽었습니다.
  alternative_readings:
  - 의례적 정결만을 위한 제한으로 보는 읽기
  - 민족 혐오로 오해될 수 있는 읽기
  rationale: 문맥상 아브라함의 명령을 지키는 언약적 충성의 문제이므로, 한국어는 ‘민족들 가운데서 너 자신을 구별하고’로 옮겨 분리의 목적을 드러냈습니다.
  doctrine_reference: 언약 정체성, 거룩함/구별
