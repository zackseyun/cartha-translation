translation:
  language: ko
  text: 내 아들 야곱아, 가나안의 딸들의 씨에서 아내를 맞지 않도록 조심하라. 그들의 모든 씨는 땅에서 뽑혀 없어질 것이기 때문이다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዐቀብ
  english_pob_choice: Take heed
  chosen_korean: 조심하라
  alternatives_korean:
  - 주의하라
  - 삼가라
  lexicon: Geez imperative of caution/guarding
  rationale: 단순한 정보 전달이 아니라 경고와 주의를 촉구하는 명령이므로, 현대 한국어에서 자연스럽고 직설적인 「조심하라」로 옮겼습니다.
- source_word: ብእሲተ
  english_pob_choice: a wife
  chosen_korean: 아내
  alternatives_korean:
  - 아내를 맞이하다
  - 여자를 취하다
  - 결혼하다
  lexicon: Geez noun for wife/woman in marital context
  rationale: 문맥상 혼인 대상을 말하므로 「아내」가 가장 직접적이며, 뒤의 동사를 보완해 혼인 행위를 자연스럽게 드러내도록 했습니다.
- source_word: ኵሉ፡ ዘርአ፡ አዋልደ፡ ከናአን
  english_pob_choice: any of the seed of the daughters of Canaan
  chosen_korean: 가나안의 딸들의 씨에서
  alternatives_korean:
  - 가나안의 딸들의 후손 중에서
  - 가나안 여인들의 자손 중에서
  lexicon: Ge'ez construct expressing descent/offspring
  rationale: 영어 POB의 수정을 반영해 ‘any of the seed’ 구조를 살리고, 혈통적 연속성을 나타내는 「씨」를 유지했습니다.
- source_word: እስመ፡ ኵሉ፡ ዘርአ፡ ለሥራዊ፡ እምድር
  english_pob_choice: for all his seed is to be uprooted from the earth
  chosen_korean: 그들의 모든 씨는 땅에서 뽑혀 없어질 것이기 때문이다
  alternatives_korean:
  - 그들의 모든 씨는 땅에서 뿌리째 뽑힐 것이기 때문이다
  - 그들의 모든 씨는 땅에서 멸망할 것이기 때문이다
  lexicon: Ge'ez root meaning to uproot/eradicate
  rationale: 회수된 영어 수정과 원어 어근의 농경적 이미지를 살려 「뽑혀 없어지다」로 옮겨, ‘uprooted’의 은유를 보존했습니다.
theological_decisions:
- issue: 가나안 혈통에 대한 강한 배제 경고의 톤
  chosen_reading: 혼인 금지와 함께 후손의 멸절을 경고하는 강한 서술을 그대로 살렸습니다.
  alternative_readings:
  - 완곡하게 ‘멀어질 것이다’로 약화
  - 단순한 문화적 분리 권고로 완화
  rationale: 원문은 경고를 약화하지 않고, 결혼 금지의 이유를 후손 전체의 파멸로 제시합니다. 이를 한국어에서도 그대로 드러내야 합니다.
  doctrine_reference: source fidelity / canonical-style severity
