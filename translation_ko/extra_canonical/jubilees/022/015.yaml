  text: May the Most High God give you all the blessings with which he blessed me and with which he blessed Noah and Adam. May they rest upon the holy head of your offspring for all generations and forever.
  footnotes:
  - marker: a
    text: Or 'from generation to generation'.
    reason: previous_rendering
translation:
  language: ko
  text: 지극히 높으신 하나님께서 당신에게, 그분이 저에게 복 주신 모든 복과 노아에게, 그리고 아담에게 복 주신 모든 복을 주시기를 바랍니다. 그것들이 당신의 후손의 거룩한 머리 위에, 모든 세대에 걸쳐, 그리고 영원히 머물기를 바랍니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሀብከ፡ አምላከ፡ ልዑል፡ ኵሎን፡ በረከታተ፡
  english_pob_choice: May the Most High God give you all the blessings
  chosen_korean: 지극히 높으신 하나님께서…모든 복을 주시기를 바랍니다
  alternatives_korean:
  - 가장 높으신 하나님께서…모든 축복을 주시기를 바랍니다
  - 지존하신 하나님께서…모든 복을 주시기를 바랍니다
  lexicon: 하나님 / 복
  rationale: ‘아믈라케 ልዑል’은 직역하면 ‘지극히 높으신 하나님’에 해당하고, ‘በረከታተ’는 예배적·언약적 복을 가리키므로 ‘복’으로 옮기는 것이 가장 직접적입니다.
- source_word: ባረከኒ
  english_pob_choice: he blessed me
  chosen_korean: 그분이 저에게 복 주신
  alternatives_korean:
  - 그분이 나에게 복하신
  - 그분이 저를 축복하신
  lexicon: 복 주다 / 축복하다
  rationale: 본문의 동사는 ‘복 주다’의 반복 구조를 이루므로, 앞의 ‘모든 복’과도 자연스럽게 맞물리도록 ‘복 주신’으로 통일했습니다.
- source_word: ኖኅ፡ ወአዳም
  english_pob_choice: Noah and Adam
  chosen_korean: 노아에게, 그리고 아담에게
  alternatives_korean:
  - 노아와 아담에게
  - 노아와 아담에게도
  lexicon: 고유명사
  rationale: 수여 대상이 각각 나열되므로 한국어에서도 조사와 쉼표로 분리해, 각 인물에게 주어진 복의 범위를 분명히 했습니다.
- source_word: ዲበ፡ ድማኅ፡ ቅዱስ፡
  english_pob_choice: upon the holy head
  chosen_korean: 거룩한 머리 위에
  alternatives_korean:
  - 거룩한 머리 위에
  - 성스러운 머리 위에
  lexicon: 머리 / 거룩한
  rationale: ‘머리’는 후손 전체를 대표하는 중심부를 가리키는 직접적 표현이므로 보존했고, ‘ቅዱስ’은 문맥상 제의적·언약적 성격을 드러내는 ‘거룩한’으로 옮겼습니다.
theological_decisions:
- issue: 후손/씨앗의 의미
  chosen_reading: ‘seed’에 해당하는 표현을 ‘후손’으로 옮겨, 혈통적·계보적 후속 세대를 자연스럽게 드러냈습니다.
  alternative_readings:
  - 씨
  - 자손
  rationale: 영어 POB의 최신 수정이 ‘offspring’로 정리한 흐름을 반영하되, 게에즈 본문의 نسل 개념을 현대 한국어에서 가장 명료하게 전달하는 표현으로 처리했습니다.
  doctrine_reference: 족보적 복과 언약적 계승에 대한 성경적 용례
