revisions:
- from: 지극히 높으신 하나님께서 당신에게, 그분이 저에게 복 주신 모든 복과 노아에게, 그리고 아담에게 복 주신 모든 복을 주시기를 바랍니다. 그것들이 당신의 후손의 거룩한 머리 위에, 모든 세대에 걸쳐, 그리고 영원히 머물기를 바랍니다.[a]
  to: 지극히 높으신 하나님께서 저와 노아와 아담에게 복 주신 모든 복을 당신에게 주시기를 빕니다. 그 복들이 당신의 후손의 거룩한 머리 위에 모든 세대에 걸쳐 영원히 머물기를 빕니다.[a]
