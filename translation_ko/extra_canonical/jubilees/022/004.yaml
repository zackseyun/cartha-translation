  text: And in those days Ishmael came to see his father, and the two of them came together; and Isaac slaughtered a sacrifice as a thank offering and offered it on the altar that his father had made in Hebron.
translation:
  language: ko
  text: 그때 이스마엘이 자기 아버지 아브라함을 찾아왔고, 그 두 사람이 함께 왔습니다. 이삭은 감사 제물로 희생 제물을 잡아, 아버지가 헤브론에 만든 제단 위에 바쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መጽአ / came to see
  english_pob_choice: came to see his father
  chosen_korean: 그의 아버지를 보러 왔고
  alternatives_korean:
  - 아버지를 찾아왔고
  - 아버지를 방문했고
  lexicon: source-note
  rationale: Ge‘ez 동사는 단순한 '오다'보다 방문·면회의 맥락을 가지므로, POB의 'came to see his father'를 자연스러운 현대 한국어로 옮겨 '보러 왔고'로 렌더링했습니다.
- source_word: ኅቡረ፡ ወ / the two of them came together
  english_pob_choice: the two of them came together
  chosen_korean: 두 사람이 함께 모였습니다
  alternatives_korean:
  - 둘이 함께 왔습니다
  - 두 사람이 함께 만났습니다
  lexicon: source-note
  rationale: 행위의 결과가 '함께 모임/합류함'에 있으므로, 단순 병렬 이동보다 '함께 모였습니다'가 원문 관계를 더 분명히 드러냅니다.
- source_word: መሥዋዕተ ለጽንሓሕ / sacrifice as a thank offering
  english_pob_choice: a sacrifice as a thank offering
  chosen_korean: 감사 제물로 희생제사를 드리고
  alternatives_korean:
  - 감사 제물로 제사를 드리고
  - 감사 제사로 제사를 드리고
  lexicon: source-note
  rationale: POB의 감사 제물은 감사의 의미가 분명한 제물로 이해되므로, '감사 제물로'를 앞세워 제사 행위의 성격을 살렸습니다.
- source_word: ዲበ ምሥዋዕ / on the altar
  english_pob_choice: on the altar
  chosen_korean: 제단 위에 그것을 올려 드렸습니다
  alternatives_korean:
  - 제단 위에 드렸습니다
  - 제단에 바쳤습니다
  lexicon: source-note
  rationale: 제사 행위의 물리적 위치와 봉헌 동작을 함께 보여 주기 위해 '올려 드렸습니다'를 선택했습니다.
theological_decisions:
- issue: ‘thank offering’의 제의적 성격
  chosen_reading: 감사 제물로 드린 제사
  alternative_readings:
  - 단순한 감사 표시
  - 일반적 희생제사
  rationale: 본문은 단순한 감정 표현이 아니라 특정한 제의 행위를 말하므로, 감사의 뜻을 지닌 제물과 제사 행위를 함께 살렸습니다.
  doctrine_reference: 창세기/율법 제사 용어의 기본 구분을 따름
- issue: 아브라함이 만든 제단의 지속성
  chosen_reading: 그의 아버지가 지은 제단
  alternative_readings:
  - 그 아버지가 세운 제단
  - 그 아버지가 만든 제단
  rationale: 원문은 제단이 아버지의 공적 산물임을 강조하므로, '지은'을 사용해 건립의 의미를 분명히 했습니다.
  doctrine_reference: 서사적 문맥의 소유·기원 표시
