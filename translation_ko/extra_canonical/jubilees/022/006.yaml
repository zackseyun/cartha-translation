  text: And Isaac also sent by the hand of Jacob the best of the thank offering to Abraham, that he might eat and drink.
translation:
  language: ko
  text: 이삭도 야곱의 손으로 감사 제물 가운데 가장 좋은 것을 아브라함에게 보내어, 아브라함이 먹고 마시도록 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእዴ ያዕቆብ
  english_pob_choice: by the hand of Jacob
  chosen_korean: 야곱의 손을 통해
  alternatives_korean:
  - 야곱의 손으로
  - 야곱을 통해
  lexicon: 손/매개 표현
  rationale: 원문의 ‘손’은 단순한 도구가 아니라 매개를 나타내므로, POB의 ‘by the hand of’ 의미를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: መሥዋዕተ ዘመድኃኒት
  english_pob_choice: the best of the thank offering
  chosen_korean: 감사제물의 가장 좋은 것
  alternatives_korean:
  - 감사제물의 가장 좋은 몫
  - 감사제물 가운데 가장 좋은 것
  lexicon: 제물/감사표현
  rationale: 원문의 제의적 표현을 유지하면서, 영어의 ‘thank offering’에 해당하는 제물을 ‘감사제물’로 옮겼고, ‘best’는 최상급 의미를 분명히 하도록 ‘가장 좋은 것’으로 처리했습니다.
- source_word: ወይብላዕኒ፡ ወይስተይኒ
  english_pob_choice: that he might eat and drink
  chosen_korean: 그가 먹고 마시게 하였습니다
  alternatives_korean:
  - 먹고 마시도록 하였습니다
  - 먹고 마시게 하려고 하였습니다
  lexicon: 목적절
  rationale: 원문의 목적을 나타내는 구조를 한국어 자연문으로 풀어, 아브라함이 먹고 마시도록 하려는 의도를 분명히 했습니다.
theological_decisions:
- issue: 제의적 용어의 유지 여부
  chosen_reading: ‘감사제물’로 유지하여 문맥의 제사적 성격을 드러냈습니다.
  alternative_readings:
  - ‘감사의 제물’
  - ‘감사 헌물’
  rationale: 본문은 단순한 호의가 아니라 제의적 제물을 말하므로, 한국어에서도 제의적 뉘앙스를 살리는 표현이 필요합니다.
  doctrine_reference: 본문 문맥 보존 원칙
