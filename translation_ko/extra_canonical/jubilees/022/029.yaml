  text: And he blessed him with all his heart and said, “The Most High God, the God of all and Creator of all, who brought me out from Ur of the Chaldeans to give me this land as an everlasting possession, and that I might establish a holy seed—may the Most High be blessed forever.”
  footnotes:
  - marker: a
    text: Or 'and to establish a holy seed'.
    reason: previous_rendering
  - marker: b
    text: Or 'may he be blessed forever.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 마음을 다해 그를 축복하며 말했습니다. “지극히 높으신 하나님, 만물의 하나님, 만물의 창조주께서 나를 갈대아인의 우르에서 이끌어 내셔서 이 땅을 영원한 소유로 내게 주시고, 내가 거룩한 씨를 세우게 하시니 — 지극히 높으신 분이 영원히 찬송받으시기를 빕니다.”[a][b]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረኮ ... በኵሉ፡ ልቡ
  english_pob_choice: blessed him with all his heart
  chosen_korean: 마음을 다해 그를 축복하며
  alternatives_korean:
  - 온 마음으로 그를 축복하며
  - 마음 전체로 그를 축복하며
  lexicon: ባረከ / በኵሉ ልቡ
  rationale: 행위의 강도와 진정성을 자연스럽게 살리되, 한국어에서 덜 어색한 '마음을 다해'로 옮겼습니다.
- source_word: አምላከ፡ ልዑል፡ አምላከ፡ ኵሉ፡ ወፈጣሪ፡ ኵሉ፡
  english_pob_choice: The Most High God, the God of all and Creator of all
  chosen_korean: 지극히 높으신 하나님, 만물의 하나님, 만물의 창조주
  alternatives_korean:
  - 지극히 높으신 하나님, 모든 것의 하나님, 모든 것의 창조주
  - 지극히 높으신 하나님, 만유의 하나님, 만유의 창조주
  lexicon: ልዑል / አምላከ ኵሉ / ወፈጣሪ ኵሉ
  rationale: '''Most High''는 하나님의 높으심을 드러내는 칭호이므로 ''지극히 높으신''으로, ''all''은 문맥상 만물 전체를 가리키는 칭호적 표현으로 보아 ''만물의''를 택했습니다.'
- source_word: እም፡ ኡር፡ ዘከለዳውያን
  english_pob_choice: from Ur of the Chaldeans
  chosen_korean: 갈대아인의 우르에서
  alternatives_korean:
  - 갈대아 우르에서
  - 갈대아 사람들의 우르에서
  lexicon: ኡር ዘከለዳውያን
  rationale: 지명과 소속을 한국어 성경식으로 간결하게 살리되, 고유명사 '우르'를 보존했습니다.
- source_word: የሀበኒ ... ዛተ፡ ምድረ፡ አርስ ... ዘርአ፡ ቅዱሰ
  english_pob_choice: to give me this land as an everlasting possession, and that I might establish a holy seed
  chosen_korean: 이 땅을 영원한 소유로 내게 주시고, 내가 거룩한 씨를 세우게 하시니
  alternatives_korean:
  - 이 땅을 영원한 소유로 내게 주시고, 거룩한 씨를 세우게 하시니
  - 이 땅을 영원한 기업으로 내게 주시고, 내가 거룩한 씨를 세우게 하시니
  lexicon: ዛተ ምድረ አርስ / ዘርአ ቅዱሰ
  rationale: '''영원한 소유''는 POB의 문맥을 따르되, ''아빕'' 계열의 상속 개념보다 직접적인 소유 의미를 살렸습니다. 또한 게에즈의 1인칭 주어 전환을 반영해 ''내가''를 넣었습니다.'
- source_word: ልዑል፡ ለዓለም
  english_pob_choice: may the Most High be blessed forever
  chosen_korean: 지극히 높으신 분이 영원히 찬송받으시기를 빕니다
  alternatives_korean:
  - 지극히 높으신 분이 영원히 복되시기를 빕니다
  - 지극히 높으신 분이 영원토록 복을 받으시기를 빕니다
  lexicon: ልዑል ለዓለም / ይትባረክ
  rationale: 마지막 반복어 '지극히 높으신 분'을 살리고, 수동형 축복 동사를 한국어 예배체에 맞게 '찬송받으시기를 빕니다'로 옮겼습니다.
theological_decisions:
- issue: '''holy seed''의 의미와 ''I might establish''의 주어 처리'
  chosen_reading: 거룩한 씨를 세우게 하시니
  alternative_readings:
  - 거룩한 씨를 세우게 하시니
  - 거룩한 씨를 세우도록 하시니
  rationale: 게에즈가 아브라함 자신을 주어로 두는 1인칭 접속법 뉘앙스를 가지므로, '내가'를 포함해 주어 전환을 드러냈습니다. '씨'는 자손/후손의 집합적 표현을 유지하면서도 본문의 언약 표지를 보존합니다.
  doctrine_reference: 언약과 후손에 대한 족장 전승의 표현 방식
- issue: 지존자에 대한 최종 축복 문구의 화자 태도
  chosen_reading: 지극히 높으신 분이 영원히 찬송받으시기를 빕니다
  alternative_readings:
  - 그분이 영원히 찬송받으시기를 빕니다
  - 지극히 높으신 하나님이 영원히 찬송받으시기를 빕니다
  rationale: 원문이 마지막에 '지존자'를 다시 반복하므로 그 칭호를 유지해 축복문의 강조를 보존했습니다. '찬송받으시기를 빕니다'는 수동적 축복을 한국어 기도체로 자연스럽게 옮긴 것입니다.
  doctrine_reference: 하나님의 찬양받으심과 축복 선언의 문학적 형식
