  text: 대적의 칼은 주께서 저와 제 자녀들에게 주신 모든 것에 있어서, 제 생애의 모든 날 동안 오늘에 이르기까지 저를 이기지 못하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ፡
  english_pob_choice: The sword of the adversary
  chosen_korean: 대적의 칼
  alternatives_korean:
  - 원수의 칼
  - 적의 칼
  lexicon: ሰይፍ; ጸላኢ
  rationale: Geez의 ‘칼’과 ‘대적/원수’ 이미지를 그대로 살려, 시적·전투적 표현을 유지했습니다.
