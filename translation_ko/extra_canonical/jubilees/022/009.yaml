  text: The sword of the adversary has not overcome me in all that you have given me and my children all the days of my life until this day.
translation:
  language: ko
  text: 대적의 칼이 제가 주께서 제게와 제 자녀들에게 주신 모든 것 속에서 제게 이기지 못하였고, 제 생애의 모든 날 동안 오늘에 이르기까지 그러하였습니다.[a]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰይፈ፡ ጸላኢ፡
  english_pob_choice: The sword of the adversary
  chosen_korean: 대적의 칼
  alternatives_korean:
  - 원수의 칼
  - 적의 칼
  lexicon: ሰይፍ; ጸላኢ
  rationale: Geez의 ‘칼’과 ‘대적/원수’ 이미지를 그대로 살려, 시적·전투적 표현을 유지했습니다.
- source_word: ኢሞአኒ፡
  english_pob_choice: has not overcome me
  chosen_korean: 제게 이기지 못하였고
  alternatives_korean:
  - 저를 이기지 못하였고
  - 저를 넘어뜨리지 못하였고
  lexicon: አሸነፈ / 이김의 부정
  rationale: 문맥상 ‘정복하다/이기다’의 의미가 가장 직접적이므로, 종교적 완곡어보다 승패를 드러내는 표현을 택했습니다.
- source_word: በኵሉ፡ ዘወሀብከኒ፡ ወለውሉድየ፡ ኵሎ፡
  english_pob_choice: in all that you have given me and my children
  chosen_korean: 주께서 제게와 제 자녀들에게 주신 모든 것 속에서
  alternatives_korean:
  - 주께서 제게와 제 자녀들에게 주신 모든 것 안에서
  - 주께서 제게 주시고 제 자녀들에게 주신 모든 것 속에서
  lexicon: ወሀበ; ወልድ
  rationale: ‘주다’의 수여 동사를 유지하고, 소유·배분의 범위를 ‘모든 것 속에서’로 자연스럽게 옮겼습니다.
- source_word: መዋዕለ፡ ሕይወትየ፡ እስከ፡ ዛቲ፡ ዕለት።
  english_pob_choice: all the days of my life until this day
  chosen_korean: 제 생애의 모든 날 동안 오늘에 이르기까지
  alternatives_korean:
  - 제 삶의 모든 날 동안 오늘까지
  - 제가 살아온 모든 날 동안 오늘에 이르기까지
  lexicon: መዋዕል; ሕይወት; ዕለት
  rationale: ‘생애’는 전체 기간을, ‘오늘에 이르기까지’는 종료 시점을 분명히 하여 원문의 시간적 누적을 살렸습니다.
theological_decisions:
- issue: 승리/보호의 진술을 단순한 비유로 약화하지 않을지
  chosen_reading: 대적의 칼이 실제로 저를 이기지 못한 하나님의 보호와 신실하심의 고백으로 읽었습니다.
  alternative_readings:
  - 단순한 과장법으로만 읽기
  - 개인적 체험담으로 축소하기
  rationale: 문맥상 서원과 회고의 언어이며, ‘이기지 못하였다’는 승리 진술을 그대로 유지하는 편이 본문의 힘을 보존합니다.
  doctrine_reference: 섭리와 보호
- issue: 제 자녀들에게 주신 것의 범위를 축소할지 여부
  chosen_reading: ‘주께서… 주신 모든 것’은 재산과 삶의 복을 포괄하는 넓은 범위로 두었습니다.
  alternative_readings:
  - 재산만 가리키는 것으로 좁히기
  - 자녀에게만 주신 것으로 분리하기
  rationale: Geez 원문과 English POB 모두 포괄적 표현을 유지하므로, 특정 항목으로 제한하지 않고 열린 범위를 보존했습니다.
  doctrine_reference: 언약의 복
