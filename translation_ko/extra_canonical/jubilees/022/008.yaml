  yaml_path: translation/extra_canonical/jubilees/022/008.yaml
  text: And now I thank you, my God, because you have shown me this day. Behold, I am one hundred seventy-five years old, advanced and complete in days, and all my days have been peace.
translation:
  language: ko
  text: 이제 제가 제 하나님께 감사드립니다. 하나님께서 이 날을 제가 보게 해 주셨기 때문입니다. 보십시오, 저는 백칠십오 세로 나이가 많고 날수가 찼으며, 제 모든 날이 평안했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘날수가 찼으며’는 문자적으로 ‘날들이 충만하며/완전하며’라는 뜻으로, 충분히 긴 삶을 살아 생애가 충만한 상태에 이르렀음을 나타냅니다.
    reason: 원문의 ‘complete/full in days’를 자연스러운 한국어 관용 표현으로 옮긴 의미를 밝힙니다.
lexical_decisions:
- source_word: አትኃነይ / አነ፡
  english_pob_choice: I thank you / my God
  chosen_korean: 감사드립니다 / 나의 하나님
  alternatives_korean:
  - 감사합니다
  - 감사하나이다
  - 감사드립니다, 제 하나님
  lexicon: 감사하다; 하나님
  rationale: 게에즈 원문의 1인칭 감사 진술과 호격 ‘나의 하나님’을 자연스러운 현대 합쇼체로 옮기되, 직접적인 하나님 호칭은 소유격을 살려 유지했습니다.
- source_word: አርአይከኒ
  english_pob_choice: you have shown me this day
  chosen_korean: 당신께서 이 날을 제게 보여 주셨기 때문입니다
  alternatives_korean:
  - 당신께서 이 날을 제게 나타내 주셨기 때문입니다
  - 당신께서 오늘을 제게 보이셨기 때문입니다
  lexicon: 보이다; 날
  rationale: 원문의 ‘보여 주다/드러내다’ 계열 의미를 따라, 영어 POB의 ‘shown me this day’를 직역에 가깝게 살렸습니다.
- source_word: ዛተ፡ ዕለተ፡ ናሁ፡ አነ፡ ወልደ፡ ፻ወ፸ወ፭ ክረምት፡ አሂቅ፡ ወፍጹመ፡ መዋዕል፡
  english_pob_choice: Behold, I am one hundred seventy-five years old, advanced and complete in days
  chosen_korean: 보십시오, 저는 백칠십오 세이며, 나이가 많고 날들이 충만하며
  alternatives_korean:
  - 보십시오, 저는 백칠십오 세이며, 늙었고 날들이 충만하며
  - 보십시오, 저는 백칠십오 세이며, 고령이고 날들이 충만하며
  lexicon: 보십시오; 백칠십오 세; 날들이 충만하다
  rationale: ‘Behold’는 서술 전환 표지로 ‘보십시오’를 택했고, ‘advanced’는 나이 듦을 드러내는 표현으로 풀어 ‘나이가 많고’로 옮겼습니다.
- source_word: ኮናኒ፡ ሰላመ።
  english_pob_choice: all my days have been peace
  chosen_korean: 제 모든 날은 평강이었습니다
  alternatives_korean:
  - 제 모든 날은 평안이었습니다
  - 내 모든 날은 평강이었습니다
  lexicon: 평강
  rationale: 원문의 완료된 삶 전체를 가리키는 문장을 한국어에서 자연스럽게 종결하면서, POB의 ‘peace’에 맞춰 ‘평강’을 유지했습니다.
theological_decisions:
- issue: 노년과 삶의 총체를 나타내는 표현의 직역성
  chosen_reading: ‘완전하다’는 단순한 생물학적 건강이 아니라 삶이 마무리 단계에 들어선 충만함으로 이해하여 ‘날들이 충만하며’로 옮겼습니다.
  alternative_readings:
  - ‘완전하고’
  - ‘때가 찼고’
  rationale: 원문은 나이와 함께 삶의 충만함을 병치하므로, 한국어에서도 죽음 직전의 상태를 암시하는 완결감과 나이 듦을 함께 보존하는 것이 적절합니다.
  doctrine_reference: 성경 인물의 죽음 직전 고백을 생애의 충만함으로 서술하는 서사 문맥
