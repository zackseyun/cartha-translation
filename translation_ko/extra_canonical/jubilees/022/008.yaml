revisions:
- from: 지금 저는 당신께 감사드립니다, 나의 하나님. 당신께서 이 날을 제게 보여 주셨기 때문입니다. 보십시오, 저는 백칠십오 세이며, 나이가 많고 날들이 충만하며, 제 모든 날은 평강이었습니다.[a]
  to: 이제 제가 제 하나님께 감사드립니다. 하나님께서 이 날을 제가 보게 해 주셨기 때문입니다. 보십시오, 저는 백칠십오 세로 나이가 많고 날수가 찼으며, 제 모든 날이 평안했습니다.[a]
  rationale: 현대 합쇼체의 자연스러움을 높이면서 게에즈어와 영어 POB의 모든 핵심 요소를 유지했습니다. 특히 ‘complete in days’를 한국어 관용구 ‘날수가 차다’로 옮겨 삶의 충만함과 완결감을 보존했고, 평화의 진술은 자연스러운 서술로 다듬었습니다.
