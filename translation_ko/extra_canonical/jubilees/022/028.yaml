  text: And both of them lay down together on one bed[28], and Jacob slept in the bosom of Abraham, his father’s father. And he kissed him seven times, and his compassion and his heart rejoiced over him.
  footnotes:
  - marker: '28'
    text: The final clause is difficult; the sense is that Abraham's affection and inward disposition remained warmly fixed on Jacob.
    reason: segmentation_note
  - marker: a
    text: Or 'and his compassion and his heart were upon him.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 둘은 한 침상에 함께 누웠으며, 야곱은 자기 아버지의 아버지인 아브라함의 품에서 잠들었습니다. 아브라함은 야곱에게 일곱 번 입을 맞추었고, 그의 긍휼과 마음은 야곱을 두고 기뻐하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절은 표현이 어렵습니다. 직역하면 ‘그의 긍휼과 그의 마음이 그를 두고 기뻐하였다’이며, 아브라함의 깊은 애정과 내면의 기쁨이 야곱에게 향했음을 나타냅니다.
    reason: segmentation_note
lexical_decisions:
- source_word: ወሰከቡ፡ ክልኤሆሙ፡ ኅቡረ፡ ውስተ፡ ዐራት፡ አሐቲ፡
  english_pob_choice: And both of them lay down together on one bed
  chosen_korean: 둘 다 한 침상에 함께 누웠고
  alternatives_korean:
  - 둘이 함께 한 침상에 누웠고
  - 두 사람 모두 한 침상에 함께 누웠고
  lexicon: 침상
  rationale: 원문과 POB가 모두 ‘one bed’의 장면성을 유지하므로, 현대 한국어에서는 ‘침상’이 문맥상 자연스럽고 지나친 해석 없이 공간적 이미지를 살립니다.
- source_word: ውስተ፡ ሕፅነ፡ አብርሃም፡ አቡ፡ አቡሁ፡
  english_pob_choice: Jacob slept in the bosom of Abraham, his father’s father
  chosen_korean: 야곱은 그의 아버지의 아버지 아브라함의 품에서 잠들었습니다
  alternatives_korean:
  - 야곱은 그의 아버지의 아버지 아브라함의 품속에서 잠들었습니다
  - 야곱은 그의 할아버지 아브라함의 품에서 잠들었습니다
  lexicon: 품
  rationale: ‘bosom’의 친밀성과 보호 이미지를 살리기 위해 ‘품’으로 옮겼고, 친족 관계는 원문에 맞추어 ‘아버지의 아버지’로 유지했습니다.
- source_word: ወሰዐሞ፡ ስብዐ፡
  english_pob_choice: And he kissed him seven times
  chosen_korean: 그리고 그는 그에게 일곱 번 입을 맞추었으며
  alternatives_korean:
  - 그리고 그는 그에게 일곱 번 키스하였으며
  - 그리고 그는 그에게 일곱 번 입맞춤하였으며
  lexicon: 입을 맞추다
  rationale: 반복적 접촉과 친애의 동작을 한국어에서 가장 자연스럽게 드러내는 표현으로 ‘입을 맞추다’를 선택했습니다.
- source_word: ወትሤ*ሖ፡ ምሕረቱ፡ ወልቡ፡ ላዕሌሁ፡
  english_pob_choice: and his compassion and his heart rejoiced over him
  chosen_korean: 그의 불쌍히 여김과 그의 마음이 그를 기뻐하였습니다
  alternatives_korean:
  - 그의 자비와 그의 마음이 그를 기뻐하였습니다
  - 그의 긍휼과 그의 마음이 그를 기뻐하였습니다
  lexicon: 불쌍히 여김
  rationale: 후반부는 POB의 최종 채택처럼 ‘rejoiced over him’이 동사 의미이므로 그대로 반영하되, ምሕረቱ는 전통 교회어를 과도하게 끌어오지 않고 ‘불쌍히 여김’으로 비교적 직역했습니다.
theological_decisions:
- issue: 감정/내적 태도의 병렬 표현을 어떻게 살릴 것인가
  chosen_reading: ‘그의 불쌍히 여김과 그의 마음이 그를 기뻐하였습니다’로, 정서적 애정과 내적 기쁨의 병렬을 보존했습니다.
  alternative_readings:
  - ‘그의 긍휼과 그의 마음이 그를 기뻐하였습니다’
  - ‘그의 자비와 그의 마음이 그를 기뻐하였습니다’
  rationale: 원문은 단순한 감정 표지가 아니라 아브라함의 내면이 야곱에게 향해 있음을 강조하므로, 두 요소를 모두 드러내는 쪽을 택했습니다.
  doctrine_reference: 서사 본문의 심리 묘사 보존
- issue: 친족 호칭을 현대화할 것인가
  chosen_reading: ‘그의 아버지의 아버지 아브라함’으로 원문 관계를 그대로 유지했습니다.
  alternative_readings:
  - ‘그의 할아버지 아브라함’
  - ‘조부 아브라함’
  rationale: 원문은 친족 관계를 반복해 강조하므로, 자연스러움보다 서술의 직접성을 우선했습니다.
  doctrine_reference: 원문 구조 보존
