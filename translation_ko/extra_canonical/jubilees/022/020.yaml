- from: 그들은 깨닫는 마음이 없고, 그들의 눈은 자기들이 만든 것을 보지 못하며, 나무에게는 “너는 나의 신이다”라고, 돌에게는 “너는 나의 주이며 나의 구원자다”라고 말하면서 어떻게 그들이 길을 잃는지 알지 못합니다. 그들에게는 마음이 없습니다.
  to: 그들은 깨달을 마음이 없고, 그들의 눈은 자기들이 만든 것을 보지 못하며, 나무에게는 “너는 나의 신이다”라고, 돌에게는 “너는 나의 주이며 나의 구원자다”라고 말할 때 그들이 어떻게 길을 잃는지도 보지 못합니다. 그들에게는 마음이 없습니다.
  rationale: ‘눈은 보지 못한다’라는 원문의 비유와 그것이 ‘자기들이 만든 것’ 및 ‘그들이 어떻게 길을 잃는지’에 함께 걸리는 구조를 한국어에서 유지하도록 수정했습니다. 우상에게 돌리는 호칭과 마지막의 반복은 그대로 보존했습니다.
