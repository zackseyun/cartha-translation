  text: They have no heart to understand, and their eyes do not see what they have made, and how they go astray when they say to wood, ‘You are my god,’ and to stone, ‘You are my lord and my deliverer.’ And they have no heart.
translation:
  language: ko
  text: 그들은 깨닫는 마음이 없고, 그들의 눈은 자기들이 만든 것을 보지 못하며, 나무에게는 “너는 나의 신이다”라고, 돌에게는 “너는 나의 주이며 나의 구원자다”라고 말하면서 어떻게 그들이 길을 잃는지 알지 못합니다. 그들에게는 마음이 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ለሐልዮ
  english_pob_choice: no heart to understand
  chosen_korean: 깨닫는 마음이 없고
  alternatives_korean:
  - 이해할 마음이 없고
  - 분별하는 마음이 없고
  - 생각하는 마음이 없고
  lexicon: heart
  rationale: Ge‘ez의 ‘마음/심장’ 계열 표현을 단순한 감정이 아니라 이해와 분별의 내적 능력으로 읽어, POB의 의미를 자연스럽게 살려 옮겼습니다.
- source_word: አዕይንቲሆሙ፡ ዘይሬኢ፡ ምንተ፡ ገብሮሙ
  english_pob_choice: their eyes do not see what they have made
  chosen_korean: 그들의 눈은 자기들이 만든 것을 보지 못하며
  alternatives_korean:
  - 그들의 눈은 그들이 행한 것을 보지 못하며
  - 그들의 눈은 자기들의 작품을 보지 못하며
  - 그들의 눈은 자기들이 만든 바를 보지 못하며
  lexicon: eyes / made
  rationale: 수동적 결과물보다 직접 행위의 산물인 ‘만든 것’이 원문과 POB의 수정 취지를 가장 정확히 반영합니다.
- source_word: ለዕፅ ... ለእብን
  english_pob_choice: to wood ... and to stone
  chosen_korean: 나무에게는 … 돌에게는
  alternatives_korean:
  - 목재에게는 … 돌에게는
  - 목상에게는 … 석상에게는
  - 나무 조각에게는 … 돌에게는
  lexicon: wood / stone
  rationale: 원문의 물질 대상을 그대로 유지해 우상숭배의 물리성을 드러내되, 한국어로는 자연스러운 ‘나무/돌’로 옮겼습니다.
- source_word: አምላኪየ / እግዚእየ / መባሕሕየ
  english_pob_choice: my god / my lord and my deliverer
  chosen_korean: 나의 신이다 / 나의 주이며 나의 구원자다
  alternatives_korean:
  - 나의 하나님이다 / 나의 주님이며 나의 구원자다
  - 나의 신이다 / 나의 주님과 나의 구원자다
  - 나의 신이다 / 나의 주이며 나를 건져 주는 분이다
  lexicon: god / lord / deliverer
  rationale: 우상에게 붙이는 호칭이므로 ‘하나님’ 대신 ‘신’을 유지하고, ‘deliverer’는 ‘구원자’로 옮겨 구조와 의미를 함께 살렸습니다.
theological_decisions:
- issue: 우상에게 쓰인 호칭의 직역 여부
  chosen_reading: 나무와 돌을 향한 고백을 ‘나의 신 / 나의 주 / 나의 구원자’로 직접 옮겨 우상숭배의 언어적 충돌을 보존했습니다.
  alternative_readings:
  - ‘나의 하나님 / 주님 / 구원자’로 완화하여 옮김
  - ‘나의 신 / 주인 / 건져 주는 이’로 설명적으로 옮김
  rationale: 본문은 우상에게 종교적·구원론적 칭호를 덧씌우는 어리석음을 드러내므로, 이를 순화하지 않고 그대로 드러내는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 우상숭배 비판과 피조물-창조주 구분
