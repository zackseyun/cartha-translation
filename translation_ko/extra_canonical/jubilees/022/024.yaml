review_pass:
  verdict: revise
  source_fidelity: ‘부정한 자들’은 게에즈어 ጽሉአን의 핵심 의미와 맞지 않습니다. 제공된 원어 및 영어 감사 기록에 따르면 이 말은 ‘부정한/의례적으로 더러운’(unclean)보다는 ‘불경한, 혐오스러운, 속된’ 계열을 가리킵니다. ‘불경한 자들’로 옮기고 대안 독법은 각주로 남기는 것이 안전합니다. 스올과 심판의 장소를 구별한 번역, 우상 숭배자에 대한 반복, 그리고 소돔의 아들들의 제거와의 비교는 충실합니다.
  naturalness: ‘산 자들의 땅’은 ‘살아 있는 땅’보다 현대 표준 한국어 성서 문체에서 자연스럽고 의미도 분명합니다. ‘아무 기념도 남기지 못할 것입니다’는 원문의 ‘땅 위에 기억됨이 없다’를 자연스럽게 전달합니다. 전체 문장은 합쇼체로 일관됩니다.
  terminology: ‘스올’은 음역으로 유지하여 ‘심판의 장소’와 구별해야 합니다. ጽሉአን은 본문에서 ‘불경한 자들’로 번역하고, ‘부정한 자들’은 가능한 대안으로만 각주 처리합니다. ‘심판의 자리’와 ‘제거될 것입니다’는 각각 መካነ፡ ደይን 및 반복되는 제거 동작을 적절히 반영합니다.
