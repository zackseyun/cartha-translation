  yaml_path: translation/extra_canonical/jubilees/022/024.yaml
  text: And for all who worship idols and for the profane[24], there is no hope in the land of the living; for they will go down to Sheol, and they will go to the place of judgment, and they will have no memorial upon the earth. As the sons of Sodom were removed from the earth, so all who worship idols will be removed.
  footnotes:
  - marker: '24'
    text: The term 'Sheol' is retained rather than translated as 'hell' or 'grave' because the text distinguishes descent to Sheol from entry into a 'place of judgment.'
    reason: alternative_reading
  - marker: a
    text: Or 'the unclean'.
    reason: previous_rendering
translation:
  language: ko
  text: 우상들을 섬기는 모든 사람과 그 부정한 자들[a]에게는 살아 있는 땅에서 아무 소망이 없습니다. 그들은 스올로 내려가며, 심판의 자리로 가고, 땅 위에서 아무 기념도 남기지 못할 것입니다. 소돔의 아들들이 땅에서 제거된 것처럼, 우상들을 섬기는 모든 사람도 그렇게 제거될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጣዖተ / idols
  english_pob_choice: worship idols
  chosen_korean: 우상들을 섬기는
  alternatives_korean:
  - 우상들을 숭배하는
  - 우상에게 경배하는
  lexicon: idolatry
  rationale: Geez 원문은 우상숭배 행위를 가리키므로, 단순히 ‘우상’보다 행위를 드러내는 ‘우상들을 섬기는’이 문맥을 더 분명히 살립니다.
- source_word: ጽሉአን
  english_pob_choice: the profane / the unclean
  chosen_korean: 그 부정한 자들
  alternatives_korean:
  - 그 불경한 자들
  - 그 혐오스러운 자들
  - 그 더러운 자들
  lexicon: ṣeluʾān
  rationale: 주석 전통상 ‘unclean’은 어휘적으로 맞지 않으므로, ‘hated / odious / profane’ 계열을 반영하는 한국어로 옮기되, 읽기 자연성을 위해 ‘부정한 자들’을 택했습니다.
- source_word: ሲኦል
  english_pob_choice: Sheol
  chosen_korean: 스올
  alternatives_korean:
  - 지옥
  - 음부
  lexicon: Sheol
  rationale: 원문과 EN POB의 구분을 따라, 여기서는 종말론적 ‘지옥’이 아니라 스올을 음역하여 보존했습니다.
- source_word: መካነ፡ ደይን
  english_pob_choice: the place of judgment
  chosen_korean: 심판의 자리
  alternatives_korean:
  - 심판의 장소
  - 재판의 자리
  lexicon: judgment place
  rationale: 직역된 ‘심판의 장소’도 가능하지만, 한국어로는 ‘자리’가 보다 자연스럽게 장소성과 판결의 맥락을 함께 전달합니다.
- source_word: ይትነሥኡ / ይወርዱ
  english_pob_choice: will be removed / go down
  chosen_korean: 내려가며 … 제거될 것입니다
  alternatives_korean:
  - 내려가며 … 사라질 것입니다
  - 내려가며 … 없애질 것입니다
  lexicon: motion and removal
  rationale: 원문은 ‘내려감’과 ‘제거됨’의 반복으로 운율을 이루므로, 두 동작을 구분해 살리면서도 같은 종말을 강조하도록 옮겼습니다.
theological_decisions:
- issue: ‘지옥’ 대신 ‘스올’ 유지
  chosen_reading: 죽은 자들의 처소를 가리키는 스올을 음역으로 보존했습니다.
  alternative_readings:
  - 지옥
  - 무덤
  rationale: 본문은 스올과 ‘심판의 자리’를 구별하므로, 후속 심판 개념과 섞이지 않도록 ‘스올’로 유지하는 것이 문맥에 충실합니다.
  doctrine_reference: 사후 상태와 최종 심판의 구별
- issue: ‘부정한 자들’의 윤리적/의례적 뉘앙스 보존
  chosen_reading: 단순한 도덕적 비난보다 소스어의 혐오·배척 뉘앙스를 살렸습니다.
  alternative_readings:
  - 불경한 자들
  - 더러운 자들
  rationale: Geez 어휘는 ‘깨끗하지 않음’과는 다르므로, 의례적·도덕적 타락이 함께 드러나는 표현을 선택했습니다.
  doctrine_reference: 성결/부정 개념의 어휘 구분
