    rationale: 감사 기록은 해당 어휘를 ‘hated ones/odious/profane’ 계열로 판정하며, ‘unclean’은 별개의 어휘 개념이라고 지적합니다. 따라서 ‘부정한’은 본문 번역으로는 어휘적 불일치입니다.
  - severity: low
    issue: 스올의 의미를 설명하는 각주 표지가 본문에 없습니다.
    rationale: 영어 POB 감사본은 스올을 지옥이나 무덤으로 번역하지 않은 이유와 ‘심판의 장소’와의 구별을 각주로 명시합니다. 한국어에도 해당 표지를 두어 용어 선택을 투명하게 하는 것이 좋습니다.
