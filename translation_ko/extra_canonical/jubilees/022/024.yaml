- from: 우상들을 섬기는 모든 사람과 그 부정한 자들[a]에게는 살아 있는 땅에서 아무 소망이 없습니다. 그들은 스올로 내려가며, 심판의 자리로 가고, 땅 위에서 아무 기념도 남기지 못할 것입니다. 소돔의 아들들이 땅에서 제거된 것처럼, 우상들을 섬기는 모든 사람도 그렇게 제거될 것입니다.
  to: 우상들을 섬기는 모든 이와 불경한 자들[a]에게는 산 자들의 땅에서 아무 소망이 없습니다. 그들은 스올[24]로 내려가며, 심판의 자리로 가고, 땅 위에서 아무 기념도 남기지 못할 것입니다. 소돔의 아들들이 땅에서 제거된 것처럼, 우상들을 섬기는 모든 이도 그렇게 제거될 것입니다.
  rationale: 원문의 ጽሉአን을 ‘불경한 자들’로 바로잡아 ‘부정한/unclean’과의 어휘 혼동을 피했습니다. 대안 독법은 각주에 보존했습니다. 또한 스올의 음역 및 심판의 자리와의 구별을 설명하는 각주를 추가하고, ‘살아 있는 땅’을 더 자연스러운 ‘산 자들의 땅’으로 다듬었습니다.
