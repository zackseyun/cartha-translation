  revised_text: '유다복음 — 배반[a]



    예수께서 말씀하셨습니다. “진실로 내가 말합니다. 내 이름으로 [그들이 받은] 이 세례는 […] 땅에 속한 아담의 온 세대를 멸망시킬 것입니다.[b] 내일 그들은 나를 지닌 이를 고문할 것입니다. 진실로 내가 너희에게 [말합니다]. 어떤 죽을 운명의 인간의 손도 내게 [닿지] 않을 것입니다. 진실로 [내가 그대에게 말합니다], 유다여. 사클라스에게 제물을 바치는 자들은 […] 온갖 악한 것. 그러나 그대는 그들 모두보다 더할 것입니다. 그대가 나를 지닌 인간을 제물로 바칠 것이기 때문입니다. 그대의 뿔은 이미 높이 들렸고, 그대의 분노는 불붙었으며, 그대의 별은 떠올랐고, 그대의 마음은 [빗나갔습니다]. 진실로 [내가 그대에게 말합니다]. 그대의 마지막 [… 그리고] 그 영역의 [… 보좌들은] [패배했고], 왕들은 힘을 잃었으며, 천사들의 세대들은 슬퍼했고, 악은 [그들이 뿌린 …] 멸망했으며, [통치자]는 사라졌습니다. [그리고] 그때 아담의 위대한 세대의 [열매]가 높여질 것입니다. 하늘과 땅과 천사들 앞에 그 영역들에서 나온 그 세대가 존재하기 때문입니다. 보십시오. 그대는 모든 것을 들었습니다. 눈을 들어, 그 안에 빛이 있고 둘레에는 별들이 있는 구름을 보십시오. 앞장서 가는 별이 바로 그대의 별입니다.”



    그러자 유다는 눈을 들어 빛나는 구름을 보았고, 그 안으로 들어갔습니다. 땅에 서 있던 사람들은 구름 속에서 이런 음성을 들었습니다. “[… 그] 위대한 [세대 …] 그리고 […].” 그 뒤 유다는 더 이상 예수를 보지 못했습니다.



    곧 [유대인들] 사이에 […]보다 더 큰 소동이 일어났습니다. 그들의 대제사장들은 그가 기도하려고 객실에 들어갔다고 하여 불평했습니다. 그러나 몇몇 서기관은 그가 기도하는 동안 그를 붙잡으려고 그곳에서 눈여겨 지켜보고 있었습니다. 그들은 백성을 두려워했기 때문입니다. 백성이 모두 그를 예언자로 여겼던 것입니다.



    그들이 유다에게 다가와 말했습니다. “당신은 여기서 무엇을 하고 있소? 당신은 예수의 제자가 아니오?”



