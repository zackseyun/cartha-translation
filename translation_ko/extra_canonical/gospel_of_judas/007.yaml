translation:
  language: ko
  text: '유다복음 — 배반[a]


    예수께서 말씀하셨습니다. “진실로 [너희에게] 말합니다. 내 이름으로 [그들이 받은] 이 세례는 […] 땅에 속한 아담의 온 세대를 멸망시킬 것입니다.[b] 내일 그들은 나를 지닌 이를 고문할 것입니다. 진실로 [내가] 너희에게 [말합니다]. 죽을 수밖에 없는 인간의 손은 아무도 [내게 닿지] 못할 것입니다. 진실로 [내가] 그대에게 말합니다, 유다여. 사클라스에게 제물을 바치는 자들은 […] 온갖 악한 일을 합니다. 그러나 그대는 그들 모두보다 더한 일을 할 것입니다. 그대가 나를 지닌 인간을 제물로 바칠 것이기 때문입니다. 그대의 뿔은 이미 높이 들렸고, 그대의 분노는 불붙었으며, 그대의 별은 떠올랐고, 그대의 마음은 [빗나갔습니다]. 진실로 [내가 그대에게 말합니다]. 그대의 마지막 [… 그리고] […] 영역의 [보좌들은 패배했고], 왕들은 힘을 잃었으며, 천사들의 세대들은 슬퍼했고, 그들이 [뿌린] 악은 […] 멸망했으며, [통치자]는 사라졌습니다. [그리고] 그때 아담의 위대한 세대의 [열매]가 높여질 것입니다. 하늘과 땅과 천사들이 있기 전부터 그 영역들에서 나온 그 세대가 존재하기 때문입니다. 보십시오. 그대는 모든 것을 들었습니다. 눈을 들어, 그 안에 빛이 있고 둘레에는 별들이 있는 구름을 보십시오. 앞장서 가는 별이 바로 그대의 별입니다.”


    그러자 유다는 눈을 들어 빛나는 구름을 보았고, 그 안으로 들어갔습니다. 땅에 서 있던 사람들은 구름 속에서 이런 음성이 들려오는 것을 들었습니다. “[… 그] 위대한 [세대 …] 그리고 […].” 그 뒤 유다는 더 이상 예수를 보지 못했습니다.


    곧 [유대인들] 가운데 […]보다 더 큰 소동이 일어났습니다. 그들의 대제사장들은 예수께서 기도하려고 객실에 들어가셨다며 못마땅해했습니다. 그러나 몇몇 서기관은 예수께서 기도하실 때 그분을 붙잡으려고 그곳에서 눈여겨 지켜보고 있었습니다. 그들은 백성을 두려워했기 때문입니다. 백성이 모두 예수를 예언자로 여겼던 것입니다.


    그들이 유다에게 다가와 말했습니다. “당신은 여기서 무엇을 하고 있소? 당신은 예수의 제자가 아니오?”


    그러자 유다는 그들이 바라는 대로 대답했습니다. 그 뒤 유다는 얼마의 돈을 받고 그를 그들에게 넘겨주었습니다.[c]


    유다복음


    [a] 이 번역은 콥트어 사본 자체에 대한 직접 검토가 아직 이루어지지 않은 상태에서, 제시된 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역입니다.


    [b] 대괄호는 훼손된 사본에서 복원되었거나 문맥상 보충된 말을, 줄임표는 글자가 없어져 읽을 수 없는 부분을 나타냅니다.


    [c] “그를”이 가리키는 이는 문맥상 예수이지만, 원문의 대명사 표현을 그대로 살렸습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 콥트어 사본 자체에 대한 직접 검토가 아직 이루어지지 않은 상태에서, 제시된 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역입니다.
    reason: 직접 원어 검토가 보류된 자료적 한계를 투명하게 알립니다.
  - marker: b
    text: 대괄호는 훼손된 사본에서 복원되었거나 문맥상 보충된 말을, 줄임표는 글자가 없어져 읽을 수 없는 부분을 나타냅니다.
    reason: 사본의 결락과 편집적 복원을 독자가 구별할 수 있게 합니다.
  - marker: c
    text: “그를”이 가리키는 이는 문맥상 예수이지만, 원문의 대명사 표현을 그대로 살렸습니다.
    reason: 대명사의 지시 대상을 설명하면서 본문의 표현 형식을 보존합니다.
lexical_decisions:
- source_word: baptism
  choice: 세례
  rationale: 현대 한국어 독자가 이해하는 표준 종교 용어를 사용하되, 본문이 세례를 부정적으로 말하는 긴장은 그대로 보존했습니다.
- source_word: the one / human who bears me
  choice: 나를 지닌 이 / 나를 지닌 인간
  rationale: 예수와 육체를 구별하는 듯한 본문의 특이한 표현을 ‘나의 몸’ 등으로 해석해 버리지 않고 직역에 가깝게 보존했습니다.
- source_word: Saklas
  choice: 사클라스
  rationale: 고유명사를 음역하여 특정한 교리적 정체를 번역문 안에서 단정하지 않았습니다.
- source_word: generation
  choice: 세대
  rationale: 혈통·종족·세대의 의미 가능성을 닫지 않으면서 문서 전반의 반복어를 일관되게 드러냅니다.
- source_word: realm(s)
  choice: 영역(들)
  rationale: 우주론적 의미를 담을 수 있으나 ‘천상계’처럼 해석적으로 좁히지 않는 중립적 표현을 택했습니다.
- source_word: horn
  choice: 뿔
  rationale: 권세나 위세를 뜻할 수 있는 상징을 풀이로 대체하지 않고 원문의 형상을 보존했습니다.
- source_word: handed him over
  choice: 그를 그들에게 넘겨주었습니다
  rationale: 문맥상 배반을 나타내면서도 원문의 대명사와 행위 표현을 유지했습니다.
theological_decisions:
- issue: 예수를 ‘지닌’ 인간과 예수의 관계
  choice: ‘나를 지닌 인간’으로 표현
  alternative: ‘나의 육신’ 또는 ‘내가 입은 몸’
  rationale: 본문의 인간론·그리스도론적 긴장을 특정 교리 체계로 해소하지 않기 위해 원문의 독특한 표현을 유지했습니다.
- issue: 유다의 행위가 칭찬인지 비난인지
  choice: ‘모두보다 더한 일을 할 것’이라는 비교의 방향을 열어 둠
  alternative: ‘모두를 능가할 것’ 또는 ‘그들보다 더 악할 것’
  rationale: 문맥에는 탁월함과 가중된 악행이라는 두 방향의 긴장이 있으므로 가치 판단을 번역에 덧붙이지 않았습니다.
- issue: 유다의 별과 빛나는 구름
  choice: 환상 장면을 평가 없이 그대로 서술
  alternative: 유다의 구원·승천 또는 정죄로 명시
  rationale: 손상된 본문만으로 장면의 최종 신학적 의미를 확정하지 않았습니다.
- issue: 마지막 대명사의 지시 대상
  choice: ‘그를’ 유지하고 각주에서 문맥상 예수임을 밝힘
  alternative: 본문에서 곧바로 ‘예수를’로 명시
  rationale: 독해에는 도움을 주되 원문의 대명사 형식과 남은 미세한 모호성을 본문에서 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 예수의 직접 발화에는 ‘그대’를 써서 존중과 거리감을 함께 나타냈고, 서술은 평이하고 자연스럽게 다듬었습니다. 사본의 대괄호와 줄임표를 보존했으며, 손상된 구절은 매끄럽게 재구성하지 않았습니다.
