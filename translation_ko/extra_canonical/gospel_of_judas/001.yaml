  yaml_path: translation/extra_canonical/gospel_of_judas/001.yaml
  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: ko
  text: '이것은 예수께서 가룟 유다와 여드레 동안 나누신 심판의 비밀 말씀입니다. 이 일은 그분이 유월절을 지키시기 사흘 전에 있었습니다.[a]


    그분이 땅에 나타나셨을 때, 인류를 구원하기 위해 표징들과 큰 기적들을 행하셨습니다. 어떤 이들은 의의 길을 [걸었지만],[b] 다른 이들은 자기들의 범법 가운데 걸었습니다. 그리하여 열두 제자가 부름을 받았습니다. 예수께서는 그들에게 세상 너머의 신비들과 마지막에 일어날 일을 말씀하기 시작하셨습니다. 그분은 제자들에게 자신을 드러내지 않으실 때가 많았으며, 그럴 때면 그들 가운데서 어린아이의 모습으로 발견되곤 하셨습니다.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 문장의 시간 표현은 ‘여드레 동안’과 ‘유월절을 지키시기 사흘 전’의 관계가 분명하지 않습니다. 번역문은 이를 임의로 조정하지 않았습니다.
    reason: 원문 검토가 아직 이루어지지 않은 영어 번역 증언 자체의 시간적·구문적 모호성을 알립니다.
  - marker: b
    text: 대괄호는 사본의 훼손된 부분을 번역자가 복원했거나 그 읽기가 불확실함을 나타냅니다.
    reason: 제공된 증언의 본문 비평 표지를 그대로 보존합니다.
  - marker: c
    text: ‘어린아이의 모습으로’라는 말이 외모의 변화, 다른 방식의 나타남, 또는 상징적 표현 가운데 무엇을 뜻하는지는 본문만으로 확정하기 어렵습니다.
    reason: 현현에 관한 신학적 긴장을 특정 해석으로 해소하지 않습니다.
lexical_decisions:
- source_word: secret message of judgment
  choice: 심판의 비밀 말씀
  rationale: ‘message’를 문맥에 맞게 ‘말씀’으로 옮기되, ‘심판의’라는 속격이 지닌 관계의 모호성을 풀어 쓰지 않고 보존했습니다.
- source_word: spoke with
  choice: …와 … 나누신
  rationale: 일방적으로 선포했다기보다 유다와 주고받은 담화라는 뜻을 자연스러운 한국어로 나타냈습니다.
- source_word: signs and great wonders
  choice: 표징들과 큰 기적들
  rationale: 두 표현을 구별하여 보존하고, 종교 문헌에서 이해 가능한 현대적 용어를 선택했습니다.
- source_word: transgression
  choice: 범법
  rationale: 단순한 실수보다 규범을 어긴 상태를 가리키는 표현으로 옮겼습니다.
- source_word: mysteries beyond the world
  choice: 세상 너머의 신비들
  rationale: ‘beyond’의 공간적·초월적 여지를 해석으로 제한하지 않고 살렸습니다.
- source_word: as a child
  choice: 어린아이의 모습으로
  rationale: 어린아이와 동일하다는 뜻인지 그렇게 보였다는 뜻인지 단정하지 않으면서 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘judgment’가 가리키는 관계
  choice: 심판의 비밀 말씀
  alternative: 심판에 관한 비밀 말씀 / 판결의 비밀 기록
  rationale: 속격의 의미를 특정한 교리적 심판이나 판결문으로 한정하지 않았습니다.
- issue: 열두 제자가 부름받은 이유를 나타내는 연결어
  choice: 그리하여
  alternative: 그러므로 / 그래서
  rationale: 앞선 의인과 범법자의 대조가 부름의 직접적인 신학적 원인이라고 강하게 단정하지 않으면서도 원문의 서사적 연결을 유지했습니다.
- issue: 예수께서 자신을 드러내지 않으셨다는 표현
  choice: 자신을 드러내지 않으실 때가 많았으며
  alternative: 자신의 본모습을 드러내지 않으셨으며
  rationale: ‘본모습’ 같은 형이상학적 해석을 덧붙이지 않고 현현의 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되 고대 종교 문헌의 서문에 어울리는 절제되고 품위 있는 문체를 유지했습니다. 현재 초안은 제공된 공개 영역 영어 번역 증언에 근거한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 필요합니다.
