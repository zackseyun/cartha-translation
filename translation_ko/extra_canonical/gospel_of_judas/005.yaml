  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: ko
  text: '예수께서는 이 말씀을 [하시고] 그곳을 떠나시며 가룟 유다를 [데리고] 가셨습니다. 예수께서 그에게 말씀하셨습니다. “높이 솟은 산의 물은 […]에서 [나온다]. 그것은 이 세대의 [열매 …] 나무의 [우물에 … 물을 대려고] 온 것이 아니며, […] 얼마 뒤에 […]. 오히려 하나님의 낙원과 썩지 않는 [열매]에 물을 대려고 왔다. [그것은] 그 세대의 [삶의 방식]을 썩게 하지 않을 것이며, [영원히 존재할] 것이기 때문이다.”[a]


    유다가 [예수께 말했습니다. “말씀해] 주십시오. 이 세대에는 어떤 열매가 있습니까?”


    예수께서 말씀하셨습니다. “사람의 모든 세대에 속한 영혼들은 죽을 것이다. 그러나 이 사람들이 왕국에서 정해진 때를 다 채우고 영이 그들을 떠나면, 그들의 몸은 죽어도 영혼은 살아서 위로 들려 올라갈 것이다.”[b]


    유다가 말했습니다. “그러면 나머지 사람의 세대들은 어떻게 되겠습니까?”


    예수께서 말씀하셨습니다. “[바위]에 씨를 뿌리고 그 열매를 거둘 수는 없다. 마찬가지로, [더럽혀진] 종족과 썩어 없어질 지혜[와], 죽을 인간을 만든 손에 [씨를 뿌려] 그들의 영혼이 위의 영역들로 올라가게 할 수도 없다.[c] [진실로] 내가 너에게 말한다. 어떤 [통치자]도, 천사도, [권세]도 이 [위대한] 거룩한 세대가 [보게 될 곳들]을 볼 수 없을 것이다.” 예수께서는 이 말씀을 하시고 떠나셨습니다.


    유다가 말했습니다. “선생님, 선생님께서 그들 모두의 말을 들어 주셨듯이 이제 제 말도 들어 주십시오. 제가 큰 환상을 보았습니다.”


    그러나 예수께서는 이 말을 들으시고 웃으셨습니다. 그리고 유다에게 말씀하셨습니다. “열셋째 악령아, 어찌하여 그렇게 격앙되어 있느냐? 그래도 말해 보아라. 내가 너를 참아 주겠다.”[d]


    유다가 예수께 말했습니다. “환상 속에서 저는 제 모습을 보았습니다. 열두 제자가 저에게 돌을 던지며 [빠르게 저를] 뒤쫓고 있었습니다. 저는 또 제가 선생님을 [따라갔던] 곳에 이르렀습니다. 그곳에서 [한 집을 보았는데], 제 눈으로도 그 크기를 [잴] 수 없었습니다. 위대한 사람들이 그 집을 둘러싸고 있었고, 그 집에는 푸른 지붕이 있었습니다. 집 한가운데에는 [무리가 …] 있었습니다. 선생님, 저도 이 사람들과 함께 들어가게 해 주십시오!”


    [예수께서] 대답하셨습니다. “유다야, 네 별이 너를 그릇된 길로 이끌었다. 네가 본 집에 들어갈 자격이 있는, 죽을 존재로 태어난 사람은 아무도 없다. 그곳은 거룩한 이들을 위하여 마련되어 있기 때문이다. 그곳에서는 해도 달도 낮도 다스리지 않을 것이며, 거룩한 이들은 거룩한 천사들과 함께 그 영역에 언제나 서 있을 것이다. 보아라, 나는 너에게 왕국의 신비들을 알려 주었고, 별들의 오류와 […] 열두 영역 위로 [높이 보내진] 것에 관해서도 가르쳐 주었다.”[e]


    유다가 말했습니다. “선생님, 설마 제 씨가 통치자들을 지배하지는 않겠지요?”[f]


    예수께서 그에게 대답하셨습니다. “이리 오너라. 내가 너에게 [거룩한 세대에 관하여 말해 주겠다. 네가 그곳으로 가게 된다는 뜻은 아니다]. 너는 왕국과 그곳의 모든 세대를 보고 몹시 슬퍼할 것이다.”


    유다는 이 말씀을 듣고 예수께 말했습니다. “선생님께서 저를 그 세대와 갈라놓으셨다면, 그것이 제게 무슨 유익이 있습니까?”


    예수께서 대답하셨습니다. “너는 열셋째가 될 것이며, 다른 세대들에게 저주를 받을 것이고, 그들을 다스릴 것이다. 마지막 날들에 그들은 너에게 […]할 것이며, 너는 거룩한 세대로 올라가지 못할 것이다.”[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 단락은 사본의 결락이 많아 물, 나무, 열매, 이 세대의 관계가 불분명합니다. 대괄호와 말줄임표는 보충되었거나 소실된 부분을 나타냅니다.
    reason: 심하게 훼손된 문장의 불확실성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 여기서는 ‘영’과 ‘영혼’이 서로 다른 말로 제시됩니다. 둘의 정확한 관계는 본문에서 설명하지 않습니다.
    reason: 인간론적 용어의 구별을 보존하고 과도한 해석을 피하기 위해서입니다.
  - marker: c
    text: 이 문장은 결락과 복잡한 문장 구조 때문에 ‘더럽혀진 종족’, ‘썩어 없어질 지혜’, ‘손’, 영혼의 상승 사이의 정확한 문법적 관계가 불확실합니다.
    reason: 번역문이 잠정적 구문 해석임을 밝히기 위해서입니다.
  - marker: d
    text: ‘열셋째 악령’은 유다를 가리키는 모욕적이거나 수수께끼 같은 호칭입니다. 그 정확한 우주론적 의미는 여기서 분명하지 않습니다.
    reason: 특정 신학 체계로 호칭을 단정하지 않기 위해서입니다.
  - marker: e
    text: ‘별들의 오류’ 뒤의 문장은 일부가 소실되어, 무엇이 열두 영역 위로 보내졌는지 확실하지 않습니다.
    reason: 결락으로 인한 주어와 내용의 불확실성을 표시하기 위해서입니다.
  - marker: f
    text: ‘씨’는 유다의 후손, 계보, 또는 그에게 속한 무리를 뜻할 수 있으나 문맥만으로 확정하기 어렵습니다.
    reason: 핵심 명사의 중의성을 보존하기 위해서입니다.
  - marker: g
    text: 마지막 문장의 동사는 사본 결락으로 남아 있지 않습니다. 따라서 마지막 날들에 다른 세대들이 유다에게 무엇을 할지는 알 수 없습니다.
    reason: 중대한 결락을 추측하여 채우지 않기 위해서입니다.
lexical_decisions:
- source_word: generation / race
  choice: 세대 / 종족
  rationale: 영어 증언이 문맥에 따라 generation과 race를 구별하므로 ‘세대’와 ‘종족’을 각각 사용하여 집단의 시간적·혈통적 뉘앙스를 보존했습니다.
- source_word: spirit / souls
  choice: 영 / 영혼
  rationale: 본문이 spirit과 soul(s)을 구별하므로 각각 ‘영’과 ‘영혼’으로 옮겨 구별을 유지했습니다.
- source_word: realm(s)
  choice: 영역(들)
  rationale: 우주론적 의미를 특정 교파의 ‘천국’ 개념으로 좁히지 않도록 중립적인 ‘영역’을 택했습니다.
- source_word: ruler(s) / power
  choice: 통치자(들) / 권세
  rationale: 서로 다른 초월적 존재 또는 세력을 나타내는 용어의 구별을 보존했습니다.
- source_word: demon
  choice: 악령
  rationale: 현대 한국어에서 자연스럽고 독자가 이해하기 쉬운 대응어이며, 인격적 초자연 존재라는 부정적 함의를 유지합니다.
- source_word: seed
  choice: 씨
  rationale: 후손·혈통·영적 계보 중 어느 뜻인지 확정하지 않고 원문의 비유적 중의성을 보존했습니다.
- source_word: star
  choice: 별
  rationale: 유다와 연결된 운명적 또는 우주론적 표지의 해석을 덧붙이지 않고 문자적으로 옮겼습니다.
theological_decisions:
- issue: 거룩한 세대와 유다의 관계
  choice: 유다가 그곳에 가지 못하고 슬퍼할 것이라는 긴장을 그대로 유지함
  alternative: 유다가 선택받아 거룩한 세대에 들어간다는 방향으로 조화시킴
  rationale: 제공된 증언은 유다의 특별한 지위와 배제를 동시에 말하므로 어느 한쪽으로 신학적으로 해소하지 않았습니다.
- issue: 몸·영·영혼의 관계
  choice: 본문의 세 용어와 죽음·생존·들려 올라감의 진술을 구별하여 번역함
  alternative: 영과 영혼을 하나의 개념으로 통합함
  rationale: 본문 자체의 인간론적 구별과 긴장을 보존하기 위함입니다.
- issue: ‘열셋째 악령’의 성격
  choice: 직접 호칭으로 유지함
  alternative: 상징적 직함이나 중립적 존재로 완화함
  rationale: 거친 표현을 신학적으로 순화하지 않고 증언의 명시적 부정적 호칭을 보존했습니다.
- issue: ‘지배하다’의 대상과 가치
  choice: 유다의 씨와 유다가 통치자들/세대들을 지배한다는 문장을 가치 판단 없이 유지함
  alternative: 승리나 구원의 의미로 해석함
  rationale: 지배가 긍정인지 부정인지 본문만으로 확정되지 않으므로 해석을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 기본으로 삼았으며, 예수의 직접 발화는 전통적으로 자연스러운 해라체를 사용해 권위 있는 담화의 느낌을 살렸습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 대괄호와 말줄임표는 사본 복원과 결락 표시로 모두 보존했습니다.
