  yaml_path: translation/extra_canonical/gospel_of_judas/003.yaml
  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: ko
  text: '다음 날 아침, 예수께서 제자들에게 나타나셨습니다. [그리고] 제자들이 예수께 말했습니다. “스승님, 저희를 떠나셨을 때 [어디로] 가셨으며 무엇을 하셨습니까?”


    예수께서 그들에게 말씀하셨습니다. “나는 위대하고 거룩한 다른 세대[a]에게 갔다.”


    제자들이 예수께 말했습니다. “주님, 이 영역들[b]에는 없는 어떤 위대한 세대가 저희보다 더 뛰어나고 더 거룩합니까?”


    예수께서 이 말을 들으시고 웃으셨습니다. 그들에게 말씀하셨습니다. “너희는 어찌하여 강하고 거룩한 세대를 두고 마음속으로 의아해하느냐? 진실로 너희에게 말한다. 이 영역에서 태어난 사람은 아무도 그 [세대]를 보지 못할 것이며, 별들에서 온 어떤 천사 군대도 그 세대를 다스리지 못할 것이다. 필멸의 몸으로 태어난 사람은 아무도 그 세대에 합류할 수 없다. 그 세대는 […]에서 나오지 않기 때문이다. 그것은 […]이 되었다. [그들] 가운데 있는 사람들의 세대는 위대한 사람들의 세대에서 나왔다. […] 권세 있는 통치자들은 […]하지 않으며, 권능들도 […]하지 않는다. 그것들로 너희가 다스린다.”[c]


    제자들은 이 말씀을 듣고 저마다 영이 괴로웠습니다. 그들은 아무 말도 할 수 없었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세대’는 혈통, 종족, 또는 특정한 영적 집단을 뜻할 수도 있습니다. 여기서는 그 의미를 하나로 확정하지 않습니다.
    reason: 핵심 용어의 의미 범위와 본문의 의도적 긴장을 보존하기 위해서입니다.
  - marker: b
    text: ‘영역들’은 우주론적 세계나 층위들을 가리킬 수 있습니다. 콥트어 원문에 대한 직접 검토가 아직 이루어지지 않았으므로 잠정적으로 옮겼습니다.
    reason: 현재 초안이 공개 영역 영어 증언에 근거한 잠정 번역임을 밝히고 과도한 전문 용어화를 피하기 위해서입니다.
  - marker: c
    text: 이 대목의 사본에는 여러 결락이 있습니다. 대괄호 안의 말은 보충되거나 불확실한 부분이며, […]는 읽을 수 없거나 유실된 부분을 나타냅니다. 결락 사이의 문장 관계도 불확실합니다.
    reason: 사본 손상과 복원 신호를 독자에게 명확히 알리고, 불확실한 내용을 매끄럽게 재구성하지 않기 위해서입니다.
lexical_decisions:
- source_word: generation
  choice: 세대
  rationale: 이 문맥에서 혈통·종족·영적 집단을 모두 가리킬 가능성이 있으므로, 한 의미로 좁히는 ‘종족’이나 ‘무리’보다 원문의 중의성을 비교적 잘 보존하는 ‘세대’를 택했습니다.
- source_word: realms
  choice: 영역들
  rationale: 우주론적 층위나 세계들을 가리킬 수 있으나, 콥트어 직접 검토가 보류된 상태이므로 특정 체계의 전문 용어를 도입하지 않고 중립적으로 옮겼습니다.
- source_word: strong
  choice: 강한
  rationale: ‘위대한’으로 평준화하지 않고, 영어 증언이 구별하는 강함의 의미를 보존했습니다.
- source_word: army of angels from the stars
  choice: 별들에서 온 어떤 천사 군대
  rationale: 별과 천사 군대의 관계를 해석하여 풀지 않고 증언의 구조를 그대로 유지했습니다.
- source_word: mortal-born person
  choice: 필멸의 몸으로 태어난 사람
  rationale: 단순히 ‘인간’으로 축약하지 않고 죽을 운명 아래 난 존재라는 대조를 드러냈습니다.
- source_word: spirit
  choice: 영
  rationale: 심리 상태로만 환원하지 않고, 본문의 인간론적·신학적 여지를 보존했습니다.
theological_decisions:
- issue: ‘다른 세대’의 정체
  choice: 정체를 규정하지 않고 ‘위대하고 거룩한 다른 세대’로 번역
  alternative: 천상 종족, 선택받은 무리
  rationale: 본문은 그 집단을 이 영역 및 필멸의 출생과 대조하지만 정확한 정체를 명시하지 않으므로 특정 교리적 범주로 확정하지 않았습니다.
- issue: 제자들의 통치와 권세들의 관계
  choice: 손상된 문장 구조와 불확실성을 유지
  alternative: 제자들이 악한 권세를 통해 지배한다고 해석하여 문장을 완성
  rationale: 결락이 심해 문법적·신학적 관계를 확정할 수 없으므로 복원하지 않았습니다.
- issue: 예수의 웃음
  choice: 평가를 덧붙이지 않고 ‘웃으셨습니다’로 직역
  alternative: 비웃으셨습니다, 기뻐 웃으셨습니다
  rationale: 웃음의 성격이 명시되지 않았으므로 조롱이나 기쁨으로 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체 서술을 사용했습니다. 예수의 직접 발화는 권위 있는 문어적 해라체로 처리하여 자연스러운 성서 문체를 살렸습니다. 이 초안은 제공된 공개 영역 영어 번역 증언에 근거한 잠정 번역이며, Codex Tchacos 3의 콥트어 원문 직접 검토가 필요합니다. 대괄호와 말줄임표는 증언에 표시된 복원 및 사본 결락을 보존합니다.
