  yaml_path: translation/extra_canonical/gospel_of_judas/002.yaml
  text: 'One day Jesus was with his disciples in Judea. He found them sitting together, practicing their piety. When he [came up to] his disciples sitting together and praying over the bread, [he] laughed.


    The disciples said to him, “Master, why are you laughing at [our] prayer? What have we done? [This] is what is right.”


    He answered them, “I’m not laughing at you. You aren’t doing this because you want to, but because through this your God [will be] praised.”


    They said, “Master, you […] are the Son of our God!”


    Jesus said to them, “How do [you] know me? Truly [I] say to you, no generation of the people among you will know me.”


    When his disciples heard this, [they] began to grow angry and furious, and they began to curse him in their hearts.


    But when Jesus noticed their ignorance, [he said] to them, “Why are you letting your anger trouble you? Has your God within you and [his stars] become angry with your souls? If any of you is [strong enough] among humans to bring out the perfect Humanity, stand up and face me.”


    They all said, “We’re strong enough.” But their spirits weren’t brave enough to stand before [him]—except for Judas Iscariot. He was able to stand before him, but he couldn’t look him in the eye, so he looked away.


    Judas [said] to him, “I know who you are and where you’ve come from. You’ve come from the immortal realm of Barbelo, and I’m not worthy to utter the name of the one who’s sent you.”


    Then Jesus, knowing that he was thinking about what is exalted, said to him, “Come away from the others, and I’ll tell you the mysteries of the kingdom. Not so that you’ll go there, but you’ll grieve much because someone else will replace you to complete the twelve [elements] before their God.”


    Judas said to him, “When will you tell me these things, and when will the great day of light dawn for the generation […]?”


    But when he said these things, Jesus left him.'
translation:
  language: ko
  text: '**유다복음 — 예수께서 제자들을 꾸짖으시다**


    어느 날 예수께서는 유대에서 제자들과 함께 계셨습니다. 그분은 제자들이 함께 앉아 경건을 행하는 것을 보셨습니다. 예수께서 함께 앉아 빵을 두고 기도하는 제자들에게 [다가가셨을] 때, [그분은] 웃으셨습니다.[a]


    제자들이 예수께 말했습니다. “스승님, 왜 [우리의] 기도를 비웃으십니까? 우리가 무엇을 잘못했습니까? [이것이] 옳은 일입니다.”


    예수께서 그들에게 대답하셨습니다. “나는 너희를 비웃는 것이 아니다. 너희가 이것을 하는 것은 너희가 원하기 때문이 아니라, 이것을 통하여 너희의 신이 찬양받게 [될] 것이기 때문이다.”


    그들이 말했습니다. “스승님, 스승님은 […] 우리 신의 아들이십니다!”


    예수께서 그들에게 말씀하셨습니다. “너희가 어떻게 나를 아느냐? 진실로 [내가] 너희에게 말한다. 너희 가운데 있는 사람들의 세대는 어느 세대도 나를 알지 못할 것이다.”[b]


    제자들은 이 말씀을 듣고 화가 치밀어 격분하기 시작했으며, 마음속으로 예수를 저주하기 시작했습니다.


    그러나 예수께서는 그들의 무지를 알아차리시고 [그들에게 말씀하셨습니다]. “어찌하여 너희는 분노에 사로잡혀 괴로워하느냐? 너희 안에 있는 너희의 신과 [그의 별들]이 너희 영혼들에게 화를 냈느냐?[c] 너희 가운데 누구든지 사람들 사이에서 [충분히 강하여] 완전한 인간을 드러낼 수 있다면, 일어나 내 앞에 서라.”[d]


    그들은 모두 “우리는 충분히 강합니다”라고 말했습니다. 그러나 가룟 유다를 제외하면, 그들의 영은 [예수] 앞에 설 만큼 담대하지 못했습니다. 유다는 그분 앞에 설 수 있었지만 그분의 눈을 똑바로 바라볼 수 없어서 시선을 돌렸습니다.


    유다가 [예수께] 말했습니다. “저는 스승님이 누구시며 어디에서 오셨는지 압니다. 스승님은 바르벨로의 불멸하는 영역에서 오셨습니다.[e] 저는 스승님을 보내신 분의 이름을 입에 올릴 자격도 없습니다.”


    그때 예수께서는 유다가 지극히 높은 것을 생각하고 있음을 아시고 그에게 말씀하셨습니다. “다른 이들에게서 떨어져 나오너라. 그러면 내가 네게 왕국의 비밀들을 알려 주겠다. 그렇다고 네가 그곳에 가게 되는 것은 아니다. 오히려 너는 크게 슬퍼할 것이다. 다른 누군가가 너를 대신하여 그들의 신 앞에서 열둘[의 요소들]을 완성할 것이기 때문이다.”[f]


    유다가 예수께 말했습니다. “언제 제게 이 일들을 알려 주시겠습니까? 또 그 세대를 위하여 빛의 큰 날은 언제 밝아 오겠습니까 […]?”


    그러나 유다가 이 말을 하자, 예수께서는 그를 떠나셨습니다.


    [a] 대괄호는 사본의 손상된 부분에 대한 복원 또는 불확실한 판독을 나타냅니다. 이 번역은 제공된 공개 영어 번역 증거를 바탕으로 한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 필요합니다.


    [b] “너희 가운데 있는 사람들의 세대”는 원문의 관계가 불분명한 표현을 그대로 살린 것입니다. “너희 백성 가운데 어떤 세대도”로 이해할 수도 있습니다.


    [c] “너희 안에 있는”이 “너희의 신”만을 꾸미는지, 이어지는 “그의 별들”까지 꾸미는지는 분명하지 않습니다.


    [d] “완전한 인간”은 한 개인, 완전한 인간성, 또는 이 문헌의 우주론적 인간상을 가리킬 수 있으므로 한 의미로 한정하지 않았습니다.


    [e] 바르벨로는 이 문헌의 우주론에서 불멸의 신적 영역과 관련된 고유명사입니다.


    [f] “요소들”은 손상된 본문을 보충한 말입니다. 문맥상 열둘의 집단이나 수를 완성한다는 뜻일 수 있으나, 정확한 대상은 불분명합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 사본의 손상된 부분에 대한 복원 또는 불확실한 판독을 나타냅니다. 이 번역은 제공된 공개 영어 번역 증거를 바탕으로 한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 필요합니다.
    reason: 사본 복원 표기와 현재 번역 기반의 한계를 독자에게 알리기 위해서입니다.
  - marker: b
    text: “너희 가운데 있는 사람들의 세대”는 원문의 관계가 불분명한 표현을 그대로 살린 것입니다. “너희 백성 가운데 어떤 세대도”로 이해할 수도 있습니다.
    reason: 세대와 사람들 및 제자들의 관계가 문법적으로 모호함을 보존하기 위해서입니다.
  - marker: c
    text: “너희 안에 있는”이 “너희의 신”만을 꾸미는지, 이어지는 “그의 별들”까지 꾸미는지는 분명하지 않습니다.
    reason: 수식 범위와 손상된 본문의 불확실성을 드러내기 위해서입니다.
  - marker: d
    text: “완전한 인간”은 한 개인, 완전한 인간성, 또는 이 문헌의 우주론적 인간상을 가리킬 수 있으므로 한 의미로 한정하지 않았습니다.
    reason: 신학적으로 중요한 다의성을 보존하기 위해서입니다.
  - marker: e
    text: 바르벨로는 이 문헌의 우주론에서 불멸의 신적 영역과 관련된 고유명사입니다.
    reason: 일반 독자에게 낯선 고유명사를 최소한으로 설명하기 위해서입니다.
  - marker: f
    text: “요소들”은 손상된 본문을 보충한 말입니다. 문맥상 열둘의 집단이나 수를 완성한다는 뜻일 수 있으나, 정확한 대상은 불분명합니다.
    reason: 복원어를 확정된 본문처럼 읽지 않도록 하기 위해서입니다.
lexical_decisions:
- source_word: practicing their piety
  choice: 경건을 행하는
  rationale: 의례 행위인지 일반적인 신앙 실천인지 확정하지 않고, 자연스러운 한국어로 행위성을 보존했습니다.
- source_word: praying over the bread
  choice: 빵을 두고 기도하는
  rationale: 기도의 구체적 의례 성격을 성찬으로 단정하지 않으면서 빵과 관련된 기도라는 의미를 살렸습니다.
- source_word: your God
  choice: 너희의 신
  rationale: 본문이 예수의 하나님과 제자들이 섬기는 신 사이에 긴장을 조성하므로 이를 ‘하나님’으로 중화하지 않았습니다.
- source_word: perfect Humanity
  choice: 완전한 인간
  rationale: 개별 인간, 인간성, 우주론적 인간상 사이의 의미 가능성을 열어 두고 주석으로 모호성을 밝혔습니다.
- source_word: realm of Barbelo
  choice: 바르벨로의 불멸하는 영역
  rationale: 고유명사를 음역하고, 특정 후대 교리 용어를 덧붙이지 않았습니다.
- source_word: mysteries of the kingdom
  choice: 왕국의 비밀들
  rationale: 복수형 mysteries를 보존하고 ‘왕국’이 어떤 왕국인지 해석적으로 특정하지 않았습니다.
- source_word: twelve [elements]
  choice: 열둘[의 요소들]
  rationale: 숫자 열둘과 복원된 명사의 차이를 대괄호로 드러내어 사본상의 불확실성을 보존했습니다.
theological_decisions:
- issue: 예수의 웃음이 향하는 대상
  choice: ‘너희를 비웃는 것이 아니다’로 번역
  alternative: ‘너희 때문에 웃는 것이 아니다’
  rationale: 이어지는 제자들의 기도 및 신에 대한 비판과 개인들에 대한 조롱을 구별하되, 웃음의 정확한 성격은 규정하지 않았습니다.
- issue: 제자들의 ‘신’과 예수가 말하는 신적 실재의 관계
  choice: 일관되게 ‘너희의 신/그들의 신’으로 번역
  alternative: ‘너희의 하나님/그들의 하나님’
  rationale: 소유 표현이 만들어 내는 거리감과 본문의 신학적 긴장을 보존하며 정통 또는 비정통이라는 판정을 번역에 삽입하지 않았습니다.
- issue: ‘완전한 인간’의 정체
  choice: 본문에서는 설명하지 않고 각주에서 가능한 의미만 제시
  alternative: ‘완전한 인간성’ 또는 특정 구원자·원형 인간으로 해석
  rationale: 제공된 증거만으로는 특정 우주론적 개념을 확정할 수 없으므로 해석적 과잉을 피했습니다.
- issue: 유다에게 왕국의 비밀을 알리는 목적과 그의 운명
  choice: ‘그렇다고 네가 그곳에 가게 되는 것은 아니다’라는 부정과 뒤따르는 슬픔을 그대로 유지
  alternative: 유다의 구원이나 배제를 명시적으로 해설
  rationale: 본문 자체의 긴장과 모호성을 유지하고 유다의 최종 지위를 교리적으로 판정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘-습니다’, 직접 발화는 인물 관계에 맞추어 ‘-습니까/-습니다’와 예수의 권위 있는 ‘-느냐/-라’를 사용했습니다. 지나치게 교회적인 관용어를 피하면서도 고대 종교 문헌의 엄숙한 분위기를 유지했습니다. 제공 자료가 공개 영어 번역 증거이며 콥트어 직접 검토가 보류 중이므로 번역은 잠정적입니다.
