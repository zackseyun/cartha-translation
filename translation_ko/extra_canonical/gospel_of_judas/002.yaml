  revised_text: '**유다복음 — 예수께서 제자들을 꾸짖으시다**


    어느 날 예수께서는 유대에서 제자들과 함께 계셨습니다. 그분은 제자들이 함께 앉아 경건을 행하는 것을 보셨습니다. 예수께서 함께 앉아 빵을 두고 기도하는 제자들에게 [다가가셨을] 때, [그분은] 웃으셨습니다.[a]


    제자들이 예수께 말했습니다. “스승님, 왜 [우리의] 기도를 비웃으십니까? 우리가 무엇을 잘못했습니까? [이것이] 옳은 일입니다.”


    예수께서 그들에게 대답하셨습니다. “나는 너희를 비웃는 것이 아니다. 너희가 이것을 하는 것은 너희가 원하기 때문이 아니라, 이것을 통하여 너희의 신이 찬양받게 [될] 것이기 때문이다.”


    그들이 말했습니다. “스승님, 스승님은 […] 우리 신의 아들이십니다!”


    예수께서 그들에게 말씀하셨습니다. “[너희가] 어떻게 나를 아느냐? 진실로 [내가] 너희에게 말한다. 너희 가운데 있는 사람들의 어느 세대도 나를 알지 못할 것이다.”[b]


    제자들은 이 말씀을 듣고 화가 치밀어 격분하기 시작했으며, 마음속으로 예수를 저주하기 시작했습니다.


    그러나 예수께서는 그들의 무지를 알아차리시고 [그들에게 말씀하셨습니다]. “어찌하여 너희는 분노에 사로잡혀 괴로워하느냐? 너희 안에 있는 너희의 신과 [그의 별들]이 너희 영혼들에게 노하였느냐?[c] 너희 가운데 누구든지 사람들 사이에서 [충분히 강하여] 완전한 인간을 드러낼 수 있다면, 일어나 내 앞에 서라.”[d]


    그들은 모두 “우리는 충분히 강합니다”라고 말했습니다. 그러나 가룟 유다를 제외하면, 그들의 영은 [예수] 앞에 설 만큼 담대하지 못했습니다. 유다는 그분 앞에 설 수 있었지만 그분의 눈을 똑바로 바라볼 수 없어서 시선을 돌렸습니다.


    유다가 [예수께] 말했습니다. “저는 스승님이 누구시며 어디에서 오셨는지 압니다. 스승님은 바르벨로의 불멸하는 영역에서 오셨습니다.[e] 저는 스승님을 보내신 분의 이름을 입에 올릴 자격도 없습니다.”


    그때 예수께서는 유다가 지극히 높은 것을 생각하고 있음을 아시고 그에게 말씀하셨습니다. “다른 이들에게서 떨어져 나오너라. 그러면 내가 네게 왕국의 비밀들을 알려 주겠다. 그렇다고 네가 그곳에 가게 되는 것은 아니다. 오히려 너는 크게 슬퍼할 것이다. 다른 누군가가 너를 대신하여 그들의 신 앞에서 열둘[의 요소들]을 완성할 것이기 때문이다.”[f]


    유다가 예수께 말했습니다. “언제 제게 이 일들을 알려 주시겠습니까? 또 그 세대를 위하여 빛의 큰 날은 언제 밝아 오겠습니까 […]?”


    그러나 유다가 이 말을 하자, 예수께서는 그를 떠나셨습니다.


    [a] 대괄호는 사본의 손상된 부분에 대한 복원 또는 불확실한 판독을 나타냅니다. 이 번역은 제공된 공개 영어 번역 증거를 바탕으로 한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 필요합니다.


    [b] “너희 가운데 있는 사람들의 어느 세대도”는 원문의 관계가 불분명한 표현을 그대로 살린 것입니다. “너희 백성 가운데 어떤 세대도”로 이해할 수도 있습니다.


    [c] “너희 안에 있는”이 “너희의 신”만을 꾸미는지, 이어지는 “그의 별들”까지 꾸미는지는 분명하지 않습니다.


    [d] “완전한 인간”은 한 개인, 완전한 인간성, 또는 이 문헌의 우주론적 인간상을 가리킬 수 있으므로 한 의미로 한정하지 않았습니다.


    [e] 바르벨로는 이 문헌의 우주론에서 불멸의 신적 영역과 관련된 고유명사입니다.


    [f] “요소들”은 손상된 본문을 보충한 말입니다. 문맥상 열둘의 집단이나 수를 완성한다는 뜻일 수 있으나, 정확한 대상은 불분명합니다.'
