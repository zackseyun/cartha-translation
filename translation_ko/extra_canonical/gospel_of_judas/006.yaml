translation:
  language: ko
  text: '예수께서 말씀하셨습니다. “오십시오. 그러면 내가 당신에게 [어떤 인간도 보지 못할 신비들을] 가르쳐 주겠습니다. 크고 끝없는 한 영역이 있기 때문입니다. 그 지평은 어떤 천사 세대도 본 적이 없습니다. 그곳에는 어떤 [천사의] 눈도 본 적이 없고, 어떤 마음도 깨달은 적이 없으며, 어떤 이름으로도 불린 적이 없는 [위대한] 보이지 않는 영이 있습니다.


    “그곳에 빛나는 구름 하나가 나타났습니다. 그 영이 말했습니다. ‘나를 섬길 천사 하나가 생겨나라.’ 그러자 위대한 천사, 곧 스스로 생겨난 이이며 빛의 신인 이가 구름에서 나왔습니다. 그로 말미암아 다른 구름에서 또 다른 네 천사가 생겨났고, 그들은 천사인 스스로 생겨난 이를 섬겼습니다. [스스로 생겨난 이]가 말했습니다. ‘[한 영역이] 생겨나라.’ 그러자 [그가 말한 그대로] 생겨났습니다. 그는 그 영역을 다스리도록 첫째 발광체[a]를 [창조했습니다]. 또 그가 말했습니다. ‘[그것을] 섬길 천사들이 생겨나라.’ 그러자 셀 수 없이 [수많은] 천사가 생겨났습니다. 또 그가 말했습니다. ‘빛나는 [영역이] 생겨나라.’ 그러자 그것이 생겨났습니다. 그는 그 영역을 다스리도록 둘째 발광체를 창조하고, 섬기는 일을 하도록 셀 수 없이 수많은 천사도 함께 창조했습니다. 그는 이런 식으로 나머지 빛의 영역들을 창조했습니다. 그것들을 다스림받게 하고, 그것들을 돕도록 셀 수 없이 수많은 천사를 창조했습니다.


    “아다마스는 ‘신’이라 불리는 모든 존재 가운데 어떤 천사도 결코 볼 수 없었던 첫째 빛의 구름 안에 있었습니다. [아다마스는 그] 천사의 형상[을 따라 …] 닮은 모습으로 그 [곳에서 셋을 낳았습니다]. 그는 셋의 썩지 않는 [세대]가 열두 양성적[b] [발광체에게 나타나게 했습니다. 그런 다음] 영의 뜻에 따라 썩지 않는 세대 안에 일흔두 발광체가 나타나게 했습니다. 이어 그 일흔두 발광체가 영의 뜻에 따라 썩지 않는 세대 안에 삼백육십 발광체가 나타나게 했으니, 각 발광체마다 다섯이 있게 하려는 것이었습니다. 열두 발광체의 열두 영역은 그들의 아버지를 이루며, 영역마다 여섯 하늘이 있으므로 일흔두 발광체에 일흔두 하늘이 있습니다. 또 그 각각에 [다섯] 궁창이 있어서 [모두] 삼백육십 [궁창이 됩니다. 그들에게는] 권세와, 영예를 드리고 섬기기 위한 셀 수 없이 많은 천사의 [큰] 군대가 주어졌습니다. 또한 모든 영역과 하늘과 그 궁창들에 영예를 드리고 [섬기도록] 처녀 영들도 [주어졌습니다].


    “이제 그 불멸자들의 무리를 아버지와 일흔두 발광체는, 스스로 생겨난 이와 그의 일흔두 영역과 더불어 ‘코스모스’, 곧 ‘소멸할 것’이라고 부릅니다.[c] 그곳에서 첫 인간이 그의 썩지 않는 능력들과 함께 나타났습니다. 그의 세대와 함께 나타난 영역에는 지식의 구름과 [엘렐렛 …]이라고 불리는 천사가 있습니다. 이 일들이 있은 뒤 [엘렐렛]이 말했습니다. ‘카오스와 [하데스]를 다스릴 열두 천사가 생겨나라.’ 보십시오. 구름에서 한 [천사]가 나타났는데, 그의 얼굴은 [불]로 번쩍였고 그의 모습은 피로 [더럽혀져] 있었습니다. 그의 이름은 네브로였으며, 그 뜻은 ‘반역자’입니다. 다른 이들은 그를 얄다바오트라고 부릅니다. 또 다른 천사 사클라스도 구름에서 나왔습니다. 네브로는 보조자들이 되도록 여섯 천사를 창조했고, 사클라스도 그렇게 했습니다. 그들은 하늘들에 열두 천사를 내놓았고, 각 천사는 하늘들에서 한 몫을 받았습니다.


    “열두 통치자는 열두 천사에게 말했습니다. ‘너희는 저마다 […] 그들이 […] 세대 [… 다섯] 천사:


    첫째는 ‘선한 이’라고 불리는 [야오트]입니다.


    둘째는 [불의 눈] 하르마토트입니다.


    [셋째]는 갈릴라입니다.


    넷째는 요벨입니다.


    다섯째는 아도나이오스입니다.


    “이들이 하데스를 다스린 다섯이며, 카오스 위에 처음으로 선 자들입니다.


    “그때 사클라스가 자기 천사들에게 말했습니다. ‘우리의 모양과 형상을 따라 인간을 만들자.’ 그들은 아담과 그의 아내 하와를 빚었습니다. 하와는 구름 속에서 ‘생명’이라고 불립니다. 이는 모든 세대가 이 이름으로 그를 찾고, 세대마다 자기들의 이름으로 그녀를 부르기 때문입니다.[d] 사클라스는 […] 낳으라고 [명령하지] 않았습니다. 다만 […] 세대들 가운데 […] 이것이 […] 그리고 그 [천사]가 그에게 말했습니다. ‘네 생명은 네 자녀들과 함께 제한된 기간만 지속될 것이다.’”


    그러자 유다가 예수께 물었습니다. “사람은 [얼마나] 오래 살 수 있습니까?”


    예수께서 말씀하셨습니다. “아담과 그의 세대가 자기 통치자와 함께 왕국을 받은 그곳에서, 그들의 수명이 제한되어 있다는 것을 왜 놀랍게 여깁니까?”


    유다가 예수께 물었습니다. “사람의 영은 죽습니까?”


