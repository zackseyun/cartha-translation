    [그때] 유다가 예수께 물었습니다. “그러면 그 세대들은 무엇을 하게 됩니까?”


    예수께서 말씀하셨습니다. “진정으로 내가 당신에게 말합니다. 별들이 이 모든 일을 완수합니다. 사클라스가 자신에게 정해진 기간을 채우면, 그들의 첫째 별이 그 세대들과 함께 나타나고, 그들은 말해진 일을 마칠 것입니다. 그때 그들은 내 이름으로 음행하고 자기 자녀들을 죽이며, [그들은 …] 악을 행하고 […] 영역들, 그 세대들을 데려다가 사클라스에게 바칠 것입니다. [그리고] 그 뒤 […] [이스라엘]의 열두 지파를 […]에서 데려올 것이며, 모든 [세대]는 내 이름으로 죄를 지으면서 사클라스를 섬길 것입니다. 그리고 당신의 별은 열셋째 영역을 [다스릴] 것입니다.” 그러자 예수께서 [웃으셨습니다].


