    “아다마스는 ‘신’이라 불리는 모든 존재 가운데 어떤 천사도 결코 볼 수 없었던 첫째 빛의 구름 안에 있었습니다. [아다마스는 그곳에서 …의 형상과 이 천사의 모양을 따라 셋을 낳았습니다]. 그는 셋의 썩지 않는 [세대]가 열두 양성적[b] [발광체에게 나타나게 했습니다. 그런 다음] 영의 뜻에 따라 썩지 않는 세대 안에 일흔두 발광체가 나타나게 했습니다. 이어 그 일흔두 발광체가 영의 뜻에 따라 썩지 않는 세대 안에 삼백육십 발광체가 나타나게 했으니, 각 발광체마다 다섯이 있게 하려는 것이었습니다. 열두 발광체의 열두 영역은 그들의 아버지를 이루며, 영역마다 여섯 하늘이 있으므로 일흔두 발광체에 일흔두 하늘이 있습니다. 또 그 각각에 [다섯] 궁창이 있어서 [모두] 삼백육십 [궁창이 됩니다. 그들에게는] 권세와, 영예를 드리고 섬기기 위한 셀 수 없이 많은 천사의 [큰] 군대가 주어졌습니다. 또한 모든 영역과 하늘과 그 궁창들에 영예를 드리고 [섬기도록] 처녀 영들도 [주어졌습니다].


    “이제 그 불멸자들의 무리를 아버지와 일흔두 발광체는, 스스로 생겨난 이와 그의 일흔두 영역과 더불어 ‘코스모스’, 곧 ‘소멸할 것’이라고 부릅니다.[c] 그곳에서 첫 인간이 그의 썩지 않는 능력들과 함께 나타났습니다. 그의 세대와 함께 나타난 영역에는 지식의 구름과 [엘렐렛 …]이라고 불리는 천사가 있습니다. 이 일들이 있은 뒤 [엘렐렛]이 말했습니다. ‘카오스와 [하데스]를 다스릴 열두 천사가 생겨나라.’ 보십시오. 구름에서 한 [천사]가 나타났는데, 그의 얼굴은 [불]로 번쩍였고 그의 모습은 피로 [더럽혀져] 있었습니다. 그의 이름은 네브로였으며, 그 뜻은 ‘반역자’입니다. 다른 이들은 그를 얄다바오트라고 부릅니다. 또 다른 천사 사클라스도 구름에서 나왔습니다. 네브로는 보조자들이 되도록 여섯 천사를 창조했고, 사클라스도 그렇게 했습니다. 그들은 하늘들에 열두 천사를 내놓았고, 각 천사는 하늘들에서 한 몫을 받았습니다.


    “열두 통치자는 열두 천사에게 말했습니다. ‘너희는 저마다 […] 그들이 […] 세대 [… 다섯] 천사:


    첫째는 ‘선한 이’라고 불리는 [야오트]입니다.


