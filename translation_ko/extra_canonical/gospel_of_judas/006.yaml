    [셋째]는 갈릴라입니다.


    넷째는 요벨입니다.


    다섯째는 아도나이오스입니다.


    “이들이 하데스를 다스린 다섯이며, 카오스 위에 처음으로 선 자들입니다.


    “그때 사클라스가 자기 천사들에게 말했습니다. ‘우리의 모양과 형상을 따라 인간을 만들자.’ 그들은 아담과 그의 아내 하와를 빚었습니다. 하와는 구름 속에서 ‘생명’이라고 불립니다. 이는 모든 세대가 이 이름으로 그를 찾고, 세대마다 자기들의 이름으로 그녀를 부르기 때문입니다.[d] 사클라스는 [명령하지 않았습니다 …] 낳게 하도록, 다만 […] 세대들 가운데 […] 이것이 […] 그리고 그 [천사]가 그에게 말했습니다. ‘네 생명은 네 자녀들과 함께 제한된 기간만 지속될 것이다.’”


    그러자 유다가 예수께 물었습니다. “사람은 [얼마나] 오래 살 수 있습니까?”


    예수께서 말씀하셨습니다. “아담과 그의 세대가 자기 통치자와 함께 왕국을 받은 그곳에서, 그들의 수명이 제한되어 있다는 것을 왜 놀랍게 여깁니까?”


