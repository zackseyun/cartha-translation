  revised_text: '예수께서 말씀하셨습니다. “오십시오. 그러면 내가 당신에게 [어떤 인간도 보지 못할 신비들을] 가르쳐 주겠습니다. 크고 끝없는 한 영역이 있기 때문입니다. 그 지평은 어떤 천사 세대도 본 적이 없습니다. 그곳에는 어떤 [천사의] 눈도 본 적이 없고, 어떤 마음도 깨달은 적이 없으며, 어떤 이름으로도 불린 적이 없는 [위대한] 보이지 않는 영이 있습니다.


