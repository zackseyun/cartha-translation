translation:
  language: ko
  text: '또 다른 날, 예수께서 그들에게 다가오셨습니다. 그들이 예수께 말했습니다. “스승님, 저희가 꿈에서 스승님을 보았습니다. 지난밤에 큰 [꿈들을 꾸었기] 때문입니다.”


    그러나 예수께서 말씀하셨습니다. “어찌하여 […] 너희 자신을 숨겼느냐?”


    그러자 그들이 [말했습니다. “저희는] 큰 [집을 보았는데, 그 안에는 큰] 제단이 [있었고,] 열두 사람이 있었으며—저희가 보기에는 제사장들이었습니다—한 이름도 있었습니다. 많은 사람이 제단에서 기다리고 있었는데, 제사장들이 제물을 [다 받아들일 때까지]였습니다. 저희도 계속 기다렸습니다.”


    [예수께서 말씀하셨습니다.] “그들은 무엇을 하고 있었느냐?”[a]


    그들이 말했습니다. “[어떤 이들은] 두 주 동안 금식합니다. 어떤 이들은 자기 자녀를 제물로 바치고, 어떤 이들은 자기 아내를 바치며, 서로 가운데서 찬양하고 자신을 낮춥니다. 어떤 이들은 남자들과 잠자리를 하고, 어떤 이들은 살인하며, 또 어떤 이들은 많은 죄를 짓고 범죄를 저지릅니다. [그리고] 제단 [앞에] 서 있는 사람들은 스승님의 [이름]을 부릅니다! 그들은 희생 제사를 드릴 때마다 자기들의 제물로 [제단]을 가득 채웁니다.” 그들은 이 말을 하고 나서, 근심에 잠겨 [입을] 다물었습니다.


    예수께서 그들에게 말씀하셨습니다. “어찌하여 너희가 근심하느냐? 진실로 내가 너희에게 말한다. 그 제단 앞에 서 있는 제사장들은 모두 내 이름을 부른다. 그리고 [다시] 내가 너희에게 말한다. 인간 세대들이 별들의 세대에 속한 이 [집]에 내 이름을 써 놓았다.[b] [그들은] 내 이름으로 열매 없는 나무들을 수치스럽게 심었다.” 예수께서 그들에게 말씀하셨습니다. “너희가 본 제단에서 제물을 받아들이는 자들이 바로 너희다. 그것이 너희가 섬기는 신이며,[c] 너희가 본 열두 사람이 바로 너희다. 너희가 희생 제물로 끌려오는 것을 본 짐승들은 너희가 그 제단 앞에서 잘못된 길로 이끄는 무리다. [너희의 봉사자]가 일어나 그런 식으로 내 이름을 사용할 것이며, [경건한] 세대들은 그에게 충성할 것이다. 그 뒤에는 다른 사람이 [음행하는 자들]을 내놓고, 또 다른 사람은 아이들을 죽이는 자들을, 또 다른 사람은 남자들과 잠자리를 하는 자들을 내놓을 것이며, 금식하는 자들과 그 밖의 모든 부정과 범죄와 미혹도 내놓을 것이다. ‘우리는 천사들과 동등하다’고 말하는 자들, 그들이 바로 모든 것을 끝마치는 별들이다. 인간 세대들에게 ‘보라, 신이 제사장들의 손에서 너희의 희생 제물을 받아들였다’고 말해 왔는데, 그 제사장들이란 곧 미혹의 봉사자다. 그러나 명령하시는 주님은 모든 것 위에 계신 주님이시다. 마지막 날에 그들은 유죄로 드러날 것이다.”


    예수께서 [그들에게] 말씀하셨습니다. “[짐승을 희생 제물로 바치는 일을] 그쳐라. 너희는 제단 위에서, 너희의 별들과 너희의 천사들 위에서 [그것들을 바쳤으며], 그곳에서 그것들은 이미 완결되었다.[d] 그러므로 그것들이 너희와 함께 […] 되게 하고, 그것들이 분명해지게 하여라.”


    그분의 제자들이 그분께 [말했습니다.] “천사들의 속임수로 말미암아 저희가 지은 [죄]에서 저희를 깨끗하게 해 주십시오.”


    예수께서 그들에게 말씀하셨습니다. “그것은 가능하지 않다 […]. 샘 하나가 사람이 사는 온 세상의 불을 끌 [수도] 없다. 또한 크고 굳건한 세대를 제외하고는, 한 [도시의] 우물이 모든 세대를 흡족하게 할 수도 없다. 둘째 세대를 제외하고는, 등불 하나가 모든 영역을 밝힐 수 없으며, 빵 굽는 사람 하나가 [하늘] 아래의 모든 피조물을 먹일 수도 없다.”[e]


    [제자들이] 이 [말을 들었을 때], 그분께 말했습니다. “스승님, 저희를 도와주시고 구원해 주십시오!”


    예수께서 그들에게 말씀하셨습니다. “나와 맞서 싸우기를 그쳐라. 너희 각자에게는 자기 별이 있고, [그리고 …] 별들 가운데 […] 자기에게 속한 것을 […] 것이다. 나는 썩어 없어질 세대에게 보냄받은 것이 아니라, 강하고 썩지 않는 세대에게 보냄받았다. 어떤 원수도 그 세대를 다스린 적이 없고, 어떤 별도 그 세대를 다스린 적이 없기 때문이다. 진실로 내가 너희에게 말한다. 불기둥은 곧 떨어질 것이나, 그 세대는 별들로 말미암아 흔들리지 않을 것이다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그들은 어떠했느냐?”입니다. 문맥상 그들의 행위를 묻는 말로 옮겼습니다.
    reason: 영어 증언 본문의 질문은 외양과 행위 어느 쪽도 가리킬 수 있어 번역 선택을 알립니다.
  - marker: b
    text: “별들의 세대에 속한 이 집”과 “인간 세대들”의 관계는 본문이 손상되었거나 구문이 불분명하여 확정하기 어렵습니다.
    reason: 우주론적 관계를 번역에서 과도하게 명료화하지 않았음을 밝힙니다.
  - marker: c
    text: 여기서 ‘신’이 누구를 가리키는지는 분명하지 않습니다. 본문은 뒤이어 ‘모든 것 위에 계신 주님’과 대조합니다.
    reason: 신학적 동일시를 피하고 본문 자체의 대조를 보존합니다.
  - marker: d
    text: ‘완결되었다’는 희생 제물, 별들, 천사들 가운데 무엇을 직접 가리키는지 분명하지 않습니다.
    reason: 대명사의 지시 대상과 우주론적 의미가 불확실합니다.
  - marker: e
    text: ‘크고 굳건한 세대’와 ‘둘째 세대’가 앞뒤 비유와 맺는 정확한 관계는 불분명합니다.
    reason: 난해한 구문의 진정한 모호성을 독자에게 알립니다.
lexical_decisions:
- source_word: Master
  choice: 스승님
  rationale: 제자들이 예수를 부르는 호칭으로서 현대 독자가 자연스럽게 이해하도록 옮겼으며, ‘주님’으로 번역해 뒤에 나오는 우주적 통치자 호칭과 섞이는 것을 피했습니다.
- source_word: altar
  choice: 제단
  rationale: 희생 제물과 제사장이라는 문맥에 맞는 표준 종교 용어를 사용했습니다.
- source_word: priests
  choice: 제사장들
  rationale: 제단에서 제물을 받는 제의 담당자를 가리키므로 ‘사제’보다 성서 문체에 익숙한 ‘제사장’을 택했습니다.
- source_word: generations
  choice: 세대들 / 세대
  rationale: 이 문헌에서 단순한 시대뿐 아니라 특정 부류·질서에 속한 존재들의 집단을 가리킬 수 있는 모호성을 보존했습니다.
- source_word: stars
  choice: 별들
  rationale: 천상 존재나 운명적 지배 세력을 상징할 가능성을 해설적으로 풀지 않고 표면 어휘를 유지했습니다.
- source_word: minister
  choice: 봉사자
  rationale: 제의 직무자 또는 섬기는 자라는 폭을 보존하고 특정 교회 직분명으로 한정하지 않았습니다.
- source_word: incorruptible
  choice: 썩지 않는
  rationale: ‘불멸’로 신학적 의미를 좁히지 않고 corruptible과의 어근상 대조를 자연스럽게 살렸습니다.
- source_word: realms
  choice: 영역들
  rationale: 우주론적 층위일 수 있으나 원문 검토 전 ‘세계’나 ‘천상계’로 단정하지 않았습니다.
theological_decisions:
- issue: 제단에서 섬기는 신의 정체
  choice: “그것이 너희가 섬기는 신”
  alternative: “그분이 너희가 섬기는 하나님”
  rationale: 문맥의 비판적 긴장을 보존하고, 해당 존재를 이스라엘의 하나님 또는 최고신으로 미리 동일시하지 않기 위해 일반명사 ‘신’을 사용했습니다.
- issue: 별과 천사의 역할
  choice: ‘별들’과 ‘천사들’을 그대로 유지
  alternative: 악한 천상 권세로 해설 번역
  rationale: 본문은 이들의 속임과 지배를 말하지만 존재론적 체계를 완전히 설명하지 않으므로 교리적으로 확정하지 않았습니다.
- issue: ‘강하고 썩지 않는 세대’의 성격
  choice: 세대라는 표현을 유지
  alternative: 구원받은 종족/영적 민족
  rationale: 집단의 성격과 범위가 불분명하므로 해석적 명칭을 피했습니다.
- issue: ‘둘째 세대’가 수식하는 범위
  choice: 문장 구조의 난해함을 그대로 보존
  alternative: 둘째 세대만 모든 영역을 밝힌다고 명료화
  rationale: 전승 본문의 손상 또는 구문 불확실성이 있어 논리 관계를 임의로 해결하지 않았습니다.
