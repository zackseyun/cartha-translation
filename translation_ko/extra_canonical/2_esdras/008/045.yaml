translation:
  language: ko
  text: 그것이 우리에게 내리지 않게 하시고, 당신의 백성을 아끼시며 당신의 유산을 긍휼히 여기소서. 당신께서는 자기 피조물을 긍휼히 여기시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것이 우리에게 내리지 않게 하시고, 당신의 백성을 아끼시며 당신의 유산을 긍휼히 여기소서. 당신께서는 자기 피조물을 긍휼히 여기시기 때문입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: super nos
  english_pob_choice: let it not be upon us
  chosen_korean: 그것이 우리에게 내리지 않게 하시고
  alternatives_korean:
  - 우리 위에 있지 않게 하시고
  - 우리에게 닥치지 않게 하시고
  lexicon: super + nos
  rationale: 라틴어 super nos는 8:44의 부정 청원과 이어져 ‘우리 위에 임하지 않게’라는 뜻이므로, 단순한 위치 표현보다 재앙/심판이 우리에게 ‘내리지 않게’ 하는 청원으로 옮겼습니다.
- source_word: parce
  english_pob_choice: spare
  chosen_korean: 아끼시며
  alternatives_korean:
  - 용서하시며
  - 긍휼히 여기시며
  lexicon: parco
  rationale: parce는 단순 감정이 아니라 ‘해를 가하지 말고 보존해 달라’는 청원이라서, 뒤의 miserere와 구별되도록 ‘아끼시며’로 옮겼습니다.
- source_word: miserere / misereris
  english_pob_choice: have mercy
  chosen_korean: 긍휼히 여기소서 / 긍휼히 여기시기
  alternatives_korean:
  - 자비를 베푸소서 / 자비를 베푸시기
  - 불쌍히 여기소서 / 불쌍히 여기시기
  lexicon: misereor
  rationale: miserere와 misereris의 반복을 살려, 기도문체에 맞는 ‘긍휼히 여기소서’로 일관되게 번역했습니다.
- source_word: haereditati tuae
  english_pob_choice: your inheritance
  chosen_korean: 당신의 유산
  alternatives_korean:
  - 당신의 기업
  - 당신의 상속 재산
  lexicon: haereditas
  rationale: 라틴어 haereditas는 전통적으로 ‘기업’도 가능하지만, 문맥상 하나님의 소유된 백성을 가리키므로 POB의 직역 성향에 맞춰 ‘유산’으로 두었습니다.
- source_word: creatura
  english_pob_choice: creation
  chosen_korean: 피조물
  alternatives_korean:
  - 창조물
  - 피조 세계
  lexicon: creatura
  rationale: creatura는 창조 행위의 결과로 존재하는 ‘피조물’이라는 뜻이 직접적이므로, 하나님의 소유 관계를 강조하는 문맥에 맞게 ‘자기 피조물’로 옮겼습니다.
theological_decisions:
- issue: 기도의 어조와 존칭
  chosen_reading: 하나님께 드리는 직접 청원으로서 명령형 청유를 사용하되, ‘하시고/여기소서’의 경어를 유지했습니다.
  alternative_readings:
  - 완만한 서술형 기도문
  - 더 전통적인 ‘-옵소서’ 체
  rationale: 라틴어 원문은 간청의 연속이므로, 현대 합쇼체로도 간절한 직접 청원을 유지해야 합니다. 다만 하나님께 직접 드리는 말이므로 존칭을 유지했습니다.
  doctrine_reference: 기도 문체와 신적 호칭의 일관성
- issue: ‘유산’과 ‘피조물’의 관계
  chosen_reading: 하나님의 백성을 ‘유산’으로, 그들의 근거를 ‘하나님 자신의 피조물’로 제시했습니다.
  alternative_readings:
  - ‘기업’으로 번역
  - ‘창조하신 백성’으로 의역
  rationale: 본문은 백성의 언약적 소유성과 창조주-피조물 관계를 함께 근거로 삼으므로, 두 표현을 모두 유지해야 문장 논리가 살아납니다.
  doctrine_reference: 언약 백성 / 창조주-피조물 관계
