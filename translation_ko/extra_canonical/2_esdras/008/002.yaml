translation:
  language: ko
  text: 그러나 제가 당신 앞에 비유를 하나 말씀드리겠습니다, 에즈라. 땅에 물어 보면, 땅은 질그릇을 만들 수 있는 훨씬 많은 흙을 내어 주지만, 금이 생겨나는 먼지는 적게 낸다고 말할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “제가 비유를 하나 말씀드리겠습니다.”
    reason: previous_rendering
  - marker: b
    text: 또는 “많은 진흙을 내어 줍니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: Dicam autem coram te similitudinem
  english_pob_choice: I will set forth a comparison before you, Ezra
  chosen_korean: 당신 앞에 비유 하나를 제시하겠습니다, 에즈라
  alternatives_korean:
  - 당신 앞에서 비교 하나를 말씀드리겠습니다, 에즈라
  - 당신 앞에 비교 하나를 들려드리겠습니다, 에즈라
  lexicon: dicam / coram te / similitudinem
  rationale: coram te는 단순히 ‘말하다’보다 ‘당신 앞에, 당신의 면전에서’라는 위치감을 주므로, 합쇼체에서 자연스럽게 ‘당신 앞에’로 살렸고 similitudinem은 설명적 ‘비유’가 가장 적절합니다.
- source_word: quomodo autem interrogas terram et dicet tibi
  english_pob_choice: Just as, if you ask the earth, it will tell you
  chosen_korean: 곧 땅에 물으면, 땅은 ... 말할 것입니다
  alternatives_korean:
  - 만일 땅에 물으면, 땅은 ... 말할 것입니다
  - 땅에 묻는다면, 땅은 ... 대답할 것입니다
  lexicon: quomodo autem interrogas terram / dicet tibi
  rationale: 라틴어의 조건적 비교 구조를 한국어의 ‘곧 ... 물으면’으로 옮겨 흐름을 살렸고, dicet tibi는 단순 정보 전달보다 응답 행위를 드러내는 ‘말하다’가 무난합니다.
- source_word: dabit terram multam magis unde fiat fictile
  english_pob_choice: it yields much clay, from which earthen vessels are made
  chosen_korean: 많은 진흙을 내어 주어 그로부터 질그릇이 만들어지고
  alternatives_korean:
  - 많은 점토를 내어 주어 그로부터 토기가 만들어지고
  - 많은 흙을 내어 주어 그로부터 질그릇이 빚어지고
  lexicon: dabit terram multam magis / fictile
  rationale: terra는 여기서 ‘흙’보다 도자기 재료로서의 ‘진흙/점토’가 더 정확하고, fictile은 ‘질그릇’으로 옮기면 재료와 결과물의 대비가 분명해집니다.
- source_word: paruum autem puluerem unde aurum fit
  english_pob_choice: but little dust from which gold comes
  chosen_korean: 적은 먼지로부터는 금이 나온다고
  alternatives_korean:
  - 적은 가루로부터는 금이 나온다고
  - 작은 먼지에서 금이 생긴다고
  lexicon: paruum autem puluerem / aurum fit
  rationale: paruum은 ‘적은’으로 수량 대비를 살리고, puluerem은 문자적으로 ‘먼지’가 맞으며, aurum fit은 생성 의미를 살려 ‘금이 나온다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: Creation imagery used for disproportionate abundance and scarcity
  chosen_reading: 땅은 질그릇의 재료인 진흙은 많이 내어 주지만, 금이 되는 먼지는 적게 준다는 대비를 그대로 드러냈습니다.
  alternative_readings:
  - 비유를 더 추상적으로 풀어 ‘풍요와 희소성의 대비’로 옮길 수 있음
  - ‘금’ 대신 ‘황금’으로 화려하게 옮길 수 있음
  rationale: 이 절은 창조 세계의 재료 분배를 통해 뒤 절의 논증을 준비하므로, 도덕적 교훈으로 일반화하지 않고 물질적 대비 자체를 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 창조질서와 섭리의 대비적 비유
- issue: Addressee naming and register in direct speech
  chosen_reading: 에즈라를 직접 호명하는 구조를 유지하고, 전체 문장은 합쇼체로 두되 인용문 안에서도 예언적 설명체의 품위를 살렸습니다.
  alternative_readings:
  - 에스라로 음역할 수 있음
  - 직접 호명을 생략할 수 있음
  rationale: coram te가 실제로 ‘당신 앞에’라는 요소를 갖고 있으므로 수신자 호명을 보존하는 편이 source-grounded하며, 고유명사는 본문 전통상 ‘에즈라’가 자연스럽습니다.
  doctrine_reference: 본문 수신자 직접 호명 보존
