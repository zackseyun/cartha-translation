  source_fidelity: 라틴어의 coram te와 직접 호명, 땅에 묻는 조건적 비유, 질그릇과 금의 대조는 대체로 충실히 반영했습니다. 그러나 terram multam magis의 비교·불균형 강조가 현행 ‘많은 진흙’에서는 빠졌습니다. 문맥상 땅이 질그릇용 흙은 금이 나는 먼지보다 훨씬 많이 낸다는 대조를 나타내야 합니다.
  naturalness: 현행 문장도 이해할 수 있으나 ‘많은 진흙을 내어 주어 그로부터 …, 적은 먼지로부터는 …’은 연결이 다소 무겁습니다. ‘훨씬 많은 흙을 내어 주어 그것으로 … 만들게 하지만, 금이 생겨나는 먼지는 적게 낸다고’로 정리하면 현대 한국어 합쇼체에서 더 자연스럽고 대조가 선명합니다.
