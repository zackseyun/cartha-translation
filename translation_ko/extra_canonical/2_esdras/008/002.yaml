revisions:
- from: 그러나 저는 당신 앞에 비유 하나를 제시하겠습니다, 에즈라. 곧 땅에 물으면, 땅은 많은 진흙을 내어 주어 그로부터 질그릇이 만들어지고, 적은 먼지로부터는 금이 나온다고 말할 것입니다.[a][b]
  to: 그러나 제가 당신 앞에 비유를 하나 말씀드리겠습니다, 에즈라. 땅에 물어 보면, 땅은 질그릇을 만들 수 있는 훨씬 많은 흙을 내어 주지만, 금이 생겨나는 먼지는 적게 낸다고 말할 것입니다.[a][b]
  rationale: 원문의 비교적 magis를 ‘훨씬 많은’으로 살렸습니다. 또한 흙은 질그릇의 재료이고 먼지는 금이 생겨나는 것이라는 원문의 두 관계를 한국어에서 대칭적으로 드러냈습니다. ‘당신 앞에’와 ‘에즈라’를 보존하여 coram te 및 직접 호명을 유지했습니다. 각주 a는 coram te를 생략하는 간략한 대안 번역을, 각주 b는 기존 대안의 현재형·진흙 표현을 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:14Z'
