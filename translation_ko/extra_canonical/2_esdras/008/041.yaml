revisions:
- from: 그렇게 심는 것이지만, 때가 되면 뿌려진 모든 것이 구원받는 것은 아니며, 심어진 모든 것이 뿌리를 내리는 것도 아닙니다. 이 세상에 뿌려진 사람들도 모두 구원받는 것은 아닙니다.” 내가 대답하여 말했습니다. “제가 주님 앞에서 은혜를 얻었다면, 말하겠습니다.”[a]
  to: 심습니다. 그러나 뿌려진 모든 것이 제때에 구원받는 것은 아니며, 심어진 모든 것이 뿌리를 내리는 것도 아닙니다. 이 세상에 뿌려진 사람들도 모두 구원받는 것은 아닙니다.” 내가 대답하여 말했습니다. “제가 당신 앞에서 은혜를 얻었다면, 말하게 해 주십시오.”
  rationale: 앞절에서 이어지는 plantat를 자연스럽게 ‘심습니다’로 옮기고, 원문에 없는 호칭을 제거했습니다. 마지막 청원을 허락 요청으로 바로잡았으며, 이에 따라 더 이상 적용되지 않는 각주를 삭제했습니다.
