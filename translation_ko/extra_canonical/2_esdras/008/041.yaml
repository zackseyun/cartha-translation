id: 2ES.8.41
reference: 2 Esdras 8:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'plantat, sed non in tempore omnia quae seminata sunt saluabuntur, sed nec omnia quae plantata sunt radicabunt, sic et qui in saeculo seminati sunt non omnes saluabuntur. Et respondi et dixi : si inueni gratiam coram te loquar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/041.yaml
  text: plants[a], but not everything that has been sown will be saved in its time, nor will everything that has been planted take root; so also those who have been sown in the world will not all be saved.” And I answered and said, “If I have found favor before you, let me speak.”
  footnotes:
  - marker: a
    text: Or 'For just as a farmer sows many seeds upon the earth and plants a multitude of plantings, but not everything that has been sown will be preserved in its season, nor will everything that has been planted take root, so also those who have been sown in the age—not all will be saved.” And I answered and said, “If I have found favor before you, I will speak.'.
    reason: previous_rendering
translation:
  language: ko
  text: 심습니다. 그러나 뿌려진 모든 것이 제때에 구원받는 것은 아니며, 심어진 모든 것이 뿌리를 내리는 것도 아닙니다. 이 세상에 뿌려진 사람들도 모두 구원받는 것은 아닙니다.” 내가 대답하여 말했습니다. “제가 당신 앞에서 은혜를 얻었다면, 말하게 해 주십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: plantat / plantata sunt / plantata sunt
  english_pob_choice: plants / planted
  chosen_korean: 심는 것 / 심어진 것
  alternatives_korean:
  - 재배하는 것
  - 심어 둔 것
  - 심은 것
  lexicon: plantare
  rationale: 라틴어는 앞선 문맥의 비유를 이어가며 ‘심다/심어진 것’을 반복하므로, 한국어도 반복 구조를 살려 농경적 대비를 분명히 했습니다.
- source_word: saluabuntur
  english_pob_choice: will be saved
  chosen_korean: 구원받는
  alternatives_korean:
  - 보존되는
  - 살아남는
  - 구원될
  lexicon: salvare
  rationale: 문맥이 단순 보존보다 종말론적 구원을 가리키므로, POB의 ‘saved’를 따라 ‘구원받다’로 옮겼습니다.
- source_word: non in tempore
  english_pob_choice: in its time
  chosen_korean: 때가 되면
  alternatives_korean:
  - 그때에
  - 제때에
  - 그 시기에
  lexicon: in tempore
  rationale: 직역하면 ‘그것의 때에’지만 한국어에서는 자연스러운 시간 관계를 살리기 위해 ‘때가 되면’으로 옮겼습니다.
- source_word: in saeculo
  english_pob_choice: in the world
  chosen_korean: 이 세상에
  alternatives_korean:
  - 세상 안에
  - 현세에
  - 이 시대에
  lexicon: saeculum
  rationale: 라틴어 saeculum은 ‘세상/현세/시대’의 폭을 가지지만, 본문 대조상 인간이 사는 세계를 가리키므로 ‘이 세상’이 가장 자연스럽습니다.
theological_decisions:
- issue: ‘구원받다’의 반복 유지 여부
  chosen_reading: 첫 번째 saluabuntur와 두 번째 saluabuntur를 모두 ‘구원받다’로 유지했습니다.
  alternative_readings:
  - 첫 번째는 ‘보존되다’, 두 번째는 ‘구원받다’
  - 첫 번째는 ‘살아남다’, 두 번째는 ‘구원받다’
  rationale: 라틴어는 동일 동사 살바부룬투르를 반복하므로, 동일한 종말론적 판단을 일관되게 드러내는 것이 저자의 비교 논리를 보존합니다.
  doctrine_reference: 종말론적 구원과 심판의 보편적 대비
- issue: ‘If I have found favor before you, let me speak’의 호소체
  chosen_reading: ‘제가 주님 앞에서 은혜를 얻었다면, 말하겠습니다.’
  alternative_readings:
  - ‘제가 주님 앞에서 은혜를 얻었다면, 말하게 해 주십시오.’
  - ‘제가 주님께 은혜를 입었다면, 말하겠습니다.’
  rationale: 라틴어 si inueni gratiam coram te는 직설적 허락 요청이라, 공손한 합쇼체로 살리되 과도한 의역 없이 발화 허가의 뜻을 유지했습니다.
  doctrine_reference: 경외적 호칭과 청원적 발화 양식
