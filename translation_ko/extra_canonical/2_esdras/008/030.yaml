  text: 짐승보다 더 못한 자들에게는 분노하지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Neque indigneris
  english_pob_choice: Do not be angry
  chosen_korean: 분노하지 마십시오
  alternatives_korean:
  - 성내지 마십시오
  - 격노하지 마십시오
  lexicon: indigneris → 분노하다
  rationale: 라틴어 indigneris는 ‘분개하다/화를 내다’의 금지형으로, 합쇼체 권고문에서는 ‘분노하지 마십시오’가 가장 직접적이고 문맥에 맞습니다.
- source_word: eis
  english_pob_choice: those
  chosen_korean: 그들
  alternatives_korean:
  - 그 사람들에게
  - 그 자들에게
  lexicon: eis → 그들
  rationale: 지시 대명사를 자연스럽게 살리되, 대상 집단을 지칭하는 일반적인 한국어 인칭 대명사로 옮겼습니다.
- source_word: qui bestiis peius sunt
  english_pob_choice: who are worse than beasts
  chosen_korean: 더 짐승 같은 자들
  alternatives_korean:
  - 짐승보다 더 나쁜 자들
  - 짐승보다 못한 자들
  lexicon: bestiis peius sunt → 더 짐승 같은 자들
  rationale: peius sunt는 단순 비교를 넘어 도덕적/행동적 비하를 담으므로, 직역보다 한국어에서 비슷한 경멸적 평가를 전달하는 표현을 택했습니다.
theological_decisions:
- issue: 문장 결손과 절의 범위
  chosen_reading: 제공된 라틴어 본문에 있는 경고문만 번역하고, 뒤에 제시된 추가 문구는 넣지 않았습니다.
  alternative_readings:
  - 판본 차이를 따라 ‘그대의 영광을 항상 신뢰한 자들을 사랑하십시오’ 같은 추가 절을 포함
  rationale: 최신 검토에서 확인된 대로 제공 본문에는 그 추가 내용이 없으므로, 본문 경계를 넘지 않도록 엄격히 제한했습니다.
  doctrine_reference: 본문 비평 및 충실한 원문 대응 원칙
