  text: erunt. Neque adtendas impie agentium studia, sed qui tua
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/026.yaml
  text: but upon those who have served you in truth[a]. Do not pay attention to the pursuits of those who act impiously,
  footnotes:
  - marker: a
    text: Or 'Do not attend to'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신을 참으로 섬긴 자들 위에 두십시오[a]. 불경하게 행하는 자들의 행위에는 마음을 두지 마십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주의를 기울이지 마십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: adtendas
  english_pob_choice: Do not pay attention to
  chosen_korean: 마음을 두지 마십시오
  alternatives_korean:
  - 주의를 기울이지 마십시오
  - 신경 쓰지 마십시오
  lexicon: attendo
  rationale: 라틴어 adtendas는 단순한 ‘보다’가 아니라 마음을 향하게 하거나 주의를 기울이게 하는 뜻이므로, 현대 한국어에서는 ‘마음을 두다’가 가장 자연스럽고 소스 의미를 잘 드러냅니다.
- source_word: qui tua servierunt in veritate
  english_pob_choice: those who have served you in truth
  chosen_korean: 당신을 참으로 섬긴 자들
  alternatives_korean:
  - 진리 가운데 당신을 섬긴 자들
  - 진실로 당신을 섬긴 자들
  lexicon: servio
  rationale: servierunt는 ‘섬기다’로 옮기고, in veritate는 행위의 성실성과 참됨을 나타내므로 ‘참으로’로 간결하게 반영했습니다.
- source_word: impie agentium studia
  english_pob_choice: the pursuits of those who act impiously
  chosen_korean: 불경하게 행하는 자들의 행위
  alternatives_korean:
  - 경건하지 않게 행하는 자들의 추구
  - 불경한 자들의 추구
  lexicon: impius
  rationale: studia는 ‘추구/열심’까지 가능하지만, 문맥상 불경한 자들의 삶의 방향과 행위를 가리키므로 한국어에서는 ‘행위’로 풀어 의미를 분명히 했습니다.
theological_decisions:
- issue: ‘in veritate’의 신학적 뉘앙스
  chosen_reading: ‘참으로’는 단순한 사실 확인이 아니라 하나님 앞에서의 참됨과 성실함을 함께 드러내는 표현으로 처리했습니다.
  alternative_readings:
  - ‘진리 안에서’
  - ‘진실로’
  rationale: 라틴어 전치사구를 과도하게 교리화하지 않되, 섬김의 진정성과 신실함이라는 문맥적 뉘앙스를 보존했습니다.
  doctrine_reference: 성실한 섬김과 참됨에 관한 성경적 용례 일반
- issue: 불경한 자들의 행위를 바라보지 말라는 권면의 강도
  chosen_reading: ‘마음을 두지 마십시오’로 번역해 단순한 시선의 문제가 아니라 내적 주의와 판단의 방향을 포함하게 했습니다.
  alternative_readings:
  - ‘보지 마십시오’
  - ‘주의를 기울이지 마십시오’
  rationale: 문맥상 시각적 금지보다 정신적·의지적 집중의 금지가 더 적절하므로, 원문의 adtendas를 그에 맞게 옮겼습니다.
  doctrine_reference: 지혜문학적 권면과 내적 분별의 일반 원리
