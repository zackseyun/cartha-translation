review_pass:
  verdict: revise
  source_fidelity: 초안의 첫 문장 ‘그러나 당신을 참으로 섬긴 자들 위에 두십시오’는 영어의 ‘but upon those …’를 표면적으로 잘못 결합한 것으로, 문맥상 그들에게 ‘눈을 돌리다/돌아보다’라는 뜻을 전하지 못합니다. 또한 studia는 단순한 개별 ‘행위’보다 그들이 힘쓰고 추구하는 바를 가리킵니다. adtendas는 ‘주의를 기울이다’로 정확히 옮길 수 있습니다.
  naturalness: ‘…자들 위에 두십시오’는 현대 한국어에서 비문에 가깝고 의미도 불명확합니다. ‘…을 돌아보십시오’ 및 ‘…이 힘쓰는 일에 주의를 기울이지 마십시오’가 합쇼체에서 자연스럽습니다.
  terminology: in veritate는 ‘참으로’보다 섬김의 진실성과 성실성을 드러내는 ‘진실하게’가 적절합니다. impie agentium은 ‘불경하게 행하는 자들’로 유지할 수 있으며, studia는 ‘힘쓰는 일’로 번역해 추구·열심의 뜻을 보존합니다.
  issues:
  - severity: high
    issue: 첫 절의 핵심 동작이 ‘위에 두십시오’로 잘못 번역됨
    rationale: 문맥과 영어 감사 번역의 ‘but upon those who have served you’는 그들을 돌아보라는 앞선 동사의 보어적 대조를 나타냅니다. ‘위에 두다’는 원문의 의미도 한국어 문장도 성립시키지 못합니다.
  - severity: medium
    issue: studia를 ‘행위’로 축소함
    rationale: studia는 행위 자체보다 관심, 열심, 추구하는 바를 가리킵니다. ‘힘쓰는 일’은 이 의미를 자연스럽게 보존합니다.
  - severity: low
    issue: 각주 표지가 해당 어구에 연결되지 않음
    rationale: 각주의 ‘또는 주의를 기울이지 마십시오’는 adtendas의 번역 대안을 설명하므로 둘째 문장의 해당 표현 뒤에 놓여야 합니다.
  revised_text: 그러나 진실하게 당신을 섬긴 이들을 돌아보십시오. 불경하게 행하는 자들이 힘쓰는 일에 주의를 기울이지 마십시오[a].
