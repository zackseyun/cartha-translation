id: 2ES.8.7
reference: 2 Esdras 8:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: portabit locum hominis. Solus enim es, et una plasmatio nos sumus manuum tuarum, sicut locutus es.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/007.yaml
  text: will bear the place of a man. For you alone are one[a], and we are one thing formed by your hands, as you have spoken.
  footnotes:
  - marker: a
    text: Or 'who bears the place of a man.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 사람의 자리를 차지할 것입니다. 당신만이 하나이시며, 우리는 당신의 손으로 지으신 하나의 존재이니, 당신이 말씀하신 대로입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람의 형상을 지닐 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: portabit locum hominis
  english_pob_choice: will bear the place of a man
  chosen_korean: 사람의 자리를 차지할 것입니다
  alternatives_korean:
  - 사람의 자리를 지닐 것입니다
  - 사람의 자리를 맡을 것입니다
  - 사람의 형상을 지닐 것입니다
  lexicon: portabit / locus
  rationale: 라틴어 표면형은 ‘자리’이지만, 이 구절은 전승상 ‘형상’으로 읽힐 가능성이 제기된 난구절입니다. 다만 현재 제시된 최종 POB는 라틴어를 더 직접 반영하므로, 한국어도 ‘자리를 차지하다’로 옮겨 현재 본문을 따라갑니다.
- source_word: una
  english_pob_choice: one
  chosen_korean: 하나이시며
  alternatives_korean:
  - 한 분이시며
  - 하나이시고
  - 유일하신 분이시며
  lexicon: unus
  rationale: 하나님의 유일성과 단일성을 자연스럽게 드러내기 위해 ‘하나’보다 서술형 ‘하나이시며’를 택했습니다.
- source_word: una plasmatio nos sumus manuum tuarum
  english_pob_choice: we are one thing formed by your hands
  chosen_korean: 우리는 당신의 손으로 지으신 하나의 존재이니
  alternatives_korean:
  - 우리는 당신의 손으로 빚어진 한 피조물이니
  - 우리는 당신의 손으로 형성된 하나의 존재이니
  - 우리는 당신의 손으로 지으신 한 존재이니
  lexicon: plasmatio / manus
  rationale: plasmatio는 ‘지음/빚음/형성됨’의 의미를 가지므로, 인격적 창조 행위를 살리면서도 현대 한국어에서 자연스러운 ‘지으신 하나의 존재’로 옮겼습니다.
theological_decisions:
- issue: ‘one’의 대상이 하나님인지, 창조된 인류의 연합성인지
  chosen_reading: ‘당신만이 하나이시며’는 하나님을 가리키고, 뒤의 ‘우리는…하나의 존재’는 피조물인 우리를 가리킨다고 구분해 옮겼습니다.
  alternative_readings:
  - ‘당신만이 유일하십니다’로만 단순화
  - ‘우리는 하나입니다’로 평탄화
  rationale: 원문은 하나님과 인간의 관계를 대조합니다. 한국어에서도 두 절의 주체를 구분해 신학적 긴장을 보존하는 편이 본문의 의미를 더 잘 드러냅니다.
  doctrine_reference: 창조주-피조물 구별
