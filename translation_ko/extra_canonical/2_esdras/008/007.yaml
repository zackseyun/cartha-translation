revisions:
- from: 그는 사람의 자리를 차지할 것입니다. 당신만이 하나이시며, 우리는 당신의 손으로 지으신 하나의 존재이니, 당신이 말씀하신 대로입니다.[a]
  to: 사람의 자리를 차지할 것입니다.[a] 당신만 홀로 계시고, 당신께서 말씀하신 대로 우리는 당신의 손으로 지어진 하나의 피조물입니다.
  rationale: 라틴어 본문의 ‘자리’를 본문에 유지했습니다. solus의 의미를 ‘홀로’로 명확히 하고, una plasmatio manuum tuarum의 창조·형성 의미를 ‘당신의 손으로 지어진 하나의 피조물’로 살렸습니다. 각주 표지도 대안 읽기가 가리키는 첫 절에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
