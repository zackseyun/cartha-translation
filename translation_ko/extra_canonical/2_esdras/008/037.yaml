  text: According to your words, so it will be. For truly I will not think
translation:
  language: ko
  text: 당신의 말씀대로 그렇게 될 것입니다. 참으로 저는 생각하지 않겠습니다.
  philosophy: formal
lexical_decisions:
- source_word: iuxta sermones tuos
  english_pob_choice: According to your words
  chosen_korean: 당신의 말씀대로
  alternatives_korean:
  - 당신의 말에 따라
  - 당신의 말씀에 따라
  lexicon: iuxta + sermones
  rationale: iuxta는 ‘~대로/따라’의 대응관계를 나타내므로, 문어체에서 자연스러운 ‘-대로’로 옮겨 원문의 종속 관계를 분명히 했습니다.
- source_word: sic et fiet
  english_pob_choice: so it will be
  chosen_korean: 그렇게 될 것입니다
  alternatives_korean:
  - 그리될 것입니다
  - 그와 같이 이루어질 것입니다
  lexicon: sic + fiet
  rationale: fiet는 미래 시제로 ‘될 것이다’를 뜻하므로, 원문의 단정적 미래를 살려 합쇼체로 옮겼습니다.
- source_word: Quoniam uere
  english_pob_choice: For truly
  chosen_korean: 참으로
  alternatives_korean:
  - 진실로
  - 정말로
  lexicon: quoniam + uere
  rationale: quoniam의 인과를 노골적으로 길게 풀기보다, 이어지는 진술의 강조를 살리는 ‘참으로’로 간결하게 처리했습니다.
- source_word: non cogitabo
  english_pob_choice: I will not think
  chosen_korean: 생각하지 않겠습니다
  alternatives_korean:
  - 생각하지 않을 것입니다
  - 헤아리지 않겠습니다
  lexicon: cogito
  rationale: cogito는 ‘생각하다/고려하다’의 뜻이므로, 단순한 내적 사유의 부정을 자연스럽게 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 원문에 없는 설명적 요소를 보태지 않는가
  chosen_reading: 문장 두 개를 그대로 직역에 가깝게 분리하여, 추가 화자나 설명을 넣지 않았습니다.
  alternative_readings:
  - 앞뒤 문맥을 보강해 대화체로 풀어 쓰는 방식
  rationale: 제시된 라틴 본문은 짧은 응답문과 그 뒤의 단언으로만 이루어져 있어, 영어 POB 개정처럼 불필요한 대화 틀을 덧붙이지 않는 것이 원문 보존에 더 충실합니다.
  doctrine_reference: source-faithfulness
