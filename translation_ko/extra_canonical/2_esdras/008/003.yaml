  text: 'sic et actus praesentis saeculi: Multi quidem creati sunt, pauci autem saluabuntur.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/003.yaml
  text: 'so also is the course of the present age: many indeed have been created[a], but few will be saved.'
  footnotes:
  - marker: a
    text: Or 'so also are the deeds of the present age:'.
    reason: previous_rendering
translation:
  language: ko
  text: 이와 같이 현 세상의 흐름도 그러합니다. 많은 사람이 창조되었지만, 오직 적은 사람만 구원을 받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘현 세상의 흐름’은 라틴 actus를 ‘행위’가 아니라 ‘과정/양상’으로 읽은 해석을 반영합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: actus praesentis saeculi
  english_pob_choice: the course of the present age
  chosen_korean: 현 세상의 흐름
  alternatives_korean:
  - 현 세상의 행위
  - 현 시대의 행로
  - 현 세상의 작용
  lexicon: actus; saeculum
  rationale: audited English POB가 ‘deeds’에서 ‘course’로 수정되었으므로, 인간의 도덕적 행위가 아니라 현재 시대 전체의 흐름·양상을 가리키는 표현으로 옮겼습니다.
- source_word: Multi quidem creati sunt
  english_pob_choice: many indeed have been created
  chosen_korean: 많은 사람이 창조되었지만
  alternatives_korean:
  - 많은 사람이 만들어졌지만
  - 많은 이들이 지음 받았지만
  lexicon: creati sunt
  rationale: creare의 수동 완료형을 살려 ‘창조되다’로 옮기되, 한국어에서는 자연스러운 문장 흐름을 위해 ‘사람이’로 풀어 썼습니다.
- source_word: pauci autem saluabuntur
  english_pob_choice: but few will be saved
  chosen_korean: 오직 적은 사람만 구원을 받을 것입니다
  alternatives_korean:
  - 그러나 적은 사람만 구원받을 것입니다
  - 하지만 소수만 구원될 것입니다
  lexicon: saluabuntur
  rationale: 미래 수동의 결과를 살려 ‘구원을 받을 것입니다’로 옮겼고, 대비를 강조하기 위해 ‘오직’를 보탰습니다.
theological_decisions:
- issue: ‘created’와 ‘saved’의 병렬 구조
  chosen_reading: 창조와 구원의 대비를 그대로 살려, 인간의 대다수/소수 문제를 일반적 진술로 표현했습니다.
  alternative_readings:
  - 도덕적 행동의 많고 적음으로 이해하는 번역
  - 예정론적 색채를 더 강하게 드러내는 번역
  rationale: 이 절은 ‘현 세상의 흐름’과 ‘많은 사람이 창조됨/적은 사람이 구원받음’의 대조를 제시하므로, 인간 행위보다 창조-구원 대비가 드러나야 합니다.
  doctrine_reference: 2 Esdras 8:3 문맥의 비유적 대비 구조
- issue: 보편적 진술의 어조
  chosen_reading: 단정적 예언 어조를 유지하되, 한국어에서는 미래형으로 자연스럽게 풀었습니다.
  alternative_readings:
  - 현재형 단정으로 옮기는 방식
  - 더 강한 종말론적 선언으로 옮기는 방식
  rationale: 라틴 미래 수동 ‘saluabuntur’의 시간 감각을 보존하면서, 독자에게 과도한 해석을 덧붙이지 않도록 했습니다.
  doctrine_reference: 문맥상 미래 구원 진술
