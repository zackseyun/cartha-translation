  naturalness: ‘현재 시대의 흐름’과 ‘구원받을 것입니다’는 현대 표준 한국어의 합쇼체 문맥에서 자연스럽습니다. ‘그러합니다’는 앞선 비유를 받는 진술로 적절합니다.
  terminology: saeculi는 ‘현재 시대’로, creati sunt와 saluabuntur는 각각 ‘창조되었다’와 ‘구원받을 것이다’로 옮겨 창조와 구원의 병렬 및 미래 수동의 의미를 보존했습니다. actus는 문맥상 ‘흐름’이 적합하나, ‘행위들’이라는 가능한 대안을 주석으로 남겨야 합니다.
