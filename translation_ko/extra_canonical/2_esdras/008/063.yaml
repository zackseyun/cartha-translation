review_pass:
  verdict: revise
  source_fidelity: 초안은 multitudinem signorum를 ‘많은 표징들’로, in nouissimis를 ‘마지막 때에’로 적절히 옮겼습니다. 그러나 incipies facere(‘행하기 시작할/시작하여 행할’)의 시작·개시 의미가 ‘하실’에서 사라졌습니다. 라틴어의 시간 간접의문 quo tempore도 보존해야 합니다.
  naturalness: ‘그 시기가 언제인지에 대해서는’은 다소 장황하며, 앞의 표징들을 실제로 행할 시점이라는 관계가 충분히 드러나지 않습니다. 두 절로 나누고 ‘어느 때에 그렇게 행하시기 시작하실지는’으로 옮기면 현대 한국어 합쇼체로 자연스럽고 원문의 관계도 분명해집니다.
  terminology: signa는 이 문맥에서 ‘표징들’이 적절합니다. ‘마지막 때’도 종말론적 시간대를 과도하게 교리화하지 않고 반영합니다. 원문에 명시된 명칭은 없으므로 ‘당신’이라는 호칭을 유지하되, 존대 서술어를 사용합니다.
  issues:
  - severity: medium
    issue: incipies facere의 ‘시작하다’ 의미가 누락되었습니다.
    rationale: ‘하실’은 단순 미래 행위만 나타내며, incipies의 개시상을 반영하지 못합니다. ‘행하시기 시작하실’로 보완하는 것이 안전합니다.
  - severity: low
    issue: 두 번째 ‘보여 주다’의 목적 관계가 불명확하고 표현이 장황합니다.
    rationale: quo tempore는 표징을 행하기 시작할 때를 묻는 간접의문입니다. ‘어느 때에 그렇게 행하시기 시작하실지는’이 이를 자연스럽게 드러냅니다.
  - severity: low
    issue: 현 각주는 라틴어에 정관사가 없다는 일반 설명만 제공하며 본문의 핵심 번역 쟁점을 설명하지 않습니다.
    rationale: 한국어 ‘많은’은 이미 비특정적으로 자연스럽고 별도 각주가 필요하지 않습니다. 각주를 제거해도 의미 손실이 없습니다.
  revised_text: 당신께서는 마지막 때에 행하시기 시작하실 많은 표징들을 제게 보여 주셨습니다. 그러나 어느 때에 그렇게 행하시기 시작하실지는 제게 보여 주지 않으셨습니다.”
