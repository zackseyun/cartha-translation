  to: 당신께서는 마지막 때에 행하시기 시작하실 많은 표징들을 제게 보여 주셨습니다. 그러나 어느 때에 그렇게 행하시기 시작하실지는 제게 보여 주지 않으셨습니다.”
  rationale: 원문의 incipies facere에 있는 개시 의미를 두 차례 모두 반영했습니다. quo tempore가 가리키는 바를 앞 절의 행위와 연결하되, 원문이 특정 시점을 밝히지 않는 모호성은 그대로 유지했습니다. 불필요한 어휘 각주는 삭제했습니다.
