translation:
  language: ko
  text: 당신은 마지막 때에 하실 많은 표징들을 내게 보여 주셨지만, 그 시기가 언제인지에 대해서는 내게 보여 주지 않으셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘많은 표징들’은 라틴어의 비한정 표현을 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: multitudinem signorum
  english_pob_choice: a multitude of signs
  chosen_korean: 많은 표징들
  alternatives_korean:
  - 표징들의 무리
  - 수많은 표징들
  - 많은 징조들
  lexicon: signum → 표징
  rationale: 라틴어에는 정관사가 없으므로 특정한 ‘그 많은’보다 비한정의 ‘많은’이 자연스럽고, signa는 단순한 신호보다 의미를 지닌 ‘표징’이 더 가깝습니다.
- source_word: incipies facere
  english_pob_choice: that you will begin to do
  chosen_korean: 하실
  alternatives_korean:
  - 시작하실
  - 하기 시작하실
  - 행하시기 시작하실
  lexicon: incipio + infinitive → 시작하다/하기 시작하다
  rationale: 최신 수정안이 ‘will begin to do’로 정리된 점을 반영하되, 한국어에서는 반복을 피하고 자연스럽게 ‘하실’로 옮겨 시작의 뉘앙스를 유지했습니다.
- source_word: in nouissimis
  english_pob_choice: in the last times
  chosen_korean: 마지막 때에
  alternatives_korean:
  - 끝날 때에
  - 말세에
  - 마지막 시대에
  lexicon: novissimis → 마지막 때
  rationale: 문자적으로 ‘마지막들’이지만 한국어 성경 문맥에서는 시간적 종결을 가리키는 ‘마지막 때’가 가장 직역적이고도 읽기 자연스럽습니다.
- source_word: quo tempore
  english_pob_choice: at what time
  chosen_korean: 그 시기가 언제인지에 대해서는
  alternatives_korean:
  - 언제인지
  - 어느 때인지
  - 그때가 언제인지
  lexicon: tempore → 시기
  rationale: time를 단순한 시점보다 ‘시기’로 풀어야 앞절의 종말적 행위와 잘 맞고, ‘에 대해서는’은 라틴어의 간접의문 구조를 한국어로 분명히 해 줍니다.
theological_decisions:
- issue: ‘마지막 때’ 표현의 종말론적 강도
  chosen_reading: 종말론적 미래를 가리키는 표현으로 ‘마지막 때’라고 옮겼습니다.
  alternative_readings:
  - 말세에
  - 끝날에
  rationale: 이 구절은 에스드라의 종말 예고 문맥에 속하므로, 단순한 미래가 아니라 역사 종결을 향한 시간대를 드러내는 표현이 필요합니다.
  doctrine_reference: eschatology
- issue: 신적 행위의 존칭 처리
  chosen_reading: 하나님/주어의 직접 행위를 가리키는 동사는 공손한 존대체 ‘-십니다’로 처리했습니다.
  alternative_readings:
  - 평서형 ‘보여 주셨습니다’
  rationale: 직접 대화에서 신적 주체를 높이는 한국어 성경 문체를 유지하면서도, 현대 표준어 합쇼체 범위 안에서 자연스럽게 정리했습니다.
  doctrine_reference: korean register
