    rationale: enim은 Iusti 절 전체가 선행 문장을 설명하거나 근거를 제시함을 나타냅니다. 관계절의 ‘많은 행위’ 자체를 직접적 이유로 만드는 표현은 문장 구조와 논증 연결을 흐립니다.
  - severity: medium
    issue: 미래형 recipient를 현재형 ‘받습니다’로 번역함
    rationale: recipient는 미래 능동 직설법이므로 ‘받을 것입니다’로 옮겨야 합니다.
  - severity: low
