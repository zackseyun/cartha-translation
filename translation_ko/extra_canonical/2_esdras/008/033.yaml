id: 2ES.8.33
reference: 2 Esdras 8:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non habentibus opera iusticiae. Iusti enim quibus sunt operae multae repositae apud te, ex propriis operibus recipient mercedem. Quid est enim homo ut ei indigneris, aut genus corruptibile ut ita amariceris de ipso ? In ueritate enim nemo de genitis est qui non impie gessit et de confitentibus qui non
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/033.yaml
  text: For the righteous[a], who have many works laid up with you, will receive their reward from their own works.
  footnotes:
  - marker: a
    text: Or 'But the righteous, who have many works laid up with you, will receive their reward from their own works.'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신 앞에 많은 행위가 간직되어 있는 의인들은 자기 행위로 보상을 받을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 당신 앞에 많은 행위가 간직되어 있는 의인들은 자기 행위로 보상을 받을 것입니다.”
    reason: 문두의 enim은 앞선 논증을 설명하는 ‘왜냐하면/참으로’로도, 문맥상 대조를 잇는 ‘그러나’로도 번역될 수 있습니다. 본문은 원문의 설명적 연결을 따릅니다.
lexical_decisions:
- source_word: Iusti
  english_pob_choice: the righteous
  chosen_korean: 의인들에게는
  alternatives_korean:
  - 의로운 사람들에게는
  - 의인들은
  lexicon: iustus
  rationale: 라틴어 iusti는 단순한 도덕적 ‘올바름’보다 하나님 앞에서 의롭다고 인정받는 사람들을 가리키므로, POB의 ‘the righteous’를 따라 ‘의인’으로 옮겼습니다.
- source_word: apud te
  english_pob_choice: with you
  chosen_korean: 당신 곁에
  alternatives_korean:
  - 당신 안에
  - 당신 앞에
  - 당신에게
  lexicon: apud + te
  rationale: apud te는 단순 소유보다 하나님 곁에/앞에 보관되어 있다는 관계를 나타내므로, 한국어에서는 ‘당신 곁에’로 자연스럽게 살렸습니다.
- source_word: operae multae repositae
  english_pob_choice: many works laid up
  chosen_korean: 많은 행위가 쌓여 있으므로
  alternatives_korean:
  - 많은 행위가 예치되어 있으므로
  - 많은 업적이 간직되어 있으므로
  - 많은 일이 쌓여 있으므로
  lexicon: operae multae repositae
  rationale: repositae의 ‘저장됨/쌓임’을 반영하되, 행위의 축적을 드러내기 위해 ‘쌓여 있으므로’로 번역했습니다. opera는 문맥상 단순 노동보다 행위를 뜻합니다.
- source_word: mercedem
  english_pob_choice: reward
  chosen_korean: 보상을 받습니다
  alternatives_korean:
  - 삯을 받습니다
  - 상을 받습니다
  - 보수를 받습니다
  lexicon: merces
  rationale: merces는 보상/삯의 의미를 가지며, 본문이 의인의 행위에 따른 응답을 말하므로 ‘보상’이 가장 중립적이고 문맥에 적절합니다.
theological_decisions:
- issue: 의인과 행위의 관계
  chosen_reading: 의인들은 은혜의 선물이 아니라 자기 행위에 따라 보상을 받는다는 대비를 유지했습니다.
  alternative_readings:
  - 의인도 결국 은혜로 보상을 받는다는 완화된 표현
  - 행위를 거의 약화시켜 공로 뉘앙스를 줄인 표현
  rationale: 직전 문맥의 논증은 행위가 없는 자에 대한 자비와 의인의 보상을 대조하므로, 본문이 실제로 말하는 공로/보상 구조를 약화하지 않았습니다.
  doctrine_reference: 2 Esdras 8:32-36의 보상 논리
- issue: 직설적 2인칭 하나님의 호칭
  chosen_reading: apud te를 ‘당신 곁에’로 옮겨, 하나님께 대한 직접 호칭이지만 과도하게 경어화된 종교어로 굳히지 않았습니다.
  alternative_readings:
  - 하나님께서
  - 주님께
  - 당신께
  rationale: 라틴 본문의 직접 2인칭을 보존하면서도, 현대 한국어에서 자연스럽고 엄숙한 호칭을 유지하기 위해 ‘당신’을 사용했습니다.
  doctrine_reference: 문맥상 하나님 직접 خطاب
