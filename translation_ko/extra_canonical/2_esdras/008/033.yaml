    rationale: apud te repositae는 하나님 앞/곁에 보존되어 있다는 뜻이며, 한국어에서는 ‘당신 앞에 … 간직되어 있는’이 더 자연스럽고 정확합니다.
  revised_text: 당신 앞에 많은 행위가 간직되어 있는 의인들은 자기 행위로 보상을 받을 것이기 때문입니다.[a]
