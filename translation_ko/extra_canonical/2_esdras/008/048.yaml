  text: sed et in hoc mirabilis eris coram Altissimo,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/048.yaml
  text: But in this also you will be marvelous before the Most High,[a]
  footnotes:
  - marker: a
    text: Or 'But in this also you will be admirable before the Most High,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 이 일에서도 당신은 지극히 높으신 분 앞에서 놀라운 존재가 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 이 일에서도 당신은 지극히 높으신 분 앞에서 감탄할 만한 존재가 될 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: sed et in hoc
  english_pob_choice: But in this also
  chosen_korean: 그러나 이 일에서도
  alternatives_korean:
  - 그런데 이 일에서도
  - 또한 이 일에서도
  lexicon: sed et / in hoc
  rationale: 반전 접속사 sed et의 대조를 살리면서 in hoc를 자연스러운 한국어로 옮겨, 앞선 내용과의 대비 속에 ‘이 일에서도’라는 범위를 분명히 했습니다.
- source_word: mirabilis
  english_pob_choice: marvelous
  chosen_korean: 놀라운
  alternatives_korean:
  - 경이로운
  - 기이한
  - 찬란한
  lexicon: mirabilis
  rationale: 라틴어 mirabilis의 핵심 의미는 ‘놀라운, 경이로운, 마블러스’이므로, 현대 한국어에서 신학적·문학적 무게를 가장 안정적으로 전달하는 ‘놀라운’을 택했습니다.
- source_word: coram Altissimo
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 가장 높으신 분 앞에서
  - 지존하신 분 앞에서
  lexicon: coram / Altissimus
  rationale: coram은 ‘~앞에서’의 면전성을 나타내며, Altissimus는 하나님을 가리키는 칭호이므로 인칭적 존칭을 살려 ‘지극히 높으신 분’으로 옮겼습니다.
theological_decisions:
- issue: Altissimus의 번역 방식
  chosen_reading: 하나님을 지칭하는 칭호로서 ‘지극히 높으신 분’이라고 옮겼습니다.
  alternative_readings:
  - ‘가장 높으신 분’으로 직역
  - ‘지존자’로 축약
  rationale: 이 구절은 직함 자체보다 하나님 앞에서의 존재론적·예배적 위치를 드러내므로, 한국어에서도 인격적 호칭을 유지하는 편이 본문의 힘을 더 잘 보존합니다.
  doctrine_reference: 하나님의 지고성 및 인격적 현존
- issue: mirabilis의 어감
  chosen_reading: ‘놀라운’으로 번역해 단순한 칭찬이 아니라 경이와 예외성을 드러냈습니다.
  alternative_readings:
  - ‘훌륭한’
  - ‘감탄할 만한’
  rationale: English POB가 'admirable'의 약화된 뉘앙스를 피하고 'marvelous'를 택한 수정 취지를 반영해, 한국어에서도 도덕적 칭찬보다 종말론적 경이성을 살렸습니다.
  doctrine_reference: 하나님 앞에서의 경이로운 표징성
