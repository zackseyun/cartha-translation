source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu autem pro te intellege et de similibus tuis inquire gloriam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/051.yaml
  text: But understand for yourself[a], and seek glory among those like you.
  footnotes:
  - marker: a
    text: Or 'Therefore many miserable miseries will befall those who inhabit the world in the last times, because they have walked in great pride.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 스스로 깨달으시고, 당신과 같은 이들에 관해서 영광을 찾으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tu autem
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그런데
  - 하지만
  lexicon: Latin tu autem
  rationale: 문맥상 앞선 논지를 전환하는 접속으로서 ‘그러나’가 가장 자연스럽고, 원문의 대조를 분명히 드러냅니다.
- source_word: pro te intellege
  english_pob_choice: understand for yourself
  chosen_korean: 너 자신을 위해 이해하고
  alternatives_korean:
  - 스스로 깨닫고
  - 너를 위해 분별하고
  lexicon: Latin intellege
  rationale: intellege는 단순한 지적 이해보다 분별하여 알아차림을 뜻하므로, 직역을 넘지 않으면서도 현대 한국어에서 통하는 표현으로 옮겼습니다.
- source_word: de similibus tuis
  english_pob_choice: among those like you
  chosen_korean: 너와 같은 이들 가운데서
  alternatives_korean:
  - 너와 비슷한 사람들 가운데서
  - 너와 같은 부류 가운데서
  lexicon: Latin similis
  rationale: similibus tuis는 ‘너와 같은 사람들’이라는 집합적 표현이므로, 관계를 유지하면서도 한국어 어감상 자연한 ‘이들 가운데서’를 택했습니다.
- source_word: gloriam
  english_pob_choice: glory
  chosen_korean: 영광
  alternatives_korean:
  - 명예
  - 찬란함
  lexicon: Latin gloria
  rationale: gloria의 핵심 의미는 명예/영광이지만, 문맥상 추상적 가치 추구를 가리키므로 성경 번역에서 일관된 ‘영광’을 유지했습니다.
theological_decisions:
- issue: 명령형의 직접성
  chosen_reading: ‘이해하고… 구하십시오’로 명령의 직접성을 살렸습니다.
  alternative_readings:
  - ‘이해해야 합니다’처럼 권고문으로 완화하는 번역
  - ‘분별하십시오’로만 옮겨 명령의 폭을 좁히는 번역
  rationale: 라틴 원문은 2인칭 단수 명령형 두 개를 사용하므로, 권면의 강도를 유지하는 합쇼체 명령형이 가장 충실합니다.
  doctrine_reference: 본문의 문법적 명령형 보존
- issue: ‘gloriam’의 지향 대상
  chosen_reading: ‘너와 같은 이들 가운데서 영광을 구하십시오’로, 자기중심적 우월 추구보다 동류 집단 안에서의 영광 추구라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘자신의 영광을 구하십시오’로 개인적 명예로 좁히는 번역
  - ‘영광을 찾으십시오’로 대상성을 흐리는 번역
  rationale: de similibus tuis가 붙어 있어 영광의 추구가 ‘너와 같은 이들’과 관련됨을 보여 줍니다. 이를 반영해 문장 관계를 보존했습니다.
  doctrine_reference: 문맥 내 수식 관계 보존
