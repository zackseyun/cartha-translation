    text: 라틴어 seruare의 반복을 따라 같은 어근을 반복해 옮겼습니다.
    reason: source_note
  - marker: b
    text: English POB의 'preservation'을 반영한 추상명사입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: seruat / seruatur / seruabuntur / seruatione
  english_pob_choice: preserves / is preserved / will be preserved / by your preservation
  chosen_korean: 보존하는 것 / 보존되는 것 / 보존될 것입니다 / 당신의 보존으로
  alternatives_korean:
  - 지키는 것 / 지켜지는 것 / 지켜질 것입니다 / 당신의 지킴으로
  - 보호하는 것 / 보호되는 것 / 보호될 것입니다 / 당신의 보호로
  lexicon: 보존
  rationale: 라틴어의 seruare 반복을 일관되게 살려, 능동과 수동 및 명사형 seruatio의 대응을 모두 유지했습니다. English POB의 'preservation'도 추상적 '보존'으로 옮겨 원문의 반복 효과를 보존했습니다.
- source_word: utraque
  english_pob_choice: both
  chosen_korean: 둘 다
  alternatives_korean:
  - 양쪽 다
  - 둘 모두
  lexicon: 둘 다
  rationale: utraque는 두 항목을 함께 묶는 표현이므로 한국어에서는 간결한 '둘 다'가 가장 자연스럽습니다.
- source_word: seruabuntur
  english_pob_choice: will be preserved
  chosen_korean: 보존될 것입니다
  alternatives_korean:
  - 지켜질 것입니다
  - 보호될 것입니다
  lexicon: 보존
  rationale: 미래 수동을 그대로 살려, 결과의 확실성을 현대 한국어의 미래형으로 분명히 했습니다.
theological_decisions:
- issue: 문장 첫머리 est.의 기능
  chosen_reading: 독립된 단정으로 보고 「그것은 끝났습니다」로 옮겼습니다.
  alternative_readings:
  - 「그것입니다」처럼 단순 연결로 옮길 수 있습니다.
  - 앞 문맥에 붙여 생략할 수 있습니다.
  rationale: 짧은 단정형은 현존 라틴어의 독립된 문장성을 드러냅니다. 다만 한국어에서는 맥락 연결을 위해 자연스럽게 '끝났습니다'로 처리했습니다.
  doctrine_reference: 문장 구조와 담화 기능
