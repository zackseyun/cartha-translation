  text: But both what preserves and what is preserved will be preserved by your preservation. And when the womb again gives back
translation:
  language: ko
  text: 그것은 끝났습니다. 그런데 보존하는 것과 보존되는 것, 둘 다 당신의 보존으로 보존될 것입니다. 그리고 다시 태가 돌려주면…[a][b]
  philosophy: optimal-equivalence
  footnotes:
