review_pass:
  verdict: revise
  source_fidelity: 초안의 ‘그분께는’은 라틴어 2인칭 복수 여격 vobis(‘여러분에게/너희에게’)와 맞지 않으며, 지시 대상도 원문에 없습니다. 또한 probata est requies의 ‘안식이 마련되어 있고’는 praeparata(‘준비되다’)와의 구별을 지우므로, ‘인정되었고’로 구별하는 편이 안전합니다.
  naturalness: ‘여러분에게는’은 현대 표준어의 정중한 성경 문체에 자연스럽습니다. 완료 수동의 병렬은 ‘열렸고/심겼으며/준비되었고’로 간결하게 유지했습니다.
  terminology: paradisus는 ‘낙원’, arbor vitae는 ‘생명나무’, civitas는 문맥상 ‘도성’, requies는 ‘안식’으로 유지했습니다. bonitas는 추상명사인 ‘선함’으로 옮겼습니다.
  issues:
  - severity: high
    issue: vobis의 대상이 ‘그분’으로 오역됨
    rationale: vobis는 2인칭 복수 여격으로 ‘여러분에게’라는 수혜자를 뜻합니다. 원문에는 ‘그분’에 해당하는 말이 없습니다.
  - severity: medium
    issue: probata est requies가 ‘안식이 마련되어 있고’로 번역됨
    rationale: ‘마련되다’는 앞선 praeparata est(‘준비되다’)에 더 가까워 probata est의 어휘적 구별을 상실합니다. 여기서는 ‘인정되다’가 영어 POB의 ‘approved’ 및 라틴어 수동 완료를 더 직접적으로 반영합니다.
  revised_text: 여러분에게는 낙원이 열렸고, 생명나무가 심겼으며, 다가올 시대가 준비되었고, 풍성함이 예비되었으며, 도성이 세워졌고, 안식이 인정되었으며, 선함이 완성되었습니다.
