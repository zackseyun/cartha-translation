id: 2ES.8.52
reference: 2 Esdras 8:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: gloriam. Vobis enim apertus est paradisus, plantata est arbor uitae, paratum est futurum tempus, praeparata est habundantia, aedificata est ciuitas, probata est requies, perfecta est bonitas,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/052.yaml
  text: For paradise has been opened to you[a], the tree of life has been planted, the age to come has been prepared, abundance has been made ready, the city has been built, rest has been approved, goodness has been perfected,
  footnotes:
  - marker: a
    text: Or 'But understand for yourself, and seek out glory for those like yourself.'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분에게는 낙원이 열렸고, 생명나무가 심겼으며, 다가올 시대가 준비되었고, 풍성함이 예비되었으며, 도성이 세워졌고, 안식이 인정되었으며, 선함이 완성되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: apertus est paradisus
  english_pob_choice: paradise has been opened to you
  chosen_korean: 낙원이 열려 있으며
  alternatives_korean:
  - 낙원이 여러분에게 열려 있으며
  - 낙원이 열려 있습니다
  lexicon: paradisus → 낙원
  rationale: 라틴어 수동형 완료는 열린 상태의 지속을 나타내므로 ‘열려 있으며’로 옮겨 현재적 효력을 살렸고, 대상의 2인칭 복수는 문맥상 ‘그분께는’으로 자연스럽게 처리했습니다.
- source_word: arbor uitae
  english_pob_choice: the tree of life has been planted
  chosen_korean: 생명나무가 심겨 있고
  alternatives_korean:
  - 생명나무가 심겨 있으며
  - 생명나무가 세워져 있고
  lexicon: arbor vitae → 생명나무
  rationale: 직역하면 ‘생명나무’이며, planting의 이미지를 유지하기 위해 ‘심겨 있고’로 옮겼습니다.
- source_word: futurum tempus
  english_pob_choice: the age to come has been prepared
  chosen_korean: 다가올 시대가 준비되어 있으며
  alternatives_korean:
  - 올 시대가 준비되어 있으며
  - 장차 올 때가 준비되어 있으며
  lexicon: futurum tempus → 다가올 시대
  rationale: tempus는 단순한 ‘시간’보다 구원사적 ‘시대’로 읽는 것이 문맥에 더 적합하므로, 영어 POB의 ‘age to come’을 따라 ‘다가올 시대’로 옮겼습니다.
- source_word: praeparata est habundantia / aedificata est ciuitas / probata est requies / perfecta est bonitas
  english_pob_choice: abundance has been made ready / the city has been built / rest has been approved / goodness has been perfected
  chosen_korean: 풍성함이 예비되어 있고, 도성이 세워져 있으며, 안식이 마련되어 있고, 선함이 완전하게 이루어져 있습니다
  alternatives_korean:
  - 풍성함이 준비되어 있고, 도성이 세워져 있으며, 안식이 인정되어 있고, 선함이 완성되어 있습니다
  - 풍요가 마련되어 있고, 도시가 세워져 있으며, 쉼이 승인되어 있고, 선함이 완전해졌습니다
  lexicon: habundantia / ciuitas / requies / bonitas
  rationale: habundantia는 단순한 양적 ‘풍요’보다 충만한 ‘풍성함’이 적절하고, ciuitas는 종말론적 공동체의 성격을 살려 ‘도성’으로, requies의 probata는 ‘승인’보다 상태의 확정·배정을 드러내는 ‘마련되어’로 처리해 의미의 긴장을 줄였습니다.
theological_decisions:
- issue: 연속된 수동 완료문의 종말론적 확정성
  chosen_reading: 모든 항목을 완료·수동 표현으로 옮겨 이미 준비되고 세워진 종말의 실재를 강조했습니다.
  alternative_readings:
  - 현재형으로 완화하여 ‘열려 있습니다’ 등으로 통일
  - 미래형으로 옮겨 아직 오지 않은 상태를 강조
  rationale: 원문은 각 항목을 완료 수동으로 나열하여 이미 마련된 구원의 현실을 선포하므로, 한국어에서도 그 확정성을 유지하는 것이 적절합니다.
  doctrine_reference: 종말론적 이미-아직 긴장
- issue: ciuitas의 번역
  chosen_reading: ‘도성’으로 번역해 단순한 도시가 아니라 하나님이 예비하신 종말론적 성읍을 드러냈습니다.
  alternative_readings:
  - 도시
  - 성읍
  rationale: 문맥상 낙원, 생명나무, 다가올 시대와 병렬되는 종말론적 이미지이므로, 일반 ‘도시’보다 신학적 함의를 지닌 ‘도성’이 더 적합합니다.
  doctrine_reference: 새 예루살렘/종말론적 공동체
