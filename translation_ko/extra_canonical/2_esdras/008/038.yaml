id: 2ES.8.38
reference: 2 Esdras 8:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super plasma eorum qui peccauerunt aut mortem aut iudicium aut perditionem ; Sed iocundabor super iustorum figmentum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/038.yaml
  text: For truly I will not think upon the formation of those who have sinned[a], nor upon their death, nor their judgment, nor their destruction; but I will rejoice over the creation of the righteous,
  footnotes:
  - marker: a
    text: Or 'nor upon death, nor judgment, nor destruction'.
    reason: previous_rendering
translation:
  language: ko
  text: 실로 나는 죄를 지은 자들을 지으신 일[a]이나 그들의 죽음이나 심판이나 멸망을 염두에 두지 않겠습니다. 그러나 의인들을 지으신 일을 기뻐하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘죄를 지은 자들의 빚어짐’입니다.
    reason: plasma의 ‘빚어짐·형성’이라는 어휘적 뉘앙스를 보존합니다.
lexical_decisions:
- source_word: plasma
  english_pob_choice: formation
  chosen_korean: 형상
  alternatives_korean:
  - 형성
  - 지음
  - 빚음
  lexicon: plasma
  rationale: 라틴어 plasma는 ‘빚어 만든 것/형상’의 뜻을 가지며, 여기서는 죄인들의 존재를 하나님이 빚으신 창조적 행위의 관점에서 말하므로 ‘형상’이 자연스럽고도 원문에 가깝습니다.
- source_word: eorum qui peccauerunt
  english_pob_choice: those who have sinned
  chosen_korean: 죄를 지은 자들
  alternatives_korean:
  - 죄인들
  - 죄를 범한 자들
  lexicon: peccauerunt
  rationale: 동사의 결과를 드러내면서도 대상이 사람임을 분명히 하기 위해 ‘죄를 지은 자들’로 옮겼습니다.
- source_word: mortem / iudicium / perditionem
  english_pob_choice: their death / their judgment / their destruction
  chosen_korean: 그들의 죽음, 그들의 심판, 그들의 멸망
  alternatives_korean:
  - 그들의 사망, 그들의 심판, 그들의 파멸
  - 죽음, 심판, 멸망
  lexicon: mors / iudicium / perditio
  rationale: 수정된 영어 감사문처럼 세 명사 모두 앞의 ‘그들의’가 공유되므로, 심판을 일반론으로 만들지 않고 죄인들에게 귀속된 종말을 분명히 했습니다.
- source_word: iustorum figmentum
  english_pob_choice: the creation of the righteous
  chosen_korean: 의인들의 창조
  alternatives_korean:
  - 의인들의 지음
  - 의인들의 빚음
  lexicon: figmentum
  rationale: figmentum은 여기서 단순한 물건이 아니라 하나님의 창조적 행위를 가리키므로, 문맥상 가장 자연스러운 ‘창조’를 선택했습니다.
theological_decisions:
- issue: 하나님이 죄인의 죽음·심판·멸망을 ‘생각하지 않겠다’는 표현의 범위
  chosen_reading: 죄인들 전체에 대한 보편적 무관심이 아니라, 죄 지은 자들의 죽음과 심판과 멸망을 염두에 두지 않겠다는 뜻으로 읽었습니다.
  alternative_readings:
  - 하나님이 죽음이나 심판 자체를 전혀 생각하지 않으신다는 보편적 진술
  - 단순히 기억하지 않겠다는 심리적 표현
  rationale: 라틴어의 병렬 구조와 감사본의 수정 지시가 대상의 범위를 죄 지은 자들에게 한정합니다. 이는 4에스드라의 심판 주제를 훼손하지 않습니다.
  doctrine_reference: 4 Ezra의 심판 신학
