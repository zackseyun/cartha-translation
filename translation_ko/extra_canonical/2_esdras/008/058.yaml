id: 2ES.8.58
reference: 2 Esdras 8:58
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iustos eius conculcauerunt. Et dixerunt in corde suo non esse deum, et quidem scientes sciunt quoniam moriuntur. Sicut
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/058.yaml
  text: they trampled his righteous ones. And they said in their hearts that there is no God[a], though they indeed know that they will die. Just as
  footnotes:
  - marker: a
    text: Or 'For they too, though they received freedom, despised the Most High and scorned his law and abandoned his ways.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 의인들을 짓밟았습니다. 그리고 그들은 마음속으로 “하나님은 없다”라고 말했습니다. 그러나 그들은 자신들이 죽게 된다는 것을 분명히 알고 있습니다. 마치…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마치…’는 라틴어 Sicut가 다음 절로 이어지는 연결어로 끝난다는 점을 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: iustos eius
  english_pob_choice: his righteous ones
  chosen_korean: 그의 의인들
  alternatives_korean:
  - 그의 의로운 자들
  - 그의 의인된 자들
  lexicon: iusti = 의인
  rationale: 라틴어 iustos는 하나님의 편에 선 ‘의인들’을 가리키므로, 한국어에서도 신앙적·법정적 뉘앙스를 살려 ‘의인들’로 옮겼습니다.
- source_word: conculcauerunt
  english_pob_choice: they trampled
  chosen_korean: 짓밟았습니다
  alternatives_korean:
  - 발로 짓밟았습니다
  - 밟아 짓눌렀습니다
  lexicon: conculcare = 짓밟다
  rationale: 물리적 폭력과 멸시를 함께 드러내는 동사이므로, 자연스러운 현대 한국어의 강한 표현인 ‘짓밟았습니다’를 택했습니다.
- source_word: in corde suo non esse deum
  english_pob_choice: there is no God
  chosen_korean: “하나님은 없다”라고
  alternatives_korean:
  - “하나님이 계시지 않다”라고
  - “신은 없다”라고
  lexicon: cor/Deus
  rationale: 직접 화법으로 옮겨 내부 독백의 냉혹함을 살렸고, 정체성상 일반적인 ‘신’보다 성경적 대상인 ‘하나님’을 유지했습니다.
- source_word: scientes sciunt
  english_pob_choice: they indeed know
  chosen_korean: 반드시 죽게 된다는 것을 정말로 알고 있습니다
  alternatives_korean:
  - 반드시 죽는다는 것을 분명히 압니다
  - 죽을 수밖에 없다는 것을 잘 압니다
  lexicon: scientes sciunt = emphatic knowing
  rationale: 겹말 구조가 주는 강조를 한국어의 ‘반드시… 정말로 알고 있습니다’로 재현해, 단순한 인지가 아니라 확실한 자각을 드러냈습니다.
theological_decisions:
- issue: 하나님의 존재 부정과 인간의 죽음 인식의 병치
  chosen_reading: 악인은 마음으로 하나님을 부정하면서도, 죽음의 필연성은 알고 있다는 대조를 그대로 유지했습니다.
  alternative_readings:
  - 죽음을 두려워한다는 심리적 해석을 덧붙이는 읽기
  - ‘하나님이 없다’의 철학적 주장으로 약화하는 읽기
  rationale: 본문의 초점은 무신론 논변이 아니라 도덕적 반역과 자기기만의 대조이므로, 라틴어의 단언과 인식의 충돌을 보존했습니다.
  doctrine_reference: 시편 14:1의 전통적 무신론-도덕적 타락 병치
- issue: 마지막의 불완전한 연결사 Sicut
  chosen_reading: 본문이 다음 절로 이어지는 미완결 구조를 반영해 끝을 ‘마치…’로 열어 두었습니다.
  alternative_readings:
  - 완결된 한국어 문장으로 매끈하게 종결하는 읽기
  - 다음 절을 추정해 보충하는 읽기
  rationale: 라틴어 원문이 다음 절로 이어지는 연결어로 끝나므로, 한국어도 문장 종결을 인위적으로 닫지 않고 단절감을 유지했습니다.
  doctrine_reference: 본문 경계 보존 원칙
