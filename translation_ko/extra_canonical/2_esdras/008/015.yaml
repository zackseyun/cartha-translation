id: 2ES.8.15
reference: 2 Esdras 8:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'est tuo iussu, facili ordine, et utquid fiebat? Et nunc dicens dicam: de omni homine tu magis scis, de populo autem tuo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/015.yaml
  text: 'It is by your command[a], in an easy order, and why was it done? And now I will speak: concerning every man you know better, but concerning your people'
  footnotes:
  - marker: a
    text: 'Or ''And now I will speak: concerning every man you know better, but concerning your people my pain is greater,''.'
    reason: previous_rendering
translation:
  language: ko
  text: 그것은 주님의 명령에 따른 것이며, 쉬운 순서로 된 것이니, 왜 그렇게 되었습니까? 그리고 이제 저는 말하겠습니다. 모든 사람에 관해서는 당신께서 더 잘 아시지만, 당신의 백성에 관해서는[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 본문은 뒤 문맥과 연결되는 열거의 일부로 끝나며, 영어 POB의 이전 판본은 이 대목을 ‘당신의 백성에 관해서는, 내 고통이 더 큽니다’로 풀어 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: est tuo iussu
  english_pob_choice: It is by your command
  chosen_korean: 주님의 명령에 따른 것이며
  alternatives_korean:
  - 당신의 명령에 의한 것입니다
  - 당신의 명령으로 된 것입니다
  lexicon: iussus → 명령
  rationale: 원문의 원인·근거를 드러내는 표현이므로 단순한 소유격보다 ‘명령에 따른’으로 옮겨, 행위의 출처를 분명히 했습니다.
- source_word: facili ordine
  english_pob_choice: in an easy order
  chosen_korean: 쉬운 순서로 된 것이니
  alternatives_korean:
  - 쉬운 질서로
  - 간단한 순서로
  lexicon: ordo → 순서/질서
  rationale: 라틴어 ordō의 ‘배열/순서’ 감각을 살리되, 한국어에서는 자연스럽게 ‘쉬운 순서’로 처리했습니다.
- source_word: dicens dicam
  english_pob_choice: I will speak
  chosen_korean: 저는 말하겠습니다
  alternatives_korean:
  - 제가 분명히 말하겠습니다
  - 제가 말할 것입니다
  lexicon: dicere → 말하다
  rationale: 강조를 담는 반복 구조이지만, 본문 자체가 과장된 결단보다 발화 전환을 보여 주므로 자연스러운 미래형으로 옮겼습니다.
- source_word: de omni homine tu magis scis, de populo autem tuo
  english_pob_choice: concerning every man you know better, but concerning your people
  chosen_korean: 모든 사람에 관해서는 당신께서 더 잘 아시지만, 당신의 백성에 관해서는
  alternatives_korean:
  - 모든 사람에 대해서는 당신이 더 잘 아시지만, 당신의 백성에 대해서는
  - 모든 사람은 당신께서 더 잘 아시되, 당신의 백성은
  lexicon: de + abl. → ~에 관해서는
  rationale: 대조 구조를 보존하기 위해 ‘~에 관해서는’ 반복을 살렸고, ‘tu magis scis’는 비교 의미를 직접적으로 드러내는 ‘더 잘 아시지만’으로 옮겼습니다.
theological_decisions:
- issue: 끝맺음이 미완성인 채 이어지는 수사적 발화
  chosen_reading: 본문을 문장 끝의 여운을 살려 끝내고, 뒤 문맥으로 이어질 수 있는 미완성 호흡을 한국어에서도 유지했습니다.
  alternative_readings:
  - ‘당신의 백성에 관해서는, 제가 더 말하겠습니다’처럼 보충하여 매끄럽게 만들기
  - 문장을 완결형으로 재구성하기
  rationale: 제공된 라틴 본문 자체가 수사적 열거의 한 부분으로 보이며, 의미를 덧붙여 완결시키면 다음 절의 전개를 침범할 수 있습니다.
  doctrine_reference: source-critical fidelity
- issue: 주님의 명령
  chosen_reading: ‘주님’은 이 외경 본문에서 신적 호칭으로 읽히는 대상에 대한 한국어 경어 표현으로 처리했습니다.
  alternative_readings:
  - ‘당신’으로 일관하기
  - ‘하나님’으로 명시하기
  rationale: 본문의 2인칭 신적 호칭을 한국어 합쇼체와 맞물리게 하면서도, 원문이 지시하는 존칭 관계를 유지했습니다.
  doctrine_reference: register and reverence
