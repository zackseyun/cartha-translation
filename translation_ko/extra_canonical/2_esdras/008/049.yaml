  naturalness: ‘의인들 가운데서 자신을 판단하지 않으셨으니’는 이해 가능하지만, 하나님께 직접 말하는 문맥에서는 ‘의인들 가운데 자신을 의인으로 여기지 않으셨으므로’가 더 자연스럽고 문맥상 ‘iudicare se inter iustos’의 자기 평가라는 뜻을 명료하게 드러냅니다.
  terminology: ‘의인들’과 ‘영광을 받다’는 적절합니다. 다만 출전 본문에는 ‘주님’이라는 호칭이 없으므로 보태지 않았고, ut plurimum은 목적을 나타내도록 ‘더욱 크게 영광을 받으시도록’으로 옮겼습니다.
