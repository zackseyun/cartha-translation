translation:
  language: ko
  text: 당신께서는 의인들 가운데 자신을 의인으로 여기지 않으셨으므로, 더욱 크게 영광을 받으시도록 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 (이전 절과 혼동하여 옮긴 번역): “당신께서 마땅히 하실 대로 자신을 낮추셨기 때문에.” 이 표현은 이 구절에 제시된 라틴어 본문이 아니라 앞 절 끝부분의 본문에 해당합니다.'
    reason: 영어 POB 감사 이력에 남아 있는 이전 번역을 보존하되, 현 라틴어 본문의 대안 독법으로 오해되지 않게 했습니다.
lexical_decisions:
- source_word: te
  english_pob_choice: you
  chosen_korean: 당신은
  alternatives_korean:
  - 주님께서는
  - 주님은
  lexicon: 개인 대명사
  rationale: 라틴어 te는 직접 2인칭 대명사이므로, 본문은 하나님께 직접 말하는 형식으로 옮겼습니다.
- source_word: non iudicasti te inter iustos
  english_pob_choice: have not judged yourself among the righteous
  chosen_korean: 의인들 가운데서 자신을 판단하지 않으셨으니
  alternatives_korean:
  - 의인들 가운데서 자신을 헤아리지 않으셨으니
  - 의인들 가운데서 자신을 판정하지 않으셨으니
  lexicon: iudicasti, inter iustos
  rationale: iudicasti는 ‘판단하다/판정하다’의 의미를 살려 ‘판단하지 않으셨다’로 옮기고, inter iustos는 공동체적 범주인 ‘의인들 가운데서’로 표현했습니다.
- source_word: ut plurimum glorificeris
  english_pob_choice: so that you might be more greatly glorified
  chosen_korean: 더욱 크게 영광을 받으실 것입니다
  alternatives_korean:
  - 더 크게 영광을 받으실 것입니다
  - 가장 크게 영광을 받으실 것입니다
  lexicon: ut + plurimum + glorificeris
  rationale: ut는 목적/결과를 나타내며, plurimum은 단순한 ‘크게’보다 정도를 더하는 표현이어서 ‘더욱 크게’로 반영했습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭과 존대 표현
  chosen_reading: 직접 خطاب은 ‘당신은’으로 시작하되, 종결은 하나님께 드리는 존대형 ‘받으실 것입니다’로 처리했습니다.
  alternative_readings:
  - 주님께서는 … 받으실 것입니다
  - 주님은 … 영광을 받게 되실 것입니다
  rationale: 본문이 2인칭 직접 خطاب이므로 이를 살리면서도, 기도/찬양 문맥의 경외를 유지하기 위해 존대형을 사용했습니다.
  doctrine_reference: liturgical register / reverence in direct address
