id: 2ES.8.5
reference: 2 Esdras 8:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Conuenisti enim obaudire et profecta es nolens, non enim tibi est datum spatium nisi solum modicum uiuere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/005.yaml
  text: For you have consented to obey and have advanced unwillingly[a], for no span has been given to you except only a little while to live.
  footnotes:
  - marker: a
    text: Or 'you have advanced'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 순종하기로 동의했고, 원하지 않으면서도 떠나셨습니다[a]. 이는 당신에게 살 수 있는 기간이 오직 잠깐만 주어졌기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘떠나셨습니다’
    reason: alternative_reading
lexical_decisions:
- source_word: obaudire
  english_pob_choice: consented to obey
  chosen_korean: 순종하기로 동의했고
  alternatives_korean:
  - 듣기로 동의했고
  - 복종하기로 동의했고
  - 말을 듣기로 동의했고
  lexicon: obaudire
  rationale: 라틴어 obaudire는 단순히 ‘듣다’보다 ‘순종하다/복종하다’의 뜻이 강하므로, POB의 수정 방향인 ‘consented to obey’를 반영해 ‘순종하기로 동의했고’로 옮겼습니다.
- source_word: profecta es
  english_pob_choice: advanced / set out
  chosen_korean: 원하지 않으면서도 떠나셨습니다
  alternatives_korean:
  - 원하지 않으면서도 출발하셨습니다
  - 원하지 않으면서도 길을 나서셨습니다
  - 원하지 않으면서도 나아가셨습니다
  lexicon: proficiscor
  rationale: profecta es는 ‘전진하다’보다 ‘떠나다, 길을 나서다’가 기본 뜻이므로, 최근 수정 취지를 살리되 한국어에서는 비유적 이동감을 자연스럽게 드러내는 ‘떠나셨습니다’를 선택했습니다.
- source_word: spatium ... nisi solum modicum vivere
  english_pob_choice: no span ... except only a little while to live
  chosen_korean: 살 수 있는 기간이 오직 잠깐만 주어졌기 때문입니다
  alternatives_korean:
  - 살아갈 시간은 오직 조금만 주어졌기 때문입니다
  - 살 수 있는 때가 오직 얼마 남지 않았기 때문입니다
  - 생존의 기간이 오직 조금만 주어졌기 때문입니다
  lexicon: spatium / modicum vivere
  rationale: spatium을 단순 ‘공간’이 아니라 ‘기간/시간’으로, modicum uiuere를 ‘잠깐만 살다’의 시간 제한으로 풀어 한국어에서 자연스럽고 문맥에 맞게 전달했습니다.
theological_decisions:
- issue: 인생의 짧은 기간을 표현하는 방식
  chosen_reading: ‘살 수 있는 기간이 오직 잠깐만 주어졌기 때문입니다’로, 주어진 삶의 한정성과 피조물의 유한성을 분명하게 드러냈습니다.
  alternative_readings:
  - ‘조금만 살 수 있도록 주어졌기 때문입니다’
  - ‘살아갈 시간이 아주 잠깐 주어졌기 때문입니다’
  rationale: 본문은 단순한 시간 정보가 아니라 ‘주어진 삶의 한정’이라는 신학적 긴장을 담고 있으므로, 한국어에서도 그 제한성을 분명히 보존했습니다.
  doctrine_reference: 인간의 유한성 / 주어진 생명의 제한성
