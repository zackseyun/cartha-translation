revisions:
- from: 오 우리 위의 주님이시여[a], 주의 종이 주님 앞에서 기도하게 하시고, 우리에게 마음을 위한 씨앗과 이해를 위한 가꾸심을 주셔서, 그로부터 열매가 맺히고, 그리하여 모든 썩어질 자가 살아날 수 있게 하소서[b].
  to: 오 우리를 다스리시는 주님이시여[a], 주의 종이 우리가 주님 앞에서 기도드리고 주께서 우리에게 마음에 심을 씨앗과 이해력을 기르는 경작을 주시도록 허락하신다면, 그로부터 열매가 맺히고 그것으로 말미암아 모든 썩어질 자가 살 수 있게 하소서[b].
  rationale: 단수 ‘주의 종’과 복수 ‘우리가/우리에게’의 전환을 보존하고, unde의 연속된 인과 관계를 명료하게 했습니다. ‘이해력을 기르는 경작’은 cultura의 농경 비유를 유지하려는 다소 낯선 표현이지만, 원문의 의도적 비유성을 보존합니다.
