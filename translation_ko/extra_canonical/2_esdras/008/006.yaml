id: 2ES.8.6
reference: 2 Esdras 8:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O domine super nos, si permittes seruo tuo ut oremus coram te et des nobis semen cordis et sensui culturam unde fructum fiat, unde uiuere possit omnis corruptus qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/006.yaml
  text: O Lord over us[a], if you permit your servant to pray before you, and give us seed for the heart and cultivation for the understanding, from which fruit may come, by which every corruptible one may live[b],
  footnotes:
  - marker: a
    text: Or 'to pray before you, and give us'.
    reason: previous_rendering
  - marker: b
    text: Or 'every corrupted one'.
    reason: previous_rendering
translation:
  language: ko
  text: 오 우리 위의 주님이시여[a], 주의 종이 주님 앞에서 기도하게 하시고, 우리에게 마음을 위한 씨앗과 이해를 위한 가꾸심을 주셔서, 그로부터 열매가 맺히고, 그리하여 모든 썩어질 자가 살아날 수 있게 하소서[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리를 다스리시는 주님’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘모든 부패한 자’.
    reason: alternative_reading
lexical_decisions:
- source_word: O domine super nos
  english_pob_choice: O Lord over us
  chosen_korean: 오 우리 위의 주님이시여
  alternatives_korean:
  - 오 우리 위에 계신 주님이시여
  - 오 우리를 다스리시는 주님이시여
  lexicon: 주님
  rationale: super nos의 권위·주권 뉘앙스를 살리되, 기도문 호격에 맞게 현대 합쇼체로 옮겼습니다.
- source_word: seruo tuo
  english_pob_choice: your servant
  chosen_korean: 주의 종
  alternatives_korean:
  - 주의 노예
  - 주의 사람
  lexicon: 종
  rationale: servus는 기본적으로 종이므로, 본문이 말하는 겸손한 예속을 직접 드러내기 위해 종으로 옮겼습니다.
- source_word: semen cordis et sensui culturam
  english_pob_choice: seed for the heart and cultivation for the understanding
  chosen_korean: 마음을 위한 씨앗과 이해를 위한 가꾸심
  alternatives_korean:
  - 마음의 씨앗과 이해의 가꾸심
  - 마음에 심길 씨앗과 이해를 위한 경작
  lexicon: 씨앗 / 가꾸심
  rationale: semen과 cultura의 농경 이미지를 유지하되, 한국어에서 자연스럽고 문맥에 맞게 각각 씨앗과 가꾸심으로 옮겼습니다.
- source_word: omnis corruptus
  english_pob_choice: every corruptible one
  chosen_korean: 모든 썩어질 자
  alternatives_korean:
  - 모든 썩을 수밖에 없는 자
  - 모든 부패한 자
  lexicon: 썩어질
  rationale: corruptus를 도덕적 타락보다 죽을 수밖에 없는 가변성·소멸성의 범주로 이해하여, ‘썩어질’로 옮겼습니다.
theological_decisions:
- issue: 1인칭 단수와 복수의 전환
  chosen_reading: ‘주의 종’은 단수로, ‘우리에게’와 뒤의 청원은 공동체적 복수로 옮겼습니다.
  alternative_readings:
  - 전체를 일관되게 단수로 평탄화하기
  - 전체를 대표적 1인칭 복수로 처리하기
  rationale: 라틴어의 servo tuo에서 oremus로 이어지는 전환을 보존해야 하므로, 단수 청원자에서 공동체적 기도로 확장되는 흐름을 드러냈습니다.
  doctrine_reference: 본문의 기도 주체와 공동체성
