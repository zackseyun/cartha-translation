  text: but to those who have kept your covenants with sorrows. Do not think on those who have conducted themselves falsely before you,
translation:
  language: ko
  text: 그러나 고난 가운데서도 당신의 언약들을 지킨 이들에게는, 당신 앞에서 거짓되게 행동한 자들을 생각하지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 여기서 끊기며, 뒤 절의 일부가 유실된 단편입니다.
    reason: textual_variant
lexical_decisions:
- source_word: testamenta
  english_pob_choice: your covenants
  chosen_korean: 당신의 언약들
  alternatives_korean:
  - 당신의 계약들
  - 당신의 약속들
  lexicon: testamentum
  rationale: 라틴어 testamenta를 POB의 영어가 ‘covenants’로 읽었으므로, 성경적 언약 개념을 살려 ‘언약들’로 옮겼습니다.
- source_word: cum doloribus
  english_pob_choice: with sorrows
  chosen_korean: 고난 가운데서도
  alternatives_korean:
  - 슬픔과 함께
  - 고통과 함께
  lexicon: cum + dolor
  rationale: cum doloribus의 수반 관계를 자연스럽게 풀어, 맥락상 인내의 상황을 드러내는 ‘고난 가운데서도’로 옮겼습니다.
- source_word: custodierunt
  english_pob_choice: have kept
  chosen_korean: 지킨
  alternatives_korean:
  - 지켜 온
  - 지켜 왔던
  lexicon: custodire
  rationale: 행위의 완료성과 지속성을 과도하게 풀지 않고, 언약 준수를 직접적으로 나타내는 ‘지킨’을 선택했습니다.
- source_word: Neque cogites qui in
  english_pob_choice: Do not think on those who have conducted themselves falsely before you
  chosen_korean: 당신 앞에서 거짓되게 행동한 자들을 생각하지 마십시오
  alternatives_korean:
  - 당신 앞에서 거짓을 행한 자들을 생각하지 마십시오
  - 당신 앞에서 불성실하게 처신한 자들을 생각하지 마십시오
  lexicon: cogitare + qui in
  rationale: 남아 있는 라틴어 단편이 문장을 완결하지 않지만, POB의 영어가 드러내는 의미를 따라 ‘거짓되게 행동하다’로 간명하게 옮겼습니다.
theological_decisions:
- issue: 불완전한 라틴어 단편의 처리
  chosen_reading: 현존 본문이 절의 중간에서 끊기므로, 한국어 본문도 끊긴 단편의 어조를 유지하되 POB 영어가 확보한 의미 범위 안에서 자연스럽게 마무리했습니다.
  alternative_readings:
  - 문장 미완결을 더 노골적으로 드러내기 위해 불완전한 종결을 유지하는 방식
  - 남은 부분을 추정해 더 길게 보충하는 방식
  rationale: 이 구절은 전승된 라틴어가 단편이므로, 과잉 복원은 피하고 검증 가능한 의미만 옮기는 것이 가장 충실합니다.
  doctrine_reference: textual fidelity / fragmentary witness
