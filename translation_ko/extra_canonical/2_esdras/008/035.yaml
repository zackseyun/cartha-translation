id: 2ES.8.35
reference: 2 Esdras 8:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in veritate enim nemo de genitis est qui non impie gessit, et de confitentibus qui non deliquit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/035.yaml
  text: For truly there is no one among those born who has not acted impiously[a], and among those who confess, no one who has not sinned.
  footnotes:
  - marker: a
    text: Or 'among those who confess you'.
    reason: previous_rendering
translation:
  language: ko
  text: 실로 태어난 자들 가운데는 불경하게 행하지 않은 이가 없고, 존재하는 자들 가운데는 죄를 짓지 않은 이가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 전승에는 confitentibus가 있으나, 감수 내역에 따라 ‘존재하는 자들’의 교정 독법을 반영했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: in veritate enim
  english_pob_choice: For truly
  chosen_korean: 실로
  alternatives_korean:
  - 참으로
  - 진실로
  - 정녕
  lexicon: in veritate
  rationale: 서두의 강조를 자연스러운 현대 한국어로 옮기기 위해 ‘실로’를 사용했습니다. POB의 ‘truly’와 같은 강조 기능을 유지하면서도 문어체 합쇼체에 잘 맞습니다.
- source_word: de genitis
  english_pob_choice: among those born
  chosen_korean: 태어난 자들 가운데는
  alternatives_korean:
  - 태어난 이들 가운데는
  - 태생한 자들 가운데는
  - 난 자들 가운데는
  lexicon: genitis
  rationale: geniti는 ‘태어난/출생한 이들’이라는 문자적 의미를 가지므로, 인격적 집합을 드러내는 ‘자들 가운데는’으로 풀었습니다.
- source_word: impie gessit
  english_pob_choice: acted impiously
  chosen_korean: 불경하게 행하지 않은
  alternatives_korean:
  - 불경스럽게 행하지 않은
  - 경건하지 않게 행하지 않은
  - 불경한 일을 하지 않은
  lexicon: impie gessit
  rationale: impie는 단순한 도덕적 악보다 하나님에 대한 불경을 가리키므로, ‘불경하게’로 옮겨 종교적 뉘앙스를 살렸습니다.
- source_word: de confitentibus
  english_pob_choice: among those who confess
  chosen_korean: 존재하는 자들 가운데는
  alternatives_korean:
  - 고백하는 자들 가운데는
  - 시인하는 자들 가운데는
  lexicon: confitentibus
  rationale: 본문 라틴어는 전승상 흔들리는 구절로, 제공된 감수 내역에 따라 ‘those who exist’의 교정된 평행 구조를 반영했습니다. 따라서 한국어도 교정 독법을 따라 ‘존재하는 자들’로 옮겼습니다.
- source_word: deliquit
  english_pob_choice: sinned
  chosen_korean: 죄를 짓지 않은
  alternatives_korean:
  - 잘못을 저지르지 않은
  - 허물을 범하지 않은
  lexicon: deliquit
  rationale: deliquit는 일반적 ‘죄를 짓다/범하다’에 해당하므로, 문맥상 앞의 ‘불경하게 행하다’와 평행을 이루는 간결한 표현을 택했습니다.
theological_decisions:
- issue: 보편적 인간 타락의 진술을 어떻게 한국어로 보존할지
  chosen_reading: ‘태어난 자들’과 ‘존재하는 자들’ 모두에 대해 예외가 없다는 평행 구조를 그대로 살렸습니다.
  alternative_readings:
  - ‘모든 사람’으로 평탄화하기
  - ‘모든 피조물’로 확장하기
  rationale: 이 구절은 출생한 인간과 존재하는 자 전체를 대비하며 보편적 죄성을 진술합니다. 범위를 확장하거나 평탄화하면 원문의 이중 평행이 약해지므로, 구조를 그대로 보존했습니다.
  doctrine_reference: 보편적 죄성
