  source_fidelity: 라틴어의 핵심 이미지와 병렬 구조는 대체로 충실합니다. 다만 직접 호격으로 부르는 문맥에서 ‘그분의’라는 3인칭 지시를 반복한 것은 원문의 2인칭 기도 خطاب과 맞지 않으며, aspectus를 ‘나타나심’으로 옮긴 것은 ‘모습/외양’보다 현현 사건의 뜻을 다소 강하게 부여합니다.
  naturalness: ‘두려운 이시여’는 현대 한국어에서 ‘두려움을 느끼는 이’로도 읽힐 여지가 있습니다. 기도체에서는 ‘두려우신 분이시여’가 경외의 뜻과 호격을 더 자연스럽고 분명하게 드러냅니다. 호격 뒤에는 ‘주님의’로 일관시키는 편이 자연스럽습니다.
  terminology: terribilis는 ‘두려우신’으로, aspectus는 문맥상 과도한 신학적 해석 없이 ‘모습’으로 옮깁니다. abyssos의 우주적·시적 복수는 ‘심연들’로 보존하고, indignatio는 성서적 기도 문맥에 알맞게 ‘진노’로 옮깁니다. veritas의 의인화된 주어와 testificatur의 증언 행위는 유지합니다.
