id: 2ES.8.23
reference: 2 Esdras 8:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'terribilis, cuius aspectus arefacit abyssos et indignatio tabescere facit montes et ueritas testificatur : Exaudi, domine, orationem'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/023.yaml
  text: 'terrible, whose appearance dries up the depths, and whose indignation makes the mountains melt, and whose truth bears witness: Hear, O Lord, the prayer'
translation:
  language: ko
  text: 두려우신 분이시여, 주님의 모습은 심연들을 마르게 하고, 주님의 진노는 산들을 녹게 하며, 주님의 진리는 증언합니다. 주님, 기도를 들으소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terribilis
  english_pob_choice: terrible
  chosen_korean: 두려운 이시여
  alternatives_korean:
  - 무서운 이시여
  - 두려우신 이시여
  lexicon: terribilis
  rationale: 문맥상 하나님께 드리는 호칭의 서두이므로 ‘두려운’으로 신적 위엄과 경외감을 살리고, 뒤의 호격을 자연스럽게 연결했습니다.
- source_word: aspectus
  english_pob_choice: appearance
  chosen_korean: 나타나심
  alternatives_korean:
  - 모습
  - 겉모습
  - 출현
  lexicon: aspectus
  rationale: ‘appearance’를 단순 외양보다 신적 현현의 뉘앙스를 살려 ‘나타나심’으로 옮겼습니다.
- source_word: abyssos
  english_pob_choice: depths
  chosen_korean: 깊은 곳들
  alternatives_korean:
  - 심연들
  - 깊음들
  lexicon: abyssos
  rationale: 지질적·우주적 깊이를 현대 한국어에서 과도하게 종교화하지 않도록 ‘깊은 곳들’로 평이하게 살렸습니다.
- source_word: indignatio
  english_pob_choice: indignation
  chosen_korean: 분노
  alternatives_korean:
  - 진노
  - 격분
  lexicon: indignatio
  rationale: 하나님의 감정적 분노를 드러내는 일반어로 ‘분노’를 택했지만, 성서적 어조를 위해 ‘진노’도 가능한 대안으로 남겼습니다.
- source_word: ueritas testificatur
  english_pob_choice: truth bears witness
  chosen_korean: 진리는 증언합니다
  alternatives_korean:
  - 진리가 증언합니다
  - 진실이 증언합니다
  lexicon: ueritas
  rationale: veritas의 인격화된 진술을 유지하기 위해 ‘진리는 증언합니다’로 옮겼고, 능동적 증언 행위를 분명히 했습니다.
- source_word: Exaudi, domine, orationem
  english_pob_choice: Hear, O Lord, the prayer
  chosen_korean: 주님, 기도를 들으소서
  alternatives_korean:
  - 주여, 기도를 들으소서
  - 주님, 이 기도를 들으소서
  lexicon: exaudi
  rationale: 직접 청원형을 살려 한국어 기도체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 두려운/무서운으로 시작하는 신적 호칭의 톤
  chosen_reading: ‘두려운 이시여’로 경외와 위엄을 드러내는 호격을 유지했습니다.
  alternative_readings:
  - 무서운 이시여
  - 두려우신 이시여
  rationale: 본문의 terribilis는 단순 공포가 아니라 하나님의 위엄이 낳는 경외를 포함하므로, 현대어이면서도 신학적으로 약화되지 않는 표현을 택했습니다.
  doctrine_reference: 신적 위엄과 경외의 언어
- issue: veritas를 추상명사로 둘지 증언 주체로 둘지
  chosen_reading: ‘진리는 증언합니다’로 인격화된 진술을 유지했습니다.
  alternative_readings:
  - 진실이 증언합니다
  - 진리가 증언합니다만 ‘증언하다’를 약화
  rationale: 라틴어 구조가 진리를 증언 주체로 제시하므로, 단순한 ‘참됨’으로 환원하지 않고 주체성을 보존했습니다.
  doctrine_reference: 진리의 인격화/증언적 진술
