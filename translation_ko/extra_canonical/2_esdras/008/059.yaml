id: 2ES.8.59
reference: 2 Esdras 8:59
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enim uos susipient quae praedicta sunt, sic eos sitis et cruciatus quae parata sunt. non enim altissimus uoluit hominem disperdi ; Sed ipsi qui creati sunt coinquinauerunt nomen eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/059.yaml
  text: For what has been foretold will receive you[a], but thirst and torments, which have been prepared, will receive them. For the Most High did not will that man should be destroyed; but they themselves, who were created, defiled his name.
  footnotes:
  - marker: a
    text: Or 'Still more, they trampled his righteous ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 미리 예고된 것들이 여러분을 맞이할 것이며, 갈증과 준비된 고통들이 그들을 맞이할 것이기 때문입니다. 지극히 높으신 분은 사람이 멸망하기를 원하지 않으셨습니다. 그러나 창조된 바로 그들이 그분의 이름을 더럽혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: susipient
  english_pob_choice: will receive you
  chosen_korean: 여러분을 맞이할 것이고
  alternatives_korean:
  - 여러분을 받아들일 것이고
  - 여러분을 맞이하겠지만
  lexicon: suscipio
  rationale: 문맥상 ‘맞이하다/받아들이다’의 수용 의미를 살리되, 심판의 대조를 흐리지 않도록 자연스러운 미래형으로 옮겼습니다.
- source_word: cruciatus quae parata sunt
  english_pob_choice: torments, which have been prepared
  chosen_korean: 준비된 형벌들은
  alternatives_korean:
  - 준비된 고통들은
  - 예비된 고문들은
  lexicon: cruciatus
  rationale: cruciatus의 고통·형벌 의미를 살리되, 한국어에서 과도하게 잔혹한 뉘앙스가 생기는 ‘고문’보다 본문 맥락에 맞는 ‘형벌’로 옮겼습니다.
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  lexicon: Altissimus
  rationale: 직역적 호칭을 유지하면서 한국어 독자가 자연스럽게 읽을 수 있도록 인격적 호칭 ‘분’을 사용했습니다.
- source_word: coinquinauerunt nomen eius
  english_pob_choice: defiled his name
  chosen_korean: 그의 이름을 더럽혔습니다
  alternatives_korean:
  - 그의 이름을 오염시켰습니다
  - 그의 이름을 욕되게 했습니다
  lexicon: coinquinare
  rationale: 하나님의 이름을 의도적으로 훼손하는 행위를 그대로 드러내기 위해 관용적이면서도 강한 ‘더럽혔다’를 선택했습니다.
theological_decisions:
- issue: 하나님의 뜻과 인간 파멸의 긴장
  chosen_reading: 지극히 높으신 분은 사람이 멸망하기를 원하지 않으셨습니다
  alternative_readings:
  - 하나님은 사람이 파괴되기를 원하지 않으셨습니다
  - 가장 높으신 분은 사람을 멸하지 않으셨습니다
  rationale: non enim altissimus uoluit hominem disperdi를 단순한 ‘죽음’이 아니라 ‘멸망/파괴’의 거부로 읽어, 창조 의도와 심판의 대비를 살렸습니다.
  doctrine_reference: 창조와 심판의 대비, 인간의 타락에도 불구한 하나님의 선의
