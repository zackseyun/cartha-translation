  naturalness: ‘갈증’이 현대 표준어에서 ‘목마름’보다 자연스럽습니다. ‘예고된 것들이 여러분을 맞이할 것이며’와 ‘그분의 이름’은 현대의 격식 있는 합쇼체에 자연스럽습니다.
  terminology: Altissimus는 ‘지극히 높으신 분’으로 적절합니다. disperdi는 문맥상 ‘멸망하다’, coinquinauerunt nomen eius는 ‘그분의 이름을 더럽혔다’로 옮기는 것이 원문의 표현과 신학적 관용을 모두 잘 보존합니다.
