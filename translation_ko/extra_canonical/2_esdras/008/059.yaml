    rationale: ‘예고된 것들이’로 복수를 드러내는 편이 원문에 더 가깝습니다.
  - severity: low
    issue: ‘형벌들’은 cruciatus의 직접적인 뜻을 다소 좁힙니다.
    rationale: cruciatus는 고통, 괴로움, 고난을 뜻하며, 본문은 형벌이라는 법정적 표현을 명시하지 않습니다.
