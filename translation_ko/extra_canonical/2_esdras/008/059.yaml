revisions:
- from: 그러므로 예언된 것은 여러분을 맞이할 것이고, 목마름과 준비된 형벌들은 그들을 맞이할 것입니다. 지극히 높으신 분은 사람이 멸망하기를 원하지 않으셨습니다. 그러나 창조된 바로 그들이 그의 이름을 더럽혔습니다.[a]
  to: 이는 미리 예고된 것들이 여러분을 맞이할 것이며, 갈증과 준비된 고통들이 그들을 맞이할 것이기 때문입니다. 지극히 높으신 분은 사람이 멸망하기를 원하지 않으셨습니다. 그러나 창조된 바로 그들이 그분의 이름을 더럽혔습니다.
  rationale: enim의 인과 관계를 바로잡고, 예고된 것들의 복수 및 cruciatus의 ‘고통’ 의미를 반영했습니다. 불필요하고 잘못 앵커된 번역 메모 각주는 삭제했습니다. ‘준비된’이 갈증과 고통 모두에 걸리는지, 특히 후자에만 걸리는지는 라틴어 구문상 완전히 명료하지 않으므로 기존 영어 감사본과 같이 연결된 표현을 유지했습니다.
