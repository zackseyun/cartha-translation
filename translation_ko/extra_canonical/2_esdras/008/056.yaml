- from: 그들의 무리를 살펴보려고 합니다. 그들은 자유를 받았으면서도, 지극히 높으신 분과 그의 율법을 멸시했습니다.[a]
  to: 멸망하는 이들의 수많음에 관하여 알아보려고 합니다. 왜냐하면 그들도[a] 자유를 받았으나 지극히 높으신 분과 그의 율법을 멸시했기 때문입니다.
  rationale: 첫 절을 원문의 ‘멸망하는 이들(eorum qui pereunt)의 수많음(multitudine)에 관하여 묻다(inquirendo)’에 맞게 바로잡았습니다. 본문 자체가 앞 문장에 이어지는 형태이므로 영어 POB의 부정사적 표현에 상응하는 ‘알아보려고 합니다’를 유지했습니다. 감사 이력상 보존된 이전 번역 각주는 한국어로 옮기고 표지를 영어 POB와 같은 논리적 위치에 배치했습니다.
