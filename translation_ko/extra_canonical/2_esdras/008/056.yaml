    rationale: 원문은 단순히 ‘그들’이 아니라 ‘멸망하는 이들’을 명시하며, multitudo는 이들의 ‘수많음’을 가리킵니다. 현 번역은 ‘멸망하는’이라는 핵심 의미가 빠져 있습니다.
  - severity: low
    issue: 각주 내용과 위치가 영어 POB 감사 이력과 일치하지 않음
    rationale: 영어 POB의 a 각주는 이전 번역문을 기록한 감사용 각주입니다. 초안의 출처 설명 각주는 본문의 번역 주석으로 적절하지 않고, a 표지는 영어와 같이 ‘그들도’에 붙이는 것이 일관됩니다.
