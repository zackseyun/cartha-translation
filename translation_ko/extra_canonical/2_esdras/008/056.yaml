  text: inquirendo de multitudine eorum qui pereunt. Nam et ipsi accipientes libertatem spreuerunt altissimum et legem eius
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/056.yaml
  text: to inquire about the multitude of those who perish. For they too[a], having received freedom, despised the Most High and his law
  footnotes:
  - marker: a
    text: Or 'Sorrows have passed away, and in the end the treasure of immortality has been shown.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 무리를 살펴보려고 합니다. 그들은 자유를 받았으면서도, 지극히 높으신 분과 그의 율법을 멸시했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 라틴 본문은 8:56의 실제 내용인 ‘그들의 무리… 자유를 받았으면서도…’에 해당합니다.
    reason: source_note
lexical_decisions:
- source_word: inquirendo de multitudine eorum qui pereunt
  english_pob_choice: to inquire about the multitude of those who perish
  chosen_korean: 그들의 무리를 살펴보려고 합니다
  alternatives_korean:
  - 멸망하는 자들의 무리를 알아보려고 합니다
  - 망해 가는 자들의 무리를 조사하려고 합니다
  lexicon: inquirendo; multitūdō
  rationale: inquirendo는 단순 정보 탐색이므로 ‘살펴보다/알아보다’로 옮겼고, multitudine는 ‘무리’로 자연스럽게 표현했습니다.
- source_word: accipientes libertatem
  english_pob_choice: having received freedom
  chosen_korean: 자유를 받았으면서도
  alternatives_korean:
  - 자유를 받은 뒤에도
  - 자유를 받아 놓고도
  lexicon: accipientes; libertas
  rationale: accipientes는 완료된 수혜를 나타내므로 ‘받았으면서도’로 연결해 뒤의 대조를 분명히 했습니다.
- source_word: spreuerunt altissimum
  english_pob_choice: despised the Most High
  chosen_korean: 지극히 높으신 분을 멸시했습니다
  alternatives_korean:
  - 지극히 높으신 분을 업신여겼습니다
  - 가장 높으신 분을 멸시했습니다
  lexicon: spuerunt; altissimus
  rationale: altissimum은 신적 호칭이므로 ‘지극히 높으신 분’으로 옮기고, spreuerunt는 강한 경멸을 드러내는 ‘멸시했습니다’로 처리했습니다.
- source_word: legem eius
  english_pob_choice: his law
  chosen_korean: 그의 율법
  alternatives_korean:
  - 그의 법
  - 그의 계명
  lexicon: lex; lex
  rationale: 이 문맥의 lex는 단순한 일반 법이 아니라 하나님께 속한 규범이므로 프로젝트 기본어인 ‘율법’을 유지했습니다.
theological_decisions:
- issue: altissimum의 신적 호칭 처리
  chosen_reading: ‘지극히 높으신 분’으로 직역해 하나님을 가리키는 호칭성을 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 분’
  - ‘지존자’
  rationale: 라틴 원문의 최상급 호칭을 한국어에서도 예배적 완곡어로 약화하지 않고, 동시에 고유명사화는 피했습니다.
  doctrine_reference: 신적 칭호 번역 원칙
