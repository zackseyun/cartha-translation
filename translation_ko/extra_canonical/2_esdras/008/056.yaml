translation:
  language: ko
  text: 멸망하는 이들의 수많음에 관하여 알아보려고 합니다. 왜냐하면 그들도[a] 자유를 받았으나 지극히 높으신 분과 그의 율법을 멸시했기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '다른 번역: “슬픔은 지나갔고, 마침내 불멸의 보화가 나타났다.”'
