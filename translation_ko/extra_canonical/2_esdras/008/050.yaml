  text: Propter quod miseriae multae miserabiles efficientur qui habitant saeculum in nouissimis, quia in multa superbia ambulaūerunt. Tu autem pro te intellege et de similibus tuis inquire
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/050.yaml
  text: Therefore many grievous miseries will come upon those who inhabit the world in the last times[a], because they have walked in great pride. But understand for yourself, and inquire concerning those like yourself.
  footnotes:
  - marker: a
    text: Or 'and have not judged yourself among the righteous, so that you should be greatly glorified.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 마지막 때에 세상을 사는 자들에게는 많은 큰 재난이 닥칠 것입니다. 이는 그들이 큰 교만 가운데 걸어왔기 때문입니다. 그러나 너는 너 자신을 위해 깨닫고, 너 같은 이들에 대해 살펴보십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상’을 뜻하는 saeculum은 문맥상 종말기의 인간 세계를 가리키는 말입니다.
    reason: source_note
lexical_decisions:
- source_word: miseriae multae miserabiles
  english_pob_choice: many grievous miseries
  chosen_korean: 많은 큰 재난
  alternatives_korean:
  - 많은 고통
  - 많은 비참함
  - 많은 참상
  lexicon: miseriae / miserabiles
  rationale: 반복과 강도를 살리되, 한국어에서 자연스럽고 공적 문체에 맞게 ‘재난’으로 옮겨 비극적·압도적 뉘앙스를 전달했습니다.
- source_word: qui habitant saeculum in nouissimis
  english_pob_choice: those who inhabit the world in the last times
  chosen_korean: 마지막 때에 세상을 사는 자들
  alternatives_korean:
  - 마지막 때에 세상에 사는 사람들
  - 말세에 세상을 거하는 이들
  lexicon: saeculum / in novissimis
  rationale: saeculum을 단순한 ‘세상’으로, in novissimis를 ‘마지막 때에’로 옮겨 시간적 종말성을 분명히 했습니다.
- source_word: ambulauerunt in multa superbia
  english_pob_choice: they have walked in great pride
  chosen_korean: 큰 교만 가운데 걸어왔기 때문입니다
  alternatives_korean:
  - 큰 교만 속에서 행했기 때문입니다
  - 지극한 교만으로 살아왔기 때문입니다
  lexicon: ambulaverunt / superbia
  rationale: ‘걸어왔기 때문입니다’로 삶의 방식 전체를 드러내고, superbia는 도덕적·영적 태도를 보존하기 위해 ‘교만’으로 유지했습니다.
- source_word: Tu autem pro te intellege et de similibus tuis inquire
  english_pob_choice: But understand for yourself, and inquire concerning those like yourself
  chosen_korean: 너는 너 자신을 위해 깨닫고, 너 같은 이들에 대해 살펴보십시오
  alternatives_korean:
  - 너 자신을 분별하고, 너와 같은 이들을 살펴보십시오
  - 네 스스로 이해하고, 네와 같은 이들에 대해 물으십시오
  lexicon: intellege / inquire / similibus tuis
  rationale: 직역을 넘지 않으면서도 명령문의 병렬을 살려, ‘깨닫다/살펴보다’로 이해와 조사라는 두 동작을 구분했습니다.
theological_decisions:
- issue: 종말기 심판 경고의 직접성
  chosen_reading: 이 구절은 마지막 때의 세상과 교만한 삶에 대한 경고를 직접적으로 말하는 것으로 읽었습니다.
  alternative_readings:
  - 일반적 도덕훈계로 약화하여 읽기
  - 종말론적 시기를 상징적으로만 읽기
  rationale: saeculum in novissimis와 뒤따르는 교만의 인과가 분명하므로, 종말기적 심판 경고를 유지하는 것이 원문 의도에 가장 가깝습니다.
  doctrine_reference: 종말론/심판 경고
