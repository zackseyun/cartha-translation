  source_fidelity: 라틴어의 핵심 구조와 인과관계는 대체로 반영되어 있으나, miseriae multae miserabiles는 외적 사건으로 한정될 수 있는 ‘재난’보다 ‘비참한 고난/고통’으로 옮기는 편이 원문의 중첩된 비참함을 더 충실히 보존합니다. pro te intellege는 ‘너 자신을 위해’보다 ‘스스로 깨달으십시오’가 자연스럽습니다.
