  terminology: superbia의 ‘교만’은 적절합니다. saeculum은 여기서 ‘세상’으로 옮길 수 있습니다. 영어 감사 기록의 각주[a]는 현 라틴어 본문이나 현 영어 본문에 해당하지 않는 앞 절의 이문을 담고 있으므로, 이 절의 한국어 본문에 유지하거나 이를 대신하는 해설 각주를 붙일 근거가 없습니다.
