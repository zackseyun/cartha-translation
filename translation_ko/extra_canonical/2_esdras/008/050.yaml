  to: 그러므로 마지막 때에 세상에 사는 사람들에게 수많은 비참한 고난이 닥칠 것입니다. 그들이 큰 교만 가운데 살아왔기 때문입니다. 그러나 당신은 스스로 깨닫고, 당신과 같은 이들을 살펴보십시오.
