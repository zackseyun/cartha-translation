    rationale: ‘재난’은 주로 외부의 재해·사변을 떠올리게 하지만, miseriae는 더 넓은 비참한 고난을 뜻합니다. 반복·강조도 ‘많은 큰’보다 ‘수많은 비참한’이 자연스럽게 드러냅니다.
