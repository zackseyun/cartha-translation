id: 2ES.8.13
reference: 2 Esdras 8:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et mortificabis eum ut tuam creaturam et uiuificabis eum ut
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/013.yaml
  text: And you will put him to death as your creature, and you will give him life as your creature.
translation:
  language: ko
  text: 그를 당신의 피조물로서 죽이실 것이며, 그를 당신의 피조물로서 살리실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 creaturam은 여기서 '피조물'의 의미로 읽는 것이 자연스럽습니다.
    reason: source_note
lexical_decisions:
- source_word: mortificabis eum
  english_pob_choice: you will put him to death
  chosen_korean: 그를 … 죽이실 것이며
  alternatives_korean:
  - 그를 죽게 하실 것이며
  - 그를 죽음에 이르게 하실 것이며
  lexicon: mortificare
  rationale: 라틴어 mortificabis는 단순히 '상하게 하다'보다 '죽이다'의 직접적 의미가 분명하므로, 영어 POB의 'put him to death'를 따라 직설적으로 옮겼습니다.
- source_word: ut tuam creaturam
  english_pob_choice: as your creature
  chosen_korean: 당신의 피조물로서
  alternatives_korean:
  - 당신의 창조물로서
  - 당신의 작품으로서
  lexicon: creatura
  rationale: creatura는 '창조된 존재/피조물'의 의미이므로, 한국어에서도 신학적 무게를 살려 '피조물'을 채택했습니다.
- source_word: vivificabis eum
  english_pob_choice: you will give him life
  chosen_korean: 그를 … 살리실 것입니다
  alternatives_korean:
  - 그에게 생명을 주실 것입니다
  - 그를 다시 살리실 것입니다
  lexicon: vivificare
  rationale: vivificabis는 문자 그대로 '생명을 주다'이지만, 앞의 죽음과 대조되는 살림의 행위를 자연스럽게 드러내기 위해 '살리다'로 옮겼습니다.
theological_decisions:
- issue: 같은 '피조물'을 죽이고 살리는 표현의 신학적 긴장
  chosen_reading: 하나님이 자신의 피조물에 대해 생사권을 가지신다는 진술로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 피조물로서 ... 처리하실 것입니다처럼 완화된 표현
  - 당신의 창조로서로 바꾸어 긴장을 약화하는 표현
  rationale: 원문은 창조주와 피조물의 관계를 강하게 드러내므로, 그 긴장을 완화하지 않고 같은 명사구를 반복해 보존했습니다.
  doctrine_reference: 창조주 주권, 생명과 죽음에 대한 하나님의 주권
- issue: 동일한 반복 구조의 보존
  chosen_reading: ‘당신의 피조물로서’를 두 절에 모두 반복했습니다.
  alternative_readings:
  - 두 번째 절에서만 '그를 살리실 것입니다'로 축약
  - 의미상 변주하여 반복을 줄이는 처리
  rationale: 라틴어의 ut tuam creaturam 반복을 그대로 반영해, 대조와 평행을 분명히 했습니다.
  doctrine_reference: 수사적 평행법 보존
