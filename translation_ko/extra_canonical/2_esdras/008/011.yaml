id: 2ES.8.11
reference: 2 Esdras 8:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mamillis, praeberi lac, fructum mamillarum, Vt nutriatur id quod plasmatum est usque in tempus aliquem, et postea dispones eum tuae misericordiae. Enutristi eum tuae iusticiae et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/011.yaml
  text: from the breasts[a], milk is provided, the fruit of the breasts, so that what has been formed may be nourished for a certain time, and afterward you direct him by your mercy. You nourished him in your righteousness and instructed him in your law and corrected him by your understanding,
  footnotes:
  - marker: a
    text: Or 'you will commit him to your mercy'.
    reason: previous_rendering
translation:
  language: ko
  text: 젖가슴에서 젖, 곧 젖가슴의 열매가 나오게 하셔서 당신께서 지으신 것이 얼마 동안 자라도록 하시고, 그 뒤에는 당신의 긍휼로 그를 인도하실 것입니다.[a] 당신의 의로 그를 기르셨고, 당신의 율법으로 그를 가르치셨으며, 당신의 명철로 그를 바로잡으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그를 당신의 긍휼에 맡기실 것입니다’.
    reason: 영어 POB 감사 이력에 보존된 dispones eum tuae misericordiae의 대안 번역을 해당 본문 위치에 제시합니다. 본문은 능동적 인도라는 최근 어휘 검토를 따릅니다.
lexical_decisions:
- source_word: mamillis
  english_pob_choice: from the breasts
  chosen_korean: 젖가슴들로부터
  alternatives_korean:
  - 가슴에서
  - 젖에서
  - 유방들로부터
  lexicon: mamillae
  rationale: 라틴어 mamillis는 문자 그대로 ‘젖가슴/유방’의 복수형이므로, 의미를 약화하지 않되 현대 한국어에서 읽을 수 있게 ‘젖가슴들로부터’로 옮겼습니다.
- source_word: praeberi lac, fructum mamillarum
  english_pob_choice: milk is provided, the fruit of the breasts
  chosen_korean: 젖이 공급되고, 젖가슴의 열매가 공급되어
  alternatives_korean:
  - 젖이 주어지고, 젖가슴의 열매가 주어져
  - 우유가 공급되고, 가슴의 열매가 공급되어
  lexicon: praeberi / fructum
  rationale: praeberi는 수동형 ‘공급되다’에 가깝고, fructum mamillarum은 직역하면 ‘젖가슴의 열매’이므로 영어 POB의 표지를 따라 직설적으로 유지했습니다.
- source_word: dispones eum tuae misericordiae
  english_pob_choice: you direct him by your mercy
  chosen_korean: 당신의 긍휼로 그를 인도하십니다
  alternatives_korean:
  - 당신의 긍휼에 그를 맡기십니다
  - 당신의 긍휼로 그를 다스리십니다
  lexicon: dispones / misericordia
  rationale: latest revision의 판단을 따라 dispones를 ‘맡기다’보다 능동적이고 지시적인 ‘인도하다’로 옮겼으며, tuae misericordiae는 수단/도구의 의미를 살려 ‘당신의 긍휼로’로 처리했습니다.
- source_word: iusticiae / lege / intellectu
  english_pob_choice: in your righteousness / in your law / by your understanding
  chosen_korean: 당신의 의로 / 당신의 율법으로 / 당신의 깨달음으로
  alternatives_korean:
  - 당신의 공의로 / 당신의 법으로 / 당신의 이해로
  - 당신의 정의로 / 당신의 토라로 / 당신의 지성으로
  lexicon: iusticia / lex / intellectus
  rationale: iusticiae는 본문 전통상 ‘의’가 가장 직접적이며, lex는 여기서 토라적 ‘율법’으로, intellectus는 ‘이해’보다 하나님의 내적 식견을 살리는 ‘깨달음’이 문맥에 맞습니다.
theological_decisions:
- issue: 하나님의 속성 표현의 병렬 구조
  chosen_reading: ‘긍휼로 … 의로 … 율법으로 … 깨달음으로’의 도구격 병렬을 살려, 하나님의 양육과 인도가 단일 개념이 아니라 서로 구별되는 속성들에 의해 이루어짐을 드러냈습니다.
  alternative_readings:
  - ‘긍휼에 의해 … 의 안에서 … 율법 안에서 … 이해로’처럼 보다 추상적으로 처리
  - ‘자비로’와 ‘공의로’를 바꾸어 전통적 교회어에 맞춤
  rationale: 라틴어의 병렬 구조가 수사적으로 중요하므로, 각 항목을 동일한 문법 틀로 살려 하나님의 성품이 어떻게 작동하는지 보이도록 했습니다.
  doctrine_reference: 하나님의 속성들의 일관성과 구별성
