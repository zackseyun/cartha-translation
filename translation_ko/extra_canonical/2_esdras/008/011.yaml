  to: 젖가슴에서 젖, 곧 젖가슴의 열매가 나오게 하셔서 당신께서 지으신 것이 얼마 동안 자라도록 하시고, 그 뒤에는 당신의 긍휼로 그를 인도하실 것입니다.[a] 당신의 의로 그를 기르셨고, 당신의 율법으로 그를 가르치셨으며, 당신의 명철로 그를 바로잡으셨습니다.
