    rationale: 신체 기관의 복수는 라틴어에서 흔하며 한국어에서는 단수·집합 표현이 자연스럽습니다. ‘젖가슴들’은 불필요하게 어색하고 본문의 의미를 더 정확하게 하지 않습니다.
  - severity: medium
    issue: ‘젖이 공급되고, 젖가슴의 열매가 공급되어’가 동격 표현을 두 개의 별도 대상처럼 처리함
    rationale: lac와 fructum mamillarum은 젖을 설명·강조하는 병렬 표현으로 읽는 것이 자연스럽습니다. 반복된 ‘공급’은 원문에 없는 중복을 만들고 한국어 문장도 부자연스럽게 합니다.
  - severity: low
    issue: dispones의 미래 시제가 현재형 ‘인도하십니다’로 번역됨
    rationale: 라틴어 dispones는 미래형이므로 ‘인도하실 것입니다’가 원문 형식을 더 충실히 반영합니다.
  - severity: low
