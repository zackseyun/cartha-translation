lexical_decisions:
- source_word: in ea creata fuerint
  english_pob_choice: the things that have been created in it
  chosen_korean: 그 안에 창조된 것들을
  alternatives_korean:
  - 그 안에서 만들어진 것들을
  - 그 안에 지음받은 것들을
  lexicon: creare
  rationale: creata fuerint는 존재 안에서 ‘창조된’ 상태를 가리키므로, 단순한 제작보다 창조의 뉘앙스를 살려 번역했습니다.
- source_word: Imperasti
  english_pob_choice: you commanded
  chosen_korean: 당신께서는 명하셨습니다
  alternatives_korean:
  - 당신께서는 명령하셨습니다
  - 당신께서는 지시하셨습니다
  lexicon: imperare
  rationale: 라틴어 imperative 성격을 살리면서도 한국어에서 자연스러운 존대 서술로 옮겼습니다.
- source_word: ex ipsis membris
  english_pob_choice: from those very members
  chosen_korean: 그 몸의 지체들 가운데서
  alternatives_korean:
  - 그 아주 지체들로부터
  - 그 지체들 자체로부터
  lexicon: membra
  rationale: ipsis의 강조를 ‘그 몸의 지체들’로 구체화해, 단순한 ‘those’보다 더 강한 원천 강조를 반영했습니다.
theological_decisions:
- issue: ipsis의 강조를 어떻게 반영할지
  chosen_reading: 문맥상 단순한 지시가 아니라 ‘그 몸의 지체들’이라는 구체적이고 강조된 출처를 드러내도록 번역했습니다.
  alternative_readings:
  - 그 지체들 가운데서
  - 그 지체들 자체로부터
  rationale: 라틴어 ipsis는 단순 지시보다 강조를 더하므로, 원천의 구체성과 강조를 약화시키지 않는 방향을 택했습니다.
