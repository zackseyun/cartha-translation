  rationale: 원문의 단편적 상태를 인위적으로 완결하지 않고 보존했습니다. ‘바로 그 신체 부위들 자체에서’는 ex ipsis membris의 출처 의미와 강조를 반영하며, ‘곧’은 hoc est가 뒤따르는 설명을 이끈다는 점을 드러냅니다.
