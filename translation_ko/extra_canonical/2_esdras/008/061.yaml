id: 2ES.8.61
reference: 2 Esdras 8:61
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: omnibus demonstraui nisi tibi et tibi similibus paucis. et re-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/061.yaml
  text: I have shown these things to all[a], but to you and to a few like you. And—
  footnotes:
  - marker: a
    text: Or 'but they who were created defiled the name of him who made them and were ungrateful to him who prepared life for them. Therefore my judgment now draws near—which I have not shown to all, but only to you and a few like you.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 이것들을 모든 사람에게 보여 주었습니다. 그러나 당신과 당신 같은 몇 사람에게만 보여 주었습니다. 그리고—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnibus demonstraui
  english_pob_choice: I have shown these things to all
  chosen_korean: 나는 이것들을 모든 사람에게 보여 주었습니다
  alternatives_korean:
  - 나는 이것들을 모두에게 보여 주었습니다
  - 나는 이것들을 모든 사람 앞에 드러냈습니다
  lexicon: demonstrare
  rationale: 라틴어 demonstravi는 단순한 ‘말하다’보다 ‘보여 주다/드러내다’에 가깝기 때문에, 사유의 내용이 공적으로 제시되었음을 살려 ‘보여 주었습니다’로 옮겼습니다.
- source_word: nisi tibi et tibi similibus paucis
  english_pob_choice: but to you and to a few like you
  chosen_korean: 그러나 당신과 당신 같은 몇 사람에게만
  alternatives_korean:
  - 오직 당신과 당신 같은 소수에게만
  - 당신과 당신 같은 몇몇 사람들에게만
  lexicon: nisi ... paucis
  rationale: nisi는 배타적 제한을 나타내므로 ‘-에게만’을 살렸고, paucis는 단순 수량보다 ‘소수’의 뉘앙스가 있으나 한국어 문맥에서는 ‘몇 사람’이 더 자연스러워 선택했습니다.
- source_word: et re-
  english_pob_choice: And—
  chosen_korean: 그리고—
  alternatives_korean:
  - 그리고
  - 또—
  lexicon: et
  rationale: 본문이 명백한 단절로 끝나므로, 라틴어 접속사 et를 완결시키지 않고 한국어에서도 끊김을 보존했습니다.
theological_decisions:
- issue: 절 분절과 미완성 종결의 보존
  chosen_reading: 이 절은 앞뒤 절의 내용과 섞지 않고, 전달된 라틴어 단편이 끝나는 지점의 미완성 상태를 그대로 드러냈습니다.
  alternative_readings:
  - 8:60의 내용과 합쳐 완결문으로 번역
  - 끊김을 무시하고 문장을 매끈하게 종결
  rationale: 제공된 source text는 단편('et re-')으로 끝나므로, 정본식으로 매끈하게 보정하면 원문 증거를 가리게 됩니다. 따라서 단절 자체를 번역에 남겨 후속 절과의 연결을 열어 두었습니다.
  doctrine_reference: 본문 비평 및 절 분절 원칙
