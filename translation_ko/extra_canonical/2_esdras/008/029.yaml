source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: neque volueris perdere qui pecorum mores habuerunt, sed respicias eos qui legem tuam splendide docuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/029.yaml
  text: Do not desire to destroy those who have had the ways of cattle[a], but look upon those who have taught your law splendidly.
  footnotes:
  - marker: a
    text: Or 'Do not be willing to destroy those who have had the manners of cattle, but look upon those who have taught your law splendidly.'.
    reason: previous_rendering
translation:
  language: ko
  text: 짐승 같은 삶을 살았던 이들을 멸하려고 하시지 마시고, 주님의 율법을 훌륭하게 가르친 이들을 돌아보아 주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘짐승 같은 삶’은 직역적 ‘가축의 방식’을 한국어 관용에 맞게 풀어 옮긴 것입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: neque volueris perdere
  english_pob_choice: Do not desire to destroy
  chosen_korean: 멸하려고 하시지 마시고
  alternatives_korean:
  - 파괴하려 하지 마시고
  - 멸망시키려 하지 마시고
  lexicon: perdere
  rationale: volueris를 단순한 금지형보다 ‘~하려고 하시지 마시고’로 옮겨, 파멸을 뜻하는 perdere의 강도를 살렸습니다.
- source_word: qui pecorum mores habuerunt
  english_pob_choice: those who have had the ways of cattle
  chosen_korean: 짐승 같은 삶을 살았던 이들
  alternatives_korean:
  - 소의 습성을 지닌 이들
  - 가축의 방식으로 살아온 이들
  lexicon: mores / pecorum
  rationale: mores는 단순한 예절이 아니라 삶의 방식·행실을 뜻하므로, ‘짐승 같은 삶’으로 자연스럽게 풀어 인간답지 못한 행실의 대비를 살렸습니다.
- source_word: legem tuam splendide docuerunt
  english_pob_choice: those who have taught your law splendidly
  chosen_korean: 주님의 율법을 훌륭하게 가르친 이들
  alternatives_korean:
  - 주님의 율법을 찬란하게 가르친 이들
  - 주님의 율법을 빛나게 가르친 이들
  lexicon: legem tuam / splendide docuerunt
  rationale: docuerunt는 ‘가르치다’가 자연스럽고, splendide는 과장된 미사여구보다 공적으로 훌륭함을 드러내는 ‘훌륭하게’가 한국어에서 더 안정적입니다.
- source_word: legem tuam
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 당신의 율법
  - 주의 율법
  lexicon: legem / lex
  rationale: 호칭 대상을 직접 표현하는 문맥으로 보아 한국어에서는 2인칭 소유를 살리되, 기도적·호소적 문맥에 맞게 ‘주님의 율법’으로 옮겼습니다.
theological_decisions:
- issue: 가축/짐승 비유의 강도
  chosen_reading: ‘짐승 같은 삶’으로 옮겨 비인격적이고 본능적인 행위를 비판하는 대비를 유지했습니다.
  alternative_readings:
  - ‘가축의 습성을 가진’
  - ‘소처럼 행한’
  rationale: 라틴어 pecorum mores는 단순한 성격 묘사가 아니라 사람답지 않은 행실을 가리키므로, 완곡하게 약화하지 않았습니다.
  doctrine_reference: source-text contrast and moral anthropology
