lexical_decisions:
- source_word: serit
  english_pob_choice: sows
  chosen_korean: 뿌리고
  alternatives_korean:
  - 파종하고
  - 심고
  lexicon: sero
  rationale: 라틴어 serit은 씨를 뿌리거나 심는 행위를 가리키므로, 여기서는 앞의 semina multa에 맞추어 자연스럽게 ‘뿌리고’로 옮겼습니다.
- source_word: semina multa
  english_pob_choice: many seeds
  chosen_korean: 많은 씨를
  alternatives_korean:
  - 수많은 씨를
  - 많은 씨앗을
  lexicon: semen
  rationale: semina는 씨앗을 뜻하므로 ‘씨를’이 가장 직접적이며, multa는 양의 많음을 살려 ‘많은’으로 옮겼습니다.
- source_word: plantationis multitudinem
  english_pob_choice: a multitude of plantings
  chosen_korean: 많은 나무를 심습니다
  alternatives_korean:
  - 많은 식물을 심습니다
  - 많은 재배를 합니다
  lexicon: plantatio
  rationale: plantationis multitudinem은 문자적으로는 ‘심어진 것/심음의 무리’이지만, 문맥상 앞의 ‘씨를 뿌림’과 대응하는 결과를 자연스럽게 드러내도록 ‘많은 나무를 심습니다’로 의역했습니다.
theological_decisions:
- issue: 이미지의 반복과 병렬
  chosen_reading: ‘씨를 뿌리고 … 나무를 심습니다’로 농경 이미지의 병렬을 살렸습니다.
  alternative_readings:
  - ‘많은 씨와 많은 심는 것’을 직역해 더 낯설게 옮길 수 있습니다.
  rationale: 이 절은 의미 전달보다 이미지의 누적과 풍성을 보여 주는 구절이므로, 한국어에서도 병렬 구조를 유지해 원문의 힘을 살렸습니다.
