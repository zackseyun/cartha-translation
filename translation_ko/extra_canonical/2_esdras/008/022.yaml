source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: firmum et dicta perseuerantia, Cuius dispositio fortis et iussio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/022.yaml
  text: whose service turns to wind and fire[a], whose word is sure and whose sayings endure, whose ordering is strong and whose command is fearful[b],
  footnotes:
  - marker: a
    text: Latin reads seruatio (‘preservation’) here, but in this angelic context the sense is commonly taken as ‘service’ or ‘ministry.’ The translation follows the contextual sense and flags the crux rather than pretending the Latin is straightforward.
    reason: textual_variant
    anchor_ref: '8:22'
  - marker: b
    text: Or 'whose service is in wind and fire,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분들의 섬김은 바람과 불로 바뀌며, 그분의 말씀은 확고하고 그분의 뜻은 지속되며, 그분의 질서는 강하고 그분의 명령은 두렵습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 seruatio는 문자적으로는 ‘보존, 보전’이지만, 이 문맥에서는 천사적 ‘섬김/사역’의 뜻으로 이해하는 것이 일반적입니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘그분의 명령은 두렵다’입니다. 여기서 ‘두렵다’는 공포라기보다 경외를 불러일으키는 엄숙함을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: firmum
  english_pob_choice: whose word is sure
  chosen_korean: 그분의 말씀은 확고하고
  alternatives_korean:
  - 그분의 말씀은 견고하고
  - 그분의 말은 확실하고
  lexicon: firmus
  rationale: 라틴어 firmum은 ‘확고한, 견고한’의 뜻이므로, 말씀의 신뢰성과 안정성을 살려 ‘확고하고’로 옮겼습니다.
- source_word: dicta perseuerantia
  english_pob_choice: whose sayings endure
  chosen_korean: 그분의 뜻은 지속되며
  alternatives_korean:
  - 그분의 말씀들은 지속되며
  - 그분의 말들은 오래가며
  lexicon: dictum / perseverantia
  rationale: dicta는 ‘말해진 것들’이지만, 여기서는 앞의 ‘말씀’과 평행을 이루며 지속성을 강조하므로 자연스러운 한국어로 ‘뜻’과 ‘지속되며’로 반영했습니다.
- source_word: dispositio fortis
  english_pob_choice: whose ordering is strong
  chosen_korean: 그분의 질서는 강하고
  alternatives_korean:
  - 그분의 배치는 강하고
  - 그분의 정돈은 강하고
  lexicon: dispositio
  rationale: dispositio는 단순한 배열보다 ‘질서 있게 정해진 배열/배치’를 뜻하므로, 문맥상 통치적 배열을 살리는 ‘질서’가 가장 적절합니다.
- source_word: iussio
  english_pob_choice: whose command is fearful
  chosen_korean: 그분의 명령은 두렵습니다
  alternatives_korean:
  - 그분의 명령은 경외롭습니다
  - 그분의 명령은 무섭습니다
  lexicon: iussio
  rationale: iussio는 명령, 지시를 뜻하며, 문맥의 엄숙함을 살리되 현대 한국어에서 과도하게 구어적인 ‘무섭다’보다 ‘두렵다’가 더 적합합니다.
- source_word: Quorum / Cuius
  english_pob_choice: whose service turns to wind and fire ... whose word ... whose ordering ... whose command ...
  chosen_korean: 그분들의 섬김은 바람과 불로 바뀌며
  alternatives_korean:
  - 그분들의 섬김은 바람과 불이 되며
  - 그분들의 봉사는 바람과 불로 바뀌며
  lexicon: quorum / seruatio (contextual crux)
  rationale: 영문 POB가 지적한 바와 같이 이 절의 첫 항은 ‘service/ministry’의 난점이 있어, 천사적 섬김이라는 문맥을 따라 ‘섬김’으로 옮기고 동사의 변화성을 살려 ‘바람과 불로 바뀌며’로 반영했습니다.
theological_decisions:
- issue: 첫 항의 주체가 천사인지 하나님인지 구분되는 평행구조
  chosen_reading: ‘그분들의 섬김’으로 시작해 뒤의 단수 소유격들은 하나님께 돌리는 평행구조를 유지했습니다.
  alternative_readings:
  - 모든 절을 동일한 주체로 읽는 번역
  - 첫 항도 하나님께 직접 돌리는 번역
  rationale: 라틴어 복수형 Quorum과 뒤의 단수형 Cuius의 대비를 살려, 첫 항은 천사들의 섬김이고 뒤의 속성들은 하나님께 속한 것으로 구분해야 본문의 구조가 분명해집니다.
  doctrine_reference: 천상 존재와 하나님의 구별을 드러내는 문법적 평행 구조
