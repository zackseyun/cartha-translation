translation:
  language: ko
  text: 농부의 씨가 올라오지 않는다면 — 그것은 받지 못했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘씨가 올라오지 않는다면’이지만, 라틴어 ascenderit는 씨앗이 지면 위로 돋아오르는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Quoniam
  english_pob_choice: For
  chosen_korean: — 그것은
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 그 까닭은
  lexicon: 관계 접속사/논증 연결
  rationale: 라틴어 Quoniam은 앞절의 논지를 받쳐 주는 이유 제시이므로, 한국어 본문에서는 지나친 설명어를 넣기보다 대시로 이어 주어 논증적 연결을 살렸습니다.
- source_word: semen agricolae
  english_pob_choice: the farmer’s seed
  chosen_korean: 농부의 씨
  alternatives_korean:
  - 농사꾼의 씨
  - 농부의 종자
  - 경작자의 씨
  lexicon: semen / agricola
  rationale: semen은 문맥상 농부의 씨앗이며, agricolae는 농부의 소유격이므로 자연스러운 현대 한국어로 옮겼습니다.
- source_word: si non ascenderit
  english_pob_choice: if ... does not come up
  chosen_korean: 올라오지 않는다면
  alternatives_korean:
  - 자라나지 않는다면
  - 돋아나지 않는다면
  - 올라오지 않으면
  lexicon: ascendere
  rationale: ascendere는 곡식이 지면 위로 솟아오르다/돋아나다는 뜻이므로, 발아·생장을 함께 담는 ‘올라오다’로 옮겼습니다.
- source_word: non enim accepit
  english_pob_choice: for it did not receive
  chosen_korean: 그것은 받지 못했기 때문입니다
  alternatives_korean:
  - 그것이 받지 못했기 때문입니다
  - 받지 못했기 때문입니다
  - 그것은 받지 않았기 때문입니다
  lexicon: accipere
  rationale: 라틴어가 원인을 짧게 제시하므로, 한국어에서도 단정적인 원인절로 처리해 문장 구조를 유지했습니다.
theological_decisions:
- issue: 비유의 압축성과 해석 범위
  chosen_reading: 본문의 농사 비유를 확장하지 않고, 라틴어가 직접 말하는 ‘씨가 올라오지 않음’과 ‘받지 못함’만 제시했습니다.
  alternative_readings:
  - 씨가 자라지 않음으로 풀어 설명
  - 비가 부족했다는 암시를 본문에 덧붙임
  rationale: 개정본의 삭제 취지에 맞춰 원문에 없는 '비'나 '계절' 정보를 추가하지 않고, 소박한 인과 구조만 드러내는 것이 가장 안전합니다.
  doctrine_reference: 본문 비평/번역 충실성
- issue: 논증 연결어의 처리
  chosen_reading: Quoniam을 번역상 명시적 이유 연결 대신 대시로 처리해 앞뒤 논리의 긴밀함을 살렸습니다.
  alternative_readings:
  - 왜냐하면
  - 그러므로
  rationale: 이 구절은 독립 진술보다 직전 논지의 사례 제시이므로, 한국어에서 과도하게 교훈문처럼 만들지 않기 위해 절제된 연결을 택했습니다.
  doctrine_reference: 문맥적 담화 기능
