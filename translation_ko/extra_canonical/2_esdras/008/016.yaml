  text: quod mihi dolet, Et de hereditate tua propter quam lugeo, et de Israel propter quem tristis sum, et de semine Iacob
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/016.yaml
  text: which causes me pain[a], and concerning your inheritance, for which I mourn, and concerning Israel, for whom I am sorrowful, and concerning the seed of Jacob,
  footnotes:
  - marker: a
    text: Or 'and concerning your inheritance, for which I mourn, and concerning Israel, for whom I am grieved, and concerning the seed of Jacob, for which I am troubled.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것이 내게 고통을 주고, 당신의 기업에 관하여, 내가 그것 때문에 애통하며, 이스라엘에 관하여, 내가 그 때문에 슬퍼하고, 야곱의 씨에 관하여,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod mihi dolet
  english_pob_choice: which causes me pain
  chosen_korean: 이것이 내게 고통을 주고
  alternatives_korean:
  - 이것이 나를 아프게 하고
  - 이것이 내게 아픔을 주고
  lexicon: quod / dolet
  rationale: 라틴어 관계절의 주어를 ‘이것’으로 받아 앞 절의 내용을 가리키게 하여, POB의 문맥적 연결을 살리면서도 ‘pain’의 직접성을 유지했습니다.
- source_word: hereditate tua
  english_pob_choice: your inheritance
  chosen_korean: 당신의 기업
  alternatives_korean:
  - 당신의 상속
  - 당신의 유업
  lexicon: hereditas
  rationale: 성경적·법정적 소유 개념을 담는 ‘기업’이 원문의 상속 재산/분깃 의미를 가장 정확하게 전달합니다.
- source_word: lugeo
  english_pob_choice: I mourn
  chosen_korean: 내가 애통하며
  alternatives_korean:
  - 내가 슬퍼하며
  - 내가 애곡하며
  lexicon: lugeo
  rationale: 단순한 감정보다 상실에 대한 깊은 애도라는 뉘앙스를 살리기 위해 ‘애통하다’를 택했습니다.
- source_word: tristis sum
  english_pob_choice: I am sorrowful
  chosen_korean: 내가 슬퍼하고
  alternatives_korean:
  - 내가 근심하고
  - 내가 비통하고
  lexicon: tristis sum
  rationale: English audit의 ‘sorrowful’를 반영하되, 한국어에서는 평이하고 문맥상 자연한 현재 서술형으로 옮겼습니다.
theological_decisions:
- issue: 문장 말미의 절단
  chosen_reading: 본문은 2 Esdras 8:16의 라틴어 범위에 있는 절들만 옮기고, 다음 절의 내용인 ‘propter quod conturbor’는 포함하지 않았습니다.
  alternative_readings:
  - 문장 끝을 보완해 매끈하게 마무리한다
  - 다음 절의 표현을 끌어와 완전한 문장으로 만든다
  rationale: 주어진 소스 스팬을 엄격히 따르기 위해, 문장이 한국어로도 미완성처럼 보이더라도 원문 경계를 유지했습니다.
  doctrine_reference: source-boundary fidelity
