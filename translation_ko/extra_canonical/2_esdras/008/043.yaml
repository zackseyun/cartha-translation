translation:
  language: ko
  text: 제때 내리는 주님의 비도, 많은 비로 말미암아 상하면 사라집니다. 그러나 주님의 손으로 빚어진 사람, 곧 주님의 형상이라 불리는 사람은…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: pluuiam tuam in tempore
  english_pob_choice: your rain in its time
  chosen_korean: 주님의 비를 그 때에 내리소서
  alternatives_korean:
  - 주님의 비를 때맞추어 내리소서
  - 주님의 비를 그 시기에 내리소서
  lexicon: 비 / 때
  rationale: 라틴어 소유격 tuam과 in tempore를 살려 ‘주님의 비’와 ‘그 때에’를 분리해 옮겼습니다. 청원문 맥락에 맞게 명령형으로 처리했습니다.
- source_word: si corruptum fuerit multitudine pluuiae
  english_pob_choice: if it is ruined by the abundance of rain
  chosen_korean: 비가 많은 양으로 인해 망가지면
  alternatives_korean:
  - 비가 너무 많이 와서 상하면
  - 폭우로 인해 썩어 버리면
  lexicon: corruptum fuerit / multitudine pluuiae
  rationale: corruptum을 단순한 ‘파괴’보다 상태의 훼손을 나타내는 ‘망가지다’로 옮겨, 다량의 비로 인한 손상을 자연스럽게 표현했습니다.
- source_word: perit
  english_pob_choice: it perishes
  chosen_korean: 그것은 사라집니다
  alternatives_korean:
  - 그것은 죽습니다
  - 그것은 없어집니다
  lexicon: perire
  rationale: 무생물인 비가 ‘죽는다’고 하기보다, 소실·소멸의 결과를 드러내는 ‘사라집니다’가 문맥상 더 적절합니다.
- source_word: homo qui manibus tuis plasmatus est
  english_pob_choice: man, who has been formed by your hands
  chosen_korean: 손으로 지으신 사람은
  alternatives_korean:
  - 당신의 손으로 빚으신 사람은
  - 주님의 손으로 지음 받은 사람은
  lexicon: plasmatus est
  rationale: plasmatus est의 ‘빚다/지다’ 의미를 살리되, 한국어에서 자연스러운 ‘손으로 지으신’으로 압축했습니다.
- source_word: et vocatur imago tua
  english_pob_choice: and is called your image
  chosen_korean: 곧 주님의 형상이라 불리는 사람은
  alternatives_korean:
  - 그리고 주님의 형상이라 불리는 사람은
  - 당신의 형상이라 일컬어지는 사람은
  lexicon: imago
  rationale: 직역성만 유지하면 어색해지므로 ‘곧’으로 동격을 밝혔고, imago를 POB의 일관된 신학 어휘에 맞춰 ‘형상’으로 옮겼습니다.
theological_decisions:
- issue: 인간의 창조와 하나님의 형상 표현
  chosen_reading: ‘손으로 지으신 사람’과 ‘주님의 형상’의 병치를 유지해, 인간이 신적 행위로 지음 받았고 하나님의 형상으로 불린다는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - ‘당신의 손으로 지으신 사람’과 ‘당신의 형상’으로 매끄럽게 통일
  - ‘당신의 모양’으로 완화
  rationale: 본문의 수사적 대비는 창조주와 피조물의 관계를 강조하므로, 완화하지 않고 보존했습니다.
  doctrine_reference: 창세기 1:26-27의 하나님의 형상 개념
