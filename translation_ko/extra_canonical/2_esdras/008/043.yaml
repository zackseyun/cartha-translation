  terminology: plasmatus est는 창조의 조형적 뉘앙스를 살려 ‘손으로 빚어진’으로, imago tua는 ‘주님의 형상’으로 옮겼습니다. 호칭은 초안의 ‘주님’을 일관되게 유지했습니다.
