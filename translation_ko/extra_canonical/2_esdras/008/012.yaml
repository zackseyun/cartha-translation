revisions:
- from: 주님께서는 당신의 의로 그를 기르셨고, 당신의 율법으로 그를 가르치셨으며, 당신의 이해로 그를 바로잡으셨습니다.
  to: 주님께서는 당신의 의로 그를 양육하셨고, 그에게 당신의 율법을 가르치셨으며, 당신의 통찰로 그를 바로잡으셨습니다.
  rationale: 교육의 내용·영역을 나타내는 in lege를 한국어의 자연스러운 목적어 구문으로 명시하고, intellectus를 문맥에 맞는 ‘통찰’로 조정했습니다. 그 밖에는 원문의 양육-교육-교정 병렬, 하나님의 의와 율법이라는 핵심 용어, 그리고 합쇼체 문체를 유지했습니다.
