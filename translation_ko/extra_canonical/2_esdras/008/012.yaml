id: 2ES.8.12
reference: 2 Esdras 8:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: enutristi eum tuae iustitiae, et erudisti eum in lege tua et corripuisti eum tuo intellectu,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/012.yaml
  text: You nourished him with your righteousness, and instructed him in your law, and corrected him by your understanding.
translation:
  language: ko
  text: 주님께서는 당신의 의로 그를 양육하셨고, 그에게 당신의 율법을 가르치셨으며, 당신의 통찰로 그를 바로잡으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuae iustitiae
  english_pob_choice: with your righteousness
  chosen_korean: 당신의 의로
  alternatives_korean:
  - 당신의 의와 함께
  - 당신의 공의로
  lexicon: iustitia
  rationale: 라틴어 전치사 in/with의 관계를 따라 수단·근거의 의미를 살렸고, iustitia는 이 본문에서 하나님의 의를 가리키는 표준적인 '의'로 옮겼습니다.
- source_word: erudisti eum in lege tua
  english_pob_choice: instructed him in your law
  chosen_korean: 당신의 율법으로 그를 가르치셨으며
  alternatives_korean:
  - 당신의 법으로 그를 가르치셨으며
  - 당신의 율법 안에서 그를 가르치셨으며
  lexicon: lex/lex
  rationale: lex는 여기서 단순 규범이 아니라 하나님의 율법을 가리키므로 '율법'을 택했고, 라틴어 in은 교육의 영역·매개를 반영해 자연스러운 한국어로 처리했습니다.
- source_word: corripuisti eum tuo intellectu
  english_pob_choice: corrected him by your understanding
  chosen_korean: 당신의 이해로 그를 바로잡으셨습니다
  alternatives_korean:
  - 당신의 분별로 그를 책망하셨습니다
  - 당신의 깨달음으로 그를 훈계하셨습니다
  lexicon: intellectus
  rationale: intellectus는 단순한 지적 능력보다 분별과 통찰을 포함하므로 '이해'를 기본으로 하되, 교정 행위인 corripere는 '바로잡다'로 옮겨 원문의 징계적 뉘앙스를 살렸습니다.
- source_word: enutristi eum
  english_pob_choice: You nourished him
  chosen_korean: 주님께서는 … 그를 기르셨고
  alternatives_korean:
  - 주님께서는 … 그를 양육하셨고
  - 주님께서는 … 그를 먹여 살리셨고
  lexicon: nutrio
  rationale: nutrire는 단순한 먹임보다 돌봄과 양육을 포함하므로 문맥에 맞게 '기르다'를 사용했습니다.
theological_decisions:
- issue: 직접 화행의 수신자 표기
  chosen_reading: 라틴어 2인칭 단수의 하나님 지시를 반영해 서술 전체를 주님께 대한 직접 진술로 읽었습니다.
  alternative_readings:
  - 3인칭 서술로 완화하는 번역
  - '''하나님께서''로 시작하는 중립적 서술'
  rationale: 본문이 두 인칭 어미와 소유대명사로 일관되므로, 번역도 직접 호칭의 긴장을 유지하는 편이 원문 효과를 더 정확히 드러냅니다.
  doctrine_reference: 성경 본문 화자-수신자 관계 보존
- issue: iustitia와 intellectus의 신학적 대비
  chosen_reading: '''의''와 ''이해''를 병렬로 유지해 하나님의 성품과 분별의 교정 능력을 함께 드러냈습니다.'
  alternative_readings:
  - 둘 다 추상적으로 '선하심'으로 통합
  - '''공의''와 ''지혜''로 해석'
  rationale: 본문은 양육-가르침-교정을 서로 다른 매개로 구분하므로, 개념을 합치지 않고 각각의 차이를 보존했습니다.
  doctrine_reference: 하나님의 의와 통찰의 인도
- issue: 율법 번역
  chosen_reading: lex를 '율법'으로 번역했습니다.
  alternative_readings:
  - 법
  - 가르침
  rationale: 이 단락의 교육 대상이 하나님께 속한 규범이라는 점에서 '율법'이 가장 직접적이며, 전통적 교회어를 쓰더라도 원문 의미를 흐리지 않습니다.
  doctrine_reference: 토라/율법 개념
