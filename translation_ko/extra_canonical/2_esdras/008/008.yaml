  source_fidelity: 라틴어의 주요 구조는 대체로 반영합니다. 특히 tua는 creatio를 수식하므로 ‘당신의 창조’로 옮긴 것은 맞습니다. 다만 현 각주가 ‘당신의 불과 물’이라는 이미 배제된 독법을 대안으로 제시하여 본문 및 원문과 충돌합니다.
  naturalness: ‘생명을 주시는 분이시기에’는 다소 경직되고, ‘당신의 형성은 ... 피조물을 품습니다’도 추상명사가 임신·지속의 행위를 하는 듯하여 한국어로 어색합니다. ‘빚으심은 ... 품고 있습니다’가 원문의 의인화와 임신 문맥을 유지하면서 더 자연스럽습니다.
  terminology: plasmatum/plasmatio의 연계를 ‘형성된’과 ‘빚으심’으로, creatio/creatura의 연계를 ‘창조’와 ‘피조물’로 구별했습니다. ‘자궁’, ‘지체’, ‘피조물’은 현대 표준어의 격식 있는 성경 번역 문맥에 적절합니다.
