revisions:
- from: 그리고 생명을 주시는 분이시기에, 이제 당신께서 형성된 몸을 자궁 안에서 살리시고 그 지체들을 마련해 주십니다. 당신의 창조는 불과 물 가운데 보존되며, 아홉 달 동안 당신의 형성은 그 안에서 지어진 당신의 피조물을 품습니다.[a]
  to: 또 생명을 주시는 분이시므로, 이제 당신께서 자궁 안에서 형성된 몸에 생명을 주시고 그 지체들을 마련해 주십니다. 당신의 창조는 불과 물 가운데 보존되며, 아홉 달 동안 당신의 빚으심은 그 안에서 창조된 당신의 피조물을 품고 있습니다.
  rationale: 원문에 근거하지 않는 각주와 그 표지를 삭제했습니다. 본문은 tua creatio를 ‘당신의 창조’로 유지하여 ‘불과 물’에 소유격을 부가하지 않았습니다. 마지막 절은 patitur의 임신·지속 문맥을 ‘품고 있습니다’로 옮기되, plasmatio의 다소 추상적인 원문 표현은 ‘당신의 빚으심’으로 보존했습니다.
