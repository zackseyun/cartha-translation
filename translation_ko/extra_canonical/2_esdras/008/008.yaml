id: 2ES.8.8
reference: 2 Esdras 8:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam uiuificans uiuificas nunc in matrice plasmatum corpus et praestas membra, conseruatur in igni et aqua tua creatio et nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/008.yaml
  text: And because[a], giving life, you now give life in the womb to the body that has been formed, and you provide its members, your creation is preserved in fire and water, and for nine months your formation bears your creature that has been created in it.
  footnotes:
  - marker: a
    text: Or 'your creation is preserved in your fire and water'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 생명을 주시는 분이시므로, 이제 당신께서 자궁 안에서 형성된 몸에 생명을 주시고 그 지체들을 마련해 주십니다. 당신의 창조는 불과 물 가운데 보존되며, 아홉 달 동안 당신의 빚으심은 그 안에서 창조된 당신의 피조물을 품고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuificans uiuificas nunc in matrice
  english_pob_choice: giving life, you now give life in the womb
  chosen_korean: 생명을 주시는 분이시기에, 이제 당신께서 … 자궁 안에서 살리시고
  alternatives_korean:
  - 생명을 주시기에, 이제 자궁에서 생명을 주시고
  - 살리시는 분이시기에, 이제 자궁 안에서 살리십니다
  lexicon: vivificare
  rationale: uiuificans/uiuificas의 반복을 살려 ‘생명을 주시는 분’과 ‘살리시고’로 대응했고, matrice는 생물학적으로도 직접적인 ‘자궁’이 자연스럽습니다.
- source_word: plasmatum corpus ... praestas membra
  english_pob_choice: the body that has been formed ... you provide its members
  chosen_korean: 형성된 몸을 … 그 지체들을 마련해 주십니다
  alternatives_korean:
  - 만들어진 몸을 … 그 지체들을 주십니다
  - 형성된 몸을 … 그 몸의 지체들을 공급해 주십니다
  lexicon: plasmo / praestare
  rationale: plasmatum은 ‘형성된’으로, praestas membra는 단순 ‘주다’보다 ‘마련해 주다’가 몸의 지체를 갖추어 주는 뉘앙스를 더 잘 드러냅니다.
- source_word: conseruatur in igni et aqua tua creatio
  english_pob_choice: your creation is preserved in fire and water
  chosen_korean: 당신의 창조는 불과 물 가운데 보존되며
  alternatives_korean:
  - 당신의 창조는 당신의 불과 물 가운데 보존되며
  - 당신의 피조물은 불과 물 속에서 지켜지며
  lexicon: creatio / conseruare
  rationale: 개정된 영어 주석처럼 ‘fire and water’에 ‘your’를 붙이지 않고, tua는 creatio를 수식하므로 ‘당신의 창조’로 붙였습니다.
- source_word: nouem mensibus patitur tua plasmatio tuae creaturae quae in eo creata est
  english_pob_choice: for nine months your formation bears your creature that has been created in it
  chosen_korean: 아홉 달 동안 당신의 형성은 그 안에서 지어진 당신의 피조물을 품습니다
  alternatives_korean:
  - 아홉 달 동안 당신의 형성은 그 안에서 만들어진 당신의 피조물을 견딥니다
  - 아홉 달 동안 당신의 빚으심은 그 안에서 지어진 당신의 피조물을 낳아 지닙니다
  lexicon: patitur / plasmatio / creatura
  rationale: patitur는 임신·태아의 소요를 가리키는 문맥이므로 ‘견딥니다’보다 ‘품습니다’가 더 직접적으로 gestation의 의미를 살립니다.
theological_decisions:
- issue: 생명과 창조의 주체를 둘 다 하나님께 돌리는 병렬 구조
  chosen_reading: ‘생명을 주시는 분’과 ‘당신의 창조/형성’의 반복을 유지해, 인간 생명의 형성과 보존이 모두 하나님에게서 온다는 점을 드러냈습니다.
  alternative_readings:
  - 앞부분과 뒷부분을 하나의 장식적 수식으로 약화시키는 번역
  - ‘만드신 것’ 정도로 완화해 창조 언어를 일반적 생산 언어로 바꾸는 번역
  rationale: 라틴어의 반복 구조는 생명 부여와 형성, 보존을 모두 하나님 행위로 묶습니다. 이를 약화하지 않는 것이 본문의 신학적 핵심에 가깝습니다.
  doctrine_reference: 창조론 / 섭리
- issue: ‘품습니다’의 선택
  chosen_reading: patitur를 임신의 지속과 수고를 포함한 ‘품다’로 옮겨, 단순 인내가 아니라 태내 보존과 성장의 이미지를 살렸습니다.
  alternative_readings:
  - ‘견딥니다’
  - ‘겪습니다’
  rationale: 문맥상 대상은 태중의 형성 과정이며, POB의 영어도 ‘bears’로 수정되어 출산·임신의 생리적 함의를 분명히 합니다.
  doctrine_reference: 생명 형성 / 섭리
