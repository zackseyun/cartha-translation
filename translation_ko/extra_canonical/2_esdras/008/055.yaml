    text: 라틴어 in finem은 직역하면 ‘끝에’이며, 문맥상 ‘마침내/결국’으로도 풀릴 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: thesaurus inmortalitatis는 문맥상 ‘불멸의 보물’로 옮겼습니다. POB의 영어 초안은 더 긴 전승을 가리키는 주석을 달았지만, 이 소스 구절 자체는 그 짧은 단편만 담고 있습니다.
    reason: source_note
lexical_decisions:
- source_word: in finem
  english_pob_choice: in the end
  chosen_korean: 끝에
  alternatives_korean:
  - 마침내
  - 결국에
  - 종말에
  lexicon: finis
  rationale: 라틴어 in finem은 여기서 종결 지점을 가리키는 간결한 표현이므로, 문맥을 과장하지 않는 ‘끝에’로 옮겼습니다.
- source_word: thesaurus
  english_pob_choice: the treasure
  chosen_korean: 보물
