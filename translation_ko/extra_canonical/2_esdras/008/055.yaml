  alternative_readings:
  - ‘마지막에는 불멸의 보물이 있습니다’처럼 문장을 매끈하게 재구성하는 방식
  - 앞뒤 문맥을 끌어와 더 완전한 신학적 진술로 확장하는 방식
  rationale: 이 절은 현재 제공된 소스가 매우 압축된 단편이므로, 문맥을 과도하게 보충하지 않고 남아 있는 표현만 투명하게 반영하는 것이 더 안전합니다.
  doctrine_reference: source transparency / textual restraint
