  - 재물
  - 창고
  lexicon: thesaurus
  rationale: thesaurus는 단순한 저장고가 아니라 귀중한 것의 축적을 뜻하므로, 직관적이면서도 가치성을 살리는 ‘보물’이 적절합니다.
- source_word: inmortalitatis
  english_pob_choice: immortality
  chosen_korean: 불멸
  alternatives_korean:
  - 영생
  - 죽지 않음
  - 불사
  lexicon: immortalitas
  rationale: 라틴어 immortalis/immortalitas의 기본 뜻을 직접 드러내는 ‘불멸’이 가장 정확하며, ‘영생’은 신학적 뉘앙스를 조금 더 앞세웁니다.
- source_word: Noli ergo adhuc adicere
  english_pob_choice: Therefore do not continue to add
  chosen_korean: 그러므로 아직 더 보태지 마십시오
  alternatives_korean:
  - 그러니 더 이상 더하지 마십시오
  - 그러므로 계속 더하지 마십시오
  - 그러니 이제 그만 보태십시오
  lexicon: noli ... adicere
  rationale: noli는 금지 명령이므로 공손한 금지형으로 처리했고, adhuc는 ‘아직/더’의 지속성을 나타내어 ‘아직 더’로 살렸습니다.
