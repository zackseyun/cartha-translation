review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 substantiam operum bonorum은 ‘선한 행위’ 자체의 부재라기보다 그 행위의 ‘자산·축적·비축’이 없음을 뜻하므로, 이를 더 자연스럽게 유지했습니다. 본문은 하나님의 의와 선하심이 ‘선포될 것’이라고 하므로 ‘드러나게 될 것입니다’보다 ‘선포될 것입니다’가 adnuntiabitur에 더 가깝습니다.
  naturalness: 초안의 ‘이는 … 드러나게 될 것입니다, 주님 —’은 한국어 어순과 호칭 처리에서 다소 번역투입니다. 시간절을 앞에 두고 호칭을 문장 중간에 자연스럽게 배치하여 현대 합쇼체 문장으로 다듬었습니다. 불필요한 닫는 인용부호와 그 뒤의 각주 표지도 제거했습니다.
  terminology: iusticia는 ‘의’, bonitas는 ‘선하심’, domine는 ‘주님’으로 적절합니다. substantia를 곧바로 ‘공로’라고 규정하는 각주 설명은 원문의 물질적·비유적 어휘 범위를 좁히고 교리적 해석을 덧붙이므로 중립적으로 수정했습니다.
  issues:
  - severity: medium
    issue: adnuntiabitur의 표현
    rationale: 라틴어는 ‘선포되다/알려지다’라는 공적 선언의 뜻입니다. ‘드러나다’도 가능한 결과 표현이지만, 여기서는 ‘선포될 것입니다’가 더 직접적입니다.
  - severity: medium
    issue: 각주의 ‘공로’ 단정
    rationale: substantia는 본래 자산, 재산, 실질, 비축 등을 뜻하며, 문맥상 선한 행위의 축적을 가리킵니다. 이를 ‘공로가 쌓여 있지 않다’로 확정하면 본문 어휘보다 해석을 강화합니다.
  - severity: low
    issue: 문장부호와 각주 위치
    rationale: 독립된 절 번역에 근거 없는 닫는 인용부호가 있고, 각주 표지가 문장 종결 뒤에 놓여 있습니다. 각주를 유지할 경우 해당 어구 바로 뒤에 둡니다.
  revised_text: 이는 당신께서 선한 행위의 축적이 없는 이들에게 자비를 베푸실 때, 주님, 당신의 의와 선하심이 선포될 것이기 때문입니다.[a]
