id: 2ES.8.36
reference: 2 Esdras 8:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'deliquit. In hoc enim adnuntiabitur iusticia tua et bonitas tua, domine, cum misertus fueris eis qui non habent substantiam operum bonorum. Et respondit ad me et dixit: recte locutus es aliqua, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/036.yaml
  text: For in this your righteousness and your goodness will be declared, Lord, when you have mercy on those who have no store of good works.”
translation:
  language: ko
  text: 이는 당신의 의와 당신의 선하심이 드러나게 될 것입니다, 주님 — 당신이 선한 행위의 축적이 없는 이들에게 자비를 베푸실 때에 말입니다."[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “좋은 일들의 실질/축적이 없는”으로, 공로가 쌓여 있지 않다는 뜻을 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: iusticia tua
  english_pob_choice: your righteousness
  chosen_korean: 당신의 의
  alternatives_korean:
  - 당신의 공의
  - 당신의 정의
  lexicon: δικαιοσύνη / iusticia
  rationale: English POB의 righteousness를 그대로 따라, 하나님의 성품을 가리키는 표준 번역인 ‘의’를 사용했습니다.
- source_word: bonitas tua
  english_pob_choice: your goodness
  chosen_korean: 당신의 선하심
  alternatives_korean:
  - 당신의 선함
  - 당신의 인자하심
  lexicon: bonitas
  rationale: 라틴어 bonitas는 도덕적 선함을 뜻하므로, 문맥상 자연스럽고 신학적으로도 무난한 ‘선하심’으로 옮겼습니다.
- source_word: substantiam operum bonorum
  english_pob_choice: have no store of good works
  chosen_korean: 선한 행위의 축적이 없는
  alternatives_korean:
  - 선한 일의 저축이 없는
  - 선한 행위의 저장이 없는
  lexicon: substantia / opera bona
  rationale: 저장된 공로의 이미지를 살려 ‘축적’으로 옮겼고, works는 여기서 행위의 누적분을 가리키므로 ‘선한 행위’로 자연화했습니다.
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: domine
  rationale: 직접 호칭이므로 한국어 합쇼체에서 가장 자연스러운 ‘주님’을 사용했습니다.
theological_decisions:
- issue: 선한 행위의 축적이 없는 자들에게 대한 자비가 하나님의 의와 선하심을 드러낸다는 논리
  chosen_reading: 자비는 공로를 갖춘 자가 아니라 공로가 없는 자에게 베풀어질 때 하나님의 의와 선하심이 드러난다는 역설을 살렸습니다.
  alternative_readings:
  - 의와 선하심이 자비의 결과로만 드러난다고 완화하는 읽기
  - 행위의 축적을 단순히 ‘좋은 일’로 약화하는 읽기
  rationale: 본문의 강조점은 자비의 무상성과 그로 인한 하나님의 성품의 현시이므로, 이를 약화하지 않고 유지했습니다.
  doctrine_reference: 은혜와 자비, 행위 공로에 대한 성서적 긴장
