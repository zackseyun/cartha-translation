  rationale: 원문의 논리와 어휘 이미지를 보존하면서, adnuntiabitur의 선언적 의미를 반영하고 한국어 문장 구조를 자연스럽게 조정했습니다. 각주는 substantia의 어휘 범위를 설명하되 ‘공로’에 관한 특정 교리적 해석을 부가하지 않도록 수정했습니다.
