  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possis diligere meam creaturam super me, tu autem frequenter temetipsum proximasti iniustis, numquam Sed et in hoc mirabilis eris coram altissimo, Quoniam humiliasti te, sicut decet
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/047.yaml
  text: Can you love my creation more than I do? But you have often drawn yourself near to the unrighteous. Never do so. Yet even in this you will be marvelous before the Most High[a], because you have humbled yourself, as is fitting.
  footnotes:
  - marker: a
    text: Or 'compared yourself with'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신은 내 피조물을 나보다 더 사랑할 수 있습니까? 그러나 당신은 자주 자신을 불의한 자들과 가까이 두었습니다. 그렇게 하지 마십시오. 그러나 이 일에서도 당신은 지극히 높으신 분 앞에서 놀라운 사람이 될 것입니다. 이는 당신이 마땅한 대로 자신을 낮추었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '자신을 비교하셨다'.
    reason: alternative_reading
lexical_decisions:
- source_word: possis diligere meam creaturam super me
  english_pob_choice: Can you love my creation more than I do?
  chosen_korean: 당신은 내 피조물을 나보다 더 사랑할 수 있습니까?
  alternatives_korean:
  - 당신은 내 창조물을 나보다 더 사랑할 수 있습니까?
  - 당신은 내 피조물을 나보다 더 사랑하십니까?
  lexicon: diligere → 사랑하다; creatura → 피조물
  rationale: Latin의 질문형을 살려 가능성/능력을 묻는 형식으로 옮겼고, creaturam은 단순한 '창조물'보다 관계적 뉘앙스가 있는 '피조물'이 더 자연스럽습니다.
- source_word: temetipsum proximasti iniustis
  english_pob_choice: you have often drawn yourself near to the unrighteous
  chosen_korean: 당신은 자주 자신을 불의한 자들과 가까이 두었습니다
  alternatives_korean:
  - 당신은 자주 불의한 자들에게 자신을 가까이하셨습니다
  - 당신은 자주 자신을 불의한 자들과 비교하셨습니다
  lexicon: proximasti → 가까이 두다 / 가까이하다; iniustis → 불의한 자들
  rationale: proximasti는 '비교하다'보다 '가까이 하다, 접근시키다'가 원뜻에 가깝고, 문맥상 자기 위치를 불의한 자들 쪽에 두는 의미를 드러내기 위해 '가까이 두었습니다'로 옮겼습니다.
- source_word: coram altissimo
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 지극히 높으신 분 앞에서
  - 지존자 앞에서
  lexicon: altissimus → 지극히 높으신 분
  rationale: 하나님 칭호를 직역하되 한국어 성경 문맥에서 자연스러운 존칭 표현으로 '지극히 높으신 분'을 택했습니다.
- source_word: humiliasti te, sicut decet
  english_pob_choice: because you have humbled yourself, as is fitting
  chosen_korean: 이는 당신이 마땅한 대로 자신을 낮추었기 때문입니다
  alternatives_korean:
  - 이는 당신이 합당하게 자신을 낮추었기 때문입니다
  - 이는 당신이 마땅히 자신을 낮추었기 때문입니다
  lexicon: humiliasti te → 자신을 낮추다; sicut decet → 마땅한 대로
  rationale: humiliasti te는 겸손의 내적 태도보다 '자신을 낮추다'가 직접적이며, sicut decet는 '합당하게'보다 관용적이고 문맥에 맞는 '마땅한 대로'로 옮겼습니다.
theological_decisions:
- issue: Most High 호칭의 한국어 처리
  chosen_reading: altissimo를 '지극히 높으신 분'으로 번역해 하나님을 직접 가리키는 호칭으로 드러냈습니다.
  alternative_readings:
  - 지존하신 분
  - 가장 높으신 분
  rationale: 이 절은 하나님 앞에서의 평가를 말하므로, 단순 형용사보다 인격적 호칭으로 읽히게 하는 것이 본문의 신학적 초점을 잘 보존합니다.
  doctrine_reference: 하나님의 지극성과 심판 앞의 겸손
