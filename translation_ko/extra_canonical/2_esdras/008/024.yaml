review_pass:
  verdict: revise
  source_fidelity: 라틴어의 병렬 간구와 두 개의 dum 조건절은 대체로 충실히 옮겼습니다. 그러나 figmenti tui는 ‘당신이 빚으신 존재/피조물’을 뜻하며 ‘형상’(image)을 뜻하지 않습니다. 또한 sapio는 여기서 지속적으로 ‘깨닫고 있다’기보다 ‘분별력/이해력이 있다’는 뜻이 더 직접적입니다.
  naturalness: 합쇼체 기도문으로 자연스럽습니다. 다만 ‘귀 기울여 주십시오’가 짧은 간격으로 반복되므로, intende verba mea는 ‘제 말에 주의를 기울여 주십시오’로 달리 옮기면 원문의 동사 구별도 보존되고 한국어도 매끄럽습니다.
  terminology: ‘당신의 종’은 servus tui에 적절합니다. figmentum은 ‘당신이 빚으신 피조물’로 옮겨 창조된 존재라는 의미를 자연스럽고 정확하게 드러내었습니다. ‘형상 지어진 것’이라는 현행 각주는 imago와 혼동될 수 있어 수정해야 합니다.
