source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: serui tui et auribus percipe precationem figmenti tui, intende uerba mea. Dum enim uiuo loquar et dum sapio respondeam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/024.yaml
  text: Hear[a], Lord, the prayer of your servant, and give ear to the petition of your creature; pay attention to my words. For while I live I will speak, and while I have understanding I will answer.
  footnotes:
  - marker: a
    text: Or 'hear, Lord, the prayer of your servant, and receive with your ears the petition of your thing formed;'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님, 당신의 종의 기도를 들으시고 당신이 빚으신 피조물[a]의 간구에 귀를 기울여 주십시오. 제 말에 주의를 기울여 주십시오. 제가 살아 있는 동안에는 말하겠으며, 제가 분별력이 있는 동안에는 대답하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신이 빚으신 것’ 또는 ‘당신이 형성하신 것’입니다.
    reason: figmenti tui의 ‘빚어 만들어진 피조물’이라는 어감을 설명하며, ‘형상’이라는 부정확한 표현을 피합니다.
lexical_decisions:
- source_word: serui tui
  english_pob_choice: your servant
  chosen_korean: 당신의 종
  alternatives_korean:
  - 당신의 일꾼
  - 당신의 종된 자
  lexicon: δοῦλος / servus
  rationale: Latin servus는 주인에게 속한 종의 관계를 드러내므로, 여기서는 관계적·신분적 의미를 살린 ‘종’이 가장 자연스럽습니다.
- source_word: precationem
  english_pob_choice: the prayer / the petition
  chosen_korean: 기도
  alternatives_korean:
  - 간구
  - 청원
  lexicon: precatio
  rationale: 두 번째 병렬 표현인 petition과 함께 한 기도 행위를 가리키므로, 앞절에서는 일반적이고 포괄적인 ‘기도’로 옮겼습니다.
- source_word: figmenti tui
  english_pob_choice: your creature
  chosen_korean: 당신이 빚으신 존재
  alternatives_korean:
  - 당신의 피조물
  - 당신의 창조물
  lexicon: figmentum
  rationale: figmentum은 단순한 ‘만든 것’보다 빚어 형성된 존재의 뉘앙스를 지니므로, 인간의 피조성과 의존성을 살린 표현을 택했습니다.
- source_word: auribus percipe
  english_pob_choice: give ear to
  chosen_korean: 귀 기울여 주십시오
  alternatives_korean:
  - 들어 주십시오
  - 귀를 기울이십시오
  lexicon: auribus percipere
  rationale: 직역보다 간구체의 자연스러운 한국어 관용을 살려, ‘귀 기울이다’로 옮겨 청자에게 적극적인 응답을 요청하는 어감을 보존했습니다.
- source_word: sapio
  english_pob_choice: have understanding
  chosen_korean: 깨닫고 있는
  alternatives_korean:
  - 이해하고 있는
  - 분별하고 있는
  lexicon: sapio
  rationale: sapio는 단순한 지식보다 분별·깨달음의 상태를 가리키므로, 현재진행적 조건절에 맞게 ‘깨닫고 있는’으로 표현했습니다.
theological_decisions:
- issue: 피조물/창조물 자칭의 신학적 뉘앙스
  chosen_reading: ‘당신이 빚으신 존재’로 번역해 인간이 창조주 앞에서 전적으로 의존적인 피조물임을 드러냈습니다.
  alternative_readings:
  - ‘당신의 창조물’
  - ‘당신의 피조물’
  rationale: 본문의 간구는 창조-피조물 관계를 근거로 하므로, 한국어에서도 겸손과 의존의 신학을 분명히 보이게 하는 표현이 적절합니다.
  doctrine_reference: 창조론, 인간론
