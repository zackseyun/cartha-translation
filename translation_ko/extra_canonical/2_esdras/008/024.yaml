  - severity: low
    issue: 각주 표지가 해당 어구가 아니라 절 끝에 놓여 있습니다.
    rationale: 대안 표현에 관한 각주는 ‘당신이 빚으신 피조물’ 바로 뒤에 붙여 독자가 무엇을 설명하는지 분명히 알 수 있게 해야 합니다.
  - severity: low
    issue: ‘깨닫고 있는 동안’은 sapio의 의미를 다소 주관적·진행적으로 좁힐 수 있습니다.
    rationale: sapio는 이 문맥에서 이해력 또는 분별력을 지닌 상태를 가리키므로 ‘분별력이 있는 동안’이 더 직접적입니다.
