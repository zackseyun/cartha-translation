source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tua imago nominatus, quoniam similatus est, per quem omnia plasmasti, et similasti eum semini agricolae. Non, domine
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/044.yaml
  text: called your image[a], because he has been made like you, through whom you formed all things, and you have likened him to the farmer’s seed. No, Lord
  footnotes:
  - marker: a
    text: Or 'through whom you formed all things'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 형상이라 불렸으니, 이는 그가 당신과 같이 빚어졌기 때문입니다. 만물을 당신이 만드신 그를 통해서였고, 또 당신은 그를 농부의 씨에 비기셨습니다. 아닙니다, 주님[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘만물을 당신이 만드신 그를 통해서였고’는 원문 per quem omnia plasmasti의 관계를 따라 옮긴 것으로, 일부 판본/해석은 이를 ‘만물을 그를 위하여 만드셨고’의 뜻으로 이해합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: nominatus
  english_pob_choice: called your image
  chosen_korean: “당신의 형상이라 불렸으니”
  alternatives_korean:
  - “당신의 형상으로 불렸으니”
  - “당신의 형상이라 칭해졌으니”
  lexicon: nominatus
  rationale: 라틴어 수동 분사 nominatus의 ‘불리다/명명되다’ 의미를 살려, 단순한 묘사보다 이름 붙여진 상태를 드러냈습니다.
- source_word: similatus est
  english_pob_choice: because he has been made like you
  chosen_korean: “이는 그가 당신과 같이 빚어졌기 때문입니다”
  alternatives_korean:
  - “이는 그가 당신과 같이 되게 되었기 때문입니다”
  - “이는 그가 당신과 같이 만들어졌기 때문입니다”
  lexicon: similatus est
  rationale: similatus est는 ‘닮게 되다’의 결과를 말하므로, ‘빚어지다’로 번역해 형상화된 창조의 뉘앙스를 유지했습니다.
- source_word: per quem omnia plasmasti
  english_pob_choice: through whom you formed all things
  chosen_korean: “만물을 당신이 만드신 그를 통해서였고”
  alternatives_korean:
  - “만물을 그를 통하여 만드셨고”
  - “만물을 그로 말미암아 만드셨고”
  lexicon: per quem / plasmasti
  rationale: audit trail이 지적하듯 여기서 per quem은 인간을 창조의 도구로 삼는 뜻이 아니라, ‘그를 통해서’라는 관계표현을 유지하되 앞뒤 문맥상 수단적 오해를 줄이도록 배치했습니다.
- source_word: semini agricolae
  english_pob_choice: the farmer’s seed
  chosen_korean: “농부의 씨”
  alternatives_korean:
  - “농부의 씨앗”
  - “파종하는 이의 씨”
  lexicon: semini agricolae
  rationale: 직역형의 비유를 살려 ‘씨’로 두어, 원문의 짧고 압축된 비교를 보존했습니다.
theological_decisions:
- issue: 마지막 절단된 탄원형 종결
  chosen_reading: “아닙니다, 주님”으로 끊긴 채 끝나는 원문의 단절을 그대로 살렸습니다.
  alternative_readings:
  - “그렇지 않습니다, 주님”
  - “아니요, 주님”
  rationale: 본문이 의도적으로 미완의 응답처럼 끝나므로, 완결된 문장으로 매끈하게 다듬지 않고 단호한 부정만 남겼습니다.
  doctrine_reference: 문맥 보존과 원문 종결 형태 반영
