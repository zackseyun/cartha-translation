  text: But I have heard the swiftness of the judgment that is to come.
translation:
  language: ko
  text: 그러나 저는 장차 있을 심판이 신속히 닥칠 것이라는 말을 들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sed
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  lexicon: 접속사
  rationale: 앞선 진술과 대비를 분명히 하면서도 문어체로 자연스럽게 이어 줍니다.
- source_word: audiui
  english_pob_choice: I have heard
  chosen_korean: 들은 것입니다
  alternatives_korean:
  - 들었습니다
  - 들어 왔습니다
  lexicon: audire
  rationale: 직접목적어를 취하는 라틴어 audivi의 감각을 살리되, 현재 완료의 체감은 한국어의 과거 경험 표현으로 자연스럽게 옮겼습니다.
- source_word: celeritatem iudicii
  english_pob_choice: the swiftness of the judgment
  chosen_korean: 심판의 신속함
  alternatives_korean:
  - 심판의 빠름
  - 판결의 신속함
  lexicon: celeritas; iudicium
  rationale: celeritas는 단순한 '빠름'보다 격식 있는 '신속함'이 적절하고, iudicium은 문맥상 '판결'보다 종말론적 '심판'이 더 정확합니다.
- source_word: quod futurum est
  english_pob_choice: that is to come
  chosen_korean: 다가올
  alternatives_korean:
  - 장차 있을
  - 오게 될
  lexicon: futurus sum
  rationale: 라틴어 미래 분사와 완료적 표현을 한국어의 관용적 미래 수식어로 간결하게 반영했습니다.
theological_decisions:
- issue: 심판의 시간성 표현
  chosen_reading: ‘다가올 심판’으로 옮겨, 아직 도래하지 않았으나 확정된 미래의 심판이라는 긴장을 유지했습니다.
  alternative_readings:
  - ‘오는 심판’
  - ‘미래의 심판’
  rationale: 본문은 심판의 신속함을 현재적 관찰이 아니라 장차 일어날 사건으로 말하므로, 시간적 임박성을 드러내는 표현이 가장 적절합니다.
  doctrine_reference: 종말론적 심판의 임박성
