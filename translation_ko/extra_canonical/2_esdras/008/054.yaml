lexical_decisions:
- source_word: corruptio
  english_pob_choice: corruption
  chosen_korean: 썩어짐
  alternatives_korean:
  - 부패
  - 타락
  lexicon: corruptio
  rationale: 물질적·존재론적 붕괴를 가리키는 어감이 강하므로, 도덕적 ‘타락’보다 상태 변화가 드러나는 ‘썩어짐’으로 옮겼습니다.
- source_word: in obliuionem
  english_pob_choice: into oblivion
  chosen_korean: 망각으로
  alternatives_korean:
  - 망각 속으로
  - 잊힘으로
  lexicon: obliuionem
  rationale: 라틴어 전치사구의 방향성을 살리면서, ‘잊어버림’의 상태를 간결하게 표현하는 한국어로 옮겼습니다.
- source_word: Transierunt dolores
  english_pob_choice: Sorrows have passed away
  chosen_korean: 고통은 지나갔고
  alternatives_korean:
  - 슬픔은 지나갔고
  - 고난은 사라졌고
  lexicon: dolores
  rationale: dolores는 단순한 감정적 슬픔보다 고통·고난의 폭이 넓어 ‘고통’을 기본값으로 잡았습니다.
- source_word: ostensus est
  english_pob_choice: it has been shown
  chosen_korean: 그것이 드러났습니다
  alternatives_korean:
  - 그것이 보였습니다
  - 그것이 나타났습니다
  lexicon: ostendere
  rationale: 수동형의 비인칭적 느낌을 살리면서, 무언가가 ‘드러남/나타남’이라는 공개적 의미를 한국어로 자연스럽게 반영했습니다.
theological_decisions:
- issue: 문장 말미의 ostensus est가 무엇을 가리키는지
  chosen_reading: 본문이 제시하는 불완전한 수동 표현을 그대로 살려, 대상은 명시하지 않고 ‘그것이 드러났습니다’로 처리했습니다.
  alternative_readings:
  - ‘그분이 드러나셨습니다’처럼 신학적으로 보충하는 읽기
  - 앞뒤 문맥을 따라 ‘지혜가 드러났습니다’로 확정하는 읽기
  rationale: 주어진 라틴어는 목적어가 생략된 상태이므로, 본문이 명시하지 않은 대상을 한국어에서 임의로 보충하지 않는 것이 원문 충실에 맞습니다.
  doctrine_reference: source-constraint / impersonal passive
- issue: corruptio in obliuionem의 결합 의미
  chosen_reading: ‘썩어짐이 망각으로 사라집니다’로, 상태의 소멸과 망각의 방향성을 함께 살렸습니다.
  alternative_readings:
  - ‘썩어짐은 잊혀집니다’
  - ‘부패는 망각 속으로 갑니다’
  rationale: 단순한 소멸이 아니라 ‘망각으로’ 향하는 종말적 이동을 보존하되, 과도한 해석을 피했습니다.
  doctrine_reference: source semantics
