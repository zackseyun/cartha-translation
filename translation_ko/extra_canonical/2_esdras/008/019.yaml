translation:
  language: ko
  text: 그러므로 내 음성을 들으시고 내 말들을 깨달으십시오[a], 그리고 내가 당신 앞에서 말하겠습니다. 에스라가 들려 올라가기 전, 에스라의 기도의 말씀의 시작[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “내 말들을 이해하십시오.”
    reason: alternative_reading
  - marker: b
    text: 이 마지막 문구는 구성적 또는 필사적 전환 표제로 기능하는 것으로 보입니다. 여기서 사용하는 라틴어 증인에 있으므로 본문에 보존합니다.
    reason: compositional_layer
lexical_decisions:
- source_word: audi meam uocem
  english_pob_choice: hear my voice
  chosen_korean: 내 음성을 들으시고
  alternatives_korean:
  - 내 목소리를 들으시고
  - 내 소리를 들으시고
  lexicon: audiō / vox
  rationale: audiō는 단순히 '듣다'보다 응답을 요구하는 청취를 포함할 수 있어, 공손한 명령형으로 '들으십시오'를 택했고, vox는 문맥상 '음성'이 더 직접적입니다.
- source_word: intellege sermonum meorum
  english_pob_choice: understand my words
  chosen_korean: 내 말들을 깨달으십시오
  alternatives_korean:
  - 내 말씀을 이해하십시오
  - 내 말을 알아들으십시오
  lexicon: intellēgō / sermō
  rationale: sermonum meorum은 '말들/발화들'의 복수 뉘앙스를 살려 '말들을'로 옮겼고, 단순 이해보다 의미를 파악하는 '깨닫다'가 더 가깝습니다.
- source_word: Initium uerborum orationis Ezrae
  english_pob_choice: The beginning of the words of Ezra’s prayer
  chosen_korean: 에스라의 기도 말씀의 시작
  alternatives_korean:
  - 에스라의 기도의 말씀들의 시작
  - 에스라 기도의 말 시작
  lexicon: initium / uerba / oratio
  rationale: Latin 원문은 서술문이 아니라 제목형 무동사 절이므로 '시작'을 앞세워 삽입적 표제의 성격을 살렸고, orationis는 '기도'로, uerborum은 '말씀'으로 옮겼습니다.
- source_word: priusquam adsumeretur
  english_pob_choice: before he was taken up
  chosen_korean: 그가 들려 올라가기 전입니다
  alternatives_korean:
  - 그가 취해지기 전입니다
  - 그가 데려가심을 받기 전입니다
  lexicon: priusquam / adsumō
  rationale: adsumeretur는 수동적 '취해지다/들려 올라가다'를 뜻하므로, 외경적·성경적 울림을 살리되 해석을 과장하지 않는 '들려 올라가기 전'을 택했습니다.
theological_decisions:
- issue: 마지막 절구의 문법과 기능
  chosen_reading: 본문 뒤의 '에스라의 기도 말씀의 시작…'은 서술이 아니라 필사적·구성적 표제처럼 보이므로, 한국어에서도 독립 문장으로 옮기되 '—'로 앞절과 구분했습니다.
  alternative_readings:
  - 완전한 서술문으로 이어 읽기
  - 주석으로만 처리하기
  rationale: 영어 POB 주석이 지적하듯 이 절구는 구성층의 삽입에 가깝기 때문에, 본문으로 유지하되 표제성/전환성도 드러내야 합니다.
  doctrine_reference: textual criticism / compositional layering
