source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit : domine qui inhabitas seculum, cuius oculi elati et superiora in aerem, Cuius thronus inextimabilis et gloria incon-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/020.yaml
  text: And he said[a], “Lord, you who inhabit eternity, whose eyes are exalted and whose heights are in the air,
  footnotes:
  - marker: a
    text: Or 'and look upon the heights in the air'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다[a], 「주님, 영원을 거하시는 분이시여, 눈이 높으시고 하늘의 높은 곳들이 있는 분이시여,」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘공중의 높은 곳들을 바라보시는’.
    reason: previous_rendering
lexical_decisions:
- source_word: domine qui inhabitas seculum
  english_pob_choice: Lord, you who inhabit eternity
  chosen_korean: “주님, 영원을 거하시는 분이시여”
  alternatives_korean:
  - “주님, 영원에 거하시는 분이시여”
  - “주님, 영원 속에 거하시는 분이시여”
  lexicon: domine / inhabitas / seculum
  rationale: seculum을 단순한 ‘세상’이 아니라 시간적 영속성의 영역으로 읽어, POB의 ‘inhabit eternity’를 살려 ‘영원을 거하시는’으로 옮겼습니다.
- source_word: cuius oculi elati
  english_pob_choice: whose eyes are exalted
  chosen_korean: “눈이 높으시고”
  alternatives_korean:
  - “눈이 높이 들리시고”
  - “눈이 높아지신”
  lexicon: cuius / oculi / elati
  rationale: elati를 문자적으로 ‘높다’로 옮기되, 눈의 위엄·초월성을 드러내는 한국어 관용을 택했습니다.
- source_word: superiora in aerem
  english_pob_choice: whose heights are in the air
  chosen_korean: “하늘의 높은 곳들이 있는 분이시여”
  alternatives_korean:
  - “공중의 높은 곳들이 있는 분이시여”
  - “공중에 있는 높은 곳들이 있는 분이시여”
  lexicon: superiora / in aerem
  rationale: 수정된 POB가 ‘look upon’이 아니라 상부 공간/거처를 가리킨다고 본 점을 따라, 하나님께 속한 초월적 ‘높은 곳들’을 한국어로 자연스럽게 유지했습니다.
theological_decisions:
- issue: 하나님의 거처를 묘사하는 우주적 언어의 처리
  chosen_reading: ‘영원을 거하시는 분’과 ‘하늘의 높은 곳들’로, 하나님의 초월성과 거처 이미지를 함께 살렸습니다.
  alternative_readings:
  - ‘영원을 사시는 분’
  - ‘공중의 높은 곳들을 바라보시는 분’
  rationale: 라틴어는 거처와 공간을 말하며 시선 동사로 바꾸지 않으므로, 하나님의 거주와 우주적 높이를 직접적으로 보존하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 시편 104:3, 아모스 9:6의 하늘 궁전 이미지와 조응하는 초월적 왕권 표현
