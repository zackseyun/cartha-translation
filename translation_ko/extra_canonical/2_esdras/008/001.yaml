id: 2ES.8.1
reference: 2 Esdras 8:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: hoc saeculum fecit altissimus propter multos, futurum autem propter paucos.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/001.yaml
  text: And he answered me and said[a], “The Most High made this age for many, but the age to come for few.”
  footnotes:
  - marker: a
    text: Or 'this present age'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분이 나에게 대답하여 말씀하셨습니다[a]. 「지극히 높으신 분은 이 시대를 많은 사람들을 위해 만드시고, 오는 시대는 적은 사람들을 위해 만드셨습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 시대’.
    reason: previous_rendering
lexical_decisions:
- source_word: hoc saeculum
  english_pob_choice: this age
  chosen_korean: 이 시대
  alternatives_korean:
  - 이 세상
  - 현 세대
  - 이 현재의 시대
  lexicon: saeculum
  rationale: 라틴어 hoc saeculum은 단순한 ‘세상’보다 시간적-역사적 구분인 ‘이 시대’를 더 직접적으로 드러내므로, 영어 POB의 this age를 따라 ‘이 시대’로 옮겼습니다.
- source_word: altissimus
  english_pob_choice: The Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  lexicon: altissimus
  rationale: 직함적 표현을 살리되 한국어에서 자연스럽고 경외적인 호칭으로 ‘지극히 높으신 분’을 택했습니다. 본문에 직접 ‘하나님’을 보태지 않아 원문의 호칭성을 유지했습니다.
- source_word: propter multos / propter paucos
  english_pob_choice: for many / for few
  chosen_korean: 많은 사람들을 위해 / 적은 사람들을 위해
  alternatives_korean:
  - 많은 이들을 위하여 / 소수의 사람들을 위하여
  - 많은 자들을 위해 / 적은 자들을 위해
  lexicon: propter
  rationale: propter는 목적·대상 모두를 포괄할 수 있으나, 여기서는 POB의 for many / for few를 따라 수혜 대상을 나타내는 ‘-을 위해’로 자연스럽게 옮겼습니다.
- source_word: futurum
  english_pob_choice: the age to come
  chosen_korean: 오는 시대
  alternatives_korean:
  - 다가올 시대
  - 장차 올 시대
  - 오는 세상
  lexicon: futurum
  rationale: 앞 구절의 hoc saeculum과 대조되는 미래의 시대를 살리기 위해 ‘오는 시대’로 대응시켰습니다. 이렇게 하면 영어 POB가 유지한 this age / the age to come의 대비도 반영됩니다.
theological_decisions:
- issue: 이 시대와 오는 시대의 대조
  chosen_reading: 현 역사 안의 ‘이 시대’와 그 뒤를 잇는 ‘오는 시대’를 대비하는 종말론적 구분으로 읽었습니다.
  alternative_readings:
  - 단순한 현재/미래의 시간 구분
  - 윤리적 삶의 시기 구분
  rationale: 라틴어 saeculum의 반복 대조와 영어 POB의 this age / the age to come는 단순 시간표현보다 구원사적 시대 구분을 지시합니다.
  doctrine_reference: 종말론적 시대구분
