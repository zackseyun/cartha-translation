  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: peregrinationis quoque et saluationis et mercedis receptionis. Quomodo ergo locutus sum, sic et est. Sicut enim agricola
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/039.yaml
  text: but I will rejoice over the formation of the righteous[a], and over their pilgrimage also, and their salvation, and the reception of their reward.
  footnotes:
  - marker: a
    text: Or 'over pilgrimage also, and salvation, and the receiving of reward'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는 의인들의 형성[a]과 그들의 나그네 됨, 그들의 구원, 그리고 그들의 상급의 받음을 기뻐하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들의 나그네 됨 또한, 그들의 구원, 그리고 상급을 받음’.
    reason: alternative_reading
lexical_decisions:
- source_word: plasma iustorum
  english_pob_choice: the formation of the righteous
  chosen_korean: 의인들의 형성
  alternatives_korean:
  - 의인들의 빚음
  - 의인들의 창조
  - 의인들의 형성됨
  lexicon: plasma
  rationale: 라틴어 plasma는 단순한 ‘창조’보다 ‘빚어 만듦/형성’의 뉘앙스를 가지므로, 의인들을 하나님이 빚어 내시는 결과를 살려 ‘형성’으로 옮겼습니다.
- source_word: peregrinationis
  english_pob_choice: their pilgrimage also
  chosen_korean: 그들의 나그네 됨
  alternatives_korean:
  - 그들의 순례 또한
  - 그들의 나그네 생활 또한
  - 그들의 여행 또한
  lexicon: peregrinatio
  rationale: 문맥상 단순 여행이 아니라 이 세상에서의 나그네 같은 삶을 가리키므로, 교회적 관용어인 ‘순례’보다 본뜻을 더 직접적으로 드러내는 ‘나그네 됨’을 택했습니다.
- source_word: mercedis receptionis
  english_pob_choice: the reception of their reward
  chosen_korean: 그들의 상급의 받음
  alternatives_korean:
  - 그들의 상급의 수령
  - 그들의 보상의 수납
  - 그들의 상급을 받는 일
  lexicon: merces / receptio
  rationale: 수동적으로 ‘받음’이라는 동작을 드러내어, 상급이 은혜롭게 수여되는 성격을 유지하면서도 한국어에서 어색한 명사구를 피했습니다.
theological_decisions:
- issue: 의인들의 구원과 상급을 하나님이 기뻐하신다는 진술의 초점
  chosen_reading: 하나님은 의인들의 현재적 나그네 됨과 최종적 구원을 함께 보시며 기뻐하십니다.
  alternative_readings:
  - 의인들의 영적 여정 전체를 기뻐하신다는 보다 추상적인 읽기
  - 구원과 상급만을 분리해 강조하는 읽기
  rationale: 라틴어의 연속된 속격들은 의인들을 가리키는 한 묶음의 소유적 관계를 이루므로, 개별 명사들을 추상화하지 않고 의인들의 삶 전체와 결말을 함께 보이도록 번역했습니다.
  doctrine_reference: 섭리와 최종 보상
- issue: ‘나그네 됨’과 전통적 ‘순례’의 선택
  chosen_reading: 여기서는 종교적 순례 개념보다 이 세상에서의 소외된 체류 상태를 강조하는 ‘나그네 됨’으로 옮겼습니다.
  alternative_readings:
  - ‘순례’로 옮겨 경건한 종교행위처럼 읽히게 하는 번역
  - ‘여행’으로 옮겨 일반 이동으로 완화하는 번역
  rationale: peregrinatio는 이 문맥에서 경건 행위보다 타향살이/나그네 삶의 실존을 뜻하므로, 의미를 약화시키지 않는 방향을 선택했습니다.
  doctrine_reference: 종말론적 소망과 현재의 나그네 삶
