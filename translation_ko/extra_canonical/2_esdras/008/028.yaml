  text: 그러나 당신을 경외하기를 자원하여 인정한 이들을 기억해 주십시오. 가축의 습성을 지닌 자들을 멸하시려 하지 마시고, 당신의 율법을 지키는 이들을 살펴 주십시오.[a]
