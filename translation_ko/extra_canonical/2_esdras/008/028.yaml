theological_decisions:
- issue: tuum timorem의 신학적 뉘앙스
  chosen_reading: ‘당신을 경외하기를’로 풀어, 단순한 공포가 아니라 하나님을 향한 경외와 순종의 응답을 드러냈습니다.
