theological_decisions:
- issue: tuum timorem의 신학적 뉘앙스
  chosen_reading: ‘당신을 경외하기를’로 풀어, 단순한 공포가 아니라 하나님을 향한 경외와 순종의 응답을 드러냈습니다.
  alternative_readings:
  - 당신의 두려움을
  - 당신에 대한 두려움을
  rationale: 본문의 timor는 하나님 앞의 경외를 가리키며, 문맥상 긍정적으로 인정된 태도이므로 한국어에서도 종교적 의미가 살아야 합니다.
  doctrine_reference: 경외와 순종의 언약적 관계
