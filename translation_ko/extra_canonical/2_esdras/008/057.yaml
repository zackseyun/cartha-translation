lexical_decisions:
- source_word: contempserunt
  english_pob_choice: they despised
  chosen_korean: 그들은 … 멸시하고
  alternatives_korean:
  - 그들은 … 업신여기고
  - 그들은 … 경멸하고
  lexicon: contemno
  rationale: 라틴어 contempserunt는 ‘경멸하다/멸시하다’의 강한 거절을 뜻하므로, 문맥의 도덕적 반감을 살리기 위해 ‘멸시하다’를 택했습니다.
- source_word: vias eius
  english_pob_choice: his ways
  chosen_korean: 그의 길을
  alternatives_korean:
  - 그의 방식들을
  - 그의 길들
  lexicon: via
  rationale: viarum/viam 계열은 단순한 ‘방법’보다 삶의 행로·행동 방식을 가리키므로, 히브리적 표현 감각을 살려 ‘길’을 유지했습니다.
- source_word: dereliquerunt
  english_pob_choice: abandoned
  chosen_korean: 버렸습니다
  alternatives_korean:
  - 떠났습니다
  - 저버렸습니다
  lexicon: derelinquo
  rationale: derelinquere는 단순한 이탈보다 관계적·윤리적 ‘버림’의 뉘앙스가 있어, 병렬 동사로 자연스럽고 직접적인 ‘버리다’를 선택했습니다.
- source_word: Adhuc autem et
  english_pob_choice: Moreover, they also
  chosen_korean: 그런데도 그들은 또한
  alternatives_korean:
  - 또한 그들은
  - 더구나 그들도
  lexicon: adhuc / autem / et
  rationale: 이 절은 다음 문장으로 이어지는 미완성 연결구이므로, 완결된 의미를 덧씌우지 않고 접속적 연결감만 살리는 ‘그런데도 … 또한’으로 옮겼습니다.
theological_decisions:
- issue: 라틴어 단편이 문장 미완결로 끝나는 처리
  chosen_reading: 현재 절은 다음 구절로 이어지는 미완성 연결문으로 두고, 한국어도 결말을 만들지 않았습니다.
  alternative_readings:
  - 문장을 보완해 완결된 번역문처럼 처리
  - 의미를 추정해 다음 절의 내용을 앞당겨 넣기
  rationale: source.text 자체가 'Adhuc autem et'에서 끊기므로, 추정 보완은 원문 범위를 넘습니다. 독자가 단편성 자체를 인지하도록 두는 것이 본문 충실성에 맞습니다.
  doctrine_reference: source criticism / textual fidelity
