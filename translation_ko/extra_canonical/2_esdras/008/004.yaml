    issue: absorbe의 음식 은유가 ‘받아들이다’로 약화됨
    rationale: absorbe는 ‘삼키다, 들이마시다’의 강한 섭취 동사이며, 이어지는 deuoret와 함께 의도적인 섭취 은유를 이룹니다.
  - severity: high
    issue: deuoret와 quod sapit의 문법·의미가 바뀜
    rationale: deuoret는 3인칭 접속법이고 quod sapit는 ‘지혜로운 것’에 해당합니다. 현문 ‘지혜를 삼키십시오’는 두 번째 절을 2인칭 명령으로 바꾸고 관계절을 추상명사로 대체합니다.
  - severity: low
    issue: 접속어 중복
    rationale: ergo 하나에 대해 ‘그러므로’와 ‘그러니’를 중복해 사용합니다.
