id: 2ES.8.4
reference: 2 Esdras 8:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: absorbe ergo anima sensum et deuoret quod sapit.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/004.yaml
  text: And I answered and said[a], “Therefore let the soul receive understanding, and let it devour wisdom.”
  footnotes:
  - marker: a
    text: Or 'Then let my soul swallow understanding, and let it devour wisdom.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 내가 대답하여 말하였습니다. 「그러니 영혼아, 이해를 받아들이고 지혜를 삼키십시오」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어의 anima는 문맥상 ‘영혼아’라는 직접 호명으로도, ‘영혼이’라는 주어로도 읽을 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: absorbe
  english_pob_choice: Therefore let the soul receive understanding
  chosen_korean: 이해를 받아들이고
  alternatives_korean:
  - 이해를 삼키고
  - 이해를 받아먹고
  lexicon: absorbe
  rationale: 라틴어는 문자적으로 ‘삼키다’이지만, 이 문맥에서는 지적 수용을 가리키므로 한국어에서는 의미를 살려 ‘받아들이다’로 옮겼습니다.
- source_word: anima
  english_pob_choice: the soul
  chosen_korean: 영혼아
  alternatives_korean:
  - 혼아
  - 마음아
  - 영혼이
  lexicon: anima
  rationale: 호격처럼 직접 부르는 형식으로 읽히므로 ‘영혼아’로 처리해 화자의 자기호출적 어조를 드러냈습니다.
- source_word: deuoret
  english_pob_choice: let it devour wisdom
  chosen_korean: 지혜를 삼키고
  alternatives_korean:
  - 지혜를 먹고
  - 지혜를 받아들이고
  lexicon: deuoret
  rationale: 동사의 식사 은유를 유지하기 위해 ‘삼키다’를 살렸고, 뒤의 내용물도 추상명사 ‘지혜’로 자연스럽게 옮겼습니다.
- source_word: quod sapit
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지혜로운 것
  - 지혜로운 바
  - 지혜를 내는 것
  lexicon: sapit
  rationale: 직역하면 ‘지혜로운 것/지혜로운 것(what is wise)’에 가깝지만, POB의 최신 판정처럼 한국어에서는 문맥상 핵심 명사인 ‘지혜’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: anima를 호격으로 볼지 주어로 볼지
  chosen_reading: 직접 호명되는 ‘영혼아’로 반영했습니다.
  alternative_readings:
  - ‘그러므로 영혼이 이해를 받아들이고…’처럼 주어로 처리
  - ‘내 영혼아’로 자기지시화
  rationale: 라틴어의 형태는 해석상 모호하지만, 기존 영어 판정이 호격 가능성을 열어두고 있고, 문맥상 수사적 자기훈계의 힘을 보존하려면 직접 호명이 가장 잘 드러납니다.
  doctrine_reference: 본문의 화자 내부 독백/자기훈계 표현
