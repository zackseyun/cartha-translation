  to: 내가 대답하여 말하였습니다. 「그러므로 영혼아, 이해를 삼키고, 지혜로운 것을 삼키게 하십시오」[a]
  rationale: 직접 호명과 첫 명령을 보존하고, 두 번째 동사의 3인칭 접속법 및 quod sapit의 관계절 의미를 반영했습니다. ‘삼키다’를 두 절에 유지하여 원문의 의도적인 섭취 은유를 살렸습니다.
