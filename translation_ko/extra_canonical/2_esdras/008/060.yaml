  - severity: medium
    issue: 원문 끝의 미완 구절 ‘Quod non’이 본문에서 빠졌습니다.
    rationale: 제공된 라틴어는 다음 절로 이어지는 ‘Quod non’에서 끊깁니다. 번역도 ‘내가 …하지 않은’처럼 미완성을 명시하여, 본문 범위를 충실히 반영해야 합니다.
  - severity: low
