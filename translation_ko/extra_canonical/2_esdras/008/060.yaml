id: 2ES.8.60
reference: 2 Esdras 8:60
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'qui fecit eos et ingrati fuerunt ei qui praeparauit eis uitam. Quapropter iudicium meum modo adpropinquat : Quod non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/060.yaml
  text: who made them[a], and they were ungrateful to him who prepared life for them. Therefore my judgment now draws near[b], which I have not
  footnotes:
  - marker: a
    text: The line 'there is no God' is framed as the inner speech of the wicked. The Latin intensifies culpability by adding that they know they will die.
    reason: cross_reference
    anchor_ref: 8:60
  - marker: b
    text: Or 'and said in their hearts that there is no God—even though, knowing, they know that they will die. For just as the things foretold will receive you, so thirst and torment are prepared for them. For the Most High did not will that man should be destroyed,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 그들을 만드셨으나, 그들은 그들에게 생명을 마련해 주신 분께 감사하지 않았습니다. 그러므로 이제 나의 심판이 가까이 다가왔습니다. 내가 …하지 않은 것은
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: qui fecit eos
  english_pob_choice: who made them
  chosen_korean: 그들을 만드신 분께서
  alternatives_korean:
  - 그들을 지으신 분께서
  - 그들을 창조하신 분께서
  lexicon: fecit
  rationale: 라틴어 fecit는 단순한 ‘만들다’이므로, 신학적 색채를 과도하게 늘리지 않으면서도 주어를 명확히 드러내는 ‘만드신 분’으로 옮겼습니다.
- source_word: ingrati fuerunt ei
  english_pob_choice: they were ungrateful to him
  chosen_korean: 그들은 감사하지 않았습니다
  alternatives_korean:
  - 그에게 배은망덕했습니다
  - 그분께 불감사했습니다
  lexicon: ingrati fuerunt
  rationale: ingrati는 기본적으로 ‘감사하지 않다/배은망덕하다’의 의미이므로, 현대 한국어에서 자연스럽고 직접적인 ‘감사하지 않았습니다’로 처리했습니다.
- source_word: qui praeparauit eis uitam
  english_pob_choice: who prepared life for them
  chosen_korean: 그들에게 생명을 마련해 주신 분께
  alternatives_korean:
  - 그들에게 생명을 준비해 주신 분께
  - 그들을 위해 생명을 예비해 주신 분께
  lexicon: praeparauit ... vitam
  rationale: praeparare는 ‘미리 마련하다/준비하다’의 뜻이지만, 한국어에서는 ‘생명을 마련해 주시다’가 가장 직접적이고 자연스럽습니다.
- source_word: Quapropter iudicium meum modo adpropinquat
  english_pob_choice: Therefore my judgment now draws near
  chosen_korean: 그러므로 이제 나의 심판이 다가오고 있습니다
  alternatives_korean:
  - 그러므로 내 심판이 이제 가까워집니다
  - 그러므로 나의 판결이 지금 다가옵니다
  lexicon: iudicium
  rationale: iudicium은 여기서 단순한 ‘판단’보다 종말론적 ‘심판’이 더 적절하며, 동사의 진행감은 ‘다가오고 있습니다’로 살렸습니다.
theological_decisions:
- issue: 하나님의 행위와 인간의 책임을 함께 유지하는 표현
  chosen_reading: ‘그들을 만드신 분’과 ‘생명을 마련해 주신 분’에 대한 인간의 무감사함을 병치해, 창조와 생명 부여를 근거로 한 책임을 분명히 드러냈습니다.
  alternative_readings:
  - ‘그들을 창조하신 분’으로 더 강한 창조 신학을 드러내는 읽기
  - ‘그들에게 생명을 예비해 주신 분’으로 더 문어적인 읽기
  rationale: 본문은 창조와 생명 제공을 동시에 제시하므로, 둘을 약화시키지 않으면서도 한국어 문장 흐름이 자연스럽도록 번역했습니다.
  doctrine_reference: 창조주 하나님과 인간의 응답 책임
- issue: ‘my judgment’의 종말론적 무게
  chosen_reading: ‘나의 심판’으로 번역해, 단순한 의견이 아니라 임박한 신적 재판이라는 무게를 유지했습니다.
  alternative_readings:
  - ‘나의 판결’
  - ‘나의 판단’
  rationale: 문맥상 화자의 개인적 판단이 아니라 곧 닥칠 신적 심판을 가리키므로, 교리적으로도 ‘심판’이 가장 적절합니다.
  doctrine_reference: 종말론적 심판
