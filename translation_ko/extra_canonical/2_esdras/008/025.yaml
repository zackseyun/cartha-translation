review_pass:
  verdict: revise
  source_fidelity: 라틴어의 대조 구문(Ne aspicias ... sed [aspicias] ...)과 완료형 seruierunt의 뜻은 초안에 대체로 반영되어 있습니다. 그러나 in veritate는 여기서 ‘진리 안에서’보다 ‘진실하게/진실로’가 자연스럽고 문맥상 더 직접적입니다.
  naturalness: ‘오직 ... 이들을 보소서’도 이해되지만, sed의 대조를 ‘... 보지 마시고, ... 보소서’로 바로 드러내는 편이 더 자연스럽습니다. ‘진리 안에서’는 한국어 기도문 문맥에서 다소 경직되고 신학적으로 특정화되어 들릴 수 있습니다.
  terminology: delicta는 ‘허물’로 옮기면 공적·성서적 문체를 유지하면서도 자연스럽습니다. 원문의 줄바꿈에 따른 serui-는 본문 자체의 의미상 미완성이 아니므로, 이를 설명하는 각주는 부정확하며 불필요합니다.
  issues:
  - severity: medium
    issue: in veritate를 ‘진리 안에서’로 번역함
    rationale: 라틴어 in veritate는 이 문맥에서 섬김의 태도·성실성을 나타내므로 ‘진실하게’가 더 자연스럽고 의미를 불필요하게 특정화하지 않습니다.
  - severity: medium
    issue: 각주가 원문이 문장 중간에서 끊겨 전해진다고 설명함
    rationale: 제시된 serui-는 편집상 행말 하이픈으로, seruierunt로 완결되는 낱말입니다. 이는 본문 전승의 의미상 결손을 뜻하지 않으므로 해당 각주는 독자를 오도할 수 있습니다.
  revised_text: 당신 백성의 허물을 보지 마시고, 진실하게 당신을 섬긴 이들을 보소서.
