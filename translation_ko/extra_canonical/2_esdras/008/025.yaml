translation:
  language: ko
  text: 당신 백성의 허물을 보지 마시고, 진실하게 당신을 섬긴 이들을 보소서.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ne aspicias
  english_pob_choice: Do not look upon
  chosen_korean: 보지 마시고
  alternatives_korean:
  - 살피지 마시고
  - 눈여겨보지 마시고
  lexicon: aspicio
  rationale: 부정 명령의 핵심을 ‘보다’로 간결하게 살리되, 하나님께 드리는 직접 호소이므로 존대형 명령을 사용했습니다.
- source_word: delicta
  english_pob_choice: the offenses
  chosen_korean: 죄과
  alternatives_korean:
  - 허물
  - 범죄
  lexicon: delictum
  rationale: 단순한 일반적 죄보다 ‘잘못 저지른 행위의 책임’이 드러나도록 ‘죄과’를 택했습니다.
- source_word: serui- / seruierunt
  english_pob_choice: those who have served you in truth
  chosen_korean: 진리 안에서 당신을 섬긴 이들
  alternatives_korean:
  - 진리로 당신을 섬긴 이들
  - 진실로 당신을 섬긴 이들
  lexicon: servio
  rationale: 완성형이 문장 경계에서 분절되어 있으므로, 현재완료적 의미의 결과를 살려 ‘섬긴 이들’로 자연스럽게 옮겼습니다. 또한 in veritate는 ‘진리 안에서’로 처리해 관계의 범위를 분명히 했습니다.
theological_decisions:
- issue: 하나님께 대한 간구의 호칭과 종결 어미
  chosen_reading: 직접 호소로 이해하여 ‘보소서’ 같은 존대 명령을 사용했습니다.
  alternative_readings:
  - 보십시오
  - 살펴주십시오
  rationale: 본문은 하나님께 드리는 간청이므로 현대 합쇼체 안에서도 경외와 간구의 뉘앙스를 유지하는 표현이 적절합니다.
  doctrine_reference: 예배적 기도문에서의 공손한 직청법
