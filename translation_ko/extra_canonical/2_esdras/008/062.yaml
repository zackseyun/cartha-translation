  lexicon: 표준 서술 동사
  rationale: 라틴어의 응답-발화 순서를 자연스러운 한국어로 옮기되, 본문이 시작되는 발화 행위를 분명히 드러냈습니다.
- source_word: Ecce nunc
  english_pob_choice: See now
  chosen_korean: 보십시오
  alternatives_korean:
  - 보소서
  - 지금 보십시오
  lexicon: 감탄/호소 표현
  rationale: 직접 호소하는 표현으로서 문맥상 ‘보십시오’가 가장 자연스럽고, 합쇼체 본문과도 맞습니다.
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: κύριος/호칭 대응
  rationale: 기도적·직접 호칭이므로 한국어 기독교 용례에 맞는 ‘주님’을 사용했습니다.
- source_word: demonstrasti mihi multi-
  english_pob_choice: you have shown me many
  chosen_korean: 주님께서는 제게 많은 것을 보여 주셨습니다
  alternatives_korean:
  - 주님께서는 제게 많은 것들을 보여 주셨습니다
  - 주님께서는 제게 많이 보여 주셨습니다
  lexicon: demonstrare / multi-
  rationale: 라틴어 demonstrasti mihi와 multi-를 합쳐 ‘많은 것을 보여 주셨습니다’로 옮겨, verse 경계상 끊긴 의미를 한국어에서 자연스럽게 완결했습니다.
theological_decisions:
- issue: 직접 호소가 들어간 대화체의 높임말 수준
  chosen_reading: 화자 자신의 진술과 하나님께 대한 직접 호칭은 합쇼체로 유지하되, 인용문 안의 호칭은 ‘주님’으로 통일했습니다.
  alternative_readings:
  - ‘보소서, 주여’와 같은 더 전통적인 기도체
  - 반말형 직접 발화
  rationale: 본문은 회중용 번역으로서 읽기 쉬운 현대 문체가 적절하되, 신에게 드리는 직접 호소라는 성격을 잃지 않도록 했습니다.
  doctrine_reference: 공적 낭독을 위한 경건한 현대 한국어 문체
