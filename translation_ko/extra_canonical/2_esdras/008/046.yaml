  text: And he answered me and said[a], “What is present is for the present, and what is future is for the future.
  footnotes:
  - marker: a
    text: Or 'What belongs to the present is for the present, and what belongs to the future is for the future.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하며 말했습니다[a]. 「현재에 속한 것들은 현재에 속한 이들을 위한 것이고, 장래에 속한 것들은 장래에 속한 이들을 위한 것입니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘현재의 것들은 현재에 있는 이들을 위한 것이고, 장래의 것들은 장래에 있을 이들을 위한 것이다.’
    reason: 라틴어 ‘현재의/장래의’와 복수 여격 ‘현재에 있는 이들에게/장래에 있을 이들에게’의 병렬을 다른 자연스러운 한국어 표현으로 제시합니다.
lexical_decisions:
- source_word: quae sunt praesentia praesentibus
  english_pob_choice: What is present is for the present
  chosen_korean: 현재의 것은 현재를 위한 것이다
  alternatives_korean:
  - 현재에 속한 것은 현재에 속한 사람들을 위한 것이다
  - 현재의 것은 현재에 있는 이들을 위한 것이다
  lexicon: praesens / praesentia; praesentibus (dative plural)
  rationale: 라틴어 dative plural을 단순한 시간 추상어로만 두지 않고, ‘현재에 속한 것’과 ‘현재를 사는 이들’의 대응이 드러나도록 한국어에서는 자연스러운 요약형으로 옮겼습니다.
- source_word: quae futura futuris
  english_pob_choice: what is future is for the future
  chosen_korean: 장래의 것은 장래를 위한 것이다
  alternatives_korean:
  - 장래에 속한 것은 장래에 속한 이들을 위한 것이다
  - 미래의 것은 미래를 위한 것이다
  lexicon: futurus / futuris (dative plural)
  rationale: 앞절과 같은 병렬을 살리되, 현대 한국어에서 가장 읽기 자연스러운 ‘장래’로 대응시켜 미래 시대와 그 시대에 속한 이들을 함께 암시하도록 했습니다.
- source_word: et respondit ad me et dixit
  english_pob_choice: And he answered me and said
  chosen_korean: 그가 내게 대답하며 말했습니다
  alternatives_korean:
  - 그가 내게 응답하며 말했습니다
  - 그가 내게 대답하고 말했습니다
  lexicon: respondere; dicere
  rationale: 반복 접속을 한국어에서는 매끄럽게 합쳐 ‘대답하며 말했습니다’로 처리해, 두 동작의 연속성을 유지하면서도 문장을 과도하게 늘리지 않았습니다.
theological_decisions:
- issue: 현재와 장래의 대비가 시간 자체인지, 그 시대에 속한 사람들인지
  chosen_reading: 본문의 라틴어 복수 여격을 반영해, 현재와 장래를 각각 그 시대에 속한 주체들과 연결되는 대비로 읽되 한국어 본문은 더 간결한 병렬로 제시했습니다.
  alternative_readings:
  - 단순히 시간 구간(현재/미래)에 관한 진술로 읽는 방식
  rationale: 유권 판정은 사람-시대 대비를 지지하지만, 본문이 말하는 핵심은 ‘현재/장래의 질서가 서로 구분된다’는 점이므로 한국어 본문에서는 과잉 해설을 피하고 의미만 보존했습니다.
  doctrine_reference: 종말론적 질서의 구분
