  yaml_path: translation/extra_canonical/2_esdras/008/034.yaml
  text: For what is man, that you should be angry with him, or a corruptible race, that you should be so embittered against it?
translation:
  language: ko
  text: 사람이 무엇이기에 주께서 그에게 분노하십니까? 또는 썩어질 족속이 무엇이기에 주께서 그 족속을 두고 그토록 쓰라린 마음을 품으십니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quid est enim homo
  english_pob_choice: For what is man
  chosen_korean: 사람이 무엇이기에
  alternatives_korean:
  - 사람이 무엇입니까
  - 사람이 무엇이기에야
  lexicon: quid est enim homo
  rationale: 라틴어 수사 의문문을 자연스러운 한국어 수사 구조로 옮기되, 인간의 미미함을 강조하는 감탄적 뉘앙스를 살렸습니다.
- source_word: ut ei indigneris
  english_pob_choice: that you should be angry with him
  chosen_korean: 주께서 그에게 분노하셔야 합니까
  alternatives_korean:
  - 주께서 그에게 노하셔야 합니까
  - 주께서 그에게 진노하셔야 합니까
  lexicon: indigneris
  rationale: indignari의 분노/격분 의미를 반영하면서도, 하나님의 격한 감정을 나타내는 본문 흐름에 맞게 ‘분노하시다’로 옮겼습니다.
- source_word: genus corruptibile
  english_pob_choice: a corruptible race
  chosen_korean: 썩어질 족속
  alternatives_korean:
  - 썩어질 인류
  - 부패할 수밖에 없는 족속
  lexicon: genus corruptibile
  rationale: genus를 단순히 ‘사람’으로 좁히기보다 집단적 인류를 가리키는 ‘족속’으로 옮겨, corruptibile의 부패·소멸 가능성을 ‘썩어질’로 압축했습니다.
- source_word: amariceris de ipso
  english_pob_choice: you should be so embittered against it
  chosen_korean: 그들에게 그토록 쓰디쓰게 여기셔야 합니까
  alternatives_korean:
  - 그들에게 그토록 쓰라리셔야 합니까
  - 그들에게 그토록 마음이 상하셔야 합니까
  lexicon: amariceris
  rationale: amara- 계열의 ‘쓰다/쓴맛 나다’가 단순한 감정 기복보다 ‘쓰디쓰게 여김, 깊은 비통함’에 가깝다고 보고, 한국어에서 그 정서를 살릴 수 있는 표현을 택했습니다.
theological_decisions:
- issue: 하나님께 귀속되는 정서 표현
  chosen_reading: 하나님이 인간에 대해 분노하고 쓰디쓰게 여기시는 진술을 직접적으로 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘노하십니까’로 낮추기
  - ‘마음이 상하십니까’처럼 정서 강도를 약화하기
  rationale: 본문은 하나님의 인간에 대한 심판적 정서와 비통함을 병치하므로, 전통적 경건어로 완화하지 않고 원문의 긴장을 보존하는 것이 타당합니다.
  doctrine_reference: 신정론 및 하나님의 심판/긍휼의 긴장
