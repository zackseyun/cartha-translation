lexical_decisions:
- source_word: prehensibilis
  english_pob_choice: incomprehensible
  chosen_korean: 헤아릴 수 없으시며
  alternatives_korean:
  - 이해할 수 없으시며
  - 측량할 수 없으시며
  lexicon: prehensibilis
  rationale: 라틴어는 ‘붙잡히다/파악되다’의 가능을 부정하므로, 하나님의 본질을 직접 겨냥하는 ‘헤아릴 수 없으시며’가 POB의 incomprehensible을 가장 자연스럽게 옮깁니다.
- source_word: cui adstat exercitus angelorum cum tremore
  english_pob_choice: before whom the host of angels stands with trembling
  chosen_korean: 천사들의 군대가 떨며 그 앞에 서 있는 분
  alternatives_korean:
  - 떨며 서 있는 천사들의 군대가 있는 분
  - 두려움으로 천사들의 군대가 서 있는 분
  lexicon: exercitus angelorum / cum tremore
  rationale: exercitus angelorum은 ‘천사들의 군대’로, cum tremore는 인격적 떨림을 살려 ‘떨며’로 옮겼습니다.
- source_word: Quorum seruatio in uento et igni conuertitur
  english_pob_choice: whose preservation is turned into wind and fire
  chosen_korean: 그 보존이 바람과 불로 바뀌는 분
  alternatives_korean:
  - 그 보존이 바람과 불로 변하는 분
  - 그 지킴이 바람과 불로 바뀌는 분
  lexicon: seruatio / conuertitur
  rationale: seruatio는 단순한 ‘구원’보다 ‘보존/보전’이 더 직접적이어서 ‘보존’으로, conuertitur는 수동적 변화를 드러내는 ‘바뀌는’으로 처리했습니다.
- source_word: cuius uerbum
  english_pob_choice: whose word
  chosen_korean: 그분의 말씀은
  alternatives_korean:
  - 그분의 말은
  - 그분의 말씀은
  lexicon: uerbum
  rationale: uerbum은 신적 발화의 위상을 살려 일상적 ‘말’보다 ‘말씀’이 적합하며, 문맥상 다음 절로 이어질 미완결 구조를 그대로 드러냈습니다.
