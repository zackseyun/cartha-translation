translation:
  language: ko
  text: 지혜는 미리 완전하게 되었습니다. 뿌리는 당신들로 말미암아 인장이 찍혔고, 연약함은 당신들로 말미암아 사라졌으며, 죽음은 감추어졌습니다. 하데스는 도망하였고,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 영어 POB 각주는 이전 절의 다른 전승적 표현을 가리키는 교정용 주석이므로, 본문에는 두지 않았습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ante perfecta sapientia
  english_pob_choice: wisdom has been perfected beforehand
  chosen_korean: 지혜는 미리 완전하게 되었습니다
  alternatives_korean:
  - 지혜는 전에 완성되었습니다
  - 지혜는 미리 완성되었습니다
  lexicon: sapientia
  rationale: 라틴어의 ante와 perfecta를 함께 반영하여 ‘미리/전에’와 ‘완전하게 되었습니다’를 결합해, 완료된 상태와 선행성을 모두 드러냈습니다.
- source_word: Radix
  english_pob_choice: the root
  chosen_korean: 뿌리
  alternatives_korean:
  - 근원
  - 뿌리(근원)
  lexicon: radix
  rationale: 문맥상 식물 비유를 유지하는 직역이 가장 자연스러워 ‘뿌리’로 옮겼습니다.
- source_word: signata est a uobis
  english_pob_choice: has been sealed by you
  chosen_korean: 인장이 찍혔고
  alternatives_korean:
  - 봉인되었고
  - 당신들에 의해 봉인되었고
  lexicon: signo
  rationale: 라틴어 수동형의 핵심은 ‘봉인/인장됨’이지만, 한국어에서는 수동 결과를 간결하게 드러내기 위해 ‘인장이 찍혔고’로 처리했습니다.
- source_word: infirmitas extincta est
  english_pob_choice: weakness has been extinguished
  chosen_korean: 연약함은 사라졌으며
  alternatives_korean:
  - 연약함은 소멸되었으며
  - 무기력은 소멸되었으며
  lexicon: infirmitas
  rationale: infirmitas는 단순 질병보다 ‘연약함/약함’의 의미가 강하므로, POB의 의미를 살리면서 한국어 자연성을 위해 ‘사라졌으며’로 옮겼습니다.
theological_decisions:
- issue: a vobis의 행위 주체를 어떻게 드러낼지
  chosen_reading: ‘당신들로 말미암아’로 옮겨, 봉인과 약화의 제거가 수신자 편에서 이루어진 행위임을 보존했습니다.
  alternative_readings:
  - ‘당신들에 의해’
  - ‘당신들로부터’
  rationale: 라틴어 수동태의 행위자 표지 a vobis를 단순 방향어로 약화하지 않고, 행위 주체를 분명히 보이게 했습니다.
  doctrine_reference: 문맥상 종말론적 변형의 선언이며, 행위 주체를 흐리지 않는 번역 원칙
