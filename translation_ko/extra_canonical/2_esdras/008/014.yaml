translation:
  language: ko
  text: 그는 주님의 작품입니다. 그러므로 그토록 큰 수고를 들여 빚어진 이를 멸하신다면, 왜 그를 만드셨습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuum opus
  english_pob_choice: your work
  chosen_korean: 주님의 일입니다
  alternatives_korean:
  - 당신의 일입니다
  - 주님의 작품입니다
  lexicon: opus
  rationale: 문맥상 피조물 전체를 가리키는 ‘일/작품’이 자연스럽고, 2인칭 소유를 한국어에서는 주어를 보충해 ‘주님의 일’로 옮기는 것이 의미를 가장 분명하게 드러냅니다.
- source_word: Si ergo
  english_pob_choice: If therefore
  chosen_korean: 그러므로 … 하신다면
  alternatives_korean:
  - 그러니 … 하신다면
  - 만일 그러므로 … 하신다면
  lexicon: si
  rationale: 라틴어의 논증적 연결을 살려 ‘그러므로’로 앞절과의 인과를 표시하되, 한국어 문장 흐름은 조건절로 자연스럽게 유지했습니다.
- source_word: perdideris
  english_pob_choice: you destroy
  chosen_korean: 멸하신다면
  alternatives_korean:
  - 없애신다면
  - 파괴하신다면
  lexicon: perdere
  rationale: ‘destroy’의 단순 물리적 파괴보다, 창조된 존재를 없애는 강한 소멸의 뉘앙스를 살려 ‘멸하다’를 택했습니다.
- source_word: tantis laboribus plasmatus
  english_pob_choice: formed with such great labors
  chosen_korean: 그런 큰 수고로 지으신
  alternatives_korean:
  - 그처럼 큰 수고를 들여 빚으신
  - 그런 큰 노고로 형성된
  lexicon: plasmare
  rationale: plasmatus의 ‘빚다/지으시다’는 창조적 형성의 뜻을 담고, tantis laboribus는 실제 인력과 수고의 크기를 살려 ‘큰 수고’로 옮겼습니다.
theological_decisions:
- issue: rhetorical question about divine creation and destruction
  chosen_reading: 창조의 큰 수고와 파괴의 쉬움 사이의 대조를 하나님께 대한 수사적 질문으로 그대로 살렸습니다.
  alternative_readings:
  - 보다 설명적인 평서문으로 완화하는 번역
  - ‘쉽게’ 같은 수식어를 보충해 대조를 명시하는 번역
  rationale: 본문은 창조의 무게와 파괴의 가능성을 대조하며 항변하는 수사적 질문이므로, 그 긴장감을 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 창조-섭리의 긴장과 인간의 생명에 대한 하나님의 주권
