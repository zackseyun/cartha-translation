id: 2ES.8.17
reference: 2 Esdras 8:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter quod conturbor. Ideo incipiam orare coram te pro me et pro eis, quoniam uideo lapsos nostros qui inhabitamus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/008/017.yaml
  text: Because of this I am troubled. Therefore I will begin to pray before you for myself and for them[a], because I see the falls of us who inhabit the earth.
  footnotes:
  - marker: a
    text: Or 'the failings of us'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 때문에 제가 괴롭습니다. 그러므로 저 자신과 그들을 위해 당신 앞에서 기도하기 시작하겠습니다. 이는 땅에 사는 우리가 넘어져 있는 것을 제가 보기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅에 사는 우리의 넘어짐들을.”
    reason: lapsos nostros는 ‘넘어진 우리’라는 참여적 표현으로도, ‘우리의 넘어짐들’이라는 명사적 표현으로도 이해될 수 있어 그 해석 가능성을 보존합니다.
lexical_decisions:
- source_word: propter quod conturbor
  english_pob_choice: Because of this I am troubled.
  chosen_korean: 이로 인해 제가 괴롭습니다.
  alternatives_korean:
  - 이 때문에 제가 혼란스럽습니다.
  - 이 일로 인해 제가 마음이 뒤흔들립니다.
  lexicon: conturbor
  rationale: conturbor는 단순한 감정보다 내적 동요와 괴로움을 함께 드러내므로, 합쇼체에서 자연스럽고 압축적인 ‘괴롭습니다’로 옮겼습니다.
- source_word: pro me et pro eis
  english_pob_choice: for myself and for them
  chosen_korean: 제 자신과 그들을 위해
  alternatives_korean:
  - 저와 그들을 위해
  - 저 자신과 그들을 위해
  lexicon: pro
  rationale: pro의 중보적 ‘~을/를 위해’ 용법을 살려, 화자가 자신과 그들을 함께 포함해 기도하는 구조를 분명하게 했습니다.
- source_word: uideo lapsos nostros
  english_pob_choice: because I see the falls of us
  chosen_korean: 우리에게 일어난 넘어짐을 제가 보기 때문입니다
  alternatives_korean:
  - 우리의 넘어짐을 제가 보기 때문입니다
  - 우리의 타락을 제가 보기 때문입니다
  lexicon: lapsos
  rationale: lapsos는 단순한 ‘실수’보다 ‘넘어짐/쓰러짐’의 상태를 강하게 드러내므로, 도덕적 약화로 완화하지 않고 ‘넘어짐’으로 유지했습니다.
- source_word: qui inhabitamus
  english_pob_choice: who inhabit the earth
  chosen_korean: 땅에 사는 우리
  alternatives_korean:
  - 땅을 거주하는 우리
  - 이 땅에 사는 우리
  lexicon: inhabitamus
  rationale: inhabitamus를 ‘사는/거주하는’으로 평이하게 옮기되, 인간의 지상적 처지를 나타내는 문맥을 살리기 위해 ‘땅에 사는 우리’로 다듬었습니다.
theological_decisions:
- issue: lapsos nostros의 강도
  chosen_reading: 인류의 단순한 결함이 아니라 실제로 넘어져 있는 상태를 가리키는 탄식으로 읽습니다.
  alternative_readings:
  - 우리의 허물들
  - 우리의 실패들
  rationale: 4 Ezra의 애도 문맥에서 lapsos는 경미한 결점보다 인간의 붕괴와 추락을 더 잘 나타내므로, 그 긴장을 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 인간의 타락과 비참함에 대한 묵시적 탄식
