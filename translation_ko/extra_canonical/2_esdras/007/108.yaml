translation:
  language: ko
  text: 그리고 다윗은 파괴를 위하여, 솔로몬은 성별 가운데 있는 이들을 위하여.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: confractione
  english_pob_choice: destruction
  chosen_korean: 파괴
  alternatives_korean:
  - 멸망
  - 부서짐
  - 파멸
  lexicon: confractione
  rationale: 라틴어 confractione는 문자적으로 ‘부서짐/파괴’를 뜻하므로, POB의 최신 판단에 맞춰 추상화하지 않고 직접적인 ‘파괴’로 옮겼습니다.
- source_word: sanctificationem
  english_pob_choice: for those in sanctification
  chosen_korean: 거룩하게 됨에 있는 이들
  alternatives_korean:
  - 거룩하게 됨을 위한 사람들
  - 성별됨에 있는 이들
  - 성전 봉헌에 있는 이들
  lexicon: sanctificationem
  rationale: 본문의 sanctificationem을 해석적으로 ‘성전 봉헌’으로 풀지 않고, 라틴어의 표면 의미를 살려 ‘거룩하게 됨’으로 유지했습니다.
- source_word: qui
  english_pob_choice: those who
  chosen_korean: 이들
  alternatives_korean:
  - 사람들
  - 자들
  - 그들
  lexicon: qui
  rationale: POB의 ‘those’에 해당하는 관계절을 한국어에서는 자연스러운 지시적 표현 ‘이들’로 간결하게 옮겼습니다.
theological_decisions:
- issue: sanctificationem의 해석 범위
  chosen_reading: 본문은 ‘거룩하게 됨’이라는 표면 의미를 유지하고, 성전 봉헌으로의 해석 확장은 본문 밖에서만 고려합니다.
  alternative_readings:
  - 성전 봉헌에 있는 이들
  - 성소에 오는 이들
  rationale: 주어진 라틴 본문만으로는 특정 역사적 봉헌 사건을 본문에 삽입할 근거가 충분하지 않으므로, 해석을 좁히지 않고 원문 어휘를 보존했습니다.
  doctrine_reference: 본문-우선 원칙, 역사적 해석은 주석에서 검토
