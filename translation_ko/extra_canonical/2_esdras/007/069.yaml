id: 2ES.7.69
reference: 2 Esdras 7:69
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et si non essemus post mortem in iudicio uenientes, melius fortassis nobis uenisset.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/069.yaml
  text: And if after death we were not coming into judgment, perhaps it would have been better for us.”
translation:
  language: ko
  text: 그리고 죽음 뒤에 우리가 심판에 이르지 않는다면, 우리에게는 차라리 더 나았을 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 원문의 melius fortassis는 문자 그대로 ‘더 좋았을 것이다/더 나았을 것이다’라는 가정적 비교를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: post mortem
  english_pob_choice: after death
  chosen_korean: 죽음 뒤에
  alternatives_korean:
  - 죽은 뒤에
  - 사후에
  lexicon: post + mortem
  rationale: 라틴어의 시간적 선행 관계를 자연스러운 현대 한국어로 옮기되, 문맥상 죽음 이후의 상태를 분명하게 드러내기 위해 ‘죽음 뒤에’를 택했습니다.
- source_word: in iudicio uenientes
  english_pob_choice: coming into judgment
  chosen_korean: 심판에 이르지 않는다면
  alternatives_korean:
  - 심판에 들어가지 않는다면
  - 심판 앞으로 나아가지 않는다면
  lexicon: in + iudicium + venire
  rationale: 직역형 ‘심판으로 오다’보다, 최종 판결의 자리로 나아간다는 뜻을 자연스럽게 살려 ‘심판에 이르다’로 옮겼습니다.
- source_word: melius fortassis nobis uenisset
  english_pob_choice: perhaps it would have been better for us
  chosen_korean: 우리에게는 차라리 더 나았을 것입니다
  alternatives_korean:
  - 어쩌면 우리에게 더 좋았을 것입니다
  - 아마 우리에게 더 나았을 것입니다
  lexicon: melius fortassis nobis venisset
  rationale: fortassis의 불확실성을 ‘차라리’로, 비교급 melius를 ‘더 나았을 것입니다’로 반영해 문장의 반사적·가정적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 죽음 이후 심판의 전제 진술
  chosen_reading: 이 절은 죽음 뒤에 심판에 이르는 것을 전제로 하며, 그 전제가 없으면 현재의 고난보다 죽음이 오히려 나았을 수 있다는 한탄으로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 교훈으로 완화하는 읽기
  - 미래 심판의 실재를 약화시키는 읽기
  rationale: 라틴어는 가정법과 조건문으로 종말론적 심판의 실재를 전제하므로, 이를 약화하지 않고 직설적으로 옮기는 것이 본문의 힘을 보존합니다.
  doctrine_reference: 종말론/최후 심판
- issue: fortassis의 불확실성
  chosen_reading: ‘차라리’로 번역해 단정이 아닌 한탄과 추정을 드러냈습니다.
  alternative_readings:
  - ‘아마’로 중립화
  - ‘어쩌면’으로 약화
  rationale: 문맥상 화자의 절박한 비교 판단을 나타내므로, 추정과 정서가 함께 드러나는 표현이 더 적절합니다.
  doctrine_reference: 수사적 화법
