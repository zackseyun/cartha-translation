id: 2ES.7.139
reference: 2 Esdras 7:139
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et iudex, si non ignoverit his qui creati sunt verbo eius et deleverit multitudinem contemptionum, non fortassis derelinquenturinnumerabilem multitudinem nisi pauci valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/139.yaml
  text: And if the Judge did not forgive those who were created by his word and blot out the multitude of acts of contempt[b][a], perhaps only a very few would be left from an innumerable multitude.
  footnotes:
  - marker: a
    text: Or 'because if he did not forgive'.
    reason: previous_rendering
  - marker: b
    text: Or 'multitude of offenses'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 재판장이 그분의 말씀으로 지음 받은 이들을 용서하지 않고, 멸시의 무리를 지워 버리지 않으신다면, 헤아릴 수 없이 많은 무리 가운데서 겨우 아주 소수만 남게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “용서하지 않으신다면”
    reason: alternative_reading
  - marker: b
    text: 또는 “멸시의 무리”
    reason: lexical_alternative
lexical_decisions:
- source_word: iudex
  english_pob_choice: the Judge
  chosen_korean: 재판장
  alternatives_korean:
  - 심판자
  - 판사
  lexicon: iudex
  rationale: 법정적 이미지를 살리면서도 문맥의 판결권자를 자연스럽게 드러내기 위해 '재판장'으로 옮겼습니다.
- source_word: his qui creati sunt verbo eius
  english_pob_choice: those who were created by his word
  chosen_korean: 그분의 말씀으로 지음 받은 이들
  alternatives_korean:
  - 그의 말씀으로 창조된 이들
  - 그의 말씀으로 만들어진 자들
  lexicon: creati sunt / verbo eius
  rationale: 창조 행위를 단순한 제작보다 더 강하게 드러내는 '지음 받다'를 택해, 원문의 수동형과 신적 행위성을 살렸습니다.
- source_word: multitudinem contemptionum
  english_pob_choice: the multitude of acts of contempt
  chosen_korean: 멸시의 무리
  alternatives_korean:
  - 멸시의 행위들의 무더기
  - 경멸의 많은 죄
  lexicon: multitudinem contemptionum
  rationale: contemptio는 단순한 '잘못'보다 하나님을 향한 멸시·경멸의 뉘앙스가 강하므로, 그 성격을 드러내는 '멸시'를 유지했습니다.
- source_word: derelinquentur ... nisi pauci valde
  english_pob_choice: would be left ... only a very few
  chosen_korean: 겨우 아주 소수만 남게 될 것입니다
  alternatives_korean:
  - 매우 적은 사람만 남을 것입니다
  - 아주 조금만 남게 될 것입니다
  lexicon: derelinquentur / pauci valde
  rationale: 남는 인원의 극소수를 강조하기 위해 '겨우 아주 소수'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: iudex의 법정적 의미와 조건문 구조
  chosen_reading: '''재판장''으로 옮기고, 독립 진술이 아니라 조건절의 시작으로 처리했습니다.'
  alternative_readings:
  - '''심판자''로 일반화하여 옮김'
  - '''그리고 재판장이시라면''처럼 완화된 조건으로 옮김'
  rationale: 라틴어는 'et iudex, si non ignoverit...'로 이어져, '재판장'의 역할이 조건문의 전제로 기능합니다. 영어 개정도 이 구조를 살렸으므로 한국어도 같은 긴장을 유지했습니다.
  doctrine_reference: 문맥상 신적 재판과 자비의 긴장
