    reason: previous_rendering
lexical_decisions:
- source_word: Haec
  english_pob_choice: these spirits
  chosen_korean: 이런 영들
  alternatives_korean:
  - 이 영들
  - 그런 영들
  lexicon: 영
  rationale: 라틴어 Haec는 지시대명사로서 POB의 개정판 취지처럼 'these'에 더 가깝게 처리했습니다. '이런'은 앞선 심판받는 영들을 가리키는 지시성과 범주성을 함께 살립니다.
- source_word: habitationes
  english_pob_choice: habitations
  chosen_korean: 거처
  alternatives_korean:
  - 집들
  - 주거지들
  lexicon: 거처
  rationale: 문맥상 악한 영들이 들어갈 수 있는 '거주처'를 뜻하므로, 너무 일상적인 '집'보다 포괄적인 '거처'가 원문에 가깝습니다.
- source_word: in torments
  english_pob_choice: in torments
  chosen_korean: 고통 속에서
  alternatives_korean:
  - 고문 속에서
  - 고통 가운데
  lexicon: 고통
  rationale: 형벌의 상태를 나타내는 표현으로, 물리적 '고문'보다 지속적 상태를 드러내는 '고통 속에서'가 적절합니다.
- source_word: in seven ways / per septem vias
  english_pob_choice: in seven ways
  chosen_korean: 일곱 가지 방식으로
  alternatives_korean:
  - 일곱 길로
  - 일곱 방면으로
  lexicon: 일곱
  rationale: 부록적 주석이 아니라 구조 표지이므로 본문에 살려야 하며, 'ways'는 길/방식의 중의성을 유지하면서도 다음 절의 '첫째 길'로 자연스럽게 이어지게 '일곱 가지 방식'으로 옮겼습니다.
theological_decisions:
- issue: 악한 영들의 종말 상태와 감정적 묘사
  chosen_reading: 거처에 들어가지 못하고, 고통 속에서 헤매며, 늘 슬퍼하고 근심한 채로 존재하는 상태로 옮겼습니다.
  alternative_readings:
  - 단순히 '떠돌다'로 약화시키는 번역
  - 감정 표현을 생략하는 번역
  rationale: 원문과 POB의 핵심은 이 영들이 안식의 거처에 못 들어가고 지속적 형벌과 탄식 상태에 있다는 점이므로, 슬픔과 근심의 정서를 함께 보존했습니다.
  doctrine_reference: 2 Esdras 7:80-81의 연속 맥락
- issue: '''일곱 가지 방식''의 본문 포함 여부'
  chosen_reading: 다음 절의 구조를 예고하는 본문 요소로 본문에 포함했습니다.
  alternative_readings:
  - 각주로만 처리하는 방식
  - 생략하는 방식
  rationale: 검토된 라틴 본문 전승과 POB 수정 내역이 이 구절을 구조적 마커로 인정하므로, 본문에서 제거하지 않는 것이 문맥상 타당합니다.
  doctrine_reference: Textual criticism / source fidelity
