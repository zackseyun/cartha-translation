  naturalness: ‘이런 영들’도 가능하나, 현대 표준어에서는 지시 대상이 분명한 경우 ‘이 영들’이 더 자연스럽고 정확합니다. ‘헤매며 … 다닐 것입니다’는 동작이 중첩되므로 ‘일곱 가지 방식으로 헤맬 것입니다’로 정리하는 편이 자연스럽습니다.
