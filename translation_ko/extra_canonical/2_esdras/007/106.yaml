    reason: previous_rendering
lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 내가 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말하고
  lexicon: N/A
  rationale: 서술적 응답 공식을 자연스러운 현대 한국어로 옮기되, 연속된 동사 두 개의 응답 리듬을 유지했습니다.
- source_word: rogavit primus Abraham
  english_pob_choice: first Abraham prayed
  chosen_korean: 먼저 아브라함이 중보했고
  alternatives_korean:
  - 아브라함이 먼저 기도했고
  - 아브라함이 먼저 간구했고
  lexicon: N/A
  rationale: primus는 부사처럼 ‘먼저’가 아니라 아브라함을 수식하는 ‘첫 번째로’의 의미이므로, 문맥상 열거의 시작을 드러내도록 ‘먼저’로 자연스럽게 풀었습니다.
- source_word: propter Sodomitas
  english_pob_choice: for the Sodomites
  chosen_korean: 소돔 사람들을 위해
  alternatives_korean:
  - 소돔 사람들에 대하여
  - 소돔 사람들을 위하여
  lexicon: N/A
  rationale: propter는 대상/이유를 표시하지만 이 문맥에서는 중보의 수혜 대상을 가리키므로 한국어에서는 ‘-을 위해’가 가장 자연스럽습니다.
- source_word: Moyses pro patribus qui in deserto peccaverunt
  english_pob_choice: Moses for the fathers who sinned in the wilderness
  chosen_korean: 광야에서 죄를 지은 조상들을 위해 모세가
  alternatives_korean:
  - 광야에서 죄를 지은 아버지들을 위해 모세가
  - 광야에서 범죄한 조상들을 위해 모세가
  lexicon: N/A
  rationale: patres는 여기서 혈통적 ‘조상들’로 읽는 것이 자연스럽고, peccaverunt는 단순한 잘못이 아니라 죄를 지은 것으로 옮겨 원문의 무게를 살렸습니다.
theological_decisions:
- issue: Abraham/Moses의 행위를 'prayed'로 번역할지 '중보하다'로 옮길지
  chosen_reading: ‘중보하다’로 옮겼습니다.
  alternative_readings:
  - 기도했다
  - 간구했다
  rationale: 문맥상 뒤이어 열거되는 모세·여호수아·사무엘 등의 사례는 단순 사적 기도보다 타인을 위한 대리적 간구를 가리키므로, 독자가 문맥 기능을 바로 파악하도록 했습니다.
  doctrine_reference: 중보 기도 전통
- issue: primus의 기능을 시간순 서두로 명확히 할지
  chosen_reading: 아브라함을 목록의 첫 항목으로 드러내는 방식으로 번역했습니다.
  alternative_readings:
  - 아브라함이 먼저 소돔 사람들을 위해 중보했다
  - 먼저 아브라함이 소돔 사람들을 위해 중보했다
  rationale: 라틴어 primus는 아브라함 자체를 수식하는 명사적 형용사로, ‘기도를 먼저 했다’라는 부사적 오해를 피해야 합니다.
  doctrine_reference: 본문 문법 해석
