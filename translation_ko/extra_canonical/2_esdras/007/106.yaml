  text: 내가 대답하여 말했습니다. 「그렇다면 이제 어떻게 해서 우리가 먼저 소돔 사람들을 위해 아브라함이 중보했고, 또 광야에서 죄를 지은 조상들을 위해 모세가 중보한 것을 보게 됩니까」[a]
  philosophy: optimal-equivalence
  footnotes:
