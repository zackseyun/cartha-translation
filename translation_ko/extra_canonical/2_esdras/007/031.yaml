id: 2ES.7.31
reference: 2 Esdras 7:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post dies septem, et excitabitur qui nondum vigilat saeculum et morietur corruptum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/031.yaml
  text: And after seven days, the age that is not yet awake will be awakened, and what is corrupt will die.
translation:
  language: ko
  text: 그리고 칠 일 후에, 아직 깨어나지 않은 시대가 깨어날 것이며, 부패한 것은 죽을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: saeculum은 문맥상 단순한 ‘세상’보다 역사적·종말론적 ‘시대’를 가리키는 것으로 보았습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: et erit post dies septem
  english_pob_choice: And after seven days
  chosen_korean: 그리고 칠 일 후에
  alternatives_korean:
  - 그리고 일곱 날 후에
  - 그리고 칠 일 뒤에
  lexicon: post dies septem
  rationale: 라틴어의 시간 표현을 자연스러운 현대 한국어 어순으로 옮기되, 숫자 자체는 본문의 장중함을 살려 ‘칠 일’로 유지했습니다.
- source_word: excitabitur
  english_pob_choice: will be awakened
  chosen_korean: 깨어날 것입니다
  alternatives_korean:
  - 일어나게 될 것입니다
  - 소생할 것입니다
  lexicon: excitabitur
  rationale: 수동형의 ‘깨어남’을 살리기 위해 ‘깨어날 것이다’로 옮겨, 외부에서 일으켜짐과 깨어남의 결과를 함께 드러냈습니다.
- source_word: qui nondum vigilat saeculum
  english_pob_choice: the age that is not yet awake
  chosen_korean: 아직 깨어나지 않은 시대
  alternatives_korean:
  - 아직 깨어 있지 않은 세대
  - 아직 잠들어 있는 시대
  lexicon: saeculum + nondum vigilat
  rationale: saeculum을 문맥상 ‘시대’로 옮기고, nondum vigilat의 상태적 의미를 ‘아직 깨어나지 않은’으로 살려 영어 POB의 해석을 반영했습니다.
- source_word: corruptum
  english_pob_choice: what is corrupt
  chosen_korean: 부패한 것은
  alternatives_korean:
  - 썩은 것은
  - 타락한 것은
  lexicon: corruptum
  rationale: 라틴어 corruptum의 핵심 의미를 도덕적·존재론적 중첩을 가진 ‘부패한’으로 유지하여, revision pass에서 확정된 ‘corrupt’를 반영했습니다.
theological_decisions:
- issue: saeculum의 종말론적 지칭
  chosen_reading: ‘시대’로 옮기되, 단순한 시간대가 아니라 깨어나야 할 역사적-종말론적 질서를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 세상
  - 세대
  rationale: 본문은 단순한 연대기적 시간보다 ‘깨어나고 죽는’ 종말론적 전환을 말하므로, ‘시대’가 의미 범위를 가장 덜 축소합니다.
  doctrine_reference: 종말론적 언어의 최소 축소 원칙
