  yaml_path: translation/extra_canonical/2_esdras/007/003.yaml
  text: And I said, “Speak, my lord.” And he said to me, “The sea is set in a broad place, so that it might be deep and immense.
translation:
  language: ko
  text: 그리고 제가 말했습니다. “말씀해 주십시오, 나의 주님.” 그러자 그가 저에게 말했습니다. “바다는 깊고 광대하도록 넓은 곳에 놓여 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: loquere
  english_pob_choice: Speak
  chosen_korean: 말씀하십시오
  alternatives_korean:
  - 말하세요
  - 말해 주십시오
  lexicon: loquere (imperative of loqui)
  rationale: 정중한 청자 호칭인 dominue meus에 맞추어 합쇼체 명령으로 옮겨, 단순한 ‘말하다’보다 발화 요청의 공손함을 살렸습니다.
- source_word: dominus meus
  english_pob_choice: my lord
  chosen_korean: 나의 주님
  alternatives_korean:
  - 내 주인님
  - 나의 주인
  lexicon: dominus
  rationale: 직역적 소유격을 유지하되, 문맥상 경어가 필요한 대화체이므로 ‘주님’으로 옮겼습니다.
- source_word: mare positum est in spatioso loco
  english_pob_choice: The sea is set in a broad place
  chosen_korean: 바다는 넓은 곳에 놓여 있어
  alternatives_korean:
  - 바다는 넓은 장소에 세워져 있어
  - 바다는 넓은 공간에 자리해 있어
  lexicon: mare positum est / spatiosus
  rationale: ‘positum est’를 수동적 배치로, ‘spatioso loco’를 넓은 장소/공간으로 이해해, 장엄한 공간 감각을 살린 자연스러운 한국어로 옮겼습니다.
- source_word: altum et inmensum
  english_pob_choice: deep and immense
  chosen_korean: 깊고 헤아릴 수 없게 되어 있습니다
  alternatives_korean:
  - 깊고 무한하게 되어 있습니다
  - 깊고 엄청나게 큽니다
  lexicon: altus / inmensus
  rationale: ‘immensum’의 단순한 크기보다 ‘헤아릴 수 없음’의 뉘앙스를 살려, 바다의 압도적 성격을 더 분명히 드러냈습니다.
theological_decisions:
- issue: 화자에 대한 존칭 처리
  chosen_reading: 대화 상대를 ‘나의 주님’으로 높이고, 응답 발화를 합쇼체로 유지했습니다.
  alternative_readings:
  - 평서형으로 단순화
  - ‘주인’으로 직역
  rationale: 본문은 예언적/묵시적 대화의 경어를 드러내므로, 한국어에서도 관계의 위계를 보존하는 것이 의미 전달에 유익합니다.
  doctrine_reference: 서사적 존칭은 본문 의미 보존을 위한 번역상의 선택입니다.
