    issue: ut esset의 목적 지향과 altum et inmensum의 병렬 술어가 약화되었습니다.
    rationale: ‘놓여 있어, 깊고 헤아릴 수 없게 되어 있습니다’는 배치의 목적을 독립된 결과 상태로 처리하고, ‘깊고’와 ‘헤아릴 수 없게’의 문법적 병렬도 흐립니다.
  - severity: low
    issue: 각주가 본문에 없는 해석적 범위를 덧붙입니다.
    rationale: inmensum의 기본 뜻인 ‘광대한’을 본문에서 직접 옮기면, ‘무한한’이라는 대안적 설명 각주는 필요하지 않습니다.
