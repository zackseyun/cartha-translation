id: 2ES.7.7
reference: 2 Esdras 7:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: introitus autem eius angustus et in praecipiti positus, ut esset a dextris quidem ignis, a sinistris vero aqua alta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/007.yaml
  text: But its entrance is narrow and set on a precipice, so that on the right there is fire and on the left deep water.
translation:
  language: ko
  text: 그 입구는 좁고 벼랑 위에 놓여 있습니다. 오른쪽에는 불이 있고, 왼쪽에는 깊은 물이 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: introitus
  english_pob_choice: entrance
  chosen_korean: 그 문으로 들어가는 길
  alternatives_korean:
  - 들어가는 문
  - 입구
  - 출입구
  lexicon: introitus
  rationale: 단순한 ‘입구’보다, 뒤의 ‘좁고’와 결합해 사람이 실제로 통과하는 통로의 성격을 살리기 위해 ‘들어가는 길’로 옮겼습니다.
- source_word: angustus
  english_pob_choice: narrow
  chosen_korean: 좁고
  alternatives_korean:
  - 비좁고
  - 협소하고
  lexicon: angustus
  rationale: 물리적 협착을 직설적으로 나타내면서도 문체를 자연스럽게 유지하는 표현입니다.
- source_word: in praecipiti positus
  english_pob_choice: set on a precipice
  chosen_korean: 벼랑 위에 놓여 있습니다
  alternatives_korean:
  - 낭떠러지 위에 놓여 있습니다
  - 험한 절벽 위에 있습니다
  lexicon: praeceps / in praecipiti
  rationale: ‘præcipiti’의 위험한 경사와 추락 가능성을 살리되, 한국어에서 가장 직관적인 이미지인 ‘벼랑’으로 표현했습니다.
- source_word: a dextris ... a sinistris
  english_pob_choice: on the right ... on the left
  chosen_korean: 오른쪽에는 ... 왼쪽에는
  alternatives_korean:
  - 우편에는 ... 좌편에는
  - 오른편에는 ... 왼편에는
  lexicon: dextra / sinistra
  rationale: 방향 대비를 명료하게 전달하는 현대 표준어를 택했습니다.
- source_word: aqua alta
  english_pob_choice: deep water
  chosen_korean: 깊은 물
  alternatives_korean:
  - 깊은 물속
  - 깊은 물줄기
  - 깊은 물바다
  lexicon: aqua alta
  rationale: ‘alta’의 깊이를 직접 반영하면서도 과장되지 않게 유지한 번역입니다.
