revisions:
- from: 일곱째 길은 앞에서 말한 모든 길보다 더 큽니다. 그것은 그들이 혼란 속에서 쇠약해지고, 공포들 속에서 소멸되며, 두려움들 속에서 시들어 가는 것이니, 살아 있는 동안 죄를 지은 바로 그분, 곧 지극히 높으신 이의 영광을 보고, 또 마지막 때에 심판을 받기 시작할 것이기 때문입니다.[a][b]
  to: 일곱째 길은 앞서 말한 모든 길보다 더 큽니다. 이는 그들이 혼란 가운데서 쇠약해지고, 공포 가운데서 소멸되며, 두려움 가운데서 시들어 가고, 살아 있는 동안 그 앞에서 죄를 지었던 지극히 높으신 이의 영광을 보며, 마지막 때에 그 앞에서 심판을 받기 시작할 것이기 때문입니다.[a][b]
  rationale: 본문은 미래의 세 쇠락 동사와 심판의 개시를 유지하되, 한국어에서 자연스럽게 읽히도록 인과절을 재구성했습니다. ‘지극히 높으신 이’ 앞에서 과거에 죄를 지었고 그 앞에서 장차 심판받는다는 두 관계를 분명히 했습니다. 각주는 영어 POB 감사 기록의 기능과 의미를 보존하면서 오자와 수식상 모호성을 수정했습니다.
  reviewer_model: gpt-5.6-terra
