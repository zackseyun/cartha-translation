base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/087.yaml
  text: The seventh way is greater than all the ways mentioned above[a], because they will waste away in confusion and be consumed in horrors and wither in fears, seeing the glory of the Most High, before whom they sinned while they lived[b], and before whom they will begin to be judged in the last times.
  footnotes:
  - marker: a
    text: 'Several words in this verse are textually rough in the Latin tradition. The sense is clear enough: the wicked undergo the most severe anguish when confronted with the glory of the Most High before whom they sinned.'
    reason: textual_variant
    anchor_ref: 7:87
  - marker: b
    text: 'Or ''The seventh way, greater than all the ways mentioned above: they waste away in confusion and are consumed in shame and wither in fears, because they see the glory of the Most High, before whom they sinned while they lived, and before whom they are to be judged in the last times.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 일곱째 길은 앞에서 말한 모든 길보다 더 큽니다. 그것은 그들이 혼란 속에서 쇠약해지고, 공포들 속에서 소멸되며, 두려움들 속에서 시들어 가는 것이니, 살아 있는 동안 죄를 지은 바로 그분, 곧 지극히 높으신 이의 영광을 보고, 또 마지막 때에 심판을 받기 시작할 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '라틴어 전승의 일부 표현은 본문이 다소 거칠지만, 의미는 분명합니다: 악인들은 지극히 높으신 이의 영광 앞에 서게 될 때 가장 తీవ한 고통을 겪습니다.'
    reason: textual_variant
  - marker: b
    text: '또는: ‘일곱째 길은 앞에서 말한 모든 길보다 더 큽니다. 그들은 혼란 속에서 쇠약해지고, 수치 속에서 소멸되며, 두려움 속에서 시들어 갑니다. 이는 그들이 살아 있는 동안 죄를 지었고, 마지막 때에 심판되기 시작할 지극히 높으신 이의 영광을 보기 때문입니다.’'
    reason: previous_rendering
lexical_decisions:
- source_word: Septima uia est omnium quae supradictae sunt uiarum maior
  english_pob_choice: The seventh way is greater than all the ways mentioned above
  chosen_korean: 일곱째 길은 앞에서 말한 모든 길보다 더 큽니다
  alternatives_korean:
  - 일곱째 길은 위에서 말한 모든 길보다 큽니다
  - 일곱째 길은 앞서 언급된 모든 길보다 큽니다
  lexicon: greater / major
  rationale: Latin의 비교급 maior를 자연스럽게 ‘더 큽니다’로 옮겨, 순서와 비교 관계를 분명히 했습니다.
- source_word: detabescent ... consumentur ... maereescent
  english_pob_choice: they will waste away ... and be consumed ... and wither
  chosen_korean: 쇠약해지고 ... 소멸되며 ... 시들어 가는
  alternatives_korean:
  - 무너져 내리고 ... 삼켜지며 ... 마를 것이며
  - 소진되고 ... 불타 사라지며 ... 말라버리며
  lexicon: future verbs of decay
  rationale: 세 동사의 미래적 쇠락 이미지를 살리면서, 한국어에서도 점층적 붕괴감을 유지하도록 ‘쇠약해지고 / 소멸되며 / 시들어 가는’으로 옮겼습니다.
- source_word: horróribus
  english_pob_choice: horrors
  chosen_korean: 공포들
  alternatives_korean:
  - 전율들
  - 두려움의 참혹함들
  - 공포 속에서
  lexicon: horrors
  rationale: 문맥상 라틴어 horróribus를 ‘수치’로 바꾸면 안 되므로, POB의 의미를 따라 복수적·강한 두려움의 상태를 드러내는 ‘공포들’로 렌더링했습니다.
- source_word: gloriam Altissimi coram quem uiuentes peccauerunt
  english_pob_choice: seeing the glory of the Most High, before whom they sinned while they lived
  chosen_korean: 살아 있는 동안 죄를 지은 바로 그분, 곧 지극히 높으신 이의 영광을 보고
  alternatives_korean:
  - 살아 있을 때 그 앞에서 죄를 지은 지극히 높으신 이의 영광을 보고
  - 그분 앞에서 살아 있을 때 죄를 지은 지극히 높으신 이의 영광을 보며
  lexicon: Most High / before whom
  rationale: coram quem uiuentes peccauerunt를 ‘살아 있는 동안 죄를 지은 바로 그분’으로 풀어, ‘그분 앞에서’라는 관계와 ‘살아 있을 때’의 행위를 모두 드러냈습니다.
- source_word: incipient ... iudicari in novissimis temporibus
  english_pob_choice: they will begin to be judged in the last times
  chosen_korean: 마지막 때에 심판을 받기 시작할
  alternatives_korean:
  - 마지막 때에 심판되기 시작할
  - 마지막 때에 재판을 받기 시작할
  lexicon: begin to be judged
  rationale: incipient의 ‘시작하다’를 놓치지 않고, 수동적 심판 과정을 한국어 어순에 맞게 ‘심판을 받기 시작할’로 살렸습니다.
theological_decisions:
- issue: 지극히 높으신 이의 영광을 대면한 자들의 심판적 고통을 어떻게 표현할지
  chosen_reading: 원문의 공포·쇠약·소멸 이미지를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ‘수치’나 ‘부끄러움’ 중심으로 완화
  - ‘슬픔’이나 ‘근심’으로 일반화
  rationale: 라틴어와 POB의 핵심은 죄인이 하나님의 영광 앞에서 겪는 극심한 심판적 붕괴이므로, 정서적 강도를 낮추지 않았습니다.
  doctrine_reference: 심판과 하나님의 영광 앞에서의 인간의 책임이라는 본문 차원의 신학
- issue: 마지막 때에 ‘심판을 받기 시작할’의 미완료성을 살릴지
  chosen_reading: ‘받기 시작할’로 옮겨 심판의 개시를 표현했습니다.
  alternative_readings:
  - ‘심판을 받을 것이다’로 단순 미래
  - ‘심판이 있을 것이다’로 일반화
  rationale: incipient의 동사를 반영해 심판이 그때 시작된다는 시간적 긴장을 보존했습니다.
  doctrine_reference: 종말론적 심판의 개시와 진행이라는 본문 신학
