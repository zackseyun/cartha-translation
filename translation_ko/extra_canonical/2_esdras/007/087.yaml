source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eiamentum. Septima uia est omnium quae supradictae sunt uiarum maior, quoniam detabescent iu confusione et consumentur in horróribus† et maereescent in timoribus, uidentes gloriam Altissimi coram quem uiuentes peccauerunt et coram
