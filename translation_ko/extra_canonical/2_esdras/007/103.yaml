id: 2ES.7.103
reference: 2 Esdras 7:103
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iudicii iusti impios excusare poterint uel deprecari pro eis Altissimum, Si patres pro filiis, uel filii pro parentibus, si fratres pro fratribus, si adfines pro proximis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/103.yaml
  text: will they be able to excuse the ungodly at the righteous judgment[a], or to entreat the Most High for them, as fathers for children, or children for parents, brothers for brothers, relatives for neighbors,
  footnotes:
  - marker: a
    text: Or 'fathers for children, or children for parents, brothers for brothers, relatives for neighbors, or faithful ones for those most dear to them?”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 의로운 심판에서 경건하지 않은 자를 변명할 수 있겠습니까, 아니면 부모가 자녀를 위해, 자녀가 부모를 위해, 형제가 형제를 위해, 친척이 이웃을 위해 지존하신 분께 간구할 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicii iusti
  english_pob_choice: the righteous judgment
  chosen_korean: 의로운 심판
  alternatives_korean:
  - 의의 심판
  - 의로운 재판
  lexicon: iudicium / iustus
  rationale: 문맥상 하나님의 공정한 판결을 가리키므로 ‘심판’이 적절하며, iusti의 형용사 의미를 살려 ‘의로운’으로 옮겼습니다.
- source_word: impios
  english_pob_choice: the ungodly
  chosen_korean: 경건하지 않은 자
  alternatives_korean:
  - 불경건한 자
  - 악인
  lexicon: impius
  rationale: 단순한 도덕적 악인보다 ‘하나님께 대한 경외와 경건이 없는 상태’를 드러내는 표현이어서, 직역성이 높은 ‘경건하지 않은 자’를 택했습니다.
- source_word: deprecari pro eis
  english_pob_choice: to entreat the Most High for them
  chosen_korean: 지존하신 분께 간구할
  alternatives_korean:
  - 그들을 위해 지존하신 분께 간청할
  - 그들을 위해 가장 높으신 분께 호소할
  lexicon: deprecari
  rationale: 간구의 행위를 분명히 하되, 문맥상 대상이 하나님이므로 ‘지존하신 분’으로 자연스럽게 옮겼습니다.
- source_word: patres ... filiis / filii ... parentibus / fratres ... fratribus / adfines ... proximis
  english_pob_choice: as fathers for children, or children for parents, brothers for brothers, relatives for neighbors
  chosen_korean: 부모가 자녀를 위해, 자녀가 부모를 위해, 형제가 형제를 위해, 친척이 이웃을 위해
  alternatives_korean:
  - 아버지가 자녀를 위해, 자녀가 부모를 위해, 형제가 형제를 위해, 친족이 이웃을 위해
  - 부모는 자녀를 위해, 자녀는 부모를 위해, 형제는 형제를 위해, 친척은 이웃을 위해
  lexicon: patres / filii / fratres / adfines / proximis
  rationale: 열거된 인간관계의 대칭성을 살리기 위해 한국어에서도 ‘~가 ~을/를 위해’ 구조를 반복하여 수사적 긴장을 유지했습니다.
theological_decisions:
- issue: Most High의 신칭 표현
  chosen_reading: 지존하신 분
  alternative_readings:
  - 가장 높으신 분
  - 지극히 높으신 분
  rationale: 직접적인 호칭이면서도 신약/외경의 경건한 존칭을 과도하게 교회식으로 고정하지 않도록, 높임과 위계를 함께 드러내는 표현을 택했습니다.
  doctrine_reference: 하나님의 초월성과 재판장의 권위를 드러내는 경외 표현
