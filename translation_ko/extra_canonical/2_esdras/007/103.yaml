  rationale: 원문의 양자택일 질문과 관계 열거의 수사적 병렬을 유지하면서, ‘아버지’와 ‘인척’으로 라틴어 관계 명사의 의미 범위를 보존했습니다. 간구의 대상 ‘그들’을 명시하고 자연스러운 현대 표준 한국어 합쇼체로 다듬었습니다. 제공된 영어 감사 이력의 각주 내용은 현재 라틴어 본문이 뒷받침하지 않는 이전 번역 관련 메모이므로 한국어 본문에 각주로 도입하지 않았습니다.
