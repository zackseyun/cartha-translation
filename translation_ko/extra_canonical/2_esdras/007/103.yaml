revisions:
- from: 그들은 의로운 심판에서 경건하지 않은 자를 변명할 수 있겠습니까, 아니면 부모가 자녀를 위해, 자녀가 부모를 위해, 형제가 형제를 위해, 친척이 이웃을 위해 지존하신 분께 간구할 수 있겠습니까?
