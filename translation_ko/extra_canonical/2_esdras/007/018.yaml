revisions:
- from: 의인들은 좁은 것들을 견디며 넓은 것들을 바라보지만, 악하게 행한 자들은 좁아짐을 둘 다 겪었고 넓은 것들을 보지 못했습니다.[a][b]
  to: 그러나 의인들은 좁은 것들을 견디면서 넓은 것들을 바랄 것입니다. 불경건하게 행한 자들은 좁음을 겪었고, 넓은 것들을 보지도 못했기 때문입니다.
  rationale: 수정문은 autem의 대조를 ‘그러나’로, ferent의 미래성을 ‘견딜 것입니다’의 의미를 지닌 구성으로, sperantes를 ‘바라면서’로 반영합니다. 또한 angusta/angustiam 및 spatiosa의 반복을 각각 ‘좁은 것들/좁음’과 ‘넓은 것들’로 보존했습니다. 후반부는 et ... et ...의 두 병렬 결과를 ‘겪었고, 보지도 못했습니다’로 자연스럽고 강조적으로 나타냈습니다. 기존 각주는 현행 영어 POB의 확정 표현과 맞지 않거나 유의미한 본문 대안을 제공하지 않아 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:13Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 미래형 ferent, 현재분사 sperantes, 그리고 angusta/angustiam과 spatiosa의 반복된 공간 은유를 살려야 합니다. 초안의 ‘좁아짐을 둘 다 겪었고’는 문법적으로 부자연스럽고, ‘둘 다’가 뒤의 ‘넓은 것들을 보지 못했다’까지 포괄하지 못합니다.
  naturalness: ‘좁아짐을 둘 다 겪었고’는 현대 표준 한국어로 성립이 어색합니다. ‘좁음을 겪었고, 넓은 것들을 보지도 못했습니다’가 자연스럽게 두 결과의 병렬과 강조를 전달합니다.
  terminology: ‘의인들’, ‘좁은 것들’, ‘넓은 것들’은 원문의 의도적인 대조를 보존하므로 유지할 수 있습니다. impie gesserunt는 ‘악하게 행한 자들’보다 ‘불경건하게 행한 자들’이 하나님을 향한 불경함의 뉘앙스를 더 분명히 보존하지만, 본문에서 과도한 해석 없이 자연스럽습니다.
  issues:
  - severity: high
    issue: ‘좁아짐을 둘 다 겪었고’는 et ... et ... 구조를 잘못 연결합니다.
    rationale: 라틴어는 ‘좁음을 겪었고’와 ‘넓은 것들을 보지 못했다’라는 두 사실을 병렬로 강조합니다. ‘둘 다’는 ‘좁아짐’ 하나를 수식할 수 없으며, 문장 의미도 불완전해집니다.
  - severity: medium
    issue: ferent의 미래성이 초안에서 약화되었습니다.
    rationale: ‘견디며’만으로는 미래 직설법의 예고가 명시되지 않습니다. ‘견딜 것이며’ 또는 ‘견디면서 … 바랄 것입니다’로 미래성을 드러내는 편이 안전합니다.
  - severity: low
    issue: 각주가 영어 감사 기록의 현행 본문과 일치하지 않으며 본문 앵커도 불필요하게 두 개입니다.
    rationale: 현행 영어 본문은 ‘both suffered narrowness and not seen the broad things’를 채택했고, ‘hoping for broad things’도 채택했습니다. 제시된 두 각주는 이전 표현 또는 실질적 대안을 잘못 제시하므로 삭제하는 편이 낫습니다.
