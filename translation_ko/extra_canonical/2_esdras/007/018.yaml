id: 2ES.7.18
reference: 2 Esdras 7:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iusti autem ferent angusta sperantes spatiosa; qui enim impie gesserunt, et angustiam passi sunt et spatiosa non viderunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/018.yaml
  text: But the righteous will endure narrow things[a], hoping for broad things[b]; for those who have acted ungodly have both suffered narrowness and not seen the broad things.
  footnotes:
  - marker: a
    text: Or 'have also endured distress, and have not seen the broad things'.
    reason: previous_rendering
  - marker: b
    text: Or 'hoping for broad ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 의인들은 좁은 것들을 견디면서 넓은 것들을 바랄 것입니다. 불경건하게 행한 자들은 좁음을 겪었고, 넓은 것들을 보지도 못했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iusti
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 자들
  - 의로운 사람들
  lexicon: iusti
  rationale: 라틴어 iusti는 도덕적·언약적 의미의 ‘의인들’로 읽는 것이 자연스럽고, POB의 righteous를 직접 반영합니다.
- source_word: ferent angusta
  english_pob_choice: will endure narrow things
  chosen_korean: 좁은 것들을 견디며
  alternatives_korean:
  - 고난을 견디며
  - 어려운 것들을 견디며
  lexicon: ferent angusta
  rationale: angusta/angustiam의 반복되는 공간적 대비를 살리기 위해 ‘고난’보다 직역에 가까운 ‘좁은 것들’을 택했습니다.
- source_word: spatiosa
  english_pob_choice: broad things
  chosen_korean: 넓은 것들
  alternatives_korean:
  - 넓은 공간들
  - 광활한 것들
  lexicon: spatiosa
  rationale: spatiosa를 ‘넓은 것들’로 옮겨 앞의 ‘좁은 것들’과 어휘적으로 대응시키고, 동일한 공간 은유를 유지했습니다.
- source_word: impie gesserunt
  english_pob_choice: have acted ungodly
  chosen_korean: 악하게 행한 자들
  alternatives_korean:
  - 경건하지 않게 행한 자들
  - 불경하게 행한 자들
  lexicon: impie gesserunt
  rationale: impie는 단순한 도덕적 악행을 넘어 하나님 앞에서의 불경건을 뜻하므로, 현대 한국어에서 의미가 드러나도록 ‘악하게 행한’으로 옮겼습니다.
theological_decisions:
- issue: et... et...의 반복 구조
  chosen_reading: ‘좁아짐을 둘 다 겪었고’로 옮겨 wicked 쪽의 이중 비극을 드러냈습니다.
  alternative_readings:
  - ‘좁아짐도 겪었고’
  - ‘좁아짐을 또한 겪었고’
  rationale: 라틴어의 et... et...는 단순 병렬이 아니라 ‘둘 다’의 강조이므로, 이를 명시해 대조와 수치를 살렸습니다.
  doctrine_reference: 수사적 강조와 본문 구조 보존
- issue: 좁음과 넓음의 공간 은유
  chosen_reading: 물리적 공간 대비를 그대로 유지했습니다.
  alternative_readings:
  - ‘환난과 안식’으로 의역
  - ‘고난과 복된 넓음’으로 해석
  rationale: 본문은 단지 감정 상태가 아니라 좁음/넓음의 이미지로 종말론적 대조를 말하므로, 은유를 풀어버리지 않고 유지하는 것이 원문에 더 충실합니다.
  doctrine_reference: 종말론적 대비와 문학적 이미지 보존
