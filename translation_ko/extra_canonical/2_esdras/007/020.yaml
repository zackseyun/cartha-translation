  naturalness: ‘지금 있는 많은 사람들’은 다소 미완성적으로 들립니다. ‘지금 여기 있는 많은 사람’과 ‘멸망하는 한이 있더라도’는 현대 표준 한국어 합쇼체에서 자연스럽고, 본문의 강한 수사도 유지합니다.
  terminology: ‘하나님의 율법’은 Dei lex에 적절합니다. ‘멸망’은 pereant의 소멸·파멸 의미를 무리 없이 담으며, 본문을 직접적인 인간 명령으로 만들지 않습니다.
