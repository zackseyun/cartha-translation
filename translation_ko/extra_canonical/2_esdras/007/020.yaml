id: 2ES.7.20
reference: 2 Esdras 7:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pereant enim multi praesentes, quamneglegatur quae anteposita est Dei lex.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/020.yaml
  text: For let many of those now present perish[a], rather than the law of God that has been set forth be neglected.
  footnotes:
  - marker: a
    text: Or 'Let many of those now living perish,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 지금 여기 있는 많은 사람이 멸망하는 한이 있더라도,[a] 제시되어 있는 하나님의 율법이 무시되어서는 안 되기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지금 살아 있는 많은 사람이’. 라틴어 praesentes는 문맥상 ‘현재 있는/현존하는’을 뜻합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: pereant
  english_pob_choice: let many of those now present perish
  chosen_korean: 많은 사람들이 죽는 편이 낫고
  alternatives_korean:
  - 많은 사람들이 멸망하는 편이 낫고
  - 많은 사람들이 죽어 버리는 편이 낫고
  lexicon: pereo
  rationale: 라틴어 pereant의 소멸·사망 의미를 살리되, 문맥상 단순 예언이 아니라 강한 양자택일 진술이므로 ‘~하는 편이 낫고’로 처리했습니다.
- source_word: praesentes
  english_pob_choice: now present
  chosen_korean: 지금 있는
  alternatives_korean:
  - 지금 حاضر한
  - 지금 حاضر해 있는
  lexicon: praesens
  rationale: praesentes는 ‘현재 여기 있는’ 사람들을 가리키므로, 자연스러운 한국어로 ‘지금 있는’이라 옮겼습니다.
- source_word: Dei lex
  english_pob_choice: the law of God
  chosen_korean: 하나님의 율법
  alternatives_korean:
  - 하나님의 법
  - 하나님의 토라
  lexicon: lex
  rationale: 문맥상 단순 법령보다 계시된 규범을 가리키므로, 프로젝트 기본어인 ‘율법’을 유지했습니다.
- source_word: anteposita est
  english_pob_choice: has been set forth
  chosen_korean: 무시되는 일은 없어야 합니다
  alternatives_korean:
  - 앞에 놓여 있습니다
  - 제시되어 있습니다
  - 먼저 제시된 것이 무시되어서는 안 됩니다
  lexicon: antepono
  rationale: 직역하면 ‘앞에 놓인’이지만, 본절의 핵심 대비는 하나님의 율법이 경시되는 것을 막는 데 있으므로 한국어에서 자연스럽고 경고의 힘이 살아나는 표현으로 다듬었습니다.
theological_decisions:
- issue: 양자택일의 강한 수사
  chosen_reading: 현재 있는 많은 사람이 죽는 쪽이 하나님의 율법이 무시되는 것보다 낫다는 강한 대비로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘죽는 편이 낫다’로 약화
  - 직설적으로 ‘죽어야 한다’로 해석
  rationale: 라틴어는 도덕적 우선순위를 극단적으로 드러내는 대비법이므로, 본문의 충격과 긴장을 유지하되 명령문처럼 오해되지 않게 했습니다.
  doctrine_reference: 본문의 수사적 과장과 하나님의 율법의 우선성을 보존하는 번역 원칙
