  rationale: 설명 접속사 enim, 현재 현존을 가리키는 praesentes, 양보적 비교의 수사, 그리고 anteposita est의 ‘제시되어 있는’ 의미를 모두 반영했습니다. 각주는 영어 POB의 대안적 표현에 해당하는 가능성을 한국어로 자연스럽게 제시했습니다.
