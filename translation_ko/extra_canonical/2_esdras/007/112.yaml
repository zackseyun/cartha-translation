id: 2ES.7.112
reference: 2 Esdras 7:112
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: praesens saeculum non est finis, gloria in eo non frequens manet, propter hoc oraverunt qui potuerunt pro invalidis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/112.yaml
  text: And he answered me and said[a], “The present age is not the end; glory does not remain in it continually. Therefore those who were able prayed for the weak.
  footnotes:
  - marker: a
    text: Or 'glory does not remain in it often.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다.[a] “이 현 시대는 끝이 아닙니다. 그 안에 영광이 늘 머물러 있지는 않습니다. 그러므로 할 수 있었던 이들이 연약한 이들을 위하여 기도했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 안에 영광이 자주 머물러 있지는 않습니다.’
    reason: frequens는 이 문맥에서 ‘늘/계속’이라는 뜻으로 이해하는 것이 가장 자연스럽지만, ‘자주’라는 가능한 번역도 보존합니다.
lexical_decisions:
- source_word: praesens saeculum
  english_pob_choice: the present age
  chosen_korean: 이 현재 시대
  alternatives_korean:
  - 이 세상
  - 현세
  lexicon: saeculum
  rationale: 사상적 대비가 되는 종말론적 ‘현재 시대’를 살리기 위해 ‘이 현재 시대’로 옮겼습니다. 단순한 공간적 ‘세상’보다 시간-구조적 대비가 분명합니다.
- source_word: finis
  english_pob_choice: the end
  chosen_korean: 끝
  alternatives_korean:
  - 종말
  - 마지막
  lexicon: finis
  rationale: 문맥상 ‘현재 시대’와 대비되는 종결점을 가리키므로, 직역성이 높은 ‘끝’을 사용했습니다.
- source_word: gloria ... non frequens manet
  english_pob_choice: glory does not remain in it continually
  chosen_korean: 그 안에 영광이 늘 머물러 있는 것도 아닙니다
  alternatives_korean:
  - 그 안에 영광이 자주 머무는 것도 아닙니다
  - 그 안에 영광이 오래 머무는 것도 아닙니다
  lexicon: gloria + frequens + manet
  rationale: revised audit가 지적하듯 frequens는 ‘often’보다 ‘continually/constantly’의 뉘앙스를 지니므로, ‘늘 머물러’로 지속성의 부재를 살렸습니다.
- source_word: invalidis
  english_pob_choice: the weak
  chosen_korean: 약한 이들
  alternatives_korean:
  - 연약한 이들
  - 무력한 사람들
  lexicon: invalidus
  rationale: 상태적 연약함을 드러내되, 한국어에서 자연스럽고 덜 낙인찍는 표현인 ‘약한 이들’을 택했습니다.
theological_decisions:
- issue: 현재 시대와 오는 영광의 대비
  chosen_reading: 이 구절은 현재 시대의 비종말성과 그 안에 머무는 영광의 일시성을 대조합니다.
  alternative_readings:
  - 현재 시대의 윤리적 타락을 일반적으로 말하는 것으로 읽을 수 있습니다.
  rationale: Latin의 ‘praesens saeculum’과 ‘non finis’, ‘gloria ... non frequens manet’의 결합은 존재론적/종말론적 대비를 형성하므로, 그 긴장을 보존했습니다.
  doctrine_reference: 종말론
