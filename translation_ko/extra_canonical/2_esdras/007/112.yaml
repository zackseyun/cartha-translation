- from: 그가 내게 대답하여 말했습니다[a]. 「이 현재 시대는 끝이 아닙니다. 그 안에 영광이 늘 머물러 있는 것도 아닙니다. 그러므로 약한 이들을 위해 기도할 수 있는 이들이 기도했습니다.」
  to: 그가 내게 대답하여 말했습니다.[a] “이 현 시대는 끝이 아닙니다. 그 안에 영광이 늘 머물러 있지는 않습니다. 그러므로 할 수 있었던 이들이 연약한 이들을 위하여 기도했습니다.”
  rationale: 원문의 미규정된 능력의 대상을 보존하도록 ‘기도할 수 있는 이들’을 ‘할 수 있었던 이들’로 고쳤습니다. 또한 문체를 자연스러운 현대 한국어 합쇼체로 다듬고, frequens의 대안적 번역 가능성은 각주에 유지했습니다.
