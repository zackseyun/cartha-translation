translation:
  language: ko
  text: 그 때들이 오기를 바랍니다. 당신께서 창조 세계를 새롭게 하기 시작하실 그 때들 말입니다. 아니면 우리는 이제부터 고통을 받습니까?” 그러자 그가 제게 대답하여 말했습니다. “이것도 내가 당신에게 보여 주겠습니다. 그러나 당신은 그들과 섞이지 마십시오.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는 이전 번역: “그러자 그가 제게 대답하여 말했습니다. ‘이것도 내가 당신에게 보여 주겠습니다. 그러나 당신은 멸시를 나타낸 자들과 섞이지 말고, 고통을 받는 자들 가운데 자신을 헤아리지 마십시오.’”'
    reason: 영어 POB 감사 이력에 보존된 이전 번역을 반영한 각주입니다. 이 대안은 현 라틴어 본문 범위보다 뒤 절의 내용을 포함하므로, 본문이 아니라 이전 번역으로만 제시합니다.
lexical_decisions:
- source_word: ueniant tempora illa
  english_pob_choice: let those times come
  chosen_korean: 그때 그 시기가 오기를
  alternatives_korean:
  - 그때가 오기를
  - 그 시절이 도래하기를
  lexicon: venir / tempora
  rationale: veniant의 소망·허용 뉘앙스를 살려 단순 미래가 아니라 ‘오기를’로 옮기고, tempora illa는 지시성을 살려 ‘그 시기’로 처리했습니다.
- source_word: incipies creaturam renouare
  english_pob_choice: you will begin to renew the creation
  chosen_korean: 당신이 창조를 새롭게 하기 시작할 때가 오기를
  alternatives_korean:
  - 당신이 피조물을 새롭게 하기 시작할 때
  - 당신이 창조를 갱신하기 시작할 때
  lexicon: incipere / creatura / renovare
  rationale: creatura는 여기서 ‘창조된 것’ 전체를 가리키므로 ‘창조’로 두고, renouare는 의미를 직접 살려 ‘새롭게 하다’로 옮겼습니다.
- source_word: amodo cruciamur
  english_pob_choice: are we tormented from now on?
  chosen_korean: 우리는 이제부터 고통을 받습니까?
  alternatives_korean:
  - 우리는 지금부터 고통을 당합니까?
  - 우리는 이제부터 고통받습니까?
  lexicon: amodo / cruciamur
  rationale: amodo는 ‘이제부터’로, 수동형 cruciamur는 ‘고통을 받다’로 옮겨 현재 진행/시작의 뉘앙스를 유지했습니다.
- source_word: tu autem noli commisceri cum eis
  english_pob_choice: but as for you, do not mingle with them
  chosen_korean: 그러나 당신은 그들과 섞이지 마십시오
  alternatives_korean:
  - 그러나 당신은 그들과 섞이지 말십시오
  - 그러나 당신은 그들과 어울리지 마십시오
  lexicon: tu autem / commisceri
  rationale: tu autem의 강조를 ‘그러나 당신은’으로 살렸고, commisceri는 단순한 접촉보다 결합·동류화를 피하라는 뜻을 반영해 ‘섞이지 마십시오’로 옮겼습니다.
theological_decisions:
- issue: eschatological timing and rhetorical question
  chosen_reading: 문장의 첫 절은 종말적 시기의 도래를 바라는 탄원과, 그 시기와 현재의 고통을 대비하는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 미래 사실을 단정적으로 예고하는 진술
  - 단순히 ‘우리는 곧 고통받는가’라는 비유적 질문
  rationale: veniant와 amodo의 대비를 살리면, 화자는 아직 오지 않은 때를 바라며 현재의 고통을 묻는 구조가 가장 자연스럽습니다.
  doctrine_reference: 2 Esdras의 묵시적 종말론 문맥
