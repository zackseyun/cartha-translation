translation:
  language: ko
  text: 제가 말했습니다[a], 「주님, 어떻게 그럴 수 있습니까?」 그분이 제게 말씀하셨습니다. 「이것만이 아니라, 물으십시오—」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘제가 말했고, “주님, 어떻게 그럴 수 있습니까?” 그분이 제게 말씀하셨습니다. “이것만이 아니라, 땅을 물으십시오. 그러면 그것이 당신에게 말할 것이고, 그것에 구애하십시오. 그러면 그것이 당신에게 밝힐 것입니다.”’
    reason: previous_rendering
lexical_decisions:
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: κύριος / dominus
  rationale: 직접 호칭이므로 현대 한국어 경어에 맞는 「주님」을 사용해 경외와 대화성을 함께 살렸습니다.
- source_word: quomodo poterit?
  english_pob_choice: how can it be?
  chosen_korean: 어떻게 그럴 수 있습니까?
  alternatives_korean:
  - 어찌 가능합니까?
  - 어떻게 될 수 있습니까?
  lexicon: quomodo / poterit
  rationale: 라틴어의 가능성 의문을 자연스러운 현대 문장으로 옮겨, 원문의 당혹과 질문성을 유지했습니다.
- source_word: non hoc solummodo
  english_pob_choice: Not only this
  chosen_korean: 이것만이 아니라
  alternatives_korean:
  - 이것뿐만 아니라
  - 이것만이 아닙니다
  lexicon: non ... solummodo
  rationale: 대답의 전환부를 간결하게 살려 다음 명령으로 이어지는 미완성 구조를 보존했습니다.
- source_word: interroga
  english_pob_choice: ask—
  chosen_korean: 물으십시오—
  alternatives_korean:
  - 질문하십시오—
  - 물어보십시오—
  lexicon: interrogo
  rationale: 명령형을 합쇼체로 옮기되, 영어 POB의 대시를 따라 뒤에 이어질 내용을 예고하는 열린 종결을 유지했습니다.
theological_decisions:
- issue: 이 절의 마지막이 다음 절 내용으로 이어지는 미완성 인용인지 여부
  chosen_reading: 이 절은 「이것만이 아니라, 물으십시오—」로 끝내어 다음 절로 이어지는 열린 구조를 보존했습니다.
  alternative_readings:
  - 다음 절을 보완해 「땅을 물으십시오…」까지 확장한다
  - 문장을 완결형으로 매끈하게 정리한다
  rationale: 제공된 라틴 본문과 최신 수정 이력은 여기서 대답을 끊고 다음 절로 넘기는 구조를 지시하므로, 문맥상 완결보다 연결성을 우선했습니다.
  doctrine_reference: 본문 분절 및 문맥 보존 원칙
