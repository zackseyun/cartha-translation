source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit et dixit: hoc est cogitamentum certaminis, quem certavit qui super terram natus est homo,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/127.yaml
  text: 'And he answered and said[a], “This is the thought of the struggle that the man born on the earth has fought:'
  footnotes:
  - marker: a
    text: Or 'the man born on earth must fight:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 대답하여 말했습니다. 「이것은 땅 위에 태어난 사람이 싸운 싸움에 대한 생각입니다:」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이것은 땅 위에 태어난 사람이 싸워야 할 싸움에 대한 생각입니다:」.
    reason: previous_rendering
lexical_decisions:
- source_word: Et respondit et dixit
  english_pob_choice: And he answered and said
  chosen_korean: 그가 대답하여 말했습니다
  alternatives_korean:
  - 그가 대답하여 말하였습니다
  - 그가 응답하여 말했습니다
  lexicon: respondere / dicere
  rationale: 라틴어의 두 동사를 자연스러운 서술로 살려, 반복을 무리하게 중복하지 않으면서도 응답과 발화를 모두 드러냈습니다.
- source_word: cogitamentum
  english_pob_choice: the thought
  chosen_korean: 생각
  alternatives_korean:
  - 사고
  - 뜻
  - 의도
  lexicon: cogitamentum
  rationale: POB의 'thought'를 따라 내적 숙고나 결론으로 흐르지 않도록, 가장 직접적인 '생각'으로 옮겼습니다.
- source_word: certaminis ... certavit
  english_pob_choice: the struggle ... has fought
  chosen_korean: 싸움의 ... 싸워 온 싸움
  alternatives_korean:
  - 투쟁의 ... 투쟁해 온 투쟁
  - 싸움의 ... 싸워 온 투쟁
  - 경쟁의 ... 경쟁해 온
  lexicon: certamen / certare
  rationale: certamen의 전투적·투쟁적 뉘앙스를 유지하되, certavit를 과거 완료감이 드러나도록 '싸워 온'으로 처리했습니다.
- source_word: qui super terram natus est homo
  english_pob_choice: the man born on the earth
  chosen_korean: 땅 위에 태어난 사람
  alternatives_korean:
  - 땅에서 태어난 사람
  - 지상에 태어난 사람
  - 땅 위에 난 사람
  lexicon: homo / super terram natus
  rationale: 주석된 영어 개정처럼 homo를 특정 인물로 고정하지 않고 일반적 인간을 가리키는 말로 살렸으며, super terram은 직역적으로 '땅 위에'로 옮겼습니다.
theological_decisions:
- issue: homo의 일반성
  chosen_reading: 특정한 '그 사람'이 아니라, 땅 위에 태어난 인간 일반을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 아담 같은 특정 인물로 읽기
  - 메시아적 인물로 읽기
  rationale: 라틴어 homo는 무표지 일반명사이므로, 영어 POB의 수정 취지에 따라 보편적 인간으로 옮겨 apocalyptic struggle의 보편성을 유지했습니다.
  doctrine_reference: 인간 보편성 / 종말론적 संघर्ष의 일반성
