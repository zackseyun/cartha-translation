  text: Et nunc de sermonibus tuis intellege, quoniam dixisti, quia nobiscum crescit sensus;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/071.yaml
  text: And now understand from your own words, because you said that understanding grows with us.
translation:
  language: ko
  text: 이제 당신의 말들에서 깨달으십시오. 당신이 말씀하시기를, 깨달음이 우리와 함께 자란다고 하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘당신의 말들에서 이해하라’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: de sermonibus tuis
  english_pob_choice: from your own words
  chosen_korean: 당신의 말들에서
  alternatives_korean:
  - 당신의 말씀에서
  - 당신의 말로부터
  lexicon: sermones → 말들/말씀
  rationale: sermonibus는 단수적인 ‘말씀’보다 구체적인 발화들을 가리키므로, 반복적·복수적 뉘앙스를 살려 ‘말들’을 선택했습니다.
- source_word: intellege / sensus
  english_pob_choice: understand / understanding
  chosen_korean: 깨달으십시오 / 깨달음
  alternatives_korean:
  - 이해하십시오 / 이해
  - 알아차리십시오 / 알아차림
  lexicon: intelligere → 깨닫다; sensus → 깨달음/이해
  rationale: 단순 인지보다 문맥상 ‘이해에 이르다’는 의미가 강해, 동사와 명사를 모두 ‘깨닫다/깨달음’으로 대응했습니다.
- source_word: nobiscum crescit
  english_pob_choice: grows with us
  chosen_korean: 우리와 함께 자란다
  alternatives_korean:
  - 우리와 함께 성장한다
  - 우리 안에서 자란다
  lexicon: crescere → 자라다/성장하다
  rationale: crescit의 성장 이미지를 직역에 가깝게 살리되, 한국어에서 자연스러운 표현인 ‘우리와 함께 자란다’를 택했습니다.
theological_decisions:
- issue: 직접 화법의 재구성
  chosen_reading: ‘you said that’는 간접화법으로 옮기고, 전체 문장은 청자를 향한 권고형으로 유지했습니다.
  alternative_readings:
  - 직설적 진술형으로 옮김
  - 더 강한 명령형으로 옮김
  rationale: 원문은 전제 설명을 포함한 논증적 진술이므로, 청자를 향한 호소를 살리되 과도한 설교체로 바꾸지 않았습니다.
  doctrine_reference: source fidelity / discourse force
