base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/028.yaml
  text: For my son Jesus will be revealed with those who are with him[a][b], and he will make glad those who remain for four hundred years.
  footnotes:
  - marker: b
    text: 'The Latin has a striking split wording in this passage: 7:28 reads filius meus Iesus (‘my son Jesus’), while 7:29 reads filius meus Christus (‘my son the Messiah’). The passage describes a four-hundred-year reign, then the Messiah’s death, followed by seven days of primeval silence and then resurrection—one of the most striking messianic passages in early Jewish apocalypse.'
    reason: messianic_passage
    anchor_ref: '7:28'
  - marker: a
    text: Or 'and he will make glad those who remain for four hundred years.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 아들 예수께서 그와 함께 있는 이들과 함께 나타나실 것이며, 그분은 남아 있는 이들을 사백 년 동안 기쁘게 하실 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사백 년 동안 남아 있는 이들을 기쁘게 하실 것입니다.’
    reason: alternative_reading
  - marker: b
    text: 라틴어는 이 절에서 ‘내 아들 예수’(7:28)와 다음 절의 ‘내 아들 메시아’(7:29)를 구분하여 사용합니다. 이 단락은 사백 년의 통치, 메시아의 죽음, 그리고 원시적 침묵과 부활을 이어 주는 매우 두드러진 종말론적 본문입니다.
    reason: theological_note
lexical_decisions:
- source_word: Filius meus Iesus
  english_pob_choice: my son Jesus
  chosen_korean: 내 아들 예수
  alternatives_korean:
  - 나의 아들 예수
  - 내 아들 메시아
  lexicon: source proper name + kinship term
  rationale: 라틴어의 직설적 소유 표현 filius meus를 살려 ‘내 아들’로 옮기고, 본문이 7:29의 ‘filius meus Christus’와 구별되므로 여기서는 ‘메시아’로 바꾸지 않았습니다.
- source_word: revelabitur cum his qui cum eo
  english_pob_choice: will be revealed with those who are with him
  chosen_korean: 그와 함께 있는 이들과 함께 나타나실 것이며
  alternatives_korean:
  - 그와 함께 있는 자들과 함께 드러나실 것이며
  - 그와 동행하는 이들과 함께 계시될 것이며
  lexicon: revelabitur = passive/future of reveal; cum his qui cum eo = with those who are with him
  rationale: revelabitur의 수동·미래 의미를 살려 ‘나타나실 것이며’로 옮기고, 동반자 관계를 자연스럽게 ‘그와 함께 있는 이들과 함께’로 표현했습니다.
- source_word: iucundabit
  english_pob_choice: he will make glad
  chosen_korean: 기쁘게 하실 것입니다
  alternatives_korean:
  - 즐겁게 하실 것입니다
  - 마음에 기쁨을 주실 것입니다
  lexicon: iucundare = make glad/rejoice
  rationale: 동사 자체가 ‘기쁘게 하다’의 원인적 의미이므로 감정을 직접 일으키는 표현으로 옮겼습니다.
- source_word: annis quadringentis
  english_pob_choice: for four hundred years
  chosen_korean: 사백 년 동안
  alternatives_korean:
  - 사백 년간
  - 사백 해 동안
  lexicon: ablative of duration of time
  rationale: 라틴어의 기간 부사구를 그대로 기간 표현인 ‘사백 년 동안’으로 옮겨, 기쁨의 지속 기간이 아니라 기쁨을 주시는 기간임을 드러냈습니다.
theological_decisions:
- issue: mesianic identification in 2 Esdras 7:28
  chosen_reading: 본문의 7:28은 ‘내 아들 예수’라고 읽고, 7:29에서만 ‘내 아들 메시아’로 전환되는 본문의 의도적 구별을 유지했습니다.
  alternative_readings:
  - 두 절 모두를 일괄해 ‘메시아’로 평준화함
  - 예수라는 고유명사를 후대 기독론적 의미로 완화함
  rationale: 라틴 본문의 분열된 호칭을 지우면 이 단락의 종말론적·메시아적 긴장이 사라지므로, POB의 audit trail을 따라 구별을 보존했습니다.
  doctrine_reference: early Jewish apocalyptic messianism; textual distinction between 7:28 and 7:29
