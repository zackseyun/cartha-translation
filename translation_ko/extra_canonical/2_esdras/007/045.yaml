lexical_decisions:
- source_word: tibi autem soli
  english_pob_choice: But to you alone
  chosen_korean: 그러나 오직 당신께만
  alternatives_korean:
  - 하지만 오직 당신께만
  - 오직 당신께만
  lexicon: tibi / soli
  rationale: 대조 접속사 autem과 강조 표현 soli를 함께 살려 ‘그러나’와 ‘오직’으로 옮겼고, 대화 상대를 직접 호칭하는 문맥을 따라 ‘당신께만’으로 자연스럽게 표현했습니다.
- source_word: ostendi haec
  english_pob_choice: I showed these things
  chosen_korean: 저는 이 일들을 보였습니다
  alternatives_korean:
  - 제가 이것들을 보였습니다
  - 제가 이 일들을 보여 드렸습니다
  lexicon: ostendere / haec
  rationale: ostendi의 완료형을 서술적 과거로 풀어 ‘보였습니다’로 옮겼고, haec는 문맥상 단순 사물보다 앞선 계시 내용 전체를 가리키므로 ‘이 일들’로 처리했습니다.
- source_word: respondi tunc et dixi ... et nunc dico
  english_pob_choice: Then I answered and said ... and now I say
  chosen_korean: '그러고 나서 제가 대답하여 말하였습니다[a], “주님, 저는 그때 말했고 지금도 말합니다:'
  alternatives_korean:
  - 그때 제가 대답하여 말하고 지금도 말합니다
  - '제가 대답하여 말하였습니다[a], “주님, 저는 그때 말했고 지금도 말합니다:'
  lexicon: tunc / nunc / respondi et dixi
  rationale: 라틴어의 tunc와 nunc가 단순한 시간 표지가 아니라 ‘그때… 지금…’의 대조를 이루므로, 영어 개정안의 취지를 따라 ‘그때 말했고 지금도 말합니다’로 긴장감을 살렸습니다.
theological_decisions:
- issue: 예언자/대화체 인용 안에서의 호칭과 시제 대비
  chosen_reading: 주님, 저는 그때 말했고 지금도 말합니다
  alternative_readings:
  - 주님, 그때 제가 말했고 지금도 말합니다
  - 주님, 그때 말하였고 지금도 말합니다
  rationale: 본 절은 자기 진술의 반복과 현재성을 강조하는 수사이므로, 한국어에서도 과거-현재 대비가 분명하게 드러나도록 하였습니다.
  doctrine_reference: 문학적·수사적 대비를 보존하는 번역 원칙
