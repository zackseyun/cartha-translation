source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non esse natum, ut non sensus inde fieret. Nunc autem nobiscum crescit sensus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/064.yaml
  text: But now understanding grows with us[a], and because of this we are tormented, because we perish knowing it.
  footnotes:
  - marker: a
    text: Or 'because though we know, we perish.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 이제는 우리 안에서 인식이 자라났고, 그 때문에 우리는 멸망한다는 것을 아는 채로 멸망하므로 고통을 받습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리는 멸망한다는 것을 알고 멸망하기 때문에.’
    reason: 라틴어 scientes perimus의 상황적 분사를 한국어에서 달리 연결한 표현입니다. 양보적 의미는 아닙니다.
lexical_decisions:
- source_word: Nunc autem
  english_pob_choice: But now
  chosen_korean: 그러나 이제는
  alternatives_korean:
  - 그런데 이제는
  - 하지만 지금은
  lexicon: n/a
  rationale: 대조 접속과 현재 전환을 살리되, 문맥의 논증 흐름에 맞게 자연스럽게 옮겼습니다.
- source_word: nobiscum crescit sensus
  english_pob_choice: understanding grows with us
  chosen_korean: 우리와 함께 이해가 자라나기 때문에
  alternatives_korean:
  - 우리와 함께 이해가 커지기 때문에
  - 우리 안에서 인식이 자라기 때문에
  lexicon: sensus
  rationale: sensus를 단순한 지식보다 더 넓은 ‘이해/지각’으로 보고, 성장 이미지를 유지하여 본문의 대비를 살렸습니다.
- source_word: ut ... fieret / scientes perimus
  english_pob_choice: because we perish knowing it
  chosen_korean: 그것을 알면서도 멸망하므로
  alternatives_korean:
  - 그것을 알기에 멸망하므로
  - 그 사실을 아는 채로 죽어 가므로
  lexicon: sensus / scientes
  rationale: POB의 수정 취지대로 concessive ‘though we know’가 아니라, ‘알면서도’라는 동시적·상황적 인식을 반영했습니다.
- source_word: torquemur
  english_pob_choice: we are tormented
  chosen_korean: 고통을 받습니다
  alternatives_korean:
  - 괴로움을 당합니다
  - 고문을 받습니다
  lexicon: torqueo
  rationale: 라틴어의 수동적 고통 의미를 살리되, 한국어에서 과도하게 형벌적이거나 물리적인 느낌을 피하면서 본문의 절망감을 전달했습니다.
theological_decisions:
- issue: 인간 인식(sensus)의 비극성
  chosen_reading: 본절은 지식 자체를 선한 것으로 단순 칭찬하지 않고, 죽음을 자각하게 만드는 인간적 인식이 고통의 원인이 된다는 역설을 말합니다.
  alternative_readings:
  - 단순히 '지혜가 자란다'는 중립적 진술
  - 지식이 있으나 실패했다는 도덕적 비난
  rationale: 수정된 영어 주해가 보여 주듯, 본문은 ‘알고도 멸망한다’는 도식이 아니라 ‘알기 때문에 멸망이 더 괴롭다’는 논지를 전개합니다.
  doctrine_reference: 인간 조건과 죽음 인식에 대한 지혜문학적 성찰
