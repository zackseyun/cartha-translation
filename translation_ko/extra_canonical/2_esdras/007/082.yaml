translation:
  language: ko
  text: 두 번째 길은, 그들이 살 수 있도록 올바른 회개를 할 수 없기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Secunda uia
  english_pob_choice: The second way
  chosen_korean: 두 번째 길입니다
  alternatives_korean:
  - 둘째 길입니다
  - '두 번째 길:'
  - 두 번째 길
  lexicon: way
  rationale: 라틴어 uia를 문맥상 ‘길’로 옮기고, 번호를 자연스러운 현대 한국어 어순으로 처리했습니다.
- source_word: non possunt
  english_pob_choice: cannot now make
  chosen_korean: 이제 … 할 수 없기 때문입니다
  alternatives_korean:
  - …할 수 없기 때문입니다
  - 지금은 …할 수 없기 때문입니다
  lexicon: cannot
  rationale: PB OB의 ‘now’는 본문 라틴어에 명시적 시간 부사가 없다는 수정 이력도 있으므로, ‘이제’로 완곡하게 시간성을 살리되 과도한 추가는 피했습니다.
- source_word: reuersionem bonam facere
  english_pob_choice: make a good repentance
  chosen_korean: 좋은 회개를 하다
  alternatives_korean:
  - 올바른 회개를 하다
  - 온전한 회개를 하다
  lexicon: repentance
  rationale: reversionem bonam을 직역해 ‘좋은 회개’로 두어, 회개의 질적 평가라는 문법 구조를 보존했습니다.
theological_decisions:
- issue: ‘살다’의 목적구조
  chosen_reading: ‘좋은 회개를 할 수 없기 때문입니다’ 뒤에 ‘살 수 있도록’을 붙여, 회개의 목적이 생명에 이른다는 source의 인과를 드러냈습니다.
  alternative_readings:
  - ‘살기 위해’
  - ‘생명에 이르도록’
  rationale: 영문 POB의 ‘so as to live’는 단순 결과가 아니라 목적/귀결 구조를 가지므로, 한국어에서도 목적성을 유지했습니다.
  doctrine_reference: 4 Ezra 7:82 문맥
- issue: 현재성 표현
  chosen_reading: ‘이제’라는 표현을 사용해 현재의 불가능성을 드러냈습니다.
  alternative_readings:
  - 아예 현재 부사를 두지 않음
  - ‘지금은’
  rationale: 최신 수정은 라틴어에 직접 대응하는 시간 부사가 없음을 인정하지만, 문맥상 죽음 이후의 상태를 가리키므로 한국어에서 최소한의 현재성 표지를 허용했습니다.
  doctrine_reference: 4 Ezra 7:82 문맥
