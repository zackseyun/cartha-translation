  source_fidelity: 라틴어의 핵심 구문은 `Secunda uia, quoniam non possunt reuersionem bonam facere ut uiuant`(제시문은 `re-`에서 절단됨)입니다. `non possunt`에는 `nunc`/`iam` 같은 시간 부사가 없으므로 ‘이제’를 본문에 넣는 것은 문맥상 추론을 본문 표현으로 추가하는 것입니다. ‘살 수 있도록’은 `ut uiuant`의 목적을 적절히 보존합니다.
  naturalness: ‘두 번째 길입니다’보다 열거 항목을 설명하는 ‘두 번째 길은,’이 자연스럽습니다. ‘좋은 회개’는 직역투이므로, 회개의 질적 한정을 자연스러운 현대 한국어로 나타내는 ‘올바른 회개’가 적절합니다.
  terminology: '`reuersio`는 이 문맥에서 ‘회개’로 옮길 수 있습니다. ‘올바른 회개’는 `bonam`의 질적 수식을 보존하면서도 특정 교리적 정의를 덧붙이지 않습니다.'
