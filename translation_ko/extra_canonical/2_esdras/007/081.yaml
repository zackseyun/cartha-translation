translation:
  language: ko
  text: 그들은 들어가겠지만, 이제부터는 고통 속에서 떠돌며, 늘 슬퍼하고 비통해할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: cruciamentis는 문맥상 단순한 ‘고통’보다 강한 ‘고문/형벌의 고통’을 포함할 수 있습니다.
