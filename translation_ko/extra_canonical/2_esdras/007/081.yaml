  to: 그들은 들어가지 못하고, 이제부터 고통 속에서 떠돌며, 언제나 괴로워하고 슬퍼할 것입니다.
  rationale: 전절에 속한 non의 통사적 효력을 한국어에 명시하여 절 분할로 인해 생기는 역의미를 막았습니다. 지속성(amodo, semper), 형벌의 상태(in cruciamentis), 그리고 두 겹의 슬픔(dolentes et tristes)은 유지했습니다. 본문 의미를 확장하지 않는 한편, 필수적이지 않은 각주는 삭제했습니다.
