lexical_decisions:
- source_word: ingredientur
  english_pob_choice: enter
  chosen_korean: 들어가겠지만
  alternatives_korean:
  - 들어가지만
  - 들어가게 되겠지만
  lexicon: 입장/진입
  rationale: 라틴어 ingredientur는 문맥상 ‘들어가다’이므로, 앞 절과 이어지는 역접을 살려 ‘들어가겠지만’으로 옮겼습니다.
- source_word: uagantes erunt
  english_pob_choice: they will wander
  chosen_korean: 떠돌며
  alternatives_korean:
  - 방황하며
  - 유랑하며
  lexicon: 방황/유랑
  rationale: uagantes는 단순 이동이 아니라 정처 없이 헤매는 상태를 가리키므로, 심판의 고통 속에서의 불안정성을 드러내는 ‘떠돌며’가 적절합니다.
- source_word: in cruciamentis
  english_pob_choice: in torments
  chosen_korean: 고통 속에서
  alternatives_korean:
  - 고문 속에서
  - 형벌 가운데
  lexicon: 고통/고뇌
  rationale: cruciamentis는 극심한 고통과 고문을 아우를 수 있으나, 여기서는 형벌의 상태를 포괄하는 ‘고통 속에서’가 한국어로 가장 자연스럽고 원문에도 충실합니다.
- source_word: dolentes semper et tristes
  english_pob_choice: always grieving and sad
  chosen_korean: 늘 슬퍼하고 비통해할 것입니다
  alternatives_korean:
  - 항상 애통하며 슬퍼할 것입니다
  - 늘 근심하고 슬퍼할 것입니다
  lexicon: 슬픔/비통
  rationale: dolentes와 tristes의 중첩을 살려 단순한 ‘슬픔’보다 강한 정서적 상태를 드러내는 ‘비통해하다’를 함께 사용했습니다.
theological_decisions:
- issue: 미래 심판의 지속성과 정서적 중첩 표현
  chosen_reading: ‘고통 속에서 떠돌며, 늘 슬퍼하고 비통해할 것입니다’로 심판의 상태가 단발적 사건이 아니라 지속적 형벌과 정서적 고통임을 드러냈습니다.
  alternative_readings:
  - ‘고통 가운데 방황할 것이며, 늘 슬퍼할 것입니다’
  - ‘고문 속을 떠돌며, 항상 비탄에 잠길 것입니다’
  rationale: 라틴어의 amodo(이제부터), semper(늘), 그리고 dolentes… et tristes의 반복적 정서를 함께 반영해야 문맥의 지속적 형벌성이 보존됩니다.
  doctrine_reference: 종말론적 심판과 형벌의 지속성
