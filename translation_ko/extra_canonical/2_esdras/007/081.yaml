review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 이 절의 ingredientur 앞에는 바로 앞 절(7:80)의 non이 걸려 있으므로, 현행의 ‘들어가겠지만’은 한국어로 긍정 진입을 뜻하여 문맥상 원문의 ‘들어가지 못하고’와 반대가 됩니다. amodo, in cruciamentis, dolentes semper et tristes는 각각 ‘이제부터’, ‘고통 속에서’, ‘언제나 괴로워하고 슬퍼하며’로 충실히 반영할 수 있습니다.
  naturalness: ‘들어가지 못하고, 이제부터 고통 속에서 떠돌며, 언제나 괴로워하고 슬퍼할 것입니다’는 앞 절에서 이어지는 부정을 자연스럽게 보충하면서 현대 한국어 합쇼체로 매끄럽습니다.
  terminology: cruciamentis는 문맥상 형벌적 고통을 가리키지만, 본문에서는 교리적으로 과도하게 특정하지 않는 ‘고통’이 적절합니다. dolentes와 tristes의 병렬은 ‘괴로워하고 슬퍼하며’로 구별해 옮깁니다.
  issues:
  - severity: high
    issue: 앞 절의 부정(non)이 반영되지 않아 ‘들어가겠지만’이 긍정 진입으로 읽힙니다.
    rationale: 제시된 라틴어는 7:80의 non으로 시작된 문장을 완결합니다. 영어 감사본의 절 단위 ‘enter, but’도 이 전절 의존성을 전제합니다. 한국어에서는 부정을 보충하지 않으면 뜻이 반대로 전달됩니다.
  - severity: low
    issue: 각주가 본문 끝에 달려 있어 cruciamentis에 대한 주석의 지시 대상이 불분명합니다.
    rationale: 각주를 유지할 필수성은 낮으며, ‘고통’은 본문만으로 충분히 번역됩니다. 불필요한 어휘 가능성 주석은 삭제하는 편이 명료합니다.
  revised_text: 그들은 들어가지 못하고, 이제부터 고통 속에서 떠돌며, 언제나 괴로워하고 슬퍼할 것입니다.
