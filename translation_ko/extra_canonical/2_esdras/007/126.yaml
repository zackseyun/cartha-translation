id: 2ES.7.126
reference: 2 Esdras 7:126
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non enim cogitavimus viventes quando iniquitatem faciebamus, quidincipientes post mortem pati.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/126.yaml
  text: For while we lived and committed iniquity[a], we did not consider what we would begin to suffer after death.”
  footnotes:
  - marker: a
    text: Or 'would have to suffer'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 살아 있는 동안 불의를 행할 때에, 죽은 뒤에 우리가 무엇을 겪기 시작하게 될지를 생각하지 않았습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘겪어야 할’.
    reason: previous_rendering
lexical_decisions:
- source_word: Non enim cogitavimus viventes
  english_pob_choice: For while we lived
  chosen_korean: 우리가 살아 있는 동안
  alternatives_korean:
  - 우리가 살면서
  - 살아 있을 때 우리는
  lexicon: viventes
  rationale: 현재 생존 상태를 배경 절로 자연스럽게 드러내기 위해 ‘살아 있는 동안’으로 옮겼습니다.
- source_word: iniquitatem faciebamus
  english_pob_choice: committed iniquity
  chosen_korean: 불의를 행하였으나
  alternatives_korean:
  - 죄악을 저질렀으나
  - 불법을 행하였으나
  lexicon: iniquitas
  rationale: Latin iniquitatem은 단순한 법 위반보다 도덕적·하나님 앞의 불의를 가리키므로 ‘불의’가 가장 직접적입니다.
- source_word: quid incipientes
  english_pob_choice: would begin to suffer
  chosen_korean: 무엇을 겪기 시작하게 될지는
  alternatives_korean:
  - 무엇을 겪기 시작할지를
  - 무엇을 당하기 시작할지를
  lexicon: incipientes
  rationale: POB의 수정본처럼 inceptive 의미를 살려 ‘시작하게 될’로 옮기고, 뒤따르는 내용이 미정의 고난임을 포괄적으로 ‘무엇을 겪다’로 처리했습니다.
- source_word: post mortem pati
  english_pob_choice: after death
  chosen_korean: 죽은 뒤에
  alternatives_korean:
  - 죽음 이후에
  - 사후에
  lexicon: post mortem
  rationale: 라틴어의 시간적 순서를 한국어 구어체보다 문어적으로 유지하면서도 의미를 분명히 하기 위해 ‘죽은 뒤에’로 옮겼습니다.
theological_decisions:
- issue: 사후 고난의 시작을 나타내는 inceptive 뉘앙스
  chosen_reading: ‘겪기 시작하게 될’로 번역해 죽음 이후 고난의 개시를 분명히 했습니다.
  alternative_readings:
  - ‘겪게 될’
  - ‘겪어야 할’
  rationale: 검토 기록이 지적하듯 본문의 핵심은 의무가 아니라 시작점입니다. 그래서 ‘해야 한다’류의 의무 표현을 피하고, 사후 상태의 개시를 그대로 드러냈습니다.
  doctrine_reference: 4 Ezra의 종말론적 사후 형벌 묘사
