  to: 우리는 살아 있는 동안 불의를 행할 때에, 죽은 뒤에 우리가 무엇을 겪기 시작하게 될지를 생각하지 않았습니다.”[a]
  rationale: 시간 관계를 나타내는 quando와 미완료 과거 faciebamus를 ‘살아 있는 동안 불의를 행할 때에’로 반영하고, 죽음 이후에 시작될 경험이라는 incipere의 의미는 ‘겪기 시작하게 될’로 유지했습니다. 각주는 이전 영어 표현의 의무적 대안을 짧게 제시하도록 정리했습니다.
