review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실하며, 사후 고난의 ‘시작’이라는 incipere의 inceptive 의미도 보존합니다. 다만 faciebamus는 배경적으로 반복·지속되는 행위를 나타내므로 ‘행하였으나’보다 ‘행할 때에’가 quando와 함께 원문의 시간 관계를 더 직접적으로 반영합니다.
  naturalness: ‘무엇을 겪기 시작하게 될지는’도 이해되지만, 주어를 보충하고 목적절을 ‘무엇을 겪기 시작하게 될지를’로 정리하면 현대 한국어 문장 흐름이 더 자연스럽고 명료합니다.
  terminology: ‘불의’는 iniquitas에 적절하며, ‘죽은 뒤’도 post mortem의 평이하고 정확한 표현입니다. 본문은 의무가 아니라 고난의 개시를 말하므로 본문에는 ‘겪기 시작하게 될’이 적절합니다. 각주에서는 영어 감사 기록의 대안적 의무 표현만 간결하게 제시합니다.
  issues:
