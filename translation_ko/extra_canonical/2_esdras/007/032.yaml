id: 2ES.7.32
reference: 2 Esdras 7:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et terra reddet qui in eam dormiunt, et pulvis qui in eo silentio habitant, et promptuaria reddent quae eis commendatae sunt animae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/032.yaml
  text: And the earth will give back those who sleep in it[a], and the dust those who dwell in it in silence, and the storehouses will give back the souls entrusted to them.
  footnotes:
  - marker: a
    text: Or 'those who dwell in silence in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅은 그 안에서 잠자는 자들을 돌려주고, 티끌은 그 안에서 침묵 가운데 사는 자들을[a] 돌려주며, 저장고들은 자신들에게 맡겨진 영혼들을 돌려줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘침묵 가운데 그 안에 사는 자들’로도 옮길 수 있습니다.
    reason: 라틴어 qui in eo silentio habitant의 전치사구 어순을 달리 반영한 번역입니다.
lexical_decisions:
- source_word: terra reddet qui in eam dormiunt
  english_pob_choice: the earth will give back those who sleep in it
  chosen_korean: 땅은 그 안에서 잠자는 자들을 돌려주고
  alternatives_korean:
  - 땅은 그 안에서 잠드는 자들을 돌려주고
  - 땅은 그 안에 잠든 이들을 돌려주고
  lexicon: terra = 땅; reddet = 돌려주다/되돌려주다; dormiunt = 잠자는
  rationale: Latin의 병렬 구조를 살리기 위해 ‘돌려주다’를 사용했고, dormiunt는 현재적 지속을 살려 ‘잠자는 자들’로 옮겼습니다.
- source_word: pulvis qui in eo silentio habitant
  english_pob_choice: the dust those who dwell in it in silence
  chosen_korean: 티끌은 그 안에서 침묵 가운데 사는 자들을 돌려주며
  alternatives_korean:
  - 티끌은 그 안에서 침묵 속에 사는 자들을 돌려주며
  - 티끌은 그 안에 침묵 가운데 거하는 자들을 돌려주며
  lexicon: pulvis = 티끌; silentio = 침묵 가운데/침묵 속에; habitant = 사는/거하는
  rationale: pulvis를 ‘티끌’로, silentio를 상태 표현인 ‘침묵 가운데’로 옮겨 죽음의 정적을 드러냈습니다.
- source_word: promptuaria reddent quae eis commendatae sunt animae
  english_pob_choice: the storehouses will give back the souls entrusted to them
  chosen_korean: 곳간들은 자기들에게 맡겨진 영혼들을 돌려줄 것입니다
  alternatives_korean:
  - 곳간들은 그들에게 맡겨진 영혼들을 돌려줄 것입니다
  - 저장고들은 자신들에게 맡겨진 혼들을 돌려줄 것입니다
  lexicon: promptuaria = 곳간/저장고; commendatae sunt = 맡겨진; animae = 영혼들
  rationale: promptuaria는 저장의 장소라는 기본 의미를 살려 ‘곳간들’로 옮겼고, animae는 본문 맥락상 ‘영혼들’이 가장 직역적입니다.
theological_decisions:
- issue: 죽음 이후의 회복을 ‘돌려주다’로 표현하는 문제
  chosen_reading: 본문의 세 주체(땅, 티끌, 곳간)가 각각 맡은 자들을 ‘돌려준다’는 동일한 동사를 유지했습니다.
  alternative_readings:
  - ‘내어주다’로 완화하기
  - ‘되찾아 주다’로 의미를 보충하기
  rationale: 라틴어 reddet의 반복과 심판/종말의 응답 구조를 보존하기 위해 동일 동사를 유지하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 종말론적 부활/회수 이미지
- issue: animae를 ‘영혼들’로 번역하는 문제
  chosen_reading: animae는 여기서 개별 인격의 비물질적 생명 주체를 가리키는 표준적인 ‘영혼들’로 옮겼습니다.
  alternative_readings:
  - ‘혼들’로 옮기기
  - ‘생명들’로 옮기기
  rationale: 문맥상 매장된 존재 전체보다 그 존재의 생명/자아를 가리키는 표현이므로, 한국어 성서 문체에서 가장 직접적인 ‘영혼들’이 적절합니다.
  doctrine_reference: 인간의 영혼과 사후 보존에 대한 묘사
