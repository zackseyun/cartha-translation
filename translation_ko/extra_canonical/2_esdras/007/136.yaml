id: 2ES.7.136
reference: 2 Esdras 7:136
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multae misericordiae, quoniam multiplicat magis misericordias his qui praesentes sunt et qui praeterierunt et qui futuri sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/136.yaml
  text: and of great mercy[a], because he multiplies mercies for those who are present and those who have passed away and those who are to come.
  footnotes:
  - marker: a
    text: Or 'rich in mercies because he multiplies mercies more and more'.
    reason: previous_rendering
translation:
  language: ko
  text: 또한 자비가 크시며[a], 지금 있는 이들과 이미 지나간 이들과 장차 올 이들을 위해 자비를 더욱 많이 베푸십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자비가 풍성하시며, 자비를 더욱 많이 베푸신다’.
    reason: 라틴어 multae misericordiae의 직역에 가까운 ‘많은/풍성한 자비’와 multiplicat magis의 강화된 표현을 반영한 대안 번역입니다.
lexical_decisions:
- source_word: multae misericordiae
  english_pob_choice: and of great mercy
  chosen_korean: 큰 자비가 있으시며
  alternatives_korean:
  - 많은 자비가 있으시며
  - 풍성한 자비가 있으시며
  lexicon: misericordia
  rationale: multae misericordiae는 단순한 ‘많은’보다 양적·질적 풍성함을 함께 드러내는 관용적 표현이므로, 현대 한국어에서는 ‘큰 자비’로 자연스럽게 옮겼습니다.
- source_word: multiplicat magis misericordias
  english_pob_choice: he multiplies mercies
  chosen_korean: 자비를 더욱 더하십니다
  alternatives_korean:
  - 자비를 거듭 더하십니다
  - 자비를 더욱 많게 하십니다
  lexicon: multiplico / magis
  rationale: multiplicat magis는 ‘자비를 증식한다’는 뜻을 살리되, 한국어에서 중복을 피하면서도 누적·강화의 의미가 드러나도록 ‘더하십니다’로 처리했습니다.
- source_word: his qui praesentes sunt et qui praeterierunt et qui futuri sunt
  english_pob_choice: for those who are present and those who have passed away and those who are to come
  chosen_korean: 현재 있는 사람들과 이미 지나간 사람들과 장차 올 사람들을 위하여
  alternatives_korean:
  - 지금 있는 이들과 지나간 이들과 장차 올 이들을 위하여
  - 현재에 있는 자들과 이미 지나간 자들과 장차 올 자들을 위하여
  lexicon: praesentes / praeterierunt / futuri
  rationale: 세 시제의 사람들을 균형 있게 드러내기 위해 직역적 배열을 유지하되, 현대 한국어 어법에 맞게 ‘현재 있는 / 이미 지나간 / 장차 올’로 다듬었습니다.
theological_decisions:
- issue: 하나님의 자비의 시간적 범위
  chosen_reading: 자비가 현재, 과거, 미래의 사람들에게까지 모두 미친다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 시대마다 자비를 더하신다는 뜻으로 제한적으로 읽기
  - 구원사적 시대 구분을 암시하는 표현으로 풀기
  rationale: 라틴어 원문은 현재·지나감·장차 옴의 세 범주를 병렬로 두어 자비의 보편적·시간적 포괄성을 강조하므로, 그 긴장을 보존하는 쪽이 적절합니다.
  doctrine_reference: 하나님의 자비의 보편성과 지속성
