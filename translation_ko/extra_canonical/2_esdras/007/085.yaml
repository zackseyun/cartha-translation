lexical_decisions:
- source_word: Quinta uia
  english_pob_choice: The fifth way
  chosen_korean: 다섯째 길은
  alternatives_korean:
  - 다섯 번째 길은
  - 다섯째 방면은
  lexicon: n/a
  rationale: Latin의 quinta uia는 순서를 표시하는 표현이므로, 한국어에서는 자연스러운 서술형 도입문으로 옮겼습니다.
- source_word: uidentes
  english_pob_choice: they see
  chosen_korean: 보는 것입니다
  alternatives_korean:
  - 봅니다
  - 보게 됩니다
  lexicon: n/a
  rationale: 문맥상 열거되는 ‘길’의 설명이므로, 종결형보다 명사절화하여 문장 흐름을 살렸습니다.
- source_word: aliorum habitaculum
  english_pob_choice: the dwelling place of the others
  chosen_korean: 다른 이들의 거처
  alternatives_korean:
  - 다른 이들의 거주지
  - 다른 이들의 거처들
  lexicon: n/a
  rationale: habitaculum이 단수이므로 단수로 유지했고, POB의 revision pass가 반영한 것처럼 ‘dwelling place’의 자연스러운 대응으로 ‘거처’를 택했습니다.
- source_word: ab angelis conseruari
  english_pob_choice: guarded by angels
  chosen_korean: 천사들에게 지켜지고 있는
  alternatives_korean:
  - 천사들에 의해 지켜지는
  - 천사들이 지키고 있는
  lexicon: n/a
  rationale: conseruari는 수동적 보존·보호의 뜻이므로 ‘지켜지고 있는’으로 옮겨 현재 진행되는 보존 상태를 드러냈습니다.
theological_decisions:
- issue: 여기서의 '다른 이들'과 '거처'가 가리키는 범위
  chosen_reading: 본문이 말하는 것은 의인들의 공동 거처를 천사들이 보호하는 장면으로, 추가 해석을 붙이지 않고 그대로 제시했습니다.
  alternative_readings:
  - 천상적 거주지로 확대 해석
  - 개별 주거들로 복수화
  rationale: 제공된 라틴어는 단수 habitaculum을 쓰고 있어 집합적 거처를 가리키며, 이전의 복수형과 구별되는 점을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 맥락 보존
