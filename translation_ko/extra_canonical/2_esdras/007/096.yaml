id: 2ES.7.96
reference: 2 Esdras 7:96
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quomodo corruptibile effugerint nunc, et futurum quomodo hereditatem possidebuut, adhuc autem uidentes angustum et [labore] plenum, quoniam liberati sunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/096.yaml
  text: 'The fifth order: they rejoice that they have now escaped what is corruptible[a], and how they will inherit what is to come, while still seeing the narrow and toil-filled way, because they have been delivered.'
  footnotes:
  - marker: a
    text: Or 'that they have now escaped what is corruptible, and how they will inherit'.
    reason: previous_rendering
translation:
  language: ko
  text: 다섯째 무리는 이제 썩어 없어질 것을 벗어났다는 것과, 장차 올 것을 어떻게 상속하게 될지를 기뻐하며, 여전히 좁고 수고로 가득한 길을 보는데, 이는 그들이 구출되었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: corruptibile는 ‘썩어 없어질 것’의 뜻을 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: corruptibile effugerint
  english_pob_choice: they have now escaped what is corruptible
  chosen_korean: 이제 썩어 없어질 것을 벗어났다는 것
  alternatives_korean:
  - 이제 썩을 것을 피했다는 것
  - 이제 부패할 것을 벗어났다는 것
  lexicon: corruptibile
  rationale: 라틴어 corruptibile은 단순히 ‘망가질 수 있는’보다 ‘썩어 없어질 수 있는/가변적이고 소멸할 것’의 의미가 강해, 소멸성과 부패성을 함께 드러내는 표현을 택했습니다.
- source_word: futurum ... hereditatem possidebuut
  english_pob_choice: that they will inherit what is to come
  chosen_korean: 장차 올 것을 어떻게 상속하게 될지를
  alternatives_korean:
  - 장차 올 것을 상속할지를
  - 미래의 유산을 차지하게 될지를
  lexicon: hereditatem possidebuut
  rationale: 상속의 대상이 단순한 물건이 아니라 ‘장차 올 것’으로 제시되므로, 미래성을 살리면서도 상속 동사를 유지해 POB의 해석 방향을 반영했습니다.
- source_word: angustum et [labore] plenum
  english_pob_choice: the narrow and toil-filled way
  chosen_korean: 좁고 수고로 가득한 길
  alternatives_korean:
  - 좁고 수고가 가득한 길
  - 좁고 고된 길
  lexicon: angustum / labore plenum
  rationale: angustum은 공간적 ‘좁음’을, labore plenum은 ‘수고로 가득함’을 뜻하므로, 두 형용구를 병렬로 살려 길의 곤란함을 직접적으로 표현했습니다.
- source_word: quoniam liberati sunt
  english_pob_choice: because they have been delivered
  chosen_korean: 이는 그들이 구출되었기 때문입니다
  alternatives_korean:
  - 이는 그들이 해방되었기 때문입니다
  - 왜냐하면 그들이 구원받았기 때문입니다
  lexicon: liberati sunt
  rationale: liberati sunt는 단순한 심리적 자유가 아니라 외부의 억압에서 풀려난 상태를 가리키므로, 문맥상 ‘구출되다’가 가장 직접적입니다.
theological_decisions:
- issue: fifth order의 표지 방식
  chosen_reading: 다섯째 무리
  alternative_readings:
  - 다섯째 차례
  - 다섯 번째 순서
  rationale: 본문의 열거 표지는 독자에게 순번을 분명히 알리되, 한국어에서 자연스러운 집합 명사 ‘무리’를 써서 장면의 목소리를 살렸습니다.
  doctrine_reference: 문학적 서술 구조
