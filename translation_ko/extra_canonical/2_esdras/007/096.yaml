  source_fidelity: 수정이 필요합니다. 라틴어의 병렬된 두 간접의문/내용절(quomodo ... et ... quomodo ...)은 문맥상 각각 ‘어떻게’로도 읽힐 수 있으나, 제공된 영어 POB 감사 이력은 둘을 내용절로 처리하도록 확정했습니다. 현 번역은 첫 절은 ‘~다는 것’, 둘째 절은 ‘어떻게 ~될지’로 비병렬적으로 옮겼습니다. 또한 ‘이는 그들이 구출되었기 때문입니다’는 앞의 ‘길을 보는데’에 부자연스럽게 연결됩니다.
  naturalness: ‘벗어났다는 것과 ... 상속하게 될지를 기뻐하며’는 병렬 구조가 매끄럽지 않습니다. 두 절을 같은 내용절로 정리하고, 원문의 다소 압축적인 인과 관계는 문장을 나누어 보존하는 편이 자연스럽습니다.
  terminology: ‘썩어 없어질 것’, ‘장차 올 것’, ‘상속받다’, ‘좁고 수고로 가득한 길’, ‘구출되다’는 현대 한국어 및 본문의 종말론적 어휘에 대체로 적절합니다. ‘다섯째 무리’보다 열거된 범주를 가리키는 ‘다섯째 부류’가 더 중립적입니다.
  issues:
