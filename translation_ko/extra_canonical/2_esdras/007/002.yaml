  text: And he said to me, “Rise, Ezra, and hear the words that I have come to speak to you.”
translation:
  language: ko
  text: 그가 내게 말했습니다. “일어나십시오, 에스라여. 내가 그대에게 하려고 온 말을 들으십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: surge
  english_pob_choice: Rise
  chosen_korean: 일어나라
  alternatives_korean:
  - 일어나십시오
  - 일어서십시오
  - 일어나세요
  lexicon: surge
  rationale: 원문의 짧은 명령형을 그대로 살리되, 대화문 안에서는 직접적이고 자연스러운 권고/명령으로 ‘일어나라’를 택했습니다.
- source_word: audi sermones
  english_pob_choice: hear the words
  chosen_korean: 그 말들을 들으라
  alternatives_korean:
  - 그 말씀들을 들으라
  - 그 말을 들어라
  - 말씀을 들으라
  lexicon: audi
  rationale: sermones는 단수적 ‘말’보다 복수적 ‘말들’이 더 가깝고, 원문의 특정 발화를 가리키므로 일반적 ‘말씀’보다 직접적인 표현을 유지했습니다.
- source_word: veni loqui ad te
  english_pob_choice: I have come to speak to you
  chosen_korean: 내가 너에게 말하러 온
  alternatives_korean:
  - 내가 너에게 말하려고 온
  - 내가 너에게 말하려 온
  - 내가 너에게 하려고 온
  lexicon: veni + loqui
  rationale: ‘오다 + 말하다’의 목적 구문을 한국어의 자연스러운 동사구로 옮겨, 발화 행위가 목적임을 분명히 했습니다.
- source_word: ad me
  english_pob_choice: to me
  chosen_korean: 제게
  alternatives_korean:
  - 나에게
  - 내게
  - 저에게
  lexicon: ad + pronoun
  rationale: 화자와의 직접 대화 맥락에서 표준적이고 매끄러운 1인칭 간접목적어로 ‘제게’를 선택했습니다.
theological_decisions:
- issue: 직접 인용문 안의 명령형 어조
  chosen_reading: 에스라에게 주어지는 직접적 명령을 살려 반말체 명령형을 유지했습니다.
  alternative_readings:
  - 공손한 명령형으로 완화하여 ‘일어나십시오’로 옮김
  - 서술형으로 완화하여 ‘일어날 때입니다’로 옮김
  rationale: 원문은 분명한 직접 명령이므로, 한국어에서도 위계와 호소력을 유지하는 편이 본문 효과를 더 정확히 반영합니다.
  doctrine_reference: source-priority / speech-register fidelity
