  terminology: 에스라(Ezra)는 통용 표기를 유지했습니다. sermones에는 원문에 없는 경칭을 덧붙이지 않고 ‘말’을 사용했습니다. 호칭 ‘에스라여’와 ‘그대’는 격식 있는 직접 خطاب에 적합합니다.
