reference: 2 Esdras 7:98
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: incipient stellarum adsimilarí lumini, amodo non corrupti. Septimus ordo, qui est omnibus supradictis maior, quoniam exultabunt cum fiducia et quoniam confidebunt non confusi, et gaudebunt non reuerentes, festinant enim uidere uultum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/098.yaml
  text: 'The seventh order[a], which is greater than all the orders mentioned above: they will exult with confidence, and trust without being put to shame, and rejoice without fear, for they hasten to see the face of him whom they served while living, and from whom they, being glorified, are to receive their reward.'
  footnotes:
  - marker: a
    text: Or 'from whom they are to receive their glorious reward.'.
    reason: previous_rendering
translation:
  language: ko
  text: 일곱째 등급[a]은 앞에서 언급한 모든 등급보다 더 큽니다. 그들은 확신을 가지고 크게 기뻐하며, 수치를 당하지 않고 신뢰하고, 두려움 없이 즐거워할 것입니다. 그들은 살아 있을 때 섬겼던 분의 얼굴을 보려고 서두르며, 영광을 입은 그들이 그분에게서 상급을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘앞에서 언급한 모든 등급보다 더 큰 일곱째 등급’으로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Septimus ordo
  english_pob_choice: The seventh order
  chosen_korean: 일곱째 무리
  alternatives_korean:
  - 일곱째 질서
  - 일곱째 계열
  - 일곱째 순서
  lexicon: ordo
  rationale: 문맥상 천상적 등급/무리를 가리키므로, 한국어에서는 읽기 자연성과 상층 구조를 함께 살려 ‘무리’로 옮겼습니다.
- source_word: exultabunt cum fiducia
  english_pob_choice: they will exult with confidence
  chosen_korean: 확신으로 기뻐하고
  alternatives_korean:
  - 확신 가운데 크게 기뻐하고
  - 확신을 가지고 환호하고
  lexicon: exultare / fiducia
  rationale: 라틴어의 기쁨과 자신감을 함께 담아, 과도한 해석 없이 한국어로 자연스럽게 압축했습니다.
- source_word: confidebunt non confusi
  english_pob_choice: trust without being put to shame
  chosen_korean: 수치스럽게 되지 않을 것을 믿으며
  alternatives_korean:
  - 부끄러움 없이 믿으며
  - 실망하지 않을 것을 신뢰하며
  lexicon: confidere / confusus
  rationale: confidebunt와 non confusi의 결합을 따라 ‘믿다’와 ‘수치를 당하지 않다’의 긴장을 함께 보존했습니다.
- source_word: gloriosi
  english_pob_choice: they, being glorified
  chosen_korean: 영광을 입은 그들 자신
  alternatives_korean:
  - 영화롭게 된 그들
  - 영광스럽게 된 그들
  lexicon: gloriosi
  rationale: 수상 자체가 아니라 주어인 신자들이 ‘영광을 입은’ 상태임을 드러내어, 수정된 영어 주해를 반영했습니다.
theological_decisions:
- issue: 하늘의 상급 수여가 누구로부터 오는지
  chosen_reading: 그들은 살아 있을 때 섬겼던 분의 얼굴을 보려고 서둘러 가며, ... 그분에게서 받게 될 것입니다.
  alternative_readings:
  - 그들이 섬겼던 분에게서 영광스러운 상급을 받게 될 것입니다.
  - 그분의 얼굴을 보기 위해 서두릅니다.
  rationale: 라틴어와 영어 audit trail이 모두 ‘섬기던 분의 얼굴을 봄’과 ‘그분에게서 상급을 받음’을 함께 말하므로, 두 요소를 분리하지 않고 한 문장 흐름 안에서 보존했습니다.
  doctrine_reference: 성도의 최종 보상과 하나님/주 앞에서의 인격적 대면
