revisions:
- from: 일곱째 무리[a]는 앞에 언급된 모든 무리보다 더 큽니다. 그들은 확신으로 기뻐하고, 수치스럽게 되지 않을 것을 믿으며, 두려움 없이 즐거워할 것입니다. 그들은 살아 있을 때 섬겼던 분의 얼굴을 보려고 서둘러 가며, 영광을 입은 그들 자신이 받을 상급을 그분에게서 받게 될 것입니다.
  to: 일곱째 등급[a]은 앞에서 언급한 모든 등급보다 더 큽니다. 그들은 확신을 가지고 크게 기뻐하며, 수치를 당하지 않고 신뢰하고, 두려움 없이 즐거워할 것입니다. 그들은 살아 있을 때 섬겼던 분의 얼굴을 보려고 서두르며, 영광을 입은 그들이 그분에게서 상급을 받을 것입니다.
  rationale: 원문의 병렬 동사구(exultabunt, confidebunt, gaudebunt)와 각 수식어를 한국어에서도 병렬로 유지했습니다. ‘gloriosi’를 상급이 아닌 수령자에게 연결하고, ‘그분에게서’는 상급의 출처로 남겼습니다. ‘등급’은 이 구절이 앞서 열거된 여러 ordo 가운데 일곱째를 지칭한다는 문맥을 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:35:51Z'
review_pass:
  verdict: revise
  source_fidelity: ‘confidebunt non confusi’는 ‘수치를 당하지 않고 신뢰하다’라는 병렬을 더 직접적으로 나타내는 것이 좋습니다. 또한 ‘gloriosi’는 상급이 아니라 받는 이들을 수식하므로 ‘영광을 입은 그들’로 명확히 옮겨야 합니다.
  naturalness: 현 번역의 ‘수치스럽게 되지 않을 것을 믿으며’와 ‘영광을 입은 그들 자신이 받을 상급을 그분에게서 받게 될 것입니다’는 다소 우회적이고 반복적입니다. 문장 연결과 수식 관계를 현대 한국어에 맞게 다듬었습니다.
  terminology: 문맥의 연속된 천상적 ‘ordines’를 가리키는 말로 ‘무리’보다 ‘등급’이 더 정확합니다. ‘상급’과 ‘영광을 입은’은 각각 mercedem 및 gloriosi의 관계를 보존합니다.
  issues:
  - severity: medium
    issue: confidebunt non confusi의 표현이 부자연스럽고 신뢰의 직접 목적을 바꿉니다.
    rationale: ‘수치스럽게 되지 않을 것을 믿다’는 원문의 ‘신뢰하되 수치를 당하지 않다’보다 한 단계 해석된 표현입니다.
  - severity: low
    issue: 상급을 ‘받게 될’ 주체와 ‘그분에게서’라는 출처의 결합이 반복적으로 표현됩니다.
    rationale: ‘영광을 입은 그들이 그분에게서 상급을 받을’로 정리하면 원문의 수식 관계와 한국어 문장 흐름이 모두 분명해집니다.
  - severity: low
    issue: ‘ordo’의 문맥상 등급성 표현이 약합니다.
    rationale: 앞선 여러 order의 일곱째 항목을 가리키므로 ‘등급’이 구조적 의미를 더 잘 전달합니다.
