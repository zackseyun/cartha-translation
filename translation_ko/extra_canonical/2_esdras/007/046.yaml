  rationale: 첫 문장을 ‘현재 있는’ 것과 ‘지키는’ 것을 병렬로 나타내도록 고쳐 라틴어의 구문을 살렸습니다. 기도의 대상이라는 관계를 명확히 했고, 대괄호로 제시된 de의 전승상 불확실성은 해당 위치의 각주로 옮겼습니다. 뒤의 두 수사적 질문과 ‘언약’의 용어는 유지했습니다.
