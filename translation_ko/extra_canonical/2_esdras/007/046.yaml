id: 2ES.7.46
reference: 2 Esdras 7:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: beati praesentes et obseruantes quae a te constituta sunt; Sed et [de] quibus erat oratio mea, quis enim est de praesentibus, qui non peccauit, uel quis natus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/046.yaml
  text: Blessed are those who are present and keep what has been established by you. But as for those about whom my prayer was made, who indeed is there among those now present who has not sinned, or what one born has not transgressed your covenant?
translation:
  language: ko
  text: 복되도다, 주님께서 정하신 것을 지키는 이들은 지금 여기에 있는 이들입니다. 그러나 내 기도가 드려졌던 그 사람들에 관해서는, 지금 여기에 있는 이들 가운데 누가 죄를 짓지 않았겠으며, 태어난 자 가운데 누가 주님의 언약을 어기지 않았겠습니까?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “복된 사람들은”
    reason: alternative_reading
  - marker: b
    text: 또는 “정해 두신 것”
    reason: lexical_alternative
  - marker: c
    text: 일부 사본 전통은 이 문장의 배열과 세부 표현에 차이가 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: beati
  english_pob_choice: Blessed are
  chosen_korean: 복되도다
  alternatives_korean:
  - 복됩니다
  - 복이 있습니다
  lexicon: beatus
  rationale: 라틴어 축복 선언의 서두를 경전적 선언으로 살리기 위해 간결한 감탄형을 택했습니다. 합쇼체 문맥을 해치지 않으면서도 선언성을 유지합니다.
- source_word: praesentes
  english_pob_choice: those who are present
  chosen_korean: 지금 여기에 있는 이들
  alternatives_korean:
  - 현존하는 이들
  - 함께 있는 이들
  lexicon: praesens
  rationale: 단순히 물리적 존재를 가리키는 맥락이므로 추상화하지 않고 현장성을 드러내는 표현을 택했습니다.
- source_word: obseruantes quae a te constituta sunt
  english_pob_choice: keep what has been established by you
  chosen_korean: 주님께서 정하신 것을 지키는
  alternatives_korean:
  - 주님께서 세우신 것을 지키는
  - 주님께서 정해 두신 규례를 지키는
  lexicon: observo / constituo
  rationale: constituta sunt의 ‘정해진 것’과 obseruantes의 ‘지키다’를 함께 반영했습니다. ‘규례’로 좁히기보다 원문이 허용하는 넓은 의미를 살렸습니다.
- source_word: qui non peccauit, uel quis natus ... transgressus
  english_pob_choice: who has not sinned ... what one born has not transgressed your covenant
  chosen_korean: 누가 죄를 짓지 않았겠으며, 태어난 자 가운데 누가 주님의 언약을 어기지 않았겠습니까
  alternatives_korean:
  - 누가 죄를 범하지 않았겠으며, 태어난 사람 가운데 누가 주님의 언약을 어기지 않았겠습니까
  - 누가 죄를 짓지 않았겠으며, 태어난 자 가운데 누가 언약을 범하지 않았겠습니까
  lexicon: peccare / transgredi / natus
  rationale: 두 개의 수사적 질문을 그대로 유지해 보편적 인간의 죄성과 언약 위반을 병렬로 드러냈습니다. '태어난 자'는 natus의 인칭적·포괄적 뉘앙스를 살립니다.
theological_decisions:
- issue: 축복 선언과 뒤이은 수사적 질문의 긴장
  chosen_reading: 첫 절반은 하나님께 정해진 것을 지키는 자들에 대한 축복으로, 뒤 절반은 그 기준 앞에서 모든 태어난 자의 죄성과 언약 위반을 드러내는 탄식으로 읽었습니다.
  alternative_readings:
  - 하나의 연속된 축복문으로 읽기
  - 두 번째 절을 단순한 수사적 수식으로 약화해 읽기
  rationale: 라틴어가 축복 선언과 반어적 자문을 병치하므로, 한국어에서도 그 긴장을 흐리지 않도록 분리해 번역했습니다.
  doctrine_reference: 인간의 보편적 죄성, 언약의 요구
- issue: ‘your covenant’의 지시 대상
  chosen_reading: 주님의 언약
  alternative_readings:
  - 당신의 언약
  - 주님의 계약
  rationale: 2인칭 소유를 한국어 경전 문맥에 맞게 ‘주님’으로 정리하되, 단순 계약보다 언약의 신학적 무게를 유지했습니다.
  doctrine_reference: 언약 신학
