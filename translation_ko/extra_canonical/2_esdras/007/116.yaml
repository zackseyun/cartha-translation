id: 2ES.7.116
reference: 2 Esdras 7:116
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondi et dixi: hic sermo meus primus et novissimus, quoniam melius erat non dare terramAdam vel, cum iam dedisset, coercereeum ut non peccaret.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/116.yaml
  text: 'And I answered and said[a], “This is my first and last word: it would have been better not to give the earth to Adam, or else, when it had already been given, to restrain him so that he would not sin.”'
  footnotes:
  - marker: a
    text: Or 'not to give the earth to Adam, or else, once it had been given'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 대답하여 말했습니다. “이것은 내 처음이자 마지막 말입니다. 땅이 아담을 낳지 않았더라면 더 나았을 것입니다. 아니면 땅이 이미 아담을 낳은 뒤에는, 그가 죄를 짓지 않도록 그를 제지했더라면 더 나았을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 내가 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말하고 이르기를
  - 내가 대답하여 말했습니다
  lexicon: respondeo / dico
  rationale: 서술형 응답 공식을 자연스러운 현대 한국어로 옮기되, 두 동사의 병렬을 유지해 발화의 엄숙함을 살렸습니다.
- source_word: hic sermo meus primus et novissimus
  english_pob_choice: This is my first and last word
  chosen_korean: 이것은 내 첫마디이자 마지막 말입니다
  alternatives_korean:
  - 이것은 내 처음이자 마지막 말입니다
  - 이것이 내 첫마디이자 마지막 말입니다
  lexicon: sermo
  rationale: sermo를 단순한 '말'로 처리하되, 관용적인 '첫마디/마지막 말'을 써서 선언의 종결성과 단호함을 전달했습니다.
- source_word: melius erat non dare terram Adam vel, cum iam dedisset
  english_pob_choice: it would have been better not to give the earth to Adam, or else, when it had already been given
  chosen_korean: 땅이 아담을 내지 않았더라면 더 좋았을 것이며, 아니면 이미 아담을 내놓은 뒤에는
  alternatives_korean:
  - 아담에게 땅이 주어지지 않았더라면 더 좋았을 것이며, 아니면 이미 주어진 뒤에는
  - 땅이 아담을 낳지 않았더라면 더 좋았을 것이며, 아니면 이미 낳은 뒤에는
  lexicon: dare terram Adam / dedisset
  rationale: 라틴어와 POB의 수정 반영에 따라 'give the earth to Adam'이 아니라 '땅이 아담을 내다/내놓다'의 의미를 살렸습니다. '내다'는 출산·생산의 뉘앙스를 비교적 직접적으로 드러냅니다.
- source_word: coercere eum ut non peccaret
  english_pob_choice: to restrain him so that he would not sin
  chosen_korean: 그가 죄를 짓지 않도록 그를 억제했더라면
  alternatives_korean:
  - 그가 죄를 짓지 않게 그를 제지했더라면
  - 죄를 짓지 않도록 그를 억눌렀더라면
  lexicon: coercere
  rationale: coercere의 강한 제어 의미를 유지하면서도 한국어에서 자연스러운 '억제하다'를 택해 목적절을 분명히 했습니다.
theological_decisions:
- issue: 인간 타락의 원인을 '땅'의 산출과 억제 실패로 서술하는 표현
  chosen_reading: 본문의 문제 제기를 약화하지 않고, 아담의 죄를 가능태로부터의 억제 실패로 옮겼습니다.
  alternative_readings:
  - '''아담에게 땅을 주지 않았더라면''로 읽어 창조 질서를 일반화하는 번역'
  - '''아담을 낳지 않았더라면''로 더 직접적 출산 이미지를 쓰는 번역'
  rationale: 이 절은 신정론적 탄식을 과장 없이 유지해야 하므로, 본문의 역설적 논리를 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 4 Ezra / 신정론적 탄식
- issue: 직접화법의 감정적 단호함
  chosen_reading: 직접화법은 합쇼체를 유지하되 선언적 어조를 살려 '첫마디이자 마지막 말입니다'로 마무리했습니다.
  alternative_readings:
  - 더 중립적인 서술체
  - 더 강한 감탄형
  rationale: 발화자의 결론적 단정을 문체로 반영하되, 현대 한국어 공적 문장에 맞게 조정했습니다.
  doctrine_reference: 문체·화자 재현
