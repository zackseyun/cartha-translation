  - 세상
  - 연대
  rationale: 라틴어 문맥과 영문 POB의 'age'는 인류 역사의 구획을 가리키므로, 가장 직접적인 '시대'가 적절합니다.
  doctrine_reference: 문맥상 창조 질서와 역사 구분에 대한 진술
