  text: For this reason the Most High did not make one age, but two.
translation:
  language: ko
  text: 이런 이유로 지극히 높으신 분은 한 시대를 만들지 않으시고, 두 시대를 만드셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 대조 구조를 살려 'one age, but two'를 직역에 가깝게 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 분
  - 지존자
  lexicon: Altissimus
  rationale: 라틴어 최상급 표현을 신격 호칭으로 자연스럽게 옮기되, 직역의 중립성을 살려 '분'을 붙였습니다.
- source_word: fecit
  english_pob_choice: did make
  chosen_korean: 만드셨습니다
  alternatives_korean:
  - 지으셨습니다
  - 만들지 않으셨습니다
  lexicon: facere
  rationale: 영문 POB가 부정문 구조로 풀어낸 핵심 동사는 창조/형성의 의미를 포괄하는 '만드시다'로 옮겼습니다.
- source_word: non fecit … unum … sed duo
  english_pob_choice: did not make one age, but two
  chosen_korean: 한 시대를 만들지 않으시고, 두 시대를 만드셨습니다
  alternatives_korean:
  - 한 시대만 만들지 않으시고 두 시대를 만드셨습니다
  - 한 시대가 아니라 두 시대를 만드셨습니다
  - 한 세대가 아니라 두 세대를 만드셨습니다
  lexicon: non … sed …
  rationale: 영문 POB의 대조를 따라 '한 시대'와 '두 시대'를 병렬로 두어, 원문의 수적 대비를 분명히 했습니다.
theological_decisions:
- issue: '''age''의 의미 범위'
  chosen_reading: 여기서는 시간적 구분 단위인 '시대'로 옮겼습니다.
  alternative_readings:
  - 세대
  - 세상
  - 연대
  rationale: 라틴어 문맥과 영문 POB의 'age'는 인류 역사의 구획을 가리키므로, 가장 직접적인 '시대'가 적절합니다.
  doctrine_reference: 문맥상 창조 질서와 역사 구분에 대한 진술
