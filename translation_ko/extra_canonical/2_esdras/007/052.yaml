source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'impios uero multiplicari, audi haec: Lapides electos si habueris paucos ualde,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/052.yaml
  text: 'But hear this about the multiplication of the ungodly: if you have very few choice stones,[a]'
  footnotes:
  - marker: a
    text: Or 'If you have very few precious stones, you will set them aside according to their number for yourself, but lead and clay are abundant.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러나 악인들이 많아지는 것에 대해 이 말을 들으십시오: 만일 당신에게 선택된 돌이 아주 적다면,[a]'
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “만일 당신에게 선택된 돌이 아주 적다면 …”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: impios uero multiplicari
  english_pob_choice: the multiplication of the ungodly
  chosen_korean: 악인들이 많아지는 것
  alternatives_korean:
  - 불경한 자들이 증가하는 것
  - 경건하지 않은 자들이 번성하는 것
  lexicon: impios = 악인들 / uero = 그러나 / multiplicari = 많아지다, 증가하다
  rationale: 라틴어 impios는 단순히 ‘경건하지 않은 사람들’보다 윤리적·신학적 대조가 분명한 ‘악인들’이 더 직접적입니다. multiplicari는 추상명사화하여 ‘많아지는 것’으로 옮겨 흐름을 살렸습니다.
- source_word: audi haec
  english_pob_choice: But hear this
  chosen_korean: 이 말을 들으십시오
  alternatives_korean:
  - 이것을 들으십시오
  - 이 말을 들어 보십시오
  lexicon: audi = 들으라 / haec = 이것들
  rationale: 예언적·권면적 어조를 살리되, 한국어 합쇼체로 자연스럽게 ‘들으십시오’로 옮겼습니다.
- source_word: Lapides electos
  english_pob_choice: choice stones
  chosen_korean: 선택된 돌
  alternatives_korean:
  - 선별된 돌
  - 고른 돌
  - 귀한 돌
  lexicon: lapides = 돌들 / electos = 선택된, 뽑힌
  rationale: electos는 가치판정의 ‘귀한’보다 선택 행위가 드러나는 ‘선택된’이 더 원문에 가깝습니다. 다만 한국어 문맥상 ‘선택된 돌’은 다소 직역적이므로, 본문에서는 원문의 대조를 우선했습니다.
