source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tinebit futuram saeculi iocunditatem facere, multis autem tormenta. Increuit enim in nos cor malum, quod nos abalienauit ab his, et deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita; et hoc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/048.yaml
  text: For an evil heart has grown in us[a], which has alienated us from these things and led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life; and this not for a few, but for almost all who have been created.”
  footnotes:
  - marker: a
    text: Or 'from these things'.
    reason: previous_rendering
translation:
  language: ko
  text: 악한 마음이 우리 안에서 자라났고, 우리를 이 일들에서[a] 멀어지게 하며 부패에 빠지게 하고 죽음의 길들로 이끌었으며, 멸망의 길들을 우리에게 보이고 우리를 생명에서 멀리 떨어지게 했습니다. 그리고 이것은 소수에게만이 아니라 창조된 거의 모든 이에게 해당합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하나님으로부터”.
    reason: textual_variant
lexical_decisions:
- source_word: cor malum
  english_pob_choice: an evil heart
  chosen_korean: 악한 마음
  alternatives_korean:
  - 악심
  - 악한 심령
  - 악한 심성
  lexicon: cor
  rationale: 라틴어 cor malum의 핵심 이미지를 살리면서도 현대 한국어에서 자연스럽고 문맥에 맞는 표현으로 옮겼습니다.
- source_word: increuit ... in nos
  english_pob_choice: has grown in us
  chosen_korean: 우리 안에서 자라서
  alternatives_korean:
  - 우리 안에서 자라났습니다
  - 우리 가운데서 커져서
  lexicon: increu-/cresc-
  rationale: 성장·증가의 뉘앙스를 직접 반영하되, 합쇼체 문맥에서 자연스러운 서술로 다듬었습니다.
- source_word: abalienauit ab his
  english_pob_choice: has alienated us from these things
  chosen_korean: 우리를 이 일들에서 멀어지게 하고
  alternatives_korean:
  - 우리를 이 일들로부터 떼어 놓고
  - 우리를 이것들에서 소외시키고
  lexicon: abalienare
  rationale: 본문의 라틴어 표면형은 'these things'이지만, 개정 이력상 신학적으로는 하나님으로부터의 소외를 가리키는 전승이 있음을 반영하되, 현 본문 기준으로는 중립적 표현을 유지했습니다.
- source_word: deduxit nos in corruptionem, et in itinera mortis, ostendit nobis semitas perditionis et longe fecit nos a uita
  english_pob_choice: led us into corruption and into the ways of death, shown us the paths of perdition, and taken us far from life
  chosen_korean: 부패와 죽음의 길들로 이끌며, 멸망의 길들을 우리에게 보였고, 우리를 생명에서 멀리 떨어지게 했습니다
  alternatives_korean:
  - 썩어짐과 죽음의 길들로 데려가며
  - 멸망의 길들을 보여 주고
  lexicon: deducere / ostendere / longe facere
  rationale: 복수형 '길들'과 '길'의 반복을 살려, 유기적인 병렬 구조를 한국어에서도 분명하게 드러냈습니다.
- source_word: multis autem ... almost all who have been created
  english_pob_choice: not for a few, but for almost all who have been created
  chosen_korean: 이것은 소수에게만이 아니라, 창조된 거의 모든 이에게 해당합니다
  alternatives_korean:
  - 이는 몇 사람만의 일이 아니라, 창조된 거의 모든 사람에게 해당합니다
  - 이것은 적은 수가 아니라 거의 모든 피조된 이들에게 해당합니다
  lexicon: multi / omnis creatus
  rationale: 라틴어의 대조 구조(많은/거의 모두)를 한국어에서 분명히 살리되, 대상의 범위를 ‘창조된 이’로 유지했습니다.
theological_decisions:
- issue: 본래 전승과 수정본 사이의 출발점이 'from God'인지 'from these things'인지
  chosen_reading: 본문은 현재 라틴어 읽기인 '이 일들에서'를 따르되, 개정 이력상 존재하는 '하나님으로부터' 전승 차이는 본문 주석 범위로 남깁니다.
  alternative_readings:
  - 하나님으로부터 멀어지게 하고
  - 이것들에서 멀어지게 하고
  rationale: 사용자 제공 최신 본문과 audit trail에 따르면 출판용 본문은 라틴어 표면형을 반영해야 하므로, 본문에는 '이 일들'을 유지하고 신학적으로 민감한 변이는 드러내되 본문을 바꾸지 않았습니다.
  doctrine_reference: 4 Ezra / yetzer hara 전승의 인간 내면 악의 기원과 소외 모티프
