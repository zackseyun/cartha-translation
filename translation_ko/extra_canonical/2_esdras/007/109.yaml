lexical_decisions:
- source_word: Helias
  english_pob_choice: Elijah
  chosen_korean: 엘리야
  alternatives_korean:
  - 일리아
  - 엘리야스
  lexicon: 고유명사
  rationale: 예언자 엘리야의 통용되는 한국어 성경형을 따랐습니다.
- source_word: pro his qui pluviam acceperunt
  english_pob_choice: for those who received rain
  chosen_korean: 비를 받은 자들을 위해
  alternatives_korean:
  - 비를 받은 사람들을 위해
  - 비를 맞은 이들을 위해
  lexicon: for + accusative / pluviam
  rationale: 라틴어의 전치사 pro는 여기서 '...을/를 위하여'의 목적·대상 의미이고, pluviam acceperunt는 문자적으로 '비를 받았다'이므로 이를 그대로 살려 옮겼습니다.
- source_word: pro mortuo ut viveret
  english_pob_choice: for the dead man, that he might live
  chosen_korean: 죽은 사람이 살게 하려고
  alternatives_korean:
  - 죽은 사람을 위하여, 그가 살게 하려고
  - 죽은 자가 살아나게 하려고
  lexicon: mortuo / ut viveret
  rationale: pro mortuo는 '죽은 사람을 위하여'의 대상 의미를 살리고, ut viveret는 목적절이므로 한국어의 '...하게 하려고'로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 죽은 사람에 대한 표현의 강도
  chosen_reading: 직역에 가까운 '죽은 사람이 살게 하려고'를 유지했습니다.
  alternative_readings:
  - '''죽은 자가 살아나도록'''
  - '''죽은 사람을 살리려고'''
  rationale: 라틴어 목적절의 직접성을 보존하기 위해, 기적의 결과를 완곡하게 낮추지 않고 목적 구조를 드러냈습니다.
  doctrine_reference: 본문 의미 보존 원칙
