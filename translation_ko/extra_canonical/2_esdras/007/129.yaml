id: 2ES.7.129
reference: 2 Esdras 7:129
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam haec est via, quam Moyses dixit cum viveret ad populum dicens: elige tibi vitam ut vivas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/129.yaml
  text: For this is the way that Moses spoke of to the people while he lived, saying, ‘Choose life for yourself, that you may live.’
translation:
  language: ko
  text: 이것이 모세가 살아 있는 동안 백성에게 말한 길입니다. 모세는 이렇게 말하였습니다. “당신이 살 수 있도록, 당신 자신을 위해 생명을 선택하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: haec est via
  english_pob_choice: this is the way
  chosen_korean: 이것이 … 길입니다
  alternatives_korean:
  - 이것이 … 방법입니다
  - 이것이 … 길이옵니다
  lexicon: via → 길
  rationale: 라틴어 via의 기본 의미를 살려, 추상적 ‘방법’보다 문맥상 삶과 죽음의 선택을 가리키는 ‘길’로 옮겼습니다.
- source_word: quam Moyses dixit
  english_pob_choice: that Moses spoke of
  chosen_korean: 모세가 … 말한
  alternatives_korean:
  - 모세가 … 말한 바 있는
  - 모세가 … 언급한
  lexicon: dixit → 말하다 / 언급하다
  rationale: 영어 POB의 ‘spoke of’는 라틴어의 간접적 관계를 자연스럽게 풀어낸 것이므로, 한국어도 같은 의미 관계를 살려 ‘말한’으로 옮겼습니다.
- source_word: ad populum dicens
  english_pob_choice: to the people, saying
  chosen_korean: 백성에게 말한
  alternatives_korean:
  - 백성에게 말하며
  - 백성에게 이르되
  lexicon: populus → 백성
  rationale: populus는 단순 군중이 아니라 언약 공동체적 뉘앙스가 있어 ‘백성’이 가장 직접적입니다.
- source_word: elige tibi vitam
  english_pob_choice: Choose life for yourself
  chosen_korean: 생명을 선택하여
  alternatives_korean:
  - 너 자신을 위해 생명을 선택하여
  - 생명을 네게 택하여
  lexicon: eligo → 선택하다; vita → 생명
  rationale: 명령의 핵심은 ‘생명’을 의식적으로 택하라는 요청이므로, 한국어에서는 목적어를 먼저 두어 간결하게 표현했습니다.
- source_word: ut vivas
  english_pob_choice: that you may live
  chosen_korean: 네가 살라
  alternatives_korean:
  - 네가 살 수 있도록
  - 살게 되도록
  lexicon: vivo → 살다
  rationale: 목적절의 결과를 한국어에서 자연스럽게 옮기되, 단순 생존이 아니라 선택의 결과로서의 ‘살다’를 분명히 했습니다.
theological_decisions:
- issue: ‘생명’과 ‘살다’의 인접 사용
  chosen_reading: ‘생명’을 선택하는 것이 곧 ‘살다’로 이어지는 언약적 삶의 선택으로 읽었습니다.
  alternative_readings:
  - 단순한 윤리적 조언
  - 철학적 의미의 생명 개념
  rationale: 본문은 모세의 권고를 통해 생명/죽음의 구도를 제시하므로, 이를 윤리 일반화보다 구체적 언약적 선택으로 보존했습니다.
  doctrine_reference: 신명기적 생명-죽음 선택 모티프
