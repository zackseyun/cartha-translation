lexical_decisions:
- source_word: cruciamenta
  english_pob_choice: torments
  chosen_korean: 고통
  alternatives_korean:
  - 고문
  - 형벌
  - 괴로움
  lexicon: cruciamenta
  rationale: 라틴어 복수형은 단순한 감정적 괴로움보다 사후의 가혹한 고난을 가리키므로, 현대 한국어에서는 의미를 과장하지 않으면서도 충분히 강한 ‘고통’으로 옮겼습니다.
- source_word: salutem
  english_pob_choice: the salvation
  chosen_korean: 구원
  alternatives_korean:
  - 구출
  - 건짐
  lexicon: salus
  rationale: 문맥상 죽은 뒤에 약속된 최종적 спасение에 해당하므로, POB의 기본 용례에 따라 ‘구원’을 유지했습니다.
- source_word: post mortem
  english_pob_choice: after death
  chosen_korean: 죽은 뒤에
  alternatives_korean:
  - 사후에
  - 죽음 이후에
  lexicon: post + mortem
  rationale: 짧고 자연스러운 현대 문장 흐름을 살리면서도 사후 시점을 분명히 드러내기 위해 ‘죽은 뒤에’를 선택했습니다.
- source_word: repromissam sibi
  english_pob_choice: promised to them
  chosen_korean: 자신들에게 약속된
  alternatives_korean:
  - 그들에게 약속된
  - 그들 자신에게 약속된
  lexicon: repromitto
  rationale: 수동 분사와 재귀 대명사의 결합을 반영해, 약속이 그들에게 귀속되어 있음을 자연스럽게 표현했습니다.
theological_decisions:
- issue: 원문이 7:67에서 문장을 ‘Nobis autem’로 끊어 다음 절로 넘어가도록 끝내는 문제
  chosen_reading: 본문은 앞 절의 이유 설명을 마치고 ‘그러나 우리에게는’에서 의도적으로 절을 열어 둔 채 끝납니다.
  alternative_readings:
  - 완결된 한국어 문장으로 매끈하게 마침표를 찍는 처리
  - 뒤 절의 내용을 미리 보태어 문장을 완성하는 처리
  rationale: 라틴어 소스의 절 경계와 전승된 문장 절단을 보존해야 하므로, 한국어도 미완결 구조를 그대로 드러냈습니다.
  doctrine_reference: source fidelity / versification boundary
