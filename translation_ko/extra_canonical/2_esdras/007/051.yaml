  to: 한 시대가 아니라 두 시대입니다. 당신이 의인은 많지 않고 적다고 말했기 때문입니다.
  rationale: ‘한 시대, 그러나 둘’의 압축된 대조를 한국어에서 명료하게 재현하기 위해 ‘두 시대’로 보완했습니다. 또한 원문의 dixisti를 중립적인 ‘말했기’로 옮겨 불필요한 존칭 해석을 피했습니다. ‘많지 않고 적다’의 중첩된 수적 대비와 문장 끝의 쉼표가 시사하는 미완결성은 의미를 덧붙이지 않은 채 유지했습니다.
