  text: One age, but two. For you have said that the righteous are not many, but few,
translation:
  language: ko
  text: 한 시대가 아니라 두 시대입니다. 당신이 의인은 많지 않고 적다고 말했기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: unum saeculum, sed duo
  english_pob_choice: One age, but two.
  chosen_korean: 한 시대가 아니라 둘입니다.
  alternatives_korean:
  - 한 세대가 아니라 둘입니다.
  - 한 세상만이 아니라 둘입니다.
  lexicon: saeculum
  rationale: saeculum은 문맥상 단순한 ‘시대/세대’의 대비로 보이며, 영어 POB의 ‘age’에 맞춰 ‘시대’로 옮겼습니다. ‘하나’와 ‘둘’의 대조를 살려 앞절의 간결한 구조를 유지했습니다.
- source_word: Tu enim
  english_pob_choice: For you
  chosen_korean: 당신이
  alternatives_korean:
  - 왜냐하면 당신이
  - 당신께서
  lexicon: enim
  rationale: enim은 원인 제시의 접속사이므로 ‘왜냐하면’도 가능하지만, 문장 흐름을 자연스럽게 하면서도 직접적인 이유 제시를 살리기 위해 ‘-기 때문입니다’ 구조로 처리했습니다.
- source_word: iustos
  english_pob_choice: the righteous
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 사람들
  - 의인
  lexicon: iustus
  rationale: iustos는 단순한 도덕적 ‘올바름’보다 하나님 앞에서의 의로운 자들을 가리키므로, 성경적 용례가 분명한 ‘의인들’을 채택했습니다.
theological_decisions:
- issue: 의인 수에 대한 단정적 대비
  chosen_reading: 의인들이 많지 않고 오히려 적다고 한 진술을 그대로 보존했습니다.
  alternative_readings:
  - 의인들이 적다는 일반적 관찰로 완화하기
  - ‘많지 않다’를 의역해 ‘거의 없다’로 강화하기
  rationale: 본문은 ‘많지 않다, بلکه 적다’의 수적 대비를 직접 말하므로, 이를 완화하거나 과장하지 않고 그대로 옮겨 긴장을 보존했습니다.
  doctrine_reference: 종말론적 심판 문맥에서의 의인/악인 대비
