    issue: eis의 여격을 ‘그들에 관하여’로 단정함
    rationale: eis는 기본적으로 ‘그들에게’이며, testificatus est와 연결될 때 ‘그들에게 증언하였다’가 자연스러운 문법적 독해입니다. ‘그들에 관하여’라는 해석 가능성을 배제하지 않되 본문에서 단정하지 않는 편이 원문 충실성과 모호성 보존에 더 적합합니다.
