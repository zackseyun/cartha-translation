id: 2ES.7.94
reference: 2 Esdras 7:94
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uagantur impiorum animae, et quae in eis manet punitio. Tertius ordo, uidentes testimonium quod testificatus est eis qui plasmauit eas, quoniam uiuentes serua-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/094.yaml
  text: 'The third order: seeing the testimony that he who formed them bore concerning them[a], that while they lived they kept the law that was entrusted to them.'
  footnotes:
  - marker: a
    text: Or 'because they see the testimony borne by him who formed them, that while they lived they kept the law that was given in faith.'.
    reason: previous_rendering
translation:
  language: ko
  text: '제3의 부류: 그들을 지으신 분이 그들에 관하여 증언하신 증언을 보며, 그들이 살아 있는 동안 자신들에게 맡겨진 율법을 지켰습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘제3의 부류’는 라틴어 ordo의 문맥적 번역입니다. 이 구절은 앞뒤 문맥상 종말론적 분류를 말하므로, 단순한 순번보다 ‘부류’가 의미를 더 잘 드러냅니다.
    reason: previous_rendering
lexical_decisions:
- source_word: uagantur impiorum animae
  english_pob_choice: The third order
  chosen_korean: 제3의 부류
  alternatives_korean:
  - 제3의 질서
  - 세 번째 부류
  lexicon: ordo
  rationale: Latin ordo를 POB의 문맥적 수위를 따라 ‘부류’로 옮겨, 단순한 순번보다 분류·층위를 드러내게 했습니다.
- source_word: quod testificatus est eis qui plasmauit eas
  english_pob_choice: the testimony that he who formed them bore concerning them
  chosen_korean: 그들을 지으신 분이 그들에 관하여 증언하신 증언
  alternatives_korean:
  - 그들을 지으신 분이 그들에 대해 증언하신 증언
  - 그들을 빚으신 이가 그들에게 증언하신 증언
  lexicon: testimonium / testificatus est / plasmauit
  rationale: plasmauit eas는 ‘지으신 분’으로, testificatus est는 법정적·증언적 뉘앙스를 살려 ‘증언하신’으로 옮겼습니다. eis는 목적의 ‘그들에 관하여’로 반영했습니다.
- source_word: viventes serva-
  english_pob_choice: that while they lived they kept the law that was entrusted to them
  chosen_korean: 그들이 살아 있는 동안 자신들에게 맡겨진 율법을 지켰습니다
  alternatives_korean:
  - 그들이 살아 있는 동안 자신들에게 주어진 율법을 지켰습니다
  - 그들이 살아 있는 동안 맡겨진 율법을 지켰습니다
  lexicon: seruare / lex
  rationale: servare는 단순 보유보다 ‘지키다’가 자연스럽고, lex는 프로젝트 기본어휘에 따라 ‘율법’으로 유지했습니다.
theological_decisions:
- issue: 증언의 방향성
  chosen_reading: 증언을 ‘그들에 관하여’로 읽어, 창조주가 피조물에 대해 남긴 증언이라는 관계를 드러냈습니다.
  alternative_readings:
  - 그들에 대해 증언한 증언
  - 그들에게 증언한 증언
  rationale: 라틴어 eis를 단순 반복하지 않고, 문맥상 창조주가 그들에 대해 증언하신 내용임을 한국어에서 가장 분명하게 드러내는 방향을 택했습니다.
  doctrine_reference: 창조주-피조물 관계의 증언적 진술
