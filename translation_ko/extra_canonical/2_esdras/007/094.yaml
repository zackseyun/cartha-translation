  source_fidelity: 라틴어의 uidentes는 ‘보며/보는’으로 유지했으며, plasmauit eas는 ‘그들을 지으신 분’으로 충실히 옮겼습니다. 다만 eis는 문법상 ‘그들에게’를 뜻하는 여격이므로, 본문에서 이를 단정적으로 ‘그들에 관하여’로 처리한 초안은 원문의 방향성을 좁힙니다. 본문은 여격을 반영하고, 다른 가능한 이해는 각주로 밝혔습니다. 사본 단편은 serua-에서 끊기지만, 제공된 영어 POB의 문맥상 보완을 따라 ‘지켰습니다’로 번역할 수 있습니다.
  naturalness: ‘증언하신 증언’은 원문의 동족어적 구성을 지나치게 반복하여 한국어로 다소 어색합니다. ‘그들에게 하신 증언을 보며’가 자연스럽고 문장 구조도 분명합니다. ‘제3의 부류는’으로 주제를 명시하여 현대 한국어 문장으로 매끄럽게 했습니다.
  terminology: ordo는 문맥상 ‘부류’가 적절하고, lex는 ‘율법’, plasmare는 ‘지으신’으로 일관되게 처리했습니다. 신학적 해석을 덧붙이지 않았습니다.
  issues:
