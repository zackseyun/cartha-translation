    rationale: 현 초안의 [a]는 문장 끝에 있으나 각주는 ‘제3의 부류’만 설명합니다. 표지를 해당 표현에 붙이고, 원문상 실제로 논쟁 가능한 eis의 방향성을 설명하는 각주로 바꾸는 것이 적절합니다.
