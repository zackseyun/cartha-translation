id: 2ES.7.89
reference: 2 Esdras 7:89
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: runt Altissimi ordo est hic, quando incipient seruari a uaso corruptibili. In eo tempore commoratae seruierunt cum labore Altissimo, et omni hora sustinuerunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/089.yaml
  text: This is the order of the Most High, when they began to be kept from the corruptible vessel. In that time they dwelt in it, they served the Most High with labor, and every hour they endured danger, so that they might perfectly keep the law of the Lawgiver.
translation:
  language: ko
  text: 이것은 지극히 높으신 분의 질서입니다. 그들이 썩어 없어질 그릇에서 지켜지기 시작할 때, 그때 그들은 그 안에 거주하면서 지극히 높으신 분을 수고하며 섬겼고, 매 시간마다 위험을 견뎌 내어 율법을 주신 분의 율법을 온전히 지키려 했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 Latin의 iter*계 동사군과 문맥상, ‘지켜지기 시작할 때’는 수동적 보호·보존의 의미를 반영한 번역입니다.
    reason: source_note
  - marker: b
    text: English POB의 ‘every hour they endured danger’를 따라, 본문은 지속적 위기 노출을 강조합니다.
    reason: cross_reference
lexical_decisions:
- source_word: Altissimi
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: Latin superlative divine title
  rationale: 직역적인 신칭을 유지하면서도 한국어 합쇼체에서 자연스럽고 경외감을 살릴 수 있는 표현으로 옮겼습니다.
- source_word: ordo est hic
  english_pob_choice: This is the order
  chosen_korean: 이것은 … 질서입니다
  alternatives_korean:
  - 이것은 … 순서입니다
  - 이것은 … 규정입니다
  lexicon: ordo
  rationale: ordo는 단순한 시간적 ‘순서’보다 정해진 배열·질서의 뜻이 더 강하므로, 문맥상 신적 질서를 드러내는 ‘질서’로 옮겼습니다.
- source_word: vasa corruptibili
  english_pob_choice: the corruptible vessel
  chosen_korean: 썩어 없어질 그릇
  alternatives_korean:
  - 썩을 수밖에 없는 그릇
  - 부패하기 쉬운 그릇
  lexicon: vasa / corruptibilis
  rationale: ‘그릇’의 신체 은유를 살리고 corruptibilis의 소멸성·부패성을 직접 드러내는 표현으로 옮겼습니다.
- source_word: seruierunt cum labore
  english_pob_choice: they served the Most High with labor
  chosen_korean: 수고하며 섬겼고
  alternatives_korean:
  - 노고를 들여 섬겼고
  - 애써 섬겼고
  lexicon: servire + labore
  rationale: 봉사의 행위를 유지하면서 labor의 수고·노고를 간결하게 반영했습니다.
- source_word: omni hora sustinuerunt
  english_pob_choice: every hour they endured danger
  chosen_korean: 매 시간마다 위험을 견뎌 내어
  alternatives_korean:
  - 매 순간 위험을 감내하며
  - 한 시간도 빠짐없이 위험을 견뎌
  lexicon: sustinere + omni hora
  rationale: omni hora의 반복성과 지속성을 살리고, sustinere의 ‘견디다/버티다’를 한국어로 자연스럽게 표현했습니다.
- source_word: ut perfecte seruarent legem Legislatoris
  english_pob_choice: so that they might perfectly keep the law of the Lawgiver
  chosen_korean: 율법을 주신 분의 율법을 온전히 지키려 했습니다
  alternatives_korean:
  - 율법주신 이의 율법을 완전하게 지키도록 하려 했습니다
  - 율법을 주신 분의 법을 완전하게 지키려 했습니다
  lexicon: lexem legis + Legislatoris
  rationale: legislatoris를 ‘율법을 주신 분’으로 옮겨 주체를 분명히 했고, law는 문맥상 토라/율법이므로 ‘율법’을 유지했습니다.
theological_decisions:
- issue: ‘썩어 없어질 그릇’의 인간 존재 은유
  chosen_reading: 물질적 육체를 가리키는 은유를 그대로 보존했습니다.
  alternative_readings:
  - ‘죽을 수밖에 없는 몸’으로 풀어 의역
  - ‘연약한 육신’으로 완화
  rationale: 이 구절의 이미지가 인간의 유한성과 취약성을 강하게 드러내므로, 은유를 평이하게 바꾸지 않고 직설적으로 살렸습니다.
  doctrine_reference: 인간의 유한성/육체적 취약성에 대한 성경적 은유
- issue: ‘율법을 주신 분의 율법’ 반복
  chosen_reading: 반복을 줄이지 않고 보존했습니다.
  alternative_readings:
  - ‘주신 분의 율법’을 ‘그분의 법’으로 압축
  - 중복을 피하려 문장을 재구성
  rationale: 원문의 수사적 강조를 살리기 위해 ‘율법’과 ‘율법을 주신 분’을 함께 유지했습니다.
  doctrine_reference: 율법의 신적 기원 강조
