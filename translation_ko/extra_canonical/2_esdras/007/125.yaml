source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam super stellas fulgebunt facies eorum qui abstinentiam habuerunt, nostrae vero facies super tenebras nigrae?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/125.yaml
  text: And because the faces of those who practiced self-control will shine above the stars[a], but our faces will be blacker than darkness?
  footnotes:
  - marker: a
    text: Or 'above the stars'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 절제를 실천한 사람들의 얼굴은 별들보다 더 빛나겠지만[a], 우리 얼굴은 어둠보다 더 검을 것입니다?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘별들 위에’이지만, 여기서는 비교 관용구로 이해해 ‘별들보다 더’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: quoniam
  english_pob_choice: And because
  chosen_korean: 그리고
  alternatives_korean:
  - 왜냐하면
  - 그런데
  lexicon: 접속사
  rationale: 이 절은 앞뒤의 대조를 이어 주는 설명적 연결이므로, 원문의 이유·연결 기능을 드러내면서도 한국어 문장 흐름에 자연스러운 접속어를 택했습니다.
- source_word: super stellas fulgebunt
  english_pob_choice: shine above the stars
  chosen_korean: 별들보다 더 빛나겠지만
  alternatives_korean:
  - 별들 위에서 빛나겠지만
  - 별들보다 밝게 빛나겠지만
  lexicon: comparative idiom
  rationale: super + 대격은 이 문맥에서 단순한 공간적 ‘위’가 아니라 비교 관용구로 보이므로, ‘별들보다 더’로 비교 관계를 분명히 했습니다.
- source_word: abstinentiam habuerunt
  english_pob_choice: those who practiced self-control
  chosen_korean: 절제를 실천한 사람들
  alternatives_korean:
  - 금욕을 행한 사람들
  - 절제한 사람들
  lexicon: abstinentia
  rationale: abstinentia는 단순한 절제 습관을 넘어 금욕적 자기억제를 가리킬 수 있으나, 한국어에서는 과도한 종교어를 피하고 행위의 의미를 살려 ‘절제를 실천하다’로 옮겼습니다.
- source_word: super tenebras nigrae
  english_pob_choice: blacker than darkness
  chosen_korean: 어둠보다 더 검을 것입니다
  alternatives_korean:
  - 어둠보다 더 검게 될 것입니다
  - 검은 어둠보다도 더 검을 것입니다
  lexicon: comparative intensification
  rationale: 후반부도 전반부와 같은 비교 구조를 유지해야 하므로, ‘더 검을 것입니다’로 강한 대비를 살리되 한국어 어순에 맞게 정리했습니다.
theological_decisions:
- issue: 수사적 질문의 유지
  chosen_reading: 문장 끝의 물음표를 그대로 살려, 심판·역전의 장면에서 울리는 수사적 질문으로 읽히게 했습니다.
  alternative_readings:
  - 평서문으로 완화하여 번역
  - 느낌표로 바꾸어 강조
  rationale: 원문은 판단을 선언하는 동시에 탄식·대조를 담은 수사적 물음이므로, 한국어에서도 질문형을 유지하는 편이 문학적 긴장과 경고성을 보존합니다.
  doctrine_reference: 묵시문학의 심판적 수사
- issue: 비교 구조의 일관성
  chosen_reading: 앞절의 ‘별들보다 더 빛나겠지만’과 뒷절의 ‘어둠보다 더 검을 것입니다’를 대칭으로 맞추었습니다.
  alternative_readings:
  - 앞절을 ‘별들 위에서 빛나겠지만’으로 공간화
  - 뒷절을 ‘어둠 속에서 더 검을 것입니다’로 약화
  rationale: 이 구절은 영광과 수치의 극단적 대비를 병렬로 제시하므로, 두 절 모두 비교 의미를 분명히 해야 원문의 신학적 역전이 살아납니다.
  doctrine_reference: 의인과 불의한 자의 종말적 대조
