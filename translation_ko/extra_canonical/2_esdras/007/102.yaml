lexical_decisions:
- source_word: si inueni gratiam ante oculos tuos
  english_pob_choice: If I have found favor before your eyes
  chosen_korean: 내가 주의 눈앞에서 은총을 얻었으면
  alternatives_korean:
  - 내가 당신의 눈앞에서 은총을 얻었으면
  - 내가 당신 앞에서 호의를 얻었으면
  lexicon: 찾다/은총/눈앞
  rationale: 라틴어 관용구를 자연스럽게 살리되, ‘favor’를 신학적으로 무게 있는 ‘은총’으로 옮기고 ‘before your eyes’를 직역에 가깝게 표현했습니다.
- source_word: seruo tuo
  english_pob_choice: your servant
  chosen_korean: 당신의 종인 저
  alternatives_korean:
  - 당신의 종
  - 당신의 하인인 저
  lexicon: 종
  rationale: 라틴어 seruus의 기본 의미를 따라 ‘종’을 택하고, 화자가 자신을 가리키는 맥락을 분명히 하기 위해 ‘저’를 덧붙였습니다.
- source_word: demonstra mihi adhuc
  english_pob_choice: show me also
  chosen_korean: 저에게도 보여 주십시오
  alternatives_korean:
  - 저에게도 나타내 주십시오
  - 저에게도 알려 주십시오
  lexicon: 보여 주다
  rationale: ‘demonstra’의 직접적 요구를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘보여 주십시오’로 옮겼습니다.
- source_word: si in die
  english_pob_choice: whether on the day
  chosen_korean: 곧 그 날에
  alternatives_korean:
  - 그 날에 있는지
  - 그 날인지
  lexicon: 날
  rationale: 현전한 라틴 본문이 문장을 미완으로 남기므로, 뒤를 보충하지 않고 ‘si in die’의 시작만 드러나게 옮겼습니다.
theological_decisions:
- issue: 미완성된 절 후반 처리
  chosen_reading: 남아 있는 본문이 ‘곧 그 날에’에서 끝나므로, 의미를 보태지 않고 단절감을 그대로 유지했습니다.
  alternative_readings:
  - 문맥상 ‘심판의 날’로 보충
  - 뒤 절과 연결해 완전한 문장으로 정리
  rationale: 제공된 라틴 본문과 영어 개정 이력 모두 이 절을 의도적으로 잘라 둔 상태이므로, 해석적 보완을 피하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: source fidelity / textual restraint
