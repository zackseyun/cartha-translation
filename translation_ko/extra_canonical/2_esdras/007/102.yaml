  rationale: ‘demonstra’의 직접적 요구를 살리면서도 한국어에서 자연스럽게 읽히도록 ‘보여 주십시오’로 옮겼습니다.
- source_word: si in die
  english_pob_choice: whether on the day
  chosen_korean: 곧 그 날에
  alternatives_korean:
