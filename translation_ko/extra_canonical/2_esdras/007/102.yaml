  text: And I answered and said, “If I have found favor before your eyes, show me also, your servant, whether on the day
translation:
  language: ko
  text: 내가 대답하여 말했습니다. 「내가 주의 눈앞에서 은총을 얻었으면, 당신의 종인 저에게도 보여 주십시오. 곧 그 날에」[a]
  philosophy: optimal-equivalence
  footnotes:
