id: 2ES.7.73
reference: 2 Esdras 7:73
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fraudauerunt eam quam acceperunt. Et quid habebunt dicere in iudicio, uel quo-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/073.yaml
  text: They have defrauded her whom they received. And what will they have to say in the judgment[a], or how will they answer in the last times?
  footnotes:
  - marker: a
    text: Or 'What then'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 자신들이 받은 이를 속였습니다. 그리고 심판 때에 그들이 무엇을 말하겠습니까, 혹은 마지막 때에 어떻게 대답하겠습니까?[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 “그렇다면 무엇을”
    reason: previous_rendering
lexical_decisions:
- source_word: fraudauerunt
  english_pob_choice: They have defrauded
  chosen_korean: 속였습니다
  alternatives_korean:
  - 사취했습니다
  - 기만했습니다
  lexicon: fraudare
  rationale: 피해를 주는 부정한 속임의 의미를 살려, 단순한 '기만'보다 직접적인 '속이다'를 택했습니다.
- source_word: eam quam acceperunt
  english_pob_choice: her whom they received
  chosen_korean: 그들이 받은 이를
  alternatives_korean:
  - 그들이 받아들인 그녀를
  - 그들이 받은 여자들을
  lexicon: ea/quam accipere
  rationale: 라틴어의 여성 단수 목적어를 반영하되, 한국어에서는 성별 표지가 약한 '이를'로 자연스럽게 옮겼습니다.
- source_word: in iudicio
  english_pob_choice: in the judgment
  chosen_korean: 심판 때에
  alternatives_korean:
  - 재판에서
  - 판결 때에
  lexicon: iudicium
  rationale: 법정적 'judgment'를 살리면서 종말론적 맥락을 분명히 하기 위해 '심판'을 선택했습니다.
- source_word: uel quo- / the last times
  english_pob_choice: or how will they answer in the last times
  chosen_korean: 혹은 마지막 때에 어떻게 대답하겠습니까
  alternatives_korean:
  - 아니면 마지막 때에 어떻게 대답하겠습니까
  - 혹은 종말에 어떻게 변명하겠습니까
  lexicon: quo / respondere
  rationale: 라틴어의 병렬 질문 구조를 유지했고, '대답하다'로 책임 추궁 앞의 응답을 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: 종말 심판의 법정적 표현
  chosen_reading: '''심판 때''와 ''마지막 때''를 병렬로 두어, 현재의 부정이 종말의 심판 앞에서 해명 불가능한 상태임을 드러냈습니다.'
  alternative_readings:
  - '''재판 때''로 법정 이미지를 더 강하게 할 수 있음'
  - '''마지막 때''를 ''끝날''로 바꿀 수 있음'
  rationale: 본문의 질문은 단순한 미래 일반이 아니라 책임 추궁과 판결의 장면을 가리키므로 법정성과 종말성을 함께 유지하는 것이 적절합니다.
  doctrine_reference: 종말론적 심판과 책임의 언어
