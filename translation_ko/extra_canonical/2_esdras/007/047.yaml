  text: And now I see that the age to come will bring joy to few[a], but torments to many.
  footnotes:
  - marker: a
    text: Or 'And now I see that the joy of the age to come will benefit few, but torments many.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 오는 시대의 기쁨은 소수에게, 그러나 고통은 많은 사람에게 돌아갈 것을 봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘돌아갈 것을’은 라틴어 pertinebit의 귀속적 의미를 살린 것입니다.
    reason: source_note
lexical_decisions:
- source_word: ad paucos pertinebit / ad paucos ...
  english_pob_choice: will bring joy to few
  chosen_korean: 소수에게 ... 돌아갈 것을
  alternatives_korean:
  - 몇 사람에게 ... 속할 것을
  - 적은 사람에게 ... 미칠 것을
  lexicon: pertinere
  rationale: 라틴어는 ‘기쁨이 소수에게 귀속된다’는 뜻이어서, 한국어에서도 단순히 ‘기쁨이 있다’보다 ‘돌아가다/속하다’로 귀속 관계를 살렸습니다.
- source_word: iocunditatem
  english_pob_choice: joy
  chosen_korean: 기쁨
  alternatives_korean:
  - 즐거움
  - 환희
  lexicon: iocunditas
  rationale: 문맥상 미래 시대의 복된 상태를 가리키므로, 자연스럽고 과장되지 않은 ‘기쁨’이 가장 직접적입니다.
- source_word: tormenta
  english_pob_choice: torments to many
  chosen_korean: 고통은 많은 사람에게
  alternatives_korean:
  - 형벌은 많은 사람에게
  - 고문은 많은 사람에게
  lexicon: tormentum
  rationale: 라틴어 tormenta는 육체적/형벌적 ‘고통’까지 포함할 수 있으나, 한국어 본문에서는 의미 범위를 넓게 유지하되 주석 없이도 읽히는 ‘고통’으로 옮겼습니다.
theological_decisions:
- issue: 오는 시대의 분배 대조(소수 vs 많은 사람)
  chosen_reading: 미래 시대는 기쁨이 소수에게, 고통은 많은 사람에게 귀속된다는 대조를 그대로 살렸습니다.
  alternative_readings:
  - 미래 시대가 소수에게는 기쁨을, 많은 사람에게는 고통을 가져온다
  - 오는 시대의 기쁨은 소수에게만 유익하고 고통은 많은 사람에게 미친다
  rationale: 라틴어의 비대칭 구조를 평탄화하지 않고, 수혜/귀속의 대조를 유지해야 본문의 종말론적 긴장이 보존됩니다.
  doctrine_reference: 종말론적 보응과 선택적 수혜의 대비
