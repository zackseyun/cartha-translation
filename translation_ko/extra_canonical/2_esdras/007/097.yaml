source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et spatiosum, [quod incipient] recipere fruniscentes et immortales. Sextus ordo, quando eis ostendetur, quomodo incipiet uultus eorum fulgere sicut sol, et quomodo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/097.yaml
  text: 'The sixth order: when it will be shown to them how their face will begin to shine like the sun, and how they will begin to be made like the light of the stars, being from then on incorruptible.'
translation:
  language: ko
  text: 여섯째 순서는 이렇습니다. 그들의 얼굴이 해처럼 어떻게 빛나기 시작할지, 또 그들이 별들의 빛과 같이 되기 시작하여 그때부터 썩지 않게 되는 것이 어떻게 이루어질지가 그들에게 보여질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sextus ordo
  english_pob_choice: The sixth order
  chosen_korean: 여섯째 순서
  alternatives_korean:
  - 여섯 번째 질서
  - 여섯 번째 차례
  lexicon: ordo
  rationale: lat. ordo를 POB의 문맥상 직역적이면서도 자연스러운 ‘순서’로 옮겼고, 서열·단계의 뉘앙스를 살리기 위해 서수형을 붙였습니다.
- source_word: quando eis ostendetur
  english_pob_choice: when it will be shown to them
  chosen_korean: 그들에게 … 어떻게 드러날지 보여질 것입니다
  alternatives_korean:
  - 그들에게 … 어떻게 보여질 때
  - 그들에게 … 어떻게 나타날지
  lexicon: ostendō
  rationale: ostendetur의 미래 수동을 반영해 ‘보여질 것입니다’로 처리하고, 라틴어가 암시하는 ‘드러남’의 성격을 함께 살리기 위해 ‘드러날지’를 병기했습니다.
- source_word: uultus eorum fulgere sicut sol
  english_pob_choice: their face will begin to shine like the sun
  chosen_korean: 그들의 얼굴이 해처럼 빛나기 시작하고
  alternatives_korean:
  - 그들의 얼굴이 태양처럼 빛나기 시작하고
  - 그들의 얼굴이 해같이 빛나기 시작하고
  lexicon: uultus / fulgere / sol
  rationale: uultus는 ‘얼굴’, fulgere는 ‘빛나다’, sol은 문학적으로 가장 자연스러운 ‘해’로 옮겨 원문의 비유를 직접 살렸습니다.
- source_word: fruniscentes et immortales
  english_pob_choice: being from then on incorruptible
  chosen_korean: 그때부터 썩지 않게 될
  alternatives_korean:
  - 그때부터 부패하지 않게 될
  - 그때부터 불멸하게 될
  lexicon: fruniscentes / immortales
  rationale: 영어 POB가 한 덩어리로 풀이한 종말론적 상태를 따라, ‘썩지 않게 될’로 부패 불가의 의미를 보존하되 과도하게 철학화된 ‘불멸’은 피했습니다.
theological_decisions:
- issue: fragmentary source and dependent future sense
  chosen_reading: 현존하는 라틴어 단편의 미래 수동 뉘앙스를 따라, 전체 문장을 ‘보여질 것입니다’로 마무리했습니다.
  alternative_readings:
  - 현재형으로 자연화하여 ‘보여집니다’로 처리
  - 단절된 단편성을 드러내지 않고 완결형으로 재구성
  rationale: Bensly 본문과 POB 수정에서 ostendetur의 미래성이 분명하므로, 한국어에서도 미래 전망을 유지하는 편이 원문 충실도에 더 적합합니다.
  doctrine_reference: source fidelity / tense correspondence
