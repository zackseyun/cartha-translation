- from: 여섯째 순서입니다. 그들에게 그들의 얼굴이 해처럼 빛나기 시작하고, 또한 별들의 빛과 같이 되기 시작하며, 그때부터 썩지 않게 될 것이 어떻게 드러날지 보여질 것입니다.[a]
  to: 여섯째 순서는 이렇습니다. 그들의 얼굴이 해처럼 어떻게 빛나기 시작할지, 또 그들이 별들의 빛과 같이 되기 시작하여 그때부터 썩지 않게 되는 것이 어떻게 이루어질지가 그들에게 보여질 것입니다.
