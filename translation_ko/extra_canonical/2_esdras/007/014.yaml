source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si ergo non ingredientes ingressi fuerint qui vivunt angusta et vana haec, non poterunt recipere quae sunt reposita.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/014.yaml
  text: Therefore[a], if those who live do not enter these narrow and vain things, they cannot receive what has been stored up.
  footnotes:
  - marker: a
    text: Or 'enter'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 살아 있는 자들이 이 좁고 헛된 것들에 들어가지 않으면, 예비된 것을 받을 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: si ergo
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그런즉
  - 따라서
  lexicon: si ergo
  rationale: 문맥을 잇는 결론 표지로, 라틴어의 논리적 연결을 한국어에서 자연스럽게 드러내는 가장 무난한 대응입니다.
- source_word: ingredientes ingressi fuerint
  english_pob_choice: enter
  chosen_korean: 들어가지 않으면
  alternatives_korean:
  - 들어가면
  - 들어가지 못하면
  - 들어가 버리면
  lexicon: ingredior
  rationale: 중복 동사구는 단순 반복이 아니라 조건절에서의 들어감 자체를 강조하는 셈법이지만, 문장 흐름상 한국어에는 과장된 부사 없이 부정 조건으로 옮기는 편이 원문 충실성과 자연성을 함께 지킵니다.
- source_word: angusta et vana haec
  english_pob_choice: these narrow and vain things
  chosen_korean: 이 좁고 헛된 것들
  alternatives_korean:
  - 이 협소하고 헛된 것들
  - 이 비좁고 헛된 것들
  - 이 좁고 공허한 것들
  lexicon: angustus; vanus
  rationale: angusta는 물리적·비유적 ‘좁음’을, vana는 ‘헛됨/공허함’을 뜻하므로 각각을 분리해 살렸습니다.
- source_word: quae sunt reposita
  english_pob_choice: what has been stored up
  chosen_korean: 예비된 것
  alternatives_korean:
  - 간직된 것
  - 쌓여 있는 것
  - 저장된 것
  lexicon: repono
  rationale: reposita는 단순 저장보다 ‘미리 마련되어 둠’의 뉘앙스가 강해, 한국어에서는 구원의 유보된 보상을 암시하는 ‘예비된 것’이 가장 적절합니다.
theological_decisions:
- issue: angusta et vana의 해석
  chosen_reading: 이 표현을 물리적 좁음과 가치의 헛됨이 함께 있는 경구로 옮겼습니다.
  alternative_readings:
  - 좁고 공허한 것들
  - 힘들고 헛된 것들
  rationale: 원문은 단순히 ‘어렵다’는 뜻이 아니라, 지금 살고 있는 세계/상태의 제한성과 허망함을 함께 말하므로 둘 다 유지해야 합니다.
  doctrine_reference: 4 Ezra의 종말론적 경고 문맥
