  yaml_path: translation/extra_canonical/2_esdras/007/074.yaml
  text: For how long has the Most High shown long-suffering to those who inhabit the age—not for their sake, but because of the times that he has foreseen! And I answered and said, “If I have found favor
translation:
  language: ko
  text: 그들이 마지막 때에 어떻게 대답하겠습니까? 지극히 높으신 분께서 이 세상에 사는 이들에게 오래 참으신 지가 얼마나 되었습니까? 그것은 그들 때문이 아니라, 그분이 미리 내다보신 때들 때문입니다! 그리고 제가 대답하여 말했습니다. “제가 은혜를 얻었다면
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: The title denotes God’s supreme exalted status in context.
  rationale: 라틴어 칭호의 위격을 살리되, 현대 한국어 합쇼체에 자연스러운 존칭 표현으로 옮겼습니다.
- source_word: longanimitatem habuit
  english_pob_choice: shown long-suffering
  chosen_korean: 오래 참으셨습니다
  alternatives_korean:
  - 인내하셨습니다
  - 오래도록 참아오셨습니다
  lexicon: The phrase emphasizes extended patience toward ongoing history.
  rationale: 지속적 인내의 뉘앙스를 살리면서도, 한국어에서 자연스럽고 분명한 표현을 택했습니다.
- source_word: inhabitant saeculum
  english_pob_choice: those who inhabit the age
  chosen_korean: 이 세대에 사는 이들
  alternatives_korean:
  - 이 세상에 사는 자들
  - 현세에 사는 이들
  lexicon: saeculum here refers to the present age/world-order, not merely an abstract era.
  rationale: 단순한 ‘시대’보다 현재의 세상 질서에 사는 사람들을 가리키는 뜻이 드러나도록 옮겼습니다.
- source_word: ea quae prouidit tempora
  english_pob_choice: the times that he has foreseen
  chosen_korean: 그분이 미리 내다보신 때들
  alternatives_korean:
  - 그분이 예비하신 때들
  - 그분이 미리 정하신 때들
  lexicon: The source links divine foreknowledge with the appointed times.
  rationale: ‘미리 내다보신’으로 예지의 뜻을, ‘때들’로 복수의 시기들을 반영했습니다.
- source_word: si inueni gratiam
  english_pob_choice: If I have found favor
  chosen_korean: 제가 은혜를 얻었다면
  alternatives_korean:
  - 제가 호의를 얻었다면
  - 제가 은총을 받았다면
  lexicon: Latin gratiam in supplicatory/recorded speech commonly means favor/grace.
  rationale: 기존 POB의 ‘favor’ 의미를 살리되, 한국어에서는 ‘은혜를 얻다’가 간결하고 서사적 흐름에 맞습니다.
theological_decisions:
- issue: 지극히 높으신 분의 오래 참으심의 이유
  chosen_reading: 하나님의 인내는 그분 자신을 위한 것이 아니라, 미리 정하신 때들을 위한 것이라는 대비를 그대로 살렸습니다.
  alternative_readings:
  - 사람들을 위한 인내로 완화하는 해석
  - 시간의 예정만 강조하고 대상 대비를 약화하는 해석
  rationale: 본문은 ‘그들의 때문이 아니라, … 때들 때문’이라는 대비를 분명히 세우므로, 그 긴장을 약화하지 않고 유지해야 합니다.
  doctrine_reference: divine patience and providence
