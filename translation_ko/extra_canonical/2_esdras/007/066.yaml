  yaml_path: translation/extra_canonical/2_esdras/007/066.yaml
  text: For it is much better for them than for us, for they do not expect judgment, nor do they know torments or the salvation promised after death.
translation:
  language: ko
  text: 그들에게는 우리보다 훨씬 더 좋습니다. 그들은 심판을 기대하지도 않고, 죽음 뒤에 약속된 고통도 구원도 알지 못하기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 현존 본문에는 ‘고통’과 ‘죽음 뒤에 약속된 구원’이 직접 보이지 않지만, 영문 POB의 감사 추적에서 확인되는 보강 의미를 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: iocundentur
  english_pob_choice: For it is much better for them than for us
  chosen_korean: 그들에게는 우리보다 훨씬 더 좋습니다
  alternatives_korean:
  - 그들은 우리보다 훨씬 더 즐겁습니다
  - 그들에게는 우리보다 훨씬 더 낫습니다
  lexicon: iocundentur
  rationale: 라틴어 iocundentur는 ‘기뻐하다/즐거워하다’ 계열이지만, 문맥상 비교 결과를 말하는 구문이므로 한국어에서는 의미를 살려 ‘훨씬 더 좋습니다’로 옮기는 편이 자연스럽고 본문의 판단을 유지합니다.
- source_word: non enim sperant iudicium
  english_pob_choice: for they do not expect judgment
  chosen_korean: 그들은 심판을 기대하지도 않고
  alternatives_korean:
  - 그들은 심판을 바라지 않으며
  - 그들은 심판을 기다리지도 않고
  lexicon: sperare / iudicium
  rationale: sperant는 단순한 지식이 아니라 ‘기대하다/바라다’의 뜻이므로, iudicium은 종말론적 ‘심판’으로 직역하되 한국어 어순을 조정해 자연스럽게 표현했습니다.
- source_word: torments
  english_pob_choice: torments
  chosen_korean: 고통
  alternatives_korean:
  - 형벌
  - 고문
  lexicon: tormenta
  rationale: 라틴어 본문에는 직접 대응어가 보이지 않지만, 영문 POB의 audit trail이 가리키는 개념을 반영해 과도하게 해석하지 않는 범위에서 ‘고통’으로 옮겼습니다.
- source_word: salvation promised after death
  english_pob_choice: the salvation promised after death
  chosen_korean: 죽음 뒤에 약속된 구원
  alternatives_korean:
  - 죽은 뒤에 약속된 구원
  - 사후에 약속된 구원
  lexicon: salus promissa post mortem
  rationale: post mortem의 의미를 살려 ‘죽음 뒤에’로 옮기고, salus는 기존 POB 관례에 맞게 ‘구원’으로 번역했습니다.
theological_decisions:
- issue: 본문 범위와 영문 POB 보강 내용의 처리
  chosen_reading: 현존 라틴어 본문은 심판의 부재를 말하며, 영문 POB가 덧붙인 ‘고통’과 ‘죽음 뒤에 약속된 구원’은 맥락상 보강된 의미로 함께 반영했습니다.
  alternative_readings:
  - 라틴 본문만 따라 ‘그들은 심판을 기대하지 않기 때문입니다’로 끝낼 수 있음
  - 영문 POB를 따라 더 확장해 완전한 문장으로 재구성할 수 있음
  rationale: 청크된 라틴 본문과 영문 POB의 audit trail을 함께 존중하되, 원문에 없는 내용을 과도하게 증식시키지 않도록 최소한으로 반영했습니다.
  doctrine_reference: 2 Esdras 7:66 context; post-mortem recompense in apocalyptic literature
