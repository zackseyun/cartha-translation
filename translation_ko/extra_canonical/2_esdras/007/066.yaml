  source_fidelity: 개정이 필요합니다. 제시된 라틴어 본문에서 명시적으로 확인되는 내용은 ‘그들이 기뻐하게 하라/기뻐하게 하십시오’, ‘그들에게 우리보다 훨씬 더 낫다’, ‘그들이 심판을 기대하지 않는다’까지입니다. 초안의 ‘죽음 뒤에 약속된 고통도 구원도’는 제공된 원문에는 없으므로 본문에 보충할 수 없습니다. 영문 POB에 있는 확장 내용도 이 대조 자료만으로는 라틴어 본문에 대한 근거가 되지 않습니다.
  naturalness: ‘그들에게는 우리보다 훨씬 더 낫습니다’와 ‘심판을 기대하지 않기 때문입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 문두의 단독 iocundentur는 앞 문맥이 잘린 형태이므로, 문법적 직설적 의미를 보존하여 ‘그들이 기뻐하게 하십시오’로 옮겼습니다.
  terminology: iudicium은 종말론적 문맥에 맞게 ‘심판’으로 유지했습니다. 원문에 없는 tormenta 및 salus promissa post mortem에 대응하는 ‘고통’ 및 ‘구원’은 삭제했습니다.
