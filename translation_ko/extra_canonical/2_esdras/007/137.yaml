  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si enim non multiplicaverit, non vivificabitur saeculum cum his qui habitant in eo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/137.yaml
  text: For if he does not multiply them[a], the age will not be given life with those who dwell in it.
  footnotes:
  - marker: a
    text: Or 'did not multiply them, the age would not be made alive'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그것들을 많게 하지 않으시면, 그 안에 사는 이들과 함께 그 시대는 생명을 얻지 못할 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그가 그것들을 많게 하지 않았더라면, 그 시대는 생명을 얻지 못했을 것이다’.
    reason: alternative_reading
lexical_decisions:
- source_word: si enim non multiplicaverit
  english_pob_choice: For if he does not multiply them
  chosen_korean: 그가 그것들을 많게 하지 않으시면
  alternatives_korean:
  - 그가 그것들을 번성하게 하지 않으시면
  - 그가 그것들을 증가시키지 않으시면
  lexicon: multiplicare
  rationale: 라틴어 multiplicare는 단순한 수적 증가보다 ‘많게 하다, 번성하게 하다’의 뜻을 포함하므로, 문맥을 과장하지 않으면서도 동사의 결과성을 살려 옮겼습니다.
- source_word: vivificabitur
  english_pob_choice: the age will not be given life
  chosen_korean: 그 시대는 생명을 얻지 못할 것입니다
  alternatives_korean:
  - 그 시대는 생명을 받지 못할 것입니다
  - 그 시대는 살아나지 못할 것입니다
  lexicon: vivificare
  rationale: vivificabitur의 수동 미래를 한국어의 자연스러운 종결로 옮기되, ‘살아나지 못하다’보다 ‘생명을 얻지 못하다’가 더 직접적으로 생명 부여의 의미를 드러냅니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 그 시대
  alternatives_korean:
  - 그 세상
  - 그 세대
  lexicon: saeculum
  rationale: 여기서는 장소로서의 ‘세상’보다 시간적·구조적 범위를 가리키는 ‘시대’가 라틴어 saeculum의 의미를 더 잘 반영합니다.
- source_word: cum his qui habitant in eo
  english_pob_choice: with those who dwell in it
  chosen_korean: 그 안에 사는 이들과 함께
  alternatives_korean:
  - 그 안에 거하는 자들과 함께
  - 그 안에 사는 사람들과 함께
  lexicon: habitare
  rationale: habitare는 단순한 일시적 체류보다 ‘거주하다, 살다’의 뜻이므로, 현대 한국어의 자연스러운 표현인 ‘사는 이들’로 옮겼습니다.
theological_decisions:
- issue: 조건문의 시제와 논리적 힘
  chosen_reading: 미래 조건을 그대로 살려 ‘만일 ... 하지 않으시면, ... 생명을 얻지 못할 것입니다’로 옮겼습니다.
  alternative_readings:
  - 반사실적 조건으로 ‘하지 않았더라면 ... 얻지 못했을 것입니다’로 옮김
  - 현재 일반진리처럼 ‘하지 않으면 ... 얻지 못합니다’로 옮김
  rationale: 라틴어의 future perfect protasis와 미래 수동 apodosis가 만드는 논리적 조건을 보존해야 하므로, 과거 반사실이나 단정적 현재로 약화시키지 않았습니다.
  doctrine_reference: 문법-의미 보존 원칙
- issue: ‘그것들’의 지시 대상
  chosen_reading: 영문 POB를 따라 ‘그것들’로 두어, 앞뒤 문맥에서 지시되는 다수의 대상이 생명 부여의 조건에 놓여 있음을 드러냈습니다.
  alternative_readings:
  - ‘그들을’로 인칭화함
  - 명시적 대상을 보충함
  rationale: 라틴어 multiplex/ vivificabitur의 대상 지시가 문맥상 다수의 피조물 또는 결과물을 가리킬 수 있으나, 본절 자체는 대상을 명시하지 않으므로 한국어에서도 과도한 보충을 피했습니다.
  doctrine_reference: 원문 지시성 보존 원칙
