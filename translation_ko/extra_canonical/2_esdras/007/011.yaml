id: 2ES.7.11
reference: 2 Esdras 7:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter eos enim feci saeculum, et quando transgressus est Adam constitutiones meas, iudicatum est quod factum est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/011.yaml
  text: For their sake I made the world[a], and when Adam transgressed my ordinances, what had been made was judged.
  footnotes:
  - marker: a
    text: Or 'For because of them I made the age'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들을 위하여 내가 세상을 만들었습니다[a]. 그리고 아담이 내 규례들을 어겼을 때, 만들어진 것이 심판을 받았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 때문에 내가 시대를 만들었다’.
    reason: saeculum의 시간적 의미와 propter eos의 인과적 해석 가능성을 반영한 이전 번역입니다.
lexical_decisions:
- source_word: propter eos enim
  english_pob_choice: For their sake
  chosen_korean: 그들의 유익을 위해
  alternatives_korean:
  - 그들을 위해
  - 그들 때문에
  - 그들의 덕분에
  lexicon: propter + 목적/이익의 방향성
  rationale: propter eos는 단순한 원인보다 대상의 이익을 위한 목적성을 나타내므로, 한국어도 ‘~을/를 위해’보다 ‘그들의 유익을 위해’로 그 방향을 분명히 했습니다.
- source_word: feci saeculum
  english_pob_choice: I made the world
  chosen_korean: 세상을 지었습니다
  alternatives_korean:
  - 세계를 만들었습니다
  - 세상을 만들었습니다
  - 시대를 지었습니다
  lexicon: feci + saeculum
  rationale: 이 절에서는 saeculum이 뒤의 ‘what had been made’와 연결되어 창조된 세계를 가리키므로 ‘세상’이 자연스럽고, ‘지었습니다’는 창조 행위를 더 직접적으로 드러냅니다.
- source_word: constitutiones meas
  english_pob_choice: my ordinances
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 법령들
  - 내 명령들
  - 내 법도들
  lexicon: constitutio
  rationale: constitutiones는 단순한 일반 법보다 신적 규범·규정을 가리키는 말이므로, 성경 한국어에서 의미가 분명한 ‘규례들’로 옮겼습니다.
- source_word: iudicatum est quod factum est
  english_pob_choice: what had been made was judged
  chosen_korean: 만들어진 것에 대해 심판이 내려졌습니다
  alternatives_korean:
  - 만들어진 것이 심판을 받았습니다
  - 지어진 것이 판결받았습니다
  - 지음 받은 것이 정죄되었습니다
  lexicon: iudico
  rationale: iudicatum est는 단순 판정이 아니라 종말론적 심판의 선언이므로, 결과를 수동적으로 받는 표현인 ‘심판이 내려졌습니다’로 옮겼습니다.
theological_decisions:
- issue: saeculum의 의미
  chosen_reading: 여기서는 ‘시대’보다 ‘세상/창조 세계’로 이해했습니다.
  alternative_readings:
  - 시대
  - 세대
  - 현세
  rationale: 본문의 saeculum은 4 Ezra 7:11의 문맥에서 ‘feci’의 대상이며 뒤의 ‘what had been made’와 평행하므로, 시간적 ‘시대’보다 창조된 세계를 뜻하는 것으로 읽는 것이 더 적절합니다.
  doctrine_reference: 창조론/종말론적 심판
