  yaml_path: translation/extra_canonical/2_esdras/007/062.yaml
  text: And I answered and said, “O earth, what have you brought forth, if understanding has been made from dust, like the rest of creation?
translation:
  language: ko
  text: 그리고 나는 대답하여 말했습니다. “오 땅이여, 이해력이 다른 피조물과 마찬가지로 티끌에서 만들어졌다면, 무엇을 낳았습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondit et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 그리고 나는 대답하여 말했습니다
  alternatives_korean:
  - 그리고 내가 대답하여 말했습니다
  - 나는 대답하며 말했습니다
  lexicon: respondere / dicere
  rationale: 라틴어의 연속된 응답 동사 두 개를 자연스러운 한국어 서술로 옮기되, 원문의 응답-발화 구조를 유지했습니다.
- source_word: O tu terra
  english_pob_choice: O earth
  chosen_korean: 오 땅이여
  alternatives_korean:
  - 오, 땅이여
  - 오 대지여
  lexicon: terra
  rationale: 호격을 분명히 드러내기 위해 「땅이여」로 옮겼고, 창조 질서 전체를 가리키는 일반적 의미를 살려 「대지」보다 「땅」을 택했습니다.
- source_word: quid peperisti
  english_pob_choice: what have you brought forth
  chosen_korean: 당신은 무엇을 낳았습니까
  alternatives_korean:
  - 무엇을 낳으셨습니까
  - 무엇을 산출하셨습니까
  lexicon: peperisti
  rationale: peperisti의 출산/산출 이미지를 보존하되, 수사적 질문의 직접성을 살려 「낳다」를 기본으로 두었습니다.
- source_word: sensus
  english_pob_choice: understanding
  chosen_korean: 이해
  alternatives_korean:
  - 지각
  - 깨달음
  lexicon: sensus
  rationale: 문맥상 인지 능력/이성의 문제를 가리키므로 가장 중립적인 「이해」를 선택했습니다.
theological_decisions:
- issue: “understanding has been made from dust”의 인간 존재론적 긴장
  chosen_reading: 이해가 먼지에서 만들어졌다는 진술을 그대로 살려 인간 인식 능력의 유한성과 피조성의 긴장을 드러냈습니다.
  alternative_readings:
  - 이해가 흙에서 생겨났다면
  - 이해가 티끌로 빚어졌다면
  rationale: 원문은 인간의 이해가 흙/먼지와 같은 낮은 물질성에서 기원했다는 충격적 대비를 말하므로, 이를 완화하지 않고 직설적으로 보존하는 것이 본문 취지에 맞습니다.
  doctrine_reference: 인간의 피조성과 유한성에 대한 성서적 인류론
