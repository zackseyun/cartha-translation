id: 2ES.7.113
reference: 2 Esdras 7:113
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dies enim iudicii erit finis temporis huius et initium futuri inmortalistemporis, in quo pertransivit corruptela,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/113.yaml
  text: For the day of judgment will be the end of this time and the beginning of the immortal time to come[a], in which corruption has passed away,
  footnotes:
  - marker: a
    text: Or 'the future immortal time'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 심판의 날은 이 시대의 끝이 되고 장차 올 불멸의 시대의 시작이 되며, 그 시대에는 썩음이 사라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미래의 불멸의 시대’.
    reason: previous_rendering
lexical_decisions:
- source_word: Dies enim iudicii
  english_pob_choice: the day of judgment
  chosen_korean: 심판의 날
  alternatives_korean:
  - 재판의 날
  - 판결의 날
  lexicon: iudicium → 심판
  rationale: 라틴어 iudicium은 단순한 법정 판결보다 종말론적 심판의 뜻이 강하므로, apocalyptic 문맥에 맞게 ‘심판의 날’로 옮겼습니다.
- source_word: finis temporis huius
  english_pob_choice: the end of this time
  chosen_korean: 이 시대의 끝
  alternatives_korean:
  - 이 시간의 끝
  - 이 때의 종말
  lexicon: tempus → 시대
  rationale: 여기서 tempus는 한순간의 ‘시간’보다 두 시대를 대비하는 종말론적 ‘시대’로 읽는 것이 더 자연스럽고, 앞뒤의 ‘오는 불멸의 시대’와도 대응됩니다.
- source_word: initium futuri inmortalis temporis
  english_pob_choice: the beginning of the immortal time to come
  chosen_korean: 장차 올 불멸의 시대의 시작
  alternatives_korean:
  - 미래의 불멸한 시간의 시작
  - 오게 될 불멸의 시간의 시작
  lexicon: futuri inmortalis temporis → 장차 올 불멸의 시대
  rationale: futuri는 단순 미래형보다 종말론적 ‘장차 올’의 뉘앙스가 강하고, inmortalis temporis는 ‘불멸의 시대’로 두어 두 시대의 대조를 살렸습니다.
- source_word: pertransivit corruptela
  english_pob_choice: in which corruption has passed away
  chosen_korean: 그 안에서는 썩을 것이 사라집니다
  alternatives_korean:
  - 그 안에서는 부패가 지나가 버립니다
  - 그 안에서는 썩음이 지나갔습니다
  lexicon: corruptela → 썩을 것/부패
  rationale: corruptela는 추상적 ‘부패’도 가능하지만, 문맥상 사라지는 대상의 상태를 살려 한국어에서는 ‘썩을 것’으로 풀어 표현했습니다.
theological_decisions:
- issue: 두 시대의 종말론적 대비
  chosen_reading: ‘이 시대’와 ‘장차 올 불멸의 시대’를 병렬해 현재 질서의 समाप्त과 새 질서의 개시를 분명히 드러냈습니다.
  alternative_readings:
  - ‘이 시간’과 ‘미래의 불멸한 시간’으로 직역할 수 있음
  - ‘이 세대’와 ‘오는 세대’로 옮길 수도 있음
  rationale: 본문은 단순한 시간 경과가 아니라 종말론적 전환을 말하므로, 한국어에서도 ‘시대’로 대조를 세워 원문의 이원론적 구조를 보존했습니다.
  doctrine_reference: 4 Ezra/2 Esdras의 종말론적 두 시대 개념
