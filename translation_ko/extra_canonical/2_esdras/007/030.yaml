id: 2ES.7.30
reference: 2 Esdras 7:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et convertetur saeculum in antiquum silentium diebus septem sicut in prioribus initiis, ita ut nemo derelinquatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/030.yaml
  text: And the age will return to the ancient silence for seven days, as in the former beginnings, so that no one is left behind.
translation:
  language: ko
  text: 그 시대는 옛 침묵으로 일곱 날 동안 돌아갈 것이며, 이전의 처음들처럼 아무도 남겨지지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: convertetur
  english_pob_choice: will return to
  chosen_korean: 돌아갈 것이며
  alternatives_korean:
  - 되돌려질 것입니다
  - 되돌아갈 것입니다
  lexicon: converto
  rationale: 라틴어 수동형 convertetur는 단순한 ‘되돌려짐’보다 상태가 ‘다시 돌아감’의 의미가 자연스럽고, POB의 개정된 영어 문장도 this nuance를 반영하므로 ‘돌아가다’로 옮겼습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 그 시대
  alternatives_korean:
  - 그 세대
  - 이 세상
  - 세상
  lexicon: saeculum
  rationale: 여기서는 단순한 ‘세대’보다 종말론적 시간 단위로서의 ‘시대’가 더 적합하며, 한국어에서는 문맥상 ‘그 시대’가 자연스럽습니다.
- source_word: antiquum silentium
  english_pob_choice: the ancient silence
  chosen_korean: 옛 침묵
  alternatives_korean:
  - 옛적의 침묵
  - 고대의 침묵
  lexicon: antiquus + silentium
  rationale: antiquum은 ‘고대의’보다 ‘옛’이 더 간결하고, silentium은 문자 그대로 ‘침묵’으로 유지해 원문의 이미지와 긴장을 살렸습니다.
- source_word: derelinquatur
  english_pob_choice: no one is left behind
  chosen_korean: 아무도 남겨지지 않을 것입니다
  alternatives_korean:
  - 아무도 버려지지 않을 것입니다
  - 아무도 남지 않을 것입니다
  lexicon: derelinquo
  rationale: derelinquatur는 단순 소멸보다 ‘남겨지다/버려지다’의 뉘앙스가 있어, POB의 ‘left behind’를 살리면서도 한국어에서 더 자연한 수동 표현으로 옮겼습니다.
theological_decisions:
- issue: 시대의 ‘침묵’이 무엇을 가리키는가
  chosen_reading: 우주적·종말론적 정지 상태를 암시하는 표현으로, ‘옛 침묵’을 그대로 유지했습니다.
  alternative_readings:
  - ‘고요’로 완화하여 번역
  - 의미를 풀어 ‘아무 소리 없는 때’로 번역
  rationale: 본문은 상태의 이미지가 핵심이므로 의미를 설명적으로 풀기보다 침묵의 도상을 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 종말론적 묘사 일반
- issue: nemo derelinquatur의 범위
  chosen_reading: ‘아무도 남겨지지 않을 것입니다’로 집단 전체의 누락 없음과 버림받지 않음을 함께 담았습니다.
  alternative_readings:
  - ‘아무도 남지 않을 것입니다’
  - ‘아무도 버려지지 않을 것입니다’
  rationale: 문맥상 단순히 남아 있는 인원 수보다, 누군가가 제외되거나 뒤처지지 않는다는 함의가 있어 두 의미를 함께 살렸습니다.
  doctrine_reference: 본문 문맥
