    text: Or 'they themselves will pass over into torments'.
    reason: previous_rendering
translation:
  language: ko
  text: '제6의 길: 그들은 그들 가운데 일부가 고통으로 건너가게 되는 것을 봅니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들 자신이 고통으로 건너가게 됩니다”.
    reason: previous_rendering
lexical_decisions:
- source_word: Sexta uia
  english_pob_choice: The sixth way
  chosen_korean: 제6의 길
  alternatives_korean:
  - 여섯째 길
  - 여섯 번째 길
  lexicon: 숫자 서수 표현
  rationale: 라틴어 Sexta uia는 순서가 있는 ‘여섯째 길’의 뜻이므로, 현대 문어에서 자연스러운 ‘제6의 길’로 옮겼습니다.
- source_word: uidentes
  english_pob_choice: they see
  chosen_korean: 그들은 … 봅니다
  alternatives_korean:
  - 그들은 … 봅니다/보게 됩니다
  - 그들은 … 목격합니다
  lexicon: 시각 동사
  rationale: 현재형 서술을 유지하되, 단순한 시각 인지 이상의 장면 관찰을 담아 ‘봅니다’로 옮겼습니다.
- source_word: de eis
  english_pob_choice: some of them
  chosen_korean: 그들 가운데 일부가
  alternatives_korean:
  - 그들 중 일부가
  - 그들로부터 일부가
  lexicon: 부분격/부분지시
  rationale: de eis는 전체 중 일부를 가리키는 부분적 표현이므로, 오해 없는 한국어로 ‘그들 가운데 일부가’라고 풀었습니다.
- source_word: pertransient in cruciamentum
  english_pob_choice: will pass over into torment
  chosen_korean: 고통으로 건너가게 되는
  alternatives_korean:
  - 고문으로 넘어가게 되는
  - 고통 속으로 지나가게 되는
  lexicon: 이동 동사 + 목적어
  rationale: pertransire의 ‘건너가다/지나가다’와 cruciamentum의 ‘고통, 고문, 형벌적 괴로움’의 의미를 반영해, 장면의 이동성과 결과를 함께 살렸습니다.
theological_decisions:
- issue: cruciamentum의 성격
  chosen_reading: 여기서는 종말론적 형벌의 고통을 가리키는 말로 이해해 ‘고통’으로 옮겼습니다.
  alternative_readings:
  - ‘고문’
  - ‘형벌’
  - ‘괴로움’
  rationale: 문맥상 단순한 육체적 고통보다 심판의 결과로 겪는 고통이지만, 한국어에서 과도하게 해석을 고정하지 않기 위해 ‘고통’을 택했습니다.
  doctrine_reference: 종말론적 심판/형벌 묘사
