translation:
  language: ko
  text: 그러나 그들은 설득되지 않았고 그에게 맞섰으며, 스스로 헛된 생각을 품었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게 반박했습니다’.
    reason: contradixerunt ei의 더 좁고 어휘적인 대안 번역입니다.
  - marker: b
    text: 직역하면 ‘스스로 헛된 생각들을 세웠다’.
    reason: constituerunt sibi cogitamenta vanitatis의 구조를 드러내는 직역적 대안입니다.
lexical_decisions:
- source_word: non sunt persuasi
  english_pob_choice: were not persuaded
  chosen_korean: 설득되지 않았고
  alternatives_korean:
  - 납득하지 않았고
  - 권유를 받아들이지 않았고
  lexicon: persuade
  rationale: 단순한 정보 수용이 아니라 권면과 경고를 받아들이지 않은 반응이므로, 수동형으로 ‘설득되지 않았다’를 살렸습니다.
- source_word: contradixerunt ei
  english_pob_choice: contradicted him
  chosen_korean: 그에게 맞섰으며
  alternatives_korean:
  - 그를 반박했으며
  - 그와 논쟁했으며
  lexicon: contradict
  rationale: 문맥상 하나님의 명령에 대한 반항적 거절이므로, 단순한 말다툼보다 강한 ‘맞서다’가 힘을 더 잘 드러냅니다.
- source_word: constituerunt sibi cogitamenta vanitatis
  english_pob_choice: formed for themselves vain thoughts
  chosen_korean: 자신들을 위해 헛된 생각들을 지었습니다
  alternatives_korean:
  - 스스로 헛된 생각들을 세웠습니다
  - 자기들만의 공허한 생각들을 마련했습니다
  lexicon: constituerunt + cogitamenta vanitatis
  rationale: 형식적으로는 ‘세우다/지다’가 가능하지만, 여기서는 생각을 의도적으로 만들어 내는 뜻이므로 ‘지었습니다’가 자연스럽고 원문 구조도 유지합니다.
theological_decisions:
- issue: 인간의 반응이 단순한 지적 불일치인지, 하나님의 명령에 대한 반항인지
  chosen_reading: 본문의 ‘맞섰으며’는 단순한 반박을 넘어, 앞절의 엄중한 명령에 대한 불복과 반항을 드러내는 것으로 읽었습니다.
  alternative_readings:
  - 그에게 반박했으며
  - 그와 의견이 달랐으며
  rationale: 직전 문맥이 하나님의 명령을 다루므로, 여기서는 중립적 논쟁보다 불순종의 뉘앙스를 살리는 것이 본문 흐름에 더 부합합니다.
  doctrine_reference: 4 Ezra 7:21-22 문맥
