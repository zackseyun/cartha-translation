    rationale: ‘짓다’는 생각의 내용에 일반적으로 쓰이지 않아 한국어로 부자연스럽고, constituerunt의 ‘마음속에 세우다/형성하다’라는 의미도 충분히 드러내지 못합니다.
  - severity: low
    issue: ‘자신들을 위해’의 직역투
    rationale: sibi의 재귀적 용법은 여기서 수혜의 뜻보다 ‘스스로’라는 방식으로 옮기는 편이 자연스럽습니다.
  - severity: low
