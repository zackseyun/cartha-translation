source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et donator, quoniam si non donaverit de bonitate sua, ut adleventur hii qui iniquitates fecerunt de suis iniquitatibus, non poterit decies millesima pars hominum vivificari,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/138.yaml
  text: And he is generous[a], because if he did not give from his goodness, so that those who have committed iniquities might be relieved of their iniquities, not even a ten-thousandth part of mankind could be made alive,
  footnotes:
  - marker: a
    text: Or 'relieved from their iniquities'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 관대하십니다[a]. 왜냐하면 그가 자신의 선하심에서 주시지 않았다면, 불의를 저지른 이들이 자기들의 불의에서 덜어지게 하려는 것도 불가능했을 것이며, 인류의 만 분의 일도 살아나게 할 수 없었을 것이기 때문입니다,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 불의에서 덜어지게 하려는’
    reason: alternative_reading
lexical_decisions:
- source_word: Et donator / he is generous
  english_pob_choice: And he is generous
  chosen_korean: 그는 관대하십니다
  alternatives_korean:
  - 그는 주시는 분이십니다
  - 그는 베푸시는 분이십니다
  lexicon: donator
  rationale: 라틴어 분사적 서술을 자연스러운 현대 한국어 술어로 옮기면서, 단순히 ‘주는 분’보다 성향을 드러내는 ‘관대하다’가 POB의 영어 선택과 잘 맞습니다.
- source_word: bonitate sua
  english_pob_choice: from his goodness
  chosen_korean: 자신의 선하심에서
  alternatives_korean:
  - 자신의 선함에서
  - 자신의 좋으심에서
  lexicon: bonitas
  rationale: 도덕적 선행의 근거를 나타내는 표현이므로 ‘선하심’이 가장 직접적이며, 하나님에 대한 경외적 뉘앙스를 유지합니다.
- source_word: adleventur ... de suis iniquitatibus
  english_pob_choice: might be relieved of their iniquities
  chosen_korean: 자기들의 불의에서 덜어지게 하려는
  alternatives_korean:
  - 자기들의 불의에서 풀려나게 하려는
  - 자기들의 불의의 짐이 벗겨지게 하려는
  lexicon: adleventur / iniquitates
  rationale: 라틴어의 ‘덜어주다, 경감하다’라는 감각을 살려 죄의 부담이 가벼워지는 이미지를 살렸고, POB의 ‘relieved of’에 맞추어 ‘덜어지게 하다’로 옮겼습니다.
- source_word: decies millesima pars hominum
  english_pob_choice: not even a ten-thousandth part of mankind
  chosen_korean: 인류의 만 분의 일도
  alternatives_korean:
  - 인류의 만분의 일도
  - 사람의 만 분의 일도
  lexicon: decies millesima pars hominum
  rationale: 수량 표현을 그대로 보존해 과장된 비율의 충격을 유지했으며, ‘hominum’은 문맥상 인류 전체를 가리키므로 ‘인류’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주심과 인간의 생명 회복의 인과 관계
  chosen_reading: 하나님의 관대하신 베풂이 없으면, 죄인들의 죄책 경감과 인류의 생명 회복은 불가능하다는 논지를 그대로 드러냈습니다.
  alternative_readings:
  - 하나님은 은혜로우시다
  - 하나님은 주시는 분이시다
  rationale: 본문은 단순한 성품 진술을 넘어, 하나님의 선하심에서 나오는 베풂이 구제와 생명 부여의 조건임을 말하므로 인과 구조를 보존했습니다.
  doctrine_reference: 하나님의 은혜와 생명 부여의 주권
