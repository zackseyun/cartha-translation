  yaml_path: translation/extra_canonical/2_esdras/007/019.yaml
  text: And he said to me[a], “You are not a judge over the Lord, nor one who understands over the Most High.”
  footnotes:
  - marker: a
    text: Or 'a judge over the Lord, nor one wiser than'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 말했습니다. “당신은 주님보다 더 나은 재판관이 아니며, 지극히 높으신 분보다 더 잘 이해하는 이도 아닙니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘당신은 주님 위의 재판관이 아니며, 지극히 높으신 분 위의 이해자도 아닙니다.’ 라틴어 super(‘위에’)는 이 병렬 문맥에서 ‘~보다’라는 비교의 뜻으로 이해될 수 있습니다.
    reason: 라틴어 super의 문자적 위계 의미와 문맥상 비교 의미의 여지를 밝혀, 본문의 번역상 모호성을 보존합니다.
lexical_decisions:
- source_word: non es iudex super Dominum
  english_pob_choice: You are not a judge over the Lord
  chosen_korean: 당신은 주님 위에 있는 재판관이 아니며
  alternatives_korean:
  - 당신은 주님 위의 재판관이 아니며
  - 당신은 주님에 대한 재판관이 아니며
  lexicon: iudex / super
  rationale: iudex는 단순한 ‘판단자’보다 법정적·권위적 ‘재판관’이 더 정확하고, super는 POB의 직역 취지를 따라 위계 관계를 드러내는 ‘위에 있는’으로 옮겼습니다.
- source_word: intellegens super Altissimum
  english_pob_choice: one who understands over the Most High
  chosen_korean: 지극히 높으신 분보다 더 아는 이도 아닙니다
  alternatives_korean:
  - 지극히 높으신 분 위에 있는 이해자도 아닙니다
  - 지극히 높으신 분보다 더 지혜로운 이도 아닙니다
  lexicon: intellegens / super / Altissimus
  rationale: intellegens는 단순 지식보다 ‘이해하는 자’의 뜻이지만, 한국어에서 자연스럽고 문맥상 도발적인 대비를 살리기 위해 ‘더 아는 이’로 풀어, 비교 구조를 분명히 했습니다.
- source_word: Dominum / Altissimum
  english_pob_choice: the Lord / the Most High
  chosen_korean: 주님 / 지극히 높으신 분
  alternatives_korean:
  - 주 / 가장 높으신 분
  - 주님 / 가장 높으신 이
  lexicon: Dominus / Altissimus
  rationale: 신격 호칭은 한국어 성경에서 통용되는 ‘주님’과 ‘지극히 높으신 분’으로 옮겨, 존칭과 고유 호칭을 함께 살렸습니다.
theological_decisions:
- issue: 인간의 판단 권한과 하나님의 주권 대비
  chosen_reading: ‘당신은 주님 위에 있는 재판관이 아니며’로 옮겨, 사람이 하나님을 판단하는 위치에 있지 않다는 논지를 직접 드러냈습니다.
  alternative_readings:
  - ‘주님보다 나은 재판관이 아니며’
  - ‘주님에 대해 판단할 자격이 없으며’
  rationale: 라틴어 super의 위계적 뉘앙스를 보존하면, 본문의 신학적 초점이 단순한 지식 부족이 아니라 하나님의 주권 앞에서의 인간 한계를 강조하는 데 있음을 분명히 할 수 있습니다.
  doctrine_reference: 하나님의 주권, 인간의 한계
