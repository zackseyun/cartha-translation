source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et longanimis, quoniam longanimitatem praestat his qui peccaverunt quasi suis operibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/134.yaml
  text: and long-suffering, because he shows long-suffering toward those who have sinned, as toward his own works,
translation:
  language: ko
  text: 그리고 오래 참으시는 분이시니, 이는 죄를 지은 자들에게 자기 행위에 대하듯 오래 참으시기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그의 자기 일들처럼’에 가까운 비교 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: longanimis
  english_pob_choice: long-suffering
  chosen_korean: 오래 참으시는 분
  alternatives_korean:
  - 오래 참는 분
  - 인내하시는 분
  - 참으심이 길으신 분
  lexicon: longanimis
  rationale: 라틴어 형용사 longanimis의 핵심은 단순한 인내가 아니라 지속적이고 느긋하게 참으시는 성품이므로, POB의 ‘long-suffering’을 살려 ‘오래 참으시는 분’으로 옮겼습니다.
- source_word: quoniam
  english_pob_choice: because
  chosen_korean: 이는 … 때문입니다
  alternatives_korean:
  - 왜냐하면 … 때문입니다
  - …하기 때문입니다
  lexicon: quoniam
  rationale: 원인 설명을 자연스러운 현대 합쇼체 문장으로 처리하되, 앞절을 받는 연결 관계를 분명히 하기 위해 ‘이는 … 때문입니다’를 사용했습니다.
- source_word: praestat
  english_pob_choice: he shows
  chosen_korean: 오래 참으시기 때문입니다
  alternatives_korean:
  - 보이시기 때문입니다
  - 베푸시기 때문입니다
  - 드러내시기 때문입니다
  lexicon: praestare
  rationale: praestat은 단순 표시보다 ‘드러내어 행하다’는 뜻이 강해, 앞의 ‘오래 참으시는’ 성품을 반복 없이 유지하는 방식으로 자연스럽게 풀었습니다.
- source_word: quasi suis operibus
  english_pob_choice: as toward his own works
  chosen_korean: 자기 행위에 대하듯
  alternatives_korean:
  - 자기 일들에 대하듯
  - 자기 작품처럼
  - 자기 일처럼
  lexicon: quasi + sui + opera
  rationale: 여기서 opera는 창조물보다 ‘행위/일’에 가까우며, quasi는 완전 동일시보다 유사 비교를 뜻하므로 ‘대하듯’으로 긴장을 보존했습니다.
theological_decisions:
- issue: 죄인들에게 보이는 하나님의 태도
  chosen_reading: 하나님께서 죄를 지은 자들을 자기 행위에 대하듯 오래 참으십니다.
  alternative_readings:
  - 하나님께서 죄인들을 자기 피조물처럼 대하십니다.
  - 하나님께서 죄인들을 자기 작품처럼 오래 참으십니다.
  rationale: 원문은 죄인들에 대한 하나님의 오래 참으심을 강조하면서도 ‘자기 행위처럼’이라는 비교를 덧붙이므로, 창조-피조물 논의로 넓히기보다 문장 자체의 비교 표현을 보존했습니다.
  doctrine_reference: 신학적 확장보다 본문 비교구문의 보존을 우선함
