  source_fidelity: ‘자기 행위에 대하듯’은 라틴어 suis operibus(‘자신의 일들/작품들’)를 하나님 자신의 행위로 바꾸어, 비교의 상대를 달리합니다. 또한 주석의 ‘그의 자기 일들처럼’은 suis의 재귀적 소유와 opera의 복수를 정확히 반영하지 못합니다.
  naturalness: ‘자신의 작품들을 대하시는 것처럼’은 원문의 비교 구문을 현대 한국어로 자연스럽게 재현하며, 합쇼체의 문장 종결도 유지합니다.
  terminology: longanimis와 longanimitatem의 반복은 ‘오래 참으시는 분’/‘오래 참으시다’로 보존했습니다. opera는 ‘작품들’로 옮기되, 이것이 반드시 현대적 예술 작품만을 뜻하지 않음을 주석으로 밝혔습니다.
  issues:
