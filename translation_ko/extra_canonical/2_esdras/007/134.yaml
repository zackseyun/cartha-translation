    rationale: opera는 ‘행위’ 자체라기보다 ‘일들, 작품들, 만들어진 것들’을 뜻합니다. 따라서 죄 지은 이들을 하나님 자신의 행위에 견주어 대한다는 현 번역은 원문의 비교 대상을 충분히 전달하지 못합니다.
  - severity: medium
    issue: 각주가 원문의 재귀 소유와 복수를 부정확하게 설명함
    rationale: suis는 문장 주어에 되돌아가는 ‘자신의’이고, operibus는 복수입니다. ‘그의 자기 일들처럼’보다 ‘자신의 작품들을 대하듯’이 더 정확합니다.
  revised_text: 또한 오래 참으시는 분이시니, 죄를 지은 이들에게 자신의 작품들을 대하시는 것처럼 오래 참으시기 때문입니다.[a]
