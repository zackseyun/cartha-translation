source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: soluta est intemperantia, abscisa est incredulitas, crevit autem iustitia, orta est veritas.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/114.yaml
  text: self-indulgence has been ended, unbelief has been cut off, but righteousness has grown and truth has arisen.
translation:
  language: ko
  text: 방종은 끝났고, 불신은 끊어졌으며, 의는 자라났고, 진리가 솟아났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: intemperantia
  english_pob_choice: self-indulgence
  chosen_korean: 방탕
  alternatives_korean:
  - 자기만족
  - 절제 없음
  - 방종
  lexicon: intemperantia
  rationale: 영어 POB의 “self-indulgence”는 단순한 쾌락 추구보다 절제의 상실을 가리키므로, 현대 한국어에서 그 결말 상태를 간결하게 드러내는 ‘방탕’으로 옮겼습니다.
- source_word: incredulitas
  english_pob_choice: unbelief
  chosen_korean: 불신
  alternatives_korean:
  - 믿지 않음
  - 불신앙
  lexicon: incredulitas
  rationale: 라틴어 incredulitas는 믿음의 부재를 뜻하므로, 교회적 관용어 ‘불신앙’보다 원문 의미를 직접 드러내는 ‘불신’을 택했습니다.
- source_word: iustitia
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: iustitia
  rationale: 영어 POB의 “righteousness”를 한국어 성서어휘의 핵심 대응어인 ‘의’로 옮겨, 도덕적 품성보다 하나님 앞에서의 올바름을 유지했습니다.
- source_word: veritas
  english_pob_choice: truth
  chosen_korean: 진리
  alternatives_korean:
  - 참됨
  - 진실
  lexicon: veritas
  rationale: 문장 말미의 상승적 대비를 살리기 위해, 사실성보다 궁극적·구속사적 차원을 갖는 ‘진리’로 번역했습니다.
theological_decisions:
- issue: soluta est / abscisa est / crevit / orta est의 완료 시상과 종말론적 성취감
  chosen_reading: ‘끝났고 / 끊어졌으며 / 자라났고 / 일어났습니다’로 현재 독자에게 완결된 전환을 생생하게 전달했습니다.
  alternative_readings:
  - ‘끝났습니다’만 반복하는 평면적 번역
  - ‘자랐습니다’처럼 성장의 결과만 드러내는 번역
  rationale: 이 절은 네 개의 짧은 완료 서술로 새 질서의 도래를 선포하므로, 한국어에서도 완료의 확정성과 사건성을 유지하는 것이 본문 효과를 가장 잘 보존합니다.
  doctrine_reference: 종말론적 갱신과 새 질서의 도래
