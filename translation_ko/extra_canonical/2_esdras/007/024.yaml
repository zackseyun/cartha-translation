id: 2ES.7.24
reference: 2 Esdras 7:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et legem eius spreverunt et sponsiones eius abnegaverunt et legitimis eius fidem non habuerunt et opera eius non perfecerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/024.yaml
  text: They despised his law and denied his promises[a], and they did not keep faith with his statutes and did not perform his works.
  footnotes:
  - marker: a
    text: Or 'denied his covenants'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 그의 율법을 멸시하고 그의 약속들을 부인하였으며, 그의 규례들을 충실히 지키지 않았고 그의 일들을 이루지도 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et legem eius spreverunt
  english_pob_choice: They despised his law
  chosen_korean: 그들은 그의 율법을 멸시하고
  alternatives_korean:
  - 그들은 그의 법을 업신여기고
  - 그들은 그의 율법을 경멸하고
  lexicon: lexem-legalis / νόμος
  rationale: legem은 여기서 하나님의 규범적 토라를 가리키므로 기본어는 율법이 적절하며, spreverunt는 단순 거절보다 강한 멸시·업신여김의 뉘앙스를 가집니다.
- source_word: et sponsiones eius abnegaverunt
  english_pob_choice: and denied his promises
  chosen_korean: 그의 약속[a]을 부인하였으며
  alternatives_korean:
  - 그의 언약들을 부인하였으며
  - 그의 서약들을 거부하였으며
  lexicon: sponsio / ἐπαγγελία
  rationale: 주어진 감사 경로와 수정 이력에 따라 sponsiones는 언약보다 약속이 더 정확하며, abnegaverunt는 단순한 무시가 아니라 부인·배척의 의미가 강합니다.
- source_word: et legitimis eius fidem non habuerunt
  english_pob_choice: and they did not keep faith with his statutes
  chosen_korean: 그의 규례들에 대해서는 믿음을 지키지 않았고
  alternatives_korean:
  - 그의 규례들을 신실하게 지키지 않았고
  - 그의 규례들에 대해 신실하지 않았고
  lexicon: fidem non habuerunt / πίστις
  rationale: 직역하면 '믿음을 가지지 않았다'이므로, 한국어에서는 대상 표지 '에 대해서는'을 넣어 규례에 대한 충실성 결여를 자연스럽게 살렸습니다.
- source_word: et opera eius non perfecerunt
  english_pob_choice: and did not perform his works
  chosen_korean: 그의 일들을 행하지도 않았습니다
  alternatives_korean:
  - 그의 일을 완성하지도 않았습니다
  - 그의 행하신 일들을 이루지 않았습니다
  lexicon: opera / ἔργα
  rationale: opera는 여기서 하나님의 행위와 그에 대한 순종의 실행을 모두 포괄할 수 있어, '행하다'가 가장 직접적이고 과도한 해석을 피합니다.
theological_decisions:
- issue: sponsiones eius의 의미
  chosen_reading: '''그의 약속''으로 번역하고, 언약적 의미는 본문 주석으로 열어 둡니다.'
  alternative_readings:
  - '''그의 언약들'''
  - '''그의 서약들'''
  rationale: 수정 이력이 지적하듯 이 본문은 covenant보다 promise 쪽이 더 직접적이며, 다만 라틴 sponsio가 신적 약속의 공적 성격을 띨 수 있어 약속으로 옮기되 대안 독해를 각주로 남깁니다.
  doctrine_reference: 4 Ezra 본문 내 약속/언약 어휘 구분
- issue: fidem non habuerunt의 신실성 표현
  chosen_reading: ‘믿음을 지키지 않았다’로 옮겨 관계적 불충실함을 드러냅니다.
  alternative_readings:
  - '''신실하지 않았다'''
  - '''충실하지 않았다'''
  rationale: 단순 지적 동의의 문제가 아니라 하나님의 규례에 대한 신실성 결여를 뜻하므로, 믿음-지킴의 결합으로 문맥의 윤리적 무게를 보존했습니다.
  doctrine_reference: 성서적 믿음과 신실성의 연결
