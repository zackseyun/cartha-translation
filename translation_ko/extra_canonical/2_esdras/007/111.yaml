id: 2ES.7.111
reference: 2 Esdras 7:111
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Si ergo modo, quando corruptibile increvit et iniustitia multiplicata est, exoraverunt iusti pro impiis quare et tunc sic non erit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/111.yaml
  text: If then now[a], when corruption has increased and unrighteousness has multiplied, the righteous prayed for the ungodly, why will it not also be so then?”
  footnotes:
  - marker: a
    text: Or 'why will it not be so then?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그렇다면 부패가 늘어나고 불의가 많아진 지금 의인들이 경건하지 않은 이들을 위하여 간구하였다면, 어찌 그때에도 역시 그렇게 되지 않겠습니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그때에도 그렇게 되지 않겠습니까?’
    reason: 라틴어 et의 첨가적 의미(‘역시’)를 생략하는 이전 번역 가능성을 제시합니다.
lexical_decisions:
- source_word: Si ergo modo
  english_pob_choice: If then now
  chosen_korean: 그렇다면 지금
  alternatives_korean:
  - 그러므로 지금
  - 만일 지금
  lexicon: si ergo modo
  rationale: 조건-논증의 흐름을 자연스럽게 살려, 단순 조건문보다 추론을 드러내는 ‘그렇다면’으로 옮겼습니다.
- source_word: corruptibile increvit
  english_pob_choice: corruption has increased
  chosen_korean: 썩어짐이 더해지고
  alternatives_korean:
  - 부패가 증가하고
  - 썩을 것이 자라나고
  lexicon: corruptibile increvit
  rationale: corruptibile의 상태적·도덕적 타락 뉘앙스를 살려 ‘썩어짐’으로 옮기고, increvit는 단순 수량 증가보다 누적되는 강세를 반영해 ‘더해지고’로 처리했습니다.
- source_word: iniustitia multiplicata est
  english_pob_choice: unrighteousness has multiplied
  chosen_korean: 불의가 많아졌을 때
  alternatives_korean:
  - 불의가 증가했을 때
  - 불의가 배가되었을 때
  lexicon: iniustitia multiplicata est
  rationale: iniustitia를 일반적 ‘불의’로 옮겨 도덕·법정적 균형을 유지했고, multiplicata est는 자연스러운 한국어로 ‘많아지다’로 풀었습니다.
- source_word: iusti pro impiis
  english_pob_choice: the righteous prayed for the ungodly
  chosen_korean: 의인들이 경건하지 않은 사람들을 위해 간구하였다면
  alternatives_korean:
  - 의인들이 불경건한 이들을 위해 기도하였다면
  - 의인들이 악인을 위해 기도하였다면
  lexicon: iusti pro impiis
  rationale: iusti는 ‘의인들’로, pro impiis는 문맥상 단순한 도덕적 악인보다 하나님께 경외심이 없는 사람들을 가리키므로 ‘경건하지 않은 사람들’로 옮겼습니다.
- source_word: quare et tunc sic non erit?
  english_pob_choice: why will it not also be so then?
  chosen_korean: 그때도 역시 그렇게 되지 않겠습니까?
  alternatives_korean:
  - 왜 그때도 그렇게 되지 않겠습니까?
  - 그러면 그때도 그렇게 되지 않겠습니까?
  lexicon: quare et tunc sic non erit
  rationale: adverbial et의 추가·강조 기능을 반영해 ‘역시’로 옮겼고, 반문 형식은 한국어 수사 질문으로 자연화했습니다.
theological_decisions:
- issue: 의인들이 경건하지 않은 사람들을 위해 중보하는 장면의 논리
  chosen_reading: 현재 시대에 의인들의 중보가 있었다면, 종말 때에도 같은 유형의 자비/중보의 대응이 있을 것이라는 비교 논증으로 읽었습니다.
  alternative_readings:
  - 단순한 도덕적 대비로만 읽는 견해
  - 종말 심판의 불가역성을 강조하는 반문으로만 읽는 견해
  rationale: 라틴문은 현재와 그때의 대응을 논증하며, POB의 ‘also’ 반영에 따라 비교의 접속을 살리는 것이 가장 충실합니다.
  doctrine_reference: 종말론적 비교 논증 / 중보의 반복성
