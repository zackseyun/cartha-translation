  to: 그렇다면 부패가 늘어나고 불의가 많아진 지금 의인들이 경건하지 않은 이들을 위하여 간구하였다면, 어찌 그때에도 역시 그렇게 되지 않겠습니까?”[a]
  rationale: 현대 한국어의 자연스러운 시간 표현을 위해 문장 구조를 정리하고, corruptibile increvit의 영어 POB 감사 번역과 일반적인 현대 용례에 맞추어 '썩어짐이 더해지고'를 '부패가 늘어나고'로 수정했습니다. 종말의 ‘그때’에도 같은 일이 일어남을 묻는 et의 강조는 '그때에도 역시'로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:17Z'
