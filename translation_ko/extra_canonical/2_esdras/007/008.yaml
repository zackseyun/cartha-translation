id: 2ES.7.8
reference: 2 Esdras 7:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: semita autem est una sola inter eos posita, hoc est ignis et aqua, ut non capiat semita nisi solummodo vestigium hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/008.yaml
  text: But there is only one path laid between them[a], that is, between the fire and the water, so that the path can hold only a man's footprint.
  footnotes:
  - marker: a
    text: Or 'between the fire and the water'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런데 그들, 곧 불과 물 사이에는 오직 하나의 길만 놓여 있어서, 그 길은 한 사람의 발자국 하나만 담을 수 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: autem
  english_pob_choice: But
  chosen_korean: 그런데
  alternatives_korean:
  - 그러나
  - 하지만
  lexicon: 접속 부사
  rationale: 앞 절과 대비를 이루는 autem을 한국어 담화 흐름에 맞게 '그런데'로 옮겨 자연스러운 전환을 살렸습니다.
- source_word: semita
  english_pob_choice: path
  chosen_korean: 길
  alternatives_korean:
  - 경로
  - 오솔길
  lexicon: 길
  rationale: semita는 좁고 특정한 통로를 뜻하므로, 문맥상 가장 직관적인 표준어인 '길'을 선택했습니다.
- source_word: hoc est ignis et aqua
  english_pob_choice: that is, between the fire and the water
  chosen_korean: 곧 불과 물 사이입니다
  alternatives_korean:
  - 즉 불과 물 사이입니다
  - 바로 불과 물 사이입니다
  lexicon: 해설적 동격
  rationale: hoc est의 설명적 용법을 살려 '곧'으로 풀어, 길의 위치가 불과 물 사이임을 명시했습니다.
- source_word: vestigium hominis
  english_pob_choice: a man's footprint
  chosen_korean: 한 사람의 발자국
  alternatives_korean:
  - 사람의 발자취
  - 한 사람의 발자취
  lexicon: vestigium
  rationale: vestigium은 '발자국/발자취' 중 물리적 자국에 더 가까워, 길의 폭이 극히 좁다는 의미를 살리는 '발자국'을 택했습니다.
theological_decisions:
- issue: 좁은 길의 비유를 과장 없이 보존할지 여부
  chosen_reading: 문맥이 요구하는 범위 안에서만 좁음을 드러내도록 '한 사람의 발자국만 겨우 담을 수 있습니다'로 옮겼습니다.
  alternative_readings:
  - '''사람 한 명의 발자국밖에 담지 못합니다'''
  - '''오직 사람의 발자국 하나만 들어갑니다'''
  rationale: 본문은 길의 실제적 협소함을 묘사할 뿐이므로, 상징을 덧붙이지 않고 물리적 제한을 직접 드러냈습니다.
  doctrine_reference: 본문-문맥 우선; 과장 금지
