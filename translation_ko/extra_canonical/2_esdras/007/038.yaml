id: 2ES.7.38
reference: 2 Esdras 7:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'seruiuistis, uel cuius diligentias spreuistis. Uidete contra et in contra: hic iocunditas et requies, et ibi ignis et tormenta; haec autem loqueris dicens ad eos in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/038.yaml
  text: 'Look on this side and on that: here are delight and rest, and there are fire and torments. These are the words he will speak to them on the day of judgment.'
translation:
  language: ko
  text: 이쪽도 보고 저쪽도 보십시오. 여기에는 기쁨과 안식이 있고, 저기에는 불과 고통이 있습니다. 이것은 심판의 날에 그가 그들에게 하실 말씀입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Uidete contra et in contra
  english_pob_choice: Look on this side and on that
  chosen_korean: 이쪽도 보고 저쪽도 보십시오
  alternatives_korean:
  - 이편도 보고 저편도 보십시오
  - 이쪽과 저쪽을 보십시오
  lexicon: 반대편을 대조해 보라는 명령 표현
  rationale: 라틴어의 대조적 지시를 자연스러운 현대 한국어 명령으로 살리되, 단순한 시각 행위보다 ‘양편을 대비해 보라’는 뉘앙스를 반영했습니다.
- source_word: iocunditas et requies
  english_pob_choice: delight and rest
  chosen_korean: 기쁨과 안식
  alternatives_korean:
  - 즐거움과 쉼
  - 환희와 안식
  lexicon: iocunditas / requies
  rationale: iocunditas는 단순한 쾌락보다 즐겁고 기쁜 상태를 가리키므로 ‘기쁨’으로, requies는 휴식보다 종국적 평안을 가리키므로 ‘안식’으로 옮겼습니다.
- source_word: ignis et tormenta
  english_pob_choice: fire and torments
  chosen_korean: 불과 고통
  alternatives_korean:
  - 불과 형벌
  - 불과 고통의 형벌
  lexicon: ignis / tormenta
  rationale: tormenta의 고통·괴로움의 의미를 살리면서도 과도한 설명을 피하기 위해 ‘고통’으로 번역했습니다.
- source_word: ad eos in
  english_pob_choice: he will speak to them on the day of judgment
  chosen_korean: 심판의 날에 그가 그들에게 하실 말씀입니다
  alternatives_korean:
  - 심판 날에 그가 그들에게 말씀하실 것입니다
  - 심판의 날에 그가 그들에게 말할 것입니다
  lexicon: future speech reference
  rationale: 라틴어 단편이 문장 끝에서 끊기지만, 영어 POB의 보완을 따라 미래의 발화 내용을 자연스럽게 한국어로 정리했습니다.
theological_decisions:
- issue: 심판과 최종 보응의 대조
  chosen_reading: 의인과 악인의 अंतिम 운명을 ‘기쁨과 안식’ 대 ‘불과 고통’으로 강하게 대비했습니다.
  alternative_readings:
  - 완곡하게 ‘좋은 것과 나쁜 것’처럼 약화하기
  - 형벌을 지나치게 교리적으로 설명하기
  rationale: 본문의 수사적 핵심은 대조 자체이므로, 그 긴장을 약화하지 않고 직설적으로 유지했습니다.
  doctrine_reference: 종말론적 심판과 최종 보응
