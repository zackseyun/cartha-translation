reference: 2 Esdras 7:68
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quid prodest, quoniam salutati saluabimur, si tormento tormentabimur? Omnes enim qui nati sunt, conmixti sunt iniquitatibus, et pleni sunt peccatis, et grauidi delictis;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/068.yaml
  text: What does it profit that we will be saved[a], if we will be tormented? For all who have been born are mixed with iniquities, and are full of sins and burdened with transgressions.
  footnotes:
  - marker: a
    text: Or 'For all who have been born are mixed with iniquities, and are full of sins and loaded with transgressions.'.
    reason: previous_rendering
translation:
  language: ko
  text: “우리가 구원을 받게 된다 해도 고통을 받게 된다면, 무슨 유익이 있겠습니까? 태어난 모든 사람은 불의와 뒤섞여 있고, 죄로 가득하며, 범법으로 짐을 지고 있습니다[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “태어난 모든 사람은 불의와 뒤섞여 있고, 죄로 가득하며, 범법을 짊어지고 있습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: quid prodest
  english_pob_choice: What does it profit
  chosen_korean: 무엇이 유익하겠습니까?
  alternatives_korean:
  - 무슨 유익이 있겠습니까?
  - 무엇이 소용이 있겠습니까?
  lexicon: prodesse
  rationale: 수사 의문문으로서 ‘유익하다/이익이 있다’의 의미를 살려 원문의 반문적 논지를 자연스럽게 옮겼습니다.
- source_word: salvabimur / salutati saluabimur
  english_pob_choice: we will be saved
  chosen_korean: 우리가 구원을 받을 것이라면
  alternatives_korean:
  - 우리가 구원받을 것이라면
  - 우리가 구원받게 될 것이라면
  lexicon: salvare
  rationale: 구원 동사를 명사화하지 않고 동사구로 살려, 원문과 영어 POB의 미래적 수동 의미를 반영했습니다.
- source_word: tormento tormentabimur
  english_pob_choice: we will be tormented
  chosen_korean: 우리가 고통을 받을 것이라면
  alternatives_korean:
  - 우리가 고문을 당할 것이라면
  - 우리가 괴로움을 당할 것이라면
  lexicon: tormentum
  rationale: 라틴어 tormento/tormentabimur의 육체적·형벌적 뉘앙스를 살리되, 한국어에서는 과도한 해석을 피하고 ‘고통을 받다’로 옮겼습니다.
- source_word: conmixti sunt iniquitatibus
  english_pob_choice: are mixed with iniquities
  chosen_korean: 불법과 뒤섞여 있고
  alternatives_korean:
  - 불법과 섞여 있고
  - 불의와 뒤섞여 있고
  lexicon: conmixtus
  rationale: conmixti의 ‘뒤섞이다/혼합되다’ 이미지를 직접 살려 도덕적 오염의 상태를 드러냈습니다.
- source_word: grauidi delictis
  english_pob_choice: burdened with transgressions
  chosen_korean: 범법으로 짐을 지고 있기 때문입니다
  alternatives_korean:
  - 범법으로 무거워져 있기 때문입니다
  - 범법으로 짊어지고 있기 때문입니다
  lexicon: gravidus
  rationale: ‘무거운 짐을 진 상태’라는 비유를 한국어 관용에 맞게 풀어, 죄책의 부담을 유지했습니다.
theological_decisions:
- issue: 보편적 인간 타락의 진술 방식
  chosen_reading: ‘태어난 모든 사람’이 불법·죄·범법에 얽힌 상태라는 진술을 그대로 유지했습니다.
  alternative_readings:
  - ‘모든 사람이 태어날 때부터 죄인이다’로 더 교리화해 옮기기
  - ‘태어나는 모든 이가 죄에 물들어 있다’로 완화해 옮기기
  rationale: 본문은 추상 교리보다 출생한 인류 전체의 상태를 열거형으로 진술하므로, 교리적 요약보다 원문의 누적적 표현을 보존했습니다.
  doctrine_reference: 원죄/보편적 죄성에 대한 성경적 진술과 연관되지만, 본문 자체는 서술적 형식입니다.
