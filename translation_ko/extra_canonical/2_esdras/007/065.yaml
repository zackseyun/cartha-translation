  yaml_path: translation/extra_canonical/2_esdras/007/065.yaml
  text: And because of this we are tormented, because though we know, we perish. Let the race of man mourn, and let the beasts of the field rejoice; let all who have been born lament, but let the four-footed animals and the cattle be glad.
translation:
  language: ko
  text: 이 때문에 우리는 고통을 겪습니다. 아는 자들로서 멸망하기 때문입니다. 사람의 نسل은 애도하고, 들짐승들은 기뻐하십시오. 태어난 모든 이들은 탄식하고, 네 발 달린 짐승들과 가축은 즐거워하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 scientes는 단순 지식보다 ‘알고 있음’의 상태를 가리키므로, ‘아는 자들로서’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: torquemur
  english_pob_choice: we are tormented
  chosen_korean: 우리는 고통을 겪습니다
  alternatives_korean:
  - 우리는 고문당합니다
  - 우리는 괴롭힘을 당합니다
  lexicon: torquere / torquere passive
  rationale: 신체적 ‘비틀림’의 이미지를 살리되, 이 문맥에서는 집단적 고통을 말하므로 과도하게 법정적이거나 기계적인 표현보다 자연스러운 ‘고통을 겪다’가 적절합니다.
- source_word: scientes
  english_pob_choice: though we know
  chosen_korean: 아는 자들로서
  alternatives_korean:
  - 우리가 알면서도
  - 알고 있으면서도
  lexicon: scire
  rationale: 원문의 분사 구조는 ‘알면서도’의 상태를 강조하므로, 원인절로 풀기보다 주체의 정체를 드러내는 ‘아는 자들로서’가 문맥의 긴장을 잘 보존합니다.
- source_word: perimus
  english_pob_choice: we perish
  chosen_korean: 멸망하기 때문입니다
  alternatives_korean:
  - 우리는 죽어 갑니다
  - 우리는 망합니다
  lexicon: pereo
  rationale: 단순한 육체적 죽음보다 종말론적 소멸을 가리키는 뉘앙스가 강하므로, ‘멸망하다’가 본문의 절박함을 더 잘 드러냅니다.
- source_word: agrestes bestiae
  english_pob_choice: the beasts of the field
  chosen_korean: 들짐승들
  alternatives_korean:
  - 들의 짐승들
  - 들판의 짐승들
  lexicon: bestia + agrestis
  rationale: ‘들의/들판의’라는 직역보다 한국어에서 자연스럽고 시적 대구를 살리는 ‘들짐승들’이 적합합니다.
theological_decisions:
- issue: 인류와 피조물의 대조적 명령형 배열
  chosen_reading: 사람은 애도하고, 들짐승과 가축은 기뻐하게 하는 대비를 그대로 유지했습니다.
  alternative_readings:
  - 인간의 비참함을 풀어 설명하는 방식
  - 문장 구조를 완화해 일반 진술로 바꾸는 방식
  rationale: 본문의 수사학은 인류의 탄식과 동물들의 기쁨을 병렬로 대조해 인간의 운명을 부각하므로, 그 긴장을 약화하지 않고 명령형 대구를 유지했습니다.
  doctrine_reference: 창조 질서와 인간 타락의 대조를 드러내는 묵시적 탄식 표현
