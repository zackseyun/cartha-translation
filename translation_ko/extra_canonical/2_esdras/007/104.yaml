source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'si fideles pro carissimis. [Et respondit ad me et dixit: quoniam inueniisti gratiam ante oculos meos, et hoc demonstrabo tibi: dies iudicii dies decretorius est, et omnibus signaculum ueritatis ostendet; quemadmodum enim non mittit pater filium, uel filius patrem, uel dominus seruum], uel fidus carissimum, ut pro'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/104.yaml
  text: 'And he answered me and said[a], “Because you have found favor before my eyes, I will show you this also: the day of judgment is a decisive day and will display to all the seal of truth. For just as a father does not send a son, or a son a father, or a master a slave, or a friend a beloved one[b], to speak on his behalf in the judgment'
  footnotes:
  - marker: a
    text: Part of this verse belongs to the restored fragment absent from most medieval Latin manuscripts. The examples stress personal non-transferability in ordinary life as an analogy for the final judgment.
    reason: recovered_fragment
    anchor_ref: 7:104
  - marker: b
    text: Or 'and displays to all the seal of truth. For just as now a father'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 내게 대답하여 말씀하셨습니다.[a] 「네가 내 눈에 은총을 입었으므로, 내가 이것도 네게 보여 주겠습니다. 심판의 날은 결정의 날이며, 모든 사람에게 진리의 인장을 드러낼 것입니다.[b] 이는 마치 아버지가 아들을, 아들이 아버지를, 주인이 종을, 또는 친구가 사랑하는 이를 심판에서 자기 대신 말하도록 보내지 않는 것과 같습니다.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목은 대부분의 중세 라틴 사본에는 없는 복원 단편에 속합니다. 이 예들은 일상 관계에서조차 대신 보낼 수 없음을 들어, 최후 심판에서 개인의 책임이 다른 이에게 넘어갈 수 없음을 비유합니다.
    reason: recovered_fragment
  - marker: b
    text: 이전 번역에서는 ‘그리고는 모든 사람에게 진리의 인장을 드러낸다. 이는 마치 지금 아버지가 …’라고 옮겼습니다. 그러나 라틴어 ostendet는 미래형이며, ‘지금’에 해당하는 말은 본문에 없습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: gratiam ante oculos meos
  english_pob_choice: Because you have found favor before my eyes
  chosen_korean: 내 눈앞에서 은혜를 찾았으므로
  alternatives_korean:
  - 내 눈앞에서 호의를 얻었으므로
  - 내 눈에 은총을 입었으므로
  lexicon: gratia
  rationale: POB의 'favor'를 한국어로 자연스럽게 옮기되, 라틴어의 관계적·호의적 뉘앙스를 살려 '은혜를 찾다'로 처리했습니다.
- source_word: dies iudicii dies decretorius est
  english_pob_choice: the day of judgment is a decisive day
  chosen_korean: 심판의 날은 판결이 내려지는 날이며
  alternatives_korean:
  - 심판의 날은 결정적인 날이며
  - 심판의 날은 판결의 날이며
  lexicon: dies iudicii / decretorius
  rationale: decretorius를 단순한 '결정적'보다 실제 판결·결정의 성격이 드러나는 표현으로 옮겨, 심판 장면의 법정적 긴장을 살렸습니다.
- source_word: signaculum veritatis
  english_pob_choice: the seal of truth
  chosen_korean: 진리의 도장
  alternatives_korean:
  - 진리의 인장
  - 진리의 표
  lexicon: signaculum
  rationale: 문서·판결의 확정성을 드러내는 물건상 표현으로 '도장'을 택해, 일반 독자가 즉시 이해할 수 있게 하면서도 'seal'의 공적 확증 의미를 유지했습니다.
- source_word: uel fidus carissimum
  english_pob_choice: or a friend a beloved one
  chosen_korean: 또는 친구가 사랑하는 이를
  alternatives_korean:
  - 또는 친구가 가장 사랑하는 이를
  - 또는 친구가 아끼는 이를
  lexicon: fidus / carissimum
  rationale: fidus와 carissimum의 관계적 충실함과 애정을 모두 살리기 위해, '친구'와 '사랑하는 이'를 병치했습니다.
theological_decisions:
- issue: '비유의 기능: 심판의 비양도성'
  chosen_reading: 일상적 관계에서도 대리 전송이 허용되지 않는 사례들을 들어, 최후 심판에서 각자의 책임이 대리될 수 없음을 강조했습니다.
  alternative_readings:
  - 비유를 단순히 예의·관습 문제로 읽는 해석
  - 특정 가족 질서만을 말하는 해석
  rationale: 라틴어의 예시들은 가족·주종·우정의 가장 가까운 관계들까지 포함하여, 심판에서의 개인적 비양도성을 논증합니다.
  doctrine_reference: 최후 심판과 개인 책임
- issue: 등록 변화 없는 직접 인용 처리
  chosen_reading: 화자 변경 없이 하나의 인용문으로 유지하고, 하나님/천사의 직접 발화를 합쇼체로 번역했습니다.
  alternative_readings:
  - 서술체로 풀어 쓰는 번역
  - 더 강한 예언체 어조로 옮기는 번역
  rationale: 원문이 응답-발화 구조를 분명히 가지므로, 그 구조를 보존하는 것이 서사와 권위의 흐름을 가장 잘 드러냅니다.
  doctrine_reference: 본문 화법 보존
