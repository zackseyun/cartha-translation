revisions:
- from: 그분은 내게 대답하여 말씀하셨습니다. 「네가 내 눈앞에서 은혜를 찾았으므로, 내가 이것도 네게 보여 주겠습니다. 심판의 날은 판결이 내려지는 날이며, 모든 사람에게 진리의 도장을 드러낼 것입니다. 이는 마치 아버지가 아들을, 아들이 아버지를, 주인이 종을, 또는 친구가 사랑하는 이를 심판 때에 자기 대신 보내어 말하게 하지 않는 것과 같습니다」[a][b]
  to: 그분은 내게 대답하여 말씀하셨습니다.[a] 「네가 내 눈에 은총을 입었으므로, 내가 이것도 네게 보여 주겠습니다. 심판의 날은 결정의 날이며, 모든 사람에게 진리의 인장을 드러낼 것입니다.[b] 이는 마치 아버지가 아들을, 아들이 아버지를, 주인이 종을, 또는 친구가 사랑하는 이를 심판에서 자기 대신 말하도록 보내지 않는 것과 같습니다.」
  rationale: 문장 전체를 현대 표준어 합쇼체로 다듬되, 라틴어의 관계적 ‘호의’와 ostendet의 미래형을 정확히 보존했습니다. 결정적 심판이라는 decretorius의 뜻은 ‘결정의 날’로 간결하게 옮겼고, signaculum은 문맥상 ‘인장’으로 조정했습니다. 복원 단편과 이전 번역에 관한 각주는 각각 해당 절과 문장에 직접 연결되도록 앵커를 배치하고, b 각주가 본문 이문처럼 오해되지 않게 수정했습니다.
  reviewer_model: gpt-5.6-terra
