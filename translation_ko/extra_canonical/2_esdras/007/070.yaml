id: 2ES.7.70
reference: 2 Esdras 7:70
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et respondit ad me et dixit: et quando Altissimus faciens faciebat saeculum, Adam et omnes qui cum eo uenerunt, primum praeparauit iudicium et quae sunt iudicii.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/070.yaml
  text: And he answered me and said[a], “When the Most High was making the age, he first prepared judgment and the things of judgment for Adam and all who came with him.”
  footnotes:
  - marker: a
    text: Or 'from him'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 제게 대답하며 말했습니다. “지극히 높으신 분께서 세상을 지으실 때, 아담과 그와 함께 온 모든 사람을 위하여 먼저 심판과 심판에 속한 것들을 마련하셨습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그에게서 나온 모든 사람’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Lat. Altissimus
  rationale: 하나님을 가리키는 최고존칭을 살리되, 한국어 합쇼체에 자연스럽고 경건한 표현으로 옮겼습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 세상
  alternatives_korean:
  - 시대
  - 세대
  lexicon: Lat. saeculum
  rationale: 문맥상 창조 질서의 전체 영역을 가리키므로, 추상적인 '시대'보다 보다 넓은 '세상'이 자연스럽습니다.
- source_word: primum praeparauit iudicium
  english_pob_choice: he first prepared judgment
  chosen_korean: 먼저 심판을 마련하셨습니다
  alternatives_korean:
  - 먼저 심판을 준비하셨습니다
  - 심판을 먼저 정하셨습니다
  lexicon: Lat. praeparare / iudicium
  rationale: praeparauit는 단순한 예비보다 미리 마련함을 뜻하므로 '마련하셨습니다'가 원문에 가깝습니다.
- source_word: quae sunt iudicii
  english_pob_choice: the things of judgment
  chosen_korean: 심판에 속한 것들
  alternatives_korean:
  - 심판의 것들
  - 심판에 관한 것들
  lexicon: Lat. quae sunt iudicii
  rationale: 직역하면 다소 어색하지만, 'iudicii'의 속격 관계를 드러내면서도 한국어에서 의미가 살아나도록 옮겼습니다.
theological_decisions:
- issue: 하나님이 창조와 함께 심판을 먼저 예비하셨다는 진술의 표현
  chosen_reading: 창조의 시작부터 심판이 우연한 뒤늦은 사건이 아니라 하나님의 선행적 계획에 포함된 것으로 제시합니다.
  alternative_readings:
  - 단순히 미래의 심판을 예고하는 표현으로 완화할 수 있음
  - '''마련하셨습니다''를 ''예비하셨습니다''로 보다 신학적으로 형식화할 수 있음'
  rationale: 원문은 창조 행위와 심판의 선행 준비를 연결하므로, 이를 약화하지 않고 그대로 드러내는 쪽이 문맥에 충실합니다.
  doctrine_reference: 하나님의 주권과 종말 심판의 선행성
