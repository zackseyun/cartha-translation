translation:
  language: ko
  text: 그리고 여호수아가 그 뒤를 이어 이스라엘을 위해 아할의 날들에 있었고, 사무엘은 사울의 날들에 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 Iesus는 여호수아와 예수에 모두 쓰일 수 있는 동일형이지만, 이 구약 문맥에서는 여호수아(눈의 아들)를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: et Iesus
  english_pob_choice: Joshua
  chosen_korean: 여호수아
  alternatives_korean:
  - 예수
  lexicon: 고유명사
  rationale: 라틴어 Iesus는 문맥상 여호수아를 가리키며, 한국어 성경의 확립된 인명형인 여호수아를 쓰는 것이 본문 의도와 POB 주석을 가장 분명하게 반영합니다.
- source_word: pro Israhel
  english_pob_choice: for Israel
  chosen_korean: 이스라엘을 위해
  alternatives_korean:
  - 이스라엘을 위하여
  - 이스라엘을 위한
  lexicon: 전치사구
  rationale: pro는 단순한 ‘대신’보다 이익·대변의 뜻이 강해, 문맥상 ‘~을 위해’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: in diebus Achar
  english_pob_choice: in the days of Achar
  chosen_korean: 아할의 날들에
  alternatives_korean:
  - 아차르의 날들에
  - 아간의 날들에
  lexicon: 고유명사
  rationale: 개정된 영어 POB가 라틴 본문을 따라 Achar로 두었으므로, 한국어도 음역을 맞추되 기존 성경식 ‘아간’으로 되돌리지 않았습니다.
- source_word: Samuhel
  english_pob_choice: Samuel
  chosen_korean: 사무엘
  alternatives_korean:
  - 사무엘 선지자
  lexicon: 고유명사
  rationale: 문맥상 예언자 사무엘을 가리키는 확립된 한국어 인명형을 그대로 쓰는 것이 적절합니다.
theological_decisions:
- issue: Iesus의 지시 대상
  chosen_reading: 이곳의 Iesus는 신약의 예수가 아니라 여호수아(눈의 아들)를 뜻하는 구약 인물명으로 처리했습니다.
  alternative_readings:
  - 예수
  - 예수(여호수아)
  rationale: 영어 POB 주석이 라틴어 동일형이지만 이 구약 문맥에서는 여호수아라고 명시하므로, 독자가 인물 혼동 없이 읽도록 했습니다.
  doctrine_reference: 정경 문맥과 인명 동일형 처리
