  yaml_path: translation/extra_canonical/2_esdras/007/023.yaml
  text: and set before themselves schemes of sins, and even said that the Most High does not exist, and they did not know his ways.
translation:
  language: ko
  text: 그리고 그들은 죄의 간계를 자신들 앞에 세웠으며, 지극히 높으신 분이 존재하지 않는다고까지 말하였고, 그의 길들을 알지 못했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘죄의 간계’는 라틴어 circumventiones delictorum의 직역적 의미를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘지극히 높으신 분’은 Altissimum의 신적 호칭을 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: et proposuerunt sibi circumventiones delictorum
  english_pob_choice: and set before themselves schemes of sins
  chosen_korean: 죄의 간계를 자신들 앞에 세웠으며
  alternatives_korean:
  - 죄의 계략을 스스로 마련했으며
  - 죄짓는 음모를 자신들 앞에 두었으며
  lexicon: proponere / circumventiones delictorum
  rationale: proposuerunt는 단순한 ‘계획하다’보다 앞에 두고 따르는 태도를 드러내므로 ‘자신들 앞에 세웠다’로 살렸고, circumventiones delictorum은 죄를 향한 우회적 꾀라는 점을 반영해 ‘죄의 간계’로 옮겼습니다.
- source_word: superdixerunt Altissimum non esse
  english_pob_choice: and even said that the Most High does not exist
  chosen_korean: 지극히 높으신 분이 존재하지 않는다고까지 말하였고
  alternatives_korean:
  - 지극히 높으신 분이 없다고까지 말하였고
  - 지극히 높으신 이를 부인하기까지 하였고
  lexicon: Altissimum
  rationale: Altissimum은 신적 호칭이므로 직역적으로 ‘지극히 높으신 분’으로 옮겨, 단순한 존재 부정이 아니라 최고 지존자에 대한 신앙적 부인을 드러냈습니다.
- source_word: vias eius non cognoverunt
  english_pob_choice: and they did not know his ways
  chosen_korean: 그의 길들을 알지 못했습니다
  alternatives_korean:
  - 그분의 길을 알지 못했습니다
  - 그의 길들을 깨닫지 못했습니다
  lexicon: viae eius
  rationale: vias eius의 복수성을 살려 ‘길들을’로 옮겼고, cognoverunt는 인식과 순종을 함께 함축할 수 있으나 기본적으로 ‘알다’가 가장 직접적이라 보았습니다.
theological_decisions:
- issue: 지극히 높으신 분에 대한 부인 표현
  chosen_reading: 본문의 superdixerunt를 ‘말하였고’로 두되, 내용상 하나님 존재 부인이라는 강한 신학적 공격을 드러냈습니다.
  alternative_readings:
  - ‘공공연히 말하였다’
  - ‘노골적으로 부인하였다’
  rationale: 라틴어의 동사는 단순 발화보다 ‘덧붙여 말하다/거슬러 말하다’의 뉘앙스를 가지므로, 한국어에서는 의미를 과장하지 않으면서도 POB 영어가 보존한 공격성을 유지했습니다.
  doctrine_reference: 신론
