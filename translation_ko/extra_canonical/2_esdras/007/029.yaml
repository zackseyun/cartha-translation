  to: 그 여러 해가 지난 뒤에, 내 아들 메시아께서 죽으시고, 사람의 숨결을 지닌 모든 이도 죽을 것입니다.
  rationale: 시간 표현을 완전하게 복원하고, 둘째 주어에도 원문의 생략된 ‘죽다’를 한국어에서 명시하여 문장의 의미와 병렬을 분명히 했습니다. ‘메시아’는 Christus의 직함적 용법을 반영하며, 불필요한 메타 각주는 제거했습니다.
