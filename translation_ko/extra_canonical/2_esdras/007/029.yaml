id: 2ES.7.29
reference: 2 Esdras 7:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit post annos hos, et morietur Filius meus Christus et omnes qui spiramentum habent hominis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/029.yaml
  text: And after these years, my Son the Messiah will die, and all who have human breath.
translation:
  language: ko
  text: 그리고 그 후에, 내 아들 메시아께서 죽으실 것이며, 사람의 숨결을 가진 모든 자가 그러할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 라틴어는 Christus로 되어 있으며, 이 판본의 영어 POB는 이를 ‘the Messiah’로 읽습니다.
    reason: source_note
lexical_decisions:
- source_word: Filius meus Christus
  english_pob_choice: my Son the Messiah
  chosen_korean: 내 아들 메시아
  alternatives_korean:
  - 내 아들 그리스도
  - 내 아들, 메시아
  lexicon: Χριστός/Christus → 메시아
  rationale: 라틴어 Christus는 문맥상 직함으로 이해되므로, 프로젝트 기본값에 따라 ‘메시아’로 옮겼습니다. 영어 POB의 대문자 Son 취지도 반영해 하나님의 말씀에서의 아들 호칭을 자연스럽게 살렸습니다.
- source_word: et morietur
  english_pob_choice: will die
  chosen_korean: 죽으실 것이며
  alternatives_korean:
  - 죽을 것이며
  - 숨지실 것이며
  lexicon: mori → 죽다
  rationale: 원문의 단순한 사망 진술을 그대로 반영했습니다. 존대형 ‘-시-’는 직접적인 하나님의 말씀 안에서의 아들 호칭을 고려한 한국어 공손 표현입니다.
- source_word: omnes qui spiramentum habent hominis
  english_pob_choice: all who have human breath
  chosen_korean: 사람의 숨결을 가진 모든 자
  alternatives_korean:
  - 인간의 숨결을 가진 모든 자
  - 사람의 호흡을 지닌 모든 자
  lexicon: spiramentum / habent / hominis → 숨결 / 가지다 / 사람
  rationale: spiramentum을 생명의 ‘숨결’로, hominis를 형용사적으로 ‘사람의’로 옮겨 영어 POB의 ‘human breath’ 의미를 유지했습니다. ‘모든 자’는 범위를 포괄적으로 드러냅니다.
theological_decisions:
- issue: 종말론적 선언에서 ‘내 아들 메시아’의 직함 보존
  chosen_reading: ‘메시아’를 직함으로 유지하고, ‘아들’은 직접 인용된 신적 발화로서 존칭을 살려 표기했습니다.
  alternative_readings:
  - ‘그리스도’로 음역형을 채택
  - ‘내 아들 메시아’ 대신 ‘내 아들, 메시아’로 분리
  rationale: 이 절은 신적 발화의 예언적 선언이므로, 전통 교회어보다 원문의 직함과 호칭 구조를 우선해 독자가 메시아적 지시를 즉시 파악하도록 했습니다.
  doctrine_reference: 메시아 직함과 신적 발화의 문체 처리
