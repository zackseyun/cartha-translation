lexical_decisions:
- source_word: erit ... positus
  english_pob_choice: will be set
  chosen_korean: 놓일 것이니
  alternatives_korean:
  - 세워질 것이니
  - 정해질 것이니
  lexicon: Latin erit + positus
  rationale: 미래 시제를 살려 ‘will be set’을 반영했고, 수동적 배치를 자연스럽게 ‘놓일’로 옮겼습니다.
- source_word: introitus
  english_pob_choice: entrance
  chosen_korean: 입구
  alternatives_korean:
  - 들어가는 곳
  - 출입구
  lexicon: Latin introitus
  rationale: 공간적 ‘들어감’의 의미를 간결하게 드러내는 현대 한국어로 ‘입구’를 택했습니다.
- source_word: in angusto loco
  english_pob_choice: in a narrow place
  chosen_korean: 좁은 곳에
  alternatives_korean:
  - 비좁은 곳에
  - 협소한 곳에
  lexicon: Latin angustus locus
  rationale: 직접적 공간 제약을 드러내면서도 문어체로 무난한 표현을 선택했습니다.
- source_word: ut esset similis fluminis
  english_pob_choice: so that it would be like a river
  chosen_korean: 강처럼 되도록
  alternatives_korean:
  - 강과 같게 되도록
  - 강같이 되도록
  lexicon: Latin ut esset similis
  rationale: ‘similis fluminis’의 비교를 한국어 관용에 맞게 ‘강처럼’으로 옮겨, 결과/의도 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 목적/결과 절로서의 ut esset
  chosen_reading: ‘되도록’으로 목적·결과의 흐름을 살렸습니다.
  alternative_readings:
  - ‘되게’
  - ‘될 것이어서’
  rationale: 본문의 ut + 접속법은 단순 서술이 아니라 의도적 결과를 나타내므로, 한국어에서도 그 방향성을 분명히 해야 합니다.
  doctrine_reference: 문법적 해석(라틴어 접속법의 목적/결과 용법)
