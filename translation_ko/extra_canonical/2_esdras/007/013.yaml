translation:
  language: ko
  text: 왜냐하면 더 큰 시대에 들어가는 길들은 넓고 안전하며, 불멸의 열매를 맺습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 더 큰 시대에 들어가는 길들은 넓고 안전하며, 불멸의 열매를 맺습니다.’
    reason: 이전 번역에서는 라틴어 nam을 역접 접속사로 옮겼습니다.
lexical_decisions:
- source_word: nam
  english_pob_choice: For
  chosen_korean: 더
  alternatives_korean:
  - 그리고
  - 그러므로
  - 하지만
  lexicon: source connective
  rationale: 라틴어 nam은 앞 문맥을 설명하는 연결어이므로, 이전 개정의 역접인 ‘하지만’보다 설명적 흐름을 살린 ‘더’가 아니라 원칙적으로는 ‘왜냐하면/이는’이 자연스럽습니다. 다만 본 절이 독립 절처럼 읽히지 않도록 간결하게 처리했습니다.
- source_word: maioris saeculi
  english_pob_choice: the greater age
  chosen_korean: 더 큰 시대
  alternatives_korean:
  - 더 큰 세대
  - 더 위대한 시대
  - 미래의 시대
  lexicon: saeculum
  rationale: 라틴어 mayoris saeculi를 표면적으로는 ‘더 큰 시대’로 옮기되, 본문 전승의 ‘future age’ 해석 논쟁은 각주로 남겨 원문 계통의 긴장을 보존했습니다.
- source_word: introitus spatiosi et securi
  english_pob_choice: the entrances ... are broad and secure
  chosen_korean: 입구들은 넓고 안전하며
  alternatives_korean:
  - 들어가는 문들은 넓고 안전하며
  - 진입로는 넓고 안전하며
  lexicon: introitus / spatiosi / securi
  rationale: introitus는 ‘들어감/입구’의 뜻이지만 한국어에서는 복수성을 살린 ‘입구들’이 문맥상 가장 직접적이며, spatiosi와 securi는 각각 넓음과 안전함을 그대로 반영했습니다.
- source_word: facientes inmortalitatis fructum
  english_pob_choice: they produce the fruit of immortality
  chosen_korean: 불멸의 열매를 맺습니다
  alternatives_korean:
  - 불멸의 열매를 만들어 냅니다
  - 불멸의 열매를 생산합니다
  lexicon: facientes / fructum
  rationale: facientes는 단순한 소유가 아니라 ‘만들어 내는/맺는’ 행위이므로 관용적이면서도 स्रोत에 가까운 ‘맺습니다’로 옮겼고, fructum은 직역보다 ‘열매’가 이미지와 의미를 함께 보존합니다.
theological_decisions:
- issue: maioris saeculi의 의미 계통
  chosen_reading: 본문은 현재 라틴어 형태를 따라 ‘더 큰 시대’로 옮기되, 주석에서 전승상 ‘미래의 시대’ 독법이 있었음을 드러냅니다.
  alternative_readings:
  - 미래의 시대
  - 오는 시대
  rationale: 이 절은 종말론적 ‘이 시대/오는 시대’ 대비를 담고 있어 전승 차이를 지우지 않는 것이 중요합니다. 본문에는 현전 라틴어를 반영하고, 각주로 대안 독법을 보존하는 편이 가장 투명합니다.
  doctrine_reference: 종말론적 시대 대비, 본문 전승 비평
- issue: facientes inmortalitatis fructum의 동사상
  chosen_reading: ‘맺습니다’로 번역해 결과를 낳는 능동적 이미지를 유지합니다.
  alternative_readings:
  - 생산합니다
  - 낳습니다
  rationale: 불멸은 추상 명사이지만, 본문은 그 열매가 실제로 산출된다는 역동을 강조하므로 한국어에서도 열매가 ‘맺히는’ 표현이 가장 자연스럽고 원문의 힘을 보존합니다.
  doctrine_reference: 종말의 생명성과 결과성
