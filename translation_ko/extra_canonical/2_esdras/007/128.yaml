review_pass:
  verdict: revise
  source_fidelity: 라틴어의 조건 대조(victus fuerit / vicerit)와 결과(patiatur / recipiet)는 정확히 반영되어 있습니다. 다만 dixisti의 완료형에 대응하는 존칭 표현은 주어 높임 표지가 갖추어진 형태가 더 정확하고 자연스럽습니다.
  naturalness: 초안의 ‘것이며, 그러나’는 접속 방식이 다소 겹치며, ‘당신이 말씀하신’은 현대 표준어에서 주어 높임이 불완전합니다. 조건절의 병렬과 문장부호를 정리하면 현대 문어체 합쇼체로 자연스럽습니다.
  terminology: ‘패배하다’, ‘겪다’, ‘받다’는 원문의 일반적이고 비기술적인 어휘 범위를 무리 없이 보존합니다. 상대에 대한 존칭은 원문이 명시하지 않지만 초안의 선택을 일관되게 문법화하여 ‘당신께서 말씀하신’으로 고쳤습니다.
  issues:
  - severity: low
    issue: 존칭 주어 표지의 누락
    rationale: ‘말씀하시다’는 주체 높임 동사이므로 ‘당신이 말씀하신’보다 ‘당신께서 말씀하신’이 현대 표준어 문법과 문체에 맞습니다.
  - severity: low
    issue: 대조 접속의 중복
    rationale: ‘것이며, 그러나’는 연결 어미와 접속 부사가 중첩되어 다소 부자연스럽습니다. ‘것이지만’으로 조건 대조를 매끄럽게 나타낼 수 있습니다.
  revised_text: 「그가 패배한다면 당신께서 말씀하신 것을 겪을 것이지만, 그가 이긴다면 내가 말하는 것을 받게 될 것입니다.」
