id: 2ES.7.128
reference: 2 Esdras 7:128
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ut si victus fuerit patiatur quod dixisti, si autem vicerit recipiet quod dico,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/128.yaml
  text: if he is defeated, he will suffer what you have said; but if he conquers, he will receive what I say.
translation:
  language: ko
  text: 「그가 패배한다면, 당신이 말씀하신 것을 겪을 것이며, 그러나 그가 이긴다면, 내가 말하는 것을 받게 될 것입니다」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: victus fuerit
  english_pob_choice: if he is defeated
  chosen_korean: 패배한다면
  alternatives_korean:
  - 졌다
  - 패한다면
  - 지면
  lexicon: victus (perfect passive participle)
  rationale: 수동적 패배 상태를 자연스러운 현대 한국어 조건문으로 옮기되, 결과의 조건성을 분명히 하기 위해 ‘패배한다면’을 택했습니다.
- source_word: patiatur
  english_pob_choice: he will suffer
  chosen_korean: 겪을 것이며
  alternatives_korean:
  - 당할 것입니다
  - 고통받을 것입니다
  - 겪게 될 것입니다
  lexicon: pati (suffer/endure)
  rationale: 직역적 ‘고통받다’보다, 결과로 닥치는 일을 포괄하는 ‘겪다’가 문맥상 더 적절하여 너무 좁아지지 않게 했습니다.
- source_word: dixisti / dico
  english_pob_choice: what you have said / what I say
  chosen_korean: 당신이 말씀하신 것 / 내가 말하는 것
  alternatives_korean:
  - 당신이 말한 것 / 내가 말하는 것
  - 네가 말한 것 / 내가 말하는 것
  lexicon: dico
  rationale: 대화 상대를 존칭으로 처리하되, 발화 행위 자체는 단순하고 대조적으로 유지했습니다. 전반적으로 1인칭·2인칭의 대비를 살렸습니다.
theological_decisions:
- issue: 조건부 대조 구조의 보존
  chosen_reading: 패배와 승리의 두 경우를 ‘—한다면 … 그러나 …’로 분명히 대비시켰습니다.
  alternative_readings:
  - ‘만일 …, …; 그러나 만일 …, …’처럼 더 직역적으로 옮길 수 있음
  - ‘지면/이기면’의 구어적 대조로 더 간단히 옮길 수 있음
  rationale: 라틴어 ut si / si autem의 조건 대조를 한국어에서도 선명하게 드러내어, 진술의 균형과 수사적 긴장을 유지했습니다.
  doctrine_reference: 문학적/수사적 구조 보존
