revisions:
- from: 이제 만일 한 사람이 받을 기업으로서 성을 받는다면, 상속자가 앞에 놓인 위험을 통과하지 않으면 어떻게 자기 기업을 받겠습니까?[a]
  to: 만일 한 사람에게 상속 재산으로 한 도시가 주어진다면, 상속자가 자기 앞에 놓인 위험을 통과하지 않고서 어떻게 자기 상속 재산을 받겠습니까?
  rationale: 불필요한 담화표지를 제거하고, 원문의 수동 수여 구조와 조건 논리를 자연스러운 현대 합쇼체로 재구성했습니다. ‘도시’, ‘상속자’, ‘상속 재산’을 사용하여 civitas 및 hereditas/heres의 의미 관계를 명료하게 유지했습니다. 기존 각주 ‘또는 주어진다면’는 본문이 이미 해당 수동 표현을 채택하므로 불필요하여 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:34Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 조건문 구조와 ‘상속자—상속분’의 논리는 대체로 충실합니다. 그러나 ‘data dabitur’는 수동으로, 한 사람이 성을 받는다는 능동적·수령 중심 표현보다 성이 그 사람에게 주어진다는 표현이 더 직접적입니다. 또한 ‘autem’에 근거하지 않는 ‘이제’는 넣지 않는 편이 안전합니다.
  naturalness: ‘받을 기업으로서 성을 받는다면’은 ‘받다’가 겹치고 수식 관계가 다소 어색합니다. ‘한 사람에게 상속 재산으로 한 성이 주어진다면’은 현대 표준어 합쇼체에서 자연스럽고 논리를 명료하게 드러냅니다.
  terminology: ‘성’은 civitas의 가능한 번역이나 현대어에서는 성벽·성채로 좁게 들릴 수 있습니다. 여기서는 상속될 수 있는 정치·거주 단위라는 일반성을 보존하는 ‘도시’가 더 적절합니다. hereditas에는 ‘상속 재산’, heres에는 ‘상속자’를 사용하여 법적 은유를 일관되게 유지합니다.
  issues:
  - severity: medium
    issue: ‘이제’의 첨가
    rationale: 라틴어 si autem의 autem은 여기서 강한 시간 부사 ‘이제’를 요구하지 않습니다. 영어 감사 이력에서도 선행 담화표지 Now를 제거했으므로, 한국어에서도 불필요한 담화표지는 피하는 것이 좋습니다.
  - severity: medium
    issue: 수동 수여 표현의 약화 및 ‘받다’의 반복
    rationale: data dabitur은 ‘주어질 것이다/주어진다면’라는 수동 수여 표현입니다. ‘한 사람이 받을 기업으로서 성을 받는다면’은 수령자 중심으로 바꾸고 ‘받다’를 중복하여 문장이 부자연스럽습니다.
  - severity: low
    issue: civitas의 ‘성’
    rationale: ‘성’은 현대 한국어에서 요새 또는 성곽의 뜻으로 좁게 이해될 수 있습니다. 원문의 도시 단위의 일반성을 위해 ‘도시’가 안전합니다.
  revised_text: 만일 한 사람에게 상속 재산으로 한 도시가 주어진다면, 상속자가 자기 앞에 놓인 위험을 통과하지 않고서 어떻게 자기 상속 재산을 받겠습니까?
