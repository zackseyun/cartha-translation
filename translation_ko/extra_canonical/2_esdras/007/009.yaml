id: 2ES.7.9
reference: 2 Esdras 7:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem data dabitur civitas homini in hereditatem, si non heres antepositum periculum pertransierit, quomodo accipiet hereditatem suam?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/009.yaml
  text: Now if a city is given to a man for an inheritance[a], if the heir does not pass through the danger set before him, how will he receive his inheritance?
  footnotes:
  - marker: a
    text: Or 'is given'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 만일 한 사람이 받을 기업으로서 성을 받는다면, 상속자가 앞에 놓인 위험을 통과하지 않으면 어떻게 자기 기업을 받겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘주어진다면’.
    reason: previous_rendering
lexical_decisions:
- source_word: si autem data dabitur
  english_pob_choice: Now if ... is given
  chosen_korean: 이제 만일 ... 받는다면
  alternatives_korean:
  - 이제 만일 ... 주어진다면
  - 이제 만일 ... 수여된다면
  lexicon: data dabitur
  rationale: 라틴어의 수동 표현을 한국어 조건문으로 자연스럽게 옮기되, 본문의 조건 논리를 살리기 위해 ‘받는다’로 간결하게 처리했습니다.
- source_word: civitas
  english_pob_choice: a city
  chosen_korean: 성
  alternatives_korean:
  - 도시
  - 성읍
  lexicon: civitas
  rationale: 문맥상 상속으로 ‘주어지는’ 대상이므로 단순한 도시보다 ‘성’이 더 압축적이고 고전적 의미를 살립니다.
- source_word: in hereditatem
  english_pob_choice: for an inheritance
  chosen_korean: 받을 기업으로서
  alternatives_korean:
  - 유산으로
  - 상속분으로
  lexicon: hereditas
  rationale: hereditas의 법적·상속적 의미를 살려, 단순 소유가 아니라 ‘기업’으로 받는다는 뉘앙스를 반영했습니다.
- source_word: heres
  english_pob_choice: the heir
  chosen_korean: 상속자
  alternatives_korean:
  - 후사
  - 상속인
  lexicon: heres
  rationale: 상속 관계를 분명히 드러내는 현대 한국어 법률어를 택했습니다.
- source_word: antepositum periculum
  english_pob_choice: the danger set before him
  chosen_korean: 앞에 놓인 위험
  alternatives_korean:
  - 그 앞에 제시된 위험
  - 그 앞에 놓인 위기
  lexicon: periculum
  rationale: 라틴어의 ‘앞에 놓인’ 이미지를 그대로 살려, 추상화하지 않고 전면에 제시된 위험이라는 뜻을 유지했습니다.
theological_decisions:
- issue: 상속/기업 이미지의 유지
  chosen_reading: ‘기업’과 ‘상속자’를 함께 써서, 단순 소유가 아니라 약속된 유산을 받는 구도를 유지했습니다.
  alternative_readings:
  - ‘유산’으로 평이하게 옮김
  - ‘재산’으로 일반화함
  rationale: 본문은 상속의 조건과 수여를 논하므로, 법적 상속 어휘를 유지하는 편이 원문의 논리를 더 잘 드러냅니다.
  doctrine_reference: 서사적-상속적 은유 보존
