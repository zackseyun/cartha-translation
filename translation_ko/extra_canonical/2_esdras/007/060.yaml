  verdict: revise
  source_fidelity: ‘repromissa ... a me’는 ‘나에게 약속된’이 아니라 ‘내가 약속한’입니다. 또한 saluabuntur의 미래 수동은 본문의 ‘구원받을’에 잘 반영되어 있습니다. dominatiorem의 비교급은 ‘더 우세하게’로 유지하는 편이 ‘더 두드러지게’보다 지배·우세의 의미를 더 가깝게 전달합니다.
  naturalness: ‘그러므로’는 Sic et의 병행·비교 연결을 인과로 바꾸므로 ‘이와 같이’가 적절합니다. ‘이들 위에서 기뻐하겠습니다’는 현대 한국어에서 부자연스러워 ‘이들을 두고 기뻐하겠습니다’로 고쳤습니다. ‘창조’는 집합적 creatura를 자연스럽게 나타냅니다.
  terminology: ‘구원받을’은 미래적 구원을 보존합니다. 대안 독법은 현재적 ‘구원받는’으로 제시해야 하므로, 기존 각주의 ‘구원을 받을’은 본문과 실질적으로 같은 미래 표현이어서 교체했습니다. ‘내 이름이 불리기 때문입니다’는 nomen meum ... nominare의 수동적 명명/호명의 의미를 보존합니다.
