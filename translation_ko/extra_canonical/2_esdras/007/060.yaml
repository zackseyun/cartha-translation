id: 2ES.7.60
reference: 2 Esdras 7:60
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod difficile est, gaudet super eum, qui uabet abundantiam ; Sic et a me repromissa creatura, iocundabor enim super paucis et qui saluabuntur, propterea quod ipsi sunt qui gloriam meam nunc dominatiorem fecerunt, et per quos nunc nomen meum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/060.yaml
  text: 'So also with the creation promised by me: I will rejoice over the few who will be saved[a], because they are the ones who have now made my glory more dominant, and through whom my name is now named.'
  footnotes:
  - marker: a
    text: Or 'who are saved'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 나에게 약속된 피조물도 이와 같습니다. 나는 구원받을[a] 얼마 안 되는 이들 위에서 기뻐하겠습니다. 그들은 지금 내 영광을 더 두드러지게 만들었고, 그들을 통해 지금 내 이름이 불리고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘구원을 받을’
    reason: previous_rendering
lexical_decisions:
- source_word: repromissa creatura
  english_pob_choice: the creation promised by me
  chosen_korean: 나에게 약속된 피조물
  alternatives_korean:
  - 내가 약속한 피조물
  - 내게 약속된 창조물
  lexicon: creatura
  rationale: 라틴어 creatura는 여기서 단순한 ‘창조물/피조물’을 가리키며, ‘나에게 약속된’이라는 수동적 의미를 살려 주체와 약속의 방향을 분명히 했습니다.
- source_word: gaudet super eum, qui uabet abundantiam ... iocundabor enim super paucis
  english_pob_choice: I will rejoice over the few
  chosen_korean: 나는 ... 위에서 기뻐하겠습니다 / ... 얼마 안 되는 이들 위에서 기뻐하겠습니다
  alternatives_korean:
  - 나는 ...에 대해 기뻐하겠습니다
  - 나는 소수의 이들로 인해 기뻐하겠습니다
  lexicon: gaudere / iocundari
  rationale: ‘super’의 위에/위에서의 뉘앙스를 살려 단순한 원인 표지보다 대상 위에 기쁨을 두는 표현으로 옮겼습니다.
- source_word: qui saluabuntur
  english_pob_choice: who will be saved
  chosen_korean: 구원받을
  alternatives_korean:
  - 구원될
  - 구원을 받을
  lexicon: saluabuntur
  rationale: 라틴어 미래 수동형을 반영해 ‘구원받을’로 옮겨, 이미 이뤄진 상태가 아니라 장차 일어날 구원을 드러냈습니다.
- source_word: gloriam meam ... dominatiorem fecerunt
  english_pob_choice: made my glory more dominant
  chosen_korean: 내 영광을 더 두드러지게 만들었고
  alternatives_korean:
  - 내 영광을 더 지배적으로 만들었고
  - 내 영광을 더 우세하게 만들었고
  lexicon: dominatiorem fecerunt
  rationale: dominatiorem의 비교급적 뉘앙스를 한국어의 자연스러운 ‘더 두드러지게’로 풀어, 무리한 군사적·권력적 이미지를 과도하게 고정하지 않았습니다.
- source_word: nomen meum nunc ...
  english_pob_choice: through whom my name is now named
  chosen_korean: 그들을 통해 지금 내 이름이 불리고 있기 때문입니다
  alternatives_korean:
  - 그들을 통해 지금 내 이름이 알려지고 있기 때문입니다
  - 그들을 통해 지금 내 이름이 불려지기 때문입니다
  lexicon: nomen meum ... nominare
  rationale: ‘이름이 불리다’는 성경적 관용을 살리되, 현재형의 수동 상태를 자연스럽게 표현했습니다.
theological_decisions:
- issue: ‘구원받을’의 시제와 종말론적 긴장
  chosen_reading: 미래적 구원 사건으로 읽어 ‘구원받을’로 번역했습니다.
  alternative_readings:
  - 현재 상태를 나타내는 ‘구원받은’
  - 중성적 ‘구원을 받을’
  rationale: 라틴어 saluabuntur는 미래 수동형이며, 본문 전체의 종말론적 전망에 맞춰 장차 일어날 구원을 드러내는 것이 더 정확합니다.
  doctrine_reference: 4 Ezra/2 Esdras의 종말론적 심판과 구원 전망
