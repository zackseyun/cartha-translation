  to: 이와 같이, 내가 약속한 창조도 그러합니다. 나는 구원받을[a] 몇 안 되는 이들을 두고 기뻐하겠습니다. 그들이 지금 내 영광을 더 우세하게 하였고, 그들을 통하여 지금 내 이름이 불리기 때문입니다.
