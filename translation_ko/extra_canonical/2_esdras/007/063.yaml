id: 2ES.7.63
reference: 2 Esdras 7:63
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: factus est de puluere, sicut et cetera creatura! Melius enim erat ipsum pulverem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/063.yaml
  text: For it would have been better if the dust itself had not come into being, so that understanding might not have come from it.
translation:
  language: ko
  text: 참으로 흙 자체가 존재하게 되지 않았더라면 더 좋았을 것이니, 그에게서 깨달음이 나오지 않았을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 factus est는 출생보다 ‘존재하게 되다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: factus est
  english_pob_choice: had not come into being
  chosen_korean: 존재하게 되지 않았더라면
  alternatives_korean:
  - 태어나지 않았더라면
  - 생겨나지 않았더라면
  lexicon: fieri
  rationale: 라틴어 factus est는 출생이 아니라 존재의 성립을 가리키므로, POB의 ‘come into being’에 맞춰 존재 발생을 드러내는 표현을 택했습니다.
- source_word: de puluere
  english_pob_choice: the dust itself
  chosen_korean: 흙 자체가
  alternatives_korean:
  - 먼지 자체가
  - 티끌 자체가
  lexicon: pulvis
  rationale: 문맥상 인간의 근원적 물질을 가리키는 ‘dust’는 한국어 성서 문맥에서 ‘흙’이 가장 직접적이며, ‘자체’로 강조를 살렸습니다.
- source_word: sicut et cetera creatura
  english_pob_choice: so that ... might not have come from it
  chosen_korean: 그에게서
  alternatives_korean:
  - 그것으로부터
  - 거기서
  lexicon: creatura
  rationale: 이 절의 비교문은 ‘흙’에서 비롯된 다른 피조물까지 포함하는 반사적 구문이므로, 결과절에서는 ‘그에게서’로 간결하게 연결했습니다.
- source_word: pulverem
  english_pob_choice: dust
  chosen_korean: 흙
  alternatives_korean:
  - 먼지
  - 티끌
  lexicon: pulvis
  rationale: 같은 어근이 반복되므로 앞부분과 일관되게 ‘흙’으로 옮겨, 인간의 미천한 기원을 강조하는 대조를 유지했습니다.
theological_decisions:
- issue: ‘understanding’의 출현이 인간의 가치 판단을 뒤집는 문맥적 강조
  chosen_reading: 깨달음이 나오지 않았을 것입니다
  alternative_readings:
  - 이해가 나오지 않았을 것입니다
  - 지혜가 나오지 않았을 것입니다
  rationale: source는 단순한 인지능력보다 사람에게서 비롯된 ‘understanding’의 결과를 문제 삼으므로, 한국어에서는 ‘깨달음’이 문맥의 놀라움과 평가절하를 더 잘 드러냅니다.
  doctrine_reference: 문맥적 수사에 따른 의미역 선택
