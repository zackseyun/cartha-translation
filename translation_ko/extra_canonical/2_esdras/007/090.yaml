  yaml_path: translation/extra_canonical/2_esdras/007/090.yaml
  text: 'the danger, that they might perfectly keep the law of the Lawgiver. Therefore this is concerning them:'
translation:
  language: ko
  text: '그들이 율법 제정자의 율법을 온전히 지키도록 하는 위험[a]입니다. 그러므로 여기서는 그들에 관하여 이렇게 말합니다:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 periculum은 이 문맥에서 ‘위험’ 외에 ‘위태로움’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: periculum
  english_pob_choice: the danger
  chosen_korean: 위험
  alternatives_korean:
  - 위기
  - 위험성
  - 위태로움
  lexicon: periculum
  rationale: Latin periculum의 기본 뜻을 반영하여, 문맥상 경고의 뉘앙스를 살리되 과도하게 추상화하지 않도록 ‘위험’으로 옮겼습니다.
- source_word: uti perfecte custodirent
  english_pob_choice: that they might perfectly keep
  chosen_korean: 완전하게 지키게 하려는
  alternatives_korean:
  - 온전히 지키게 하려는
  - 완벽히 지키게 하려는
  - 철저히 지키게 하려는
  lexicon: uti + imperfect subjunctive
  rationale: 목적/결과 구문을 한국어의 ‘-게 하려는’으로 자연스럽게 나타내고, perfecte는 행위의 완전성을 드러내는 ‘완전하게’로 번역했습니다.
- source_word: legislatoris legem
  english_pob_choice: the law of the Lawgiver
  chosen_korean: 율법제정자의 율법
  alternatives_korean:
  - 율법을 주는 이의 율법
  - 법을 제정하시는 분의 법
  - 율법제정자의 법
  lexicon: legislatoris / lex
  rationale: legislatoris를 단순한 일반 명사 ‘입법자’보다 법을 제정하는 분이라는 기능을 살려 ‘율법제정자’로 옮겼고, lex는 이 문맥에서 토라적 ‘율법’의 반복으로 보아 ‘율법’을 유지했습니다.
- source_word: Propter quod hic de his
  english_pob_choice: Therefore this is concerning them
  chosen_korean: 그러므로 이것은 그들에 관한 것입니다
  alternatives_korean:
  - 그러므로 이것은 그들에 대한 것입니다
  - 그러므로 이는 그들에 관한 일입니다
  - 그러므로 이는 이 사람들에 대하여 말하는 것입니다
  lexicon: Propter quod hic de his
  rationale: 마지막 절의 지시적 연결을 보존하기 위해 ‘그러므로’로 시작하고, de his를 자연스러운 현대 한국어의 설명문 형식인 ‘그들에 관한’으로 옮겼습니다.
theological_decisions:
- issue: legislatoris의 신학적 표지
  chosen_reading: ‘율법제정자’는 단순한 법률가가 아니라 율법을 주시는 권위의 주체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘입법자’로 일반화
  - ‘법을 주는 분’으로 의역
  rationale: 본문의 반복된 lex/legem 구조를 약화시키지 않기 위해, 그리고 율법의 기원을 드러내는 수사를 보존하기 위해 기능적 칭호를 살렸습니다.
  doctrine_reference: 율법의 신적 기원과 권위에 관한 성경적 표현
