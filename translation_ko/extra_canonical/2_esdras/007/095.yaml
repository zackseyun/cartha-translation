id: 2ES.7.95
reference: 2 Esdras 7:95
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uerunt quae per fidem data est lex. Quartus ordo, intellegentes requiem quam nunc in promptuariis congregati requiescent cum silentio multo ab angelis conseruati, †atque in nouissimis eorum manentem gloriam.† Quintus ordo, exultantes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/095.yaml
  text: 'The fourth order: they understand the rest in which[a], now gathered in their storehouses, they will rest in great silence, guarded by angels, and the glory that remains for them in the last times.'
  footnotes:
  - marker: a
    text: The phrase about the glory awaiting the righteous in the last times is textually uncertain in the Latin, but the overall sense of guarded rest now and future glory later is secure.
    reason: textual_variant
    anchor_ref: 7:95
translation:
  language: ko
  text: 넷째 무리는, 이제 그 저장고들에 모여 있는 의인들의 안식을 이해합니다. 그들은 큰 침묵 가운데 천사들에게 지켜진 채 쉬게 될 것이며, 마지막 때에 그들을 위해 남아 있는 영광이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마지막 때에 그들을 위해 남아 있는 영광’은 라틴 본문에서 문자 전승이 다소 불확실하지만, 현재의 보호된 안식과 장차의 영광이라는 전체 의미는 분명합니다.
    reason: textual_variant
lexical_decisions:
- source_word: Quartus ordo
  english_pob_choice: The fourth order
  chosen_korean: 넷째 무리
  alternatives_korean:
  - 넷째 질서
  - 넷째 순서
  lexicon: ordo
  rationale: 여기서는 천상적 ‘질서’의 분류이지만, 한국어에서 자연스럽고 문맥을 살리는 표현으로 ‘무리’를 택해 해당 집단을 가리키는 기능을 분명히 했습니다.
- source_word: intellegentes requiem
  english_pob_choice: they understand the rest
  chosen_korean: 안식을 이해합니다
  alternatives_korean:
  - 쉼을 이해합니다
  - 안식을 압니다
  lexicon: intellego / requies
  rationale: intellegentes는 단순 인지가 아니라 그 안식의 의미를 알아차린다는 뜻이므로, 문맥상 ‘이해합니다’로 옮겼습니다.
- source_word: in promptuariis congregati
  english_pob_choice: now gathered in their storehouses
  chosen_korean: 이제 그 저장고들에 모여 있는
  alternatives_korean:
  - 지금 그 창고들에 모여 있는
  - 현재 그 곳간들에 모여 있는
  lexicon: promptuarium / congregati
  rationale: promptuariis는 저장된 장소를 뜻하는데, 영어 POB의 ‘storehouses’를 따라 ‘저장고들’로 옮겨 고어적 뉘앙스를 피하면서도 축적된 보관 장소의 이미지를 유지했습니다.
- source_word: cum silentio multo ab angelis conseruati
  english_pob_choice: they will rest in great silence, guarded by angels
  chosen_korean: 큰 침묵 가운데 천사들에게 지켜진 채 쉬게 될 것이며
  alternatives_korean:
  - 큰 침묵 속에서 천사들에게 지켜진 채 쉬게 될 것이며
  - 많은 침묵 가운데 천사들에게 보호받으며 쉬게 될 것이며
  lexicon: silentium / conservo
  rationale: silentio multo는 ‘큰 침묵’의 강도를 살리고, conseruati는 보호의 지속성을 담아 ‘지켜진 채’로 옮겼습니다.
- source_word: atque in nouissimis eorum manentem gloriam
  english_pob_choice: and the glory that remains for them in the last times
  chosen_korean: 마지막 때에 그들을 위해 남아 있는 영광이 있습니다
  alternatives_korean:
  - 그리고 마지막 때에 그들을 위해 남아 있는 영광이 있습니다
  - 또한 그들의 마지막 때에 남아 있는 영광이 있습니다
  lexicon: manere / gloria / novissimi
  rationale: manentem은 단순히 ‘기다리는’ 것이 아니라 계속 남아 있는 상태를 뜻하므로, 영어 POB의 revision에 맞춰 ‘남아 있는 영광’으로 렌더링했습니다.
theological_decisions:
- issue: 의인의 종말론적 상태 표현
  chosen_reading: 의인들은 현재 저장된 곳에 모여 있다가 장차 천사들의 보호 아래 안식하며, 마지막 때의 영광이 그들을 위해 남아 있습니다.
  alternative_readings:
  - 의인들은 이미 안식하고 있으며 장차 영광을 받습니다.
  - 의인들은 천사들의 보호를 받으며 현재 안식 중입니다.
  rationale: 라틴어는 현재의 보관 상태와 미래의 휴식, 그리고 마지막 때의 영광을 모두 구분하므로, 세 층위를 유지하는 해석이 가장 충실합니다.
  doctrine_reference: 2 Esdras의 종말론적 의인 보존과 보상 개념
- issue: 텍스트 비정확성의 처리
  chosen_reading: ‘마지막 때에 그들을 위해 남아 있는 영광’은 본문상 확실한 핵심 의미로 본문에 반영했습니다.
  alternative_readings:
  - 해당 구절을 각주로만 처리한다.
  - 본문에서 생략한다.
  rationale: 영어 POB가 이 부분을 본문에 유지하되 텍스트 불확실성을 주석으로 표시하므로, 본문에는 의미를 살리고 주석은 별도로 달아 추적 가능하게 했습니다.
  doctrine_reference: 본문 비평 및 번역 투명성 원칙
