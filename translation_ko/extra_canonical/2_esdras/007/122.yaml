id: 2ES.7.122
reference: 2 Esdras 7:122
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam incipiet gloria Altissimi protegere eos qui caste conversati sunt, nos autem pessimis viis ambulavimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/122.yaml
  text: And since the glory of the Most High will begin to protect those who have conducted themselves chastely[a], but we have walked in the most evil ways?
  footnotes:
  - marker: a
    text: Or 'lived chastely'.
    reason: previous_rendering
translation:
  language: ko
  text: 지극히 높으신 이의 영광이 순결하게 살아온 사람들을 보호하기 시작할 것이니, 우리는 가장 악한 길로 걸어왔습니다?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘순결하게’는 여기서 성적 의미에만 한정되지 않고, 전반적 정결·의로운 삶을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: quoniam incipiet
  english_pob_choice: since ... will begin
  chosen_korean: '...하기 시작할 것이니'
  alternatives_korean:
  - '...하기 시작할 것이므로'
  - '...하기 시작하니'
  lexicon: quoniam
  rationale: quoniam을 이유를 나타내는 ‘-할 것이니’로 옮겨 앞절과 뒤절의 대조를 자연스럽게 연결했습니다.
- source_word: gloria Altissimi
  english_pob_choice: the glory of the Most High
  chosen_korean: 지극히 높으신 이의 영광
  alternatives_korean:
  - 가장 높으신 분의 영광
  - 지극히 높으신 분의 영광
  lexicon: gloria / Altissimus
  rationale: ‘Altissimi’는 하나님을 가리키는 호칭이므로, 직역하되 한국어에서 자연스러운 경어형으로 옮겼습니다.
- source_word: protegere eos
  english_pob_choice: to protect those
  chosen_korean: '...사람들을 보호하기'
  alternatives_korean:
  - '...사람들을 지키기'
  - '...사람들을 감싸기'
  lexicon: protegere
  rationale: protegere의 핵심은 단순한 덮음보다 보호에 있으므로, 뜻을 직접 드러내는 ‘보호하다’를 택했습니다.
- source_word: caste conversati sunt
  english_pob_choice: those who have conducted themselves chastely
  chosen_korean: 순결하게 살아온 사람들
  alternatives_korean:
  - 정결하게 살아온 사람들
  - 깨끗하게 살아온 사람들
  lexicon: caste conversari
  rationale: caste는 성적 순결로만 좁히기보다 전반적 도덕·종교적 순결을 가리키므로, ‘순결하게’로 옮겨 의미의 폭을 보존했습니다.
- source_word: pessimis viis ambulavimus
  english_pob_choice: we have walked in the most evil ways
  chosen_korean: 우리는 가장 악한 길로 걸어왔습니다
  alternatives_korean:
  - 우리는 가장 악한 길을 걸어왔습니다
  - 우리는 극히 악한 길로 걸어왔습니다
  lexicon: ambulare / pessimis viis
  rationale: ‘걷다’는 삶의 행보를 뜻하는 관용을 살리며, pessimis는 최상급의 강한 도덕적 평가를 ‘가장 악한’으로 반영했습니다.
theological_decisions:
- issue: caste의 윤리적 범위
  chosen_reading: ‘순결하게’는 성적 의미로만 좁히지 않고, 전체적인 정결·의로운 삶을 포함하는 표현으로 이해했습니다.
  alternative_readings:
  - ‘정결하게’
  - ‘깨끗하게’
  rationale: 문맥이 ‘가장 악한 길’과 대조를 이루므로, 단지 성적 순결이 아니라 전인적 도덕적 순결을 드러내는 번역이 더 적절합니다.
  doctrine_reference: 성결과 의로운 행실에 대한 성서적 일반 용례
