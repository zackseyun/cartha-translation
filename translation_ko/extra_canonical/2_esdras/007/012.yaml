source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et facti sunt introitus huius saeculi angusti et dolentes et laboriosi, paucae autem et malae et periculorum plenae et laborum magnorum fultae.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/012.yaml
  text: And the entrances of this age became narrow and painful and laborious[a], few and evil, full of dangers and burdened with great hardships.
  footnotes:
  - marker: a
    text: Or 'sorrowful'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 세대의 들어감은 좁고 고통스럽고 힘겨우며, 적고 악하며, 위험으로 가득하고 큰 고난에 짓눌려 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘슬픈’.
    reason: previous_rendering
lexical_decisions:
- source_word: introitus
  english_pob_choice: entrances
  chosen_korean: 들어감
  alternatives_korean:
  - 진입
  - 들어가는 길
  - 출입
  lexicon: introitus
  rationale: 장소 자체보다 ‘이 세대로 들어가는 통로/진입’의 상태를 가리키므로, 문학적으로도 자연스러운 ‘들어감’이 원문의 추상성을 살립니다.
- source_word: angusti
  english_pob_choice: narrow
  chosen_korean: 좁고
  alternatives_korean:
  - 협소하고
  - 비좁고
  lexicon: angustus
  rationale: 입구의 물리적·비유적 제약을 직접 반영하는 가장 간결한 표준어 표현입니다.
- source_word: dolentes
  english_pob_choice: painful
  chosen_korean: 고통스럽고
  alternatives_korean:
  - 슬프고
  - 애통하고
  - 고뇌에 찬
  lexicon: doleo
  rationale: 무생물인 ‘들어감’에 적용될 때는 ‘슬퍼하는’이 아니라 ‘고통을 주는/고통스러운’ 뜻이므로, 영어 개정의 취지를 따라 ‘고통스럽고’로 옮겼습니다.
- source_word: laboriosi
  english_pob_choice: laborious / burdened with great hardships
  chosen_korean: 힘겨우며 … 큰 고난에 짓눌려 있습니다
  alternatives_korean:
  - 수고로운
  - 노고가 많은
  - 큰 수고를 요구하며
  lexicon: laboriosus
  rationale: 단순한 ‘노동’보다 ‘고된 부담’의 뉘앙스를 살려, 뒤의 ‘큰 고난’과 함께 원문의 중압감을 드러냈습니다.
theological_decisions:
- issue: ‘이 세대’의 종말론적 성격
  chosen_reading: saeculum을 단순한 시간대가 아니라 현재의 타락한 질서로 읽어 ‘이 세대’로 옮겼습니다.
  alternative_readings:
  - ‘이 시대’
  - ‘이 세상’
  rationale: 문맥상 출입로가 ‘현재의 질서’ 아래에서 겪는 곤란함을 묘사하므로, 한국어에서 종말론적·윤리적 함의를 함께 전달하는 표현이 더 적절합니다.
  doctrine_reference: 제2성전기 묵시문학의 현세/오는 세대 대조
