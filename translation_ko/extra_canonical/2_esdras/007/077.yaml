id: 2ES.7.77
reference: 2 Esdras 7:77
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui speruerunt, neque connumeres te cum his qui cruciantur. Etenim est tibi thesaurus operum repositus apud Altissimum, sed non tibi demonstrabitur usque in nouissimis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/077.yaml
  text: who have shown contempt[a], and do not count yourself among those who are tormented. For a treasury of works is laid up for you with the Most High, but it will not be shown to you until the last times.
  footnotes:
  - marker: a
    text: Or 'For you have a store of works laid up with the Most High, but it will not be shown to you until the last times.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그를 멸시한 자들이여, 고난받는 사람들과 너 자신을 함께 헤아리지 마십시오. 지극히 높으신 분과 함께 너를 위해 쌓아 둔 행위의 보고가 있으나, 그것은 마지막 때까지 너에게 드러나지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 qui speruerunt는 여기서 ‘멸시한 자들’의 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: qui speruerunt
  english_pob_choice: who have shown contempt
  chosen_korean: 그를 멸시한 자들이여
  alternatives_korean:
  - 그를 업신여긴 자들이여
  - 그를 멸시한 자들
  lexicon: spernere → 멸시하다/업신여기다
  rationale: 라틴어 speruerunt는 단순한 ‘희망했다’가 아니라 ‘경멸했다, 업신여겼다’의 뜻이므로 POB의 경멸 의미를 살려 문두 호격처럼 옮겼습니다.
- source_word: neque connumeres te cum his qui cruciantur
  english_pob_choice: do not count yourself among those who are tormented
  chosen_korean: 고난받는 사람들과 너 자신을 함께 헤아리지 마십시오
  alternatives_korean:
  - 괴로움을 당하는 이들과 너 자신을 함께 شمار하지 마십시오
  - 고통받는 자들 가운데 너를 포함시키지 마십시오
  lexicon: connumerare / cruciari → 헤아리다 / 고난받다
  rationale: connumeres는 ‘함께 세다, 포함시키다’의 뜻이어서 ‘헤아리다’로, cruciantur는 육체적·형벌적 고통을 포함하는 ‘고난받다’로 옮겼습니다.
- source_word: thesaurus operum repositus apud Altissimum
  english_pob_choice: a treasury of works is laid up for you with the Most High
  chosen_korean: 지극히 높으신 분과 함께 너를 위해 쌓아 둔 행위의 보고
  alternatives_korean:
  - 지극히 높으신 분께 쌓아 둔 행위의 보고
  - 지극히 높으신 이 곁에 보관된 행위의 보물
  lexicon: thesaurus / operum / apud Altissimum → 보고 / 행위 / 함께
  rationale: thesaurus는 ‘보고, 보물창고’의 뜻이므로 ‘보고’로, operum은 행위의 축적을 가리켜 ‘행위’로, apud는 동반·보관의 관계를 드러내어 ‘과 함께’로 옮겼습니다.
- source_word: usque in nouissimis
  english_pob_choice: until the last times
  chosen_korean: 마지막 때까지
  alternatives_korean:
  - 끝날 때까지
  - 마지막 날들까지
  lexicon: novissimis → 마지막 때
  rationale: novissimis는 종말론적 종결 시점을 가리키므로 자연스러운 현대 한국어로 ‘마지막 때’라 옮겼습니다.
theological_decisions:
- issue: 행위의 보고가 구원의 근거로 들리는 표현
  chosen_reading: 본문의 ‘행위의 보고’는 공로 목록이 아니라, 지극히 높으신 분이 보관하시는 종말적 보상/기억의 언어로 유지했습니다.
  alternative_readings:
  - 행위의 공로가 쌓여 있다
  - 행위의 상급이 예비되어 있다
  rationale: 라틴어와 POB는 실제로 works의 축적을 말하지만, 이를 교리적으로 평탄화하지 않고 종말에 드러날 보관된 실재로 남겨 두는 편이 문맥을 더 정확히 반영합니다.
  doctrine_reference: 종말론적 보상과 행위의 기억(Second Temple Jewish apocalyptic context)
