  to: 멸시한 자들 가운데, 고난받는 이들과 함께 자신을 포함시키지 마십시오. 지극히 높으신 분 곁에 당신을 위하여 보관된 행위의 보고가 있으나, 그것은 마지막 때까지 당신에게 드러나지 않을 것입니다.
