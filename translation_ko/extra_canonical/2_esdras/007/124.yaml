  source_fidelity: 원문의 미래 직설법 의문문(nos vero non ingrediemur ...?)은 한국어에서도 수사 의문문으로 유지해야 합니다. 현 번역은 평서문 종결 뒤에 물음표와 각주 표지가 붙어 있어 문법적으로도, 원문의 문장 형태 면에서도 부정확합니다. ingratis는 여기서 도덕적 의미의 ‘감사 없는’이라기보다 ‘마땅치 않은/불쾌한/받아들일 수 없는’의 뜻입니다.
  naturalness: ‘우리가 불쾌한 곳들에서 살았기 때문입니다?’는 한국어의 이유절과 의문 종결이 부자연스럽게 결합되어 있습니다. 이유를 앞에 두고 ‘들어가지 않겠습니까?’로 맺으면 현대 표준 한국어 합쇼체로 자연스럽고 원문의 반문도 보존됩니다.
  terminology: ‘들어가지 않겠습니까’는 non ingrediemur의 미래 부정을 자연스럽게 옮깁니다. ingratis locis는 ‘마땅치 않은 곳들’로 번역하고, 각주에서 ‘불쾌한’이라는 가능한 어휘적 대안을 제시합니다.
  issues:
