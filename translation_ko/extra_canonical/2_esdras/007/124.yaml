lexical_decisions:
- source_word: non ingrediemur
  english_pob_choice: we will not enter
  chosen_korean: 들어가지 않겠습니다
  alternatives_korean:
  - 들어가지 않을 것입니다
  - 들어가지 않겠습니다만
  lexicon: ingredior
  rationale: 미래 부정 의지 표현을 자연스러운 합쇼체로 옮기되, 원문의 단순한 진술형 부정과 논리적 이유 제시를 유지했습니다.
- source_word: ingratis
  english_pob_choice: ungrateful
  chosen_korean: 불쾌한
  alternatives_korean:
  - 받아들이기 어려운
  - 마땅치 않은
  - 고마움이 없는
  lexicon: ingratus
  rationale: 라틴어 ingratis는 ‘감사 없는’보다 ‘불쾌한, 마음에 들지 않는, 환영받지 못하는’ 쪽의 뜻이어서, 한국어에서는 의미 범위를 가장 잘 드러내는 ‘불쾌한’을 택했습니다.
- source_word: locis
  english_pob_choice: places
  chosen_korean: 곳들
  alternatives_korean:
  - 장소들
  - 땅들
  lexicon: locus
  rationale: locus의 기본 의미를 따르면서도 문맥상 추상적·일반적 거처를 자연스럽게 표현하기 위해 ‘곳들’로 옮겼습니다.
