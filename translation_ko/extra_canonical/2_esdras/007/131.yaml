id: 2ES.7.131
reference: 2 Esdras 7:131
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam non esset tristitia in perditione eorum, sicut et futurum est gaudium super eos quibus persuasa est salus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/131.yaml
  text: For there should be no grief over their destruction[a], just as there will be joy over those to whom salvation has been promised.”
  footnotes:
  - marker: a
    text: Or 'Therefore there will be no grief over their destruction, just as there will be joy over those to whom salvation has been persuaded.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 멸망에 대해서는 슬픔이 없을 것이기 때문입니다. 마치 구원이 약속된 이들에게는 기쁨이 있을 것과 같습니다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그들의 멸망에 대해서는 슬픔이 없을 것이기 때문입니다. 마치 구원이 약속된 이들에게는 기쁨이 있을 것과 같습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: quoniam
  english_pob_choice: For
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  lexicon: quoniam
  rationale: 원문의 인과 접속사로서 앞뒤 논지를 연결하므로, ‘그러므로’보다 원인 설명에 가까운 ‘-기 때문입니다’가 더 가깝습니다.
- source_word: non esset tristitia
  english_pob_choice: there should be no grief
  chosen_korean: 슬픔이 없을 것이기
  alternatives_korean:
  - 슬픔이 없을 것입니다
  - 비통함이 없을 것이기
  lexicon: tristitia
  rationale: tristitia는 단순한 감정적 슬픔을 가리키므로 ‘비통함’보다 기본 의미를 살린 ‘슬픔’이 적절합니다.
- source_word: in perditione eorum
  english_pob_choice: over their destruction
  chosen_korean: 그들의 멸망에 대해서는
  alternatives_korean:
  - 그들의 파멸에 대해서는
  - 그들이 멸망할 때에는
  lexicon: perditio
  rationale: perditio는 멸망·파멸의 결과 상태를 뜻하므로, 문맥상 ‘그들의 멸망’으로 직역하되 한국어 조사로 대상성을 살렸습니다.
- source_word: quibus persuasa est salus
  english_pob_choice: to whom salvation has been promised
  chosen_korean: 구원이 약속된 이들에게는
  alternatives_korean:
  - 구원이 확언된 이들에게는
  - 구원이 보증된 이들에게는
  lexicon: persuadeo / salus
  rationale: persuasa est는 수동 완료로서 ‘설득되었다’보다 ‘약속되었다’가 더 자연스럽고, salus는 여기서 구원 자체를 가리키므로 ‘구원’으로 옮겼습니다.
theological_decisions:
- issue: salus의 종말론적 확정성
  chosen_reading: ‘구원이 약속된 이들’로, 구원의 외적 보증보다 종말론적 약속의 성격을 살렸습니다.
  alternative_readings:
  - 구원이 확정된 이들
  - 구원이 보장된 이들
  rationale: 라틴어 수동 표현은 구원이 대상에게 ‘전달되었다’는 의미를 담지만, 본문이 말하는 확정성은 약속의 형태로 드러나므로 이를 유지했습니다.
  doctrine_reference: 종말론적 구원 약속
