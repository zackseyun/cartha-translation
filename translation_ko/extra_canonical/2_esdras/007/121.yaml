id: 2ES.7.121
reference: 2 Esdras 7:121
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam reposita sunt habitacula sanitatis et securitatis, nos vero male conversati sumus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/121.yaml
  text: And if dwellings of health and safety have been laid up, but we have conducted ourselves wickedly?
translation:
  language: ko
  text: 그리고 만일 건강과 안전의 거처들이 예비되어 있다면, 우리는 왜 악하게 살아왔습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reposita sunt
  english_pob_choice: have been laid up
  chosen_korean: 예비되어 있다면
  alternatives_korean:
  - 마련되어 있다면
  - 쌓여 있다면
  - 저장되어 있다면
  lexicon: reposita sunt
  rationale: 단순한 ‘놓여 있다’보다, 장차를 위해 준비되어 있다는 뜻을 살려 ‘예비되다’로 옮겼습니다.
- source_word: habitacula
  english_pob_choice: dwellings
  chosen_korean: 거처들
  alternatives_korean:
  - 집들
  - 거주처들
  - 주거들
  lexicon: habitaculum
  rationale: 건물의 일반적 ‘주거 공간’이라는 의미를 살리되, 문맥상 복수성을 반영해 ‘거처들’로 옮겼습니다.
- source_word: sanitatis et securitatis
  english_pob_choice: of health and safety
  chosen_korean: 건강과 안전의
  alternatives_korean:
  - 치유와 안전의
  - 건전함과 안전의
  - 건강과 평안의
  lexicon: sanitas / securitas
  rationale: sanitas의 기본 의미인 ‘건강’과 securitas의 ‘안전, 불안 없음’을 가장 직접적으로 반영했습니다.
- source_word: male conversati sumus
  english_pob_choice: we have conducted ourselves wickedly
  chosen_korean: 우리는 왜 악하게 살아왔습니까
  alternatives_korean:
  - 우리는 왜 악한 삶을 살아왔습니까
  - 우리는 왜 잘못 행해 왔습니까
  - 우리는 왜 사악하게 처신해 왔습니까
  lexicon: male conversari
  rationale: conversari는 단순히 ‘살다’보다 ‘행실을 유지하며 처신하다’의 뉘앙스가 있어, POB의 formal register를 살려 ‘악하게 살아왔습니까’로 옮겼습니다.
theological_decisions:
- issue: 대조 구조의 보존
  chosen_reading: ‘건강과 안전의 거처들’과 ‘우리는 왜 악하게 살아왔습니까?’의 대조를 그대로 유지했습니다.
  alternative_readings:
  - 후반부를 완화해 ‘우리는 왜 잘못 살아왔습니까?’로 바꾸는 읽기
  - 전반부를 추상화해 ‘복된 처소들’로 옮기는 읽기
  rationale: 본문은 예비된 복된 거처들과 현재의 악한 삶을 강하게 대조합니다. 이를 약화하지 않기 위해 직접적인 대비를 유지했습니다.
  doctrine_reference: 문학적-수사적 대조의 보존
