  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'patientur amodo qui neglexerint. Et respondi et dixi : ergo dabitur tempus animabus postquam separatae fuerint de corporibus, ut uideant de quo mihi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/100.yaml
  text: And I answered and said, “Then will time be given to the souls, after they have been separated from the bodies, to see that of which you told me?”
translation:
  language: ko
  text: 나는 대답하여 말하였습니다. 「그러면 영혼들이 몸에서 분리된 뒤에, 영혼들에게 시간이 주어져 당신께서 내게 말씀해 주신 그 일을 보게 됩니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: patientur amodo qui neglexerint
  english_pob_choice: Then will time be given
  chosen_korean: 그러면 시간이 주어져서
  alternatives_korean:
  - 그제야 시간이 주어져서
  - 그때부터 시간이 허락되어
  lexicon: tempus
  rationale: 라틴어 tempus를 자연스럽게 옮기되, 질문의 핵심인 ‘시간이 허락됨/주어짐’을 살렸습니다.
- source_word: animabus
  english_pob_choice: the souls
  chosen_korean: 영혼들에게
  alternatives_korean:
  - 혼들에게
  - 영들에게
  lexicon: anima
  rationale: 본문이 육체와 대조되는 영적 주체를 말하므로 ‘영혼’이 가장 직접적입니다.
- source_word: postquam separatae fuerint de corporibus
  english_pob_choice: after they have been separated from the bodies
  chosen_korean: 몸에서 분리된 뒤에
  alternatives_korean:
  - 육체에서 떨어져 나온 뒤에
  - 몸과 분리된 후에
  lexicon: separatae fuerint de corporibus
  rationale: 라틴어의 분리 동사를 그대로 반영하면서, 한국어에서는 중복을 줄여 간결하게 표현했습니다.
- source_word: de quo mihi
  english_pob_choice: that of which you told me
  chosen_korean: 당신이 내게 말한 그것을
  alternatives_korean:
  - 당신이 내게 말씀하신 그것을
  - 내게 말씀하신 그 일에 대하여
  lexicon: de quo
  rationale: 개정된 영어 POB의 ‘that of which’에 맞춰, 지시 대상이 분명하되 과도하게 풀어쓰지 않도록 했습니다.
theological_decisions:
- issue: ‘souls’와 ‘bodies’의 대비를 어떻게 유지할지
  chosen_reading: 영혼과 몸의 분리를 문장 안에서 직접 드러냈습니다.
  alternative_readings:
  - 죽은 자들
  - 사람들
  rationale: 본문은 사후 상태의 주체를 ‘영혼들’로, 대비 항을 ‘몸’으로 제시하므로 그 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 사후 상태/영혼-몸 분리의 서술을 본문 수준에서 보존
