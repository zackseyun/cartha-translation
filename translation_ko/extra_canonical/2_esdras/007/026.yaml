base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/026.yaml
  text: For behold[a], the time will come, and it will be when the signs that I foretold to you will come, and the bride will appear, and the city that is appearing[b], and what is now withdrawn from the earth will be shown.
  footnotes:
  - marker: a
    text: The paired images of the appearing bride and the city now hidden likely compress Zion/Jerusalem restoration imagery into apocalyptic symbolism. The Latin is terse and does not explain the relationship between bride and city.
    reason: compositional_layer
    anchor_ref: '7:26'
  - marker: b
    text: Or 'the city now hidden will appear'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 그 때가 올 것이며, 내가 당신에게 예고한 표징들이 나타날 때가 될 것입니다. 신부가 나타나고, 나타나고 있는 성읍이 드러나며, 지금 땅에서 거두어져 있는 것이 보일 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘신부’와 ‘나타나고 있는 성읍’의 관계는 본문이 설명하지 않으며, 종말론적 회복 이미지를 압축한 병렬 표현일 가능성이 큽니다.
    reason: theological_note
  - marker: b
    text: 라틴어 apparescens civitas는 문자적으로 ‘나타나고 있는 성읍’입니다.
    reason: source_note
lexical_decisions:
- source_word: ecce enim
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이보십시오
  lexicon: interjection
  rationale: 독자에게 장면 전환을 알리는 감탄을 현대 합쇼체로 살리기 위해 ‘보십시오’를 택했습니다.
- source_word: sponsa
  english_pob_choice: the bride
  chosen_korean: 신부
  alternatives_korean:
  - 배우자
  - 신랑의 신부
  lexicon: sponsa
  rationale: 라틴어 sponsa의 기본 의미를 직역하되, 종말론적 상징성을 유지하기 위해 한국어에서도 간명하게 ‘신부’로 옮겼습니다.
- source_word: apparescens civitas
  english_pob_choice: the city that is appearing
  chosen_korean: 나타나고 있는 성읍
  alternatives_korean:
  - 드러나고 있는 성읍
  - 나타나는 성읍
  lexicon: civitas
  rationale: apparescens의 현재분사적 지속성을 살려 ‘나타나고 있는’으로 옮기고, 2에스드라스의 고전적 도시 표지를 위해 ‘성읍’을 유지했습니다.
- source_word: quae nunc subducitur terra
  english_pob_choice: what is now withdrawn from the earth
  chosen_korean: 이제 땅에서 치워져 있는 것
  alternatives_korean:
  - 이제 땅에서 거두어져 있는 것
  - 지금 땅 아래로 숨겨져 있는 것
  lexicon: subducitur
  rationale: subducitur의 ‘치워지다/거두어지다’라는 숨김·철수의 뜻을 보존하면서, 라틴어의 수동형을 한국어 수동 표현으로 반영했습니다.
theological_decisions:
- issue: ‘신부’와 ‘성읍’의 병렬 이미지
  chosen_reading: 신부와 성읍을 둘 다 유지해, 본문이 종말론적 회복을 상징적으로 압축해 말하는 긴장을 그대로 드러냈습니다.
  alternative_readings:
  - 신부를 비유로 풀어 설명하는 번역
  - 성읍만을 중심으로 재구성하는 번역
  rationale: 라틴어는 둘 사이의 관계를 설명하지 않으므로, 의미를 확정하지 않고 병렬 구조를 보존하는 것이 더 충실합니다.
  doctrine_reference: apocalyptic symbolism; restoration imagery
