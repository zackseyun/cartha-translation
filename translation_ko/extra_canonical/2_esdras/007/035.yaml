id: 2ES.7.35
reference: 2 Esdras 7:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et opus subsequetur et merces ostendetur. et iustitiae vigilabunt et iniustitiae non dormibunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/035.yaml
  text: And the deed will follow, and the reward will be shown, and acts of righteousness will keep watch, and acts of unrighteousness will not sleep.
translation:
  language: ko
  text: 그리고 행위는 뒤따를 것이며, 상은 드러날 것이며, 의의 행위들은 깨어 있을 것이며, 불의의 행위들은 잠들지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus subsequetur
  english_pob_choice: And the deed will follow
  chosen_korean: 그리고 행위는 뒤따를 것이며
  alternatives_korean:
  - 그리고 일은 뒤따를 것이며
  - 그리고 행실은 뒤따를 것이며
  lexicon: opus → 행위
  rationale: opus를 단순한 ‘일’보다 결과를 낳는 행위로 읽어, 앞의 진술과 자연스럽게 연결되는 ‘행위’로 옮겼습니다.
- source_word: merces ostendetur
  english_pob_choice: and the reward will be shown
  chosen_korean: 상은 드러날 것이며
  alternatives_korean:
  - 보상은 드러날 것이며
  - 삭임은 나타날 것이며
  lexicon: merces → 상
  rationale: merces는 보상/삯/상으로 옮길 수 있으나, 문맥상 행위에 대한 응답으로서의 ‘상’이 가장 간결하고 직접적입니다.
- source_word: iustitiae vigilabunt
  english_pob_choice: and acts of righteousness will keep watch
  chosen_korean: 의의 행위들은 깨어 있을 것이며
  alternatives_korean:
  - 의의 행위들은 지켜볼 것이며
  - 의로운 행위들은 깨어 있을 것이며
  lexicon: iustitiae → 의의 행위들
  rationale: POB의 수정본이 강조하듯 vigilabunt는 ‘깨어 있다/경계하다’의 의미이므로, ‘깨어 있을 것이다’로 옮겨 감시·각성의 뉘앙스를 살렸습니다.
- source_word: iniustitiae non dormibunt
  english_pob_choice: and acts of unrighteousness will not sleep
  chosen_korean: 불의의 행위들은 잠들지 않을 것입니다
  alternatives_korean:
  - 불의의 행위들은 졸지 않을 것입니다
  - 불의한 일들은 잠들지 않을 것입니다
  lexicon: iniustitiae → 불의의 행위들
  rationale: 앞절과 평행하게 ‘행위들’을 유지하여 의미 단위를 맞추었고, dormibunt의 직접적 반대인 ‘잠들지 않다’를 살렸습니다.
theological_decisions:
- issue: 의인/악인의 상태를 ‘깨어 있음’과 ‘잠들지 않음’으로 대조하는 표현
  chosen_reading: 의의 행위들은 깨어 있고 불의의 행위들은 잠들지 않는다고 옮겼습니다.
  alternative_readings:
  - 의인들은 깨어 있고 악인들은 잠들지 않는다고 옮길 수 있습니다.
  - 의로운 것과 불의한 것을 의인/악인으로 의역할 수 있습니다.
  rationale: 원문은 인물 일반이 아니라 행위(복수) 자체를 의인화하므로, 이를 사람으로 바꾸지 않고 문법적 대상의 긴장을 유지했습니다.
  doctrine_reference: 문학적 의인화와 행위의 도덕적 책임성
