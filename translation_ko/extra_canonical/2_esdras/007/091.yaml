- from: 무엇보다 먼저, 그들을 받으시는 분의 영광을 그들은 큰 기쁨으로 봅니다.[a]
  to: 첫째로, 그들은 큰 기쁨으로 그들을 받으시는 분의 영광을 봅니다.[a]
  rationale: ‘첫째로’는 라틴어 Imprimis의 열거 표지 기능을 보존합니다. 본문은 제공된 라틴어 절의 범위만 번역하고, 92절에 속하는 안식 절은 이전 절 구분을 기록하는 각주에만 둡니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:36Z'
