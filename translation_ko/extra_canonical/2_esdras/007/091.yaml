translation:
  language: ko
  text: 첫째로, 그들은 큰 기쁨으로 그들을 받으시는 분의 영광을 봅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “첫째로, 그들은 큰 기쁨으로 그들을 받으시는 분의 영광을 봅니다. 이는 그들이 일곱 단계에 걸쳐 안식할 것이기 때문입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: Imprimis
  english_pob_choice: First
  chosen_korean: 무엇보다 먼저
  alternatives_korean:
  - 먼저
  - 첫째로
  lexicon: source_note
  rationale: 라틴어 Imprimis는 순서 표지로, 문맥상 뒤의 절을 이끄는 자연스러운 한국어 연결 표현으로 옮겼습니다.
- source_word: uident
  english_pob_choice: they see
  chosen_korean: 봅니다
  alternatives_korean:
  - 그들은 봅니다
  - 그들은 바라봅니다
  lexicon: source_note
  rationale: 단순한 시각 인지를 뜻하므로 과도한 해석을 피하고 간결하게 ‘봅니다’로 옮겼습니다.
- source_word: cum exultatione multa
  english_pob_choice: with great joy
  chosen_korean: 큰 기쁨으로
  alternatives_korean:
  - 매우 큰 기쁨으로
  - 몹시 기뻐하며
  lexicon: source_note
  rationale: cum + 명사구는 부사적 표현으로 자연스럽게 처리했고, exultatione multa의 강한 기쁨을 ‘큰 기쁨’으로 살렸습니다.
- source_word: gloriam eius qui suscipit eas
  english_pob_choice: the glory of him who receives them
  chosen_korean: 그들을 받으시는 분의 영광
  alternatives_korean:
  - 그들을 받아들이시는 이의 영광
  - 그들을 영접하시는 분의 영광
  lexicon: source_note
  rationale: suscipit eas는 단순한 ‘받다’보다 인격적 수용을 내포하므로, 문맥을 살리되 원문의 의미 범위를 벗어나지 않도록 ‘받으시는 분’으로 옮겼습니다.
theological_decisions:
- issue: 수용의 주체를 어떻게 한국어로 드러낼지
  chosen_reading: ‘그들을 받으시는 분’으로 두어, 원문이 말하는 최종적 수용자를 인격적으로 드러냈습니다.
  alternative_readings:
  - ‘그들을 받아들이시는 이’
  - ‘그들을 영접하시는 분’
  rationale: 이 절은 종말론적 영광의 대상을 묘사하는 문맥이므로, 지나치게 교리화하지 않으면서도 관계적 수용의 의미를 보존하는 번역이 적절합니다.
  doctrine_reference: 종말론적 보상/수용의 이미지
- issue: Imprimis의 기능
  chosen_reading: 독립된 ‘첫째로’보다 문장 흐름을 여는 ‘무엇보다 먼저’를 채택했습니다.
  alternative_readings:
  - 첫째로
  - 먼저
  rationale: 현대 한국어에서 본문 첫머리의 순서 표지는 문장 접속 기능이 강하므로, 읽기 자연성을 해치지 않는 범위에서 절 구조를 유지했습니다.
  doctrine_reference: 문체/담화 구조
