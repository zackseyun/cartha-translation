  text: '[eius], cui seruiunt uiuentes et a quo incipiunt gloriosi mercedem recipere. Hic ordo animarum iustorum, ut a modo adnuntiatur, praedictae uiae cruciatus, quas'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/099.yaml
  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
  footnotes:
  - marker: a
    text: Or 'as it is now announced; and these are the previously described ways of torment which those who were negligent'.
