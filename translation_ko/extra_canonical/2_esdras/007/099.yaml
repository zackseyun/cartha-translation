source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: '[eius], cui seruiunt uiuentes et a quo incipiunt gloriosi mercedem recipere. Hic ordo animarum iustorum, ut a modo adnuntiatur, praedictae uiae cruciatus, quas'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/099.yaml
  text: '[him][a], whom the living serve and from whom the glorious begin to receive their reward. This is the order of the souls of the righteous, as it is now announced; [and these are] the previously described ways of torment, which'
  footnotes:
  - marker: a
    text: Or 'as it is now announced; and these are the previously described ways of torment which those who were negligent'.
    reason: previous_rendering
translation:
  language: ko
  text: '[그분은] 살아 있는 이들이 섬기며, 영화로운 이들이 그분에게서 보상을 받기 시작하는 분입니다. 이것이 이제부터 선포되는 바와 같은 의인들의 영혼의 질서입니다. [그리고] 이것들은 앞서 설명된 고통의 길들인데,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이것이 이제부터 선포되는 바와 같은 의인들의 영혼의 질서입니다. 그리고 이것들은 앞서 설명된 고통의 길들인데, 그 [길들을] 소홀히 한 자들이 겪게 될 것이다.’
    reason: 본문의 마지막 관계절이 다음 절로 이어지는 미완결 형태임을 보존하면서, 이전의 완결형 번역 가능성을 제시합니다.
lexical_decisions:
- source_word: eius, cui seruiunt uiuentes
  english_pob_choice: '[him], whom the living serve'
  chosen_korean: '[그분을], 살아 있는 이들이 섬기며'
  alternatives_korean:
  - '[그를], 산 자들이 섬기며'
  - '[그분께], 살아 있는 이들이 봉사하며'
  lexicon: cui → 에게/을, seruiunt → 섬기다
  rationale: 라틴어 관계절의 대상을 분명히 드러내기 위해 목적격을 살렸고, seruiunt는 단순한 '봉사하다'보다 종교적·관계적 예속을 함께 드러내는 '섬기다'가 적절합니다.
- source_word: a quo incipiunt gloriosi mercedem recipere
  english_pob_choice: from whom the glorious begin to receive their reward
  chosen_korean: 영화로운 이들이 그 보상을 받기 시작하는 분입니다
  alternatives_korean:
  - 영광스러운 이들이 상을 받기 시작하는 분입니다
  - 영화로운 이들이 보상을 받기 시작하는 분입니다
  lexicon: gloriosi → 영화로운 이들, mercedem → 보상
  rationale: gloriosi는 도덕적 상태보다 영광의 성격을 가리키므로 '영화로운 이들'이 원문의 색채를 더 잘 살리고, mercedem은 문맥상 행위에 대한 '보상'이 자연스럽습니다.
- source_word: a modo adnuntiatur
  english_pob_choice: as it is now announced
  chosen_korean: 이것은 이제부터 선포됩니다
  alternatives_korean:
  - 이것은 지금 선포됩니다
  - 이것은 이제 선포됩니다
  lexicon: a modo → 이제부터, adnuntiatur → 선포되다
  rationale: applied revision이 지적하듯 a modo는 단순 현재가 아니라 '이제부터/지금부터'의 시간적 전환을 나타내므로 '이제부터'로 옮겼습니다.
- source_word: praedictae uiae cruciatus
  english_pob_choice: the previously described ways of torment
  chosen_korean: 앞서 설명된 고통의 길들
  alternatives_korean:
  - 앞서 말한 고통의 길들
  - 미리 언급된 고통의 길들
  lexicon: uiae cruciatus → 고통의 길들
  rationale: uiae는 문자적으로 '길들'이므로, 추상화하지 않고 '고통의 길들'로 유지해 앞선 대비 구조를 보존했습니다.
theological_decisions:
- issue: 원문의 미완결 절을 어떻게 처리할 것인가
  chosen_reading: 문장이 다음 절로 이어지는 미완결 형태를 그대로 유지했습니다.
  alternative_readings:
  - 완결형으로 매끈하게 보충한다
  - 다음 절 내용을 앞당겨 붙인다
  rationale: 라틴어 본문과 POB 영어가 모두 절 끝을 열어 두고 있으므로, 번역도 마침표로 닫지 않고 열린 구조를 유지해 본문 흐름을 보존했습니다.
  doctrine_reference: textual fidelity / discourse continuity
