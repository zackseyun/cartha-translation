    rationale: ‘제3의 길은’ 다음에 쉼표를 두고 ‘그들이 본다는 것입니다’로 끝내면 열거 항목의 진술로서 어색합니다. ‘셋째 길은 … 보는 것입니다’로 다듬는 것이 자연스럽습니다.
  - severity: low
    issue: ‘간직된 상급’의 표현이 다소 비인칭적이고 어색합니다.
    rationale: repositam mercedem은 보존되어 마련된 보상을 가리킵니다. 한국어에서는 ‘예비해 두신 상급’이 해당 뉘앙스를 자연스럽게 전달합니다.
  revised_text: 셋째 길은, 그들이 지극히 높으신 분의 언약들을 신뢰한 이들을 위하여 예비해 두신 상급을 보는 것입니다.
