base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/083.yaml
  text: 'The third way: they see the reward laid up for those who have trusted the covenants of the Most High.'
translation:
  language: ko
  text: 셋째 길은, 그들이 지극히 높으신 분의 언약들을 신뢰한 이들을 위하여 예비해 두신 상급을 보는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tertia uia
  english_pob_choice: The third way
  chosen_korean: 제3의 길
  alternatives_korean:
  - 세 번째 길
  - 셋째 길
  lexicon: —
  rationale: 라틴어 Tertia uia를 직역하되, 영어 POB의 방식에 맞춰 절의 도입부를 간결한 명사구로 살렸습니다.
- source_word: repositam mercedem
  english_pob_choice: the reward laid up
  chosen_korean: 간직된 상급
  alternatives_korean:
  - 쌓여 있는 상급
  - 예비된 상급
  - 보관된 상급
  lexicon: —
  rationale: repositam은 단순한 ‘보상’보다 ‘간직/예비됨’의 이미지를 가지므로, 보상적 의미를 유지하면서도 저장된 상태를 드러내는 표현을 택했습니다.
- source_word: his qui
  english_pob_choice: for those who
  chosen_korean: 이들을 위해
  alternatives_korean:
  - …한 이들을 위해
  - …한 사람들을 위해
  lexicon: —
  rationale: 라틴어 관계절의 수혜 대상을 자연스러운 한국어로 풀어, 뒤의 수식이 매끄럽게 읽히도록 했습니다.
- source_word: covenants of the Most High
  english_pob_choice: the covenants of the Most High
  chosen_korean: 지극히 높으신 분의 언약들
  alternatives_korean:
  - 지극히 높으신 분의 계약들
  - 가장 높으신 하나님의 언약들
  lexicon: —
  rationale: foedera/언약의 복수형을 유지했고, Most High는 정체를 분명히 하되 직역적 울림을 살려 ‘지극히 높으신 분’으로 옮겼습니다.
theological_decisions:
- issue: ‘언약들’의 복수성과 대상
  chosen_reading: 복수형 ‘언약들’을 유지했습니다.
  alternative_readings:
  - 단수형 ‘언약’으로 완화
  - ‘계약들’로 일반화
  rationale: 원문과 영어 POB가 복수성을 유지하므로, 구약적 여러 언약/서약의 범위를 흐리지 않기 위해 그대로 살렸습니다.
  doctrine_reference: 문맥 보존 및 언약 신학의 복수 표지 유지
