translation:
  language: ko
  text: 그러므로 이제 썩을 존재인 당신이 왜 불안해하십니까?[a] 또 죽을 존재인 당신이 왜 동요하십니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼란스러워하십니까’.
    reason: conturbaris는 내적 혼란이나 불안을 뜻하며, 문맥상 가능한 한국어 대안을 제시합니다.
lexical_decisions:
- source_word: conturbaris
  english_pob_choice: disturbed
  chosen_korean: 흔들리십니까
  alternatives_korean:
  - 당황하십니까
  - 동요하십니까
  - 괴로워하십니까
  lexicon: conturbaris
  rationale: 문맥상 내면의 혼란과 불안정을 가리키므로, 단순한 감정 자극보다 상태의 불안함을 드러내는 ‘흔들리십니까’로 옮겼습니다.
- source_word: corruptibilis
  english_pob_choice: corruptible
  chosen_korean: 썩을 존재
  alternatives_korean:
  - 썩어질 존재
  - 부패할 존재
  - 썩기 쉬운 존재
  lexicon: corruptibilis
  rationale: 라틴어가 말하는 ‘부패 가능성’은 존재론적 유한성과 죽음의 조건을 포함하므로, 형용사만 따로 두기보다 ‘썩을 존재’로 압축해 표현했습니다.
- source_word: moveris
  english_pob_choice: shaken
  chosen_korean: 동요하십니까
  alternatives_korean:
  - 흔들리십니까
  - 움직이십니까
  - 요동하십니까
  lexicon: moveris
  rationale: 영어 개정처럼 여기서는 감정적 ‘움직임’이 아니라 불안정하게 ‘흔들림/동요함’의 뜻이므로, 앞절과 구별되게 ‘동요하십니까’로 옮겼습니다.
- source_word: mortalis
  english_pob_choice: mortal
  chosen_korean: 죽을 존재
  alternatives_korean:
  - 죽을 수밖에 없는 존재
  - 죽는 존재
  - 필멸의 존재
  lexicon: mortalis
  rationale: 단순한 형용사보다 인간의 운명을 드러내는 서술이어서, ‘죽을 존재’로 자연스럽고 직설적으로 표현했습니다.
theological_decisions:
- issue: 인간의 유한성과 불안정성에 대한 수사
  chosen_reading: 화자는 상대에게 스스로의 피조성—썩을 존재, 죽을 존재—을 상기시키며 동요를 멈추라고 묻습니다.
  alternative_readings:
  - 단순히 심리적 위안을 주는 말
  - 철학적 일반론에 그치는 표현
  rationale: 반복되는 질문은 존재론적 한계를 상기시키는 논리적 책망으로 읽히며, 이를 한국어에서도 분명히 드러내야 합니다.
  doctrine_reference: 인간의 유한성, 피조물성과 죽음의 현실
