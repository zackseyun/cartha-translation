  terminology: munificus는 ‘너그러우시다’로 적절하며, donare는 이 문맥에서 ‘베풀다’, exigere는 ‘요구하다’로 옮기는 것이 수여와 요구의 대조를 자연스럽게 보존합니다. 신적 주어를 존대하는 합쇼체도 적절합니다.
