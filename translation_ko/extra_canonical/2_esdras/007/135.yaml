source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et munificus, quoniam quidem donare vult pro exigere,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/135.yaml
  text: and generous, because indeed he is willing to give rather than demand,
translation:
  language: ko
  text: 그리고 너그러우시며, 참으로 요구하기보다 주시기를 원하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문자적으로는 ‘주는 것을 원하기보다 요구하는 것’이라는 대비입니다.
    reason: source_note
lexical_decisions:
- source_word: et munificus
  english_pob_choice: and generous
  chosen_korean: 너그러우시며
  alternatives_korean:
  - 후하시며
  - 관대하시며
  lexicon: munificus
  rationale: munificus는 단순한 넉넉함보다 아낌없이 베푸는 성품을 가리키므로, 문맥상 자연스러운 형용사로 ‘너그러우시며’를 택했습니다.
- source_word: quidem
  english_pob_choice: indeed
  chosen_korean: 참으로
  alternatives_korean:
  - 실로
  - 정말로
  lexicon: quidem
  rationale: quidem의 강조를 한국어에서 격조를 유지하며 드러내기 위해 ‘참으로’를 사용했습니다.
- source_word: donare vult
  english_pob_choice: he is willing to give
  chosen_korean: 주시기를 원하십니다
  alternatives_korean:
  - 주기를 원하십니다
  - 주기를 바라십니다
  lexicon: donare + velle
  rationale: 단순한 의지 표현을 살리면서도 한국어에서 자연스럽게 하나의 서술로 읽히도록 ‘주시기를 원하십니다’로 옮겼습니다.
- source_word: pro exigere
  english_pob_choice: rather than demand
  chosen_korean: 요구하기보다
  alternatives_korean:
  - 받아내기보다
  - 강요하기보다
  lexicon: pro + exigere
  rationale: exigere의 ‘요구하다, 받아내다’라는 대비 의미를 살려, 수여와 요구의 대조가 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 하나님의 성품을 나타내는 문장의 어조
  chosen_reading: ‘너그러우시며’와 ‘주시기를 원하십니다’로 하나님의 베푸심을 적극적으로 드러냈습니다.
  alternative_readings:
  - ‘관대하시며’와 ‘주기를 원하십니다’
  - ‘후하시며’와 ‘주기를 바라십니다’
  rationale: 본문은 단순한 물질적 풍성함보다 주는 것을 기뻐하는 성품을 말하므로, 신학적 뉘앙스를 흐리지 않으면서도 현대 한국어에서 직접적으로 읽히는 표현을 택했습니다.
  doctrine_reference: 하나님의 자비와 후한 베풂에 관한 일반적 성경적 진술
