  source_fidelity: 라틴어의 핵심 대조와 병렬을 충실히 반영합니다. 다만 uidete et intellegite는 명령형 두 개이므로 ‘보아 알라’보다 각각을 분명히 옮기는 편이 낫고, vel의 반복은 ‘또는’으로 유지했습니다. excitatas의 각성 이미지는 ‘깨어난’으로 보존했습니다.
  naturalness: ‘보아 알라’는 현대 표준어 합쇼체의 요구에 비해 고어적이며 반말형으로 들릴 수 있습니다. ‘보십시오. 깨달으십시오.’가 현대적인 격식체이면서 원문의 두 명령을 자연스럽게 재현합니다.
  terminology: Altissimus는 ‘지극히 높으신 분’으로 적절합니다. gentes는 본문 문맥상 ‘민족들’로 유지할 수 있으며, ‘깨어난’은 부활이라는 해석을 단정하지 않고 각성의 비유를 보존합니다. ‘그분의 길’은 앞선 대상을 자연스럽게 가리킵니다.
