id: 2ES.7.37
reference: 2 Esdras 7:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'gehennae ostendetur, et contra eum iocunditatis paradisus. Et dicet tunc Altissimus ad excitatas gentes : uidete et intellegite quem negastis, uel cui non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/037.yaml
  text: And then the Most High will say to the awakened nations[a], “Look and understand whom you denied, or whom you did not serve, or whose ways you despised.
  footnotes:
  - marker: a
    text: Or 'nations that have been raised'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 지극히 높으신 분께서 깨어난 민족들에게 말씀하실 것입니다[a]. “보십시오. 깨달으십시오. 너희가 부인한 이가 누구인지, 또는 너희가 섬기지 않은 이가 누구인지, 또는 너희가 그분의 길을 멸시한 이가 누구인지.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “일으켜 세움을 받은 민족들에게”로도 옮길 수 있습니다.
    reason: excitatas는 ‘깨어난’ 외에 ‘일으켜진/일으켜 세워진’이라는 의미도 지닐 수 있습니다. 다만 본문은 주변의 수면과 각성 이미지를 따라 ‘깨어난’을 채택합니다.
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: 특정 고유 명칭보다 칭호 중심 표현
  rationale: 라틴어 Altissimus는 신적 칭호로서 높임의 의미를 살려야 하므로, 한국어에서는 경건한 칭호인 ‘지극히 높으신 분’이 자연스럽고 원문 의미를 보존합니다.
- source_word: excitatas gentes
  english_pob_choice: awakened nations
  chosen_korean: 깨어난 민족들
  alternatives_korean:
  - 일으켜 세워진 민족들
  - 잠에서 깨어난 민족들
  lexicon: 깨어나다 / 민족
  rationale: 개정된 영어 본문이 ‘awakened’로 잡은 수면-각성 이미지를 따라, 단순한 ‘부활’보다 ‘깨어난’이 문맥의 비유를 더 직접적으로 반영합니다.
- source_word: negastis / non servistis / vias contempsistis
  english_pob_choice: whom you denied, or whom you did not serve, or whose ways you despised
  chosen_korean: 너희가 부인한 이가 누구인지, 또는 너희가 섬기지 않은 이가 누구인지, 또 그의 길을 멸시한 이가 누구인지
  alternatives_korean:
  - 너희가 부정한 이
  - 너희가 경배하지 않은 이
  - 그의 길을 업신여긴 이
  lexicon: 부인하다 / 섬기다 / 멸시하다
  rationale: 세 동사는 서로 다른 책임을 병렬로 드러내므로, 각각을 과도하게 통합하지 않고 ‘부인하다, 섬기지 않다, 멸시하다’로 구분해 옮겼습니다.
theological_decisions:
- issue: 각성된 민족들에 대한 심판 장면의 종말론적 이미지
  chosen_reading: ‘깨어난 민족들’은 단순한 소집이 아니라 심판을 위한 각성과 대조적 판결의 문맥을 유지합니다.
  alternative_readings:
  - ‘일으켜 세워진 민족들’
  - ‘부활한 민족들’
  rationale: 주변 문맥의 수면-각성 이미지를 따라 ‘awakened’의 비유를 유지하는 것이, 본문의 심판 선언이 지닌 긴장감을 더 정확히 전달합니다.
  doctrine_reference: 종말론적 심판과 부활 이미지의 병행
