id: 2ES.7.123
reference: 2 Esdras 7:123
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et quoniam ostendetur paradisus, cuius fructus incorruptus perseverat, in quo est saturitas et medella,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/123.yaml
  text: And because paradise will be shown, whose fruit remains incorruptible, in which there is fullness and healing,
translation:
  language: ko
  text: 그리고 낙원이 드러날 것인데, 그 열매는 썩지 않는 채로 남아 있으며, 그 안에는 풍성함과 치유가 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam
  english_pob_choice: because
  chosen_korean: 그리고
  alternatives_korean:
  - 왜냐하면
  - 그러므로
  - 이는
  lexicon: 접속사
  rationale: 문맥상 앞절에 이어 원인·근거를 덧붙이는 연결이므로, 자연스러운 한국어 흐름을 위해 절을 매끄럽게 잇는 ‘그리고’를 택했습니다.
- source_word: ostendetur paradisus
  english_pob_choice: paradise will be shown
  chosen_korean: 낙원이 드러날 것인데
  alternatives_korean:
  - 낙원이 보일 것입니다
  - 낙원이 나타날 것입니다
  - 낙원이 보여질 것입니다
  lexicon: 표현
  rationale: 라틴 수동형의 결과적 공개를 살려 ‘드러날 것인데’로 옮겨, 단순한 시각적 인지가 아니라 공개·현시의 뉘앙스를 반영했습니다.
- source_word: fructus incorruptus perseverat
  english_pob_choice: whose fruit remains incorruptible
  chosen_korean: 그 열매는 썩지 않는 채로 남아 있으며
  alternatives_korean:
  - 그 열매는 썩지 않은 채 남아 있으며
  - 그 열매는 부패하지 않은 채로 지속되며
  lexicon: 표현
  rationale: ‘incorruptus’를 관용적으로 ‘썩지 않는’으로 옮기되, ‘perseverat’의 지속성을 ‘남아 있으며’로 살렸습니다.
- source_word: saturitas et medella
  english_pob_choice: fullness and healing
  chosen_korean: 풍성함과 치유가 있습니다
  alternatives_korean:
  - 충만함과 치유가 있습니다
  - 배부름과 치유가 있습니다
  - 만족과 치료가 있습니다
  lexicon: 의미
  rationale: ‘saturitas’는 단순한 배부름보다 충족된 충만의 의미가 있어, 더 넓은 의미를 담는 ‘풍성함’을 선택했습니다.
theological_decisions:
- issue: 낙원의 성격을 어떻게 드러낼지
  chosen_reading: 구체적 장소이면서도 최종적 축복의 공간으로서 ‘낙원’으로 직역했습니다.
  alternative_readings:
  - 에덴
  - 천국
  - 동산
  rationale: 라틴 본문의 paradisus를 전통적 종교어휘로 완화하지 않고, 종말론적 축복의 장소라는 직설적 의미를 보존하기 위해 ‘낙원’을 유지했습니다.
  doctrine_reference: 종말론적 복락의 장소에 대한 중립적 번역 선택
- issue: ‘치유’의 번역 범위
  chosen_reading: medella를 의학적 ‘치료’보다 더 넓은 회복의 뜻을 담는 ‘치유’로 옮겼습니다.
  alternative_readings:
  - 치료
  - 의술
  - 회복
  rationale: 본문은 단순 의료 행위보다 낙원 안에 있는 회복·치유의 상태를 말하므로, 더 포괄적인 ‘치유’가 적절합니다.
  doctrine_reference: 회복과 치유의 상태를 나타내는 어휘 선택
