  source_fidelity: 첫 문장의 라틴어 부정사 adorare는 앞 문맥의 주어가 수행하는 행위이며, 초안의 ‘경배하게 하려는 것입니다’는 목적·의도를 덧붙여 의미를 바꿉니다. ad eum은 ‘그것을 주신 분께 나아가’로, primum은 ‘무엇보다 먼저’로 옮기는 것이 적절합니다. 후반부의 조건절은 주어진 라틴어 단편에 충실하나, ‘그들 가운데 하나’가 ‘one of those’를 더 직접적으로 반영합니다.
  naturalness: ‘그것을 주신 분께 나아가, 무엇보다 먼저 … 경배합니다’는 절 앞부분이 앞 절에서 이어진다는 점을 무리 없이 반영합니다. ‘또한 참으로’보다 문두 접속사 et에 맞는 ‘그리고 참으로’가 자연스럽습니다.
  terminology: Altissimus는 ‘지극히 높으신 분’, lex는 ‘율법’, contemnere는 ‘멸시하다’로 유지할 수 있습니다. spreuere는 ‘버리다’도 가능하나, 대안 독법에서는 ‘멸시하다’로 일관되게 옮겼습니다. 기존 각주는 영어 POB 감사 기록의 대안 번역과 내용이 맞지 않으므로 바로잡아야 합니다.
