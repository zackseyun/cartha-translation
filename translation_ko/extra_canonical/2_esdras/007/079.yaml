id: 2ES.7.79
reference: 2 Esdras 7:79
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ad eum qui dedit adorare gloriam Altissimi primum. Et si quidem esset eorum qui spreuerunt et non seruauerunt uiam Altissimi, et eorum qui contempserunt legem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/079.yaml
  text: to him who gave it[a], to worship the glory of the Most High first of all. And if indeed it is one of those who have spurned and have not kept the way of the Most High, and of those who have despised the law,
  footnotes:
  - marker: a
    text: Or 'And if it is one of those who have shown contempt and have not kept the way of the Most High, and of those who have despised his law, and of those who hate those who fear him,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것을 주신 분께 나아가, 무엇보다 먼저 지극히 높으신 분의 영광을 경배합니다. 그리고 참으로 그것이 지극히 높으신 분의 길을 버리고 지키지 않은 자들과 율법을 멸시한 자들 가운데 하나라면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 만일 그것이 지극히 높으신 분의 길을 멸시하고 지키지 않은 자들 가운데 하나라면, 또 그분의 율법을 멸시한 자들 가운데 하나라면, 또 그분을 두려워하는 자들을 미워하는 자들 가운데 하나라면,’이라고 옮길 수 있습니다.
    reason: 영어 POB 감사 기록에 보존된 이전 번역의 대안을 정확히 반영하고, 이 절 단편 뒤에 이어지는 대안의 나머지 부분도 명시합니다.
lexical_decisions:
- source_word: ad eum qui dedit
  english_pob_choice: to him who gave it
  chosen_korean: 그것을 준 이에게는
  alternatives_korean:
  - 그것을 주신 이에게는
  - 그것을 준 사람에게는
  lexicon: dare
  rationale: 라틴어의 수여 대상을 직접 살려, ‘it’을 보충해 한국어에서도 지시 관계가 분명하게 드러나도록 했습니다.
- source_word: adorare gloriam Altissimi
  english_pob_choice: to worship the glory of the Most High
  chosen_korean: 지극히 높으신 분의 영광을 경배하게 하려는 것입니다
  alternatives_korean:
  - 지극히 높으신 분의 영광을 예배하게 하려는 것입니다
  - 지극히 높으신 분의 영광을 숭배하게 하려는 것입니다
  lexicon: adorare
  rationale: adorare는 단순한 존경보다 예배적 경배를 뜻하므로 ‘경배하다’를 택했고, ‘영광’을 목적어로 직접 유지했습니다.
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 이
  lexicon: Altissimus
  rationale: 하나님을 가리키는 칭호로서 자연스러운 현대 한국어 표현을 택하되, 기존 교회어보다 원어의 숭고한 호칭성을 유지했습니다.
- source_word: spreuerunt et non seruauerunt uiam Altissimi
  english_pob_choice: have spurned and have not kept the way of the Most High
  chosen_korean: 지극히 높으신 분의 길을 버리고 지키지 않은 자들
  alternatives_korean:
  - 지극히 높으신 분의 길을 업신여기고 지키지 않은 자들
  - 지극히 높으신 분의 길을 멸시하고 지키지 않은 자들
  lexicon: spuer/non servare viam
  rationale: spreuerunt를 단순한 인지적 태도보다 ‘버리다’로 옮겨 행위적 거절을 드러냈고, ‘길’을 그대로 살렸습니다.
- source_word: contempserunt legem
  english_pob_choice: have despised the law
  chosen_korean: 율법을 멸시한 자들
  alternatives_korean:
  - 율법을 업신여긴 자들
  - 율법을 경멸한 자들
  lexicon: contemnere + lex
  rationale: lex는 여기서 하나님의 율법을 가리키므로 관례적인 ‘율법’을 유지했고, contempt의 강한 경멸감을 ‘멸시하다’로 반영했습니다.
theological_decisions:
- issue: 본 구절이 7:78의 문장 잔여와 7:79의 시작이 이어진 라틴 본문 단편이라는 점
  chosen_reading: 주어진 라틴 문자열의 경계를 따르되, 한국어 본문은 자연스러운 문장 흐름을 위해 앞절 잔여를 포함한 상태로 옮겼습니다.
  alternative_readings:
  - 정식 절 경계에 맞춰 7:78/7:79를 분리하는 방식
  - 영어 POB처럼 표준 절 본문만 옮기고 잔여를 주석으로 돌리는 방식
  rationale: 제공된 source text가 절 경계와 어긋난 단편이므로, 본문 자체의 연속성을 우선해 번역하되 문장 종결은 열어 두었습니다.
  doctrine_reference: textual criticism / source-bound translation
