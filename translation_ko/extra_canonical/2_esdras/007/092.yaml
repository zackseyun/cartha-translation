  terminology: '"악한 생각" appropriately renders cogitamentum malum. "그들과 함께 빚어진" preserves the image of plasmatum but is somewhat opaque; "그들과 함께 만들어진" is more natural without adding theological interpretation. "안식" is appropriate for the eschatological repose in context.'
