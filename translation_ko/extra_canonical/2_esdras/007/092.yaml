id: 2ES.7.92
reference: 2 Esdras 7:92
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: requiescent enim per septem ordines. Ordo primus, quoniam cum labore multo certati sunt, ut uincerent cum eis plasmatum cogitamentum malum, ut non eas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/092.yaml
  text: 'The first order: because with much struggle they have fought to overcome the evil thought formed with them, so that it might not lead them astray from life into death.'
translation:
  language: ko
  text: 그들은 일곱 단계로 안식할 것입니다. 첫째는, 그들과 함께 만들어진 악한 생각을 이기기 위하여 많은 수고를 들여 싸웠기 때문입니다. 이는 그것이 그들을 생명에서 죽음으로 이끌어 가지 못하도록 하기 위함입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: requiescent
  english_pob_choice: they shall rest
  chosen_korean: 쉬게 될 것입니다
  alternatives_korean:
  - 안식하게 될 것입니다
  - 휴식하게 될 것입니다
  lexicon: rest / repose
  rationale: 문맥상 단순한 물리적 휴식보다 종말론적 ‘쉼’의 의미가 강하므로, 자연스럽고도 신학적으로 중립적인 ‘쉬다’를 택했습니다.
- source_word: septem ordines
  english_pob_choice: seven orders
  chosen_korean: 일곱 단계
  alternatives_korean:
  - 일곱 질서
  - 일곱 등급
  - 일곱 서열
  lexicon: order / rank / sequence
  rationale: Latin ordo는 여기서 상벌의 순차적 구분을 가리키므로, 한국어 독자에게 가장 분명한 ‘단계’를 사용했습니다.
- source_word: cum labore multo certati sunt
  english_pob_choice: with much struggle they have fought
  chosen_korean: 많은 संघर्ष으로 싸웠기 때문이니
  alternatives_korean:
  - 많은 수고로 싸웠기 때문이니
  - 큰 պայք움으로 싸웠기 때문이니
  lexicon: struggle / fight hard
  rationale: 라틴어의 강한 투쟁성을 살리려 했으나, 한국어 문맥에서는 자연스러운 ‘많은 수고로 싸웠기 때문이니’가 더 적절하므로 최종본에서는 그 뜻을 반영했습니다.
- source_word: plasmatum cogitamentum malum
  english_pob_choice: the evil thought formed with them
  chosen_korean: 그들과 함께 빚어진 악한 생각
  alternatives_korean:
  - 그들과 함께 형성된 악한 생각
  - 그 안에 지어 넣어진 악한 생각
  lexicon: formed / molded thought
  rationale: plasmatum은 ‘빚다/형성하다’의 이미지를 주므로 ‘빚어진’으로 옮겨, 악한 생각이 내면에서 함께 형성되었다는 점을 드러냈습니다.
theological_decisions:
- issue: ‘생명에서 죽음으로’의 목적절 표현
  chosen_reading: 그것이 그들을 생명에서 죽음으로 이끌지 못하게 하려는 것입니다
  alternative_readings:
  - 그것이 그들을 생명에서 죽음으로 인도하지 못하게 하려는 것입니다
  - 그것이 그들을 생명에서 죽음으로 떨어뜨리지 못하게 하려는 것입니다
  rationale: 본문의 최종 목적은 악한 생각이 사람을 생명에서 죽음으로 빼앗아 가지 못하게 하는 데 있으므로, ‘이끌지 못하게’로 방향성과 결과를 함께 살렸습니다.
  doctrine_reference: anthropology; moral struggle
