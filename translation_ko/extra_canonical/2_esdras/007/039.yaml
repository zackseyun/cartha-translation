lexical_decisions:
- source_word: die iudicii / Hic
  english_pob_choice: This is such a day
  chosen_korean: 심판의 날입니다
  alternatives_korean:
  - 이것은 그런 날입니다
  - 이 날은 그러합니다
  lexicon: die iudicii
  rationale: lat. die iudicii는 문맥상 단순한 날짜가 아니라 ‘심판의 날’이라는 사건성을 드러내므로, 문장의 첫머리에는 그 의미를 분명히 했습니다.
- source_word: Hic
  english_pob_choice: This
  chosen_korean: 이 날은
  alternatives_korean:
  - 그 날은
  - 이것은
  lexicon: hic
  rationale: hic는 근칭 지시사이므로 ‘그’가 아니라 ‘이’로 옮겨, 바로 눈앞에 제시하는 설명의 힘을 살렸습니다.
- source_word: neque solem neque lunam neque stellas
  english_pob_choice: neither sun nor moon nor stars
  chosen_korean: 해도 달도 별도 없습니다
  alternatives_korean:
  - 해도 달도 별도 없으며
  - 해도 달도 별도 존재하지 않습니다
  lexicon: neque...neque...neque
  rationale: 반복된 부정 구조를 한국어의 나열 부정으로 자연스럽게 살려, 세 천체가 모두 결여된 상태를 직접적으로 표현했습니다.
theological_decisions:
- issue: 심판의 날의 현장성
  chosen_reading: ‘이 날’로 옮겨 심판의 날이 추상적 개념이 아니라 지금 앞에 제시되는 구체적 날로 들리게 했습니다.
  alternative_readings:
  - ‘그 날’로 거리감을 두는 번역
  - ‘그런 날’로 성격만 설명하는 번역
  rationale: 라틴어 hic의 근칭성과 본문의 presentative 문법을 반영해, 심판의 날의 즉각성과 엄중함을 유지하는 것이 더 적절합니다.
  doctrine_reference: 종말론적 심판의 묘사
