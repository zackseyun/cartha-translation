  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixi: sic, domine. et dixit ad me: sic est et Israhel pars.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/010.yaml
  text: And I said[a], “So it is, Lord.” And he said to me, “So also is Israel’s portion.”
  footnotes:
  - marker: a
    text: Or 'And I said, “So it is, lord.” And he said to me, “So also is Israel’s portion.'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 말했습니다[a], “그렇습니다, 주님.” 그러자 그가 제게 말했습니다. “그렇듯 이스라엘의 몫도 그러합니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이전 영어 본문은 “lord”로 소문자였으나, 최신 개정은 직함에 맞게 “Lord”로 정정했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주여
  lexicon: Latin domine
  rationale: 직접 호칭이므로 한국어 예배체에서 자연스럽고 공손한 “주님”으로 옮겼습니다. English POB의 대문자 Lord는 호칭의 존대성을 반영합니다.
- source_word: sic est
  english_pob_choice: So it is
  chosen_korean: 그렇습니다
  alternatives_korean:
  - 그렇습니다, 주님
  - 그리하옵니다
  - 그렇사옵니다
  lexicon: Latin sic est
  rationale: 짧은 동의 표현을 현대 합쇼체의 간결한 응답으로 살렸습니다. 문장 전체의 의미를 훼손하지 않으면서도 구어적 응답감을 유지합니다.
- source_word: Israelh pars
  english_pob_choice: Israel’s portion
  chosen_korean: 이스라엘의 몫
  alternatives_korean:
  - 이스라엘의 분깃
  - 이스라엘의 분배
  - 이스라엘의 기업
  lexicon: Latin pars
  rationale: pars는 “몫/부분”의 뜻이 기본이므로, 문맥상 하나님의 정하신 배분을 암시하더라도 여기서는 원어의 직접적 의미를 살린 “몫”이 가장 자연스럽습니다. 전통적 “기업”은 해석을 앞세울 수 있어 보류했습니다.
theological_decisions:
- issue: 이스라엘의 pars를 신학적으로 어떻게 살릴지
  chosen_reading: “이스라엘의 몫”으로 두어, 분배·할당의 의미는 보이되 과도한 신학적 확장을 피했습니다.
  alternative_readings:
  - “이스라엘의 기업”
  - “이스라엘의 분깃”
  rationale: 이 절 자체는 짧은 응답과 선언으로 이루어져 있어, 후속 문맥의 신학을 여기서 미리 확정하기보다 라틴어 pars의 기본 의미를 보존하는 편이 원문 충실도에 맞습니다.
  doctrine_reference: 문맥 우선 원칙
