    reason: source_note
lexical_decisions:
- source_word: neque nubem
  english_pob_choice: neither cloud
  chosen_korean: 구름도
  alternatives_korean:
  - 구름도 아니고
  - 구름도 없고
  lexicon: nubem
  rationale: 열거 부정 구조를 자연스럽게 살리기 위해 ‘구름도’로 옮기되, 앞의 부정은 문맥상 반복되는 ‘도’로 처리했습니다.
- source_word: neque tonitruum, neque coruscationem
  english_pob_choice: nor thunder nor lightning
  chosen_korean: 천둥도, 번개도
  alternatives_korean:
  - 우레도, 번개도
  - 천둥도, 번쩍임도
  lexicon: tonitruum / coruscationem
  rationale: tonitruum은 자연스러운 표준어 ‘천둥’, coruscationem은 ‘번개’로 옮겨 시각적·청각적 대조를 살렸습니다.
- source_word: neque uentum, neque aquam
  english_pob_choice: neither wind nor water
  chosen_korean: 바람도, 물도
  alternatives_korean:
  - 바람도, 물도 아니고
  - 바람도, 물도 보이지 않으셨습니다
  lexicon: ventum / aquam
  rationale: source가 단순한 열거 부정이므로 핵심 명사들을 직접 대응시켰고, 한국어 문장성만 위해 마침말을 추가했습니다.
theological_decisions:
- issue: 후반부에 동작 주어가 암시된 서술 방식
  chosen_reading: 구체적 행위자명을 반복하지 않고 ‘그분은’으로 시작해 앞절의 맥락적 주어를 자연스럽게 이어 받았습니다.
  alternative_readings:
  - 주어를 생략해 ‘구름도…’로 시작
  - ‘그는’으로 직역
  rationale: 라틴어의 간결한 열거문을 한국어 문장으로 풀어도, 앞선 문맥의 인물을 가리키는 지시를 유지하는 것이 의미상 더 분명합니다.
  doctrine_reference: 문맥 지시 대명사의 자연스러운 한국어 처리
