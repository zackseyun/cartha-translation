lexical_decisions:
- source_word: habebit sicut ebdomada annorum
  english_pob_choice: For it will last like a week of years.
  chosen_korean: 이는 해마다 한 주간처럼 지속될 것입니다.
  alternatives_korean:
  - 이는 일곱 해의 한 주처럼 지속될 것입니다.
  - 이는 한 해 주간처럼 지속될 것입니다.
  lexicon: ebdomada annorum
  rationale: ebdomada annorum을 문자적으로 옮기되, 관용적으로는 ‘해마다 한 주간’이라는 시간 단위를 드러내어 지속 기간의 비유를 보존했습니다.
