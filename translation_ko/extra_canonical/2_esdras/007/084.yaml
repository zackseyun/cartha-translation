  text: testamentis Altissimi crediderunt. Quarta uia, considerabunt sibi in nouissimis repo-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/084.yaml
  text: 'The fourth way: they consider for themselves in the last times the torment laid up for them.'
translation:
  language: ko
  text: 「가장 높으신 분의 언약들을 믿었습니다. 넷째 길은, 마지막 때에 자신들을 위해 예비된 고통을 그들이 스스로 생각해 봅니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: testamentis는 문맥상 ‘약속들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: testamentis Altissimi
  english_pob_choice: They consider for themselves ...
  chosen_korean: 가장 높으신 분의 언약들을
  alternatives_korean:
  - 지존하신 분의 언약들을
  - 가장 높으신 이의 약속들을
  lexicon: Altissimi
  rationale: Altissimi는 문맥상 하나님의 칭호로 읽어 ‘가장 높으신 분’으로 옮기고, testamentis는 언약/약속의 범위가 있으나 여기서는 POB의 문맥에 맞게 ‘언약들’로 처리했습니다.
- source_word: crediderunt
  english_pob_choice: they consider
  chosen_korean: 믿었습니다
  alternatives_korean:
  - 믿었습니다/믿어 왔습니다
  - 신뢰했습니다
  lexicon: credere
  rationale: 라틴어 crediderunt는 기본적으로 ‘믿다’이므로, 영어 POB의 해석 문구보다 원문 의미를 반영해 신앙적 믿음으로 옮겼습니다.
- source_word: considerabunt sibi
  english_pob_choice: they consider for themselves
  chosen_korean: 자신들을 위해 … 스스로 생각해 봅니다
  alternatives_korean:
  - 스스로 헤아려 봅니다
  - 자기 자신을 위해 숙고합니다
  lexicon: considerare
  rationale: 반사대명사 sibi를 살려 ‘자신들을 위해/스스로’의 자기지시성을 드러냈고, considerabunt는 단순 인지가 아니라 숙고를 뜻해 ‘생각해 봅니다’로 자연스럽게 옮겼습니다.
- source_word: in nouissimis repo-
  english_pob_choice: in the last times the torment laid up for them
  chosen_korean: 마지막 때에 … 예비된 고통
  alternatives_korean:
  - 끝날에 … 쌓여 둔 고통
  - 마지막 때에 … 준비된 형벌
  lexicon: novissimis / reposita
  rationale: in nouissimis는 ‘마지막 때에’로 시간 부사를 살렸고, repo-는 이어지는 형용사적 수식의 절단된 형태로 보아 ‘예비된’으로 처리해 ‘쌓아 둠/간직함’의 수동성을 반영했습니다.
theological_decisions:
- issue: ‘언약들’로 볼지 ‘약속들’로 볼지
  chosen_reading: 본문의 testamentis는 하나님의 구원 역사와 연결된 언약적 약속으로 이해되어 ‘언약들’로 옮겼습니다.
  alternative_readings:
  - ‘약속들’로 옮겨 더 일반화할 수 있음
  rationale: 후기 라틴 본문의 신앙 고백적 어조를 고려하면, 단순한 일반 약속보다 하나님의 주권적 언약에 초점을 둔 번역이 원문 효과를 더 잘 보존합니다.
  doctrine_reference: 구약-신약 연속성, 하나님의 언약 신실하심
