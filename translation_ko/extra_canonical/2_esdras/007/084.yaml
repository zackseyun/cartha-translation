  terminology: Altissimi는 ‘지극히 높으신 분’이 한국어 성서 문체에서 자연스럽습니다. testamentis의 ‘언약들’은 가능한 번역이며, ‘약속들’ 대안은 각주로 유지할 수 있습니다. ‘고통’은 영어 감사본 및 문맥상 안전한 표현입니다.
