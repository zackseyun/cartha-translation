revisions:
- from: 「가장 높으신 분의 언약들을 믿었습니다. 넷째 길은, 마지막 때에 자신들을 위해 예비된 고통을 그들이 스스로 생각해 봅니다.」[a]
  to: 「지극히 높으신 분의 언약들[a]을 믿었습니다. 넷째 길은 이렇습니다. 그들은 마지막 때에 자기들을 위하여 예비되어 있는 고통을 숙고할 것입니다.」
  rationale: 문단 앞부분의 완료형 crediderunt는 ‘믿었습니다’로 유지했습니다. Quarta uia는 직역적 비유를 보존하되 한국어 목록 도입 문장으로 다듬었습니다. considerabunt의 미래형은 ‘숙고할 것입니다’로, sibi 및 이어지는 reposita(본문 절단부 repo-)가 나타내는 수혜 관계는 ‘자기들을 위하여 예비되어 있는’으로 옮겼습니다. 원문의 절단부가 남기는 세부 불확실성은 확대하지 않았으며, 영어 POB 감사본의 ‘torment laid up for them’과도 일치합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:39Z'
