id: 2ES.7.43
reference: 2 Esdras 7:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: claritatis Altissimi, unde omnes incipiant uidere quae anteposita sunt. Spatium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/043.yaml
  text: of the glory of the Most High[a], by which all will begin to see what has been set before them[b]. A period
  footnotes:
  - marker: a
    text: The Latin says the judgment-day span will be 'like a week of years' (sicut ebdomada annorum), an unusual temporal comparison. This may mean a period analogous to seven years rather than a literal ordinary week.
    reason: lexical_alternative
    anchor_ref: '7:43'
  - marker: b
    text: Or 'For it will last about'.
    reason: previous_rendering
translation:
  language: ko
  text: 지극히 높으신 분의 영광으로 말미암아, 그로써 모든 사람이 자기 앞에 놓인 것을 보기 시작하게 될 것입니다. 그 기간은[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 claritatis Altissimi는 ‘지극히 높으신 분의 영광’ 또는 ‘지존자의 광채’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: incipiant uidere는 “보기 시작하게 되다”라는 뜻이므로, 동작의 시작을 강조할 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: claritatis Altissimi
  english_pob_choice: of the glory of the Most High
  chosen_korean: 지극히 높으신 분의 영광
  alternatives_korean:
  - 가장 높으신 분의 영광
  - 지존자의 영광
  lexicon: claritas → 영광; Altissimus → 지극히 높으신 분
  rationale: 라틴어 claritatis는 ‘영광/광채’의 의미를 가지므로, 하나님의 초월성과 위엄을 살려 ‘지극히 높으신 분의 영광’으로 옮겼습니다.
- source_word: unde omnes incipiant uidere
  english_pob_choice: by which all will begin to see
  chosen_korean: 그로써 모든 사람이 … 보기 시작하게 될 것입니다
  alternatives_korean:
  - 그것으로 모든 사람이 … 보기 시작할 것입니다
  - 그로 인해 모든 사람이 … 보게 될 것입니다
  lexicon: unde → 그로써/그로 인해; incipiant uidere → 보기 시작하다
  rationale: unde의 원인·수단 관계를 살려 ‘그로써’로 옮기고, incipiant는 완료적 ‘보게 된다’보다 시작 동작을 드러내는 ‘보기 시작하게 됩니다’로 처리했습니다.
- source_word: quae anteposita sunt
  english_pob_choice: what has been set before them
  chosen_korean: 자기 앞에 놓인 것
  alternatives_korean:
  - 그들 앞에 놓인 것
  - 미리 마련된 것
  lexicon: antepono → 앞에 놓다
  rationale: anteposita sunt는 단순한 ‘존재’가 아니라 ‘앞에 놓인 상태’를 가리키므로, 심판 앞에 제시된 대상이라는 이미지를 보존해 번역했습니다.
- source_word: Spatium
  english_pob_choice: A period
  chosen_korean: 그 기간은
  alternatives_korean:
  - 한 시기입니다
  - 그 때는
  lexicon: spatium → 기간/시간의 간격
  rationale: 문맥상 뒤이어 시간 길이를 설명하는 도입부이므로, 아직 미완성으로 남아 있는 단어를 한국어에서도 문장 마침 없이 ‘그 기간은’으로 처리했습니다.
theological_decisions:
- issue: apocalyptic time period as a determinate span
  chosen_reading: ‘기간’으로 두되, 추정적 완화어를 넣지 않고 개시 표현을 유지했습니다.
  alternative_readings:
  - ‘대략’으로 완화
  - ‘약간의 시간’으로 일반화
  rationale: English POB audit trail이 ‘about’에서 벗어나 정확한 종말론적 시간 구성을 회복하도록 수정했으므로, 한국어도 불확정성을 덧씌우지 않고 정해진 기간의 뉘앙스를 유지했습니다.
  doctrine_reference: 종말론적 심판 시기의 확정성
- issue: fragmentary verse ending
  chosen_reading: 마지막 단어 Spatium을 반영해 문장을 미완결로 남겼습니다.
  alternative_readings:
  - 완결된 한국어 문장으로 보완
  - 생략 부호로 처리
  rationale: 제공된 라틴어가 절의 끝에서 끊기므로, 번역도 인위적으로 완결하지 않고 단락의 절단을 드러냈습니다.
  doctrine_reference: 본문 비평 및 단편 보존 원칙
