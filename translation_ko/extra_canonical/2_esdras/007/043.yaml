  source_fidelity: 라틴어 단편의 핵심 표현은 대체로 충실합니다. claritatis Altissimi는 ‘지극히 높으신 분의 영광’, unde omnes incipiant uidere는 ‘그로 말미암아 모든 이가 … 보기 시작할 것입니다’, quae anteposita sunt는 ‘그들 앞에 놓인 것들’로 자연스럽게 반영됩니다. 다만 quae가 복수이므로 ‘것들’이 더 직접적입니다. Spatium은 제공된 본문 자체가 다음 내용으로 이어지는 단편이므로 ‘그 기간은’으로 미완결 처리하는 것이 적절합니다.
