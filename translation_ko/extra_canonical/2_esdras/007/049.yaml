  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non paucos, sed pene omnes
  english_pob_choice: Not a few, but nearly all
  chosen_korean: 적은 수가 아니라… 거의 모두
  alternatives_korean:
  - 적지 않은 사람들이 아니라… 거의 모든 사람
  - 몇몇이 아니라… 거의 모두
  lexicon: pene
  rationale: 라틴어 대조 구조를 살려 단순한 다수 표현보다 ‘적은 수가 아니라’라는 대비와 ‘거의 모두’라는 범위를 함께 드러냈습니다.
- source_word: qui creati sunt
  english_pob_choice: who have been created
  chosen_korean: 창조된 자들
  alternatives_korean:
  - 지음받은 자들
  - 창조된 이들
  lexicon: creare
  rationale: 피조 존재라는 상태를 분명히 하기 위해 수동 의미를 살린 ‘창조된 자들’을 택했습니다.
- source_word: Et respondit ad me et dixit
  english_pob_choice: And he answered me and said
  chosen_korean: 그가 나에게 대답하며 말했습니다
  alternatives_korean:
  - 그가 나에게 대답하여 말했습니다
  - 그가 나에게 응답하며 말했습니다
  lexicon: respondere
  rationale: 대화의 자연스러운 흐름을 유지하되, 라틴어의 두 동사 연쇄를 평이한 서술로 옮겼습니다.
- source_word: audi
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어 보십시오
  - 들으라
  lexicon: audire
  rationale: 직접 화법의 명령형을 현대 합쇼체 명령으로 옮겨, 이어질 발화의 권위와 대화 상대의 호칭을 살렸습니다.
