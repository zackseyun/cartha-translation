id: 2ES.7.105
reference: 2 Esdras 7:105
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eo intellegat, aut dormiat, aut manducet, aut curetur; Sic nunquam nemo pro aliquo rogabit, omnes enim portabunt unusquisque tunc iniustitias suas aut iustitias.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/105.yaml
  text: or a friend who is most dear[a], that he may understand, or sleep, or eat, or be healed for him; so no one will ever pray for another, for all will then bear, each one, his own unrighteousnesses or righteousnesses.”
  footnotes:
  - marker: a
    text: Or 'so no one will ever then pray for another, but each will bear his own unrighteousnesses or righteousnesses.'.
    reason: previous_rendering
translation:
  language: ko
  text: 또는 가장 사랑하는 친구가 그를 위하여 이해하거나 잠들거나 먹거나 치료받게 하려고 말입니다. 그러므로 아무도 다른 사람을 위하여 결코 기도하지 않을 것입니다. 그때에는 모두가 각자 자신의 불의와 의를 짊어질 것이기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그때에는 아무도 다른 사람을 위하여 더 이상 기도하지 않을 것이며, 각 사람은 자기 자신의 불의와 의를 짊어질 것이다.’
    reason: 이전 번역을 기록한 영어 POB 감사 추적의 대안 표현을 보존합니다.
lexical_decisions:
- source_word: aut dormiat, aut manducet, aut curetur
  english_pob_choice: that he may understand, or sleep, or eat, or be healed for him
  chosen_korean: 그가 이해하거나, 잠들거나, 먹거나, 그를 위해 치료를 받게 하십시오
  alternatives_korean:
  - 그가 깨닫거나, 잠들거나, 먹거나, 그를 위해 치유를 받게 하십시오
  - 그가 알거나, 잠들거나, 먹거나, 치료받게 하십시오
  lexicon: intelligere / dormire / manducare / curare
  rationale: lat. `aut ... aut ... aut ...`의 병렬을 유지해 동작들의 나열로 옮겼고, `curetur`는 수동의 '치료를 받다'로 처리해 ‘그를 위해’라는 목적 관계를 살렸습니다.
- source_word: pro aliquo rogabit
  english_pob_choice: no one will ever pray for another
  chosen_korean: 아무도 다른 사람을 위해서는 결코 기도하지 않을 것입니다
  alternatives_korean:
  - 아무도 누구를 위해서도 기도하지 않을 것입니다
  - 아무도 남을 위해 기도하지 않을 것입니다
  lexicon: rogare pro
  rationale: '`rogabit pro`의 중보적 의미를 그대로 ‘~을/를 위해 기도하다’로 살렸고, 문맥상 부정의 범위를 분명히 하기 위해 ‘결코’와 ‘아무도’를 유지했습니다.'
- source_word: omnes enim portabunt unusquisque tunc iniustitias suas aut iustitias
  english_pob_choice: for all will then bear, each one, his own unrighteousnesses or righteousnesses
  chosen_korean: 그때에는 모두가 각자 자신의 불의들과 의들을 짊어질 것이기 때문입니다
  alternatives_korean:
  - 그때에는 모든 사람이 각자 자신의 불의들과 의들을 지게 될 것이기 때문입니다
  - 그때에는 모두가 저마다 자신의 불의와 의를 감당할 것이기 때문입니다
  lexicon: portare / iniustitias / iustitias
  rationale: '`enim`을 이유를 나타내는 ‘-기 때문입니다’로, `portabunt`를 장래의 책임 부담을 드러내는 ‘짊어지다’로 옮겼습니다. 복수형 `iniustitias`와 `iustitias`도 그대로 반영했습니다.'
- source_word: iustitias
  english_pob_choice: righteousnesses
  chosen_korean: 의들을
  alternatives_korean:
  - 의
  - 의로운 행실들
  lexicon: iustitia
  rationale: 라틴어 복수형을 반영해 단수를 평탄화하지 않았습니다. 이 절은 각 사람이 자기 행위/상태에 따라 책임을 진다는 대비를 보존하는 것이 중요합니다.
theological_decisions:
- issue: 중보기도의 불가능성 선언
  chosen_reading: 장차 심판에서는 ‘다른 사람을 위해 기도하는’ 중보가 더 이상 작동하지 않는다고 분명히 말합니다.
  alternative_readings:
  - 그때에는 공동체적 중보가 제한된다는 뜻
  - 기도의 효력 상실에 대한 과장법
  rationale: 라틴어 `pro aliquo rogabit`와 `omnes enim portabunt...`의 인과관계가 심판의 개별 책임을 근거로 중보 불가능성을 설명합니다. 따라서 완곡화하지 않고 문맥 그대로 유지했습니다.
  doctrine_reference: 개별 책임과 최종 심판에 대한 외경 본문 해석
- issue: ‘불의들과 의들’의 병렬
  chosen_reading: 각 사람은 자신의 불의들과 의들을 함께 짊어진다고 옮겨, 도덕적 책임의 총체성을 드러냈습니다.
  alternative_readings:
  - 불의만 짊어진다
  - 의만 짊어진다
  rationale: 원문은 `iniustitias suas aut iustitias`로 불의와 의를 모두 병렬로 제시합니다. 이 긴장을 없애지 않고 그대로 보존했습니다.
  doctrine_reference: 행위에 따른 책임과 심판의 병렬성
