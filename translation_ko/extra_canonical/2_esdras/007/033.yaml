source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et revelabitur Altissimus super sedem iudicii, et pertransibunt misericordiae, et longanimitas congregabitur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/033.yaml
  text: And the Most High will be revealed upon the seat of judgment[a], and mercies will pass away, and long-suffering will be gathered up,
  footnotes:
  - marker: a
    text: Or 'long-suffering will be gathered up'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 지극히 높으신 분이 심판의 자리에 나타나실 것이며, 긍휼은 지나가고, 오래 참으심은 거두어질 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거두어질 것입니다’는 라틴어 congregabitur를 문맥상 ‘거둬들여지다/회수되다’의 뜻으로 살린 번역입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: 하나님
  rationale: 라틴어의 신칭을 고유명사화하지 않고 위엄을 드러내는 호칭으로 옮기기 위해, 한국어에서 자연스러운 경어적 표현인 ‘지극히 높으신 분’을 택했습니다.
- source_word: sedem iudicii
  english_pob_choice: the seat of judgment
  chosen_korean: 심판의 자리
  alternatives_korean:
  - 심판의 보좌
  - 재판석
  lexicon: 보좌/자리
  rationale: sedes/iudicii는 통치적·재판적 좌소를 가리키므로, 과도하게 교회적 이미지를 띤 ‘보좌’보다 본문 기능이 드러나는 ‘자리’가 더 직접적입니다.
- source_word: misericordiae
  english_pob_choice: mercies
  chosen_korean: 긍휼
  alternatives_korean:
  - 자비
  - 자비들
  lexicon: 긍휼
  rationale: 복수형이지만 한국어에서는 추상명사로 자연스럽게 처리하는 것이 의미를 보존합니다. ‘긍휼’은 하나님의 자비로운 행위가 종료되는 대비를 선명하게 합니다.
- source_word: longanimitas congregabitur
  english_pob_choice: long-suffering will be gathered up
  chosen_korean: 오래 참으심은 거두어질 것입니다
  alternatives_korean:
  - 오래 참으심은 모아질 것입니다
  - 오래 참음은 거둬질 것입니다
  lexicon: 인내/오래 참음
  rationale: POB의 audited English는 의미를 분명히 하기 위해 ‘gathered up’의 문자적 느낌을 유지하면서도, 문맥상 하나님의 유예가 끝나는 뉘앙스를 한국어 ‘거두어지다’로 살렸습니다.
theological_decisions:
- issue: eschatological cessation of divine patience
  chosen_reading: ‘오래 참으심은 거두어질 것입니다’로 옮겨, 하나님의 오래 참으심이 계속되는 것이 아니라 마감되는 종말론적 전환을 드러냈습니다.
  alternative_readings:
  - ‘오래 참으심은 모아질 것입니다’
  - ‘오래 참으심이 축적될 것입니다’
  rationale: 라틴어 congregabitur는 단순한 집합보다 ‘회수/거둠’의 종결감을 줄 수 있으며, audit trail도 그 의미를 둘러싼 판정을 보여 줍니다. 본문 맥락상 심판의 도래와 병행되므로 종료의 의미를 살리는 것이 합당합니다.
  doctrine_reference: 종말론적 심판과 하나님의 인내의 한계 표현
