id: 2ES.7.72
reference: 2 Esdras 7:72
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Qui ergo commorantes sunt in terra, hinc cruciabuntur, quoniam sensum habentes iniquitatem fecerunt, et mandata accipientes non seruauerunt ea, et legem consecuti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/072.yaml
  text: Therefore those who dwell on the earth will be tormented for this reason, because though they had understanding they committed iniquity, and though they received commandments they did not keep them, and though they obtained the law they dealt deceitfully with it.
translation:
  language: ko
  text: 그러므로 땅에 사는 자들은 이 일로 인해 고통을 받게 될 것입니다. 그들은 깨달음을 가지고도 불의를 행하였고, 계명들을 받고도 그것을 지키지 않았으며, 율법을 얻고도 그것을 속여 다루었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 절의 라틴어는 문자적으로는 “율법을 얻고도 그것을 속여 다루었다”에 가깝습니다. 영어 POB의 “dealt deceitfully with it”는 이 의미를 간명하게 정리한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: Qui ergo commorantes sunt in terra
  english_pob_choice: those who dwell on the earth
  chosen_korean: 땅에 사는 자들
  alternatives_korean:
  - 땅 위에 거하는 자들
  - 땅에 거주하는 자들
  lexicon: commorari
  rationale: 지속적으로 거주하는 뜻을 살리되, 현대 한국어에서 자연스럽고 장중한 표현인 ‘땅에 사는 자들’로 옮겼습니다.
- source_word: hinc cruciabuntur
  english_pob_choice: will be tormented for this reason
  chosen_korean: 이 일로 인해 고통을 받게 될 것입니다
  alternatives_korean:
  - 그러므로 고통을 당하게 될 것입니다
  - 이로 말미암아 고통받게 될 것입니다
  lexicon: cruciare
  rationale: 원문의 결과 관계를 보존하면서, 형벌적 고통의 뉘앙스를 무리 없이 드러내기 위해 ‘고통을 받게 될 것입니다’로 번역했습니다.
- source_word: sensum habentes
  english_pob_choice: though they had understanding
  chosen_korean: 깨달음을 가지고도
  alternatives_korean:
  - 이해력을 가지고도
  - 분별력을 지니고도
  lexicon: sensum
  rationale: 단순 지적 능력보다 도덕적·영적 인식을 포함하는 넓은 의미를 살려 ‘깨달음’으로 옮겼습니다.
- source_word: mandata accipientes ... legem consecuti
  english_pob_choice: though they received commandments ... though they obtained the law
  chosen_korean: 계명들을 받고도 ... 율법을 얻고도
  alternatives_korean:
  - 명령들을 받고도 ... 법을 얻고도
  - 계명을 받아 ... 율법에 이르렀고도
  lexicon: mandatum, lex
  rationale: 복수 ‘mandata’는 구체적 계명들로, ‘lex’는 POB 기본 용례에 따라 ‘율법’으로 구분해 살렸습니다.
theological_decisions:
- issue: final clause sense of dealing deceitfully with the law
  chosen_reading: 율법을 얻고도 그것을 속여 다루었습니다
  alternative_readings:
  - 율법을 얻고도 그것을 배반하였습니다
  - 율법을 얻고도 그것을 기만하였습니다
  rationale: 라틴어 ‘non servauerunt ea, et legem consecuti’의 비순종과 위선적 취급을 함께 반영하기 위해, 단순 불순종보다 더 강한 ‘속여 다루다’로 옮겼습니다.
  doctrine_reference: 성경의 율법-불순종 주제
- issue: generic judgment formulation
  chosen_reading: 고통을 받게 될 것입니다
  alternative_readings:
  - 고문을 당하게 될 것입니다
  - 형벌을 받게 될 것입니다
  rationale: cruciabuntur의 강한 형벌성은 유지하되, 본문이 지시하는 종말론적 심판을 한국어에서 지나치게 물리적 고문으로 한정하지 않기 위해 ‘고통’으로 절제했습니다.
  doctrine_reference: 종말론적 심판
