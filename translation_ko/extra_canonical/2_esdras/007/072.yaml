    text: 제시된 라틴어 본문은 여기서 “율법을 얻고”(legem consecuti)라는 말 뒤에 끝납니다. 마지막 행위는 영어 POB 감사 문구의 “dealt deceitfully with it”에 따라 옮겼습니다.
    reason: source_note
  revision_rationale: 마지막 절을 자연스러운 현대 한국어로 바로잡고, 제공된 라틴어 인용이 문장 끝에서 잘려 있는 점을 각주에서 투명하게 밝혔습니다. 본문의 의미와 심판·율법 관련 용어는 유지했습니다.
