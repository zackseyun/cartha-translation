  to: 두 번째 부류는 불경건한 자들의 영혼이 헤매는 얽힌 상태[a]와 그들을 기다리는 형벌을 보기 때문입니다.
  rationale: 원문의 열거 형식과 인과 관계를 유지하되, 한국어에서 자연스러운 ‘두 번째 부류’와 ‘얽힌 상태’를 사용했습니다. ‘얽힌 상태’는 영혼들이 그 안에서 헤맨다는 원문의 공간적 이미지를 보존하며, 형벌의 대상은 대명사를 풀어 ‘그들을’로 명료하게 했습니다.
