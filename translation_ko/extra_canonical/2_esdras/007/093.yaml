translation:
  language: ko
  text: 두 번째 부류는 불경건한 자들의 영혼이 헤매는 얽힌 상태[a]와 그들을 기다리는 형벌을 보기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘혼란’.
    reason: 라틴어 complicatio는 ‘얽힘, 복잡하게 얽힌 상태’를 가리키며, 문맥에 따라 ‘혼란’으로도 옮길 수 있습니다.
lexical_decisions:
- source_word: Secundus ordo
  english_pob_choice: The second order
  chosen_korean: 둘째 순서는
  alternatives_korean:
  - 두 번째 질서는
  - 둘째 무리는
  lexicon: ordo
  rationale: 문맥상 단순한 순번이 아니라 여러 ‘순서/부류’ 가운데 둘째를 가리키므로, 직역에 가깝게 ‘둘째 순서’로 옮겼습니다.
- source_word: complicationem
  english_pob_choice: entanglement
  chosen_korean: 얽힘
  alternatives_korean:
  - 혼란
  - 복잡함
  - 얽힘의 상태
  lexicon: complicatio
  rationale: 라틴어 complicationem은 ‘fold together’ 계열의 의미로, 단순한 심리적 ‘혼란’보다 서로 얽혀 길을 잃게 되는 상태를 드러내므로 ‘얽힘’으로 렌더링했습니다.
- source_word: uagantur
  english_pob_choice: wander
  chosen_korean: 헤매는
  alternatives_korean:
  - 방황하는
  - 떠도는
  lexicon: vagari
  rationale: 영혼들이 그 안에서 방향 없이 움직이는 동작을 살려 ‘헤매는’으로 옮겼습니다.
- source_word: animae impiorum
  english_pob_choice: the souls of the ungodly
  chosen_korean: 경건하지 않은 사람들의 영혼
  alternatives_korean:
  - 악인들의 영혼
  - 불경건한 자들의 영혼
  lexicon: anima / impius
  rationale: impiorum은 단순한 도덕 일반보다 하나님을 경외하지 않는 부류를 가리키므로, 한국어에서 의미를 비교적 직접적으로 드러내는 ‘경건하지 않은 사람들’로 옮겼습니다.
theological_decisions:
- issue: 형벌의 시간성
  chosen_reading: 그들에게 기다리고 있는 형벌
  alternative_readings:
  - 그들을 기다리는 형벌
  - 다가올 형벌
  rationale: 라틴어 문맥의 미래적 긴장감을 살려, 이미 예비되어 앞으로 닥칠 형벌이라는 뉘앙스를 드러냈습니다.
  doctrine_reference: eschatology
