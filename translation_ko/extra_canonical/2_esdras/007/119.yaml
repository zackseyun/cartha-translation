source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid enim nobis prodest, si promissum est nobis inmortale tempus, nos vero mortalia opera egimus?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/119.yaml
  text: For what does it profit us if an immortal age has been promised to us, but we have done mortal works?
translation:
  language: ko
  text: 우리에게 불멸의 시대가 약속되었는데도 우리가 필멸의 행위들을 했다면, 그것이 우리에게 무슨 유익이 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid enim nobis prodest
  english_pob_choice: For what does it profit us
  chosen_korean: 그것이 우리에게 무슨 유익이 있겠습니까
  alternatives_korean:
  - 우리에게 무슨 소용이 있겠습니까
  - 우리에게 무슨 이익이 있겠습니까
  lexicon: prodesse
  rationale: 수사적 질문의 이익/유익 의미를 살리되, 문맥상 단순한 경제적 이익보다 존재론적·윤리적 ‘유익’이 더 자연스럽습니다.
- source_word: inmortale tempus
  english_pob_choice: an immortal age
  chosen_korean: 불멸의 시대
  alternatives_korean:
  - 죽지 않는 때
  - 불멸의 시간
  lexicon: inmortalis + tempus
  rationale: tempus를 단순한 ‘시간’보다 종말론적 기간/시대로 읽는 POB의 취지를 반영했고, inmortale의 핵심인 ‘불멸’은 직접적으로 옮겼습니다.
- source_word: mortalia opera
  english_pob_choice: mortal works
  chosen_korean: 죽을 것 같은 행위들
  alternatives_korean:
  - 죽을 수밖에 없는 일들
  - 필멸의 행위들
  lexicon: mortalis + opera
  rationale: opera의 ‘행위/일’과 mortalia의 ‘필멸성’을 살리되, 현대 한국어에서 어색한 직역을 피하면서도 덧없는 인간 행위라는 대비를 드러냈습니다.
theological_decisions:
- issue: immortal age vs. mortal works의 종말론적 대비
  chosen_reading: 약속된 불멸의 시대와 인간의 필멸적 행위 사이의 모순을 수사적 질문으로 제시합니다.
  alternative_readings:
  - 불멸의 시간이 약속되었으나 우리가 죽을 수밖에 없는 일들을 했다
  - 영원한 시대가 약속되었는데도 우리가 필멸의 일을 했다
  rationale: 본문은 결론을 설명하기보다 ‘무슨 유익이 있겠습니까?’라는 탄식형 질문으로 청중이 약속과 행위의 불일치를 스스로 판단하게 합니다.
  doctrine_reference: 종말론적 책임과 인간 행위의 덧없음
