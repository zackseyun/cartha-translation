  source_fidelity: ‘죽을 것 같은 행위들’은 mortalia opera(‘필멸의 행위들/죽을 수밖에 없는 일들’)의 뜻을 정확히 전달하지 못합니다. 원문은 행위가 ‘죽을 듯해 보인다’는 뜻이 아니라, 약속된 불멸의 시대와 대조되는 필멸적 성격의 행위들을 가리킵니다.
