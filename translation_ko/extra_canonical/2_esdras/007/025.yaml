  terminology: ‘빈 것들’과 ‘가득 찬 것들’은 vacua/plena의 반복 및 중성 복수의 비인칭적·포괄적 표현을 보존합니다. 해석적으로 ‘빈 자들/가득 찬 자들’로 좁히지 않았습니다.
  issues:
