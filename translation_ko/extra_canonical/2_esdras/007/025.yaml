    rationale: 원문은 단순히 Ezra라고 직접 부를 뿐 존칭을 표시하지 않습니다. ‘님’은 한국어의 현대적 경칭 관계를 추가하며, 직접 호명에는 ‘에스라야’가 더 자연스럽고 원문에 가깝습니다.
  - severity: low
    issue: ‘속합니다’
    rationale: 라틴어는 동사가 생략된 ‘빈 것들은 빈 것들을 위한 것’이라는 대구입니다. ‘속하다’는 소유·귀속 관계로 의미를 구체화할 수 있으므로 ‘위한 것입니다’가 영어 감사본과 원문의 관계를 더 직접적으로 드러냅니다.
