lexical_decisions:
- source_word: propter hoc
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 따라서
  lexicon: Latin propter hoc
  rationale: 원인의 연결을 분명히 드러내는 가장 자연스러운 현대 문어 표현으로 옮겼습니다.
- source_word: Ezra
  english_pob_choice: Ezra
  chosen_korean: 에스라님
  alternatives_korean:
  - 에스라
  lexicon: 고유명사
  rationale: 호명형이므로 직접 호칭을 살려 에스라님으로 옮겼습니다. 다만 한국어 본문에서는 과도한 친밀감을 피하기 위해 존칭을 붙였습니다.
- source_word: vacua vacuis et plena plenis
  english_pob_choice: empty things are for the empty, and full things for the full
  chosen_korean: 빈 것들은 빈 것들에게, 가득 찬 것들은 가득 찬 것들에게
  alternatives_korean:
  - 빈 것들은 빈 자들에게, 가득 찬 것들은 가득 찬 자들에게
  - 비어 있는 것은 비어 있는 것에게, 충만한 것은 충만한 것에게
  lexicon: vacua / plena 반복 대구
  rationale: 라틴어의 반복적 대구를 유지해 대조를 선명하게 드러냈고, 사물 일반을 가리키는 중성적 표현으로 ‘것들’을 택했습니다.
theological_decisions:
- issue: 격언적 대조문의 함의
  chosen_reading: 이 문장은 도덕적 규범이라기보다 ‘빈 자/가득 찬 자’의 상태에 따른 적합성의 진술로 읽었습니다.
  alternative_readings:
  - 재판적 분배 원리
  - 영적 상태에 따른 종말론적 배분
  rationale: 라틴어 본문과 영어 POB가 모두 단순한 대구적 진술을 유지하므로, 과도한 신학적 해석을 덧붙이지 않았습니다.
  doctrine_reference: 문맥 보존과 최소 해석 원칙
