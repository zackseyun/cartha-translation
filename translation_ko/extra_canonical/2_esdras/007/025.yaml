  source_fidelity: 라틴어의 대구 구조와 ‘for’(여격)의 관계는 대체로 반영되었으나, ‘에스라님’의 존칭은 원문에 없는 사회적 위계를 더하며 직접 호명으로는 자연스럽지 않습니다. 또한 ‘속합니다’는 원문의 생략된 계사보다 소유·귀속의 의미를 다소 강하게 한정합니다.
