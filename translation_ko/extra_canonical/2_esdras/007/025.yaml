  language: ko
  text: 그러므로, 에스라님, 빈 것들은 빈 것들에게, 가득 찬 것들은 가득 찬 것들에게 속합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직접 호명형을 살리기 위해 이름에 존칭을 붙였습니다.
