id: 2ES.7.6
reference: 2 Esdras 7:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'item aliud: civitas est aedificata et posita in loco campestri, est autem plena omnium bonorum.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/006.yaml
  text: 'Again, another example: a city is built and set in a plain, and it is full of every good thing.'
translation:
  language: ko
  text: 또 다른 예가 있습니다. 한 성읍이 세워져 평지에 자리 잡고 있으며, 온갖 좋은 것으로 가득합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: item aliud
  english_pob_choice: Again, another example
  chosen_korean: 또 다른 예가 있습니다
  alternatives_korean:
  - 다시 다른 예가 있습니다
  - 또 하나의 예가 있습니다
  lexicon: source_note
  rationale: item aliud는 앞의 논지를 이어 가는 연결 표현으로, English POB의 ‘Again, another example’에 맞추어 자연스럽게 ‘또 다른 예’로 옮겼습니다.
- source_word: civitas
  english_pob_choice: a city
  chosen_korean: 한 성읍
  alternatives_korean:
  - 한 도시
  - 한 성
  lexicon: source_note
  rationale: civitas는 여기서 단순한 행정 도시보다 공동체가 모인 ‘성읍’이 더 직접적이므로, 서술의 뉘앙스를 살려 옮겼습니다.
- source_word: aedificata et posita
  english_pob_choice: is built and set
  chosen_korean: 세워져 놓여 있고
  alternatives_korean:
  - 세워지고 놓여 있고
  - 건축되어 자리 잡고 있고
  lexicon: source_note
  rationale: aedificata et posita의 두 동작을 한국어에서 중복 없이 살리기 위해 ‘세워져 놓여 있고’로 처리하여, 건축됨과 배치됨을 함께 드러냈습니다.
- source_word: in loco campestri
  english_pob_choice: in a plain
  chosen_korean: 평지에
  alternatives_korean:
  - 들판에
  - 평야에
  lexicon: source_note
  rationale: loco campestri는 높낮이의 차가 없는 평탄한 장소를 뜻하므로, 직역성과 자연스러움을 함께 고려해 ‘평지’로 옮겼습니다.
- source_word: plena omnium bonorum
  english_pob_choice: full of every good thing
  chosen_korean: 모든 좋은 것으로 가득합니다
  alternatives_korean:
  - 온갖 좋은 것으로 가득합니다
  - 모든 선한 것으로 가득합니다
  lexicon: source_note
  rationale: bonorum은 일반적인 ‘좋은 것들’의 총체를 가리키므로, 도덕적 의미를 과도하게 좁히지 않는 ‘좋은 것’으로 번역했습니다.
