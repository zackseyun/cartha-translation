  to: 주님 앞에서, 주님, 주님의 종에게 보여 주십시오. 죽은 뒤에든지, 아니면 지금 우리 각자가 자기 영혼을 내어 줄 때든지, 우리가 보존된다면 우리가 쉼 속에서 반드시 보존될 것인지, …까지
