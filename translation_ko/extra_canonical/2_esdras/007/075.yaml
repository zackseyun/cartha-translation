id: 2ES.7.75
reference: 2 Esdras 7:75
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: coram te, domine, demonstra, domine, seruo tuo, si post mortem uel nunc quando reddimus unusquisque animam suam, si conseruati conseruabimur in requie, donec
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/075.yaml
  text: Before you[a], Lord, show your servant, Lord, whether after death, or now when each of us gives up his soul, whether, if we are kept, we will be kept in rest until
  footnotes:
  - marker: a
    text: Or 'are we kept'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님 앞에서, 주님, 주님의 종에게 보여 주십시오. 죽은 뒤에든지, 아니면 지금 우리 각자가 자기 영혼을 내어 줄 때든지, 우리가 보존된다면 우리가 쉼 속에서 반드시 보존될 것인지, …까지
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram te
  english_pob_choice: Before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 당신 앞에서
  lexicon: coram + te
  rationale: 면전/앞에서의 관계를 살리되, 기도문 흐름에 맞게 자연스러운 ‘주님 앞에서’로 옮겼습니다.
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: domine
  rationale: 호격의 예배적 어조를 살리면서 현대 합쇼체에 맞는 ‘주님’으로 일관되게 처리했습니다.
- source_word: seruo tuo
  english_pob_choice: your servant
  chosen_korean: 주님의 종
  alternatives_korean:
  - 주님의 노예
  - 주님의 일꾼
  lexicon: seruus
  rationale: 문맥상 종속된 신분을 나타내지만, 이 절의 간청 어조에서는 한국어 성경의 자연스러운 ‘종’이 적절합니다.
- source_word: conseruati conseruabimur in requie
  english_pob_choice: if we are kept, we will be kept in rest
  chosen_korean: 우리가 보존된다면, 우리가 쉼 가운데서 반드시 보존될지
  alternatives_korean:
  - 우리가 지켜진다면, 우리는 쉼 가운데서 지켜질지
  - 우리가 보존되어 있으면, 우리는 안식 가운데서 보존될지
  lexicon: conseruare / requies
  rationale: conseruati conseruabimur의 강조된 반복을 ‘보존된다면… 반드시 보존될지’로 옮겨, 미래적 확정성과 조건 구조를 함께 살렸습니다. requies는 단순 휴식보다 종말론적 ‘쉼’이 자연스러워 ‘쉼 가운데서’로 표현했습니다.
theological_decisions:
- issue: 불완전한 절말 처리
  chosen_reading: 문장이 원문처럼 ‘until’에서 끝나는 미완성 구조를 유지했습니다.
  alternative_readings:
  - 의미를 보충해 완결된 문장으로 매끈하게 마무리하기
  - 문장부호 없이 끊긴 형태를 그대로 두기
  rationale: 제공된 라틴 본문이 절말에서 끊기므로, 의미 보충을 피하고 미완성성을 드러내는 것이 स्रोत 충실도에 더 부합합니다.
  doctrine_reference: 본문 비평 및 번역 충실성
- issue: conseruati conseruabimur의 강조
  chosen_reading: 반복 구조를 단순 현재형이 아니라 ‘반드시 보존될지’로 강화했습니다.
  alternative_readings:
  - 단순히 ‘보존될지’로 처리하기
  - ‘계속 보존될지’로 완화하기
  rationale: 검토본이 지적한 대로 라틴어의 분사+미래는 강조를 띠므로, 한국어에서도 확정성 있는 표현으로 반영했습니다.
  doctrine_reference: Semitic/라틴 강조 구문 처리
