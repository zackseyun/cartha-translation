  source_fidelity: 본문은 제공된 라틴어 단편의 반복된 ‘주님’과 미완성 절말을 대체로 보존합니다. 다만 각주가 현재 제공된 라틴어의 미래형 강조 구문과 맞지 않으며, 현재형 의문문이라는 대안을 제시해 본문 이해를 흐립니다.
  naturalness: ‘주님 앞에서, 주님’은 원문의 단편적 어순을 보존한 표현으로 다소 거칠지만 허용됩니다. ‘쉼 가운데서’는 자연스럽게 ‘쉼 속에서’로 다듬을 수 있습니다. 미완성인 until은 ‘…까지’로 표시하여 한국어에서도 원문 단절을 분명히 하는 편이 적절합니다.
  terminology: domine는 ‘주님’, seruo tuo는 ‘주님의 종’, conseruare는 문맥상 ‘보존되다’로 옮긴 것이 일관됩니다. conseruati conseruabimur의 강조와 미래성은 ‘반드시 보존될 것인지’로 반영합니다.
  issues:
