    text: Or 'utterly vain'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 영원한 희망이 우리에게 예고되었는데, 우리는 참으로 철저히 헛되게 되었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘철저히 헛되게’.
    reason: previous_rendering
lexical_decisions:
- source_word: perennis spes
  english_pob_choice: everlasting hope
  chosen_korean: 영원한 희망
  alternatives_korean:
  - 영원한 소망
  - 영속하는 희망
  lexicon: perennis → 영원한; spes → 희망
  rationale: lat. perennis는 지속성과 끊임없음을 가리키므로 ‘영원한’이 자연스럽고, spes는 이 문맥에서 종교적 확신의 ‘희망’으로 옮기는 것이 적절합니다.
- source_word: praedicta est nobis
  english_pob_choice: has been foretold to us
  chosen_korean: 우리에게 예고되었는데
  alternatives_korean:
  - 우리에게 미리 알려졌는데
  - 우리에게 미리 선포되었는데
  lexicon: praedicta est → 예고되다
  rationale: praedicere는 단순한 통보보다 ‘미리 말해 두다/예고하다’의 뜻이 강하므로, 수동형을 살려 ‘예고되었는데’로 옮겼습니다.
- source_word: pessime vani facti sumus
  english_pob_choice: we have become utterly vain
  chosen_korean: 우리는 참으로 철저히 헛되게 되었습니까
  alternatives_korean:
  - 우리는 지극히 헛된 존재가 되었습니까
  - 우리는 완전히 헛되어 버렸습니까
  lexicon: vani facti sumus → 헛되게 되었습니다
  rationale: vanus는 이 본문에서 교만이 아니라 공허함·무익함·헛됨의 뜻이므로, ‘헛되다’를 쓰고 pessime는 강도를 살려 ‘철저히’로 옮겼습니다.
