id: 2ES.7.78
reference: 2 Esdras 7:78
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'temporibus. Nam de morte sermo est: quando profectus fuerit terminus sententiae ab Altissimo ut homo moriatur, recedente inspiratione de corpore ut dimittatur iterum'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/078.yaml
  text: 'Now concerning death, the matter is this: when the decree has gone forth from the Most High that a man should die, as the breath departs from the body so that it may be sent back again,'
translation:
  language: ko
  text: 죽음에 관하여 말하자면 이렇습니다. 지극히 높으신 분께서 사람이 죽어야 한다고 정하신 판결이 내려지면, 숨이 몸에서 떠나 다시 돌려보내집니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam de morte sermo est
  english_pob_choice: Now concerning death, the matter is this
  chosen_korean: 죽음에 관하여 말하자면 이렇습니다
  alternatives_korean:
  - 죽음에 대해 말하자면 이렇습니다
  - 죽음에 관한 일은 이렇습니다
  lexicon: sermo est
  rationale: sermo est는 단순한 ‘가르침’이 아니라 ‘말하는 바/이야기되는 내용’이므로, POB의 ‘the matter is this’에 맞춰 설명형 도입구로 옮겼습니다.
- source_word: ab Altissimo
  english_pob_choice: from the Most High
  chosen_korean: 지극히 높으신 분께서
  alternatives_korean:
  - 지극히 높으신 분으로부터
  - 가장 높으신 분께서
  lexicon: Altissimus
  rationale: Altissimus는 신적 칭호이므로 ‘지극히 높으신 분’으로 자연스럽게 옮기되, 주어격을 드러내어 뒤의 판결이 그분에게서 나왔음을 분명히 했습니다.
- source_word: sententiae
  english_pob_choice: the decree
  chosen_korean: 판결
  alternatives_korean:
  - 명령
  - 선언
  - 결정
  lexicon: sententia
  rationale: sententia는 문맥상 죽음이 정해지는 법적·공적 판정이어서, 단순한 의사표시보다 강한 ‘판결’이 source의 긴급성과 확정성을 잘 드러냅니다.
- source_word: inspiratione
  english_pob_choice: the breath
  chosen_korean: 숨이
  alternatives_korean:
  - 호흡이
  - 영이
  - 숨결이
  lexicon: inspiratio
  rationale: 개정된 POB의 판단처럼 inspiratione는 여기서 ‘영’이 아니라 생명 호흡을 가리키므로, 문맥에 맞게 ‘숨’으로 옮겼습니다.
theological_decisions:
- issue: death as a divinely decreed event
  chosen_reading: 죽음은 지극히 높으신 분의 판결 아래 정해진 사건으로 제시합니다.
  alternative_readings:
  - 죽음은 자연적 현상으로만 제시한다
  - 죽음을 단순한 운명론으로 완화한다
  rationale: 본문은 죽음을 우연한 생물학적 과정이 아니라 하나님 주권 아래 선포된 판결의 결과로 설명하므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 하나님의 주권과 인간 죽음에 대한 성서적 표현
