  - 일부 항목을 축약하기
  rationale: 본문은 공기, 어둠, 시간대, 계절, 기후 현상을 연속적으로 부정하는 열거이므로, 반복된 ‘없고’ 구조로 원문의 총체적 결핍을 보존했습니다.
