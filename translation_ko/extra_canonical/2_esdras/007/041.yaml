  lexicon: sero; mane
  rationale: 라틴어의 시간대 대조를 살리되 한국어 성경문체로 자연스럽게 ‘저녁도 아침도’로 병렬했습니다.
- source_word: grandi- (hail, in the source continuation)
  english_pob_choice: hail
  chosen_korean: 우박
  alternatives_korean:
  - 우박
  - 싸라기
  lexicon: grando
  rationale: 영문 POB의 최종 정본이 ‘hail’이므로, 그에 대응하는 통용어 ‘우박’을 택했습니다.
theological_decisions:
- issue: 열거형 부정의 반복 구조
  chosen_reading: 모든 항목 앞의 부정을 한국어에서도 유지해 결핍의 총체성을 드러냈습니다.
