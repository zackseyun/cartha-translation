  - 암흑
  lexicon: tenebrae
  rationale: 영문 POB의 ‘darkness’를 자연스럽고 직접적으로 반영하는 현대 표준어는 ‘어둠’입니다.
- source_word: sero, mane
  english_pob_choice: evening, morning
  chosen_korean: 저녁도 아침도
  alternatives_korean:
  - 저녁도 아침도
  - 저녁도 새벽도
