lexical_decisions:
- source_word: aerem
  english_pob_choice: air
  chosen_korean: 공기
  alternatives_korean:
  - 공기
  - 바람
  lexicon: aer
  rationale: 라틴어 aerem은 ‘air’를 뜻하므로, 물리적 대기를 가리키는 표준어 ‘공기’로 옮겼습니다.
- source_word: tenebras
