id: 2ES.7.118
reference: 2 Esdras 7:118
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: O tu quid fecisti, Adam? si enim tu peccasti, non est factum solius tuus casus sed etnostrum qui ex te advenimus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/118.yaml
  text: O Adam[a], what have you done? For if you sinned, your fall was not yours alone, but also ours, we who have come from you.
  footnotes:
  - marker: a
    text: Or 'For if you sinned,'.
    reason: previous_rendering
translation:
  language: ko
  text: 오 아담아[a], 네가 무슨 일을 저질렀습니까? 네가 죄를 지었더라도, 네 타락은 너 혼자만의 것이 아니라 우리에게도 속한 것이었습니다. 우리는 네게서 나온 자들입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네가 죄를 지었더라도’.
    reason: previous_rendering
lexical_decisions:
- source_word: O tu quid fecisti, Adam?
  english_pob_choice: O Adam, what have you done?
  chosen_korean: 오 아담아, 네가 무슨 일을 저질렀습니까?
  alternatives_korean:
  - 오 아담아, 네가 무슨 일을 했습니까?
  - 아담아, 네가 무엇을 했습니까?
  lexicon: 호격/수사적 질문
  rationale: 원문의 감탄적 호격과 책망조의 수사적 질문을 살려, 단순한 정보 질문보다 비난과 탄식을 함께 드러내는 표현으로 옮겼습니다.
- source_word: si enim tu peccasti
  english_pob_choice: For if you sinned,
  chosen_korean: 네가 죄를 지었더라도
  alternatives_korean:
  - 네가 죄를 지었다면
  - 네가 죄를 지었으니
  lexicon: 접속사 si + peccare
  rationale: 본문의 si는 단순 조건보다 양보적 뉘앙스를 띠므로, 한국어에서는 ‘-더라도’로 처리해 원문의 논증 흐름을 더 정확히 반영했습니다.
- source_word: non est factum solius tuus casus sed et nostrum
  english_pob_choice: your fall was not yours alone, but also ours
  chosen_korean: 네 타락은 너 혼자만의 것이 아니라 우리에게도 속한 것이었습니다
  alternatives_korean:
  - 네 타락은 너 혼자만의 것이 아니라 우리도 함께 겪은 것이었습니다
  - 네 몰락은 너만의 것이 아니라 우리 것 역시었습니다
  lexicon: casus
  rationale: casus는 단순한 ‘실수’보다 인간의 타락/몰락을 가리키는 맥락이어서, 본문 문맥에 맞게 ‘타락’으로 옮겼습니다.
- source_word: qui ex te advenimus
  english_pob_choice: we who have come from you
  chosen_korean: 우리는 네게서 나온 자들입니다
  alternatives_korean:
  - 우리는 네게서 와 있는 자들입니다
  - 우리는 너에게서 태어난 자들입니다
  lexicon: 완료분사적 관계절
  rationale: ex te advenimus의 출신/기원 관계를 분명히 드러내기 위해 ‘네게서 나온 자들’로 옮겨, 존재 기원의 연관성을 살렸습니다.
theological_decisions:
- issue: 아담의 죄와 공동 연루성
  chosen_reading: 아담의 죄가 아담 개인에게만 국한되지 않고, 그에게서 나온 인류 전체의 몰락으로 이어졌다는 진술로 읽었습니다.
  alternative_readings:
  - 아담의 죄책이 전가되었다는 교리적 진술
  - 단순히 인간 보편의 취약성을 말하는 수사적 진술
  rationale: 본문은 개인적 범죄와 집단적 परिणाम을 병치하며, 아담의 행위가 후손 전체의 상태를 바꾸었다는 논지를 강조합니다. 그래서 ‘우리에게도 속한 것’이라는 표현으로 공동 연루성을 보존했습니다.
  doctrine_reference: 원죄/아담 안에서의 인류 연대
- issue: si enim의 양보적 기능
  chosen_reading: ‘if’보다 양보적 의미를 살려 ‘죄를 지었더라도’로 이해했습니다.
  alternative_readings:
  - ‘죄를 지었다면’으로 단순 조건 처리
  - ‘죄를 지었으니’로 인과 처리
  rationale: 리뷰에서 지적된 바와 같이, 이 절의 si는 아담이 죄를 지었는지 여부를 의심하는 조건문이 아니라, 이미 전제된 죄를 인정한 뒤 그 परिणाम을 논증하는 장치입니다. 한국어에서도 그 긴장을 유지해야 본문의 책망과 논리가 살아납니다.
  doctrine_reference: 본문의 수사학적 논증
