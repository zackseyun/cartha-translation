    text: 또는 ‘그대가 죄를 지었다면’.
    reason: 라틴어 si를 단순 조건으로 옮기는 가능한 대안을 제시합니다. 본문은 문맥상의 양보적 뉘앙스를 따라 ‘-더라도’로 번역했습니다.
  revision_rationale: 본문의 양보적 논증과 tu의 강조를 보존하되, 후손을 가리키는 관계절을 ‘우리 모두’에 직접 연결했습니다. 또한 실질적 대안이 되도록 각주를 고치고, 각주 표지를 해당 조건절로 옮겼습니다.
