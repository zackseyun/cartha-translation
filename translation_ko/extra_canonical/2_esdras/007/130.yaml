id: 2ES.7.130
reference: 2 Esdras 7:130
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non crediderunt autem ei, sed nec post eum prophetis, sed nec mihi qui locutus sum ad eos,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/130.yaml
  text: But they did not believe him, nor the prophets after him, nor even me, who spoke to them.
translation:
  language: ko
  text: 그러나 그들은 그를 믿지 않았으며, 그 뒤의 예언자들도 믿지 않았고, 그들에게 말한 나도 믿지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Non crediderunt ... ei
  english_pob_choice: they did not believe him
  chosen_korean: 그들은 그를 믿지 않았고
  alternatives_korean:
  - 그에게 믿음을 두지 않았고
  - 그를 신뢰하지 않았고
  lexicon: crediderunt → 믿다
  rationale: 라틴어 credere는 여기서 ‘믿다’의 기본 의미로 쓰였으며, POB 영어의 did not believe를 자연스럽게 반영하되 관계 대명사적 목적어인 ‘그를’로 유지했습니다.
- source_word: sed nec post eum prophetis
  english_pob_choice: nor the prophets after him
  chosen_korean: 그 뒤의 예언자들도 믿지 않았으며
  alternatives_korean:
  - 그 후의 예언자들도 믿지 않았으며
  - 그를 뒤따른 예언자들도 믿지 않았으며
  lexicon: post eum prophetis → 그 뒤의 예언자들
  rationale: post eum은 시간적 순서를 나타내므로 ‘그 뒤의’로 옮겨, 히브리식·라틴식 순차 구조를 보존했습니다.
- source_word: nec mihi qui locutus sum ad eos
  english_pob_choice: nor even me, who spoke to them
  chosen_korean: 나를 믿지도 않았습니다. 내가 그들에게 말했기 때문입니다.
  alternatives_korean:
  - 나를 믿지도 않았습니다. 내가 그들에게 말한 이였기 때문입니다.
  - 나를 믿지도 않았습니다. 내가 그들에게 말한 자였기 때문입니다.
  lexicon: qui locutus sum ad eos → 내가 그들에게 말했기 때문입니다
  rationale: 직역하면 ‘내가 그들에게 말한 자’이지만, 한국어에서는 관계절을 이유·설명 구조로 풀어야 문장이 자연스럽고, 원문의 자기지시를 해치지 않습니다.
theological_decisions:
- issue: 화자 ‘나’의 지칭
  chosen_reading: 본문의 ‘나’는 문맥상 신적 발화자이며, 한국어에서도 1인칭을 그대로 유지했습니다.
  alternative_readings:
  - ‘나’를 ‘주님’으로 명시하는 번역
  - 설명적 주석으로 화자를 덧붙이는 번역
  rationale: 라틴어 원문은 화자를 직접 1인칭으로 제시하며, POB 영어도 이를 보존합니다. 본문 자체에서 화자를 바꾸지 않고 독자가 문맥으로 식별하게 하는 것이 source-direct합니다.
  doctrine_reference: 서사 속 신적 자기발화의 직접성 보존
