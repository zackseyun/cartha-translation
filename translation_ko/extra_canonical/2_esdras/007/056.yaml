translation:
  language: ko
  text: 은과 놋쇠, 그리고 철과 납과 점토입니다. 그러나 은은 금보다 더 많고, 놋쇠는 은보다 더 많고, 철은
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: argentum
  english_pob_choice: silver
  chosen_korean: 은
  alternatives_korean:
  - 은(銀)
  - 은덩이
  lexicon: silver
  rationale: 금속 목록의 첫 항목이므로 자연스럽고 표준적인 ‘은’을 사용했습니다.
- source_word: æramentum
  english_pob_choice: bronze
  chosen_korean: 놋쇠
  alternatives_korean:
  - 청동
  - 놋
  lexicon: bronze
  rationale: 라틴어 æramentum은 구리계 합금을 가리키므로, 문맥상 현대 한국어에서 이해하기 쉬운 ‘놋쇠’를 택했습니다.
- source_word: et ferrum quoque et plumbum et fictile
  english_pob_choice: and also iron and lead and clay
  chosen_korean: 그리고 철과 납과 점토
  alternatives_korean:
  - 또한 철과 납과 흙그릇
  - 철과 납과 토기
  lexicon: iron / lead / clay
  rationale: 목록의 병렬성을 살리기 위해 ‘그리고 …와 …와 …’로 옮겼고, fictile은 ‘점토’로 직역해 물질 목록의 대비를 유지했습니다.
- source_word: Multiplicatur autem
  english_pob_choice: is more abundant than
  chosen_korean: 더 많고
  alternatives_korean:
  - 더 풍부하고
  - 더 많이 생산되고
  lexicon: multiply / more abundant
  rationale: 비교 구문으로 이어지는 문맥이므로, 양적 우세를 가장 간결하게 드러내는 ‘더 많고’를 택했습니다.
theological_decisions:
- issue: 이 절의 목록과 비교 진술이 중간에서 끊긴 채 끝나는 불완전 문장 처리
  chosen_reading: 원문이 실제로 절 말미에서 ‘et ferrum super’에서 끝나므로, 한국어도 미완성으로 유지했습니다.
  alternative_readings:
  - 문장을 보완해 매끄럽게 완결시키는 번역
  - 앞뒤 절을 끌어와 완성형으로 재구성하는 번역
  rationale: 이 구절은 본문 자체가 절단된 상태이므로, 의미를 완결시켜 버리면 source-grounded 원칙을 훼손합니다.
  doctrine_reference: 본문비평 및 절 경계 보존
- issue: fictile의 번역
  chosen_reading: ‘점토’로 옮겨 물질의 연쇄를 드러냈습니다.
  alternative_readings:
  - 토기
  - 흙으로 만든 그릇
  rationale: 여기서는 그릇 형태보다 재료 목록이 핵심이므로, 도자기적 해석을 덜어내고 원질료를 살렸습니다.
  doctrine_reference: 문맥 우선의 직역 원칙
