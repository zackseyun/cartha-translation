id: 2ES.7.61
reference: 2 Esdras 7:61
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nominatum est; Et non contristabor super multitudinem eorum qui perierunt, ipsi enim sunt qui uapori assimilati sunt et flammae, fumo adaequati sunt et exarserunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/061.yaml
  text: And I will not grieve over the multitude of those who have perished[a], for they are the ones who have been made like vapor and likened to flame, compared to smoke, and have burned up.
  footnotes:
  - marker: a
    text: Or 'for they are like vapor, and are compared to flame and smoke;'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 많은 사람들의 무리에 대해 슬퍼하지 않겠습니다. 그들은 이미 증기처럼 되고, 불꽃처럼 되며, 연기와도 같아져 버렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 증기와 같고, 불꽃과 비교되며, 연기와도 같다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: multitudinem eorum qui perierunt
  english_pob_choice: the multitude of those who have perished
  chosen_korean: 많은 사람들의 무리
  alternatives_korean:
  - 그들이 멸망한 자들의 큰 무리
  - 죽어 버린 이들의 무리
  lexicon: multitudo / pereo
  rationale: multitudo는 단순한 수량보다 집합적 ‘무리’를 가리키므로, perierunt의 완료 시점을 반영해 ‘많은 사람들의 무리’로 옮겼습니다.
- source_word: non contristabor
  english_pob_choice: I will not grieve
  chosen_korean: 슬퍼하지 않겠습니다
  alternatives_korean:
  - 근심하지 않겠습니다
  - 애통해하지 않겠습니다
  lexicon: contristare
  rationale: 직역보다 자연스러운 한국어 동사로 고르되, 장차의 의지 표현을 살려 ‘슬퍼하지 않겠습니다’로 옮겼습니다.
- source_word: uapori assimilati sunt et flammae
  english_pob_choice: made like vapor and likened to flame
  chosen_korean: 증기처럼 되고, 불꽃처럼 되며
  alternatives_korean:
  - 증기와 불꽃처럼 되며
  - 증기와 불길에 비유되며
  lexicon: assimilare / flamma
  rationale: 라틴어는 vapor와 flamma를 병렬로 결합하므로, 둘을 함께 한 이미지로 묶기보다 각각의 비유를 살려 ‘증기처럼’, ‘불꽃처럼’으로 대응했습니다.
- source_word: fumo adaequati sunt
  english_pob_choice: compared to smoke
  chosen_korean: 연기와도 같아져 버렸기
  alternatives_korean:
  - 연기와 비교되었기
  - 연기에 견주어졌기
  lexicon: adaequare / fumus
  rationale: adaequati sunt의 ‘동등하게 됨/견줄 만하게 됨’을 한국어에서 가장 자연스럽게 드러내기 위해 ‘연기와도 같아져’로 옮겼습니다.
theological_decisions:
- issue: 완료 시제와 종결의 강도
  chosen_reading: ‘have perished’와 ‘have burned up’에 맞추어 이미 일어난 소멸을 현재적 감정 서술이 아니라 완료된 상태로 제시했습니다.
  alternative_readings:
  - 현재형으로 ‘멸망하는 자들’처럼 일반화하는 읽기
  - 미래적 경고로 약화하는 읽기
  rationale: 라틴어 perfects(perierunt, assimilati sunt, adaequati sunt, exarserunt)는 사건의 완료를 강조하므로, 이를 한국어에서도 완료된 결과로 유지하는 것이 문맥상 더 충실합니다.
  doctrine_reference: 문학적·서사적 시점 보존
