  to: 그리고 나는 멸망한 이들의 무리에 대하여 슬퍼하지 않겠습니다. 그들은 바로 증기와 불꽃에 비유되고, 연기에 견주어졌으며, 불타올랐기 때문입니다.[a]
  rationale: 원문의 대상 표현(perierunt), 세 비교 표현의 배열(증기와 불꽃 / 연기), 그리고 마지막 완료 동사(exarserunt)를 모두 본문에 반영했습니다. 각 비유 표현의 문법적 관계를 본문에서 보존하되, 영어 감사 기록의 대안 번역은 기존 각주 기능에 맞추어 한국어로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:14Z'
