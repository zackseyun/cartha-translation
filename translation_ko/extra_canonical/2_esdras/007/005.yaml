id: 2ES.7.5
reference: 2 Esdras 7:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si quis enim volens voluerit ingredi mare videre eum vel dominari eius, si non transierit angustum, in latitudinem venire quomodo poterit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/005.yaml
  text: For if anyone desires to enter the sea[a], to see it or to master it, how will he be able to come into the broad place unless he passes through the narrow place?
  footnotes:
  - marker: a
    text: Or 'someone who wishes to enter should want to see the sea or master it, how will he come into the breadth'.
    reason: previous_rendering
translation:
  language: ko
  text: 누구든지 바다에 들어가 그것을 보거나 지배하고자 한다면, 좁은 곳을 통과하지 않고 어떻게 넓은 곳에 이를 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: si quis enim
  english_pob_choice: For if anyone desires
  chosen_korean: 만일 누구든지
  alternatives_korean:
  - 만일 어떤 사람이
  - 누구든지 만일
  lexicon: Latin si quis
  rationale: 조건문 도입부를 자연스러운 합쇼체로 옮겼으며, quis의 일반화된 의미를 살려 특정 인물보다 보편적 인물을 가리키게 했습니다.
- source_word: volens voluerit
  english_pob_choice: desires
  chosen_korean: ~하려고 한다면
  alternatives_korean:
  - 간절히 원한다면
  - 원한다면
  lexicon: Latin volens voluerit
  rationale: 중복 의지 표현의 강조를 과도하게 살리기보다, 한국어에서 자연스러운 동기·의도 표현으로 풀어 원문의 의도적 긴장을 유지했습니다.
- source_word: ingredi mare
  english_pob_choice: to enter the sea
  chosen_korean: 바다에 들어가
  alternatives_korean:
  - 바다로 들어가
  - 바다에 진입해
  lexicon: Latin ingredi mare
  rationale: ingredi는 단순 이동이 아니라 ‘들어가다’는 동작을 뜻하므로, 목적어 mare를 직역적으로 붙여 ‘바다에 들어가’로 옮겼습니다.
- source_word: dominari eius
  english_pob_choice: to master it
  chosen_korean: 그것을 지배하려고
  alternatives_korean:
  - 그것을 다스리려고
  - 그것을 장악하려고
  lexicon: Latin dominari
  rationale: dominiari는 ‘지배하다/다스리다’의 권세적 뉘앙스를 가지므로, 단순한 숙련보다 권한과 통제의 의미가 드러나게 했습니다.
- source_word: angustum ... latitudinem
  english_pob_choice: the narrow place ... the broad place
  chosen_korean: 좁은 곳 ... 넓은 곳
  alternatives_korean:
  - 좁은 길 ... 넓은 곳
  - 협착한 곳 ... 광활한 곳
  lexicon: Latin angustum / latitudo
  rationale: latitudo의 추상명사적 ‘넓음’보다는 대조가 선명한 공간 표현을 택해, 원문의 비유적 대비를 한국어에서도 분명히 드러냈습니다.
theological_decisions:
- issue: 비유적 공간 대비의 유지
  chosen_reading: ‘좁은 곳’과 ‘넓은 곳’을 그대로 대비시켜, 통과와 도달의 긴장을 살렸습니다.
  alternative_readings:
  - ‘좁은 길’과 ‘넓은 곳’
  - ‘협착한 곳’과 ‘넓은 곳’
  rationale: 본문은 단순한 거리 묘사가 아니라 좁은 관문을 통과해야 넓은 영역에 이를 수 있다는 비유적 논리를 세우므로, 공간적 대비를 유지하는 것이 해석상 가장 안전합니다.
  doctrine_reference: 문맥상 지혜·심판 비유의 수사 구조
