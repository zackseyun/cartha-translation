  to: 누구든지 바다에 들어가 그것을 보거나 지배하고자 한다면, 좁은 곳을 통과하지 않고 어떻게 넓은 곳에 이를 수 있겠습니까?
  rationale: The revision retains the conditional-rhetorical structure, the sea imagery, and the narrow/broad spatial contrast. It improves Korean syntax, avoids needless repetition, and expresses poterit (‘be able’) naturally as ‘이를 수 있겠습니까?’ The non-source-based and malformed legacy footnote is removed.
