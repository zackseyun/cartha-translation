  terminology: ‘지극히 높으신 분’은 Most High에 대한 중립적이고 존중하는 신칭호입니다. nitorem, claritatem, lucem, splendorem의 중첩은 ‘밝음, 광휘, 빛, 광채’로 구별해 유지할 수 있습니다.
