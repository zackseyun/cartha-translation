id: 2ES.7.42
reference: 2 Esdras 7:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem, neque pluuiam, neque rorem, Neque meridiem, neque noctem, neque ante lucem, neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/042.yaml
  text: neither rain nor dew, neither noon nor night nor dawn, neither brightness nor splendor nor light, but only the radiance of the glory of the Most High, by which all will begin to see what has been set before them.
translation:
  language: ko
  text: 비도, 이슬도, 한낮도, 밤도, 새벽도, 밝음도, 광휘도, 빛도 없고, 오직 지극히 높으신 분의 영광의 광채만 있어서, 그 앞에 놓인 것을 모든 사람이 보기 시작할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문에는 뒤 문장(‘그 앞에 놓인 것을…’)이 직접 보존되지 않지만, 영문 POB 수정본이 문맥상 함께 제시한 의미를 반영했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: nem, neque pluuiam, neque rorem
  english_pob_choice: neither rain nor dew
  chosen_korean: 비도, 이슬도
  alternatives_korean:
  - 비도 이슬도
  - 비도 없고 이슬도 없고
  lexicon: pluuiam = 비, rorem = 이슬
  rationale: 라틴어의 병렬 부정을 그대로 살리되 한국어에서는 자연스러운 열거형으로 압축했습니다.
- source_word: Neque meridiem, neque noctem, neque ante lucem
  english_pob_choice: neither noon nor night nor dawn
  chosen_korean: 한낮도, 밤도, 새벽도
  alternatives_korean:
  - 정오도, 밤도, 새벽도
  - 한낮도 밤도 새벽도
  lexicon: meridiem = 한낮/정오, noctem = 밤, ante lucem = 새벽
  rationale: 시간대를 가리키는 세 항목을 한국어의 가장 직접적인 대응어로 옮겨, 대조와 반복을 유지했습니다.
- source_word: neque nitorem, neque claritatem, neque lucem, nisi solummodo splendorem
  english_pob_choice: neither brightness nor splendor nor light, but only the radiance
  chosen_korean: 밝음도, 광휘도, 빛도 없고, 오직 … 광채만
  alternatives_korean:
  - 광명도, 영광도, 빛도 없고, 오직 … 빛남만
  - 밝기나 찬란함이나 빛도 없고, 오직 … 광채만
  lexicon: nitorem = 밝음/광택, claritatem = 광휘/찬란함, lucem = 빛, splendorem = 광채
  rationale: 라틴어가 서로 다른 광명 계열 어휘를 중첩하므로, 한국어에서도 의미 겹침을 유지해 ‘밝음/광휘/빛/광채’로 분리해 번역했습니다.
- source_word: splendorem
  english_pob_choice: the radiance of the glory of the Most High
  chosen_korean: 지극히 높으신 분의 영광의 광채
  alternatives_korean:
  - 지극히 높으신 분의 영광의 빛남
  - 가장 높으신 이의 영광의 찬란함
  lexicon: Most High = 지극히 높으신 분, gloria = 영광, splendor = 광채
  rationale: ‘Most High’를 신적 칭호로 풀어 존칭을 유지하고, splendor를 ‘광채’로 옮겨 뒤의 ‘광영’ 이미지와 구별했습니다.
theological_decisions:
- issue: 최고신 칭호의 한국어 처리
  chosen_reading: Most High를 ‘지극히 높으신 분’으로 번역했습니다.
  alternative_readings:
  - 지극히 높으신 이
  - 가장 높으신 분
  rationale: 인격적 신칭호로 읽히도록 하면서도 특정 전통 용어에 고정되지 않게 하려는 선택입니다.
  doctrine_reference: 신론/호칭론
- issue: 결말 절의 문맥 보존
  chosen_reading: ‘그 앞에 놓인 것을 모든 사람이 보기 시작할 것입니다’라는 영어 POB의 문맥을 한국어에 반영했습니다.
  alternative_readings:
  - 그 앞에 놓인 것을 보게 될 것입니다
  - 그들 앞에 놓인 것을 볼 것입니다
  rationale: 라틴어 본문에는 후반부가 없지만, 감사된 POB 영어 본문이 보존한 의미 단위를 유지해 문맥적 완결성을 살렸습니다.
  doctrine_reference: 본문비평/번역일관성
