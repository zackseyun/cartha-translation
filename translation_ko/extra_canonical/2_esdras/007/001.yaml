  text: et factum est cum finissem loqui verba haec, et missus est ad me angelus, qui missus fuerat ad me primis noctibus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/001.yaml
  text: And it happened, when I had finished speaking these words, that the angel who had been sent to me in the first nights was sent to me again,
translation:
  language: ko
  text: 내가 이 말들을 마치자, 처음 밤들에 내게 보내졌던 그 천사가 다시 내게 보내졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘첫 번째 밤들에’이므로, 복수성을 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: et factum est
  english_pob_choice: And it happened
  chosen_korean: 내가 이 말들을 마치자
  alternatives_korean:
  - 그리고 이렇게 되었습니다
  - 그때 이런 일이 있었습니다
  lexicon: et factum est
  rationale: 서술 도입의 관용적 전환을 한국어로 자연스럽게 옮기되, 뒤따르는 시간절(cum finissem)을 살려 사건의 흐름을 분명히 했습니다.
- source_word: cum finissem loqui verba haec
  english_pob_choice: when I had finished speaking these words
  chosen_korean: 이 말들을 마치자
  alternatives_korean:
  - 이 말들을 다 말한 뒤
  - 이 말을 끝마치고
  lexicon: cum + finissem + loqui verba haec
  rationale: 원문의 완료 시점을 나타내는 구조를 간결한 종속절로 옮겨, ‘말하다’를 추가해 화자의 발화를 분명히 했습니다.
- source_word: angelus
  english_pob_choice: the angel
  chosen_korean: 그 천사
  alternatives_korean:
  - 천사
  - 사자
  lexicon: angelus
  rationale: 라틴어 angelus의 기본 의미를 따라 ‘천사’로 옮겼고, 앞서 언급된 존재를 가리키는 문맥상 정관성을 반영해 ‘그’를 붙였습니다.
- source_word: qui missus fuerat ad me primis noctibus
  english_pob_choice: who had been sent to me in the first nights
  chosen_korean: 처음 밤들에 내게 보내졌던
  alternatives_korean:
  - 처음의 밤들에 내게 보내졌던
  - 첫밤들에 내게 보내진
  lexicon: primis noctibus + missus fuerat
  rationale: primis noctibus는 직역하면 ‘첫 번째 밤들에’이므로, 복수성을 유지해 ‘처음 밤들에’로 옮겼습니다. 수동 완료형 missus fuerat은 과거의 이미 완료된 파견을 나타내므로 ‘보내졌던’으로 처리했습니다.
theological_decisions:
- issue: 천사의 반복 파견
  chosen_reading: 같은 천사가 처음 밤들에 이미 보내졌고, 다시 내게 보내졌다는 서술로 이해했습니다.
  alternative_readings:
  - 다른 천사가 다시 보내졌다는 이해
  - 첫 번째 파견이 아니라 반복적 방문을 강조하는 이해
  rationale: qui missus fuerat ad me가 앞선 동일 인물을 지시하므로, 반복 파견의 동일성을 드러내는 것이 가장 자연스럽습니다.
  doctrine_reference: 서술 문맥 이해
