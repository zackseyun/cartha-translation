  source_fidelity: 초안은 라틴어 서술 도입구 et factum est(‘그리고 이런 일이 있었습니다’)를 번역에서 빠뜨렸습니다. 또한 cum finissem loqui verba haec의 ‘말하기를 마치다’는 ‘이 말들을 마치자’에도 대체로 담기지만, ‘다 말하고 나자’가 발화 행위를 더 명시적으로 보존합니다. 나머지 문장은 qui missus fuerat와 다시 파견되었다는 missus est의 관계를 충실히 반영합니다.
  naturalness: ‘처음 밤들’은 한국어에서 다소 낯설지만, 연속된 초기 밤들을 가리키는 원문의 복수형을 보존하는 절제된 표현입니다. ‘그리고 이런 일이 있었습니다’와 ‘다 말하고 나자’는 현대 표준어 합쇼체 성경 문체로 자연스럽습니다.
  terminology: angelus는 문맥상 ‘그 천사’가 적절합니다. ‘보내졌던’과 ‘다시 내게 보내졌습니다’는 수동 파견 및 동일 천사의 재파견을 정확히 나타냅니다.
