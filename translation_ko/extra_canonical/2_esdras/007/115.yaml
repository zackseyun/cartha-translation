id: 2ES.7.115
reference: 2 Esdras 7:115
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tunc ergo nemo poterit misereri eius qui in iudicio victus fuerit, neque demergere eum qui vicerit.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/115.yaml
  text: Therefore no one will then be able to have mercy on one who has been defeated in the judgment[a], nor to cast down one who has prevailed.
  footnotes:
  - marker: a
    text: Or 'conquered'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 그때에는 심판에서 패한[a] 이에게 자비를 베풀 수 있는 사람도 없고, 이긴 이를 넘어뜨릴 수 있는 사람도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘정복된’. 그러나 심판의 문맥에서는 ‘패한’이 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: misereri eius
  english_pob_choice: have mercy on
  chosen_korean: 자비를 베풀다
  alternatives_korean:
  - 불쌍히 여기다
  - 은혜를 베풀다
  lexicon: misereri
  rationale: 라틴어 동사 misereri는 단순한 감정이 아니라 실제 자비의 행위를 가리키므로, 공적이고 문어적인 표현인 ‘자비를 베풀다’로 옮겼습니다.
- source_word: in iudicio
  english_pob_choice: in the judgment
  chosen_korean: 심판에서
  alternatives_korean:
  - 재판에서
  - 판결에서
  lexicon: iudicium
  rationale: 문맥상 법정적·판정적 장면을 가리키므로 ‘심판’으로 옮겨, 단순한 재판 절차보다 최종 판정의 뉘앙스를 살렸습니다.
- source_word: victus fuerit
  english_pob_choice: has been defeated
  chosen_korean: 패배한
  alternatives_korean:
  - 정죄된
  - 패한
  lexicon: vinco / victus
  rationale: English POB가 판결 맥락에서 ‘defeated’를 채택했으므로, 군사적 ‘패한’보다 상태를 분명히 드러내는 ‘패배한’이 원문의 forensic 대비를 더 잘 드러냅니다.
- source_word: vicerit
  english_pob_choice: has prevailed
  chosen_korean: 승리한
  alternatives_korean:
  - 이긴
  - 우세한
  - 판정에서 이긴
  lexicon: vinco / vici
  rationale: 이 동사는 단순한 정복보다 법정에서의 승리·우위를 뜻하므로, English POB의 ‘prevailed’에 맞춰 ‘승리한’으로 옮겼습니다.
theological_decisions:
- issue: 최종 심판의 법정적 대비를 한국어에서 어떻게 유지할지
  chosen_reading: ‘심판에서 패배한 … 승리한 이’로, 패배/승리의 대조를 살리되 형벌보다 판정의 결과를 강조했습니다.
  alternative_readings:
  - ‘심판에서 정죄된 … 이긴 이’
  - ‘재판에서 진 … 이긴 사람’
  rationale: 본문은 자비와 넘어뜨림이 모두 허용되지 않는 최종 판정의 장면을 말하므로, 승패의 법정적 대비를 보존하는 것이 문맥에 가장 충실합니다.
  doctrine_reference: 최종 심판의 공의와 판정의 확정성
