    rationale: 라틴어 victus fuerit는 수동형이며 일반적으로 ‘패한, 정복된’이 될 수 있습니다. 그러나 주어진 영문 각주의 conquered는 ‘one who has conquered’라는 능동적 형태로 표기되어 있어 이를 한국어 ‘정복된’의 근거처럼 제시할 수 없습니다. 본문 문맥상 ‘패한’이 적절하며, 각주는 한국어의 실제 가능한 일반적 대안만 제시해야 합니다.
  revised_text: 그러므로 그때에는 심판에서 패한[a] 이에게 자비를 베풀 수 있는 사람도 없고, 이긴 이를 넘어뜨릴 수 있는 사람도 없을 것입니다.
