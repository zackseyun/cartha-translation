  source_fidelity: 라틴어의 대구, 즉 심판에서 진 사람(victus)과 이긴 사람(vicerit), 그리고 각각에게 자비를 보이거나 넘어뜨리는 일이 불가능하다는 뜻은 대체로 충실히 반영되었습니다. 다만 각주는 victus가 수동형임에도 ‘정복된(conquered)’을 영문 대안으로 제시하여, 영문 conquered의 형태·뜻을 부정확하게 설명합니다.
  naturalness: 본문은 자연스럽지만, ‘그때에는’과 미래의 불가능을 ‘없습니다’보다 ‘없을 것입니다’로 맺으면 원문의 미래 시제와 합쇼체 문어체가 더 분명하게 살아납니다. ‘패한/이긴’은 심판의 법정적 승패 대조를 간결하고 자연스럽게 드러냅니다.
  terminology: ‘심판’, ‘자비를 베풀다’, ‘넘어뜨리다’는 적절합니다. victus와 vicerit는 이 문맥에서 정죄/구원 같은 신학적 해석어보다 ‘패한/이긴’으로 유지하는 편이 원문의 법정적 대조와 의미 범위에 충실합니다.
  issues:
