review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the contrast between the present order (in praesenti) and postmortem punishment, and correctly understands mortuos as referring to the same collective after death. However, “이 현재를 살고” is not idiomatic Korean for vivere in praesenti, and the note's alternative introduces both the flattening “지금” and an unnatural purposive form.
  naturalness: “이 현세에서 … 살고” is natural modern formal Korean and conveys the contextual present-age contrast without forcing the unidiomatic noun phrase “이 현재를 살다.” “벌을 기다리다” naturally renders sperare punitionem in this rhetorical question.
  terminology: “현세” appropriately conveys the present temporal order in the chapter’s eschatological contrast while avoiding a doctrinally loaded expansion. “벌” is a direct, suitably neutral rendering of punitionem.
  issues:
  - severity: medium
    issue: “이 현재를 살고” is an unnatural rendering of in praesenti vivere.
    rationale: Korean does not normally say that one ‘lives the present’ in this construction. “이 현세에서 … 살다” expresses living in the present age/order and preserves the contextual contrast.
  - severity: medium
    issue: Footnote a is inaccurate and grammatically mismatched in Korean.
    rationale: “모든 사람이 지금 살도록” changes the infinitival ‘for all to live’ into a purposive expression, while “지금” weakens the source’s present-age resonance. The note is not needed for the adopted source-faithful wording.
  revised_text: 그러므로 모든 이가 이 현세에서 슬픔 속에 살고, 죽은 뒤에는 벌을 기다리는 것이 무슨 유익이 있겠습니까?
