  rationale: Revised the present-age phrase into idiomatic Korean while preserving the Latin’s present-versus-postmortem contrast. Removed the misleading, grammatically unsuitable inherited footnote. No change has been made to the rhetorical question or to the sense that all live sorrowfully now and anticipate punishment after death.
