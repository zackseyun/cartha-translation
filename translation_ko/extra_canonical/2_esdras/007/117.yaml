translation:
  language: ko
  text: 그러므로 모든 이가 이 현세에서 슬픔 속에 살고, 죽은 뒤에는 벌을 기다리는 것이 무슨 유익이 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnibus
  english_pob_choice: all
  chosen_korean: 모든 이
  alternatives_korean:
  - 모두
  - 사람들 모두
  lexicon: Latin omnibus
  rationale: omnibus는 단순히 ‘모든’의 뜻이므로, POB의 수정된 의미를 따라 불필요한 확대 없이 자연스럽게 ‘모든 이’로 옮겼습니다.
- source_word: in praesenti
  english_pob_choice: in the present
  chosen_korean: 이 현재를
  alternatives_korean:
  - 현재에
  - 지금의 때에
  - 현세에서
  lexicon: Latin in praesenti
  rationale: 문맥상 단순한 ‘지금’보다 종말론적 대조를 이루는 ‘현재/이 현재’가 더 적절하여, 현세적 시간대를 드러내는 표현으로 옮겼습니다.
- source_word: tristitia
  english_pob_choice: in sorrow
  chosen_korean: 슬픔 속에서
  alternatives_korean:
  - 슬픔 가운데
  - 비탄 속에서
  - 근심 속에서
  lexicon: Latin tristitia
  rationale: tristitia의 감정적 고통을 자연스러운 현대 한국어로 살려 ‘슬픔 속에서’로 옮겼습니다.
- source_word: mortuos
  english_pob_choice: when dead
  chosen_korean: 죽은 뒤에는
  alternatives_korean:
  - 죽었을 때에는
  - 죽으면
  - 죽은 후에
  lexicon: Latin mortuos
  rationale: POB가 반영한 ‘when dead’의 직접성을 따라, 사후 상태를 분명히 하는 ‘죽은 뒤에는’으로 옮겼습니다.
theological_decisions:
- issue: 현재와 미래 심판의 종말론적 대비
  chosen_reading: ‘이 현재’와 ‘죽은 뒤에는 … 벌을 기다리는 것’으로 현재의 고통과 사후 심판 기대를 대비시켰습니다.
  alternative_readings:
  - ‘지금’과 ‘죽은 뒤에’로 단순 시간 표현화
  - ‘현세’로 일반화
  rationale: 4에스드라스의 핵심 축인 현재 세대와 장차 올 심판의 대비를 흐리지 않기 위해, 시간표현을 종말론적 긴장을 유지하는 방향으로 번역했습니다.
  doctrine_reference: 4 Ezra 7장의 현세/내세 및 심판 대비
