    reason: textual_variant
lexical_decisions:
- source_word: Et respondit ad me et dixit
  english_pob_choice: And he answered me and said
  chosen_korean: 그가 내게 대답하여 말했습니다
  alternatives_korean:
  - 그가 내게 대답하고 말했습니다
  - 그가 내게 응답하여 말했습니다
  lexicon: respondere / dicere
  rationale: 라틴어의 단순 서술을 자연스러운 현대 한국어 서술로 옮기되, 이어지는 직접화법을 분명히 하기 위해 ‘대답하여 말했습니다’를 택했습니다.
- source_word: In te
  english_pob_choice: are in you
  chosen_korean: 당신 안에 있습니다
  alternatives_korean:
  - 너 안에 있습니다
  - 네 안에 있습니다
  - 네 속에 있습니다
  lexicon: in + te
  rationale: 문맥상 직접 대면하는 호격이므로 존대 2인칭 ‘당신’을 사용했고, ‘in te’는 내면적 위치를 드러내는 가장 პირდაპირ한 표현인 ‘안에’로 옮겼습니다.
- source_word: pondera
  english_pob_choice: the weights
  chosen_korean: 무게
  alternatives_korean:
  - 저울추
  - 무거움
  - 무게들
  lexicon: pondera
  rationale: 라틴어 pondera의 기본 의미인 ‘무게/무게감’을 살려, 추상적이면서도 원문의 이미지를 보존하는 ‘무게’로 옮겼습니다.
- source_word: quæ cogitasti
  english_pob_choice: of what you have thought
  chosen_korean: 당신이 생각한 것
  alternatives_korean:
  - 당신이 생각했던 것
  - 당신이 사유한 것
  - 당신이 마음에 품은 것
  lexicon: cogitare
  rationale: 영문 POB가 주석에서 밝히듯 문맥적 의미를 따르는 구절이므로, 과도한 해석을 피하면서도 자연스러운 ‘생각한 것’으로 처리했습니다.
