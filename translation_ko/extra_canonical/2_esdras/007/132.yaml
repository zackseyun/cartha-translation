base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/132.yaml
  text: And I answered and said[a], “I know, Lord, that the Most High is now called merciful because he has mercy on those who have not yet come into the age,”
  footnotes:
  - marker: a
    text: Or 'into the age'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 대답하여 말했습니다. 「주님, 지극히 높으신 분이 이제 자비로우신 분이라 불리는 것은, 아직 세상에 나오지 않은 이들에게도 자비를 베푸시기 때문인 줄 압니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 구절의 라틴어 in saeculo advenerunt는 여기서 ‘아직 세상에 나오지 않은’이라는 관용적 의미로 읽을 수 있습니다.
    reason: cross_reference
lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 나는 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말했습니다
  - 나는 대답하며 말했습니다
  lexicon: respondere / dicere
  rationale: 대화체의 반복 동사를 자연스러운 한국어로 옮기되, 응답과 발화를 함께 보존해 화자의 응답 행위를 분명히 했습니다.
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: domine
  rationale: 호칭으로서의 공손한 직접 호명에 맞춰 ‘주님’을 택했고, 문맥상 기도문식 ‘주여’보다 현대 합쇼체에 더 자연스럽습니다.
- source_word: Altissimus misericors
  english_pob_choice: the Most High is now called merciful
  chosen_korean: 지극히 높으신 분이 이제 자비로우신 분이라 불리는 것은
  alternatives_korean:
  - 지극히 높으신 이가 이제 자비로우시다고 불리는 것은
  - 가장 높으신 분이 이제 자비하시다고 불리는 것은
  lexicon: Altissimus / misericors
  rationale: Altissimus는 직역적 칭호로 ‘지극히 높으신 분’이라 하고, misericors는 단순 형용사보다 ‘자비로우신 분’이라는 호칭적 표현이 원문의 수식 구조를 더 잘 드러냅니다.
- source_word: in eo quod misereatur
  english_pob_choice: because he has mercy
  chosen_korean: 자비를 베푸시기 때문인 줄 압니다
  alternatives_korean:
  - 긍휼을 베푸시기 때문인 줄 압니다
  - 불쌍히 여기시기 때문인 줄 압니다
  lexicon: misereatur
  rationale: 라틴어 접속구의 원인 의미를 살리면서, 한국어에서 가장 직접적인 대응인 ‘자비를 베푸시다’를 택해 신학적 무게를 유지했습니다.
- source_word: qui nondum in saeculo advenerunt
  english_pob_choice: on those who have not yet come into the age
  chosen_korean: 아직 세상에 나오지 않은 이들에게
  alternatives_korean:
  - 아직 이 세상에 오지 않은 이들에게
  - 아직 시대에 들어오지 않은 이들에게
  lexicon: in saeculo advenerunt
  rationale: 주석된 영어 개정처럼 이 구절은 ‘come into the age’의 종말론적 용례보다 ‘태어나서 세상에 들어오다’는 관용구로 읽히므로, 한국어도 자연스럽게 출생 의미를 살렸습니다.
theological_decisions:
- issue: saeculum의 해석
  chosen_reading: 여기서는 종말론적 ‘세대/시대’보다 인간 존재 영역에 들어오는 것, 곧 출생을 가리키는 관용으로 읽었습니다.
  alternative_readings:
  - ‘아직 시대에 들어오지 않은 이들’로 직역하는 해석
  - ‘아직 세대 안에 들어오지 않은 이들’로 옮기는 해석
  rationale: 본문의 라틴어 구문과 영어 POB의 최신 조정이 모두 관용적 출생 표현을 지지하므로, 독자가 오해 없이 의미를 이해하도록 했습니다.
  doctrine_reference: 2 Esdras 7:132 문맥 주해
- issue: Most High의 호칭 처리
  chosen_reading: ‘지극히 높으신 분’으로 신적 칭호를 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 원문은 명시적으로 Θεός가 아니라 칭호 Altissimus를 쓰므로, 한국어도 칭호 자체를 보존해 문체와 신학적 간격을 유지했습니다.
  doctrine_reference: 하나님의 칭호 번역 원칙
