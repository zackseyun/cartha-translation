- source_word: qui nondum in saeculo advenerunt
  english_pob_choice: on those who have not yet come into the age
  chosen_korean: 아직 세상에 나오지 않은 이들에게
  alternatives_korean:
  - 아직 이 세상에 오지 않은 이들에게
  - 아직 시대에 들어오지 않은 이들에게
  lexicon: in saeculo advenerunt
  rationale: 주석된 영어 개정처럼 이 구절은 ‘come into the age’의 종말론적 용례보다 ‘태어나서 세상에 들어오다’는 관용구로 읽히므로, 한국어도 자연스럽게 출생 의미를 살렸습니다.
theological_decisions:
- issue: saeculum의 해석
  chosen_reading: 여기서는 종말론적 ‘세대/시대’보다 인간 존재 영역에 들어오는 것, 곧 출생을 가리키는 관용으로 읽었습니다.
  alternative_readings:
  - ‘아직 시대에 들어오지 않은 이들’로 직역하는 해석
  - ‘아직 세대 안에 들어오지 않은 이들’로 옮기는 해석
  rationale: 본문의 라틴어 구문과 영어 POB의 최신 조정이 모두 관용적 출생 표현을 지지하므로, 독자가 오해 없이 의미를 이해하도록 했습니다.
  doctrine_reference: 2 Esdras 7:132 문맥 주해
- issue: Most High의 호칭 처리
  chosen_reading: ‘지극히 높으신 분’으로 신적 칭호를 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 원문은 명시적으로 Θεός가 아니라 칭호 Altissimus를 쓰므로, 한국어도 칭호 자체를 보존해 문체와 신학적 간격을 유지했습니다.
  doctrine_reference: 하나님의 칭호 번역 원칙
