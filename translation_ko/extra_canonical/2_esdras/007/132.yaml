translation:
  language: ko
  text: 나는 대답하여 말했습니다. “주님, 지극히 높으신 분께서 이제 자비로우신 분이라 불리시는 까닭은 아직 세상에 나오지 않은 이들[a]에게도 자비를 베푸시기 때문임을 압니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아직 세상(또는 시대)에 이르지 않은 이들’입니다. 여기서는 출생, 곧 세상에 나옴을 가리키는 관용적 표현으로 이해했습니다.
    reason: 원문의 saeculo가 지닌 문자적 의미 범위를 알리면서, 문맥상 관용적 출생 의미를 설명합니다.
