revisions:
- from: 그리고 예고된 재앙들에서 구원받은 자마다 나의 놀라운 일들을 보게 될 것입니다.[a]
  to: 또 예고된 재앙들에서 구원받은 사람은 모두 나의 경이로운 일들을 보게 될 것입니다.
  rationale: 본문의 포괄성(omnis qui)을 ‘사람은 모두’로, 구원(liberatus est)과 예고된 재앙(praedictis malis)을 그대로 유지했습니다. 라틴어 ipse의 강조는 한국어의 자연스러운 주제-서술 구조에서 별도의 ‘그는’ 없이 표현했으며, mirabilia를 더 정확한 ‘경이로운 일들’로 다듬었습니다. 근거 없는 해설성 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:11Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 핵심 요소(‘예고된 재앙들/불행들’, 그로부터의 구원, ‘나의’ 경이로운 일들을 봄)를 충실히 반영합니다. 다만 mirabilia는 단순히 놀랍다는 성질보다 경이로운 행위·일을 가리키므로 ‘경이로운 일들’이 더 정확합니다. ipse의 재지시적 강조는 한국어에서 별도 대명사 없이 주제 구조로 자연스럽게 전달됩니다.
  naturalness: ‘자마다’도 가능하지만, 현대 표준어 합쇼체에서는 ‘사람은 모두’가 더 매끄럽습니다. 문두의 et는 문맥 연결을 위해 ‘또’로 옮기는 것이 자연스럽습니다.
  terminology: praedictis malis는 이 문맥에서 예고된 재난/재앙을 뜻할 수 있으므로 ‘예고된 재앙들’을 유지합니다. mirabilia mea는 ‘나의 경이로운 일들’로 옮깁니다. 기존 각주는 본문에 없는 해설적 주장이고 유의미한 대안을 제시하지 않으므로 삭제하는 것이 적절합니다.
  issues:
