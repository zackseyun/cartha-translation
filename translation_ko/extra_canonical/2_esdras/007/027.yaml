translation:
  language: ko
  text: 또 예고된 재앙들에서 구원받은 사람은 모두 나의 경이로운 일들을 보게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: omnis qui
  english_pob_choice: everyone who
  chosen_korean: 예고된 재앙들에서 구원받은 자마다
  alternatives_korean:
  - 구원받은 모든 사람은
  - 구출된 자마다
  lexicon: omnis qui
  rationale: 포괄적 관계절 구조를 한국어에서도 자연스럽게 살리되, 문맥상 ‘재앙들’이 앞서 예고된 심판을 가리키므로 이를 분명히 했습니다.
- source_word: liberatus est
  english_pob_choice: is delivered
  chosen_korean: 구원받은
  alternatives_korean:
  - 해방된
  - 건짐을 받은
  lexicon: liberatus est
  rationale: 라틴어 liberatus est는 단순한 탈출보다 구출·해방의 결과를 뜻하므로, 문맥에 맞게 ‘구원받은’으로 옮겼습니다.
- source_word: praedictis malis
  english_pob_choice: the evils foretold
  chosen_korean: 예고된 재앙들
  alternatives_korean:
  - 예언된 악들
  - 앞서 말해진 불행들
  lexicon: praedictis malis
  rationale: malis는 도덕적 ‘악’보다 종말론적 심판·재난의 뉘앙스가 강하므로, 한국어 독자에게 자연한 ‘재앙들’로 옮겼습니다.
- source_word: mirabilia mea
  english_pob_choice: my wonders
  chosen_korean: 나의 놀라운 일들
  alternatives_korean:
  - 나의 기이한 일들
  - 내가 행한 경이들
  lexicon: mirabilia mea
  rationale: mirabilia는 하나님의 경이로운 행위를 가리키므로, 기존 교회어보다 직역성이 있으면서도 의미가 드러나는 ‘놀라운 일들’을 택했습니다.
theological_decisions:
- issue: 지칭되는 ‘재앙들’의 성격
  chosen_reading: 종말론적 심판으로 예고된 재난들을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 도덕적 악행 일반
  - 단순한 불운이나 어려움
  rationale: praedictis malis는 ‘예고된’ 재앙이라는 점이 핵심이므로, 추상적 악보다 앞으로 닥칠 심판성 재난으로 읽는 것이 본문 흐름에 더 충실합니다.
  doctrine_reference: apocalyptic judgment
