id: 2ES.7.17
reference: 2 Esdras 7:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et respondi et dixi: dominator domine, ecce disposuisti in lege tua, quoniam iusti hereditabunt haec, impii autem peribunt.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/017.yaml
  text: Then I answered and said[a], “O sovereign Lord, behold, you have ordained in your law that the righteous will inherit these things[b], but the ungodly will perish.
  footnotes:
  - marker: a
    text: Or 'you have ordained'.
    reason: previous_rendering
  - marker: b
    text: Or 'O Lord who rules'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 대답하여 말했습니다. 「오, 주권자이신 주님[b], 보십시오, 주님의 율법에 주님께서 의인들은 이것들을 상속받을 것이고, 악인들은 멸망할 것이라고 정하셨습니다[a].」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신께서 정하셨습니다’.
    reason: previous_rendering; ‘정하셨습니다’에 대한 기존 대안 표현이므로 해당 술어에 표지를 연결했습니다.
  - marker: b
    text: 또는 ‘오, 다스리시는 주님’.
    reason: previous_rendering; dominator domine의 대안적 호칭 번역입니다.
lexical_decisions:
- source_word: et respondi et dixi
  english_pob_choice: Then I answered and said
  chosen_korean: 그때 내가 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말했습니다
  - 그리고 내가 대답하여 말했습니다
  lexicon: respondi / dixi
  rationale: 라틴어의 병렬 동사 두 개를 자연스러운 서술 흐름으로 살려, 단순한 ‘말하다’보다 응답의 뉘앙스를 먼저 두었습니다.
- source_word: dominator domine
  english_pob_choice: O sovereign Lord
  chosen_korean: 오, 주권자이신 주님
  alternatives_korean:
  - 오, 다스리시는 주님
  - 오, 주님이시며 통치자이신 분
  lexicon: dominator domine
  rationale: 반복된 호격을 직역해 서술절로 풀기보다, 영어 POB의 판단을 따라 apocalyptic한 호칭으로 옮겼습니다.
- source_word: ecce
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: ecce
  rationale: 문맥상 화자의 법적 전제를 강조하는 시선 유도 표현이므로, 현대 합쇼체에 맞는 명령형으로 살렸습니다.
- source_word: in lege tua
  english_pob_choice: in your law
  chosen_korean: 주님의 율법 안에서
  alternatives_korean:
  - 주님의 율법에서
  - 주님의 법 안에서
  lexicon: lex / νόμος
  rationale: 문맥이 토라/계시 규범을 가리키므로 ‘율법’을 유지하고, 위치 관계는 한국어 자연성을 위해 ‘안에서’로 옮겼습니다.
- source_word: iusti hereditabunt haec
  english_pob_choice: the righteous will inherit these things
  chosen_korean: 의인들은 이 모든 것을 상속받을 것이라고
  alternatives_korean:
  - 의인들은 이것들을 상속받을 것이라고
  - 의인들은 이 일을 유산으로 받을 것이라고
  lexicon: iusti / hereditabunt
  rationale: 의인과 상속 이미지를 분명히 하되, haec를 앞 문맥에 걸린 복수적 지시로 이해해 ‘이 모든 것’으로 옮겼습니다.
theological_decisions:
- issue: ‘악인’과 ‘멸망’의 종말론적 대비
  chosen_reading: 의인-악인 대조를 유지하고, peribunt를 단순 소멸이 아니라 종말적 멸망으로 옮겼습니다.
  alternative_readings:
  - 사라질 것입니다
  - 없어질 것입니다
  rationale: 문맥상 언약적 판결의 결과를 말하므로, 단순한 소멸보다 책임 있는 멸망의 의미가 더 강합니다.
  doctrine_reference: 종말론적 심판의 양극 대조
