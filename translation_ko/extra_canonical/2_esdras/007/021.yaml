id: 2ES.7.21
reference: 2 Esdras 7:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mandans enim mandavit Dominus venientibus quando venerunt, quid facientes viverent, et quid observantes non punirentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/021.yaml
  text: For the Lord indeed commanded those who came, when they came, what they should do to live, and what they should observe so as not to be punished.
translation:
  language: ko
  text: 주께서는 참으로, 온 이들에게 그들이 왔을 때 무엇을 행해야 살 수 있는지와 무엇을 지켜야 벌을 받지 않을 수 있는지를 명령하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mandans enim mandavit
  english_pob_choice: For the Lord indeed commanded
  chosen_korean: 곧장 주께서 … 참으로 명령하셨습니다
  alternatives_korean:
  - 실로 주께서 … 명령하셨습니다
  - 주께서 분명히 명령하셨습니다
  lexicon: mandare / mandavit
  rationale: enim의 강조를 단순한 사실 확인으로 보아 ‘참으로/실로’로 살리고, 명령 동사를 직접 써서 원문의 중첩된 강조를 한국어에서도 드러냈습니다.
- source_word: venientibus quando venerunt
  english_pob_choice: those who came, when they came
  chosen_korean: 오너라 하는 이들에게, 그들이 올 때에
  alternatives_korean:
  - 오는 자들에게, 그들이 왔을 때
  - 찾아오는 이들에게, 그들이 도착했을 때
  lexicon: venire
  rationale: 현재적 초청과 도착의 시점을 함께 드러내기 위해 ‘오너라 하는 이들’과 ‘올 때에’를 병기해, 반복된 ven- 어근의 시간성을 살렸습니다.
- source_word: quid facientes viverent
  english_pob_choice: what they should do to live
  chosen_korean: 무엇을 해야 살아갈 수 있는지
  alternatives_korean:
  - 무엇을 행해야 살아갈 수 있는지
  - 무엇을 하여야 살 수 있는지
  lexicon: quid facere / vivere
  rationale: 단순 생존보다 삶의 지속 조건을 드러내기 위해 ‘살아갈 수 있다’로 옮겼고, facientes의 행위성을 ‘해야’로 간결하게 반영했습니다.
- source_word: quid observantes
  english_pob_choice: what they should observe
  chosen_korean: 무엇을 지켜야
  alternatives_korean:
  - 무엇을 준수해야
  - 무엇을 관찰해야
  lexicon: observare
  rationale: observare의 핵심을 ‘지키다/준수하다’로 보되, 한국어 독자에게 더 자연스러운 ‘지켜야’로 옮겨 규범 준수를 분명히 했습니다.
theological_decisions:
- issue: viverent / non punirentur의 결과 문구
  chosen_reading: 삶과 형벌 회피를 인과적으로 연결해, 순종이 생명과 무벌(不罰)로 이어진다는 원문 구조를 그대로 드러냈습니다.
  alternative_readings:
  - ‘살기 위해’와 ‘벌받지 않기 위해’로 목적화하는 읽기
  - ‘살아남고’와 ‘처벌받지 않도록’으로 더 강하게 의역하는 읽기
  rationale: 본문은 행위-삶-불벌의 조건 구조를 가지므로, 이를 도덕훈계로 완화하지 않고 원문의 인과 관계를 보존했습니다.
  doctrine_reference: 서사적 지혜 문맥에서의 순종-생명-형벌 관계
