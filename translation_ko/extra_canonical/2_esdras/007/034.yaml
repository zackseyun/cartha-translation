  yaml_path: translation/extra_canonical/2_esdras/007/034.yaml
  text: But judgment alone will remain, and truth will stand, and faith will grow strong.
translation:
  language: ko
  text: 그러나 오직 심판만 남을 것이며, 진리는 서 있을 것이고, 믿음은 굳세어질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudicium
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 심판/판단
  lexicon: iudicium
  rationale: 법정적·종말론적 맥락에서 단순한 ‘판단’보다 ‘심판’이 원문의 무게를 더 직접적으로 드러냅니다.
- source_word: solum remanebit
  english_pob_choice: alone will remain
  chosen_korean: 오직 …만 남을 것
  alternatives_korean:
  - 홀로 남을 것
  - 단지 남을 것
  lexicon: remanere
  rationale: solum의 배타성을 살려 ‘오직’과 ‘만’으로 남는 것이 심판뿐임을 강조했습니다.
- source_word: veritas stabit
  english_pob_choice: truth will stand
  chosen_korean: 진리는 서 있을 것이고
  alternatives_korean:
  - 진리는 굳게 설 것이고
  - 진리는 지속될 것이고
  lexicon: stare
  rationale: stabit의 ‘서다’ 이미지를 유지해, 진리가 흔들리지 않고 확고히 존속함을 표현했습니다.
- source_word: fides convalescet
  english_pob_choice: faith will grow strong
  chosen_korean: 믿음은 굳세어질 것입니다
  alternatives_korean:
  - 믿음은 강해질 것입니다
  - 믿음은 회복될 것입니다
  lexicon: convalescere
  rationale: convalescet의 ‘강해지다/회복되다’ 의미를 반영하되, 문맥상 긍정적 강화의 뉘앙스를 살려 ‘굳세어지다’로 옮겼습니다.
theological_decisions:
- issue: ‘faith’의 의미 범위
  chosen_reading: 여기서는 개인 내면의 심리 상태보다 종말론적 질서 속에서 유지·강화되는 ‘믿음’으로 번역했습니다.
  alternative_readings:
  - 신실함
  - 신뢰
  rationale: 라틴어 fides는 믿음/신실함의 폭이 있으나, POB 영어가 ‘faith’를 택했고 문맥상 공동체적·종말론적 신앙을 가리키므로 ‘믿음’이 가장 직접적입니다.
  doctrine_reference: fides semantics in apocalyptic context
