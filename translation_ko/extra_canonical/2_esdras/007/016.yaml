  text: And why have you not taken to heart what is to come, rather than what is present?”
translation:
  language: ko
  text: 그런데 왜 너는 장차 올 것을 마음에 두지 않고, 현재의 것만 마음에 두었습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et quare
  english_pob_choice: And why
  chosen_korean: 그런데 왜
  alternatives_korean:
  - 왜
  - 그리고 왜
  lexicon: Latin quare
  rationale: 문맥상 단순한 접속보다 이전 논지를 잇는 반문이므로, 한국어에서는 자연스러운 반문 전환인 ‘그런데 왜’로 옮겼습니다.
- source_word: accepisti in corde tuo
  english_pob_choice: have you taken to heart
  chosen_korean: 마음에 두었습니까
  alternatives_korean:
  - 마음에 받아들였습니까
  - 마음으로 간직했습니까
  lexicon: Latin cor / in corde
  rationale: 직역적 ‘가슴에 받아들이다’보다, 판단과 관심의 초점을 마음에 두는 의미를 현대 한국어로 가장 자연스럽게 드러냈습니다.
- source_word: quod futurum / quod in praesenti
  english_pob_choice: what is to come / what is present
  chosen_korean: 장차 올 것 / 현재의 것
  alternatives_korean:
  - 앞으로 올 것 / 지금 있는 것
  - 오는 일 / 지금의 것
  lexicon: Latin futurum / praesenti
  rationale: 대조 구조를 살리기 위해 미래와 현재의 항목성을 분명하게 표현했습니다.
theological_decisions:
- issue: 미래와 현재의 대비를 권면적 질문으로 유지할지 여부
  chosen_reading: 미래의 것에 마음을 두지 않고 현재의 것에 머문 태도를 책망하는 반문으로 유지했습니다.
  alternative_readings:
  - 단순 정보 질문처럼 완화하기
  - 설명문으로 풀어 쓰기
  rationale: 원문은 단순한 정보 요청이 아니라 도덕적·예언적 판단을 담은 반문이므로, 그 긴장을 보존해야 합니다.
  doctrine_reference: 문맥상 회개와 종말적 분별을 촉구하는 예언적 수사
