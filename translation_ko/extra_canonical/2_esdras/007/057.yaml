source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: æramentum, plumbum super ferrum, et fictile super plumbum. Aestima et tu, quæ sint pretiosa et desiderabilia, quod multiplicatur aut quod rarum nascitur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/057.yaml
  text: 'So judge for yourself which things are precious and desirable: what is abundant, or what is born rare?'
translation:
  language: ko
  text: 그러므로 어떤 것이 귀하고 바람직한지 스스로 판단해 보십시오 — 많은 것입니까, 아니면 드물게 태어나는 것입니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘어떤 것이 희귀하게 태어나는가’라는 뜻으로, 영어 POB의 ‘born rare’를 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: Aestima et tu
  english_pob_choice: So judge for yourself
  chosen_korean: 스스로 판단해 보십시오
  alternatives_korean:
  - 스스로 헤아려 보십시오
  - 스스로 분별해 보십시오
  lexicon: aestimare
  rationale: 판단의 행위를 분명히 드러내면서, 청자에게 직접 숙고를 요구하는 명령형을 자연스러운 합쇼체로 옮겼습니다.
- source_word: quæ sint pretiosa et desiderabilia
  english_pob_choice: which things are precious and desirable
  chosen_korean: 어떤 것이 귀하고 바람직한지
  alternatives_korean:
  - 어떤 것이 값지고 원하는지
  - 어떤 것이 소중하고 바라게 되는지
  lexicon: pretiosus / desiderabilis
  rationale: pretiosa를 ‘귀하다’로, desiderabilia를 현대 한국어에서 자연스러운 평가어인 ‘바람직하다’로 옮겨 가치 판단의 의미를 유지했습니다.
- source_word: quod multiplicatur
  english_pob_choice: what is abundant
  chosen_korean: 많은 것
  alternatives_korean:
  - 풍부한 것
  - 많이 증식하는 것
  lexicon: multiplicare
  rationale: 반복·증가의 결과를 간결하게 담기 위해 ‘많은 것’으로 옮겼습니다. 문맥상 희귀함과 대비되는 풍성함을 드러냅니다.
- source_word: quod rarum nascitur
  english_pob_choice: what is born rare
  chosen_korean: 드물게 태어나는 것
  alternatives_korean:
  - 희귀하게 태어나는 것
  - 희소하게 생겨나는 것
  lexicon: rarus + nasci
  rationale: 영어 POB의 ‘born rare’를 따라, 희귀성이 본래 발생 방식과 연결된다는 점을 살리기 위해 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 수사적 대조의 보존
  chosen_reading: ‘많은 것’과 ‘드물게 태어나는 것’을 대조하여, 가치 판단이 수량이 아니라 희귀성과 귀함의 대비에 있음을 드러냈습니다.
  alternative_readings:
  - ‘풍부한 것’과 ‘희귀한 것’으로 일반화할 수 있음
  - ‘많이 나는 것’과 ‘드물게 나는 것’으로 더 평이하게 할 수 있음
  rationale: 이 구절은 단순 정보 전달이 아니라 독자로 하여금 무엇이 더 귀한지 스스로 판단하게 하는 논증입니다. 따라서 대비 구조를 선명하게 유지했습니다.
  doctrine_reference: 문맥상 지혜/분별에 관한 논증이며 교리적 확정은 필요하지 않습니다.
