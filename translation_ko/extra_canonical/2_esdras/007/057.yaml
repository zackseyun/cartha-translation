  - severity: low
    issue: ‘드물게 태어나는 것’이 지나치게 생물 출생으로 한정됩니다.
    rationale: rarum nascitur는 희귀하게 생겨나거나 나타나는 것을 가리키며, 한국어에서는 ‘드물게 생겨나는 것’이 문맥과 어법에 더 맞습니다.
