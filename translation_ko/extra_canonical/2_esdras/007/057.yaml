  source_fidelity: 라틴어의 접속사 et는 ‘스스로’라는 강조에 충분히 반영되지만, 초안의 ‘그러므로’는 제시된 본문에 근거가 없습니다. 또한 nascitur는 이 문맥에서 생물의 출생이라기보다 ‘생겨나다/나오다’를 뜻할 수 있으므로, ‘태어나는’보다 넓은 표현이 적절합니다.
  naturalness: ‘드물게 태어나는 것’은 한국어에서 주로 생물의 출생을 연상시켜 가치와 희소성을 논하는 수사적 대조에 다소 부자연스럽습니다. ‘드물게 생겨나는 것’은 현대 표준어 합쇼체에서 자연스럽고 원문의 발생·희소성 연결을 보존합니다.
  terminology: pretiosa et desiderabilia는 ‘귀하고 바람직한’으로 적절합니다. quod multiplicatur는 영어 POB의 ‘abundant’와 수사적 대조를 따라 ‘풍부한 것’으로 옮기는 편이 ‘많은 것’보다 평가 대상의 일반성을 더 잘 살립니다.
  issues:
