lexical_decisions:
- source_word: ad numerum eorum
  english_pob_choice: by their number
  chosen_korean: 그 수에 따라
  alternatives_korean:
  - 그들의 수대로
  - 그 숫자에 따라
  - 그 수를 따라
  lexicon: numerus
  rationale: 수량적 기준을 그대로 살려, 단순히 ‘수’가 아니라 ‘그 수에 따라’로 배열·조정의 의미를 드러냈습니다.
- source_word: compones eos tibi
  english_pob_choice: you will sort them for yourself
  chosen_korean: 너희를 너희 자신에게 맞게 정하실 것이나
  alternatives_korean:
  - 너희를 너희를 위해 정렬하실 것이나
  - 너희를 스스로를 위해 배열하실 것이나
  - 너희를 자기 몫으로 따로 두실 것이나
  lexicon: componere
  rationale: componere는 단순 분류보다 ‘알맞게 맞추다/배열하다’의 뉘앙스가 있어, 본문 문맥을 살리면서도 판단·배치를 나타내는 표현으로 옮겼습니다.
- source_word: plumbum autem et fictile abundat
  english_pob_choice: but lead and clay are abundant
  chosen_korean: 납과 점토는 많습니다
  alternatives_korean:
  - 그러나 납과 진흙그릇은 많습니다
  - 하지만 납과 토기는 풍부합니다
  - 그러나 납과 도기는 넘칩니다
  lexicon: plumbum / fictile
  rationale: plumbum은 ‘납’으로 직역하고, fictile은 ‘점토’로 옮겨 재질상의 대조를 보존했습니다. 여기서는 도자기보다 원재료인 점토가 더 직접적입니다.
