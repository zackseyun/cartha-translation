  to: 그리고 고통의 구덩이가 나타날 것이며, 그 맞은편에는 안식의 곳이 있을 것입니다. 게헨나의 화덕이 드러날 것이며, 그 맞은편에는 기쁨의 낙원이 있을 것입니다.[a][b]
  rationale: 라틴어와 영어 POB의 미래 시제 및 두 쌍의 공간적 대조를 보존했습니다. clibanus의 지시 대상을 정확히 ‘화덕’으로 옮겼고, 영어 감사 이력에 있는 회수 단편 및 대안 번역 주석을 한국어로 복원했습니다. 결락 단편 주석의 역사적 설명은 필요한 본문비평 정보만 간결히 제시했습니다.
