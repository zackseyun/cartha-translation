id: 2ES.7.36
reference: 2 Esdras 7:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et apparebit lacus tormenti, et contra illum erit locus requietionis ; et clibanus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/007/036.yaml
  text: And the pit of torment will appear[a], and opposite it will be the place of rest; and the furnace of Gehenna will be shown[b], and opposite it the paradise of delight.
  footnotes:
  - marker: a
    text: Verses 7:36-105 are Bensly's 'Missing Fragment.' Cut from most medieval Latin manuscripts -- almost certainly because this section teaches that intercession for the damned is refused, which later Christian piety found difficult -- and therefore absent from the Vulgate and from the KJV 1611, where verse 7:35 was followed directly by what older editions numbered as verse 7:36 some seventy verses later. Robert Bensly recovered the fragment from a Spanish manuscript in 1875 and it is now restored in all modern critical editions.
    reason: recovered_fragment
    anchor_ref: '7:36'
  - marker: b
    text: Or 'Then the pit of torment will appear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 고통의 구덩이가 나타날 것이며, 그 맞은편에는 안식의 곳이 있을 것입니다. 게헨나의 화덕이 드러날 것이며, 그 맞은편에는 기쁨의 낙원이 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 7장 36–105절은 벤슬리가 발견한 ‘결락 단편’입니다. 이 부분은 대부분의 중세 라틴어 사본에서 빠져 있으며, 따라서 불가타와 킹제임스성경 1611년판에도 없습니다. 로버트 벤슬리는 1875년에 스페인 사본에서 이 단편을 발견했으며, כיום의 현대 비평 본문들에는 복원되어 있습니다.
    reason: recovered_fragment
  - marker: b
    text: 또는 “그때 고통의 구덩이가 나타날 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: lacus tormenti
  english_pob_choice: the pit of torment
  chosen_korean: 고통의 구덩이
  alternatives_korean:
  - 고문의 구덩이
  - 고통받는 웅덩이
  - 형벌의 구덩이
  lexicon: lacus
  rationale: lacus는 문자적으로 ‘호수’일 수 있지만, 여기서는 English POB의 ‘pit’에 맞춰 함정/저류의 이미지가 살아 있는 ‘구덩이’로 옮겼습니다. tormenti는 ‘고통’으로 직역해 심판의 장소라는 의미를 보존했습니다.
- source_word: locus requietionis
  english_pob_choice: the place of rest
  chosen_korean: 안식의 곳
  alternatives_korean:
  - 쉬는 곳
  - 휴식의 장소
  - 안식처
  lexicon: locus
  rationale: requietionis는 단순 휴식보다 ‘쉬어 잠잠해지는 안식’의 뉘앙스가 있어, 본문 대조를 살리며 간결한 ‘안식의 곳’으로 옮겼습니다.
- source_word: clibanus
  english_pob_choice: the furnace of Gehenna
  chosen_korean: 게헨나의 풀무
  alternatives_korean:
  - 게헨나의 용광로
  - 게헨나의 화덕
  - 지옥의 풀무
  lexicon: clibanus
  rationale: clibanus는 제빵용 화덕/가마를 가리키는 말이라, English POB의 ‘furnace’보다 구체적인 ‘풀무’가 아니라면 한국어 독자가 과열된 심판의 장치 이미지를 놓치기 쉽습니다. 다만 한국어 관용을 고려해 ‘풀무’로 압축했습니다.
- source_word: paradisus voluptatis
  english_pob_choice: the paradise of delight
  chosen_korean: 기쁨의 낙원
  alternatives_korean:
  - 즐거움의 낙원
  - 쾌락의 낙원
  - 희락의 낙원
  lexicon: paradisus
  rationale: voluptatis는 단순 쾌락보다 ‘기쁨/즐거움’의 긍정적 충만을 가리키므로, 과도하게 감각적인 표현을 피하고 ‘기쁨의 낙원’으로 옮겼습니다.
theological_decisions:
- issue: 심판과 안식, 형벌과 낙원의 병렬 대조
  chosen_reading: 본문이 네 개의 대응 항목을 병렬로 제시하는 대조 구조를 그대로 드러내었습니다.
  alternative_readings:
  - 앞 절들처럼 설명적으로 풀어 쓰는 번역
  - 첫 항목만 문장으로 묶어 처리하는 번역
  rationale: Latin의 반복적 'Et'와 'et contra illum' 구조가 심판과 위로의 공간을 짝지어 대비하므로, 한국어에서도 같은 대조를 유지하는 것이 본문의 신학적 긴장을 보존합니다.
  doctrine_reference: 종말론적 상벌의 병렬 대비
