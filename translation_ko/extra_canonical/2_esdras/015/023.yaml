translation:
  language: ko
  text: 그의 분노에서 불이 나와 땅의 기초를 삼키고, 죄인들은 볏짚처럼 타버립니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그의 분노에서 불이 나와 땅의 기초와 죄인들을 삼키고, 죄인들은 볏짚처럼 타버립니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: exiit ignis ab ira eius
  english_pob_choice: And fire went out from his wrath
  chosen_korean: 그의 분노에서 불이 나와
  alternatives_korean:
  - 그의 진노에서 불이 나와
  - 그의 분노로부터 불이 나와
  lexicon: ira
  rationale: 라틴어 ira를 POB의 ‘wrath’에 맞춰 직역하되, 현대 한국어에서는 ‘진노’보다 ‘분노’가 감정의 분출을 더 자연스럽게 드러내어 본문 흐름을 살렸습니다.
- source_word: devoravit fundamenta terrae
  english_pob_choice: devoured the foundations of the earth
  chosen_korean: 땅의 기초를 삼키고
  alternatives_korean:
  - 땅의 기초를 먹어 삼키고
  - 땅의 터전을 삼키고
  lexicon: fundamenta terrae
  rationale: fundamenta를 ‘기초’로 두어 지층적·우주론적 붕괴 이미지를 보존했고, 동사 devoravit는 ‘삼키다’로 옮겨 파괴의 강도를 유지했습니다.
- source_word: peccatores quasi stramen incensum
  english_pob_choice: sinners like straw set ablaze
  chosen_korean: 죄인들은 볏짚처럼 타버립니다
  alternatives_korean:
  - 죄인들은 짚처럼 불붙습니다
  - 죄인들은 짚단처럼 타들어 갑니다
  lexicon: peccatores / stramen
  rationale: peccatores는 ‘죄인들’로 직역하고, quasi stramen incensum은 ‘볏짚처럼 타버립니다’로 옮겨 타는 재료와 결과를 함께 살렸습니다.
theological_decisions:
- issue: 심판 이미지의 강도 유지
  chosen_reading: 불이 하나님의 분노에서 나와 땅의 기초와 죄인들을 파괴하는 종말론적 심판으로 제시합니다.
  alternative_readings:
  - 상징적 경고로만 완화하는 읽기
  - 자연재해 묘사로 축소하는 읽기
  rationale: 본문은 인과 관계(분노 → 불 → 파괴)를 분명히 제시하므로, 심판의 직접성과 강도를 약화하지 않고 그대로 반영했습니다.
  doctrine_reference: 종말론적 심판
- issue: ‘볏짚처럼’의 비유 보존
  chosen_reading: 죄인들의 소멸을 단순한 연소가 아니라, 쉽게 타 없어지는 재료에 대한 비유로 유지했습니다.
  alternative_readings:
  - 의미를 풀어 ‘쉽게 사라집니다’로 의역
  - ‘짚’ 이미지 없이 단순히 ‘타버립니다’로 처리
  rationale: quasi는 명시적 비유 표지이므로, 한국어에서도 비교 표현을 살려 독자가 대비를 즉시 인식하도록 했습니다.
  doctrine_reference: 수사적 비유
