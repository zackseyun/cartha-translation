revisions:
- from: 그의 분노에서 불이 나와 땅의 기초를 삼키고, 죄인들은 볏짚처럼 타버립니다.[a]
  to: 그의 분노에서 불이 나와 땅의 기초와 죄인들을 불붙은 짚처럼 삼켜 버렸습니다.
  rationale: 원문의 완료형과 devoravit의 포괄 범위를 반영하여, 불이 땅의 기초와 죄인들을 모두 삼킨다는 구조를 한국어로 직접 옮겼습니다. ‘불붙은 짚처럼’은 quasi stramen incensum의 비유를 보존합니다. 현 영어 각주는 문장부호에 따른 해석상 가능성을 기록하지만, 한국어에서는 수정문 자체가 원문의 자연스러운 구문을 충분히 반영하므로 각주가 필요하지 않습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:14Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 주동사는 exiit와 devoravit이며, peccatores quasi stramen incensum은 devoravit의 목적어로 이해하는 것이 자연스럽습니다. 초안의 ‘죄인들은 ... 타버립니다’도 결과상 뜻은 통하지만, 원문의 ‘삼키다’ 이미지를 죄인들에게서 약화합니다. 또한 시제는 원문의 완료형에 맞추는 편이 좋습니다.
  naturalness: ‘불붙은 짚처럼 삼켜 버렸습니다’는 현대 표준어 합쇼체로 자연스럽고, 불의 파괴적 심판 이미지를 명료하게 전달합니다. ‘볏짚’도 가능하나 stramen에는 일반적인 ‘짚’이 더 넓고 무표적인 대응입니다.
  terminology: ‘분노’, ‘땅의 기초’, ‘죄인들’은 적절합니다. 다만 원문의 incensum(불붙은/불탄)을 반영하여 ‘불붙은 짚’으로 옮기고, devoravit를 두 목적어 모두에 적용하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: 죄인들에 대해 devoravit의 ‘삼키다’ 이미지가 본문에서 사라집니다.
    rationale: 초안은 ‘땅의 기초를 삼키고’와 ‘죄인들은 ... 타버립니다’를 병렬하므로, 라틴어 devoravit가 peccatores에도 걸리는 구문적 연결을 충분히 보존하지 못합니다.
  - severity: medium
    issue: 각주 대안이 원문 구문의 대안을 적절히 제시하지 못하고 ‘죄인들’이 중복됩니다.
    rationale: 각주의 ‘땅의 기초와 죄인들을 삼키고, 죄인들은 ... 타버립니다’는 목적어로 든 죄인들을 다시 주어로 반복하여 비문에 가깝고, 의미도 불필요하게 중복됩니다.
  revised_text: 그의 분노에서 불이 나와 땅의 기초와 죄인들을 불붙은 짚처럼 삼켜 버렸습니다.
