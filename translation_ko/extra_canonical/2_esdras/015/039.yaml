id: 2ES.15.39
reference: 2 Esdras 15:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et superinvalescent venti ab oriente et recludent eum et nubem quam suscitavit in ira, et sidus ad faciendam exteritionem ab orientalem notum et occidentem violabitur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/039.yaml
  text: And the winds from the east will grow strong and shut it in[a], along with the cloud that he raised up in wrath; and the star appointed to bring destruction will be violently assailed by the east wind, the south wind[b], and the west wind.
  footnotes:
  - marker: a
    text: This verse is one of the chapter's harder Latin cruxes. The rendering reflects a best-effort sense of cosmic forces being shut in and thrown into disorder, but the syntax and referents are uncertain.
    reason: textual_variant
    anchor_ref: '15:39'
  - marker: b
    text: Or 'and the cloud that he raised up in wrath, and the star appointed to bring destruction toward east and west, will be thrown into confusion.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 동쪽에서 불어오는 바람들이 세력을 얻어 그것과 그가 진노 가운데 일으킨 구름을 가두고, 멸망을 가져오도록 정해진 별은 동풍과 남풍과 서풍에게 거세게 공격받을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절은 라틴어 원문 자체가 매우 난해한 대목입니다. 특히 ‘그것’에 해당하는 말의 지시 대상은 확실하지 않습니다. 여기서는 동쪽 바람들이 그것과 진노 가운데 일으킨 구름을 가두는 것으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 다르게 끊어 읽으면, ‘그가 진노 가운데 일으킨 구름과 멸망을 가져오도록 정해진 별이 동풍과 남풍과 서풍에 의해 뒤흔들릴 것입니다’로 옮길 수도 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: superinvalescent venti ab oriente
  english_pob_choice: the winds from the east will grow strong
  chosen_korean: 동쪽에서 불어오는 바람들이 거세져
  alternatives_korean:
  - 동쪽 바람들이 힘을 얻어
  - 동쪽에서 온 바람들이 세져
  lexicon: venti
  rationale: 라틴어의 복수 주어와 동작성 있는 ‘superinvalescent’를 살려, 단순한 위치 표시보다 ‘거세져’로 힘이 커지는 뉘앙스를 반영했습니다.
- source_word: recludent eum
  english_pob_choice: will shut it in
  chosen_korean: 그것을 가두고
  alternatives_korean:
  - 그것을 닫아 두고
  - 그것을 봉하고
  lexicon: recludent
  rationale: 문맥상 우주적 대상을 밖에서 차단해 억눌러 두는 뜻이므로, 한국어에서는 가장 자연스러운 ‘가두고’로 옮겼습니다.
- source_word: nubem quam suscitavit in ira
  english_pob_choice: along with the cloud that he raised up in wrath
  chosen_korean: 그가 진노 가운데 일으킨 구름과
  alternatives_korean:
  - 그가 분노 가운데 일으킨 구름과
  - 그가 진노로 일으킨 구름과
  lexicon: nubem / suscitavit in ira
  rationale: ‘suscitavit’의 ‘일으키다’와 ‘in ira’의 진노 상태를 함께 살려, 구름을 단순한 배경이 아니라 하나님의 분노로 उठ게 된 대상임을 드러냈습니다.
- source_word: sidus ad faciendam exteritionem
  english_pob_choice: the star appointed to bring destruction
  chosen_korean: 멸망을 일으키도록 정해진 별
  alternatives_korean:
  - 파멸을 일으키도록 정해진 별
  - 파괴를 가져오도록 마련된 별
  lexicon: sidus / exteritio
  rationale: ‘ad faciendam exteritionem’의 목적구를 반영해, 별의 기능이 ‘멸망을 일으키는 것’임을 직접적으로 표현했습니다.
- source_word: ab orientalem notum et occidentem violabitur
  english_pob_choice: will be violently assailed by the east wind, the south wind, and the west wind
  chosen_korean: 동풍과 남풍과 서풍이 거세게 치게 될 것입니다
  alternatives_korean:
  - 동풍과 남풍과 서풍에 의해 심하게 공격받을 것입니다
  - 동풍과 남풍과 서풍이 거세게 해칠 것입니다
  lexicon: violabitur
  rationale: 수동태 ‘violabitur’의 피해를 살리되, 우주적 시문맥에 맞게 ‘거세게 치다’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 하나님의 진노로 일으켜진 구름과 우주적 바람들의 작용을 어떻게 표현할지
  chosen_reading: 구름과 바람들을 실제적 자연현상이라기보다 종말론적 심판의 도구로 읽되, 본문이 가진 우주적 충돌 이미지를 유지했습니다.
  alternative_readings:
  - 비유적 자연재해 묘사로 완화해서 읽기
  - 보다 신화적 이미지로 처리하기
  rationale: 2 에스드라의 문맥은 상징적이면서도 실제 심판 행위처럼 제시되므로, 상징성을 지우지 않으면서도 본문의 강한 심판 이미지를 보존하는 쪽을 택했습니다.
  doctrine_reference: 종말론적 심판과 하나님의 주권
