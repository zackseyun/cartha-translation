base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/041.yaml
  text: fire and hail and flying swords and many waters[b][a], so that even all the fields and all the rivers will be filled from the abundance of those waters.
  footnotes:
  - marker: a
    text: Or 'flying broadswords'.
    reason: previous_rendering
  - marker: b
    text: Or 'so that all the fields'.
    reason: previous_rendering
translation:
  language: ko
  text: 불과 우박과 날아다니는 칼들과 많은 물이 있어, 그 물들의 풍성함으로 모든 들판과 모든 강들까지도 가득 차게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘날아다니는 큰 칼들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그래서 모든 들판이’.
    reason: previous_rendering
lexical_decisions:
- source_word: ignem et grandinem
  english_pob_choice: fire and hail
  chosen_korean: 불과 우박
  alternatives_korean:
  - 불과 우박과
  - 화염과 우박
  lexicon: Latin ignis / grandinis
  rationale: 직접적인 종말론적 재난 이미지이므로 평이하고 즉각적인 한국어 명사구로 옮겼습니다.
- source_word: rompheas volantes
  english_pob_choice: flying swords
  chosen_korean: 날아다니는 칼들
  alternatives_korean:
  - 날아다니는 칼
  - 날아다니는 검들
  - 날아다니는 큰 칼들
  lexicon: Latin romphaea
  rationale: POB의 수정처럼 특정 무기명에 과도한 기술적 뉘앙스를 두지 않고, 본문이 요구하는 심판의 무기 이미지를 살려 옮겼습니다.
- source_word: ut etiam impleantur omnes campi et omnes rivi
  english_pob_choice: so that even all the fields and all the rivers will be filled
  chosen_korean: 그 물들의 풍성함으로 모든 들판과 모든 강들까지도 가득 차게 될 것입니다
  alternatives_korean:
  - 그래서 모든 들판과 모든 강들이 채워질 것입니다
  - 그리하여 모든 들판과 모든 시내가 가득 차게 될 것입니다
  lexicon: Latin ut etiam impleantur ... a plenitudine aquarum illarum
  rationale: etiam의 강조를 '까지도'로 반영해, 물이 강뿐 아니라 들판까지 넘쳐흐른다는 과장된 전면성을 드러냈습니다.
theological_decisions:
- issue: 묵시적 심판 이미지의 표현 수위
  chosen_reading: 본문의 연속적인 재난 목록을 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 은유적으로 순화하여 재해 이미지로 낮추는 번역
  rationale: 이 구절은 종말론적 심판의 압도감을 전달하므로, '날아다니는 칼들' 같은 직설적 이미지를 유지하는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: 묵시문학의 심판 표상
- issue: etiam의 강조 처리
  chosen_reading: '''까지도''로 옮겨 들판이 물로 차는 충격을 강조했습니다.'
  alternative_readings:
  - 단순히 '또한'으로 옮김
  rationale: 라틴어의 강조 기능을 반영해, 강들뿐 아니라 들판마저 채워지는 과잉성을 독자가 느끼도록 했습니다.
  doctrine_reference: 문맥적 강조의 보존
