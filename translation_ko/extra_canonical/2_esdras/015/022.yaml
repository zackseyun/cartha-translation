  yaml_path: translation/extra_canonical/2_esdras/015/022.yaml
  text: My right hand will not spare the sinners[a], nor will the sword cease against those who shed innocent blood upon the earth.
  footnotes:
  - marker: a
    text: Or 'and the broadsword will not cease from those who pour out'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 오른손은 죄인들을 용서하지 않을 것이며, 무고한 피를 땅 위에 흘리는 자들에 대해 칼도 멈추지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 라틴어의 병행 구조를 따라 직역하면 “칼도 그들을 향해 멈추지 않을 것입니다”가 될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: non parcet dextera mea
  english_pob_choice: My right hand will not spare
  chosen_korean: 내 오른손은 … 용서하지 않을 것입니다
  alternatives_korean:
  - 내 오른손은 … 아끼지 않을 것입니다
  - 내 오른손은 … 불쌍히 여기지 않을 것입니다
  lexicon: parcere
  rationale: parcere는 여기서 심판 맥락의 ‘봐주다/용서하다/아끼다’의 뜻으로 쓰였으므로, 판단적 의미를 드러내기 위해 ‘용서하지 않다’를 택했습니다.
- source_word: romphea
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 전쟁의 칼
  lexicon: ῥομφαία
  rationale: 라틴 romphea는 심판의 무기를 가리키는 apocalyptic 용법이므로, 한국어에서는 과도하게 장식적이지 않은 ‘칼’로 옮겨 문맥의 심판성을 살렸습니다.
- source_word: effundentes sanguinem innocuum super terram
  english_pob_choice: those who shed innocent blood upon the earth
  chosen_korean: 무고한 피를 땅 위에 흘리는 자들
  alternatives_korean:
  - 땅 위에 무고한 피를 흘리는 자들
  - 땅에 무죄한 피를 쏟는 자들
  lexicon: effundere sanguinem innocentem / super terram
  rationale: effundere sanguinem은 관용적으로 ‘피를 흘리다’로 옮기는 것이 자연스럽고, innocuum은 ‘무고한’으로, super terram은 ‘땅 위에’로 반영했습니다.
theological_decisions:
- issue: 심판 선언의 직접성
  chosen_reading: 본문의 두 주체를 각각 ‘내 오른손’과 ‘칼’로 분리해, 하나님의 적극적 심판 행위가 병렬적으로 진행된다는 점을 그대로 살렸습니다.
  alternative_readings:
  - ‘내 손은 … 용서하지 않을 것이며, 칼은 … 멈추지 않을 것입니다’처럼 단순화할 수 있음
  rationale: 라틴어 병렬 구조(non ... nec ...)를 보존해야 심판 선언의 강도가 약화되지 않습니다.
  doctrine_reference: 예언적 심판 어법의 평행법 보존
- issue: ‘super’의 방향성
  chosen_reading: ‘무고한 피를 땅 위에 흘리는 자들에 대해’로 처리해 칼의 작용 대상이 그들 ‘위에/against’ 향한다는 점을 드러냈습니다.
  alternative_readings:
  - ‘그들 위에’
  - ‘그들을 향해’
  rationale: 영문 POB의 최신 수정이 지적하듯 이 전치사는 단순한 장소가 아니라 심판의 대상 방향을 나타내므로, 한국어에서도 ‘대해’로 대응시켰습니다.
  doctrine_reference: 본문의 전치사·구문 정확성
