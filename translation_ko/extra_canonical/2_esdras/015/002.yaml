    reason: 첫 구절의 직역적 표현과 carta의 넓은 의미 범위를 밝혀, 원문의 표현을 보존합니다.
lexical_decisions:
- source_word: quos inmisero in os tuum
  english_pob_choice: that I will put into your mouth
  chosen_korean: 내가 네 입에 넣어 줄 것들을
  alternatives_korean:
  - 내가 네 입에 집어넣을 것들을
  - 내가 네 입에 넣게 할 것들을
  lexicon: inmisero
  rationale: 라틴어 inmittere의 ‘안에 넣다, 보내다’ 뜻을 따라, 말씀의 내용을 입에 넣어 주시는 하나님의 주도성을 드러내면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주께서 말씀하십니다
  - 주님이 말씀하십니다
  lexicon: dicit / dominus
  rationale: 직접 인용 표지로서 현재형 선언을 살리되, 예언적 화법에 맞는 공손한 서술형으로 옮겼습니다.
- source_word: Et fac ut in carta
  english_pob_choice: and cause them to be written on a scroll
  chosen_korean: 또 그것들을 한 두루마리에 기록하게 하십시오
  alternatives_korean:
  - 또 그것들을 두루마리에 쓰게 하십시오
  - 그리고 그것들이 한 두루마리에 기록되게 하십시오
  lexicon: fac ... ut ... in carta
  rationale: fac ut의 사역적 구문을 ‘기록하게 하십시오’로 풀어 원문의 강제성/사역성을 보존했고, carta를 ‘두루마리’로 옮겼습니다.
theological_decisions:
- issue: 예언적 직접화법의 주체와 문체
  chosen_reading: 주님이 직접 말씀하시는 예언적 어조를 유지하되, 한국어 본문은 합쇼체로 통일했습니다.
  alternative_readings:
  - 반말체 직접 인용
  - 더 경건한 교회식 어투
  rationale: 본문은 신탁 형식이므로 직설성과 명령성이 중요합니다. 다만 출판용 한국어로는 현대 합쇼체가 가장 투명하게 원문 기능을 살립니다.
  doctrine_reference: prophetic discourse style
