translation:
  language: ko
  text: 내가 네 입에 넣어 줄 것들을, 주님께서 말씀하십니다. 또 그것들을 한 두루마리에 기록하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
