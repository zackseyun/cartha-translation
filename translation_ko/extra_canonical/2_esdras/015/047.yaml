id: 2ES.15.47
reference: 2 Esdras 15:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: eius, Vae tibi, misera, propter quod adsimilasti ei, ornasti filias tuas in fornicatione ad placendum et gloriandum in amatoribus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/047.yaml
  text: Woe to you, miserable one, because you made yourself like her and adorned your daughters for prostitution, to please and glory in your lovers.
translation:
  language: ko
  text: “너에게 화가 있다, 비참한 자여. 네가 그 여자와 같게 되었고, 너의 딸들을 음행으로 치장하여 사랑하는 자들 앞에서 기쁘게 하고 자랑하게 하였기 때문이다.”[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 라틴어 amatoribus는 문맥상 ‘사랑하는 자들’ 또는 ‘연인들’로 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Vae tibi, misera
  english_pob_choice: Woe to you, miserable one
  chosen_korean: “너에게 화가 있다, 비참한 자여.”
  alternatives_korean:
  - “슬프다, 너는 비참한 자여.”
  - “화가 있도다, 비참한 자여.”
  lexicon: Vae
  rationale: 라틴어 경고문인 vae는 단순한 슬픔보다 심판 선언의 뉘앙스가 강하므로 ‘너에게 화가 있다’로 옮겨, 현대 표준어이면서도 예언적 책망의 힘을 살렸습니다.
- source_word: adsimilasti ei
  english_pob_choice: you made yourself like her
  chosen_korean: “네가 그 여자와 같게 되었고”
  alternatives_korean:
  - “네가 그 여자처럼 되었고”
  - “네가 그 여자와 닮게 하였고”
  lexicon: adsimilo
  rationale: adsimilasti는 ‘닮다/같아지다’의 결과를 말하므로, 행위의 결과를 분명히 드러내는 ‘같게 되었고’로 처리했습니다.
- source_word: ornasti filias tuas in fornicatione
  english_pob_choice: adorned your daughters for prostitution
  chosen_korean: “너의 딸들을 음행으로 치장하여”
  alternatives_korean:
  - “너의 딸들을 창녀짓으로 꾸며”
  - “너의 딸들을 매춘으로 장식하여”
  lexicon: ornare / fornicatio
  rationale: ornasti는 외양을 꾸미는 뜻이므로 ‘치장하다’를 살리고, fornicatione는 직접적·도덕적 타락을 가리키는 만큼 ‘음행’으로 옮겨 지나친 완곡화를 피했습니다.
- source_word: ad placendum et gloriandum in amatoribus
  english_pob_choice: to please and glory in your lovers
  chosen_korean: “사랑하는 자들 앞에서 기쁘게 하고 자랑하게 하였기 때문이다.”
  alternatives_korean:
  - “사랑하는 자들을 기쁘게 하고 그들 가운데 자랑하게 하였기 때문이다.”
  - “연인들을 만족시키고 그들 안에서 자랑하게 하였기 때문이다.”
  lexicon: placere / gloriari / amatores
  rationale: ad placendum et gloriandum은 목적을 나타내므로 ‘~하기 위해’의 의미를 포함해 문맥상 자연스러운 종속절로 처리했고, amatoribus는 문맥상 ‘사랑하는 자들/애인들’의 의미를 반영했습니다.
theological_decisions:
- issue: 예언적 저주문의 직설성과 현대 한국어의 어조
  chosen_reading: ‘너에게 화가 있다’라는 직설적 심판 선언으로 유지했습니다.
  alternative_readings:
  - ‘슬프다’처럼 감탄 위주로 완화
  - ‘화 있으라’ 같은 축약형 고어식 표현
  rationale: 원문 vae의 경고·심판 기능을 약화시키지 않기 위해, 현대어에서도 예언자적 책망이 살아 있는 직설형을 택했습니다.
  doctrine_reference: 예언 문학의 심판 선언
