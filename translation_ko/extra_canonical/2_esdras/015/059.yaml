translation:
  language: ko
  text: 당신은 우두머리로 오고, 다시 재앙을 받게 될 것입니다. 그리고 지나가면서[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 구문이 여기서 끊기므로, 다음 절로 이어지는 미완결 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: primaria
  english_pob_choice: As chief
  chosen_korean: 우두머리로
  alternatives_korean:
  - 우두머리로서
  - 맹주로
  - 주요 인물로
  lexicon: primaria
  rationale: 라틴어 primaria는 이 문맥에서 ‘최고/우두머리’의 지위를 가리키므로, 직역하되 현대 한국어에서 자연스럽고 위계감을 드러내는 ‘우두머리로’로 옮겼습니다.
- source_word: uenies
  english_pob_choice: you will come
  chosen_korean: 오고
  alternatives_korean:
  - 오실 것입니다
  - 오게 될 것입니다
  lexicon: uenio
  rationale: 문장의 진행감을 살리기 위해 미래의 도착을 ‘오고’로 풀었고, 앞의 호칭적 표현과 결합해 예언적 선언의 어조를 유지했습니다.
- source_word: mala
  english_pob_choice: evils
  chosen_korean: 재앙을
  alternatives_korean:
  - 악을
  - 해악을
  - 나쁜 일들을
  lexicon: malum
  rationale: 복수형 mala는 단순한 도덕적 ‘악’보다 닥쳐오는 해로운 일/재난의 뜻이 강하므로, 본문이 말하는 불행을 더 직접적으로 드러내는 ‘재앙’을 택했습니다.
- source_word: et in transitu
  english_pob_choice: And in passing
  chosen_korean: 그리고 지나가면서
  alternatives_korean:
  - 그리고 지나가는 동안
  - 그리고 통과하는 중에
  - 그리고 지나가며
  lexicon: in transitu
  rationale: 현재 주어진 라틴어는 문장이 끝나지 않고 다음 절로 이어지는 도입부이므로, 미완결성을 살려 ‘그리고 지나가면서’로 처리했습니다.
theological_decisions:
- issue: mala의 의미 범위
  chosen_reading: 도덕적 ‘악’이라기보다 닥쳐오는 재앙/불운으로 이해했습니다.
  alternative_readings:
  - 도덕적 악
  - 해악
  rationale: 앞뒤 예언적 재난 문맥에서는 mala가 윤리적 악보다 경험되는 재난을 가리키는 것이 자연스럽습니다.
  doctrine_reference: 문맥 기반 의미 결정
- issue: et in transitu의 미완결성
  chosen_reading: 본문을 현존 라틴어의 미완결 절로 유지해 번역했습니다.
  alternative_readings:
  - 뒤 절을 보충해 완결된 문장으로 처리
  rationale: 제공된 소스는 15:59의 끝이 다음 절로 이어지므로, 추정 보충 없이 열린 형태로 옮기는 것이 원문 충실도에 맞습니다.
  doctrine_reference: 본문 경계/절 구분
