id: 2ES.15.29
reference: 2 Esdras 15:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exient nationes draconum Arabum in curris multis, et sibilatus eorum a die itinerisfertur super terram, ut etiam timeant et trepidentur omnes qui illos audient.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/029.yaml
  text: And nations of Arabian dragons will come out with many chariots[a], and their hissing is carried over the earth from a day's journey away[b], so that all who hear them will fear and tremble.
  footnotes:
  - marker: a
    text: The phrase 'nations of Arabian dragons' follows the difficult Latin nationes draconum Arabum closely. The imagery may be symbolic, monstrous, or ethnographic in a way no longer fully recoverable from the Latin alone.
    reason: textual_variant
    anchor_ref: '15:29'
  - marker: b
    text: Or 'from the day of their march'.
    reason: previous_rendering
translation:
  language: ko
  text: 아라비아의 용들의 민족들이 많은 전차들과 함께 나와서, 그들의 쉿쉿거림이 하루 길의 거리에서도 땅 위에 퍼지므로, 그것들을 듣는 모든 이가 두려워하고 떨 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아라비아의 용들의 민족들’은 난해한 라틴어 nationes draconum Arabum을 가깝게 따른 번역입니다. 이 이미지는 상징적, 괴물적, 또는 민족지적 의미를 가질 수 있으나 라틴어만으로는 더 이상 확정하기 어렵습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘그들의 행군의 하루 길에서’라는 뜻으로도 읽을 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: nationes draconum Arabum
  english_pob_choice: nations of Arabian dragons
  chosen_korean: 아라비아의 용들의 민족들
  alternatives_korean:
  - 아라비아의 용들의 나라들
  - 아라비아의 뱀들의 민족들
  - 아라비아 용족들
  lexicon: nations / draconum / Arabum
  rationale: 라틴어의 난해한 결합을 최대한 가까이 살려, 민족(nationes)과 용(draconum), 아라비아(Arabum)의 이질적 이미지를 그대로 드러냈습니다.
- source_word: in curris multis
  english_pob_choice: with many chariots
  chosen_korean: 많은 전차들과 함께
  alternatives_korean:
  - 많은 병거들과 함께
  - 수많은 전차에 타고
  - 많은 수레를 거느리고
  lexicon: curris
  rationale: currus는 고전적·성서적 맥락에서 전차/병거를 뜻하므로, 현대 한국어에서는 의미가 분명한 전차를 택했습니다.
- source_word: sibilatus eorum
  english_pob_choice: their hissing
  chosen_korean: 그들의 쉿쉿거림
  alternatives_korean:
  - 그들의 쉬익거림
  - 그들의 쉿 소리
  - 그들의 휘파람 소리
  lexicon: sibilatus
  rationale: sibilatus의 음성적이고 위협적인 ‘쉬익/쉿’ 계열 소리를 살려, 단순한 ‘소리’보다 구체적인 의성적 표현을 사용했습니다.
- source_word: a die itineris
  english_pob_choice: from a day's journey away
  chosen_korean: 하루 길의 거리에서도
  alternatives_korean:
  - 하루 길 떨어진 곳에서도
  - 하루 여행 거리에서
  - 하루 길의 멀리서도
  lexicon: dies itineris
  rationale: 개정된 POB 주해처럼 시간표현이 아니라 거리표현으로 이해하여, ‘하루 길’이라는 관용을 한국어로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 괴물적/상징적 이미지의 처리
  chosen_reading: 본문의 ‘아라비아의 용들의 민족들’을 문자화하거나 완화하지 않고, 난해한 이미지를 그대로 보존했습니다.
  alternative_readings:
  - 상징적 존재로 풀어 쓰기
  - ‘용’ 대신 ‘뱀’으로 완화하기
  - 민족을 생략하고 전차들만 남기기
  rationale: 영어 POB 주해가 지적하듯 이 표현은 상징적, 괴물적, 또는 민족지적 의미가 섞여 있을 수 있어 완전한 복원이 어렵습니다. 따라서 의미를 단정하지 않고 원문 이미지를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 본문 난해구 보존 원칙
- issue: 두려움의 결과절
  chosen_reading: ‘두려워하고 떨 것입니다’로 결과를 미래형으로 살렸습니다.
  alternative_readings:
  - 두려워하고 떱니다
  - 두려워하며 떨게 될 것입니다
  rationale: et ... timeant et trepidantur는 결과절로서 독자에게 유발될 반응을 가리키므로, 한국어에서도 미래적 결과를 분명히 했습니다.
  doctrine_reference: 서사적 결과절 표현
