lexical_decisions:
- source_word: propterea
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그리하여
  - 그래서
  lexicon: Latin propterea
  rationale: 앞선 문맥의 결과를 이끄는 연결어로, 가장 직접적인 원인-결과 관계를 드러내는 표준적인 문어체 연결어를 택했습니다.
- source_word: Dominus
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 하나님
  lexicon: Latin Dominus
  rationale: 라틴어 Dominus는 문맥상 발화 주체인 주를 가리키므로, 합쇼체 서술에 자연스러운 ‘주님’으로 옮겼습니다.
- source_word: dicit
  english_pob_choice: says
  chosen_korean: 말씀하십니다
  alternatives_korean:
  - 말합니다
  - 이르십니다
  lexicon: Latin dicere
  rationale: 직접 인용을 여는 예언적 진술이므로, 단순한 ‘말합니다’보다 위엄과 직접성을 살리는 ‘말씀하십니다’가 source-direct합니다.
theological_decisions:
- issue: 신적 발화의 한국어 높임말 처리
  chosen_reading: 하나님/주님의 직접 발화로 읽히는 문장은 서술부에서 ‘말씀하십니다’로 높임을 유지했습니다.
  alternative_readings:
  - 말합니다
  - 이르십니다
  rationale: 본문은 단순 서술이 아니라 ‘주께서 말씀하신다’는 예언적 선언의 도입부이므로, 한국어 성경 문체에서 신적 발화의 공적·권위적 성격을 드러내는 높임말이 적절합니다.
  doctrine_reference: 신적 계시의 권위와 예언적 선언의 형식
