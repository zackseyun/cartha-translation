    rationale: 원문은 왕들이 서로에게 돌아서거나 서로 맞서게 됨을 말하며, 반드시 ‘치다’라는 물리적 폭력을 명시하지 않습니다.
  - severity: medium
    issue: ‘모아 일으켜 세워’는 convoco 및 ad movendum의 의미 관계를 불명료하고 비자연스럽게 옮깁니다.
