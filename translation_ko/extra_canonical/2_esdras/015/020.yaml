id: 2ES.15.20
reference: 2 Esdras 15:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ecce ego convoco, dicit Deus, omnes reges terrae ad movendum, qui sunt a borea et a noto et ab euro et a libano, ad convertendos in se et reddere quae dederunt illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/020.yaml
  text: Behold[a], I am summoning, says God, all the kings of the earth to stir up, those who are from the north and the south and the east and Lebanon, to turn against one another and repay what they gave them.
  footnotes:
  - marker: a
    text: Or 'and Lebanon'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오[a], 하나님께서 말씀하십니다. 저는 땅의 모든 왕들, 곧 북에서와 남에서와 동에서와 남서에서 온 자들을 모아 일으켜 세워, 서로를 치게 하고 그들이 그들에게 준 것을 갚게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 레바논’으로 읽을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: 감탄사/호소
  rationale: 예언적 선포의 주의를 환기하는 표현으로, 현대 합쇼체에서는 ‘보십시오’가 공적 선언의 격식을 유지하면서도 자연스럽습니다.
- source_word: convoco
  english_pob_choice: I am summoning
  chosen_korean: 모아 일으켜 세워
  alternatives_korean:
  - 소집하여
  - 불러 모아
  lexicon: 동사구
  rationale: 단순한 부름보다 왕들을 전장으로 동원해 충돌시키는 뉘앙스를 살리기 위해 ‘모아 일으켜 세워’로 옮겼습니다.
- source_word: a borea et a noto et ab euro et a libano
  english_pob_choice: from the north and the south and the east and the southwest
  chosen_korean: 북에서와 남에서와 동에서와 남서에서 온 자들
  alternatives_korean:
  - 북과 남과 동과 남서에서 온 자들
  - 북쪽과 남쪽과 동쪽과 남서쪽에서 온 자들
  lexicon: 방위 표현
  rationale: 라틴어의 방향 열거를 지리명으로 오해하지 않고 네 방향의 바람/방향 관용구로 이해하여, 최종적으로는 ‘남서’를 채택해 본문 의도를 반영했습니다.
- source_word: reddere quae dederunt illis
  english_pob_choice: repay what they gave them
  chosen_korean: 그들이 그들에게 준 것을 갚게 하겠습니다
  alternatives_korean:
  - 그들이 준 것을 그들에게 되갚게 하겠습니다
  - 그들이 준 것을 갚게 하겠습니다
  lexicon: 보복/상환 동사
  rationale: ‘되갚다’의 상호적·보복적 의미를 유지하되, 문맥상 직접 대상 관계를 분명히 하기 위해 ‘그들이 그들에게 준 것’으로 풀어 썼습니다.
theological_decisions:
- issue: 방향 목록의 마지막 항목
  chosen_reading: ‘a libano’를 본문의 지리명 ‘레바논’이 아니라 남서풍/남서 방향으로 이해해 ‘남서에서’로 번역했습니다.
  alternative_readings:
  - 레바논에서
  - 레바논과
  rationale: 수정된 영어 POB와 소스 비평 메모에 따라 이 항목은 지명보다 네 방위 목록의 일부로 읽어야 저자의 전 지구적 포위 이미지를 보존합니다.
  doctrine_reference: 본문 비평 및 원어 의미 보존 원칙
- issue: 하나님의 발화 형식
  chosen_reading: 직접 인용 안의 ‘말씀하십니다’를 사용해 예언적 신탁의 직접성을 살렸습니다.
  alternative_readings:
  - 말합니다
  - 이르십니다
  rationale: 라틴어 dicit Deus의 선언적 공식을 한국어 공적 문체로 옮기되, 하나님께 대한 존칭을 유지했습니다.
  doctrine_reference: 성경 문체와 경어 사용
