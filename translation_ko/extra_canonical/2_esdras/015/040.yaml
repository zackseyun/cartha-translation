id: 2ES.15.40
reference: 2 Esdras 15:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et exaltabuntur nubes magnae et validae plenaeirae et sidus, ut exterant omnem terram et inhabitantes eam, et fundent super omnemaltum et eminentem sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/040.yaml
  text: And great and mighty clouds full of wrath[a], and a star, will be lifted up to destroy all the earth and those who dwell in it, and they will pour out a dreadful star upon every high and lofty place.
  footnotes:
  - marker: a
    text: Or 'will be lifted up, full of wrath and star, to destroy'.
    reason: previous_rendering
translation:
  language: ko
  text: 크고 강한 구름들과 진노로 가득한 별이 들려 올려져, 온 땅과 그 안에 사는 이들을 멸망시킬 것이며, 모든 높은 곳과 우뚝 솟은 곳 위에 두려운 별을 쏟아부을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et exaltabuntur nubes magnae et validae
  english_pob_choice: And great and mighty clouds ... will be lifted up
  chosen_korean: 큰 힘센 구름들이 ... 높이 들려 올라와
  alternatives_korean:
  - 큰 크고 강한 구름들이 ... 들려 올라와
  - 크고 강한 구름들이 ... 높이 올라와
  lexicon: exaltabuntur
  rationale: 수동 미래의 '들려 올라가다'를 살리되, 'magnus/validus'의 이중 강조를 한국어에서 자연스럽게 '큰 힘센'으로 옮겼습니다.
- source_word: plenae irae
  english_pob_choice: full of wrath
  chosen_korean: 진노로 가득 차고
  alternatives_korean:
  - 분노로 가득 차고
  - 진노가 가득하고
  lexicon: ira
  rationale: 라틴어 속격 구조와 의미상 '분노/진노' 중 더 성경적·심판적 뉘앙스가 강한 '진노'를 택했습니다.
- source_word: et sidus
  english_pob_choice: and a star
  chosen_korean: 한 별도 함께
  alternatives_korean:
  - 별도 함께
  - 그리고 별도
  lexicon: sidus
  rationale: 문법상 '별'은 구름의 내용이 아니라 함께 들려 올라가는 공동 주어이므로, 한국어에서도 병렬 주어 관계가 드러나도록 처리했습니다.
- source_word: ut exterant omnem terram et inhabitantes eam
  english_pob_choice: to destroy all the earth and those who dwell in it
  chosen_korean: 온 땅과 그 안에 사는 자들을 멸망시키며
  alternatives_korean:
  - 온 땅과 그 안에 사는 자들을 없애며
  - 온 땅과 그 안에 거주하는 자들을 파멸시키며
  lexicon: exterant
  rationale: 완전한 파괴를 뜻하는 동사를 직역에 가깝게 '멸망시키다'로 옮겨, 대상이 땅과 거주민 모두임을 유지했습니다.
- source_word: fundent ... sidus terribile super omnem altum et eminentem
  english_pob_choice: they will pour out a dreadful star upon every high and lofty place
  chosen_korean: 두려운 별을 모든 높고 뛰어난 곳 위에 쏟아부을 것입니다
  alternatives_korean:
  - 끔찍한 별을 모든 높은 곳 위에 쏟아부을 것입니다
  - 무서운 별을 모든 높은 곳에 쏟아부을 것입니다
  lexicon: fundent / terribile
  rationale: '''pour out''의 동작성과 심판 이미지를 살려 ''쏟아붓다''를 택했고, ''terribile''은 공포·심판의 질감을 살린 ''두려운''으로 옮겼습니다.'
theological_decisions:
- issue: 별(sidus)과 구름의 관계
  chosen_reading: 별은 구름의 내용물이 아니라 함께 들려 올라가는 심판 표지로 읽었습니다.
  alternative_readings:
  - 구름이 진노와 별로 가득하다는 읽기
  - 별을 구름의 묘사 요소로 흡수하는 읽기
  rationale: 라틴어에서 'sidus'는 'plenae irae'의 수식을 받지 않는 주어이므로, 본문 문법을 따라 별과 구름의 병렬성을 유지했습니다.
  doctrine_reference: 문법-본문비평적 판단
