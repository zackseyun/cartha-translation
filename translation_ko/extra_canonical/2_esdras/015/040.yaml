    rationale: et sidus는 구름과 나란히 놓인 주어이지만, ‘함께’는 별이 구름에 동반된다는 방식으로 관계를 구체화합니다. 한국어에서는 ‘큰 구름들과 강한 구름들과, 진노로 가득한 별이’처럼 병렬 주어를 명시하는 것이 더 충실합니다.
