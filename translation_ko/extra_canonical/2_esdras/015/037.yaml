id: 2ES.15.37
reference: 2 Esdras 15:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et horrebunt qui videbunt iram illam, et tremor adprehendet illos. et post haec movebuntur nimbi copiosi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/037.yaml
  text: And those who see that wrath will shudder[a], and trembling will seize them. And after this, abundant storm-clouds will be stirred up.
  footnotes:
  - marker: a
    text: Or 'And there will be great fear and trembling upon the earth, and those who see that wrath will shudder, and trembling will seize them. After this mighty storm-clouds will be stirred up'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 진노를 보는 자들은 떨 것이며, 그들에게 떨림이 임할 것입니다. 그 후에는 많은 폭풍구름이 일어날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 진노를 보는 자들은 두려움과 떨림에 사로잡힐 것입니다. 그 후에는 많은 폭풍구름이 일어날 것입니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: horrebunt qui videbunt iram illam
  english_pob_choice: those who see that wrath will shudder
  chosen_korean: 그 진노를 보는 자들은 떨 것이며
  alternatives_korean:
  - 그 진노를 보는 자들은 몸서리칠 것이며
  - 그 진노를 보는 자들은 두려워할 것이며
  lexicon: horreo / tremo
  rationale: horrebunt는 단순한 ‘두려워하다’보다 몸이 반응하는 ‘떨다/몸서리치다’에 가깝고, 영어 POB의 shudder를 따라 ‘떨다’로 옮겼습니다.
- source_word: tremor adprehendet illos
  english_pob_choice: trembling will seize them
  chosen_korean: 그들에게 떨림이 임할 것입니다
  alternatives_korean:
  - 떨림이 그들을 사로잡을 것입니다
  - 떨림이 그들을 덮칠 것입니다
  lexicon: adprehendo
  rationale: adprehendet는 ‘붙잡다, 사로잡다’의 강한 동작을 가지지만, 한국어에서는 자연스럽고 문자적인 대응으로 ‘임하다’를 택해 피동적 압박을 살렸습니다.
- source_word: et post haec movebuntur nimbi copiosi
  english_pob_choice: And after this, abundant storm-clouds will be stirred up
  chosen_korean: 그 후에는 많은 폭풍구름이 일어날 것입니다
  alternatives_korean:
  - 그 뒤에는 풍성한 폭풍구름이 일어날 것입니다
  - 그 후에는 많은 폭풍구름이 흔들릴 것입니다
  lexicon: moveo / nimbi copiosi
  rationale: movebuntur는 단순한 존재 서술이 아니라 ‘일어나다/일렁이다’의 동적 이미지이고, nimbi copiosi는 ‘abundant’에 맞춰 ‘많은’으로, 번역문이 v.40의 ‘mighty’와 구별되도록 했습니다.
theological_decisions:
- issue: 재난 묘사의 표현 강도
  chosen_reading: ‘진노’와 ‘폭풍구름’의 이미지를 직역에 가깝게 유지해, 심판 장면의 공포와 연속적 재앙성을 약화하지 않았습니다.
  alternative_readings:
  - ‘분노’로 완화
  - ‘큰 폭풍구름’처럼 과장된 표현
  rationale: 본문은 감정적 분노보다 하나님의 심판으로서의 격렬한 진노를 말하며, copiosi는 ‘mighty’가 아니라 ‘abundant’이므로 강도를 임의로 높이지 않았습니다.
  doctrine_reference: 종말론적 심판 묘사
- issue: 문장 리듬과 사건 연쇄
  chosen_reading: 두 개의 독립 절을 유지해, ‘보는 자들의 떨림’과 ‘그 후의 폭풍구름’이 연속된 심판의 전개임을 드러냈습니다.
  alternative_readings:
  - 한 문장으로 압축
  - 접속을 약화해 서술
  rationale: 라틴어의 et... et post haec 구조를 살려 사건의 순차성을 보존하는 것이 원문 이해에 유리합니다.
  doctrine_reference: 서사적-묵시적 구조
