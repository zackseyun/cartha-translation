id: 2ES.15.56
reference: 2 Esdras 15:56
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut facies electis meis, dicit Dominus, sic faciet tibi Deus et tradet te in malis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/056.yaml
  text: As you do to my chosen ones[a], says the Lord, so God will do to you and will hand you over to evils.
  footnotes:
  - marker: a
    text: Or 'Your cities will be shattered, and all yours in the field will fall by the sword.'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희가 내 택한 자들에게 행한 것같이 — 주님께서 말씀하십니다 — 하나님도 너희에게 그와 같이 행하시고, 너희를 환난에 넘기실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electis meis
  english_pob_choice: my chosen ones
  chosen_korean: 내 택한 자들
  alternatives_korean:
  - 내가 택한 사람들
  - 내 선택된 자들
  - 내 택한 이들
  lexicon: electus
  rationale: 라틴어 electis meis는 ‘내가 택한 이들’의 의미이므로, 하나님의 주권적 선택을 드러내는 ‘택한 자들’로 옮겼습니다.
- source_word: Dicit Dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주님께서 이르십니다
  - 주님이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: dico
  rationale: 직접 화법의 주어가 주님이므로 현대 합쇼체의 자연스러운 신적 발화로 처리했습니다.
- source_word: Deus
  english_pob_choice: God
  chosen_korean: 하나님
  alternatives_korean:
  - 하느님
  - 주님
  lexicon: Deus
  rationale: POB 기본 용례에 따라 Deus는 ‘하나님’으로 유지했습니다.
- source_word: tradet te in malis
  english_pob_choice: will hand you over to evils
  chosen_korean: 너희를 환난에 넘기실 것입니다
  alternatives_korean:
  - 너희를 악들에 넘기실 것입니다
  - 너희를 재앙들에 넘기실 것입니다
  - 너희를 환난 속에 넘기실 것입니다
  lexicon: trado + mala
  rationale: malis의 복수형은 단순한 추상적 ‘악들’보다 실제적인 재앙·고통의 결과를 가리키므로, 문맥상 ‘환난’으로 옮기되 ‘넘기실 것입니다’로 심판적 인도를 살렸습니다.
theological_decisions:
- issue: 주님과 하나님이 연속해서 언급되는 이중 주체
  chosen_reading: 라틴어 원문의 문법을 따라 ‘주님께서 말씀하십니다’와 ‘하나님도’의 이중 주체를 그대로 살렸습니다.
  alternative_readings:
  - 둘을 하나의 호칭으로 통합하는 번역
  - 주님/하나님 중 하나만 남기는 번역
  rationale: 본문은 인용 표지(Dicit Dominus) 뒤에 다시 Deus를 두어 문장 효과를 강화하므로, 이를 합쳐 버리면 원문의 강조가 약해집니다.
  doctrine_reference: 성경 본문 문법과 수사 구조 보존
