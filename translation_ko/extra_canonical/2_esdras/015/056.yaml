revisions:
- from: 너희가 내 택한 자들에게 행한 것같이 — 주님께서 말씀하십니다 — 하나님도 너희에게 그와 같이 행하시고, 너희를 환난에 넘기실 것입니다.
  to: 네가 내 택한 이들에게 하는 대로, 주님께서 말씀하십니다, 하나님께서도 네게 그렇게 하시고 너를 재앙에 넘기실 것입니다.
  rationale: 원문의 단수 2인칭과 facies의 비과거적 의미를 보존했습니다. ‘재앙에 넘기실 것입니다’는 tradet te in malis의 심판적 의미와 mala의 복수적 재난 개념을 한국어에서 자연스럽게 전달합니다. 본문과 무관한 이전 번역 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:20Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어 facies, tibi, te는 모두 단수 ‘너’를 가리키는데, 초안은 ‘너희’로 복수화했습니다. 또한 facies를 과거 완료처럼 ‘행한 것’으로 옮긴 것은 원문의 현재/미래적 표현과 맞지 않습니다. tradet ... in malis는 심판으로 재앙에 넘기신다는 뜻으로 자연스럽게 보존할 수 있습니다.
  naturalness: 수정문은 현대 표준어 합쇼체를 유지하면서 조건·상응 구조를 ‘~하는 대로, ~그렇게 하시고’로 명료하게 드러냅니다.
  terminology: electis meis는 ‘내 택한 이들’, Dominus는 인용 표지에서 ‘주님’, Deus는 이어지는 서술에서 ‘하나님’으로 유지했습니다. 원문이 병치하는 두 호칭을 통합하지 않았습니다.
  issues:
  - severity: high
    issue: 2인칭 단수의 복수화
    rationale: facies(‘네가 하는/할’), tibi(‘네게’), te(‘너를’)가 모두 단수인데 초안의 ‘너희가/너희에게/너희를’는 수를 바꿉니다.
  - severity: medium
    issue: facies의 시제 처리
    rationale: ‘행한 것같이’는 과거 행위를 뜻하지만, facies는 이 문맥에서 현재적 또는 미래적 ‘하는/할’ 행위입니다.
  - severity: medium
    issue: 영어 감사 추적에서 온 각주가 본문 및 앵커와 불일치
    rationale: 제시된 각주는 ‘내 택한 이들’에 연결되어 있으나 내용은 다음 절의 도시와 칼에 관한 문장입니다. 제공된 라틴어 본문에 대한 이문 정보도 아니므로 삭제해야 합니다.
  revised_text: 네가 내 택한 이들에게 하는 대로, 주님께서 말씀하십니다, 하나님께서도 네게 그렇게 하시고 너를 재앙에 넘기실 것입니다.
