base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/019.yaml
  text: A man will have no pity on his neighbor, but will rush upon their houses with the sword, plundering their possessions because of hunger for bread and great distress.
translation:
  language: ko
  text: 사람들은 자기 이웃을 불쌍히 여기지 않고, 칼로 이웃의 집들을 덮쳐 그들의 재산을 약탈할 것이니, 이는 양식이 없어 굶주림과 큰 환난 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non miserebitur homo proximo suo
  english_pob_choice: A man will have no pity on his neighbor
  chosen_korean: 사람은 자기 이웃을 불쌍히 여기지 않고
  alternatives_korean:
  - 사람은 자기 이웃을 불쌍히 여기지 않을 것입니다
  - 사람은 자기 이웃을 가엾게 여기지 않고
  lexicon: misereor → 불쌍히 여기다
  rationale: lat. miserebitur는 단순한 감정 결핍보다 ‘긍휼을 베풀지 않음’을 뜻하므로, 문맥에 맞게 ‘불쌍히 여기지 않고’로 옮겼습니다.
- source_word: in gladium
  english_pob_choice: with the sword
  chosen_korean: 칼을 들고
  alternatives_korean:
  - 칼로
  - 칼을 가지고
  lexicon: gladius → 칼
  rationale: 전치사구가 실제 무기 사용을 나타내므로, 한국어에서는 행위의 방식이 드러나도록 ‘칼을 들고’로 자연스럽게 옮겼습니다.
- source_word: ad diripiendas substantias eorum
  english_pob_choice: plundering their possessions
  chosen_korean: 그들의 재산을 약탈할 것이니
  alternatives_korean:
  - 그들의 소유물을 약탈할 것이니
  - 그들의 재물을 빼앗을 것이니
  lexicon: substantiae → 재산 / diripio → 약탈하다
  rationale: substantiae는 단순한 물건보다 소유 전반을 가리키므로 ‘재산’이 문맥상 가장 적절하며, diripiendas는 약탈의 폭력을 살려 ‘약탈하다’로 옮겼습니다.
- source_word: propter famem panis et tribulationem multam
  english_pob_choice: because of hunger for bread and great distress
  chosen_korean: 이는 빵을 구할 굶주림과 큰 환난 때문입니다
  alternatives_korean:
  - 이는 빵에 대한 굶주림과 큰 환난 때문입니다
  - 이는 먹을 것이 없어 굶주리고 큰 환난을 겪기 때문입니다
  lexicon: fames panis / tribulatio multa
  rationale: famem panis는 직역보다 ‘빵을 구할 굶주림’이 의미를 분명히 하며, tribulationem multam은 단순한 어려움보다 강한 압박을 드러내어 ‘큰 환난’으로 옮겼습니다.
theological_decisions:
- issue: 전쟁·약탈의 예언적 진술을 현재형으로 둘지 미래형으로 둘지
  chosen_reading: 미래형으로 옮겨 심판 예고의 선언성을 살렸습니다.
  alternative_readings:
  - 현재형 서술
  - 명령형처럼 보이는 과격한 표현
  rationale: 라틴 원문과 영어 POB 모두 장차 일어날 재난의 예고를 나타내므로, 한국어도 미래 시제를 유지하는 편이 본문의 예언적 성격을 가장 잘 드러냅니다.
  doctrine_reference: 예언 문체와 종말 심판의 경고
