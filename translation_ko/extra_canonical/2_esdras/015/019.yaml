review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 충실합니다. 다만 *fames panis*는 ‘빵을 구할 굶주림’이라기보다 빵(양식)의 결핍으로 인한 굶주림을 뜻하며, ‘구할’은 원문에 없는 목적·행동의 뉘앙스를 보탭니다. *in gladium*은 여기서 무기를 수단으로 삼는 뜻이므로 ‘칼로’가 더 직접적입니다.
  naturalness: ‘그들의 집’은 앞선 단수 ‘자기 이웃’과 지시 대상이 다소 불분명하고, ‘빵을 구할 굶주림’은 현대 한국어에서 부자연스럽습니다. ‘이웃의 집들을 칼로 덮쳐’ 및 ‘양식이 없어 굶주림’이 자연스럽고 의미도 분명합니다.
  terminology: ‘불쌍히 여기다’, ‘약탈하다’, ‘큰 환난’은 문맥과 예언적 재난 묘사에 적절합니다. ‘양식’은 여기서 *panis*의 문자적 ‘빵’을 지나치게 협소하게 만들지 않으면서 식량이라는 문맥상 의미를 자연스럽게 전달합니다.
  issues:
  - severity: medium
    issue: ‘빵을 구할 굶주림’이 원문에 없는 의미를 더하고 한국어로도 어색합니다.
    rationale: 라틴어 *propter famem panis*는 빵/양식의 결핍과 관련된 굶주림을 가리킵니다. ‘구할’은 구하려는 행위를 명시하여 원문보다 해석적입니다.
  - severity: low
    issue: ‘칼을 들고’보다 ‘칼로’가 *in gladium*의 수단적 기능을 더 정확히 반영합니다.
    rationale: 본문은 칼을 소지한다는 사실보다 칼을 사용하여 집들을 습격하는 폭력적 방식을 나타냅니다.
  - severity: low
    issue: 각주가 불필요한 해석을 정당화하고 있습니다.
    rationale: 원문의 의미를 본문에서 자연스럽게 표현할 수 있으므로, ‘먹을 것을 구할 만큼’이라는 추가 해석을 담은 각주는 삭제하는 편이 좋습니다.
  revised_text: 사람들은 자기 이웃을 불쌍히 여기지 않고, 칼로 이웃의 집들을 덮쳐 그들의 재산을 약탈할 것이니, 이는 양식이 없어 굶주림과 큰 환난 때문입니다.
