  - severity: low
    issue: silebo의 번역이 다소 의역됨
    rationale: ‘잠잠히 넘기다’는 용납하거나 묵인한다는 뜻을 덧붙일 수 있습니다. ‘침묵하지 않다’가 원문의 표현과 더 가깝습니다.
  - severity: low
    issue: 각주의 내용과 앵커 위치가 부정확함
    rationale: 각주는 실제 본문 대안이라기보다 이미 누락된 원문 요소를 보충하려는 형태이며, 앵커가 관련 어구가 아닌 절 끝에 놓여 있습니다.
  revised_text: 이제 나는 그들이 불경하게 행하는 그들의 불경한 일들에 대하여 더 이상 침묵하지 않겠습니다. 또한 그들이 불의하게 행하는 일들을 더 이상 견디지 않겠습니다. 보십시오, 죄 없고 의로운 피가 내게 부르짖고, 의인들의 영혼들도 끊임없이 부르짖습니다.
