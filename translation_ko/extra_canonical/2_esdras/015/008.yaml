source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam non silebo impietates eorum quae inreligiose agunt, nec sustinebo in his quae inique exercent. ecce sanguis innoxius et iustus clamat ad me, et animae iustorum clamant perseveranter.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/008.yaml
  text: I will no longer keep silent about their impieties[a], which they commit irreligiously, nor will I endure the things they carry out unjustly. Behold, innocent and righteous blood cries out to me, and the souls of the righteous cry out continually.
  footnotes:
  - marker: a
    text: Or 'practice irreligiously'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 그들의 경건하지 않은 행위들을 더 이상 잠잠히 넘기지 않겠습니다. 그들이 불의하게 행하는 일들도 더 이상 참지 않겠습니다. 보십시오, 죄 없는 의인의 피가 나에게 부르짖고, 의인들의 영혼이 끊임없이 부르짖고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 경건하지 않은 행위들 또는 ‘경건하지 않게 행하는 것’
    reason: lexical_alternative
lexical_decisions:
- source_word: impietates / inreligiose agunt
  english_pob_choice: their impieties / which they commit irreligiously
  chosen_korean: 그들의 경건하지 않은 행위들 / 경건하지 않게 행하는 것
  alternatives_korean:
  - 그들의 불경건함
  - 그들의 불신앙적 행위들
  - 그들이 종교 없이 행하는 일들
  lexicon: impietas, inreligiose
  rationale: 라틴어 impietas의 핵심은 단순한 ‘무종교’가 아니라 하나님께 대한 경건의 결여이므로, 한국어로는 ‘경건하지 않은’이 의미를 가장 직접적으로 살립니다.
- source_word: nec sustinebo
  english_pob_choice: nor will I endure
  chosen_korean: 더 이상 참지 않겠습니다
  alternatives_korean:
  - 더는 견디지 않겠습니다
  - 더 이상 용납하지 않겠습니다
  lexicon: sustinere
  rationale: 문맥상 단순한 인내보다 ‘더 이상 참지 않다/견디지 않다’가 원문의 법정적·예언적 어조를 잘 드러냅니다.
- source_word: in his quae inique exercent
  english_pob_choice: the things they carry out unjustly
  chosen_korean: 그들이 불의하게 행하는 일들
  alternatives_korean:
  - 그들이 부정하게 벌이는 일들
  - 그들이 불의하게 저지르는 일들
  lexicon: inique exercere
  rationale: exercere는 여기서 ‘수행하다/행하다’의 의미가 강하므로, 한국어에서도 ‘행하다’로 옮겨 행위의 반복성과 책임성을 살렸습니다.
- source_word: sanguis innoxius et iustus
  english_pob_choice: innocent and righteous blood
  chosen_korean: 죄 없는 의인의 피
  alternatives_korean:
  - 무죄하고 의로운 피
  - 죄 없고 의로운 피
  lexicon: innoxius, iustus
  rationale: innoxius는 ‘죄가 없는/무고한’이고 iustus는 ‘의로운’이므로, 둘을 함께 보존하되 자연스러운 한국어 어순으로 재배열했습니다.
theological_decisions:
- issue: 피와 영혼의 부르짖음이 하나님의 심판을 촉구하는 예언적 의인화
  chosen_reading: ‘피가 나에게 부르짖고, 의인들의 영혼이 끊임없이 부르짖는다’는 표현을 그대로 살려, 상징적·예언적 호소로 읽히게 했습니다.
  alternative_readings:
  - 단순한 비유로 약화하기
  - ‘호소하다’처럼 완화된 표현으로 바꾸기
  rationale: 원문은 피와 영혼에 실제로 말하는 듯한 강한 의인화를 사용하므로, 한국어에서도 그 긴장과 심판 요청의 힘을 약화하지 않는 것이 중요합니다.
  doctrine_reference: 창세기 4:10; 계시록 6:9-10
