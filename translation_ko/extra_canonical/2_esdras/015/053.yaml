id: 2ES.15.53
reference: 2 Esdras 15:53
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dicit dominus, Nisi occidisses electos meos in omni tempore, exultans percussione manuum et dicens super mortem eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/053.yaml
  text: says the Lord[a], "If you had not killed my chosen ones all along, exulting with the striking of your hands and speaking over their death
  footnotes:
  - marker: a
    text: Or 'if you had not killed my chosen ones at all times, exulting with the striking of your hands and speaking over their death when you were drunk?'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서 말씀하십니다. “네가 내 택한 자들을 언제나 죽이고, 손뼉을 치며 기뻐하며, 그들의 죽음을 두고 말하지 않았더라면!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: 주께서 말씀하십니다
  alternatives_korean:
  - 주께서 말씀하십니다
  - 주님이 말씀하십니다
  lexicon: dicit dominus
  rationale: 서술 도입구를 본문 첫머리에 분명히 살리고, 현대 한국어 합쇼체로 자연스럽게 옮겼습니다.
- source_word: electos meos
  english_pob_choice: my chosen ones
  chosen_korean: 내 택한 자들
  alternatives_korean:
  - 내가 택한 이들
  - 내 선택받은 자들
  lexicon: electos meos
  rationale: 선택의 강조를 살리면서도, '택한 자들'이 본문의 직접적 의미를 가장 간결하게 전달합니다.
- source_word: exultans percussione manuum
  english_pob_choice: exulting with the striking of your hands
  chosen_korean: 손뼉을 치며 기뻐하고
  alternatives_korean:
  - 손뼉을 치며 환호하고
  - 손으로 치며 기뻐하고
  lexicon: exultans percussione manuum
  rationale: 문맥상 적대적 조롱의 몸짓을 가리키므로, 한국어 관용에 맞게 '손뼉을 치며'로 옮기되 단순한 기쁨으로 오해되지 않도록 '기뻐하고'를 덧붙였습니다.
- source_word: super mortem eorum
  english_pob_choice: speaking over their death
  chosen_korean: 그들의 죽음에 대하여 말하였을 텐데
  alternatives_korean:
  - 그들의 죽음을 두고 말하였을 텐데
  - 그들의 죽음 위에 말하였을 텐데
  lexicon: super mortem eorum
  rationale: 라틴어 전치사구의 위협적·조롱적 방향을 살리면서도, 한국어에서는 가장 자연스러운 '대하여 말하다'로 처리했습니다.
theological_decisions:
- issue: 직접 화법의 종결과 조건문 처리
  chosen_reading: 조건절을 과거 반실현 가정으로 옮겨, 본문의 책망적 뉘앙스를 유지했습니다.
  alternative_readings:
  - ~하지 않았더라면… 했을 것이다
  - ~하지 않았더라면… 했을 텐데
  rationale: 원문의 Nisi 구조는 실현되지 않은 조건을 전제하는 책망이므로, 한국어에서도 반실현 가정으로 처리하는 편이 의미를 가장 잘 보존합니다.
  doctrine_reference: 본문의 수사적 심판 선언
