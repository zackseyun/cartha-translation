revisions:
- from: 주께서 말씀하십니다. "네가 내 택한 자들을 늘 죽이지 않았더라면, 손뼉을 치며 기뻐하고 그들의 죽음에 대하여 말하였을 텐데"[a]
  to: 주께서 말씀하십니다. “네가 내 택한 자들을 언제나 죽이고, 손뼉을 치며 기뻐하며, 그들의 죽음을 두고 말하지 않았더라면!”
  rationale: 라틴어의 nisi occidisses 이하가 이 절에서 미완결 조건구로 끝나는 형태를 보존했습니다. ‘언제나’는 omni tempore, ‘손뼉을 치며 기뻐하며’는 exultans percussione manuum, ‘그들의 죽음을 두고 말하다’는 dicens super mortem eorum을 반영합니다. 다음 절의 ‘술에 취했을 때’에 해당하는 문구는 포함하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:19Z'
review_pass:
  verdict: revise
  source_fidelity: 현 번역은 라틴어의 불완결한 nisi 조건구를 ‘~했을 텐데’라는 완결된 반사실적 귀결로 바꾸어, 원문에 없는 귀결을 보탭니다. 원문은 이 절에서 ‘dicit dominus’를 포함하며, 선택된 이들을 죽이고 손뼉 치며 기뻐하고 그들의 죽음을 두고 말한 행위를 조건구 안에서 함께 열거합니다.
  naturalness: ‘~하지 않았더라면!’으로 옮기면 한국어에서도 심판 선언의 수사적이고 미완결적인 조건 표현을 자연스럽게 유지할 수 있습니다. ‘그들의 죽음을 두고 말하다’는 ‘super mortem eorum’에 자연스럽고 충실합니다.
  terminology: ‘주께서 말씀하십니다’, ‘내 택한 자들’, ‘손뼉을 치며 기뻐하며’는 현대 표준어 합쇼체와 본문의 어휘·문맥에 적절합니다. 기존 각주는 본문에 명시되지 않은 ‘조롱과 승리감’을 해설적으로 확정하므로 삭제하는 편이 좋습니다.
  issues:
  - severity: high
    issue: 원문에 없는 조건문의 귀결이 추가됨
    rationale: ‘말하였을 텐데’는 ‘죽이지 않았더라면 기뻐하고 말했을 것이다’라는 귀결을 만들어 냅니다. 라틴어에는 이 절 안에 그러한 귀결이 없으며, 다음 절의 문구도 이 절에 포함해서는 안 됩니다.
  - severity: low
    issue: 각주가 문맥적 함의를 확정적으로 덧붙임
    rationale: ‘조롱과 승리감’은 가능한 문맥 이해이나, 이 절의 라틴어 어휘 자체가 명시하는 내용은 아닙니다. 번역상 필요한 대안 정보도 아니므로 각주를 두지 않는 것이 적절합니다.
  revised_text: 주께서 말씀하십니다. “네가 내 택한 자들을 언제나 죽이고, 손뼉을 치며 기뻐하며, 그들의 죽음을 두고 말하지 않았더라면!”
  revised_footnotes: []
  revision_rationale: 라틴어의 nisi occidisses 이하가 이 절에서 미완결 조건구로 끝나는 형태를 보존했습니다. ‘언제나’는 omni tempore, ‘손뼉을 치며 기뻐하며’는 exultans percussione manuum, ‘그들의 죽음을 두고 말하다’는 dicens super mortem eorum을 반영합니다. 다음 절의 ‘술에 취했을 때’에 해당하는 문구는 포함하지 않았습니다.
