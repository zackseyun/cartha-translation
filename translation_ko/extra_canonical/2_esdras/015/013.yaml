  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugeant cultores operantes terram, quoniam deficient semina eorum et vastabuntur ligna eorum ab uredine et grandine et a sidus terribile.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/013.yaml
  text: Let those who cultivate the land mourn, because their seed will fail, and their trees will be laid waste by blight and hail and by a dreadful star.
translation:
  language: ko
  text: 땅을 경작하는 이들이여, 슬퍼하십시오. 그들의 씨앗이 제대로 나지 못하고, 그들의 나무는 병해와 우박과 무서운 별 때문에 황폐해질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugeant
  english_pob_choice: Let ... mourn
  chosen_korean: 슬퍼하십시오
  alternatives_korean:
  - 애곡하십시오
  - 애도하십시오
  lexicon: lugeo
  rationale: 명령형으로 공동체적 애곡을 살리되, 현대 한국어에서는 ‘슬퍼하다’가 가장 자연스럽고 과도하게 장례적이지 않습니다.
- source_word: cultores operantes terram
  english_pob_choice: those who cultivate the land
  chosen_korean: 땅을 경작하는 이들
  alternatives_korean:
  - 땅을 가는 자들
  - 농부들
  - 땅을 일구는 이들
  lexicon: colo + operor + terra
  rationale: cultores와 operantes terram의 기능을 함께 반영해 단순한 직업명보다 ‘경작하는 이들’로 옮겼습니다.
- source_word: deficient semina eorum
  english_pob_choice: their seed will fail
  chosen_korean: 그들의 씨앗은 사라지고
  alternatives_korean:
  - 그들의 씨는 실패하고
  - 그들의 씨앗은 끊어지고
  lexicon: deficio + semen
  rationale: 농작의 실패를 단순한 소멸로만 읽지 않도록, 결실 상실의 뜻을 살려 ‘사라지고’로 자연스럽게 표현했습니다.
- source_word: uredine et grandine et a sidus terribile
  english_pob_choice: by blight and hail and by a dreadful star
  chosen_korean: 깜부기병과 우박과 무서운 별 때문에
  alternatives_korean:
  - 노균병과 우박과 무서운 별 때문에
  - 역병과 우박과 무서운 별 때문에
  lexicon: uredo + grando + sidus
  rationale: uredine은 곡식의 병해를 가리키므로 일반적인 ‘병해’ 대신 농업적 피해를 드러내는 ‘깜부기병’을 택했습니다. sidus는 문자 그대로 ‘별’이어서 유지하되, terribile의 공포감을 ‘무서운’으로 반영했습니다.
theological_decisions:
- issue: 천체 재앙 표현의 문자성 유지
  chosen_reading: ‘무서운 별’을 문자 그대로 살려, 본문이 자연 재앙과 함께 하늘의 징조를 병렬로 제시하는 긴장을 유지했습니다.
  alternative_readings:
  - ‘끔찍한 별’로 완화
  - 상징적 재난으로 일반화
  rationale: 라틴 본문이 sidus terribile을 구체적 천체 이미지로 제시하므로, 상징으로 풀지 않고 그대로 보존하는 편이 원문 충실도가 높습니다.
  doctrine_reference: 문자-서사적 묘사 유지
