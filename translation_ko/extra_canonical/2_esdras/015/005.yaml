  text: 'Behold, I am bringing evils upon the world, says the Lord: sword and famine and death and destruction,'
translation:
  language: ko
  text: 보십시오, 주님께서 말씀하십니다. 내가 세상 위에 재앙들—칼과 기근과 죽음과 멸망—을 내리고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아라
  lexicon: ecce
  rationale: 청자 주의를 끄는 감탄사로서 현대 합쇼체에 자연스러운 직접 호소 표현을 택했습니다.
- source_word: induco
  english_pob_choice: I am bringing
  chosen_korean: 내리고 있습니다
  alternatives_korean:
  - 가져오고 있습니다
  - 불러오고 있습니다
  - 덮어씌우고 있습니다
  lexicon: induco
  rationale: 재앙을 세계 위에 가져오는 적극적 개입을 살리면서도 한국어에서 더 자연스러운 '내리다'를 사용했습니다.
- source_word: mala
  english_pob_choice: evils
  chosen_korean: 재앙들
  alternatives_korean:
  - 악들
  - 악한 것들
  - 환난들
  lexicon: mala
  rationale: 문맥상 추상적 악보다 심판으로서의 재난·재앙이 중심이므로 복수성을 살려 옮겼습니다.
- source_word: super orbem terrarum
  english_pob_choice: upon the world
  chosen_korean: 세상 위에
  alternatives_korean:
  - 온 세상에
  - 온 땅 위에
  - 지상 위에
  lexicon: super orbem terrarum
  rationale: '''orbem terrarum''의 세계적 범위를 유지하면서 직역의 어색함을 줄인 표현입니다.'
- source_word: gladium et famem et mortem et interitum
  english_pob_choice: sword and famine and death and destruction
  chosen_korean: 칼과 기근과 죽음과 멸망
  alternatives_korean:
  - 칼과 기근과 죽음과 파멸
  - 칼과 굶주림과 죽음과 멸망
  lexicon: gladium et famem et mortem et interitum
  rationale: 네 항목의 열거 구조를 보존하고, 'interitum'은 최종적 파괴·멸망의 강도를 살려 '멸망'으로 옮겼습니다.
theological_decisions:
- issue: 주님의 직접 발화에서의 선포 톤
  chosen_reading: 직접 심판 선포로서 문장 전체를 현재진행형 선언으로 처리했습니다.
  alternative_readings:
  - 단순 미래형으로 옮김
  - 완곡하게 '가하겠다'로 조정
  rationale: 라틴어 현재형 'induco'와 선언문 형식을 따라, 재앙이 임하는 하나님의 주권적 행위를 생생하게 드러내기 위해서입니다.
  doctrine_reference: 하나님의 심판과 주권
- issue: mala의 의미 범위
  chosen_reading: 도덕적 악 자체보다 재앙적 심판의 내용으로 이해했습니다.
  alternative_readings:
  - 악행들
  - 악들
  rationale: 영문 POB도 'evils'를 역사적 재난 목록으로 풀고 있으며, 이어지는 항목들이 모두 구체적 심판 재앙이므로 문맥상 '재앙들'이 적합합니다.
  doctrine_reference: 종말론적 심판
