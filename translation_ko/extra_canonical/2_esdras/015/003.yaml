  text: because they are faithful and true. Do not fear the thoughts against you, nor let the unbelief of those who speak against you trouble you.
translation:
  language: ko
  text: 그들이 믿음직하고 참되기 때문입니다. 당신을 거스르는 생각들을 두려워하지 마십시오. 당신을 거슬러 말하는 사람들의 불신이 당신을 흔들지 못하게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fideles et ueri
  english_pob_choice: faithful and true
  chosen_korean: 믿음직하고 참되기
  alternatives_korean:
  - 신실하고 참되기
  - 충실하고 참되기
  lexicon: fideles / ueri
  rationale: fideles는 단순한 사실 진술보다 신뢰할 만함과 성실함을 함께 담으므로 ‘믿음직하다’로, ueri는 객관적 참됨을 가리켜 ‘참되다’로 옮겼습니다.
- source_word: cogitationibus aduersum te
  english_pob_choice: thoughts against you
  chosen_korean: 당신을 향한 생각들
  alternatives_korean:
  - 당신을 거슬러 하는 생각들
  - 당신을 대적하는 생각들
  lexicon: cogitatio
  rationale: POB가 schemes가 아닌 thoughts로 정정한 점을 반영해, 외적 음모보다 내적 판단·의도까지 포함하는 ‘생각들’로 옮겼습니다.
- source_word: incredulitates
  english_pob_choice: the unbelief
  chosen_korean: 불신
  alternatives_korean:
  - 믿지 않음
  - 믿음 없음
  lexicon: incredulitas
  rationale: 문맥상 단순 감정이 아니라 하나님 말씀에 대한 거부 상태를 가리키므로, 행위적 뉘앙스가 살아 있는 ‘불신’을 택했습니다.
- source_word: contra dicentium
  english_pob_choice: of those who speak against you
  chosen_korean: 당신을 거슬러 말하는 이들
  alternatives_korean:
  - 당신을 반대하여 말하는 이들
  - 당신을 대적하며 말하는 이들
  lexicon: contra dicere
  rationale: 직역을 유지하되 한국어에서 자연스럽게 읽히도록 ‘거슬러 말하다’로 처리해, 단순 비판이 아니라 대항적 발화를 드러냈습니다.
theological_decisions:
- issue: 두려움과 흔들림의 대응 관계
  chosen_reading: 두려워하지 말며 … 마음이 흔들리지 않게 하십시오
  alternative_readings:
  - 두려워하지 말고 … 괴로워하지 않게 하십시오
  - 두려워하지 말며 … 불안해하지 않게 하십시오
  rationale: 원문은 fear와 trouble의 평행을 이루므로, 두 동사를 분리해 전자는 ‘두려워하다’, 후자는 ‘흔들리다’로 옮겨 감정적 동요까지 포착했습니다.
  doctrine_reference: 예언적 위로와 경고의 병행 구조
