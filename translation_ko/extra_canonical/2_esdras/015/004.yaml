  yaml_path: translation/extra_canonical/2_esdras/015/004.yaml
  text: For every unbeliever will die in his unbelief.
translation:
  language: ko
  text: 이는 모든 믿지 않는 자가 자기의 불신 가운데서 죽을 것이기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: incredulus
  english_pob_choice: unbeliever
  chosen_korean: 믿지 않는 자
  alternatives_korean:
  - 불신자
  - 믿음이 없는 자
  lexicon: incredulus
  rationale: 라틴어 incredulus는 ‘믿지 않는’ 상태를 가리키므로, POB의 ‘unbeliever’를 따라 행위·상태를 함께 드러내는 ‘믿지 않는 자’로 옮겼습니다.
- source_word: in incredulitate sua
  english_pob_choice: in his unbelief
  chosen_korean: 자기의 믿지 않음 안에서
  alternatives_korean:
  - 자기 불신 가운데
  - 그의 불신 속에서
  lexicon: incredulitas
  rationale: 반복되는 어근을 살려 ‘믿지 않음’으로 유지하고, 전치사 in의 영역성을 ‘안에서’로 나타내어 ‘그 믿지 않음의 상태 안에서’라는 의미를 보존했습니다.
- source_word: morietur
  english_pob_choice: will die
  chosen_korean: 죽을 것입니다
  alternatives_korean:
  - 죽게 될 것입니다
  - 죽습니다
  lexicon: mori
  rationale: 미래 직설의 결과 진술을 자연스러운 합쇼체 미래로 옮겼습니다.
theological_decisions:
- issue: ‘불신’의 상태와 죽음의 인과 관계
  chosen_reading: 본문은 단순한 보편 진술이 아니라, 믿지 않음이라는 상태 안에서 죽음이 일어난다는 경고를 말합니다.
  alternative_readings:
  - 그저 ‘믿지 않는 사람은 죽는다’는 일반 사실 진술
  - 종말론적 심판의 직접 서술
  rationale: 라틴어의 incredulitate sua를 그대로 살려, 믿지 않음이 죽음의 자리/상태로 기능한다는 긴장을 유지했습니다.
  doctrine_reference: source-semantic caution
