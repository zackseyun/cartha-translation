  text: Behold, clouds from the east and from the north as far as the south, and their appearance is very dreadful, full of wrath and storm.
translation:
  language: ko
  text: 보십시오, 동쪽과 북쪽에서 남쪽에 이르기까지 구름들이 있습니다. 그 모습은 매우 흉측하며, 진노와 폭풍으로 가득합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: ecce
  rationale: 예언적 경고의 주의를 환기하는 감탄사로서, 현대 합쇼체에서는 「보십시오」가 가장 자연스럽고 문맥의 긴박함도 살립니다.
- source_word: nubs
  english_pob_choice: clouds
  chosen_korean: 구름
  alternatives_korean:
  - 구름 떼
  - 구름들
  lexicon: nubes
  rationale: 라틴어 복수형을 반영해 이미지의 집합성을 살리되, 한국어에서는 자연스러운 집합명사인 「구름」으로 옮겼습니다.
- source_word: irae et procellae
  english_pob_choice: full of wrath and storm
  chosen_korean: 진노와 폭풍으로 가득합니다
  alternatives_korean:
  - 분노와 폭풍으로 가득합니다
  - 진노와 폭풍우로 가득합니다
  lexicon: ira / procella
  rationale: irae는 단순한 감정적 분노보다 심판적 격노를 뜻하므로 「진노」로, procellae는 폭풍의 강한 자연재해 이미지를 살려 「폭풍」으로 옮겼습니다.
theological_decisions:
- issue: 예언 이미지의 해석 범위
  chosen_reading: 이 구절은 하늘의 징조를 문자적 자연현상으로 묘사하는 동시에, 심판의 위협을 상징적으로 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - 전적으로 상징적 환상으로만 읽는 해석
  - 미래의 기상 현상으로만 읽는 해석
  rationale: 원문은 이미지 자체를 해설하지 않고 강한 시각적 공포를 제시하므로, 상징성과 문자성을 하나로 고정하지 않고 긴장을 보존했습니다.
  doctrine_reference: 묵시문학적 심판 이미지
