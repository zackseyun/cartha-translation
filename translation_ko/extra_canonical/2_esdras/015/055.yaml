source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: merces fornicariae in sinus tuos, propterea redditionem percipies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/055.yaml
  text: The wages of a prostitute are in your bosom[a]; therefore you will receive repayment.
  footnotes:
  - marker: a
    text: Or 'As you do to my chosen ones, says the Lord, so God will do to you and will hand you over to evils. And your children will die of hunger, and you will fall by the broadsword.'.
    reason: previous_rendering
translation:
  language: ko
  text: 창녀의 삯이 네 품에 있습니다. 그러므로 너는 보응을 받게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: merces
  english_pob_choice: wages
  chosen_korean: 삯
  alternatives_korean:
  - 임금
  - 보수
  - 대가
  lexicon: merces
  rationale: 노동의 대가를 가리키는 기본 의미를 살리되, 이 문맥의 도덕적·비유적 뉘앙스에 어울리는 간결한 표현으로 ‘삯’을 택했습니다.
- source_word: fornicariae
  english_pob_choice: prostitute
  chosen_korean: 창녀
  alternatives_korean:
  - 매춘부
  - 음녀
  lexicon: fornicaria
  rationale: 라틴어 genitive fornicariae는 ‘prostitute’의 소유격이므로, 한국어에서도 인격 주체를 드러내는 직설적 표현이 필요해 ‘창녀’로 옮겼습니다.
- source_word: in sinus tuos
  english_pob_choice: in your bosom
  chosen_korean: 네 품에
  alternatives_korean:
  - 네 품 안에
  - 네 가슴에
  - 네 품속에
  lexicon: sinus
  rationale: sinus는 ‘품, 가슴, 품속’ 범위가 있으나, 여기서는 심판의 결과가 이미 네 안에 들어와 있다는 이미지를 살려 자연스러운 ‘네 품에’로 번역했습니다.
- source_word: redditionem percipies
  english_pob_choice: you will receive repayment
  chosen_korean: 갚음을 받게 될 것입니다
  alternatives_korean:
  - 보응을 받게 될 것입니다
  - 되갚음을 받게 될 것입니다
  - 갚음을 받습니다
  lexicon: redditionem percipies
  rationale: redditionem은 단순 반환이 아니라 응보적 ‘되갚음/보응’의 뜻을 띠므로, 문맥의 심판 선언을 드러내는 ‘갚음’을 선택했습니다.
theological_decisions:
- issue: 응보적 선언의 어조
  chosen_reading: 이 절은 단순한 금전 거래 설명이 아니라, 도덕적 타락에 대한 심판적 보응 선언으로 읽었습니다.
  alternative_readings:
  - 중립적인 경제적 보상 진술
  - 비유적 경고를 약화한 표현
  rationale: redditionem과 문맥상 ‘받게 될 것입니다’는 단순 지급이 아니라 응보를 예고하는 말이므로, 한국어에서도 심판적 긴장을 유지했습니다.
  doctrine_reference: 성경의 보응/심판 어조 보존
