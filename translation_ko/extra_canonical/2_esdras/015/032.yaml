translation:
  language: ko
  text: 그러면 이들은 혼란에 빠지고, 그들의 힘 때문에 침묵하게 될 것이며, 발을 돌려 도망칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 in virtute illorum은 능동적 ‘침묵하다’와 결합할 때 ‘그들의 힘 때문에’라는 원인적 의미로 이해하는 것이 자연스럽습니다.
    reason: source_note
lexical_decisions:
- source_word: et isti turbabuntur
  english_pob_choice: then these will be thrown into confusion
  chosen_korean: 그러면 이들은 혼란에 빠지고
  alternatives_korean:
  - 그러면 이들은 동요하고
  - 그러면 이들은 어지러워지고
  lexicon: turbabuntur
  rationale: 수동적 혼란 상태를 자연스럽게 옮기기 위해 ‘혼란에 빠지다’를 택했습니다. ‘동요하다’도 가능하지만, 여기서는 집단이 무너지는 결과를 더 분명히 드러내는 표현이 적절합니다.
- source_word: et silebunt
  english_pob_choice: and fall silent
  chosen_korean: 침묵하게 될 것이며
  alternatives_korean:
  - 잠잠해질 것이며
  - 말이 없어질 것이며
  lexicon: silebunt
  rationale: 라틴어는 능동 미래형이므로 ‘침묵하게 될 것이다’로 옮겨, 영어 주석이 지적한 수동적 뉘앙스를 피했습니다.
- source_word: in virtute illorum
  english_pob_choice: because of their strength
  chosen_korean: 그들의 힘 때문에
  alternatives_korean:
  - 그들의 힘으로 인해
  - 그들의 힘 앞에서
  lexicon: in + virtus
  rationale: 개정된 영어 주해처럼 원인적 의미를 살려 ‘때문에’로 번역했습니다. 한국어에서도 ‘~때문에’가 가장 직접적으로 causal sense를 전달합니다.
- source_word: convertent pedes suos in fugam
  english_pob_choice: they will turn their feet to flight
  chosen_korean: 발을 돌려 도망칠 것입니다
  alternatives_korean:
  - 달아날 것입니다
  - 도망으로 발을 돌릴 것입니다
  lexicon: converto / fuga
  rationale: 직역하면 어색한 관용적 표현이므로, 행동 결과를 분명하게 드러내는 자연스러운 한국어로 옮겼습니다. ‘발을 돌리다’의 이미지도 부분적으로 보존했습니다.
theological_decisions:
- issue: 이 절의 인과 관계 표현
  chosen_reading: ‘그들의 힘 때문에’로 읽어, 상대의 힘이 패주와 침묵의 직접 원인임을 드러냈습니다.
  alternative_readings:
  - ‘그들의 힘 앞에서’로 읽어 위압감을 강조할 수 있음
  - ‘그들의 힘으로 인해’로 더 문어적으로 처리할 수 있음
  rationale: 라틴어 in virtute illorum은 여기서 도구적이라기보다 원인적/상황적 용법이 더 자연스럽고, 앞선 혼란과 침묵이 힘의 압도에서 비롯된다는 흐름을 살려야 합니다.
  doctrine_reference: 본문 해석상의 문법·의미 결정
