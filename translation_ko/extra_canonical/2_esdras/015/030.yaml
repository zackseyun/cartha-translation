  verdict: revise
  source_fidelity: 라틴어 Carmonii는 본문 자체로는 지명·민족명의 정확한 동일시가 확정되지 않으므로, 카르마니아인이라는 해석을 본문과 각주에서 단정하지 않는 편이 안전합니다. constabunt in pugnam은 단순히 ‘싸움을 벌이다’보다 ‘전투를 위해 맞서 서다/태세를 갖추다’라는 대치·준비의 뜻을 포함합니다. ‘그들의 이빨로’라는 이례적 표현은 유지해야 합니다.
  naturalness: ‘큰 힘으로 와서’와 ‘싸움을 벌이며’의 연결은 다소 느슨합니다. ‘큰 병력을 거느리고 와서 그들과 전투를 위해 맞서 설 것이며’로 옮기면 현대 한국어 문장으로 자연스럽고 원문의 연속 동작도 드러납니다. ‘그들의 이로’는 문어적으로 가능하나, ‘그들의 이빨로’가 더 명료하면서도 원문의 낯선 이미지를 보존합니다.
  terminology: Carmonii는 음역하여 ‘카르모니 사람들’로 두었습니다. 카르마니아(Carmania)와의 동일시는 가능한 해석일 수 있으나, 현 라틴어 형태만으로 확정할 수 없으므로 독자용 각주에서는 단정하지 않았습니다. Assyriorum은 ‘아시리아 사람들의 땅’으로 옮겨 속격 관계를 명시했습니다.
  issues:
