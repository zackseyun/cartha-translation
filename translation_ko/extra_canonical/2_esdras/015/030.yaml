  - 격노하여
  - 분노에 사로잡혀
  lexicon: insanientes in ira
  rationale: 단순한 화남보다 ‘미쳐’가 라틴어 insanientes의 격렬하고 비이성적인 동요를 더 강하게 드러내며, POB의 공격적 뉘앙스를 살립니다.
- source_word: de silva
  english_pob_choice: out from the forest
  chosen_korean: 숲에서 나와
