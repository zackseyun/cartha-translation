  lexicon: 고유명사
  rationale: 라틴어 Carmonii를 인명형이 아닌 민족/지명형으로 보고, POB의 최종 영어 수정에 맞춰 카르마니아(Carmania) 출신 사람들을 자연스럽게 옮겼습니다.
- source_word: insanientes in ira
