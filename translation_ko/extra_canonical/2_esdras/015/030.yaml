  text: The Carmonians[a], raging in wrath, will come out from the forest, and they will come with great force and stand for battle against them, and they will lay waste the portion of the land of the Assyrians with their teeth.
  footnotes:
  - marker: a
    text: Or 'The Carmonians'.
    reason: previous_rendering
translation:
  language: ko
  text: 카르모니아 사람들은 분노에 미쳐 숲에서 나와 큰 힘으로 와서 그들과 싸움을 벌이며, 아시리아 땅의 몫을 그들의 이로 황폐하게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 Carmonii는 Carmania(카르마니아) 사람들을 가리키는 표기 변형입니다.
    reason: source_note
lexical_decisions:
- source_word: Carmonii
  english_pob_choice: The Carmonians / The Carmonians
  chosen_korean: 카르모니아 사람들
  alternatives_korean:
  - 카르모니안 사람들
  - 카르모니인들
  lexicon: 고유명사
  rationale: 라틴어 Carmonii를 인명형이 아닌 민족/지명형으로 보고, POB의 최종 영어 수정에 맞춰 카르마니아(Carmania) 출신 사람들을 자연스럽게 옮겼습니다.
- source_word: insanientes in ira
  english_pob_choice: raging in wrath
  chosen_korean: 분노에 미쳐
  alternatives_korean:
  - 격노하여
  - 분노에 사로잡혀
  lexicon: insanientes in ira
  rationale: 단순한 화남보다 ‘미쳐’가 라틴어 insanientes의 격렬하고 비이성적인 동요를 더 강하게 드러내며, POB의 공격적 뉘앙스를 살립니다.
- source_word: de silva
  english_pob_choice: out from the forest
  chosen_korean: 숲에서 나와
  alternatives_korean:
  - 숲 밖으로
  - 숲을 떠나
  lexicon: silva
  rationale: 장소 이탈 동작을 간결하게 살려, 라틴어의 출현·진군 이미지를 자연스러운 한국어로 옮겼습니다.
- source_word: vastabunt portionem terrae Assyriorum in dentibus suis
  english_pob_choice: they will lay waste the portion of the land of the Assyrians with their teeth
  chosen_korean: 아시리아 땅의 몫을 그들의 이로 황폐하게 할 것입니다
  alternatives_korean:
  - 아시리아 땅의 부분을 그들의 이로 황폐하게 할 것입니다
  - 아시리아 사람들의 몫을 이로 짓밟을 것입니다
  lexicon: vastare + in dentibus suis
  rationale: ‘portionem terrae’는 단순한 ‘땅’보다 ‘몫/할당된 부분’이 더 직접적이며, ‘그들의 이로’는 원문의 기이한 도구 표현을 그대로 보존해 수사적 충격을 유지합니다.
theological_decisions:
- issue: 이 구절의 초현실적 전쟁 묘사와 상징성
  chosen_reading: 직역에 가까운 방식으로 기이한 이미지(‘그들의 이로’)를 그대로 보존했습니다.
  alternative_readings:
  - 의미를 풀어 ‘잔혹하게 파괴할 것입니다’로 완화
  - 비유로 처리해 상징적 전투로 재구성
  rationale: 본문은 종말론적 묵시문학의 과장과 비정상적 이미지를 의도하므로, 독자의 충격을 줄이는 해설적 완화보다 원문 효과를 유지하는 편이 더 충실합니다.
  doctrine_reference: 묵시문학의 상징적 과장과 문자적 이미지 보존 원칙
