    rationale: Carmonii의 형태와 지리적 동일시는 전승·해석상의 문제가 있을 수 있습니다. 번역 본문은 음역으로 보존하고, 카르마니아와의 연결을 확정 사실처럼 제시하지 않아야 합니다.
  - severity: low
