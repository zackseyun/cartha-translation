translation:
  language: ko
  text: 카르모니 사람들은 분노에 미쳐 숲에서 나와 큰 병력을 거느리고 와서 그들과 전투를 위해 맞서 설 것이며, 아시리아 사람들의 땅의 일부를 그들의 이빨로 황폐하게 할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘카르모니 사람들’: 라틴어 Carmonii를 음역한 것입니다. 이 명칭을 카르마니아(Carmania) 사람들과 동일시하는 해석이 있으나, 그 동일시는 확실하지 않습니다.'
    reason: source_note
lexical_decisions:
- source_word: Carmonii
  english_pob_choice: The Carmonians / The Carmonians
  chosen_korean: 카르모니아 사람들
  alternatives_korean:
