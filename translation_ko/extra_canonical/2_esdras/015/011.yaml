id: 2ES.15.11
reference: 2 Esdras 15:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sed educam eum in manu potenti et brachio excelso, et percutiam Aegyptum plaga sicut prius, et corrumpam terram omnem eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/011.yaml
  text: but I will lead them out with a mighty hand and an uplifted arm, and I will strike Egypt with plagues as before, and I will destroy all its land.
translation:
  language: ko
  text: 그러나 나는 강한 손과 높이 든 팔로 그들을 이끌어 내고, 애굽을 이전처럼 여러 재앙으로 치며, 그 땅 전체를 멸망시키겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 plaga는 여기서 집합적 의미의 ‘재앙들’로 이해하는 것이 문맥상 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: educam eum
  english_pob_choice: I will lead them out
  chosen_korean: 그들을 이끌어 내고
  alternatives_korean:
  - 그를 데리고 나오고
  - 그들을 인도하여 내고
  lexicon: educam
  rationale: 라틴어 educam은 ‘밖으로 이끌어 내다’의 뜻이므로, 출애굽적 맥락에 맞게 간결하게 ‘이끌어 내고’로 옮겼습니다. 영어 POB의 복수 ‘them’은 문맥상 공동체를 가리키는 대상으로 반영했습니다.
- source_word: manu potenti et brachio excelso
  english_pob_choice: with a mighty hand and an uplifted arm
  chosen_korean: 강한 손과 높이 든 팔로
  alternatives_korean:
  - 능한 손과 높이 든 팔로
  - 전능한 손과 높이 든 팔로
  lexicon: manus / brachium
  rationale: 히브리 성경의 관용적 구문을 직접 반영하여 ‘손’과 ‘팔’을 유지했고, potenti/excelso의 대비를 살려 ‘강한’과 ‘높이 든’으로 표현했습니다.
- source_word: percutiam Aegyptum plaga sicut prius
  english_pob_choice: I will strike Egypt with plagues as before
  chosen_korean: 애굽을 이전처럼 여러 재앙으로 치며
  alternatives_korean:
  - 애굽을 이전처럼 재앙으로 치며
  - 애굽에 이전처럼 재앙을 내리며
  lexicon: plaga
  rationale: plaga는 단수형이더라도 문맥상 집합적 재앙을 가리킬 수 있어, 최신 POB 수정안처럼 복수 의미를 살려 ‘여러 재앙’으로 옮겼습니다. ‘치다’는 percutiam의 직접성을 보존합니다.
- source_word: corrumpam terram omnem eius
  english_pob_choice: I will destroy all its land
  chosen_korean: 그 땅 전체를 멸망시키겠습니다
  alternatives_korean:
  - 그 땅 전체를 파괴하겠습니다
  - 그의 온 땅을 없애겠습니다
  lexicon: corrumpam
  rationale: corrumpam은 단순한 훼손보다 전면적 붕괴·파괴를 뜻할 수 있으므로, 영어 POB의 ‘destroy’에 맞춰 ‘멸망시키겠습니다’로 옮겼습니다. ‘그 땅 전체’는 omnis eius terra의 포괄성을 드러냅니다.
theological_decisions:
- issue: 출애굽 심판 언어의 직접성
  chosen_reading: 하나님이 애굽을 ‘여러 재앙’으로 치고 그 땅을 멸망시키겠다고 하시는 심판 선언을 직설적으로 보존했습니다.
  alternative_readings:
  - 완화하여 ‘재앙을 내리다’ 정도로 표현
  - ‘ruin’처럼 약한 파괴어로 순화
  rationale: 본문은 구원의 행위와 심판의 행위를 함께 드러내므로, 심판의 강도를 약화하지 않는 것이 원문의 신학적 대조를 유지합니다.
  doctrine_reference: 출애굽기 6–12장에 나타나는 심판과 구원의 병행
- issue: 주어와 인칭 대명사의 지시
  chosen_reading: 영어 POB의 ‘them’을 따라 공동체를 가리키는 복수로 처리했습니다.
  alternative_readings:
  - 라틴어 표면형 eum을 따라 단수로 처리
  - 개연성에 따라 애굽을 목적어로만 읽기
  rationale: 본문 맥락이 집단적 해방을 말하므로, 라틴어의 불일치 가능성보다 서술 흐름과 POB의 해석을 우선해 복수로 정리했습니다.
  doctrine_reference: 문맥 우선의 번역 원리
