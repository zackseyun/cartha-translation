  source_fidelity: 라틴어 본문은 educam eum(‘내가 그를 이끌어 내겠다’)처럼 목적어를 단수 남성형으로 제시합니다. 문맥상 집단을 가리킬 가능성이 있더라도, 제시된 원문만으로 복수 ‘그들을’로 확정하는 것은 원문의 수를 바꿉니다. 또한 plaga는 단수이나 집합적으로도 쓰일 수 있으므로 한국어에서도 단·복수 해석을 불필요하게 확정하지 않는 표현이 적절합니다.
  naturalness: ‘강한 손’보다 성경적이면서 현대 한국어에도 자연스러운 ‘능한 손’이 더 적절합니다. 토지 자체를 목적어로 하는 corrumpam에는 ‘멸망시키다’보다 ‘파괴하다’가 자연스럽고 직접적입니다. ‘전에 그랬던 것처럼’은 sicut prius를 자연스럽게 옮깁니다.
  terminology: ‘애굽’, ‘능한 손’, ‘높이 든 팔’, ‘재앙’, ‘파괴하다’는 본문의 심판 및 출애굽 어휘를 과도한 교리적 해석 없이 보존합니다.
