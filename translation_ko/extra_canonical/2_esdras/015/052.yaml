lexical_decisions:
- source_word: Numquid ego sic zelabo te
  english_pob_choice: Would I be so zealous against you, says the Lord,
  chosen_korean: 「내가 너희를 향해 그토록 열심히 분노하겠느냐?」
  alternatives_korean:
  - 「내가 너희에게 그토록 질투하겠느냐?」
  - 「내가 너희를 향해 그토록 열심히 질투하겠느냐?」
  lexicon: zelabo / ζηλώσω
  rationale: 여기서는 현대 한국어의 ‘질투’보다 심판 맥락의 강한 분노와 열심을 드러내는 ‘열심히 분노하다’가 source와 POB의 수정 취지를 더 정확히 반영합니다.
- source_word: te
  english_pob_choice: against you
  chosen_korean: 너희를 향해
  alternatives_korean:
  - 너희에게
  - 너희를 대하여
  lexicon: Latin te
  rationale: 전치적 대상을 단순한 방향이 아니라 적대적 대립으로 살려, POB의 ‘against you’를 자연스러운 한국어로 옮겼습니다.
- source_word: dicit Dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주님께서 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: Dominus
  rationale: 라틴어 직유적 종결을 한국어 서술문으로 옮기되, 직접 인용의 발화 주체를 분명히 하기 위해 ‘말씀하십니다’를 사용했습니다.
theological_decisions:
- issue: zelabo의 정서적 의미
  chosen_reading: 하나님의 질투/열심을 현대 한국어에서 오해가 적도록 심판적 분노의 표현으로 옮겼습니다.
  alternative_readings:
  - 질투하다
  - 시기하다
  rationale: 본절은 단순한 감정적 질투가 아니라 순교자들의 피에 대한 보응 문맥이므로, ‘열심히 분노하다’가 신학적 기능을 더 정확히 드러냅니다.
  doctrine_reference: 신적 진노와 언약적 열심의 결합(심판 문맥)
