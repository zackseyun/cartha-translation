  yaml_path: translation/extra_canonical/2_esdras/015/049.yaml
  text: 'I will send evils upon you: widowhood and poverty and famine and sword and pestilence[a], to lay waste your houses, for violation'
  footnotes:
  - marker: a
    text: Or 'to lay waste your houses with violation'.
    reason: previous_rendering
translation:
  language: ko
  text: 제가 여러분에게 재앙들을 보내겠습니다. 곧 과부 됨과 가난과 기근과 칼과 전염병입니다. 그것은 여러분의 집들을 황폐하게 하여, 파괴와 관련된 징벌이 되게 하려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 ad uiolationem은 앞의 ‘집들을 황폐하게 하다’와 평행하는 목적구로 읽을 수 있으며, 단순한 수식어가 아닙니다.
    reason: source_note
lexical_decisions:
- source_word: Inmittam
  english_pob_choice: I will send
  chosen_korean: 제가 … 보내겠습니다
  alternatives_korean:
  - 내가 … 보내겠습니다
  - 내리겠습니다
  lexicon: inmitto
  rationale: 미래형의 직접적 선언을 살리고, 문장 주어를 분명히 하면서 한국어로 자연스럽게 옮겼습니다.
- source_word: uiduitatem
  english_pob_choice: widowhood
  chosen_korean: 과부 됨
  alternatives_korean:
  - 과부됨
  - 과부 신세
  - 홀로 됨
  lexicon: viduitas
  rationale: 상태명사인 라틴어 의미를 유지해 ‘과부 됨’으로 옮겨, 단순한 사회적 처지보다 상실 상태를 드러냈습니다.
- source_word: ad deuastandas domus tuas
  english_pob_choice: to lay waste your houses
  chosen_korean: 여러분의 집들을 황폐하게 하여
  alternatives_korean:
  - 여러분의 집들을 황폐하게 하도록
  - 여러분의 집들을 무너뜨리도록
  lexicon: devasto
  rationale: 목적을 나타내는 ad 구문을 한국어의 결과·목적 표현으로 자연스럽게 처리하되, ‘집들’의 복수를 유지했습니다.
- source_word: ad uiolationem
  english_pob_choice: for violation
  chosen_korean: 파괴와 관련된 징벌
  alternatives_korean:
  - 훼손을 위하여
  - 위반을 위하여
  - 침해를 위하여
  lexicon: violatio
  rationale: 라틴어의 추상명사적 목적구를 한국어 독자가 이해할 수 있도록 ‘파괴/훼손’ 계열의 의미를 살리되, 문맥상 재앙 목록의 종결 목적을 반영했습니다.
theological_decisions:
- issue: 재앙 목록의 어조와 직설성
  chosen_reading: 하나님이 보내시는 재앙을 예언적 선언으로 직접 진술합니다.
  alternative_readings:
  - 완곡하게 ‘환난’으로 일반화하는 읽기
  - 원인 주체를 흐리는 수동형 읽기
  rationale: 본문은 심판 선언의 직설성이 핵심이므로, 재앙의 구체 항목과 행위 주체를 선명하게 드러냈습니다.
  doctrine_reference: 예언적 심판 선언의 문맥
- issue: ad uiolationem의 처리
  chosen_reading: ‘파괴와 관련된 징벌’로 목적성을 살렸습니다.
  alternative_readings:
  - ‘위반을 위하여’로 직역하는 읽기
  - ‘훼손을 위해’로 단순화하는 읽기
  rationale: 라틴어 목적구의 문법적 기능을 유지하면서도 한국어에서 무의미하게 들리는 직역을 피했습니다.
  doctrine_reference: 라틴어 목적 구문 해석
