revisions:
- from: 제가 여러분에게 재앙들을 보내겠습니다. 곧 과부 됨과 가난과 기근과 칼과 전염병입니다. 그것은 여러분의 집들을 황폐하게 하여, 파괴와 관련된 징벌이 되게 하려는 것입니다.[a]
  to: 내가 그대에게 재앙들을 보내겠습니다. 곧 과부가 됨과 가난과 기근과 칼과 전염병을 보내어, 그대의 집들을 황폐하게 하고 유린하기 위해서입니다.[a]
  rationale: 단수 2인칭을 회복하고, 두 ad 목적구를 ‘황폐하게 하고 유린하기 위해’로 병렬 번역했습니다. ‘징벌’처럼 원문에 없는 해석적 내용을 제거했으며, 현대적인 합쇼체를 유지하되 화자의 겸양 표현은 피했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:15Z'
review_pass:
  verdict: revise
  source_fidelity: 수신 대상이 라틴어 단수 tibi인데 초안은 ‘여러분’으로 복수화했습니다. 또한 ad uiolationem은 앞의 ad deuastandas domus tuas와 나란한 목적구이므로, ‘파괴와 관련된 징벌’처럼 본문에 없는 ‘징벌’을 보태거나 결과절로 바꾸지 않는 편이 안전합니다.
  naturalness: ‘과부 됨’은 띄어쓰기와 표현이 다소 어색하므로 ‘과부가 됨’이 현대 한국어에서 더 자연스럽습니다. 목적을 나타내는 두 구문은 ‘…하고 …하기 위해’로 병렬 처리하면 분명합니다.
  terminology: mala는 ‘재앙들’, uiduitas는 ‘과부가 됨’, violatio는 문맥상 불필요하게 의미를 확정하지 않고 ‘유린’으로 옮겼습니다. 이는 ‘위반’이라는 추상적 법률 용어보다 재난·파괴의 문맥에 자연스럽고, 본문에 없는 징벌 개념을 추가하지 않습니다.
  issues:
  - severity: high
    issue: 단수 수신 대상을 복수로 번역함
    rationale: tibi와 tuas는 단수 2인칭입니다. ‘여러분/여러분의’는 원문의 수를 바꾸므로 ‘그대/그대의’로 고쳐야 합니다.
  - severity: high
    issue: ad uiolationem에 ‘징벌’을 첨가하고 병렬 목적구를 해체함
    rationale: 라틴어에는 ‘징벌’에 해당하는 말이 없습니다. ad deuastandas domus tuas, ad uiolationem의 병렬 목적 기능을 한국어에서도 보존해야 합니다.
  - severity: medium
    issue: 신적 화자의 자칭으로 ‘제가’를 사용함
    rationale: ‘제가’는 청자에 대한 겸양을 나타내므로 심판 선언의 화자에게 부적절합니다. ‘내가’가 원문의 직접성을 보존합니다.
  revised_text: 내가 그대에게 재앙들을 보내겠습니다. 곧 과부가 됨과 가난과 기근과 칼과 전염병을 보내어, 그대의 집들을 황폐하게 하고 유린하기 위해서입니다.[a]
