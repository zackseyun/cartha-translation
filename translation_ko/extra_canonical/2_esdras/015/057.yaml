  - severity: medium
    issue: 각주가 절 경계를 이문으로 오인시킬 수 있음
    rationale: ‘자기들의’에 해당하는 suas는 다음 절에 걸쳐 있으므로, ‘또는’이라는 형식으로 본절의 대안 번역처럼 제시하기보다 다음 절과의 연결임을 밝혀야 합니다.
  - severity: low
