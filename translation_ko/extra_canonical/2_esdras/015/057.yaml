  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ciuitates tuae conterentur, et omnes tui in campo gladio cadent; Et qui sunt in montibus fame peribunt, et manducabunt carnes
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/057.yaml
  text: Your cities will be shattered[a], and all your people in the field will fall by the sword. And those in the mountains will perish by famine and will eat flesh.
  footnotes:
  - marker: a
    text: Or 'And those in the mountains will perish by famine and will eat their own flesh'.
    reason: previous_rendering
translation:
  language: ko
  text: 네 성읍들은 산산이 부서질 것이며, 들판에 있는 네 모든 백성은 칼에 쓰러질 것입니다. 산에 있는 이들은 기근으로 죽고 살을 먹을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다음 절 첫머리의 ‘자기들의’와 연결하여 읽으면, ‘자기들의 살을 먹을 것입니다’로 이해할 수 있습니다.
    reason: 소유 표현 suas가 다음 절에 걸쳐 있으므로, 본절의 ‘살’에 소유 한정을 덧붙이는 해석이 절 경계에 따른 것임을 명확히 합니다.
lexical_decisions:
- source_word: ciuitates tuae conterentur
  english_pob_choice: Your cities will be shattered
  chosen_korean: 당신의 성읍들은 무너질 것이며
  alternatives_korean:
  - 당신의 도시들은 부서질 것이며
  - 당신의 성읍들은 산산이 부서질 것이며
  lexicon: ciuitas → 성읍
  rationale: 라틴어 ciuitates는 단순한 행정도시보다 방어·공동체 단위의 ‘성읍’이 자연스럽고, conterentur의 파괴상을 ‘무너질’로 옮겨 과도한 의역 없이 재현했습니다.
- source_word: omnes tui in campo
  english_pob_choice: all your people in the field
  chosen_korean: 들판에 있는 당신의 모든 사람은
  alternatives_korean:
  - 들판에 있는 당신의 모든 자는
  - 들판에 있는 당신의 모든 백성은
  lexicon: tui → 당신의 사람들
  rationale: 영어 POB의 수정대로 all yours는 ‘당신의 모든 사람’이라는 소유 집합을 가리키므로, 한국어에서도 자연스럽게 인칭 집합을 풀어 옮겼습니다.
- source_word: gladio cadent
  english_pob_choice: will fall by the sword
  chosen_korean: 칼에 쓰러질 것입니다
  alternatives_korean:
  - 칼로 쓰러질 것입니다
  - 칼에 엎드러질 것입니다
  lexicon: gladius → 칼
  rationale: gladio는 전쟁 문맥의 도구격으로서 ‘칼에’가 가장 직접적이며, cadent는 단순 사망보다 전투적 몰살의 이미지를 살려 ‘쓰러질’로 옮겼습니다.
- source_word: manducabunt carnes
  english_pob_choice: will eat flesh
  chosen_korean: 살을 먹게 될 것입니다
  alternatives_korean:
  - 고기를 먹게 될 것입니다
  - 자기 살을 먹게 될 것입니다
  lexicon: manducare / carnes → 먹다 / 살
  rationale: 라틴어는 여기서 ‘자기’가 명시되지 않으므로, POB 수정처럼 절대적 반사표현을 넣지 않고 ‘살’만 직역해 전해지는 충격을 유지했습니다.
theological_decisions:
- issue: 문장 경계와 비참한 예언의 직설성
  chosen_reading: 라틴어 원문 순서를 따라 성읍의 파괴, 들판의 전사, 산지의 기근과 식인 가능성을 연속된 심판 선언으로 직설적으로 옮겼습니다.
  alternative_readings:
  - 첫 절을 이전 절로 넘겨 완화하는 읽기
  - ‘살을 먹다’를 완곡하게 ‘식량을 먹다’로 바꾸는 읽기
  rationale: 이 구절은 재난의 점증을 의도하므로, 비참한 이미지를 누그러뜨리지 않고 원문의 잔혹성을 보존하는 편이 본문 의도에 충실합니다.
  doctrine_reference: 예언 문학의 심판 경고와 본문 직설성
