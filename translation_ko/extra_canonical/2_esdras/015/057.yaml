  source_fidelity: ‘무너질’은 conterentur(짓눌려 부서지다/산산이 부서지다)의 파괴 강도를 충분히 드러내지 못하며, manducabunt은 능동 미래이므로 ‘먹게 될 것입니다’보다 ‘먹을 것입니다’가 직접적입니다. 또한 현 각주는 이 절 자체의 이문처럼 ‘자기 살’을 제시하지만, 그 소유 표현은 다음 절에 걸쳐 있으므로 절 경계를 설명해야 합니다.
  naturalness: ‘당신의 모든 사람’은 현대 한국어에서 다소 부자연스럽고 ‘당신’은 직접 호칭에서 불필요한 거리감이나 모호함을 낳을 수 있습니다. 예언적 직접 خطاب에는 ‘네’가 자연스럽고, ‘네 모든 백성’이 원문의 집단 지시를 매끄럽게 전달합니다.
  terminology: ciuitates는 ‘성읍’, gladio cadent는 ‘칼에 쓰러지다’, fames는 ‘기근’으로 유지합니다. carnes는 본절에서 소유 한정을 보태지 않고 ‘살’로 옮깁니다.
  issues:
