  text: and they will have plunder and wipe out the glory of your face.
translation:
  language: ko
  text: 그들은 전리품을 얻게 되고, 당신의 얼굴의 영광을 멸망시킬 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역상 ‘전리품을 가지게 되고’에 해당하는 구절을 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: praeda habebunt
  english_pob_choice: they will have plunder
  chosen_korean: 전리품을 얻게 되고
  alternatives_korean:
  - 약탈물을 가지게 되고
  - 노획물을 얻게 되고
  lexicon: praeda
  rationale: praeda는 ‘전리품/노획물’의 뜻이므로, POB가 추가한 ‘they will have plunder’의 의미를 살려 자연스러운 미래 표현으로 옮겼습니다.
- source_word: gloriam
  english_pob_choice: the glory
  chosen_korean: 영광을
  alternatives_korean:
  - 광채를
  - 영예를
  lexicon: gloria
  rationale: gloriam의 핵심 의미를 그대로 따라 ‘영광’으로 옮겼습니다.
- source_word: faciei tuae
  english_pob_choice: of your face
  chosen_korean: 당신의 얼굴의
  alternatives_korean:
  - 당신의 얼굴의
  - 당신의 낯의
  lexicon: facies
  rationale: facies는 문자적으로 ‘얼굴’이므로, 문맥을 과도하게 해석하지 않고 직역에 가깝게 유지했습니다.
- source_word: exterminabunt
  english_pob_choice: wipe out
  chosen_korean: 멸망시킬 것입니다
  alternatives_korean:
  - 지워버릴 것입니다
  - 없애버릴 것입니다
  lexicon: extermino
  rationale: exterminabunt는 단순한 훼손보다 파괴적 소멸의 뉘앙스가 강하므로 ‘멸망시키다’로 옮겼습니다.
theological_decisions:
- issue: ‘당신의 얼굴의 영광’이라는 표현의 직역성 유지
  chosen_reading: ‘얼굴’을 완화하지 않고 그대로 살려, 인격적 임재와 영광의 표지를 함께 드러내도록 했습니다.
  alternative_readings:
  - ‘임재의 영광’으로 의역
  - ‘낯의 영광’으로 더 고어적으로 번역
  rationale: 원문은 faciei tuae라는 구체적 표현을 사용하므로, 이를 추상화하면 원문의 긴장과 이미지가 약화됩니다.
  doctrine_reference: source transparency / lexical fidelity
