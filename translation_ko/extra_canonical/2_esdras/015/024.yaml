id: 2ES.15.24
reference: 2 Esdras 15:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vae eis qui peccant et non observant mandata mea, dicit Dominus,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/024.yaml
  text: Woe to those who sin and do not keep my commandments, says the Lord.
translation:
  language: ko
  text: “죄를 짓고 내 계명을 지키지 않는 자들에게 화가 있을 것입니다”라고 주님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 vae는 ‘화’보다 넓은 예언적 재앙 경고를 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: vae eis
  english_pob_choice: Woe to those
  chosen_korean: “...에게 화가 있을 것입니다”
  alternatives_korean:
  - “...에게 화가 있습니다”
  - “...는 화가 있습니다”
  - “...에게 재앙이 있습니다”
  lexicon: vae
  rationale: 라틴어 감탄사 vae는 단순한 감정보다 심판 선언의 경고를 담으므로, 현대 한국어에서는 자연스럽고 문어체인 ‘화가 있을 것입니다’로 옮겼습니다.
- source_word: peccant
  english_pob_choice: those who sin
  chosen_korean: “죄를 짓고”
  alternatives_korean:
  - “죄를 범하고”
  - “범죄하며”
  - “죄를 짓는 자들”
  lexicon: peccare
  rationale: 동작성을 살리면서도 본문의 일반적 윤리 위반을 드러내기 위해 ‘죄를 짓고’로 번역했습니다.
- source_word: mandata mea
  english_pob_choice: my commandments
  chosen_korean: “내 계명을 지키지 않는”
  alternatives_korean:
  - “내 계명들을 지키지 않는”
  - “내 명령을 지키지 않는”
  - “내 율례를 지키지 않는”
  lexicon: mandatum
  rationale: 라틴어 mandata는 복수이지만 한국어에서는 자연스럽게 집합적으로 ‘계명’이라고 옮길 수 있어, 복수성을 문맥상 보존하면서도 ‘내 계명’으로 처리했습니다.
- source_word: dicit Dominus
  english_pob_choice: says the Lord
  chosen_korean: “라고 주님께서 말씀하십니다”
  alternatives_korean:
  - “라고 주님이 말씀하십니다”
  - “라고 주께서 말씀하십니다”
  - “이라고 주님께서 말씀하십니다”
  lexicon: Dominus
  rationale: 원문 서술 표지를 살려 인용문 뒤에 발화 주체를 덧붙였고, Dominus는 한국어 경건 문체에 맞는 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 심판 경고문의 강도
  chosen_reading: vae를 부드럽게 완화하지 않고 심판 선언으로 유지했습니다.
  alternative_readings:
  - 단순한 탄식으로 약화
  - 도덕적 유감 표현으로 순화
  rationale: 본문은 죄와 불순종에 대한 예언적 경고이므로, 현대어라도 심판성과 긴박감을 드러내는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 예언서/묵시문학의 심판 경고 어법
