  text: and drink their own blood because of hunger for bread and thirst for water[a]. Unhappy one, as the foremost you will come[b], and again you will receive evils.
  footnotes:
  - marker: a
    text: The phrase rendered 'chief among women' translates the difficult Latin primaria. It likely mocks Asia's former prominence or rank, but the exact nuance is uncertain.
