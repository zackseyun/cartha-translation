review_pass:
  verdict: revise
  source_fidelity: 라틴어의 원인구(a fame panis et siti aquae), 미래 서술, 그리고 personified 대상에 대한 Infelix의 직접 호명을 충실히 반영합니다. primaria는 ‘여자들 가운데’라는 제한을 덧붙이지 않고 지위상의 ‘으뜸/최고위’라는 뜻으로 보존해야 합니다.
  naturalness: ‘가장 앞선 자로 오겠으나’는 한국어에서 다소 직역투이고 ‘앞선’이 시간·공간상의 선행으로도 읽힐 수 있습니다. ‘으뜸인 자로 오겠지만’이 지위상의 의미와 예언적 대조를 자연스럽게 전달합니다. 또한 ‘빵이 없어… 물이 없어…’가 결핍 때문에 생긴 굶주림과 갈증을 더 분명하게 드러냅니다.
  terminology: ‘불행한 자여’는 infelix의 비탄과 심판 선언의 어조를 유지합니다. primaria는 ‘으뜸인 자’로 옮기고, 각주에서 가능한 대안을 제한적으로 제시합니다.
  issues:
  - severity: medium
    issue: primaria의 본문 번역이 ‘가장 앞선 자’로 되어 있음
    rationale: 이는 한국어에서 ‘가장 먼저/앞서 있는’이라는 공간적·시간적 의미를 강하게 낼 수 있어, 라틴어의 지위·탁월성 의미(first in rank)를 충분히 전달하지 못합니다.
  - severity: low
    issue: 각주가 본문 표현을 반복하며 대안의 관계가 불명확함
    rationale: 현재 각주는 ‘가장 앞선 자로’가 ‘으뜸으로’로도 읽힌다고 설명하지만, 간결하게 실제 번역 대안을 제시하는 편이 자연스럽고 유용합니다.
  revised_text: 그들은 빵이 없어 굶주리고 물이 없어 목말라 자기들의 피를 마시게 될 것입니다. 불행한 자여, 네가 으뜸인 자로 오겠지만[b], 다시 재앙을 받게 될 것입니다.
