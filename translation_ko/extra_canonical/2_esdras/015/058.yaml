    reason: previous_rendering
translation:
  language: ko
  text: 그들은 빵이 없어 굶주리고 물이 없어 목말라 자기들의 피를 마시게 될 것입니다. 불행한 자여, 네가 으뜸인 자로 오겠지만[b], 다시 재앙을 받게 될 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 또는 ‘으뜸으로’. 라틴어 primaria는 ‘첫째인, 최고위의’라는 뜻이며, 정확한 뉘앙스는 분명하지 않습니다.
    reason: lexical_alternative
