- from: 그들은 게으른 도시를 치고, 당신의 땅 일부를 황폐하게 하며, 당신의 영광의 일부를 멸망시킬 것이며, 폐허가 된 바빌론에서 다시 돌아올 것입니다. 그들은 당신에게는 짚처럼 부서질 것이며, 당신에게는 불처럼 될 것입니다.[a]
  to: 그들은 한가한 도시를 치고, 당신의 땅 일부를 황폐하게 하며, 당신의 영광의 일부를 멸망시킬 것입니다. 그들은 폐허가 된 바빌론에서 다시 돌아올 것입니다. 당신은 그들에게 짚처럼 무너질 것이며, 그들은 당신에게 불과 같을 것입니다.
  rationale: 원문의 절 구조와 대명사 관계를 보존하여, 공격자들(그들)과 공격받는 대상(당신)의 역할을 명확히 했습니다. otiosam은 불필요한 도덕적 해석을 피하여 ‘한가한’으로 옮겼고, 불확실하거나 본문에 없는 설명을 덧붙인 각주는 삭제했습니다.
