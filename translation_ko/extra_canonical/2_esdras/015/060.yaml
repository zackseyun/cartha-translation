  - severity: medium
    issue: ‘게으른 도시’의 어감
    rationale: otiosam은 ‘한가한, 유휴한, 활동하지 않는’이라는 뜻이며, ‘게으른’은 도시의 도덕적 게으름을 단정하는 느낌이 강합니다.
  - severity: low
    issue: 각주가 불필요하며 해석을 과도하게 한정함
    rationale: 원문은 otiosam의 의미를 더 구체적으로 규정하지 않습니다. 현 각주는 ‘무기력하고 방치된 상태’라는 해석을 본문 이상으로 부가합니다.
