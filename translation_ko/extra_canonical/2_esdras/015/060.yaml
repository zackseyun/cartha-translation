review_pass:
  verdict: revise
  source_fidelity: 라틴어의 주어 전환을 바로잡아야 합니다. 원문은 앞부분에서 ‘그들’이 공격하는 일을 말한 뒤, ‘너는 그들에게 짚처럼 무너질 것이며, 그들은 너에게 불과 같을 것이다’라고 합니다. 초안은 이 마지막 절에서도 ‘그들’이 ‘짚처럼 부서질 것’이라고 하여 의미가 역전되었습니다.
  naturalness: ‘게으른 도시’는 도시를 수식할 때 다소 부자연스럽고 도덕적 비난을 과도하게 암시할 수 있습니다. ‘한가한 도시’가 otiosam의 기본 뜻을 더 자연스럽게 보존합니다. 또한 ‘그들은 당신에게는’의 중복 조사와 문장 연결을 정리했습니다.
  terminology: ‘영광’, ‘바빌론’, ‘짚’, ‘불’의 핵심 이미지는 유지했습니다. stipula는 여기서 짚/검불의 취약성과 불에 타기 쉬운 이미지를 함께 지니므로 ‘짚처럼’은 가능합니다.
