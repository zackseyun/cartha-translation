id: 2ES.15.60
reference: 2 Esdras 15:60
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: allident ciuitatem otiosam et exterent aliquam portionem terrae tuae et partem gloriae tuae exterminabunt rursum reuertentes a Babylonia subuersa. Et demolita eris illis pro stipula et ipsi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/060.yaml
  text: They will strike the idle city and lay waste some portion of your land, and they will destroy part of your glory, returning again from devastated Babylon. And you will be broken down by them like stubble, and they will be to you like fire.
translation:
  language: ko
  text: 그들은 게으른 도시를 치고, 당신의 땅 일부를 황폐하게 하며, 당신의 영광의 일부를 멸망시킬 것이며, 폐허가 된 바빌론에서 다시 돌아올 것입니다. 그들은 당신에게는 짚처럼 부서질 것이며, 당신에게는 불처럼 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘게으른 도시’입니다. POB의 ‘idle’은 단순한 비활동이 아니라 무기력하고 방치된 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ciuitatem otiosam
  english_pob_choice: the idle city
  chosen_korean: 게으른 도시
  alternatives_korean:
  - 한가한 도시
  - 게으름 부리는 도시
  lexicon: ciuitas, otiosus
  rationale: otiosam은 단순히 ‘한가한’보다 ‘게으른’이 상태와 도덕적 평가를 더 직접적으로 드러내므로, POB의 ‘idle’에 가장 가까운 자연스러운 표현으로 옮겼습니다.
- source_word: exterent aliquam portionem terrae tuae et partem gloriae tuae exterminabunt
  english_pob_choice: lay waste some portion of your land, and they will destroy part of your glory
  chosen_korean: 당신의 땅 일부를 황폐하게 하며, 당신의 영광의 일부를 멸망시킬 것이며
  alternatives_korean:
  - 당신의 땅 일부를 황폐시키며, 당신의 영광의 일부를 파괴할 것이며
  - 당신의 땅 일부를 황폐하게 만들며, 당신의 영광의 일부를 없앨 것이며
  lexicon: exterere, exterminare, terra, gloria
  rationale: exterere/exterminare의 파괴 강도를 살리면서도 ‘영광’을 무너뜨리는 이미지가 유지되도록 ‘황폐하게 하다/멸망시키다’를 택했습니다.
- source_word: rursum reuertentes a Babylonia subuersa
  english_pob_choice: returning again from devastated Babylon
  chosen_korean: 폐허가 된 바빌론에서 다시 돌아올 것이며
  alternatives_korean:
  - 무너진 바빌론에서 다시 돌아올 것이며
  - 황폐해진 바빌론에서 다시 돌아올 것이며
  lexicon: rursum, reuertentes, Babylonia subuersa
  rationale: subuersa는 단순한 ‘파괴된’보다 ‘폐허가 된/무너진’이 상태를 더 생생하게 전달하므로, 이동 동사와 함께 자연스럽게 배치했습니다.
- source_word: pro stipula
  english_pob_choice: like stubble
  chosen_korean: 짚처럼
  alternatives_korean:
  - 검불처럼
  - 짚단처럼
  lexicon: stipula
  rationale: stipula는 건조한 짚이나 검불의 뜻이지만, 한국어 성경체에서는 ‘짚처럼’이 가장 간결하게 취약성과 쉽게 부서짐을 전달합니다.
theological_decisions:
- issue: 직유의 폭력성과 파괴 이미지
  chosen_reading: ‘짚처럼 부서질 것이며, 당신에게는 불처럼 될 것입니다’라는 이중 직유를 그대로 유지해 공격과 심판의 긴장을 약화시키지 않았습니다.
  alternative_readings:
  - ‘검불처럼 타버릴 것입니다’처럼 의미를 완화하는 번역
  - 직유를 설명형 문장으로 바꾸는 번역
  rationale: 라틴 원문과 POB는 파괴적 대칭을 의도하므로, 직유를 보존해야 본문의 예언적 경고가 살아납니다.
  doctrine_reference: 예언적 심판 언어의 수사적 보존
