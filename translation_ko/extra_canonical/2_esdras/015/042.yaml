  text: 그들은 도시와 성벽, 산과 언덕, 숲의 나무와 초원의 풀을 파괴할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: demolient
  english_pob_choice: they will tear down
  chosen_korean: 무너뜨릴 것입니다
  alternatives_korean:
  - 헐어 버릴 것입니다
  - 파괴할 것입니다
  lexicon: demolient
  rationale: 대상 목록 전체를 무너뜨리는 파괴 행위를 자연스럽게 살리면서도, 건축물뿐 아니라 자연물까지 포괄하는 문맥에 무리 없이 맞습니다.
- source_word: ciuitates et muros
  english_pob_choice: cities and walls
  chosen_korean: 도시와 성벽
  alternatives_korean:
  - 성읍들과 성벽들
  - 도시들과 담들
  lexicon: ciuitates / muros
  rationale: ciuitates는 일반적 거주지 공동체로서 ‘도시’가 자연스럽고, muros는 단순한 담보다 방어 구조를 드러내는 ‘성벽’이 더 정확합니다.
- source_word: ligna siluarum et fena
  english_pob_choice: trees of the forests and grass of the meadows
  chosen_korean: 숲의 나무들과 초원의 풀
  alternatives_korean:
  - 숲의 나무들과 들판의 풀
  - 숲의 나무들과 목초지의 풀
  lexicon: ligna siluarum / fena
  rationale: ligna siluarum은 숲의 목재가 아니라 숲 속의 나무들을 가리키는 것으로 보는 것이 자연스럽고, fena는 목초지의 풀로 번역할 수 있으나 한국어에서는 ‘초원의 풀’이 더 간결합니다.
theological_decisions:
- issue: 파괴 대상의 범위
  chosen_reading: 본문은 도시와 방어 구조물뿐 아니라 산, 언덕, 숲의 나무, 풀까지 포괄적으로 파괴가 미칠 것을 말합니다.
  alternative_readings:
  - 인간 거주 시설만의 파괴로 좁게 읽는 해석
  - 자연물 목록을 비유적으로만 읽는 해석
  rationale: 라틴 원문이 열거하는 대상들을 그대로 보존해야 하며, 영어 POB도 목록의 포괄성을 유지합니다.
  doctrine_reference: 종말 심판의 광범위한 파괴 묘사
