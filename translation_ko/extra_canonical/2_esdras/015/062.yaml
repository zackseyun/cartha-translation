source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuam et montes tuos, omnes siluas tuas et lignum fructiferum igni conburent. Filios tuos captiuos ducent et censum tuum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/062.yaml
  text: Your children they will carry away captive, and your wealth they will take as spoil,
translation:
  language: ko
  text: 그들은 너희 자녀들을 포로로 끌고 가고, 너희 재산은 노략물로 삼을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 본문은 앞부분에 ‘너희의 것들, 너희 산들, 너희 숲들, 그리고 열매 맺는 나무’를 불로 태운다는 이미지를 포함하지만, 영어 POB는 뒤의 결과를 요약해 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: Filios tuos captiuos ducent
  english_pob_choice: Your children they will carry away captive
  chosen_korean: 너희 자녀들을 포로로 끌고 가고
  alternatives_korean:
  - 너희 자녀들을 사로잡아 데려가고
  - 너희 자녀들을 포로로 잡아 끌고 가고
  lexicon: captiuos / ducent
  rationale: captiuos는 단순한 이동이 아니라 전쟁 포로로 잡혀 가는 상태를 나타내므로, POB의 의미를 살려 ‘포로로 끌고 가고’로 옮겼습니다.
- source_word: censum tuum
  english_pob_choice: your wealth
  chosen_korean: 너희 재산은
  alternatives_korean:
  - 너희 재물은
  - 너희 소유는
  lexicon: censum
  rationale: census는 인명조사보다 ‘재산, 소유, 자산’의 의미가 여기서 자연스럽고, 문맥상 약탈 대상이므로 ‘재산’이 가장 직접적입니다.
- source_word: igni conburent
  english_pob_choice: they will take as spoil
  chosen_korean: 노략물로 삼을 것입니다
  alternatives_korean:
  - 불사르듯 빼앗을 것입니다
  - 전리품으로 취할 것입니다
  lexicon: conburere / spolia
  rationale: 라틴 본문에는 ‘불로 태우다’가 포함되지만, 이어지는 후반부의 약탈 맥락과 POB의 영어 풀이를 함께 반영하여 ‘노략물로 삼다’로 압축했습니다.
theological_decisions:
- issue: 라틴 본문과 영어 POB 사이의 강조 차이
  chosen_reading: 본문의 불태움 이미지는 전면에 두지 않고, 전쟁 포로화와 약탈이라는 결과를 중심으로 번역했습니다.
  alternative_readings:
  - ‘그들은 너희 나무와 열매 맺는 나무를 불로 태울 것입니다’
  - ‘...그리고 너희 재산을 불사르고 빼앗을 것입니다’
  rationale: 해당 절의 영어 POB는 이미 결과를 ‘포로로 끌려감’과 ‘노략’으로 요약하고 있어, 한국어도 그 핵심적 파괴를 보존하되 중복된 파괴 이미지는 덜어냈습니다.
  doctrine_reference: 문예·예언적 심판 묘사
