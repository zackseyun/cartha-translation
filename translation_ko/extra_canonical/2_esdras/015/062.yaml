  source_fidelity: 현 초안은 라틴어 본문에 있는 성읍·산·숲·열매 맺는 나무를 불사르는 내용을 본문에서 누락하고 각주로 돌렸습니다. 이는 본절의 직접적인 예언 내용을 축소합니다. 또한 라틴어의 2인칭 단수 소유형(tuam, tuos, tuas, tuum)에 맞춰 ‘너의/네’로 일관되게 옮겨야 합니다.
  naturalness: ‘포로로 끌고 가며’와 ‘노략물로 삼을 것입니다’는 현대 표준어 문어체에서 자연스럽고, 예언적 선언에 적합한 합쇼체입니다.
  terminology: civitatem은 ‘성읍’, silvas는 ‘숲’, lignum fructiferum은 집합적 의미를 살려 ‘열매 맺는 나무들’, captivos ducent는 ‘포로로 끌고 가다’, censum은 문맥상 ‘재산’으로 옮겼습니다.
