  yaml_path: translation/extra_canonical/2_esdras/015/001.yaml
  text: Behold, speak in the hearing of my people the words of prophecy
translation:
  language: ko
  text: 보십시오, 내 백성의 귀에 예언의 말씀을 전하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보시오
  lexicon: ecce
  rationale: 청자에게 주의를 환기하는 감탄·명령형으로, 현대 합쇼체에서 가장 자연스럽고 공적인 호소를 살립니다.
- source_word: in aures plebi meae
  english_pob_choice: in the hearing of my people
  chosen_korean: 내 백성의 귀에
  alternatives_korean:
  - 내 백성의 듣는 데
  - 내 백성이 들을 때
  lexicon: auris
  rationale: 라틴어 aures는 문자적으로 ‘귀들’이지만, 최신 영어 감수본의 ‘in the hearing of’처럼 ‘공개적으로 들리게’라는 의미를 살려 한국어로는 간결하게 표현했습니다.
- source_word: sermones
  english_pob_choice: the words
  chosen_korean: 말씀을
  alternatives_korean:
  - 말들을
  - 말을
  lexicon: sermo
  rationale: sermones는 단순한 말보다 내용이 실린 선포를 가리키므로, 예언 문맥에 맞게 ‘말씀’을 택했습니다.
- source_word: prophetiae
  english_pob_choice: of prophecy
  chosen_korean: 예언의
  alternatives_korean:
  - 예언에 속한
  - 예언적인
  lexicon: prophetia
  rationale: 명사의 소유·수식 관계를 자연스럽게 살려 ‘예언의 말씀’으로 옮겼습니다.
theological_decisions:
- issue: 공적 선포의 장면을 어떻게 드러낼지
  chosen_reading: 단순한 청취가 아니라 백성 앞에서 들리도록 예언을 선포하라는 공적 명령으로 옮겼습니다.
  alternative_readings:
  - 내 백성의 귀에 직접 말하라
  - 내 백성이 듣는 자리에서 말하라
  rationale: 영어 POB의 revised phrasing인 ‘in the hearing of’가 강조하는 공개성과 공식성을 반영해, 예언의 전달이 공동체 전체를 향한 선포임을 드러냈습니다.
  doctrine_reference: 예언의 공적 선포와 회중적 청취
