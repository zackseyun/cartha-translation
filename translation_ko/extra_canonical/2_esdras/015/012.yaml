id: 2ES.15.12
reference: 2 Esdras 15:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugeat Aegyptus et fundamenta eius a plaga verberati et mastigati quam inducet Dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/012.yaml
  text: Let Egypt mourn[a], and its foundations, because of the plague of blows and scourging that the Lord will bring upon it.
  footnotes:
  - marker: a
    text: Or 'chastisement'.
    reason: previous_rendering
translation:
  language: ko
  text: 이집트가 애도하며, 그 기초들도 타격과 채찍질의 재앙으로 인해 애도하게 하십시오. 주께서 그것을 불러오실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘징계’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: lugeat Aegyptus
  english_pob_choice: Let Egypt mourn
  chosen_korean: 이집트가 애도하며
  alternatives_korean:
  - 이집트가 슬퍼하며
  - 이집트가 통곡하며
  lexicon: lugeo
  rationale: lugeat는 단순한 슬픔보다 공개적 애도에 가까워서, 예언적 명령형의 어조를 살리며 ‘애도하다’로 옮겼습니다.
- source_word: fundamenta eius
  english_pob_choice: its foundations
  chosen_korean: 그 기초들도
  alternatives_korean:
  - 그 기초들
  - 그 토대도
  lexicon: fundamentum
  rationale: 기초/토대의 문자적 의미를 유지하되, 도성이나 나라의 근간까지 흔들리는 이미지를 드러내기 위해 복수형으로 살렸습니다.
- source_word: a plaga verberati et mastigati
  english_pob_choice: because of the plague of blows and scourging
  chosen_korean: 타격과 채찍질의 재앙으로 인해
  alternatives_korean:
  - 맞음과 채찍질의 재앙으로 인해
  - 매와 채찍질의 재앙으로 인해
  lexicon: plaga / verberati / mastigati
  rationale: apocalyptic oracle의 물리적 폭력을 약화하지 않기 위해 plaga를 ‘재앙’, verberati를 ‘타격’, mastigati를 ‘채찍질’로 분리해 옮겼습니다.
- source_word: quam inducet Dominus
  english_pob_choice: that the Lord will bring upon it
  chosen_korean: 주께서 그것을 불러오실 것입니다
  alternatives_korean:
  - 주께서 그것에 가져오실 것입니다
  - 주께서 그것 위에 내리실 것입니다
  lexicon: inducere
  rationale: inducet의 ‘가져오다/불러오다’ 계열을 따라, 재앙이 주도적으로 임함을 드러내는 방향으로 번역했습니다.
theological_decisions:
- issue: 예언적 명령형의 한국어 어조
  chosen_reading: 본문의 연쇄 명령을 직설적 예언 어조로 살려 ‘애도하며… 애도하게 하십시오’로 옮겼습니다.
  alternative_readings:
  - 서술형으로 완화해 ‘이집트가 애도합니다’로 번역할 수 있음
  rationale: 라틴어 lugeat는 단순 진술보다 선언적·명령적 힘이 있어, 종말론적 심판 선언의 긴박감을 유지하는 쪽이 원문에 더 가깝습니다.
  doctrine_reference: 예언 문체와 심판 선포의 수사
