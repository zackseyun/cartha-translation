  language: ko
  text: 그리고 남아 있는 자들은 그들을 두렵게 한 자들을 섬길 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 라틴어 eam은 문맥상 여성형 대상(아마도 앞문맥의 도시/시온)을 가리키지만, 본절 단독으로는 대명사 지시 대상이 생략되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: subremanserint
  english_pob_choice: remain
  chosen_korean: 남아 있는 자들
  alternatives_korean:
  - 남은 자들
  - 살아남은 자들
  lexicon: subremanere
  rationale: 영문 POB가 'remain'으로 수정한 점을 따라, 단순한 생존보다 '남아 있음'을 드러내는 표현을 택했습니다.
- source_word: seruient
  english_pob_choice: will serve
  chosen_korean: 섬길 것입니다
  alternatives_korean:
  - 봉사할 것입니다
  - 종사할 것입니다
  lexicon: servire
  rationale: 라틴어 seruient의 기본 의미를 자연스러운 현대 한국어로 옮기되, 주종 관계의 뉘앙스를 지닌 '섬기다'를 사용했습니다.
- source_word: his qui eam exteruerunt
  english_pob_choice: those who terrified her
  chosen_korean: 그들을 두렵게 한 자들
  alternatives_korean:
  - 그녀를 두렵게 한 자들
  - 그것을 두렵게 한 자들
  lexicon: exterrere
  rationale: 영문 POB의 수정이 'terrified'임을 반영하여 '두렵게 하다'로 옮겼습니다. 지시대명사 eam의 대상은 문맥상 여성형 도시/시온을 가리키는 것으로 보이나, 한국어 문장에서는 앞문맥 없이 반복을 피하기 위해 대명사 대신 후행 수식을 유지했습니다.
theological_decisions:
- issue: exteruerunt의 의미를 'destroyed'가 아니라 'terrified'로 반영할지 여부
  chosen_reading: 그들을 두렵게 한 자들로 번역했습니다.
  alternative_readings:
  - 그녀를 멸망시킨 자들
  - 그녀를 파괴한 자들
  rationale: 제공된 POB 수정 이력에서 exteruerunt을 'terrified'로 재판정했으므로, 파괴/멸망의 강도를 부여하지 않고 두려움 유발을 보존했습니다.
