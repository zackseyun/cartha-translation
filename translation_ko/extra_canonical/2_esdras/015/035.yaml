  to: 그리고 그들은 서로를 칠 것이며, 땅 위에 큰 폭풍, 곧 그들의 폭풍을 쏟아부을 것입니다. 그리고 칼에서부터 말의 배에까지 피가 있을 것입니다.[a][b]
