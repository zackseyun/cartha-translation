base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/035.yaml
  text: And they will strike one another and pour out an abundant storm upon the earth[a], their storm[b]; and there will be blood from the sword up to the horse's belly.
  footnotes:
  - marker: a
    text: Latin sidus is singular here and throughout this section. It can mean 'star,' but in apocalyptic context it may also function as a celestial portent. The translation keeps 'star' to preserve the imagery.
    reason: lexical_alternative
    anchor_ref: '15:35'
  - marker: b
    text: Or 'pour out a heavy star upon the earth, even their star'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 서로를 칠 것이며, 땅 위에 큰 폭풍, 곧 그들의 폭풍을 쏟아부을 것입니다. 그리고 칼에서부터 말의 배에까지 피가 있을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 sidus는 이 구절과 이 단락 전체에서 단수형입니다. 이 말은 ‘별’을 뜻할 수 있으나, 묵시문학적 문맥에서는 천체의 징조를 가리킬 수도 있습니다. 여기서는 문맥에 따라 ‘폭풍’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “땅 위에 많은 별, 곧 그들의 별을 쏟아부을 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: conlident se invicem
  english_pob_choice: they will strike one another
  chosen_korean: 서로를 치고
  alternatives_korean:
  - 서로를 공격하고
  - 서로를 칠 것입니다
  lexicon: conlident
  rationale: 라틴어 conlident는 ‘서로 부딪치다/치다’의 강한 충돌 이미지를 가지므로, 무난한 ‘공격하다’보다 직접적인 ‘치다’를 택해 상호 충돌성을 살렸습니다.
- source_word: effundent sidus copiosum
  english_pob_choice: pour out an abundant storm
  chosen_korean: 풍성한 폭풍을 쏟아부으며
  alternatives_korean:
  - 무거운 폭풍을 쏟아부으며
  - 풍성한 별을 쏟아부으며
  lexicon: effundent / sidus / copiosum
  rationale: POB의 최신 판정대로 sidus를 ‘별’이 아니라 ‘폭풍’으로 이해하고, copiosum은 ‘풍성한’으로 옮겨 라틴어의 양감과 쏟아붓는 동작을 함께 살렸습니다.
- source_word: sanguis a gladio usque ad ventrem equi
  english_pob_choice: there will be blood from the sword up to the horse's belly
  chosen_korean: 칼로 인해 말의 배에까지 이르러 피가 흐를 것입니다
  alternatives_korean:
  - 칼에서 말의 배까지 피가 흐를 것입니다
  - 칼로부터 말의 배까지 피가 이를 것입니다
  lexicon: sanguis a gladio usque ad ventrem equi
  rationale: a gladio는 원인/출처를 드러내므로 ‘칼로 인해’로 옮기고, usque ad는 범위를 나타내는 ‘~에까지 이르러’로 처리해 피의 확장된 범위를 드러냈습니다.
theological_decisions:
- issue: apocalyptic sidus의 의미
  chosen_reading: ‘별’보다 ‘폭풍’으로 읽어, 하늘 징조가 지상에 쏟아지는 종말론적 재난 이미지를 살렸습니다.
  alternative_readings:
  - ‘별’로 직역하여 천체 표상을 유지하는 읽기
  - ‘천체의 징조’로 완곡하게 처리하는 읽기
  rationale: 문맥의 effundent와 copiosum, 그리고 인접 구절의 재난 묘사가 결합되어 ‘별’의 문자적 천체보다 ‘폭풍/재앙’의 상징적 의미가 더 분명합니다.
  doctrine_reference: apocalyptic imagery and lexical context
- issue: 반복 접속과 병렬 구조
  chosen_reading: 라틴어의 병렬을 살리기 위해 ‘그리고 … 그리고 …’의 중첩을 일부 유지했습니다.
  alternative_readings:
  - 한국어 자연성을 위해 병렬을 한 문장으로 축약하는 읽기
  rationale: 원문은 세 동작(서로 침, 쏟아붓음, 피가 흐름)을 누적적으로 배치하므로, 한국어에서도 누적 감각을 남겨 종말적 밀도를 보존했습니다.
  doctrine_reference: source-structure fidelity
