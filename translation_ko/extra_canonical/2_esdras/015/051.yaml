  text: exsurget ardor qui emissus est super te. Et infirmaberis et paupera a plaga et mastigata a uulneribus, ut non possis tuos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/051.yaml
  text: The burning that has been sent out against you will rise up[a], and you will be weakened and made poor by the blow, and scourged by wounds, so that you will not be able to receive your own.
  footnotes:
  - marker: a
    text: Or 'poor from the plague'.
    reason: previous_rendering
translation:
  language: ko
  text: 불이 네게로 보내진 채로 다시 일어날 것이며, 너는 타격으로 약해지고 가련해지며, 상처로 채찍질당하여 네 소유를 받을 수 없게 될 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘타격’은 라틴어 plaga를 전염병이 아니라 ‘맞음/때림’의 뜻으로 읽은 것입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: exsurget ardor qui emissus est super te
  english_pob_choice: The burning that has been sent out against you will rise up
  chosen_korean: 불이 네게로 보내진 채로 다시 일어날 것이며
  alternatives_korean:
  - 네게 보내진 불이 일어날 것이다
  - 네 위에 보내진 불길이 치솟을 것이다
  lexicon: ardor / emissus est / super te
  rationale: ardor의 불·불길 이미지를 살리되, emissus est를 ‘보내진’으로 옮겨 심판이 임의적 재난이 아니라 भेज아진 것임을 드러냈습니다.
- source_word: Et infirmaberis et paupera a plaga
  english_pob_choice: and you will be weakened and made poor by the blow
  chosen_korean: 너는 타격으로 약해지고 가련해지며
  alternatives_korean:
  - 너는 맞아 약해지고 가난해지며
  - 너는 충격으로 쇠약해지고 빈곤해지며
  lexicon: infirmaberis / paupera / plaga
  rationale: plaga를 전염병이 아니라 ‘타격’으로 이해한 영어 개정의 판단을 따르되, paupera는 경제적 빈곤보다 ‘가련해짐, 처참한 상태’를 나타내는 말로 옮겼습니다.
- source_word: et mastigata a uulneribus
  english_pob_choice: and scourged by wounds
  chosen_korean: 상처로 채찍질당하여
  alternatives_korean:
  - 상처들로 매질당하여
  - 상처들 때문에 채찍질을 당하여
  lexicon: mastigata / uulneribus
  rationale: mastigata의 능동적 고통을 살려 ‘채찍질당하여’로 옮기고, a uulneribus는 원인·수단을 드러내는 ‘상처로’로 간결하게 처리했습니다.
- source_word: ut non possis tuos
  english_pob_choice: so that you will not be able to receive your own
  chosen_korean: 네 소유를 받을 수 없게 될 것이다
  alternatives_korean:
  - 네 사람들을 맞아들일 수 없게 될 것이다
  - 네 것을 받을 수 없게 될 것이다
  lexicon: tuos
  rationale: tuos의 불완전한 종결을 그대로 보존하되, 문맥상 가장 절제된 ‘네 소유’로 처리하여 영어 역본이 남긴 미완성을 과도하게 보완하지 않았습니다.
theological_decisions:
- issue: 심판 이미지의 직역 수준
  chosen_reading: ‘불이…보내진 채로 다시 일어날 것이며’로 옮겨, 재난이 아니라 보내진 심판이라는 인과를 유지했습니다.
  alternative_readings:
  - ‘불길이 네 위로 치솟을 것이다’
  - ‘불이 네게 임할 것이다’
  rationale: 본문은 단순한 자연재해가 아니라 ‘보내진’ 불을 말하므로, 심판의 의도성을 흐리지 않는 방향이 더 적절합니다.
  doctrine_reference: 구약적 심판 표상과 예언문학의 재앙 어휘
