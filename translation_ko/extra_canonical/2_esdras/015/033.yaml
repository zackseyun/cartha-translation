  - severity: medium
    issue: ‘그들을 기다리며’가 매복·잠복의 뜻을 충분히 전달하지 못함
    rationale: subsessor subsedebit은 단순 대기가 아니라 매복자가 숨어서 노리는 행위입니다. ‘그들을 노리고 숨어 있다가’가 군사적 의미를 보존합니다.
  - severity: medium
    issue: unum ex illis를 ‘그들 가운데 하나’로 옮김
    rationale: 문맥상 illis는 사람들을 가리키며, 한국어에서는 ‘그들 중 한 사람’이 자연스럽고 지시 대상도 명확합니다.
