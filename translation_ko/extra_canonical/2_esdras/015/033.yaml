base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/033.yaml
  text: And from the territory of the Assyrians an ambusher will lie in wait for them and consume one of them, and there will be fear and trembling in their army and instability in their kingdom.
translation:
  language: ko
  text: 또 앗수르 사람들의 영토에서 한 매복자가 그들을 노리고 숨어 있다가 그들 중 한 사람을 집어삼킬 것이며, 그들의 군대에는 두려움과 떨림이 생기고 그들의 왕국은 불안정해질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: territorio Assyriorum
  english_pob_choice: from the territory of the Assyrians
  chosen_korean: 앗수르 지역에서는
  alternatives_korean:
  - 앗수르 땅에서는
  - 앗수르인의 영토에서는
  lexicon: toponym / genitive territory phrase
  rationale: 라틴어의 지리적 출처를 자연스러운 현대 한국어로 옮기되, 고유한 지명 ‘앗수르’를 유지해 출처의 지역성을 분명히 했습니다.
- source_word: subsessor subsedebit
  english_pob_choice: an ambusher will lie in wait for them
  chosen_korean: 매복한 자가 그들을 기다리며
  alternatives_korean:
  - 매복자가 그들을 엎드려 기다리며
  - 복병이 그들을 노리며
  lexicon: military ambush term
  rationale: subsessor의 ‘매복자/복병’ 의미를 살리면서, subsedebit의 지속적 대기·기습 뉘앙스를 한국어 ‘기다리며’로 옮겼습니다.
- source_word: consumet unum ex illis
  english_pob_choice: consume one of them
  chosen_korean: 그들 가운데 하나를 삼킬 것이며
  alternatives_korean:
  - 그들 중 하나를 멸할 것이며
  - 그들 가운데 하나를 집어삼킬 것이며
  lexicon: violent destruction verb
  rationale: consumet의 파괴·삼킴 이미지를 직접 살려, 단순한 ‘죽이다’보다 더 강한 소모·파괴의 감각을 유지했습니다.
- source_word: inconstabilitio in regno illorum
  english_pob_choice: instability in their kingdom
  chosen_korean: 그들의 왕국에는 불안정이 있을 것입니다
  alternatives_korean:
  - 그들의 왕국에는 흔들림이 있을 것입니다
  - 그들의 나라에는 불안이 있을 것입니다
  lexicon: abstract state noun
  rationale: inconstabilitio의 상태명사성을 살려 ‘불안정’으로 옮겨, 왕국 전체의 정치적 불안정 상태를 드러냈습니다.
theological_decisions:
- issue: 재앙의 예고를 어떻게 한국어로 전달할지
  chosen_reading: 군사적 매복, 공포, 떨림, 왕국의 불안정을 연속된 심판 묘사로 직역에 가깝게 제시했습니다.
  alternative_readings:
  - 도덕적 경고로 완화하여 표현
  - 예언적 상징을 강조해 비유적으로 처리
  rationale: 본문은 연속되는 재난 서술이므로, 의미를 완화하지 않고 사건성과 긴박성을 유지하는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: source-oriented apocalyptic narration
