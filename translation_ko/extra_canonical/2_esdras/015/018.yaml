  source_fidelity: 전반적으로 라틴어의 인과관계와 미래 시제를 잘 반영합니다. 다만 domus exterentur는 집이 반드시 구조적으로 ‘무너진다’는 뜻보다 ‘파괴되다/황폐하게 되다’라는 파괴의 결과를 가리키므로, ‘무너질’은 다소 좁은 표현입니다.
  naturalness: 합쇼체 문장으로 자연스럽고, 병렬 구조도 명료합니다. ‘도시들은 혼란에 빠지고, 집들은 파괴될 것이며, 사람들은 두려워할 것입니다’가 문맥과 문체 모두에 적절합니다.
  terminology: superbia는 ‘교만’, civitates는 ‘도시들’, homines는 포괄적인 ‘사람들’로 적절합니다. exterentur는 건물 붕괴에 한정되지 않는 ‘파괴되다’로 옮기는 것이 원문 및 영어 감사 번역의 destroyed에 더 충실합니다.
