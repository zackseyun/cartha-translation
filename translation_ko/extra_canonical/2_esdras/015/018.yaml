id: 2ES.15.18
reference: 2 Esdras 15:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter superbiam enim eorum civitates turbabuntur, domus exterentur, homines metuent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/018.yaml
  text: For because of their pride the cities will be thrown into confusion, the houses will be destroyed, and men will be afraid.
translation:
  language: ko
  text: 그들의 교만 때문에 도시들은 혼란에 빠지고, 집들은 파괴될 것이며, 사람들은 두려워할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superbia
  english_pob_choice: their pride
  chosen_korean: 교만
  alternatives_korean:
  - 자만
  - 오만
  lexicon: Latin superbia
  rationale: 원문의 도덕적·영적 오만을 가장 직접적으로 드러내는 기본어로서 ‘교만’을 택했습니다. 영어 POB의 pride도 이 값을 유지합니다.
- source_word: civitates turbabuntur
  english_pob_choice: the cities will be thrown into confusion
  chosen_korean: 도시들은 혼란에 빠지고
  alternatives_korean:
  - 성읍들은 어지러워지고
  - 도시들은 뒤죽박죽이 되고
  lexicon: Latin civitas / turbāre
  rationale: turbabuntur는 단순한 이동이 아니라 질서의 붕괴와 소동을 뜻하므로, 한국어에서는 결과 상태를 자연스럽게 드러내는 ‘혼란에 빠지다’로 옮겼습니다.
- source_word: domus exterentur
  english_pob_choice: the houses will be destroyed
  chosen_korean: 집들은 무너질 것이며
  alternatives_korean:
  - 집들은 파괴될 것이며
  - 집들은 허물어질 것이며
  lexicon: Latin domus / exterere
  rationale: exterentur의 강한 파괴·훼손 의미를 살리되, 건축물이 실제로 무너지는 장면을 한국어에서 가장 선명하게 전하는 표현으로 정리했습니다.
- source_word: homines metuent
  english_pob_choice: men will be afraid
  chosen_korean: 사람들은 두려워할 것입니다
  alternatives_korean:
  - 사람들은 두려워할 것이며
  - 사람들은 무서워할 것입니다
  lexicon: Latin homo / metuere
  rationale: homines는 성별이 아닌 ‘사람들’을 뜻하므로 보편적 표현으로 옮겼고, metuent는 미래의 두려움 상태를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 원인의 접속사 propter의 인과 관계를 어떻게 드러낼지
  chosen_reading: “그들의 교만 때문에”로 원인-결과를 분명히 드러냈습니다.
  alternative_readings:
  - “그들의 교만으로 말미암아”
  - “그 교만 때문에”
  rationale: 본문은 교만이 뒤따르는 심판적 붕괴와 공포의 원인임을 분명히 하므로, 한국어에서도 인과를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 예언적 심판의 인과 구조
