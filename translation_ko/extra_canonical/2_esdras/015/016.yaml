id: 2ES.15.16
reference: 2 Esdras 15:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erit enim constabilitio hominibus, alisalios supervalescentes non curabunt regem suum et principem megestanorum suorum in potentia sua.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/016.yaml
  text: For there will be instability among men; overpowering one another[a], they will pay no attention to their king or to the chief of their nobles, in their power.
  footnotes:
  - marker: a
    text: Or 'the chief men among them'.
    reason: previous_rendering
translation:
  language: ko
  text: 사람들 사이에는 불안정이 있을 것입니다. 서로를 압도하면서도 자기 왕과 자기 귀족들의 우두머리에게는 그들의 권세 속에서도 주의를 기울이지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 가운데의 귀족들의 우두머리’
    reason: lexical_alternative
lexical_decisions:
- source_word: constabilitio
  english_pob_choice: instability
  chosen_korean: 불안정
  alternatives_korean:
  - 불안정 상태
  - 혼란
  lexicon: constabilitio
  rationale: 라틴어는 사람들 사이의 안정성 상실을 가리키므로, 자연스러운 현대 한국어로 핵심 의미를 살려 ‘불안정’으로 옮겼습니다.
- source_word: hominibus
  english_pob_choice: among men
  chosen_korean: 사람들 사이에는
  alternatives_korean:
  - 사람들 가운데
  - 인간들 사이에는
  lexicon: homo
  rationale: 문맥상 보편적 인간 집단을 가리키므로, 문장 흐름이 자연스러운 ‘사람들 사이에는’으로 풀었습니다.
- source_word: alisalios supervalescentes
  english_pob_choice: overpowering one another
  chosen_korean: 서로를 압도하면서도
  alternatives_korean:
  - 서로를 이기면서도
  - 서로를 제압하면서
  lexicon: supervalesco
  rationale: 상호적 경쟁과 우세를 나타내는 표현이어서, 단순한 ‘이기다’보다 힘으로 눌러 이기는 뉘앙스를 드러내는 ‘압도하다’를 택했습니다.
- source_word: regem suum et principem megestanorum suorum
  english_pob_choice: their king or to the chief of their nobles
  chosen_korean: 자기 왕과 자기 귀족들의 우두머리
  alternatives_korean:
  - 자기 왕과 자기 귀족들의 지도자
  - 자기 왕과 자기 귀족들의 수장
  lexicon: rex / princeps / megestani
  rationale: 라틴어는 ‘왕’과 별도로 귀족 집단의 단수 우두머리를 구분하므로, POB의 수정된 영어를 따라 ‘귀족들의 우두머리’로 구체적으로 반영했습니다.
- source_word: in potentia sua
  english_pob_choice: in their power
  chosen_korean: 그들의 권세 속에서도
  alternatives_korean:
  - 그들의 권력 아래서도
  - 그들의 힘 안에서도
  lexicon: potentia
  rationale: potentia는 단순한 물리적 힘보다 지배력·권세의 뉘앙스가 있어, 문맥상 권위와 지배 상태를 드러내는 ‘권세’로 옮겼습니다.
theological_decisions:
- issue: 왕권과 귀족 권위에 대한 무관심의 묘사
  chosen_reading: 본문은 정치적 질서가 붕괴하는 사회적 혼란을 예고하는 것으로 읽고, 윤리적 비난을 덧붙이지 않고 서술형으로 유지했습니다.
  alternative_readings:
  - 도덕적 타락의 직접적 선언
  - 혁명적 반항의 예언
  rationale: 라틴어는 결과를 묘사할 뿐 원인을 단정하지 않으므로, 한국어도 예언적 진술의 톤을 보존했습니다.
  doctrine_reference: 예언문학의 서술적 경고
- issue: ‘in potentia sua’의 관계
  chosen_reading: ‘그들의 권세 속에서도’로 처리해, 권세가 있음에도 주의를 기울이지 않는 역설을 드러냈습니다.
  alternative_readings:
  - 그들의 권세 때문에
  - 그들의 권세 아래서
  rationale: 전치사 in은 여기서 상태·영역을 나타내는 것으로 보이며, 왕과 귀족에게 주의를 기울이지 않는 상황의 아이러니를 가장 잘 살립니다.
  doctrine_reference: 문맥적 전치사 용법
