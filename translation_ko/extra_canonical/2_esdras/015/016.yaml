revisions:
- from: 사람들 사이에는 불안정이 있을 것입니다. 서로를 압도하면서도 자기 왕과 자기 귀족들의 우두머리에게는 그들의 권세 속에서도 주의를 기울이지 않을 것입니다.[a]
  to: 사람들 사이에 불안정이 일어날 것입니다. 그들은 서로를 압도하면서 자기들의 권세 가운데서 자기 왕이나 자기 귀족들의 우두머리에게 아랑곳하지 않을 것입니다.[a]
  rationale: 불필요한 역접과 양보 의미를 제거하고, 왕 및 귀족 집단의 단수 우두머리라는 원문의 통사 관계를 유지했습니다. in potentia sua는 해석을 단정하지 않도록 직역에 가까운 표현으로 남겼으며, 각주를 실제 대안 번역이 되게 정비했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:14Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 명사구인 regem suum et principem megestanorum suorum는 ‘자기 왕’과 ‘자기 귀족들의 우두머리’를 구별하여 잘 반영해야 합니다. 현 초안은 이를 대체로 보존하지만, in potentia sua의 ‘속에서도’는 라틴어에 없는 양보 의미를 더합니다. 또한 alisalios supervalescentes는 ‘서로를 압도하면서’라는 동시·수단 관계가 자연스럽고, ‘-면서도’의 역접은 근거가 약합니다.
  naturalness: ‘불안정이 있을 것입니다’보다 ‘불안정이 일어날 것입니다’가 한국어 예언문에서 더 자연스럽습니다. ‘주의를 기울이지 않다’도 가능하나, 통치자에게 복종하거나 고려하지 않는 문맥에는 ‘아랑곳하지 않다’가 간결하고 자연스럽습니다. 마지막 전치사구는 원문의 다소 불명확한 관계를 보존하여 ‘자기들의 권세 가운데서’로 옮깁니다.
  terminology: ‘귀족들의 우두머리’는 단수 principem과 복수 megestanorum의 관계를 충실히 나타냅니다. 기존 각주는 본문 표현을 사실상 반복하므로 진정한 대안이 되도록, 영어 감사 기록의 대안에 상응하는 ‘그들 가운데의 유력자들’로 고칩니다.
  issues:
  - severity: medium
    issue: ‘서로를 압도하면서도’의 불필요한 역접
    rationale: supervalescentes는 상호 압도 행위와 뒤 절을 연결하지만, -도는 ‘그럼에도’라는 대조를 추가합니다.
  - severity: medium
    issue: ‘그들의 권세 속에서도’의 양보 의미
    rationale: in potentia sua에는 ‘-에도 불구하고’라는 명시적 양보 표지가 없습니다. ‘가운데서’는 원문의 관계상 남는 모호성을 보존합니다.
  - severity: low
    issue: 각주가 본문과 실질적으로 구별되지 않음
    rationale: 본문의 ‘귀족들의 우두머리’와 기존 각주의 ‘그들 가운데의 귀족들의 우두머리’는 대안 번역으로 기능하지 않습니다.
  revised_text: 사람들 사이에 불안정이 일어날 것입니다. 그들은 서로를 압도하면서 자기들의 권세 가운데서 자기 왕이나 자기 귀족들의 우두머리에게 아랑곳하지 않을 것입니다.[a]
