  text: God knows those who sin against him[a]; therefore he will hand them over to death and slaughter.
  footnotes:
  - marker: a
    text: Or 'For God knows those who sin against him;'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님은 자신에게 죄를 짓는 자들을 아십니다[a]; 그러므로 그들을 죽음과 살육에 넘기실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘하나님은 자신에게 죄를 짓는 자들을 아시므로,’.
    reason: previous_rendering
lexical_decisions:
- source_word: novit Deus
  english_pob_choice: God knows
  chosen_korean: 하나님은 … 아십니다
  alternatives_korean:
  - 하나님은 … 알고 계십니다
  - 하나님께서는 … 아십니다
  lexicon: 하나님 / 알다
  rationale: 라틴어 동사 novit는 단순한 인지보다 지속적이고 분명한 앎을 나타낼 수 있어, 평이하면서도 확정적인 ‘아십니다’로 옮겼습니다.
- source_word: qui peccant in eum
  english_pob_choice: those who sin against him
  chosen_korean: 자신에게 죄를 짓는 자들
  alternatives_korean:
  - 그분께 죄를 짓는 자들
  - 그분을 거스르는 자들
  lexicon: 죄를 짓다 / 거스르다
  rationale: peccare는 단순한 반항보다 ‘죄를 짓다’가 직접적이며, in eum은 대상이 하나님 자신임을 분명히 하므로 ‘자신에게’로 풀어 관계를 분명히 했습니다.
- source_word: tradet eos in mortem et in occisionem
  english_pob_choice: he will hand them over to death and slaughter
  chosen_korean: 그들을 죽음과 살육에 넘기실 것입니다
  alternatives_korean:
  - 그들을 죽음과 살육으로 넘기실 것입니다
  - 그들을 죽음과 도륙에 넘기실 것입니다
  lexicon: 넘기다 / 죽음 / 살육
  rationale: tradere의 처분·인도 의미를 살려 ‘넘기다’로 옮겼고, occisio는 단순한 죽음보다 폭력적 살해를 가리켜 ‘살육’이 더 정확합니다.
theological_decisions:
- issue: 심판의 행위 주체와 결과 표현
  chosen_reading: 하나님이 죄인들을 아시고, 그 결과로 그들을 죽음과 살육에 넘기시는 심판 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 예지 진술로만 읽기
  - ‘넘기실 것입니다’를 일반적 허용으로 약화하기
  rationale: 문맥상 앎은 중립적 정보가 아니라 심판으로 이어지는 언약적·도덕적 인식을 함축하므로, 결과절의 강한 책임성을 유지했습니다.
  doctrine_reference: 신 32:39; 롬 1:24
