revisions:
- from: 그들이 오늘까지 내 선택된 이들에게 행한 것처럼, 나도 그리하고 그들의 품에 갚아 주겠습니다. 주 하나님께서 이렇게 말씀하십니다:[a]
  to: '그들이 오늘날까지 내가 택한 이들에게 행한 그대로, 나는 그들에게 그렇게 행하고 그들의 품에 갚겠습니다. 주 하나님께서 이렇게 말씀하십니다:'
  rationale: 원문의 보응 대구와 ‘품’의 비유를 보존하면서, 불필요하게 ‘also’를 암시할 수 있는 표현을 제거했습니다. 또한 현대 한국어에서 자연스러운 ‘내가 택한 이들’로 다듬고, 내용상 불필요한 각주 표지와 각주를 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:20Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 대구 구조(sicut ... sic ...), 완료된 지속 행위(usque hodie), 그리고 보응을 ‘그들의 품’에 돌려주는 구체적 이미지를 보존해야 합니다. 초안의 ‘나도’는 한국어에서는 대구를 표시할 수 있으나, 여기서는 원문의 sic에 더해 독립적인 ‘also’의 뉘앙스를 줄 수 있어 피하는 편이 안전합니다.
  naturalness: ‘내 선택된 이들’은 직역투로 다소 부자연스럽습니다. 현대 표준어 합쇼체에서는 ‘내가 택한 이들’이 자연스럽고 의미도 정확합니다. ‘오늘날까지’는 usque hodie의 현재까지 계속된 시간을 자연스럽게 나타냅니다.
  terminology: ‘주 하나님’은 예언적 선언 공식 Dominus Deus에 적절합니다. sinus의 옷자락/품의 이미지는 ‘그들의 품에’로 유지할 수 있습니다. 기존 각주는 본문 표현과 실질적으로 구별되지 않는 단순 변형이므로 불필요합니다.
  issues:
  - severity: medium
    issue: ‘나도’가 원문에 없는 독립적 첨가처럼 들릴 수 있음
    rationale: 라틴어 sic는 ‘그대로/그와 같이’라는 상응 표현이지, 별도의 etiam(또한/역시)이 아닙니다. 한국어 문장을 재구성하여 대구는 유지하되 ‘나도’를 피하는 것이 더 정확합니다.
  - severity: low
    issue: ‘내 선택된 이들’의 직역투
    rationale: electis meis는 ‘내가 택한 이들’로 옮기면 선택의 주체와 소유 관계가 자연스럽고 분명하게 드러납니다.
  - severity: low
    issue: 각주가 의미 있는 번역 대안을 제공하지 않음
    rationale: ‘품에’와 ‘품속에’는 이 문맥에서 실질적 번역 선택의 차이를 만들지 않으며, 본문 자체가 sinus의 구체적 이미지를 충분히 전달합니다.
  revised_text: '그들이 오늘날까지 내가 택한 이들에게 행한 그대로, 나는 그들에게 그렇게 행하고 그들의 품에 갚겠습니다. 주 하나님께서 이렇게 말씀하십니다:'
