source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'sicut faciunt usque hodie electis meis, sic faciam et reddam in sinum ipsorum. haec dicit Dominus Deus:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/021.yaml
  text: 'As they have done to my chosen ones to this day[a], so I will do and repay into their lap. Thus says the Lord God:'
  footnotes:
  - marker: a
    text: Or 'so I also will do and repay into their bosom'.
    reason: previous_rendering
translation:
  language: ko
  text: '그들이 오늘날까지 내가 택한 이들에게 행한 그대로, 나는 그들에게 그렇게 행하고 그들의 품에 갚겠습니다. 주 하나님께서 이렇게 말씀하십니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: electis meis
  english_pob_choice: my chosen ones
  chosen_korean: 내 선택된 이들
  alternatives_korean:
  - 내 택하신 이들
  - 내 택함을 받은 이들
  lexicon: electus
  rationale: 라틴어 electis meis는 선택받은 자들을 가리키므로, 문어체에서 자연스럽고 소유격을 분명히 드러내는 ‘내 선택된 이들’로 옮겼습니다.
- source_word: usque hodie
  english_pob_choice: to this day
  chosen_korean: 오늘까지
  alternatives_korean:
  - 이날까지
  - 지금까지
  lexicon: hodie
  rationale: 현재까지의 지속을 간결하게 살리는 표현으로 ‘오늘까지’가 가장 직접적입니다.
- source_word: reddam in sinum ipsorum
  english_pob_choice: repay into their lap
  chosen_korean: 그들의 품에 갚아 주겠습니다
  alternatives_korean:
  - 그들의 품에 되갚아 주겠습니다
  - 그들의 품속에 갚아 주겠습니다
  lexicon: sinus
  rationale: sinus는 옷의 접힌 부분, 품, 주머니 같은 구체적 이미지를 가리키므로, ‘품에’로 옮겨 신체적 비유를 유지했습니다. ‘갚아 주겠습니다’는 보응의 의미를 살리되 한국어로 자연스럽게 했습니다.
- source_word: haec dicit Dominus Deus
  english_pob_choice: Thus says the Lord God
  chosen_korean: 주 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주 하나님이 이렇게 말씀하십니다
  - 주 하나님께서 이렇게 말씀하시기를
  lexicon: Dominus Deus
  rationale: 예언적 선포 공식이므로 직역에 가깝게 유지했고, 한국어에서는 현대 합쇼체로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 신적 보응의 대상과 방식
  chosen_reading: 하나님이 ‘선택된 이들’에게 행해진 일을 그대로 되돌려 주시는 보응의 말씀으로 읽었습니다.
  alternative_readings:
  - 단순한 개인적 복수 선언
  - 비유적 경고문
  rationale: 본문은 상호 대응 구조(sicut... sic...)로 보응의 공정성을 드러내므로, 이를 약화하지 않고 그대로 살렸습니다.
  doctrine_reference: 신적 공의와 보응
