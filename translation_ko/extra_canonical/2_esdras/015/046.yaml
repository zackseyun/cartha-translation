  text: And you[a], Asia, partner in the splendor of Babylon and in the glory of her person—
  footnotes:
  - marker: a
    text: The address to Asia as Babylon's partner reflects a compositional layer distinct from the Jewish core of 4 Ezra. The rhetoric here belongs to the later Latin Christian appendix commonly called 6 Ezra.
    reason: compositional_layer
    anchor_ref: '15:46'
translation:
  language: ko
  text: 그리고 너[a], 아시아여, 바빌론의 화려함과 그 존재의 영광을 함께 누린 자여—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 아시아를 바빌론의 동반자로 부르는 이 호칭은 4에스드라의 유대계 핵심층과 구별되는 구성 층위를 반영합니다. 이 수사는 흔히 6에스드라라고 불리는 후기 라틴 기독교 부가 부분에 속합니다.
    reason: compositional_layer
lexical_decisions:
- source_word: Et tu Asia
  english_pob_choice: And you, Asia
  chosen_korean: 그리고 너, 아시아여
  alternatives_korean:
  - 그리고 당신, 아시아여
  - 아시아여, 너 또한
  lexicon: 고유명사/호격
  rationale: 라틴어의 직접 호칭을 살려 아시아를 호격으로 처리했고, 수사적 책망의 힘을 보이기 위해 2인칭 직접 خطاب을 유지했습니다.
- source_word: consors
  english_pob_choice: partner
  chosen_korean: 함께한 자
  alternatives_korean:
  - 동참자
  - 동반자
  - 동맹자
  lexicon: 동참 관계 표현
  rationale: consors는 단순한 동반보다 동일한 몫을 공유하는 공범적·동참적 관계를 가리키므로, 현대 한국어에서 그 긴장감을 살리는 표현으로 옮겼습니다.
- source_word: in specie Babylonis
  english_pob_choice: in the splendor of Babylon
  chosen_korean: 바빌론의 화려함
  alternatives_korean:
  - 바빌론의 광휘
  - 바빌론의 영광
  lexicon: gloria/species 의미장
  rationale: revised English처럼 Babylon을 수식하는 구조를 반영해 ‘바빌론의 화려함’으로 직역에 가깝게 두었고, 외적 과시와 현혹의 뉘앙스를 보존했습니다.
- source_word: gloria personae
  english_pob_choice: the glory of her person
  chosen_korean: 그 인물의 영광
  alternatives_korean:
  - 그 존재의 영광
  - 그 얼굴의 영광
  - 그 사람의 영광
  lexicon: gloria persona
  rationale: persona를 단순 외모보다 ‘인물/인격의 겉모습과 위세’가 드러나는 말로 이해해, 지나친 미화 없이 본문의 수사적 병렬을 살렸습니다.
theological_decisions:
- issue: 6 에스드라의 후기 라틴 기독교 부가문으로서의 화자·대상 설정
  chosen_reading: 본문은 아시아를 바빌론의 영광에 동참한 대상으로 직접 고발하는 수사로 처리했습니다.
  alternative_readings:
  - 유대 묵시문학적 핵심 본문과 동일한 층위로 평탄화하여 읽기
  - 단순 지리명으로만 읽기
  rationale: 영문 주석의 compositional layer 지적을 반영하되, 번역문 자체는 현재 전승된 본문의 직접적 수사력을 유지하는 쪽이 더 충실합니다.
  doctrine_reference: 본문비평/성경전승사
