lexical_decisions:
- source_word: pratorum
  english_pob_choice: their pastures
  chosen_korean: 그들의 목초지
  alternatives_korean:
  - 그들의 초원
  - 그들의 목장터
  - 그들의 풀밭
  lexicon: pratum
  rationale: 라틴어 pratum은 풀을 뜯게 하는 목초지를 뜻하므로, 한국어에서는 자연스럽고 의미가 분명한 ‘목초지’로 옮겼습니다.
- source_word: frumenta
  english_pob_choice: their grain
  chosen_korean: 그들의 곡식
  alternatives_korean:
  - 그들의 곡물
  - 그들의 곡식들
  - 그들의 양식
  lexicon: frumentum
  rationale: frumenta는 주로 곡식류를 가리키므로, 일반적이면서도 원문의 농업적 이미지를 살리는 ‘곡식’을 선택했습니다.
- source_word: Et transibunt constanter usque
  english_pob_choice: And they will pass steadily on as far as
  chosen_korean: 그리고 그들은 흔들림 없이 계속해서 나아가다가 …
  alternatives_korean:
  - 그리고 그들은 꾸준히 지나갈 것이며 …
  - 그리고 그들은 변함없이 계속 나아갈 것이며 …
  lexicon: transire / constanter / usque
  rationale: transibunt는 단순히 ‘지나가다/가다’의 진행을, constanter는 ‘꾸준히/흔들림 없이’의 태도를, usque는 다음 구가 이어질 여지를 남기는 ‘~까지/다가’의 미완성을 반영해 번역했습니다.
theological_decisions:
- issue: 문장이 끝에서 끊기는 미완성 구문 처리
  chosen_reading: 원문이 ‘usque’에서 끝나므로 한국어도 목적지나 대상어를 보충하지 않고 생략의 긴장을 그대로 남겼습니다.
  alternative_readings:
  - ‘…까지’로 완결해 보완하는 읽기
  - 뒤 문맥을 추정해 목적어를 덧붙이는 읽기
  rationale: 제공된 라틴어 및 POB 수정 이력 모두 이 절이 이어지는 문맥을 전제로 한 미완성 형태임을 보여 주므로, 없는 내용을 보태지 않는 것이 가장 충실합니다.
  doctrine_reference: source integrity / ellipsis preservation
