  text: cum inebriata es? Exorna speciem uultus tui! Merces fornicariae in sinus tuos, propterea redditionem recipies. Sicut facies electis meis, dicit dominus, sic faciet tibi deus et tradet te in malis. Et nati tui fame interient, et tu rumphea cades, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/054.yaml
  text: When were you made drunk? Adorn the beauty of your face! The wages of a harlot are in your bosom[a]; therefore you will receive repayment.
  footnotes:
  - marker: a
    text: Or "Adorn your face's beauty! The wages of prostitution".
    reason: previous_rendering
translation:
  language: ko
  text: 네가 술에 취하였을 때가 언제였느냐? 네 얼굴의 아름다움을 장식하여라! 창녀의 품삯이 네 품속에 있으니[a], 그러므로 네가 보응을 받게 될 것이다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 얼굴의 아름다움을 장식하여라! 매춘의 삯이”.
    reason: alternative_reading
lexical_decisions:
- source_word: cum inebriata es?
  english_pob_choice: When were you made drunk?
  chosen_korean: 네가 술에 취하였을 때가 언제였느냐?
  alternatives_korean:
  - 네가 술 취한 때가 언제였느냐?
  - 네가 술에 취했느냐?
  lexicon: inebriata es → 술에 취하다
  rationale: 라틴어의 의문문을 그대로 살려, 단순 진술이 아니라 ‘언제였느냐’라는 수사적 질문으로 옮겼습니다.
- source_word: Exorna speciem uultus tui!
  english_pob_choice: Adorn the beauty of your face!
  chosen_korean: 네 얼굴의 아름다움을 장식하여라!
  alternatives_korean:
  - 네 얼굴의 아름다움을 꾸며라!
  - 네 얼굴의 모습을 단장하여라!
  lexicon: exorno / species vultus
  rationale: speciem uultus tui는 ‘얼굴의 아름다움/모습’으로 읽히므로, POB의 문맥을 살리되 ‘장식하다’의 외형적 꾸밈 뉘앙스를 유지했습니다.
- source_word: Merces fornicariae in sinus tuos
  english_pob_choice: The wages of a harlot are in your bosom
  chosen_korean: 창녀의 품삯이 네 품속에 있으니
  alternatives_korean:
  - 음녀의 삯이 네 품속에 있으니
  - 창기의 삯이 네 가슴에 있으니
  lexicon: merces / fornicaria
  rationale: fornicariae는 ‘매춘’이 아니라 ‘창녀/음녀’라는 인격화된 표현이므로, ‘품삯’으로 옮겨 도시-창녀 이미지를 보존했습니다.
- source_word: redditionem recipies
  english_pob_choice: you will receive repayment
  chosen_korean: 그러므로 네가 보응을 받게 될 것이다
  alternatives_korean:
  - 그러므로 네가 되갚음을 받게 될 것이다
  - 그러므로 네가 상응하는 대가를 받게 될 것이다
  lexicon: redditionem recipies
  rationale: redditionem은 단순한 금전 반환보다 ‘되갚음/보응’의 심판적 성격이 강하므로, 본문의 응보 의미를 드러냈습니다.
theological_decisions:
- issue: apocalyptic harlot imagery and moral culpability
  chosen_reading: ‘창녀’ 이미지를 문자 그대로 유지하여, 단순한 비유적 장식이 아니라 심판의 대상이 된 타락한 정체성을 드러냈습니다.
  alternative_readings:
  - ‘음녀’로 순화해 상징성을 강조하는 읽기
  - ‘매춘부’로 현대적 사회윤리를 강조하는 읽기
  rationale: 본문은 도시/공동체를 향한 예언적 고발의 수사로 읽히므로, 약화하지 않고 직접적인 명칭을 유지하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 예언서적 심판 어휘와 묵시적 상징 해석
- issue: boasting/adornment imperative in divine judgment speech
  chosen_reading: 명령형 ‘장식하여라!’를 유지해, 조롱 섞인 심판 선포의 긴박함을 보존했습니다.
  alternative_readings:
  - ‘꾸미어라’로 완화하는 읽기
  - 서술형으로 바꾸어 문장을 부드럽게 하는 읽기
  rationale: 라틴어 명령법은 화자(심판자)의 직접적 도전을 드러내므로, 한국어에서도 명령조를 유지해야 대조와 풍자가 살아납니다.
  doctrine_reference: 예언적 책망과 신적 심판의 수사
