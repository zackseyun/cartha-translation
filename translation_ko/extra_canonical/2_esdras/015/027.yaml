id: 2ES.15.27
reference: 2 Esdras 15:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: iam enim venerunt super orbem terrarum mala, et manebitis in illis; non enim liberabit vos Deus, propter quod peccastis in eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/027.yaml
  text: For already evils have come upon the world, and you will remain in them; for God will not deliver you, because you have sinned against him.
translation:
  language: ko
  text: 이미 재앙들이 온 땅 위에 임했으니, 여러분은 그 재앙들 가운데 그대로 남아 있을 것입니다. 하나님은 여러분이 그분께 죄를 지었기 때문에 여러분을 건져 내지 않으실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iam enim venerunt super orbem terrarum mala
  english_pob_choice: For already evils have come upon the world
  chosen_korean: 이미 재앙들이 온 땅 위에 임했으니
  alternatives_korean:
  - 이미 악들이 세상에 닥쳤으니
  - 이미 재앙이 온 세상에 덮쳤으니
  lexicon: mala → 재앙들 / orbem terrarum → 온 땅
  rationale: 라틴어 mala는 단순한 도덕적 ‘악’보다 닥쳐온 재난·재앙의 뉘앙스가 강하므로, POB의 evils를 반영하되 한국어에서는 자연스러운 ‘재앙들’로 옮겼습니다.
- source_word: manebitis in illis
  english_pob_choice: and you will remain in them
  chosen_korean: 여러분은 그 재앙들 가운데 그대로 남아 있을 것입니다
  alternatives_korean:
  - 여러분은 그 가운데 머물 것입니다
  - 여러분은 그것들 안에 남아 있을 것입니다
  lexicon: manebitis in illis → 그 가운데 그대로 남아 있을 것입니다
  rationale: 단순한 지속이 아니라 재앙의 상태 안에 계속 머문다는 뜻을 살리기 위해 ‘그 재앙들 가운데 그대로 남아’로 구체화했습니다.
- source_word: non enim liberabit vos Deus
  english_pob_choice: for God will not deliver you
  chosen_korean: 하나님은 여러분을 건져 내지 않으실 것입니다
  alternatives_korean:
  - 하나님은 여러분을 구원하지 않으실 것입니다
  - 하나님은 여러분을 구출하지 않으실 것입니다
  lexicon: liberabit → 건져 내다
  rationale: liberare는 단순 정보 전달보다 위기에서 ‘건져내다/구해내다’의 구출 뉘앙스가 있어, 한국어에서 동적이면서도 출애굽적 이미지를 살리는 ‘건져 내다’를 택했습니다.
- source_word: peccastis in eum
  english_pob_choice: because you have sinned against him
  chosen_korean: 여러분이 그분께 죄를 지었기 때문입니다
  alternatives_korean:
  - 여러분이 그분께 범죄했기 때문입니다
  - 여러분이 그분을 거슬러 죄를 지었기 때문입니다
  lexicon: peccastis in eum → 그분께 죄를 지었습니다
  rationale: in eum은 단순한 대상 표지 이상으로 ‘그분을 상대로/그분께’의 대립 관계를 나타내므로, 한국어에서는 직접적이고 표준적인 ‘그분께 죄를 지었다’로 옮겼습니다.
theological_decisions:
- issue: 재앙과 하나님의 불구원 선언의 관계
  chosen_reading: 본문은 세계적 재앙이 이미 도래했고, 그 재앙 상태가 지속되며, 죄책 때문에 하나님의 구출이 유보된다는 경고를 직접적으로 말합니다.
  alternative_readings:
  - 도덕적 악의 일반론으로 완화하는 읽기
  - 징벌을 암시하되 직접적 거절을 약화하는 읽기
  rationale: 라틴어 문장은 원인(죄)과 결과(구출 불가)를 분명히 연결하므로, 경고의 직설성을 약화하지 않았습니다.
  doctrine_reference: 신적 심판과 회개 촉구의 경고 문맥
- issue: ‘여러분’의 유지
  chosen_reading: 직접 호칭인 vos를 현대 한국어 복수 공손 대명사 ‘여러분’으로 유지했습니다.
  alternative_readings:
  - ‘너희’로 친밀/비공손하게 옮김
  - 주어 생략
  rationale: 공적 경고문조의 합쇼체와 잘 맞고, 공동체 전체를 향한 직접성을 살릴 수 있습니다.
  doctrine_reference: 공동체 مخاطبة의 문체 선택
