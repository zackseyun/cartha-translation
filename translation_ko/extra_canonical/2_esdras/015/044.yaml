revisions:
- from: 바빌론을, 그들은 파괴할 것입니다. 그들은 바빌론에 맞서 모여 들고 그 성읍을 에워싸며 폭풍과 모든 진노를 그 위에 쏟아부을 것이며, 먼지와 연기가 하늘에 이를 것이고, 사방의 모든 이가 애도할 것입니다.[a]
  to: 그들은 바빌론을 파괴할 것입니다. 그들은 그곳에 모여들어 그것을 에워싸고, 별과 모든 진노를 그 위에 쏟아부을 것이며, 먼지와 연기가 하늘까지 올라갈 것이고, 그 주변의 모든 이가 애도할 것입니다.
  rationale: 원문의 행위자, 바빌론을 향한 포위와 파괴, 진노의 부음, 먼지와 연기의 상승, 주변의 애도라는 순서를 보존했습니다. 한국어 문장을 합쇼체로 자연스럽게 다듬었고, sidus의 해석적 확장을 피했습니다. 원문·감사 기록으로 뒷받침되지 않으며 앵커도 맞지 않는 각주는 삭제했습니다.
