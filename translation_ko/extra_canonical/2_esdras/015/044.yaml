source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Babylonem et exterent eam. Conuenient ad ipsam et circuibunt eam et effundent sidus et omnem iram super eam, et subibit puluis et fumus usque ad caelum, et omnes in circuitu lugebunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/044.yaml
  text: Babylon[a], and they will destroy her. They will gather against her and surround her and pour out a storm and all wrath upon her, and dust and smoke will rise up to heaven, and all around her will mourn.
  footnotes:
  - marker: a
    text: Or 'They will gather against her'.
    reason: previous_rendering
translation:
  language: ko
  text: 바빌론을, 그들은 파괴할 것입니다. 그들은 바빌론에 맞서 모여 들고 그 성읍을 에워싸며 폭풍과 모든 진노를 그 위에 쏟아부을 것이며, 먼지와 연기가 하늘에 이를 것이고, 사방의 모든 이가 애도할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그들은 그를 향해 모일 것입니다'.
    reason: alternative_reading
lexical_decisions:
- source_word: Babylonem
  english_pob_choice: Babylon
  chosen_korean: 바빌론
  alternatives_korean:
  - 바빌론성
  - 바빌론 도시
  lexicon: 고유명사
  rationale: 라틴어 목적어 Babylonem을 한국어 음역 고유명사로 옮기되, 본문이 상징적 심판 대상인 '바빌론'을 가리키므로 설명적 확장을 두지 않았습니다.
- source_word: exterent eam
  english_pob_choice: they will destroy her
  chosen_korean: 그들은 파괴할 것입니다
  alternatives_korean:
  - 그들은 멸망시킬 것입니다
  - 그들은 없앨 것입니다
  lexicon: 동사
  rationale: eam의 여성 대명사는 바빌론을 가리키며, 라틴어 exterent는 단순한 공격이 아니라 파괴·소탕의 의미이므로 '파괴하다'가 가장 직접적입니다.
- source_word: Conuenient ad ipsam et circuibunt eam
  english_pob_choice: They will gather against her and surround her
  chosen_korean: 그들은 바빌론에 맞서 모여 들고 그 성읍을 에워싸며
  alternatives_korean:
  - 그들은 그에게로 모여 들어 둘러싸며
  - 그들은 바빌론을 향해 집결하여 둘러싸며
  lexicon: 동사구
  rationale: POB의 대안 각주와 라틴어 ad ipsam을 반영해 '맞서'를 살렸고, circuibunt eam은 물리적 포위를 나타내므로 '에워싸다'로 옮겼습니다.
- source_word: effundent sidus et omnem iram
  english_pob_choice: pour out a storm and all wrath
  chosen_korean: 폭풍과 모든 진노를 그 위에 쏟아부을 것이며
  alternatives_korean:
  - 재앙과 모든 진노를 쏟아부을 것이며
  - 별빛과 모든 진노를 쏟아부을 것이며
  lexicon: 명사구
  rationale: sidus는 문자적으로 '별'이지만 여기서는 심판 맥락의 자연재해적 이미지로 쓰였으므로, 영어 POB의 판독을 따라 '폭풍'으로 옮겼습니다.
- source_word: subibit puluis et fumus usque ad caelum
  english_pob_choice: dust and smoke will rise up to heaven
  chosen_korean: 먼지와 연기가 하늘에 이를 것이고
  alternatives_korean:
  - 먼지와 연기가 하늘까지 올라갈 것이고
  - 먼지와 연기가 하늘에 닿을 것이고
  lexicon: 동사구
  rationale: subibit는 '위로 올라가다/이르다'의 뜻이며, puluis et fumus의 시각적 심판 이미지를 한국어로 자연스럽게 살리기 위해 '하늘에 이를 것'으로 번역했습니다.
theological_decisions:
- issue: 바빌론에 대한 종말론적 심판의 직접성
  chosen_reading: 본문의 행위자와 대상 관계를 흐리지 않고, 심판의 폭력성과 공적 성격을 직설적으로 드러냈습니다.
  alternative_readings:
  - 완곡하게 '망하게 할 것입니다'로 약화
  - 상징성을 지나치게 풀어 설명
  rationale: 이 구절은 예언적 심판 선언으로서 파괴, 포위, 진노의 연속을 강조하므로, 본문의 긴박한 어조를 유지하는 것이 중요합니다.
  doctrine_reference: 예언적 심판, 하나님의 공의
- issue: '''그 위에''의 대명사 지시'
  chosen_reading: 마지막의 '그 위에'는 바빌론을 가리키는 여성 대명사 eam을 한국어에서 자연스럽게 재현한 표현입니다.
  alternative_readings:
  - '''그에게''로 중성화'
  - 대상 지시를 생략
  rationale: 라틴어 문법의 성별 표지를 한국어에서 정확히 구현할 수는 없지만, 지시 대상이 바빌론임을 유지해야 합니다.
  doctrine_reference: 본문 충실성
