  text: ecce populus meus quasi grex ad occisionem ducitur. iam non patiar illum habitare in terra Aegypti,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/010.yaml
  text: Behold, my people are being led like a flock to the slaughter. I will no longer allow them to dwell in the land of Egypt,
translation:
  language: ko
  text: 보십시오, 내 백성은 도살될 양 떼처럼 끌려가고 있습니다. 나는 더 이상 그들이 이집트 땅에 머물도록 허락하지 않겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보세요
  lexicon: ecce
  rationale: 청자 주의를 강하게 환기하는 감탄사로서, 현대 합쇼체에서 예언적 경고의 호소력을 살리면서도 문체를 유지하기 위해 ‘보십시오’를 택했습니다.
- source_word: populus meus
  english_pob_choice: my people
  chosen_korean: 내 백성
  alternatives_korean:
  - 내 ժողովուրդ
  - 내 민족
  - 내 사람들
  lexicon: populus meus
  rationale: 하나님이 소유·언약 관계로 부르는 집단을 자연스럽게 드러내는 표현으로 ‘내 백성’이 가장 직접적입니다.
- source_word: quasi grex ad occisionem
  english_pob_choice: like a flock to the slaughter
  chosen_korean: 도살될 양 떼처럼
  alternatives_korean:
  - 도살장으로 끌려가는 떼처럼
  - 도살에 넘겨질 무리처럼
  lexicon: quasi + grex + ad occisionem
  rationale: grex의 군집 이미지를 살리되 한국어에서는 ‘양 떼’가 목축 비유를 가장 선명하게 전달하므로, 희생의 방향성을 분명히 하는 ‘도살될’로 옮겼습니다.
- source_word: ducitur
  english_pob_choice: are being led
  chosen_korean: 끌려가고 있습니다
  alternatives_korean:
  - 인도되고 있습니다
  - 이끌려 가고 있습니다
  lexicon: duco
  rationale: 수동 진행의 강제성을 드러내기 위해 ‘끌려가고 있습니다’를 사용했습니다. 단순한 ‘인도’보다 폭력적 상황을 더 분명히 반영합니다.
- source_word: iam non patiar illum habitare
  english_pob_choice: I will no longer allow them to dwell
  chosen_korean: 나는 더 이상 그들이 … 머물도록 허락하지 않겠습니다
  alternatives_korean:
  - 나는 더 이상 그들이 … 거주하게 두지 않겠습니다
  - 나는 이제 그들이 … 살게 하지 않겠습니다
  lexicon: patior + habitare
  rationale: patior의 허용/방임 뉘앙스를 살려 ‘허락하지 않겠습니다’로 옮기고, habitare는 지속적 거주를 나타내는 ‘머물다’로 처리했습니다.
- source_word: terra Aegypti
  english_pob_choice: the land of Egypt
  chosen_korean: 이집트 땅
  alternatives_korean:
  - 애굽 땅
  - 이집트 나라
  lexicon: terra Aegypti
  rationale: 지명은 현대 표기 ‘이집트’를 사용하되, terra의 장소적 범위를 살리기 위해 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: ‘내 백성’과 심판 이미지의 결합
  chosen_reading: 하나님이 언약 백성을 도살당하는 양 떼처럼 보시는 강한 심판·해방 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 군사적 포로 이동 묘사로 약화해 읽는 방식
  - 비유를 완화해 일반적 고난 표현으로 읽는 방식
  rationale: 원문은 ecce와 도살 이미지, 그리고 즉각적인 금지 선언을 결합해 긴급한 구원의 전환점을 형성하므로, 그 긴장과 심판성을 보존해야 합니다.
  doctrine_reference: 구속사적 심판-해방 모티프
