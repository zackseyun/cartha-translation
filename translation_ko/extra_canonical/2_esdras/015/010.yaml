  terminology: ‘내 백성’, ‘양 떼’, ‘이집트 땅’은 성서적 문맥에서 이해하기 쉽고 일관된 용어입니다. 원문의 grex는 일반적 ‘떼/무리’일 수 있으나, 여기서 ‘양 떼’는 한국어 성서 문체에서 자연스럽고 비유의 기능을 부당하게 좁히지 않습니다.
