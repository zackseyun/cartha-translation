  yaml_path: translation/extra_canonical/2_esdras/015/048.yaml
  text: 'You have imitated that hateful prostitute in all her works and devices; therefore God says:'
translation:
  language: ko
  text: '당신은 그 미움받는 음녀의 모든 행위와 계책을 본받았습니다. 그러므로 하나님께서 말씀하십니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tuis qui te cupierunt semper
  english_pob_choice: You have imitated
  chosen_korean: 본받았습니다
  alternatives_korean:
  - 흉내 냈습니다
  - 따랐습니다
  lexicon: imitari
  rationale: 라틴어의 '본뜨다/모방하다' 의미를 살려, 단순한 추종보다 행위 전체의 모방을 드러내는 표현을 택했습니다.
- source_word: Fornicarian odibilem
  english_pob_choice: that hateful prostitute
  chosen_korean: 가증한 음녀
  alternatives_korean:
  - 미운 창녀
  - 혐오스러운 매춘부
  lexicon: fornicaria / odibilis
  rationale: 도덕적 혐오를 강하게 나타내는 라틴어 결합을 반영하되, 한국어 성경 문체에서 직설적이면서도 문맥에 맞는 표현으로 옮겼습니다.
- source_word: in omnibus operibus eius et adinuentionibus eius
  english_pob_choice: in all her works and devices
  chosen_korean: 그의 모든 행위와 꾀에 이르기까지
  alternatives_korean:
  - 그녀의 모든 행위와 계책에서
  - 그의 모든 일과 궁리에서
  lexicon: opera / adinventiones
  rationale: opera는 '행위', adinventiones는 '꾀/궁리'로 구분해 단순 반복이 아니라 계획된 수단까지 포함함을 살렸습니다.
- source_word: propterea dicit
  english_pob_choice: 'therefore God says:'
  chosen_korean: '그러므로 하나님께서 말씀하십니다:'
  alternatives_korean:
  - '그러므로 하나님이 말씀하십니다:'
  - '그리하여 하나님께서 말씀하십니다:'
  lexicon: dicit
  rationale: 직접 화자의 전환을 살리기 위해 종결부를 콜론으로 열어 두었고, 본문 앞의 서술자를 명시하지 않는 라틴어의 일반적 신적 발화 관용을 한국어에서 분명히 했습니다.
theological_decisions:
- issue: 발화 주체의 명시
  chosen_reading: 본문의 propterea dicit를 따라 마지막에 '하나님께서 말씀하십니다'로 처리했습니다.
  alternative_readings:
  - '''그러므로 이르십니다''처럼 주어를 생략하는 방식'
  - '''그러므로 주께서 말씀하십니다''로 옮기는 방식'
  rationale: 라틴어 본문은 발화 도입만 주고 주체를 일반적으로 처리하지만, 영어 POB가 God says로 명시하므로 한국어에서도 독자가 신적 선언임을 즉시 알 수 있게 했습니다.
  doctrine_reference: 서술적 예언 공식을 한국어 본문에서 가시화하는 번역 원칙
