translation:
  language: ko
  text: 또 사람의 넓적다리와 낙타의 발목까지 이를 것입니다. 땅 위에 큰 두려움과 떨림이 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et femur hominis
  english_pob_choice: a man's thigh
  chosen_korean: 사람의 넓적다리
  alternatives_korean:
  - 사람의 허벅지
  - 한 사람의 넓적다리
  lexicon: femur
  rationale: 라틴어 femur는 해부학적으로 넓적다리를 뜻하므로, 현대 한국어에서는 자연스럽고 직역에 가까운 ‘넓적다리’를 택했습니다.
- source_word: et suffraginem cameli
  english_pob_choice: a camel's hock
  chosen_korean: 낙타의 발목
  alternatives_korean:
  - 낙타의 무릎 아래 관절
  - 낙타의 족근
  lexicon: suffraginem
  rationale: suffrago는 동물의 다리 관절부를 가리키므로, 전문용어를 과도하게 끌어오지 않으면서도 의미를 드러내는 ‘발목’을 선택했습니다.
- source_word: et erit timor et tremor multus super terram
  english_pob_choice: And there will be great fear and trembling upon the earth
  chosen_korean: 땅 위에는 큰 두려움과 떨림이 있을 것입니다
  alternatives_korean:
  - 땅 위에 큰 두려움과 떨림이 있을 것입니다
  - 온 땅에 큰 두려움과 떨림이 일 것입니다
  lexicon: timor / tremor / super terram
  rationale: timor와 tremor를 각각 ‘두려움’과 ‘떨림’으로 살리고, super terram은 ‘땅 위에/땅 위에는’으로 평이하게 옮겼습니다.
theological_decisions:
- issue: 예언적 재난 묘사의 어조
  chosen_reading: 직설적 서술을 유지해, 신탁이 말하는 파국의 감각을 약화하지 않았습니다.
  alternative_readings:
