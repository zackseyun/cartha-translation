  source_fidelity: 첫 구절은 라틴어 본문에서 앞 문맥에 이어지는 불완전한 병렬구이며, 현 번역의 ‘...입니다’는 원문에 없는 서술적 동일시를 만들고 한국어로도 부자연스럽습니다. 문맥상 암시된 도달 의미를 ‘...까지 이를 것입니다’로 최소한 보충하는 것이 적절합니다. 후반절은 원문의 timor et tremor multus super terram을 충실히 옮깁니다.
  naturalness: ‘그리고 사람의 넓적다리와 낙타의 발목입니다’는 합쇼체 문장으로 성립은 하나 의미상 어색하고 앞 문맥과의 연결을 잃습니다. ‘또 ...까지 이를 것입니다’가 자연스럽게 이어집니다. ‘큰 두려움과 떨림’은 현대 한국어에서 자연스럽고 원문의 병렬도 보존합니다.
  terminology: femur는 ‘넓적다리’가 적절합니다. 동물 다리의 suffrago는 사람의 ‘발목’과 정확히 일치하는 해부학 용어는 아니지만, 일반 독자용 번역에서 ‘낙타의 발목’은 수용 가능하며 본문의 관절 높이 이미지를 잘 전달합니다. 불필요한 기존 각주는 본문과 동일한 표현을 ‘직역’이라고만 반복하며, 영어 감사 기록의 대안적 전치사 해석도 정확히 반영하지 못하므로 삭제합니다.
