translation:
  language: ko
  text: 보십시오, 끔찍한 환상이 있으며 그 얼굴은 동쪽에서 온 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: ecce
  rationale: 청자에게 시각적 주의를 환기하는 감탄사로, 현대 합쇼체에서는 ‘보십시오’가 가장 자연스럽고 직접적입니다.
- source_word: visio horribilis
  english_pob_choice: a dreadful vision
  chosen_korean: 끔찍한 환상
  alternatives_korean:
  - 무서운 환상
  - 두려운 환상
  - 끔찍한 모습
  lexicon: visio, horribilis
  rationale: visio는 ‘환상/환시’ 범주가 적절하고, horribilis는 강한 공포·혐오의 뉘앙스를 살려 ‘끔찍한’으로 옮겼습니다.
- source_word: facies
  english_pob_choice: face
  chosen_korean: 얼굴
  alternatives_korean:
  - 용모
  - 모습
  - 면상
  lexicon: facies
  rationale: POB가 revision에서 ‘appearance’보다 ‘face’를 택해 facies의 직접 대응을 분명히 했으므로, 한국어도 직역성이 높은 ‘얼굴’을 사용했습니다.
- source_word: ab oriente
  english_pob_choice: from the east
  chosen_korean: 동쪽에서
  alternatives_korean:
  - 동방에서
  - 동편에서
  lexicon: ab + oriens
  rationale: 방향을 나타내는 전치사구로서 자연스러운 표준어 표현인 ‘동쪽에서’를 택했습니다.
