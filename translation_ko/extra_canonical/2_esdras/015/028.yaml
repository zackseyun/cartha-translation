  naturalness: ‘그 얼굴은 동쪽에서 왔습니다’는 한국어에서 과거에 실제로 이동해 온 것으로 자연스럽게 읽혀 원문보다 구체적입니다. ‘동쪽에서 온 것입니다’는 현대 표준어 합쇼체에서 출처를 자연스럽게 나타냅니다.
  terminology: ‘보십시오’, ‘끔찍한 환상’, ‘얼굴’, ‘동쪽’은 모두 적절합니다. ‘환상’은 visio의 의미 범위를 무리 없이 보존합니다.
