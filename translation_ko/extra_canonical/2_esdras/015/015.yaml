source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia adpropinquavit gladius et extritio illorum, et exsurget gens contra gentem ad pugnam, et romphea in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/015.yaml
  text: For the sword and their destruction have drawn near[a], and nation will rise against nation for battle, and broadswords will be in their hands.
  footnotes:
  - marker: a
    text: Or 'their sword and crushing are near'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 칼이 가까이 왔고 그들의 파멸도 다가왔으며, 민족이 민족을 대적하여 전쟁을 일으킬 것이며, 그들의 손에 긴 칼이 있을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 칼과 파멸이 가까이 왔다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: quia adpropinquavit
  english_pob_choice: have drawn near
  chosen_korean: 가까이 왔고 … 다가왔으며
  alternatives_korean:
  - 가까워졌고 … 가까워졌으며
  - 다가왔고 … 다가왔으며
  lexicon: adpropinquavit
  rationale: 완료 시제를 살려 이미 임박해 온 상태를 나타내면서, 한국어에서는 자연스럽게 ‘가까이 왔고’로 옮겼습니다.
- source_word: gladius
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 칼날
  lexicon: gladius
  rationale: 라틴어 gladius는 문자적으로는 칼/검이지만, 본문은 심판의 임박을 말하는 예언적 문맥이므로 과도하게 무기 명칭을 고정하지 않고 현대 한국어에서 자연스러운 ‘칼’을 택했습니다.
- source_word: extritio illorum
  english_pob_choice: their destruction
  chosen_korean: 그들의 파멸
  alternatives_korean:
  - 그들의 멸망
  - 그들의 파괴
  lexicon: extritio
  rationale: late Latin apocalyptic의 extritio는 물리적 ‘압궤’보다 ‘파멸/멸망’이 더 정확하며, 속격 illorum은 ‘그들 소유의 칼’이 아니라 ‘그들에 속한/그들에게 닥치는 파멸’로 이해되어야 합니다.
- source_word: romphea
  english_pob_choice: broadswords
  chosen_korean: 긴 칼
  alternatives_korean:
  - 대검
  - 큰 칼
  lexicon: romphea
  rationale: romphea는 넓은 날의 큰 칼을 가리키므로, 한국어에서는 무기 이미지를 유지하면서도 지나치게 고풍스럽지 않은 ‘긴 칼’로 옮겼습니다.
theological_decisions:
- issue: 임박한 심판의 표현 방식
  chosen_reading: 칼과 파멸이 이미 가까이 온 상태로, 열방 간 전쟁과 무력 충돌을 통해 심판이 전개된다는 예언으로 읽었습니다.
  alternative_readings:
  - 종말적 전쟁의 상징적 묘사로만 읽는 해석
  - 구체적 역사 사건 예고로만 읽는 해석
  rationale: 라틴 원문은 단순한 상징보다 실제적 심판의 임박성과 전쟁의 전개를 함께 진술하므로, 둘 중 하나로 축소하지 않고 병렬 구조를 살렸습니다.
  doctrine_reference: apocalyptic judgment imagery
- issue: romphea의 성격
  chosen_reading: ‘손에 있을 것이다’라고 직역하되, 무기의 종류는 ‘긴 칼’로 풀어 의미를 드러냈습니다.
  alternative_readings:
  - ‘대검이 그들의 손에 있을 것이다’
  - ‘그들의 손에는 칼이 있을 것이다’
  rationale: 원문은 무기의 존재를 강조하므로 장소 구문을 자연스러운 한국어로 바꾸되, 무기 소지의 긴장감을 유지했습니다.
  doctrine_reference: violent judgment motif
