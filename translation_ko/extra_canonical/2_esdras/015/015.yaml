  source_fidelity: 라틴어의 단수 완료형 adpropinquavit는 ‘칼’과 ‘그들의 파멸’에 함께 걸리므로 이를 한 동사로 결속하는 편이 정확합니다. exsurget ... ad pugnam은 ‘전쟁을 일으키다’보다 ‘싸우러 일어나다’가 원문의 대적·교전의 뜻을 더 직접적으로 보존합니다. romphea는 복수이며 큰/넓은 날의 칼을 가리키므로 ‘큰 칼들이’로 옮겼습니다.
  naturalness: ‘칼과 그들의 파멸이 가까이 왔고’ 및 ‘민족이 민족을 대적하여 싸우러 일어날 것이며’는 현대 표준어 합쇼체 문맥에서 자연스럽고, 원문의 병렬을 유지합니다.
  terminology: gladius는 ‘칼’, extritio illorum는 그들에게 닥칠 ‘파멸’, romphea는 일반 칼보다 큰 칼이라는 구별을 반영한 ‘큰 칼들’로 번역했습니다. 신학적 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘민족이 민족을 대적하여 전쟁을 일으킬 것이다’
    rationale: exsurget gens contra gentem ad pugnam은 한 민족이 전쟁을 ‘일으킨다’는 뜻을 특정하기보다 민족들이 서로 맞서 싸움에 일어나는 모습을 말합니다.
  - severity: low
    issue: romphea의 복수와 의미 범위
    rationale: ‘긴 칼’은 길이를 특정하지만 romphea는 큰 칼/넓은 날의 칼을 가리키며, 원문은 복수입니다.
  - severity: low
