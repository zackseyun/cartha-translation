review_pass:
  verdict: revise
  source_fidelity: 라틴어의 단편적 시작인 “et mortem”과 끝의 미완성 접속사 “cum”을 보존해야 합니다. 초안의 “죽음입니다”는 라틴어에 없는 서술어를 보충합니다.
  naturalness: 현대 한국어로는 문장 파편과 미완성 종속절이 비문처럼 보일 수 있으나, 이는 원문의 현존 단편 상태를 충실히 반영하는 경우입니다. “때에”를 독립적으로 남기고 각주로 설명하는 방식이 가장 투명합니다.
  terminology: uirtus는 여기서 “능력”도 가능하지만, gloria uirtutis의 소유·속격 관계를 한국어에서 더 자연스럽게 드러내도록 “당신의 힘이 지닌 영광”으로 옮깁니다. siccabitur의 꽃 비유에는 “시들 것입니다”가 적절합니다.
  issues:
  - severity: medium
    issue: “그리고 죽음입니다”가 명사구에 서술어를 보충함
    rationale: et mortem은 현존 본문상 앞 문맥에서 이어지는 명사구 단편입니다. “입니다”는 ‘~이다’라는 완결된 판단을 추가하므로, “그리고 죽음.”으로 단편성을 보존하는 편이 낫습니다.
  - severity: medium
    issue: 라틴어 cum의 미완성 구조가 한국어 본문에 반영되지 않음
    rationale: 영어 when을 그대로 남긴 초안과 달리, 한국어 본문에도 해당 접속사를 “때에”로 옮겨 본문이 그 지점에서 끊긴다는 사실을 드러내야 합니다.
  - severity: low
    issue: “당신의 능력의 영광”의 연속 속격이 다소 경직됨
    rationale: 의미를 유지하면서 “당신의 힘이 지닌 영광”으로 하면 현대 한국어에서 관계가 더 분명하고 자연스럽습니다.
  revised_text: 그리고 죽음. 또 당신의 힘이 지닌 영광은 꽃처럼 시들 것입니다. 때에[a]
