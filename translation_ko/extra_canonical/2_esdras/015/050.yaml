lexical_decisions:
- source_word: et mortem
  english_pob_choice: and death
  chosen_korean: 그리고 죽음입니다
  alternatives_korean:
  - 그리고 죽음
  - 또 죽음입니다
  - 그리고 사망입니다
  lexicon: 죽음
  rationale: 라틴어 명사구를 간결하게 옮기되, 앞뒤 문맥의 단문 병렬을 살려 현대 한국어 합쇼체로 마무리했습니다.
- source_word: gloria uirtutis tuae
  english_pob_choice: the glory of your strength
  chosen_korean: 당신의 능력의 영광
  alternatives_korean:
  - 당신의 힘의 영광
  - 당신의 능력의 찬란함
  - 당신의 권능의 영광
  lexicon: 영광 / 능력
  rationale: uirtus를 단순한 '힘'보다 넓은 '능력'으로 두어, '영광'과의 결합을 자연스럽게 유지했습니다.
- source_word: sicut flos siccabitur
  english_pob_choice: will wither like a flower
  chosen_korean: 꽃처럼 시들 것입니다
  alternatives_korean:
  - 꽃처럼 마를 것입니다
  - 꽃처럼 시들어 갈 것입니다
  - 꽃처럼 시듭니다
  lexicon: 시들다
  rationale: POB가 수정한 'wither'를 따라 꽃 이미지와 결합되는 자연스러운 동사 '시들다'를 택했습니다.
theological_decisions:
- issue: 라틴어가 여기서 문장을 'cum'에서 끊어 끝내는 미완성형이라는 점
  chosen_reading: 본문은 의도적으로 미완성된 조건절처럼 들리도록 그대로 남겼습니다.
  alternative_readings:
  - '''...when the heat rises''처럼 보충하여 완결하기'
  - 문맥을 따라 조건절을 풀어 서술하기
  rationale: 영어 POB의 최신 수정이 불필요한 확장을 제거한 만큼, 한국어도 남겨진 'when'의 불완전성을 보존해 단절감을 유지했습니다.
  doctrine_reference: 텍스트 비평적 보존 원칙
