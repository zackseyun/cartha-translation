id: 2ES.15.61
reference: 2 Esdras 15:61
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: erunt tibi ignis. Et deuorabunt te et ciuitates tuas, terram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/061.yaml
  text: They will be fire to you. And they will devour you and your cities, your land and your mountains; all your forests and your fruitful trees they will burn with fire.
translation:
  language: ko
  text: 그것들은 너에게 불이 될 것입니다. 그것들은 너와 네 성읍들과 네 땅과 네 산들을 삼킬 것이며, 네 모든 숲과 네 열매 맺는 나무들을 불로 태울 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: erunt tibi ignis
  english_pob_choice: They will be fire to you.
  chosen_korean: 그것들은 너에게 불이 될 것입니다.
  alternatives_korean:
  - 그것들은 너에게 화염이 될 것입니다.
  - 그것들은 너를 불처럼 덮칠 것입니다.
  lexicon: ignis → 불
  rationale: 라틴어 원문은 단순히 ‘불이 되다’라고 말하며, POB의 수정된 영어도 이 개시 절을 복원합니다. 한국어에서도 은유를 직접 살려 대상이 ‘불’ 그 자체가 되어 파괴적 심판이 됨을 드러냈습니다.
- source_word: deuorabunt
  english_pob_choice: they will devour
  chosen_korean: 삼킬 것이며
  alternatives_korean:
  - 집어삼킬 것이며
  - 먹어치울 것이며
  lexicon: deuorare → 삼키다, 집어삼키다
  rationale: 라틴어는 ‘먹어 삼키다’의 강한 파괴성을 지니므로, 평이한 ‘파괴하다’보다 ‘삼키다’가 원문의 이미지를 더 가깝게 옮깁니다.
- source_word: ciuitates tuas, terram ... montes
  english_pob_choice: you and your cities, your land and your mountains
  chosen_korean: 너와 네 성읍들과 네 땅과 네 산들을
  alternatives_korean:
  - 너와 네 도시들과 네 땅과 네 산들을
  - 너와 네 성읍과 네 땅과 네 산을
  lexicon: ciuitates / terram / montes
  rationale: ciuitates는 문맥상 현대적 ‘도시’보다 성경적·고전적 행정 중심지를 가리키는 ‘성읍들’이 적절하며, 원문의 병렬 구조를 보존해 대상 범위를 분명히 했습니다.
- source_word: omnia nemora tua et arbores fructuosas
  english_pob_choice: all your forests and your fruitful trees
  chosen_korean: 네 모든 숲과 네 열매 맺는 나무들을
  alternatives_korean:
  - 네 모든 숲과 네 과실나무들을
  - 네 모든 수목과 네 열매 맺는 나무들을
  lexicon: nemora / arbores fructuosas
  rationale: nemora는 단순한 ‘나무들’보다 집합적 의미의 ‘숲’이 자연스럽고, arbores fructuosas는 ‘열매 맺는 나무들’로 옮겨 원문의 반복적 파괴 대상을 보존했습니다.
theological_decisions:
- issue: 심판 이미지의 직접성
  chosen_reading: 원문의 불·삼킴·불태움 이미지를 완화하지 않고 직설적으로 옮겼습니다.
  alternative_readings:
  - 비유적으로 풀어 ‘멸망시킬 것이다’로 완화함
  - 재난의 일반적 이미지로만 처리함
  rationale: 이 구절은 심판 선언의 폭력성과 총체성을 의도적으로 강조하므로, 완곡한 표현은 원문의 경고 기능을 약화시킵니다.
  doctrine_reference: 예언적 심판 경고의 문학적 직접성
- issue: 반복 구조 보존
  chosen_reading: ‘너와 네 성읍들과 네 땅과 네 산들… 네 모든 숲과 네 열매 맺는 나무들’의 열거를 유지했습니다.
  alternative_readings:
  - 대상을 묶어 한 문장으로 축약함
  - 일부 항목을 생략함
  rationale: 열거는 파괴 범위의 총체성을 전달하므로, 한국어에서도 목록을 유지해야 원문 효과가 살아납니다.
  doctrine_reference: 예언서적 열거와 심판 범위의 전면성
