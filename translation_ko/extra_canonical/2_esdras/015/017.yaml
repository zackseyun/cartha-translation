    text: Or 'A man will desire'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 한 사람이 성읍으로 들어가고자 할 것이며, 들어갈 수 없을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 사람이 성읍으로 들어가고자 할 것이며, 들어갈 수 없을 것입니다.’
