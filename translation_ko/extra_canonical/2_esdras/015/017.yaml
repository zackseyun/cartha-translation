lexical_decisions:
- source_word: concupiscet
  english_pob_choice: will desire
  chosen_korean: 들어가고자 하겠지만
  alternatives_korean:
  - 들어가기를 바라겠지만
  - 들어가려 하겠지만
  lexicon: concupisco
  rationale: 라틴어 동사 concupiscet은 단순한 의지보다 강한 갈망을 나타내므로, 한국어에서는 문맥상 자연스럽고 강한 욕구를 보이는 ‘-고자 하다’로 옮겼습니다.
- source_word: homo
  english_pob_choice: a man
  chosen_korean: 한 사람이
  alternatives_korean:
  - 사람이
  - 어떤 사람이
  lexicon: homo
  rationale: homo는 특정 성별보다 인간 일반을 가리키므로, 표준적인 ‘한 사람’으로 번역해 보편성을 살렸습니다.
- source_word: in civitatem ire
  english_pob_choice: to go into a city
  chosen_korean: 성으로 들어가다
  alternatives_korean:
  - 도시로 들어가다
  - 성읍으로 들어가다
  lexicon: civitas
  rationale: civitas는 고전 라틴어에서 도시/성읍을 뜻하지만, 문맥상 한국어에서는 간결한 ‘성’이 자연스럽고, 폐쇄된 도성 안으로 들어가려는 상황을 잘 드러냅니다.
- source_word: non poterit
  english_pob_choice: will not be able
  chosen_korean: 들어갈 수 없을 것입니다
  alternatives_korean:
  - 할 수 없을 것입니다
  - 들어가지 못할 것입니다
  lexicon: possum
  rationale: 직전 동사구를 반복하여 능력의 부재를 분명히 했고, 미래 부정의 예고적 어조를 합쇼체로 살렸습니다.
theological_decisions:
- issue: 연결어 enim의 처리
  chosen_reading: ‘그러므로’로 옮겨 앞절의 붕괴 진술과 이어지는 예시를 분명히 했습니다.
  alternative_readings:
  - ‘왜냐하면’
  - 생략
  rationale: enim은 단순 설명이 아니라 앞문맥의 논증을 이어 주는 표지이므로, 한국어에서는 인과·전환 기능을 함께 담는 ‘그러므로’가 가장 자연스럽습니다.
  doctrine_reference: 문맥 연결의 보존
- issue: 예언적 종말 문맥의 미래 서술
  chosen_reading: 미래형 ‘-을 것입니다’를 사용해 임박한 예고의 톤을 유지했습니다.
  alternative_readings:
  - 현재형으로 평서
  - ‘-할 것입니다’보다 약한 예고 표현
  rationale: 이 절은 장차 일어날 사회적 혼란의 사례를 말하므로, 단정적 현재보다 미래 예고형이 source의 시간감을 더 잘 반영합니다.
  doctrine_reference: 서사·예언 시제 보존
