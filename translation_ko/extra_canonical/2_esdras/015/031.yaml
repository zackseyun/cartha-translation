translation:
  language: ko
  text: 그리고 이 일 뒤에, 그 용은 자기의 기원을 기억하고서 세력을 떨칠 것이며, 그들이 돌아서서 큰 힘으로 연합하여 그들을 추적하려 하면,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘기원’은 여기서 nativitatis의 더 자연스럽고 정확한 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: conspirantes는 여기서 ‘음모를 꾸미다’보다 군사적 문맥의 ‘함께 연합하다/힘을 모으다’에 가깝습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: supervalescet
  english_pob_choice: will prevail
  chosen_korean: 세력을 떨칠 것이며
  alternatives_korean:
  - 우세할 것이며
  - 이길 것이며
  - 압도할 것이며
  lexicon: supervalescere
  rationale: 단순한 ‘이기다’보다 우세를 드러내는 동사구가 문맥의 급격한 군사적 힘의 상승을 더 잘 살립니다.
- source_word: draco
  english_pob_choice: the dragon
  chosen_korean: 그 용
  alternatives_korean:
  - 용
  - 그 용은
  - 그 뱀
  lexicon: draco
  rationale: 직설적 이미지인 ‘용’을 유지하고, 지시를 분명히 하되 본문 흐름을 자연스럽게 하기 위해 관사를 반영했습니다.
- source_word: nativitatis memoria suae
  english_pob_choice: mindful of its origin
  chosen_korean: 자기의 기원을 기억하고서
  alternatives_korean:
  - 자기의 출생을 기억하고서
  - 자기 탄생을 떠올리고서
  - 자기의 근원을 기억하고서
  lexicon: nativitas + memoria
  rationale: nativitas를 ‘출생’보다 넓은 ‘기원’으로 옮겨, POB의 audit trail이 지적한 자연스럽고 정확한 의미를 반영했습니다.
- source_word: conspirantes
  english_pob_choice: conspiring
  chosen_korean: 연합하여
  alternatives_korean:
  - 공모하여
  - 음모를 꾸며
  - 모의하여
  lexicon: conspirare
  rationale: 전투적 추격 문맥에서 secret plotting의 뉘앙스를 피하고, 최신 검토처럼 ‘함께 힘을 모음’의 뜻을 살렸습니다.
theological_decisions:
- issue: apocalyptic imagery of the dragon
  chosen_reading: 문자적 이미지를 완화하지 않고 ‘그 용’으로 유지했습니다.
  alternative_readings:
  - 상징화하여 ‘악한 세력’으로 옮김
  - 의역하여 ‘괴물’로 표현
  rationale: 본문은 낯설고 불안한 종말론적 이미지를 그대로 전달하므로, 매끈하게 풀어 쓰기보다 원문의 이질성을 보존하는 편이 독자 이해에 더 충실합니다.
  doctrine_reference: apocalyptic symbolism / source transparency
