  lexicon: N/A
  rationale: 본문의 habitant in eum(‘그 안에 사는’)이 공간적 의미를 강하게 요구하므로, 여기서는 ‘시대’보다 ‘세상’이 원문 의도를 더 잘 드러냅니다.
- source_word: qui habitant in eum
