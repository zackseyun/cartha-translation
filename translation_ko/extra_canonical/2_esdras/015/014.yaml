lexical_decisions:
- source_word: vae
  english_pob_choice: Woe
  chosen_korean: 화
  alternatives_korean:
  - 슬픔
  - 재앙
  - 불행
  lexicon: N/A
  rationale: 라틴어 감탄사 vae의 예언적 경고를 한국어로 직접 살리기 위해 ‘화’로 옮겼습니다. 단순한 감정보다 심판 선언의 뉘앙스를 유지합니다.
- source_word: saeculo
  english_pob_choice: the world
  chosen_korean: 세상
  alternatives_korean:
  - 세계
  - 시대
  - 이 시대
  lexicon: N/A
  rationale: 본문의 habitant in eum(‘그 안에 사는’)이 공간적 의미를 강하게 요구하므로, 여기서는 ‘시대’보다 ‘세상’이 원문 의도를 더 잘 드러냅니다.
- source_word: qui habitant in eum
  english_pob_choice: those who dwell in it
  chosen_korean: 그 안에 사는 이들
  alternatives_korean:
  - 그 안에 거하는 자들
  - 그 안에 사는 사람들
  lexicon: N/A
  rationale: habitāre의 지속적 거주 의미를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: saeculum의 의미 범위
  chosen_reading: ‘세상’으로 번역하여 현재의 피조 세계와 그 안의 거주자들을 함께 겨냥하는 탄식으로 읽었습니다.
  alternative_readings:
  - ‘시대’로 번역하여 종말론적 시대 탄식으로 읽기
  rationale: 영어 POB의 최신 판정이 ‘world’를 채택했고, 본문 내부의 ‘그 안에 사는’이 공간적 범위를 확인해 줍니다. 따라서 시대론적 추상화보다 세계-거주자 병렬이 더 적절합니다.
  doctrine_reference: 묵시문학의 심판 탄식 어법
