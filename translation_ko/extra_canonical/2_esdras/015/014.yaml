  lexicon: N/A
  rationale: habitāre의 지속적 거주 의미를 살리면서도 현대 한국어에서 자연스러운 표현으로 옮겼습니다.
theological_decisions:
- issue: saeculum의 의미 범위
  chosen_reading: ‘세상’으로 번역하여 현재의 피조 세계와 그 안의 거주자들을 함께 겨냥하는 탄식으로 읽었습니다.
  alternative_readings:
  - ‘시대’로 번역하여 종말론적 시대 탄식으로 읽기
  rationale: 영어 POB의 최신 판정이 ‘world’를 채택했고, 본문 내부의 ‘그 안에 사는’이 공간적 범위를 확인해 줍니다. 따라서 시대론적 추상화보다 세계-거주자 병렬이 더 적절합니다.
  doctrine_reference: 묵시문학의 심판 탄식 어법
