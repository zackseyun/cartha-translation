translation:
  language: ko
  text: 세상에 화가 있습니다. 그리고 그 안에 사는 이들에게도 화가 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시대에 화가 있습니다’.
