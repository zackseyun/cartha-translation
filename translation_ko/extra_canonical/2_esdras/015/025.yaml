base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/025.yaml
  text: I will not spare them. Depart[a], you apostate children; do not defile my sanctification.
  footnotes:
  - marker: a
    text: Latin sanctificationem meam is literally 'my sanctification' or 'my holy thing.' The rendering 'my sanctuary' takes it concretely in this context of defilement, but the phrase may more broadly denote what belongs to God's holiness.
    reason: lexical_alternative
    anchor_ref: '15:25'
translation:
  language: ko
  text: 나는 그들을 아끼지 않겠습니다. 떠나십시오, 배교한 자녀들아. 내 거룩한 것을 더럽히지 마십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 sanctificationem meam은 문자적으로 ‘나의 거룩함/거룩한 것’에 가깝고, 문맥상 ‘내 성소’로 구체화할 수 있지만 더 넓게는 하나님께 속한 거룩한 실재를 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: non parcam illis
  english_pob_choice: I will not spare them.
  chosen_korean: 나는 그들을 아끼지 않겠습니다.
  alternatives_korean:
  - 나는 그들을 용서하지 않겠습니다.
  - 나는 그들에게 자비를 베풀지 않겠습니다.
  lexicon: parcere
  rationale: parcam의 핵심은 ‘아끼다/용서하다’보다 ‘사면하여 남겨 두다’에 가깝기 때문에, 문맥상 심판의 거절을 분명히 드러내는 표현으로 옮겼습니다.
- source_word: discedite
  english_pob_choice: Depart
  chosen_korean: 떠나십시오
  alternatives_korean:
  - 물러가십시오
  - 가십시오
  lexicon: discedere
  rationale: 단순한 이동이 아니라 강한 추방/명령의 뉘앙스가 있어, 공적 경고로 읽히는 합쇼체 명령형으로 옮겼습니다.
- source_word: filii apostatae
  english_pob_choice: you apostate children
  chosen_korean: 배교한 자녀들아
  alternatives_korean:
  - 배교한 아들들아
  - 타락한 자녀들아
  lexicon: apostata
  rationale: apostatae는 단순한 ‘타락한’보다 신앙을 저버린 ‘배교한’이 더 직접적이며, filii는 문맥상 집합적 호칭이므로 ‘자녀들아’로 유지했습니다.
- source_word: sanctificationem meam
  english_pob_choice: my sanctification
  chosen_korean: 내 거룩한 것을
  alternatives_korean:
  - 내 성별하심을
  - 내 성소를
  - 내 성별된 것
  lexicon: sanctificatio
  rationale: 라틴어 sanctificationem meam은 문자적으로 ‘나의 거룩하게 함/거룩한 것’인데, 영어 POB의 수정 취지가 ‘sanctuary’가 아니라 더 직접적인 뜻을 살리는 데 있으므로, 훼손의 대상이 되는 신성한 실재를 한국어로 가장 자연스럽게 드러내는 ‘내 거룩한 것’으로 옮겼습니다.
theological_decisions:
- issue: sanctificationem meam의 범위
  chosen_reading: 하나님의 ‘거룩한 것’으로 두어, 성소에만 한정하지 않고 하나님께 속한 성스러운 실재 전체를 열어 두었습니다.
  alternative_readings:
  - 내 성소를
  - 내 성별하심을
  rationale: 영어 POB 주석이 이 표현을 ‘my sanctuary’보다 넓은 의미로 이해할 여지를 남기고 있으므로, 구체적 장소로 과도하게 좁히지 않으면서도 더럽힘의 대상이라는 문맥은 유지했습니다.
  doctrine_reference: source_note
