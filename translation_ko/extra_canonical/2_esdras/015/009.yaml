revisions:
- from: 나는 반드시 그들을 철저히 갚아 주겠습니다. 주님께서 말씀하십니다. 그리고 나는 그들로부터 모든 무죄한 피를 내게 요구하겠습니다.[a]
  to: 내가 반드시 그들에게 원수를 갚겠습니다. 주님께서 말씀하십니다. 그리고 내가 그들에게서 무고하게 흘린 모든 피의 값을 받아 내겠습니다.[a]
  rationale: 첫 절은 원문의 강조를 ‘반드시’로 보존하면서 한국어에서 대상이 보응을 받는다는 관계를 자연스럽게 했습니다. 둘째 절은 ‘무죄한 피’를 단순한 물질적 피가 아니라 그 피에 대한 혈죄와 보응의 관용 표현으로 처리하여, accipiam ... ex illis ad me의 책임 추궁 의미를 명료하게 옮겼습니다.
