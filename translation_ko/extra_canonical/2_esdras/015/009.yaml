id: 2ES.15.9
reference: 2 Esdras 15:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: vindicans vindicabo illos, dicit Dominus, et accipiam omnem sanguinem innocuum ex illis ad me.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/015/009.yaml
  text: I will surely avenge them[a], says the Lord, and I will require from them all innocent blood for myself.
  footnotes:
  - marker: a
    text: Or 'In avenging I will avenge them'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 반드시 그들을 철저히 갚아 주겠습니다. 주님께서 말씀하십니다. 그리고 나는 그들로부터 모든 무죄한 피를 내게 요구하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들을 갚아 주는 가운데 나는 반드시 갚아 주겠다’.
    reason: previous_rendering
lexical_decisions:
- source_word: vindicans vindicabo
  english_pob_choice: I will surely avenge them
  chosen_korean: 나는 반드시 그들을 철저히 갚아 주겠습니다
  alternatives_korean:
  - 나는 그들을 갚아 갚겠습니다
  - 나는 분명히 그들을 복수하겠습니다
  lexicon: Latin vindico / vindicabo
  rationale: 겹쳐진 동사형이 단순 반복이 아니라 강한 강조이므로, 한국어에서는 ‘반드시’와 ‘철저히’로 확정성과 강도를 살렸습니다.
- source_word: Dominus
  english_pob_choice: the Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주
  - 주께서
  lexicon: Dominus
  rationale: 이 문맥의 발화 주체는 신적 칭호이므로 표준적인 공손한 호칭인 ‘주님’으로 옮겼습니다.
- source_word: accipiam omnem sanguinem innocuum ex illis ad me
  english_pob_choice: I will require from them all innocent blood for myself
  chosen_korean: 그리고 나는 그들로부터 모든 무죄한 피를 내게 요구하겠습니다
  alternatives_korean:
  - 그리고 나는 그들로부터 모든 무죄한 피를 거두겠습니다
  - 그리고 나는 그들 가운데서 모든 무죄한 피를 내게로 취하겠습니다
  lexicon: Latin accipiam / sanguinem innocuum / ad me
  rationale: accipiam은 여기서 단순히 ‘받다’보다 ‘요구하다/청구하다’의 의미가 분명하므로, POB의 수정된 영어 의미에 맞춰 혈흔에 대한 책임을 ‘요구하다’로 표현했습니다.
theological_decisions:
- issue: 두 번째 절의 법정적·보응적 어조
  chosen_reading: 하나님이 무죄한 피에 대해 책임을 물으시는 보응 선언으로 읽었습니다.
  alternative_readings:
  - 단순한 보복 선언
  - 의례적 정결 회수 표현
  rationale: 문맥상 innocent blood는 죄책과 심판의 언어이며, 영어 POB의 ‘require’도 이를 혈흔의 책임 추궁으로 해석합니다.
  doctrine_reference: 혈죄 책임과 신적 심판의 공의
