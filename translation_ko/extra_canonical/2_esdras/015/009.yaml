review_pass:
  verdict: revise
  source_fidelity: 첫 절의 반복형(vindicans vindicabo)은 강조이므로 ‘반드시’로 옮기는 것이 적절합니다. 그러나 ‘그들을 철저히 갚아 주겠습니다’는 ‘갚아 주다’가 수혜적 뉘앙스를 낼 수 있고 ‘철저히’는 원문에 없는 강도를 더합니다. 둘째 절의 accipiam ... sanguinem innocuum ex illis ad me는 가해자들에게 무고한 피에 대한 대가를 요구하는 심판 표현입니다.
  naturalness: ‘모든 무죄한 피를 내게 요구하겠습니다’는 누가 누구에게 요구하는지 문법 관계가 부자연스럽고, 피 자체를 화자가 자신에게 요구한다는 뜻으로 읽힐 수 있습니다. ‘무고하게 흘린 모든 피의 값을 그들에게서 받아 내겠습니다’가 현대 표준어에서 법정적·보응적 의미를 자연스럽게 전달합니다.
  terminology: Dominus는 ‘주님’으로 유지할 수 있습니다. vindico의 보응 의미는 ‘그들에게 원수를 갚겠습니다’로, innocent blood의 관용적 혈죄 의미는 ‘무고하게 흘린 모든 피의 값’으로 옮겼습니다. 이는 특정 교리적 해석을 더하지 않고 원문의 심판 언어를 한국어 관용에 맞게 명시합니다.
  issues:
  - severity: medium
    issue: ‘그들을 철저히 갚아 주겠습니다’의 수혜적·과잉 강화 뉘앙스
    rationale: ‘갚아 주다’는 대상에게 이익을 베푸는 뜻으로도 흔히 쓰이며, ‘철저히’는 반복형의 강조를 넘는 추가 강도를 암시합니다.
  - severity: high
    issue: 둘째 절의 목적어와 요구 대상의 관계가 부자연스러움
    rationale: ‘그들로부터 ... 피를 내게 요구하다’는 한국어 문법상 피를 화자에게 요구하는 것으로 오독될 수 있습니다. 원문의 혈죄 추궁 의미를 분명히 해야 합니다.
  revised_text: 내가 반드시 그들에게 원수를 갚겠습니다. 주님께서 말씀하십니다. 그리고 내가 그들에게서 무고하게 흘린 모든 피의 값을 받아 내겠습니다.[a]
