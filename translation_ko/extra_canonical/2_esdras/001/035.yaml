id: 2ES.1.35
reference: 2 Esdras 1:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domus uestras populo uenienti, qui me non audientes credunt ; quibus signa non ostendi, facient quae praecepi. Prophetas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/035.yaml
  text: I will give your houses to a people that is coming[a], who, without hearing me, believe; to whom I have shown no signs, yet they will do what I have commanded.
  footnotes:
  - marker: a
    text: Or 'who, though they have not heard me, will believe'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 오는 백성에게 너희 집들을 넘겨 주겠습니다. 그들은 나를 듣지 않았지만 믿을 것이며[a], 내가 그들에게 어떤 표징도 보여 주지 않았으나 내가 명령한 것을 행할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 듣지 않았으나 믿는 사람들’.
    reason: alternative_reading
lexical_decisions:
- source_word: domus uestras
  english_pob_choice: your houses
  chosen_korean: 너희 집들
  alternatives_korean:
  - 너희 가옥들
  - 너희 집
  lexicon: domus
  rationale: 재산 전체가 아니라 거주 공간을 가리키므로 자연스럽게 ‘집들’로 옮겼고, 복수성도 유지했습니다.
- source_word: populo uenienti
  english_pob_choice: a people that is coming
  chosen_korean: 오는 백성
  alternatives_korean:
  - 다가오는 백성
  - 이르는 백성
  lexicon: populus
  rationale: 현재 진행/임박의 뉘앙스를 살리기 위해 ‘오는’으로 옮겼습니다.
- source_word: me non audientes credunt
  english_pob_choice: who, without hearing me, believe
  chosen_korean: 나를 듣지 않았지만 믿을 것이며
  alternatives_korean:
  - 나의 말을 듣지 않고 믿을 것이며
  - 나를 듣지 못했지만 믿을 것이며
  lexicon: audire / credere
  rationale: 영문 각주가 반영한 대로 핵심은 ‘듣지 않음’과 ‘믿음’의 대비이므로, 청각적/언어적 수납을 나타내는 ‘듣지 않았다’와 ‘믿을 것이다’의 대비를 살렸습니다.
- source_word: signa non ostendi
  english_pob_choice: to whom I have shown no signs
  chosen_korean: 내가 그들에게 어떤 표징도 보여 주지 않았으나
  alternatives_korean:
  - 내가 그들에게 아무 표징도 보이지 않았으나
  - 내가 그들에게 표징을 하나도 보이지 않았으나
  lexicon: signa
  rationale: ‘signa’는 기적적 표징을 가리키므로 ‘표징’이 가장 직접적이며, 부정 범위를 분명히 하기 위해 ‘어떤 …도’로 처리했습니다.
- source_word: facient quae praecepi
  english_pob_choice: yet they will do what I have commanded
  chosen_korean: 내가 명령한 것을 행할 것입니다
  alternatives_korean:
  - 내가 명한 것을 행할 것입니다
  - 내가 지시한 것을 행할 것입니다
  lexicon: praecipere
  rationale: 명령의 강도를 살리기 위해 ‘명령하다’를 택했고, ‘do what’의 대상은 관용적으로 ‘행하다’로 옮겼습니다.
theological_decisions:
- issue: 믿음과 표징의 대비
  chosen_reading: 그들은 표징이 주어지지 않아도, 곧 들은 바 없이도 믿는 백성으로 그려집니다.
  alternative_readings:
  - 표징을 보고서야 믿는 백성
  - 듣지 못했으므로 믿는 백성
  rationale: 본문은 표징의 부재와 선행하는 믿음을 대조하여 강조하므로, 믿음의 성격을 약화시키지 않고 그대로 드러냈습니다.
  doctrine_reference: faith and revelation
