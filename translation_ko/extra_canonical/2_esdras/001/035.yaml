  naturalness: 수정문은 현대 표준어 합쇼체로 자연스럽고, 관계절의 내용을 독립 문장으로 풀어 ‘오는 백성’을 가리키는 구조를 명료하게 했습니다.
  terminology: ‘표징’, ‘명령한 것을 행하다’는 문맥과 종교 문헌의 격식에 잘 맞습니다. ‘내 말을 듣지 않고도 나를 믿습니다’는 라틴어의 듣기와 믿기의 대조를 한국어에서 자연스럽게 재현합니다.
