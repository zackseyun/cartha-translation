    rationale: ‘내 말을 듣지 않고도’가 원문의 의미와 한국어 용법을 더 정확히 반영합니다.
  - severity: low
    issue: 각주는 본문에서 이미 채택해야 할 현재형 번역을 대안으로 제시합니다.
