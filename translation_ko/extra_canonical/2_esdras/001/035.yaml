- from: 내가 오는 백성에게 너희 집들을 넘겨 주겠습니다. 그들은 나를 듣지 않았지만 믿을 것이며[a], 내가 그들에게 어떤 표징도 보여 주지 않았으나 내가 명령한 것을 행할 것입니다.
  to: 내가 오는 백성에게 너희 집들을 넘겨주겠습니다. 그들은 내 말을 듣지 않고도 나를 믿습니다. 내가 그들에게 어떤 표징도 보여 주지 않았는데도, 그들은 내가 명령한 것을 행할 것입니다.
  rationale: 현재형 ‘credunt’를 ‘믿습니다’로, 현재분사 구문을 ‘내 말을 듣지 않고도’로 수정하여 원문의 시제와 대조를 보존했습니다. ‘signa non ostendi’의 완료적 부정과 뒤따르는 양보 관계는 ‘보여 주지 않았는데도’로 자연스럽게 표현했습니다.
