  yaml_path: translation/extra_canonical/2_esdras/001/023.yaml
  text: I did not give you fire for your blasphemies, but by casting wood into the water I made the stream sweet.
translation:
  language: ko
  text: 나는 너희의 모독 행위에 대하여 불을 주지 않았고, 나무를 물에 던져 시내를 달게 만들었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 blasphemiis는 ‘신성모독’으로도 옮길 수 있지만, 여기서는 문맥의 직설성과 현대어 가독성을 고려해 ‘모독 행위’로 풀었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Non ignem uobis pro blasphemiis dedi
  english_pob_choice: I did not give you fire for your blasphemies
  chosen_korean: 나는 너희의 모독 행위에 대하여 불을 주지 않았고
  alternatives_korean:
  - 나는 너희의 신성모독 때문에 불을 주지 않았고
  - 나는 너희의 모독들 때문에 불을 주지 않았고
  lexicon: ignem / blasphemiis / dedi
  rationale: 라틴어의 직접 진술을 살리면서, blasphemiis는 단순한 욕설보다 하나님을 향한 모독의 뉘앙스를 갖지만 한국어 본문에서는 과도하게 교회식 용어로 좁히지 않고 ‘모독 행위’로 옮겼습니다.
- source_word: sed mittens lignum in aqua
  english_pob_choice: but by casting wood into the water
  chosen_korean: 나무를 물에 던져
  alternatives_korean:
  - 나무를 물에 넣어
  - 나무를 물에 집어넣어
  lexicon: mittens lignum in aqua
  rationale: 영어 POB의 분사구문에 맞춰 원인/수단의 연결을 드러내되, 라틴어 mittens의 동작성을 살려 ‘던져’로 번역했습니다.
- source_word: dulce feci flumen
  english_pob_choice: I made the stream sweet
  chosen_korean: 시내를 달게 만들었습니다
  alternatives_korean:
  - 시내를 달게 했습니다
  - 하천을 달게 만들었습니다
  lexicon: dulce feci flumen
  rationale: dulce는 단순히 ‘달다’의 맛뿐 아니라 물이 마실 수 있게 된 상태를 가리키므로, 한국어에서도 직역적이면서 의미가 살아 있는 ‘달게 만들었습니다’를 택했습니다.
theological_decisions:
- issue: 2인칭 복수 대상과 신적 징계의 대조
  chosen_reading: ‘너희’는 하나님께 대한 집단적 모독을 가리키고, 이어지는 불과 달게 된 물의 대조는 징계가 아니라 자비의 표지로 이해했습니다.
  alternative_readings:
  - 개별적 비난으로 좁게 읽는 해석
  - ‘불’과 ‘달게 함’을 단순 자연 기적으로만 읽는 해석
  rationale: 문맥상 화자는 청중의 모독에 대한 응답으로 불 대신 물을 달게 하신 행위를 대비시키므로, 대조 구조를 분명히 살리는 것이 본문의 수사와 의미에 맞습니다.
  doctrine_reference: 신적 징계와 자비의 대비
- issue: blasphemiis의 한국어 범위
  chosen_reading: ‘모독 행위’로 번역해 신성모독의 종교적 강도는 유지하되, 특정 교단 용어로 경직되거나 현대 독자에게 불필요하게 낯선 표현은 피했습니다.
  alternative_readings:
  - 신성모독
  - 참람
  rationale: 라틴어의 죄목을 보존하면서도, 현행 표준어에서 이해 가능한 표현으로 옮겨 독서 흐름을 해치지 않도록 했습니다.
  doctrine_reference: 성서적 모독 개념
