  source_fidelity: '`antiquitas/antiquitatum`은 ‘옛 시절’로만 한정하기보다 옛 시대·옛것·고래의 전승을 아우를 수 있게 옮겨야 합니다. 또한 본문상 불확실성과 의미 범위에 관한 주석은 `보지 못했습니다`가 아니라 해당 명사구에 붙어야 합니다. `Testor`는 뒤에 이어질 목적어가 생략된 채 절이 끝나는 점을 보존하되, 한국어로는 ‘증인으로 삼습니다’가 더 자연스럽습니다.'
