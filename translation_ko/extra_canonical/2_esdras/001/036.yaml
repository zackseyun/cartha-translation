  rationale: 이 절은 다음 절과 이어지는 발화의 시작이므로, 없는 말을 덧붙이지 않고 열린 종결을 보존하는 것이 본문 충실성에 더 적합합니다.
  doctrine_reference: source fidelity / textual criticism
