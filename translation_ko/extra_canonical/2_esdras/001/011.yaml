  text: Omnes gentes a facie eorum perdidi et in oriente prouinciarum duarum populum, Tyri et Sidonis, dissipaui et omnes aduersarios eorum interfeci.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/011.yaml
  text: I destroyed all the nations before them, and in the east I scattered the people of the two provinces, Tyre and Sidon, and killed all their enemies.
translation:
  language: ko
  text: 나는 그들 앞에서 모든 민족을 멸망시켰고, 동쪽에서 두 지방, 곧 두로와 시돈의 백성을 흩어 놓았으며, 그들의 모든 적을 죽였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Omnes gentes
  english_pob_choice: all the nations
  chosen_korean: 모든 민족
  alternatives_korean:
  - 모든 나라들
  - 온 민족들
  lexicon: gentes
  rationale: 라틴어 gentes는 여기서 개별 국가 집단을 가리키므로, 자연스러운 현대 한국어로는 ‘민족’이 가장 직접적입니다.
- source_word: a facie eorum
  english_pob_choice: before them
  chosen_korean: 그들 앞에서
  alternatives_korean:
  - 그들 면전에서
  - 그들 앞에
  lexicon: a facie
  rationale: 직역의 힘을 살리면서도 한국어에서 가장 자연스러운 전치 표현으로 옮겼습니다.
- source_word: dissipaui
  english_pob_choice: I scattered
  chosen_korean: 흩어 놓았으며
  alternatives_korean:
  - 흩어 버렸으며
  - 흩었습니다
  lexicon: dissipare
  rationale: 사람들을 분산시키는 의미를 유지하되, 행위의 결과를 분명히 드러내는 한국어 표현을 택했습니다.
- source_word: Tyri et Sidonis
  english_pob_choice: Tyre and Sidon
  chosen_korean: 티레와 시돈
  alternatives_korean:
  - 두로와 시돈
  - 티로와 시돈
  lexicon: Tyri/Sidonis
  rationale: 고유명사는 현대 외래어 표기 관행을 따르되, 라틴어 격변화를 반영해 지명 자체는 그대로 보존했습니다.
theological_decisions:
- issue: 전쟁적 심판 진술의 직접성
  chosen_reading: 원문의 강한 심판 서술을 완화하지 않고 ‘멸망시켰고… 죽였습니다’로 직역했습니다.
  alternative_readings:
  - 파괴했습니다
  - 무찔렀습니다
  rationale: 이 구절은 하나님의 역사적 심판 행위를 서술하므로, 완곡한 표현보다 원문의 폭넓은 파괴·살육 의미를 유지하는 것이 적절합니다.
  doctrine_reference: 심판과 섭리에 대한 성경적 서술
