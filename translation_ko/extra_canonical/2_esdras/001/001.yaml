lexical_decisions:
- source_word: Liber Ezrae prophetae secundus
  english_pob_choice: The second book of Ezra the prophet
  chosen_korean: 예언자 에즈라의 둘째 책
  alternatives_korean:
  - 예언자 에즈라의 두 번째 책
  - 에즈라 예언자의 둘째 책
  lexicon: liber / secundus
  rationale: 라틴어 Liber Ezrae prophetae secundus는 책 제목 형식이므로 ‘둘째 책’으로 자연스럽게 옮기되, POB의 ‘second book’ 의미를 보존했습니다.
- source_word: filii Sarei, filii Azarei, filii Helchiae, filii Salame, filii Sadoch, filii Acitob
  english_pob_choice: son of Seraiah, son of Azariah, son of Hilkiah, son of Shallum, son of Zadok, son of Ahitub
  chosen_korean: 사라이아의 아들, 아사리아의 아들, 힐기야의 아들, 살룸의 아들, 사독의 아들, 아히둡의 아들
  alternatives_korean:
  - 스라야의 아들, 아사랴의 아들, 힐기야의 아들, 살룸의 아들, 사독의 아들, 아히둡의 아들
  lexicon: filius + proper names
  rationale: 계보는 본문의 반복 구조를 따라 ‘~의 아들’로 직역했고, 고유명사는 라틴 철자보다 한국어 성서 관용 표기를 우선해 표준 음역을 적용했습니다.
