  lexicon: filius + proper names
  rationale: 계보는 본문의 반복 구조를 따라 ‘~의 아들’로 직역했고, 고유명사는 라틴 철자보다 한국어 성서 관용 표기를 우선해 표준 음역을 적용했습니다.
