  yaml_path: translation/extra_canonical/2_esdras/001/021.yaml
  text: I covered you with the leaves of trees[a]. I divided fertile lands for you; I drove out the Canaanites and Perizzites and Philistines from before you. What shall I do for you? says the Lord.
  footnotes:
  - marker: a
    text: The Latin says, 'I divided fertile lands for you,' a compressed expression that may refer to apportioning the land among Israel's tribes.
    reason: lexical_alternative
    anchor_ref: '1:21'
translation:
  language: ko
  text: 나는 너희를 나무의 잎사귀로 덮어 주었습니다. 나는 너희를 위해 비옥한 땅을 나누어 주었고, 가나안 사람들과 브리스 사람들, 블레셋 사람들을 너희 앞에서 쫓아냈습니다. 내가 너희를 위하여 무엇을 하겠습니까? 주님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어의 terras pingues는 ‘비옥한 땅들’ 혹은 ‘기름진 땅들’로 옮길 수 있는 압축 표현이며, 이 맥락에서는 땅의 비옥함을 가리키는 것으로 이해했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: folia arborum uos texi
  english_pob_choice: I covered you with the leaves of trees.
  chosen_korean: 나는 너희를 나무의 잎사귀로 덮어 주었습니다.
  alternatives_korean:
  - 나는 너희를 나무의 잎으로 덮었습니다.
  - 나는 너희를 나무 잎사귀로 덮어 주었습니다.
  lexicon: texi / folia arborum
  rationale: texi는 단순한 ‘덮다’보다 보호·은혜의 행위를 드러내므로 ‘덮어 주었습니다’로 옮겼고, folia arborum은 직역하여 ‘나무의 잎사귀’로 살렸습니다.
- source_word: Diuisi uobis terras pingues
  english_pob_choice: I divided fertile lands for you.
  chosen_korean: 나는 너희를 위해 비옥한 땅을 나누어 주었고
  alternatives_korean:
  - 나는 너희에게 기름진 땅을 분배하였고
  - 나는 너희를 위해 풍성한 땅을 나누어 주었고
  lexicon: divisi / terras pingues
  rationale: terrae pingues의 ‘비옥한 땅’을 유지하고, divisi는 분배의 의미를 살려 ‘나누어 주었고’로 번역했습니다.
- source_word: Chananeos et Ferezeos et Philistinos a facie uestra proieci
  english_pob_choice: I drove out the Canaanites and Perizzites and Philistines from before you.
  chosen_korean: 가나안 사람들과 브리스 사람들, 블레셋 사람들을 너희 앞에서 쫓아냈습니다.
  alternatives_korean:
  - 가나안 사람들과 브리스 사람들, 블레셋 사람들을 너희 앞에서 몰아냈습니다.
  - 가나안 사람들과 브리스 사람들, 블레셋 사람들을 너희 앞에서 내쫓았습니다.
  lexicon: proieci / a facie uestra / Chananeos et Ferezeos et Philistinos
  rationale: proieci는 ‘내쫓다’보다 더 직접적인 추방을 뜻하므로 ‘쫓아냈습니다’로 옮겼고, a facie uestra는 ‘너희 앞에서’로 보존했습니다.
- source_word: quid faciam
  english_pob_choice: What shall I do for you?
  chosen_korean: 내가 너희를 위하여 무엇을 하겠습니까?
  alternatives_korean:
  - 내가 너희를 위해 무엇을 해야 하겠습니까?
  - 내가 너희를 위해 무엇을 하겠습니까?
  lexicon: quid faciam
  rationale: 원문의 간결한 질문을 그대로 살리면서도 한국어에서 자연스럽고 예의 있는 1인칭 미래/의지 질문으로 옮겼습니다.
theological_decisions:
- issue: 마지막 발화 주체와 문체
  chosen_reading: 주님께서 직접 말씀하시는 1인칭 회고와 질문으로 유지했습니다.
  alternative_readings:
  - 간접화법으로 완화하여 ‘주님이 말씀하셨습니다’로 처리
  - 질문을 설명적으로 풀어 ‘내가 너희를 위해 더 무엇을 하겠느냐’로 변환
  rationale: 라틴어 원문은 하나님의 직접 발화를 유지하므로, 회중이 하나님의 구원 행위를 생생하게 듣도록 직접화법을 보존했습니다.
  doctrine_reference: source fidelity / divine speech
