  yaml_path: translation/extra_canonical/2_esdras/001/010.yaml
  text: For their sake I overthrew many kings; I struck Pharaoh with his servants and all his army.
translation:
  language: ko
  text: 그들을 위하여 내가 많은 왕들을 전복하였고, 파라오와 그의 종들과 그의 모든 군대를 쳤습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter eos
  english_pob_choice: For their sake
  chosen_korean: 그들 때문에
  alternatives_korean:
  - 그들을 위해
  - 그들로 말미암아
  lexicon: propter
  rationale: 원인은 ‘그들’에게 있고 결과가 이어진다는 인과를 살리기 위해 ‘때문에’로 옮겼습니다. ‘위해’는 목적 뉘앙스가 강해 원문보다 약해질 수 있습니다.
- source_word: subuerti
  english_pob_choice: I overthrew
  chosen_korean: 전복하였고
  alternatives_korean:
  - 뒤엎었고
  - 무너뜨렸고
  lexicon: subverto
  rationale: 정권과 권세를 무너뜨리는 강한 파괴를 보여 주므로 단순한 ‘쓰러뜨리다’보다 ‘전복하다’가 가장 가깝습니다.
- source_word: pueris suis
  english_pob_choice: with his servants
  chosen_korean: 그의 신하들과
  alternatives_korean:
  - 그의 종들과
  - 그의 시종들과
  lexicon: puer
  rationale: 문맥상 파라오의 궁정 소속 인물들을 가리키므로, 한국어에서는 위계적·궁정적 뉘앙스가 있는 ‘신하들’이 가장 자연스럽습니다.
- source_word: omnem exercitum eius
  english_pob_choice: all his army
  chosen_korean: 그의 모든 군대를
  alternatives_korean:
  - 그의 모든 군사들을
  - 그의 전군을
  lexicon: exercitus
  rationale: 군사 집합 전체를 가리키는 표현이므로 ‘군대’로 옮겼고, ‘모든’으로 전멸의 범위를 분명히 했습니다.
theological_decisions:
- issue: 하나님이 왕들과 파라오를 치신다는 직설적 전쟁/심판 언어를 얼마나 강하게 유지할지
  chosen_reading: 원문의 심판 행위를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - ~을 벌하셨습니다
  - ~을 꺾으셨습니다
  rationale: 이 절은 구원의 역사 안에서 하나님의 능동적 심판을 증언하므로, 완곡하게 약화하지 않고 ‘전복하다/치다’의 강한 동사를 유지하는 것이 원문 의도에 더 충실합니다.
  doctrine_reference: divine judgment and deliverance
