source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus omnipotens : nonne ego uos rogaui ut pater filios et ut mater filias et nutrix paruulos suos,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/028.yaml
  text: 'Thus says the Lord Almighty: Have I not entreated you[a], as a father his sons, and as a mother her daughters, and a nurse her little children,'
  footnotes:
  - marker: a
    text: Or 'Have I not asked you, as a father asks his sons'.
    reason: previous_rendering
translation:
  language: ko
  text: 만군의 주께서 이렇게 말씀하십니다. 내가 너희에게, 아버지가 자기 아들들에게, 어머니가 자기 딸들에게, 그리고 유모가 자기 어린아이들에게 하듯이, 너희에게 간절히 권하지 않았느냐?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 rogaui는 단순한 ‘물었다’보다 ‘간청하다/간절히 권하다’의 뜻을 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: dominus omnipotens
  english_pob_choice: the Lord Almighty
  chosen_korean: 만군의 주
  alternatives_korean:
  - 전능하신 주
  - 주 하나님
  lexicon: κύριος/Adonai-equivalent formula
  rationale: 라틴어의 ‘주’와 전능성 표현을 함께 살리면서도 한국어 성서어법에서 자연스러운 호칭으로 옮겼습니다.
- source_word: rogaui
  english_pob_choice: Have I not entreated you
  chosen_korean: 간절히 권하지 않았느냐
  alternatives_korean:
  - 간청하지 않았느냐
  - 간절히 요청하지 않았느냐
  lexicon: rogo
  rationale: 단순한 ‘묻다’보다 강한 탄원·간청의 뉘앙스를 살려, 본문의 애절한 호소를 드러냈습니다.
- source_word: ut pater filios et ut mater filias et nutrix paruulos suos
  english_pob_choice: as a father his sons, and as a mother her daughters, and a nurse her little children
  chosen_korean: 아버지가 자기 아들들에게, 어머니가 자기 딸들에게, 그리고 유모가 자기 어린아이들에게 하듯이
  alternatives_korean:
  - 아버지가 아들들을 대하듯이, 어머니가 딸들을 대하듯이, 그리고 유모가 자기 어린아이들을 대하듯이
  - 아버지처럼 아들들에게, 어머니처럼 딸들에게, 유모처럼 어린아이들에게
  lexicon: ut + comparison; filios/filias; nutrix + paruulos
  rationale: 비교구문을 한국어의 ‘하듯이’로 자연스럽게 살렸고, ‘paruulos’는 연약한 ‘어린아이들’로 옮겨 보호적 정서를 유지했습니다.
theological_decisions:
- issue: 하나님의 호소를 질문형으로 유지할지, 서정적 선언형으로 완화할지
  chosen_reading: 수사적 질문을 유지하여 하나님이 자기 백성에게 애타게 호소하시는 정서를 살렸습니다.
  alternative_readings:
  - 진술형으로 바꾸어 ‘내가 너희에게 간절히 권했다’로 처리
  - 더 부드러운 요청형으로 완화
  rationale: 라틴어 ‘nonne’가 기대 답변을 전제하는 수사적 질문이므로, 문장 형식을 유지해야 본문의 책망과 탄원의 긴장이 보존됩니다.
  doctrine_reference: 신적 호소의 수사학
