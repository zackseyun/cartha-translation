  chosen_korean: 그들에게 말하여 이렇게 전하십시오
  alternatives_korean:
  - 그들에게 말하며 이렇게 이르십시오
  - 그들에게 말하여 이르기를
  - 그들에게 말하십시오
  lexicon: loquere / dicens
  rationale: 명령형과 인용 도입을 자연스러운 현대 한국어로 풀어, 예언적 전달 명령의 연속성을 보존했습니다.
- source_word: haec dicit dominus
  english_pob_choice: Thus says the Lord
  chosen_korean: 주께서 이렇게 말씀하십니다
  alternatives_korean:
  - 주께서 말씀하시기를
  - 주님이 이렇게 말씀하십니다
  - 야훼께서 이렇게 말씀하십니다
  lexicon: haec dicit dominus
  rationale: 예언 공식은 한국어 성경 관용을 따르되, 원문의 직접 화법 기능을 유지하도록 현재형으로 옮겼습니다.
theological_decisions:
- issue: 예언 공식의 문체와 인용부호 처리
  chosen_reading: 인용문 안에 다시 ‘주께서 이렇게 말씀하십니다’라는 예언 공식을 두어, 화자 전환을 분명히 했습니다.
  alternative_readings:
  - 예언 공식을 따옴표 밖에 두는 방식
  - ‘주께서 말씀하십니다’로 축약하는 방식
  rationale: 원문은 명령과 예언 공식을 한 절 안에 중첩시키므로, 한국어에서도 계시 전달의 구조를 보이게 하는 편이 더 충실합니다.
  doctrine_reference: 예언 전달 공식의 서술 기능
