  lexicon: uero = adversative/emphatic transitional particle
  rationale: 라틴어 uero는 결론표현이 아니라 대조·전환을 나타내므로 ‘그러나’로 옮기고, 직접 지시의 초점인 ‘당신은’을 살렸습니다.
- source_word: loquere ad eos dicens
