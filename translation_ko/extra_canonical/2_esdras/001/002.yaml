  terminology: 비느하스, 엘리, 아마랴, 아시야, 웃시야, 아비수아, 엘르아살은 적절합니다. ‘메라욧’은 표준 성경 인명형 ‘므라욧’으로, ‘보리세’는 원문의 Borith를 반영한 ‘보릿’으로 고쳐야 합니다. Abissei 관련 각주는 해당 이름인 아비수아에 직접 붙어야 합니다.
