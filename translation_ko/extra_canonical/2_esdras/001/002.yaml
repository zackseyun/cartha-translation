  source_fidelity: 라틴어 족보의 각 반복 연결어(filii)는 충실히 반영되어 있습니다. 그러나 Meraioth는 통용 성경 인명형으로는 ‘므라욧’이 적절하며, Borith를 ‘보리세’로 옮긴 것은 라틴어 형태와 영어 POB의 Borith에 부합하지 않습니다. Abissei는 본문상 아비수아로 채택할 수 있으나, 이 판정의 이문 가능성은 각주에서 보존하는 것이 좋습니다.
