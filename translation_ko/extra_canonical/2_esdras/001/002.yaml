lexical_decisions:
- source_word: Filii Achiae
  english_pob_choice: son of Ahijah
  chosen_korean: 아히야의 아들
  alternatives_korean:
  - 아야의 아들
  - 아히야의 자손
  lexicon: 고유명사 음역
  rationale: 라틴어 Achiae를 영어 POB의 Ahijah에 맞추어 표준적인 성경 인명 음역으로 옮겼습니다.
- source_word: Finees / Finees
  english_pob_choice: Phinehas
  chosen_korean: 비느하스
  alternatives_korean:
  - 핀하스
  - 피느하스
  lexicon: 고유명사 음역
  rationale: 성경에서 널리 확립된 한국어 인명형을 사용해 반복되는 족보 구조를 자연스럽게 유지했습니다.
- source_word: Aziei
  english_pob_choice: Aziah
  chosen_korean: 아시야
  alternatives_korean:
  - 아지야
  - 아사랴
  lexicon: 고유명사 음역
  rationale: 라틴어 Oziae와 구별되는 별도 이름이므로 영어 POB의 Aziah에 맞추어 음역했습니다.
- source_word: Oziae
  english_pob_choice: Uzziah
  chosen_korean: 웃시야
  alternatives_korean:
  - 우찌야
  - 우사
  lexicon: 고유명사 음역
  rationale: 라틴어 Oziae는 영어 POB의 Uzziah에 해당하므로, 기존 성경 번역에서 통용되는 웃시야로 옮겼습니다.
- source_word: Abissei
  english_pob_choice: Abishua
  chosen_korean: 아비수아
  alternatives_korean:
  - 아비새
  - 아비사이
  lexicon: 고유명사 음역
  rationale: 편집 판단상 Abissei는 Abishua를 가리키므로, POB의 최종 채택형과 같은 전통적 족보 인명형인 아비수아를 사용했습니다.
theological_decisions:
- issue: 반복되는 족보 연결어의 처리
  chosen_reading: 각 이름 뒤에 「의 아들」을 반복하여 족보의 연쇄를 그대로 드러냈습니다.
  alternative_readings:
  - 「…의 후손」으로 요약
  - 쉼표만으로 연결
  rationale: 원문은 나열적 족보 구조를 통해 혈통 연속성을 강조하므로, 이를 축약하지 않고 그대로 재현하는 것이 의미 보존에 가장 충실합니다.
  doctrine_reference: 족보/계보의 문학적 기능 보존
