revisions:
- from: 그러므로 당신은 머리카락을 털어 버리고 모든 악을 그들 위에 던지십시오. 그들이 내 율법에 순종하지 않았기 때문입니다. 그들은 버릇없고 훈련되지 않은 백성입니다.[a]
  to: 그러나 당신은 머리털을 털어 내고 모든 악을 그들 위에 던지십시오. 그들이 내 율법에 순종하지 않았기 때문입니다. 그들은 규율 없는 백성입니다.[a]
  rationale: 대조 접속사 *autem*을 ‘그러나’로 바로잡고, *indisciplinatus*의 핵심인 규율·훈육의 결핍을 ‘규율 없는’으로 간결하게 옮겼습니다. ‘내 율법’과 ‘모든 악’은 원문과 영어 POB의 의미를 유지했습니다. 기존 대안 번역 각주는 앵커를 보존하되 본문과 구별했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:03Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어 *Tu autem*은 앞 절과의 대조를 나타내므로 ‘그러므로’보다 ‘그러나’가 정확합니다. *indisciplinatus*는 ‘반역하는’보다 규율·훈육의 결핍을 가리키므로, ‘버릇없고 훈련되지 않은’이라는 중복적 이중 표현 대신 ‘규율 없는’으로 옮기는 것이 원문의 어휘적 초점을 보존합니다.
  naturalness: ‘머리털을 털어 내고’, ‘모든 악을 그들 위에 던지십시오’, ‘규율 없는 백성입니다’는 현대 표준 한국어의 합쇼체 문체에서 자연스럽습니다. ‘버릇없고’는 다소 구어적이고 평가적이며 원문의 단일 술어를 불필요하게 확대합니다.
  terminology: ‘내 율법’은 *legi meae*의 언약적·규범적 의미를 적절히 보존합니다. *populus ... indisciplinatus*는 ‘규율 없는 백성’으로 번역하여 불순종의 사실과 규율 부재라는 묘사를 구별합니다. 각주에 남은 ‘반역하는’은 대안 번역으로만 처리하며 본문의 어휘적 의미를 대체하지 않습니다.
  issues:
  - severity: medium
    issue: ‘그러므로’가 *autem*의 대조 기능을 인과·결론 관계로 바꿉니다.
    rationale: '*Tu autem*은 직역하면 ‘그러나 너는/당신은’이며, 앞선 내용에 대비되는 명령을 도입합니다.'
  - severity: medium
    issue: ‘버릇없고 훈련되지 않은’은 *indisciplinatus*를 두 개의 한국어 평가어로 확대합니다.
    rationale: ‘버릇없다’는 구어적 예절 문제를 강하게 암시하고, 접속된 이중 표현은 원문의 단일 묘사를 과잉 해설합니다. ‘규율 없는’이 법에 불순종했다는 바로 앞 절과의 연결도 더 잘 드러냅니다.
  revised_text: 그러나 당신은 머리털을 털어 내고 모든 악을 그들 위에 던지십시오. 그들이 내 율법에 순종하지 않았기 때문입니다. 그들은 규율 없는 백성입니다.[a]
