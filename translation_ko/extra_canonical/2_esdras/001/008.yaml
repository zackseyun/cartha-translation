id: 2ES.1.8
reference: 2 Esdras 1:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu autem excute comam capitis tui et proice omnia mala super illos, quoniam non obaudierunt legi meae; populus autem indisciplinatus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/008.yaml
  text: But you[a], shake out the hair of your head and cast all evils upon them, because they have not obeyed my law; they are an undisciplined people.
  footnotes:
  - marker: a
    text: Or 'they are a rebellious people.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신은 머리털을 털어 내고 모든 악을 그들 위에 던지십시오. 그들이 내 율법에 순종하지 않았기 때문입니다. 그들은 규율 없는 백성입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 반역하는 백성입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: Tu autem
  english_pob_choice: But you
  chosen_korean: 그러므로 당신은
  alternatives_korean:
  - 하지만 당신은
  - 그렇지만 당신은
  lexicon: source-syntax
  rationale: 라틴어의 대조 접속을 단순한 반전으로만 두지 않고 앞선 책망 명령의 흐름을 이어 주는 전환으로 옮겼습니다. 직접 호칭의 존중을 살리기 위해 '당신'을 사용했습니다.
- source_word: excute comam capitis tui
  english_pob_choice: shake out the hair of your head
  chosen_korean: 머리카락을 털어 버리고
  alternatives_korean:
  - 머리털을 털어 내고
  - 머리의 털을 털어 버리고
  lexicon: source-syntax
  rationale: 머리의 머리카락을 '털어 버리다'로 옮겨 강한 상징적 행위를 자연스러운 현대 한국어로 살렸습니다. 과도하게 의례화하지 않고 동작의 격렬함을 유지했습니다.
- source_word: legi meae
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 법
  - 내 가르침
  lexicon: νόμος
  rationale: 여기서는 라틴어 lex/로마서적 '법'이 아니라 하나님의 규범적 계시를 가리키는 '율법'이 가장 직접적입니다. POB의 기본 용례도 유지했습니다.
- source_word: populus autem indisciplinatus
  english_pob_choice: they are an undisciplined people
  chosen_korean: 그들은 버릇없고 훈련되지 않은 백성입니다
  alternatives_korean:
  - 그들은 무질서한 백성입니다
  - 그들은 훈련받지 못한 백성입니다
  lexicon: indisciplinatus
  rationale: applied_revision이 지적하듯 *indisciplinatus*는 '반역하는'보다 '훈련/규율이 없는, 미숙한' 쪽이 핵심입니다. 그래서 도덕적 난동보다 교육적·규율적 결핍을 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: '''my law''의 신학적 뉘앙스'
  chosen_reading: 하나님이 주신 규범을 가리키는 '내 율법'으로 유지했습니다.
  alternative_readings:
  - 내 법
  - 내 가르침
  rationale: 문맥상 단순한 행정 규정이 아니라 언약적 순종의 기준이므로 '율법'이 소스의 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 언약 순종 / 토라에 대한 불순종
- issue: '''undisciplined''와 ''rebellious''의 차이'
  chosen_reading: '''버릇없고 훈련되지 않은''으로 옮겨 반역보다 무규율성을 드러냈습니다.'
  alternative_readings:
  - 반역하는
  - 패역한
  rationale: 라틴어 *indisciplinatus*는 반항의 정치적 뉘앙스보다 훈련 부재, 규범 결핍을 가리키므로 이 차이를 지켜야 합니다.
  doctrine_reference: 문자적 의미 우선 / 어휘 구별
