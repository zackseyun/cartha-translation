id: 2ES.1.37
reference: 2 Esdras 1:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populi uenientis gratiam, cuius paruuli exultant cum laetitia, me non uidentes oculis carnalibus, sed spiritu credent quae dixi. Et nunc, pater, aspice cum gloria et uide populum uenientem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/037.yaml
  text: the favor of the people that is coming[a], whose little ones rejoice with gladness, not seeing me with bodily eyes, but in spirit believing what I have said. And now, Father, look with glory and see the people that is coming
  footnotes:
  - marker: a
    text: Or 'I call to witness the favor'.
    reason: previous_rendering
translation:
  language: ko
  text: 다가오는 백성의 은혜를[a]. 그 어린아이들은 기쁨으로 환호합니다. 그들은 육신의 눈으로 저를 보지 못하면서도, 영으로는 제가 말한 것을 믿을 것입니다. 이제, 아버지, 영광 가운데서 바라보시고 다가오는 백성을 보소서.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다가오는 백성의 은혜를 증언한다.”
    reason: 제공된 라틴어 본문은 “다가오는 백성의 은혜를”이라는 대격구로 시작하며 이를 지배하는 동사가 보이지 않습니다. 이전 번역 전통에 따른 동사 보충 가능성을 대안으로 제시합니다.
lexical_decisions:
- source_word: gratiam
  english_pob_choice: the favor
  chosen_korean: 은혜
  alternatives_korean:
  - 호의
  - 은총
  - 총애
  lexicon: gratia
  rationale: 라틴어 gratia는 문맥상 ‘호의/은혜’를 뜻하며, POB의 영어 ‘favor’에 대응해 한국어에서는 신학적·문체적으로 가장 자연스러운 ‘은혜’를 택했습니다.
- source_word: populi uenientis
  english_pob_choice: the people that is coming
  chosen_korean: 다가오는 백성
  alternatives_korean:
  - 오는 백성
  - 오고 있는 백성
  - 다가올 백성
  lexicon: populus + veniens
  rationale: 현재 분사 uenientis의 진행·임박성을 살려 ‘다가오는’으로 옮겼고, 단수형을 집합명사처럼 처리한 라틴어 용법을 한국어에서도 ‘백성’으로 반영했습니다.
- source_word: paruuli exultant cum laetitia
  english_pob_choice: whose little ones rejoice with gladness
  chosen_korean: 그 작은 자들은 기쁨으로 즐거워합니다
  alternatives_korean:
  - 그 어린이들은 환희로 기뻐합니다
  - 그 작은 이들은 기쁨 가운데 춤춥니다
  lexicon: paruuli + exultant cum laetitia
  rationale: paruuli는 단순한 연령어보다 ‘작은 자들/어린 자들’의 뉘앙스가 있어 ‘작은 자들’로 넓게 잡았고, exultant cum laetitia는 중복을 줄이면서도 감정의 강도를 살린 ‘기쁨으로 즐거워합니다’로 옮겼습니다.
- source_word: me non uidentes oculis carnalibus, sed spiritu credent quae dixi
  english_pob_choice: not seeing me with bodily eyes, but in spirit believing what I have said
  chosen_korean: 그들은 육신의 눈으로는 저를 보지 못하지만, 영으로는 제가 한 말을 믿습니다
  alternatives_korean:
  - 육체의 눈으로는 저를 보지 않고, 영으로 믿습니다
  - 육의 눈으로는 저를 보지 못하나 영으로 믿을 것입니다
  lexicon: oculis carnalibus / spiritu credent
  rationale: oculis carnalibus은 직역하면 ‘육체적 눈’이므로 한국어 성서어법에 맞는 ‘육신의 눈’으로 처리했고, credent은 미래형이지만 문맥의 확언적 진술을 살려 현재 서술형으로 자연화했습니다.
theological_decisions:
- issue: 아버지 호칭과 직접 기도체 처리
  chosen_reading: ‘아버지’는 그대로 두고, 청유적 요청인 ‘바라보시고 … 보소서’로 예배적 직접화법을 유지했습니다.
  alternative_readings:
  - ‘아버지, 영광 가운데 보시고 …’
  - ‘아버지여, 영광으로 보시고 …’
  rationale: 본문의 호소문은 하나님께 직접 말하는 기도/호칭 구조이므로, 현대 합쇼체 안에서 예배적 존대를 유지하는 방식이 가장 소스 충실적입니다.
  doctrine_reference: prayer register / direct divine address
- issue: 영(spiritu) 번역
  chosen_reading: spiritu는 ‘영’으로 옮겨 인간의 내적 인식 차원을 살렸습니다.
  alternative_readings:
  - 성령으로
  - 마음으로
  rationale: 여기서는 분명한 성령 호칭이 아니라 인식의 방식과 관련된 대조이므로, 교리적으로 과잉 특정하지 않고 ‘영’으로 두는 편이 문맥에 맞습니다.
  doctrine_reference: πνεῦμα semantic range
