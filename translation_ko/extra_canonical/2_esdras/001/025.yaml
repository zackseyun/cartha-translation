id: 2ES.1.25
reference: 2 Esdras 1:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam me dereliquistis, et ego uos derelinquam: petentibus uobis a me misericordiam, non miserebor uestri.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/025.yaml
  text: Because you have forsaken me, I also will forsake you. When you ask me for mercy, I will not have mercy on you.
translation:
  language: ko
  text: 너희가 나를 버렸으므로, 나도 너희를 버리겠습니다. 너희가 나에게 자비를 구할 때에도, 나는 너희에게 자비를 베풀지 않겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: me dereliquistis / derelinquam
  english_pob_choice: forsaken / forsake
  chosen_korean: 버렸으므로 / 버리겠습니다
  alternatives_korean:
  - 떠났으므로 / 떠나겠습니다
  - 버려두셨으므로 / 버려두겠습니다
  lexicon: derelinquō
  rationale: 원문은 단순한 이탈이 아니라 관계를 끊는 ‘버리다’의 대응이 가장 직접적이며, 영어 POB의 forsaken/forsake와도 잘 맞습니다.
- source_word: misericordiam
  english_pob_choice: mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜
  lexicon: misericordia
  rationale: 라틴어 misericordia는 여기서 ‘불쌍히 여겨 베푸는 자비’의 뜻이므로, 현대 한국어에서 가장 자연스럽고 직선적인 ‘자비’로 옮겼습니다.
- source_word: non miserebor uestri
  english_pob_choice: I will not have mercy on you
  chosen_korean: 나는 너희에게 자비를 베풀지 않겠습니다
  alternatives_korean:
  - 나는 너희를 불쌍히 여기지 않겠습니다
  - 나는 너희에게 긍휼을 베풀지 않겠습니다
  lexicon: misereor
  rationale: 동사의 반복을 살리면서도, 한국어에서 ‘자비를 베풀다’가 가장 성경적이면서도 현대적인 대응이어서 선택했습니다.
theological_decisions:
- issue: 보응의 대칭 구조
  chosen_reading: 하나님이 먼저 버리신 뒤, 회개 없는 청원에도 자비를 거절하시는 상응적 심판으로 읽었습니다.
  alternative_readings:
  - 단순한 감정적 분노 표현
  - 일시적 거절로 완화하는 읽기
  rationale: 원문은 조건절과 결과절이 분명하게 대응하므로, 심판의 대칭성과 단호함을 약화하지 않고 드러내는 것이 본문 의미에 더 가깝습니다.
  doctrine_reference: 언약적 심판과 신적 보응
