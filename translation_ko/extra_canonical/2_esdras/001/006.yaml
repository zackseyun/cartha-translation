  to: 이는 그들의 조상들이 지은 죄가 그들 안에서 커졌기 때문입니다. 그들이 나를 잊고 이방 신들에게 제사를 바쳤기 때문입니다.
  rationale: 원문의 quia와 enim이 나타내는 인과적 설명을 한국어 문장 구조에 반영했습니다. ‘조상들이 지은 죄’로 자연스럽게 다듬되, 조상들의 죄가 후대 ‘그들 안에서’ 커졌다는 표현을 유지했습니다. 교리적으로 세대 간 죄책의 전가 여부를 확정하지 않고, 본문의 누적·증대 표현만 보존했습니다.
