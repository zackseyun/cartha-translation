source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quia peccata parentum illorum in illis creuerunt: obliti enim me sacrificauerunt diis alienis.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/006.yaml
  text: For the sins of their fathers have increased in them; for they forgot me and sacrificed to foreign gods.
translation:
  language: ko
  text: 이는 그들의 조상들이 지은 죄가 그들 안에서 커졌기 때문입니다. 그들이 나를 잊고 이방 신들에게 제사를 바쳤기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: peccata parentum illorum
  english_pob_choice: the sins of their fathers
  chosen_korean: 그들의 조상들의 죄
  alternatives_korean:
  - 그 아버지들의 죄
  - 그 선조들의 죄
  lexicon: peccata / parentes
  rationale: parentum illorum은 직역상 ‘그들의 아버지들/조상들’로, POB의 “fathers”를 따라 세대적 책임을 드러내는 ‘조상들’로 옮겼습니다.
- source_word: in illis creuerunt
  english_pob_choice: have increased in them
  chosen_korean: 그들 안에서 더욱 커졌습니다
  alternatives_korean:
  - 그들 안에서 자라났습니다
  - 그들 가운데 증가했습니다
  lexicon: creuerunt
  rationale: creuerunt는 단순한 수적 증가보다 안에서 자라나고 번진 뉘앙스가 있어 ‘더욱 커졌습니다’로 자연스럽게 살렸습니다.
- source_word: obliti enim me
  english_pob_choice: for they forgot me
  chosen_korean: 그들은 저를 잊고
  alternatives_korean:
  - 그들이 나를 잊었기 때문에
  - 그들이 저를 잊어버렸기 때문에
  lexicon: obliti / me
  rationale: obliti는 ‘잊다’의 완료된 상태를 나타내므로, 원인절을 자연스럽게 연결해 ‘잊고’로 처리했습니다.
- source_word: sacrificauerunt diis alienis
  english_pob_choice: sacrificed to foreign gods
  chosen_korean: 이방 신들에게 제사드렸기 때문입니다
  alternatives_korean:
  - 낯선 신들에게 제사를 드렸기 때문입니다
  - 외국의 신들에게 제사했습니다
  lexicon: sacrificauerunt / diis alienis
  rationale: diis alienis은 단순히 ‘외국’보다 언약 밖의 다른 신들을 가리키는 표현이므로, 성경적 관용에 맞는 ‘이방 신들’로 옮겼습니다.
theological_decisions:
- issue: 조상들의 죄와 후대의 책임 연결
  chosen_reading: 조상들의 죄가 그들 안에서 더욱 커졌습니다
  alternative_readings:
  - 조상들의 죄가 그들 가운데서 증가했습니다
  - 조상들의 죄가 그들 안에서 자라났습니다
  rationale: 라틴어는 조상의 죄가 후대 안에서 증폭되는 누적성을 말하므로, 단순한 법정적 전가보다 역사적·영적 악화의 흐름을 드러내는 번역을 택했습니다.
  doctrine_reference: 세대적 죄의 누적성과 언약적 불순종
