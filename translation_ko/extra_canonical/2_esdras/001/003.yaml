translation:
  language: ko
  text: 아론의 아들들로서 레위 지파에 속한 이들이며, 메대 지역에서 아르타크세르크세스 왕의 통치 아래 포로였던 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘포로로 잡혀 있었다’.
    reason: previous_rendering
lexical_decisions:
- source_word: Filii Aaron
  english_pob_choice: sons of Aaron
  chosen_korean: 아론의 아들들
  alternatives_korean:
  - 아론의 자손들
  - 아론의 아들들
  lexicon: 아론
  rationale: 라틴어 복수형 Filii를 따라 단수화하지 않고, 혈통 소속을 드러내는 직역형인 ‘아론의 아들들’을 유지했습니다.
- source_word: ex tribu Leui
  english_pob_choice: of the tribe of Levi
  chosen_korean: 레위 지파에 속한
  alternatives_korean:
  - 레위 지파의
  - 레위 지파에 속한
  lexicon: 레위 지파
  rationale: 소속 관계를 자연스럽게 나타내면서도 원문의 계통 표지를 보존하기 위해 ‘속한’을 택했습니다.
- source_word: captiuus
  english_pob_choice: were captives
  chosen_korean: 포로였던
  alternatives_korean:
  - 포로로 잡혀 있던
  - 포로였던
  - 사로잡혀 있던
  lexicon: 포로
  rationale: applied revision에 따라 상태를 나타내는 서술적 의미를 반영해, ‘잡혀졌다’보다 ‘포로였던’이 라틴어의 captiuus + fuit 구조를 더 잘 살립니다.
- source_word: in regione Medorum
  english_pob_choice: in the region of the Medes
  chosen_korean: 메대 지역에서
  alternatives_korean:
  - 메대인의 지역에서
  - 메대 지방에서
  - 메대 지역에서
  lexicon: 메대
  rationale: Medes를 한국어 성경 관용에 맞게 ‘메대’로 옮기고, ‘region’은 과도한 해석 없이 ‘지역’으로 처리했습니다.
- source_word: in regno Artaxersis regis Persarum
  english_pob_choice: in the reign of Artaxerxes king of the Persians
  chosen_korean: 아르타크세르크세스 왕의 통치 아래
  alternatives_korean:
  - 페르시아 왕 아르타크세르크세스의 치세에
  - 아르타크세르크세스 왕의 통치 아래
  lexicon: 아르타크세르크세스
  rationale: regno를 단순한 연대 표시로 풀어 ‘통치 아래’로 옮겨 왕권의 지배 상황을 드러냈습니다.
