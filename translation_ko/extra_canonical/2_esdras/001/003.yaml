revisions:
- from: 아론의 아들들로서 레위 지파에 속한 이들이며, 메대 지역에서 아르타크세르크세스 왕의 통치 아래 포로였던 사람들입니다.[a]
  to: 아론의 아들들, 곧 레위 지파에 속한 이들로서, 페르시아 왕 아닥사스다의 통치 때 메대 지역에서 포로였던 사람들입니다.[a]
  rationale: 원문의 복수 Filii Aaron과 영어 POB의 복수 처리를 따라 ‘아들들’과 ‘사람들’을 유지했습니다. 포로 상태를 뜻하는 captiuus를 ‘포로였던’으로 옮기고, 빠졌던 regis Persarum를 ‘페르시아 왕’으로 보완했습니다. ‘통치 때’는 in regno의 시간적 의미를 과도한 해석 없이 반영합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:21Z'
review_pass:
  verdict: revise
  source_fidelity: ‘페르시아의 왕’이라는 regis Persarum의 수식이 현 번역에서 빠져 있습니다. 또한 in regno는 왕의 통치 기간을 나타내므로 ‘통치 때’가 더 직접적입니다. captiuus는 포로 상태를 뜻하므로 ‘포로였던’은 적절합니다.
  naturalness: 현 문장은 ‘...이들이며’와 ‘...사람들입니다’가 겹쳐 다소 부자연스럽습니다. 동격을 사용하여 간결한 합쇼체 문장으로 다듬는 것이 좋습니다.
  terminology: 성경 한국어의 통용 표기에 따라 Artaxerxes는 ‘아닥사스다’로 옮겼습니다. ‘메대’, ‘레위 지파’, ‘아론의 아들들’은 유지할 수 있습니다.
  issues:
  - severity: high
    issue: ‘페르시아의 왕’이 누락됨
    rationale: 라틴어 regis Persarum는 Artaxerxes를 ‘페르시아인의 왕’으로 규정하며, 초안의 ‘아르타크세르크세스 왕’에는 이 정보가 반영되지 않았습니다.
  - severity: medium
    issue: 문장 연결이 부자연스러움
    rationale: ‘아론의 아들들로서 ... 이들이며 ... 사람들이습니다’는 동일 대상을 중복 지시합니다.
  - severity: low
    issue: 왕명 표기
    rationale: 표준 한국어 성경의 고유명사 관례에 맞추어 ‘아닥사스다’를 사용하는 편이 독자 친화적입니다.
  revised_text: 아론의 아들들, 곧 레위 지파에 속한 이들로서, 페르시아 왕 아닥사스다의 통치 때 메대 지역에서 포로였던 사람들입니다.[a]
