  source_fidelity: 초안의 첫 문장은 *Vsquequo eos sustinebo?*를 충실하고 자연스럽게 옮겼습니다. 그러나 둘째 문장 ‘내가 그렇게 큰 은혜를 베푼 자들이기 때문입니다’는 라틴어 관계절 *quibus tanta beneficia contuli*를 이유를 나타내는 독립문으로 바꾸어, 원문의 ‘그들에게’라는 수식 관계와 한 문장짜리 수사 의문문의 구조를 훼손합니다.
  naturalness: ‘내가 그토록 큰 은혜를 베푼 그들을 언제까지 참아야 하겠습니까?’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 책망 섞인 수사 의문을 유지합니다.
  terminology: '*sustinebo*는 ‘참아야 하겠습니까’로 적절합니다. *beneficia*는 이 문맥에서 하나님이 베푸신 호의/은혜를 가리키므로 ‘큰 은혜’가 자연스럽습니다. 복수형은 한국어에서 집합적으로 처리해도 의미 손실이 없습니다.'
  issues:
  - severity: high
    issue: 관계절이 인과를 나타내는 독립문으로 변경됨
    rationale: '*quibus*는 ‘내가 그토록 큰 은혜를 베푼 그들에게/그들을’이라는 관계절을 이루며, ‘왜냐하면 … 때문입니다’라는 인과 접속을 뜻하지 않습니다. 또한 원문 전체는 하나의 의문문입니다.'
