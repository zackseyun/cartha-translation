  text: How long shall I endure them, to whom I have given such great benefits?
translation:
  language: ko
  text: 내가 그토록 큰 은혜를 베푼 그들을 언제까지 참아야 하겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vsquequo eos sustinebo
  english_pob_choice: How long shall I endure them
  chosen_korean: 내가 그들을 언제까지 참아야 하겠습니까?
  alternatives_korean:
  - 내가 그들을 언제까지 견뎌야 하겠습니까?
  - 언제까지 내가 그들을 참아야 하겠습니까?
  lexicon: sustinebo = 참다/견디다
  rationale: 라틴어 sustinebo의 ‘참다, 견디다’ 의미를 살려, 원문의 인내 한계를 묻는 표현을 자연스러운 현대 합쇼체로 옮겼습니다.
- source_word: beneficia
  english_pob_choice: great benefits
  chosen_korean: 큰 은혜
  alternatives_korean:
  - 큰 호의
  - 큰 선행
  - 큰 은혜들
  lexicon: beneficium = 은혜, 호의, 혜택
  rationale: beneficia는 단순한 이익보다 베푼 호의와 은총의 성격이 강하므로, 한국어에서는 ‘은혜’가 원문의 관계적·은사적 뉘앙스를 가장 잘 살립니다.
- source_word: tanta
  english_pob_choice: such great
  chosen_korean: 그렇게 큰
  alternatives_korean:
  - 이처럼 큰
  - 그토록 큰
  - 막대한
  lexicon: tantus = 그렇게 큰, 이토록 큰
  rationale: tanta의 강조를 살리되 과장되지 않게 ‘그렇게 큰’으로 옮겨, 앞절의 불평조와 호응하도록 했습니다.
theological_decisions:
- issue: 하나님이 베푼 은혜에 대한 인간의 반응을 ‘참아야 하겠습니까?’로 옮길지 여부
  chosen_reading: 직설적인 불평과 인내의 한계를 묻는 문장으로 옮겼습니다.
  alternative_readings:
  - 내가 그들을 언제까지 받아들여야 하겠습니까?
  - 내가 그들을 언제까지 견뎌야 하겠습니까?
  rationale: 문맥상 화자의 감정은 단순 수용보다 인내의 한계를 묻는 탄식에 가깝기 때문에, source의 수사적 긴장감을 보존하는 번역이 적절합니다.
  doctrine_reference: 문학적-수사적 장치 보존
