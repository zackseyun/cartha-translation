id: 2ES.1.17
reference: 2 Esdras 1:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc usque murmuratis. Vbi sunt beneficia quae praestiti uobis? nonne in deserto cum esuriretis et sitiretis proclamastis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/017.yaml
  text: Until now you have kept murmuring. Where are the benefits that I bestowed on you? Did you not cry out in the wilderness when you were hungry and thirsty,
translation:
  language: ko
  text: 지금까지 너희는 계속 투덜거렸습니다. 내가 너희에게 베푼 은혜들이 어디 있습니까? 너희가 광야에서 배고프고 목마를 때 부르짖지 않았습니까?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: murmurare는 단순한 말함이 아니라 불만 섞인 불평·원망을 뜻합니다.
    reason: source_note
  - marker: b
    text: praestiti는 단순한 ‘주다’보다 ‘베풀다/수여하다’의 뉘앙스를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: nunc usque murmuratis
  english_pob_choice: Until now you have kept murmuring.
  chosen_korean: 지금까지 너희는 계속 투덜거렸습니다
  alternatives_korean:
  - 지금까지 너희는 계속 불평했습니다
  - 지금까지 너희는 계속 원망했습니다
  lexicon: murmurare
  rationale: 라틴어 murmuratis는 단순한 말이 아니라 불만 섞인 불평과 원망의 뉘앙스를 가지므로, 문맥상 직설적이고 구어적인 ‘투덜거렸습니다’로 옮겼습니다.
- source_word: beneficia
  english_pob_choice: benefits
  chosen_korean: 은혜들
  alternatives_korean:
  - 선물들
  - 호의들
  - 유익들
  lexicon: beneficium
  rationale: 문맥상 하나님이 백성에게 베푸신 구원의 호의와 은총을 가리키므로, 단순한 ‘이익’보다 관계적·신학적으로 더 직접적인 ‘은혜들’이 적절합니다.
- source_word: praestiti vobis
  english_pob_choice: I bestowed on you
  chosen_korean: 내가 너희에게 베푼
  alternatives_korean:
  - 내가 너희에게 준
  - 내가 너희에게 주신
  lexicon: praestare
  rationale: praestiti는 단순한 ‘주다’보다 위에서 아래로 베푸는 뉘앙스가 있어, POB의 ‘bestowed’를 살려 ‘베푼’으로 옮겼습니다.
- source_word: proclamastis
  english_pob_choice: you cry out
  chosen_korean: 부르짖지 않았습니까
  alternatives_korean:
  - 외치지 않았습니까
  - 호소하지 않았습니까
  lexicon: proclamare
  rationale: 광야에서의 위기 상황을 고려하면 단순한 외침보다 절박한 호소를 뜻하는 ‘부르짖다’가 더 정확합니다.
theological_decisions:
- issue: 하나님의 ‘베풂’과 백성의 ‘원망’ 대비
  chosen_reading: 하나님이 이미 베푸신 은혜를 잊고 계속 불평하는 백성의 불신앙을 직설적으로 드러내는 표현으로 유지했습니다.
  alternative_readings:
  - ‘불평하다’로 완화해 더 중립적으로 표현
  - ‘원망하다’로 더 강하게 표현
  rationale: 라틴어의 대조는 단순한 민원 제기가 아니라 언약적 기억 상실과 불신앙의 책망이므로, 감정의 강도를 유지하는 번역이 본문 의도에 더 가깝습니다.
  doctrine_reference: 출애굽기-광야 전승의 언약적 불평/원망 모티프
- issue: ‘광야’와 기도/호소의 관계
  chosen_reading: ‘광야에서 … 부르짖다’로 직역해, 위기 속에서 하나님께 향한 절박한 호소를 보존했습니다.
  alternative_readings:
  - ‘광야에서 … 소리치다’
  - ‘광야에서 … 외치다’
  rationale: 후속 문맥의 신학적 대비를 살리기 위해, 단순한 음성 행위보다 의존과 간구의 함의를 가진 표현을 택했습니다.
  doctrine_reference: 광야에서의 하나님의 공급과 백성의 의존
