  source_fidelity: 라틴어의 조건절(obtulleritis)과 미래 응답(auertam), 그리고 거절되는 항목들의 병렬을 충실히 반영합니다. ‘너희가 내게 제물을 가져올 때면’은 영어 POB의 ‘When you bring offerings’ 및 라틴어의 시간·조건적 용법을 자연스럽게 옮긴 표현입니다. ‘너희에게서 얼굴을 돌리겠습니다’도 auertam faciem meam a vobis의 비유를 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고 일관됩니다. ‘절기들과 초하루들과 육체의 할례’의 복수 병렬은 원문의 열거와 강조를 잘 드러내며, 문맥상 이해에 무리가 없습니다.
  terminology: ‘제물’, ‘절기’, ‘초하루’, ‘육체의 할례’는 종교·성서 문맥에서 적절한 용어입니다. 특히 ‘육체의 할례’는 circumcisiones carnis의 논쟁적인 수식 관계를 불필요하게 해석하지 않고 보존합니다. 각주도 이 구절의 후대 기독교적 층과 논쟁적 성격을 설명하며 본문과 3–14장의 구별을 적절히 알립니다.
