  yaml_path: translation/extra_canonical/2_esdras/001/031.yaml
  text: When you bring offerings to me[a], I will turn my face from you; for I have rejected your feast days and new moons and circumcisions of the flesh.
  footnotes:
  - marker: a
    text: This chapter belongs to the later Christian layer often called 5 Ezra. Its rejection of 'feast days ... new moons and circumcisions of the flesh' reflects that layer's polemical voice and should not be conflated with the theology of the Jewish apocalypse in chapters 3-14.
    reason: compositional_layer
    anchor_ref: '1:31'
translation:
  language: ko
  text: 너희가 내게 제물을 가져올 때면, 내가 너희에게서 얼굴을 돌리겠습니다. 이는 내가 너희의 절기들과 초하루들과 육체의 할례를 거절하였기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 장은 흔히 5에스라로 불리는 뒤늦은 기독교적 층에 속하며, ‘절기들 … 초하루들 … 육체의 할례’에 대한 거절은 그 층의 논쟁적 목소리를 반영합니다. 3–14장에 나오는 유대 묵시문학의 신학과 혼동해서는 안 됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: obtulleritis
  english_pob_choice: When you bring offerings to me
  chosen_korean: 너희가 내게 제물을 가져올 때면
  alternatives_korean:
  - 너희가 내게 제물을 바칠 때면
  - 너희가 내게 제물을 가져오면
  lexicon: offerings / bring offerings
  rationale: 라틴어 obtulleritis는 단순한 ‘바치다’보다 ‘가져오다/드리다’의 동작을 함께 담으므로, 제사를 제시하는 행위를 자연스럽게 살려 ‘가져올 때면’으로 옮겼습니다.
- source_word: auertam faciem meam a uobis
  english_pob_choice: I will turn my face from you
  chosen_korean: 내가 너희에게서 얼굴을 돌리겠습니다
  alternatives_korean:
  - 내가 너희를 외면하겠습니다
  - 내 얼굴을 너희에게서 돌리겠습니다
  lexicon: turn my face from you
  rationale: 직역에 가깝게 ‘얼굴을 돌리다’로 유지해 원문의 관계 단절 이미지를 보존했습니다.
- source_word: dies festos ... neomenias
  english_pob_choice: your feast days and new moons
  chosen_korean: 너희의 절기들과 초하루들과
  alternatives_korean:
  - 너희의 명절들과 초하루들과
  - 너희의 절기들과 새달들과
  lexicon: feast days / new moons
  rationale: dies festos는 예배 달력의 ‘절기들’로, neomenias는 문자 그대로 ‘초하루들’로 옮겨 달력상의 고정 표현을 드러냈습니다.
- source_word: circumcisiones carnis
  english_pob_choice: circumcisions of the flesh
  chosen_korean: 육체의 할례
  alternatives_korean:
  - 살의 할례
  - 몸의 할례
  lexicon: circumcisions of the flesh
  rationale: carnis는 단순 신체가 아니라 육체성/살의 영역을 가리켜, 한국어 성경 전통의 ‘육체’로 옮겨 논쟁적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 절기·초하루·육체의 할례에 대한 거절 표현
  chosen_reading: 이 구절의 거절은 후대 기독교적 반유대 논조를 그대로 반영한 것으로, 본문 문장을 완화하지 않고 유지했습니다.
  alternative_readings:
  - 절기와 초하루와 할례를 무가치하다고 완화해서 옮김
  - 유대 절기 일반이 아니라 특정 불순종 행위로 재해석함
  rationale: 영어 POB의 주석처럼 이 대목은 후대 기독교 층의 논쟁적 발화이므로, 본문의 날 선 표현을 약화하지 않고 원문과 동일한 긴장을 보존했습니다.
  doctrine_reference: compositional_layer / polemical voice
- issue: ‘내게 제물을 가져올 때’의 행위와 거절의 연결
  chosen_reading: 제물을 드리는 행위가 자동으로 받아들여지는 것이 아니라, 화자의 심판적 거절과 병렬로 제시된다는 점을 유지했습니다.
  alternative_readings:
  - 제사를 일반 예배로 순화
  - 조건문을 약화해 단순 경고로 처리
  rationale: 라틴어 조건문 구조를 살려, 예배 행위 자체가 거절의 대상이 될 수 있다는 본문 효과를 보존했습니다.
  doctrine_reference: source syntax / rhetorical force
