translation:
  language: ko
  text: 이 광야에서 나는 너희의 탄식에 마음 아파하였으며, 너희에게 만나를 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 탄식을 불쌍히 여겼다’.
    reason: 이전 번역의 ‘had pity’라는 해석적 표현을 반영합니다. 본문은 라틴어 dolui의 직접적인 슬픔·고통의 뜻을 따라 ‘마음 아파하였다’로 옮깁니다.
lexical_decisions:
- source_word: deserto hoc
  english_pob_choice: in this wilderness
  chosen_korean: 이 광야에서입니다
  alternatives_korean:
  - 이 사막에서입니다
  - 이 광야 안에서입니다
  lexicon: desertum / deserto
  rationale: Latin의 지시어 hoc와 장소격 deserto를 살려 ‘이 광야에서’로 옮겼습니다. 문장 시작부의 독립된 장소 구문이므로 현대 한국어에서는 ‘입니다’를 붙여 자연스럽게 처리했습니다.
- source_word: Ego dolui
  english_pob_choice: I grieved
  chosen_korean: 마음 아파하며
  alternatives_korean:
  - 슬퍼하며
  - 근심하며
  - 아파하며
  lexicon: dolere
  rationale: dolui는 단순한 동정이 아니라 실제로 ‘아픔/슬픔을 느끼다’는 뜻이므로, ‘불쌍히 여기다’보다 감정의 강도를 살린 표현으로 옮겼습니다. 주어 ‘내가’에 이어 현재적 서술로 자연스럽게 연결했습니다.
- source_word: gemitos uestros
  english_pob_choice: your groanings
  chosen_korean: 너희의 탄식
  alternatives_korean:
  - 너희의 신음
  - 너희의 울부짖음
  lexicon: gemitus
  rationale: gemitus는 고통 속의 신음과 탄식을 가리키므로, 예배체나 관용적 표현보다 원문의 고통감을 잘 드러내는 ‘탄식’을 선택했습니다.
- source_word: dedi mannam uobis
  english_pob_choice: gave you manna
  chosen_korean: 너희에게 만나를 주었습니다
  alternatives_korean:
  - 너희에게 만나를 내렸습니다
  - 너희에게 만나를 주셨습니다
  lexicon: manna
  rationale: dedi는 단순한 ‘주다’이므로 추가 해석 없이 직역했고, ‘만나’는 한국어 성경에서 널리 쓰이는 전통적 고유명사형을 유지했습니다.
theological_decisions:
- issue: dolui의 정서 강도와 영어 audit의 ‘had pity’ 대비
  chosen_reading: ‘마음 아파하며’로 옮겨, 단순한 자비 선언이 아니라 고통에 대한 실제적 동참의 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘불쌍히 여기며’
  - ‘가엾이 여기며’
  rationale: 영어 POB가 최종적으로 ‘I grieved over your groanings’로 조정되었고, 라틴어 dolui도 그에 합당하게 고통의 감정 자체를 뜻하므로, 연민보다 더 직접적인 정서 반응을 드러내는 번역이 필요했습니다.
  doctrine_reference: 본문 비평/어휘 선택
