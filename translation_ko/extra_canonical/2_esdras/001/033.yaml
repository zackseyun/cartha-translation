  text: 'Thus says the Lord Almighty: Your house is desolate. I will cast you out like stubble before the wind.'
translation:
  language: ko
  text: 전능하신 주께서 이렇게 말씀하십니다. 너희 집은 황폐합니다. 내가 너희를 바람 앞의 지푸라기처럼 내던지겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 현존 본문은 이 문장 뒤에서 ‘그리고 자녀들 …’(Et filii pro-)이라고 시작하다가 절단됩니다.
    reason: source_note
lexical_decisions:
- source_word: serta est
  english_pob_choice: Your house is desolate.
  chosen_korean: 너희 집은 황폐하니
  alternatives_korean:
  - 너희 집은 버려졌습니다
  - 너희 집은 황폐합니다
  lexicon: serta est → desolate/laid waste
  rationale: 라틴어 수동 완료형의 결과 상태를 살려 ‘황폐하다’로 옮기되, POB의 문맥상 현재적 판단을 유지하기 위해 종결을 매끈하게 처리했습니다.
- source_word: proiciam uos
  english_pob_choice: I will cast you out
  chosen_korean: 내가 너희를 내던지겠습니다
  alternatives_korean:
  - 내가 너희를 쫓아내겠습니다
  - 내가 너희를 던져 버리겠습니다
  lexicon: proiciam → cast out/throw away
  rationale: 단순한 추방보다 거칠고 심판적인 ‘내던지다’가 원문의 강한 배척 이미지를 더 직접적으로 반영합니다.
- source_word: sicut uentus stipulam
  english_pob_choice: like stubble before the wind
  chosen_korean: 바람 앞의 짚처럼
  alternatives_korean:
  - 바람 앞의 검불처럼
  - 바람에 날리는 짚처럼
  lexicon: stipula → stubble/straw
  rationale: stipulam의 건조하고 무력한 심판 이미지를 한국어 관용과 맞물리게 하되, ‘짚’으로 간결하게 유지했습니다.
- source_word: Et filii pro-
  english_pob_choice: Thus says the Lord Almighty
  chosen_korean: 전능하신 주께서 이렇게 말씀하십니다
  alternatives_korean:
  - 만군의 주께서 이렇게 말씀하십니다
  - 전능하신 야훼께서 이렇게 말씀하십니다
  lexicon: Latin context/prophetic formula
  rationale: 본문 조각은 뒤가 절단되어 있으므로, 영어 POB의 완결형 공식을 반영하되 한국어에서는 가장 보수적으로 ‘전능하신 주’로 처리했습니다.
theological_decisions:
- issue: 절단된 라틴어 본문과 영어 POB의 완결 문장 사이의 관계
  chosen_reading: 현존 라틴어 조각은 문장 중간에서 끊기지만, POB의 완결된 공식을 본문 앞에 두어 독자가 의미를 따라가게 했습니다.
  alternative_readings:
  - 절단 상태를 그대로 반영해 앞뒤를 모두 생략하는 방식
  - 라틴어 조각만 직역해 불완전한 문장을 남기는 방식
  rationale: 출판 가능한 단문으로서 읽히게 하면서도, 본문이 전승 과정에서 손상되었음을 숨기지 않기 위해 절단 흔적은 라틴어 원문 설명에서만 유지했습니다.
  doctrine_reference: textual criticism and translation practice
