  source_fidelity: 핵심 심판 진술은 대체로 충실하지만, 라틴어 deserta est의 상태 진술을 인과 접속형 ‘황폐하니’로 바꾼 것은 원문에 없는 논리적 연결을 더합니다. 또한 현존 라틴어 조각은 이 문장 뒤에 ‘Et filii pro-’가 남아 있으므로, 현 각주의 ‘뒤 문맥은 전승되지 않았습니다’라는 표현은 지나치게 포괄적입니다.
  naturalness: ‘바람 앞의 짚처럼’도 이해 가능하나, 심판문맥에서 바람에 흩날리는 무력한 물질이라는 비유는 ‘바람 앞의 지푸라기처럼’이 더 자연스럽고 분명합니다. 두 독립 문장으로 처리하면 현대 한국어 합쇼체의 선언적 예언 문체도 자연스럽습니다.
