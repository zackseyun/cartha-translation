id: 2ES.1.16
reference: 2 Esdras 1:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ad tutelam dedi, et illic murmurastis, Et non triumphastis in nomine meo de perditione inimicorum uestrorum, sed adhuc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/016.yaml
  text: I gave for protection[a], and there you grumbled. You did not exult in my name over the destruction of your enemies, but still
  footnotes:
  - marker: a
    text: Or 'triumph in my name over the destruction'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 보호를 위해 주었는데, 그곳에서 여러분은 불평했습니다. 여러분은 내 이름으로 여러분의 원수들의 멸망을 두고 기뻐하지 않았지만, 그러나 여전히…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad tutelam dedi
  english_pob_choice: I gave for protection
  chosen_korean: 나는 보호를 위해 주었습니다
  alternatives_korean:
  - 나는 안전을 위해 주었습니다
  - 나는 지키기 위해 주었습니다
  lexicon: ad tutelam / do
  rationale: ad tutelam은 목적을 나타내므로 단순히 '주었다'가 아니라 보호라는 목적을 살려 자연스러운 목적구로 옮겼습니다.
- source_word: murmurastis
  english_pob_choice: you grumbled
  chosen_korean: 여러분은 투덜거렸습니다
  alternatives_korean:
  - 여러분은 불평했습니다
  - 여러분은 원망했습니다
  lexicon: murmuro
  rationale: murmurastis는 불만 섞인 중얼거림을 가리키므로, 현대 한국어에서 가장 직관적인 '투덜거렸습니다'를 택했습니다.
- source_word: triumphastis ... de perditione
  english_pob_choice: exult in my name over the destruction
  chosen_korean: 내 이름으로 여러분의 원수들의 멸망을 두고 기뻐하지 않았습니다
  alternatives_korean:
  - 내 이름으로 원수들의 멸망을 두고 환호하지 않았습니다
  - 내 이름으로 원수들의 파멸을 보고 즐거워하지 않았습니다
  lexicon: triumpho + de + abl.
  rationale: Latin의 de + 탈격은 '...에 관하여/두고'의 의미이므로, 'destroy'의 결과를 넘어 그 멸망을 두고 기뻐하지 않았다는 뜻을 드러냈습니다.
- source_word: sed adhuc
  english_pob_choice: but still
  chosen_korean: 하지만 여전히…
  alternatives_korean:
  - 그러나 아직도…
  - 그런데도…
  lexicon: sed adhuc
  rationale: 본문이 여기서 끊기므로, 한국어도 미완의 종결감을 살려 '여전히…'로 마감했습니다.
theological_decisions:
- issue: 원수의 멸망에 대한 태도
  chosen_reading: 하나님의 이름으로 원수의 멸망을 기뻐하는 것이 아니라, 주어진 보호에 대한 감사가 요구된다는 질책으로 읽었습니다.
  alternative_readings:
  - 전쟁 승리를 축하하지 말라는 일반적 권고로 읽을 수 있습니다.
  - 원수의 멸망 자체를 슬퍼하라는 의미로 완화할 수 있습니다.
  rationale: 본문의 대비는 '보호를 주었음'과 '원수의 멸망을 두고 기뻐하지 않음' 사이에 있으므로, 승리 자체보다 하나님의 이름을 높이는 반응이 문제라는 점을 보존했습니다.
  doctrine_reference: 성경신학적 응보/감사 반응의 대비
