  naturalness: ‘투덜거렸습니다’도 가능하지만, 본문의 질책과 현대 정중 문체에는 ‘불평했습니다’가 더 중립적이고 자연스럽습니다. ‘그곳에서’는 illic를 자연스럽게 반영합니다.
  terminology: ‘보호를 위해’, ‘내 이름으로’, ‘원수들의 멸망’은 원문의 의미와 성서적 문맥에 적절합니다. 기존 각주는 한국어 어순만 바꾼 표현이어서 의미 있는 대안 독법을 제공하지 않으므로 삭제하는 것이 좋습니다.
  issues:
