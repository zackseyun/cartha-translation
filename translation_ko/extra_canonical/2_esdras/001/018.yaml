id: 2ES.1.18
reference: 2 Esdras 1:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'ad me dicentes: Vtquid nos in desertum istud adduxisti interficere nos? melius nobis fuerat seruire Aegyptiis quam mori in'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/018.yaml
  text: saying, “Why have you brought us into this wilderness, to kill us? It would have been better for us to serve the Egyptians than to die in this wilderness.”
translation:
  language: ko
  text: “당신들은 어째서 우리를 이 광야로 데리고 와서 죽이려 합니까? 이 광야에서 죽는 것보다 이집트 사람들을 섬기는 것이 우리에게 더 나았을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adduxisti
  english_pob_choice: have you brought us
  chosen_korean: 데리고 와서
  alternatives_korean:
  - 데려오셔서
  - 이끌어 와서
  lexicon: adducere
  rationale: 문맥상 단순 이동이 아니라 광야로 ‘데려옴’이 강조되므로, 한국어에서는 자연스럽고 직접적인 ‘데리고 와서’로 옮겼습니다.
- source_word: desertum istud
  english_pob_choice: this wilderness
  chosen_korean: 이 광야
  alternatives_korean:
  - 이 사막
  - 이 황무지
  lexicon: desertum
  rationale: 라틴어 desertum의 광야적 의미를 살리되, 성서 문맥에서 익숙한 ‘광야’가 가장 정확합니다.
- source_word: seruire Aegyptiis
  english_pob_choice: to serve the Egyptians
  chosen_korean: 이집트 사람들을 섬기는 것
  alternatives_korean:
  - 이집트인들을 섬기는 것
  - 이집트 사람들에게 종노릇하는 것
  lexicon: servire / Aegyptii
  rationale: seruire는 단순 고용이 아니라 종속적 섬김을 뜻할 수 있지만, 본문이 노예 신분을 직접 지칭하지는 않으므로 기본값 ‘섬기다’를 유지했습니다.
- source_word: melius nobis fuerat
  english_pob_choice: It would have been better for us
  chosen_korean: 우리에게 더 나았을 것입니다
  alternatives_korean:
  - 우리에게 더 좋았을 것입니다
  - 차라리 우리에게 더 나았을 것입니다
  lexicon: melius / esse
  rationale: 비교 우위의 판단을 간결하게 전달하는 표준 한국어 표현으로 옮겼습니다.
theological_decisions:
- issue: 원문의 절박한 항의와 비교 표현의 보존
  chosen_reading: 광야에서 죽는 것보다 이집트 사람들을 섬기는 것이 더 낫다는 원문의 대비를 직설적으로 유지했습니다.
  alternative_readings:
  - 의역하여 완곡하게 표현함
  - ‘차라리’로 감정 강도를 약화시킴
  rationale: 이 구절은 백성의 불평을 그대로 드러내는 장면이므로, 불만의 날것의 어조와 선택의 비극성을 약화하지 않는 것이 중요합니다.
  doctrine_reference: 서술문 어조 보존
