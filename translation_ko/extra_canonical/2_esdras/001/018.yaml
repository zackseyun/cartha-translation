    issue: 2인칭 수의 불일치
    rationale: 원문 adduxisti는 단수이나 초안은 ‘당신들은’으로 복수 상대를 설정합니다. ‘당신은’으로 고쳐야 합니다.
  revised_text: “당신은 어찌하여 우리를 이 광야로 데리고 와서 죽이려 하십니까? 이 광야에서 죽는 것보다 이집트 사람들을 섬기는 것이 우리에게 더 나았을 것입니다.”
