  to: 내가 너에게 무엇을 하겠습니까, 야곱아? 유다야, 너는 내게 순종하려 하지 않았습니다. 내가 다른 민족들에게로 돌아서서 그들에게 내 이름을 주겠습니다. 그들이 내 규례들을 지키도록 하겠습니다.
  rationale: 라틴어의 의지적 불순종(noluisti), 다른 민족들을 향한 전환(transferam me ad), 그리고 규례 준수를 목적으로 한 이름의 수여(ut custodient)를 보존하면서, 현대 표준어 합쇼체로 일관되게 다듬었습니다. 본문이 명시하지 않는 반역성이나 신학적 함의는 각주에서 제거했습니다.
