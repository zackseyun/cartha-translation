review_pass:
  verdict: revise
  source_fidelity: ‘noluisti’의 의지적 거부를 ‘순종하려 하지 않았다’로 명시하고, ‘transferam me ad’는 ‘다른 민족들에게로 돌아서다’로 옮겨 방향 전환을 보존했습니다. ‘ut custodient’는 목적을 나타내도록 ‘지키도록’으로 번역했습니다.
  naturalness: 초안의 ‘돌아가’는 한국어에서 본래 있던 곳으로 되돌아간다는 뜻으로도 들려 문맥에 맞지 않을 수 있습니다. 또한 요청된 현대 합쇼체와 달리 ‘않았도다/하겠노니/함이라’가 사용되어 있었습니다. 수정문은 현대적이고 일관된 합쇼체입니다.
  terminology: ‘내 이름’, ‘민족들’, ‘규례들’은 각각 nomen meum, gentes, legitima를 무리 없이 반영합니다. 기존 각주는 원문 어휘가 확정하지 않는 ‘반역’ 및 특정 신학적 함의를 단정하므로 삭제하는 편이 적절합니다.
  issues:
