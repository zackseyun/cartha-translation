    rationale: transferam me ad는 다른 민족들을 향해 자신을 옮기거나 방향을 돌린다는 뜻입니다. ‘돌아가다’는 되돌아감의 뉘앙스를 더해 오해될 수 있습니다.
  - severity: medium
    issue: 문체가 현대 합쇼체가 아님
    rationale: ‘않았도다’, ‘하겠노니’, ‘함이라’는 고전적 성경 문체로, 지정된 modern formal-polite (합쇼체)와 일치하지 않습니다.
  - severity: low
    issue: 기존 각주 a와 b의 해석적 단정
    rationale: obaudire 자체가 ‘반역’을 명시하지 않으며, nomen meum의 표현만으로 ‘소속과 권위의 부여까지’를 각주로 단정하기는 어렵습니다.
