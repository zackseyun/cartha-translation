source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quid tibi faciam, Iacob ? noluisti me obaudire, Iuda. transferam me ad alias gentes et dabo eis nomen meum, ut custodiant legitima mea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/024.yaml
  text: What shall I do to you, Jacob? You would not obey me, Judah. I will turn to other nations, and I will give them my name, that they may keep my statutes.
translation:
  language: ko
  text: 내가 너에게 무엇을 하겠습니까, 야곱아? 유다야, 너는 내게 순종하려 하지 않았습니다. 내가 다른 민족들에게로 돌아서서 그들에게 내 이름을 주겠습니다. 그들이 내 규례들을 지키도록 하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi faciam
  english_pob_choice: What shall I do to you
  chosen_korean: 내가 너에게 무엇을 하겠느냐
  alternatives_korean:
  - 너를 어떻게 하겠느냐
  - 내가 너에게 무엇을 하리요
  lexicon: Latin tibi faciam
  rationale: 라틴어의 방향성 있는 대격/여격 표현을 살려 ‘너에게’로 옮기고, 심판적 질문의 수사성을 유지했습니다.
- source_word: noluisti me obaudire
  english_pob_choice: You would not obey me
  chosen_korean: 네가 나에게 순종하지 않았도다
  alternatives_korean:
  - 네가 내 말을 듣지 않았도다
  - 너는 나에게 복종하지 않았도다
  lexicon: Latin obaudire
  rationale: obaudire는 단순 청취보다 ‘귀 기울여 따르다/순종하다’의 뜻이 강하므로, 강한 불순종을 드러내는 ‘순종하지 않았다’로 옮겼습니다.
- source_word: transferam me ad alias gentes
  english_pob_choice: I will turn to other nations
  chosen_korean: 내가 다른 민족들에게로 돌아가
  alternatives_korean:
  - 내가 다른 민족들에게로 옮겨 가
  - 내가 다른 나라들로 향하
  lexicon: Latin transferam me ad
  rationale: 직역적 ‘옮기다’보다 하나님이 언약적 관심의 방향을 바꾸시는 뜻을 한국어로 자연스럽게 드러내는 ‘돌아가’가 문맥상 더 적절합니다.
- source_word: dabo eis nomen meum
  english_pob_choice: I will give them my name
  chosen_korean: 그들에게 내 이름을 주겠노니
  alternatives_korean:
  - 그들에게 내 이름을 주겠노라
  - 그들에게 내 이름을 주어
  lexicon: Latin nomen meum
  rationale: ‘내 이름’은 단순 호칭이 아니라 하나님의 소속과 권위의 부여를 뜻하므로 그대로 보존했습니다.
- source_word: legitima mea
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 율례들
  - 내 법도들
  lexicon: Latin legitima
  rationale: legitima는 율법적 준수를 가리키는 항목적 표현이므로, 한국어 성경에서 널리 통용되는 ‘규례들’을 택했습니다.
theological_decisions:
- issue: 하나님의 이름을 이스라엘이 아니라 다른 민족들에게 주신다는 진술
  chosen_reading: 언약의 특권이 불순종한 이스라엘에서 다른 민족들로 옮겨 가는 심판-전이의 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 선교 확장 선언으로 읽기
  - 이스라엘의 완전한 폐기가 아니라 일시적 징계로만 읽기
  rationale: 본문은 ‘순종하지 않음’과 ‘다른 민족들에게로 돌아가’가 직접 연결되어 있어, 선교만이 아니라 언약적 경고와 전이를 함께 반영해야 합니다.
  doctrine_reference: 언약 신학 / 심판과 선택의 전이
