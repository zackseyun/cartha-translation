  source_fidelity: 라틴어 creationem non facient를 ‘자손을 낳지 못할 것입니다’로 옮겨 후손을 얻지 못한다는 뜻을 충실히 전달합니다. mandatum meum vobiscum neglexerunt의 공동체 내 불이행은 ‘너희 가운데서 내 명령을 소홀히 여기고’로 적절히 반영되었고, quod malum est coram me fecerunt도 ‘내 앞에서 악한 일을 행하였기 때문입니다’로 정확합니다.
  naturalness: 현대 표준 한국어의 합쇼체로 자연스럽고, 심판 선언의 엄중한 문체에도 잘 맞습니다. ‘너희 아들들은’과 ‘자손을 낳다’는 이 문맥에서 이해 가능하며 부자연스럽지 않습니다.
  terminology: ‘내 명령’, ‘내 앞에서’, ‘악한 일’은 원문의 법정적·윤리적 표현을 과도한 교리화 없이 안정적으로 전달합니다. ‘소홀히 여기다’는 neglexerunt의 ‘등한히 하다/무시하다’ 범위를 적절히 보존합니다.
