  text: And your sons will not produce offspring, because they neglected my commandment among you and did what is evil before me.
translation:
  language: ko
  text: 너희 아들들은 자손을 낳지 못할 것입니다. 그들이 너희 가운데서 내 명령을 소홀히 여기고 내 앞에서 악한 일을 행하였기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: creationem non facient
  english_pob_choice: will not produce offspring
  chosen_korean: 자손을 낳지 못할 것입니다
  alternatives_korean:
  - 자녀를 낳지 못할 것입니다
  - 후손을 두지 못할 것입니다
  lexicon: creationem
  rationale: 라틴어 표현은 문자적으로 ‘생산/출산’을 뜻하지만, 문맥상 후손의 부재를 말하므로 한국어에서는 자연스럽게 ‘자손을 낳지 못하다’로 옮겼습니다.
- source_word: mandatum meum uobiscum neglexerunt
  english_pob_choice: they neglected my commandment among you
  chosen_korean: 너희 가운데서 내 명령을 소홀히 여기고
  alternatives_korean:
  - 너희와 함께 내 명령을 저버리고
  - 너희 가운데 내 계명을 무시하고
  lexicon: mandatum / vobiscum / neglexerunt
  rationale: vobiscum은 단순한 동반보다 공동체 내부를 가리키므로 ‘너희 가운데서’로 살리고, neglexerunt는 강한 배반보다 ‘소홀히 여기다’로 옮겨 책임의 뉘앙스를 유지했습니다.
- source_word: quod malum est coram me fecerunt
  english_pob_choice: they did what is evil before me
  chosen_korean: 내 앞에서 악한 일을 행하였기 때문입니다
  alternatives_korean:
  - 내 앞에서 악을 행하였기 때문입니다
  - 내 면전에서 악한 것을 행하였기 때문입니다
  lexicon: coram me / malum est / fecerunt
  rationale: coram me는 ‘내 앞에서’가 직역성과 자연성을 함께 살리고, malum est는 추상명사보다 서술적으로 ‘악한 일’로 옮겨 문맥을 분명히 했습니다.
theological_decisions:
- issue: 불임/자손 상실의 형벌 표현
  chosen_reading: ‘자손을 낳지 못할 것입니다’로 직설적으로 옮겨, 공동체적 언약 불순종에 대한 결과를 약화시키지 않았습니다.
  alternative_readings:
  - ‘열매를 맺지 못할 것입니다’
  - ‘후손이 끊길 것입니다’
  rationale: 본문은 개인적 성공 실패가 아니라 후손의 부재라는 심판을 말하므로, 한국어에서도 그 엄중함을 그대로 드러내는 표현이 필요합니다.
  doctrine_reference: 언약적 심판과 후손의 단절이라는 성서적 보응 모티프
- issue: ‘내 앞에서’의 심판적 시선
  chosen_reading: 하나님 앞에서의 행위를 드러내는 법정적·관계적 표현으로 유지했습니다.
  alternative_readings:
  - ‘내 면전에서’
  - ‘내 앞에 보이게’
  rationale: coram me는 단순 위치가 아니라 하나님 앞에서의 도덕적 가시성을 뜻하므로, 심판 맥락을 흐리지 않도록 보존했습니다.
  doctrine_reference: 하나님 앞에서의 책임성과 언약 위반
