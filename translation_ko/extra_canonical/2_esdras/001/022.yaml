    rationale: 각주는 omnipotens를 Lord Almighty의 관용에 따른 것이라고 하나, 본문은 실제로 ‘만군의 하나님’으로 번역되어 있습니다. 안전한 본문 수정 뒤에는 이 각주가 필요하지 않습니다.
