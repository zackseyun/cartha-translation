  yaml_path: translation/extra_canonical/2_esdras/001/022.yaml
  text: 'Thus says the Lord Almighty: In the wilderness, when you were thirsty at the bitter stream and blasphemed my name,'
translation:
  language: ko
  text: 주 만군의 하나님께서 이렇게 말씀하십니다. “너희가 광야에서, 쓴 시내에서 목마른 채 내 이름을 모독하였을 때,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 omnipotens는 문자적으로는 ‘전능하신’이지만, 여기서는 POB가 선택한 Lord Almighty의 관용을 따라 하나님의 주권을 드러내는 표현으로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Haec dicit dominus omnipotens
  english_pob_choice: Thus says the Lord Almighty
  chosen_korean: 주 만군의 하나님께서 이렇게 말씀하십니다
  alternatives_korean:
  - 전능하신 주께서 이렇게 말씀하십니다
  - 주 하나님께서 이렇게 말씀하십니다
  lexicon: dominus omnipotens
  rationale: 라틴어의 주어-서술 구조를 자연스럽게 살리되, omnipotens를 ‘만군의 하나님’으로 옮겨 하나님의 전능성을 공손한 현대 문체로 드러냈습니다.
- source_word: in deserto
  english_pob_choice: In the wilderness
  chosen_korean: 광야에서
  alternatives_korean:
  - 사막에서
  - 들판에서
  lexicon: desertum
  rationale: desertum의 기본 의미를 따라 성서적 배경이 분명한 ‘광야에서’로 옮겼습니다.
- source_word: in flumine amaro
  english_pob_choice: at the bitter stream
  chosen_korean: 쓴 시내에서
  alternatives_korean:
  - 쓴 강가에서
  - 쓴 물가에서
  lexicon: flumen amaro
  rationale: flumen amaro의 직역성을 유지하면서도 한국어 성서 문맥에서 자연스러운 ‘쓴 시내’로 처리했습니다.
- source_word: blasphemantes nomen meum
  english_pob_choice: blasphemed my name
  chosen_korean: 내 이름을 모독하였을 때
  alternatives_korean:
  - 내 이름을 욕하였을 때
  - 내 이름을 저주하였을 때
  lexicon: blasphemare
  rationale: blasphemare의 핵심인 하나님 이름에 대한 모독을 분명히 드러내기 위해 ‘모독하다’를 선택했습니다.
theological_decisions:
- issue: divine self-designation and reverence register
  chosen_reading: 하나님이 직접 말씀하시는 예언적 회고로 보고, 본문 서술은 합쇼체를 유지하되 인용문 안에는 과거 행위를 그대로 담았습니다.
  alternative_readings:
  - 평서형으로만 처리하는 방식
  - 인용문 안까지 모두 높임체로 바꾸는 방식
  rationale: 라틴어의 선언문 구조를 살리면서도 한국어 독자에게 하나님의 직접 화법이 분명히 들리도록 했습니다.
  doctrine_reference: 성경의 신적 화자 표지와 예언적 직접 화법
