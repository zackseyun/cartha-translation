    issue: 호칭의 혼용
    rationale: ‘여러분이’와 ‘너희 자신’은 동일한 청자를 서로 다른 거리감으로 부르므로, 원문의 복수 2인칭을 한 표현으로 통일해야 합니다.
  - severity: medium
    issue: 각주의 직역 설명이 부정확함
    rationale: ‘내가 아니라 너희 자신을 버린 것’은 원문의 ‘너희가 나를 버린 것이 아니라, [너희가] 너희 자신을 버린 것’에서 주어와 목적어 관계를 바꿉니다. 이 각주는 삭제하는 것이 안전합니다.
  revised_text: “너희가 나를 버린 것이 아니라, 오히려 너희 자신을 버린 것입니다.” 주님께서 말씀하십니다.
