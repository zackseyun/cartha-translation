source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Non quasi me dereliquistis, sed uos ipsos, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/027.yaml
  text: It is not as though you have forsaken me[a], but yourselves, says the Lord.
  footnotes:
  - marker: a
    text: Or 'It is not as though you had forsaken me, but yourselves, says the Lord.'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분이 나를 버린 것이 아니라, 도리어 너희 자신을 버린 것입니다 — 주님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “내가 아니라 너희 자신을 버린 것이다”라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: Non quasi me dereliquistis
  english_pob_choice: It is not as though you have forsaken me
  chosen_korean: “여러분이 나를 버린 것이 아니라”
  alternatives_korean:
  - “여러분이 나를 저버린 것이 아니라”
  - “내게서 떠난 것이 아니라”
  lexicon: derelinquo
  rationale: Latin perfect dereliquistis를 ‘버린’으로 옮겨 POB의 현재완료 뉘앙스와 대응시키고, 부정 구조 non quasi를 한국어의 대조형으로 자연스럽게 살렸습니다.
- source_word: sed uos ipsos
  english_pob_choice: but yourselves
  chosen_korean: “도리어 너희 자신을 버린 것입니다”
  alternatives_korean:
  - “오히려 너희 자신을 버린 것입니다”
  - “너희 자신을 버린 것이지”
  lexicon: sed + ipsos
  rationale: sed의 대조를 ‘도리어/오히려’로 풀어, 단순히 하나님과의 관계 단절이 아니라 자기파괴적 결과를 지적하는 원문 대비를 드러냈습니다.
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: “주님께서 말씀하십니다”
  alternatives_korean:
  - “주께서 말씀하십니다”
  - “주님께서 이르십니다”
  lexicon: dico + dominus
  rationale: 직접 화자 표지를 한국어 합쇼체로 옮기되, 구약 인용적 어조를 살려 ‘말씀하십니다’를 택했습니다.
theological_decisions:
- issue: 문장의 대조 초점
  chosen_reading: 하나님을 버린 행위가 결국 자기 자신을 버린 것이라는 역설을 그대로 살렸습니다.
  alternative_readings:
  - “나를 버린 것이 아니라 너희가 스스로를 해친 것이다”처럼 해석적 확장
  - “나를 떠난 것이 아니라 너희를 떠난 것이다”처럼 관계 이동으로 완화
  rationale: 라틴 원문은 ‘나를 버림’과 ‘너희 자신을 버림’을 병렬로 두어 책임의 역설을 강조하므로, 이를 해석적으로 완화하지 않고 직접적으로 반영했습니다.
  doctrine_reference: 언약적 책망의 역설적 수사
