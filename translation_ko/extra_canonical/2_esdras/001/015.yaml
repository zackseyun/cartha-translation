id: 2ES.1.15
reference: 2 Esdras 1:15
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uobis. uos autem mei obliti estis, dicit dominus. Haec dicit dominus omnipotens: coturnix uobis in signo fuit, castra uobis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/015.yaml
  text: 'But you have forgotten me[a], says the Lord. Thus says the Lord Almighty: Quail were a sign for you; camps were for you'
  footnotes:
  - marker: a
    text: Or 'I gave you camps for protection,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런데 너희는 나를 잊었습니다, 주님께서 말씀하십니다. 전능하신 주님께서 이렇게 말씀하십니다. 메추라기는 너희에게 표징이었고, 진영들은 너희를 위한 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희를 보호하기 위한 진영을 내가 주었습니다.’라는 뜻일 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: uobis / uos
  english_pob_choice: you / for you
  chosen_korean: 너희에게 / 너희를 위한
  alternatives_korean:
  - 너희에게
  - 너희를 위해
  - 너희에게서
  lexicon: 2인칭 복수 대명사
  rationale: 직접 수신자인 이스라엘 공동체를 향한 말이므로 복수 2인칭을 유지했고, 뒤의 소유·목적 관계는 문맥에 따라 ‘너희를 위한’으로 자연스럽게 풀었습니다.
- source_word: obliti estis
  english_pob_choice: have forgotten me
  chosen_korean: 나를 잊었습니다
  alternatives_korean:
  - 나를 잊어버렸습니다
  - 나를 잊고 있었습니다
  lexicon: oblivisci
  rationale: 완료상적 결과를 살리되, 현대 합쇼체에서 자연스러운 ‘잊었습니다’로 옮겨 하나님을 잊은 책임을 분명히 했습니다.
- source_word: dominus omnipotens
  english_pob_choice: the Lord Almighty
  chosen_korean: 전능하신 주님
  alternatives_korean:
  - 전능하신 주
  - 만군의 주님
  - 전능하신 하나님
  lexicon: dominus / omnipotens
  rationale: dominus는 주님으로, omnipotens는 전능하신으로 옮겨 신앙 공동체의 익숙한 호칭을 유지하면서도 라틴 원문의 호칭 결합을 보존했습니다.
- source_word: coturnix
  english_pob_choice: Quail
  chosen_korean: 메추라기
  alternatives_korean:
  - 메추라기새
  - 꿩
  lexicon: coturnix
  rationale: 야생 조류 명칭으로서 표준적인 한국어 대응어는 메추라기이며, 원문이 표징으로 제시하는 구체적 동물을 그대로 살렸습니다.
- source_word: castra
  english_pob_choice: camps
  chosen_korean: 진영들
  alternatives_korean:
  - 진영
  - 진 camps
  - 야영지들
  lexicon: castra
  rationale: 라틴어 복수형 castra를 단순히 단수화하지 않고 복수성을 살렸으며, 이 본문에서는 출애굽 공동체의 여러 진영/야영 배치를 가리킬 수 있어 ‘진영들’이 원문의 집합적 감각을 보존합니다.
theological_decisions:
- issue: 하나님이 ‘잊혔다’는 책망의 직접성
  chosen_reading: ‘너희는 나를 잊었습니다’처럼 직접적이고 비유화하지 않은 책망으로 유지했습니다.
  alternative_readings:
  - ‘나를 잊어버렸습니다’처럼 완곡하게 표현
  - ‘나를 기억하지 않았습니다’로 완화
  rationale: 원문은 관계적 배반을 단정적으로 고발하므로, 이를 도덕적 완곡어로 누그러뜨리지 않고 그대로 드러내는 것이 문맥상 적절합니다.
  doctrine_reference: 언약적 기억/망각의 책망(출애굽-광야 전승)
