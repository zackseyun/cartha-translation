source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vt essetis mihi in populum, et ego uobis in deum, et uos mihi in filios, et ego uobis in patrem ? Ita uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/029.yaml
  text: that you should be my people[a], and I should be your God, and you should be my sons, and I should be your father?
  footnotes:
  - marker: a
    text: Or 'children'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것은 내가 너희를 내 백성으로 삼고, 내가 너희의 하나님이 되며, 너희가 내 아들들이 되고, 내가 너희의 아버지가 되게 하려는 것이었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자녀들’.
    reason: filios의 포괄적 번역 가능성을 알리되, 본문에서는 원문의 남성 복수 및 부자 관계의 어휘 연결을 따라 ‘아들들’로 옮겼습니다.
lexical_decisions:
- source_word: in populum / my people
  english_pob_choice: my people
  chosen_korean: 제 백성
  alternatives_korean:
  - 내 백성
  - 나의 백성
  lexicon: populus → 백성
  rationale: 언약적 소속 관계를 드러내는 기본 표현으로 ‘백성’을 유지하고, 1인칭 소유는 문맥상 자연스러운 ‘제’로 옮겼습니다.
- source_word: in deum / your God
  english_pob_choice: your God
  chosen_korean: 너희의 하나님
  alternatives_korean:
  - 너희의 신
  - 너희의 주
  lexicon: deus → 하나님
  rationale: 야훼 언급은 아니지만, 2인칭 복수와의 언약 공식인 ‘너희의 하나님’이 원문의 관계성을 가장 직접적으로 반영합니다.
- source_word: filios
  english_pob_choice: sons
  chosen_korean: 아들들
  alternatives_korean:
  - 자녀들
  - 아이들
  lexicon: filii → 아들들
  rationale: 영어 POB의 수정대로 라틴어 filios의 성별 표지를 살려 ‘아들들’로 옮겨, 바로 앞 절의 부자(父子) 이미지와 어휘적 연결을 보존했습니다.
- source_word: patrem / father
  english_pob_choice: father
  chosen_korean: 아버지
  alternatives_korean:
  - 아비
  - 아빠
  lexicon: pater → 아버지
  rationale: 문어체 합쇼체에서 가장 자연스럽고 존중적인 대응어로, 언약적 부자 관계를 유지하는 표현입니다.
theological_decisions:
- issue: 언약 공식의 반복
  chosen_reading: ‘내 백성 / 너희의 하나님 / 내 아들들 / 아버지’의 네 겹 관계를 그대로 살렸습니다.
  alternative_readings:
  - 의미를 풀어 ‘내 소유의 백성’처럼 설명적으로 옮기기
  - ‘자녀들’로 성별 표지를 중화하기
  rationale: 본문은 관계 규정의 반복이 핵심이므로, 전통적 신앙어를 유지하되 성별 표지와 대칭 구조를 약화하지 않도록 했습니다.
  doctrine_reference: 언약 신학, 부자 관계의 표상
