translation:
  language: ko
  text: 나훔과 하박국, 스바냐, 학개, 스가랴, 그리고 말라기, 곧 주님의 천사라고도 불리는 사람들입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사’는 라틴어 angelus의 직역입니다. 여기서 말라기라는 이름의 어원적 의미를 곧바로 풀어쓴 것으로만 단정하지는 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Naum et Abacuc, Sophoniae, Aggei, Zachariae et Malachiae
  english_pob_choice: Nahum and Habakkuk, Zephaniah, Haggai, Zechariah, and Malachi
  chosen_korean: 나훔과 하박국, 스바냐, 학개, 스가랴, 그리고 말라기
  alternatives_korean:
  - 나훔과 하박국, 스바냐, 학개, 스가랴, 말라기
  lexicon: 고유명사 음역
  rationale: 예언자 이름들은 현대 한국어 성경 관용 음역을 따르되, 라틴 원문의 인명 열거를 그대로 반영했습니다.
- source_word: qui et angelus domini uocatus est
  english_pob_choice: who is also called the angel of the Lord
  chosen_korean: 곧 주님의 천사라고도 불리는
  alternatives_korean:
  - 곧 주님의 사자라고도 불리는
  - 곧 주님의 메신저라고도 불리는
  lexicon: angelus / ἄγγελος 계열
  rationale: 라틴 본문이 angelus를 사용하므로 ‘천사’로 옮겨, 단순한 ‘사자/메신저’가 아니라 전승적으로 특정되는 존재 호칭을 보존했습니다.
theological_decisions:
- issue: 말라기라는 인물과 ‘주님의 천사’의 동일시 여부
  chosen_reading: 본문은 말라기를 ‘주님의 천사’라고도 불린다고 서술하지만, 동일인 여부를 해석적으로 확정하지 않고 병렬적 전승 진술로 남겼습니다.
  alternative_readings:
  - 말라기를 ‘주님의 사자’로 이해하는 해석
  - 말라기를 문자적 천사로 이해하는 해석
  rationale: 영어 POB 주석이 이 표현이 말라기의 어원적 의미를 자동으로 결정하지는 않는다고 밝히므로, 한국어도 해석을 과잉 고정하지 않았습니다.
  doctrine_reference: 주해적 보류; 본문 전승의 기술을 우선
