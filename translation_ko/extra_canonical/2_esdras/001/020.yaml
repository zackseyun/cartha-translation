  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in escam, panem angelorum manducastis. Nonne cum sitiretis petram excidi, et fluxerunt aquae in satietate? propter aestus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/020.yaml
  text: You ate the bread of angels for food. When you were thirsty[a], did I not split the rock, and waters flowed in abundance? Because of the heat I covered you with the leaves of trees.
  footnotes:
  - marker: a
    text: Or 'And when you were thirsty, did I not split the rock, and waters flowed in abundance?'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희는 천사의 빵을 양식으로 먹었습니다. 목마를 때 내가 반석을 깨뜨리니 물이 풍성하게 흘러나오지 않았습니까? 더위 때문에 내가 너희를 나무 잎으로 덮었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “목마를 때 내가 반석을 깨뜨리니 물이 풍성하게 흘러나오지 않았습니까?”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: in escam, panem angelorum manducastis
  english_pob_choice: You ate the bread of angels for food.
  chosen_korean: 너희는 천사의 빵을 양식으로 먹었습니다.
  alternatives_korean:
  - 너희는 천사들의 빵을 먹었습니다.
  - 너희는 천사의 빵을 음식으로 먹었습니다.
  lexicon: panis -> 빵; angelorum -> 천사의/천사들의; in escam -> 양식으로
  rationale: 라틴어는 목적어와 목적격 용법을 함께 써서 ‘양식으로’의 의미를 분명히 하므로, 단순히 ‘먹었습니다’보다 ‘양식으로 먹었습니다’가 source의 기능을 더 잘 드러냅니다.
- source_word: cum sitiretis
  english_pob_choice: When you were thirsty
  chosen_korean: 목마를 때
  alternatives_korean:
  - 목마르셨을 때
  - 목마를 때에
  lexicon: sitire -> 목마르다
  rationale: 질문 문장 안에서 시간절을 자연스럽게 살리면서도, 고어적 과잉 경어를 피하기 위해 간결한 현대 한국어로 옮겼습니다.
- source_word: petram excidi
  english_pob_choice: did I not split the rock
  chosen_korean: 내가 반석을 깨뜨리니
  alternatives_korean:
  - 내가 반석을 쪼개지 않았습니까
  - 내가 반석을 깨지 않았습니까
  lexicon: petra -> 반석; excidere -> 깨뜨리다/쪼개다
  rationale: 라틴어의 행위 중심 진술을 살려 ‘깨뜨리다’를 택했고, 질문형 반문은 뒤의 ‘않았습니까?’에 맡겨 자연스럽게 처리했습니다.
- source_word: fluxerunt aquae in satietate
  english_pob_choice: waters flowed in abundance
  chosen_korean: 물이 풍성하게 흘러나오지 않았습니까?
  alternatives_korean:
  - 물이 넉넉히 흘러나오지 않았습니까?
  - 물이 충분히 흘렀지 않습니까?
  lexicon: in satietate -> 풍성하게/넉넉히
  rationale: satietas의 충만함, 넉넉함을 반영해 ‘풍성하게’를 택했고, 단순 양적 충분함보다 물의 넘쳐흐름을 더 잘 드러냅니다.
- source_word: propter aestus
  english_pob_choice: Because of the heat
  chosen_korean: 더위 때문에
  alternatives_korean:
  - 열기 때문에
  - 무더위 때문에
  lexicon: aestus -> 더위/열기
  rationale: 문맥상 고통의 원인인 뜨거운 기온을 평이하게 전달하는 표현으로 ‘더위 때문에’를 선택했습니다.
theological_decisions:
- issue: 반문형 수사 질문의 처리
  chosen_reading: 두 개의 반문을 모두 한국어 반문으로 살려 하나님의 구원 행위를 되묻는 수사적 강조를 유지했습니다.
  alternative_readings:
  - 직설문으로 풀어 서술하기
  - 첫 절만 반문으로 두고 나머지는 서술문으로 처리하기
  rationale: 라틴어의 Nonne가 기대하는 긍정 답변을 암시하는 반문이므로, 한국어에서도 질문형을 유지해야 원문의 수사적 압박이 살아납니다.
  doctrine_reference: 출애굽/광야 회상 문맥의 수사적 상기
