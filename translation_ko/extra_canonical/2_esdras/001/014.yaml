  text: I gave you Moses as a leader and Aaron as a priest. I provided you light by a pillar of fire, and I did great wonders among you.
translation:
  language: ko
  text: 모세를 너희에게 인도자로 주었고 아론을 제사장으로 주었습니다. 나는 불기둥으로 너희에게 빛을 마련해 주었고, 너희 가운데서 큰 놀라운 일들을 행하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘빛’을 ‘불기둥으로’ 제공하셨다는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: ducem uobis dedi Moysen
  english_pob_choice: I gave you Moses as a leader
  chosen_korean: 모세를 너희에게 인도자로 주었습니다
  alternatives_korean:
  - 모세를 너희에게 지도자로 주었습니다
  - 모세를 너희에게 이끄는 자로 주었습니다
  lexicon: ducem → 인도자
  rationale: ducem은 단순 직함보다 ‘앞서 이끄는 자’의 의미가 강하므로, 현대 한국어에서 자연스럽고 원문의 기능을 살리는 ‘인도자’로 옮겼습니다.
- source_word: Aaron sacerdotem
  english_pob_choice: Aaron as a priest
  chosen_korean: 아론을 제사장으로 주었습니다
  alternatives_korean:
  - 아론을 사제로 주었습니다
  - 아론을 성직자로 주었습니다
  lexicon: sacerdotem → 제사장
  rationale: 사제보다 성경적·표준적 표현인 ‘제사장’이 라틴어 sacerdos의 제의적 직분을 더 분명하게 드러냅니다.
- source_word: Lucem uobis per columnam ignis praestiti
  english_pob_choice: I provided you light by a pillar of fire
  chosen_korean: 불기둥으로 너희에게 빛을 마련해 주었고
  alternatives_korean:
  - 불기둥으로 너희에게 빛을 주었고
  - 불기둥을 통해 너희에게 빛을 제공하였고
  lexicon: praestiti → 마련해 주었다
  rationale: praestiti는 단순한 ‘주다’보다 ‘공급하다, 제공하다’의 뉘앙스가 있으므로, 반복을 피하면서도 공급의 의미를 살리는 ‘마련해 주었다’로 옮겼습니다.
- source_word: magna mirabilia feci in
  english_pob_choice: I did great wonders among you
  chosen_korean: 너희 가운데서 큰 놀라운 일들을 행하였습니다
  alternatives_korean:
  - 너희 가운데서 큰 기이한 일들을 행하였습니다
  - 너희 안에서 큰 이적들을 행하였습니다
  lexicon: magna mirabilia → 큰 놀라운 일들
  rationale: mirabilia는 단순한 ‘기적’보다 사람을 놀라게 하는 ‘놀라운 일들’의 폭이 있어, 원문의 서술적 힘을 살려 번역했습니다.
theological_decisions:
- issue: 하나님의 역사 서술에서 반복되는 1인칭 화자의 선물/행위 표현
  chosen_reading: ‘주었습니다 / 마련해 주었습니다 / 행하였습니다’로 일관된 1인칭 과거형을 유지해, 출애굽-광야의 하나님의 주권적 공급과 행위를 강조했습니다.
  alternative_readings:
  - ‘주었고 / 주었으며 / 하셨습니다’처럼 더 평이한 연결
  - 과거형을 약화한 현재적 서술
  rationale: 본문은 하나님이 백성에게 지도자와 제사장, 빛, 놀라운 일들을 직접 베푸셨음을 열거하므로, 행위 주체를 흐리지 않는 서술이 필요합니다.
  doctrine_reference: 출애굽 전승, 하나님의 섭리와 구원 행위
