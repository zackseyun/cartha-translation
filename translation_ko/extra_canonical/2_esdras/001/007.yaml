source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nonne ego eos eduxi de terra Aegypti, de domo seruitutis? ipsi autem irritauerunt me et consilia mea spreuerunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/007.yaml
  text: Was it not I who brought them out of the land of Egypt, out of the house of slavery? But they provoked me and despised my counsels.
translation:
  language: ko
  text: 내가 그들을 이집트 땅에서, 종살이의 집에서 이끌어 내지 않았습니까? 그러나 그들은 나를 분노하게 하고 내 권고들을 멸시했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: eduxi de terra Aegypti, de domo seruitutis
  english_pob_choice: brought them out of the land of Egypt, out of the house of slavery
  chosen_korean: 이집트 땅, 곧 종살이의 집에서 이끌어 낸
  alternatives_korean:
  - 이집트 땅과 종살이의 집에서 데려낸
  - 이집트 땅, 곧 노예의 집에서 이끌어 낸
  lexicon: eduxi / domo servitutis
  rationale: 출애굽의 구출 행위를 분명히 드러내면서, seruitutis를 관용적으로 풀어 '종살이의 집'으로 옮겨 원문의 종속 상태를 자연스럽게 살렸습니다.
- source_word: irritauerunt me
  english_pob_choice: they provoked me
  chosen_korean: 나를 격노하게 하고
  alternatives_korean:
  - 나를 노하게 하고
  - 나를 자극하고
  lexicon: irritare
  rationale: 단순한 '자극하다'보다, 여기서는 하나님에 대한 반역적 도발의 뉘앙스가 강하므로 문맥상 더 직접적인 '격노하게 하다'를 택했습니다.
- source_word: consilia mea
  english_pob_choice: my counsels
  chosen_korean: 내 조언들을
  alternatives_korean:
  - 내 계획들을
  - 내 뜻들을
  lexicon: consilium
  rationale: consilia는 단일한 '계획'보다 복수의 권면·조언·의도 범위를 가질 수 있어, 영어 POB의 복수형을 따라 '조언들'로 옮겼습니다.
theological_decisions:
- issue: 출애굽 사건을 회상하는 하나님의 수사적 질문의 톤
  chosen_reading: 수사적 질문을 한국어에서도 그대로 살려, 하나님의 은혜로운 구출과 이스라엘의 배은망덕을 대조했습니다.
  alternative_readings:
  - 평서문으로 바꾸어 서술하기
  - 더 완곡한 탄식 표현으로 바꾸기
  rationale: 본문은 단순 정보 전달이 아니라 언약 위반을 고발하는 수사이므로, 질문형을 유지해야 원문의 긴장과 책망이 보존됩니다.
  doctrine_reference: 언약사적 책망과 구원 회상
