- from: 너희가 나를 부를 때, 내가 너희의 말을 듣지 않겠습니다. 너희 손은 피로 더럽혀졌고, 너희 발은 살인을 저지르기에 날쌉니다.[a]
  to: 너희가 나를 부르짖을 때에, 내가 너희에게 응답하지 않겠습니다. 이는 너희가 너희 손을 피로 더럽혔고, 너희 발은 살인을 저지르는 데 재빠르기 때문입니다.
  rationale: 능동 동사 maculastis를 능동으로 복원하고, exaudire의 문맥상 ‘응답하여 듣다’라는 뜻을 본문에 반영했습니다. 원문의 심판 선언, 피로 인한 더러움, 살인에 재빠른 발의 비유를 모두 유지했습니다.
