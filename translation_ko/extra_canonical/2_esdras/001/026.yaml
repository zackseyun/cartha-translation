review_pass:
  verdict: revise
  source_fidelity: 라틴어의 maculastis는 ‘너희 손은 더럽혀졌다’라는 상태 서술보다 ‘너희가 너희 손을 더럽혔다’라는 능동 행위를 분명히 나타냅니다. exaudiam은 이 문맥에서 청원을 ‘들어 응답하다’라는 뜻이므로 ‘너희에게 응답하지 않겠습니다’가 자연스럽고 충실합니다.
  naturalness: 합쇼체를 유지하면서 인과 관계를 한 문장으로 자연스럽게 정리했습니다. ‘살인을 저지르는 데 재빠릅니다’는 한국어에서 자연스럽고, 발의 신속함이라는 비유를 보존합니다.
  terminology: ‘부르짖다’는 invocare의 하나님께 도움을 청하는 호소라는 문맥을 잘 드러냅니다. ‘피로 더럽혔고’와 ‘살인을 저지르다’는 도덕적 오염과 homicidia의 복수적·습관적 뉘앙스를 무리 없이 전달합니다.
  issues:
  - severity: medium
    issue: maculastis의 능동 행위가 수동 상태 서술로 바뀌어 있습니다.
    rationale: ‘너희 손은 피로 더럽혀졌고’는 결과 상태는 전달하지만, 원문이 직접 고발하는 ‘너희가 ... 더럽혔다’를 약화합니다.
  - severity: low
    issue: exaudiam에 관한 각주가 본문 끝의 [a]로 표시되어 선행하는 ‘듣지 않겠습니다’에 즉시 연결되지 않습니다.
    rationale: 본문을 ‘응답하지 않겠습니다’로 명료하게 옮기면 이 어휘 설명 각주는 불필요하며, 표지의 적용 범위 혼동도 피할 수 있습니다.
  revised_text: 너희가 나를 부르짖을 때에, 내가 너희에게 응답하지 않겠습니다. 이는 너희가 너희 손을 피로 더럽혔고, 너희 발은 살인을 저지르는 데 재빠르기 때문입니다.
