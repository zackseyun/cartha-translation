  yaml_path: translation/extra_canonical/2_esdras/001/026.yaml
  text: When you call upon me, I will not hear you, for you have defiled your hands with blood, and your feet are swift to commit murder.
translation:
  language: ko
  text: 너희가 나를 부를 때, 내가 너희의 말을 듣지 않겠습니다. 너희 손은 피로 더럽혀졌고, 너희 발은 살인을 저지르기에 날쌉니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 exaudiam은 단순 청취가 아니라 ‘응답하여 듣다’의 의미를 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Quando inuocabitis me
  english_pob_choice: When you call upon me
  chosen_korean: 너희가 나를 부를 때
  alternatives_korean:
  - 너희가 내게 부르짖을 때
  - 너희가 나를 찾을 때
  lexicon: invocare
  rationale: 단순한 ‘부름’보다 하나님께 도움을 청하는 호출의 뉘앙스를 살리되, 한국어에서 자연스러운 합쇼체로 정리했습니다.
- source_word: ego non exaudiam uos
  english_pob_choice: I will not hear you
  chosen_korean: 내가 너희의 말을 듣지 않겠습니다
  alternatives_korean:
  - 내가 너희를 듣지 않겠습니다
  - 내가 너희의 호소를 들어주지 않겠습니다
  lexicon: exaudire
  rationale: exaudire의 ‘응답하여 듣다’라는 의미를 단순 청취보다 명확히 드러내기 위해 ‘듣지 않겠습니다’로 옮겼습니다.
- source_word: maculastis enim manus uestras sanguine
  english_pob_choice: for you have defiled your hands with blood
  chosen_korean: 너희 손은 피로 더럽혀졌고
  alternatives_korean:
  - 너희 손은 피로 얼룩졌고
  - 너희 손은 피로 더럽혔기 때문입니다
  lexicon: maculare + sanguine
  rationale: ‘더럽히다/얼룩지다’는 의식적·도덕적 오염을 함께 살리며, 혈흔의 구체성과 죄책을 유지합니다.
- source_word: et pedes uestri inpigri sunt ad committenda homicidia
  english_pob_choice: and your feet are swift to commit murder
  chosen_korean: 너희 발은 살인을 저지르기에 날쌥니다
  alternatives_korean:
  - 너희 발은 살해하기에 재빠릅니다
  - 너희 발은 살인하는 데 민첩합니다
  lexicon: inpigri sunt ad committenda homicidia
  rationale: inpiger의 ‘민첩한/날랜’ 의미를 살려, 행위의 습속성과 즉각성을 한국어 관용에 맞게 표현했습니다.
theological_decisions:
- issue: 하나님의 응답 거절
  chosen_reading: 심판 상황에서의 거절된 응답으로 읽고, ‘듣지 않겠습니다’로 직설적으로 번역했습니다.
  alternative_readings:
  - ‘응답하지 않겠습니다’로 완화
  - ‘귀를 기울이지 않겠습니다’로 비유화
  rationale: 문맥상 기도 응답의 거절을 선명하게 드러내는 것이 원문의 경고성을 보존합니다.
  doctrine_reference: 예언적 심판 선포의 언어
