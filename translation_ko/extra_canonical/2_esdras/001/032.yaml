  text: I sent my servants the prophets to you, whom you received and killed and tore their bodies apart; their blood I will require, says the Lord.
translation:
  language: ko
  text: 내가 내 종들인 예언자들을 너희에게 보냈으나, 너희는 그들을 받아들이고 죽였으며 그들의 몸을 찢었습니다. 그들의 피를 내가 찾을 것입니다 — 주께서 말씀하십니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: acceptos는 ‘붙잡다’보다 ‘받다/받아들이다’에 가깝습니다.
    reason: lexical_alternative
  - marker: b
    text: exquiram은 문맥상 단순한 ‘요구’보다 책임 추궁과 보응의 의미를 함께 가집니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: misi
  english_pob_choice: I sent
  chosen_korean: 보냈으나
  alternatives_korean:
  - 보냈습니다
  - 보내었습니다
  lexicon: 보내다
  rationale: 라틴어 misi의 단순 과거를 자연스러운 서술로 옮기되, 문맥상 선지자들을 파송한 행위를 분명히 했습니다.
- source_word: pueros meos prophetas
  english_pob_choice: my servants the prophets
  chosen_korean: 내 종들인 예언자들을
  alternatives_korean:
  - 내 종들인 선지자들을
  - 내 종들인 예언자들
  lexicon: 종
  rationale: pueros meos는 직역하면 ‘내 소년들’이지만, POB 영어가 ‘servants’로 의미를 고정하므로 ‘종들’로 옮기고, prophets는 예언자의 기능을 살려 ‘예언자들’로 했습니다.
- source_word: acceptos
  english_pob_choice: whom you received
  chosen_korean: 너희는 그들을 받아들이고
  alternatives_korean:
  - 너희는 그들을 받았고
  - 너희는 그들을 영접했으나
  lexicon: 받아들이다
  rationale: revision pass가 지적한 대로 acceptos는 ‘붙잡다’보다 ‘받다/받아들이다’에 가깝기 때문에, 폭력의 시작을 ‘받아들이고’로 옮겨 원문의 긴장을 살렸습니다.
- source_word: quorum sanguinem exquiram
  english_pob_choice: their blood I will require
  chosen_korean: 그들의 피를 내가 찾을 것입니다
  alternatives_korean:
  - 그들의 피를 내가 요구할 것입니다
  - 그들의 피에 대해 내가 책임을 물을 것입니다
  lexicon: 찾다
  rationale: exquiram은 단순한 ‘요구하다’보다 법적·보응적 뉘앙스가 있어, 한국어의 ‘피를 찾다’로 옮겨 책임 추궁과 보복의 의미를 함께 드러냈습니다.
theological_decisions:
- issue: ‘주께서 말씀하십니다’의 화자 표지와 재판적 어조
  chosen_reading: 직접 인용문 뒤에 ‘주께서 말씀하십니다’를 붙여, 선지자 হত্য의 책임을 묻는 야훼의 선포가 계속되는 재판적 어조를 살렸습니다.
  alternative_readings:
  - ‘주님의 말씀입니다’
  - 인용부호 없이 서술
  rationale: 본문은 단순 서술이 아니라 신적 선언의 공적 선포이므로, 현대 한국어에서도 예언적 경고의 권위를 분명히 해야 합니다.
  doctrine_reference: 예언자 거절과 신적 심판 선언(구약 예언 전통)
