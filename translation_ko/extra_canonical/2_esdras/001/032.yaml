  to: 내가 내 종들인 예언자들을 너희에게 보냈습니다. 너희는 그들을 받아들인 뒤 죽이고 그들의 몸을 찢었습니다. 그들의 피를 내가 요구하겠습니다. 주님께서 말씀하십니다.[a]
