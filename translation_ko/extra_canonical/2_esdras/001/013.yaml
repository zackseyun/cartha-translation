  yaml_path: translation/extra_canonical/2_esdras/001/013.yaml
  text: Surely I brought you through the sea[a], and in trackless places I made roads secure for you.
  footnotes:
  - marker: a
    text: 'Or ''‘Thus says the Lord: I brought you through the sea, and in the trackless places I made firm roads for you.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 정말로 내가 너희를 바다로 지나가게 했고, 길 없는 곳에서는 너희를 위해 길들을 안전하게 했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nempe
  english_pob_choice: Surely
  chosen_korean: 정말로
  alternatives_korean:
  - 분명히
  - 실로
  - 확실히
  lexicon: Latin nempe
  rationale: 문장 첫머리의 강한 확언을 자연스러운 현대 한국어로 옮기되, 단순한 감탄이 아니라 사실을 강조하는 부사로 처리했습니다.
- source_word: mare traieci
  english_pob_choice: I brought you through the sea
  chosen_korean: 내가 너희를 바다로 지나가게 했고
  alternatives_korean:
  - 내가 너희를 바다를 건너게 했고
  - 내가 너희를 바다를 지나가게 했고
  lexicon: Latin traicere
  rationale: ‘지나가다’ 계열이 이동을 가장 직접적으로 드러내며, 출애굽적 통과의 의미를 과장 없이 전달합니다.
- source_word: plateas ... munitas
  english_pob_choice: made roads secure for you
  chosen_korean: 너희를 위해 길들을 안전하게 했습니다
  alternatives_korean:
  - 너희를 위해 길들을 굳게 했습니다
  - 너희를 위해 길들을 튼튼하게 했습니다
  lexicon: Latin plateae / munitas
  rationale: munitas의 ‘보호된, 안전하게 된’ 의미를 살려 결과 상태를 나타내는 한국어로 옮겼고, plateas는 구체적 지형보다 통로/길로 처리했습니다.
- source_word: in inuia
  english_pob_choice: in trackless places
  chosen_korean: 길 없는 곳에서는
  alternatives_korean:
  - 길이 없는 곳에서는
  - 길이 트이지 않은 곳에서는
  lexicon: Latin inuia
  rationale: ‘trackless’의 핵심은 길의 부재이므로, 본문의 대조 구조를 살려 간결하게 번역했습니다.
theological_decisions:
- issue: v.13은 야훼의 출애굽 구원 행위를 회상하는 진술이라는 점
  chosen_reading: 화자의 확언을 살려, 역사적 구원 행위 자체를 강조하는 문장으로 번역했습니다.
  alternative_readings:
  - 예언적 서두를 덧붙여 ‘주님이 말씀하십니다’ 식으로 처리하는 방식
  rationale: 라틴 본문에는 서두의 ‘주께서 말씀하신다’가 없으므로, 본문의 직접 진술을 흐리지 않도록 했습니다.
  doctrine_reference: 문맥 우선 원칙; 본문 비삽입 원칙
