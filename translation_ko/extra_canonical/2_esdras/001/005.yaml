source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vade et nuntia populo meo facinora ipsorum et filiis eorum iniquitates, quas in me admiserunt, ut nuntient filiis filiorum suorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/005.yaml
  text: “Go and declare to my people their evil deeds, and to their children the iniquities that they have committed against me, so that they may tell their children's children.
translation:
  language: ko
  text: 가서 내 백성에게 그들의 악행을 알리고, 그 자녀들에게는 그들이 나에게 범한 불의를 알리십시오. 그들이 자기 자녀의 자녀들에게 알리도록 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Vade
  english_pob_choice: Go
  chosen_korean: 가서
  alternatives_korean:
  - 가십시오
  - 가라
  lexicon: vado
  rationale: 명령형 동사로서 단순하고 직접적인 출발 동작을 살려 ‘가서’로 옮겼습니다.
- source_word: nuntia
  english_pob_choice: declare
  chosen_korean: 전하여
  alternatives_korean:
  - 선포하여
  - 알려
  lexicon: nuntio
  rationale: 공적 선언의 뉘앙스를 유지하되, 뒤의 ‘말하게 하십시오’와 자연스럽게 이어지도록 중립적인 ‘전하여’를 선택했습니다.
- source_word: populo meo
  english_pob_choice: my people
  chosen_korean: 내 백성에게
  alternatives_korean:
  - 내 백성에게는
  - 나의 백성에게
  lexicon: populus
  rationale: 직역에 가깝게 ‘내 백성’으로 옮겨 소유·관계 표지를 분명히 했습니다.
- source_word: facinora ipsorum / iniquitates
  english_pob_choice: their evil deeds / the iniquities
  chosen_korean: 그들의 악한 행위 / 그들이 내게 저지른 불의
  alternatives_korean:
  - 그들의 악행 / 그들의 죄악
  - 그들이 저지른 불법
  lexicon: facinus, iniquitas
  rationale: 두 표현의 반복을 살리면서도, 첫 항은 일반적 ‘악한 행위’, 둘째 항은 하나님을 향한 위반성을 드러내는 ‘내게 저지른 불의’로 구분했습니다.
- source_word: ut nuntient filiis filiorum suorum
  english_pob_choice: so that they may tell their children's children
  chosen_korean: 그들의 자녀의 자녀에게 말하게 하십시오
  alternatives_korean:
  - 손자들에게 전하게 하십시오
  - 자자손손에게 말하게 하십시오
  lexicon: ut + nuntio
  rationale: 미래 세대에 전승하라는 목적절을 직역에 가깝게 유지하면서, 한국어로 자연스럽게 읽히도록 ‘자녀의 자녀’로 옮겼습니다.
theological_decisions:
- issue: 2인칭 명령형의 공적 전달 register
  chosen_reading: 주어진 사명을 수행하는 전달 명령으로 보고, 본문 전체를 합쇼체의 명령·청유형으로 통일했습니다.
  alternative_readings:
  - 직설적 반말 명령
  - 더 강한 선포체 표현
  rationale: 예언적/전달적 명령을 현대 한국어 독자에게 공적으로 전달하기 위해 합쇼체가 가장 적절합니다.
  doctrine_reference: 'POB style guide: modern formal-polite imperative in narrative translation'
