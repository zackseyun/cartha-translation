id: 2ES.1.30
reference: 2 Esdras 1:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: collegi ut gallina pullos suos sub alas suas. modo autem quid faciam uobis ? proiciam uos a facie mea. Oblationes mihi cum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/001/030.yaml
  text: Thus I gathered you as a hen gathers her chicks under her wings[a]. But now what shall I do with you? I will cast you out from before my face.
  footnotes:
  - marker: a
    text: Or 'I gathered you'.
    reason: previous_rendering
translation:
  language: ko
  text: 이처럼 내가 너희를 암탉이 자기 새끼들을 날개 아래로 모으듯 모았습니다[a]. 그런데 이제 내가 너희에게 무엇을 하겠습니까? 나는 너희를 내 앞에서 쫓아내겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너희를 모았습니다.’
    reason: 앞 절 끝의 ita(‘이처럼’)를 현 절 첫 문장과 연결하지 않는 대안적 절 구분/번역을 반영합니다.
lexical_decisions:
- source_word: collegi
  english_pob_choice: Thus I gathered you
  chosen_korean: 그리하여 나는 너희를 ... 모았습니다
  alternatives_korean:
  - 나는 너희를 모았습니다
  - 그리하여 나는 너희를 모으셨습니다
  lexicon: collegi → 모으다/모았습니다
  rationale: 문맥상 단순한 집합보다 보호와 회복을 동반한 ‘모으다’가 적절하며, 앞 절의 연결어 ‘Ita’에 해당하는 ‘그리하여’를 살려 논리 흐름을 드러냈습니다.
- source_word: ut gallina pullos suos sub alas suas
  english_pob_choice: as a hen gathers her chicks under her wings
  chosen_korean: 암탉이 자기 새끼들을 자기 날개 아래로 모으듯이
  alternatives_korean:
  - 어미 닭이 자기 새끼들을 날개 아래로 모으듯이
  - 암탉이 제 병아리들을 날개 아래 품듯이
  lexicon: ut + 비교구문 / gallina / pullos / sub alas
  rationale: 비교구문을 자연스러운 한국어로 옮기기 위해 ‘-듯이’를 사용했고, ‘pullos’는 성체가 아닌 어린 새를 가리키므로 ‘새끼들’이 본문에 더 가깝습니다.
- source_word: proiciam uos a facie mea
  english_pob_choice: I will cast you out from before my face
  chosen_korean: 나는 너희를 내 얼굴 앞에서 쫓아내겠습니다
  alternatives_korean:
  - 나는 너희를 내 얼굴 앞에서 내쫓겠습니다
  - 나는 너희를 내 면전에서 던져 버리겠습니다
  lexicon: proiciam + a facie mea
  rationale: ‘proiciam’의 강한 배척 의미를 살리면서도 현대 한국어에서 문맥상 분명한 ‘쫓아내다’로 옮겼고, ‘a facie mea’는 의례적 표현인 ‘내 얼굴 앞에서’로 직역해 원문의 긴장을 유지했습니다.
theological_decisions:
- issue: 신적 화자와 심판 선언의 톤
  chosen_reading: 자비로운 모음의 이미지 뒤에 즉각적인 추방 선언을 병치하여, 본문의 위로와 심판이 함께 있다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 부드럽게 풀어 위협성을 약화시키는 번역
  - ‘내 앞에서 버리겠다’처럼 더 완곡한 처리
  rationale: 원문은 보호의 비유와 배척 선언을 같은 호흡 안에 두므로, 둘 중 하나를 약화하면 서술 의도가 흐려집니다.
  doctrine_reference: 신적 자비와 심판의 동시성
- issue: 대상 지시의 직접성
  chosen_reading: 2인칭 복수 ‘너희’를 일관되게 유지해 공동체 전체를 향한 직접 경고임을 드러냈습니다.
  alternative_readings:
  - 개별화된 ‘너희들’
  - 완곡한 ‘여러분’
  rationale: 문맥은 공동체 전체를 향한 집단적 발화이므로, 합쇼체를 유지하되 대상의 집단성을 분명히 했습니다.
  doctrine_reference: 예언적/심판적 집단 خطاب
