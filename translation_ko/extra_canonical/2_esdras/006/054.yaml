id: 2ES.6.54
reference: 2 Esdras 6:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et super his Adam quem constituisti ducem super omnibus factis quae fecisti, et ex eo educimur nos omnes quem elegisti populum. Haec autem omnia dixi coram te, domine, quoniam dixisti quia propter nos creasti primogenitum saeculum. Residuas autem gentes ab Adam natas dixisti eas nihil esse et quoniam saliuae adsimilatae sunt et sicut stillicidium de uaso similasti habundantiam eorum. Et nunc, domine, ecce istae gentes quae in nihilum deputatae sunt dominantur nostri et deuorant nos. Nos autem populus tuus quem uocasti primogenitum, unigenitum, aemulatorem, carissimum traditi sumus in manibus eorum. Et si propter nos creatum est saeculum, quare non haereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/054.yaml
  text: And over these is Adam[a], whom you appointed ruler over all the works that you made; and from him we all have come, the people whom you have chosen.
  footnotes:
  - marker: a
    text: Or 'From him we all have come, and the people whom you have chosen.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이들 위에 아담이 계시니, 곧 주께서 지으신 모든 일의 통치자로 세우신 분입니다. 그에게서 우리 모두가 나왔습니다. 곧 주께서 택하신 백성입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Adam
  english_pob_choice: Adam
  chosen_korean: 아담
  alternatives_korean:
  - 아담 사람
  - 첫 사람
  lexicon: 고유명사
  rationale: 원문은 아담을 인류의 기원으로 제시하므로 통상적 성경 표기인 ‘아담’을 유지했습니다.
- source_word: constituisti ducem
  english_pob_choice: whom you appointed ruler
  chosen_korean: 통치자로 세우신 분
  alternatives_korean:
  - 다스리는 자로 세우신 분
  - 지도자로 세우신 분
  lexicon: ducem
  rationale: dux는 단순한 안내자가 아니라 지배·통치를 맡은 자를 가리키므로 ‘통치자’가 원문의 권위성을 가장 잘 드러냅니다.
- source_word: ex eo educimur nos omnes
  english_pob_choice: from him we all have come
  chosen_korean: 그에게서 우리 모두가 나왔습니다
  alternatives_korean:
  - 그에게서 우리 모두가 비롯되었습니다
  - 그에게서 우리 모두가 생겨났습니다
  lexicon: educi / ex eo
  rationale: 라틴어는 기원과 출처를 말하므로 ‘나왔습니다’가 혈통적·기원적 의미를 간결하게 살립니다.
- source_word: quem elegisti populum
  english_pob_choice: the people whom you have chosen
  chosen_korean: 주께서 택하신 백성입니다
  alternatives_korean:
  - 주께서 선택하신 백성입니다
  - 주께서 고르신 백성입니다
  lexicon: populus / eligere
  rationale: POB의 영어 흐름상 ‘we all’이 곧 선택된 백성이라는 동격 구조이므로, 이를 한국어에서도 분리하지 않고 한 문장으로 옮겼습니다.
theological_decisions:
- issue: ‘우리 모두’와 ‘주께서 택하신 백성’의 문장 관계
  chosen_reading: 두 표현을 동격으로 처리하여, ‘우리 모두’가 곧 ‘주께서 택하신 백성’임을 드러냈습니다.
  alternative_readings:
  - ‘우리 모두가 나왔습니다. 그리고 주께서 택하신 백성입니다.’처럼 두 진술로 분리하는 읽기
  rationale: 수정 이력과 라틴어 구문상 두 표현을 분리하면 논증이 흐려지므로, 선택된 백성이 아담에게서 나온다는 논지를 유지했습니다.
  doctrine_reference: 본문의 혈통·선택 논증 유지
