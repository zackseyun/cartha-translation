id: 2ES.6.37
reference: 2 Esdras 6:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: inflammabatur enim spiritus meus valde et anima mea anxiabatur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/037.yaml
  text: For my spirit was greatly inflamed, and my soul was distressed.
translation:
  language: ko
  text: 내 영이 크게 타올랐고, 내 혼이 몹시 괴로웠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: inflammabatur ... spiritus meus valde
  english_pob_choice: my spirit was greatly inflamed
  chosen_korean: 내 영이 크게 타올랐고
  alternatives_korean:
  - 내 영이 크게 불탔고
  - 내 영이 몹시 격해졌고
  lexicon: spiritus → 영
  rationale: 라틴어 spiritus는 여기서 인간의 내적 생기/영을 가리키므로, 교리적 표지가 없는 한 ‘성령’이 아니라 ‘영’으로 옮기고, 불타오르는 이미지는 수동형을 살려 ‘타올랐다’로 표현했습니다.
- source_word: anima mea anxiabatur
  english_pob_choice: my soul was distressed
  chosen_korean: 내 혼이 몹시 괴로웠습니다
  alternatives_korean:
  - 내 영혼이 몹시 괴로웠습니다
  - 내 마음이 몹시 괴로웠습니다
  lexicon: anima → 혼
  rationale: anima는 전통적 종교어인 ‘영혼’도 가능하지만, 라틴어 원문의 생명/내면 전체를 가리키는 범위를 살려 ‘혼’으로 옮겼고, anxiabatur는 압박과 고통의 상태를 ‘괴로웠습니다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: spiritus와 anima의 이중 표현
  chosen_reading: ‘영’과 ‘혼’을 구분해 두 차례의 내적 고통을 병렬로 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘영혼’으로 통일
  - 둘 다 ‘마음’으로 완화
  rationale: 원문은 감정의 중복이 아니라 내적 존재의 서로 다른 측면을 병렬로 제시하므로, 의미 차이를 지우지 않도록 한국어에서도 구별을 유지했습니다.
  doctrine_reference: 인간 내면의 다층적 표현을 보존하는 번역 원칙
