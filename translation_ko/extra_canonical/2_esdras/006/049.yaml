  yaml_path: translation/extra_canonical/2_esdras/006/049.yaml
  text: 'Then you preserved two living creatures: the name of the one you called Behemoth[a], and the name of the second you called Leviathan.'
  footnotes:
  - marker: a
    text: Behemoth and Leviathan are primeval creatures known from Jewish scriptural and post-scriptural tradition; here they function as preserved creatures within Ezra's retelling of creation.
    reason: cross_reference
    anchor_ref: '6:49'
translation:
  language: ko
  text: 그때 주께서는 두 생물을 보존하셨습니다. 하나의 이름은 베헤못이라 부르셨고, 둘째의 이름은 리워야단이라 부르셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 베헤못과 리워야단은 유대교 성경 및 성경 이후 전통에 나오는 원초적 존재들로, 여기서는 에스라의 창조 재서술 안에서 보존된 피조물로 기능합니다.
    reason: cross_reference
lexical_decisions:
- source_word: duo animalia
  english_pob_choice: two living creatures
  chosen_korean: 두 생물
  alternatives_korean:
  - 두 짐승
  - 두 կենդ물
  - 두 살아 있는 피조물
  lexicon: animalia
  rationale: 라틴어 animalia는 단순한 ‘동물’보다 살아 있는 생물 전체를 가리킬 수 있어, 영어 POB의 ‘living creatures’를 반영해 자연스럽게 ‘생물’로 옮겼습니다.
- source_word: conseruasti
  english_pob_choice: you preserved
  chosen_korean: 보존하셨습니다
  alternatives_korean:
  - 지키셨습니다
  - 간직하셨습니다
  - 남겨 두셨습니다
  lexicon: conseruare
  rationale: 문맥상 창조 서술 안에서 두 존재를 계속 존재하게 하신 행위를 나타내므로, 단순한 보호보다 보존의 의미가 살아 있는 ‘보존하셨습니다’를 택했습니다.
- source_word: nomen uni uocasti Behemoth
  english_pob_choice: the name of the one you called Behemoth
  chosen_korean: 하나의 이름은 베헤못이라 부르셨고
  alternatives_korean:
  - 한쪽 이름은 베헤못이라 부르셨고
  - 하나는 베헤못이라 이름 붙이셨고
  lexicon: uocare + nomen
  rationale: ‘이름을 부르다/이름하다’의 서술을 유지하되, 한국어에서는 자연스럽게 ‘베헤못이라 부르셨고’로 처리해 명명 행위를 드러냈습니다.
- source_word: Leviathan
  english_pob_choice: Leviathan
  chosen_korean: 리워야단
  alternatives_korean:
  - 레비아단
  - 리바야단
  lexicon: proper noun
  rationale: 한국어 성서·학술 표기를 따르되, 음역상 친숙성과 본문 전통을 고려해 ‘리워야단’을 사용했습니다.
theological_decisions:
- issue: 베헤못과 리워야단의 서술 기능
  chosen_reading: 이 둘을 단순한 상징이 아니라 에스라의 창조 회고 속에서 보존된 피조물로 읽었습니다.
  alternative_readings:
  - 신화적 괴수로만 읽는 해석
  - 순전히 상징적 우주 질서의 표상으로 읽는 해석
  rationale: 영어 POB 주석이 이들을 ‘preserved creatures within Ezra's retelling of creation’으로 설명하므로, 본문 기능을 보존된 실재적 존재로 드러내는 번역을 유지했습니다.
  doctrine_reference: source_note
