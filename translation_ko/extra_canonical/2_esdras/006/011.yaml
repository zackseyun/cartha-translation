  lexicon: finis / signum
  rationale: signa를 단순한 물리적 ‘표시’가 아니라 종말론적 ‘표징’으로 옮겨, ‘끝’이 단순 종결이 아니라 계시의 완결 지점을 뜻한다는 점을 살렸습니다.
