  lexicon: servus
  rationale: 청원자 자신을 가리키는 종말론적 기도 문맥에서 표준적인 ‘종’이 가장 적절하며, 본문이 노예 상태를 강조하는 용례는 아닙니다.
- source_word: finem signorum
