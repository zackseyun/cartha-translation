source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ante oculos tuos, Vt demonstres seruo tuo finem signorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/011.yaml
  text: before your eyes[a], that you may show your servant the end of the signs
  footnotes:
  - marker: a
    text: Or 'Then I answered and said, “O Lord who rules, if I have found favor before your eyes,'.
    reason: previous_rendering
translation:
  language: ko
  text: 주의 앞에서, 당신의 종에게 표징들의 끝을 보여 주시도록 하려는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ante oculos tuos
  english_pob_choice: before your eyes
  chosen_korean: 주의 앞에서
  alternatives_korean:
  - 당신의 눈앞에
  - 당신의 눈앞에서
  - 주의 눈앞에서
  lexicon: ante oculos
  rationale: 직역상 ‘눈앞에’이지만, 하나님께 드리는 청원 문맥에서는 자연스러운 경어를 유지하면서도 ‘앞에서’라는 공적·직면적 의미를 살렸습니다.
- source_word: servo tuo
  english_pob_choice: your servant
  chosen_korean: 당신의 종에게
  alternatives_korean:
  - 당신의 노예에게
  - 당신의 하인에게
  - 당신의 종
  lexicon: servus
  rationale: 청원자 자신을 가리키는 종말론적 기도 문맥에서 표준적인 ‘종’이 가장 적절하며, 본문이 노예 상태를 강조하는 용례는 아닙니다.
- source_word: finem signorum
  english_pob_choice: the end of the signs
  chosen_korean: 표징들의 끝
  alternatives_korean:
  - 징조들의 끝
  - 표적들의 끝
  - 기호들의 끝
  lexicon: finis / signum
  rationale: signa를 단순한 물리적 ‘표시’가 아니라 종말론적 ‘표징’으로 옮겨, ‘끝’이 단순 종결이 아니라 계시의 완결 지점을 뜻한다는 점을 살렸습니다.
theological_decisions:
- issue: 하나님께 드리는 직접 청원의 경어 수준
  chosen_reading: 본문 전체를 합쇼체로 유지하되, 하나님을 향한 요청 동사는 ‘보여 주시도록’처럼 높임을 사용했습니다.
  alternative_readings:
  - 보다 직접적인 명령형/간청형
  - 더 평서적인 서술형
  rationale: 원문은 간청의 목적절이므로, 한국어에서는 하나님께 드리는 정중한 청원 형식이 본문의 기도적 성격을 가장 잘 드러냅니다.
  doctrine_reference: 경건한 기도 문맥의 화법
