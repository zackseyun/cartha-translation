  source_fidelity: 현 번역의 ‘주의 앞에서’는 라틴어 ante oculos tuos(‘당신의 눈앞에서’)의 ‘눈’과 2인칭 소유를 약화합니다. 또한 ‘보여 주시도록 하려는 것입니다’는 원문의 목적 접속법 ut demonstres에 없는 ‘하려는 것입니다’를 첨가합니다. ‘표징들의 끝’은 finem signorum을 적절히 반영합니다.
  naturalness: ‘주님의 눈앞에서’와 ‘주님의 종에게’는 현대 표준어의 정중한 종교 문맥에 자연스럽습니다. 본절은 앞 절의 조건절 및 발화와 이어지는 문장 조각이므로, 목적을 나타내는 ‘보여 주시도록’으로 종결하지 않고 연결 형태를 보존했습니다.
