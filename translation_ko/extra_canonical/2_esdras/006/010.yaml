translation:
  language: ko
  text: “다른 것은[a] 묻지 마십시오, 에스라.” 내가 대답하여 말했습니다. “오, 다스리시는 주님, 제가 은혜를 얻었다면…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “다른 것을 더 묻지 마십시오, 에스라.”
    reason: aliud noli querere의 ‘그 밖의 것을 더 묻지 말라’는 뉘앙스를 제시하는 대안 번역입니다.
lexical_decisions:
- source_word: aliud noli querere
  english_pob_choice: Do not ask anything else, Ezra.
  chosen_korean: 다른 것은 묻지 말아라, 에스라.
  alternatives_korean:
  - 그 밖의 것은 묻지 말아라, 에스라.
  - 더는 아무것도 묻지 말아라, 에스라.
  lexicon: aliud / noli querere
  rationale: aliud는 “다른 것”이 자연스럽고, noli querere는 금지 명령으로 옮겨 구어체 명령형을 살렸습니다.
- source_word: dominator domine
  english_pob_choice: O Lord who rules
  chosen_korean: 오, 다스리시는 주님
  alternatives_korean:
  - 오, 주권자 주님
  - 오, 다스리는 주님
  lexicon: dominator domine
  rationale: dominator는 단순한 호칭 “주”보다 통치·주권의 뜻이 강하므로 “다스리시는”으로 풀어 원문 어감을 드러냈습니다.
- source_word: si inueni gratiam
  english_pob_choice: if I have found favor
  chosen_korean: 제가 은혜를 얻었다면
  alternatives_korean:
  - 제가 호의를 얻었다면
  - 제가 은총을 얻었다면
  lexicon: si invenire gratiam
  rationale: 라틴어 관용구를 한국어 성서 문체의 “은혜를 얻다”로 옮겨, 단순한 호의보다 호의적 수용의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 호칭의 위계와 직접성
  chosen_reading: dominator domine를 신적 통치성을 드러내는 “다스리시는 주님”으로 옮겼습니다.
  alternative_readings:
  - “주권자 주님”으로 더 직역할 수 있습니다.
  - “주님, 다스리시는 분”으로 풀어쓸 수 있습니다.
  rationale: 이 문맥은 단순 예우가 아니라 하나님께 대한 호칭이므로, 통치성을 약화하지 않으면서도 한국어로 자연스럽게 들리게 했습니다.
  doctrine_reference: 신적 칭호의 번역 일관성
