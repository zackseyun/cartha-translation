  source_fidelity: 라틴어 veni는 완료형(‘왔습니다’)인데, 초안의 ‘와서 … 보여 주려고 합니다’는 현재의 의도를 나타내어 원문의 도착 행위를 충분히 반영하지 못합니다. 또한 tibi는 ‘네게/당신에게’로 명시하는 것이 좋습니다. ‘오늘 밤에’는 본문의 훼손 가능성과 다음 절의 시간 대비를 고려한 영어 POB의 채택을 자연스럽게 반영합니다.
  naturalness: ‘내게’와 ‘오늘 밤에 네게 이 일들을 보여 주려고 왔습니다’는 현대 표준 한국어의 자연스러운 합쇼체 서술입니다.
  terminology: haec는 문맥상 ‘이 일들’, ostendere는 ‘보여 주다’가 적절합니다. 신학 용어상의 문제는 없습니다.
