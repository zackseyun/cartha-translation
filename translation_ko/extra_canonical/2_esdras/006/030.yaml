  yaml_path: translation/extra_canonical/2_esdras/006/030.yaml
  text: And he said to me[a], “I have come to show you these things tonight.”
  footnotes:
  - marker: a
    text: Or 'and in the coming night.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 나에게 말했습니다. 「내가 와서 이 일들을 오늘 밤에 보여 주려고 합니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승 라틴어는 훼손되어 있으며, 의미상 ‘오늘 밤에’ 또는 ‘다가오는 밤에’로 읽을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: haec
  english_pob_choice: these things
  chosen_korean: 이 일들
  alternatives_korean:
  - 이것들
  - 이것들에 관해
  - 이것들 모두
  lexicon: haec → these things
  rationale: 지시대명사 haec는 앞뒤 문맥의 계시 내용을 가리키므로, 한국어에서는 가장 자연스럽게 ‘이 일들’로 옮겨 내용 전체를 지시하게 했습니다.
- source_word: ostendere
  english_pob_choice: show
  chosen_korean: 보여 주려고 합니다
  alternatives_korean:
  - 보이려고 합니다
  - 드러내려고 합니다
  - 알려 주려고 합니다
  lexicon: ostendere → show, reveal
  rationale: 단순한 ‘보이다’보다 계시의 적극성을 살려 ‘보여 주다’로 옮겼습니다. 문맥상 계시를 전달하는 행위이므로 미래 의도를 나타내는 ‘-려고 합니다’를 사용했습니다.
- source_word: venturae nocti / hac ventura nocte
  english_pob_choice: tonight
  chosen_korean: 오늘 밤에
  alternatives_korean:
  - 이번 밤에
  - 다가오는 밤에
  - 이제 올 밤에
  lexicon: venturae nocti → this coming night / tonight
  rationale: 전승 라틴어의 형태는 전승상 훼손되었지만, POB 감사 기록이 지시하듯 의미는 ‘오늘 밤’으로 읽는 것이 가장 자연스럽고, 바로 다음 절의 시간 대비도 살릴 수 있습니다.
theological_decisions:
- issue: 계시의 시간 표현
  chosen_reading: ‘오늘 밤에’로 옮겨, 가까운 시점에 주어질 계시라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘다가오는 밤에’
  - ‘이 밤에’
  rationale: 본문은 장래의 특정 시점에 대한 계시를 말하므로, 한국어 독자가 즉시 이해할 수 있는 자연스러운 시간 부사구를 택했습니다.
  doctrine_reference: 계시서술의 시점 정확성
