id: 2ES.6.34
reference: 2 Esdras 6:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et noli festinare in prioribus temporibus cogitare vana, ut non properes a novissimis temporibus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/034.yaml
  text: and do not hasten to think vain thoughts about the former times[a][b], so that you may not be hasty concerning the last times.’”
  footnotes:
  - marker: b
    text: The warning is textually difficult. The sense is a prohibition against impatient, empty speculation about earlier times that would distort Ezra's relation to the last times.
    reason: textual_variant
    anchor_ref: '6:34'
  - marker: a
    text: Or 'so that you may not hasten away from the last times.’”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 지난 시대들에 관하여 헛된 생각을 하려고 서두르지 마십시오. 그러면 마지막 시대들에 관하여 성급해지지 않을 것입니다.’”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘마지막 시대들에서 벗어나지 않도록.’
    reason: previous_rendering
  - marker: b
    text: 이 경고는 본문상 해석하기 까다롭습니다. 이는 에스라가 지난 시대들에 관하여 조급하고 헛된 추측을 하여 마지막 시대들과 관련하여 성급해지지 말라는 뜻으로 이해될 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: et noli festinare
  english_pob_choice: and do not hasten
  chosen_korean: 서두르지 말아라
  alternatives_korean:
  - 서두르지 마십시오
  - 급히 서두르지 말아라
  lexicon: festinare
  rationale: 라틴어 festinare의 빠른 움직임과 조급함을 살려, 합쇼체의 직접 명령으로 자연스럽게 옮겼습니다.
- source_word: in prioribus temporibus
  english_pob_choice: about the former times
  chosen_korean: 이전 시대들에 대해
  alternatives_korean:
  - 옛날에 대해
  - 먼저 있던 때들에 대해
  lexicon: prioribus temporibus
  rationale: 시간의 순서를 가리키는 복수 표현을 살려 ‘이전 시대들’로 옮기고, 전치사 in은 이 문맥에서 ‘대해’의 대상으로 처리했습니다.
- source_word: cogitare vana
  english_pob_choice: to think vain thoughts
  chosen_korean: 헛된 생각을 하려고
  alternatives_korean:
  - 헛된 것들을 생각하려고
  - 공허한 생각을 하려고
  lexicon: cogitare vana
  rationale: vana는 단순히 ‘헛되다’는 뜻뿐 아니라 내용이 공허하고 무익한 사유를 가리키므로 ‘헛된 생각’으로 간결하게 살렸습니다.
- source_word: a novissimis temporibus
  english_pob_choice: concerning the last times
  chosen_korean: 마지막 시대에 대해
  alternatives_korean:
  - 끝날에 관해
  - 종말의 때에 대해
  lexicon: novissimis temporibus
  rationale: en POB의 수정 취지대로 a를 분리의 ‘~에서’가 아니라 관계의 ‘~에 대해’로 이해해, 앞구절과 평행을 이루는 종말 지시로 옮겼습니다.
theological_decisions:
- issue: ‘이전 시대들’과 ‘마지막 시대’의 대비
  chosen_reading: 본문은 창조 초기와 종말의 때를 대비시키며, 에스라에게 조급한 추측을 경계하게 합니다.
  alternative_readings:
  - 과거와 미래를 일반적으로 대비하는 교훈
  - 마지막 시대를 피하라는 뜻으로 읽는 해석
  rationale: 영문 POB의 주석과 개정 이력이 지적하듯, 이 문장은 시기 계산이나 도피가 아니라 인내와 절제를 요구하는 대비 구조입니다.
  doctrine_reference: 종말론적 인내
- issue: a novissimis temporibus의 해석
  chosen_reading: ‘마지막 시대에 대해’로 번역해, 종말을 ‘멀리하려는 것’이 아니라 ‘관해 성급해지는 것’을 금합니다.
  alternative_readings:
  - 마지막 시대에서 벗어나지 않도록
  - 마지막 시대를 향해 서두르지 않도록
  rationale: 라틴어 전치사 a를 장소적 분리로 읽으면 평행 구조가 무너지고 문맥에 어긋나므로, 관계·대상 의미로 처리하는 것이 source-grounded입니다.
  doctrine_reference: 문맥적 평행법
- issue: 직접 명령의 어조
  chosen_reading: 합쇼체의 직접 금지 명령으로 ‘서두르지 말아라’를 사용했습니다.
  alternative_readings:
  - 서두르지 마십시오
  - 서두르지 마라
  rationale: 원문의 noli는 강한 금지 명령이므로, 현대 한국어에서 자연스럽고 공적 문체인 합쇼체로 대응했습니다.
  doctrine_reference: 문체 일관성
