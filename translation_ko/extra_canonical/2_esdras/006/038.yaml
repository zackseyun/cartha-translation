base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/038.yaml
  text: And I said[a], “O Lord, from the beginning of creation, on the first day, you spoke, saying, ‘Let heaven and earth be made,’ and your word accomplished the work.”
  footnotes:
  - marker: a
    text: Or 'you spoke'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 말했습니다. “주님, 창조의 시작, 곧 첫째 날에 당신께서는 분명히 말씀하시기를, ‘하늘과 땅이 생겨라’ 하셨고, 당신의 말씀이 그 일을 이루었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 loquens locutus es는 문자적으로 ‘말하면서 말씀하셨다’라는 강조 구조입니다.
    reason: source_note
lexical_decisions:
- source_word: et dixi
  english_pob_choice: And I said
  chosen_korean: 그리고 제가 말했습니다
  alternatives_korean:
  - 그리고 제가 말하였습니다
  - 그리고 제가 말해 드렸습니다
  lexicon: dixi
  rationale: 서술문의 자연스러운 회상형 표현으로 옮기되, 합쇼체를 유지해 구어적 직역감과 문어성을 균형 있게 살렸습니다.
- source_word: ab initio creaturae in primo die
  english_pob_choice: from the beginning of creation, on the first day
  chosen_korean: 창조의 시작부터 첫째 날에
  alternatives_korean:
  - 창조가 시작될 때 첫째 날에
  - 창조의 처음부터 첫째 날에
  lexicon: ab initio creaturae / in primo die
  rationale: 라틴어 어순을 따라 ‘창조의 시작부터’와 ‘첫째 날에’를 분리해 배치하여 시간적 배경과 강조점을 보존했습니다.
- source_word: fiat caelum et terra
  english_pob_choice: Let heaven and earth be made
  chosen_korean: ‘하늘과 땅이 지어지게 하소서’
  alternatives_korean:
  - ‘하늘과 땅이 만들어지게 하소서’
  - ‘하늘과 땅이 있게 하소서’
  lexicon: fiat caelum et terra
  rationale: fiat의 수동적 명령/허용 뉘앙스를 살려 ‘지어지게 하소서’로 옮겼고, 창조 행위의 결과를 드러내는 표현으로 다듬었습니다.
- source_word: tuum verbum opus perfecit
  english_pob_choice: your word accomplished the work
  chosen_korean: 당신의 말씀이 그 일을 이루었습니다
  alternatives_korean:
  - 당신의 말씀이 그 일을 완성했습니다
  - 당신의 말씀이 그 일을 끝마쳤습니다
  lexicon: tuum verbum opus perfecit
  rationale: verbum을 단순한 ‘말’보다 창조적 효력을 지닌 ‘말씀’으로, perfecit을 결과 완성의 의미를 살린 ‘이루었습니다’로 옮겼습니다.
theological_decisions:
- issue: 창조 명령의 화자와 말씀의 효력
  chosen_reading: 창조는 하나님의 말씀에 의해 이루어졌고, 그 말씀이 실제로 일을 성취했다는 점을 분명히 드러냈습니다.
  alternative_readings:
  - 하나님이 말씀이 아니라 단지 명령을 내리셨다는 식으로 완화하는 번역
  - 말씀이 단순한 정보 전달로 보이게 하는 번역
  rationale: 본문은 말씀 자체의 창조적 কার্যক্ষম을 말하므로, 이를 약화하지 않고 ‘당신의 말씀이 그 일을 이루었습니다’로 유지했습니다.
  doctrine_reference: 창 1:3; 시 33:6, 9; 요 1:1-3
