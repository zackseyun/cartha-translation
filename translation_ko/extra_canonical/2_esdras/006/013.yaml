  source_fidelity: 초안은 화자의 응답, 일어서라는 명령, 그리고 충만하고 울리는 음성을 듣는다는 핵심을 전달합니다. 다만 ‘소리가 가득한, 우렁찬 음성’은 라틴어의 난해한 결합을 중복적으로 풀어 자연스러움이 떨어집니다. ‘소리로 가득한 음성’이라는 대안적 직역 가능성을 각주로 보존하면서 본문에서는 ‘가득 울려 퍼지는 음성’으로 옮기는 것이 원문의 강도와 영어 POB의 의미를 더 자연스럽게 반영합니다.
