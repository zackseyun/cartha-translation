  lexicon: commovere
  rationale: 남아 있는 라틴어 전후 문맥이 명령형의 자세 지시를 가리키므로, 자연스러운 한국어 명령으로 ‘네 발로 서라’를 택했습니다.
- source_word: uocem
  english_pob_choice: voice
  chosen_korean: 음성
