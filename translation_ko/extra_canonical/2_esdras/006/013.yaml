  terminology: ‘음성’은 계시 장면의 vox에 적절합니다. ‘가득 울려 퍼지는 음성’은 plenissimam 및 sonus의 울림을 살리되 부자연스러운 ‘소리가 가득한, 우렁찬’의 병렬을 피합니다.
