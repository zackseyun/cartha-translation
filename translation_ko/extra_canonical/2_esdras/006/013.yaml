    reason: previous_rendering
lexical_decisions:
- source_word: uocem plenissimam sonus
  english_pob_choice: a full, resounding voice
  chosen_korean: 소리가 가득한, 우렁찬 음성
  alternatives_korean:
  - 소리로 가득한 음성
  - 충만한 음성
  - 아주 가득한 소리의 음성
  lexicon: uocem / sonus / plenissimam
  rationale: 라틴어의 직역적 어색함을 피하면서도 ‘plenissimam’의 최대화 표현과 ‘sonus’의 울림을 함께 살리기 위해 ‘소리가 가득한, 우렁찬 음성’으로 옮겼습니다.
- source_word: commotione commoue-
  english_pob_choice: Stand upon your feet
  chosen_korean: 네 발로 서라
  alternatives_korean:
  - 일어서라
  - 네 발로 굳게 서라
  - 네 두 발로 서라
  lexicon: commovere
  rationale: 남아 있는 라틴어 전후 문맥이 명령형의 자세 지시를 가리키므로, 자연스러운 한국어 명령으로 ‘네 발로 서라’를 택했습니다.
- source_word: uocem
  english_pob_choice: voice
  chosen_korean: 음성
  alternatives_korean:
  - 목소리
  - 소리
  - 음성
  lexicon: vox
  rationale: 환상적·계시적 발화의 울림을 살리기 위해 일상적 ‘목소리’보다 ‘음성’을 사용했습니다.
theological_decisions:
- issue: 계시적 청각 표현의 강도
  chosen_reading: 단순한 소리보다, 들을 준비를 요구하는 우렁찬 계시적 음성으로 표현했습니다.
  alternative_readings:
  - 그냥 들리는 소리로 완화함
  - 비유적 강조를 약화함
  rationale: 문맥상 초월적 계시 장면이므로, 소리의 세기와 임박성을 약화하지 않는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 계시 서술의 문학적 강도 보존
