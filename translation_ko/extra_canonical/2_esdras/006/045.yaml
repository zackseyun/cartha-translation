  yaml_path: translation/extra_canonical/2_esdras/006/045.yaml
  text: On the fourth day you commanded the brightness of the sun[a], the light of the moon, and the arrangement of the stars to be made,
  footnotes:
  - marker: a
    text: Or 'the brightness of the sun to be made, the light of the moon, and the arrangement of the stars'.
    reason: previous_rendering
translation:
  language: ko
  text: 넷째 날에는 해의 빛과 달의 빛과 별들의 배열이 생기도록 명하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 구문상 ‘생기도록’은 목록 전체(해의 빛, 달의 빛, 별들의 배열)에 걸리는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: imperasti fieri
  english_pob_choice: you commanded ... to be made
  chosen_korean: '...이 생기도록 명하셨습니다'
  alternatives_korean:
  - '...을 만들라고 명하셨습니다'
  - '...이 만들어지도록 명하셨습니다'
  lexicon: impero / fio
  rationale: 라틴어의 명령 동사와 수동 부정사 구문을 자연스러운 합쇼체로 옮기되, 세 대상 전체가 ‘생기도록’ 명령되었다는 의미를 유지했습니다.
- source_word: solis splendorem
  english_pob_choice: the brightness of the sun
  chosen_korean: 해의 빛
  alternatives_korean:
  - 태양의 광휘
  - 해의 광채
  lexicon: splendor
  rationale: splendorem은 단순한 밝기보다 드러나는 빛의 광휘를 뜻하므로, 성경 한국어에서 자연스러운 ‘해의 빛’으로 옮겼습니다.
- source_word: lunae lumen
  english_pob_choice: the light of the moon
  chosen_korean: 달의 빛
  alternatives_korean:
  - 달빛
  lexicon: lumen
  rationale: lumen은 물리적 ‘빛’이므로, 시적이면서도 원문의 병렬 구조를 살리기 위해 ‘달의 빛’으로 대응했습니다.
- source_word: stellarum dispositionem
  english_pob_choice: the arrangement of the stars
  chosen_korean: 별들의 배열
  alternatives_korean:
  - 별들의 배치
  - 별들의 질서
  lexicon: dispositio
  rationale: dispositionem은 단순 존재가 아니라 질서 있게 놓임을 가리키므로, 가시적인 배열이라는 뜻을 살려 ‘별들의 배열’로 번역했습니다.
theological_decisions:
- issue: 창조 행위의 범위
  chosen_reading: 넷째 날에 해와 달과 별들의 빛과 배열이 하나님의 명령으로 생기도록 하셨다는 창조 서술로 읽었습니다.
  alternative_readings:
  - 단순한 천체 현상 묘사로만 읽는 해석
  - 천체의 기능 부여보다 형성만 강조하는 해석
  rationale: 본문의 imperasti fieri는 단순 관찰이 아니라 명령에 의한 창조적 성립을 나타내므로, 창조 행위의 직접성을 드러내는 번역이 필요합니다.
  doctrine_reference: 창조론
