  - severity: medium
    issue: ‘가리키기 때문입니다’ 사용
    rationale: de fine 및 de ipsis는 각각 ‘끝에 관하여’, ‘그것들에 관하여’라는 주제·관련성을 나타냅니다. ‘가리키다’는 지시·표지의 의미로 관계를 좁힙니다.
