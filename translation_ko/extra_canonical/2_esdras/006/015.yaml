source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: expauescas, quoniam de fine uerbum, et fundamenta terrae intellegetur, Quoniam de ipsis sermo, tremescet et commoue-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/015.yaml
  text: do not be terrified, because the word concerns the end, and the foundations of the earth will tremble and be shaken, because the discourse is about them.
translation:
  language: ko
  text: 두려워하지 마십시오. 이는 말씀이 끝을 가리키기 때문입니다. 그리고 땅의 기초들은 떨고 흔들릴 것입니다. 이는 그 말이 그것들을 가리키기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘끝’은 여기서 종말적 의미를 암시할 수 있으나, 원문은 그 범위를 명시적으로 좁히지 않습니다.
    reason: theological_note
lexical_decisions:
- source_word: expauescas
  english_pob_choice: do not be terrified
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 겁내지 마십시오
  - 두려워 말하십시오
  lexicon: expauesco
  rationale: 공포에 압도되는 반응을 금지하는 명령으로 보아, 현대 합쇼체의 직접적 권면인 ‘두려워하지 마십시오’가 가장 자연스럽습니다.
- source_word: de fine
  english_pob_choice: the word concerns the end
  chosen_korean: 말씀이 끝을 가리키기 때문입니다
  alternatives_korean:
  - 말이 끝에 관한 것이기 때문입니다
  - 말씀이 종말을 가리키기 때문입니다
  lexicon: finis
  rationale: context상 단순한 ‘끝’보다 종말적 의미가 강하나, 한국어 본문에서는 과도한 해석을 피하고 ‘끝’을 유지해 source의 범위를 좁게 보존했습니다.
- source_word: tremescet et commove-
  english_pob_choice: will tremble and be shaken
  chosen_korean: 떨고 흔들릴 것입니다
  alternatives_korean:
  - 떨며 흔들릴 것입니다
  - 전율하며 흔들릴 것입니다
  lexicon: tremesco / commoveo
  rationale: 미래 시제의 두 동사를 각각 살려, ‘떨다’와 ‘흔들리다’의 병렬로 지진적 동요를 직접 드러냈습니다.
- source_word: de ipsis
  english_pob_choice: because the discourse is about them
  chosen_korean: 이는 그 말이 그것들을 가리키기 때문입니다
  alternatives_korean:
  - 이는 그 말이 그것들에 관한 것이기 때문입니다
  - 이는 그 담화가 그것들에 대해 있기 때문입니다
  lexicon: de + ipse
  rationale: de ipsis의 대상을 반복해 지시하는 구조를 살리되, 한국어에서는 조사적 반복보다 ‘가리키다’로 의미를 명확하게 했습니다.
theological_decisions:
- issue: ‘끝’의 종말론적 뉘앙스
  chosen_reading: ‘끝’을 유지하되 문맥상 종말을 암시하는 표현으로 번역했습니다.
  alternative_readings:
  - ‘종말’로 명시적으로 옮김
  - ‘마지막’으로 완화함
  rationale: 라틴어 finis는 문맥상 종말을 가리킬 수 있지만, 본 절 단독으로는 해석을 확정하지 않고 원문의 폭을 보존하는 편이 더 안전합니다.
  doctrine_reference: 종말론적 언어의 과도한 확정 번역을 피하는 원문 충실성 원칙
