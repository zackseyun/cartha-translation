  naturalness: 합쇼체는 적절합니다. 다만 ‘땅의 기초들은’보다 ‘땅의 기초들이’가 현대 한국어 문장 안에서 더 자연스럽습니다.
  terminology: verbum과 sermo는 이 절에서 모두 일반적인 ‘말’로 처리하여 불필요한 계시·신학적 함의를 피하는 것이 안전합니다. finis는 원문의 폭을 보존하여 ‘끝’으로 유지합니다.
  issues:
