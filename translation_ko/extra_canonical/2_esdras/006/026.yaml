base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/026.yaml
  text: It will be turned into another understanding[a]. For evil will be blotted out, and deceit will be extinguished. But faith will flourish, and corruption will be overcome[b],
  footnotes:
  - marker: a
    text: Or 'the men who have been received' or 'gathered in.' The Latin does not specify the manner of their preservation from death.
    reason: alternative_reading
    anchor_ref: '6:26'
  - marker: b
    text: Or 'And the men who have been taken up, who have not tasted death from their birth, will be seen'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것은 다른 이해로 바뀔 것입니다[a]. 악은 지워지고 속임수는 사라질 것입니다. 그러나 믿음은 번성하고 부패는 이길 수 없을 것입니다,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘받아들여진 사람들’ 혹은 ‘모여든 사람들’이라는 뜻일 수 있습니다. 라틴어 본문은 그들이 어떤 방식으로 죽음에서 보존되는지는 분명히 밝히지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: conuertetur in sensum alium
  english_pob_choice: It will be turned into another understanding
  chosen_korean: 그것은 다른 이해로 바뀔 것입니다
  alternatives_korean:
  - 그것은 다른 생각으로 바뀔 것입니다
  - 그것은 다른 인식으로 바뀔 것입니다
  lexicon: sensum = 이해/인식
  rationale: sensum alium은 단순한 마음 상태보다 ‘다른 이해’에 가깝기 때문에, 문맥을 넓혀도 과도하게 해석하지 않는 표현으로 옮겼습니다.
- source_word: delebitur enim malum
  english_pob_choice: For evil will be blotted out
  chosen_korean: 악은 지워질 것입니다
  alternatives_korean:
  - 악은 말소될 것입니다
  - 악은 없애질 것입니다
  lexicon: delebitur = 지워지다/말소되다
  rationale: delebitur의 ‘지워짐’ 이미지를 살리면서도 한국어에서 자연스러운 수동 미래로 표현했습니다.
- source_word: extinguetur dolus
  english_pob_choice: and deceit will be extinguished
  chosen_korean: 속임수는 사라질 것입니다
  alternatives_korean:
  - 속임수는 꺼질 것입니다
  - 속임수는 소멸될 것입니다
  lexicon: dolus = 속임수/기만
  rationale: dolus는 도덕적 ‘속임수, 기만’의 뜻이 강하므로, 한국어에서 직접적이고 문맥에 맞는 ‘속임수’로 옮겼습니다.
- source_word: Florebit autem fides
  english_pob_choice: But faith will flourish
  chosen_korean: 그러나 믿음은 번성하고
  alternatives_korean:
  - 그러나 믿음은 꽃필 것이고
  - 그러나 믿음은 자랄 것이고
  lexicon: florebit = 번성하다
  rationale: florebit의 비유적 생장 이미지를 살려, 성경 문맥에 적합한 ‘번성하다’로 옮겼습니다.
theological_decisions:
- issue: 문장 끝의 미완결/연결형 종결
  chosen_reading: 마지막 절을 원문처럼 쉼표로 끝내어, 다음 문맥으로 이어지는 리듬을 보존했습니다.
  alternative_readings:
  - 마침표로 끝내어 독립 문장처럼 정리하기
  rationale: 제공된 라틴 본문과 영어 POB가 모두 마지막을 끊지 않고 이어지는 구조를 보이므로, 종결부의 열린 형태를 유지했습니다.
  doctrine_reference: source fidelity / discourse structure
