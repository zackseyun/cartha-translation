source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: conuertetur in sensum alium. Delebitur enim malum et extinguetur dolus. Florebit autem fides, et uincetur corruptela,
