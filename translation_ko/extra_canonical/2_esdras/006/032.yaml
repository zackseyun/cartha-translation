id: 2ES.6.32
reference: 2 Esdras 6:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam auditu audita est vox tua apud Altissimum. vidit enim Fortis directionem tuam et providit pudicitiam quam a iuventute tua habuisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/032.yaml
  text: For your voice has indeed been heard before the Most High; for the Mighty One has seen your conduct and has taken note of the purity that you have had from your youth.
translation:
  language: ko
  text: 그대의 목소리는 참으로 지극히 높으신 분 앞에서 들렸습니다. 힘센 분께서도 그대의 행실을 보셨고, 그대가 젊은 시절부터 지녀 온 깨끗함을 살피셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: pudicitiam은 도덕적 정결뿐 아니라 성적 순결의 뉘앙스를 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: auditu audita est vox tua
  english_pob_choice: your voice has indeed been heard
  chosen_korean: 그대의 목소리는 참으로 … 들렸습니다
  alternatives_korean:
  - 그대의 소리는 참으로 … 들렸습니다
  - 그대의 음성이 참으로 … 들렸습니다
  lexicon: auditu audita est / vox
  rationale: 라틴어의 중복 표현은 ‘참으로’로 강화된 확실성을 살리고, vox는 문맥상 ‘목소리’로 옮겨 청원·발화의 현실감을 유지했습니다.
- source_word: apud Altissimum
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 가장 높으신 분 앞에서
  - 지극히 높으신 하나님 앞에서
  lexicon: Altissimus
  rationale: 직접적으로 신칭을 덧붙이기보다 ‘지극히 높으신 분’으로 옮겨 원문의 호칭을 보존했습니다.
- source_word: directionem tuam
  english_pob_choice: your conduct
  chosen_korean: 그대의 행실
  alternatives_korean:
  - 그대의 행로
  - 그대의 방향
  - 그대의 바른 길
  lexicon: directionem
  rationale: revision pass가 지적한 대로 여기서는 추상적 ‘uprightness’보다 삶의 실제 태도와 걸음을 가리키는 ‘행실’이 문맥에 더 가깝습니다.
- source_word: pudicitiam
  english_pob_choice: the purity
  chosen_korean: 깨끗함
  alternatives_korean:
  - 순결
  - 정결
  - 청결함
  lexicon: pudicitia
  rationale: pudicitiam은 도덕적·성적 순결을 포함하는 넓은 ‘정결함’의 뜻이지만, 한국어에서는 자연스럽고 문맥을 과장하지 않는 ‘깨끗함’으로 옮겼습니다.
theological_decisions:
- issue: ‘지극히 높으신 분’의 호칭 처리
  chosen_reading: 신적 호칭을 명시하되 특정 교파식 관용어를 강제하지 않고 중립적으로 유지했습니다.
  alternative_readings:
  - ‘지극히 높으신 하나님’으로 명시
  - ‘가장 높으신 분’으로 완화
  rationale: 본문의 Altissimus는 분명한 신적 호칭이지만, 라틴 원문의 직설성을 살리기 위해 호칭 자체를 보존하는 쪽을 택했습니다.
  doctrine_reference: 원문 호칭 보존
