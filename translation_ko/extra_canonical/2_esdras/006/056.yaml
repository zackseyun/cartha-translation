  yaml_path: translation/extra_canonical/2_esdras/006/056.yaml
  text: But the rest of the nations, which have come from Adam, you said are nothing, and that they are like spittle; and you compared their abundance to a drop from a vessel.
translation:
  language: ko
  text: 그러나 아담에게서 난 나머지 민족들은 아무것도 아니고 침과 같다고 말씀하셨으며, 그들의 풍성함을 그릇에서 떨어지는 한 방울에 비유하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: residuas autem gentes ab Adam natas
  english_pob_choice: But the rest of the nations, which have come from Adam
  chosen_korean: 아담에게서 난 나머지 민족들
  alternatives_korean:
  - 아담에게서 나온 나머지 나라들
  - 아담에게서 태어난 나머지 민족들
  lexicon: nations → 민족들; ab Adam natas → 아담에게서 난
  rationale: gentes는 단순한 정치체보다 인류 집단을 가리키므로 민족들로 옮기고, natas는 ‘태어난’보다 자연스러운 ‘난’으로 원문의 출생 기원을 살렸습니다.
- source_word: nihil esse
  english_pob_choice: are nothing
  chosen_korean: 아무것도 아니라고
  alternatives_korean:
  - 무(無)하다고
  - 존재하지 않는다고
  lexicon: nihil esse → 아무것도 아니다
  rationale: 원문의 강한 무가치/무존재 진술을 직설적으로 살리기 위해 관용적 표현인 ‘아무것도 아니다’를 택했습니다.
- source_word: salivae adsimilatae sunt
  english_pob_choice: they are like spittle
  chosen_korean: 침과 같으며
  alternatives_korean:
  - 침에 비길 만하며
  - 타액과 비슷하며
  lexicon: saliva → 침; adsimilatae sunt → ~와 같다
  rationale: adsimilatae sunt는 단순한 유사 비교이므로 ‘같다’로 처리했고, salivae는 현대 한국어 성경 문체에 맞는 ‘침’이 가장 직설적입니다.
- source_word: stillicidium de vaso
  english_pob_choice: a drop from a vessel
  chosen_korean: 그릇에서 떨어지는 한 방울
  alternatives_korean:
  - 항아리에서 떨어지는 물방울
  - 그릇의 한 방울
  lexicon: stillicidium → 한 방울; de vaso → 그릇에서
  rationale: stillicidium은 ‘뚝 떨어지는 한 방울’의 이미지이므로 ‘떨어지는 한 방울’로 풀어 원문의 생생한 비유를 보존했습니다.
- source_word: abundantiam eorum
  english_pob_choice: their abundance
  chosen_korean: 그들의 많음
  alternatives_korean:
  - 그들의 풍성함
  - 그들의 충만함
  lexicon: abundantia → 많음/풍성함
  rationale: 문맥상 양적 규모를 가리키므로 ‘풍성함’보다 직접적인 ‘많음’이 원문의 대비를 더 분명히 드러냅니다.
theological_decisions:
- issue: 인류 전체의 낮은 비중을 가리키는 강한 진술의 수위
  chosen_reading: ‘아무것도 아니라고’와 ‘침과 같으며’의 직설적 표현을 유지했습니다.
  alternative_readings:
  - 완곡하게 ‘별것 아니라고’로 약화
  - ‘침처럼 하찮다’로 해석적 보강
  rationale: 본문은 비유를 통해 열국의 미미함을 극대화하므로, 한국어에서도 수위를 낮추지 않고 원문의 과장된 대비를 그대로 살리는 것이 적절합니다.
  doctrine_reference: source rhetoric / humility of nations
