id: 2ES.6.41
reference: 2 Esdras 6:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et in die secundo iterum creasti spiritum firmamenti et imperasti ei, ut divideret et divisionem faceret inter aquas, ut pars quidem sursum recederet, pars vero deorsum maneret.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/041.yaml
  text: And again[a], on the second day, you created the spirit of the firmament, and commanded it to divide and make a division between the waters, so that one part might recede upward and the other part remain below.
  footnotes:
  - marker: a
    text: Or 'And on the second day again you created'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 둘째 날에 다시, 당신은 궁창의 영을 창조하시고 그것에게 명령하여 물들 사이를 나누고 분리하게 하셨으니, 한 부분은 위로 물러가고 다른 부분은 아래에 머물게 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '그리고 둘째 날에 다시 당신은 창조하셨습니다'로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: et in die secundo iterum
  english_pob_choice: And again, on the second day
  chosen_korean: 그리고 둘째 날에 다시
  alternatives_korean:
  - 그리고 다시, 둘째 날에
  - 그리고 둘째 날, 다시
  lexicon: iterum
  rationale: iterum은 단순한 반복 표지이므로 '다시'로 옮기되, 한국어에서는 시간 부사구 앞뒤를 조정해 창조일의 순서를 자연스럽게 드러냈습니다.
- source_word: spiritum firmamenti
  english_pob_choice: the spirit of the firmament
  chosen_korean: 궁창의 영
  alternatives_korean:
  - 궁창의 정신
  - 하늘 궁창의 영
  lexicon: spiritum firmamenti
  rationale: spiritum은 여기서 '영'으로 직역하는 것이 가장 가깝고, firmamenti는 창 1장의 '궁창'에 대응시켜 본문이 말하는 창조 질서를 보존했습니다.
- source_word: imperasti ei, ut divideret et divisionem faceret inter aquas
  english_pob_choice: and commanded it to divide and make a division between the waters
  chosen_korean: 그것에게 명령하여 물들 사이를 나누고 분리하게 하셨으니
  alternatives_korean:
  - 그것에게 명령하여 물들 사이를 갈라 구분하게 하셨으니
  - 그것에게 명령하여 물들 사이를 나누게 하셨으니
  lexicon: imperasti / divideret / divisionem faceret
  rationale: 동사 두 개가 병렬로 있어 '나누고 분리하게'로 중복성을 살렸으며, 물 사이의 구획 형성을 분명히 드러냈습니다.
- source_word: pars quidem sursum recederet, pars vero deorsum maneret
  english_pob_choice: so that one part might recede upward and the other part remain below
  chosen_korean: 한 부분은 위로 물러가고 다른 부분은 아래에 머물게 하셨습니다
  alternatives_korean:
  - 한 부분은 위로 물러나고 다른 부분은 아래에 남게 하셨습니다
  - 한 부분은 위로 물러가고 다른 부분은 아래에 남게 하셨습니다
  lexicon: recederet / maneret
  rationale: recederet는 단순히 '떠나다'보다 '위로 물러가다'가 상층수의 이동 이미지를 더 정확히 살리고, maneret은 '머물다'로 지속 상태를 표현했습니다.
theological_decisions:
- issue: 궁창의 영을 창조했다는 표현
  chosen_reading: 본문의 인격적·비인격적 중간성을 그대로 살려 '궁창의 영'을 직역했습니다.
  alternative_readings:
  - '''궁창을 이루는 바람''처럼 자연현상으로 완화'
  - '''궁창의 힘''으로 추상화'
  rationale: 라틴어 spiritum firmamenti는 창조된 '영/기운'의 성격을 지니므로, 이를 신학적으로 해석해 약화하지 않고 원문의 낯섦을 보존했습니다.
  doctrine_reference: 창세기 1장 궁창 창조 모티프, 지혜문학적 창조 서술
- issue: 물의 분리 목적
  chosen_reading: 물들 사이를 '나누고 분리하게' 하여 상하 수역의 구분을 분명히 했습니다.
  alternative_readings:
  - 단순히 '갈라놓게'
  - '''구분하게''만 사용'
  rationale: divide / divisionem faceret의 이중 표현은 단순 분할보다 질서 형성의 강조이므로, 두 동사를 함께 살려 창조 행위의 구조성을 보존했습니다.
  doctrine_reference: 창세기 1:6-7의 궁창 아래·위 물 구분
