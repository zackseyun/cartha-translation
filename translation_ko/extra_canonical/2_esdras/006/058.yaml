source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos autem populus tuus quem vocasti primogenitum, unigenitum, aemulatorem, carissimum, traditi sumus in manibus eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/058.yaml
  text: But we[a], your people, whom you have called your firstborn, your only one, your beloved, your dear one[b], have been handed over into their hands.
  footnotes:
  - marker: a
    text: The title rendered 'your zealous one' translates a difficult Latin term. The line piles up covenantal honor-titles for Israel rather than offering a smooth paraphrase.
    reason: lexical_alternative
    anchor_ref: '6:58'
  - marker: b
    text: Or 'have been given'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 주께서 맏아들과 외아들과 열심을 지닌 이와 가장 사랑하시는 이라고 부르신 주의 백성인 저희는 그들의 손에 넘겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열심을 지닌 이’로 옮긴 라틴어 aemulatorem은 뜻이 까다로운 칭호입니다. ‘열심 있는 이’, ‘주께 열심을 내는 이’ 등으로 이해될 수 있습니다. 이 구절은 이스라엘에게 주어진 언약적 영예 칭호들을 겹쳐 열거합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: nos autem populus tuus
  english_pob_choice: But we, your people
  chosen_korean: 그러나 저희는 주의 백성으로서
  alternatives_korean:
  - 그러나 저희는 주님의 백성입니다
  - 그런데 저희는 주의 백성입니다
  lexicon: populus / tuus
  rationale: 라틴어의 소유 관계를 살리되, 문맥상 항변과 대조를 드러내기 위해 ‘그러나’로 시작하고 ‘주의 백성’으로 간결하게 옮겼습니다.
- source_word: quem vocasti primogenitum, unigenitum
  english_pob_choice: whom you have called your firstborn, your only one
  chosen_korean: 주께서 맏아들, 외아들로 부르신
  alternatives_korean:
  - 주께서 맏아들, 유일한 아들로 부르신
  - 주께서 처음 난 자, 하나뿐인 자로 부르신
  lexicon: primogenitum / unigenitum
  rationale: 두 칭호는 서로 다른 강조점이 있으므로 ‘맏아들’과 ‘외아들’로 구분해 직역에 가깝게 유지했습니다.
- source_word: aemulatorem, carissimum
  english_pob_choice: your zealous one, your beloved, your dear one
  chosen_korean: 사랑하시는 이, 친애하시는 이
  alternatives_korean:
  - 열심 있는 이, 사랑하시는 이
  - 사랑하는 이, 귀여워하시는 이
  lexicon: aemulatorem / carissimum
  rationale: English POB가 보여 주는 목록형 칭호의 누적 효과를 살리기 위해 두 호칭을 각각 독립된 존칭으로 옮겼고, 한국어에서 자연스럽지 않은 ‘zealous one’는 문맥상 칭호의 무게를 해치므로 더 중립적인 존칭으로 처리했습니다.
- source_word: traditi sumus in manibus eorum
  english_pob_choice: have been handed over into their hands
  chosen_korean: 그들의 손에 넘겨졌습니다
  alternatives_korean:
  - 그들의 손에 내맡겨졌습니다
  - 그들의 손에 넘겨주어졌습니다
  lexicon: traditi sumus / in manibus eorum
  rationale: adjudicated revision을 따라 *trado*의 강한 뉘앙스인 ‘넘겨지다/내맡겨지다’를 반영했고, 수동형을 살려 피압박 상태를 드러냈습니다.
theological_decisions:
- issue: 칼로 붙는 칭호들의 누적과 관계성
  chosen_reading: ‘맏아들, 외아들, 사랑하시는 이, 친애하시는 이’라는 배열을 그대로 살려, 이스라엘이 언약적 특권을 부여받은 백성이라는 항변의 밀도를 유지했습니다.
  alternative_readings:
  - 칭호를 하나의 풀어쓴 문장으로 완화함
  - 일부 호칭을 생략함
  rationale: 본문은 매끄러운 의역보다 칭호의 중첩 자체로 수사적 긴장을 형성하므로, 그 긴장을 보존하는 쪽이 source-direct합니다.
  doctrine_reference: source_note
