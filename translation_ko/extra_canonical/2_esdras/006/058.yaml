    rationale: 초안의 ‘사랑하시는 이, 친애하시는 이’는 aemulatorem의 난해하지만 독립적인 칭호를 사랑 관련 표현으로 흡수하며, carissimum의 최상급도 드러내지 못합니다.
  - severity: low
    issue: ‘친애하시는 이’의 현대 한국어 어감
    rationale: 이 표현은 신적 언약 칭호로는 부자연스럽고 ‘가장 사랑하시는 이’가 carissimum의 뜻과 문체를 더 잘 전달합니다.
