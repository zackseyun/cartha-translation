  text: the name of the second you called Leviathan. And you separated them from each other[a], for the seventh part where the water had been gathered could not hold them.
  footnotes:
  - marker: a
    text: Or 'And you separated them from each other, for the seventh part where the water had been gathered could not hold them both.'.
    reason: previous_rendering
translation:
  language: ko
  text: 둘째 것의 이름을 리워야단이라고 부르셨습니다. 그리고 그것들을 서로 갈라놓으셨습니다. 물이 모여 있던 일곱째 부분이 그것들을 담을 수 없었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그것들을 서로 갈라놓으셨습니다. 물이 모여 있던 일곱째 부분이 그것들 둘을 담을 수 없었기 때문입니다.’
    reason: 라틴어 ea는 복수형이므로 문맥상 두 대상을 가리킬 수 있으나, ‘둘’은 명시되어 있지 않아 본문에는 보태지 않았습니다.
lexical_decisions:
- source_word: nomen secundi
  english_pob_choice: the name of the second
  chosen_korean: 둘째 것의 이름
  alternatives_korean:
  - 두 번째의 이름
  - 둘째의 이름
  lexicon: nomen / secundi
  rationale: 라틴어는 첫째와 대비되는 ‘둘째 것’을 가리키므로, 문맥상 간결하게 ‘둘째 것의 이름’으로 옮겨 첫째와의 대구를 살렸습니다.
- source_word: uocasti
  english_pob_choice: you called
  chosen_korean: 부르셨습니다
  alternatives_korean:
  - 이름하셨습니다
  - 호명하셨습니다
  lexicon: uocare
  rationale: ‘이름을 붙이다/부르다’의 의미를 담되, 하나님이 대상을 명명하시는 행위를 자연스럽고 격식 있게 나타내기 위해 ‘부르셨습니다’를 택했습니다.
- source_word: Leuiathan
  english_pob_choice: Leviathan
  chosen_korean: 리워야단
  alternatives_korean:
  - 레비아탄
  - 리바이어던
  lexicon: Leuiathan
  rationale: 성경적 고유명사로 널리 알려진 표기를 유지하되, 현대 한국어 표기법에 맞춰 ‘리워야단’을 사용했습니다.
- source_word: separasti ea ab alterutro
  english_pob_choice: you separated them from each other
  chosen_korean: 그것들을 서로 떼어 놓으셨습니다
  alternatives_korean:
  - 그것들을 서로 갈라 놓으셨습니다
  - 그것들을 서로 나누어 놓으셨습니다
  lexicon: separare / alterutro
  rationale: ‘서로’와 분리 동작을 분명히 드러내면서도, 원문의 상호 분리를 자연스럽게 표현하는 한국어로 옮겼습니다.
- source_word: non enim poterat ... capere
  english_pob_choice: could not hold them
  chosen_korean: 담아 둘 수 없었기 때문에
  alternatives_korean:
  - 수용할 수 없었기 때문에
  - 감당할 수 없었기 때문에
  lexicon: capere
  rationale: 물리적으로 ‘담아 담지 못하다’는 뜻이 핵심이므로, 저장·수용의 이미지를 살려 ‘담아 둘 수 없었다’로 옮겼습니다.
theological_decisions:
- issue: 창조 행위와 명명 행위의 연결
  chosen_reading: 하나님이 피조물의 이름을 ‘부르시는’ 행위로 표현해, 단순 명칭 부여보다 주권적 명명권을 드러냈습니다.
  alternative_readings:
  - ‘이름하셨습니다’처럼 중립적 명명으로 약화
  - 직역하여 ‘불렀습니다’로만 처리
  rationale: 본문은 대상의 이름을 정하는 창조주적 행위를 전제하므로, 주권성과 서사적 자연스러움을 함께 살리는 표현이 적절합니다.
  doctrine_reference: 창조론, 섭리
