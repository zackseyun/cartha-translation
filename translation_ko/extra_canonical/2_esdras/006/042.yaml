id: 2ES.6.42
reference: 2 Esdras 6:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tertio die imperasti aquis congregari in septima parte terrae, sex vero partes siccasti et conservasti, ut ex his sint coram te ministrantia seminata adeo et culta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/042.yaml
  text: And on the third day you commanded the waters to be gathered into the seventh part of the earth, but six parts you dried up and preserved, so that from these there might be before you things sown and cultivated, serving you.
translation:
  language: ko
  text: 셋째 날에 당신께서는 물들이 땅의 일곱째 부분으로 모이도록 명령하셨고, 여섯 부분은 말리시고 보존하셨습니다. 그리하여 그 여섯 부분에서 심겨지고 경작된 것들이 당신 앞에서 당신을 섬기도록 하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 여섯 부분에서’는 라틴어 ex his(‘이것들로부터/이것들에서’)를 풀어 쓴 것으로, 앞서 말한 말려지고 보존된 여섯 부분을 가리킵니다.
    reason: source_note
lexical_decisions:
- source_word: aquis congregari
  english_pob_choice: the waters to be gathered
  chosen_korean: 물들을 모이게 하다
  alternatives_korean:
  - 물을 모으다
  - 물들이 모이다
  lexicon: aquis = 물들, congregari = 모이다/모이게 하다
  rationale: 수동적 집합을 드러내기 위해 ‘모이게 하다’를 택했습니다. 단순한 ‘모으다’보다 원문의 명령-피동 관계를 더 분명히 살립니다.
- source_word: in septima parte terrae
  english_pob_choice: into the seventh part of the earth
  chosen_korean: 땅의 일곱째 몫으로
  alternatives_korean:
  - 땅의 일곱째 부분에
  - 땅의 일곱째 몫 안으로
  lexicon: septima parte = 일곱째 부분/몫, terrae = 땅
  rationale: 라틴어의 부분 분할 감각을 살려 ‘몫’을 사용했습니다. POB의 ‘into’에 맞게 방향성을 유지하면서도 한국어에서 자연스럽게 읽히게 했습니다.
- source_word: sex vero partes siccasti et conservasti
  english_pob_choice: but six parts you dried up and preserved
  chosen_korean: 여섯 몫은 당신께서 말리시고 보존하셔서
  alternatives_korean:
  - 여섯 부분은 당신께서 말리시고 지키셔서
  - 여섯 몫을 당신께서 말리시고 간직하셔서
  lexicon: siccasti = 말리다, conservasti = 보존하다/지키다
  rationale: ‘보존하다’가 원문의 단순 보호보다 더 직접적으로 보전·유지의 의미를 드러냅니다. POB의 ‘preserved’를 반영하되 문체는 합쇼체로 맞췄습니다.
- source_word: seminata adeo et culta
  english_pob_choice: things sown and cultivated
  chosen_korean: 자라 심기고 경작된 것들
  alternatives_korean:
  - 심겨지고 경작된 것들
  - 뿌려지고 가꾸어진 것들
  lexicon: seminata = 뿌려진/심긴 것, culta = 경작된/가꾼
  rationale: ‘seminata’와 ‘culta’의 농경 이미지를 모두 살리기 위해 ‘심기고 경작된 것들’로 옮겼습니다. ‘자라’는 땅에서 난 생육의 뉘앙스를 보강하지만, 원문 의미를 넘지 않도록 최소한으로만 보탰습니다.
theological_decisions:
- issue: 피조 세계의 분할과 보존을 하나님의 질서 명령으로 표현하는 방식
  chosen_reading: 물의 집합과 육지의 보존을 창조 질서의 주권적 배치로 직설적으로 옮겼습니다.
  alternative_readings:
  - 더 완곡하게 ‘땅의 한 부분에 물이 모이게 하셨고’로 풀기
  - 창조 언어를 약화시켜 단순 자연 묘사처럼 처리하기
  rationale: 이 절은 창조주께서 물과 땅의 경계를 주권적으로 정하시는 내용을 말하므로, 명령성과 보존성을 약화하지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 창세기 1장 창조 질서, 하나님의 주권
- issue: ‘serving you’를 종교적 봉헌보다 기능적 봉사로 번역하는 문제
  chosen_reading: ‘당신을 섬기게 하셨습니다’로 번역해, 농산물이 하나님의 목적을 위해 존재한다는 뜻을 살렸습니다.
  alternative_readings:
  - ‘당신께 봉사하게 하셨습니다’
  - ‘당신께 바쳐지게 하셨습니다’
  rationale: 원문은 추수·경작된 것들이 하나님 앞에서 기능적으로 봉사하는 상태를 말하므로, 제의적 봉헌으로 좁히기보다 일반적 ‘섬기다’를 유지하는 편이 source-direct합니다.
  doctrine_reference: 피조물의 목적성과 하나님의 섭리
