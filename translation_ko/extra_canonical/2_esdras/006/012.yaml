  - severity: medium
    issue: ‘당신의 것들 중에서’의 어색한 표현
    rationale: tuorum은 앞선 문맥의 생략된 소유 대상을 받는 단편입니다. ‘당신께 속한 것들 가운데’가 소유 관계와 단편성을 보존하면서 더 자연스럽습니다.
