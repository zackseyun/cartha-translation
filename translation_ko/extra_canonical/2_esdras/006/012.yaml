  source_fidelity: 라틴어의 절 단위 구성과 미완결된 인용을 대체로 따르지만, ‘네 발로’는 super pedes tuos를 한국어에서 문자적으로 잘못 옮겨 사람에게 네 개의 발이 있다는 뜻이 됩니다. 또한 ‘당신의 것들’은 원문의 선행 문맥을 받는 속격 복수의 단편성을 반영하려는 의도는 이해되나 현대 한국어로 매우 부자연스럽습니다.
  naturalness: ‘지난밤’, ‘그러자 그가 대답하여 제게 말했습니다’, ‘그러면 들을 것입니다’은 자연스럽고 합쇼체 서술과 조화를 이룹니다. 다만 직접 인용의 ‘네 발로 일어서십시오’는 부자연스럽고 의미상 오류입니다.
  terminology: 원문 tuorum은 이 절만으로 소유 대상이 생략된 채 앞 문맥을 가리키므로 ‘당신의 것들’처럼 대상을 임의로 특정하지 않는 편이 좋습니다. 다만 한국어에서는 ‘당신께 속한 것들’이 더 자연스럽습니다. 청자에 대한 명령은 합쇼체로 유지할 수 있습니다.
