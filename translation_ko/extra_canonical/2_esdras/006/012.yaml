translation:
  language: ko
  text: 당신의 것들 중에서, 지난밤에 저에게 일부를 보여 주신 것입니다.” 그러자 그가 대답하며 저에게 말했습니다. “네 발로 일어서십시오. 그러면 들을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''당신의 것들 중에서''는 라틴어 tuorum을 앞선 소유 대상을 가리키는 방식으로 옮긴 것입니다.'
    reason: source_note
lexical_decisions:
- source_word: tuorum
  english_pob_choice: of yours
  chosen_korean: 당신의 것들 중에서
  alternatives_korean:
  - 당신의 것들에서
  - 당신의 것 가운데
  lexicon: tuorum
  rationale: 라틴어 소유격 복수형을 단순히 '당신의'로만 처리하면 뒤의 부분절과의 관계가 흐려져, '당신의 것들 중에서'로 소유 대상을 분명히 드러냈습니다.
- source_word: quorum ex parte mihi demonstrasti
  english_pob_choice: of which you showed me a part
  chosen_korean: 지난밤에 저에게 일부를 보여 주신 것입니다
  alternatives_korean:
  - 지난밤에 저에게 한 부분을 보여 주신 것입니다
  - 지난밤에 저에게 그 일부를 보여 주신 것입니다
  lexicon: quorum + ex parte demonstrasti
  rationale: quorum을 앞의 소유 대상에 연결하고, ex parte를 '일부'로 옮겨 라틴어의 부분적 계시라는 의미를 보존했습니다.
- source_word: nocte praeterita
  english_pob_choice: previous night
  chosen_korean: 지난밤에
  alternatives_korean:
  - 이전 밤에
  - 전날 밤에
  lexicon: nocte praeterita
  rationale: praeterita의 '지나간' 의미를 한국어의 자연스러운 시간 표현인 '지난밤'으로 옮겼습니다.
- source_word: surge super pedes tuos et audies
  english_pob_choice: Stand on your feet, and you will hear
  chosen_korean: 네 발로 일어서십시오. 그러면 들을 것입니다
  alternatives_korean:
  - 일어나 두 발로 서십시오. 그러면 들을 것입니다
  - 네 발로 일어서라. 그러면 들을 것이다
  lexicon: surge super pedes tuos
  rationale: 명령형 surge와 super pedes tuos의 신체적 이미지를 살리면서, 합쇼체로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 대화체 명령의 존대 수준
  chosen_reading: 하나님의 응답으로 이해되는 직접화법은 합쇼체 명령으로 유지했습니다.
  alternative_readings:
  - 반말 명령으로 낮춤
  - 간접화법으로 평서화
  rationale: 원문이 직접 명령을 보존하므로, 한국어에서도 화자의 권위와 장면의 긴박함이 드러나도록 했습니다.
  doctrine_reference: 본문 화자-청자 관계의 직접화법 보존
- issue: audies의 미완결성
  chosen_reading: '''그러면 들을 것입니다''로 끝내어, 이어질 계시의 예고를 열어 두었습니다.'
  alternative_readings:
  - '''그러면 들을 수 있을 것입니다'''
  - 뒤를 보충해 의미를 완결
  rationale: 라틴어 문장이 여기서 끊기므로, 한국어도 미완결 종결을 유지해 다음 절로 이어지는 긴장을 보존했습니다.
  doctrine_reference: 문맥적 연속성 보존
