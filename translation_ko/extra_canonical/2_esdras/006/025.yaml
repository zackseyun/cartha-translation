  naturalness: ‘구원을 받고 ... 볼 것입니다’도 이해되지만, 미래의 두 결과를 병렬하는 문맥에서는 ‘구원을 받을 것이며 ... 볼 것입니다’가 더 자연스럽고 명료한 현대 한국어 합쇼체입니다. omnis의 포괄성은 ‘사람은 누구나’로 자연스럽게 드러낼 수 있습니다.
