translation:
  language: ko
  text: 그리고 내가 미리 말한 이 모든 일들 가운데서 남아 있는 사람은 구원을 받고, 내 구원과 내 시대의 끝을 볼 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이 모든 일들 가운데서 남아 있는 사람”
    reason: alternative_reading
lexical_decisions:
- source_word: derelictus fuerit ex omnibus istis
  english_pob_choice: everyone who is left from all these things
  chosen_korean: 이 모든 일들 가운데서 남아 있는 사람
  alternatives_korean:
  - 이 모든 일들에서 남겨진 사람
  - 이 모든 일들을 살아남은 사람
  lexicon: Latin derelictus fuerit ex
  rationale: 문맥상 ‘버려지다’보다 재앙들을 통과해 살아남아 남아 있는 자를 가리키므로, 한국어는 자연스럽게 ‘남아 있는 사람’으로 옮겼습니다.
- source_word: saluabitur
  english_pob_choice: will be saved
  chosen_korean: 구원을 받고
  alternatives_korean:
  - 구원될 것이며
  - 구원을 받을 것이며
  lexicon: Latin saluari
  rationale: 수동 미래의 결과를 현대 합쇼체로 자연스럽게 살리기 위해 ‘구원을 받고’로 번역했습니다.
- source_word: uidebit salutare meum
  english_pob_choice: will see my salvation
  chosen_korean: 내 구원을 볼 것입니다
  alternatives_korean:
  - 내 구원하심을 볼 것입니다
  - 내 구원의 역사를 볼 것입니다
  lexicon: Latin salutare meum
  rationale: salutare를 단순히 추상적 개념인 ‘구원’으로 두되, 소유격 meum을 살려 ‘내 구원’으로 옮겼습니다.
- source_word: finem saeculi mei
  english_pob_choice: the end of my age
  chosen_korean: 내 시대의 끝
  alternatives_korean:
  - 내 세대의 끝
  - 내 세상의 끝
  lexicon: Latin saeculum
  rationale: saeculum은 여기서 세계 종말이라기보다 ‘시대/세대’의 종결을 가리키므로, 직역에 가까운 ‘내 시대의 끝’을 택했습니다.
theological_decisions:
- issue: 재앙 생존자와 종말 계시의 연결
  chosen_reading: 남아 있는 자가 구원을 받고 하나님의 구원과 시대의 끝을 본다는 종말론적 약속으로 읽었습니다.
  alternative_readings:
  - 단순한 생존 선언으로 읽을 수 있음
  - ‘내 구원’은 구원 행위보다 구원 사건 자체를 가리킬 수 있음
  rationale: 라틴 본문은 남은 자의 구원과 계시를 병렬로 제시하므로, 한국어도 서술적 약속의 긴장을 유지해야 합니다.
  doctrine_reference: 종말론 / 남은 자 사상
- issue: ‘내 시대’의 의미
  chosen_reading: saeculum을 ‘내 시대’로 두어, 우주적 시간의 끝보다 정해진 시대의 종결이라는 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘내 세대’
  - ‘내 세상’
  rationale: 이 단어는 문맥에 따라 다양하지만, 여기서는 소유격과 결합한 시대적 한계선을 강조하는 표현이 가장 자연스럽습니다.
  doctrine_reference: 종말론
