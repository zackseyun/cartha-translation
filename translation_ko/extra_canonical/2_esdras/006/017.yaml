  text: 'factum est cum audissem, et surrexi super pedes meos et audiui, et ecce uox loquens, et sonus eius sicut sonus aquarum multarum. Et dixit : ecce dies ueniunt, et erit quando adpro-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/017.yaml
  text: And it happened, when I heard, that I stood upon my feet and listened, and behold, a voice was speaking, and its sound was like the sound of many waters.
translation:
  language: ko
  text: 내가 이것을 들었을 때, 나는 내 발로 일어서서 들었습니다. 그런데 보십시오, 한 음성이 말하고 있었고, 그 소리는 많은 물의 소리와 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어의 감탄사 ecce는 문맥상 독자를 장면 안으로 끌어들이는 ‘보십시오’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: factum est cum audissem
  english_pob_choice: And it happened, when I heard
  chosen_korean: 내가 이것을 들었을 때
  alternatives_korean:
  - 그 일이 일어났는데, 내가 들었을 때
  - 내가 듣자마자 그런 일이 일어났는데
  lexicon: factum est; cum audissem
  rationale: 라틴어 관용구를 자연스러운 서술 전환으로 옮기되, 사건의 발생과 청자의 반응 순서를 유지했습니다.
- source_word: surrexi super pedes meos
  english_pob_choice: I stood upon my feet
  chosen_korean: 나는 내 발로 일어서서
  alternatives_korean:
  - 나는 내 발 위에 일어서서
  - 나는 두 발로 섰습니다
  lexicon: surrexi; pedes meos
  rationale: 직역의 느낌을 살리면서도 한국어에서 자연스러운 동작 표현으로 다듬었습니다.
- source_word: uox loquens
  english_pob_choice: a voice was speaking
  chosen_korean: 한 음성이 말하고 있었고
  alternatives_korean:
  - 한 소리가 말하고 있었고
  - 어떤 음성이 말씀하고 있었고
  lexicon: uox; loquens
  rationale: uox를 단순한 '소리'보다 인격적 발화가 드러나는 '음성'으로 옮기고, 진행형을 유지했습니다.
- source_word: sonus eius sicut sonus aquarum multarum
  english_pob_choice: its sound was like the sound of many waters
  chosen_korean: 그 소리는 많은 물의 소리와 같았습니다
  alternatives_korean:
  - 그 음성의 소리는 많은 물의 소리와 같았습니다
  - 그 소리는 많은 물소리 같았습니다
  lexicon: sonus; aquarum multarum
  rationale: 반복되는 비교 구조를 보존해 청각적 강도를 살렸고, '많은 물'은 원문의 이미지를 그대로 반영했습니다.
theological_decisions:
- issue: 청각적 신현 묘사의 전달
  chosen_reading: 이 구절은 단순한 자연음이 아니라, 압도적인 신적 현현의 음성을 묘사하는 것으로 읽고 '음성'을 유지했습니다.
  alternative_readings:
  - 단순히 '소리'로 평평하게 처리하는 읽기
  - 인격적 발화성을 약화시키는 읽기
  rationale: 문맥상 말하는 존재가 중심이므로, 한국어에서도 '음성'을 통해 발화와 위엄을 드러내는 것이 더 충실합니다.
  doctrine_reference: 신현/계시 서술의 청각적 표상
