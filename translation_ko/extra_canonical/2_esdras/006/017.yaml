  source_fidelity: 라틴어의 서술 전환(factum est cum audissem), 기립과 청취(surrexi ... et audiui), 말하는 음성(uox loquens), 그리고 ‘많은 물’의 소리라는 비교를 모두 유지해야 합니다. 초안은 대체로 충실하나, ‘내 발로 일어서서’는 super pedes meos의 한국어 직역으로서 부자연스럽고, factum est의 사건 전환도 드러나지 않습니다.
  naturalness: ‘두 발로 일어서서’ 또는 단순히 ‘일어서서’가 현대 표준 한국어에 자연스럽습니다. ‘많은 물의 소리’보다 성서 문체에서도 통용되고 현대어로도 자연스러운 ‘많은 물소리’가 적절합니다. ecce는 본문에서 ‘보십시오’로 충분히 전달되므로 번역자 해설 각주는 필요하지 않습니다.
  terminology: uox는 발화하는 주체의 음성이므로 ‘음성’이 적절하며, sonus eius는 ‘그 소리’로 구별합니다. ‘많은 물소리’는 원문의 복수적이고 압도적인 물의 이미지를 보존하며 특정 교리적 해석을 덧붙이지 않습니다.
