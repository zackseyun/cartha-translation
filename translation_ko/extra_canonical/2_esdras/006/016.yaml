translation:
  language: ko
  text: 그 말은 그들을 가리키기 때문입니다[a]. 그들은 떨며 흔들릴 것이며, 자기들의 끝이 바뀌어야 함을 알고 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말이 그들을 가리키기 때문에, 그들은 떨며 흔들릴 것이며, 자기들의 끝이 바뀌어야 함을 알고 있기 때문입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: quoniam / bitur, scit enim quoniam finem eorum oportet commutari
  english_pob_choice: Because the speech concerns them, they will tremble and be shaken, for they know that their end must be changed.
  chosen_korean: 그 말은 그들을 가리키기 때문입니다 … 자기들의 끝이 바뀌어야 함을 알고 있기 때문입니다.
  alternatives_korean:
  - 말이 그들에 관한 것이기 때문입니다
  - 그 말이 그들을 향하기 때문입니다
  - 그들의 결말이 바뀌어야 함을 알고 있기 때문입니다
  lexicon: source_note
  rationale: 라틴어 quoniam은 단순히 ‘왜냐하면/…때문에’로 읽히며, POB의 수정된 영어도 이 중복을 정리해 원인을 분명히 합니다. ‘concerns them’에 해당하는 뜻은 ‘가리키다/관계하다’로 옮겨 문맥상 대상성을 드러냈습니다.
- source_word: tremble and be shaken
  english_pob_choice: they will tremble and be shaken
  chosen_korean: 떨며 흔들릴 것이며
  alternatives_korean:
  - 떨고 흔들릴 것이며
  - 전율하며 흔들릴 것이며
  lexicon: source_note
  rationale: 두 개의 동사적 반응을 그대로 살려 겁에 질린 동요를 중첩적으로 표현했습니다.
- source_word: finem eorum oportet commutari
  english_pob_choice: their end must be changed
  chosen_korean: 자기들의 끝이 바뀌어야 함
  alternatives_korean:
  - 그들의 끝이 변해야 함
  - 그들의 종말이 바뀌어야 함
  lexicon: source_note
  rationale: oportet는 단순 미래가 아니라 ‘반드시 ~해야 한다’는 필연을 나타내므로 의무/필연의 구조를 살렸고, finis는 여기서 ‘종말/끝’의 종결적 의미를 가집니다.
theological_decisions:
- issue: end must be changed의 종말론적 필연성
  chosen_reading: ‘자기들의 끝이 바뀌어야 함’을 사건의 필연으로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘그들의 종말이 바뀌어야 함’
  - ‘그들의 결말이 달라져야 함’
  rationale: 본문은 최종 상태의 전환이 피할 수 없다는 점을 말하므로, 해석을 덜어내고 필연성 자체를 드러내는 쪽이 소스에 충실합니다.
  doctrine_reference: 종말론 일반
- issue: speech concerns them의 대상 지시
  chosen_reading: 말이 그들을 가리킨다는 관계를 분명히 했습니다.
  alternative_readings:
  - 말이 그들에 관한 것이다
  - 말이 그들을 향한다
  rationale: 라틴어의 간결한 인과 구조를 한국어에서 자연스럽게 풀되, 말씀이 특정 집단을 겨냥한 것이라는 문맥을 보존합니다.
  doctrine_reference: 본문 문맥
