  source_fidelity: 라틴어의 호소 구조(et nunc, Domine, ecce)와 대조되는 현재 상황을 충실히 반영합니다. istae gentes, in nihilum deputatae sunt, dominari nostri, devorare nos의 의미도 각각 ‘이 민족들’, ‘아무것도 아닌 것으로 여겨진’, ‘우리를 지배하고’, ‘우리를 집어삼키고’로 적절히 옮겼습니다. ‘집어삼키다’는 devorare의 강한 비유적 폭력성을 자연스럽게 보존합니다.
  naturalness: 현대 표준 한국어 합쇼체 기도문으로 자연스럽습니다. ‘이제, 주님, 보십시오’는 ecce의 주의 환기와 탄원의 직접성을 간결하게 재현하며, 뒤의 현재진행 표현도 현재의 고통을 호소하는 문맥에 잘 맞습니다.
  terminology: ‘주님’은 Domine에 대한 현대 한국어의 자연스러운 직접 호칭이며, ‘민족들’은 gentes의 복수 집단성을 무리 없이 반영합니다. 특정 교파적 해석이나 과도한 신학적 용어가 추가되지 않았습니다.
