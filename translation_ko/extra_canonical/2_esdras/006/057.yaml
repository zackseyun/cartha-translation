id: 2ES.6.57
reference: 2 Esdras 6:57
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et nunc, Domine, ecce istae gentes quae in nihilum deputatae sunt dominari nostri et devorarenos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/057.yaml
  text: And now, Lord, behold, these nations, which have been reckoned as nothing, rule over us and devour us.
translation:
  language: ko
  text: 이제, 주님, 보십시오. 아무것도 아닌 것으로 여겨진 이 민족들이 우리를 지배하고 우리를 집어삼키고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: domine → Lord
  rationale: 직접 호소하는 기도문 맥락이므로 합쇼체의 공손한 직접 호칭인 「주님」이 가장 자연스럽습니다.
- source_word: istae gentes
  english_pob_choice: these nations
  chosen_korean: 이 민족들이
  alternatives_korean:
  - 이 나라들이
  - 이 백성들이
  lexicon: istae gentes → these nations
  rationale: gentes는 혈통적·민족적 집단을 가리키는 말로, 문맥상 「민족들」이 가장 가까우며 복수 주격을 살렸습니다.
- source_word: in nihilum deputatae sunt
  english_pob_choice: which have been reckoned as nothing
  chosen_korean: 아무것도 아닌 것으로 여겨진
  alternatives_korean:
  - 무가치한 것으로 여겨진
  - 없다고 간주된
  lexicon: in nihilum deputatae sunt → reckoned as nothing
  rationale: 라틴어의 수동적 판단 표현을 살려, 단순한 경멸이 아니라 타자가 「무(無)」로 판정된 상태를 드러내는 표현으로 옮겼습니다.
- source_word: devorarenos
  english_pob_choice: devour us
  chosen_korean: 우리를 집어삼키고 있습니다
  alternatives_korean:
  - 우리를 삼키고 있습니다
  - 우리를 먹어치우고 있습니다
  lexicon: devorare → devour
  rationale: devorare의 강한 폭력성과 압도적 착취 이미지를 살리기 위해 직설적이고 생생한 「집어삼키다」를 선택했습니다.
theological_decisions:
- issue: 기도문의 직접 호칭과 현재형 탄원
  chosen_reading: 「이제, 주님, 보십시오」로 시작해 현재의 압박을 호소하는 기도체를 유지했습니다.
  alternative_readings:
  - 「이제, 주여, 보옵소서」
  - 「이제, 주님, 보시옵소서」
  rationale: 본문은 하나님께 드리는 탄원문이므로, 현대 합쇼체로도 직접 호칭과 긴박한 요청을 분명히 드러내는 것이 적절합니다.
  doctrine_reference: source-pragmatics
