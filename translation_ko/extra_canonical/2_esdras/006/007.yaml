translation:
  language: ko
  text: 그때 내가 대답하여 말했습니다. “시대들의 구분은 무엇입니까? 또는 이전 것의 끝과 뒤따르는 것의 시작은 언제입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어의 prioris와 sequentis는 각각 ‘이전의 것’과 ‘뒤따르는 것’이라는 명사적 대칭을 이룹니다.
    reason: source_note
lexical_decisions:
- source_word: porum ?
  english_pob_choice: What will be the dividing of the times?
  chosen_korean: 시대들의 구분은 무엇입니까?
  alternatives_korean:
  - 시대의 분리는 무엇입니까?
  - 때들의 나뉨은 무엇입니까?
  lexicon: 분리/구분
  rationale: 라틴어 구문이 시기들의 경계나 구분을 묻는 표현이므로, 한국어에서는 자연스럽고 분석적인 ‘구분’을 택해 질문의 핵심을 살렸습니다.
- source_word: prioris finis
  english_pob_choice: the end of the former
  chosen_korean: 이전 것의 끝
  alternatives_korean:
  - 먼저 것의 끝
  - 전자의 끝
  lexicon: 이전/전자
  rationale: prioris는 앞선 시대를 가리키는 실질적 명사화로 보이므로, ‘이전 것’으로 옮겨 대칭 구조를 드러냈습니다.
- source_word: sequentis initium
  english_pob_choice: the beginning of the one that follows
  chosen_korean: 뒤따르는 것의 시작
  alternatives_korean:
  - 뒤에 오는 것의 시작
  - 다음 것의 시작
  lexicon: 뒤따르다/뒤따르는 것
  rationale: sequentis는 단순히 ‘다음’이 아니라 ‘뒤따르는 것’이라는 명사적 성격이 있어, 그 대칭성을 살린 표현을 선택했습니다.
theological_decisions:
- issue: 종말론적 두 시기의 경계 묘사
  chosen_reading: ‘시대들의 구분’과 ‘이전 것/뒤따르는 것’의 병렬을 그대로 유지해, 두 시대의 전환점을 묻는 질문으로 번역했습니다.
  alternative_readings:
  - ‘때의 나뉨’으로 더 직역하기
  - ‘첫째 시대/둘째 시대’로 풀어쓰기
  rationale: 본문은 묵시적 두 시대의 경계에 대한 질문이므로, 해설을 덧붙이기보다 병렬 구조를 보존하는 것이 의미를 가장 잘 전달합니다.
  doctrine_reference: 묵시문학의 두 시대 구도
