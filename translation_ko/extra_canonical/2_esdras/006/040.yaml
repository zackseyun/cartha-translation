id: 2ES.6.40
reference: 2 Esdras 6:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tunc dixisti de thesauris tuis proferri lumen quod luminis, utapparerent tunc opera tua.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/040.yaml
  text: Then you commanded that light should be brought forth from your treasuries, so that your works might then appear.
translation:
  language: ko
  text: 그때 주께서는 주님의 보물창고들에서 빛이 나오도록 명하셨습니다. 이는 그때 주님의 일들이 드러나게 하시려는 것이었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: de thesauris tuis
  english_pob_choice: from your treasuries
  chosen_korean: 당신의 곳간에서
  alternatives_korean:
  - 당신의 보물창고에서
  - 당신의 창고에서
  lexicon: thesaurus
  rationale: 라틴어 thesauri는 단순한 저장고보다 ‘보관된 풍성한 저장처’의 이미지를 가지므로, 문맥상 자연스럽고 직관적인 ‘곳간에서’로 옮겼습니다.
- source_word: proferri lumen
  english_pob_choice: light should be brought forth
  chosen_korean: 빛이 나오도록 명하셨으니
  alternatives_korean:
  - 빛이 나오게 하셨으니
  - 빛이 드러나게 하셨으니
  lexicon: proferri / lumen
  rationale: proferri는 ‘밖으로 나오다/드러나다’의 수동적 뉘앙스를 가지므로, 창조 명령의 뉘앙스를 살리면서도 한국어로 자연스러운 ‘나오도록 명하다’로 처리했습니다.
- source_word: ut apparerent tunc opera tua
  english_pob_choice: so that your works might then appear
  chosen_korean: 그리하여 당신의 일들이 드러나게 하려 하셨습니다
  alternatives_korean:
  - 그리하여 당신의 일들이 보이게 하려 하셨습니다
  - 그리하여 당신의 행하신 일들이 나타나게 하려 하셨습니다
  lexicon: appareant / opera tua
  rationale: opera tua는 단순한 ‘작품’이 아니라 하나님이 행하신 일들을 가리키므로 ‘당신의 일들’로 옮기고, apparerent의 드러남을 ‘드러나게 하다’로 반영했습니다.
theological_decisions:
- issue: 창조적 빛의 출현과 하나님의 행하심의 계시
  chosen_reading: 빛이 나오게 하시는 명령은 하나님의 일을 드러내기 위한 목적 진술로 이해했습니다.
  alternative_readings:
  - 빛이 단지 물리적 조명으로 나오게 하셨다는 자연현상 서술
  - 하나님의 작품 자체가 빛처럼 나타난다는 상징적 독법
  rationale: 문장의 목적절(ut … apparerent) 구조가 분명하므로, 빛의 출현은 하나님의 행하신 일을 사람들이 ‘보게’ 하려는 계시적 목적을 가진 것으로 번역했습니다.
  doctrine_reference: 창조와 계시의 연결
