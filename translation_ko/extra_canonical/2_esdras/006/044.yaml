id: 2ES.6.44
reference: 2 Esdras 6:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tuum processit, et opus statim fiebat. Processit enim subito fructus multitudinis inmensus et concupiscentia gustus multiformis et flores colore inimitabiles et odores odoramentis inuestigabiles. die tertio haec facta sunt. Quarto autem die imperasti fieri solis splendorem, lunae lumen, stellarum dispositionem, Et imperasti eis ut deseruirent futuro plasmato
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/044.yaml
  text: For at once there came forth fruit in immeasurable abundance[a], and manifold delights of taste, and flowers of inimitable color, and scents of unsearchable fragrance. These things were made on the third day.
  footnotes:
  - marker: a
    text: Or 'desire for tastes of many kinds'.
    reason: previous_rendering
translation:
  language: ko
  text: 곧바로 헤아릴 수 없이 풍성한 열매와, 여러 가지 맛이 주는 즐거움과, 비길 데 없는 빛깔의 꽃들과, 그 향기를 다 헤아릴 수 없는 향내가 나왔습니다.[a] 이 모든 것은 셋째 날에 만들어졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 가지 맛을 바라는 욕구’.
    reason: 라틴어 concupiscentia는 문맥상 맛이 주는 즐거움으로 이해할 수 있으나, ‘욕구’라는 보다 직역적인 의미도 가능합니다.
lexical_decisions:
- source_word: fructus multitudinis inmensus
  english_pob_choice: fruit in immeasurable abundance
  chosen_korean: 엄청난 풍성함의 열매
  alternatives_korean:
  - 헤아릴 수 없는 풍성한 열매
  - 무한한 풍성함의 열매
  lexicon: fructus=열매; multitudinis inmensus=헤아릴 수 없는/엄청난 풍성함
  rationale: 라틴어는 단순한 ‘많은 열매’가 아니라 크기와 양의 압도적 풍성함을 함께 강조하므로, 한국어도 수량성과 충만함을 같이 드러냈습니다.
- source_word: concupiscentia gustus multiformis
  english_pob_choice: manifold delights of taste
  chosen_korean: 여러 가지 맛의 기쁨
  alternatives_korean:
  - 여러 맛의 즐거움
  - 다양한 맛의 갈망
  lexicon: concupiscentia=gustus와 결합된 ‘맛의 즐거움/기쁨’ 계열; multiformis=여러 가지의
  rationale: 영어 POB가 지적한 대로 여기의 concupiscentia는 ‘욕망’보다 객관적 ‘맛의 기쁨/즐거움’에 가깝기 때문에, 한국어에서도 내적 욕구보다 식물의 감각적 매력을 살렸습니다.
- source_word: flores colore inimitabiles
  english_pob_choice: flowers of inimitable color
  chosen_korean: 비할 데 없는 색깔의 꽃
  alternatives_korean:
  - 흉내 낼 수 없는 색의 꽃
  - 따를 수 없는 색깔의 꽃
  lexicon: inimitabiles=흉내 낼 수 없는/비할 데 없는; colore=색깔
  rationale: 색채의 독특함과 탁월함을 자연스러운 현대 한국어로 옮기기 위해 ‘비할 데 없는’으로 처리했습니다.
- source_word: odores odoramentis inuestigabiles
  english_pob_choice: scents of unsearchable fragrance
  chosen_korean: 헤아릴 수 없는 향기의 냄새
  alternatives_korean:
  - 끝까지 찾아낼 수 없는 향기의 냄새
  - 헤아릴 수 없는 향내
  lexicon: inuestigabiles=추적·탐지할 수 없는, 헤아릴 수 없는; odores odoramentis=향기의 냄새/향내
  rationale: 중첩 표현이 주는 강조를 유지하되, 한국어에서는 자연스럽게 ‘향기의 냄새’로 옮겨 감각적 강도를 살렸습니다.
theological_decisions:
- issue: 창조 서술의 시간표현
  chosen_reading: 셋째 날에 만들어졌습니다
  alternative_readings:
  - 셋째 날에 이루어졌습니다
  - 셋째 날에 생겨났습니다
  rationale: 본문의 die tertio haec facta sunt는 창조 행위의 완료를 말하므로, ‘만들어졌습니다’가 가장 सीधे하며 서술의 의도를 보존합니다.
  doctrine_reference: 창세기 1장 창조 서술과의 연속성
