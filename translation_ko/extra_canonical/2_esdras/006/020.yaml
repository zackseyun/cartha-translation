id: 2ES.6.20
reference: 2 Esdras 6:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quando suppleta fuerit humilitas Sion, Et cum supersignabitur saeculum quod incipiet pertransire, haec signa faciam: libri aperientur ante faciem firmamenti, et omnes uidebunt simul,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/020.yaml
  text: 'when the humiliation of Zion is completed[a], and when the age that is beginning to pass away is marked out, I will perform these signs: the books will be opened before the face of the firmament, and all will see together.'
  footnotes:
  - marker: a
    text: 'Or ''and when the age that is beginning to pass away is sealed over, then I will show these signs: books will be opened before the face of the firmament, and all will see together.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 시온의 수치가 마무리되고, 지나가기 시작하는 시대가 표시되면, 내가 이 표징들을 행하겠습니다. 책들이 궁창 앞에서 열리고, 모두가 함께 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “시온의 굴욕이 끝나고, 지나가기 시작하는 시대가 봉인되면, 내가 이 표징들을 행하겠습니다. 책들이 궁창 앞에서 열리고, 모두가 함께 보게 될 것입니다.”
    reason: supersignabitur를 ‘봉인되다’로 이해하는 대안적 번역을 제시하되, faciam의 ‘행하다’라는 의미와 본문 전체의 범위를 유지합니다.
lexical_decisions:
- source_word: humilitas Sion
  english_pob_choice: the humiliation of Zion is completed
  chosen_korean: 시온의 수치가 마무리되고
  alternatives_korean:
  - 시온의 굴욕이 끝나고
  - 시온의 비천함이 완성되고
  lexicon: humilitas
  rationale: 라틴어 humilitas는 여기서 단순한 ‘낮아짐’보다 시온이 겪는 수치/굴욕의 상태를 가리키므로, 원문의 압력을 살려 ‘수치’로 옮겼습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 시대가
  alternatives_korean:
  - 세상이
  - 세대가
  lexicon: saeculum
  rationale: saeculum은 문맥상 종말론적 ‘시대/현대 질서’를 뜻하므로, 한국어에서는 ‘시대’가 가장 자연스럽고 원문 의미를 덜 왜곡합니다.
- source_word: supersignabitur
  english_pob_choice: is marked out
  chosen_korean: 표시되면
  alternatives_korean:
  - 도장이 찍히면
  - 봉인되면
  - 표지되면
  lexicon: supersignare
  rationale: POB의 수정판처럼 ‘sealed’보다 강한 봉인 이미지를 피하면서도, ‘위에 표를 하다/표시하다’의 의미를 반영해 ‘표시되면’으로 옮겼습니다.
- source_word: haec signa faciam
  english_pob_choice: I will perform these signs
  chosen_korean: 내가 이 표징들을 행하겠습니다
  alternatives_korean:
  - 내가 이 표징들을 보이겠습니다
  - 내가 이 징조들을 행하겠습니다
  lexicon: signa / faciam
  rationale: faciam은 ‘보이다’가 아니라 ‘행하다/행위하다’이므로, 표징을 ‘행하겠습니다’로 번역해 신적 행위를 드러냈습니다.
- source_word: libri aperientur
  english_pob_choice: the books will be opened
  chosen_korean: 책들이 열리고
  alternatives_korean:
  - 그 책들이 열리고
  - 책들이 펼쳐지고
  lexicon: libri aperientur
  rationale: 종말론적 장부 개방의 이미지를 유지하되, 한국어 합쇼체에서 과도한 해설 없이 ‘책들이 열리고’로 간결하게 살렸습니다.
theological_decisions:
- issue: 시온의 상태를 ‘humiliation’으로 직역할지, 완곡하게 풀지
  chosen_reading: 시온의 수치가 마무리되고
  alternative_readings:
  - 시온의 낮아짐이 끝나고
  - 시온의 굴욕이 끝나고
  rationale: 본문은 시온의 현재 상태를 단순한 겸손이 아니라 수치와 굴욕의 종말로 묘사하므로, 독자에게 종말론적 긴장감을 전달하는 쪽을 택했습니다.
  doctrine_reference: 종말론적 회복과 시온의 수치 종결이라는 본문 흐름
