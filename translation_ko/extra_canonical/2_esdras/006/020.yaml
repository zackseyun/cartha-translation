revisions:
- from: 시온의 수치가 마무리되고, 사라져 가기 시작한 시대가 표시되면, 내가 이 표징들을 행하겠습니다. 책들이 궁창 앞에서 열리고, 모든 사람이 함께 보게 될 것입니다.[a]
  to: 시온의 수치가 마무리되고, 지나가기 시작하는 시대가 표시되면, 내가 이 표징들을 행하겠습니다. 책들이 궁창 앞에서 열리고, 모두가 함께 보게 될 것입니다.[a]
  rationale: 원문의 포괄적 대명사 omnes를 사람으로 한정하지 않고 보존했으며, pertransire의 진행 의미를 더 자연스럽게 드러냈습니다. 또한 각주의 대안 번역에서 faciam을 원문에 맞게 ‘행하겠습니다’로 바로잡았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:07Z'
review_pass:
  verdict: revise
  source_fidelity: 대체로 라틴어 원문을 충실히 반영합니다. 다만 '모든 사람이'은 omnes의 범위를 불필요하게 사람으로 한정합니다. 원문은 '모두가/모든 이가'라고만 하므로 그대로 보존하는 편이 좋습니다. 또한 supersignabitur의 수동 미래형과 '표지/표시'의 의미는 본문에서 잘 살렸습니다.
  naturalness: 합쇼체 문장은 전반적으로 자연스럽습니다. 그러나 '사라져 가기 시작한 시대'는 'beginning to pass away'를 다소 어색하게 압축하므로 '지나가기 시작하는 시대'가 더 직접적이고 자연스럽습니다. '궁창 앞에서'는 원문의 ante faciem firmamenti를 직역적으로 보존하며 문맥상 허용됩니다.
  terminology: '''시온의 수치''는 humilitas의 문맥상 의미를 적절히 전달하고, ''시대'', ''표징'', ''궁창''도 적합합니다. libri는 ''책들''로 유지하는 것이 좋습니다. 대안 각주는 현행 영어 감사 기록의 대안문을 충분히 반영하되, 본문과 달리 faciam을 ''보이겠습니다''로 옮기는 것은 원문상 약하므로 대안으로 제시하지 않는 편이 안전합니다.'
  issues:
  - severity: medium
    issue: omnes를 '모든 사람'으로 한정함
    rationale: 라틴어 omnes는 명시적으로 '사람들'이라고 하지 않습니다. 종말론적 장면의 포괄성을 유지하도록 '모두가' 또는 '모든 이가'가 적절합니다.
  - severity: low
    issue: '''사라져 가기 시작한 시대''의 결합이 다소 어색함'
    rationale: quod incipiet pertransire는 '지나가기 시작하는'이라는 진행 의미를 담습니다. 이를 더 투명하게 옮기는 편이 자연스럽고 원문 구조에도 가깝습니다.
  - severity: medium
    issue: 각주 대안문이 faciam을 '보이겠습니다'로 번역함
    rationale: faciam은 '행하겠다/이루겠다'이지 '보이겠다'가 아닙니다. supersignabitur의 해석 대안을 제시하더라도 동사 의미는 유지해야 합니다.
  revised_text: 시온의 수치가 마무리되고, 지나가기 시작하는 시대가 표시되면, 내가 이 표징들을 행하겠습니다. 책들이 궁창 앞에서 열리고, 모두가 함께 보게 될 것입니다.[a]
