  revision_rationale: 원문의 포괄적 대명사 omnes를 사람으로 한정하지 않고 보존했으며, pertransire의 진행 의미를 더 자연스럽게 드러냈습니다. 또한 각주의 대안 번역에서 faciam을 원문에 맞게 ‘행하겠습니다’로 바로잡았습니다.
