  yaml_path: translation/extra_canonical/2_esdras/006/052.yaml
  text: but Leviathan you gave the moist seventh part, and you have kept it to be food for whom you wish and when you wish.
translation:
  language: ko
  text: 그러나 레비아탄에게는 습한 일곱째 부분을 주셨고, 그것을 당신께서 원하시는 이들에게 원하시는 때에 음식이 되도록 보존하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제시된 라틴 본문은 ‘보존하셨고, 그것들이/그것이 …이 되도록’(seruasti ea ut fiant in)에서 문장 중간에 끝납니다. 따라서 ‘음식이 되도록’과 그 대상·시점은 영어 POB의 보완을 따라 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Leuiathan
  english_pob_choice: Leviathan
  chosen_korean: 레비아탄
  alternatives_korean:
  - 리워야단
  - 거대한 바다 괴물
  lexicon: 고유명사
  rationale: 라틴 본문과 영어 POB가 가리키는 상징적 존재 이름을 그대로 음역해, 본문의 고유 표지를 유지했습니다.
- source_word: septimam partem humidam
  english_pob_choice: the moist seventh part
  chosen_korean: 습한 일곱째 부분
  alternatives_korean:
  - 젖은 일곱째 몫
  - 습기가 많은 일곱 번째 몫
  lexicon: partem
  rationale: partem을 ‘부분’으로, humidam을 ‘습한’으로 옮겨 원문의 질감과 분할 이미지를 살렸습니다.
- source_word: seruasti ea ut fiant in
  english_pob_choice: you have kept it to be food for whom you wish and when you wish
  chosen_korean: 그것을 음식이 되도록 보존하셨습니다
  alternatives_korean:
  - 그것을 먹이가 되도록 남겨 두셨습니다
  - 그것을 음식으로 두셨습니다
  lexicon: seruasti / fiant
  rationale: seruasti는 단순 보유보다 목적적 보존을 드러내는 ‘보존하셨습니다’로, fiant은 결과 목적을 나타내는 ‘되도록’으로 처리했습니다.
theological_decisions:
- issue: 레비아탄과 보존된 몫의 관계를 어떻게 드러낼지
  chosen_reading: 레비아탄에게 주신 ‘습한 일곱째 부분’을 하나님이 특정한 때와 대상의 음식으로 보존하셨다고 옮겼습니다.
  alternative_readings:
  - 레비아탄 자체를 음식으로 보존하셨다고 읽는 번역
  - 문장을 축약해 보존의 목적을 약화하는 번역
  rationale: 라틴문장의 구조상 레비아탄과 ‘보존된 것’은 구분되며, 영어 POB의 ‘kept it to be food’도 같은 구분을 유지하므로 목적성과 대상 구분을 살렸습니다.
  doctrine_reference: 문자적-상징적 혼합 표현의 보존
