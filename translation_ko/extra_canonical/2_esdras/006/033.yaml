  verdict: revise
  source_fidelity: 라틴어의 병렬 부정사 demonstrare(보여 주다)와 dicere(말하다)를 모두 보존하되, 한국어에서는 ‘보내어 … 말하게 하셨습니다’보다 목적 관계가 더 분명하게 드러나도록 다듬었습니다. confide는 ‘담대하십시오’도 가능하지만, 현대 한국어에서 권면으로 더 자연스러운 ‘용기를 내십시오’로 옮겼습니다.
  naturalness: 초안의 ‘당신에게 말하게 하셨습니다’는 문법상 가능하나 다소 우회적입니다. ‘당신에게 이렇게 말하라고 하셨습니다’가 현대 합쇼체에서 자연스럽고 화자의 발화를 명확히 합니다.
  terminology: 신명과 두려움의 대조를 유지했습니다. 인칭 대명사 ‘당신’은 원문의 2인칭 단수에 대응하도록 유지했습니다.
