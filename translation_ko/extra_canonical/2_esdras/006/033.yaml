  text: Therefore he sent me to show you all these things and to say to you, ‘Take courage and do not fear,
translation:
  language: ko
  text: 그러므로 그가 나를 보내어 이 모든 것을 당신에게 보여 주고, 당신에게 말하게 하셨습니다. 「담대하십시오. 두려워하지 마십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misit me
  english_pob_choice: he sent me
  chosen_korean: 나를 보내어
  alternatives_korean:
  - 나를 파견하여
  - 나를 보냈습니다
  lexicon: mittere
  rationale: 보내다는 파견의 뜻을 자연스럽게 살리면서도, 본문의 전달 기능을 과장하지 않고 그대로 옮깁니다.
- source_word: 'demonstrare tibi: haec omnia'
  english_pob_choice: to show you all these things
  chosen_korean: 이 모든 것을 당신에게 보여 주고
  alternatives_korean:
  - 이 모든 것을 당신에게 나타내고
  - 이 모든 것을 당신에게 보이고
  lexicon: demonstrare
  rationale: demonstrare의 ‘보여 주다/드러내다’ 의미를 살려, 이어지는 ‘말하게 하다’와 병렬 구조가 자연스럽게 되도록 했습니다.
- source_word: confide
  english_pob_choice: Take courage
  chosen_korean: 담대하십시오
  alternatives_korean:
  - 용기를 내십시오
  - 마음을 굳게 하십시오
  lexicon: confidere
  rationale: 히브리-성서적 권면에서 흔한 ‘두려움 대 용기’ 대조를 살리면서, 현대 합쇼체에서 직접적이고 공적 권면으로 들리게 했습니다.
- source_word: noli timere
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말하십시오
  lexicon: timere
  rationale: 금지 명령의 반복을 분명히 하기 위해 ‘두려워하지 마십시오’를 유지했습니다.
theological_decisions:
- issue: 직접 인용의 종결과 화법
  chosen_reading: 따옴표 안의 권면은 직접 인용으로 처리해, 수신자에게 주어지는 격려의 긴박함을 살렸습니다.
  alternative_readings:
  - 따옴표 없이 서술문으로 풀어쓰기
  - 간접화법으로 완화
  rationale: 본문은 ‘말하게 하다’ 뒤에 이어지는 직접 권면이므로, 한국어에서도 인용부호로 분리해 전달성과 권면성을 보존하는 것이 가장 적절합니다.
  doctrine_reference: 담화 구조와 명령형 보존
