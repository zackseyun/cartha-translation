  source_fidelity: 초안은 coram te ministrantia를 ‘당신 앞에 있는 것들’ 및 ‘섬기는 상태’로 재구성하여, 원문의 ‘당신 앞에서 섬기는’ 수식 관계를 흐렸습니다. 또한 adeo는 여기서 ‘곧바로’라는 시간 부사가 아니며, 영어의 ‘immediately’는 이 문맥의 이어지는 라틴어 statim에 해당합니다. ‘당신의’와 ‘나갔기 때문입니다’는 제시된 라틴어 단편의 Verbum enim만으로는 단정할 수 없지만, 영어 POB가 보존한 완결 문맥에서는 정당합니다.
  naturalness: ‘씨 뿌려지고 가꾸어져 곧바로 섬기는 상태가 되었습니다’는 한국어 어순과 결합이 부자연스럽고, 피동 농경 이미지와 ‘섬기는 상태’가 문법적으로도 매끄럽게 연결되지 않습니다. ‘당신 앞에서 섬기도록 … 길러졌습니다’가 자연스럽고 원문의 목적·기능 관계를 잘 보존합니다.
  terminology: verbum은 이 문맥에서 ‘말씀’으로 옮길 수 있습니다. ministrantia는 추상 명사적 ‘섬기는 상태’보다 ‘섬기도록’으로 처리하는 편이 현재분사의 기능을 더 충실히 반영합니다. seminata/culta의 농경 은유는 ‘씨 뿌려지고 길러졌습니다’로 유지합니다.
