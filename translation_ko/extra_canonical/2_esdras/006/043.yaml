  text: For your word went forth, and the work was immediately done.
translation:
  language: ko
  text: 당신 앞에 있는 것들은 씨 뿌려지고 가꾸어져 곧바로 섬기는 상태가 되었습니다. 이는 당신의 말씀이 나갔기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “당신 앞에서 섬기며, 씨 뿌려지고 가꾸어진”이라는 농경·봉사 이미지가 더 분명합니다.
    reason: source_note
lexical_decisions:
- source_word: coram te
  english_pob_choice: For your word went forth, and the work was immediately done.
  chosen_korean: 당신 앞에 있는 것들은
  alternatives_korean:
  - 당신 앞에서
  - 당신 앞에
  lexicon: coram + ablative
  rationale: 라틴어 coram te는 단순한 위치보다 ‘당신 앞에서/앞에’의 현존 감각을 주므로, 문맥상 주어를 보충해 자연스럽게 옮겼습니다.
- source_word: ministrantia
  english_pob_choice: the work
  chosen_korean: 섬기는 상태가 되었습니다
  alternatives_korean:
  - 봉사하는 일이 되었습니다
  - 섬기는 일로 나타났습니다
  lexicon: ministrare
  rationale: ministrantia는 ‘섬기다/봉사하다’ 계열로, 단순한 일반 ‘work’보다 기능적·봉사적 뉘앙스가 있어 이를 드러내는 표현을 택했습니다.
- source_word: seminata adeo et culta
  english_pob_choice: the work was immediately done
  chosen_korean: 씨 뿌려지고 가꾸어져 곧바로
  alternatives_korean:
  - 뿌려지고 가꾸어져 즉시
  - 심기고 돌보아져 바로
  lexicon: seminare / colere
  rationale: 원문은 ‘씨 뿌리다, 가꾸다’의 농경 이미지를 직접 담고 있으므로, 영어의 일반화된 ‘done’보다 원문의 비유를 살려 번역했습니다.
- source_word: Verbum enim
  english_pob_choice: For your word went forth
  chosen_korean: 이는 당신의 말씀이 나갔기 때문입니다
  alternatives_korean:
  - 이는 당신의 말씀이 나갔기 때문입니다
  - 곧 당신의 말씀이 나갔기 때문입니다
  lexicon: verbum
  rationale: Verbum은 여기서 단순한 ‘말’보다 신적 명령/선언으로서의 ‘말씀’이 적절하며, 영어 POB의 ‘your word’에 맞춰 인과절로 옮겼습니다.
theological_decisions:
- issue: 원문의 농경적·봉사적 이미지와 영어 POB의 요약적 표현 사이의 긴장
  chosen_reading: 원문의 씨 뿌림/가꿈/섬김 이미지를 살리되, 마지막에 인과를 분명히 하여 의미를 이해 가능하게 했습니다.
  alternative_readings:
  - 영어처럼 “일이 즉시 이루어졌습니다”로 단순화
  - 원문 이미지를 더 직역해 어색한 문장으로 유지
  rationale: 이 구절은 결과의 즉시성뿐 아니라, 말씀이 선행하고 그에 따라 준비·성장·섬김이 발생한다는 질서를 보여 주므로 두 층위를 함께 드러내는 편이 좋습니다.
  doctrine_reference: 신적 말씀의 효력과 창조적 명령의 즉시성
- issue: ministrantia의 의미를 ‘봉사/섬김’으로 살릴지 일반적 ‘일/work’로 평준화할지
  chosen_reading: ‘섬기는 상태’로 옮겨 기능적 의미를 보존했습니다.
  alternative_readings:
  - 그저 ‘일’로 번역
  - ‘봉사하는 것’으로 완전 치환
  rationale: 라틴어 현재분사형은 단순 산출물보다 작동 방식과 태도를 암시하므로, 봉사적 의미를 살려 본문의 결을 유지했습니다.
  doctrine_reference: 문헌적 이미지 보존
