  rationale: 농경 이미지(seminata, culta)와 섬김의 기능(ministrantia)을 보존하고, 완결된 영어 POB 문맥에 따라 말씀의 발출과 즉각적 성취를 자연스러운 합쇼체로 옮겼습니다. ‘곧’은 제시된 단편의 adeo가 아니라 해당 완결 문맥의 즉시성에 대응하도록 두 번째 문장에만 배치했습니다.
