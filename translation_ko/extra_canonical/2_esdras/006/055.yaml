source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: haec autem omnia dixi coram te, Domine, quoniam dixisti quia propter nos creasti primogenitum saeculum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/055.yaml
  text: But I have said all these things before you[a], Lord, because you said that for our sake you created the first world.
  footnotes:
  - marker: a
    text: Or 'All these things I have spoken before you, Lord, because you said that for our sake you created the firstborn world.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 제가 주님 앞에서 이 모든 것을 말씀드린 것은, 주님께서 우리를 위하여 첫 세계를 창조하셨다고 말씀하셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이 세상’. 라틴어 본문은 ‘첫 세계’를 읽지만, 다른 전승은 ‘이 세상’을 읽습니다.
    reason: primogenitum saeculum의 상이한 전승 독법을 보존하면서 제시된 라틴어 본문을 본문 번역에 반영합니다.
lexical_decisions:
- source_word: haec autem omnia
  english_pob_choice: But I have said all these things
  chosen_korean: 그러나 제가 이 모든 것을 말한 것은
  alternatives_korean:
  - 하지만 제가 이 모든 것을 말한 것은
  - 그리고 제가 이 모든 것을 말한 것은
  lexicon: haec autem omnia / dixi
  rationale: autem의 전환 의미를 살려 ‘그러나’로 시작했고, dixi는 ‘말하다’가 자연스러워 ‘말한 것은’으로 옮겼습니다.
- source_word: coram te, Domine
  english_pob_choice: before you, Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님께
  - 주님 앞에
  lexicon: coram
  rationale: coram의 ‘면전에서, 앞에서’라는 공간적·관계적 뉘앙스를 살려 ‘주님 앞에서’로 옮겼습니다.
- source_word: propter nos
  english_pob_choice: for our sake
  chosen_korean: 우리를 위하여
  alternatives_korean:
  - 우리 때문에
  - 우리의 유익을 위해
  lexicon: propter
  rationale: propter nos는 원인보다 목적/이익의 방향을 나타내므로, 한국어에서는 ‘우리를 위하여’가 가장 간결하고 정확합니다.
- source_word: creasti primogenitum saeculum
  english_pob_choice: you created the first world
  chosen_korean: 이 세상을 창조하셨다고
  alternatives_korean:
  - 첫 세계를 창조하셨다고
  - 처음 세계를 창조하셨다고
  lexicon: saeculum
  rationale: 아우터 리뷰가 지적한 대로 여기서는 ‘firstborn world’가 아니라 ‘this world’의 독법을 따르며, saeculum은 문맥상 ‘이 세상’이 자연스럽습니다.
theological_decisions:
- issue: primogenitum saeculum의 독법
  chosen_reading: ‘첫(맏) 세계’보다 ‘이 세상’으로 옮겨, 피조 세계 전체를 가리키는 문맥을 따랐습니다.
  alternative_readings:
  - 첫 세계
  - 맏세계
  rationale: 주어진 개정 이력에 따르면 라틴어의 primogenitum은 오기 가능성이 크며, 이 절의 신학적 대비는 ‘우리 때문에 창조된 이 세상’에 있습니다. 한국어 본문도 그 의미를 분명히 드러내는 편이 더 적절합니다.
  doctrine_reference: 창조론; 본문비평
- issue: 주님 호칭
  chosen_reading: 직접 호칭은 ‘주님’으로 유지하고, 문장 전체는 현대 합쇼체로 정리했습니다.
  alternative_readings:
  - 주여
  - 주님이여
  rationale: 본문은 예언적/기도적 진술이므로 직접 호칭을 존중하되, 한국어 독자에게는 현대적이고 공적 문체가 더 자연스럽습니다.
  doctrine_reference: 문체·화행
