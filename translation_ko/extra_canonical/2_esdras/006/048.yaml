id: 2ES.6.48
reference: 2 Esdras 6:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: congregata, ut procrearet animalia, uolatilia et pisces; Et ita fiebat aqua muta et sine anima, quod ei iubebatur, animalia
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/048.yaml
  text: 'gathered together[a], that it might produce animals, birds, and fish; and so it happened: the mute water, which had no life, produced living creatures as it had been commanded.'
  footnotes:
  - marker: a
    text: Or 'produced living things as it had been commanded'.
    reason: previous_rendering
translation:
  language: ko
  text: 모여서 짐승들과 새들과 물고기들을 낳게 하셨습니다. 그리고 그리되었습니다. 생명 없는 벙어리 물이, 명령받은 대로 살아 있는 피조물들을 낳았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘벙어리 물’은 라틴어 muta의 직역적 뉘앙스를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: congregata
  english_pob_choice: gathered together
  chosen_korean: 모여서
  alternatives_korean:
  - 함께 모여
  - 집결하여
  lexicon: congrego
  rationale: 문맥상 물이 한데 모인 상태를 가리키므로, 결과 상태를 자연스럽게 살리는 ‘모여서’로 옮겼습니다.
- source_word: ut procrearet animalia, uolatilia et pisces
  english_pob_choice: that it might produce animals, birds, and fish
  chosen_korean: 짐승들과 새들과 물고기들을 낳게 하셨습니다
  alternatives_korean:
  - 동물들과 새들과 물고기들을 낳게 하셨습니다
  - 짐승들과 날짐승들과 물고기들을 낳게 하셨습니다
  lexicon: procreo / animalia / uolatilia / pisces
  rationale: procrearet는 ‘생산하다’보다 생물을 ‘낳다/산출하다’의 뜻이 강해 창조 서술에 맞게 ‘낳게 하셨습니다’로 옮겼고, uolatilia는 비행하는 새류를 가리켜 ‘새들’로 처리했습니다.
- source_word: aqua muta et sine anima
  english_pob_choice: the mute water, which had no life
  chosen_korean: 생명 없는 벙어리 물이
  alternatives_korean:
  - 말 못 하는 물이, 생명이 없는 물이
  - 생명이 없고 말 못 하는 물이
  lexicon: muta / sine anima
  rationale: muta를 단순히 ‘무생물’로 풀기보다 물의 무생명성과 비유적 ‘벙어리’ 이미지를 함께 살려, 원문의 수사적 긴장을 유지했습니다.
- source_word: animalia
  english_pob_choice: living creatures
  chosen_korean: 살아 있는 피조물들
  alternatives_korean:
  - 살아 있는 생물들
  - 생명체들
  lexicon: animalia
  rationale: POB의 ‘living creatures’에 맞추되, 창조 문맥에서 피조물의 성격을 분명히 하려고 ‘피조물들’을 선택했습니다.
theological_decisions:
- issue: 창조의 원천이 물 자체인지, 하나님의 명령에 따른 것인지
  chosen_reading: 물은 스스로가 아니라 명령받은 대로 살아 있는 피조물을 낳는 매개로 제시됩니다.
  alternative_readings:
  - 물에 내재한 생명력이 강조된다
  - 자연의 자생적 생성이 강조된다
  rationale: 라틴어 quod ei iubebatur와 POB의 'as it had been commanded'를 따라, 창조의 주도권은 물이 아니라 명령하시는 하나님께 있음을 분명히 했습니다.
  doctrine_reference: 창조론, 섭리
