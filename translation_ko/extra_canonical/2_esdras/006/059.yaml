  verdict: revise
  source_fidelity: 라틴어의 조건문, 창조의 목적(propter nos), 상속으로서의 소유(hereditatem possidemus), 그리고 탄식 어린 종결 의문(usquequo haec)을 충실히 반영합니다. 다만 초안의 ‘상속으로 차지하다’는 한국어에서 다소 부자연스럽고, ‘우리 세상’도 소유·상속의 관계가 충분히 분명하지 않습니다.
  naturalness: ‘우리의 세상을 유업으로 얻다’는 상속의 의미와 목적어를 자연스럽게 연결합니다. 마지막 문장은 라틴어의 타원적 탄식을 한국어의 자연스러운 지속 의문문으로 옮깁니다.
  terminology: ‘세상’은 saeculum에 적절하며, ‘유업’은 hereditas의 상속·유산 의미를 간결하게 보존하는 성서적이면서도 현대 한국어에서 통용되는 표현입니다. ‘창조되었다면’과 합쇼체 의문형도 일관됩니다.
  issues:
