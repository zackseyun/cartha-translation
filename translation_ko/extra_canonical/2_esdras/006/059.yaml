id: 2ES.6.59
reference: 2 Esdras 6:59
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si propter nos creatum est saeculum, quare non hereditatem possidemus nostrum saeculum? usquequo haec?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/059.yaml
  text: And if the world was created for our sake, why do we not possess our world as an inheritance? How long will this be?”
translation:
  language: ko
  text: 그리고 만일 이 세상이 우리를 위하여 창조되었다면, 왜 우리는 우리 세상을 상속으로 차지하지 못합니까? 이것이 언제까지이겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  english_pob_choice: the world
  chosen_korean: 이 세상
  alternatives_korean:
  - 세상
  - 세계
  - 현세
  lexicon: saeculum
  rationale: 문맥상 단순한 우주 전체보다 인간이 사는 현존 질서로서의 ‘세상’이 적절하며, POB의 ‘the world’ 의미를 자연스럽게 반영합니다.
- source_word: propter nos
  english_pob_choice: for our sake
  chosen_korean: 우리를 위하여
  alternatives_korean:
  - 우리 때문으로
  - 우리의 खातिर로
  - 우리를 위해
  lexicon: propter
  rationale: 목적·이유의 관계를 분명히 하는 전치사구로, 현대 한국어에서는 ‘우리를 위하여’가 가장 직접적이고 공손한 표현입니다.
- source_word: hereditatem possidemus
  english_pob_choice: do we not possess ... as an inheritance
  chosen_korean: 상속으로 차지하지 못합니까
  alternatives_korean:
  - 유업으로 받지 못합니까
  - 상속받아 소유하지 못합니까
  - 물려받아 차지하지 못합니까
  lexicon: hereditas / possideo
  rationale: 단순 소유보다 ‘상속/유업’의 법적·가문적 뉘앙스를 살리기 위해 ‘상속으로 차지하다’로 옮겼습니다.
- source_word: usquequo haec
  english_pob_choice: How long will this be?
  chosen_korean: 이것이 언제까지이겠습니까?
  alternatives_korean:
  - 이 일이 언제까지 계속되겠습니까?
  - 이것이 언제까지입니까?
  - 언제까지 이렇게 되겠습니까?
  lexicon: usquequo
  rationale: 탄식의 종결을 살리면서도 한국어 문장으로 자연스럽게 만들기 위해 직역에 가까운 의문형을 사용했습니다.
theological_decisions:
- issue: ‘world’의 범위
  chosen_reading: 이 세상은 창조 목적이 인간과 관련된 현존 질서로 읽었습니다.
  alternative_readings:
  - 우주 전체로 읽을 수 있습니다.
  - 세상 체제의 의미로 읽을 수 있습니다.
  rationale: 라틴어 saeculum과 영어 POB의 ‘the world’는 본문 논리상 ‘인간을 둘러싼 세계/세상’으로 읽는 것이 가장 무리 없으며, 과도한 철학적 확장을 피합니다.
  doctrine_reference: 창조와 인간의 상속 약속이라는 본문 맥락
