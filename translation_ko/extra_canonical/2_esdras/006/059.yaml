  - severity: low
    issue: ‘우리 세상’은 한국어에서 수식 관계가 다소 불분명합니다.
    rationale: nostrum saeculum의 ‘우리의’ 관계를 분명히 하기 위해 ‘우리의 세상’으로 씁니다.
