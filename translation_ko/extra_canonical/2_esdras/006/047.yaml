review_pass:
  verdict: revise
  source_fidelity: 라틴어 *ubi erat aqua*는 직역하면 ‘물이 있던 곳/부분에’이며, 물이 ‘모여 있었다’는 집결의 의미는 이 구절의 라틴어 표현 자체에는 명시되지 않습니다. 따라서 초안의 ‘모여 있던’은 원문보다 해석을 더합니다. 또한 *aqua*의 단수는 한국어 비가산 명사 ‘물’로 자연스럽게 반영됩니다.
  naturalness: ‘일곱째 부분에게 말씀하시어’는 문법적으로 가능하지만 다소 어색합니다. 관계절을 앞에 두고 ‘물이 있던 일곱째 부분에게 말씀하셔서’라고 하면 현대 한국어 문장 흐름이 더 자연스럽습니다.
  terminology: ‘살아 있는 생물’은 ‘living creatures’에 충실하면서도 ‘피조물’보다 자연스럽습니다. 새와 물고기가 이미 생물 범주에 속하지만, 원문의 열거를 보존해야 하므로 그대로 병렬합니다. 초안의 각주에는 번역 본문에 필요한 본문비평 정보가 아니라 영어 수정 이력에 대한 메타 설명이 담겨 있으므로 삭제하는 것이 적절합니다.
  issues:
