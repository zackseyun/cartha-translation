    issue: ‘물이 모여 있던’이 라틴어 *ubi erat aqua*에 없는 집결 의미를 첨가합니다.
    rationale: 이 표현은 ‘물이 있었다’라고만 하는 라틴어보다 창세기 배경 및 영어 감사 문구에 의존한 해석적 확장입니다. 원문의 표현을 보존하려면 ‘물이 있던’으로 옮겨야 합니다.
  - severity: low
