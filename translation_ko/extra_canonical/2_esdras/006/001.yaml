  source_fidelity: ‘시대의 끝들’은 라틴어 *exitus saeculi*의 가능한 직역이지만, 이 창조 전 우주 질서의 열거에서는 공간적 경계 또는 출구를 가리킬 가능성이 높습니다. ‘세상의 경계들’로 옮기고 각주에서 시간적 독법과 직역 가능성을 보존하는 것이 더 충실합니다. *Conuentiones uentorum*은 바람들이 모인 무리라는 명사적 표현을 유지하되, *spirarent*는 ‘불다’로 자연스럽게 옮겼습니다.
  naturalness: 초안의 ‘시대의 끝들이 세워지기 전’과 ‘바람들의 모임이 불기 전’은 문법상 가능하지만 현대 한국어에서는 다소 부자연스럽습니다. ‘세상의 경계들이 자리 잡기 전, 바람의 무리들이 불기 전’이 원문의 반복 구조와 장중한 문체를 보존하면서 더 자연스럽습니다.
  terminology: ‘지상의 세계’는 *terreni orbis*의 지상적·우주론적 지시를 보존합니다. ‘세상의 경계들’은 문맥상 *exitus*를 명료하게 처리하되, 각주가 *saeculi*의 ‘시대’ 독법 및 ‘출구들’이라는 직역 가능성을 남깁니다. ‘그가 제게 말씀하셨습니다’는 서사 문맥의 합쇼체에 적합합니다.
