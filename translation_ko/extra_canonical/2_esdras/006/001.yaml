source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me: initium terreni orbis, et antequam starent exitus saeculi et antequam spirarent conuentiones uentorum, Et antequam sonarent uoces tonitruum, et antequam splenderent nitores coruscuum et antequam confirmarentur'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/001.yaml
  text: And he said to me[a], “At the beginning of the earthly world, before the ends of the age were established, and before the gatherings of the winds blew,
  footnotes:
  - marker: a
    text: Or 'exits of the age'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “지상의 세계가 시작될 때, 세상의 경계들이[a] 자리 잡기 전, 바람의 무리들이 불기 전…”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘시대의 끝들’ 또는 ‘시대의 출구들’입니다. ‘시대’는 여기서 ‘세계’를 뜻할 수도 있습니다.
    reason: 라틴어 exitus saeculi의 시간적·공간적 의미 범위를 보존합니다.
lexical_decisions:
- source_word: initium terreni orbis
  english_pob_choice: At the beginning of the earthly world
  chosen_korean: 땅의 세계가 시작될 때
  alternatives_korean:
  - 세상의 시작에
  - 지상의 세계가 시작될 때
  - 땅의 우주가 시작될 때
  lexicon: initium / terrenus / orbis
  rationale: initium은 단순한 ‘처음’이지만 문맥상 창조의 개시를 가리키므로 ‘시작될 때’로 풀었고, terreni orbis는 우주적 공간이 아니라 ‘땅의 세계’라는 지시를 살렸습니다.
- source_word: exitus saeculi
  english_pob_choice: the ends of the age
  chosen_korean: 시대의 끝들
  alternatives_korean:
  - 세상의 끝들
  - 시대의 출구들
  - 세기의 끝들
  lexicon: exitus / saeculum
  rationale: POB의 최신 주석처럼 exitus는 시간적 ‘종말’이 아니라 경계·끝자락의 복수형 뉘앙스를 갖는 것으로 보아 ‘끝들’로 두었고, saeculum도 여기서는 ‘세계/시대’의 겹친 의미를 반영해 ‘시대’로 옮겼습니다.
- source_word: starent
  english_pob_choice: were established
  chosen_korean: 세워지기 전
  alternatives_korean:
  - 서기 전
  - 확립되기 전
  - 고정되기 전
  lexicon: stare
  rationale: starent는 ‘서다, 확립되다’의 상태를 가리키므로, 한국어에서는 결과 상태보다 과정의 완료를 드러내는 ‘세워지다’가 가장 자연스럽습니다.
- source_word: conuentiones uentorum
  english_pob_choice: the gatherings of the winds
  chosen_korean: 바람들의 모임
  alternatives_korean:
  - 바람들의 집합
  - 바람의 모여듦
  - 바람들의 집결
  lexicon: conuentiones / venti
  rationale: conuentiones는 단순한 ‘불어옴’보다 여러 바람이 함께 모이는 장면을 뜻하므로 ‘모임’으로 살렸고, 복수형 ventorum은 ‘바람들’로 보존했습니다.
theological_decisions:
- issue: 우주 창조의 질서 정립을 묘사하는 열거문에서 시적 긴장 보존
  chosen_reading: 문장을 평서형으로 매끄럽게 풀되, 열거가 아직 끝나지 않은 듯한 생략부호로 창조 이전의 긴장감을 남겼습니다.
  alternative_readings:
  - 마침표로 닫아 완결된 진술로 처리
  - 더 직역적으로 ‘…불기 전’의 반복을 모두 길게 유지
  rationale: 이 구절은 창조 이전 질서가 세워지는 장면을 연속 열거로 제시하므로, 한국어에서도 문장의 미완성과 예비성을 드러내는 것이 원문의 수사에 부합합니다.
  doctrine_reference: 2 Esdras 6:1 apocalyptic cosmology
