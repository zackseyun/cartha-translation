translation:
  language: ko
  text: 이 시대의 끝은 에서이고, 뒤따르는 것의 시작은 야곱입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘뒤따르는 것’입니다. 본문은 다음 시대/다음 질서를 가리키는 종말론적 대비를 말합니다.
    reason: cultural_note
lexical_decisions:
- source_word: finis
  english_pob_choice: the end
  chosen_korean: 끝
  alternatives_korean:
  - 종말
  - 마지막
  lexicon: finis
  rationale: Latin의 핵심 명사 의미를 그대로 살려, 시간의 ‘종말’보다 대칭 구조를 드러내는 중립적 표현 ‘끝’을 택했습니다.
- source_word: huius saeculi
  english_pob_choice: this age
  chosen_korean: 이 시대
  alternatives_korean:
  - 이 세대
  - 이 세상
  lexicon: saeculum
  rationale: saeculum은 단순한 우주 전체보다 현재의 시대/질서를 가리키므로, 문맥상 ‘이 시대’가 가장 직접적입니다.
- source_word: principium sequentis
  english_pob_choice: the beginning of the one that follows
  chosen_korean: 뒤따르는 것의 시작
  alternatives_korean:
  - 뒤따르는 것의 첫머리
  - 다음 것의 시작
  lexicon: principium + sequentis
  rationale: 반복되는 대응 구조를 살리면서, sequentis의 ‘뒤따르는’ 뉘앙스를 자연스럽게 옮겼습니다.
- source_word: Esau / Iacob
  english_pob_choice: Esau / Jacob
  chosen_korean: 에서 / 야곱
  alternatives_korean:
  - 에사우 / 야곱
  lexicon: 고유명사
  rationale: 야곱은 한국어 성경에서 널리 굳어진 형태를 따랐고, Esau는 현대 음역 기준에 따라 ‘에서’로 옮겼습니다.
theological_decisions:
- issue: 종말론적 대칭 표현의 보존
  chosen_reading: 문장의 대응 관계를 살려 ‘이 시대의 끝은 에서이고, 뒤따르는 것의 시작은 야곱입니다’로 옮겼습니다.
  alternative_readings:
  - ‘에서가 이 시대의 끝입니다, 그리고 야곱이 뒤따르는 것의 시작입니다’
  - ‘이 시대의 끝은 에서이며, 다음 시대의 시작은 야곱입니다’
  rationale: 본문은 인물 이름을 단순 서술하기보다 ‘끝/시작’의 대응을 통해 현재-미래의 전환을 예시합니다. 한국어에서도 이 수사 구조를 분명히 보존해야 합니다.
  doctrine_reference: 문맥상 4 Ezra의 종말론적 상징 대조
