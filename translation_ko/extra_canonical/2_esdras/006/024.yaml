source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et erit in illo tempore debellabunt amici amicos ut inimici, et expauescet terra cum his qui inhabitant eam, et uenae fontium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/024.yaml
  text: 'And it will be in that time: friends will make war on friends like enemies[a], and the earth will be terrified along with those who dwell in it, and the channels of the springs will stand still so as not to run for three hours.'
  footnotes:
  - marker: a
    text: Or 'will be terrified with those who dwell in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그때가 되면 친구들이 원수들처럼 서로를 치겠고, 땅은 그 안에 거하는 자들과 함께 두려워할 것이며, 샘들의 물줄기는 세 시간 동안 흐르지 못하게 멈출 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 cum은 여기서 ‘~과 함께’라는 동반의 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: debellabunt amici amicos ut inimici
  english_pob_choice: friends will make war on friends like enemies
  chosen_korean: 친구들이 원수들처럼 서로를 치겠고
  alternatives_korean:
  - 친구들이 친구들과 원수처럼 싸우겠고
  - 친구들이 원수처럼 서로 싸우겠고
  lexicon: debellabunt / amici / inimici
  rationale: debellabunt는 단순한 다툼보다 ‘전쟁을 벌이다, 치다’의 강한 의미가 있어 ‘치다’로 살렸고, ut inimici는 관계의 전도보다 ‘원수들처럼’이라는 비교로 옮겼습니다.
- source_word: expauescet terra cum his qui inhabitant eam
  english_pob_choice: the earth will be terrified along with those who dwell in it
  chosen_korean: 땅은 그 안에 거하는 자들과 함께 두려워할 것이며
  alternatives_korean:
  - 땅은 그 안에 거하는 자들과 함께 떨 것이며
  - 땅은 그 거민들과 함께 두려워할 것이며
  lexicon: expauescet / cum / inhabitant
  rationale: cum은 동반·연관의 뜻이므로 POB의 수정본처럼 ‘함께’로 살렸고, expauescet는 ‘두려워하다’보다 자연스러운 서술형으로 ‘두려워할 것이다’를 택했습니다.
- source_word: uenae fontium
  english_pob_choice: the channels of the springs
  chosen_korean: 샘들의 물줄기
  alternatives_korean:
  - 샘들의 수로
  - 샘의 물줄기
  lexicon: uenae / fontium
  rationale: uenae는 ‘혈관’이 아니라 여기서는 샘에서 흘러나오는 ‘물줄기, 수로’의 구체적 흐름을 가리키므로, 한국어로는 가장 자연스러운 ‘물줄기’로 옮겼습니다.
theological_decisions:
- issue: 우주적 재난 묘사의 인칭과 상호관계
  chosen_reading: ‘땅은 그 안에 거하는 자들과 함께 두려워할 것이며’로, 지구와 거주민이 같은 두려움에 연루된다는 관계를 그대로 드러냈습니다.
  alternative_readings:
  - ‘땅은 거민들로 인해 두려워할 것이며’처럼 원인 중심으로 읽는 방식
  - ‘땅이 거민들과 더불어 두려워할 것이다’로 더 매끄럽게 순화하는 방식
  rationale: 라틴어 cum는 원인보다 동반성을 더 강하게 지시하므로, 본문이 말하는 공동의 공포를 약화하지 않도록 직역적 요소를 유지했습니다.
  doctrine_reference: source-syntax preservation
