reference: 2 Esdras 6:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ea. Et dedisti Behemoth unam partem quae siccata est tertio
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/051.yaml
  text: And you gave Behemoth one part, which was dried up on the third day, to dwell in it, where there are a thousand mountains;
translation:
  language: ko
  text: 그리고 당신은 베헤못에게 한 몫을 주셨는데, 그것은 셋째 날에 말라 버렸으며, 거기에는 천 개의 산이 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 장소를 설명하는 ubi를 사용하며, 영어 POB도 이를 'where there are...'로 옮깁니다.
    reason: source_note
lexical_decisions:
- source_word: dedisti
  english_pob_choice: you gave
  chosen_korean: 당신은 … 주셨는데
  alternatives_korean:
  - 주셨습니다
  - 주셨는데요
  lexicon: 다투다/주다
  rationale: 직접적인 2인칭 과거 행위를 살리되, 서술 흐름에 맞게 연결형 '-셨는데'를 사용해 뒤 문장으로 자연스럽게 이어지게 했습니다.
- source_word: Behemoth
  english_pob_choice: Behemoth
  chosen_korean: 베헤못
  alternatives_korean:
  - 베헤모스
  - 비히모스
  lexicon: 고유명사
  rationale: 라틴어 본문의 고유명사를 음역하여 보존했고, 성서적 통용형인 '베헤못'을 택했습니다.
- source_word: quae siccata est tertio
  english_pob_choice: which was dried up on the third day
  chosen_korean: 셋째 날에 말라 버렸으며
  alternatives_korean:
  - 셋째 날에 말랐으며
  - 셋째 날에 말라졌으며
  lexicon: siccata est / tertio
  rationale: 라틴어 수동 완료의 상태 결과를 한국어의 완료·상태 변화 표현인 '말라 버리다'로 옮겨, 단순한 건조가 아니라 말라서 없어지게 된 느낌을 살렸습니다.
- source_word: unam partem … ut habitet in ea
  english_pob_choice: one part, ... to dwell in it
  chosen_korean: 한 몫을 주셨는데
  alternatives_korean:
  - 한 부분을 주셨는데
  - 한 몫을 주시어
  lexicon: partem / habitet
  rationale: '''partem''은 분할된 ''부분''보다 실제 배분된 몫의 뉘앙스가 있어 ''몫''으로 옮겼고, ''거주하다''보다 자연스러운 목적 의미를 살려 전체 문장 안에서 수용했습니다.'
- source_word: ubi sunt mille montes
  english_pob_choice: where there are a thousand mountains
  chosen_korean: 거기에는 천 개의 산이 있습니다
  alternatives_korean:
  - 그곳에는 천 개의 산이 있습니다
  - 거기에는 천 산이 있습니다
  lexicon: ubi sunt mille montes
  rationale: 장소를 나타내는 'ubi'를 '거기에는'으로 풀어, 수사적 과장을 그대로 유지한 채 명료한 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 베헤못의 위치/거주 묘사
  chosen_reading: 베헤못이 거주할 몫과 그 안의 '천 개의 산'을 문자적 공간 묘사로 유지했습니다.
  alternative_readings:
  - 상징적으로 완화하여 표현
  - 설명적으로 해석을 덧붙임
  rationale: 본문이 제공하는 이미지를 해설로 바꾸지 않고, 라틴어의 공간적·시적 진술을 그대로 드러내는 것이 원문의 힘을 보존합니다.
  doctrine_reference: 문학적·종말론적 상상력 보존 원칙
- issue: 문장 연결의 주어-목적 구조
  chosen_reading: '''주셨는데''로 연결해 베헤못에게 주어진 몫과 그 목적을 한 문장 안에서 유지했습니다.'
  alternative_readings:
  - 독립절로 분리
  - 명시적 목적절로 재구성
  rationale: 라틴어의 간결한 결합 구조를 과도하게 분해하지 않고, 한국어 문장 흐름 속에서 원문의 관계를 보존했습니다.
  doctrine_reference: 원문 구조 보존 원칙
