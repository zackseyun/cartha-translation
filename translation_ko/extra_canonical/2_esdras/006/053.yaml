  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: deuorationem quibus uis et quando uis. Sexto autem die imperasti terrae ut crearet coram te iumenta et bestias et reptilia
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/053.yaml
  text: And on the sixth day you commanded the earth to create before you livestock and beasts and creeping things;
translation:
  language: ko
  text: 그리고 여섯째 날에는 주께서 땅에게 명령하셔서, 주 앞에 가축과 짐승과 기는 것들을 지어내게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: imperasti terrae ut crearet
  english_pob_choice: you commanded the earth to create
  chosen_korean: 땅에게 명령하셔서 … 지어내게 하셨습니다
  alternatives_korean:
  - 땅에 명령하셔서 … 만들게 하셨습니다
  - 땅이 … 만들도록 명령하셨습니다
  lexicon: impero + terra
  rationale: 라틴어는 창조 행위를 직접적으로 ‘땅에게’ 명령하는 표현으로 말하므로, 한국어도 주어-목적어 구조를 유지해 창조의 매개를 살렸습니다.
- source_word: iumenta
  english_pob_choice: livestock
  chosen_korean: 가축
  alternatives_korean:
  - 가축류
  - 집짐승
  lexicon: iumentum
  rationale: POB의 ‘livestock’은 이 문맥에서 가축 일반을 가리키며, 한국어에서는 가장 자연스럽고 포괄적인 ‘가축’이 적절합니다.
- source_word: bestias
  english_pob_choice: beasts
  chosen_korean: 짐승
  alternatives_korean:
  - 들짐승
  - 야수
  lexicon: bestia
  rationale: ‘beasts’는 가축과 구별되는 동물 일반/들짐승을 가리키므로, 문맥상 중립적이고 넓은 ‘짐승’을 택했습니다.
- source_word: reptilia
  english_pob_choice: creeping things
  chosen_korean: 기는 것들
  alternatives_korean:
  - 기어다니는 것들
  - 땅을 기는 것들
  lexicon: reptile
  rationale: 라틴어의 넓은 분류어를 그대로 살려, 특정 생물군으로 좁히지 않는 ‘기는 것들’로 옮겼습니다.
theological_decisions:
- issue: Creation agency expressed through the earth
  chosen_reading: 하나님께서 땅을 창조의 매개로 사용하여, 땅이 생물을 ‘지어내게’ 하셨다는 표현을 유지했습니다.
  alternative_readings:
  - 하나님께서 단순히 동물들을 만드셨습니다
  - 땅이 스스로 생물을 낳았습니다
  rationale: 본문은 창조의 주권이 하나님께 있으면서도 ‘땅’이 명령받는 매개 역할을 강조하므로, 이를 약화시키지 않기 위해 직역성을 유지했습니다.
  doctrine_reference: 창조론 / 창조의 매개적 서술
