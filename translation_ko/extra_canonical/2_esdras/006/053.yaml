  source_fidelity: 라틴어의 시간 표지(Sexto autem die), 명령의 수여자와 대상(imperasti terrae), 창조 행위(ut crearet), 그리고 세 동물 범주(iumenta, bestias, reptilia)를 모두 충실히 반영합니다. ‘주 앞에’는 coram te의 직역적 관계를 보존하며, 땅이 명령받아 창조 행위의 매개로 서는 문장 구조도 유지합니다.
  naturalness: ‘그리고 여섯째 날에는 주께서 땅에게 명령하셔서 … 지어내게 하셨습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 경전 번역에 알맞은 격식이 있습니다. ‘기는 것들’도 원문의 넓은 분류를 부당하게 특정하지 않습니다.
  terminology: ‘가축’은 iumenta, ‘짐승’은 bestias, ‘기는 것들’은 reptilia에 각각 적절합니다. 하나님을 가리키는 ‘주’ 및 높임 표현도 일관되고 적절합니다.
