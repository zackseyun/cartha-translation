source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: colligerentur innumerabiles militiae angelorum, Et antequam extollerentur altitudines aerum, et antequam nominarentur mensurae firmamentorum, et antequam aestimaretur scabellum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/004.yaml
  text: and before the heights of the air were lifted up[a], and before the measures of the firmaments were named, and before the footstool was measured,
  footnotes:
  - marker: a
    text: Or 'was weighed'.
    reason: previous_rendering
translation:
  language: ko
  text: 셀 수 없는 천사들의 군대가 모이기 전, 공중의 높이가 들어올려지기 전, 하늘들의 척도들이 이름 붙여지기 전, 그리고 발판이 측량되기 전이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 aestimaretur는 직역하면 ‘가늠되다/평가되다’의 뜻 범위가 있으나, 본문 흐름에서는 ‘측량되다’가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: colligerentur innumerabiles militiae angelorum
  english_pob_choice: and before ...
  chosen_korean: 셀 수 없는 천사들의 군대가 모이기 전
  alternatives_korean:
  - 천사들의 셀 수 없는 군대가 모이기 전
  - 무수한 천사 군단이 모이기 전
  lexicon: militiae / angelorum
  rationale: 라틴어 군사적 표현을 살리되, 한국어에서는 자연스럽게 ‘천사들의 군대’로 옮겨 장엄함을 유지했습니다.
- source_word: altitudines aerum
  english_pob_choice: the heights of the air
  chosen_korean: 공중의 높이
  alternatives_korean:
  - 공기의 높은 곳
  - 하늘의 높이
  lexicon: altitudines / aerum
  rationale: aerum을 문자적으로 ‘공기’로도 옮길 수 있지만, 본문 맥락상 ‘공중’이 더 자연스럽고 원문의 공간적 높이를 유지합니다.
- source_word: firmamentorum
  english_pob_choice: firmaments
  chosen_korean: 하늘들의 척도
  alternatives_korean:
  - 궁창들의 척도
  - 창공들의 척도
  lexicon: firmamentorum
  rationale: 영어 POB가 ‘measures of the firmaments’로 옮긴 점을 따라, 우주 질서의 ‘척도/분량’이라는 감각을 살렸습니다.
- source_word: aestimaretur scabellum
  english_pob_choice: the footstool was measured
  chosen_korean: 발판이 측량되기 전
  alternatives_korean:
  - 발판이 헤아려지기 전
  - 발판이 계산되기 전
  lexicon: aestimaretur / scabellum
  rationale: aestimaretur는 ‘재다/측량하다/가늠하다’의 범위를 가지므로, 영어 수정 취지에 맞춰 ‘측량되다’로 번역했습니다.
theological_decisions:
- issue: 우주 질서의 선재성 표현
  chosen_reading: 천사들의 군대, 공중의 높이, 하늘들의 척도, 발판의 측량을 모두 창조 질서가 정해지기 이전의 경계로 제시했습니다.
  alternative_readings:
  - 단순한 시간 순서 표시로만 읽기
  - 우주론적 상징으로만 축소하기
  rationale: 본문은 단순한 과거 서술이 아니라, 모든 우주적 규모와 질서가 아직 정해지지 않았던 선재의 상태를 강조합니다.
  doctrine_reference: 창조 질서와 하나님의 주권
