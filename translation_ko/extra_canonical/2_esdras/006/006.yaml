id: 2ES.6.6
reference: 2 Esdras 6:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'consignarentur qui fidem thesaurizauerunt: Tunc cogitaui et facta sunt haec per me et non per alium, ut et finis per me et non per alium. Et respondi et dixi : quae erit separatio tem-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/006.yaml
  text: Then I considered, and these things were made through me and not through another, so also the end will be through me and not through another.”
translation:
  language: ko
  text: 그러고는 제가 생각하니, 이 일들은 저를 통해 이루어졌고 다른 이를 통해서가 아니며, 끝도 저를 통해서가 아니라면 없을 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Tunc cogitaui
  english_pob_choice: Then I considered
  chosen_korean: 그러고는 제가 생각하니
  alternatives_korean:
  - 그때 내가 생각했더니
  - 그리고는 제가 생각해 보니
  lexicon: cogito
  rationale: 라틴어 cogitaui의 사유 전환을 살리면서, 장중한 예언적 독백 흐름에 맞게 현대 합쇼체로 자연스럽게 옮겼습니다.
- source_word: facta sunt haec per me et non per alium
  english_pob_choice: these things were made through me and not through another
  chosen_korean: 이 일들은 저를 통해 이루어졌고 다른 이를 통해서가 아니며
  alternatives_korean:
  - 이것들은 저를 통해 만들어졌고 다른 이를 통해서가 아니며
  - 이 일들은 저로 말미암아 되었고 다른 이를 통해서가 아닙니다
  lexicon: facere / per me
  rationale: facta sunt를 단순히 ‘만들어졌다’보다 결과의 성립을 드러내는 ‘이루어졌고’로 옮겨, per me의 매개성을 ‘저를 통해’로 보존했습니다.
- source_word: ut et finis per me et non per alium
  english_pob_choice: so also the end will be through me and not through another
  chosen_korean: 끝도 저를 통해서가 아니라면 없을 것입니다
  alternatives_korean:
  - 끝도 저를 통해서가 아니고 다른 이를 통해서도 아닐 것입니다
  - 그러므로 끝도 저를 통해서만 있고 다른 이를 통해서는 아닐 것입니다
  lexicon: finis
  rationale: finis를 문맥상 ‘끝/종말’ 가운데서 한국어 독자가 바로 이해할 수 있는 ‘끝’으로 단순화하되, 반복된 ‘per me et non per alium’의 배타성을 살렸습니다.
theological_decisions:
- issue: 창조와 종말의 배타적 주체성
  chosen_reading: ‘이 일들’과 ‘끝’ 모두가 하나님이 아닌 다른 이를 통하지 않고 ‘저’를 통해 이루어진다고 옮겼습니다.
  alternative_readings:
  - ‘저를 통해’보다 ‘저로 말미암아’로 더 신학적 어감을 살리는 읽기
  - ‘끝’을 ‘종말’로 옮겨 종말론적 강조를 더 분명히 하는 읽기
  rationale: 본문은 사건의 성립과 종말의 도래를 동일한 주체적 원천에 귀속시키며, 이를 과장하지 않고 그대로 드러내는 것이 가장 충실합니다.
  doctrine_reference: 섭리와 종말론
