lexical_decisions:
- source_word: et ostendebitur
  english_pob_choice: will be revealed
  chosen_korean: 드러날 것입니다
  alternatives_korean:
  - 밝혀질 것입니다
  - 나타날 것입니다
  lexicon: ostenditur
  rationale: 수동형 미래 의미를 자연스럽게 살리면서, 숨겨져 있던 것이 밖으로 드러난다는 뉘앙스를 반영했습니다.
- source_word: ueritas
  english_pob_choice: the truth
  chosen_korean: 진리
  alternatives_korean:
  - 진실
  - 참된 것
  lexicon: veritas
  rationale: 추상명사 veritas의 기본값을 따르며, 문맥상 단순한 사실보다 더 넓은 ‘진리’가 적절합니다.
- source_word: quae sine fructu fuit tantis temporibus
  english_pob_choice: which has been fruitless for so long
  chosen_korean: 오랜 세월 동안 열매를 맺지 못한
  alternatives_korean:
  - 오랜 세월 동안 열매 없이 지낸
  - 오랫동안 열매 없는
  lexicon: sine fructu
  rationale: 직역의 ‘열매 없이’보다 한국어에서 자연스럽고 의미가 분명한 ‘열매를 맺지 못한’으로 옮겨, 결과 없는 상태를 살렸습니다.
theological_decisions:
- issue: ‘진리’가 오랫동안 fruitless였다는 표현의 의미
  chosen_reading: 진리가 오랜 기간 사람들 가운데서 결실 없이 억눌려 있었으나 마침내 공개적으로 드러난다는 의미로 옮겼습니다.
  alternative_readings:
  - 진리가 헛되이 존재해 왔다는 뜻으로 읽기
  - 진리 자체의 효용 부재로 읽기
  rationale: 라틴어 구문은 진리의 무효가 아니라, 진리가 오랫동안 결실 없이 가려져 있던 상태를 말하므로, 공개·현시의 강조를 유지하는 편이 본문 의도에 가깝습니다.
  doctrine_reference: 2 Esdras apocalyptic revelation motif
