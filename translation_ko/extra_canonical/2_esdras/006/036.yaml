  text: And it happened on the eighth night that my heart was troubled again within me, and I began to speak before the Most High.
translation:
  language: ko
  text: 그리고 여덟째 밤에 내 마음이 다시 내 안에서 흔들렸고, 나는 지극히 높으신 분 앞에서 말하기 시작했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in octava nocte
  english_pob_choice: on the eighth night
  chosen_korean: 여덟째 밤에
  alternatives_korean:
  - 여덟 번째 밤에
  - 여덟째 날 밤에
  lexicon: 직접 대응
  rationale: 라틴어 nox의 반복적 시간표현을 살리면서, 영어 POB의 단순한 시간표시를 자연스러운 한국어로 옮겼습니다.
- source_word: cor meum iterato turbabatur in me
  english_pob_choice: my heart was troubled again within me
  chosen_korean: 내 마음이 다시 내 안에서 흔들렸고
  alternatives_korean:
  - 내 마음이 다시 내 속에서 괴로워졌고
  - 내 마음이 다시 내 안에서 불안해졌고
  lexicon: 직접 대응
  rationale: turbabatur의 ‘동요/혼란’ 감각을 살리되, 내면적 흔들림을 드러내는 ‘흔들리다’로 옮겼습니다.
- source_word: coram Altissimo
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 지극히 높으신 이 앞에서
  - 가장 높으신 분 앞에서
  lexicon: 호칭 번역
  rationale: Altissimus는 신적 칭호이므로, 직역적인 ‘가장 높으신’보다 한국어 경어 체계에 맞는 ‘지극히 높으신 분’을 택했습니다.
theological_decisions:
- issue: Altissimo의 신적 호칭 처리
  chosen_reading: ‘지극히 높으신 분’은 하나님을 직접 지칭하는 경어적 호칭으로 처리했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘가장 높으신 분’
  rationale: 본문의 coram는 단순한 장소가 아니라 하나님 앞에서의 발화임을 드러내므로, 한국어에서도 경외의 방향을 유지했습니다.
  doctrine_reference: 하나님의 초월성/경외성
