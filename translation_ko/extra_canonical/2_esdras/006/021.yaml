  text: And year-old infants will speak with their voices[a], and pregnant women will give birth to premature infants of three and four months[b], and they will live.
  footnotes:
  - marker: a
    text: The verb rendered 'leap about' comes from a difficult Latin form; the sense is that these prematurely born children nevertheless live and move actively.
    reason: lexical_alternative
    anchor_ref: '6:21'
  - marker: b
    text: Or 'premature children'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 한 살 된 아기들은 자기 목소리로[a] 말할 것이며, 임신한 여인들은 석 달이나 넉 달 된 미숙아들[b]을 낳을 것이며, 그들은 살 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘자기들의 목소리들로’이지만, 한국어에서는 ‘자기 목소리로’가 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘조산아들’.
    reason: previous_rendering
lexical_decisions:
- source_word: anniculi infantes
  english_pob_choice: year-old infants
  chosen_korean: 한 살쯤 된 아기들
  alternatives_korean:
  - 일 년 된 유아들
  - 한 살 난 아기들
  lexicon: anniculus / infans
  rationale: anniculi는 ‘한 살쯤 된’의 시간 감각을, infantes는 ‘아기들’로 살려 자연스럽고도 소스에 가까운 표현으로 옮겼습니다.
- source_word: loquentur vocibus suis
  english_pob_choice: will speak with their voices
  chosen_korean: 자기 목소리로 말할 것이며
  alternatives_korean:
  - 자기들의 목소리로 말할 것이며
  - 자기 음성으로 말할 것이며
  lexicon: loquor / vox
  rationale: vocibus suis의 ‘자기들의 목소리로’라는 직역 가능성을 살리되, 한국어에서는 ‘자기 목소리로’가 가장 자연스럽습니다.
- source_word: praegnantes ... immaturos ... infantes trium et quatuor mensium
  english_pob_choice: pregnant women will give birth to premature infants of three and four months
  chosen_korean: 임신한 여자들은 세 달과 네 달 된 미숙한 아기들을 낳을 것이며
  alternatives_korean:
  - 임신한 여자들은 세 달과 네 달 된 조산한 아기들을 낳을 것이며
  - 임신부들은 세 달과 네 달 된 미숙아들을 낳을 것이며
  lexicon: praegnans / immaturus / infans / mensis
  rationale: immaturos infantes는 ‘미숙한 아기들’로 직역해, 태아/조산아의 상태를 과도하게 정리하지 않고 원문의 충격을 유지했습니다.
- source_word: iuuent
  english_pob_choice: they will live
  chosen_korean: 그들은 살 것입니다
  alternatives_korean:
  - 그들은 살아남을 것입니다
  - 그들은 생존할 것입니다
  lexicon: uiuo
  rationale: iuuent의 핵심은 단순한 생존이 아니라 실제로 ‘살게 됨’이므로, 평이한 미래형으로 옮겼습니다.
theological_decisions:
- issue: 초자연적 역전의 서술을 과장 없이 유지할 것인지
  chosen_reading: 본문의 기묘하고 놀라운 약속을 축소하지 않고 그대로 살렸습니다.
  alternative_readings:
  - 상징적으로 완화해 번역하기
  - 설명적 표현을 덧붙이기
  rationale: 이 절은 종말론적 표징의 역전을 말하는 문맥이므로, 한국어도 원문의 놀라움을 희석하지 않도록 했습니다.
