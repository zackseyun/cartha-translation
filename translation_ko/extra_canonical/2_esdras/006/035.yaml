id: 2ES.6.35
reference: 2 Esdras 6:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post haec, et flevi iterum et similiter ieiunavi septem diebus, ut suppleam tres ebdomadas quae dictae sunt mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/035.yaml
  text: And it happened after this that I wept again, and likewise I fasted seven days, so that I might complete the three weeks that had been spoken to me.
translation:
  language: ko
  text: 그 후에 또 내가 울었고, 그와 같이 칠 일 동안 금식하였으니, 이는 내게 말해진 그 세 주간을 채우려 함이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내게 말해진’이며, 라틴어 dictae sunt mihi를 반영한 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: et factum est post haec
  english_pob_choice: And it happened after this
  chosen_korean: 그 후에
  alternatives_korean:
  - 이 일 후에
  - 그 뒤에
  lexicon: factum est / post haec
  rationale: 서술 전환을 자연스럽게 살리면서도 원문의 사건 진행 표시를 과장하지 않기 위해 간결한 시간 연결어로 옮겼습니다.
- source_word: flevi iterum
  english_pob_choice: I wept again
  chosen_korean: 또 내가 울었고
  alternatives_korean:
  - 내가 다시 울었고
  - 나는 다시 울었습니다
  lexicon: flevi / iterum
  rationale: iterum의 반복성을 ‘또’로 살리고, 1인칭 서술의 흐름을 자연스럽게 유지했습니다.
- source_word: similiter ieiunavi septem diebus
  english_pob_choice: and likewise I fasted seven days
  chosen_korean: 그와 같이 칠 일 동안 금식하였으니
  alternatives_korean:
  - 마찬가지로 칠 일 동안 금식하였고
  - 같은 방식으로 일곱 날 금식하였으니
  lexicon: similiter / ieiunavi septem diebus
  rationale: similiter는 앞선 행동과 대응되는 동일한 태도를 뜻하므로 ‘그와 같이’로 옮겼고, ‘칠 일’은 서술체에 맞게 유지했습니다.
- source_word: dictae sunt mihi
  english_pob_choice: had been spoken to me
  chosen_korean: 내게 말해진
  alternatives_korean:
  - 내게 말씀된
  - 내게 말해졌던
  lexicon: dictae sunt mihi
  rationale: revision pass의 판단을 따라 ‘appointed’가 아니라 ‘spoken’의 의미를 반영했고, 수동 구조를 살려 발화된 내용임을 분명히 했습니다.
theological_decisions:
- issue: three weeks that had been spoken to me
  chosen_reading: ‘내게 말해진 그 세 주간’으로 옮겨, 기간이 단순히 정해진 것이 아니라 말씀으로 주어진 것으로 읽히게 했습니다.
  alternative_readings:
  - ‘내게 정해진 그 세 주간’
  - ‘내게 일러진 그 세 주간’
  rationale: 라틴어 dictae sunt mihi는 ‘지정되다’보다 ‘말해지다’가 직접적이어서, 본문의 수동 발화를 보존하는 쪽이 주어진 계시적 뉘앙스를 더 잘 드러냅니다.
  doctrine_reference: 계시 전달의 수동성 및 발화성 보존
- issue: I fasted seven days
  chosen_reading: ‘칠 일 동안 금식하였으니’로 두어 금식의 실제 행위를 간명하게 서술했습니다.
  alternative_readings:
  - ‘일곱 날 금식하였으니’
  - ‘칠 일을 금식하였으니’
  rationale: 기간 표현은 문자적 대응을 유지하되, 한국어 서술 문맥에서는 자연스러운 목적/결과 연결을 위해 ‘-하였으니’를 사용했습니다.
  doctrine_reference: 서사 문체와 행위 강조
