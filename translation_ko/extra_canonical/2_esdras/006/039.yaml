id: 2ES.6.39
reference: 2 Esdras 6:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erat tunc spiritus volans, et tenebrae circumferebantur et silentium, sonus vocis hominis nondum erat abs te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/039.yaml
  text: And at that time the spirit was moving[a], and darkness and silence were surrounding everything; the sound of a human voice was not yet from you.
  footnotes:
  - marker: a
    text: Or 'was not yet there from you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에 영이 움직이고 있었고, 어둠과 침묵이 모든 것을 둘러싸고 있었습니다. 사람의 목소리 소리는 아직 주님에게서 나오지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘아직 주님에게서 거기에 있지 않았다’.
    reason: alternative_reading
lexical_decisions:
- source_word: spiritus volans
  english_pob_choice: the spirit was moving
  chosen_korean: 영이 움직이고 있었고
  alternatives_korean:
  - 영이 날고 있었고
  - 영이 떠돌고 있었고
  - 영이 운행하고 있었고
  lexicon: spiritus / volans
  rationale: volans를 과도하게 ‘날다’로 고정하지 않고, POB의 ‘moving’을 따라 중립적이며 문맥에 맞는 진행상으로 옮겼습니다. 이 본문은 창조 전 상태 묘사이므로 ‘운행하다’보다 덜 주해적인 ‘움직이고 있었고’가 원문에 더 가깝습니다.
- source_word: tenebrae circumferebantur
  english_pob_choice: darkness ... were surrounding everything
  chosen_korean: 어둠과 침묵이 모든 것을 둘러싸고 있었습니다
  alternatives_korean:
  - 어둠과 침묵이 둘러싸고 있었습니다
  - 어둠과 침묵이 사방에 있었습니다
  - 어둠과 침묵이 감돌고 있었습니다
  lexicon: tenebrae / circumferebantur
  rationale: circumferebantur의 포괄적 둘러쌈을 살려 ‘둘러싸고 있었습니다’로 옮겼고, omnis의 의미를 자연스럽게 풀어 ‘모든 것을’로 반영했습니다.
- source_word: silentium
  english_pob_choice: silence
  chosen_korean: 침묵
  alternatives_korean:
  - 고요
  - 정적
  - 잠잠함
  lexicon: silentium
  rationale: 단순한 소리 없음보다 존재론적 정적의 느낌을 살리기 위해 ‘침묵’을 선택했습니다.
- source_word: sonus vocis hominis nondum erat abs te
  english_pob_choice: the sound of a human voice was not yet from you
  chosen_korean: 사람의 목소리 소리는 아직 주님에게서 나오지 않았습니다
  alternatives_korean:
  - 사람의 목소리 소리는 아직 주님에게서 비롯되지 않았습니다
  - 사람의 목소리 소리는 아직 주님으로부터 있지 않았습니다
  - 사람의 목소리 소리는 아직 주님에게서 없었습니다
  lexicon: sonus / vox / abs te
  rationale: abs te를 POB의 ‘from you’에 맞춰 존재의 기원·발출을 나타내는 표현으로 옮겼습니다. ‘나오지 않았습니다’는 한국어에서 자연스럽게 기원 부재를 드러냅니다.
theological_decisions:
- issue: 창조 이전 상태의 묘사에서 ‘영’의 성격
  chosen_reading: 문맥상 창조를 앞둔 상태를 묘사하는 일반적 ‘영’으로 두고, 성령으로 단정하지 않았습니다.
  alternative_readings:
  - 성령이 움직이고 있었고
  - 하나님의 영이 움직이고 있었고
  rationale: 라틴어 spiritus만으로는 여기서 삼위일체적 고유명사로 고정할 근거가 충분하지 않으므로, 원문의 열린 표현을 유지했습니다.
  doctrine_reference: 문맥 우선 원칙
- issue: abs te의 방향성
  chosen_reading: ‘주님에게서 나오지 않았습니다’로 옮겨 발출/기원 부재를 드러냈습니다.
  alternative_readings:
  - 주님에게서 아직 있지 않았습니다
  - 주님 곁에 아직 없었습니다
  rationale: 원문은 단순한 위치 부재보다 ‘주님에게서 비롯된 인간 음성이 아직 존재하지 않음’을 말하므로, 기원적 의미를 보존하는 번역이 필요합니다.
  doctrine_reference: 창조론적 서술의 원문 의미 보존
