revisions:
- from: 그때에 영이 움직이고 있었고, 어둠과 침묵이 모든 것을 둘러싸고 있었습니다. 사람의 목소리 소리는 아직 주님에게서 나오지 않았습니다.[a]
  to: 그때 영이 움직이고 있었으며, 어둠과 침묵이 사방에 퍼져 있었습니다. 사람 목소리의 소리는 아직 당신에게서 나오지 않았습니다.[a]
  rationale: 원문에 없는 ‘모든 것’과 ‘주님’이라는 명시적 호칭을 제거하고, circumferebantur의 포괄적·상태적 의미를 ‘사방에 퍼져 있었습니다’로 옮겼습니다. sonus vocis의 중첩은 자연스러운 한국어 구조로 조정했으며, abs te의 다소 난해한 존재/기원 표현은 본문과 각주에 나누어 보존했습니다.
