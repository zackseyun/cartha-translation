  source_fidelity: 라틴어의 사건 도입, 진행 중인 발화(cum loqueretur), 점진적 움직임(paulatim mouebatur), 그리고 끝의 발화 도입(Et dixit ad me:)은 모두 반영되어 있습니다. 다만 원문에는 존칭을 요구하는 표지가 없으므로 대명사 ‘그분’과 높임 동사는 원문의 비표지성을 넘습니다. 또한 대안 번역 각주는 ‘움직이고 있었습니다’에 붙어야 합니다.
  naturalness: ‘내가 서 있던 그 자리’와 ‘점차 움직이고 있었습니다’는 자연스럽고 현대 표준어에 맞습니다. ‘그가 내게 말하고 있을 때’ 및 ‘그가 내게 말했습니다’로 하면 현대 합쇼체 문체를 유지하면서도 불필요한 존칭을 피할 수 있습니다.
  terminology: locus는 ‘자리’, paulatim mouebatur는 중립적으로 ‘점차 움직이고 있었습니다’로 옮긴 것이 적절합니다. 화자의 신원이나 위상은 이 절의 라틴어만으로 표지되지 않으므로 ‘그분/말씀’보다 ‘그/말하다’가 안전합니다.
  issues:
