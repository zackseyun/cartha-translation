translation:
  language: ko
  text: 그리고 그분이 나에게 말씀하고 계실 때, 보라, 내가 서 있던 그 자리가 점차 움직이고 있었습니다. 그리고 그분이 나에게 말씀하셨습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그분이 나에게 말씀하고 계실 때, 보라, 내가 서 있던 그 자리가 점차 흔들리고 있었습니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: cum loqueretur mihi
  english_pob_choice: while he was speaking to me
  chosen_korean: 그분이 나에게 말씀하고 계실 때
  alternatives_korean:
  - 그가 나에게 말하고 있을 때
  - 그분이 나에게 말씀하실 때
  lexicon: loquor
  rationale: 라틴어의 진행 중 상황을 살려 ‘말씀하고 계실 때’로 옮기고, 앞뒤 서술과 맞게 존칭 주어를 사용했습니다.
- source_word: paulatim mouebatur
  english_pob_choice: was gradually moving
  chosen_korean: 점차 움직이고 있었습니다
  alternatives_korean:
  - 서서히 흔들리고 있었습니다
  - 점점 흔들리고 있었습니다
  lexicon: moveo
  rationale: 감각적으로는 ‘흔들리다’도 가능하지만, 이 절의 라틴어는 neutral한 ‘움직이다’가 더 직접적이므로 ‘점차 움직이고 있었습니다’로 번역했습니다.
- source_word: locus super quem stabam super eum
  english_pob_choice: the place on which I was standing
  chosen_korean: 내가 서 있던 그 자리
  alternatives_korean:
  - 내가 서 있던 그 장소
  - 내가 그 위에 서 있던 그 장소
  lexicon: locus
  rationale: 중복된 전치사구의 효과를 한국어에서는 자연스럽게 압축하되, ‘그 자리’로 구체성을 유지했습니다.
theological_decisions:
- issue: verse boundary with final speech introduction
  chosen_reading: 문장 끝의 ‘그리고 그분이 나에게 말씀하셨습니다:’를 본문에 포함했습니다.
  alternative_readings:
  - 다음 절로 넘겨 처리함
  - 이 절에서는 생략함
  rationale: 제공된 라틴어 본문에 분명히 포함된 발화 도입부이므로, 절 구분 관행과 무관하게 이 기록에서는 그대로 반영해야 합니다.
  doctrine_reference: source fidelity / versification integrity
