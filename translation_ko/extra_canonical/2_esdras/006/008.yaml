    reason: previous_rendering
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. 「아브라함에서 아브라함까지 말입니다. 그에게서 야곱과 에서가 태어났기 때문입니다. 야곱의 손이 처음부터 에서의 발꿈치를 붙잡고 있었기 때문입니다. 에서는 이 세대의 끝이며, 시작입니다」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 전승의 ‘From Abraham to Abraham’는 난해합니다. 이어지는 야곱/에서 설명은 이 난점을 제거하기보다 해석한 것으로 보입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘아브라함에서 아브라함까지’.
    reason: previous_rendering
lexical_decisions:
- source_word: ab Abraham usque ad Abraham
  english_pob_choice: From Abraham to Abraham
  chosen_korean: 아브라함에서 아브라함까지
  alternatives_korean:
  - 아브라함에서 이삭까지
  - 아브라함에서 아브라함에 이르기까지
  lexicon: source_note
  rationale: 현전 라틴 본문은 반복된 Abraham을 보이므로, 본문 표면형을 살려 옮기되 각주로 난해성을 표시하는 편이 원문 추적에 충실합니다.
- source_word: quoniam ab eo natus est Iacob et Esau
  english_pob_choice: because from him Jacob and Esau were born
  chosen_korean: 그에게서 야곱과 에서가 태어났기 때문입니다
  alternatives_korean:
  - 그에게서 야곱과 에서가 났기 때문입니다
  - 그에게서 야곱과 에서가 출생했기 때문입니다
  lexicon: source_note
  rationale: 라틴어 natus est의 자연스러운 현대 한국어 대응으로 ‘태어났습니다’를 택해, 혈통 설명의 단순한 서술을 유지했습니다.
- source_word: manus enim Iacob tenebat ... calcaneum Esau
  english_pob_choice: for Jacob’s hand held Esau’s heel from the beginning
  chosen_korean: 야곱의 손이 처음부터 에서의 발꿈치를 붙잡고 있었기 때문입니다
  alternatives_korean:
  - 야곱의 손이 처음부터 에서의 발꿈치를 잡고 있었기 때문입니다
  - 야곱의 손이 처음부터 에서의 발꿈치를 붙들고 있었기 때문입니다
  lexicon: source_note
  rationale: tenebat는 단순 접촉보다 ‘붙잡고 있었다’가 힘을 더 잘 드러내므로, 발꿈치 모티프의 지속성을 살렸습니다.
- source_word: Finis enim huius saeculi Esau, et principium
  english_pob_choice: For Esau is the end of this age, and the beginning
  chosen_korean: 에서는 이 세대의 끝이며, 시작입니다
  alternatives_korean:
  - 에서는 이 시대의 끝이며, 시작입니다
  - 에서는 이 세대의 종말이며, 시작입니다
  lexicon: source_note
  rationale: saeculum은 문맥상 종말론적 ‘세대/시대’를 가리키며, POB의 ‘this age’를 따라 ‘이 세대’로 옮겼고, 파편적 결말을 그대로 보존했습니다.
theological_decisions:
- issue: 라틴 본문의 ‘ab Abraham usque ad Abraham’ 난해 구절 처리
  chosen_reading: 본문 표면형을 유지하고, 영어 POB 각주처럼 난해성을 드러내는 방향으로 번역했습니다.
  alternative_readings:
  - 문맥 및 딸언어 전승을 따라 ‘아브라함에서 이삭까지’로 교정
  - 의미를 풀어 ‘아브라함의 계보를 따라’로 의역
  rationale: 제공된 최종 라틴 본문과 영어 POB의 주석 전통을 우선해, 본문을 평준화하지 않고 독자가 난점을 인지하도록 남겨 두었습니다.
  doctrine_reference: textual criticism / source transparency
- issue: 문장 끝의 파편 ‘et principium’ 보존
  chosen_reading: ‘그리고 시작입니다’로 파편적 상태를 유지했습니다.
  alternative_readings:
  - 문맥을 보충해 완결된 문장으로 재구성
  - 번역에서 삭제
  rationale: 제공된 소스가 절단된 상태이므로, 결락을 메우지 않고 남겨 두는 것이 문헌학적으로 더 정직합니다.
  doctrine_reference: source transparency
