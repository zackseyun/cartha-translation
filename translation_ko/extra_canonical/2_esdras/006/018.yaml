- from: 그리고 그분이 말씀하셨습니다. 「보십시오, 날들이 오고 있습니다. 내가 땅에 사는 자들을 찾아가려고 가까이 다가가기 시작할 때가 올 것입니다…」[a]
  to: 그리고 그가 말씀하셨습니다. 「보십시오, 날들이 오고 있습니다. 내가 땅에 사는 이들을 찾아가기 위해 가까이 다가가기 시작할 때가 되면 …」
  rationale: 접근(가까이 다가가기)과 방문 목적(찾아가기)을 모두 보존하되, 중복된 미래 표현과 본문에 명시되지 않은 심판 해석을 제거했습니다. 말줄임표는 제공된 원문의 미완결 구절을 반영합니다.
