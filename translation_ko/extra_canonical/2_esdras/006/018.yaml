  text: And it said, “Behold, days are coming, and it will be that when I begin to draw near to visit those who dwell on the earth,
translation:
  language: ko
  text: 그리고 그분이 말씀하셨습니다. 「보십시오, 날들이 오고 있습니다. 내가 땅에 사는 자들을 찾아가려고 가까이 다가가기 시작할 때가 올 것입니다…」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘내가 가까이 다가가기 시작할 때’로, 임박한 개입의 시작을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: pinquare incipio
  english_pob_choice: when I begin to draw near
  chosen_korean: 내가 … 가까이 다가가기 시작할 때
  alternatives_korean:
  - 내가 … 가까워지기 시작할 때
  - 내가 … 찾아가려 하기 시작할 때
  lexicon: pinquare / incipio
  rationale: pinquare는 단순한 접근보다 ‘가까이 다가감’을, incipio는 ‘시작하다’를 살려, 심판적 방문의 시작이라는 진행성을 드러냈습니다.
- source_word: uisitem
  english_pob_choice: visit
  chosen_korean: 찾아가려고
  alternatives_korean:
  - 방문하려고
  - 찾아보려고
  lexicon: visito
  rationale: visito는 정중한 방문보다도 사람들을 대상으로 한 ‘찾아가다/찾아보다’의 능동적 개입을 뜻하므로, 문맥상 임박한 심판적 방문을 드러내는 표현을 택했습니다.
- source_word: habitantes in terra
  english_pob_choice: those who dwell on the earth
  chosen_korean: 땅에 사는 자들
  alternatives_korean:
  - 땅에 거하는 사람들
  - 땅의 거주자들
  lexicon: habito + terra
  rationale: 단순 거주보다 지상에 머무는 인류 전체를 가리키는 종말론적 표현이므로, 한국어에서 간결하고 경고의 뉘앙스가 살아 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 다가오심이 ‘방문’으로 표현되는 의미
  chosen_reading: 임박한 심판과 개입을 예고하는 방문으로 읽었습니다.
  alternative_readings:
  - 일반적인 돌봄의 방문
  - 중립적인 방문 예고
  rationale: 문맥상 ‘땅에 사는 자들’에 대한 하나님의 개입은 단순 방문이 아니라 종말론적 심판을 예고하는 말이므로, 이를 흐리지 않도록 했습니다.
  doctrine_reference: 종말론적 심판과 하나님의 역사 개입
