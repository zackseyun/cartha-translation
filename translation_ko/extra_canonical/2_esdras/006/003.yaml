  source_fidelity: 라틴어의 절 연결(Et antequam … et antequam … et antequam), decores flores(‘아름다운 꽃들’), uiderentur(‘보이기’), motus uirtutes(‘움직임의 능력들’), confirmarentur(‘확립되기’)를 충실히 반영했습니다. 본문이 다음 구절로 이어지도록 미완성으로 끝나는 점도 보존했습니다.
  naturalness: ‘움직임의 능력들’은 현대 한국어에서 다소 낯선 결합이지만, 원문의 추상적이고 우주론적인 표현 및 영어 감사본의 비해석적 선택을 보존하는 데 적절합니다. 절 단편이라는 형식상 종결 어미를 덧붙이지 않은 것도 타당합니다.
  terminology: ‘아름다운 꽃들’과 ‘능력들’은 각각 decores flores와 uirtutes의 복수 및 의미 범위를 무리 없이 전달합니다. motus를 지진으로 특정하지 않고 ‘움직임’으로 유지하여 논쟁적 또는 해석적인 한정도 피했습니다.
