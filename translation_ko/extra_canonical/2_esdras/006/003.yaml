  text: 아름다운 꽃들이 보이기 전, 그리고 움직임의 능력들이 확립되기 전, 그리고
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: decores flores
  english_pob_choice: beautiful flowers
  chosen_korean: 아름다운 꽃들
  alternatives_korean:
  - 아름다운 꽃
  - 아리따운 꽃들
  - 아름답게 피는 꽃들
  lexicon: decores = 아름다운; flores = 꽃들
  rationale: 형용사 decores를 자연스러운 현대 한국어의 '아름다운'으로 옮기고, 복수형 flores는 문맥상 집합적 복수로 '꽃들'로 처리했습니다.
- source_word: motus uirtutes
  english_pob_choice: powers of the movements
  chosen_korean: 움직임의 능력들
  alternatives_korean:
  - 움직임의 힘들
  - 움직임의 권능들
  - 움직임의 능력
  lexicon: motus = 움직임; uirtutes = 능력들/힘들
  rationale: 영어 POB의 최신 처리인 'movements'를 따라 라틴어 motus를 추상화하지 않고 '움직임'으로 직역했고, uirtutes는 복수의 힘/능력을 반영해 '능력들'로 옮겼습니다.
theological_decisions:
- issue: 문장이 의도적으로 미완성으로 끝나는 구조
  chosen_reading: 마지막 '그리고'를 그대로 유지해 원문 단락이 이어지도록 했습니다.
  alternative_readings:
  - 끝을 문장부호로 매끈하게 마무리함
  - 이전 절과 결합해 완결된 한국어 문장으로 재구성함
  rationale: 라틴어 원문과 영어 POB 모두 이 절의 끝을 열어 둔 채 다음 내용으로 이어지는 구조이므로, 한국어도 그 긴장과 개방성을 보존했습니다.
  doctrine_reference: 문학적-본문비평적 형식 보존
