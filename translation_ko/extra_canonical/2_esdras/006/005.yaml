  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Sion, Et antequam inuestigarentur praesentes anni, et antequam abalienarentur eorum qui nunc peccant adinuentiones, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/005.yaml
  text: and before the present years were searched out[a], and before the devices of those who now sin were estranged, and before those who have stored up faith were sealed—
  footnotes:
  - marker: a
    text: Or 'and those who have stored up faith were sealed—'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 시대가 탐구되기 전에, 지금 죄를 짓는 자들의 꾀가 소외되기 전에, 믿음을 쌓아 둔 이들이 인침을 받기 전에—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: antequam inuestigarentur praesentes anni
  english_pob_choice: before the present years were searched out
  chosen_korean: 현재의 세월들이 조사되기 전에
  alternatives_korean:
  - 현재의 세월들이 탐구되기 전에
  - 지금의 세월들이 찾아내어지기 전에
  lexicon: antequam; investigare; anni
  rationale: '`antequam`의 반복 구조를 살려 ‘-기 전에’로 옮기고, `investigarentur`는 ‘조사되다’로 처리해 시간의 계시적·심문적 뉘앙스를 유지했습니다.'
- source_word: abalienarentur eorum qui nunc peccant adinuentiones
  english_pob_choice: the devices of those who now sin were estranged
  chosen_korean: 지금 죄를 짓는 자들의 계획들이 멀어지기 전에
  alternatives_korean:
  - 지금 죄를 짓는 자들의 꾀가 끊어지기 전에
  - 지금 죄를 짓는 자들의 발명들이 소외되기 전에
  lexicon: abalienarentur; adinuentiones; qui nunc peccant
  rationale: '`adinuentiones`를 단순한 ‘발명’보다 문맥상 ‘계획들/궁리들’로 풀었고, `abalienarentur`는 관계가 멀어지는 뜻을 살려 ‘멀어지다’로 옮겼습니다.'
- source_word: consignarentur
  english_pob_choice: those who have stored up faith were sealed
  chosen_korean: 믿음을 쌓아 둔 자들이 인봉되기 전에
  alternatives_korean:
  - 믿음을 간직한 자들이 봉인되기 전에
  - 믿음을 저장한 자들이 인치기 전에
  lexicon: consignarentur; fidem
  rationale: '`consignarentur`는 법적·종말론적 표지를 주는 ‘인봉되다’가 가장 직접적이며, `fidem`은 POB의 기본 의미인 ‘믿음’을 유지했습니다.'
theological_decisions:
- issue: 반복되는 antequam 구조의 시간적 종속성
  chosen_reading: 마지막 절도 독립 진술이 아니라 앞선 절들과 같은 ‘-기 전에’ 구조로 처리했습니다.
  alternative_readings:
  - 마지막 절을 ‘그리고 믿음을 쌓아 둔 자들이 인봉되었다’로 독립 번역
  rationale: 라틴어 `consignarentur`가 `antequam` 아래에 놓인 종속형이므로, 반복된 ‘전에’를 유지해야 창조 이전의 선행성을 보존할 수 있습니다.
  doctrine_reference: 창조 이전의 예정/인침 주제
