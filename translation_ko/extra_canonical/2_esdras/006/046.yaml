reference: 2 Esdras 6:46
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et imperasti eis, ut deservirent futuro plasmato homini.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/046.yaml
  text: and you commanded them to serve the man who was to be formed.
translation:
  language: ko
  text: 그리고 당신은 그들에게 명령하셔서, 앞으로 빚어질 사람을 섬기게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et imperasti eis
  english_pob_choice: and you commanded them
  chosen_korean: 그리고 당신은 그들에게 명령하셔서
  alternatives_korean:
  - 그리고 당신은 그들에게 명령하셨습니다
  - 그리고 당신은 그들에게 지시하셔서
  lexicon: impero → 명령하다
  rationale: 라틴어 imperasti는 단순한 권고가 아니라 권위를 가진 명령을 뜻하므로, POB의 ‘commanded’를 따라 ‘명령하셔서’로 옮겨 행위의 목적 연결을 살렸습니다.
- source_word: ut deservirent
  english_pob_choice: to serve
  chosen_korean: 섬기게 하셨습니다
  alternatives_korean:
  - 섬기도록 하셨습니다
  - 봉사하게 하셨습니다
  lexicon: deservio → 섬기다
  rationale: deservirent는 ‘섬기다/복무하다’의 목적 용법이므로, 한국어에서도 예배적·복무적 뉘앙스를 유지하는 ‘섬기게 하셨습니다’가 가장 직접적입니다.
- source_word: futuro plasmato homini
  english_pob_choice: the man who was to be formed
  chosen_korean: 앞으로 빚어질 사람
  alternatives_korean:
  - 장차 지어질 사람
  - 앞으로 형성될 사람
  lexicon: plasma / formo → 빚다, 형성하다
  rationale: futuro는 ‘장차/앞으로’를, plasmato는 단순 존재가 아니라 빚어지는 조형 과정을 가리키므로 ‘앞으로 빚어질 사람’이 원문의 생성적 이미지를 가장 잘 드러냅니다.
theological_decisions:
- issue: ‘man’의 범위와 인류 대표성
  chosen_reading: 단수 ‘사람’으로 옮겨, 특정 개인이 아니라 ‘빚어질 인류/아담적 인간’을 가리키는 표현을 열어 두었습니다.
  alternative_readings:
  - ‘사람’을 특정 남성 개인으로 읽는 번역
  - ‘인간’으로 추상화하는 번역
  rationale: 라틴어 homini는 여기서 일반적 인간을 가리키는 방향으로 읽히며, POB의 영어도 ‘the man’으로 유지해 대표적·원형적 인간을 암시합니다. 한국어 ‘사람’은 그 열린 범위를 보존합니다.
  doctrine_reference: 창조와 인간 대표성
