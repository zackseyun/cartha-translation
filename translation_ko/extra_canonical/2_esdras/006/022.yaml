  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sciritabuntur, Et subito apparebunt seminata loca non seminata, et plena prumptuaria subito inuenientur uacua, Et tuba canet cum sono, quam cum omnes audierint subito expauescent.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/022.yaml
  text: And suddenly places sown will appear unsown, and full storehouses will suddenly be found empty, and the trumpet will sound, which when all hear, they will suddenly be terrified.
translation:
  language: ko
  text: 그리고 갑자기 뿌린 곳이 뿌리지 않은 곳으로 드러나고, 가득 찬 곳간들이 갑자기 텅 빈 것으로 발견되며, 나팔이 울릴 것입니다. 그 소리를 모든 사람이 듣게 되면, 그들은 갑자기 두려워할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et subito
  english_pob_choice: And suddenly
  chosen_korean: 그리고 갑자기
  alternatives_korean:
  - 그때 갑자기
  - 문득
  - 순식간에
  lexicon: Latin et subito
  rationale: 장면 전환의 급작스러움을 살리되, 문장 흐름상 한국어 연결도 자연스럽게 유지했습니다.
- source_word: seminata loca non seminata
  english_pob_choice: places sown will appear unsown
  chosen_korean: 뿌린 곳이 뿌리지 않은 곳으로 드러나고
  alternatives_korean:
  - 씨 뿌린 곳이 씨 뿌리지 않은 곳으로 보이고
  - 파종한 곳이 파종하지 않은 곳으로 나타나고
  lexicon: Latin seminata / non seminata
  rationale: 직역하면 다소 어색하지만, 원문의 역설적 대비—이미 뿌린 곳이 뿌리지 않은 것처럼 드러나는 상황—를 보존했습니다.
- source_word: prumptuaria ... vacua
  english_pob_choice: full storehouses will suddenly be found empty
  chosen_korean: 가득 찬 곳간들이 갑자기 텅 빈 것으로 발견되며
  alternatives_korean:
  - 가득한 곳간들이 갑자기 빈 것으로 드러나며
  - 창고들이 가득 차 있다가 갑자기 비어 있는 것으로 발견되며
  lexicon: Latin prumptuaria / vacua
  rationale: prumptuaria는 저장 공간으로서의 곳간·창고를 뜻하므로, 한국어에서는 ‘곳간’으로 옮겨 내용의 이미지와 비어 있음의 충격을 살렸습니다.
- source_word: tuba canet ... expauescent
  english_pob_choice: and the trumpet will sound ... they will suddenly be terrified
  chosen_korean: 나팔이 울릴 것입니다. 그 소리를 모든 사람이 듣게 되면, 그들은 갑자기 두려워할 것입니다.
  alternatives_korean:
  - 나팔이 울릴 것입니다. 그 소리를 들으면 모두가 갑자기 떨 것입니다.
  - 나팔이 울리면, 그것을 들은 모든 사람이 갑자기 두려움에 사로잡힐 것입니다.
  lexicon: Latin tuba canet / audierint / expauescent
  rationale: canet은 ‘울리다’, audierint은 ‘듣다’, expauescent은 ‘깜짝 놀라다/두려워하다’의 뜻을 반영하여, 청각적 충격과 즉각적 공포를 분명히 했습니다.
theological_decisions:
- issue: 묵시적 재난의 연속과 공포의 강조
  chosen_reading: 이 절은 급작스러운 전도와 발견, 그리고 나팔 소리에 대한 집단적 두려움을 연속된 종말론적 징표로 제시합니다.
  alternative_readings:
  - 단순한 자연현상이나 비유적 혼란으로 약화하여 읽기
  - 마지막 나팔의 상징성을 지나치게 구체화하기
  rationale: 원문은 ‘갑자기’와 ‘모든 사람이 듣게 되면’의 반복으로 사건의 불가피성과 공포를 강조하므로, 그 긴장을 약화하지 않도록 유지했습니다.
  doctrine_reference: apocalyptic imagery
