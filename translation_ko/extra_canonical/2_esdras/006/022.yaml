revisions:
- from: 그리고 갑자기 뿌린 곳이 뿌리지 않은 곳으로 드러나고, 가득 찬 곳간들이 갑자기 텅 빈 것으로 발견되며, 나팔이 울릴 것입니다. 그 소리를 모든 사람이 듣게 되면, 그들은 갑자기 두려워할 것입니다.
  to: 그리고 갑자기 씨 뿌린 곳들이 씨 뿌리지 않은 곳으로 나타날 것이며, 가득 찬 곳간들이 갑자기 빈 것으로 드러날 것입니다. 나팔이 울릴 것이며, 나팔 소리를 모두가 들으면 그들은 갑자기 두려움에 사로잡힐 것입니다.
