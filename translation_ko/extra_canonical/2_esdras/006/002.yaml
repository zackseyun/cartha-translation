source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et antequam sonarent voces tonitruum, et antequam splenderent nitores coruscuum, et antequam confirmarentur fundamenta paradisi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/006/002.yaml
  text: and before the voices of the thunders sounded, and before the flashes of the lightnings shone, and before the foundations of paradise were established,
translation:
  language: ko
  text: 그리고 천둥의 음성이 울리기 전, 번개들의 번쩍임이 빛나기 전, 낙원의 기초가 세워지기 전이었습니다.
  philosophy: formal
lexical_decisions:
- source_word: antequam sonarent voces tonitruum
  english_pob_choice: before the voices of the thunders sounded
  chosen_korean: 천둥의 음성이 울리기 전
  alternatives_korean:
  - 천둥의 소리가 나기 전
  - 우렛소리가 울리기 전
  lexicon: tonitruum → 천둥; voces → 음성/소리; sonare → 울리다
  rationale: 복수의 ‘voices’를 살리면서도 한국어로는 자연스럽게 ‘천둥의 음성’으로 옮겨, 소리의 장엄함을 유지했습니다.
- source_word: antequam splenderent nitores coruscuum
  english_pob_choice: before the flashes of the lightnings shone
  chosen_korean: 번개들의 번쩍임이 빛나기 전
  alternatives_korean:
  - 번개들의 섬광이 빛나기 전
  - 번개의 번쩍임이 비치기 전
  lexicon: nitores → 번쩍임/광휘; coruscuum → 번개들
  rationale: nitores의 ‘빛남/번쩍임’을 그대로 살리고, coruscuum을 복수형 ‘번개들’로 반영했습니다.
- source_word: antequam confirmarentur fundamenta paradisi
  english_pob_choice: before the foundations of paradise were established
  chosen_korean: 낙원의 기초가 세워지기 전
  alternatives_korean:
  - 낙원의 기초가 굳게 서기 전
  - 낙원의 터전이 확립되기 전
  lexicon: confirmarentur → 세워지다/확립되다; fundamenta → 기초; paradisus → 낙원
  rationale: revision pass의 ‘were established’를 따라 confirmarentur의 수동·완결 의미를 자연스럽게 ‘세워지다’로 옮겼습니다.
theological_decisions:
- issue: paradisus의 번역
  chosen_reading: 낙원
  alternative_readings:
  - 천국
  - 동산
  rationale: 라틴어 paradisus의 기본 의미를 따라 ‘낙원’으로 두어, 본문이 가리키는 원초적·에덴적 공간감을 보존했습니다.
  doctrine_reference: 창 2:8-10의 동산 전승 및 유대 묵시문학적 낙원 개념
