lexical_decisions:
- source_word: inquirere incipiam
  english_pob_choice: and when I begin to inquire of
  chosen_korean: 조사를 시작할 때
  alternatives_korean:
  - 묻기 시작할 때
  - 캐묻기 시작할 때
  - 따져 묻기 시작할 때
  lexicon: inquirere
  rationale: 라틴어 inquirere는 단순한 ‘묻다’보다 공식적인 조사·추궁의 뉘앙스가 있어, POB의 수정된 ‘inquire of’를 살리면서도 합쇼체에 맞게 ‘조사를 시작할 때’로 옮겼습니다.
- source_word: ab eis qui iniuste nocuerunt
  english_pob_choice: of those who have unjustly harmed others
  chosen_korean: 불의로 인해 불의를 행한 자들에게서
  alternatives_korean:
  - 부당하게 해를 끼친 자들에게서
  - 불의하게 남을 해친 자들에게서
  - 정당하지 않게 해친 자들에게서
  lexicon: ab + nocere
  rationale: iniuste nocuerunt는 ‘부당하게 해를 끼치다/손해를 입히다’의 의미이므로, ‘불의를 행한 자들’로 주체를 드러내고 ‘-에게서’로 조사 대상을 나타냈습니다.
- source_word: iniustitia sua
  english_pob_choice: by their injustice
  chosen_korean: 그들의 불의로 인해
  alternatives_korean:
  - 그들의 불의로
  - 그들의 불의 때문에
  - 그들의 불의로 말미암아
  lexicon: iniustitia
  rationale: 앞의 nocuerunt와 결합된 원인의 표현이어서, 단순 수단보다 원인·근거를 분명히 하는 ‘~로 인해’가 본문 관계를 가장 자연스럽게 드러냅니다.
theological_decisions:
- issue: 본절의 문장이 다음 절로 이어지는 연결 어미로 끝나는지 여부
  chosen_reading: 원문이 et로 끝나므로, 다음 절로 이어지는 미완결 구조를 그대로 보존했습니다.
  alternative_readings:
  - 문장부호를 찍어 완결된 문장처럼 처리하는 읽기
  - 다음 절 내용을 괄호로 보충하는 읽기
  rationale: 제공된 라틴 본문과 POB 개정 이력 모두 본절 끝의 et를 유지하고 있어, 절 경계를 넘는 연결감을 지우지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: source alignment / verse segmentation
