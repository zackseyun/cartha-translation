    rationale: ‘불의를 행한 자들’은 ‘부당하게 남을 해친 자들’을 뜻하는 iniuste nocuerunt를 충분히 번역하지 못하며, 피해를 입은 타인이 있다는 의미가 사라집니다.
  - severity: medium
    issue: iniustitia sua의 수식 관계 불명확
    rationale: ‘그들의 불의로 인해 불의를 행한’은 원인의 귀속과 ‘해치다’의 관계를 흐립니다. ‘그들 자신의 불의로 부당하게 남을 해친’으로 원문의 반복적 표현과 소유를 보존하는 편이 낫습니다.
  - severity: low
    issue: ‘조사를 시작하다’의 결합 어색함
    rationale: ‘사람들에게서 조사를 시작하다’보다 ‘사람들에게 묻기 시작하다’가 ab eis inquirere의 직접적이고 자연스러운 한국어 대응입니다.
