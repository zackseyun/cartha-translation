  source_fidelity: 현 초안은 iniuste nocuerunt iniustitia sua의 핵심 동사 nocuerunt(해를 끼쳤다)를 ‘불의를 행한’으로 바꾸어, ‘남을 해치다’라는 의미를 빠뜨립니다. 또한 ‘그들의 불의로 인해’가 수식하는 대상이 불명확합니다. 수정문은 iniuste, nocuerunt, iniustitia sua를 각각 ‘부당하게’, ‘남을 해친’, ‘그들 자신의 불의로’로 반영합니다.
  naturalness: ‘…자들에게서 조사를 시작하다’는 한국어에서 다소 어색합니다. 사람을 대상으로 inquirere ab eis를 옮길 때에는 ‘…자들에게 묻기 시작하다’가 자연스럽고, 미완결 접속사 et는 ‘그리고’로 보존할 수 있습니다.
  terminology: ‘불의’는 iniustitia의 일관된 번역으로 적절합니다. ‘부당하게 남을 해친’은 iniuste nocuerunt를 현대 표준어의 격식 있는 문체로 정확히 전달합니다.
