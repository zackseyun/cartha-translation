  text: '둘째 밤에 내가 꿈을 보았는데, 보라, 독수리 하나가 바다에서 올라오고 있었으며, 그것에게는 깃털 달린 날개 열두 개와 머리 셋이 있었습니다.


    내가 보니, 그것이 온 땅 위로 날개를 펼쳤고, 하늘의 모든 바람이 그것을 향해 불어왔으며, 구름들이 그것을 둘러 모이고 있었습니다.


    내가 보니, 그것의 깃털들로부터 반대편 날개들이 돋아났고, 그것들은 작은 깃날개들, 작고 여린 것들이 되었습니다.


    그런데 그것의 머리들은 쉬고 있었고, 가운데 머리는 다른 머리들보다 더 컸지만, 그것도 그들과 함께 쉬고 있었습니다.


    내가 보니, 독수리가 그것의 날개들을 타고 날아 올라 땅과 그 안에 거주하는 자들을 다스리려 했습니다.


    내가 보니, 하늘 아래 있는 모든 것이 그것에게 복종했고, 땅 위의 어떤 피조물도, 단 하나도 그것을 거스르지 못했습니다.


    내가 보니, 독수리가 그것의 발톱 위에 일어서서 그것의 날개들에게 소리를 보내며 말했습니다.


    “너희는 모두 한꺼번에 깨어 있지 말고, 각자 자기 자리에서 잠들어 있다가 차례로 깨어 있으라.


    하지만 머리들은 마지막을 위해 남겨 두어라.”


    내가 보니, 그 소리는 머리들에서 나온 것이 아니라 몸의 한가운데서 나왔습니다.


    나는 그 반대편 날개들을 세어 보았더니, 보라, 그것들은 여덟 개였습니다.


    내가 보니, 오른쪽에서 한 날개가 일어나 온 땅을 다스렸습니다.


    그것이 다스릴 때 끝이 이르렀고, 그것은 사라져서 그 자리가 보이지 않게 되었습니다. 그러자 다음 것이 일어나 다스렸고, 그것은 오랜 동안 권세를 가졌습니다.


    그것은 오랜 동안 권세를 가졌습니다. 그것이 다스릴 때,


    그 끝이 오고 있었으며, 이전 것처럼 사라질 것이었습니다. 그리고 보라, 소리가 그것에게 보내져 말했습니다.


    “오랫동안 땅을 붙들어 온 너는 들으라.


    네가 사라지기 시작하기 전에 내가 이것을 너에게 알린다. 너 이후에는 아무도 네가 붙든 기간을 차지하지 못할 것이며, 그 절반도 차지하지 못할 것이다.”


    그때 셋째가 일어나 이전 것들처럼 통치했고, 그것도 사라졌습니다.


    이렇게 하여 날개들 모두가 하나씩 차례로 권세를 잡았다가, 다시는 보이지 않게 되었습니다.


    내가 보니, 적절한 때에 뒤따르는 날개들이 오른쪽에서 일어나 권세를 잡으려 했습니다. 그들 가운데는 실제로 그것을 잡는 자들도 있었지만,


    곧바로 사라졌습니다. 또 그들 가운데 몇몇은 일어났지만,


    권세를 잡지 못했습니다. 그 뒤에 내가 보니,


    열두 날개와 두 작은 깃날개는 더 이상 보이지 않았습니다. 그리고 독수리의 몸에는 쉬고 있는 세 머리와 여섯 작은 깃날개만 남아 있었습니다.


    내가 보니, 여섯 작은 깃날개 가운데 둘이 떨어져 나와, 오른쪽에 있는 머리 아래에 머물렀고, 나머지 넷은 제자리에 남아 있었습니다.


    내가 보니, 이 아래 날개들은 올라가 권세를 잡으려 계획하고 있었습니다.


    내가 보니, 하나가 일어났지만 곧바로 사라졌고, 그다음 둘째가 일어났는데, 그것은 이전 것보다 더 빨리 사라졌습니다.


    내가 보니, 남아 있던 둘은 서로 의논하여 역시 다스리려 했습니다.


    그들이 그렇게 의논하는 동안, 보라, 쉬고 있던 머리들 가운데 하나가 깨어났는데, 그것은 가운데 머리였으며 다른 두 머리보다 더 컸기 때문입니다.


    나는 그것이 두 머리를 자기에게 끌어모으는 것을 보았습니다.


    그리고 보라, 그 머리는 자기와 함께 있던 자들과 함께 방향을 돌렸고,


    다스리려 하던 그 두 아래 날개를 삼켜 버렸습니다.


    그 머리는 온 땅을 장악하고, 그 안에 거주하는 자들을 큰 압제로 다스렸으며, 이전에 있던 모든 날개들보다 더 크게 거주하는 세상에 대한 지배권을 가졌습니다.


    그 뒤에 내가 보니, 가운데 머리가 갑자기 사라졌는데, 이것은 날개들에게서 일어났던 것과 같았습니다.


    그러나 두 머리가 남았고, 그들도 땅과 그 안에 거주하는 자들을 다스렸습니다.


    내가 보니, 오른쪽 머리가 왼쪽에 있는 것을 삼켜 버렸습니다.


    그때 내게 “네 앞을 바라보고, 네가 보는 것을 생각해 보라” 하고 말하는 소리가 있었습니다.


    내가 보니, 마치 숲에서 깨어난 사자 같은 것이 으르렁거리고 있었고, 내가 들은 것은 그것이 독수리에게 사람의 목소리를 보내며 이렇게 말하는 것이었습니다.


    “들으라. 내가 네게 말하겠다. 지극히 높으신 분께서 네게 이렇게 말씀하신다.


    네가 내 시대에 내가 다스리게 한 네 짐승 가운데서 살아남은 자가 아니냐? 그것들로 말미암아 내 때들의 끝이 오게 하려는 것이 아니었느냐?


    그리고 온 것들 가운데 네 번째 것은 앞서 지나간 모든 짐승을 이겼고, 큰 떨림 속에서 그 시대를 붙들었으며, 온 세상을 가장 심한 압제 아래 두고, 오랫동안 속임수로 세상에 머물렀다.


    그리고 너는 땅을 진리로 판단하지 않았다.


    너는 온유한 자들을 괴롭혔고 평화로운 이들을 해쳤으며, 진리를 말하는 자들을 미워하고 거짓말하는 자들을 사랑했다. 너는 열매를 맺던 자들의 거처를 파괴하고, 네게 아무 해도 끼치지 않은 자들의 성벽을 허물어뜨렸다.


    그러므로 너의 오만이 지극히 높으신 분께까지 올라갔고, 너의 교만이 능하신 분께까지 올라갔다.


    지극히 높으신 분께서 자기 때들을 살펴보셨는데, 보라, 그것들은 끝났고 그의 시대들은 다 채워졌다.


    그러므로 다시 나타나지 않도록 사라져라— 너, 독수리와 너의 무서운 날개들과 너의 악한 작은 깃날개들과 너의 악한 머리들과 너의 악한 발톱들과, 그리고 너의 모든 헛된 몸이여—


    그래서 온 땅이 쉬고, 너의 폭력에서 풀려 자유롭게 되며, 그것을 지으신 이의 심판과 자비를 바라게 하려는 것이다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aquila
  english_pob_choice: eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 황조롱이
  - 매
  lexicon: 표준어 일반명사
  rationale: POB의 ‘eagle’을 한국어에서 가장 자연스럽고 본문 상징성도 유지하는 ‘독수리’로 옮겼습니다.
- source_word: duodecim alae pennarum / contrariae pennae / pennacula
  english_pob_choice: twelve feathered wings / opposing wings / little pinions
  chosen_korean: 깃털 달린 날개 열두 개 / 반대편 날개 / 작은 깃날개
  alternatives_korean:
  - 깃털 날개
  - 작은 날개깃
  lexicon: 조어형 상징 이미지
  rationale: 날개와 깃의 구분을 살리기 위해 기본 단위는 ‘날개’로, diminutive는 ‘작은 깃날개’로 처리해 반복되는 상징 구조를 보존했습니다.
- source_word: regnare / principatus / dominauit
  english_pob_choice: reign / hold rule / had dominion
  chosen_korean: 다스리다 / 권세를 잡다 / 지배권을 가지다
  alternatives_korean:
  - 통치하다
  - 군림하다
  lexicon: 통치 어휘
  rationale: 같은 개념을 한국어로 지나치게 단조롭게 반복하지 않되, 서로 다른 단계의 지배를 구별하도록 ‘다스리다’, ‘권세를 잡다’, ‘지배권’으로 나누었습니다.
- source_word: inhabitantes / orbis terrarum
  english_pob_choice: those who dwell in it / inhabited world
  chosen_korean: 그 안에 거주하는 자들 / 거주하는 세상
  alternatives_korean:
  - 그곳에 사는 사람들
