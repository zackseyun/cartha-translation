translation:
  language: ko
  text: 그 끝이 다가와서, 전과 같아 보이지 않았습니다. 그런데 보십시오, 한 음성이[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대안적으로는 “그 끝이 다가와서, 전과 같이 보이지 않았습니다. 그리고 보십시오, 한 음성이…”처럼 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ueniebat finis eius
  english_pob_choice: its end was coming
  chosen_korean: 그 끝이 다가와서
  alternatives_korean:
  - 그 끝이 오고 있었습니다
  - 그 끝이 이르고 있었습니다
  lexicon: finis → 끝; ueniebat → 다가와서/오고 있었습니다
  rationale: 라틴어 ueniebat는 진행적 종결 접근을 나타내므로, 한국어에서는 단순 과거보다 ‘다가와서’가 장면의 진행성을 더 자연스럽게 드러냅니다.
- source_word: ut non appareret sicut prior
  english_pob_choice: so that it did not appear like the former
  chosen_korean: 전과 같아 보이지 않았습니다
  alternatives_korean:
  - 이전 것처럼 드러나지 않았습니다
  - 앞의 것과 같게 보이지 않았습니다
  lexicon: appareret → 보이다/드러나다; sicut prior → 전과 같음
  rationale: appareret는 ‘나타나다’보다 시각적으로 ‘보이다’가 더 직접적이며, prior는 앞선 것과의 비교이므로 ‘전과 같다’로 옮기는 것이 비교 구조를 보존합니다.
- source_word: Et ecce uox
  english_pob_choice: And behold, a voice
  chosen_korean: 그런데 보십시오, 한 음성이
  alternatives_korean:
  - 보십시오, 한 음성이
  - 그리고 보십시오, 음성이
  lexicon: ecce → 보십시오; uox → 음성
  rationale: ecce는 장면 전환을 알리는 감탄사이므로 ‘그런데 보십시오’로 이어 주고, uox는 단순 ‘소리’보다 서술적 울림이 있는 ‘음성’이 적절합니다.
theological_decisions:
- issue: 절 경계에 따른 문장 종결
  chosen_reading: 이 절은 ‘한 음성이’에서 끝나고 다음 절의 발화 내용은 포함하지 않습니다.
  alternative_readings:
  - ‘…한 음성이 그에게 보내져 말하기를’까지 이어 번역하는 방식
  rationale: 제공된 라틴어 본문은 Et ecce uox까지만 제시되며, emissa est illi dicens는 다음 절 آغاز에 속하므로 본문 범위를 넘지 않도록 끊었습니다.
  doctrine_reference: 본문 비평/절 구분 원칙
- issue: appareret의 부정 의미 보존
  chosen_reading: ‘전과 같아 보이지 않았습니다’로 옮겨, 형체의 소멸보다 외관상의 비유를 살렸습니다.
  alternative_readings:
  - ‘전과 같이 보이지 않았습니다’
  - ‘전처럼 나타나지 않았습니다’
  rationale: latest revision pass가 appareret의 의미를 ‘disappeared’보다 ‘did not appear’로 바로잡았으므로, 소멸 단정 대신 비교적 절제된 외관 부정을 유지했습니다.
  doctrine_reference: 번역 일치성/어휘 정확성
