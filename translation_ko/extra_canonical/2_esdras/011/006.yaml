id: 2ES.11.6
reference: 2 Esdras 11:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi quomodo subiecti erant ei omnia sub caelo, et nemo illi contradicebat neque unus de creatura, quae est super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/006.yaml
  text: And I saw how everything under heaven was subjected to it[a], and no one contradicted it, not even one creature that is upon the earth.
  footnotes:
  - marker: a
    text: Or 'contradicted it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 보았습니다. 하늘 아래의 모든 것이 그것에게 복종하고 있었으며, 아무도 그것을 반대하지 않았고, 땅 위에 있는 피조물 가운데 하나도 그것을 반대하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것에 이의를 제기하지 않았습니다’.
    reason: contradicere는 문맥상 실질적 대항을 가리킬 수 있으나, 문자적으로는 반박하거나 이의를 제기한다는 의미도 가능합니다.
lexical_decisions:
- source_word: subiecti erant ei omnia sub caelo
  english_pob_choice: everything under heaven was subjected to it
  chosen_korean: 하늘 아래의 모든 것이 그것에게 복종하고 있었으며
  alternatives_korean:
  - 하늘 아래의 모든 것이 그것에게 굴복하고 있었으며
  - 하늘 아래의 모든 것이 그것에게 복종되어 있었으며
  lexicon: subicere
  rationale: 라틴어 수동형 subiecti erant는 단순 상태 진술보다 지배 아래에 놓인 상태를 나타내므로, 한국어에서는 ‘복종하고 있었다’로 자연스럽게 옮겨 지속된 종속 상태를 살렸습니다.
- source_word: nemo illi contradicebat
  english_pob_choice: no one contradicted it
  chosen_korean: 그것을 반대하는 이는 아무도 없었고
  alternatives_korean:
  - 그것과 말다툼하는 이는 아무도 없었고
  - 그것에 이의를 제기하는 이는 아무도 없었고
  lexicon: contradicere
  rationale: 수정 반영본의 취지대로 contradicere는 단순한 말대꾸보다 정치적·실질적 저항의 부재를 가리키므로, ‘반대하는 이’로 옮겨 공개적 저항이 전혀 없음을 드러냈습니다.
- source_word: neque unus de creatura, quae est super terram
  english_pob_choice: not even one creature that is upon the earth
  chosen_korean: 땅 위에 있는 피조물 가운데서도 하나 없었습니다
  alternatives_korean:
  - 땅 위에 있는 어떤 피조물 하나도 없었습니다
  - 땅 위의 피조물 중 하나도 없었습니다
  lexicon: creatura
  rationale: creatura를 ‘피조물’로 옮겨 창조된 존재 전체를 가리키는 범위를 유지했고, neque unus는 ‘하나 없었습니다’로 강화하여 절대적 부정을 살렸습니다.
theological_decisions:
- issue: 보편적 종속과 무저항의 강조
  chosen_reading: ‘하늘 아래의 모든 것이 그것에게 복종하고 있었으며’로 옮겨 우주적·정치적 지배의 총체성을 드러냈습니다.
  alternative_readings:
  - ‘모든 것이 그것에게 굴복하고 있었다’
  - ‘모든 것이 그것 아래에 있었다’
  rationale: 문맥상 제국적 상징의 절대 권세를 묘사하는 구절이므로, 단순한 위치 관계보다 지배·종속의 신학적 함의를 보존하는 번역이 적절합니다.
  doctrine_reference: 묵시문학의 제국 비판과 권세의 일시성
- issue: contradicebat의 성격
  chosen_reading: ‘그것을 반대하는 이는 아무도 없었고’로 번역해 언어적 반박보다 실질적 저항의 부재를 포착했습니다.
  alternative_readings:
  - ‘그것을 논박하는 이는 아무도 없었고’
  - ‘그것에 이의를 제기하는 이는 아무도 없었고’
  rationale: 평가된 라틴어와 수정 이력이 모두 ‘opposed/resisted’의 의미 영역을 지시하므로, 한국어에서도 단순 언쟁이 아니라 누구도 대항하지 못한 상태를 살렸습니다.
  doctrine_reference: contradicere의 정치·군사적 뉘앙스
