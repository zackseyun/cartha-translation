  text: Do not all keep watch at once; sleep, each one in his own place, and keep watch for a time.
translation:
  language: ko
  text: 모두 한꺼번에 깨어 있지 마십시오. 각자 자기 자리에서 잠들고, 일정한 시간 동안은 깨어 계십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nolite omnes simul uigilare
  english_pob_choice: Do not all keep watch at once
  chosen_korean: 모두 한꺼번에 깨어 있지 마십시오
  alternatives_korean:
  - 모두 함께 밤을 새우지 마십시오
  - 모두 동시에 깨어 있지 마십시오
  lexicon: uigilare
  rationale: 라틴어 uigilare는 문맥상 ‘깨어 있다/철야하다’의 뜻이므로, 한국어에서는 자연스러운 명령형으로 ‘깨어 있지 마십시오’라고 옮기고, ‘모두…한꺼번에’로 동시성을 살렸습니다.
- source_word: dormite unusquisque in loco suo
  english_pob_choice: sleep, each one in his own place
  chosen_korean: 각자 자기 자리에서 잠들고
  alternatives_korean:
  - 각자 제자리에서 주무시고
  - 각 사람은 자기 자리에서 잠들고
  lexicon: dormite / unusquisque / in loco suo
  rationale: dormite는 직접적인 ‘자라’보다 상황에 맞는 ‘잠들다’가 더 자연스럽고, unusquisque는 ‘각자’로, in loco suo는 ‘자기 자리에서’로 옮겨 자리의 구분을 분명히 했습니다.
- source_word: et per tempus uigilate
  english_pob_choice: and keep watch for a time
  chosen_korean: 일정한 시간 동안은 깨어 계십시오
  alternatives_korean:
  - 잠깐 깨어 계십시오
  - 한동안 깨어 계십시오
  lexicon: per tempus
  rationale: latest revision이 ‘for a time’로 수정된 점을 반영해, per tempus를 ‘일정한 시간 동안’으로 옮겨 지속의 길이보다 한정된 기간임을 드러냈습니다.
theological_decisions:
- issue: 명령문의 호칭과 공손체 유지
  chosen_reading: 직접 명령은 합쇼체로 두되, 내용상의 긴급성과 질서는 유지했습니다.
  alternative_readings:
  - 더 부드러운 권고형
  - 평서형으로 완화
  rationale: 원문은 공동체에 대한 직접적 금지와 지시이므로, 한국어도 명령성을 약화하지 않고 현대 합쇼체로 옮기는 것이 가장 충실합니다.
  doctrine_reference: 서술적/훈계적 명령문 처리 원칙
