review_pass:
  verdict: revise
  source_fidelity: 첫 명령은 simul(동시에/한꺼번에)을 충실히 반영합니다. 그러나 dormite는 ‘잠들다’보다 수면 행위를 지시하는 ‘자다’가 직접적이며, per tempus는 정해진 특정 시간이라기보다 ‘한동안/얼마 동안’이라는 제한된 기간을 뜻합니다.
  naturalness: ‘각자 제자리에서 자고, 한동안 깨어 있으십시오’가 현대 표준 한국어의 직접 명령문으로 자연스럽고, 앞뒤의 대조도 분명합니다. ‘깨어 있으십시오’는 별도의 주체 높임을 불필요하게 더하지 않으면서 합쇼체를 유지합니다.
  terminology: 신학적 전문 용어 및 인명은 없습니다. uigilare는 두 차례 모두 문맥에 맞게 ‘깨어 있다’로 일관되게 옮깁니다.
  issues:
  - severity: medium
    issue: ‘일정한 시간 동안’
    rationale: per tempus는 시간이 미리 정해져 있음을 말하지 않습니다. 한국어 ‘일정한’은 규정되거나 정해진 시간을 암시하므로, 기간의 한정을 보존하는 ‘한동안’이 더 정확합니다.
  - severity: low
    issue: ‘잠들고’
    rationale: dormite는 ‘잠에 들라’보다 ‘자라’라는 명령입니다. ‘자고’가 원문의 직접성과 병렬 명령 구조를 더 잘 살립니다.
  revised_text: 모두 한꺼번에 깨어 있지 마십시오. 각자 제자리에서 자고, 한동안 깨어 있으십시오.
