revisions:
- from: 그리고 내가 보니, 그 입들은 소리 내지 않았고, 그 몸의 가운데에서만 소리가 나왔습니다.
  to: 그리고 내가 보니, 그 머리들에서는 소리가 나오지 않고 그 몸의 가운데에서 소리가 나왔습니다.
  rationale: ‘입들’을 원문의 복수 ‘머리들’로 바로잡고, 소리가 어느 곳에서 ‘나오는가’라는 원문의 대조를 유지했습니다. 불필요한 배타 강조는 제거했으며, 한국어의 무관사 표현으로 uox의 비특정성을 보존했습니다.
