id: 2ES.11.10
reference: 2 Esdras 11:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce uox non exiebat de capitibus eius, sed de medietate corporis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/010.yaml
  text: And I looked, and behold, a voice did not come out from its heads, but from the middle of its body.
translation:
  language: ko
  text: 그리고 내가 보니, 그 머리들에서는 소리가 나오지 않고 그 몸의 가운데에서 소리가 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  english_pob_choice: And I looked, and behold
  chosen_korean: 그리고 내가 보니
  alternatives_korean:
  - 내가 보니
  - 그리고 보니
  lexicon: et uidi et ecce
  rationale: 라틴어의 관찰-환기 공식은 한국어에서 자연스러운 시각적 서술로 옮겨, 장면 전환의 즉시성을 살렸습니다.
- source_word: uox
  english_pob_choice: a voice
  chosen_korean: 소리
  alternatives_korean:
  - 음성
  - 목소리
  lexicon: uox
  rationale: 문맥상 인격적 ‘목소리’보다 현상으로서의 ‘소리’가 더 직접적이며, 무생물적/기이한 장면 묘사에 맞습니다.
- source_word: non exiebat de capitibus eius
  english_pob_choice: did not come out from its heads
  chosen_korean: 그 입들은 소리 내지 않았고
  alternatives_korean:
  - 그 머리들에서는 소리가 나오지 않았고
  - 그 머리들로부터 나오지 않았고
  lexicon: caput / exire
  rationale: 라틴어의 ‘머리들’과 ‘나오다’의 결합을 한국어로 직역하되, 다지(多肢) 괴수의 비정상적 이미지가 자연스럽게 드러나도록 했습니다.
- source_word: de medietate corporis eius
  english_pob_choice: from the middle of its body
  chosen_korean: 그 몸의 가운데에서만
  alternatives_korean:
  - 그 몸의 한가운데에서
  - 그 몸의 중간에서
  lexicon: medietas / corpus
  rationale: medietas는 단순한 ‘중간’보다 중심부를 가리키므로, ‘가운데’로 옮겨 공간적 대비를 분명히 했습니다.
theological_decisions:
- issue: 기이한 환상 묘사의 직역 정도
  chosen_reading: 상징을 해설하지 않고, 본문이 제시하는 기이한 신체-소리 대비를 그대로 옮겼습니다.
  alternative_readings:
  - 상징적 의미를 풀어 설명하는 번역
  - 의미를 완화한 자연스러운 의역
  rationale: 이 절은 설명보다 시각적 충격이 핵심이므로, 독자가 본문의 불가해한 이미지를 그대로 받도록 보존했습니다.
  doctrine_reference: 본문 해설을 번역문에 유입시키지 않는 원칙
- issue: ‘a voice’의 관사 처리
  chosen_reading: 특정한 ‘그 소리’가 아니라, 장면 속에서 새로 포착된 ‘소리’로 처리했습니다.
  alternative_readings:
  - 그 소리
  - 목소리
  rationale: 라틴어 uox는 관사 없는 일반 명사로, 영어 POB의 수정 취지에 따라 비특정성을 살렸습니다.
  doctrine_reference: 원문 무관사 표현의 서술적 중립성
