  timestamp: '2026-07-13T20:25:08Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어 capitibus는 ‘입들’이 아니라 ‘머리들’이며, non exiebat ... sed ...라는 출처의 대조를 ‘소리 내지 않았다’보다 ‘소리가 나오지 않았다’로 옮겨야 정확합니다. uox의 비특정성은 한국어 무관사 명사 ‘소리’로 자연스럽게 보존됩니다.
  naturalness: ‘그 머리들에서는 소리가 나오지 않고, 그 몸의 가운데에서 소리가 나왔습니다’는 환상 서술로 자연스럽고 현대 표준 합쇼체에 맞습니다.
  terminology: capita는 ‘머리들’, corpus는 ‘몸’, medietas는 ‘가운데’로 옮기는 것이 적절합니다. 신학적 해설을 덧붙이지 않았습니다.
  issues:
  - severity: high
    issue: ‘그 입들’
    rationale: 원문의 capitibus는 caput(머리)의 복수 여격/탈격이며, ‘입’(os)이 아닙니다. 신체 이미지와 원문 어휘를 변경합니다.
  - severity: medium
    issue: ‘소리 내지 않았고’
    rationale: non exiebat de capitibus eius는 머리들이 소리를 내지 않았다는 행위 진술보다 ‘소리가 그 머리들에서 나오지 않았다’라는 소리의 출처에 관한 진술입니다.
  - severity: low
    issue: ‘가운데에서만’의 ‘만’
    rationale: 대조 구조상 의미를 전달할 수 있으나, 원문에는 별도의 배타 강조사가 없습니다. ‘...않고 ...에서’라는 대조만으로 충분합니다.
  revised_text: 그리고 내가 보니, 그 머리들에서는 소리가 나오지 않고 그 몸의 가운데에서 소리가 나왔습니다.
  revised_footnotes: []
  revision_rationale: ‘입들’을 원문의 복수 ‘머리들’로 바로잡고, 소리가 어느 곳에서 ‘나오는가’라는 원문의 대조를 유지했습니다. 불필요한 배타 강조는 제거했으며, 한국어의 무관사 표현으로 uox의 비특정성을 보존했습니다.
