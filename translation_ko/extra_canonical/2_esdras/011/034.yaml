  text: But two heads remained, and they too reigned over the earth and over those who dwell in it. And I saw, and behold,
translation:
  language: ko
  text: 그런데 두 머리만 남아 있었고, 그것들도 땅과 그 안에 거하는 자들 위에서 다스렸습니다. 내가 보았는데, 보십시오,[a]
