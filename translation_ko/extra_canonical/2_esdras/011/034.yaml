    text: Lat. capita를 문자적으로 옮긴 표현입니다. 이 장 전체의 상징적 짐승 이미지와 연결됩니다.
    reason: source_note
lexical_decisions:
- source_word: auerunt autem duo capita
  english_pob_choice: But two heads remained
  chosen_korean: 그런데 두 머리만 남아 있었고
  alternatives_korean:
  - 그러나 두 머리만 남았고
  - 그런데 두 머리가 남아 있었고
  lexicon: capita → 머리
  rationale: Latin의 capita를 문자적으로 ‘머리’로 옮기되, 문맥상 ‘남아 있었다’는 존속 의미를 살려 POB의 ‘remained’를 반영했습니다.
- source_word: regnauerunt super terram et super eos qui inhabitant in ea
  english_pob_choice: they too reigned over the earth and over those who dwell in it
  chosen_korean: 그것들도 땅과 그 안에 거하는 자들 위에서 다스렸습니다
  alternatives_korean:
  - 그것들도 땅과 그 안에 사는 사람들 위에 군림했습니다
  - 그것들도 땅과 그 안에 거주하는 이들 위에서 통치했습니다
  lexicon: regnare → 다스리다
  rationale: regnauerunt는 단순한 지배가 아니라 왕권적 통치를 뜻하므로 ‘다스리다’로 옮겨 POB의 ‘reigned’와 대응시켰습니다.
- source_word: Et uidi et ecce
  english_pob_choice: And I saw, and behold,
  chosen_korean: 내가 보았는데, 보십시오,
  alternatives_korean:
  - 내가 보니, 보라,
  - 그리고 내가 보았고, 보십시오,
  lexicon: vidi / ecce → 보았습니다 / 보십시오
  rationale: 예언적 시야 전환을 나타내는 고정 관용구이므로 서술체를 유지하되, ecce의 감탄·주목 요청을 ‘보십시오’로 살렸습니다.
theological_decisions:
- issue: ‘땅’과 ‘그 안에 거하는 자들’의 범위
  chosen_reading: 우주 전체의 지배가 아니라, 본문이 제시하는 세계 질서와 그 주민에 대한 통치를 그대로 옮겼습니다.
  alternative_readings:
  - ‘세상’으로 일반화하기
  - ‘온 땅’으로 확대하기
  rationale: 라틴어 terram과 in ea는 구체적 대상을 유지하므로, 의미를 넓혀 해석하기보다 본문 그대로 유지하는 편이 소스 충실성에 맞습니다.
  doctrine_reference: source-grounded apocalyptic imagery
