id: 2ES.11.2
reference: 2 Esdras 11:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce expandebat alas suas in omnem terram, et omnes uenti caeli insufflabant ad eam et [nubes ad eam] colligebantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/002.yaml
  text: And I looked[a], and behold, it spread its wings over all the earth, and all the winds of heaven were blowing upon it[b], and the clouds were gathering to it.
  footnotes:
  - marker: a
    text: The clause 'and the clouds were gathering around it' is present in the cleaned Bensly Latin but appears bracketed as textually uncertain.
    reason: textual_variant
    anchor_ref: '11:2'
  - marker: b
    text: Or 'around it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 보니, 보라, 그것이 온 땅 위로 자기 날개를 펼쳤으며, 하늘의 모든 바람이 그것을 향해 불고 있었고, 구름들도 그것에게로 모이고 있었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 정리된 Bensly 라틴 본문에는 이 구절이 포함되지만, 본문 전승상 문자적으로 불확실한 대목입니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘주변으로’.
    reason: previous_rendering
lexical_decisions:
- source_word: expandebat alas suas in omnem terram
  english_pob_choice: it spread its wings over all the earth
  chosen_korean: 그것이 온 땅 위로 자기 날개를 펼쳤으며
  alternatives_korean:
  - 그것이 온 땅에 날개를 펼쳤으며
  - 그것이 온 땅 위로 날개를 펴고 있었으며
  lexicon: expandebat / alas suas / in omnem terram
  rationale: 라틴어의 진행형 뉘앙스를 살려 ‘펼쳤으며’로 옮기고, 'in omnem terram'은 단순한 범위가 아니라 지면 위를 덮는 이미지이므로 ‘온 땅 위로’가 적절합니다.
- source_word: omnes uenti caeli insufflabant ad eam
  english_pob_choice: all the winds of heaven were blowing upon it
  chosen_korean: 하늘의 모든 바람이 그것을 향해 불고 있었고
  alternatives_korean:
  - 하늘의 모든 바람이 그것에게 불고 있었고
  - 하늘의 모든 바람이 그것 주변에서 불고 있었고
  lexicon: omnes uenti caeli / insufflabant / ad eam
  rationale: '''ad eam''은 단순한 배경적 ‘around’가 아니라 방향성을 가진 ‘toward it’이므로 ‘향해’로 살렸고, 바람의 지속적 작용을 위해 진행형으로 옮겼습니다.'
- source_word: nubes ad eam colligebantur
  english_pob_choice: the clouds were gathering to it
  chosen_korean: 구름들도 그것에게로 모이고 있었습니다
  alternatives_korean:
  - 구름들도 그것을 향해 모이고 있었습니다
  - 구름들도 그것 주위로 모이고 있었습니다
  lexicon: nubes / ad eam / colligebantur
  rationale: 청산된 라틴 본문에는 구름 절이 존재하므로 본문에 반영하되, 'ad eam'의 방향성을 따라 ‘에게로’로 옮겼습니다.
theological_decisions:
- issue: 시각적·상징적 서술의 유지
  chosen_reading: 환상 장면의 동적 이미지—날개를 펼침, 바람이 불어옴, 구름이 모임—을 설명적으로 축소하지 않고 그대로 보존했습니다.
  alternative_readings:
  - 상징을 풀어 ‘세력이 확장되었다’ 등으로 의역
  - 이미지를 완화해 단순한 서술로 처리
  rationale: 본문은 해석보다 장면 제시가 중심이므로, 독자가 환상의 압도적 이미지를 직접 받도록 원문 어조를 유지하는 것이 적절합니다.
  doctrine_reference: 문학적-예언적 환상 서술 보존
- issue: 구름 절의 본문 반영
  chosen_reading: 정리된 Bensly 라틴 본문에 있는 구름 절을 본문에 포함하되, 텍스트적으로 불확실하다는 점을 각주로 표시했습니다.
  alternative_readings:
  - 구름 절을 본문에서 삭제
  - 각주 없이 단정적으로 번역
  rationale: 편집된 라틴 본문과 영어 POB의 주석 전통을 따라, 확실한 본문과 불확실한 본문 요소를 구분하는 것이 감사 가능성을 높입니다.
  doctrine_reference: 텍스트 비평 원칙
