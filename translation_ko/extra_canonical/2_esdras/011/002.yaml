  source_fidelity: 라틴어의 미완료 시제(expandebat, insufflabant, colligebantur)는 진행 중인 환상 장면으로 옮겨야 합니다. 초안은 대체로 이를 반영하지만, expandebat을 완료형 ‘펼쳤으며’로 처리한 점은 약화됩니다. ad eam의 방향성은 ‘그것을 향해’로 자연스럽고 정확하게 보존됩니다.
  naturalness: ‘그것에게로 모이고 있었습니다’는 무생물인 환상 속 독수리를 받는 한국어로 다소 어색합니다. ‘그것을 향해 모여들고 있었습니다’가 현대 표준어 문맥에서 자연스럽습니다. 또한 각주는 해당 절에 직접 붙여 독자가 불확실한 구름 절과 대안적 방향 표현을 분명히 알 수 있게 해야 합니다.
  terminology: 환상 대상의 선행 문맥상 대명사 ‘그것’을 유지할 수 있습니다. ‘날개를 펼치고’, ‘불어오고’, ‘모여들고’는 원문의 동적 이미지를 해설 없이 보존합니다.
  issues:
