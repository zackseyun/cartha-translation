id: 2ES.11.42
reference: 2 Esdras 11:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cum ueritate ; Tribulasti enim mansuetos et laesisti quiescentes, odisti uerum dicentes et dilexisti mendaces, et destruxisti habitationes eorum qui fructificabant, et humiliasti muros eorum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/042.yaml
  text: For you afflicted the meek and injured the peaceable; you hated those who spoke truth and loved liars; you destroyed the dwellings of those who bore fruit, and humbled their walls.
translation:
  language: ko
  text: 너는 온유한 사람들을 괴롭혔고 평온히 지내는 사람들을 해쳤으며, 진리를 말하는 사람들을 미워했고 거짓말하는 사람들을 사랑했으며, 열매를 맺는 이들의 거처를 파괴하고 그들의 성벽을 낮추었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mansuetos
  english_pob_choice: the meek
  chosen_korean: 온유한 사람들
  alternatives_korean:
  - 온유한 자들
  - 온유한 이들
  lexicon: mansuetus
  rationale: 라틴어 mansuetus의 기본 의미인 ‘온유한, 순한’에 맞추어 ‘온유한 사람들’로 옮기고, 전통적 교회어의 울림은 유지하되 과도하게 성문화된 표현은 피했습니다.
- source_word: quiescentes
  english_pob_choice: the peaceable
  chosen_korean: 평화를 지키는 사람들
  alternatives_korean:
  - 평화로운 사람들
  - 고요한 사람들
  lexicon: quiescens
  rationale: 단순히 ‘조용한’보다 문맥상 공격받는 대상의 상태를 드러내는 ‘평화를 지키는 사람들’이 POB의 ‘peaceable’를 더 잘 드러냅니다.
- source_word: uerum dicentes
  english_pob_choice: those who spoke truth
  chosen_korean: 진리를 말하는 사람들
  alternatives_korean:
  - 진실을 말하는 사람들
  - 참된 말을 하는 사람들
  lexicon: verum dicere
  rationale: verum dicentes는 단순한 사실 진술보다 진리 말하기를 뜻하므로 ‘진리를 말하는 사람들’로 옮겨 원문의 윤리적 대조를 살렸습니다.
- source_word: mendaces
  english_pob_choice: liars
  chosen_korean: 거짓말하는 사람들
  alternatives_korean:
  - 거짓말쟁이들
  - 거짓말하는 자들
  lexicon: mendax
  rationale: 직설적 대비를 위해 ‘거짓말하는 사람들’을 택해, 앞의 ‘진리를 말하는 사람들’과 평행을 이루게 했습니다.
- source_word: muros eorum humiliasti
  english_pob_choice: and humbled their walls
  chosen_korean: 그들의 성벽을 낮추었습니다
  alternatives_korean:
  - 그들의 성벽을 굴복시켰습니다
  - 그들의 성벽을 무너뜨렸습니다
  lexicon: humiliare
  rationale: POB의 ‘humbled’와 라틴어 humiliasti를 따라 해석적 확장을 피하고, 성벽에 대한 의인화된 낮춤을 직역에 가깝게 살렸습니다.
theological_decisions:
- issue: 마지막 절구의 물리적·수사적 표현
  chosen_reading: ‘그들의 성벽을 낮추었습니다’로 두어, 성벽을 단순 파괴가 아니라 교만하게 높아진 방어의 상징을 낮추는 수사적 표현으로 유지했습니다.
  alternative_readings:
  - ‘그들의 성벽을 무너뜨렸습니다’로 강하게 파괴를 드러내는 읽기
  - ‘그들의 성벽을 굴복시켰습니다’로 인격화된 해석을 넣는 읽기
  rationale: 라틴어 humiliasti는 ‘낮추다, 겸손하게 하다’의 의미를 직접 가지므로, POB의 수정 의도처럼 해석을 덧붙이지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: 본문 비평/수사학적 보존 원칙
- issue: ‘열매를 맺는 이들’
  chosen_reading: fructificabant를 사람에게 적용된 비유로 보아 ‘열매를 맺는 이들’로 옮겼습니다.
  alternative_readings:
  - ‘번성하던 이들’
  - ‘열매를 내던 사람들’
  rationale: 원문은 거처와 성벽을 가진 공동체를 가리키므로, 경제적 번영이나 영적 열매 중 하나로 단정하지 않고 라틴어의 넓은 의미를 남겼습니다.
  doctrine_reference: 문맥 우선/비유 보존
