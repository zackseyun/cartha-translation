  naturalness: ‘그것에게 한 음성이 보내져 이렇게 말했습니다’는 한국어에서 수동 구문과 발화의 연결을 자연스럽게 재현합니다. ‘이 모든 시간 동안’보다 ‘이 모든 동안’이 현대 한국어에서 더 자연스럽습니다.
  terminology: Audi의 권위 있는 직접 명령은 ‘들으라’로 유지할 수 있습니다. terram은 여기서 ‘땅’으로, tenere는 지배·장악의 문맥적 의미를 반영하여 ‘지배해 온’으로 옮겼습니다.
