translation:
  language: ko
  text: 그것에게 보내졌다고 하며 말했습니다. 「들으라, 너는 이 모든 시간 동안 땅을 붙들고 있었던 자여,」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「들으라, 너는 이 모든 시간 동안 땅을 붙들고 있었던 자여」로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: emissa est illi dicens
  english_pob_choice: was sent to it, saying
  chosen_korean: 그것에게 보내졌다고 하며 말했습니다
  alternatives_korean:
  - 그것에게 보내져서 말했습니다
  - 그것에게 보내졌다고 말하며
  lexicon: sent / say
  rationale: 라틴어의 수동 완료형과 이어지는 현재분사 dicens를 분리해, ‘보내졌다’와 ‘말했다’의 두 동작이 모두 드러나도록 옮겼습니다. 한국어에서는 전치를 살려 ‘그것에게’로 처리했습니다.
- source_word: Audi
  english_pob_choice: Hear
  chosen_korean: 들으라
  alternatives_korean:
  - 들어라
  - 들으십시오
  lexicon: hear
  rationale: 직접 인용문 안의 명령문이므로 청자에게 곧바로 말하는 형태를 살리되, 예언적/극적 호소의 뉘앙스를 유지하기 위해 ‘들으라’를 택했습니다.
- source_word: toto tempore
  english_pob_choice: all this time
  chosen_korean: 이 모든 시간 동안
  alternatives_korean:
  - 이 모든 때 동안
  - 오랜 시간 동안
  lexicon: time / whole time
  rationale: applied_revisions가 지적하듯 ‘so long a time’보다 ‘the whole time / all this time’가 원문에 가깝기 때문에, 전체 기간의 지속성을 드러내는 표현으로 옮겼습니다.
- source_word: terram
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 세상
  lexicon: earth / land
  rationale: 이 문맥의 terram은 우주론적 ‘지구’보다 피조세계의 ‘땅’을 가리키는 표현이므로, 한국어에서도 더 직접적인 ‘땅’으로 옮겼습니다.
theological_decisions:
- issue: 직접 인용문의 호소 형식
  chosen_reading: 예언적 경고/호소의 명령문을 살려 「들으라」로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 「들어라」로 평이하게 완화
  - 「들으십시오」로 공손화
  rationale: 본문은 친밀한 권면보다 권위 있는 선포에 가깝기 때문에, 합쇼체 본문 안에서도 인용문 내부의 명령은 원문 기능을 보존하는 방향이 적절합니다.
  doctrine_reference: 문학적-수사학적 보존 원칙
