lexical_decisions:
- source_word: uelocius quam prior non conparuit
  english_pob_choice: and the second did not appear, but disappeared more quickly than the former
  chosen_korean: 이전 것보다 더 빨리 나타나지 않았습니다
  alternatives_korean:
  - 이전 것보다 더 빨리 사라졌습니다
  - 이전 것보다 더 빨리 드러나지 않았습니다
  lexicon: conparuit
  rationale: Latin non conparuit는 단순한 ‘사라지다’보다 ‘나타나지 않다/드러나지 않다’의 뜻이 더 직접적이어서, 본문 구조를 따라 부정적 출현으로 옮겼습니다.
- source_word: Et uidi et ecce
  english_pob_choice: And I saw, and behold
  chosen_korean: 그리고 저는 보았습니다. 보라
  alternatives_korean:
  - 그리고 보았습니다. 보십시오
  - 제가 보니, 보라
  lexicon: vidi / ecce
  rationale: 예언적 시야 전환을 살리기 위해 시각 동사와 감탄사적 도입을 분리해 옮겼습니다.
- source_word: duae quae
  english_pob_choice: two that
  chosen_korean: 두 존재가 있었습니다
  alternatives_korean:
  - 둘이 있었습니다
  - 두 것이 있었습니다
  lexicon: duae
  rationale: 뒤이어 이어질 서술을 위해 수사적 미완결을 한국어에서는 자연스럽게 받쳐 주되, 원문의 ‘두 개체’를 유지했습니다.
