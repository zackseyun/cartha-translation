    text: Or 'It held power for a long time. And it happened that when it reigned,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것이 오랫동안 권세를 잡았습니다[a]. 그리고 그것이 통치하고 있을 때에,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다른 절 경계에서는 이 문구가 앞절과 연결되는 것으로 검토되었지만, 제공된 라틴 본문에는 본절에 포함되어 있습니다.
    reason: source_note
lexical_decisions:
- source_word: ipsa multum tenuit tempus
  english_pob_choice: It held power for a long time
  chosen_korean: 그것이 오랫동안 권세를 잡았습니다
  alternatives_korean:
  - 그것이 오랫동안 지배했습니다
  - 그것이 긴 시간 동안 통치했습니다
  lexicon: tenere + tempus
  rationale: 라틴어는 단순한 지속이 아니라 권세를 ‘붙들고 있음/보유함’을 나타내므로, 문맥상 자연스럽게 ‘권세를 잡다’로 옮겼습니다. '오랫동안'은 multum tempus의 시간적 지속을 반영합니다.
- source_word: cum regnaret
  english_pob_choice: when it reigned
  chosen_korean: 그것이 통치하고 있을 때에
  alternatives_korean:
  - 그것이 다스릴 때에
  - 그것이 왕 노릇할 때에
  lexicon: regnare
  rationale: regnaret는 왕권을 행사하는 상태를 가리키므로, '통치하다'를 사용해 지배 행위를 분명히 했습니다.
- source_word: Et factum est
  english_pob_choice: And it happened that
  chosen_korean: 그리고
  alternatives_korean:
  - 그리하여
  - 그 일이 있었습니다
  lexicon: et factum est
  rationale: 서술 전환 공식은 한국어에서 반복을 줄이되 사건 전개를 이어 주는 접속사 '그리고'로 간결하게 반영했습니다.
theological_decisions:
- issue: 문장 경계와 반복 문제
  chosen_reading: '''ipsa multum tenuit tempus''를 본절에 포함해 ''오랫동안 권세를 잡았습니다''로 번역했습니다.'
  alternative_readings:
  - 이 구절을 앞절로 돌리고 본절은 '그리고 그것이 통치하고 있을 때에,'로만 번역
  - 반복처럼 보이는 구절을 생략
  rationale: 공용본 English audit trail에는 절 분할 오류에 대한 정정이 기록되어 있지만, 제공된 라틴 본문 자체에는 해당 절구가 포함되어 있으므로 본절 번역에 반영하는 편이 원문 가시성과 대조 가능성을 보존합니다.
  doctrine_reference: 본문비평/절 분할
