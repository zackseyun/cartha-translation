  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce aquila uolauit in pennis suis ut regnaret super terram et super eos qui habitant in ea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/005.yaml
  text: And I looked, and behold, the eagle flew on its wings to reign over the earth and over those who dwell in it.
translation:
  language: ko
  text: 내가 보니, 보라, 독수리가 자기 날개로 날아 땅과 그 안에 사는 자들을 다스리려고 하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  english_pob_choice: And I looked, and behold
  chosen_korean: 내가 보고 보니, 보라
  alternatives_korean:
  - 내가 보니, 보라
  - 내가 보고 있었더니, 보라
  lexicon: source_note
  rationale: 라틴어의 관찰 동사 두 개와 감탄 표지 ecce를 자연스러운 예언적 시선 전환으로 옮겼습니다. "보라"는 단순한 시각 정보보다 장면 전환의 긴박함을 살립니다.
- source_word: aquila
  english_pob_choice: the eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 독응
  - 매
  lexicon: source_note
  rationale: 라틴어 aquila의 기본 뜻을 표준어로 सीधे 대응시켰습니다. 본문 전체에서 상징 동물로 쓰이므로 비유적 해석을 덧붙이지 않았습니다.
- source_word: uolauit in pennis suis
  english_pob_choice: flew on its wings
  chosen_korean: 자기 날개 위를 날아 올라
  alternatives_korean:
  - 자기 날개로 날아
  - 자기 날개에 실려 날아
  lexicon: source_note
  rationale: in pennis suis는 직역하면 "자기 깃털들/날개들 위에"이지만, POB의 영어처럼 비상 동작을 분명히 하기 위해 "날아 올라"로 자연화했습니다. 과도한 의역 없이 동작의 시각성을 유지했습니다.
- source_word: ut regnaret super terram et super eos qui habitant in ea
  english_pob_choice: to reign over the earth and over those who dwell in it
  chosen_korean: 땅과 그 안에 사는 자들 위에 군림하려고 하였습니다
  alternatives_korean:
  - 땅과 그 안에 사는 자들을 다스리려고 하였습니다
  - 땅과 그 안에 거주하는 자들 위에 통치하려고 하였습니다
  lexicon: source_note
  rationale: regnaret는 단순히 "다스리다"보다 왕권적 지배를 강하게 나타내므로 "군림하다"를 택했습니다. earth/terra를 문맥상 "땅"으로, habitant in ea는 "그 안에 사는 자들"로 옮겨 라틴어의 공간 관계를 보존했습니다.
theological_decisions:
- issue: 제왕적 지배 동사의 강도
  chosen_reading: '"군림하다"로 옮겨 독수리의 권력적 상승과 지배 의도를 분명히 했습니다.'
  alternative_readings:
  - '"다스리다"'
  - '"통치하다"'
  rationale: 본문의 regnaret는 중립적 행정보다 왕권 행사를 가리키며, 이 장면은 상징적 제국 권력을 드러내므로 강한 동사를 유지하는 편이 원문 효과에 가깝습니다.
  doctrine_reference: 서사-상징 해석 보존
