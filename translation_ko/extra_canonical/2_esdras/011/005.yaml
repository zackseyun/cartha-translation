  rationale: 원문의 환상 표지와 목적절을 유지하되, 날개의 도구적 기능을 자연스러운 한국어 조사 ‘로’로 옮기고 원문에 없는 상승 의미를 제거했습니다. 지배 동사는 왕권적 의미를 보존하면서도 불필요한 평가적 뉘앙스를 피하도록 ‘다스리다’로 조정했습니다.
