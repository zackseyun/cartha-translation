  text: 당신이 내가 만든 네 마리 짐승을 이긴 자가 아닙니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nonne tu es
  english_pob_choice: Are you not the one
  chosen_korean: 당신이 … 아니냐?
  alternatives_korean:
  - 당신은 … 아닙니까?
  - 당신이 … 아닌가요?
  lexicon: nonne
  rationale: 수사적 확인 질문이므로 현대적 합쇼체로 옮기되, 문맥의 추궁성은 ‘아니냐?’로 살렸습니다.
- source_word: qui superasti
  english_pob_choice: who prevailed over
  chosen_korean: 이긴
  alternatives_korean:
  - 이겨 낸
  - 극복한
  - 승리한
  lexicon: superare
  rationale: 라틴어 superasti는 단순 생존보다 ‘이겨 냄/우세함’을 뜻하므로, 영어 수정안의 의미를 따라 ‘이긴’으로 간결하게 옮겼습니다.
- source_word: de quattuor animalibus
  english_pob_choice: over the four beasts
  chosen_korean: 네 짐승을
  alternatives_korean:
  - 네 짐승들 위에
  - 네 짐승들에 대하여
  lexicon: animal
  rationale: animalia는 여기서 문자적 동물이라기보다 환상적 ‘짐승’이므로, 본문이 가리키는 상징을 살렸습니다.
- source_word: quae feceram
  english_pob_choice: that I had made
  chosen_korean: 내가 만든
  alternatives_korean:
  - 내가 지은
  - 내가 만들어 둔
  lexicon: facere
  rationale: 창조·제작의 동작을 자연스럽게 드러내면서, 화자 자신이 만들어 놓은 대상이라는 관계를 유지했습니다.
theological_decisions:
- issue: 짐승(환상적 피조물)의 지칭 방식
  chosen_reading: ‘짐승’으로 옮겨 환상적·상징적 대상이라는 성격을 그대로 드러냈습니다.
  alternative_readings:
  - ‘동물’로 완화
  - ‘괴수’로 강화
  rationale: 문맥상 실제 동물이 아니라 환상 문학의 상징적 존재이므로, 본문의 장르 감각을 보존하는 번역이 필요합니다.
  doctrine_reference: 묵시 문학의 상징적 이미지 유지
