  yaml_path: translation/extra_canonical/2_esdras/011/045.yaml
  text: Therefore may you never appear again—you[a], eagle, and your dreadful wings and your most wicked pinions and your evil heads and your wicked claws and all your worthless body—
  footnotes:
  - marker: a
    text: Or 'disappear, so that you may not appear again'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로, 너와 네 두려운 날개와 네 가장 악한 깃과 네 악한 머리들과 네 악한 발톱들과 네 온몸이 다시는 나타나지 않기를 바라노라, 독수리여.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다시 나타나지 않도록 사라지라’.
    reason: previous_rendering
lexical_decisions:
- source_word: non apparens non appareas
  english_pob_choice: may you never appear again
  chosen_korean: 다시는 나타나지 않기를 바라노라
  alternatives_korean:
  - 다시는 보이지 않기를 바라노라
  - 완전히 사라지기를 바라노라
  lexicon: —
  rationale: 라틴어의 반복 부정은 단순한 목적절이 아니라 강한 금지/저주적 바람을 나타내므로, ‘다시는 나타나지 않다’로 옮겨 의미를 보존했습니다.
- source_word: aquila
  english_pob_choice: eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 황새
  - 수리
  lexicon: —
  rationale: 문맥상 상징적 대상인 ‘eagle’을 한국어의 표준적인 ‘독수리’로 옮겼습니다.
- source_word: pessima
  english_pob_choice: most wicked
  chosen_korean: 가장 악한
  alternatives_korean:
  - 지극히 악한
  - 극히 사악한
  lexicon: —
  rationale: 최상급 뉘앙스를 살리되, 원문의 도덕적 평가를 직접적으로 드러내는 ‘가장 악한’을 택했습니다.
- source_word: pennacula
  english_pob_choice: pinions
  chosen_korean: 깃
  alternatives_korean:
  - 날개깃
  - 작은 날개
  lexicon: —
  rationale: 라틴어 pennacula의 축소형 뉘앙스를 과도하게 부여하지 않도록, 영어 POB의 ‘pinions’에 맞춰 비교적 중립적인 ‘깃’으로 옮겼습니다.
theological_decisions:
- issue: 저주/기원문의 문체 처리
  chosen_reading: 직설적 서술이 아니라 ‘다시는 나타나지 않기를 바라노라’라는 저주적 기원으로 옮겼습니다.
  alternative_readings:
  - 다시는 나타나지 않으라
  - 다시는 나타나지 않게 되기를 바란다
  rationale: 원문은 명령형보다 강한 부정적 기원의 효과를 내므로, 한국어에서도 합쇼체를 유지하면서 저주적 어조를 살렸습니다.
  doctrine_reference: 본문 수사와 장르 보존
