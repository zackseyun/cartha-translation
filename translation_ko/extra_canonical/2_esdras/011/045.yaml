  to: 그러므로 독수리여, 너와 네 끔찍한 날개와 네 가장 사악한 날개깃과 네 사악한 머리들과 네 사악한 발톱들과 네 온몸이 다시는 나타나지 않기를 바랍니다—[a]
  rationale: 호격을 문두에 두고, pennacula를 ‘날개깃’으로 구체화했으며, 원문의 열거가 계속되는 문장 형태는 끝의 대시로 보존했습니다. 각주는 ‘~도록’이라는 목적 해석을 피하고 강조 용법을 반영하도록 수정했습니다.
