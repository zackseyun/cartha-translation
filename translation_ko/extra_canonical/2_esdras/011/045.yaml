review_pass:
  verdict: revise
  source_fidelity: 라틴어의 반복 부정 표현(non apparens non appareas)은 강한 부정적 기원을 나타내며, ‘다시는 나타나지 않기를 바랍니다’는 이를 자연스럽게 반영합니다. 다만 원문의 열거 순서와 문장 미완결을 더 분명히 보존하는 편이 좋습니다.
  naturalness: 현행문은 ‘독수리여’가 문장 끝에 놓여 수식어 열거가 길어진 뒤에야 호격이 드러납니다. 호격을 앞에 두고 ‘날개깃’으로 옮기면 현대 한국어에서 더 자연스럽고 대상 관계도 명료합니다. 합쇼체의 ‘바랍니다’를 유지합니다.
  terminology: aquila는 ‘독수리’, horribiles는 ‘끔찍한’, pessima는 최상급을 살린 ‘가장 사악한’, pennacula는 단순 ‘깃’보다 날개의 부분을 가리키는 ‘날개깃’이 적절합니다. maligna는 문맥상 ‘사악한’으로 통일할 수 있습니다.
  issues:
  - severity: low
    issue: 호격의 위치
    rationale: ‘독수리여’를 앞에 배치하면 저주의 직접 대상이 처음부터 분명해집니다.
  - severity: low
    issue: pennacula의 번역
    rationale: ‘깃’은 일반 깃털로도 이해될 수 있으므로, pinions 및 날개의 축소·부분 명칭에 더 가까운 ‘날개깃’이 적절합니다.
  - severity: medium
    issue: 각주가 목적절 해석을 제시함
    rationale: ‘다시 나타나지 않도록 사라지라’는 원문의 반복 부정을 목적·결과 관계로 해석할 여지가 있습니다. 강조된 소멸 명령/기원이라는 대안을 제시해야 합니다.
