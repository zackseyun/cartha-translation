base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/029.yaml
  text: the one that was in the middle awoke[a], for it was larger than the two heads. And I saw how it drew the two heads to itself,
  footnotes:
  - marker: a
    text: Or 'And I saw how it drew the two heads to itself,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 가운데 있던 것은 깨어났는데, 그것이 두 머리보다 더 컸기 때문입니다. 그리고 나는 그것이 그 두 머리를 자기 쪽으로 끌어안는 것을 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 두 머리를 자기 쪽으로 끌어당기는 것을 보았습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: quod erat medium
  english_pob_choice: the one that was in the middle
  chosen_korean: 그 가운데 있던 것
  alternatives_korean:
  - 중앙에 있던 것
  - 가운데 있던 자
  lexicon: 중간/가운데
  rationale: 문맥상 동물 형상 가운데 위치한 대상을 가리키므로, ‘그 가운데 있던 것’으로 자연스럽게 옮기되 인칭화는 피했습니다.
- source_word: euigilabat
  english_pob_choice: awoke
  chosen_korean: 깨어났습니다
  alternatives_korean:
  - 깨어났습니다
  - 눈을 떴습니다
  lexicon: 깨어나다
  rationale: 라틴어 euigilabat의 직접적 의미를 따라, 상태 변화의 순간을 분명하게 드러냈습니다.
- source_word: duorum capitum maius
  english_pob_choice: larger than the two heads
  chosen_korean: 두 머리보다 더 컸기 때문입니다
  alternatives_korean:
  - 두 머리보다 더 컸기 때문입니다
  - 두 머리보다 컸기 때문입니다
  lexicon: 큰/더 크다
  rationale: 비교급 maius의 강도를 살려 ‘더 컸기 때문입니다’로 옮겼습니다.
- source_word: conplexa est duo capita secum
  english_pob_choice: it drew the two heads to itself
  chosen_korean: 그 두 머리를 자기 쪽으로 끌어안는 것을
  alternatives_korean:
  - 그 두 머리를 자기 쪽으로 끌어당기는 것을
  - 그 두 머리를 자기에게 끌어들이는 것을
  lexicon: 포옹하다/끌어안다
  rationale: conplexa est는 단순한 이동보다 ‘끌어안다/포옹하다’의 결을 가지므로, POB의 ‘drew ... to itself’보다 원문의 접촉·포섭 이미지를 더 직접적으로 드러냈습니다.
