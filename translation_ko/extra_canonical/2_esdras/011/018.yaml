translation:
  language: ko
  text: 당신의 시간을 차지할 것이지만, 그것의 절반도 되지 않을 것입니다. 그러고 나서 셋째가 일어나, 앞선 이들이 그랬던 것처럼 통치를 장악하였고, 그리고 사라졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘셋째가 일어나 앞선 이들이 그랬던 것처럼 통치를 장악하였고, 그 역시 사라졌습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: tenebit tempus tuum
  english_pob_choice: will hold your time
  chosen_korean: 당신의 시간을 차지할 것이지만
  alternatives_korean:
  - 당신의 때를 붙들 것이지만
  - 당신의 시간을 잡을 것이지만
  lexicon: tempus → 시간/때
  rationale: tempus는 여기서 ‘지속되는 기간’의 의미가 강하므로 ‘시간’으로 옮기되, tenebit의 점유·장악 뉘앙스를 살려 ‘차지하다’를 택했습니다.
- source_word: sed nec dimidium eius
  english_pob_choice: but not even half of it
  chosen_korean: 그것의 절반도 되지 않을 것입니다
  alternatives_korean:
  - 그러나 그것의 절반도 되지 않을 것입니다
  - 하지만 그 절반조차 되지 않을 것입니다
  lexicon: sed + nec dimidium eius
  rationale: sed의 역접을 자연스러운 한국어 흐름 속에 반영하되, nec dimidium eius의 부정 강조를 ‘절반도 되지 않을 것입니다’로 살렸습니다.
- source_word: Et leuauit se tertia et tenuit principatum
  english_pob_choice: Then the third rose up and held the rule
  chosen_korean: 그러고 나서 셋째가 일어나, 앞선 이들이 그랬던 것처럼 통치를 장악하였고
  alternatives_korean:
  - 그때 셋째가 일어나, 앞선 이들과 같이 지배권을 잡았고
  - 그리고 셋째가 일어나, 선임자들처럼 통치권을 가졌고
  lexicon: leuauit se / tenuit principatum
  rationale: leuauit se는 단순한 등장보다 ‘일어나다’가 자연스럽고, principatum은 추상적 ‘통치권’보다 구체적 권력 장악을 드러내는 ‘통치를 장악하다’가 원문의 힘을 잘 전달합니다.
- source_word: et non apparuit
  english_pob_choice: and it disappeared
  chosen_korean: 그리고 사라졌습니다
  alternatives_korean:
  - 그리고 나타나지 않았습니다
  - 그리고 보이지 않게 되었습니다
  lexicon: non apparuit
  rationale: 직역하면 ‘나타나지 않았다’이지만, 이 문맥에서는 존재의 소멸을 뜻하므로 한국어에서는 ‘사라지다’가 의미를 더 정확하게 전달합니다.
theological_decisions:
- issue: 제국/왕권 계승을 나타내는 principatum의 정치적 의미
  chosen_reading: ‘통치를 장악하다’로 옮겨 단순한 왕위 계승이 아니라 권력의 실제 행사와 점유를 드러냈습니다.
  alternative_readings:
  - ‘통치권을 가지다’
  - ‘지배권을 잡다’
  rationale: 이 대목은 추상적 직위보다 실제 지배의 점유를 말하므로, 한국어에서도 권력 행사성을 살린 표현이 본문 의도를 더 잘 전달합니다.
  doctrine_reference: 본문 주석적 선택; 별도의 교리 쟁점 없음
