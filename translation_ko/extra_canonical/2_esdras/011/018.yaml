revisions:
- from: 당신의 시간을 차지할 것이지만, 그것의 절반도 되지 않을 것입니다. 그러고 나서 셋째가 일어나, 앞선 이들이 그랬던 것처럼 통치를 장악하였고, 그리고 사라졌습니다.[a]
  to: 네 기간을 차지하겠지만, 그 절반에도 미치지 못할 것입니다. 그 뒤에 셋째가 일어나 앞선 이들이 그랬던 것처럼 통치권을 가졌고, 사라졌습니다. 그리고—
  rationale: 기간을 뜻하는 tempus를 자연스러운 ‘기간’으로 옮기고, principatum에 ‘장악’이라는 과도한 함의를 부여하지 않았습니다. 원문 마지막의 et는 다음 절로 문장이 계속되는 불완전한 연결이므로 대시로 표시했습니다. 현 절에 없는 ‘그 역시’를 포함한 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:30Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 tempus tuum은 문맥상 상대의 기간을 가리키므로 ‘당신의 시간’보다 ‘네 기간’이 자연스럽습니다. tenebit의 점유 의미와 sed nec dimidium eius의 강한 대조는 유지하되, ‘그 절반에도 미치지 못하다’로 한국어답게 옮겼습니다. et non apparuit는 문맥상 ‘사라졌다’로 번역할 수 있습니다. 원문이 접속사 et로 끝나므로, 한국어도 뒤 문장으로 이어짐을 나타내는 대시로 보존했습니다.
  naturalness: ‘당신의 시간’은 현대 표준 한국어 성경 문체에서 어색하고, ‘시간을 차지하다’도 다소 부자연스럽습니다. ‘네 기간을 차지하다’와 ‘통치권을 가졌다’가 더 자연스럽고 원문의 진술 강도를 과장하지 않습니다.
  terminology: principatum은 ‘통치’ 자체를 ‘장악했다’기보다 ‘통치권을 가졌다/유지했다’라는 뜻이므로 ‘통치권을 가졌습니다’로 조정했습니다. 기존 각주는 현 라틴어 본문 범위를 넘어 다음 절의 ipsa(‘그 역시’)를 포함하므로 삭제해야 합니다.
  issues:
  - severity: medium
    issue: ‘당신의 시간을 차지할 것’이라는 표현
    rationale: tempus tuum은 여기서 기간을 뜻하며, 한국어에서는 ‘네 기간’이 더 자연스럽습니다. ‘당신’은 본문 내 신적 존칭이나 낯선 상대에 대한 존칭으로 오해될 수 있습니다.
  - severity: medium
    issue: ‘통치를 장악하였고’
    rationale: tenuit principatum은 통치권을 보유했다는 뜻이지 권력을 탈취했다는 뜻을 명시하지 않습니다. ‘장악하다’는 원문에 없는 탈취·강압의 뉘앙스를 더합니다.
  - severity: high
    issue: 각주가 현 절의 라틴어 본문 범위를 벗어남
    rationale: 각주의 ‘그 역시’는 현 절에 없는 ipsa에 근거한 표현이며, 이는 다음 절의 어휘입니다. 현 절의 대안 번역으로 남길 수 없습니다.
  revised_text: 네 기간을 차지하겠지만, 그 절반에도 미치지 못할 것입니다. 그 뒤에 셋째가 일어나 앞선 이들이 그랬던 것처럼 통치권을 가졌고, 사라졌습니다. 그리고—
