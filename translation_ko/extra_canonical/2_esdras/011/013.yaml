id: 2ES.11.13
reference: 2 Esdras 11:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum regnaret et uenit ei finis et non apparuit, ita ut non appareret locus eius; et sequens exsurrexit et regnauit et ipsa multum tenuit tempus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/013.yaml
  text: And it happened that when it reigned, its end came and it did not appear, so that its place did not appear; then the next rose up and reigned, and it held power for a long time.
translation:
  language: ko
  text: 그것이 다스릴 때에 그 끝이 이르렀고, 그것은 나타나지 않았습니다. 그리하여 그 자리도 나타나지 않았습니다. 그 다음 것이 일어나 다스렸고, 그것은 오랫동안 권세를 유지했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnaret / regnauit
  english_pob_choice: reigned / reigned
  chosen_korean: 다스리다 / 다스렸습니다
  alternatives_korean:
  - 군림하다
  - 통치하다
  lexicon: regnare
  rationale: 라틴어의 왕권 행사와 지속성을 살리기 위해 중립적이고 서술적인 ‘다스리다’를 사용했습니다.
- source_word: non apparuit, ita ut non appareret locus eius
  english_pob_choice: it did not appear, so that its place did not appear
  chosen_korean: 나타나지 않았으며, 그래서 그 자리도 나타나지 않았습니다
  alternatives_korean:
  - 보이지 않았으며, 그래서 그 자리도 보이지 않았습니다
  - 사라져서 그 자리를 알 수 없었습니다
  lexicon: apparere
  rationale: POB의 수정본이 강조한 대로 ‘보이다/보이지 않다’보다 원문에 더 직접적인 ‘나타나다/나타나지 않다’를 택해, 존재의 소멸과 그 자취의 비가시성을 함께 살렸습니다.
- source_word: sequens exsurrexit
  english_pob_choice: then the next rose up
  chosen_korean: 그다음 것은 일어나
  alternatives_korean:
  - 그 뒤의 것이 일어나
  - 이어지는 것이 일어나
  lexicon: sequens / exsurgo
  rationale: sequens을 단순한 시간 순서의 ‘그다음 것’으로 옮기고, exsurrexit의 상승·등장을 살려 ‘일어나’로 번역했습니다.
- source_word: multum tenuit tempus
  english_pob_choice: it held power for a long time
  chosen_korean: 매우 오랫동안 권세를 잡았습니다
  alternatives_korean:
  - 오랫동안 다스렸습니다
  - 긴 시간을 유지했습니다
  lexicon: tenere tempus
  rationale: tenuit tempus의 지속 기간을 ‘권세를 잡다’로 풀어, 단순한 시간 경과가 아니라 통치 지속을 드러냈습니다.
theological_decisions:
- issue: 왕권의 반복과 소멸을 어떻게 표현할지
  chosen_reading: 개별 왕국의 종말과 다음 왕국의 즉위가 연속되는 묵시적 역사 전개로 읽고, 판단을 덧붙이지 않고 서술만 유지했습니다.
  alternative_readings:
  - 상징적 제국들의 흥망으로 해석
  - 특정 역사 사건의 직접 예언으로 해석
  rationale: 이 절은 해석보다 서술이 우선이므로, 원문의 연속 동작과 소멸/등장을 그대로 보여 주는 데 집중했습니다.
  doctrine_reference: 묵시문학 서술의 절제된 번역 원칙
