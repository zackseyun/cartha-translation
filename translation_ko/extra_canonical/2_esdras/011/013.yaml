revisions:
- from: 그것이 다스릴 때에 그 끝이 오고, 그것은 나타나지 않았으며, 그래서 그 자리도 나타나지 않았습니다. 그다음 것은 일어나 다스렸고, 그것은 매우 오랫동안 권세를 잡았습니다.[a]
  to: 그것이 다스릴 때에 그 끝이 이르렀고, 그것은 나타나지 않았습니다. 그리하여 그 자리도 나타나지 않았습니다. 그 다음 것이 일어나 다스렸고, 그것은 오랫동안 권세를 유지했습니다.
  rationale: 원문의 apparuit 반복은 그대로 보존하고, 장소에 관해 원문 이상을 말하는 각주는 삭제했습니다. 마지막 절은 ‘권세를 잡다’를 ‘권세를 유지하다’로 고쳐 긴 기간의 지속을 명확히 했습니다.
