  yaml_path: translation/extra_canonical/2_esdras/011/017.yaml
  text: 'I announce this to you before you begin to disappear: after you, no one will hold it for as long, not even half as long.”'
translation:
  language: ko
  text: 이것을 네가 시작하기 전에 내가 미리 알립니다. 네 뒤에는 아무도 그것을 이만큼 오래는, 반만큼도 붙들지 못할 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 non parere는 직역하면 ‘드러나지 않다/순종하지 않다’ 계열의 표현이지만, 이 문맥에서는 영어 POB의 정리처럼 ‘사라지다/붙들리지 않다’의 의미로 이해해 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: hoc annuntio
  english_pob_choice: I announce this to you
  chosen_korean: 이것을 내가 미리 알립니다
  alternatives_korean:
  - 이것을 알립니다
  - 이것을 미리 고합니다
  - 이것을 네게 알립니다
  lexicon: annuntio
  rationale: 라틴어 annuntio는 단순한 말이 아니라 ‘미리 알리다/선포하다’의 공적 통지를 내포하므로, 문맥상 담화의 시작을 살려 ‘미리 알립니다’로 옮겼습니다.
- source_word: antequam incipias
  english_pob_choice: before you begin
  chosen_korean: 네가 시작하기 전에
  alternatives_korean:
  - 네가 시작하기 앞서
  - 네가 시작하기 전에
  lexicon: antequam + incipias
  rationale: 행위의 선행 시점을 분명히 드러내는 표현으로, 한국어에서는 자연스러운 시간 부사절로 처리했습니다.
- source_word: non parere
  english_pob_choice: to disappear
  chosen_korean: 붙들지 못할 것입니다
  alternatives_korean:
  - 사라지지 않을 것입니다
  - 나타나지 않을 것입니다
  - 붙들 수 없을 것입니다
  lexicon: non parere
  rationale: 라틴어 본문은 문자적으로는 ‘드러나지 않다/순종하지 않다’ 범주와도 겹치지만, 영어 POB의 audit trail이 ‘disappear’로 정리한 흐름을 반영해 ‘붙들다’ 대립구조를 살려 소멸·유실의 의미로 옮겼습니다.
- source_word: Nemo post te
  english_pob_choice: after you, no one
  chosen_korean: 네 뒤에는 아무도
  alternatives_korean:
  - 네 뒤에 아무도
  - 너 다음에는 아무도
  lexicon: Nemo post te
  rationale: nemo post te는 뒤를 잇는 사람의 부재를 말하므로, 한국어에서도 순서를 분명히 하는 ‘네 뒤에는 아무도’로 처리했습니다.
theological_decisions:
- issue: 시간 지속의 비교 표현
  chosen_reading: 그것을 이만큼 오래는, 반만큼도 붙들지 못할 것입니다
  alternative_readings:
  - 그것을 오래 붙들지 못할 것입니다
  - 그것을 반의반도 붙들지 못할 것입니다
  rationale: 본문과 영어 POB는 후계자가 앞사람의 지속을 따라잡지 못한다는 비교를 말하므로, 비교의 핵심인 지속 기간과 ‘반만큼도’라는 절반 이하의 한계를 함께 드러냈습니다.
  doctrine_reference: 문맥상 왕권/지속성의 상대적 쇠퇴를 말하는 수사적 비교
