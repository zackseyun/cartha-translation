id: 2ES.11.3
reference: 2 Esdras 11:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et de pennis eius nascebantur contrariae pennae, et ipsae fiebant in pennaculis minutis et modicis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/003.yaml
  text: And I looked[a], and from its wings there grew opposite wings, and these became little pinions, small and slight.
  footnotes:
  - marker: a
    text: Or 'from its feathers there grew opposing wings'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 바라보니, 그 날개들에서 서로 반대되는 날개들이 나왔고, 그것들도 작고 보잘것없는 작은 깃날들이 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 깃털들에서 서로 반대되는 날개들이 나왔다’.
    reason: previous_rendering
lexical_decisions:
- source_word: Et uidi
  english_pob_choice: And I looked
  chosen_korean: 내가 바라보니
  alternatives_korean:
  - 내가 보았고
  - 내가 보니
  lexicon: vidi
  rationale: 환상 묘사의 관찰 행위를 자연스럽게 드러내면서, 단순 과거보다 시각적 체험의 즉시성을 살렸습니다.
- source_word: de pennis eius
  english_pob_choice: from its wings
  chosen_korean: 그 날개들에서
  alternatives_korean:
  - 그 깃털들에서
  - 그 날개에서
  lexicon: penna
  rationale: POB의 개정 판단을 따라 penna를 여기서는 일관되게 ‘날개’로 보아, 이후 절들에서의 동일 어휘 사용과 맞췄습니다.
- source_word: contrariae pennae
  english_pob_choice: opposite wings
  chosen_korean: 서로 반대되는 날개들
  alternatives_korean:
  - 대립하는 날개들
  - 맞서는 날개들
  lexicon: contrarius
  rationale: 단순한 물리적 위치 반대가 아니라 본문이 의도하는 환상 속 대치 관계를 드러내기 위해 ‘서로 반대되는’으로 옮겼습니다.
- source_word: pennaculis minutis et modicis
  english_pob_choice: little pinions, small and slight
  chosen_korean: 작고 보잘것없는 작은 깃날들
  alternatives_korean:
  - 작고 여린 작은 날개들
  - 작고 미미한 작은 깃날들
  lexicon: pennaculum / minutus / modestus
  rationale: pennaculis를 ‘깃날들’로 옮겨 작은 날개/깃의 축소형 이미지를 살리고, minutis et modicis의 중첩된 축소 뉘앙스를 ‘작고 보잘것없는’으로 반영했습니다.
theological_decisions:
- issue: 환상적 동물 해부 묘사의 직역 범위
  chosen_reading: 본문의 기괴한 비유 구조를 완화하지 않고, ‘날개들’과 ‘깃날들’의 반복을 통해 시각적 충격을 유지했습니다.
  alternative_readings:
  - 보다 자연스러운 의역으로 풀어 쓰기
  - ‘깃털’ 중심으로 바꾸어 생김새를 완화하기
  rationale: 이 절은 예언-환상 문맥의 세부 묘사가 핵심이므로, 의미를 희석하지 않고 원문의 이상한 이미지 자체를 독자가 느끼도록 하는 편이 소스 충실성에 부합합니다.
  doctrine_reference: 2 Esdras 11장의 환상 해석 전 단계
