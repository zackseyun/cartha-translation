  revision_rationale: 원문의 생성 동사와 contrariae의 해석상 여지를 더 충실히 반영하고, 한국어 지시 관계를 명료하게 했습니다. 날개와 그 축소형의 반복은 환상 묘사의 낯선 이미지를 보존하기 위해 유지했습니다.
