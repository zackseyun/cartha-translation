  yaml_path: translation/extra_canonical/2_esdras/011/001.yaml
  text: And it happened on the second night that I saw a dream, and behold, an eagle was coming up from the sea, and it had twelve feathered wings and three heads.
translation:
  language: ko
  text: 그리고 둘째 밤에 이런 일이 있었습니다. 내가 꿈을 꾸었는데, 보니 한 마리의 독수리가 바다에서 올라오고 있었고, 그 독수리는 깃털 달린 날개 열두 개와 머리 세 개를 가지고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 ecce는 놀람과 주의를 끄는 감탄사로, 본문에서는 ‘보니’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: secunda nocte
  english_pob_choice: on the second night
  chosen_korean: 둘째 밤에
  alternatives_korean:
  - 두 번째 밤에
  - 이틀째 밤에
  lexicon: Latin nocte
  rationale: 시간 표현을 자연스럽게 옮기되, 원문의 사건 배열을 유지하기 위해 간결한 서술형으로 처리했습니다.
- source_word: uidi somnium
  english_pob_choice: I saw a dream
  chosen_korean: 내가 꿈을 보았는데
  alternatives_korean:
  - 내가 꿈을 꾸었는데
  - 꿈을 보았고
  lexicon: Latin uidi somnium
  rationale: 라틴어의 직접적 ‘보다’ 동사를 살려 환시/꿈 체험의 서술감을 유지했습니다.
- source_word: ecce ascendebat de mari aquila
  english_pob_choice: behold, an eagle was coming up from the sea
  chosen_korean: 보니 독수리 하나가 바다에서 올라오고 있었고
  alternatives_korean:
  - 보라, 독수리 하나가 바다에서 올라오고 있었고
  - 보니 독수리 한 마리가 바다에서 올라오고 있었고
  lexicon: Latin ecce / ascendebat / de mari / aquila
  rationale: ecce의 감탄·주의 환기 기능을 ‘보니’로 살리고, 지속 동작 ascendebat은 ‘올라오고 있었고’로 옮겼습니다.
- source_word: duodecim alae pennarum et capita tria
  english_pob_choice: twelve feathered wings and three heads
  chosen_korean: 깃털 달린 날개 열둘과 머리 셋
  alternatives_korean:
  - 열두 개의 깃털 달린 날개와 세 머리
  - 깃털 있는 날개 열둘과 머리 셋
  lexicon: Latin duodecim alae pennarum et capita tria
  rationale: 수량과 병렬 구조를 선명하게 유지하면서, ‘깃털 달린’으로 pennarum의 형용적 수식을 반영했습니다.
theological_decisions:
- issue: 환상/상징 서술의 직역 정도
  chosen_reading: 원문의 환시적·묘사적 어조를 유지해 해석을 덧씌우지 않고 상징 이미지를 그대로 제시했습니다.
  alternative_readings:
  - 상징적으로 의미를 풀어쓴 번역
  - 독수리의 의미를 미리 설명하는 번역
  rationale: 이 절은 해석보다 장면 제시에 목적이 있으므로, 이후 문맥에서 해석될 상징을 미리 규정하지 않았습니다.
  doctrine_reference: apocalyptic narrative transparency
