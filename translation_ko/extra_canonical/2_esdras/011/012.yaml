  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et uidi et ecce a dextera parte surrexit una penna et regnauit super omnem terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/012.yaml
  text: And I looked, and behold, on the right side one wing rose up and reigned over all the earth.
translation:
  language: ko
  text: 그리고 내가 보았더니, 보십시오, 오른쪽에서 한 날개가 일어나 온 땅을 다스렸습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi
  english_pob_choice: And I looked
  chosen_korean: 그러자 내가 보았는데
  alternatives_korean:
  - 내가 보았고
  - 내가 보았습니다
  lexicon: vidi
  rationale: 시각적 환상을 이어 주는 서술로서 단순 과거보다 장면 전환을 드러내는 연결어를 넣어, 다음 비전의 출현을 자연스럽게 받도록 했습니다.
- source_word: ecce
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 보십시오,
  lexicon: ecce
  rationale: 독자/청자를 환기하는 감탄·주의 환기 표현이므로, 현대 합쇼체에서 직접적인 주의 환기형인 ‘보십시오’로 옮겼습니다.
- source_word: a dextera parte
  english_pob_choice: on the right side
  chosen_korean: 오른쪽에서
  alternatives_korean:
  - 오른편에서
  - 오른쪽 편에서
  lexicon: dextera parte
  rationale: 위치 표현은 간결하게 처리하되, 본문의 대비 구조를 해치지 않도록 ‘오른쪽에서’로 자연스럽게 옮겼습니다.
- source_word: una penna
  english_pob_choice: one wing
  chosen_korean: 하나의 날개
  alternatives_korean:
  - 한 날개
  - 하나의 깃
  - 한 깃
  lexicon: penna
  rationale: 라틴어 penna의 기본 의미를 따라 ‘날개’를 유지했고, 수사적 강조를 반영하기 위해 수사를 명시했습니다.
- source_word: regnauit super omnem terram
  english_pob_choice: reigned over all the earth
  chosen_korean: 온 땅을 다스렸습니다
  alternatives_korean:
  - 온 땅을 통치했습니다
  - 온 땅 위에 군림했습니다
  lexicon: regnauit
  rationale: regnare의 지배·통치 의미를 살리되, 한국어에서 과도하게 절대군주적 뉘앙스를 강하게 만드는 ‘군림’은 피하고 서술적으로 ‘다스렸습니다’로 옮겼습니다.
theological_decisions:
- issue: 상징적 비전 언어의 직역성
  chosen_reading: ‘날개’와 ‘다스렸습니다’를 그대로 살려, 환상 속 상징의 비범함을 해설 없이 제시했습니다.
  alternative_readings:
  - 상징성을 풀어 ‘힘’이나 ‘세력’으로 의역함
  - ‘군림했습니다’처럼 정치적 억양을 강화함
  rationale: 본문은 상징을 설명하기보다 보여 주는 방식이므로, 독자가 원문이 지닌 비전의 난해함과 긴장을 그대로 접하도록 했습니다.
  doctrine_reference: Apocalyptic literal-symbolic balance
