  source_fidelity: 본문의 ‘뒤따르는 날개들도’는 et ipsae의 첨가·포괄 뉘앙스를 적절히 반영하며, ‘때가 되자’와 오른쪽이라는 위치 표지도 충실합니다. 다만 ex his erant quae tenebant의 tenebant는 앞의 목적어 principatum을 이어받아 ‘통치권을 행사하다/유지하다’라는 뜻이지, 지배권이라는 물건을 ‘붙잡다’라는 뜻은 아닙니다.
