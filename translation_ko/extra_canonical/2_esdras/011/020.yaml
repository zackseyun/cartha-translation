  text: gerere et iterum nusquam conparere. Et uidi et ecce in tempore sequentes pennae erigebantur et ipsae a dextera parte, ut tenerent principatum; et ex his erant quae tenebant, sed
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/020.yaml
  text: And I looked[a], and behold, in due time the following wings also rose up on the right side, to hold rule; and among them were some that held it, but
  footnotes:
  - marker: a
    text: Or 'the following wings were rising up on the right side'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 보았습니다. 보라, 때가 되자 뒤따르는 날개들도 오른쪽에서 솟아올라 지배권을 잡으려고 하였으며, 그들 가운데는 그것을 붙잡는 것들도 있었지만[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “뒤따르는 날개들이 오른쪽에서 솟아오르고 있었습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: Et uidi et ecce
  english_pob_choice: And I looked, and behold
  chosen_korean: 그리고 나는 보았습니다. 보라
  alternatives_korean:
  - 그리고 나는 보았습니다
  - 내가 보니 보십시오
  lexicon: vidi / ecce
  rationale: 시각적 확인을 나타내는 서술 동사와 경탄 도입을 살려, 예언적 장면 전환의 긴장을 유지했습니다.
- source_word: in tempore
  english_pob_choice: in due time
  chosen_korean: 때가 되자
  alternatives_korean:
  - 적절한 때에
  - 정해진 때에
  lexicon: in tempore
  rationale: 단순한 시간 경과보다 정해진 시점의 도래를 드러내는 표현으로 옮겼습니다.
- source_word: sequentes pennae ... erigebantur
  english_pob_choice: the following wings also rose up
  chosen_korean: 뒤따르는 날개들도 솟아올라
  alternatives_korean:
  - 뒤따르는 날개들도 일어나
  - 뒤따르는 날개들도 올라
  lexicon: sequentes pennae / erigebantur
  rationale: sequentes는 앞선 날개들을 잇는 ‘뒤따르는’이라는 순차성을, erigebantur은 반복되는 상승 동작을 자연스러운 한국어 동사 ‘솟아오르다’로 살렸습니다.
- source_word: ut tenerent principatum
  english_pob_choice: to hold rule
  chosen_korean: 지배권을 잡으려고 하였으며
  alternatives_korean:
  - 통치권을 잡으려고 하였으며
  - 주권을 가지려고 하였으며
  lexicon: principatus / tenere
  rationale: principatum은 단순한 ‘우위’보다 실제 지배를 뜻하므로 ‘지배권’으로 옮기고, 목적 구문은 의도를 드러내는 자연한 한국어로 처리했습니다.
theological_decisions:
- issue: the right side as a symbolic place of ascendancy
  chosen_reading: 오른쪽에서 솟아오른 것은 우세와 권세의 상징적 방향성을 드러내지만, 본문 자체가 그 의미를 설명하지는 않으므로 과잉 해석 없이 옮겼습니다.
  alternative_readings:
  - 오른편에서
  - 우편에서
  rationale: 상징 해석을 본문에 덧붙이지 않고, 방향 표지를 그대로 보존해야 장면의 상징성을 독자에게 열어 둡니다.
  doctrine_reference: apocalyptic imagery
- issue: ex his erant quae tenebant, sed
  chosen_reading: 그들 가운데는 그것을 붙잡는 것들도 있었지만
  alternative_readings:
  - 그들 중에는 그것을 지키는 것들도 있었지만
  - 그 가운데 그것을 쥐고 있던 자들도 있었지만
  rationale: 문장은 이어질 대비를 예고하는 미완성 구조이므로, 한국어에서도 종결을 열어 둔 채 미완의 느낌을 유지했습니다.
  doctrine_reference: textual discourse structure
