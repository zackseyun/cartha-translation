  source_fidelity: ‘potentatu’를 ‘권세로’로 반영한 점과 앞선 짐승들을 이겼다는 처리, 그리고 본문 훼손을 각주로 알린 점은 적절합니다. 다만 ‘큰 떨림 가운데’는 네 번째 짐승 자체가 떨고 있다는 뜻으로도 읽힐 수 있으며, ‘붙들고’는 여기서의 강압적 지배를 한국어로 충분히 자연스럽게 드러내지 못합니다. 말미의 라틴어는 현전 구절에서 불완전하지만, 영어 POB의 감사 추적을 따라 ‘오랫동안 … 속임수로 세상에 머물렀다’로 옮기되 본문 거침을 각주에서 밝혀야 합니다.
  naturalness: 현대 표준 한국어 합쇼체로는 ‘큰 떨림 가운데 … 시대를 붙들고’와 ‘거짓으로 … 거주했습니다’가 다소 직역투입니다. ‘큰 공포를 일으키며’, ‘시대를 지배하고’, ‘속임수로 … 세상에 머물렀습니다’가 의미를 보존하면서 자연스럽습니다.
  terminology: ‘권세’는 potentatus에 적합하며 신학적으로 과도하게 특정 해석을 부과하지 않습니다. labor pessimus는 이 문맥에서 ‘가장 심한 압제’로 유지할 수 있습니다. fraus는 단순한 명제의 ‘거짓’보다 행위적 의미를 살린 ‘속임수’가 더 적절합니다.
