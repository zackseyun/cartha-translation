  text: meorum ? Et quartus ueniens †deuicit† omnia animalia quae transierunt, et potentatu tenens saeculum cum tremore multo et omnem orbem cum labore pessimo, et †inhabitabant† tot
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/040.yaml
  text: And the fourth that came overcame all the beasts that had passed before[a], and held the age by its power with great trembling, and the whole world with most grievous oppression[b], and for so long inhabited the world with deceit.
  footnotes:
  - marker: a
    text: 'The Latin of this verse is textually rough in places. The draft follows the apparent sense: the fourth beast surpassed the earlier ones and held the age and the world in fear, oppression, and deceit.'
    reason: textual_variant
    anchor_ref: '11:40'
  - marker: b
    text: Or 'and held the age in great trembling, and the whole world in most grievous oppression'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 네 번째 것이 와서 앞서 지나간 모든 짐승을 이겼습니다[a]. 그것은 큰 공포를 일으키며 자기 권세로 시대를 지배하고, 가장 심한 압제로 온 세상을 지배했으며[b], 오랫동안 속임수로 세상에 머물렀습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 본문은 이 절의 몇몇 부분에서 불완전하거나 거칠게 전해집니다. 여기서는 문맥에 따라 네 번째 짐승이 앞선 짐승들을 능가하고, 공포와 압제와 속임수로 시대와 세상을 지배했다는 뜻으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 “큰 공포를 일으키며 시대를 지배하고, 가장 심한 압제로 온 세상을 지배했다.”
    reason: previous_rendering
lexical_decisions:
- source_word: potentatu tenens
  english_pob_choice: held the age by its power
  chosen_korean: 자기 권세로 시대를 붙들고
  alternatives_korean:
  - 권력으로 시대를 붙들고
  - 권세를 가지고 시대를 붙들고
  lexicon: potentatus → 권세/권력
  rationale: 영문 개정판이 생략한 potentatu를 반영해 ‘권세로’라고 옮겨, 지배 수단이 단순한 상태가 아니라 권력 행사임을 드러냈습니다.
- source_word: cum tremore multo
  english_pob_choice: with great trembling
  chosen_korean: 큰 떨림 가운데
  alternatives_korean:
  - 큰 떨림과 함께
  - 심한 떨림 가운데
  lexicon: tremor → 떨림
  rationale: 동반 의미의 cum을 자연스럽게 살리면서도, 문맥상 공포와 불안의 상태를 간결하게 표현했습니다.
- source_word: omnem orbem cum labore pessimo
  english_pob_choice: the whole world with most grievous oppression
  chosen_korean: 가장 심한 압제로 온 세상을 붙들었으며
  alternatives_korean:
  - 가장 참혹한 고통으로 온 세상을
  - 극심한 수고로 온 세상을
  lexicon: labor pessimus → 압제/고통
  rationale: labor가 단순한 ‘수고’보다 억압적·가혹한 통치를 가리키는 흐름이므로, POB의 의미에 맞게 ‘압제’로 옮겼습니다.
- source_word: inhabitabant ... cum fraude
  english_pob_choice: inhabited the world with deceit
  chosen_korean: 거짓으로 오랫동안 세상에 거주했습니다
  alternatives_korean:
  - 속임수로 세상에 살았습니다
  - 기만으로 세상에 머물렀습니다
  lexicon: fraus → 거짓/속임수
  rationale: 라틴 본문의 거친 형태를 따라 ‘거짓으로’와 ‘거주했습니다’를 함께 살려, 지속성과 기만의 성격을 모두 드러냈습니다.
theological_decisions:
- issue: 네 번째 짐승의 통치 묘사
  chosen_reading: 권세, 떨림, 압제, 거짓을 통해 시대와 세상을 장악한 폭력적 지배로 번역했습니다.
  alternative_readings:
  - 단순히 ‘힘으로 다스렸다’로 완화하는 번역
  - 상징성을 약화해 중립적으로 옮기는 번역
  rationale: 본절은 네 번째 짐승의 통치를 단순한 정치적 영향력이 아니라 공포와 억압, 기만을 동반한 파괴적 지배로 묘사하므로, 그 긴장을 유지했습니다.
  doctrine_reference: 묵시 문학의 제국 비판과 권세의 왜곡된 통치
