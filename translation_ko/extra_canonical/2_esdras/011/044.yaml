source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et respexit Altissimus super sua tempora, et ecce finita sunt et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/044.yaml
  text: And the Most High has looked upon his times, and behold, they have ended, and his ages are complete.
translation:
  language: ko
  text: 지극히 높으신 분께서 그의 때들을 살피셨습니다. 보십시오, 그것들은 끝났고 그의 시대들이 다 찼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 이
  lexicon: Altissimus
  rationale: 신적 호칭을 자연스러운 현대 한국어로 옮기되, 고유명칭화하지 않고 위엄을 유지하기 위해 ‘지극히 높으신 분’을 택했습니다.
- source_word: respexit
  english_pob_choice: has looked upon
  chosen_korean: 살피셨습니다
  alternatives_korean:
  - 굽어보셨습니다
  - 바라보셨습니다
  lexicon: respicere
  rationale: 단순한 시선보다 상황을 판별해 주목하셨다는 뜻이 드러나도록 ‘살피다’를 사용했습니다.
- source_word: tempora
  english_pob_choice: his times
  chosen_korean: 자기 시대
  alternatives_korean:
  - 그의 때
  - 그의 시간들
  lexicon: tempus
  rationale: 복수형의 시간/시대를 문맥에 맞게 역사적 ‘시대들’로 풀어, 이어지는 종말 진술과 연결되도록 했습니다.
- source_word: saecula eius conpleta sunt
  english_pob_choice: his ages are complete
  chosen_korean: 그 시대들은 다 채워졌습니다
  alternatives_korean:
  - 그의 세대들은 완성되었습니다
  - 그의 시대들은 끝났습니다
  lexicon: saeculum + complere
  rationale: saecula를 단순한 ‘세대’보다 더 넓은 역사적 ‘시대들’로 옮기고, conpleta sunt를 ‘다 채워졌다’로 옮겨 완료의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 종말 선언의 시제와 완료감
  chosen_reading: ‘끝났고… 다 채워졌습니다’로 현재적 결과를 드러내면서, 앞부분의 ‘살피셨습니다’와 함께 이미 완료된 하나님의 판결을 나타냈습니다.
  alternative_readings:
  - ‘끝났습니다’로 단순 종결만 표현
  - ‘끝나고 있습니다’로 진행성을 강조
  rationale: 라틴어 완료시제와 영어 POB의 ‘have ended / are complete’가 모두 이미 성취된 상태를 가리키므로, 완료된 종결을 분명히 하였습니다.
  doctrine_reference: 종말론적 완료 표현
- issue: ‘시대들’의 복수 유지
  chosen_reading: 복수형 ‘시대들’을 유지해 원문이 말하는 여러 시대/구간의 총체성을 보존했습니다.
  alternative_readings:
  - 단수 ‘시대’로 통합
  - ‘세대들’로 인간 집단 중심 해석
  rationale: saecula의 복수성을 지우지 않고, 역사 전체가 마감되었다는 강조를 살리기 위해 복수를 유지했습니다.
  doctrine_reference: 문맥상 역사-종말 서술
