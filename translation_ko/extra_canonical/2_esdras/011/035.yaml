    reason: source_note
lexical_decisions:
- source_word: deuorauit caput a dextera parte illud quod est a laeua
  english_pob_choice: The head on the right side devoured the one on the left.
  chosen_korean: “오른쪽에 있는 머리가 왼쪽에 있는 그것을 삼켜 버렸습니다.”
  alternatives_korean:
  - “오른편의 머리가 왼편의 그것을 먹어 치웠습니다.”
  - “오른쪽 머리가 왼쪽의 그것을 삼켰습니다.”
  lexicon: deuorare
  rationale: 라틴어 deuorauit는 단순한 '먹다'보다 '삼켜 버리다'의 강한 파괴성을 담으므로, 한국어에서도 완료·강조를 살려 옮겼습니다.
- source_word: Et audiui uocem dicentem mihi
  english_pob_choice: And I heard a voice saying to me
  chosen_korean: “그리고 제가 듣자니, 한 음성이 저에게 말했습니다.”
  alternatives_korean:
  - “그리고 저는 한 음성이 저에게 말하는 것을 들었습니다.”
  - “그리고 한 음성이 저에게 말하는 것을 들었습니다.”
  lexicon: audio / vox dicens
  rationale: 라틴어의 직접 청취와 발화가 이어지는 구조를 살려, 서술 흐름을 자연스럽게 유지하면서도 '음성'의 주체성을 분명히 했습니다.
- source_word: conspice contra te et con-
  english_pob_choice: Look before you, and—
  chosen_korean: 「당신 앞을 보십시오, 그리고—」
  alternatives_korean:
  - 「앞을 주의 깊게 보십시오, 그리고—」
  - 「당신 앞을 살펴보십시오, 그리고—」
  lexicon: conspice
  rationale: conspice는 시선을 돌려 '바라보다/살피다'의 명령이므로, POB의 'Look before you'를 반영하되 과잉 해석 없이 간명하게 옮겼습니다.
theological_decisions:
- issue: 본문의 미완결성
  chosen_reading: 마지막 절단된 형태를 그대로 보존하여, 말이 끊긴 상태를 한국어에서도 드러냈습니다.
  alternative_readings:
  - 문맥상 완성해 번역하기
  - 한국어 문장으로 매끈하게 마무리하기
  rationale: 라틴어가 'con-'에서 끊기며 미완결인 상태이므로, 이를 매끄럽게 보완하지 않고 단절을 그대로 남기는 것이 स्रोत에 더 충실합니다.
  doctrine_reference: source-critical transparency
