lexical_decisions:
- source_word: Et vidi et ecce
  english_pob_choice: Then I saw, and behold
  chosen_korean: 그러고 나서 내가 보니, 보아라
  alternatives_korean:
  - 그때 내가 보았습니다, 보십시오
  - 그런데 내가 보니, 보라
  lexicon: 보아라
  rationale: 라틴어의 연속 동작과 감탄 표지를 자연스럽게 살리되, 환상 묘사의 긴박감을 유지하도록 ‘그러고 나서 내가 보니’와 ‘보아라’를 사용했습니다.
- source_word: sicut leo
  english_pob_choice: something like a lion
  chosen_korean: 사자 같은 것이
  alternatives_korean:
  - 사자처럼 보이는 것
  - 사자 비슷한 것이
  lexicon: 사자
  rationale: 비교의 관계를 직접 드러내기 위해 ‘~같은 것’으로 옮겼고, 실체를 단정하지 않는 원문의 유보를 보존했습니다.
- source_word: suscitatus de silua
  english_pob_choice: roused from the forest
  chosen_korean: 숲에서 일어난
  alternatives_korean:
  - 숲에서 일어나게 된
  - 숲에서 깨어난
  lexicon: 일어나다
  rationale: 수동적 ‘suscitatus’의 기동/각성을 살리면서도, 출처의 ‘de silva’를 ‘숲에서’로 직역하여 장면성을 유지했습니다.
theological_decisions:
- issue: 환상 속 표상(사자)과 서술자의 인식 거리
  chosen_reading: ‘사자 같은 것’으로 번역해, 실제 사자라고 단정하지 않고 유사성을 유지했습니다.
  alternative_readings:
