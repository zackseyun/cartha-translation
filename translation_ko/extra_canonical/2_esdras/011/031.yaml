lexical_decisions:
- source_word: comedit
  english_pob_choice: it devoured
  chosen_korean: 삼켜 버렸습니다
  alternatives_korean:
  - 먹어 버렸습니다
  - 삼켰습니다
  lexicon: comedere
  rationale: 라틴어 완료형은 단순한 ‘먹다’보다 강한 소멸·포식의 뉘앙스를 지니므로, POB의 ‘devoured’를 살려 ‘삼켜 버렸습니다’로 옮겼습니다.
- source_word: duas subalares
  english_pob_choice: the two under-wings
  chosen_korean: 두 날개 아래편을
  alternatives_korean:
  - 두 아래날개를
  - 두 날개 밑부분을
  lexicon: subalaris
  rationale: subalares는 문자적으로 ‘날개 아래의 것들/부분들’이므로, 본문 이미지가 유지되도록 직역하되 한국어로 자연스러운 ‘날개 아래편’으로 처리했습니다.
- source_word: regnare
  english_pob_choice: planning to reign
  chosen_korean: 왕이 되려던
  alternatives_korean:
  - 통치하려던
  - 다스리려던
  lexicon: regnare
  rationale: regnare는 단순한 지배보다 왕권 행사와 연관되므로, 왕권 지향을 드러내는 ‘왕이 되려던’이 가장 직접적입니다.
