  terminology: iudicasti는 이 고발 문맥에서 ‘판단하셨습니다’로 유지할 수 있습니다. ‘진실하게’는 영어의 with truth 및 라틴어 문맥의 정직·진실성의 대조를 자연스럽게 표현하며, ‘진리’보다 적절합니다.
