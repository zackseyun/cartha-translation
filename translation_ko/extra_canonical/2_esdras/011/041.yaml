  text: 또한 당신은 땅을 진실하게 판단하지 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et iudicasti
  english_pob_choice: And you judged
  chosen_korean: 그리고 당신은 … 판단하셨습니다
  alternatives_korean:
  - 그리고 당신은 … 재판하셨습니다
  - 그리고 당신은 … 심판하셨습니다
  lexicon: iudico
  rationale: 라틴어 iudicasti는 문맥상 ‘판단하다/심판하다’의 뜻이지만, 영어 POB의 judged를 따라 한국어에서는 자연스러운 ‘판단하셨습니다’를 택했습니다.
- source_word: terram
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 땅 위
  - 세상
  - 온 땅
  lexicon: terra
  rationale: terra는 문자적으로 ‘땅’이며, 이 절의 짧은 진술에서는 관용적으로 확장된 ‘세상’보다 직접적인 ‘땅’이 원문에 가깝습니다.
- source_word: non cum dolo
  english_pob_choice: not with truth
  chosen_korean: 진리 없이
  alternatives_korean:
  - 진실 없이
  - 속임수로
  - 정직하지 않게
  lexicon: dolo
  rationale: 원문 말미의 dolo는 문자적으로 ‘속임수/간계’에 가깝지만, 제공된 영어 POB가 ‘not with truth’로 옮긴 해석을 반영해 한국어도 그 대비를 살려 ‘진리 없이’로 옮겼습니다.
theological_decisions:
- issue: dolo의 의미를 영어 POB의 ‘truth’ 대비로 어떻게 처리할지
  chosen_reading: ‘진리 없이’로 옮겨, 판단의 기준이 진실·공의에 있지 않았음을 드러냈습니다.
  alternative_readings:
  - ‘속임수로’
  - ‘간계로’
  - ‘정직하지 않게’
  rationale: 라틴어 원문만 따르면 ‘속임수’가 강하지만, 현재 영어 POB의 확정본이 ‘not with truth’이므로 본문 대비를 유지하는 쪽이 더 일관됩니다.
  doctrine_reference: source-text coherence / audit-trail fidelity
