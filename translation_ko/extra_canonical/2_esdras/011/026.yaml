source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: cogitabant se erigere et tenere principatus. Et uidi et ecce una erecta est, sed statim non conparuit ; Et secunda, et haec
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/026.yaml
  text: And I looked, and behold, one rose up, but immediately disappeared; then the second, and this one also
translation:
  language: ko
  text: 그리고 내가 보았습니다. 보십시오, 하나가 일어났으나 곧 사라졌습니다. 그리고 둘째가, 이 둘째도…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi et ecce
  english_pob_choice: And I looked, and behold
  chosen_korean: 나는 바라보았습니다. 보십시오
  alternatives_korean:
  - 그리고 나는 보았습니다. 보십시오
  - 내가 보니, 보십시오
  lexicon: 보다; ecce 감탄구
  rationale: 서술자의 시각적 전환을 살리기 위해 ‘바라보았습니다’로 자연스럽게 옮기고, ecce는 장면 전환의 주목 표지로 ‘보십시오’로 처리했습니다.
- source_word: una erecta est
  english_pob_choice: one rose up
  chosen_korean: 하나가 일어났지만
  alternatives_korean:
  - 하나가 솟아올랐지만
  - 하나가 세워졌지만
  lexicon: erigere; 일어나다
  rationale: 라틴어 erecta est의 이미지가 ‘일어남/세워짐’ 둘 다 가능하지만, 한국어에서는 인물·권세의 출현을 가장 자연스럽게 드러내는 ‘일어나다’를 택했습니다.
- source_word: statim non conparuit
  english_pob_choice: immediately disappeared
  chosen_korean: 곧바로 사라졌습니다
  alternatives_korean:
  - 즉시 보이지 않았습니다
  - 바로 없어졌습니다
  lexicon: conparere; 사라지다
  rationale: conparuit의 ‘나타나다/보이다’에 대응하여, 앞뒤 문맥상 반대 방향인 ‘사라지다’로 뜻을 드러내되 부가 설명 없이 간결하게 옮겼습니다.
- source_word: Et secunda, et haec
  english_pob_choice: then the second, and this one also
  chosen_korean: 그다음 둘째가 일어났고, 이 둘째도…
  alternatives_korean:
  - 그리고 둘째가, 이 둘째도…
  - 그 뒤 두 번째가 나타났고, 이 또한…
  lexicon: secunda; 두 번째
  rationale: 현존 라틴 본문이 ‘et haec’에서 끊기는 점을 반영해, 한국어도 미완결을 유지하도록 끝을 생략 부호로 열어 두었습니다.
theological_decisions:
- issue: 현존 본문의 미완결성
  chosen_reading: 마지막 절반은 의도적으로 미완결로 두어, extant Latin이 끊기는 상태를 한국어에서도 그대로 드러냈습니다.
  alternative_readings:
  - 의미를 보완해 완결형으로 마무리하기
  - 번역자가 추정하여 문장을 덧붙이기
  rationale: 이 구절은 보존된 라틴어가 ‘et haec’에서 끝나므로, 번역이 원문보다 더 많은 정보를 제공하지 않도록 절단감을 유지하는 것이 가장 충실합니다.
  doctrine_reference: source criticism / textual integrity
