  source_fidelity: 앞부분의 ‘하나가 일어났으나 곧 사라졌다’는 라틴어 una erecta est, sed statim non conparuit에 충실합니다. 그러나 현존 라틴어의 절단 지점은 ‘Et secunda, et haec’이며, 둘째에 관해 다시 ‘일어났다’고 말하지 않습니다. 초안의 ‘둘째가 일어났고’는 원문에 없는 서술을 보탭니다.
  naturalness: ‘나는 바라보았습니다. 보십시오’도 이해되지만, 환상 서술의 전환으로는 ‘그리고 내가 보았습니다. 보십시오’가 더 자연스럽고 원문의 접속을 보존합니다. 미완결 문장은 한국어에서도 문장부호로 명확히 남길 수 있습니다.
  terminology: ‘일어났으나’, ‘사라졌습니다’, ‘둘째’는 현대의 격식 있는 합쇼체에 적절하며, 본문의 상징 대상에 대한 해석을 덧붙이지 않습니다.
