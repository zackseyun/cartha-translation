base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/033.yaml
  text: And after this I looked[a], and behold, the middle head suddenly disappeared, just as the wings had done.
  footnotes:
  - marker: a
    text: Or 'and this happened as with the wings.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 뒤에 내가 보니, 가운데 머리가 갑자기 사라졌습니다. 날개들이 사라진 것과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘그리고 이것은 날개들과 같았다’입니다. 라틴어는 ‘사라지다’라는 동사를 생략합니다.
    reason: 라틴어 타원 표현을 밝혀, 본문의 ‘날개들이 사라진 것’이라는 보충 번역을 뒷받침합니다.
lexical_decisions:
- source_word: medium caput
  english_pob_choice: the middle head
  chosen_korean: 중간 머리
  alternatives_korean:
  - 가운데 머리
  - 중앙 머리
  lexicon: caput
  rationale: 라틴어 caput를 문맥상 짐승의 ‘머리’로 보되, medium은 위치 관계를 드러내는 ‘중간’으로 옮겨 원문의 서술을 직접 보존했습니다.
- source_word: subito non conparuit
  english_pob_choice: suddenly disappeared
  chosen_korean: 갑자기 사라졌습니다
  alternatives_korean:
  - 홀연히 사라졌습니다
  - 갑자기 보이지 않았습니다
  lexicon: conparere
  rationale: non conparuit는 ‘나타나지 않다/보이지 않다’지만, 영어 POB의 audit trail처럼 앞의 장면 흐름에서는 ‘사라졌다/없어졌다’가 자연스러워 같은 효과를 살렸습니다.
- source_word: et hoc sicut alae
  english_pob_choice: just as the wings had done
  chosen_korean: 그것은 날개들이 했던 것과 같았습니다
  alternatives_korean:
  - 그것은 날개들과 같이 되었습니다
  - 날개들이 한 것처럼 그도 그랬습니다
  lexicon: sicut
  rationale: et hoc sicut alae는 생략된 동사를 보충해야 하는 구조이므로, 영어 감사본의 해석을 따라 ‘날개들이 했던 것과 같았습니다’로 엘립시스를 드러냈습니다.
theological_decisions:
- issue: 계시 환상 서술의 번역 방식
  chosen_reading: 사건의 비유적·상징적 묘사를 과장 없이 그대로 옮겨, 환상 장면의 연속성을 유지했습니다.
  alternative_readings:
  - 상징적으로 풀어 설명하기
  - 문학적으로 의역해 장면감을 강화하기
  rationale: 이 구절은 해석보다 관찰 보고에 가까우므로, 원문이 말하는 ‘갑작스러운 소멸’과 ‘날개들과의 동일한 방식’을 간명하게 유지하는 것이 적절합니다.
  doctrine_reference: 성경 본문의 서술 충실성
