lexical_decisions:
- source_word: sed non tenebant principatum
  english_pob_choice: but did not hold the rule
  chosen_korean: 그러나 그들은 통치권을 잡지 못했습니다
  alternatives_korean:
  - 그러나 그들은 권세를 잡지 못했습니다
  - 그러나 그들은 다스림을 유지하지 못했습니다
  lexicon: tenere; principatus
  rationale: tenebant principatum은 단순히 ‘규칙’을 말하기보다 지배·통치의 지위를 가리키므로, ‘통치권을 잡다’로 옮겨 권력의 보유 실패를 드러냈습니다.
- source_word: Et uidi post haec
  english_pob_choice: And after this I looked
  chosen_korean: 그 뒤에 내가 보니
  alternatives_korean:
  - 그리고 이 일 후에 내가 보니
  - 그 후에 내가 보았는데
  lexicon: videre; post haec
  rationale: 직접적인 시각 동작과 순차적 전환을 살려, 합쇼체 서술에 자연스러운 ‘그 뒤에 내가 보니’로 옮겼습니다.
- source_word: ecce
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: ecce
  rationale: 화자의 주의를 환기하는 감탄사적 용법이므로, 현대 한국어에서 가장 자연스럽고도 경외감이 살아 있는 ‘보십시오’를 택했습니다.
- source_word: non
  english_pob_choice: not
  chosen_korean: …
  alternatives_korean:
  - 아니었습니다
  - 아니
  lexicon: non
  rationale: 제시된 라틴 본문이 여기서 끊겨 있어, 끝의 non은 다음 문장으로 이어질 미완성 신호로 보고 본문에는 생략 표기만 두었습니다.
theological_decisions:
- issue: principatum의 정치·통치적 뉘앙스
  chosen_reading: ‘통치권’으로 번역해 권력과 지배의 상실을 분명히 했습니다.
  alternative_readings:
  - ‘권세’로 순화
  - ‘우두머리 지위’로 의역
  rationale: 이 절은 추상적 질서보다 실제 통치의 보유 여부를 말하므로, 독자가 본문의 권력적 대비를 놓치지 않도록 했습니다.
  doctrine_reference: 본문 맥락 해석
