  to: 그 머리는 온 땅을 지배했고, 그 땅에 사는 이들을 심한 압제로 다스렸으며, 전에 있던 모든 날개보다 더 큰 권세로 온 세상을 지배했습니다. 그 뒤에 내가 보니, 보십시오,[a]
