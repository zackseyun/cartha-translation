  naturalness: ‘그 땅에 사는 이들’과 ‘전에 있던 모든 날개보다 더 큰 권세로 온 세상을 지배했습니다’가 현대 표준 한국어에서 더 자연스럽고, 원문의 비교 구조도 선명하게 드러냅니다. 환상 서술의 ‘보십시오’는 문체상 의도된 주의 환기 표현으로 유지할 수 있습니다.
  terminology: 상징적 caput와 alae는 각각 ‘머리’와 ‘날개’로 보존합니다. cum labore multo는 영어 POB의 ‘with much oppression’을 따라 ‘심한 압제로’ 옮깁니다. potentatum은 ‘권세’로 옮겨 앞선 ‘다스리다’와 구별하면서도 정치적 지배의 뜻을 유지합니다.
