  text: caput percontinuit omnem terram et dominauit qui inhabitant in ea cum labore multo et potentatum tenuit orbis terrarum super omnes alas quae fuerunt. Et uidi post haec et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/032.yaml
  text: And this head held sway over the whole earth and ruled those who inhabited it with much oppression, and it held dominion over the inhabited world more than all the wings that had been before it. And I saw after these things, and behold,
translation:
  language: ko
  text: 그 머리는 온 땅을 지배했고, 그 땅에 사는 이들을 심한 압제로 다스렸으며, 전에 있던 모든 날개보다 더 큰 권세로 온 세상을 지배했습니다. 그 뒤에 내가 보니, 보십시오,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막의 「보십시오」는 라틴어 et ecce를 반영한 감탄/주의 환기 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: caput
  english_pob_choice: this head
  chosen_korean: 그 머리
  alternatives_korean:
  - 이 머리
  - 그 우두머리
  lexicon: caput
  rationale: 문맥상 상징적 ‘머리’ 이미지를 살리되, 영어 POB의 지시어를 반영해 ‘그 머리’로 옮겼습니다.
- source_word: percontinuit / dominauit
  english_pob_choice: held sway over / ruled
  chosen_korean: 다스렸고 … 지배하였으며
  alternatives_korean:
  - 군림했고 … 통치하였으며
  - 권세를 부렸고 … 다스렸으며
  lexicon: dominare
  rationale: 앞부분은 지배적 영향력을, 뒷부분은 실제 통치를 나타내므로 두 동사를 나눠 원문의 병행을 살렸습니다.
- source_word: cum labore multo
  english_pob_choice: with much oppression
  chosen_korean: 큰 압제로
  alternatives_korean:
  - 많은 수고로
  - 매우 큰 억압으로
  - 많은 고통으로
  lexicon: labor
  rationale: 이 구절은 단순한 ‘노고’보다 피지배자에게 가해진 억압의 뉘앙스를 드러내므로 ‘압제’로 옮겼습니다.
- source_word: potentatum tenuit
  english_pob_choice: held dominion
  chosen_korean: 지배권을 가지고 있었습니다
  alternatives_korean:
  - 지배권을 유지하였습니다
  - 권세를 가졌습니다
  - 지배하였습니다
  lexicon: potentatus
  rationale: 지속된 지배 상태를 드러내기 위해 ‘가지고 있었습니다’로 풀어, 앞뒤의 왕권적 표현과 구별했습니다.
theological_decisions:
- issue: 이 본문은 상징적 제국 권세를 ‘머리’와 ‘날개’ 이미지로 묘사합니다.
  chosen_reading: 상징을 직역에 가깝게 유지하여 독자가 단순한 역사 서술이 아니라 환상적 정치 상징으로 이해하도록 했습니다.
  alternative_readings:
  - 의미를 풀어 ‘왕이…’처럼 해석적으로 바꾸는 방식
  - 상징을 약화시켜 일반 통치 서술로 만드는 방식
  rationale: 정경 밖 묵시 문맥의 이미지를 보존하는 것이 원문 의도와 영어 POB의 감수성에 더 부합합니다.
  doctrine_reference: 묵시문학 해석 원칙
