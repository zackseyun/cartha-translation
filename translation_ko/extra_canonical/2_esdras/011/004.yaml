  text: Nam capita eius erant quiescentia, et medium caput erat maius aliorum capitum, sed et ipsa quiescebat cum eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/004.yaml
  text: For its heads were at rest[a], and the middle head was larger than the other heads, yet it too was at rest with them.
  footnotes:
  - marker: a
    text: Or 'But'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 그 머리들이 쉬고 있었고, 가운데 머리는 다른 머리들보다 더 컸지만, 그것도 그들과 함께 쉬고 있었기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: capita eius
  english_pob_choice: its heads
  chosen_korean: 그 머리들은
  alternatives_korean:
  - 그것의 머리들은
  - 그의 머리들은
  - 그 머리들
  lexicon: caput
  rationale: 라틴어 복수 명사 caput을 한국어에서도 복수 주어로 분명히 드러내기 위해 ‘머리들’로 옮겼고, 문맥상 소유 대명사는 자연스러운 지시 표현으로 처리했습니다.
- source_word: erant quiescentia / quiescebat
  english_pob_choice: were at rest / was at rest
  chosen_korean: 쉬고 있었고 / 쉬고 있었습니다
  alternatives_korean:
  - 안식하고 있었고 / 안식하고 있었습니다
  - 고요해 있었고 / 고요해 있었습니다
  lexicon: quiescere
  rationale: quiescere의 기본 의미를 ‘쉬다, 잠잠하다’로 보고, 상태 지속을 나타내는 진행형으로 옮겨 동작보다 정지 상태를 살렸습니다.
- source_word: medium caput erat maius aliorum capitum
  english_pob_choice: the middle head was larger than the other heads
  chosen_korean: 가운데 머리는 다른 머리들보다 더 컸습니다
  alternatives_korean:
  - 가운데 머리는 다른 머리들보다 더 컸습니다
  - 가운데 머리는 다른 머리들보다 더 컸습니다
  - 중간의 머리는 다른 머리들보다 더 컸습니다
  lexicon: maior / aliorum
  rationale: 비교급 maius를 ‘더 컸습니다’로 직역하지 않고, 크기 우위를 자연스럽게 드러내는 한국어 비교 구조로 옮겼습니다.
- source_word: sed
  english_pob_choice: yet
  chosen_korean: 그러나
  alternatives_korean:
  - 하지만
  - 그런데
  - 그렇지만
  lexicon: sed
  rationale: 라틴어 sed의 대조를 한국어에서 가장 분명하게 보이도록 ‘그러나’로 옮겼으며, 앞의 설명적 nam과 구별되는 전환을 살렸습니다.
theological_decisions:
- issue: 환상적 묘사의 직역과 해석 절제
  chosen_reading: 본문의 시각적 설명만 그대로 제시하고 상징 의미를 덧붙이지 않았습니다.
  alternative_readings:
  - 머리들을 특정 인물·제국·권세의 상징으로 해석하는 번역
  - 의미를 풀어쓴 의역
  rationale: 이 절은 환상 장면의 외형을 설명하는 구절이므로, 해석을 본문 밖으로 확장하지 않고 관찰 가능한 상태와 비교만 유지하는 것이 source-grounded 원칙에 부합합니다.
  doctrine_reference: 문학적/예언적 이미지의 제한적 번역 원칙
