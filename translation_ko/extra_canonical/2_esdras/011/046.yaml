revisions:
- from: 당신의 악한 발톱과 당신의 온몸이 헛되기 때문에, 온 땅이 새 힘을 얻고 가벼워져 당신의 폭력에서 풀려나, 자신을 지으신 이의 심판과 긍휼을 바라게 되기를 바랍니다.”[a]
  to: 당신의 악한 발톱들과 헛된 온몸도 사라져, 온 땅이 새 힘을 얻도록[a] 하고 안도하며, 당신의 폭력에서 풀려나 그 땅을 지으신 분의 심판과 긍휼을 바라게 하려는 것입니다.”
  rationale: 문맥상 앞 절에서 이어지는 소멸의 의미를 ‘사라져’로 보충하여, 절 첫머리의 명사구를 자연스러운 한국어 문장으로 만들었습니다. 인과관계와 화자의 소망 표현은 제거하고, uti 이하의 목적 구조를 유지했습니다. eam의 지시 대상이 온 땅임을 ‘그 땅’으로 분명히 했으며, 각주를 해당 표현에 직접 연결했습니다.
