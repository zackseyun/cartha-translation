translation:
  language: ko
  text: 당신의 악한 발톱과 당신의 온몸이 헛되기 때문에, 온 땅이 새 힘을 얻고 가벼워져 당신의 폭력에서 풀려나, 자신을 지으신 이의 심판과 긍휼을 바라게 되기를 바랍니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘온 땅이 쉼을 얻게 되기를’
    reason: previous_rendering
lexical_decisions:
- source_word: ungues tui pessimi
  english_pob_choice: your wicked claws
  chosen_korean: 당신의 악한 발톱
  alternatives_korean:
  - 당신의 사악한 발톱
  - 당신의 못된 발톱
  lexicon: ungues = 발톱/손톱; pessimi = 가장 나쁜, 악한
  rationale: 발톱의 이미지와 도덕적 악성을 함께 살리기 위해 ‘악한 발톱’으로 옮겼습니다. ‘사악한’도 가능하지만, 라틴어의 직접적 비난을 비교적 간결하게 반영하는 ‘악한’이 더 자연스럽습니다.
- source_word: omne corpus tuum uanum
  english_pob_choice: your whole worthless body
  chosen_korean: 당신의 온몸이 헛되기 때문에
  alternatives_korean:
  - 당신의 온몸이 무가치하기 때문에
  - 당신의 온몸이 허망하기 때문에
  lexicon: corpus = 몸; vanum = 헛된, 공허한, 무의미한
  rationale: ‘body’의 명사구를 그대로 반복하기보다, 문맥상 앞의 비난을 이어 받는 평가절로 처리해 전체 의미를 더 자연스럽게 드러냈습니다. ‘헛되다’는 vanum의 공허·무가치함을 함께 담을 수 있습니다.
- source_word: Vti refrigeret omnis terra
  english_pob_choice: so that the whole earth may be refreshed
  chosen_korean: 온 땅이 새 힘을 얻고 가벼워져
  alternatives_korean:
  - 온 땅이 새로워지고 쉼을 얻어
  - 온 땅이 상쾌하게 되어서
  lexicon: refrigeret = 식히다, 상쾌하게 하다, 새롭게 하다; omnis terra = 온 땅
  rationale: 라틴어 refrigeret는 단순한 ‘휴식’보다 ‘시원해짐/새 힘을 얻음’의 감각이 있어, 한국어로는 ‘새 힘을 얻다’와 ‘가벼워지다’를 함께 써서 물리적·정서적 회복감을 살렸습니다.
- source_word: et releuetur liberata de tua ui
  english_pob_choice: and relieved, freed from your violence
  chosen_korean: 당신의 폭력에서 풀려나
  alternatives_korean:
  - 당신의 폭력에서 해방되어
  - 당신의 폭력에서 건져져
  lexicon: liberata = 해방된, 풀려난; uis = 폭력, 강압
  rationale: liberata는 단순한 위로보다 ‘풀림/해방’을 뜻하므로 ‘풀려나’로 옮겼고, ui는 문맥상 물리적 폭력·강압을 가리켜 ‘폭력’으로 번역했습니다.
theological_decisions:
- issue: 창조주에 대한 지칭과 기도의 결말
  chosen_reading: ‘자신을 지으신 이의 심판과 긍휼’을 바라게 되기를 바랍니다
  alternative_readings:
  - ‘그를 만드신 이의 심판과 자비’를 바라게 되기를 바랍니다
  - ‘그를 지으신 분의 판단과 긍휼’을 바라게 되기를 바랍니다
  rationale: 원문은 ‘그것을 지으신 이’(qui fecit eam)를 가리키며, 피조세계 전체가 창조주를 향해 소망한다는 구조를 보존해야 합니다. ‘심판과 긍휼’은 judgment and mercy의 긴장을 그대로 두어, 단순한 위로나 보상으로 완화하지 않았습니다.
  doctrine_reference: 창조주-피조물 관계, 심판과 긍휼의 병행
