id: 2ES.11.39
reference: 2 Esdras 11:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: regnare in saeculo meo, et ut per ea ueniret finis temporum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/039.yaml
  text: Are you not the one that remains of the four beasts which I had made to reign in my age[a], so that through them the end of my times might come?
  footnotes:
  - marker: a
    text: Or 'survived from the four beasts which I made'.
    reason: previous_rendering
translation:
  language: ko
  text: «당신은 내가 세운 네 짐승들 가운데서 아직 남은 자가 아니냐[a], 그것들을 통해 내 시대의 끝이 이르게 하려는 것이었다»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 만든 네 짐승들 가운데서 살아남은 자’
    reason: previous_rendering
lexical_decisions:
- source_word: regnare
  english_pob_choice: had made to reign
  chosen_korean: 세우다
  alternatives_korean:
  - 다스리게 하다
  - 왕노릇하게 하다
  lexicon: regno
  rationale: 라틴어 regnare는 단순히 통치권을 주는 행위를 가리키므로, 본문 문맥에 맞게 ‘세우다’로 옮겨 통치권 부여의 의미를 간결하게 살렸습니다.
- source_word: in saeculo meo
  english_pob_choice: in my age
  chosen_korean: 내 시대에
  alternatives_korean:
  - 내 세대에
  - 내 시대 가운데
  lexicon: saeculum
  rationale: saeculum은 시간적 ‘시대’의 뜻이 자연스럽고, 한국어에서도 문맥상 ‘내 시대에’가 가장 직접적으로 대응합니다.
- source_word: superasti de
  english_pob_choice: remains of
  chosen_korean: 아직 남은 자
  alternatives_korean:
  - 남아 있는 자
  - 살아남은 자
  lexicon: supero
  rationale: 영문 감사본이 파악한 partitive 의미를 반영해, 단순 생존보다 ‘무리 가운데서 아직 남은 사람’이라는 뜻이 드러나도록 했습니다.
- source_word: finis temporum
  english_pob_choice: the end of my times
  chosen_korean: 내 시대의 끝
  alternatives_korean:
  - 내 때의 끝
  - 내 시간들의 끝
  lexicon: finis + tempus
  rationale: 복수적 뉘앙스가 있으나 한국어에서는 자연스럽게 ‘내 시대의 끝’으로 옮기되, 종말적 결말이라는 의미가 약해지지 않도록 했습니다.
theological_decisions:
- issue: ‘짐승들’의 비유적 지칭을 그대로 유지할지 여부
  chosen_reading: 상징적 존재를 직역하여 ‘네 짐승들’로 유지했습니다.
  alternative_readings:
  - ‘네 짐승들’ 대신 ‘네 짐승 같은 왕국들’로 설명
  - 의역하여 ‘네 권세자들’로 완화
  rationale: 원문과 영어 POB 모두 동물을 비유적 주체로 유지하므로, 해석을 미리 풀어쓰지 않고 상징성을 보존했습니다.
  doctrine_reference: 문맥상 계시적 상징 보존 원칙
