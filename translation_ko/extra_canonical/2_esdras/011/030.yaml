  text: And behold, the head turned with those who were with it,
translation:
  language: ko
  text: 보십시오, 머리가 그와 함께 있던 이들과 함께 돌아섰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
