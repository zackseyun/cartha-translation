  - 그와 더불어 있던 이들과 함께
  lexicon: cum + pronoun + relative clause
  rationale: 반복된 동반 관계를 그대로 드러내기 위해 「그와 함께 있던 이들」로 옮기고, 뒤의 「함께」를 보존해 원문의 중복 감각을 살렸습니다.
theological_decisions:
- issue: caput의 지시 대상이 문자적 머리인지 상징적 ‘수장’인지
  chosen_reading: 본문은 단지 ‘머리’가 함께 있던 이들과 함께 돌아섰다고 진술하므로, 추가 해석 없이 문자적 표면 의미를 유지했습니다.
  alternative_readings:
  - 지휘자/우두머리로 이해하는 상징적 독해
  rationale: 주어진 라틴어와 영어 대조문에는 상징 해석을 지시하는 단서가 없으므로, 해석을 앞당기지 않는 것이 원문 충실성에 맞습니다.
