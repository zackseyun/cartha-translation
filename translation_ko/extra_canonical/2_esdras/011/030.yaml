  source_fidelity: 라틴어 Et ecce conuersum est caput cum his qui cum eo erant의 주어는 caput(‘머리’)이며, eo는 그 머리를 가리킵니다. 초안의 ‘그와 함께’는 별도의 남성 인물을 가리키는 것으로 읽힐 수 있어 지시 관계가 불분명합니다. ‘머리가 자신과 함께 있던 이들과 함께’로 고쳐 원문의 동반 관계와 반복을 보존합니다.
  naturalness: ‘보십시오’와 ‘돌아섰습니다’는 현대 한국어의 정중한 성경 문체에 자연스럽습니다. ‘자신과 함께 있던 이들’은 다소 의인화된 표현이지만, 본 환상 문맥의 상징적 ‘머리’를 불필요하게 특정 인물로 해석하지 않으면서 지시 대상을 명료하게 합니다.
  terminology: caput는 해석을 앞당기지 않고 ‘머리’로 유지하는 것이 적절합니다. qui의 인칭적 관계절은 ‘이들’로 옮길 수 있으며, 원문의 cum ... cum ... 반복은 두 번의 ‘함께’로 보존합니다.
  issues:
