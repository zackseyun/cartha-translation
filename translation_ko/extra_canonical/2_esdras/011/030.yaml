lexical_decisions:
- source_word: Et ecce
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보라
  lexicon: ecce
  rationale: 감탄과 주의를 환기하는 표현으로, 현대 한국어 성경체에서 자연스러운 명령형 주의 환기어인 「보십시오」를 택했습니다.
- source_word: caput
  english_pob_choice: the head
  chosen_korean: 머리
  alternatives_korean:
  - 머리(부분)
  - 수장
  lexicon: caput
  rationale: 라틴어 caput의 기본적 신체 의미를 그대로 살려 「머리」로 옮겼으며, 문맥상 상징적 확장 여부는 본문만으로 단정하지 않았습니다.
- source_word: cum his qui cum eo erant
  english_pob_choice: with those who were with it
  chosen_korean: 그와 함께 있던 이들과 함께
  alternatives_korean:
  - 그와 함께 있던 사람들과 함께
  - 그와 더불어 있던 이들과 함께
  lexicon: cum + pronoun + relative clause
  rationale: 반복된 동반 관계를 그대로 드러내기 위해 「그와 함께 있던 이들」로 옮기고, 뒤의 「함께」를 보존해 원문의 중복 감각을 살렸습니다.
theological_decisions:
- issue: caput의 지시 대상이 문자적 머리인지 상징적 ‘수장’인지
  chosen_reading: 본문은 단지 ‘머리’가 함께 있던 이들과 함께 돌아섰다고 진술하므로, 추가 해석 없이 문자적 표면 의미를 유지했습니다.
  alternative_readings:
  - 지휘자/우두머리로 이해하는 상징적 독해
  rationale: 주어진 라틴어와 영어 대조문에는 상징 해석을 지시하는 단서가 없으므로, 해석을 앞당기지 않는 것이 원문 충실성에 맞습니다.
  doctrine_reference: source-plain-sense
