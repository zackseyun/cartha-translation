  - 보라
  - 보십시오, 보라
  lexicon: ecce
  rationale: 감탄과 주의를 환기하는 표현으로, 현대 한국어 성경체에서 자연스러운 명령형 주의 환기어인 「보십시오」를 택했습니다.
- source_word: caput
  english_pob_choice: the head
  chosen_korean: 머리
  alternatives_korean:
  - 머리(부분)
  - 수장
  lexicon: caput
  rationale: 라틴어 caput의 기본적 신체 의미를 그대로 살려 「머리」로 옮겼으며, 문맥상 상징적 확장 여부는 본문만으로 단정하지 않았습니다.
- source_word: cum his qui cum eo erant
