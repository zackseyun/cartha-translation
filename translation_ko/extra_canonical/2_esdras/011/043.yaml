id: 2ES.11.43
reference: 2 Esdras 11:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui te non nocuerunt. Et ascendit contumelia tua ad altissimum et superbia tua ad fortem. Et respexit altissimus super sua tempora, et ecce finita sunt, et saecula eius conpleta sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/043.yaml
  text: who did not harm you. And your insolence has gone up to the Most High, and your pride to the Mighty One. And the Most High has looked upon his times, and behold, they are ended, and his ages are completed.
translation:
  language: ko
  text: 당신에게 해를 끼치지 않았던 자들입니다. 그리고 당신의 오만은 지극히 높으신 분께로 올라갔고, 당신의 교만은 능하신 분께로 올라갔습니다. 지극히 높으신 분께서 자신의 때들을 살피셨으니 — 보십시오, 그것들은 끝났고 그의 시대들은 다 채워졌습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘능하신 분’은 라틴어 fortem의 힘/능력 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그의 때들’과 ‘그의 시대들’은 라틴어의 서로 다른 시간 표현을 구분해 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: qui te non nocuerunt
  english_pob_choice: who did not harm you
  chosen_korean: 당신에게 해를 끼치지 않았던 자들입니다
  alternatives_korean:
  - 당신을 해치지 않았던 자들입니다
  - 당신에게 해를 가하지 않았던 자들입니다
  lexicon: nocere
  rationale: 라틴어 부정완료절을 현재적 진술보다 관계절로 살려, 직접적 해침이 없었음을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: contumelia
  english_pob_choice: insolence
  chosen_korean: 오만
  alternatives_korean:
  - 무례
  - 능멸
  - 모욕
  lexicon: contumelia
  rationale: POB의 ‘insolence’에 맞추어 단순한 예절 위반보다 하나님께 대한 교만한 오만을 드러내는 말로 잡았습니다.
- source_word: altissimum
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 하나님
  lexicon: altissimus
  rationale: 고유한 신적 칭호를 직역하되, 한국어에서 호칭처럼 자연스러운 ‘분’으로 처리했습니다.
- source_word: fortem
  english_pob_choice: the Mighty One
  chosen_korean: 능하신 분
  alternatives_korean:
  - 전능하신 분
  - 강하신 분
  lexicon: fortis
  rationale: POB의 ‘Mighty One’을 과도하게 신학화하지 않고, 힘의 뉘앙스를 살린 표준적 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님 앞에 올라간 ‘오만/교만’의 방향성
  chosen_reading: 사람의 오만과 교만이 상향 동작으로 하나님께 도달한 것으로 표현했습니다.
  alternative_readings:
  - ‘하나님을 향한 모욕’으로 풀어 완화하기
  - 단순히 ‘심판의 대상이 되었다’로 의역하기
  rationale: 원문은 죄의 상승과 하나님의 응답을 병렬로 두므로, 도덕적 긴장과 수직적 이미지를 유지했습니다.
  doctrine_reference: 신 32:27; 시 73:8-9의 수직적 반응 이미지
- issue: ‘그의 때들’과 ‘그의 시대들’의 반복
  chosen_reading: 두 표현을 각각 ‘때들’과 ‘시대들’로 나누어 반복을 보존했습니다.
  alternative_readings:
  - 둘 다 ‘때’로 평준화하기
  - 둘 다 ‘시기’로 바꾸기
  rationale: 라틴어 tempus / saecula의 병치를 가급적 유지해 종말적 완료감이 드러나도록 했습니다.
  doctrine_reference: 종말론적 시간의 완결에 대한 서술
