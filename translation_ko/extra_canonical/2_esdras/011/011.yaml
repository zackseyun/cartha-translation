    reason: lexical_alternative
lexical_decisions:
- source_word: Et numeraui
  english_pob_choice: And I counted
  chosen_korean: 나는 ... 세어 보았는데
  alternatives_korean:
  - 나는 ... 셌는데
  - 그리고 나는 ... 세었으며
  lexicon: numerare → 세다
  rationale: 라틴어 완료형 서술을 한국어의 회상적 과거로 자연스럽게 옮기되, 관찰 행위를 드러내는 ‘세어 보았는데’로 장면 전환을 살렸습니다.
- source_word: contrarias
  english_pob_choice: opposing
  chosen_korean: 맞은편
  alternatives_korean:
  - 반대하는
  - 마주 선
  - 대립하는
  lexicon: contrarius → 마주한, 반대의
  rationale: 날개의 물리적 배치를 가리키는 것으로 읽히므로 추상적 ‘반대하는’보다 공간적 방향을 드러내는 ‘맞은편’이 더 직접적입니다.
- source_word: pennas eius
  english_pob_choice: its wings
  chosen_korean: 그의 ... 날개들
  alternatives_korean:
  - 그것의 ... 날개들
  - 그 날개들
  - 그의 날개
  lexicon: penna → 날개
  rationale: 라틴어 eius는 문맥상 앞선 대상의 소유를 가리키므로 지시 대명사보다 자연스러운 ‘그의’로 옮겼고, 복수형을 반영해 ‘날개들’로 처리했습니다.
- source_word: ipsae erant octo
  english_pob_choice: they were eight
  chosen_korean: 그것들은 여덟 개였습니다
  alternatives_korean:
  - 그것들은 여덟이었습니다
  - 바로 여덟 개였습니다
  - 그 수는 여덟이었습니다
  lexicon: octo → 여덟
  rationale: 라틴어의 단순 진술을 한국어 수량 표현으로 명료하게 옮겨, 날개라는 명사에 맞게 ‘여덟 개’로 구체화했습니다.
theological_decisions:
- issue: 장면의 화자 시점과 감탄/주의 환기 표현
  chosen_reading: ‘보십시오’로 라틴어 ecce의 시각적 주의를 한국어에서 자연스럽게 재현했습니다.
  alternative_readings:
  - ‘보라’
  - ‘보니’
  - 생략
  rationale: ecce는 단순 연결어가 아니라 독자에게 대상을 주목시키는 표지이므로, 현대 한국어에서 과도하게 고어적이지 않으면서도 현장감을 주는 ‘보십시오’를 택했습니다.
  doctrine_reference: 서술적 시점 재현 원칙
- issue: ‘contrarias’의 의미를 추상적 대립보다 공간적 대향으로 읽음
  chosen_reading: 날개들이 서로 마주 보는/맞은편에 있는 배치로 이해했습니다.
  alternative_readings:
  - 반대하는 날개들
  - 대립하는 날개들
  rationale: 문맥상 수를 셀 수 있는 대상의 배열을 말하므로, 윤리적·추상적 대립을 암시하는 번역은 원문 범위를 넘습니다.
  doctrine_reference: 문맥 우선 번역 원칙
