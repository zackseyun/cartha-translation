  text: 'Et uidi et ecce surrexit aquila super ungues suos et misit uocem pennis suis dicens:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/011/007.yaml
  text: And I looked[a], and behold, the eagle rose up on its claws and uttered a voice to its wings, saying,
  footnotes:
  - marker: a
    text: Or 'sent out a voice'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니, 보라, 독수리가 자기 발톱으로 일어서서 자기 날개들에게 목소리를 내어 이렇게 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자기 날개들에게 소리를 내보냈다’.
    reason: 라틴어 misit vocem의 문자적 표현을 제시합니다.
lexical_decisions:
- source_word: Et uidi et ecce
  english_pob_choice: And I looked[a], and behold
  chosen_korean: 내가 보니, 보라
  alternatives_korean:
  - 내가 보았는데, 보라
  - 내가 보았고, 보라
  lexicon: video; ecce
  rationale: 라틴어의 연속 서술과 경탄 표지를 한국어에서 자연스럽게 살리되, 예언적 장면 전환의 즉시성을 유지했습니다.
- source_word: surrexit aquila
  english_pob_choice: the eagle rose up
  chosen_korean: 독수리가 … 일어나고
  alternatives_korean:
  - 독수리가 … 일어서고
  - 독수리가 … 솟아오르고
  lexicon: surgo; aquila
  rationale: surrexit는 단순한 동작 상승을 넘어 ‘일어나다’의 동적 이미지를 주므로, 독수리의 갑작스러운 움직임을 살렸습니다.
- source_word: super ungues suos
  english_pob_choice: on its claws
  chosen_korean: 자기 발톱들 위로
  alternatives_korean:
  - 자기 발톱 위로
  - 자기 발톱들 위에
  lexicon: unguis
  rationale: ungues는 복수형이므로 ‘발톱들’로 옮겨 원문 형식을 보존했고, super는 자세/지지의 이미지를 살려 ‘위로’로 처리했습니다.
- source_word: misit uocem pennis suis
  english_pob_choice: uttered a voice to its wings
  chosen_korean: 자기 날개들에게 자기의 소리를 내며
  alternatives_korean:
  - 자기 날개들에게 소리를 보내며
  - 자기 날개에 소리를 내며
  lexicon: mitto; vox; penna
  rationale: misit vocem은 직역보다 ‘소리를 내다/내지르다’에 가까운 관용구이므로, 영어 POB의 해석을 반영하되 ‘날개들에게’는 수신 대상을 유지했습니다.
theological_decisions:
- issue: misit uocem의 관용적 의미
  chosen_reading: ‘소리를 내다’로 옮겨, 단순히 음성을 ‘보내는’ 물리적 행위가 아니라 외침/발화의 의미를 드러냈습니다.
  alternative_readings:
  - ‘소리를 보내다’
  - ‘외쳤다’
  rationale: 라틴어는 히브리계 관용구의 번역 흔적이어서, 한국어에서도 의미를 자연스럽게 풀어 주되 원문의 발화 이미지를 지키는 것이 적절합니다.
  doctrine_reference: Translation principle / idiom preservation
