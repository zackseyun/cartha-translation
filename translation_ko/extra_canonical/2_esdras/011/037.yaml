- from: 우는 소리였고, 나는 그것이 독수리에게 사람의 목소리를 내어 말하는 것을 들었습니다. 「들으십시오. 그러면 내가 당신에게 말하겠습니다. 지극히 높으신 분께서 당신에게 말씀하십니다:」[a]
  to: 울부짖으며, 나는 그것이 사람의 목소리를 내어 독수리에게 이렇게 말하는 것을 들었습니다[a]. “들으십시오. 내가 당신에게 말하겠습니다. 지극히 높으신 분께서 당신에게 말씀하십니다:”
  rationale: 라틴어 본문 범위에 맞추어 mugiens 이하만 번역하고, 조건 관계를 덧붙인 ‘그러면’을 삭제했습니다. ‘이렇게 말하는 것을 들었습니다’는 ‘emisit vocem hominis ... et dixit dicens’의 사람 목소리와 반복적 발화 도입을 한국어로 무리 없이 나타냅니다. 각주는 이전 번역이 앞 절의 내용을 포함했던 사실을 반영하는 대안으로 복원했습니다.
