translation:
  language: ko
  text: 울부짖으며, 나는 그것이 사람의 목소리를 내어 독수리에게 이렇게 말하는 것을 들었습니다[a]. “들으십시오. 내가 당신에게 말하겠습니다. 지극히 높으신 분께서 당신에게 말씀하십니다:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “또 내가 보니, 보라, 숲에서 일어난 사자 같은 것이 울부짖고 있었습니다. 나는 그것이 사람의 목소리를 내어 독수리에게 말하는 것을 들었습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: mugiens
  english_pob_choice: roaring
  chosen_korean: 우는 소리였고
  alternatives_korean:
  - 포효했고
  - 울부짖고 있었고
  lexicon: mugiens
  rationale: 라틴어 분사형이 앞선 맹수의 울음소리를 배경처럼 제시하므로, 동작을 과도하게 해석하지 않고 소리의 상태를 자연스럽게 옮겼습니다.
- source_word: emisit vocem hominis
  english_pob_choice: it sent out a human voice
  chosen_korean: 사람의 목소리를 내어
  alternatives_korean:
  - 사람의 음성을 내어
  - 인간의 목소리를 내어
  lexicon: vox / vocem hominis
  rationale: 직역하면 ‘사람의 목소리’를 ‘발하다’는 표현이므로, 한국어에서는 ‘목소리를 내다’로 옮겨 라틴어의 기이한 인상을 유지했습니다.
- source_word: audi tu
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들어라
  - 들어 주십시오
  lexicon: audi
  rationale: 직접화법의 명령형을 합쇼체로 처리하되, 이어지는 신적 발화의 엄중함을 살리기 위해 공손한 명령형을 택했습니다.
- source_word: dicit altissimus tibi
  english_pob_choice: The Most High says to you
  chosen_korean: 지극히 높으신 분께서 당신에게 말씀하십니다
  alternatives_korean:
  - 지극히 높으신 분이 당신에게 말씀하십니다
  - 가장 높으신 분께서 당신에게 말씀하십니다
  lexicon: altissimus
  rationale: altissimus를 ‘지극히 높으신 분’으로 옮겨 호칭적 뉘앙스를 살렸고, 예언적/신적 발화에 맞게 ‘말씀하십니다’를 사용했습니다.
theological_decisions:
- issue: 직접화법 안에서의 존칭 수준
  chosen_reading: 독수리에게 향한 명령과 그 뒤의 신적 발화를 모두 합쇼체로 유지했습니다.
  alternative_readings:
  - 명령형을 반말체로 낮추는 번역
  - 신적 발화만 더 엄격한 성경문체로 올리는 번역
  rationale: 본문은 장엄한 공개 선언의 흐름을 가지므로, 현대 표준어의 공적·예언적 어조를 유지하는 것이 가장 적절합니다.
  doctrine_reference: 예언적 계시의 공적 전달 방식
