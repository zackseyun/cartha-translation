  verdict: revise
  source_fidelity: 라틴어 capita(복수)는 해석을 덧붙이지 않고 ‘머리들’로 유지했습니다. autem의 전환은 ‘그러나’로, in nouissimo의 종결 시점/목적의 뉘앙스는 영어 POB 감사 이력에 맞추어 ‘끝을 위하여’로 옮겼습니다. seruentur의 명령적 수동법은 한국어에서 자연스러운 명령 표현인 ‘남겨 두십시오’로 재현했습니다.
  naturalness: ‘보존되게 하십시오’는 수동 사역 표현이 겹쳐 현대 표준 한국어로 부자연스럽습니다. ‘남겨 두십시오’가 지정된 때까지 보존·유보한다는 뜻을 자연스럽고 명료하게 전달합니다.
  terminology: 상징적 지시 대상인 capita는 ‘두목들’이나 ‘우두머리들’로 특정하지 않고 ‘머리들’로 보존했습니다. ‘끝’은 본문 및 영어 POB의 ‘the end’에 상응하며, 교리적으로 더 특정적인 ‘종말’은 피했습니다.
  issues:
  - severity: medium
    issue: ‘보존되게 하십시오’의 비자연스러운 사역·수동 결합
    rationale: seruentur는 ‘보존되다/남겨지다’라는 수동 명령이지만, 한국어 ‘보존되게 하십시오’는 지나치게 직역적이어서 문체가 어색합니다. ‘남겨 두십시오’가 유보·보존의 의미와 합쇼체 명령을 자연스럽게 살립니다.
