  yaml_path: translation/extra_canonical/2_esdras/011/009.yaml
  text: But let the heads be reserved for the end.
translation:
  language: ko
  text: 그러나 머리들은 끝을 위해 보존되게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Capita
  english_pob_choice: the heads
  chosen_korean: 머리들
  alternatives_korean:
  - 머리
  - 두목들
  - 우두머리들
  lexicon: caput
  rationale: 복수형 caput를 문자적으로 옮겨 ‘머리들’로 두어, 원문이 가리키는 복수 대상을 유지했습니다.
- source_word: autem
  english_pob_choice: But
  chosen_korean: 그러나
  alternatives_korean:
  - 그리고
  - 그런데
  lexicon: autem
  rationale: 전환 접속사로서 앞 문맥과의 대비를 자연스럽게 드러내는 ‘그러나’가 가장 무난합니다.
- source_word: in nouissimo
  english_pob_choice: for the end
  chosen_korean: 끝을 위해
  alternatives_korean:
  - 마지막을 위해
  - 종말을 위해
  - 끝에
  lexicon: nouissimus
  rationale: nouissimo를 단순한 시간상 ‘마지막’보다 종결점인 ‘끝’으로 옮겨, 영어 POB의 수정 취지와 라틴어의 의미를 함께 반영했습니다.
- source_word: seruentur
  english_pob_choice: be reserved
  chosen_korean: 보존되게 하십시오
  alternatives_korean:
  - 남겨두십시오
  - 간직되게 하십시오
  - 지켜두십시오
  lexicon: seruo
  rationale: 수동/중간적 뉘앙스를 살려 ‘보존되게 하십시오’로 옮겨, 단순한 보관보다 지정된 때까지 남겨 두는 의미를 드러냈습니다.
theological_decisions:
- issue: 모호한 ‘heads’의 지시 대상
  chosen_reading: 원문이 지시 대상을 설명하지 않으므로, 해석을 덧붙이지 않고 ‘머리들’로만 유지했습니다.
  alternative_readings:
  - 지도자들
  - 머리 부분들
  - 사람들의 머리
  rationale: 이 절은 매우 짧고 문맥 의존적이어서, 한국어 본문에서 대상을 특정하면 과잉해석이 됩니다.
  doctrine_reference: 원문 우선, 과잉명료화 회피
