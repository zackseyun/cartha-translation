- from: 열두 날개와 두 작은 날개깃은 사라졌습니다. 그리고 독수리의 몸에는 휴식 중인 세 머리와 여섯 작은 날개깃밖에 남지 않았습니다.
  to: 열두 날개와 두 작은 날개가 사라졌습니다. 독수리의 몸에는 쉬고 있는 세 머리와 여섯 작은 날개만 남았습니다.
  rationale: 원문의 수량, 소멸, 잔존 요소 및 ‘큰 날개/작은 날개’의 대비를 유지하되, ‘날개깃’이 유발할 수 있는 개별 깃털이라는 좁은 의미를 피하고 문체를 자연스럽게 다듬었습니다. 본문상 생략된 여섯의 명사는 앞선 pennacula에서 자연스럽게 보충하였습니다.
  reviewer_model: gpt-5.6-terra
