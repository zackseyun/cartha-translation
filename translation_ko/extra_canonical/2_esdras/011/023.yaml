  text: the twelve wings and the two little pinions disappeared. And nothing remained on the eagle’s body except the three resting heads and six little pinions.
translation:
  language: ko
  text: 열두 날개와 두 작은 날개가 사라졌습니다. 독수리의 몸에는 쉬고 있는 세 머리와 여섯 작은 날개만 남았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conparuerunt
  english_pob_choice: disappeared
  chosen_korean: 사라졌습니다
  alternatives_korean:
  - 보이지 않게 되었습니다
  - 없어졌습니다
  lexicon: conparere
  rationale: 영어 POB의 revised choice인 “disappeared”에 맞추어, 존재가 감춰진 정도보다 완전히 사라진 동작을 직접적으로 드러냈습니다.
- source_word: duodecim pennae
  english_pob_choice: the twelve wings
  chosen_korean: 열두 날개
  alternatives_korean:
  - 열두 개의 날개
  - 열두 깃
  lexicon: penna
  rationale: 라틴어 pennae를 가장 자연스럽게 ‘날개’로 옮기되, 수사 구조를 간결하게 유지했습니다.
- source_word: duo pennacula
  english_pob_choice: the two little pinions
  chosen_korean: 두 작은 날개깃
  alternatives_korean:
  - 두 작은 날개
  - 두 개의 작은 깃
  lexicon: pennaculum
  rationale: pennacula의 축소형 뉘앙스를 살려 ‘작은 날개깃’으로 옮겼고, 반복되는 이미지의 대비를 보존했습니다.
- source_word: nisi tria capita quiescentia et sex
  english_pob_choice: except the three resting heads and six little pinions
  chosen_korean: 휴식 중인 세 머리와 여섯 작은 날개깃밖에
  alternatives_korean:
  - 쉬고 있는 세 머리와 여섯 작은 날개깃밖에
  - 쉰 세 머리와 여섯 작은 날개깃밖에
  lexicon: quiescens
  rationale: quiescentia를 단순히 ‘쉬는’보다 상태성을 드러내는 ‘휴식 중인’으로 옮겨, 머리들의 비활성 상태를 보존했습니다.
theological_decisions:
- issue: 환상적 독수리의 신체 묘사와 직역성
  chosen_reading: 상징적 장면 자체를 그대로 드러내는 방식으로, 본문이 제시하는 변형·소멸의 이미지를 완화하지 않았습니다.
  alternative_readings:
  - 비유적으로 풀어 쓰는 방식
  - 독수리의 형체를 정리해 읽기 쉽게 재구성하는 방식
  rationale: 이 절은 해석보다 환상 서술의 연속성을 유지하는 것이 중요하므로, 상징적 세부를 보존하는 방향이 원문 충실도에 더 부합합니다.
  doctrine_reference: 문학적-상징적 본문은 원문 이미지 보존 우선
