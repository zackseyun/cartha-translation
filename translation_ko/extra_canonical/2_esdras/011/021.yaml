  - 왜냐하면 또
  lexicon: nam / et
  rationale: 개정된 영어가 유지한 설명·덧붙임의 연결을 반영해, 단순 병렬보다 이어짐을 보여 주는 ‘또’를 택했습니다.
- source_word: aliquae ex eis
  english_pob_choice: some of them
  chosen_korean: 그들 중 일부는
  alternatives_korean:
  - 그들 가운데 몇몇은
  - 그중 어떤 이들은
  lexicon: aliquae / ex eis
  rationale: 복수 일부를 가리키는 표현을 한국어에서 가장 자연스럽고 정확하게 옮겼습니다.
- source_word: erigebantur
  english_pob_choice: rose up
  chosen_korean: 일어났습니다
  alternatives_korean:
  - 들려 올라갔습니다
  - 솟아올랐습니다
  lexicon: erigebantur
  rationale: 상승·들림의 이미지를 과도하게 해석하지 않고, 문맥상 분명한 ‘일어남/치켜세워짐’을 간결하게 살렸습니다.
theological_decisions:
