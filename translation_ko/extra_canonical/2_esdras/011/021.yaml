  rationale: 이 절은 비유적 환상 묘사의 일부이므로, 원문이 말하는 동작 자체를 그대로 제시하는 것이 독자의 해석 여지를 보존합니다.
  doctrine_reference: 본문 비유/환상 해석의 중립성 유지
