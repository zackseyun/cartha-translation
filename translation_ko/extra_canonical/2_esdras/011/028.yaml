translation:
  language: ko
  text: 남아 있던 것들도 자기들끼리 왕으로 다스리려고 계획하고 있었습니다. 그들이 이렇게 계획하고 있을 때, 보십시오, 쉬고 있던 머리들 가운데 하나가…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: superauerunt
  english_pob_choice: those that remained
  chosen_korean: 남아 있던 자들
  alternatives_korean:
  - 남은 자들
  - 남아 있던 이들
  lexicon: extra_canonical_latin
  rationale: 라틴어 분사 superauerunt는 ‘남아 있다/살아남다’의 상태를 나타내므로, 본문 흐름에 맞게 ‘남아 있던 자들’로 자연스럽게 옮겼습니다.
- source_word: apud semetipsas cogitabant
  english_pob_choice: were planning among themselves
  chosen_korean: 자기들끼리도 생각하고 있었습니다
  alternatives_korean:
  - 서로 의논하고 있었습니다
  - 자기들 사이에서 꾀하고 있었습니다
  lexicon: extra_canonical_latin
  rationale: apud semetipsas는 상호적·내면적 담화를 가리키므로 ‘자기들끼리도’로 살리고, cogitabant는 단순한 ‘생각하다’보다 계획적 숙고를 담아 문맥상 자연하게 처리했습니다.
- source_word: regnare
  english_pob_choice: to reign as well
  chosen_korean: 왕이 되려고
  alternatives_korean:
  - 다스리려고
  - 통치하려고
  lexicon: extra_canonical_latin
  rationale: regnare는 왕권을 행사하는 뜻이므로, 단순한 일반 통치보다 왕위를 노리는 뉘앙스를 드러내기 위해 ‘왕이 되려고’로 옮겼습니다.
- source_word: cum cogitarent, ecce
  english_pob_choice: while they were planning this, behold
  chosen_korean: 그들이 이렇게 생각하고 있을 때, 보십시오
  alternatives_korean:
  - 그들이 이것을 생각하고 있을 때, 보십시오
  - 그들이 계획하는 동안, 보십시오
  lexicon: extra_canonical_latin
  rationale: cum + 접속법의 동시적 배경과 ecce의 돌발성을 함께 살리기 위해, 서술의 흐름을 끊지 않으면서도 ‘보십시오’로 주의를 환기했습니다.
theological_decisions:
- issue: 왕권을 향한 집단적 욕망의 표현
  chosen_reading: 본문은 단순한 정치적 협상이 아니라 ‘왕이 되려는’ 야망을 드러내는 서술로 옮겼습니다.
  alternative_readings:
  - ‘다스리려고’로 더 중립적으로 옮길 수 있음
  - ‘통치하려고’로 기능적으로만 처리할 수 있음
  rationale: 라틴어 regnare는 왕권 자체를 가리키므로, 본문의 상징적 긴장을 약화시키지 않기 위해 왕권 지향성을 분명히 했습니다.
  doctrine_reference: n/a
