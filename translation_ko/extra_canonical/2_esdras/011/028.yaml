revisions:
- from: 남아 있던 자들 역시 자기들끼리도 왕이 되려고 생각하고 있었습니다. 그리고 그들이 이렇게 생각하고 있을 때, 보십시오, 쉬고 있던 머리들 가운데 하나가…[a]
  to: 남아 있던 것들도 자기들끼리 왕으로 다스리려고 계획하고 있었습니다. 그들이 이렇게 계획하고 있을 때, 보십시오, 쉬고 있던 머리들 가운데 하나가…
  rationale: 원문의 절 범위를 엄격히 유지하고, 선행 대상의 비인격성을 보존했습니다. 또한 et ipsae의 첨가 의미를 중복 없이 반영하고, cogitabant 및 regnare의 계획적 왕권 의미를 자연스러운 한국어로 명료하게 했습니다. 이전 번역을 설명하는 각주는 다음 절의 내용을 부당하게 포함하므로 삭제했습니다.
