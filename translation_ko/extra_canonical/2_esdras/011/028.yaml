review_pass:
  verdict: revise
  source_fidelity: 라틴어의 두 절, 즉 남아 있던 이들이 자신들 가운데서 왕으로 다스릴 일을 계획한 것과 그 계획 중에 쉬고 있던 머리 하나가 등장하는 장면을 충실히 반영합니다. 다만 문맥상 선행 대상은 독수리의 날개들이므로 ‘자들’보다 비인칭적 표현이 더 적절하며, regnare는 ‘왕이 되다’보다 ‘왕으로 다스리다’가 더 직접적입니다. 현 각주는 다음 절(11:29)의 ‘깨어났다’ 및 가운데 머리의 설명을 끌어들여 이 절의 범위를 넘어갑니다.
  naturalness: ‘역시’와 ‘자기들끼리도’가 함께 쓰여 중복적으로 들리고, ‘생각하고’의 반복은 계획·야망의 문맥을 충분히 드러내지 못합니다. ‘것들도 자기들끼리 … 계획하고 있었습니다’ 및 ‘이렇게 계획하고 있을 때’가 현대 표준 한국어 합쇼체에서 자연스럽습니다. ‘보십시오’는 ecce의 주의 환기 기능을 유지합니다.
  terminology: 상징적 동물의 부속물을 가리키는 문맥에 맞추어 ‘남아 있던 것들’을 사용합니다. regnare는 왕권을 행사한다는 뜻으로 ‘왕으로 다스리려고’로 옮깁니다. 본 절에서 아직 깨어남이 일어나지 않으므로 이를 본문이나 각주에 포함하지 않습니다.
  issues:
  - severity: medium
    issue: ‘남아 있던 자들’은 선행 문맥의 비인격적 대상(독수리의 날개들)을 사람으로 지칭합니다.
    rationale: ipsae는 선행하는 여성 복수 대상에 호응하며, 이 환상 문맥에서는 날개들을 가리킵니다. 한국어에서는 ‘것들’이 원문의 상징적·비인격적 지시를 더 정확히 보존합니다.
  - severity: low
    issue: ‘역시’와 ‘자기들끼리도’의 중복 및 ‘생각하고’의 반복
    rationale: et ipsae의 ‘also’는 ‘것들도’에 반영하면 충분합니다. cogitabant는 이 문맥에서 단순 사고보다 계획·도모의 뜻이므로 ‘계획하고’가 더 자연스럽고 정확합니다.
  - severity: medium
    issue: 각주가 11:29의 내용을 포함합니다.
    rationale: ‘깨어났습니다’, ‘가운데에 있는 것’, ‘나머지 둘보다 더 컸기 때문’은 제공된 11:28 라틴어 범위 뒤의 내용입니다. 절 경계를 지키기 위해 삭제해야 합니다.
  revised_text: 남아 있던 것들도 자기들끼리 왕으로 다스리려고 계획하고 있었습니다. 그들이 이렇게 계획하고 있을 때, 보십시오, 쉬고 있던 머리들 가운데 하나가…
