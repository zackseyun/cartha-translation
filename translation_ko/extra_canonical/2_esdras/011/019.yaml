lexical_decisions:
- source_word: Et sic contingebat
  english_pob_choice: And so it happened
  chosen_korean: 그리하여 … 이런 일이 일어났습니다
  alternatives_korean:
  - 그리고 그렇게 되었습니다
  - 그리하여 그렇게 되었습니다
  lexicon: contingebat
  rationale: 라틴어의 사건 서술적 전개를 자연스러운 현대 서술체로 옮기되, 단순한 접속보다 결과적 진행을 드러내기 위해 ‘그리하여 … 일어났습니다’로 처리했습니다.
- source_word: omnibus alis singulatim
  english_pob_choice: to all the wings one by one
  chosen_korean: 모든 날개에게 차례로
  alternatives_korean:
  - 모든 날개에 하나씩
  - 모든 날개마다 차례로
  lexicon: singulatim
  rationale: singulatim의 ‘각각/하나씩’ 의미를 살려 ‘차례로’로 옮겼고, alis는 문맥상 비유적 ‘날개들’로 직역했습니다.
- source_word: principatum
  english_pob_choice: held rule
  chosen_korean: 다스렸습니다
  alternatives_korean:
  - 통치했습니다
  - 권세를 잡았습니다
  lexicon: principatus
  rationale: principatum의 통치·지배 의미를 한국어에서 가장 직접적으로 드러내는 ‘다스리다’로 옮겨, 왕권적 뉘앙스를 과장하지 않았습니다.
theological_decisions:
- issue: 본문의 비유적 대상인 alis를 어떻게 처리할 것인가
  chosen_reading: 문맥 그대로 ‘날개들’로 유지했습니다.
  alternative_readings:
  - 상징적 주체로 의역하여 ‘세력들’로 옮김
  - 문맥을 보정해 ‘왕들’로 옮김
  rationale: 제시된 라틴 본문과 영어 POB가 모두 wings를 유지하므로, 해석을 앞세워 대상을 바꾸지 않고 본문 표면을 보존했습니다.
