  source_fidelity: 라틴어의 핵심 구조(여섯 작은 깃 가운데 둘의 분리, 오른쪽 머리 아래에 남음, 문미의 nam으로 인한 다음 절 연결)는 대체로 보존했습니다. 그러나 Et uidi et ecce의 ecce에 해당하는 환기 표현이 빠졌고, ‘여섯 개의 작은 깃에서 둘’은 ‘여섯 깃 가운데 둘’이라는 부분-전체 관계를 다소 부자연스럽게 나타냅니다.
