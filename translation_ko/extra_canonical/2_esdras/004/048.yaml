lexical_decisions:
- source_word: demonstrabo tibi
  english_pob_choice: I will show you
  chosen_korean: “나는 네게 …을 보여 주겠습니다”
  alternatives_korean:
  - “나는 네게 …을 설명하겠습니다”
  - “나는 네게 …을 나타내겠습니다”
  lexicon: demonstrabo
  rationale: demonstrabo는 단순히 말로 ‘설명하다’보다 어떤 것을 직접 드러내어 ‘보여 주다’는 의미가 더 강하므로, POB의 'show'를 따라 직역성을 살렸습니다.
- source_word: interpretationem similitudinis
  english_pob_choice: the interpretation of the likeness
  chosen_korean: “그 비유의 해석”
  alternatives_korean:
  - “그 닮음의 해석”
  - “그 형상의 해석”
  lexicon: interpretatio / similitudo
  rationale: similitudo는 문맥상 ‘비유’ 또는 ‘유사한 것’으로 읽을 수 있으나, 한국어에서는 자연스럽고 의미를 유지하는 ‘비유’가 가장 적절해 POB의 'likeness'를 반영해 옮겼습니다.
- source_word: uidi
  english_pob_choice: saw
  chosen_korean: “보고 있었는데”
  alternatives_korean:
  - “보았습니다”
  - “바라보았습니다”
  lexicon: video
  rationale: steti et uidi의 연속 동작을 살려, 단회적 ‘보았다’보다 진행·현장감을 주는 ‘보고 있었는데’로 처리했습니다.
- source_word: fornax ardens
  english_pob_choice: a blazing furnace
  chosen_korean: “타오르는 용광로”
  alternatives_korean:
  - “불타는 용광로”
  - “타오르는 화로”
  lexicon: fornax / ardens
  rationale: fornax는 일반적인 ‘화로’보다 큰 제련·가열 용기를 가리킬 수 있어, 강한 열기의 이미지를 살린 ‘용광로’가 더 적합합니다.
theological_decisions:
- issue: 문장의 미완성 상태 보존
  chosen_reading: 마지막 절을 한국어에서도 완결시키지 않고 ‘그리고 그 일이 일어났을 때…’로 남겨 원문의 미완성/연결 대기 상태를 보존했습니다.
  alternative_readings:
  - “그리고 그때”로 매끈하게 마침표 처리
  - “그리고 그것이 일어났을 때에”로 문장 완결
  rationale: 제공된 라틴 본문과 POB 개정 이력은 문장이 다음 절로 이어지는 미완성 형태임을 보여 주므로, 한국어도 같은 긴장과 중단감을 유지해야 합니다.
  doctrine_reference: source-critical continuity
