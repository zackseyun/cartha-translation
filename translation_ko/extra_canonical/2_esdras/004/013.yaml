  lexicon: cogitauerunt cogitationem
  rationale: 반복어법의 강세를 살리면서도 한국어에서 자연스러운 동사로 ‘꾸미다’를 택해, 단순한 ‘세우다’보다 의도적 모의의 뉘앙스를 드러냈습니다.
- source_word: uenite et eamus et faciamus ad
