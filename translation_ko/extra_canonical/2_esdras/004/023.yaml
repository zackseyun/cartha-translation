id: 2ES.4.23
reference: 2 Esdras 4:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Non enim uolui interrogare de superioribus uiis, sed de his quae pertranseunt per nos cotidie: propter quod, Israel datus est in obprobrium gentibus, quem dilexisti populum datus est tribubus impiis, et lex patrum nostrorum in inritum deducta'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/023.yaml
  text: 'For I did not want to ask about the ways above[a], but about the things that happen among us daily: why Israel has been given over as a reproach to the nations, why the people whom you loved has been given over to ungodly tribes, and why the law of our fathers has been brought to nothing.'
  footnotes:
  - marker: a
    text: Or 'pass over us'.
    reason: previous_rendering
translation:
  language: ko
  text: '왜냐하면 저는 위에 있는 것들에 대해 묻고자 한 것이 아니라, 우리 가운데 날마다 일어나는 일들에 대해 묻고자 했기 때문입니다: 어찌하여 이스라엘이 민족들 앞에 수치가 되었으며, 주께서 사랑하신 그 백성이 경건하지 않은 부족들에게 넘겨졌으며, 또 우리 조상들의 율법이 무효가 되어 버렸는지 말입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리 위를 지나가다’.
    reason: previous_rendering
lexical_decisions:
- source_word: de superioribus uiis
  english_pob_choice: about the ways above
  chosen_korean: 위에 있는 것들
  alternatives_korean:
  - 위의 길들
  - 위에 있는 길들
  - 높은 일들
  lexicon: Latin superioribus uiis
  rationale: 문맥상 ‘위에 있는 길/길들’의 문자적 이미지는 유지하되, 한국어에서는 자연스러운 ‘위에 있는 것들’로 풀어 엘리야/천상적 사안에 대한 질문 범위를 가리키게 했습니다.
- source_word: quae pertranseunt per nos cotidie
  english_pob_choice: the things that happen among us daily
  chosen_korean: 우리 가운데 날마다 일어나는 일들
  alternatives_korean:
  - 우리에게 날마다 닥치는 일들
  - 날마다 우리에게 일어나는 일들
  - 우리 가운데 매일 벌어지는 일들
  lexicon: Latin pertranseunt per nos cotidie
  rationale: 영문 보정처럼 단순한 ‘지나감’이 아니라 ‘우리 가운데’ 실제로 발생하는 일임을 살려, 공동체가 겪는 일상적 환난이라는 뜻을 드러냈습니다.
- source_word: in obprobrium gentibus
  english_pob_choice: as a reproach to the nations
  chosen_korean: 민족들 앞에 수치가 되었으며
  alternatives_korean:
  - 민족들에게 욕됨이 되었으며
  - 민족들의 조롱거리가 되었으며
  - 민족들에게 치욕거리가 되었으며
  lexicon: Latin obprobrium
  rationale: obprobrium의 수치/치욕 의미를 살리되, 단순 비난보다 공개적 수치를 강조하는 ‘민족들 앞에 수치’로 옮겼습니다.
- source_word: tribubus impiis
  english_pob_choice: ungodly tribes
  chosen_korean: 경건하지 않은 부족들
  alternatives_korean:
  - 불경한 지파들
  - 악한 부족들
  - 경외함이 없는 부족들
  lexicon: Latin impius
  rationale: tribus를 혈연·정치적 ‘부족’으로 유지하고, impii는 신앙적 결핍을 직설적으로 드러내는 ‘경건하지 않은’으로 번역했습니다.
- source_word: lex patrum nostrorum
  english_pob_choice: the law of our fathers
  chosen_korean: 우리 조상들의 율법
  alternatives_korean:
  - 우리 조상들의 법
  - 우리 조상들의 토라
  - 우리 조상들의 규례
  lexicon: Latin lex
  rationale: 본문의 lex는 전승된 모세 율법을 가리키므로, 한국어 성서어휘에서 가장 직접적인 ‘율법’을 선택했습니다.
theological_decisions:
- issue: 반복되는 'why'의 질문 구조
  chosen_reading: ‘어찌하여’와 ‘말입니다’로 마지막 절까지 같은 탄식을 유지했습니다.
  alternative_readings:
  - 마지막 절을 단순 병렬 서술로 처리
  - 질문을 한 번만 명시하고 나머지는 생략
  rationale: 라틴어의 propter quod 및 병렬 구조가 세 가지 환난을 하나의 탄식으로 묶고 있으므로, 한국어도 질문의 압박감을 보존했습니다.
  doctrine_reference: 수사적 반복과 탄식의 보존
- issue: ‘as a reproach to the nations’의 수치성
  chosen_reading: 민족들 앞에 수치가 되었다고 옮겨, 공개적 굴욕의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 민족들의 조롱거리가 되었다
  - 민족들에게 비난거리가 되었다
  rationale: 본문은 단순 평가가 아니라 타 민족 앞에서의 공적 수치를 말하므로, 공동체적 치욕을 분명하게 드러냈습니다.
  doctrine_reference: 언약 백성의 공적 수치와 징계
