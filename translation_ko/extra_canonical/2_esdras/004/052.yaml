    anchor_ref: '4:52'
translation:
  language: ko
  text: 그대는 거듭 묻습니다. 내가 그대에게 일부는[a] 말해 줄 수 있습니다. 그러나 그대의 삶에 관해서는 그대에게 말하도록 보내심을 받지 않았고, 나도 알지 못합니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 우리엘의 대답은 의도적으로 부분적입니다. 그는 몇 가지 표징은 알려 줄 수 있으나, 에스라의 수명에 대해서는 알려 주지 않습니다. 이 거절은 하나님의 때에 대한 인간의 접근이 제한되어 있다는 이 책의 주제의 일부입니다.
    reason: compositional_layer
