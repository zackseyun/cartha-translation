  lexicon: mittere
  rationale: 수동 구문을 살려 사신적 권한의 부재를 드러내면서도 한국어 문장으로 자연스럽게 만들었습니다.
theological_decisions:
- issue: 지식의 제한과 계시의 범위
  chosen_reading: 대답자는 일부는 알리지만, 생명과 때에 관한 전면적 지식은 위임받지 않았다고 말합니다.
  alternative_readings:
  - 단순한 무지의 고백으로 읽기
  - 정보 은폐로 읽기
  rationale: 문장 끝의 '저는 알지 못합니다'는 무능력만이 아니라, 앞의 '보내심을 받지 않았습니다'와 함께 계시의 범위를 제한하는 진술로 읽는 것이 문맥과 더 잘 맞습니다.
  doctrine_reference: 2 Esdras 4:52의 계시 제한 주제
