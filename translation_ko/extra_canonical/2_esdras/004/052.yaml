  text: You ask insistently; I can tell you in part[a], but concerning your life, I have not been sent to tell you, and I do not know.
  footnotes:
  - marker: a
    text: 'Uriel''s answer remains deliberately partial: he can disclose some signs, but not Ezra''s lifespan. The refusal is part of the book''s theology of limited human access to divine timing.'
    reason: compositional_layer
    anchor_ref: '4:52'
translation:
  language: ko
  text: 당신은 집요하게 묻습니다. 저는 일부만 말할 수 있습니다. 그러나 당신의 생명에 관해서는 말씀드리도록 보내심을 받지 않았으며, 저는 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 '일부만'은 알려 줄 수 있는 표징의 범위를 가리키며, 사람은 하나님의 정하신 때를 전면적으로 알 수 없다는 책의 주제를 드러냅니다.
    reason: theological_note
