  lexicon: vita
  rationale: 문맥상 개인의 수명/운명에 대한 질문이므로 일상적 '삶'보다 더 직접적인 '생명'을 택해 제한된 지식의 대상으로 분명히 했습니다.
- source_word: non sum missus dicere tibi
