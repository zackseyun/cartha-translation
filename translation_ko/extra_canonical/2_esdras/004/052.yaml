  - severity: medium
    issue: 각주 위치 및 내용의 정합성
    rationale: 각주는 ex parte(‘일부는’)를 설명하므로 해당 표현 뒤에 붙이는 것이 적절합니다. 기존 각주는 ‘하나님의 정하신 때’를 단정적으로 덧붙여 영어 POB 주석보다 해석적이므로, 감사 기록의 표현에 맞춰 완화했습니다.
