  text: 그때 나에게 보내심을 받은 천사, 곧 이름이 우리엘인 그가 내게 대답했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: angelus
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 천신
  lexicon: angelus → 천사
  rationale: 라틴어 angelus는 본문 맥락상 하늘의 사자를 뜻하므로, 현대 한국어 성경에서 가장 직접적인 대응인 천사로 옮겼습니다.
- source_word: missus est ad me
  english_pob_choice: had been sent to me
  chosen_korean: 나에게 보내심을 받은
  alternatives_korean:
  - 나에게 보냄을 받은
  - 나에게 파견된
  lexicon: missus est → 보내심을 받다
  rationale: 수동 완료 표현을 살려 ‘이미 보내진 상태’를 드러내되, 현대 한국어에서는 ‘보내심을 받은’이 가장 자연스럽고 의미도 분명합니다.
- source_word: cui nomen Vriel
  english_pob_choice: whose name was Uriel
  chosen_korean: 이름이 우리엘인
  alternatives_korean:
  - 이름이 우리엘인
  - 우리엘이라는 이름의
  lexicon: nomen → 이름
  rationale: 라틴어의 소유절 구조를 한국어의 관형절로 옮겨, 이름을 밝히는 부가 정보를 간결하게 전달했습니다.
theological_decisions:
- issue: 천사 이름의 음역
  chosen_reading: 우리엘
  alternative_readings:
  - 우리엘
  rationale: 고유명사는 본문의 음가를 보존하는 방향으로 음역했고, 이미 한국어 종교어휘에서 통용되는 형태를 따라 표기했습니다.
  doctrine_reference: 고유명사 표기 원칙
