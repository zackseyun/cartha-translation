- from: 그리고 때들을 측량하시고, 때들을 세어 정하시며, 예언된 것이 이루어질 때까지는 그것들을 움직이시지도, 흔들어 깨우시지도 않을 것입니다.”[a]
  to: 그리고 때들을 측량하시고 그 수를 세어 헤아리셨으며, 미리 말씀하신 것이 이루어질 때까지 그것들을 동요시키거나 일깨우지 않으실 것입니다.”
  rationale: 라틴어의 완료형 두 동사와 미래형 부정을 구별하고, ‘정하다’와 ‘흔들어’처럼 원문에 없는 의미를 제거했습니다. praedicta는 문맥상 종말론적 예고를 가리킬 수 있지만 그 자체가 반드시 ‘예언’을 뜻하지는 않으므로 ‘미리 말씀하신 것’으로 중립성을 유지했습니다. 불필요한 어휘 주석과 그 앵커도 삭제했습니다.
