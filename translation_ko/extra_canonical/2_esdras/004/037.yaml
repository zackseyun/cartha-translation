translation:
  language: ko
  text: 그리고 때들을 측량하시고, 때들을 세어 정하시며, 예언된 것이 이루어질 때까지는 그것들을 움직이시지도, 흔들어 깨우시지도 않을 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘측량하시고’는 라틴어 mensurauit의 ‘재어 정하다’는 뉘앙스를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: mensurauit
  english_pob_choice: and measured the times
  chosen_korean: 때들을 측량하시고
  alternatives_korean:
  - 때들을 재시고
  - 때를 재어 정하시고
  lexicon: 측량하다
  rationale: lat. mensurauit는 단순히 수량을 세는 것보다 정해진 기준으로 재어 정한다는 뉘앙스가 있어, 시간/시기를 다루는 문맥에서 ‘측량하다’가 가장 원문에 가깝습니다.
- source_word: numero numerauit
  english_pob_choice: and numbered the times
  chosen_korean: 때들을 세어 정하시며
  alternatives_korean:
  - 때들을 계산하시며
  - 때들을 수효대로 세시며
  lexicon: 세다 / 정하다
  rationale: numero numerauit의 중복은 ‘정확히 수를 매기다’는 강조로 보이므로, 한국어에서는 자연스럽게 ‘세어 정하시며’로 옮겨 중복 강조를 살렸습니다.
- source_word: commouebit nec excitabit
  english_pob_choice: he will not move or stir them
  chosen_korean: 그것들을 움직이시지도, 흔들어 깨우시지도 않을 것입니다
  alternatives_korean:
  - 그것들을 움직이지도, 깨우지도 않을 것입니다
  - 그것들을 옮기지도, 흔들지도 않을 것입니다
  lexicon: 움직이다 / 흔들어 깨우다
  rationale: commouebit와 excitabit는 단순 이동보다 ‘건드려 변화시키다, 일깨우다’의 중첩이 있어, 두 동사를 모두 살리되 한국어에서 자연스러운 대구로 표현했습니다.
- source_word: praedicta
  english_pob_choice: what was foretold
  chosen_korean: 예언된 것이
  alternatives_korean:
  - 미리 말해진 것이
  - 미리 알려진 것이
  lexicon: 예언된 것
  rationale: apocalyptic 문맥과 POB 개정에서 ‘the foretold measure’의 오해를 제거한 점을 따라, 법률적 ‘그 말해진 것’보다 ‘예언된 것’이 원문의 종말론적 뉘앙스를 더 잘 드러냅니다.
theological_decisions:
- issue: 하나님이 정하신 때의 주권적 고정성과 인간/피조물의 개입 불가
  chosen_reading: 하나님이 때를 측량하고 세어 정하셨으며, 예언된 성취 전까지는 그것들을 흔들지 않으신다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 시간들을 단순히 계산하신다는 의미로 축소할 수 있음
  - ‘그것들’이 시기 자체가 아니라 계시된 사건들을 가리킨다는 여지가 있음
  rationale: 문맥상 이 절은 종말의 시기를 하나님의 주권 아래 두는 진술이므로, ‘측량/세어 정함’과 ‘움직이지 않음’의 인과를 약화시키지 않았습니다.
  doctrine_reference: 섭리론 / 종말론
