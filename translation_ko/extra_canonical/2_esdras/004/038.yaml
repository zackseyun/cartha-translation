lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 그리고 내가 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말하고
  - 그리고 내가 응답하여 말했습니다
  lexicon: respondere / dicere
  rationale: 라틴어의 반복 동사 구조를 살려 ‘대답하여 말했습니다’로 옮겨, 단순한 ‘말했습니다’보다 응답의 성격을 분명히 했습니다.
- source_word: dominator domine
  english_pob_choice: Lord who rules
  chosen_korean: 다스리시는 주님
  alternatives_korean:
  - 다스리는 주님
  - 주권자 주님
  lexicon: dominator / dominus
  rationale: dominator의 지배·통치 의미를 드러내되, POB의 ‘Lord who rules’에 맞춰 주님을 수식하는 현재분사형으로 자연스럽게 옮겼습니다.
- source_word: sed et
  english_pob_choice: but also
  chosen_korean: 그러나 또한
  alternatives_korean:
  - 하지만 또한
  - 그리고 또
  lexicon: sed / et
  rationale: 현존하는 라틴어 단편이 문장을 끝맺지 않으므로, 접속 구조만 남겨 미완성성을 보존했습니다.
theological_decisions:
- issue: 문장 단편 보존
  chosen_reading: 현존하는 라틴어가 ‘sed et’에서 끊기므로 한국어도 미완성 문장으로 둡니다.
  alternative_readings:
  - 의미를 보충해 완결된 문장으로 매끈하게 정리하는 번역
  - 앞 구절이나 다음 구절의 내용을 암시적으로 끌어오는 번역
  rationale: 제공된 원문 범위를 넘어 보충하면 본문 증거를 훼손하므로, 단편의 중단 상태를 그대로 드러내는 것이 가장 충실합니다.
  doctrine_reference: source fidelity / textual criticism
