base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/005.yaml
  text: And I said[a], “Speak, my lord.” And he said to me, “Go, weigh for me the weight of fire, or measure for me the measure of wind, or call back for me the day that has passed.”
  footnotes:
  - marker: a
    text: The Latin phrase rendered 'measure for me a measure of wind' is textually awkward. The sense is clearly an impossible demand to quantify the wind, but the exact unit behind the wording is uncertain.
    reason: textual_variant
    anchor_ref: '4:5'
translation:
  language: ko
  text: 그러자 제가 말했습니다. 「말씀하십시오, 제 주인이시여.」 그러자 그가 저에게 말했습니다. 「가서 불의 무게를 저울질하여 나를 위해 달아 보아라. 아니면 바람의 분량을 나를 위해 재어 보아라. 아니면 지나간 그 날을 나를 위해 다시 불러오라.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 mensura ... uenti는 문법적으로 다소 어색하지만, 뜻은 바람을 측정하라는 불가능한 요구로 분명합니다.
    reason: textual_variant
lexical_decisions:
- source_word: dominus meus
  english_pob_choice: my lord
  chosen_korean: 제 주인이시여
  alternatives_korean:
  - 제 주님
  - 주인님
  - 나의 주여
  lexicon: dominus
  rationale: 라틴어 dominus는 문맥상 예의 있는 호칭이지만, 이 외경 문맥에서는 신적 칭호로 단정하지 않고 ‘주인’의 의미를 살려 공손하게 옮기는 것이 더 직접적입니다.
- source_word: pondus ignis
  english_pob_choice: the weight of fire
  chosen_korean: 불의 무게를 저울질하여
  alternatives_korean:
  - 불의 무게를 달아
  - 불의 중량을 재어
  lexicon: pondus
  rationale: pondus는 단순한 ‘무게’이므로 한국어에서도 ‘무게를 저울질하다/달다’로 옮겨 측정 불가능한 요구라는 점을 드러냈습니다.
- source_word: mensura ... uenti
  english_pob_choice: the measure of wind
  chosen_korean: 바람의 분량을 ... 재어 보아라
  alternatives_korean:
  - 바람의 양을 재어 보아라
  - 바람의 척도를 재어 보아라
  lexicon: mensura
  rationale: mensura는 ‘측정된 분량/척도’이지만, 문맥상 바람을 재려는 불가능한 요구를 보여 주므로 ‘분량’으로 자연스럽게 옮겼습니다.
- source_word: reuoca mihi diem quae praeteriit
  english_pob_choice: call back for me the day that has passed
  chosen_korean: 지나간 그 날을 나를 위해 다시 불러오라
  alternatives_korean:
  - 지나간 그 날을 나를 위해 되돌려 오라
  - 지나간 그 날을 나를 위해 불러오라
  lexicon: reuoca
  rationale: reuoca는 ‘다시 불러오다/되돌리다’의 뜻이므로, 지나간 날을 되돌릴 수 없다는 불가능성을 살려 ‘다시 불러오라’로 번역했습니다.
theological_decisions:
- issue: 불가능한 요구들의 병렬 구조
  chosen_reading: 불의 무게, 바람의 분량, 지나간 날을 나란히 제시해 인간의 무능과 하나님의 초월적 지혜를 대비하는 수사로 읽었습니다.
  alternative_readings:
  - 단순한 수수께끼식 표현으로만 읽는 해석
  - 과장법보다 실질적 시험문으로 읽는 해석
  rationale: 라틴어 원문과 영어 POB는 모두 실제 수행 불가능한 명령을 병렬로 배치해, 인간이 통제할 수 없는 것들을 전제로 한 논증을 형성합니다.
  doctrine_reference: 창조 질서와 인간 한계에 대한 지혜문학적 수사
