    rationale: 원문은 ‘바다의 자리/곳’이 그 물결을 bear하도록 배정되었다는 병렬 진술입니다. 바다 자체가 그러한 곳으로 ‘되었다’는 뜻이 아닙니다.
  - severity: medium
