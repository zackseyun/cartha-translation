  source_fidelity: 원문의 병렬 구조(terra ... siluae / maris locus ... fluctus suos)와 생략된 수동 의미를 살려야 합니다. 초안의 ‘바다는 ... 곳이 되었습니다’는 maris locus(‘바다의 자리/곳’)의 주어를 ‘바다’로 바꾸고, portare를 ‘실어 나르다’로 잘못 좁혔습니다.
  naturalness: ‘바다의 자리는 그 물결을 떠받치도록 주어졌습니다’는 현대 표준 한국어에서 자연스럽고, 앞 절의 ‘땅은 숲에 주어졌고’와도 균형을 이룹니다. ‘내가 말했습니다’는 서사 본문에 적합한 합쇼체입니다.
  terminology: cogitationem cogitauerunt은 의도적으로 구상했다는 뜻을 지니므로 ‘헛된 계획을 꾸몄습니다’로 옮겼습니다. fluctus suos는 ‘그 물결’로 번역하여 바다를 가리키는 소유 관계를 자연스럽게 나타냈습니다.
