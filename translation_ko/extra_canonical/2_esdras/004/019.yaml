source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixi: utrique uanam cogitationem cogitauerunt, terra enim data est siluae, et maris locus portare fluctus suos. Et respondit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/019.yaml
  text: I said, “Both have devised a vain plan, for the earth has been given to the forest, and the place of the sea to bear its waves.” And he answered
translation:
  language: ko
  text: 내가 말했습니다. “둘 다 헛된 계획을 꾸몄습니다. 땅은 숲에 주어졌고, 바다의 자리는 그 물결을 떠받치도록 주어졌습니다.” 그리고 그가 대답했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dixi / cogitauerunt
  english_pob_choice: I said / have devised a vain plan
  chosen_korean: 제가 말했습니다 / 헛된 생각을 꾸몄습니다
  alternatives_korean:
  - 내가 말했습니다 / 헛된 계획을 세웠습니다
  - 내가 말했습니다 / 헛된 꾀를 냈습니다
  lexicon: 말하다; 꾸미다; 헛된
  rationale: dixi는 단순한 과거 발화이므로 평이하게 ‘말했습니다’로 옮기고, cogitauerunt은 ‘생각했다’보다 의도적 구상이라는 점을 살려 ‘꾸몄습니다’로 옮겼습니다.
- source_word: terra enim data est siluae
  english_pob_choice: for the earth has been given to the forest
  chosen_korean: 땅은 숲에 주어졌고
  alternatives_korean:
  - 땅은 숲에게 맡겨졌고
  - 땅은 숲의 몫이 되었고
  lexicon: 주다; 땅; 숲
  rationale: data est의 수동형을 살려 ‘주어졌고’로 옮기고, terra와 siluae의 대비를 유지하기 위해 ‘땅’과 ‘숲’을 직접 대응시켰습니다.
- source_word: maris locus portare fluctus suos
  english_pob_choice: and the place of the sea to bear its waves
  chosen_korean: 바다는 자기 물결을 받아 나를 곳이 되었습니다
  alternatives_korean:
  - 바다는 자기 파도를 감당할 곳이 되었습니다
  - 바다의 자리는 자기 물결을 실어 나를 곳이 되었습니다
  lexicon: 장소/자리; bear; waves
  rationale: locus portare의 구조를 ‘나를 곳’으로 풀어 동작 가능성을 드러냈고, fluctus suos는 소유 대명사를 살려 ‘자기 물결’로 옮겼습니다.
theological_decisions:
- issue: 비유적 병렬과 창조 질서의 역설적 진술
  chosen_reading: 본문의 ‘땅/숲’, ‘바다/물결’은 문자적 분류보다 각 영역의 배정과 한계를 말하는 역설적 진술로 유지했습니다.
  alternative_readings:
  - 자연계에 대한 단순 서술로 완화하는 번역
  - 도덕적 교훈을 덧붙여 해석하는 번역
  rationale: 라틴 원문의 병렬과 POB의 직역성을 보존하려면 해석을 과잉 보태기보다, 각 요소가 ‘주어짐’과 ‘받아 나를 곳’이라는 구조 안에서 긴장을 이루도록 두는 것이 적절합니다.
  doctrine_reference: 창조 질서와 피조물의 한계에 대한 일반적 성서적 진술
