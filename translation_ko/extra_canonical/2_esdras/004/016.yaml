  text: 'Likewise also the plan of the waves of the sea: for the sand stood fast and held them back.'
translation:
  language: ko
  text: 마찬가지로 바다 물결의 의도도 그러합니다. 모래가 굳게 버티어 그것들을 막아 냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sumpsit eam
  english_pob_choice: the sand stood fast and held them back
  chosen_korean: 모래가 그것을 굳게 버티고 막아 섰습니다
  alternatives_korean:
  - 모래가 그것을 붙들고 있었습니다
  - 모래가 그것을 견뎌 내며 막았습니다
  lexicon: sumere / sustinere?
  rationale: 라틴어는 파도가 모래에 의해 멈추거나 제지되는 장면을 뜻하며, POB의 'stood fast and held them back'을 따라 모래의 능동적 저항을 자연스러운 한국어로 옮겼습니다.
- source_word: Similiter et cogitatus fluctuum maris
  english_pob_choice: Likewise also the plan of the waves of the sea
  chosen_korean: 그와 같이 바다의 파도도 그러하니
  alternatives_korean:
  - 또한 바다의 파도의 계획도 그러하니
  - 마찬가지로 바다의 파도에 대한 계획도 그러하니
  lexicon: similiter et / cogitatus fluctuum maris
  rationale: cogitatus는 단순한 '생각'이 아니라 '계획/의도'를 가리킬 수 있지만, 한국어에서 '파도의 계획'은 부자연스러우므로 문맥상 반복되는 병행 진술로 풀어 자연스럽게 처리했습니다.
theological_decisions:
- issue: 비인격적 자연현상에 의도나 계획을 부여하는 표현
  chosen_reading: 바다의 파도도 마치 계획을 가진 것처럼 말하지만, 실제 초점은 파도가 모래 앞에서 멈춘다는 비유적 진술로 읽었습니다.
  alternative_readings:
  - 직역하여 '바다의 파도의 계획'으로 남기는 방법
  - 파도의 움직임/충동으로 완화하는 방법
  rationale: 본문은 자연현상을 의인화한 수사이므로, 과도하게 해석하지 않으면서도 이미지의 힘을 보존하는 방향을 택했습니다.
  doctrine_reference: 문학적 의인화의 보존
