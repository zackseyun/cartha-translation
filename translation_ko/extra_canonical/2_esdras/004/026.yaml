  text: And he answered me and said, “If you are, you will see; and if you live, you will often marvel,”
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. “네가 있다면 보게 될 것입니다. 네가 살면 자주 놀라게 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: si fueris
  english_pob_choice: If you are
  chosen_korean: 네가 있으면
  alternatives_korean:
  - 네가 살면
  - 네가 존재하면
  - 네가 있다면
  lexicon: N/A
  rationale: Latin의 조건절을 영어 POB의 수정안처럼 ‘살면’으로 바꾸지 않고, 존재 여부를 직접 반영하는 ‘네가 있으면’으로 옮겼습니다. 한국어로는 자연스럽게 조건의 성립을 표시하면서도 원문의 구분을 유지합니다.
- source_word: uidebis
  english_pob_choice: you will see
  chosen_korean: 보게 될 것이고
  alternatives_korean:
  - 보게 될 것입니다
  - 보게 됩니다
  - 볼 것입니다
  lexicon: N/A
  rationale: 미래의 결과를 단정적으로 드러내는 표준적인 합쇼체로 옮겼습니다.
- source_word: si uixeris
  english_pob_choice: if you live
  chosen_korean: 네가 살면
  alternatives_korean:
  - 네가 살아 있으면
  - 네가 오래 살면
  - 네가 생존하면
  lexicon: N/A
  rationale: 영어 POB의 수정 취지를 반영하되, Latin의 vixeris를 직접 살려 두 번째 조건절을 첫 번째와 구별되게 번역했습니다.
- source_word: frequenter
  english_pob_choice: often
  chosen_korean: 자주
  alternatives_korean:
  - 종종
  - 빈번히
  - 거듭
  lexicon: N/A
  rationale: 부사 frequenter의 반복적 의미를 일상적인 현대 한국어인 ‘자주’로 간결하게 반영했습니다.
theological_decisions:
- issue: 직접화법의 화자 재현과 문체
  chosen_reading: 직접 인용문은 합쇼체로 유지하여 예언적/문답체의 격식을 보존했습니다.
  alternative_readings:
  - 반말체로 평이하게 옮기는 방식
  - 더 고어적인 경어체로 높이는 방식
  rationale: 본문은 문답 형식의 직접 인용이므로, 현대 표준어 합쇼체로도 원문의 진지한 어조와 발화를 충분히 전달할 수 있습니다.
  doctrine_reference: 문체 일관성과 원문 발화 재현 원칙
