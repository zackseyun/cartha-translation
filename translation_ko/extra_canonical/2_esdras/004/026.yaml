    issue: The first conditional phrase is slightly unnatural/ambiguous in Korean.
    rationale: ‘네가 있으면’ may suggest possession rather than existence. ‘네가 있다면’ more naturally expresses the existential conditional while leaving si fueris distinct from ‘네가 살면.’
  revised_text: 그가 내게 대답하여 말했습니다. “네가 있다면 보게 될 것입니다. 네가 살면 자주 놀라게 될 것입니다.”
