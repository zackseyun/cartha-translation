  rationale: 직접 명령 cogita tibi의 의미를 바로잡고, mensura의 문맥상 의미를 ‘분량’으로 조정했습니다. ‘지나간 분량’이라는 표현은 관계절 quae transivit가 mensura를 수식하는 라틴어 어순을 보존하며, ‘훨씬 더 넘쳐났고’는 superabundavit의 과잉·풍성함을 앞선 비유의 비교 관계 안에서 자연스럽게 전달합니다. 시간, 고난, 역사 등으로 비유의 대상을 특정하지 않았습니다.
