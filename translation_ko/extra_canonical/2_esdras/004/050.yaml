  yaml_path: translation/extra_canonical/2_esdras/004/050.yaml
  text: 'And he said to me[a], “Consider for yourself: just as the rain is greater than the drops, and the fire greater than the smoke, so what has passed has greatly exceeded the measure, but the drops and the smoke remain.”'
  footnotes:
  - marker: a
    text: Or 'the measure of what has passed exceeded'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “스스로 생각해 보십시오. 비가 물방울보다 더 크고 불이 연기보다 더 크듯이, 지나간 분량은 훨씬 더 넘쳐났고 물방울과 연기는 남아 있습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 mensura는 ‘분량’으로 옮겼습니다. 문맥에 따라 ‘척도’ 또는 ‘한계’로도 이해할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: cogita tibi
  english_pob_choice: Consider for yourself
  chosen_korean: 너 자신을 생각해 보십시오
  alternatives_korean:
  - 스스로 생각해 보십시오
  - 자신을 숙고해 보십시오
  lexicon: cogito
  rationale: 자기에게 직접 숙고를 요구하는 반성적 명령이므로, 단순한 ‘생각하다’보다 ‘너 자신을 생각해 보십시오’로 대상과 행위를 함께 드러냈습니다.
- source_word: pluvia / guttae / ignis / fumus
  english_pob_choice: rain / drops / fire / smoke
  chosen_korean: 비 / 물방울 / 불 / 연기
  alternatives_korean:
  - 비 / 빗방울 / 불 / 연기
  lexicon: pluvia, guttae, ignis, fumus
  rationale: 대조 구조를 그대로 살리기 위해 자연스럽고 짧은 대응어를 택했고, guttae는 문맥상 ‘방울들’이지만 한국어에서는 ‘물방울’이 가장 간결합니다.
- source_word: superabundavit quae transivit mensura
  english_pob_choice: what has passed has greatly exceeded the measure
  chosen_korean: 지나간 것은 그 측정을 훨씬 넘어섰고
  alternatives_korean:
  - 지나간 것은 그 한계를 훨씬 넘어섰고
  - 지나간 것은 그 측도보다 크게 넘쳤고
  lexicon: superabundavit, quae transivit mensura
  rationale: 라틴어의 비교·과잉 표현을 살리되 자연스러운 합쇼체로 옮겼습니다. ‘측정’은 mensura의 기본값을 보존하지만, 한국어에서는 다소 직역적이어서 문맥상 ‘한계’ 대안도 가능합니다.
- source_word: superaverunt autem guttae et fumus
  english_pob_choice: but the drops and the smoke remain
  chosen_korean: 물방울과 연기는 남아 있습니다
  alternatives_korean:
  - 그러나 물방울과 연기는 남아 있습니다
  - 한편 물방울과 연기는 남아 있습니다
  lexicon: superaverunt
  rationale: 영문 POB의 최종 정리대로 잔존성을 분명히 하기 위해 ‘남아 있습니다’로 옮겼고, 접속사 ‘그러나’는 의미상 허용되지만 라틴어의 단순 대조를 보존하기 위해 본문에서는 생략했습니다.
theological_decisions:
- issue: ‘지나간 것’과 ‘남아 있는 것’의 대비가 시간/분량 중 어느 쪽을 중심으로 하는지
  chosen_reading: 문장 전체를 과거에 속한 것의 압도적 규모와 현재 남아 있는 잔여의 대비로 읽었습니다.
  alternative_readings:
  - 시간의 경과가 남은 시간보다 훨씬 크다는 의미
  - 이미 지나간 고난/역사가 현재보다 훨씬 크다는 은유
  rationale: 라틴어의 비유는 양적 비교(비/물방울, 불/연기)를 통해 ‘지나간 것’과 ‘남은 것’의 비대칭을 말하므로, 한국어에서도 추상화하지 않고 그대로 드러내는 것이 가장 충실합니다.
  doctrine_reference: 문학적 비유 해석 원칙
