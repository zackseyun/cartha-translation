- from: 어찌하여 그대의 그릇이 지극히 높으신 이의 길을 받아들일 수 있으며, 이미 썩어 가는 시대에 닳아 버린 채로 썩지 않음을 깨달을 수 있겠습니까? 내가 이 말들을 듣고 얼굴을 땅에 대고 엎드렸으며, 그에게 말했습니다. "차라리 우리가 존재하지 않았더라면 더 좋았겠습니다."[a]
  to: 어찌하여 그대의 그릇이 지극히 높으신 이의 길을 헤아릴 수 있으며, 이미 부패한 시대에 지쳐 있으면서 썩지 않음을 깨달을 수 있겠습니까? 내가 이 말들을 듣고 얼굴을 땅에 대고 엎드렸으며, 그에게 말했습니다. “차라리 우리가 존재하지 않았더라면 더 좋았겠습니다.”[a]
  rationale: 원문의 capere와 exteritus의 의미를 더 정확하고 자연스러운 한국어로 조정했습니다. 영어 POB 감사 기록에 있는 절 구분 대안은 번역 대안이 아니라 해당 범위만 이 절로 보는 대안임을 각주에서 분명히 했습니다.
