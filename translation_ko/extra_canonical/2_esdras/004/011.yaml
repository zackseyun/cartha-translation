id: 2ES.4.11
reference: 2 Esdras 4:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uas tuum capere altissimi uiam, et iam exteritus corrupto saeculo intelligere incorruptionem? et cum haec audissem, cecidi in faciem meam, Et dixi illi: melius erat nos non adesse,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/011.yaml
  text: how can your vessel grasp the way of the Most High[a], and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face, and I said to him, “It would have been better for us not to exist,”
  footnotes:
  - marker: a
    text: Or 'how can your vessel grasp the way of the Most High, and, already worn out by the corrupt age, understand incorruption?” And when I heard these things, I fell on my face,'.
    reason: previous_rendering
translation:
  language: ko
  text: 어찌하여 그대의 그릇이 지극히 높으신 이의 길을 헤아릴 수 있으며, 이미 부패한 시대에 지쳐 있으면서 썩지 않음을 깨달을 수 있겠습니까? 내가 이 말들을 듣고 얼굴을 땅에 대고 엎드렸으며, 그에게 말했습니다. “차라리 우리가 존재하지 않았더라면 더 좋았겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 이 절을 “어찌하여 그대의 그릇이 지극히 높으신 이의 길을 헤아릴 수 있으며, 이미 부패한 시대에 지쳐 있으면서 썩지 않음을 깨달을 수 있겠습니까?”까지만으로 볼 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: uas tuum
  english_pob_choice: your vessel
  chosen_korean: 그대의 그릇
  alternatives_korean:
  - 당신의 그릇
  - 그대의 용기
  - 그대의 몸
  lexicon: vessel → 그릇
  rationale: 라틴어 uas는 여기서 인간 존재를 담는 ‘그릇’의 비유로 쓰였으므로, 단순한 물건 명칭보다 은유를 살리는 ‘그릇’이 적절합니다.
- source_word: altissimi
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  - 지존자
  lexicon: Most High → 지극히 높으신 이
  rationale: 고유한 신칭을 과도하게 교회식으로 고정하기보다, 원문의 호칭성을 살려 존칭형 표현으로 옮겼습니다.
- source_word: corrupto saeculo / incorruptionem
  english_pob_choice: the corrupt age / incorruption
  chosen_korean: 썩어 가는 시대 / 썩지 않음
  alternatives_korean:
  - 부패한 세대 / 불멸
  - 썩은 세상 / 부패하지 않음
  lexicon: corrupt age / incorruption → 썩어 가는 시대 / 썩지 않음
  rationale: saeculum의 시간·시대적 뉘앙스를 반영해 ‘시대’로 옮기고, incorruptio의 추상성을 살려 ‘썩지 않음’으로 대응했습니다.
- source_word: et cum haec audissem, cecidi in faciem meam
  english_pob_choice: And when I heard these things, I fell on my face
  chosen_korean: 내가 이 말들을 듣고 얼굴을 땅에 대고 엎드렸으며
  alternatives_korean:
  - 내가 이 말을 듣고 얼굴을 땅에 대고 엎드렸으며
  - 이런 말을 듣고 나는 얼굴을 땅에 대고 엎드렸으며
  lexicon: fell on my face → 얼굴을 땅에 대고 엎드리다
  rationale: 관용적 의미를 살리면서도 라틴어의 직접적 몸짓 이미지를 보존하기 위해 ‘얼굴을 땅에 대고 엎드리다’로 옮겼습니다.
- source_word: melius erat nos non adesse
  english_pob_choice: It would have been better for us not to exist
  chosen_korean: 차라리 우리가 존재하지 않았더라면 더 좋았겠습니다
  alternatives_korean:
  - 우리가 있지 않았더라면 더 좋았겠습니다
  - 차라리 우리가 없었더라면 더 나았겠습니다
  lexicon: not to exist → 존재하지 않았더라면
  rationale: adesse는 단순한 ‘있다’보다 존재론적 ‘존재하다’에 가깝고, 영어 POB의 의미를 분명히 반영하기 위해 ‘존재하지 않았더라면’으로 옮겼습니다.
theological_decisions:
- issue: ‘지극히 높으신 이’의 신칭 처리
  chosen_reading: 본문에서는 신명칭을 직접 단정하기보다, 원문의 호칭적 표현을 유지했습니다.
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  rationale: 이 구절은 하나님의 초월성과 인간 인식의 한계를 대비시키므로, 호칭의 기능을 유지하는 것이 원문의 수사와 잘 맞습니다.
  doctrine_reference: 신적 초월성과 인간의 유한성
