  naturalness: ‘그릇이 길을 받아들이다’는 현대 한국어에서 은유적 결합이 다소 부자연스럽습니다. ‘그릇이 ... 길을 헤아리다’와 ‘지쳐 있으면서’가 문맥과 합쇼체에 더 자연스럽습니다.
  terminology: ‘지극히 높으신 이’, ‘그릇’, ‘썩지 않음’은 신칭과 핵심 대조를 보존합니다. ‘부패한 시대’는 corrupto saeculo의 의미를 더 직접적으로 전달합니다.
  issues:
