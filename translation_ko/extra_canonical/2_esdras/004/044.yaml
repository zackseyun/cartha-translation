lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 저는 대답하여 말했습니다
  alternatives_korean:
  - 그리고 저는 대답하고 말했습니다
  - 저는 대답하여 이르렀습니다
  lexicon: 응답하다, 말하다
  rationale: 라틴어의 반복된 서술 동사를 자연스럽게 합쇼체로 옮기되, 응답의 행위와 발화를 모두 살렸습니다.
- source_word: si inueni gratiam
  english_pob_choice: If I have found favor
  chosen_korean: 만일 제가 … 은총을 얻었다면
  alternatives_korean:
  - 만일 제가 … 은혜를 얻었다면
  - 만일 제가 … 호의를 얻었다면
  lexicon: gratia
  rationale: gratiam은 문맥상 ‘은총/호의’가 가능하지만, 한국어에서는 ‘은총을 얻다’가 관용적으로도 자연스럽고 원문의 ‘찾다/얻다’ 의미를 살리기에 적합합니다.
- source_word: ante oculos tuos
  english_pob_choice: before your eyes
  chosen_korean: 주님의 눈앞에서
  alternatives_korean:
  - 주님의 눈앞에
  - 당신의 눈앞에서
  lexicon: 관용적 신체 은유
  rationale: 직역의 ‘눈앞에’를 유지하되, 서술 대상이 하나님께 드리는 말이라는 점을 반영하여 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 절이 중간에서 끊겨 끝맺지 않는 형태
  chosen_reading: 현존 라틴어가 문장 끝을 제공하지 않으므로, 한국어도 미완성 구조를 그대로 보존했습니다.
  alternative_readings:
  - 문맥상 완결되도록 보충 번역
  - 뒤를 암시해 자연스럽게 마무리
  rationale: 공인된 절 단편의 범위를 넘어 내용을 보충하면 소스 충실성이 훼손되므로, 남은 접속사 ‘그리고’까지 포함해 열린 구조를 유지했습니다.
  doctrine_reference: source fidelity / fragmentary text handling
