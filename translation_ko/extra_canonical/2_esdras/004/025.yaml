translation:
  language: ko
  text: 긍휼을 얻으려는 것입니다. 그러나 자기 이름을 위해서는 무엇을 하시겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 여기서 문장이 끝나며, 다음 절의 내용은 포함하지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: misericordiam consequi
  english_pob_choice: to obtain mercy
  chosen_korean: 긍휼을 얻으려는 것입니다
  alternatives_korean:
  - 은혜를 얻으려는 것입니다
  - 자비를 받으려는 것입니다
  lexicon: misericordia
  rationale: 라틴어 miser icordiam은 하나님의 불쌍히 여기심과 자비를 뜻하므로, POB의 영문 ‘mercy’를 따라 ‘긍휼’로 옮겼습니다. 동사구 consequi는 결과 지향의 ‘얻다/획득하다’로 처리했습니다.
- source_word: Sed quid faciet
  english_pob_choice: But what will he do
  chosen_korean: 그러나 무엇을 하시겠습니까
  alternatives_korean:
  - 그런데 무엇을 하실 것입니까
  - 하지만 무엇을 하실까요
  lexicon: sed / quid faciet
  rationale: sed의 반전은 ‘그러나’로, quid faciet는 직역적이면서도 한국어 문장으로 자연스러운 미래 의문문으로 옮겼습니다.
- source_word: nomini suo
  english_pob_choice: for his name
  chosen_korean: 자기 이름을 위해서는
  alternatives_korean:
  - 그의 이름을 위해서는
  - 자기 이름 때문에
  lexicon: nomen
  rationale: nomini suo는 단순한 ‘이름’이 아니라 주체의 명성과 권위를 가리킬 수 있으나, 제공된 구문이 여기서는 소유격 목적 용법을 유지하므로 ‘자기 이름을 위해서는’로 간결하게 살렸습니다.
theological_decisions:
- issue: Verse boundary and unfinished clause
  chosen_reading: 이 절은 ‘quod’에서 끝나는 미완성 구문으로 처리하고, 다음 절로 이어지는 내용을 여기서 보충하지 않았습니다.
  alternative_readings:
  - 영문 POB의 이전 판본처럼 다음 절의 내용을 일부 합쳐 번역함
  - 의미를 매끈하게 만들기 위해 문장을 보완해 완결형으로 옮김
  rationale: 제공된 라틴어 본문은 4:25에서 ‘quod’까지이며, 절 경계를 넘는 내용을 섞지 않아야 원문과 주석 대조가 가능합니다.
  doctrine_reference: 본문 비평 및 절 경계 보존
- issue: Rendering of misericordia
  chosen_reading: ‘긍휼’로 번역해 하나님의 자비로운 베푸심을 드러냈습니다.
  alternative_readings:
  - 자비
  - 은혜
  rationale: 이 문맥에서 misericordia는 감정적 동정이 아니라 구원적 자비를 뜻하므로, 한국어 성경 전통과의 연속성을 가지면서도 의미를 분명히 하는 ‘긍휼’이 적합합니다.
  doctrine_reference: 하나님의 자비와 긍휼
