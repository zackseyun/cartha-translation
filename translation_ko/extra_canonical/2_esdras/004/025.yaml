  source_fidelity: 초안은 misericordiam consequi와 Sed quid faciet nomini suo를 대체로 충실히 옮겼고, 다음 절의 내용을 본문에 섞지 않은 점은 적절합니다. 그러나 제공된 라틴어는 관계대명사 quod(‘…한/which’)에서 문법적으로 미완결된 채 끝나는데, 현 번역은 이를 완결된 의문문으로 만들어 quod의 존재와 절-간 연결을 보존하지 못합니다.
  naturalness: ‘긍휼을 얻으려는 것입니다’는 문맥상 이해되지만, consequi의 부정법을 ‘얻으려는’이라는 의도 표현으로 바꾸는 것보다 ‘얻는 것’이 더 직접적입니다. 미완성 관계절은 한국어에서 줄임표를 써서 표시하는 방식이 가장 명료하며, 이것은 원문 자체의 절 경계상 미완결을 정직하게 드러냅니다.
