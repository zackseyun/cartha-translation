  text: And I answered and said, “Who among those born can do this, that you ask me about these things?”
translation:
  language: ko
  text: 나는 대답하여 말했습니다. “당신께서 나에게 이런 일들을 물으실 정도로, 태어난 이들 가운데 누가 이것을 할 수 있겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: And I answered and said
  chosen_korean: 나는 대답하여 말했습니다
  alternatives_korean:
  - 내가 대답하여 말했습니다
  - 대답하여 말했습니다
  lexicon: respondi / dixi
  rationale: 두 동사의 병렬을 살리되, 현대 한국어에서는 자연스럽게 한 문장으로 묶어 화자의 응답 행위를 분명히 드러냈습니다.
- source_word: quis natorum
  english_pob_choice: Who among those born
  chosen_korean: 태어난 자들 가운데 누가
  alternatives_korean:
  - 태생자들 가운데 누가
  - 사람들 가운데 누가
  lexicon: quis / natorum
  rationale: natorum의 출생된 존재라는 뜻을 직접 살려, 일반적인 '사람'보다 범위를 더 분명하게 유지했습니다.
- source_word: poterit hoc facere
  english_pob_choice: can do this
  chosen_korean: 이것을 할 수 있겠습니까
  alternatives_korean:
  - 이 일을 할 수 있겠습니까
  - 이것을 해낼 수 있겠습니까
  lexicon: poterit / hoc facere
  rationale: poterit의 가능성을 살리면서 hoc facere를 가장 직접적으로 옮겨, 과도한 의역을 피했습니다.
- source_word: de his
  english_pob_choice: about these things
  chosen_korean: 이 일들에 대해
  alternatives_korean:
  - 이것들에 대해
  - 이런 일들에 대해
  lexicon: de his
  rationale: de his의 지시적 대상을 그대로 반영하되, 한국어에서 자연스러운 '이 일들'로 처리했습니다.
theological_decisions:
- issue: 수사적 질문의 톤
  chosen_reading: 질문 자체를 반박적·한계 인식의 발화로 유지했습니다.
  alternative_readings:
  - 더 순한 설명문처럼 완화하기
  - 단정적 거절로 바꾸기
  rationale: 문맥상 화자는 인간의 한계를 드러내며 반문하고 있으므로, 질문형을 유지해야 원문의 긴장감이 살아납니다.
  doctrine_reference: 문맥적 수사 유지
