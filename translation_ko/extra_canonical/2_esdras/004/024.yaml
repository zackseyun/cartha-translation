    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  english_pob_choice: the written ordinances
  chosen_korean: 문서화된 규례들
  alternatives_korean:
  - 기록된 규례들
  - 문서로 된 명령들
