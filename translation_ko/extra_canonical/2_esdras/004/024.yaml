    anchor_ref: '4:24'
translation:
  language: ko
  text: 그 문서화된 규례들은 어디에서도 찾아볼 수 없습니다. 우리는 메뚜기처럼 이 시대를 지나가며, 우리 생명은 증기와 같고, 우리는 합당하지도 않습니다,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘문서화된 규례들’은 재난 속에서 이스라엘의 권위 있는 기록 규범이 사실상 효력을 잃었음을 가리킬 가능성이 있으며, 모든 사본이 물리적으로 사라졌다는 뜻일 필요는 없습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: dispositionis scriptae
  english_pob_choice: the written ordinances
  chosen_korean: 문서화된 규례들
  alternatives_korean:
  - 기록된 규례들
  - 문서로 된 명령들
  - 기록된 율례들
  lexicon: regulation / ordinance
  rationale: 원문은 단순한 ‘기록’이 아니라 효력을 띤 규범적 문서의 부재를 가리키므로, ‘문서화된 규례들’로 옮겨 문서성과 규범성을 함께 살렸습니다.
- source_word: nusquam sunt
  english_pob_choice: are nowhere to be found
  chosen_korean: 어디에서도 찾아볼 수 없습니다
  alternatives_korean:
  - 어디에도 없습니다
  - 어디서도 발견되지 않습니다
  lexicon: existence / availability
  rationale: 물리적 소실보다 가용성의 부재를 나타내므로, 영어 POB의 주석 취지에 맞게 ‘찾아볼 수 없습니다’로 자연스럽게 표현했습니다.
- source_word: pertransimus de saeculo
  english_pob_choice: we pass through the age
  chosen_korean: 우리는 이 시대를 지나가며
  alternatives_korean:
  - 우리는 시대를 지나가며
  - 우리는 세상을 지나가며
  lexicon: pass through the age
  rationale: revision pass의 ‘pass through the age’를 반영해 ‘지나가며’로 옮겼고, saeculum의 시간적-역사적 감각을 살리기 위해 ‘이 시대’를 택했습니다.
- source_word: ut locustae / ut uapor
  english_pob_choice: like locusts / like vapor
  chosen_korean: 메뚜기처럼 / 증기와 같고
  alternatives_korean:
  - 메뚜기들처럼 / 안개와 같고
  - 메뚜기 떼처럼 / 수증기와 같고
  lexicon: simile
  rationale: 비유의 날카로움을 그대로 유지하되 한국어에서 자연스러운 이미지를 위해 ‘메뚜기처럼’, ‘증기와 같고’로 간결하게 살렸습니다.
theological_decisions:
- issue: 마지막 절의 미완성된 결말
  chosen_reading: “우리는 합당하지도 않습니다,”로 끝을 열어 두었습니다.
  alternative_readings:
  - “우리는 합당하지도 않습니다.”로 마침표를 찍는 읽기
  - “우리는 합당하지 않습니다”로 일반화하는 읽기
  rationale: 원문이 and nec digni sumus에서 문장이 끊기듯 끝나므로, 한국어에서도 쉼표로 남겨 미완의 탄식과 문맥적 긴장을 보존했습니다.
  doctrine_reference: textual fidelity / discourse structure
