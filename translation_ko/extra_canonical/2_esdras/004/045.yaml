source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: possibile est, et si idoneus sum, Demonstra mihi et hoc, si plus quam praeteriit habet uenire, aut plura pertransierunt super
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/045.yaml
  text: 'If it is possible[a], and if I am fit, show me this also: whether more is to come than has passed, or whether more has passed over.'
  footnotes:
  - marker: a
    text: Or 'or whether more has passed than is to come.'.
    reason: previous_rendering
translation:
  language: ko
  text: 만일 그것이 가능하고 제가 자격이 있다면, 이것도 제게 보여 주십시오. 곧 지나간 것보다 앞으로 올 것이 더 많은지, 아니면 더 많은 것이 지나갔는지 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지나간 것이 앞으로 올 것보다 더 많은지’.
    reason: previous_rendering
lexical_decisions:
- source_word: possibile est, et si idoneus sum
  english_pob_choice: If it is possible, and if I am fit
  chosen_korean: 만일 그것이 가능하고, 제가 합당하다면
  alternatives_korean:
  - 만일 가능하다면, 그리고 제가 적합하다면
  - 그것이 가능하고 제가 준비되었다면
  lexicon: possibile est / idoneus sum
  rationale: possibile est의 가능성 조건과 idoneus sum의 자격·적합성 판단을 함께 살려, 단순한 능력 문제가 아니라 ‘합당함/자격’의 뉘앙스를 드러냈습니다.
- source_word: Demonstra mihi et hoc
  english_pob_choice: show me this also
  chosen_korean: 이것도 제게 보여 주십시오
  alternatives_korean:
  - 이것도 저에게 나타내 주십시오
  - 이 일도 제게 알려 주십시오
  lexicon: demonstro
  rationale: demonstro는 단순 통보보다 ‘드러내 보이다, 보여 주다’가 더 가깝기 때문에 직역에 가까운 표현을 택했습니다.
- source_word: si plus quam praeteriit habet uenire
  english_pob_choice: whether more is to come than has passed
  chosen_korean: 더 많은 것이 지나온 것인지, 아니면 더 많은 것이 지나가고 있는 것인지
  alternatives_korean:
  - 앞으로 올 것이 지나간 것보다 더 많은지
  - 지나온 것보다 더 올 것이 많은지
  lexicon: plus quam praeteriit habet uenire
  rationale: 라틴어의 비교 구문을 한국어에서 자연스럽게 풀되, 시간의 전후 대비가 유지되도록 ‘지나온 것’과 ‘지나가고 있는 것’의 대조로 옮겼습니다.
- source_word: aut plura pertransierunt super
  english_pob_choice: or whether more has passed over
  chosen_korean: 아니면 더 많은 것이 지나가고 있는 것인지
  alternatives_korean:
  - 아니면 더 많은 것이 지나갔는지
  - 아니면 더 많은 것이 우리 위로 지나갔는지
  lexicon: pertranseo
  rationale: 본문의 전승 차이와 영어 POB의 수정 취지를 반영하여, ‘super [nos]’를 한국어 본문에는 명시하지 않고 시간의 흐름을 가리키는 동사 중심으로 옮겼습니다.
theological_decisions:
- issue: 시간의 흐름을 묻는 비교적 표현
  chosen_reading: 본문을 종말론적 ‘더 많음’의 수량 비교로 두지 않고, 무엇이 더 많이 이미 지나갔고 무엇이 더 남았는지를 묻는 시간적 대비로 읽었습니다.
  alternative_readings:
  - 미래와 과거의 양적 비교
  - 인류 역사 전체의 남은 분량에 대한 질문
  rationale: 라틴어 문맥과 POB 수정본은 시간의 경과에 대한 질문을 가리키므로, 본문을 과도하게 상징화하지 않고 질문의 직접 대상을 보존했습니다.
  doctrine_reference: 해석학적 절제와 문맥 우선 원칙
