id: 2ES.4.8
reference: 2 Esdras 4:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Dicebas fortassis mihi : in abyssum non descendi, neque in infernum adhuc, neque in caelis unquam ascendi.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/008.yaml
  text: Perhaps you would have said to me[a], ‘I have not descended into the abyss, nor yet into Hades, nor have I ever ascended into heaven.’
  footnotes:
  - marker: a
    text: Or 'Hades'.
    reason: previous_rendering
translation:
  language: ko
  text: “아마 당신은 저에게 이렇게 말했을 것입니다. ‘나는 아직 abyss로 내려가지 않았고, 하데스로도 내려가지 않았으며, 하늘에도 한 번도 올라간 적이 없습니다.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 영문 POB의 이전 표기 ‘Hades’는 라틴어 infernum에 대한 해석어입니다. 본 문맥에서는 고유명사적 지시를 살려 ‘하데스’로 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: in abyssum
  english_pob_choice: the abyss
  chosen_korean: abyss
  alternatives_korean:
  - 깊은 곳
  - 심연
  - 무저갱
  lexicon: abyss
  rationale: 라틴어 abyssum은 문자적으로 ‘깊은 곳’이지만, POB의 영문 선택이 ‘abyss’이므로 종말론적·우주론적 뉘앙스를 유지해 음역형 차용어로 옮겼습니다.
- source_word: in infernum
  english_pob_choice: Hades
  chosen_korean: 하데스
  alternatives_korean:
  - 저승
  - 음부
  - 지하세계
  lexicon: Hades
  rationale: 영문 POB가 이전의 ‘the underworld’ 대신 ‘Hades’로 되돌린 본문 결정을 따라, 한국어에서는 대응어 ‘하데스’를 사용해 고유명사적 지시를 드러냈습니다.
- source_word: in caelis
  english_pob_choice: heaven
  chosen_korean: 하늘
  alternatives_korean:
  - 하늘들
  - 하늘나라
  - 천국
  lexicon: heaven
  rationale: caelis의 복수형을 한국어 자연성에 맞게 단수 의미의 ‘하늘’로 옮기되, 종교적 관습어인 ‘천국’보다 원문적 공간 개념을 더 직접적으로 살렸습니다.
- source_word: Dicebas fortassis mihi
  english_pob_choice: Perhaps you would have said to me
  chosen_korean: 아마 당신은 저에게 이렇게 말했을 것입니다
  alternatives_korean:
  - 혹시 당신은 저에게 말했을지도 모릅니다
  - 아마도 내게 이렇게 말했을 것입니다
  lexicon: perhaps you would have said to me
  rationale: 조건적·가정적 완곡 표현을 살려 ‘아마…말했을 것입니다’로 옮겼고, 수신자가 직접 반박하는 구도를 분명히 하기 위해 ‘저에게’와 인용 구조를 유지했습니다.
theological_decisions:
- issue: 저자가 말하는 사후/상승의 3중 부정 표현
  chosen_reading: ‘abyss–Hades–heaven’의 삼중 대비를 그대로 보존해, 피조물의 한계와 초월 불가능성을 강조했습니다.
  alternative_readings:
  - ‘깊은 곳–저승–천상’으로 일반화
  - 서술을 완만하게 해석하여 상징적 한계만 제시
  rationale: 본절은 우주적 하강·상승의 범위를 연쇄적으로 부정하는 수사이므로, 전통적 교회 용어로 평탄화하지 않고 원문의 긴장을 유지하는 것이 더 정확합니다.
  doctrine_reference: 사후 세계와 천상의 경계에 대한 묘사
