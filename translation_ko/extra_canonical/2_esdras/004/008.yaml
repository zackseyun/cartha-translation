  naturalness: ‘심연’, ‘지하 세계’, ‘하늘’은 현대 표준 한국어에서 자연스럽고, 직접 인용문도 합쇼체로 정리하면 대상 변이의 문체 요구에 맞습니다. 각주 표지는 ‘저에게’ 뒤에 두어 영어 POB의 해당 표지 위치와 기능을 따릅니다.
