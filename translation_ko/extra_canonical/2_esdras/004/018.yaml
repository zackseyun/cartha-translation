translation:
  language: ko
  text: 무엇을 의롭다 하시겠습니까, 아니면 누구를 정죄하시겠습니까? 그리고 나는 대답하여[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 source의 quem은 앞선 의인화된 대상들을 가리키므로, 한국어로는 ‘무엇’ 또는 ‘누구’가 모두 가능하지만 여기서는 문맥의 대상 불특정을 살려 ‘무엇’으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: incipiebas iustificare
  english_pob_choice: would you begin to justify
  chosen_korean: 무엇을 의롭다 하시겠습니까
  alternatives_korean:
  - 무엇을 의롭다 하기 시작하시겠습니까
  - 누구를 의롭다 하시겠습니까
  lexicon: iustificare
  rationale: 라틴어 incipiebas + 부정사 구조는 이 문맥에서 단순한 ‘시작하다’보다 가능·조건의 뉘앙스가 강하므로, POB의 수정 취지에 맞게 ‘의롭다 하시겠습니까’로 자연스럽게 옮기되, 그 대상을 이어지는 문맥상 ‘무엇’으로 잡았습니다.
- source_word: quem condemnare
  english_pob_choice: whom condemn
  chosen_korean: 누구를 정죄하시겠습니까
  alternatives_korean:
  - 무엇을 정죄하시겠습니까
  - 누구를 정죄하기 시작하시겠습니까
  lexicon: condemnare
  rationale: condemnare는 법정적 판정의 ‘정죄하다’가 가장 직접적이며, 인칭 대명사 quem을 살려 ‘누구를’로 옮기되, 앞절과 평행을 이루게 했습니다.
- source_word: Et respondi et
  english_pob_choice: And I answered and
  chosen_korean: 그리고 나는 대답하여
  alternatives_korean:
  - 그리고 나는 대답했고
  - 그리고 내가 대답하여
  lexicon: et respondi et
  rationale: 원문이 단편적으로 끝나므로 한국어도 미완결감을 유지해야 하며, 반복된 et를 살려 다음 절이 이어질 것을 예고하는 형태로 남겼습니다.
theological_decisions:
- issue: 의롭다 하다와 정죄하다의 법정적 대조
  chosen_reading: ‘의롭다 하다’와 ‘정죄하다’를 법정적 판정으로 대칭시켜 유지했습니다.
  alternative_readings:
  - ‘옳다 하다’/‘유죄 판결하다’로 완화
  - 도덕적 평가 표현으로 일반화
  rationale: 이 구절은 판단의 권한을 묻는 대조 구조이므로, 교리적으로도 법정적·선언적 뉘앙스를 흐리지 않는 번역이 필요합니다.
  doctrine_reference: 법정적 의롭다 하심/정죄의 대조
