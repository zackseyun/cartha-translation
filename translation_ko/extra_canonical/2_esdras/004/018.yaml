    rationale: 현 영어 POB 감사 이력의 최종 수정 및 라틴어 표면 의미에 따라, 여기서는 ‘의롭다 하기 시작하시겠습니까’로 옮겨야 합니다.
  - severity: medium
    issue: 첫 목적어를 ‘무엇’으로, 둘째 목적어를 ‘누구’로 달리 옮기고 주석에서 이를 설명합니다.
    rationale: 라틴어의 첫 목적어는 생략되어 있으나 뒤의 quem과 평행을 이루며, 앞 문맥의 의인화를 고려하면 양쪽에 ‘누구’를 쓰는 편이 자연스럽고 충실합니다. 기존 주석은 본문 선택과도 일치하지 않습니다.
  - severity: low
