  source_fidelity: 라틴어 incipiebas iustificare의 미완료·시작 동사는 이 문맥에서 단순 미래/가능으로 약화시키지 않고 ‘의롭다 하기 시작하다’로 반영하는 것이 안전합니다. quem은 앞선 의인화된 피조물들을 받을 수 있으므로 한국어 ‘누구’를 양쪽 절에 평행하게 두는 것이 적절합니다. 끝의 Et respondi et는 원문 단편의 미완결성을 보존해야 합니다.
  naturalness: ‘누구를 의롭다 하기 시작하시겠습니까, 아니면 누구를 정죄하시겠습니까?’는 현대 표준어 합쇼체로 자연스럽고, 대조와 평행도 분명합니다. ‘그리고 나는 대답하고’는 의도적으로 다음 말이 이어지지 않은 원문의 절단을 재현합니다.
  terminology: iustificare/condemnare의 법정적 대조는 ‘의롭다 하다/정죄하다’로 유지했습니다. 기존의 ‘무엇’/‘누구’ 혼용 및 그에 관한 주석은 본문 평행성과 맞지 않으므로 제거했습니다.
