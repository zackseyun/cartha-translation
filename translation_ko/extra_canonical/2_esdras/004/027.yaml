  yaml_path: translation/extra_canonical/2_esdras/004/027.yaml
  text: because the age is hastening quickly to pass away. For it cannot bear the things that have been promised for the righteous in their proper times, because this age is full of sorrows and weaknesses.
translation:
  language: ko
  text: 그 시대가 급히 지나가고 있기 때문입니다. 의인들을 위해 정해진 때에 약속된 것들을 그 시대가 감당할 수 없기 때문입니다. 왜냐하면 이 시대는 슬픔과 연약함으로 가득 차 있기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘급히 급히/서두르며 서둘러’에 가까운 중첩 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: festinans festinat
  english_pob_choice: is hastening quickly
  chosen_korean: 급히 지나가고 있기
  alternatives_korean:
  - 서둘러 지나가고 있기
  - 빠르게 지나가고 있기
  lexicon: festinare
  rationale: 반복 구조가 속도와 임박성을 함께 강조하므로, 자연스러운 합쇼체로 ‘급히’와 진행형을 사용해 긴박감을 살렸습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 그 시대
  alternatives_korean:
  - 이 세상
  - 이 시대
  - 세대
  lexicon: saeculum
  rationale: 문맥상 단순한 ‘세상’보다 현재 질서/시대를 가리키는 뜻이 강해 ‘시대’로 옮기되, 앞의 지시를 살려 ‘그 시대’로 표현했습니다.
- source_word: iustis
  english_pob_choice: the righteous
  chosen_korean: 의인들을
  alternatives_korean:
  - 의로운 사람들을
  - 의롭게 된 이들을
  lexicon: iustus
  rationale: 라틴어 iusti는 윤리적 성품보다 하나님 앞의 의로움을 가리키므로, 한국어 성경 문맥에 맞는 ‘의인’이 가장 직접적입니다.
- source_word: mesticia
  english_pob_choice: sorrows
  chosen_korean: 슬픔
  alternatives_korean:
  - 근심
  - 비탄
  - 고통
  lexicon: mesticia
  rationale: 복수형 느낌은 문맥의 병렬상 ‘슬픔과 연약함’으로 충분히 전달되므로, 과도한 확장을 피하고 표준적 감정어를 택했습니다.
- source_word: infirmitatibus
  english_pob_choice: weaknesses
  chosen_korean: 연약함
  alternatives_korean:
  - 약함
  - 허약함
  - 무력함
  lexicon: infirmitas
  rationale: 단순한 신체적 약함뿐 아니라 이 시대의 취약성과 무능함을 함께 담아, 추상명사 ‘연약함’이 가장 균형 있습니다.
theological_decisions:
- issue: ‘정해진 때에 약속된 것들’의 시간성
  chosen_reading: 약속은 의인들을 위해 준비되었지만, 현재 시대는 그것을 감당할 수 없다는 대비를 살렸습니다.
  alternative_readings:
  - ‘의인들에게 약속된 것들’
  - ‘의인들을 위하여 약속된 것들’
  rationale: 라틴어 repromissa sunt와 in temporibus iustis의 결합은 약속의 수혜와 성취 시점을 함께 말하므로, 수혜자와 때를 모두 드러내는 표현이 적절합니다.
  doctrine_reference: 종말론적 지연과 현재 시대의 한계에 대한 문맥적 해석
