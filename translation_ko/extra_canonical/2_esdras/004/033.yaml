  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quo et quando haec? quare modici et mali anni nostri? Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/033.yaml
  text: And I answered and said, “How long, and when will these things be? Why are our years few and evil?”
translation:
  language: ko
  text: “그것들은 언제이고 언제 이루어집니까? 왜 우리의 해는 적고 악합니까?” 하고 제가 대답하였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quo et quando haec?
  english_pob_choice: How long, and when will these things be?
  chosen_korean: “그것들은 언제이고 언제 이루어집니까?”
  alternatives_korean:
  - “이 일들은 언제이며, 언제 일어납니까?”
  - “이것들은 언제이고, 언제 이루어집니까?”
  lexicon: quando / haec
  rationale: haec는 앞서 언급된 사건들을 가리키는 대명사로 처리하고, quando는 시점을 묻는 말로 살려 영어 POB의 이중 질문 구조를 자연스럽게 옮겼습니다.
- source_word: quare modici et mali anni nostri?
  english_pob_choice: Why are our years few and evil?
  chosen_korean: “왜 우리의 해는 적고 악합니까?”
  alternatives_korean:
  - “왜 우리의 세월은 짧고 악합니까?”
  - “왜 우리의 해가 적고 악합니다?”
  lexicon: modici / mali
  rationale: modici를 ‘적고/짧고’의 의미 범위 안에서 ‘적고’로, mali를 도덕적·경험적 고통을 함께 담는 ‘악한/악한’의 뜻으로 살렸습니다.
theological_decisions:
- issue: 수사적 탄식의 보존
  chosen_reading: 문장은 단순 정보 요청이 아니라 고난 아래서의 탄식 섞인 질문으로 읽히므로, 한국어도 반문형을 유지했습니다.
  alternative_readings:
  - 평서형으로 완화하여 ‘그것들이 언제인지, 왜 우리의 해가 적고 악한지 물었습니다’로 옮길 수 있음
  rationale: 원문과 영어 POB 모두 질문 형식을 유지하므로, 탄식의 정서를 약화하지 않는 쪽이 더 충실합니다.
  doctrine_reference: 문맥상 지혜 문학적/묵시적 탄식 표현
