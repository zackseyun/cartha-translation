id: 2ES.4.35
reference: 2 Esdras 4:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: suis dicentes, usquequo spero sic? et quando uenit fructus areae mercedis nostrae? Et respondit ad eas Hieremiel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/035.yaml
  text: Did not the souls of the righteous ask about these things in their chambers[a], saying, ‘How long shall I hope thus? And when will the fruit of the threshing floor of our reward come?’ And Jeremiel answered them[b],
  footnotes:
  - marker: a
    text: 'The image of souls in ''storehouses'' anticipates the childbirth analogy in vv. 40-42: they are kept in reserved places until the appointed number is complete.'
    reason: cross_reference
    anchor_ref: '4:35'
  - marker: b
    text: Or 'also ask about these things in their storehouses, saying, ‘How long shall I hope'.
    reason: previous_rendering
translation:
  language: ko
  text: 의인들의 영혼들이 그들의 방에서[a] 이런 일들을 두고, “언제까지 내가 이처럼 바라야 합니까? 그리고 우리 보상의 타작마당의 열매는 언제 올 것입니까?” 하고 물었습니다. 그러자 예레미엘이 그들에게 대답했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 ‘방’의 이미지는 40–42절의 출산 비유와 연결됩니다. 영혼들은 정해진 때까지 따로 마련된 곳에 있는 것으로 묘사됩니다.
    reason: cross_reference
lexical_decisions:
- source_word: suis
  english_pob_choice: in their chambers
  chosen_korean: 자기들의 방에서
  alternatives_korean:
  - 자기들의 저장소에서
  - 자기들의 창고에서
  - 자기들의 방들에서
  lexicon: suis → 방
  rationale: 라틴어 suis는 문맥상 영혼들이 머무는 ‘보관된 장소’를 가리키지만, 영어 POB의 보충 해석을 그대로 따라 ‘창고’로 고정하기보다 한국어에서는 보다 중립적인 ‘방’으로 옮겨 원문의 장소감과 뒤의 출산 비유와의 연결을 살렸습니다.
- source_word: spero
  english_pob_choice: I hope / we hope
  chosen_korean: 희망해야 합니까
  alternatives_korean:
  - 희망해야 합니까
  - 희망하겠습니까
  - 바라야 합니까
  lexicon: spero → 희망하다
  rationale: 본문의 spero는 라틴어상 단수형이지만, 발화 주체는 복수인 ‘의인들의 영혼들’이므로 한국어에서는 질문의 자연스러운 주체성을 살려 ‘희망해야 합니까’로 처리했습니다.
- source_word: fructus areae mercedis nostrae
  english_pob_choice: the fruit of the threshing floor of our reward
  chosen_korean: 우리의 보상의 타작마당에서 난 열매
  alternatives_korean:
  - 우리 보상의 타작마당의 열매
  - 우리 상급의 타작마당 열매
  - 우리의 보상 타작마당의 열매
  lexicon: fructus areae mercedis nostrae → 보상의 타작마당에서 난 열매
  rationale: 직역만 하면 어색하지만, areae와 fructus의 관계를 유지하면서도 한국어에서 이해 가능한 구조로 옮기기 위해 ‘타작마당에서 난 열매’로 풀었습니다.
- source_word: Hieremiel
  english_pob_choice: Jeremiel
  chosen_korean: 예레미엘
  alternatives_korean:
  - 예레미엘
  - 예레미야엘
  - 예레미엘
  lexicon: Hieremiel → 예레미엘
  rationale: 인명은 현대 외래어 표기 관행에 맞춰 음역했고, 영어 POB의 철자형 Jeremiel을 반영하되 본문 라틴어 Hieremiel의 음가를 살렸습니다.
theological_decisions:
- issue: 복수 화자의 발화 주체와 단수 동사의 긴장
  chosen_reading: 복수 주체(의인들의 영혼들)가 단수형 spero를 말한 것으로 보이므로 한국어는 복수적 상황을 유지하되 질문 문장 자체는 자연스럽게 한 형태로 정리했습니다.
  alternative_readings:
  - 단수형을 따라 ‘내가’로 번역
  - 문법을 평준화해 ‘우리가’로 번역
  rationale: 라틴어 표면형은 단수지만, 바로 앞의 복수 주체와 뒤의 ‘우리의 보상’이 더 강한 의미 증거이므로 본문의 의도된 복수성을 보존하는 쪽이 더 정확합니다.
  doctrine_reference: 문법보다 문맥 우선의 원전 판독 원칙
- issue: 예레미엘의 응답을 본문에 포함
  chosen_reading: “그러자 예레미엘이 그들에게 대답했습니다”를 본문에 포함했습니다.
  alternative_readings:
  - 응답 구절을 생략
  - 별도 각주로만 처리
  rationale: 라틴어 원문에 있는 행위 서술이 영어 POB 초안에서 빠졌다가 수정되었으므로, 최종 원문 증거를 따라 본문에 포함하는 것이 타당합니다.
  doctrine_reference: 본문 완전성 및 증거 우선 원칙
