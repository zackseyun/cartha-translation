translation:
  language: ko
  text: …와서 불경하게 살며, 고난을 겪고, 그 이유를 알지 못하는 것보다 낫습니다. 그리고 그가 내게 대답하여 말했습니다. 「떠나며—」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuere in impietatibus
  english_pob_choice: to live in ungodliness
  chosen_korean: 불경함 가운데 살고
  alternatives_korean:
  - 경건하지 않게 살고
  - 불의 가운데 살고
  lexicon: impietas
  rationale: impietas는 단순한 도덕적 무감각보다 하나님을 향한 불경/경외 없음의 뉘앙스를 가지므로, POB의 ungodliness를 따라 ‘불경함’으로 옮겼습니다.
- source_word: pati
  english_pob_choice: to suffer
  chosen_korean: 고난을 당하며
  alternatives_korean:
  - 고통받으며
  - 당하며
  lexicon: pati
  rationale: 라틴어 pati의 수동적 ‘겪다/당하다’ 의미를 살리되, 문맥상 인내적·실존적 고통을 드러내기 위해 ‘고난을 당하며’로 처리했습니다.
- source_word: non intelligere de qua re
  english_pob_choice: and not to understand why
  chosen_korean: 왜 그런지 이해하지 못하는
  alternatives_korean:
  - 무슨 일인지 이해하지 못하는
  - 그 이유를 알지 못하는
  lexicon: intelligere
  rationale: de qua re는 직역하면 ‘무슨 일에 대하여’이지만, 문맥상 고난의 이유를 묻는 표현이므로 한국어에서는 자연스럽게 ‘왜 그런지’로 옮겼습니다.
- source_word: proficiscens
  english_pob_choice: Setting out
  chosen_korean: 떠나며
  alternatives_korean:
  - 출발하며
  - 길을 떠나며
  lexicon: proficisci
  rationale: 분사형의 미완결성을 살려 다음 절과 연결되는 동작의 시작을 암시하도록 ‘떠나며’로 옮겼습니다.
theological_decisions:
- issue: 본문이 절말에서 분사형 profigiscens으로 끝나 문장이 의도적으로 미완결입니다.
  chosen_reading: 한국어도 종결하지 않고 「떠나며」로 끊어, 다음 절의 연결을 예고하는 미완결성을 보존했습니다.
  alternative_readings:
  - 「떠나겠다고」처럼 매끈하게 완결하기
  - 절말을 생략하기
  rationale: 라틴어 본문이 다음 절과 맞물리는 문장 절단을 보이므로, 매끄럽게 마감하면 저자의 번역투와 수사적 긴장이 사라집니다.
  doctrine_reference: source-text fidelity; discourse structure
