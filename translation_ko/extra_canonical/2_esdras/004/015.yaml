source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'tionem et dixerunt: uenite ascendentes debellemus siluam campi, ut et ibi consum[memus] nobismetipsis aliam regionem. Et factus est cogitatus siluae in uano, uenit enim ignis et con-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/015.yaml
  text: and said, ‘Come, let us go up and subdue the forest of the plain, so that there too we may gain for ourselves another region.’ But the plan concerning the forest was in vain, for fire came and consumed it.
translation:
  language: ko
  text: 그리고 말하였습니다. “오십시오, 우리가 올라가서 평야의 숲을 정복합시다. 그리하여 거기서도 우리 자신을 위해 또 다른 지역을 차지합시다.” 그러나 숲에 관한 계획은 헛되었으니, 불이 와서 그것을 태워 버렸기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 cogitatus siluae는 직역하면 ‘숲의 계획’이지만, 이 문맥에서는 숲을 정복하려는 계획, 곧 ‘숲에 관한 계획’으로 이해할 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: uenite ascendentes debellemus
  english_pob_choice: Come, let us go up and subdue
  chosen_korean: 오십시오, 우리가 올라가서 정복합시다
  alternatives_korean:
  - 가자, 올라가서 굴복시키자
  - 오라, 올라가서 정복하자
  lexicon: debello
  rationale: 라틴어 debellemus는 단순한 ‘가다’보다 전쟁적 제압을 뜻하므로, ‘정복하다’로 옮겨 공격성과 목표를 분명히 했습니다.
- source_word: siluam campi
  english_pob_choice: the forest of the plain
  chosen_korean: 평야의 숲
  alternatives_korean:
  - 들판의 숲
  - 평지의 숲
  lexicon: silua / campus
  rationale: 소유격 관계를 자연스러운 한국어로 반영해 ‘평야의 숲’으로 간결하게 옮겼습니다.
- source_word: ut et ibi consum[memus] nobismetipsis aliam regionem
  english_pob_choice: so that there too we may gain for ourselves another region
  chosen_korean: 그러면 거기서도 우리를 위해 또 다른 지역을 차지할 수 있습니다
  alternatives_korean:
  - 그래야 거기서도 우리 자신을 위해 다른 지역을 얻을 수 있습니다
  - 그래서 거기서도 또 다른 지역을 우리 몫으로 삼을 수 있습니다
  lexicon: consumere / regio
  rationale: consumere의 점유·소모적 뉘앙스를 고려해, 단순한 ‘얻다’보다 ‘차지하다’로 바꾸어 의도된 정복·점유를 드러냈습니다.
- source_word: cogitatus siluae in uano
  english_pob_choice: the plan concerning the forest was in vain
  chosen_korean: 숲에 관한 계획은 헛되었으니
  alternatives_korean:
  - 숲에 대한 계획은 헛되었으니
  - 숲을 겨냥한 계획은 헛되었으니
  lexicon: cogitatus + genitive
  rationale: 개정된 POB의 ‘concerning the forest’에 맞춰 소유격을 주제 표지로 이해하여 ‘숲에 관한 계획’으로 번역했습니다.
- source_word: uenit enim ignis et con-
  english_pob_choice: for fire came and consumed it
  chosen_korean: 불이 와서 그것을 삼켜 버렸기 때문입니다
  alternatives_korean:
  - 불이 와서 그것을 태워 버렸기 때문입니다
  - 불이 와서 그것을 소멸시켰기 때문입니다
  lexicon: consumere
  rationale: 라틴어 consumpsit 계열의 ‘완전히 삼키다/소멸시키다’ 의미를 살려 ‘삼켜 버리다’로 옮겼습니다.
theological_decisions:
- issue: 군사적 정복 표현의 강도
  chosen_reading: ‘정복합시다’로 옮겨 숲을 대상으로 한 공격적 의도를 숨기지 않았습니다.
  alternative_readings:
  - ‘굴복시키자’로 완화하여 옮김
  - ‘차지하자’로 중화하여 옮김
  rationale: 본문은 단순한 개척이 아니라 debellemus의 전쟁적 정복을 말하므로, 독자가 의도된 폭력을 인지하도록 유지했습니다.
  doctrine_reference: source-faithfulness
