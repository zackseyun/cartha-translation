  naturalness: 합쇼체는 대체로 유지되어 있으나, 발화 안에서 ‘그러면 … 할 수 있습니다’는 앞선 ‘정복합시다’와 권유의 호응이 약합니다. ‘그리하여 … 차지합시다’가 자연스럽고 응집력 있습니다. 불이 대상을 ‘삼켜 버렸다’도 가능하지만, 이 문맥에서는 ‘태워 버렸다’가 현대 한국어에서 더 명료합니다.
  terminology: ‘정복합시다’, ‘평야의 숲’, ‘또 다른 지역’은 적절합니다. cogitatus siluae의 속격 관계는 문맥적으로 ‘숲에 관한 계획’으로 처리할 수 있으나, 원문의 ‘숲의 계획’이라는 직역 가능성은 주석으로 밝혀 두는 것이 좋습니다.
