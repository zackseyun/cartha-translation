id: 2ES.4.3
reference: 2 Esdras 4:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ; ita, dominus meus. et respondit mihi et dixit : tres uias missus sum ostendere tibi, et tres similitudines proponere coram te ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/003.yaml
  text: And I said, “Yes, my lord.” And he answered me and said, “I have been sent to show you three ways, and to set three comparisons before you.
translation:
  language: ko
  text: 그러자 제가 말했습니다. “예, 내 주님.” 그러자 그분이 제게 대답하여 말씀하셨습니다. “나는 너에게 세 가지 길을 보여 주고, 세 가지 비교를 네 앞에 제시하려고 보내졌습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘나의 주인’이지만, 한국어에서는 공손한 호칭으로 ‘내 주님’이 자연스럽습니다.
    reason: korean_style_note
  - marker: b
    text: 라틴어 원문의 missus sum은 ‘보내졌다/파송되었다’는 수동 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: dominus meus
  english_pob_choice: my lord
  chosen_korean: 내 주님
  alternatives_korean:
  - 주님
  - 나의 주인님
  lexicon: dominus
  rationale: 화자에게 말을 거는 존칭을 살리되, 단순한 소유격보다 예의와 관계성을 드러내는 ‘내 주님’이 영어 POB의 직접 호명에 가장 가깝습니다.
- source_word: missus sum
  english_pob_choice: I have been sent
  chosen_korean: 보내졌습니다
  alternatives_korean:
  - 보내졌습니다
  - 보냄을 받았습니다
  - 파송되었습니다
  lexicon: mitto
  rationale: 수동 완료의 뜻을 살려, 행위의 주체가 자신이 아니라 보낸 이에게 있음을 드러내는 표현으로 옮겼습니다.
- source_word: tres uias
  english_pob_choice: three ways
  chosen_korean: 세 가지 길
  alternatives_korean:
  - 세 길
  - 세 가지 길
  - 세 노선
  lexicon: via
  rationale: 라틴어 ‘uiae’의 기본 의미인 ‘길’에 맞추되, 비유적·구조적 대비를 살리기 위해 ‘세 가지’로 자연스럽게 풀었습니다.
- source_word: tres similitudines
  english_pob_choice: three comparisons
  chosen_korean: 세 가지 비교
  alternatives_korean:
  - 세 비유
  - 세 가지 유사성
  - 세 가지 비교
  lexicon: similitudo
  rationale: 영어 POB가 이미 해석적으로 ‘comparisons’로 풀었으므로, 그 결정을 따라 독자가 비유적 대응을 이해하도록 ‘비교’로 옮겼습니다.
theological_decisions:
- issue: 보내심의 행위 주체
  chosen_reading: ‘나는 … 보내졌습니다’로 옮겨, 말하는 이의 사명성이 아니라 파송하신 분의 주도권을 드러냈습니다.
  alternative_readings:
  - ‘나는 … 왔습니다’
  - ‘나는 … 파견되었습니다’
  rationale: 원문의 수동 표현은 자발적 이동보다 위임된 사명을 강조하므로, 파송의 신학적 뉘앙스를 보존했습니다.
  doctrine_reference: 사명/파송의 수동태 표현
- issue: ‘three comparisons’의 해석
  chosen_reading: ‘세 가지 비교’로 유지해, 원문이 말하는 병렬적 제시의 형식을 과도하게 비유화하지 않았습니다.
  alternative_readings:
  - ‘세 비유’
  - ‘세 가지 예화’
  rationale: similitudines는 문맥상 설명적 병치일 수 있어, 특정한 우화로 좁히지 않고 비교라는 넓은 의미를 살렸습니다.
  doctrine_reference: 문학 형식의 보존
