revisions:
- from: 그러자 제가 말했습니다. “예, 내 주님.” 그러자 그분이 제게 대답하여 말씀하셨습니다. “나는 너에게 세 가지 길을 보여 주고, 세 가지 비교를 네 앞에 제시하려고 보내졌습니다.”[a][b]
  to: 그러자 제가 말했습니다. “예, 주님.” 그가 제게 대답하여 말했습니다. “나는 당신에게 세 가지 길을 보여 드리고, 세 가지 비유를 당신 앞에 제시하도록 보내심을 받았습니다.”
  rationale: 불필요하고 부정확한 호칭 주석을 삭제하고, 직접 호칭을 자연스러운 ‘주님’으로 고쳤습니다. 라틴어 수동태와 목적 구조를 ‘보내심을 받았습니다’로 보존했으며, similitudines를 한국어에서 더 적절한 ‘비유’로 옮겼습니다.
  reviewer_model: gpt-5.6-terra
