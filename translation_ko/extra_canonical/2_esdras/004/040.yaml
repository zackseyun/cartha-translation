  naturalness: 초안의 ‘아이를 자기 안에 계속 품을 수 있는지’는 ‘자기 안에’가 다소 부자연스럽고 지시 대상이 순간적으로 불분명할 수 있습니다. ‘아이를 계속 뱃속에 품고 있을 수 있는지’가 현대 표준어에서 더 자연스럽고, 임신·출산의 문맥도 명확히 전달합니다. ‘내게’는 이 문체에서 ‘제게’보다 서사적 성경 번역 문맥에 더 자연스럽습니다.
