  text: And he answered me and said, “Go and ask a pregnant woman whether, when she has completed her nine months, she can still keep the child within her.”
translation:
  language: ko
  text: 그는 내게 대답하여 말했습니다. 「가서 임신한 여인에게 아홉 달을 다 채운 뒤에도 아이를 계속 뱃속에 품고 있을 수 있는지 물어보십시오.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: praegnantem
  english_pob_choice: a pregnant woman
  chosen_korean: 임신한 여인
  alternatives_korean:
  - 임신한 여자
  - 아이 밴 여자
  - 몸에 아이를 가진 여자
  lexicon: 임신한
  rationale: praegnantem을 영어 POB처럼 자연스럽게 ‘임신한’으로 옮기되, 서술형이 아닌 대상 호칭으로서 다소 격식 있는 ‘여인’을 택해 문맥의 서사성을 살렸습니다.
- source_word: nouem menses suos
  english_pob_choice: her nine months
  chosen_korean: 아홉 달을
  alternatives_korean:
  - 아홉 달을 다 채운 뒤
  - 자기의 아홉 달을
  - 아홉 개월
  lexicon: 아홉 달
  rationale: 라틴어의 ‘아홉 달’을 시간의 완결로 이해하여 한국어에서는 자연스럽게 ‘아홉 달을 다 채운 뒤’로 풀어, 완료 상태를 드러냈습니다.
- source_word: adhuc ... tenere / keep within her
  english_pob_choice: can still keep the child within her
  chosen_korean: 아이를 자기 안에 계속 품을 수 있는지
  alternatives_korean:
  - 아이를 자기 안에 계속 둘 수 있는지
  - 태아를 계속 지닐 수 있는지
  - 아이를 안에 머금고 있을 수 있는지
  lexicon: 품을 수 있다
  rationale: 영어 POB의 ‘keep within her’를 직역하되, 한국어에서 가장 자연스럽게 자궁 내 유지의 의미를 전달하는 ‘품다’ 계열을 사용했습니다.
theological_decisions:
- issue: 문답식 권면의 어조
  chosen_reading: 직접화법은 명령형으로 유지하되, 예의 있는 요청체(물어보십시오)로 옮겼습니다.
  alternative_readings:
  - 가서 물어보시오
  - 가서 물어보라
  rationale: 원문과 영어 POB 모두 청자에게 직접 행동을 요구하므로 지시성을 보존해야 했고, 표준 현대 공용체로서는 ‘-십시오’가 가장 자연스럽습니다.
  doctrine_reference: 문맥 보존 원칙
