  lexicon: iudex
  rationale: iudex의 법정적 의미를 현대 한국어에서 가장 자연스럽게 드러내기 위해 ‘심판하는 자’를 택했습니다.
- source_word: horum
  english_pob_choice: these
  chosen_korean: 이들을
  alternatives_korean:
  - 이것들을
  - 이 사람들을
  lexicon: horum
  rationale: 앞선 문맥의 대상들을 가리키므로 중성적 거리감을 유지하면서도 한국어에서 자연스러운 대명 표현으로 옮겼습니다.
