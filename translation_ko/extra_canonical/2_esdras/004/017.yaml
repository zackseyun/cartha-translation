  lexicon: si / enim
  rationale: 라틴어 조건문과 전개 연결을 살려 ‘만일’로 조건을, ‘그렇다면’으로 앞선 논지를 잇는 흐름을 나타냈습니다.
- source_word: eras iudex
  english_pob_choice: you were judge
  chosen_korean: 당신이 … 심판하는 자라면
