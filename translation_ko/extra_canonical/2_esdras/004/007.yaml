source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit ad me : si eram interrogans te dicens : quantae habitationes sunt in corde maris, aut quantae uenae sunt in principio abyssi, aut quantae uiae sunt super firmamentum, aut qui sunt exitus paradisi ;'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/007.yaml
  text: And he said to me, “If I had asked you, saying, ‘How many dwellings are in the heart of the sea? Or how many springs are at the source of the deep? Or how many ways are above the firmament? Or what are the exits of paradise?’
translation:
  language: ko
  text: 그가 내게 말하였습니다. “내가 너에게 물으면, ‘바다 한가운데에는 몇 곳의 거처가 있느냐? 깊음의 근원에는 몇 개의 샘이 있느냐? 궁창 위에는 몇 갈래의 길이 있느냐? 낙원의 출구들은 무엇이냐?’라고 하겠느냐?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quantae habitationes
  english_pob_choice: How many dwellings
  chosen_korean: 몇 개의 거처
  alternatives_korean:
  - 몇 채의 집
  - 몇 개의 거주지
  lexicon: habitationes → 거처
  rationale: habitationes는 단순한 ‘집’보다 존재·거주를 포괄하는 ‘거처’가 문맥상 더 직접적이어서, POB의 “dwellings”를 자연스럽게 옮겼습니다.
- source_word: in corde maris
  english_pob_choice: in the heart of the sea
  chosen_korean: 바다의 심장에는
  alternatives_korean:
  - 바다 한가운데에는
  - 바다의 중심에는
  lexicon: cor → 심장
  rationale: cor를 ‘심장’으로 살려 바다의 가장 깊고 중심적인 지점을 시적으로 보존했습니다.
- source_word: venae
  english_pob_choice: springs
  chosen_korean: 샘
  alternatives_korean:
  - 원천
  - 줄기
  lexicon: vena → 샘
  rationale: 문맥상 물의 근원들을 묻는 비유이므로, POB의 “springs”에 맞춰 ‘샘’이 가장 적절합니다.
- source_word: firmamentum
  english_pob_choice: the firmament
  chosen_korean: 궁창
  alternatives_korean:
  - 창공
  - 하늘의 궁창
  lexicon: firmamentum → 궁창
  rationale: 라틴어 firmamentum은 창세기적 우주관의 ‘궁창’을 가리키므로, 전통적이지만 내용에 정확한 ‘궁창’을 유지했습니다.
- source_word: exitus paradisi
  english_pob_choice: the exits of paradise
  chosen_korean: 낙원의 출입구들
  alternatives_korean:
  - 낙원의 나가는 길들
  - 낙원의 문들
  lexicon: exitus → 출입구
  rationale: exitus는 ‘나감’과 ‘출구’의 뜻이 있어, POB의 “exits”를 살리면서 다수형 구조를 드러내는 ‘출입구들’로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 누적 구조
  chosen_reading: 묻는다면…?의 조건문과 연속된 네 개의 질문을 그대로 살려, 인간 인식의 한계를 강조하는 목록 구조를 유지했습니다.
  alternative_readings:
  - 직설적으로 ‘몇 개가 있는지 물었습니다’로 평서화
  - 질문들을 하나의 일반 진술로 압축
  rationale: 본문은 지식의 범위를 시험하는 수사적 장치이므로, 조건문과 질문열을 보존하는 편이 원문의 효과를 가장 잘 드러냅니다.
  doctrine_reference: source-rhetoric
