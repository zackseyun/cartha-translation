  yaml_path: translation/extra_canonical/2_esdras/004/042.yaml
  text: They are likened to the womb of souls. For just as she who gives birth hastens to escape the necessity of childbirth[a], so also these
  footnotes:
  - marker: a
    text: Or 'the necessity of childbirth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것들은 영혼들의 태에 비유됩니다. 곧 해산하는 여인이 해산의 고통에서 벗어나려고 서두르는 것처럼, 이들도 그러합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: animarum matrici
  english_pob_choice: the womb of souls
  chosen_korean: 영혼의 태
  alternatives_korean:
  - 영혼들의 태
  - 혼의 자궁
  - 혼들의 태
  lexicon: 태
  rationale: matrici는 문자적으로 자궁/태를 뜻하며, POB의 비유 구조를 살려 ‘영혼의 태’로 간결하게 옮겼습니다. ‘자궁’보다 ‘태’가 성경 문맥에서 더 자연스럽고 비유적입니다.
- source_word: adsimilata sunt
  english_pob_choice: They are likened
  chosen_korean: 비유됩니다
  alternatives_korean:
  - 닮았습니다
  - 견주어집니다
  - 비슷합니다
  lexicon: 비유하다
  rationale: adsimilata sunt는 단순 유사보다 비유적 대응을 나타내므로, 수동형의 의미를 살려 ‘비유됩니다’로 옮겼습니다.
- source_word: festinabit quae parit
  english_pob_choice: she who gives birth hastens
  chosen_korean: 해산하는 여인이 서두르듯
  alternatives_korean:
  - 아이를 낳는 여인이 서두르듯
  - 출산하는 여인이 서두르듯
  lexicon: 해산하다
  rationale: quae parit는 출산 행위의 진행을 가리키므로, 한국어 성경 문체에 맞는 ‘해산하는 여인’으로 옮겼습니다. ‘서두르다’는 festinabit의 급박함을 살립니다.
- source_word: necessitatem partus
  english_pob_choice: the necessity of childbirth
  chosen_korean: 해산의 필요
  alternatives_korean:
  - 출산의 필연
  - 산고의 필요
  - 해산의 고통
  lexicon: necessitas
  rationale: POB의 기존 해석은 ‘necessity’였으나, 라틴 문맥상 여기서는 단순한 논리적 필요보다 출산 상황에서 벗어나려는 압박을 가리킵니다. 그 점을 유지하면서도 과도한 해석을 피하려고 ‘해산의 필요’로 절제해 옮겼습니다.
theological_decisions:
- issue: 출산 비유의 의미 범위
  chosen_reading: 이 구절은 영혼의 태라는 비유와 출산의 긴박함을 병치하여, 생명의 탄생 과정에 따른 압박과 해방의 이미지를 드러냅니다.
  alternative_readings:
  - 철학적 생성론의 은유
  - 개별 여성의 육체적 고통 묘사
  rationale: 원문은 설명적 논증보다 비유적 대응을 제시하므로, 비유의 층위를 살리되 의미를 과잉 확장하지 않았습니다.
  doctrine_reference: 비유 해석 원칙
