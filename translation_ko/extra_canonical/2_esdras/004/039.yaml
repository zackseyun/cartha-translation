id: 2ES.4.39
reference: 2 Esdras 4:39
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nos omnes pleni sumus impietatem. Et ne forte propter nos prohibeatur iustorum area, propter peccata inhabitantium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/039.yaml
  text: We are all full of impiety. And perhaps because of us the threshing floor of the righteous is kept back[a], because of the sins of those who dwell there.
  footnotes:
  - marker: a
    text: Or 'is delayed'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 모두 불경건으로 가득합니다. 그리고 혹시 우리 때문에, 그곳에 사는 이들의 죄 때문에 의인들의 타작마당이 가로막힐지도 모릅니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지연될지도 모릅니다’.
    reason: prohibeatur의 이전 번역 가능성을 제시하되, 본문의 추측 양태(ne forte)에 맞추었습니다.
lexical_decisions:
- source_word: nos omnes pleni sumus impietatem
  english_pob_choice: We are all full of impiety
  chosen_korean: 우리는 모두 불경건함으로 가득합니다
  alternatives_korean:
  - 우리는 모두 경건치 않음으로 가득합니다
  - 우리 모두는 불경으로 가득합니다
  lexicon: impietas
  rationale: impietatem은 단순한 도덕적 결함보다 하나님을 향한 불경건/불경의 상태를 가리키므로, 현대 한국어에서는 ‘불경건함’이 가장 직접적입니다.
- source_word: prohibeatur
  english_pob_choice: is kept back
  chosen_korean: 막혀 있을 것입니다
  alternatives_korean:
  - 지연될 것입니다
  - 저지될 것입니다
  - 가로막혀 있을 것입니다
  lexicon: prohibeo
  rationale: prohibeatur는 ‘지연되다’보다 ‘막히다/저지되다/가로막히다’가 더 정확하며, 타작마당의 수확 이미지도 살립니다.
- source_word: iustorum area
  english_pob_choice: the threshing floor of the righteous
  chosen_korean: 의인들의 타작마당
  alternatives_korean:
  - 의인들의 타작마당
  - 의로운 이들의 타작마당
  - 의인들의 타작판
  lexicon: area
  rationale: area는 곡식을 거두는 ‘타작마당’이므로 직역에 가깝게 유지하고, iustorum은 POB의 통상 관례에 따라 ‘의인들’로 옮겼습니다.
- source_word: inhabitantium
  english_pob_choice: those who dwell there
  chosen_korean: 그곳에 사는 이들
  alternatives_korean:
  - 거기 사는 자들
  - 그곳에 거주하는 사람들
  lexicon: inhabito
  rationale: inhabitantium은 장소를 받는 ‘거주하는 자들’이므로, 영어 POB의 보정처럼 ‘on the earth’를 덧붙이지 않고 ‘그곳에 사는 이들’로 최소한만 옮겼습니다.
theological_decisions:
- issue: 공동체적 책임과 심판 지연의 가능성
  chosen_reading: 우리의 불경건 때문에 의인들의 타작마당이 막혀 있을 수 있다는 추정으로 옮겼습니다.
  alternative_readings:
  - 우리 때문에 의인들의 타작마당이 지연된다고 단정적으로 옮김
  - 의인들의 수확이 우리 때문에 방해받는다는 뜻으로 약화해 옮김
  rationale: ne forte는 ‘아마도/혹시’의 추정이며, 본문은 공동체의 죄가 의인의 수확을 ‘막을’ 수 있다는 경고를 유지합니다.
  doctrine_reference: 공동체적 죄책과 심판의 지연/보류 가능성
