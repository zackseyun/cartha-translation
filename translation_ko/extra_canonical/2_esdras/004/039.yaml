revisions:
- from: 우리는 모두 불경건함으로 가득합니다. 그리고 아마도 우리 때문에 의인들의 타작마당이 막혀 있을 것입니다[a] — 그곳에 사는 이들의 죄 때문입니다.
  to: 우리는 모두 불경건으로 가득합니다. 그리고 혹시 우리 때문에, 그곳에 사는 이들의 죄 때문에 의인들의 타작마당이 가로막힐지도 모릅니다[a].
  rationale: ‘가로막힐지도 모릅니다’는 prohibeatur의 ‘저지되다, 억제되다, 붙들려 있다’라는 의미와 ne forte의 불확실성을 함께 보존합니다. ‘그곳에 사는 이들’은 inhabitantium의 장소 지시가 본문상 더 특정되지 않는 점을 유지합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:06Z'
