  terminology: impietas는 ‘불경건’, iustorum은 ‘의인들’, area는 ‘타작마당’으로 유지하는 것이 적절합니다. prohibeatur는 ‘지연되다’보다 ‘가로막히다/저지되다’가 본문에 가깝습니다.
