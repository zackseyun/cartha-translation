id: 2ES.4.41
reference: 2 Esdras 4:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'poterit matrix eius retinere foetum in semetipsa. Et dixi: non potest, domine, et dixit ad me: in inferno prumptuaria'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/041.yaml
  text: And I said[a], “It cannot, Lord.” And he said to me, “In Hades the storehouses
  footnotes:
  - marker: a
    text: '''Hades'' here renders the realm of the dead, not specifically the place of final punishment.'
    reason: cultural_note
    anchor_ref: '4:41'
translation:
  language: ko
  text: 그리고 제가 말했습니다. “그럴 수 없습니다, 주님.” 그러자 그분이 제게 말씀하셨습니다. “음부에는 창고들이…”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘음부’는 최후의 형벌 장소가 아니라 죽은 자들의 영역을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: non potest, domine
  english_pob_choice: It cannot, Lord.
  chosen_korean: “그럴 수 없습니다, 주님.”
  alternatives_korean:
  - “그럴 수 없어요, 주님.”
  - “불가능합니다, 주님.”
  lexicon: potest
  rationale: 라틴어 부정 가능 표현 non potest를 자연스러운 불가 진술로 옮기되, ‘주님’은 영어 POB의 Lord에 맞추어 존칭으로 유지했습니다.
- source_word: in inferno
  english_pob_choice: Hades
  chosen_korean: “음부”
  alternatives_korean:
  - “하데스”
  - “사망의 영역”
  lexicon: inferno
  rationale: 영어 POB가 주해로 ‘죽은 자들의 영역’을 가리키는 Hades로 처리한 점을 반영하되, 한국어 본문에서는 문맥상 지하세계·죽은 자들의 영역을 뜻하는 전통적 성경어 ‘음부’를 사용했습니다.
- source_word: prumptuaria
  english_pob_choice: the storehouses
  chosen_korean: “창고들”
  alternatives_korean:
  - “저장고들”
  - “창고”
  lexicon: prumptuaria
  rationale: 라틴어 복수 명사 prumptuaria를 과장 없이 직역해 복수성을 살렸습니다.
theological_decisions:
- issue: in inferno / Hades의 의미 범위
  chosen_reading: 죽은 자들의 영역을 가리키는 음부로 번역했습니다.
  alternative_readings:
  - 최후 심판의 형벌처로서 지옥
  - 단순한 무덤
  rationale: 영어 POB 주석이 ‘final punishment’가 아니라 realm of the dead임을 분명히 하므로, 종말론적 지옥이 아니라 사자의 영역이라는 뜻이 드러나도록 했습니다.
  doctrine_reference: 사후 상태와 음부 개념에 대한 본문 맥락 주해
- issue: 라틴어 단편의 절단된 문장 상태
  chosen_reading: 현전하는 단편이 ‘in inferno prumptuaria’에서 끝나므로 본문을 완결된 뜻 이상으로 확장하지 않았습니다.
  alternative_readings:
  - ‘창고들이… 그곳에서 어쩌고저쩌고’처럼 보충
  - 문장 전체를 매끈하게 재구성
  rationale: 검토본이 unsupported addition을 제거했다는 기록에 따라, 남아 있는 단편의 범위를 넘는 보충을 피했습니다.
  doctrine_reference: 본문 비평 및 보수적 번역 원칙
