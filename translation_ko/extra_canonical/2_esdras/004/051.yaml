  text: 'et oravi et dixi: putas vivo usque in diebus illis, vel quiserit in diebus illis? respondit ad me et dixit: de signis de quibus me'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/051.yaml
  text: And I prayed and said, “Do you think I shall live until those days? Or who will be in those days?”
translation:
  language: ko
  text: 그리고 저는 기도하고 말했습니다. “제가 그때까지 살아 있을 것이라고 생각하십니까? 아니면 그때에 누가 있겠습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et oravi et dixi
  english_pob_choice: And I prayed and said
  chosen_korean: 그리고 나는 기도하며 말했습니다
  alternatives_korean:
  - 그리고 나는 기도하고 말했습니다
  - 나는 기도하며 말했습니다
  lexicon: oravi/dixi
  rationale: 두 동작을 순차적으로 살리되, 문어체 합쇼체로 자연스럽게 압축해 원문의 서술 흐름을 유지했습니다.
- source_word: putas vivo usque in diebus illis
  english_pob_choice: Do you think I shall live until those days?
  chosen_korean: 그때까지 제가 살아 있을 것이라고 생각하십니까?
  alternatives_korean:
  - 그때까지 내가 살아 있을 것이라고 생각하십니까?
  - 제가 그날들까지 살아 있겠습니까?
  lexicon: putas / vivo / usque in diebus illis
  rationale: 직접 화법의 질문을 유지하면서, '그때까지'로 시간 한정을 자연스럽게 옮겼고, '살아 있을 것'으로 미래 가능성을 표현했습니다.
- source_word: vel quis erit in diebus illis
  english_pob_choice: Or who will be in those days?
  chosen_korean: 아니면 그때에 누가 있겠습니까?
  alternatives_korean:
  - 아니면 그때에 누가 살아 있겠습니까?
  - 아니면 그날들에 누가 있겠습니까?
  lexicon: quis erit / in diebus illis
  rationale: 원문의 짧은 대조 질문을 보존하되, 한국어에서 자연스러운 존재 질문으로 옮겼습니다.
theological_decisions:
- issue: 첫 번째 인칭 대명사와 직접 화법의 문체
  chosen_reading: 화자의 자기 언급은 '저'가 아니라 '제'로 낮추고, 질문은 공손한 합쇼체로 유지했습니다.
  alternative_readings:
  - '''내가''를 사용한 더 직설적인 문체'
  - 반말체로의 전환
  rationale: 기도 문맥이지만 본문은 회화적 예언적 질문이므로, 현대 한국어 성경 문체에 맞는 공손한 서술을 택했습니다.
  doctrine_reference: 서술체 합쇼체와 직접인용의 문체 일관성
