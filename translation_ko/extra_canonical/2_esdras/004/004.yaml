id: 2ES.4.4
reference: 2 Esdras 4:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: De quibus si mihi renunciaueris unam ex his, et ego tibi demonstrabo uiam quam desideras uidere, et doceam te quare cor malignum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/004.yaml
  text: If you report to me one of these[a], then I also will show you the way that you desire to see, and I will teach you why the heart is evil.”
  footnotes:
  - marker: a
    text: Or 'If you can explain'.
    reason: previous_rendering
translation:
  language: ko
  text: 네가 이들 가운데 하나를 내게 말해 준다면, 나도 네가 보기를 원하는 길을 네게 보여 주고, 마음이 왜 악한지 너에게 가르쳐 주겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내게 설명해 준다면’
    reason: previous_rendering
lexical_decisions:
- source_word: renunciaueris
  english_pob_choice: If you report to me
  chosen_korean: 내게 말해 준다면
  alternatives_korean:
  - 내게 보고한다면
  - 내게 설명한다면
  - 내게 알려 준다면
  lexicon: renuntiare
  rationale: 라틴어 renunciaueris는 단순한 가능성이 아니라 직접 조건으로서 ‘말해 주다/알려 주다’의 성격이 강하므로, 한국어에서는 의미를 과장하지 않되 자연스럽게 ‘내게 말해 준다면’으로 옮겼습니다.
- source_word: demonstrabo uiam
  english_pob_choice: I will show you the way
  chosen_korean: 길을 네게 보여 주고
  alternatives_korean:
  - 네게 길을 보여 주고
  - 너에게 길을 보여 주고
  - 길을 보여 주겠습니다
  lexicon: demonstrare
  rationale: uia는 단순한 물리적 길보다 ‘길/방향/길잡이 되는 길’의 뜻이므로, 직역적으로 ‘길’을 유지하고 동사의 목적어-주어 관계를 한국어 어순에 맞게 처리했습니다.
- source_word: cor malignum
  english_pob_choice: why the heart is evil
  chosen_korean: 마음이 왜 악한지
  alternatives_korean:
  - 악한 마음이 왜 있는지
  - 왜 마음이 악한지
  - 왜 마음이 악한 것인지
  lexicon: cor / malignum
  rationale: cor는 성경적 문맥에서 단순 장기보다 내면의 중심을 가리키므로 ‘마음’으로 옮겼고, malignum은 ‘악한’으로 유지해 원문의 평가를 약화하지 않았습니다.
- source_word: desideras uidere
  english_pob_choice: you desire to see
  chosen_korean: 보기를 원하는
  alternatives_korean:
  - 보고 싶어 하는
  - 보기를 바라시는
  - 보기를 갈망하는
  lexicon: desiderare + uidere
  rationale: desideras uidere는 ‘보고자 하다’의 목적을 나타내므로, 문맥상 과도한 정서를 더하지 않는 ‘보기를 원하는’이 가장 균형적입니다.
theological_decisions:
- issue: ‘마음이 왜 악한지’의 형식
  chosen_reading: 악함을 설명하는 추상화보다, 인간 내면의 상태에 대한 직접 진술로 읽었습니다.
  alternative_readings:
  - 왜 악한 마음이 있는지
  - 왜 사람이 악한지
  rationale: 라틴어 quare cor malignum은 ‘왜 마음이 악한가’라는 상태 진술에 가깝고, 인과를 길게 풀기보다 원문의 날카로운 질문성을 보존하는 것이 적절합니다.
  doctrine_reference: 인간의 내면 악성에 대한 지혜문학/제4에스라의 인류론적 표현
