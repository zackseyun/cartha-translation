  - marker: a
    text: Or 'And I answered and said,'.
    reason: previous_rendering
translation:
  language: ko
  text: “하늘의 높이 위에 있는 것은 무엇입니까?” 그러자 내가 대답하여 말했습니다. “주님, 간청합니다. 왜 제게 이해할 수 있는 분별력이 주어졌습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quae super altitudinem caelorum
  english_pob_choice: what is above the height of the heavens
  chosen_korean: “하늘의 높이보다 위에 있는 것이 무엇입니까.”
  alternatives_korean:
  - “하늘들의 높이 위에 있는 것이 무엇입니까.”
  - “하늘의 높은 곳보다 위에 있는 것이 무엇입니까.”
  lexicon: quae / super / altitudinem / caelorum
  rationale: 라틴어의 물음문을 그대로 살려, ‘하늘의 높이보다 위’라는 초월적 비교를 자연스러운 한국어로 옮겼습니다.
- source_word: deprecor te, domine
  english_pob_choice: I beg you, Lord
  chosen_korean: “주님, 왜 제게 이해하는 분별력이 주어졌습니까?”
  alternatives_korean:
  - “주님, 간청합니다.”
  - “주님, 청하옵나이다.”
  lexicon: deprecor / domine
  rationale: deprecor는 단순한 요청보다 간청의 뉘앙스가 있어 정중한 ‘주님’으로 살리되, 합쇼체로 옮겼습니다.
- source_word: sensus intellegendi
  english_pob_choice: understanding
  chosen_korean: 이해하는 분별력
  alternatives_korean:
  - 이해력
  - 깨달음
  lexicon: sensus / intellegendi
  rationale: sensus와 intellegendi의 결합은 단순 지적 이해보다 ‘분별하며 이해하는 능력’에 가깝기 때문에 두 요소를 함께 드러냈습니다.
theological_decisions:
- issue: 질문문의 어조와 주님 호칭의 존대
  chosen_reading: 이 장면은 하늘의 비밀에 대한 인간의 한계를 드러내는 탄식이므로, 주님께 직접 말하는 존대 표현을 유지했습니다.
  alternative_readings:
  - 보다 중립적인 서술형 어조
  - 전통적 기도체 어미
  rationale: 라틴어 청원문 deprecor te, domine의 직접 호소를 보존하면서도 현대 합쇼체로 자연스럽게 전달하기 위함입니다.
  doctrine_reference: 인간 인식의 한계와 계시 의존성
- issue: 문장 경계와 인용 유지
  chosen_reading: 이전 절에서 이어지는 천사의 말과 에스드라의 응답을 분리해 따옴표와 마침표로 구분했습니다.
  alternative_readings:
  - 한 문장으로 연속 처리
  - 이전 절로 흡수
  rationale: 제공된 소스 분절에 따라 verse 22의 시작부를 포함해야 하므로, 영어 POB 수정 내역을 반영해 문장 경계를 보존했습니다.
  doctrine_reference: 본문 분절의 충실성
