  terminology: ‘주님’은 `domine`에 적절하며, ‘이해할 수 있는 분별력’은 `sensus intellegendi`의 이해·판단 능력을 중복 없이 전달합니다. 라틴어 `caelorum`의 복수는 한국어에서 관용적으로 ‘하늘’로 처리했습니다.
