id: 2ES.4.34
reference: 2 Esdras 4:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'respondit ad me et dixit: non festinas tu super altissimum, tu enim festinas propter temetipsum, nam excelsus pro multis. Nonne de his interrogauerunt animae iustorum in promptuariis'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/034.yaml
  text: And he answered me and said[a], “You do not hasten more than the Most High, for you hasten for your own sake, but the Most High for many. Have not the souls of the righteous in their chambers asked about these things?”
  footnotes:
  - marker: a
    text: Or '“Are you in greater haste than the Most High? For your haste is for your own sake'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 나에게 대답하여 말했습니다[a]. 「당신은 지극히 높으신 분보다 더 서두르지 않습니다. 당신은 당신 자신을 위해 서두르기 때문이지만, 지극히 높으신 분은 많은 이를 위해 서두르십니다. 의인들의 영혼이 그들의 방에서 이런 일들을 물어보지 않았습니까?」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “당신은 지극히 높으신 분보다 더 서두르십니까? 당신의 서두름은 당신 자신을 위한 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: non festinas tu
  english_pob_choice: You do not hasten more than the Most High
  chosen_korean: 당신은 지극히 높으신 분보다 더 급히 서두르지 않습니다
  alternatives_korean:
  - 당신은 지극히 높으신 분보다 더 서두르지 않습니다
  - 당신은 지극히 높으신 분보다 더 서둘지 않습니다
  lexicon: festinare
  rationale: 라틴어는 질문이 아니라 부정 서술문이므로, 한국어도 선언문으로 옮기고 '서두르다'를 사용해 동작성을 살렸습니다.
- source_word: excelsus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: excelsus
  rationale: 하나님을 가리키는 호칭으로서 문맥의 존칭과 합쇼체에 맞게 자연스럽고 경건한 표현을 택했습니다.
- source_word: pro multis
  english_pob_choice: for many
  chosen_korean: 많은 이를 위해
  alternatives_korean:
  - 많은 사람을 위해
  - 많은 이들을 위하여
  lexicon: pro + multi
  rationale: 라틴어의 목적/대상 관계를 살려 단순 소유가 아니라 '위해'로 번역했고, 대상의 폭을 분명히 했습니다.
- source_word: animae iustorum in promptuariis
  english_pob_choice: the souls of the righteous in their chambers
  chosen_korean: 의인들의 영혼이 그들의 방에서
  alternatives_korean:
  - 의인들의 혼이 그들의 방에서
  - 의로운 이들의 영혼이 그들의 창고들에서
  lexicon: animae / iustorum / promptuariis
  rationale: promptuaria는 문맥상 '저장실/방' 계열이지만 영어 POB의 'chambers'를 따라 자연스러운 '방'으로 옮겼고, iustorum은 관용적으로 '의인들'로 처리했습니다.
theological_decisions:
- issue: 하나님의 시간 감각과 인간의 조급함의 대비
  chosen_reading: 하나님은 '많은 이들을 위해' 일하시는 분으로, 개인의 조급함보다 더 큰 섭리의 속도를 지니신다는 대조를 살렸습니다.
  alternative_readings:
  - 하나님은 더디게 일하시는 분이라는 뉘앙스로 완화
  - 단순히 '많은 사람을 위해'로만 축소
  rationale: 이 절은 에스라의 개인적 조급함을 하나님의 보편적 섭리와 대비시키므로, 대조 구조를 약화하지 않도록 옮겼습니다.
  doctrine_reference: 섭리와 하나님의 주권
- issue: 문장 끝의 수사적 질문
  chosen_reading: ‘의인들의 영혼이… 물어보지 않았습니까?’를 유지해, 앞의 진술을 받치는 반문으로 처리했습니다.
  alternative_readings:
  - 평서문으로 완화
  - 감탄문으로 전환
  rationale: 라틴어 Nonne는 명시적 반문이므로, 수사적 효과를 보존하는 것이 원문에 더 충실합니다.
  doctrine_reference: 수사적 반문 보존
