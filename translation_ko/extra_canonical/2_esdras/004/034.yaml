  source_fidelity: 본문의 핵심 구조는 대체로 충실합니다. non festinas tu super altissimum의 부정 평서문과 마지막 Nonne의 수사 의문문을 구별한 점이 정확합니다. 다만 ‘더 급히 서두르지 않습니다’는 같은 뜻이 중복되어 라틴어 festinas의 단순한 동작을 불필요하게 강화합니다. footnote 표지는 영어 감사 기록처럼 ‘말했습니다’ 뒤에 두어 해당 이문/이전 번역 전체를 정확히 가리키는 것이 적절합니다.
  naturalness: ‘더 급히 서두르다’는 현대 한국어에서 중복적이고 다소 부자연스럽습니다. ‘더 서두르다’가 간결하고 자연스럽습니다. ‘그들의 방’도 이해되나, 영혼들이 머무는 promptuariis를 문맥상 자연스럽게 나타내려면 ‘그들이 있는 방들’보다 ‘그들의 방’이 간명하며, 본문 의미를 과도하게 해석하지 않습니다.
  terminology: ‘지극히 높으신 분’은 excelsus/the Most High의 경건한 호칭을 현대 합쇼체에서 자연스럽게 재현합니다. ‘의인들의 영혼’과 ‘많은 이를 위해’도 적절합니다. 신학적 해석을 덧붙이지 않았습니다.
