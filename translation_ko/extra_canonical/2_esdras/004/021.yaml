  text: metipso? Quemadmodum enim terra siluae data est et mare fluctibus suis, sic et qui super terram inhabitant quae sunt super terram intellegere solummodo possunt, et qui super caelos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/021.yaml
  text: For just as the earth has been given to the forest[a], and the sea to its waves, so also those who dwell upon the earth can understand only what is on the earth, and he who is above the heavens, what is above the heavens.”
  footnotes:
  - marker: a
    text: Or 'those who are above the heavens'.
    reason: previous_rendering
translation:
  language: ko
  text: 마치 땅이 숲에, 바다가 그 물결에 주어진 것처럼, 땅 위에 사는 이들은 땅 위에 있는 것만 이해할 수 있고, 하늘 위에 계신 분은 하늘 위에 있는 것을 이해하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘 위에 있는 자들”로 볼 수 있습니다.
    reason: 라틴어 qui는 형태상 단수와 복수가 같을 수 있습니다. 그러나 제공된 원전 계열의 증거와 영문 POB의 판단에 따라 본문은 단수로 옮깁니다.
lexical_decisions:
- source_word: terra siluae data est
  english_pob_choice: the earth has been given to the forest
  chosen_korean: “땅이 숲에 주어진 것”
  alternatives_korean:
  - “땅이 숲에게 주어진 것”
  - “땅이 숲에 맡겨진 것”
  lexicon: terra / silua / dare
  rationale: 라틴어는 땅과 숲의 수수 관계를 평행적으로 제시하므로, ‘주어진 것’으로 자연스럽게 옮겨서 수동 의미를 살렸습니다.
- source_word: mare fluctibus suis
  english_pob_choice: the sea to its waves
  chosen_korean: “바다가 자기 물결에”
  alternatives_korean:
  - “바다가 자기 파도에”
  - “바다가 자기 물결들에게”
  lexicon: mare / fluctus
  rationale: fluctibus는 바다의 고유한 파동을 가리키므로, ‘물결’이 문맥과 평행성에 가장 잘 맞습니다.
- source_word: qui super terram inhabitant
  english_pob_choice: those who dwell upon the earth
  chosen_korean: “땅 위에 사는 자들”
  alternatives_korean:
  - “땅에 거하는 자들”
  - “땅 위에 거주하는 자들”
  lexicon: inhabitare
  rationale: inhabitant의 거주 의미를 살리되, 현대 한국어에서 읽기 자연스럽게 ‘사는 자들’로 옮겼습니다.
- source_word: intellegere solummodo possunt ... et qui super caelos
  english_pob_choice: can understand only ... and he who is above the heavens
  chosen_korean: “땅 위에 있는 것만 이해할 수 있습니다. 그러나 하늘 위에 계신 분은 하늘 위에 있는 것을 아십니다.”
  alternatives_korean:
  - “오직 땅에 있는 것만 이해할 수 있습니다. 그러나 하늘 위에 계신 이는 하늘 위에 있는 것을 이해하십니다.”
  - “... 하늘 위에 계신 분은 하늘 위의 것을 이해하십니다.”
  lexicon: intellegere / qui super caelos
  rationale: apocalyptic 대비를 살려 인간의 인식 한계를 ‘이해할 수 있습니다’로, 초월적 존재를 ‘하늘 위에 계신 분’으로 옮겼습니다. POB의 수정 취지에 따라 마지막 qui는 단수로 읽었습니다.
theological_decisions:
- issue: 마지막 상대절의 지시 대상
  chosen_reading: ‘하늘 위에 계신 분’은 단수로서 하나님을 가리키는 것으로 옮겼습니다.
  alternative_readings:
  - 복수로 읽어 ‘하늘 위에 있는 자들’로 번역
  - 중성적 표현으로 지시 대상을 밝히지 않음
  rationale: 영문 POB의 최신 수정과 라틴어/원전 계열의 독법에 따라, 단수 대조가 창조주와 피조물의 인식 차이를 선명하게 드러냅니다.
  doctrine_reference: apocalyptic contrast between human limitation and divine transcendence
