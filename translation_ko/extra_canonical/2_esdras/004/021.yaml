  to: 마치 땅이 숲에, 바다가 그 물결에 주어진 것처럼, 땅 위에 사는 이들은 땅 위에 있는 것만 이해할 수 있고, 하늘 위에 계신 분은 하늘 위에 있는 것을 이해하십니다.[a]
