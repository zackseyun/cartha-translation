id: 2ES.4.9
reference: 2 Esdras 4:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Nunc autem non interrogaui te nisi de igne et uento et die, per quae transisti, et sine quibus esse non potes, et non respondisti mihi de eis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/009.yaml
  text: But now I have asked you only about fire and wind and day[a], through which you have passed and without which you cannot exist, and you have not answered me about them.
  footnotes:
  - marker: a
    text: Or 'about them.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 불과 바람과 날에 대해서만 당신에게 물었습니다. 당신이 그것들을 지나왔고, 그것들 없이는 존재할 수 없는데도, 당신은 그것들에 대해 내게 대답하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들에 관하여.’
    reason: previous_rendering
lexical_decisions:
- source_word: interrogaui te nisi de
  english_pob_choice: I have asked you only about
  chosen_korean: 나는 ...에 대해서만 당신에게 물었습니다
  alternatives_korean:
  - 나는 ...에 관해 당신에게만 물었습니다
  - 나는 ...에 대해서만 물었습니다
  lexicon: interrogare
  rationale: 라틴어의 ‘물어보다/질문하다’는 뜻을 자연스러운 합쇼체로 옮기되, nisi de의 제한을 ‘~에 대해서만’으로 분명히 나타냈습니다.
- source_word: igne et uento et die
  english_pob_choice: fire and wind and day
  chosen_korean: 불과 바람과 날
  alternatives_korean:
  - 불과 바람과 하루
  - 불과 바람과 낮
  lexicon: ignis / ventus / dies
  rationale: 세 항목을 병렬로 보존하면서 dies는 여기서 일반적인 ‘날’로 옮겨, 시간의 한 단위라는 넓은 의미를 유지했습니다.
- source_word: per quae transisti
  english_pob_choice: through which you have passed
  chosen_korean: 당신이 그것들을 지나왔고
  alternatives_korean:
  - 당신이 그 가운데를 지나왔고
  - 당신이 그것들을 통과했고
  lexicon: transire
  rationale: per quae의 도구/매개 의미를 살리기 위해 ‘그것들을 지나왔고’로 직역에 가깝게 유지했습니다.
- source_word: sine quibus esse non potes
  english_pob_choice: without which you cannot exist
  chosen_korean: 그것들 없이는 존재할 수 없는데도
  alternatives_korean:
  - 그것들 없이는 있을 수 없는데도
  - 그것들 없이 존재할 수 없는데도
  lexicon: esse non posse
  rationale: esse를 단순한 ‘있다’보다 더 강한 ‘존재하다’로 옮겨, 필연성과 의존성을 분명하게 했습니다.
theological_decisions:
- issue: 사도적/예언적 대화의 직접 인용문 종결 처리
  chosen_reading: 본문은 절 안에서 한 발화가 끊기지 않고 이어지는 형태로 처리했습니다.
  alternative_readings:
  - 절 끝에 닫는 따옴표를 두어 발화를 종결하는 처리
  rationale: 영어 POB의 수정 이력을 반영해, 4:9에서 화자의 말이 4:10으로 이어지는 구조를 왜곡하지 않도록 했습니다.
  doctrine_reference: 본문 구조/담화 흐름
