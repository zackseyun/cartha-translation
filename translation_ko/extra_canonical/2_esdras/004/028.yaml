id: 2ES.4.28
reference: 2 Esdras 4:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Seminatum est enim malum, de quo me interrogas de eo, et necdum uenit destrictio ipsius. Si ergo non messum fuerit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/028.yaml
  text: For the evil about which you ask me has been sown[a], and its destruction has not yet come. If therefore it is not reaped,
  footnotes:
  - marker: a
    text: Or 'its destruction'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜냐하면 당신이 내게 묻는 그 악은 이미 뿌려졌지만, 그 수확의 때는 아직 이르지 않았습니다.[a] 그러므로 그 악이 거두어지지 않는다면,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 ‘destrictio’는 이 문맥에서는 파종과 거둠의 비유에 따라 ‘수확’ 또는 ‘거둠’으로 이해됩니다. 일부 번역은 이를 ‘멸망’ 또는 ‘파괴’로 옮깁니다.
    reason: 라틴어 어휘의 해석상 여지를 밝히면서, 문맥상 가장 적절한 농경 은유의 번역을 설명합니다.
lexical_decisions:
- source_word: Seminatum est
  english_pob_choice: has been sown
  chosen_korean: 이미 심겨졌고
  alternatives_korean:
  - 이미 뿌려졌고
  - 이미 심어졌고
  lexicon: 심다
  rationale: 라틴어 수동 완료형의 농경 이미지를 살리되, 뒤의 ‘거두다’와 대응되도록 ‘심겨졌고’로 옮겼습니다.
- source_word: malum
  english_pob_choice: the evil
  chosen_korean: 그 악
  alternatives_korean:
  - 그 악한 것
  - 그 악행
  lexicon: 악
  rationale: 추상적·집합적 의미의 ‘악’을 유지하여, 단순한 하나의 행위보다 사태 전체를 가리키는 원문 뉘앙스를 반영했습니다.
- source_word: destrictio ipsius
  english_pob_choice: its destruction / its harvest
  chosen_korean: 그 수확
  alternatives_korean:
  - 그 멸망
  - 그 파괴
  - 그 거둠
  lexicon: 수확
  rationale: POB의 수정 이력과 본문의 파종-수확 농경 은유를 따라, 여기서는 ‘destrictio’를 ‘수확’으로 이해하는 독법을 반영했습니다.
- source_word: Si ergo non messum fuerit
  english_pob_choice: If therefore it is not reaped
  chosen_korean: 그러므로 그것이 거두어지지 않는다면
  alternatives_korean:
  - 그러므로 그것이 추수되지 않는다면
  - 그러므로 그것이 수확되지 않는다면
  lexicon: 거두다
  rationale: messum(거두다/추수하다)의 농경적 동사를 한국어의 자연스러운 ‘거두어지다’로 옮겨 앞의 ‘심겨졌고’와 짝을 이루게 했습니다.
theological_decisions:
- issue: 라틴어 destrictio의 의미를 ‘멸망/파괴’로 둘지, ‘수확’으로 둘지
  chosen_reading: ‘수확’으로 옮겨 파종-수확-타작마당으로 이어지는 비유를 유지했습니다.
  alternative_readings:
  - ‘멸망’으로 번역
  - ‘파괴’로 번역
  rationale: 영문 POB의 최신 수정은 표면적으로 ‘destruction’이라 했지만, 첨부된 수정 이력은 이 단어가 실제로는 농경 은유 속의 ‘harvest’ 계열 의미를 반영한다고 설명합니다. 한국어 본문은 그 해설적 판단을 따라 은유의 연속성을 보존하는 것이 더 정확합니다.
  doctrine_reference: 본문 비유의 일관성
