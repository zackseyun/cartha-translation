  source_fidelity: 라틴어 *enim*은 문두의 ‘그러므로’가 아니라 이유를 덧붙이는 ‘왜냐하면/이는’에 해당합니다. 또한 *destrictio*는 이 문맥에서 파종·거둠의 은유에 따라 ‘수확/거둠’으로 옮기는 것이 가장 적절합니다. 다만 이 단어를 ‘멸망/파괴’ 계열로 이해한 번역 전통도 있으므로 각주에서 그 가능성을 밝혀 두는 것이 안전합니다. 조건절 *Si ergo non messum fuerit*도 빠짐없이 보존되었습니다.
  naturalness: ‘수확은 아직 오지 않았습니다’도 이해되지만, 한국어에서는 ‘수확의 때가 아직 이르지 않았습니다’가 더 자연스럽고 은유의 시간적 진행을 분명히 합니다. ‘그것이’는 선행사 ‘악’을 가리킬 수 있으나, 문맥상 ‘그 악이’라고 반복하면 더 명료합니다.
  terminology: ‘악’, ‘뿌려지다’, ‘수확’, ‘거두어지다’는 추상적 악을 농경 비유로 묘사하는 본문의 어휘와 격조를 자연스럽게 보존합니다. ‘당신’은 본문의 직접 호칭에 맞는 현대 표준어 합쇼체 표현입니다.
