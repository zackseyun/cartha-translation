revisions:
- from: 그러므로 당신이 내게 묻는 그 악은 이미 심겨졌고, 그 수확은 아직 오지 않았습니다. 그러므로 그것이 거두어지지 않는다면,[a]
  to: 왜냐하면 당신이 내게 묻는 그 악은 이미 뿌려졌지만, 그 수확의 때는 아직 이르지 않았습니다.[a] 그러므로 그 악이 거두어지지 않는다면,
  rationale: 문두 접속사를 원문의 *enim*에 맞게 ‘왜냐하면’으로 고치고, *destrictio ipsius*는 계속되는 파종·수확 비유에 맞추어 ‘그 수확의 때’로 자연화했습니다. 이어지는 *ergo*는 ‘그러므로’로 유지했으며, 조건절의 미완결 형태와 문장 끝 쉼표를 보존했습니다. 각주는 ‘수확’ 번역의 문맥적 근거와 대안적 번역 전통을 함께 제시합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:13Z'
