  naturalness: ‘얼마나 더 낳을 것인지 보십시오. 그러나 … 생각해 보십시오’는 연속된 명령으로 인해 한국어 문장 흐름이 부자연스럽습니다. 감탄문 뒤에 마지막 명령을 두면 원문의 전환과 현대 격식체 문체가 더 자연스럽습니다.
  terminology: ‘아담’, ‘악한 씨앗 한 알’, ‘불경건’, ‘타작마당’은 모두 적절합니다. area를 심판의 도래로 단정하는 각주는 본문 라틴어가 직접 명시하는 범위를 넘어가므로 삭제하는 것이 좋습니다. Aestima의 ‘헤아려 보십시오’는 ‘생각해 보십시오’보다 원문의 평가·숙고 동작을 더 잘 반영합니다.
