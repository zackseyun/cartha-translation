id: 2ES.4.30
reference: 2 Esdras 4:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: granum seminis mali seminatum est in corde Adam ab initio, et quantum impietatis generauit usque nunc et generabit usque cum ueniat area. Aestima autem apud te granum mali
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/030.yaml
  text: For a grain of evil seed was sown in Adam’s heart from the beginning, and how much ungodliness it has produced until now, and will still produce until the threshing floor comes! But consider within yourself the grain of evil
translation:
  language: ko
  text: 아담의 마음에 악한 씨앗 한 알이 처음부터 뿌려졌으니, 그것이 지금까지 얼마나 많은 불경건을 낳았으며, 타작마당이 올 때까지도 얼마나 더 낳을 것인지 보십시오. 그러나 스스로 악한 씨앗을 생각해 보십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 et generabit usque cum ueniat area는 “타작마당이 올 때까지도”라는 뜻으로, 여기서는 종결점과 심판의 도래를 가리킵니다.
    reason: source_note
  - marker: b
    text: Aestima autem apud te는 직역하면 “그러나 네 안에서/너 자신에게 그 악한 씨앗을 헤아려 보라”는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: granum seminis mali
  english_pob_choice: a grain of evil seed
  chosen_korean: 악한 씨앗 한 알
  alternatives_korean:
  - 악의 씨앗 한 알
  - 나쁜 씨앗 한 알
  - 악한 종자 한 알
  lexicon: granum / semen / malus
  rationale: 라틴어의 ‘granum’과 ‘seminis’의 결합을 살려 씨앗의 단위성을 드러냈고, ‘mali’는 도덕적 악을 나타내므로 ‘악한’으로 옮겼습니다.
- source_word: in corde Adam
  english_pob_choice: in Adam’s heart
  chosen_korean: 아담의 마음에
  alternatives_korean:
  - 아담의 قلب에
  - 아담의 심장에
  - 아담의 중심에
  lexicon: cor, Adam
  rationale: ‘cor’는 문자적 심장보다 인격의 내적 중심을 뜻하므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘마음’을 택했습니다.
- source_word: impietatis
  english_pob_choice: ungodliness
  chosen_korean: 불경건
  alternatives_korean:
  - 경건하지 않음
  - 불신앙
  - 악행
  lexicon: impietas
  rationale: 단순한 도덕적 악보다 하나님에 대한 불경건을 가리키는 말이어서, 신학적 뉘앙스를 보존하는 ‘불경건’을 사용했습니다.
- source_word: area
  english_pob_choice: the threshing floor
  chosen_korean: 타작마당
  alternatives_korean:
  - 타작판
  - 타작 마당
  - 타작장
  lexicon: area
  rationale: 라틴어 ‘area’의 고전적 의미를 직접 살려, 심판과 정결의 이미지를 유지하는 표준적 농경 용어인 ‘타작마당’으로 옮겼습니다.
theological_decisions:
- issue: 마지막 절의 명령적 전환
  chosen_reading: ‘But consider within yourself…’를 ‘그러나 스스로 … 생각해 보십시오’로 옮겨, 앞의 서술에서 독자에게 사유를 촉구하는 전환을 분명히 했습니다.
  alternative_readings:
  - ‘그러나 마음속으로 … 살펴보십시오’
  - ‘그러나 자신 안에서 … 헤아려 보십시오’
  rationale: 라틴어 Aestima autem apud te는 단순 정보 전달이 아니라 수신자에게 내부적 숙고를 요구하는 명령이므로, 합쇼체의 직접 권유로 살렸습니다.
  doctrine_reference: 수신자에 대한 예언적/훈계적 권면의 수사
- issue: ‘area’의 종말론적 이미지
  chosen_reading: ‘타작마당’으로 번역해 마지막 심판과 분별의 이미지를 유지했습니다.
  alternative_readings:
  - ‘타작장’
  - ‘타작판’
  rationale: 문맥상 씨앗의 성장과 열매가 ‘타작마당’에 이르기까지 이어진다는 종말론적 대비가 핵심이므로, 평범한 장소명보다 성경적 농경 심상을 보존하는 표현이 적절합니다.
  doctrine_reference: 심판과 분별의 성경적 이미지
