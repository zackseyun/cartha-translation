  yaml_path: translation/extra_canonical/2_esdras/004/032.yaml
  text: When ears of grain without number are sown[a], how great a threshing floor they will begin to make! And he answered and said to me, “Until—
  footnotes:
  - marker: a
    text: Or 'When the ears of grain are sown whose number is beyond counting, how great a threshing floor they will make!”'.
    reason: previous_rendering
translation:
  language: ko
  text: 곡식 이삭이 셀 수 없이 뿌려지면, 얼마나 큰 타작마당을 만들어 가기 시작하겠습니까! 그가 내게 대답하여 말했습니다. 「그때까지—」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘타작마당’은 여기서 실제 농업 시설이라기보다, 거대한 추수·심판 이미지를 함께 불러오는 원문 비유를 살린 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: seminatae fuerint spicae
  english_pob_choice: When ears of grain without number are sown
  chosen_korean: 곡식 이삭이 셀 수 없이 뿌려지면
  alternatives_korean:
  - 이삭들이 헤아릴 수 없이 뿌려지면
  - 곡식 이삭들이 수없이 뿌려지면
  lexicon: spicae
  rationale: spicae는 문자적으로 ‘이삭’이지만, 한국어에서는 자연스러운 주어를 위해 ‘곡식 이삭’으로 풀어 원문의 농사 이미지와 수량의 불가산성을 함께 살렸습니다.
- source_word: non est numerus
  english_pob_choice: without number
  chosen_korean: 셀 수 없이
  alternatives_korean:
  - 수없이
  - 헤아릴 수 없이
  lexicon: non est numerus
  rationale: ‘without number’를 단순히 ‘많다’로 약화시키지 않고, 수량의 한계를 부정하는 표현인 ‘셀 수 없이’로 옮겼습니다.
- source_word: quam magnam aream incipient facere
  english_pob_choice: how great a threshing floor they will begin to make
  chosen_korean: 얼마나 큰 타작마당을 만들어 가기 시작하겠습니까
  alternatives_korean:
  - 얼마나 큰 타작마당을 만들기 시작하겠습니까
  - 얼마나 큰 타작마당이 되기 시작하겠습니까
  lexicon: aream ... facere / incipient
  rationale: aream은 농사 맥락에서 ‘타작마당’이 가장 직접적이며, incipient facere의 진행 착수 뉘앙스를 살리기 위해 ‘만들어 가기 시작하다’로 옮겼습니다.
- source_word: Et respondit et dixi
  english_pob_choice: And he answered and said to me
  chosen_korean: 그가 내게 대답하여 말했습니다
  alternatives_korean:
  - 그가 내게 대답하며 말했습니다
  - 그리고 그가 내게 대답하여 말했습니다
  lexicon: Et respondit et dixi
  rationale: 라틴어의 이중 동사를 한국어에서는 관용적으로 ‘대답하여 말했습니다’로 압축해도 의미가 보존되며, 화자가 전환되는 서술 흐름을 자연스럽게 전달합니다.
theological_decisions:
- issue: 대화 중 절단된 인용문의 처리
  chosen_reading: 본문이 ‘그때까지—’에서 끊기는 미완결 인용을 그대로 유지했습니다.
  alternative_readings:
  - 인용부호를 닫아 완결된 문장처럼 정리하는 방식
  - 대시 없이 단순히 생략 부호로 처리하는 방식
  rationale: source text와 영어 POB가 모두 미완결 대화를 보존하므로, 독자에게 문장 절단 자체를 드러내는 것이 원문 충실성에 부합합니다.
  doctrine_reference: source fidelity / textual form
