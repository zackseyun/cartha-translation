id: 2ES.4.20
reference: 2 Esdras 4:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'ad me et dixit: bene tu iudicasti, et quare non iudicasti tibi'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/020.yaml
  text: to me and said, “You have judged rightly, so why have you not judged for yourself?”
translation:
  language: ko
  text: 그가 내게 와서 말했습니다. 「당신은 옳게 판단하셨습니다. 그런데 왜 자신을 위해서는 판단하지 않으셨습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ad me
  english_pob_choice: to me
  chosen_korean: 내게
  alternatives_korean:
  - 나에게
  - 내 쪽으로
  lexicon: source_phrase
  rationale: 라틴어 ad me는 방향을 나타내는 ‘~에게’의 의미이므로, 대화 도착점이 분명한 내게로 옮겼습니다.
- source_word: dixit
  english_pob_choice: said
  chosen_korean: 말했습니다
  alternatives_korean:
  - 이르렀습니다
  - 말하였습니다
  lexicon: source_verb
  rationale: 직접화법 도입의 중립적 서술로서 자연스러운 현대 문어체 ‘말했습니다’를 택했습니다.
- source_word: bene tu iudicasti
  english_pob_choice: You have judged rightly
  chosen_korean: 당신은 옳게 판단하셨습니다
  alternatives_korean:
  - 당신은 바르게 판단하셨습니다
  - 당신이 올바르게 판결하셨습니다
  lexicon: iudicasti
  rationale: iudicare는 여기서 단순한 의견이 아니라 판단/판결의 행위이므로 ‘판단하셨습니다’로 옮기고, bene는 행위의 평가인 ‘옳게’로 반영했습니다.
- source_word: tibi
  english_pob_choice: for yourself
  chosen_korean: 자신을 위해서는
  alternatives_korean:
  - 자기 자신에 대해서는
  - 당신 편에서는
  lexicon: tibi
  rationale: tibi는 단순한 재귀 대명사보다 ‘자기 자신에게 유리하게/자신을 위해’의 대비를 띠므로, 권익을 미루어 판단하지 않은 뉘앙스를 살려 ‘자신을 위해서는’으로 옮겼습니다.
theological_decisions:
- issue: 대화체의 예의 수준
  chosen_reading: 서술문은 합쇼체로 유지하되, 인용문 안에서는 원문의 직설을 살려 존칭형 질문으로 제시했습니다.
  alternative_readings:
  - 인용문도 전부 서술체로 평평하게 처리
  - 더 공손한 종교적 한국어로 완화
  rationale: 라틴 원문의 직접 발화는 논박적이고 간결한 질의를 담고 있어, 한국어에서도 의미를 희석하지 않도록 표준적인 존칭 질문형을 유지했습니다.
  doctrine_reference: source transparency and discourse force
