  verdict: revise
  source_fidelity: 라틴어 *sta super dexteram partem*은 ‘오른쪽으로’ 이동하라는 뜻보다 ‘오른편에/오른쪽에 서라’는 위치를 나타냅니다. 또한 말미의 *et*는 미완결 상태로 보존되어야 하며, 초안처럼 이를 번역문 끝의 ‘그리고’로 남긴 것은 적절합니다.
  naturalness: ‘오른쪽으로 서십시오’는 현대 한국어에서 다소 부자연스럽고 방향 이동으로도 읽힐 수 있습니다. ‘오른편에 서십시오’가 자연스럽고 원문의 위치 표현을 더 정확히 반영합니다. 직접화법이 미완결이므로 쉼표 뒤의 ‘그리고’라는 의도적인 단절은 유지합니다.
  terminology: ‘오른편’은 이 문맥에서 자연스러운 현대 표준어이며, 고어적·교회어적인 ‘우편’을 피합니다. 화자가 본문 단편에서 특정되지 않으므로 존칭 동사나 신학적 해석을 덧붙이지 않고 ‘말했습니다’를 유지합니다.
  issues:
