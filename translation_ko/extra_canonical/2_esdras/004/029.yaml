  source_fidelity: 본문의 조건·부정 구조와 ‘심긴’의 반복은 잘 보존되었습니다. 다만 라틴어 ager ... veniet의 비유적 표현을 한국어에서 ‘밭이 오다’로 직역하면 뜻이 불분명합니다. 문맥상 선이 심긴 밭은 도래할 선의 질서를 가리키므로, 비유를 유지하면서 ‘밭의 때가 오다’로 옮기는 것이 자연스럽고 의미도 보존합니다.
