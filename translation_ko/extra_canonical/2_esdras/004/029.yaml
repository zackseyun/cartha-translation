id: 2ES.4.29
reference: 2 Esdras 4:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quod seminatum est, et discesserit locus ubi seminatum est malum, non ueniet ager ubi seminatum est bonum. Quoniam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/029.yaml
  text: For if what has been sown is not reaped[a], and the place where the evil has been sown does not pass away, the field where the good has been sown will not come.
  footnotes:
  - marker: a
    text: Or 'So if what has been sown is not reaped, and the place where the evil was sown does not pass away, the field where the good is sown will not come.'.
    reason: previous_rendering
translation:
  language: ko
  text: 만일 심긴 것이 거두어지지 않고, 악이 심긴 곳이 사라지지 않으면, 선이 심긴 밭의 때가 오지 않을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quod seminatum est
  english_pob_choice: what has been sown
  chosen_korean: 심긴 것
  alternatives_korean:
  - 뿌려진 것
  - 파종된 것
  lexicon: 심다
  rationale: 라틴어 완료수동형의 반복을 살리기 위해 ‘심긴 것’으로 옮겨, 세 번 반복되는 동일 동사의 평행을 한국어에서도 드러냈습니다.
- source_word: discesserit locus ubi seminatum est malum
  english_pob_choice: the place where the evil has been sown does not pass away
  chosen_korean: 악이 심긴 곳이 사라지지 않으면
  alternatives_korean:
  - 악이 심겨진 장소가 없어지지 않으면
  - 악이 뿌려진 곳이 사라지지 않으면
  lexicon: 곳 / 사라지다
  rationale: locus를 추상적 ‘장소’보다 자연스러운 ‘곳’으로 옮기되, discesserit의 소멸·이탈 감각은 ‘사라지다’로 유지했습니다.
- source_word: ager ubi seminatum est bonum
  english_pob_choice: the field where the good has been sown
  chosen_korean: 선이 심긴 밭
  alternatives_korean:
  - 선이 뿌려진 밭
  - 좋은 것이 심긴 밭
  lexicon: ager / bonum
  rationale: ager는 문자적으로 ‘밭’이므로 보존했고, bonum은 본문 대비상 ‘선’으로 옮겨 악과 선의 대구를 분명히 했습니다.
- source_word: ueniet
  english_pob_choice: will come
  chosen_korean: 오지 않을 것입니다
  alternatives_korean:
  - 올 것입니다
  - 이르지 않을 것입니다
  lexicon: 오다
  rationale: 문맥상 ‘필드가 오다’는 한국어에서 생경하므로, 미래 부정을 자연스럽게 풀어 ‘오지 않을 것입니다’로 처리했습니다.
theological_decisions:
- issue: 종말론적 평행 구조의 보존
  chosen_reading: 악이 심긴 곳과 선이 심긴 밭을 대칭적으로 제시하여, 현세의 악과 장차 올 선의 질서가 서로 겹치지 않는다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 악이 뿌려진 곳과 선이 뿌려질 밭
  - 악의 자리와 선의 밭
  rationale: 이 절은 동일한 완료수동형 반복으로 엄격한 대조를 만들기 때문에, 한국어에서도 시제와 대구를 평행하게 유지하는 것이 신학적·수사적 핵심입니다.
  doctrine_reference: 2 Esdras의 결정론적 종말론과 선/악의 이원적 대조
