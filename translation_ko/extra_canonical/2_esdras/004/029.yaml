  terminology: ‘심긴 것/악이 심긴 곳/선이 심긴 밭’은 seminatum est의 반복과 malum/bonum의 대조를 적절히 살립니다. ‘악’과 ‘선’도 이 문맥의 추상적 대조에 맞습니다.
