source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mare bellum, ut recedat coram nos, et faciamus nobis alias siluas. Et similiter fluctus maris et ipsi cogitauerunt cogita-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/014.yaml
  text: and said[a], ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves other forests.’ In the same way the waves of the sea also devised a plan,
  footnotes:
  - marker: a
    text: Or 'and said, ‘Come, let us go and make war against the sea, so that it may withdraw before us, and we may make for ourselves more forests.’ In the same way the waves of the sea also formed a plan,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 말하기를, 「오너라. 우리가 바다와 전쟁을 벌여 그것이 우리 앞에서 물러나게 하고, 우리를 위해 다른 숲들을 만들자.」 그러자 바다의 물결들도 또한 계획을 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘다른 숲들’은 라틴어 alias siluas를 따라 ‘더 많은 숲들’이 아니라 ‘다른 숲들’로 옮긴 것입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: mare bellum
  english_pob_choice: make war against the sea
  chosen_korean: 바다와 전쟁을 벌이다
  alternatives_korean:
  - 바다를 상대로 전쟁을 시작하다
  - 바다와 싸움을 벌이다
  lexicon: mare=바다; bellum=전쟁
  rationale: 라틴어의 직설적 적대 표현을 살리면서도 한국어에서 자연스럽게 읽히도록 ‘전쟁을 벌이다’로 옮겼습니다.
- source_word: alias siluas
  english_pob_choice: other forests
  chosen_korean: 다른 숲들
  alternatives_korean:
  - 더 많은 숲들
  - 다른 숲
  lexicon: alias=다른; siluas=숲들
  rationale: applied revision이 지적하듯 alias는 ‘더 많은’이 아니라 ‘다른’이므로, 수량이 아니라 대상을 바꾸는 뜻을 반영했습니다.
- source_word: Et similiter fluctus maris
  english_pob_choice: In the same way, the waves of the sea also
  chosen_korean: 그러자 바다의 물결들도 또한
  alternatives_korean:
  - 그와 같이 바다의 파도들도
  - 그에 따라 바다의 물결도
  lexicon: similiter=그와 같이; fluctus=물결/파도
  rationale: similiter와 fluctus maris의 병렬 구조를 살리되, 앞 문장의 인간 의도에 이어지는 서술을 한국어 연결어로 자연화했습니다.
- source_word: cogitauerunt
  english_pob_choice: devised a plan
  chosen_korean: 계획을 세웠습니다
  alternatives_korean:
  - 생각했습니다
  - 궁리했습니다
  lexicon: cogitare=생각하다, 꾀하다, 계획하다
  rationale: 동사의 의미를 단순한 사고가 아니라 의도적 구상으로 읽어, POB의 ‘devised a plan’에 맞게 옮겼습니다.
theological_decisions:
- issue: 의인화된 자연과 창조 질서의 긴장
  chosen_reading: 바다의 물결들도 인간처럼 ‘계획을 세우는’ 존재로 의인화해 번역했습니다.
  alternative_readings:
  - 물결도 움직이기 시작했습니다
  - 파도도 반응했습니다
  rationale: 이 절은 자연을 단순 현상이 아니라 의지를 가진 행위자처럼 묘사하는 수사적 장면이므로, 그 긴장을 약화하지 않도록 의인화를 유지했습니다.
  doctrine_reference: 수사적 의인화; 창조 세계에 대한 묘사
