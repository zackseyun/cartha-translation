id: 2ES.4.2
reference: 2 Esdras 4:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixit mihi : excedens excessit cor tuum in saeculo hoc, et comprehendere cogitas uiam altissimi?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/002.yaml
  text: and said to me[a], “Your heart has gone far beyond in this age, and do you think to comprehend the way of the Most High?”
  footnotes:
  - marker: a
    text: Or 'Your heart has gone too far'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 제게 말씀하셨습니다. 「이 시대에 너의 마음이 이미 한계를 넘어섰는데 — 너는 지극히 높으신 분의 길을 깨달을 수 있다고 생각하느냐?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “너의 마음이 너무 멀리 갔는데”.
    reason: previous_rendering
lexical_decisions:
- source_word: excedens excessit cor tuum
  english_pob_choice: Your heart has gone far beyond
  chosen_korean: “너의 마음이 이미 한계를 넘어섰는데”
  alternatives_korean:
  - “너의 마음이 너무 멀리 갔는데”
  - “너의 마음이 완전히 무너졌는데”
  - “너의 마음이 지나치게 나아갔는데”
  lexicon: excedo / cor
  rationale: 라틴어의 중첩 표현은 단순한 ‘과도함’보다 강한 정도를 나타내므로, 마음이 ‘한계를 넘어섰다’고 옮겨 깔린 의미인 당혹·초과를 살렸습니다.
- source_word: in saeculo hoc
  english_pob_choice: in this age
  chosen_korean: “이 시대에”
  alternatives_korean:
  - “이 세대에”
  - “이 현세에”
  lexicon: saeculum
  rationale: 문맥상 현재의 시대/세상을 가리키는 표현이므로, 고전적 종말론 뉘앙스를 무리하게 좁히지 않고 가장 자연스러운 ‘이 시대’로 옮겼습니다.
- source_word: viam altissimi
  english_pob_choice: the way of the Most High
  chosen_korean: “지극히 높으신 분의 길”
  alternatives_korean:
  - “가장 높으신 분의 길”
  - “지극히 높으신 이의 길”
  lexicon: altissimus
  rationale: 신격 호칭을 한국어에서 자연스럽게 유지하기 위해 ‘지극히 높으신 분’으로 옮겼고, ‘길’은 하나님의 행로·뜻을 뜻하는 원문 이미지를 그대로 살렸습니다.
theological_decisions:
- issue: Ezra의 인지 한계에 대한 수사
  chosen_reading: 본 절은 엘리야적 반박이 아니라, 인간 마음이 현재의 시대만으로도 이미 감당 못하니 지극히 높으신 분의 길을 다 헤아릴 수 없다는 논증으로 읽었습니다.
  alternative_readings:
  - 단순한 꾸중
  - 도덕적 비난
  - 지적 능력 자체에 대한 조롱
  rationale: 이 문장은 질문 형식의 수사로, 인식론적 한계를 지적하는 맥락이 강합니다. 따라서 한국어도 ‘한계를 넘어섰다’와 ‘깨달을 수 있느냐’를 통해 논증의 방향을 보존했습니다.
  doctrine_reference: 인간의 제한된 인식과 하나님의 초월성
