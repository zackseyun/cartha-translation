  naturalness: '''보여질 것입니다''보다 ''보일 것입니다''가 현대 표준어에서 더 자연스럽고 간결합니다. ''돌려주는 일을 서두릅니다''는 원문의 동작을 자연스럽게 드러냅니다.'
  terminology: '''맡겨진 것들''과 ''돌려주다''는 commendata와 reddere의 보관·반환 의미를 무리 없이 보존합니다. 신학적 전문 용어를 덧붙일 필요가 없습니다.'
