id: 2ES.4.43
reference: 2 Esdras 4:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: festinant reddere ea quae commendata sunt ab initio. Tunc tibi demonstrabitur de his, quae concupiscis uidere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/004/043.yaml
  text: They hasten to return the things that were entrusted from the beginning. Then what you desire to see will be shown to you.
translation:
  language: ko
  text: 그들은 처음부터 맡겨진 것들을 돌려주기를 서두릅니다. 그러면 당신이 보고자 하는 것이 당신에게 보여질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festinant
  english_pob_choice: They hasten
  chosen_korean: 서두릅니다
  alternatives_korean:
  - 급히 합니다
  - 재촉합니다
  lexicon: festino
  rationale: 동작의 속도와 긴급함을 자연스럽게 살리되, 한국어에서 과도하게 구어적이지 않은 표준 표현을 택했습니다.
- source_word: reddere ea quae commendata sunt
  english_pob_choice: return the things that were entrusted
  chosen_korean: 맡겨진 것들을 돌려주기를
  alternatives_korean:
  - 위탁된 것들을 반환하기를
  - 맡겨진 것들을 되돌려주기를
  lexicon: reddo / commendare
  rationale: commendata sunt의 ‘맡겨진/위탁된’ 의미를 반영하고, reddere는 단순 반환보다 책임 있게 ‘돌려주다’로 옮겨 원문의 신탁·보관 뉘앙스를 살렸습니다.
- source_word: ab initio
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 시작부터
  - 태초부터
  lexicon: ab initio
  rationale: 문맥상 시간적 출발점을 가리키므로 가장 자연스럽고 직접적인 ‘처음부터’를 사용했습니다.
- source_word: tunc tibi demonstrabitur
  english_pob_choice: Then ... will be shown to you
  chosen_korean: 그러면 ... 당신에게 보여질 것입니다
  alternatives_korean:
  - 그때 ... 보이게 될 것입니다
  - 그런 뒤 ... 드러날 것입니다
  lexicon: tunc / demonstrabitur
  rationale: 수동형 demonstrabitur를 그대로 반영해, 행위 주체를 드러내지 않은 채 계시적 수동을 유지했습니다.
theological_decisions:
- issue: 계시의 수동형 표현
  chosen_reading: ‘보여질 것입니다’로 옮겨, 무엇이 드러나는지보다 그것이 ‘주어지는 계시’라는 형식을 유지했습니다.
  alternative_readings:
  - ‘드러날 것입니다’
  - ‘알려질 것입니다’
  rationale: 원문의 demonstrabitur는 단순 관찰이 아니라 수여되는 계시의 성격을 띠므로, 수동형을 보존하는 것이 본문 의도를 더 잘 반영합니다.
  doctrine_reference: 계시론 / divine passive
