  text: For what has passed I know, but what is to come I do not know.”
translation:
  language: ko
  text: 우리는 지나간 일은 압니다. 그러나 앞으로 올 일은 알지 못합니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nos
  english_pob_choice: For what has passed I know, but what is to come I do not know.
  chosen_korean: 우리는
  alternatives_korean:
  - 나는
  - 저희는
  lexicon: 인칭대명사
  rationale: 라틴어 nos는 복수 1인칭을 가리키므로, 한국어도 복수 주어를 유지해 발화 주체의 범위를 그대로 드러냈습니다.
- source_word: quod pertransiuit
  english_pob_choice: what has passed
  chosen_korean: 지나간 일은
  alternatives_korean:
  - 지나간 것은
  - 이미 지나간 일은
  lexicon: 동사구
  rationale: pertransiuit의 완료상 의미를 살려 ‘이미 지나간’ 상태를 담되, 한국어에서는 자연스러운 명사구로 옮겼습니다.
- source_word: quid autem futurum sit
  english_pob_choice: what is to come
  chosen_korean: 앞으로 올 일은
  alternatives_korean:
  - 장차 일어날 것은
  - 다가올 일은
  lexicon: 미래 표현
  rationale: futurum sit의 미래적 뉘앙스를 직접적으로 살려 ‘앞으로 올’로 옮겼습니다.
