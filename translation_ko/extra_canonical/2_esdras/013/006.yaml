id: 2ES.13.6
reference: 2 Esdras 13:6
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi, et ecce sibimet ipso sculpsit montem magnum et volavit super eum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/006.yaml
  text: And I looked, and behold, he carved out for himself a great mountain and flew upon it.
translation:
  language: ko
  text: 그리고 내가 보니, 보라, 그가 자기 자신을 위해 큰 산을 깎아 만들고 그 위로 날아올랐습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et vidi, et ecce
  english_pob_choice: And I looked, and behold,
  chosen_korean: 그리고 내가 보니, 보라,
  alternatives_korean:
  - 내가 보니, 보라,
  - 그리고 보니, 보라,
  lexicon: source_phrase
  rationale: 라틴어의 연속 동사와 경탄 표지를 그대로 살려 시각적 목격과 놀라움을 함께 드러냈습니다.
- source_word: sibimet ipso
  english_pob_choice: for himself
  chosen_korean: 자기 자신을 위해
  alternatives_korean:
  - 자기에게
  - 스스로를 위해
  lexicon: reflexive_pronoun
  rationale: 자기지시적 목적을 자연스러운 현대 한국어로 옮기되, 행위의 수혜가 자기 자신에게 돌아감을 분명히 했습니다.
- source_word: sculpsit montem magnum
  english_pob_choice: he carved out ... a great mountain
  chosen_korean: 큰 산을 깎아 만들고
  alternatives_korean:
  - 큰 산을 조각하고
  - 큰 산을 파서 만들고
  lexicon: sculpsit
  rationale: sculpsit의 조형·조각적 의미를 살리면서 산을 ‘깎아 만들다’로 옮겨 거대한 인공 조성을 자연스럽게 표현했습니다.
- source_word: volavit super eum
  english_pob_choice: flew upon it
  chosen_korean: 그 위로 날아올랐습니다
  alternatives_korean:
  - 그 위로 날았습니다
  - 그 위에 날아올랐습니다
  lexicon: volavit super
  rationale: super의 ‘위에/위로’라는 관계를 분명히 하되, POB의 수정 취지에 맞춰 중복되는 ‘올라’ 성격의 어색한 표현은 피했습니다.
theological_decisions:
- issue: 환상적·상징적 장면의 직역 여부
  chosen_reading: 장면의 기이함을 완화하지 않고, ‘큰 산을 깎아 만들고 그 위로 날아올랐습니다’라고 직접적으로 옮겼습니다.
  alternative_readings:
  - 상징성을 드러내기 위해 더 풀이적으로 옮김
  - ‘산 위를 날았다’처럼 완화된 표현
  rationale: 본문은 환상적 동작 자체를 서술하므로, 의미를 해석적으로 낮추지 않고 독자가 이질성을 그대로 감지하도록 했습니다.
  doctrine_reference: source_transparency
