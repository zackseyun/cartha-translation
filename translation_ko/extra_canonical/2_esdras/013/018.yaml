source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: intellegentes quae sunt reposita in novissimis diebus, et non occurrentes eis. sed et qui derelicti sunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/018.yaml
  text: understanding what is stored up in the last days and not encountering them[a]. But also those who are left behind
  footnotes:
  - marker: a
    text: Or 'and not meeting it;'.
    reason: previous_rendering
translation:
  language: ko
  text: 마지막 날들에 저장된 것이 무엇인지 깨닫고, 그것들을 만나지 못하는 자들입니다. 그러나 뒤에 남은 자들도[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: occurrentes는 문맥상 ‘만나다’보다 ‘도달하다/이르다’의 뜻으로 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: intellegentes
  english_pob_choice: understanding
  chosen_korean: 깨닫고
  alternatives_korean:
  - 이해하고
  - 알고
  lexicon: intellegentes
  rationale: 현재분사형의 인지 의미를 살려 단순한 지식보다 내용을 분별하여 알아차린 상태를 자연스럽게 표현했습니다.
- source_word: quae sunt reposita in novissimis diebus
  english_pob_choice: what is stored up in the last days
  chosen_korean: 마지막 날들에 저장된 것이 무엇인지
  alternatives_korean:
  - 끝날들에 간직된 것이 무엇인지
  - 마지막 날들에 마련된 것이 무엇인지
  lexicon: reposita
  rationale: reposita는 ‘저장되다/간직되다’의 수동적 보관 이미지를 가지므로, 예비된 미래의 내용을 드러내는 표현으로 옮겼습니다.
- source_word: occurrentes eis
  english_pob_choice: not encountering them
  chosen_korean: 그것들을 만나지 못하는
  alternatives_korean:
  - 그것들에 이르지 못하는
  - 그것들을 맞닥뜨리지 못하는
  lexicon: occurrentes
  rationale: 영문 수정 이력상 의미는 ‘attaining/reaching’에 가깝지만, 라틴어 occurrere의 접촉·대면 이미지를 살려 ‘만나다’ 계열로 옮기되 부정을 유지해 도달하지 못함을 표현했습니다.
- source_word: sed et qui derelicti sunt
  english_pob_choice: But also those who are left behind
  chosen_korean: 그러나 뒤에 남은 자들도
  alternatives_korean:
  - 그러나 또한 남겨진 자들도
  - 그리고 뒤에 남은 자들도
  lexicon: derelicti
  rationale: derelicti sunt의 ‘버려져 뒤에 남은’ 상태를 간결하게 살리되, 문장이 다음 절로 이어질 수 있게 미완결형으로 처리했습니다.
theological_decisions:
- issue: 문장의 종결이 다음 절로 이어지는 미완결 구조
  chosen_reading: 마지막 절을 완결된 독립문으로 닫지 않고 ‘...자들도’로 끝내 다음 절 연결을 보존했습니다.
  alternative_readings:
  - 완결형으로 마침표를 찍어 독립문처럼 처리
  - 쉼표로만 이어 독해를 약화시키는 방식
  rationale: 라틴어가 sed et qui derelicti sunt로 문장을 이어가므로, 현재 절의 연결성을 한국어에서도 보존하는 편이 원문 구조에 더 충실합니다.
  doctrine_reference: 문장 구조 보존 원칙
- issue: ‘마지막 날들’의 종말론적 시간 표현
  chosen_reading: ‘마지막 날들’을 종말론적 미래 시점으로 그대로 유지했습니다.
  alternative_readings:
  - ‘종말의 날들’
  - ‘끝날들’
  rationale: 원문 novissimis diebus의 시간 표지를 직접 반영하여, 내용을 과도하게 해석하거나 신학적으로 확장하지 않았습니다.
  doctrine_reference: 문맥 기반 직역 원칙
