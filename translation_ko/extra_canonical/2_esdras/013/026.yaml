id: 2ES.13.26
reference: 2 Esdras 13:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ipse est quem conservat Altissimus multis temporibus, qui per semet ipsum liberabit creaturam suam, et ipse disponet qui derelicti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/026.yaml
  text: This is he whom the Most High has kept for many ages, who will by himself deliver his creation, and he himself will direct those who are left.
translation:
  language: ko
  text: 이분이 바로 지극히 높으신 분께서 오랜 세월 동안 보존해 두신 분이십니다. 그분은 친히 자신의 창조 세계를 구원하시고, 그분 자신이 남겨진 이들을 이끄실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ipse est quem
  english_pob_choice: This is he whom
  chosen_korean: 이분이 바로
  alternatives_korean:
  - 이분은 바로
  - 그가 바로
  lexicon: 지시대명사 + 주격 강조
  rationale: 라틴어 ipse est는 단순한 동일시를 넘어 강조를 담으므로, 한국어에서도 ‘이분이 바로’로 앞세워 인물 식별의 힘을 살렸습니다.
- source_word: conservat
  english_pob_choice: has kept
  chosen_korean: 간직해 오신
  alternatives_korean:
  - 지켜 오신
  - 보존하신
  lexicon: 동사 선택
  rationale: perfect 시제의 완료성과 지속된 보존의 뉘앙스를 함께 살리기 위해 ‘간직해 오신’으로 옮겼습니다.
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: 신칭 표현
  rationale: 하나님을 가리키는 존칭 표현으로, 직역성과 한국어 자연스러움을 함께 살릴 수 있는 ‘지극히 높으신 분’을 택했습니다.
- source_word: creaturam suam
  english_pob_choice: his creation
  chosen_korean: 자기 창조물
  alternatives_korean:
  - 그분의 창조물
  - 자신이 만드신 피조물
  lexicon: 소유격 + 창조 어휘
  rationale: suam의 소유 관계를 분명히 하고, creaturam의 피조된 대상을 직접적으로 드러내기 위해 ‘자기 창조물’로 옮겼습니다.
- source_word: qui derelicti sunt
  english_pob_choice: those who are left
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남겨진 사람들
  - 버려진 자들
  lexicon: 잔존자 표현
  rationale: 단순히 물리적으로 남아 있는 이들을 넘어 공동체 안의 ‘남은 자’라는 성경적 잔존 표현을 살리되, 본문이 허용하는 범위를 넘지 않게 했습니다.
theological_decisions:
- issue: per semet ipsum의 강조
  chosen_reading: ‘친히’와 ‘그분 자신이’로 두 번 강조해, 구원이 외부 대리 없이 그분의 직접 행위임을 드러냈습니다.
  alternative_readings:
  - ‘스스로’
  - ‘홀로’
  rationale: 라틴어의 반복 강조를 한국어에서도 반영하되, ‘홀로’처럼 배타적 의미를 과도하게 덧붙이지 않기 위해 ‘친히’와 재강조를 사용했습니다.
  doctrine_reference: 구원의 주도권과 직접성에 대한 본문 수준의 강조
- issue: qui derelicti sunt의 종말론적 잔존 뉘앙스
  chosen_reading: ‘남은 자들’로 옮겨, 단순 생존자가 아니라 선택된 잔존 공동체의 뉘앙스를 보존했습니다.
  alternative_readings:
  - ‘남겨진 자들’
  - ‘버려진 자들’
  rationale: 문맥상 이후의 회복/구원 장면과 맞물리는 표현이므로, 한국어 성경에서 익숙한 ‘남은 자들’이 의미를 가장 잘 전달합니다.
  doctrine_reference: 잔존자/회복 공동체 모티프
