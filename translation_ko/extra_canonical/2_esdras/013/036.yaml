  yaml_path: translation/extra_canonical/2_esdras/013/036.yaml
  text: But he will stand upon the summit of Mount Zion. And Zion will come and be shown to all, prepared and built, just as you saw the mountain carved out without hands.
translation:
  language: ko
  text: 그러나 그는 시온 산의 꼭대기에 서실 것입니다. 시온은 준비되고 지어진 채 모든 사람에게 나타날 것이니, 손으로 깎지 않은 그 산을 보셨던 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘산의 꼭대기’이지만, 한국어에서는 자연성을 위해 ‘시온 산의 꼭대기’로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: cacumen montis Sion
  english_pob_choice: the summit of Mount Zion
  chosen_korean: 시온 산의 꼭대기
  alternatives_korean:
  - 시온 산의 정상
  - 시온 산의 꼭대기
  lexicon: cacumen; mons Sion
  rationale: ‘cacumen’은 산의 가장 높은 지점을 뜻하므로 ‘정상’도 가능하지만, 문맥의 간결성과 시각성을 살려 ‘꼭대기’로 옮겼습니다.
- source_word: ueniet et ostendetur omnibus
  english_pob_choice: will come and be shown to all
  chosen_korean: 나타날 것이니
  alternatives_korean:
  - 오고 모든 이에게 보여질 것이니
  - 와서 모든 사람에게 드러날 것이니
  lexicon: uenire; ostendere; omnibus
  rationale: 라틴어의 ‘오다’와 ‘드러나다/보이다’의 이중 동작을 한국어에서는 자연스럽게 ‘나타날’로 압축해, 수동적 공개성을 유지했습니다.
- source_word: parata et aedificata
  english_pob_choice: prepared and built
  chosen_korean: 준비되고 지어진 채
  alternatives_korean:
  - 예비되고 세워진 채
  - 준비되어 세워진 채
  lexicon: paratus; aedificatus
  rationale: ‘prepared and built’의 두 상태를 모두 살리되, 종말적 비전의 완성 상태를 드러내는 표현으로 옮겼습니다.
- source_word: sicut uidisti montem sculpi sine manibus
  english_pob_choice: just as you saw the mountain carved out without hands
  chosen_korean: 손으로 깎지 않은 그 산을 보셨던 것과 같습니다
  alternatives_korean:
  - 손으로 다듬지 않은 그 산을 보셨던 것과 같습니다
  - 손 없이 깎인 그 산을 보셨던 것과 같습니다
  lexicon: sicut; uidisti; sculpi; sine manibus
  rationale: ‘sine manibus’은 단순히 ‘사람의 손 없이’라는 초자연적 형성의 표지를 뜻하므로, 전통적 표현보다 직접적인 ‘손으로 깎지 않은’으로 유지했습니다.
theological_decisions:
- issue: ‘Zion will come’의 의인화/가시화 표현
  chosen_reading: 시온을 하나의 장차 나타날 실재로서 ‘나타날’이라고 번역했습니다.
  alternative_readings:
  - 시온이 올 것입니다
  - 시온이 나타날 것입니다
  rationale: 라틴어는 장소명 시온을 단순 지명이 아니라 종말에 드러나는 구속적 현현으로 다루므로, ‘오다’보다 ‘나타나다’가 본문의 계시적 성격을 더 잘 보존합니다.
  doctrine_reference: 종말론적 현현과 새 예루살렘/시온의 계시 모티프
