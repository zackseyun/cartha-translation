revisions:
- from: 그러나 그는 시온 산의 꼭대기에 서실 것입니다. 시온은 준비되고 지어진 채 모든 사람에게 나타날 것이니, 손으로 깎지 않은 그 산을 보셨던 것과 같습니다.[a]
  to: 그러나 그는 시온 산의 꼭대기에 서실 것입니다. 시온은 와서 준비되고 세워진 모습으로 모든 사람에게 나타날 것입니다. 이는 당신께서 사람의 손을 거치지 않고 깎여 나온 산을 보신 것과 같습니다.
  rationale: 원문의 ueniet와 ostendetur를 각각 ‘와서’와 ‘나타날 것입니다’로 보존했습니다. parata et aedificata는 준비와 건립이 완료된 상태를 나타내도록 ‘준비되고 세워진 모습으로’로 옮겼습니다. 마지막 비교절은 수동형 sculpi와 sine manibus의 뜻을 유지하되 현대 한국어로 자연스럽게 다듬었습니다. 문체상 불필요한 기존 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:44Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장은 원문의 의미를 충실히 옮겼습니다. 그러나 ‘Sion autem ueniet et ostendetur omnibus’에서 ueniet(올 것이다)가 번역문에서는 ‘나타날 것이다’로 흡수되어 독립된 동작이 빠졌습니다. 또한 ‘sculpi sine manibus’는 손을 거치지 않은 깎임/잘려 나옴을 가리키므로 그 수동적 형성의 뜻을 더 분명히 드러내는 편이 좋습니다.
  naturalness: ‘시온 산의 꼭대기’와 합쇼체 문장은 자연스럽습니다. 다만 ‘준비되고 지어진 채’보다 ‘준비되고 세워진 모습으로’가 현대 한국어에서 더 매끄럽고, 원문의 완성된 상태도 유지합니다.
  terminology: ‘시온’, ‘시온 산’, ‘사람의 손을 거치지 않고’는 적절합니다. 불필요한 해설 각주는 본문의 번역 선택을 설명하지 못하며, 실제 본문에 이미 ‘시온 산의 꼭대기’가 쓰였으므로 제거하는 것이 좋습니다.
  issues:
  - severity: medium
    issue: ‘ueniet et ostendetur’의 ‘올 것이다’가 누락되었습니다.
    rationale: 원문은 시온이 ‘오고’ 또한 ‘모든 사람에게 보이게 될’ 것이라는 두 동작을 병렬로 진술합니다. ‘나타나다’만으로 압축하면 원문의 동사 하나가 소실됩니다.
  - severity: low
    issue: 각주 a가 본문과 맞지 않는 불필요한 문체 설명입니다.
    rationale: 각주는 ‘산의 꼭대기’를 직역했다고 설명하지만 본문에는 이미 ‘시온 산의 꼭대기’가 사용되어 있으며, 번역상 중요한 본문 이문이나 의미상 난점을 설명하지도 않습니다.
  - severity: low
    issue: ‘손으로 깎지 않은’은 ‘sculpi sine manibus’의 수동적 형성 표현을 다소 정태적으로 들리게 할 수 있습니다.
    rationale: ‘사람의 손을 거치지 않고 깎여 나온’으로 옮기면 사람 손 없는 초자연적 형성과 ‘carved out’의 결과를 자연스럽게 보존합니다.
  revised_text: 그러나 그는 시온 산의 꼭대기에 서실 것입니다. 시온은 와서 준비되고 세워진 모습으로 모든 사람에게 나타날 것입니다. 이는 당신께서 사람의 손을 거치지 않고 깎여 나온 산을 보신 것과 같습니다.
