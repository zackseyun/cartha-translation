id: 2ES.13.54
reference: 2 Esdras 13:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dereliquisti enim tua et circa mea vacasti et legem meam exquisisti.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/054.yaml
  text: For you have forsaken what belongs to you and have devoted yourself to what belongs to me, and have searched out my law.
translation:
  language: ko
  text: 당신은 자기에게 속한 것을 버리고, 내게 속한 것에 마음을 쏟았으며, 내 율법을 찾아냈습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dereliquisti enim tua
  english_pob_choice: you have forsaken what belongs to you
  chosen_korean: “자기에게 속한 것을 버리고”
  alternatives_korean:
  - “네 것을 버리고”
  - “자기 소유를 버리고”
  lexicon: derelinquere
  rationale: 원문의 ‘버리다’와 소유 관계를 살리면서, 대상이 단순 물건이 아니라 ‘자기에게 속한 것’임을 드러내어 영어 POB의 의미를 그대로 반영했습니다.
- source_word: circa mea vacasti
  english_pob_choice: have devoted yourself to what belongs to me
  chosen_korean: “내게 속한 것에 마음을 쏟았으며”
  alternatives_korean:
  - “내 것들에 전념하였으며”
  - “내 일에 전념하였으며”
  lexicon: vacare
  rationale: vacare는 단순한 ‘비우다’보다 ‘오롯이 집중하다/전념하다’의 의미가 있어, 한국어에서는 ‘마음을 쏟다’로 자연스럽게 옮겼습니다.
- source_word: legem meam exquisisti
  english_pob_choice: have searched out my law
  chosen_korean: “내 율법을 찾아냈습니다”
  alternatives_korean:
  - “내 율법을 찾아 구했습니다”
  - “내 율법을 탐구했습니다”
  lexicon: exquirere
  rationale: exquisisti는 단순히 읽거나 알다보다 ‘찾아내다/탐구하여 얻다’의 뉘앙스가 있어, 결과에 초점을 둔 ‘찾아냈습니다’를 선택했습니다.
theological_decisions:
- issue: mea / meam의 소유 관계와 하나님의 말씀에 대한 절대적 우선성
  chosen_reading: ‘내게 속한 것’과 ‘내 율법’으로 구분하여, 화자가 자기 것과 하나님의 것을 대조하는 구조를 살렸습니다.
  alternative_readings:
  - ‘내 것’으로 평이하게 처리하는 읽기
  - ‘내 일’로 의미를 완화하는 읽기
  rationale: 본문은 소유 대조를 통해 청자의 헌신을 강조하므로, 관계적 소유를 분명히 하는 번역이 본문의 수사와 신학적 긴장을 더 잘 드러냅니다.
  doctrine_reference: 본문 주해(수사적 대조; 청자의 헌신과 하나님의 율법 우선성)
