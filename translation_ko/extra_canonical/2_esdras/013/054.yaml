    issue: ‘자기에게 속한 것’의 인칭 및 문체상 부자연스러움
    rationale: ‘당신은’이라는 청자 호칭과 함께 쓰일 때 ‘자기’는 일반적·재귀적 지시로 들려 문장이 다소 어색합니다. tua의 소유 대조는 ‘자신의 것’으로 자연스럽게 보존할 수 있습니다.
  - severity: medium
