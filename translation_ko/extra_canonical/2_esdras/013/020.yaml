  source_fidelity: 라틴어 pertransire ... a saeculo는 단순히 세상 안을 ‘지나가는’ 뜻보다 세상에서 떠나가는 뜻을 나타내므로, 현 번역은 죽음과 마지막 때를 목도함의 대조를 충분히 드러내지 못합니다. in novissimo는 ‘마지막 날’로 단정하기보다 ‘마지막 때에’로 옮기는 편이 원문의 시간적 표현을 보존합니다. 마지막의 Et respondit ad me et dixit:도 번역되어 있습니다.
  naturalness: ‘세상에서 구름처럼 지나가서’는 한국어에서 세상을 통과한다는 뜻으로 자연스럽게 읽히며, 원문의 떠남의 뜻이 약해집니다. ‘구름처럼 세상을 떠나가’가 더 자연스럽고 문맥상 정확합니다. 화자를 특정할 근거가 없으므로 ‘말씀하셨습니다’보다 ‘말했습니다’가 중립적입니다.
  terminology: ‘위험에 처한 사람’, ‘이 일들’, ‘마지막 때’는 원문과 종말론적 문맥을 무리 없이 반영합니다. ‘세상을 떠나가다’는 a saeculo의 이탈 의미를 살리면서 특정 교리적 표현을 덧붙이지 않습니다.
