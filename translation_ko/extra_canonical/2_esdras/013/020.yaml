  text: 'attamen facilius est periclitantem venire in haec, quam pertransire sicut nubem a saeculo et non videre quae contigerunt in novissimo. Et respondit ad me et dixit:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/020.yaml
  text: Yet it is easier for one in danger to come into these things than to pass through the age like a cloud and not see what happened in the last days.” And he answered me and said:[a]
  footnotes:
  - marker: a
    text: Or 'Yet it is easier for one in danger to come into these things than to pass through life like a cloud and not see what has happened in the end.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 위험에 처한 사람이 이 일들에 들어오는 것이, 구름처럼 세상을 떠나가 마지막 때에 일어난 일을 보지 못하는 것보다 더 쉽습니다.” 그리고 그가 나에게 대답하여 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그러나 위험에 처한 사람이 이 일들에 들어오는 것이, 구름처럼 세상을 떠나가 마지막 날에 일어난 일을 보지 못하는 것보다 더 쉽습니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: facilius est ... venire in haec
  english_pob_choice: it is easier ... to come into these things
  chosen_korean: 이런 일들에 들어오는 것이
  alternatives_korean:
  - 이 일들 속으로 들어오는 것이
  - 이런 것들에 이르는 것이
  lexicon: facilius est; venire in
  rationale: 라틴어의 비교문을 자연스러운 한국어로 옮기되, 단순한 도착이 아니라 ‘들어감’의 뉘앙스를 살려 사건에 실제로 참여하게 되는 뜻을 반영했습니다.
- source_word: periclitantem
  english_pob_choice: one in danger
  chosen_korean: 위험에 처한 사람
  alternatives_korean:
  - 위기에 놓인 사람
  - 위태로운 사람
  lexicon: periclitantem
  rationale: periclitantem은 ‘위험에 있는/위험을 겪는’ 사람을 가리키므로, 간결하면서도 상태를 분명히 드러내는 표현으로 옮겼습니다.
- source_word: pertransire ... a saeculo
  english_pob_choice: to pass through the age
  chosen_korean: 세상에서 구름처럼 지나가서
  alternatives_korean:
  - 세상을 구름처럼 지나가서
  - 이 세상에서 구름처럼 지나가서
  lexicon: pertransire; a saeculo
  rationale: 대조의 핵심은 ‘이 세상/시대에서 떠남’이므로, 본문의 이미지인 ‘구름처럼 지나감’을 살리면서 세상에서 벗어나는 의미를 유지했습니다.
- source_word: novissimo
  english_pob_choice: the last days
  chosen_korean: 마지막 날
  alternatives_korean:
  - 마지막 때
  - 끝날
  lexicon: novissimo
  rationale: latest_revision_pass의 ‘last days’ 취지를 따르되, 한국어에서는 단수형 ‘마지막 날’이 본문 끝의 종말적 순간을 더 직접적으로 전달합니다.
theological_decisions:
- issue: saeculum의 종말론적 대비
  chosen_reading: ‘세상에서 구름처럼 지나가서’로 옮겨, 살아남아 마지막 때를 보는 사람과 이미 세상을 떠난 사람의 대비를 유지했습니다.
  alternative_readings:
  - ‘한 시대를 지나서’
  - ‘세상살이를 하면서’
  rationale: 라틴어 a saeculo는 단순한 ‘생애’보다 ‘세상/시대에서 떠남’의 뉘앙스가 강하므로, 죽음과 종말 관찰의 대비가 흐려지지 않도록 했습니다.
  doctrine_reference: 종말론적 대비와 죽음-생존의 문맥적 구분
