base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/014.yaml
  text: From the beginning you have shown these wonders to your servant[a], and you have counted me worthy to receive my supplication.
  footnotes:
  - marker: a
    text: Or 'that you should receive my prayer.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주께서는 처음부터 주님의 종에게 이 놀라운 일들을 보여 주셨고, 제 간구를 받아 주시기에 합당한 사람으로 저를 여기셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ab initio
  english_pob_choice: From the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 시초부터
  - 맨 처음부터
  lexicon: ab initio
  rationale: 시간적 기원을 자연스러운 현대 한국어로 옮기되, 단순한 과거가 아니라 시작점부터의 지속된 행위를 드러내기 위해 ‘처음부터’를 택했습니다.
- source_word: demonstrasti
  english_pob_choice: you have shown
  chosen_korean: 보여 주셨고
  alternatives_korean:
  - 드러내셨고
  - 보이셨고
  lexicon: demonstro
  rationale: ‘보여 주다’는 계시적 의미를 유지하면서도 원문의 ‘보여 줌’과 은혜로운 행위성을 함께 살립니다.
- source_word: servo tuo
  english_pob_choice: to your servant
  chosen_korean: 당신의 종에게
  alternatives_korean:
  - 당신의 하인에게
  - 당신의 종에게서
  lexicon: servus
  rationale: 라틴어 servus의 기본 의미를 따라 ‘종’으로 옮겼고, 하나님께 대한 종속 관계를 분명히 하기 위해 ‘당신의’로 인칭을 맞췄습니다.
- source_word: deprecationem meam
  english_pob_choice: my supplication
  chosen_korean: 제 간구
  alternatives_korean:
  - 제 청원
  - 제 기도
  lexicon: deprecatio
  rationale: 이 절의 deprecationem은 앞절의 동사적 용례와 연결되는 ‘간구/탄원’의 뜻이어서, 단순한 prayer보다 더 강한 요청의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: dignum me habuisti의 수동적 합당성 표현
  chosen_reading: ‘저를 합당한 사람으로 여기셔서’라고 옮겨, 수혜자가 스스로 자격을 갖춘 것이 아니라 하나님께서 그렇게 판단하신다는 뜻을 살렸습니다.
  alternative_readings:
  - 저를 합당하다고 여기셔서
  - 저를 합당하게 여기셔서
  rationale: 원문은 객관적 자격이 아니라 하나님의 평가를 말하므로, 한국어에서도 평가 주체를 분명히 드러내는 표현이 더 충실합니다.
  doctrine_reference: 은혜에 근거한 소명과 청원의 수용
- issue: deprecationem meam을 '받으셨습니다'로 처리한 종결
  chosen_reading: ‘제 간구를 받으셨습니다’로 마무리해, 청원의 수용이 핵심이라는 점을 드러냈습니다.
  alternative_readings:
  - 제 기도를 받아 주셨습니다
  - 제 간구를 들어 주셨습니다
  rationale: 라틴어 susciperes는 단순 청취보다 ‘받아들임/수납’의 의미가 있어, ‘받으셨습니다’가 가장 직접적입니다.
  doctrine_reference: 하나님이 간구를 받아들이심
