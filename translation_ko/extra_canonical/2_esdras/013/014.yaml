  to: 주께서는 처음부터 주님의 종에게 이 놀라운 일들을 보여 주셨고, 제 간구를 받아 주시기에 합당한 사람으로 저를 여기셨습니다.
  rationale: 원문의 ut + 접속법 구조를 ‘제 간구를 받아 주시기에’로 반영하여, 간구를 받아 주시는 분이 하나님이심과 그 일이 화자를 합당하게 여기신 판단에 종속됨을 보존했습니다. ‘처음부터’, ‘놀라운 일들’, ‘종’, ‘간구’는 원문의 의미와 현대 표준 한국어의 격식 있는 기도문 문체를 유지합니다.
