translation:
  language: ko
  text: 그리고 이 일 뒤에 나는 그 사람을 보았습니다. 그는 산에서 내려오면서, 또 다른 평화로운 무리를 자기에게 불러 모으고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et post haec
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 뒤에
  alternatives_korean:
  - 이 일 뒤에
  - 그리고 그 뒤에
  lexicon: 접속사 + 시간 부사구
  rationale: 라틴어의 et를 살려 문장 연결을 ‘그리고’로 시작하고, post haec는 직역에 가까운 ‘이 일 뒤에’로 옮겨 시간 순서를 분명히 했습니다.
- source_word: ipsum hominem
  english_pob_choice: that man
  chosen_korean: 그 사람
  alternatives_korean:
  - 그 남자
  - 그 사람
  lexicon: 지시대명사 + 명사
  rationale: ipsum은 단순한 재지시이므로 ‘그 사람’으로 자연스럽게 옮겼고, 본문이 특정 인물을 지시하는 흐름을 유지했습니다.
- source_word: multitudinem aliam pacificam
  english_pob_choice: another peaceful multitude
  chosen_korean: 또 다른 평화로운 무리
  alternatives_korean:
  - 다른 평화로운 무리
  - 또 하나의 평화로운 무리
  lexicon: multitudo
  rationale: multitudinem은 ‘무리/군중’의 집합성을 살려 ‘무리’로, aliam은 ‘또 다른’으로, pacificam은 전쟁적 대조를 지닌 ‘평화로운’으로 옮겼습니다.
theological_decisions:
- issue: 산에서 내려오는 인물과 평화로운 무리의 묘사
  chosen_reading: 상징을 과도하게 해석하지 않고, 서술이 제시하는 장면 자체를 그대로 살렸습니다.
  alternative_readings:
  - 메시아적 승리 장면으로 명시화하기
  - 교회 공동체로 특수화하기
  rationale: 본문은 라틴어 서술 자체로는 인물의 정체와 무리의 의미를 해설하지 않으므로, 독자가 문맥 속에서 판단하도록 열어 두는 번역이 가장 충실합니다.
  doctrine_reference: source-directed restraint
