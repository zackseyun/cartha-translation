id: 2ES.13.4
reference: 2 Esdras 13:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ubicumque exiebat vox de ore eius, ardescebant omnes qui audiebant voces eius. sicut liquescit cera quando senserit ignem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/004.yaml
  text: And wherever a voice went out from his mouth[a], all who heard his voice burned[b], just as wax melts when it senses the fire.
  footnotes:
  - marker: a
    text: Or 'a voice'.
    reason: previous_rendering
  - marker: b
    text: Or 'were set ablaze'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그의 입에서 나오는 소리[a]가 어디로든 나갈 때마다, 그의 소리를 들은 모든 사람이 타올랐습니다[b]. 마치 밀랍이 불을 느낄 때 녹는 것과 같았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘한 소리’.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘불붙었습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: et ubicumque exiebat vox de ore eius
  english_pob_choice: And wherever a voice went out from his mouth
  chosen_korean: “그의 입에서 나오는 소리”가 어디로든 나갈 때마다
  alternatives_korean:
  - 그의 입에서 나오는 음성이 어디로든 나갈 때마다
  - 그의 입에서 나가는 목소리가 어디로든 갈 때마다
  lexicon: vox
  rationale: vox는 여기서 특정 인물의 입에서 나오는 음성/소리를 가리키므로, ‘소리’로 직역해 음향적 생동감을 살렸습니다. 발화의 특정성을 반영해 ‘그의 입에서 나오는’으로 옮겼습니다.
- source_word: ardescebant omnes qui audiebant voces eius
  english_pob_choice: all who heard his voice burned
  chosen_korean: 그의 소리를 들은 모든 사람이 타올랐습니다
  alternatives_korean:
  - 그의 소리를 들은 모든 사람이 불붙었습니다
  - 그의 소리를 들은 모든 사람이 불타올랐습니다
  lexicon: ardesco
  rationale: ardescebant은 수동 ‘불을 당했다’가 아니라 ‘타오르기 시작했다/불탔다’는 능동 점증형 동사이므로, 결과를 자연스럽게 드러내는 ‘타올랐습니다’로 옮겼습니다.
- source_word: sicut liquescit cera quando senserit ignem
  english_pob_choice: just as wax melts when it senses the fire
  chosen_korean: 마치 밀랍이 불을 느낄 때 녹는 것과 같았습니다
  alternatives_korean:
  - 마치 밀랍이 불을 알아차릴 때 녹는 것과 같았습니다
  - 마치 밀랍이 불을 감지하면 녹는 것과 같았습니다
  lexicon: senserit / liquescit cera
  rationale: senserit는 ‘느끼다/감지하다’의 뉘앙스를 살리고, cera는 문맥상 ‘밀랍’이 자연스러워 고정어로 옮겼습니다.
theological_decisions:
- issue: 불타는 반응의 비유를 문자적 과장으로 완화하지 않음
  chosen_reading: 소리를 들은 이들이 실제로 ‘타올랐습니다’라고 옮겨, 원문의 강한 감각적 진술을 유지했습니다.
  alternative_readings:
  - ‘뜨거워졌습니다’처럼 완화된 표현
  - ‘불같이 반응했습니다’ 같은 의역
  rationale: 본문은 비교구문으로서의 비유를 사용하지만, 서술의 과장은 의도적으로 강렬합니다. 이를 약화하면 장면의 충격과 힘이 줄어듭니다.
  doctrine_reference: 문학적·수사적 과장에 대한 직역 우선 원칙
