  yaml_path: translation/extra_canonical/2_esdras/013/007.yaml
  text: But I sought to see the region or place from which the mountain had been carved, and I could not.
translation:
  language: ko
  text: 그러나 저는 그 산이 깎여 나온 지역이나 장소를 보려고 찾아보았지만, 볼 수 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ego autem quaesivi
  english_pob_choice: But I sought
  chosen_korean: 그러나 저는 찾고자 했지만
  alternatives_korean:
  - 그런데 저는 구하려 했지만
  - 하지만 저는 찾으려 했지만
  lexicon: quaesivi
  rationale: 과거의 탐색 의도를 자연스럽게 살리되, 문맥상 단순한 '보다'가 아니라 '찾다/찾고자 하다'의 시도를 반영했습니다.
- source_word: regionem vel locum
  english_pob_choice: the region or place
  chosen_korean: 지역이나 장소
  alternatives_korean:
  - 지대나 장소
  - 구역이나 장소
  lexicon: regionem, locum
  rationale: regionem은 넓은 지형적 범위를, locum은 특정한 지점을 가리키므로 둘 다 살려 '지역이나 장소'로 옮겼습니다.
- source_word: unde sculptus esset mons
  english_pob_choice: from which the mountain had been carved
  chosen_korean: 산이 어디에서 깎여 나왔는지
  alternatives_korean:
  - 산이 어디에서 조각되었는지
  - 산이 어디에서 새겨졌는지
  lexicon: sculptus esset
  rationale: sculptus esset는 문자적으로는 '조각되다'이지만 산의 형성 이미지를 자연스럽게 드러내기 위해 '깎여 나왔다'로 옮겼습니다.
theological_decisions:
- issue: 산의 기원에 대한 탐색 실패의 표현
  chosen_reading: 시인은 산의 기원을 알아보려 했으나 그 출처를 확인하지 못한 것으로 직역에 가깝게 전달했습니다.
  alternative_readings:
  - 산의 근원을 보려 했으나 볼 수 없었습니다.
  - 산이 어디서 왔는지 보려 했으나 볼 수 없었습니다.
  rationale: 이 절은 서술적 묘사로서 별도의 교리적 해석을 덧붙이기보다, 보려는 시도와 실패를 있는 그대로 전달하는 것이 원문에 가장 충실합니다.
  doctrine_reference: source fidelity / narrative plain sense
