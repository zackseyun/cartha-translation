source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ipse autem filius meus arguet quae aduenerunt gentes impietates eorum, has quae tempestati adpropiauerunt, et inproperabit coram eis mala cogitamenta eorum et cruciamenta,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/037.yaml
  text: But he[37], my Son, will rebuke the impieties of the nations that have come, these things that have drawn near like a storm; and he will reproach them to their faces with their evil thoughts and torments[a],
  footnotes:
  - marker: '37'
    text: '''Mount Zion'' and the mountain ''carved out without hands'' are brought together in the interpretation. The imagery intentionally echoes divinely made or revealed holy space rather than an ordinary mountain formed by human labor.'
    reason: cross_reference
  - marker: a
    text: Or 'he will set before them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 내 아들 그는 와서 이방 나라들의 불경한 행위를 책망할 것입니다. 그것들은 폭풍처럼 다가왔고, 그는 그들 앞에서 그들의 악한 생각과 고통을 꾸짖을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들 앞에 드러낼 것입니다’
    reason: previous_rendering
lexical_decisions:
- source_word: filius meus
  english_pob_choice: my Son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 아드님
  - 아들
  lexicon: 관계 호칭
  rationale: 라틴어의 소유 관계를 그대로 살려 «내 아들»로 옮겼습니다. 이는 메시아적 호칭을 유지하면서도 현대 한국어에서 자연스럽습니다.
- source_word: arguet
  english_pob_choice: will rebuke
  chosen_korean: 책망할 것입니다
  alternatives_korean:
  - 꾸짖을 것입니다
  - 비난할 것입니다
  lexicon: arguo
  rationale: arguere의 핵심은 단순 진술이 아니라 잘못을 드러내어 책망하는 행위이므로, 공적·공격적 어감이 살아 있는 «책망하다»를 택했습니다.
- source_word: impietates
  english_pob_choice: the impieties
  chosen_korean: 불경한 행위
  alternatives_korean:
  - 불경함
  - 경건치 않음
  - 경건하지 않은 죄악
  lexicon: impietas
  rationale: 명사형을 그대로 두면 한국어에서 낯설 수 있어, 내용상 드러난 경건의 결핍과 행위를 함께 살린 «불경한 행위»로 옮겼습니다.
- source_word: inproperabit coram eis
  english_pob_choice: will reproach them to their faces
  chosen_korean: 그들 앞에서 … 꾸짖을 것입니다
  alternatives_korean:
  - 그들 면전에서 … 꾸짖을 것입니다
  - 그들의 얼굴 앞에서 … 책망할 것입니다
  lexicon: inpropero
  rationale: coram eis의 ‘면전에서/앞에서’와 inproperabit의 ‘꾸짖다, 비난하다’의 강한 결합을 살렸습니다. 단순히 ‘제시하다’로 약화시키지 않았습니다.
theological_decisions:
- issue: ‘my Son’의 메시아적 호칭 유지
  chosen_reading: 본문의 ‘내 아들’은 단순 친자 관계가 아니라 종말론적 심판자에 대한 칭호로 읽었습니다.
  alternative_readings:
  - 문자적 아들
  - 메시아
  rationale: 문맥상 심판을 집행하는 인물은 아버지의 아들로 불리며, 호칭을 일반화하면 예언적·종말론적 힘이 약해집니다.
  doctrine_reference: 메시아론 / 종말론
