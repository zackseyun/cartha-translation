revisions:
- from: 그러나 내 아들 그는 와서 이방 나라들의 불경한 행위를 책망할 것입니다. 그것들은 폭풍처럼 다가왔고, 그는 그들 앞에서 그들의 악한 생각과 고통을 꾸짖을 것입니다.[a]
  to: 그러나 내 아들은 와 있는 민족들의 불경한 행위들, 곧 폭풍에 가까이 다가온 그 행위들을 책망하고, 그들의 악한 생각과 고통을 그들 면전에서 꾸짖으실 것입니다.[a]
  rationale: 폭풍 관련 구절의 문법적 수식 관계를 보존하고, ‘폭풍처럼’이라는 근거 없는 직유를 제거했습니다. inproperabit의 비난 의미를 유지하도록 각주의 부정확한 대안 번역도 원어 설명으로 교체했습니다.
