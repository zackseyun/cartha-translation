id: 2ES.13.24
reference: 2 Esdras 13:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: scito ergo, quoniam magis beatificati sunt qui derelicti super eos qui mortui sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/024.yaml
  text: Therefore know that those who are left are more blessed than those who have died.
translation:
  language: ko
  text: 그러므로 알라. 죽은 자들보다 남겨진 자들이 더 복됩니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scito ergo
  english_pob_choice: Therefore know
  chosen_korean: 그러므로 알라
  alternatives_korean:
  - 그러므로 아십시오
  - 그러니 아십시오
  lexicon: scito = imperative of scire
  rationale: 원문의 명령형 ‘알라’를 살리되, 앞절의 결론 표시 ‘그러므로’를 붙여 권고의 힘을 유지했습니다.
- source_word: magis beatificati sunt
  english_pob_choice: are more blessed
  chosen_korean: 더 복됩니다
  alternatives_korean:
  - 더 복이 있습니다
  - 더 큰 복을 받았습니다
  lexicon: beatificati sunt = blessed/made blessed
  rationale: 비교급의 의미를 간결하게 살리면서, 수동형이 주는 상태성을 한국어의 현재 서술로 자연스럽게 옮겼습니다.
- source_word: qui derelicti
  english_pob_choice: those who are left
  chosen_korean: 남겨진 자들
  alternatives_korean:
  - 남은 사람들
  - 버려진 자들
  lexicon: derelicti = left behind/abandoned
  rationale: 문맥상 단순히 ‘남은’ 정도보다, 떠난 이들과 대비되는 잔존 집단을 분명히 드러내는 ‘남겨진 자들’을 택했습니다.
- source_word: super eos qui mortui sunt
  english_pob_choice: than those who have died
  chosen_korean: 죽은 자들보다
  alternatives_korean:
  - 이미 죽은 자들보다
  - 죽어 버린 자들보다
  lexicon: super + comparative contrast
  rationale: 라틴어의 비교 대조를 자연스러운 한국어 ‘~보다’ 구조로 옮겨, 비교 대상이 분명히 드러나도록 했습니다.
theological_decisions:
- issue: 복됨의 비교 대상
  chosen_reading: 생존 자체가 아니라, 재난 뒤에 ‘남겨진 자들’이 ‘죽은 자들’보다 더 복되다고 선언하는 경구로 읽었습니다.
  alternative_readings:
  - 단순한 생존 우위의 말
  - 윤리적 우열을 뜻하는 일반론
  rationale: 원문은 두 집단을 직접 비교하는 종말론적/심판적 문맥의 발언으로 보이며, 이를 일반화하지 않고 그대로 전달하는 것이 source-direct합니다.
  doctrine_reference: 해석상 문맥 보존
