review_pass:
  verdict: revise
  source_fidelity: 라틴어의 논리 연결(scito ergo), 비교(magis ... super), 그리고 ‘남겨진 이들’과 ‘죽은 이들’의 대조는 초안에 충실히 반영되어 있습니다. 다만 명령형 ‘알라’는 지정된 현대 합쇼체 문체와 맞지 않습니다.
  naturalness: ‘그러므로 아십시오’가 현대 한국어의 격식 있는 성경 문체에 맞습니다. ‘남겨진 사람들’과 ‘죽은 사람들’은 의미를 보존하면서도 ‘자들’보다 현대적으로 자연스럽습니다. ‘더 복됩니다’도 종교 문맥에서 자연스럽게 비교 상태를 나타냅니다.
  terminology: beatificati sunt의 ‘복되다’를 ‘복됩니다’로 유지하여 ‘복이 있다’보다 원문의 축복/복됨의 진술을 가깝게 보존했습니다. derelicti는 이 구절의 대조 문맥상 ‘남겨진’으로 옮기는 것이 적절하며, ‘버려진’으로 특정하지 않았습니다.
