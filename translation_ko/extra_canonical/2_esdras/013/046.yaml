  source_fidelity: 라틴어의 시간 표현(usque in nouissimo tempore), 완료·시작 의미(nunc iterum coeperunt venire), 그리고 반복 부사(iterum)를 모두 충실히 반영했습니다. 후반절의 statuit uenas fluminis는 ‘강의 물길을 다시 막으셨습니다’로 자연스럽고, 목적절 ut possint transire도 ‘그들이 건널 수 있도록’으로 정확히 옮겼습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘마지막 때’는 이 문맥의 종말론적 시간 지시를 적절히 드러내며, ‘지극히 높으신 분’과 ‘강의 물길’도 격식 있는 성경 문체에 무리가 없습니다.
  terminology: Altissimus를 ‘지극히 높으신 분’으로 일관되게 처리했으며, 신학적으로 과도하게 특정 교리 해석을 부가하지 않았습니다. ‘마지막 때’는 라틴어 단수 tempore 및 본문의 종말론적 문맥을 균형 있게 반영합니다. 각주 a는 대안 번역이 적용되는 범위를 적절히 제시합니다.
