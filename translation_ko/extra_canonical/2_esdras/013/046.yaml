  text: 'usque in nouissimo tempore: et nunc iterum coeperunt uenire; Iterum altissimus statuit uenas fluminis, ut possint transire.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/046.yaml
  text: Then they lived there until the last time[46]; and now they have begun to come again; again the Most High has stopped up the channels of the river[a], so that they can cross.
  footnotes:
  - marker: '46'
    text: Arzareth is a place-name preserved in the Latin tradition; its exact geographical identification is uncertain.
    reason: cultural_note
  - marker: a
    text: Or 'Then they lived there until the last time; and now they are beginning to come again.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 마지막 때까지 거기에 살았고, 이제 다시 오기 시작했습니다. 지극히 높으신 분께서는 그들이 건널 수 있도록 강의 물길을 다시 막으셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 마지막 때까지 거기에 살았고, 이제 다시 오기 시작하고 있습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: usque in nouissimo tempore
  english_pob_choice: Then they lived there until the last time
  chosen_korean: 마지막 때까지
  alternatives_korean:
  - 마지막 시간까지
  - 끝 때까지
  - 종말 때까지
  lexicon: nouissimo tempore
  rationale: 라틴어 단수 표현이 4 Ezra 문맥에서 종말론적 의미이므로, 시간의 직전 순간이 아니라 eschatological end를 드러내는 ‘마지막 때까지’로 옮겼습니다.
- source_word: iterum coeperunt uenire
  english_pob_choice: and now they have begun to come again
  chosen_korean: 이제 다시 오기 시작했습니다
  alternatives_korean:
  - 이제 다시 오기 시작하였습니다
  - 이제 다시 오고 있습니다
  lexicon: coepere + venire
  rationale: 완료형 뉘앙스를 살려 ‘오기 시작했습니다’로 처리했고, 반복을 나타내는 iterum은 ‘다시’로 반영했습니다.
- source_word: Iterum altissimus statuit uenas fluminis
  english_pob_choice: again the Most High has stopped up the channels of the river
  chosen_korean: 지극히 높으신 분께서는 그들이 건널 수 있도록 강의 물길을 다시 막으셨습니다
  alternatives_korean:
  - 지극히 높으신 분께서는 강의 수로를 다시 막으셨습니다
  - 지극히 높으신 분께서는 강의 흐름을 다시 막으셨습니다
  lexicon: Altissimus / uenas fluminis / ut possint transire
  rationale: altissimus는 하나님 호칭으로 ‘지극히 높으신 분’을 택했고, uenas fluminis는 강의 ‘물길’로 구체화해 ‘막으셨습니다’와 결합해 통행 불가 상태를 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 종말론적 시간 표현의 해석
  chosen_reading: ‘마지막 때’로 옮겨 4 Ezra의 종말론적 맥락을 분명히 했습니다.
  alternative_readings:
  - ‘마지막 시간’
  - ‘마지막 날들’
  rationale: audit trail이 ‘last time’의 오해 가능성을 지적하므로, 단순 과거의 ‘마지막 번’이 아니라 종말의 시기를 나타내는 표현으로 명시했습니다.
  doctrine_reference: 4 Ezra의 eschatological horizon
