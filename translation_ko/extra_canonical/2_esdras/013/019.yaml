id: 2ES.13.19
reference: 2 Esdras 13:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter hoc vae, viderunt enim pericula magna et necessitates multas, sicut ostendunt somnia haec.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/019.yaml
  text: But as for those who are left—woe to them for this reason! For they will see great dangers and many distresses[a], as these dreams show.
  footnotes:
  - marker: a
    text: Or 'but even those who are left—woe because of this!'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 남은 자들에게는 화가 있습니다. 그들은 이 환상들이 보여 주듯이 큰 위험들과 많은 곤경들을 보게 될 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 남아 있는 그들까지도—이 일로 인해 화가 있습니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: propter hoc vae
  english_pob_choice: woe to them for this reason
  chosen_korean: 화가 있습니다
  alternatives_korean:
  - 그들에게 화가 있습니다
  - 이 때문에 화가 있습니다
  lexicon: 화
  rationale: 라틴어 propter hoc vae의 직접적 경고를 살리되, 한국어에서 자연스러운 예언적 경고 표현으로 옮겼습니다.
- source_word: qui derelicti sunt
  english_pob_choice: those who are left
  chosen_korean: 남은 자들
  alternatives_korean:
  - 남겨진 자들
  - 남아 있는 이들
  lexicon: 남다
  rationale: 주어를 수동적으로 ‘남겨진 자들’로 풀 수 있으나, 본문이 남겨진 집단을 가리키는 점을 살려 간결하게 ‘남은 자들’로 옮겼습니다.
- source_word: pericula magna et necessitates multas
  english_pob_choice: great dangers and many distresses
  chosen_korean: 큰 위험들과 많은 곤경들
  alternatives_korean:
  - 큰 위기들과 많은 환난들
  - 큰 위험들과 많은 고통들
  lexicon: periculum / necessitas
  rationale: pericula는 ‘위험들’, necessitates는 강제적 압박만이 아니라 처지의 곤란까지 포함할 수 있어 ‘곤경들’로 넓게 살렸습니다.
- source_word: sicut ostendunt somnia haec
  english_pob_choice: as these dreams show
  chosen_korean: 이 환상들이 보여 주듯이
  alternatives_korean:
  - 이 꿈들이 보여 주듯이
  - 이 환시들이 보여 주듯이
  lexicon: somnium
  rationale: 바로 앞 문맥의 묵시적 비전 성격을 고려해 ‘꿈’보다 ‘환상’이 더 적절하지만, 본문의 상징적 계시 기능을 해치지 않도록 ‘보여 주듯이’로 직역적 인과를 유지했습니다.
theological_decisions:
- issue: 예언적 경고의 감탄사 vae의 처리
  chosen_reading: ‘화가 있습니다’로 옮겨, 단순한 슬픔보다 심판 경고의 뉘앙스를 살렸습니다.
  alternative_readings:
  - 슬픔입니다
  - 불행합니다
  rationale: vae는 성경적 예언 문맥에서 심판 선언의 정형구로 기능하므로, 완곡한 감정 표현보다 경고적 기능이 드러나는 번역이 적절합니다.
  doctrine_reference: 예언 경고 어법
