  source_fidelity: 라틴어의 관계절(quae non fuerant servantes in regione sua)을 ‘그들이 자기 땅에서는 지키지 않았던 것들’로 충실히 옮겼습니다. servare의 규범 준수 의미를 ‘지키다’로 살렸고, sua의 소유 관계와 introitus의 복수도 반영했습니다. 문장 중간에 남은 Per introitus autem는 보충 없이 미완결로 유지되어 있습니다.
  naturalness: ‘그들이 자기 땅에서는 지키지 않았던 것들입니다’는 앞 문맥의 선행사를 받는 한국어 번역으로 자연스럽습니다. ‘그러나 입구들을 통해서는’의 의도적인 미완결성은 현존 라틴어 단절을 정직하게 반영하며, 각주가 이를 충분히 안내합니다.
  terminology: ‘지키다’는 이 문맥의 servare에 적절하며, ‘자기 땅’은 regio sua를 과도하게 특정하지 않는 자연스러운 표현입니다. ‘입구들’도 introitus의 복수형을 보존합니다.
