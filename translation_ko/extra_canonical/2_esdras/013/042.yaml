  - 앞뒤 문맥을 합쳐 해석적으로 매끈하게 정리함
  rationale: 이 구절은 잔존 본문이 단절되어 있어, 없는 내용을 보태지 않고 원문의 미완결성을 그대로 드러내는 것이 본문 충실도에 맞습니다.
