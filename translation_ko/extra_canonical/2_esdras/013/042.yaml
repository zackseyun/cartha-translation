lexical_decisions:
- source_word: quae non fuerant
  english_pob_choice: which they had not kept
  chosen_korean: 그들이 … 지키지 않았던 것들입니다
  alternatives_korean:
  - 그들이 지키지 않았던 것들입니다
  - 그들이 준수하지 않았던 것들입니다
  lexicon: quae / non fuerant
  rationale: 관계절이 가리키는 것은 앞절의 규례·법도 맥락에서 이해되므로, 한국어에서는 간결하게 ‘것들’로 받되 ‘지키다’로 원문의 준수 의미를 살렸습니다.
- source_word: servantes
  english_pob_choice: kept
  chosen_korean: 지키지 않았던
  alternatives_korean:
  - 준수하지 않았던
  - 보존하지 않았던
  lexicon: servare
  rationale: Lat. servare의 핵심은 규정을 ‘지키다/준수하다’는 뜻이므로, 단순한 보존보다 ‘지키다’가 문맥에 맞습니다.
- source_word: in regione sua
  english_pob_choice: in their own land
  chosen_korean: 자기 땅에서는
  alternatives_korean:
  - 자기 지역에서는
  - 자기 나라에서는
  lexicon: regio
  rationale: regio는 지리적·영토적 ‘땅/지역’이 가능하지만, 문맥상 포로지와 대조되는 거주지이므로 자연스러운 ‘자기 땅’으로 옮겼습니다.
- source_word: Per introitus autem
  english_pob_choice: But through the entrances
  chosen_korean: 그러나 입구들을 통해서는
  alternatives_korean:
  - 그런데 들어가는 문들을 통해서는
  - 하지만 출입구들을 통해서는
  lexicon: introitus
  rationale: 현존 라틴어가 확정적으로 남긴 표현을 과감히 풀이하지 않고, 복수형을 반영해 ‘입구들을’로 직역했습니다.
theological_decisions:
- issue: 현존 라틴어가 문장 중간에서 끊겨 끝이 완결되지 않음
  chosen_reading: 절의 마지막은 미완결된 채로 한국어도 동일하게 끊어 둡니다
  alternative_readings:
  - 의미를 보충하여 완결된 문장처럼 옮김
  - 앞뒤 문맥을 합쳐 해석적으로 매끈하게 정리함
  rationale: 이 구절은 잔존 본문이 단절되어 있어, 없는 내용을 보태지 않고 원문의 미완결성을 그대로 드러내는 것이 본문 충실도에 맞습니다.
  doctrine_reference: source-critical fidelity
