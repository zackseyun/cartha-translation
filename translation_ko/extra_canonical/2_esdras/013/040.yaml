id: 2ES.13.40
reference: 2 Esdras 13:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: terra sua in diebus Iosiae regis, quem captiuum duxit Salmanassar rex Assyriorum, et transtulit eos trans flumen, et translati sunt in terram aliam. Ipsi autem sibi dederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/040.yaml
  text: these are the ten tribes that were led away captive from their own land in the days of King Hoshea[40], whom Shalmaneser king of the Assyrians led away captive; and he carried them across the River[a], and they were taken into another land.
  footnotes:
  - marker: '40'
    text: The Latin here reads ‘in the days of King Josiah,’ even though the historical setting is the Assyrian exile of the northern tribes. The translation keeps the Latin name and leaves the apparent historical error visible rather than silently emending it to Hoshea.
    reason: textual_variant
  - marker: a
    text: Or 'these are the ten tribes that were led away captive from their own land in the days of King Josiah'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것들은 자기들의 땅에서 포로로 끌려간 열 지파입니다. 호세아 왕 때에 말입니다. 앗수르 왕 살만에셀은 그들을 사로잡아 강 건너편으로 옮겼고, 그들은 다른 땅으로 옮겨졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문에는 ‘요시야 왕 때에’로 되어 있으나, 문맥과 전승 증거는 ‘호세아 왕’이 저자 의도에 더 부합합니다.
    reason: textual_variant
lexical_decisions:
- source_word: in diebus Iosiae regis
  english_pob_choice: in the days of King Hoshea
  chosen_korean: 호세아 왕 때에
  alternatives_korean:
  - 요시야 왕 때에
  lexicon: historical name rendering
  rationale: 본문의 의도는 남왕국 요시야가 아니라 앗수르 포로기와 맞는 북왕국 왕 호세아를 가리키는 것으로 보이므로, 교정된 독법을 따라 호세아로 옮겼습니다.
- source_word: captiuum duxit
  english_pob_choice: led away captive
  chosen_korean: 사로잡아
  alternatives_korean:
  - 포로로 끌고 갔고
  - 사로잡아 끌고 갔고
  lexicon: 포로 처분/강제 이주
  rationale: 단순한 ‘끌어감’보다 포로화와 강제 이주의 뉘앙스를 살리기 위해 ‘사로잡아’로 옮겼습니다.
- source_word: trans flumen
  english_pob_choice: across the River
  chosen_korean: 강 건너편으로
  alternatives_korean:
  - 강을 건너
  - 강 너머로
  lexicon: 지리적 이동 표현
  rationale: 원문의 정관적 ‘River’는 지정된 큰 강을 가리키지만, 한국어에서는 지시성을 지나치게 고정하지 않고 자연스럽게 ‘강 건너편으로’로 풀었습니다.
- source_word: translati sunt in terram aliam
  english_pob_choice: they were taken into another land
  chosen_korean: 다른 땅으로 옮겨졌습니다
  alternatives_korean:
  - 다른 땅으로 끌려갔습니다
  - 다른 땅으로 이주되었습니다
  lexicon: 이동/유배 표현
  rationale: 피동형의 강제 이주 의미를 유지하면서도 포로 서술의 문맥에 맞게 ‘옮겨졌습니다’로 다듬었습니다.
theological_decisions:
- issue: Latin name corruption vs authorial intent
  chosen_reading: 본문은 라틴 전승의 ‘Iosiae’를 따르지 않고, 저자 의도에 부합하는 ‘호세아 왕’으로 읽었습니다.
  alternative_readings:
  - 요시야 왕
  - 본문 비평 각주로만 호세아를 제시
  rationale: 영문 POB의 주석과 개정 사유가 라틴어의 ‘Iosiae’를 필사 오류로 보며, 원저자 의도를 반영해야 한다고 제시하므로 본문에는 호세아를 채택했습니다.
  doctrine_reference: 본문비평 / 사본 전승
