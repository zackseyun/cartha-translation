  text: And after this I looked, and behold, all those who had gathered against him to attack him were greatly afraid, yet they still dared to fight.
translation:
  language: ko
  text: 그리고 이 일 후에 제가 보니, 보라, 그에게 맞서 그를 치러 모여든 모든 사람들이 매우 두려워했으나, 그래도 싸우려고 감히 나섰습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et post haec
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 후에
  alternatives_korean:
  - 그 후에
  - 이 일 뒤에
  lexicon: 후에/이후
  rationale: 라틴어의 순차 표지를 자연스러운 현대 한국어로 옮기되, 본문의 사건 진행을 분명히 드러내기 위해 ‘이 일 후에’로 처리했습니다.
- source_word: vidi, et ecce
  english_pob_choice: I looked, and behold
  chosen_korean: 제가 보니, 보라
  alternatives_korean:
  - 내가 보니, 보라
  - 내가 보았더니, 보라
  lexicon: 보라
  rationale: 시각적 관찰과 놀람의 결합을 살리기 위해 ‘제가 보니’와 감탄 표지 ‘보라’를 유지했습니다.
- source_word: congregati sunt ad eum ut expugnarent eum
  english_pob_choice: who had gathered against him to attack him
  chosen_korean: 그에게 맞서 그를 치러 모여든
  alternatives_korean:
  - 그를 공격하려고 그에게 모여든
  - 그와 싸우려고 모여든
  lexicon: 맞서다 / 치다
  rationale: ad eum과 ut expugnarent eum의 적대성과 공격 목적을 둘 다 보존하기 위해 ‘맞서’와 ‘치러’의 결합을 사용했습니다.
- source_word: timebant valde
  english_pob_choice: were greatly afraid
  chosen_korean: 매우 두려워했으나
  alternatives_korean:
  - 몹시 두려워했으나
  - 크게 두려워했으나
  lexicon: 두려워하다
  rationale: valde의 강도를 직접 반영해 ‘매우’로 옮겼고, 뒤의 역접을 살리기 위해 절 구조를 유지했습니다.
- source_word: tamen audebant pugnare
  english_pob_choice: yet they still dared to fight
  chosen_korean: 그래도 싸우려고 감히 나섰습니다
  alternatives_korean:
  - 그럼에도 싸울 용기를 냈습니다
  - 그러나 여전히 싸우기를 감히 했습니다
  lexicon: 감히 / 싸우다
  rationale: tamen의 역접과 audebant의 ‘감히’라는 뉘앙스를 살리면서, pugnare를 한국어에서 자연스러운 행동 표현인 ‘나서다’와 결합해 공격적 결의를 드러냈습니다.
theological_decisions:
- issue: 서술자의 1인칭 관찰과 감탄 표지의 유지
  chosen_reading: 직접 목격 서술을 드러내는 ‘제가 보니, 보라’ 구조를 유지했습니다.
  alternative_readings:
  - ‘내가 보니, 보라’
  - ‘보니, 보라’
  rationale: 본문은 단순 보고가 아니라 환시적 장면 전환을 암시하므로, 관찰 행위와 감탄을 분리해 보존하는 편이 원문의 효과를 더 잘 반영합니다.
  doctrine_reference: apocalyptic narration / discourse force
