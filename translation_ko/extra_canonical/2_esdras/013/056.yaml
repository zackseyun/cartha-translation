id: 2ES.13.56
reference: 2 Esdras 13:56
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et propter hoc ostendi tibi haec, merces apud Altissimum. erit enim post alios tres dies, ad te alia loquar et exponam tibi gravia et mirabilia.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/056.yaml
  text: Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”
translation:
  language: ko
  text: 그러므로 내가 네게 이런 것들을 보여 주었습니다. 지극히 높으신 분께 보상이 있기 때문입니다. 사흘이 더 지나면 내가 네게 다시 말하고, 중대하고 놀라운 일들을 설명해 주겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendi tibi haec
  english_pob_choice: I have shown you these things
  chosen_korean: 내가 너에게 이런 것들을 보여 주었습니다
  alternatives_korean:
  - 내가 너에게 이 일들을 나타내었습니다
  - 내가 너에게 이것들을 보여 주었습니다
  lexicon: ostendo
  rationale: 직역보다 자연스러운 현대 한국어로 ‘보여 주다’를 택하되, 과거 완료적 뉘앙스를 살려 결과가 이미 제시되었음을 드러냈습니다.
- source_word: merces
  english_pob_choice: a reward
  chosen_korean: 보상
  alternatives_korean:
  - 상
  - 삯
  - 상급
  lexicon: merces
  rationale: 문맥상 ‘지극히 높으신 분과 함께 있는 것’에 대한 대가/보상을 뜻하므로, 교리적 색채가 강한 ‘상급’보다 더 중립적인 ‘보상’이 원문에 가깝습니다.
- source_word: apud Altissimum
  english_pob_choice: with the Most High
  chosen_korean: 지극히 높으신 분과 함께
  alternatives_korean:
  - 지극히 높으신 분께
  - 지극히 높으신 분에게
  - 가장 높으신 분과 함께
  lexicon: Altissimus
  rationale: apud는 ‘~곁에/~와 함께’의 관계를 나타내므로, 단순 목적어 처리보다 ‘과 함께’로 옮겨 보상의 현존 위치를 살렸습니다.
- source_word: post alios tres dies
  english_pob_choice: after three more days
  chosen_korean: 사흘이 더 지난 뒤에
  alternatives_korean:
  - 세 날이 더 지난 뒤에
  - 사흘 뒤에 다시
  - 또 사흘 뒤에
  lexicon: post
  rationale: alios tres dies의 ‘추가로 세 날’이라는 의미를 반영해 단순한 ‘사흘 뒤’보다 ‘사흘이 더 지난 뒤에’로 구체화했습니다.
- source_word: gravia et mirabilia
  english_pob_choice: weighty and wondrous things
  chosen_korean: 무겁고 놀라운 일들
  alternatives_korean:
  - 중대하고 놀라운 일들
  - 무겁고 경이로운 일들
  - 중요하고 놀라운 일들
  lexicon: gravis / mirabilis
  rationale: gravia는 단순히 ‘중요한’보다 무게감 있는, 감당하기 어려운 성격을 드러내므로 ‘무겁고’로 보존했고, mirabilia는 ‘놀라운’으로 옮겼습니다.
theological_decisions:
- issue: ‘지극히 높으신 분’의 칭호 처리
  chosen_reading: Altissimus를 고유명사화하지 않고 ‘지극히 높으신 분’으로 옮겼습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 라틴 본문은 단순히 ‘Most High’를 말하므로, 본문에 없는 ‘하나님’을 덧붙이지 않고 칭호 자체를 보존했습니다.
  doctrine_reference: 문맥적 절제와 원문 충실성
