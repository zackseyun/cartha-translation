revisions:
- from: 그러므로 내가 너에게 이런 것들을 보여 주었습니다. 왜냐하면 지극히 높으신 분과 함께 보상이 있기 때문입니다. 또한 사흘이 더 지난 뒤에 내가 너에게 다시 말하고, 무겁고 놀라운 일들을 설명해 주겠습니다.”
  to: 그러므로 내가 네게 이런 것들을 보여 주었습니다. 지극히 높으신 분께 보상이 있기 때문입니다. 사흘이 더 지나면 내가 네게 다시 말하고, 중대하고 놀라운 일들을 설명해 주겠습니다.”
  rationale: 원문의 논리 연결과 미래 약속을 유지하면서, apud의 소유·보관 관계를 자연스러운 한국어로 명확히 했습니다. 또한 gravia의 비유적 의미를 ‘중대한’으로 옮겨 현대 표준어의 자연스러움을 높였습니다.
