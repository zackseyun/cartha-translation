lexical_decisions:
- source_word: uolentes uenire
  english_pob_choice: wanting to come
  chosen_korean: 와서
  alternatives_korean:
  - 오려고 하는
  - 오기를 원하는
  lexicon: uolentes + uenire
  rationale: 현재분사적 의도를 한국어에서 자연스럽게 풀어, ‘오려고 하는’의 뜻을 유지하되 문장을 간결하게 했습니다.
- source_word: expugnare
  english_pob_choice: attack
  chosen_korean: 습격하려는
  alternatives_korean:
  - 공격하려는
  - 정복하려는
  - 함락시키려는
  lexicon: expugnare
  rationale: 라틴어 expugnare는 단순한 공격보다 ‘기습적으로 들이쳐 무너뜨리다/함락시키다’의 뉘앙스가 있어, 본문 맥락에서는 ‘습격하다’가 가장 근접합니다.
theological_decisions:
- issue: 무리의 의도 표현 방식
  chosen_reading: 행동의 목적을 ‘습격하려는’으로 번역해, 단순한 적대감이 아니라 실제로 제압하려는 의도를 드러냈습니다.
  alternative_readings:
  - ‘공격하려는’으로 완화
  - ‘정복하려는’으로 강화
  rationale: 라틴어 expugnare의 어감과 영어 POB의 변천(attack vs. conquer)을 함께 고려하면, 한국어에서는 ‘습격’이 과도한 해석 없이 긴장감을 보존합니다.
  doctrine_reference: 본문의 서술적 전투 이미지
