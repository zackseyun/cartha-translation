  text: And bewilderment of mind will come upon those who inhabit the earth. And they will plan to make war, one against another, city against city, place against place,
translation:
  language: ko
  text: 땅에 거주하는 자들 위에 정신의 혼란이 임할 것입니다. 그리고 그들은 서로 맞서 싸우려 할 것이니, 성읍 대 성읍, 지역 대 지역입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 ciuitas와 locus는 문맥상 단순한 행정구역보다 공동체·영역 전체의 충돌을 가리킬 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: excessus mentis
  english_pob_choice: bewilderment of mind
  chosen_korean: 정신의 혼란
  alternatives_korean:
  - 마음의 혼란
  - 정신의 어지러움
  - 혼미
  lexicon: excessus / mens
  rationale: 라틴어 excessus mentis는 단순한 놀람보다 정신 기능의 이탈·혼란을 가리키므로, POB의 bewilderment of mind를 살리면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: super eos qui inhabitant terram
  english_pob_choice: upon those who inhabit the earth
  chosen_korean: 땅에 거주하는 자들 위에
  alternatives_korean:
  - 땅에 사는 사람들 위에
  - 세상에 사는 자들 위에
  lexicon: super / inhabitare / terra
  rationale: inhabitant terram을 직역적으로 유지해 대상 범위를 분명히 했고, terram은 여기서 종말론적 대비가 있는 ‘땅’으로 옮겼습니다.
- source_word: cogitabunt bellare
  english_pob_choice: they will plan to make war
  chosen_korean: 서로 맞서 싸우려 할 것입니다
  alternatives_korean:
  - 전쟁을 꾀할 것입니다
  - 싸우기로 계획할 것입니다
  lexicon: cogitare / bellare
  rationale: cogitabunt는 단순한 감정이 아니라 의도적 계획을, bellare는 전쟁 행위를 가리키지만 뒤따르는 대구(성읍 대 성읍, 지역 대 지역)를 살려 한국어에서는 ‘서로 맞서 싸우다’로 다듬었습니다.
- source_word: ciuitates ciuitatem et locus locum
  english_pob_choice: city against city, place against place
  chosen_korean: 성읍 대 성읍, 지역 대 지역
  alternatives_korean:
  - 도시 대 도시, 장소 대 장소
  - 성읍과 성읍, 장소와 장소
  lexicon: ciuitas / locus
  rationale: ciuitates와 ciuitatem의 병렬은 라틴어의 대구와 충돌을 강조하므로, 한국어에서도 반복 구조를 유지했고 locus는 물리적 ‘장소’보다 넓은 충돌 범위를 드러내기 위해 ‘지역’으로 옮겼습니다.
theological_decisions:
- issue: 종말적 혼란과 내전적 충돌의 병렬 표현
  chosen_reading: 첫 문장은 정신적 혼란, 둘째 문장은 인간 공동체 내부의 전쟁 계획으로 구분해 번역했습니다.
  alternative_readings:
  - 정신적 혼란과 실제 전쟁을 한 문장으로 더 압축하는 번역
  rationale: 원문은 내적 붕괴와 외적 폭력을 연속된 두 진술로 제시하므로, 그 긴장을 분명히 드러내는 편이 본문의 예언적 강도를 보존합니다.
  doctrine_reference: apocalyptic discourse
