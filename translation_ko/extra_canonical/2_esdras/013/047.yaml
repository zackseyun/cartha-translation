  source_fidelity: 라틴어의 현존 구절인 "propter hoc uidisti multitudinem collectam cum pace"는 ‘그러므로/이 때문에’, ‘보았다’(2인칭 단수), ‘모인 무리’, ‘평화 가운데/평화롭게’로 충실히 옮길 수 있습니다. 초안의 ‘여러분은’은 단수인 uidisti를 복수로 바꾸므로 수정이 필요합니다. 제공된 라틴어는 뒤의 "Sed et qui"에서 절단되지만, 번역 대상이 된 앞 문장은 완결된 진술로 제시할 수 있습니다.
  naturalness: ‘평화 가운데 모여 있는 무리’도 이해되지만, collectam의 완료된 집합 상태에는 ‘평화 가운데 모인 무리’가 더 간결하고 자연스럽습니다. 한국어에서는 주어를 생략해도 앞선 환시 해설의 직접 خطاب이 유지되며, ‘보았습니다’가 요청된 합쇼체를 나타냅니다.
  terminology: multitudo는 ‘무리’, pax는 이 문맥에서 공동체적 안정 상태를 나타내는 ‘평화’로 유지하는 것이 적절합니다. 신학적 해석을 덧붙일 필요가 없습니다.
