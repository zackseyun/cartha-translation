source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propter hoc uidisti multitudinem collectam cum pace, Sed et qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/047.yaml
  text: Again the Most High will hold back the channels of the river, so that they may cross. Therefore you saw the multitude gathered in peace.
translation:
  language: ko
  text: 그러므로 평화 가운데 모인 무리를 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: propter hoc
  english_pob_choice: Therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 그런 까닭에
  lexicon: propter hoc
  rationale: 앞선 맥락의 결과를 받는 접속을 한국어에서 가장 자연스럽고 문맥적으로 분명하게 옮겼습니다.
- source_word: uidisti
  english_pob_choice: you saw
  chosen_korean: 여러분은 ... 보았습니다
  alternatives_korean:
  - 당신은 ... 보았습니다
  - 네가 ... 보았다
  lexicon: uidisti
  rationale: 직접 청중에게 말하는 2인칭 단수형을 한국어 독자에게는 정중한 복수 호격처럼 처리하여 예언적 설명문의 공적 어조를 살렸습니다.
- source_word: multitudinem collectam
  english_pob_choice: the multitude gathered
  chosen_korean: 모여 있는 무리
  alternatives_korean:
  - 모인 무리
  - 집결한 무리
  lexicon: multitudo / collectus
  rationale: 단순히 ‘모였다’는 상태를 유지하면서도 군중의 집합을 자연스럽게 표현했습니다.
- source_word: cum pace
  english_pob_choice: in peace
  chosen_korean: 평화 가운데
  alternatives_korean:
  - 평안 가운데
  - 평화롭게
  lexicon: cum + pax
  rationale: 라틴어 전치사구의 상태적 의미를 살려, ‘평화’가 분위기나 환경을 가리키도록 옮겼습니다.
theological_decisions:
- issue: 문장의 종결부가 절단된 상태인지, 완결된 의미의 단편인지
  chosen_reading: 현존 라틴어가 가리키는 의미 단위를 따라 완결된 한국어 진술로 제시했습니다.
  alternative_readings:
  - 원문 단편성을 드러내기 위해 끝을 불완전하게 남기는 방식
  rationale: 제공된 소스는 문장 일부이지만, 영어 POB는 하나의 완결된 진술로 정리하고 있으므로 그 audit trail을 따라 읽기 쉬운 형태로 제시했습니다.
  doctrine_reference: 텍스트 비평/번역 관례
- issue: peace의 번역
  chosen_reading: ‘평화’로 옮겨 공동체적·종말론적 안정의 뉘앙스를 유지했습니다.
  alternative_readings:
  - 평안
  - 안식
  rationale: 이 문맥의 pax는 단순 심리 상태보다 집합된 무리의 안정된 상태를 나타내므로, 영어 POB의 ‘in peace’와 맞물리는 공적·공동체적 표현이 적합합니다.
  doctrine_reference: 성서 라틴어 pax의 문맥 의미
