id: 2ES.13.41
reference: 2 Esdras 13:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: consilium hoc, ut derelinquerent multitudinem gentium, et proficiscerentur in ulteriorem regionem, ubi nunquam inhabitauit genus humanum, Vt uel ibi obseruarent legitima sua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/041.yaml
  text: But they formed this plan among themselves, that they would leave the multitude of the nations and go on into a more distant region, where no human race had ever lived, so that there they might keep their statutes,
translation:
  language: ko
  text: 그들은 스스로 이렇게 계획했습니다. 곧 민족들의 무리를 떠나, 한층 더 먼 지역으로 가서, 그곳에서는 한 번도 어떤 인간 نسل도 살아본 적이 없으므로, 거기서 자기들의 규례들을 지키려는 것이었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘규례들’은 라틴어 legitima의 공동체 규범적 의미를 살린 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: consilium hoc
  english_pob_choice: this plan among themselves
  chosen_korean: 스스로 이렇게 계획했습니다
  alternatives_korean:
  - 이런 계획을 세웠습니다
  - 서로 이 계획을 꾸몄습니다
  lexicon: consilium
  rationale: consilium은 단순한 생각이 아니라 구체적인 계획이므로, ‘계획하다’로 옮기되 ‘스스로’로 서로 공모한 뉘앙스를 살렸습니다.
- source_word: multitudinem gentium
  english_pob_choice: the multitude of the nations
  chosen_korean: 민족들의 무리
  alternatives_korean:
  - 열방의 무리
  - 여러 민족의 무리
  lexicon: multitudo / gentes
  rationale: 복수의 gentium을 ‘민족들’로 유지해 원문의 집합성을 드러냈고, multitudinem은 ‘무리’로 옮겨 양적 뉘앙스를 살렸습니다.
- source_word: legitima sua
  english_pob_choice: their statutes
  chosen_korean: 자기들의 규례들
  alternatives_korean:
  - 자기들의 율례들
  - 자기들의 법도들
  lexicon: legitima
  rationale: legitima는 단순한 법이 아니라 공동체가 지켜야 할 규범·규례를 뜻하므로, 본문 맥락에 맞게 ‘규례들’로 옮겼습니다.
theological_decisions:
- issue: 공동체 분리와 규례 준수의 목적절
  chosen_reading: 그들이 더 먼 지역으로 가는 목적은 그곳에서 자기들의 규례들을 지키려는 데 있습니다.
  alternative_readings:
  - 단순 이동 서술로만 처리
  - 종교적 분리를 약화하여 번역
  rationale: 라틴어 ut절은 목적을 분명히 제시하므로, ‘~하려는 것이었습니다’로 목적성을 보존했습니다.
  doctrine_reference: 본문의 서사적·공동체적 자기 이해를 보존하는 번역 원칙
