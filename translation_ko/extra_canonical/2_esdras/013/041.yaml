revisions:
- from: 그들은 스스로 이렇게 계획했습니다. 곧 민족들의 무리를 떠나, 한층 더 먼 지역으로 가서, 그곳에서는 한 번도 어떤 인간 نسل도 살아본 적이 없으므로, 거기서 자기들의 규례들을 지키려는 것이었습니다.[a]
  to: 그들은 이런 계획을 세웠습니다. 곧 여러 민족의 무리를 떠나, 인류가 한 번도 살아본 적이 없는 더 먼 지역으로 가서, 거기서 자기들의 규례들을 지키려는 것이었습니다.
  rationale: 혼입된 비한국어 문자를 ‘인류’로 바로잡고, 관계절과 목적절을 원문의 순서와 관계에 맞게 재구성했습니다. legitima sua는 본문에서 ‘자기들의 규례들’로 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:24Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 목적절(ut ... observarent)을 살려 ‘거기서 ... 지키려는’으로 옮긴 점은 적절합니다. 그러나 ‘인간 نسل’에는 한국어가 아닌 문자가 섞여 있어 반드시 바로잡아야 하며, 원문의 관계절과 목적절을 인과절처럼 연결한 ‘없으므로’도 원문의 구문 관계를 바꿉니다.
  naturalness: ‘인간 نسل’은 명백한 표기 오류입니다. 또한 ‘그곳에서는 … 없으므로, 거기서’는 부자연스럽고 논리 관계가 어색합니다. ‘인류가 한 번도 살아본 적이 없는 … 지역으로 가서, 거기서’가 자연스럽습니다.
  terminology: legitima sua는 이 문맥에서 ‘자기들의 규례들’로 번역할 수 있습니다. 별도 주석 없이도 의미가 충분히 전달되므로, 번역 선택만 설명하는 주석은 삭제하는 편이 낫습니다.
  issues:
  - severity: high
    issue: 본문에 비한국어 문자 ‘نسل’이 혼입됨
    rationale: 한국어 본문으로 읽을 수 없는 구조적·표기상 오류이며, 라틴어 genus humanum(인류)을 정확히 반영하지 못합니다.
  - severity: medium
    issue: ‘없으므로’가 관계절을 인과 관계로 전환함
    rationale: 원문은 ‘인류가 한 번도 거주하지 않았던 지역’이라는 장소 수식 뒤에 ‘그곳에서 규례들을 지키기 위해’라는 목적을 제시합니다. 인과 접속은 이 구문 관계를 불필요하게 변경합니다.
  revised_text: 그들은 이런 계획을 세웠습니다. 곧 여러 민족의 무리를 떠나, 인류가 한 번도 살아본 적이 없는 더 먼 지역으로 가서, 거기서 자기들의 규례들을 지키려는 것이었습니다.
