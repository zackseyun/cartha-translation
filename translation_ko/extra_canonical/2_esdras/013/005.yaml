source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et vidi post haec, et ecce congregabatur multitudo hominum, quorum non erat numerus, de quattuor ventis caeli, ut debellarent hominem qui ascenderat de mari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/005.yaml
  text: And after this I looked, and behold, a multitude of men was gathering, whose number was beyond counting, from the four winds of heaven, to make war against the man who had come up from the sea.
translation:
  language: ko
  text: 그리고 그 뒤에 내가 보니, 헤아릴 수 없는 수많은 사람이 모여들고 있었는데, 하늘의 네 바람에서부터 와서 바다에서 올라온 그 사람과 싸우려고 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 quorum non erat numerus는 문자적으로는 ‘그 수가 없었다’에 가깝지만, 영어 POB는 자연스러운 의미로 ‘whose number was beyond counting’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: et vidi post haec
  english_pob_choice: And after this I looked
  chosen_korean: 그리고 그 뒤에 내가 보니
  alternatives_korean:
  - 이 일 뒤에 내가 보았고
  - 그 후에 내가 보니
  lexicon: vidi / post haec
  rationale: 시각적 환시의 전개를 자연스럽게 살리되, 문어체에서 읽기 흐름이 부드럽도록 ‘내가 보니’로 옮겼습니다.
- source_word: multitudo hominum
  english_pob_choice: a multitude of men
  chosen_korean: 수많은 사람
  alternatives_korean:
  - 사람들의 큰 무리
  - 인간의 무리
  lexicon: multitudo hominum
  rationale: 집합적 의미를 살리면서도 한국어에서 자연스러운 표현으로 옮겼습니다.
- source_word: quorum non erat numerus
  english_pob_choice: whose number was beyond counting
  chosen_korean: 헤아릴 수 없는
  alternatives_korean:
  - 셀 수 없는
  - 그 수를 헤아릴 수 없는
  lexicon: numerus
  rationale: 라틴어의 ‘셀 수 없음’이라는 의미를 유지하면서, 본문 흐름에 맞게 간결하게 처리했습니다.
- source_word: de quattuor ventis caeli
  english_pob_choice: from the four winds of heaven
  chosen_korean: 하늘의 네 바람에서부터
  alternatives_korean:
  - 하늘의 네 바람으로부터
  - 하늘 사방에서
  lexicon: quattuor ventis caeli
  rationale: 직역에 가깝게 유지하여 상징적·우주적 방향 표지를 드러냈습니다.
- source_word: ut debellarent hominem
  english_pob_choice: to make war against the man
  chosen_korean: 그 사람과 싸우려고 했습니다
  alternatives_korean:
  - 그 사람을 대적하려고 했습니다
  - 그 사람을 상대로 전쟁하려고 했습니다
  lexicon: debellare
  rationale: debellare의 전투적 의미를 반영하되, 한국어에서는 자연스럽고 읽기 쉬운 ‘싸우다’로 옮겼습니다.
theological_decisions:
- issue: 바다에서 올라온 인물의 호칭
  chosen_reading: 그 사람
  alternative_readings:
  - 그 남자
  - 그 인자
  rationale: 본문은 단순히 hominem(사람/인간)을 사용하므로, 뒤에서 의미를 과도하게 해석하지 않고 원문의 지시 대상을 그대로 유지했습니다.
  doctrine_reference: 본문 주해의 과잉해석 방지
- issue: 문학적 환시 서술의 시점
  chosen_reading: ‘내가 보니’로 현재적 환시 진행을 살림
  alternative_readings:
  - 과거 완료형으로 굳게 번역
  - ‘내가 보았고’로 단순 서술
  rationale: 예언/환시 문맥의 생동감을 보존하기 위해 관찰자의 즉시성을 살렸습니다.
  doctrine_reference: 묵시문학 서술 관례
