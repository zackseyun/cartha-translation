- from: 하지만 저는 그가 자기 입에서 마치 불의 물결 같은 것을 내보내는 것과, 자기 입술에서 불꽃의 숨결을, 그리고 자기 혀에서 폭풍의 불꽃들을 쏘아 내는 것만 보았습니다.[a]
  to: 하지만 저는 그가 그의 입에서 마치 불의 물결처럼 내뿜고, 그의 입술에서 불꽃의 숨결을, 그의 혀에서 폭풍의 불티들을 내뿜는 것만 보았습니다.
  rationale: 근거 없는 각주를 삭제하고, 원문의 반복된 de ore/de labiis/de lingua 구조와 세 가지 화염 이미지를 보존했습니다. ‘마치’로 sicut의 비교를 유지했으며, scintillas는 ‘불티들’로 구체화했습니다. 본 절만으로는 앞선 절에 속하는 절단 어구 aliquod uas bellicosum에 관한 주석을 안전하게 제공할 수 없습니다.
