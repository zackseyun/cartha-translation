lexical_decisions:
- source_word: interpretatio enim visionis haec
  english_pob_choice: For this is the interpretation of the vision
  chosen_korean: 이는 환상의 해석입니다
  alternatives_korean:
  - 이것은 환상의 해석입니다
  - 환상의 해석은 이것입니다
  lexicon: interpretatio = 해석; visio = 환상
  rationale: 라틴어 interpretatio를 ‘해석’으로, 지시어 haec를 자연스러운 문두 강조인 ‘이는’으로 옮겨 설명문의 서두를 간결하게 살렸습니다.
- source_word: enim
  english_pob_choice: For
  chosen_korean: (문두 연결을 반영해 생략하지 않음)
  alternatives_korean:
  - 그리고
  - 또한
  - 왜냐하면
  lexicon: enim = 설명적 접속사/후치 입자
  rationale: enim은 단순한 병렬 접속이 아니라 앞선 비전을 풀이하는 설명적 연결이므로, 한국어에서는 문장 전체의 설명 흐름으로 반영했습니다.
- source_word: quia vidisti
  english_pob_choice: because you saw
  chosen_korean: 곧 당신이 … 보았기 때문입니다
  alternatives_korean:
  - 왜냐하면 당신이 … 보았기 때문입니다
  - 당신이 … 보았으므로
  lexicon: quia = because; vidisti = you saw
  rationale: 라틴어 quia vidisti를 직역에 가깝게 ‘보았기 때문입니다’로 옮겨, 이전 수정이 강조한 직접성과 논리적 인과를 유지했습니다.
- source_word: virum ascendentem de corde maris
  english_pob_choice: a man coming up from the heart of the sea
  chosen_korean: 바다의 심장으로부터 올라오는 한 사람
  alternatives_korean:
  - 바다 한가운데로부터 올라오는 한 사람
  - 바다의 중심에서 올라오는 한 사람
  lexicon: vir = 사람/남자; ascendere = 올라오다; cor maris = 바다의 심장
  rationale: virum은 성별을 드러내는 ‘남자’보다 원문이 지시하는 인물성을 살려 ‘한 사람’으로 두었고, cor maris는 관용을 약화시키지 않도록 ‘바다의 심장’으로 직역했습니다.
theological_decisions:
- issue: 설명문의 시작에 대한 연결사 처리
  chosen_reading: ‘For’에 해당하는 enim을 한국어에서 문장 논리로 반영해, 단순 병렬이 아니라 비전 해석의 이유 제시로 읽히게 했습니다.
  alternative_readings:
  - ‘그리고’로 옮겨 단순 추가 설명처럼 읽히게 하는 방식
  - 접속사를 완전히 생략하는 방식
  rationale: 본문은 환상 해석의 근거를 제시하는 주석 문장으로, 설명적 인과를 유지하는 것이 본문의 의도를 더 잘 드러냅니다.
  doctrine_reference: 문맥적 해석 원칙
