  naturalness: ‘많은 사람의 얼굴들이’는 현대 한국어에서 다소 부자연스럽습니다. ‘많은 사람들의 얼굴이’가 더 자연스럽고, 환상 속에서 얼굴들이 다가오는 원문의 영상성도 유지합니다. ‘큰 두려움에 깨어나서’는 ‘두려움이 너무 커서 잠에서 깨어나’로 풀면 인과관계가 분명해집니다.
  terminology: ‘지극히 높으신 분’과 ‘간구하고’는 존칭을 갖춘 합쇼체 서사에 적절합니다. alligati에는 ‘결박되어’가 단순한 ‘묶여’보다 구속된 상태를 조금 더 정확히 드러냅니다.
