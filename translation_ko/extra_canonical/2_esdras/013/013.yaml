reference: 2 Esdras 13:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et accedebant ad eum vultus hominum multorum, quorumdam gaudentium, quorumdam tristantium, aliqui vero alligati, aliqui adducentes ex eis qui offerebantur. et egoa multitudine pavoris expergefactus sum et deprecatus sum Altissimum et dixi:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/013.yaml
  text: 'And many human faces were coming to him: some rejoicing, some grieving; some were bound, and some were bringing those who were being led. And I awoke from the greatness of my fear, and I made supplication to the Most High and said,'
translation:
  language: ko
  text: 그리고 많은 사람의 얼굴들이 그에게로 나아오고 있었습니다. 어떤 이들은 기뻐했고, 어떤 이들은 슬퍼했으며, 어떤 이들은 묶여 있었고, 어떤 이들은 끌려가고 있는 이들을 데리고 오고 있었습니다. 나는 큰 두려움에 깨어나서 지극히 높으신 분께 간구하며 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: offerebantur는 여기서 ‘희생 제물로 바쳐지다’보다 ‘끌려가다/인도되다’의 뜻으로 이해했습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: vultus hominum multorum
  english_pob_choice: many human faces
  chosen_korean: 많은 사람의 얼굴들
  alternatives_korean:
  - 많은 인간들의 얼굴들
  - 많은 사람들의 얼굴
  lexicon: vultus / homo
  rationale: lat. vultus는 단순한 신체 부위보다 ‘얼굴들/표정’에 초점이 있으므로, POB의 ‘human faces’에 맞추어 자연스럽게 ‘사람의 얼굴들’로 옮겼습니다.
- source_word: gaudentium, quorumdam tristantium
  english_pob_choice: some rejoicing, some grieving
  chosen_korean: 어떤 이들은 기뻐했고, 어떤 이들은 슬퍼했으며
  alternatives_korean:
  - 어떤 이들은 즐거워했고, 어떤 이들은 슬퍼했으며
  - 어떤 이들은 기뻐하고, 어떤 이들은 슬퍼하고
  lexicon: gaudere / tristari
  rationale: 분사구문을 한국어 서술절로 풀어, 감정 상태의 대비가 또렷하게 드러나도록 했습니다.
- source_word: aliqui vero alligati
  english_pob_choice: some were bound
  chosen_korean: 어떤 이들은 묶여 있었고
  alternatives_korean:
  - 어떤 이들은 결박되어 있었고
  - 어떤 이들은 속박되어 있었고
  lexicon: alligatus
  rationale: alligati는 단순한 ‘묶임’보다 구속된 상태를 뜻하지만, 한국어에서는 지나치게 문어적인 용어보다 ‘묶여 있었고’가 장면의 압박감을 잘 전달합니다.
- source_word: aliqui adducentes ex eis qui offerebantur
  english_pob_choice: some were bringing those who were being led
  chosen_korean: 어떤 이들은 끌려가고 있는 이들을 데리고 오고 있었습니다
  alternatives_korean:
  - 어떤 이들은 끌려가는 이들을 데리고 오고 있었습니다
  - 어떤 이들은 인도되고 있는 이들을 데리고 오고 있었습니다
  lexicon: adducere / offerebantur
  rationale: POB의 개정처럼 offerebantur를 ‘제물로 드려지다’보다 ‘끌려가고/인도되고 있다’는 방향성으로 이해해, 희생 제의적 뉘앙스를 피하고 행진 장면의 움직임을 살렸습니다.
- source_word: Altissimum
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 이
  lexicon: Altissimus
  rationale: 2에스드라스의 경건한 호칭을 한국어에서 자연스럽고 존칭적으로 옮기기 위해 ‘지극히 높으신 분’을 선택했습니다.
theological_decisions:
- issue: offerebantur의 해석이 ‘드려지다/바쳐지다’로 오해될 가능성
  chosen_reading: 이 문맥에서는 제의적 ‘제물로 바쳐짐’보다 ‘끌려감/인도됨’의 장면으로 읽었습니다.
  alternative_readings:
  - ‘드려지고 있는 이들’
  - ‘바쳐지고 있는 이들’
  rationale: 영문 POB의 수정 이유와 라틴어 문맥을 따라, 여기서는 희생 제의 해석을 지양하고 군중/행렬의 시각적 움직임에 초점을 두는 것이 더 타당합니다.
  doctrine_reference: 문맥 우선 원칙
- issue: deprecatus sum의 기도 어조
  chosen_reading: ‘간구하며 말했습니다’로 평서 서술 안에 기도 동사를 유지했습니다.
  alternative_readings:
  - ‘기도하며 말했습니다’
  - ‘간청하며 말했습니다’
  rationale: 라틴어 deprecari의 간절한 청원을 드러내면서도, 이어지는 직접 인용부를 예고하는 서술로 자연스럽게 맞췄습니다.
  doctrine_reference: 서사체 기도 묘사
