    rationale: 라틴어 완료 2인칭 단수이며, 원문의 직접 خطاب 대상을 보존해야 합니다.
  - severity: high
    issue: 관계절과 진행 동작이 ‘그분은 올라가시는 사람이었습니다’라는 독립 과거 서술로 변경됨
    rationale: 원문은 ‘네가 한 사람으로서 올라가는 것을 본 내 아들’이라는 수식 구조이며, ascendentem의 진행적 의미를 유지해야 합니다.
  - severity: medium
    issue: ‘서로 맞서 가진 전쟁’이 비자연스럽고 결속 관계가 불명확함
    rationale: bellum quod habent in alterutro는 민족들이 서로 간에 벌이는 전쟁을 가리키므로 ‘서로 간에 벌이고 있는 전쟁’이 명료합니다.
  - severity: low
