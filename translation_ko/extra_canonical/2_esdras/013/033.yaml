  source_fidelity: 수정이 필요합니다. uidisti는 단수 ‘네가 보았다’인데 초안은 ‘너희가’로 복수화했습니다. 또한 quem uidisti uirum ascendentem은 ‘네가 한 사람으로서 올라가는 것을 본’ 아들을 수식하는 관계절인데, 초안은 이를 ‘그분은 … 사람이었습니다’라는 독립 과거 진술로 바꾸어 원문의 문법적 관계와 진행 동작을 훼손했습니다.
  naturalness: ‘서로 맞서 가진 전쟁’은 현대 표준 한국어에서 부자연스럽습니다. ‘서로 간에 벌이고 있는 전쟁’이 자연스럽고 원문의 상호 적대 관계를 보존합니다. ‘한 사람으로서 올라가는 것을 본’은 관계절의 수식 범위와 uirum의 의미를 무리 없이 드러냅니다.
  terminology: reuelabitur는 ‘드러날 것입니다’로 적절합니다. filius meus는 존칭을 임의로 부가하지 않고 ‘내 아들’로 유지합니다. ascendentem은 ‘올라가는’으로 번역하여 ‘승천’이라는 후대의 특정 신학 용어를 본문에 강제하지 않습니다. regionem은 국가 영토로 한정하지 않는 ‘지역’으로, bellum은 ‘전쟁’으로 옮겼습니다.
