  yaml_path: translation/extra_canonical/2_esdras/013/033.yaml
  text: my Son will be revealed, whom you saw as a man ascending. And it shall be, when all the nations hear his voice, each will leave his own land and the war that they have against one another,
translation:
  language: ko
  text: 네가 한 사람으로서 올라가는 것을 본 내 아들이 드러날 것이며, 모든 민족이 그의 음성을 들을 때에는 저마다 자기 지역과 서로 간에 벌이고 있는 전쟁을 버릴 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: reuelabitur filius meus
  english_pob_choice: my Son will be revealed
  chosen_korean: 내 아들은 드러날 것이며
  alternatives_korean:
  - 내 아들은 나타나실 것입니다
  - 내 아들이 계시될 것입니다
  lexicon: reuelo / revelare
  rationale: reuelabitur는 단순 출현보다 감춰졌다가 공개되는 의미가 강하므로, ‘드러날’로 옮겨 계시·현현의 뉘앙스를 살렸습니다.
- source_word: quem uidisti uirum ascendentem
  english_pob_choice: whom you saw as a man ascending
  chosen_korean: 너희가 본 그분은 올라가시는 사람이었습니다
  alternatives_korean:
  - 너희가 본 그분은 올라가던 사람이었습니다
  - 너희가 본 그분은 승천하는 사람이었습니다
  lexicon: uidisti / ascendentem
  rationale: ascendentem의 상승 동작을 직접 반영하되, 종교적 전통어인 ‘승천’은 본문만으로는 단정하지 않고 ‘올라가시는’으로 두었습니다.
- source_word: omnes gentes uocem eius
  english_pob_choice: all the nations hear his voice
  chosen_korean: 모든 민족이 그분의 음성을 들을 때에는
  alternatives_korean:
  - 모든 민족이 그분의 소리를 들을 때에는
  - 모든 나라들이 그분의 음성을 들으면
  lexicon: gentes / uocem
  rationale: gentes는 민족 단위를 살려 ‘민족들’보다 자연스러운 복수 표현인 ‘모든 민족’으로 옮겼고, uocem은 인격적 호소를 드러내는 ‘음성’이 더 적절합니다.
- source_word: derelinquet unusquisque regionem suam et bellum quod habent in alterutro
  english_pob_choice: each will leave his own land and the war that they have against one another
  chosen_korean: 각자 자기 땅과 서로 맞서 가진 전쟁을 버릴 것입니다
  alternatives_korean:
  - 각 사람은 자기 땅과 서로 간에 가진 전쟁을 떠날 것입니다
  - 각자는 자기 땅과 서로 대적하는 전쟁을 버릴 것입니다
  lexicon: regionem / bellum / in alterutro
  rationale: derelinquet는 단순 이동이 아니라 ‘버리다/떠나다’의 포기를 뜻하므로 ‘버릴 것입니다’로, bellum은 관계적 적대 상태를 살려 ‘서로 맞서 가진 전쟁’으로 옮겼습니다.
theological_decisions:
- issue: ‘내 아들’의 메시아적 정체성과 공개
  chosen_reading: 이 구절은 ‘내 아들’이 드러난다는 표현으로 메시아적 아들의 현현을 선언합니다.
  alternative_readings:
  - 단순히 왕적 인물의 등장으로 볼 수 있습니다
  - 미래의 예언적 인물 공개로만 읽을 수 있습니다
  rationale: 원문과 POB는 단순한 출현보다 하나님의 아들이 공적으로 나타나는 종말론적 계시를 강조합니다.
  doctrine_reference: 메시아론, 계시론
