  text: 'et quoniam non tenebat frameam neque vas bellicosum, corrumpitenim impetum eius multitudinis quae venerat ad expugnare eum, haec interpretatio:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/028.yaml
  text: 'and that he held neither sword nor weapon of war, yet destroyed the assault of the multitude that had come to attack him, this is the interpretation:'
translation:
  language: ko
  text: '또 그가 칼도 전쟁용 무기도 지니지 않았으면서 자신을 공격하러 온 무리의 공격을 물리쳤다는 것, 이것이 그 해석입니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: frameam
  english_pob_choice: sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 단검
  lexicon: framea
  rationale: 영어 POB가 최신 수정에서 spear를 sword로 바로잡았으므로, 한국어도 무기 종류를 과도하게 구체화하지 않고 일반적인 ‘칼’로 옮겨 본문 의미를 반영했습니다.
- source_word: vas bellicosum
  english_pob_choice: weapon of war
  chosen_korean: 전쟁용 무기
  alternatives_korean:
  - 전쟁 무기
  - 전투 무기
  - 무기
  lexicon: vas bellicosum
  rationale: 단순한 ‘무기’보다 라틴어의 전쟁·전투용 성격을 드러내기 위해 ‘전쟁용 무기’로 옮겼습니다.
- source_word: corrumpit... impetum
  english_pob_choice: destroyed the assault
  chosen_korean: 기세를 꺾으셨습니다
  alternatives_korean:
  - 공격을 무너뜨리셨습니다
  - 돌격을 파괴하셨습니다
  - 공세를 꺾으셨습니다
  lexicon: corrumpere; impetus
  rationale: 문맥상 물리적 파괴보다 ‘돌격/공격의 기세를 꺾다’는 뜻이 자연스러워, 역동을 살리면서도 과도한 해석을 피하는 표현을 선택했습니다.
- source_word: multitudinis quae venerat ad expugnare eum
  english_pob_choice: the multitude that had come to attack him
  chosen_korean: 자신에게 달려와 그를 공격하려던 무리
  alternatives_korean:
  - 그를 치러 온 무리
  - 그를 공격하러 온 무리
  - 그를 정복하려고 온 무리
  lexicon: multitudo; expugnare
  rationale: expugnare의 ‘공격하다/함락시키다’ 뉘앙스를 살리되, 한국어 자연성을 위해 ‘달려와 … 공격하려던 무리’로 다듬었습니다.
theological_decisions:
- issue: 해석문 도입부의 1인칭/수동형 처리
  chosen_reading: 본문은 설명적 결론을 제시하는 해석문으로 보고, 직접적인 신학적 주체를 덧붙이지 않았습니다.
  alternative_readings:
  - 그가 … 꺾었습니다로 단순 서술
  - 하나님이 … 꺾으셨습니다로 신적 주체 보충
  rationale: 라틴어 본문 자체는 앞선 상징의 해석을 이어 주는 문장이라, 주체를 임의로 보충하지 않고 사물-설명 구조를 유지했습니다.
  doctrine_reference: 본문해석 원칙; 문맥 우선
