  terminology: gubernat는 문맥상 ‘다스리시고’가 적절합니다. tempora는 복수성을 살려 ‘때들을’로, inlata는 행위 주체를 과도하게 특정하지 않고 ‘일어나게 되는 일들’로 옮겼습니다.
