revisions:
- from: 그분께서 때를 다스리시고 때들 안에서 일어나는 일들을 다스리시기 때문입니다. 그리고 나는 거기에서 사흘 동안 앉아 있었습니다.
  to: 이는 그분께서 때들을 다스리시고 그 때들 가운데 일어나게 되는 일들을 다스리시기 때문입니다. 그리고 나는 그곳에 사흘 동안 앉아 있었습니다.
  rationale: 구절 첫머리의 이유절을 ‘이는 … 때문입니다’로 보존하고, ‘다스리시고’를 두 목적어에 자연스럽게 연결했습니다. 사건들의 발생은 신학적으로 특정한 인과 주체를 덧붙이지 않으면서 수동적 성격을 나타내도록 ‘일어나게 되는 일들’로 수정했습니다. 영어 감사 이력의 이전 번역 관련 각주는 한국어 본문에 필요한 본문·번역 각주가 아니므로 제시하지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:11Z'
