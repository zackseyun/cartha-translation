  source_fidelity: 라틴어의 접속사적·이유적 도입(et quoniam), gubernat의 반복된 지배 대상, tempora의 복수, inlata의 수동적 사건 발생, 그리고 sedi ibi tribus diebus를 충실히 반영하도록 다듬었습니다. 현 초안의 ‘때들 안에서 일어나는’은 inlata의 수동성을 충분히 드러내지 못합니다.
