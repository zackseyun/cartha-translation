source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quoniam gubernat tempora et quae sunt in temporibus inlata. et sedi ibi tribus diebus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/058.yaml
  text: and because he governs the times and the things that are brought about in the times[a]. And I sat there for three days.
  footnotes:
  - marker: a
    text: Or 'And I departed and went into the field, greatly glorifying and praising the Most High for the wonders that he did in their times, and because he governs the times and the things brought about in the times. And I sat there for three days.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 그분께서 때들을 다스리시고 그 때들 가운데 일어나게 되는 일들을 다스리시기 때문입니다. 그리고 나는 그곳에 사흘 동안 앉아 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: gubernat
  english_pob_choice: he governs
  chosen_korean: 다스리시고
  alternatives_korean:
  - 통치하시고
  - 주관하시고
  - 다스리며
  lexicon: guberno
  rationale: 라틴어 gubernat는 단순한 관리보다 주권적 통치를 나타내므로, 하나님의 능동적 주권을 드러내는 ‘다스리시고’를 택했습니다.
- source_word: tempora
  english_pob_choice: the times
  chosen_korean: 때를
  alternatives_korean:
  - 시기를
  - 시간들을
  - 때들을
  lexicon: tempus
  rationale: 문맥상 연대적 ‘때/시기’를 가리키므로 자연스러운 단수형 ‘때를’로 옮겼습니다.
- source_word: quae sunt in temporibus inlata
  english_pob_choice: the things that are brought about in the times
  chosen_korean: 때들 안에서 일어나는 일들을
  alternatives_korean:
  - 때들 안에서 이루어지는 일들을
  - 때들 속에 가져와지는 일들을
  - 때들 가운데 생겨나는 일들을
  lexicon: inlata
  rationale: inlata의 수동적 의미를 살려, ‘때들 안에서 일어나는 일들’로 현재적 발생을 자연스럽게 표현했습니다.
- source_word: et sedi ibi tribus diebus
  english_pob_choice: And I sat there for three days
  chosen_korean: 그리고 나는 거기에서 사흘 동안 앉아 있었습니다
  alternatives_korean:
  - 그리고 나는 거기에서 사흘 동안 머물렀습니다
  - 그리고 나는 거기에서 사흘 동안 앉아 있었습니다
  lexicon: sedi
  rationale: sedi는 문자적으로 ‘앉아 있었다’이므로, 이전 문맥의 누락을 보충하지 않고 직역에 가까운 형태를 유지했습니다.
theological_decisions:
- issue: 하나님의 주권 서술
  chosen_reading: ‘때를 다스리시고’와 ‘때들 안에서 일어나는 일들을 다스리시기’로 하나님의 시간과 사건에 대한 절대 주권을 드러냈습니다.
  alternative_readings:
  - ‘때를 주관하시고’
  - ‘시기를 관리하시고’
  rationale: 본문은 단순한 예지보다 시간 자체와 그 안의 사건들에 대한 주권적 통치를 말하므로, 신학적 강도를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 하나님의 섭리
