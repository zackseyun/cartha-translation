  text: 이 꿈의 해석도 제게 알려 주십시오. 내가 생각하기로는
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: adhuc et interpretationem
  english_pob_choice: Now also show me the interpretation
  chosen_korean: 이 꿈의 해석도 지금 보여 주십시오
  alternatives_korean:
  - 이 꿈의 뜻도 지금 알려 주십시오
  - 이 꿈의 해석도 지금 보여 주십시오
  lexicon: interpretationem
  rationale: interpretationem은 문맥상 단순한 설명이 아니라 꿈의 의미를 풀어 주는 ‘해석’이므로, 청탁형으로 자연스럽게 ‘보여 주십시오’와 결합했습니다.
- source_word: somnii huius
  english_pob_choice: this dream
  chosen_korean: 이 꿈
  alternatives_korean:
  - 이 꿈
  - 이 환상
  lexicon: somnium
  rationale: somnium은 여기서 특별한 계시 환상이라기보다 직전 문맥의 ‘꿈’을 가리키므로, 과도한 신학적 확장을 피하고 직역에 가깝게 옮겼습니다.
- source_word: Sicut enim existimo
  english_pob_choice: For as I think
  chosen_korean: 내가 생각하기로는
  alternatives_korean:
  - 내가 생각하기에는
  - 나는 생각하기에
  lexicon: existimo
  rationale: existimo는 화자의 추정·판단을 표시하므로, 문장 말미에 독립적으로 붙여 앞절과 구분되도록 ‘내가 생각하기로는’으로 옮겼습니다.
theological_decisions:
- issue: 구두점과 절 경계에서의 보존
  chosen_reading: ‘내가 생각하기로는’을 본절 끝에 남겨, 다음 절로 넘기지 않고 라틴 원문의 절 경계를 보존했습니다.
  alternative_readings:
  - ‘내가 생각하기로는’을 16절로 넘기는 읽기
  - 해석 요청만을 본절로 보고 후반구를 생략하는 읽기
  rationale: 제시된 라틴 본문에는 Sicut enim existimo가 15절 말미에 실제로 포함되어 있으므로, 번역도 이를 본절에 반영해야 합니다.
  doctrine_reference: 본문비평/절 경계
