  yaml_path: translation/extra_canonical/2_esdras/013/021.yaml
  text: And he answered me and said, “I will tell you the interpretation of the vision, and I will also explain to you the matters about which you have spoken.”
translation:
  language: ko
  text: 그가 저에게 대답하여 말했습니다. “내가 그 환상의 해석을 너에게 말하겠다. 그리고 네가 말한 그 문제들도 너에게 밝히겠다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: visionis interpretationem
  english_pob_choice: the interpretation of the vision
  chosen_korean: 그 환상의 해석
  alternatives_korean:
  - 그 시현의 해석
  - 그 환시의 해석
  lexicon: visionis interpretationem
  rationale: 라틴어 visionis는 여기서 계시적 ‘환상/시현’을 뜻하므로, 문맥에 맞는 자연스러운 현대 한국어로 ‘환상’을 택했습니다.
- source_word: dicam tibi
  english_pob_choice: I will tell you
  chosen_korean: 말하겠다
  alternatives_korean:
  - 알려 주겠다
  - 말해 주겠다
  lexicon: dicam
  rationale: 미래형의 약속을 살리되 한국어에서는 간결한 ‘말하겠다’가 가장 직접적입니다.
- source_word: sed et
  english_pob_choice: and I will also
  chosen_korean: 그리고
  alternatives_korean:
  - 또
  - 뿐만 아니라
  lexicon: sed et
  rationale: 라틴어의 접속적 누적을 자연스럽게 옮기기 위해 ‘그리고’로 처리했습니다.
- source_word: de quibus locutus es adaperiam tibi
  english_pob_choice: I will also explain to you the matters about which you have spoken
  chosen_korean: 네가 말한 그 문제들도 너에게 밝히겠다
  alternatives_korean:
  - 네가 말한 것들에 대해서도 너에게 설명하겠다
  - 네가 언급한 일들도 너에게 풀어 밝히겠다
  lexicon: adaperiam
  rationale: adaperiam은 단순한 정보 전달보다 ‘열어 보이듯 풀어 밝히다’는 뉘앙스를 가지므로, 본문 흐름에 맞게 ‘밝히겠다’로 옮겼습니다.
theological_decisions:
- issue: 대답하는 화자의 인칭과 직설 인용의 처리
  chosen_reading: 서술문에서는 ‘그가 저에게 대답하여 말했습니다’로, 인용문 안에서는 직접 발화의 약속형을 유지했습니다.
  alternative_readings:
  - ‘그가 내게 대답하여 이르되’처럼 더 전통적인 문체
  - 인용문을 간접화하여 한 문장으로 정리
  rationale: 라틴어 et... dicam... adaperiam 구조의 직접 발화를 살리면서도 현대 한국어 합쇼체의 읽기 흐름을 유지하기 위한 선택입니다.
  doctrine_reference: 문체 선택
