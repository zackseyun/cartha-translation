  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et visionis interpretationem dicam tibi, sed et de quibus locutus es adaperiam tibi.
  language: Latin
base_translation:
