  - severity: low
    issue: ‘문제들’이 de quibus의 의미를 불필요하게 한정합니다.
    rationale: 라틴어 de quibus locutus es는 ‘네가 말한 것들에 관하여’라는 포괄적 표현입니다. ‘일들’이 원문의 의미 범위를 더 잘 보존합니다.
  revised_text: 그가 제게 대답하여 말했습니다. “내가 그 환상의 해석을 네게 말해 주겠습니다. 또한 네가 말한 일들도 네게 밝혀 주겠습니다.”
