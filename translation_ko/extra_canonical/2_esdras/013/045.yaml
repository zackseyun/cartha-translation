  text: For through that region there was a long way to travel, of a year and a half; and that region is called Arzareth.
translation:
  language: ko
  text: 그 길이는 1년 반이나 되었으며, 그 지역은 아르자렛이라고 불립니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimidii
  english_pob_choice: a year and a half
  chosen_korean: 1년 반
  alternatives_korean:
  - 1년 6개월
  - 1년 반의 길이
  lexicon: —
  rationale: 라틴어 dimidii는 앞 구절의 거리/여정 길이를 이어 받아 “반”의 개념을 주며, POB의 영어 해석대로 ‘1년 반’으로 자연스럽게 옮기는 것이 가장 직접적입니다.
- source_word: regio illa
  english_pob_choice: that region
  chosen_korean: 그 지역
  alternatives_korean:
  - 그 땅
  - 그 지역
  lexicon: —
  rationale: regio는 이 문맥에서 지리적 구역을 가리키므로 ‘지역’이 무난하며, 지시어 illa는 앞서 언급된 특정 장소를 가리키는 ‘그’로 처리했습니다.
- source_word: uocatur Arzareth
  english_pob_choice: is called Arzareth
  chosen_korean: 아르자렛이라고 불립니다
  alternatives_korean:
  - 아르자렛이라고 불립니다
  - 아르자렛이라 합니다
  lexicon: —
  rationale: uocatur는 수동 현재로 ‘불리다’가 가장 직접적이며, 고유명사 Arzareth는 음역해 본문 정보 자체를 보존했습니다.
