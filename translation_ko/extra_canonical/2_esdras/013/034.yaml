source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et colligetur in unum multitudo innumerabilis sicut uidisti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/034.yaml
  text: and an innumerable multitude will be gathered into one, as you saw,
translation:
  language: ko
  text: 셀 수 없는 무리가 한데로 모일 것입니다 — 네가 보았던 것처럼.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: colligetur in unum
  english_pob_choice: will be gathered into one
  chosen_korean: 한데로 모일 것입니다
  alternatives_korean:
  - 한 곳으로 모일 것입니다
  - 하나로 모일 것입니다
  - 한데 모여들 것입니다
  lexicon: colligō / in unum
  rationale: 라틴어의 핵심은 단순한 집합이 아니라 ‘하나로 합쳐짐’입니다. 한국어에서는 ‘한데로 모이다’가 자연스럽고, 결합의 방향을 살리면서도 과도한 해석을 덧붙이지 않습니다.
- source_word: multitudo innumerabilis
  english_pob_choice: an innumerable multitude
  chosen_korean: 셀 수 없는 무리
  alternatives_korean:
  - 헤아릴 수 없는 무리
  - 무수한 무리
  - 셀 수 없이 많은 무리
  lexicon: multitudo / innumerabilis
  rationale: ‘innumerabilis’는 수량의 과장보다 ‘셀 수 없음’의 불가산성을 드러내므로, 간결하게 ‘셀 수 없는’으로 옮겼습니다.
- source_word: sicut uidisti
  english_pob_choice: as you saw
  chosen_korean: 네가 보았던 것처럼
  alternatives_korean:
  - 네가 보았듯이
  - 네가 보았던 대로
  - 네가 본 것처럼
  lexicon: sicut / uidisti
  rationale: 시점상 과거의 환시를 가리키므로 ‘보았던 것처럼’이 가장 무난합니다. 직설적 예언 문맥에 맞게 간결하게 유지했습니다.
theological_decisions:
- issue: ‘into one’의 신학적 함의
  chosen_reading: 단순한 집합이 아니라 하나 됨의 방향을 보존하는 표현으로 ‘한데로’라고 옮겼습니다.
  alternative_readings:
  - 그냥 ‘모일 것입니다’
  - ‘함께 모일 것입니다’
  rationale: 라틴어 in unum은 단순한 동시 집합보다 ‘하나로 합쳐짐’을 강조할 수 있으므로, 본문이 암시하는 통합성을 약화시키지 않도록 했습니다.
  doctrine_reference: 성도 공동체의 종말론적 통합에 대한 일반적 성경적 표현
