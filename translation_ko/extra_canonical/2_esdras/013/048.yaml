base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/048.yaml
  text: But those of your people who are left[a], who are found within my holy border, shall be saved.
  footnotes:
  - marker: a
    text: Or 'But even those of your people who are left, who are found within my holy border—'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 내 백성 중에 남아 있는 자들, 곧 내 거룩한 경계 안에서 발견되는 자들은 구원받을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러나 내 백성 중에 남아 있는 자들, 곧 내 거룩한 경계 안에서 발견되는 자들은—’.
    reason: previous_rendering
lexical_decisions:
- source_word: derelicti sunt / qui inueniuntur
  english_pob_choice: those of your people who are left, who are found
  chosen_korean: 남아 있는 자들, 곧 …에서 발견되는 자들
  alternatives_korean:
  - 남겨진 자들, 곧 …에서 발견되는 자들
  - 남은 자들, 곧 …에서 발견되는 자들
  lexicon: left / found
  rationale: derelicti sunt는 ‘남겨진/남아 있는’의 상태를, qui inueniuntur는 ‘발견되는’의 존재 위치를 나타내므로, 자연스러운 합쇼체로 옮기되 두 절의 병렬을 살렸습니다.
- source_word: de populo tuo
  english_pob_choice: of your people
  chosen_korean: 내 백성 중에
  alternatives_korean:
  - 당신의 백성 중에
  - 주님의 백성 중에
  lexicon: people
  rationale: 라틴 2인칭 소유를 한국어에서는 1인칭 화자 표현으로 옮겨, 문맥상 말씀하시는 분의 소유 관계를 분명히 했습니다.
- source_word: terminum meum Sanctum
  english_pob_choice: my holy border
  chosen_korean: 내 거룩한 경계
  alternatives_korean:
  - 내 거룩한 경계선
  - 내 거룩한 경계 안
  lexicon: boundary / holy
  rationale: terminum은 단순한 ‘영토’보다 ‘경계/경계선’의 뜻이 강하므로, 성별된 경계를 드러내는 ‘거룩한 경계’로 옮겼습니다.
- source_word: erit ergo
  english_pob_choice: shall be saved
  chosen_korean: 구원받을 것입니다
  alternatives_korean:
  - 살 것입니다
  - 구원될 것입니다
  lexicon: shall be saved
  rationale: 영어 POB의 보정된 결말을 따라, 라틴 전승의 결손이 드러내는 의미를 한국어에서도 ‘구원받다’로 분명히 했습니다.
theological_decisions:
- issue: 라틴 본문 결손과 다른 전승의 보정 의미 반영
  chosen_reading: 본문이 끊겨 있지만, 결과 의미는 ‘구원받을 것입니다’로 제시했습니다.
  alternative_readings:
  - 문장을 중단 표시로 남기는 방식
  - ‘살 것입니다’로 보다 직역하는 방식
  rationale: 영어 POB가 시리아어·에티오피아어·아랍어 전승을 따라 결말 동사를 복원한 점을 반영해, 한국어도 완결된 구원 진술로 제시하는 것이 독자 이해에 더 충실합니다.
  doctrine_reference: 전승 비평과 본문 복원에 관한 번역 원칙
