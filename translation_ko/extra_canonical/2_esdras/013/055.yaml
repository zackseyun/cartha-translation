  text: For you have ordered your life in wisdom, and have called understanding your mother.
translation:
  language: ko
  text: 당신은 당신의 삶을 지혜롭게 정돈하셨고, 분별을 어머니라 부르셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vitam ... disposuisti
  english_pob_choice: you have ordered your life
  chosen_korean: 삶을 바로 세우셨고
  alternatives_korean:
  - 삶을 정리하셨고
  - 삶을 질서 있게 하셨고
  - 삶을 규정하셨고
  lexicon: disponere
  rationale: disposuisti는 단순히 ‘명령하다’보다 삶의 방향과 질서를 정돈해 세우는 뜻이 강하므로, 현대 한국어에서 자연스럽고 의미를 살리는 ‘바로 세우다’로 옮겼습니다.
- source_word: in sapientiam
  english_pob_choice: in wisdom
  chosen_korean: 지혜로
  alternatives_korean:
  - 지혜 안에서
  - 지혜 속에
  - 지혜에 따라
  lexicon: sapientia
  rationale: 전치사 in은 여기서 수단·방식의 의미로 읽는 것이 자연스러워, 한국어에서는 간결하게 ‘지혜로’라고 표현했습니다.
- source_word: sensum
  english_pob_choice: understanding
  chosen_korean: 깨달음
  alternatives_korean:
  - 이해
  - 분별
  - 총명
  lexicon: sensus
  rationale: sensus는 단순한 지적 이해보다 내면의 분별과 통찰을 포함하므로, 본문의 비유적 호칭을 살리기 위해 ‘깨달음’으로 옮겼습니다.
- source_word: matrem
  english_pob_choice: mother
  chosen_korean: 어머니라고 부르셨습니다
  alternatives_korean:
  - 어머니라고 하셨습니다
  - 어머니로 삼으셨습니다
  - 어머니라 일컬으셨습니다
  lexicon: mater
  rationale: vocasti는 명명/호칭의 의미이므로, ‘부르셨습니다’로 옮겨 원문의 비유적 칭호를 유지했습니다.
theological_decisions:
- issue: 지혜와 깨달음의 의인화 표현
  chosen_reading: ‘깨달음’을 ‘어머니’라고 부르는 비유를 그대로 살렸습니다.
  alternative_readings:
  - ‘이해’를 어머니라고 번역해 더 설명적으로 처리
  - 의인화를 완화해 ‘깨달음을 소중히 여기셨습니다’로 의역
  rationale: 본문은 지혜와 깨달음을 단순한 덕목이 아니라 관계적·비유적 언어로 말하므로, 그 수사적 긴장을 보존하는 것이 중요합니다.
  doctrine_reference: 지혜문학의 의인화와 수사적 비유
