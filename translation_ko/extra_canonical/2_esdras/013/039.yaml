lexical_decisions:
- source_word: colligentem ad se
  english_pob_choice: gathering to himself
  chosen_korean: 자기에게 … 모으는
  alternatives_korean:
  - 자기에게 … 불러 모으는
  - 자기에게 … 집결시키는
  lexicon: colligo + ad se
  rationale: 라틴어의 ‘자기에게로 모으다’라는 방향성을 살려, 단순히 모으는 것보다 목적지향성을 드러내는 표현을 택했습니다.
- source_word: aliam multitudinem
