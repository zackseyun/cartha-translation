lexical_decisions:
- source_word: colligentem ad se
  english_pob_choice: gathering to himself
  chosen_korean: 자기에게 … 모으는
  alternatives_korean:
  - 자기에게 … 불러 모으는
  - 자기에게 … 집결시키는
  lexicon: colligo + ad se
  rationale: 라틴어의 ‘자기에게로 모으다’라는 방향성을 살려, 단순히 모으는 것보다 목적지향성을 드러내는 표현을 택했습니다.
- source_word: aliam multitudinem
  english_pob_choice: another multitude
  chosen_korean: 다른 무리
  alternatives_korean:
  - 또 다른 군중
  - 다른 큰 무리
  lexicon: multitudo
  rationale: multitudo는 단순한 ‘군중’보다 공동체적 집합을 가리킬 수 있어, 문맥에 맞게 중립적인 ‘무리’로 옮겼습니다.
- source_word: pacificam
  english_pob_choice: peaceful
  chosen_korean: 평화로운
  alternatives_korean:
  - 평온한
  - 화평한
  lexicon: pacificus
  rationale: 형용사의 기본 의미를 직접 반영하되, ‘평화로운’이 현대 한국어에서 가장 자연스럽고 덜 해석적인 대응입니다.
- source_word: Haec sunt decem tribus
  english_pob_choice: these are the ten tribes
  chosen_korean: 이것은 포로로 잡혀 간 열두 지파입니다
  alternatives_korean:
  - 이것들은 포로로 잡혀 간 열 지파입니다
  - 이들은 사로잡혀 간 열 지파입니다
  lexicon: decem tribus / contextual continuation
  rationale: 제공된 라틴어 본문은 절 경계상 여기서 마무리되지만, 본문 자체의 ‘이것은 … 지파들’ 진술을 한국어로 살리되, 공시된 본문 경계에 맞춰 후속 구를 다음 절로 넘기지 않도록 처리했습니다.
theological_decisions:
- issue: the referent of the gathered multitude and tribal identity
  chosen_reading: ‘다른 평화로운 무리’는 포로로 잡혀 간 지파들의 집합을 가리키는 서술로 유지했습니다.
  alternative_readings:
  - 단순한 종교적 군중
  - 이스라엘 전체의 상징적 재집합
  rationale: 라틴어와 영어 POB 모두 이 장면을 직설적으로 연결하므로, 상징화를 과도하게 확장하지 않고 본문이 말하는 동일시를 따라갔습니다.
  doctrine_reference: 본문 주해 차원의 식별 문제
