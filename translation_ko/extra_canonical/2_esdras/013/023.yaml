  source_fidelity: 라틴어의 주절은 미래형 단수 동사(custodibit)로, ‘위험을 가져오는 이’가 친히 보호한다는 뜻입니다. 현 번역의 ‘지키며’는 미래의 주절을 연결형으로 바꾸어 문장 구조와 시제를 충분히 반영하지 못합니다. Fortissimum의 최상급 신적 칭호는 ‘지극히 강하신 분’으로 적절히 보존되었습니다.
  naturalness: ‘그때에 위험을 가져오는 그 자신이’는 한국어에서 주어 구성이 다소 부자연스럽고, 뒤의 ‘지키며’와 ‘지키실 것입니다’가 한 문장 안에서 중복·불균형을 이룹니다. 관계절을 ‘위험을 가져올 이가 친히’로 정리하고 미래 종결을 하나로 두면 현대 표준어 합쇼체로 자연스럽습니다.
  terminology: ‘지극히 강하신 분’은 Fortissimum의 최상급과 신적 호칭성을 잘 살립니다. opera는 이 문맥에서 윤리적 실천을 가리키므로 ‘일’보다 ‘행위’가 더 정확합니다. fidem은 ‘믿음’으로 유지할 수 있습니다.
