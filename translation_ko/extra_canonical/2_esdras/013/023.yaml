translation:
  language: ko
  text: 그때에 위험을 가져올 이가 친히, 위험에 빠진 이들, 곧 지극히 강하신 분께 행위와 믿음을 지닌 이들을 지키실 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘강하신 분’.
    reason: Fortissimum의 최상급을 본문에서 ‘지극히 강하신 분’으로 옮겼으며, 이전의 비최상급 번역 가능성을 제시합니다.
lexical_decisions:
- source_word: adferet periculum
  english_pob_choice: brings the danger
  chosen_korean: 위험을 가져오는
  alternatives_korean:
  - 위험을 가져오는
  - 위기를 불러오는
  - 재앙을 가져오는
  lexicon: adfero / periculum
  rationale: 라틴어의 직역성을 살리되, 사건을 초래하는 행위라는 점을 자연스럽게 표현하기 위해 ‘위험을 가져오는’으로 옮겼습니다.
- source_word: ipse custodibit
  english_pob_choice: will himself protect
  chosen_korean: 그 자신이 … 지키며
  alternatives_korean:
  - 그가 친히 … 지키며
  - 그 자신이 … 보호하며
  - 그가 스스로 … 지키며
  lexicon: ipse / custodire
  rationale: ipse의 강조를 ‘그 자신이’로 살리고, custodibit는 단순한 보호보다 보존·지킴의 뜻이 있어 ‘지키다’로 옮겼습니다.
- source_word: Fortissimum
  english_pob_choice: the Most Mighty
  chosen_korean: 지극히 강하신 분
  alternatives_korean:
  - 가장 강하신 분
  - 최고로 강하신 분
  - 지극히 용맹하신 분
  lexicon: fortissimus
  rationale: review에서 지적된 superlative 힘을 반영해 ‘Most Mighty’의 상위급을 살리면서, 신격 호칭으로 자연스러운 ‘지극히 강하신 분’으로 번역했습니다.
- source_word: qui habent operas et fidem
  english_pob_choice: those who have works and faith
  chosen_korean: 일과 믿음을 가진 이들
  alternatives_korean:
  - 행위와 믿음을 가진 이들
  - 일과 믿음을 지닌 이들
  - 업적과 믿음을 가진 이들
  lexicon: opera / fides
  rationale: opera는 문맥상 단순 ‘행위’보다 ‘일/노력’의 넓은 의미가 있어 ‘일’로, fides는 기본 의미인 ‘믿음’으로 유지했습니다.
theological_decisions:
- issue: Fortissimum의 신적 호칭성
  chosen_reading: 지극히 강하신 분
  alternative_readings:
  - 강하신 분
  - 가장 강한 분
  rationale: 본문의 superlative가 단순 성질 묘사가 아니라 신적 칭호로 기능하므로, 위계성을 드러내는 표현을 선택했습니다.
  doctrine_reference: divine title / superlative force
- issue: 행위와 믿음의 병렬
  chosen_reading: 일과 믿음을 가진 이들
  alternative_readings:
  - 행위와 믿음을 가진 이들
  - 일과 신앙을 가진 이들
  rationale: 라틴어의 operas et fidem은 윤리적 열매와 신뢰를 함께 가리키므로, 두 요소의 병렬을 유지했습니다.
  doctrine_reference: works and faith pairing
