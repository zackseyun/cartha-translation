    rationale: ‘그날이 이르기 전에는’은 문자상 그날 이전의 기간만을 말하여, 라틴어 nisi in tempore diei(‘그날의 때가 아니면/그때를 제외하고는’)의 예외 구문을 정확히 재현하지 못합니다.
  - severity: low
