id: 2ES.13.52
reference: 2 Esdras 13:52
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sicut non potest hoc vel scrutinare vel scire quis, quid sit in profundo maris, sic non poterit quisquam super terram videre Filium meum vel eos qui cum eo sunt nisi in tempore diei.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/052.yaml
  text: And he said to me, “Just as no one can search out or know what is in the depths of the sea, so no one on earth can see my Son, or those who are with him, except at the time of that day.”
translation:
  language: ko
  text: 그리고 그가 내게 말했습니다. 「아무도 바다 깊은 곳에 무엇이 있는지 찾아내거나 알 수 없는 것처럼, 땅 위에 있는 아무도 그날의 때가 아니면 내 아들이나 그와 함께 있는 이들을 볼 수 없습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut non potest hoc vel scrutinare vel scire quis
  english_pob_choice: Just as no one can search out or know
  chosen_korean: 마치 아무도 … 찾아내거나 알 수 없는 것과 같이
  alternatives_korean:
  - 아무도 … 살피거나 알 수 없는 것과 같이
  - 아무도 … 탐지하거나 알 수 없는 것과 같이
  lexicon: scrutinare, scire
  rationale: scrutinare의 ‘철저히 찾아내다’와 scire의 ‘알다’를 함께 살려, 단순한 ‘보다’보다 더 강한 인지 불가능성을 한국어로 드러냈습니다.
- source_word: in profundo maris
  english_pob_choice: in the depths of the sea
  chosen_korean: 바다 깊은 곳에
  alternatives_korean:
  - 바다의 깊은 심연에
  - 바다 깊은 심연 속에
  lexicon: profundum maris
  rationale: 라틴어의 ‘깊은 곳/심연’ 이미지를 유지하되, 현대 한국어에서 자연스럽고 과장되지 않은 표현으로 옮겼습니다.
- source_word: Filium meum
  english_pob_choice: my Son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 아들 메시아
  - 내 아들
  lexicon: Filium meum
  rationale: 라틴어 직역을 따라 ‘내 아들’로 옮겼고, 본문 자체에는 메시아 호칭이 없으므로 덧붙이지 않았습니다.
- source_word: nisi in tempore diei
  english_pob_choice: except at the time of that day
  chosen_korean: 그날이 이르기 전에는
  alternatives_korean:
  - 그날이 올 때를 제외하고는
  - 그날의 때가 아니면
  lexicon: in tempore diei
  rationale: 영어 POB의 'that day'에 맞추되, 라틴어의 ‘그날의 때’라는 뜻을 한국어에서 더 자연스럽고 명확하게 풀어 ‘그날이 이르기 전에는’으로 표현했습니다.
theological_decisions:
- issue: ‘그날’(diei)의 종말론적 시점 표현
  chosen_reading: 특정한 정해진 때를 가리키는 종말론적 ‘그날’로 옮겼습니다.
  alternative_readings:
  - ‘그날’ 대신 ‘그 날’로 띄어 쓰기
  - ‘그 날의 때’로 직역하기
  rationale: 영어 POB가 'that day'로 정리한 의미를 따르되, 문맥상 마지막 때를 가리키는 종말론적 표지로 이해되므로 한국어에서도 그 긴장감을 유지했습니다.
  doctrine_reference: 2 Esdras의 종말론적 계시 문맥
