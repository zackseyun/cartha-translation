  text: et vidi, et ecce convolabat ipse homo cum nubibus caeli. et ubi vultum suum convertebat ut consideraret, tremebant omnia quae sub eo videbantur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/003.yaml
  text: And I looked[a], and behold, that man was flying with the clouds of heaven; and wherever he turned his face to look, everything seen beneath him trembled.
  footnotes:
  - marker: a
    text: Or 'seen beneath him'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니, 보십시오, 그 사람이 하늘의 구름들과 함께 날고 있었습니다. 그가 살펴보려고 얼굴을 돌리는 곳마다, 그 아래에 보이는 모든 것이 떨었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 아래에 보이던 모든 것’입니다. 라틴어 sub eo는 여기서 그 사람 아래의 위치를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: convolabat ipse homo cum nubibus caeli
  english_pob_choice: that man was flying with the clouds of heaven
  chosen_korean: 그 사람은 하늘의 구름들과 함께 날고 있었습니다
  alternatives_korean:
  - 그 사람은 하늘의 구름과 함께 날고 있었습니다
  - 그 사람이 하늘 구름을 타고 날고 있었습니다
  lexicon: convolabat / nubibus caeli
  rationale: convolabat는 단순한 이동이 아니라 ‘날고 있었다’는 진행형 동작을 나타내고, cum nubibus caeli는 구름을 ‘타다’보다 구름과 함께 이동하는 장면을 더 सीधे하게 드러내므로 ‘구름들과 함께’로 옮겼습니다.
- source_word: ubi vultum suum convertebat ut consideraret
  english_pob_choice: wherever he turned his face to look
  chosen_korean: 그가 바라보려고 얼굴을 돌리는 곳마다
  alternatives_korean:
  - 그가 보려고 얼굴을 돌리는 곳마다
  - 그가 살펴보려고 얼굴을 돌리는 곳마다
  lexicon: vultum suum convertebat ut consideraret
  rationale: vultum suum은 단순히 시선을 돌리는 것이 아니라 얼굴을 돌리는 구체적 동작을 말하고, ut consideraret는 ‘주의 깊게 보다/살펴보다’의 목적을 나타내므로 ‘바라보려고’로 자연스럽게 풀었습니다.
- source_word: tremebant omnia quae sub eo videbantur
  english_pob_choice: everything seen beneath him trembled
  chosen_korean: 그 아래에서 보이는 모든 것이 떨었습니다
  alternatives_korean:
  - 그 아래에 보이는 모든 것이 떨었습니다
  - 그가 보는 아래의 모든 것이 떨었습니다
  lexicon: sub eo videbantur
  rationale: 최종 영어 수정의 이력상 라틴어 sub eo를 살려 ‘그 아래에서 보이는’으로 옮기되, 주어를 능동적으로 만들지 않고 수동적 표상을 유지해 ‘보이는 모든 것’이 떨리는 장면을 살렸습니다.
theological_decisions:
- issue: 인물이 구름과 함께 날아오는 묘사의 종말론적 위엄
  chosen_reading: 본문은 인물의 초월적 이동과 그 시선 아래의 만물의 떨림을 직설적으로 묘사합니다.
  alternative_readings:
  - 상징적으로만 완화해 ‘구름을 타고’로 순화하는 읽기
  - 기적적 장면을 과장이라 보고 완곡하게 처리하는 읽기
  rationale: 라틴 본문과 영어 POB의 서술은 환상을 약화시키지 않고, 인물의 위엄과 만물의 떨림을 그대로 전달하는 데 초점이 있습니다.
  doctrine_reference: 묵시문학의 환상 서술은 문자적 일상 묘사가 아니라 계시적 장면으로 읽어야 합니다.
