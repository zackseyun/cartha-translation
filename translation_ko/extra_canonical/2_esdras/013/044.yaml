  yaml_path: translation/extra_canonical/2_esdras/013/044.yaml
  text: For then the Most High performed signs, and held back the channels of the river until they had crossed.
translation:
  language: ko
  text: 그때 지극히 높으신 분은 표적들을 행하시고, 그들이 건너갈 때까지 강의 물길을 막아 두셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 signa는 문맥상 ‘표적들’ 또는 ‘기적들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: default divine epithet
  rationale: 라틴어 최상급 호칭을 신격 호칭으로 자연스럽게 옮기되, 본문에 없는 ‘하나님’을 덧붙이지 않고 존칭형 표현으로 유지했습니다.
- source_word: signa
  english_pob_choice: performed signs
  chosen_korean: 표적들을 행하시고
  alternatives_korean:
  - 기적들을 행하시고
  - 징표들을 보이시고
  lexicon: source-calque / biblical usage
  rationale: signa의 표적·기적 의미를 살리면서, 행위 동사를 붙여 라틴어의 능동적 서술을 반영했습니다.
- source_word: statuit uenas fluminis
  english_pob_choice: held back the channels of the river
  chosen_korean: 강의 물길을 막아 두셨습니다
  alternatives_korean:
  - 강의 줄기를 멈추게 하셨습니다
  - 강물의 통로를 멈추어 두셨습니다
  lexicon: river-channel imagery
  rationale: uenae fluminis를 단순한 ‘강’이 아니라 물길/수로로 풀어, 물의 흐름을 가로막는 이미지를 분명히 했습니다.
theological_decisions:
- issue: 지극히 높으신 분의 행위 묘사
  chosen_reading: 초월적 구원의 행위로서 표적과 물길의 제지를 그대로 직설적으로 옮겼습니다.
  alternative_readings:
  - 완곡하게 ‘도우셨습니다’로 약화하는 번역
  - 설명적으로 ‘홍해를 가르셨습니다’로 특정화하는 번역
  rationale: 라틴어는 추상적 표현보다 하나님의 주권적 능력을 직접 말하므로, 본문이 말하는 초자연적 개입을 약화하거나 과도하게 특정하지 않았습니다.
  doctrine_reference: 하나님의 주권과 구원 역사
