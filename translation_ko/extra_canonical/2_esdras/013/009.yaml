id: 2ES.13.9
reference: 2 Esdras 13:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pugnare. Et ecce ut uidit impetum multitudinis uenientis, non leuauit manum suam, neque frameam tenebat, neque
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/009.yaml
  text: And behold, when he saw the assault of the coming multitude, he did not lift his hand, nor did he hold a spear, nor any weapon of war;
translation:
  language: ko
  text: 보십시오, 그는 다가오는 무리의 돌격을 보았지만 손을 들지 않았고, 창도 붙잡지 않았으며, 어떤 전쟁 무기도 들지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''돌격''은 라틴어 impetum의 기세 있는 공격·돌진을 살리기 위한 번역입니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Et ecce
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: ecce
  rationale: 청자에게 장면을 주목시키는 감탄사를 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: impetum
  english_pob_choice: assault
  chosen_korean: 돌격
  alternatives_korean:
  - 공격
  - 습격
  lexicon: impetus
  rationale: 단순한 '공격'보다 밀려드는 군중의 물리적 돌진을 더 분명하게 살리는 표현으로 옮겼습니다.
- source_word: multitudinis uenientis
  english_pob_choice: the coming multitude
  chosen_korean: 다가오는 무리
  alternatives_korean:
  - 오는 무리
  - 밀려오는 무리
  lexicon: multitudo + uenientis
  rationale: 개정된 영어 순서를 따라 '다가오는'을 무리 앞에 두어 라틴어의 수식 관계를 반영했습니다.
- source_word: frameam
  english_pob_choice: a spear
  chosen_korean: 창
  alternatives_korean:
  - 창끝 무기
  - 창날
  lexicon: framea
  rationale: 특정 고대 무기를 한국어 일반명사 '창'으로 옮기되, 문맥상 무기 전체를 가리키는 뒤의 절과 함께 읽히도록 했습니다.
theological_decisions:
- issue: 무기를 들지 않은 행동의 강조
  chosen_reading: 그는 손을 들지 않았고, 창도 붙잡지 않았으며, 어떤 전쟁 무기도 들지 않았습니다.
  alternative_readings:
  - 그는 싸우지 않았고
  - 그는 무력하게 서 있었습니다
  rationale: 본문은 전투 의지의 부재를 행동 묘사로 제시하므로, 해석을 덧붙이지 않고 동작 부정을 그대로 살렸습니다.
  doctrine_reference: 서사 본문에서는 신학적 함의를 과도하게 확대하지 않고 서술 기능을 우선합니다.
