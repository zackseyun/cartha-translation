base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/053.yaml
  text: This is the interpretation of the dream that you saw[53], and why you alone have been enlightened concerning these things.
  footnotes:
  - marker: '53'
    text: '''At the time of his day'' is a close rendering of a compressed Latin phrase. The sense is an appointed time of revelation, not ordinary visibility before then.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이것은 네가 본 꿈의 해석이며, 네가 이 일들에 관하여 너만이 깨우침을 받은 까닭입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: haec est interpretatio
  english_pob_choice: This is the interpretation
  chosen_korean: 이것은 … 해석이며
  alternatives_korean:
  - 이것은 … 풀이입니다
  - 이것은 … 설명입니다
  lexicon: interpretatio
  rationale: 라틴어 interpretatio의 기본 의미를 살리되, 문맥상 꿈의 뜻을 풀어 주는 말이므로 ‘해석’이 가장 직접적입니다.
- source_word: somnii quem vidisti
  english_pob_choice: the dream that you saw
  chosen_korean: 네가 본 꿈
  alternatives_korean:
  - 네가 보았던 꿈
  - 네가 보신 꿈
  lexicon: somnium
  rationale: vidisti는 단순 과거의 ‘보았다’이므로 현대 한국어로 자연스럽게 ‘본’으로 옮겼습니다.
- source_word: propter quod ... es haec solus
  english_pob_choice: why you alone have been enlightened concerning these things
  chosen_korean: 너만이 이 일들에 관해 깨달음을 얻은 까닭입니다
  alternatives_korean:
  - 너만이 이 일들에 대해 밝히심을 받은 까닭입니다
  - 너만이 이 일들에 대하여 깨우침을 받은 까닭입니다
  lexicon: inluminatus es
  rationale: inluminatus es는 단순히 ‘밝아졌다’보다 계시를 받아 이해하게 되었다는 뜻이 강하므로, 수동적 체험을 살린 ‘깨달음을 얻다’로 옮겼습니다.
theological_decisions:
- issue: 계시로 인한 ‘깨달음’의 의미
  chosen_reading: ‘너만이 … 깨달음을 얻은’으로 옮겨, 특별한 계시를 받은 상태를 드러냈습니다.
  alternative_readings:
  - ‘너만이 … 밝히심을 받은’으로 더 직역할 수 있습니다
  - ‘너만이 … 이해하게 된’으로 완화할 수 있습니다
  rationale: 문맥상 단순 지적 이해가 아니라 하늘로부터 주어진 계시를 가리키므로, 한국어에서 그 차이를 드러내는 표현이 필요합니다.
  doctrine_reference: revelation
