translation:
  language: ko
  text: 내가 말했습니다. 「주인님, 이 일을 내게 보여 주십시오. 내가 바다의 중심에서 올라오는 그 사람을 왜 보았습니까?」 그가 내게 말했습니다:[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 라틴어의 `Dominator Domine`는 직역하면 ‘주인, 주님’에 가깝지만, 한국어에서는 묵시문학적 경외를 살리기 위해 이중 호칭을 하나의 높임 호칭으로 처리했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Dominator Domine
  english_pob_choice: Lord Master
  chosen_korean: 주인님
  alternatives_korean:
  - 주님
  - 주인이신 주님
  - 주여, 주님
  lexicon: Dominator / κύριος vocative
  rationale: Latin의 이중 호격은 단순한 ‘주님’보다 위계와 경외가 드러나는 직접 호칭이어서, 한국어에서는 앞의 직함을 살린 ‘주인님’으로 옮기고 뒤의 호격은 문맥 전체의 높임으로 처리했습니다.
- source_word: hoc mihi ostende
  english_pob_choice: show me this
  chosen_korean: 이 일을 내게 보여 주십시오
  alternatives_korean:
  - 이것을 내게 보여 주십시오
  - 이것을 내게 나타내 주십시오
  lexicon: ostendere
  rationale: 직역적 ‘이것’도 가능하지만, 여기서는 다음 절의 이유를 묻는 청원의 도입이므로 한국어에서 자연스러운 지시 표현인 ‘이 일’이 원문의 지시성을 잘 살립니다.
- source_word: de corde maris
  english_pob_choice: from the heart of the sea
  chosen_korean: 바다의 중심에서
  alternatives_korean:
  - 바다의 한가운데에서
  - 바다의 중심부에서
  - 바다의 심장에서
  lexicon: cor / heart
  rationale: 라틴어 cor의 비유적 공간 표현을 유지하되, 한국어에서 ‘심장’보다 ‘중심’이 더 자연스럽고 원문의 상징성을 과도하게 바꾸지 않습니다.
theological_decisions:
- issue: 이중 호격의 번역 톤
  chosen_reading: ‘Dominator Domine’를 경외가 있는 직접 호칭으로 살려 ‘주인님’으로 번역했습니다.
  alternative_readings:
  - ‘주님’으로 단순화
  - ‘주인이신 주님’으로 풀어쓰기
  rationale: 묵시문학적 대화체의 긴장을 유지해야 하므로, 단순한 예배적 호칭보다 상하관계가 분명한 호칭이 더 적합합니다.
  doctrine_reference: apocalyptic address / vocative register
- issue: 마지막 절의 미완결 연결
  chosen_reading: ‘그가 내게 말했습니다:’를 본문에 유지했습니다.
  alternative_readings:
  - 다음 절로 넘겨 번역
  - 문장을 끝맺음
  rationale: 라틴어 본문에 분명히 있는 `et dixit mihi:`를 절 수준에서 보존해야 하므로, 다음 절로 이월하지 않고 열린 종결로 남겼습니다.
  doctrine_reference: source alignment / verse segmentation
