lexical_decisions:
- source_word: quoniam
  english_pob_choice: because
  chosen_korean: -기 때문입니다
  alternatives_korean:
  - -하므로
  - -때문입니다
  lexicon: quoniam
  rationale: 원인은 다음 절 전체를 받는 인과 접속사이므로, 현대 한국어에서 가장 자연스러운 종결형 인과 표현으로 옮겼습니다.
- source_word: ut spiritum
  english_pob_choice: breath
  chosen_korean: 영
  alternatives_korean:
  - 숨결
  - 호흡
  - 영
  lexicon: ut + spiritum
  rationale: 청각적·생명력 있는 ‘숨/바람’의 이미지를 살리되, 본문이 환상적 비유를 제시하므로 ‘영과 불과 폭풍 같은 것’으로 처리하여 비교 표지를 반영했습니다.
- source_word: tempestatem
  english_pob_choice: storm
  chosen_korean: 폭풍
  alternatives_korean:
  - 광풍
  - 폭풍우
  lexicon: tempestas
  rationale: 라틴어의 폭력적이고 격렬한 자연현상을 그대로 드러내는 일반적 대응으로 ‘폭풍’을 택했습니다.
- source_word: de ore eius exire
  english_pob_choice: coming out from his mouth
  chosen_korean: 그의 입에서 나오는 것
  alternatives_korean:
  - 그의 입에서 나오는
  - 그의 입에서 나가고 있는
  lexicon: exire de ore
  rationale: 동작의 출처를 분명히 하면서도 한국어 어순에서 자연스럽게 읽히도록 ‘입에서 나오는 것’으로 정리했습니다.
theological_decisions:
- issue: ut의 비교적 환상성
  chosen_reading: ‘영과 불과 폭풍 같은 것’으로, 실제 동일체 선언이 아니라 보이는 모습의 유사성을 드러냈습니다.
  alternative_readings:
  - ‘영과 불과 폭풍’으로 직역
  - ‘마치 영과 불과 폭풍처럼’
  rationale: 개정판 영어 주석이 지적하듯 ut는 단순 병렬이 아니라 ‘~같은’ 비교를 도입하므로, 종말론적 환상 장면의 비유성을 보존했습니다.
  doctrine_reference: 본문 해석상 비교 표지 보존
