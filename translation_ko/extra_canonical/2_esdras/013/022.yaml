  yaml_path: translation/extra_canonical/2_esdras/013/022.yaml
  text: 'For you said about those who are left, and about those who are not left, this is the interpretation:'
translation:
  language: ko
  text: '당신이 남아 있는 자들과 남아 있지 않은 자들에 대하여 말했으므로, 이것이 해석입니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quoniam dixisti
  english_pob_choice: For you said
  chosen_korean: 당신이 … 말했으므로
  alternatives_korean:
  - 당신이 … 말했기 때문에
  - 당신이 … 말했다고 해서
  lexicon: quoniam; dixisti
  rationale: 라틴어 quoniam의 원인/근거 의미를 살리되, POB가 채택한 직접적인 ‘For you said’의 흐름에 맞춰 문두의 전제를 한국어 인과절로 자연스럽게 옮겼습니다.
- source_word: de his qui derelicti sunt
  english_pob_choice: about those who are left
  chosen_korean: 남아 있는 자들에 대하여
  alternatives_korean:
  - 남겨진 자들에 대하여
  - 남아 있는 사람들에 대하여
  lexicon: de; derelicti sunt
  rationale: derelicti sunt를 수동적으로 ‘남겨진’으로도 옮길 수 있지만, 본문 대비를 살리기 위해 결과적으로 남아 있게 된 상태를 드러내는 ‘남아 있는 자들’로 간결하게 옮겼습니다.
- source_word: de his qui non derelicti sunt
  english_pob_choice: about those who are not left
  chosen_korean: 남아 있지 않은 자들에 대하여
  alternatives_korean:
  - 남겨지지 않은 자들에 대하여
  - 남지 않은 자들에 대하여
  lexicon: non derelicti sunt
  rationale: 앞 구와 대조되는 구조를 보존하기 위해 동일한 표현틀을 유지했고, ‘남아 있지 않은’으로 부정 대비를 분명히 했습니다.
- source_word: haec interpretatio
  english_pob_choice: this is the interpretation
  chosen_korean: 이것이 해석입니다
  alternatives_korean:
  - 이것이 뜻입니다
  - 이것이 풀이입니다
  lexicon: haec interpretatio
  rationale: interpretatio를 단순 설명보다 ‘해석’으로 옮겨, 뒤이어 나올 환시/상징 풀이의 선언성을 살렸습니다.
