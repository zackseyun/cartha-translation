  text: the Most High will begin to deliver those who are upon the earth.
translation:
  language: ko
  text: 지극히 높으신 분께서 땅 위에 있는 이들을 구원하기 시작하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: Latin altissimus
  rationale: 신적 칭호의 위엄을 살리되, 본문이 단순한 호칭이므로 ‘하나님’을 덧붙여 의미를 좁히지 않고 중립적 존칭형으로 옮겼습니다.
- source_word: incipiet
  english_pob_choice: will begin to deliver
  chosen_korean: 구원하기 시작하실 것입니다
  alternatives_korean:
  - 구원하기 시작하실 것입니다
  - 구원하시기 시작하실 것입니다
  - 구출하기 시작하실 것입니다
  lexicon: Latin incipio
  rationale: 동작의 시작을 분명히 드러내기 위해 ‘시작하실 것입니다’를 유지했고, deliver의 구원적 뉘앙스를 살려 ‘구원하다’로 옮겼습니다.
- source_word: liberare
  english_pob_choice: to deliver
  chosen_korean: 구원하다
  alternatives_korean:
  - 해방하다
  - 건져내다
  - 구출하다
  lexicon: Latin libero
  rationale: 문맥상 단순한 물리적 구출보다 종말론적 해방/구원의 의미가 강하므로, 한국어 성경 문체에서 가장 자연스러운 ‘구원하다’를 택했습니다.
- source_word: qui super terram sunt
  english_pob_choice: those who are upon the earth
  chosen_korean: 땅 위에 있는 이들
  alternatives_korean:
  - 땅 위에 있는 사람들
  - 땅에 사는 사람들
  - 세상에 있는 이들
  lexicon: Latin super terram
  rationale: 직역에 가깝게 ‘땅 위에 있는’ 구조를 살려 원문의 공간적 범위를 보존했고, ‘이들’로 문어체의 유연함을 확보했습니다.
theological_decisions:
- issue: ‘Most High’의 신적 호칭을 어떻게 표기할지
  chosen_reading: 지극히 높으신 분
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 이
  rationale: 이 구절은 본문 자체가 신적 칭호를 사용하지만, 한국어 본문에서 과도하게 해석을 고정하지 않도록 존칭형으로 유지했습니다.
  doctrine_reference: 신적 칭호의 보존과 과잉명시 방지
