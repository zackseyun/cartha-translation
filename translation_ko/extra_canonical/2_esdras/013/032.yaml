  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et gens ad gentem et regnum aduersus regnum. Et erit cum fient haec, et contingent signa quae ante ostendi tibi, et tunc
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/013/032.yaml
  text: nation against nation[a], and kingdom against kingdom. And it shall be, when these things happen, and the signs occur that I showed you before, then
  footnotes:
  - marker: a
    text: Or 'people against people'.
    reason: previous_rendering
translation:
  language: ko
  text: 민족은 민족을, 나라[국가]는 나라를 대적할 것입니다.[a] 이런 일들이 일어나고, 내가 전에 여러분에게 보여 준 표징들이 나타날 때, 그때
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 gens ad gentem은 종말론적 관용구로서 ‘민족 대 민족’의 대립을 가리킬 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: gens ad gentem
  english_pob_choice: nation against nation
  chosen_korean: 민족은 민족을
  alternatives_korean:
  - 나라가 나라를
  - 백성이 백성을
  - 사람들이 서로
  lexicon: gens
  rationale: 라틴어 gens는 종말론적 관용구에서 특정 집단이나 nation-people을 가리키므로, POB의 개정된 ‘nation against nation’을 따라 ‘민족은 민족을’로 옮겨 구체적 집단 대립을 살렸습니다.
- source_word: regnum aduersus regnum
  english_pob_choice: kingdom against kingdom
  chosen_korean: 나라[국가]는 나라를 대적할 것입니다
  alternatives_korean:
  - 왕국은 왕국을 대적할 것입니다
  - 나라가 나라를 대적할 것입니다
  lexicon: regnum
  rationale: regnum은 문맥상 정치적 왕국/국가의 대립을 뜻하므로, 한국어에서는 자연스러운 ‘나라’로 옮기되, 의미 범위를 드러내기 위해 보조적으로 ‘국가’를 표시했습니다.
- source_word: contingent signa
  english_pob_choice: the signs occur
  chosen_korean: 표징들이 나타날 때
  alternatives_korean:
  - 징조들이 일어날 때
  - 표적들이 나타날 때
  lexicon: signum
  rationale: signa는 단순한 현상보다 계시적 ‘표징’을 뜻하므로, 문맥의 종말론적 징조를 살려 ‘표징’으로 번역했습니다.
- source_word: ante ostendi tibi
  english_pob_choice: I showed you before
  chosen_korean: 내가 전에 여러분에게 보여 준
  alternatives_korean:
  - 내가 전에 너에게 보여 준
  - 내가 미리 너에게 보인
  lexicon: ostendere
  rationale: 2인칭 단수 tibi를 살리되, 한국어는 예언적 خطاب에서 복수 정중 ‘여러분에게’로 옮겨 청자 집합을 자연스럽게 반영했습니다.
theological_decisions:
- issue: apocalyptic war idiom
  chosen_reading: 민족 대 민족, 나라 대 나라의 전면적 충돌로 읽었습니다.
  alternative_readings:
  - 단순한 일반 분쟁으로 약화해서 읽을 수 있습니다.
  - ‘사람 대 사람’처럼 개인 간 다툼으로 넓힐 수 있습니다.
  rationale: 라틴어는 종말론적 전쟁의 전형적 관용구를 사용하므로, 이를 약화하지 않고 집단적·우주적 격변의 표지로 유지했습니다.
  doctrine_reference: 종말론적 징조에 대한 본문 해석
- issue: second-person address
  chosen_reading: 예언적 담화의 청자 단수(tibi)를 한국어에서 복수 정중으로 처리했습니다.
  alternative_readings:
  - 직역해 ‘너에게’로 둘 수 있습니다.
  - 예언자의 개인적 청중으로 한정할 수 있습니다.
  rationale: 본문은 한 개인을 넘어 예언 계시의 수신자를 대표적으로 부르는 방식이어서, 현대 한국어 합쇼체에서 과도한 비개인화 없이 정중 복수로 자연화했습니다.
  doctrine_reference: 문학적 화자-청자 관계
