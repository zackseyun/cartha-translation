  rationale: 단수 tibi를 ‘너에게’로 보존하고, regnum을 ‘왕국’으로 통일하여 gens(민족)와의 의미상 구별 및 원문의 병렬을 살렸습니다. 본문에 삽입된 대괄호 해설은 제거했으며, 각주는 영어 POB 감사 이력의 대안 독법에 맞추었습니다. 마지막 ‘그때’는 원문이 다음 절로 계속되므로 그대로 유지했습니다.
