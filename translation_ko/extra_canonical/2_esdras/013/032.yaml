  - severity: medium
    issue: ‘나라[국가]’라는 대괄호 병기
    rationale: regnum은 이 문맥에서 ‘왕국’으로 옮기는 것이 정확하며, 대괄호 속 ‘국가’는 원문에 없는 해설적 대안을 본문에 삽입합니다. gens의 ‘민족’과도 구별되어야 합니다.
