review_pass:
  verdict: revise
  source_fidelity: 라틴어의 대구법(gens ad gentem et regnum adversus regnum)과 이어지는 미완의 시간절을 대체로 충실히 반영했습니다. 다만 단수 여격 tibi를 ‘여러분에게’로 복수화한 것은 본문의 직접 수신자를 바꾸며, regnum에 삽입한 대괄호 병기는 번역문에 없는 해석적 보충입니다.
  naturalness: ‘민족이 민족을, 왕국이 왕국을 대적할 것입니다’는 현대 한국어에서 자연스럽고 원문의 병렬을 잘 보존합니다. ‘그때’로 끝나는 것은 원문 자체가 다음 절로 이어지는 미완 문장이므로 유지할 수 있습니다.
  terminology: gens는 여기서 개인들의 일반적 ‘사람’보다 집단적 ‘민족’으로, regnum은 ‘왕국’으로 구별하는 것이 적절합니다. 계시·종말론 문맥의 signa는 ‘표징들’로 적절합니다.
  issues:
