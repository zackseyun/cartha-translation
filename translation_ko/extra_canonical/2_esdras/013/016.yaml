  source_fidelity: 라틴어 in sensu meo의 화자 개인의 인식·판단 표지, uae의 반복적 경고, derelicti/ non sunt derelicti의 대조, 그리고 multo plus의 강화가 모두 충실히 반영되었습니다. 특히 ‘남겨진 자들/남겨지지 않은 자들’은 원문의 다소 난해하고 역설적인 대조를 해설로 평탄화하지 않고 보존합니다. 첫 절의 미래 지향성도 ‘화가 있을 것입니다’로 자연스럽게 드러납니다.
  naturalness: ‘내 생각에는’과 ‘화가 있을 것입니다’는 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘남겨지지 않은 자들’은 일상어로는 다소 무겁지만, 원문의 수동태 대조와 예언적 문체에는 적절하며 부자연스러울 정도는 아닙니다.
  terminology: ‘화’는 라틴어 uae의 예언적 탄식·경고의 어조를 적절히 유지합니다. ‘남겨진 자들’은 derelicti를 특정 교리적 의미로 좁히지 않는 중립적 표현입니다.
