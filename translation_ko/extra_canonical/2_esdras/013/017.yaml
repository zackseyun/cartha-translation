  text: For those who are not left will be sorrowful,
translation:
  language: ko
  text: 남겨지지 않은 이들은 슬퍼하게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelicti
  english_pob_choice: are not left
  chosen_korean: 남겨지지 않은
  alternatives_korean:
  - 버려지지 않은
  - 남아 있지 않은
  lexicon: derelinquō
  rationale: 라틴어 derelicti는 ‘버려지다/남겨지다’ 계열의 수동 완료 분사이므로, 본문 뜻을 가장 직접적으로 살리는 ‘남겨지지 않은’을 택했습니다.
- source_word: tristes erunt
  english_pob_choice: will be sorrowful
  chosen_korean: 슬퍼하게 될 것입니다
  alternatives_korean:
  - 슬플 것입니다
  - 슬퍼할 것입니다
  lexicon: tristis
  rationale: tristes erunt는 상태 묘사이지만, 문맥상 장차 겪게 될 비탄을 드러내므로 한국어에서는 자연스러운 결과상 표현인 ‘슬퍼하게 될 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 문장의 주체를 일반적 집합으로 보느냐, 특정 남겨지지 않은 자들로 보느냐
  chosen_reading: ‘남겨지지 않은 이들’은 재난 이후 남아 있지 못한 사람들을 가리키는 서술로 읽었습니다.
  alternative_readings:
  - ‘버려지지 않은 자들’로 읽어 보호/유기 뉘앙스를 강화하는 해석
  - 단순 미래 진술로서 ‘남아 있지 않은 사람들은 슬퍼할 것이다’로 읽는 해석
  rationale: 라틴어 문법과 영어 POB의 audit trail이 모두 결과를 서술하는 평행 구조를 지지하므로, 과도한 신학적 해석을 덧붙이지 않고 문자적 의미를 유지했습니다.
  doctrine_reference: 문맥 주해
