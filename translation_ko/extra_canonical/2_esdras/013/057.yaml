  yaml_path: translation/extra_canonical/2_esdras/013/057.yaml
  text: And I departed and went into the field[a], greatly glorifying and praising the Most High for the wonders that he did in their times,
  footnotes:
  - marker: a
    text: Or 'Therefore I have shown you these things; for there is a reward with the Most High. For after three more days I will speak further with you and explain to you weighty and wondrous things.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 떠나 들판으로 갔습니다. 그리고 그분이 때를 따라 행하신 놀라운 일들로 인해 가장 높으신 분을 크게 찬양하고 찬미했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 너에게 이 일들을 보여 준 것은 지극히 높으신 분께 보상이 있기 때문입니다. 또 사흘이 지나면 내가 다시 너와 말하고 무거우며 놀라운 일들을 너에게 설명하겠습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: et profectus sum et transii in campum
  english_pob_choice: And I departed and went into the field
  chosen_korean: 나는 떠나 들판으로 갔습니다
  alternatives_korean:
  - 나는 나가 들판으로 갔습니다
  - 나는 떠나서 들판을 지나갔습니다
  lexicon: profectus sum; transii in campum
  rationale: 두 동사 모두 이동의 진행을 보여 주므로 ‘떠나…갔습니다’로 자연스럽게 옮기되, campum은 특정한 ‘들판’으로 직역했습니다.
- source_word: multum glorificans et laudans
  english_pob_choice: greatly glorifying and praising
  chosen_korean: 크게 찬양하고 찬미했습니다
  alternatives_korean:
  - 크게 영화롭게 하며 찬양했습니다
  - 많이 영화롭게 하며 칭송했습니다
  lexicon: glorificans; laudans
  rationale: glorificans와 laudans의 이중 표현을 살려, 하나님께 드리는 적극적 찬양을 한국어의 ‘찬양하고 찬미하다’로 중첩해 옮겼습니다.
- source_word: Altissimum
  english_pob_choice: the Most High
  chosen_korean: 가장 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 높으신 하나님
  lexicon: Altissimus
  rationale: 고유호칭을 살리면서도 한국어에서 직접적인 신칭으로 굳어지지 않도록 ‘가장 높으신 분’으로 번역했습니다.
- source_word: de mirabilibus, quae per tempus faciebat
  english_pob_choice: for the wonders that he did in their times
  chosen_korean: 때를 따라 행하신 놀라운 일들로 인해
  alternatives_korean:
  - 그들의 시대에 행하신 놀라운 일들로 인해
  - 때마다 행하신 놀라운 일들로 인해
  lexicon: mirabilibus; per tempus faciebat
  rationale: latest revision의 ‘in their times’를 반영해 반복적 ‘때마다’보다 ‘때를 따라’가 더 문맥상 안전하므로, 시간의 적절성과 사건들의 놀라움을 함께 살렸습니다.
theological_decisions:
- issue: 하나님 찬양의 이중 동사 표현
  chosen_reading: ‘크게 찬양하고 찬미했습니다’로 두 표현을 모두 살렸습니다.
  alternative_readings:
  - ‘크게 하나님을 영화롭게 하며 찬양했습니다’
  - ‘크게 찬송하고 찬양했습니다’
  rationale: 본문의 glorificans + laudans는 단순 반복이 아니라 찬양의 강도를 강조하므로, 한국어에서도 두 동사를 함께 써서 그 강조를 보존했습니다.
  doctrine_reference: Praise language in doxological narrative
