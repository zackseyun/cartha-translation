theological_decisions:
- issue: 장면의 범위
  chosen_reading: 이 절은 바다에서 일어난 바람과 그 결과만을 말하며, 다음 절의 ‘사람 같은 형상’은 포함하지 않습니다.
  alternative_readings:
  - 다음 절의 내용을 이 절에 함께 넣는 독해
  - 바람과 함께 인자가 나타나는 연결 독해
  rationale: 라틴 본문과 최신 판정은 이 절을 파도 일으키는 바람으로 한정하므로, 뒤 절의 결락 보완분을 여기로 끌어오지 않았습니다.
  doctrine_reference: source fidelity / textual criticism
