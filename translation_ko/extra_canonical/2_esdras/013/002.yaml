- source_word: et ecce
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: source interjection
  rationale: ecce의 놀람과 주목을 살리되, 현대 한국어에서 자연스러운 주의 환기로 옮겼습니다.
