  text: 보십시오, 바다에서 바람이 일어나 그 바다의 모든 파도를 뒤흔들었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et ecce
  english_pob_choice: And behold
  chosen_korean: 그리고 보십시오
  alternatives_korean:
  - 보십시오
  - 그리고 보라
  lexicon: source interjection
  rationale: ecce의 놀람과 주목을 살리되, 현대 한국어에서 자연스러운 주의 환기로 옮겼습니다.
- source_word: de mari
  english_pob_choice: from the sea
  chosen_korean: 바다에서
  alternatives_korean:
  - 바다로부터
  - 바다에서부터
  lexicon: source prepositional phrase
  rationale: de의 출발점을 간결하게 나타내면서도, 바다 자체에서 바람이 일어나는 장면을 자연스럽게 전달합니다.
- source_word: ventus exsurgebat
  english_pob_choice: a wind arose
  chosen_korean: 바람이 일어난
  alternatives_korean:
  - 바람이 솟아난
  - 바람이 일어선
  lexicon: source verbal phrase
  rationale: exsurgebat의 상승·돌출 감각을 살리되 한국어에서는 ‘일어나다’가 가장 직관적으로 해당 이미지를 전달합니다.
- source_word: ut conturbaret omnes fluctus eius
  english_pob_choice: to stir up all its waves
  chosen_korean: 그 바다의 모든 파도를 뒤흔들었습니다
  alternatives_korean:
  - 그 바다의 모든 물결을 뒤흔들었습니다
  - 그의 모든 파도를 소란하게 했습니다
  lexicon: source purpose/result clause
  rationale: conturbaret의 ‘흔들어 어지럽게 하다’는 뜻을 ‘뒤흔들다’로 옮겨 힘과 혼란을 함께 살렸습니다.
theological_decisions:
- issue: 장면의 범위
  chosen_reading: 이 절은 바다에서 일어난 바람과 그 결과만을 말하며, 다음 절의 ‘사람 같은 형상’은 포함하지 않습니다.
  alternative_readings:
  - 다음 절의 내용을 이 절에 함께 넣는 독해
  - 바람과 함께 인자가 나타나는 연결 독해
  rationale: 라틴 본문과 최신 판정은 이 절을 파도 일으키는 바람으로 한정하므로, 뒤 절의 결락 보완분을 여기로 끌어오지 않았습니다.
  doctrine_reference: source fidelity / textual criticism
