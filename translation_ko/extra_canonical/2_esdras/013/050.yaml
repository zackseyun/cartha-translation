  text: And then he will show them very many wonders.
translation:
  language: ko
  text: 그때 그분은 그들에게 매우 많은 놀라운 일들을 보여 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ostendet
  english_pob_choice: will show
  chosen_korean: 보여 주실 것입니다
  alternatives_korean:
  - 보일 것입니다
  - 드러내실 것입니다
  lexicon: ostendere
  rationale: 라틴어 ostendere의 기본 의미를 따라 ‘보여 주다’로 옮기되, 미래 시제와 존대에 맞게 ‘보여 주실 것입니다’로 자연스럽게 다듬었습니다.
- source_word: eis
  english_pob_choice: them
  chosen_korean: 그들에게
  alternatives_korean:
  - 그들 앞에
  - 그들에게만
  lexicon: is
  rationale: 대상 수혜자를 직접 나타내는 여격이므로 ‘그들에게’가 가장 직역적이고 문맥에 충실합니다.
- source_word: multa plurima portenta
  english_pob_choice: very many wonders
  chosen_korean: 매우 많은 놀라운 일들
  alternatives_korean:
  - 아주 많은 기이한 일들
  - 무수한 표적들
  lexicon: multus + plurimus + portentum
  rationale: portenta는 단순한 ‘기적’보다 ‘놀라운/기이한 일’의 뉘앙스가 있어, 과도한 해석을 피하면서도 복수 강조를 살린 표현을 택했습니다.
theological_decisions:
- issue: portenta의 번역 범위
  chosen_reading: ‘놀라운 일들’로 번역해 기적적 사건이면서도 해석을 특정 교리 용어로 고정하지 않았습니다.
  alternative_readings:
  - ‘기적들’
  - ‘표징들’
  rationale: 라틴어는 사건의 성격을 넓게 가리키므로, 한국어에서도 신학적 의미를 좁혀 버리는 ‘기적’보다 더 중립적인 표현을 유지하는 것이 본문 충실도에 유리합니다.
  doctrine_reference: 표징/기적 어휘의 해석 폭 보존
