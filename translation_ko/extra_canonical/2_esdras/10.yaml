  text: '1 And it happened that when my son had entered his bridal chamber[23], he fell down and died.

    2 Then we put out all the lamps, and all my fellow citizens rose up to comfort me, and I was quiet until the next day, until night.

    3 And it happened, when all had ceased from comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.

    4 And I have come, as you see, into this field. I am thinking now that I will not return to the city, but will stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”

    5 Then I left off the words in which I had still been engaged, and I answered her in anger and said,

    6 “Foolish above all women, do you not see our mourning and what has happened to us?

    7 For Zion our mother, the mother of us all, grieves in sorrow and has been brought very low in humiliation.

    8 Therefore mourn with all your might. And now, since we all mourn and are sorrowful, because we are all grieved, why are you grieved over one son?

    9 Ask the earth, and it will tell you that it is she who ought to mourn for so many who spring up upon her.

    10 From her all have had their beginnings, and others come; and behold, nearly all walk to destruction, and their multitude comes to extermination.

    11 Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?

    12 But if you say to me, ‘My lament is not like the earth’s, because I have lost the fruit of my womb,

    13 whom I bore with sorrows and brought forth with pains, while the earth, according to the way of the earth, the multitude now present in her goes away just as it came’—

    14 then I say to you: just as you gave birth in pain, so also the earth has given its fruit, man, from the beginning, to him who made her.

    15 Now then, keep your grief within yourself, and bear bravely the misfortunes that have happened to you.

    16 For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.

    17 Therefore go into the city to your husband.”

    18 But she said to me, “I will not do it, nor will I go into the city, but here I will die.”

    19 Then I continued speaking to her and said,

    20 “Do not say this, but consent to be persuaded because of Zion’s calamities, and be comforted because of Jerusalem’s sorrow.

    21 For you see that our sanctuary has been laid waste, our altar torn down, and our temple destroyed.

    22 Our harp-song has been brought low, our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished[25], the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved, and our strong men have been made weak.

    23 And what is greatest of all, the seal of Zion—for now it has been stripped of her glory and handed over into the hands of those who hate us.

    24 Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”

    25 And it happened, while I was speaking to her, that suddenly her face shone exceedingly, and her appearance flashed, her countenance becoming radiant,

    26 and suddenly she let out a great cry, full of terror, so that the earth was shaken by the sound.

    27 And I looked, and behold, the woman no longer appeared to me, but a city was being built, and a place was being revealed from great foundations. Then I was afraid and cried out with a loud voice and said,

    28 “Where is Uriel the angel, who came to me at the beginning? For it was he who made me come into this abundance of ecstasy of mind, and my end has become corruption, and my prayer a reproach.”

    29 And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.

    30 And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,

    31 and said to me, “What is the matter with you? And why are you troubled? And why is your understanding troubled, and the perception of your heart?”

    32 And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”

    33 And he said to me, “Stand up like a man, and I will instruct you.”

    34 And I said, “Speak, my lord; only do not forsake me, lest I die for nothing.

    35 For I have seen what I did not know, and I hear what I do not understand.

    36 Or is my mind deceived, and is my soul dreaming?

    37 Now therefore I beg you to show your servant the meaning of this ecstasy.”

    38 And he answered me and said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.

    39 For he has seen your straight way, that you were grieving without ceasing for your people and mourning greatly for Zion.

    40 This, then, is the meaning of the vision:

    41 the woman who appeared to you a little while ago, whom you saw mourning and whom you began to comfort—

    42 now you no longer see the form of a woman, but a city appeared to you being built.

    43 And as for her telling you about the misfortune of her son, this is the interpretation:

    44 this woman whom you saw is Zion, whom you now see as a city being built.

    45 And as for her saying to you that she had been barren for thirty years, this is because there were three thousand years in the age when no offering had yet been offered in her.

    46 And it happened, after three thousand years, Solomon built the city and offered offerings; then it was that the barren woman bore a son.

    47 And as for her saying to you, ‘I nourished him with toil,’ this was the dwelling of Jerusalem.

    48 And as for her saying to you that my son, when he came into his bridal chamber, died and disaster befell him, this was the ruin that came upon Jerusalem.

    49 And behold, you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be opened to you.

    50 And now, since the Most High has seen that you are grieved from your soul and that you suffer for her with your whole heart, he has shown you the brightness of her glory and the beauty of her splendor.

    51 For this reason I told you to remain in the field where no house had been built.

    52 For I knew that the Most High was beginning to show you these things.

    53 Therefore I told you to come into the countryside, where there is no foundation of any building.

    54 For no work of man’s building could endure in the place where the city of the Most High was beginning to be shown.

    55 Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor and the greatness of the building, as much as your eyes are able to see.

    56 And after this you will hear as much as your ears are able to hear.

    57 But you are blessed above many, and you have been called by the Most High, as only a few have been.

    58 But on the night that is coming tomorrow you shall remain here,

    59 and the Most High will show you those dream-visions that the Most High will do for those who dwell on the earth in the last days.”

    60 And I slept that night and the next[45][28], as he had told me.'
  footnotes:
  - marker: '23'
    text: The phrase 'the seal of Zion' is difficult. It may refer to Zion's distinctive glory, authenticated status, or some emblematic mark of honor; the Latin image is preserved rather than paraphrased away.
    reason: lexical_alternative
  - marker: '25'
    text: The Latin breaks off at ut etiam (‘so that even’) at the end of this verse. The English smooths the break for readability while leaving the sudden, interrupted transformation intact.
    reason: textual_variant
  - marker: '28'
    text: Latin 'this abundance of this ecstasy of mind' is awkward but forceful. The sense is that Ezra has been driven into an overwhelming visionary state, not merely ordinary confusion.
    reason: lexical_alternative
  - marker: '45'
    text: The wording behind 'three thousand years' is compressed and difficult in Latin. The interpretation follows the chapter's symbolic chronology, where the woman's thirty years correspond to a much larger epoch before offerings were made in Zion.
    reason: textual_variant
translation:
  language: ko
  text: '1 내 아들이 자기 신방[23]에 들어갔을 때 그가 넘어져 죽었습니다.


    2 그때 우리는 모든 등불을 끄고, 모든 동네 사람이 나를 위로하러 일어났으며, 나는 다음 날까지, 곧 밤이 올 때까지 잠잠했습니다.


    3 모든 이가 나를 위로하기를 그치고 내가 쉬게 되자, 내가 밤에 일어나 도망쳐 나와, 보시다시피 이 들판에 이르렀습니다.


    4 그리고 나는 보시다시피 이 들판에 왔습니다. 이제 나는 성으로 돌아가지 않고 여기 머무르겠다고 생각합니다. 또 먹지도 마시지도 않고, 죽을 때까지 쉬지 않고 슬퍼하며 금식하겠습니다.”


    5 그러고는 내가 아직 하던 말을 멈추고, 그 여자에게 분노하여 이렇게 말했습니다.


    6 “모든 여자보다도 어리석은 사람아, 우리의 슬픔과 우리에게 닥친 일을 보지 못합니까?


    7 시온은 우리 모두의 어머니인 우리 어머니로서 슬픔 속에서 애통하며, 치욕 속에서 크게 낮아졌습니다.


    8 그러니 온 힘을 다해 슬퍼하십시오. 이제 우리 모두가 슬퍼하고 근심하며, 우리 모두가 마음 아파하는데, 당신은 어찌 한 아들 때문에만 마음 아파합니까?


    9 땅에 물어 보십시오. 그러면 그 땅이 자기 위에 솟아나는 수많은 자들을 두고 자기가 애도해야 한다고 당신에게 말할 것입니다.


    10 모든 이는 그 땅에서 시작했고, 또 다른 이들이 오며, 보십시오, 거의 모두가 멸망으로 걸어가고 그 무리는 멸절로 나아갑니다.


    11 그렇다면 그토록 큰 무리를 잃은 이 땅이, 한 사람 때문에 슬퍼하는 당신보다 더 슬퍼해야 하지 않겠습니까?


    12 그러나 당신이 내게 ‘내 탄식은 땅의 탄식과 같지 않습니다. 나는 내 태의 열매를 잃었기 때문입니다.


    13 나는 그를 슬픔으로 낳고 고통으로 출산했습니다. 그러나 땅은 땅의 길에 따라, 그 안에 있는 현재의 무리가 왔던 것처럼 그대로 가버립니다’라고 말한다면—


    14 나는 당신에게 이렇게 말합니다. 당신이 고통 가운데 해산한 것처럼, 땅도 또한 처음부터 자기의 열매인 사람을 자기 창조주에게 내어 주었습니다.


    15 그러니 이제 당신의 슬픔을 당신 안에 간직하고, 당신에게 닥친 불행을 용감하게 견디십시오.


    16 만일 당신이 하나님의 명령의 의로움을 인정한다면, 당신은 때가 되면 당신의 아들을 다시 받게 될 것이며, 여자들 가운데 칭찬을 받게 될 것입니다.


    17 그러니 성으로, 당신의 남편에게 들어가십시오.”


    18 그러나 그녀가 내게 말했습니다. “저는 그렇게 하지 않겠습니다. 성으로도 들어가지 않겠습니다. 여기서 죽겠습니다.”


    19 그러자 내가 그녀에게 다시 말했습니다.


    20 “이 말을 하지 마십시오. 시온의 재난 때문에 설득을 받아들이고, 예루살렘의 슬픔 때문에 위로를 받으십시오.


    21 보십시오, 우리의 거룩한 처소는 황폐해졌고, 우리의 제단은 무너졌으며, 우리의 성전은 파괴되었습니다.


    22 우리의 수금 소리는 낮아졌고, 우리의 찬송은 침묵했으며, 우리의 기쁨은 사라졌고, 우리 등잔대의 빛은 꺼졌고, 우리의 언약궤는 약탈당했으며, 우리의 거룩한 것들은 더럽혀졌고, 우리 위에 불린 이름은 거의 모독을 당했습니다. 우리의 자녀들은 모욕을 당했고, 우리의 제사장들은 불탔으며, 우리의 레위인들은 포로로 끌려갔고, 우리의 처녀들은 더럽혀졌으며, 우리의 여자들은 폭력을 당했고, 우리의 의인들은 붙잡혀 갔으며, 우리의 어린아이들은 넘겨졌고, 우리의 청년들은 종노릇했고, 우리의 강한 자들은 약해졌습니다.


    23 그리고 무엇보다도 큰 것은 시온의 인장[23]입니다. 이제 그것은 자기 영광에서 벗겨져 우리를 미워하는 자들의 손에 넘겨졌습니다.


