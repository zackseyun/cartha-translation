    47 그리고 그녀가 당신에게 ‘내가 수고로 그를 길렀다’고 말한 것은 예루살렘의 거처였습니다.


    48 그리고 그녀가 당신에게, 내 아들이 자기 신방에 들어왔을 때 죽었고 그에게 재난이 닥쳤다고 말한 것은 예루살렘에 닥친 무너짐이었습니다.


    49 보십시오, 당신은 그녀가 자기 아들을 애도하는 모습을 보았고, 당신은 일어난 일들에 대해 그녀를 위로하기 시작했습니다. 이것들은 당신에게 밝혀져야 했던 것들입니다.


    50 이제 지극히 높으신 이가 당신이 영혼 깊은 곳에서 슬퍼하고, 온 마음으로 그녀를 위해 고통받는 것을 보셨으므로, 그녀의 영광의 광채와 그녀의 아름다움의 화려함을 당신에게 보여 주셨습니다.


    51 그러므로 내가 당신에게, 집이 아직 지어지지 않은 들판에 머물라고 말한 것입니다.


    52 나는 지극히 높으신 이가 이 일들을 당신에게 보여 주기 시작하고 계신 줄 알았기 때문입니다.


    53 그러므로 내가 당신에게 아무 건물의 기초도 없는 들판으로 오라고 말한 것입니다.


    54 지극히 높으신 이의 성읍이 드러나기 시작하는 자리에서는 사람의 건축물로 된 어떤 일도 견딜 수 없기 때문입니다.


