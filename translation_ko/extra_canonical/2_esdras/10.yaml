    25 내가 그녀에게 말하고 있을 때, 갑자기 그녀의 얼굴이 크게 빛나고, 그녀의 모습이 번쩍이며, 그 얼굴의 빛이 환하게 되었는데,


    26 곧바로 그녀가 큰 외침을 내질렀습니다. 두려움이 가득한 외침이어서 그 소리로 땅이 흔들렸습니다.


    27 내가 보니, 보십시오, 그 여인은 더 이상 내게 보이지 않고, 한 성읍이 세워지고 있었으며, 큰 기초들로부터 한 장소가 드러나고 있었습니다. 그러자 내가 두려워하여 큰 소리로 외치며 말했습니다.


    28 “처음에 내게 오셨던 천사 우리엘은 어디에 있습니까? 그가 바로 나를 이 정신의 황홀함[28] 속으로 들어오게 하였고, 내 끝은 부패가 되었으며, 내 기도는 수치가 되었습니다.”


    29 내가 이런 말을 하고 있을 때, 보십시오, 처음에 내게 왔던 그 천사가 내게 와서 나를 보았습니다.


    30 보십시오, 나는 죽은 사람처럼 누워 있었고, 내 깨달음은 사라져 있었습니다. 그가 내 오른손을 잡고 나를 강하게 하여 내 발로 세워 주었습니다.


    31 그리고 내게 말했습니다. “무슨 일입니까? 왜 불안해합니까? 왜 당신의 깨달음이, 그리고 당신 마음의 분별이 불안합니까?”


    32 내가 말했습니다. “당신이 저를 완전히 버리셨기 때문입니다. 저는 당신의 말씀대로 들판으로 나갔고, 보십시오, 내가 말할 수 없는 것을 보았고 지금도 보고 있습니다.”


    33 그가 내게 말했습니다. “사람답게 서십시오. 내가 당신을 가르치겠습니다.”


