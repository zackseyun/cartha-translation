    35 나는 내가 알지 못하던 것을 보았고, 내가 이해하지 못하는 것을 듣고 있습니다.


    36 내 정신이 속고 있는 것입니까, 아니면 내 영혼이 꿈꾸고 있는 것입니까?


    37 그러니 이제 이 황홀함의 의미를 당신의 종에게 보여 주시기를 간청합니다.”


