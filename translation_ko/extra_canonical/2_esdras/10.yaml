    40 그러므로 이것이 그 환상의 뜻입니다.


    41 조금 전 당신에게 나타났던 그 여자, 곧 당신이 그녀가 애통하는 것을 보았고 당신이 그녀를 위로하기 시작했던 그 여자는—


    42 이제 당신은 더 이상 여자의 모습을 보지 못하지만, 당신에게는 세워지고 있는 성읍이 나타났습니다.


    43 그리고 그녀가 자기 아들의 불행을 당신에게 말한 것은 이것이 풀이입니다.


    44 당신이 본 이 여자는 시온이며, 이제 당신이 세워지고 있는 성읍으로 보고 있는 그 여인입니다.


    45 그리고 그녀가 당신에게 자기 자신이 서른 해 동안 아이를 낳지 못했다고 말한 것은, 제물이 아직 그녀 안에서 드려지지 않았던 시대에 삼천 년이 있었기 때문입니다.


