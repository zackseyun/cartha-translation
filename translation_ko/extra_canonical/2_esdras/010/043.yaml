lexical_decisions:
- source_word: Haec mulier
  english_pob_choice: This woman
  chosen_korean: 이 여인
  alternatives_korean:
  - 이 여자
  - 이 사람
  lexicon: haec mulier
  rationale: 지시 대상을 분명히 하되, 이어지는 상징적 해석 문맥에서 단순한 생물학적 표현보다 '여인'이 더 자연스럽습니다.
- source_word: quam uidisti / whom you saw
  english_pob_choice: whom you saw
  chosen_korean: 네가 본
  alternatives_korean:
  - 네가 보았던
  - 네가 목격한
  lexicon: quān vīdistī
  rationale: 과거에 본 대상을 가리키는 직접적 관계절로 옮겨, 시각적 인식의 연결을 살렸습니다.
- source_word: haec est Sion
  english_pob_choice: is Zion
  chosen_korean: 그 시온입니다
  alternatives_korean:
  - 시온입니다
  - 바로 시온입니다
  lexicon: haec est Sion
  rationale: 동일시를 분명히 드러내는 본문이므로 '시온'을 음역하지 않고 고유명사로 유지하되, 앞선 지시성을 살려 '그'를 붙였습니다.
- source_word: quam nunc conspicis
  english_pob_choice: whom you now see
  chosen_korean: 지금 네가 보고 있는 바로 그 여인입니다
  alternatives_korean:
  - 지금 네가 보는 바로 그 시온입니다
  - 지금 네가 보고 있는 분입니다
  lexicon: quam nunc conspicis
  rationale: 현재의 시각적 확인을 강조하는 표현이므로 '지금 네가 보고 있는'으로 옮겼고, 반복을 자연스럽게 처리하기 위해 마지막 절은 동일시를 재진술했습니다.
theological_decisions:
- issue: 시온의 인격화 및 동일시
  chosen_reading: 여인을 곧 시온으로 동일시하는 상징적 해석을 그대로 유지했습니다.
  alternative_readings:
  - 시온을 뜻한다
  - 예루살렘을 가리킨다
  rationale: 라틴 원문은 여인을 '시온'과 직접 동일시하므로, 해석을 약화시키지 않고 본문의 상징적 장치를 보존해야 합니다.
  doctrine_reference: 알레고리/상징 해석의 본문 내 기능 보존
