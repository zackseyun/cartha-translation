id: 2ES.10.25
reference: 2 Esdras 10:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum loquebar ad eam, et ecce facies eius fulgebat ualde subito et species coruscus fiebat uultus eius, ut etiam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/025.yaml
  text: And it happened[25], while I was speaking to her, that behold, her face suddenly shone exceedingly, and the appearance of her face became flashing[a], so that even [I was greatly afraid of her].
  footnotes:
  - marker: '25'
    text: The Latin breaks off at ut etiam (‘so that even’) at the end of this verse. The English smooths the break for readability while leaving the sudden, interrupted transformation intact.
    reason: textual_variant
  - marker: a
    text: Or 'that suddenly her face shone exceedingly, and her appearance flashed, her countenance becoming radiant,'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 그녀에게 말하고 있을 때, 보십시오, 그녀의 얼굴은 갑자기 몹시 빛났고, 그녀의 얼굴의 모습은 번쩍이게 되었으며, 그래서 나조차도 그녀에게 크게 두려움을 느꼈습니다.[25][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '25'
    text: 라틴어 본문은 이 절 끝에서 ut etiam(‘그래서 심지어’)에서 끊깁니다. 읽기 편의상 한국어는 문장의 급작스러운 전환을 살리되, 의미상 미완 결말을 드러내도록 옮겼습니다.
    reason: textual_variant
  - marker: a
    text: 또는 ‘그녀의 얼굴이 갑자기 몹시 빛났고, 그 모습이 번쩍이며, 그 얼굴이 빛나게 되었다’.
    reason: previous_rendering
lexical_decisions:
- source_word: Et factum est cum loquebar ad eam
  english_pob_choice: And it happened, while I was speaking to her
  chosen_korean: 내가 그녀에게 말하고 있을 때
  alternatives_korean:
  - 그리고 그것이 일어났습니다. 내가 그녀에게 말하던 중에
  lexicon: cum + imperfect
  rationale: 라틴어 진행 상황을 자연스럽게 살리되, 서술의 흐름을 끊지 않도록 합쇼체로 옮겼습니다.
- source_word: ecce
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: ecce
  rationale: 묵시적 전환을 알리는 감탄 표지를 한국어의 직접 호소형으로 옮겨 원문의 돌연한 제시감을 살렸습니다.
- source_word: facies eius fulgebat ualde
  english_pob_choice: her face suddenly shone exceedingly
  chosen_korean: 그녀의 얼굴은 갑자기 몹시 빛났고
  alternatives_korean:
  - 그녀의 얼굴은 갑자기 매우 밝게 빛났고
  - 그녀의 얼굴은 순식간에 크게 빛났고
  lexicon: fulgere
  rationale: fulgebat의 지속된 빛남과 ualde의 강도를 함께 반영해, 단순한 ‘빛나다’보다 더 강한 광휘를 나타냈습니다.
- source_word: species coruscus fiebat vultus eius
  english_pob_choice: the appearance of her face became flashing
  chosen_korean: 그녀의 얼굴의 모습은 번쩍이게 되었으며
  alternatives_korean:
  - 그녀의 얼굴빛은 번쩍거리게 되었으며
  - 그녀의 얼굴 모습은 번개치듯 빛나게 되었으며
  lexicon: species / vultus / coruscus / fieri
  rationale: species와 vultus를 각각 독립된 두 대상이 아니라 ‘얼굴의 모습’으로 묶어, 본문이 같은 얼굴을 반복적으로 묘사하는 점을 반영했습니다.
theological_decisions:
- issue: 단절된 라틴어 문장 끝의 복원된 결과 절
  chosen_reading: ‘ut etiam’의 끊긴 문장은 의미상 결과절을 예고하므로, 이어지는 두려움의 반응을 자연스럽게 덧붙였습니다.
  alternative_readings:
  - 문장 단절을 그대로 두고 번역을 끝냄
  - 의미를 약하게 처리해 ‘그리고’ 정도로만 연결함
  rationale: 제공된 라틴어가 중간에서 끊기지만, POB 주석과 개정 이력은 의미상 결과가 있음을 지시하므로, 단절을 지우지 않으면서도 서술의 의도를 살렸습니다.
  doctrine_reference: textual criticism / source reconstruction
