- from: 내가 그녀에게 말하고 있을 때, 보십시오, 그녀의 얼굴은 갑자기 몹시 빛났고, 그녀의 얼굴의 모습은 번쩍이게 되었으며, 그래서 나조차도 그녀에게 크게 두려움을 느꼈습니다.[25][a]
  to: 내가 그녀에게 말하고 있을 때에, 보십시오, 그런 일이 있었습니다. 그녀의 얼굴은 갑자기 몹시 빛났고, 그녀의 얼굴빛은 번쩍이게 되었으며, 그래서 [나조차도 그녀를 몹시 두려워하게 되었습니다].[25][a]
  rationale: 문두의 사건 전환을 보완하고, 중복적인 표현을 자연스러운 한국어로 다듬었습니다. 가장 중요한 점으로, 라틴어 본문이 ut etiam에서 끊기는 사실을 보존하면서도 영어 POB 감사 기록이 지시하는 딸본문의 결과절을 대괄호 안에 투명하게 복원했습니다. 각주도 더 이상 번역이 미완 결말을 유지한다고 오해시키지 않고, 복원의 본문 근거와 범위를 명시합니다.
