  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ueni, sicut uides, in hoc campo. Et cogito iam non reuerti in ciuitate sed hic consistere, et neque manducabo neque bibam, sed sine intermissione lugere et ieiunare usque dum moriar.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/004.yaml
  text: And I have come[a], as you see, into this field. I intend to return to the city no more, but to stay here; and I will neither eat nor drink, but without ceasing I will mourn and fast until I die.”
  footnotes:
  - marker: a
    text: Or 'I am thinking now that I will not return to the city, but will stay here'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는, 보시다시피, 이 들판에 왔습니다. 저는 더 이상 성읍으로 돌아가지 않고 여기 머물기로 했습니다. 또한 저는 먹지도 않고 마시지도 않을 것이며, 죽을 때까지 끊임없이 슬퍼하고 금식하겠습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이제는 성읍으로 돌아가지 않고 여기 머물겠다고 생각합니다”
    reason: previous_rendering
lexical_decisions:
- source_word: et ueni, sicut uides, in hoc campo
  english_pob_choice: And I have come, as you see, into this field
  chosen_korean: “보시다시피, 이 들판에 왔습니다”
  alternatives_korean:
  - “보시다시피, 이 벌판에 왔습니다”
  - “보시다시피, 이 들에 왔습니다”
  lexicon: ueni → 오다/왔습니다; hic campus → 들판
  rationale: ueni는 완료된 도착을 나타내므로 현재 완료감이 드러나는 ‘왔습니다’로 옮기고, campus는 문맥상 ‘들판’이 가장 자연스럽습니다.
- source_word: cogito iam non reuerti in ciuitate sed hic consistere
  english_pob_choice: I intend to return to the city no more, but to stay here
  chosen_korean: “더 이상 성읍으로 돌아가지 않고 여기 머물기로 했습니다”
  alternatives_korean:
  - “이제는 성읍으로 돌아갈 생각이 없고 여기 머물겠습니다”
  - “성읍으로 더는 돌아가지 않고 여기 서 있기로 했습니다”
  lexicon: cogito + infinitive → 결심하다/의도하다; iam non → 더 이상; reuerti → 돌아가다; ciuitas → 성읍; consistere → 머물다
  rationale: cogito 뒤의 부정사구는 단순히 ‘생각하다’가 아니라 결심·의도를 뜻하므로, POB의 수정 취지에 맞게 ‘머물기로 했습니다’로 옮겼습니다.
- source_word: neque manducabo neque bibam
  english_pob_choice: I will neither eat nor drink
  chosen_korean: “먹지도 않고 마시지도 않을 것이며”
  alternatives_korean:
  - “먹지도 마시지도 않을 것이며”
  - “먹지도 않고 또한 마시지도 않을 것이며”
  lexicon: neque…neque… → ~도 …도 아니다; manducare → 먹다; bibere → 마시다
  rationale: 라틴어 부정 대구를 한국어의 병렬 부정으로 자연스럽게 살렸습니다.
- source_word: sine intermissione lugere et ieiunare usque dum moriar
  english_pob_choice: without ceasing I will mourn and fast until I die
  chosen_korean: “끊임없이 슬퍼하고 금식하겠습니다”
  alternatives_korean:
  - “쉬지 않고 애곡하고 금식하겠습니다”
  - “멈추지 않고 애도하며 금식하겠습니다”
  lexicon: sine intermissione → 끊임없이/쉬지 않고; lugere → 슬퍼하다/애곡하다; ieiunare → 금식하다
  rationale: lugere는 단순한 슬픔보다 애도·애곡의 뉘앙스가 있으나, 현대 읽기에서는 ‘슬퍼하고’가 과도한 문어화를 피하면서 의미를 유지합니다.
theological_decisions:
- issue: 화자의 자기결심과 금식 서원의 어조
  chosen_reading: 직설적 선언으로 옮겨, 화자가 스스로를 고립시키고 지속적 금식과 슬픔을 결의한 것으로 표현했습니다.
  alternative_readings:
  - 감정적 호소로 약화하여 표현
  - ‘생각하고 있습니다’처럼 미완의 마음으로 표현
  rationale: 라틴어 cogito의 용법과 POB 수정본이 모두 확정적 의도를 가리키므로, 서원의 강도를 약화하지 않았습니다.
  doctrine_reference: 서원/금식의 자기헌신 어조 보존
