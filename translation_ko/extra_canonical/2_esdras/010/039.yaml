base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/039.yaml
  text: For he has seen your upright way[a], because you were grieving without ceasing for your people and mourning greatly for Zion.
  footnotes:
  - marker: a
    text: Or 'straight way'.
    reason: previous_rendering
translation:
  language: ko
  text: 그분은 당신의 바른 길[a]을 보셨습니다. 이는 당신이 당신의 백성을 위해 끊임없이 슬퍼하고 시온 때문에 크게 애통해하셨기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘곧은 길’.
    reason: lexical_alternative
lexical_decisions:
- source_word: rectam uiam tuam
  english_pob_choice: your upright way
  chosen_korean: 당신의 바른 길
  alternatives_korean:
  - 당신의 곧은 길
  - 당신의 정직한 길
  - 당신의 올바른 삶
  lexicon: rectam uiam
  rationale: 직역하면 ‘곧은 길’이지만, POB가 채택한 ‘upright way’는 물리적 경로보다 도덕적 정직성과 행실을 가리키므로 한국어도 ‘바른 길’로 옮겨 그 윤리적 의미를 살렸습니다.
- source_word: sine intermissione contristabaris
  english_pob_choice: grieving without ceasing
  chosen_korean: 끊임없이 슬퍼하고
  alternatives_korean:
  - 쉬지 않고 슬퍼하고
  - 계속해서 근심하고
  - 잠시도 그치지 않고 슬퍼하고
  lexicon: sine intermissione + contristabaris
  rationale: 반복적·지속적 슬픔을 나타내는 표현이므로 ‘끊임없이’로 연속성을 살리고, ‘슬퍼하다’로 정서의 직접성을 유지했습니다.
- source_word: propter Sion
  english_pob_choice: mourning greatly for Zion
  chosen_korean: 시온 때문에 크게 애통해하셨습니다
  alternatives_korean:
  - 시온을 두고 크게 애도하셨습니다
  - 시온으로 인해 몹시 슬퍼하셨습니다
  - 시온을 위해 깊이 슬퍼하셨습니다
  lexicon: propter + Sion
  rationale: propter는 원인을 나타내므로 ‘때문에’로 옮겼고, ualde lugebas의 강한 비애는 한국어 성경 문체에 맞는 ‘크게 애통해하다’로 표현했습니다.
theological_decisions:
- issue: ‘당신의 바른 길’이 단순한 이동 경로인지 도덕적 행실인지
  chosen_reading: 도덕적·윤리적 올바름을 가리키는 표현으로 읽었습니다.
  alternative_readings:
  - 물리적 의미의 ‘곧은 길’로 읽는 방식
  - 비유를 약화시켜 일반적인 ‘좋은 길’로 읽는 방식
  rationale: 주변 문맥이 에스라의 회개와 중보적 슬픔을 칭찬하는 흐름이므로, 본절의 핵심은 길의 방향이 아니라 행실의 정직성입니다.
  doctrine_reference: 문맥 주도적 의미 판단
- issue: 그분의 슬픔과 애통을 과장 없이 그러나 강하게 표현할지 여부
  chosen_reading: 지속적 슬픔과 강한 애통을 모두 살리는 표현을 택했습니다.
  alternative_readings:
  - 단순히 ‘슬퍼하셨습니다’로 완화하는 방식
  - ‘울었습니다’로 정서적 강도를 구체화하는 방식
  rationale: Latin의 contristabaris와 ualde lugebas는 서로 다른 강도의 비애를 겹쳐 말하므로, 한국어도 두 층위를 구분해 전달했습니다.
  doctrine_reference: 수사적 강도 보존
