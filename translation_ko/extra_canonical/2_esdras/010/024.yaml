id: 2ES.10.24
reference: 2 Esdras 10:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu ergo excute tuam multam tristitiam, et depone abs te multitudinem dolorum, ut tibi repropitietur fortis, et requiem faciat tibi altissimus, requietionem laborum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/024.yaml
  text: Therefore shake off your great sadness, and put away from yourself the multitude of sorrows, so that the Mighty One may again be gracious to you, and the Most High may give you rest, relief from your labors.”
translation:
  language: ko
  text: 그러므로 당신의 큰 슬픔을 털어 버리고, 수많은 근심을 자기에게서 내려놓으십시오. 그리하면 전능하신 분께서 다시 당신에게 은혜를 베푸시고, 지극히 높으신 분께서 당신의 수고에서 쉼, 곧 안식을 주실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multam tristitiam / multitude of sorrows
  english_pob_choice: your great sadness / the multitude of sorrows
  chosen_korean: 큰 슬픔 / 수많은 근심
  alternatives_korean:
  - 큰 근심
  - 많은 슬픔
  - 큰 비애
  lexicon: tristitia / dolorum
  rationale: tristitia와 dolorum의 병렬을 살려 감정의 무게를 두 겹으로 드러내기 위해 ‘큰 슬픔’과 ‘수많은 근심’을 구분해 옮겼습니다.
- source_word: excute ... depone abs te
  english_pob_choice: shake off ... put away from yourself
  chosen_korean: 털어 버리고 / 자기에게서 내려놓으십시오
  alternatives_korean:
  - 떨쳐 버리고 / 버리십시오
  - 벗어 버리고 / 놓아 두십시오
  lexicon: excute, depone abs te
  rationale: 두 명령형의 강한 분리·제거 의미를 유지하면서 현대 한국어에서 자연스럽고 직접적인 동작성을 살리기 위해 ‘털어 버리다’와 ‘내려놓다’를 썼습니다.
- source_word: fortis / altissimus
  english_pob_choice: the Mighty One / the Most High
  chosen_korean: 전능하신 분 / 지극히 높으신 분
  alternatives_korean:
  - 능하신 분 / 가장 높으신 분
  - 능력자 / 가장 높으신 이
  lexicon: fortis, altissimus
  rationale: 라틴어 형용사를 인격적 칭호로 풀어 하나님을 가리키는 호칭으로 읽히도록, 익숙하면서도 본문 어조를 유지하는 ‘전능하신 분’과 ‘지극히 높으신 분’을 선택했습니다.
- source_word: requiem ... requietionem laborum
  english_pob_choice: rest, relief from your labors
  chosen_korean: 쉼, 곧 안식 / 당신의 수고에서
  alternatives_korean:
  - 휴식 / 당신의 노동에서
  - 쉼 / 수고의 짐에서
  lexicon: requies, requietio, labores
  rationale: 두 명사로 이루어진 병렬을 살려 ‘쉼’과 ‘안식’을 함께 두고, laborēs를 단순한 피로보다 삶의 수고 전체로 느껴지도록 ‘수고’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 칭호를 일반 형용사처럼 번역할지, 인격적 호칭으로 번역할지
  chosen_reading: ‘전능하신 분’과 ‘지극히 높으신 분’으로 번역해, 본문이 요구하는 하나님 지칭을 인격적 호칭으로 드러냈습니다.
  alternative_readings:
  - ‘힘센 이’와 ‘가장 높으신 이’
  - ‘전능자’와 ‘지존자’
  rationale: 영어 POB의 ‘the Mighty One / the Most High’를 따라 칭호성을 유지하되, 한국어에서 예배적이면서도 과도하게 교회화되지 않은 표현을 택했습니다.
  doctrine_reference: 하나님의 칭호와 성품에 대한 경외 표현
