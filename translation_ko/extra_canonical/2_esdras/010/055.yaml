  yaml_path: translation/extra_canonical/2_esdras/010/055.yaml
  text: Therefore do not fear, and do not let your heart be terrified, but go in and see the splendor or the greatness of the building, as much as your eyes are able to see.
translation:
  language: ko
  text: 그러므로 두려워하지 마십시오. 또 마음이 떨리지 않게 하십시오. 그러나 안으로 들어가 건물의 화려함 또는[a] 크기를 보십시오. 눈으로 볼 수 있는 만큼 보십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '또는: “그리고.” 라틴어 vel는 문맥에 따라 ‘또는’과 ‘그리고’ 둘 다 가능하나, 여기서는 대안적 뉘앙스를 살려 ‘또는’으로 옮겼습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: noli timere neque expavescat cor tuum
  english_pob_choice: do not fear, and do not let your heart be terrified
  chosen_korean: 두려워하지 마십시오. 또 마음이 떨리지 않게 하십시오.
  alternatives_korean:
  - 무서워하지 마십시오. 또 마음이 놀라지 않게 하십시오.
  - 두려워 말고 마음이 겁먹지 않게 하십시오.
  lexicon: timere / expavescat cor tuum
  rationale: noli timere와 expavescat cor tuum의 이중 금지를 살려, 단순한 감정 부족이 아니라 내면의 동요를 함께 금지하는 표현으로 옮겼습니다.
- source_word: ingredere et vide
  english_pob_choice: but go in and see
  chosen_korean: 그러나 안으로 들어가 … 보십시오
  alternatives_korean:
  - 그런데 안으로 들어가 … 보십시오
  - 들어가서 … 보십시오
  lexicon: ingredere / vide
  rationale: 명령형 두 개를 한국어에서 자연스럽게 연결하되, 반전 접속사 sed의 대조를 살려 ‘그러나’로 시작했습니다.
- source_word: splendorem vel magnitudinem aedificii
  english_pob_choice: the splendor or the greatness of the building
  chosen_korean: 건물의 화려함 또는 크기
  alternatives_korean:
  - 건물의 빛남 또는 عظ대함
  - 건물의 광채 또는 규모
  lexicon: splendorem / magnitudinem / aedificii
  rationale: Latin vel를 따라 ‘또는’으로 구분했고, splendorem은 외형적 찬란함을 드러내는 ‘화려함’으로, magnitudinem은 물리적 큰 정도를 드러내는 ‘크기’로 옮겼습니다.
- source_word: quantum capax est tibi visu oculorum videre
  english_pob_choice: as much as your eyes are able to see
  chosen_korean: 눈으로 볼 수 있는 만큼 보십시오.
  alternatives_korean:
  - 눈이 볼 수 있는 만큼 보십시오.
  - 당신의 눈이 볼 수 있는 만큼 보십시오.
  lexicon: capax est / visu oculorum / videre
  rationale: 직역의 어색함을 줄이되, ‘눈으로 볼 수 있는 한도’라는 원문의 제한을 분명히 유지했습니다.
theological_decisions:
- issue: 대조 접속사 vel의 처리
  chosen_reading: ‘화려함 또는 크기’로 번역해 두 개의 관찰 대상이 선택적으로 제시된다는 점을 살렸습니다.
  alternative_readings:
  - ‘화려함과 크기’로 통합하는 번역
  - ‘화려함이나 크기’로 약화하는 번역
  rationale: 개정된 영어 POB가 or를 택한 것은 라틴어 vel의 선택/대안성을 반영한 것이므로, 본문도 그 긴장을 유지하는 것이 더 충실합니다.
  doctrine_reference: source fidelity / semantic precision
