  - marker: a
    text: Or 'the dwelling of Jerusalem'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 당신에게 “나는 수고로 그를 길렀습니다”라고 말한 것은, 이것이 예루살렘의 거처였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘의 거처”로도 옮길 수 있습니다.
