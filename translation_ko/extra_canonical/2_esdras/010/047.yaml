    rationale: 이 비유의 화자는 앞 문맥의 여성(여인)이며, 영어 POB도 she로 명시합니다. 한국어에서도 ‘그 여자가’로 바로잡아야 합니다.
  - severity: medium
    issue: ‘예루살렘의 거처’는 habitatio를 물리적 장소 또는 건물로 오해하게 할 수 있습니다.
    rationale: habitatio는 여기서 거주·거주함의 상태를 뜻합니다. ‘예루살렘의 거주’가 원문의 명사적·속격적 표현을 보존하면서 의미를 더 정확히 전달합니다.
  - severity: low
