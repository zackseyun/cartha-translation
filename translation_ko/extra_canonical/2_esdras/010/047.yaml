translation:
  language: ko
  text: 또 그 여자가 당신에게 “나는 수고하며 그를 길렀습니다”라고 말한 것은 예루살렘의 거주였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “예루살렘에 거함”으로 옮길 수 있습니다.
    reason: habitatio Hierusalem의 속격을 장소적 의미로 이해하는 번역 가능성을 제시합니다.
lexical_decisions:
- source_word: et quod tibi dixit
  english_pob_choice: And as for what she said to you
  chosen_korean: 그리고 그가 당신에게 “…”라고 말한 것은
  alternatives_korean:
  - 그리고 그가 당신에게 말한 것은
  - 그리고 그가 당신에게 한 말은
  lexicon: source_note
  rationale: 라틴어 quod는 직접 인용 전체를 가리키는 내용절로 보아 ‘~라고 말한 것’으로 옮겨 원문의 구조를 살렸습니다. 인칭은 문맥상 전후 서술과 맞물리는 지시를 그대로 따랐습니다.
- source_word: nutrivi eum cum labore
  english_pob_choice: I nourished him with toil
  chosen_korean: 나는 수고로 그를 길렀습니다
  alternatives_korean:
  - 나는 수고하며 그를 먹여 살렸습니다
  - 나는 고생하며 그를 키웠습니다
  lexicon: source_note
  rationale: nutrivi는 단순한 양육보다 ‘기르다/먹여 살리다’의 뜻을 포함하므로, 한국어에서는 관계의 보살핌과 노동의 수고를 함께 드러내는 ‘수고로 그를 길렀습니다’로 옮겼습니다.
- source_word: habitatio Hierusalem
  english_pob_choice: the dwelling of Jerusalem
  chosen_korean: 예루살렘의 거처
  alternatives_korean:
  - 예루살렘의 거주
  - 예루살렘에 거함
  lexicon: source_note
  rationale: habitatio는 건물이 아니라 거주 상태를 가리키므로 ‘거처’로 옮겨 장소 안에서의 거주를 자연스럽게 드러냈습니다.
