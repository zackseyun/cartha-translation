base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/030.yaml
  text: And behold, I was lying there like a dead man, and my understanding had been taken away; and he took my right hand and strengthened me and set me on my feet,
translation:
  language: ko
  text: 보십시오, 나는 죽은 사람처럼 누워 있었고 내 이해력은 사라져 있었습니다. 그러자 그는 내 오른손을 붙들고 나를 강하게 하여 내 발로 세워 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 문장 끝이 미완결처럼 남아 있으나, 영어 POB는 의미상 ‘내 발로 세워 주었다’로 완결해 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Et ecce eram positus ut mortuus
  english_pob_choice: And behold, I was lying there like a dead man
  chosen_korean: 보십시오, 나는 죽은 사람처럼 누워 있었고
  alternatives_korean:
  - 보라, 나는 죽은 자처럼 놓여 있었고
  - 보십시오, 나는 죽은 사람처럼 놓여 있었고
  lexicon: posited / mortuus
  rationale: 라틴어의 상태 표현을 그대로 살려 ‘누워 있었고’로 자연스럽게 옮기되, ‘죽은 사람처럼’으로 POB의 비유를 유지했습니다.
- source_word: intellectus meus alienatus erat
  english_pob_choice: my understanding had been taken away
  chosen_korean: 내 이해력은 사라져 있었습니다
  alternatives_korean:
  - 내 분별력은 떠나 있었습니다
  - 내 정신은 빼앗겨 있었습니다
  lexicon: intellectus
  rationale: 지적 기능이 상실된 상태를 ‘이해력’으로 옮겨 원문의 의미 상실을 분명히 했습니다.
- source_word: tenuit dexteram meam et confortauit me
  english_pob_choice: and he took my right hand and strengthened me
  chosen_korean: 그러자 그는 내 오른손을 붙들고 나를 강하게 하여
  alternatives_korean:
  - 그리고 내 오른손을 잡고 나를 힘주어
  - 그리고 내 오른손을 잡아 나를 격려하고
  lexicon: tenuit / dexteram / confortavit
  rationale: ‘붙들다’는 손을 잡는 행위를, ‘강하게 하다’는 원문의 회복·강화의 효과를 가장 직접적으로 드러냅니다.
- source_word: statuit me super
  english_pob_choice: and set me on my feet
  chosen_korean: 내 발로 세워 주었습니다.
  alternatives_korean:
  - 일어서게 해 주었습니다.
  - 서게 해 주었습니다.
  lexicon: statuit
  rationale: 라틴어의 미완결 구문은 POB의 의미를 따라 ‘내 발로 세우다’로 보완해 한국어로 자연스럽게 마무리했습니다.
theological_decisions:
- issue: 천사와의 회복 장면을 서술하는 어조
  chosen_reading: 직접적인 1인칭 체험 서술로 유지하고, 문체는 서술체 합쇼체로 통일했습니다.
  alternative_readings:
  - 더 경건한 기도체로 바꾸는 번역
  - 고어체로 격상하는 번역
  rationale: 원문은 환시 후 회복의 상황을 담담히 전하므로, 감정 과장 없이 현대적 서술체로 옮기는 것이 적절합니다.
  doctrine_reference: 서술 장르 보존
