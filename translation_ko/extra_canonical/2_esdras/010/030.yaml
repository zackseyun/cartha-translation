  source_fidelity: 초안은 라틴어의 핵심 서두인 “angelus qui in principio uenerat ad me, et uidit me”(처음에 내게 왔던 천사가 나를 보았다)를 빠뜨렸습니다. 또한 intellectus ... alienatus는 단순한 ‘이해력’보다는 정신·분별의 상실 또는 혼미를 가리킵니다. 마지막 statuit me super는 현전 라틴어에서 목적·보어가 뒤따르지 않은 채 끝나므로, 영어 POB를 따라 보완할 경우 이를 각주로 밝혀야 합니다.
