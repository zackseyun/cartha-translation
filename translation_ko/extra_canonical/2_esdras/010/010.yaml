  text: From her all have had their beginnings, and others come; and behold, nearly all walk to destruction and to extermination.
translation:
  language: ko
  text: 그녀에게서 모든 이가 시작을 얻었고, 또 다른 이들도 옵니다. 보십시오, 거의 모두가 멸망과 파멸로 걸어갑니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 ipsa는 의인화된 여성형 지시로, 한국어도 이를 반영해 ‘그녀에게서’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: ex ipsa initia omnes nacti
  english_pob_choice: From her all have had their beginnings
  chosen_korean: 그녀에게서 모든 이가 시작을 얻었고
  alternatives_korean:
  - 그녀에게서 모든 사람이 태어났고
  - 그녀에게서 모든 이가 비롯되었고
  lexicon: ex + ipsa + initia + nacti
  rationale: Latin의 출발점·기원 이미지를 살려 ‘시작을 얻다’로 옮겼고, 인칭 대명사 ipsa를 반영해 ‘그녀에게서’로 유지했습니다.
- source_word: alii veniunt
  english_pob_choice: and others come
  chosen_korean: 또 다른 이들도 옵니다
  alternatives_korean:
  - 그리고 다른 이들도 오고
  - 또 다른 이들도 들어옵니다
  lexicon: alii veniunt
  rationale: 간결한 현재 서술로 옮겨, 원문의 병렬 구조를 유지하면서 ‘come’의 일반적 도래를 살렸습니다.
- source_word: pene omnes
  english_pob_choice: nearly all
  chosen_korean: 거의 모두가
  alternatives_korean:
  - 대부분이
  - 거의 모든 이가
  lexicon: pene omnes
  rationale: 양적 제한을 분명히 드러내는 가장 직역적인 표현으로 처리했습니다.
- source_word: in perditionem ... et in exterminium
  english_pob_choice: to destruction and to extermination
  chosen_korean: 멸망과 파멸로
  alternatives_korean:
  - 멸망과 멸절로
  - 파괴와 소멸로
  lexicon: in + accusative of result
  rationale: 두 결과어의 중첩을 한국어에서는 자연스러운 쌍으로 압축하되, 서로 다른 파국의 강도를 유지했습니다.
theological_decisions:
- issue: 여성 지시어 ipsa의 보존
  chosen_reading: 문맥상 그 출처를 가리키는 여성형 대명사를 ‘그녀에게서’로 살렸습니다.
  alternative_readings:
  - 그것에게서
  - 거기에서
  rationale: 라틴어 원문이 출처를 의인화된 여성으로 지시하므로, 이를 평탄화하지 않고 그대로 드러내는 편이 원문의 수사와 긴장을 보존합니다.
  doctrine_reference: source fidelity / rhetorical personification
