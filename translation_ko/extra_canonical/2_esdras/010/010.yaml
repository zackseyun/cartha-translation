  - 그리고 다른 이들도 오고
  - 또 다른 이들도 들어옵니다
  lexicon: alii veniunt
  rationale: 간결한 현재 서술로 옮겨, 원문의 병렬 구조를 유지하면서 ‘come’의 일반적 도래를 살렸습니다.
- source_word: pene omnes
  english_pob_choice: nearly all
  chosen_korean: 거의 모두가
  alternatives_korean:
  - 대부분이
  - 거의 모든 이가
  lexicon: pene omnes
  rationale: 양적 제한을 분명히 드러내는 가장 직역적인 표현으로 처리했습니다.
- source_word: in perditionem ... et in exterminium
  english_pob_choice: to destruction and to extermination
  chosen_korean: 멸망과 파멸로
  alternatives_korean:
  - 멸망과 멸절로
  - 파괴와 소멸로
  lexicon: in + accusative of result
  rationale: 두 결과어의 중첩을 한국어에서는 자연스러운 쌍으로 압축하되, 서로 다른 파국의 강도를 유지했습니다.
theological_decisions:
- issue: 여성 지시어 ipsa의 보존
  chosen_reading: 문맥상 그 출처를 가리키는 여성형 대명사를 ‘그녀에게서’로 살렸습니다.
  alternative_readings:
