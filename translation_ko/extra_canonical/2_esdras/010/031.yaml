id: 2ES.10.31
reference: 2 Esdras 10:31
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'pedes meos et dixit mihi: Quid tibi est, et quare conturbaris, et quid conturbatus est intellectus tuus et sensus cordis tui ? et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/031.yaml
  text: and said to me, “What is the matter with you? And why are you troubled? And why are your understanding and the perception of your heart troubled?”
translation:
  language: ko
  text: 그리고 내게 말씀하셨습니다. 「무슨 일입니까? 왜 불안해하십니까? 또 어찌하여 당신의 이해와 마음의 지각이 혼란에 빠져 있습니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quid tibi est
  english_pob_choice: What is the matter with you?
  chosen_korean: 무슨 일입니까?
  alternatives_korean:
  - 무슨 일인가요?
  - 어찌된 일입니까?
  lexicon: interrogative idiom
  rationale: 라틴어 관용 질문을 자연스러운 현대 한국어 질문으로 옮기되, 불필요한 해설을 덧붙이지 않고 상황의 이상함을 바로 묻는 표현을 택했습니다.
- source_word: conturbaris
  english_pob_choice: are you troubled
  chosen_korean: 불안해하십니까
  alternatives_korean:
  - 마음이 뒤숭숭하십니까
  - 혼란스러우십니까
  - 걱정하십니까
  lexicon: conturbo
  rationale: conturbaris의 ‘뒤흔들리다/불안해지다’ 뉘앙스를 살려, 단순한 감정상태보다 내면의 동요를 드러내는 표현으로 옮겼습니다.
- source_word: intellectus tuus et sensus cordis tui
  english_pob_choice: your understanding and the perception of your heart
  chosen_korean: 당신의 이해와 마음의 분별
  alternatives_korean:
  - 당신의 이해와 마음의 인식
  - 당신의 깨달음과 마음의 감각
  lexicon: intellectus / sensus cordis
  rationale: 라틴어의 두 명사구를 병렬로 유지하되, intellectus는 ‘이해’, sensus cordis는 직역보다 의미를 살린 ‘마음의 분별’로 옮겨 인지와 내적 판단의 겹침을 드러냈습니다.
- source_word: conturbatus est
  english_pob_choice: are troubled
  chosen_korean: 불안해하십니까
  alternatives_korean:
  - 뒤숭숭하십니까
  - 혼란스러우십니까
  lexicon: conturbo passive
  rationale: 마지막 절도 같은 동사군으로 통일하여, 영어 POB가 정리한 병렬 구조를 한국어에서도 자연스럽게 보존했습니다.
