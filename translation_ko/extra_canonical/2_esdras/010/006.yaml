  text: In anger at her, I said, “Most foolish of all women, do you not see our mourning and what has happened to us?
translation:
  language: ko
  text: 그 여자에게 분노하여 나는 말했습니다. 「모든 여자 중에서 가장 어리석은 여자여, 우리의 애통함과 우리에게 일어난 일을 보지 못하십니까?」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iracundia ad eam et dixi
  english_pob_choice: In anger at her, I said
  chosen_korean: 그 여자에게 분노한 나는 이렇게 말했습니다
  alternatives_korean:
  - 그 여자에게 화가 나서 나는 말했습니다
  - 그 여자에게 진노하며 나는 말했습니다
  lexicon: iracundia, ad eam, dixi
  rationale: iracundia는 단순한 감정 상태가 아니라 대상에게 향한 분노를 나타내므로, 관계를 드러내는 ‘그 여자에게 분노한’으로 옮겨 라틴어의 방향성을 살렸습니다.
- source_word: Stulta super omnes mulieres
  english_pob_choice: Most foolish of all women
  chosen_korean: 가장 어리석은 여자야
  alternatives_korean:
  - 여자들 중 가장 어리석은 자야
  - 모든 여자들 가운데 가장 어리석은 여자야
  lexicon: stulta, super omnes mulieres
  rationale: super omnes는 비교 최상급을 강하게 나타내므로 ‘가장’으로 처리했고, 직접 호칭 구조에 맞게 ‘여자야’로 자연스럽게 재구성했습니다.
- source_word: non vides
  english_pob_choice: do you not see
  chosen_korean: 보지 못하느냐
  alternatives_korean:
  - 보지 않느냐
  - 보지 못하십니까
  lexicon: non video
  rationale: 수사적 질문의 긴박함을 살리기 위해 직설적 반문인 ‘보지 못하느냐’를 택했습니다.
- source_word: luctum nostrum et quod factum est nobis
  english_pob_choice: our mourning and what has happened to us
  chosen_korean: 우리의 애통함과 우리에게 일어난 일
  alternatives_korean:
  - 우리의 슬픔과 우리에게 닥친 일
  - 우리가 겪은 애통함과 일어난 일
  lexicon: luctus, factum est nobis
  rationale: luctus는 단순한 슬픔보다 상실에 대한 통곡을 가리켜 ‘애통함’이 더 가깝고, factum est nobis는 직역보다 한국어 자연성을 고려해 ‘우리에게 일어난 일’로 옮겼습니다.
theological_decisions:
- issue: 직접 화법의 반말 호칭
  chosen_reading: 인물이 격앙된 상태로 상대 여성에게 직접 말하는 장면이므로, 인용문 안에서는 반말·호칭형을 사용했습니다.
  alternative_readings:
  - 인용문 안에서도 합쇼체를 유지하는 방식
  - 보다 완곡한 ‘어리석은 여자여’
  rationale: 원문은 감정이 실린 직접 비난과 반문으로 구성되어 있어, 한국어에서도 화자의 격정을 드러내는 말투가 의미 기능을 잘 보존합니다.
  doctrine_reference: 서사적 직접화법의 화용론
