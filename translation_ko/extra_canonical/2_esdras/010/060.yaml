id: 2ES.10.60
reference: 2 Esdras 10:60
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et dormivi illam noctem et aliam sicut dixerat mihi.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/060.yaml
  text: And I slept that night and another, as he had told me.
translation:
  language: ko
  text: 그리고 나는 그날 밤과 또 다른 밤을 잤습니다. 그가 내게 말한 대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et dormivi
  english_pob_choice: And I slept
  chosen_korean: 나는 …를 잤습니다
  alternatives_korean:
  - 나는 잠들었습니다
  - 나는 잤습니다
  lexicon: dormire
  rationale: 라틴어 dormivi는 단순히 ‘잠들다’보다 ‘잤다’에 가깝고, 서술 진행을 자연스럽게 살리기 위해 합쇼체의 평이한 표현을 택했습니다.
- source_word: illam noctem et aliam
  english_pob_choice: that night and another
  chosen_korean: 그날 밤과 또 다른 밤
  alternatives_korean:
  - 그 밤과 다음 밤
  - 그날 밤과 그다음 밤
  lexicon: noctem / aliam
  rationale: illam은 특정된 ‘그날 밤’을, aliam은 영어 POB의 재수정처럼 ‘the next’보다 덜 규정적인 ‘another’를 뜻하므로 ‘또 다른 밤’으로 옮겨 시간의 연속은 유지하되 직역의 경직을 피했습니다.
- source_word: sicut dixerat mihi
  english_pob_choice: as he had told me
  chosen_korean: 그가 내게 말한 대로였습니다
  alternatives_korean:
  - 그가 내게 말한 것처럼이었습니다
  - 그가 내게 이르신 대로였습니다
  lexicon: dicere
  rationale: dixerat mihi는 과거완료의 선행 지시를 가리키므로 ‘말한 대로’로 옮겨 순서와 종속 관계를 분명히 했습니다.
theological_decisions:
- issue: 서술형태와 어조
  chosen_reading: 직설적 회고문으로, 화자의 개인적 체험을 담담히 보고하는 문장으로 처리했습니다.
  alternative_readings:
  - 더 구어적인 ‘나는 그 밤과 또 한 밤을 잤습니다’
  - 더 성경문체적인 ‘나는 그 밤과 다른 밤에도 잤습니다’
  rationale: 본문은 신학적 용어보다 사건 진술이 중심이므로, 추가 해석을 넣지 않고 라틴어의 단순 서술 구조를 그대로 드러냈습니다.
  doctrine_reference: 서사문 번역 원칙
