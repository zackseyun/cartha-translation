revisions:
- from: 그러나 당신이 내게 말한다면, 「나의 애통은 땅의 애통과 같지 않습니다. 왜냐하면 내가 내 태의 열매를 잃었기 때문입니다」라고 하실 것입니다.
  to: 그러나 만일 당신이 내게 말한다면, 「나의 애통은 땅의 애통과 같지 않습니다. 내가 내 태의 열매를 잃었기 때문입니다.」
  rationale: 조건절만으로 끝나는 원문의 구문을 보존하기 위해 ‘라고 하실 것입니다’를 삭제했습니다. Si autem의 대비와 조건을 ‘그러나 만일’로, quia의 이유 관계를 ‘~때문입니다’로 자연스럽게 옮겼습니다. ‘애통’과 ‘태의 열매’는 원문의 의미와 성경적 문체를 보존하므로 유지했습니다.
