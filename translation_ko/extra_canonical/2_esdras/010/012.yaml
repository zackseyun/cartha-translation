base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/012.yaml
  text: But if you say to me, ‘My lament is not like the earth’s, because I have lost the fruit of my womb,’
translation:
  language: ko
  text: 그러나 당신이 내게 말한다면, 「나의 애통은 땅의 애통과 같지 않습니다. 왜냐하면 내가 내 태의 열매를 잃었기 때문입니다」라고 하실 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Si autem dices mihi
  english_pob_choice: But if you say to me
  chosen_korean: 그러나 당신이 내게 말한다면
  alternatives_korean:
  - 그런데 당신이 내게 말한다면
  - 만일 당신이 내게 말한다면
  lexicon: Si autem
  rationale: 조건절의 대비를 살려 ‘그러나’로 시작하고, 직접화법의 상대를 자연스러운 2인칭 존칭으로 옮겼습니다.
- source_word: planctus
  english_pob_choice: lament
  chosen_korean: 애통
  alternatives_korean:
  - 탄식
  - 애도
  lexicon: planctus
  rationale: 단순한 슬픔보다 공개적이고 통곡 섞인 비탄의 뉘앙스를 살리기 위해 ‘애통’을 선택했습니다.
- source_word: terrae
  english_pob_choice: the earth’s
  chosen_korean: 땅의
  alternatives_korean:
  - 세상의
  - 대지의
  lexicon: terra
  rationale: 라틴어의 직접적 소유격을 자연스럽게 옮겨 ‘땅의’로 표현했습니다.
- source_word: fructum uentris mei
  english_pob_choice: the fruit of my womb
  chosen_korean: 내 태의 열매
  alternatives_korean:
  - 내 배의 열매
  - 내 자궁의 열매
  lexicon: fructus + venter
  rationale: 성경적·고전적 표현인 ‘태의 열매’를 유지해 출산한 자녀를 가리키는 완곡하면서도 본문에 충실한 표현을 택했습니다.
theological_decisions:
- issue: 직접화법의 존칭 처리
  chosen_reading: 서술문 바깥에서는 합쇼체를 유지하되, 인용문 안의 1인칭 진술은 원문의 감정적 호소를 살려 평서형으로 두었습니다.
  alternative_readings:
  - 인용문 안까지 전체를 존칭화하는 방식
  - 더 격식 있는 문어체로 통일하는 방식
  rationale: 본문은 비탄의 진술을 인용하는 구조이므로, 화자의 감정적 진정성을 보존하는 것이 더 중요합니다.
  doctrine_reference: 문체·화법 일치
