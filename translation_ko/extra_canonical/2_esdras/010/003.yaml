id: 2ES.10.3
reference: 2 Esdras 10:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum omnes quievissent ut me consolarentur ut quiescerem, et surrexi nocte et fugi et veni, sicut vides, in hoc campo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/003.yaml
  text: And it happened, when all had stopped comforting me so that I might rest, that I rose by night and fled and came, as you see, into this field.
translation:
  language: ko
  text: 그리고 모든 사람이 내가 쉴 수 있도록 나를 위로하는 일을 그치자, 나는 밤에 일어나 달아나, 보시다시피 이 들판으로 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et factum est
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그 일이 일어났습니다
  - 그리고 이렇게 되었습니다
  lexicon: source_note
  rationale: 라틴어 서술 전환구는 한국어에서 과도하게 장중하게 만들지 않고 사건의 전개를 자연스럽게 이어 주는 연결어로 처리했습니다.
- source_word: cum omnes quievissent ut me consolarentur ut quiescerem
  english_pob_choice: when all had stopped comforting me so that I might rest
  chosen_korean: 모든 사람이 나를 위로하는 일을 그치고 내가 쉬게 되자
  alternatives_korean:
  - 모든 사람이 나를 위로하기를 멈추어 내가 쉬게 되자
  - 모든 사람이 나를 위로하는 일을 멈추어 내가 쉬게 되자
  lexicon: source_note
  rationale: quievissent와 quiescerem의 휴식/그침의 대립을 살리기 위해 ‘위로하는 일을 그치고’와 ‘쉬게 되자’로 대응했습니다.
- source_word: surrexi nocte et fugi et veni
  english_pob_choice: I rose by night and fled and came
  chosen_korean: 내가 밤에 일어나 도망하여
  alternatives_korean:
  - 나는 밤에 일어나 도망하고 왔습니다
  - 내가 밤에 일어나 달아나 이르렀습니다
  lexicon: source_note
  rationale: 세 동사 연쇄를 한국어에서 자연스러운 서술 흐름으로 묶되, ‘밤에’와 이동의 연쇄를 보존했습니다.
- source_word: sicut vides, in hoc campo
  english_pob_choice: as you see, into this field
  chosen_korean: 보시다시피 이 들판에 이르렀습니다
  alternatives_korean:
  - 보시는 대로 이 들판에 왔습니다
  - 보시다시피 이 들판으로 왔습니다
  lexicon: source_note
  rationale: 청자에게 직접 확인을 요청하는 표현은 ‘보시다시피’로 자연스럽게 옮기고, 최종 도착을 ‘이르렀습니다’로 마무리했습니다.
theological_decisions:
- issue: 서술체의 문체와 직접 화법의 존대 유지
  chosen_reading: 서술은 합쇼체로 유지하고, 청자에게 말하는 구절은 ‘보시다시피’처럼 존대형 직접 화법으로 처리했습니다.
  alternative_readings:
  - 평서형으로만 처리
  - 더 성경문체적인 고어체 사용
  rationale: 이 구절은 역사적 서술이지만 청자에게 직접 말을 거는 부분이 있어 현대 표준어 합쇼체가 원문의 소통 상황을 가장 잘 드러냅니다.
  doctrine_reference: 문체/화행 일치
