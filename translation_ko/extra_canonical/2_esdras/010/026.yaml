  - severity: low
    issue: ‘그 소리로’와 ‘터뜨려’의 연결이 다소 덜 자연스럽습니다.
    rationale: 라틴어 ut 결과절과 a sono의 원인 표현은 ‘터뜨리자 그 소리에’로 옮기면 현대 한국어에서 더 매끄럽고 의미도 유지됩니다.
