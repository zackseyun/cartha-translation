  source_fidelity: 라틴어의 ecce, subito, emisit sonum vocis magnum timore plenum, ut commoveretur terra a sono, et vidi가 모두 반영되어야 합니다. 초안도 핵심 의미는 충실하나, ‘두려움이 가득한 큰 외침’보다 공포가 외침/소리에 차 있다는 라틴어 수식을 더 자연스럽게 드러낼 수 있습니다. 마지막 ‘그리고 나는 보았습니다’는 목적어를 보충하지 않아 원문의 미완결적 연결을 보존합니다.
  naturalness: ‘그 소리로’는 원인·수단 관계를 나타낼 수 있으나 이 문맥에서는 ‘그 소리에’가 더 자연스럽습니다. 또한 ‘터뜨려’보다 ‘터뜨리자’가 뒤따르는 결과절과 자연스럽게 연결됩니다.
  terminology: ecce는 현대 합쇼체 서술에서 ‘보십시오’로 적절합니다. timore plenum은 ‘두려움’도 가능하지만, 격렬한 외침의 정서적 성격을 살려 ‘공포로 가득 찬’으로 다듬었습니다. 별도의 신학 용어 문제는 없습니다.
  issues:
