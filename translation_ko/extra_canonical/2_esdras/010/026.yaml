id: 2ES.10.26
reference: 2 Esdras 10:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ecce subito emisit sonum vocis magnum timore plenum, ut commoveretur terra a sono. et vidi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/026.yaml
  text: and behold[a], suddenly she let out a great cry, full of terror, so that the earth was shaken by the sound. And I saw,
  footnotes:
  - marker: a
    text: Or 'and suddenly she let out a great cry, full of terror, so that the earth was shaken by the sound.'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 갑자기 그녀는 두려움이 가득한 큰 외침을 터뜨려 그 소리로 땅이 흔들렸습니다. 그리고 나는 보았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보십시오’는 ecce의 주의 환기를 옮긴 것입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ecce
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보십시오
  lexicon: 감탄사/호격적 주의 환기
  rationale: ecce는 단순 접속이 아니라 독자의 주의를 급히 끌어 사건 전환을 보여 주므로, 합쇼체에 맞는 주의 환기 표현으로 옮겼습니다.
- source_word: emisit sonum vocis magnum
  english_pob_choice: she let out a great cry
  chosen_korean: 큰 외침을 터뜨려
  alternatives_korean:
  - 큰 소리를 냈습니다
  - 큰 울부짖음을 내질렀습니다
  lexicon: sonus / vox
  rationale: vocis는 단순 음성이 아니라 공포에 찬 큰 외침으로 드러나므로, 소리의 크기와 격렬함을 살린 표현을 선택했습니다.
- source_word: timore plenum
  english_pob_choice: full of terror
  chosen_korean: 두려움이 가득한
  alternatives_korean:
  - 공포로 가득 찬
  - 전율로 가득한
  lexicon: timor
  rationale: timore는 감정적 공포를 가리키므로, 문맥상 가장 직접적인 ‘두려움’으로 옮겼습니다.
- source_word: ut commoveretur terra a sono
  english_pob_choice: so that the earth was shaken by the sound
  chosen_korean: 그 소리로 땅이 흔들렸습니다
  alternatives_korean:
  - 그 소리에 땅이 흔들렸습니다
  - 소리 때문에 땅이 뒤흔들렸습니다
  lexicon: commoveo / terra / sonus
  rationale: ut 이하의 결과 절은 원인-결과를 분명히 보여 주므로, 결과를 자연스러운 한국어로 간결하게 살렸습니다.
- source_word: et vidi
  english_pob_choice: And I saw
  chosen_korean: 그리고 나는 보았습니다
  alternatives_korean:
  - 그리고 나는 보았고
  - 그리고 내가 보니
  lexicon: video
  rationale: applied_revisions가 지적하듯 마지막 구절은 ‘And I saw’이며, 26절 안에서 서술자의 시점을 분명히 마무리해야 합니다.
theological_decisions:
- issue: ecce와 et vidi의 서술 기능
  chosen_reading: 둘 다 서술 진행의 표지로 보아, 과장하거나 상징화하지 않고 장면 전환과 관찰 행위를 그대로 드러냈습니다.
  alternative_readings:
  - ecce를 단순 연결어로 약화시키는 읽기
  - et vidi를 다음 절로 넘겨 문장 경계를 흐리는 읽기
  rationale: 본문은 환상/서술의 급격한 전환을 의도적으로 배치하므로, 두 표지를 모두 유지하는 것이 독자의 이해에 가장 충실합니다.
  doctrine_reference: 본문 해석의 서술 충실성
