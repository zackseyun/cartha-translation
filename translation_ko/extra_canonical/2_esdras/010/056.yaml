lexical_decisions:
- source_word: Et post haec
  english_pob_choice: And after this
  chosen_korean: 그리고 이 일 뒤에는
  alternatives_korean:
  - 그리고 그 뒤에는
  - 그 후에는
  lexicon: post hoc/post haec
  rationale: 시간적 연결과 순서를 자연스럽게 살리되, 앞뒤 문맥의 지시를 과도하게 특정하지 않기 위해 ‘이 일 뒤에는’으로 옮겼습니다.
- source_word: audies
  english_pob_choice: you will hear
  chosen_korean: 들을 것입니다
  alternatives_korean:
  - 들으실 것입니다
  - 듣게 될 것입니다
  lexicon: audio
  rationale: 미래 시제를 분명히 하면서도, 직접 청자에게 말하는 예언적 진술의 흐름을 자연스럽게 반영했습니다.
- source_word: quantum capit auditus
  english_pob_choice: as much as
  chosen_korean: 들을 수 있는 만큼
  alternatives_korean:
  - 들을 만큼
  - 들을 수 있는 한도까지
  lexicon: quantum + capio + auditus
  rationale: 직역보다 의미를 살려, ‘청각이 감당할 수 있는 범위’라는 제한을 한국어로 자연스럽게 드러냈습니다.
- source_word: aurium tuarum
  english_pob_choice: your ears
  chosen_korean: 당신의 귀가
  alternatives_korean:
  - 당신의 귀로
  - 당신의 귀들이
  lexicon: auris
  rationale: 라틴어 복수형을 그대로 노출하기보다 한국어에서는 자연스러운 단수 집합 표현으로 처리했습니다.
theological_decisions:
- issue: 청자의 인식 한계 표현
  chosen_reading: 귀가 들을 수 있는 한도 내에서만 계시가 주어진다는 뜻으로 옮겼습니다.
  alternative_readings:
  - 단순히 ‘들을 것’이라는 예고로만 읽기
  - ‘귀가 허락하는 만큼’처럼 완곡하게 처리하기
  rationale: 원문은 단순한 청취 예고가 아니라 ‘청각의 수용 한계’라는 제한을 강조하므로, 그 긴장을 살리는 번역을 택했습니다.
  doctrine_reference: 계시의 점진성과 인간 인식의 제한
