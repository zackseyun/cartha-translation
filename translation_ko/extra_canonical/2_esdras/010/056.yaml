review_pass:
  verdict: revise
  source_fidelity: 라틴어의 시간 순서(Et post haec), 미래 동사(audies), 그리고 청각의 수용 한계(quantum capit auditus aurium tuarum)를 대체로 반영했습니다. 다만 haec는 복수 지시어이므로 ‘이 일들이 있은 뒤’가 더 충실하며, capit는 단순히 귀가 소리를 듣는 행위보다 ‘감당하다/수용하다’의 한계를 나타냅니다.
  naturalness: ‘당신의 귀가 들을 수 있는 만큼 들을 것입니다’는 ‘귀가 듣다’와 ‘듣다’가 연속되어 다소 어색합니다. 한국어 성서 문체에서는 직접 청자에 ‘당신’보다 ‘네’를 쓰는 편이 자연스럽고, 문장 종결은 합쇼체를 유지할 수 있습니다.
  terminology: 특별한 신학 용어는 없습니다. ‘감당할 수 있는 만큼’은 원문의 수용 능력이라는 비유적 표현을 과도하게 해석하지 않고 재현합니다.
  issues:
  - severity: low
    issue: ‘이 일’이 원문의 복수 지시어 haec를 단수화합니다.
    rationale: 한국어에서 집합적으로 단수 처리할 수는 있으나, ‘이 일들이 있은 뒤에는’이 원문의 지시 범위와 시간적 완료를 더 분명히 합니다.
  - severity: medium
    issue: ‘당신의 귀가 들을 수 있는 만큼’은 한국어상 반복적이고 capio의 ‘수용·감당’ 뉘앙스가 약합니다.
    rationale: ‘네 귀가 감당할 수 있는 만큼’은 청각 능력의 한계를 자연스럽게 표현하면서 원문의 비유를 보존합니다.
  revised_text: 그리고 이 일들이 있은 뒤에는 네 귀가 감당할 수 있는 만큼 들을 것입니다.
