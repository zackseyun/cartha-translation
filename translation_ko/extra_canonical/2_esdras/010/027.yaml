  to: '그런데 보니, 그 여자는 더 이상 제게 보이지 않았습니다. 그러나 한 성읍이 건축되고 있었고, 큰 기초를 갖춘 한 장소가[a] 드러나고 있었습니다. 그때 저는 두려워하여 큰 소리로 외치며 말했습니다:'
  rationale: 서술적 ecce는 ‘그런데 보니’로 자연화하되 주의 환기와 환상 전환을 유지했습니다. ‘큰 기초를 갖춘 한 장소’는 최근 영어 감사 기록이 채택한 성격 수식 해석을 따릅니다. 각주는 그와 구별되는 전치사 de의 가능한 출처적 해석을, 원문의 복수형까지 반영하여 해당 구절에 직접 연결했습니다. 마지막 절은 두려움과 외침의 병렬을 더 충실히 살렸습니다.
