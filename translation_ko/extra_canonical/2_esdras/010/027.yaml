  source_fidelity: 라틴어의 진행 수동태(aedificabatur, demonstrabatur)와 장면 전환은 대체로 충실히 반영했습니다. 다만 et timui et clamavi의 병렬된 두 동작을 ‘두려워서 … 외치며’로 종속 관계화한 점은 다소 약화합니다. 또한 대안 번역 각주는 원문의 복수형 fundamentis와 ‘~로부터’라는 가능한 해석을 더 정확히 밝혀야 합니다.
  naturalness: ‘보십시오’는 서술 속 ecce에 비해 독자에게 직접 명령하는 듯하여 다소 부자연스럽습니다. ‘그런데 보니’가 현대 한국어 서술에서 환상 장면의 주의 환기를 자연스럽게 전달합니다. ‘한 곳’보다 ‘한 장소’가 locus에 더 분명하며, ‘큰 기초를 갖춘’도 자연스럽습니다.
  terminology: civitas를 ‘성읍’으로 옮긴 것은 문맥과 성경적 문체에 적절합니다. locus는 ‘장소’로, de fundamentis magnis의 주된 성격/수식 이해는 ‘큰 기초를 갖춘’으로 유지하되, 논쟁 가능한 출처적 이해는 각주에 보존했습니다.
