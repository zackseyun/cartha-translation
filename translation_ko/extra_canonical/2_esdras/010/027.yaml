base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/027.yaml
  text: And behold[a], the woman no longer appeared to me, but a city was being built, and a place with great foundations was being revealed. Then I was afraid and cried out with a loud voice and said,
  footnotes:
  - marker: a
    text: Or 'and a place was being revealed from great foundations.'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 그 여자는 더 이상 제게 보이지 않았습니다. 그러나 한 성읍이 건축되고 있었고, 큰 기초를 가진 한 곳이 드러나고 있었습니다. 그러자 저는 두려워서 큰 소리로 외치며 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 기초에서 한 곳이 드러나고 있었다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ecce
  english_pob_choice: And behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오, 보라
  lexicon: ecce
  rationale: 시각적 전환과 주의 환기를 살리되, 현대 한국어에서 자연스럽고 공손한 감탄·지시 표현으로 옮겼습니다.
- source_word: mulier non conparebat mihi
  english_pob_choice: the woman no longer appeared to me
  chosen_korean: 그 여자는 더 이상 제게 보이지 않았습니다
  alternatives_korean:
  - 그 여자가 더 이상 제게 나타나지 않았습니다
  - 그 여인은 더 이상 제 앞에 나타나지 않았습니다
  lexicon: mulier / conparebat
  rationale: mulier를 단순히 ‘여인’으로 미화하지 않고 직역적 ‘여자’로 유지했고, conparebat의 ‘더 이상 보이지 않다’는 소멸된 지각 상태를 자연스럽게 살렸습니다.
- source_word: civitas aedificabatur
  english_pob_choice: a city was being built
  chosen_korean: 한 성읍이 건축되고 있었고
  alternatives_korean:
  - 한 도시가 세워지고 있었고
  - 한 성읍이 지어지고 있었고
  lexicon: civitas / aedificabatur
  rationale: civitas를 단순한 현대적 ‘도시’보다 서사적·성경적 울림이 있는 ‘성읍’으로 번역하되, 진행 중인 수동태를 유지했습니다.
- source_word: locus demonstrabatur de fundamentis magnis
  english_pob_choice: a place with great foundations was being revealed
  chosen_korean: 큰 기초를 가진 한 곳이 드러나고 있었습니다
  alternatives_korean:
  - 큰 기초를 지닌 한 장소가 드러나고 있었습니다
  - 큰 기초에서 한 곳이 드러나고 있었습니다
  lexicon: locus / de fundamentis magnis
  rationale: Bensly 계열 영어 수정처럼 de fundamentis magnis을 출처가 아니라 성격 수식으로 이해하여 ‘큰 기초를 가진’으로 옮겼습니다.
- source_word: et timui et clamavi voce magna
  english_pob_choice: Then I was afraid and cried out with a loud voice
  chosen_korean: 그러자 저는 두려워서 큰 소리로 외치며
  alternatives_korean:
  - 그러자 저는 두려워서 큰 소리로 부르짖으며
  - 그때 저는 두려워서 큰 소리로 외치며
  lexicon: timui / clamavi voce magna
  rationale: 원문의 두 동사를 연결해 두려움의 반응과 소리의 크기를 간결하게 살렸고, ‘voice magna’는 관용적으로 ‘큰 소리로’로 처리했습니다.
theological_decisions:
- issue: 환상 속 대상의 교체와 공개
  chosen_reading: 여자가 보이지 않게 된 뒤 성읍과 큰 기초를 가진 장소가 드러나는 환상적 전환을 그대로 유지했습니다.
  alternative_readings:
  - 상징을 풀어 설명하는 번역
  - ‘성읍’을 ‘도시’로 평면화하는 번역
  rationale: 이 절은 해석보다 장면 전환 자체가 중요하므로, 환상의 급격한 대조를 약화시키지 않도록 원문의 시각적 흐름을 보존했습니다.
  doctrine_reference: 4 Ezra의 묵시 문학적 서술 관례
