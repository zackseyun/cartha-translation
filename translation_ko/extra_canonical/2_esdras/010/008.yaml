  text: humiliata est, lugete ualidissime. Et nunc quoniam omnes lugemus, et tristes estis, quoniam omnes contristati sumus, tu
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/008.yaml
  text: She has been humbled; mourn most bitterly. And now[a], since we all mourn and are sad, since we are all grieved—but you
  footnotes:
  - marker: a
    text: Or 'Therefore mourn with all your might. And now, since we all mourn and you are sorrowful, because we are all grieved, why are you grieved over one son?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀는 낮아졌습니다. 몹시 애도하십시오. 이제 우리 모두가 애도하고 슬퍼하며, 우리 모두가 마음 아파하니—그런데 당신은[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그러므로 온 힘을 다해 애도하십시오. 이제 우리 모두가 애도하고 당신이 슬퍼하니, 우리 모두가 마음 아파하므로, 어찌하여 한 아들을 두고 슬퍼하십니까?’
    reason: 이전 번역의 확장된 대안 독법입니다.
lexical_decisions:
- source_word: humiliata est
  english_pob_choice: She has been humbled
  chosen_korean: 그녀는 낮아졌습니다
  alternatives_korean:
  - 그녀는 겸손해졌습니다
  - 그녀는 굴욕을 당했습니다
  lexicon: humiliata est
  rationale: 수동 완료형의 상태 변화를 살리면서도, 문맥상 인격적 겸손보다 시온/예루살렘의 낮아짐을 가리키는 표현으로 자연스럽게 옮겼습니다.
- source_word: lugete ualidissime
  english_pob_choice: mourn most bitterly
  chosen_korean: 가장 심하게 애도하십시오
  alternatives_korean:
  - 몹시 슬퍼하십시오
  - 극도로 애통해하십시오
  lexicon: lugete / ualidissime
  rationale: 명령법과 강한 강조를 함께 살려, 단순한 슬픔보다 애도 행위를 매우 강하게 촉구하는 한국어로 옮겼습니다.
- source_word: tristes sumus
  english_pob_choice: we are sad
  chosen_korean: 슬퍼하며
  alternatives_korean:
  - 근심하며
  - 마음이 아프며
  lexicon: tristes sumus
  rationale: 공동체의 현재 상태를 나타내므로 서술형 연쇄 안에서 자연스럽게 '슬퍼하며'로 처리했습니다.
- source_word: contristati sumus
  english_pob_choice: we are grieved
  chosen_korean: 마음 아파하니
  alternatives_korean:
  - 괴로워하니
  - 큰 슬픔에 잠기니
  lexicon: contristati sumus
  rationale: 반복되는 '우리가' 구조를 유지하되, 앞의 '슬퍼하며'와 구별되는 더 깊은 내적 고통을 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 문장의 절단된 종결부
  chosen_reading: 마지막의 'but you'를 그대로 살려 문장이 미완으로 끝나게 했습니다.
  alternative_readings:
  - '''그런데 당신은 왜…''처럼 보완하기'
  - 문장을 매끄럽게 완결하기
  rationale: 제공된 라틴어와 영어 POB가 모두 절단된 형태를 보존하므로, 해석을 보태어 완결시키지 않고 원문의 긴장과 미완성을 유지했습니다.
  doctrine_reference: source fidelity / textual criticism
