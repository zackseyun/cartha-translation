  chosen_reading: 마지막의 'but you'를 그대로 살려 문장이 미완으로 끝나게 했습니다.
  alternative_readings:
  - '''그런데 당신은 왜…''처럼 보완하기'
  - 문장을 매끄럽게 완결하기
  rationale: 제공된 라틴어와 영어 POB가 모두 절단된 형태를 보존하므로, 해석을 보태어 완결시키지 않고 원문의 긴장과 미완성을 유지했습니다.
  doctrine_reference: source fidelity / textual criticism
