revisions:
- from: 사람이 지은 어떤 건축물도 지탱할 수 없었을 것입니다. 왜냐하면 지극히 높으신 이의 도시가 드러나기 시작한 곳이었기 때문입니다.[a]
  to: 지극히 높으신 분의 도성이 드러나기 시작하던 곳에서는 사람이 지은 어떤 건축물도 버텨 낼 수 없었을 것입니다.
  rationale: ‘지탱하다’를 자동사적으로 자연스러운 ‘버텨 내다’로 바꾸어 sustinere의 문맥상 뜻을 살렸습니다. 또한 장소를 나타내는 ‘그곳에서는’을 문장 구조에 반영하고, 신적 칭호와 도성의 환상적 성격을 유지했습니다. 문체 설명만 담긴 각주는 삭제했습니다.
