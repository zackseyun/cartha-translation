  yaml_path: translation/extra_canonical/2_esdras/010/054.yaml
  text: For no work of human building could endure in the place where the city of the Most High was beginning to be shown.
translation:
  language: ko
  text: 지극히 높으신 분의 도성이 드러나기 시작하던 곳에서는 사람이 지은 어떤 건축물도 버텨 낼 수 없었을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: opus aedificii hominis
  english_pob_choice: human building
  chosen_korean: 사람이 지은 어떤 건축물
  alternatives_korean:
  - 인간의 건축물
  - 사람 손으로 지은 건축물
  lexicon: opus aedificii / aedificium
  rationale: 영어 POB의 "human building"을 따라, 소유격보다 자연스러운 한국어로 ‘사람이 지은’ 구조를 써서 ‘인간의 건축물’의 다소 딱딱한 느낌을 줄였습니다.
- source_word: sustinere
  english_pob_choice: could endure
  chosen_korean: 지탱할 수 없었을 것입니다
  alternatives_korean:
  - 버틸 수 없었을 것입니다
  - 견딜 수 없었을 것입니다
  lexicon: sustinere
  rationale: 단순히 ‘서다’보다 구조물이 무게를 받쳐 유지하지 못한다는 뜻을 살려 ‘지탱하다’로 옮겼습니다.
- source_word: altissimi ciuitas
  english_pob_choice: the city of the Most High
  chosen_korean: 지극히 높으신 이의 도시
  alternatives_korean:
  - 가장 높으신 분의 도시
  - 지극히 높으신 하나님의 도시
  lexicon: altissimus / ciuitas
  rationale: 라틴어 속 소유 관계를 유지하면서도, 본문이 직접 ‘하나님’보다 칭호를 강조하므로 ‘지극히 높으신 이’로 옮겼습니다.
- source_word: incipiebat ostendi
  english_pob_choice: was beginning to be shown
  chosen_korean: 드러나기 시작한
  alternatives_korean:
  - 보이기 시작한
  - 나타나기 시작한
  lexicon: incipere / ostendi
  rationale: 도시가 단순히 시야에 들어오는 것보다 점진적으로 계시·현시되는 뉘앙스를 살려 ‘드러나기 시작한’으로 번역했습니다.
theological_decisions:
- issue: 지극히 높으신 이(altissimi)의 신학적 호칭 처리
  chosen_reading: 직역된 칭호로 유지하고 본문에서 ‘하나님’으로 치환하지 않았습니다.
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  rationale: 라틴어 본문은 소유격 칭호를 사용하며, 이 절은 계시의 장면을 묘사하므로 호칭의 직접성을 보존하는 편이 더 स्रोत-가깝습니다.
  doctrine_reference: 성서 번역의 호칭 보존과 본문 내 수사 기능
