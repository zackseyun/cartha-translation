  source_fidelity: 라틴어의 여성 단수 수동태(resignata est, tradita est)는 시온을 가리키므로, 시온을 여성으로 의인화하여 이어 가는 것은 적절합니다. 다만 초안의 ‘풀려나 있었고’는 라틴어 완료 수동태를 부자연스럽게 과거완료 상태로 만들며, 무엇에서 ‘풀려나는지’도 불명확합니다. ‘봉인이 풀렸고’로 고쳐 signaculum/resignata의 연결된 봉인 이미지를 더 분명히 보존합니다.
  naturalness: ‘도장’도 가능하지만, 상징적·공적 표식이라는 문맥에서는 ‘인장’이 현대 문어체 성경 한국어에서 더 자연스럽고 정확합니다. 또한 ‘가장 큰 것은, 시온의 도장입니다’보다 쉼표를 제거하여 문장 결속을 개선합니다.
  terminology: ‘시온’, ‘영광’, ‘손에 넘겨지다’는 적절합니다. ‘인장’은 signaculum의 물리적·상징적 의미를 보존하며, 난해성은 각주에서 설명합니다.
  issues:
