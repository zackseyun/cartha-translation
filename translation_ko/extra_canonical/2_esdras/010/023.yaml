theological_decisions:
- issue: 시온의 성별화된 의인화
  chosen_reading: 시온을 여성 대명사로 이어서 번역했습니다.
  alternative_readings:
  - 중성적 지시어로 처리하기
  - 명시적 대명사를 생략하기
  rationale: 라틴어 동사형이 여성 단수로 시온을 지시하므로, POB의 ‘she’를 반영해 의인화를 유지했습니다. 이는 문법적 일치와 문맥상의 인격적 상실감을 살립니다.
  doctrine_reference: 문법-본문 상응
- issue: ‘도장/인장’ 이미지 보존
  chosen_reading: seal을 설명적으로 풀지 않고 표식 이미지로 유지했습니다.
  alternative_readings:
  - ‘표징’으로 완화하기
  - ‘증표’로 일반화하기
  rationale: 영어 POB가 지적한 대로 이 표현은 난해하지만, 시온의 독특한 영광과 인증된 상태를 암시하는 상징을 보존하는 것이 본문 충실도에 유리합니다.
  doctrine_reference: 본문 이미지 보존
