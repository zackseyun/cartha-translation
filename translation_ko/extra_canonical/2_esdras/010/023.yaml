  to: 그리고 무엇보다도 가장 큰 것은 시온의 인장입니다—지금 시온은 자신의 영광에서 봉인이 풀렸고, 우리를 미워하는 자들의 손에 넘겨졌기 때문입니다.[a][b]
  rationale: 본문은 signaculum(인장)과 resignata(봉인이 풀리다)의 어근상 이미지를 연결하는 방식으로 보입니다. 개정문은 이를 ‘시온의 인장’ 및 ‘봉인이 풀렸고’로 보존하고, 여성 단수 동사에 따라 명시적으로 ‘시온’을 주어로 삼았습니다. 대안 번역은 영광 상실이라는 가능한 의미를 제시하되 본문의 봉인 이미지를 본문에서 제거하지 않습니다.
