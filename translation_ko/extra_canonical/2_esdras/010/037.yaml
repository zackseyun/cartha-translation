  source_fidelity: 라틴어 demonstres seruo tuo de excessu hoc의 청원 구조와 excessus의 문자적 ‘떠남/이탈’ 의미를 유지해야 합니다. 초안의 ‘제 종에게’는 2인칭 소유격 tuo를 ‘나의’로 바꾸므로 수정이 필요합니다. 끝의 et는 원문 자체가 다음 절로 이어지는 미완의 접속사이므로 한국어에서도 이를 보존했습니다.
  naturalness: ‘이제 그러니’는 중복되고, 원문에 별도의 ‘이제’에 해당하는 말도 없습니다. ‘그러므로’와 ‘당신의 종인 저’는 현대 표준어 합쇼체에서 문법적으로 자연스럽고 원문의 겸손한 호칭을 보존합니다. 절 끝의 ‘그리고’는 통상적인 한국어 문장으로는 미완이지만, 원문의 절단 상태를 충실히 반영합니다.
  terminology: excessus는 여기서 ‘환시’나 정서적으로 강한 ‘황홀경’으로 단정하지 않고 ‘떠남’으로 옮깁니다. 각주의 ‘정상 상태에서 벗어난’이라는 확대 해석은 본문 라틴어만으로 확정하기 어려우므로, 가능한 의미 범위를 절제하여 제시합니다.
