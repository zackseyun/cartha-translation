lexical_decisions:
- source_word: Nocte autem quae in crastinum
  english_pob_choice: But tomorrow night
  chosen_korean: 내일 밤에는
  alternatives_korean:
  - 그러나 내일 밤에
  - 그리고 내일 밤에는
  lexicon: nocte; in crastinum
  rationale: lat. 'Nocte... quae in crastinum'은 문자적으로는 '내일에 속하는 밤'이므로, POB의 자연스러운 수정에 맞춰 '내일 밤'으로 간결하게 옮겼습니다.
- source_word: remanebis hic
  english_pob_choice: you shall remain here
  chosen_korean: 여기 머물러 있으십시오
  alternatives_korean:
  - 여기 남아 있으십시오
  - 여기 머무르실 것입니다
  lexicon: remanere
  rationale: 단순한 존재 지속보다 '그곳에 계속 머물다'의 뜻이므로 '머물러 있으십시오'로 옮겨 명령/지시의 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 직접 명령형의 화법
  chosen_reading: 화자가 듣는 이에게 즉시 지시하는 문장이므로 공손한 명령형 '-십시오'를 사용했습니다.
  alternative_readings:
  - 서술형 '여기 머무를 것입니다'
  - 완곡한 권고형 '여기 머무르셔야 합니다'
  rationale: 라틴 원문과 POB 영어 둘 다 미래형/지시형 뉘앙스를 가지므로, 한국어에서는 전달 대상에게 직접 하는 말로 자연스럽게 처리했습니다.
  doctrine_reference: 서사적 직접화법의 문체 결정
