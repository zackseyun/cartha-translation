  source_fidelity: ‘그러나 내일 밤에는 여기 머물러 있으십시오’는 라틴어 nocte autem quae in crastinum(문맥상 ‘내일이 될 밤에’)과 이어지는 지시 내용을 자연스럽고 충실하게 전달합니다. autem의 전환은 ‘그러나’로, 시간 표현은 관용적인 ‘내일 밤’으로 잘 반영되었습니다.
  naturalness: 현대 표준 한국어 합쇼체의 직접화법으로 자연스럽습니다. ‘여기 머물러 있으십시오’는 문맥상의 지시를 분명하게 나타냅니다.
  terminology: 특별한 신학 용어·고유명사가 없으며, ‘머물러 있으십시오’는 remanere의 지속·체류 의미에 적절합니다. 각주도 본문의 자연스러운 시간 표현 뒤에 있는 직역 가능성을 적절히 안내합니다.
