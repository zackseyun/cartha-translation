    rationale: apud는 문맥과 전승 배경상 ‘앞에서/곁에서/면전에서’ 등의 폭을 지닐 수 있습니다. 본문의 ‘앞에서’를 설명하되 유일한 해석이라고 단정하지 않는 것이 안전합니다.
  revised_text: 그러나 당신은 많은 이들보다 복되시며, 지극히 높으신 분 앞에서 부름을 받으셨습니다—오직 몇몇만이 그러했듯이.[a]
