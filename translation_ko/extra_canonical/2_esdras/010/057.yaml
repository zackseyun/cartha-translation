translation:
  language: ko
  text: 그러나 당신은 많은 사람보다 더 복되며, 지극히 높으신 분 앞에서 부름을 받으셨습니다 — 이는 오직 몇몇만이 그러했기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지극히 높으신 분 앞에서’는 라틴어 apud의 위치·면전 의미를 반영한 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: beatus es prae multis
  english_pob_choice: you are blessed above many
  chosen_korean: 많은 사람보다 더 복되며
  alternatives_korean:
  - 많은 사람보다 복되며
  - 많은 이들 위에 복되며
  lexicon: beatus → 복되다 / prae multis → ~보다 더
  rationale: beatus는 단순한 감정 상태보다 ‘복됨’의 객관적 상태를 가리키므로 ‘복되다’로 옮기고, prae multis는 비교급 관계를 자연스러운 한국어로 풀어 ‘~보다 더’로 처리했습니다.
- source_word: uocatus es apud
  english_pob_choice: you have been called by the Most High
  chosen_korean: 지극히 높으신 분 앞에서 부름을 받으셨습니다
  alternatives_korean:
  - 지극히 높으신 분께 불리셨습니다
  - 지극히 높으신 분에 의해 부름을 받으셨습니다
  lexicon: uocatus es + apud → called in the presence of / before
  rationale: apud는 행위의 행위자보다 ‘~앞에서, ~의 면전에서’를 뜻하므로 ‘~앞에서’로 옮겨 호명/소명 장면의 공간성을 살렸습니다.
- source_word: apud Altissimum
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Altissimus → 가장 높으신 분
  rationale: 하나님 지칭의 존칭을 유지하되, 고정된 교회어 ‘지극히 높으신 이’보다 현대 문체에 맞는 ‘지극히 높으신 분’을 택했습니다.
theological_decisions:
- issue: uocatus es apud의 관계를 ‘by’가 아니라 ‘before/in the presence of’로 반영해야 하는가
  chosen_reading: ‘지극히 높으신 분 앞에서 부름을 받으셨습니다’로, 호출의 행위가 아니라 하나님의 면전에서의 지명/호명이라는 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘지극히 높으신 분께 불리셨습니다’
  - ‘지극히 높으신 분에 의해 부름을 받으셨습니다’
  rationale: 최신 수정본의 ‘by’보다 라틴어 apud의 기본 의미가 위치·면전이므로, 본문이 암시하는 하늘 법정적 장면을 보존하는 편이 원문 충실도에 더 적합합니다.
  doctrine_reference: 본문비평/전치사 의미론
