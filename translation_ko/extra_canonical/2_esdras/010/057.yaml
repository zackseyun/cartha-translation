  rationale: 비교를 나타내는 sicut pauci를 비교절로 바로잡아 원문에 없는 인과관계를 제거했습니다. ‘앞에서’는 라틴어 apud의 가능한 공간적·면전적 뉘앙스를 보존하며, 각주는 이 선택을 설명하되 논쟁 가능한 전치사 의미를 과도하게 단정하지 않도록 조정했습니다.
