  source_fidelity: 라틴어 iustificaveris terminum Dei는 하나님의 terminus를 ‘옳다/정당하다’고 인정하는 뜻입니다. terminus에는 ‘한계·경계’라는 기본 의미와 문맥상 ‘하나님께서 정하신 결정/정하심’이라는 의미가 함께 가능하므로, ‘판결’로 단정하기보다 더 넓은 표현으로 옮기는 것이 적절합니다. filium tuum recipies in tempore와 in mulieribus conlaudaberis는 각각 ‘정해진 때에 아들을 받다’와 ‘여인들 가운데서 칭송을 받다’로 충실히 반영됩니다.
  naturalness: ‘하나님의 판결의 정당함’은 이해 가능하지만 terminus의 의미를 사법적 판결로 좁힙니다. ‘하나님의 정하심이 옳다고’는 현대 한국어로 자연스러우면서도 문맥적 의미를 보존합니다. ‘여인들 가운데서 칭송을 받게 될 것입니다’가 ‘여자들 가운데서 찬사를 받게 될 것입니다’보다 이 문맥의 격식 있는 문체에 더 잘 맞습니다.
  terminology: ‘하나님의 정하심’은 하나님의 주권적 결정이라는 문맥을 전달하되, 법정 판결이라는 특정 해석을 강요하지 않습니다. ‘칭송’은 conlaudaberis의 공적 찬양·칭찬이라는 뜻에 적절합니다.
