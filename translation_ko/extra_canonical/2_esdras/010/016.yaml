id: 2ES.10.16
reference: 2 Esdras 10:16
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si enim iustificaveris terminum Dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/016.yaml
  text: For if you acknowledge the justice of God’s decree, you will receive your son in due time and will be praised among women.
translation:
  language: ko
  text: 만일 당신이 하나님의 판결의 정당함을 인정하면, 때가 되면 당신의 아들을 받게 되고, 여자들 가운데서 찬사를 받게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: terminum Dei는 직역하면 ‘하나님의 경계/한계’이지만, 본문 맥락에서는 하나님의 정하신 판결·결정을 가리키는 것으로 이해했습니다.
    reason: source_note
lexical_decisions:
- source_word: iustificaveris terminum Dei
  english_pob_choice: acknowledge the justice of God’s decree
  chosen_korean: 하나님의 판결의 정당함을 인정하면
  alternatives_korean:
  - 하나님의 경계를 의롭다 하면
  - 하나님의 판정을 의롭다고 하면
  - 하나님의 결정의 의로움을 인정하면
  lexicon: iustificare + terminus Dei
  rationale: iustificaveris는 단순한 ‘정당화하다’보다 여기서는 하나님의 결정/판결을 옳다고 인정하는 뜻으로 읽는 것이 POB의 ‘acknowledge the justice’에 가장 가깝습니다. terminus Dei는 문맥상 하나님의 판결/정한 선고로 이해해 ‘판결’로 옮겼습니다.
- source_word: filium tuum recipies in tempore
  english_pob_choice: you will receive your son in due time
  chosen_korean: 때가 되면 당신의 아들을 받게 되고
  alternatives_korean:
  - 정해진 때에 당신의 아들을 받게 되고
  - 때가 차면 당신의 아들을 받게 되고
  - 기한이 되면 당신의 아들을 받게 되고
  lexicon: recipies in tempore
  rationale: recipies는 ‘돌려받다/받다’의 뜻을 살려 ‘받게 되다’로 옮겼고, in tempore는 관용적으로 ‘때가 되면’으로 처리해 문맥의 지연된 회복을 자연스럽게 표현했습니다.
- source_word: in mulieribus conlaudaberis
  english_pob_choice: will be praised among women
  chosen_korean: 여자들 가운데서 찬사를 받게 될 것입니다
  alternatives_korean:
  - 여인들 가운데서 칭송을 받게 될 것입니다
  - 여자들 사이에서 찬양받게 될 것입니다
  - 여인들 가운데서 높이 평가될 것입니다
  lexicon: conlaudaberis
  rationale: conlaudaberis는 수동적 ‘칭송/찬사’를 뜻하므로 ‘찬사를 받다’로 옮겨 수동성을 유지했습니다. mulieribus는 문맥상 여성 집단을 가리켜 ‘여자들 가운데서’로 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: 하나님의 판결/경계의 의미
  chosen_reading: terminum Dei를 하나님의 판결로 이해했습니다.
  alternative_readings:
  - 하나님의 경계
  - 하나님이 정하신 한계
  - 하나님의 판정
  rationale: 라틴어 terminus는 기본적으로 ‘경계/한계’이지만, 여기서는 문맥상 하나님의 정하심을 받아들이는 태도와 연결되어 POB 영어가 ‘God’s decree’로 의역했습니다. 한국어에서는 이 의미를 드러내기 위해 ‘판결’로 옮겼습니다.
  doctrine_reference: 섭리와 하나님의 주권에 대한 문맥적 진술
- issue: 여자들 가운데서의 칭송
  chosen_reading: 공적 칭찬의 장면으로 보아 중립적 ‘여자들 가운데서 찬사를 받게 될 것입니다’로 옮겼습니다.
  alternative_readings:
  - 여인들 사이에서 칭송받게 될 것입니다
  - 여성들에게서 찬양받게 될 것입니다
  rationale: 문맥은 성적 평가라기보다 사회적 인정의 회복을 말하므로, 과도하게 관용적이거나 현대화된 표현을 피하고 집단 내 찬사를 유지했습니다.
  doctrine_reference: 문맥상 사회적 회복과 명예 회복
