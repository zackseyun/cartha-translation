  text: Or is my mind deceived, and is my soul dreaming?
translation:
  language: ko
  text: 제 마음이 속임을 당하고 있습니까, 아니면 제 영혼이 꿈을 꾸고 있습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fallitur
  english_pob_choice: is my mind deceived
  chosen_korean: 제 마음이 속고 있는 것입니까
  alternatives_korean:
  - 제 ذهن이 속임을 당하고 있는 것입니까
  - 제 생각이 착각하고 있는 것입니까
  - 제 정신이 속고 있는 것입니까
  lexicon: fallo / fallitur
  rationale: 수동형의 ‘속다’ 의미를 살리면서, 한국어에서 자연스러운 인지·판단 주체로 ‘마음’을 택해 영어 POB의 ‘mind’를 과도하게 기술적으로 만들지 않았습니다.
- source_word: anima mea
  english_pob_choice: my soul
  chosen_korean: 제 영혼이
  alternatives_korean:
  - 제 혼이
  - 제 목숨이
  - 제 영이
  lexicon: anima
  rationale: 라틴어 anima는 문맥상 내적 존재 전체를 가리키므로, 한국어에서는 가장 직접적인 대응인 ‘영혼’을 사용했습니다.
- source_word: somniatur
  english_pob_choice: is ... dreaming
  chosen_korean: 꿈꾸고 있는 것입니까
  alternatives_korean:
  - 꿈을 꾸고 있는 것입니까
  - 잠들어 있는 것입니까
  - 꿈속에 있는 것입니까
  lexicon: somnio / somniatur
  rationale: 능동적 진행을 살려 ‘꿈꾸고 있는’으로 옮겨, 단순 상태보다 현재 진행 중인 체험을 나타냈습니다.
theological_decisions:
- issue: ‘mind’와 ‘soul’의 이중 진술을 한국어에서 어떻게 분리할지
  chosen_reading: ‘마음’과 ‘영혼’을 함께 두어, 인지적 혼란과 존재론적 불확실성을 각각 드러냈습니다.
  alternative_readings:
  - 둘 다 ‘마음’으로 통합
  - 둘 다 ‘영’으로 통합
  rationale: 원문은 사고의 착오와 영혼의 꿈 상태를 병렬적으로 묻기 때문에, 한국어에서도 두 항을 구분해 긴장을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 인간 내면의 분리된 기능을 과도하게 체계화하지 않고, 원문 수사에 따라 병렬 표현을 유지하는 원칙
