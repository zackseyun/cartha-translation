translation:
  language: ko
  text: 나는 알고 있었고, 내가 알지 못하는 것을 듣습니다. 아니면 내 이해는…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 sciebam / scio의 반복을 살려 영어 POB의 'know' 반복을 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: sciebam
  english_pob_choice: For I knew
  chosen_korean: 나는 알고 있었고
  alternatives_korean:
  - 나는 알았습니다
  - 내가 알았고
  lexicon: scio
  rationale: 라틴어 과거형 sciebam을 단순 완료로 옮겨 과거의 인식 상태를 드러내되, 이어지는 반복 구조와 맞도록 자연스러운 서술형으로 처리했습니다.
- source_word: audio quae non scio
  english_pob_choice: and I hear what I do not know
  chosen_korean: 내가 알지 못하는 것을 듣습니다
  alternatives_korean:
  - 내가 알지 못하는 것을 듣고 있습니다
  - 내가 모르는 것을 듣습니다
  lexicon: audio / scio
  rationale: 영어 POB가 유지한 'know' 반복을 따라 scio 계열을 일관되게 '알지 못하다'로 옮기고, 직역보다 한국어 문장 흐름을 위해 목적어절을 명사화했습니다.
- source_word: Aut numquid sensus meus
  english_pob_choice: or is my understanding
  chosen_korean: 아니면 내 이해는…
  alternatives_korean:
  - 혹은 내 생각은…
  - 또는 내 분별은…
  lexicon: sensus
  rationale: 문장이 중단된 상태를 보존하기 위해 말줄임표로 미완결성을 살렸고, sensus는 문맥상 '이해'로 두어 인지 능력의 의미를 드러냈습니다.
theological_decisions:
- issue: 반복되는 '알다' 표현의 보존
  chosen_reading: sciebam / non scio의 반복을 한국어에서도 '알다' 계열로 유지했습니다.
  alternative_readings:
  - 앞부분을 '보았다'로 완화하는 읽기
  - 뒷부분을 '이해하다'로 바꾸는 읽기
  rationale: 라틴어 본문은 서로 다른 동사가 아니라 같은 인식 동사의 반복으로 구성되어 있어, 화자의 무지와 단절감을 강화합니다. 한국어에서도 이 반복을 살려 본문의 수사적 압력을 보존했습니다.
  doctrine_reference: source-text fidelity and rhetorical repetition
