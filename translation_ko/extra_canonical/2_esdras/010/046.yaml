  text: Three things Solomon built in the city and offered offerings; then it was that the barren woman bore a son. And what it told you, that
translation:
  language: ko
  text: 솔로몬은 성안에 세 가지를 지었고 제물을 바쳤습니다. 그러고 나서야 불임 여인이 아들을 낳았습니다. 그리고 그것이 당신에게 말한 것은,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 tres는 ‘셋’이라는 수량으로 읽어야 하며, 영어 초안의 시간 표현은 수정되었습니다.
    reason: textual_variant
lexical_decisions:
- source_word: tres
  english_pob_choice: Three things
  chosen_korean: 세 가지
  alternatives_korean:
  - 세 가지 일
  - 세 개
  lexicon: tres
  rationale: 라틴어 tres는 시간 표현이 아니라 수량 표현이므로, POB의 수정된 영어처럼 ‘세 가지’로 옮겨 오역을 피했습니다.
- source_word: aedificauit ... ciuitatem
  english_pob_choice: built in the city
  chosen_korean: 성안에 지었습니다
  alternatives_korean:
  - 도성에 지었습니다
  - 도시에 지었습니다
  lexicon: aedificare; civitas
  rationale: ciuitatem을 문맥상 ‘도시/성읍’으로 보고, 한국어에서는 자연스럽게 ‘성안’으로 풀어 원문의 장소 감각을 살렸습니다.
- source_word: sterilis
  english_pob_choice: the barren woman
  chosen_korean: 불임 여인
  alternatives_korean:
  - 아이를 낳지 못하던 여인
  - 잉태하지 못하던 여인
  lexicon: sterilis
  rationale: 직역적이면서도 현대 한국어에서 이해 가능한 표현으로 ‘불임 여인’을 택해, 수태 불능의 역설을 분명히 드러냈습니다.
- source_word: Et quod tibi dixit quoniam
  english_pob_choice: And what it told you, that
  chosen_korean: 그리고 그것이 당신에게 말한 것은,
  alternatives_korean:
  - 그리고 그것이 당신에게 말한 바는,
  - 그리고 그것이 당신에게 말한 것, 곧
  lexicon: et ... dixit quoniam
  rationale: 라틴어의 뒤따르는 인용 도입부를 한국어에서 미완성 구조로 유지하여, 본절이 다음 절로 이어지는 연결성을 보존했습니다.
theological_decisions:
- issue: ‘바쳤습니다’의 제사 언어 유지
  chosen_reading: oblationes를 일반적인 ‘제물’이 아니라 동사적으로 ‘제물을 바쳤습니다’로 옮겼습니다.
  alternative_readings:
  - 제사를 드렸습니다
  - 예물을 드렸습니다
  rationale: oblatio는 단순 선물이 아니라 제의적 봉헌을 가리키므로, 원문의 제의적 긴장을 약화시키지 않도록 ‘제물을 바쳤습니다’로 유지했습니다.
  doctrine_reference: 성전/제의 어휘의 역사적-문헌적 보존
- issue: 문장 종결을 미완성으로 둠
  chosen_reading: Et quod tibi dixit quoniam에 맞춰 끝을 쉼표로 열어 두었습니다.
  alternative_readings:
  - 그리고 그것이 당신에게 말한 것은 그가...
  - '그리고 그것이 당신에게 말한 것은:'
  rationale: 이 절은 다음 내용으로 이어지는 연결 구문이므로, 한국어에서도 종결어미로 닫지 않고 다음 절을 예비하는 형태를 택했습니다.
  doctrine_reference: 본문 연결 구조 보존
