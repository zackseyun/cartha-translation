  text: this woman whom you saw is Zion, whom you now see as a city being built.
translation:
  language: ko
  text: 이 여인은 당신이 보았던 시온입니다. 이제는 성으로 건축되고 있는 모습으로 보이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ut ciuitatem aedificatam
  english_pob_choice: as a city being built
  chosen_korean: 성으로 건축되고 있는 모습으로
  alternatives_korean:
  - 건축된 성으로
  - 건설 중인 도시로
  lexicon: aedificare
  rationale: 라틴어 현재분사적 표현을 살려 ‘건축되고 있는’으로 진행 중인 상태를 나타내고, POB의 ‘a city being built’에 맞춰 ‘성’보다 넓은 ‘도시’ 대신 문맥상 상징성을 유지하기 위해 ‘성’과 ‘건축’을 함께 사용했습니다.
- source_word: ciuitatem
  english_pob_choice: city
  chosen_korean: 성
  alternatives_korean:
  - 도시
  - 도성
  lexicon: ciuitas
  rationale: 원문과 POB는 단순 지리적 도시보다 상징적 공동체/예루살렘 이미지를 가리키므로, 한국어에서도 성경적 상징성이 살아 있는 ‘성’을 선택했습니다.
- source_word: Et quoniam dixit tibi quia sterilis
  english_pob_choice: whom you saw
  chosen_korean: 당신이 보았던
  alternatives_korean:
  - 네가 보았던
  - 네게 보여 준
  lexicon: dixit / videre
  rationale: 이 절의 핵심은 ‘여인=시온’의 동일시이므로, 과거에 본 대상임을 분명히 하는 ‘보았던’으로 옮겨 POB의 지시 대상을 자연스럽게 연결했습니다.
theological_decisions:
- issue: 시온의 상징적 동일시
  chosen_reading: ‘이 여인’이 곧 ‘시온’이라는 직유적/상징적 동일시를 그대로 살렸습니다.
  alternative_readings:
  - ‘이 여자는 시온입니다’
  - ‘이 여인은 시온을 뜻합니다’
  rationale: 원문과 POB는 해석을 덧붙이기보다 환시 속 인물의 상징적 지시를 직접 제시하므로, 동일시를 단정적으로 유지하는 번역이 가장 투명합니다.
  doctrine_reference: 예언적 환상 해석의 문맥 보존
- issue: 현재 진행형 묘사
  chosen_reading: ‘건축되고 있는’으로 현재 진행 중인 상태를 유지했습니다.
  alternative_readings:
  - ‘건축된’
  - ‘세워지는’
  rationale: 시온이 완성된 도시가 아니라 하나님의 역사 속에서 지금 세워져 가는 모습이라는 뉘앙스를 보존하기 위해 진행형을 사용했습니다.
  doctrine_reference: 종말론적 회복의 점진성
