  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum introisset filius meus in thalamo suo, cecidit et mortuus est.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/001.yaml
  text: And it happened that when my son had entered his bridal chamber, he fell down and died.
translation:
  language: ko
  text: 내 아들이 자기 신방에 들어갔을 때, 그는 넘어져 죽었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: filius meus
  english_pob_choice: my son
  chosen_korean: 내 아들
  alternatives_korean:
  - 내 아드님
  - 아들
  lexicon: Latin filius
  rationale: 직설적 소유관계를 살리되, 현대 서술체에 맞게 간결하게 옮겼습니다.
- source_word: thalamo suo
  english_pob_choice: bridal chamber
  chosen_korean: 자기 신방
  alternatives_korean:
  - 혼인방
  - 신방
  lexicon: Latin thalamus
  rationale: thalamus는 혼인 첫날의 방을 가리키므로, 전통적 혼인 맥락이 드러나는 ‘신방’을 기본으로 하고 소유대명사 의미를 살려 ‘자기’를 덧붙였습니다.
- source_word: cecidit et mortuus est
  english_pob_choice: fell down and died
  chosen_korean: 넘어져 죽었습니다
  alternatives_korean:
  - 쓰러져 죽었습니다
  - 엎어져 죽었습니다
  lexicon: Latin cadere + mori
  rationale: cecidit는 단순히 ‘떨어졌다’보다 인물의 급작스러운 붕괴를 드러내는 ‘넘어지다/쓰러지다’가 자연스러우며, mori는 과장 없이 직접적으로 ‘죽었습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘bridal chamber’의 문화적 함의
  chosen_reading: 혼인 직후의 침실을 가리키는 표현으로 이해하고 ‘신방’으로 번역했습니다.
  alternative_readings:
  - ‘결혼방’으로 풀어쓰는 방식
  - 그대로 ‘신방’을 유지하되 각주로 설명하는 방식
  rationale: 본문의 비극적 긴장점은 아들이 혼인 준비의 절정에 들어가자마자 죽었다는 점에 있으므로, 그 문화적 뉘앙스를 보존하는 번역이 적절합니다.
  doctrine_reference: source-cultural context
