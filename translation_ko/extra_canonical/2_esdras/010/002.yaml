id: 2ES.10.2
reference: 2 Esdras 10:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et evertimus omnes lumina, et surrexerunt omnes cives mei ad consolandam me, et quievi usque in alium diem usque noctem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/002.yaml
  text: Then we all put out the lamps[a], and all my fellow citizens rose up to comfort me, and I rested until the next day, until night.
  footnotes:
  - marker: a
    text: Or 'we put out all the lamps'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 우리는 모두 등불을 껐고, 내 동료 시민들은 모두 나를 위로하러 일어났으며, 나는 이튿날 밤까지 쉬었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et evertimus omnes lumina
  english_pob_choice: Then we all put out the lamps
  chosen_korean: 그때 우리는 모두 등불을 껐고
  alternatives_korean:
  - 그때 우리는 모두 모든 등불을 껐고
  - 그때 우리는 모두 등불들을 껐고
  lexicon: evertimus / lumina
  rationale: lat. evertimus는 ‘뒤엎다’보다 여기서는 등불을 ‘끄다’로 자연스럽게 옮기는 것이 적절하며, omnes는 주어 ‘우리’에 붙는 ‘모두’이므로 ‘모든 등불’로 돌리지 않았습니다.
- source_word: omnes cives mei
  english_pob_choice: all my fellow citizens
  chosen_korean: 내 동료 시민들은 모두
  alternatives_korean:
  - 내 모든 동료 시민들은
  - 나와 같은 시민들은 모두
  lexicon: cives mei
  rationale: mei는 소유의 ‘내’이며, cives는 단순한 ‘시민’보다 함께 사는 공동체의 구성원이라는 점을 살려 ‘동료 시민들’로 옮겼습니다.
- source_word: ad consolandam me
  english_pob_choice: to comfort me
  chosen_korean: 나를 위로하러
  alternatives_korean:
  - 나를 위로하기 위해
  - 나를 위로하려고
  lexicon: consolari
  rationale: 목적의 부정사구를 한국어의 부자연스러운 직역 대신 ‘-하러’로 풀어, 행위의 목적을 분명하게 유지했습니다.
- source_word: quievi
  english_pob_choice: I rested
  chosen_korean: 나는 ... 쉬었습니다
  alternatives_korean:
  - 나는 ... 잠잠했습니다
  - 나는 ... 고요했습니다
  lexicon: quiescere
  rationale: 이전 영어 수정처럼 quievi는 ‘조용했다’보다 ‘쉬었다/휴식했다’가 더 정확하므로, 상태의 평온보다 휴식을 드러내는 동사로 옮겼습니다.
theological_decisions:
- issue: 시간 표현 ‘usque in alium diem usque noctem’의 중복성과 뉘앙스
  chosen_reading: ‘다음 날까지, 곧 밤까지’로 옮겨, 하루의 경과와 그 끝의 밤이라는 중복된 시간 범위를 그대로 드러냈습니다.
  alternative_readings:
  - ‘다음 날 밤까지’
  - ‘이튿날 밤까지’
  rationale: 라틴어의 반복된 usque는 단순한 장식이 아니라 시간의 길이를 강조하므로, 이를 하나로 평탄화하지 않고 두 겹의 한계를 모두 보존했습니다.
  doctrine_reference: 서사적 시간 표지 보존 원칙
