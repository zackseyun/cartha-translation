lexical_decisions:
- source_word: lectus uisionis
  english_pob_choice: the interpretation of the vision
  chosen_korean: 환상의 해석
  alternatives_korean:
  - 환상의 의미
  - 환상에 대한 풀이
  lexicon: 해석
  rationale: 라틴어 lectus uisionis는 단순한 ‘의미’보다 환상을 설명해 푸는 뜻이 강하므로, POB 수정본의 ‘interpretation’을 따라 ‘해석’으로 옮겼습니다.
- source_word: mulier
  english_pob_choice: the woman
  chosen_korean: 그 여자
  alternatives_korean:
  - 그 여인
  - 그 여자분
  lexicon: 여자
  rationale: 원문은 단순히 ‘여자’를 가리키며, 본문이 설명적 문맥이므로 과도하게 고양된 ‘여인’보다 직역성이 있는 ‘여자’를 택했습니다.
- source_word: ante paululum
  english_pob_choice: a little while ago
  chosen_korean: 조금 전에
  alternatives_korean:
  - 얼마 전
  - 잠깐 전에
  lexicon: temporal phrase
  rationale: 짧은 직전성을 나타내는 표현으로, 자연스럽고 축약되지 않은 현대 한국어는 ‘조금 전에’가 가장 적절합니다.
- source_word: tibi apparuit
  english_pob_choice: appeared to you
  chosen_korean: 당신에게 나타난
  alternatives_korean:
  - 네게 나타난
  - 당신 앞에 나타난
  lexicon: apparere
  rationale: 라틴어 apparuit의 출현/현현 의미를 살리되, 한국어에서 자연스러운 서술로 ‘나타난’을 사용했습니다.
theological_decisions:
- issue: 문장이 중간에서 끝나는 불완전한 구문 처리
  chosen_reading: 원문이 ‘Quam’에서 끊기므로 한국어도 종결하지 않고 연결형으로 마감했습니다.
  alternative_readings:
  - 문맥 보완을 위해 완결된 문장으로 재구성
  - 생략을 암시하는 말줄임표 사용
  rationale: 이 절은 전후 문맥 없이 조각난 형태로 전승되었으므로, 내용을 보태지 않고 미완성 상태를 그대로 드러내는 것이 소스 충실성에 맞습니다.
  doctrine_reference: source fidelity / textual completeness
