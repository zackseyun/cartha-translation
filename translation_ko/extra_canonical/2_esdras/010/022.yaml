id: 2ES.10.22
reference: 2 Esdras 10:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et psalterium nostrum humiliatum est et hymnus noster conticuit et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est et arca testamenti nostri direpta est et sancta nostra contaminata sunt, et nomen quod nominatumest super nos paene profanatum est, et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt et Levitae nostri in captivitate abierunt, et virgines nostrae coinquinatae sunt et mulieres nostrae vim passae sunt, et iusti nostri rapti sunt et parvuli nostri proditisunt, et iuvenes nostri servierunt et fortes nostri invalidi facti sunt.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/022.yaml
  text: Our harp has been brought low[a], our hymn has fallen silent, our rejoicing has been dissolved, the light of our lampstand has been extinguished, the ark of our covenant has been plundered, our holy things have been defiled, and the name that was called over us has been almost profaned. Our children have suffered insult, our priests have been burned, our Levites have gone into captivity, our virgins have been defiled, our women have suffered violence, our righteous men have been carried off, our little ones have been betrayed, our young men have been enslaved[b], and our strong men have become weak.
  footnotes:
  - marker: a
    text: Or 'Our harp-song'.
    reason: previous_rendering
  - marker: b
    text: Or 'have been betrayed'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 수금은 낮아졌고[a], 우리의 찬송은 잠잠해졌으며, 우리의 기쁨은 사라졌습니다. 우리의 등잔불은 꺼졌고, 우리의 언약궤는 약탈당했으며, 우리의 거룩한 것들은 더럽혀졌고, 우리 위에 불린 그 이름은 거의 모독을 당했습니다. 우리의 자녀는 모욕을 당했고, 우리의 제사장들은 불타 죽었으며, 우리의 레위 사람들은 포로로 잡혀갔습니다. 우리의 처녀들은 더럽혀졌고, 우리의 여인들은 폭력을 당했으며, 우리의 의인들은 끌려가고, 우리의 어린 것들은 넘겨졌습니다[b]. 우리의 청년들은 종이 되었고, 우리의 강한 사람들은 약해졌습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리의 찬미가’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘배반당했습니다’.
    reason: lexical_alternative
lexical_decisions:
- source_word: psalterium
  english_pob_choice: Our harp
  chosen_korean: 우리의 수금
  alternatives_korean:
  - 우리의 하프
  - 우리의 거문고
  - 우리의 비파
  lexicon: psalterium
  rationale: 라틴어 psalterium은 노래가 아니라 현악기 자체를 가리키므로, 영어 POB의 'Our harp'을 따라 한국어도 악기명으로 옮겼습니다. ‘수금’은 문맥상 시적·성경적 어감과 함께 현악기 의미를 안정적으로 전달합니다.
- source_word: conticuit
  english_pob_choice: has fallen silent
  chosen_korean: 잠잠해졌으며
  alternatives_korean:
  - 침묵했습니다
  - 소리 내지 않게 되었습니다
  - 멈추었습니다
  lexicon: conticesco
  rationale: 찬양의 소리가 그쳐 더 이상 들리지 않는 상태를 자연스럽게 나타내기 위해, 단순히 ‘멈추다’보다 ‘잠잠해지다’를 택했습니다.
- source_word: proditi sunt
  english_pob_choice: have been betrayed
  chosen_korean: 넘겨졌습니다
  alternatives_korean:
  - 배신당했습니다
  - 넘겨졌습니다
  - 내버려졌습니다
  lexicon: prodo
  rationale: 이 구절은 포위 상황에서 ‘배반’보다 ‘넘겨주다/넘겨지다’의 함의가 강하므로, 본문에서는 더 직접적인 상황 의미를 살려 ‘넘겨졌습니다’로 옮기고, 영어 POB의 ‘betrayed’에 해당하는 긴장감은 주석으로만 유지했습니다.
- source_word: servierunt
  english_pob_choice: have been enslaved
  chosen_korean: 종이 되었고
  alternatives_korean:
  - 노예가 되었고
  - 강제로 섬기게 되었고
  - 예속되었고
  lexicon: servio
  rationale: 라틴어 servire는 단순 고용노동보다 강제적 예속 상태를 가리킬 수 있으므로, 본문에서는 고정된 신분 종속을 드러내는 ‘종이 되다’를 택했습니다. 영어 POB의 ‘enslaved’와도 의미가 맞닿습니다.
- source_word: nomen quod nominatum est super nos
  english_pob_choice: the name that was called over us
  chosen_korean: 우리 위에 불린 그 이름
  alternatives_korean:
  - 우리 위에 불려진 그 이름
  - 우리에게 붙여진 그 이름
  - 우리 위에 놓인 그 이름
  lexicon: nomen super
  rationale: ‘이름이 위에 불리다’는 소속·귀속을 나타내는 셈어적 표현을 직역에 가깝게 살려, 전통적 신학어인 ‘이름이 우리에게 붙었다’로 완화하지 않았습니다.
theological_decisions:
- issue: 공동체 애가의 누적 열거 방식
  chosen_reading: 각 항목을 거의 동일한 종결로 이어서, 무너진 예배·정체성·안전이 한꺼번에 붕괴된 비가의 누적 효과를 살렸습니다.
  alternative_readings:
  - 문장들을 더 짧게 끊어 현대 산문처럼 정리하기
  - 일부 항목을 묶어 압축하기
  rationale: 원문은 반복 접속사와 병렬 구조로 상실의 총체성을 강조하므로, 한국어도 그 리듬을 보존하는 편이 본문 의도를 더 정확히 드러냅니다.
  doctrine_reference: 애가적 수사와 병렬 구조 보존
- issue: ‘우리 위에 불린 이름’의 귀속 의미
  chosen_reading: ‘우리 위에 불린 그 이름’을 유지해 공동체가 어떤 이름 아래 속해 있었는지 암시했습니다.
  alternative_readings:
  - 하나님 이름이 우리에게 임했다
  - 우리에게 주어진 이름
  rationale: 본문은 특정 이름을 설명하지 않으면서도 그 이름의 소속 효과를 말하므로, 추가 해석을 넣지 않고 문법적 긴장을 유지하는 것이 더 원문적입니다.
  doctrine_reference: 이름-소속 표지의 세미틱 표현
