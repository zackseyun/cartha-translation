  - severity: low
    issue: 각주가 한국어 본문에서 의미 있는 대안을 제공하지 못함
    rationale: 영어 각주는 now의 수식 범위 차이를 표시하지만, 초안의 한국어 각주 문구는 본문 첫 절과 실질적으로 동일하며 해당 모호성을 재현하지도 않습니다. 삭제하는 편이 적절합니다.
