- from: 이제는 더 이상 여자의 모습이 보이지 않고, 당신에게는 세워지고 있는 도시가 보입니다. 그리고 그 여자가 자기 아들의 불행에 대해 당신에게 말한 것은, 이것이 그 해석입니다:[a]
  to: '당신은 더 이상 여자의 모습을 보지 않지만, 세워지고 있는 도시가 당신에게 나타났습니다. 또 그 여자가 자기 아들의 불행을 당신에게 이야기한 일에 대한 해석은 이것입니다:'
  rationale: 완료형 apparuit를 ‘나타났습니다’로 바로 옮겨 원문의 시제와 출현 의미를 회복했습니다. ‘이제는’은 라틴어에 명시된 시간 부사가 아니므로 제거했고, 이에 따라 한국어에서 기능하지 않는 이전 번역 관련 각주도 삭제했습니다. 나머지 표현은 원문의 해석 도입 문구와 콜론을 보존했습니다.
