id: 2ES.10.42
reference: 2 Esdras 10:42
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'non speciem mulieris uides, sed apparuit tibi ciuitas aedificari; Et quoniam enarrabat tibi de casu filii sui, haec absolutio est:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/042.yaml
  text: 'Now you no longer see the form of a woman[a], but a city appeared to you being built. And as for her telling you about the misfortune of her son, this is the interpretation:'
  footnotes:
  - marker: a
    text: Or 'now you no longer see the form of a woman, but a city appeared to you being built.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제는 더 이상 여자의 모습이 보이지 않고, 당신에게는 세워지고 있는 도시가 보입니다. 그리고 그 여자가 자기 아들의 불행에 대해 당신에게 말한 것은, 이것이 그 해석입니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이제는 더 이상 여자의 모습이 보이지 않고, 당신에게는 세워지고 있는 도시가 보입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: non speciem mulieris uides
  english_pob_choice: Now you no longer see the form of a woman
  chosen_korean: 이제는 더 이상 여자의 모습이 보이지 않고
  alternatives_korean:
  - 이제는 더 이상 여자의 형체가 보이지 않고
  - 이제는 더 이상 여자의 모습을 보지 않으며
  lexicon: mulieris → 여자; speciem → 모습
  rationale: 문자적 의미를 살리되 한국어에서 자연스러운 시각적 표현인 ‘모습’으로 옮겼습니다. ‘형체’도 가능하지만 더 거칠고 추상적입니다.
- source_word: sed apparuit tibi ciuitas aedificari
  english_pob_choice: but a city appeared to you being built
  chosen_korean: 당신에게는 세워지고 있는 도시가 보입니다
  alternatives_korean:
  - 그러나 당신에게 도시가 건축되는 모습이 나타났습니다
  - 하지만 당신에게는 건설 중인 도시가 보였습니다
  lexicon: ciuitas → 도시; aedificari → 세워지고 있는
  rationale: ‘aedificari’의 수동 부정과 진행성을 살려 ‘세워지고 있는’으로 옮겼습니다. ‘도시’는 본문이 말하는 상징적 대상의 외형을 그대로 유지합니다.
- source_word: Enarrabat tibi de casu filii sui
  english_pob_choice: And as for her telling you about the misfortune of her son
  chosen_korean: 그리고 그 여자가 자기 아들의 불행에 대해 당신에게 말한 것은
  alternatives_korean:
  - 그리고 그녀가 자기 아들의 몰락에 대해 당신에게 말한 것은
  - 그리고 그 여자가 아들의 재난을 당신에게 이야기한 것은
  lexicon: casus → 불행/재난; filii sui → 자기 아들
  rationale: ‘casus’는 단순 사고보다 파국적 불운을 가리키므로 ‘불행’으로 옮겼습니다. 소유 대명사 ‘sui’는 문맥상 분명한 ‘자기’로 처리했습니다.
- source_word: haec absolutio est
  english_pob_choice: this is the interpretation
  chosen_korean: 이것이 그 해석입니다
  alternatives_korean:
  - 이것이 그 풀이입니다
  - 이것이 그 해명이옵니다
  lexicon: absolutio → 해석/풀이
  rationale: 문맥상 상징적 환상을 풀어 주는 결론이므로 ‘해석’이 가장 직관적입니다. ‘풀이’도 가능하지만 본문 전체의 설명문체에는 ‘해석’이 더 적합합니다.
theological_decisions:
- issue: 환상 해석의 결론부가 단순 서술이 아니라 설명적 판정문으로 제시됨
  chosen_reading: 마지막 절반을 ‘이것이 그 해석입니다’로 옮겨, 환상 이미지의 의미를 풀어 주는 해석 공식임을 드러냈습니다.
  alternative_readings:
  - 이것이 그 풀이입니다
  - 이것이 그 뜻입니다
  rationale: 라틴어 absolutio는 단순한 사전적 ‘해석’보다, 상징을 해명하는 종결 문구의 기능이 강합니다. 따라서 본문이 지닌 설명적 권위를 살리기 위해 판정형 문장을 유지했습니다.
  doctrine_reference: 문학적/해석학적 판단
