language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam ex animo contristatus es, et quoniam ex toto corde pateris pro ea, ostendit tibi claritatem gloriae eius et pulchritudinem decoris eius. Propterea enim dixi tibi ut maneres in
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/050.yaml
  text: For because you were grieved from your soul, and because you suffer for her from your whole heart, he showed you the splendor of her glory and the beauty of her majesty. Therefore I told you to remain in
translation:
  language: ko
  text: 이는 네가 마음 깊이 슬퍼하였고, 온 마음으로 그녀를 위해 고통받고 있기 때문입니다. 그는 너에게 그녀의 영광의 찬란함과 그녀의 위엄 있는 아름다움을 보여 주었습니다. 그러므로 내가 너에게 … 안에 머물러 있으라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘그녀’는 시온/예루살렘을 가리키는 여성화된 표지입니다. 본 절의 라틴어 본문은 ‘… 안에 머물러 있으라’는 구문 도중에 끝납니다.
    reason: cultural_note; textual_note
lexical_decisions:
- source_word: ex animo contristatus es
  english_pob_choice: you were grieved from your soul
  chosen_korean: 마음 깊이 근심하였고
  alternatives_korean:
  - 영혼에서부터 슬퍼하였고
  - 마음으로부터 슬퍼하였고
  lexicon: animo, contristatus
  rationale: ex animo는 단순 감정이 아니라 내면 깊은 곳에서 우러난 슬픔이므로, 현대 한국어에서 자연스럽고 강한 표현인 ‘마음 깊이 근심하였고’로 옮겼습니다.
- source_word: ex toto corde pateris pro ea
  english_pob_choice: you suffer for her from your whole heart
  chosen_korean: 온 마음으로 그녀를 위해 고통받았기 때문입니다
  alternatives_korean:
  - 온 마음으로 그녀를 위해 아파했기 때문입니다
  - 전심으로 그녀 때문에 괴로워했기 때문입니다
  lexicon: ex toto corde, pateris, pro ea
  rationale: pro ea의 ‘그녀를 위해/그녀 때문에’는 문맥상 여인(시온/예루살렘)을 향한 애통을 가리키므로, 원문의 대상을 살려 ‘그녀를 위해’로 유지했습니다.
- source_word: claritatem gloriae eius et pulchritudinem decoris eius
  english_pob_choice: the splendor of her glory and the beauty of her majesty
  chosen_korean: 그녀의 영광의 찬란함과 그녀의 위엄의 아름다움
  alternatives_korean:
  - 그녀의 영광의 광채와 그녀의 존귀의 아름다움
  - 그녀의 영광의 빛남과 그녀의 장엄함의 아름다움
  lexicon: claritatem, gloriae, pulchritudinem, decoris
  rationale: claritas는 ‘빛남’보다 ‘찬란함/찬란한 광채’가, decor는 단순한 아름다움보다 위엄과 품위가 있는 아름다움이므로 ‘위엄의 아름다움’으로 구분해 반복을 피했습니다.
- source_word: ostendit tibi
  english_pob_choice: he showed you
  chosen_korean: 그는 너에게 보여 주었습니다
  alternatives_korean:
  - 그가 너에게 보여 주었습니다
  - 그가 너를 위해 보여 주었습니다
  lexicon: ostendit
  rationale: 직접적 시각 계시를 나타내므로 평이하게 ‘보여 주었습니다’로 옮겼고, 문맥상 지시 대상 ‘너’를 유지했습니다.
theological_decisions:
- issue: 원문의 인칭과 대상 유지
  chosen_reading: 문맥상의 여성 대상(그녀)을 그대로 유지하고, 추상화하지 않았습니다.
  alternative_readings:
  - 그것을
  - 그 도시를
  - 그 영광을
  rationale: 라틴어 대명사와 영어 POB의 ‘her’는 시온/예루살렘을 가리키는 문맥적 여성 표지를 보존하므로, 이를 일반화하면 본문의 상징적 대상이 흐려집니다.
  doctrine_reference: 문맥 보존 원칙; 예루살렘/시온 상징 읽기
- issue: ‘remain in’의 미완결 처리
  chosen_reading: 본문이 절 끝에서 끊기므로 ‘머물라고 말했습니다’로 미완결을 드러냈습니다.
  alternative_readings:
  - 머무르라고 하였습니다
  - 머물게 하였습니다
  rationale: 현재 제공된 라틴어와 영어가 모두 절이 중간에서 끝나므로, 한국어도 매끈하게 완결시키지 않고 다음 절로 이어질 열린 구조를 유지했습니다.
  doctrine_reference: 텍스트 비평/절 경계 보존
