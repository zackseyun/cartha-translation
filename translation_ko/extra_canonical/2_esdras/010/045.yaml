id: 2ES.10.45
reference: 2 Esdras 10:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fuit annis triginta, propter quod erant anni saeculo tres, quando non erat in ea adhuc oblatio oblata. Et factum est post annos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/045.yaml
  text: And as for her saying to you that she had been barren for thirty years[a][45], this is because there were three thousand years in the world when no offering had yet been offered in her.
  footnotes:
  - marker: '45'
    text: The wording behind 'three thousand years' is compressed and difficult in Latin. The interpretation follows the chapter's symbolic chronology, where the woman's thirty years correspond to a much larger epoch before offerings were made in Zion.
    reason: textual_variant
  - marker: a
    text: Or 'in the age'.
    reason: previous_rendering
translation:
  language: ko
  text: 그녀가 당신에게 자신은 삼십 년 동안 아이를 낳지 못했다고 말한 것은, 세상에[a] 아직 그녀 안에 제물이 드려지지 않았던 삼천 년의 세월이 있었기 때문입니다.[45]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시대에’.
    reason: previous_rendering
  - marker: '45'
    text: ‘삼천 년’의 바탕이 되는 라틴어 표현은 압축되어 있어 해석하기 어렵습니다. 이 번역은 이 장의 상징적 연대에 따라, 여인의 삼십 년이 시온에서 제물이 드려지기 전의 훨씬 더 긴 시대를 가리킨다고 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: fuit annis triginta
  english_pob_choice: had been barren for thirty years
  chosen_korean: 삼십 년 동안 임신하지 못했다고
  alternatives_korean:
  - 삼십 년 동안 불모였다고
  - 삼십 년 동안 아이를 낳지 못했다고
  lexicon: fuit / annis triginta
  rationale: 문맥상 여인의 상태를 가리키므로 '불모'의 의미를 살리되, 한국어에서는 자연스럽고 덜 낯선 표현인 '임신하지 못하다'로 옮겼습니다.
- source_word: saeculo tres
  english_pob_choice: three thousand years in the world
  chosen_korean: 세상이 삼천 년이나 되었기 때문입니다
  alternatives_korean:
  - 그 시대가 삼천 년이나 되었기 때문입니다
  - 그 세상이 삼천 년이나 되었기 때문입니다
  lexicon: saeculum
  rationale: 개정된 영어 주해처럼 여기서는 기술적 '시대'보다 세계의 역사적 경과를 가리키므로, '세상'과 '삼천 년'으로 옮겨 역사적 누적을 드러냈습니다.
- source_word: quando non erat in ea adhuc oblatio oblata
  english_pob_choice: when no offering had yet been offered in her
  chosen_korean: 그 안에 아직 제물이 드려지지 않은 동안
  alternatives_korean:
  - 그 안에 아직 제물이 바쳐지지 않은 때
  - 그 안에서 아직 아무 제물도 드려지지 않았을 때
  lexicon: oblatio oblata
  rationale: 반복된 제의적 표현을 한국어로 자연스럽게 풀어, '제물'과 '드려지다'로 제의 행위를 분명히 했습니다.
theological_decisions:
- issue: 사후에 주어지는 상징적 연대와 실제 역사적 연대의 긴장
  chosen_reading: '''삼십 년''과 ''삼천 년''의 비례를 그대로 살려, 여인의 개인적 불모 기간이 세계사의 긴 공백을 상징한다는 점을 드러냈습니다.'
  alternative_readings:
  - 단순히 비유적 과장으로 완화하여 옮김
  - '''시대''라는 추상어로만 처리함'
  rationale: 본문은 숫자 대비를 통해 상징적 역사 해석을 요구하므로, 수치를 약화하지 않고 유지하는 것이 의미 보존에 필요합니다.
  doctrine_reference: 상징적-묵시적 시간표현의 보존
