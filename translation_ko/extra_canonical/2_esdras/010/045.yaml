  - severity: medium
    issue: 난해한 ‘삼천 년’ 독법에 대한 본문비평/해석 각주 표지가 빠져 있습니다.
    rationale: 영어 POB 감사 기록은 라틴어 표현이 압축적이고 어렵다고 명시하며, ‘삼천 년’은 장의 상징적 연대 해석에 따른 번역입니다.
  - severity: low
    issue: 각주 a의 위치와 표현이 가리키는 말이 불명확합니다.
    rationale: ‘또는 시대 안에’는 한국어로 부자연스럽고, saeculum을 옮긴 ‘세상에’ 바로 뒤에 두어야 합니다.
