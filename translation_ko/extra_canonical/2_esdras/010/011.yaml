  text: Who then ought to mourn more, if not she who has lost so great a multitude, rather than you, who grieve for one?
translation:
  language: ko
  text: 그러므로 이제 누가 더 많이 애통해야 하겠습니까? 이렇게 큰 무리를 잃은 이 여자입니까, 아니면 한 사람 때문에 슬퍼하는 당신입니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multitudo eorum
  english_pob_choice: so great a multitude
  chosen_korean: 이렇게 큰 무리
  alternatives_korean:
  - 그토록 많은 무리
  - 엄청난 무리
  lexicon: multitudo → 무리
  rationale: 라틴어 multitudo의 집합적 의미를 살리되, POB의 ‘so great a multitude’를 자연스러운 현대 한국어로 옮겨 ‘큰 무리’로 했습니다.
- source_word: lugere
  english_pob_choice: mourn
  chosen_korean: 애통하다
  alternatives_korean:
  - 슬퍼하다
  - 통곡하다
  lexicon: lugere → 애통하다
  rationale: 단순한 슬픔보다 상실에 대한 깊은 애곡을 드러내는 동사로, 본문의 수사적 대비를 살리기에 적절합니다.
- source_word: haec quae
  english_pob_choice: she who
  chosen_korean: 이 여자
  alternatives_korean:
  - 이 여인
  - 그 여자
  lexicon: haec → 이 여자/여인
  rationale: 지시대명사 haec를 문맥상 여성 지시로 받아 자연스럽게 풀되, 본문이 대비시키는 주체를 분명히 보이도록 했습니다.
theological_decisions:
- issue: 수사적 대비의 보존
  chosen_reading: 한 사람 때문에 슬퍼하는 당신과, 큰 무리를 잃은 이 여자를 대조하는 질문형으로 유지했습니다.
  alternative_readings:
  - 직설형으로 평서화
  - ‘더 슬퍼할 자’로 완화
  rationale: 본문은 단순 정보 전달이 아니라 상실 규모에 따른 애도의 당위성을 묻는 수사적 질문이므로, 그 긴장감을 보존하는 것이 원문 의도에 가깝습니다.
  doctrine_reference: source rhetoric preservation
