id: 2ES.10.49
reference: 2 Esdras 10:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: filium luget, et tu inchoasti consolare eam de his quae contigerunt †haec erant tibi aperienda†. Et nunc uidens altissimus
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/049.yaml
  text: And behold[a], you saw her likeness, how she mourns for her son, and you began to comfort her concerning what had happened. These things had to be revealed to you.
  footnotes:
  - marker: a
    text: Or 'These things had to be opened to you.'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 당신은 그녀의 모습을 보았고, 그녀가 아들을 애도하는 것도 보았습니다. 그리고 일어난 일들에 대하여 그녀를 위로하기 시작했습니다. 이런 일들은 당신에게 드러나야 했습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이런 일들은 당신에게 열려야 했습니다.’
    reason: †로 표시된 라틴어 aperienda는 문맥상 ‘드러나다/계시되다’로 이해되지만, 문자적으로는 ‘열리다’로도 옮길 수 있습니다.
lexical_decisions:
- source_word: filium luget
  english_pob_choice: she mourns for her son
  chosen_korean: 자기 아들을 위해 슬퍼하는
  alternatives_korean:
  - 아들을 애도하는
  - 아들을 잃고 슬퍼하는
  lexicon: lugeo
  rationale: 라틴어 luget는 단순한 감정 표현이 아니라 상실을 애도하는 동사를 뜻하므로, ‘슬퍼하는’으로 자연스럽게 옮기되 대상인 ‘아들’을 분명히 했습니다.
- source_word: tu inchoasti consolare eam
  english_pob_choice: you began to comfort her
  chosen_korean: 그녀를 위로하기 시작했습니다
  alternatives_korean:
  - 그녀를 위로하기 시작하셨습니다
  - 그녀를 위로하려고 시작하셨습니다
  lexicon: inchoo / consolo
  rationale: inchoasti는 시작 동작을, consolare는 위로하는 행위를 가리키므로 두 요소를 그대로 살려 ‘위로하기 시작했습니다’로 옮겼습니다.
- source_word: de his quae contigerunt
  english_pob_choice: concerning what had happened
  chosen_korean: 일어난 일들에 관해
  alternatives_korean:
  - 발생한 일들에 대해
  - 닥친 일들에 관하여
  lexicon: contingo
  rationale: contigerunt는 사건의 발생을 가리키므로 ‘일어난 일들’이 가장 مستقیم하고 문맥에 맞습니다.
- source_word: haec erant tibi aperienda
  english_pob_choice: These things had to be revealed to you
  chosen_korean: 이 일들은 당신에게 드러나야 했습니다
  alternatives_korean:
  - 이 일들은 당신에게 열려야 했습니다
  - 이 일들은 당신에게 밝혀져야 했습니다
  lexicon: aperio
  rationale: aperienda는 문자 그대로 ‘열려야 함’이지만, 묵시문맥에서 공개·계시의 의미가 분명하므로 POB의 수정 방향에 따라 ‘드러나야 했습니다’로 옮겼습니다.
theological_decisions:
- issue: 묵시적 계시 동사 aperienda의 의미
  chosen_reading: ‘열리다’의 직역보다 ‘드러나다/계시되다’의 의미를 우선했습니다.
  alternative_readings:
  - 이 일들은 당신에게 열려야 했습니다
  - 이 일들은 당신에게 열려야 했습니다(직역 유지)
  rationale: 본문은 단순한 문 열림이 아니라 숨겨진 것이 계시되는 묵시적 맥락이므로, 독자가 계시의 의미를 즉시 이해하도록 ‘드러나야 했습니다’로 처리했습니다.
  doctrine_reference: 묵시문학의 계시어법
