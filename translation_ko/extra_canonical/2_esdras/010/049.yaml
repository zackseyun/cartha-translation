revisions:
- from: 그리고 보십시오[a]. 당신은 그녀가 자기 아들을 위해 슬퍼하는 모습을 보았고, 일어난 일들에 관해 그녀를 위로하기 시작했습니다. 이 일들은 당신에게 드러나야 했습니다.
  to: 보십시오, 당신은 그녀의 모습을 보았고, 그녀가 아들을 애도하는 것도 보았습니다. 그리고 일어난 일들에 대하여 그녀를 위로하기 시작했습니다. 이런 일들은 당신에게 드러나야 했습니다[a].
  rationale: 누락된 imaginem eius를 ‘그녀의 모습’으로 복원했습니다. luget는 ‘아들을 애도하는 것’으로, 계시 문맥의 aperienda는 ‘드러나야 했습니다’로 옮겼습니다. †가 있는 구절의 직역 가능성은 해당 표현에 연결된 각주로 보존했으며, 문체는 현대 표준 한국어 합쇼체로 다듬었습니다.
