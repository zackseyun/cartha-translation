  - severity: medium
    issue: casus의 번역
    rationale: casus는 여기서 그에게 일어난 사고·불행한 사건을 뜻합니다. ‘재앙’도 영어 감사 번역을 따를 수 있으나, 라틴어에 더 가까운 ‘사고를 당했습니다’로 조정하는 것이 안전합니다.
  - severity: low
