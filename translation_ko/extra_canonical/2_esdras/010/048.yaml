  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'nutriuit eum cum labore, haec erat habitatio Hierusalem : Et quoniam dixit tibi quod filius meus ueniens in suo thalamo mortuus esset et contigisset ei casus, haec erat quae facta est ruina Hierusalem. Et ecce uidisti similitudinem eius, quomodo'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/048.yaml
  text: And as for her saying to you[a], ‘My son, when he entered his bridal chamber, died, and disaster befell him,’ this was the ruin that came upon Jerusalem.
  footnotes:
  - marker: a
    text: Or 'that my son, when he came into his bridal chamber, died and disaster befell him,'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 그 여인이 그를 수고로 길렀다고 한 것은 예루살렘의 거처를 가리킨 것입니다. 또 그 여인이 당신에게 “내 아들이 자기 신방에 들어갔다가 죽었고 사고를 당했습니다”라고 한 것은 예루살렘에 일어난 그 붕괴를 가리킨 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Quoniam dixit tibi / saying to you
  english_pob_choice: saying to you
  chosen_korean: 당신에게 말한 것
  alternatives_korean:
  - 당신에게 말하면서
  - 당신에게 한 말
  lexicon: source_note
  rationale: 라틴어의 재귀적/설명적 도입구를 자연스럽게 풀되, 이어지는 직접화법이 명확히 드러나도록 했습니다.
- source_word: filius meus
  english_pob_choice: My son
  chosen_korean: 내 아들
  alternatives_korean:
  - 나의 아들
  - 아들이
  lexicon: source_note
  rationale: 직접 인용으로 처리해야 화자가 ‘내 아들’이라고 말하는 구조가 분명해집니다.
- source_word: ueniens in suo thalamo
  english_pob_choice: when he entered his bridal chamber
  chosen_korean: 신방에 들어갔다가
  alternatives_korean:
  - 혼인방에 들어갔다가
  - 신랑방에 들어갔다가
  lexicon: source_note
  rationale: thalamos는 결혼/신혼의 방을 가리키므로 한국어의 자연한 대응으로 ‘신방’을 택했습니다.
- source_word: ruina Hierusalem
  english_pob_choice: the ruin that came upon Jerusalem
  chosen_korean: 예루살렘에 닥친 그 붕괴
  alternatives_korean:
  - 예루살렘에 닥친 그 파멸
  - 예루살렘의 멸망
  lexicon: source_note
  rationale: ruina의 물리적·도시적 붕괴 이미지를 살리면서, 예루살렘의 역사적 심판을 완곡하게 약화하지 않도록 했습니다.
