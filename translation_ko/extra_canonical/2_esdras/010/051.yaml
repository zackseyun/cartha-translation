id: 2ES.10.51
reference: 2 Esdras 10:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: propterea enim dixi tibi, ut maneres in campo, ubi domus non est aedificata.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/051.yaml
  text: For this reason I told you to remain in the field where no house has been built[a].
  footnotes:
  - marker: a
    text: Or 'where no house had been built.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 내가 당신에게 집이 세워지지 않은 들판에 머물러 있으라고 말했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘집이 세워지지 않았던 들판에’.
    reason: 라틴어 est aedificata를 과거의 건축 행위를 배경화한 표현으로 이해할 가능성을 제시합니다. 본문은 현재의 결과 상태를 더 직접적으로 반영합니다.
lexical_decisions:
- source_word: propterea enim
  english_pob_choice: For this reason
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 이런 까닭에
  lexicon: source connective
  rationale: 원문의 인과 접속을 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: dixi tibi
  english_pob_choice: I told you
  chosen_korean: 내가 당신에게 말했습니다
  alternatives_korean:
  - 내가 너에게 말했습니다
  - 내가 당신에게 일렀습니다
  lexicon: dico
  rationale: 직접 발화의 1인칭 과거를 유지하면서, 합쇼체 서술에 맞게 옮겼습니다.
- source_word: ut maneres in campo
  english_pob_choice: to remain in the field
  chosen_korean: 들판에 머물러
  alternatives_korean:
  - 밭에 남아
  - 평야에 머물러
  lexicon: maneo / campus
  rationale: maneres의 지속적 체류를 살리고, campus는 문맥상 빈터/들판의 기본 의미를 살려 옮겼습니다.
- source_word: ubi domus non est aedificata
  english_pob_choice: where no house has been built
  chosen_korean: 집이 세워지지 않은 곳에
  alternatives_korean:
  - 집이 지어지지 않은 곳에
  - 아직 집이 세워지지 않은 곳에
  lexicon: domus / aedificata
  rationale: Latin의 현재 상태를 나타내는 표현을 반영해, ‘has been built’에 맞는 완료된 부정 상태로 옮겼습니다.
