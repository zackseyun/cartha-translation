lexical_decisions:
- source_word: propterea enim
  english_pob_choice: For this reason
  chosen_korean: 그러므로
  alternatives_korean:
  - 이 때문에
  - 이런 까닭에
  lexicon: source connective
  rationale: 원문의 인과 접속을 자연스러운 현대 한국어로 간결하게 옮겼습니다.
- source_word: dixi tibi
  english_pob_choice: I told you
