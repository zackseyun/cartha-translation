  verdict: revise
  source_fidelity: ‘꿈 같은 환상들’은 visiones somniorum(‘꿈들의/꿈에 속한 환상들’)을 ‘꿈같은, 비현실적인 환상’으로 바꾸어 의미가 달라집니다. 또한 ‘지으실 그 … 환상들’은 faciet의 목적어를 환상 자체로 한정하여, 환상이 가리키는 종말의 사건들이라는 가능한 의미를 충분히 드러내지 못합니다. 라틴어의 관계사 quae는 표면상 visiones와 일치하지만, 전승 및 영어 POB의 대안 독법은 ‘그가 이루실 일들’을 가리킬 가능성도 보존합니다.
  naturalness: ‘꿈의 환상들’은 현대 한국어에서 원문의 복합 표현을 자연스럽게 유지합니다. ‘… 이루실 일들을 보여 주는 … 환상들’은 환상과 그 내용의 관계를 분명히 하면서도 합쇼체 문체에 맞습니다.
  terminology: ‘지극히 높으신 이’, ‘마지막 날들’, ‘땅 위에 거하는 이들’은 칭호와 묵시적 표현을 적절히 유지합니다. faciet는 이 문맥에서 창조 행위인 ‘지으실’보다 종말의 일을 ‘이루실’로 옮기는 편이 적절합니다.
