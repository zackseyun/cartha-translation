translation:
  language: ko
  text: 그리고 지극히 높으신 이께서 마지막 날들에 땅 위에 거하는 이들을 위하여 이루실 일들을 보여 주는 그 꿈의 환상들을 너에게 보여 주실 것입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘지극히 높으신 이께서 마지막 날들에 땅 위에 거하는 이들을 위하여 이루실 그 꿈의 환상들’.
    reason: 라틴어 관계사 quae는 표면상 ‘환상들’과 일치하므로, 환상 자체를 그분이 이루실 것으로 연결하는 독법도 가능합니다.
lexical_decisions:
- source_word: Altissimus / the Most High
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 분
  lexicon: 하나님 칭호
  rationale: 라틴어의 칭호를 직역하되, 한국어에서는 인칭화된 경외 표현인 ‘지극히 높으신 이’를 써서 반복되는 호칭을 자연스럽게 살렸습니다.
- source_word: visiones somniorum
  english_pob_choice: dream-visions
  chosen_korean: 꿈 같은 환상들
  alternatives_korean:
  - 꿈의 환상들
  - 꿈 환상들
  lexicon: 환상/꿈 표현
  rationale: 영문 POB의 복합어를 그대로 살리기보다, 라틴어의 ‘꿈에 속한 환상’이라는 성격을 한국어로 유연하게 드러내는 표현을 택했습니다.
- source_word: faciet
  english_pob_choice: will bring about
  chosen_korean: 지으실
  alternatives_korean:
  - 행하실
  - 이루실
  - 일으키실
  lexicon: 행위 동사
  rationale: 문맥이 단순한 ‘행하다’보다 종말론적 사건을 ‘일으키고 이루는’ 의미를 포함하므로, 하나님의 주권적 산출을 드러내는 ‘지으실’로 옮겼습니다.
- source_word: his qui habitant super terram
  english_pob_choice: for those who dwell on the earth
  chosen_korean: 땅 위에 거하는 이들을 위하여
  alternatives_korean:
  - 땅에 사는 사람들을 위하여
  - 땅 위에 사는 이들을 위하여
  lexicon: 청중 표지
  rationale: 라틴어 전치사구의 수혜/귀속 방향을 유지하면서도, 묵시문맥의 상투적 표현인 ‘땅 위에 거하는 이들’을 살렸습니다.
theological_decisions:
- issue: quae의 의미를 꿈 환상 자체로 볼지, 그 환상들이 가리키는 마지막 때의 일들로 볼지
  chosen_reading: ‘지으실 그 꿈 같은 환상들’로 옮겨, 환상과 그 내용이 밀접하게 연결되도록 처리했습니다.
  alternative_readings:
  - ‘마지막 날들에 일어날 일들’
  - ‘그가 땅 위에 거하는 이들을 위해 행하실 일들’
  rationale: 라틴어 문장과 영문 POB의 최신 수정은 환상 자체와 그 환상이 드러내는 사건들을 분리하지 않고 연결합니다. 한국어도 그 긴장을 보존하되, ‘환상들’이 마지막 때의 계시임을 드러내도록 했습니다.
  doctrine_reference: 묵시 계시의 상징적-서술적 이중성
