  yaml_path: translation/extra_canonical/2_esdras/010/021.yaml
  text: For you see that our sanctuary has been laid waste, our altar has been torn down, and our temple has been destroyed.
translation:
  language: ko
  text: 보시다시피 우리의 성소는 황폐해졌고, 우리의 제단은 헐렸으며, 우리의 성전은 파괴되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sanctificatio nostra
  english_pob_choice: our sanctuary
  chosen_korean: 우리의 거룩한 곳
  alternatives_korean:
  - 우리의 성소
  - 우리의 성역
  lexicon: sanctificatio
  rationale: 라틴어 sanctificatio는 여기서 ‘거룩하게 구별된 장소’의 의미로 쓰였으므로, 제도적 용어인 ‘성소’보다 의미를 더 직접 드러내는 ‘거룩한 곳’을 택했습니다.
- source_word: deserta effecta est
  english_pob_choice: has been laid waste
  chosen_korean: 황폐해졌고
  alternatives_korean:
  - 버려졌고
  - 황무지가 되었고
  lexicon: deserta effecta est
  rationale: 파괴뿐 아니라 버려진 상태까지 포함하는 결과 상태를 살려, 폐허가 된 상황을 간결하게 나타냈습니다.
- source_word: altare nostrum demolitum est
  english_pob_choice: our altar has been torn down
  chosen_korean: 우리의 제단은 허물어졌으며
  alternatives_korean:
  - 우리의 제단은 무너졌으며
  - 우리의 제단은 철거되었으며
  lexicon: demoliri
  rationale: demolitum est는 ‘헐어 무너뜨리다’의 수동 결과이므로, 물리적 철거의 이미지를 살린 ‘허물어졌으며’를 선택했습니다.
- source_word: templum nostrum destructum est
  english_pob_choice: our temple has been destroyed
  chosen_korean: 우리의 성전은 무너졌습니다
  alternatives_korean:
  - 우리의 성전은 파괴되었습니다
  - 우리의 성전은 무너져 버렸습니다
  lexicon: destruere
  rationale: destructum est의 완결된 파괴를 자연스러운 한국어로 옮기되, 앞선 두 절과의 병렬을 유지했습니다.
theological_decisions:
- issue: 공동체의 성소/제단/성전이 모두 파괴되었다는 삼중 병렬
  chosen_reading: 한 장소만이 아니라 예배 질서 전체가 붕괴되었다는 절망을 그대로 유지했습니다.
  alternative_readings:
  - 세 개의 표현을 하나의 일반적 ‘성소 파괴’로 완화할 수 있음
  - ‘제단’과 ‘성전’을 합쳐 단순화할 수 있음
  rationale: 원문은 sanctuary, altar, temple을 구분해 나열하므로, 한국어에서도 삼중 구조를 보존해야 공동체적 재난의 강도가 살아납니다.
  doctrine_reference: source-level semantic parallelism
