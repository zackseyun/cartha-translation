- source_word: luctum nostrum et quae nobis contigerunt
  english_pob_choice: our mourning and what has happened to us
  chosen_korean: 우리의 슬픔과 우리에게 일어난 일
  alternatives_korean:
  - 우리의 애통함과 우리에게 닥친 일
  - 우리의 애도와 우리에게 생긴 일
  lexicon: 명사구
  rationale: luctum을 단순한 감정이 아니라 실제 애통/슬픔의 상태로 보고, quae nobis contigerunt의 사건성을 살려 자연스러운 한국어로 옮겼습니다.
- source_word: Sion mater nostra omnium
  english_pob_choice: Zion, the mother of us all
