  alternatives_korean:
  - 시온, 우리 모두의 어머니는
  - 시온은 우리 모두의 어머니입니다
  lexicon: 고유명사/동격구
  rationale: mater nostra omnium의 동격을 분명히 드러내기 위해 ‘우리 모두의 어머니인 시온’으로 풀어, 라틴어의 반복 강조를 유지했습니다.
- source_word: in tristitia contristatur et humilitate
  english_pob_choice: is grieving in sorrow and humiliation
  chosen_korean: 슬픔과 굴욕 속에서 슬퍼하고 있습니다
  alternatives_korean:
  - 슬픔과 수치 속에서 슬퍼하고 있습니다
  - 슬픔과 비천함 가운데 슬퍼하고 있습니다
  lexicon: 상태부사구
  rationale: in tristitia를 ‘슬픔 속에서’, humilitate를 ‘굴욕 속에서’로 대응시켜 정서적 고통과 낮아짐을 함께 보존했습니다.
theological_decisions:
- issue: 시온을 ‘우리 모두의 어머니’로 부르는 표현
  chosen_reading: 시온은 공동체를 품는 어머니로 의인화된 존재로 번역했습니다.
  alternative_readings:
  - 시온을 단순한 지명으로 처리
  - 비유성을 약화시킨 직역
  rationale: 본문의 mater nostra omnium을 그대로 살려, 포로 공동체가 시온과 맺는 언약적·모성적 유대를 드러내는 쪽을 택했습니다.
  doctrine_reference: 예루살렘/시온 의인화 전통(애가, 갈 4의 상징적 읽기와 조응 가능)
