  text: 우리의 애통과 우리에게 닥친 일을 보십시오. 우리 모두의 어머니인 시온은 슬픔과 굴욕 가운데 슬퍼하고 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uides
  english_pob_choice: see
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보아 주십시오
  lexicon: 동사/청유형
  rationale: 라틴어 2인칭 단수 현재형의 직접 호소를 현대 공손 명령형으로 옮겨, 독자에게 상황을 확인해 달라는 호소를 살렸습니다.
- source_word: luctum nostrum et quae nobis contigerunt
  english_pob_choice: our mourning and what has happened to us
  chosen_korean: 우리의 슬픔과 우리에게 일어난 일
  alternatives_korean:
  - 우리의 애통함과 우리에게 닥친 일
  - 우리의 애도와 우리에게 생긴 일
  lexicon: 명사구
  rationale: luctum을 단순한 감정이 아니라 실제 애통/슬픔의 상태로 보고, quae nobis contigerunt의 사건성을 살려 자연스러운 한국어로 옮겼습니다.
- source_word: Sion mater nostra omnium
  english_pob_choice: Zion, the mother of us all
  chosen_korean: 시온은, 우리 모두의 어머니인 시온은
  alternatives_korean:
  - 시온, 우리 모두의 어머니는
  - 시온은 우리 모두의 어머니입니다
  lexicon: 고유명사/동격구
  rationale: mater nostra omnium의 동격을 분명히 드러내기 위해 ‘우리 모두의 어머니인 시온’으로 풀어, 라틴어의 반복 강조를 유지했습니다.
- source_word: in tristitia contristatur et humilitate
  english_pob_choice: is grieving in sorrow and humiliation
  chosen_korean: 슬픔과 굴욕 속에서 슬퍼하고 있습니다
  alternatives_korean:
  - 슬픔과 수치 속에서 슬퍼하고 있습니다
  - 슬픔과 비천함 가운데 슬퍼하고 있습니다
  lexicon: 상태부사구
  rationale: in tristitia를 ‘슬픔 속에서’, humilitate를 ‘굴욕 속에서’로 대응시켜 정서적 고통과 낮아짐을 함께 보존했습니다.
theological_decisions:
- issue: 시온을 ‘우리 모두의 어머니’로 부르는 표현
  chosen_reading: 시온은 공동체를 품는 어머니로 의인화된 존재로 번역했습니다.
  alternative_readings:
  - 시온을 단순한 지명으로 처리
  - 비유성을 약화시킨 직역
  rationale: 본문의 mater nostra omnium을 그대로 살려, 포로 공동체가 시온과 맺는 언약적·모성적 유대를 드러내는 쪽을 택했습니다.
  doctrine_reference: 예루살렘/시온 의인화 전통(애가, 갈 4의 상징적 읽기와 조응 가능)
