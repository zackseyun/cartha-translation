id: 2ES.10.9
reference: 2 Esdras 10:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem contristaris in uno filio. Interroga enim terram et dicet tibi, quoniam haec est quae debeat lugere tantorum super eam
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/009.yaml
  text: But you are grieving over one son. For ask the earth[a], and it will tell you that it is she who ought to mourn for so many upon her.
  footnotes:
  - marker: a
    text: Or 'Ask the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 당신은 한 아들을 두고 슬퍼하고 계십니다. 땅에 물어보십시오[a]. 그러면 땅이, 그토록 많은 것들이 자기 위에 있으므로 슬퍼해야 할 것은 바로 땅 자신이라고 말해 줄 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅에게 물어보십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: autem contristaris in uno filio
  english_pob_choice: But you are grieving over one son.
  chosen_korean: 그러나 당신은 한 아들을 두고 슬퍼하고 계십니다.
  alternatives_korean:
  - 그런데 당신은 한 아들 때문에 슬퍼하고 계십니다.
  - 하지만 당신은 한 아들에 대해 슬퍼하고 계십니다.
  lexicon: contristaris → 슬퍼하다 / contristo; in uno filio → 한 아들을 두고
  rationale: 라틴어 현재형 감정 진술을 자연스러운 현재 진행적 표현으로 옮기되, 단순한 원인표시보다 '두고'를 써서 ‘한 아들’에 대한 애통을 살렸습니다.
- source_word: Interroga enim terram
  english_pob_choice: For ask the earth[a],
  chosen_korean: 땅에게 물어보십시오[a].
  alternatives_korean:
  - 땅을 물어보십시오.
  - 땅에 물어보십시오.
  lexicon: Interroga → 물어보다; terram → 땅
  rationale: 명령형을 공손한 요청형으로 옮기고, terram은 대상어 ‘땅’을 직접적으로 유지해 자연스러운 한국어 어순으로 재구성했습니다.
- source_word: haec est quae debeat lugere tantorum super eam
  english_pob_choice: it is she who ought to mourn for so many upon her
  chosen_korean: 땅이 자신 위에 있는 그 많은 사람 때문에 오히려 슬퍼해야 하는 것이 자기라고
  alternatives_korean:
  - 땅이 자기 위의 그 많은 사람들을 슬퍼해야 한다고
  - 그 많은 사람이 자기 위에 있으니 땅이 슬퍼해야 한다고
  lexicon: haec est quae debeat lugere → 오히려 슬퍼해야 하는 것이 자기라고; tantorum super eam → 자신 위에 있는 그 많은 사람 때문에
  rationale: 라틴어의 대조적 강조('haec est quae')를 살려 ‘오히려’와 주어 재지시를 사용했고, 'super eam'은 ‘그 위에’라는 공간적 관계를 보존했습니다.
theological_decisions:
- issue: 생명/죽음의 비유에서 땅을 의인화하는 표현
  chosen_reading: 땅이 ‘슬퍼해야 하는’ 존재로 말하는 의인화를 그대로 살렸습니다.
  alternative_readings:
  - 땅이 탄식해야 한다
  - 땅이 애도해야 한다
  rationale: 본문은 단순한 수사보다 피조세계의 반응을 의인화해 대비시키므로, 그 긴장을 약화시키지 않는 방향으로 옮겼습니다.
  doctrine_reference: 창조세계의 의인화된 탄식/애도 표현 보존
