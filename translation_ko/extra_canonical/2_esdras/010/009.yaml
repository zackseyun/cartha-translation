- from: 그러나 당신은 한 아들을 두고 슬퍼하고 계십니다. 땅에게 물어보십시오[a]. 그러면 땅이 자신 위에 있는 그 많은 사람 때문에 오히려 슬퍼해야 하는 것이 자기라고 말해 줄 것입니다.
  to: 그러나 당신은 한 아들을 두고 슬퍼하고 계십니다. 땅에 물어보십시오[a]. 그러면 땅이, 그토록 많은 것들이 자기 위에 있으므로 슬퍼해야 할 것은 바로 땅 자신이라고 말해 줄 것입니다.
  rationale: 원문에 없는 ‘사람’이라는 한정을 제거하여 ‘tantorum’의 모호성을 보존하고, 땅의 의인화 및 ‘바로 땅’이라는 강조를 자연스러운 한국어로 재구성했습니다. ‘enim’의 논리적 연결은 앞선 진술 뒤의 권고 흐름으로 유지했습니다.
