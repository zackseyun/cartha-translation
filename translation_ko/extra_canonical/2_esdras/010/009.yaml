review_pass:
  verdict: revise
  source_fidelity: ‘tantorum super eam’에는 ‘사람’이라는 명시적 명사가 없으므로, ‘그 많은 사람’은 원문의 범위를 부당하게 좁힙니다. 또한 ‘haec est quae debeat lugere’의 강조는 ‘슬퍼해야 할 것은 바로 땅 자신’으로 자연스럽게 보존할 수 있습니다.
  naturalness: 현 문장의 ‘슬퍼해야 하는 것이 자기’는 지시 대상이 다소 어색하고 중복됩니다. 땅의 의인화를 유지하면서 문장을 더 자연스럽게 다듬는 것이 좋습니다.
  terminology: ‘한 아들을 두고’, ‘땅에 물어보십시오’, ‘슬퍼하다’는 현대 표준어 합쇼체에 적절합니다. ‘tantorum’은 명시되지 않은 대상을 ‘사람’으로 특정하지 않고 ‘많은 것들’로 옮겨 모호성을 보존합니다.
  issues:
  - severity: medium
    issue: ‘그 많은 사람’이 원문에 없는 사람이라는 대상을 명시한다.
    rationale: 라틴어 ‘tantorum’은 여기서 수식되는 명사가 표면적으로 제시되지 않으며, 제공된 영어 감사본도 ‘so many’로만 옮깁니다. 따라서 사람으로 한정하지 않아야 합니다.
  - severity: low
    issue: ‘슬퍼해야 하는 것이 자기’가 한국어로 부자연스럽고 강조 구조가 흐려진다.
    rationale: ‘haec est quae debeat lugere’는 땅이 바로 슬퍼해야 할 존재라는 대조적 강조이므로 ‘슬퍼해야 할 것은 바로 땅 자신’이 더 명료합니다.
  revised_text: 그러나 당신은 한 아들을 두고 슬퍼하고 계십니다. 땅에 물어보십시오[a]. 그러면 땅이, 그토록 많은 것들이 자기 위에 있으므로 슬퍼해야 할 것은 바로 땅 자신이라고 말해 줄 것입니다.
