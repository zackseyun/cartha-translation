  yaml_path: translation/extra_canonical/2_esdras/010/013.yaml
  text: whom I bore with sorrows and brought forth with pains; but the earth, according to the way of the earth, goes away, as does the multitude now present in it’—
translation:
  language: ko
  text: 내가 슬픔 가운데 낳고 고통 가운데 해산한 아들을 말입니다. 그러나 땅은 땅의 길을 따라 사라져 갔고, 그 안에 지금 있는 무리도 사라져 갔습니다—[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘슬픔들로’(cum meroribus)와 ‘고통들로’(cum doloribus)입니다. 라틴어는 두 표현을 병렬하여 출산의 비애를 강조합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘땅의 길을 따라’입니다. 라틴어의 의도적으로 낯선 표현을 어순은 자연스럽게 하되 뜻에서는 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: quem cum meroribus peperi et cum doloribus genui
  english_pob_choice: whom I bore with sorrows and brought forth with pains
  chosen_korean: 내가 슬픔으로 낳고 고통으로 해산한 자
  alternatives_korean:
  - 슬픔으로 내가 낳고 고통으로 내가 해산한 자
  - 슬픔 가운데 낳고 고통 가운데 해산한 자
  lexicon: peperi / genui
  rationale: 두 동사를 모두 살려 ‘낳다/해산하다’로 대응하고, meroribus와 doloribus의 이중 고통을 ‘슬픔/고통’으로 구분해 출산의 비애를 드러냈습니다.
- source_word: Terra autem
  english_pob_choice: but the earth
  chosen_korean: 그러나 땅은
  alternatives_korean:
  - 그런데 땅은
  - 하지만 땅은
  lexicon: autem
  rationale: autem의 대조를 자연스러운 역접 ‘그러나’로 옮겨 앞절과의 전환을 분명히 했습니다.
- source_word: secundum uiam terrae
  english_pob_choice: according to the way of the earth
  chosen_korean: 땅의 길을 따라
  alternatives_korean:
  - 땅의 방식대로
  - 땅의 길에 따라
  lexicon: secundum + via terrae
  rationale: 직역을 지나치게 경직시키지 않으면서도, 반복되는 관용적 표현의 낯섦을 보존하기 위해 ‘땅의 길’을 살렸습니다.
- source_word: abiit ... multitudo praesens
  english_pob_choice: goes away, as does the multitude now present in it
  chosen_korean: 사라지고, 거기에 지금 있는 무리도 사라집니다
  alternatives_korean:
  - 떠나고, 거기에 지금 있는 무리도 떠납니다
  - 지나가고, 거기에 지금 있는 무리도 지나갑니다
  lexicon: abiit / multitudo praesens
  rationale: abiit의 소멸·이탈 의미를 문맥상 자연스러운 ‘사라지다’로 잡고, praesens는 현재 현존성을 살려 ‘지금 있는’으로 옮겼습니다.
theological_decisions:
- issue: earth and multitude as transient creatures under the order of creation
  chosen_reading: 땅도 그 안의 무리도 모두 덧없이 사라지는 존재로 묘사했습니다.
  alternative_readings:
  - 땅이 가는 길을 따르는 순환적 소멸로 볼 수 있습니다
  - 무리만 사라지고 땅은 유지된다고 읽을 수도 있습니다
  rationale: Latin의 핵심은 땅의 질서와 그 안의 현존하는 무리의 유한성을 병치하는 데 있으므로, 둘 다 소멸의 범주에 두는 영어 POB의 갱신을 따랐습니다.
  doctrine_reference: 창조의 유한성과 인간 생명의 덧없음(시 103:15-16; 약 4:14)
