  source_fidelity: 라틴어의 quem은 앞 문맥의 남성을 받는 관계대명사이므로 한국어에서는 지시 대상이 남성임을 보존하는 ‘아들을’이 안전합니다. 또한 원문은 현재형이 아니라 abiit(완료형)를 사용하므로 ‘사라집니다’보다 ‘사라져 갔고/떠나갔으며’가 더 충실합니다. 다만 구문상 ‘땅’과 ‘그 안에 지금 있는 무리’의 관계가 난해하므로, 어느 한쪽만 주어로 확정하지 않도록 병렬 구조를 유지했습니다.
  naturalness: 초안의 ‘내가 … 자를 말합니다’는 인용문 중간에서 불필요하게 메타 발화를 보태며, ‘낳고 해산한’은 같은 출산 행위를 중복해 다소 부자연스럽습니다. ‘슬픔 가운데 낳고 고통 가운데 해산한 아들’은 현대 표준어 합쇼체 문맥에서 자연스럽고 두 동사의 반복도 유지합니다. ‘거기에 지금 있는’은 ‘그 안에 지금 있는’이 더 분명합니다.
  terminology: meroribus/doloribus의 구별은 ‘슬픔/고통’으로 유지했습니다. secundum uiam terrae의 낯선 반복은 ‘땅의 길을 따라’로 보존했습니다. 영어로 된 각주를 한국어로 고쳤고, 원문의 수사적 복수는 한국어에서 자연스럽게 단수 집합명사로 처리했음을 밝혔습니다.
