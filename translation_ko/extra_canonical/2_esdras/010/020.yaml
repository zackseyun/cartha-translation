id: 2ES.10.20
reference: 2 Esdras 10:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: noli facere sermonem hunc, sed consenti persuaderi – quid enim casus Sion – et consolare propter dolorem Hierusalem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/020.yaml
  text: Do not say this[a], but consent to be persuaded—for how great is Zion’s downfall!—and be comforted because of Jerusalem’s sorrow.
  footnotes:
  - marker: a
    text: Or 'because of Zion’s calamities'.
    reason: previous_rendering
translation:
  language: ko
  text: 그렇게 말하지 마십시오. 오히려 설득을 받아들이십시오. 시온의 몰락이 얼마나 큽니까! 예루살렘의 슬픔 때문에 위로를 받으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘시온의 재앙들 때문에’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: noli facere sermonem hunc
  english_pob_choice: Do not say this
  chosen_korean: 그렇게 말하지 마십시오
  alternatives_korean:
  - 이런 말을 하지 마십시오
  - 그 말을 하지 마십시오
  lexicon: noli / sermo
  rationale: 직접적인 금지를 자연스러운 합쇼체로 옮기되, sermonem hunc의 지시성을 살려 '그렇게 말하지 마십시오'로 간결하게 표현했습니다.
- source_word: sed consenti persuaderi
  english_pob_choice: but consent to be persuaded
  chosen_korean: 오히려 설득을 받아들이십시오
  alternatives_korean:
  - 그러나 설득되도록 동의하십시오
  - 설득당하는 데 동의하십시오
  lexicon: consenti persuaderi
  rationale: 수동적 '설득되다'의 뉘앙스를 유지하면서 한국어에서 자연스러운 명령형으로 옮겼습니다.
- source_word: quid enim casus Sion
  english_pob_choice: for how great is Zion’s downfall
  chosen_korean: 시온의 몰락이 얼마나 큽니까
  alternatives_korean:
  - 시온의 몰락이 참으로 어떠합니까
  - 시온의 재앙이 얼마나 큽니까
  lexicon: quid enim / casus / Sion
  rationale: quid enim의 수사적 탄성을 '얼마나 큽니까'로 살렸고, casus는 단순한 '재앙들'보다 문맥상 더 직접적인 '몰락'이 적절합니다.
- source_word: dolorem Hierusalem
  english_pob_choice: Jerusalem’s sorrow
  chosen_korean: 예루살렘의 슬픔
  alternatives_korean:
  - 예루살렘의 고통
  - 예루살렘의 비통함
  lexicon: dolor / Hierusalem
  rationale: dolor의 정서적·신체적 폭을 감안하되, 본문 병행성과 자연스러움을 위해 '슬픔'을 택했습니다.
theological_decisions:
- issue: 직설적 위로 명령의 화법
  chosen_reading: 절망적 현실을 인정한 뒤 위로를 촉구하는 직접 화법으로 옮겼습니다.
  alternative_readings:
  - 부드럽게 권면하는 서술형
  - 감정 완화를 위한 완곡 표현
  rationale: 본문은 애도와 현실 인정을 전제로 한 강한 권면이므로, 명령의 강도를 약화시키지 않았습니다.
  doctrine_reference: 문맥적 수사와 애가적 권면의 보존
