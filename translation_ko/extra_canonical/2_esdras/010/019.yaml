lexical_decisions:
- source_word: et adposui adhuc loqui
  english_pob_choice: Then I continued to speak
  chosen_korean: 그때 저는 계속 말하고
  alternatives_korean:
  - 그때 저는 계속해서 말하기 시작했고
  - 그때 저는 다시 말하기를 이어 갔고
  lexicon: adposui + adhuc + loqui
  rationale: 라틴어의 ‘말하기를 계속하다’는 진행·지속의 뜻을 살려, 한국어에서는 자연스러운 ‘계속 말하고’로 옮겼습니다.
- source_word: ad eam
  english_pob_choice: to her
  chosen_korean: 그 여자에게
  alternatives_korean:
  - 그에게
  - 그녀에게
  lexicon: ad + is/ea/id
  rationale: 지시대명사 ea의 여성형을 반영해 ‘그 여자에게’로 옮겨 대상을 분명히 했습니다.
- source_word: dixi
  english_pob_choice: said
  chosen_korean: 이렇게 말했습니다
  alternatives_korean:
  - 말했습니다
  - 말하였습니다
  lexicon: dico
  rationale: 직접화법을 예고하는 서술로서 한국어에서는 반복을 피하면서도 자연스러운 ‘이렇게 말했습니다’를 택했습니다.
