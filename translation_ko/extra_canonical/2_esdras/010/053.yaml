base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/053.yaml
  text: Therefore I told you to come into the field[a], where there is no foundation of a building.
  footnotes:
  - marker: a
    text: Or 'into the countryside'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 내가 너에게 들판으로 오라고 말한 것입니다. 그곳에는 건물의 기초가 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들판’은 영어 POB의 이전 번역 주석 ‘into the countryside’를 반영한 대안적 이해입니다. 다만 본문 맥락상 특정한 장소를 가리키므로 본문에는 ‘들판’으로 유지했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: propterea dixi tibi
  english_pob_choice: Therefore I told you
  chosen_korean: 그러므로 내가 너에게 말한 것입니다
  alternatives_korean:
  - 그러므로 내가 너에게 일렀습니다
  - 그러므로 내가 너에게 말했습니다
  lexicon: propterea; dico
  rationale: propterea는 앞말에 대한 결론을 나타내므로 ‘그러므로’로 옮기고, dixi tibi는 서술적으로 ‘너에게 말한 것입니다’로 처리해 원문의 직접성을 유지했습니다.
- source_word: ut venires in agrum
  english_pob_choice: to come into the field
  chosen_korean: 들판으로 오라고
  alternatives_korean:
  - 밭으로 오라고
  - 그 들판으로 오라고
  lexicon: ut; venio; ager
  rationale: agrum은 여기서 특정한 장소를 가리키는 ‘field’이므로, 의미 범위를 넓히는 ‘들’이나 ‘시골’보다 ‘들판’이 더 적절합니다.
- source_word: ubi non est fundamentum aedificii
  english_pob_choice: where there is no foundation of a building
  chosen_korean: 그곳에는 건물의 기초가 없습니다
  alternatives_korean:
  - 그곳에는 어떤 건물의 기초도 없습니다
  - 그곳에는 건물의 터가 없습니다
  lexicon: ubi; fundamentum; aedificium
  rationale: aedificii는 단수이므로 ‘건물의’로 옮겼고, fundamentum은 구조물의 실제 기초를 가리키므로 ‘기초’가 가장 직접적입니다.
