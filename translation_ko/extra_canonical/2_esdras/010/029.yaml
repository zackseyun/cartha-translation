id: 2ES.10.29
reference: 2 Esdras 10:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum essem loquens ego haec, et ecce venit ad me angelus qui in principio venerat ad me et vidit me,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/029.yaml
  text: And while I was speaking these things, behold, the angel who had come to me at the beginning came to me and saw me.
translation:
  language: ko
  text: 내가 이런 말을 하고 있을 때, 보라, 처음에 나에게 왔던 천사가 나에게 와서 나를 보았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et cum essem loquens ego haec
  english_pob_choice: And while I was speaking these things
  chosen_korean: 내가 이런 말을 하고 있을 때
  alternatives_korean:
  - 내가 이런 것들을 말하고 있을 때
  - 내가 이렇게 말하는 동안
  lexicon: cum + imperfect participial action
  rationale: 진행 중인 발화를 자연스럽게 살리되, 라틴어의 시간적 배경 관계를 한국어로 간결하게 옮겼습니다.
- source_word: ecce
  english_pob_choice: behold
  chosen_korean: 보라
  alternatives_korean:
  - 보시오
  - 보십시오
  lexicon: ecce
  rationale: 서사에서 독자의 주의를 환기하는 감탄사로, 직역적이고 고전적인 ‘보라’를 유지했습니다.
- source_word: angelus qui in principio venerat ad me
  english_pob_choice: the angel who had come to me at the beginning
  chosen_korean: 처음에 나에게 왔던 천사
  alternatives_korean:
  - 처음부터 나에게 와 있던 천사
  - 맨 처음 나에게 왔던 천사
  lexicon: angelus / in principio venerat
  rationale: ‘in principio’는 시간적 시작점을 가리키므로 ‘처음에’로 옮기고, 완료 시제의 선행성을 ‘왔던’으로 반영했습니다.
- source_word: vidit me
  english_pob_choice: and saw me
  chosen_korean: 나를 보았습니다
  alternatives_korean:
  - 나를 보았습니다
  - 나를 바라보았습니다
  lexicon: videre
  rationale: 단순한 ‘보다’의 의미를 유지해, 천사가 화자를 확인하는 장면을 과장 없이 전달했습니다.
theological_decisions:
- issue: angelic reappearance and narrative emphasis
  chosen_reading: 천사는 ‘처음에 나에게 왔던’ 동일한 존재로 다시 등장하며, 이는 환시 서사의 연속성과 권위를 강조합니다.
  alternative_readings:
  - 단순히 또 다른 천사가 온 것으로 읽는 해석
  - ‘처음’의 의미를 모호하게 처리하는 번역
  rationale: 라틴어 관계절과 완료시제는 동일한 천사의 재등장을 분명히 하므로, 서사 연결을 흐리지 않도록 옮겼습니다.
  doctrine_reference: 서사 문맥 이해
