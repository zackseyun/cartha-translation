lexical_decisions:
- source_word: uidisti
  english_pob_choice: you saw her
  chosen_korean: 당신은 …를 보았고
  alternatives_korean:
  - 당신은 …를 보셨고
  - 당신이 …를 보았고
  lexicon: videre
  rationale: 라틴어 2인칭 단수 완료형 uidisti를 자연스러운 합쇼체 과거로 옮기되, 직접적 서술 흐름을 살리기 위해 주어를 앞에 두었습니다.
- source_word: lugentem
  english_pob_choice: mourning
  chosen_korean: 슬퍼하는
  alternatives_korean:
  - 애도하는
  - 울고 있는
  lexicon: lugere
  rationale: lugentem은 현재분사로서 ‘슬퍼하다/애도하다’의 진행 상태를 나타내므로, 한국어에서는 ‘슬퍼하는’이 가장 सीधे하고 문맥에 맞습니다.
- source_word: inchoasti consolare eam
  english_pob_choice: began to comfort her
  chosen_korean: 그녀를 위로하기 시작하였습니다
  alternatives_korean:
  - 그녀를 위로하기 시작했습니다
  - 그녀를 위로하려 하기 시작하였습니다
  lexicon: inchoare + consolari
  rationale: inchoasti는 ‘시작하였다’의 완료상이고, consolare eam은 ‘그녀를 위로하다’이므로 둘을 분리해 ‘위로하기 시작하였습니다’로 옮겨 행위를 분명히 했습니다.
- source_word: Nunc autem iam
  english_pob_choice: but now
  chosen_korean: 그러나 이제는…
  alternatives_korean:
  - 하지만 이제는…
  - 그런데 지금은…
  lexicon: nunc autem iam
  rationale: 문장 끝의 전환 표지로서 ‘그러나 이제는’이 가장 직접적이며, 라틴어의 이어짐을 살리기 위해 말줄임표로 다음 절과의 연결을 남겼습니다.
theological_decisions:
- issue: 10:41의 범위와 이전 절과의 접속
  chosen_reading: 이 절은 오직 ‘슬퍼하는 그녀를 보았고… 그러나 이제는’까지를 담고, 이전 절의 ‘잠시 전 당신에게 나타난 여자’는 10:40에 속한다고 보았습니다.
  alternative_readings:
  - 이전 절의 여인 서술까지 10:41에 포함해 옮기는 읽기
  - 문장 경계를 무시하고 한 절 안에서 연속 번역하는 읽기
  rationale: 제공된 라틴어 본문과 영어 감사 추적이 모두 verse-boundary correction을 지지하므로, 절 경계를 보존하는 것이 텍스트 충실성에 부합합니다.
  doctrine_reference: 본문 경계 보존과 स्रोत-대조 번역 원칙
