  text: But she said to me, “I will not do it, nor will I go into the city, but here I will die.”
translation:
  language: ko
  text: 그러나 그녀는 제게 말했습니다. 「나는 그렇게 하지 않겠습니다. 또한 도성 안으로 들어가지도 않겠습니다. 여기에서 죽겠습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non faciam
  english_pob_choice: I will not do it
  chosen_korean: 나는 그렇게 하지 않겠습니다
  alternatives_korean:
  - 그것을 하지 않겠습니다
  - 하지 않겠습니다
  lexicon: Latin facere
  rationale: 직전 문맥의 지시된 행동을 가리키는 중립적 표현으로 풀어, 영어 POB의 지시대명사적 처리와 같은 기능을 살렸습니다.
- source_word: neque ingrediar civitatem
  english_pob_choice: nor will I go into the city
  chosen_korean: 또한 도성 안으로 들어가지도 않겠습니다
  alternatives_korean:
  - 그리고 성읍에 들어가지도 않겠습니다
  - 또는 도성에 들어가지 않겠습니다
  lexicon: Latin ingredi / civitas
  rationale: ingrediar는 ‘들어가다’의 미래형으로, civitatem은 문맥상 ‘도성’이 자연스러워 한국어에서도 도시보다 고전적 행정·서사 어감을 살렸습니다.
- source_word: sed hic moriar
  english_pob_choice: but here I will die
  chosen_korean: 여기에서 죽겠습니다
  alternatives_korean:
  - 그러나 여기서 죽겠습니다
  - 하지만 여기에서 죽을 것입니다
  lexicon: Latin mori
  rationale: 직설적이고 단호한 종결을 살리기 위해 간결하게 옮겼으며, 영어 POB의 현재적 확정 어조를 반영했습니다.
