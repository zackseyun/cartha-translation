id: 2ES.10.14
reference: 2 Esdras 10:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quomodo et uenit ; et ego tibi dico: Sicut tu cum dolore peperisti, sic et terra dedit fructum suum hominem ab initio ei qui fecit eam. Nunc ergo retine apud temetipsam dolorem tuum, et fortiter fer qui tibi contigerunt casus. Si enim iustificaueris terminum dei, et filium tuum recipies in tempore et in mulieribus conlaudaberis. Ingredere ergo in ciuitatem ad uirum tuum. et dixit ad me: Non faciam neque ingrediar ciuitatem, sed hic moriar. Et adposui adhuc loqui ad eam et dixi: Noli facere sermonem hunc, sed consenti persuaderi propter casus Sion et consolare propter dolorem Hierusalem. Vides enim quoniam sanctificatio nostra deserta effecta est, et altare nostrum demolitum est, et templum nostrum destructum est, Et psalterium nostrum humiliatum est, et hymnus noster conticuit, et exultatio nostra dissoluta est, et lumen candelabri nostri extinctum est, et arca testamenti nostri direpta est, et sancta nostra contaminata sunt, et nomen quod nominatum est super nos profanatum est,
    et liberi nostri contumeliam passi sunt, et sacerdotes nostri succensi sunt, et Leuitae nostri in captiuitate abierunt, et uirgines nostrae coinquinatae sunt, et mulieres nostrae uim passae sunt, et iusti nostri rapti sunt, et paruuli nostri proditi sunt, et iuuenes nostri seruierunt, et fortes nostri invalidi facti sunt. Et quod omnium maius, signaculum Sion, quoniam resignata est de gloria sua nunc, et tradita est in manibus eorum qui nos oderunt.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/014.yaml
  text: 'Then I say to you: just as you gave birth in pain, so also the earth has given its fruit, man, from the beginning, to him who made her.'
translation:
  language: ko
  text: 그러므로 내가 당신에게 말합니다. 당신이 고통 속에서 해산한 것처럼, 땅도 역시 처음부터 그것을 지으신 분에게 사람이라는 열매를 내어 주었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 fructum suum hominem은 직역하면 ‘자기 열매, 사람’입니다. 한국어는 이를 ‘사람이라는 열매’로 옮겨 표현의 긴장을 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: quomodo et uenit ; et ego tibi dico
  english_pob_choice: Then I say to you
  chosen_korean: 그러므로 내가 당신에게 말합니다
  alternatives_korean:
  - 그때 내가 당신에게 말합니다
  - 내가 당신에게 말하겠습니다
  lexicon: dico
  rationale: 라틴어 현재형 직설을 한국어 현재 서술로 옮기고, 앞선 문맥의 귀결을 드러내는 그러므로를 보태어 POB의 화용적 흐름을 살렸습니다.
- source_word: Sicut tu cum dolore peperisti
  english_pob_choice: just as you gave birth in pain
  chosen_korean: 당신이 고통 속에서 해산한 것처럼
  alternatives_korean:
  - 당신이 고통 가운데 낳은 것처럼
  - 당신이 진통 속에서 해산한 것처럼
  lexicon: peperisti
  rationale: peperisti는 단순한 ‘낳다’보다 출산 행위를 분명히 하므로 해산한 것을 택했고, cum dolore는 고통 속에서로 자연스럽게 옮겼습니다.
- source_word: terra dedit fructum suum hominem
  english_pob_choice: the earth has given its fruit, man
  chosen_korean: 땅도 역시 처음부터 그것을 지으신 분에게 사람이라는 열매를 내어 주었습니다
  alternatives_korean:
  - 땅도 자기 열매인 사람을 내주었습니다
  - 땅도 사람이라는 열매를 주었습니다
  lexicon: terra ... fructum suum hominem
  rationale: fructum suum hominem은 문자적으로 ‘자기 열매, 사람’을 가리키므로 사람이라는 열매로 유지하되, 이를 ‘내어 주었습니다’로 번역해 산출의 뉘앙스를 살렸습니다.
- source_word: ab initio ei qui fecit eam
  english_pob_choice: from the beginning, to him who made her
  chosen_korean: 처음부터 그것을 지으신 분에게
  alternatives_korean:
  - 처음부터 그것을 만드신 이에게
  - 창조주께 처음부터
  lexicon: fecit eam
  rationale: 여기서는 땅을 가리키는 fem. eam을 반영해 그것으로 옮기고, ei qui fecit eam은 서술적 복귀가 자연스러워 처음부터 그것을 지으신 분에게로 압축했습니다.
theological_decisions:
- issue: terra / eam의 지시 대상과 성별화된 의인화
  chosen_reading: 땅을 의인화된 여성으로 읽되, 한국어에서는 ‘그것’을 써서 현대어의 성별 오해를 피했습니다.
  alternative_readings:
  - 그녀에게
  - 그 땅에게
  rationale: 라틴어는 terra와 eam으로 여성형 대응을 유지하지만, 한국어에서는 비인칭 ‘그것’을 사용하는 것이 원문 의인화의 기능을 과장하지 않으면서도 지시를 분명히 합니다.
  doctrine_reference: 창조 질서의 의인화 표현을 문자화하지 않는 번역 원칙
