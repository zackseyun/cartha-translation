  to: 그때 내가 당신에게 말합니다. 당신이 고통 속에서 해산한 것처럼, 땅도 처음부터 땅을 지으신 분에게 사람이라는 자기 열매를 내어 주었습니다.[a]
  rationale: 원문이 보장하지 않는 ‘그러므로’를 중립적인 시간·담화 연결 표현인 ‘그때’로 고쳤습니다. 또한 suum을 ‘자기’로 반영하고, eam의 지시 대상인 땅을 명시했습니다. 나머지 출산 및 창조의 비유, 그리고 사람을 땅의 열매로 부르는 표현은 유지했습니다.
