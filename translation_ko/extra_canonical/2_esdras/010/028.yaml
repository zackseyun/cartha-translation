id: 2ES.10.28
reference: 2 Esdras 10:28
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vbi est Vriel angelus, qui a principio uenit ad me ? quoniam ipse me fecit uenire in multitudinem excessus mentis huius, et factus est finis meus in corruptione, et oratio mea in inproperium. Et cum essem loquens ego haec, et ecce uenit ad me
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/028.yaml
  text: “Where is Uriel the angel[28], who came to me at the beginning? For it was he who brought me into this great bewilderment of mind, and my end has become corruption[a], and my prayer a reproach.”
  footnotes:
  - marker: '28'
    text: Latin 'this abundance of this ecstasy of mind' is awkward but forceful. The sense is that Ezra has been driven into an overwhelming visionary state, not merely ordinary confusion.
    reason: lexical_alternative
  - marker: a
    text: Or 'made me come into this abundance of this ecstasy of mind'.
    reason: previous_rendering
translation:
  language: ko
  text: “처음에 나에게 왔던 천사 우리엘은 어디에 있습니까? 바로 그가 나를 이 큰 정신의 혼미 속으로 이끌어 들였으며[a][28], 내 최후는 파멸이 되었고 내 기도는 치욕거리가 되었습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나를 이 큰 정신의 혼미 속으로 오게 하였습니다’.
    reason: previous_rendering
  - marker: '28'
    text: 라틴어는 직역하면 ‘이 정신이 제자리를 벗어난 상태의 풍성함’이라는 매우 강하고 어색한 표현입니다. 이는 단순한 혼란이 아니라 에스라가 압도적인 환시적 정신 상태에 몰렸음을 나타냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Vbi est Vriel angelus
  english_pob_choice: Where is Uriel the angel
  chosen_korean: “우리의 영 마음을 이 큰 혼미로 이끌어 온 천사 우리엘은 어디에 있습니까?”
  alternatives_korean:
  - “처음에 나에게 왔던 천사 우리엘은 어디에 있습니까?”
  - “우리엘 천사는 어디에 있습니까?”
  lexicon: 우리엘
  rationale: angelus는 ‘천사’로 옮기되, 이름은 통용 음역을 따랐습니다. 문맥상 단순 소재 확인이 아니라 책임을 묻는 질문이므로, ‘어디에 있습니까?’를 유지했습니다.
- source_word: multitudinem excessus mentis huius
  english_pob_choice: this great bewilderment of mind
  chosen_korean: “이 큰 혼미”
  alternatives_korean:
  - “이 큰 정신의 황홀경”
  - “이 큰 정신의 혼란”
  - “이 큰 마음의 이탈”
  lexicon: 혼미
  rationale: excessus mentis는 기쁨의 ‘황홀’이 아니라 정신이 제자리를 벗어난 상태를 뜻하므로, POB의 수정된 의미인 bewilderment를 따라 ‘혼미’로 옮겼습니다. multitudinem은 정도를 더하는 표현으로 이해하여 ‘큰’으로 반영했습니다.
- source_word: factus est finis meus in corruptione
  english_pob_choice: my end has become corruption
  chosen_korean: “내 끝은 부패가 되고”
  alternatives_korean:
  - “내 종말은 타락이 되고”
  - “내 결말은 썩어짐이 되고”
  lexicon: 부패
  rationale: corruptio는 문자적으로 ‘썩음/부패’이므로, 비유적이지만 강한 종말적 파괴감을 살리기 위해 ‘부패’로 직역에 가깝게 옮겼습니다.
- source_word: oratio mea in inproperium
  english_pob_choice: my prayer a reproach
  chosen_korean: “내 기도는 수치가 되었습니다”
  alternatives_korean:
  - “내 기도는 조롱거리가 되었습니다”
  - “내 기도는 치욕이 되었습니다”
  lexicon: 수치
  rationale: inproperium은 ‘비난, 조롱, 수치’의 범위가 있으나, 여기서는 기도가 모욕당해 망신이 된 상태를 자연스럽게 드러내기 위해 ‘수치’로 옮겼습니다.
theological_decisions:
- issue: vision-induced mental state rather than positive ecstasy
  chosen_reading: 이 본문은 영적 황홀감의 긍정이 아니라, 예언자가 압도적 환시로 인해 혼미와 두려움에 빠진 상태를 말합니다.
  alternative_readings:
  - ‘황홀경’으로 이해해 긍정적 신비 체험으로 읽는 것
  - 단순한 정신 착란으로 약화시키는 것
  rationale: 라틴 excessus mentis와 POB의 수정은 모두 기쁨이 아니라 정신의 이탈·당혹을 가리키므로, 한국어도 그 긴장과 불안을 유지해야 합니다.
  doctrine_reference: 계시 체험의 성격에 대한 서술적 본문 이해
- issue: my end has become corruption as a lament of ruin
  chosen_reading: ‘내 끝은 부패가 되고’는 도덕적 타락보다 파국적 붕괴를 우선하는 탄식으로 읽었습니다.
  alternative_readings:
  - 윤리적 타락을 강조하는 읽기
  - 단순한 육체적 썩음으로만 제한하는 읽기
  rationale: corruptione는 여기서 인물의 종말적 붕괴를 가리키며, 문맥상 죄책 고백보다 절망적 탄식이 핵심입니다.
  doctrine_reference: 문맥 우선의 서사적 해석
