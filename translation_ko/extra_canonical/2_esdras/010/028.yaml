revisions:
- from: “우리의 영(靈) 마음을 이 큰 혼미로 이끌어 온 천사 우리엘은 어디에 있습니까? 그가 나를 오게 하였으므로, 내 끝은 부패가 되고 내 기도는 수치가 되었습니다.”[a][28]
