    rationale: a principio uenit ad me는 우리엘을 특정하는 핵심 관계절입니다. 현 문구는 원문에 근거가 없을 뿐 아니라 ‘마음’을 목적어처럼 만들어 문장 의미를 파괴합니다.
  - severity: medium
