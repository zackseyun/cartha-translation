  naturalness: ‘너 자신 안에 네 슬픔을’은 직역투이면서 같은 지시어가 겹쳐 현대 한국어로 다소 어색합니다. ‘마음속에 간직하고’가 apud temet ipsam의 내면적 보유를 자연스럽게 전달합니다.
  terminology: ‘불행들’은 casus의 불리한 사건들/재난이라는 문맥적 뜻에 적절합니다. fortiter는 ‘용감하게’보다 고난을 감당하는 문맥에 맞는 ‘굳세게’로 옮길 수 있습니다.
