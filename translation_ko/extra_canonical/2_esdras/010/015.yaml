  yaml_path: translation/extra_canonical/2_esdras/010/015.yaml
  text: Now therefore, keep your grief within yourself, and bravely bear the misfortunes that have happened to you.
translation:
  language: ko
  text: 그러므로 이제 슬픔을 마음속에 간직하고, 그대에게 닥친 불행들을 굳세게 견디십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: nunc ergo
  english_pob_choice: Now therefore
  chosen_korean: 그러므로 이제
  alternatives_korean:
  - 이제 그러므로
  - 그러니 이제
  lexicon: n/a
  rationale: lat. nunc ergo는 앞선 상황을 받아 결론을 이끄는 연결이므로, 평이한 한국어 결속 표현인 ‘그러므로 이제’로 옮겨 논리적 전환을 분명히 했습니다.
- source_word: retine apud temet ipsam
  english_pob_choice: keep your grief within yourself
  chosen_korean: 너 자신 안에 네 슬픔을 간직하고
  alternatives_korean:
  - 네 슬픔을 네 안에 간직하고
  - 슬픔을 속에 묻어두고
  lexicon: n/a
  rationale: apud temet ipsam은 ‘너 자신 안에/스스로 안에’라는 자기 내면의 보유를 뜻하므로, ‘너 자신 안에’와 ‘간직하다’로 직접적으로 살렸습니다.
- source_word: fortiter fer
  english_pob_choice: bravely bear
  chosen_korean: 용감하게 견디십시오
  alternatives_korean:
  - 굳세게 견디십시오
  - 담대히 참으십시오
  lexicon: n/a
  rationale: fer는 단순한 ‘참다’보다 감당하고 견디는 뉘앙스가 있어, 권면의 어조를 살리면서도 현대 한국어에서 자연스러운 ‘견디다’로 옮겼습니다.
- source_word: casus
  english_pob_choice: the misfortunes that have happened to you
  chosen_korean: 너에게 닥친 불행들
  alternatives_korean:
  - 너에게 일어난 재난들
  - 닥쳐온 불운들
  lexicon: n/a
  rationale: casus는 우연한 ‘사건’보다 불길한 ‘닥침/불행’의 뉘앙스가 강해, 결과적 고통을 드러내는 ‘불행들’로 번역했습니다.
theological_decisions:
- issue: 권면의 명령형 어조
  chosen_reading: 화자가 슬픔의 억제를 요구하는 직접 권면으로 읽고, 한국어에서도 정중한 명령형으로 유지했습니다.
  alternative_readings:
  - 서술형 완화
  - 청유형으로 완곡화
  rationale: 본문은 위로의 권면이 아니라 감정을 붙들고 불행을 견디라는 직접 지시이므로, 현대 합쇼체의 명령형을 통해 원문의 강도를 보존했습니다.
  doctrine_reference: n/a
