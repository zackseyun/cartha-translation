id: 2ES.10.38
reference: 2 Esdras 10:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixit: audi me, et doceam te et dicam tibi de quibus times, quoniam altissimus reuelauit tibi mysteria multa. Vidit enim'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/038.yaml
  text: And he said, “Listen to me, and I will teach you, and I will tell you about the things you fear, because the Most High has revealed many mysteries to you.
translation:
  language: ko
  text: 그가 말했습니다. 「내 말을 들으십시오. 그러면 제가 당신에게 가르쳐 드리고, 당신이 두려워하는 것들에 대해 말해 드리겠습니다. 지극히 높으신 분이 당신에게 많은 비밀을 계시하셨기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 dixit는 ‘말했습니다’에 해당하며, 영어 수정본에 있던 ‘answered me’는 본문에 없습니다.
    reason: textual_variant
lexical_decisions:
- source_word: dixit
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그가 대답하며 말했습니다
  - 그가 이르기를
  lexicon: dixit
  rationale: 라틴어 dixit는 단순히 ‘말하다’의 서술이며, 영어 개정처럼 ‘answered me’는 포함하지 않으므로 답변 동사를 넣지 않고 평이하게 옮겼습니다.
- source_word: audi me
  english_pob_choice: Listen to me
  chosen_korean: 내 말을 들으십시오
  alternatives_korean:
  - 제 말을 들으십시오
  - 나를 들으십시오
  lexicon: audi
  rationale: 직접 청유/명령의 호소를 자연스럽고 공손한 합쇼체로 반영했습니다.
- source_word: de quibus times
  english_pob_choice: about the things you fear
  chosen_korean: 당신이 두려워하는 것들에 대해
  alternatives_korean:
  - 당신이 무서워하는 것들에 대해
  - 두려워하는 일들에 대해
  lexicon: de quibus times
  rationale: 라틴어의 ‘무엇들/어떤 것들’의 범위를 살려 구체 항목들을 가리키는 복수 표현으로 유지했습니다.
- source_word: altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  lexicon: altissimus
  rationale: 하나님을 가리키는 전통적 호칭을 한국어 공손 표현으로 살리되, 본문의 숭고한 호칭성을 유지했습니다.
- source_word: mysteria multa
  english_pob_choice: many mysteries
  chosen_korean: 많은 비밀
  alternatives_korean:
  - 많은 신비
  - 많은 비의
  lexicon: mysteria
  rationale: 라틴어 mysteria의 숨겨진 계시 내용이라는 의미를 살리면서, 한국어 성경에서 자연스러운 ‘비밀’로 옮겼습니다.
theological_decisions:
- issue: 지극히 높으신 분의 계시 표현
  chosen_reading: 하나님이 인간에게 많은 숨은 진리를 드러내셨다는 문맥을 유지해 ‘계시하셨습니다’로 번역했습니다.
  alternative_readings:
  - 드러내셨습니다
  - 보여주셨습니다
  rationale: 라틴어 revelauit는 단순 통보보다 ‘드러내다/계시하다’의 종교적 의미가 강하므로, 본문이 말하는 초월적 개시를 분명히 했습니다.
  doctrine_reference: 계시론
- issue: 직접화법의 호칭과 공손체
  chosen_reading: 화자와 청자의 관계를 살려 직접화법 안에서는 합쇼체 명령형을 사용했습니다.
  alternative_readings:
  - 평서체로 통일
  - 더 구어적인 명령형
  rationale: 본문의 권면적·교훈적 어조를 현대 한국어에서 가장 자연스럽게 전달하면서도, 신적·예언적 발화의 격식을 유지합니다.
  doctrine_reference: 문체/화행
