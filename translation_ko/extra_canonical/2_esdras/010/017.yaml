lexical_decisions:
- source_word: ingredere
  english_pob_choice: go into
  chosen_korean: 들어가십시오
  alternatives_korean:
  - 가십시오
  - 들어가라
  lexicon: Latin ingredior
  rationale: 출발 동작만이 아니라 성읍 안으로 들어가는 이동을 분명히 하므로, 자연스럽지만 원문 동작을 유지하는 ‘들어가십시오’로 옮겼습니다.
- source_word: in civitatem
  english_pob_choice: into the city
  chosen_korean: 성읍으로
  alternatives_korean:
  - 도성으로
  - 도시로
  lexicon: Latin civitas
  rationale: 문맥상 특정한 도시/성읍을 가리키는 일반적 지시이므로, 성경체에서 널리 쓰이면서도 현대 한국어에서 무리 없는 ‘성읍’을 택했습니다.
- source_word: ad virum tuum
  english_pob_choice: to your husband
  chosen_korean: 네 남편에게
  alternatives_korean:
  - 네 남편에게로
  - 당신의 남편에게
  lexicon: Latin vir
  rationale: 방향을 나타내는 ad를 한국어에서는 대상격 조사로 자연스럽게 풀어 ‘네 남편에게’로 옮겼습니다. 2인칭 단수 소유는 대화체를 살려 ‘네’로 유지했습니다.
theological_decisions:
- issue: dixit ad me의 화자 표지
  chosen_reading: ‘그리고 그가 나에게 말했습니다’로 옮겨 화자 전환을 그대로 드러냈습니다.
  alternative_readings:
  - 그리고 그녀가 나에게 말했습니다
  - 그리고 말했습니다
  rationale: 라틴 본문의 dixit는 성별 표지가 없으므로, 본문 자체에 근거해 중성적인 ‘그가’로 처리하여 영어 POB의 오역 수정 방향을 반영했습니다.
  doctrine_reference: 본문비평/번역 정확성
