source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: campo, ubi domus non est aedificata. Sciebam enim ego quoniam altissimus incipiebat tibi ostendere haec. Propterea dixi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/052.yaml
  text: For I knew that the Most High was beginning to show you these things[a]. Therefore I said
  footnotes:
  - marker: a
    text: Or 'For I knew that the Most High was beginning to'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 지극히 높으신 분께서 이 일들을 너에게 보여 주기 시작하고 계셨다는 것을 알고 있었습니다. 그러므로 내가 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지극히 높으신 하나님
  lexicon: 하나님 칭호
  rationale: Latin altissimus는 절대적 높으심을 가리키므로, 본문이 직접 '하나님'을 덧붙이지 않는 점을 살려 존칭적 우회 표현으로 옮겼습니다.
- source_word: incipiebat ostendere
  english_pob_choice: was beginning to show you these things
  chosen_korean: 이 일들을 너에게 보여 주기 시작하시는 중이었습니다
  alternatives_korean:
  - 이 일들을 너에게 보여 주기 시작하고 계셨습니다
  - 이 일들을 너에게 보이기 시작하셨습니다
  lexicon: 동사상/진행상
  rationale: incipiebat는 시작 직전의 진행을 드러내므로 단순 완료보다 진행성을 살려 '시작하시는 중'으로 옮겼습니다.
- source_word: haec
  english_pob_choice: these things
  chosen_korean: 이 일들을
  alternatives_korean:
  - 이것들을
  - 이러한 것들을
  lexicon: 지시대명사
  rationale: 문맥상 계시된 내용 전체를 가리키므로 자연스러운 한국어로 '이 일들'이라 처리했습니다.
- source_word: Propterea dixi
  english_pob_choice: Therefore I said
  chosen_korean: 그러므로 내가 말했습니다
  alternatives_korean:
  - 그러므로 내가 말하였습니다
  - 그래서 내가 말했습니다
  lexicon: 접속사+서술
  rationale: propterea의 인과를 분명히 살리고, dixi는 단순 과거로 자연스럽게 옮겨 서술했습니다.
theological_decisions:
- issue: Most High 칭호의 한국어 처리
  chosen_reading: 지극히 높으신 분
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  rationale: 본문의 칭호를 직역하되, 라틴어가 지시하는 절대적 위상을 유지하면서도 본문에 없는 명시적 신명어 삽입은 피했습니다.
  doctrine_reference: 하나님의 칭호 번역 원칙
- issue: incipiebat의 시간성
  chosen_reading: 보여 주기 시작하시는 중이었습니다
  alternative_readings:
  - 보여 주기 시작하셨습니다
  - 보여 주려고 하셨습니다
  rationale: 계시가 이미 완결된 사건이 아니라 막 열리기 시작하는 국면임을 드러내어, 문맥의 순차성과 계시성 긴장을 보존했습니다.
  doctrine_reference: 계시 서술의 서사적 진행
