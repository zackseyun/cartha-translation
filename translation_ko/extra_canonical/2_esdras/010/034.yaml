id: 2ES.10.34
reference: 2 Esdras 10:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: derelinquere, ut non frustra moriar, Quoniam uidi quae non
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/034.yaml
  text: And I said, “Speak, my lord; only do not forsake me, lest I die for nothing.
translation:
  language: ko
  text: 제가 말했습니다. 「주여, 말씀하십시오. 다만 저를 버리지 마십시오. 제가 헛되이 죽지 않게 하려는 것입니다」.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: derelinquere
  english_pob_choice: forsake me
  chosen_korean: 저를 버리지 마십시오
  alternatives_korean:
  - 저를 떠나지 마십시오
  - 저를 저버리지 마십시오
  lexicon: derelinquere → 버리다 / 떠나다 / 저버리다
  rationale: 영어 POB의 "forsake me"를 따라 관계를 끊고 떠나는 의미를 살려 "버리다"를 기본으로 했습니다. 합쇼체 간청문맥에 맞게 정중한 부정 명령으로 처리했습니다.
- source_word: ut non frustra moriar
  english_pob_choice: lest I die for nothing
  chosen_korean: 제가 헛되이 죽지 않게 하려는 것입니다
  alternatives_korean:
  - 헛되이 죽지 않도록 하려는 것입니다
  - 쓸데없이 죽지 않게 하려는 것입니다
  lexicon: frustra morior → 헛되이 죽다
  rationale: frustra의 허무·무익함을 한국어에서 가장 직접적으로 드러내는 "헛되이"를 택했습니다. 목적절은 자연스러운 현대 한국어로 풀어 옮겼습니다.
- source_word: Quoniam uidi
  english_pob_choice: I said
  chosen_korean: 제가 말했습니다
  alternatives_korean:
  - 제가 보았습니다
  - 제가 말하였습니다
  lexicon: dico / video 문맥상 발화 전환
  rationale: 현행 영어 POB는 발화문 도입을 "And I said"로 처리하므로, 문맥상 화자 전환을 분명히 하는 방향으로 옮겼습니다. 뒤이어 나오는 내용은 다음 절로 이어지는 도입부 성격이라 한국어도 같은 방식으로 간결하게 처리했습니다.
theological_decisions:
- issue: 간청문의 화법과 존칭 수준
  chosen_reading: 화자 자신은 평서형으로 서술하고, 직접 화법은 주체를 높이는 합쇼체 청원문으로 처리했습니다.
  alternative_readings:
  - 직접 화법을 더 비격식적으로 처리하기
  - 기도문처럼 '-옵소서' 체를 쓰기
  rationale: 원문과 영어 POB 모두 절박한 요청을 담지만, 여기서는 인간 화자와 ‘주여’에 대한 직접 호칭이 함께 있어 현대 한국어의 공적·경건한 합쇼체가 가장 자연스럽습니다.
  doctrine_reference: 화자-청자 관계에 따른 한국어 존칭 조정
