source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dixi: Quoniam derelinquens dereliquisti me: ego quidem feci secundum sermones tuos et exiui in campum et ecce uidi et uideo quod non possum enarrare. et dixit ad me: Sta ut uir et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/010/032.yaml
  text: And I said, “Because you have utterly forsaken me. For I did according to your words and went out into the field, and behold, I saw and still see what I am not able to describe.”
translation:
  language: ko
  text: 제가 말했습니다. “저를 철저히 버리셨기 때문입니다. 저는 당신의 말씀대로 행하고 들로 나갔습니다. 그런데 보십시오, 제가 보았고 지금도 보고 있는 것을 서술할 수 없습니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘버리면서 버리셨다’에 가깝습니다. 같은 어근의 반복이 버림을 강조합니다.
    reason: source_note
  - marker: b
    text: uideo는 현재형입니다. 따라서 과거에 본 일(uidi)뿐 아니라 지금도 보고 있음을 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: Quoniam derelinquens dereliquisti me
  english_pob_choice: Because you have utterly forsaken me
  chosen_korean: 주님께서 저를 완전히 버리셨으니입니다
  alternatives_korean:
  - 주님께서 저를 버리셨기 때문입니다
  - 주님께서 저를 완전히 저버리셨습니다
  lexicon: derelinquere
  rationale: 중복 어근의 강한 버림을 살려 POB의 utterly를 반영했고, 직접 화법의 대상이 신적 호칭이므로 주님으로 옮겼습니다.
- source_word: ego quidem feci secundum sermones tuos
  english_pob_choice: For I did according to your words
  chosen_korean: 저는 주님의 말씀대로
  alternatives_korean:
  - 저는 주님의 말씀을 따라
  - 저는 주님의 말씀대로 행했는데
  lexicon: facio / sermo
  rationale: 행위의 순종을 드러내되 군더더기를 줄여 원문의 간결한 진술을 살렸습니다.
- source_word: exiui in campum
  english_pob_choice: went out into the field
  chosen_korean: 들에 나갔는데
  alternatives_korean:
  - 들판으로 나갔는데
  - 광야로 나갔는데
  lexicon: campus
  rationale: campus를 문맥상 열린 들판으로 이해해 들로 옮겼고, 이어지는 관찰 진술과 자연스럽게 연결했습니다.
- source_word: uideo quod non possum enarrare
  english_pob_choice: what I am not able to describe
  chosen_korean: 내가 보고 또 지금도 보고 있는 것을 도저히 설명할 수 없습니다
  alternatives_korean:
  - 내가 보고 있는 것을 말로 다 할 수 없습니다
  - 설명할 수 없는 것을 봤습니다
  lexicon: video / enarrare
  rationale: 현재형 uideo를 살려 ‘지금도 보고 있는’이라는 지속성을 드러냈고, enarrare는 단순한 보기보다 ‘설명하다’가 적절해 보였습니다.
theological_decisions:
- issue: 버림의 강도 표현
  chosen_reading: ‘완전히 버리셨으니입니다’로 강한 절대적 버림을 드러냈습니다.
  alternative_readings:
  - ‘버리셨기 때문입니다’처럼 완화된 인과문
  - ‘저버리셨습니다’라는 덜 중첩된 표현
  rationale: 라틴어 derelinquens dereliquisti의 반복은 단순한 이별이 아니라 철저한 버림을 강조하므로, 이를 약화하지 않도록 했습니다.
  doctrine_reference: 시편적 탄식 전통과 하나님의 침묵/버림 체험의 언어
