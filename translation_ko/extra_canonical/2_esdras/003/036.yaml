id: 2ES.3.36
reference: 2 Esdras 3:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: homines quidem per nomina invenies servasse mandata tua, gentes autem non invenies.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/036.yaml
  text: Men indeed, by name, you may find who have kept your commandments, but nations you will not find.
translation:
  language: ko
  text: 사람들은 이름까지도, 당신의 계명을 지킨 이들을 찾아볼 수 있지만, 민족들은 찾아볼 수 없습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: homines
  english_pob_choice: Men indeed
  chosen_korean: 사람들은
  alternatives_korean:
  - 사람들로는
  - 인간들은
  lexicon: homines
  rationale: 라틴어 homines는 성별 대비가 핵심이 아니므로 자연스러운 일반 복수인 ‘사람들’을 택했습니다.
- source_word: quidem
  english_pob_choice: indeed
  chosen_korean: 사람들은
  alternatives_korean:
  - 참으로
  - 과연
  lexicon: quidem
  rationale: quidem의 강조를 한국어 어순과 쉼표 배치로 반영하고, 별도의 과도한 부사를 넣지 않았습니다.
- source_word: per nomina
  english_pob_choice: by name
  chosen_korean: 이름까지도
  alternatives_korean:
  - 이름으로는
  - 이름별로는
  lexicon: per + nomina
  rationale: 직역적 ‘이름으로’는 어색하므로, ‘이름까지도’로 개별 인물 단위의 식별 가능성을 살렸습니다.
- source_word: mandata tua
  english_pob_choice: your commandments
  chosen_korean: 당신의 계명
  alternatives_korean:
  - 당신의 명령들
  - 주님의 계명
  lexicon: mandatum
  rationale: 복수 mandata를 ‘계명들’로도 옮길 수 있으나, 한국어 성경 문맥상 단수 집합명사 ‘계명’이 자연스럽고 의미를 충분히 보존합니다.
theological_decisions:
- issue: gentes의 범위
  chosen_reading: ‘민족들’로 옮겨 이스라엘과 대비되는 집단적 의미를 살렸습니다.
  alternative_readings:
  - 이방 민족들
  - 나라들
  rationale: 문맥상 단순한 ‘국가들’보다 신앙적·민족적 집합체를 가리키는 대비가 강하므로 ‘민족들’이 가장 직설적입니다.
  doctrine_reference: 성경 번역의 집합명사/민족 표지 보존
- issue: 당신의 호칭
  chosen_reading: 본문이 직접 신칭을 밝히지 않으므로 ‘당신’으로 중립적으로 옮겼습니다.
  alternative_readings:
  - 주님
  - 하나님
  rationale: 라틴어 문장 자체에는 vocative가 없고, 앞문맥에서의 수신자를 한국어에 선입견 없이 유지하는 것이 소스 충실성에 맞습니다.
  doctrine_reference: 문맥 의존 호칭 보존
