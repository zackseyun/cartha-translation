source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Iterum autem in tempore induxisti diluuium super habitantes saeculum, et perdidisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/009.yaml
  text: Again, in time, you brought the flood upon the inhabitants of the world, and destroyed them.
translation:
  language: ko
  text: 다시, 때가 이르자 당신은 홍수를 세상의 주민들 위에 보내시고 그들을 멸하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iterum autem
  english_pob_choice: Again
  chosen_korean: 다시
  alternatives_korean:
  - 또
  - 그러나 다시
  lexicon: iterum
  rationale: 라틴어 iterum은 반복을 나타내는 말이므로 ‘다시’가 가장 직접적이고, 최신 POB 수정처럼 불필요한 역접 뉘앙스는 덧붙이지 않았습니다.
- source_word: in tempore
  english_pob_choice: in time
  chosen_korean: 때가 이르자
  alternatives_korean:
  - 때에
  - 시간 속에
  lexicon: tempus
  rationale: 문맥상 ‘어느 시점에’라는 시간 부사구이므로 자연스러운 합쇼체 표현으로 옮겼습니다.
- source_word: induxti diluuium super habitantes saeculum
  english_pob_choice: you brought the flood upon the inhabitants of the world
  chosen_korean: 홍수를 세상의 주민들 위에 보내시고
  alternatives_korean:
  - 홍수를 세계의 거주자들 위에 내리시고
  - 홍수를 세상에 사는 자들 위에 가져오시고
  lexicon: induco / diluvium / habitantes saeculum
  rationale: ‘홍수’와 ‘세상의 주민들’은 직역하되, 라틴어 inducere의 결과적 의미를 한국어 동사 ‘보내시다’로 자연스럽게 표현했습니다.
- source_word: perdisti eos
  english_pob_choice: destroyed them
  chosen_korean: 그들을 멸하셨습니다
  alternatives_korean:
  - 그들을 파괴하셨습니다
  - 그들을 없애셨습니다
  lexicon: perdere
  rationale: perdere는 단순 손실보다 파멸·멸망의 결과를 강하게 띠므로, 성경 문맥에 맞는 ‘멸하다’가 가장 적절합니다.
theological_decisions:
- issue: 홍수 심판의 주체 표현
  chosen_reading: 하나님이 홍수를 보내시고 그들을 멸하신 것으로 직접 진술합니다.
  alternative_readings:
  - 수동적으로 ‘홍수가 일어났다’로 완화하는 읽기
  rationale: 본문은 재앙의 발생을 우연이 아니라 주체적 심판 행위로 돌리므로, 그 긴장을 그대로 살렸습니다.
  doctrine_reference: 신적 심판의 주권성
