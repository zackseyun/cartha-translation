translation:
  language: ko
  text: 주께서는 하늘을 굽히시고, 땅을 세우시며, 세상을 움직이셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문상의 계열 차이 때문에 일부 전승에서는 ‘땅을 세우시며’ 대신 ‘땅을 흔드셨으며’로 읽을 수 있습니다.
    reason: textual_variant
lexical_decisions:
- source_word: Et inclinasti caelos
  english_pob_choice: you bent down the heavens
  chosen_korean: 하늘을 굽히시고
  alternatives_korean:
  - 하늘을 낮추시고
  - 하늘을 숙이시고
  lexicon: inclinasti
  rationale: caelos의 이미지인 하늘의 낮아짐을 자연스럽게 살리면서, 이어지는 우주적 동작들과 어울리도록 ‘굽히시고’로 옮겼습니다.
- source_word: statuisti terram
  english_pob_choice: you established the earth
  chosen_korean: 땅을 세우시며
  alternatives_korean:
  - 땅을 굳게 세우시며
  - 땅을 정하시며
  lexicon: statuisti
  rationale: Latin의 ‘세우다/설치하다’ 의미를 직역에 가깝게 반영하되, 창조의 안정과 확립을 드러내는 한국어로 옮겼습니다.
- source_word: commouisti orbem
  english_pob_choice: moved the world
  chosen_korean: 세상을 움직이셨습니다
  alternatives_korean:
  - 세상을 흔드셨습니다
  - 세계를 흔드셨습니다
  lexicon: commouisti
  rationale: orbem은 문자 그대로의 ‘구체’보다 넓은 세계/세상으로 자연스럽게 읽히므로 ‘세상’을 택했고, 동사도 지속된 우주적 변동을 담는 ‘움직이셨습니다’로 잡았습니다.
theological_decisions:
- issue: 시적 병렬 속에서 창조와 심판의 긴장이 함께 드러나는지 여부
  chosen_reading: 하늘을 굽히시고, 땅을 세우시며, 세상을 움직이셨습니다.
  alternative_readings:
  - 하늘을 굽히시고, 땅을 흔드셨으며, 세상을 움직이셨습니다.
  rationale: 본문은 시내산 사건을 회상하는 우주적 현현의 언어이므로, 창조 질서의 확립과 그 질서의 흔들림이 함께 느껴지도록 번역했습니다.
  doctrine_reference: 출애굽기 19장; 시편 18편의 신현 묘사
