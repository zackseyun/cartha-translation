  to: 성읍이 무너진 지 삼십 년째 되는 해에, 나 살라디엘, 곧 에스라가 바빌론에 있었습니다. 내가 침상에 누워 있을 때에 몹시 괴로웠고, 내 생각들이 내 마음에 떠올랐습니다.[a]
  rationale: 인물 동일시 구문을 한국어 문법에 맞게 바로잡고, ‘생각들이 마음에 떠오르다’라는 자연스러운 관용 표현으로 원문의 내적 사유 발생을 충실히 옮겼습니다. 직역적 ‘마음 위로 올라오다’는 본문에서는 피하되 각주에서 확인할 수 있게 하였습니다.
