  source_fidelity: 라틴어의 시간 표현, 바빌론 체류, 살라디엘과 에스라의 동일시, 침상에 누운 상태에서의 동요, 그리고 마음에 일어나는 생각이라는 흐름은 대체로 반영되었습니다. 그러나 ‘나 살라디엘 곧 에스라였고’는 ‘내가 살라디엘이자 에스라였다’라는 서술처럼 들려 문장 연결이 부자연스럽습니다. 또한 ‘생각들이 내 마음 위로 올라왔습니다’는 라틴어의 셈어적 심상은 보존하지만 현대 한국어로는 지나치게 직역적입니다.
