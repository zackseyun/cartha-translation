id: 2ES.3.1
reference: 2 Esdras 3:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: anno tricesimo ruinae civitatis eram in Babylone, ego Salathihel qui et Ezras, et conturbatus sum super cubili meo recumbens, et cogitationes meae ascendebant super cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/001.yaml
  text: In the thirtieth year after the ruin of the city[a], I was in Babylon—I, Salathiel, who am also Ezra—and as I lay on my bed, I was troubled, and my thoughts came up upon my heart,
  footnotes:
  - marker: a
    text: Or 'came up over my heart'.
    reason: previous_rendering
translation:
  language: ko
  text: 성읍이 무너진 지 삼십 년째 되는 해에, 나 살라디엘, 곧 에스라가 바빌론에 있었습니다. 내가 침상에 누워 있을 때에 몹시 괴로웠고, 내 생각들이 내 마음에 떠올랐습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 생각들이 내 마음 위로 올라왔습니다’.
    reason: 라틴어 super cor meum에 나타나는 셈어적 관용의 공간적 심상을 보존하는 직역 대안입니다.
lexical_decisions:
- source_word: anno tricesimo ruinae civitatis
  english_pob_choice: In the thirtieth year after the ruin of the city
  chosen_korean: 성읍이 무너진 지 삼십 년째 되던 해에
  alternatives_korean:
  - 도성이 무너진 지 삼십 년째 되던 해에
  - 도시가 무너진 지 삼십 년째 되던 해에
  lexicon: anno tricesimo; ruinae civitatis
  rationale: ruinae civitatis는 특정 성읍의 함락을 가리키는 역사적 표현이므로, 문맥을 살려 ‘성읍이 무너진 지’로 옮겼습니다.
- source_word: salathihel qui et Ezras
  english_pob_choice: I, Salathiel, who am also Ezra
  chosen_korean: 나 살라디엘 곧 에스라였고
  alternatives_korean:
  - 나 살라티엘, 곧 에스라였고
  - 나 살라디엘, 또한 에스라였고
  lexicon: ego Salathihel qui et Ezras
  rationale: 인물 동일시를 살리기 위해 ‘곧’으로 apposition을 처리했고, 고유명사는 현대 음역에 맞춰 살라디엘로 옮겼습니다.
- source_word: conturbatus sum super cubili meo recumbens
  english_pob_choice: as I lay on my bed, I was troubled
  chosen_korean: 침상에 누워 있을 때에 내가 괴로웠으며
  alternatives_korean:
  - 내 침상에 누워 있을 때에 내가 번민하였으며
  - 침상에 누워 있었는데 마음이 어지러웠으며
  lexicon: conturbatus sum; cubile; recumbens
  rationale: conturbatus sum은 단순한 놀람보다 내면의 동요를 뜻하므로 ‘괴로웠으며’로, recumbens은 자연스러운 한국어로 풀어 ‘누워 있을 때에’로 옮겼습니다.
- source_word: cogitationes meae ascendebant super cor meum
  english_pob_choice: my thoughts came up upon my heart
  chosen_korean: 내 생각들이 내 마음 위로 올라왔습니다
  alternatives_korean:
  - 내 생각들이 내 마음에 올라왔습니다
  - 내 생각들이 내 마음 위에 떠올랐습니다
  lexicon: cogitationes; ascendebant; super cor meum
  rationale: super cor meum은 히브리어식 관용구를 반영한 표현이므로, POB의 ‘upon my heart’를 따라 ‘내 마음 위로 올라왔습니다’로 번역해 내적 사유의 발생을 살렸습니다.
theological_decisions:
- issue: ‘마음’의 의미 범위와 관용구 보존
  chosen_reading: cogitationes가 단순 감정이 아니라 내적 사유 전체가 ‘마음 위로’ 올라오는 이미지로 보존했습니다.
  alternative_readings:
  - ‘내 마음에 떠올랐습니다’로 평이하게 순화
  - ‘내 속에 생각이 일어났습니다’로 의미만 전달
  rationale: 본문은 외적 사건보다 내면의 사유가 솟아오르는 장면을 강조하므로, 관용적 이미지를 유지하는 쪽이 원문 효과를 더 잘 드러냅니다.
  doctrine_reference: 내적 성찰과 기억의 서술 — 본문 문맥 보존
