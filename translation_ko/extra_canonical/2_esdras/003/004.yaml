  yaml_path: translation/extra_canonical/2_esdras/003/004.yaml
  text: And I said, “O Lord who rules, did you not speak from the beginning, when you formed the earth—and this you did alone—and commanded the dust
translation:
  language: ko
  text: 그리고 저는 말했습니다. “오 다스리시는 주님, 당신께서는 처음부터, 땅을 빚으셨을 때—이 일은 당신 홀로 하셨으며—티끌에게 명령하셨다고 말씀하지 않으셨습니까—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: O dominator domine
  english_pob_choice: O Lord who rules
  chosen_korean: 오, 다스리시는 주님
  alternatives_korean:
  - 오, 주님
  - 오, 통치하시는 주님
  lexicon: dominator / domine
  rationale: 호격의 주님을 살리되, dominator의 지배·통치 뉘앙스를 ‘다스리시는’으로 옮겨 권위성을 보존했습니다.
- source_word: ab initio
  english_pob_choice: from the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 태초부터
  - 시작부터
  lexicon: ab initio
  rationale: 영어 POB의 시간 출발점을 따라 한국어에서도 ‘부터’를 넣어 기원을 나타내되, ‘태초’보다 직접적인 서술감을 주는 ‘처음부터’를 택했습니다.
- source_word: plasmasti terram
  english_pob_choice: when you formed the earth
  chosen_korean: 당신이 땅을 빚으셨을 때
  alternatives_korean:
  - 당신이 땅을 만드셨을 때
  - 당신이 땅을 지으셨을 때
  lexicon: plasmasti / terram
  rationale: plasmasti의 ‘형성하다, 빚다’라는 조형적 의미를 살려 ‘빚으셨다’로 옮겼습니다.
- source_word: imperasti pulu̇eri
  english_pob_choice: commanded the dust
  chosen_korean: 흙에게 명령하지 않으셨습니까
  alternatives_korean:
  - 먼지에게 명령하지 않으셨습니까
  - 티끌에게 명령하지 않으셨습니까
  lexicon: imperasti / pulueri
  rationale: pulueri를 창조 재료인 ‘흙’으로 옮겨, 인간 창조를 가리키는 구약적 문맥의 물질성을 유지했습니다.
theological_decisions:
- issue: 창조 행위의 유일성 강조
  chosen_reading: ‘그 일은 오직 당신만이 하셨습니다’로 옮겨, 땅을 빚으신 행위가 하나님만의 독점적 사역임을 분명히 했습니다.
  alternative_readings:
  - ‘홀로 하셨습니다’
  - ‘당신 혼자서 하셨습니다’
  rationale: et hoc solus는 단순한 수사적 부가가 아니라 창조의 유일한 행위자를 강조하므로, 본문이 드러내는 신적 독점성을 그대로 보존해야 합니다.
  doctrine_reference: 창조론, 하나님의 유일한 주권
