    rationale: ‘품다’는 한국어에서 마음·뜻을 내면적으로 간직한다는 뜻이 강합니다. baiolans의 ‘지니고/지고 있는’ 지속적 소지의 뜻에는 ‘지닌 채’가 더 직접적입니다.
  - severity: medium
