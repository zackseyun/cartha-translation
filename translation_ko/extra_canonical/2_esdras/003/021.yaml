    rationale: uictus est는 ‘패배를 당하였다/정복당하였다’라는 수동 표현입니다. 한국어에서도 ‘패배를 당하였으며’로 피동성을 살리는 편이 정확합니다.
  revised_text: 첫 아담은 악한 마음을 지닌 채 범죄하고 패배를 당하였으며, 그에게서 태어난 모든 사람도 그와 같이 하였습니다.
