source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lex tua in eis fructum. Cor enim malignum baiolans primus Adam transgressus et uictus est, sed et omnes qui ex eo nati
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/021.yaml
  text: For the first Adam, bearing an evil heart, transgressed and was overcome; and so also did all who were born from him.
translation:
  language: ko
  text: 첫 아담은 악한 마음을 품고 범죄하여 패배하였고, 그에게서 태어난 모든 사람도 그와 같이 하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “악한 마음을 지고”입니다. 한국어에서는 짐을 진 듯한 지속성을 살리기 위해 ‘품고’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Cor enim malignum baiolans
  english_pob_choice: bearing an evil heart
  chosen_korean: 악한 마음을 품고
  alternatives_korean:
  - 악한 마음을 지고
  - 악한 마음을 짊어지고
  lexicon: cor = 마음; malignum = 악한; baiolans = 지고/품고/짊어지고
  rationale: baiolans는 단순 소지보다 ‘짐처럼 지닌다’는 뉘앙스가 있어, 한국어에서는 문맥상 자연스럽고 의미를 살리는 ‘품고’로 옮겼습니다.
- source_word: primus Adam
  english_pob_choice: the first Adam
  chosen_korean: 첫 아담
  alternatives_korean:
  - 첫째 아담
  - 제일 아담
  lexicon: primus = 첫; Adam = 아담
  rationale: 원문의 대비를 살리기 위해 ‘첫 아담’으로 간명하게 옮겼습니다.
- source_word: transgressus et uictus est
  english_pob_choice: transgressed and was overcome
  chosen_korean: 범죄하여 패배하였고
  alternatives_korean:
  - 범죄하여 넘어졌고
  - 죄를 범하여 지고 말았고
  lexicon: transgredi = 범죄하다/어기다; uictus = 패배하다/정복되다
  rationale: 두 동사의 병렬을 유지하면서, 법적·도덕적 어긴 행위와 패배의 결과를 한국어로 분명하게 드러냈습니다.
- source_word: sed et omnes qui ex eo nati
  english_pob_choice: and so also did all who were born from him
  chosen_korean: 그에게서 태어난 모든 사람도 그와 같이 하였습니다
  alternatives_korean:
  - 그에게서 난 모든 이도 그러하였습니다
  - 그에게서 태어난 모든 이도 역시 그와 같았습니다
  lexicon: omnes qui ex eo nati = 그에게서 태어난 모든 사람
  rationale: 라틴어의 미완결 구조를 한국어에서 자연스럽게 완결해 주되, ‘그와 같이’로 아담의 상태/행위를 공동으로 공유한다는 뜻을 유지했습니다.
theological_decisions:
- issue: 아담의 대표성과 후손의 연루를 어떻게 표현할지
  chosen_reading: ‘그에게서 태어난 모든 사람도 그와 같이 하였습니다’로, 후손이 아담의 범죄와 패배의 양상을 함께 지닌다는 뜻을 담았습니다.
  alternative_readings:
  - ‘모두가 아담 안에서 죄를 지었습니다’
  - ‘그의 후손도 모두 패배하였습니다’
  rationale: 원문은 아담의 행위와 그에게서 난 자들의 상태를 병렬로 제시할 뿐, 특정 교리 공식어를 직접 사용하지는 않으므로 그 긴장을 유지하는 표현을 택했습니다.
  doctrine_reference: 원죄/아담론
