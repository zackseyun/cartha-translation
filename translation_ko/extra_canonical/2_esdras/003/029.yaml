- from: 그러나 내가 여기에 와서 헤아릴 수 없는 불경건함들을 보았고, 내 영은 이 서른째 해에 많은 죄인들을 보았으며, 내 마음은 무너졌습니다.[a]
  to: 그러나 내가 여기에 와서 그 수를 헤아릴 수 없는 불경건을 보았고, 내 영혼은 이 삼십 년째 되는 해에 많은 죄인들을 보았으며, 내 마음은 크게 흔들렸습니다.[a]
  rationale: 원문의 반복된 ‘보았다’와 시간 표현을 보존했습니다. 불경건과 죄인이라는 핵심 용어는 유지하되, 한국어의 자연스러운 명사 용법과 anima의 문맥적 의미를 반영했습니다. 마지막 관용 표현은 단정적인 ‘무너졌다’ 대신 의미 범위를 더 잘 보존하는 ‘크게 흔들렸다’로 고치고, 문자적 대안을 각주에 남겼습니다.
