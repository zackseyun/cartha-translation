  naturalness: ‘헤아릴 수 없는 불경건함들’보다 ‘그 수를 헤아릴 수 없는 불경건’이 현대 한국어에서 더 자연스럽습니다. anima mea는 이 문맥에서 ‘내 영혼’이 ‘내 영’보다 자연스럽고 불필요하게 좁은 신학적 의미를 피합니다. ‘이 삼십 년째 되는 해에’는 원문의 시간 부사를 명료하게 반영합니다.
  terminology: impietates는 하나님을 향한 불경을 포함하는 ‘불경건’으로 유지하고, delinquentes는 ‘죄인들’로 옮겼습니다. cor는 ‘마음’으로, anima는 ‘영혼’으로 옮겼습니다.
