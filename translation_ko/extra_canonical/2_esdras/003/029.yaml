id: 2ES.3.29
reference: 2 Esdras 3:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Factum est autem cum venissem huc, et vidi impietates quorum non est numerus, et delinquentes multos vidit anima mea hoc tricesimo anno. et excessit cor meum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/029.yaml
  text: But when I came here and saw impieties beyond number[a], my soul saw many sinners in this thirtieth year, and my heart overflowed.
  footnotes:
  - marker: a
    text: Or 'and my heart overflowed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 내가 여기에 와서 그 수를 헤아릴 수 없는 불경건을 보았고, 내 영혼은 이 삼십 년째 되는 해에 많은 죄인들을 보았으며, 내 마음은 크게 흔들렸습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 마음은 넘쳐났습니다’.
    reason: excessit cor meum은 문자적으로는 마음이 ‘넘어감/벗어남’을 뜻하며, 문맥상 마음의 압도됨이나 심한 동요를 나타내는 것으로도 이해될 수 있습니다.
lexical_decisions:
- source_word: impietates
  english_pob_choice: impieties beyond number
  chosen_korean: 헤아릴 수 없는 불경건함들
  alternatives_korean:
  - 수 없이 많은 불경건
  - 끝이 없는 불경건
  lexicon: impietas
  rationale: 라틴어 impietates는 단순한 도덕적 악보다 하나님께 대한 경외와 충성을 저버린 상태를 가리키므로, 한국어에서는 문맥상 가장 가까운 ‘불경건함’으로 옮겼습니다.
- source_word: delinquentes
  english_pob_choice: many sinners
  chosen_korean: 많은 죄인들을
  alternatives_korean:
  - 많은 범죄자들을
  - 많은 잘못된 자들을
  lexicon: delinquens
  rationale: delinquentes는 ‘죄를 짓는 자들’이라는 지속적 성격을 띠므로, 자연스럽고 직접적인 ‘죄인들’로 옮겼습니다.
- source_word: vidit anima mea ... vidit
  english_pob_choice: my soul saw ... saw
  chosen_korean: 내 영은 ... 보았으며
  alternatives_korean:
  - 내 혼은 ... 보았으며
  - 내 마음은 ... 보았으며
  lexicon: anima
  rationale: anima를 단순 감정으로 축소하지 않고 사람의 내적 존재를 가리키는 말로 보아 ‘영’으로 옮기되, 반복된 ‘보았’는 원문의 강조를 살렸습니다.
- source_word: excessit cor meum
  english_pob_choice: and my heart overflowed
  chosen_korean: 내 마음은 무너졌습니다
  alternatives_korean:
  - 내 마음은 넘쳤습니다
  - 내 마음은 내 밖으로 벗어났습니다
  - 내 마음은 실패했습니다
  lexicon: cor
  rationale: 라틴어 표현은 감정의 넘침보다 충격으로 인한 내적 붕괴·실신에 가까워 보여, 한국어에서는 심리적 붕괴를 드러내는 ‘무너졌습니다’로 옮겼습니다.
theological_decisions:
- issue: ‘impietates’의 신학적 무게
  chosen_reading: 단순한 악행보다 하나님께 대한 불경건과 반역의 상태로 읽었습니다.
  alternative_readings:
  - 일반적인 악행이나 도덕적 부정으로 완화해 읽을 수 있습니다.
  rationale: 2 에스드라의 탄식 문맥에서는 사회적 악보다 하나님 앞에서의 불경건이 핵심이므로, 그 신학적 긴장을 유지했습니다.
  doctrine_reference: 경건/불경건의 성경적 대조
