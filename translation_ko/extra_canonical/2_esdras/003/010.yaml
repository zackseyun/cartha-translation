id: 2ES.3.10
reference: 2 Esdras 3:10
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est in uno casus corum, sicut Adac mors, sic et his diluuium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/010.yaml
  text: 'And one fate came upon them all: as death came to Adam, so the flood came to these also.'
translation:
  language: ko
  text: 그리고 그들 모두에게 한 운명이 임했습니다. 아담에게 죽음이 왔듯이, 이들에게도 홍수가 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: in uno casus corum
  english_pob_choice: one fate came upon them all
  chosen_korean: 그들 모두에게 한 운명이 임했습니다
  alternatives_korean:
  - 그들 모두에게 같은 운명이 닥쳤습니다
  - 그들 모두에게 하나의 운명이 찾아왔습니다
  lexicon: fate
  rationale: 라틴어 uno casus를 POB가 ‘one fate’로 좁혀 읽은 흐름을 따라, ‘한 운명’으로 단일성을 드러내되 자연스러운 현대 문장으로 옮겼습니다.
- source_word: sicut Adac mors
  english_pob_choice: as death came to Adam
  chosen_korean: 아담에게 죽음이 왔듯이
  alternatives_korean:
  - 아담에게 죽음이 임했듯이
  - 아담이 죽었듯이
  lexicon: death
  rationale: 직역적 대응을 유지하면서도 ‘죽음이 오다/임하다’라는 한국어 표현으로 아담에게 닥친 죽음을 살렸습니다.
- source_word: sic et his diluuium
  english_pob_choice: so the flood came to these also
  chosen_korean: 이들에게도 홍수가 왔습니다
  alternatives_korean:
  - 이들에게도 홍수가 임했습니다
  - 그래서 이들에게도 홍수가 닥쳤습니다
  lexicon: flood
  rationale: POB의 ‘these also’를 따라 ‘이들에게도’로 대조를 분명히 했고, diluuium은 문맥상 대홍수/홍수로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 아담과 홍수의 병렬이 만드는 보편적 심판/운명 진술
  chosen_reading: 한 운명이 아담과 이들 모두에게 미쳤다는 병렬 구조를 그대로 살렸습니다.
  alternative_readings:
  - 모든 이에게 같은 죽음이 왔습니다
  - 아담처럼 이들도 죽었습니다
  rationale: 본문은 단순한 사건 묘사보다 아담과 ‘이들’ 사이의 대응을 통해 보편적 운명/심판의 구조를 제시하므로, 그 대칭을 약화하지 않았습니다.
  doctrine_reference: 인류 보편의 죽음과 심판의 연관성
