id: 2ES.3.30
reference: 2 Esdras 3:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam vidi quomodo sustines eos peccantes et pepercisti impie agentibus, et perdidisti populum tuum et conservasti inimicos tuos, et non significasti
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/030.yaml
  text: For I saw how you endure those who sin and have spared those who act impiously[a], but have destroyed your people and preserved your enemies, and have not made it clear
  footnotes:
  - marker: a
    text: Or 'spare those who act impiously, but destroy your people and preserve your enemies'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니, 주께서 죄를 짓는 이들을 오래 참으시고 불경하게 행하는 자들을 용서하셨으나, 주의 백성은 멸하시고 주의 원수들은 보존하셨으며, 또 알려 주시지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 '불경하게 행하는 자들을 용서하셨으나'로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: sustines eos peccantes
  english_pob_choice: you endure those who sin
  chosen_korean: 죄를 짓는 이들을 오래 참으시고
  alternatives_korean:
  - 죄를 짓는 자들을 견디시고
  - 죄인들을 참아 주시고
  lexicon: sustineo
  rationale: 단순한 '견디다'보다 반복적이고 불의한 대상을 오래 참아 넘기는 뉘앙스를 살리기 위해 '오래 참으시고'를 택했습니다.
- source_word: pepercisti impie agentibus
  english_pob_choice: have spared those who act impiously
  chosen_korean: 불경하게 행하는 자들을 용서하셨으나
  alternatives_korean:
  - 불경하게 행하는 자들을 살려 두셨으나
  - 경건하지 않게 행하는 자들을 아끼셨으나
  lexicon: parco
  rationale: parco는 단순 보존보다 '베풀어 주는 유예/용서'의 결이 있어, 문맥상 대조를 선명하게 하는 '용서하셨으나'로 옮겼습니다.
- source_word: perdidisti populum tuum et conservasti inimicos tuos
  english_pob_choice: have destroyed your people and preserved your enemies
  chosen_korean: 주의 백성은 멸하시고 주의 원수들은 보존하셨으며
  alternatives_korean:
  - 주의 백성은 멸망시키시고 주의 원수들은 지키셨으며
  - 주의 백성은 없애시고 주의 원수들은 남겨 두셨으며
  lexicon: perdo / conservo
  rationale: 과거 완료의 역사적 단정이 핵심이므로, 완료 의미를 드러내는 평서형 과거로 옮기되 '보존하셨으며'로 대조를 유지했습니다.
- source_word: et non significasti
  english_pob_choice: and have not made it clear
  chosen_korean: 또 알려 주시지 않았습니다
  alternatives_korean:
  - 또 분명히 밝히지 않으셨습니다
  - 또 드러내 보이지 않으셨습니다
  lexicon: significo
  rationale: 라틴어가 여기서 목적어를 생략한 채 진술을 끊기 때문에, 한국어도 해설을 덧붙이지 않고 '알려 주시지 않았습니다'로 절단감을 보존했습니다.
theological_decisions:
- issue: 하나님께 대한 직접 호칭과 고발의 어조
  chosen_reading: 직접 호칭을 '주'로 유지하고, 항의적 진술의 긴장감을 살리되 비난조로 과장하지 않았습니다.
  alternative_readings:
  - 하나님께서
  - 주님께서
  rationale: 문맥은 기도/탄원의 형식이므로 2인칭 호칭을 유지해야 하며, 합쇼체 속에서도 예레미야적 탄원에 가까운 비판적 긴장을 보존하는 것이 소스에 충실합니다.
  doctrine_reference: intercessory lament / apocalyptic complaint
