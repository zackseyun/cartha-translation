  text: 이는 제가 시온의 황폐함과 바빌론에 살고 있던 이들의 풍요를 보았기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: desertionem Sion
  english_pob_choice: the desolation of Zion
  chosen_korean: 시온의 황폐함
  alternatives_korean:
  - 시온의 버려짐
  - 시온의 황폐
  lexicon: desertio
  rationale: 라틴어 desertio는 단순한 ‘버림’보다 사람이 거주하던 곳이 비어 버린 상태의 ‘황폐함’이 더 잘 드러나므로 이렇게 옮겼습니다.
- source_word: habundantiam
  english_pob_choice: the abundance
  chosen_korean: 번성함
  alternatives_korean:
  - 풍성함
  - 풍요
  lexicon: habundantia
  rationale: 이 문맥에서는 수량의 많음보다 그곳의 인구·번영이 두드러지는 뜻이므로 ‘번성함’이 자연스럽고, 뒤의 ‘거주하던 자들’과도 잘 맞습니다.
- source_word: corum qui habitabant in Babilone
  english_pob_choice: those who lived in Babylon
  chosen_korean: 바빌론에 거주하던 자들
  alternatives_korean:
  - 바빌론에 살던 사람들
  - 바빌론에 거주하던 이들
  lexicon: habitare
  rationale: habitabant는 단순한 존재가 아니라 그곳에 정착해 살고 있던 상태를 나타내므로 ‘거주하던’으로 살렸습니다.
theological_decisions:
- issue: 시온과 바빌론의 대조적 이미지
  chosen_reading: 시온의 황폐함과 바빌론에 거주하던 자들의 번성함이라는 대비를 그대로 유지했습니다.
  alternative_readings:
  - 시온의 몰락과 바빌론의 번영
  - 시온의 폐허와 바빌론의 풍요
  rationale: 본문은 단순한 지리 정보가 아니라 하나님의 백성의 처지와 이방 권세의 형세를 대비시키는 표현이므로, 그 긴장을 약화시키지 않았습니다.
  doctrine_reference: 포로기/성전-시온 신학의 문맥 보존
