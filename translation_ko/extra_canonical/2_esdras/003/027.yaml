  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/027.yaml
  text: And you gave your city into the hands of your enemies.
translation:
  language: ko
  text: 당신께서는 당신의 성을 원수들의 손에 넘기셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: civitatem tuam
  english_pob_choice: your city
  chosen_korean: 당신의 성
  alternatives_korean:
  - 당신의 도시
  - 당신의 성읍
  lexicon: civitas
  rationale: 라틴어 civitas는 여기서 단순한 행정도시보다 하나님의 소유로서의 거주지·공동체를 가리키는 표현이므로, POB의 “your city”를 따라 자연스러운 한국어로는 ‘당신의 성’이 적절합니다.
- source_word: in manus
  english_pob_choice: into the hands of
  chosen_korean: 손에 넘기셨습니다
  alternatives_korean:
  - 손에 주셨습니다
  - 손에 넘겨주셨습니다
  lexicon: manus
  rationale: ‘손’은 히브리적·성서적 관용구로서 통제권과 처분권을 뜻하므로, 결과적으로 적의 지배 아래 두셨다는 의미를 살려 ‘손에 넘기셨습니다’로 옮겼습니다.
- source_word: inimicorum tuorum
  english_pob_choice: your enemies
  chosen_korean: 원수들의
  alternatives_korean:
  - 적들의
  - 대적들의
  lexicon: inimicus
  rationale: inimici는 단순한 적대자보다 적대적이고 대항하는 존재를 가리키므로, 성서적 긴장을 살릴 수 있는 ‘원수들’이 적절합니다.
theological_decisions:
- issue: 하나님의 주권과 심판 행위의 직접 진술
  chosen_reading: 문장을 그대로 살려, 하나님께서 ‘당신의 성’을 원수들의 손에 넘기신 행위로 번역했습니다.
  alternative_readings:
  - 중립적으로 ‘버려두셨습니다’로 완화
  - ‘넘기셨습니다’를 ‘허락하셨습니다’로 약화
  rationale: 본문은 단순한 허용이 아니라 직접적인 인도·처분을 말하므로, 신적 주권과 심판의 강도를 약화하지 않도록 했습니다.
  doctrine_reference: 섭리와 심판의 직접성
