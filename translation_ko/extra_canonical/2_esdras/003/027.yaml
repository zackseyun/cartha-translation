  terminology: '"성"은 civitas의 문맥상 도시/성읍을 가리키는 데 사용될 수 있으나, 현대 한국어에서 요새라는 뜻으로도 쉽게 이해될 여지가 있습니다. 그러나 이 한 절만으로 안전하게 교정할 필요가 있을 만큼 부정확하지는 않으며, 영어 POB의 "city" 및 성서 문체와도 양립합니다. "원수들"과 "손에 넘기셨습니다"는 적절합니다.'
