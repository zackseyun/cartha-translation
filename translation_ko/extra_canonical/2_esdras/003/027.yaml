  source_fidelity: 라틴어 "Et tradidisti civitatem tuam in manus inimicorum tuorum"를 충실히 반영합니다. "넘기셨습니다"는 tradidisti의 직접적 인도·양도 의미를, "원수들의 손에"는 in manus inimicorum tuorum의 성서적 관용구를 적절히 보존합니다.
