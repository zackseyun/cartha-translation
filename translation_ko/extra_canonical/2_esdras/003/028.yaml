    rationale: 원문의 ‘meliora faciunt’는 ‘더 낫게 행하다/더 잘 행동하다’라는 비교 표현입니다. 초안의 ‘-해서야’는 원문보다 강한 반문·구어적 어감을 더하므로 현대 formal-polite 문체에 맞게 고치는 것이 좋습니다.
  - severity: low
