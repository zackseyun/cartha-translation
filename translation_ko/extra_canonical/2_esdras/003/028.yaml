  source_fidelity: ‘마음속으로’와 ‘바빌론에 사는 사람들’은 원문에 충실합니다. 다만 본문의 난해한 ‘dominabit Sion’은 전승상의 문제 가능성을 고려하여, 영어 POB 감사 이력과 같이 시온이 지배 아래 놓인다는 뜻으로 조심스럽게 옮기는 편이 안전합니다.
  naturalness: ‘더 잘해서야’는 현대 구어적 뉘앙스와 강한 반문을 더합니다. 합쇼체의 현대적 문어체로는 ‘더 낫게 행하기에’가 자연스럽고 원문의 비교 표현도 더 가깝게 보존합니다.
  terminology: ‘시온’과 ‘바빌론’은 통용 표기이며 적절합니다. ‘지배를 받다’는 이 난해한 구절을 과도하게 특정 통치 주체로 보충하지 않고 처리합니다.
