source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et dixi ego tunc in corde meo: numquid meliora faciunt qui habitant in Babylone, et propter hoc dominabit Sion?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/028.yaml
  text: Then I said in my heart[28], ‘Do those who live in Babylon act better, and is that why Zion is ruled?’
  footnotes:
  - marker: '28'
    text: The Latin here is awkward and may reflect a disturbed line in transmission. Ezra's complaint contrasts Babylon's apparent flourishing with Zion's downfall; the translation preserves the rhetorical question without forcing a smoother reconstruction.
    reason: alternative_reading
translation:
  language: ko
  text: 그때 나는 마음속으로 이렇게 말했습니다. 「바빌론에 사는 사람들이 더 낫게 행하기에 시온이 지배를 받는 것입니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 다소 어색하며, 전승 과정에서 이 구절이 훼손되었을 가능성이 있습니다. 에스라는 바빌론의 겉보기 번영과 시온의 몰락을 대조하며 탄식합니다. 이 번역은 수사적 질문을 보존하고, 더 매끈한 본문으로 재구성하지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: in corde meo
  english_pob_choice: in my heart
  chosen_korean: 마음속으로
  alternatives_korean:
  - 마음에
  - 속으로
  lexicon: cor meum / cor
  rationale: 내면의 독백을 자연스러운 현대 한국어로 옮기되, 단순한 감정이 아니라 생각의 자리라는 점을 살려 ‘마음속으로’로 표현했습니다.
- source_word: qui habitant in Babylone
  english_pob_choice: those who live in Babylon
  chosen_korean: 바빌론에 사는 사람들
  alternatives_korean:
  - 바빌론에 거주하는 자들
  - 바빌론 주민들
  lexicon: Babylon
  rationale: 라틴어의 현재 분사적 표현을 자연스럽게 옮겨, 인물 집단을 가리키는 중립적 표현으로 처리했습니다.
- source_word: domabit Sion
  english_pob_choice: Zion is ruled
  chosen_korean: 시온이 지배를 받는 것
  alternatives_korean:
  - 시온이 다스려지는 것
  - 시온 위에 통치가 있는 것
  lexicon: dominari / dominabitur
  rationale: 라틴어 domi-nari 계열의 수동적 의미를 살려, 바빌론의 승리보다 ‘시온이 아래에 놓인 상태’를 직접 드러내는 표현으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 불완전한 문장 구조
  chosen_reading: 문장을 매끈하게 재구성하지 않고, 원문의 어색함과 질문의 긴장을 그대로 살렸습니다.
  alternative_readings:
  - 더 매끄럽게 ‘바빌론 사람들이 더 잘해서 시온이 지배를 받는 것입니까?’로 정리하는 방식
  rationale: 영역본의 주석처럼 이 대목은 전승상 어그러진 줄일 가능성이 있어, 의미를 과도하게 보정하지 않고 문제성을 보존하는 편이 원문 충실성에 더 부합합니다.
  doctrine_reference: 텍스트 비평 및 본문 보존 원칙
