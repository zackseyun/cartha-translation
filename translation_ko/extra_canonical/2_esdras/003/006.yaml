  yaml_path: translation/extra_canonical/2_esdras/003/006.yaml
  text: And you brought him into paradise, which your right hand had planted before the earth came into being.
translation:
  language: ko
  text: 그리고 주님의 오른손이 땅이 생겨나기 전에 심으신 그 낙원으로 그를 데리고 들어가셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 adelverbial/전치사구는 영어 POB의 해석에 따라 ‘땅이 생겨나기 전에’로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Et induxisti eum
  english_pob_choice: you brought him into
  chosen_korean: 그를 데리고 들어가셨습니다
  alternatives_korean:
  - 그를 이끌어 들어가셨습니다
  - 그를 데려가셨습니다
  lexicon: inducere
  rationale: 라틴어 induxisti는 단순한 이동보다 ‘안으로 데리고 들어감’의 뉘앙스가 있어, 자연스러운 합쇼체로 옮기되 방향성(안으로)과 행위성을 함께 살렸습니다.
- source_word: paradisum
  english_pob_choice: paradise
  chosen_korean: 그 낙원
  alternatives_korean:
  - 낙원
  - 에덴
  lexicon: paradisus
  rationale: 영어 POB의 paradise를 그대로 반영해 ‘낙원’으로 옮겼으며, 본문이 이미 특정 지리명보다 종말론적/서술적 장소를 가리키는 표현이므로 ‘에덴’으로 좁히지 않았습니다.
- source_word: dextera tua
  english_pob_choice: your right hand
  chosen_korean: 주님의 오른손
  alternatives_korean:
  - 주의 오른손
  - 주님의 오른쪽 손
  lexicon: dextera
  rationale: 라틴어 dextera tua는 하나님의 능동적 행위를 나타내는 관용적 표현이므로, 직역보다 자연스러운 한국어로 ‘오른손’을 유지하고 주어를 존칭형으로 정리했습니다.
- source_word: antequam terra adueṅtaret
  english_pob_choice: before the earth came into being
  chosen_korean: 땅이 생겨나기 전에
  alternatives_korean:
  - 땅이 존재하기 전에
  - 땅이 생기기 전에
  lexicon: antequam + adveniret/adventaret
  rationale: 최신 영어 판정처럼 ‘before the earth came into being’의 의미를 살려, 라틴어의 시간적 선행을 한국어의 자연스러운 생성 표현으로 옮겼습니다.
theological_decisions:
- issue: 하나님의 창조 선행성 표현
  chosen_reading: 주님의 오른손이 땅이 생겨나기 전에 낙원을 ‘심으셨다’는 창조 전 행위를 문자적으로 유지했습니다.
  alternative_readings:
  - 비유적으로 ‘마련하셨다’로 완화
  - ‘세우셨다’로 일반화
  rationale: 본문은 낙원이 인간 역사 이전에 이미 하나님의 손으로 준비되었음을 강조하므로, 식재 이미지를 완화하지 않고 그대로 살렸습니다.
  doctrine_reference: 창조론/선재성
