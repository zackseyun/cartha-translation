source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et induxisti eum in paradisum, quem plantauit dextera tua antequam terra adueṅtaret.
  language: Latin
base_translation:
