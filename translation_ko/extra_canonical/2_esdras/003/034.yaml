  to: 그러므로 이제 저울에 우리의 불의와 세상에 사는 자들의 불의를 달아 보십시오. 그러면 저울이 어느 쪽으로 기우는지가 드러날 것입니다.
  rationale: 원문의 저울 비유와 비교·판정의 긴장을 유지하면서, 마지막 절에서 기울어지는 대상을 ‘저울’로 밝혀 한국어의 지시 불명확성을 해소했습니다. 논쟁될 수 있는 `puncti`를 ‘바늘’ 등으로 과도하게 구체화하지 않았으며, 정보 가치가 없는 각주는 삭제했습니다.
