id: 2ES.3.34
reference: 2 Esdras 3:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc ergo pondera in statera nostras iniquitates et eorum qui habitant in saeculo, et invenietur momentum puncti ubi declinet.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/034.yaml
  text: Now therefore weigh our iniquities in the balance[a], and those of the inhabitants of the world; and it will be found at what point it inclines.
  footnotes:
  - marker: a
    text: Or 'and the turning of the scale will be found at the point where it inclines.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이제 저울에 우리의 불의와 세상에 사는 자들의 불의를 달아 보십시오. 그러면 그것이 어느 지점에서 기울어지는지가 드러날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘저울’은 본문의 비유를 따른 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: pondera in statera
  english_pob_choice: weigh ... in the balance
  chosen_korean: 저울에 …을 달아 보십시오
  alternatives_korean:
  - 저울에 달아 보십시오
  - 천칭에 달아 보십시오
  lexicon: statera=저울, pondera=달다
  rationale: 라틴어의 저울-비유를 자연스럽게 살리면서, 명령형의 직접성을 유지하기 위해 ‘달아 보십시오’를 택했습니다.
- source_word: nostras iniquitates
  english_pob_choice: our iniquities
  chosen_korean: 우리의 불의
  alternatives_korean:
  - 우리의 죄악
  - 우리의 불법
  lexicon: iniquitates=불의
  rationale: iniquitates는 단순한 죄 일반보다 도덕적·법적 불의를 강하게 드러내므로, POB의 문맥에 맞춰 ‘불의’로 옮겼습니다.
- source_word: eorum qui habitant in saeculo
  english_pob_choice: those of the inhabitants of the world
  chosen_korean: 세상에 사는 자들의 불의
  alternatives_korean:
  - 이 세상에 사는 사람들의 불의
  - 세상 거주자들의 불의
  lexicon: habitantes in saeculo=세상에 사는 자들
  rationale: saeculum을 단순한 ‘세상’으로 옮겨, 공동체 밖의 인간 세계 전체를 가리키는 폭넓은 대비를 살렸습니다.
- source_word: momentum puncti ubi declinet
  english_pob_choice: it will be found at what point it inclines
  chosen_korean: 어느 지점에서 그것이 기울어지는지가 드러날 것입니다
  alternatives_korean:
  - 어느 지점에서 그것이 기우는지가 드러날 것입니다
  - 기울어지는 지점이 드러날 것입니다
  lexicon: momentum puncti / ubi declinet=지점에서 기울어지는지
  rationale: revision trail이 지적하듯 puncti를 ‘point/pointer’로 과잉 구체화하지 않고, 최종 절차를 나타내는 간접의문으로 처리했습니다.
theological_decisions:
- issue: 저울 이미지의 심판적 함의
  chosen_reading: 하나님 앞에서 인간의 불의가 저울에 달려 비교·판정되는 심판적 비유로 옮겼습니다.
  alternative_readings:
  - 도덕적 자기성찰의 비유로 약화해서 옮김
  - 단순한 수량 비교로 축소함
  rationale: 문맥은 비유적 균형이 아니라 불의의 무게를 판정하는 심판적 장면을 전제하므로, 그 긴장을 보존해야 합니다.
  doctrine_reference: 심판과 인간의 죄성
