id: 2ES.3.5
reference: 2 Esdras 3:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dedit tibi Adam, corpus mortuum ? sed et ipsum figmentum manuum tuarum erat, et insufflasti in eum spiritum uitae, et factus est uiuens coram te.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/005.yaml
  text: And you gave Adam a dead body? Yet he too was the work of your hands, and you breathed into him the spirit of life, and he became alive before you.
translation:
  language: ko
  text: 그리고 당신은 아담에게 죽은 몸을 주셨습니다? 그러나 그도 또한 당신 손의 작품이었으며, 당신은 그에게 생명의 영을 불어넣으셨고, 그는 당신 앞에서 살아 있는 존재가 되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: coram te는 문자적으로는 ‘당신 면전에서’에 가깝지만, 한국어에서는 더 자연스러운 ‘당신 앞에서’로 옮겼습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: Et dedit tibi Adam, corpus mortuum ?
  english_pob_choice: And you gave Adam a dead body?
  chosen_korean: 그리고 당신은 아담에게 죽은 몸을 주셨습니다?
  alternatives_korean:
  - 그리고 당신은 아담에게 시체를 주셨습니다?
  - 그리고 당신은 아담에게 죽어 있는 몸을 주셨습니다?
  lexicon: corpus mortuum
  rationale: 본문의 수사적 질문을 살리면서 corpus mortuum을 직역보다 자연스러운 ‘죽은 몸’으로 옮겼습니다. ‘시체’는 지나치게 강하고, ‘죽어 있는 몸’은 다소 설명적입니다.
- source_word: figmentum manuum tuarum
  english_pob_choice: the work of your hands
  chosen_korean: 당신 손의 작품
  alternatives_korean:
  - 당신 손의 일
  - 당신이 손으로 지으신 것
  lexicon: figmentum
  rationale: 사람을 빚어 만든 존재라는 뜻을 담기 위해 ‘작품’으로 옮겼고, ‘당신 손의’로 소유·제작의 뉘앙스를 유지했습니다.
- source_word: insufflasti in eum spiritum uitae
  english_pob_choice: you breathed into him the spirit of life
  chosen_korean: 당신은 그에게 생명의 영을 불어넣으셨고
  alternatives_korean:
  - 당신은 그에게 생기의 영을 불어넣으셨고
  - 당신은 그 안에 생명의 숨을 불어넣으셨고
  lexicon: spiritum uitae
  rationale: 라틴어 spiritus vitae를 ‘생명의 영’으로 유지해, 생명 부여 행위를 단순한 호흡보다 더 직접적으로 반영했습니다.
- source_word: factus est uiuens coram te
  english_pob_choice: and he became alive before you
  chosen_korean: 그는 당신 앞에서 살아 있는 존재가 되었습니다
  alternatives_korean:
  - 그는 당신 앞에서 살아났습니다
  - 그는 당신 앞에서 살아 있게 되었습니다
  lexicon: uiuens
  rationale: uiuens의 결과 상태를 ‘살아 있는 존재’로 풀어, 영어 POB의 ‘became alive’를 자연스럽게 재현하면서 인간 창조의 상태 변화를 분명히 했습니다.
theological_decisions:
- issue: Adam의 창조와 생명 부여를 어떻게 한국어로 표현할지
  chosen_reading: 하나님이 아담에게 죽은 몸을 주시고, 자신의 손으로 지은 존재에게 생명의 영을 불어넣어 살아 있게 하신다는 창조-생명 부여의 진술로 옮겼습니다.
  alternative_readings:
  - 아담을 단순히 ‘흙덩이’로 옮기는 읽기
  - ‘영혼’을 덧붙여 인간론적으로 해석하는 읽기
  rationale: 본문은 아담의 형성보다 하나님이 생명을 부여하시는 행위를 강조하므로, 창조와 생명 부여의 긴장을 유지하는 번역이 적절합니다.
  doctrine_reference: 창세기 2:7의 창조 전승과 인간 생명에 대한 하나님의 주권
- issue: coram te의 처리
  chosen_reading: ‘당신 앞에서’로 옮겨, 하나님 앞에서의 생명 상태를 관계적·직접적으로 표현했습니다.
  alternative_readings:
  - ‘당신 면전에서’
  - ‘당신의 앞에서’
  rationale: coram te는 단순한 위치가 아니라 하나님 앞에서의 존재 방식을 가리키므로, 한국어에서는 자연스럽고 직접적인 ‘당신 앞에서’가 가장 잘 맞습니다.
  doctrine_reference: 하나님 앞에서의 존재와 생명에 관한 성서적 표현
