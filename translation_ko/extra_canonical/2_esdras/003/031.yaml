lexical_decisions:
- source_word: nihil nemini
  english_pob_choice: nothing to anyone
  chosen_korean: 아무것도 누구에게도
  alternatives_korean:
  - 아무것도 어떤 이에게도
  - 무엇도 누구에게도
  lexicon: nihil / nemini
  rationale: nihil과 nemini를 각각 ‘아무것도’, ‘누구에게도’로 분리해, 아무 대상에게도 전해 둘 내용이 없다는 부정을 분명하게 살렸습니다.
- source_word: quomodo debeat derelinqui via haec
  english_pob_choice: about how this way should be abandoned
  chosen_korean: 이 길을 어떻게 버려야 하는지에 관하여 남겨 둘 것이 없습니다
  alternatives_korean:
  - 이 길이 어떻게 버려져야 하는지에 대하여
  - 이 길을 어떤 방식으로 떠나야 하는지
  lexicon: quomodo / debeat derelinqui / via haec
  rationale: via haec를 ‘이 길’로, debeat derelinqui를 ‘버려야 하는지’로 옮겨 의무·필연의 뉘앙스를 유지했고, 문맥상 앞 절과 연결되도록 정리했습니다.
- source_word: Babylon quam Sion
  english_pob_choice: Does Babylon do better than Zion?
  chosen_korean: 바빌론이 시온보다 더 잘합니까?
  alternatives_korean:
  - 바빌론이 시온보다 더 낫습니까?
  - 바빌론이 시온보다 더 좋은 일을 합니까?
  lexicon: facit meliora / Babylon / Sion
  rationale: meliora facit를 직역해 ‘더 잘합니까’로 두어 비교의 직접성을 살렸고, 고유명사는 현대 외래어 표기법에 따라 바빌론, 시온으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 톤
  chosen_reading: 본문의 질문은 정보 요청이 아니라 바빌론과 시온의 상대적 우위를 묻는 반어적 비교로 읽었습니다.
  alternative_readings:
  - 단순한 사실 확인 질문
  - 문장 연결이 약한 두 개의 독립 문장
  rationale: 라틴 원문과 POB의 개정본 모두가 비교 질문의 형태를 유지하므로, 반어적 긴장을 약화시키지 않도록 직설적으로 번역했습니다.
  doctrine_reference: 문맥 주해
