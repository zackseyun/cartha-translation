  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: temporum finem solo secrete noctu. Et disposuisti ei testamentum aeternum, et dixisti ei ut non unquam derelinqueres semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/015.yaml
  text: And you established with him an everlasting covenant, and said that you would never forsake his seed.
translation:
  language: ko
  text: 그리고 당신은 그와 영원한 언약을 세우시고, 그의 씨를 결코 저버리지 않겠다고 말씀하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 testamentum은 여기서 성경적 ‘언약’을 뜻합니다.
    reason: source_note
lexical_decisions:
- source_word: disposuisti ei testamentum aeternum
  english_pob_choice: you established with him an everlasting covenant
  chosen_korean: 그와 영원한 언약을 세우시고
  alternatives_korean:
  - 그와 영원한 언약을 맺으시고
  - 그에게 영원한 언약을 정하시고
  lexicon: testamentum → 언약
  rationale: 라틴어 testamentum은 성경 문맥에서 ‘언약’이 가장 직접적이며, POB 영어의 ‘established with him’에 맞춰 관계 표지를 ‘그와’로 살렸습니다.
- source_word: et dixisti ei ut non unquam derelinqueres semen
  english_pob_choice: and said that you would never forsake his seed
  chosen_korean: 그의 씨를 결코 저버리지 않겠다고 말씀하셨습니다
  alternatives_korean:
  - 그의 씨를 결코 버리지 않겠다고 말씀하셨습니다
  - 그의 후손을 결코 떠나지 않겠다고 말씀하셨습니다
  lexicon: semen → 씨
  rationale: POB가 유지한 ‘seed’의 직역성을 살려 ‘씨’로 옮겼고, 언약 약속의 지속성을 ‘결코 저버리지 않다’로 자연스럽게 표현했습니다.
- source_word: eternum
  english_pob_choice: everlasting
  chosen_korean: 영원한
  alternatives_korean:
  - 영구한
  - 끝없는
  lexicon: aeternum → 영원한
  rationale: 라틴어 aeternum/aeternum의 시간적 무한성을 표준적 성경 한국어인 ‘영원한’으로 대응했습니다.
theological_decisions:
- issue: 언약의 지속성과 후손 보존 약속의 표현
  chosen_reading: 하나님이 아브라함과 맺으신 언약은 영원하며, 그 씨를 버리지 않겠다는 약속으로 제시했습니다.
  alternative_readings:
  - 언약을 단순한 계약으로 약화시키는 번역
  - ‘씨’를 ‘후손’으로만 바꿔 언약-약속의 성경적 연결을 희석하는 번역
  rationale: 본문은 언약과 후손 보존을 함께 묶어 하나님의 신실하심을 강조하므로, 이를 분리하거나 완화하지 않고 그대로 드러내는 것이 본문의 신학적 무게를 보존합니다.
  doctrine_reference: 창 17:7; 삼하 7:12-16; 갈 3:16
