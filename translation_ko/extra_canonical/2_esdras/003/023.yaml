lexical_decisions:
- source_word: malignum
  english_pob_choice: evil
  chosen_korean: 악한 것이었습니다
  alternatives_korean:
  - 악한 것
  - 악입니다
  - 사악한 것
  lexicon: malignum
  rationale: 라틴어 malignum의 핵심 의미를 따라 도덕적 악을 가리키는 표현으로 옮겼습니다. 문맥상 독립된 명사구이므로 ‘악한 것’으로 처리하되, 합쇼체 서술을 위해 ‘-이었습니다’를 붙였습니다.
- source_word: Et transierunt
  english_pob_choice: And passed
  chosen_korean: 그리고 … 지나가고
  alternatives_korean:
  - 그리고 … 흘러가고
  - 그리고 … 지나갔고
  - 또 … 지나가고
  lexicon: transire
  rationale: 시간이 ‘지나가다’는 의미를 자연스럽게 살렸습니다. 이어지는 절과 병렬을 이루도록 현재 서술형 연결로 제시했습니다.
- source_word: tempora
  english_pob_choice: the times
  chosen_korean: 때와 시대가
  alternatives_korean:
  - 시간들이
  - 때들이
  - 시절들이
  lexicon: tempus
  rationale: tempora의 복수성과 단순한 시간 경과를 함께 반영하기 위해 ‘때와 시대’로 옮겼습니다. 단순 ‘시간들’보다 본문이 지닌 역사적·시대적 울림을 더 잘 드러냅니다.
- source_word: finiti sunt anni
  english_pob_choice: the years came to an end
  chosen_korean: 해가 다하였으며
  alternatives_korean:
  - 해가 끝났으며
  - 해들이 마감되었으며
  - 연수들이 다하였으며
  lexicon: finire + anni
  rationale: anni를 자연스러운 한국어 관용에 맞게 ‘해’로 옮기고, ‘다하다’로 끝남의 완료를 표현했습니다. 본문이 간결한 병렬 구조이므로 문체도 압축적으로 유지했습니다.
