id: 2ES.3.8
reference: 2 Esdras 3:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et ambulauit unaquaeque gens in uoluntate sua, et impie agebant coram te et spernebant, et tu non prohibuisti eos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/008.yaml
  text: And each nation walked according to its own will[a], and acted impiously before you and despised you, and you did not hinder them.
  footnotes:
  - marker: a
    text: Or 'walked in its own will'.
    reason: previous_rendering
translation:
  language: ko
  text: 각 민족은 저마다 자기 뜻대로 걸었고[a], 주님 앞에서 불경하게 행했으며 주님을 업신여겼고, 주님께서는 그들을 막지 않으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “자기 뜻 안에서 걸었고.”
    reason: 라틴어 in voluntate sua의 직역에 가까운 표현을 제시하여, 본문의 비유적 표현과 ‘자기 뜻대로’라는 자연스러운 번역의 관계를 밝협니다.
lexical_decisions:
- source_word: unaquaeque gens
  english_pob_choice: each nation
  chosen_korean: 각 민족
  alternatives_korean:
  - 각 나라
  - 모든 민족
  lexicon: 민족
  rationale: gens는 단순한 국가보다 집단적 민족/종족을 가리키므로, 본문 흐름을 살려 ‘각 민족’으로 옮겼습니다.
- source_word: in voluntate sua
  english_pob_choice: according to its own will
  chosen_korean: 각자의 뜻대로
  alternatives_korean:
  - 자기 뜻 안에서
  - 자기 의지대로
  lexicon: 뜻
  rationale: 라틴어 관용구를 자연스러운 현대 한국어로 풀어, 자기중심적 자의(自意)의 뉘앙스를 살렸습니다.
- source_word: impie agebant
  english_pob_choice: acted impiously
  chosen_korean: 악하게 행하며
  alternatives_korean:
  - 경건치 않게 행하며
  - 불경하게 행하며
  lexicon: 악하게 행하다
  rationale: impie는 단순히 종교적 무례만이 아니라 하나님 앞의 악행을 포함하므로, 지나치게 교회적이거나 고어적인 표현보다 직접적인 표현을 택했습니다.
- source_word: spernebant
  english_pob_choice: despised
  chosen_korean: 주님을 업신여겼습니다
  alternatives_korean:
  - 주님을 멸시했습니다
  - 주님을 경멸했습니다
  lexicon: 업신여기다
  rationale: spernere의 강한 경시·모욕의 뜻을 살리면서도, 문맥상 대상인 하나님을 분명히 드러냈습니다.
theological_decisions:
- issue: 하나님의 호칭
  chosen_reading: 주님
  alternative_readings:
  - 하나님
  - 야훼
  rationale: 이 구절의 라틴어 tu는 직접적인 2인칭 호칭이므로, 한국어 본문에서는 자연스럽게 ‘주님’으로 옮겨 직접 호명을 유지했습니다.
  doctrine_reference: 호칭 일관성 및 문맥상 직접 خطاب 유지
- issue: '''막지 않으셨습니다''의 신학적 뉘앙스'
  chosen_reading: 그러나 주님께서는 그들을 막지 않으셨습니다
  alternative_readings:
  - 그들을 방해하지 않으셨습니다
  - 그들을 제지하지 않으셨습니다
  rationale: non prohibuisti eos는 단순 허용이 아니라 적극적으로 개입해 막지 않으신 하나님의 인내를 드러내므로, ‘막지 않으셨습니다’로 간결하게 유지했습니다.
  doctrine_reference: 섭리와 인내에 대한 본문 의미
