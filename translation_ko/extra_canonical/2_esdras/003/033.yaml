id: 2ES.3.33
reference: 2 Esdras 3:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quarum merces non conparuit neque labor fructificavit? pertransiens enim pertransivi in gentibus, et vidi abundantes eas et non memorantes mandatorum tuorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/033.yaml
  text: Yet their reward has not appeared[a], nor has their labor borne fruit. For I have passed through the nations and seen them prospering, though they do not remember your commandments.
  footnotes:
  - marker: a
    text: Or 'seen them abounding'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 보상은 나타나지 않았고, 그들의 수고도 열매를 맺지 못하였습니다. 내가 여러 민족 가운데를 지나가 보았더니, 그들이 풍요롭게 지내면서도 주님의 계명을 기억하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍요롭게 지내면서도’는 Latin abundantes의 상태적 뉘앙스를 풀어 옮긴 것입니다.
    reason: source_note
lexical_decisions:
- source_word: quarum merces non conparuit
  english_pob_choice: their reward has not appeared
  chosen_korean: 그들의 보상은 나타나지 않았고
  alternatives_korean:
  - 그들의 삯은 드러나지 않았고
  - 그들의 상급은 보이지 않았고
  lexicon: merces → 보상
  rationale: merces는 단순한 임금보다 행위에 대한 결과·보답의 뉘앙스가 있어, 문맥상 ‘보상’이 가장 자연스럽고 중립적입니다.
- source_word: labor fructificavit
  english_pob_choice: their labor borne fruit
  chosen_korean: 그들의 수고도 열매를 맺지 못하였습니다
  alternatives_korean:
  - 그들의 노동도 결실을 내지 못하였습니다
  - 그들의 수고도 열매를 맺지 못했습니다
  lexicon: labor → 수고 / fructificare → 열매를 맺다
  rationale: labor를 단순 노동보다 더 넓은 ‘수고’로 옮기고, fructificavit의 비유를 살려 ‘열매를 맺다’로 표현했습니다.
- source_word: pertransiens enim pertransivi in gentibus
  english_pob_choice: For I have passed through the nations
  chosen_korean: 내가 여러 민족 가운데를 지나가 보았더니
  alternatives_korean:
  - 내가 여러 민족을 두루 지나가 보았더니
  - 내가 민족들 가운데를 지나쳤더니
  lexicon: pertransivi in gentibus → 여러 민족 가운데를 지나가다
  rationale: 반복된 동사(pertransiens ... pertransivi)는 단순 이동의 강조이므로, 한국어에서도 ‘지나가 보았더니’로 관찰의 뉘앙스를 살렸습니다.
- source_word: abundantes eas
  english_pob_choice: seen them prospering
  chosen_korean: 그들이 풍요롭게 지내면서도
  alternatives_korean:
  - 그들이 번성하는 것을 보았으나
  - 그들이 풍족한 가운데 있음을 보았으나
  lexicon: abundantes → 풍요롭게 지내다
  rationale: Latin abundantes는 단순한 ‘많음’보다 삶의 형편이 넉넉하고 번성하는 상태를 가리켜, 수정된 영어의 ‘prospering’에 맞춰 ‘풍요롭게 지내다’로 옮겼습니다.
- source_word: non memorantes mandatorum tuorum
  english_pob_choice: they do not remember your commandments
  chosen_korean: 주님의 계명을 기억하지 않았습니다
  alternatives_korean:
  - 주님의 계명을 기억하지 않았습니다
  - 주님의 명령들을 기억하지 않았습니다
  lexicon: mandata tua → 주님의 계명
  rationale: mandata는 단순 명령보다 언약적·율법적 권위를 지닌 ‘계명’이 더 적절하며, 2인칭 소유를 합쇼체 맥락에 맞게 ‘주님의’로 옮겼습니다.
theological_decisions:
- issue: ‘remember’의 윤리적 무기억과 번역 톤
  chosen_reading: 단순한 인지 실패가 아니라 하나님께 대한 불순종의 상태를 드러내는 ‘기억하지 않다’로 직역에 가깝게 유지했습니다.
  alternative_readings:
  - ‘지키지 않았다’로 의역
  - ‘마음에 두지 않았다’로 완화
  rationale: 본문은 계명을 ‘기억하지 않음’ 자체를 죄책의 표지로 제시하므로, 윤리적 긴장을 약화시키지 않도록 직접적으로 옮겼습니다.
  doctrine_reference: 언약적 기억/망각 모티프
- issue: ‘nations’와 ‘prospering’의 대조
  chosen_reading: 여러 민족이 번성하는데도 율법을 기억하지 않는다는 대비를 유지했습니다.
  alternative_readings:
  - 민족들 사이의 일반적 번영으로 순화
  - ‘세상 사람들’로 일반화
  rationale: 수고가 열매를 맺지 못하는 이스라엘과, 민족들의 풍요로움 사이의 역설이 핵심이므로 대조를 분명히 했습니다.
  doctrine_reference: 시련 속 의인/악인의 역전 구조
