id: 2ES.3.11
reference: 2 Esdras 3:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Dereliquisti autem unum ex his, id Noe cum domo sua, ex eo iustos omnes.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/011.yaml
  text: But you left one of them, Noah with his household; from him came all the righteous.
translation:
  language: ko
  text: 그러나 당신은 그들 가운데 하나인 노아와 그의 집안을 남겨 두셨습니다. 그에게서 모든 의인들이 나왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Dereliquisti
  english_pob_choice: you left
  chosen_korean: 남겨 두셨습니다
  alternatives_korean:
  - 버리셨습니다
  - 두고 가셨습니다
  lexicon: derelinquo
  rationale: 단순히 ‘버리다’보다, 일부를 선택적으로 제외하고 보존했다는 의미를 분명히 드러내기 위해 ‘남겨 두셨습니다’로 옮겼습니다.
- source_word: unum ex his
  english_pob_choice: one of them
  chosen_korean: 그들 가운데 한 사람
  alternatives_korean:
  - 그들 중 하나
  - 그들 가운데 하나
  lexicon: unus ex
  rationale: 대상 집단 안에서 하나를 가리키는 구문이므로 자연스러운 한국어로 풀어 ‘그들 가운데 한 사람’이라 했습니다.
- source_word: Noe cum domo sua
  english_pob_choice: Noah with his household
  chosen_korean: 노아와 그의 집안
  alternatives_korean:
  - 노아와 그의 집
  - 노아와 그의 가문
  lexicon: domus
  rationale: domo sua는 단순한 건물보다 가족 단위를 가리키는 뉘앙스가 강하므로 ‘집안’이 가장 적절합니다.
- source_word: ex eo iustos omnes
  english_pob_choice: from him came all the righteous
  chosen_korean: 그에게서 모든 의인들이 나왔습니다
  alternatives_korean:
  - 그로부터 모든 의인들이 나왔습니다
  - 그에게서 모든 의로운 이들이 나왔습니다
  lexicon: ex eo + iustos omnes
  rationale: 출발점을 나타내는 ex eo를 ‘그에게서’로 살리고, iustos는 문맥상 도덕적 ‘의로운 이들’보다 성경적 용어 ‘의인들’이 더 직접적입니다.
theological_decisions:
- issue: 노아의 구원과 의인의 기원이라는 서술의 직선적 전달
  chosen_reading: 본문의 대비를 약화하지 않고, 노아와 그의 집안이 남겨졌으며 의인들이 그에게서 나왔다는 인과를 그대로 드러냈습니다.
  alternative_readings:
  - 의인들의 계보를 완곡하게 처리하는 번역
  - ‘남기셨다’를 일반적 보존 표현으로 희석하는 번역
  rationale: 이 구절은 선택적 보존과 그 결과를 연결하므로, 인과 관계를 분명히 드러내는 것이 본문의 핵심을 가장 잘 보존합니다.
  doctrine_reference: 창세기 홍수 서사와 의인의 계보에 대한 본문 내 진술
- issue: 집안(domus)의 범위
  chosen_reading: ‘집안’으로 번역해 가족/가구 단위를 포괄했습니다.
  alternative_readings:
  - 집
  - 가문
  rationale: 문맥상 물리적 건물보다 함께 보존된 가족 공동체가 중심이므로, 한국어로도 그 집단성을 분명히 해야 합니다.
  doctrine_reference: 서사적 문맥에서의 가구/가족 단위 표현
