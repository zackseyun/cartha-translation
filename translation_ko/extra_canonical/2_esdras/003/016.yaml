  text: him, and you gave him Isaac, and to Isaac you gave Jacob and Esau. And you set apart Jacob for yourself, but Esau you separated, and Jacob became
translation:
  language: ko
  text: '[그의 …], 그리고 그에게 이삭을 주셨으며, 이삭에게 야곱과 에서를 주셨습니다. 또 야곱을 당신 자신을 위하여 구별하셨고, 에서는 따로 떼어 놓으셨습니다. 그리고 야곱은 …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 라틴어 본문은 초두의 `eius`(‘그의’)에서 이미 앞 절의 일부가 결락된 상태로 시작하며, 끝에서도 `et factus est Iacob`(‘그리고 야곱은 되었습니다’)로 문장이 미완성인 채 끝납니다. 번역은 이 절단 상태를 대괄호와 말줄임표로 표시했습니다.
    reason: source_note
lexical_decisions:
- source_word: segregasti tibi
  english_pob_choice: you set apart Jacob for yourself
  chosen_korean: 야곱은 당신을 위해 따로 세우셨고
  alternatives_korean:
  - 야곱을 당신께 구별하셨고
  - 야곱을 당신 자신에게 떼어 두셨고
  lexicon: segrego
  rationale: 라틴어 segrego는 ‘따로 떼다/구별하다’의 의미이므로, 목적어 야곱을 하나님께 속하게 ‘따로 세우다’는 뜻을 자연스러운 합쇼체로 옮겼습니다.
- source_word: separasti
  english_pob_choice: you separated
  chosen_korean: 따로 떼어 놓으셨습니다
  alternatives_korean:
  - 분리하셨습니다
  - 떼어 놓으셨습니다
  lexicon: separo
  rationale: 앞의 segrego와 어휘를 구분해 반복을 살리되, 한국어에서는 ‘따로 떼어 놓다’로 보다 분명하게 대비를 드러냈습니다.
- source_word: Iacob, Esau
  english_pob_choice: Jacob and Esau
  chosen_korean: 야곱과 에서
  alternatives_korean:
  - 야곱과 에사우
  lexicon: proper names
  rationale: 성경에서 널리 통용되는 인명형을 사용해 가독성을 유지했습니다.
theological_decisions:
- issue: 문장이 중간에서 끊기는 미완성 구조
  chosen_reading: 원문과 EN POB처럼 문장을 완결하지 않고, 마지막을 ‘그런데 야곱은’으로 남겼습니다.
  alternative_readings:
  - 문장을 보충해 매끄럽게 완성함
  - 말줄임표를 덧붙여 완결된 듯 처리함
  rationale: 라틴어가 ‘et factus est Iacob’에서 끝나므로, 미완성 상태 자체를 보존하는 것이 본문 증거와 번역의 투명성에 더 부합합니다.
  doctrine_reference: textual fidelity
