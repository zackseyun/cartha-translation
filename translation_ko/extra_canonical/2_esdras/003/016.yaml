translation:
  language: ko
  text: 그리고 그에게 이삭을 주셨으며, 이삭에게는 야곱과 에서를 주셨습니다. 그리고 야곱은 당신을 위해 따로 세우셨고, 에서는 따로 떼어 놓으셨습니다. 그런데 야곱은[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 여기서 문장이 끝나므로, 한국어도 의도적으로 미완성으로 남겼습니다.
