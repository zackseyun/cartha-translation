source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: diligentiam. Et non abstulisti ab eis cor malignum, ut faceret
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/020.yaml
  text: Yet you did not take away from them the evil heart, so that your law might bear fruit in them.
translation:
  language: ko
  text: 그러나 주께서는 당신의 율법이 그들 안에서 열매를 맺도록, 그들에게서 악한 마음을 없애 주지는 않으셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et non abstulisti ab eis
  english_pob_choice: Yet you did not take away from them
  chosen_korean: 그러나 그들로부터 … 거두어 가지 않으셔서
  alternatives_korean:
  - 그러나 그들에게서 … 제거하지 않으셔서
  - 그리고 그들로부터 … 빼앗지 않으셔서
  lexicon: abstulisti
  rationale: abstulisti는 단순한 ‘없애다’보다 ‘거두어 가다/제거하다’의 뉘앙스를 가지므로, 하나님이 죄의 내적 성향을 제거하지 않으신다는 흐름을 살려 옮겼습니다.
- source_word: cor malignum
  english_pob_choice: the evil heart
  chosen_korean: 악한 마음
  alternatives_korean:
  - 악한 심장
  - 악한 심성
  - 악한 마음의 중심
  lexicon: cor + malignum
  rationale: 라틴 cor는 문자 그대로 심장이지만 여기서는 인격의 내적 중심을 가리키므로, 한국어에서 자연스럽고 문맥상 정확한 ‘마음’으로 옮겼습니다.
- source_word: ut faceret / ut ... bear fruit in them
  english_pob_choice: so that your law might bear fruit in them
  chosen_korean: 당신의 율법이 그들 안에서 열매를 맺게
  alternatives_korean:
  - 당신의 율법이 그들 안에서 열매를 맺도록
  - 당신의 율법이 그들 안에서 결실하게
  lexicon: faceret + fructum / bear fruit
  rationale: 영문 POB의 ‘bear fruit’는 결과가 실제로 드러나는 이미지를 살린 표현이므로, 관용적인 ‘열매를 맺다’를 사용했습니다. 라틴 본문에는 ‘율법’이 주어로 직접 드러나지 않지만, 영어 POB의 해석을 따라 문맥상 목적절을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 인간 내면의 악한 성향과 율법의 무력함을 어떻게 드러낼지
  chosen_reading: ‘악한 마음’을 제거하지 않으신 결과, 하나님의 율법이 그들 안에서 열매를 맺지 못하게 된 상황을 그대로 드러냈습니다.
  alternative_readings:
  - ‘악한 마음’을 제거하지 않으셔서 당신의 율법이 그들 안에서 열매를 맺지 못했습니다
  - ‘악한 마음’을 치워 주지 않으셔서 당신의 율법이 그들 안에서 효력을 내지 못했습니다
  rationale: 본문은 단순한 윤리 권면이 아니라, 인간의 내적 악과 하나님의 율법 사이의 긴장을 진술합니다. 따라서 율법의 ‘열매 맺음’이라는 이미지와 제거되지 않은 ‘악한 마음’의 원인 구조를 약화하지 않도록 유지했습니다.
  doctrine_reference: 율법과 인간 내면의 죄성, 바울적 긴장과 유사한 성경신학적 주제
