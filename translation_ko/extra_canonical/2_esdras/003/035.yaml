id: 2ES.3.35
reference: 2 Esdras 3:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut quando non peccaverunt in conspectu tuo qui habitant terram, aut quae gens sic observavit mandata tua?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/035.yaml
  text: Or when have those who dwell on the earth not sinned in your sight? Or what nation has so kept your commandments?
translation:
  language: ko
  text: 혹은 땅에 사는 이들 가운데 당신 앞에서 죄를 짓지 않은 이들이 언제 있었습니까? 혹은 어느 민족이 이렇게 당신의 명령들을 지켰습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aut quando non peccaverunt in conspectu tuo
  english_pob_choice: Or when have those who dwell on the earth not sinned in your sight?
  chosen_korean: “혹은 … 당신 앞에서 죄를 짓지 않은 이들이 언제 있었습니까?”
  alternatives_korean:
  - “혹은 … 당신 앞에서 죄를 짓지 않은 적이 언제 있었습니까?”
  - “혹은 … 당신 앞에서 범죄하지 않은 이들이 언제 있었습니까?”
  lexicon: peccare → 죄를 짓다
  rationale: 라틴어 peccaverunt는 단순한 실수보다 하나님 앞의 죄책을 가리키므로, 한국어도 관용적이면서 직접적인 “죄를 짓다”로 옮겼습니다.
- source_word: qui habitant terram
  english_pob_choice: those who dwell on the earth
  chosen_korean: “땅에 사는 이들”
  alternatives_korean:
  - “땅에 거하는 사람들”
  - “세상에 사는 사람들”
  lexicon: habitare → 살다 / 거하다
  rationale: terrra는 문자적으로 “땅”이지만, 여기서는 인류 일반을 가리키는 표현이므로 직역적 이미지를 살리면서도 한국어 자연스러운 “땅에 사는 이들”을 택했습니다.
- source_word: quae gens
  english_pob_choice: what nation
  chosen_korean: “어느 민족이”
  alternatives_korean:
  - “어떤 나라가”
  - “무슨 민족이”
  lexicon: gens → 민족
  rationale: gens는 정치적 국가보다 혈연·집단 정체성을 띤 “민족”이 더 정확하며, 질문의 수사도 자연스럽게 유지됩니다.
- source_word: sic observavit mandata tua
  english_pob_choice: so kept your commandments
  chosen_korean: “이렇게 당신의 명령들을 지켰습니까?”
  alternatives_korean:
  - “그렇게 당신의 계명들을 지켰습니까?”
  - “이처럼 당신의 명령을 지켰습니까?”
  lexicon: mandata → 명령들
  rationale: POB의 commandments에 맞추되, 구약적 언어인 “계명”보다 라틴어 mandata의 직접성에 가까운 “명령들”을 사용했습니다.
theological_decisions:
- issue: 보편적 인간 죄성에 대한 수사 질문의 톤
  chosen_reading: 본문을 단순 정보 질문이 아니라, 모든 땅의 사람들과 민족이 하나님의 기준 앞에서 죄에서 자유롭지 않다는 수사적 항변으로 유지했습니다.
  alternative_readings:
  - 중립적 역사 질문으로 완화하는 번역
  - 죄책을 덜 드러내는 표현
  rationale: 문맥상 화자는 보편적 인간 실패를 강조하고 있으므로, 수사적 긴장을 약화시키지 않도록 질문형 구조를 그대로 보존했습니다.
  doctrine_reference: 보편적 죄성/인간의 불순종
