revisions:
- from: 그에게 당신의 명령을 주셨지만, 그는 그것을 어겼습니다. 그리고 곧바로 그와 그의 후손들에게 죽음을 정하셨고, 그로부터는 민족들과 지파들과 백성들과 족속들이 태어났으니, 그 수는 셀 수 없었습니다.[a][b]
  to: 그에게 주님의 명령을 주셨지만, 그는 그것을 어겼습니다. 그리고 곧바로 그와 그의 후손들에게[a] 죽음을 정하셨고, 그에게서[b] 민족들과 지파들과 백성들과 족속들이 태어났으니, 그 수는 헤아릴 수 없습니다.
  rationale: 문장의 의미와 열거 구조는 유지하면서, 하나님께 드리는 호칭의 자연스러운 합쇼체 표현과 원문의 시제를 반영했습니다. 또한 두 원어 표현의 관계를 설명하는 주석을 각각의 해당 위치에 붙여 범위를 분명히 했습니다.
