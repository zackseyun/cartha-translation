id: 2ES.3.7
reference: 2 Esdras 3:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et huic mandasti diligentiam tuam ; et praeteriit eam, et statim instituisti in eum mortem et in nationibus eius, et natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/007.yaml
  text: And to him you gave your command; but he transgressed it, and at once you appointed death for him and for his descendants, and from him were born nations and tribes, peoples and clans, without number.
translation:
  language: ko
  text: 그에게 당신의 명령을 주셨지만, 그는 그것을 어겼습니다. 그리고 곧바로 그와 그의 후손들에게 죽음을 정하셨고, 그로부터는 민족들과 지파들과 백성들과 족속들이 태어났으니, 그 수는 셀 수 없었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문에는 diligentiam tuam이 나오지만, POB 영어본은 이를 ‘your command’로 이해했습니다. 한국어도 그 해석을 따랐습니다.
    reason: source_note
  - marker: b
    text: nationibus eius / ex eo gentes…는 ‘그의 후손들’과 ‘그로부터 난 민족들’이라는 두 층위를 함께 담습니다.
    reason: source_note
lexical_decisions:
- source_word: mandasti diligentiam tuam
  english_pob_choice: you gave your command
  chosen_korean: 당신의 명령을 주셨지만
  alternatives_korean:
  - 당신의 지시를 주셨지만
  - 당신의 부탁을 주셨지만
  lexicon: mandare / diligentia
  rationale: 라틴어 mandasti는 여기서 단순한 ‘명령하다/맡기다’의 의미로 읽히며, POB의 ‘your command’를 따라 한국어도 ‘명령’으로 옮겼습니다. diligence를 ‘부지런함’으로 좁히기보다 문맥상 ‘명령’이 더 적절합니다.
- source_word: praeteriit eam
  english_pob_choice: he transgressed it
  chosen_korean: 그는 그것을 어겼습니다
  alternatives_korean:
  - 그는 그것을 지나쳤습니다
  - 그는 그것을 지나가 버렸습니다
  lexicon: praeterire
  rationale: praeteriit은 단순한 통과가 아니라 주어진 명령을 어기고 넘어서는 행위를 뜻하므로, 한국어에서는 법적·윤리적 위반을 담는 ‘어기다’가 가장 자연스럽습니다.
- source_word: instituisti in eum mortem et in nationibus eius
  english_pob_choice: you appointed death for him and for his descendants
  chosen_korean: 그와 그의 후손들에게 죽음을 정하셨고
  alternatives_korean:
  - 그에게와 그의 후손들에게 죽음을 세우셨고
  - 그와 그의 نسل에게 죽음을 지정하셨고
  lexicon: instituere mortem
  rationale: instituisti는 ‘설정하다/정하다’의 의미로 읽히며, 죽음을 객관적 판결처럼 ‘정하셨고’로 옮기면 POB의 법정적 뉘앙스를 살릴 수 있습니다. nationes eius는 문맥상 ‘후손들’로 이해했습니다.
- source_word: natae sunt ex eo gentes et tribus, populi et cognationes, quorum non est numerus
  english_pob_choice: from him were born nations and tribes, peoples and clans, without number
  chosen_korean: 그로부터는 민족들과 지파들과 백성들과 족속들이 태어났으니, 그 수는 셀 수 없었습니다
  alternatives_korean:
  - 그에게서 민족들과 지파들과 백성들과 족속들이 나왔으니, 그 수는 셀 수 없었습니다
  - 그로부터 민족과 지파와 백성과 족속이 생겨났으니, 셀 수 없었습니다
  lexicon: natae sunt / gentes / tribus / populi / cognationes
  rationale: natae sunt ex eo는 ‘그로부터 태어났다’가 직접적이며, gentes/tribus/populi/cognationes는 사회적 범주를 누적적으로 열거하므로 ‘민족들/지파들/백성들/족속들’로 대응했습니다. quorum non est numerus는 관용적으로 ‘셀 수 없습니다’로 옮겼습니다.
theological_decisions:
- issue: 아담의 불순종 이후 죽음 선포의 법정적 표현
  chosen_reading: ‘죽음을 정하셨고’로 번역해, 단순한 결과 묘사보다 하나님의 판결적 선언을 드러냈습니다.
  alternative_readings:
  - ‘죽음이 임하게 하셨고’
  - ‘죽음을 내리셨고’
  rationale: 라틴어 institui mortem은 결과보다 처분·선포의 뉘앙스가 강하므로, 문맥상 심판의 성격을 살리는 번역이 더 적절합니다.
  doctrine_reference: 창 2–3의 불순종과 죽음 선고, 로마서 5장의 아담-인류 연관
