id: 2ES.3.19
reference: 2 Esdras 3:19
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tremere fecisti abyssos, et conturbasti saeculum. Et transiit gloria tua portas quattuor, ignis et terrae motus et spiritus et gelus; ut dares semini Iacob legem, et generationi Israel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/019.yaml
  text: and made the depths tremble and troubled the age. And your glory passed through the four gates—fire and earthquake and wind and frost—that you might give the law to the seed of Jacob[19], and your commandment to the generation of Israel.
  footnotes:
  - marker: '19'
    text: The phrase 'your glory passed through the four gates—fire and earthquake and wind and frost' is textually and imagistically difficult. The translation keeps the Latin's strange theophanic imagery rather than harmonizing it to Exodus.
    reason: textual_variant
translation:
  language: ko
  text: 깊음들을 떨게 하시고 세상을 뒤흔드셨습니다. 그리고 당신의 영광이 네 개의 문을 지나갔으니 — 불과 지진과 바람과 서리였습니다 — 이는 야곱의 씨에게 율법을 주시고 이스라엘의 نسل에게 당신의 명령을 주시기 위함이었습니다.[19]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '19'
    text: ‘네 개의 문—불과 지진과 바람과 서리’는 라틴 본문의 낯설고도 시적인 신현 이미지를 그대로 살린 번역입니다. 출애굽기의 익숙한 표현으로 매끈하게 맞추지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: abyssos
  english_pob_choice: the depths
  chosen_korean: 깊음들
  alternatives_korean:
  - 깊은 곳들
  - 심연
  lexicon: abyssos
  rationale: 라틴어 복수형 abyssos의 낯설고 우주적 이미지를 살리기 위해 단수화하지 않고 ‘깊음들’로 옮겼습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 세상
  alternatives_korean:
  - 시대
  - 세대
  lexicon: saeculum
  rationale: 문맥상 단순 연대보다 혼란에 휩싸인 현 세계를 가리키는 뉘앙스가 강해 ‘세상’으로 자연스럽게 옮겼습니다.
- source_word: porta[e] quattuor ... ignis et terrae motus et spiritus et gelus
  english_pob_choice: the four gates—fire and earthquake and wind and frost
  chosen_korean: 네 개의 문 — 불과 지진과 바람과 서리
  alternatives_korean:
  - 네 문 — 불과 지진과 바람과 서리
  - 네 개의 관문 — 불과 지진과 바람과 서리
  lexicon: porta; ignis; terrae motus; spiritus; gelus
  rationale: POB가 유지한 난해한 신현(神顯) 이미지를 그대로 살리기 위해 ‘문’과 네 요소의 병렬을 보존했고, gelus는 ‘서리’로 번역했습니다.
- source_word: legem ... et generationi Israel
  english_pob_choice: the law ... and your commandment
  chosen_korean: 율법 ... 당신의 명령
  alternatives_korean:
  - 법 ... 당신의 계명
  - 율법 ... 당신의 계명
  lexicon: lex / mandatum
  rationale: law는 토라적 의미가 분명하므로 ‘율법’으로, 뒤의 단수적 지시문은 규정 전체보다 개별적 ‘명령’이 더 잘 맞아 ‘명령’으로 옮겼습니다.
theological_decisions:
- issue: 2인칭 대명사와 직접화법의 신적 대상 표시
  chosen_reading: 본문의 ‘당신’은 신적 화자를 향한 직설로 유지하고, 영광의 주체를 문맥상 하나님으로 읽었습니다.
  alternative_readings:
  - ‘주님’으로 명시
  - 중립적 ‘그분’으로 완화
  rationale: 라틴 본문의 소유격과 행위 주체가 명확해, 한국어에서도 존칭 2인칭을 유지해 신현적 긴장을 살렸습니다.
  doctrine_reference: 신현 서술의 직설성 보존
- issue: ‘seed of Jacob’와 ‘generation of Israel’의 이중 대상
  chosen_reading: ‘야곱의 씨’와 ‘이스라엘의 نسل’로 두 표현을 분리해 병렬 구조를 보존했습니다.
  alternative_readings:
  - ‘야곱의 후손’과 ‘이스라엘의 후손’
  - 두 구를 모두 ‘후손’으로 통일
  rationale: 라틴어의 반복을 평준화하면 수사적 강조가 약해지므로, 첫 구는 전통적 성서 어휘 ‘씨’를 살리고 둘째 구는 집합적 후대를 가리키는 표현으로 구분했습니다.
  doctrine_reference: 수사적 병렬 보존
