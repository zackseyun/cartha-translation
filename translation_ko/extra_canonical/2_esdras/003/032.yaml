translation:
  language: ko
  text: 아니, 이스라엘 외에 어떤 민족이 주님을 알았습니까? 아니, 야곱과 같은 이 언약들을 믿은 어떤 지파들이 있었습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어의 haec Iacob는 문법상 ‘야곱’ 자체를 수식하기보다 앞의 복수명사(언약들/지파들)와 연결되는 표현으로 읽을 수 있어, 본문에서는 그 관계를 한국어 어순으로 풀어 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: aut alia gens cognovit te praeter Israhel?
  english_pob_choice: Or has any other nation known you besides Israel?
  chosen_korean: 이스라엘 외에 어떤 민족이 주님을 알았습니까?
  alternatives_korean:
  - 이스라엘 말고 다른 어떤 민족이 주님을 알았습니까?
  - 이스라엘 밖에 어떤 민족이 주님을 알았습니까?
  lexicon: gens → 민족; cognovit → 알았습니다/알았습니까
  rationale: gens는 혈통적·집단적 ‘민족’이 자연스럽고, 질문형 수사도 살려 ‘어떤 민족이 … 알았습니까’로 옮겼습니다. 영어 POB의 ‘known you’는 여기서 관계적 인지의 대상이 하나님이므로 예의와 문맥에 맞게 ‘주님’을 보완했습니다.
- source_word: aut quae tribus crediderunt testamentis
  english_pob_choice: Or what tribes have believed the covenants
  chosen_korean: 아니, … 어떤 지파들이 있었습니까?
  alternatives_korean:
  - 아니, … 어떤 지파들이 언약들을 믿었습니까?
  - 아니, … 어떤 지파들이 그 언약들을 신뢰했습니까?
  lexicon: tribus → 지파; crediderunt → 믿었습니다; testamentis → 언약들
  rationale: tribus는 이 문맥에서 이스라엘의 ‘지파’가 분명하므로 그대로 살렸고, testamentis는 복수형을 유지해 ‘언약들’로 옮겼습니다. crediderunt는 단순 지적 인식보다 신뢰·충성을 포함하므로 ‘믿었습니다’가 가장 직접적입니다.
- source_word: sicut haec Iacob
  english_pob_choice: like this Jacob
  chosen_korean: 야곱과 같은 이 언약들을
  alternatives_korean:
  - 이 야곱처럼
  - 야곱 같은 이처럼
  lexicon: sicut → 같이/처럼; haec → 이; Iacob → 야곱
  rationale: 라틴어 해석상 haec는 Iacob를 수식하는 말이 아니라 앞의 testamentis/tribus와 연결되는 지시어로 읽는 것이 문법적으로 자연스럽기 때문에, 한국어에서는 ‘이 언약들’을 앞에 두어 수식 관계를 드러냈습니다. 다만 절의 수사적 압박감을 살리기 위해 간결한 어순을 유지했습니다.
theological_decisions:
- issue: 언약들(testamentis)의 복수 유지
  chosen_reading: 단수 ‘언약’이 아니라 복수 ‘언약들’로 옮겼습니다.
  alternative_readings:
  - 언약
  - 약속들
  rationale: 라틴어 복수형 testamentis를 그대로 반영해, 하나의 추상적 계약이 아니라 하나님이 이스라엘과 맺으신 여러 언약의 역사성을 드러냅니다.
  doctrine_reference: 구약-이스라엘 언약사 전반
