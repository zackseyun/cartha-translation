revisions:
- from: 그리고 땅 위에 사는 이들이 번성하기 시작했을 때, 그들은 자녀들과 백성과 많은 민족들을 번성시켰고, 그들은 다시 이전 사람들보다 더 많이 불경하게 행하기 시작했습니다.[a]
  to: 그리고 땅 위에 사는 이들이 번성하기 시작했을 때, 그들은 자녀와 백성과 많은 민족을 늘렸고, 다시 이전 사람들보다 더 불경을 저지르기 시작했습니다.
  rationale: 라틴어의 두 번의 multiplic- 표현을 각각 ‘번성하기’와 ‘늘리다’로 옮겨 수적 증가의 반복을 유지했습니다. impietatem facere는 자연스러운 한국어 관용 표현인 ‘불경을 저지르다’로 옮겼고, 비교 표현 plus quam priores도 ‘이전 사람들보다 더’로 보존했습니다. 불필요하게 해석을 확장하는 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:38Z'
review_pass:
  verdict: revise
  source_fidelity: ‘번성시켰고’는 한국어에서 자녀·백성·민족을 목적어로 취할 때 다소 부자연스럽고, 의도적으로 수를 증가시킨다는 뉘앙스를 강하게 낼 수 있습니다. ‘늘렸고’가 multiplicauerunt의 반복 및 목적어 구성을 더 자연스럽게 보존합니다. 또한 priores는 ‘이전 사람들’로 비교 대상을 명시하는 것이 적절합니다.
  naturalness: 원문의 병렬과 반복을 유지하되, ‘자녀들과 백성과 많은 민족들을 번성시켰고’ 대신 ‘자녀와 백성과 많은 민족을 늘렸고’로 고쳐 현대 표준어 문장을 자연스럽게 했습니다. ‘불경을 저지르다’는 impietatem facere에 맞는 자연스러운 결합입니다.
  terminology: impietas는 하나님을 향한 불경을 포함하지만, 본문 자체에 없는 설명을 덧붙이지 않기 위해 해설 각주는 제거했습니다. ‘불경’은 종교적·도덕적 무경건을 포괄하면서도 특정 교리적 해석을 강요하지 않습니다.
  issues:
  - severity: medium
    issue: ‘자녀들과 백성과 많은 민족들을 번성시켰고’의 어색한 목적어 결합
    rationale: ‘번성시키다’는 이 목적어들과 결합할 수는 있으나 한국어에서는 부자연스럽고, 본문보다 강한 타동적·의도적 뉘앙스를 낼 수 있습니다. ‘늘리다’가 수적 증가라는 multiplicare의 의미를 더 자연스럽게 전달합니다.
  - severity: low
    issue: 각주가 본문에 명시되지 않은 ‘하나님’을 해설로 특정함
    rationale: impietas의 일반적 의미와 부합할 수 있으나, 이 절의 번역에는 필수적이지 않으며 본문이 표현하지 않은 신학적 설명을 보탭니다. 무각주가 더 절제되어 있습니다.
  revised_text: 그리고 땅 위에 사는 이들이 번성하기 시작했을 때, 그들은 자녀와 백성과 많은 민족을 늘렸고, 다시 이전 사람들보다 더 불경을 저지르기 시작했습니다.
