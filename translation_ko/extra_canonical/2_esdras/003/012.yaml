id: 2ES.3.12
reference: 2 Esdras 3:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et factum est cum coepissent multiplicari qui habitabant super terram, et multiplicauerunt filios et populos et gentes multas, et coeperunt iterato impietatem facere plus quam priores.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/012.yaml
  text: And it happened that when those who lived on the earth began to multiply, they multiplied children and peoples and many nations, and they began again to act impiously, more than those before them.
translation:
  language: ko
  text: 그리고 땅 위에 사는 이들이 번성하기 시작했을 때, 그들은 자녀와 백성과 많은 민족을 늘렸고, 다시 이전 사람들보다 더 불경을 저지르기 시작했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: multiplicari / multiplicauerunt
  english_pob_choice: began to multiply / multiplied
  chosen_korean: 번성하기 시작했을 때 / 번성시켰고
  alternatives_korean:
  - 증가하기 시작했을 때 / 증가시켰고
  - 많아지기 시작했을 때 / 많아지게 했고
  lexicon: multiplicare
  rationale: 라틴어의 반복된 multiplic- 어근을 반영해 단순한 출생이 아니라 수적 증가·번성을 나타내는 동사를 택했습니다. English POB의 최신 수정처럼 begot보다 multiply의 의미를 살렸습니다.
- source_word: super terram
  english_pob_choice: those who lived on the earth
  chosen_korean: 땅 위에 사는 이들
  alternatives_korean:
  - 땅에 사는 사람들
  - 지상에 거주하는 이들
  lexicon: terra
  rationale: 지구/땅 위의 거주자를 가리키는 표현으로, 자연스럽고 직역에 가까운 표준어를 사용했습니다.
- source_word: impietatem facere
  english_pob_choice: act impiously
  chosen_korean: 불경하게 행하기
  alternatives_korean:
  - 경건하지 않게 행하기
  - 악하게 행하기
  lexicon: impietas
  rationale: impietas의 핵심인 하나님에 대한 불경·불경건을 드러내되, 도덕적 악으로만 좁히지 않기 위해 ‘불경하게’로 옮겼습니다.
theological_decisions:
- issue: 반복 동사와 도덕적 퇴행의 강조
  chosen_reading: 수적 번성 이후에도 이전 세대보다 더 심한 불경이 다시 시작된 것으로 읽었습니다.
  alternative_readings:
  - 단순한 인구 증가 서술로만 읽을 수 있습니다.
  - ‘불경하게 행하다’를 일반적 악행으로 완화해 읽을 수 있습니다.
  rationale: 본문은 번성과 불경의 병치를 통해 인간 사회의 확대가 곧 신실함을 의미하지 않음을 강조합니다. 영어 POB의 ‘more than those before them’도 이 비교를 유지합니다.
  doctrine_reference: 창세기적 타락 서사와 인간의 보편적 죄성에 대한 본문 흐름
