lexical_decisions:
- source_word: in multitudine magna
  english_pob_choice: in a great multitude
  chosen_korean: 큰 무리 가운데서
  alternatives_korean:
  - 큰 무리 속에서
  - 큰 무리 안에서
  - 큰 무리 가운데
  lexicon: multitudo → 무리
  rationale: 라틴어 구문은 장소적 배경을 나타내는 짧은 전치사구이므로, 한국어도 단정한 서술보다 배경 표현인 ‘큰 무리 가운데서’로 옮기는 것이 가장 자연스럽고 원문 밀도를 유지합니다.
- source_word: Et factum est
  english_pob_choice: And it happened
  chosen_korean: 그리고 이런 일이 있었습니다
  alternatives_korean:
  - 그리고 일이 있었습니다
  - 그리하여 이런 일이 있었습니다
  - 그리고 그것이 일어났습니다
  lexicon: et factum est → 되다/일어나다 관용구
  rationale: 성서 라틴어의 관용적 서두를 한국어 합쇼체로 옮기되, 단순 연결어보다 사건 전환을 드러내는 ‘이런 일이 있었습니다’가 원문의 서술 기능을 잘 살립니다.
- source_word: cum educeres semen
  english_pob_choice: when you led the seed out
  chosen_korean: 곧 당신이 씨를 이끌어 내실 때
  alternatives_korean:
  - 당신이 씨를 이끌어 내실 때
  - 씨를 이끌어 내실 때
  - 당신이 그 씨를 이끌어 내실 때
  lexicon: semen → 씨
  rationale: 라틴어 semen을 직역해 ‘씨’로 유지하고, POB의 수정 방향에 맞춰 출애굽·시내산 추가는 배제했습니다. ‘곧’은 cum의 시간적 선행을 살리는 연결 표현입니다.
theological_decisions:
- issue: 본문 범위가 제공된 라틴어 단편으로 제한됨
  chosen_reading: 출애굽, 시내산, ‘그의 씨’ 등은 본문 단편에 없으므로 번역에 넣지 않았습니다.
  alternative_readings:
  - English POB의 이전 각주처럼 애굽과 시내산을 포함한 확장 독해
  - ‘his seed’로 보충하는 번역
  rationale: 제공된 소스 텍스트만을 근거로 번역해야 하므로, 후대 보정이나 이전 렌더링의 확장을 본문에 되돌리지 않았습니다.
  doctrine_reference: source-criticism / textual discipline
