  yaml_path: translation/extra_canonical/2_esdras/003/022.yaml
  text: Thus weakness became permanent, and the law was in the heart of the people with the evil root; and what was good departed, and what was evil remained.
translation:
  language: ko
  text: 이렇게 지속적인 약함이 생겨났고, 율법은 악한 뿌리와 함께 백성의 마음속에 있었으며, 선한 것은 떠나가고 악한 것은 남아 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: infirmitas
  english_pob_choice: weakness
  chosen_korean: 약함
  alternatives_korean:
  - 연약함
  - 무력함
  lexicon: infirmitas
  rationale: POB가 ‘weakness’로 잡은 추상 명사를 그대로 살려 ‘약함’으로 옮겼으며, 개인적 연약함보다 상태의 지속을 강조하기에 적합합니다.
- source_word: lex
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 규례
  lexicon: lex
  rationale: 본문의 lex는 일반 규범보다 언약적·종교적 규범을 가리키므로, 한국어 성경 용례에 맞는 ‘율법’이 가장 직접적입니다.
- source_word: cum malignitate radicis
  english_pob_choice: with the evil root
  chosen_korean: 악한 뿌리와 함께
  alternatives_korean:
  - 악한 뿌리와 더불어
  - 악의 뿌리와 함께
  lexicon: cum + malignitas + radix
  rationale: 라틴어의 동반 표현을 자연스럽게 살리되, POB의 수정처럼 단순 병렬보다 ‘함께’를 사용해 결합 관계를 보존했습니다.
- source_word: discessit quod bonum est / mansit quod malum est
  english_pob_choice: what was good departed, and what was evil remained
  chosen_korean: 선한 것은 떠나가고 악한 것은 남아 있었습니다
  alternatives_korean:
  - 좋은 것은 떠나가고 악한 것은 남아 있었습니다
  - 선한 것은 사라지고 악한 것은 남아 있었습니다
  lexicon: parallel clauses
  rationale: POB의 균형 잡힌 재구성을 따라 양쪽 절을 모두 ‘~은/는’ 구조로 대칭시켜, 선과 악의 대조를 분명하게 했습니다.
theological_decisions:
- issue: ‘law’의 종교적 성격
  chosen_reading: 율법으로 옮겨, 백성 내부에 자리 잡은 왜곡된 종교적·도덕적 질서를 드러내게 했습니다.
  alternative_readings:
  - 법으로 옮겨 더 일반적인 규범 의미를 살리는 읽기
  - 규례로 옮겨 관습적 명령의 뉘앙스를 살리는 읽기
  rationale: 이 단락은 단순한 사회 규범이 아니라 백성의 내면과 결합된 언약적 질서의 붕괴를 말하므로, ‘율법’이 문맥의 무게를 가장 잘 전달합니다.
  doctrine_reference: Second Temple Jewish moral corruption; wisdom-style diagnostic lament
