translation:
  language: ko
  text: 그들은 아담과 그의 모든 후손들이 한 것처럼 모든 일에서 행하였으니, 그들도 악한 마음을 가지고 있었기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 마음을 사용하고 있었다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: in omnibus
  english_pob_choice: in all things
  chosen_korean: 모든 일에서
  alternatives_korean:
  - 모든 것에서
  - 전부에서
  - 모든 면에서
  lexicon: Latin omnibus
  rationale: 라틴어 전치사구를 자연스러운 한국어로 옮기되, 범위를 넓게 포괄하는 ‘모든 일에서’로 원문의 총체성을 살렸습니다.
- source_word: facientes sicut fecit Adam et omnes generationes eius
  english_pob_choice: doing in all things as Adam and all his generations did
  chosen_korean: 아담과 그의 모든 نسل들이 한 것처럼 행하였으니
  alternatives_korean:
  - 아담과 그의 모든 نسل들이 한 대로 행하였으니
  - 아담과 그의 모든 نسل들이 행한 것처럼 행하였으니
  lexicon: Latin fecit / facientes
  rationale: 행동의 반복성과 비교를 살려 ‘한 것처럼 행하였으니’로 옮겼고, 동사 ‘행하다’로 서술의 직접성을 유지했습니다.
- source_word: cor malignum
  english_pob_choice: an evil heart
  chosen_korean: 악한 마음
  alternatives_korean:
  - 악한 마음을
  - 악한 심령
  - 악한 속마음
  lexicon: Latin cor malignum
  rationale: 라틴어 cor는 히브리적 인간 내면을 가리키는 표현이므로, 관용적으로 이해 가능한 ‘마음’으로 옮기되 도덕적 상태를 드러내는 ‘악한’으로 유지했습니다.
theological_decisions:
- issue: ‘evil heart’의 상태 표현
  chosen_reading: 그들도 악한 마음을 가지고 있었기 때문입니다
  alternative_readings:
  - 그들도 악한 마음을 썼기 때문입니다
  - 그들도 악한 마음을 지녔기 때문입니다
  rationale: 원문의 utebantur를 ‘사용했다’로 이해하면 도구적 의미가 강해져, 본문이 말하는 내적 상태와 상속된 부패의 의미가 약해집니다. 그래서 POB 개정 취지에 따라 ‘가지고 있었다’는 상태 표현을 택했습니다.
  doctrine_reference: 인간의 타락과 내적 부패에 관한 본문 의미 보존
