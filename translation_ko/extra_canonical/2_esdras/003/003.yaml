  yaml_path: translation/extra_canonical/2_esdras/003/003.yaml
  text: And my spirit was greatly stirred[a], and I began to speak fearful words to the Most High,
  footnotes:
  - marker: a
    text: Or 'fearful words'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 내 영이 크게 동요되었고, 나는 지극히 높으신 분께 두려움에 찬[a] 말을 하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘두려운 말’입니다. 문맥상 말하는 이의 두려움이나 경외가 배어 있는 말을 가리킵니다.
    reason: ‘uerba timorata’의 직역적 표현과 문맥상 의미를 구분하여 제시합니다.
lexical_decisions:
- source_word: uentilatus est spiritus meus ualde
  english_pob_choice: And my spirit was greatly stirred
  chosen_korean: 내 영이 크게 동요되었고
  alternatives_korean:
  - 내 영이 크게 흔들렸고
  - 내 영이 몹시 요동쳤고
  lexicon: spiritus → 영; uentilatus est → 동요되다
  rationale: lat. uentilatus est는 단순한 감정 표현보다 ‘휘둘리다/흔들리다’의 뉘앙스가 있어, 한국어로는 문맥상 자연스럽고 내적 동요를 살리는 ‘동요되다’가 가장 가깝습니다.
- source_word: ad altissimum
  english_pob_choice: to the Most High
  chosen_korean: 지극히 높으신 분께
  alternatives_korean:
  - 가장 높으신 분께
  - 지극히 높으신 이께
  lexicon: altissimus → 지극히 높으신 분
  rationale: 라틴어 최상급 호칭을 신격 칭호로 살리되, 한국어에서 자연스럽고 경외감을 유지하는 ‘지극히 높으신 분’으로 옮겼습니다.
- source_word: uerba timorata
  english_pob_choice: fearful words
  chosen_korean: 두려움에 찬 말
  alternatives_korean:
  - 두려운 말
  - 두려워하는 말
  lexicon: timorata → 두려움에 찬
  rationale: POB의 수정 이력처럼 여기서의 timorata는 말을 ‘무섭게 만드는’ 뜻보다 말하는 자의 떨림과 경외를 나타내므로, ‘두려움에 찬’으로 본 뜻을 보존했습니다.
theological_decisions:
- issue: ‘Most High’의 신격 호칭 처리
  chosen_reading: ‘지극히 높으신 분’은 하나님의 초월성과 위엄을 드러내는 호칭으로 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지존자’
  rationale: 본문은 에스라가 하나님께 직접 말하는 장면이므로, 경외의 호칭을 완화하지 않고 한국어 예배 문체에도 어울리는 표현으로 옮겼습니다.
  doctrine_reference: 하나님의 초월성
- issue: ‘fearful words’의 정서적 강도
  chosen_reading: ‘두려움에 찬 말’로, 말의 내용보다 발화자의 경외·주저함을 강조했습니다.
  alternative_readings:
  - ‘무서운 말’
  - ‘불안한 말’
  rationale: 라틴어 timorata는 대상이 무서운 말이라기보다 두려움이 배어 있는 말이라는 뜻에 가깝기 때문에, 발화 태도를 드러내는 번역이 문맥에 더 적합합니다.
  doctrine_reference: 기도와 경외의 태도
