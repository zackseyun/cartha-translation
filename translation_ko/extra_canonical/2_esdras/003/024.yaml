  source_fidelity: 라틴어 ‘Et dixisti ei … et offerre tibi in ea de tuis oblationes’를 충실히 반영합니다. ‘그에게 말씀하시고’는 앞 문맥의 다윗을 받는 자연스러운 표현이며, ‘당신의 이름을 위해 성읍을 세우고’와 ‘그곳에서 … 제물을 당신께 드리게 하셨습니다’가 명령 내용과 병렬 구조를 보존합니다. 다만 ‘당신의 것들로’는 de tuis를 지나치게 복수화하여 한국어에서 부자연스러우므로 ‘당신의 것으로’가 더 정확하고 자연스럽습니다.
  naturalness: ‘그러고는’보다 문맥 접속사 ‘그리고’가 현대 문어체 성경 번역에서 더 중립적입니다. 또한 ‘제물을 당신께 드리라고 하셨습니다’보다 ‘제물을 당신께 드리게 하셨습니다’가 앞의 ‘말씀하시고’와 연결된 명령의 내용을 매끄럽게 나타냅니다.
  terminology: ‘성읍’, ‘이름’, ‘제물’, ‘드리다’는 문맥과 제의적 의미에 적절합니다. 원문에는 본문 의미에 영향을 주는 이문이나 대안 독법이 없으므로, 영어 표현상의 대안에서 유래한 현 각주는 한국어 본문에 유지할 필요가 없습니다.
