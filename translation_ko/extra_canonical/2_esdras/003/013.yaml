  source_fidelity: 라틴어 cum iniquitatem facerent coram te와 elegisti tibi ex his unum은 대체로 충실히 옮겼습니다. 다만 초안은 et factum est(‘그리고 일이 일어났습니다’)를 서술 연결로 흡수하여 명시적으로 나타내지 않으므로, 이를 보완하는 것이 안전합니다. unum은 사람을 뜻하는 명사를 덧붙이지 않고 ‘하나’로 유지해야 합니다.
  naturalness: ‘그들 가운데서 하나를 자신을 위해’는 ‘자신’의 지시 대상이 문법상 다소 불분명하고 한국어로도 매끄럽지 않습니다. ‘당신 자신을 위하여’로 하면 하나님을 향한 2인칭 기도 문맥과 tibi의 방향성이 분명해집니다. 사건 도입구는 짧은 독립문으로 처리해 자연스러움을 유지했습니다.
  terminology: iniquitatem의 ‘불의’는 적절하며, coram te의 ‘당신 앞에서’와 선택 동사 ‘택하셨습니다’도 현대 격식체에 맞습니다. unum에 ‘한 사람’을 보충하지 않았습니다.
  issues:
  - severity: medium
    issue: et factum est가 명시적으로 번역되지 않았습니다.
    rationale: 원문은 ‘그리고 일이 일어났습니다’라는 사건 전개 표지를 포함합니다. 한국어의 조건절만으로 처리하면 그 표지가 소실되므로, 짧게나마 드러내는 편이 원문 충실성에 더 가깝습니다.
  - severity: low
    issue: ‘자신을 위해’의 지시 대상이 다소 모호합니다.
    rationale: 기도문 안의 2인칭 주어를 가리키는 표현이므로 ‘당신 자신을 위하여’가 tibi를 더 분명하고 자연스럽게 전달합니다.
  revised_text: 그들이 당신 앞에서 불의를 저지르고 있을 때에, 이런 일이 있었습니다. 당신께서는 그들 가운데서 하나를 당신 자신을 위하여 택하셨습니다.
