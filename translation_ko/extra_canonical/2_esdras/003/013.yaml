  text: impietatem facere plus quam priores. Et factum est cum iniquitatem facerent coram te, elegisti tibi ex his unum, cui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/003/013.yaml
  text: And it happened, when they were committing iniquity before you, you chose for yourself one from among them,
translation:
  language: ko
  text: 그들이 당신 앞에서 불의를 저지르고 있을 때에, 이런 일이 있었습니다. 당신께서는 그들 가운데서 하나를 당신 자신을 위하여 택하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: factum est
  english_pob_choice: And it happened
  chosen_korean: 그들이…있었을 때
  alternatives_korean:
  - 일이 이렇게 되었습니다
  - 그 일이 일어났습니다
  lexicon: source_note
  rationale: 라틴어의 사건 전개 접속구를 한국어에서는 자연스러운 서술 연결로 풀어, 다음 절로 이어지는 역사적 서술감을 살렸습니다.
- source_word: cum iniquitatem facerent coram te
  english_pob_choice: when they were committing iniquity before you
  chosen_korean: 그들이 당신 앞에서 불의를 저지르고 있었을 때
  alternatives_korean:
  - 그들이 당신 앞에서 죄악을 행하고 있었을 때
  - 그들이 당신 앞에서 불법을 저지르고 있을 때
  lexicon: source_note
  rationale: iniquitatem을 단순한 일반 죄보다 강한 ‘불의’로 옮겨, 하나님 앞에서의 도덕적·언약적 반역을 드러냈습니다.
- source_word: elegisti tibi ex his unum
  english_pob_choice: you chose for yourself one from among them
  chosen_korean: 당신은 그들 가운데서 하나를 자신을 위해 택하셨습니다
  alternatives_korean:
  - 당신은 그들 가운데서 하나를 택하셨습니다
  - 당신은 그들 중 한 사람을 당신 자신을 위해 선택하셨습니다
  lexicon: source_note
  rationale: 라틴어의 unum은 단지 ‘하나’이므로, 영어 개정처럼 ‘한 사람’을 덧붙이지 않고 ‘하나’를 유지했습니다. tibi는 선택의 귀속성을 살려 ‘자신을 위해’로 옮겼습니다.
theological_decisions:
- issue: 선택 행위의 방향성
  chosen_reading: 하나님이 ‘자신을 위해’ 그들 가운데서 하나를 택하신다는 표현을 유지했습니다.
  alternative_readings:
  - 그들 가운데서 하나를 택하셨습니다
  - 자기 소유로 하나를 택하셨습니다
  rationale: 원문의 tibi는 선택이 단순한 임의적 선발이 아니라 선택하시는 분의 목적과 소속을 드러내므로, 이를 약화시키지 않기 위해 목적성을 살렸습니다.
  doctrine_reference: 신적 선택과 소명
- issue: 불의의 성격
  chosen_reading: iniquitatem을 ‘불의’로 번역했습니다.
  alternative_readings:
  - 죄악
  - 악행
  rationale: 문맥상 단순 행위보다 하나님 앞에서의 왜곡된 상태와 행위를 함께 가리키므로, 더 넓은 윤리적·언약적 함의를 지닌 ‘불의’가 적절합니다.
  doctrine_reference: 죄와 언약 신학
