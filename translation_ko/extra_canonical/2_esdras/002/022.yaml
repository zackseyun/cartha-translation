review_pass:
  verdict: revise
  source_fidelity: 라틴어 Mortuos ubi inueneris는 ‘죽은 자들을 어디에서든 발견하면’으로, signans commenda sepulchro는 죽은 이들에게 표를 하고 무덤에 맡기라는 명령으로 충실히 옮겨야 합니다. 끝의 et dabo는 목적어 없이 미완으로 끝나는 ‘그리고 내가 주겠습니다’로 보존하는 것이 맞습니다.
  naturalness: 초안의 ‘그러면’은 결과·조건의 관계를 더하는 표현이라, 단순 접속사 et보다 강합니다. ‘그리고’가 원문의 연결을 더 정확히 살리며, ‘어디서든’은 현대 표준어에서 더 자연스럽습니다.
  terminology: ‘죽은 자들’, ‘표시하다’, ‘무덤에 맡기다’는 의미상 가능하나, 장례 문맥에서 ‘그들에게 표를 하고’는 signans의 대상을 한국어에서 더 분명히 드러냅니다. 신학 용어상 문제는 없습니다.
  issues:
  - severity: medium
    issue: ‘그러면’이 et를 결과 접속으로 해석함
    rationale: 라틴어 et는 단순히 ‘그리고’이며, 제시된 절만으로 조건-결과 관계를 확정할 근거가 없습니다.
  - severity: low
    issue: ‘어디에서든’의 다소 부자연스러운 표현
    rationale: 의미 오류는 아니지만, ‘어디서든’이 현대 한국어에서 더 간결하고 자연스럽습니다.
  revised_text: 네가 죽은 자들을 어디서든 발견하면, 그들에게 표를 하고 무덤에 맡기십시오. 그리고 내가 주겠습니다.
