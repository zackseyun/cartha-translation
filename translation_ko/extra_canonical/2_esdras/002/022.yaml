  text: Mortuos ubi inueneris, signans commenda sepulchro, et dabo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/022.yaml
  text: Wherever you find the dead, mark them and commit them to the grave, and I will give
translation:
  language: ko
  text: 네가 죽은 자들을 어디서든 발견하면, 그들에게 표를 하고 무덤에 맡기십시오. 그리고 내가 주겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Mortuos ubi inueneris
  english_pob_choice: Wherever you find the dead
  chosen_korean: 네가 죽은 자들을 어디에서든 발견하면
  alternatives_korean:
  - 죽은 자들을 어디서든 찾으면
  - 죽은 이들을 어디에서든 만나면
  lexicon: mortuus / invenio
  rationale: Mortuos는 단순한 ‘죽은 사람들’보다 상태를 드러내는 ‘죽은 자들’이 자연스럽고, ubi inueneris는 위치보다 조건을 나타내므로 ‘어디에서든 발견하면’으로 옮겼습니다.
- source_word: signans
  english_pob_choice: mark them
  chosen_korean: 그들을 표시하고
  alternatives_korean:
  - 그들에게 표를 하고
  - 그들을 표지하고
  lexicon: signo
  rationale: signans는 시신을 식별·구별하기 위한 동작으로 보이므로 ‘표시하다’가 가장 직접적입니다.
- source_word: commenda sepulchro
  english_pob_choice: commit them to the grave
  chosen_korean: 무덤에 맡기십시오
  alternatives_korean:
  - 무덤에 넘기십시오
  - 무덤에 모시십시오
  lexicon: commendo / sepulchrum
  rationale: commenda는 ‘맡기다, 위탁하다’의 뉘앙스를 지니며, sepulchro는 ‘무덤’이므로 장례적·위탁적 이미지를 살려 ‘무덤에 맡기십시오’로 했습니다.
- source_word: et dabo
  english_pob_choice: and I will give
  chosen_korean: 그러면 내가 주겠습니다
  alternatives_korean:
  - 그리고 내가 주겠습니다
  - 내가 또한 주겠습니다
  lexicon: do
  rationale: 문장에 뒤따를 목적어가 생략되어 있어 한국어에서는 단순 접속 ‘그리고’보다 결과를 열어 두는 ‘그러면’이 자연스럽지만, 원문의 미래형 약속은 유지했습니다.
theological_decisions:
- issue: et dabo의 목적어 생략
  chosen_reading: 대상은 본문에 제시되지 않았으므로 한국어에서도 목적어를 보충하지 않고 열린 약속으로 남겼습니다.
  alternative_readings:
  - 그리고 내가 그것을 주겠습니다
  - 그리고 내가 너에게 주겠습니다
  rationale: 라틴 본문은 목적어 없이 끝나며, 인접 절이 없으므로 내용을 추측해 보충하면 원문 경계를 넘게 됩니다.
  doctrine_reference: 원문 충실성 및 절 경계 보존
