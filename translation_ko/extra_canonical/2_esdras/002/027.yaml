  yaml_path: translation/extra_canonical/2_esdras/002/027.yaml
  text: Others will weep and be sorrowful[a], but you will be cheerful and abundant. The nations will be jealous, and they will be able to do nothing against you, says the Lord.
  footnotes:
  - marker: a
    text: Or 'The nations will be jealous, but they will be able to do nothing against you, says the Lord.'.
    reason: previous_rendering
translation:
  language: ko
  text: 다른 사람들은 울며 슬퍼할 것이지만, 여러분은 즐겁고 풍성할 것입니다. 민족들은 질투하겠지만, 여러분을 대적하여 아무것도 할 수 없을 것입니다. 주님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풍성할 것입니다’는 copiosa의 물질적·상태적 충만함을 함께 반영한 번역입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: alii plorabunt et tristes erunt
  english_pob_choice: Others will weep and be sorrowful
  chosen_korean: 다른 사람들은 울며 슬퍼할 것이지만
  alternatives_korean:
  - 다른 이들은 울고 슬퍼할 것이지만
  - 다른 사람들은 통곡하며 근심할 것이지만
  lexicon: plorare; tristis
  rationale: 두 동사는 각각 ‘울다’와 ‘슬퍼하다’로 직접 옮겨 원문의 이중 진술을 살렸습니다.
- source_word: hilaris et copiosa eris
  english_pob_choice: you will be cheerful and abundant
  chosen_korean: 여러분은 즐겁고 풍성할 것입니다
  alternatives_korean:
  - 당신은 유쾌하고 넘칠 것입니다
  - 여러분은 기쁘고 풍요로울 것입니다
  lexicon: hilaris; copiosus
  rationale: hilaris는 단순한 감정의 밝음으로, copiosa는 물질적·상태적 충만함까지 포괄하는 ‘풍성하다’로 번역했습니다.
- source_word: Zelabunt gentes
  english_pob_choice: The nations will be jealous
  chosen_korean: 민족들은 질투하겠지만
  alternatives_korean:
  - 민족들은 시기하겠지만
  - 민족들은 질투하여 분노하겠지만
  lexicon: zelare
  rationale: zelabunt는 경쟁적 시기와 질투의 뉘앙스를 가지므로, 가장 직접적인 ‘질투하다’로 유지했습니다.
- source_word: nihil adversus te poterunt
  english_pob_choice: they will be able to do nothing against you
  chosen_korean: 여러분을 대적하여 아무것도 할 수 없을 것입니다
  alternatives_korean:
  - 여러분을 거슬러 아무것도 하지 못할 것입니다
  - 여러분에게 맞서 아무 일도 해내지 못할 것입니다
  lexicon: adversus; posse
  rationale: adversus te를 ‘대적하여’로 옮겨 적대 방향을 분명히 했고, nihil…poterunt는 능력 부정을 그대로 살렸습니다.
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주님이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: dicit; dominus
  rationale: dominus는 이 문맥에서 하나님의 발화 표지이므로 ‘주님’으로 번역했고, 직접 인용 종결형에 맞게 현재형으로 처리했습니다.
theological_decisions:
- issue: 복수 대상 호칭의 일관성
  chosen_reading: 문맥상 공동체 전체를 향한 약속이므로 2인칭을 ‘여러분’으로 옮겼습니다.
  alternative_readings:
  - ‘당신은’으로 단수형을 유지
  - 불특정 복수의 ‘너희는’ 사용
  rationale: 라틴어 eris는 단수형이지만, 이 절의 약속은 공동체적 청중에게 주어지는 것으로 읽히며 한국어 독자에게는 ‘여러분’이 더 자연스럽고 공손합니다.
  doctrine_reference: 문맥적 수신자 이해와 한국어 공손 표현
- issue: 원문의 두 대조절 보존
  chosen_reading: ‘다른 사람들은…’과 ‘민족들은…’을 모두 살려 대조를 유지했습니다.
  alternative_readings:
  - 후반부만 번역
  - 두 절을 하나로 완만하게 합침
  rationale: 개정된 영어 POB와 라틴어 모두 앞부분(타인의 슬픔과 공동체의 풍성함)과 뒷부분(민족들의 질투와 무력함)을 분리해 말하므로, 둘을 모두 분명히 드러내야 합니다.
  doctrine_reference: 본문 경계와 대조 구조 보존
