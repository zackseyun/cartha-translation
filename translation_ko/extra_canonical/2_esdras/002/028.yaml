  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: ko
  text: 내 손이 너를 덮어 주어 네 자녀들이 게헨나[a]를 보지 못하게 할 것이다. 기뻐하십시오,
  philosophy: optimal-equivalence
