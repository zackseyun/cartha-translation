  text: My hands will cover you, so that your children may not see Gehenna. Rejoice,
translation:
  language: ko
  text: 내 손이 너를 덮어 줄 것이니, 네 자녀들이 게헨나를 보지 못하게 하려는 것입니다. 기뻐하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게헨나(Gehenna)는 라틴 본문이 보존한 종말론적 심판 용어입니다.
    reason: source_note
lexical_decisions:
- source_word: Manus meae tegent te
  english_pob_choice: My hands will cover you
  chosen_korean: 내 손이 너를 덮어 줄 것이니
  alternatives_korean:
  - 내 손이 너를 가릴 것이니
  - 내 손이 너를 보호할 것이니
  lexicon: manus / tegere
  rationale: tegere는 단순한 물리적 ‘덮음’뿐 아니라 보호의 뉘앙스가 있어, 문맥을 살리면서도 과도한 해석을 피하기 위해 ‘덮어 줄’로 옮겼습니다.
- source_word: ne filii tui gehennam uideant
  english_pob_choice: so that your children may not see Gehenna
  chosen_korean: 네 자녀들이 게헨나를 보지 못하게 하려는 것입니다
  alternatives_korean:
  - 네 자녀들이 지옥을 보지 못하게 하려는 것입니다
  - 네 자손이 게헨나를 보지 않게 하려는 것입니다
  lexicon: ne ... uideant / gehennam
  rationale: gehenna는 후대 교회어 ‘지옥’보다 원어적 고유성을 살린 ‘게헨나’를 유지했고, ne + 접속법은 목적·결과를 자연스럽게 반영하는 ‘-지 못하게 하려는 것입니다’로 옮겼습니다.
- source_word: Iocundare
  english_pob_choice: Rejoice
  chosen_korean: 기뻐하십시오
  alternatives_korean:
  - 즐거워하십시오
  - 환호하십시오
  lexicon: iocundare
  rationale: 명령형의 직접성을 살리면서도 현대 합쇼체의 자연스러운 권면으로 표현하기 위해 ‘기뻐하십시오’를 선택했습니다.
theological_decisions:
- issue: Gehenna의 표기와 의미 보존
  chosen_reading: ‘게헨나’로 음역해 독자에게 본문이 특정 종말론적 장소/상태를 가리킨다는 점을 드러냈습니다.
  alternative_readings:
  - ‘지옥’으로 의역
  - ‘불못’으로 해석
  rationale: 이 구절은 라틴 텍스트가 gehennam을 그대로 사용하므로, 전통적 교회어로 의미를 평탄화하기보다 원문 고유 표현을 보존하는 쪽이 더 투명합니다.
  doctrine_reference: 종말론적 심판 용어의 원문 보존
- issue: 명령형 Iocundare의 등록
  chosen_reading: ‘기뻐하십시오’로 공적 권면의 합쇼체를 유지했습니다.
  alternative_readings:
  - ‘기뻐하라’
  - ‘즐거워하라’
  rationale: 본문의 짧은 명령을 현대 한국어 성경 문체로 옮기되, 직접적 권면의 힘은 약화하지 않도록 했습니다.
  doctrine_reference: 문체/화행 보존
