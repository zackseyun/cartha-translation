  text: 'Et dixi ad angelum: ille iuuenis quis est, qui eis coronas inponit et palmas in manus'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/046.yaml
  text: And I said to the angel[a], “Who is that young man who places crowns on them and palms in their hands?”
  footnotes:
  - marker: a
    text: Or 'Then I said'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고[a] 내가 천사에게 말했습니다. “그들에게 관을 씌우고 그들의 손에 종려나무 가지를 쥐여 주는 저 청년은 누구입니까?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 et는 단순히 「그리고」를 뜻하므로, 여기서는 시간적 「그때」보다 접속적 연결을 반영했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Et dixi
  english_pob_choice: And I said
  chosen_korean: 그리고 내가 말했습니다
  alternatives_korean:
  - 내가 말했습니다
  - 그때 내가 말했습니다
  lexicon: Et
  rationale: 라틴어의 단순 접속사 et를 살려 시간 부사처럼 만들지 않고, 발화의 연속성을 나타내는 「그리고」로 옮겼습니다.
- source_word: ad angelum
  english_pob_choice: to the angel
  chosen_korean: 천사에게
  alternatives_korean:
  - 그 천사에게
  - 천사에게 말했습니다
  lexicon: angelus
  rationale: 대상을 분명히 하는 목적어로 자연스럽게 처리하되, 직전 문맥상 특정 천사를 가리키므로 본문에는 「천사」만 두었습니다.
- source_word: ille iuuenis quis est
  english_pob_choice: Who is that young man
  chosen_korean: 그 청년은 누구입니까?
  alternatives_korean:
  - 저 청년은 누구입니까?
  - 그 젊은이는 누구입니까?
  lexicon: iuuenis
  rationale: iuuenis는 연소한 남자를 가리키므로, 현대 한국어에서 가장 직접적인 「청년」으로 옮겼습니다.
- source_word: coronas inponit et palmas in manus
  english_pob_choice: places crowns on them and palms in their hands
  chosen_korean: 관을 씌우고 그들의 손에 종려나무 가지를 쥐여 주는
  alternatives_korean:
  - 관을 씌우고 그들의 손에 종려를 넣어 주는
  - 관을 올려놓고 그들의 손에 종려나무 가지를 주는
  lexicon: coronas / palmas / in manus
  rationale: 라틴어 inponit와 in manus를 직역하되, 한국어에서는 자연스러운 동작 표현인 「씌우고」「쥐여 주는」으로 풀었습니다. palmas는 문맥상 종려나무 가지이므로 「종려나무 가지」로 구체화했습니다.
theological_decisions:
- issue: 직접화법 안의 청자 호칭과 문장 종결
  chosen_reading: 천사에게 묻는 직접화법은 현대 합쇼체를 유지하고, 인용부 안에서도 정중한 질문형으로 처리했습니다.
  alternative_readings:
  - 평서형으로 낮추는 번역
  - 구어체로 단순화하는 번역
  rationale: 본문은 예언적 환상 속 대화이지만 화자와 천사의 관계를 존중하는 현대 문체가 필요하므로, 과도한 경어를 피하면서도 격식을 유지했습니다.
  doctrine_reference: 문체·화행 일치 원칙
