id: 2ES.2.35
reference: 2 Esdras 2:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/035.yaml
  text: For everlasting light will shine for you through all eternity. Flee the shadow of this age; receive the joy of glory.
translation:
  language: ko
  text: 영원한 빛이 영원토록 여러분에게 비칠 것입니다. 이 시대의 그늘을 피하십시오. 영광의 기쁨을 받으십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lux perpetua / lucebit
  english_pob_choice: everlasting light will shine
  chosen_korean: 영원한 빛이 ... 비칠 것입니다
  alternatives_korean:
  - 영원한 빛이 ... 비출 것입니다
  - 영원한 빛이 ... 빛날 것입니다
  lexicon: lux→빛, lucebit→비칠 것입니다
  rationale: 라틴어의 ‘빛나다/비치다’ 의미를 자연스럽게 살리면서, 미래 시제와 지속성을 ‘영원한’으로 반영했습니다.
- source_word: uobis
  english_pob_choice: for you
  chosen_korean: 여러분에게
  alternatives_korean:
  - 너희에게
  - 당신들에게
  lexicon: uobis→여러분에게
  rationale: 호격적 직접 수신을 살리되 현대 한국어 합쇼체에 맞는 중립적 복수 대상을 택했습니다.
- source_word: umbra saeculi huius
  english_pob_choice: the shadow of this age
  chosen_korean: 이 시대의 그늘
  alternatives_korean:
  - 이 세상의 그림자
  - 이 시대의 어둠
  lexicon: umbra→그늘, saeculi huius→이 시대의
  rationale: ‘그림자’보다 ‘그늘’이 은유를 더 자연스럽게 살리며, saeculi huius의 시간-시대적 뉘앙스를 ‘이 시대’로 옮겼습니다.
- source_word: iocunditatem gloriae
  english_pob_choice: the joy of glory
  chosen_korean: 영광의 기쁨
  alternatives_korean:
  - 영광의 즐거움
  - 영광의 환희
  lexicon: iocunditatem→기쁨, gloriae→영광의
  rationale: 라틴어의 소유 관계를 그대로 반영해 ‘영광의 기쁨’으로 옮겼고, 문맥상 추상적이고 예배적인 울림을 유지했습니다.
theological_decisions:
- issue: 명령형의 격조와 직접성
  chosen_reading: ‘Fugite… accipite…’를 ‘피하십시오… 받으십시오’로 옮겨, 권면의 직접성과 공적 문체를 함께 유지했습니다.
  alternative_readings:
  - 도망하십시오 / 받아들이십시오
  - 피하시오 / 받으시오
  rationale: 본문은 단순 정보가 아니라 종말론적 권면이므로, 합쇼체 명령형으로 긴박성과 공적 권위를 드러냈습니다.
  doctrine_reference: 종말론적 권면의 수사적 기능
