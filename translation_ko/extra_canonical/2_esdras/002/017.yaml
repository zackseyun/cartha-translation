  yaml_path: translation/extra_canonical/2_esdras/002/017.yaml
  text: Do not fear, mother of children, for I have chosen you, says the Lord.
translation:
  language: ko
  text: 두려워하지 마십시오, 자녀들의 어머니여, 내가 너를 택하였기 때문입니다. 주님께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 elegi는 단순한 선호가 아니라 ‘택함’의 의미를 담습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Noli timere
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 마십시오
  lexicon: timere
  rationale: 금지 명령을 현대 표준어의 공손한 명령형으로 옮겼으며, 반복되는 내적 두려움을 포함하는 일반적 성경 표현에 가장 직접적입니다.
- source_word: mater filiorum
  english_pob_choice: mother of children
  chosen_korean: 자녀들의 어머니여
  alternatives_korean:
  - 아이들의 어머니여
  - 자식들의 어머니여
  lexicon: mater / filii
  rationale: filiorum을 단순한 ‘children’으로 받아 ‘자녀들’로 옮기고, 호격 구조를 살려 부름의 뉘앙스를 유지했습니다.
- source_word: te elegi
  english_pob_choice: I have chosen you
  chosen_korean: 내가 너를 택하였기 때문입니다
  alternatives_korean:
  - 내가 너를 선택하였기 때문입니다
  - 내가 너를 골랐기 때문입니다
  lexicon: elegi
  rationale: elegi의 선택/택함 의미를 반영해 ‘택하다’를 기본으로 삼았고, POB의 인과 접속사 ‘for’에 맞춰 이유절로 자연스럽게 구성했습니다.
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주님이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: dicit / dominus
  rationale: 라틴어 직설 인용 표지를 자연스러운 한국어 인용 종결로 옮겼으며, dominus는 본문 맥락상 주님으로 처리했습니다.
theological_decisions:
- issue: 호격과 직접 발화의 긴장
  chosen_reading: ‘자녀들의 어머니여’로 호격을 살리고, 뒤 문장은 하나님의 직접 발화로 이어지게 했습니다.
  alternative_readings:
  - 호칭을 풀어 평서문처럼 처리
  - ‘어머니’만 남기고 ‘자녀들’을 생략
  rationale: 원문은 부름과 선언을 함께 지니므로, 호격을 유지해야 위로와 선택 선언의 관계가 분명해집니다.
  doctrine_reference: source-text fidelity / direct discourse
