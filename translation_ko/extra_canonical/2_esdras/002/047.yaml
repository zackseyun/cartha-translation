  to: 그가 대답하여 제게 말씀하셨습니다. 「그분은 하나님의 아들이십니다.[47] 그들은 세상에서 그분을 고백했습니다.」 그러고 나서 저는 주님의 이름을 위하여 용감히 서 있던 이들을 칭송하기 시작했습니다.
