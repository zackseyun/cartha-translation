base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/047.yaml
  text: He answered and said to me[47], “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.
  footnotes:
  - marker: '47'
    text: This explicit identification of the crowned figure as 'the Son of God' is a hallmark of the chapter's later Christian compositional layer and should not be read back uncritically into the Jewish apocalypse of chapters 3–14.
    reason: compositional_layer
translation:
  language: ko
  text: 그가 대답하여 제게 말했습니다. 「그는 하나님의 아들이시니, 그들이 이 세대에서 고백한 분입니다.」 그러고 나서 저는 주님의 이름을 위하여 용감히 서 있던 이들을 높이기 시작했습니다.[47]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '47'
    text: 이 인물을 ‘하나님의 아들’로 명시하는 표현은 이 장의 후대 기독교적 구성층을 보여 주는 표지이므로, 3–14장의 유대 묵시문맥으로 무비판적으로 소급해 읽어서는 안 됩니다.
    reason: theological_note
lexical_decisions:
- source_word: ipse est filius dei
  english_pob_choice: He is the Son of God
  chosen_korean: 그는 하나님의 아들이시니
  alternatives_korean:
  - 그는 하나님의 아들입니다
  - 그분은 하나님의 아들이십니다
  lexicon: filius dei
  rationale: Latin의 직접 진술을 살려 ‘하나님의 아들’로 옮기되, 서술의 단정성을 유지하면서도 한국어 문장 흐름에 맞게 합쇼체로 처리했습니다.
- source_word: in saeculo
  english_pob_choice: in the age
  chosen_korean: 이 세대에서
  alternatives_korean:
  - 그 시대에
  - 이 세상에서
  lexicon: saeculum
  rationale: saeculum은 단순한 시간대라기보다 현재의 시대/세대를 가리키므로, 직역보다 의미를 드러내는 ‘이 세대’가 더 적절합니다.
- source_word: magnificare eos coepi
  english_pob_choice: I began to magnify those
  chosen_korean: 저는 … 이들을 높이기 시작했습니다
  alternatives_korean:
  - 저는 … 이들을 칭송하기 시작했습니다
  - 저는 … 이들을 영화롭게 하기 시작했습니다
  lexicon: magnificare
  rationale: magnificare는 ‘크게 하다/높이다’의 의미를 가지므로, 맥락상 그 사람들을 공적으로 높여 평가하는 뜻을 살려 ‘높이다’로 옮겼습니다.
- source_word: qui ... pro nomine Domini steterunt
  english_pob_choice: those who had stood bravely for the name of the Lord
  chosen_korean: 주님의 이름을 위하여 용감히 서 있던 이들
  alternatives_korean:
  - 주님의 이름을 위해 굳게 버틴 이들
  - 주님의 이름을 위해 담대히 맞선 이들
  lexicon: steterunt pro nomine Domini
  rationale: ‘서 있다’의 이미지를 유지하면서, POB의 해석인 ‘bravely’에 해당하는 태도를 ‘용감히’로 반영했습니다.
theological_decisions:
- issue: ‘하나님의 아들’ 진술의 층위
  chosen_reading: 본문의 직접 진술은 유지하되, 주석 없이 본문 안에서는 그대로 번역합니다.
  alternative_readings:
  - 후대 기독교적 편집층으로 보아 본문을 완곡하게 처리함
  - 인물 지칭을 일반화하여 약화시킴
  rationale: 제시된 영어 POB 각주는 이 표현이 본 장의 후대 기독교적 구성층의 표지임을 알리지만, 번역 본문 자체를 약화시키기보다 주석 체계로 그 역사적 긴장을 보존하는 편이 source-grounded입니다.
  doctrine_reference: compositional history / textual criticism
