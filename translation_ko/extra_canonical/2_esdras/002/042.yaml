  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ego Ezra uidi in monte Sion turbam magnam, quam numerare non potui, et omnes canticis conlaudabant dominum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/042.yaml
  text: I, Ezra, saw on Mount Zion a great multitude that I could not number, and they all were praising the Lord with songs.
translation:
  language: ko
  text: 내가 시온 산에서 셀 수 없는 큰 무리를 보았는데, 그들은 모두 노래로 주님을 찬양하고 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ego Ezra uidi
  english_pob_choice: I, Ezra, saw
  chosen_korean: 내가 … 보았습니다
  alternatives_korean:
  - 저는 … 보았습니다
  - 에스라가 … 보았습니다
  lexicon: source note
  rationale: 라틴어 1인칭 화자 표지를 자연스럽게 살리되, 한국어에서는 주어를 굳이 두 번 풀지 않고 앞에 ‘내가’로 서술을 시작했습니다.
- source_word: in monte Sion
  english_pob_choice: On Mount Zion
  chosen_korean: 시온 산에서
  alternatives_korean:
  - 시온 산 위에서
  - 시온 산에
  lexicon: source note
  rationale: 장소 전치사 in의 공간감을 살리면서도 한국어 성서 문체에서 자연스러운 ‘시온 산에서’를 선택했습니다.
- source_word: turbam magnam, quam numerare non potui
  english_pob_choice: a great multitude that I could not number
  chosen_korean: 셀 수 없는 큰 무리
  alternatives_korean:
  - 헤아릴 수 없는 큰 무리
  - 셀 수 없을 만큼 많은 무리
  lexicon: source note
  rationale: numerare non potui의 불가능성을 직역하기보다, POB의 의미를 따라 ‘셀 수 없는’으로 압축해 수량의 압도감을 유지했습니다.
- source_word: canticis conlaudabant dominum
  english_pob_choice: they all were praising the Lord with songs
  chosen_korean: 노래로 주님을 찬양하고 있었습니다
  alternatives_korean:
  - 노래하며 주님을 찬양하고 있었습니다
  - 찬가로 주님을 높이고 있었습니다
  lexicon: source note
  rationale: canticis의 수단성을 ‘노래로’로 옮겨, 단순한 동반행위가 아니라 노래가 찬양의 방식임을 드러냈습니다.
theological_decisions:
- issue: dominum의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주인
  rationale: 문맥상 예배의 대상이므로 한국어 성서에서 자연스러운 경어형 ‘주님’을 사용했습니다.
  doctrine_reference: 예배/찬양 대상 호칭
