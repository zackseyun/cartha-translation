  source_fidelity: 라틴어의 화자 자기-identification인 ‘Ego Ezra’(‘나 에스라’)가 초안에서는 ‘내가’로만 옮겨져 고유명사 ‘에스라’가 누락되었습니다. 또한 ‘quam numerare non potui’의 관계절은 화자 자신이 셀 수 없었다는 뜻을 명시하는 편이 충실합니다. 나머지 내용과 찬양의 지속적 상황을 나타내는 표현은 원문 및 영어 감사 번역과 부합합니다.
  naturalness: ‘나 에스라는’은 1인칭 서사에서 화자의 이름을 밝히는 한국어 성서식 문맥에 자연스럽습니다. ‘시온 산 위에서’는 in monte의 산 위라는 위치를 분명히 하며, 두 문장으로 나누어 읽기 쉽게 했습니다.
  terminology: ‘시온 산’, ‘주님’, ‘찬양하다’는 현대 표준 한국어의 정중한 성서 문체에 적절합니다. dominum의 문맥상 호칭을 ‘주님’으로 유지했습니다.
  issues:
