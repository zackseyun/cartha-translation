source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Vae tibi, Assur, qui abscondis iniquos penes te! gens mala,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/008.yaml
  text: Woe to you[a], Assyria, who hide the unrighteous with you! O evil nation,
  footnotes:
  - marker: a
    text: Or 'with you, evil nation!'.
    reason: previous_rendering
translation:
  language: ko
  text: 화 있을진저, 앗수르여, 네 곁에 있는 불의한 자들을 숨기는구나! 악한 민족이여,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 곁에 있는 악한 민족이여’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Vae tibi
  english_pob_choice: Woe to you
  chosen_korean: 화 있을진저
  alternatives_korean:
  - 너에게 화가 있도다
  - 불행이 너에게 있도다
  lexicon: 감탄/저주 공식
  rationale: 라틴어의 선포적 경고를 한국어 성경문체에서 가장 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: Assur
  english_pob_choice: Assyria
  chosen_korean: 앗수르여
  alternatives_korean:
  - 아시리아여
  - 앗시리아여
  lexicon: 고유명사
  rationale: 성경에서 널리 통용되는 전승형을 따르되, 호격 표지를 살려 직접 호명하는 뉘앙스를 보존했습니다.
- source_word: abscondis iniquos penes te
  english_pob_choice: who hide the unrighteous with you
  chosen_korean: 네 곁에 있는 불의한 자들을 숨기는구나
  alternatives_korean:
  - 네 안에 있는 불의한 자들을 숨기는구나
  - 너와 함께 있는 불의한 자들을 숨기는구나
  lexicon: abscondis / iniquos / penes te
  rationale: penes te의 ‘with you’는 문자적으로는 ‘곁에/함께’의 범위를 가지지만, 여기서는 숨겨 두고 품고 있는 상태를 자연스럽게 드러내기 위해 ‘네 곁에 있는’으로 옮겼습니다. iniquos는 도덕적·언약적 불의를 가리키므로 ‘불의한 자들’이 적절합니다.
- source_word: gens mala
  english_pob_choice: O evil nation
  chosen_korean: 악한 민족이여
  alternatives_korean:
  - 악한 나라여
  - 악한 백성이여
  lexicon: gens mala
  rationale: 문맥상 다음 절로 이어지는 호격이므로 ‘민족이여’로 직접 부르며, 악성 평가를 유지하기 위해 ‘악한’을 붙였습니다.
theological_decisions:
- issue: vocative force of gens mala
  chosen_reading: ‘악한 민족이여’로 독립된 호격으로 처리했습니다.
  alternative_readings:
  - ‘악한 민족’으로 앞 절에 이어 붙여 읽기
  - ‘오 악한 민족이여’로 감탄사 보강
  rationale: 라틴어 구두점과 문맥상 gens mala는 다음 절의 명령으로 넘어가는 호격이므로, 독립 호명으로 살려야 경고의 수사와 연결성이 유지됩니다.
  doctrine_reference: 본문-수사 구조 보존
