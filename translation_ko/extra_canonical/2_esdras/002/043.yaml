id: 2ES.2.43
reference: 2 Esdras 2:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et in medio eorum erat iuuenis statura celsus, eminentior omnibus illis, et singulis eorum capitibus inponebat coronas, et magis exaltabatur: ego autem miracul[o] tenebar.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/043.yaml
  text: And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the heads of each one of them, and he was more exalted still; and I was held in wonder.
translation:
  language: ko
  text: 그들 한가운데에 키가 큰 청년이 있었는데, 그는 그들 모두보다 더 컸습니다. 그는 그들 한 사람 한 사람의 머리에 면류관을 씌우고 있었고, 더욱더 높이 올려지고 있었습니다. 나는 놀라움에 사로잡혀 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iuuenis
  english_pob_choice: a young man
  chosen_korean: 청년
  alternatives_korean:
  - 젊은 남자
  - 소년
  lexicon: iuuenis
  rationale: 라틴어 iuuenis는 성인 남성을 가리키는 ‘젊은 사람/청년’의 뉘앙스가 있어, 문맥에 맞는 간결한 ‘청년’을 택했습니다.
- source_word: statura celsus, eminentior omnibus illis
  english_pob_choice: of lofty stature, taller than all the rest
  chosen_korean: 키가 큰 … 다른 모든 이보다 더 컸으며
  alternatives_korean:
  - 고귀한 키의 … 모두보다 뛰어나며
  - 장대한 체구의 … 다른 모든 사람보다 키가 더 크며
  lexicon: statura / celsus / eminentior
  rationale: statura celsus는 단순히 ‘높은 지위’보다 물리적 키의 이미지를 강하게 주므로 ‘키가 큰’으로 옮기고, eminentior는 비교급을 살려 ‘더 컸으며’로 표현했습니다.
- source_word: coronas
  english_pob_choice: crowns
  chosen_korean: 면류관들
  alternatives_korean:
  - 왕관들
  - 관들
  lexicon: corona
  rationale: corona는 일반적인 왕관보다 수여되는 ‘면류관’의 함의를 잘 드러내며, 복수형을 보존하기 위해 ‘면류관들’로 옮겼습니다.
- source_word: singulis eorum capitibus
  english_pob_choice: the heads of each one of them
  chosen_korean: 그들 각각의 머리들에
  alternatives_korean:
  - 그들 한 사람 한 사람의 머리에
  - 각 사람의 머리에
  lexicon: singuli / capita
  rationale: pl. capitibus를 반영해 ‘머리들’로 두었고, POB 개정이 바로 이 복수성을 교정한 점을 따라 각 개인에게 하나씩 씌우는 장면을 분명히 했습니다.
theological_decisions:
- issue: 과도한 메시아적 명시 여부
  chosen_reading: 본문의 인물 묘사를 그대로 유지해 ‘청년’으로 번역하고, 여기서 메시아/그리스도라는 명시적 칭호를 덧붙이지 않았습니다.
  alternative_readings:
  - 메시아적 인물로 해석해 직역을 넘는 주석적 표현을 넣는 방법
  - ‘하늘의 청년’처럼 상징을 강화하는 방법
  rationale: 라틴 원문은 인물의 외형과 행위를 묘사할 뿐 신원을 명시하지 않으므로, 본문이 말하는 범위를 넘지 않도록 했습니다.
  doctrine_reference: 본문 근거 우선 원칙
