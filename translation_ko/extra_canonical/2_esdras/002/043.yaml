revisions:
- from: 그들 한가운데에는 키가 큰 청년이 서 있었는데, 다른 모든 이보다 더 컸으며, 그는 그들 각각의 머리들에 면류관들을 씌우고 있었고, 더욱더 높여져 있었습니다. 그러나 나는 놀라움에 사로잡혀 있었습니다.[a]
  to: 그들 한가운데에 키가 큰 청년이 있었는데, 그는 그들 모두보다 더 컸습니다. 그는 그들 한 사람 한 사람의 머리에 면류관을 씌우고 있었고, 더욱더 높이 올려지고 있었습니다. 나는 놀라움에 사로잡혀 있었습니다.
  rationale: 원문이 명시하지 않는 ‘서 있었다’를 제거하고, autem을 역접 없이 화자의 반응으로 이어지게 했습니다. capitibus의 분배적 복수는 자연스러운 한국어 표현인 ‘한 사람 한 사람의 머리에’로 반영했으며, 이에 따라 불필요하고 오해를 낳는 각주를 삭제했습니다. exaltabatur의 수동 진행성과 magis의 강화는 ‘더욱더 높이 올려지고 있었습니다’로 유지했습니다.
