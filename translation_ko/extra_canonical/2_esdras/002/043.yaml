  - severity: low
    issue: 복수 capitibus를 한국어 명사 복수 ‘머리들’로 기계적으로 재현함
    rationale: 라틴어의 분배적 복수는 ‘그들 한 사람 한 사람의 머리에’로 옮겨야 각자에게 면류관이 씌워지는 뜻을 자연스럽고 충분하게 보존합니다.
