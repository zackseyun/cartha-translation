translation:
  language: ko
  text: 그리고 나는 너에게 내 부활에서 첫 자리를 주겠습니다.[23] 쉬고 고요히 있으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '23'
    text: ‘내 부활에서 첫 자리’는 라틴어에서 문자적으로 ‘첫 좌석’을 뜻하는 표현입니다. 이는 단순히 앉는 자리를 뜻하기보다 부활에서의 우선권이나 명예를 가리킬 가능성이 큽니다.
    reason: lexical_alternative
  - marker: a
    text: 또는 ‘멈추어 쉬십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: tibi
  english_pob_choice: you
  chosen_korean: 너에게
  alternatives_korean:
  - 당신에게
  - 그대에게
  lexicon: 2인칭 대명사
  rationale: 직접적인 약속의 수혜자를 간결하게 드러내기 위해 2인칭을 유지했습니다.
- source_word: primam sessionem
  english_pob_choice: the first seat
  chosen_korean: 첫 자리
  alternatives_korean:
  - 첫 좌석
  - 첫 자리에
  - 첫 자리(첫 좌석)
  lexicon: sessionem
  rationale: sessionem의 기본적 좌석/자리 의미를 살리되, 한국어에서는 ‘첫 자리’가 가장 자연스럽고 위계적 우선성을 함께 전달합니다.
- source_word: in resurrectione mea
  english_pob_choice: in my resurrection
  chosen_korean: 내 부활에서
  alternatives_korean:
  - 내 부활 안에서
  - 내 부활 때에
  lexicon: resurrectio
  rationale: 부활과 관련된 영역/상황을 자연스럽게 나타내기 위해 ‘에서’를 사용했습니다.
- source_word: Pausa et quiesce
  english_pob_choice: Pause and rest
  chosen_korean: 잠시 쉬고 고요히 있으십시오
  alternatives_korean:
  - 잠시 쉬고 머무르십시오
  - 쉬고 고요히 있으십시오
  lexicon: pausare / quiescere
  rationale: Late Latin의 pausare와 quiesce를 각각 ‘쉬다’와 ‘고요히 있다’로 나누어, 일시적 멈춤이 아니라 종말론적 안식을 담도록 했습니다.
theological_decisions:
- issue: '''first seat''의 의미'
  chosen_reading: 부활에서의 첫 자리를 약속하는 표현으로 옮겼습니다.
  alternative_readings:
  - 부활에서 첫 번째 자리에 앉게 하겠습니다
  - 부활에서 첫 자리를 드리겠습니다
  rationale: 본문은 단순한 착석보다 부활에서의 우선권·명예를 가리키므로, 그 뉘앙스를 유지하면서도 한국어로는 ‘첫 자리’가 가장 직접적입니다.
  doctrine_reference: eschatology / honor in resurrection
