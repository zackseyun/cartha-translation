review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the command, the destruction imagery, and the divine attribution. However, “사람들에게 내가 하리니” is grammatically incomplete and changes the Latin accusative eos (“those/them”) into an indirect-object construction. In this context, sic dabo eos is an unusual Late Latin use of dabo; its contextual force is that the same treatment will be done to those who did not heed God.
  naturalness: “사람들에게 내가 하리니” is not natural or complete modern Korean. “나를 듣지 않은 자들에게도 이와 같이 하겠습니다” is idiomatic, maintains the judgment parallel with Sodom and Gomorrah, and uses modern formal-polite speech consistently.
  terminology: “소돔과 고모라,” “역청,” “재 더미,” and “전능하신 주” are appropriate. “자들” is suitably formal and closer to eos than “사람들.” The note should describe the lexical difficulty without calling an interpretive Korean wording a literal translation.
  issues:
  - severity: high
    issue: ‘사람들에게 내가 하리니’ is syntactically incomplete and misrepresents eos.
    rationale: The source has eos as the direct object of dabo, not an indirect object equivalent to ‘to people.’ Korean requires an explicit, natural judgment action here; ‘그들에게도 이와 같이 하겠습니다’ supplies the contextually implied action while retaining the parallel signaled by sic (‘thus/likewise’).
  - severity: medium
    issue: The footnote inaccurately characterizes ‘내가 하리니’ as reflecting the literal meaning of dabo.
    rationale: The ordinary lexical sense of dabo is ‘I will give,’ whereas the contextual ‘do likewise’ sense reflects an unusual Late Latin usage and the immediate comparison with what was done to Sodom and Gomorrah. The note should state this distinction plainly.
  revised_text: 소돔과 고모라에 내가 행한 일을 기억하십시오. 그들의 땅은 역청 덩어리와 재 더미 가운데 놓여 있습니다. 그러므로 나를 듣지 않은 자들에게도 이와 같이 하겠습니다.[a] 전능하신 주께서 말씀하십니다.
  revised_footnotes:
  - marker: a
    text: 라틴어는 직역하면 ‘내가 그들을 주겠다’입니다. 그러나 여기서 dabo는 앞서 소돔과 고모라에 행한 일에 비추어, ‘그들에게도 이와 같이 행하겠다’는 뜻으로 이해됩니다.
    reason: The wording reflects the unusual and contextually disputed use of Latin dabo while explaining why the Korean text renders the intended parallel judgment rather than leaving an unintelligible ‘give them’ construction.
  revision_rationale: The revision corrects the Korean syntax, restores the direct-object sense of eos, and makes sic explicit as ‘이와 같이.’ It retains the source’s judgment parallel without importing a denominational interpretation. The relocated anchor attaches directly to the difficult clause, and the footnote accurately distinguishes the verb’s ordinary literal sense from its contextual use.
