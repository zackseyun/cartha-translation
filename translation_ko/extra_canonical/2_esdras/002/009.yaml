  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'memorare quid fecerim Sodomae et Gomorrae, Quorum terra iacet in picis glebis et aggeribus cinerum: sic dabo eos qui me non audierunt, dicit dominus omnipotens.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/009.yaml
  text: Remember what I did to Sodom and Gomorrah[a], whose land lies in clods of pitch and heaps of ashes. So I will give those who did not listen to me, says the Lord Almighty.
  footnotes:
  - marker: a
    text: Or 'So I will give over those'.
    reason: previous_rendering
translation:
  language: ko
  text: 소돔과 고모라에 내가 행한 일을 기억하십시오. 그들의 땅은 역청 덩어리와 재 더미 가운데 놓여 있습니다. 그러므로 나를 듣지 않은 자들에게도 이와 같이 하겠습니다.[a] 전능하신 주께서 말씀하십니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어는 직역하면 ‘내가 그들을 주겠다’입니다. 그러나 여기서 dabo는 앞서 소돔과 고모라에 행한 일에 비추어, ‘그들에게도 이와 같이 행하겠다’는 뜻으로 이해됩니다.
    reason: The wording reflects the unusual and contextually disputed use of Latin dabo while explaining why the Korean text renders the intended parallel judgment rather than leaving an unintelligible ‘give them’ construction.
lexical_decisions:
- source_word: memorare
  english_pob_choice: Remember
  chosen_korean: 기억하십시오
  alternatives_korean:
  - 기억하세요
  - 기억하라
  lexicon: memoro
  rationale: 명령형으로 청자를 직접 부르는 구조를 살리면서도 현대 공용어체로 자연스럽게 옮겼습니다.
- source_word: quid fecerim Sodomae et Gomorrae
  english_pob_choice: what I did to Sodom and Gomorrah
  chosen_korean: 소돔과 고모라에 내가 행한 일
  alternatives_korean:
  - 소돔과 고모라에 내가 한 일
  - 소돔과 고모라에 내가 행한 것
  lexicon: facio
  rationale: fecerim의 행위 완료 뉘앙스를 살려 ‘행한 일’로 옮겼고, 소도미/고모라에 대한 심판 행위를 분명히 했습니다.
- source_word: picis glebis et aggeribus cinerum
  english_pob_choice: clods of pitch and heaps of ashes
  chosen_korean: 역청 덩어리와 재 더미
  alternatives_korean:
  - 송진 덩어리와 재 더미
  - 피치 덩어리와 재 무더기
  lexicon: pix / cinis
  rationale: picis는 문맥상 건축용 ‘역청’으로 옮기는 것이 가장 분명하며, aggeribus는 쌓여 있는 상태를 살려 ‘더미’로 처리했습니다.
- source_word: sic dabo eos qui me non audierunt
  english_pob_choice: So I will give those who did not listen to me
  chosen_korean: 그러므로 나를 듣지 않은 사람들에게 내가 하리니
  alternatives_korean:
  - 그러므로 나를 듣지 않은 사람들에게 내가 주리니
  - 그러므로 나를 듣지 않은 사람들을 내가 내주리니
  lexicon: do / dabo
  rationale: 개정된 POB audit trail의 ‘do to’ 해석과 라틴어 dabo의 결합을 반영하되, 한국어에서는 대상격 ‘에게 내가 하리니’로 심판 행위를 자연스럽고 직설적으로 드러냈습니다.
theological_decisions:
- issue: 주님의 자칭과 심판 선언의 어조
  chosen_reading: 전능하신 주께서 말씀하십니다로 끝맺어 심판 경고의 권위를 유지했습니다.
  alternative_readings:
  - 전능하신 주가 말씀하십니다
  - 전능하신 주의 말씀이니라
  rationale: 라틴어 dicit dominus omnipotens를 현대 합쇼체로 옮기되, 예언적 선언의 엄중함을 약화시키지 않도록 했습니다.
  doctrine_reference: 예언자적 신탁의 공식 어미 보존
- issue: sic dabo eos의 해석
  chosen_reading: ‘내가 하리니’로 처리해 행위/심판의 능동성을 유지했습니다.
  alternative_readings:
  - ‘내가 그들을 넘기리니’
  - ‘내가 그들에게 주리니’
  rationale: audited English notes가 ‘give over’보다 ‘do to’/‘give’ 사이의 긴장을 보여 주므로, 한국어에서는 단순 방임보다 적극적 심판 행위로 읽히게 했습니다.
  doctrine_reference: 신적 심판의 능동성
