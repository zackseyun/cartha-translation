- from: 소돔과 고모라에 내가 행한 일을 기억하십시오. 그 땅은 역청 덩어리와 재 더미 속에 놓여 있습니다. 그러므로 나를 듣지 않은 사람들에게 내가 하리니, 전능하신 주께서 말씀하십니다.[a]
  to: 소돔과 고모라에 내가 행한 일을 기억하십시오. 그들의 땅은 역청 덩어리와 재 더미 가운데 놓여 있습니다. 그러므로 나를 듣지 않은 자들에게도 이와 같이 하겠습니다.[a] 전능하신 주께서 말씀하십니다.
  rationale: The revision corrects the Korean syntax, restores the direct-object sense of eos, and makes sic explicit as ‘이와 같이.’ It retains the source’s judgment parallel without importing a denominational interpretation. The relocated anchor attaches directly to the difficult clause, and the footnote accurately distinguishes the verb’s ordinary literal sense from its contextual use.
