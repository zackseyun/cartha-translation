  terminology: domini는 ‘주님’, domini dei는 ‘주 하나님’으로 옮기는 것이 라틴어의 칭호를 충실히 반영합니다. ‘내 백성’은 meus를 정확히 살립니다. ‘알리십시오’는 adnuntia의 공적 전달 의미에 적절합니다.
