  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'fortiter pro nomine domini steterunt. Tunc dixit mihi angelus: uade, adnuntia populo meo, qualia et quanta mirabilia domini dei uidisti.'
