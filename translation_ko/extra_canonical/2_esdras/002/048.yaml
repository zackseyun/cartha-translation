  source_fidelity: 수정이 필요합니다. fortiter pro nomine domini steterunt는 완료된 행동을 가리키므로 ‘담대히 섰습니다’가 더 정확합니다. 또한 domini dei에는 ‘우리’가 없으므로 ‘주 우리 하나님’은 근거 없이 소유·공동체 의미를 첨가합니다. qualia et quanta는 모두 mirabilia를 수식하므로, ‘네가 본 주 하나님의 놀라운 일들이 어떠하고 얼마나 큰지’처럼 병렬 수식 관계를 명시해야 합니다.
