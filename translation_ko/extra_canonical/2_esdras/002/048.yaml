id: 2ES.2.48
reference: 2 Esdras 2:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'fortiter pro nomine domini steterunt. Tunc dixit mihi angelus: uade, adnuntia populo meo, qualia et quanta mirabilia domini dei uidisti.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/048.yaml
  text: They stood boldly for the name of the Lord. Then the angel said to me[a], “Go, announce to my people what and how great are the wonders of the Lord God that you have seen.”
  footnotes:
  - marker: a
    text: Or 'what sort of things and how great are the wonders'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 주님의 이름을 위해 담대히 섰습니다. 그때 천사가 제게 말했습니다. 「가서, 네가 본 주 하나님의 놀라운 일들이 어떠하고[a] 얼마나 큰지 내 백성에게 알리십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘어떤 종류이며’
    reason: 라틴어 qualia는 ‘어떠한/어떤 종류의’라는 뜻으로, 뒤의 quanta(‘얼마나 큰’)와 함께 mirabilia(‘놀라운 일들’)를 병렬로 수식합니다.
lexical_decisions:
- source_word: fortiter
  english_pob_choice: stood boldly
  chosen_korean: 담대히 서 있었습니다
  alternatives_korean:
  - 굳게 서 있었습니다
  - 용감하게 서 있었습니다
  lexicon: fortiter → 담대히
  rationale: 행동의 강도와 신앙적 용기를 함께 살리기 위해 ‘담대히’로 옮겼고, 단순한 물리적 서 있음보다 신앙을 위해 굳게 버팀을 드러내도록 했습니다.
- source_word: pro nomine domini
  english_pob_choice: for the name of the Lord
  chosen_korean: 주님의 이름을 위하여
  alternatives_korean:
  - 주님의 이름 때문에
  - 주님의 이름을 위해
  lexicon: nomine domini → 이름 / 주님
  rationale: 라틴어 전치사구의 목적·헌신의 의미를 자연스럽게 살려 ‘위하여’로 옮겼습니다.
- source_word: qualia et quanta mirabilia domini dei
  english_pob_choice: what and how great are the wonders of the Lord God
  chosen_korean: 어떤 것들이며 얼마나 큰 것들인지
  alternatives_korean:
  - 어떠하며 얼마나 عظ대한지
  - 어떤 종류의 일들이며 얼마나 큰지
  lexicon: qualia et quanta mirabilia → 어떤 것들이며 얼마나 큰 것들
  rationale: qualia와 quanta의 병렬 구조를 유지해 ‘어떤 것들이며 얼마나 큰 것들인지’로 번역하여, 놀라움의 성격과 규모를 함께 드러냈습니다.
- source_word: domini dei
  english_pob_choice: the Lord God
  chosen_korean: 주 우리 하나님
  alternatives_korean:
  - 주 하나님
  - 주님 하나님
  lexicon: domini dei → 주 우리 하나님
  rationale: 2중 소유격의 중첩을 한국어에서 가장 자연스럽게 살리기 위해 ‘주 우리 하나님’으로 옮겼고, ‘우리’는 간접적으로 담겨 있는 신앙 공동체적 소속을 드러냅니다.
theological_decisions:
- issue: 천사의 명령이 보고된 계시의 공적 전달임을 어떻게 드러낼지
  chosen_reading: ‘내 백성에게 전하십시오’로 옮겨, 사적 체험이 아니라 공동체를 향한 증언임을 분명히 했습니다.
  alternative_readings:
  - ‘내 백성에게 알리십시오’
  - ‘내 백성에게 선포하십시오’
  rationale: uade, adnuntia는 단순 통보보다 공적 전달의 뉘앙스가 있어, ‘전하십시오’가 문맥상 가장 균형 잡힌 표현입니다.
  doctrine_reference: 계시 전달과 증언의 공적 성격
- issue: 직접 화법 내부의 존대 레지스터
  chosen_reading: 천사의 직접 인용은 공적 명령체를 유지하되, 한국어 본문은 합쇼체로 정리했습니다.
  alternative_readings:
  - 직접 인용 안에서도 명령형을 더 강하게 처리
  - 전체를 평서형으로 통일
  rationale: 본문 전체의 문체는 현대 formal-polite를 유지하되, 명령의 직접성은 인용문 안에서 충분히 보존됩니다.
  doctrine_reference: 번역 문체와 직접화법 재현
