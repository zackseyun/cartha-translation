  lexicon: accipere / iocundari
  rationale: 명령형 두 동작을 분명히 살리되, 현대 한국어에서 과장되지 않으면서도 본문의 환희를 드러내는 표현으로 ‘기뻐하다’를 택했습니다.
- source_word: gratias agentes ei
  english_pob_choice: giving thanks to him
  chosen_korean: 감사를 드리십시오
  alternatives_korean:
  - 그에게 감사하며
  - 그에게 감사를 올리며
  lexicon: gratiās agere
  rationale: 라틴어 관용구를 한국어에서 가장 자연스럽게 풀어, 행위의 지속성을 담으면서도 합쇼체 명령 흐름에 맞게 정리했습니다.
- source_word: qui uos ad ...
  english_pob_choice: who has called you to the heavenly kingdoms
  chosen_korean: 당신들을 하늘 나라로 부르신 분께
  alternatives_korean:
  - 당신들을 하늘 나라들로 부르신 분께
  - 당신들을 하늘의 나라로 부르신 분께
  lexicon: vocare / regna caelestia
  rationale: POB의 ‘heavenly kingdoms’는 복수형 뉘앙스를 지니지만, 한국어 성경 관용과 독자 이해를 고려해 ‘하늘 나라’로 옮기되 복수성은 살리지 않았습니다.
