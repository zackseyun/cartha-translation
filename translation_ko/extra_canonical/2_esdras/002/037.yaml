id: 2ES.2.37
reference: 2 Esdras 2:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: domini accipite et iocundamini gratias agentes ei qui uos ad
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/037.yaml
  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: ko
  text: 주님으로부터 당신들의 영광의 기쁨을 받으십시오. 그리고 기뻐하며, 당신들을 하늘 나라로 부르신 분께 감사를 드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘 나라들’이지만, 한국어에서는 종말론적 왕권을 가리키는 관용적 표현으로 ‘하늘 나라’를 사용했습니다.
    reason: cultural_note
lexical_decisions:
- source_word: domini
  english_pob_choice: from the Lord
  chosen_korean: 주님으로부터
  alternatives_korean:
  - 주님에게서
  - 주님께로부터
  lexicon: κύριος / dominus
  rationale: 원문의 소유·기원 관계를 살려 ‘from the Lord’를 자연스럽게 옮기되, 본문 문맥상 주님을 가리키는 호칭으로 ‘주님’을 사용했습니다.
- source_word: accipite et iocundamini
  english_pob_choice: Receive ... and rejoice
  chosen_korean: 받으십시오. 그리고 기뻐하며
  alternatives_korean:
  - 받으십시오. 그리고 즐거워하며
  - 받으십시오. 그리고 환호하며
  lexicon: accipere / iocundari
  rationale: 명령형 두 동작을 분명히 살리되, 현대 한국어에서 과장되지 않으면서도 본문의 환희를 드러내는 표현으로 ‘기뻐하다’를 택했습니다.
- source_word: gratias agentes ei
  english_pob_choice: giving thanks to him
  chosen_korean: 감사를 드리십시오
  alternatives_korean:
  - 그에게 감사하며
  - 그에게 감사를 올리며
  lexicon: gratiās agere
  rationale: 라틴어 관용구를 한국어에서 가장 자연스럽게 풀어, 행위의 지속성을 담으면서도 합쇼체 명령 흐름에 맞게 정리했습니다.
- source_word: qui uos ad ...
  english_pob_choice: who has called you to the heavenly kingdoms
  chosen_korean: 당신들을 하늘 나라로 부르신 분께
  alternatives_korean:
  - 당신들을 하늘 나라들로 부르신 분께
  - 당신들을 하늘의 나라로 부르신 분께
  lexicon: vocare / regna caelestia
  rationale: POB의 ‘heavenly kingdoms’는 복수형 뉘앙스를 지니지만, 한국어 성경 관용과 독자 이해를 고려해 ‘하늘 나라’로 옮기되 복수성은 살리지 않았습니다.
theological_decisions:
- issue: regna caelestia의 복수성
  chosen_reading: 하늘 나라
  alternative_readings:
  - 하늘 나라들
  - 하늘의 나라들
  rationale: 라틴어 복수형은 유지되지만, 한국어에서는 어색한 직역보다 종말론적 왕권을 가리키는 표현으로 ‘하늘 나라’를 택하는 편이 본문의 의도를 더 분명히 전달합니다.
  doctrine_reference: 왕국/나라 표현의 한국어 용례 및 종말론적 복수 은유 처리
