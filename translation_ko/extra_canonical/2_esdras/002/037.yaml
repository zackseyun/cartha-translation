  text: Receive the joy of your glory from the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.
translation:
  language: ko
  text: 주님에게서 여러분의 영광의 기쁨을 받으십시오. 기뻐하십시오. 여러분을 하늘 나라로 부르신 분께 감사드리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘하늘 나라들’입니다. 라틴어의 복수형은 하늘의 여러 영역 또는 왕국을 가리킬 수 있으나, 한국어에서는 통상 ‘하늘 나라’로 옮깁니다.
    reason: regna caelestia의 복수형을 본문에서 한국어 관용에 따라 단수로 옮긴 사실을 밝혀 줍니다.
lexical_decisions:
- source_word: domini
  english_pob_choice: from the Lord
  chosen_korean: 주님으로부터
  alternatives_korean:
