id: 2ES.2.29
reference: 2 Esdras 2:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mater, cum filiis tuis, quia ego te eripiam, dicit dominus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/029.yaml
  text: Mother, with your children, because I will deliver you, says the Lord.
translation:
  language: ko
  text: 어머니여, 당신의 자녀들과 함께—내가 당신을 구해 내겠다. 주님께서 말씀하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mater
  english_pob_choice: Mother
  chosen_korean: 어머니여
  alternatives_korean:
  - 어머니
  - 어머니여,
  lexicon: mater = 어머니
  rationale: 라틴어 vocative를 자연스러운 한국어 호격으로 옮겼습니다. 문장 첫머리의 직접 호소를 살리되, 합쇼체 서술과 충돌하지 않도록 호격 표지를 두었습니다.
- source_word: cum filiis tuis
  english_pob_choice: with your children
  chosen_korean: 당신의 자녀들과 함께하십시오
  alternatives_korean:
  - 당신의 자녀들과 함께
  - 자녀들과 함께
  lexicon: filiis tuis = 당신의 자녀들
  rationale: 단순 동반을 넘어 화자에게 향하는 권면/지시의 뉘앙스를 반영해 한국어 자연성을 확보했습니다. ‘자녀들’은 filii의 기본 의미를 그대로 살렸습니다.
- source_word: ego te eripiam
  english_pob_choice: I will deliver you
  chosen_korean: 내가 너를 구해 내겠다고
  alternatives_korean:
  - 내가 너를 구원하겠다고
  - 내가 너를 건져 내겠다고
  lexicon: eripiam = 구해 내다, 건져 내다
  rationale: eripiam은 단순한 도움보다 ‘위기에서 건져 냄’의 강한 구출 의미가 있어 ‘구해 내다’를 선택했습니다. ‘구원하다’는 신학적으로 가능하지만 여기서는 라틴어의 물리적 구출감이 더 직접적입니다.
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주님께서 말씀하십니다.
  - 주님이 말씀하십니다
  lexicon: dicit dominus = 주님께서 말씀하십니다
  rationale: 직접 인용 종결 공식을 한국어 성경 문체로 자연스럽게 처리했습니다. dominus는 본문 관례에 따라 ‘주님’으로 옮겼습니다.
theological_decisions:
- issue: 여기서 eripiam의 구출 의미를 어떻게 드러낼지
  chosen_reading: ‘구해 내다’로 옮겨, 단순한 위로보다 실제적 해방/구출의 강도를 살렸습니다.
  alternative_readings:
  - 구원하다
  - 건져 내다
  rationale: 본문은 짧지만 강한 구출 약속입니다. 한국어 ‘구해 내다’는 외부의 위험에서 빼내는 감각을 유지하면서도 신학적 과잉을 피합니다.
  doctrine_reference: 구원/해방의 어휘는 문맥 우선으로 번역하며, 본문 자체의 약속 강도를 보존합니다.
