  lexicon: confusio
  rationale: 라틴어의 수동적·처분적 뉘앙스를 반영하되, 한국어에서는 자연스럽게 '수치를 주다'로 옮겨 앞선 개정판의 'give them over' 취지를 살렸습니다.
