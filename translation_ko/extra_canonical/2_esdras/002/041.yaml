base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/041.yaml
  text: The number of your children[a], whom you desired, is complete. Ask for the Lord’s authority, that your people, who were called from the beginning, may be sanctified.
  footnotes:
  - marker: a
    text: Or 'that your people may be sanctified, who were called from the beginning.'.
    reason: previous_rendering
translation:
  language: ko
  text: 네 자녀의 수—곧 네가 바라던 자녀들의 수—가 이미 차서 끝났습니다. 주님의 권위를 구하십시오. 그러면 처음부터 불리운 네 백성이 거룩하게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘네 백성이, 처음부터 불리운, 거룩하게 될 것입니다.’
    reason: alternative_reading
lexical_decisions:
- source_word: Filiorum tuorum, quos optabas, plenus est numerus
  english_pob_choice: The number of your children, whom you desired, is complete.
  chosen_korean: 네 자녀의 수—곧 네가 바라던 자녀들의 수—가 이미 차서 끝났습니다.
  alternatives_korean:
  - 네 자녀의 수가 다 찼습니다.
  - 네가 원하던 자녀들의 수가 가득 찼습니다.
  lexicon: 자녀 / 차다 / 바라다
  rationale: plenus est numerus는 단순히 ‘완성되다’보다 ‘수(數)가 가득 차다’는 의미를 살려야 하며, optabas는 영어 POB의 ‘desired’에 맞춰 ‘바라던’으로 옮겼습니다.
- source_word: roga imperium domini
  english_pob_choice: Ask for the Lord’s authority
  chosen_korean: 주님의 권위를 구하십시오.
  alternatives_korean:
  - 주님의 통치를 구하십시오.
  - 주님의 권세를 구하십시오.
  lexicon: 권위
  rationale: imperium은 문맥상 주권적 명령권과 통치권을 가리키지만, 한국어에서는 지나치게 군사적이거나 교권적으로 들리지 않게 ‘권위’로 옮겨 원문의 힘을 유지했습니다.
- source_word: ut sanctificetur populus tuus
  english_pob_choice: that your people ... may be sanctified
  chosen_korean: 그러면 처음부터 불리운 네 백성이 거룩하게 될 것입니다.
  alternatives_korean:
  - 네 백성이 거룩하게 되도록 하십시오.
  - 처음부터 불리운 네 백성이 성결하게 될 것입니다.
  lexicon: 거룩하게 되다 / 불리운
  rationale: sanctificetur는 수동형 결과를 분명히 살려 ‘거룩하게 될 것입니다’로 옮겼고, populus tuus는 POB의 ‘your people’에 맞춰 ‘네 백성’으로 유지했습니다.
- source_word: qui uocatus est ab initio
  english_pob_choice: who were called from the beginning
  chosen_korean: 처음부터 불리운
  alternatives_korean:
  - 처음부터 부름 받은
  - 시작부터 불리운
  lexicon: 불리우다
  rationale: ab initio는 시간적 기원을 강조하므로 ‘처음부터’로 직역에 가깝게 유지했고, vocatus est의 소명 의미는 교회 전통어 ‘부르심’보다 본문 구조가 요구하는 수동형 ‘불리운’으로 드러냈습니다.
theological_decisions:
- issue: imperium domini의 신학적 뉘앙스
  chosen_reading: 주님의 권위는 단순한 행정 권한이 아니라 하나님의 통치적 명령권을 가리키는 표현으로 이해했습니다.
  alternative_readings:
  - 주님의 통치
  - 주님의 권세
  rationale: 문맥상 아들에게 적용되는 기도 요청이므로, ‘권위’가 주권적 명령성과 실제 통치의 뉘앙스를 함께 담아 가장 자연스럽습니다.
  doctrine_reference: divine sovereignty
- issue: sanctificetur의 시제·형식
  chosen_reading: 미래적 결과를 나타내는 한국어 표현으로 ‘거룩하게 될 것입니다’라고 옮겼습니다.
  alternative_readings:
  - 거룩하게 하소서
  - 거룩하게 되게 하십시오
  rationale: 라틴 수동 가정법의 요청-결과 구조를 한국어에서 자연스럽게 살리기 위해, 직접 명령보다 기도적 결과 진술로 처리했습니다.
  doctrine_reference: sanctification
