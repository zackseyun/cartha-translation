  source_fidelity: ‘바라던’은 optabas의 미완료 과거 뉘앙스를 잘 반영하고, ‘수...가 다 찼습니다’는 plenus est numerus를 충실히 옮깁니다. 다만 ut절은 ‘그러면 ... 될 것입니다’보다 목적·청원의 내용으로 표현하는 편이 라틴어 가정법 수동태에 더 가깝습니다. ‘처음부터 부름 받은’은 qui vocatus est ab initio의 수동성과 시간 표현을 자연스럽고 정확하게 보존합니다.
  naturalness: ‘불리운’은 현대 표준어 규범과 현대 성서 문체에 맞지 않으므로 ‘부름 받은’으로 고쳐야 합니다. 또한 ‘네 자녀의 수—곧 네가 바라던 자녀들의 수—’는 원문의 관계절을 불필요하게 동격 삽입으로 되풀이하므로, 자연스러운 관형절로 정리했습니다.
  terminology: ‘주님의 권위’는 imperium domini에 가능한 번역이며 유지할 수 있습니다. sanctificetur는 ‘거룩하게 되도록’으로 옮겨 수동적 성화의 의미와 roga에 종속된 청원 목적을 보존했습니다.
