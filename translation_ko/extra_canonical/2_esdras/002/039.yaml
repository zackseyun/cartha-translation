review_pass:
  verdict: revise
  source_fidelity: 라틴어의 독립 문장 구조(qui ... transtulerunt / ... acceperunt)는 초안에 잘 반영되어 있습니다. 다만 saeculi는 여기서 ‘세상’보다 ‘현세/시대’의 뜻을 우선적으로 보존하는 편이 영어 POB의 age 및 라틴어의 의미 범위에 더 가깝습니다. 또한 transtulerunt의 ‘옮겨 가다, 건너가다’라는 이동의 뉘앙스는 ‘벗어나다’로 무리 없이 표현될 수 있습니다.
  naturalness: ‘세상의 그림자를 벗어나신 분들’은 일반 사람들을 높이는 주체 높임이라 원문의 무표지 복수 주어에 비해 부자연스럽습니다. ‘현세의 그림자에서 벗어난 이들은’이 현대 한국어 문장으로 자연스럽고 합쇼체 종결에도 맞습니다.
  terminology: dominus는 문맥상 ‘주님’으로, splendidas tunicas는 ‘찬란한 옷’으로 옮기는 것이 적절합니다. saeculi는 본문에서 ‘현세’로 번역하고, ‘세상’이라는 가능한 대안은 각주에 남겨 의미 범위를 보존합니다.
  issues:
  - severity: medium
    issue: 주체 높임 사용
    rationale: ‘벗어나신 분들’의 ‘-시-’는 원문에 없는 존대를 부가합니다. 원문은 특정 청자를 높이지 않는 일반 복수 주어입니다.
  - severity: medium
    issue: saeculi를 ‘세상’으로만 확정
    rationale: saeculum은 문맥에 따라 세상, 시대, 현세를 뜻합니다. 영어 POB도 ‘the age’를 택하므로 본문은 ‘현세’로 하고 ‘세상’은 각주 대안으로 남기는 편이 더 정확합니다.
  - severity: low
    issue: 기존 각주의 번역자 해설식 문구
    rationale: ‘포괄적 의미를 살려’라는 설명은 본문 각주로서 불필요하며, 대안 번역만 제시하는 편이 간결하고 검증 가능합니다.
  revised_text: 현세의 그림자에서 벗어난 이들은 주님에게서 찬란한 옷을 받았습니다.[a]
