  yaml_path: translation/extra_canonical/2_esdras/002/039.yaml
  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
  footnotes:
  - marker: a
    text: Or 'who have passed over from the shadow of this age and have received splendid garments from the Lord.'.
