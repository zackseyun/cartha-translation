  text: signatorum in conuiuio domini. Qui se de umbra saeculi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/039.yaml
  text: Those who have passed over from the shadow of the age have received splendid garments from the Lord[a].
  footnotes:
  - marker: a
    text: Or 'who have passed over from the shadow of this age and have received splendid garments from the Lord.'.
    reason: previous_rendering
translation:
  language: ko
  text: 세상의 그림자를 벗어나신 분들은 주께로부터 찬란한 옷을 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세대’ 또는 ‘현세’로도 옮길 수 있으나, 여기서는 saeculi의 포괄적 의미를 살려 ‘세상의 그림자’로 번역했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Qui se de umbra saeculi transtulerunt
  english_pob_choice: Those who have passed over from the shadow of the age
  chosen_korean: 세상의 그림자를 벗어나신 분들
  alternatives_korean:
  - 이 세대의 그림자를 지나온 사람들
  - 이 시대의 그림자에서 옮겨진 이들
  lexicon: saeculum
  rationale: Latin의 saeculi는 단순히 ‘세대’보다 더 넓게 ‘세상/현세’의 의미를 담을 수 있어, POB의 ‘shadow of the age’를 살리되 한국어에서는 자연스럽게 ‘세상의 그림자’로 옮겼습니다.
- source_word: splendidas tunicas
  english_pob_choice: splendid garments
  chosen_korean: 찬란한 옷
  alternatives_korean:
  - 화려한 옷
  - 빛나는 옷
  lexicon: tunica
  rationale: splendidas는 단순한 장식성이 아니라 눈에 띄는 영광스러움을 가리키므로, 한국어에서는 과장되지 않으면서도 광채를 드러내는 ‘찬란한’이 적절합니다.
- source_word: a domino
  english_pob_choice: from the Lord
  chosen_korean: 주께로부터
  alternatives_korean:
  - 주님에게서
  - 주로부터
  lexicon: dominus
  rationale: 문맥상 수여의 출처를 밝히는 전치사구이므로 ‘주께로부터’가 가장 자연스럽고, 신적 수여의 뉘앙스를 유지합니다.
theological_decisions:
- issue: 본문의 주어-서술 구조
  chosen_reading: 이 절은 앞절의 계속이 아니라 독립 문장으로 보고, ‘세상의 그림자를 벗어나신 분들’이 주어가 되어 ‘받았습니다’로 마무리했습니다.
  alternative_readings:
  - 앞절에 이어지는 종속 절로 처리하는 읽기
  - ‘그리고’가 암시된 연결문으로 처리하는 읽기
  rationale: 라틴어 Qui... acceperunt의 문법이 독립적인 관계절-주절 구조이므로, 한국어도 그 구조를 살려야 합니다.
  doctrine_reference: 문법-본문비평 원칙
