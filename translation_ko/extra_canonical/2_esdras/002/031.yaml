  - severity: low
    issue: 제시된 라틴어 문자열의 절 경계
    rationale: 문자열은 앞 절의 ‘땅의 은신처에서’로 보이는 끝부분과 다음 절의 ‘자녀들을 품어라’로 보이는 시작을 함께 포함합니다. 이는 해당 영어 POB 및 현 번역 대상 문장의 범위를 넘으므로, 현 절 번역문에 기계적으로 덧붙이지 않습니다.
  revised_text: 그리고 내가 그들에게 자비를 베풀겠습니다. 내가 자비롭기 때문입니다. 전능하신 주께서 말씀하십니다.
