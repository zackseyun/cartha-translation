  yaml_path: translation/extra_canonical/2_esdras/002/031.yaml
  text: and I will show mercy to them, because I am merciful, says the Lord Almighty.
translation:
  language: ko
  text: 그리고 내가 그들에게 자비를 베풀겠습니다. 내가 자비롭기 때문입니다. 전능하신 주께서 말씀하십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: misericordiam ... faciam
  english_pob_choice: I will show mercy to them
  chosen_korean: 그들에게 자비를 베풀겠습니다
  alternatives_korean:
  - 그들에게 긍휼을 베풀겠습니다
  - 그들에게 불쌍히 여기겠습니다
  lexicon: misericordia
  rationale: 라틴어 misericordiam은 단순한 감정이 아니라 실제로 베푸는 자비의 행위를 가리키므로, POB의 ‘show mercy’에 맞춰 ‘자비를 베풀다’로 옮겼습니다.
- source_word: misericors sum
  english_pob_choice: I am merciful
  chosen_korean: 내가 자비로운 자이기 때문입니다
  alternatives_korean:
  - 내가 자비롭기 때문입니다
  - 내가 긍휼이 많기 때문입니다
  lexicon: misericors
  rationale: 원문은 하나님의 성품 근거를 제시하므로, 형용사적 표현을 한국어에서 자연스럽게 풀어 ‘자비로운 자’로 옮겨 이유절의 힘을 살렸습니다.
- source_word: dominus omnipotens
  english_pob_choice: the Lord Almighty
  chosen_korean: 전능하신 주
  alternatives_korean:
  - 전능하신 주님
  - 만군의 주
  lexicon: dominus omnipotens
  rationale: 라틴어 dominus omnipotens은 POB의 ‘Lord Almighty’에 해당하므로, 본문 호칭으로는 ‘주’를 쓰고 형용사 ‘전능하신’을 붙여 직접 대응시켰습니다.
theological_decisions:
- issue: 화자 표지와 종결 방식
  chosen_reading: ‘말씀하십니다’로 끝내어 신탁형 종결을 유지했습니다.
  alternative_readings:
  - ‘말한다’
  - ‘이르십니다’
  rationale: 본문은 하나님의 직접 발화가 아니라 선언적 신탁의 종결이므로, 현대 합쇼체이면서도 경외감을 유지하는 ‘말씀하십니다’가 가장 자연스럽습니다.
  doctrine_reference: prophetic oracle style
