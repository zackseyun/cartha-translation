translation:
  language: ko
  text: 내가 그들을 위하여 미리 준비해 두었던 것들입니다. 생명나무는 그들에게 향유의 향기가 될 것이며,[a] 그들은 수고하지도 않고 지치지도 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘생명나무는 그들에게 향유의 향기와 같을 것이며, 그들은 수고하지도 않고 지치지도 않을 것입니다.’
    reason: 이전 번역의 비교 표현을 대안으로 제시합니다.
lexical_decisions:
- source_word: quae praeparaueram illis
  english_pob_choice: which I had prepared for them.
  chosen_korean: 내가 그들을 위하여 미리 준비해 두었던 것입니다
  alternatives_korean:
  - 내가 그들을 위해 마련해 두었던 것입니다
  - 내가 그들을 위하여 준비해 두었던 것입니다
  lexicon: praeparare
  rationale: 과거완료의 준비 행위를 살려, 단순한 현재적 준비가 아니라 이미 해 두었던 예비를 분명히 했습니다.
- source_word: Lignum uitae
  english_pob_choice: The tree of life
  chosen_korean: 생명나무
  alternatives_korean:
  - 생명의 나무
  - 생명수 나무
  lexicon: lignum vitae
  rationale: 문맥상 고유한 종말론적 표상으로서 한국어 성서에서 널리 알려진 ‘생명나무’를 유지했습니다.
- source_word: in odorem unguenti
  english_pob_choice: as the fragrance of perfume
  chosen_korean: 향유의 향기처럼
  alternatives_korean:
  - 향수의 향기처럼
  - 연고의 향기처럼
  - 향유의 냄새처럼
  lexicon: odor / unguentum
  rationale: unguenti는 단순한 ‘향수’보다 의례적·치유적 뉘앙스가 있는 ‘향유’가 더 가깝고, odorem은 후각적 인상을 살려 ‘향기’로 옮겼습니다.
- source_word: non laborabunt neque fatigabuntur
  english_pob_choice: they shall neither labor nor grow weary
  chosen_korean: 그들은 수고하지도 않고 지치지도 않을 것입니다
  alternatives_korean:
  - 그들은 애쓰지도 않고 피곤해하지도 않을 것입니다
  - 그들은 노동하지도 않고 피로해하지도 않을 것입니다
  lexicon: laborare / fatigari
  rationale: 두 동사의 병렬을 살려, ‘수고’와 ‘지치다’로 자연스럽고도 구분되는 표현을 택했습니다.
theological_decisions:
- issue: 생명나무의 비유적 기능
  chosen_reading: 생명나무는 단순한 식물 묘사가 아니라, 새 창조의 복과 생명 회복을 상징하는 종말론적 표상으로 번역했습니다.
  alternative_readings:
  - 생명의 나무는 그들에게 향유의 향기처럼 될 것입니다
  rationale: 본문의 위로적 맥락과 생명나무의 상징성을 유지해야 하므로, 지나치게 평이한 표현으로 약화시키지 않았습니다.
  doctrine_reference: 종말론적 회복과 새 창조의 상징
