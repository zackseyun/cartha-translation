base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/011.yaml
  text: And I will take for myself their glory[a], and I will give them everlasting tabernacles[b],
  footnotes:
  - marker: a
    text: Or 'And I will take to myself their glory, and I will give them the everlasting tabernacles that I had prepared for them.'.
