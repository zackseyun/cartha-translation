  - marker: b
    text: Or 'their glory, and I will give them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그들의 영광을 나를 위해 취하고, 그들에게 영원한 장막들을 주겠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나를 위해 취하고’는 sumam mihi의 소유 방향을 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘장막들’은 tabernacula의 복수형을 반영합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: sumam mihi
  english_pob_choice: I will take for myself
  chosen_korean: 나는 나를 위해 취하고
  alternatives_korean:
  - 나는 내 것으로 삼고
  - 나는 나를 위해 가져가고
  lexicon: sumo
  rationale: 라틴어 sumam mihi는 단순히 ‘받다’가 아니라 ‘자기 몫으로 취하다’는 뜻이어서, 소유 방향을 드러내는 ‘나를 위해 취하다’로 옮겼습니다.
- source_word: gloriam illorum
  english_pob_choice: their glory
  chosen_korean: 그들의 영광
  alternatives_korean:
  - 그 영광
  - 저들의 영광
  lexicon: gloria
  rationale: illorum은 앞선 대상을 가리키는 소유격이므로, 관계를 자연스럽게 살리되 과도하게 해석하지 않고 ‘그들의 영광’으로 옮겼습니다.
- source_word: tabernacula aeterna
  english_pob_choice: everlasting tabernacles
  chosen_korean: 영원한 장막들
  alternatives_korean:
  - 영원한 천막들
  - 영원한 거처들
  lexicon: tabernaculum + aeternus
  rationale: tabernacula는 복수형이므로 ‘장막들’로 유지했고, aeterna는 종말론적 지속성을 반영하여 ‘영원한’으로 옮겼습니다.
theological_decisions:
- issue: ‘장막’의 종말론적 이미지 보존
  chosen_reading: ‘영원한 장막들’로 직역해, 하나님이 주시는 최종 거처의 이미지를 유지했습니다.
  alternative_readings:
  - ‘영원한 거처들’로 완화
  - ‘영원한 처소들’로 의역
  rationale: 문맥이 상징적·종말론적 보상을 말하므로, 익숙한 교회어보다 원문 이미지를 더 직접적으로 살리는 편이 본문의 힘을 보존합니다.
  doctrine_reference: eschatological reward imagery
