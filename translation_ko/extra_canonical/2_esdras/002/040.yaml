source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: transtulerunt, splendidas tunicas a domino acceperunt. Recipe, Sion, numerum tuum et conclude candidatos tuos, qui legem
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/040.yaml
  text: Receive your number[40], Zion, and gather in your white-robed ones[a], who have fulfilled the law of the Lord.
  footnotes:
  - marker: '40'
    text: The Latin word behind 'your robed ones' is literally related to white clothing and can also mean 'candidates.' Here the clothing image fits the visionary scene better than a political sense.
    reason: lexical_alternative
  - marker: a
    text: Or 'gather in your robed ones'.
    reason: previous_rendering
translation:
  language: ko
  text: 시온아, 네 수를 받아들이십시오.[40] 그리고 주님의 율법을 지킨 네 흰옷 입은 자들을 모으십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '40'
    text: ‘네 수’에 해당하는 라틴어는 문자적으로 수나 총원을 뜻하며, 정해진 몫을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: a
    text: 또는 ‘네 흰옷 입은 자들을 거두어들이십시오’.
    reason: previous_rendering
lexical_decisions:
- source_word: Recipe, Sion, numerum tuum
  english_pob_choice: Receive your number, Zion
  chosen_korean: 시온아, 네 수를 받으십시오
  alternatives_korean:
  - 시온아, 네 숫자를 받으십시오
  - 시온아, 네 인원을 받으십시오
  lexicon: numerum
  rationale: numerum은 단순한 '숫자'보다 정해진 몫/총원에 가까워, POB의 'number'를 따라 시온에게 지정된 사람들의 수를 받으라는 뜻을 살렸습니다.
- source_word: candidatos
  english_pob_choice: your white-robed ones
  chosen_korean: 흰옷 입은 자들
  alternatives_korean:
  - 흰옷을 입은 자들
  - 흰옷 입은 사람들
  - 흰옷 입은 후보자들
  lexicon: candidatos
  rationale: candidatos는 '밝게 흰, 흰옷 차림'의 색채가 핵심이므로, 문맥의 환상적 장면에 맞게 '흰옷 입은 자들'로 옮겼습니다.
- source_word: legem domini
  english_pob_choice: the law of the Lord
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 주님의 법
  - 주님의 계명
  lexicon: lex
  rationale: dominī의 소유격은 여호와/주님의 권위 아래 있는 토라적 '율법'을 가리키므로, 일반적 '법'보다 '율법'이 더 직접적입니다.
theological_decisions:
- issue: candidatos의 이미지가 단순 의복인지, 자격을 갖춘 사람들인지
  chosen_reading: 문맥상 흰옷의 이미지가 우선하므로 '흰옷 입은 자들'로 번역했습니다.
  alternative_readings:
  - 자격을 갖춘 자들
  - 후보자들
  rationale: 영문 POB 주석과 개정 판단이 모두 candidus 계열의 '희게 된/흰옷 차림'을 핵심으로 보므로, 상징적 색채를 보존하는 것이 본문 의도를 가장 잘 드러냅니다.
  doctrine_reference: 묵시문학의 상징 언어와 정결/승리 이미지
