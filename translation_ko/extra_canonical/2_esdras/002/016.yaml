source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et resuscitabo mortuos de locis suis et de monumentis educam illos, quoniam cognoui nomen meum in illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/016.yaml
  text: And I will raise the dead from their places[16], and I will bring them out from the tombs[a], because I have known my name in them.
  footnotes:
  - marker: '16'
    text: Latin only witness. The clause 'because I have known my name in them' is textually awkward and could be understood more idiomatically as 'because my name is known in them' or, by conjecture, 'because they have known my name.' The main text preserves the extant Latin's strangeness.
    reason: textual_variant
  - marker: a
    text: Or 'because I have known my name in them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그들의 자리에서 죽은 자를 다시 살릴 것이며, 무덤들에서 그들을 이끌어 낼 것입니다. 이는 내가 그들 안에서 내 이름을 알았기 때문입니다.[a][16]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “이는 내 이름이 그들 안에 있음을 내가 알기 때문입니다.”
    reason: previous_rendering
  - marker: '16'
    text: 라틴어 단독 증언입니다. ‘내가 그들 안에서 내 이름을 알았기 때문입니다’라는 절은 표현상 어색하며, ‘그들 안에서 내 이름이 알려져 있기 때문입니다’ 혹은 추정적으로 ‘그들이 내 이름을 알고 있기 때문입니다’로도 이해될 수 있습니다. 본문은 현전 라틴어의 어색함을 그대로 보존합니다.
    reason: textual_variant
lexical_decisions:
- source_word: resuscitabo mortuos de locis suis
  english_pob_choice: I will raise the dead from their places
  chosen_korean: 나는 그들의 자리에서 죽은 자를 다시 살릴 것이며
  alternatives_korean:
  - 나는 그들의 자리에서 죽은 자를 일으킬 것이며
  - 나는 그들의 처소에서 죽은 자를 다시 살릴 것이며
  lexicon: resuscitabo; mortuos; de locis suis
  rationale: resuscitabo는 단순한 ‘깨우다’보다 죽은 자를 다시 살리는 의미가 분명하므로 ‘다시 살리다’로 옮기고, de locis suis는 ‘그들의 자리에서’로 직역에 가깝게 유지했습니다.
- source_word: de monumentis educam illos
  english_pob_choice: I will bring them out from the tombs
  chosen_korean: 무덤들에서 그들을 이끌어 낼 것입니다
  alternatives_korean:
  - 무덤들에서 그들을 꺼내올 것입니다
  - 무덤들로부터 그들을 나오게 할 것입니다
  lexicon: monumentis; educam illos
  rationale: monumentis는 묘지나 무덤을 가리키므로 ‘무덤들’로 옮겼고, educam illos는 단순 이동보다 ‘이끌어 내다’의 뉘앙스를 살렸습니다.
- source_word: quoniam cognoui nomen meum in illis
  english_pob_choice: because I have known my name in them
  chosen_korean: 이는 내 이름이 그들 안에 있음을 내가 알기 때문입니다
  alternatives_korean:
  - 이는 내가 그들 안에서 내 이름을 알기 때문입니다
  - 이는 내 이름을 그들 안에서 내가 알아보기 때문입니다
  lexicon: quoniam; cognoui; nomen meum in illis
  rationale: cognoui는 라틴어 완료형이지만 여기서는 상태적 ‘알다/알아보다’의 의미가 자연스럽고, POB의 긴장을 보존하되 한국어에서는 ‘내 이름이 그들 안에 있음’을 목적절로 풀어 의미를 명료하게 했습니다.
theological_decisions:
- issue: 마지막 절의 관계와 신학적 긴장
  chosen_reading: ‘내 이름이 그들 안에 있음을 내가 알기 때문입니다’로 옮겨, 라틴어의 어색함을 무리하게 매끄럽게 바꾸지 않으면서도 한국어 독자가 이해할 수 있게 했습니다.
  alternative_readings:
  - ‘내 이름을 그들 안에서 내가 알았기 때문입니다’
  - ‘내 이름이 그들 안에서 알려져 있기 때문입니다’
  rationale: 주어진 라틴어는 문법적으로 다소 거칠지만, 본문 자체의 특이성을 숨기지 않는 것이 감사 기록에 부합합니다. 동시에 한국어에서는 의미 관계가 드러나도록 최소한의 해석적 정리를 했습니다.
  doctrine_reference: textual criticism / translation philosophy
