source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Mater, quae eos generauit, dicit illis : ite, filii, quia ego uidua sum et derelicta :'
  language: Latin
base_translation:
