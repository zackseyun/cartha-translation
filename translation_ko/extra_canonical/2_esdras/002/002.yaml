  yaml_path: translation/extra_canonical/2_esdras/002/002.yaml
  text: The mother who bore them says to them, “Go, children, for I am a widow and forsaken.”
translation:
  language: ko
  text: 그들을 낳은 어머니가 그들에게 말합니다. 「가십시오, 자녀들아. 나는 과부이고 버림받은 처지입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 derelicta는 ‘버림받은’이라는 상태 서술로 읽을 수 있으며, 행위자를 밝히지 않고 처지를 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: Mater, quae eos generauit
  english_pob_choice: The mother who bore them
  chosen_korean: 그들을 낳은 어머니
  alternatives_korean:
  - 그들을 낳은 그 어머니
  - 그들의 어머니
  lexicon: mater / generauit
  rationale: 원문은 관계절로 ‘낳은 어머니’라는 정의를 붙이며, 영어 POB도 이를 그대로 살려 인물의 정체를 먼저 제시합니다. 한국어도 직역에 가깝게 처리해 서술의 초점을 유지했습니다.
- source_word: dicit illis
  english_pob_choice: says to them
  chosen_korean: 그들에게 말합니다
  alternatives_korean:
  - 그들에게 이릅니다
  - 그들에게 말하십니다
  lexicon: dicit
  rationale: 서술문이므로 현대 표준어의 중립적 동사 ‘말합니다’를 택했습니다. 화자의 직접 인용문 안에서만 발화 내용이 이어지므로 별도의 높임은 필요하지 않습니다.
- source_word: ite, filii
  english_pob_choice: Go, children
  chosen_korean: 가거라, 자녀들아
  alternatives_korean:
  - 가거라, 아이들아
  - 가세요, 자녀들아
  lexicon: ite / filii
  rationale: 명령형 ite는 직접적 훈계를 드러내므로 평서적 완곡화보다 직설적 명령을 살렸습니다. filii는 혈연적 의미를 지나치게 약화하지 않으면서도 자연스러운 호칭인 ‘자녀들아’로 옮겼습니다.
- source_word: ego uidua sum et derelicta
  english_pob_choice: I am a widow and forsaken
  chosen_korean: 나는 과부이고 버림받은 몸이다
  alternatives_korean:
  - 나는 과부이고 버림받았습니다
  - 나는 과부이고 버려진 상태이다
  lexicon: uidua / derelicta
  rationale: uidua는 단순한 ‘미망인’보다 관계와 처지를 드러내는 ‘과부’가 적절합니다. derelicta는 상태 서술로 ‘버림받은 몸이다’가 원문의 고립감과 절박함을 비교적 압축적으로 전달합니다.
theological_decisions:
- issue: 직접 인용문 안의 절박한 자기진술의 톤
  chosen_reading: ‘나는 과부이고 버림받은 몸이다’로 감정적·상태적 상실을 분명히 드러냈습니다.
  alternative_readings:
  - ‘나는 과부이고 버려졌습니다’
  - ‘나는 과부이고 버림받았습니다’
  rationale: 원문은 법적 선언보다 생존의 비참함을 드러내는 자기진술에 가깝기 때문에, 한국어에서도 단순 사실보고보다 상태의 무게가 느껴지도록 했습니다.
  doctrine_reference: extra-canonical narrative tone; no doctrinal adjustment
