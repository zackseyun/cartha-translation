  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/045.yaml
  text: He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”
translation:
  language: ko
  text: 그가 대답하여 나에게 말했습니다. “이들은 죽을 옷을 벗어 버리고 불멸의 옷을 입었으며, 하나님의 이름을 고백한 이들입니다. 이제 그들은 관을 받고 종려 가지를 받고 있습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortalem tunicam / inmortalem
  english_pob_choice: the mortal garment / the immortal
  chosen_korean: 죽을 옷 / 영원한 옷
  alternatives_korean:
  - 필멸의 옷 / 불멸의 옷
  - 죽어야 할 옷 / 죽지 않는 옷
  lexicon: tunicam, inmortalem
  rationale: 라틴어의 대조를 살리면서도 현대 한국어에서 자연스럽게 읽히도록 ‘옷’으로 옮기고, ‘죽을/영원한’으로 생명성과 대조를 분명히 했습니다.
- source_word: confessi sunt nomen dei
  english_pob_choice: they have confessed the name of God
  chosen_korean: 하나님의 이름을 고백한 사람들입니다
  alternatives_korean:
  - 하나님의 이름을 시인한 사람들입니다
  - 하나님의 이름을 인정한 사람들입니다
  lexicon: confessi sunt, nomen dei
  rationale: confess의 공적 신앙 고백 뉘앙스를 살려 ‘고백하다’를 선택했고, nomen dei는 관용적으로 ‘하나님의 이름’으로 옮겼습니다.
- source_word: modo coronantur et accipiunt palmas
  english_pob_choice: Now they are being crowned and receiving palms
  chosen_korean: 이제 그들은 관을 쓰고 종려를 받고 있습니다
  alternatives_korean:
  - 이제 그들은 왕관을 받고 종려 가지를 받고 있습니다
  - 이제 그들은 면류관을 쓰고 종려를 받고 있습니다
  lexicon: coronantur, palmas
  rationale: coronantur는 수동 진행형의 현재성을 살려 ‘관을 쓰고 있습니다’로 옮겼고, palmas는 본문의 상징을 보존하기 위해 간단히 ‘종려’로 두었습니다.
theological_decisions:
- issue: palmas의 상징적 의미를 본문에 직접 풀어 쓸지 여부
  chosen_reading: 본문은 ‘종려’를 그대로 유지해 상징성을 열어 두었습니다.
  alternative_readings:
  - ‘종려 가지’를 명시한다
  - ‘승리의 종려’를 의역한다
  rationale: 라틴어 palmas는 문맥상 승리/환호의 표지일 수 있으나, 원문 자체는 단어를 압축적으로 제시하므로 한국어도 해설을 덧붙이지 않고 보존했습니다.
  doctrine_reference: source transparency / minimal explicitation
- issue: 하나님의 이름을 ‘주의 이름’으로 바꿀지 여부
  chosen_reading: 원문의 dei를 따라 ‘하나님의 이름’을 유지했습니다.
  alternative_readings:
  - ‘주의 이름’으로 옮긴다
  - ‘하나님의 이름 곧 주의 이름’으로 확장한다
  rationale: 라틴어 텍스트가 명시적으로 dei를 쓰므로, 전통적 신학적 환원보다 원문 표지를 우선했습니다.
  doctrine_reference: source transparency / divine-name fidelity
