source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/026.yaml
  text: None of them will perish[a], for I will require them from your number. Do not be anxious, for when the day of distress and anguish comes,
  footnotes:
  - marker: a
    text: Or 'Do not be anxious, for when the day of distress and anguish comes, others will weep and be sorrowful, but you will be cheerful and abundant.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 가운데 아무도 멸망하지 않을 것입니다. 내가 그들을 당신의 수에서 요구할 것이기 때문입니다. 염려하지 마십시오. 환난과 곤고의 날이 오면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: requiram은 문맥상 ‘되찾겠습니다/되돌려받겠습니다’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: nemo ex eis interiet
  english_pob_choice: None of them will perish
  chosen_korean: 그들 가운데 아무도 멸망하지 않을 것입니다
  alternatives_korean:
  - 그들 중 아무도 죽지 않을 것입니다
  - 그들 가운데 누구도 멸망하지 않을 것입니다
  lexicon: interire
  rationale: 문맥상 단순한 죽음보다 최종적 소멸·멸망의 뉘앙스가 강하므로 ‘멸망하다’로 옮겼습니다.
- source_word: ego enim eos requiram de numero tuo
  english_pob_choice: for I will require them from your number
  chosen_korean: 내가 그들을 당신의 수에서 요구할 것이기 때문입니다
  alternatives_korean:
  - 내가 그들을 당신에게서 되찾을 것이기 때문입니다
  - 내가 그들을 당신의 수에서 찾아낼 것이기 때문입니다
  lexicon: requirere
  rationale: requiram은 단순한 ‘요구하다’보다 ‘다시 찾아서 돌려받다/되찾다’의 의미가 있지만, 본문은 인원 목록에서 책임 있게 요구하는 뉘앙스도 있어 직역을 유지했습니다.
- source_word: Noli satagere
  english_pob_choice: Do not be anxious
  chosen_korean: 염려하지 마십시오
  alternatives_korean:
  - 걱정하지 마십시오
  - 근심하지 마십시오
  lexicon: noli + satagere
  rationale: 경계와 불안의 금지 명령을 자연스럽게 드러내기 위해 ‘염려하다’를 사용했습니다.
- source_word: dies pressurae et angustiae
  english_pob_choice: the day of distress and anguish
  chosen_korean: 환난과 곤고의 날
  alternatives_korean:
  - 고난과 고통의 날
  - 압박과 곤고의 날
  lexicon: pressura / angustia
  rationale: pressura와 angustia의 중첩된 압박감을 한국어 성서 문체에 맞게 압축하여 표현했습니다.
theological_decisions:
- issue: 문장 절단과 미완결 인용
  chosen_reading: 본문은 ‘환난과 곤고의 날이 오면’에서 끝나며, 이어지는 대비 구절은 이 절에 포함하지 않았습니다.
  alternative_readings:
  - 이 절을 다음 절과 합쳐 완결된 문장으로 번역
  - 이 절 끝에 생략부호를 넣어 이어짐을 강하게 표시
  rationale: 제공된 라틴 본문과 최신 수정이 이 절에서 문장을 끝내고 있으므로, 없는 후속 내용을 보태지 않았습니다.
  doctrine_reference: source fidelity
