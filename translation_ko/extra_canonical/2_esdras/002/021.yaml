  text: inridere noli, tutare mancum et caecum ad uisionem claritatis meae admitte, Senem et iuuenem intra muros tuos serua,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/021.yaml
  text: Do not mock; shelter the lame and the blind[a], admit them to the sight of my glory. Keep the old and the young within your walls.
  footnotes:
  - marker: a
    text: Or 'Care for the broken and the weak; do not mock the lame; shelter the maimed, and admit the blind to the sight of my glory.'.
    reason: previous_rendering
translation:
  language: ko
  text: 조롱하지 마십시오. 저는 절름발이와 맹인을 보호하겠고, 내 영광을 볼 수 있게 하겠습니다. 늙은이와 젊은이를 네 성벽 안에 지키십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘부서진 자와 약한 자를 돌보십시오; 절름발이를 조롱하지 마십시오; 불구자를 보호하고, 맹인을 내 영광의 광경으로 들이십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: inridere noli
  english_pob_choice: Do not mock
  chosen_korean: 조롱하지 마십시오
  alternatives_korean:
  - 비웃지 마십시오
  - 놀리지 마십시오
  lexicon: inridere
  rationale: 금지 명령의 직접성을 살리면서, 문맥상 단순한 농담이 아니라 사람을 깔보는 조롱을 뜻하므로 ‘조롱하다’가 가장 자연스럽습니다.
- source_word: tutare mancum et caecum
  english_pob_choice: shelter the lame and the blind
  chosen_korean: 절름발이와 맹인을 보호하겠고
  alternatives_korean:
  - 절름발이와 맹인을 보살피겠고
  - 절름발이와 맹인을 지키겠고
  lexicon: tutare / mancus / caecus
  rationale: tutare는 단순한 감정적 돌봄보다 보호·보살핌의 행동을 가리키므로 ‘보호하다’를 택했고, mancum과 caecum은 각각 ‘절름발이’와 ‘맹인’으로 간결하게 옮겼습니다.
- source_word: ad uisionem claritatis meae admitte
  english_pob_choice: admit them to the sight of my glory
  chosen_korean: 내 영광을 볼 수 있게 하겠습니다
  alternatives_korean:
  - 내 영광의 광경으로 들이십시오
  - 내 영광을 보는 데 들어오게 하십시오
  lexicon: admitte / uisio / claritas
  rationale: 라틴어의 ‘들이다’와 ‘보게 하다’의 의미를 한국어에서 자연스럽게 풀어, 대상이 하나님의 영광을 직접 목도하게 되는 결과를 분명히 했습니다.
- source_word: intra muros tuos serua
  english_pob_choice: Keep the old and the young within your walls
  chosen_korean: 늙은이와 젊은이를 네 성벽 안에 지키십시오
  alternatives_korean:
  - 늙은이와 젊은이를 네 성 안에 보존하십시오
  - 노인과 젊은이를 네 성벽 안에 간수하십시오
  lexicon: serua / intra muros tuos
  rationale: serua는 단순 보관보다 ‘지키다, 보존하다’의 뜻이 강해 ‘지키다’로 옮겼고, muros tuos는 문자적으로 ‘네 성벽’이어서 이를 살렸습니다.
theological_decisions:
- issue: 화자와 명령형의 형식 유지
  chosen_reading: 직접 명령을 살려, 본문 전체를 권고문이 아니라 신적 명령으로 읽히게 했습니다.
  alternative_readings:
  - 완화된 권고문조차 자연스럽게 읽히도록 옮김
  - 더 서술적으로 풀어 전달
  rationale: 본문은 연속된 명령형으로 구성되어 있어, 한국어도 명령의 긴장을 유지해야 원문의 권위와 수사적 힘이 보존됩니다.
  doctrine_reference: 문학적-수사적 보존 원칙
