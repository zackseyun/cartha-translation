review_pass:
  verdict: revise
  source_fidelity: 라틴어의 모든 명령형(inridere noli, tutare, admitte, serua)을 한국어 명령형으로 일관되게 옮겨야 합니다. 초안의 ‘보호하겠고’와 ‘하겠습니다’는 1인칭 미래형으로 바뀌어 화자와 명령의 방향을 잘못 전달합니다.
  naturalness: ‘저는 … 하겠고’는 앞뒤의 명령문과 문법적으로도 의미상으로도 맞지 않습니다. ‘다리를 저는 이’, ‘보지 못하는 이’는 현대 표준어에서 비하감을 피하면서도 원문의 신체 상태 지칭을 충실히 전달합니다.
  terminology: claritatis meae는 ‘내 영광’으로, ad ... admitte는 단순히 보게 하는 것보다 ‘들이다’의 동작을 보존하여 ‘내 영광을 보는 자리로 들이십시오’로 옮깁니다. intra muros tuos는 성읍의 보호 범위라는 표현을 살려 ‘네 성벽 안에’로 유지합니다.
  issues:
  - severity: high
    issue: 명령형이 1인칭 미래형으로 오역됨
    rationale: tutare와 admitte는 모두 단수 명령형인데, ‘보호하겠고’와 ‘하겠습니다’는 화자가 자신을 가리키는 미래형입니다.
  - severity: medium
    issue: 각주가 현 본문의 대안 번역으로 기능하지 않음
    rationale: 각주는 앞 절(2:20)의 ‘부서진 자와 약한 자를 돌보라’를 포함하고 현절 본문을 재배열한 이전 번역일 뿐이므로, 2:21의 유효한 원문 변이 또는 번역 대안으로 제시되어서는 안 됩니다.
  revised_text: 조롱하지 마십시오. 다리를 저는 이와 보지 못하는 이를 보호하고, 그들을 내 영광을 보는 자리로 들이십시오. 노인과 젊은이를 네 성벽 안에 지키십시오.
