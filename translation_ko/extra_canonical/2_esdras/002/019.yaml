  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: fructibus Et totidem fontes fluentes lac et mel et montes inmensos septem habentes rosam et lilium, in quibus gaudio replebo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/019.yaml
  text: and as many springs flowing with milk and honey[a], and seven mighty mountains having roses and lilies, in which I will fill your children with joy.
  footnotes:
  - marker: a
    text: Or 'having rose and lily'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 젖과 꿀이 흐르는 샘도 그 수만큼 있으며, 장미와 백합을 지닌 일곱 큰 산들도 있으니, 나는 그 안에서 너희 자녀를 기쁨으로 채우겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 rosam et lilium은 문맥상 ‘장미와 백합’을 집합적으로 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: fructibus Et totidem fontes fluentes lac et mel
  english_pob_choice: and as many springs flowing with milk and honey
  chosen_korean: 젖과 꿀이 흐르는 샘도 그 수만큼 있으며
  alternatives_korean:
  - 젖과 꿀이 흘러나오는 샘도 그만큼 있으며
  - 젖과 꿀이 흐르는 샘들이 그 수만큼 있으며
  lexicon: 샘 / 젖 / 꿀
  rationale: 라틴어의 풍성한 병렬을 살리면서도 한국어에서는 자연스럽게 ‘샘’ 하나를 중심으로 흐름을 묘사하는 문장이 가장 읽기 좋습니다.
- source_word: montes inmensos septem habentes rosam et lilium
  english_pob_choice: seven mighty mountains having roses and lilies
  chosen_korean: 장미와 백합을 지닌 일곱 큰 산들
  alternatives_korean:
  - 장미와 백합을 가진 일곱 큰 산들
  - 장미와 백합이 있는 일곱 웅대한 산들
  lexicon: 지니다 / 큰 산들 / 장미 / 백합
  rationale: 라틴어 habentes의 ‘가지다’보다, 산의 표면적 특징을 묘사하는 ‘지닌’이 더 자연스럽고 이미지를 보존합니다.
- source_word: in quibus gaudio replebo
  english_pob_choice: in which I will fill your children with joy
  chosen_korean: 나는 그 안에서 너희 자녀를 기쁨으로 채우겠습니다
  alternatives_korean:
  - 나는 그것들 안에서 너희 자녀를 기쁨으로 채우겠습니다
  - 나는 그곳에서 너희 자녀를 기쁨으로 채우겠습니다
  lexicon: 그 안에서 / 기쁨으로 채우다
  rationale: in quibus를 ‘그 안에서’로 옮겨 장소적 포함을 분명히 했고, replebo를 단순히 ‘기쁘게 하다’가 아니라 ‘기쁨으로 채우다’로 살렸습니다.
theological_decisions:
- issue: 미래 약속의 화법
  chosen_reading: 하나님의 약속 선언으로 읽어 ‘…채우겠습니다’라는 확정적 미래형으로 옮겼습니다.
  alternative_readings:
  - ‘채워 주겠습니다’처럼 약속의 시혜성을 더 드러내는 번역
  - ‘채울 것입니다’로 더 중립적인 미래형 번역
  rationale: 본문은 위로와 회복의 약속을 직접적으로 선포하므로, 한국어에서도 장차의 확정된 선물이라는 뉘앙스를 살리는 것이 적절합니다.
  doctrine_reference: 위로와 종말론적 회복 약속
