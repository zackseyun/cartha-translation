  naturalness: ‘젖과 꿀이 흐르는 샘들도 그만큼 있고’와 ‘장미와 백합이 피어 있는 일곱 개의 거대한 산들도 있으니’는 현대 표준 한국어에서 자연스럽고 병렬 구조도 분명합니다. 합쇼체 약속 표현 ‘채우겠습니다’를 유지했습니다.
