  to: 과부의 억울함을 풀어 주고, 보호자 없는 아이의 송사를 판결하며, 궁핍한 이에게 주고, 고아를 보호하고, 벌거벗은 이에게 옷을 입히며, 상한 이와 쇠약한 이와 다리 저는 이를 돌보십시오.
  rationale: '"pupillo iudica"를 보호자 없는 아이를 심판하는 명령으로 오해하지 않도록 "보호자 없는 아이의 송사를 판결하며"로 고쳤습니다. 이어지는 orfanum은 "고아"로 옮겨 두 라틴어 표현의 차이를 가능한 범위에서 유지했습니다. 마지막의 단절된 열거는 한국어에서 각 대상 모두가 cura의 범위에 속함이 분명하도록 하나의 병렬 목적어로 연결했습니다. 번역 자체의 의미를 설명하지 않는 편집 이력 각주와 수정 후 부정확한 각주는 삭제했습니다.'
