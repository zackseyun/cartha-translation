id: 2ES.2.20
reference: 2 Esdras 2:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: filios tuos. Viduam iustifica, pupillo iudica, egenti da, orfanum tuere, nudum uesti, Confractum et debilem cura, claudum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/020.yaml
  text: Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked, care for the broken and the weak, the lame
translation:
  language: ko
  text: 과부를 변호하고, 고아를 심판하며, 궁핍한 이에게 주고, 아버지 없는 아이를 보호하고, 벌거벗은 이에게 옷을 입히며, 부서진 이와 연약한 이를 돌보고, 다리를 저는 이를 돌보십시오.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 iustifica는 법정적 ‘심판’보다 과부의 억울함을 풀어 주는 ‘변호하다’의 뉘앙스가 강합니다.
    reason: lexical_alternative
  - marker: b
    text: 원문의 orfanum은 단순한 ‘고아’보다 ‘아버지 없는 아이’에 가깝습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절 Confractum et debilem cura, claudum을 POB 갱신본의 취지를 따라 반영했습니다.
    reason: source_note
lexical_decisions:
- source_word: Viduam iustifica
  english_pob_choice: Vindicate the widow
  chosen_korean: 과부를 변호하고
  alternatives_korean:
  - 과부의 편을 들고
  - 과부를 의롭게 하고
  lexicon: iustifica
  rationale: iustifica는 단순한 법정적 ‘판결’보다 억울함을 풀어 주는 적극적 변호/변론의 뜻이 강하므로, POB의 ‘Vindicate’를 따라 ‘변호하다’로 옮겼습니다.
- source_word: pupillo iudica
  english_pob_choice: judge for the orphan
  chosen_korean: 고아를 심판하며
  alternatives_korean:
  - 고아를 재판하며
  - 고아를 판결하며
  lexicon: iudica
  rationale: iudica는 문맥상 ‘고아를 위한 판결을 내리다’는 뜻이므로, 한국어에서는 직역에 가까운 ‘심판하다’를 유지하되 대상의 보호를 암시하는 전후 병렬 구조를 살렸습니다.
- source_word: egenti da, orfanum tuere, nudum uesti
  english_pob_choice: give to the needy, protect the fatherless, clothe the naked
  chosen_korean: 궁핍한 이에게 주고, 아버지 없는 아이를 보호하고, 벌거벗은 이에게 옷을 입히며
  alternatives_korean:
  - 가난한 이에게 주고, 고아를 돌보고, 벗은 이를 입히며
  - 궁핍한 사람에게 베풀고, 부친 없는 아이를 지키고, 벌거벗은 자를 입히며
  lexicon: egenti / orfanum / nudum
  rationale: egenti는 단순한 빈곤보다 ‘궁핍함’을, orfanum은 현대 한국어의 ‘고아’보다 직역성을 살린 ‘아버지 없는 아이’를 택해 원문의 사회적 취약성 강조를 보존했습니다.
- source_word: Confractum et debilem cura, claudum
  english_pob_choice: care for the broken and the weak, the lame
  chosen_korean: 부서진 이와 연약한 이를 돌보고, 다리를 저는 이를 돌보십시오.
  alternatives_korean:
  - 상한 이와 약한 이를 돌보고, 절뚝거리는 이를 돌보십시오.
  - 깨어진 자와 허약한 자, 절뚝이는 자를 돌보십시오.
  lexicon: confractum / debilem / claudum
  rationale: confractum은 ‘부서진’, debilem은 단순 병약보다 ‘연약한’, claudum은 신체적 장애를 분명히 드러내는 ‘다리를 저는 이’로 옮겨 POB의 확장된 마지막 절을 반영했습니다.
theological_decisions:
- issue: 취약한 자들을 향한 일련의 명령문의 결합
  chosen_reading: 본문을 사회적 약자를 향한 연속 명령으로 유지하고, 마지막 항목까지 끊지 않고 연결했습니다.
  alternative_readings:
  - 중간에 문장을 끊어 일반적 권고문으로 완화하는 번역
  - 마지막 항목을 누락하거나 ‘약한 자’로만 뭉뚱그리는 번역
  rationale: 라틴어 원문과 POB 갱신본은 과부, 고아, 가난한 이, 벌거벗은 이, 상한 이, 약한 이, 절뚝거리는 이를 연속적으로 돌보라는 강한 윤리적 요구를 제시하므로 그 급박함을 보존했습니다.
  doctrine_reference: 구약적 자비 윤리와 공동체적 정의
