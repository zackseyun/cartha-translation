    rationale: orfanum은 일반적으로 고아 또는 보호받지 못하는 아이를 가리킬 수 있으며, 이 라틴어 어형만으로 아버지의 부재만을 특정하기는 어렵습니다.
  - severity: low
    issue: 각주 a와 b의 어휘 설명은 본문 수정 후 불필요하거나 부정확합니다.
    rationale: 수정문은 iustifica의 문맥적 의미와 pupillus/orfanum의 구별을 본문에서 자연스럽게 처리하므로, 기존 각주는 독자의 이해를 추가로 돕지 않으며 b는 원문의 의미를 과도하게 좁힙니다. c는 번역 각주가 아니라 편집 이력을 설명합니다.
