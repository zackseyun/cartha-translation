    rationale: pupillo는 여격으로 이해되며, iudica는 그 아이를 심판하라는 명령이 아니라 그를 위해 न्याय을 행하거나 그의 사건을 판결하라는 뜻입니다. 한국어 목적격 "고아를 심판하다"는 고아 자체를 처벌·재판하는 뜻이 됩니다.
  - severity: medium
