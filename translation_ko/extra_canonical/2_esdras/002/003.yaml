  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Educaui uos cum laetitia et amisi uos cum luctu et tristitia,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/003.yaml
  text: I raised you with gladness, and I lost you with mourning and sorrow,
translation:
  language: ko
  text: 기쁨으로 너희를 길러 내었는데, 슬픔과 비탄으로 너희를 잃었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Educaui uos
  english_pob_choice: I raised you
  chosen_korean: 너희를 길러 내었는데
  alternatives_korean:
  - 너희를 키웠는데
  - 너희를 양육했는데
  - 너희를 일으켰는데
  lexicon: educo
  rationale: 라틴어 educaui는 단순히 ‘낳다’보다 ‘양육하여 자라게 하다/길러 내다’의 뜻이 강해, POB의 ‘raised’에 맞추어 관계적·양육적 뉘앙스를 살렸습니다.
- source_word: cum laetitia
  english_pob_choice: with gladness
  chosen_korean: 기쁨으로
  alternatives_korean:
  - 즐거움으로
  - 환희로
  - 기쁜 마음으로
  lexicon: laetitia
  rationale: laetitia는 단순한 정서적 ‘기쁨’이 자연스러우며, 한국어 부사구로는 ‘기쁨으로’가 가장 간결하고 본문 리듬도 잘 살립니다.
- source_word: amisi uos
  english_pob_choice: I lost you
  chosen_korean: 너희를 잃었습니다
  alternatives_korean:
  - 너희를 잃어버렸습니다
  - 너희를 상실했습니다
  - 너희를 떠나보냈습니다
  lexicon: amitto
  rationale: amisi는 실제로 ‘잃다/상실하다’의 의미를 가지므로, POB의 직설적 표현을 따라 ‘잃었습니다’로 옮겼습니다.
- source_word: cum luctu et tristitia
  english_pob_choice: with mourning and sorrow
  chosen_korean: 슬픔과 비탄으로
  alternatives_korean:
  - 애도와 슬픔으로
  - 애통과 슬픔으로
  - 통곡과 슬픔으로
  lexicon: luctus; tristitia
  rationale: luctus는 ‘애도/통곡’까지 가능하지만, 여기서는 tristitia와의 병렬을 살려 보다 일반적인 ‘슬픔과 비탄’으로 처리했습니다.
