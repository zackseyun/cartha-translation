id: 2ES.2.13
reference: 2 Esdras 2:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Petite et accipietis, rogate uobis dies paucos ut minorentur; iam paratum est uobis regnum: uigilate.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/013.yaml
  text: Ask[13], and you will receive; pray that your few days may be shortened. The kingdom is already prepared for you[a]; keep watch.
  footnotes:
  - marker: '13'
    text: The line about praying that the days be 'few and shortened' is difficult in Latin. It likely refers to the shortening of the present age or present distress rather than to a wish for a short lifespan.
    reason: lexical_alternative
  - marker: a
    text: Or 'pray that your days may be few and shortened'.
    reason: previous_rendering
translation:
  language: ko
  text: 구하라, 그러면 받으실 것입니다. 여러분의 짧은 날들이 더 줄어들도록 기도하십시오[a]. 이미 여러분을 위해 나라가 준비되어 있습니다. 깨어 있으십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '여러분의 날들이 짧고 더 줄어들도록 기도하십시오'.
    reason: previous_rendering
lexical_decisions:
- source_word: Petite et accipietis
  english_pob_choice: Ask, and you will receive
  chosen_korean: 구하라, 그러면 받으실 것입니다
  alternatives_korean:
  - 구하십시오, 그러면 받게 될 것입니다
  - 구하면 받으실 것입니다
  lexicon: Petite / accipietis
  rationale: 두 명령과 약속의 병렬을 살리되, 합쇼체로 자연스럽게 옮겼습니다. 일반적 청유형보다 직접 명령형이 원문의 간결한 격언성을 더 잘 드러냅니다.
- source_word: rogate uobis dies paucos ut minorentur
  english_pob_choice: pray that your few days may be shortened
  chosen_korean: 여러분의 짧은 날들이 더 줄어들도록 기도하십시오
  alternatives_korean:
  - 여러분의 몇 날이 줄어들도록 기도하십시오
  - 여러분의 남은 날들이 줄어들도록 기도하십시오
  lexicon: rogate uobis dies paucos ut minorentur
  rationale: 라틴어의 예고적 구조를 반영해 '날들'을 목적어로 두고, '더 줄어들도록'으로 단축의 의미를 살렸습니다. '짧은 날들'은 POB의 문맥상 현재 시대/환난의 단축 가능성을 열어두는 표현입니다.
- source_word: regnum
  english_pob_choice: The kingdom
  chosen_korean: 나라
  alternatives_korean:
  - 하나님의 나라
  - 왕국
  lexicon: regnum
  rationale: 이 본문은 절대적 수식어가 없는 regnum이므로, 문맥상 이미 준비된 통치 영역을 간결하게 '나라'로 옮겼습니다. 필요하면 주석이나 문맥에서 하나님의 나라로 이해될 수 있으나, 본문 자체는 수식어를 덧붙이지 않았습니다.
- source_word: uigilate
  english_pob_choice: keep watch
  chosen_korean: 깨어 있으십시오
  alternatives_korean:
  - 경계하십시오
  - 깨어 지키십시오
  lexicon: uigilate
  rationale: 감시/경계의 지속성을 한국어 관용으로 가장 자연스럽게 드러내는 표현을 택했습니다. 단순히 '보라'보다 종말론적 경계의 뉘앙스를 보존합니다.
theological_decisions:
- issue: '''few days''의 의미가 수명인지, 현재 시대/환난의 단축인지'
  chosen_reading: 개인 수명 요청이 아니라, 종말론적 현재 고난이나 시대의 단축을 염두에 둔 표현으로 이해할 수 있게 번역했습니다.
  alternative_readings:
  - 여러분의 생애가 짧아지도록 기도하라는 뜻
  - 단순히 며칠이 적어지도록 기도하라는 뜻
  rationale: 영어 POB 주석이 지적하듯 라틴어 문장은 난해하며, 문맥과 다른 묵시문맥을 고려하면 수명 단축보다 현재의 시간/환난 단축이 더 적절합니다. 그래서 한국어도 그 긴장을 지우지 않도록 남겨 두었습니다.
  doctrine_reference: 종말론적 환난 단축과 기도의 응답성
- issue: regnum의 신학적 지시 대상
  chosen_reading: 본문에서는 '하나님의 나라'로 특정하지 않고 '나라'로 남겼습니다.
  alternative_readings:
  - 하나님의 나라
  - 메시아의 나라
  rationale: 라틴어 원문이 수식어 없는 regnum을 사용하므로, 본문 자체의 모호성을 보존하는 것이 원문 충실성에 부합합니다. 신학적 특정화는 문맥과 주해에서 다루는 편이 안전합니다.
  doctrine_reference: 본문의 모호성 보존
