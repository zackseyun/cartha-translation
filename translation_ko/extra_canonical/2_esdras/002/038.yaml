lexical_decisions:
- source_word: caelestia regna
  english_pob_choice: the heavenly kingdom
  chosen_korean: 하늘의 나라
  alternatives_korean:
  - 하늘 왕국
  - 천상의 나라
  lexicon: kingdom / βασιλεία 대응 관용구
  rationale: 영어 POB의 ‘heavenly kingdom’을 너무 해설적으로 풀지 않고, 하늘의 통치 영역을 자연스럽게 드러내는 ‘하늘의 나라’로 옮겼습니다.
- source_word: uocauit
  english_pob_choice: He has called
  chosen_korean: 불렀습니다
  alternatives_korean:
  - 소환하셨습니다
  - 불러 오셨습니다
  lexicon: vocare
  rationale: 라틴어의 단순 과거 완료적 서술을 한국어에서 자연스러운 현재완료 느낌의 ‘불렀습니다’로 옮겨, 선언적 진술을 살렸습니다.
- source_word: Surgite et state
  english_pob_choice: Rise and stand
  chosen_korean: 일어나 서서
  alternatives_korean:
  - 일어나 서십시오
  - 일어나서 서십시오
  lexicon: imperative sequence
  rationale: 연속 명령의 긴박함을 살리되, 합쇼체 수신명령으로 ‘일어나 서서’라고 간결하게 옮겼습니다.
- source_word: uidete numerum
  english_pob_choice: see the number
  chosen_korean: 그 수를 보십시오
  alternatives_korean:
  - 그 숫자를 보십시오
  - 수를 보십시오
  lexicon: numerus
  rationale: 단순한 숫자 개념보다 ‘셈된 총수’의 뉘앙스를 살리기 위해 ‘그 수’를 택했습니다.
theological_decisions:
- issue: caelestia regna의 의미 범위
  chosen_reading: 특정 제도명보다 하늘에 속한 왕권/통치 영역을 가리키는 표현으로 ‘하늘의 나라’라고 옮겼습니다.
  alternative_readings:
  - 하늘 왕국
  - 천상의 왕국
  rationale: 본문은 천상적 실재를 지시하지만 한국어에서 ‘왕국’은 지리적 제국 이미지를 강하게 띠므로, 원문의 범위를 과도하게 좁히지 않는 ‘나라’가 더 적절합니다.
  doctrine_reference: 종말론적 하나님의 통치에 대한 일반적 성경 용례
