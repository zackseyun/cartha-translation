  source_fidelity: 라틴어의 미래형 deficiet는 ‘다하지 않을 것입니다’로 적절히 반영되었습니다. fontes의 복수도 ‘샘들’로 보존되었습니다. 다만 제시된 라틴어 발췌는 문두가 절단되어 목적어 tuos만 남아 있으나, 영어 POB의 ‘Embrace’ 및 문맥상 포옹하라는 명령을 전제한 번역은 안전합니다.
  naturalness: ‘품어 주고’는 합쇼체 명령문으로 끝나지 않고, 뒤의 ‘선포하십시오’와 높임 및 문체가 어울리지 않습니다. ‘품으시고’로 고치면 현대 공적 문체의 연결 명령으로 자연스럽습니다.
  terminology: misericordiam은 ‘자비’, gratia는 ‘은혜’로 일관되고 자연스럽습니다. ‘결코 다하지 않을 것입니다’는 미래의 부정을 분명히 드러냅니다.
