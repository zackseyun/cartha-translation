  lexicon: praedico + misericordia
  rationale: praedica는 단순 전달보다 공적 선포의 뉘앙스가 있어 ‘선포하십시오’로 옮기고, misericordia는 자비가 본문 의미를 가장 직접적으로 드러냅니다.
- source_word: gratia mea non deficiet
  english_pob_choice: my grace will not fail
  chosen_korean: 내 은혜는 결코 다하지 않을 것입니다
