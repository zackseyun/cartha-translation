id: 2ES.2.5
reference: 2 Esdras 2:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/005.yaml
  text: But I call on you[a], Father, as a witness against the mother of the children, because they were unwilling to keep my covenant,
  footnotes:
  - marker: a
    text: Or 'over the mother of these children'.
    reason: previous_rendering
translation:
  language: ko
  text: 긍휼을…. 그러나 나는 그들이 내 언약을 지키기를 원하지 않았기 때문에, 아버지이신 당신을 자녀들의 어머니를 거슬러 증인으로 부릅니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 super는 여기서 법정적 호소의 문맥상 ‘~을 거슬러’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: misericordiam
  english_pob_choice: —
  chosen_korean: 그러나
  alternatives_korean:
  - 자비를
  - 긍휼을
  lexicon: —
  rationale: 주어진 라틴어 조각이 문장 단독으로는 앞뒤 문맥에 걸친 연결어처럼 보이므로, 본문 시작을 자연스럽게 잇는 역접어로 처리했습니다. 다만 이 절편만으로는 독립 번역이 불완전하므로 과잉 확정은 피했습니다.
- source_word: testem invoco
  english_pob_choice: I call on you ... as a witness
  chosen_korean: 증인으로 ... 부르오니
  alternatives_korean:
  - 증인으로 부르오니
  - 증언자라고 부르오니
  lexicon: testis
  rationale: 라틴어 법정 표현을 살려 단순한 호칭이 아니라 ‘증인으로 부르다’는 행위를 유지했습니다.
- source_word: super matrem filiorum
  english_pob_choice: against the mother of the children
  chosen_korean: 자녀들의 어머니를 거슬러
  alternatives_korean:
  - 자녀들의 어머니에 대하여
  - 자녀들의 어머니 위에
  lexicon: super
  rationale: 감정적/법정적 대항 관계를 드러내기 위해 ‘거슬러’를 택했습니다. 영어 POB의 수정처럼 라틴어 super의 적대적 법정 용법을 반영합니다.
- source_word: testamentum meum seruare
  english_pob_choice: keep my covenant
  chosen_korean: 제 언약을 지키려 하지 않았기 때문입니다
  alternatives_korean:
  - 제 언약을 지키지 않으려 했기 때문입니다
  - 제 언약을 지키지 않았기 때문입니다
  lexicon: testamentum
  rationale: POB의 ‘covenant’에 맞춰 ‘언약’을 사용했고, noluerunt의 의지 거부를 살려 ‘지키려 하지 않았습니다’로 옮겼습니다.
theological_decisions:
- issue: 언약의 거부를 단순 행위가 아니라 의지적 거절로 표현할지 여부
  chosen_reading: ‘지키려 하지 않았습니다’로 옮겨 거부 의지를 드러냈습니다.
  alternative_readings:
  - ‘지키지 않았습니다’
  - ‘지키기를 원하지 않았습니다’
  rationale: noluerunt는 단순 미이행보다 의지적 불원(不願)을 강하게 시사하므로, 심판 문맥의 책임성을 더 분명히 전달하는 표현을 택했습니다.
  doctrine_reference: 언약 책임성과 인간의 의지적 불순종
