id: 2ES.2.30
reference: 2 Esdras 2:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Filios tuos dormientes memorare, quoniam ego eos educam de
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/030.yaml
  text: Remember your sleeping children, for I will bring them out from the hidden places of the earth,
translation:
  language: ko
  text: 잠든 너희 자녀들을 기억하십시오. 내가 그들을 땅의 숨은 곳들에서 이끌어 내겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Filios tuos
  english_pob_choice: your children
  chosen_korean: 너희 자녀들을
  alternatives_korean:
  - 너의 자녀들을
  - 당신의 자녀들을
  lexicon: filios = children; tuos = your (plural)
  rationale: 복수 소유를 자연스럽게 살려 ‘너희 자녀들’로 옮기되, 예언적 권면의 직접성을 유지했습니다.
- source_word: dormientes
  english_pob_choice: sleeping
  chosen_korean: 잠든
  alternatives_korean:
  - 자는
  - 잠들어 있는
  lexicon: dormientes = sleeping / sleeping ones
  rationale: 분사적 성격을 한국어 형용사구로 자연화하되, 단순 상태를 넘어 ‘잠든’으로 간결하게 반영했습니다.
- source_word: educam de
  english_pob_choice: I will bring them out from
  chosen_korean: 이끌어 내겠습니다
  alternatives_korean:
  - 데리고 나오겠습니다
  - 끌어내겠습니다
  lexicon: educo = lead out, bring out
  rationale: 문맥상 ‘밖으로 꺼내다’보다 ‘이끌어 내다’가 원문의 출현/인도 이미지를 더 잘 살립니다.
- source_word: de ... (loci occultis terrae)
  english_pob_choice: from the hidden places of the earth
  chosen_korean: 땅의 숨은 곳들에서
  alternatives_korean:
  - 땅의 감추어진 곳들에서
  - 땅 깊은 곳에서
  lexicon: occultus = hidden, concealed; terra = earth
  rationale: 원문의 복수성 ‘곳들’을 보존하고, ‘숨은’으로 감추어짐의 상태를 직접 드러냈습니다.
theological_decisions:
- issue: ‘잠든’ 자녀의 상태가 단순한 수면인지 죽음의 완곡어인지
  chosen_reading: 문맥상 문자적 수면보다 죽음/무덤 상태를 암시하는 표현으로 유지하되, 본문 자체는 ‘잠든’으로 번역합니다.
  alternative_readings:
  - 죽어 있는 너희 자녀들
  - 잠들어 있는 너희 자녀들
  rationale: 라틴어는 단지 dormientes를 사용하지만, 2 Esdras의 문맥에서는 회복의 대상이 된 죽은 자들을 암시할 수 있어 과도한 해석은 피하고 원문 표면을 유지했습니다.
  doctrine_reference: 본문-문맥 우선, 완곡어법 보존
- issue: ‘땅의 숨은 곳들’의 종말론적 장소성
  chosen_reading: 지하 세계를 특정 교리 용어로 고정하지 않고, 원문의 시적·이미지적 표현을 그대로 살렸습니다.
  alternative_readings:
  - 땅속 깊은 곳들
  - 무덤들
  rationale: 원문은 추상적·시적 표현이므로, 의미를 선취해 ‘무덤’으로 좁히기보다 보존된 은유를 옮기는 것이 더 정확합니다.
  doctrine_reference: 시적 이미지 보존
