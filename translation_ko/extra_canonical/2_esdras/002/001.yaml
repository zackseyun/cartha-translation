id: 2ES.2.1
reference: 2 Esdras 2:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/001.yaml
  text: 'Thus says the Lord: I brought this people out of slavery[a], and I gave them commandments through my slaves the prophets, whom they were unwilling to hear, but they made my counsels void.'
  footnotes:
  - marker: a
    text: Or 'but they were unwilling to listen and made my counsels void.'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 이렇게 말씀하십니다. “내가 이 백성을 노예 상태에서 이끌어 내고, 내 종들인 예언자들을 통해 그들에게 계명을 주었으나, 그들은 그들의 말을 들으려 하지 않았고, 도리어 내 계획들을 헛되게 만들었습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대안으로, “그들은 예언자들의 말을 들으려 하지 않았고 내 계획들을 헛되게 만들었습니다”로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: seruitute
  english_pob_choice: slavery
  chosen_korean: 노예 상태
  alternatives_korean:
  - 종살이
  - 속박
  - 노예됨
  lexicon: 노예
  rationale: POB가 slavery를 직접적으로 드러내므로, 완곡한 '종살이'보다 상태를 분명히 보이는 '노예 상태'를 택했습니다.
- source_word: pueros meos prophetas
  english_pob_choice: my slaves the prophets
  chosen_korean: 내 종들인 예언자들
  alternatives_korean:
  - 내 노예들인 예언자들
  - 내 종들인 선지자들
  lexicon: δοῦλος
  rationale: 본문의 pueros는 직역상 종/노예의 소속 관계를 담고 있으나, 한국어에서는 예언자에 대해 '노예'를 붙이면 의미상 과도하므로, POB의 'my slaves the prophets'를 살리면서 문맥상 가능한 '종들'로 옮겼습니다.
- source_word: quos audire noluerunt
  english_pob_choice: whom they were unwilling to hear
  chosen_korean: 그들의 말을 들으려 하지 않았고
  alternatives_korean:
  - 그들을 들으려 하지 않았고
  - 그들의 말을 듣기를 원하지 않았고
  lexicon: ἀκούω / audire
  rationale: 라틴어는 예언자들을 직접 목적어로 두어 '그들을 들으려 하지 않았다'가 가능하지만, 한국어에서는 청종의 대상이 사람과 말에 걸치므로 자연스럽게 '그들의 말을 들으려 하지 않았다'로 옮겼습니다.
- source_word: mea consilia
  english_pob_choice: my counsels
  chosen_korean: 내 계획들
  alternatives_korean:
  - 내 뜻들
  - 내 조언들
  - 내 의도들
  lexicon: consilium
  rationale: consilia는 단순한 조언보다 하나님의 의도와 계획의 결합을 더 강하게 가리키므로, POB의 'counsels'를 한국어에서 가장 직접적으로 드러내는 '계획들'을 선택했습니다.
theological_decisions:
- issue: pueros meos prophetas의 인물 호칭과 종속성
  chosen_reading: 예언자들을 하나님의 '종들'로 표기해, 공적 사역자이면서도 하나님께 속한 존재라는 긴장을 보존했습니다.
  alternative_readings:
  - '''하인들''로 순화'
  - '''노예들''로 직역'
  rationale: POB의 slave를 무력화하지 않으면서도, 한국어에서 예언자를 '노예'라 부를 때 생길 수 있는 오해를 피해야 했습니다. 따라서 소속성과 종속성을 드러내는 '종들'을 채택했습니다.
  doctrine_reference: 예언자들의 신적 소명과 하나님의 주권 아래 있는 사역이라는 성경적 표현의 긴장
- issue: malediction보다도 '계명'과 '계획들'의 대비
  chosen_reading: 하나님이 계명을 주셨으나 백성이 그것을 거부해 하나님의 계획을 헛되게 했다는 대비를 분명히 했습니다.
  alternative_readings:
  - '''훈계''로 약화'
  - '''권고''로 완화'
  rationale: 본문은 단순한 조언 거부가 아니라 명령과 하나님의 의도 전반에 대한 반역을 말하므로, '계명'과 '계획들'을 유지해 죄의 강도를 보존했습니다.
  doctrine_reference: 계시된 명령에 대한 불순종과 언약 백성의 책임
