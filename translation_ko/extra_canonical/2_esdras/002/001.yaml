  naturalness: 합쇼체 문장으로 자연스럽고 공적 성경 번역의 문체에 맞습니다. ‘노예 상태에서 이끌어 내고’, ‘내 종들인 예언자들을 통해’도 자연스럽습니다.
  terminology: ‘계명’, ‘종들인 예언자들’, ‘계획들’은 문맥상 수용 가능합니다. 특히 라틴어 *pueros meos prophetas*의 종속 관계를 ‘내 종들인 예언자들’로 나타낸 것은 한국어 용법과 원문의 의미를 함께 고려한 적절한 선택입니다.
