  source_fidelity: ‘populus meus’와 이에 받는 ‘tua’는 라틴어에서 단수 집합명사 및 단수 소유형이므로 ‘내 백성아, 네 안식’으로 옮기는 것이 원문에 더 가깝습니다. ‘nutrix bona’ 및 명령형 ‘nutri’의 유모 이미지와 양육 명령, ‘pedes eorum’의 문자적 이미지는 유지했습니다. 라틴어의 quia는 영어처럼 독립 문장에서는 다소 미완성적으로 들리므로, 한국어에서는 약속의 진술로 자연스럽게 처리했습니다.
  naturalness: 기존의 ‘올 것이기 때문입니다’는 앞뒤에 그것이 이유가 되는 내용이 없이 독립되어 있어 한국어 문장으로 부자연스럽습니다. ‘발을 굳세게 하십시오’는 원문의 신체 이미지를 보존하면서도 ‘발을 강하게 하십시오’보다 자연스럽습니다.
  terminology: ‘안식’은 requies에 적절하며, ‘좋은 유모’는 bona nutrix의 평이한 뜻과 호격을 보존합니다. ‘자녀들’과 ‘그들의 발’도 영어 POB 감사 문구에 따른 보충 구절의 의미를 정확히 반영합니다.
