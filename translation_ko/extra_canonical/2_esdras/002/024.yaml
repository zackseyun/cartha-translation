  yaml_path: translation/extra_canonical/2_esdras/002/024.yaml
  text: My people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.
translation:
  language: ko
  text: 내 백성아, 네 안식이 올 것입니다. 좋은 유모여, 네 자녀들을 기르시고 그들의 발을 굳세게 하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: populus meus
  english_pob_choice: My people
  chosen_korean: 내 백성들아
  alternatives_korean:
  - 내 백성이여
  - 내 백성아
  lexicon: populus
  rationale: 직접 호칭의 호소력을 살리기 위해 ‘내 백성들아’로 옮겼습니다. 복수 호칭을 드러내며, 문맥의 위로와 부름을 자연스럽게 전달합니다.
- source_word: ueniet requies tua
  english_pob_choice: your rest will come
  chosen_korean: 너희의 안식이 올 것이기 때문입니다
  alternatives_korean:
  - 너희의 쉼이 올 것이기 때문입니다
  - 너희의 평안이 올 것이기 때문입니다
  lexicon: requies
  rationale: requies의 핵심을 ‘안식’으로 유지해 단순한 휴식보다 종말론적 쉼의 뉘앙스를 살렸습니다. 원문의 이유절 ueniet를 반영해 ‘~기 때문입니다’로 연결했습니다.
- source_word: Nutrix bona
  english_pob_choice: Good nurse
  chosen_korean: 좋은 유모여
  alternatives_korean:
  - 선한 유모여
  - 좋은 양육자여
  lexicon: nutrix
  rationale: nutrix는 아기나 아이를 돌보는 ‘유모/양육자’의 의미가 강하므로 ‘유모’로 옮겼습니다. 호격의 직접성을 살려 ‘여’를 붙였습니다.
- source_word: nutri ... et confirma pedes eorum
  english_pob_choice: nourish your children, and strengthen their feet
  chosen_korean: 네 자녀들을 기르고 그들의 발을 강하게 하십시오
  alternatives_korean:
  - 네 자녀들을 먹이고 그들의 발을 굳세게 하십시오
  - 네 자녀들을 양육하고 그들의 발을 굳게 하십시오
  lexicon: nutri / pedes
  rationale: nutri는 단순한 먹임보다 양육·기름의 뜻이 있어 ‘기르다’로 넓게 살렸습니다. pedes eorum는 문자적으로는 ‘그들의 발’이므로, 안전한 걸음과 삶의 지속을 암시하는 표현으로 유지했습니다.
theological_decisions:
- issue: 위로의 선언과 양육 명령의 결합
  chosen_reading: 앞절의 약속을 근거로 한 위로의 호칭 뒤에, 이어서 공동체를 돌보라는 명령을 그대로 유지했습니다.
  alternative_readings:
  - 안식의 약속만 따로 강조해 뒤의 명령을 약화시키는 번역
  - 유모 이미지를 단순 비유로 바꾸어 돌봄의 강도를 낮추는 번역
  rationale: 이 절은 약속과 명령이 함께 있어, 위로와 책임을 동시에 드러내야 합니다. 둘을 분리하거나 완화하면 원문의 호소력이 약해집니다.
  doctrine_reference: pastoral exhortation / consolation
- issue: pedes eorum의 문자성과 상징성
  chosen_reading: ‘그들의 발’을 문자적으로 살리되, 삶의 여정과 견딤을 암시하는 표현으로 이해될 수 있게 했습니다.
  alternative_readings:
  - ‘그들의 길’을 의역하여 발의 이미지를 제거하는 번역
  - ‘발걸음’을 넣어 해석을 덧붙이는 번역
  rationale: 원문은 신체 부위를 직접 말하므로 이미지를 유지하는 것이 우선입니다. 동시에 한국어에서 자연스럽게 삶의 걸음을 떠올리게 합니다.
  doctrine_reference: biblical imagery
