  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uestrae; ego testor palam saluatorem meum. Commendatum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/036.yaml
  text: Flee the shadow of this age; receive the gladness of your glory[a]. I openly call my Savior to witness.
  footnotes:
  - marker: a
    text: Or 'I bear witness openly to my Savior.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이 시대의 그림자를 피하고, 여러분의 영광의 기쁨을 받으십시오[a]. 나는 내 구원자를 공개적으로 증인으로 부릅니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러분의 영광의 기쁨을 받으십시오’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: uestrae
  english_pob_choice: your glory
  chosen_korean: 여러분의 영광
  alternatives_korean:
  - 당신들의 영광
  - 너희의 영광
  lexicon: uestrae → 복수 소유 대명사
  rationale: 복수 소유를 분명히 드러내기 위해 ‘여러분의’로 옮겼습니다. 문맥상 공동체를 향한 권면으로 읽히므로 현대 한국어의 합쇼체와도 잘 맞습니다.
- source_word: saluatorem meum
  english_pob_choice: my Savior
  chosen_korean: 내 구원자
  alternatives_korean:
  - 내 구주
  - 나의 구원자
  lexicon: saluatorem → 구원자
  rationale: POB의 ‘Savior’를 소스 직역에 가깝게 살려 ‘구원자’로 옮겼습니다. 전통적 교회어인 ‘구주’도 가능하지만, 본문에는 인물의 호칭으로서의 직접성이 더 뚜렷합니다.
- source_word: testor palam
  english_pob_choice: I openly call ... to witness
  chosen_korean: 공개적으로 증인으로 부릅니다
  alternatives_korean:
  - 공개적으로 증인으로 삼습니다
  - 드러내어 증언합니다
  lexicon: testor + accusative personal object
  rationale: 라틴어 testor는 단순히 ‘증언하다’가 아니라 대상을 증인으로 호출하는 관용구이므로, ‘증인으로 부르다’로 옮겨 그 법정적·서약적 뉘앙스를 유지했습니다.
theological_decisions:
- issue: saluatorem meum을 단순한 신앙 고백이 아니라 증인 호출로 읽는 문제
  chosen_reading: ‘나는 내 구원자를 공개적으로 증인으로 부릅니다’로 번역해, 화자가 구원자를 자신의 진술과 경고의 증인으로 소환하는 장면으로 나타냈습니다.
  alternative_readings:
  - ‘나는 공개적으로 내 구원자에게 증언합니다’
  - ‘나는 내 구원자에 대해 공개적으로 증언합니다’
  rationale: 수정된 영어 POB도 testor의 관용적 의미를 반영해 ‘call ... to witness’로 잡고 있으므로, 본문은 구원자에 대한 일반적 증언보다 구원자를 증인으로 부르는 선언으로 이해하는 것이 더 정확합니다.
  doctrine_reference: 문법적·수사적 독해(라틴어 testor 관용구)
