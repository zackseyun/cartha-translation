  source_fidelity: 라틴어의 기원·명령적 문맥을 충실히 반영합니다. generatio eorum은 영어 감사본의 문맥적 해석인 ‘자손이 끊어지다’로 자연스럽게 옮겼고, dispergantur, deleantur의 수동적 심판 기원도 한국어에서 하나님께 드리는 요청형으로 무리 없이 재현했습니다. gentes의 복수성은 ‘여러 민족 가운데’에 드러나며, ‘내 언약’은 testamentum의 문맥상 의미에 맞습니다.
  naturalness: 현대 표준 한국어 합쇼체로 자연스럽습니다. 세 기원문의 병렬과 마지막 이유절의 연결도 명료합니다. ‘지워 버리십시오’는 deleantur의 소거 이미지를 직접적으로 전달하면서도 과도하게 비문어적이지 않습니다.
  terminology: ‘자손’, ‘민족’, ‘이름’, ‘언약’의 선택이 문맥과 한국어 성경 용례에 적절합니다. 특히 testamentum을 ‘유언’이 아니라 ‘언약’으로 처리한 것은 본문 문맥에 부합합니다.
