id: 2ES.2.7
reference: 2 Esdras 2:7
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: generatio eorum fiat. Dispergantur in gentes, nomina eorum deleantur a terra, quoniam spreuerunt testamentum meum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/007.yaml
  text: May their offspring cease. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.
translation:
  language: ko
  text: 그들의 자손이 끊어지게 하십시오. 그들을 여러 민족 가운데로 흩으시고, 그들의 이름을 땅에서 지워 버리십시오. 그들이 내 언약을 업신여겼기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: generatio eorum fiat
  english_pob_choice: May their offspring cease.
  chosen_korean: 그들의 자손이 끊어지게 하십시오.
  alternatives_korean:
  - 그들의 후손이 없게 하십시오.
  - 그들의 자손이 존재하지 않게 하십시오.
  lexicon: generatio
  rationale: 라틴어 명령/기원형의 imprecatory 뉘앙스를 살려, 단순한 서술이 아니라 저주적 요청으로 자연스럽게 옮겼습니다.
- source_word: Dispergantur in gentes
  english_pob_choice: Let them be scattered among the nations
  chosen_korean: 그들을 여러 민족 가운데로 흩으시고
  alternatives_korean:
  - 그들을 민족들 가운데 흩어지게 하시고
  - 그들을 나라들 가운데로 흩으시고
  lexicon: dispergo
  rationale: gentes를 ‘민족’으로 옮겨 라틴어의 집단·민족적 분산 의미를 보존했고, 수동적 명령형을 한국어 청유/기원형으로 처리했습니다.
- source_word: nomina eorum deleantur a terra
  english_pob_choice: let their names be blotted out from the earth
  chosen_korean: 그들의 이름을 땅에서 지워 버리십시오
  alternatives_korean:
  - 그들의 이름이 땅에서 삭제되게 하십시오
  - 그들의 이름을 땅에서 말소해 버리십시오
  lexicon: deleo
  rationale: deleantur의 강한 소거 이미지를 살리되, 현대 한국어에서 가장 직접적인 ‘지워 버리다’로 번역했습니다.
- source_word: quoniam spreuerunt testamentum meum
  english_pob_choice: because they despised my covenant
  chosen_korean: 그들이 내 언약을 업신여겼기 때문입니다.
  alternatives_korean:
  - 그들이 내 언약을 멸시했기 때문입니다.
  - 그들이 내 언약을 경멸했기 때문입니다.
  lexicon: testamentum
  rationale: testamentum은 이 문맥에서 단순한 유언이 아니라 언약을 가리키므로, POB의 ‘covenant’를 따라 ‘언약’으로 옮겼습니다.
theological_decisions:
- issue: 저주적 기원문의 직접성
  chosen_reading: 본문의 세 구절을 완화하지 않고, 하나님께 드리는 기원형으로 유지했습니다.
  alternative_readings:
  - 서술형으로 순화해 ‘그들의 자손은 끊어지고…’라고 옮기는 방식
  - 의미를 약화해 ‘사라지게 될 것입니다’로 옮기는 방식
  rationale: 라틴어 원문의 명령/기원적 힘을 보존해야 하므로, 독자가 본문의 심판 선포를 직접 느끼도록 합쇼체 기원형으로 번역했습니다.
  doctrine_reference: 시편의 저주 시와 예언적 심판 언어에 대한 일반 원리
- issue: testamentum의 신학적 범위
  chosen_reading: ‘언약’으로 번역해 하나님과 백성 사이의 계약적 관계를 드러냈습니다.
  alternative_readings:
  - ‘계약’으로 옮기는 방식
  - ‘유언’으로 옮기는 방식
  rationale: 이 문맥은 성경적 covenant 어휘의 흐름과 맞닿아 있어, 한국어 성경 전통과 원문의 신학적 의미를 동시에 반영하는 ‘언약’이 적절합니다.
  doctrine_reference: 성경의 언약 신학
