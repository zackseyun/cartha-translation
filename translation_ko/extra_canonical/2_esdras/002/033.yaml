  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ut irem ad Israel; ad quos cum uenirem, reprobauerunt me et respuerunt mandatum domini. Ideoque uobis dico, gentes,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/033.yaml
  text: I[a], Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and spurned the commandment of the Lord. Therefore I say to you, O nations,
  footnotes:
  - marker: a
    text: Or 'I, Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and despised the commandment of the Lord.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 에스라입니다. 호렙 산에서 주께로부터 명령을 받아 이스라엘로 가려고 했습니다. 그러나 내가 그들에게 이르자, 그들은 나를 거절하고 주의 명령을 내던져 버렸습니다. 그러므로 나는 여러분, 민족들아, 여러분에게 말합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이전 번역은 ‘rejected me and despised the commandment’로 처리했으나, 라틴어 respuere는 내부적 멸시보다 강한 ‘거절/내침/뱉어냄’의 뉘앙스가 있어 본문에서는 ‘거절하고 주의 명령을 내던져 버렸습니다’로 옮겼습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: reprobauerunt me
  english_pob_choice: they rejected me
  chosen_korean: 그들은 나를 거절하고
  alternatives_korean:
  - 그들은 나를 배척하고
  - 그들은 나를 물리치고
  lexicon: reprobāre
  rationale: reprobare는 단순한 감정적 반감보다 실제로 받아들이지 않고 되돌려 보내는 거절의 뉘앙스가 강하므로, 표준적이고 직접적인 ‘거절하다’로 옮겼습니다.
- source_word: respuerunt mandatum domini
  english_pob_choice: they ... spurned the commandment of the Lord
  chosen_korean: 주의 명령을 내던져 버렸습니다
  alternatives_korean:
  - 주의 명령을 업신여겼습니다
  - 주의 명령을 뱉어냈습니다
  lexicon: respuere
  rationale: respuere는 문자적으로 ‘뱉어내다’에서 나온 강한 거부이므로, 단순한 ‘무시하다’나 내적 태도인 ‘멸시하다’보다 행위성을 드러내는 ‘내던져 버리다’가 원문 긴장을 더 잘 보존합니다.
- source_word: gentes
  english_pob_choice: O nations
  chosen_korean: 여러분, 민족들아
  alternatives_korean:
  - 이방 민족들아
  - 민족들이여
  lexicon: gentes
  rationale: 직접 호칭 구조를 살리되, 본문이 아직 구체적 역사 이스라엘을 넘어선 청중을 부르는 흐름이므로 ‘민족들아’로 옮기고 합쇼체 문맥에 맞게 앞에 ‘여러분’을 붙였습니다.
- source_word: mandatum domini
  english_pob_choice: the commandment of the Lord
  chosen_korean: 주의 명령
  alternatives_korean:
  - 주님의 계명
  - 주님의 명령
  lexicon: mandatum
  rationale: mandatum은 여기서 율법 조항보다 주어진 지시·명령의 성격이 강하므로, 통상적 교회어휘인 ‘계명’보다 더 직접적인 ‘명령’을 택했습니다.
theological_decisions:
- issue: 호렙 산과 주의 명령의 표기
  chosen_reading: 호렙 산에서 주께로부터 명령을 받아
  alternative_readings:
  - 호렙 산에서 주님의 명령을 받아
  - 호렙 산에서 주로부터 명령을 받아
  rationale: 원문은 시내 계시 전승을 가리키는 지점이 분명하므로 지명을 유지했고, κύριος/도미누스 계열의 신적 주어는 한국어 성경의 일반적 존칭에 맞춰 ‘주께로부터’로 자연스럽게 처리했습니다.
  doctrine_reference: 신적 계시와 호렙 전승
- issue: ‘나는 에스라입니다’의 1인칭 자기소개
  chosen_reading: 나는 에스라입니다.
  alternative_readings:
  - 저는 에스라입니다.
  - 내가 에스라입니다.
  rationale: 라틴어의 주어 강조를 살리되, 한국어 합쇼체에서 가장 자연스러운 자기소개로 처리했습니다.
  doctrine_reference: 문체/화자 표지
