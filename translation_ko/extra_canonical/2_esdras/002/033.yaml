- from: 나는 에스라입니다. 호렙 산에서 주께로부터 명령을 받아 이스라엘로 가려고 했습니다. 그러나 내가 그들에게 이르자, 그들은 나를 거절하고 주의 명령을 내던져 버렸습니다. 그러므로 나는 여러분, 민족들아, 여러분에게 말합니다.[a]
