  rationale: 명령의 내용인 ‘이스라엘에게 가라는’을 명시하여 ut irem의 종속 관계를 보존했습니다. ‘뿌리쳤습니다’는 respuerunt의 강한 거부를 현대 표준어로 자연스럽게 전달하며, 마지막 직접 호칭은 중복 없이 정리했습니다. 원문이 다음 절로 이어지는 미완의 발화이므로 끝의 콜론을 유지했습니다.
