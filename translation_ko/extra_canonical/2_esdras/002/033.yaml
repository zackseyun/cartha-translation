  source_fidelity: ‘ut irem ad Israel’은 에스라가 이스라엘에게 가도록 주어진 명령의 내용을 나타냅니다. 초안의 ‘이스라엘로 가려고 했습니다’는 화자 자신의 의도나 계획으로 바꾸므로 수정이 필요합니다. 또한 ‘respuerunt’의 강한 적극적 거부는 ‘뿌리쳤습니다’로 자연스럽게 보존할 수 있습니다.
  naturalness: 초안 마지막의 ‘여러분, 민족들아, 여러분에게 말합니다’는 호칭과 대명사가 중복되어 부자연스럽습니다. ‘그러므로 여러 민족들아, 내가 너희에게 말합니다’가 직접 호칭과 합쇼체 서술을 자연스럽게 살립니다.
  terminology: ‘호렙 산’, ‘주’, ‘이스라엘’, ‘명령’은 적절합니다. ‘나 에스라는’은 라틴어의 동격적 1인칭 자기지시를 한국어에서 자연스럽게 재현합니다.
