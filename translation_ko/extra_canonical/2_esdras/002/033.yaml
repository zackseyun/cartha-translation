    rationale: ‘여러분, 민족들아, 여러분에게’는 불필요하게 중복됩니다. gentes의 호격을 ‘여러 민족들아’로 옮기고 2인칭 대명사는 한 번만 쓰는 편이 자연스럽습니다.
