  text: I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,
translation:
  language: ko
  text: 내가 너에게 도움을 보내리니, 나의 종들 이사야와 예레미야입니다. 그들의 조언으로 나는 너를 위하여 여러 가지 열매가 달린 열두 그루의 나무를 거룩하게 하고 마련하였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 adiutorium은 여기서 ‘도움’이지만, 문맥상 하나님이 보내시는 구체적 선물의 서문처럼 기능합니다.
    reason: source_note
lexical_decisions:
- source_word: Mittam tibi adiutorium
  english_pob_choice: I will send you help
  chosen_korean: 내가 너에게 도움을 보내리니
  alternatives_korean:
  - 내가 너에게 도움을 보내겠습니다
  - 내가 너를 돕는 도움을 보내리니
  lexicon: mittam → 보내다; adiutorium → 도움
  rationale: 라틴어 동사와 명사를 분리해 살리면서도, POB의 미래·선언적 어조를 자연스러운 합쇼체로 옮겼습니다.
- source_word: pueros meos Isaiam et Hieremiam
  english_pob_choice: my servants Isaiah and Jeremiah
  chosen_korean: 나의 종들 이사야와 예레미야입니다
  alternatives_korean:
  - 나의 종 이사야와 예레미야입니다
  - 내 종들 이사야와 예레미야를
  lexicon: pueri → 종; meos → 나의
  rationale: pueros는 단순한 ‘소년들’보다 종/종들에 가깝고, English POB의 ‘servants’를 따라 신분적 종속을 드러내기 위해 ‘종들’로 옮겼습니다.
- source_word: ad quorum consilium sanctificaui et paraui tibi
  english_pob_choice: By their counsel I have sanctified and prepared for you
  chosen_korean: 그들의 조언으로 나는 너를 위하여 … 거룩하게 하고 마련하였습니다
  alternatives_korean:
  - 그들의 조언을 따라 나는 … 성별하고 준비하였습니다
  - 그들의 계획으로 나는 … 거룩하게 하고 예비하였습니다
  lexicon: consilium → 조언; sanctificaui → 거룩하게 하다; paraui → 마련하다
  rationale: consilium은 ‘계획’보다 ‘조언’이 문맥에 더 직접적이며, sanctificaui는 종교적 함의를 살려 ‘거룩하게 하다’로, paraui는 POB의 ‘prepared’에 맞춰 ‘마련하다’로 옮겼습니다.
- source_word: arbores xii grauatās uariis
  english_pob_choice: twelve trees laden with various fruits
  chosen_korean: 여러 가지 열매가 달린 열두 그루의 나무
  alternatives_korean:
  - 다양한 열매가 맺힌 열두 그루의 나무
  - 온갖 열매를 실은 열두 그루의 나무
  lexicon: arbores → 나무들; xii → 열두; grauatās → 무겁게 실린/달린; uariis → 여러 가지의
  rationale: grauatās의 ‘무겁게 실린’ 이미지를 한국어에서는 자연스러운 결실 표현인 ‘열매가 달린’으로 풀고, uariis는 ‘여러 가지’로 옮겨 다양성을 유지했습니다.
theological_decisions:
- issue: 거룩하게 함(sanctificaui)의 의미
  chosen_reading: 하나님이 예언자들을 통해 예비하신 선물을 단순한 물건이 아니라 거룩한 준비로 제시합니다.
  alternative_readings:
  - 단순한 '준비하였다'로 축소해 의례적·성별적 뉘앙스를 약화시키는 읽기
  - '''성별하였다''로만 처리해 한국어에서 다소 교회적 용어로 굳어지는 읽기'
  rationale: 본문은 열두 그루의 나무를 예언자들의 조언과 연결된 신성한 예비로 묘사하므로, 의미를 약화하지 않으면서도 현대 한국어에서 과도하게 교회화되지 않는 '거룩하게 하다'를 택했습니다.
  doctrine_reference: 성별/거룩하게 함의 성서적 어휘
- issue: Isaiah and Jeremiah의 종으로서의 지위
  chosen_reading: 예언자 이사야와 예레미야를 하나님의 ‘종들’로 제시해, 라틴어 pueros와 POB의 servant를 직접 반영합니다.
  alternative_readings:
  - 단순히 이름만 제시해 종속 관계를 흐리는 읽기
  - '''일꾼''으로 완화해 예언자 직분의 종-주 관계를 약화시키는 읽기'
  rationale: 본문은 두 예언자의 권위가 ‘나의 종들’이라는 표현으로 규정되므로, 한국어에서도 그 신분적·신학적 관계를 보존했습니다.
  doctrine_reference: 예언자/종의 관계
