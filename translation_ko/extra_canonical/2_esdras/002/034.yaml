  source_fidelity: 핵심 어휘인 ‘이방인들’, ‘목자’, ‘영원한 안식’, ‘나라의 상급’은 라틴어와 문맥에 대체로 충실합니다. 다만 in proximo est ille는 ‘그가 가까이 오셨다’가 아니라 ‘그분이 가까이 계시다’라는 현재 상태를 뜻합니다. 또한 영어 POB 감사본에 있는 ‘I say to you’에 해당하는 말이 현 번역에서는 빠져 있습니다.
  naturalness: 합쇼체와 전반적 문장은 자연스럽습니다. 그러나 ‘그가 가까이 오셨기 때문입니다’는 완료된 접근을 뜻하여 원문의 현재적 임박성을 바꾸며, 대시 뒤의 동격 관계도 다소 불명확합니다. ‘세상 끝에 오실 그분이 가까이 계시기 때문입니다’가 더 자연스럽고 정확합니다.
  terminology: ‘이방인들’은 앞 절의 이스라엘과 대조되는 gentes의 문맥적 의미를 보존합니다. ‘영원한 안식’과 ‘목자’도 적절합니다. regni는 현대 한국어에서 ‘나라’로 번역 가능하며, ‘나라의 상급’은 문맥상 왕국의 상을 가리키는 표현으로 유지할 수 있습니다.
