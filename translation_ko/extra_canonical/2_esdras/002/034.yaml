id: 2ES.2.34
reference: 2 Esdras 2:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/034.yaml
  text: 'Therefore I say to you[a], Gentiles who hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age. Be ready for the rewards of the kingdom,'
  footnotes:
  - marker: a
    text: Or 'nations that hear and understand'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 듣고 이해하는 이방인들아[a], 너희의 목자를 기다리십시오. 그는 너희에게 영원한 안식을 주실 것입니다. 그가 가까이 오셨기 때문입니다—세상 끝에 오실 그분입니다. 나라의 상급을 받을 준비를 하십시오,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘듣고 이해하는 민족들’.
    reason: previous_rendering
lexical_decisions:
- source_word: gentes / Gentiles
  english_pob_choice: Gentiles who hear and understand
  chosen_korean: 이방인들
  alternatives_korean:
  - 민족들
  - 나라들
  lexicon: gentes
  rationale: 문맥상 바로 앞 절의 이스라엘과 대조되는 집단이므로, 단순한 ‘민족들’보다 종교적·구원사적 대조를 드러내는 ‘이방인들’이 더 정확합니다.
- source_word: pastorem uestrum
  english_pob_choice: your shepherd
  chosen_korean: 너희의 목자
  alternatives_korean:
  - 너희 목자
  - 너희의 양치기
  lexicon: pastor
  rationale: pastor의 기본 이미지는 목자이며, 한국어 성경 관용과 직결되므로 ‘목자’를 택했습니다.
- source_word: requiem aeternitatis
  english_pob_choice: eternal rest
  chosen_korean: 영원한 안식
  alternatives_korean:
  - 영원한 쉼
  - 영속의 휴식
  lexicon: requies
  rationale: aeternitatis가 수식하는 requiem은 단순 휴식보다 종말론적·영속적 안식을 뜻하므로 ‘영원한 안식’이 가장 자연스럽습니다.
- source_word: praemia regni
  english_pob_choice: rewards of the kingdom
  chosen_korean: 나라의 상급
  alternatives_korean:
  - 하나님의 나라의 상급
  - 왕국의 보상
  lexicon: praemia
  rationale: praemia는 ‘보상/상급’의 의미가 분명하므로 이를 살리고, regni는 문맥상 왕권적 ‘나라’로 옮겨 과도하게 교회적 표현으로 바꾸지 않았습니다.
theological_decisions:
- issue: 지칭 대상의 번역
  chosen_reading: ‘Gentiles’는 ‘이방인들’로 옮겨 이스라엘과의 대조를 분명히 했습니다.
  alternative_readings:
  - ‘민족들’로 완화해 번역
  - ‘나라들’로 직역
  rationale: 이 구절은 단순 일반 민족이 아니라 구원사적 경계선 바깥의 이방인을 가리키는 대조가 핵심이므로, 그 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 2 Esdras 2:33-34 문맥상의 이스라엘-이방인 대조
- issue: ‘세상 끝’과 ‘나라의 상급’의 종말론적 톤
  chosen_reading: ‘세상 끝에 오실 그분’과 ‘나라의 상급’을 유지해 종말론적 기대를 분명히 했습니다.
  alternative_readings:
  - ‘시대의 끝’으로 순화
  - ‘왕국의 보상’으로 직역
  rationale: 라틴어 in finem saeculi와 praemia regni는 단순 시간표현이 아니라 종말과 왕국 상급을 함께 부각하므로, 이를 약화하지 않는 표현이 필요합니다.
  doctrine_reference: 종말론적 재림/상급 모티프
