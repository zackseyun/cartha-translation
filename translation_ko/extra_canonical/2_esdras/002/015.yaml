  to: 어머니여, 당신의 자녀들을 품으십시오. 비둘기처럼 기쁨으로 그들을 기르십시오. 그들의 발을 굳게 하십시오. 내가 당신을 택하였기 때문입니다. 주님께서 말씀하십니다.
