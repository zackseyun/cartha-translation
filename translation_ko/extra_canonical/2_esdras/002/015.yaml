  source_fidelity: 라틴어의 명령 네 개와 선택의 근거를 전반적으로 충실히 옮겼습니다. 다만 원문의 직접 خطاب인 단수 te와 한국어 합쇼체의 대우 표현을 일관되게 처리할 필요가 있으며, sicut columba는 ‘비둘기처럼’으로 유지하되 문장 안에서 자연스럽게 배치하는 편이 좋습니다.
