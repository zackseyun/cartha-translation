  terminology: ‘품다’, ‘기르다’, ‘발을 굳게 하다’, ‘택하다’는 모두 원문의 의미와 성경적 문맥에 적절합니다. 발화 주체는 ‘주님’으로 통일하고, 수신자는 ‘당신’으로 처리하여 합쇼체의 존대 체계를 유지합니다.
