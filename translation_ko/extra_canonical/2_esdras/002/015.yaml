  yaml_path: translation/extra_canonical/2_esdras/002/015.yaml
  text: Mother, embrace your children; bring them up with gladness like a dove; strengthen their feet, for I have chosen you, says the Lord.
translation:
  language: ko
  text: 어머니여, 네 자녀들을 품으십시오. 비둘기처럼 기쁨으로 그들을 기르며 그들의 발을 굳게 하십시오. 이는 내가 너를 택하였기 때문이니라, 주께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직유처럼(sicut)이라는 비교를 명시적으로 살린 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: Mater
  english_pob_choice: Mother
  chosen_korean: 어머니여
  alternatives_korean:
  - 어머니
  lexicon: 직접 호격
  rationale: 라틴어 호격 Mater를 한국어 호격으로 살려, 단순 서술이 아니라 직접 부르는 خطاب임을 분명히 했습니다.
- source_word: complectere filios tuos
  english_pob_choice: embrace your children
  chosen_korean: 네 자녀들을 품으십시오
  alternatives_korean:
  - 네 자녀들을 안으십시오
  - 네 자녀들을 끌어안으십시오
  lexicon: 품다
  rationale: embrace의 포용적·애정적 동작을 자연스럽게 살리면서도 한국어 명령형으로 직접성을 유지했습니다.
- source_word: educa illos cum laetitia
  english_pob_choice: bring them up with gladness
  chosen_korean: 기쁨으로 그들을 기르며
  alternatives_korean:
  - 즐거움으로 그들을 키우며
  - 기쁜 마음으로 그들을 양육하며
  lexicon: 기르다
  rationale: educa를 단순한 ‘데려가다’가 아니라 양육·양육하다의 의미로 보고, laetitia를 ‘기쁨으로’로 간명하게 옮겼습니다.
- source_word: sicut columba
  english_pob_choice: like a dove
  chosen_korean: 비둘기처럼
  alternatives_korean:
  - 비둘기같이
  - 비둘기와 같이
  lexicon: 비유 표현
  rationale: 직유를 직설적으로 유지해, 비둘기의 온유하고 부드러운 이미지를 훼손하지 않도록 했습니다.
- source_word: confirma pedes eorum
  english_pob_choice: strengthen their feet
  chosen_korean: 그들의 발을 굳게 하십시오
  alternatives_korean:
  - 그들의 발을 강하게 하십시오
  - 그들의 발걸음을 견고하게 하십시오
  lexicon: 굳게 하다
  rationale: pedes를 문자 그대로 ‘발’로 두되, 히브리식/성경적 관용에 맞게 삶의 걸음을 안정시키는 뜻까지 드러나도록 했습니다.
- source_word: quoniam te elegi
  english_pob_choice: for I have chosen you
  chosen_korean: 이는 내가 너를 택하였기 때문이니라
  alternatives_korean:
  - 내가 너를 택하였으므로
  - 내가 너를 선택하였기 때문이니라
  lexicon: 택하다
  rationale: elegi를 신학적으로도 자연스러운 ‘택하다’로 옮겨 선택의 주체가 하나님임을 분명히 했습니다.
theological_decisions:
- issue: 주님의 직접 발화에서의 종결 어조
  chosen_reading: 본문 전체는 명령과 선언이 섞인 신적 발화로 보고, 서술부는 합쇼체를 유지하되 마지막 인용 종결은 경전 문체를 살려 ‘말씀하십니다’로 마무리했습니다.
  alternative_readings:
  - ‘말씀하십니다’ 대신 ‘말합니다’
  - 전 구절을 평서형으로 통일
  rationale: 주님의 발화라는 문맥을 드러내면서도 현대 표준어 합쇼체의 가독성을 유지하기 위한 선택입니다.
  doctrine_reference: direct speech register
- issue: ‘나는 너를 택하였다’의 언약적 뉘앙스
  chosen_reading: ‘택하다’로 옮겨 단순 선호가 아니라 선택·분리의 신학적 무게를 보존했습니다.
  alternative_readings:
  - ‘선택하다’
  - ‘뽑다’
  rationale: 라틴어 elegi와 영어 POB의 chose가 갖는 언약적·주권적 의미를 한국어 성경 문체에서 가장 안정적으로 드러내는 표현입니다.
  doctrine_reference: divine election
