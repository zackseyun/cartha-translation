translation:
  language: ko
  text: 하늘과 땅을 증인으로 불러라, 불러라. 이는 내가 악을 버리고 선을 창조하였기 때문이다. 내가 살아 있기 때문이다. 주께서 말씀하십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면, ‘하늘과 땅을 불러 증언하게 하라’이다.
    reason: testare, testare caelum et terram의 반복된 명령과 증인 소환의 뉘앙스를 보조합니다.
lexical_decisions:
- source_word: Testare, testare
  english_pob_choice: Bear witness, bear witness
  chosen_korean: 증언하라, 증언하라
  alternatives_korean:
  - 증인되라, 증인되라
  - 하늘과 땅을 증언하도록 부르라
  lexicon: testare
  rationale: 반복된 명령형을 그대로 살려, 단일 명령으로 평평하게 만들지 않고 긴급성과 수사적 압박을 드러냈습니다.
