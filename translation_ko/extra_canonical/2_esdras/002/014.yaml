  alternatives_korean:
  - 하늘과 땅이여
  - 오 하늘과 땅이여
  lexicon: caelum / terra
  rationale: 호격을 한국어 자연어로 옮겨 직접 호명된 대상임을 분명히 했습니다.
- source_word: omisi enim malum et creaui bonum
  english_pob_choice: for I have put away evil and created good
  chosen_korean: 내가 악을 치워 버리고 선을 지었기 때문이다
  alternatives_korean:
  - 내가 악을 제거하고 선을 창조했기 때문이다
  - 내가 악을 없애고 선을 만들었기 때문이다
  lexicon: omittere / creare / malum / bonum
  rationale: omisi를 단순한 ‘없애다’보다 결과를 분명히 하는 ‘치워 버리다’로, creaui를 ‘창조하다’보다 문맥상 직관적인 ‘짓다’로 옮기되 창조 행위를 약화하지 않도록 했습니다.
- source_word: quia uiuo ego, dicit dominus
  english_pob_choice: because I live, says the Lord
  chosen_korean: 내가 살아 있기 때문이다 — 주께서 말씀하십니다
  alternatives_korean:
  - 내가 살아 있기 때문이다 — 주님이 말씀하십니다
  - 내가 살아 있기 때문이다 — 주께서 선언하십니다
  lexicon: quia uiuo ego / dicit dominus
  rationale: 직역 구조를 유지하면서, 본문 끝의 신탁 공식은 합쇼체로 자연스럽게 정리했습니다.
theological_decisions:
- issue: 하늘과 땅을 호출하는 명령의 형식
  chosen_reading: 증언하라, 증언하라로 옮겨, 하늘과 땅이 소환된 증인 역할을 하도록 했습니다.
  alternative_readings:
  - 하늘과 땅을 증인으로 부르라
  - 하늘과 땅이 증언하게 하라
  rationale: 라틴어 testare는 단순한 말하기가 아니라 증인 소환의 뉘앙스를 가지므로, 법정적·선언적 힘을 보존했습니다.
  doctrine_reference: 신 30:19; 사 1:2의 하늘과 땅 소환 전통
