id: 2ES.2.4
reference: 2 Esdras 2:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/002/004.yaml
  text: because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask the Lord.
translation:
  language: ko
  text: 이는 여러분이 주 하나님 앞에서 죄를 지었고 내 앞에서 악한 일을 행했기 때문입니다. 이제 내가 여러분을 위해 무엇을 하겠습니까? 나는 과부이고 버림받은 몸입니다. 자녀들이여, 가서 주께 구하십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: coram domino deo
  english_pob_choice: before the Lord God
  chosen_korean: 주 앞에서
  alternatives_korean:
  - 주 하나님 앞에서
  - 야훼 하나님 앞에서
  lexicon: coram + domino deo
  rationale: 라틴어 coram는 단순한 위치가 아니라 ‘면전에서/앞에서’의 관계를 나타내므로, 한국어도 직접적이고 간결한 ‘주 앞에서’로 옮겼습니다.
- source_word: peccastis
  english_pob_choice: you sinned
  chosen_korean: 죄를 지었고
  alternatives_korean:
  - 범죄했고
  - 죄를 범했고
  lexicon: pecco
  rationale: 행위의 결과를 자연스럽게 드러내는 현대 표준어 표현으로 ‘죄를 지었습니다’ 계열을 택했고, 문맥상 다음 절과 병렬을 이루도록 연결형으로 처리했습니다.
- source_word: quod malum est coram me fecistis
  english_pob_choice: did what is evil before me
  chosen_korean: 내 앞에서 악한 일을 행했기 때문입니다
  alternatives_korean:
  - 내 앞에서 악을 행했기 때문입니다
  - 나 보기에 악한 일을 했기 때문입니다
  lexicon: malum / facere
  rationale: malum은 단순히 ‘나쁜 것’보다 도덕적 악을 가리키므로 ‘악한 일’로 옮기고, fecistis는 구체적 행동을 살려 ‘행했습니다’로 표현했습니다.
- source_word: uidua sum et derelicta
  english_pob_choice: I am a widow and forsaken
  chosen_korean: 나는 과부이며 버림받았습니다
  alternatives_korean:
  - 나는 과부이며 홀로 남았습니다
  - 나는 과부이며 버려졌습니다
  lexicon: vidua / derelicta
  rationale: vidua는 사회적·법적 상태를 지칭하는 ‘과부’가 적절하며, derelicta는 버려져 보호를 잃은 상태를 나타내므로 ‘버림받았습니다’가 원문 긴장을 가장 분명히 드러냅니다.
- source_word: ite, filii, et petite a domino
  english_pob_choice: Go, my children, and ask the Lord
  chosen_korean: 가거라, 내 자녀들아, 그리고 주께 구하십시오
  alternatives_korean:
  - 가거라, 내 자녀들아, 그리고 주께 청하십시오
  - 가거라, 내 자녀들아, 그리고 주께 요청하십시오
  lexicon: ite / filii / petere
  rationale: ite와 filii는 직접 호명하는 명령형이므로 ‘가거라, 내 자녀들아’로 살렸고, petite는 본문 수정 이력에 따라 ‘mercy’ 없이 단순히 ‘주께 구하다’로 옮겼습니다.
theological_decisions:
- issue: ‘주’가 야훼를 가리키는지에 대한 처리
  chosen_reading: 본문의 라틴어 dominos/ dominos 없음에 따라 일단 ‘주’로 유지했습니다.
  alternative_readings:
  - 야훼
  - 주 하나님
  rationale: 제공된 소스는 라틴어 도미누스만 제시하며, 여기서는 직접적인 LXX/구약 인용 표지나 본문 내 יהוה 대응 정보가 없으므로 한국어 본문에서는 과도한 특정화 없이 ‘주’로 유지하는 편이 source-grounded합니다.
  doctrine_reference: '번역 원칙: 문맥적 특정화는 원문/주해 근거가 있을 때만 적용'
- issue: 화자 정체성과 애가적 자기진술
  chosen_reading: 화자의 ‘과부이며 버림받은’ 자기진술을 그대로 유지했습니다.
  alternative_readings:
  - 비유적 표현으로 완화
  - ‘홀로 남겨진 과부’로 의역
  rationale: 원문은 공동체를 향한 호소이자 애가적 자기표현이므로, 정서적 긴장과 수사적 직접성을 약화시키지 않도록 직역에 가깝게 유지했습니다.
  doctrine_reference: 문학적 진술 보존 원칙
