  chosen_reading: 본문은 전승된 숫자 형식을 그대로 반영하고, 의미상의 널리 알려진 ‘아흔네 권’ 해석은 각주로만 제시합니다.
  alternative_readings:
  - 본문을 곧바로 아흔네 권으로 평탄화하는 읽기
  - 전승 문자형을 따라 숫자 표기 자체를 불확정으로 두는 읽기
  rationale: 영문 POB가 텍스트적 난점을 명시한 만큼, 본문은 너무 매끈하게 정리하지 않고 전승상의 긴장을 유지하는 편이 투명합니다.
  doctrine_reference: textual criticism / source transparency
