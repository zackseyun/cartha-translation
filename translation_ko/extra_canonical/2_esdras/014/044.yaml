translation:
  language: ko
  text: 나는 침묵하고 있었습니다. 사십 일 동안 아흔네 권의 책이 기록되었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 라틴어 본문의 숫자 표기는 난해합니다. 이 장의 널리 인정되는 의미는 아흔네 권의 책이며, 이는 공개할 책들과 지혜로운 이들을 위해 보존할 마지막 칠십 권의 구분에도 들어맞습니다.
    reason: textual_variant
