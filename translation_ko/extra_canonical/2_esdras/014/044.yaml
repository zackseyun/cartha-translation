  lexicon: Latin XL dies
  rationale: 기간 표현은 성경체에서 ‘사십 일 동안’이 가장 직접적이고, 원문의 숫자 강조도 유지합니다.
- source_word: DCCCClIIII
  english_pob_choice: ninety-four books
  chosen_korean: 책들 아흔다섯 권
  alternatives_korean:
  - 책들 아흔네 권
  - 아흔다섯 책
  lexicon: Latin numeral as transmitted
  rationale: 본문의 전승 수치가 난해하다는 영어 주를 따라 본문에는 널리 알려진 의미가 아니라 전승된 숫자 형식의 난점을 반영했습니다. 다만 여기서는 학계·역주 대비를 위해 전승형 숫자 자체를 살려 두고, 본문 의미와의 차이는 각주로 처리합니다.
theological_decisions:
