translation:
  language: ko
  text: 나는 침묵하고 있었습니다. 그러자 사십 일 동안 책들 아흔다섯 권이 기록되었습니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 본문의 숫자는 전승상 난해합니다. 이 장의 널리 알려진 뜻은 아흔네 권의 책이며, 이는 공적 문서와 지혜로운 이들을 위한 마지막 칠십 권의 구분과도 맞아떨어집니다.
    reason: textual_variant
lexical_decisions:
- source_word: tacebam
