revisions:
- from: 그 안에 사는 자들 위에 말입니다. 진리는 더 멀리 물러가고, 거짓은 더 가까이 다가올 것입니다. 이미, 당신이 환상에서 보신 그 독수리가 오려고 서두르고 있기 때문입니다.”[a][b]
  to: 그 안에 사는 이들에게 재앙이 닥칠 것입니다. 진리는 더욱 멀리 물러가고, 거짓은 가까이 다가올 것입니다. 이미 네가 환상에서 본 그 독수리가 오려고 서두르고 있기 때문입니다.”
