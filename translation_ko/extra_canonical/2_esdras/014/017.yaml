id: 2ES.14.17
reference: 2 Esdras 14:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super inhabitantes in eo mala. Prolongabit enim magis ueritas, et adpropinquabit mendacium. iam enim festinat aquila uenire quam uidisti in uisionem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/017.yaml
  text: upon those who dwell in it. For truth will withdraw farther away, and falsehood will draw near. For already the eagle that you saw in the vision is hastening to come.”
translation:
  language: ko
  text: 그 안에 사는 자들 위에 말입니다. 진리는 더 멀리 물러가고, 거짓은 더 가까이 다가올 것입니다. 이미, 당신이 환상에서 보신 그 독수리가 오려고 서두르고 있기 때문입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 super의 공간적 감각을 살린 직역입니다.
    reason: lexical_alternative
  - marker: b
    text: uisionem은 계시적 ‘환상’을 가리키는 말로 읽었습니다.
    reason: source_note
lexical_decisions:
- source_word: super inhabitantes in eo mala
  english_pob_choice: upon those who dwell in it
  chosen_korean: 그 안에 사는 자들 위에 말입니다
  alternatives_korean:
  - 그곳에 사는 사람들에게
  - 그 안에 거주하는 자들에게
  lexicon: super + inhabitantes
  rationale: 라틴어 전치사 super의 ‘~위에’라는 감각을 살리면서, 대상이 되는 거주민을 자연스럽게 옮겼습니다. 문맥상 앞절과 이어지는 대상 설명이므로 짧게 연결했습니다.
- source_word: Prolongabit enim magis ueritas
  english_pob_choice: For truth will withdraw farther away
  chosen_korean: 진리는 더 멀리 물러가고
  alternatives_korean:
  - 진리는 더 멀어지고
  - 진리는 더욱 뒤로 물러나고
  lexicon: veritas
  rationale: ueritas를 단순히 ‘진실’보다 더 공적이고 문맥에 맞는 ‘진리’로 옮겼고, POB의 ‘withdraw farther away’가 가진 거리감과 후퇴의 이미지를 ‘더 멀리 물러가고’로 반영했습니다.
- source_word: adpropinquabit mendacium
  english_pob_choice: and falsehood will draw near
  chosen_korean: 거짓은 더 가까이 다가올 것입니다
  alternatives_korean:
  - 거짓은 가까워질 것입니다
  - 거짓은 다가올 것입니다
  lexicon: mendacium
  rationale: mendacium을 ‘거짓’으로 옮겨 사실과 대비되는 상태를 분명히 했고, adpropinquabit의 근접 이미지를 ‘더 가까이 다가올 것입니다’로 살렸습니다.
- source_word: aquila uenire quam uidisti in uisionem
  english_pob_choice: the eagle that you saw in the vision is hastening to come
  chosen_korean: 당신이 환상에서 보신 그 독수리가 오려고 서두르고 있기 때문입니다
  alternatives_korean:
  - 당신이 환상 중에 보신 그 독수리가 급히 오고 있기 때문입니다
  - 보신 환상 속의 그 독수리가 속히 오려 하고 있기 때문입니다
  lexicon: aquila / uisio
  rationale: aquila는 앞선 문맥의 상징적 인물로서 ‘독수리’를 유지했고, uisio는 ‘환상’으로 옮겨 본문이 말하는 계시적 시야를 드러냈습니다. uenire quam의 진행성을 ‘오려고 서두르고’로 풀어 자연스러운 합쇼체 문장으로 만들었습니다.
theological_decisions:
- issue: 진리와 거짓의 대비를 어떤 어조로 살릴지
  chosen_reading: 진리는 더 멀리 물러가고, 거짓은 더 가까이 다가올 것입니다
  alternative_readings:
  - 진실은 더 멀어지고, 거짓은 가까워질 것입니다
  - 진리는 멀어지고 거짓은 가까워질 것입니다
  rationale: 본문의 병렬 대비를 약화시키지 않기 위해 추상적 대조를 선명하게 유지했습니다. ‘진리/거짓’은 단순 정보의 차이보다 종말론적·도덕적 대립을 더 잘 드러냅니다.
  doctrine_reference: 예언적 대조 표현
- issue: 독수리의 상징을 설명할지 여부
  chosen_reading: 환상에서 보신 그 독수리
  alternative_readings:
  - 그 환상 속의 독수리
  - 보신 환상의 독수리
  rationale: 본문은 상징을 해설하지 않고 지칭만 하므로, 상징적 독수리를 그대로 보존해 독자가 앞뒤 문맥과 연결하도록 했습니다.
  doctrine_reference: 상징 해석은 문맥 보존 우선
