  to: 그분께서는 재판장이시므로, 정해진 때에 너희에게 주셨던 것을 너희에게서 거두어 가셨습니다. 그리고
  rationale: ‘너희에게서’를 보완하여 abstulit a vobis를 명시하고, donaverat의 선행 수여는 ‘너희에게 주셨던 것’으로 유지했습니다. 마지막 ‘그리고’는 원문의 미완결 접속사 Et를 보존합니다. 이전 절 이동 오류에 관한 영어 감사용 각주는 번역 각주로 옮기지 않았습니다.
  reviewer_model: gpt-5.6-terra
