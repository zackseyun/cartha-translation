translation:
  language: ko
  text: 그분께서는 재판장이시므로, 정해진 때에 너희에게 주셨던 것을 너희에게서 거두어 가셨습니다. 그리고
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iudex
  english_pob_choice: judge
  chosen_korean: 재판장
  alternatives_korean:
  - 판관
  - 심판자
  lexicon: iudex
  rationale: Latin iudex의 기본 의미는 ‘판단하는 자/재판하는 자’이므로, 문맥상 하나님을 가리키는 존칭이면서도 직무를 분명히 드러내는 ‘재판장’이 적절합니다.
- source_word: cum sit
  english_pob_choice: since he is
  chosen_korean: —이시므로
  alternatives_korean:
  - —이시니
  - —이기 때문에
  lexicon: cum + sit
  rationale: 원인·이유를 나타내는 절로 읽어 ‘…이시므로’로 자연스럽게 옮겼습니다.
- source_word: abstulit a uobis
  english_pob_choice: he took away from you
  chosen_korean: 너희에게서 거두어 가셨습니다
  alternatives_korean:
  - 너희에게서 빼앗아 가셨습니다
  - 너희로부터 가져가셨습니다
  lexicon: abstulit a vobis
  rationale: 단순한 이동보다 ‘주셨던 것을 다시 거두어 가심’의 뉘앙스를 살리기 위해 ‘거두어 가셨습니다’를 택했습니다.
- source_word: in tempore quod donauerat
  english_pob_choice: in due time what he had given
  chosen_korean: 정해진 때에 그가 주신 것을
  alternatives_korean:
  - 때가 되었을 때 그가 주신 것을
  - 적절한 때에 그가 주신 것을
  lexicon: in tempore quod donauerat
  rationale: donauerat는 ‘주셨던 것’의 과거완료이며, in tempore는 시점의 정당성을 강조하므로 ‘정해진 때에’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 행위가 ‘빼앗음’이 아니라 ‘거두어 가심’으로 서술되는 점
  chosen_reading: 하나님은 재판장으로서 정당한 시점에 주신 것을 다시 거두어 가시는 분으로 표현했습니다.
  alternative_readings:
  - 너희에게서 빼앗아 가셨습니다
  - 너희에게서 가져가셨습니다
  rationale: 본문은 신적 주권과 심판의 정당성을 함께 드러내므로, 강도성만 부각하는 번역보다 주신 분이 거두어 가시는 서술을 유지하는 것이 더 정확합니다.
  doctrine_reference: 신적 주권과 심판
- issue: 마지막 접속사 Et의 처리
  chosen_reading: 문장 끝의 ‘그리고’를 유지해 다음 말이 이어짐을 드러냈습니다.
  alternative_readings:
  - 문장을 마침표로 종결
  rationale: 본문이 다음 절로 이어지는 접속을 보존해야 하므로, 영어 POB의 보정처럼 끝의 Et를 반영했습니다.
  doctrine_reference: 문맥 연속성
