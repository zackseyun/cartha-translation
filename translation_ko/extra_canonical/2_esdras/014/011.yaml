id: 2ES.14.11
reference: 2 Esdras 14:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: XII enim partibus diuisum est saeculum, et transierunt eius X iam et dimidium xmae partis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/011.yaml
  text: For the age has been divided into twelve parts[a], and ten of its parts have already passed, and half of the tenth part.
  footnotes:
  - marker: a
    text: Or 'ten parts of it have already passed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 시대는 열두 몫으로 나뉘었고, 그 몫들 가운데 열 몫은 이미 지나갔으며, 열째 몫의 절반이 남아 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: X iam / ten of its parts have already passed
  english_pob_choice: ten of its parts have already passed
  chosen_korean: 그 몫들 가운데 열 몫은 이미 지나갔으며
  alternatives_korean:
  - 그의 부분들 가운데 열 부분은 이미 지나갔으며
  - 그 몫들 중 열 몫이 이미 지나갔으며
  lexicon: 몫
  rationale: saeculum의 시간을 부분으로 나눈 이미지는 ‘몫’이 한국어에서 가장 자연스럽게 살리고, X iam을 POB 수정안에 따라 ‘열 몫’으로 반영했습니다.
- source_word: Xmae partis / half of the tenth part
  english_pob_choice: half of the tenth part
  chosen_korean: 열째 몫의 절반이 남아 있습니다
  alternatives_korean:
  - 열째 부분의 절반이 남아 있습니다
  - 열 번째 몫의 반이 남아 있습니다
  lexicon: 몫
  rationale: 분할된 시간 단위를 앞 문장과 일관되게 ‘몫’으로 유지하고, 남은 분량을 ‘절반’으로 풀어 현대 한국어에서 분명하게 표현했습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 그 시대는
  alternatives_korean:
  - 그 세상은
  - 그 시대는
  lexicon: 시대
  rationale: saeculum은 단순한 ‘세상’보다 시간적 구획인 ‘시대’가 더 직접적이어서, 문맥의 종말론적 시간표를 분명히 드러냅니다.
- source_word: diuisum est ... in XII partes
  english_pob_choice: has been divided into twelve parts
  chosen_korean: 열두 몫으로 나뉘었고
  alternatives_korean:
  - 열두 부분으로 나뉘었고
  - 열두 몫으로 나뉘어
  lexicon: 나뉘다
  rationale: 수동 분할을 간결하게 살리면서, 계산 가능한 시간의 ‘부분들’을 한국어로 자연스럽게 전달하기 위해 ‘나뉘다’를 택했습니다.
theological_decisions:
- issue: 본문의 수치 읽기(X = 열 몫)와 시간표 의미
  chosen_reading: 라틴 본문과 최신 교정에 따라 ‘열 몫’으로 옮기되, 앞선 오독 가능성은 반영하지 않습니다.
  alternative_readings:
  - ‘아홉 몫’으로 교정하는 해석
  - 라틴 사본의 문자 그대로 ‘열 몫’
  rationale: 제공된 최신 revision pass가 라틴 X를 따르도록 교정했으므로, 한국어 본문도 그 교정 읽기를 따르는 것이 audit trail에 충실합니다.
  doctrine_reference: 본문비평 / 사본 전승
