  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/038.yaml
  text: and behold[a], a voice called me, saying, “Ezra, open your mouth and drink what I am giving you.” And I opened my mouth, and behold, a full cup
  footnotes:
  - marker: a
    text: Or 'And it happened on the next day, and behold, a voice called me, saying, “Ezra, open your mouth and drink what I give you to drink.” And I opened my mouth, and behold, a full cup was held out to me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 보십시오, 한 음성이 저를 불러 말했습니다. 「에스라야, 네 입을 열어 내가 네게 주는 것을 마시라.」 내가 입을 열었더니, 보십시오, 가득 찬 잔이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘보십시오, 다음 날 한 음성이 저를 불러 말했습니다. “에스라야, 네 입을 열어 내가 네게 마시게 주는 것을 마시라.” 내가 입을 열었더니, 보십시오, 한 가득 찬 잔이 저에게 내밀어졌습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: uox uocauit me
  english_pob_choice: a voice called me
  chosen_korean: 한 음성이 저를 불렀습니다
  alternatives_korean:
  - 소리가 저를 불렀습니다
  - 음성이 저를 불렀습니다
  lexicon: uox/vocare
  rationale: 라틴어 uox는 단순한 ‘소리’보다 말하는 주체성을 띤 ‘음성’이 자연스럽고, vocauit me는 직접 부름으로 옮기는 것이 source를 가장 잘 드러냅니다.
- source_word: aperi os tuum et bibe quod te potiono
  english_pob_choice: Ezra, open your mouth and drink what I am giving you.
  chosen_korean: 에스라야, 네 입을 열어 내가 네게 주는 것을 마시라
  alternatives_korean:
  - 에스라야, 네 입을 열고 내가 네게 주는 것을 마셔라
  - 에스라야, 입을 열고 내가 주는 것을 마시라
  lexicon: aperire os / bibere / potio
  rationale: aperi os tuum은 ‘네 입을 열어’, bibe는 명령형으로 ‘마시라’가 합쇼체 본문에 자연스럽고, quod te potiono의 반복적 ‘마시게 하는 것’을 줄여 ‘내가 네게 주는 것’으로 간결하게 반영했습니다.
- source_word: et ecce
  english_pob_choice: and behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 그리고 보십시오
  lexicon: ecce
  rationale: 서사 중 삽입되는 주목 환기 표현이므로 합쇼체 서술에 맞게 ‘보십시오’로 옮겨 청자 주의를 살렸습니다.
- source_word: calix plenus
  english_pob_choice: a full cup
  chosen_korean: 가득 찬 잔
  alternatives_korean:
  - 가득한 잔
  - 찬 잔
  lexicon: calix
  rationale: calix는 보통 ‘잔/컵’ 중 문맥상 술잔·마시는 그릇의 이미지가 살아 있는 ‘잔’이 자연스럽고, plenus는 상태를 드러내는 ‘가득 찬’으로 옮겼습니다.
