revisions:
- from: 그리고 보십시오, 한 음성이 저를 불러 말했습니다. 「에스라야, 네 입을 열어 내가 네게 주는 것을 마시라.」 내가 입을 열었더니, 보십시오, 가득 찬 잔이 있었습니다.[a]
  to: 그리고 보십시오, 한 음성이 나를 불러 이렇게 말했습니다. “에스라야, 네 입을 열고 내가 네게 주는 것을 마시십시오.” 내가 입을 열었더니, 보십시오, 가득 찬 잔 하나.[a]
  rationale: 라틴어 절의 시작과 끝을 엄격히 따르도록 마지막 존재 서술을 제거하고, 명사구로 끝나는 원문의 미완결성을 보존했습니다. 서술자의 1인칭을 자연스러운 ‘나’로 정리했으며, 각주는 영어 감사 이력에 보존된 이전 번역을 유지하되 그 성격과 범위를 정확히 밝혔습니다.
