base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/019.yaml
  text: “Behold[a], I will go, as you have commanded me, and I will reprove the people now living.
  footnotes:
  - marker: a
    text: Or '“Behold, I will go, as you have commanded me, and I will reprove the people who are present.'.
