translation:
  language: ko
  text: 보십시오, 제가 가겠습니다. 당신께서 저에게 명령하신 대로, 그리고 현재 살아 있는 백성을 책망하겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘현존하는 백성’이지만, 문맥상 공간적 ‘그 자리에 있는 사람들’이 아니라 현재 세대를 가리킵니다.
    reason: alternative_reading
lexical_decisions:
- source_word: sicut praecepisti mihi
  english_pob_choice: as you have commanded me
  chosen_korean: 당신께서 저에게 명령하신 대로
  alternatives_korean:
  - 당신께서 저에게 명하신 대로
  - 당신께서 저에게 지시하신 대로
  lexicon: praecipio
  rationale: 명령하다는 원문의 지시·위임성을 직접 반영하며, 본문이 보여 주는 순응의 의미를 분명하게 드러냅니다.
- source_word: corripiam
  english_pob_choice: I will reprove
  chosen_korean: 책망하겠습니다
  alternatives_korean:
  - 꾸짖겠습니다
  - 질책하겠습니다
  lexicon: corripio
  rationale: corripiam은 단순 비난보다 잘못을 드러내고 바로잡는 성격이 있어, 한국어에서는 ‘책망하다’가 가장 균형 있게 대응합니다.
- source_word: praesentem populum
  english_pob_choice: the people now living
  chosen_korean: 현재 살아 있는 백성
  alternatives_korean:
  - 지금 있는 백성
  - 현존하는 백성
  - 현재의 백성
  lexicon: populus
  rationale: revisions가 지적하듯 praesentem은 공간적 ‘현장에 있는’보다 시간적 ‘현재의’ 뉘앙스가 핵심이므로, 다음 절의 ‘나중에 태어날 자들’과 대비되도록 ‘현재 살아 있는’으로 옮겼습니다.
- source_word: sicut
  english_pob_choice: as
  chosen_korean: —대로
  alternatives_korean:
  - 같이
  - 처럼
  lexicon: sicut
  rationale: 앞 절의 순종 구조를 한국어에서 자연스럽게 받기 위해 ‘~하신 대로’ 구문으로 처리했습니다.
theological_decisions:
- issue: praesentem populum의 시간적 의미 대 공간적 의미
  chosen_reading: ‘현재 살아 있는 백성’으로 이해해, 지금 세대에 대한 경고로 읽습니다.
  alternative_readings:
  - ‘그 자리에 있는 백성’으로 읽는 공간적 해석
  rationale: 바로 뒤의 ‘나중에 다시 태어날 자들’과의 대비가 시간적 의미를 요구하므로, 본문은 현 세대와 후대의 대조를 말하는 것으로 번역해야 합니다.
  doctrine_reference: 문맥 우선의 역사-문법적 해석
- issue: 대상 호칭의 존대 수준
  chosen_reading: 신께 직접 말하는 장면이지만, 본문 화자가 하나님께 드리는 기도문이 아니라 위임받은 발화이므로 일반 존대 형태로 처리했습니다.
  alternative_readings:
  - 기도체 고어(옵소서, 하옵나이다)
  rationale: 합쇼체 본문을 유지하되, 직접적인 기도문이 아니므로 고전적 기도체로 과도하게 격상하지 않았습니다.
  doctrine_reference: 문체와 화행 구분
