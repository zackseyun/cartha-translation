  source_fidelity: 라틴어의 대조 접속사 autem, 미래의 출생(nati fuerint), commonebit의 ‘일깨우다/깨우쳐 주다’ 의미, 그리고 positum est ... in tenebris의 상태적 표현을 전반적으로 잘 반영합니다. 다만 saeculum은 여기서 지리적 ‘세상’보다 현존하는 ‘시대/세대’의 뜻이 더 직접적이므로 ‘이 시대’가 영어 POB와 원문에 더 가깝습니다.
  naturalness: 초안은 대체로 자연스럽고 합쇼체를 유지합니다. ‘뒤에 태어날 이들’과 ‘그 안에 사는 이들’은 ‘자들’보다 현대 표준어에서 조금 더 자연스럽습니다. ‘처해 있으며’는 어둠 가운데 있는 상태를 매끄럽게 나타냅니다.
  terminology: ‘빛’과 ‘어둠’은 원문의 비유를 그대로 보존합니다. 각주가 본문의 ‘놓여 있고’를 단지 종결형으로 반복하고 있어 실질적인 대안 번역이 되지 않으므로, stative한 본문과 구별되는 더 행위 지향적인 대안을 제시해야 합니다.
