id: 2ES.14.20
reference: 2 Esdras 14:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: autem iterum nati fuerint, quis commonebit ? Positum est enim saeculum in tenebris, et qui inhabitant in eo sine lumine ;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/020.yaml
  text: But those who will be born afterward—who will warn them? For the age lies in darkness[a], and those who dwell in it are without light.
  footnotes:
  - marker: a
    text: Or 'has been set'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 뒤에 태어날 이들을 누가 일깨우겠습니까? 이 시대는 어둠 속에 처해 있으며[a], 그 안에 사는 이들은 빛이 없습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어둠 속에 놓이게 되었습니다”.
    reason: 라틴어 positum est는 문맥상 ‘처해 있다’라는 상태적 의미로 읽는 것이 자연스럽지만, 완료 수동형을 더 행위 지향적으로 옮길 가능성도 각주에 보존합니다.
lexical_decisions:
- source_word: autem iterum nati fuerint
  english_pob_choice: those who will be born afterward
  chosen_korean: 뒤에 태어날 자들
  alternatives_korean:
  - 나중에 태어날 사람들
  - 그 후에 태어날 자들
  lexicon: iterum / nati fuerint
  rationale: iterum은 시간상 ‘다시’보다 문맥상 ‘뒤에, 나중에’의 흐름을 살려야 하므로, 미래 수동적 출생을 자연스럽게 옮겼습니다.
- source_word: quis commonebit ?
  english_pob_choice: who will warn them?
  chosen_korean: 누가 일깨우겠습니까?
  alternatives_korean:
  - 누가 경고하겠습니까?
  - 누가 알리겠습니까?
  lexicon: commonebit
  rationale: commoneo는 단순 ‘경고하다’보다 ‘주의를 주다, 일깨우다’의 넓은 뜻이 있어, 문맥상 후대 세대를 깨우칠 책임의 뉘앙스를 살렸습니다.
- source_word: Positum est enim saeculum in tenebris
  english_pob_choice: For the age lies in darkness
  chosen_korean: 이 세상은 어둠 속에 놓여 있고
  alternatives_korean:
  - 그 시대는 어둠 속에 놓여 있고
  - 그 세상은 어둠 속에 있고
  lexicon: saeculum / positum est / in tenebris
  rationale: saeculum은 여기서 추상적 ‘시대’이면서도 현실 세계를 가리킬 수 있어, 한국어에서는 문맥을 따라 ‘이 세상’으로 풀되 stative한 ‘lies’의 상태성을 반영해 ‘놓여 있고’로 옮겼습니다.
- source_word: qui inhabitant in eo sine lumine
  english_pob_choice: those who dwell in it are without light
  chosen_korean: 그 안에 사는 자들은 빛이 없습니다
  alternatives_korean:
  - 그 안에 거하는 자들은 빛이 없습니다
  - 그 안에 사는 사람들은 빛이 없습니다
  lexicon: inhabitant / sine lumine
  rationale: inhabitant는 단순 거주보다 지속적 ‘살다/거하다’의 의미가 있어 ‘사는 자들’로, sine lumine는 결핍 상태를 직설적으로 ‘빛이 없습니다’로 유지했습니다.
theological_decisions:
- issue: 사물화된 ‘세상/시대’가 어둠 속에 놓여 있다는 진술의 상태성
  chosen_reading: 하나님이 어떤 행위를 하셨다기보다, 현존하는 시대의 어둠 상태를 묘사하는 문장으로 읽었습니다.
  alternative_readings:
  - 하나님이 그 시대를 어둠 속에 두셨다
  - 이 시대가 어둠 가운데 놓이도록 정해졌다
  rationale: 라틴어 positum est는 여기서 완결된 행위보다 상태적 표현으로 기능하므로, 영어 POB의 수정 방향(‘has been set’ → ‘lies’)을 따라 원문의 상태성을 보존했습니다.
  doctrine_reference: 문법-의미 주석; 창조론/섭리론의 과잉 해석을 피함
