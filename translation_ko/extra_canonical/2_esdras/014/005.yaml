source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et enarraui ei mirabilia multa, et ostendi ei temporum secreta et temporum finem, et praecepi ei dicens:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/005.yaml
  text: And I told him many wonders, and I showed him the secrets of the times and the end of the times, and I commanded him, saying,
translation:
  language: ko
  text: '그리고 나는 그에게 많은 놀라운 일들을 이야기해 주었고, 때들의 비밀과 때들의 끝을 보여 주었으며, 그에게 이렇게 명령하였습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: enarraui
  english_pob_choice: I told
  chosen_korean: 말해 주었고
  alternatives_korean:
  - 말하였고
  - 전하였고
  - 이야기하였고
  lexicon: enarrare
  rationale: 단순 정보 전달이 아니라 상대에게 내용을 풀어 알려 주는 뜻을 살려, 자연스러운 합쇼체 서술로 옮겼습니다.
- source_word: mirabilia multa
  english_pob_choice: many wonders
  chosen_korean: 많은 놀라운 일들
  alternatives_korean:
  - 많은 기이한 일들
  - 많은 경이로운 일들
  lexicon: mirabilia
  rationale: mirabilia의 경이성·놀라움을 살리되, 문맥상 과장 없이 현대 한국어로 읽히도록 했습니다.
- source_word: temporum secreta et temporum finem
  english_pob_choice: the secrets of the times and the end of the times
  chosen_korean: 시대의 비밀들과 시대의 끝
  alternatives_korean:
  - 때들의 비밀과 때들의 끝
  - 시기의 비밀들과 시기의 끝
  lexicon: secreta / finis temporum
  rationale: temporal source of revelation을 드러내기 위해 '시대'를 유지했고, secreta와 finem을 병렬로 분명하게 나누어 옮겼습니다.
- source_word: praecepi ei dicens
  english_pob_choice: and I commanded him, saying
  chosen_korean: 말하기를 그에게 명령하였습니다
  alternatives_korean:
  - 그에게 명령하며 말하였습니다
  - 그에게 말하며 명령하였습니다
  lexicon: praecipio + dicens
  rationale: 라틴어 분사 dicens를 한국어에서 자연스러운 도입구로 풀어, 명령 내용이 곧 이어질 것임을 보이게 했습니다.
theological_decisions:
- issue: '''times''를 ''때''가 아니라 ''시대''로 옮길지 여부'
  chosen_reading: 시대의 비밀들과 시대의 끝
  alternative_readings:
  - 때의 비밀들과 때의 끝
  - 세월의 비밀들과 세월의 끝
  rationale: 이 단락의 종말론적·계시적 성격을 고려하면 단순한 시간 단위보다 구원사적 구간을 가리키는 '시대'가 더 적절합니다.
  doctrine_reference: 종말론 / 계시 문학
