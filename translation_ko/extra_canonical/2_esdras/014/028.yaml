lexical_decisions:
- source_word: grinati sunt
  english_pob_choice: sojourned
  chosen_korean: 머물렀고
  alternatives_korean:
  - 거류했고
  - 나그네로 살았고
  - 체류했고
  lexicon: grinor / sojourn
  rationale: 라틴어는 단순한 ‘거주’보다 임시 체류·거류의 뉘앙스를 담으므로, 한국어에서는 자연스럽고 절제된 ‘머물렀고’로 옮겼습니다.
- source_word: ab initio
  english_pob_choice: From the beginning
  chosen_korean: 처음부터
  alternatives_korean:
  - 태초부터
  - 처음에
  - 처음부터 이집트에서
  lexicon: ab initio
  rationale: 영어 POB의 수정처럼 시간의 출발점을 뜻하므로, ‘태초’보다 역사적 시점감을 살리는 ‘처음부터’가 더 적절합니다.
- source_word: patres nostri
  english_pob_choice: our fathers
  chosen_korean: 우리 조상들은
  alternatives_korean:
  - 우리 아버지들은
  - 우리 선조들은
  lexicon: patres nostri
  rationale: 문맥상 개인적 아버지들보다 이스라엘의 조상들을 가리키므로, 한국어에서는 ‘우리 조상들’이 의미를 가장 분명하게 전달합니다.
- source_word: liberati sunt
  english_pob_choice: they were delivered
  chosen_korean: 구원받았습니다
  alternatives_korean:
  - 해방되었습니다
  - 건져졌습니다
  - 풀려났습니다
  lexicon: liberor
  rationale: 라틴어는 구출·해방의 결과를 말하지만, 문맥상 출애굽적 구원을 가리키므로 한국어 독자에게는 ‘구원받았습니다’가 가장 직접적입니다.
theological_decisions:
- issue: 이집트 체류와 구원의 관계를 어떻게 보이게 할지
  chosen_reading: ‘머물렀고, 구원받았습니다’로 두 절을 나란히 놓아, 체류와 구원이 이어지는 역사 서술로 읽히게 했습니다.
  alternative_readings:
  - ‘머물렀으며, 건짐을 받았습니다’
  - ‘거류했고, 해방되었습니다’
  rationale: 원문은 조상들의 이집트 체류와 하나님의 구원을 병렬로 진술합니다. 과도한 설명을 덧붙이지 않고 역사적 구원 사건성을 드러내는 표현을 택했습니다.
  doctrine_reference: 출애굽 서사와 구원 언어
- issue: liberati sunt의 구원/해방 뉘앙스
  chosen_reading: ‘구원받았습니다’를 본문에 두고, ‘해방되었습니다’는 대안으로만 남겼습니다.
  alternative_readings:
  - 해방되었습니다
  - 건짐을 받았습니다
  rationale: 라틴어 자체는 해방·구출 모두 가능하지만, 본절의 문맥에서는 단순 사회적 해방보다 하나님의 구원 행위가 중심이므로 ‘구원’이 더 적절합니다.
  doctrine_reference: 구원론 / 출애굽 모형
