base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
  footnotes:
  - marker: a
    text: Or 'Therefore if you will rule your understanding and instruct your heart, you will be kept alive and after death you will obtain mercy.'.
