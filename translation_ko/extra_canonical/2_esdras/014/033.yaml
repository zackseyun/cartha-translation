source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nunc uos hic estis, et fratres uestri introrsum uestrum sunt. Si ergo imperaueritis sensui uestro et erudieritis cor uestrum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/033.yaml
  text: Now you are here[a], and your brothers are within you. If, therefore, you will command your mind and instruct your heart,
  footnotes:
  - marker: a
    text: Or 'Therefore if you will rule your understanding and instruct your heart, you will be kept alive and after death you will obtain mercy.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 여러분은 여기에 있습니다. 그리고 여러분의 형제들은 여러분 안에 있습니다. 그러므로 여러분이 자신의 마음을 명령하고 여러분의 마음을 훈계한다면,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 별도의 결과절은 다음 절에 속합니다.
    reason: source_note
lexical_decisions:
- source_word: nunc uos hic estis
  english_pob_choice: Now you are here
  chosen_korean: 이제 여러분은 여기에 있습니다
  alternatives_korean:
  - 지금 여러분은 여기 있습니다
  - 이제 여러분은 여기 있습니다
  lexicon: nunc / hic / estis
  rationale: 시간 부사 nunc와 장소 부사 hic를 자연스럽고 직접적으로 살려, 단순한 도착 표현이 아니라 ‘지금-여기’의 현존을 분명히 드러냈습니다.
- source_word: fratres uestri introrsum uestrum sunt
  english_pob_choice: your brothers are within you
  chosen_korean: 여러분의 형제들은 여러분 안에 있습니다
  alternatives_korean:
  - 여러분의 형제들은 여러분 내부에 있습니다
  - 여러분의 형제들은 여러분 속에 있습니다
  lexicon: fratres / introrsum / vestrum sunt
  rationale: introrsum uestrum을 관계적·공간적으로 ‘여러분 안에’로 옮겨, 문맥상 내면/내부를 가리키는 이미지를 살리되 한국어에서 지나치게 해부학적으로 들리지 않게 했습니다.
- source_word: imperaueritis sensui uestro
  english_pob_choice: you will command your mind
  chosen_korean: 여러분이 자신의 마음을 명령하고
  alternatives_korean:
  - 여러분이 자신의 이해를 다스리고
  - 여러분이 자신의 사고를 통제하고
  lexicon: imperaueritis / sensui uestro
  rationale: sensus/sensui의 의미를 단순한 ‘이해’보다 더 넓은 인지·판단의 자리로 보고, POB의 직역성을 따라 ‘마음’을 택하되 ‘명령하다’의 지배 동사를 유지했습니다.
- source_word: cor uestrum
  english_pob_choice: your heart
  chosen_korean: 여러분의 마음을 훈계한다면
  alternatives_korean:
  - 여러분의 마음을 가르친다면
  - 여러분의 심장을 훈련한다면
  lexicon: cor / erudieritis
  rationale: cor를 한국어 성경 문맥에 맞게 ‘마음’으로 옮기고, erudire의 교육·훈련 뉘앙스를 ‘훈계하다’로 살려 단순 감정기관이 아니라 형성되어야 할 내적 중심임을 드러냈습니다.
theological_decisions:
- issue: 문장 종결이 14:33에서 미완으로 끝나는 구조
  chosen_reading: 본문은 조건절까지만 제시하고, 뒤의 결과절은 다음 절로 넘깁니다.
  alternative_readings:
  - 한국어 문장 흐름을 위해 결과절을 덧붙여 완결시키기
  - 이 절을 독립된 완전문으로 재구성하기
  rationale: 라틴 본문이 'Si ergo...'로 절 끝을 열어 두므로, 한국어도 그 열린 구조를 유지해 34절과의 경계를 보존했습니다.
  doctrine_reference: textual structure / verse boundary
