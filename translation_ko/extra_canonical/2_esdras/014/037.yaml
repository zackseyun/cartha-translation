  source_fidelity: 라틴어의 현재형 sumus(‘우리는 ... 있다’)와 완료형 mansimus(‘우리는 ... 머물렀다’)의 시제 대비를 ‘우리는 들판에 있고 거기 머물렀습니다’로 보존했습니다. in campo는 ‘들판에’로 적절하며, factum est in crastinum은 서사적 시간 전환인 ‘그리고 다음 날이 되었습니다’로 충실히 옮겼습니다.
  naturalness: 현재 상태와 과거의 머묾이 한 문장에 병치되어 다소 이질적으로 느껴질 수 있으나, 이는 원문의 시제 혼합을 반영한 것입니다. 전체적으로 현대 한국어 합쇼체 문장으로 이해 가능하며 부자연스러움이 번역 수정이 필요할 정도는 아닙니다.
  terminology: ‘들판’, ‘머물렀습니다’, ‘다음 날’은 campus, mansimus, in crastinum에 각각 적합합니다. 신학적 전문 용어나 인명, 각주 앵커는 이 절에 해당하지 않습니다.
