  text: we are in the field and remained there. And it happened on the next day
translation:
  language: ko
  text: 우리는 들판에 있고 거기 머물렀습니다. 그리고 다음 날이 되었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sumus
  english_pob_choice: we are
  chosen_korean: 우리는 … 있고
  alternatives_korean:
  - 우리는 … 있습니다
  - 우리는 … 있습니다
  lexicon: sumus → 현재 상태를 나타내는 1인칭 복수 현재형
  rationale: 라틴어 현재형을 따라 화자의 현재 위치 상태를 자연스러운 합쇼체로 옮겼습니다.
- source_word: in campo
  english_pob_choice: in the field
  chosen_korean: 들판에
  alternatives_korean:
  - 밭에
  - 들에
  lexicon: campus → 들판, 벌판
  rationale: campus는 단순한 농지보다 넓은 야외 공간을 가리키므로, 문맥에 맞게 ‘들판’이 가장 무난합니다.
- source_word: mansimus
  english_pob_choice: remained
  chosen_korean: 머물렀습니다
  alternatives_korean:
  - 남아 있었습니다
  - 체류했습니다
  lexicon: manere → 머물다, 머무르다
  rationale: POB의 remained를 반영하되, 한국어에서는 장소에 일정 시간 ‘머물렀다’가 가장 자연스럽고 직접적입니다.
- source_word: factum est in crastinum
  english_pob_choice: it happened on the next day
  chosen_korean: 다음 날이 되었습니다
  alternatives_korean:
  - 이튿날이 되었습니다
  - 그리고 이튿날이 왔습니다
  lexicon: factum est + in crastinum → 시간이 진행되어 ‘다음 날이 됨’
  rationale: 직역식 ‘일어난 일은 이튿날이었다’보다, 다음 사건으로 넘어가는 시간표지의 기능을 살려 간결하게 옮겼습니다.
theological_decisions:
- issue: 문장 분절과 서술 시점
  chosen_reading: 앞 문장은 현재형 ‘우리는 들판에 있고’로, 뒤 문장은 과거형 ‘머물렀습니다’로 옮겨 라틴어의 서술 흐름을 유지했습니다.
  alternative_readings:
  - ‘우리는 들판에 있었습니다’처럼 전부 과거로 통일
  - ‘들판에 있었습니다’로 더 매끈하게 재구성
  rationale: 원문이 현재형 sumus와 완료/과거형 mansimus를 함께 쓰므로, 한국어에서도 시제 차이를 완전히 흡수하지 않고 드러냈습니다.
  doctrine_reference: source-faithfulness principle
