    reason: source_note
lexical_decisions:
- source_word: populum
  english_pob_choice: the people
  chosen_korean: 그리고 나는 말했습니다
  alternatives_korean:
  - 그리고 그 백성에게 말했습니다
  - 그리고 백성에게 말했습니다
  lexicon: populus
  rationale: 라틴어 원문은 앞선 맥락의 대상을 가리키는 대격 singular/collective로, 여기서는 발화 도입만 남아 있어 한국어에서는 자연스럽게 화자 동작을 먼저 두었습니다.
- source_word: Audi, Israel, uerba haec
  english_pob_choice: Hear these words, O Israel
  chosen_korean: 「이 말씀을 들으십시오, 이스라엘이여
