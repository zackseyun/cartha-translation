  - 「이 말씀들을 들으십시오, 이스라엘이여
  lexicon: audi / uerba
  rationale: uerba haec는 복수이지만 한국어에서는 내용의 엄숙함을 살려 ‘이 말씀’을 택했고, 호격 ‘이스라엘이여’를 유지했습니다.
- source_word: Peregrinantes pere-
  english_pob_choice: Sojourners, sojourners—
  chosen_korean: 나그네들, 나그네들—
