  - 거류자들, 거류자들—
  lexicon: peregrinantes
  rationale: peregrinantes는 ‘임시로 머무는 자들/나그네들’의 뜻이 강하므로, 문학적이면서도 source-direct한 ‘나그네들’로 옮겼습니다.
