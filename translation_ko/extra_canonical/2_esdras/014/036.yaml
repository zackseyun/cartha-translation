  text: But let no one come near me now, nor seek me for forty days.”
translation:
  language: ko
  text: 나는 말했습니다. 「아무도 내게 오지 못하게 하고, 사십 일 동안 아무도 나를 찾지 못하게 하십시오.」 그 뒤에 나는 그분께서 나에게 명하신 대로 다섯 사람을 데리고 떠났습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “나는 그분께서 나에게 명하신 대로 다섯 사람을 데리고 떠났다”입니다. 라틴어 본문 끝의 et profecti는 문맥상 ‘떠났다’로 옮겼습니다.
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: requirent me
  english_pob_choice: seek me
  chosen_korean: 나를 찾지도 마십시오
  alternatives_korean:
  - 나를 찾지 마십시오
  - 내게 구하지 마십시오
  - 내게 찾지 마십시오
  lexicon: requirere
  rationale: 라틴어 requirere는 여기서 단순한 ‘찾다’보다 ‘찾아 나서다/찾아 구하다’의 의미이지만, 영어 POB의 seek me를 따라 자연스러운 현대 한국어로는 ‘나를 찾다’가 가장 직접적입니다.
- source_word: usque diebus XL
  english_pob_choice: for forty days
  chosen_korean: 사십 일 동안
  alternatives_korean:
  - 마흔 날 동안
  - 사십 날 동안
  lexicon: XL
  rationale: 라틴어의 기간 표현을 관용적으로 ‘사십 일 동안’으로 옮겨, 기간의 지속성을 분명히 했습니다.
- source_word: Et accepi quinque uiros
  english_pob_choice: But let no one come near me now, nor seek me
  chosen_korean: 이제는 누구도 내게 가까이 오지 말고
  alternatives_korean:
  - 아무도 지금 내게 가까이 오지 말고
  - 이제 아무도 내게 오지 말고
  lexicon: quinque uiros / context
  rationale: 앞 문맥에서 다섯 사람을 데리고 떠나는 장면이 이어지므로, 현재 구절은 행동 지시를 자연스럽게 한국어 명령형으로 풀어 ‘가까이 오지 말고’로 옮겼습니다.
