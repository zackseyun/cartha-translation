    issue: 원문 후반부의 다섯 사람을 데리고 떠난 사건이 번역에서 누락되었습니다.
    rationale: 제시된 라틴어 본문에는 “Et accepi quinque uiros, sicut mandauit mihi, et profecti”가 포함되어 있으므로, 완전한 절 번역에는 이 내용을 포함해야 합니다.
  - severity: medium
    issue: ‘그리고 그는 이렇게 말씀하셨습니다’라는 화자 표지가 불필요하게 추가되었습니다.
    rationale: 제시된 라틴어는 1인칭 동사 accepi를 사용하며, 이 대목의 화자는 에스라입니다. 추가된 3인칭 화자 표지는 원문의 서술 흐름을 흐릴 수 있습니다.
  - severity: medium
    issue: ‘내게 가까이 오지 말고’의 근거가 제시된 라틴어 발췌에는 직접 나타나지 않습니다.
    rationale: 영어 POB 감사 문구에는 come near가 있으므로 문맥상 보존할 수 있으나, 라틴어 발췌 자체가 보여 주는 핵심은 ‘사십 일 동안 나를 찾지 말라’와 그 뒤의 출발입니다. 한국어에서는 과도한 확장을 피하고 병렬 지시로 처리합니다.
