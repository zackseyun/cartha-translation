revisions:
- from: 그리고 그는 이렇게 말씀하셨습니다. 「이제는 누구도 내게 가까이 오지 말고, 사십 일 동안 나를 찾지도 마십시오.」[a]
  to: 나는 말했습니다. 「아무도 내게 오지 못하게 하고, 사십 일 동안 아무도 나를 찾지 못하게 하십시오.」 그 뒤에 나는 그분께서 나에게 명하신 대로 다섯 사람을 데리고 떠났습니다.[a]
  rationale: 원문에 포함된 후반 서술을 복원하고, 1인칭 화자와 직접 인용의 구조를 유지했습니다. ‘찾다’와 ‘사십 일’은 유지했으며, 제시된 영어 감사 문구의 병렬 금지 지시도 자연스러운 합쇼체 명령으로 반영했습니다.
