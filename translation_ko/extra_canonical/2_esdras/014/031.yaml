  yaml_path: translation/extra_canonical/2_esdras/014/031.yaml
  text: the inheritance in the land of Zion, and you and your fathers committed iniquity and did not keep the ways that the Most High commanded you; the Righteous One
translation:
  language: ko
  text: 시온 땅의 유업을, 너희와 너희 조상들은 불의를 행했고 지극히 높으신 분께서 너희에게 명하신 길들을 지키지 않았습니다. 의로우신 분이시여[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 Iustus는 문맥상 독립된 호칭처럼 남아 있어, 한국어에서는 호격으로 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: sortem
  english_pob_choice: the inheritance
  chosen_korean: 유업
  alternatives_korean:
  - 몫
  - 상속분
  - 기업
  lexicon: sortem
  rationale: 문맥상 단순한 ‘몫’보다 하나님이 주시는 몫/상속의 의미가 살아 있는 ‘유업’이 가장 자연스럽습니다.
- source_word: terra Sion
  english_pob_choice: in the land of Zion
  chosen_korean: 시온 땅의
  alternatives_korean:
  - 시온의 땅의
  - 시온 땅에서의
  - 시온 지역의
  lexicon: terra
  rationale: latin의 전치사구를 한국어 소유·관형 구조로 옮겨, ‘유업’이 ‘시온 땅’에 속함을 분명히 했습니다.
- source_word: iniquitatem fecistis
  english_pob_choice: committed iniquity
  chosen_korean: 불의를 행했고
  alternatives_korean:
  - 죄악을 저질렀고
  - 악을 행했고
  - 불법을 행했고
  lexicon: iniquitas
  rationale: iniquitas의 도덕적·언약적 어긋남을 ‘불의’로 살리되, 동사와 결합해 자연스럽게 표현했습니다.
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  - 지극히 높으신 이
  lexicon: Altissimus
  rationale: 본문이 라틴어 호칭만 제시하므로, 신명과 직접 동일시를 과도하게 단정하지 않는 ‘지극히 높으신 분’을 택했습니다.
theological_decisions:
- issue: 마지막의 단독 명사 Iustus 처리
  chosen_reading: 의로우신 분이시여
  alternative_readings:
  - 의로우신 분
  - 의인
  - 의로우신 이여
  rationale: 본문 끝의 Iustus는 문장 전체와 분리된 호칭처럼 보이며, 한국어에서는 기도적·찬양적 여운을 살린 호격형이 가장 자연스럽습니다.
  doctrine_reference: 호칭의 불완전성은 원문 유지로 남기되, 문맥상 하나님을 가리키는 찬양적 표현으로 읽었습니다.
