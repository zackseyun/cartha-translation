  source_fidelity: 첫 구절의 대격 목적어(sortem)와 끝의 주격 Iustus가 모두 불완전하게 남아 있는 라틴어 본문의 형태를 보존해야 합니다. 초안은 Iustus(주격)를 ‘의로우신 분이시여’라는 호격으로 바꾸어 문법적 형태와 가능한 선행 문맥으로의 연결을 과도하게 해석했습니다.
  naturalness: ‘너희와 너희 조상들은’보다 ‘너희와 너희 조상 모두’가 et vos et patres vestri의 병렬·포괄을 자연스럽게 드러냅니다. 본문 자체가 절단된 단편이므로, 한국어에서도 일부 미완결감은 피할 수 없으며 이를 완결 문장으로 보정하지 않는 편이 충실합니다.
  terminology: ‘유업’, ‘불의를 행했고’, ‘지극히 높으신 분’, ‘의로우신 분’은 각각 sortem, iniquitatem fecistis, Altissimus, Iustus에 적절합니다. Iustus는 호격이나 ‘의인’으로 한정하지 않고 ‘의로우신 분’으로 옮기는 것이 안전합니다.
