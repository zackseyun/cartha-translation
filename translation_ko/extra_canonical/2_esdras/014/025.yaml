  text: hos quia parati sunt ad scribendum uelociter ; Et uenies hic, et ego accendam in corde tuo lucernam intellectus, quae non extinguetur quoadusque finiantur quae incipies scribere. Et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/025.yaml
  text: these five, because they are ready to write quickly. And you shall come here, and I will kindle in your heart a lamp of understanding that will not be extinguished until the things that you begin to write are finished.
translation:
  language: ko
  text: 이들 다섯은 빨리 쓰도록 준비되어 있기 때문입니다. 그리고 당신은 여기로 오십시오. 그러면 제가 당신의 마음에 이해의 등불을 밝혀 주겠는데, 당신이 시작하여 쓰는 것들이 끝날 때까지 그 등불은 꺼지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 유베시스/미래형 뉘앙스를 살리면 “오실 것입니다”도 가능하지만, 본문은 인물의 도착보다 후속 지시와 계시 행위를 중심으로 진행됩니다.
    reason: alternative_reading
lexical_decisions:
- source_word: hos
  english_pob_choice: these five
  chosen_korean: 이들 다섯
  alternatives_korean:
  - 이 다섯
  - 다섯 사람
  - 이 다섯 사람
  lexicon: 수사 표현
  rationale: 지시어 호스(hos)를 살려 앞서 언급된 다섯을 가리키되, 불필요하게 ‘사람’을 덧붙이지 않고 간결하게 옮겼습니다.
- source_word: parati sunt ad scribendum uelociter
  english_pob_choice: are ready to write quickly
  chosen_korean: 빨리 쓰도록 준비되어 있기 때문입니다
  alternatives_korean:
  - 빠르게 쓰려고 준비되어 있습니다
  - 신속히 기록할 준비가 되어 있습니다
  lexicon: 동사구
  rationale: parati sunt는 ‘준비되어 있다’, ad scribendum은 목적을 나타내는 ‘쓰도록’으로, uelociter는 ‘빨리’로 옮겨 원문의 준비성과 속도감을 함께 살렸습니다.
- source_word: lucernam intellectus
  english_pob_choice: a lamp of understanding
  chosen_korean: 이해의 등불
  alternatives_korean:
  - 깨달음의 등불
  - 이해를 비추는 등불
  lexicon: 명사구
  rationale: intellectus를 단순한 지적 능력보다 이해/깨달음으로 보되, 원문의 은유를 유지하기 위해 ‘등불’과 결합했습니다.
- source_word: quae non extinguetur
  english_pob_choice: that will not be extinguished
  chosen_korean: 그 등불은 꺼지지 않을 것입니다
  alternatives_korean:
  - 그것은 꺼지지 않을 것입니다
  - 꺼질 수 없는 등불일 것입니다
  lexicon: 동사구
  rationale: 등불에 자연스러운 한국어 표현인 ‘꺼지다’를 사용해 라틴어 extinguere의 불꽃 이미지를 직접적으로 살렸습니다.
- source_word: quoadusque finiantur quae incipies scribere
  english_pob_choice: until the things that you begin to write are finished
  chosen_korean: 당신이 시작하여 쓰는 것들이 끝날 때까지
  alternatives_korean:
  - 당신이 쓰기 시작하는 것들이 완성될 때까지
  - 당신이 기록하기 시작한 것들이 끝날 때까지
  lexicon: 종속절
  rationale: quoadusque는 ‘-할 때까지’로, finiantur는 완료됨/끝남의 의미를 살려 문장의 종결을 자연스럽게 구성했습니다.
theological_decisions:
- issue: 지혜/이해의 빛을 주시는 행위의 주체 표현
  chosen_reading: 제가 당신의 마음에 이해의 등불을 밝혀 주겠는데
  alternative_readings:
  - 내가 당신의 마음에 이해의 등불을 켜 주겠는데
  - 내가 당신의 마음에 깨달음의 등불을 비추겠는데
  rationale: 원문은 내면에 빛을 ‘점화’하는 이미지이므로, 단순한 정보 전달보다 내적 조명과 계시의 효과를 드러내는 ‘밝혀 주다’를 택했습니다.
  doctrine_reference: 계시와 지혜의 은유를 보존하는 번역 원칙
- issue: 마음(corde tuo) 안에 놓이는 등불의 내재성
  chosen_reading: 당신의 마음에
  alternative_readings:
  - 네 마음에
  - 그대의 마음에
  rationale: 직접 화법의 대상이 분명하므로 ‘당신의’로 현대 합쇼체를 유지하면서도, 라틴어의 내면적 위치 표지를 분명히 했습니다.
  doctrine_reference: 문맥 내 직접 خطاب의 존중
