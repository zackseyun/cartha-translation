  to: 그리고 자신에게서 필멸의 생각들을 버리고, 자신에게서 인간의 짐들을 내던지며, 이제 자신의 연약한 본성을 벗어 버리고, 자신을 가장 괴롭게 하는 생각들을 한쪽에 제쳐 두십시오.
