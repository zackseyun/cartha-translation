id: 2ES.14.14
reference: 2 Esdras 14:14
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et dimitte abs te mortales cogitationes, et proice abs te pondera humana, et exue te iam infirmam naturam, et repone in unam partem molestissima tibi cogitamenta, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/014.yaml
  text: And put away from yourself mortal thoughts, and cast off from yourself human burdens, and strip off now your weak nature, and set aside the thoughts that are most grievous to you,
translation:
  language: ko
  text: 그리고 죽을 수밖에 없는 생각들을 너 자신에게서 버리고, 인간의 짐들을 너 자신에게서 벗어버리며, 이제 네 연약한 본성을 벗고, 네게 가장 괴로운 생각들을 한쪽에 치워 두십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortales cogitationes
  english_pob_choice: mortal thoughts
  chosen_korean: 죽을 수밖에 없는 생각들
  alternatives_korean:
  - 죽을 생각들
  - 필멸의 생각들
  - 죽을 수 있는 생각들
  lexicon: mortalis + cogitationes
  rationale: 단순한 ‘죽음에 관한 생각’이 아니라 인간의 유한성과 죽음 아래 있는 사고를 가리키므로, 직역보다 의미를 드러내는 표현을 택했습니다.
- source_word: pondera humana
  english_pob_choice: human burdens
  chosen_korean: 인간의 짐들
  alternatives_korean:
  - 사람의 짐들
  - 인간적인 짐들
  - 인생의 짐들
  lexicon: pondera + humana
  rationale: pondera는 무게가 실린 부담을 뜻하므로 ‘짐들’이 자연스럽고, humana는 단순한 ‘사람의’보다 범주적 의미의 ‘인간의’가 더 가깝습니다.
- source_word: exue te iam infirmam naturam
  english_pob_choice: strip off now your weak nature
  chosen_korean: 이제 네 연약한 본성을 벗고
  alternatives_korean:
  - 이제 네 약한 본성을 벗고
  - 이제 네 허약한 본성을 벗어 던지고
  - 이제 네 연약한 성품을 벗고
  lexicon: exue te + infirmam naturam
  rationale: exue te는 옷을 벗듯이 벗어내라는 강한 동작이므로 ‘벗다’로 살리고, infirmam naturam은 ‘성품’보다 본질적 상태를 가리키는 ‘본성’이 더 적절합니다.
- source_word: repone in unam partem molestissima tibi cogitamenta
  english_pob_choice: set aside the thoughts that are most grievous to you
  chosen_korean: 네게 가장 괴로운 생각들을 한쪽에 치워 두십시오
  alternatives_korean:
  - 네게 가장 괴로운 생각들을 따로 두십시오
  - 네게 가장 괴로운 생각들을 한편으로 밀어 두십시오
  - 네게 가장 괴로운 생각들을 물리쳐 두십시오
  lexicon: repone in unam partem + molestissima tibi cogitamenta
  rationale: repone in unam partem은 ‘한쪽에 두다, 제쳐 두다’의 뜻이므로 관용적이면서도 이미지가 살아 있는 표현으로 옮겼습니다.
theological_decisions:
- issue: 문장의 명령형 강도와 연속 동사구의 호흡
  chosen_reading: 원문의 연속 명령을 살려 한국어에서도 네 개의 요청을 차례로 나열했고, 마지막은 정중한 명령형으로 마무리했습니다.
  alternative_readings:
  - 서술형 권고문으로 완화
  - 모두 해라체로 평준화
  rationale: 이 절은 수사적 격문에 가까워 강한 권면의 리듬이 중요하므로, 합쇼체를 유지하되 연속 명령의 추진력을 보존했습니다.
  doctrine_reference: 문학적 권면의 수사 구조 보존
- issue: direct address의 2인칭 재귀 표현
  chosen_reading: ‘너 자신에게서’와 ‘네’로 재귀성과 직접성을 드러냈습니다.
  alternative_readings:
  - 단순히 ‘버리고’로 축약
  - ‘자기에게서’로 비인칭화
  rationale: 원문은 자기 자신으로부터 떼어내는 동작을 반복해 강조하므로, 재귀적 대상을 분명히 하는 편이 원문의 압박감을 더 잘 반영합니다.
  doctrine_reference: 원문 수사 반복 보존
