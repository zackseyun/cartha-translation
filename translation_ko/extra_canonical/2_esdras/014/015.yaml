translation:
  language: ko
  text: 그리고 이 시대를 서둘러 떠나십시오. 이는 지금 당신이 본 것들이
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: festina transmigrare
  english_pob_choice: and hurry to depart
  chosen_korean: 서둘러 떠나십시오
  alternatives_korean:
  - 급히 떠나십시오
  - 서둘러 옮겨가십시오
  lexicon: festina + transmigrare
  rationale: festina의 긴박함과 transmigrare의 ‘옮겨가다/떠나다’ 의미를 살려, 한국어에서는 자연스럽고 명령형인 ‘서둘러 떠나십시오’로 옮겼습니다.
- source_word: a temporibus his
  english_pob_choice: from these times
  chosen_korean: 이 시대들에서
  alternatives_korean:
  - 이 때들에서
  - 이 시대로부터
  lexicon: a + temporibus his
  rationale: 복수형 temporibus를 반영해 ‘시대들’로 두되, 한국어에서는 명령의 출발점이 드러나도록 ‘에서’로 자연화했습니다.
- source_word: Quae enim uidisti nunc
  english_pob_choice: for the things you have now seen
  chosen_korean: 지금 당신이 본 것들은
  alternatives_korean:
  - 지금 보신 것들은
  - 지금 당신이 보아 온 것들은
  lexicon: quae + uidisti + nunc
  rationale: 문장 경계상 14:15에는 ‘things you have now seen’까지만 있으므로, 뒤를 열어 두는 절로 옮기고 now를 ‘지금’으로 직역해 현재 시점을 분명히 했습니다.
theological_decisions:
- issue: Verse boundary alignment between 14:15 and 14:16
  chosen_reading: 14:15는 ‘서둘러 떠나십시오… 지금 당신이 본 것들은’까지만 두고, 뒤에 이어질 내용은 다음 절로 넘깁니다.
  alternative_readings:
  - ‘지금 당신이 본 악한 일들은’
  - ‘지금 당신이 본 일들은 일어난 악들입니다’
  rationale: 영어 POB의 이전 확장은 14:16의 의미를 끌어온 것으로 보이므로, 라틴 본문에 있는 범위만 반영해 절 경계를 보존했습니다.
  doctrine_reference: 본문비평 및 절 경계 보존
