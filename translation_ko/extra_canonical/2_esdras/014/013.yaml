  yaml_path: translation/extra_canonical/2_esdras/014/013.yaml
  text: Therefore now set your house in order[a], and reprove your people, and comfort their humble ones, and renounce the corruptible life now.
  footnotes:
  - marker: a
    text: Or 'the corrupt life'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 이제 네 집안을 정돈하고, 네 백성을 책망하며, 그들 가운데 낮은 사람들을 위로하고, 이제 썩어 없어질 삶을 버리십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘부패한 삶’ 또는 ‘부패하는 삶’입니다. 여기서는 문맥상 도덕적 타락보다 죽음과 소멸에 노출된 삶을 가리킬 수 있습니다.
    reason: 원문의 어휘적 여지를 보존하면서, 문맥상 두드러지는 소멸성의 뜻을 설명합니다.
lexical_decisions:
- source_word: dispone domum tuam
  english_pob_choice: set your house in order
  chosen_korean: 네 집안을 바로 세우고
  alternatives_korean:
  - 네 집을 정리하고
  - 네 집을 정돈하고
  lexicon: domus
  rationale: 가정의 물리적 정리보다 삶과 공동체를 정비하라는 뜻을 살려 ‘집안을 바로 세우다’로 옮겼습니다.
- source_word: corripe populum tuum
  english_pob_choice: reprove your people
  chosen_korean: 네 백성을 책망하며
  alternatives_korean:
  - 네 백성을 꾸짖으며
  - 네 백성을 경고하며
  lexicon: corripio
  rationale: 단순한 훈계보다 잘못을 드러내어 바로잡는 의미가 있어 ‘책망하다’가 가장 가깝습니다.
- source_word: consolare humiles eorum
  english_pob_choice: comfort their humble ones
  chosen_korean: 그들의 겸손한 이들을 위로하고
  alternatives_korean:
  - 그들의 낮은 이들을 위로하고
  - 그들의 겸손한 사람들을 위로하고
  lexicon: humiles
  rationale: 여기서 humiles는 사회적으로 낮거나 겸손한 사람들을 가리킬 수 있으나, 문맥상 공동체 안의 낮은 이들을 포괄하는 표현으로 유지했습니다.
- source_word: renuntia iam corruptae uitae
  english_pob_choice: renounce the corruptible life now
  chosen_korean: 이제 부패하는 삶을 버리십시오
  alternatives_korean:
  - 이제 썩어 없어질 삶을 버리십시오
  - 이제 썩어질 삶을 포기하십시오
  lexicon: corruptae uitae
  rationale: 영어 POB의 수정처럼 moral corruption이 아니라 죽음과 소멸의 성격을 지닌 ‘부패하는/썩어 없어질’ 삶으로 이해하여, 종말론적·존재론적 뉘앙스를 살렸습니다.
theological_decisions:
- issue: corruptae uitae의 의미
  chosen_reading: 죄악된 삶이 아니라 유한하고 소멸 가능한 현세적 삶을 버리라는 명령으로 읽었습니다.
  alternative_readings:
  - 도덕적으로 타락한 삶을 버리라는 권고
  - 세속적 생활방식을 끊으라는 권고
  rationale: 수정된 영어 POB 주석과 인접 문맥이 ‘mortal / perishable’ 의미를 지지하므로, 회개 권면으로 축소하지 않고 에스드라의 전환을 앞둔 존재론적 요청으로 옮겼습니다.
  doctrine_reference: 4 Ezra 14:13-14 문맥
- issue: 명령형 어조
  chosen_reading: 본문의 연속 명령을 한국어에서 공손한 명령형으로 유지했습니다.
  alternative_readings:
  - 직설적 평서형으로 완화
  - 권유형으로 약화
  rationale: 원문의 급박한 권면과 예언적 명령성을 보존하기 위해 합쇼체 명령형을 사용했습니다.
  doctrine_reference: 문체/등록 보존
