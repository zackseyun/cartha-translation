  text: 'Et factum est cum conpleti essent XL dies, et locutus est ad me altissimus dicens : priora quae scripsisti in palam pone, et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/045.yaml
  text: And it happened when the forty days were completed[a], the Most High spoke to me, saying, “The former things that you wrote, set them out publicly, and
  footnotes:
  - marker: a
    text: Or 'And it happened when the forty days were completed, the Most High spoke to me, saying, “The first things that you wrote, set them out publicly, and let the worthy and the unworthy read them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 사십 일이 마쳐졌을 때에 지극히 높으신 이가 내게 말씀하셨습니다. “네가 기록한 이전의 것들을 공개적으로 내놓아라, 그리고[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 priora는 영어 POB 개정처럼 ‘이전의 것들’로 옮길 수 있으며, ‘첫 번째 것들’로도 이해될 여지가 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: cum conpleti essent XL dies
  english_pob_choice: when the forty days were completed
  chosen_korean: 사십 일이 마쳐졌을 때에
  alternatives_korean:
  - 사십 일이 끝났을 때에
  - 사십 일이 완성되었을 때에
  lexicon: conpleti essent
  rationale: 라틴어 완료 수동 구문을 자연스러운 시제 배경으로 옮기되, 단순한 종료보다 ‘마쳐지다’가 절차의 완료감을 더 잘 드러냅니다.
- source_word: altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 지극히 높으신 분
  - 가장 높으신 분
  - 지존자
  lexicon: altissimus
  rationale: 직역적 호칭을 살리면서도 한국어에서 자연스럽고 경외감을 유지하는 표현으로 옮겼습니다.
- source_word: priora quae scripsisti
  english_pob_choice: The former things that you wrote
  chosen_korean: 네가 기록한 이전의 것들
  alternatives_korean:
  - 네가 기록한 옛것들
  - 네가 써 둔 앞선 것들
  lexicon: priora
  rationale: priora는 ‘첫 번째 것들’보다 앞선 시점의 ‘이전의 것들’이 더 정확하므로, 개정된 영어 POB의 ‘former things’와 같은 방향으로 반영했습니다.
- source_word: in palam pone
  english_pob_choice: set them out publicly
  chosen_korean: 공개적으로 내놓아라
  alternatives_korean:
  - 드러내어 놓아라
  - 세상 앞에 내놓아라
  - 공개하라
  lexicon: in palam pone
  rationale: palam의 공개성은 유지하되, 문맥상 문서들을 ‘내놓다’가 가장 직접적이어서 명령의 강도를 살렸습니다.
theological_decisions:
- issue: 지극히 높으신 이의 호칭
  chosen_reading: altissimus를 고유 신명 대신 호칭적으로 번역해 ‘지극히 높으신 이’로 옮겼습니다.
  alternative_readings:
  - 하나님
  - 지존하신 하나님
  rationale: 원문은 신적 호칭만을 제시하며, 문맥상 특정 교리적 확정을 덧붙이지 않고 경외적 호칭으로 보존하는 편이 더 स्रोत-충실합니다.
  doctrine_reference: 신적 호칭의 보존과 과도한 해석 자제
- issue: 마지막 접속사 et의 처리
  chosen_reading: 절 말미를 ‘그리고’로 끝내어 다음 절로 이어지는 문장 경계를 유지했습니다.
  alternative_readings:
  - 마침표로 종결
  - 다음 절 내용을 함께 포함
  rationale: 제공된 라틴어 본문이 45절에서 et로 끝나므로, 본문 경계를 지키기 위해 문장을 미완결 형태로 남겼습니다.
  doctrine_reference: 절 경계 보존
