  alternative_readings:
  - 비유적으로만 이해하여 말문이 트였다는 관용구로 완화할 수 있음
  - '''열렸다''와 ''닫혀 있지 않다''를 하나로 합쳐 중복을 줄일 수 있음'
  rationale: 라틴어 원문은 개방과 비차단을 병치하여 변화의 확정성을 강조하므로, 두 상태를 모두 살려 긴장을 유지했습니다.
