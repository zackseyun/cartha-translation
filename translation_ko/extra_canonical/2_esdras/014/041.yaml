  rationale: amplius는 '더 이상'으로 옮기는 것이 가장 직접적이며, POB의 수정된 영어 표현도 이 지속적 부정을 자연스럽게 보여 줍니다.
theological_decisions:
- issue: 본문이 말하는 변화의 성격
