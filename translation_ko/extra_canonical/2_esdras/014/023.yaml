- from: “마지막 때에 살아 있을 자들이 살게 하려는 것입니다.” 그리고 그가 내게 대답하여 말했습니다. “가서 백성을 모으고, 그들에게 너를 찾지 말라고 하십시오.”[a]
  to: “마지막 때에 살게 될 사람들이 살 수 있게 하려는 것입니다.” 그러자 그가 내게 대답하여 말씀하셨습니다. “가서 백성을 모으고, 그들에게 그대를 찾지 말라고 말하십시오.”
