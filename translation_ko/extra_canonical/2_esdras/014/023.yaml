  text: those who are to live in the last days may live.” And he answered me and said, “Go, gather the people, and say to them not to seek you
translation:
  language: ko
  text: “마지막 때에 살게 될 사람들이 살 수 있게 하려는 것입니다.” 그러자 그가 내게 대답하여 말씀하셨습니다. “가서 백성을 모으고, 그들에게 그대를 찾지 말라고 말하십시오.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uiuere in nouissimis uiuant
  english_pob_choice: those who are to live in the last days may live
  chosen_korean: “마지막 때에 살아 있을 자들이 살게 하려는 것입니다.”
  alternatives_korean:
  - “마지막 날들에 살 자들이 살게 하려는 것입니다.”
  - “말세에 살 사람들이 살게 하려는 것입니다.”
  lexicon: vivere / nouissimi
  rationale: 라틴어의 목적-결과 구조를 따라 ‘살게 하려는 것입니다’로 옮기고, nouissimis는 종말론적 시간표현으로 ‘마지막 때’로 풀어 자연스럽게 했습니다.
- source_word: congrega populum
  english_pob_choice: gather the people
  chosen_korean: “백성을 모으고”
  alternatives_korean:
  - “사람들을 모으고”
  - “백성을 모아”
  lexicon: congregare / populus
  rationale: populus는 단순한 개인 집합보다 공동체적 ‘백성’의 뉘앙스가 있어 이를 살렸고, 명령형 연쇄를 위해 동사형으로 정리했습니다.
- source_word: ut non te quaerant
  english_pob_choice: not to seek you
  chosen_korean: “그들에게 너를 찾지 말라고 하십시오.”
  alternatives_korean:
  - “그들이 너를 찾지 않도록 하십시오.”
  - “그들에게 너를 찾지 말라고 말하십시오.”
  lexicon: quaerere
  rationale: 직접 화법의 명령을 살리면서도 한국어에서는 간접명령 ‘-라고 하십시오’가 가장 자연스러워, ‘seek you’를 ‘너를 찾다’로 직역하지 않고 의미를 유지했습니다.
theological_decisions:
- issue: ‘마지막 때’의 종말론적 시간표현
  chosen_reading: nouissimis을 문자적으로 종말의 마지막 시기로 읽어 ‘마지막 때’로 번역했습니다.
  alternative_readings:
  - ‘말세’
  - ‘끝날들’
  rationale: 본문의 시간 지시를 완화하지 않고 종말론적 긴장을 유지하기 위해 보다 중립적이고 현대적인 ‘마지막 때’를 선택했습니다.
  doctrine_reference: eschatology
