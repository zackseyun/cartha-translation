  text: uiui conseruati eritis et post mortem misericordiam consequemini; Iudicium enim post mortem ueniet quando iterum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/034.yaml
  text: you will be kept alive[a], and after death you will obtain mercy. For judgment will come after death, when again
  footnotes:
  - marker: a
    text: Or 'For judgment will come after death, when we shall live again,'.
    reason: previous_rendering
translation:
  language: ko
  text: 살아 있도록 지켜질 것이며, 죽은 뒤에는 자비를 얻게 될 것입니다. 심판은 죽은 뒤에 올 것이니, 다시…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘우리가 다시 살아날 때에 심판은 죽은 뒤에 올 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: uiui conseruati eritis
  english_pob_choice: you will be kept alive
  chosen_korean: 살아 있도록 보존될 것이며
  alternatives_korean:
  - 살려 두실 것이며
  - 생명을 보존받을 것이며
  lexicon: conseruare
  rationale: 라틴어 conseruati eritis는 단순히 ‘살다’보다 ‘살아 있도록 지켜 보존하다’의 수동 뉘앙스가 있어, 결과 상태를 살리면서도 보존의 의미를 드러냈습니다.
- source_word: post mortem misericordiam consequemini
  english_pob_choice: after death you will obtain mercy
  chosen_korean: 죽은 뒤에는 자비를 얻게 될 것입니다
  alternatives_korean:
  - 죽은 뒤에는 긍휼을 받게 될 것입니다
  - 죽은 후에 자비를 얻게 될 것입니다
  lexicon: misericordia / consequi
  rationale: misericordiam은 문맥상 ‘자비/긍휼’이 가능하지만, 한국어에서는 공적·격식체로 ‘자비’를 택해 약속의 뉘앙스를 유지했습니다.
- source_word: Iudicium enim post mortem ueniet
  english_pob_choice: For judgment will come after death
  chosen_korean: 왜냐하면 심판은 죽은 뒤에 오고
  alternatives_korean:
  - 왜냐하면 재판은 죽은 뒤에 오고
  - 왜냐하면 심판이 죽음 뒤에 올 것이기 때문입니다
  lexicon: iudicium
  rationale: iudicium은 법정 행위보다 종말론적 ‘심판’이 적절하여, POB의 judgment를 ‘심판’으로 옮겼습니다.
- source_word: quando iterum
  english_pob_choice: when again
  chosen_korean: 다시…
  alternatives_korean:
  - 그때 다시
  - 또다시
  lexicon: iterum
  rationale: 원문이 이 구절에서 끊겨 있으므로, 미완결성을 드러내기 위해 문장을 매듭짓지 않고 생략 부호로 남겼습니다.
theological_decisions:
- issue: 2 Esdras 14:34의 문장 경계가 라틴어 원문상 미완결로 남아 있음
  chosen_reading: 본 절은 다음 절로 이어지는 열린 문장으로 처리했습니다.
  alternative_readings:
  - 완결된 한국어 문장으로 정리하는 방식
  - 이전 절과 묶어 매끄럽게 재구성하는 방식
  rationale: 제공된 라틴어 본문이 'quando iterum'에서 끝나므로, 본문을 매끈하게 완결시키기보다 단절감을 보존하는 것이 출처 충실성에 부합합니다.
  doctrine_reference: source fidelity / versification alignment
