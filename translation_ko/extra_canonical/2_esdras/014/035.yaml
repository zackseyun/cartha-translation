  naturalness: 합쇼체는 유지되어 있으나, ‘아무도 내게 가까이 오지 마십시오’는 불특정 다수에게 직접 명령하는 듯하여 라틴어의 제3인칭 금지·허용 표현(let no one...)을 충분히 살리지 못합니다. ‘아무도 내게 가까이 오지 않게 하십시오’가 더 자연스럽고 정확합니다. 미완의 접속어 앞 쉼표는 제거하는 편이 낫습니다.
  terminology: iusti는 ‘의인들’로 적절합니다. impii는 iusti의 단순 반대인 ‘불의한 자들’보다 ‘경건하지 않은 자들’로 옮겨 원어의 종교적·경건 관련 의미를 보존하는 것이 좋습니다. ‘다시 살아날 것입니다’와 ‘드러나고/밝혀질 것입니다’는 적절합니다.
