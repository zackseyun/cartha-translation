  text: we will live again; and then the name of the righteous will appear, and the deeds of the ungodly will be disclosed. But let no one come near me now, nor
translation:
  language: ko
  text: 우리는 다시 살아날 것입니다. 그러면 의인들의 이름이 드러나고, 불의한 자들의 행위가 밝혀질 것입니다. 그러나 지금은 아무도 내게 가까이 오지 마십시오, 또[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 accedat nunc, neque는 문장이 중간에 끊긴 형태이므로, 한국어도 의도적으로 미완의 결말을 남겼습니다.
    reason: source_note
lexical_decisions:
- source_word: reuiuiscemus
  english_pob_choice: we will live again
  chosen_korean: 우리는 다시 살아날 것입니다
  alternatives_korean:
  - 우리는 다시 살 것입니다
  - 우리는 다시 생명을 얻을 것입니다
  lexicon: reuiuisco
  rationale: 미래형의 부활/소생 선언을 살리기 위해 단순한 ‘다시 살다’보다 ‘다시 살아날 것입니다’를 택했습니다.
- source_word: iustorum nomen apparebit
  english_pob_choice: the name of the righteous will appear
  chosen_korean: 의인들의 이름이 드러나고
  alternatives_korean:
  - 의인들의 이름이 나타나고
  - 의인들의 이름이 나타날 것입니다
  lexicon: iustus
  rationale: apparebit의 ‘드러나다/나타나다’ 뉘앙스를 살리되, 문맥상 심판적 공개를 분명히 하기 위해 ‘드러나고’로 옮겼습니다.
- source_word: impiorum facta ostendentur
  english_pob_choice: the deeds of the ungodly will be disclosed
  chosen_korean: 불의한 자들의 행위가 밝혀질 것입니다
  alternatives_korean:
  - 경건하지 않은 자들의 행위가 드러날 것입니다
  - 악인들의 행위가 드러날 것입니다
  lexicon: impius
  rationale: impiorum을 단순 도덕적 ‘악인’보다 하나님께 불경한 상태를 드러내는 ‘불의한 자들’로 옮겼고, ostendentur는 공개·폭로의 뜻을 따라 ‘밝혀질 것입니다’로 처리했습니다.
- source_word: Ad me autem nemo accedat nunc, neque
  english_pob_choice: But let no one come near me now, nor
  chosen_korean: 그러나 지금은 아무도 내게 가까이 오지 마십시오, 또
  alternatives_korean:
  - 하지만 지금은 아무도 내게 가까이 오지 마십시오, 그리고
  - 그러나 지금은 아무도 내게 다가오지 마십시오, 또
  lexicon: accedo
  rationale: 중단된 라틴어 문장을 그대로 드러내기 위해 종결을 매끄럽게 완결하지 않고 ‘또’로 남겨, 뒤에 이어질 문장이 끊긴 상태를 반영했습니다.
theological_decisions:
- issue: 부활 진술과 심판적 공개의 병치
  chosen_reading: ‘우리는 다시 살아날 것입니다’와 이어지는 이름·행위의 공개를 함께 살려, 개인적 위로보다 최후의 드러남을 강조했습니다.
  alternative_readings:
  - ‘우리는 다시 살 것입니다’로 더 일반화
  - 심판적 공개를 완화해 서술
  rationale: 라틴어 원문과 POB 영어가 모두 부활 선언 뒤에 의인/불의한 자의 공개를 연결하므로, 두 요소의 긴장을 유지하는 것이 소스에 충실합니다.
  doctrine_reference: 종말론적 부활과 심판의 공개성
