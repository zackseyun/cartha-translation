  source_fidelity: 수정이 필요합니다. `saeculo ab initio`는 ‘세상의 시작부터’가 적절하나, 라틴어에 없는 ‘지금까지’를 보태지 않는 편이 좋습니다. `spiritum sanctum`에는 소유격이 없으므로 ‘주의 성령’보다 ‘성령’이 원문에 더 가깝습니다. `enim`의 설명적 연결은 ‘그러니’로 자연스럽게 반영할 수 있습니다.
  naturalness: 현 번역은 대체로 자연스럽지만, ‘참으로 제가 주 앞에서’는 기도문으로 다소 어색합니다. ‘그러니 제가 주님 앞에서’가 현대 한국어 합쇼체의 문맥과 호칭에 더 자연스럽습니다. 또한 목적절은 ‘그렇게 하면’보다 ‘사람들이 … 할 수 있도록’으로 직접 연결하는 편이 낫습니다.
  terminology: ‘성령’, ‘은총’, ‘율법’은 적절합니다. 다만 원문에 없는 ‘주의’를 ‘성령’에 붙이지 않았습니다. `semita`의 비유를 살린 ‘길’도 적절합니다.
