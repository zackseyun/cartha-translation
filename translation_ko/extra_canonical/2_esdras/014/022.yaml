  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/022.yaml
  text: or the things that are about to happen[a]. For if I have found favor before you, send the Holy Spirit into me, and I will write everything that has happened in the world from the beginning, the things that were written in your law, so that men may be able to find the path[c][b], and that those who wish
  footnotes:
  - marker: a
    text: Or 'send the Holy Spirit into me'.
