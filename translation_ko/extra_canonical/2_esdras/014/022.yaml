translation:
  language: ko
  text: 또는 앞으로 일어날 것들입니다. 그러니 제가 주님 앞에서 은총을 얻었다면, 성령을 제 안으로 보내 주십시오[a]. 그러면 저는 세상의 시작부터 일어난 모든 것, 곧 주의 율법에 기록되어 있던 것들을 기록하겠습니다[b]. 사람들이 길을 찾을 수 있도록 하며, 또 원하는 이들은…[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘성령을 제 안에 보내 주십시오’.
    reason: '`in me`의 목적지 표현을 ‘제 안으로’ 또는 ‘제 안에’로 옮길 수 있음을 밝힙니다.'
  - marker: b
    text: 또는 ‘시대’.
    reason: '`saeculo`는 문맥상 ‘세상’으로 옮겼으나, ‘시대’라는 번역 가능성도 있습니다.'
  - marker: c
    text: 또는 ‘그러나 만일’.
    reason: '`Si enim`의 접속 연결을 대조적으로 이해하는 이전 번역 가능성을 기록합니다.'
lexical_decisions:
- source_word: facta sunt uel quae incipient operari
  english_pob_choice: or the things that are about to happen
  chosen_korean: 또는 앞으로 일어날 것들입니다
  alternatives_korean:
  - 또는 앞으로 행해질 일들입니다
  - 또는 이제 시작되어 일어날 것들입니다
  lexicon: saeculum / future-event clause
  rationale: 라틴어가 단순한 완료 사건이 아니라 ‘앞으로 일어날 일들’이라는 대비를 이루므로, 한국어도 사건의 발생을 자연스럽게 드러내는 표현으로 옮겼습니다.
- source_word: Si enim inueni gratiam coram te
  english_pob_choice: For if I have found favor before you
  chosen_korean: 참으로 제가 주 앞에서 은총을 얻었다면
  alternatives_korean:
  - 그러므로 제가 주 앞에서 은총을 얻었다면
  - 만일 제가 주께 은총을 얻었다면
  lexicon: gratia coram te
  rationale: enim의 설명적·이유적 기능을 살려 ‘참으로/for if’의 흐름을 유지했고, coram te는 직역보다 자연스러운 경어 표현인 ‘주 앞에서’로 옮겼습니다.
- source_word: inmitte in me spiritum sanctum
  english_pob_choice: send the Holy Spirit into me
  chosen_korean: 주의 성령을 제 안에 보내 주십시오
  alternatives_korean:
  - 거룩한 영을 제 안에 보내 주십시오
  - 성령을 제 안에 보내 주십시오
  lexicon: spiritus sanctus
  rationale: 문맥상 하나님의 영을 가리키므로 ‘성령’이 적절하지만, 라틴어는 소문자 표기라 직역보다 ‘주의 성령’으로 관계를 분명히 했습니다.
- source_word: ut possint homines inuenire semitam
  english_pob_choice: so that men may be able to find the path
  chosen_korean: 그렇게 하면 사람들은 길을 찾을 수 있을 것이며
  alternatives_korean:
  - 그리하여 사람들이 길을 발견할 수 있을 것이며
  - 그래서 사람들은 길을 찾을 수 있을 것이며
  lexicon: semita
  rationale: semita의 핵심은 추상적 원리보다 실제로 따라갈 ‘길’이므로, 한국어에서도 구체적 이미지를 유지했습니다.
theological_decisions:
- issue: 성령을 청하는 기도문에서의 호칭과 경어
  chosen_reading: ‘주의 성령을 제 안에 보내 주십시오’로, 직접 청원형의 공손한 기도체를 유지했습니다.
  alternative_readings:
  - ‘성령을 내 안에 보내 주십시오’
  - ‘거룩한 영을 내게 보내 주십시오’
  rationale: 본문은 하나님께 직접 청하는 간구이므로, 한국어 합쇼체를 유지하면서도 대상의 거룩성을 분명히 했습니다.
  doctrine_reference: 기도체의 경어 유지와 성령의 인격적 사역 강조
- issue: saeculo ab initio의 의미
  chosen_reading: ‘세상 시작부터 지금까지’로 옮겨, 역사 전체의 범위를 드러냈습니다.
  alternative_readings:
  - ‘시대 시작부터’
  - ‘한 세대부터’
  rationale: 이 구문은 종말론적 ‘시대’보다 창조로부터 이어진 역사 전체를 가리키므로, 세계사적 범위를 드러내는 번역이 더 적합합니다.
  doctrine_reference: 창조부터 현재까지의 계시-역사적 범위
