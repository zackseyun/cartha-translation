  yaml_path: translation/extra_canonical/2_esdras/014/030.yaml
  text: And you transgressed after them. And the land was given to you in the land of Zion[a], but both you and your fathers committed iniquity and did not keep the ways that the Most High commanded you.
  footnotes:
  - marker: a
    text: Or 'but you and your fathers committed iniquity'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들을 따라 너희도 범법하였습니다. 그리고 시온 땅 안에서 너희에게 땅이 주어졌으나, 너희와 너희 조상들 둘 다 불의를 저질렀고, 지극히 높으신 분께서 너희에게 명하신 길들을 지키지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et uos post eos transgressi estis
  english_pob_choice: And you transgressed after them.
  chosen_korean: 그들을 따라 너희도 범법하였습니다.
  alternatives_korean:
  - 너희는 그들을 따라 범죄하였습니다.
  - 너희도 그들 뒤를 따라 어기셨습니다.
  lexicon: transgressi estis
  rationale: 라틴어 transgressi estis는 단순한 실수보다 언약을 어기는 ‘범법/위반’의 의미가 강하므로, 현대 문어체에서 그 긴장을 살린 ‘범법하였습니다’를 택했습니다.
- source_word: terra in ... Sion
  english_pob_choice: the land was given to you in the land of Zion
  chosen_korean: 시온 땅에서 너희에게 땅이 주어졌으나
  alternatives_korean:
  - 시온 땅이 너희에게 주어졌으나
  - 시온 땅 안에서 땅이 너희에게 주어졌으나
  lexicon: terra / Sion
  rationale: 원문의 반복적 표현을 지나치게 풀지 않고, POB의 ‘land of Zion’을 살려 시온과 연결된 언약적 땅의 수여를 간결하게 옮겼습니다.
- source_word: et uos et patres uestri ... iniquitatem fecistis
  english_pob_choice: but both you and your fathers committed iniquity
  chosen_korean: 너희와 너희 조상들 둘 다 불의를 저질렀고
  alternatives_korean:
  - 너희와 너희 조상들도 불의를 저질렀고
  - 너희와 너희 조상들 둘 다 죄악을 행하였고
  lexicon: et ... et / iniquitatem fecistis
  rationale: double et의 상호 대응을 살려 ‘둘 다’를 유지했고, iniquitatem은 단순한 ‘죄’보다 행위의 불법성과 왜곡을 드러내는 ‘불의’로 옮겼습니다.
- source_word: et non seruastis uias quas mandauit uobis Altissimus
  english_pob_choice: and did not keep the ways that the Most High commanded you.
  chosen_korean: 지극히 높으신 이께서 너희에게 명하신 길들을 지키지 않았습니다.
  alternatives_korean:
  - 지극히 높으신 분께서 너희에게 명하신 길들을 지키지 않았습니다.
  - 지극히 높으신 이가 너희에게 명령하신 길을 지키지 않았습니다.
  lexicon: Altissimus / uias
  rationale: Altissimus는 신적 호칭을 살려 ‘지극히 높으신 이’로 옮겼고, uias는 단순 규정이 아니라 삶의 방식까지 포함하는 ‘길들’로 번역했습니다.
theological_decisions:
- issue: 공동체적·세대적 책임의 강조
  chosen_reading: ‘너희와 너희 조상들 둘 다’로 옮겨, 현재 세대와 선대가 함께 불의를 저질렀다는 라틴어의 이중 결합을 드러냈습니다.
  alternative_readings:
  - ‘너희와 너희 조상들도’로 완화
  - 세대적 책임을 따로 드러내지 않음
  rationale: 개정판에서 보강된 correlative construction의 힘을 유지해야 본문이 전달하는 집단적, 세대적 유죄 선언이 약화되지 않습니다.
  doctrine_reference: 언약 공동체의 연속성과 세대 간 책임이라는 성경적 주제
- issue: ‘지극히 높으신 이’의 호칭 유지
  chosen_reading: Most High를 ‘지극히 높으신 이’로 번역해 신적 호칭의 엄숙함을 유지했습니다.
  alternative_readings:
  - ‘지극히 높으신 분’
  - ‘가장 높으신 하나님’
  rationale: 본문은 하나님의 초월적 호칭을 사용하므로, 친숙한 교회어보다 원문의 위계를 드러내는 표현이 적절합니다.
  doctrine_reference: 하나님의 지극히 높으심과 언약적 명령의 권위
