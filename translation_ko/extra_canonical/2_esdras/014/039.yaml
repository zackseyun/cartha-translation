  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/039.yaml
  text: Something like water was being offered to me[a], but its color was like fire.
  footnotes:
  - marker: a
    text: Or 'This was full as with water, but its color was like fire.'.
    reason: previous_rendering
translation:
  language: ko
  text: 무언가가 제게 내밀어지고 있었는데, 그것은 물 같은 것으로 가득 차 있었지만 그 색깔은 불 같았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: porrigebatur ... mili
  english_pob_choice: Something like water was being offered to me
  chosen_korean: “물 같은 것이 제게 내밀리고 있었습니다”
  alternatives_korean:
  - “물 같은 것이 제게 주어지고 있었습니다”
  - “물 같은 것이 제게 펼쳐지고 있었습니다”
  lexicon: porrigo / dative of recipient
  rationale: porrigebatur는 단순한 ‘있다’보다 손을 뻗어 ‘내미는/내어 보이는’ 동작을 담고 있고, mili는 ‘나에게’라는 수여 대상을 분명히 하므로 이를 살려 옮겼습니다.
- source_word: plenum sicut aqua
  english_pob_choice: full of something like water
  chosen_korean: “물 같은 것이”
  alternatives_korean:
  - “물처럼 보이는 것으로 가득 찬”
  - “물과 비슷한 것으로 가득한”
  lexicon: plenus + sicut
  rationale: sicut aqua는 물과 동일하다는 뜻이 아니라 물과 닮은 무엇임을 나타내므로, ‘물 같은 것’으로 비교 관계를 보존했습니다.
- source_word: color autem ... sicut fire
  english_pob_choice: but its color was like fire
  chosen_korean: “그 색깔은 불 같았습니다”
  alternatives_korean:
  - “그 색깔은 불처럼 보였습니다”
  - “그 빛깔은 불과 같았습니다”
  lexicon: color / similitudo
  rationale: color는 단순한 시각적 ‘색’이므로 ‘색깔’로 옮겼고, sicut fire의 비유를 직설적으로 유지했습니다.
