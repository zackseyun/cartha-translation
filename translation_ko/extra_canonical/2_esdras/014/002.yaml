    issue: ‘그가’의 선행사가 불명확하고 음성을 남성 인칭으로 받는 듯하게 들립니다.
    rationale: 라틴어는 uox를 선행사로 하여 다시 dixit이라고 합니다. 한국어에서는 ‘그 음성이’라고 되받는 것이 원문의 의인화된 서술을 보존하면서도 명확합니다.
  - severity: low
    issue: ‘내 발로 일어섰고’가 다소 직역투입니다.
    rationale: surrexi super pedes meos의 ‘일어나 두 발로 섰다’는 동작과 강조를 유지하면서 현대 한국어 문장으로 더 자연스럽습니다.
