source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et ecce uox exiuit contra me de rubo et dixit : Ezra, Ezra ! et dixi: ecce ego, domine. et surrexi super pedes meos, et dixit ad me:'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/002.yaml
  text: 'And behold, a voice came to me from a bush and said, “Ezra, Ezra!” And I said, “Here I am, Lord.” And I stood on my feet, and it said to me:'
translation:
  language: ko
  text: 보십시오, 떨기나무에서 한 음성이 내게 와서 말했습니다. “에스라, 에스라!” 내가 말했습니다. “제가 여기 있습니다, 주님.” 그리고 나는 내 발로 일어섰고, 그가 내게 말했습니다:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Latin exiuit는 문자적으로는 ‘밖으로 나가다’이지만, 이 구절에서는 음성이 에스라에게 ‘다가왔다’는 흐름으로 이해하는 편이 영어 POB와 라틴어 문맥 모두에 더 자연스럽습니다.
    reason: source_note
lexical_decisions:
- source_word: uox exiuit ... de rubo
  english_pob_choice: a voice came to me from a bush
  chosen_korean: “떨기나무에서 한 음성이 내게 와서”
  alternatives_korean:
  - “덤불에서 한 음성이 내게 와서”
  - “떨기에서 음성이 나와”
  lexicon: uox / rubus
  rationale: Latin의 exiuit는 단순한 ‘나오다’보다 화자가 에스라에게 ‘다가온다’는 방향성을 드러내므로 영어 POB의 came to me를 따라 자연스럽게 옮겼고, rubo는 성서적 맥락에서 통용되는 떨기나무로 번역했습니다.
- source_word: Ezra, Ezra!
  english_pob_choice: “Ezra, Ezra!”
  chosen_korean: “에스라, 에스라!”
  alternatives_korean:
  - “에즈라, 에즈라!”
  lexicon: Ezra
  rationale: 고유명사는 성서에서 통용되는 에스라를 택해 가독성을 유지했습니다.
- source_word: ecce ego, domine
  english_pob_choice: “Here I am, Lord.”
  chosen_korean: “제가 여기 있습니다, 주님.”
  alternatives_korean:
  - “보십시오, 제가 있습니다, 주님.”
  - “여기 있습니다, 주님.”
  lexicon: ecce / domine
  rationale: ecce의 주목 촉구는 이미 앞의 보십시오로 처리했고, ego는 문맥상 응답자의 존재 확인이므로 ‘제가 여기 있습니다’로 옮겼습니다. domine는 라틴어 호격을 반영해 주님으로 번역했습니다.
- source_word: surrexi super pedes meos
  english_pob_choice: I stood on my feet
  chosen_korean: “나는 내 발로 일어섰고”
  alternatives_korean:
  - “나는 두 발로 섰고”
  - “나는 일어나 내 발로 섰고”
  lexicon: surrexi / pedes
  rationale: surrexi는 단순히 ‘서다’보다 일어서다의 동작을 포함하므로 ‘일어섰고’로 옮겨 연속 동작을 살렸습니다.
theological_decisions:
- issue: 호격 domine의 한국어 존칭 수준
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 주여
  rationale: 비록 라틴어 본문은 단순 호격이지만, 에스라의 응답으로서 하나님께 드리는 직접 호칭이므로 현대 한국어 성서 문체에 맞는 주님을 사용했습니다.
  doctrine_reference: 성경 내 기도·호칭 관례
