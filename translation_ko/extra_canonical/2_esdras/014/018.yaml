id: 2ES.14.18
reference: 2 Esdras 14:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et respondi et dixi coram te, domine, Ecce enim ego abibo,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/018.yaml
  text: Then I answered and said before you[a], Lord, "Behold, I will go,"
  footnotes:
  - marker: a
    text: Or 'Then I answered and said before you, Lord,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때 제가 대답하여 주님 앞에서 말했습니다. 「보십시오, 제가 가겠습니다」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et respondi et dixi
  english_pob_choice: Then I answered and said
  chosen_korean: 그때 제가 대답하여 말했습니다
  alternatives_korean:
  - 그때 제가 대답하고 말했습니다
  - 제가 대답하여 말했습니다
  lexicon: respondere / dicere
  rationale: 라틴어의 두 동사 연쇄를 자연스러운 한국어로 옮기되, 원문의 응답-발화 순서를 살려 ‘대답하여 말했습니다’로 간결하게 처리했습니다.
- source_word: coram te, domine
  english_pob_choice: before you, Lord
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 주님 앞에
  - 주님께
  lexicon: coram + dominus
  rationale: coram te의 ‘~앞에서’라는 대면성을 살려, 단순 수신격보다 공개적/직면적 상황을 드러내는 표현을 택했습니다.
- source_word: Ecce enim ego abibo
  english_pob_choice: Behold, I will go
  chosen_korean: 「보십시오, 제가 가겠습니다」
  alternatives_korean:
  - 「보라, 내가 가겠습니다」
  - 「보십시오, 제가 떠나겠습니다」
  lexicon: ecce + abibo
  rationale: ecce는 청자의 주의를 끄는 감탄사로 ‘보십시오’를, abibo는 단순 ‘가다’보다 떠나 움직이는 결을 지니지만 문맥상 과도한 해석을 피하여 ‘가겠습니다’로 옮겼습니다.
theological_decisions:
- issue: 직접화법의 한국어 경어 수준
  chosen_reading: 화자는 주님께 직접 말하는 장면이므로 본문 서술은 합쇼체를 유지하고, 인용문 내부도 화자의 자기진술로서 평서형 약속 표현을 사용했습니다.
  alternative_readings:
  - 인용문 안에서도 더 높임말을 강화하는 방식
  - 문장 전체를 서술형으로 평평하게 처리하는 방식
  rationale: 원문이 보이는 화행 구조를 살리면서도 한국어 문체의 자연스러움을 유지하기 위한 선택입니다.
  doctrine_reference: 문체·화행 보존 원칙
- issue: 역분절 보정
  chosen_reading: ‘보십시오, 제가 가겠습니다’는 영어 POB와 달리 18절 안에 포함된 ecce enim ego abibo를 현재 절에서 분명히 드러냅니다.
  alternative_readings:
  - 해당 구를 19절로 넘기는 방식
  - 아예 생략하는 방식
  rationale: 제공된 개정 이력에서 지적된 절 경계를 반영하여, 이 절의 라틴어 원문에 있는 말이 이 절 안에서 완결되도록 처리했습니다.
  doctrine_reference: 구절 경계 일치 원칙
