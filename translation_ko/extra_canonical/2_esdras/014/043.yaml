id: 2ES.14.43
reference: 2 Esdras 14:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'XL diebus : ipsi autem per diem scribebant Et nocte manducabant panem : ego autem per diem loquebar et nocte non'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/043.yaml
  text: They wrote by day, but at night they ate bread. As for me, I spoke by day, and at night I was not silent.
translation:
  language: ko
  text: 사십 일 동안 그들은 낮에는 기록하고 밤에는 빵을 먹었습니다. 그러나 저는 낮에는 말하고 밤에는 잠잠하지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: scribebant
  english_pob_choice: They wrote by day
  chosen_korean: 그들은 낮에 글을 썼고
  alternatives_korean:
  - 그들은 낮에 기록했고
  - 그들은 낮에 적었고
  lexicon: scribo
  rationale: 문맥상 지속적 기록 행위를 자연스럽게 드러내기 위해 ‘글을 썼다’를 택했습니다.
- source_word: manducabant panem
  english_pob_choice: they ate bread
  chosen_korean: 밤에는 빵을 먹었습니다
  alternatives_korean:
  - 밤에는 빵을 먹었고
  - 밤에는 음식을 먹었습니다
  lexicon: manduco + panis
  rationale: 직역에 가깝게 ‘빵을 먹다’로 옮겨, 평범한 식사를 가리키는 표현을 유지했습니다.
- source_word: loquebar
  english_pob_choice: I spoke by day
  chosen_korean: 저는 낮에 말했고
  alternatives_korean:
  - 저는 낮에 말하였고
  - 저는 낮에 이야기했고
  lexicon: loquor
  rationale: 화자의 지속적 발화를 간결하게 드러내는 기본형 ‘말하다’가 가장 직접적입니다.
- source_word: non
  english_pob_choice: I was not silent
  chosen_korean: 잠잠하지 않았습니다
  alternatives_korean:
  - 침묵하지 않았습니다
  - 말을 멈추지 않았습니다
  lexicon: non + taceo (sense as reflected in POB English)
  rationale: 라틴어 원문의 부정은 단순한 ‘말하지 않음’보다 ‘침묵하지 않음’의 대조를 살려, POB 영어의 감각을 유지했습니다.
theological_decisions:
- issue: 낮/밤의 대조를 통한 반복적 노동과 증언의 대비
  chosen_reading: ‘그들은 낮에 글을 쓰고 밤에 먹었으며, 저는 낮에 말하고 밤에는 잠잠하지 않았다’로 대조 구조를 살렸습니다.
  alternative_readings:
  - 시간 부사를 앞에 모아 평탄하게 번역하는 방식
  - 의미를 풀어 ‘낮에는 일하고 밤에는 식사했다’로 의역하는 방식
  rationale: 본문의 병렬과 대비가 핵심이므로, 시간 부사와 행위를 반복 배치해 리듬과 대비를 보존했습니다.
  doctrine_reference: source-level rhetorical parallelism
- issue: ‘잠잠하지 않았다’의 표현 강도
  chosen_reading: ‘밤에는 잠잠하지 않았습니다’로 소극적 침묵 부정의 표현을 유지했습니다.
  alternative_readings:
  - ‘밤에도 계속 말했습니다’
  - ‘밤에는 쉬지 않고 말했습니다’
  rationale: 원문의 부정형은 단순한 지속이 아니라 침묵의 부재를 말하므로, 이를 직접적으로 드러내는 번역이 더 충실합니다.
  doctrine_reference: source-level negation and emphasis
