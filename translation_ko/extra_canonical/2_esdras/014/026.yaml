translation:
  language: ko
  text: “그것들을 다 마치면, 어떤 것은 공개할 것이고 어떤 것은 지혜로운 이들에게 비밀리에 넘겨줄 것입니다. 이는 내일 이맘때에 당신이 쓰기 시작할 것이기 때문입니다.” 그리고 나는 그가 내게 명령한 대로 떠나가서, 모든 …을 모았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그것들을 마치고 나면, 어떤 것은 공개할 것이고 어떤 것은 지혜로운 이들에게 비밀리에 넘겨줄 것입니다. 내일 이맘때에”라고 옮길 수 있습니다.
    reason: 영어 POB 감사 기록의 previous_rendering 대안을 반영합니다. 이 대안은 문장 첫머리의 접속 표현과 enim의 설명적 연결을 달리 처리한 이전 번역을 나타냅니다.
lexical_decisions:
- source_word: cum perfeceris
  english_pob_choice: When you have completed them
  chosen_korean: 그것들을 마치면
  alternatives_korean:
  - 그것들을 완성하시면
  - 그것들을 끝내면
  lexicon: cum + 완료 동사구
  rationale: temporal 조건절의 완료 뉘앙스를 살리되, 합쇼체 문맥에서 자연스럽고 간결하게 옮겼습니다.
- source_word: palam facies
  english_pob_choice: you shall make public
  chosen_korean: 공개하고
  alternatives_korean:
  - 드러내고
  - 공적으로 밝히고
  lexicon: palam facere
  rationale: palam의 ‘드러내다/공개하다’ 의미를 직접 반영해, 단순히 널리 알린다는 정도보다 공적 공개를 분명히 했습니다.
- source_word: sapientibus absconse trades
  english_pob_choice: you shall hand over in secret to the wise
  chosen_korean: 지혜로운 이들에게 비밀리에 넘기십시오
  alternatives_korean:
  - 지혜로운 자들에게 몰래 전하십시오
  - 현자들에게 은밀히 넘기십시오
  lexicon: sapientes + absconse tradere
  rationale: sapientibus를 ‘지혜로운 이들’로 옮겨 대상의 성격을 유지하고, absconse tradere의 은밀한 전달을 ‘비밀리에 넘기다’로 살렸습니다.
- source_word: in crastinum enim hac hora
  english_pob_choice: For tomorrow at this hour
  chosen_korean: 왜냐하면 내일 이맘때에
  alternatives_korean:
  - 내일 이 시각에
  - 내일 바로 이 시간에
  lexicon: in crastinum + hac hora + enim
  rationale: enim의 설명적 연결을 ‘왜냐하면’으로 드러내고, hac hora를 ‘이맘때’로 자연스럽게 재현했습니다.
theological_decisions:
- issue: 명령문과 직접화법의 존대 수준
  chosen_reading: 직접 요청/명령인 부분을 합쇼체로 유지해, 발화의 권위를 살리면서도 한국어 독자에게 자연스럽게 읽히도록 했습니다.
  alternative_readings:
  - 명령형 평서체
  - 더 강한 성경체 어미
  rationale: 라틴 원문의 명령 연쇄(cum perfeceris… facies… trades… incipies)는 단호한 지시이므로, 현대 표준어 합쇼체의 명령/청유형으로 대응하는 것이 적절합니다.
  doctrine_reference: 문체·화행 보존
