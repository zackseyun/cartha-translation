revisions:
- from: 그것들을 마치면, 어떤 것은 공개하고 어떤 것은 지혜로운 이들에게 비밀리에 넘기십시오. 왜냐하면 내일 이맘때에 당신은 쓰기 시작할 것이기 때문입니다." 그리고 나는 그가 내게 명령한 대로 가서, 모든 것을 모았습니다.[a]
  to: “그것들을 다 마치면, 어떤 것은 공개할 것이고 어떤 것은 지혜로운 이들에게 비밀리에 넘겨줄 것입니다. 이는 내일 이맘때에 당신이 쓰기 시작할 것이기 때문입니다.” 그리고 나는 그가 내게 명령한 대로 떠나가서, 모든 …을 모았습니다.[a]
  rationale: 미래형을 미래 서술로 바로잡고, 떠남의 의미를 명시했으며, 제시된 원문이 절단된 끝부분은 임의 보충 없이 말줄임으로 처리했습니다. 직접화법의 닫는 따옴표도 ‘쓰기 시작할 것입니다’ 뒤에 배치했습니다.
