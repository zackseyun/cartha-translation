lexical_decisions:
- source_word: Superant
  english_pob_choice: remain
  chosen_korean: 남아 있습니다
  alternatives_korean:
  - 남습니다
  - 남아 있습니다
  lexicon: —
  rationale: 라틴어 superant의 핵심은 ‘남다’이며, 현재형으로 남아 있는 상태를 자연스럽게 나타내기 위해 ‘남아 있습니다’로 옮겼습니다.
- source_word: eius
  english_pob_choice: of its
  chosen_korean: 그 가운데
  alternatives_korean:
  - 그것의
  - 그것의 몫이
  lexicon: —
  rationale: eius는 직전 절의 ‘그것/그것의 것(=연대, age)’을 가리키므로, 한국어에서는 소유격을 지나치게 반복하기보다 문맥상 연결을 드러내는 ‘그 가운데’로 처리했습니다.
- source_word: duae ... partes
  english_pob_choice: two ... parts
  chosen_korean: 두 몫
  alternatives_korean:
  - 두 부분
  - 두 몫의
  - 두 조각
  lexicon: —
  rationale: parts는 여기서 수학적/분할적 단위이므로, 한국어에서는 분할된 몫을 뜻하는 ‘몫’이 의미를 가장 정확하게 전달합니다.
- source_word: post medium decimae partis
  english_pob_choice: after the middle of the tenth part
  chosen_korean: 열 번째 몫의 가운데 이후
  alternatives_korean:
  - 열째 몫의 중간 이후
  - 열 부분의 가운데 뒤
  lexicon: —
  rationale: post medium decimae partis의 구조를 가능한 한 유지해 ‘열 번째 몫의 가운데 이후’로 옮겨, 분할된 비율과 위치 관계를 드러냈습니다.
theological_decisions:
