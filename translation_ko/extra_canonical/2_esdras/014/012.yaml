  alternative_readings:
  - 더 매끄러운 의역으로 ‘절반쯤 남아 있습니다’
  - 전통적 종말론 용어로 풀어 쓰기
  rationale: 본문은 우주/세대의 분할을 수량적으로 말하는 라틴어 표현이므로, 의미를 평이하게 바꾸기보다 분할 구조를 보존하는 쪽이 저자의 의도를 더 잘 드러냅니다.
