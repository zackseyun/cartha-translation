id: 2ES.14.9
reference: 2 Esdras 14:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Tu enim reciperis ab hominibus, et conuerteris residuum cum filio meo et cum similibus tuis usquequo finiantur tempora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/009.yaml
  text: For you will be taken up from among men[a], and you will remain with my son and with those like you until the times are finished.
  footnotes:
  - marker: a
    text: Or 'and you will dwell with my son'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 너는 사람들 가운데서 데려가질 것이며, 내 아들과 너와 같은 이들과 함께 끝날 때까지 남아 있을 것이다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 아들과 함께 머물게 될 것이다’.
    reason: previous_rendering
lexical_decisions:
- source_word: Tu enim reciperis ab hominibus
  english_pob_choice: For you will be taken up from among men
  chosen_korean: 사람들 가운데서 데려가질 것이며
  alternatives_korean:
  - 사람들 가운데서 받아들여질 것이며
  - 사람들 가운데서 취해질 것이며
  lexicon: reciperis
  rationale: 라틴어 reciperis는 단순한 이동보다 ‘사람들 가운데서 데려가짐/받아들여짐’의 수동적 뉘앙스를 가지므로, 문맥상 자연스러운 ‘데려가질 것이다’를 택했습니다.
- source_word: conuerteris residuum
  english_pob_choice: and you will remain
  chosen_korean: 남아 있을 것이다
  alternatives_korean:
  - 머물게 될 것이다
  - 그 나머지 기간 동안 함께 있게 될 것이다
  lexicon: conuerteris residuum
  rationale: adjudication이 지적한 residuum의 ‘남은 기간/나머지’ 의미를 반영하되, 본문에 없는 해석어를 덧붙이지 않기 위해 간결하게 ‘남아 있을 것이다’로 옮겼습니다.
- source_word: cum filio meo et cum similibus tuis
  english_pob_choice: with my son and with those like you
  chosen_korean: 내 아들과 너와 같은 이들과 함께
  alternatives_korean:
  - 내 아들과 너와 비슷한 이들과 함께
  - 내 아들과 너와 같은 자들과 함께
  lexicon: cum filio meo et cum similibus tuis
  rationale: similibus tuis는 단순한 외형 유사성보다 ‘너와 같은 부류/성격의 이들’을 뜻하므로, 현대 한국어에서 자연스럽고 위계적 오해가 덜한 ‘너와 같은 이들’을 선택했습니다.
- source_word: usquequo finiantur tempora
  english_pob_choice: until the times are finished
  chosen_korean: 끝날 때까지
  alternatives_korean:
  - 시대들이 끝날 때까지
  - 정해진 때가 끝날 때까지
  lexicon: usquequo finiantur tempora
  rationale: tempora는 복수형이지만 한국어에서는 문맥상 ‘때’로 자연스럽게 통합하여, 종말론적 종결을 드러내는 ‘끝날 때까지’로 옮겼습니다.
theological_decisions:
- issue: 에스라의 미래 거처를 ‘머무름’으로 표현할지
  chosen_reading: 본문의 핵심은 에스라가 사람들 가운데서 제거된 뒤 메시아와 그의 동류들과 함께 남아 있게 된다는 점이므로, 과도한 공간적 상상 없이 지속 상태를 나타내는 표현을 사용했습니다.
  alternative_readings:
  - ‘살게 될 것이다’로 보다 거주적 뉘앙스를 주는 읽기
  - ‘동거하게 될 것이다’로 더 강한 공동체성을 주는 읽기
  rationale: 라틴어 conuerteris residuum은 ‘남은 기간 동안’의 지속성을 담지만, 본문이 특정 장소를 말하지는 않으므로 ‘남아 있다’가 가장 절제된 대응입니다.
  doctrine_reference: 문맥 해석(종말론적 지속 상태)
