  text: apertum est os meum et non est clausum amplius. Altissimus autem dedit intellectum quinque uiris, et scripserunt quae dicebantur ex successione notis quas non sciebant, et sederunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/042.yaml
  text: And the Most High gave understanding to the five men[a], and they wrote in succession the things that were spoken, in characters that they did not know[b]. And they sat there forty days.
  footnotes:
  - marker: a
    text: The phrase 'in characters that they did not know' may refer to unfamiliar script-signs, shorthand, or divinely enabled writing forms; the Latin alone does not specify further.
    reason: lexical_alternative
    anchor_ref: '14:42'
  - marker: b
    text: Or 'in order'.
    reason: previous_rendering
translation:
  language: ko
  text: 내 입이 열렸고 더 이상 닫히지 않았습니다. 그러나 지극히 높으신 분께서 다섯 사람에게 이해력을 주셨습니다. 그들은 자기들이 알지 못하는 표지들[a]로 말해지는 것들을 차례로[b] 기록하였고, 앉아 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘표지들’은 낯선 문자, 속기 기호, 또는 신적 도움으로 가능해진 기록 방식일 수 있습니다. 라틴어 본문만으로는 더 구체적으로 정할 수 없습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘번갈아’. 여기서는 기록 내용의 배열보다 다섯 사람이 차례를 이어 기록한 방식을 가리킵니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Altissimus
  rationale: 하나님을 가리키는 최상급 호칭을 직접 살리되, 현대 한국어에서 자연스럽고 경건한 표현으로 옮겼습니다.
- source_word: dedit intellectum
  english_pob_choice: gave understanding
  chosen_korean: 이해력을 주셨습니다
  alternatives_korean:
  - 깨달음을 주셨습니다
  - 이해를 주셨습니다
  lexicon: intellectus
  rationale: 단순한 지적 정보가 아니라 기록을 가능하게 하는 이해/통찰을 뜻하므로 ‘이해력’으로 옮겼습니다.
- source_word: ex successione
  english_pob_choice: in succession
  chosen_korean: 서로 차례로
  alternatives_korean:
  - 차례차례로
  - 번갈아
  lexicon: successio
  rationale: 수정된 본문이 가리키는 것은 글의 배열이 아니라 다섯 사람이 교대로 받아 적는 진행 방식이므로 그 의미를 드러냈습니다.
- source_word: notis quas non sciebant
  english_pob_choice: in characters that they did not know
  chosen_korean: 자신들이 알지 못하던 글자들
  alternatives_korean:
  - 낯선 문자들
  - 그들이 알지 못하던 부호들
  lexicon: notae
  rationale: 라틴어 notae는 문자, 기호, 속기 표지 등 넓은 범위를 가질 수 있으므로, POB 주석의 여지를 살려 문자/부호 가능성을 열어 두는 표현으로 옮겼습니다.
theological_decisions:
- issue: ‘지극히 높으신 분’ 호칭의 신학적 톤
  chosen_reading: 본문의 호칭을 직접적인 신적 칭호로 살려, 인물의 기록 능력이 하나님의 부여에 있음을 분명히 했습니다.
  alternative_readings:
  - 보다 중립적인 ‘가장 높은 분’
  - 전통적 교회어인 ‘지존하신 이’
  rationale: 이 구절은 인간 저술 과정의 기원을 하나님께 돌리는 문맥이므로, 호칭의 위엄과 신적 주권을 분명하게 유지하는 것이 중요합니다.
  doctrine_reference: 섭리와 계시의 기원
