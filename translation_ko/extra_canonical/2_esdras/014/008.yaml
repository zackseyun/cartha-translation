id: 2ES.14.8
reference: 2 Esdras 14:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Signa quae demonstraui, et somnia quae uidisti, et interpretationes quas tu audisti, in corde tuo repone ea;
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/008.yaml
  text: The signs that I have shown[a], and the dreams that you have seen, and the interpretations that you have heard—store them up in your heart.
  footnotes:
  - marker: a
    text: Or 'Store up in your heart the signs that I have shown, and the dreams that you have seen, and the interpretations that you have heard.'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보여 준 표적들과 네가 본 꿈들과 네가 들은 해석들을 네 마음에 간직해 두십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Signa
  english_pob_choice: The signs that I have shown
  chosen_korean: 표적들
  alternatives_korean:
  - 징조들
  - 표시들
  lexicon: signum
  rationale: 라틴어 signa는 단순한 '표시'보다 하나님이 보여 주신 가시적 표징을 가리키므로, 본문 맥락에 맞는 ‘표적들’로 옮겼습니다.
- source_word: demonstraui
  english_pob_choice: I have shown
  chosen_korean: 내가 보여 준
  alternatives_korean:
  - 내가 나타낸
  - 내가 드러낸
  lexicon: demonstrare
  rationale: 발화자 1인칭이 분명하므로 ‘보여 준’으로 직접성을 살렸고, 현재 결과를 강조하는 완료형 뉘앙스를 유지했습니다.
- source_word: in corde tuo repone ea
  english_pob_choice: store them up in your heart
  chosen_korean: 네 마음에 간직해 두십시오
  alternatives_korean:
  - 네 마음속에 저장하십시오
  - 네 마음에 쌓아 두십시오
  lexicon: cor / reponere
  rationale: 라틴어 repone ea는 앞의 세 항목을 다시 받아 ‘간직하다/저장하다’는 뜻을 가지므로, 한국어에서 자연스럽고 내면화의 의미를 살리는 ‘간직해 두십시오’로 옮겼습니다.
theological_decisions:
- issue: 계시 내용의 보존과 내면화
  chosen_reading: 본문의 명령은 단순한 기억이 아니라, 보여 준 표적·꿈·해석을 마음에 간직하여 앞으로의 이해와 분별의 기준으로 삼으라는 요청입니다.
  alternative_readings:
  - 단순 암기 지시
  - 개인적 위안만을 위한 보관
  rationale: 문맥상 세 가지 계시 요소를 마음에 두라는 명령이므로, 내면화와 분별의 기능을 함께 드러내는 번역이 적절합니다.
  doctrine_reference: 계시의 보존과 묵상
- issue: 직접 명령의 높임말
  chosen_reading: 화자에게 직접 주어지는 명령이므로 합쇼체 명령형으로 번역했습니다.
  alternative_readings:
  - 평서형으로 완화
  - 더 고전적인 종결어미 사용
  rationale: 현대 한국어 성경문체의 형식을 따르면서도 원문의 명령성을 유지하기 위한 선택입니다.
  doctrine_reference: 문체 일관성
