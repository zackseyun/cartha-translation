  language: ko
  text: 그리고 셋째 날에, 내가 참나무 아래에 앉아 있었을 때에 이런 일이 일어났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et factum est tertio die
  english_pob_choice: And it happened on the third day
  chosen_korean: 그리고 셋째 날에
  alternatives_korean:
  - 셋째 날에 그렇게 되었습니다
  - 셋째 날에 이 일이 일어났습니다
  lexicon: factum est / tertio die
  rationale: 라틴어 관용구는 사건의 전개를 알리는 서술로 이해하여, 한국어에서는 자연스럽게 시간 부사구와 연결해 간결하게 옮겼습니다.
- source_word: ego
  english_pob_choice: I
  chosen_korean: 나는
  alternatives_korean:
  - 내가
  - 저는
  lexicon: ego
  rationale: 서술 화자의 1인칭을 직접 드러내는 가장 중립적인 표준어로 처리했습니다.
- source_word: sub quercu
  english_pob_choice: under an oak
  chosen_korean: 떡갈나무 아래에
  alternatives_korean:
  - 참나무 아래에
  - 참나무 밑에
  lexicon: sub + quercus
  rationale: quercu는 문맥상 큰 참나무류를 가리키므로, 한국어에서는 자연스럽고 성경적 문체에 무난한 ‘떡갈나무’로 옮겼습니다.
theological_decisions:
- issue: 이 구절의 서술 시제와 사건성
  chosen_reading: 완료된 사건을 알리는 내러티브로 번역했습니다.
  alternative_readings:
  - 과거 진행형을 더 강하게 드러내는 번역
  - 현재적 생동감을 높이는 번역
  rationale: 라틴어 factum est는 단순한 시간표시를 넘어서 사건의 전환을 알리므로, 한국어에서도 서술 진행을 해치지 않는 범위에서 ‘그리고’로 연결해 자연스럽게 처리했습니다.
  doctrine_reference: 문체/서사 처리
- issue: quercus의 식물명 선택
  chosen_reading: 특정 종을 단정하기보다 한국어 성경 문맥에 어울리는 일반적 수목명으로 옮겼습니다.
  alternative_readings:
  - 참나무
  - 상수리나무
  rationale: 원문은 ‘oak’의 일반 지칭이므로, 과도한 종별 확정을 피하면서도 독자가 즉시 이해할 수 있는 표현을 택했습니다.
  doctrine_reference: 번역 관례
