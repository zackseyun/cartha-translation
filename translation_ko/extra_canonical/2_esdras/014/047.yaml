source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tradas eos sapientibus de populo tuo; In his enim est uena intellectus et sapientiae fons et scientiae flumen.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/047.yaml
  text: you may hand them over to the wise among your people. For in them is the vein of understanding[a], the fountain of wisdom, and the river of knowledge.”
  footnotes:
  - marker: a
    text: Or 'For in them is the spring of understanding, the fountain of wisdom, and the river of knowledge.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 백성 가운데 지혜로운 이들에게 그것들을 맡기십시오. 그 안에는 이해의 샘, 지혜의 샘, 지식의 강이 있기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘이해의 샘, 지혜의 샘, 지식의 강’이라고도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: tradas eos
  english_pob_choice: you may hand them over
  chosen_korean: 그것들을 맡기십시오
  alternatives_korean:
  - 그것들을 넘겨주십시오
  - 그것들을 건네주십시오
  - 그것들을 맡기게 하십시오
  lexicon: tradas (2인칭 단수 접속법 현재)
  rationale: 직접적인 ‘건네다’보다, 문맥상 지혜로운 이들에게 맡기는 의미를 살려 자연스럽고 공손한 명령형으로 옮겼습니다.
- source_word: sapientibus de populo tuo
  english_pob_choice: the wise among your people
  chosen_korean: 당신의 백성 가운데 지혜로운 이들에게
  alternatives_korean:
  - 당신의 백성 중 지혜로운 사람들에게
  - 당신 백성의 지혜로운 자들에게
  lexicon: sapientibus / de populo tuo
  rationale: sapientibus는 단순한 ‘현자들’보다 공동체 안의 지혜로운 사람들을 가리키므로 ‘백성 가운데 지혜로운 이들’로 풀었습니다.
- source_word: uena intellectus
  english_pob_choice: the vein of understanding
  chosen_korean: 이해의 샘
  alternatives_korean:
  - 이해의 혈관
  - 이해의 맥
  - 이해의 맥줄
  lexicon: uena
  rationale: POB의 최신 감수는 vena를 ‘vein’으로 바로잡았지만, 한국어에서는 그대로 ‘혈관’이라기보다 지식과 생명력이 흘러나오는 이미지인 ‘샘’이 수사적으로 더 자연스럽습니다.
- source_word: sapientiae fons et scientiae flumen
  english_pob_choice: the fountain of wisdom, and the river of knowledge
  chosen_korean: 지혜의 샘, 지식의 강
  alternatives_korean:
  - 지혜의 샘, 지식의 시내
  - 지혜의 원천, 지식의 강
  lexicon: fons / flumen
  rationale: fons와 flumen의 병렬 이미지를 살려 ‘샘’과 ‘강’으로 대응시켰고, scientiae는 문맥상 추상적 ‘앎’보다 ‘지식’이 더 직접적입니다.
theological_decisions:
- issue: 수사적 이미지의 보존
  chosen_reading: ‘이해의 샘, 지혜의 샘, 지식의 강’처럼 연속된 원천-흐름 이미지를 그대로 살렸습니다.
  alternative_readings:
  - ‘이해의 혈관, 지혜의 샘, 지식의 강’
  - ‘이해의 원천, 지혜의 샘, 지식의 강’
  rationale: 라틴어 본문의 비유적 축적을 한국어에서도 유지하는 것이 핵심이므로, 지나치게 해부학적이거나 설명적인 표현은 피했습니다.
  doctrine_reference: 문학적 이미지 보존 원칙
- issue: 명령형의 공손성
  chosen_reading: ‘맡기십시오’로 현대 한국어 합쇼체의 직접 명령을 사용했습니다.
  alternative_readings:
  - ‘맡겨도 됩니다’
  - ‘맡기시기 바랍니다’
  rationale: 원문의 tradas는 허락/권고의 뉘앙스를 띠므로, 격식 있는 명령형이 가장 근접합니다.
  doctrine_reference: 문맥상 권고형 번역 원칙
