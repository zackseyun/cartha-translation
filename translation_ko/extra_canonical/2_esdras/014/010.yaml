source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Quoniam saeculum perdidit iuuentutem suam, et tempora adpropinquant senescere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/010.yaml
  text: For the age has lost its youth, and the times are drawing near to old age.
translation:
  language: ko
  text: 이는 세상이 젊음을 잃었고, 때들이 늙어 가는 데 가까워지고 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 세상
  alternatives_korean:
  - 시대
  - 세대
  - 세상 시대
  lexicon: 사전 고유 항목 없음
  rationale: 라틴어 saeculum은 단순한 ‘세기’보다 넓게 ‘현 세상/현 질서’의 의미를 띨 수 있어, POB의 ‘the age’를 자연스럽게 받치면서도 문맥상 추상적 시대성보다 세계-질서의 느낌을 살린 ‘세상’으로 옮겼습니다.
- source_word: perdidit iuuentutem suam
  english_pob_choice: has lost its youth
  chosen_korean: 자기 젊음을 잃었고
  alternatives_korean:
  - 젊음을 잃었고
  - 청춘을 잃었고
  - 젊음을 상실했고
  lexicon: 사전 고유 항목 없음
  rationale: perdidit의 상실 의미를 직접 반영하되, iuuentutem suam의 소유격을 살려 ‘자기 젊음’으로 표현해 원문의 인격화된 진술을 유지했습니다.
- source_word: tempora adpropinquant senescere
  english_pob_choice: the times are drawing near to old age
  chosen_korean: 때들이 늙어 가는 때가 가까워지고
  alternatives_korean:
  - 시대들이 노쇠해져 가는 때가 가까워지고
  - 때들이 노년으로 접어드는 때가 가까워지고
  - 시간들이 늙어 가는 때가 다가오고
  lexicon: 사전 고유 항목 없음
  rationale: tempora는 복수형의 ‘때들’로 살리고, adpropinquant는 ‘가까워지고 있다’로 현재 진행성을 반영했습니다. senescere는 ‘늙어 가다’가 가장 직접적이어서 노쇠보다 덜 해석적이고 본문 이미지도 보존합니다.
theological_decisions:
- issue: 수사적 인격화와 종말론적 진술의 어조
  chosen_reading: 세상과 때들을 사람처럼 늙고 상실하는 대상으로 묘사하는 수사적 인격화를 그대로 유지했습니다.
  alternative_readings:
  - 보다 설명적으로 ‘세상은 쇠퇴했고 시대는 끝을 향하고 있습니다’처럼 정리할 수 있음
  rationale: 이 절은 세계 질서의 소진을 시적으로 말하므로, 의미를 풀어쓰는 대신 원문의 이미지와 긴장감을 보존하는 편이 source-direct합니다.
  doctrine_reference: 문학적 표현 유지
