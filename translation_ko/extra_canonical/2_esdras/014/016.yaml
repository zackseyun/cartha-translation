  yaml_path: translation/extra_canonical/2_esdras/014/016.yaml
  text: —worse things than these will happen again. For the weaker the age becomes through old age[a], the more evils will multiply.
  footnotes:
  - marker: a
    text: Or 'will bring about things worse than these in turn. For the weaker the age becomes through old age, the more evils will multiply'.
    reason: previous_rendering
translation:
  language: ko
  text: —이보다 더 나쁜 일들이 다시 일어날 것입니다. 세상이 노쇠하여 약해질수록, 악은 그만큼 더 많아질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iterum ... facientur
  english_pob_choice: will happen again
  chosen_korean: 다시 일어날 것입니다
  alternatives_korean:
  - 다시 생길 것입니다
  - 다시 일어날 것입니다
  - 또다시 생겨날 것입니다
  lexicon: iterum; facio (passive)
  rationale: facientur는 능동의 '일으키다'가 아니라 수동의 '일어나다/생기다'에 가깝기 때문에, 앞선 재난의 반복성을 살려 ‘다시 일어날 것입니다’로 옮겼습니다.
- source_word: deteriora
  english_pob_choice: worse things
  chosen_korean: 더 나쁜 일들
  alternatives_korean:
  - 더 악한 일들
  - 더 나쁜 것들
  lexicon: deterior
  rationale: 비교급 중성 복수의 의미를 자연스럽게 드러내기 위해 사물적 표현인 ‘일들’을 사용하되, 도덕적·재난적 악화를 함께 담는 ‘더 나쁜’으로 표현했습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 세상
  alternatives_korean:
  - 시대
  - 세대
  - 세계
  lexicon: saeculum
  rationale: 문맥상 단순한 연대기적 ‘시대’보다 인간 역사 전체의 질서와 상태가 쇠약해지는 뉘앙스가 강해, 한국어에서는 압축적으로 ‘세상’이 가장 자연스럽습니다.
- source_word: a senectute
  english_pob_choice: through old age
  chosen_korean: 나이가 들어
  alternatives_korean:
  - 노쇠해져
  - 노쇠함으로 인해
  - 늙어 가면서
  lexicon: senectus
  rationale: senectute의 ‘노쇠/노년’ 의미를 직역하되, 한국어에서 원문의 원인·경과를 자연스럽게 드러내는 표현으로 ‘나이가 들어’라고 옮겼습니다.
- source_word: multiplicabunt
  english_pob_choice: will multiply
  chosen_korean: 더 많이 늘어날 것입니다
  alternatives_korean:
  - 더 많아질 것입니다
  - 증가할 것입니다
  - 늘어날 것입니다
  lexicon: multiplico
  rationale: ‘악’이 수적으로, 그리고 체감상으로 확산되는 이미지를 살리기 위해 ‘늘어날 것입니다’에 ‘더 많이’를 보태 반복적 증대를 분명히 했습니다.
theological_decisions:
- issue: apocalyptic passive for future woes
  chosen_reading: 미래의 재난은 인간이 만들어 내는 것이 아니라, 정해진 대로 ‘일어날 것입니다’라는 수동 표현으로 번역했습니다.
  alternative_readings:
  - 능동적으로 ‘일으킬 것입니다’로 번역
  - ‘생겨날 것입니다’로 중립화
  rationale: 라틴어 facientur의 수동형은 종말론적·신적 수동의 뉘앙스를 담고 있으므로, 재난의 필연성과 수동성을 보존하는 번역이 본문 의도에 더 충실합니다.
  doctrine_reference: 종말론적 섭리와 신적 수동(passivum divinum)
