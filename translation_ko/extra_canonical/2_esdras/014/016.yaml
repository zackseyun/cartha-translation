- from: —이보다 더 나쁜 일들이 다시 일어날 것입니다. 나이가 들어 세상이 약해질수록, 그만큼 악이 더 많이 늘어날 것입니다.[a]
  to: —이보다 더 나쁜 일들이 다시 일어날 것입니다. 세상이 노쇠하여 약해질수록, 악은 그만큼 더 많아질 것입니다.
  rationale: The revision retains the future passive sense of facientur and the escalating-worsening comparison, while explicitly making the world/age the entity weakened by old age. It also renders the quantum ... tantum correlation idiomatically and removes an unnecessary footnote.
  reviewer_model: gpt-5.6-terra
