    issue: 각주의 직역이 a te를 ‘네게서’로 처리함
    rationale: a te는 이 문맥에서 ‘당신에 의해/당신께서 하신’이라는 행위 주체를 나타냅니다. ‘네게서 행해진 것들’은 한국어로도 부자연스럽고 원문의 의미 관계를 흐립니다.
  - severity: low
    issue: 원인·결과 연결 표현의 중복
    rationale: ‘이는’, ‘때문이니’, ‘그러므로’가 한 문장에 함께 있어 현대 한국어 문체상 중복됩니다. 원문의 인과는 ‘으므로’로 충분히 보존됩니다.
  revised_text: 주님의 율법이 불탔으므로, 아무도 주님께서 하신 일들을 알지 못합니다.
