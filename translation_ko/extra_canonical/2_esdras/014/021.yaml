  text: For your law has been burned, and therefore no one knows the things done by you
translation:
  language: ko
  text: 이는 주님의 율법이 불탔기 때문이니, 그러므로 아무도 주님께서 하신 일들을 알지 못합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '왜냐하면 네 율법이 불탔으므로, 그러므로 아무도 네게서 행해진 것들을 알지 못한다'입니다.
    reason: source_note
lexical_decisions:
- source_word: lex
  english_pob_choice: your law
  chosen_korean: 주님의 율법
  alternatives_korean:
  - 당신의 율법
  - 주님의 법
  lexicon: 율법
  rationale: 라틴어 lex는 문맥상 하나님의 주어진 규범을 가리키므로, POB의 'your law'를 따라 한국어 성경에서 통용되는 '율법'으로 옮겼습니다.
- source_word: incensa est
  english_pob_choice: has been burned
  chosen_korean: 불탔기 때문이니
  alternatives_korean:
  - 불살라졌기 때문이니
  - 불태워졌기 때문이니
  lexicon: 불타다
  rationale: 수동 완료의 결과 상태를 자연스럽게 나타내면서도, 원문의 '불에 의해 소멸됨'을 직접적으로 드러내는 표현으로 옮겼습니다.
- source_word: propter quod
  english_pob_choice: and therefore
  chosen_korean: 그러므로
  alternatives_korean:
  - 그 결과
  - 그 때문에
  lexicon: 그러므로
  rationale: 앞 절의 원인과 뒤 절의 결과를 분명히 잇는 접속으로, POB의 논리 관계를 간결하게 반영했습니다.
- source_word: nemo scit
  english_pob_choice: no one knows
  chosen_korean: 아무도 … 알지 못합니다
  alternatives_korean:
  - 아무도 … 모릅니다
  - 아무도 … 알 수 없습니다
  lexicon: 알지 못하다
  rationale: 원문의 인식 불가능을 단정적으로 표현하되, 단순한 무지보다 강한 '알지 못함'의 뉘앙스를 유지했습니다.
theological_decisions:
- issue: 하나님의 행위가 알려지지 않는 이유를 제시하는 구조
  chosen_reading: 율법이 불탔기 때문에 사람들이 하나님께서 하신 일을 알지 못한다는 인과 구조를 그대로 살렸습니다.
  alternative_readings:
  - 사람들이 율법을 잃어버려 하나님의 일을 모른다는 일반화
  - 율법의 소실을 상징적으로만 처리하는 해석
  rationale: 원문은 율법의 소실과 지식의 상실을 직접 연결하므로, 그 신학적 긴장을 완화하지 않고 그대로 유지했습니다.
  doctrine_reference: 계시와 율법 보존에 관한 본문 자체의 논리
