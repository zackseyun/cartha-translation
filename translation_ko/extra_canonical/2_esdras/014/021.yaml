  source_fidelity: 본문은 lex tua를 ‘주님의 율법’으로, incensa est를 ‘불탔다’로, nemo scit를 ‘아무도 알지 못합니다’로 적절히 옮겼습니다. 다만 a te는 문맥상 ‘주님께서 하신’으로 자연스럽게 처리할 수 있으나, 현 각주는 이를 ‘네게서 행해진’이라고 하여 방향과 행위 주체를 부정확하고 부자연스럽게 제시합니다.
