  text: for forty days. But you[a], prepare for yourself many writing tablets, and take with you Sarea, Dabria, Selemia, Ethan, and Asiel, five
  footnotes:
  - marker: a
    text: The Latin 'buxos' literally points to boxwood tablets or writing tablets made of boxwood. The translation gives the functional sense.
    reason: cultural_note
    anchor_ref: '14:24'
translation:
  language: ko
  text: 사십 일 동안입니다. 그러나 당신은 많은 서판을 준비하고, 사레아, 다브리아, 셀레미아, 에탄, 아시엘, 다섯 사람을 함께 데리고 가십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 buxos는 문자적으로는 회양목으로 만든 서판을 가리키지만, 여기서는 기능상 ‘기록용 서판’의 뜻으로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: diebus XL
  english_pob_choice: for forty days
  chosen_korean: 사십 일 동안입니다
  alternatives_korean:
  - 사십 일 동안입니다
  - 사십 일 동안입니다만
  lexicon: diebus
  rationale: 라틴어 기간 표현을 자연스러운 현대 한국어 기간 부사어로 옮겼습니다. 문맥상 앞선 지시의 시간 한계를 알리는 절개이므로 종결형보다 독립된 기간 구절로 처리했습니다.
- source_word: buxos
