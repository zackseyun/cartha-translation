translation:
  language: ko
  text: 사십 일 동안입니다. 그러나 너는 많은 기록용 서판[a]을 준비하고, 사레아와 다브리아와 셀레미아와 에탄과 아시헬, 이 다섯 사람을 데리고 가십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 buxos는 문자적으로 회양목으로 만든 서판을 가리키지만, 여기서는 기능상 ‘기록용 서판’으로 옮겼습니다.
    reason: cultural_note
lexical_decisions:
- source_word: diebus XL
  english_pob_choice: for forty days
  chosen_korean: 사십 일 동안입니다
  alternatives_korean:
  - 사십 일 동안입니다
  - 사십 일 동안입니다만
  lexicon: diebus
  rationale: 라틴어 기간 표현을 자연스러운 현대 한국어 기간 부사어로 옮겼습니다. 문맥상 앞선 지시의 시간 한계를 알리는 절개이므로 종결형보다 독립된 기간 구절로 처리했습니다.
- source_word: buxos
  english_pob_choice: writing tablets
  chosen_korean: 서판
  alternatives_korean:
  - 필기판
  - 나무판
  - 기록판
  lexicon: buxos
  rationale: 영어 POB의 기능적 번역인 writing tablets를 따르되, 라틴어가 boxwood 재질을 가리킨다는 주석을 반영하여 문맥상 필기용 판을 뜻하는 고전적 용어인 서판으로 옮겼습니다.
- source_word: Tu autem
  english_pob_choice: But you
  chosen_korean: 그러나 당신은
  alternatives_korean:
  - 그런데 당신은
  - 하지만 당신은
  lexicon: tu autem
  rationale: 대조 접속과 2인칭 직접 지시를 분명히 드러내기 위해 간결한 대조 표현을 택했습니다.
- source_word: quinque
  english_pob_choice: five
  chosen_korean: 다섯 사람
  alternatives_korean:
  - 다섯
  - 다섯 명
  lexicon: quinque
  rationale: 열거된 인물 명단의 결말이므로 단순 수사보다 한국어에서 자연스러운 집계 표현으로 옮겼습니다. 영어 본문의 마지막 'five'를 반영해 명시적으로 보존했습니다.
