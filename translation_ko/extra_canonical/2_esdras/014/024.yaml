- from: 사십 일 동안입니다. 그러나 당신은 많은 서판을 준비하고, 사레아, 다브리아, 셀레미아, 에탄, 아시엘, 다섯 사람을 함께 데리고 가십시오.[a]
  to: 사십 일 동안입니다. 그러나 너는 많은 기록용 서판[a]을 준비하고, 사레아와 다브리아와 셀레미아와 에탄과 아시헬, 이 다섯 사람을 데리고 가십시오.
  rationale: 원문의 Asihel을 반영해 인명을 고치고, quinque가 앞의 다섯 이름을 집계함을 한국어 문장 안에서 명확히 했습니다. buxos의 기능적 번역과 재질을 설명하는 각주는 유지하되, 표지를 해당 단어에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
