id: 2ES.14.40
reference: 2 Esdras 14:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'eius ut ignis similis. Et accepi et bibi, et in eo cum bibissem cor meum eructuabat intellectum et in pectus meum increscebat sapientia, nam spiritus meus conseruabat memoriam : Et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/040.yaml
  text: And I took it and drank[a], and when I had drunk it, my heart poured forth understanding, and wisdom increased in my breast, for my spirit retained memory.
  footnotes:
  - marker: a
    text: Or 'kept its memory'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 그것을 받아 마셨습니다. 내가 그것을 마신 뒤에, 내 마음에서는 깨달음이 솟아 나왔고, 내 가슴속에서는 지혜가 자라났습니다. 이는 내 영이 기억을 보존하고 있었기 때문입니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘기억을 간직하고 있었다’.
    reason: 라틴어 conseruabat memoriam은 ‘기억을 보존하고 있었다’ 또는 ‘기억을 간직하고 있었다’로 옮길 수 있습니다. 영어 POB의 ‘Or kept its memory’에 대응합니다.
lexical_decisions:
- source_word: accepi et bibi
  english_pob_choice: I took it and drank
  chosen_korean: 그것을 받아 마셨습니다
  alternatives_korean:
  - 받아 마시고
  - 받아들여 마셨습니다
  lexicon: accipio / bibere
  rationale: ‘받다’와 ‘마시다’를 모두 살려 행동의 연속성을 보존했고, 문맥상 단순한 섭취를 넘어 어떤 계시적 행위를 받아들여 실행하는 뉘앙스를 담았습니다.
- source_word: cor meum eructuabat intellectum
  english_pob_choice: my heart poured forth understanding
  chosen_korean: 내 마음에서는 깨달음이 흘러나왔고
  alternatives_korean:
  - 내 마음이 이해를 쏟아냈고
  - 내 심장이 깨달음을 토해냈고
  lexicon: cor / eructare / intellectus
  rationale: 라틴어의 ‘eructuabat’은 ‘분출하다, 토해내다’의 힘을 지니지만, 한국어에서는 너무 거칠지 않게 ‘흘러나오다’로 옮겨 내적 충만과 자발적 분출을 함께 살렸습니다.
- source_word: in pectus meum increscebat sapientia
  english_pob_choice: wisdom increased in my breast
  chosen_korean: 내 가슴에는 지혜가 더해졌습니다
  alternatives_korean:
  - 내 가슴속에서 지혜가 자라났습니다
  - 내 속에 지혜가 커졌습니다
  lexicon: pectus / increscere / sapientia
  rationale: ‘increscebat’의 점진적 증가를 ‘더해지다’로, ‘pectus’는 직역보다 한국어 표현 관용에 맞는 ‘가슴’으로 옮겨 내부적 축적의 이미지를 살렸습니다.
- source_word: nam spiritus meus conseruabat memoriam
  english_pob_choice: for my spirit retained memory
  chosen_korean: 이는 내 영이 기억을 간직하고 있었기 때문입니다
  alternatives_korean:
  - 이는 내 영이 기억을 보존하고 있었기 때문입니다
  - 내 영이 기억을 유지하고 있었기 때문입니다
  lexicon: spiritus / conseruare / memoria
  rationale: POB의 수정안 ‘retained memory’를 따라 ‘간직하다’로 옮겨, 단순한 저장이 아니라 계속 붙들고 있는 보존의 의미를 살렸습니다. '영'은 주어진 문맥에서 인간의 내적 영을 가리키므로 성령으로 바꾸지 않았습니다.
theological_decisions:
- issue: 기억의 보존 주체
  chosen_reading: ‘내 영이 기억을 간직하고 있었다’로 번역하여, 계시가 마음과 가슴에서 분출되지만 그 토대는 영이 보존한 기억에 있음을 드러냈습니다.
  alternative_readings:
  - ‘내 영이 그 기억을 지키고 있었다’
  - ‘내 영이 기억을 보존하고 있었다’
  rationale: 본문의 논리는 영이 받은 내용을 보존하기 때문에 마음의 깨달음과 지혜의 증가가 가능하다는 데 있으므로, 심리적 느낌보다 인식의 지속성을 전면에 두었습니다.
  doctrine_reference: 2 Esdras 14:40 문맥상 계시 전달과 내적 보존의 관계
