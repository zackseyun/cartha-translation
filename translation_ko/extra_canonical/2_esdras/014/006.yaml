  lexicon: palam
  rationale: palam은 ‘공적으로, 드러나게’의 뜻이므로, 현대 합쇼체에서는 ‘공개하다’가 가장 직접적이고 간결합니다.
- source_word: uerba
  english_pob_choice: These words
