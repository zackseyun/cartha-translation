lexical_decisions:
- source_word: in palam facies
  english_pob_choice: you shall make public
  chosen_korean: 공개하십시오
  alternatives_korean:
  - 드러내십시오
  - 널리 알리십시오
  lexicon: palam
  rationale: palam은 ‘공적으로, 드러나게’의 뜻이므로, 현대 합쇼체에서는 ‘공개하다’가 가장 직접적이고 간결합니다.
- source_word: uerba
  english_pob_choice: These words
  chosen_korean: 이 말씀들
  alternatives_korean:
  - 이 말들
  - 이 말
  lexicon: uerbum
  rationale: uerba는 단순한 ‘말’보다 내용 단위가 분명한 복수형이어서, 반복되는 지시대명사와 함께 ‘이 말씀들’로 옮겨 자연스러운 한국어를 살렸습니다.
- source_word: abscondes
  english_pob_choice: you shall hide
  chosen_korean: 숨기십시오
  alternatives_korean:
  - 감추십시오
  - 은폐하십시오
  lexicon: abscondere
  rationale: abscondes는 단순 보관이 아니라 보이지 않게 하라는 뜻이므로, 직설적이고 표준적인 ‘숨기다’를 택했습니다.
