  text: And they received the law of life, which they did not keep, which you also transgressed after them.
translation:
  language: ko
  text: 그들은 생명의 율법을 받았으나, 그것을 지키지 않았고, 당신도 그들 뒤에 그것을 범하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem uitae
  english_pob_choice: the law of life
  chosen_korean: 생명의 율법
  alternatives_korean:
  - 생명 율법
  - 생명을 주는 율법
  lexicon: 'lexeme: lex / νόμος 대응 일반어'
  rationale: 라틴어 목적격구를 자연스럽게 옮기되, POB의 ‘law’ 선택을 따라 ‘율법’으로 유지해 문자적·신학적 연속성을 살렸습니다.
- source_word: custodierunt
  english_pob_choice: they did not keep
  chosen_korean: 지키지 않았고
  alternatives_korean:
  - 지키지 않았으며
  - 준수하지 않았고
  lexicon: 'lexeme: custodire'
  rationale: custodire의 핵심 의미는 ‘지키다/보존하다’이므로, 율법에 대한 불순종을 분명히 드러내는 ‘지키지 않았다’로 옮겼습니다.
- source_word: transgressed
  english_pob_choice: transgressed
  chosen_korean: 범하셨습니다
  alternatives_korean:
  - 어기셨습니다
  - 위반하셨습니다
  lexicon: 'lexeme: transgredi'
  rationale: 문맥상 율법을 어긴 행위를 가리키므로, 한국어 성경에서 널리 이해되는 ‘범하다’를 사용했습니다. 다만 존대형은 청중을 향한 직접 호칭을 반영한 형식적 선택입니다.
theological_decisions:
- issue: 둘째 인칭 복수 대상의 존대 처리
  chosen_reading: “당신도 … 범하셨습니다”로 공손한 서술형을 유지했습니다.
  alternative_readings:
  - “너도 … 범하셨다”
  - “그대도 … 범하셨습니다”
  rationale: 본문은 누군가에게 직접 책임을 돌리는 진술이므로, 합쇼체를 유지하면서도 비난의 강도를 약화시키지 않는 방식으로 처리했습니다.
  doctrine_reference: Korean target style guideline; direct address in formal-polite register
