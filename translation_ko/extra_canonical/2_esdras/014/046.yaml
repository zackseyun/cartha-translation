translation:
  language: ko
  text: 그러나 마지막 일흔 권은 보존해 두었다가, 당신 백성 가운데 지혜로운 이들에게 넘겨주십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 일흔 권은 에스라의 백성 가운데 지혜로운 이들에게 맡겨지는 비전의 지혜로 제시됩니다. 이는 『에스라 넷째』가 숨겨진 계시를 묘사하는 방식에서 중요한 구성적 특징입니다.
    reason: compositional_layer
lexical_decisions:
- source_word: legant digni et indigni
  english_pob_choice: But keep the last seventy
  chosen_korean: 그러나 마지막 일흔 권은 남겨 두십시오
