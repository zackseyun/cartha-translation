lexical_decisions:
- source_word: legant digni et indigni
  english_pob_choice: But keep the last seventy
  chosen_korean: 그러나 마지막 일흔 권은 남겨 두십시오
  alternatives_korean:
  - 그러나 마지막 일흔 권은 보존하십시오
  - 그러나 마지막 일흔 권은 간직해 두십시오
  lexicon: legant
  rationale: 라틴어 본문은 앞부분이 손상·압축되어 있으나, 이어지는 문맥과 영어 POB의 ‘keep’에 따라 ‘남겨 두십시오’로 처리해 보존과 유보의 뉘앙스를 함께 살렸습니다.
- source_word: LXX
  english_pob_choice: seventy
  chosen_korean: 일흔 권
  alternatives_korean:
  - 일흔
  - 칠십 권
  lexicon: LXX
  rationale: 문맥상 숫자만이 아니라 책의 단위를 가리키므로, 한국어에서 자연스러운 ‘일흔 권’으로 옮겼습니다.
- source_word: ut ... wise among your people
  english_pob_choice: so that you may hand them over to the wise among your people
  chosen_korean: 그러면 그것을 당신 백성 가운데 지혜로운 이들에게 넘겨 주실 수 있습니다
  alternatives_korean:
  - 그래서 당신 백성의 지혜로운 이들에게 맡기실 수 있습니다
  - 당신 백성 가운데 지혜로운 이들에게 주실 수 있습니다
  lexicon: conseruabis
  rationale: 영문 POB의 ‘hand them over’에 맞춰 단순한 ‘주다’보다 위탁·전달의 성격이 드러나는 ‘넘겨 주다’를 선택했습니다.
theological_decisions:
- issue: 마지막 일흔 권의 보존과 제한된 전달
  chosen_reading: 일흔 권을 남겨 두고, 그것을 지혜로운 이들에게만 넘겨 주는 제한적 계시의 구조를 살렸습니다.
  alternative_readings:
  - 단순히 책을 보관하는 의미로 약화하는 읽기
  - 모든 사람에게 공개되는 읽기
  rationale: 영문 POB 주석이 이 대목을 ‘esoteric wisdom reserved for the wise’로 설명하므로, 본문이 지닌 비밀 지혜의 보존·선별 전달이라는 구성적 의미를 드러내는 번역이 필요합니다.
  doctrine_reference: 4 Ezra의 계시 구조와 지혜 전승의 제한성
- issue: 직접 화법의 공손한 명령
  chosen_reading: ‘남겨 두십시오’와 ‘넘겨 주실 수 있습니다’로 합쇼체 명령·가능 표현을 사용했습니다.
  alternative_readings:
  - 평서형으로 완화된 번역
  - 고어적 명령형
  rationale: 본문이 지시문 형식이므로 현대 한국어 합쇼체의 명령·권고 체계로 옮겨 문체를 일관되게 유지했습니다.
  doctrine_reference: 문체/화법 일관성
