translation:
  language: ko
  text: 그러나 마지막 일흔 권은 남겨 두십시오. 그러면 그것을 당신 백성 가운데 지혜로운 이들에게 넘겨 주실 수 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
