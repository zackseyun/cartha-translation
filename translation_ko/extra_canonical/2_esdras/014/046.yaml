  source_fidelity: 라틴어의 핵심 지시는 마지막 일흔 권을 보존하고( conseruabis ) 그것들을 ‘당신 백성 가운데 지혜로운 이들’에게 넘겨주라는 목적절( ut tradas )입니다. 초안의 ‘넘겨 주실 수 있습니다’는 가능 표현이어서 지시와 목적의 뜻을 약화합니다.
  naturalness: ‘그러면’과 ‘…수 있습니다’의 연결은 직접 지시문으로서 다소 부자연스럽습니다. ‘보존해 두었다가 … 넘겨주십시오’가 현대 표준 한국어 합쇼체에서 자연스럽고 순서 및 목적 관계를 드러냅니다.
  terminology: ‘일흔 권’은 문맥상 책의 수를 적절히 나타냅니다. ‘보존해 두다’는 conseruare의 보존·유보 의미를 명확히 하며, ‘넘겨주다’는 tradere에 적절합니다.
