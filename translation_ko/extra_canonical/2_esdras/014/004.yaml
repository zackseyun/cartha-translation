language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et misi eum et eduxit populum meum de Aegypto, et adduxi eum super montem Sina et detinui eum apud me diebus multis,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/014/004.yaml
  text: And I sent him, and he led my people out of Egypt, and I brought him up onto Mount Sinai, and I kept him with me many days.
translation:
  language: ko
  text: 그리고 내가 그를 보냈으며, 그가 내 백성을 이집트에서 이끌어냈습니다. 나는 그를 시내 산으로 데려갔고, 여러 날 동안 내 곁에 머물게 했습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 super montem Sina는 문자적으로는 ‘시내 산 위로’에 가깝지만, 한국어에서는 목적지 표현으로 자연스럽게 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: Et misi eum
  english_pob_choice: And I sent him
  chosen_korean: 그리고 내가 그를 보냈으며
  alternatives_korean:
  - 내가 그를 보냈고
  - 그리고 내가 그를 보냈습니다
  lexicon: misi → 보내다
  rationale: 라틴어 misi의 파송 의미를 살리되, 앞뒤 절과의 연결을 자연스럽게 하기 위해 ‘그리고’와 과거 연결형을 사용했습니다.
- source_word: eduxit populum meum de Aegypto
  english_pob_choice: he led my people out of Egypt
  chosen_korean: 그가 내 백성을 이집트에서 이끌어냈습니다
  alternatives_korean:
  - 그가 내 백성을 이집트에서 인도해냈습니다
  - 그가 내 백성을 이집트 밖으로 데리고 나왔습니다
  lexicon: eduxit → 이끌어내다
  rationale: 단순히 ‘데려오다’보다 출애굽의 해방적 인도 의미를 더 분명히 드러내는 ‘이끌어내다’가 source-direct합니다.
- source_word: adduxi eum super montem Sina
  english_pob_choice: I brought him up onto Mount Sinai
  chosen_korean: 나는 그를 시내 산으로 데려갔고
  alternatives_korean:
  - 나는 그를 시내 산으로 올려보냈고
  - 나는 그를 시내 산 위로 데려갔고
  lexicon: adduxi super montem Sina → 시내 산으로 데려가다
  rationale: super montem은 ‘~위로/으로’의 방향을 담지만, 한국어에서는 목적지로 자연스럽게 ‘시내 산으로’라고 옮겨도 상승 방향이 보존됩니다.
- source_word: detinui eum apud me diebus multis
  english_pob_choice: I kept him with me many days
  chosen_korean: 여러 날 동안 내 곁에 머물게 했습니다
  alternatives_korean:
  - 오랫동안 내 곁에 두었습니다
  - 여러 날 동안 나와 함께 있게 했습니다
  lexicon: detinui apud me → 내 곁에 머물게 하다
  rationale: detinui는 단순 동거보다 ‘붙들어 두다/머물게 하다’의 뉘앙스가 있어, apud me의 ‘내 곁에’와 함께 보존했습니다.
theological_decisions:
- issue: 출애굽과 시내산 체류의 서술 방식
  chosen_reading: 하나님이 모세를 파송하시고, 백성을 인도해 내시며, 시내 산으로 데려가시고, 오랜 기간 곁에 두시는 연속된 구원사적 행동으로 읽었습니다.
  alternative_readings:
  - 단순한 역사 서술로만 읽기
  - ‘머물게 했다’를 소극적 체류로 약화시키기
  rationale: 문장 전체가 하나님 주도의 구원사 전개를 강조하므로, 동사들의 능동성과 연속성을 살려 번역했습니다.
  doctrine_reference: 출애굽기 3–24장 / 구원사
