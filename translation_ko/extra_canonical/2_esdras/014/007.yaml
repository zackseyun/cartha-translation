- source_word: Et nunc
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 지금
  lexicon: Latin nunc
  rationale: Et nunc는 단순한 시간 부사구이므로, 한국어에서는 자연스럽고 압축적인 ‘이제’로 옮기는 것이 가장 근접합니다.
- source_word: tibi
  english_pob_choice: to you
  chosen_korean: 당신에게
  alternatives_korean:
  - 그대에게
  - 네게
  lexicon: Latin tibi
  rationale: 직접 수신자를 분명히 하는 2인칭 여격이므로, 현대 문어체에서 자연스러운 ‘당신에게’를 사용했습니다.
- source_word: dico
  english_pob_choice: I say
  chosen_korean: 말합니다
  alternatives_korean:
  - 말하겠습니다
  - 이야기합니다
  lexicon: Latin dico
  rationale: 현재형 발화 동사이므로, 한국어에서는 공손한 현재 서술형 ‘말합니다’가 가장 직접적입니다.
theological_decisions:
- issue: 직접화법의 공손도
  chosen_reading: 라틴어 1인칭 현재 발화문을 한국어 합쇼체로 옮겨, 화자의 직접 발언성을 유지했습니다.
  alternative_readings:
  - 말하노라
  - 내가 너에게 이르노니
  rationale: 본문은 단순 선언문으로, 과도한 성경투를 피하고도 원문의 직접 발화 기능을 보존하는 쪽이 적절합니다.
  doctrine_reference: 문체/화법 선택
