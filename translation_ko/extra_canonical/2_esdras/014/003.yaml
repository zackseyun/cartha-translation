translation:
  language: ko
  text: 제가 떨기나무 가운데서 자신을 나타냈고[a], 제 백성이 이집트에서 섬기고 있을 때 모세에게 말했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
