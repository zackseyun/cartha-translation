lexical_decisions:
- source_word: Reuelans reuelatus sum
  english_pob_choice: I revealed myself
  chosen_korean: 제가 자신을 나타냈고
  alternatives_korean:
  - 제가 드러났고
  - 제가 공개적으로 나타났고
  - 제가 스스로를 드러냈고
  lexicon: revelare
  rationale: 라틴어의 중복형은 단순한 과거사보다 자기현시의 강조를 담으므로, 한국어도 ‘자신을 나타냈다’로 자연스럽게 옮기되 과도한 해석어는 피했습니다.
- source_word: super rubum
  english_pob_choice: in the bush
  chosen_korean: 떨기나무 가운데서
  alternatives_korean:
  - 가시덤불 가운데서
  - 덤불 속에서
  - 떨기나무 속에서
  lexicon: rubus
  rationale: 본문의 rubum은 출애굽기 전승의 떨기나무 현현을 가리키므로, 문맥상 가장 식별 가능한 ‘떨기나무’를 택했습니다.
- source_word: populus meus
  english_pob_choice: my people
  chosen_korean: 제 백성
  alternatives_korean:
  - 내 백성
  - 내 ժողովուրդ
  lexicon: populus meus
  rationale: 하나님이 직접 말씀하시는 문맥이므로 존칭 화법에 맞게 ‘제 백성’으로 옮겼습니다.
- source_word: seruiebat
  english_pob_choice: were serving
  chosen_korean: 섬기고 있을 때
  alternatives_korean:
  - 종노릇하고 있을 때
  - 노역하고 있을 때
  - 섬기던 때
  lexicon: servire
  rationale: 이 동사는 여기서 이집트 아래의 종속 상태를 가리키므로, 무난한 현재진행형 ‘섬기고 있을 때’로 하되 강한 억압 뉘앙스는 문맥에 맡겼습니다.
theological_decisions:
- issue: 떨기나무 현현의 표현 방식
  chosen_reading: ‘제가 자신을 나타냈고’로 하여 하나님의 자기계시를 직접적으로 드러냈습니다.
  alternative_readings:
  - ‘제가 나타났고’
  - ‘제가 계시되었고’
  rationale: 라틴어 중복형은 단순 출현이 아니라 의도적인 자기계시를 강조하므로, ‘자신을 나타냈다’가 의미를 더 정확히 살립니다.
  doctrine_reference: 출 3:2-6 전승의 신현 이해
