  yaml_path: translation/extra_canonical/2_esdras/009/009.yaml
  text: Then those who now have abused my ways will be astonished, and those who cast them aside in contempt will remain in torments.
translation:
  language: ko
  text: 그때에 지금까지 내 길들을 악용해 온 자들은 놀랄 것이며, 그 길들을 멸시하여 내던진 자들은 고통 가운데 머물 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 길들을 악용해 온 자들’입니다.
    reason: lexical_alternative
  - marker: b
    text: cruciamentis는 지속적인 ‘고통’ 또는 ‘고문/형벌’의 강한 뉘앙스를 지닙니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: abusi sunt vias meas
  english_pob_choice: have abused my ways
  chosen_korean: 내 길을 남용한
  alternatives_korean:
  - 내 길을 악용한
  - 내 길을 함부로 다룬
  lexicon: abuse / use badly
  rationale: 라틴어 abusi sunt는 단순한 오용보다 ‘남용하다’에 가깝기 때문에, 하나님의 ‘길’을 거스르며 잘못 사용한 뉘앙스를 살렸습니다.
- source_word: mirabuntur
  english_pob_choice: will be astonished
  chosen_korean: 놀라게 되고
  alternatives_korean:
  - 놀라게 될 것이고
  - 경악하게 될 것이고
  lexicon: be amazed / be astonished
  rationale: 미래 수동적 반응을 자연스럽게 옮기되, 예언적 선언의 긴박함을 유지했습니다.
- source_word: in cruciamentis commorabuntur
  english_pob_choice: will remain in torments
  chosen_korean: 고통 속에 머물 것입니다
  alternatives_korean:
  - 고통 가운데 머물 것입니다
  - 고문 속에 계속 있을 것입니다
  lexicon: remain in torments
  rationale: cruciamenta는 단순한 불편이 아니라 지속되는 고통을 가리키므로, 상태의 지속을 드러내는 ‘머물다’를 택했습니다.
- source_word: eos proiecerunt in contemptu
  english_pob_choice: those who cast them aside in contempt
  chosen_korean: 그들을 경멸하며 내던진 자들
  alternatives_korean:
  - 그들을 멸시하고 내버린 자들
  - 그들을 업신여기고 내친 자들
  lexicon: cast aside in contempt
  rationale: proicere와 in contemptu의 결합을 반영해, 단순한 거절이 아니라 멸시를 동반한 내침을 살렸습니다.
theological_decisions:
- issue: 보응의 구조
  chosen_reading: 현재 하나님의 길을 남용한 자들과 그것을 경멸하며 내던진 자들에게 각각 놀라움과 지속적 고통이 돌아간다는 보응 구조로 옮겼습니다.
  alternative_readings:
  - 단순한 미래 형벌 선언으로만 옮길 수 있음
  - 두 행위를 하나로 묶어 ‘경멸한 자들’로만 번역할 수 있음
  rationale: 원문은 두 부류를 평행하게 대비하므로, 각각의 행위와 결과를 분리해 드러내는 것이 문장의 신학적 긴장을 가장 잘 보존합니다.
  doctrine_reference: 예언서의 보응/심판 도식
- issue: ‘내 길’의 의미
  chosen_reading: ‘내 길’을 하나님의 계시된 삶의 방식과 명령 전체를 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘내 율법’으로 구체화
  - ‘내 도’로 보다 직역
  rationale: 원문 vias meas는 특정 단일 명령어보다 하나님의 인도하시는 길 전체를 가리키므로, 본문이 가진 폭을 좁히지 않았습니다.
  doctrine_reference: 하나님의 계시된 길과 순종
