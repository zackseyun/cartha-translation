  verdict: revise
  source_fidelity: 원문의 시간 표지(nunc, tunc), 두 관계절의 병렬, 그리고 eos가 선행하는 vias meas(‘내 길들’)를 가리키는 점을 더 분명히 드러낼 필요가 있습니다. 초안의 ‘그들’은 사람을 가리키는 것으로 읽히기 쉬워 원문의 대상을 흐립니다.
  naturalness: ‘이제 자기들이 … 자들’은 현대 한국어 문장으로 비문에 가깝고, ‘그러면’보다 종말론적 시간 표지인 ‘그때에’가 tunc에 더 적절합니다. ‘고통 가운데 머물 것입니다’는 자연스럽고 격식 있는 합쇼체입니다.
  terminology: vias meas는 본문에서 ‘내 길들’로 유지하되, 한국어의 자연스러움을 위해 두 번째 언급에서는 ‘그 길들’로 받아 원문의 복수 대명사 eos를 명시합니다. abusi sunt에는 ‘악용해 온’이, cruciamentis에는 지속적이고 강한 괴로움을 나타내는 ‘고통 가운데’가 적절합니다.
