  - severity: high
    issue: eos를 ‘그들’로 번역하여 선행사 vias meas를 사람으로 오독하게 합니다.
    rationale: 라틴어 eos는 남성 복수인 vias(‘길들’)를 받습니다. 따라서 ‘그 길들’이라고 밝혀야 원문의 지시 관계가 보존됩니다.
