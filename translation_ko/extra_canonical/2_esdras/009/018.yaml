id: 2ES.9.18
reference: 2 Esdras 9:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et tunc cum essem parans eis, his qui nunc, antequam fieret illis saeculum in quo inhabitarent, et nemo contradixit mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/018.yaml
  text: And then[a], when I was preparing for them—for those who now exist—before the age was made for them in which they would dwell, no one contradicted me.
  footnotes:
  - marker: a
    text: Or 'when I was preparing for those who now are, before the age was made for them in which they would dwell, no one contradicted me then, for there was no one.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그때, 내가 그들을 위해 준비하고 있을 때—곧 지금 존재하는 그들을 위해서—세상이 그들을 위하여 지어지기 전에, 아무도 나를 반박하지 않았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내가 지금 존재하는 그들을 위해 준비하고 있을 때, 그들이 거할 세상이 만들어지기 전에, 아무도 그때 나를 반박하지 않았습니다. 왜냐하면 아무도 없었기 때문입니다.’라는 뜻일 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: et tunc
  english_pob_choice: And then
  chosen_korean: 그리고 그때
  alternatives_korean:
  - 그때
  - 그리고 그리하여
  lexicon: et / tunc
  rationale: 연결사 et와 시간 표지 tunc를 함께 살려, 앞선 흐름을 이어 주는 ‘그리고’와 시점 강조인 ‘그때’를 모두 반영했습니다.
- source_word: parans eis
  english_pob_choice: when I was preparing for them
  chosen_korean: 내가 그들을 위해 준비하고 있을 때
  alternatives_korean:
  - 내가 그들을 준비하고 있을 때
  - 내가 그들을 위하여 마련하고 있을 때
  lexicon: parare + eis
  rationale: eis를 목적격으로 받아 ‘그들을 위해’로 옮겨, 단순히 ‘준비하다’보다 대상 지향성을 드러냈습니다.
- source_word: his qui nunc
  english_pob_choice: for those who now exist
  chosen_korean: 곧 지금 존재하는 그들을 위해서
  alternatives_korean:
  - 지금 있는 그들을 위해서
  - 지금 존재하는 자들을 위해
  lexicon: his qui nunc
  rationale: his qui nunc의 현재 존재를 분명히 하기 위해 ‘지금 존재하는’으로 옮기고, 앞 구절과의 대응을 위해 보충 설명처럼 배치했습니다.
- source_word: saeculum in quo inhabitarent
  english_pob_choice: the age ... in which they would dwell
  chosen_korean: 세상이 그들을 위하여 지어지기 전에,
  alternatives_korean:
  - 그들이 거주할 세대가 생기기 전에
  - 그들이 살 그 시대가 마련되기 전에
  lexicon: saeculum / inhabitare
  rationale: saeculum을 문맥상 단순한 ‘시대’보다 더 큰 창조 질서의 범주로 보고, inhabitare는 ‘살다/거하다’보다 서술을 자연스럽게 하기 위해 ‘지어지기 전에’와 연결했습니다.
- source_word: nemo contradixit mihi
  english_pob_choice: no one contradicted me
  chosen_korean: 아무도 나를 반박하지 않았습니다
  alternatives_korean:
  - 아무도 나를 거스르지 않았습니다
  - 아무도 나를 대항하지 않았습니다
  lexicon: contradicere
  rationale: contradicere의 직접적 의미를 살려 ‘반박하다’로 옮겼고, ‘거스르다’보다 논쟁적 발화를 더 분명히 드러냅니다.
theological_decisions:
- issue: ‘세상/시대’의 범위
  chosen_reading: saeculum을 단순한 달력상의 시간보다, 그들이 거할 수 있도록 마련된 창조된 질서/세계의 범주로 이해해 옮겼습니다.
  alternative_readings:
  - ‘시대’
  - ‘세대’
  rationale: 문맥상 ‘거주’(inhabitarent)와 결합해 단순 연대기보다 존재 공간의 마련을 강조하므로, 한국어에서는 ‘세상’으로 넓게 살리되 과도한 신학적 확장은 피했습니다.
  doctrine_reference: 창조 질서와 섭리의 언어
