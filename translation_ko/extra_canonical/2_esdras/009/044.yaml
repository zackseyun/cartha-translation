id: 2ES.9.44
reference: 2 Esdras 9:44
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ego enim per singulas horas et per singulos dies in annistriginta his deprecabar Altissimum nocte ac die.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/044.yaml
  text: For every hour and every day throughout those thirty years I kept praying to the Most High night and day.
translation:
  language: ko
  text: 사실 나는 이 삼십 년 동안 매 시간마다, 매일 밤낮으로 지극히 높으신 분께 간구해 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: per singulas horas et per singulos dies
  english_pob_choice: For every hour and every day
  chosen_korean: 매 시간마다, 매일
  alternatives_korean:
  - 한 시간마다, 매일
  - 모든 시간마다, 모든 날마다
  lexicon: 시간 / 날
  rationale: 라틴어의 반복적 빈도 표현을 자연스러운 한국어로 옮기되, POB의 ‘every hour and every day’가 주는 지속성을 살리기 위해 ‘매’의 반복 표현을 사용했습니다.
- source_word: deprecabar
  english_pob_choice: I kept praying
  chosen_korean: 간구해 왔습니다
  alternatives_korean:
  - 기도해 왔습니다
  - 간청해 왔습니다
  lexicon: 간구하다
  rationale: deprecabar는 단순한 기도보다 간절한 청원을 가리키므로, 지속상 ‘-해 왔습니다’와 결합해 계속된 간구의 뉘앙스를 살렸습니다.
- source_word: Altissimum
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  - 가장 높으신 하나님
  lexicon: 지극히 높으신 분
  rationale: 직역에 가까우면서도 한국어에서 신격 호칭으로 자연스럽고, 특정 교파 용어에 기대지 않는 중립적 표기를 택했습니다.
- source_word: nocte ac die
  english_pob_choice: night and day
  chosen_korean: 밤낮으로
  alternatives_korean:
  - 밤과 낮으로
  - 밤낮
  - 밤이든 낮이든
  lexicon: 밤낮으로
  rationale: 라틴어의 상투적 병렬을 한국어 관용구로 압축해, 끊임없는 지속을 분명하게 전달했습니다.
theological_decisions:
- issue: Altissimum의 신적 호칭 처리
  chosen_reading: 본문의 Altissimum은 ‘지극히 높으신 분’으로 옮겨 하나님을 직접 지칭하는 경칭으로 처리했습니다.
  alternative_readings:
  - ‘가장 높으신 하나님’
  - ‘지극히 높으신 이’
  rationale: 문맥상 기도의 대상이므로 추상적 형용사보다 인격적 호칭이 더 적절하며, 동시에 원문의 신적 위계를 보존합니다.
  doctrine_reference: 서술적 신명칭 번역 원칙
