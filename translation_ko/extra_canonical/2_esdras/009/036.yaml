  - severity: low
    issue: ‘우리 마음도 그러할 것입니다’가 멸망이라는 술어를 대용 표현으로 처리합니다.
    rationale: 문맥상 이해되지만, 원문의 peribimus에 해당하는 심판 진술을 명시하는 편이 한국어 번역에서 더 분명합니다.
  - severity: low
