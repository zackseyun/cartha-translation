review_pass:
  verdict: revise
  source_fidelity: 개정안은 nos quidem의 강조를 ‘우리는 참으로’로, legem accepimus를 인과관계를 덧붙이지 않는 ‘율법을 받은 우리는’으로 옮깁니다. peccantes peribimus는 영어 POB의 판정에 따라 ‘죄를 지었으므로 멸망할 것’으로 유지하고, cor nostrum quod suscepit eam의 소유격·관계절 및 율법을 가리키는 대명사를 명시합니다.
  naturalness: 초안의 ‘율법을 받은 자들이기에’는 현대 한국어로 자연스럽지만 율법을 받은 사실 자체가 멸망의 원인이라는 인과를 만들 수 있습니다. ‘율법을 받은 우리는’이 원문의 병렬적·강조적 구조를 더 자연스럽고 정확하게 재현합니다. 마지막 절은 ‘그러할 것입니다’보다 ‘멸망할 것입니다’가 생략된 술어를 분명히 하여 명료합니다.
  terminology: ‘율법’, ‘죄를 지었으므로’, ‘멸망’, ‘마음’은 적절합니다. ‘우리의 마음’은 cor nostrum의 소유 관계를 자연스럽게 드러냅니다.
