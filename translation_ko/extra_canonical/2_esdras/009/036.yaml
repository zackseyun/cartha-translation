base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/036.yaml
  text: For we indeed[a], who received the law, will perish because we sinned, and also our heart, which received it[b];
  footnotes:
  - marker: a
    text: The Latin around this verse is textually rough. The main sense is that those who received the law perish, even though the law itself does not perish but remains honored.
    reason: textual_variant
    anchor_ref: '9:36'
  - marker: b
    text: Or 'For we who received the law will perish in sin, and also the heart that received it;'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 참으로 율법을 받은 자들이기에, 우리가 죄를 지었으므로 멸망할 것이며, 그것을 받은 우리 마음도 그러할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 본문은 이 구절에서 다소 거칠고 손상된 전승을 보입니다. 핵심 의미는 율법을 받은 자들이 멸망한다는 것이며, 율법 자체가 멸망하는 것은 아니라는 점입니다.
    reason: textual_variant
  - marker: b
    text: 또는 “율법을 받은 우리는 죄 안에서 멸망할 것이며, 그것을 받은 마음도 그러할 것이다.”
    reason: previous_rendering
lexical_decisions:
- source_word: nos quidem
  english_pob_choice: For we indeed
  chosen_korean: 우리는 참으로
  alternatives_korean:
  - 실로 우리는
  - 우리가 바로
  lexicon: nos quidem
  rationale: nos quidem의 강조·대조 뉘앙스를 살려 단순한 인과가 아니라 ‘참으로/실로’의 강조로 옮겼습니다.
- source_word: legem accepimus
  english_pob_choice: who received the law
  chosen_korean: 율법을 받은 자들이기에
  alternatives_korean:
  - 율법을 받은 우리가
  - 율법을 받았으므로
  lexicon: lexem/legem accepimus
  rationale: 접수한 대상이 ‘율법’임을 분명히 하고, 수신자 집단을 자연스럽게 드러내기 위해 관계절보다 서술적 표현을 택했습니다.
- source_word: peccantes peribimus
  english_pob_choice: will perish because we sinned
  chosen_korean: 우리가 죄를 지었으므로 멸망할 것이며
  alternatives_korean:
  - 죄 가운데 멸망할 것이며
  - 죄지으며 망할 것이며
  lexicon: peccantes peribimus
  rationale: peccantes를 단순 상태가 아니라 원인에 가까운 분사로 보고, POB의 해석을 따라 ‘죄를 지었으므로’로 옮겼습니다.
- source_word: cor nostrum quod suscepit eam
  english_pob_choice: our heart, which received it
  chosen_korean: 그것을 받은 우리 마음도
  alternatives_korean:
  - 그것을 받은 우리의 마음도
  - 그것을 받아들인 우리 마음도
  lexicon: cor nostrum / suscepit
  rationale: cor를 성경적 관용에 따라 ‘마음’으로 두되, possessive nostrum을 분명히 반영했습니다.
theological_decisions:
- issue: 율법을 받은 자와 그들의 마음이 함께 멸망한다는 진술의 보존
  chosen_reading: 율법 자체가 아니라 율법을 받은 자들, 곧 우리와 우리 마음이 멸망하는 것으로 읽었습니다.
  alternative_readings:
  - 율법도 함께 멸망하는 것으로 읽기
  - 죄 안에서만 멸망하는 것으로 축소해 읽기
  rationale: 영문 POB 주석이 지적하듯 이 구절의 핵심은 율법의 소멸이 아니라 율법을 받은 자들의 책임과 심판입니다. 따라서 그 긴장을 약화하지 않고 유지했습니다.
  doctrine_reference: 율법과 인간 책임; 심판의 책임 소재
