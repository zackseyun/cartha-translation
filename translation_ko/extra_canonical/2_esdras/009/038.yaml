id: 2ES.9.38
reference: 2 Esdras 9:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Et cum loquerer haec in corde meo, respexi oculis meis et uidi mulierem in dextera parte, et ecce haec lugebat et plorabat cum uoce magna, et animo dolebat ualde, et uestimenta eius discissa, et cinis super caput eius. Et dimisi cogitatus in quibus eram cogitans et conuersus sum ad eam et dixi ei: Vtquid fles? et quid doles animo? Et dixit ad me: dimitte me, dominus meus, ut defleam me et adiciam dolorem, quoniam ualde amara sum animo et humiliata sum ualde. Et dixi ei: quid passa es? dic mihi. et dixit ad me: Sterilis fui ego famula tua et non peperi habens maritum annis triginta. Ego enim per singulas horas et per singulos dies in annis triginta his deprecabar altissimum nocte ac die. Et factum est post triginta annos exaudiuit me deus ancillae tuae et peruidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iocundata sum super eum ualde ego et uir meus et omnes ciues mei, et honorificauimus ualde fortem. Et nutriui eum cum labore multo: Et factum est cum
    creuisset et uenissem accipere illi uxorem, et feci diem epuli.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/038.yaml
  text: While I was speaking these things in my heart, I looked up with my eyes, and I saw a woman on the right side. And behold, she was mourning and weeping with a loud voice, and was deeply grieved in spirit. Her garments were torn, and ashes were on her head.
translation:
  language: ko
  text: 내가 마음속으로 이런 일들을 말하고 있을 때에, 눈을 들어 보니 오른쪽에 한 여인이 있었습니다. 그런데 그 여인은 큰 소리로 애통하며 울고 있었고, 마음속으로 몹시 슬퍼하고 있었습니다. 그의 옷은 찢어져 있었고, 그의 머리 위에는 재가 있었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: oculis meis et uidi
  english_pob_choice: I looked up with my eyes, and I saw
  chosen_korean: 눈을 들어 보니
  alternatives_korean:
  - 눈으로 보니
  - 눈을 들어 바라보니
  lexicon: 눈을 들다 / 보다
  rationale: 시선을 올려 대상을 확인하는 장면을 자연스럽게 살리되, ‘with my eyes’를 과도하게 직역하지 않고 POB의 관찰 동작을 간결하게 반영했습니다.
- source_word: mulierem in dextera parte
  english_pob_choice: a woman on the right side
  chosen_korean: 오른쪽에 한 여인을
  alternatives_korean:
  - 오른편에 한 여인을
  - 오른쪽 편에 한 여인을
  lexicon: 오른쪽 / 여인
  rationale: dextera parte를 공간적 위치로 직접 옮겼고, mulierem은 서술적·문학적 뉘앙스를 살려 ‘여인’으로 옮겼습니다.
- source_word: lugebat et plorabat cum uoce magna
  english_pob_choice: she was mourning and weeping with a loud voice
  chosen_korean: 큰 소리로 울부짖으며 통곡하고 있었고
  alternatives_korean:
  - 큰 소리로 슬퍼하며 울고 있었고
  - 큰소리로 통곡하며 울고 있었고
  lexicon: 울부짖다 / 통곡하다
  rationale: 단순한 ‘울다’보다 장탄식과 통곡의 강도를 드러내는 동사의 조합이 원문의 중첩된 애곡을 더 잘 반영합니다.
- source_word: animo dolebat ualde
  english_pob_choice: was deeply grieved in spirit
  chosen_korean: 마음이 몹시 괴로워하고 있었습니다
  alternatives_korean:
  - 영으로 몹시 근심하고 있었습니다
  - 마음속으로 깊이 슬퍼하고 있었습니다
  lexicon: 마음 / 괴로워하다
  rationale: animo는 여기서 내적 상태를 가리키므로 ‘마음’으로 풀고, ualde의 강도를 ‘몹시’로 살렸습니다.
- source_word: vestimenta eius discissa, et cinis super caput eius
  english_pob_choice: Her garments were torn, and ashes were on her head
  chosen_korean: 그녀의 옷은 찢어져 있었고, 머리 위에는 재가 있었습니다
  alternatives_korean:
  - 옷이 찢겨 있었고, 머리 위에 재가 있었습니다
  - 그녀의 의복은 찢어져 있었고, 머리에는 재가 있었습니다
  lexicon: 찢어지다 / 재
  rationale: 옷의 훼손과 애통의 표지를 소박하고 직설적으로 옮겨, 장면의 시각적 상징을 유지했습니다.
theological_decisions:
- issue: 반복되는 애곡과 애통의 강도 표현
  chosen_reading: ‘울부짖으며 통곡하고 있었고, 마음이 몹시 괴로워하고 있었습니다’로 중첩된 슬픔을 유지했습니다.
  alternative_readings:
  - ‘슬퍼하며 울고 있었습니다’처럼 완화하는 번역
  - 동사를 하나로 줄여 간명하게 만드는 번역
  rationale: 본문은 단순한 슬픔이 아니라 공개적이고 극심한 애곡을 그리므로, 정서적 강도를 약화하지 않는 쪽이 원문의 수사와 장면성을 더 잘 보존합니다.
  doctrine_reference: 문학적·서사적 강도 보존
- issue: ‘오른쪽’의 공간 표지
  chosen_reading: 인물의 위치를 물리적 방향표지로 옮겨 상징 해석을 덧붙이지 않았습니다.
  alternative_readings:
  - 상징적 의미를 암시하는 번역
  - ‘오른편’이 주는 전통적 상징을 강조하는 번역
  rationale: 이 절의 POB 문맥은 관찰된 위치를 보고하는 서술이므로, 본문에 없는 상징 해석을 미리 부여하지 않는 것이 source-grounded입니다.
  doctrine_reference: 서사 문맥 보존
