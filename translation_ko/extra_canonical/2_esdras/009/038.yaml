  to: 내가 마음속으로 이런 일들을 말하고 있을 때에, 눈을 들어 보니 오른쪽에 한 여인이 있었습니다. 그런데 그 여인은 큰 소리로 애통하며 울고 있었고, 마음속으로 몹시 슬퍼하고 있었습니다. 그의 옷은 찢어져 있었고, 그의 머리 위에는 재가 있었습니다.
  rationale: 문법적으로 어색한 두 표현을 고치고, animo dolebat ualde의 내적 애통을 자연스러운 한국어로 명확히 했습니다. ‘그런데’는 ecce의 주의 환기 기능을 과도한 해석 없이 반영합니다.
