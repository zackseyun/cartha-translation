source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dicere coram altissimo et dixi: O domine in nobis ostendens ostensus es patribus nostris in deserto quando erant exientes de Aegypto et quando ueniebant in deserto quod non calcatur et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/029.yaml
  text: O Lord[a], you showed yourself among us to our fathers in the wilderness, when they were coming out of Egypt and were entering the untrodden and fruitless desert,
  footnotes:
  - marker: a
    text: Or 'you showed yourself among us to our fathers'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님, 주께서는 광야에서 우리 가운데서 우리 조상들에게 자신을 나타내셨습니다. 그들은 이집트에서 나오고 있었고, 발길이 닿지 않았으며 열매 없는 사막으로 들어가고 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우리 가운데서 우리 조상들에게’는 라틴어의 어순을 살린 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: O domine
  english_pob_choice: O Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주 하나님
  lexicon: κύριος
  rationale: 호칭어로서의 직접 부름을 한국어 합쇼체에 맞게 자연스럽게 살리되, 본문이 기도문적 호소이므로 ‘주님’이 가장 안정적입니다.
- source_word: ostendens ostensus es
  english_pob_choice: you showed yourself
  chosen_korean: 자신을 나타내셨습니다
  alternatives_korean:
  - 드러내셨습니다
  - 보여 주셨습니다
  lexicon: ostendere
  rationale: 라틴어의 ‘보이다/드러내다’ 계열을 자연스러운 한국어로 옮기되, 신적 자기현현의 뉘앙스를 살리기 위해 ‘자신을 나타내다’를 선택했습니다.
- source_word: in deserto ... quod non calcatur et
  english_pob_choice: in the untrodden and fruitless desert
  chosen_korean: 발길이 닿지 않았으며 열매 없는 사막
  alternatives_korean:
  - 사람이 밟지 않은 메마른 광야
  - 밟히지 않고 열매 맺지 않는 광야
  lexicon: desertum / non calcatur
  rationale: ‘calcatur’의 문자적 의미를 반영해 ‘발길이 닿지 않았으며’로, ‘fruitless’는 사막의 생산성 부재를 드러내는 ‘열매 없는’으로 옮겼습니다.
theological_decisions:
- issue: ‘among us to our fathers’의 관계 구조
  chosen_reading: ‘우리 가운데서 우리 조상들에게’로 옮겨, 현현이 현재 공동체의 자리에서 조상들에게 주어진 사건임을 함께 드러냈습니다.
  alternative_readings:
  - ‘우리 조상들에게 우리 가운데서’
  - ‘우리 조상들 가운데서’
  rationale: 라틴어의 전치사구 배열이 다소 중첩되어 있어, 의미상 두 대상(우리 가운데, 우리 조상들) 모두를 보존하는 쪽이 본문의 역사-언약적 호소를 더 잘 나타냅니다.
  doctrine_reference: 구속사적 회상과 언약의 하나님 현현
