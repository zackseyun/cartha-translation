    rationale: animo는 이 문맥에서 내면적 비통함을 나타냅니다. "마음이 몹시 쓰리고"는 원문의 정서적 상태를 자연스럽게 보존하면서 영혼/영이라는 특정한 용어 선택을 피합니다.
