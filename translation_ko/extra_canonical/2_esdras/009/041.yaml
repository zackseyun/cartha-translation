id: 2ES.9.41
reference: 2 Esdras 9:41
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: dimitte me, dominus meus, ut defleam me et adiciam dolorem, quoniam valde amara sumanimo et humiliata sum valde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/041.yaml
  text: She said to me, “Leave me, my lord, so that I may weep for myself and add to my sorrow, for I am very bitter in spirit and greatly humbled.”
translation:
  language: ko
  text: 그녀가 제게 말했습니다. 「저를 놓아 주십시오, 나의 주님. 제가 제 처지를 슬퍼하며 제 슬픔을 더하게 해 주십시오. 저는 마음이 몹시 쓰리고 크게 낮아졌습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dimitte me
  english_pob_choice: Leave me
  chosen_korean: 저를 놓아 주십시오
  alternatives_korean:
  - 저를 떠나게 해 주십시오
  - 저를 버려 두십시오
  lexicon: dimittere → 놓아 주다
  rationale: 직접적인 ‘떠남’보다 요청의 뉘앙스가 분명한 ‘놓아 주십시오’로 옮겨 원문의 허용 요청을 살렸습니다.
- source_word: defleam me
  english_pob_choice: weep for myself
  chosen_korean: 제가 저 자신을 위해 울며
  alternatives_korean:
  - 제가 제 자신을 위해 애통하며
  - 제가 저를 위해 통곡하며
  lexicon: deflere → 울다, 슬퍼하다
  rationale: POB의 수정에 맞춰 ‘weep’의 직접성을 살려 ‘울며’로 번역하고, 목적어를 보존해 자기 비탄의 초점을 유지했습니다.
- source_word: valde amara sum animo
  english_pob_choice: I am very bitter in spirit
  chosen_korean: 저는 영으로 매우 쓰리고
  alternatives_korean:
  - 저는 마음이 몹시 쓰리고
  - 저는 속이 매우 쓰리고
  lexicon: amarus + animus → 쓰라다 + 영
  rationale: animo를 단순 감정이 아니라 내면의 상태로 받아 ‘영으로’로 옮기되, ‘bitter’는 ‘쓰리다’로 재현해 정서적 고통을 직접적으로 드러냈습니다.
- source_word: humiliata sum valde
  english_pob_choice: greatly humbled
  chosen_korean: 크게 낮아졌습니다
  alternatives_korean:
  - 몹시 겸손해졌습니다
  - 크게 겸비되었습니다
  lexicon: humiliare → 낮추다
  rationale: 문맥상 도덕적 겸손보다 수치와 억눌림의 상태가 강하므로, ‘겸손해지다’보다 더 원문에 가까운 ‘낮아지다’를 선택했습니다.
theological_decisions:
- issue: humiliata sum valde의 정서적·사회적 뉘앙스
  chosen_reading: ‘크게 낮아졌습니다’로 번역해, 내적 겸손과 함께 굴욕적 저하의 감각을 함께 보존했습니다.
  alternative_readings:
  - ‘몹시 겸손해졌습니다’
  - ‘크게 눌렸습니다’
  rationale: 라틴어 humiliata는 단순한 미덕으로서의 겸손보다 ‘낮아짐/굴욕’의 폭을 포함할 수 있어, 본문이 허용하는 긴장을 유지하는 번역이 필요합니다.
  doctrine_reference: 겸손과 수치의 이중 의미 보존
