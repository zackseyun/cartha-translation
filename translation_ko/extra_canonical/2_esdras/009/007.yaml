lexical_decisions:
- source_word: et erit
  english_pob_choice: And it shall be
  chosen_korean: 그리고 이렇게 될 것입니다
  alternatives_korean:
  - 그리고 이는 일어날 것입니다
  - 그리고 그때가 될 것입니다
  lexicon: N/A
  rationale: 라틴어의 예언적 도입구를 살려 단순한 서술보다 종말론적 선언의 문체로 옮겼습니다.
- source_word: salvus factus fuerit
  english_pob_choice: everyone who is saved
  chosen_korean: 구원받은 사람은 누구든지
  alternatives_korean:
  - 구원을 받은 사람은 누구든지
  - 구원될 사람은 누구든지
  lexicon: N/A
  rationale: 완료·수동의 결과 상태를 자연스럽게 반영하면서도, POB 개정의 취지처럼 현재적 ‘구원받은’ 상태를 살렸습니다.
- source_word: effugere per opera sua vel per fidem
  english_pob_choice: is able to escape by his works or by the faith
  chosen_korean: 자기의 행위로든지 또는 자기가 믿었던 믿음으로든지 도피할 수 있는 사람은
  alternatives_korean:
  - 자기 행위로든지 또는 믿은 믿음으로든지 피할 수 있는 사람은
  - 자기의 행위나 믿음으로 피할 수 있는 사람은
  lexicon: N/A
  rationale: effugere를 단순한 ‘구하다’보다 ‘도피하다/피하다’로 옮겨, 본문이 말하는 탈출·회피의 이미지를 유지했습니다.
- source_word: fidem in qua credidit
  english_pob_choice: the faith in which he believed
  chosen_korean: 자기가 믿었던 믿음으로든지
  alternatives_korean:
  - 그가 믿었던 믿음으로든지
  - 그가 신뢰했던 믿음으로든지
  lexicon: N/A
  rationale: 라틴어의 반복적 강조를 살리되, 한국어에서는 중복을 줄여 ‘믿음’의 대상성과 행위성을 함께 드러냈습니다.
theological_decisions:
- issue: 원문이 구원과 탈출 가능성을 병렬로 제시하는 긴장
  chosen_reading: ‘구원받은 사람’과 ‘도피할 수 있는 사람’을 함께 두어, 본문이 제시하는 종말론적 조건과 가능성의 긴장을 그대로 유지했습니다.
  alternative_readings:
  - ‘구원될 사람’으로 통일하여 미래적 의미를 강조
  - ‘살아남을 사람’으로 완화하여 결과만 강조
  rationale: 라틴어 salvus factus fuerit와 effugere의 병치를 평준화하지 않고, POB의 주석적 긴장을 보존하는 쪽이 소스에 더 충실합니다.
  doctrine_reference: 본문 비평/종말론적 경고의 긴장 보존
- issue: 기호적 예언 도입구의 처리
  chosen_reading: et erit을 ‘그리고 이렇게 될 것입니다’로 옮겨 예언·계시 문체를 살렸습니다.
  alternative_readings:
  - 도입구를 생략
  - ‘그리고 일어날 것입니다’로만 번역
  rationale: 원문에 있는 선언적 틀을 보존해야 문장의 무게와 계시적 톤이 유지됩니다.
  doctrine_reference: 예언 문체 보존
