id: 2ES.9.17
reference: 2 Esdras 9:17
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qualis ager, talia et semina, et quales flores, tales et tincturae, et qualis opera, talis et creatio, et qualis agricola, talis et area. quoniam tempus erat saeculi,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/017.yaml
  text: He answered me and said[a], “As the field is, so also are the seeds; and as the flowers are, so also are the colors; and as the work is, so also is the creation; and as the farmer is, so also is the threshing floor. For there was a time of the age,”
  footnotes:
  - marker: a
    text: Or 'For such was the time of the age:'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. 「밭이 어떠하면 씨도 그러하고, 꽃이 어떠하면 색깔도 그러하며, 일이 어떠하면 창조도 그러하고, 농부가 어떠하면 타작마당도 그러합니다. 이는 세상의 때가 있었기 때문입니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 「이는 세상의 때가 그러하였기 때문입니다」.
    reason: previous_rendering
lexical_decisions:
- source_word: qualis ager, talia et semina
  english_pob_choice: As the field is, so also are the seeds
  chosen_korean: 「밭이 어떠하면 씨도 그러하고」
  alternatives_korean:
  - 밭이 어떠하면 씨도 그러합니다
  - 밭이 어떠하듯 씨도 그러합니다
  lexicon: qualis / talia
  rationale: 원문의 평행구조를 살려 조건-대응 관계를 직접적으로 표현했습니다. '씨들'보다 단수 '씨'가 한국어에서 속담적 병렬을 자연스럽게 유지합니다.
- source_word: quales flores, tales et tincturae
  english_pob_choice: as the flowers are, so also are the colors
  chosen_korean: 「꽃이 어떠하면 색깔도 그러하며」
  alternatives_korean:
  - 꽃이 어떠하면 빛깔도 그러하며
  - 꽃이 어떠하면 색도 그러하며
  lexicon: flores / tincturae
  rationale: tincturae는 직역하면 '염색/물듦' 쪽이지만, 문맥상 꽃과 대응하는 외양의 '색깔'로 옮기는 것이 원문의 비유를 가장 자연스럽게 드러냅니다.
- source_word: qualis opera, talis et creatio
  english_pob_choice: and as the work is, so also is the creation
  chosen_korean: 「일이 어떠하면 창조도 그러하고」
  alternatives_korean:
  - 일이 어떠하면 창조도 그러하며
  - 일의 모양이 어떠하면 창조도 그러하고
  lexicon: opera / creatio
  rationale: opera와 creatio의 대구를 보존하기 위해 둘 다 추상명사로 살렸습니다. '창조'는 하나님의 창조행위와 그 결과라는 중층 의미를 열어 둡니다.
- source_word: qualis agricola, talis et area
  english_pob_choice: and as the farmer is, so also is the threshing floor
  chosen_korean: 「농부가 어떠하면 타작마당도 그러합니다」
  alternatives_korean:
  - 농부가 어떠하면 타작마당도 그러하며
  - 농부가 어떠하면 타작마당도 그러하고
  lexicon: agricola / area
  rationale: area는 단순한 '마당'이 아니라 타작이 이루어지는 장소이므로 '타작마당'으로 구체화했습니다. 한국어에서 장면성을 살리면서도 원문의 대응 구조를 유지합니다.
- source_word: quoniam tempus erat saeculi
  english_pob_choice: For there was a time of the age
  chosen_korean: 「이는 세상의 때가 있었기 때문입니다」
  alternatives_korean:
  - 이는 세상의 때가 있었기 때문입니다
  - 이는 그 시대의 때가 있었기 때문입니다
  lexicon: quoniam / tempus / saeculi
  rationale: 문맥상 새로 추가된 'such'를 배제하고, 단순한 원인절로 옮겼습니다. saeculi는 '세상/시대' 모두 가능하지만, POB의 'age'에 대응하여 '세상'으로 옮기되 시간성은 '때'로 드러냈습니다.
theological_decisions:
- issue: saeculi의 범위와 시간성
  chosen_reading: '''세상의 때''로 옮겨, 시대의 질적 성격보다 그 시점/시기를 나타내는 시간 절을 우선 드러냈습니다.'
  alternative_readings:
  - '''시대의 때'''
  - '''그 시대의 때'''
  rationale: 최근 수정에서 'such'가 제거된 만큼, 본문은 세대의 성격 진술보다 '그때가 있었다'는 시간 표지를 강조합니다. 한국어에서도 이 긴장을 유지해야 다음 절과의 연결이 살아납니다.
  doctrine_reference: apocryphal/extra-canonical narrative syntax
