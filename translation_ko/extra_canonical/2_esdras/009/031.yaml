    rationale: 원문은 “야곱아, 내 말에 귀를 기울이십시오”로 시작하지만 초안은 곧바로 ‘보라’부터 시작합니다. 이는 영어 POB 발췌문에는 보이지 않더라도 제시된 원어 본문에 있는 내용을 누락한 것입니다.
  - severity: medium
    issue: in vobis를 ‘너희 가운데’로 번역
    rationale: 여기서 in vobis는 율법이 공동체의 ‘가운데’에 뿌려진다는 공간적 의미보다 수신자들 ‘안에’ 뿌려져 작용한다는 표현에 가깝습니다. 뒤따르는 ‘너희 안에서’와도 일관되게 옮기는 것이 좋습니다.
  revised_text: “야곱아, 내 말에 귀를 기울이십시오. 보십시오, 내가 너희 안에 내 율법을 뿌립니다. 그러면 그것이 너희 안에서 열매를 맺을 것이며, 너희는 그것으로 영원히 영광을 받게 될 것입니다.”
