source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Iacob intendite sermonibus meis. Ecce enim semino in uobis legem meam, et faciet in uobis fructum, et glorificabimini in eo per saeculum. Nam patres nostri accipientes legem non seruauerunt et legitima non custodierunt, et factus est fructus legis non periens; nec enim poterat quoniam tuus erat. Nam qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/031.yaml
  text: For behold, I sow my law in you, and it will bear fruit in you, and by it you will be glorified forever.’
translation:
  language: ko
  text: “야곱아, 내 말에 귀를 기울이십시오. 보십시오, 내가 너희 안에 내 율법을 뿌립니다. 그러면 그것이 너희 안에서 열매를 맺을 것이며, 너희는 그것으로 영원히 영광을 받게 될 것입니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Iacob intendite sermonibus meis
  english_pob_choice: For behold
  chosen_korean: 보라
  alternatives_korean:
  - 이제
  - 잘 들어라
  lexicon: Latin interjection / discourse marker
  rationale: 경구를 여는 주의 환기 표현으로서, 영어 POB의 ‘For behold’를 자연스럽게 받으면서도 예언적 선언의 긴박함을 살리기 위해 ‘보라’를 선택했습니다.
- source_word: legem meam
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 내 법
  - 내 교훈
  lexicon: lexical
  rationale: 라틴어 lex는 여기서 단순한 일반 법보다 하나님이 주시는 규범적 계시를 가리키므로, 한국어 성경어휘인 ‘율법’이 원문의 무게를 가장 잘 반영합니다.
- source_word: semino ... in uobis
  english_pob_choice: I sow ... in you
  chosen_korean: 너희 가운데 ... 뿌립니다
  alternatives_korean:
  - 너희 안에 ... 심습니다
  - 너희 속에 ... 뿌립니다
  lexicon: imagery
  rationale: ‘sow’의 농사 이미지를 보존하되, 뒤의 열매 맺음과 자연스럽게 연결되도록 ‘너희 가운데’에 뿌린다고 옮겼습니다.
- source_word: fructum
  english_pob_choice: bear fruit
  chosen_korean: 열매를 맺고
  alternatives_korean:
  - 결실을 맺고
  - 열매가 생기고
  lexicon: imagery
  rationale: 원문의 ‘fructus’ 이미지를 그대로 살려 결과의 성장성과 생명력을 드러내는 표현으로 옮겼습니다.
- source_word: glorificabimini in eo per saeculum
  english_pob_choice: by it you will be glorified forever
  chosen_korean: 그것으로 영원히 영광을 받게 될 것입니다
  alternatives_korean:
  - 그것으로 영원히 영화롭게 될 것입니다
  - 그 안에서 영원히 영광을 얻게 될 것입니다
  lexicon: theological
  rationale: 라틴어 수동형을 한국어 수동 ‘영광을 받다’로 옮겨 행위 주체를 흐리지 않았고, ‘per saeculum’은 영속성을 분명히 하기 위해 ‘영원히’로 처리했습니다.
theological_decisions:
- issue: 하나님의 율법이 ‘뿌려져’ 내적으로 열매 맺는다는 이미지
  chosen_reading: 외적 강요가 아니라 내면화된 계시와 순종의 ফল이라는 뜻으로 읽었습니다.
  alternative_readings:
  - 교육적 권면의 비유로만 읽음
  - 농경 은유를 약화시켜 단순한 전달 행위로 읽음
  rationale: 본문은 ‘내 율법’을 ‘뿌린다’고 하여 율법의 내면적 작용을 강조하므로, 이를 단순 전달보다 인격적이고 변혁적인 언어로 살려야 합니다.
  doctrine_reference: 예레미야 31:33의 새 언약적 내면화 모티프와 연결되는 표현
