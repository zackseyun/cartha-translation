- from: 내가 보니, 그들을 아주 큰 어려움으로 간신히 살려 두었고, 나를 위하여 무리에서 포도 한 송이와 큰 숲에서 한 그루를 구해 두었습니다.[a]
  to: 내가 보고, 그들을 몹시 힘들게 간신히 살려 두었으며, 포도송이에서 포도알 하나와 큰 숲에서 묘목 하나를 나 자신을 위하여 보존해 두었습니다.[a]
  rationale: 원문의 두 병렬 표현을 정확히 복원하여 ‘포도송이—포도알’, ‘큰 숲—묘목’으로 옮기고, 보존 행위의 목적어와 mihi의 범위를 명료하게 했습니다. 영어 POB가 채택한 ‘forest’는 유지하되, 라틴어 표면형과의 차이는 본문비평 주석으로만 처리했습니다.
