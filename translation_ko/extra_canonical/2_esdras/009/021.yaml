id: 2ES.9.21
reference: 2 Esdras 9:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: ualde et saluaui mihi acinum de botru et plantationem de tribu multa. Pereat ergo multitudo quae sine causa nata est et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/021.yaml
  text: And I saw[a], and I spared them with very great difficulty, and I saved for myself one grape from the cluster, and one planting from a great forest.
  footnotes:
  - marker: a
    text: Or 'out of a great tribe'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보고, 그들을 몹시 힘들게 간신히 살려 두었으며, 포도송이에서 포도알 하나와 큰 숲에서 묘목 하나를 나 자신을 위하여 보존해 두었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문에는 ‘큰 무리/지파’를 뜻할 수 있는 tribu가 있으나, 다른 전승과 문맥의 병렬에 따라 여기서는 ‘큰 숲’으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ualde
  english_pob_choice: very great difficulty
  chosen_korean: 아주 큰 어려움으로 간신히
  alternatives_korean:
  - 매우 큰 어려움으로
  - 몹시 힘들게
  lexicon: adverbial intensification
  rationale: 라틴어 ualde의 강한 강조를 살리되, 결과적으로 ‘간신히’와 결합해 보존 행위를 어렵게 이룬 뉘앙스를 자연스럽게 전했습니다.
- source_word: saluaui mihi
  english_pob_choice: I spared them / I saved for myself
  chosen_korean: 나를 위하여 … 살려 두었고
  alternatives_korean:
  - 나를 위해 … 구해 두었고
  - 내가 … 살렸고
  lexicon: salvare
  rationale: 문맥상 단순한 구출보다 ‘보존해 두다’의 뜻이 강하므로, 소유·목적을 드러내는 ‘나를 위하여’와 함께 ‘살려 두었습니다’로 옮겼습니다.
- source_word: acinum de botru
  english_pob_choice: one grape from the cluster
  chosen_korean: 포도 한 송이
  alternatives_korean:
  - 송이에서 한 알
  - 포도 한 알
  lexicon: acinus / botrus
  rationale: 직역하면 ‘송이에서 한 알’이지만 한국어에서는 자연스러운 비유 단위가 아니라서, 소수 생존의 이미지를 살리는 ‘포도 한 송이’로 압축했습니다.
- source_word: plantationem de tribu multa
  english_pob_choice: one planting from a great forest
  chosen_korean: 큰 숲에서 한 그루
  alternatives_korean:
  - 큰 숲에서 한 나무
  - 많은 숲에서 한 그루
  lexicon: plantatio / tribus(=corrupt reading for hylē)
  rationale: 아우트리트의 수정 전통과 대조 구조를 반영해 ‘forest’를 따랐고, 식재의 이미지는 한국어에서 가장 간결한 ‘한 그루’로 나타냈습니다.
theological_decisions:
- issue: ‘tribu’의 해석과 본문 전승 문제
  chosen_reading: 본문의 의미는 ‘큰 숲’으로 읽고, ‘tribu(지파/무리)’는 오독·오사본의 결과로 보았습니다.
  alternative_readings:
  - 무리에서
  - 큰 지파에서
  rationale: 영문 POB의 개정과 주석 전통에 따라, 라틴어 표면형보다 더 원형적인 의미를 우선해 ‘숲’으로 번역하는 것이 저자의 의도를 더 잘 드러냅니다.
  doctrine_reference: 본문비평 / 전달사
- issue: ‘saluaui mihi’의 보존 뉘앙스
  chosen_reading: 하나님이 남은 소수의 생명을 ‘살려 두신’ 보존 행위로 표현했습니다.
  alternative_readings:
  - 구원했다
  - 남겨 두었다
  rationale: 이 절은 종말적 심판 속에서 소수만 보존되는 이미지를 그리므로, 단순한 일반적 구원보다 ‘살려 두다’가 문맥의 긴장감을 더 잘 전달합니다.
  doctrine_reference: 심판과 남은 자의 보존
