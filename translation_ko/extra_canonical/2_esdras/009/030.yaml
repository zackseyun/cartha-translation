translation:
  language: ko
  text: 그리고 당신은 말씀하셨습니다. 「이스라엘아, 내 말을 들으라. 야곱의 씨야, 내 말들에 귀를 기울이라」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 dicens dixisti는 ‘말하며 말했다’는 중첩 표현을 이루며, 이를 한국어에서는 반복 감각을 살려 옮겼습니다.
    reason: source_note
lexical_decisions:
- source_word: dicens dixisti
  english_pob_choice: and you said, saying
  chosen_korean: 그리고 당신은 말씀하셨습니다
  alternatives_korean:
  - 그리고 당신은 말하셨습니다
  - 그리고 당신은 말씀하여 이르셨습니다
  lexicon: 라틴어 반복 표현
  rationale: dicens dixisti는 단순한 ‘말했다’보다 반복·강조를 드러내는 중첩 표현이므로, 한국어에서도 ‘말씀하셨습니다’ 앞에 ‘그리고’를 두어 서술의 중복성을 살렸습니다.
- source_word: Tu Israel audi me
  english_pob_choice: Hear me, O Israel
  chosen_korean: 「이스라엘아, 내 말을 들으라」
  alternatives_korean:
  - 「이스라엘아, 내 말을 들어라」
  - 「이스라엘아, 내 말을 들으십시오」
  lexicon: audi me
  rationale: 직접호격과 명령형을 살려 ‘들으라’로 옮겼고, 본문이 예언적/호소적 어조이므로 구어적 평서보다 긴장감 있는 명령형을 유지했습니다.
- source_word: et semen Iacob
  english_pob_choice: O seed of Jacob
  chosen_korean: 야곱의 씨야
  alternatives_korean:
  - 야곱의 씨여
  - 야곱의 자손아
  lexicon: semen Iacob
  rationale: semen의 직역은 ‘씨’이지만, 여기서는 집합적 호칭으로 쓰이므로 ‘야곱의 씨야’로 옮겨 원문의 표현을 보존했습니다.
- source_word: et dicens dixisti
  english_pob_choice: and you said, saying
  chosen_korean: 그리고 당신은 말씀하셨습니다
  alternatives_korean:
  - 그리고 당신은 말씀하시며 말씀하셨습니다
  - 그리고 당신은 이르시며 말씀하셨습니다
  lexicon: Semitic-style pleonasm
  rationale: 라틴어의 ‘말하며 말했다’는 셈어적 중첩을 반영하므로, 한국어에서는 과도한 직역을 피하되 중복 감각이 살아나도록 단순한 접속부사와 동사 반복으로 처리했습니다.
theological_decisions:
- issue: 예언적 직접 화법의 존칭 수준
  chosen_reading: 본문 화자는 하나님께서 이스라엘과 야곱의 씨를 직접 부르시는 장면으로 이해하여, 한국어에서는 서술부에 ‘말씀하셨습니다’를 쓰고 인용문 안에서는 선지자적 명령형을 유지했습니다.
  alternative_readings:
  - 전체를 평서체로 낮춰 번역
  - 인용문 안을 공손체로 완화
  rationale: 직접 인용의 긴박성과 권위를 보존하는 것이 본문 기능에 더 부합하며, 한국어 합쇼체 서술과 명령형 인용의 병행이 원문의 수사 효과를 가장 잘 드러냅니다.
  doctrine_reference: 예언적 소명과 언약 백성에 대한 직접 권면
