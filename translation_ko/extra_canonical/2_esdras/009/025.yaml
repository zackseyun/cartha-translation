  text: I will come and speak with you. And I went out, as he told me, into the field that is called
translation:
  language: ko
  text: “내가 가서 당신과 말하겠습니다.” 그리고 나는 그가 내게 말한 대로 나가, ‘라고 불리는 들판으로 갔습니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 라틴어 문장이 절 끝에서 끊겨 있어, 뒤에 이어질 지명은 다음 절에 속합니다.
    reason: source_note
lexical_decisions:
- source_word: ueniam et loquar tecum
  english_pob_choice: I will come and speak with you
  chosen_korean: “내가 가서 당신과 말하겠습니다.”
  alternatives_korean:
  - “내가 와서 당신과 말하겠습니다.”
  - “제가 가서 당신과 이야기하겠습니다.”
  lexicon: ueniam / loquar
  rationale: 미래형의 약속과 직접 대화를 함께 살려, 자연스러운 현대 한국어로 ‘가서 말하겠습니다’라고 옮겼습니다. ‘말하다’는 본문의 직접적 발화를, ‘이야기하다’는 다소 완화된 뉘앙스를 피합니다.
- source_word: Et profectus sum
  english_pob_choice: And I went out
  chosen_korean: 그리고 나는 그가 내게 말한 대로 나가
  alternatives_korean:
  - 그리고 나는 갔습니다
  - 그리고 나는 출발했습니다
  lexicon: proficiscor
  rationale: profectus sum은 단순 이동보다 ‘출발하여 나가다’에 가깝기 때문에, 앞절의 명령/지시에 따른 실행을 드러내도록 ‘나가’로 옮겼습니다.
- source_word: sicut dixit mihi
  english_pob_choice: as he told me
  chosen_korean: 그가 내게 말한 대로
  alternatives_korean:
  - 그가 내게 말한 대로
  - 그가 나에게 일러준 대로
  lexicon: sicut + dicere
  rationale: 순응의 의미를 분명히 하기 위해 ‘말한 대로’로 옮겼고, 구어적이지만 본문에 충실한 표현으로 유지했습니다.
- source_word: in campum quod vocatur
  english_pob_choice: into the field that is called
  chosen_korean: ‘라고 불리는 들판으로
  alternatives_korean:
  - ‘라고 불리는 들판으로
  - ‘이라고 부르는 들판으로
  lexicon: campus + vocari
  rationale: campus는 여기서 지리적 ‘들판’으로 이해하는 것이 자연스럽고, vocatur는 수동적 명명 표현이므로 한국어에서는 관용적으로 ‘~라고 불리는’으로 처리했습니다.
