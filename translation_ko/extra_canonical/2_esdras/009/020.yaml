  text: And I considered my world, and behold, it was ruined; and my inhabited world, and behold, it was in peril because of the schemes that had come into it.
translation:
  language: ko
  text: 그리고 나는 보았습니다. 그리고 나는 그들을 겨우 불쌍히 여겼습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et uidi
  english_pob_choice: And I saw
  chosen_korean: 그리고 나는 보았습니다
  alternatives_korean:
  - 그리고 나는 보았습니다
  - 그리고 나는 보았고
  lexicon: uideo → 보다
  rationale: 라틴어의 단순 과거형을 자연스러운 서술체로 옮겨, 앞선 장면을 직접 목격한 행위를 간결하게 드러냈습니다.
- source_word: peperci eis uix
  english_pob_choice: And I spared them with difficulty
  chosen_korean: 그리고 나는 그들을 겨우 불쌍히 여겼습니다
  alternatives_korean:
  - 그리고 나는 그들을 겨우 용서했습니다
  - 그리고 나는 그들을 가까스로 불쌍히 여겼습니다
  lexicon: parco → 아끼다/용서하다/불쌍히 여기다
  rationale: 문맥상 단순한 감정이 아니라 멸망 직전의 대상에 대한 유보적 자비를 나타내므로, 한국어에서는 ‘불쌍히 여기다’로 살리고 부사 ‘겨우’로 uix의 어려움을 반영했습니다.
theological_decisions:
- issue: 라틴어 본문이 전하는 최종 절의 의미가 ‘보았다’와 ‘겨우 불쌍히 여겼다’로 매우 압축되어 있음
  chosen_reading: 본문의 현존하는 라틴어 단락만 따라, 앞절의 ‘세계/거주 세계’ 내용은 본절에 끌어오지 않았습니다.
  alternative_readings:
  - 앞절과 합쳐 ‘내 세상, 거주하는 세상’으로 확장하는 읽기
  - ‘위태로웠다’까지 포함하는 확장 번역
  rationale: 제공된 source text의 마지막 절단된 구문은 별도 서술을 요구하지 않으므로, 주어진 잔존 문장만 번역해 텍스트 경계를 보존했습니다.
  doctrine_reference: 텍스트 경계 보존 원칙
