  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hoc parato et mensa indeficienti et lege inuestigabili, corrupti sunt moribus eorum. Et consideraui saeculum meum et ecce
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/019.yaml
  text: But those created in this prepared world[a], with an unfailing table and an unsearchable law, have been corrupted in their ways. And I considered my age, and behold,
  footnotes:
  - marker: a
    text: The phrase 'an unfailing table and an unsearchable law' is difficult in Latin. The sense appears to be that full provision and divine instruction had already been set before humanity, yet they were corrupted in their ways.
    reason: textual_variant
    anchor_ref: '9:19'
translation:
  language: ko
  text: 그러나 이 준비된 세상 가운데서, 끊이지 않는 상과 헤아릴 수 없는 율법과 함께 지음 받은 이들은 그들의 행실로 타락하였습니다. 그리고 저는 제 시대를 생각하였고, 보라,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 mensa indeficienti와 lege inuestigabili는 직역상 난해합니다. 문맥상 ‘끊이지 않는 상’과 ‘헤아릴 수 없는 율법’으로, 이미 주어진 충분한 공급과 계시를 가리키는 표현으로 이해했습니다.
    reason: textual_variant
lexical_decisions:
- source_word: hoc parato
  english_pob_choice: this prepared world
  chosen_korean: 이 준비된 세상
  alternatives_korean:
  - 이 마련된 세상
  - 이 예비된 세상
  lexicon: prepared
  rationale: hoc parato를 사전 준비된 창조 질서로 읽어, ‘준비된’으로 자연스럽게 옮겼습니다.
- source_word: mensa indeficienti
  english_pob_choice: an unfailing table
  chosen_korean: 끊이지 않는 상
  alternatives_korean:
  - 끊이지 않는 식탁
  - 모자람 없는 상
  lexicon: table
  rationale: mensa는 문자적으로 ‘상’이지만, 공급의 이미지를 살려 ‘끊이지 않는’으로 그 의미를 드러냈습니다.
- source_word: lege inuestigabili
  english_pob_choice: an unsearchable law
  chosen_korean: 헤아릴 수 없는 율법
  alternatives_korean:
  - 찾아낼 수 없는 율법
  - 헤아릴 수 없는 법
  lexicon: law
  rationale: lege는 문맥상 일반 법보다 하나님의 규범을 가리키므로 ‘율법’으로 두고, inuestigabili는 이해 불가성을 살려 ‘헤아릴 수 없는’으로 옮겼습니다.
- source_word: corrupti sunt moribus eorum
  english_pob_choice: have been corrupted in their ways
  chosen_korean: 그들의 행실로 타락하였습니다
  alternatives_korean:
  - 그들의 길에서 부패하였습니다
  - 그들의 방식으로 타락하였습니다
  lexicon: corrupted
  rationale: moribus는 단순한 외적 행위보다 삶의 습관과 행실을 가리키므로 ‘행실’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 세상의 풍성한 공급과 계시에도 불구하고 인간이 타락했다는 대비
  chosen_reading: ‘끊이지 않는 상’과 ‘헤아릴 수 없는 율법’을 하나님의 충분한 공급과 계시로 이해하여, 그럼에도 인간의 도덕적 타락이 이어졌다는 대비를 살렸습니다.
  alternative_readings:
  - 물질적 잔치상에 대한 단순 묘사
  - 철학적 법칙에 대한 일반 진술
  rationale: 문맥상 대비의 핵심은 준비된 창조와 제공된 규범에 대한 인간의 실패이므로, 공급과 계시의 신학적 긴장을 보존했습니다.
  doctrine_reference: 창조의 선함과 인간 타락
- issue: ‘그리고 저는 제 시대를 생각하였고, 보라,’의 미완 결말
  chosen_reading: 문장 끝의 ‘보라,’를 남겨 다음 절로 이어지는 비상한 관찰의 흐름을 보존했습니다.
  alternative_readings:
  - 문장을 매끈하게 종결
  - 감탄을 약화하여 완결형으로 처리
  rationale: 라틴 원문의 미완성 연결을 살려 내러티브의 호흡과 긴박감을 유지했습니다.
  doctrine_reference: 본문 흐름 보존
