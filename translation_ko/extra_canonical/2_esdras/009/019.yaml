  terminology: lex(lege)는 본문 및 영어 감사 기록을 따라 ‘율법’으로 유지했습니다. inuestigabili의 난해성과 영어 POB의 ‘unsearchable’를 반영하여 ‘탐구할 수 없는’으로 옮기되, 주석에서 라틴어의 해석상 어려움을 명시했습니다.
