  text: domus non est aedificata, et manduca solummodo de floribus campi, et carnem non gustabis et uinum non bibes, sed solummodo flores—Et deprecare altissimum sine intermissione, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/024.yaml
  text: Go into a field where no house has been built, and eat only the flowers of the field. You shall not taste meat, and you shall not drink wine, but only flowers. And pray to the Most High without ceasing, and
translation:
  language: ko
  text: 사람이 세운 집이 없는 들판으로 가서, 들의 꽃들만 드십시오. 고기도 맛보지 말고 포도주도 마시지 말고, 오직 꽃들만 드십시오. 그리고 지극히 높으신 분께 끊임없이 기도하십시오. 그리고[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'lat. sine intermissione: ‘끊임없이’ 또는 ‘쉬지 말고’로 옮길 수 있습니다.'
    reason: lexical_alternative
lexical_decisions:
- source_word: domus non est aedificata
  english_pob_choice: where no house has been built
  chosen_korean: 사람이 세운 집이 없는
  alternatives_korean:
  - 집이 지어지지 않은
  - 아직 집이 없는
  lexicon: domus
  rationale: 라틴어 수동 표현의 상태를 살려, 단순히 장소 설명이 아니라 ‘세워진 집이 없음’을 드러내는 쪽으로 옮겼습니다.
- source_word: manduca solummodo de floribus campi / flores
  english_pob_choice: eat only the flowers of the field ... but only flowers
  chosen_korean: 들의 꽃들만 ... 오직 꽃들만
  alternatives_korean:
  - 들꽃만 ... 오직 들꽃만
  - 야생화만 ... 오직 야생화만
  lexicon: manduca / flores
  rationale: campi는 단순한 ‘들판’이지만 반복되는 flores를 같은 어휘로 유지해 본문의 금욕적 반복을 살렸습니다.
- source_word: carnem non gustabis et uinum non bibes
  english_pob_choice: You shall not taste meat, and you shall not drink wine
  chosen_korean: 고기도 맛보지 말고 포도주도 마시지 말고
  alternatives_korean:
  - 고기도 먹지 말고 포도주도 마시지 말고
  - 고기도 맛보지 못하고 포도주도 마시지 못하고
  lexicon: carnem / uinum / gustare / bibere
  rationale: gustabis를 ‘먹다’보다 더 근접한 ‘맛보다’로 옮겨 음식 금지를 더 직접적으로 드러냈고, uinum은 한국어 성경 전통에 맞는 ‘포도주’를 유지했습니다.
- source_word: deprecare altissimum sine intermissione
  english_pob_choice: pray to the Most High without ceasing
  chosen_korean: 지극히 높으신 분께 끊임없이 기도하십시오
  alternatives_korean:
  - 지극히 높으신 분께 쉬지 말고 기도하십시오
  - 가장 높으신 분께 끊임없이 기도하십시오
  lexicon: altissimum / sine intermissione
  rationale: altissimum은 신적 칭호로서 ‘지극히 높으신 분’이 가장 자연스럽고, sine intermissione는 합쇼체에서 ‘끊임없이’가 문맥상 유려합니다.
theological_decisions:
- issue: 금욕 지시의 강도와 문체
  chosen_reading: 식사와 음료를 제한하는 금욕 명령을 약화시키지 않고, 한국어에서도 반복 명령형으로 유지했습니다.
  alternative_readings:
  - 부드러운 권고형으로 완화
  - 상징적 권면으로만 처리
  rationale: 원문은 연속된 금지와 명령으로 구성되어 있어, 한국어도 명령형을 유지해야 본문의 긴박하고 규범적인 힘이 보존됩니다.
  doctrine_reference: 본문 충실성 원칙
