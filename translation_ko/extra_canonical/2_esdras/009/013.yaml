id: 2ES.9.13
reference: 2 Esdras 9:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: tu ergo adhuc noli curiosus esse quomodo impii cruciabuntur, sed inquire quomodo iusti salvabuntur, et quorum saeculum et propter quos saeculum et quando.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/013.yaml
  text: Therefore do not be curious any longer about how the ungodly will be tormented, but inquire how the righteous will be saved, and whose the age is, and for whose sake the age is, and when.
translation:
  language: ko
  text: 그러므로 이제 더 이상 악한 자들이 어떻게 고통을 당할 것인지에 대해 호기심을 갖지 말고, 의인들이 어떻게 구원을 받을 것인지, 또 그 시대는 누구의 것인지, 또 그 시대가 누구를 위하여 있는지, 그리고 그 시대가 언제인지 살피십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악한 자들’보다 더 문자적으로 ‘경건하지 않은 자들’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그 시대’는 ‘그 세상/그 시대적 질서’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: noli curiosus esse
  english_pob_choice: do not be curious any longer
  chosen_korean: 더 이상 … 호기심을 갖지 말고
  alternatives_korean:
  - 더 이상 … 궁금해하지 말고
  - 더 이상 … 자세히 알려고 하지 말고
  lexicon: curiosus
  rationale: 라틴어 curiosus esse는 단순한 정보 요청보다 지나치게 캐묻고 집착하는 태도를 가리킬 수 있어, POB의 경계 뉘앙스를 살리면서도 자연스러운 합쇼체로 옮겼습니다.
- source_word: impii cruciabuntur
  english_pob_choice: the ungodly will be tormented
  chosen_korean: 악한 자들이 어떻게 고통을 당하는지
  alternatives_korean:
  - 경건하지 않은 자들이 어떻게 고통을 당하는지
  - 불경한 자들이 어떻게 괴로움을 겪는지
  lexicon: impii / cruciabuntur
  rationale: impii는 도덕적·언약적 불경건성을 지닌 자들을 가리키므로 ‘악한 자들’로 옮겼고, cruciabuntur는 형벌의 고통을 직접 말하되 한국어에서는 ‘고통을 당하다’가 가장 덜 과장되면서도 충분히 강한 표현입니다.
- source_word: iusti salvabuntur
  english_pob_choice: the righteous will be saved
  chosen_korean: 의인들이 어떻게 구원을 받는지
  alternatives_korean:
  - 의인들이 어떻게 구원받는지
  - 의로운 사람들이 어떻게 구원을 받는지
  lexicon: iusti / salvabuntur
  rationale: iusti는 POB 기본값대로 ‘의인’으로 두고, salvabuntur는 수동형의 신적 행위를 드러내기 위해 ‘구원을 받다’로 옮겼습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 그 시대
  alternatives_korean:
  - 그 세상
  - 그 시대적 질서
  lexicon: saeculum
  rationale: saeculum은 단순한 시간표현인 ‘세대’보다 더 넓은 시대·질서의 범위를 가지므로, POB의 ‘the age’를 따라 ‘그 시대’로 번역했습니다.
theological_decisions:
- issue: 악인과 의인의 운명에 대한 질문을 제지하는 문장의 어조
  chosen_reading: 본문은 종말론적 운명에 대한 호기심을 금지하고, 구원과 시대의 주권을 묻도록 독자를 재지향합니다.
  alternative_readings:
  - 단순한 지적 호기심의 자제 권고
  - 철학적 사색의 전면 금지
  rationale: 라틴어 noli curiosus esse는 일반적 탐구 전체를 금하기보다, 심판 결과를 캐묻는 태도를 멈추고 구원의 질서에 집중하라는 경계로 읽는 것이 문맥에 가장 잘 맞습니다.
  doctrine_reference: 종말론적 분별과 인간의 한계
- issue: quorum saeculum / propter quos saeculum / quando의 병렬
  chosen_reading: ‘그 시대는 누구의 것인지, 또 그 시대가 누구를 위하여 있는지, 그리고 때가 언제인지’로 병렬 구조를 살렸습니다.
  alternative_readings:
  - ‘누구에게 속한 시대인지, 누구 때문에 그 시대가 있는지, 언제 그런지’
  - ‘그 시대의 주인이 누구인지, 그 목적이 무엇인지, 때가 언제인지’
  rationale: 세 개의 질문이 서로 다르게 반복되므로, 소유·목적·시점의 병렬을 최대한 유지해 독자가 원문의 리듬과 긴장을 느끼도록 했습니다.
  doctrine_reference: 하나님의 섭리와 감추어진 때
