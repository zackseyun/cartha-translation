  - 음식 또는 음료
  lexicon: n/a
  rationale: escas와 potus의 기본 의미를 직역하되, 한국어에서 가장 평이하고 문맥에 맞는 쌍으로 정리했습니다.
- source_word: et cum fuerit ut exterminetur quod seminatum est uel quod missum est
  english_pob_choice: And behold, it is the custom that when ...
  chosen_korean: 그리고 보십시오. ... 것은 관례입니다.
  alternatives_korean:
  - 그리고 보십시오. ... 하는 것이 관례입니다.
  - 그리고 보십시오. ... 는 일이 있습니다.
  lexicon: n/a
  rationale: 영어 POB의 관용적 도입어 ‘And behold’를 경어체 서술로 자연화했고, 뒤의 관례 진술을 현대 한국어의 ‘관례입니다’로 옮겼습니다.
