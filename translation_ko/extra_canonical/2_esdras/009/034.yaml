id: 2ES.9.34
reference: 2 Esdras 9:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uel nauem mare uel uas aliud escas uel potus, et cum fuerit ut exterminetur quod seminatum est uel quod missum est uel
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/034.yaml
  text: And behold[a], it is the custom that when the earth receives seed, or the sea a ship, or any other vessel food or drink,
  footnotes:
  - marker: a
    text: Or 'or any vessel food or drink,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 보십시오. 땅이 씨를 받거나, 바다가 배를 받거나, 그 밖의 어떤 그릇이든 음식이나 음료를 받는 것이 관례입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “어떤 그릇이든 음식이나 음료를 받는 것.”
    reason: previous_rendering
lexical_decisions:
- source_word: uel nauem mare
  english_pob_choice: the earth receives seed, or the sea a ship
  chosen_korean: 땅이 씨를 받고, 바다가 배를 받고
  alternatives_korean:
  - 땅이 씨를 받고, 바다가 배를 받고
  - 땅이 씨앗을 받고, 바다가 배를 받고
  lexicon: n/a
  rationale: 라틴어의 병렬 구조를 살려 수동적 ‘받다’ 구문으로 옮기되, 영어 POB가 보인 ‘earth/sea’ 대응을 자연스러운 한국어로 유지했습니다.
- source_word: uas aliud
  english_pob_choice: any other vessel
  chosen_korean: 다른 어떤 그릇이든
  alternatives_korean:
  - 어떤 다른 그릇이든
  - 어떤 그릇이든
  lexicon: n/a
  rationale: aliud의 ‘다른/다른 하나’라는 뉘앙스를 살려 ‘다른 어떤’으로 표현했고, ‘그릇’은 uas의 용기/받는 용도를 반영합니다.
- source_word: escas uel potus
  english_pob_choice: food or drink
  chosen_korean: 음식이나 음료
  alternatives_korean:
  - 먹을 것과 마실 것
  - 음식 또는 음료
  lexicon: n/a
  rationale: escas와 potus의 기본 의미를 직역하되, 한국어에서 가장 평이하고 문맥에 맞는 쌍으로 정리했습니다.
- source_word: et cum fuerit ut exterminetur quod seminatum est uel quod missum est
  english_pob_choice: And behold, it is the custom that when ...
  chosen_korean: 그리고 보십시오. ... 것은 관례입니다.
  alternatives_korean:
  - 그리고 보십시오. ... 하는 것이 관례입니다.
  - 그리고 보십시오. ... 는 일이 있습니다.
  lexicon: n/a
  rationale: 영어 POB의 관용적 도입어 ‘And behold’를 경어체 서술로 자연화했고, 뒤의 관례 진술을 현대 한국어의 ‘관례입니다’로 옮겼습니다.
theological_decisions:
- issue: 관찰적 진술의 어조
  chosen_reading: 예언적 선언이 아니라 일반 관습을 설명하는 관찰 문장으로 처리했습니다.
  alternative_readings:
  - 교훈적 선언으로 격상
  - 비유적 진술로 완화
  rationale: 원문은 사물들이 무엇을 ‘받는지’에 대한 관습적 예시를 나열하는 설명문이므로, 과도한 신학적 해석을 얹지 않았습니다.
  doctrine_reference: 문맥상 일반 서술 원칙
