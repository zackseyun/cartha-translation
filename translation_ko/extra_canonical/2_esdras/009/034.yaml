translation:
  language: ko
  text: 그리고 보십시오. 땅이 씨를 받고, 바다가 배를 받고, 다른 어떤 그릇이든 음식이나 음료를 받는 것은 관례입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
