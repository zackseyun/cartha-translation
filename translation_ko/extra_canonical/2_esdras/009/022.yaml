source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: seruietur acinus meus et plantatio mea, quia cum multo labore perfeci haec. Tu autem si adhuc intermittas septem dies alios—
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/022.yaml
  text: Let my grape and my planting be preserved, because I completed these with much labor. But if you still delay another seven days—
translation:
  language: ko
  text: “내 포도와 내 심은 것이 보존되게 하십시오. 내가 이것들을 큰 수고로 완성하였습니다. 그러나 당신이 아직도 다른 이레를 지체하신다면—”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: acinus는 문자적으로는 ‘포도알/열매’이지만, 여기서는 POB의 영어처럼 전체 포도 수확을 가리키는 비유적 표현으로 이해했습니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 문장이 미완으로 끝나며, 다음 문맥으로 이어지는 조건절입니다.
    reason: cultural_note
lexical_decisions:
- source_word: seruietur
  english_pob_choice: be preserved
  chosen_korean: 보존되게 하십시오
  alternatives_korean:
  - 보호되게 하십시오
  - 지켜 주십시오
  - 남게 하십시오
  lexicon: 보존되다
  rationale: 라틴어 수동형의 요청을 ‘보존되다’로 옮겨, 단순한 보호보다 이미 심어진 것의 유지·잔존을 분명히 했습니다.
- source_word: acinus meus et plantatio mea
  english_pob_choice: my grape and my planting
  chosen_korean: 내 포도와 내 심은 것
  alternatives_korean:
  - 내 포도나무와 내 심은 것
  - 내 포도송이와 내 재배한 것
  - 내 포도와 내 재배
  lexicon: 포도 / 심은 것
  rationale: acinus는 문자적으로는 포도알이지만 문맥상 수확 대상 전체를 가리키는 비유로 보아 ‘내 포도’로, plantatio는 식재 행위를 드러내는 ‘내 심은 것’으로 옮겼습니다.
- source_word: perfeci haec
  english_pob_choice: I completed these
  chosen_korean: 이것들을 완성하였습니다
  alternatives_korean:
  - 이것들을 마쳤습니다
  - 이것들을 끝냈습니다
  - 이것들을 완수하였습니다
  lexicon: 완성하다
  rationale: perfeci는 ‘완전하게 만들다’보다 ‘해당 일들을 끝까지 이루다’는 뜻이 강하므로, 과장 없이 ‘완성하였습니다’로 옮겼습니다.
- source_word: Tu autem si adhuc intermittas septem dies alios
  english_pob_choice: But if you still delay another seven days
  chosen_korean: 그러나 당신이 아직도 다른 이레를 지체하신다면
  alternatives_korean:
  - 그러나 당신이 아직도 또 다른 이레를 미루신다면
  - 하지만 당신이 또 일곱 날을 더 늦추신다면
  - 그러나 당신이 아직도 다른 일곱 날을 지체하신다면
  lexicon: 이레 / 지체하다
  rationale: septem dies alios는 ‘또 다른 일곱 날’이지만 한국어 성경어법에 맞게 ‘다른 이레’로 자연화하되, 지연의 뉘앙스는 ‘지체하신다면’으로 유지했습니다.
theological_decisions:
- issue: 화자의 요청 형식과 직설체 명령의 보존
  chosen_reading: 직설적 청유/요청으로 ‘보존되게 하십시오’와 ‘지체하신다면’을 유지했습니다.
  alternative_readings:
  - 부드러운 소망형으로 완곡하게 표현
  - 서술형으로 완화
  rationale: 본문은 간구와 조건문을 강하게 드러내므로, 한국어에서도 화자의 긴박한 요청을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 문학적-수사적 충실성
