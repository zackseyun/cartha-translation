translation:
  language: ko
  text: “내가 전에 말했고, 지금 말하며, 나중에도 말하겠습니다. 이는 구원받을 사람들보다 멸망하는 사람들이 더 많기 때문입니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘나는 지금 말하고, 나중에도 말할 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: olim locutus sum
  english_pob_choice: I have spoken before
  chosen_korean: 내가 전에 말했고
  alternatives_korean:
  - 내가 전에 말했습니다
  - 내가 예전에 말씀드렸고
  lexicon: locutus sum
  rationale: 과거의 발화 행위를 현재와 대비시키므로 완료적 표현인 ‘말했고’로 옮겨, 이전에 이미 발화가 있었음을 드러냈습니다.
- source_word: nunc dico et postea dicam
  english_pob_choice: and now I say, and I will say afterward
  chosen_korean: 지금 말하며, 그리고 나중에도 말하겠습니다
  alternatives_korean:
  - 지금 말하고, 뒤에 말하겠습니다
  - 지금 말씀하고, 그리고 이후에도 말씀하겠습니다
  lexicon: dico / dicam
  rationale: POB의 수정처럼 Latin의 locutus sum과 dico/dicam의 어휘 차이를 살려, 뒤 구절은 ‘말하다’보다 선언적 의미가 살아나는 ‘말하다’로 반복 번역했습니다.
- source_word: plures sunt qui pereunt quam qui salvabuntur
  english_pob_choice: many more perish than will be saved
  chosen_korean: 구원받을 사람들보다 멸망할 사람들이 더 많기 때문입니다
  alternatives_korean:
  - 구원받는 사람들보다 멸망하는 사람들이 더 많기 때문입니다
  - 구원될 사람들보다 망할 사람들이 더 많기 때문입니다
  lexicon: pereunt / salvabuntur
  rationale: 현재적·일반적 진술로서의 대조를 살리되, salvabuntur를 미래 수동의 뉘앙스를 유지하는 ‘구원받을’로 옮겼습니다.
theological_decisions:
- issue: 멸망과 구원의 수적 대비
  chosen_reading: 본문의 경고를 약화시키지 않고, ‘더 많기 때문입니다’로 직접적 인과를 유지했습니다.
  alternative_readings:
  - 보다 완곡한 경고문으로 바꾸기
  - ‘많은 이가’로 수량 대비를 흐리게 하기
  rationale: 라틴어의 비교 구조(plures ... quam ...)는 단순한 일반론이 아니라 실제적 다수 대비를 말하므로, 한국어에서도 명시적으로 보존했습니다.
  doctrine_reference: 종말론적 경고의 직접성 보존
