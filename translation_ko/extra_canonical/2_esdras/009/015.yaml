review_pass:
  verdict: revise
  source_fidelity: ‘pereunt’는 현재형이고 ‘salvabuntur’는 미래 수동형입니다. 초안의 ‘멸망할 사람들’은 현재형의 대조를 미래로 평준화하므로, ‘멸망하는 사람들’로 고쳐 시제 대조를 보존해야 합니다. ‘전에 말했고 / 지금 말하며 / 나중에도 말하겠습니다’는 olim locutus sum / nunc dico / postea dicam의 시간 흐름을 자연스럽게 반영합니다.
  naturalness: 합쇼체 문장으로 자연스럽습니다. ‘이는 … 때문입니다’로 인과를 이어 주면 ‘왜냐하면’보다 문어체 성경 번역 문맥에서 매끄럽고, 앞 문장 전체에 대한 근거 관계도 분명합니다.
  terminology: ‘구원받을 사람들’은 salvabuntur의 미래 수동을, ‘멸망하는 사람들’은 pereunt의 현재적 의미를 적절히 반영합니다. ‘멸망’과 ‘구원’은 본문의 종말론적 대조를 과장하거나 완화하지 않는 통상적 용어입니다.
  issues:
  - severity: medium
    issue: ‘pereunt’의 현재형이 ‘멸망할 사람들’이라는 미래형으로 옮겨졌습니다.
    rationale: 라틴어는 pereunt(현재)와 salvabuntur(미래 수동)를 구별합니다. 한국어에서도 ‘멸망하는 사람들’과 ‘구원받을 사람들’로 이 대조를 유지하는 것이 안전합니다.
  - severity: low
    issue: 각주 대안이 본문 대안 구간을 다소 불균형하게 제시합니다.
    rationale: 영어 감사 이력의 대안은 ‘and now I speak, and I will speak afterward’에 해당하므로, 한국어에서도 해당 절을 자연스럽고 완결되게 제시합니다.
  revised_text: “내가 전에 말했고, 지금 말하며, 나중에도 말하겠습니다. 이는 구원받을 사람들보다 멸망하는 사람들이 더 많기 때문입니다.”[a]
