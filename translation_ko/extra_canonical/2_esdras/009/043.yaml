id: 2ES.9.43
reference: 2 Esdras 9:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sterilis fui ego famula tua et non peperi habens maritum annis triginta.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/043.yaml
  text: She said to me, “I, your female slave, was barren and did not bear a child, though I had a husband for thirty years.”
translation:
  language: ko
  text: 그녀가 제게 말했습니다. “저는 당신의 여종이지만 아이를 낳지 못했고, 남편이 있었음에도 서른 해 동안 그러했습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: famula tua
  english_pob_choice: your female slave
  chosen_korean: 당신의 여종
  alternatives_korean:
  - 당신의 여노예
  - 당신의 여자 종
  lexicon: famula
  rationale: 라틴어 famula는 여성 종속 신분을 가리키므로, 본문 맥락에서 과도하게 생경하지 않으면서도 성별과 종속성을 드러내는 ‘여종’을 택했습니다.
- source_word: sterilis fui
  english_pob_choice: was barren
  chosen_korean: 아이를 낳지 못했고
  alternatives_korean:
  - 불임이었고
  - 아이를 낳지 못하였고
  lexicon: sterilis
  rationale: ‘barren’의 의미를 한국어 자연어로 풀어, 상태 설명과 결과를 함께 드러내는 표현으로 옮겼습니다.
- source_word: non peperi
  english_pob_choice: did not bear a child
  chosen_korean: 아이를 낳지 못했고
  alternatives_korean:
  - 출산하지 못했고
  - 자식을 낳지 못했고
  lexicon: parere
  rationale: 앞의 sterilis와 의미가 겹치지만, 라틴어가 불임 상태와 출산 부재를 모두 강조하므로 중복된 강조를 한국어에서도 유지했습니다.
- source_word: habens maritum annis triginta
  english_pob_choice: though I had a husband for thirty years
  chosen_korean: 남편이 있었음에도 서른 해 동안 그러했습니다
  alternatives_korean:
  - 남편이 있었지만 서른 해 동안 그러했습니다
  - 남편을 둔 지 서른 해가 지났음에도 그러했습니다
  lexicon: habens maritum / annis triginta
  rationale: habens maritum은 단순한 혼인 상태를, annis triginta는 기간을 나타내므로 두 요소를 함께 살려 ‘남편이 있었음에도 서른 해 동안’으로 자연스럽게 구성했습니다.
theological_decisions:
- issue: famula의 신분 강도
  chosen_reading: 여종
  alternative_readings:
  - 종
  - 여노예
  rationale: POB의 revised English가 ‘female slave’로 조정된 점을 반영하되, 한국어에서는 본문 흐름과 가독성을 고려해 ‘여종’으로 옮겨 종속 신분의 강도를 유지했습니다.
  doctrine_reference: 사회적 신분 표현의 직접성 보존
- issue: 반복적 불임 진술
  chosen_reading: ‘아이를 낳지 못했고’로 두 번의 진술을 살림
  alternative_readings:
  - 한 번만 표현
  - ‘불임이었고 아이를 낳지 못했고’로 분리
  rationale: 라틴어의 sterilis fui와 non peperi는 같은 뜻을 반복·강조하는 구조이므로, 한국어에서도 완전히 합치지 않고 중첩된 곤경을 드러냈습니다.
  doctrine_reference: 원문 수사 구조 보존
