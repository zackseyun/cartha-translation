  naturalness: 초안의 ‘장소들의 흔들림’은 현대 한국어에서 부자연스럽고, ‘보일 때입니다’는 다음 절로 이어지는 원문의 종속절을 독립된 종결문처럼 처리합니다. 말줄임표로 미완의 연결을 분명히 하는 편이 자연스럽고 구조에도 맞습니다.
