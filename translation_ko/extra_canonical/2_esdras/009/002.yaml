  rationale: 주변 문맥이 종말론적 징조를 말하므로, 본문의 경고적 의미를 약화시키지 않도록 ‘개입’의 뉘앙스를 살렸습니다.
  doctrine_reference: apocalyptic judgment/intervention
- issue: 문장 구조 보존
  chosen_reading: 두 절 구조를 살려 ‘그때에는…임을 이해하게 될 것입니다. 그리고…보일 때입니다.’로 분리했습니다.
  alternative_readings:
  - 한 문장으로 자연스럽게 합침
  rationale: 원문의 예언적 병렬 구조를 유지해야 이후 절과의 연결 및 징조 목록의 리듬이 드러납니다.
  doctrine_reference: source structure
