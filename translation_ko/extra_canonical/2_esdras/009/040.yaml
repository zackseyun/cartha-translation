lexical_decisions:
- source_word: fles
  english_pob_choice: weeping
  chosen_korean: 울고 계십니까
  alternatives_korean:
  - 우십니까
  - 눈물을 흘리고 계십니까
  lexicon: fleo
  rationale: Latin fles는 단순한 감정이 아니라 눈물/울음의 행위를 가리키므로, 현대 한국어에서는 자연스럽고 직접적인 ‘울다’로 옮겼습니다. 존칭은 화자에게 맞춰 ‘계십니까’를 사용했습니다.
- source_word: doles animo
  english_pob_choice: grieved in spirit
  chosen_korean: 마음으로 괴로워하십니까
  alternatives_korean:
  - 영으로 슬퍼하십니까
  - 영 안에서 근심하십니까
  lexicon: doleo + animus
  rationale: animo는 여기서 ‘영’보다 넓은 내적 자리인 ‘마음/속’이 더 적절하고, doles는 단순한 슬픔보다 ‘괴로움’의 정서를 잘 드러내므로 ‘마음으로 괴로워하다’로 옮겼습니다.
- source_word: et dixit ad me
  english_pob_choice: And she said to me
  chosen_korean: 그리고 그녀가 제게 말했습니다
  alternatives_korean:
  - 그리고 그녀는 제게 말했습니다
  - 그리고 그 여인이 제게 말했습니다
  lexicon: dico + ad me
  rationale: 이 절은 본문 말미의 서술 표지로, 영어 POB가 반영한 대로 반드시 포함해야 합니다. 1인칭 서술의 자연스러움을 살리면서도 원문의 대화 전환을 분명히 했습니다.
theological_decisions:
- issue: 직접 인용문 안의 존대 수준
  chosen_reading: 질문받는 대상에게는 존대형을 유지하고, 서술문은 평서체로 처리했습니다.
  alternative_readings:
  - 인용문 전체를 비존대형으로 낮추기
  - 서술문까지 모두 존대형으로 통일하기
  rationale: 이 구절은 대화의 시작과 전환을 표시하는 서술문이므로, 인용문과 서술문의 문체를 구분하는 것이 원문 구조를 가장 잘 드러냅니다.
  doctrine_reference: 문체 일관성 및 서술-인용 구분
