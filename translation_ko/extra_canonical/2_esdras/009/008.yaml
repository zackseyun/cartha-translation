id: 2ES.9.8
reference: 2 Esdras 9:8
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquetur de praedictis periculis et videbit salutare meum in terra mea et in finibus meis, quae sanctificavi mihi a saeculo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/008.yaml
  text: will be left from the foretold dangers and will see my salvation in my land and within my borders[a], which I sanctified for myself from of old.
  footnotes:
  - marker: a
    text: Or 'will be left from the dangers foretold'.
    reason: previous_rendering
translation:
  language: ko
  text: 미리 예고된 위험들에서 살아남은 사람은 내가 옛적부터 나 자신을 위하여 거룩하게 구별한 내 땅과 내 경계 안에서 나의 구원을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘미리 예고된 위험들에서 남게 될 사람은’.
    reason: relinquetur의 문자적 ‘남겨지다/남다’ 뉘앙스를 반영하는 대안 번역입니다.
lexical_decisions:
- source_word: relinquetur
  english_pob_choice: will be left from
  chosen_korean: 살아남은 자가
  alternatives_korean:
  - 남겨질 것입니다
  - 남게 될 것입니다
  - 재난들에서 벗어날 것입니다
  lexicon: relinquō
  rationale: 직역하면 ‘남겨지다’이지만, 문맥상 예언된 재난을 지나 ‘무사히 남아 있는/살아남은’ 결과를 뜻하므로 자연스럽고 의미를 보존하는 표현을 택했습니다.
- source_word: de praedictis periculis
  english_pob_choice: from the foretold dangers
  chosen_korean: 예언된 재난들에서
  alternatives_korean:
  - 예고된 위험들에서
  - 미리 말해진 위험들에서
  lexicon: praedictus + periculum
  rationale: praedictis periculis는 ‘미리 말해진 위험/재난’이므로, 한국어에서는 복수성과 위협성을 살려 ‘재난들’로 옮겼습니다.
- source_word: salutare meum
  english_pob_choice: my salvation
  chosen_korean: 내 구원
  alternatives_korean:
  - 나의 구원
  - 내 구원하심
  lexicon: salutare
  rationale: salutare는 ‘구원’ 자체를 가리키므로, 동사적 표현보다 명사형 ‘구원’이 원문에 더 가깝습니다.
- source_word: terra mea ... in finibus meis
  english_pob_choice: in my land and within my borders
  chosen_korean: 내 땅과 ... 내 경계 안에서
  alternatives_korean:
  - 내 땅과 ... 내 지경 안에서
  - 내 땅과 ... 내 영토 안에서
  lexicon: terra + fines
  rationale: terra와 fines의 병행을 살리되, 현대 한국어에서 문학적이면서도 경계 개념을 유지하는 ‘경계 안’으로 번역했습니다.
- source_word: quae sanctificavi mihi a saeculo
  english_pob_choice: which I sanctified for myself from of old
  chosen_korean: 내가 오래전부터 나를 위해 거룩하게 구별해 둔
  alternatives_korean:
  - 내가 옛적부터 나를 위해 거룩하게 한
  - 내가 영원부터 나를 위해 성별해 둔
  lexicon: sanctificare + a saeculo
  rationale: sanctificavi를 단순히 ‘거룩하게 하다’보다 ‘거룩하게 구별하다’로 풀어 목적성을 드러냈고, a saeculo는 관용적으로 ‘오래전부터’로 옮겼습니다.
theological_decisions:
- issue: 하나님이 자기 소유로 구별해 둔 땅의 표현
  chosen_reading: ‘내가 오래전부터 나를 위해 거룩하게 구별해 둔’으로, 단순한 소유가 아니라 언약적 구별을 드러냈습니다.
  alternative_readings:
  - ‘내가 오래전부터 성별해 둔’
  - ‘내가 영원부터 나를 위해 구별해 둔’
  rationale: 원문은 땅과 경계를 하나님이 자신을 위해 성별해 두셨다는 언약적 배경을 강조하므로, 소유 표현보다 구별 행위를 드러내는 번역이 더 적절합니다.
  doctrine_reference: 언약적 성별/거룩 구별
- issue: relinquetur의 결과 의미
  chosen_reading: 문맥상 단순 잔존이 아니라 재난을 지나 보존되는 결과로 이해해 ‘살아남은 자가’로 옮겼습니다.
  alternative_readings:
  - ‘남겨질 것입니다’
  - ‘보존될 것입니다’
  rationale: 예언된 재난과 대비되는 구원 장면이므로, 독자에게 결과 의미가 즉시 전달되도록 했습니다.
  doctrine_reference: 구원과 보존의 문맥 의미
