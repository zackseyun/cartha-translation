source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quotquot fastidierunt legem meam, cum adhuc erant habentes libertatem,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/011.yaml
  text: and all who despised my law while they still had freedom,
translation:
  language: ko
  text: 그리고 내 율법을 멸시하면서도 아직 자유를 지니고 있던 모든 사람들입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fastidierunt
  english_pob_choice: despised
  chosen_korean: 멸시하면서도
  alternatives_korean:
  - 경멸하면서도
  - 싫어하면서도
  - 업신여기면서도
  lexicon: 멸시하다
  rationale: lat. fastidierunt는 단순한 무관심보다 강한 경멸·혐오의 태도를 가리키므로, POB의 ‘despised’를 따라 ‘멸시하다’로 옮겼습니다.
- source_word: legem meam
  english_pob_choice: my law
  chosen_korean: 내 율법
  alternatives_korean:
  - 나의 법
  - 내 법
  - 내 규범
  lexicon: 율법
  rationale: source의 lexem legem은 하나님의 규범적 계시를 가리키는 문맥이므로, 한국어 성서 용례에 맞게 ‘율법’으로 번역했습니다.
- source_word: cum adhuc erant habentes libertatem
  english_pob_choice: while they still had freedom
  chosen_korean: 아직 자유를 지니고 있던 동안
  alternatives_korean:
  - 아직 자유가 있을 때
  - 아직 자유를 가지고 있을 때
  - 아직 자유로운 상태였을 때
  lexicon: 자유
  rationale: habentes libertatem은 소유·상태를 강조하므로 ‘자유를 지니고 있던’으로 옮겨, 단순한 심리적 자유감보다 실제로 주어진 상태를 드러냈습니다.
theological_decisions:
- issue: ‘자유’의 의미가 단순한 내적 선택이 아니라 주어진 상태인지 여부
  chosen_reading: 아직 자유를 지니고 있던 상태를 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 아직 자기결정의 여지가 있었던 동안
  - 아직 억압되지 않은 상태에서
  rationale: 라틴어 habentes libertatem은 ‘자유를 소유하다/가지다’에 가깝기 때문에, 본문은 도덕적 책임이 있는 시점의 상실된 자유를 말하는 것으로 읽는 것이 가장 직접적입니다.
  doctrine_reference: 인간의 책임과 심판 시점에 대한 본문 내 의미
