  terminology: ‘율법’은 legem meam에 대한 성서적이고 자연스러운 번역입니다. libertatem의 번역으로 ‘자유를 누리다’는 현대 표준 한국어에서 자연스럽고, 특정 교리적 해석을 덧붙이지 않습니다.
