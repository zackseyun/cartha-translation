  yaml_path: translation/extra_canonical/2_esdras/009/010.yaml
  text: For all who did not know me while they were alive, though they had received benefits,
translation:
  language: ko
  text: 살아 있는 동안 혜택을 받았으면서도 나를 알지 못한 모든 이들은,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quotquot enim
  english_pob_choice: For all who
  chosen_korean: 그러나 … 이들 모두는
  alternatives_korean:
  - 왜냐하면 … 모든 이들은
  - 실로 … 누구든지
  lexicon: Latin quotquot / enim
  rationale: quotquot는 ‘~하는 모든 사람’의 범위를 가리키고, enim은 앞말을 이어주는 접속·설명 기능이므로, 한국어에서는 문맥상 앞 구절과 이어지는 역접/전환 느낌을 살려 간결하게 옮겼습니다.
- source_word: non cognoverunt me
  english_pob_choice: did not know me
  chosen_korean: 나를 알지 못했던
  alternatives_korean:
  - 나를 알지 못한
  - 나를 모르던
  lexicon: Latin cognoscere
  rationale: cognoscere는 단순 정보 인지가 아니라 관계적·경험적 ‘앎’을 포함할 수 있어, 본문 문맥을 유지하면서도 현대 한국어에서 자연스러운 ‘알지 못했던’으로 옮겼습니다.
- source_word: viventes
  english_pob_choice: while they were alive
  chosen_korean: 살아 있을 때
  alternatives_korean:
  - 살아 있는 동안
  - 생존해 있을 때
  lexicon: Latin vivens
  rationale: viventes는 생전의 기간을 가리키므로, 서술형 합쇼체에 맞게 ‘살아 있을 때’로 간명하게 처리했습니다.
- source_word: beneficia consecuti
  english_pob_choice: though they had received benefits
  chosen_korean: 비록 은혜를 받았을지라도
  alternatives_korean:
  - 비록 혜택을 받았을지라도
  - 선익을 누렸을지라도
  lexicon: Latin beneficium + consequi
  rationale: beneficia는 단순한 물질적 이익보다 호의·은택의 뉘앙스가 있어, POB의 ‘benefits’를 따르되 본문 어감상 ‘은혜’를 선택해 수혜를 강조했습니다.
theological_decisions:
- issue: beneficia의 신학적 뉘앙스
  chosen_reading: 하나님의 호의로서의 ‘은혜’보다는 일반적인 ‘은택/혜택’의 뜻을 우선하되, 한국어 자연성을 위해 ‘은혜’를 사용했습니다.
  alternative_readings:
  - 혜택
  - 은택
  - 선익
  rationale: 라틴어 beneficium은 여기서 구원론적 은혜를 직접 지칭한다고 단정할 근거는 약하므로, 과도한 신학화 없이 수혜 사실을 드러내는 표현을 택했습니다.
  doctrine_reference: lexical context
- issue: 문장 연결의 전환감
  chosen_reading: 원문의 enim이 앞뒤 논증을 잇는 기능을 가지므로, 한국어에서는 문맥상 자연스러운 전환을 위해 ‘그러나’로 시작했습니다.
  alternative_readings:
  - 왜냐하면
  - 실로
  rationale: 앞 구절과의 대조적 흐름을 독자가 즉시 파악하도록 하면서도, 라틴어 접속사의 담화 기능을 무리 없이 반영했습니다.
  doctrine_reference: discourse analysis
