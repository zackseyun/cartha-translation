    issue: actus의 단수형을 ‘행위들’로 번역함
    rationale: 원문은 ‘in actu et in signis’로, actus는 단수이고 signis만 복수입니다. 한국어에서도 ‘행위와 표적들’로 구별하는 것이 안전합니다.
  - severity: low
    issue: uirtutes를 ‘능력들’로 직역함
    rationale: 이 문맥의 uirtutes는 prodigiis와 함께 나타나는 능력의 작용들, 곧 ‘능력 있는 일들’을 가리킵니다. ‘능력들’은 한국어에서 추상 명사의 부자연스러운 복수처럼 들립니다.
  - severity: low
    issue: Most High 칭호의 자연스러움
    rationale: ‘지극히 높으신 분’은 신적 칭호로서 더 자연스럽고 널리 통용되는 현대 한국어 표현입니다.
  revised_text: 지극히 높으신 분의 때도 이와 같습니다. 시작은 이적과 능력 있는 일들로 드러나며, 끝은 행위와 표적들로 드러납니다.[a]
