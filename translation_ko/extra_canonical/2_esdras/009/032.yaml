id: 2ES.9.32
reference: 2 Esdras 9:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nam patres nostri accipientes legem non servaverunt et legitima mea non custodierunt. et factum est fructumlegis non periens; nec enim poterat, quoniam tuus erat.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/032.yaml
  text: Yet our fathers, after receiving the law, did not keep it and did not observe my statutes. And the fruit of the law did not perish, for it could not, because it was yours.
translation:
  language: ko
  text: 그런데 우리 조상들은 율법을 받았으면서도 그것을 지키지 않았고, 내 규례들도 준수하지 않았습니다. 그리고 율법의 열매는 없어지지 않았습니다. 그것은 당신의 것이므로 사라질 수 없었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: legem
  english_pob_choice: the law
  chosen_korean: 율법
  alternatives_korean:
  - 법
  - 교훈
  lexicon: νόμος / lex. 대응
  rationale: 라틴어 lex(법)는 이 문맥에서 하나님의 주어진 규범을 가리키므로, POB 기본어인 ‘율법’으로 옮겼습니다.
- source_word: legitima mea
  english_pob_choice: my statutes
  chosen_korean: 내 규례들
  alternatives_korean:
  - 내 법규들
  - 내 정한 것들
  lexicon: statutes / 규례
  rationale: mea가 소유 대명사이므로 ‘내’의 의미를 살리고, 반복되는 규범 항목은 한국어 성경에서 자연스러운 ‘규례들’로 렌더링했습니다.
- source_word: fructum legis
  english_pob_choice: the fruit of the law
  chosen_korean: 율법의 열매
  alternatives_korean:
  - 율법의 결과
  - 율법의 소산
  lexicon: metaphor / 열매
  rationale: fructus는 문자 그대로의 ‘열매’이지만, 비유적으로도 유지되어야 하므로 ‘열매’를 보존했습니다.
- source_word: tuus erat
  english_pob_choice: it was yours
  chosen_korean: 주님의 것이었습니다
  alternatives_korean:
  - 당신의 것이었습니다
  - 하나님의 것이었습니다
  lexicon: possessive / 소유 귀속
  rationale: 문맥상 율법의 귀속을 강조하므로 소유 관계를 드러내되, 한국어에서 다소 직접적인 직역인 ‘당신의 것’ 대신 신앙적 호칭이 있는 ‘주님의 것’으로 자연화했습니다.
theological_decisions:
- issue: ‘my statutes’의 1인칭 신적 발화 보존
  chosen_reading: ‘내 규례들’로 옮겨, 규례의 주체가 하나님 자신임을 드러냈습니다.
  alternative_readings:
  - ‘그의 규례들’
  - ‘하나님의 규례들’
  rationale: 라틴어 legitima mea는 명백히 1인칭 소유를 가지므로, 이를 약화하지 않고 그대로 반영하는 것이 문맥과 신학적 긴장을 보존합니다.
  doctrine_reference: 신적 발화의 1인칭 소유 표현 보존
- issue: ‘it was yours’의 소유 귀속
  chosen_reading: ‘주님의 것이었습니다’로 번역해 율법의 기원과 소유가 하나님께 있음을 강조했습니다.
  alternative_readings:
  - ‘당신의 것이었습니다’
  - ‘하나님께 속한 것이었습니다’
  rationale: 본문의 핵심은 율법이 인간에게서 난 것이 아니라 하나님께 속했다는 점이므로, 소유 귀속을 분명히 드러내는 표현을 택했습니다.
  doctrine_reference: 율법의 신적 기원과 주권
