revisions:
- from: 그런데 우리 조상들은 율법을 받았으면서도 그것을 지키지 않았고, 내 규례들도 준수하지 않았습니다. 그리고 율법의 열매는 없어지지 않았는데, 그것은 사라질 수 없었기 때문입니다. 그것은 주님의 것이었기 때문입니다.[a][b]
  to: 그런데 우리 조상들은 율법을 받았으면서도 그것을 지키지 않았고, 내 규례들도 준수하지 않았습니다. 그리고 율법의 열매는 없어지지 않았습니다. 그것은 당신의 것이므로 사라질 수 없었습니다.
  rationale: 원문의 ‘내 규례들’과 ‘당신의 것’이라는 인칭 표지를 그대로 보존하고, 율법의 열매가 사라지지 않은 이유를 원문처럼 하나의 인과 문장으로 정리했습니다. 불필요하게 중복되거나 본문을 반복하는 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
