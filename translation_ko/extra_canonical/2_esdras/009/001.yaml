translation:
  language: ko
  text: 그가 제게 대답하여 말했습니다. 「스스로를 정확히 헤아려 보아라. 그러고 나서 예언된 표징들 가운데 일부가 지나가는 것을 보게 될 때, 그때 너는 깨닫게 될 것이다」[a]
  philosophy: optimal-equivalence
  footnotes:
