  text: 그가 제게 대답하여 말했습니다. 「스스로를 정확히 헤아려 보아라. 그러고 나서 예언된 표징들 가운데 일부가 지나가는 것을 보게 될 때, 그때 너는 깨닫게 될 것이다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스스로를 정확히 헤아려 보아라’는 라틴어의 반복 강조(metiens metire)를 반영한 번역입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: metiens metire
  english_pob_choice: Measure carefully within yourself
  chosen_korean: 스스로를 정확히 헤아려 보아라
  alternatives_korean:
  - 스스로를 헤아려 보아라
  - 자기 안에서 헤아려 보아라
  - 스스로를 자세히 살펴보아라
  lexicon: metior / metiri
  rationale: 라틴어의 분사+명령형 반복은 단순한 ‘헤아리다’보다 강한 강조를 드러내므로, 영어 개정의 ‘carefully’에 해당하는 정확성·집중성을 살려 번역했습니다.
- source_word: temetipso
  english_pob_choice: within yourself
  chosen_korean: 스스로를
  alternatives_korean:
  - 자기 안에서
  - 너 자신 안에서
  - 자신 안에서
  lexicon: te ipsum
  rationale: 직역된 ‘within yourself’의 공간적 표현보다, 반성적 자기 점검의 뜻이 더 분명하게 드러나도록 한국어에서는 재귀적으로 처리했습니다.
- source_word: signorum quae praedicta sunt
  english_pob_choice: the signs foretold
  chosen_korean: 예언된 표징들
  alternatives_korean:
  - 미리 말해진 징조들
  - 예고된 표징들
  - 예언된 징조들
  lexicon: signum / praedico
  rationale: signa는 단순한 ‘징조’보다 종말론적 ‘표징’이 적절하고, praedicta sunt는 ‘예언된’으로 옮겨 원문의 예고 성격을 유지했습니다.
theological_decisions:
- issue: ‘some part of the signs’의 부분성
  chosen_reading: 예언된 표징들 가운데 일부가 지나가는 때를 표지로 삼아 다음 깨달음으로 나아가는 흐름을 유지했습니다.
  alternative_readings:
  - 표징들 중 일부가 이미 지나갔음을 보면
  - 예언된 징조의 일부가 성취된 것을 보면
  rationale: 본문은 종말 징조의 부분적 경과를 인식의 계기로 제시하므로, 성취의 일부가 지나가는 사건과 그에 따른 깨달음 사이의 긴장을 보존했습니다.
  doctrine_reference: eschatology
