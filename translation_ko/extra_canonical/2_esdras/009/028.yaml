  text: And my mouth was opened, and I began to speak before the Most High, and I said,
translation:
  language: ko
  text: 내 입이 열리고, 나는 지극히 높으신 분 앞에서 말하기 시작하여, 이렇게 말했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et apertum est os meum
  english_pob_choice: And my mouth was opened
  chosen_korean: 내 입이 열리고
  alternatives_korean:
  - 내 입이 열렸고
  - 내 입이 열렸습니다
  lexicon: os = 입; apertum est = 열리다
  rationale: 수동형 사건을 자연스럽게 살리면서도, 뒤의 발화 개시와 이어지는 문맥을 위해 간결하게 옮겼습니다.
- source_word: inchoaui
  english_pob_choice: I began to speak
  chosen_korean: 말하기 시작하여
  alternatives_korean:
  - 말하기 시작했고
  - 말하기 시작했습니다
  lexicon: inchoare = 시작하다
  rationale: 라틴어의 ‘시작하다’ 의미를 직접 반영하고, 뒤의 ‘이렇게 말했습니다’와 중복을 피했습니다.
- source_word: coram Altissimo
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 분 앞에서
  alternatives_korean:
  - 지극히 높으신 분 앞에서
  - 가장 높으신 이 앞에서
  lexicon: Altissimus = 지극히 높으신 분
  rationale: 신적 칭호를 한국어 합쇼체에 맞게 존칭으로 옮기되, 과도하게 설명적이지 않게 처리했습니다.
theological_decisions:
- issue: 신적 호칭 Altissimus의 한국어 처리
  chosen_reading: ‘지극히 높으신 분’으로 옮겨, 직접 인칭 호칭이 아니라 신적 위엄을 드러내는 칭호로 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 본문은 단순한 위치 표현이 아니라 하나님을 가리키는 칭호이므로, 위엄과 인격성을 함께 살리는 표현을 택했습니다.
  doctrine_reference: 하나님의 초월성과 칭호 번역 원칙
