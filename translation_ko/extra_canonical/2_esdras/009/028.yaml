  rationale: 신적 칭호를 한국어 합쇼체에 맞게 존칭으로 옮기되, 과도하게 설명적이지 않게 처리했습니다.
theological_decisions:
- issue: 신적 호칭 Altissimus의 한국어 처리
  chosen_reading: ‘지극히 높으신 분’으로 옮겨, 직접 인칭 호칭이 아니라 신적 위엄을 드러내는 칭호로 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 이’
  - ‘지극히 높으신 하나님’
  rationale: 본문은 단순한 위치 표현이 아니라 하나님을 가리키는 칭호이므로, 위엄과 인격성을 함께 살리는 표현을 택했습니다.
  doctrine_reference: 하나님의 초월성과 칭호 번역 원칙
