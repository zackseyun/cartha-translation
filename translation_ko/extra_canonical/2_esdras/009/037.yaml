    rationale: in suo honore는 율법이 자신의 honor, 곧 존귀한 지위 가운데 지속됨을 뜻합니다. ‘자신의 존귀함 가운데 남아 있다’가 더 가까우며, ‘영광’으로 의미를 좁히지 않습니다.
