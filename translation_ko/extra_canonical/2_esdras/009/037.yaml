translation:
  language: ko
  text: 이는 사라지지 않습니다. 율법은 사라지지 않고, 그 영광 안에 머물러 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “율법은 사라지지 않고, 머물러 있습니다.”
