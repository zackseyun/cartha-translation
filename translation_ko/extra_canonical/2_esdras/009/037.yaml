  source_fidelity: 개정이 필요합니다. 초안은 라틴어 본문 첫 문장인 “suscepit eam.”을 빠뜨렸고, Nam을 받는 설명절을 독립된 “이는 사라지지 않습니다”로 처리하여 주어가 불명확해졌으며, 이어지는 율법 진술을 중복했습니다. 또한 sed의 대조는 ‘오히려’로 드러내는 것이 적절합니다.
  naturalness: ‘그 영광 안에 머물러 있습니다’는 한국어에서 다소 직역투입니다. ‘자신의 존귀함 가운데 남아 있습니다’는 원문의 상태 표현을 유지하면서 더 자연스럽습니다.
  terminology: lex는 문맥상 ‘율법’으로 적절합니다. honor는 신학적으로 특정한 ‘영광’으로 과도하게 고정하기보다 ‘존귀함’으로 옮겨 라틴어의 폭을 보존합니다.
  issues:
