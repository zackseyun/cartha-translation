translation:
  language: ko
  text: 그것을 받아들였습니다. 이는 율법이 사라지지 않고, 오히려 자신의 존귀함 가운데 남아 있기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  english_pob_choice: For the law does not perish, but remains in its honor.
  chosen_korean: 이는 사라지지 않습니다.
  alternatives_korean:
  - 이는 그러므로 사라지지 않습니다.
  - 이는 왜냐하면 율법은 사라지지 않기 때문입니다.
  lexicon: Nam
  rationale: 문맥상 앞절을 받는 설명적 접속사이므로 한국어에서는 간결한 ‘이는’으로 자연스럽게 연결했습니다.
- source_word: lex non perit
  english_pob_choice: the law does not perish
  chosen_korean: 율법은 사라지지 않고
  alternatives_korean:
  - 율법은 없어지지 않고
  - 법은 소멸하지 않고
  lexicon: lex
  rationale: lex는 여기서 일반적 ‘법’보다 유대적·성경적 ‘율법’이 가장 적절하며, perit는 종말적 소멸보다 ‘사라지다’가 의미를 잘 드러냅니다.
- source_word: sed permanet in suo honore
  english_pob_choice: but remains in its honor
  chosen_korean: 그 영광 안에 머물러 있습니다
  alternatives_korean:
  - 제 존귀 안에 남아 있습니다
  - 제 영예를 유지합니다
  lexicon: permanet / in suo honore
  rationale: honor는 단순한 외적 예우보다 ‘영광/존귀’의 상태를 가리키므로, 문맥상 ‘그 영광 안에 머물러 있습니다’로 옮겼습니다.
theological_decisions:
- issue: 율법의 지속성과 존귀한 지위
  chosen_reading: 율법은 사라지지 않고 하나님 앞에서 그 영광 안에 머뭅니다.
  alternative_readings:
  - 율법은 폐지되지 않고 그대로 남아 있습니다.
  - 율법은 여전히 존중받아야 합니다.
  rationale: 본문은 율법의 폐기 불가능성과 지속적 존귀를 선언하므로, 이를 약화시키지 않도록 ‘사라지지 않음’과 ‘영광’의 이미지를 유지했습니다.
  doctrine_reference: 율법의 지속성에 대한 본문 진술
