  - severity: high
    issue: Nam 및 lex non perit sed permanet의 문장 구조가 훼손되고 내용이 중복되었습니다.
    rationale: 초안의 ‘이는 사라지지 않습니다’는 주어가 없고, 그 뒤에 율법이 사라지지 않는다는 내용을 재차 말합니다. Nam은 이유를 제시하고 sed는 ‘사라지지 않는다’와 ‘남아 있다’를 대조합니다.
