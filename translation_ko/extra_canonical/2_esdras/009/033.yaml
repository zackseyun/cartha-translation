id: 2ES.9.33
reference: 2 Esdras 9:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: acceperunt perierunt non custodientes quod in eis seminatum fuerat. Et ecce consuetudo est ut, cum acceperit terra semen
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/033.yaml
  text: For those who received it perished[a], because they did not keep what had been sown in them. And behold, it is the custom that, when the earth has received seed,
  footnotes:
  - marker: a
    text: Or 'But those who received it perished'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것을 받은 자들은 멸망했습니다[a]. 그들이 자기들 안에 뿌려진 것을 지키지 않았기 때문입니다. 보십시오, 땅이 씨앗을 받으면 그러한 관습이 있습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것을 받은 자들은’.
    reason: previous_rendering
lexical_decisions:
- source_word: acceperunt
  english_pob_choice: For those who received it
  chosen_korean: 그것을 받은 자들은
  alternatives_korean:
  - 그것을 받은 이들은
  - 그것을 받아들인 자들은
  lexicon: Latin accipere
  rationale: 수동적 수령을 드러내기 위해 ‘받은’을 택했고, 관계대명사적 뉘앙스를 살려 자연스러운 현대 문장으로 옮겼습니다.
- source_word: perierunt
  english_pob_choice: perished
  chosen_korean: 멸망했습니다
  alternatives_korean:
  - 죽었습니다
  - 사라졌습니다
  lexicon: Latin perire
  rationale: 단순한 죽음보다 더 강한 소멸·파멸의 의미를 살리기 위해 ‘멸망했습니다’를 사용했습니다.
- source_word: non custodientes quod in eis seminatum fuerat
  english_pob_choice: because they did not keep what had been sown in them
  chosen_korean: 그들이 자기들 안에 뿌려진 것을 지키지 않았기 때문입니다
  alternatives_korean:
  - 그들 안에 뿌려진 것을 지키지 않았기 때문입니다
  - 자기들 안에 심어진 것을 보존하지 않았기 때문입니다
  lexicon: Latin custodire; seminare
  rationale: custodire는 ‘지키다/보존하다’의 의미이므로 ‘지키지 않았다’로 옮겼고, seminatum fuerat의 완료 수동은 ‘뿌려진’으로 반영했습니다.
- source_word: Et ecce consuetudo est ut, cum acceperit terra semen
  english_pob_choice: And behold, it is the custom that, when the earth has received seed,
  chosen_korean: 보십시오, 땅이 씨앗을 받으면 그러한 관습이 있습니다
  alternatives_korean:
  - 보십시오, 땅이 씨를 받으면 그러한 관습이 있습니다
  - 보십시오, 땅이 씨앗을 받게 되면 그런 관습이 있습니다
  lexicon: Latin ecce; consuetudo; terra; semen
  rationale: ecce는 주의를 환기하는 ‘보십시오’로, consuetudo는 관행·관습의 일반성을 살려 ‘관습’으로, terra semen은 직역에 가깝게 옮겼습니다.
theological_decisions:
- issue: 첫 절두절의 논리 연결(작성자 의도상 설명적 nam)
  chosen_reading: ‘멸망했습니다’ 뒤에 이어지는 이유절로 한국어에서 명시적으로 연결했습니다.
  alternative_readings:
  - 역접처럼 보이게 ‘그러나’로 처리하는 읽기
  - 이유절을 약화시켜 단순 병렬로 처리하는 읽기
  rationale: English POB audit trail가 ‘But’에서 ‘For’로 수정된 점을 반영해, 원문이 대조가 아니라 설명임을 드러내는 구문으로 옮겼습니다.
  doctrine_reference: 문맥 논리 보존
