    rationale: ‘그러한 관습’은 라틴어 consuetudo est ut, cum ...의 아직 제시되지 않은 관습 내용을 지시하는 표현으로 바꾸어 놓습니다. 원문은 다음 절로 이어지는 미완결 문장이므로 이를 보존해야 합니다.
  - severity: low
