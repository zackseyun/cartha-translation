revisions:
- from: 그것을 받은 자들은 멸망했습니다[a]. 그들이 자기들 안에 뿌려진 것을 지키지 않았기 때문입니다. 보십시오, 땅이 씨앗을 받으면 그러한 관습이 있습니다.
  to: 이는 그것을 받은 자들이 멸망했기 때문입니다[a]. 그들이 그들 안에 뿌려진 것을 지키지 않았기 때문입니다. 보십시오, 땅이 씨를 받으면 관례가 있습니다.
  rationale: 문두를 ‘이는’으로 옮겨 영어 POB 감사 이력이 확인한 설명적 nam의 기능을 반영했습니다. 마지막 문장은 원문의 불완결성을 유지하면서도, 원문에 없는 ‘그러한’이라는 지시 내용을 제거했습니다. ‘씨’는 한국어 성서 문체에서 자연스럽고 의미상 동등합니다.
  reviewer_model: gpt-5.6-terra
