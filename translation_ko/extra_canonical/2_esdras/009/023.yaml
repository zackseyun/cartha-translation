lexical_decisions:
- source_word: sed non ieiunabis in eis
  english_pob_choice: But you shall not fast during them
  chosen_korean: 그러나 그 기간 동안에는 금식하지 말고
  alternatives_korean:
  - 그러나 그동안 금식하지 말고
  - 그러나 그 날들 동안 금식하지 말고
  lexicon: ieiunare → 금식하다
  rationale: 라틴어 ieiunabis는 종교적 금식 행위를 가리키므로 한국어도 직접적으로 ‘금식하지 말고’로 옮겼습니다. English POB의 ‘during them’은 시간 구간을 가리키므로 ‘그 기간 동안에는’으로 자연스럽게 풀었습니다.
- source_word: Ibis autem
  english_pob_choice: but you shall go
  chosen_korean: 가야 합니다
  alternatives_korean:
  - 가십시오
  - 가실 것입니다
  lexicon: ibis → 가다
  rationale: 문맥상 명령/지시의 흐름이므로 현대 합쇼체의 자연스러운 지시문으로 처리했습니다. 직접 명령형보다 예언적·지시적 톤을 살려 ‘가야 합니다’로 옮겼습니다.
- source_word: in campum florum
  english_pob_choice: into a field of flowers
  chosen_korean: 꽃밭으로
  alternatives_korean:
  - 꽃들의 들판으로
  - 꽃이 핀 들판으로
  lexicon: campus + flos → 들판 + 꽃
  rationale: campum florum은 직역하면 ‘꽃들의 들판’이지만, 한국어에서는 자연스럽게 의미를 살려 ‘꽃밭’으로 옮겼습니다. 다만 비유적 장면을 약화시키지 않도록 단순한 ‘들판’보다 꽃의 이미지를 유지했습니다.
theological_decisions:
- issue: 이번 절의 문장 경계와 미완성 종결
  chosen_reading: 끝을 ‘그곳에서’로 열어 두어 다음 절로 이어지는 서술의 흐름을 반영했습니다.
  alternative_readings:
  - 문장을 완결하여 번역하기
  - 다음 절 내용을 보충해 매끄럽게 이어가기
  rationale: 라틴어 본문이 ubi에서 문장이 이어질 상태로 끝나므로, 한국어도 다음 절을 예고하는 개방형 종결을 유지하는 편이 원문 구조를 더 정확히 반영합니다.
  doctrine_reference: source-structure fidelity
