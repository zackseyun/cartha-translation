  to: 민족들 가운데 혼란이 있고, 민족들 가운데 생각들이 있으며, 지도자들에게 불안정이 있고, 통치자들 가운데 소란이 일어날 때, 그때 당신은 지극히 높으신 분이[a] 바로 이러한 것들에 관하여 말씀하신 것이었음을 알게 될 것입니다.
