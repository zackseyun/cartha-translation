    text: 라틴어 cogitationes를 POB의 수정에 따라 ‘생각들’로 옮겼습니다. 이는 음모 해석을 피하고 원문의 중립성을 살리기 위한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: populorum turbatio
  english_pob_choice: confusion among peoples
  chosen_korean: 민족들 가운데의 혼란
  alternatives_korean:
  - 백성들 가운데의 혼란
  - 민족들의 혼란
  - 사람들 사이의 소란
  lexicon: turbatio → 혼란
  rationale: Latin turbatio는 단순한 소동보다 질서가 흔들리는 ‘혼란’이 더 가깝고, populorum은 개별 ‘백성들’보다 민족 단위를 드러내는 ‘민족들’이 자연스럽습니다.
- source_word: gentium cogitationes
  english_pob_choice: thoughts among nations
  chosen_korean: 민족들 가운데의 생각들
  alternatives_korean:
  - 열방 가운데의 생각들
  - 나라들의 생각들
  - 민족들 사이의 궁리들
  lexicon: cogitatio → 생각
  rationale: POB가 cogitationes를 ‘scheming’이 아니라 ‘thoughts’로 수정한 점을 따라, 의도된 음모 해석을 피하고 중립적인 ‘생각들’로 옮겼습니다.
- source_word: ducum inconstantia
  english_pob_choice: instability among leaders
  chosen_korean: 지도자들의 불안정
  alternatives_korean:
  - 지도자들의 변덕
  - 지도자들의 불안정성
  - 지도자들의 흔들림
  lexicon: inconstantia → 불안정
  rationale: inconstantia는 변덕보다 지속성의 결여와 흔들림을 가리키므로, 정책적·사회적 불안정을 포괄하는 ‘불안정’이 가장 직접적입니다.
- source_word: principum turbatio
  english_pob_choice: turmoil among rulers
  chosen_korean: 통치자들의 소란
  alternatives_korean:
  - 통치자들의 혼란
  - 군주들의 소란
  - 지배자들의 소동
  lexicon: principes → 통치자
  rationale: principes는 단순한 ‘지도자’보다 통치 권위를 가진 자들을 가리키므로 ‘통치자들’로 두고, turbatio는 외적 동요를 살려 ‘소란’으로 옮겼습니다.
theological_decisions:
- issue: 절 말미의 미완성 문장 유지
  chosen_reading: 『지극히 높으신 분이』로 끝나는 미완성 형태를 그대로 보존했습니다.
  alternative_readings:
  - 문장을 매끄럽게 완결시키기
  - 후속 절의 내용을 끌어와 완역하기
  rationale: 원문이 다음 절로 이어지는 절단된 구조이므로, 한국어도 인위적으로 매끈하게 마무리하지 않고 서술의 중단감을 유지했습니다.
  doctrine_reference: 본문의 문학적 구조 보존
