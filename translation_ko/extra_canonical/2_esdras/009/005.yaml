id: 2ES.9.5
reference: 2 Esdras 9:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'omne quod factum est in saeculo, initium per consummationem et consummatio manifesta, Sic et altissimi tempora : initia'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/005.yaml
  text: For just as everything that has come to be in the age has a beginning through an end[a], and the end is manifest,
  footnotes:
  - marker: a
    text: Or 'has a beginning through an ending, and the ending is made manifest,'.
    reason: previous_rendering
translation:
  language: ko
  text: '시대 안에 일어난 모든 것에는 시작이 끝을 통해 있으며, 끝도 드러납니다. 또한 지극히 높으신 이의 때도 그러합니다: 시작들…[a]'
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘시작이 끝을 통해 있으며, 끝이 드러납니다’.
    reason: alternative_reading
lexical_decisions:
- source_word: saeculo
  english_pob_choice: age
  chosen_korean: 시대
  alternatives_korean:
  - 세상
  - 세대
  - 세계
  lexicon: saeculum
  rationale: 라틴어 saeculo는 단순한 물리적 ‘세계’보다 한 시대 전체를 가리키는 뜻이 강하므로, POB의 최신 수정에 맞춰 ‘시대’로 옮겼습니다.
- source_word: initium per consummationem
  english_pob_choice: a beginning through an end
  chosen_korean: 시작이 끝을 통해 있으며
  alternatives_korean:
  - 끝을 통하여 시작이 있으며
  - 끝을 통해 시작이 생기며
  - 끝을 통해 시작이 나며
  lexicon: initium / consummatio
  rationale: 본문의 난해한 라틴어 표현을 직역적으로 살려, 시작과 끝의 대응 관계를 유지했습니다. 다만 한국어에서는 문맥상 자연스럽게 ‘시작이 끝을 통해 있으며’로 옮겼습니다.
- source_word: manifesta
  english_pob_choice: manifest
  chosen_korean: 드러납니다
  alternatives_korean:
  - 분명합니다
  - 명백합니다
  - 나타납니다
  lexicon: manifestus
  rationale: ‘manifest’의 공개적으로 드러난 상태를 현대 한국어에서 가장 자연스럽게 보이도록 ‘드러납니다’로 옮겼습니다.
- source_word: altissimi
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 이
  alternatives_korean:
  - 지극히 높으신 분
  - 지극히 높으신 하나님
  - 가장 높으신 분
  lexicon: altissimus
  rationale: 고유 호칭성을 살리되 한국어에서 지나치게 교회적 관용구로 굳어지지 않도록, 문맥상 절대칭호를 ‘지극히 높으신 이’로 번역했습니다.
theological_decisions:
- issue: 본문의 두 절(세상/시대의 시작과 끝, 그리고 지극히 높으신 이의 때)에 대한 대비를 어떻게 살릴 것인가
  chosen_reading: 세계 일반의 질서와 대비되는 ‘시대’의 시작과 끝, 그리고 그와 같이 분명해지는 지극히 높으신 이의 때를 병렬로 제시했습니다.
  alternative_readings:
  - 세상의 시작과 끝
  - 세계의 시작과 끝
  - 세대의 시작과 끝
  rationale: source.text와 최신 영어 수정본 모두 시간적·종말론적 대비를 강조하므로, ‘시대’와 ‘드러납니다’를 사용해 가시성과 질서의 대비를 보존했습니다.
  doctrine_reference: 2 Esdras 9:5의 종말론적 대구법
