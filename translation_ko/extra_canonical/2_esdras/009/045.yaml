source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est post triginta annos, exaudivit me Deus ancillae tuae et pervidit humilitatem meam et adtendit tribulationi meae et dedit mihi filium. et iucundata sum super eum valde ego et vir meus et omnes cives mei, et honorificabamus valde Fortem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/045.yaml
  text: And it happened after thirty years that God heard me[a], your female slave, and saw my humiliation, and paid attention to my distress, and gave me a son. And I rejoiced over him greatly, I and my husband and all my fellow citizens, and we greatly honored the Mighty One.
  footnotes:
  - marker: a
    text: Or 'the God of your servant heard me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 삼십 년이 지난 뒤에 하나님께서 저, 당신의 여종의 기도를 들으시고, 저의 비천함을 보시며 저의 환난에 마음을 기울이셔서 저에게 아들을 주셨습니다. 저는 그를 매우 기뻐하였고—저와 제 남편과 제 모든 동료 시민들이 함께—우리는 모두 크게 능하신 분을 높였습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 종의 하나님께서 나를 들으셨습니다’로 볼 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ancillae tuae
  english_pob_choice: your female slave
  chosen_korean: 저, 당신의 여종
  alternatives_korean:
  - 저, 당신의 종
  - 저, 당신의 여종
  - 저, 당신의 여자종
  lexicon: ancilla
  rationale: 라틴어 ancillae는 여성 종속 신분을 분명히 가리키므로, 본문이 지닌 신분 표지를 살리기 위해 전통적 ‘종’보다 ‘여종’을 택했습니다. 2인칭 소유격도 살려 ‘당신의 여종’으로 옮겼습니다.
- source_word: humilitatem meam
  english_pob_choice: my humiliation
  chosen_korean: 저의 비천함
  alternatives_korean:
  - 저의 굴욕
  - 저의 낮아짐
  - 저의 수치
  lexicon: humilitas
  rationale: humilitas는 단순 감정이 아니라 낮아진 처지와 상태를 포함하므로, 문맥상 자연하면서도 상태성을 드러내는 ‘비천함’이 적절합니다.
- source_word: tribulationi meae
  english_pob_choice: my distress
  chosen_korean: 저의 환난
  alternatives_korean:
  - 저의 고난
  - 저의 곤란
  - 저의 재난
  lexicon: tribulatio
  rationale: tribulatio는 외적 압박과 고통을 함께 가리키는 말이어서, 성경적 용례가 넓고 무게감이 있는 ‘환난’이 가장 안정적입니다.
- source_word: Fortem
  english_pob_choice: the Mighty One
  chosen_korean: 크게 능하신 분
  alternatives_korean:
  - 능하신 분
  - 용사이신 분
  - 강하신 분
  lexicon: Fortis
  rationale: Fortem은 힘이 크신 분이라는 뜻이지만, 한국어에서 인격적 호칭으로는 ‘능하신 분’보다 ‘크게 능하신 분’이 칭송의 뉘앙스를 더 잘 살립니다.
theological_decisions:
- issue: 여종 표현의 신분 뉘앙스
  chosen_reading: ‘당신의 여종’으로 번역해 여성 종속 신분을 드러냈습니다.
  alternative_readings:
  - ‘당신의 종’으로 성 중립화
  - ‘당신의 여자종’으로 직역
  rationale: 라틴어 ancillae와 영어 POB의 ‘female slave’는 단순한 겸손 표현보다 낮은 신분을 분명히 표시합니다. 이를 완화하지 않고 드러내는 것이 본문 의미에 더 충실합니다.
  doctrine_reference: 사회사적 용례 보존
