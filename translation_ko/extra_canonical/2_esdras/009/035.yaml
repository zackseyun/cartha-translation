revisions:
- from: 그리고 받아들여진 것이 멸망할 때, 그것들은 멸망하지만, 수용체들은 남아 있습니다. 우리에게는 그렇게 일어난 적이 없습니다.[a]
  to: 그리고 받아들여진 것이 멸절될 때, 이것들은 멸절되지만, 그것들을 받아들이는 그릇들은 남아 있습니다. 이는 우리에게는 그렇게 일어난 적이 없기 때문입니다.[a]
  rationale: ‘수용체들’을 고대 비유의 물질적·기능적 이미지를 살리는 ‘그것들을 받아들이는 그릇들’로 바꾸었습니다. 또한 enim을 ‘이는 … 때문입니다’로 명시하여 설명·근거의 논증 연결을 보존했고, 본문은 라틴어의 직접적 의미를 따르면서 영어 감사 이력에서 지적된 어휘적 불확실성은 각주에 남겼습니다.
