id: 2ES.9.35
reference: 2 Esdras 9:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quae suscepta sunt, Exterminentur haec, susceptoria uero manent: apud nos enim non sic factum est. Nos quidem qui legem accepimus peccantes peribimus et cor nostrum quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/035.yaml
  text: and when what was received is destroyed[a], these are destroyed, but the receptacles remain. For with us it has not happened so.
  footnotes:
  - marker: a
    text: Or 'then, if what was sown or sent or received is destroyed, these are destroyed, but the things that received them remain. Yet with us it has not happened so.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 받아들여진 것이 멸망할 때, 그것들은 멸망하지만, 수용체들은 남아 있습니다. 우리에게는 그렇게 일어난 적이 없습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: suscepta는 문맥상 ‘받아들여진 것’으로 보는 것이 가장 자연스럽습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: quae suscepta sunt
  english_pob_choice: what was received
  chosen_korean: 받아들여진 것이
  alternatives_korean:
  - 무엇이 받아들여진 것이
  - 받은 것이
  lexicon: suscipere / suscepta
  rationale: suscepta는 단순히 ‘주어진’이나 ‘뿌려진’이 아니라 ‘받아들여진 것’으로 보는 것이 Latin 문맥과 EN POB의 최신 정리를 가장 잘 따릅니다.
- source_word: Exterminentur haec
  english_pob_choice: these are destroyed
  chosen_korean: 그것들은 멸망하지만
  alternatives_korean:
  - 이것들은 멸망하지만
  - 이것들은 파괴되지만
  lexicon: exterminare
  rationale: exterminentur는 소멸·멸절의 강한 뜻을 가지므로, 한국어에서는 ‘멸망하다’가 단순 파괴보다 더 충분히 강한 의미를 드러냅니다.
- source_word: susceptoria
  english_pob_choice: the receptacles
  chosen_korean: 수용체들은
  alternatives_korean:
  - 받아들이는 것들은
  - 그릇들은
  lexicon: susceptoria
  rationale: susceptoria를 ‘받는/담는 그릇’의 의미로 보아 ‘수용체들’로 옮겼으며, 의미를 흐리는 일반어 ‘그릇’보다 원문의 수용·보존 뉘앙스를 더 직접적으로 드러냅니다.
- source_word: apud nos enim non sic factum est
  english_pob_choice: For with us it has not happened so
  chosen_korean: 우리에게는 그렇게 일어난 적이 없습니다
  alternatives_korean:
  - 우리에게는 그렇게 된 적이 없습니다
  - 우리에게는 그렇게 이루어진 적이 없습니다
  lexicon: apud nos... non sic factum est
  rationale: enim을 이유 제시의 ‘for’로 보고, 구어적이면서도 문어적인 합쇼체로 원문의 논증 흐름을 자연스럽게 살렸습니다.
theological_decisions:
- issue: 라틴 문장의 논증 흐름과 다음 절로 이어지는 연결
  chosen_reading: ‘For’로 이어지는 설명적 진술로 유지하여, 앞절을 단순 대비가 아니라 다음 논증의 근거로 읽게 했습니다.
  alternative_readings:
  - ‘그런데’로 약한 대조를 넣는 해석
  - 독립된 감탄문처럼 끊는 해석
  rationale: enim은 대조보다 설명·근거 제시의 기능이 강하므로, 한국어에서도 이유 제시의 흐름을 보존하는 것이 본문 논리를 더 정확히 전달합니다.
  doctrine_reference: 문맥 주해 원칙
- issue: susceptoria의 형상적 표현
  chosen_reading: ‘수용체들’로 옮겨, 단순 저장 용기가 아니라 ‘받아들인 것을 담아 남기는 것’이라는 상징적 긴장을 유지했습니다.
  alternative_readings:
  - ‘그릇들’로 순화
  - ‘받는 것들’로 직역
  rationale: 이 대목은 물질적 비유를 통해 소멸과 보존의 대비를 말하므로, 과도한 순화보다 기능과 이미지를 함께 살리는 번역이 필요합니다.
  doctrine_reference: 성경 은유 표현 보존 원칙
