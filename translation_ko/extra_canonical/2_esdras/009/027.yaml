  text: 그리고 이레 후에 나는 풀 위에 누워 있었고, 내 마음도 다시 전과 같았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 원문은 여기서 문장이 완결되지 않은 것으로 보이며, 영어 POB도 이를 보완하지 않았습니다.
    reason: textual_variant
lexical_decisions:
- source_word: septem
  english_pob_choice: after seven days
  chosen_korean: 이레 후에
  alternatives_korean:
  - 일곱 날 후에
  - 7일 후에
  lexicon: septem
  rationale: 시간 표현은 직역하되, 문맥상 간명하고 자연스러운 한국어 관용을 살려 ‘이레 후에’로 옮겼습니다.
- source_word: discumbebam supra fenum
  english_pob_choice: I was lying on the grass
  chosen_korean: 나는 풀 위에 누워 있었고
  alternatives_korean:
  - 나는 풀 위에 드러누워 있었고
  - 나는 풀 위에 леж어 있었고
  lexicon: discumbebam / fenum
  rationale: discumbebam의 지속적 상태를 ‘누워 있었고’로, fenum을 ‘풀’로 옮겨 과도한 해석 없이 장면을 살렸습니다.
- source_word: cor meum iterum
  english_pob_choice: my heart again as before
  chosen_korean: 내 마음도 다시 전과 같았습니다
  alternatives_korean:
  - 내 마음도 다시 이전과 같았습니다
  - 내 마음도 또다시 전과 같았습니다
  lexicon: cor meum / iterum
  rationale: cor는 문맥상 ‘마음’이 가장 자연스럽고, iterum은 앞선 상태의 반복을 나타내므로 ‘다시 전과 같았습니다’로 처리했습니다.
theological_decisions:
- issue: 라틴어 원문의 종결 불완전성
  chosen_reading: 마지막 구절을 문맥이 허용하는 범위에서 ‘내 마음도 다시 전과 같았습니다’로 옮기되, 원문이 여기서 끝나는 미완성 상태를 한국어 문장 안에서 과잉 보완하지 않았습니다.
  alternative_readings:
  - 끝맺지 못한 채 단순히 절단된 형태로 두는 것
  - ‘내 마음이 다시 ...’처럼 미완성으로 표시하는 것
  rationale: 제공된 라틴어는 종결이 불완전해 보이므로, 없는 내용을 보태지 않고도 읽히는 범위 내에서만 번역했습니다.
  doctrine_reference: source fidelity / textual incompleteness
