  text: Then I let go of the thoughts in which I had been thinking, and I turned to her and said,
translation:
  language: ko
  text: '그러자 나는 내가 골몰해 있던 생각들을 내려놓고, 그녀에게 몸을 돌려 말했습니다:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et dimisi cogitatus
  english_pob_choice: Then I let go of the thoughts
  chosen_korean: 나는 내가 생각하고 있던 생각들을 놓아버리고
  alternatives_korean:
  - 나는 그 생각들을 내려놓고
  - 나는 생각을 그만두고
  lexicon: cogitatus = thoughts; dimisi = let go of / released
  rationale: cogitatus의 복수성과 cogitans의 반복 어근을 살려 ‘생각하고 있던 생각들’로 번역해, 단순한 ‘중단’보다 사유의 흐름을 놓아버리는 동작을 드러냈습니다.
- source_word: cogitans
  english_pob_choice: in which I had been thinking
  chosen_korean: 내가 생각하고 있던
  alternatives_korean:
  - 내가 숙고하던
  - 내가 마음에 두고 있던
  lexicon: cogitans = thinking
  rationale: 영어 POB의 수정 반영에 따라 ‘생각하고 있던’으로 옮겨, 라틴어의 현재분사적 진행성과 반복을 자연스럽게 살렸습니다.
- source_word: conversus sum ad eam
  english_pob_choice: I turned to her
  chosen_korean: 그녀에게 돌아서서
  alternatives_korean:
  - 그녀에게 향하여
  - 그녀를 향해 몸을 돌려
  lexicon: conversor/ad = turn to
  rationale: ad eam의 방향 전환을 직역에 가깝게 살리되, 한국어에서 자연스러운 동작 표현인 ‘돌아서서’를 택했습니다.
