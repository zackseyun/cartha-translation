source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et factum est cum crevisset et venissem accipere illi uxorem, et feci diem epuli.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/047.yaml
  text: And it happened, when he had grown up and I had come to take a wife for him, that I made a day of feasting.
translation:
  language: ko
  text: 그가 자라서 내가 그에게 아내를 데려오러 갔을 때, 나는 잔치 날을 베풀었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘아내를 취하다’에 가깝지만, 한국어에서는 혼인 주선을 자연스럽게 풀어 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: epulum은 단순한 식사보다 잔치·연회의 뜻을 가집니다.
    reason: source_note
lexical_decisions:
- source_word: cum crevisset
  english_pob_choice: when he had grown up
  chosen_korean: 그가 자라서
  alternatives_korean:
  - 그가 성장해서
  - 그가 어른이 되었을 때
  lexicon: crevisset
  rationale: 과거완료의 성숙·성장 상태를 자연스러운 현대 한국어로 압축해, 사건의 선후관계를 분명히 드러냈습니다.
- source_word: venissem accipere illi uxorem
  english_pob_choice: I had come to take a wife for him
  chosen_korean: 내가 그에게 아내를 데려오러 갔을 때
  alternatives_korean:
  - 내가 그를 위해 아내를 맞이하러 갔을 때
  - 내가 그를 위해 아내를 취하러 갔을 때
  lexicon: uxorem
  rationale: 직역하면 ‘아내를 취하다’이지만 한국어에서는 혼인 주선의 뜻을 자연스럽게 풀어 ‘아내를 데려오다’로 옮겼습니다.
- source_word: feci diem epuli
  english_pob_choice: I made a day of feasting
  chosen_korean: 나는 잔치 날을 베풀었습니다
  alternatives_korean:
  - 나는 잔칫날을 마련했습니다
  - 나는 잔치하는 날을 만들었습니다
  lexicon: epulum
  rationale: epuli는 단순한 식사가 아니라 잔치·연회이므로, 한국어에서도 축제성 있는 표현을 유지했습니다.
theological_decisions:
- issue: 혼인과 잔치의 문화적 표현
  chosen_reading: 본문은 아들의 성년과 혼인 준비를 이어 잔치 날을 마련한 가족적·사회적 행위를 서술합니다.
  alternative_readings:
  - 비유적·상징적 종교 언어로 확대해 읽기
  - 단순한 개인 행사보다 더 강한 제의적 의미로 읽기
  rationale: 라틴 원문과 영어 POB는 서술적 사실 진술이며, 본문이 요구하지 않는 상징화를 피하는 것이 좋습니다.
  doctrine_reference: 서사 본문 해석 원칙
- issue: ‘take a wife for him’의 주어 역할
  chosen_reading: 아들에게 아내를 맞이하도록 준비하는 보호자/아버지의 행동으로 이해했습니다.
  alternative_readings:
  - 아들이 스스로 아내를 맞이한 것으로 완화해 읽기
  - 혼인 성사를 뜻하는 추상 표현으로 읽기
  rationale: 영어 POB의 문법과 라틴 venissem accipere illi uxorem은 화자의 주도적 혼인 준비를 가리키므로 그 관계를 보존했습니다.
  doctrine_reference: 문맥 충실 번역 원칙
