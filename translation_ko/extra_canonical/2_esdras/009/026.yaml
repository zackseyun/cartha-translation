id: 2ES.9.26
reference: 2 Esdras 9:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ardat, et sedi ibi in floribus et de herbis agri manducaui et facta est esca earum in saturitatem. Et factum est post dies
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/026.yaml
  text: So I went[a], as he told me, into the field called Ardat, and I sat there among the flowers. I ate the herbs of the field, and their food satisfied me.
  footnotes:
  - marker: a
    text: Or 'their food became enough to satisfy me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리하여 저는 그가 말씀하신 대로 아르닷이라 불리는 들판으로 갔습니다. 거기서 꽃들 가운데 앉았고, 들판의 풀을 먹었습니다. 그들의 음식이 저를 만족시켰습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들에서 난 음식이 저를 충분히 만족시켰습니다’로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Ardat
  english_pob_choice: the field called Ardat
  chosen_korean: 아르닷이라 불리는 들판
  alternatives_korean:
  - 아르닷이라 불리는 밭
  - 아르닷이라 하는 들판
  lexicon: Ardat
  rationale: 지명은 음역하되, ‘called’의 관계를 자연스럽게 살리기 위해 ‘이라 불리는’을 사용했습니다.
- source_word: floribus
  english_pob_choice: among the flowers
  chosen_korean: 꽃들 가운데
  alternatives_korean:
  - 꽃들 사이에
  - 꽃들 한가운데
  lexicon: flos, floris
  rationale: 라틴어 전치사구의 위치감을 유지하면서도 한국어로는 ‘가운데’가 가장 간결하고 자연스럽습니다.
- source_word: de herbis agri
  english_pob_choice: the herbs of the field
  chosen_korean: 들판의 풀
  alternatives_korean:
  - 들판의 허브
  - 밭의 채소
  lexicon: herba
  rationale: herbae는 여기서 약초보다 들에서 자라는 식물 일반을 가리키므로, 현대 한국어에서 더 직접적인 ‘풀’로 옮겼습니다.
- source_word: facta est esca earum in saturitatem
  english_pob_choice: their food satisfied me
  chosen_korean: 그들의 음식이 저를 만족시켰습니다
  alternatives_korean:
  - 그것들에서 난 음식이 저를 충분히 만족시켰습니다
  - 그 음식이 제 배를 채웠습니다
  lexicon: esca + saturitas
  rationale: 라틴어는 ‘먹을거리/음식’이 ‘만족’에 이르게 되었음을 말하므로, 의미를 압축해 ‘만족시켰습니다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 직접화법의 연결
  chosen_reading: ‘그가 말씀하신 대로’로 앞선 명령/지시를 이어, 화자가 순종하여 이동했음을 드러냈습니다.
  alternative_readings:
  - ‘그가 말한 대로’
  - ‘그가 이르신 대로’
  rationale: 이 절은 서사적 순종을 보여 주는 문맥이므로, 공손하면서도 직접적인 ‘말씀하신’이 화자의 태도와 서술 톤을 잘 살립니다.
  doctrine_reference: 서사 문맥의 순종 강조
