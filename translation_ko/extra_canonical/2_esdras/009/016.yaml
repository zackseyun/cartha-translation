  source_fidelity: 라틴어는 `multiplicat`(3인칭 단수)과 `fluctus`(여기서는 단수 주격으로 읽힘)를 사용하므로, 초안의 복수 ‘파도들이’와 단순 수량 비교는 원문 문법을 충분히 반영하지 못합니다. `super guttam`의 공간적 비교/위치 표현도 ‘한 방울의 물보다 더 많이’보다 ‘한 방울 위에서’가 더 직접적입니다. 대화 표지는 같은 절에 유지하고, 원문의 콜론을 보존하는 것이 적절합니다.
  naturalness: ‘파도가 한 방울 위에서 불어나듯이’는 비유의 다소 낯선 표현을 원문의 압축성과 불명확성을 해소하지 않은 채 자연스러운 현대 한국어로 옮깁니다. ‘그러자’는 문맥상 자연스러운 접속이지만, 원문의 단순 접속 의미를 과도하게 보태지 않습니다.
  terminology: ‘대답하여 말씀하셨습니다’는 권위 있는 화자의 발화에 맞는 합쇼체이며, `respondit ... et dixit`의 두 동사를 보존합니다. 기존 각주도 단수/복수 및 비교 방식의 대안으로 고쳐야 본문과 모순되지 않습니다.
  issues:
