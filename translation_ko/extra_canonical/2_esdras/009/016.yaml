lexical_decisions:
- source_word: sicut multiplicat fluctus super guttam
  english_pob_choice: just as waves are multiplied beyond a drop
  chosen_korean: 마치 파도들이 한 방울의 물보다 더 많이 불어나는 것과 같습니다
  alternatives_korean:
  - 마치 파도들이 한 방울보다 더 많아지는 것과 같습니다
  - 마치 파도가 한 방울보다 더 커지는 것과 같습니다
  lexicon: multiplicat / fluctus / guttam
  rationale: Latin multiplicat의 증식·증가 감각을 살려 ‘불어나다’로 옮기고, fluctus는 문맥상 파도들로, guttam은 구체적으로 ‘한 방울의 물’로 풀어 원문의 비교를 자연스럽게 드러냈습니다.
- source_word: et respondit ad me et dixit
  english_pob_choice: And he answered me and said
  chosen_korean: 그리고 그가 내게 대답하여 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 내게 대답하여 이르셨습니다
  - 그리고 그가 내게 응답하여 말씀하셨습니다
  lexicon: respondit / ad me / dixit
  rationale: 대화 태그를 본문 안에 살리고, 신적/권위 있는 화자의 말투에 맞게 ‘말씀하셨습니다’를 사용해 문장 경계를 분명히 했습니다.
theological_decisions:
- issue: Verse boundary and dialogue tag placement
  chosen_reading: ‘그리고 그가 내게 대답하여 말씀하셨습니다’는 9:16 안에 포함했습니다.
  alternative_readings:
  - 대화 태그를 다음 절로 넘기는 처리
  - 비교문만 9:16으로 두고 화답은 9:17로 처리
  rationale: 라틴 원문에 et respondit ad me et dixit가 같은 절 끝에 명시되어 있어, 절 경계를 보존하는 편이 원문과 주석 이력을 가장 정확하게 반영합니다.
  doctrine_reference: Source-bound verse segmentation
