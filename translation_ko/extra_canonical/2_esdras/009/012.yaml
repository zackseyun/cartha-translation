  - severity: low
    issue: ‘회개의 자리’는 현대 한국어에서 다소 직역투입니다.
    rationale: paenitentiae locus apertum은 물리적 장소보다 회개할 수 있도록 열려 있는 기회 또는 가능성을 뜻하므로, ‘회개할 기회’가 자연스럽고 의미를 보존합니다.
