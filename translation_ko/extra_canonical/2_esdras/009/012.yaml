id: 2ES.9.12
reference: 2 Esdras 9:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et cum adhuc esset eis apertum paenitentiae locus non intellexerunt sed spreverunt, hos oportet post mortem in cruciamento cognoscere.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/009/012.yaml
  text: and while a place of repentance was still open to them[a], they did not understand but scorned it; these must know it after death in torment.
  footnotes:
  - marker: a
    text: Or 'and while a place of repentance was still open to them did not understand but scorned it—for these it is necessary to know after death in torment.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들에게 아직 회개의 자리가 열려 있는 동안에도, 그들은 그것을 깨닫지 못하고 오히려 업신여겼습니다. 이들은 죽은 뒤에 고통 가운데서 그것을 알아야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 아직 회개의 자리가 열려 있는 동안 그들은 깨닫지 못하고 오히려 업신여겼습니다—이들은 죽은 뒤에 고통 가운데서 그것을 알아야 합니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: paenitentiae locus
  english_pob_choice: a place of repentance
  chosen_korean: 회개의 자리
  alternatives_korean:
  - 회개의 기회
  - 회개할 수 있는 때
  - 회개의 장소
  lexicon: paenitentia
  rationale: 라틴어 locus를 단순한 공간보다 ‘열려 있는 기회/자리’로 이해하는 문맥이지만, 본문이 강조하는 ‘회개의 가능성’의 상실을 살리기 위해 비교적 직역적인 ‘회개의 자리’를 택했습니다.
- source_word: intellexerunt
  english_pob_choice: they did not understand
  chosen_korean: 깨닫지 못하고
  alternatives_korean:
  - 이해하지 못하고
  - 알지 못하고
  lexicon: intellego
  rationale: 단순한 인지 부족보다 앞 문맥의 경고를 받아들이지 못한 반응이므로, 한국어에서는 자연스럽고 문맥에 맞는 ‘깨닫지 못하고’로 옮겼습니다.
- source_word: spreverunt
  english_pob_choice: scorned it
  chosen_korean: 업신여겼습니다
  alternatives_korean:
  - 멸시했습니다
  - 경멸했습니다
  - 하찮게 여겼습니다
  lexicon: spereo
  rationale: 라틴어 sprev- 계열의 경멸·경시를 드러내되, 한국어에서 대상의 권면을 의도적으로 낮잡는 뉘앙스를 살리기 위해 ‘업신여기다’를 선택했습니다.
- source_word: cognoscere
  english_pob_choice: know it
  chosen_korean: 알아야 합니다
  alternatives_korean:
  - 알게 되어야 합니다
  - 알아야 할 것입니다
  - 알게 될 것입니다
  lexicon: cognosco
  rationale: 단순 정보 인지가 아니라, 뒤따르는 형벌적 체험을 통해 ‘알게 되는’ 강한 귀결을 표현하기 위해 의무형 ‘알아야 합니다’로 옮겼습니다.
theological_decisions:
- issue: post mortem in cruciamento
  chosen_reading: 죽은 뒤에 고통 가운데서
  alternative_readings:
  - 죽은 후 고문 속에서
  - 죽은 뒤 형벌 가운데서
  - 죽음 후에 고통 속에서
  rationale: cruciamentum은 육체적 고문보다 더 넓게 ‘고통/괴로움’의 형벌 상태를 뜻할 수 있어, 장차의 심판적 고통을 과장 없이 드러내는 표현으로 정리했습니다.
  doctrine_reference: 에스드라 문헌의 종말론적 심판 서술
