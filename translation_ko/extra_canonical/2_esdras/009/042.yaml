lexical_decisions:
- source_word: et
  english_pob_choice: And I said to her, “What has happened to you? Tell me.” And she said to me,
  chosen_korean: 그리고 저는
  alternatives_korean:
  - 그리고 내가
  - 그래서 나는
  lexicon: et
  rationale: 문장 맨 앞의 접속사 et를 살려, 앞뒤 절을 단순히 매끈하게 잇기보다 원문의 병렬적 진행을 드러냈습니다.
- source_word: quid passa es
  english_pob_choice: What has happened to you?
  chosen_korean: 무슨 일이 있었습니까?
  alternatives_korean:
  - 무엇을 겪었습니까?
  - 무슨 일을 당하셨습니까?
  lexicon: quid + patior
  rationale: 원문은 고통이나 당함을 암시하는 표현이지만, 여기서는 간결한 질문형으로 유지하되 한국어에서는 자연스럽고 중립적인 “무슨 일이 있었습니까?”로 옮겼습니다.
- source_word: dic mihi
  english_pob_choice: Tell me.
  chosen_korean: 내게 말해 주십시오.
  alternatives_korean:
  - 말해 주시오.
  - 제게 말씀해 주십시오.
  lexicon: dic mihi
  rationale: 직접화법의 명령을 합쇼체로 살려, 상대에게 요구하는 말투를 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: Et dixit ad me
  english_pob_choice: And she said to me,
  chosen_korean: 그러자 그녀가 저에게 말했습니다.
  alternatives_korean:
  - 그리고 그녀가 제게 말했습니다.
  - 그녀가 저에게 말했습니다.
  lexicon: dixit ad me
  rationale: 이 절은 다음 절로 이어지는 발화 표지이므로, 원문의 parataxis를 살리면서 한국어에서는 문맥상 이어지는 반응을 드러내는 “그러자”를 사용했습니다.
