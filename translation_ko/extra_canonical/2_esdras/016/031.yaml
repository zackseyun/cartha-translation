    reason: 이전 번역을 기록한 대안 표현입니다. 본문의 단수, ‘드러나 있는’ 상태, 그리고 vindemiam(포도 수확물)과 vinea(포도원)의 구별을 더 충실히 반영하도록 본문을 개정했습니다.
