  lexicon: patens / scrutantibus diligenter
  rationale: patens의 ‘드러난/노출된’ 의미를 반영하고, scrutantibus diligenter의 ‘주의 깊게 찾는’ 뉘앙스를 살렸습니다.
theological_decisions:
- issue: 농경 비유의 이미지 강도
  chosen_reading: 수확이 끝난 뒤에도 한 송이가 드러나 남아 있는 장면을 직설적으로 살렸습니다.
  alternative_readings:
  - 더 완곡하게 ‘남겨진’으로 완화할 수 있음
  - ‘노출된’의 직설성을 약화시킬 수 있음
  rationale: 원문은 patens와 subremanet로 ‘드러남’과 ‘남아 있음’을 함께 강조하므로, 비유의 생동감을 유지하는 쪽이 더 충실합니다.
