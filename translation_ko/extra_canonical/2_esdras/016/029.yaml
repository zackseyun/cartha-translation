id: 2ES.16.29
reference: 2 Esdras 16:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: relinquentur enim decem de civitate et duo exagro, qui absconderint se in silva et in fissuras petrarum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/029.yaml
  text: For ten will be left from a city[a], and two from the countryside, who have hidden themselves in the forest and in clefts of the rocks.
  footnotes:
  - marker: a
    text: Or 'in thick groves'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 성 안에서는 열 명이 남고, 들에서는 두 명이 남을 것입니다. 그들은 숲과 바위 틈에 숨어 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '숲이 우거진 곳에서'.
    reason: previous_rendering
lexical_decisions:
- source_word: relinquentur
  english_pob_choice: For ten will be left ... and two ...
  chosen_korean: 열 명이 남고 … 두 명이 남을 것입니다
  alternatives_korean:
  - 열 명만 남고 … 두 명만 남을 것입니다
  - 열 명이 남게 되고 … 두 명이 남게 될 것입니다
  lexicon: 남다
  rationale: 라틴어 수동형 미래인 relinquentur를 자연스럽게 미래 수동의 결과로 옮기되, 문맥의 예언적 어조를 살려 '남을 것입니다'로 처리했습니다.
- source_word: de civitate
  english_pob_choice: from a city
  chosen_korean: 성 안에서는
  alternatives_korean:
  - 도시에서
  - 한 성읍에서
  lexicon: 성
  rationale: civitas를 한국어 성경 문맥에 맞는 '성'으로 옮겨, 단순 도시보다 공동체·거주지의 예언적 대비를 더 잘 드러냈습니다.
- source_word: ex agro
  english_pob_choice: from the countryside
  chosen_korean: 들에서는
  alternatives_korean:
  - 시골에서는
  - 농촌에서는
  lexicon: 들
  rationale: agro의 기본적 지시인 들판/시골을 간결하게 살려, 성과 들의 대조를 자연스러운 현대 한국어로 표현했습니다.
- source_word: silva
  english_pob_choice: in the forest
  chosen_korean: 숲
  alternatives_korean:
  - 산림
  - 우거진 숲
  lexicon: 숲
  rationale: Pob 수정 이력에서 'woods'보다 'forest'가 채택된 점을 반영하여, 과장 없는 표준어 '숲'으로 옮겼습니다.
theological_decisions:
- issue: 예언적 생존자 수의 압축된 표현
  chosen_reading: 본문의 수량 표현을 그대로 유지해 극소수만 남는 심판의 긴박함을 살렸습니다.
  alternative_readings:
  - 의역하여 '아주 적은 사람들만 남을 것입니다'로 완화함
  - 숫자 표현을 풀어 설명함
  rationale: 본문은 특정한 수를 제시해 심판의 희소성과 잔존을 강조하므로, 숫자를 완화하지 않고 직접 옮기는 편이 원문의 힘에 충실합니다.
  doctrine_reference: 예언문학의 남은 자(remnant) 주제
- issue: 사람들이 어디에 숨었는지의 시제 처리
  chosen_reading: '''숨어 있었습니다''로 과거 완료적 배경을 드러냈습니다.'
  alternative_readings:
  - '''숨어 있습니다''로 현재형화함'
  - '''숨었습니다''로 단순 과거화함'
  rationale: 라틴어 분사구문 absconderint se는 이미 숨어 있는 상태를 배경으로 제시하므로, 한국어에서도 행동의 완료성과 배경성을 함께 살렸습니다.
  doctrine_reference: 서술 시제와 사건 배경의 일치
