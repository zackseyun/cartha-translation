id: 2ES.16.24
reference: 2 Esdras 16:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et mortui quasi stercora proicientur, et non habent qui consolentur eos. et derelinquetur deserta terra, et civitates eius demolientur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/024.yaml
  text: And the dead will be cast out like dung[a], and they will have no one to comfort them, and the earth will be left desolate, and its cities will be demolished.
  footnotes:
  - marker: a
    text: Or 'and there will be no one to comfort them; for the earth'.
    reason: previous_rendering
translation:
  language: ko
  text: 죽은 자들은 분뇨처럼 내던져질 것이며, 그들을 위로할 사람도 없을 것입니다. 땅은 황폐한 채 버려질 것이며, 그 도시들은 허물어질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: mortui
  english_pob_choice: the dead
  chosen_korean: 죽은 자들
  alternatives_korean:
  - 죽은 사람들
  - 죽은 이들
  lexicon: mortui
  rationale: 단순히 ‘죽은 사람들’로 풀 수도 있지만, 문맥상 집단 전체를 가리키는 명사적 표현이어서 ‘죽은 자들’이 원문의 직접성을 더 잘 보존합니다.
- source_word: quasi stercora proicientur
  english_pob_choice: will be cast out like dung
  chosen_korean: 분뇨처럼 내던져질 것이며
  alternatives_korean:
  - 똥처럼 버려질 것이며
  - 거름처럼 내버려질 것이며
  lexicon: quasi stercora proicientur
  rationale: stercora는 강한 모욕적 이미지이므로 완곡하게 줄이지 않고, 현대 한국어에서 같은 충격을 주는 ‘분뇨처럼’으로 옮겼습니다.
- source_word: consolentur eos
  english_pob_choice: comfort them
  chosen_korean: 그들을 위로할
  alternatives_korean:
  - 그들을 달랠
  - 그들을 위로해 줄
  lexicon: consolentur eos
  rationale: 라틴어 consolari의 기본 의미를 살려 ‘위로하다’로 번역하고, 관계절 형태를 자연스럽게 맞췄습니다.
- source_word: demolientur
  english_pob_choice: will be demolished
  chosen_korean: 무너질 것입니다
  alternatives_korean:
  - 허물어질 것입니다
  - 철거될 것입니다
  lexicon: demolientur
  rationale: 도시가 외력에 의해 철저히 파괴되는 그림을 담되, 한국어에서 가장 자연스러운 결과 상태 동사인 ‘무너지다’를 택했습니다.
theological_decisions:
- issue: 죽음과 심판의 강한 시각적 표현
  chosen_reading: 본문의 모욕적·파괴적 이미지를 완화하지 않고 그대로 유지했습니다.
  alternative_readings:
  - 더 순화된 표현으로 의미만 전달하기
  - 상징적으로 완곡하게 옮기기
  rationale: 이 구절은 종말론적 심판을 극단적 이미지로 묘사하므로, 감정적 충격을 줄여 의미를 약화시키지 않는 것이 원문 충실성에 부합합니다.
  doctrine_reference: 종말론적 심판의 경고 표현
- issue: ‘consolentur’의 시제/양태
  chosen_reading: 현재형 관계절의 의미를 살려 ‘위로할 사람도 없을 것입니다’로 옮겼습니다.
  alternative_readings:
  - 위로해 주는 이가 없었습니다
  - 위로할 이가 없을 것입니다
  rationale: 라틴어 non habent qui consolentur eos는 현재적 진술이므로, 미래적 전체 문맥 안에서도 ‘있을 것입니다’로 정리하되 관계절은 능동적 가능성을 보존했습니다.
  doctrine_reference: 문장 시제와 서술 흐름의 보존
