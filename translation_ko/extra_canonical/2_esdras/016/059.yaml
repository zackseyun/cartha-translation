lexical_decisions:
- source_word: super aquam
  english_pob_choice: hung the earth upon the water
  chosen_korean: 땅을 물 위에 드리우시고
  alternatives_korean:
  - 땅을 물 위에 두시고
  - 땅을 물 위에 매달아 두시고
  lexicon: super + aqua
  rationale: 라틴어 super aquam은 '물 위에'라는 위치를 말하며, 우주 창조의 이미지를 자연스럽게 살리기 위해 '드리우시고'로 옮겼습니다.
- source_word: uerbo suo
  english_pob_choice: by his word
  chosen_korean: 그 말씀으로
  alternatives_korean:
  - 그분의 말씀으로
  - 말씀으로
  lexicon: verbum
  rationale: 소유 대명사를 반영해 '그 말씀'으로 두어, 창조 행위의 매개가 하나님의 말씀임을 분명히 했습니다.
- source_word: caelum quasi cameram
  english_pob_choice: the heaven like a vault
  chosen_korean: 하늘을 둥근 궁전처럼
  alternatives_korean:
  - 하늘을 궁창처럼
  - 하늘을 천장처럼
  lexicon: caelum + quasi camera
  rationale: camera는 둥근 천장이나 궁륭을 가리키므로, 전통적 '궁창'보다 형태 이미지를 살려 '둥근 궁전처럼'으로 옮겼습니다.
theological_decisions:
- issue: 창조 묘사에서 하늘 비유의 재현
  chosen_reading: 하늘을 둥근 궁전처럼 펴셨습니다.
  alternative_readings:
  - 하늘을 궁창처럼 펼치셨습니다.
  - 하늘을 둥근 천장처럼 펼치셨습니다.
  rationale: 본문의 quasi cameram은 하늘을 아치형 구조로 그리는 비유이므로, 단순한 기술적 용어보다 시적 이미지를 살린 표현을 택했습니다.
