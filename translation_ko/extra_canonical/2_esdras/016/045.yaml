source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui nubunt, sic quasi filios non facturi; et qui non nubunt, sic quasi vidui.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/045.yaml
  text: Those who marry[a], as though they will have no children; and those who do not marry, as widowers.
  footnotes:
  - marker: a
    text: Or 'Those who marry, let them be as though they will have no children; and those who do not marry, as widowers.'.
    reason: previous_rendering
translation:
  language: ko
  text: 결혼하는 사람들은 마치 자녀가 없을 사람들처럼, 그리고 결혼하지 않는 사람들은 마치 홀아비들처럼 해야 합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 quasi는 여기서 단순한 '같이'보다 '마치 …처럼'이라는 비교·가정의 뉘앙스를 드러냅니다.
    reason: source_note
lexical_decisions:
- source_word: qui nubunt
  english_pob_choice: Those who marry
  chosen_korean: 결혼하는 사람들
  alternatives_korean:
  - 장가드는 사람들
  - 시집가는 사람들
  lexicon: nubunt = 결혼하다
  rationale: 라틴어의 중성적 현재분사 구조를 자연스러운 포괄 표현으로 살려, 남녀 모두를 포함하는 '결혼하는 사람들'로 옮겼습니다.
- source_word: quasi filios non facturi
  english_pob_choice: as though they will have no children
  chosen_korean: 마치 자녀가 없을 사람들처럼
  alternatives_korean:
  - 마치 자녀를 두지 않을 사람들처럼
  - 자녀가 없게 될 것처럼
  lexicon: quasi = 마치 ~처럼; filios non facturi = 자녀를 두지 않을 사람들
  rationale: elliptical한 비교구문을 그대로 살려, 결과 상태를 부드럽게 연결하는 '마치 …처럼'으로 옮겼습니다.
- source_word: qui non nubunt
  english_pob_choice: those who do not marry
  chosen_korean: 결혼하지 않는 사람들은
  alternatives_korean:
  - 장가들지 않는 사람들은
  - 시집가지 않는 사람들은
  lexicon: non nubunt = 결혼하지 않다
  rationale: 앞절과 같은 구조를 유지하면서, 성별을 특정하지 않는 현대 한국어 표현을 선택했습니다.
- source_word: quasi vidui
  english_pob_choice: as widowers
  chosen_korean: 마치 홀아비들처럼
  alternatives_korean:
  - 마치 과부처럼
  - 마치 배우자를 잃은 사람들처럼
  lexicon: vidui = widowers
  rationale: 라틴어 vidui의 남성형 의미를 반영해 '홀아비들'로 직역하되, 비교구문인 quasi를 살려 '마치 …처럼'을 붙였습니다.
theological_decisions:
- issue: v.42에서 이어지는 병렬적 권고문 구조
  chosen_reading: 명령형을 보충하지 않고, 반복되는 비교절의 리듬을 유지했습니다.
  alternative_readings:
  - '"해야 합니다"를 빼고 단순 서술로 처리'
  - '"그들은 …처럼 되십시오"로 명령형을 명시'
  rationale: 본문은 v.42의 명령 아래 반복되는 감탄적/권고적 병렬 구조이므로, 한국어에서도 과도한 해설적 보충을 피하고 본문의 리듬을 보존했습니다.
  doctrine_reference: 수사 구조 보존
