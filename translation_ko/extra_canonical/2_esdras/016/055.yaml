translation:
  language: ko
  text: 사람의 모든 행위와 그들의 계획과 그들의 생각과 그들의 마음입니다. "땅이 만들어지라"고 말씀하신 분께서 말씀하시니, 그대로 이루어졌습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 일부 전승에서는 이 자리에 “보라, 주께서 사람의 모든 행위와 그들의 계획과 그들의 생각과 그들의 마음을 아신다”는 이문이 전해집니다.
    reason: textual_variant
lexical_decisions:
- source_word: omnia opera hominis / all the works of men
  english_pob_choice: all the works of men
  chosen_korean: 사람의 모든 행위
  alternatives_korean:
  - 모든 사람의 일
  - 인간의 모든 행위
  lexicon: hominis
  rationale: 인류 일반을 가리키는 포괄 표현으로 옮기되, 원문의 ‘opera’는 단순한 ‘일들’보다 행위성이 살아 있는 ‘행위’가 더 가깝습니다.
- source_word: adinuentiones illorum / their devices
  english_pob_choice: their devices
  chosen_korean: 그들의 계획
  alternatives_korean:
  - 그들의 궁리
  - 그들의 궁안
  lexicon: adinuentiones
  rationale: 의도적 궁리나 꾸밈을 가리키므로, 한국어에서는 결과를 향한 의도적 ‘계획’이 가장 자연스럽고 의미 범위도 잘 보존합니다.
- source_word: cogitatum illorum et corda illorum / their thoughts and their hearts
  english_pob_choice: their thoughts and their hearts
  chosen_korean: 그들의 생각과 그들의 마음
  alternatives_korean:
  - 그들의 생각과 그들의 심장
  - 그들의 생각과 그들의 속마음
  lexicon: cogitatum / corda
  rationale: ‘corda’는 문자적 기관명보다 인간 내면의 중심을 뜻하므로, 평이하고 성서적 울림이 있는 ‘마음’으로 옮겼습니다.
- source_word: 'Qui dixit: fiat terra, et facta est'
  english_pob_choice: He who said, “Let the earth be made,” and it was made
  chosen_korean: '"땅이 만들어지라"고 말씀하신 분께서 말씀하시니, 그대로 이루어졌습니다'
  alternatives_korean:
  - '"땅이 있게 되라"고 말씀하신 분께서 말씀하시니, 그대로 있었습니다'
  - '"땅이 만들어지라" 하신 분께서 그렇게 되게 하셨고, 그대로 되었습니다'
  lexicon: fiat terra / facta est
  rationale: 라틴어 수동형 명령과 결과절을 직역하되, 창조 명령의 울림을 살리기 위해 ‘만들어지라’와 ‘그대로 이루어졌습니다’를 사용했습니다.
theological_decisions:
- issue: 창조 발화의 신학적 강조
  chosen_reading: “땅이 만들어지라”는 창조 명령과 즉각적 성취를 함께 드러내어, 말씀의 주권과 효력을 강조했습니다.
  alternative_readings:
  - 단순히 ‘땅이 생기라’로 축소하는 번역
  - 명령과 성취를 하나로 압축해 반복을 약화시키는 번역
  rationale: 본문은 단순한 기원 진술이 아니라 말씀하시는 분의 창조 주권을 강조하므로, 명령과 성취를 분명히 구분해 옮기는 것이 소스에 충실합니다.
  doctrine_reference: 창조론 / 하나님의 말씀의 효력
