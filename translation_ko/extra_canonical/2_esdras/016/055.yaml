revisions:
- from: 사람의 모든 행위와 그들의 계획과 그들의 생각과 그들의 마음입니다. "땅이 만들어지라"고 말씀하신 분께서 말씀하시니, 그대로 이루어졌습니다.[a]
  to: 주께서는 사람의 모든 행위와 그들의 계획과 그들의 생각과 그들의 마음을 아십니다.[a] “땅이 만들어지라”고 말씀하시자, 땅이 만들어졌습니다;
  rationale: 초안의 중복된 발화 표현을 제거하고, 창조의 결과가 ‘땅’에 관한 것임을 명시했습니다. 첫 목록은 제공된 라틴어 절편의 문법적 연결과 기존 이문 주석을 따라 ‘주께서 아십니다’로 자연스럽게 완결했습니다. 이 보완은 이문이 가리키는 앞 절의 술어를 반영한 것이며, 본문의 창조 명령과 성취의 의미는 변경하지 않습니다.
