  text: Fire has been sent upon you, and who is there to quench it?
translation:
  language: ko
  text: 불이 여러분에게 보내졌는데, 그것을 끌 자가 누구이겠습니까?
  philosophy: formal
lexical_decisions:
- source_word: uobis
  english_pob_choice: upon you
  chosen_korean: 여러분에게
  alternatives_korean:
  - 너희에게
  - 당신들에게
  lexicon: uobis
  rationale: 복수 2인칭 수신자를 현대 한국어 합쇼체로 자연스럽게 옮기되, 직접적인 책망의 압박은 유지했습니다.
- source_word: ignis
  english_pob_choice: Fire
  chosen_korean: 불
  alternatives_korean:
  - 화염
  - 불길
  lexicon: ignis
  rationale: 라틴어 ignis의 기본 의미를 가장 सीधे하고 간결하게 반영하는 표준어로 옮겼습니다.
- source_word: extinguat
  english_pob_choice: quench
  chosen_korean: 끄다
  alternatives_korean:
  - 진압하다
  - 소멸시키다
  lexicon: extinguo
  rationale: ‘quenches it’의 물리적 소거 이미지를 살리면서도 한국어에서 가장 자연스러운 동사를 선택했습니다.
theological_decisions:
- issue: 수사적 경고의 강도
  chosen_reading: 문장을 물음형으로 유지해, 이미 임한 불을 끌 수 있는 자가 없다는 긴박한 경고를 그대로 드러냈습니다.
  alternative_readings:
  - 서술형으로 풀어 ‘불이 이미 여러분에게 보내졌고, 그것을 끌 자는 없습니다’라고 번역하기
  rationale: 원문은 수사적 질문을 통해 불가역성을 강조하므로, 한국어에서도 질문형을 유지하는 편이 원문의 경고성을 더 정확히 전달합니다.
