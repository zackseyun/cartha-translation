  text: Woe is me, woe is me! Who will deliver me in those days?
translation:
  language: ko
  text: 땅으로 보내어지면, 아, 나는 화를 입습니다, 화를 입습니다! 누가 나를 구해 주겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: missa fuerint in terram
  english_pob_choice: —
  chosen_korean: 땅에 떨어지게 되면
  alternatives_korean:
  - 땅으로 내던져지면
  - 땅에 던져지면
  - 땅에 뿌려지면
  lexicon: missa / mittere
  rationale: 주어진 라틴어 구절은 앞뒤 문맥상 ‘땅으로 보내지다/떨어지다’의 조건절로 읽히므로, 결과를 드러내는 자연스러운 합쇼체 조건 표현으로 옮겼습니다.
- source_word: Vae mihi, vae mihi!
  english_pob_choice: Woe is me, woe is me!
  chosen_korean: 내게 화가 있습니다, 내게 화가 있습니다!
  alternatives_korean:
  - 슬프도다, 슬프도다!
  - 아, 나는 비참합니다, 비참합니다!
  - 화로다, 화로다!
  lexicon: vae
  rationale: vae는 단순 감탄보다 재앙·심판의 비탄을 나타내므로, 전통적 ‘슬프도다’보다 직설적인 ‘화가 있습니다’를 택해 반복 구조를 살렸습니다.
- source_word: quis me liberabit
  english_pob_choice: Who will deliver me
  chosen_korean: 누가 나를 구해 주겠습니까?
  alternatives_korean:
  - 누가 나를 건져 주겠습니까?
  - 누가 나를 구원하겠습니까?
  lexicon: liberabit
  rationale: liberare는 단순 도움보다 위험/환난에서의 해방을 뜻할 수 있으나, 여기서는 반복되는 절규의 자연스러운 한국어로 ‘구해 주다’를 사용했습니다.
theological_decisions:
- issue: 문장에 명시되지 않은 시간/상황 보충
  chosen_reading: 영문 POB의 ‘in those days’를 본문에 반영하지 않고, 라틴어에 보이는 조건절과 절규만 살렸습니다.
  alternative_readings:
  - ‘그날들에’로 시간 표현을 보강함
  - ‘그때 누가 나를 구해 주겠습니까?’로 일반화함
  rationale: 제공된 라틴어 본문에는 ‘those days’에 해당하는 표현이 직접 보이지 않으므로, 원문 증거에 없는 요소를 본문에 넣지 않는 쪽이 더 엄밀합니다.
  doctrine_reference: source fidelity
- issue: 절규의 정서 강도
  chosen_reading: ‘내게 화가 있습니다’로 심판적 비탄을 직접 드러냈습니다.
  alternative_readings:
  - ‘슬프도다’처럼 완곡하게 처리함
  - ‘불행합니다’로 중립화함
  rationale: vae의 예언자적/종말론적 탄식 성격을 약화시키지 않기 위해, 한국어에서도 강한 재앙 선언을 유지했습니다.
  doctrine_reference: register preservation
