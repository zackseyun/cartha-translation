revisions:
- from: 불의 숯이 자기 머리 위에 타오를 것입니다. “나는 하나님 앞과 그의 영광 앞에서 죄를 짓지 않았습니다”라고 말하는 자 위에 말입니다. 보십시오, 주님께서 아십니다.[a]
  to: 하나님과 그분의 영광 앞에서 ‘나는 죄를 짓지 않았습니다’라고 말하는 사람의 머리 위에 불의 숯을 태우실 것입니다. 보십시오, 주님께서 아십니다.
  rationale: 원문 우선 원칙에 따라 conburet의 단수 미래 타동사 구조를 회복했습니다. 행위 주체는 라틴어 본문에서 명시되지 않으므로 한국어에서도 생략했습니다. coram이 하나님과 그분의 영광 양쪽에 걸리는 병렬 구조를 ‘하나님과 그분의 영광 앞에서’로 옮겼고, 기존의 부자연스러운 후치 보충과 이를 뒷받침하던 부정확한 각주를 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:30Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어 conburet는 3인칭 단수 미래 능동형이며 carbones ignis를 목적어로 취합니다. 따라서 ‘불의 숯이 타오르다’처럼 숯을 주어로 삼는 현 번역은 원문의 문법 관계를 바꿉니다. 주어는 본문에 명시되지 않았으므로 한국어에서도 생략하여 보존했습니다. coram deo et gloria ipsius는 ‘하나님과 그분의 영광 앞에서’로, 하나의 전치사가 병렬된 두 대상에 걸리는 구조를 자연스럽게 반영했습니다.
  naturalness: 현행 문장은 ‘자기 머리 위에 타오를 것입니다’ 뒤에 수식 대상을 ‘…위에 말입니다’라고 덧붙여 한국어 문장 연결이 부자연스럽고, ‘자기’의 지시 대상도 늦게 밝혀집니다. 관계절을 먼저 두고 ‘그 사람의 머리 위에’로 명시하면 현대 표준 한국어 합쇼체에서 자연스럽습니다.
  terminology: ‘하나님’, ‘그분의 영광’, ‘주님’은 일관되고 적절합니다. ‘죄를 짓지 않았습니다’는 peccaui의 완료 의미를 잘 살립니다. 문법상 대안이라는 현 각주는 본문이 실제로는 그 대안을 채택하고 있으면서도 원문의 타동 구조를 잘못 설명하므로 삭제하는 것이 안전합니다.
  issues:
  - severity: high
    issue: conburet의 타동 구조가 ‘불의 숯이 … 타오르다’라는 자동사 구조로 변경되었습니다.
    rationale: 원문은 단수 동사 conburet와 목적어 carbones ignis를 사용합니다. 숯이 주어인 한국어 문장은 단수 동사 및 목적어 관계를 반영하지 못합니다.
  - severity: medium
    issue: ‘… 위에 말입니다’라는 후치 보충 표현이 관계절과 머리의 소유 관계를 부자연스럽게 만듭니다.
    rationale: eius qui dicit는 ‘그렇게 말하는 사람의’로 바로 수식하는 것이 자연스럽고 정확합니다.
  - severity: medium
    issue: 각주 a가 본문과 원문의 문법 관계를 혼동시킵니다.
    rationale: 각주가 제시한 ‘그는 … 태우실 것입니다’가 오히려 원문의 타동사 구조에 맞으며, 현 본문은 그 구조를 채택하지 않았습니다. 원문에는 이 대안을 요구하는 이문 표지도 제공되지 않았습니다.
  revised_text: 하나님과 그분의 영광 앞에서 ‘나는 죄를 짓지 않았습니다’라고 말하는 사람의 머리 위에 불의 숯을 태우실 것입니다. 보십시오, 주님께서 아십니다.
