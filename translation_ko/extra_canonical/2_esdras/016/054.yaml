id: 2ES.16.54
reference: 2 Esdras 16:54
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quoniam carbones ignis conburet super caput eius qui dicit: non peccaui coram deo et gloria ipsius. Ecce dominus cognoscit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/054.yaml
  text: For coals of fire will burn upon the head of the one who says[a], “I have not sinned before God and his glory.” Behold, the Lord knows.
  footnotes:
  - marker: a
    text: Or 'for coals of fire will burn upon the head'.
    reason: previous_rendering
translation:
  language: ko
  text: 하나님과 그분의 영광 앞에서 ‘나는 죄를 짓지 않았습니다’라고 말하는 사람의 머리 위에 불의 숯을 태우실 것입니다. 보십시오, 주님께서 아십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: carbones ignis conburet
  english_pob_choice: for coals of fire will burn upon the head
  chosen_korean: 불의 숯이 … 타오를 것입니다
  alternatives_korean:
  - 그는 불의 숯을 … 태우실 것입니다
  - 불타는 숯이 … 타오를 것입니다
  lexicon: carbones ignis; conburet
  rationale: 라틴어 conburet는 타동사 미래형이므로, 숯이 주어가 아니라 ‘불의 숯을 태우다’라는 의미를 살려 자연스럽게 옮겼습니다.
- source_word: super caput eius qui dicit
  english_pob_choice: upon the head of the one who says
  chosen_korean: 자기 머리 위에 … 말입니다
  alternatives_korean:
  - 그가 말하는 자의 머리 위에
  - 말하는 자의 머리 위에
  lexicon: super caput eius qui dicit
  rationale: 직역의 구조를 유지하되 한국어에서는 문장 뒤에 덧붙이는 설명형으로 처리해, ‘말하는 자’와 그 머리 위라는 관계가 분명하게 드러나도록 했습니다.
- source_word: coram deo et gloria ipsius
  english_pob_choice: before God and his glory
  chosen_korean: 하나님 앞과 그의 영광 앞에서
  alternatives_korean:
  - 하나님 앞에서 그리고 그의 영광 앞에서
  - 하나님과 그의 영광 앞에서
  lexicon: coram + ablative; gloria ipsius
  rationale: coram은 단순한 ‘앞에서’이므로 반복을 통해 경외의 대상을 분명히 했고, ipsius는 하나님을 가리키는 것으로 읽어 ‘그의’를 유지했습니다.
- source_word: Ecce dominus cognoscit
  english_pob_choice: Behold, the Lord knows
  chosen_korean: 보십시오, 주님께서 아십니다
  alternatives_korean:
  - 보라, 주님께서 아십니다
  - 보십시오, 주께서 아십니다
  lexicon: Ecce; dominus cognoscit
  rationale: Ecce의 호소력을 살려 ‘보십시오’로 옮겼고, dominus는 본문 전체의 맥락에서 주님으로 번역했습니다.
theological_decisions:
- issue: ‘하나님 앞과 그의 영광 앞에서’의 이중 표현
  chosen_reading: 하나님과 그의 영광을 별개의 경외 대상처럼 나란히 유지했습니다.
  alternative_readings:
  - ‘하나님 앞에서 그의 영광을’처럼 하나의 개념으로 합침
  - ‘하나님 앞과 그의 영광 앞에서’의 반복을 완화함
  rationale: 라틴어 coram deo et gloria ipsius는 수사적으로 중첩된 경외 표현이므로, 이를 완화하지 않고 그대로 드러내는 쪽이 원문의 긴장과 경고의 강도를 보존합니다.
  doctrine_reference: 문자적 경고 수사 보존
- issue: 주어가 생략된 미래 동사의 처리
  chosen_reading: ‘그는’이라는 해석적 주어를 넣지 않고, 미래형을 한국어 주동문으로 유지했습니다.
  alternative_readings:
  - ‘주님께서 불의 숯을 태우실 것입니다’로 명시적 주어 보완
  - ‘불의 숯이 타오를 것입니다’로 무주어 처리
  rationale: 라틴어 conburet는 주어가 문법적으로 생략되어 있으므로, 원문이 지닌 모호성을 과도하게 특정하지 않도록 했습니다.
  doctrine_reference: 원문 문법의 모호성 보존
