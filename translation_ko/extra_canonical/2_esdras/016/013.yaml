  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'Quoniam fortis dextera eius quae arcum tendit : sagittae eius acutae quae ab ipso mittuntur, non deficient cum coeperint mitti'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/013.yaml
  text: For mighty is his right hand that bends the bow; his arrows that are shot by him are sharp[a], and they will not fail when they begin to be shot.
  footnotes:
  - marker: a
    text: Or 'are sent by him are sharp, and they will not fail'.
    reason: previous_rendering
translation:
  language: ko
  text: 그의 오른손은 활을 당기는 강한 손이며, 그의 화살은 그가 쏘는 것이니 날카롭고, 쏘기 시작하면 빗나가지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그에 의해 쏘아지는 화살은 날카롭고, 쏘기 시작하면 빗나가지 않는다”.
    reason: previous_rendering
lexical_decisions:
- source_word: fortis dextera eius
  english_pob_choice: For mighty is his right hand
  chosen_korean: 그의 오른손은 활을 당기는 강한 손이며
  alternatives_korean:
  - 그의 오른손은 강력하며
  - 그의 힘센 오른손은
  lexicon: fortis; dextera
  rationale: fortis는 단순히 ‘강하다’보다 힘과 능력이 두드러진 상태를 가리키므로, 활을 당기는 문맥을 살려 ‘활을 당기는 강한 손’으로 옮겼습니다.
- source_word: quae arcum tendit
  english_pob_choice: that bends the bow
  chosen_korean: 활을 당기는
  alternatives_korean:
  - 활을 굽히는
  - 활을 휘는
  lexicon: arcum tendit
  rationale: 라틴어 tendit는 활시위를 당기다/활을 당기다의 동작을 가리키므로, 한국어에서도 실제 궁술 이미지를 유지했습니다.
- source_word: sagittae eius acutae
  english_pob_choice: his arrows ... are sharp
  chosen_korean: 그의 화살은 ... 날카롭고
  alternatives_korean:
  - 그의 화살은 ... 날렵하고
  - 그의 화살은 ... 예리하고
  lexicon: sagittae; acutae
  rationale: acutae는 물리적 예리함을 뜻하므로 ‘날카롭고’로 직역해 화살의 위협성을 보존했습니다.
- source_word: quae ab ipso mittuntur
  english_pob_choice: that are shot by him
  chosen_korean: 그가 쏘는 것이니
  alternatives_korean:
  - 그에 의해 쏘아지는 것이니
  - 그가 보내는 것이니
  lexicon: mittuntur
  rationale: 이 절은 ‘보내다’보다 궁술 맥락의 ‘쏘다’가 원문 이미지와 영어 개정판의 조정 의도를 더 잘 반영합니다.
- source_word: non deficient cum coeperint mitti
  english_pob_choice: they will not fail when they begin to be shot
  chosen_korean: 쏘기 시작하면 빗나가지 않을 것입니다
  alternatives_korean:
  - 쏘기 시작하면 실패하지 않을 것입니다
  - 쏘기 시작하면 벗어나지 않을 것입니다
  lexicon: non deficient; mitti
  rationale: deficio는 이 문맥에서 ‘실패하다’보다 표적에 ‘빗나가다/과녁을 놓치다’의 뜻이 자연스럽기 때문에, 영어 개정 취지에 맞춰 ‘빗나가지 않을 것입니다’로 옮겼습니다.
theological_decisions:
- issue: 궁술 비유의 보존 여부
  chosen_reading: 하나님의 능력을 추상화하지 않고, 활과 화살의 군사적·심판적 이미지를 그대로 살렸습니다.
  alternative_readings:
  - 그의 권능은 강합니다
  - 그는 능력으로 심판하십니다
  rationale: 원문은 비유를 통해 힘과 정확성을 강조하므로, 이미지의 긴장을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 시편적/예언적 심판 이미지의 수사학
