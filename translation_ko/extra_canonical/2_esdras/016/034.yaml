id: 2ES.16.34
reference: 2 Esdras 16:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: lugebunt virgines non habentes sponsos, lugebunt mulieres non habentes viros, lugebunt filiae earum non habentes adiutorium.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/034.yaml
  text: Virgins will mourn, having no bridegrooms; women will mourn, having no husbands; their daughters will mourn, having no help.
translation:
  language: ko
  text: 처녀들은 신랑이 없어서 애도할 것이고, 여자들은 남편이 없어서 애도할 것이며, 그 딸들은 도움받을 이가 없어서 애도할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lugebunt
  english_pob_choice: will mourn
  chosen_korean: 애도할 것입니다
  alternatives_korean:
  - 슬퍼할 것입니다
  - 통곡할 것입니다
  lexicon: Latin lugeo
  rationale: 반복되는 lament 동사로서 단순한 감정보다 애곡·상실의 탄식을 드러내는 한국어를 택했습니다.
- source_word: virgines / sponsos
  english_pob_choice: virgins / bridegrooms
  chosen_korean: 처녀들 / 신랑
  alternatives_korean:
  - 동정녀들 / 신랑들
  - 처녀들 / 약혼자들
  lexicon: Latin virgo / sponsus
  rationale: virgines는 성적으로 순결한 미혼 여성을 가리키는 기본 뜻을 따라 ‘처녀들’로 옮겼고, sponsos는 혼인 상대를 가리키는 관계적 표현이어서 ‘신랑’으로 옮겼습니다.
- source_word: mulieres / viros
  english_pob_choice: women / husbands
  chosen_korean: 여자들 / 남편
  alternatives_korean:
  - 여성들 / 남편들
  - 아내들 / 남편
  lexicon: Latin mulier / vir
  rationale: mulieres는 일반적인 ‘여자들’이고, viros는 혼인 관계 속 남성을 가리키므로 문맥상 ‘남편’이 자연스럽습니다.
- source_word: adiutorium
  english_pob_choice: help
  chosen_korean: 도움받을 이
  alternatives_korean:
  - 도움
  - 조력자
  - 도와줄 사람
  lexicon: Latin adiutorium
  rationale: 단순한 추상명사 ‘도움’보다, 문맥상 없어져 버린 구체적 보호자/지원자의 부재를 드러내기 위해 사람 중심의 표현으로 풀었습니다.
theological_decisions:
- issue: 반복되는 상실의 애도 구조
  chosen_reading: 세 부류 모두 ‘—해서 애도할 것입니다’라는 반복 구조를 유지했습니다.
  alternative_readings:
  - 문장을 한 번의 총괄적 탄식으로 합치는 번역
  - ‘슬퍼할 것입니다’로 완화하는 번역
  rationale: 원문과 영어 본문 모두 세 번의 병렬적 애곡을 통해 상실의 누적을 강조하므로, 반복을 보존해야 문장의 재난적 효과가 살아납니다.
  doctrine_reference: 본문의 수사 구조 보존
