revisions:
- from: 처녀들은 신랑이 없어서 애도할 것이고, 여자들은 남편이 없어서 애도할 것이며, 그 딸들은 도움받을 이가 없어서 애도할 것입니다.
  to: 처녀들은 신랑들이 없어서 슬퍼할 것이며, 여자들은 남편들이 없어서 슬퍼할 것이고, 그들의 딸들은 도움이 없어서 슬퍼할 것입니다.
  rationale: 원문의 반복 병렬 구조와 미래의 재난 탄식을 유지하면서, adiutorium의 추상적 의미를 ‘도움’으로 바로 옮겼습니다. lugebunt은 특정 장례 애도로 한정하지 않고 자연스러운 ‘슬퍼할 것입니다’로 옮겼습니다. 복수 명사를 명시하여 각 집단의 복수 표현도 보존했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:19Z'
review_pass:
  verdict: revise
  source_fidelity: 라틴어의 세 병렬 절과 미래 시제는 대체로 보존되었습니다. 그러나 adiutorium은 ‘도움, 지원’이라는 추상명사인데, 초안의 ‘도움받을 이’는 원문에 없는 인물(조력자)을 특정하여 뜻을 좁힙니다.
  naturalness: 문장 종결은 합쇼체로 적절하지만, 상실의 대상을 직접 애도하는 경우에 주로 쓰이는 ‘애도하다’보다 이 문맥의 lugebunt에는 ‘슬퍼하다’가 현대 한국어에서 더 자연스럽고 무표적인 대응입니다.
  terminology: virgines/sponsos, mulieres/viros는 각각 ‘처녀들/신랑들’, ‘여자들/남편들’로 적절합니다. earum은 ‘그들의’로 명시하고, adiutorium은 ‘도움’으로 유지해야 합니다.
  issues:
  - severity: medium
    issue: ‘도움받을 이’가 adiutorium을 사람으로 바꿈
    rationale: 원문은 ‘도움이 없는’(non habentes adiutorium)이라고 할 뿐, 도움을 줄 특정 인물의 부재를 말하지 않습니다. 영어 POB도 ‘no help’로 추상성을 유지합니다.
  - severity: low
    issue: ‘애도하다’의 어감
    rationale: lugebunt은 넓게 ‘슬퍼하다, 애곡하다’라는 뜻입니다. 여기서는 사망자를 대상으로 하는 듯한 ‘애도하다’보다 ‘슬퍼하다’가 자연스럽고 불필요한 의미 제한이 없습니다.
  revised_text: 처녀들은 신랑들이 없어서 슬퍼할 것이며, 여자들은 남편들이 없어서 슬퍼할 것이고, 그들의 딸들은 도움이 없어서 슬퍼할 것입니다.
