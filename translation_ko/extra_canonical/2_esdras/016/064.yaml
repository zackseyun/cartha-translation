  text: et quae cogitatis in cordibus uestris. uae peccantibus et uolentibus occultare peccata sua. Propter quod dominus scrutinando
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/064.yaml
  text: Woe to those who sin and want to hide their sins!
translation:
  language: ko
  text: 죄를 짓고 자기 죄를 숨기려 하는 사람들은 화가 있습니다!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vae peccantibus
  english_pob_choice: Woe to those who sin
  chosen_korean: 죄를 짓는 사람들은 화가 있습니다
  alternatives_korean:
  - 죄인들에게 화가 있습니다
  - 죄를 범하는 자들에게 화가 있습니다
  lexicon: vae
  rationale: 라틴어 감탄사 vae는 단순한 탄식보다 심판 선언의 뉘앙스를 지녀, 한국어에서는 ‘화가 있습니다’로 옮겨 경고의 힘을 살렸습니다.
- source_word: uolentibus occultare peccata sua
  english_pob_choice: and want to hide their sins
  chosen_korean: 자기 죄를 숨기려 하는
  alternatives_korean:
  - 자기 죄를 감추고자 하는
  - 자기 죄를 숨기고 싶어 하는
  lexicon: occultare
  rationale: uolentibus는 의도·지향을 나타내므로 ‘하려 하는’으로 자연스럽게 풀었고, occultare는 ‘숨기다’로 직역 가능하지만 한국어에서는 ‘감추다’와 함께 검토되었으나 본문에서는 더 직접적인 ‘숨기다’를 택했습니다.
- source_word: peccata sua
  english_pob_choice: their sins
  chosen_korean: 자기 죄
  alternatives_korean:
  - 그들의 죄
  - 자신의 죄
  lexicon: peccata
  rationale: peccata sua는 소유 관계를 분명히 하므로 ‘자기 죄’로 옮겨 책임의 직접성을 드러냈습니다.
theological_decisions:
- issue: 심판적 경고의 어조
  chosen_reading: ‘화가 있습니다’로 심판 선언의 예언적 경고를 유지했습니다.
  alternative_readings:
  - ‘불행합니다’
  - ‘재앙이 닥칠 것입니다’
  rationale: 본문의 vae는 단순한 슬픔표현이 아니라 죄인에게 선포되는 경고이므로, 한국어에서도 도덕적 경고와 심판의 긴장을 보존하는 표현이 적절합니다.
  doctrine_reference: 예언서 및 묵시문학의 화 선언
