  source_fidelity: 현존 절의 대상 구절인 “uae peccantibus et uolentibus occultare peccata sua”를 충실히 옮겼습니다. peccantibus의 현재적 의미와 uolentibus의 의도·지향, peccata sua의 재귀적 소유 관계가 모두 보존되었습니다. 제시된 라틴어의 앞뒤 미완 문구는 이 번역 단위에 포함되지 않은 문맥이므로 본문에 덧붙이지 않은 것이 적절합니다.
