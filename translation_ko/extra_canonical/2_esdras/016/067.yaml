  text: What will you do? Or how will you hide your sins before God
translation:
  language: ko
  text: 당신들은 어떻게 하시겠습니까? 아니면 하나님 앞에서 당신들의 죄를 어떻게 숨기시겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: facietis?
  english_pob_choice: What will you do?
  chosen_korean: 당신들은 어떻게 하시겠습니까?
  alternatives_korean:
  - 무엇을 하시겠습니까?
  - 어찌하시겠습니까?
  lexicon: facio
  rationale: 라틴어 수사 의문문 facietis?는 단순 미래형 질문으로, 상황적 압박을 드러내기 위해 한국어에서는 자연스러운 「어떻게 하시겠습니까?」로 옮겼습니다.
- source_word: abscondetis
  english_pob_choice: how will you hide
  chosen_korean: 어떻게 숨기시겠습니까
  alternatives_korean:
  - 어떻게 감추시겠습니까
  - 어찌 숨기시겠습니까
  lexicon: abscondo
  rationale: abscondere는 ‘숨기다/감추다’의 의미이며, 죄를 은폐하려는 뉘앙스를 살리기 위해 「숨기다」를 기본으로 택했습니다.
- source_word: peccata uestra
  english_pob_choice: your sins
  chosen_korean: 당신들의 죄
  alternatives_korean:
  - 너희의 죄
  - 죄들
  lexicon: peccatum
  rationale: 복수형 peccata는 개인적·집합적 죄책을 가리키므로 「죄들」도 가능하지만, 문맥상 직설적이고 자연스러운 「당신들의 죄」로 번역했습니다.
- source_word: coram deo
  english_pob_choice: before God
  chosen_korean: 하나님 앞에서
  alternatives_korean:
  - 하나님 앞에
  - 하나님 면전에서
  lexicon: coram + Deus
  rationale: coram은 ‘~앞에서/면전에서’의 공개성·대면성을 지니므로, 심판 앞의 노출을 드러내는 「하나님 앞에서」가 적절합니다.
theological_decisions:
- issue: 원문에 없는 ‘그의 천사들’ 여부
  chosen_reading: 라틴어 본문에는 coram deo까지만 있으므로, 천사 관련 표현을 넣지 않았습니다.
  alternative_readings:
  - 하나님과 그의 천사들 앞에서
  - 하나님 앞에서와 그의 천사들 앞에서
  rationale: 제공된 cleaned Latin 및 최신 수정판이 모두 ‘and his angels’를 제거했으므로, 본문 증거에 없는 요소를 확장하지 않았습니다.
  doctrine_reference: 본문 비평 원칙
- issue: 수사 의문문의 직접성
  chosen_reading: 두 개의 질문을 한국어에서도 직접적인 수사 의문문으로 유지했습니다.
  alternative_readings:
  - 당신들이 무엇을 할 수 있겠습니까?
  - 당신들이 죄를 숨길 수 있겠습니까?
  rationale: 원문은 경고와 무력함을 압박하는 연속 질문이므로, 평서문으로 완화하지 않고 원문의 긴박성을 보존했습니다.
  doctrine_reference: 수사학적 평행법
