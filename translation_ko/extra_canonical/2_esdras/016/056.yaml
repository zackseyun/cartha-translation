base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/056.yaml
  text: He who said, “Let heaven be made,” and it was made; and by his word the stars were founded.
translation:
  language: ko
  text: “하늘이 생겨라” 말씀하시자, 하늘이 생겼습니다. 그분의 말씀으로 별들이 세워졌습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fiat caelum, et factum est
  english_pob_choice: “Let heaven be made,” and it was made
  chosen_korean: “하늘이 만들어지라” 하신 분은 그대로 이루셨고
  alternatives_korean:
  - “하늘이 있게 되라” 하신 분은 그대로 되셨고
  - “하늘을 만들라” 하신 분은 그렇게 되게 하셨고
  lexicon: fiat → “~되라/만들어지라”; caelum → 하늘
  rationale: 라틴어 수동적 명령형 fiat를 한국어의 명령-성취 구조로 살리되, POB의 문맥상 창조 행위를 자연스럽게 드러내기 위해 “만들어지라”를 택했습니다.
- source_word: in uerbo illius
  english_pob_choice: by his word
  chosen_korean: 그분의 말씀으로
  alternatives_korean:
  - 그분의 말로
  - 그의 말씀으로
  lexicon: verbum → 말씀
  rationale: uerbo는 단순한 발화보다 권능 있는 ‘말씀’을 뜻하므로, 창조적 행위를 드러내는 표준어 ‘말씀’으로 옮겼습니다.
- source_word: stellae fundatae
  english_pob_choice: the stars were founded
  chosen_korean: 별들이 세워졌습니다
  alternatives_korean:
  - 별들이 터를 잡았습니다
  - 별들이 기초를 놓았습니다
  lexicon: stellae → 별들; fundatae → 세워지다/기초가 놓이다
  rationale: fundatae의 ‘기초가 놓이다’는 뜻을 한국어에서 가장 직접적으로 드러내기 위해 ‘세워지다’를 택했으며, 우주 질서의 확립이라는 이미지도 유지합니다.
theological_decisions:
- issue: ‘heaven’의 한국어 표기
  chosen_reading: 하늘
  alternative_readings:
  - 천국
  - 하늘나라
  rationale: 원문 caeli는 종말론적 천국이 아니라 창조된 하늘을 가리키므로, 오해를 피하기 위해 ‘하늘’로 번역했습니다.
  doctrine_reference: 창조론/우주론
