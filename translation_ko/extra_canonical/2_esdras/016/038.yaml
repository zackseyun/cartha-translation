source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'dominus: Ecce adpropinquant mala et non tardantur. Quemadmodum praegnans in nono mense filium suum, adpropinquante hora partus eius, ante horas duas uel tres gementes dolores circum uentrem eius, et prodiente infante de uentre non tardabit'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/038.yaml
  text: Behold, evils are drawing near and are not delayed, just as a pregnant woman in the ninth month with her child, when the hour of her delivery draws near, for two or three hours great pains surround her womb, and when the child comes forth from the womb, it will not delay.
translation:
  language: ko
  text: 보십시오, 재앙들이 다가오고 있으며 지체되지 않습니다. 마치 아기를 밴 여인이 임신 아홉째 달에 이르러 해산할 시간이 가까워질 때, 두세 시간 전부터 심한 진통이 그 배를 둘러싸고, 아이가 태에서 나올 때에는 더 이상 지체가 없을 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 mala는 문맥상 도덕적 ‘악’보다 닥쳐오는 ‘재앙들/환난’의 뜻으로 읽었습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보라
  lexicon: 직접호출
  rationale: 예언적 경고의 주의를 끄는 감탄사로, 현대 합쇼체에서는 「보십시오」가 가장 자연스럽고 직접적입니다.
- source_word: mala
  english_pob_choice: evils
  chosen_korean: 재앙들
  alternatives_korean:
  - 악들
  - 악한 일들
  lexicon: 악/재앙 어휘
  rationale: 문맥상 개인의 도덕적 악보다 닥쳐오는 파국적 재난을 가리키므로 「재앙들」이 source-direct합니다.
- source_word: circum ventrem eius
  english_pob_choice: surround her womb
  chosen_korean: 그 배를 둘러싸고
  alternatives_korean:
  - 그 태를 둘러싸고
  - 자궁 주위를 둘러싸고
  lexicon: 신체 표현
  rationale: 라틴어의 구체적 이미지인 ‘배/복부’를 살리되, 한국어에서는 임신 산통의 체감되는 신체 이미지를 유지하기 위해 「배」를 택했습니다.
- source_word: prodiente infante de uentre
  english_pob_choice: when the child comes forth from the womb
  chosen_korean: 아이가 태에서 나오면
  alternatives_korean:
  - 아기가 배에서 나오면
  - 아이가 자궁에서 나오면
  lexicon: 출산 묘사
  rationale: 출산 장면을 현대 한국어로 자연스럽게 옮기면서도 원문의 ‘태에서 나오다’라는 직접성을 보존했습니다.
theological_decisions:
- issue: 재앙(mala)의 범위
  chosen_reading: 도덕적 악 일반보다 종말론적/역사적 재앙과 환난의 도래를 가리키는 경고로 읽었습니다.
  alternative_readings:
  - 인간의 악행이 늘어나는 뜻
  - 악령적 악의 일반적 확산
  rationale: 비유 전체가 출산 임박의 불가피성과 속도를 강조하므로, 여기서는 윤리적 추상보다 닥쳐오는 환난의 임박성을 드러내는 읽기가 문맥에 더 적합합니다.
  doctrine_reference: 종말 경고와 환난의 임박성
