lexical_decisions:
- source_word: Audite uerbum
  english_pob_choice: Hear the word
  chosen_korean: 말씀을 들으십시오
  alternatives_korean:
  - 그 말씀을 들으십시오
  - 말을 들으십시오
  lexicon: audire / verbum
  rationale: uera-bum은 단순한 '말'보다 권위 있는 '말씀'에 가깝고, 명령형은 합쇼체로 살려 공적 호소의 톤을 유지했습니다.
- source_word: plebs mea
  english_pob_choice: my people
  chosen_korean: 내 백성아
  alternatives_korean:
  - 내 백성들아
  - 나의 백성아
  lexicon: plebs
  rationale: 직접 호칭이므로 구어적이되 격식 있는 호격으로 옮겼고, 소유 표현은 원문의 친밀한 언약적 호소를 살렸습니다.
- source_word: parate uos in pugnam
  english_pob_choice: prepare yourselves for battle
  chosen_korean: 전쟁을 준비하고
  alternatives_korean:
  - 전투를 준비하고
  - 싸움을 준비하고
  lexicon: parare / pugna
  rationale: pugna는 군사적 충돌을 가리켜 '전쟁'이 가장 포괄적이며, 한국어에서는 '준비하고'로 자연스럽게 연결했습니다.
- source_word: in malis
  english_pob_choice: in the midst of evils
  chosen_korean: 재앙들 가운데서는
  alternatives_korean:
  - 악들 가운데서는
  - 고난들 가운데서는
  lexicon: malum
  rationale: malis는 도덕적 '악'과 재난적 '해악/재앙'의 폭이 있으나, 문맥상 닥쳐오는 환난을 가리키므로 '재앙들'을 택했습니다.
- source_word: sicut peregrini super terram
  english_pob_choice: be like strangers on the earth
  chosen_korean: 땅에서 나그네처럼 지내십시오
  alternatives_korean:
  - 땅에서 이방인처럼 지내십시오
  - 땅 위에서 낯선 사람처럼 지내십시오
  lexicon: peregrinus
  rationale: peregrini는 '이방인'도 가능하지만, 땅의 삶을 임시 거처로 사는 태도를 살리기 위해 성서적 뉘앙스가 있는 '나그네'를 사용했습니다.
theological_decisions:
- issue: malis의 범위
  chosen_reading: 도덕적 악보다 임박한 재앙과 환난을 염두에 둔 표현으로 읽었습니다.
  alternative_readings:
  - 악들 가운데서는
  - 환난들 가운데서는
  rationale: 앞절과 주변 문맥의 경고적 어조를 고려할 때, 독자에게 요구되는 자세는 추상적 악의 회피보다 재난 속 인내와 대비로 보입니다.
  doctrine_reference: 문맥적 의미 우선의 번역 원칙
