    rationale: 명령은 전쟁을 준비하라는 일반적 지시보다 청자들이 전투에 맞설 준비를 하라는 뜻입니다.
  - severity: low
    issue: 두 각주는 본문 의미에 필요한 대안 정보를 제공하기보다 어휘를 단정하고 해석을 덧붙입니다.
    rationale: 특히 원문 표기와 영어 감사 기록 사이에 후반부 어형을 독립적으로 확정하기 어려운 상황에서, ‘peregrini’의 의미 효과를 설명하는 주석은 불필요하게 해석적입니다.
