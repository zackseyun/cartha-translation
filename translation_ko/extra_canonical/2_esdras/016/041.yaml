  verdict: revise
  source_fidelity: 핵심 명령과 ‘재앙들 가운데서 … 나그네처럼’이라는 비유는 영어 POB의 번역 계보 및 해당 절의 알려진 라틴어 문맥에 대체로 충실합니다. 다만 parate vos in pugnam은 단순히 전쟁 자체를 준비한다기보다 청자 자신이 전투를 맞도록 준비하라는 뜻이므로, 한국어에서는 ‘전투에 대비하십시오’가 더 정확합니다. 제공된 라틴어 표기는 malis에서 절이 잘려 있으나, 영어 POB와 초안의 후반부는 통상 전승되는 절의 계속 문구에 부합합니다.
  naturalness: ‘내 백성아’와 합쇼체 명령은 자연스럽습니다. 그러나 ‘전쟁을 준비하고’는 목적어 관계가 다소 불분명하고, 연결형보다 각 명령을 독립 문장으로 제시하는 편이 공적 경고의 어조를 더 자연스럽게 보존합니다.
  terminology: ‘말씀’은 종교 문맥에서 가능한 표현이며, ‘재앙들’은 malis의 문맥상 재난적 의미를 무리 없이 반영합니다. ‘나그네’도 peregrini/advenae 계열의 비정주적·낯선 존재라는 비유를 자연스럽게 전달합니다. 다만 기존 각주는 원문의 어휘를 단정하거나 해석적 효과를 부가하므로 필수적이지 않으며 삭제하는 것이 좋습니다.
