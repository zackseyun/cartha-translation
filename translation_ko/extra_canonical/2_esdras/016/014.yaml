  source_fidelity: 개정이 필요합니다. 라틴어의 donec는 ‘다만’이 아니라 ‘~까지’라는 시간 접속사입니다. 원문이 이 접속사에서 중단되므로, 한국어도 뒤따를 사건·시점을 보충하지 않은 미완성 구문으로 남겨야 합니다. 또한 in fines terrae는 앞 절에서 이어지는 듯한 단편이므로 ‘땅 끝까지입니다’처럼 서술문으로 완결하지 않는 것이 맞습니다.
  naturalness: ‘땅 끝까지.’는 단편으로서 자연스럽게 원문의 절단 상태를 보존합니다. ‘악들이’는 다소 문어적이지만 예언적 경고 문맥에서 복수의 ‘mala’를 유지하는 표현으로 수용 가능합니다. 끝의 대시와 말줄임표는 한국어에서 불완전하게 끝난 ‘~까지는’을 독자에게 명확히 보여 줍니다.
  terminology: Ecce는 ‘보십시오’로 적절합니다. mala는 영어 POB의 ‘evils’ 및 복수성을 따라 ‘악들’로 유지합니다. mittuntur의 현재 수동은 ‘보내지고 있으며’로 보존합니다. ‘땅 끝까지’는 fines terrae의 관용적이고 자연스러운 대응입니다.
