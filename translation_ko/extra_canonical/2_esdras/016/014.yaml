    text: 라틴어 in fines terrae는 직역하면 ‘땅의 끝들’이지만, 한국어에서는 관용적으로 ‘땅 끝까지’가 가장 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: in fines terrae
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅 끝까지
  alternatives_korean:
  - 세상 끝까지
  - 땅의 끝까지
  lexicon: fines terrae
  rationale: 라틴어 복수형 표현을 자연스럽게 옮기면서도, 지리적·수사적 범위를 보존하기 위해 ‘땅 끝까지’를 택했습니다.
- source_word: Ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 이것을 보십시오
  lexicon: Ecce
  rationale: 예언적 경고의 주의를 환기하는 감탄사를 현대 합쇼체로 살려 ‘보십시오’로 옮겼습니다.
- source_word: mala
  english_pob_choice: evils
  chosen_korean: 악들
  alternatives_korean:
  - 재앙들
  - 악한 것들
  lexicon: mala
  rationale: 문맥상 단순한 ‘나쁜 일’보다 인격화된 재앙적 위협을 드러내는 복수형으로 ‘악들’을 선택했습니다.
- source_word: mittuntur
  english_pob_choice: are sent out
  chosen_korean: 보내지고 있으며
  alternatives_korean:
  - 보내집니다
  - 내려지고 있습니다
  lexicon: mittuntur
  rationale: 수동 현재의 진행성을 살려, 이미 발해져 가는 상태를 드러내는 ‘보내지고 있으며’로 옮겼습니다.
theological_decisions:
- issue: 원문이 ‘donec’에서 끊겨 문장이 미완성임
  chosen_reading: 한국어도 완결되지 않은 채 끝나도록 ‘다만’으로 마감했습니다.
  alternative_readings:
  - 문장을 임의로 완결해 자연스럽게 만들기
  - 생략 부호로 후속 절을 암시하기
  rationale: 라틴어 원문과 영어 POB 수정 이력 모두 여기서 본문이 중단됨을 보여 주므로, 의미를 보태지 않고 미완성 상태를 보존했습니다.
  doctrine_reference: source integrity / textual criticism
