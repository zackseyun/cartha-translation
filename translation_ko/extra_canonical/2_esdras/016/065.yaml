lexical_decisions:
- source_word: scrutinabit
  english_pob_choice: will search out
  chosen_korean: 샅샅이 살피시고
  alternatives_korean:
  - 찾아내시고
  - 조사하시고
  - 면밀히 살피시고
  lexicon: scrutinor
  rationale: 단순한 ‘보다’보다 숨은 것까지 자세히 검토한다는 뜻을 살려, ‘샅샅이 살피다’로 옮겼습니다.
- source_word: traducet
  english_pob_choice: will expose
  chosen_korean: 드러내실 것입니다
  alternatives_korean:
  - 폭로하실 것입니다
  - 노출하실 것입니다
  - 밝히실 것입니다
  lexicon: traduco
  rationale: 공적이고 부정적인 맥락에서 숨겨진 것을 밖으로 드러내는 의미를 살려, 자연스럽고도 직접적인 ‘드러내다’를 선택했습니다.
- source_word: uos omnes
  english_pob_choice: you all
  chosen_korean: 너희 모두를
