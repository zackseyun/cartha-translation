  - 너희 전부를
  - 여러분 모두를
  - 너희를 모두
  lexicon: vos omnes
  rationale: 복수 대명사의 전체성을 그대로 반영하기 위해 ‘너희 모두’를 사용했습니다.
theological_decisions:
- issue: 문장의 끝에 남아 있는 ‘Et uos’의 처리
  chosen_reading: 본문이 끊어진 상태를 그대로 반영해, 마지막에 ‘그리고 너희는’으로 남겼습니다.
  alternative_readings:
  - 이어서 완결형으로 매끄럽게 마무리하기
  - 마지막 단절을 생략하기
  rationale: 제공된 라틴 본문과 영어 개정이 모두 마지막 구절이 미완결임을 보여 주므로, 한국어도 문장 종결을 보류해 단절을 보존했습니다.
