    reason: source_note
lexical_decisions:
- source_word: Ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보라,
  - 보십시오,
  lexicon: 경고/주의 환기 표현
  rationale: 라틴어 감탄사 ecce와 POB의 Behold를 한국어 합쇼체로 자연스럽게 옮겨, 독자의 주의를 즉시 끌도록 했습니다.
- source_word: fames
  english_pob_choice: famine
  chosen_korean: 기근
  alternatives_korean:
  - 굶주림
  - 흉년
  lexicon: 재난 어휘
  rationale: 문맥상 대규모 식량 부족과 재난을 가리키므로 가장 직접적인 대응어인 기근을 택했습니다.
- source_word: plaga
  english_pob_choice: plague
  chosen_korean: 재앙
  alternatives_korean:
  - 역병
  - 전염병
  lexicon: 재난/심판 어휘
  rationale: 라틴어 plaga는 여기서 구체적 질병명보다 하나님의 징벌로서의 재앙을 폭넓게 가리키므로, POB의 plague를 한국어 재앙으로 옮겨 심판적 뉘앙스를 살렸습니다.
- source_word: tribulatio
  english_pob_choice: tribulation
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 곤경
  lexicon: 고난 어휘
  rationale: tribulatio의 압박·시련 의미를 한국어 성경어 환난으로 충실히 반영했습니다.
theological_decisions:
- issue: sent as scourges for correction의 징계적 의미
  chosen_reading: 이 재앙들은 사람을 바로잡기 위한 징벌로 보내진 것입니다.
  alternative_readings:
  - 심판으로 보내진 것입니다
  - 훈계를 위해 보내진 것입니다
  rationale: POB의 for correction은 단순한 처벌보다 회개와 교정을 목표로 하는 징계의 의미를 가지므로, 징벌로서의 목적을 분명히 드러냈습니다.
  doctrine_reference: 하나님의 징계와 교정적 심판에 대한 성경적 표현
