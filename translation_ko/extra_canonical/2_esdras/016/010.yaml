  source_fidelity: 라틴어의 두 수사 의문문과 핵심 동사 extinguat(끄다, 꺼뜨리다), coruscabit(번쩍이다), timebit(두려워하다)는 대체로 정확히 반영되었습니다. 다만 원문은 신적 칭호를 사용하지 않고 남성 단수 대명사로만 지시하므로, 한국어에서도 존칭 대명사 ‘그분’은 유지하되 불필요하게 설명을 덧붙이지 않는 편이 좋습니다.
  naturalness: ‘그를 꺼뜨릴 자’는 이해되지만 현대 표준어 합쇼체에서는 ‘그를 꺼뜨릴 사람이’가 더 자연스럽습니다. 또한 두 번째 절은 ‘그분께서는’으로 주어를 분명히 하면 문장이 매끄럽습니다.
  terminology: ‘꺼뜨리다’는 extinguat의 불을 끄는 비유를 잘 살립니다. ‘번쩍이실 것이며’와 ‘두려워하지 않겠습니까?’도 coruscabit 및 수사 의문문 quis non timebit?에 적절합니다.
  issues:
