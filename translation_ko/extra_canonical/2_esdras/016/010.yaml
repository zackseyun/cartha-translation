    rationale: 의미 오류는 아니지만, 현대 표준어의 자연스러운 합쇼체 문체에는 ‘사람’이 더 적합합니다.
  - severity: low
    issue: 각주가 문맥상 확정되지 않은 ‘불꽃’ 이미지를 단정적으로 서술함
    rationale: extinguere에는 ‘끄다’의 의미가 있으나, 이 한 절만으로 지시 대상의 이미지를 ‘불꽃’으로 확정하기보다 어휘 의미만 간결하게 설명하는 편이 안전합니다.
