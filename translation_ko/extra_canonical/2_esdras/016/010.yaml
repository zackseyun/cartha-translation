lexical_decisions:
- source_word: est qui extinguat eum?
  english_pob_choice: Will there be anyone to extinguish him?
  chosen_korean: 그를 꺼뜨릴 자가 있겠습니까?
  alternatives_korean:
  - 그를 끌 자가 있겠습니까?
  - 그를 소멸시킬 자가 있겠습니까?
  lexicon: extinguo
  rationale: 불을 끄다의 감각을 살려, 단순한 ‘죽이다’보다 원문의 ‘꺼뜨리다/끄다’ 이미지를 직역에 가깝게 옮겼습니다.
- source_word: Coruscabit
  english_pob_choice: He will flash forth
  chosen_korean: 그분은 번쩍이실 것이며
  alternatives_korean:
  - 그분은 번뜩이실 것이며
  - 그분은 섬광처럼 나타나실 것이며
  lexicon: corusco
  rationale: 짧고 강한 섬광의 움직임을 살려 ‘번쩍이다’를 택했습니다.
- source_word: quis non timebit?
  english_pob_choice: who will not fear?
  chosen_korean: 누가 두려워하지 않겠습니까?
  alternatives_korean:
  - 누가 무서워하지 않겠습니까?
  - 누가 두려워하겠습니까?
  lexicon: timeo
  rationale: 수사 의문문을 살려, ‘두려워하지 않겠습니까’로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 신적 주어의 지시와 존칭 처리
  chosen_reading: 문맥상 직접 호칭이 아니라 서술이므로 ‘그분은’으로 통일하고, 하나님의 압도적 현현 이미지를 유지했습니다.
  alternative_readings:
  - 그는 번쩍일 것이며
  - 주님은 번쩍이실 것이며
  rationale: 원문은 인칭 대명사로 신적 존재를 지시할 뿐 직접 호칭은 아니므로, 한국어에서는 과도한 경어적 반복을 피하면서도 신적 위엄을 보존했습니다.
  doctrine_reference: 문맥상 신현/심판의 위엄 표현
