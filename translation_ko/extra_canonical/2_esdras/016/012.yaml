id: 2ES.16.12
reference: 2 Esdras 16:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: non funditus conteretur a facie ipsius? Terra tremuit et fundamenta eius, mare fluctuatur de profundo, et fluctus eius disturbabuntur et pisces eius a facie domini et a gloria uirtutis eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/012.yaml
  text: Will not the earth be utterly crushed before him? The earth quakes[a], and its foundations; the sea surges from the deep, and its waves and its fish will be troubled before the Lord and before the glory of his power.
  footnotes:
  - marker: a
    text: Or 'are troubled'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅이 그 앞에서 완전히 부서지지 않겠습니까? 땅은 떨고 그 기초들도 흔들리며, 바다는 깊은 곳에서 물결치고, 그 파도와 물고기들은 주와 그의 권능의 영광 앞에서 요동할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non funditus conteretur a facie ipsius?
  english_pob_choice: Will not the earth be utterly crushed before him?
  chosen_korean: 땅이 그 앞에서 완전히 산산조각 나지 않겠습니까?
  alternatives_korean:
  - 땅이 그 앞에서 완전히 부서지지 않겠습니까?
  - 땅이 그 앞에서 철저히 무너지지 않겠습니까?
  lexicon: contero / funditus
  rationale: 수사적 반문과 funditus의 강한 ‘완전히’라는 뜻을 살려, 단순한 파괴보다 더 강한 ‘산산조각’으로 압박감을 드러냈습니다.
- source_word: Terra tremuit et fundamenta eius
  english_pob_choice: The earth quakes, and its foundations
  chosen_korean: 땅은 떨며 그 기초들도 흔들리고
  alternatives_korean:
  - 땅은 떨고 그 기초들도 흔들리고
  - 땅은 흔들리며 그 기초들도 요동치고
  lexicon: tremo / fundamenta
  rationale: ‘tremuit’를 현재적 장면감으로 살리되, ‘fundamenta’는 비유적 ‘기초들’로 두어 지반 붕괴 이미지를 유지했습니다.
- source_word: mare fluctuatur de profundo, et fluctus eius disturbabuntur et pisces eius
  english_pob_choice: the sea surges from the deep, and its waves and its fish will be troubled
  chosen_korean: 바다는 깊은 곳에서 솟구치며 그 파도와 그 물고기들도 혼란에 빠질 것입니다
  alternatives_korean:
  - 바다는 깊은 데서 출렁이고 그 파도와 그 물고기들도 흔들릴 것입니다
  - 바다는 깊은 곳에서 요동하며 그 파도와 그 물고기들도 어지러워질 것입니다
  lexicon: fluctuatur / disturbabuntur
  rationale: 마레의 거대한 동요를 ‘솟구치며’로, future passive disturbabuntur를 미래형 ‘혼란에 빠질 것입니다’로 옮겨 종말론적 진행을 살렸습니다.
- source_word: a facie domini et a gloria uirtutis eius
  english_pob_choice: before the Lord and before the glory of his power
  chosen_korean: 주와 그의 권능의 영광 앞에서
  alternatives_korean:
  - 주님과 그의 권능의 영광 앞에서
  - 주와 그의 능력의 영광 앞에서
  lexicon: dominus / gloria uirtutis
  rationale: 주어가 야훼를 가리키는 구약적 표현으로 이해될 수 있으나, 본문 자체의 라틴어 호칭을 따라 ‘주’를 유지했고, uirtus를 ‘권능’으로 옮겨 힘의 위엄을 분명히 했습니다.
theological_decisions:
- issue: 수사적 반문을 첫머리에 복원할지 여부
  chosen_reading: 첫 문장의 반문형을 살려, 창조 질서 전체가 심판자 앞에서 무너질 수밖에 없다는 긴박한 예언적 수사를 유지했습니다.
  alternative_readings:
  - 첫 문장을 선언문처럼 평서로 옮김
  - 반문을 약화해 단순한 예고문으로 처리
  rationale: 출처 라틴어의 non funditus conteretur a facie ipsius?는 단순 정보가 아니라 압박하는 예언적 반문이므로, 이를 유지해야 문맥의 긴장감이 살아납니다.
  doctrine_reference: 예언적 수사와 심판 묘사
- issue: future passive의 종말론적 진행성
  chosen_reading: ‘될 것입니다’ 계열의 미래형을 일관되게 사용해, 이미 진행 중인 붕괴 예고가 아니라 앞으로 닥칠 심판을 드러냈습니다.
  alternative_readings:
  - 현재형으로 완화
  - 서술적 과거로 처리
  rationale: disturbabuntur와 선행 미래들의 연쇄를 반영하여, 사건의 시간성을 평탄화하지 않도록 했습니다.
  doctrine_reference: 본문 시간성 보존
