  - severity: low
    issue: ‘완전히 산산조각 나지 않겠습니까?’
    rationale: funditus conteretur의 철저한 파괴는 보존하지만, ‘산산조각’은 원문보다 구체적이고 다소 구어적인 표현입니다. ‘완전히 부서지다’가 더 중립적입니다.
  - severity: medium
    issue: 현재형 대안 각주
    rationale: disturbabuntur는 미래 수동 직설법입니다. 본문과 대립하는 현재형 ‘혼란에 빠집니다’를 대안으로 제시할 원문상 근거가 없습니다.
