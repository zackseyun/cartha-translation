translation:
  language: ko
  text: 마치 올리브 과수원에서 올리브가 세 개나 네 개만 남는 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 라틴어는 'in oliveto'라고만 하며, '각 나무마다'에 해당하는 말은 없습니다.
    reason: source_note
lexical_decisions:
- source_word: quemadmodum
  english_pob_choice: As in
  chosen_korean: 마치 …과 같습니다
  alternatives_korean:
  - …처럼 됩니다
  - …와 같습니다
  lexicon: quemadmodum
  rationale: 비교를 여는 표현이므로 한국어에서도 직접적인 비유 표지로 옮겨 원문의 대비감을 살렸습니다.
- source_word: in oliveto
  english_pob_choice: in an olive orchard
  chosen_korean: 올리브 과수원에서
  alternatives_korean:
  - 올리브 밭에서
  - 올리브 나무가 있는 곳에서
  lexicon: olivetum / olivetus
  rationale: lat. in + abl.은 장소를 가리키며, POB의 수정안처럼 '각 나무마다'를 덧붙이지 않고 단순히 과수원 내부의 상황으로 옮겼습니다.
- source_word: relinquentur
  english_pob_choice: are left
  chosen_korean: 남습니다
  alternatives_korean:
  - 남겨집니다
  - 남아 있습니다
  lexicon: relinquor
  rationale: 수동적 잔여 상태를 자연스러운 현대 문장으로 옮기되, 극도의 부족과 남은 수량을 강조하는 어감을 유지했습니다.
- source_word: olivae
  english_pob_choice: olives
  chosen_korean: 올리브가
  alternatives_korean:
  - 올리브 열매가
  - 올리브 몇 알이
  lexicon: oliva
  rationale: 문맥상 열매를 가리키므로 '올리브가'로 간결하게 처리했고, 라틴어에 없는 '각 나무마다'는 넣지 않았습니다.
theological_decisions:
- issue: 과장된 희소성의 보존
  chosen_reading: 과수원 전체에 올리브가 세 개나 네 개만 남는다는 극단적 희소성을 그대로 드러냈습니다.
  alternative_readings:
  - 각 나무마다 세네 개만 남는다는 식의 완화된 표현
  - 남아 있는 올리브가 몇 개 안 된다는 완곡한 표현
  rationale: 본문은 단순한 수량 묘사가 아니라 종말론적 부족과 황폐를 강조하므로, 의미를 약화시키는 보충 설명을 피했습니다.
  doctrine_reference: 본문 의미 보존 원칙
