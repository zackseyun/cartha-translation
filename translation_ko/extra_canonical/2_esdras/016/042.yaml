  source_fidelity: 첫 절은 sic estote quasi aduenae terrae를 적절히 반영합니다. 그러나 둘째 절의 여기십시오는 라틴어의 생략된 존재/행동 비교를 ‘그 사람을 그렇게 간주하라’는 인식 행위로 바꾸어 의미를 추가합니다. qui fugiet의 미래성은 ‘달아날 사람’으로 유지할 수 있습니다.
  naturalness: ‘그 땅에서 나그네처럼 지내십시오’는 현대 표준 한국어 합쇼체로 자연스럽습니다. 둘째 절은 ‘달아날 사람처럼 행동하십시오’로 보완하면 한국어 문장이 완결되면서 비교의 대상도 명확해집니다.
  terminology: ‘나그네’는 aduenae의 비정착·타지인이라는 비유적 뜻을 자연스럽게 전달합니다. ‘파는 사람’은 qui uendit에 충분히 충실하며, 문맥에 없는 특정 거래물(‘물건’)을 덧붙이지 않는 편이 더 가깝습니다.
