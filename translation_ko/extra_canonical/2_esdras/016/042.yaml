    rationale: Qui uendit, quasi qui fugiet는 ‘파는 이는 달아날 이처럼 [행동하라/있어라]’라는 병렬적 권면입니다. ‘달아날 사람처럼 여기십시오’는 판매자를 달아날 사람으로 간주하라는 별개의 의미를 만듭니다.
