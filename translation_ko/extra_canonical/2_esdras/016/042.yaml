lexical_decisions:
- source_word: sic estote quasi aduenae terrae
  english_pob_choice: So be as strangers in the land
  chosen_korean: 그 땅에서 나그네처럼 지내십시오
  alternatives_korean:
  - 그 땅에서 외국인처럼 지내십시오
  - 그 땅에서 이방인처럼 지내십시오
  lexicon: aduenae
  rationale: aduenae는 단순한 감정적 ‘낯섦’이 아니라 땅에 속하지 않은 거주자라는 뜻이어서, 현대 한국어에서 자연스럽고 원뜻을 살리는 ‘나그네’로 옮겼습니다.
- source_word: Qui uendit
  english_pob_choice: the one who sells
  chosen_korean: 물건을 파는 사람
  alternatives_korean:
  - 파는 사람
  - 팔고 있는 자
  lexicon: qui uendit
  rationale: 라틴어 현재분사적 표현을 자연스러운 현대 한국어 서술로 풀어, 행위자를 분명히 하되 문맥상 과도한 해석을 피했습니다.
- source_word: quasi qui fugiet
  english_pob_choice: as one who will flee
  chosen_korean: 달아날 사람처럼
  alternatives_korean:
  - 도망칠 사람처럼
  - 달아나는 사람처럼
  lexicon: fugiet
  rationale: fugiet는 미래적 뉘앙스가 있어 ‘달아날 사람처럼’으로 옮겨, 임박한 도주 가능성을 드러냈습니다.
theological_decisions:
- issue: 경고의 비유적 강도
  chosen_reading: 본문은 종말적 재난 속에서 소유와 정착에 집착하지 말라는 경고를 비유적으로 말합니다.
  alternative_readings:
  - 단순한 유랑 생활 권면
