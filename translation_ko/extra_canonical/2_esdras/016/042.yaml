  rationale: 문맥상 ‘땅에서 나그네처럼’과 ‘파는 사람은 달아날 사람처럼’은 재난 대비와 임시성 인식을 강조하는 비유로 읽는 것이 가장 직접적입니다.
  doctrine_reference: 문맥적/수사적 해석
