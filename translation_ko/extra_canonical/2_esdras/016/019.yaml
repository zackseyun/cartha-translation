  philosophy: optimal-equivalence
lexical_decisions:
- source_word: potestates
  english_pob_choice: they
  chosen_korean: 그들이
  alternatives_korean:
  - 권세들이
  - 권력자들이
  - 그 권세들이
  lexicon: Latin potestates
  rationale: 문맥상 주어는 특정한 권세 세력이 아니라 앞선 문맥에서 언급된 사람들/세력을 가리키는 복수 대명사적 용법으로 읽는 것이 English POB의 ‘they’와 가장 잘 맞습니다.
- source_word: in his
  english_pob_choice: in these things
  chosen_korean: 이 일들 가운데서
  alternatives_korean:
  - 이것들 안에서
  - 이 일들에서
  - 이 일들 속에서
  lexicon: Latin in his
  rationale: 라틴어 전치사구는 관용적으로 ‘이 일들 가운데서/이런 상황에서’의 뜻이어서, 단순한 위치보다 상황적 범위를 살리는 표현이 적절합니다.
- source_word: quid
  english_pob_choice: What will they do
  chosen_korean: 무엇을 하겠습니까?
  alternatives_korean:
  - 무엇을 하겠습니까
  - 무엇을 할 수 있겠습니까?
  - 어찌하겠습니까?
  lexicon: Latin quid
  rationale: 마지막에 끊긴 질문 구조를 살려, 영어 번역의 질문 형식을 유지하면서도 한국어 자연스러운 의문문으로 옮겼습니다.
theological_decisions:
- issue: malorum를 ‘재난’으로 옮길지 ‘악/악들’로 옮길지
  chosen_reading: 재난
  alternative_readings:
  - 악들
  - 해악들
  - 악한 일들
  rationale: 영어 POB의 ‘evils’는 단순 도덕적 악보다 닥쳐오는 재앙적 불행을 가리키는 문맥으로 읽혀, 한국어에서는 독자가 즉각 이해할 수 있는 ‘재난’으로 표현하되 복수적 위기감을 유지했습니다.
  doctrine_reference: 예언적-종말론적 재난 묘사
