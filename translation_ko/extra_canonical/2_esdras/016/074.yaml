  yaml_path: translation/extra_canonical/2_esdras/016/074.yaml
  text: Then the testing of my chosen ones will appear[a][b], like gold that is tested by fire.
  footnotes:
  - marker: b
    text: Or, 'Then the testing of my chosen ones will appear.' The Latin probatio can point either to the process of testing or to the proved genuineness that results from it.
    reason: lexical_alternative
    anchor_ref: 16:74
  - marker: a
    text: Or 'Then the tested character of my chosen ones will appear, like gold that is tested by fire.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 내 택하신 이들의 시험이, 불로 시험한 금과 같이 드러날 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 택하신 이들의 시험받은 참됨이 불로 시험한 금과 같이 드러날 것입니다.’
    reason: previous_rendering
  - marker: b
    text: 또는 ‘그러면 내 택하신 이들의 시험이 드러날 것입니다.’ 라틴어 probatio는 시험의 과정 또는 그 결과로 드러난 입증된 참됨을 모두 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: suas eos eicient
  english_pob_choice: Then the testing of my chosen ones will appear
  chosen_korean: 그러면 내 택하신 이들의 시험이 드러날 것입니다
  alternatives_korean:
  - 그러면 내 택하신 이들의 증명이 드러날 것입니다
  - 그러면 내 택하신 이들의 연단이 드러날 것입니다
  lexicon: probatio
  rationale: Latin probatio는 여기서 과정으로서의 ‘시험, 검증’을 가리키며, 바로 뒤의 불로 ‘시험받는’ 금과 평행을 이루므로 결과 상태보다 시험 자체를 앞세워 옮겼습니다.
- source_word: electorum meorum
  english_pob_choice: my chosen ones
  chosen_korean: 내 택하신 이들
  alternatives_korean:
  - 내 선택된 자들
  - 내 택하신 자들
  lexicon: electi
  rationale: electorum meorum은 하나님의 주권적 선택을 드러내므로, 관계를 분명히 하는 ‘내 택하신 이들’로 옮겼습니다.
- source_word: ut aurum quod probatur ab igne
  english_pob_choice: like gold that is tested by fire
  chosen_korean: 불로 시험한 금과 같이
  alternatives_korean:
  - 불로 시험받는 금과 같이
  - 불에 의해 시험된 금처럼
  lexicon: aurum / probatur / igne
  rationale: probatur와 probatio의 같은 어근 연결을 살리기 위해 ‘시험한/시험’의 대응을 유지했고, 불이 시험의 수단임을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 시험이 무엇을 드러내는가
  chosen_reading: 문장은 택함받은 이들의 내적 성품 자체보다, 그들에게 임한 시험과 그 시험을 통해 입증되는 참됨을 함께 드러냅니다.
  alternative_readings:
  - 오직 연단된 인격의 완성만을 강조하는 읽기
  - 단순히 외부적 박해 사건만을 가리키는 읽기
  rationale: 문맥과 어근 반복(probatio / probatur)이 시험 과정과 그 검증된 참됨을 함께 지시하므로, 둘 중 하나로만 축소하지 않았습니다.
  doctrine_reference: 시련과 입증, 정련의 비유
