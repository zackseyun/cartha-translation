revisions:
- from: 그러면 내 택하신 이들의 시험이, 불로 시험한 금과 같이 드러날 것입니다.[a][b]
  to: 그러면 내가 택한 이들이 겪는 시험이 불로 시험받는 금처럼 드러날 것입니다.[a][b]
  rationale: 라틴어 probatio의 주된 의미인 ‘시험’을 본문에 유지하고, 뒤따르는 probatur ab igne를 ‘불로 시험받는’으로 정확히 옮겼습니다. ‘내가 택한 이들이 겪는’이라는 표현은 시험의 대상이 택한 이들임을 밝혀 한국어의 소유격 모호성을 줄입니다. 각주들은 영어 POB 감사 기록의 두 대안, 곧 결과적 의미와 비유를 생략한 짧은 독법을 각각 반영하도록 정정했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:48Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 명사 probatio를 ‘시험’으로 옮긴 방향은 라틴어 및 영어 POB의 주된 선택과 부합합니다. 그러나 본문의 ‘불로 시험한 금’은 한국어에서 금이 시험의 주체인 것처럼 읽힐 수 있으므로, 수동 표현으로 고쳐야 합니다. 또한 ‘내 택하신 이들’보다 ‘내가 택한 이들’이 현대 표준 한국어에서 더 자연스럽고, ‘시험’이 그들이 겪는 시험임을 분명히 하는 편이 원문의 관계를 충실히 반영합니다.
  naturalness: ‘불로 시험한 금’은 비문에 가깝고, ‘내 택하신 이들’은 현대 문장에서는 다소 어색합니다. ‘불로 시험받는 금’ 및 ‘내가 택한 이들이 겪는 시험’이 자연스럽고 의미도 명확합니다.
  terminology: probatio / probatur의 어근 연계는 ‘시험’ / ‘시험받는’으로 보존할 수 있습니다. electorum meorum은 교단적 함의를 덧붙이지 않고 ‘내가 택한 이들’로 옮깁니다. 각주 a의 ‘시험받은 참됨’은 가능한 결과적 의미를 제시하되 본문의 과정적 의미와 구별합니다.
  issues:
