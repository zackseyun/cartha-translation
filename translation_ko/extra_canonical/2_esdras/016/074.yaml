  - severity: low
    issue: ‘내 택하신 이들’은 현대 한국어에서 자연스럽지 않으며, ‘시험’의 대상 관계도 다소 모호합니다.
    rationale: ‘내가 택한 이들이 겪는 시험’은 electorum meorum과 문맥상 그들에게 닥친 시험을 명료하고 자연스럽게 드러냅니다.
  - severity: medium
    issue: 각주 b가 본문과 실질적으로 동일하여 영어 POB의 대안 범위를 반영하지 못합니다.
    rationale: 영어 각주 b는 금의 비유 없이 ‘시험이 드러날 것’이라는 짧은 문장을 대안으로 제시합니다. 한국어 각주도 이에 맞추어야 합니다.
