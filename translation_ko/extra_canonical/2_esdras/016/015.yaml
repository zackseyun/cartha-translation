lexical_decisions:
- source_word: Ignis succenditur
  english_pob_choice: Fire is kindled
  chosen_korean: 불이 붙고
  alternatives_korean:
  - 불이 타오르고
  - 불이 점화되고
  lexicon: ignis → 불; succenditur → 붙다/붙이다
  rationale: 라틴어 수동 현재형은 ‘불이 붙다’로 자연스럽게 옮기면 원문의 사건성은 살리면서도 불필요한 장식 없이 간결하게 드러납니다.
- source_word: non extinguetur
  english_pob_choice: it will not be quenched
  chosen_korean: 꺼지지 않을 것입니다
  alternatives_korean:
  - 진화되지 않을 것입니다
  - 소멸되지 않을 것입니다
  lexicon: extinguere → 끄다, 꺼지다
  rationale: 불의 이미지에 가장 직접적인 한국어 대응은 ‘꺼지다’이므로, 소화되지 않는다는 뜻을 가장 자연스럽게 전달합니다.
- source_word: ueniant super terram
  english_pob_choice: —
  chosen_korean: ''
  alternatives_korean:
  - 땅 위에 임하게 하소서
  - 땅에 닥치게 하소서
  lexicon: uenire super + terram
  rationale: 제공된 정리본과 영어 POB 본문에 이 구절이 반영되지 않았으므로 본문에는 포함하지 않았습니다.
theological_decisions:
- issue: 본문에 없는 절반 구절의 처리
  chosen_reading: 라틴어 정리본과 영어 POB 최신 본문에 따라 ‘땅 위에 임하게 하소서’류의 표현을 본문에 넣지 않았습니다.
  alternative_readings:
  - ‘땅 위에’로 시작하는 완결형 번역
  - 두 절을 합쳐 심판의 대상을 명시하는 번역
  rationale: 공개된 audit trail이 해당 문구를 삭제한 상태이므로, 한국어 본문도 그 축약을 그대로 반영해야 원문-번역 대응이 보존됩니다.
  doctrine_reference: 본문 비첨가 원칙
