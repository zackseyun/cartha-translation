review_pass:
  verdict: revise
  source_fidelity: 라틴어 magis adzelabor eos super peccata는 ‘그들의 죄 때문에/두고 내가 그들을 더욱 열심(열정)을 내어 대적하겠다’는 뜻입니다. 초안의 핵심 의미는 대체로 보존하지만, Quomodo는 우선적으로 ‘어떻게’이며 ‘어찌’는 ‘왜/어찌하여’로도 읽혀 의문사의 의미를 좁힐 수 있습니다.
  naturalness: ‘더욱 열심히 맞서겠습니다’도 이해되지만 일상적 노력의 뉘앙스가 강합니다. ‘더욱 열렬히 대적하겠습니다’가 여기서의 대상을 향한 zeal을 더 자연스럽고 분명하게 나타냅니다. 인용부호를 닫았다가 Quomodo 앞에서 다시 여는 방식은 원문의 단절을 불필요하게 화자 전환처럼 보이게 하므로, 하나의 발화 안에 예언자적 발화 공식을 삽입하는 편이 낫습니다.
  terminology: dominus는 ‘주님’, peccata는 ‘죄’, adzelabor는 문맥상 ‘열렬히 대적하다’로 옮겼습니다. 이는 단순한 감정적 분노나 교리적으로 특정된 ‘질투’로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: Quomodo를 ‘어찌…’로 번역함
    rationale: 라틴어 quomodo의 기본 의미는 ‘어떻게’입니다. 미완결 문맥에서는 ‘어찌’가 ‘왜’의 뜻으로도 자연스럽게 해석될 수 있으므로, 의미 범위를 더 잘 보존하는 ‘어떻게…’가 적절합니다.
  - severity: low
    issue: ‘열심히 맞서겠습니다’의 어감
    rationale: ‘열심히’는 노력의 방식으로 들리기 쉬워 adzelabor의 강한 열정/열심의 대적 의미가 다소 약해집니다. ‘열렬히 대적하겠습니다’가 더 자연스럽습니다.
  - severity: low
    issue: Quomodo 앞의 재개 인용부호
    rationale: 원문에는 인용 종결 뒤의 새 발화임을 표시하는 근거가 없습니다. 인용문을 유지하되 발화 공식과 미완결 의문을 같은 발화 안에 두는 편이 자연스럽습니다.
  revised_text: “그들의 죄 때문에 내가 그들을 더욱 열렬히 대적하겠습니다.” 주님께서 말씀하십니다. “어떻게…
  revised_footnotes:
