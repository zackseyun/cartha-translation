lexical_decisions:
- source_word: magis adzelabor
  english_pob_choice: the more I will be zealous against them
  chosen_korean: 내가 그들에게 더욱 열심히 맞서겠습니다
  alternatives_korean:
  - 내가 그들에게 더욱 질투하겠습니다
  - 내가 그들에게 더욱 분노하겠습니다
  - 내가 그들에게 더욱 열심을 내겠습니다
  lexicon: adzelabor
  rationale: 라틴어 adzelabor는 단순한 분노보다 ‘열심히/열정적으로 맞서다’는 능동적 태도를 나타내므로, 문맥상 대상을 향한 적극적 대항을 살려 ‘열심히 맞서겠습니다’로 옮겼습니다.
- source_word: super peccata
  english_pob_choice: for their sins
  chosen_korean: 그들의 죄 때문에
  alternatives_korean:
  - 그들의 죄로 인해
  - 그들의 죄를 두고
  - 그들의 죄에 대해
  lexicon: super + peccata
  rationale: super peccata는 단순한 감정의 원인뿐 아니라 죄를 근거로 한 대응을 나타내므로, ‘~때문에’로 인과를 분명하게 하되 원문의 대상을 유지했습니다.
- source_word: dicit dominus
  english_pob_choice: says the Lord
  chosen_korean: 주님께서 말씀하십니다
  alternatives_korean:
  - 주님이 말씀하십니다
  - 주께서 말씀하십니다
  lexicon: dicit + dominus
  rationale: 예언적 공식 발화이므로 현대 합쇼체로 정리하되, 독자에게 직접적인 신적 발화를 분명히 보여 주기 위해 ‘주님께서 말씀하십니다’로 옮겼습니다.
- source_word: Quomodo
  english_pob_choice: How
  chosen_korean: 어찌…
  alternatives_korean:
  - 어떻게…
  - 어찌하여…
  - 어찌
  lexicon: quomodo
  rationale: 문장이 단절된 채 끝나는 원문 특성을 보존하기 위해 완결하지 않고, 감탄·탄식의 여운을 남기는 ‘어찌…’로 처리했습니다.
theological_decisions:
- issue: 하나님의 감정과 태도 표현
  chosen_reading: ‘열심히 맞서겠습니다’로 번역해, 하나님이 죄에 대해 무관심하거나 단순히 감정적으로 화내는 분이 아니라 거룩한 열심으로 적극적으로 대항하시는 분임을 드러냈습니다.
  alternative_readings:
  - ‘분노하겠습니다’로 완화된 정서 표현
  - ‘질투하겠습니다’로 더 직역한 표현
  rationale: 개정된 영어 POB의 ‘zealous against’가 반영하는 신적 열심의 뉘앙스를 살려, 죄에 대한 거룩한 대응이라는 신학적 긴장을 보존했습니다.
  doctrine_reference: 출 20:5; 겔 36:5; 나 1:2
- issue: 문장 미완결성
  chosen_reading: ‘어찌…’로 끝내어 원문이 실제로 중단된 채 남는 수사적 긴장을 보존했습니다.
  alternative_readings:
  - 문장을 보충해 완결시키는 처리
  - 생략 부호 없이 단순 종결
  rationale: 라틴어의 Quomodo가 독립적으로 남아 있는 점은 단순한 오류가 아니라 현재 전승 본문의 단절을 드러내므로, 한국어에서도 그 미완결성을 유지했습니다.
  doctrine_reference: 본문 비평/전승 보존 원칙
