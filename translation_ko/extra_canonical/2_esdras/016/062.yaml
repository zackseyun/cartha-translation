  source_fidelity: 라틴어의 동작 순서(사람을 지음—몸 가운데에 마음을 둠—영·생명·이해 능력을 줌)는 잘 반영되어 있습니다. 다만 「두시며」는 앞 동작이 완료된 뒤 이어지는 본문의 병렬 과거 동사열보다 진행·동시의 뉘앙스를 낼 수 있으므로 「두시고」가 더 충실합니다. intellectum은 획득된 ‘깨달음’보다 인간에게 주어진 이해·분별의 능력을 가리키므로 「이해력」으로 옮기는 편이 안전합니다.
  naturalness: 「몸의 한가운데에 마음을 두시고」는 현대 한국어에서도 이해 가능하며, 원문의 심장/내적 중심이라는 폭을 불필요하게 좁히지 않습니다. 연결 표현을 「두시고」로 고치면 문장 흐름도 자연스럽습니다.
  terminology: cor는 이 문맥에서 해부학적 기관과 인간 내면의 중심이라는 고대적 의미 범위를 함께 지니므로 「마음」을 유지할 수 있습니다. spiritum은 성령으로 한정하지 않는 「영」이 적절합니다. intellectum은 「이해력」이 인지 능력이라는 의미를 가장 직접적으로 보존합니다.
