base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/062.yaml
  text: He formed man, and put a heart in the midst of the body, and gave him spirit and life and understanding,
translation:
  language: ko
  text: 그는 사람을 지으시고, 몸의 한가운데에 마음을 두시고, 그에게 영과 생명과 이해력을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: medio corporis
  english_pob_choice: in the midst of the body
  chosen_korean: 몸의 한가운데
  alternatives_korean:
  - 몸 가운데
  - 몸속 한가운데
  - 육체의 한가운데
  lexicon: medio
  rationale: 라틴어 medio corporis는 신체의 중심/한가운데를 가리키므로, POB의 의미를 살려 자연스럽고 간결하게 「몸의 한가운데」로 옮겼습니다.
- source_word: cor
  english_pob_choice: heart
  chosen_korean: 마음
  alternatives_korean:
  - 심장
  - 심정
  - 가슴
  lexicon: cor
  rationale: 이 문맥의 cor는 생리적 장기보다 인간 내면의 중심을 가리키므로, 한국어에서 그 의미 폭을 가장 잘 담는 「마음」을 선택했습니다.
- source_word: spiritum et uitam et intellectum
  english_pob_choice: spirit and life and understanding
  chosen_korean: 영과 생명과 깨달음
  alternatives_korean:
  - 영과 생명과 이해
  - 영과 생명과 지성
  - 혼과 생명과 이해
  lexicon: spiritum / uitam / intellectum
  rationale: spiritum은 단순한 호흡이 아니라 사람에게 주어지는 생명의 영으로 읽혀 「영」으로, intellectum은 인지 능력보다 이해의 능력을 뜻해 「깨달음」으로 옮겼습니다.
theological_decisions:
- issue: 인간 창조의 순서와 내적 구성 표현
  chosen_reading: 하나님이 사람을 지으시고 몸의 한가운데에 마음을 두신 뒤 영·생명·깨달음을 주신다는 연속 동작으로 읽었습니다.
  alternative_readings:
  - ‘마음’을 먼저 주고 그 다음에 영과 생명과 깨달음을 주셨다는 구조
  - ‘몸의 한가운데’가 상징적 표현이라기보다 문자적 장치라는 읽기
  rationale: 라틴어 동사 배열(misit/et)과 POB의 영어 흐름을 따라, 창조-내적 중심-부여의 순서를 보존하는 것이 본문이 전달하는 인간 구성의 신학적 긴장을 가장 잘 드러냅니다.
  doctrine_reference: anthropology
- issue: spiritum의 번역
  chosen_reading: 「영」으로 번역하여 인간에게 주어지는 생명 원리를 드러냈습니다.
  alternative_readings:
  - 성령
  - 숨
  rationale: 여기서 spiritum은 성령을 가리키는 문맥이 아니며, 단순한 호흡보다 사람 안에 주입된 생기와 영적 요소를 함께 포괄하므로 「영」이 가장 중립적이고 स्रोत에 충실합니다.
  doctrine_reference: pneumatology
