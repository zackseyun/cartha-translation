  source_fidelity: 첫 구절의 라틴어는 앞 절에서 이어지는 문장 중간으로 시작하며, 제시된 범위에는 peccata uestra의 동사나 보어가 없습니다. 초안의 ‘여러분의 죄를 짓지 말고’는 원문에 없는 ‘짓다’를 보충하여 의미를 바꾸므로, 생략 부호와 주석으로 문맥상 이어짐을 표시해야 합니다. 또한 per quem은 밭을 받으므로 ‘그 밭을 아무도 지나가지 못하는’으로 명시하는 편이 충실합니다.
  naturalness: ‘그들은 마치 … 밭과 같습니다’라고 비교의 대상을 분명히 하고, 뒤의 대명사를 ‘그 밭’으로 풀어 주면 현대 표준 한국어의 합쇼체로 자연스럽고 비유의 연결도 명료합니다.
