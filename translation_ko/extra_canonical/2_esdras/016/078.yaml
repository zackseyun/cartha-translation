source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: peccata uestra, nec supereleuent iniquitates uestrae. Vae qui constringuntur a peccatis suis et obteguntur ab iniquitatibus suis, quemadmodum ager constringitur a silua et spinis tegitur semina eius, per quem non transit homo, et excluditur et mittitur ad deuorationem ignis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/078.yaml
  text: your sins[a], nor let your iniquities prevail over you. Woe to those who are bound fast by their sins and covered over by their iniquities, just as a field is hemmed in by a forest and its seed is covered by thorns, through which no man passes; it is shut off and given over to be devoured by fire.
  footnotes:
  - marker: a
    text: Or 'Woe to those who are bound fast by their sins and covered over by their iniquities, as a field is hemmed in by a forest and its seeds covered by thorns, so that no man can pass through; it is shut off and given over to be devoured by fire.'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분의 죄를 …, 또 여러분의 불의가 여러분을 압도하지 못하게 하십시오. 자기 죄에 단단히 묶이고 자기 불의에 덮인 자들에게 화가 있습니다. 그들은 마치 밭이 숲에 둘러싸이고 그 씨앗들이 가시에 덮여 아무도 그 밭을 지나가지 못하는 것과 같습니다. 그 밭은 차단되어 불에 삼켜지도록 넘겨집니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문은 앞 절에서 이어지는 문장 중간으로 시작합니다. 따라서 첫 구절의 ‘여러분의 죄를 …’ 뒤에 해당하는 서술은 이 절의 제시 범위에는 나타나지 않습니다.
    reason: source_note
lexical_decisions:
- source_word: peccata uestra, nec supereleuent iniquitates uestrae
  english_pob_choice: your sins, nor let your iniquities prevail over you
  chosen_korean: 여러분의 죄를 짓지 말고, 여러분의 불의가 여러분 위에 우세하게 되지 못하게 하십시오
  alternatives_korean:
  - 여러분의 죄를 허용하지 말고, 여러분의 불의가 여러분 위에 올라서지 못하게 하십시오
  - 여러분의 죄가 여러분을 지배하지 못하게 하십시오
  lexicon: peccatum = 죄; iniquitas = 불의/악의
  rationale: 라틴어는 앞선 문맥을 이어 죄와 불의가 사람 위에 ‘들어올려져/우세해지는’ 것을 막으라는 뜻이므로, 단순한 도덕적 경고가 아니라 지배·우세의 이미지를 살려 옮겼습니다.
- source_word: Vae qui constringuntur a peccatis suis et obteguntur ab iniquitatibus suis
  english_pob_choice: Woe to those who are bound fast by their sins and covered over by their iniquities
  chosen_korean: 자기 죄에 단단히 묶이고 자기 불의에 덮인 자들에게 화가 있습니다
  alternatives_korean:
  - 자기 죄에 묶이고 자기 불의에 가려진 자들에게 화가 있습니다
  - 자기 죄에 속박되고 자기 불의에 덮인 자들에게 화가 있습니다
  lexicon: constringi = 단단히 묶이다/속박되다; obtegi = 덮이다
  rationale: ‘bound fast’와 ‘covered over’의 이중 이미지를 유지하되, 문장의 무게를 살리는 자연스러운 한국어로 정리했습니다.
- source_word: quemadmodum ager constringitur a silua et spinis tegitur semina eius
  english_pob_choice: just as a field is hemmed in by a forest and its seed is covered by thorns
  chosen_korean: 마치 들판이 숲에 둘러싸이고 그 씨앗이 가시덤불에 덮여
  alternatives_korean:
  - 마치 들판이 숲에 에워싸이고 그 씨가 가시에 덮여
  - 마치 밭이 숲에 둘러싸이고 그 씨앗이 가시로 덮여
  lexicon: ager = 들판/밭; semina eius = 그 씨앗(집합적 표현); spinis = 가시덤불/가시
  rationale: 라틴어 semina eius를 영어 수정안처럼 단수 집합으로 받아 ‘그 씨앗’으로 자연스럽게 옮겼고, 비교문은 ‘마치…듯이’로 유지했습니다.
- source_word: per quem non transit homo
  english_pob_choice: through which no man passes
  chosen_korean: 아무도 그곳을 지나가지 못하듯이
  alternatives_korean:
  - 그곳을 아무도 지나가지 못하듯이
  - 그 사이로 사람은 아무도 지나가지 못하듯이
  lexicon: per quem = 그곳/그 사이로; non transit homo = 아무도 지나가지 못한다
  rationale: 공간적 상대절을 결과절로 바꾸지 않고, 출입 불가능한 상태를 한국어의 자연스러운 부정 표현으로 살렸습니다.
- source_word: excluditur et mittitur ad deuorationem ignis
  english_pob_choice: it is shut off and given over to be devoured by fire
  chosen_korean: 그곳은 막혀 불에 삼켜지도록 넘겨집니다
  alternatives_korean:
  - 그곳은 닫혀 불의 먹이가 되도록 넘겨집니다
  - 그곳은 차단되어 불에 삼켜집니다
  lexicon: excludi = 밖으로 밀려나 막히다/차단되다; mitti ad = 넘겨지다; deuoratio ignis = 불에 삼켜짐
  rationale: 수동적 종결을 유지하면서 ‘불에 삼켜지다’라는 강한 파괴 이미지를 보존했습니다.
theological_decisions:
- issue: 도덕적 경고와 심판 이미지의 강도
  chosen_reading: ‘화가 있습니다’와 ‘불에 삼켜지도록 넘겨집니다’로 경고와 심판의 이중 구조를 그대로 드러냈습니다.
  alternative_readings:
  - 보다 완화된 경고문으로 정리하기
  - 불 심판 이미지를 약화시키기
  rationale: 본문은 단순 훈계가 아니라 죄의 속박과 최종적 멸망을 함께 제시하므로, 한국어에서도 긴장을 약화시키지 않았습니다.
  doctrine_reference: 죄와 심판의 경고, 묵시적 권면
