  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aut numquid recutiet sagittam inmissam a sagittario forte?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/007.yaml
  text: Or can anyone turn back an arrow shot by a strong archer?
translation:
  language: ko
  text: 아니면 강한 궁수가 쏜 화살을 누가 되돌릴 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: aut numquid
  english_pob_choice: Or can anyone
  chosen_korean: 아니면 … 누가 … 있겠습니까?
  alternatives_korean:
  - 혹시 … 누가 … 있습니까?
  - 또는 … 누가 … 있겠습니까?
  lexicon: interrogative / rhetorical
  rationale: 라틴어 수사의문문을 자연스러운 현대 한국어의 반문으로 옮기되, 가능성 자체를 묻는 뉘앙스를 살려 ‘누가 … 있겠습니까’로 처리했습니다.
- source_word: recutiet
  english_pob_choice: turn back
  chosen_korean: 되돌릴 수 있겠습니까
  alternatives_korean:
  - 되튕겨 돌릴 수 있겠습니까
  - 되돌려 보낼 수 있겠습니까
  lexicon: revert / reverse
  rationale: 활을 ‘쏘기 전 상태로 되돌리다’가 아니라 이미 발사된 화살의 진행을 역전시키는 뜻이므로, 직역보다 의미 중심의 ‘되돌리다’가 적절합니다.
- source_word: sagittam inmissam
  english_pob_choice: an arrow shot
  chosen_korean: 쏜 화살
  alternatives_korean:
  - 날아간 화살
  - 발사된 화살
  lexicon: arrow / projectile
  rationale: inmissam은 ‘보내진, 내던져진’ 발사를 가리키므로, 한국어에서는 자연스럽게 ‘쏜 화살’로 압축해 표현했습니다.
- source_word: sagittario forte
  english_pob_choice: by a strong archer
  chosen_korean: 강한 궁수가
  alternatives_korean:
  - 힘센 궁수가
  - 강력한 궁수가
  lexicon: forte
  rationale: 수정된 POB가 forte를 ‘mighty’보다 직접적인 ‘strong’으로 조정한 점을 반영해, 과장된 위력보다 ‘강한’으로 옮겼습니다.
theological_decisions:
- issue: 수사적 질문의 기능
  chosen_reading: 실제로 누구도 이미 발사된 화살을 되돌릴 수 없다는 불가능성을 강조하는 반문으로 읽었습니다.
  alternative_readings:
  - 단순한 정보 질문으로 읽는 방법
  - 예언적 선언의 일부로 완만하게 옮기는 방법
  rationale: 문맥상 이 절은 인간이 막을 수 없는 하나님의 심판/행동의 불가역성을 비유적으로 강조하는 수사적 질문이므로, 한국어에서도 반문으로 힘 있게 살렸습니다.
  doctrine_reference: 문맥 신학적 읽기
