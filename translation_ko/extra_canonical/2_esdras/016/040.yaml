  to: 그와 같이 악들이 땅 위에 나타나는 것을 지체하지 않을 것이며, 세상은 신음하고 고통이 그것을 둘러쌀 것입니다.
  rationale: 출현을 지연하지 않는 주체가 ‘악들’이라는 구문을 자연스러운 한국어로 정리했습니다. 또한 saeculum의 의인화와 종말론적 세계적 범위를 보존하면서, 한국어에서 공간적 포위와 결합하기 어려운 ‘시대’를 ‘세상’으로 바꾸었습니다. 이는 영어 감사본의 ‘age’보다 라틴어 원문의 문맥적 용례를 우선한 선택입니다.
