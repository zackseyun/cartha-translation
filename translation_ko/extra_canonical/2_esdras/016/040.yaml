id: 2ES.16.40
reference: 2 Esdras 16:40
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uno puncto, Sic non morabuntur mala ad prodiendum super terram, et saeculum gemet et dolores circumtenent illum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/040.yaml
  text: so also the evils will not delay to come forth upon the earth, and the age will groan, and pains will surround it.
translation:
  language: ko
  text: 그와 같이 악들이 땅 위에 나타나는 것을 지체하지 않을 것이며, 세상은 신음하고 고통이 그것을 둘러쌀 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uno puncto / Sic non morabuntur
  english_pob_choice: so also the evils will not delay to come forth
  chosen_korean: 그와 같이 악들은 ... 지체하지 않을 것이며
  alternatives_korean:
  - 그렇게 해서 악들은 ... 늦추지 않을 것이며
  - 그와 같이 재앙들은 ... 지체하지 않을 것이며
  lexicon: mala → 악들; morabuntur → 지체하지 않을 것이다
  rationale: 라틴어 mala는 단수 추상명사보다 복수적 ‘악들’로 읽는 것이 자연스럽고, morari의 지연 의미를 살려 ‘지체하다’로 옮겼습니다.
- source_word: ad prodiendum super terram
  english_pob_choice: to come forth upon the earth
  chosen_korean: 땅 위로 나오는
  alternatives_korean:
  - 땅에 나타나는
  - 땅 위에 드러나는
  lexicon: prodiendum → 나오다, 드러나다; super terram → 땅 위로
  rationale: prodiendum의 ‘밖으로 나옴/드러남’과 super terram의 공간 관계를 살려, 과장 없이 직역에 가까운 ‘땅 위로 나오는’으로 번역했습니다.
- source_word: saeculum
  english_pob_choice: the age
  chosen_korean: 시대
  alternatives_korean:
  - 세상
  - 세대
  - 이 세대
  lexicon: saeculum → 시대/세상
  rationale: 문맥상 단순한 연대기적 ‘세대’보다, 세계 질서 전체가 탄식하는 의미를 담을 수 있는 ‘시대’가 가장 균형이 좋습니다.
- source_word: gemet
  english_pob_choice: will groan
  chosen_korean: 신음하고
  alternatives_korean:
  - 탄식하고
  - 끙끙거리고
  lexicon: gemere → 신음하다, 탄식하다
  rationale: 라틴어 gemet의 고통스러운 신음을 현대 한국어에서 가장 직접적으로 드러내는 표현으로 ‘신음하다’를 택했습니다.
- source_word: circumtenent
  english_pob_choice: will surround it
  chosen_korean: 그것을 둘러쌀 것입니다
  alternatives_korean:
  - 그것을 에워쌀 것입니다
  - 사방에서 그것을 감쌀 것입니다
  lexicon: circumtenere → 둘러싸다, 에워싸다
  rationale: 영어 POB의 수정처럼 마지막 동사는 ‘붙잡다’보다 공간적 포위 의미를 살려 ‘둘러싸다’로 반영했습니다.
theological_decisions:
- issue: 라틴어 mala의 범주와 종말론적 재난의 성격
  chosen_reading: 여기서는 도덕적 ‘악들’과 재앙적 ‘악들’의 중간 지대를 살려, 다가오는 종말적 해악을 포괄하는 복수 표현으로 옮겼습니다.
  alternative_readings:
  - 재앙들
  - 악
  - 불행들
  rationale: 본문은 단순한 추상 악보다 땅 위로 ‘나오는’ 복수의 해악을 말하므로, 한국어에서도 복수성과 재앙성을 함께 보이게 했습니다.
  doctrine_reference: 종말론적 재난 묘사
- issue: saeculum의 인격화
  chosen_reading: ‘시대는 신음하고’라고 하여, 시간대 자체가 탄식하는 인격화된 표현을 유지했습니다.
  alternative_readings:
  - 세상은 신음하고
  - 이 시대는 신음하고
  rationale: 본문의 의인화는 수사적 장치이므로 평이하게 풀지 않고 그대로 살려야 전체 문장의 긴박감이 유지됩니다.
  doctrine_reference: 문학적 의인화
