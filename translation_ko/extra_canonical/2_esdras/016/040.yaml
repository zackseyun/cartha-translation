  source_fidelity: 라틴어 mala, morabuntur, ad prodiendum super terram, gemet, circumtenent의 의미는 대체로 충실합니다. 다만 saeculum은 여기서 고통에 둘러싸여 신음하는 의인화된 세계 질서를 가리키므로, 한국어에서는 ‘시대’보다 ‘세상’이 더 자연스럽고 문맥상 분명합니다.
  naturalness: ‘악들은 땅 위로 나오는 일을 지체하지 않을 것이며’는 명사화된 ‘나오는 일’과 ‘지체하다’의 결합이 다소 부자연스럽습니다. ‘악들이 땅 위에 나타나는 것을 지체하지 않을 것이며’가 원문의 부정적 지연과 출현을 자연스럽게 재현합니다.
  terminology: mala는 본문의 다가오는 해악/재난이라는 폭을 보존하도록 ‘악들’로 유지할 수 있습니다. saeculum은 신학적 의미를 과도하게 한정하지 않으면서도 한국어 용례상 ‘세상’으로 옮기는 편이 적절합니다. ‘고통’과 ‘둘러싸다’는 dolores와 circumtenent에 알맞습니다.
