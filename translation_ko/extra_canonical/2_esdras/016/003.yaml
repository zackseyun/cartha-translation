  yaml_path: translation/extra_canonical/2_esdras/016/003.yaml
  text: A sword has been sent upon you, and who is there to turn it back?
translation:
  language: ko
  text: 너희에게 칼이 닥쳤습니다. 누가 그것을 되돌리겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est uobis gladius / A sword has been sent upon you
  english_pob_choice: A sword has been sent upon you
  chosen_korean: 너희에게 칼이 닥쳤습니다
  alternatives_korean:
  - 칼이 너희 위에 내려졌습니다
  - 너희에게 칼이 보내졌습니다
  - 칼이 너희에게 임했습니다
  lexicon: gladius → 칼
  rationale: 라틴어 수동 표현의 돌발적·재앙적 뉘앙스를 살리기 위해 직역형 ‘보내졌다’보다 한국어에서 더 자연스럽고 긴박한 ‘닦치다’ 계열을 택했습니다.
- source_word: quis est qui auertat illum? / who is there to turn it back?
  english_pob_choice: who is there to turn it back?
  chosen_korean: 누가 그것을 되돌리겠습니까?
  alternatives_korean:
  - 누가 그것을 막을 수 있겠습니까?
  - 누가 그것을 돌려세우겠습니까?
  lexicon: auertat illum → 되돌리다
  rationale: auertat의 ‘되돌리다/돌려세우다’ 의미를 살리되, 문맥상 칼의 진로를 멈추는 뉘앙스를 한국어 의문문으로 간결하게 옮겼습니다.
theological_decisions:
- issue: 심판 재앙의 불가역성 표현
  chosen_reading: 칼이 ‘닦쳤다’는 선언과 곧이어 ‘누가 그것을 되돌리겠습니까?’라는 반문을 통해, 닥친 재앙의 되돌릴 수 없음이 강조됩니다.
  alternative_readings:
  - 단순한 전쟁 은유로 약화해 읽는 방식
  - ‘보내졌다’를 중립적으로 옮겨 재난의 압박감을 낮추는 방식
  rationale: 본문은 단순 사실 통보보다 심판의 긴박성과 불가항력을 드러내므로, 한국어에서도 그 압력을 유지하는 것이 원문 효과에 더 가깝습니다.
  doctrine_reference: 예언적 심판 경고의 수사
