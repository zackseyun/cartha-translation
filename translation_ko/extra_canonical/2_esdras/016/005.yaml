  text: Evils have been sent upon you, and who is there to drive them away?
translation:
  language: ko
  text: 재앙들이 너희에게 닥쳤으니, 누가 그것들을 물리칠 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “악한 일들이 너희에게 닥쳤으니.” 라틴어 mala는 문맥에 따라 ‘악한 일들’ 또는 ‘재앙들’을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: uobis mala
  english_pob_choice: Evils have been sent upon you
  chosen_korean: “재앙이 너희에게 임했습니다”
  alternatives_korean:
  - “악이 너희에게 내려졌습니다”
  - “악한 것들이 너희에게 왔습니다”
  lexicon: mala → 재앙 / 악
  rationale: 라틴어 mala는 문맥상 단순한 도덕적 ‘악’보다 닥쳐온 재난·재앙의 뜻이 강하므로, POB의 ‘Evils have been sent upon you’를 한국어로는 자연스럽게 ‘재앙이 너희에게 임했습니다’로 옮겼습니다.
- source_word: quis est qui repellat ea
  english_pob_choice: who is there to drive them away?
  chosen_korean: “그리고 그것을 물리쳐 없앨 자가 어디 있습니까?”
  alternatives_korean:
  - “그것들을 쫓아낼 자가 누구입니까?”
  - “그것을 막아낼 자가 어디 있습니까?”
  lexicon: repellat → 물리쳐 없애다 / 쫓아내다
  rationale: repellat는 ‘밀어내다, 물리치다, 몰아내다’의 의미이므로, 재난을 상대로 한 동작을 드러내는 ‘물리쳐 없애다’로 옮겨 POB의 ‘drive them away’와 대응시켰습니다.
theological_decisions:
- issue: 재난의 성격을 도덕적 ‘악’보다 임박한 심판·재앙으로 읽을지 여부
  chosen_reading: 문맥상 닥쳐온 재앙을 가리키는 표현으로 처리했습니다.
  alternative_readings:
  - ‘악이 너희에게 임했습니다’처럼 일반적 악으로 넓게 옮길 수 있습니다.
  - ‘재난들이 너희에게 임했습니다’처럼 복수성을 드러낼 수도 있습니다.
  rationale: POB의 영어가 이미 sent upon you라는 수동적 임재를 취하고 있어, 한국어에서도 단순한 추상악보다 실제로 닥친 재앙의 뉘앙스를 살리는 것이 본문 의도에 더 가깝습니다.
  doctrine_reference: 문맥적 의미 결정
