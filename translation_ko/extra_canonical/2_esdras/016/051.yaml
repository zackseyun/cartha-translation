  source_fidelity: 라틴어의 마지막 금지 명령은 포함되어 있으나, 본문의 ‘의도 자기 자신을’은 문법적으로 성립하지 않아 핵심 절의 의미를 훼손합니다. 또한 bona는 우선 ‘선한’이라는 도덕적 평가로 옮기는 것이 원문에 더 가깝습니다. iniquitatem/eam/eius는 라틴어에서 여성형이며, 기존 각주 b의 ‘중성적 지시’ 설명은 근거가 없습니다.
  naturalness: ‘의도 자기 자신을 단장한 불의’는 현대 한국어 문장으로 부자연스럽고 뜻이 불명확합니다. ‘불의가 스스로를 단장할 때’로 고치고, 대명사 반복은 ‘불의’로 명시하여 수사적 인격화를 자연스럽게 살렸습니다.
  terminology: iusticia/iniquitatem은 ‘의/불의’로 유지했습니다. fornicariam은 문맥상 ‘창녀’, zelatur는 영어 감사본의 판단을 따라 ‘분개하다’로 옮겼습니다. ‘그 행위들’은 operibus의 복수와 의미를 유지합니다.
