source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: zelatur fornicariam mulierem idonea et bona ualde, Sic zela bitur iusticia iniquitatem cum exornat se, et accusat eam in faciem, cum uenerit qui defendat exquirentem omnem peccatum super terram. Propterea nolite similari eam nec operibus eius.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/051.yaml
  text: As a respectable and very beautiful woman is indignant toward a prostitute[a], so righteousness will be indignant toward iniquity when it adorns itself, and will accuse it to its face when he comes who defends the one who searches out every sin upon the earth[b]. Therefore do not be like it or its works.
  footnotes:
  - marker: a
    text: The Latin here is difficult and compressed. The imagery appears to compare righteousness and iniquity under the figure of a respectable woman and a prostitute, with righteousness exposing iniquity openly when the divine investigator comes.
    reason: textual_variant
    anchor_ref: '16:51'
  - marker: b
    text: Or 'As a respectable and very beautiful woman hates a prostitute, so righteousness will hate iniquity when she adorns herself, and will accuse her to her face when he comes who defends the one who searches out every sin upon the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 훌륭하고 매우 선한 여인이 창녀에게 분개하듯이, 의도 불의가 스스로를 단장할 때 불의에게 분개하고, 땅 위의 모든 죄를 찾아내는 이를 변호할 자가 올 때 그 면전에서 불의를 고발할 것입니다.[a] 그러므로 불의나 그 행위들을 본받지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어는 압축적이며 해석이 어려운 문장입니다. 여기서는 훌륭하고 선한 여인과 창녀의 대비로 의와 불의를 인격화하며, 의가 불의를 공개적으로 고발하는 모습을 그립니다. ‘모든 죄를 찾아내는 이를 변호할 자’라는 표현의 정확한 관계도 다소 불명확합니다.
    reason: source_note
  - marker: b
    text: 라틴어에서 ‘불의’(iniquitas)는 여성형이며, 뒤의 대명사들도 이를 가리킵니다. 한국어에서는 반복을 피하지 않고 ‘불의’라고 밝혀 인격화된 대조를 드러냈습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: zelatur / zela bitur
  english_pob_choice: is indignant toward / will be indignant toward
  chosen_korean: 분개하듯이 / 분개하며
  alternatives_korean:
  - 노여워하듯이 / 노여워하며
  - 미워하듯이 / 미워하며
  lexicon: zelare
  rationale: 라틴어는 단순한 혐오보다 공개적이고 도덕적인 분개를 가리키므로, 한국어는 ‘분개하다’를 택해 감정의 강도와 윤리적 반응을 함께 살렸습니다.
- source_word: iusticia
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 의로움과 정의
  lexicon: iustitia
  rationale: 문맥상 하나님 앞의 도덕적 정당성을 가리키는 표준 신학 용어이므로 ‘의’로 옮겼습니다.
- source_word: iniquitatem
  english_pob_choice: iniquity
  chosen_korean: 불의
  alternatives_korean:
  - 악
  - 부정
  lexicon: iniquitas
  rationale: 라틴어의 반의 구조를 살려, 단순한 일반 악보다 의의 대립항인 ‘불의’로 번역했습니다.
- source_word: Propterea nolite similari eam nec operibus eius
  english_pob_choice: Therefore do not be like it or its works
  chosen_korean: 그러므로 그것과 그 행위들을 본받지 마십시오
  alternatives_korean:
  - 그러므로 그것이나 그 행실을 닮지 마십시오
  - 그러므로 그것과 그 행위들을 따르지 마십시오
  lexicon: nolite similari / operibus
  rationale: 명령형 금지문을 현대 한국어의 공손한 명령으로 살리되, ‘similari’는 단순 모방보다 ‘본받다’가 더 정확해 선택했습니다.
theological_decisions:
- issue: 의와 불의의 인격화된 대조
  chosen_reading: ‘의’와 ‘불의’를 인격적으로 대립시키는 수사로 유지했습니다.
  alternative_readings:
  - 추상명사끼리의 단순 대비로 약화
  - ‘의로움’과 ‘악행’의 윤리적 일반론으로 완화
  rationale: 본문은 의와 불의가 스스로를 단장하고 고발하는 장면을 통해 도덕적·종말론적 대립을 dramatize 하므로, 인격화된 표현을 유지해야 source의 힘이 보존됩니다.
  doctrine_reference: 2 Esdras의 묵시적 심판 수사
