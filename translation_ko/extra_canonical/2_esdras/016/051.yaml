  lexicon: iustitia
  rationale: 문맥상 하나님 앞의 도덕적 정당성을 가리키는 표준 신학 용어이므로 ‘의’로 옮겼습니다.
- source_word: iniquitatem
  english_pob_choice: iniquity
  chosen_korean: 불의
  alternatives_korean:
  - 악
  - 부정
  lexicon: iniquitas
  rationale: 라틴어의 반의 구조를 살려, 단순한 일반 악보다 의의 대립항인 ‘불의’로 번역했습니다.
- source_word: Propterea nolite similari eam nec operibus eius
  english_pob_choice: Therefore do not be like it or its works
  chosen_korean: 그러므로 그것과 그 행위들을 본받지 마십시오
  alternatives_korean:
  - 그러므로 그것이나 그 행실을 닮지 마십시오
  - 그러므로 그것과 그 행위들을 따르지 마십시오
  lexicon: nolite similari / operibus
  rationale: 명령형 금지문을 현대 한국어의 공손한 명령으로 살리되, ‘similari’는 단순 모방보다 ‘본받다’가 더 정확해 선택했습니다.
theological_decisions:
- issue: 의와 불의의 인격화된 대조
  chosen_reading: ‘의’와 ‘불의’를 인격적으로 대립시키는 수사로 유지했습니다.
  alternative_readings:
  - 추상명사끼리의 단순 대비로 약화
  - ‘의로움’과 ‘악행’의 윤리적 일반론으로 완화
  rationale: 본문은 의와 불의가 스스로를 단장하고 고발하는 장면을 통해 도덕적·종말론적 대립을 dramatize 하므로, 인격화된 표현을 유지해야 source의 힘이 보존됩니다.
  doctrine_reference: 2 Esdras의 묵시적 심판 수사
