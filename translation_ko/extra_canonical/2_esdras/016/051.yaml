  - 미워하듯이 / 미워하며
  lexicon: zelare
  rationale: 라틴어는 단순한 혐오보다 공개적이고 도덕적인 분개를 가리키므로, 한국어는 ‘분개하다’를 택해 감정의 강도와 윤리적 반응을 함께 살렸습니다.
- source_word: iusticia
