  text: A strong archer has shot an arrow; who will turn it back? The Lord God sends evils, and who will drive them away?
translation:
  language: ko
  text: 힘센 궁수가 쏜 화살을 누가 되돌리겠습니까? 주 하나님께서 보내시는 재앙들을 누가 물리치겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sagittam a sagittario forti missam
  english_pob_choice: A strong archer has shot an arrow
  chosen_korean: 강한 궁수가 화살 하나를 쏘았습니다
  alternatives_korean:
  - 힘센 활쏘는 사람이 화살을 쏘았습니다
  - 강한 궁수가 한 화살을 쏘았습니다
  lexicon: sagittarius → 궁수; sagittam → 화살
  rationale: 라틴어의 이미지와 병행구조를 살리면서도 현대 한국어에서 자연스럽고 간결하게 옮겼습니다.
- source_word: turn it back
  english_pob_choice: turn it back
  chosen_korean: 그것을 되돌리겠습니까
  alternatives_korean:
  - 그것을 돌이키겠습니까
  - 그것을 막아 내겠습니까
  lexicon: turn back → 되돌리다/돌이키다
  rationale: 이미 날아간 화살을 다시 되돌린다는 뜻을 직역에 가깝게 살렸습니다.
- source_word: Dominus deus
  english_pob_choice: The Lord God
  chosen_korean: 주 하나님
  alternatives_korean:
  - 주님 하나님
  - 야훼 하나님
  lexicon: Dominus deus → 주 하나님
  rationale: 라틴어의 호칭쌍을 한국어 신앙 언어로 자연스럽게 옮기되, 본문이 구약적 신명 호칭을 직접 표명하지는 않으므로 기본적으로 주 하나님을 택했습니다.
- source_word: mittit
  english_pob_choice: sends
  chosen_korean: 보내시니
  alternatives_korean:
  - 내리시니
  - 보내십니다
  lexicon: mittere → 보내다
  rationale: 라틴어 현재형의 지속적·서술적 힘을 살려 합쇼체 서술로 처리했습니다.
- source_word: evils
  english_pob_choice: evils
  chosen_korean: 재앙들
  alternatives_korean:
  - 악들
  - 재난들
  - 악한 일들
  lexicon: mala → 재앙/악
  rationale: 문맥상 단순한 도덕적 악보다 하나님이 내리시는 재난·환난의 의미가 더 강하므로, 한국어에서도 그 뉘앙스를 드러내는 재앙들을 선택했습니다.
theological_decisions:
- issue: 하나님께서 보내시는 mala의 성격
  chosen_reading: 도덕적 악 자체라기보다 심판적 재앙·재난으로 이해하여 번역했습니다.
  alternative_readings:
  - 악
  - 악한 일들
  - 불행
  rationale: 문맥 전체가 하나님의 주권적 심판 이미지를 전개하므로, 독자가 신학적으로 오해하기 쉬운 '악'보다 재앙이 의미를 더 정확히 전달합니다.
  doctrine_reference: 섭리와 심판의 언어, 2 Esdras의 묵시적 재난 도상
