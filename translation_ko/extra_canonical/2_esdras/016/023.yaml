id: 2ES.16.23
reference: 2 Esdras 16:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et aporiant vitam super terram, et gladius dispersit quae superaverint a fame.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/023.yaml
  text: And they will lose their lives upon the earth[a], and the sword will scatter those who survive the famine.
  footnotes:
  - marker: a
    text: Or 'For many of those who inhabit the earth will die by famine, and the sword will destroy those who survive the famine.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 땅 위에서 생명을 잃게 될 것이며, 칼은 기근에서 살아남은 자들을 흩을 것입니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘생명을 잃게 될 것입니다’는 라틴어 aporiant vitam을 반영한 번역이며, 영어 POB의 이전 독법처럼 ‘땅에 사는 많은 이들이 기근으로 죽을 것이다’라는 의미 확장은 따르지 않았습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: et aporiant vitam super terram
  english_pob_choice: they will lose their lives upon the earth
  chosen_korean: 그들은 땅 위에서 생명을 잃게 될 것이며
  alternatives_korean:
  - 그들은 땅 위에서 목숨을 잃게 될 것이며
  - 그들은 땅에서 생명을 잃게 될 것이며
  lexicon: aporiant
  rationale: 라틴어 aporiant는 ‘결핍되다, 빠져나가다, 잃다’의 뉘앙스를 가지므로, 단순한 ‘죽다’보다 소실된 생명 상태를 드러내는 ‘생명을 잃게 될’이 원문에 가깝습니다.
- source_word: super terram
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에서
  alternatives_korean:
  - 땅에서
  - 지면 위에서
  lexicon: super + terram
  rationale: super terram은 지상에 있는 범위를 가리키므로, 자연스러운 합쇼체 문맥에서 ‘땅 위에서’로 옮겼습니다.
- source_word: gladius dispersit
  english_pob_choice: the sword will scatter
  chosen_korean: 칼은 ... 흩을 것입니다
  alternatives_korean:
  - 칼은 ... 흩어 버릴 것입니다
  - 칼은 ... 흩어지게 할 것입니다
  lexicon: gladius dispersit
  rationale: dispersit는 단순 파괴보다 ‘흩뜨리다, 분산시키다’의 동작을 나타내므로, 결과를 보존하는 ‘흩을 것입니다’로 번역했습니다.
- source_word: a fame
  english_pob_choice: those who survive the famine
  chosen_korean: 기근에서 살아남은 자들
  alternatives_korean:
  - 기근을 살아남은 자들
  - 기근 뒤에 남은 자들
  lexicon: a fame
  rationale: 전치사 a는 ‘~에서, ~로부터’의 분리 의미를 가지며, 살아남은 이들이 기근을 통과했다는 점을 분명히 하기 위해 ‘기근에서 살아남은 자들’로 옮겼습니다.
theological_decisions:
- issue: 라틴 원문의 미래/현재형 긴장
  chosen_reading: 문맥상 예언적 미래로 읽어 한국어에서도 ‘-것입니다’로 옮겼습니다.
  alternative_readings:
  - 직설적 현재로 ‘흩습니다’라고 옮김
  - 완료적 뉘앙스를 강조해 ‘흩어 놓았습니다’로 옮김
  rationale: 주어진 영어 POB와 원문의 예언적 선언 성격을 따라, 현재형 형태라도 한국어에서는 미래 예고로 자연스럽게 처리하는 것이 적절합니다.
  doctrine_reference: 예언적 미래 표현
