  text: concupiscet enim homo hominem videre vel certevocem eius audire.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/028.yaml
  text: For a man will long to see another man[a], or at least to hear his voice.
  footnotes:
  - marker: a
    text: Or 'or even'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 사람은 다른 사람을 보기를 열망할 것이며, 적어도 그의 음성이라도 듣기를 원할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘적어도’는 라틴어 vel certe의 최소 대안적 의미를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: concupiscet
  english_pob_choice: will long
  chosen_korean: 열망할 것입니다
  alternatives_korean:
  - 간절히 바라게 될 것입니다
  - 갈망할 것입니다
  lexicon: concupiscere
  rationale: 강한 욕망을 나타내므로 단순한 '원하다'보다 절실한 내적 갈망을 살렸습니다.
- source_word: homo hominem videre
  english_pob_choice: for a man will long to see another man
  chosen_korean: 사람은 다른 사람을 보기를
  alternatives_korean:
  - 한 사람은 다른 사람을 보기를
  - 사람이 사람을 보기를
  lexicon: homo
  rationale: 라틴어의 대조를 살려 '사람'과 '다른 사람'을 구분했고, 한국어에서는 남성 일반을 뜻하는 '남자'보다 포괄적인 '사람'이 문맥에 더 자연스럽습니다.
- source_word: vel certe
  english_pob_choice: or at least
  chosen_korean: 적어도
  alternatives_korean:
  - 또는 적어도
  - 혹은 기껏해야
  lexicon: vel certe
  rationale: POB 수정 내역이 보여 주듯 이 표현은 상향이 아니라 최소 대안/후퇴선을 나타내므로 '적어도'로 옮겼습니다.
- source_word: vocem eius audire
  english_pob_choice: to hear his voice
  chosen_korean: 그의 음성이라도 듣기를 원할 것입니다
  alternatives_korean:
  - 그의 목소리라도 듣기를 원할 것입니다
  - 그의 소리라도 듣기를 원할 것입니다
  lexicon: vox
  rationale: '''vocem''은 단순한 소리보다 ''음성/목소리''가 더 정확하며, ''라도''로 절박한 최소 요구를 드러냈습니다.'
