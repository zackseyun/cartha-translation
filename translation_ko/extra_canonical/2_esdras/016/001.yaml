  rationale: 라틴어 지명은 현대 한국어의 통용 표기를 따라 옮겨, 독자가 즉시 지리적 대상을 인식하도록 했습니다.
theological_decisions:
- issue: 반복되는 심판 선언의 어조
  chosen_reading: 각 지명군 앞의 반복을 그대로 살려 두 번의 '불행하여라'를 유지했습니다.
  alternative_readings:
  - 한 번만 묶어서 '바빌론, 아시아, 이집트, 시리아여, 불행하여라'로 처리
  rationale: 원문의 감탄·탄식 반복이 예언적 선포의 강도를 형성하므로, 이를 평탄화하지 않고 보존했습니다.
