  lexicon: Latin Babylon / Asia
  rationale: 고유명사는 원문 지리명칭을 따라 음역하되, 성경적 통용성이 있는 바빌론보다 바빌론도 가능하지만 현대 표준 외래어 표기 감각에 맞춰 바빌론을 택했습니다.
