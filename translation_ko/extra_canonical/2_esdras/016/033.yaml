id: 2ES.16.33
reference: 2 Esdras 16:33
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et relinquetur deserta terra, et agri eius inveteraverunt, et viae eius et omnes semitae germinabunt spinas, eo quod non transient oves per eam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/033.yaml
  text: And the land will be left desolate[a], and its fields will grow old, and its roads and all its paths will sprout thorns, because sheep will not pass through them.
  footnotes:
  - marker: a
    text: Or 'and its fields will grow over with thorns, and its roads and all its paths will sprout brambles'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러면 땅은 황폐하게 남고, 그 밭들은 쇠퇴하고, 그 길들과 모든 오솔길에는 가시가 돋아날 것입니다. 양들이 그 땅을 지나가지 않기 때문입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terra
  english_pob_choice: the land
  chosen_korean: 땅
  alternatives_korean:
  - 땅
  - 땅/토지
  - 지면
  lexicon: terra
  rationale: terra는 여기서 특정 지역의 토지를 가리키므로, 자연스럽고 포괄적인 ‘땅’으로 옮겼습니다.
- source_word: agri eius inveteraverunt
  english_pob_choice: its fields will grow old
  chosen_korean: 그 밭들은 쇠퇴하며
  alternatives_korean:
  - 그 밭들은 늙어가며
  - 그 밭들은 오래되어 가며
  - 그 밭들은 쇠퇴하며
  lexicon: agri + invetero
  rationale: inveteraverunt는 단순히 잡초가 덮인다는 뜻이 아니라 ‘오래되어 쇠하다/낡다’의 의미이므로, 문맥상 농경지가 황폐해지는 상태를 ‘쇠퇴하다’로 표현했습니다.
- source_word: viae ... et omnes semitae germinabunt spinas
  english_pob_choice: its roads and all its paths will sprout thorns
  chosen_korean: 그 길들과 모든 오솔길에는 가시가 돋아날 것입니다
  alternatives_korean:
  - 그 길들과 모든 오솔길에는 가시가 자랄 것입니다
  - 그 길들과 모든 오솔길에는 가시덤불이 돋아날 것입니다
  lexicon: viae / semitae / germinare + spinas
  rationale: roads and all paths를 각각 ‘길들’과 ‘오솔길’로 살리고, germinabunt spinas의 직유적 이미지를 ‘가시가 돋아날 것입니다’로 옮겼습니다.
- source_word: oves per eam
  english_pob_choice: sheep will not pass through them
  chosen_korean: 양들이 그 길로 지나가지 않기 때문입니다
  alternatives_korean:
  - 양들이 그 길을 지나지 않기 때문입니다
  - 양들이 그 길로 통과하지 않기 때문입니다
  lexicon: oves + transire
  rationale: oves는 문자적으로 ‘양들’이며, per eam의 방향성을 살려 ‘그 길로’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 예언적 파국 묘사의 직설성
  chosen_reading: ‘황폐하게 남고… 쇠퇴하며… 가시가 돋아날 것입니다’로 원문의 연쇄적 파국을 그대로 유지했습니다.
  alternative_readings:
  - 보다 완곡하게 ‘버려질 것입니다’나 ‘황량해질 것입니다’로 완화
  rationale: 본문은 심판 결과를 물질적·가시적으로 묘사하므로, 의미를 약화시키지 않도록 직설적인 자연 붕괴 이미지를 보존했습니다.
  doctrine_reference: 예언 문학의 심판 묘사 보존
