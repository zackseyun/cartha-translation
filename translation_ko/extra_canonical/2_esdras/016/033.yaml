  source_fidelity: 라틴어 per eam의 여성 단수 대명사는 terra(땅)를 가리킵니다. 따라서 양들이 지나지 않는 곳은 ‘길’이 아니라 ‘그 땅’입니다. agri eius inveteraverunt는 밭이 오래되어 쇠하는 황폐의 이미지이며, ‘쇠퇴하고’는 문맥상 이를 무리 없이 전달합니다.
  naturalness: 합쇼체의 예언적 진술로 자연스럽습니다. 병렬 절은 ‘남고 … 쇠퇴하고 … 돋아날 것입니다’로 정리하고, 마지막 절은 ‘그 땅을 지나가지 않기 때문입니다’로 자연스럽게 옮깁니다.
  terminology: terra는 ‘땅’, agri는 ‘밭들’, spinas는 ‘가시’, oves는 ‘양들’로 적절합니다. viae와 semitae의 구분도 ‘길들’과 ‘오솔길’로 유지합니다.
