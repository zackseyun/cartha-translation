id: 2ES.16.58
reference: 2 Esdras 16:58
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: thesauros illorum, qui metitus est mare et conceptum eius; Qui conclusit mare in medio aquarum et suspendit terram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/058.yaml
  text: He searches the deep and its treasures; he has measured the sea and what it contains; he has enclosed the sea in the midst of the waters and suspended the earth.
translation:
  language: ko
  text: 그는 깊음과 그 보물을 살피시며, 바다와 그 안에 있는 것을 측량하셨습니다. 그는 바다를 물들 한가운데에 가두시고 땅을 떠받치셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깊음’은 라틴어 thesauros illorum과 연결된 대상 영역을 가리키며, 영어 POB의 ‘the deep’에 해당합니다.
    reason: source_note
  - marker: b
    text: ‘그 안에 있는 것’은 conceptum eius를 풀어 옮긴 것으로, 영어 POB의 ‘what it contains’를 반영합니다.
    reason: source_note
lexical_decisions:
- source_word: thesauros illorum
  english_pob_choice: its treasures
  chosen_korean: 그 보물
  alternatives_korean:
  - 그의 보물
  - 그것들의 보물
  - 그 깊음의 보물
  lexicon: thesaurus
  rationale: 라틴어 속격 illorum은 직전의 profundum/mare와 연결된 소유 관계를 가리키므로, 한국어에서는 문맥상 대상에 딸린 ‘그 보물’로 자연스럽게 옮겼습니다.
- source_word: qui metitus est mare et conceptum eius
  english_pob_choice: he has measured the sea and what it contains
  chosen_korean: 바다와 그 안에 있는 것을 측량하셨습니다
  alternatives_korean:
  - 바다와 그 안에 든 것을 재셨습니다
  - 바다와 그 담긴 것을 헤아리셨습니다
  lexicon: metior
  rationale: metitus est는 ‘측량하다/재다’의 완료 의미이므로 ‘측량하셨습니다’로 옮기고, conceptum eius는 단순 ‘contains’가 아니라 ‘그 안에 있는 것’을 뜻하므로 이를 풀어 반영했습니다.
- source_word: conclusit mare in medio aquarum
  english_pob_choice: he has enclosed the sea in the midst of the waters
  chosen_korean: 바다를 물들 한가운데에 가두시고
  alternatives_korean:
  - 바다를 물 가운데에 두시고
  - 바다를 물들 가운데 둘러막으시고
  lexicon: concludo
  rationale: conclusit은 단순 위치 설명보다 ‘둘러 막아 가두다’의 뉘앙스가 있어, ‘가두시고’로 강하게 살렸습니다.
- source_word: suspendit terram
  english_pob_choice: and suspended the earth
  chosen_korean: 땅을 떠받치셨습니다
  alternatives_korean:
  - 땅을 매달아 두셨습니다
  - 땅을 지탱하셨습니다
  lexicon: suspendo
  rationale: suspendit는 문자적으로는 ‘매달다’이지만, 우주론적 진술에서는 땅을 공중에 ‘떠받치다/지탱하다’는 뜻을 드러내므로 한국어에서는 ‘떠받치셨습니다’로 옮겼습니다.
theological_decisions:
- issue: 하나님의 주권적 창조 행위의 연속적 서술
  chosen_reading: 시적 병렬을 유지해 바다를 ‘가두시고’, 땅을 ‘떠받치셨습니다’로 이어지는 하나님의 통치 능력을 드러냈습니다.
  alternative_readings:
  - 더 평이하게 ‘바다를 두시고 땅을 두셨습니다’로 번역할 수 있음
  rationale: 본문은 단순 정보 전달이 아니라 창조 세계를 통제하시는 하나님의 능력을 강조하므로, 동사의 힘을 약화시키지 않는 쪽을 택했습니다.
  doctrine_reference: 창조주 하나님의 주권
