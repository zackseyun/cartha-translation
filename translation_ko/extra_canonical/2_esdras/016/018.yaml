source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: in illis diebus? Initium dolorum et multi gemitus, initium famis et multi interient, initium bellorum et formidabunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/018.yaml
  text: 'In those days: the beginning of pains and much groaning, the beginning of famine and many will perish, the beginning of wars and they will be afraid, the beginning of evils and all will tremble.'
translation:
  language: ko
  text: '그때에: 고통의 시작과 많은 신음, 기근의 시작과 많은 이들의 죽음, 전쟁의 시작과 그들은 두려워할 것이며, 악들의 시작과 모든 이가 떨 것입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 본문에는 영어 POB처럼 ‘all will tremble’에 해당하는 마지막 절이 암시적으로 남아 있어, 판독 전통에 따라 별도 병렬 절로 보충될 수 있습니다.
    reason: source_note
lexical_decisions:
- source_word: in illis diebus
  english_pob_choice: In those days
  chosen_korean: 그때에
  alternatives_korean:
  - 그 날들에
  - 그 시절에
  lexicon: 시간 부사구
  rationale: 라틴어 도입구를 자연스러운 서술 연결어로 옮기되, 문맥상 종말론적 시간표현의 긴박함을 살려 간결하게 처리했습니다.
- source_word: dolorum
  english_pob_choice: pains
  chosen_korean: 고통
  alternatives_korean:
  - 산통
  - 아픔
  lexicon: dolor
  rationale: 출산 진통처럼 좁게 한정하지 않고, 라틴어 복수형이 가리키는 व्यापक한 고통의 의미를 표준어로 전달했습니다.
- source_word: multi interient
  english_pob_choice: many will perish
  chosen_korean: 많은 이들의 죽음
  alternatives_korean:
  - 많은 이들이 죽을 것입니다
  - 많은 이들이 멸망할 것입니다
  lexicon: intereo
  rationale: 직역적 미래형보다 문장 대구를 살리면서 결과를 강조하는 명사구로 옮겼습니다.
- source_word: formidabunt
  english_pob_choice: they will be afraid
  chosen_korean: 두려워할 것이며
  alternatives_korean:
  - 무서워할 것이며
  - 공포에 떨 것이며
  lexicon: formido
  rationale: 라틴어의 주어가 불특정 복수인 점을 유지해, 영어 POB처럼 특정 직분자를 덧붙이지 않고 일반 복수로 처리했습니다.
- source_word: initium bellorum ... initium dolorum/famis/evils
  english_pob_choice: the beginning of wars ... the beginning of evils
  chosen_korean: 전쟁의 시작 ... 악들의 시작
  alternatives_korean:
  - 전쟁의 시작 ... 재앙들의 시작
  - 전쟁의 시작 ... 악의 시작
  lexicon: initium
  rationale: 반복되는 initium을 보존하여 병렬 구조를 드러냈고, ultima clause의 malorum은 다수형 의미를 살려 ‘악들’로 옮겼습니다.
theological_decisions:
- issue: 종말론적 재난 목록의 구조 유지
  chosen_reading: 도입부와 네 개의 병렬 절단을 살려, 재난의 누적과 확장을 독자가 바로 느끼도록 했습니다.
  alternative_readings:
  - 한 문장으로 유려하게 재구성
  - 재난 항목을 설명적으로 풀어쓰기
  rationale: 라틴어 원문의 예언적 열거를 약화시키지 않기 위해, 반복되는 ‘시작’ 구조와 급박한 나열을 유지했습니다.
  doctrine_reference: 종말론적 경고의 수사 구조
