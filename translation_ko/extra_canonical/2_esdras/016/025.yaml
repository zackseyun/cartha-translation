  text: No farmer will be left to till the earth and to sow it[a].
  footnotes:
  - marker: a
    text: Or 'There will be no one left to till the earth and to sow it.'.
    reason: previous_rendering
translation:
  language: ko
  text: 농부가 남겨지지 않을 것이며, 땅을 갈고 그것에 씨를 뿌릴 사람도 남겨지지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅을 갈고 그것에 씨를 뿌릴 사람이 하나도 남지 않을 것입니다.’.
    reason: previous_rendering
lexical_decisions:
- source_word: agricola
  english_pob_choice: farmer
  chosen_korean: 농부
  alternatives_korean:
  - 농사꾼
  - 경작자
  - 농사짓는 사람
  lexicon: agricola
  rationale: 라틴어 agricola는 ‘농부, 경작자’의 구체적 인물을 가리키므로, POB의 ‘farmer’에 맞추어 일반적인 ‘사람’으로 풀지 않고 ‘농부’로 옮겼습니다.
- source_word: non derelinquetur
  english_pob_choice: will be left
  chosen_korean: 남겨지지 않을 것입니다
  alternatives_korean:
  - 남지 않을 것입니다
  - 버려지지 않을 것입니다
  lexicon: derelinquere
  rationale: 수동 부정형의 소멸·잔존 부재를 자연스럽게 살리기 위해 ‘남겨지지 않을 것입니다’로 옮겼습니다.
- source_word: colit terram
  english_pob_choice: to till the earth
  chosen_korean: 땅을 갈고
  alternatives_korean:
  - 땅을 경작하고
  - 토지를 일구고
  lexicon: colere
  rationale: colere terram의 ‘땅을 일구다/갈다’는 경작 행위를 직접 드러내기 위해 ‘땅을 갈고’로 옮겼습니다.
- source_word: seminat eam
  english_pob_choice: to sow it
  chosen_korean: 그것에 씨를 뿌릴
  alternatives_korean:
  - 거기에 씨를 뿌릴
  - 그 땅에 씨를 뿌릴
  lexicon: seminare
  rationale: 대명사 eam을 앞의 ‘땅’에 연결해 ‘그것에 씨를 뿌릴’로 처리하여, 경작과 파종의 병렬을 유지했습니다.
