revisions:
- from: 사람들 앞에 너희 죄가 드러날 때 너희는 수치를 당할 것이며, 그날 너희의 불의는 고발자로 서게 될 것입니다.[a]
  to: 너희 죄가 사람들 앞에서 드러날 때 너희는 수치를 당할 것이며, 그날 너희의 불의는 고발자로 설 것입니다.[a]
  rationale: 공개적 노출을 나타내는 장소 표현을 ‘사람들 앞에서’로 다듬고, 원문의 단순 미래형을 따라 ‘고발자로 설 것입니다’로 고쳤습니다. 각주는 본문의 어느 표현에 대한 대안인지 분명히 하면서 processerint의 ‘나오다/드러나다’ 범위 안에 머물도록 정리했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:20Z'
review_pass:
  verdict: revise
  source_fidelity: 본문은 confusi eritis의 수치, peccata ... coram hominibus의 사람들 앞에서의 공개적 드러남, 그리고 iniquitates ... accusatores stabunt의 법정적 의인화를 대체로 충실히 옮겼습니다. 다만 ‘서게 될 것입니다’는 원문의 단순 미래 ‘설 것이다’보다 약간 결과·변화의 뉘앙스를 더합니다.
  naturalness: ‘사람들 앞에서’가 죄가 공개적으로 드러나는 장면을 나타낼 때 ‘사람들 앞에’보다 자연스럽습니다. 또한 ‘고발자로 설 것입니다’가 현대 한국어에서 더 간결하고 자연스럽습니다.
  terminology: ‘수치를 당하다’, ‘불의’, ‘고발자’는 엄숙한 심판 및 법정 장면에 적절합니다. ‘고발자로 서다’는 불의 자체가 고발자로 의인화되는 원문의 표현을 보존합니다.
  issues:
  - severity: low
    issue: ‘고발자로 서게 될 것입니다’의 사역·변화성
    rationale: 라틴어 stabunt는 단순히 ‘설 것이다’입니다. ‘서게 되다’도 가능한 번역이나, 원문에 없는 결과적 뉘앙스를 약간 보태므로 ‘설 것입니다’가 더 직접적입니다.
  - severity: low
    issue: 각주 인용문의 주어 생략 및 적용 범위 불명확
    rationale: 기존 각주 ‘사람들 앞에 드러나고’는 무엇이 드러나는지 문법상 불분명하며, 주절의 수치 표현도 빠져 있어 대안 번역으로 읽기 어렵습니다. ‘드러날 때’에 한정한 번역 대안을 명시하는 편이 명료합니다.
  revised_text: 너희 죄가 사람들 앞에서 드러날 때 너희는 수치를 당할 것이며, 그날 너희의 불의는 고발자로 설 것입니다.[a]
