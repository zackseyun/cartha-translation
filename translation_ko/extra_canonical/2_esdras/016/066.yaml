source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: confusi eritis, cum processerint peccata uestra coram hominibus, et iniquitates erint quae accusatores stabunt in die illo. Quid
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/066.yaml
  text: And you will be put to shame when your sins come forth before men[a], and your iniquities will stand as accusers on that day.
  footnotes:
  - marker: a
    text: Or 'come out before men, and your iniquities will stand as accusers'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희 죄가 사람들 앞에서 드러날 때 너희는 수치를 당할 것이며, 그날 너희의 불의는 고발자로 설 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘드러날 때’는 ‘사람들 앞에 나올 때’로도 번역할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: confusi eritis
  english_pob_choice: you will be put to shame
  chosen_korean: 수치를 당할 것이며
  alternatives_korean:
  - 부끄러움을 당할 것이며
  - 수치를 입을 것이며
  lexicon: confundere / confusus
  rationale: 라틴어 수동형은 단순한 감정보다 공개적 망신의 결과를 가리키므로, 현대 한국어에서는 ‘수치를 당하다’가 가장 직접적으로 대응합니다.
- source_word: processerint
  english_pob_choice: come forth
  chosen_korean: 드러날 때
  alternatives_korean:
  - 나타날 때
  - 나와 사람들 앞에 설 때
  lexicon: procedere
  rationale: POB의 수정 방향이 ‘come out’보다 격식 있는 ‘come forth’였으므로, 공개적 노출의 뉘앙스를 살려 ‘드러나다’로 옮겼습니다.
- source_word: peccata uestra coram hominibus
  english_pob_choice: your sins come forth before men
  chosen_korean: 너희 죄가 드러날 때
  alternatives_korean:
  - 사람들 앞에 너희 죄가 나타날 때
  - 사람들 앞에서 너희 죄가 드러날 때
  lexicon: coram hominibus
  rationale: ‘coram’은 단순한 위치가 아니라 공적 시야 앞을 뜻하므로, ‘사람들 앞에/앞에서’로 공개성의 의미를 보존했습니다.
- source_word: iniquitates ... accusatores stabunt
  english_pob_choice: your iniquities will stand as accusers
  chosen_korean: 너희의 불의는 고발자로 서게 될 것입니다
  alternatives_korean:
  - 너희의 불의는 고발자로 설 것입니다
  - 너희의 죄악은 고소인으로 서게 될 것입니다
  lexicon: iniquitates / accusatores
  rationale: 단순히 ‘의인화된 비난’이 아니라 죄악 자체가 법정적 증인·고발자로 선다는 구성이므로, ‘고발자’와 ‘서게 될 것입니다’로 심판 장면을 살렸습니다.
theological_decisions:
- issue: 공개적 수치와 죄의 의인화된 고발 구조
  chosen_reading: 죄가 사람들 앞에 드러나고, 불의가 그날의 고발자로 서는 최종적 수치의 심판 장면으로 옮겼습니다.
  alternative_readings:
  - 죄가 밖으로 나오고 불의가 고발자로 선다
  - 죄가 드러나고 불의가 고발한다
  rationale: 본문은 단순한 도덕적 후회가 아니라 공개 재판처럼 죄 자체가 증거가 되는 종말론적 수치를 말하므로, 법정적 긴장을 약화시키지 않도록 했습니다.
  doctrine_reference: 종말 심판의 공개성, 죄의 자기고발적 성격
