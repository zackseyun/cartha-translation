  text: The trees will bear fruit, and who will gather it?
translation:
  language: ko
  text: 나무들은 열매를 맺을 것이고, 누가 그것을 거두겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ligna fructiferabunt
  english_pob_choice: The trees will bear fruit
  chosen_korean: 나무들은 열매를 맺을 것이고
  alternatives_korean:
  - 나무들은 열매를 맺을 것입니다
  - 나무들은 열매를 낼 것이고
  lexicon: lignum / fructiferare
  rationale: 라틴어 복수 주어 ligna를 그대로 살려 ‘나무들’로 옮기고, fructiferabunt의 결과 상태를 자연스럽게 ‘열매를 맺을 것이다’로 표현했습니다.
- source_word: quis vindemiet
  english_pob_choice: who will gather it?
  chosen_korean: 누가 그것을 거두겠습니까?
  alternatives_korean:
  - 누가 그것을 수확하겠습니까?
  - 누가 그것을 거둘 수 있겠습니까?
  lexicon: vindemiare
  rationale: vindemiet은 포도/수확 이미지를 포함한 ‘거두다, 수확하다’의 뜻이므로, 영어 POB의 gather를 따라도 한국어에서는 ‘거두다’가 가장 자연스럽고 원문에 가깝습니다.
