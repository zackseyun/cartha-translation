id: 2ES.16.9
reference: 2 Esdras 16:9
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: mala, et quis repell(et) ea? Exiet ignis ex iracundia eius, et quis
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/009.yaml
  text: Evils[a], and who will repel them? Fire will come forth from his wrath, and who is there to quench it?
  footnotes:
  - marker: a
    text: Or 'Fire will go out from his wrath, and who is there to quench it?'.
    reason: previous_rendering
translation:
  language: ko
  text: 재앙들이 닥칠 것이니, 누가 그것들을 물리칠 수 있겠습니까?[a] 그의 진노에서 불이 나올 것이니, 누가 그것을 끌 수 있겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 repellere는 여기서 ‘물리치다, 되돌리다’라는 뜻입니다.
    reason: source_note
lexical_decisions:
- source_word: mala
  english_pob_choice: Evils
  chosen_korean: 재앙들
  alternatives_korean:
  - 악들
  - 재난들
  - 화들
  lexicon: mala
  rationale: 문맥상 단순한 도덕적 악보다 임박한 심판의 참화를 가리키므로, 한국어에서는 복수성을 살린 ‘재앙들’이 가장 자연스럽고 경고의 강도도 유지합니다.
- source_word: repell(et)
  english_pob_choice: who will repel them?
  chosen_korean: 누가 그것들을 막을 수 있겠습니까?
  alternatives_korean:
  - 누가 그것들을 물리치겠습니까?
  - 누가 그것들을 거절하겠습니까?
  - 누가 그것들을 쫓아내겠습니까?
  lexicon: repellere
  rationale: 라틴어 repellere는 밀어내다/되돌리다의 뜻이므로, 심판의 재앙을 ‘막다’로 옮기면 한국어 독자가 의미를 즉시 파악할 수 있습니다.
- source_word: Exiet ignis ex iracundia eius
  english_pob_choice: Fire will come forth from his wrath
  chosen_korean: 그의 진노에서 불이 나와서
  alternatives_korean:
  - 그의 진노로부터 불이 나오고
  - 그의 분노에서 불이 솟아나와서
  lexicon: exire, ignis, iracundia
  rationale: ‘나오다/나다’는 원문의 emanation을 살리면서, 불이 진노로부터 발현된다는 강한 인과를 한국어로 자연스럽게 전달합니다.
- source_word: quench it
  english_pob_choice: quench it
  chosen_korean: 그것을 끌 수 있겠습니까?
  alternatives_korean:
  - 그것을 끌 수 있겠습니까?
  - 그것을 꺼버릴 수 있겠습니까?
  - 그것을 진압할 수 있겠습니까?
  lexicon: exstinguere
  rationale: 불을 ‘끄다’는 가장 직접적인 대응이며, 앞절의 불 이미지와도 정확히 맞물립니다.
theological_decisions:
- issue: 심판의 재앙과 진노의 불을 어떻게 표현할지
  chosen_reading: 하나님의 분노가 단순한 감정이 아니라 실제로 역사 안에 드러나는 심판의 재앙과 불로 이어진다는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 완화하여 도덕적 경고문처럼 옮기는 읽기
  - 진노를 ‘노여움’으로 약화시키는 읽기
  rationale: 원문은 두 질문형 수사를 통해 막을 수 없는 심판을 강조하므로, 이를 부드럽게 바꾸지 않고 위협성과 절박함을 보존했습니다.
  doctrine_reference: eschatological judgment
