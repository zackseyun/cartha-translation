source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ecce enim incenditur ardor super uos turba copiosae, et rapient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/069.yaml
  text: For behold[a], a burning wrath is kindled against you, a great multitude[b], and they will seize some of you and feed them with meat sacrificed to idols.
  footnotes:
  - marker: a
    text: The phrase may mean that some are seized and slaughtered in connection with idol worship, or that they are handed over as food after being killed. The Latin is harsh and somewhat compressed.
    reason: lexical_alternative
    anchor_ref: 16:69
  - marker: b
    text: Or 'and feed you, after killing you, to idols.'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오, 불타는 진노가 너희 위에 일어나고 있습니다. 큰 무리가 너희를 붙잡아, 어떤 이들은 우상에게 바친 제물로 먹게 할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 super vos는 문자적으로는 ‘너희 위에’이지만, 적대적 방향성을 띠므로 영어 POB처럼 ‘against you’의 뜻으로 읽을 수 있습니다.
    reason: source_note
  - marker: b
    text: cibabunt idolis occisam은 ‘우상에게 바친 제물’이라는 의미로 이해하는 것이 문맥과 수정 이력에 부합합니다.
    reason: textual_variant
lexical_decisions:
- source_word: Ecce
  english_pob_choice: For behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자, 보십시오
  lexicon: ecce
  rationale: 주의를 환기하는 감탄사로, 현대 합쇼체의 직접적 호소인 ‘보십시오’가 가장 자연스럽습니다.
- source_word: incenditur ardor
  english_pob_choice: a burning wrath is kindled
  chosen_korean: 불타는 진노가 일어나고 있습니다
  alternatives_korean:
  - 불붙는 진노가 타오르고 있습니다
  - 불타는 분노가 일어나고 있습니다
  lexicon: ardor
  rationale: ardor는 단순한 감정이 아니라 파괴적으로 타오르는 진노를 가리키므로, ‘불타는 진노’로 옮기고 현재 진행형으로 임박성을 살렸습니다.
- source_word: super uos
  english_pob_choice: against you
  chosen_korean: 너희 위에
  alternatives_korean:
  - 너희를 향해
  - 너희에게
  lexicon: super
  rationale: 라틴어 super의 위압적·적대적 뉘앙스를 살려 ‘너희 위에’로 직역하되, 문맥상 적대성을 문장 전체에서 분명히 했습니다.
- source_word: turba copiosae
  english_pob_choice: a great multitude
  chosen_korean: 큰 무리
  alternatives_korean:
  - 많은 군중
  - 대단한 무리
  lexicon: turba
  rationale: turba copiosae는 수가 많은 집단을 뜻하므로, 간결하고 성경 문체에 맞는 ‘큰 무리’가 적절합니다.
- source_word: rapient
  english_pob_choice: they will seize some of you
  chosen_korean: 너희를 붙잡아
  alternatives_korean:
  - 너희 중 일부를 붙잡아
  - 너희를 사로잡아
  lexicon: rapio
  rationale: applied revision과 대조되는 폭력적 상황을 반영하되, 본문의 압축성을 살려 ‘붙잡아’로 옮겼습니다.
- source_word: cibabunt idolis occisam
  english_pob_choice: feed them with meat sacrificed to idols
  chosen_korean: 우상에게 바친 제물로 먹게 할 것입니다
  alternatives_korean:
  - 우상에게 바친 제물을 먹일 것입니다
  - 우상 제물로 먹게 할 것입니다
  lexicon: idolis occisam
  rationale: 수정 이력에 따라 이는 희생된 고기를 뜻하는 관용적 표현으로 이해해야 하므로, ‘우상에게 바친 제물’로 자연스럽게 풀어 옮겼습니다.
theological_decisions:
- issue: 폭력과 우상제물의 결합된 경고
  chosen_reading: 이 구절은 박해 속에서 일부가 강제로 붙잡혀 우상에게 바친 제물을 먹게 되는 재난을 예고합니다.
  alternative_readings:
  - 붙잡힌 뒤 죽임을 당하고 우상에게 넘겨진다
  - 우상 자체에게 먹히도록 넘겨진다
  rationale: 수정 이력이 보여 주듯 본문은 순교적 폭력과 우상숭배 강요를 결합해 경고하며, 핵심은 ‘죽임’ 자체보다 우상제물 강요의 잔혹성에 있습니다.
  doctrine_reference: 우상숭배 경계와 박해의 예언적 경고
