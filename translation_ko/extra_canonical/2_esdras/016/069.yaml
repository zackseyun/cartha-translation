  terminology: ‘진노’, ‘우상에게 바친 제물’, ‘붙잡다’는 적절합니다. ‘우상에게 바친 제물로 먹게 하다’보다 ‘우상에게 바친 제물을 먹이다’가 강제 섭취의 의미를 더 직접적으로 전달합니다.
