review_pass:
  verdict: revise
  source_fidelity: 라틴어 iusticia regnabit in nos는 ‘의가 우리를 다스릴 것입니다’로 자연스럽고 직접적으로 옮길 수 있습니다. ‘군림하다’는 원문의 왕권 비유를 반영할 수 있으나, 한국어에서는 부당하거나 억압적인 지배라는 부정적 함의를 더하기 쉽습니다. Non dicat peccator non se peccasse는 죄인이 자신이 죄를 짓지 않았다고 말하지 않도록 하는 금지/당위 표현입니다.
  naturalness: ‘의가 우리 위에 군림할 것입니다’보다 ‘의가 우리를 다스릴 것입니다’가 현대 표준 한국어에서 더 자연스럽습니다. ‘말하지 못하게 하십시오’는 독자에게 누군가를 제지하라고 요청하는 듯하여 원문의 일반적 금지법과 맞지 않습니다.
  terminology: iusticia의 문맥상 종교·윤리적 핵심어는 ‘의’로 유지하는 것이 적절합니다. peccator와 peccasse는 각각 ‘죄인’, ‘죄를 짓다’로 번역할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘군림하다’의 과도한 부정적 뉘앙스
    rationale: regnabit은 왕으로 다스림을 뜻하지만, ‘군림하다’는 현대 한국어에서 오만하거나 억압적인 지배를 암시하기 쉽습니다.
  - severity: medium
    issue: 금지법의 화행이 부정확함
    rationale: ‘말하지 못하게 하십시오’는 제3자에게 죄인을 막으라는 요청으로 읽힐 수 있습니다. 원문 Non dicat은 죄인에게 적용되는 일반적 금지입니다.
  - severity: low
    issue: 직역 각주의 불필요성과 표현 불일치
    rationale: 현 번역의 ‘군림’과 각주의 ‘왕노릇’이 다르며, 원문에 없는 번역 선택 각주는 본문 이해에 필요하지 않습니다.
  revised_text: 의가 우리를 다스릴 것입니다. 죄인은 자신이 죄를 짓지 않았다고 말해서는 안 됩니다.
