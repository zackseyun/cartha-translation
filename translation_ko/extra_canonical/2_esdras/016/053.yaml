  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/053.yaml
  text: righteousness will reign over us[a]. Let not the sinner say that he has not sinned,
  footnotes:
  - marker: a
    text: Or 'For behold, in a very little while iniquity will be taken away from the earth, and righteousness will reign over us.'.
