translation:
  language: ko
  text: 의가 우리 위에 군림할 것입니다. 죄인은 자기가 죄를 짓지 않았다고 말하지 못하게 하십시오.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘의가 우리 위에 왕노릇할 것입니다’입니다.
    reason: source_note
lexical_decisions:
- source_word: iusticia
  english_pob_choice: righteousness
  chosen_korean: 의
  alternatives_korean:
  - 의로움
  - 정의
  lexicon: δικαιοσύνη / iusticia
  rationale: 라틴어 iusticia는 여기서 하나님 앞의 바른 상태와 통치적 기준을 가리키므로, POB의 기본어인 ‘의’가 가장 직접적입니다.
- source_word: regnabit in nos
  english_pob_choice: will reign over us
  chosen_korean: 우리 위에 군림할 것입니다
  alternatives_korean:
  - 우리 위에 다스릴 것입니다
  - 우리 위에 통치할 것입니다
  lexicon: βασιλεύσει ἐφ᾽ ἡμᾶς / regnabit in nos
  rationale: regnare는 단순한 존재가 아니라 왕권적 지배를 뜻하므로 ‘다스리다’보다 더 강한 ‘군림하다’를 택해 통치의 강도를 드러냈습니다.
- source_word: Non dicat peccator non se peccasse
  english_pob_choice: Let not the sinner say that he has not sinned
  chosen_korean: 죄인은 자기가 죄를 짓지 않았다고 말하지 못하게 하십시오
  alternatives_korean:
  - 죄인은 자기가 죄를 범하지 않았다고 말하지 못하게 하십시오
  - 죄인이 자신은 죄를 지은 적이 없다고 말하게 하지 마십시오
  lexicon: peccator / peccasse
  rationale: peccare는 ‘죄를 짓다’가 자연스러우며, 금지 명령의 뉘앙스를 한국어로 살리기 위해 ‘말하지 못하게 하십시오’로 옮겼습니다.
theological_decisions:
- issue: 직설문과 권면문의 종결 방식
  chosen_reading: 첫 절은 선언문으로, 둘째 절은 금지 권면문으로 구분해 번역했습니다.
  alternative_readings:
  - 두 절 모두 선언형으로 평행 처리
  - 둘째 절을 단순 미래형으로 처리
  rationale: 라틴어 Non dicat는 명령적 금지의 뉘앙스를 띠므로, 한국어에서도 독자가 권면/금지로 인식하도록 분리했습니다.
  doctrine_reference: 문맥상 예언적·권면적 화법
