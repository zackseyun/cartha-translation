  to: 의가 우리를 다스릴 것입니다. 죄인은 자신이 죄를 짓지 않았다고 말해서는 안 됩니다.
  rationale: ‘다스릴 것입니다’는 regnabit in nos의 통치 비유를 보존하면서도 불필요하게 부정적인 함의를 피합니다. 둘째 문장은 라틴어 금지법을 현대 합쇼체의 일반적 금지 표현으로 옮겼습니다. 원문상 이 구절에 필요한 본문 비평 또는 의미 각주는 없으므로 기존의 번역 선택 각주는 삭제했습니다.
  reviewer_model: gpt-5.6-terra
