  text: 그들의 도시와 집들과 소유물과 자기 자신들까지; 그러할수록 더 그렇습니다.
  philosophy: formal
lexical_decisions:
- source_word: ciuitates
  english_pob_choice: their cities
  chosen_korean: 그들의 도시
  alternatives_korean:
  - 그들의 성읍들
  - 그들의 도시들
  lexicon: 도시
  rationale: 라틴어 복수형 ciuitates를 자연스러운 현대 한국어로 옮기되, 지리적·공동체적 거주지를 가리키는 기본 의미를 유지했습니다.
- source_word: domus suas
  english_pob_choice: their houses
  chosen_korean: 집들과
  alternatives_korean:
  - 가옥들과
  - 주택들과
  lexicon: 집
  rationale: domus는 단순 건물이 아니라 거주 공간을 뜻하므로, 문맥을 해치지 않는 가장 직접적인 표준어인 ‘집들’로 옮겼습니다.
- source_word: possessiones
  english_pob_choice: their possessions
  chosen_korean: 소유물과
  alternatives_korean:
  - 재산과
  - 소유물들
  lexicon: 소유물
  rationale: 보이는 재산 전반을 뜻하는 넓은 범주를 유지하기 위해 ‘소유물’을 선택했습니다.
- source_word: personas suas
  english_pob_choice: their own persons
  chosen_korean: 자기 자신들까지
  alternatives_korean:
  - 그들 자신의 몸까지
  - 그들 자신까지
  lexicon: 자기 자신
  rationale: personae는 ‘인격/사람/자기 자신’의 폭이 있으나, 여기서는 소유 대상이 극대화되는 수사이므로 ‘자기 자신들까지’로 옮겨 강조를 살렸습니다.
- source_word: Tanto
  english_pob_choice: so much the more
  chosen_korean: 그러할수록 더 그렇습니다
  alternatives_korean:
  - 그만큼 더 그렇습니다
  - 더욱 그렇습니다
  lexicon: 그러할수록
  rationale: 비교·상응의 정도를 나타내는 tanto의 기능을 한국어에서 자연스럽게 드러내기 위해 ‘그러할수록 더’로 옮겼습니다.
