  source_fidelity: 라틴어의 "super aquas fundauit eum"은 하늘을 물 위에 세웠다는 뜻으로 정확히 반영되어 있습니다. "Qui posuit in deserto fontes aquarum"도 광야에 복수의 물의 샘들을 두셨다는 의미를 보존합니다. 다만 fontes aquarum의 속격 관계는 ‘물 샘들’보다 ‘물의 샘들’로 드러내는 편이 더 직접적이고 자연스럽습니다.
