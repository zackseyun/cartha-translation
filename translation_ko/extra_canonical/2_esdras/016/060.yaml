  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: super aquas fundauit eum; Qui posuit in deserto fontes aquarum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/060.yaml
  text: He stretched out heaven like a vaulted chamber, and founded it upon the waters; who placed springs of waters in the desert.
translation:
  language: ko
  text: 그분은 하늘을 둥근 천막처럼 펴시고 물 위에 그것을 세우셨으며, 광야에 물 샘들을 두신 분이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: super aquas fundauit eum
  english_pob_choice: founded it upon the waters
  chosen_korean: 물 위에 그것을 세우셨으며
  alternatives_korean:
  - 물 위에 그것을 기초하셨으며
  - 물 위에 그것을 세우셨고
  lexicon: fundare
  rationale: fundauit는 ‘기초하다/세우다’의 स्थाप립 의미이므로, 한국어에서는 ‘세우다’로 자연스럽게 옮기되 대상이 하늘임을 앞절의 ‘펴시고’와 연결해 유지했습니다.
- source_word: Qui posuit in deserto fontes aquarum
  english_pob_choice: who placed springs of waters in the desert
  chosen_korean: 광야에 물 샘들을 두신 분이십니다
  alternatives_korean:
  - 광야에 물의 샘들을 놓으신 분이십니다
  - 사막에 물 샘들을 두신 분이십니다
  lexicon: posuit / fontes aquarum / deserto
  rationale: posuit는 단순히 ‘두다/놓다’로 충분하고, fontes aquarum은 물이 솟는 샘들을 뜻하므로 ‘물 샘들’로 응축했습니다. deserto는 성서적 대비를 살려 ‘광야’로 옮겼습니다.
- source_word: super aquas / in deserto
  english_pob_choice: upon the waters / in the desert
  chosen_korean: 물 위에 / 광야에
  alternatives_korean:
  - 물들 위에 / 사막에
  lexicon: super / in
  rationale: 장소 전치사의 기본 공간 관계를 유지해, 창조 행위의 위치 대비가 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 주어의 지시와 문장 연결
  chosen_reading: ‘그분’이 하늘을 펴시고 물 위에 세우셨으며, 또 광야에 샘을 두신 창조주를 가리키도록 한 문장으로 연결했습니다.
  alternative_readings:
  - 두 문장을 완전히 분리해 번역하는 방식
  - ‘그분’ 대신 이름을 보강하는 방식
  rationale: 라틴어의 상대절 Qui는 앞선 주어를 이어 받는 구조이므로, 한국어에서도 같은 창조주를 가리키는 연속 서술로 처리하는 것이 본문 의미를 가장 잘 보존합니다.
  doctrine_reference: 창조주 하나님의 주권적 창조 행위
