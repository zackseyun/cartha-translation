translation:
  language: ko
  text: 너희 가운데 일부에게 우상에게 바쳐진 음식을 먹게 할 것입니다. 그리고 그들에게 동의하는 사람들은 그들에게 조롱과 모욕과 짓밟힘의 대상이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들에게 동의하는 사람들은 그들에게 조롱과 모욕을 당하고 짓밟힐 것입니다.’
    reason: 라틴어의 ‘조롱과 모욕과 짓밟힘’이라는 명사 병렬을, 마지막 항목을 동사로 풀어 자연스럽게 옮긴 대안입니다.
lexical_decisions:
- source_word: cibabunt
  english_pob_choice: they will feed you food sacrificed to idols
  chosen_korean: 너희에게 우상에게 바쳐진 음식을 먹게 할 것입니다
  alternatives_korean:
  - 너희에게 우상에게 바쳐진 제물을 먹일 것입니다
  - 너희에게 우상에게 바친 음식을 주어 먹게 할 것입니다
  lexicon: cibare
  rationale: Latin의 직접적 목적어 구조를 살려 ‘먹게 하다’로 옮기고, POB의 ‘food sacrificed to idols’를 따라 ‘우상에게 바쳐진 음식’으로 자연스럽게 표현했습니다.
- source_word: idolis occisam
  english_pob_choice: food sacrificed to idols
  chosen_korean: 우상에게 바쳐진 음식
  alternatives_korean:
  - 우상에게 희생된 음식
  - 우상에게 바쳐진 제물
  lexicon: idolis occisam
  rationale: 본문의 핵심은 우상에게 바쳐진 음식(제물)이라는 식별 가능한 음식물이며, 오독을 피하기 위해 ‘죽임’이나 ‘희생’보다 ‘바쳐진 음식’을 택했습니다.
- source_word: erint illis in derisum et in inproperium et in conculcationem
  english_pob_choice: will be for them an object of derision and reproach and trampling underfoot
  chosen_korean: 그들에게 조롱과 욕됨과 짓밟힘의 대상이 될 것입니다
  alternatives_korean:
  - 그들에게 조롱과 모욕과 짓밟힘이 될 것입니다
  - 그들에게 조롱과 수치와 발에 짓밟힘을 당할 것입니다
  lexicon: derisum / inproperium / conculcationem
  rationale: 세 명사의 병렬을 살리되, 라틴어의 erint illis(‘그들에게 ~가 될 것이다’)를 반영해 ‘대상’ 구문으로 옮겼습니다.
theological_decisions:
- issue: 우상제물 경고의 직설성
  chosen_reading: ‘우상에게 바쳐진 음식’으로 옮겨 우상숭배와 제의적 식사의 긴장을 분명히 드러냈습니다.
  alternative_readings:
  - ‘우상에게 바친 제물’
  - ‘우상 제물’
  rationale: 본문의 시험이 단순한 식사 금지가 아니라 우상에게 바쳐진 음식을 받아들일지의 문제이므로, 의미를 약화시키지 않는 표현을 택했습니다.
  doctrine_reference: 고린도전서 8:1-13; 10:19-21
