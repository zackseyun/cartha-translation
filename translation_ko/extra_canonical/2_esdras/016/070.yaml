  source_fidelity: 첫 구절의 quosdam ex uobis는 ‘그들 가운데 일부’가 아니라 ‘너희 가운데 일부’를 뜻합니다. 현 번역은 소유·범위를 반대로 옮겼습니다. 또한 inproperium은 여기서 ‘욕됨’보다 ‘모욕’이 자연스럽고 정확합니다. 후반부의 ‘그들에게’(illis)는 대상을 향한 관계를 나타내므로 유지할 수 있습니다.
  naturalness: ‘너희 가운데 일부에게 … 먹게 할 것입니다’는 라틴어 단편의 이어지는 구문을 한국어에서 자연스럽게 재현합니다. ‘조롱과 모욕과 짓밟힘의 대상’은 세 명사의 병렬을 보존하면서 현대 표준어 문체에 맞습니다.
  terminology: ‘우상에게 바쳐진 음식’은 idolis occisam이 가리키는 우상 제물 음식을 명확히 전달합니다. ‘모욕’은 inproperium에 대한 자연스러운 현대어 대응입니다.
  issues:
