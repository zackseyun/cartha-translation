- from: 그들 가운데 일부는 너희에게 우상에게 바쳐진 음식을 먹게 할 것입니다. 그리고 그들에게 동의하는 자들은 그들에게 조롱과 욕됨과 짓밟힘의 대상이 될 것입니다.[a]
  to: 너희 가운데 일부에게 우상에게 바쳐진 음식을 먹게 할 것입니다. 그리고 그들에게 동의하는 사람들은 그들에게 조롱과 모욕과 짓밟힘의 대상이 될 것입니다.[a]
  rationale: 첫 절의 인칭·범위 오류를 바로잡아 ‘너희 가운데 일부’를 음식 섭취 강요의 대상으로 명시했습니다. 후반부는 erint illis의 관계 표현과 세 겹 명사열을 유지하되, ‘욕됨’을 현대어 ‘모욕’으로 고쳤습니다. 각주도 이에 맞추어 용어를 통일했습니다.
