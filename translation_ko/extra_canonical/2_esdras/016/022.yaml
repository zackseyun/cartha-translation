base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/022.yaml
  text: 'Behold[a], grain will soon be cheap upon the earth, so that they will think peace has been secured for them[b]. Then evils will spring up upon the earth: sword and famine.'
  footnotes:
  - marker: a
    text: The chapter's Latin tradition contains a duplicated block of material around verses 22–35. The present translation follows the fuller sequence once, rather than repeating the same judgments twice in English.
    reason: compositional_layer
    anchor_ref: '16:22'
  - marker: b
    text: 'Or ''there will be cheapness of grain upon the earth, so that they will think peace has been set straight for them; and then evils will spring up upon the earth: sword, famine, and great confusion.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오[a], 땅 위에 곡식 값이 곧 낮아질 것이므로, 그들은 자기들에게 평화가 확보되었다고 생각할 것입니다. 그때 땅 위에 칼과 기근이라는 재앙들이 돋아날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴 전승에는 22–35절 주변에 같은 경고 묶음이 중복되어 전해지지만, 이 번역은 본문의 더 긴 흐름을 한 번만 따라갑니다.
    reason: textual_variant
lexical_decisions:
- source_word: ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: 감탄사/호소
  rationale: 예언적 경고의 도입부를 현대 합쇼체로 자연스럽게 살리면서도, 독자에게 주의를 환기하는 기능을 유지합니다.
- source_word: annonae vilitas
  english_pob_choice: grain will soon be cheap
  chosen_korean: 곡식은 얼마 지나지 않아 땅에서 값이 싸질 것이므로
  alternatives_korean:
  - 곡식 값이 곧 땅에서 떨어질 것이므로
  - 곡식은 곧 땅에서 싸질 것이므로
  lexicon: annona / vilitas
  rationale: '`annonae vilitas`는 단순한 추상적 ‘저렴함’보다 곡식 가격 하락을 가리키므로, 의미를 살려 ‘값이 싸지다’로 옮겼습니다. `in brevi`도 빠짐없이 반영했습니다.'
- source_word: directam pacem
  english_pob_choice: peace has been secured
  chosen_korean: 평강이 확보되었다고
  alternatives_korean:
  - 평강이 확립되었다고
  - 평화가 굳게 세워졌다고
  lexicon: directus / pax
  rationale: '`directam`은 단순한 감정 상태보다 ‘바로잡혀/정돈되어’ 안정된 평화를 뜻하므로, 자연스러운 한국어로는 ‘확보되다’가 가장 가깝습니다. 전통적 교회어인 ‘평화’보다 POB 용례에 맞춰 ‘평강’을 유지했습니다.'
- source_word: gladius et famis
  english_pob_choice: sword and famine
  chosen_korean: 칼과 기근
  alternatives_korean:
  - 칼과 굶주림
  - 칼과 기아
  lexicon: gladius / fames
  rationale: '`famis`는 단순한 배고픔이 아니라 재난적 기근을 뜻하므로 ‘기근’이 적절합니다. `gladius`는 예언문맥의 전쟁 도구로 직역해 ‘칼’을 유지했습니다.'
theological_decisions:
- issue: 평강의 성격
  chosen_reading: 여기서의 평강은 실제적 안전과 질서가 보장된 상태를 가리키며, 곧 닥칠 심판을 오해하게 만드는 표면적 안정입니다.
  alternative_readings:
  - 영적 평안
  - 전쟁이 없는 상태
  rationale: 본문은 사람들이 외적 안정을 근거로 오판하는 장면이므로, 단순한 내면 심리보다 사회·역사적 안정의 뉘앙스를 살리는 것이 문맥에 맞습니다.
  doctrine_reference: 예언서의 심판 경고 문맥
