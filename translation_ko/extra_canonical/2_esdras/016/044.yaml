  text: and the one who sows, like one who will not reap; so also the one who prunes the vines, like one who will not gather the grapes.
translation:
  language: ko
  text: 그리고 씨를 뿌리는 자는 거두지 못할 사람처럼, 포도나무를 치는 자는 포도를 거두지 못할 사람처럼 해야 합니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 putat는 문맥상 포도나무를 치거나 가지치는 일을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: uindemiaturus는 ‘포도를 거두다, 수확하다’의 미래분사입니다.
    reason: source_note
lexical_decisions:
- source_word: Qui seminat, quasi qui non metat
  english_pob_choice: the one who sows, like one who will not reap
  chosen_korean: 씨를 뿌리는 자는 거두지 못할 사람처럼
  alternatives_korean:
  - 씨를 뿌리는 자는 거두지 못할 이처럼
  - 씨를 뿌리는 자는 추수하지 못할 것처럼
  lexicon: seminat → 씨를 뿌리는 자; metat → 거두다/추수하다
  rationale: 라틴어의 농경 대비를 살리되, POB의 ‘will not reap’에 맞춰 결과를 직접적으로 드러내는 ‘거두지 못할’로 옮겼습니다.
- source_word: sic et qui putat, quasi non uindemiaturus
  english_pob_choice: so also the one who prunes the vines, like one who will not gather the grapes
  chosen_korean: 포도나무를 치는 자는 포도를 거두지 못할 사람처럼
  alternatives_korean:
  - 포도나무를 가지치는 자는 포도를 따지 못할 사람처럼
  - 포도나무를 손질하는 자는 포도를 거두지 못할 사람처럼
  lexicon: putat → 포도나무를 치다/가지치다; uindemiaturus → 포도를 거두다, 포도 수확을 하다
  rationale: 라틴어 putat는 일반적 ‘손질’보다 포도나무를 다듬는 뜻이 분명하여 ‘포도나무를 치다’로 두었고, uindemiaturus는 POB의 ‘gather the grapes’에 맞춰 ‘포도를 거두다’로 풀었습니다.
theological_decisions:
- issue: 이 구절의 명령형/비유형 어조
  chosen_reading: 직접 명령보다 ‘~처럼’의 비유를 유지해, 종말적 긴장 속에서 기대를 내려놓는 대비를 드러냈습니다.
  alternative_readings:
  - 명령형으로 강하게 풀기
  - 일반적인 교훈문으로 완화하기
  rationale: 본문은 행위의 당위보다는 미래 수확의 불확실성을 비유적으로 말하므로, 원문의 대비 구조를 그대로 살리는 것이 더 적절합니다.
  doctrine_reference: source rhetoric / apocalyptic exhortation
