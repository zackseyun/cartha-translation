review_pass:
  verdict: revise
  source_fidelity: 원문의 병렬 구조(qui seminat …; sic et qui putat …)와 포도 재배·수확의 대조는 대체로 반영했습니다. 그러나 초안의 ‘해야 합니다’는 제시된 라틴어와 영어 감사본에 없는 직접적 의무 명령을 도입합니다. 또한 non metat 및 non uindemiaturus는 단순히 ‘못할’이라기보다 ‘거두지 않을’이라는 부정된 미래 전망을 표현합니다.
  naturalness: ‘포도나무를 치는 자’는 현대 표준어에서 다소 모호하고 자연스럽지 않습니다. ‘포도나무를 가지치는 이’가 해당 농경 행위를 분명하고 자연스럽게 전달합니다. 원문이 절 단편이므로 한국어에서도 병렬된 명사구 구조를 유지할 수 있습니다.
  terminology: putat는 여기서 포도나무의 가지를 치거나 다듬는 일을 뜻하므로 ‘포도나무를 가지치는 이’가 적절합니다. uindemiaturus는 포도 수확을 가리키므로 ‘포도를 거두지 않을 이’로 옮겼습니다.
  issues:
  - severity: medium
    issue: ‘해야 합니다’가 직접 명령을 추가함
    rationale: 제시된 라틴어 절과 영어 POB 감사본은 씨 뿌리는 이와 가지치는 이를 ‘거두지 않을 이처럼’ 병치할 뿐, ‘해야 한다’라는 명령형을 명시하지 않습니다.
  - severity: low
    issue: ‘포도나무를 치는 자’의 현대어 모호성
    rationale: ‘치다’는 여러 뜻을 가질 수 있어 가지치기라는 농경 의미가 즉시 드러나지 않습니다.
  - severity: low
    issue: ‘못할’이 부정 미래의 뉘앙스를 좁힘
    rationale: 원문은 능력의 결핍보다 수확하지 않게 될 전망을 표현하므로 ‘거두지 않을’이 더 중립적입니다.
  revised_text: 또 씨를 뿌리는 이는 거두지 않을 이처럼, 포도나무를 가지치는 이는 포도를 거두지 않을 이처럼.
  revised_footnotes:
