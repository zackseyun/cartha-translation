translation:
  language: ko
  text: 그들은 미친 사람들처럼 될 것이며, 아무도 아끼지 않고, 아직도 주님을 경외하는 사람들을 약탈하고 유린할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 미친 사람들처럼 되어 아무도 아끼지 않고, 주님을 경외하는 사람들을 계속 약탈하고 유린할 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: Erint quasi insani
  english_pob_choice: They will be like madmen
  chosen_korean: 미친 사람들처럼 될 것이며
  alternatives_korean:
  - 광인들처럼 될 것이며
  - 정신 나간 사람들처럼 될 것이며
  lexicon: quasi + insani
  rationale: 비유적 상태를 살려 ‘처럼’으로 처리했고, source의 강한 난폭성을 유지하기 위해 완곡한 표현보다 직설적인 ‘미친 사람들’이 적합합니다.
- source_word: neminem parcentes
  english_pob_choice: sparing no one
  chosen_korean: 아무도 아끼지 않고
  alternatives_korean:
  - 아무도 봐주지 않고
  - 한 사람도 예외 없이 해치며
  lexicon: parcere
  rationale: ‘sparing no one’의 무자비함을 자연스러운 한국어로 옮기되, 과도한 해석을 덧붙이지 않기 위해 간결하게 표현했습니다.
- source_word: ad diripiendum et deuastandum
  english_pob_choice: plundering and ravaging
  chosen_korean: 약탈하고 황폐하게 할 것입니다
  alternatives_korean:
  - 약탈하고 파괴할 것입니다
  - 탈취하고 짓밟을 것입니다
  lexicon: diripere / devastare
  rationale: 두 동사의 병렬을 살리면서, 각각의 폭력성을 분명히 드러내는 표준적 표현으로 옮겼습니다.
- source_word: adhuc timentes dominum
  english_pob_choice: those who still fear the Lord
  chosen_korean: 아직도 주님을 경외하는 사람들을
  alternatives_korean:
  - 여전히 주님을 두려워하는 사람들을
  - 아직도 주를 경외하는 이들을
  lexicon: adhuc + timentes dominum
  rationale: 적용된 수정처럼 ‘아직도’는 약탈의 지속이 아니라 대상을 수식하므로, ‘경외하는 사람들’에 직접 붙여 구조를 드러냈습니다.
theological_decisions:
- issue: Lord의 번역
  chosen_reading: 주님
  alternative_readings:
  - 주
  - 야훼
  rationale: 이 절은 라틴어 dominum이 일반 호칭으로 기능하므로, 한국어에서는 직접적이면서도 문맥에 맞는 ‘주님’을 사용했습니다.
  doctrine_reference: 호칭 사용의 문맥적 구별
- issue: 폭력적 종말 경고의 표현 강도
  chosen_reading: 미친 사람들처럼 될 것이며, 아무도 아끼지 않고
  alternative_readings:
  - 광란한 자들처럼 될 것이며, 누구도 용서하지 않고
  rationale: 원문의 경고적·파괴적 뉘앙스를 약화시키지 않으면서, 과도한 해석 없이 서술형 예언 문체를 유지했습니다.
  doctrine_reference: 예언적 경고의 수사
