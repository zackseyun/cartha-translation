  text: spiramentum dei omnipotentis, qui fecit omnia et scrutatur absconsa in absconsis. Certe hic nouit adinuentionem uestram
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/063.yaml
  text: the breath of God Almighty[a], who made all things and searches out hidden things in hidden places. Surely he knows your devising.
  footnotes:
  - marker: a
    text: Or 'and the breath of God Almighty, who made all things and searches out hidden things in hidden places. Surely he knows your devisings and what you think in your hearts.'.
    reason: previous_rendering
translation:
  language: ko
  text: 전능하신 하나님의 숨결은, 만물을 지으시고 숨은 곳에 숨은 것들을 살피시는 분이시며, 분명히 그분은 여러분의 꾀를 아십니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘전능하신 하나님의 숨결이요, 만물을 지으시고 숨은 곳에 숨은 것들을 살피시는 분이시며, 분명히 그분은 여러분의 꾀와 마음속에 생각하는 것을 아십니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: spiramentum dei omnipotentis
  english_pob_choice: the breath of God Almighty
  chosen_korean: 전능하신 하나님의 숨결
  alternatives_korean:
  - 하나님의 호흡
  - 전능하신 하나님의 영
  lexicon: spiramentum
  rationale: 라틴어 spiramentum은 ‘숨결/호흡’의 물리적 이미지를 살리며, 여기서는 성령 고유어를 단정하기보다 원문이 제시하는 생기·호흡의 표지를 그대로 옮기는 것이 안전합니다.
- source_word: qui fecit omnia
  english_pob_choice: who made all things
  chosen_korean: 만물을 지으시고
  alternatives_korean:
  - 모든 것을 만드시고
  - 모든 것을 지으신 분
  lexicon: facere
  rationale: fecit는 단순한 ‘만들다’보다 창조적 행위의 뉘앙스가 있어, 성경적 관용에 따라 ‘지으시다’로 옮겼습니다.
- source_word: scrutatur absconsa in absconsis
  english_pob_choice: searches out hidden things in hidden places
  chosen_korean: 숨은 곳에 숨은 것들을 살피시는 분이시며
  alternatives_korean:
  - 숨겨진 것들을 숨겨진 곳에서 찾아내시는 분이시며
  - 숨은 것들을 샅샅이 살피시는 분이시며
  lexicon: scrutari / absconsa / absconsis
  rationale: 중복된 ‘숨은/숨겨진’ 구조를 살려 탐색의 강도를 드러내되, 한국어에서는 자연스럽게 ‘숨은 곳에 숨은 것들’로 중첩 이미지를 유지했습니다.
- source_word: adinuentionem uestram
  english_pob_choice: your devising
  chosen_korean: 여러분의 꾀를
  alternatives_korean:
  - 여러분의 궁리
  - 여러분의 계획
  lexicon: adinventio
  rationale: 단수형 adinuentionem은 ‘devising’에 해당하므로 복수화하지 않고, 악의적 궁리·책략의 뉘앙스를 지닌 ‘꾀’로 간결하게 옮겼습니다.
theological_decisions:
- issue: 하나님을 지칭하는 문맥에서의 인칭 처리
  chosen_reading: 직설적 서술이므로 ‘그분은’으로 옮겨 하나님에 대한 존칭을 유지하되, 과도한 경어화는 피했습니다.
  alternative_readings:
  - 하나님께서는
  - 그는
  rationale: 본문은 하나님을 제3인칭으로 서술하므로 한국어에서는 자연스러운 존칭 서술이 적절합니다. 다만 본문이 경고문맥이므로 지나친 경어는 의미를 약화시킬 수 있습니다.
  doctrine_reference: divine address and reverent narration
