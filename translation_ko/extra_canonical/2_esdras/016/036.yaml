id: 2ES.16.36
reference: 2 Esdras 16:36
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite uero ista et cognoscite ea, serui domini. Ecce uerbum domini, excipite eum, ne discredatis de quibus dicit
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/036.yaml
  text: But hear these things and know them, slaves of the Lord. Behold, the word of the Lord; receive it; do not disbelieve the things he speaks.
translation:
  language: ko
  text: 주님의 종들아, 이것들을 듣고 아십시오. 보십시오, 주님의 말씀입니다. 그분을 받아들이십시오[a]. 그분이 말씀하시는 것들을 믿지 않는 일이 없도록 하십시오.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어는 ‘그분을’(eum, 남성 단수)이라고 합니다. 바로 앞의 ‘말씀’(verbum)은 라틴어에서 중성이므로, 이 대명사가 인격화된 말씀을 가리키는지 또는 다른 남성 지시 대상을 가리키는지는 본문만으로 확정하기 어렵습니다.
    reason: 원문의 성 불일치와 지시 대상의 불확실성을 보존하면서, 본문에서 남성 단수 대명사를 평준화하지 않기 위함입니다.
lexical_decisions:
- source_word: Audite ... et cognoscite ea
  english_pob_choice: hear these things ... know them
  chosen_korean: 이 일들을 들으십시오. 그리고 그것들을 아십시오.
  alternatives_korean:
  - 이것들을 들으십시오. 그리고 알아두십시오.
  - 이 일들을 들으시고 이해하십시오.
  lexicon: audire / cognoscere
  rationale: audite는 단순 청취보다 권고적 요청이므로 ‘들으십시오’로, cognoscite는 ‘이해하다’보다 지식의 획득을 드러내는 ‘아십시오’로 옮겼습니다.
- source_word: serui domini
  english_pob_choice: slaves of the Lord
  chosen_korean: 주님의 종들
  alternatives_korean:
  - 주님의 노예들
  - 주님의 종으로 섬기는 이들
  lexicon: seruus
  rationale: 문맥상 직접적인 호칭이고, POB의 ‘slaves’ 선택을 한국어에서 그대로 옮기면 현대 독자에게 과도하게 충격적일 수 있어, 호칭 기능을 살리되 본문 내 긴장을 최소화하는 ‘종들’을 택했습니다.
- source_word: excipite eum
  english_pob_choice: receive it
  chosen_korean: 그것을 받으십시오
  alternatives_korean:
  - 그것을 받아들이십시오
  - 그분을 받으십시오
  lexicon: excipere
  rationale: 라틴어 대명사 eum는 앞의 ‘verbum domini’(주님의 말씀)를 가리키므로, 대상은 인격적 ‘그분’이 아니라 ‘그것’으로 처리하는 것이 문맥에 맞습니다.
- source_word: ne discredatis de quibus dicit
  english_pob_choice: do not disbelieve the things he speaks
  chosen_korean: 그분이 말씀하시는 것들에 대해 믿지 않지 마십시오
  alternatives_korean:
  - 그분이 말씀하시는 것들을 의심하지 마십시오
  - 그분이 말씀하시는 내용들을 믿지 마십시오
  lexicon: discredere / dicere
  rationale: 원문은 ‘말하는 것들’과 그 내용에 대한 불신을 금하는 구조이므로, 단순한 의심보다 ‘믿지 않다’의 중첩 부정을 살려 경고의 강도를 유지했습니다.
theological_decisions:
- issue: serui domini의 한국어 대응이 POB의 'slaves' 정책과 충돌할 수 있음
  chosen_reading: 본문은 호칭 기능을 우선해 ‘주님의 종들’로 옮기되, 원문의 종속성·소속성 강도를 약화시키지 않도록 문맥 전체에서 명령형의 엄중함을 유지했습니다.
  alternative_readings:
  - 주님의 노예들
  - 주님의 종들아
  rationale: 이 외경 본문은 교회용 용어보다 직접 호명과 권고가 핵심이어서, 독자 수용성과 원문 호칭성을 함께 고려한 절충이 필요합니다.
  doctrine_reference: source-grounded lexical policy
