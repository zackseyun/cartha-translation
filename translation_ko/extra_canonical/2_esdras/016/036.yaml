  naturalness: ‘그분이 말씀하시는 것들에 대해 믿지 않지 마십시오’는 현대 표준어 합쇼체로 자연스럽지 않습니다. ‘그분이 말씀하시는 것들을 믿지 않는 일이 없도록 하십시오’로 고치면 금지/경계의 뜻을 자연스럽게 보존합니다.
