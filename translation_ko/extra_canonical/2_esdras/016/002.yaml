lexical_decisions:
- source_word: dolete
  english_pob_choice: Mourn
  chosen_korean: 슬퍼하십시오
  alternatives_korean:
  - 애도하십시오
  - 통곡하십시오
  lexicon: doleo / lamentor
  rationale: 라틴어 dolete는 단순한 감정보다 애도와 비탄의 행위를 가리키므로, 합쇼체 명령으로 자연스럽게 옮기기 위해 ‘슬퍼하십시오’를 선택했습니다.
- source_word: eos
  english_pob_choice: them
  chosen_korean: 그들을
  alternatives_korean:
  - 그 사람들을
  - 그것들을
  lexicon: eos
  rationale: 대상 대명사 eos는 직접적인 3인칭 복수 목적격이므로, 문맥상 경고받는 대상이 되는 사람들을 가리키는 ‘그들을’이 가장 자연스럽습니다.
- source_word: contritio uestra
  english_pob_choice: your destruction
  chosen_korean: 여러분의 멸망
  alternatives_korean:
  - 여러분의 파멸
  - 여러분의 붕괴
  lexicon: contritio
  rationale: POB의 수정된 영어가 보여주듯 contritio는 이 예언적·묵시적 문맥에서 ‘부서짐’보다 ‘멸망/파멸’의 의미가 강하므로, 현대 한국어에서도 선명한 재앙적 어감을 지닌 ‘멸망’을 택했습니다.
theological_decisions:
- issue: 예언적 경고의 직접성
  chosen_reading: 명령형과 이유절을 그대로 살려, 다가오는 심판을 애도하라는 긴박한 경고로 읽었습니다.
  alternative_readings:
  - 부드러운 권면으로 완화하는 읽기
  - 단순한 슬픔의 묘사로 읽기
  rationale: 본문은 위로보다 임박한 재난 선포에 초점이 있으므로, 명령문과 ‘가까이 왔다’는 진술을 약화하지 않는 것이 문맥상 적절합니다.
  doctrine_reference: apocalyptic warning / prophetic judgment
