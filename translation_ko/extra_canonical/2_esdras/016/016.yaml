revisions:
- from: 땅의 기초가 무너질 때까지입니다. 강한 활잡이가 쏜 화살이 되돌아오지 않듯이, 땅 위에 보내진 재앙들도 되돌아오지 않을 것입니다.[a]
  to: 땅의 기초를 삼켜 버릴 때까지입니다. 힘센 궁수가 쏜 화살이 되돌아오지 않듯이, 땅 위에 보내진 재앙들도 되돌아오지 않을 것입니다.[a]
  rationale: consumat의 타동 구문을 ‘땅의 기초를 삼켜 버리다’로 바로잡아 원문의 목적어 관계를 보존했습니다. mala는 문맥상 ‘재앙들’로 유지하되, 각주에서 가능한 어휘 범위를 밝혀 과도한 교리적 한정을 피했습니다. 나머지 비유와 비가역성의 표현은 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:18Z'
review_pass:
  verdict: revise
  source_fidelity: 첫 문장의 consumat는 ‘땅의 기초가 무너지다’가 아니라 (앞 문맥의 재앙/불 등이) ‘땅의 기초를 소멸시키다, 삼켜 버리다’라는 타동적 표현입니다. 따라서 목적어와 행위의 방향을 보존해야 합니다. 화살의 비유와 땅에 보내진 mala가 돌아오지 않는다는 진술은 적절합니다.
  naturalness: ‘강한 활잡이’보다 현대 표준어의 ‘힘센 궁수’가 더 자연스럽고 문체에도 맞습니다. ‘삼켜 버릴 때까지’는 종말론적 문맥에서 consumat의 완료·파괴 의미를 자연스럽게 전달합니다.
  terminology: mala는 이 문맥에서 도덕적 악 자체보다 지상에 임한 해로운 재난/심판을 가리킬 수 있으므로 ‘재앙들’은 가능한 번역입니다. 다만 이를 본문에서 교리적으로 한정하지 않고 각주에서 어휘의 범위를 밝혀 두는 것이 적절합니다.
