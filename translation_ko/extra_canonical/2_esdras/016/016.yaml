source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: donec consumat fundamenta terrae. Quemadmodum non redit sagitta missa a sagittario ualido, sic non reuertentur mala quae
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/016.yaml
  text: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
translation:
  language: ko
  text: 땅의 기초를 삼켜 버릴 때까지입니다. 힘센 궁수가 쏜 화살이 되돌아오지 않듯이, 땅 위에 보내진 재앙들도 되돌아오지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 mala는 ‘악한 것들’ 또는 ‘재앙들’을 뜻할 수 있습니다. 여기서는 땅 위에 보내진 것이라는 문맥에 따라 ‘재앙들’로 옮겼습니다.
    reason: lexical_note
lexical_decisions:
- source_word: donec consumat fundamenta terrae
  english_pob_choice: As an arrow shot by a strong archer does not return, so the evils that have been sent upon the earth will not return.
  chosen_korean: 땅의 기초가 무너질 때까지
  alternatives_korean:
  - 땅의 기초가 소진될 때까지
  - 땅의 기초가 끝장날 때까지
  - 땅의 기초가 사라질 때까지
  lexicon: fundamenta / terrae
  rationale: 라틴어 문구는 직역하면 ‘땅의 기초’가 끝나는 시점을 가리키므로, 한국어도 원문의 종말적 경계를 살려 간결하게 옮겼습니다.
- source_word: sagitta missa a sagittario ualido
  english_pob_choice: As an arrow shot by a strong archer does not return
  chosen_korean: 강한 활잡이가 쏜 화살이 되돌아오지 않듯이
  alternatives_korean:
  - 힘센 궁수가 쏜 화살이 되돌아오지 않듯이
  - 강한 궁수가 쏜 화살이 돌아오지 않듯이
  lexicon: sagittario ualido
  rationale: ualido는 단순히 ‘강한’의 뜻이므로, 한국어도 능력을 강조하는 평이한 표현으로 살렸습니다. ‘활잡이’는 사수의 기능을 드러내는 자연스러운 현대어입니다.
- source_word: mala
  english_pob_choice: the evils
  chosen_korean: 재앙들
  alternatives_korean:
  - 악들
  - 악한 일들
  - 재난들
  lexicon: mala
  rationale: 문맥상 지상에 ‘보내진’ 것들로서 단순 도덕악보다 재난적 심판을 가리키므로, POB의 해석을 따라 ‘재앙들’로 옮겼습니다.
theological_decisions:
- issue: 지상에 보내진 재앙의 비가역성
  chosen_reading: 땅 위에 보내진 재앙들도 되돌아오지 않을 것입니다.
  alternative_readings:
  - 땅에 내린 악들도 되돌아오지 않을 것입니다.
  - 땅에 보내진 재난들도 돌아오지 않을 것입니다.
  rationale: POB가 ‘evils’보다 심판적 재난의 뉘앙스를 택한 점을 따르되, 원문의 ‘보내다’와 ‘되돌아오지 않다’의 불가역성을 분명히 드러냈습니다.
  doctrine_reference: 종말 심판의 확정성과 철회 불가능성
