  yaml_path: translation/extra_canonical/2_esdras/016/048.yaml
  text: And those who conduct business do so for plunder[a], as long as they adorn themselves;
  footnotes:
  - marker: a
    text: Or 'And those who conduct business conduct it for plunder;'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 장사하는 자들은, 자신들을 치장하는 동안에 약탈을 위해 장사합니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “장사하는 자들은 장사를 약탈을 위해 합니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: Et qui negociantur
  english_pob_choice: And those who conduct business
  chosen_korean: 그리고 장사하는 자들은
  alternatives_korean:
  - 그리고 거래하는 자들은
  - 그리고 상업에 종사하는 자들은
  lexicon: negociantur → 장사하다/거래하다
  rationale: 라틴어 동사는 단순한 생업 행위보다 이익을 노린 상거래를 가리키므로, 자연스럽고 간결한 현대어로 ‘장사하는 자들’을 택했습니다.
- source_word: in rapina
  english_pob_choice: for plunder
  chosen_korean: 약탈을 위해
  alternatives_korean:
  - 노략질을 위해
  - 전리품을 위해
  - 빼앗기 위해
  lexicon: rapina → 약탈
  rationale: 본문은 거래의 목적이 ‘약탈’임을 말하므로, 결과를 약하게 만드는 일반적 표현보다 직접적인 ‘약탈’을 유지했습니다.
- source_word: quamdiu exornant
  english_pob_choice: as long as they adorn themselves
  chosen_korean: 자신들을 치장하는 동안에
  alternatives_korean:
  - 그들이 자신들을 꾸미는 동안에
  - 스스로를 장식하는 동안에
  lexicon: exornare → 치장하다
  rationale: exornant는 외적 치장과 과시를 뜻하므로, 단순한 ‘꾸미다’보다 문맥의 허영을 드러내는 ‘치장하다’가 더 적절합니다.
theological_decisions:
- issue: 상행위와 약탈의 연결
  chosen_reading: 장사 자체가 무고한 경제활동이 아니라, 자기 치장과 결합될 때 약탈로 드러난다는 경고로 옮겼습니다.
  alternative_readings:
  - 장사하는 자들이 남을 약탈하기 위해 장사한다는 뜻으로 좁혀 읽는 방식
  - 장사하는 자들이 약탈당한다는 수동적 뜻으로 완화하는 방식
  rationale: 라틴어 구조는 상행위를 약탈과 연결하면서도, 단정적 설명을 과도하게 덧붙이지 않습니다. 그래서 원문의 강한 비판을 유지하되 불필요한 해석을 덧씌우지 않았습니다.
  doctrine_reference: 본문 맥락(2 Esdras 16:41–48)
