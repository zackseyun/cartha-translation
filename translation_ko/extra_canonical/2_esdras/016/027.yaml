id: 2ES.16.27
reference: 2 Esdras 16:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et uva tradet se ad vindemiam, et quis adligabit eam? erit enim etlocis desertio multa.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/027.yaml
  text: The grape will yield itself for the vintage[a], and who will gather it? For there will be great desolation in places.
  footnotes:
  - marker: a
    text: Or 'will ripen, and who will tread it? For there will be great desolation in the places.'.
    reason: previous_rendering
translation:
  language: ko
  text: 포도는 포도 수확을 위해 스스로 자신을 내어줄 것이며, 누가 그것을 거두겠습니까? 여러 곳에 큰 황폐가 있을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uva
  english_pob_choice: The grape
  chosen_korean: 포도
  alternatives_korean:
  - 포도나무의 열매
  - 포도송이
  lexicon: uva
  rationale: latin uva는 여기서 단수 집합명사처럼 쓰여 포도 자체를 가리키므로, 한국어에서는 자연스러운 ‘포도’로 옮겼습니다.
- source_word: tradet se ad vindemiam
  english_pob_choice: will yield itself for the vintage
  chosen_korean: 포도 수확을 위해 스스로 내어주고
  alternatives_korean:
  - 포도 수확에 자신을 맡기고
  - 포도 수확을 위해 스스로 내어주며
  lexicon: tradere se + ad vindemiam
  rationale: ‘자신을 내어주다’라는 인격화된 동작을 살리되, 한국어에서는 ‘수확을 위해 스스로 내어주다’로 자연스럽게 표현했습니다.
- source_word: adligabit
  english_pob_choice: will gather it
  chosen_korean: 거두겠습니까
  alternatives_korean:
  - 묶겠습니까
  - 모으겠습니까
  lexicon: alligo
  rationale: 개정된 영어 POB는 *adligo*를 ‘gather’로 이해하므로, 결속의 이미지를 과도하게 풀지 않고 곡식을 거두는 물음으로 자연스럽게 옮겼습니다.
- source_word: et locis
  english_pob_choice: in places
  chosen_korean: 그곳들에는
  alternatives_korean:
  - 여러 곳에는
  - 그 장소들에는
  lexicon: locis
  rationale: 복수 여격/처격의 locis를 직역하면 어색하므로, 문맥상 황폐가 덮일 ‘그곳들’로 옮겨 장소성은 유지하고 한국어 어순을 살렸습니다.
theological_decisions:
- issue: 포도에 대한 인격화 표현 유지
  chosen_reading: 포도가 ‘스스로 내어주고’ ‘거두어질’ 대상으로 묘사되도록 살렸습니다.
  alternative_readings:
  - 포도는 익을 것이며, 누가 그것을 따겠습니까?
  - 포도는 수확될 것이며, 누가 그것을 모으겠습니까?
  rationale: 원문은 단순한 농사 묘사보다 포도가 스스로 수확에 내맡겨지는 듯한 인격화를 사용하므로, 그 수사적 긴장을 보존했습니다.
  doctrine_reference: 문학적 인격화 보존
