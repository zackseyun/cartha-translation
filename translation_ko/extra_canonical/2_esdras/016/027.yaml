    issue: ‘그곳들에는’이 locis를 특정된 장소들처럼 표현합니다.
    rationale: locis는 여기서 ‘여러 곳에/in places’라는 부정적 복수 처격으로 이해하는 것이 자연스럽습니다.
  - severity: low
    issue: 각주가 번역문을 실질적으로 반복합니다.
    rationale: 독자에게 추가적인 원문 정보, 대안 번역, 또는 해석상 쟁점을 제공하지 않습니다.
