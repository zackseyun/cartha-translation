  text: He placed pools upon the mountain tops[a], to send forth rivers from the heights so that the earth might drink.
  footnotes:
  - marker: a
    text: Or 'to water the earth.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 산꼭대기에 웅덩이들을 두어, 높은 곳에서 강물들이 흘러나오게 하셨으니, 땅이 마시게 하시려는 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “땅을 적시게 하시려는 것입니다.”
    reason: alternative_reading
lexical_decisions:
- source_word: et super uertices montium lacus
  english_pob_choice: He placed pools upon the mountain tops
  chosen_korean: 산꼭대기에 웅덩이들을 두어
  alternatives_korean:
  - 산봉우리 위에 못들을 두어
  - 산꼭대기에 연못들을 두어
  lexicon: lacus → 웅덩이/못/연못; super uertices montium → 산꼭대기에
  rationale: 라틴어 lacus는 반드시 장엄한 '연못'만을 뜻하지 않고 물이 고인 곳을 넓게 가리킬 수 있어, 본문 이미지에 맞게 ‘웅덩이들’로 옮겼습니다. ‘산꼭대기’는 uertices montium의 직접적인 뜻을 반영합니다.
- source_word: ad emittendum flumina ab eminenti
  english_pob_choice: to send forth rivers from the heights
  chosen_korean: 높은 곳에서 강물들이 흘러나오게 하시려는
  alternatives_korean:
  - 높은 데서 강들이 흘러가게 하시려는
  - 높은 곳에서 강들을 내보내시려는
  lexicon: emittendum flumina → 강물들이 흘러나오게 하다; ab eminenti → 높은 곳에서
  rationale: emittendum은 ‘내보내다’보다 흐름의 시작을 살리는 ‘흘러나오게 하다’가 자연스럽고, flumina는 복수의 강물 흐름을 나타내므로 복수로 처리했습니다.
- source_word: ut potaret terra
  english_pob_choice: so that the earth might drink
  chosen_korean: 땅이 마시게 하시려는 것입니다
  alternatives_korean:
  - 땅이 마시도록 하시려는 것입니다
  - 땅이 물을 마시게 하시려는 것입니다
  lexicon: terra → 땅; potaret → 마시다
  rationale: 수정된 라틴어 해석대로 주어는 ‘땅’이며, 목적절의 의인화된 이미지를 살려 ‘땅이 마시게 하시려는’으로 옮겼습니다.
theological_decisions:
- issue: 의인화된 창조 질서의 묘사
  chosen_reading: 하나님이 산꼭대기와 높은 곳에 물을 두셔서 땅이 마시게 하시는 창조적 섭리를 보여 주는 시적 표현으로 읽었습니다.
  alternative_readings:
  - 단순한 지리적 진술로 읽기
  - 비유를 약화시켜 ‘땅에 물을 대시려는’ 뜻으로 완화해 읽기
  rationale: 라틴어 목적절 ut potaret terra는 땅을 마시는 주체로 세우는 의인화를 분명히 하므로, 이를 보존하는 번역이 본문의 시적 힘과 의미를 가장 잘 드러냅니다.
  doctrine_reference: 창조주 하나님의 섭리와 시적 의인화
