  naturalness: 초안의 ‘흘러나오게 하셨으니, 땅이 마시게 하시려는 것입니다’는 문장 종결과 목적 표현이 다소 부자연스럽고, ‘마시게 하시려는’의 목적 관계가 모호합니다. 수정문은 현대 한국어 합쇼체로 자연스럽게 연결합니다.
  terminology: ‘못들’은 lacus의 물이 고인 곳이라는 뜻을 자연스럽게 전달하며, ‘강들’은 flumina의 복수를 보존합니다. ‘땅이 마시게’는 terra가 potaret의 주어인 점을 유지합니다.
