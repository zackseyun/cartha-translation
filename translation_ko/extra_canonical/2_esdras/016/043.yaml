id: 2ES.16.43
reference: 2 Esdras 16:43
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et qui emit, quasi qui perditurus; Qui mercatur, quasi qui
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/043.yaml
  text: and the one who buys, like one who is about to lose; and the one who trades, like one who will gain no profit;
translation:
  language: ko
  text: 그리고 사는 사람은 곧 잃게 될 사람 같고, 장사하는 사람은 아무 이익도 얻지 못할 사람 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: emit
  english_pob_choice: buys
  chosen_korean: 사는 사람
  alternatives_korean:
  - 사는 이
  - 구매하는 사람
  - 사들이는 사람
  lexicon: 매매 동사
  rationale: 라틴어 emit은 ‘팔다’가 아니라 ‘사다’의 뜻이므로, 구매 행위를 드러내는 ‘사는 사람’으로 옮겼습니다.
- source_word: perditurus
  english_pob_choice: about to lose
  chosen_korean: 잃을 사람
  alternatives_korean:
  - 잃게 될 사람
  - 곧 잃게 될 사람
  - 잃어버릴 사람
  lexicon: 예정/임박 표현
  rationale: perditurus는 ‘곧 ~하게 될’의 미래 분사이므로, 임박한 상실을 자연스럽게 나타내는 ‘잃을 사람’으로 옮겼습니다.
- source_word: Qui mercatur
  english_pob_choice: the one who trades
  chosen_korean: 장사하는 사람
  alternatives_korean:
  - 거래하는 사람
  - 무역하는 사람
  - 매매하는 사람
  lexicon: 상거래 동사
  rationale: mercari는 단순 교환보다 상업적 거래를 가리키므로, 한국어에서 가장 넓고 자연스러운 ‘장사하는 사람’으로 처리했습니다.
- source_word: quasi
  english_pob_choice: like
  chosen_korean: 같습니다
  alternatives_korean:
  - 처럼 보입니다
  - 같은 듯합니다
  - 마치 ~같습니다
  lexicon: 비교 접속 표현
  rationale: 반복되는 quasi의 비교 의미를 문장 흐름에 맞게 ‘같습니다’로 간결하게 살렸습니다.
theological_decisions:
- issue: 종말적 경고의 문체
  chosen_reading: 재앙 앞에서 모든 경제 활동이 무력해지는 상황을 비유적으로 서술하는 경고의 어조를 유지했습니다.
  alternative_readings:
  - 단순한 세상 허무를 말하는 일반 진술로 완화하기
  - 경제 윤리의 교훈문으로 해석하기
  rationale: 문맥상 예언적 재난 선언의 일부이므로, 상업 행위의 무상함을 직접적으로 드러내는 표현을 유지하는 편이 원문의 긴장감을 보존합니다.
  doctrine_reference: apocrypha_context
