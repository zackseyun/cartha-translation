review_pass:
  verdict: revise
  source_fidelity: 첫 절의 emit은 ‘사는 사람’으로 적절히 옮겼으나, perditurus의 임박성을 나타내는 ‘이제’는 현대 한국어에서 다소 어색하고 뜻이 약합니다. ‘곧 잃게 될’이 미래분사의 뜻을 더 정확히 드러냅니다. 둘째 절은 제공된 라틴어가 절 중간에서 끝나지만, 영어 POB 감사본의 ‘will gain no profit’에 따라 번역할 수 있습니다.
  naturalness: ‘사는 사람은 이제 잃을 사람 같고’보다 ‘사는 사람은 곧 잃게 될 사람 같고’가 자연스럽고 분명합니다. ‘장사하는 사람’은 자연스러운 표현이며 문맥상 상거래를 잘 나타냅니다.
  terminology: ‘사다’와 ‘장사하다’의 구별을 유지했습니다. ‘아무 이익도 얻지 못할’은 lucrum/이득 없음이라는 영어 감사본의 의미를 자연스럽게 재현합니다.
