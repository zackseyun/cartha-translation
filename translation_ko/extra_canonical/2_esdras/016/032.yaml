id: 2ES.16.32
reference: 2 Esdras 16:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: sic remanebunt in diebus illis tres velquattuor ab scrutantibus domos eorum in romphea.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/032.yaml
  text: So in those days, three or four will remain from those who search their houses with the sword.
translation:
  language: ko
  text: 그러므로 그날들에는, 칼로 그들의 집을 뒤지는 자들 가운데서 세 명이나 네 명만 남게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sic remanebunt
  english_pob_choice: So ... will remain
  chosen_korean: 그러므로 ... 남게 될 것입니다
  alternatives_korean:
  - 그리하여 ... 남을 것입니다
  - 그래서 ... 남게 될 것입니다
  lexicon: remanere
  rationale: 라틴어 remanebunt는 단순히 ‘남다’의 의미이므로, 영어 POB의 의미를 유지하면서도 한국어에서는 자연스러운 미래형 ‘남게 될 것입니다’로 옮겼습니다.
- source_word: in diebus illis
  english_pob_choice: in those days
  chosen_korean: 그날들에는
  alternatives_korean:
  - 그때에는
  - 그날에는
  lexicon: dies
  rationale: 복수형 ‘그날들’의 시간적 범위를 살리되, 한국어에서는 관용적으로 부사격 처리한 ‘그날들에는’이 가장 자연스럽습니다.
- source_word: tres vel quattuor
  english_pob_choice: three or four
  chosen_korean: 세 명이나 네 명
  alternatives_korean:
  - 셋이나 넷
  - 세 사람이나 네 사람
  lexicon: tres / quattuor
  rationale: 남은 인원을 가리키는 문맥이므로 한국어에서 사람 수를 나타내는 ‘명’을 붙여 자연스럽게 했습니다.
- source_word: ab scrutantibus domos eorum
  english_pob_choice: from those who search their houses
  chosen_korean: 그들의 집을 뒤지는 자들 가운데서
  alternatives_korean:
  - 그들의 집을 수색하는 자들로부터
  - 그들의 집을 살피는 자들 가운데서
  lexicon: scrutari + domus
  rationale: scrutantibus는 ‘샅샅이 뒤지다/수색하다’의 뜻이므로 ‘뒤지는’이 가장 직접적이며, ab는 이 문맥에서 분리의 의미로 ‘가운데서’가 자연스럽습니다.
- source_word: in romphea
  english_pob_choice: with the sword
  chosen_korean: 칼로
  alternatives_korean:
  - 검으로
  - 칼을 들고
  lexicon: romphaea
  rationale: romphaea는 장검/큰 칼 계열의 무기이지만 한국어에서는 독자가 이해하기 쉬운 ‘칼’로 옮기되, 도구격 조사로 수단을 분명히 했습니다.
theological_decisions:
- issue: 본문의 폭력적 심판 이미지 표현
  chosen_reading: 문맥의 재난·심판 진술을 완화하지 않고 그대로 ‘칼로 ... 뒤지는 자들’로 옮겼습니다.
  alternative_readings:
  - 더 부드러운 ‘찾는 자들’
  - 심판성을 약화한 ‘수색하는 자들’
  rationale: 라틴어 scrutantibus와 in romphea가 함께 만드는 폭력적 심판 이미지를 보존해야 하므로, 의미를 순화하지 않았습니다.
  doctrine_reference: 예언적/묵시적 심판 언어의 직설적 보존
- issue: 남는 사람의 수량 표현
  chosen_reading: ‘세 명이나 네 명’으로 소수 생존을 드러냈습니다.
  alternative_readings:
  - ‘셋이나 넷’
  - ‘겨우 세네 명’
  rationale: 라틴어의 간결한 수량 대조를 유지하되, ‘겨우’를 덧붙여 해석을 과도하게 밀어붙이지 않았습니다.
  doctrine_reference: 본문 의미의 절제된 전달
