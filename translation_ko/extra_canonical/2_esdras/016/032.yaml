  source_fidelity: 라틴어의 미래형 remanebunt, 시간 표현 in diebus illis, 수량 tres vel quattuor, 그리고 칼을 동반한 집 수색이라는 폭력적 이미지는 초안에 대체로 보존되어 있습니다. 다만 sic는 문맥상 단순한 귀결·비교의 연결어로서 ‘그러므로’보다 ‘그리하여’가 더 중립적입니다. 또한 ‘만’은 원문에 명시되지 않은 한정 뉘앙스를 더합니다.
