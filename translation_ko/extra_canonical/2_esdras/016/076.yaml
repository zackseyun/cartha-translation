  language: ko
  text: 두려워하지도 말고 머뭇거리지도 마십시오. 하나님은 여러분의 인도자이십니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ne timeatis
  english_pob_choice: Do not fear
  chosen_korean: 두려워하지도 말고
  alternatives_korean:
  - 두려워하지 마십시오
  - 무서워하지 마십시오
  lexicon: timeo
  rationale: 직접적인 금지 표현을 살리되, 뒤의 동사와 병렬을 이루도록 ‘~하지도 말고’로 자연스럽게 정리했습니다.
- source_word: nec haesitemini
  english_pob_choice: or hesitate
  chosen_korean: 머뭇거리지도 마십시오
  alternatives_korean:
  - 주저하지도 마십시오
  - 의심하지도 마십시오
  lexicon: haesito
  rationale: 영문 POB가 수정한 ‘hesitate’를 반영해, 라틴어의 망설임·주춤거림을 드러내는 ‘머뭇거리다’를 택했습니다.
- source_word: Deus dux vester est
  english_pob_choice: God is your guide
  chosen_korean: 하나님께서 여러분의 인도자가 되십니다
  alternatives_korean:
  - 하나님은 여러분의 인도자이십니다
  - 하나님께서 여러분을 인도하십니다
  lexicon: dux
  rationale: dux의 핵심은 단순한 안내자가 아니라 앞서 이끄는 지도자이므로, 관계적·역할적 의미를 살려 ‘인도자가 되십니다’로 옮겼습니다.
theological_decisions:
- issue: ‘dux’의 의미 범위
  chosen_reading: 하나님께서 단순히 정보를 주는 안내자가 아니라, 앞장서서 백성을 이끄는 인도자이십니다.
  alternative_readings:
  - 하나님이 여러분의 길잡이이십니다
  - 하나님이 여러분을 인도하십니다
  rationale: 문맥상 위로의 선언으로, 하나님의 주도적 인도와 보호를 함께 드러내는 표현이 가장 적절합니다.
  doctrine_reference: 하나님의 섭리와 인도
