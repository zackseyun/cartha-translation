  source_fidelity: 라틴어 ne timeatis nec haesitemini의 두 병렬 금지는 ‘두려워하지도 말고 머뭇거리지도 마십시오’로 충실히 반영되었습니다. dux vester est는 ‘여러분의 인도자’로 적절히 옮겼습니다. 다만 est는 하나님이 현재 ‘인도자이시다’라는 정체성의 선언인데, ‘인도자가 되십니다’는 ‘되다’의 변화·장래 뉘앙스를 불필요하게 더할 수 있습니다.
