    issue: ‘인도자가 되십니다’의 ‘되다’
    rationale: 라틴어 est는 ‘~이다’이며, ‘되십니다’는 변화 또는 미래적 성취로 읽힐 여지를 만듭니다. 계사문으로 옮기는 것이 더 정확합니다.
  revised_text: 두려워하지도 말고 머뭇거리지도 마십시오. 하나님은 여러분의 인도자이십니다.
