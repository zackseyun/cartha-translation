  terminology: ‘하나님’, ‘여러분’, ‘인도자’는 현대 한국어 성서 문맥과 원문의 의미에 적합합니다. ‘인도자’는 dux의 앞서 이끄는 의미를 무리 없이 전달합니다.
  issues:
