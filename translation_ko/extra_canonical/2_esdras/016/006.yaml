  text: numquid recutiet aliquis leonem esurientem in silva aut numquid extinguet ignem, cum stramen incensum fuerit?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/006.yaml
  text: Can anyone beat back a hungry lion in the forest, or quench a fire when straw has been set ablaze?
translation:
  language: ko
  text: 굶주린 사자를 숲속에서 누가 막아낼 수 있겠습니까? 또는 짚이 불타오르고 있을 때 누가 그 불을 끌 수 있겠습니까?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: numquid recutiet aliquis leonem esurientem
  english_pob_choice: Can anyone beat back a hungry lion
  chosen_korean: 굶주린 사자를 숲속에서 누가 막아낼 수 있겠습니까?
  alternatives_korean:
  - 누가 굶주린 사자를 숲속에서 물리칠 수 있겠습니까?
  - 누가 굶주린 사자를 숲속에서 되돌려세울 수 있겠습니까?
  lexicon: recutiet / beat back
  rationale: 라틴어 recutiet는 단순한 ‘치다’보다 밀어내어 물러서게 하는 뉘앙스를 가지므로, 문맥상 ‘막아내다’가 가장 자연스럽고 source-direct합니다.
- source_word: leonem esurientem in silva
  english_pob_choice: a hungry lion in the forest
  chosen_korean: 굶주린 사자를 숲속에서
  alternatives_korean:
  - 배고픈 사자를 숲에서
  - 굶주린 사자를 숲에서
  lexicon: leonem esurientem / in silva
  rationale: esurientem은 강한 기근 상태를 가리키므로 ‘굶주린’이 적절합니다. in silva는 단순 배경 위치이므로 ‘숲속에서’로 옮겨 장면성을 살렸습니다.
- source_word: extinguet ignem
  english_pob_choice: quench a fire
  chosen_korean: 그 불을 끌 수 있겠습니까?
  alternatives_korean:
  - 불을 끌 수 있겠습니까?
  - 그 불길을 끌 수 있겠습니까?
  lexicon: extinguet / quench
  rationale: extinguere는 불을 ‘끄다’라는 직접 대응이 가능하므로, 한국어에서도 가장 간결하고 정확한 ‘끌다’를 선택했습니다.
- source_word: cum stramen incensum fuerit
  english_pob_choice: when straw has been set ablaze
  chosen_korean: 짚이 불타오르고 있을 때
  alternatives_korean:
  - 짚에 불이 붙었을 때
  - 짚이 이미 타오르기 시작했을 때
  lexicon: stramen incensum fuerit
  rationale: incensum fuerit는 이미 불붙어 점화된 상태를 나타내므로, 진행 상태를 드러내는 ‘불타오르고 있을 때’가 문맥의 긴급성을 잘 살립니다.
