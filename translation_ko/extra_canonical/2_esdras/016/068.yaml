id: 2ES.16.68
reference: 2 Esdras 16:68
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: angelis eius? Ecce iudex deus, timete eum; desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno, et deus educabit uos et liberabit de omni tribulatione.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/068.yaml
  text: Behold[a], God is judge; fear him. Cease from your sins, and forget your iniquities, never to practice them again; and God will lead you out and deliver you from every tribulation.
  footnotes:
  - marker: a
    text: Or 'to practice them no more forever'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오[a], 하나님은 심판자이십니다. 그분을 두려워하십시오. 여러분의 죄를 그치고, 여러분의 불의를 잊어버려 다시는 그것들을 행하지 마십시오. 그리고 하나님께서 여러분을 이끌어 내시고 모든 환난에서 건져 주실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것들을 영원히 더는 행하지 마십시오.’
    reason: previous_rendering
lexical_decisions:
- source_word: Ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 보십시오
  lexicon: 라틴어 ecce
  rationale: 호소력을 가진 감탄사로서 문맥상 청중을 직접 주의를 환기하는 표현이므로, 현대 합쇼체에서 자연스러운 「보십시오」를 택했습니다.
- source_word: iudex deus
  english_pob_choice: God is judge
  chosen_korean: 하나님은 심판자이십니다
  alternatives_korean:
  - 하나님은 재판장이십니다
  - 하나님은 심판하시는 분이십니다
  lexicon: 라틴어 iudex / deus
  rationale: iudex는 단순한 ‘판결자’보다 인격적·권위적 직함인 ‘심판자’가 더 직접적이며, 문장의 주어-보어 구조를 살려 합쇼체로 옮겼습니다.
- source_word: timete eum
  english_pob_choice: fear him
  chosen_korean: 그분을 두려워하십시오
  alternatives_korean:
  - 그분을 경외하십시오
  - 그분을 두려워하라
  lexicon: 라틴어 timete
  rationale: 경외의 뉘앙스가 있지만, 원문의 명령은 심판자 하나님 앞에서의 두려움을 포함하므로 이를 약화하지 않는 「두려워하십시오」를 기본으로 했습니다.
- source_word: desinite a peccatis uestris et obliuiscimini iniquitates uestras iam agere eas sempiterno
  english_pob_choice: Cease from your sins, and forget your iniquities, never to practice them again
  chosen_korean: 여러분의 죄에서 떠나고, 여러분의 불의를 잊어버려 다시는 그것들을 행하지 마십시오
  alternatives_korean:
  - 여러분의 죄를 그치고, 여러분의 불의를 잊어버려 영원히 다시 행하지 마십시오
  - 여러분의 죄를 멈추고, 여러분의 불의를 잊어버려 다시는 행하지 마십시오
  lexicon: 라틴어 desinite / peccatis / obliuiscimini / iniquitates / agere
  rationale: desinite a peccatis는 단순 중단보다 ‘떠나고’가 회개적 방향성을 살리며, obliuiscimini... agere eas는 ‘잊어버려 다시는 그것들을 행하지 마십시오’로 자연스럽게 풀어 라틴어의 부정 명령과 지속 금지를 반영했습니다.
- source_word: tribulatione
  english_pob_choice: tribulation
  chosen_korean: 환난
  alternatives_korean:
  - 고난
  - 환란
  lexicon: 라틴어 tribulatio
  rationale: POB의 ‘tribulation’에 해당하는 성서적 상용어로서 ‘환난’이 가장 직접적이고 문맥에도 잘 맞습니다.
theological_decisions:
- issue: 하나님의 심판과 구원의 병치
  chosen_reading: 하나님을 두려워하라는 경고와, 하나님께서 이끌어 내시고 건져 주신다는 약속을 한 절 안에서 함께 살렸습니다.
  alternative_readings:
  - 경고를 완화해 위로 중심으로 옮기는 읽기
  - 심판을 강조해 구원 약속을 약화시키는 읽기
  rationale: 본문은 심판자의 두려움과 구원의 인도/해방을 동시에 제시하므로, 둘 중 하나를 희석하지 않고 병렬 구조를 유지해야 합니다.
  doctrine_reference: 하나님의 공의와 자비의 동시성
- issue: 죄에서의 단절과 재행 금지
  chosen_reading: ‘다시는 그것들을 행하지 마십시오’로 재행의 금지를 명확히 드러냈습니다.
  alternative_readings:
  - ‘영원히 다시 행하지 마십시오’
  - ‘다시는 죄를 짓지 마십시오’
  rationale: 라틴어의 sempiterno와 이전 POB의 ‘never to practice them again’ 취지를 반영하되, 한국어에서는 중복을 줄여 명령의 강도를 자연스럽게 전달했습니다.
  doctrine_reference: 회개와 성화의 실천적 요구
