  source_fidelity: 라틴어의 명령들(desinite, obliuiscimini, timete)과 하나님의 구원 약속(educabit, liberabit)은 대체로 충실히 옮겼습니다. 다만 et deus는 단순 접속으로 이어지는데, 초안의 ‘그러면’은 조건·결과 관계를 명시적으로 강화합니다. 또한 sempiterno의 지속성을 본문과 각주에서 더 명료하게 보존하는 편이 좋습니다.
