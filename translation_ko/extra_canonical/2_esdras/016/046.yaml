  text: they marry, as though widowed; therefore those who labor labor without cause
translation:
  language: ko
  text: 그들은 마치 과부가 된 것처럼 결혼합니다. 그러므로 수고하는 자들은 아무 까닭 없이 수고합니다.
  philosophy: formal
lexical_decisions:
- source_word: nubunt
  english_pob_choice: they marry
  chosen_korean: 그들은 … 결혼합니다
  alternatives_korean:
  - 그들은 시집갑니다
  - 그들은 장가갑니다
  lexicon: nubunt → 결혼하다
  rationale: 라틴어 동사는 혼인 행위를 일반적으로 가리키므로, 성별을 특정하지 않는 현대 한국어의 중립 표현인 ‘결혼합니다’를 택했습니다.
- source_word: sic quasi uidui
  english_pob_choice: as though widowed
  chosen_korean: 마치 과부가 된 것처럼
  alternatives_korean:
  - 마치 홀아비가 된 것처럼
  - 마치 배우자를 잃은 것처럼
  lexicon: uidui → 과부
  rationale: 영문 POB의 의미를 따라 ‘widowed’의 상태를 직역하되, 라틴어 uidui의 여성형 어감을 반영해 ‘과부’로 옮겼습니다.
- source_word: sine causa
  english_pob_choice: without cause
  chosen_korean: 아무 까닭 없이
  alternatives_korean:
  - 헛되이
  - 이유 없이
  lexicon: sine causa → 원인 없이 / 까닭 없이
  rationale: 본문의 무의미함보다 ‘까닭 없음’의 직접적 의미가 더 분명하므로, POB의 ‘without cause’를 자연스럽게 살려 옮겼습니다.
theological_decisions:
- issue: 첫 절의 비교·풍자적 진술을 어떻게 살릴 것인가
  chosen_reading: 결혼 자체를 비난하기보다, 종말적 혼란 속에서 혼인 행위가 마치 상실 상태인 것처럼 역설적으로 보인다는 표현으로 유지했습니다.
  alternative_readings:
  - 그들은 결혼하지만 아무 의미가 없습니다
  - 그들은 과부처럼 살면서 결혼합니다
  rationale: 라틴어의 ‘sic quasi’는 단순 진술이 아니라 비유적 대비를 형성하므로, 그 긴장을 약화시키지 않고 그대로 드러내는 번역이 필요합니다.
  doctrine_reference: 문학적 수사와 종말론적 경고의 보존
