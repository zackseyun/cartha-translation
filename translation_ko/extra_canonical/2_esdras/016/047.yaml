review_pass:
  verdict: revise
  source_fidelity: 라틴어 첫머리의 ‘laborant’(그들이 고난을 겪다/수고하다)가 번역문에서 누락되었습니다. 또한 ‘domus evertent’는 건물을 대상으로 하므로 한국어에서는 ‘집을 허물고’가 자연스럽고 의미도 정확합니다. ‘in captivitate et fame’는 ‘포로 됨’보다 ‘포로 생활’로 옮기는 편이 현대 한국어에서 명료합니다.
  naturalness: 현 번역은 ‘왜냐하면’으로 시작하여 앞 절 없이 독립적으로 읽힐 때 어색하며, 첫 문장 뒤의 ‘그들은’이 누구를 가리키는지 흐립니다. 원문의 문장 진행을 따라 짧은 문장들로 정리하면 자연스럽습니다.
  terminology: ‘소출’은 여기서 농작물 수확물을 뜻하는 ‘fructus’에 적합합니다. ‘재물’, ‘사로잡아 가다’, ‘포로 생활’, ‘기근’은 문맥과 격식에 맞습니다. ‘허물고’는 ‘evertent’의 건물 파괴 의미를 관용적으로 전달합니다.
  issues:
