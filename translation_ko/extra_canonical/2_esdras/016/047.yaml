id: 2ES.16.47
reference: 2 Esdras 16:47
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborant; Fructus enim illorum alienigenae metent et substantiam illorum rapient et domus euertent et filios eorum captiuabunt, quia in captiuitate et fame generant natos suos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/047.yaml
  text: for foreigners will reap their fruits and plunder their goods and overturn their houses and take their children captive[a], because in captivity and famine they beget their children.
  footnotes:
  - marker: a
    text: Or 'overturn their houses'.
    reason: previous_rendering
translation:
  language: ko
  text: 왜냐하면 이방인들이 그들의 열매를 거두고 그들의 재물을 빼앗으며 그들의 집을 뒤엎고 그들의 자녀를 사로잡아 갈 것이기 때문입니다. 그들은 포로 됨과 기근 속에서 자기 자녀를 낳기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 집을 뒤엎고’.
    reason: previous_rendering
lexical_decisions:
- source_word: Fructus
  english_pob_choice: their fruits
  chosen_korean: 그들의 열매
  alternatives_korean:
  - 그들의 소출
  - 그들의 소산
  lexicon: fructus
  rationale: 농작물의 수확물이라는 기본 뜻을 살려 ‘열매’로 옮기되, 재산 전반을 가리키는 문맥의 흐름을 해치지 않도록 자연스럽게 유지했습니다.
- source_word: substantiam
  english_pob_choice: their goods
  chosen_korean: 그들의 재물
  alternatives_korean:
  - 그들의 소유
  - 그들의 재산
  lexicon: substantia
  rationale: 단순한 물건보다 소유 전체를 포괄하는 의미로 읽혀, 재산 약탈의 맥락을 드러내는 ‘재물’이 적절합니다.
- source_word: domus euertent
  english_pob_choice: overturn their houses
  chosen_korean: 그들의 집을 뒤엎고
  alternatives_korean:
  - 그들의 집을 엎고
  - 그들의 집을 파괴하고
  lexicon: domus / everto
  rationale: 라틴어 everto의 핵심 이미지를 살려 ‘뒤엎다’로 직역성을 유지했습니다. 건물을 대상으로 한 동사이므로 단순한 ‘파괴하다’보다 원문 감각이 더 분명합니다.
- source_word: captiuabunt
  english_pob_choice: take their children captive
  chosen_korean: 그들의 자녀를 사로잡아 갈 것이기
  alternatives_korean:
  - 그들의 자녀를 포로로 삼을 것이기
  - 그들의 자녀를 끌고 갈 것이기
  lexicon: captivare
  rationale: 단순한 납치보다 전쟁 포로화의 의미가 있어 ‘사로잡아 가다’로 옮겼습니다. 이는 ‘포로 됨’이라는 뒤의 표현과도 맞물립니다.
theological_decisions:
- issue: 포로 됨과 기근 속에서의 출산이라는 비극적 원인-결과 구조
  chosen_reading: 자녀들이 태어나는 환경 자체가 이미 포로 상태와 기근으로 규정된 절망의 상황임을 그대로 드러냈습니다.
  alternative_readings:
  - ‘포로와 기근 중에도 자녀를 낳는다’로 완화
  - ‘포로와 기근 때문에 자녀를 낳는다’로 인과를 약화
  rationale: 본문은 출산의 윤리평가가 아니라 재난의 가혹함을 서술하므로, 비극적 배경을 약화하지 않고 직설적으로 유지했습니다.
  doctrine_reference: 예언적 재난 경고의 서술 방식
