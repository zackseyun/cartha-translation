  to: 그들은 고난을 겪습니다. 이는 이방인들이 그들의 소출을 거두고, 그들의 재물을 빼앗으며, 그들의 집을 허물고, 그들의 자녀를 사로잡아 갈 것이기 때문입니다. 그들이 포로 생활과 기근 가운데서 자녀를 낳기 때문입니다.
  rationale: 누락된 ‘laborant’를 ‘그들은 고난을 겪습니다’로 복원했습니다. ‘fructus’는 농업적 의미를 분명히 하는 ‘소출’로, 건물을 대상으로 한 ‘evertent’는 자연스러운 한국어인 ‘집을 허물고’로 옮겼습니다. 중복되고 무의미한 각주는 삭제했습니다. 마지막 이유절은 원문의 반복된 ‘quia’를 보존하여 별도 문장으로 유지했습니다.
