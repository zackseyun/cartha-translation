  - severity: medium
    issue: 문두 ‘왜냐하면’의 선행 내용 부재
    rationale: 독립 제시된 절에서 접속사가 앞 문맥 없이 시작되어 한국어 문장으로 부자연스럽습니다. 누락된 ‘laborant’를 복원하고 ‘이는’으로 인과를 이어야 합니다.
