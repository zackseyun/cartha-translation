  yaml_path: translation/extra_canonical/2_esdras/016/039.yaml
  text: As when a pregnant woman in the ninth month[a], when the hour of her delivery draws near, two or three hours beforehand labor pains surround her womb, and when the child comes forth from the womb, it does not delay a single moment,
  footnotes:
  - marker: a
    text: Or 'for two or three hours'.
    reason: previous_rendering
translation:
  language: ko
  text: 임신한 여인이 아홉째 달에 있을 때, 해산할 시간이 가까워지면 두세 시간 전에 진통이 그 배를 둘러싸고, 아이가 태에서 나오면 한순간도 지체하지 않는 것과 같습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘두세 시간 전에’라는 뜻입니다.
    reason: textual_variant
lexical_decisions:
- source_word: praegnans ... in nono mense
  english_pob_choice: a pregnant woman in the ninth month
  chosen_korean: 임신한 여인이 아홉째 달에 있을 때
  alternatives_korean:
  - 아홉째 달의 임신한 여인이
  - 아홉 달째인 임신부가
  lexicon: pregnant woman / temporal expression
  rationale: 라틴어의 상태와 시점을 자연스럽게 살리기 위해 ‘임신한 여인’과 ‘아홉째 달에 있을 때’로 나누어 옮겼습니다.
- source_word: ante horas duas vel tres
  english_pob_choice: two or three hours beforehand
  chosen_korean: 두세 시간 전에
  alternatives_korean:
  - 두세 시간 동안
  - 두세 시간쯤 먼저
  lexicon: temporal phrase
  rationale: 개정된 영어 주해가 지적하듯 이 표현은 지속 시간이 아니라 출산 직전의 선행 시점을 뜻하므로 ‘전에’로 옮겼습니다.
- source_word: gementes dolores circum ventrem eius
  english_pob_choice: labor pains surround her womb
  chosen_korean: 진통이 그 배를 둘러싸고
  alternatives_korean:
  - 산고가 그 태를 에워싸고
  - 해산의 고통이 그 배를 감싸고
  lexicon: labor pains / womb
  rationale: ‘dolores’는 일반적 ‘고통’보다 출산 맥락의 ‘진통’이 정확하고, ‘ventrem’은 문자적으로 ‘배’이지만 문맥상 몸속의 태를 포함한 임신부의 배를 가리킨다고 보아 ‘그 배’로 옮겼습니다.
- source_word: prodiente infante de ventre
  english_pob_choice: when the child comes forth from the womb
  chosen_korean: 아이가 태에서 나오면
  alternatives_korean:
  - 아기가 배에서 나오면
  - 갓난아이가 태에서 나오면
  lexicon: womb / child
  rationale: ‘infante’는 태어난 아이를 가리키므로 ‘아기’보다 중립적인 ‘아이’를 택했고, ‘de ventre’는 출생의 출처를 분명히 하는 ‘태에서’로 옮겼습니다.
- source_word: non tardabit uno puncto
  english_pob_choice: it does not delay a single moment
  chosen_korean: 한순간도 지체하지 않는 것과 같습니다
  alternatives_korean:
  - 한 점도 늦추지 않는 것과 같습니다
  - 한순간도 머뭇거리지 않는 것과 같습니다
  lexicon: delay a single moment
  rationale: 라틴어의 강한 부정을 살려 ‘한순간도 지체하지 않는다’로 직역에 가깝게 옮겼고, 앞의 비유문 전체를 마무리하는 자연스러운 한국어 비교구문으로 정리했습니다.
theological_decisions:
- issue: 출산 비유의 기능
  chosen_reading: 이 절은 종말의 급박함을 임신과 진통의 필연적 진행에 비유하며, 사건의 불가피성과 즉시성을 강조합니다.
  alternative_readings:
  - 단순히 자연 현상의 묘사로만 읽는 해석
  - 과장된 수사로 약화시키는 해석
  rationale: 원문은 시간 경과와 출산의 즉각성을 대비시켜 결말의 긴박함을 강하게 드러내므로, 그 예시적 힘을 약화하지 않도록 옮겼습니다.
