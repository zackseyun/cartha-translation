    issue: ‘임신한 여인이 아홉째 달에 있을 때’는 다소 부자연스럽고 시간 관계가 흐립니다.
    rationale: in nono mense는 임신의 아홉째 달이라는 상태를 나타내므로 ‘임신 아홉째 달이 되어’가 현대 한국어에서 더 명확합니다.
  - severity: low
