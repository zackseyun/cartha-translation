  source_fidelity: 라틴어의 시간 표현 ante horas duas vel tres는 진통의 지속 시간이라기보다 해산 시각에 앞선 시점, 곧 ‘두세 시간 전에’를 뜻합니다. 또한 prodiente infante de ventre 및 non tardabit uno puncto는 아이가 태에서 나올 때 한순간도 지체하지 않는다는 뜻으로 충실히 반영되어야 합니다.
  naturalness: 초안은 대체로 자연스럽지만 ‘아홉째 달에 있을 때’와 ‘진통이 그 배를 둘러싸고’는 현대 표준 한국어에서 다소 직역투입니다. ‘임신 아홉째 달이 되어’ 및 ‘진통이 그 여자의 배를 에워싸다가’가 뜻과 문장 흐름을 더 자연스럽게 살립니다.
  terminology: ‘해산’, ‘진통’, ‘태’는 문맥에 맞는 적절한 표현입니다. 다만 원문의 ventrem은 여기서 임신부의 배를 가리키므로, 진통의 대상에는 ‘태’보다 ‘배’가 적절하고, 아이가 나오는 출처에는 ‘태’가 자연스럽습니다.
  issues:
