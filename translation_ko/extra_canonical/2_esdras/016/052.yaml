  lexicon: ecce
  rationale: 경고와 주목을 촉구하는 감탄문으로 이해하여, 현대 합쇼체에서 직접적인 주의 환기 표현인 ‘보십시오’로 옮겼습니다.
- source_word: adhuc pusillum
