  - 불의
  - 악행
  lexicon: iniquitas
  rationale: 단순한 도덕적 악보다 하나님 뜻에 대한 위반과 왜곡의 성격이 강해, 본문 흐름에 맞게 ‘불법’으로 옮겼습니다.
- source_word: a terra
  english_pob_choice: from the earth
