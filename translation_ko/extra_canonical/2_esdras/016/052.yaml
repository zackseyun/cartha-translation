  alternatives_korean:
  - 아직 잠시만 더
  - 아직 조금 남아
  - 아주 조금 더
  lexicon: adhuc + pusillum
  rationale: 남은 시간이 매우 짧다는 뉘앙스를 살리되, 한국어에서 자연스러운 시간 표현으로 다듬었습니다.
- source_word: iniquitas
