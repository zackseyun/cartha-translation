id: 2ES.16.35
reference: 2 Esdras 16:35
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: earum non habentes adiutorium. Sponsi earum in bello consumentur, et uiri earum in fame exterentur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/035.yaml
  text: Not having help, their bridegrooms will be consumed in war, and their husbands will perish by famine.
translation:
  language: ko
  text: 그 여자들은 도움이 없는 채, 그들의 신랑들은 전쟁으로 죽임을 당하고 그들의 남편들은 기근으로 죽을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: earum non habentes adiutorium
  english_pob_choice: Not having help
  chosen_korean: 도움을 받지 못한 채
  alternatives_korean:
  - 도움이 없어서
  - 도움 없이
  lexicon: adiutorium → 도움
  rationale: 라틴어의 부정 분사구문을 자연스러운 현대 한국어로 옮기되, 앞선 상황이 원인임을 드러내기 위해 ‘-받지 못한 채’를 택했습니다.
- source_word: Sponsi earum
  english_pob_choice: their bridegrooms
  chosen_korean: 그들의 신랑들은
  alternatives_korean:
  - 그들의 약혼자들은
  - 그들의 신랑들
  lexicon: sponsus → 신랑
  rationale: sponsi는 결혼 관계의 남성 당사자를 가리키므로, 전통적 교회어보다 직역성이 높은 ‘신랑들’을 유지했습니다.
- source_word: in bello consumentur
  english_pob_choice: will be consumed in war
  chosen_korean: 전쟁에서 소멸되고
  alternatives_korean:
  - 전쟁에서 멸망하고
  - 전쟁에서 소모되고
  lexicon: consumere → 소멸시키다/소멸되다
  rationale: consumere의 ‘완전히 사라지게 됨’이라는 강한 소진·파괴 의미를 살려 ‘소멸되다’로 옮겼습니다.
- source_word: uiri earum in fame exterentur
  english_pob_choice: their husbands will perish by famine
  chosen_korean: 그들의 남편들은 기근으로 죽을 것입니다
  alternatives_korean:
  - 그들의 남편들은 기근으로 멸망할 것입니다
  - 그들의 남편들은 기아로 죽을 것입니다
  lexicon: fames / exterere → 기근 / 죽다
  rationale: fame는 ‘기근’이 가장 직접적이며, exterere는 여기서 생존 종결을 가리키므로 과도한 의역 없이 ‘죽다’로 자연스럽게 처리했습니다.
theological_decisions:
- issue: 전쟁과 기근이 초래하는 공동체적 붕괴의 서술을 어떻게 보존할지
  chosen_reading: 개별 남성들의 죽음이 아니라, 신랑과 남편이 각각 전쟁과 기근으로 무너지는 집단적 재난의 병렬 구조를 유지했습니다.
  alternative_readings:
  - 문맥을 완화하여 일반적 어려움으로 옮김
  - 두 절망의 원인을 하나로 합침
  rationale: 라틴 원문은 두 집단과 두 재난을 병렬로 제시하므로, 예언적 경고의 강도를 약화하지 않도록 구조를 그대로 살렸습니다.
  doctrine_reference: 예언적 심판 묘사의 병렬성과 강화된 수사
