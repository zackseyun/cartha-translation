  text: He will thunder, and who will not tremble? The Lord will threaten, and who
translation:
  language: ko
  text: 그가 천둥치시면, 누가 떨지 않겠습니까? 주께서 위협하시면, 누가…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 원문이 여기서 끊기므로, 한국어도 의도적으로 미완결로 남겼습니다.
    reason: source_note
lexical_decisions:
- source_word: tonabit
  english_pob_choice: He will thunder
  chosen_korean: 그가 천둥치시면
  alternatives_korean:
  - 그가 우레를 치시면
  - 그가 천둥을 울리시면
  lexicon: tonare
  rationale: 라틴어 동사 tonabit의 직접 의미를 살려, 하나님의 위엄 있는 발성과 심판적 현현을 자연스러운 현대 한국어로 옮겼습니다.
- source_word: horrebit
  english_pob_choice: tremble
  chosen_korean: 떨지 않겠습니까
  alternatives_korean:
  - 두려워하지 않겠습니까
  - 오싹해하지 않겠습니까
  lexicon: horrescere
  rationale: horrebit는 단순한 감정이 아니라 몸이 반응하는 두려움과 떨림을 가리키므로, '떨다'를 택했습니다.
- source_word: Dominus
  english_pob_choice: The Lord
  chosen_korean: 주께서
  alternatives_korean:
  - 주님께서
  - 주께서
  lexicon: Dominus
  rationale: 라틴어 Dominus를 본문에서는 예배적 호칭의 무게를 유지하면서도 합쇼체에 맞게 '주께서'로 옮겼습니다.
- source_word: comminabitur
  english_pob_choice: will threaten
  chosen_korean: 위협하시면
  alternatives_korean:
  - 경고하시면
  - 으르시면
  lexicon: comminari
  rationale: comminabitur는 단순 경고보다 강한 위협·엄포의 뉘앙스가 있어, 본문 긴장감을 유지하는 '위협하다'를 사용했습니다.
theological_decisions:
- issue: 본문이 의도적으로 불완전하게 끝나는 형태
  chosen_reading: 마지막 절을 한국어에서도 미완결로 남겨, 원문의 단절과 긴장감을 보존했습니다.
  alternative_readings:
  - 문맥을 보충해 완결형으로 다듬기
  - 생략 부호 없이 자연스럽게 마무리하기
  rationale: 주어진 라틴어와 영어 POB 수정 이력 모두 이 절이 미완결임을 보여 주므로, 완결시켜 의미를 덧씌우지 않았습니다.
  doctrine_reference: textual fidelity / source transparency
