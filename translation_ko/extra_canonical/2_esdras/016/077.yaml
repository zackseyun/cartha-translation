id: 2ES.16.77
reference: 2 Esdras 16:77
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: quoniam deus dux uester est. Et qui seruatis mandata et praecepta mea, dicit dominus deus, ne praeponderent uos
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/077.yaml
  text: For God is your guide. And you who keep my commandments and my ordinances, says the Lord God, do not let your sins weigh you down, nor let your iniquities prevail over you.
translation:
  language: ko
  text: 하나님은 너희의 인도자이십니다.[a] 내 계명과 내 규례를 지키는 너희에게 주 하나님께서 말씀하십니다. 너희 죄가 너희를 짓누르지 못하게 하고, 너희 불의가 너희를 거슬러 일어서지 못하게 하십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 dux는 단순한 ‘안내자’보다 앞에서 이끄는 지도자라는 뉘앙스를 지닙니다.
    reason: source_note
  - marker: b
    text: 첫 동사 praeponderent는 문자적으로 무게로 눌러 압도한다는 뜻입니다. 이어지는 표현은 불의가 사람들을 향해 스스로 높아지거나 맞서 일어나는 이미지를 나타냅니다.
    reason: source_note
lexical_decisions:
- source_word: deus dux uester est
  english_pob_choice: For God is your guide.
  chosen_korean: 하나님은 너희의 인도자이십니다.
  alternatives_korean:
  - 하나님은 너희를 이끄시는 분이십니다.
  - 하나님은 너희의 길잡이이십니다.
  lexicon: 하나님 / 인도자
  rationale: dux는 단순한 안내자보다 ‘앞에서 이끄는 지도자’의 뜻이 강하므로, 현대 한국어에서 그 기능을 가장 직접적으로 드러내는 ‘인도자’로 옮겼습니다.
- source_word: mandata et praecepta mea
  english_pob_choice: my commandments and my ordinances
  chosen_korean: 내 명령과 내 법규
  alternatives_korean:
  - 내 계명과 내 규례
  - 내 명령과 내 율례
  lexicon: 명령 / 법규
  rationale: mandata와 praecepta의 병렬을 유지하되, 둘 다 법적·권위적 요구를 가리키므로 종교적 관용어를 무리하게 덧씌우지 않고 ‘명령’과 ‘법규’로 구분했습니다.
- source_word: ne praeponderent uos
  english_pob_choice: do not let your sins weigh you down, nor let your iniquities prevail over you
  chosen_korean: 너희 죄가 너희를 짓눌러 넘어지게 하지 말고, 너희 불의가 너희를 지배하지 못하게 하십시오.
  alternatives_korean:
  - 너희 죄가 너희 위에 무거워지지 않게 하십시오.
  - 너희 죄악이 너희를 압도하지 못하게 하십시오.
  lexicon: 짓누르다 / 지배하다
  rationale: praeponderent는 문자적으로 ‘더 무겁게 누르다’의 힘을 살려 ‘짓눌러 넘어지게 하다’로 풀었고, 영어 POB의 두 번째 절충인 ‘prevail over you’는 ‘지배하다’로 옮겨 의미 관계를 분명히 했습니다.
theological_decisions:
- issue: 주 하나님(dominus deus)의 호칭과 직접 명령형의 연결
  chosen_reading: ‘주 하나님이 말씀하십니다’로 도입해 이어지는 금지 명령을 하나님의 직접 발화로 처리했습니다.
  alternative_readings:
  - ‘주 하나님께서 말씀하십니다’
  - 직접 인용부를 더 길게 열어 ‘말씀하시기를’로 처리
  rationale: 라틴 원문의 dicit dominus deus는 예언적 서술 표지이므로, 현대 한국어에서 자연스럽고도 권위를 유지하는 서술형 도입을 택했습니다.
  doctrine_reference: 예언적 화행 표지와 직접계시의 문체 유지
