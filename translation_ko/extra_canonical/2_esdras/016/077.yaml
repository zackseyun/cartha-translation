revisions:
- from: 하나님은 너희의 인도자이십니다. 또 내 명령과 내 법규를 지키는 너희에게 주 하나님이 말씀하십니다. 너희 죄가 너희를 짓눌러 넘어지게 하지 말고, 너희 불의가 너희를 지배하지 못하게 하십시오.[a][b]
  to: 하나님은 너희의 인도자이십니다.[a] 내 계명과 내 규례를 지키는 너희에게 주 하나님께서 말씀하십니다. 너희 죄가 너희를 짓누르지 못하게 하고, 너희 불의가 너희를 거슬러 일어서지 못하게 하십시오.[b]
  rationale: 원문이 가진 두 비유를 보존하기 위해 ‘넘어지게 하다’라는 추가 결과와 ‘지배하다’라는 일반화를 제거했습니다. 또한 명령·교훈의 병렬은 한국어 성서 문맥에 자연스러운 ‘계명과 규례’로 다듬었습니다. 각주 표지는 해당 어휘·비유가 나오는 위치에 유지했습니다.
  reviewer_model: gpt-5.6-terra
