id: 2ES.16.75
reference: 2 Esdras 16:75
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Audite, electi mei, dicit dominus, ecce adsunt dies tribulationis, et de his liberabo uos. Ne timeatis nec haesitemini,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/016/075.yaml
  text: 'Hear, my chosen ones, says the Lord: behold, days of tribulation are here, and from them I will deliver you. Do not fear or hesitate,'
translation:
  language: ko
  text: 들으십시오, 내 택한 이들아. 주님께서 말씀하십니다. 보십시오, 환난의 날들이 와 있습니다. 내가 그 환난의 날들에서 여러분을 건져 내겠습니다. 두려워하지도 말고 망설이지도 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Audite
  english_pob_choice: Hear
  chosen_korean: 들으십시오
  alternatives_korean:
  - 들으라
  - 들어라
  lexicon: audire
  rationale: 직접 호소형 명령을 현대 합쇼체의 공손한 명령으로 옮겼습니다.
- source_word: electi mei
  english_pob_choice: my chosen ones
  chosen_korean: 내 택한 이들아
  alternatives_korean:
  - 내 선택된 이들아
  - 내 택하신 자들아
  lexicon: electus
  rationale: 신분적 선별을 드러내는 '택한'을 살리되, 호칭의 직접성을 유지했습니다.
- source_word: adsunt dies tribulationis
  english_pob_choice: days of tribulation are here
  chosen_korean: 환난의 날들이 이미 와 있습니다
  alternatives_korean:
  - 환난의 날들이 여기 와 있습니다
  - 환난의 날들이 임했습니다
  lexicon: adsum
  rationale: adsunt의 '현재 도래/현존'을 '이미 와 있습니다'로 옮겨 POB 수정의 방향(near → here)을 반영했습니다.
- source_word: liberabo uos
  english_pob_choice: I will deliver you
  chosen_korean: 내가 그들로부터 여러분을 건져내겠습니다
  alternatives_korean:
  - 내가 그들에게서 여러분을 구해내겠습니다
  - 내가 여러분을 구원하겠습니다
  lexicon: libero
  rationale: 문맥상 'from them'을 분명히 살리면서, 단순한 추상적 구원보다 탈출·구출의 동작성을 드러냈습니다.
- source_word: Ne timeatis nec haesitemini
  english_pob_choice: Do not fear or hesitate
  chosen_korean: 두려워하지 말며, 망설이지 마십시오
  alternatives_korean:
  - 두려워하지 말고, 주저하지 마십시오
  - 두려워하지도 말고, 망설이지도 마십시오
  lexicon: timeo / haesito
  rationale: timeatis는 '두려워하다', haesitemini는 '망설이다/주저하다'로 구분해, 두 동사의 병렬 경고를 유지했습니다.
theological_decisions:
- issue: 주님의 직접 발화 안에서의 호칭과 명령체
  chosen_reading: 본문을 주님의 직접 말씀으로 보고, 한국어는 공손한 명령형(들으십시오/마십시오)으로 유지했습니다.
  alternative_readings:
  - 서술체로 완화하여 번역
  - 평서형 권고로 바꾸기
  rationale: 라틴 원문과 영어 POB의 호소형 구조를 보존해야 하며, 한국어 합쇼체는 직접적 권면을 약화하지 않으면서도 문체를 살릴 수 있습니다.
  doctrine_reference: 성경 본문 화행 보존 원칙
- issue: deliver에서 '구원'보다 '건져내다' 선택
  chosen_reading: '''I will deliver you''를 ''여러분을 건져내겠습니다''로 옮겼습니다.'
  alternative_readings:
  - 여러분을 구원하겠습니다
  - 여러분을 구해내겠습니다
  rationale: 여기서는 종말론적/재난 회피적 맥락의 'deliver'가 두드러지므로, 구원의 총괄어보다 위험에서 빼내는 동작을 나타내는 표현이 더 직접적입니다.
  doctrine_reference: 문맥상 구출/해방 어휘
