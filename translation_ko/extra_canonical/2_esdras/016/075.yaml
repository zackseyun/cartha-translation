review_pass:
  verdict: revise
  source_fidelity: 라틴어 adsunt는 환난의 날들이 현재 도래해 있음을 뜻하며, 초안의 ‘이미’는 원문에 없는 완료·선행의 뉘앙스를 더합니다. 또한 de his의 남성 복수 지시사는 바로 앞의 dies(날들)를 받으므로, ‘그들로부터’보다 ‘그 날들에서’로 밝혀 옮기는 편이 지시 대상과 구출의 범위를 보존합니다.
  naturalness: 합쇼체의 직접 호소와 명령은 자연스럽습니다. 다만 재난·시기를 가리키는 dies를 한국어에서 ‘그들’로 받으면 사람을 가리키는 듯해 부자연스럽고 의미가 흐려집니다. ‘두려워하지도 말고 망설이지도 마십시오’는 라틴어의 이중 부정을 매끄럽게 재현합니다.
  terminology: ‘택한 이들’, ‘환난’, ‘주님’, ‘건져 내겠습니다’는 본문의 종교적·재난 맥락과 현대 한국어 문체에 적절합니다. 교파적으로 한정된 해석을 덧붙이지 않았습니다.
  issues:
  - severity: medium
    issue: ‘이미’가 adsunt에 없는 선행·완료의 뉘앙스를 추가합니다.
    rationale: adsunt는 ‘와 있다/현존하다’이지 반드시 ‘이미’가 아닙니다. 한국어에서는 ‘와 있습니다’만으로 현재 도래의 의미를 충분히 나타냅니다.
  - severity: medium
    issue: ‘그들로부터’가 de his의 지시 대상을 사람처럼 들리게 합니다.
    rationale: his는 문법적으로 앞선 dies tribulationis를 가리킵니다. ‘그 환난의 날들에서’로 옮기면 원문의 선행사와 ‘그것들로부터’의 의미를 분명히 보존합니다.
  - severity: low
    issue: 각주 [a]는 번역 선택이나 본문상의 난점을 설명하지 않고 본문을 반복합니다.
    rationale: 원문의 병렬 명령은 번역문 자체에서 충분히 드러나므로 각주는 불필요합니다.
  revised_text: 들으십시오, 내 택한 이들아. 주님께서 말씀하십니다. 보십시오, 환난의 날들이 와 있습니다. 내가 그 환난의 날들에서 여러분을 건져 내겠습니다. 두려워하지도 말고 망설이지도 마십시오.
