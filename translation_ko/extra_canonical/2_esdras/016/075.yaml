  to: 들으십시오, 내 택한 이들아. 주님께서 말씀하십니다. 보십시오, 환난의 날들이 와 있습니다. 내가 그 환난의 날들에서 여러분을 건져 내겠습니다. 두려워하지도 말고 망설이지도 마십시오.
