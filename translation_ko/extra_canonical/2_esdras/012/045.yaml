  naturalness: 현대 한국어에서는 고립된 ‘시온의’가 불완전하므로, 앞 문맥에서 이어지는 소유 관계를 최소한으로 보완해 ‘시온의 일입니다’로 처리하고 다음 이유 절을 자연스럽게 연결했습니다.
  terminology: ‘시온’은 통용 고유명사 표기를 유지했습니다. meliores는 문맥상 인격적 평가로 과도하게 한정하지 않고 ‘더 낫지 않습니다’로 옮겼습니다.
