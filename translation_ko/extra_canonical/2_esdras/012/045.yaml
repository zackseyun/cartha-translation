  text: of Zion. For we are no better than those who died there.” And they wept with a loud voice.
translation:
  language: ko
  text: “시온이여, 그곳에서 죽은 사람들보다 우리가 더 나은 사람들이 아니기 때문입니다.” 그리고 그들은 큰 소리로 울었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sion
  english_pob_choice: of Zion
  chosen_korean: “시온이여,”
  alternatives_korean:
  - “시온에 관하여,”
  - “시온의”
  lexicon: 고유명사
  rationale: 라틴어 Sion은 지명/호칭으로 쓰였으므로 한국어에서는 직접 호격처럼 부르는 형태를 살려 대상을 향한 탄식의 발화를 자연스럽게 드러냈습니다.
- source_word: Nec enim nos meliores sumus eorum, qui ibi mortui sunt
  english_pob_choice: For we are no better than those who died there.
  chosen_korean: 그곳에서 죽은 사람들보다 우리가 더 나은 사람들이 아니기 때문입니다
  alternatives_korean:
  - 그곳에서 죽은 사람들보다 우리가 더 낫지 않기 때문입니다
  - 그곳에서 죽은 자들보다 우리가 더 좋은 사람이 아니기 때문입니다
  lexicon: comparative negation
  rationale: meliores sumus는 단순히 ‘더 낫다’보다 인격적 우월성을 포함할 수 있어, POB의 의미를 살리면서도 현대 한국어에서 자연스러운 ‘더 나은 사람들’로 옮겼습니다.
- source_word: plorauerunt uoce magna
  english_pob_choice: they wept with a loud voice
  chosen_korean: 그들은 큰 소리로 울었습니다
  alternatives_korean:
  - 그들은 큰 음성으로 울었습니다
  - 그들은 크게 통곡했습니다
  lexicon: adverbial phrase
  rationale: uoce magna는 문자적으로 ‘큰 목소리로’이지만, 한국어에서는 통곡의 강도를 드러내는 ‘큰 소리로 울다’가 가장 직접적이고 과장되지 않은 대응입니다.
theological_decisions:
- issue: 탄식의 직설성과 감정 표현
  chosen_reading: 시온을 향한 직접 호칭과 집단적 통곡을 그대로 살려, 사건의 비애를 완화하지 않았습니다.
  alternative_readings:
  - 서술적으로 완만하게 옮겨 감정을 약화시키는 방식
  rationale: 본문은 비교적 짧지만 절망과 애도의 정조가 핵심이므로, 문체를 중립화하기보다 원문의 탄식성을 보존하는 편이 source-direct합니다.
  doctrine_reference: 문학적/신학적 톤 보존 원칙
