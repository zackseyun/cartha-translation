id: 2ES.12.49
reference: 2 Esdras 12:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/049.yaml
  text: And now go, each of you, to his own house, and I will come to you after these days.”
translation:
  language: ko
  text: 이제 여러분은 각자 자기 집으로 가십시오. 그리고 나는 이 날들이 지난 후에 여러분에게 가겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ite
  english_pob_choice: go
  chosen_korean: 돌아가십시오
  alternatives_korean:
  - 가십시오
  - 가서
  lexicon: ire
  rationale: 문맥상 단순 이동보다 각자 자신의 집으로 ‘돌아감’이 자연스럽고, “go”의 핵심 의미를 유지하면서 한국어에서 더 읽기 자연스럽게 표현했습니다.
- source_word: unusquisque vestrum
  english_pob_choice: each of you
  chosen_korean: 각자
  alternatives_korean:
  - 여러분 각자
  - 각 사람마다
  lexicon: unusquisque
  rationale: 개별성을 분명히 하되 문장을 과도하게 늘리지 않도록 ‘각자’로 압축했습니다.
- source_word: in domum suam
  english_pob_choice: to his own house
  chosen_korean: 자기 집으로
  alternatives_korean:
  - 각자 자기 집으로
  - 자기 가정으로
  lexicon: domus
  rationale: domus를 문자적으로 ‘집’으로 옮기되 소유 대명사의 개별 귀속을 ‘자기’로 살렸습니다.
- source_word: post dies istos
  english_pob_choice: after these days
  chosen_korean: 이 날들이 지난 뒤에
  alternatives_korean:
  - 이 날들 후에
  - 이런 날들이 지나고 나서
  lexicon: post + dies
  rationale: 직역형이지만 한국어 어순에 맞게 사건의 시간적 후행을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 화자의 약속 방식
  chosen_reading: ‘나는 … 가겠습니다’로 장래의 직접 약속을 분명히 살렸습니다.
  alternative_readings:
  - ‘가겠다’
  - ‘가게 될 것입니다’
  rationale: 원문의 ueniam은 단순 미래보다 화자의 의도와 약속을 담은 표현이므로, 현대 한국어에서 공손하면서도 확정적인 약속으로 전달했습니다.
  doctrine_reference: 서사적 예언/약속의 직접화
- issue: 직접 화자에게서 나오는 문장 끝의 인용부호 처리
  chosen_reading: 닫는 따옴표를 유지해 바로 앞의 권면과 약속의 발화를 분리했습니다.
  alternative_readings:
  - 인용부호 없이 서술
  - 콜론으로 처리
  rationale: 본문이 직접 발화를 담고 있으므로, 화자 전환과 말끝을 명료하게 보여 주는 것이 좋습니다.
  doctrine_reference: 서사 문체 보존
