    rationale: ite는 ‘가십시오’이며, 라틴어 본문은 청자들이 현재 있는 곳에서 자기 집으로 이동한다는 것만 말합니다. 귀환을 명시하는 ‘돌아가십시오’는 원문에 없는 방향·상태 정보를 보탭니다.
  revised_text: 이제 여러분은 각자 자기 집으로 가십시오. 그리고 나는 이 날들이 지난 후에 여러분에게 가겠습니다.”
