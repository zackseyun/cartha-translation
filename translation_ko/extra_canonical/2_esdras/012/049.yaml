  source_fidelity: 라틴어 ite는 단순히 ‘가라’이며, 본문 자체에는 이전 장소로 ‘돌아가라’는 뜻이 명시되어 있지 않습니다. 따라서 ‘돌아가십시오’는 안전하게 유지하기 어려운 추가 뉘앙스입니다. unusquisque vestrum, in domum suam, post dies istos, ueniam ad vos는 그 밖에는 충실히 반영되었습니다.
  naturalness: ‘여러분은 각자 자기 집으로 가십시오’와 ‘이 날들이 지난 후에’는 현대 표준 한국어의 자연스러운 합쇼체입니다. 직접 발화가 앞 절에서 이어지는 형식으로 보이는 닫는 따옴표도 유지할 수 있습니다.
  terminology: ‘집’은 domum의 적절한 번역이며, ‘여러분’은 복수 청자를 자연스럽게 나타냅니다. 신학적으로 특수한 용어는 없습니다.
