id: 2ES.12.11
reference: 2 Esdras 12:11
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: regnum quartum quod uisum est in uisu Danihelo fratri tuo. Sed non est illi interpretatum quomodo ego nunc tibi interpretor
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/011.yaml
  text: the fourth kingdom that was seen in a vision by Daniel your brother. But it was not interpreted to him as I now interpret it to you,
translation:
  language: ko
  text: 넷째 나라는 그대의 형제 다니엘이 환상에서 본 것입니다. 그러나 그것은 내가 지금 그대에게 해석하는 것처럼 그에게 해석되지 않았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regnum quartum
  english_pob_choice: the fourth kingdom
  chosen_korean: 넷째 나라
  alternatives_korean:
  - 네 번째 왕국
  - 넷째 왕국
  lexicon: regnum → 나라/왕국
  rationale: 라틴어 regnum은 ‘나라’와 ‘왕국’ 모두 가능하지만, POB의 영어가 kingdom을 택했고 현대 한국어에서는 ‘나라’가 더 자연스럽고 무겁지 않게 위계를 전달합니다.
- source_word: uisum est
  english_pob_choice: was seen
  chosen_korean: 보인 것입니다
  alternatives_korean:
  - 보였습니다
  - 환상으로 보였습니다
  lexicon: video/passive construction
  rationale: 수동형의 ‘보이다’ 의미를 살리되, 예언/환상 문맥에 맞게 문장 전체가 매끄럽게 들리도록 ‘보인 것입니다’로 옮겼습니다.
- source_word: in uisu
  english_pob_choice: in a vision
  chosen_korean: 환상 가운데
  alternatives_korean:
  - 환상 속에서
  - 이상 가운데
  lexicon: visus → 환상
  rationale: 이 문맥의 visus는 단순 시각 경험보다 계시적 ‘환상’을 가리키므로 이를 분명히 드러냈습니다.
- source_word: fratri tuo
  english_pob_choice: your brother
  chosen_korean: 당신의 형제
  alternatives_korean:
  - 네 형제
  - 당신 형제
  lexicon: frater → 형제
  rationale: 직접 화법이지만 합쇼체 문맥에 맞춰 ‘당신의 형제’로 옮겨 존대와 혈연 관계를 함께 살렸습니다.
- source_word: interpretor
  english_pob_choice: interpret
  chosen_korean: 해석하는
  alternatives_korean:
  - 풀이하는
  - 뜻을 밝히는
  lexicon: interpreto → 해석하다
  rationale: 예언의 의미를 밝히는 기술적 용례이므로 ‘해석하다’가 가장 직접적입니다.
theological_decisions:
- issue: 같은 꿈/환상 내용의 해석 차이
  chosen_reading: 다니엘에게는 지금 당신에게 하는 것처럼 그렇게 해석되지 않았다고 분명히 말합니다.
  alternative_readings:
  - 다니엘은 해석을 받지 못했다
  - 그에게는 해석이 완전하게 주어지지 않았다
  rationale: 본문은 단순한 정보 부족보다 ‘현재 화자에게 주어지는 더 직접적 해석’의 대비를 말하므로, 해석의 차이를 분명히 유지했습니다.
  doctrine_reference: 본문 주해 및 서사적 대비
