  yaml_path: translation/extra_canonical/2_esdras/012/038.yaml
  text: And you shall teach them to the wise among your people, whose hearts you know are able to comprehend and keep them secret.
translation:
  language: ko
  text: 책에 기록한 것을 숨겨 둔 곳에 놓으십시오. 그리고 그것들을 당신의 백성 가운데 지혜로운 자들에게 가르치십시오. 당신이 그들의 마음이 그것을 받아들일 수 있고 또 비밀로 간직할 수 있다는 것을 아는 자들에게 말입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 끝부분의 sense를 따라, 단순히 ‘이해한다’가 아니라 ‘비밀로 간직한다’는 의미를 함께 살렸습니다.
    reason: source_note
lexical_decisions:
- source_word: docebis
  english_pob_choice: you shall teach
  chosen_korean: 가르치십시오
  alternatives_korean:
  - 가르치리이다
  - 가르치겠습니다
  lexicon: doceo
  rationale: 미래형의 명령적 권고를 현대 합쇼체로 옮기기 위해 '가르치십시오'를 택했습니다.
- source_word: sapientes de populo tuo
  english_pob_choice: the wise among your people
  chosen_korean: 당신의 백성 가운데 지혜로운 자들
  alternatives_korean:
  - 당신의 백성 중 지혜로운 이들
  - 당신 백성의 지혜로운 사람들
  lexicon: sapientes
  rationale: sapientes를 단순한 ‘지식인’이 아니라 분별 있는 사람들로 이해해 '지혜로운 자들'로 옮겼습니다.
- source_word: posse capere
  english_pob_choice: are able to comprehend
  chosen_korean: 받아들일 수 있고
  alternatives_korean:
  - 이해할 수 있고
  - 깨달을 수 있고
  lexicon: capio
  rationale: capere는 여기서 지적 이해만이 아니라 내용을 수용하고 붙드는 뉘앙스를 가지므로, 영어 POB의 'comprehend'보다 조금 더 넓게 '받아들이다'로 옮겼습니다.
- source_word: et ... occultare / keep them secret
  english_pob_choice: and keep them secret
  chosen_korean: 비밀로 간직할 수 있는
  alternatives_korean:
  - 숨겨 둘 수 있는
  - 은밀히 보존할 수 있는
  lexicon: occulto
  rationale: 라틴어의 마지막 목적을 POB 개정판의 취지에 맞게, 단순 보유가 아니라 비밀을 유지하는 의미로 반영했습니다.
theological_decisions:
- issue: 지식의 대상과 책임 있는 비밀 유지의 결합
  chosen_reading: 지혜 있는 이들에게만 전하고, 그 내용은 비밀로 간직하게 하는 것으로 이해했습니다.
  alternative_readings:
  - 공개적 교육으로 이해
  - 단순 보관 지시로 이해
  rationale: 본문은 지식의 전달과 보존을 함께 명령하며, 공동체 내부의 분별과 신중한 비전승을 강조합니다.
  doctrine_reference: 지혜 전승과 계시 보존에 관한 묵시 문학의 문맥
