  verdict: revise
  source_fidelity: 초안은 ‘비밀로 간직하다’라는 결말의 의미를 적절히 반영합니다. 그러나 첫 절은 원문의 명령 ‘(네가 본 것들을) 책에 기록하라’를 ‘책에 기록한 것’이라는 불완전한 관형 구문으로 바꾸어 기록하라는 명령을 누락합니다. 또한 ‘그들의 마음이 … 아는 자들에게 말입니다’는 관계절의 선행사와 문장 종결이 부자연스럽습니다.
  naturalness: 현대 표준 한국어 합쇼체로는 ‘네가 본 것들을 책에 기록하고’ 및 ‘그들의 마음이 … 할 수 있음을 당신이 아는 사람들에게’처럼 명령과 수식 관계를 명료하게 드러내는 편이 자연스럽습니다. 문맥상 신적 화자에게 쓰인 ‘당신’은 유지할 수 있습니다.
  terminology: sapientes는 ‘지혜로운 사람들’, capere는 이 문맥에서 ‘이해하다’, 마지막의 비밀 유지 의미는 ‘비밀로 간직하다’로 옮기는 것이 적절합니다. ea의 반복 대상은 ‘그것들’로 유지했습니다.
  issues:
