  to: 네가 본 것들을 책에 기록하고, 그것들을 숨겨 둔 곳에 두십시오. 또 당신의 백성 가운데 지혜로운 사람들, 곧 그들의 마음이 그것들을 이해하고 비밀로 간직할 수 있음을 당신이 아는 사람들에게 그것들을 가르치십시오.
