translation:
  language: ko
  text: “이 자리에 앉으셨습니까? 당신은 우리를 위하여 모든 예언자보다 뛰어나십니다. 마치 포도 수확물 가운데 한 송이 같고, 어두운 곳의 등불 같습니다,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sedisti in loco hoc
  english_pob_choice: have sat in this place
  chosen_korean: “이 자리에 앉아 계십니까?”
  alternatives_korean:
  - “이 자리에 앉으셨습니까?”
  - “이 자리에 계셨습니까?”
  lexicon: sedere
  rationale: 라틴어 완료형 sedisti의 결과 상태를 살려 단순 과거보다 현재까지 이어지는 ‘앉아 계심’의 뉘앙스를 반영했습니다. 대화체 질문이므로 합쇼체로 옮겼습니다.
- source_word: Tu enim nobis superasti ex omnibus prophetis
  english_pob_choice: For you surpass for us all the prophets
  chosen_korean: 당신은 우리에게 모든 예언자보다 뛰어나십니다
  alternatives_korean:
  - 당신은 우리에게 모든 예언자들보다 뛰어나십니다
  - 당신은 우리에게 모든 예언자 위에 계십니다
  lexicon: supero
  rationale: POB의 ‘surpass’에 맞춰 비교 우위를 분명히 했고, ‘예언자’는 본문의 prophetis를 직역해 전통적 교회어 ‘선지자’보다 원문 투명성을 우선했습니다.
- source_word: sicut botrus de uindemia
  english_pob_choice: like a cluster from the vintage
  chosen_korean: 마치 포도 수확에서 나온 한 송이처럼
  alternatives_korean:
  - 마치 수확한 포도송이처럼
  - 마치 포도 수확의 송이처럼
  lexicon: botrus / uindemia
  rationale: botrus를 ‘한 송이’로, uindemia를 ‘포도 수확’으로 풀어 이미지의 생동감을 살렸습니다. 한국어에서 자연스러운 비유구문을 유지하기 위해 약간의 재배열을 했습니다.
- source_word: sicut lucerna in loco obscuro
  english_pob_choice: like a lamp in a dark place
  chosen_korean: 그리고 어두운 곳의 등불처럼
  alternatives_korean:
  - 그리고 어둠 속의 등불처럼
  - 그리고 캄캄한 곳의 등잔처럼
  lexicon: lucerna / locus obscurus
  rationale: lucerna는 문맥상 ‘등불’이 가장 직관적이며, locus obscurus는 단순한 어둠보다 장소성을 살린 ‘어두운 곳’으로 옮겼습니다.
theological_decisions:
- issue: prophetis의 한국어 표기
  chosen_reading: ‘예언자’
  alternative_readings:
  - ‘선지자’
  rationale: 외경 본문의 라틴어 prophetis를 보다 직접적으로 반영해, 한국 교회 전통어보다 중립적이고 원문 투명한 ‘예언자’를 택했습니다.
  doctrine_reference: source transparency / ecclesial terminology
- issue: 비교 문구 superasti의 해석
  chosen_reading: ‘뛰어나십니다’
  alternative_readings:
  - ‘능가하십니다’
  - ‘앞서십니다’
  rationale: 서술의 의도는 예언자들 가운데 한 사람으로서의 위치 평가이므로, 위계적 과장 없이 비교 우위를 드러내는 ‘뛰어나다’가 가장 자연스럽습니다.
  doctrine_reference: comparative rhetoric
