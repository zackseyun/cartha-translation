translation:
  language: ko
  text: 오른편에 있는 머리 위를 가로지르는 두 작은 날개에 대한 해석은 이렇습니다. 이들은 지극히 높으신 분께서 … 안에서 보존하신 이들입니다[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 라틴어 본문은 conseruauit altissimus in(‘지극히 높으신 분께서 … 안에서 보존하신’)에서 끊기므로, 한국어 번역도 문장을 완결시키지 않았습니다.
    reason: source_note
lexical_decisions:
- source_word: duas subalares
  english_pob_choice: the two little wings
  chosen_korean: 두 작은 날개
  alternatives_korean:
  - 두 어린 날개
  - 두 조그만 날개
  lexicon: subalarēs
  rationale: subalares는 크기가 작은 날개를 가리키므로, 의미를 과장하지 않고 자연스럽게 ‘작은 날개’로 옮겼습니다.
- source_word: treicentes super caput quod est a dextera parte
  english_pob_choice: crossing over to the head that is on the right side
  chosen_korean: 오른편에 있는 머리 위로 교차하는
  alternatives_korean:
  - 오른쪽에 있는 머리 위로 넘어가는
  - 오른편 머리 위를 가로지르는
  lexicon: treicentes / super caput / a dextera parte
  rationale: 동사의 움직임과 위치 관계를 함께 살려, 날개가 오른편 머리 위로 ‘교차하는’ 장면을 한국어 어순에 맞게 표현했습니다.
- source_word: Haec est interpretatio
  english_pob_choice: this is the interpretation
  chosen_korean: 이것이 해석입니다
  alternatives_korean:
  - 이것이 뜻입니다
  - 이것이 풀이입니다
  lexicon: interpretatio
  rationale: 라틴어 interpretatio는 상징 해설의 공식 문구이므로, 문맥상 가장 सीधे한 ‘해석’으로 옮겼습니다.
- source_word: quos conseruauit altissimus
  english_pob_choice: these are the ones whom the Most High has preserved
  chosen_korean: 이들은 지극히 높으신 분께서 보존하신 이들입니다
  alternatives_korean:
  - 이들은 지극히 높으신 분께서 지키신 이들입니다
  - 이들은 지존자께서 보존하신 이들입니다
  lexicon: conseruauit / altissimus
  rationale: conseruauit는 단순한 유지보다 ‘보존하다’가 더 정확하고, altissimus는 고유한 신칭으로 ‘지극히 높으신 분’이 문맥상 자연스럽습니다.
