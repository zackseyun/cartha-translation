lexical_decisions:
- source_word: Haec est interpretatio
  english_pob_choice: This is the interpretation
  chosen_korean: 이것은 …에 대한 해석입니다
  alternatives_korean:
  - 이것은 …의 의미입니다
  - 이것은 …의 풀이입니다
  lexicon: 해석
  rationale: 라틴어 interpretatio는 단순한 설명보다 상징적 환상의 뜻풀이를 가리키므로, POB의 interpretation을 따라 ‘해석’으로 옮겼습니다.
- source_word: xii alarum
  english_pob_choice: the twelve wings
  chosen_korean: 열두 날개
  alternatives_korean:
  - 열두 날개들
  - 열둘의 날개
  lexicon: 날개
  rationale: 수량과 명사를 직역해 상징 요소를 보존했습니다. 한국어에서는 복수 표지를 따로 드러내지 않아도 자연스럽습니다.
- source_word: quas
  english_pob_choice: that you saw
  chosen_korean: 당신이 보신
  alternatives_korean:
  - 보신
  - 당신이 보았던
  lexicon: 보다
  rationale: 직전 문맥에서 선행한 환시를 가리키므로, 과거 시제와 경어를 살려 ‘보신’으로 옮겼습니다.
theological_decisions:
- issue: 해석 문장의 범위
  chosen_reading: 문장 자체를 설명문으로 유지해, 상징 환시의 의미를 직접 제시하는 형식을 살렸습니다.
  alternative_readings:
  - ‘이것은 열두 날개의 해석입니다’처럼 더 축약하는 읽기
  - ‘이것은 당신이 본 열두 날개의 뜻풀이입니다’처럼 풀어 쓰는 읽기
  rationale: 라틴어 원문은 단순한 등식문으로, 추가 설명 없이 해석의 시작을 알립니다. POB도 같은 구조를 유지하므로 한국어도 이를 보존했습니다.
  doctrine_reference: 문맥상의 환시 해석 형식 보존
