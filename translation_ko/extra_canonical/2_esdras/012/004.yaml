source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: scrutas uias altissimi. Ecce adhuc fatigatus sum animo, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/004.yaml
  text: because you search out the ways of the Most High. Behold, I am still weary in my spirit, and
translation:
  language: ko
  text: 이는 당신이 지극히 높으신 분의 길들을 살피고 있기 때문입니다. 보십시오, 저는 아직 제 영 안에서 지쳐 있으며,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘지극히 높으신 분의 길들을 탐구합니다’에 가깝습니다.
    reason: source_note
lexical_decisions:
- source_word: scrutas
  english_pob_choice: you search out
  chosen_korean: 살피고 있습니다
  alternatives_korean:
  - 찾고 있습니다
  - 궁구하고 있습니다
  - 탐색하고 있습니다
  lexicon: scrutari
  rationale: 라틴어 scrutari는 단순한 탐색보다 주의 깊게 더듬어 살피는 뜻이 있어, 한국어에서는 ‘살피다’가 가장 자연스럽고 의미를 잘 드러냅니다.
- source_word: vias altissimi
  english_pob_choice: the ways of the Most High
  chosen_korean: 지극히 높으신 분의 길들
  alternatives_korean:
  - 지극히 높으신 이의 길들
  - 가장 높으신 분의 길들
  - 지극히 높으신 하나님의 길들
  lexicon: via / altissimus
  rationale: altissimi는 신적 호칭으로 ‘지극히 높으신 분’이 자연스럽고, vias는 단순한 길이 아니라 행하시는 방식까지 포함할 수 있어 복수형을 살려 ‘길들’로 옮겼습니다.
- source_word: fatigatus sum animo
  english_pob_choice: I am still weary in my spirit
  chosen_korean: 저는 아직 제 영 안에서 지쳐 있으며
  alternatives_korean:
  - 저는 아직 제 영으로 피곤하며
  - 저는 아직 마음이 지쳐 있으며
  - 저는 아직 영혼이 지쳐 있으며
  lexicon: fatigatus sum / animus
  rationale: animo는 이 문맥에서 ‘영’ 또는 ‘마음’으로 갈릴 수 있으나, 영어 POB의 ‘spirit’과 라틴어의 내적 생명력을 반영해 ‘영 안에서 지쳐’로 옮겼습니다.
theological_decisions:
- issue: 문장이 중간에서 끊기는 미완결 구조
  chosen_reading: 끝을 한국어에서도 연결 어미 ‘-며’로 열어 두어, 원문이 다음 절로 이어지는 미완결 발화를 보존했습니다.
  alternative_readings:
  - 마침표로 닫아 완결문으로 처리
  - 적절한 한국어 종결형으로 매끈하게 정리
  rationale: 라틴어 원문과 영어 POB 모두 뒤에 절이 더 이어질 것을 전제하는 열린 구조이므로, 이를 닫지 않고 그대로 드러내는 편이 원문 충실성에 맞습니다.
  doctrine_reference: textual fidelity / discourse structure
