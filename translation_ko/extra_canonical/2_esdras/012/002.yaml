  source_fidelity: 라틴어의 핵심 순서와 의미는 대체로 반영되어 있습니다. 그러나 `surrexerunt ... erectae sunt ut regnarent`의 두 동작은 한국어에서 더 분명히 분리할 필요가 있으며, `ecce`의 환상 서술 강조도 문맥상 ‘보니’에 흡수하되 반복된 관찰의 흐름을 유지하는 편이 좋습니다. `incendebatur`의 진행상은 ‘불타고 있었습니다’로 명확히 보존합니다.
  naturalness: 초안의 ‘통치하게 세워졌고’는 이해할 수 있으나 현대 한국어로는 다소 부자연스럽습니다. ‘통치하도록 세워졌으며’가 수동 표현과 목적을 더 자연스럽게 연결합니다. 또한 ‘독수리의 온몸’보다 ‘독수리의 온몸 전체’ 또는 ‘독수리의 몸 전체’가 문어적 환상 서술에 더 안정적입니다.
  terminology: ‘통치’, ‘날개’, ‘독수리’는 적절합니다. `tumulti plenum`은 정치적·사회적 격동을 포함하는 표현이므로 ‘소란으로 가득했습니다’보다 ‘혼란으로 가득했습니다’가 현대어에서 더 자연스럽고 의미 범위도 넓습니다.
