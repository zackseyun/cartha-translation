id: 2ES.12.2
reference: 2 Esdras 12:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: aquilam, et uidi Et ecce quod superauerat caput non conparuit. et surrexerunt alae duae quae ad eum transierunt et erectae sunt ut regnarent, et erat regnum eorum exile et tumulti plenum. Et uidi et ecce ipsa non apparesebant, et omne corpus aquilae incendebatur, et expauescebat terra ualde.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/002.yaml
  text: that I looked[a], and behold, the head that had remained did not appear. And the two wings that had gone over to it arose and were set up to reign, and their reign was brief and full of turmoil. And I looked, and behold, they too did not appear, and the whole body of the eagle was burning[b], and the earth was greatly terrified.
  footnotes:
  - marker: a
    text: Or 'And the two wings that had gone over to it rose up to reign,'.
    reason: previous_rendering
  - marker: b
    text: Or 'was burned up'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 보니, 남아 있던 머리는 나타나지 않았습니다. 그리고 그것으로 넘어갔던 두 날개가 일어나서 통치하게 세워졌고, 그들의 통치는 짧고 소란으로 가득했습니다. 내가 다시 보니, 그것들도 나타나지 않았고, 독수리의 온몸은 타고 있었으며, 땅은 크게 두려워했습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그것으로 넘어갔던 두 날개가 일어나 통치하게 되었고’.
    reason: previous_rendering
  - marker: b
    text: 또는 ‘불태워지고 있었다’.
    reason: previous_rendering
lexical_decisions:
- source_word: non conparuit / non apparesebant
  english_pob_choice: did not appear / did not appear
  chosen_korean: 나타나지 않았습니다
  alternatives_korean:
  - 보이지 않았습니다
  - 사라졌습니다
  - 더 이상 보이지 않았습니다
  lexicon: 표준어 일반
  rationale: 라틴어의 부정 + 출현/가시성 부재를 그대로 살려, 단순한 ‘사라짐’보다 POB의 ‘did not appear’에 더 가깝게 옮겼습니다.
- source_word: surrexerunt ... erectae sunt ut regnarent
  english_pob_choice: arose and were set up to reign
  chosen_korean: 일어나서 통치하게 세워졌고
  alternatives_korean:
  - 일어나 통치하도록 세워졌고
  - 일어나 왕이 되도록 세워졌고
  - 일어나 통치하기 위해 세워졌고
  lexicon: 표준어 일반
  rationale: 두 동사(surrexerunt, erectae sunt)를 분리해 ‘일어나다’와 ‘세워지다’를 모두 살리고, 목적절 ut regnarent는 ‘통치하게’로 옮겼습니다.
- source_word: regnum eorum exile et tumulti plenum
  english_pob_choice: their reign was brief and full of turmoil
  chosen_korean: 그들의 통치는 짧고 소란으로 가득했습니다
  alternatives_korean:
  - 그들의 통치는 짧고 혼란으로 가득했습니다
  - 그들의 나라 다스림은 짧고 소란으로 가득했습니다
  - 그들의 통치는 짧고 소동이 가득했습니다
  lexicon: 표준어 일반
  rationale: exile은 기간의 짧음을, tumulti는 분주한 소란/혼란을 가리키므로 POB의 ‘brief and full of turmoil’을 자연스럽게 반영했습니다.
- source_word: incendebatur
  english_pob_choice: was burning
  chosen_korean: 타고 있었으며
  alternatives_korean:
  - 불타고 있었으며
  - 계속 타들어가고 있었으며
  - 불길에 휩싸여 있었으며
  lexicon: 표준어 일반
  rationale: 미완료 과거의 진행상을 살려 완료형 ‘타버렸습니다’보다 과정적 표현을 택했습니다.
theological_decisions:
- issue: 독수리 환상에서의 연속적 소멸과 심판의 표상
  chosen_reading: ‘나타나지 않았고’와 ‘타고 있었으며’로, 머리와 날개가 연속적으로 시야에서 사라지고 독수리 전체가 불타는 환상적 진행을 드러냈습니다.
  alternative_readings:
  - ‘사라졌고’로 더 강하게 종결된 소멸을 표현하는 읽기
  - ‘불타버리고 있었다’로 결과 상태를 강조하는 읽기
  rationale: 라틴어는 출현 부재와 진행 중인 연소를 단계적으로 제시하므로, 그 긴장을 유지하는 것이 본문의 예언적 이미지에 더 충실합니다.
  doctrine_reference: apocalyptic imagery / textual sequence
