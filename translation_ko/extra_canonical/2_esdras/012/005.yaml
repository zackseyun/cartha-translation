id: 2ES.12.5
reference: 2 Esdras 12:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: spiritu meo inualidus sum ualde, et nec modica est in me uirtus a multo timore quem expaui nocte hac. Nunc ergo orabo
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/005.yaml
  text: and in my spirit I am very weak[a], and there is not even a little strength in me because of the great fear that terrified me this night.
  footnotes:
  - marker: a
    text: Or 'that I felt'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 제 영은 몹시 쇠약하고, 이 밤에 제가 몹시 두려워한 그 큰 두려움 때문에 제 안에는 조금의 힘도 없습니다. 그러므로 이제 기도하겠습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: spiritu meo
  english_pob_choice: in my spirit
  chosen_korean: 제 영은
  alternatives_korean:
  - 제 마음은
  - 제 속은
  lexicon: 영
  rationale: spiritu meo는 단순한 심리 상태보다 내적 존재 전반을 가리키므로 ‘영’으로 옮겨 원문의 내적·영적 차원을 살렸습니다.
- source_word: inualidus sum ualde
  english_pob_choice: I am very weak
  chosen_korean: 몹시 약해졌고
  alternatives_korean:
  - 매우 약합니다
  - 아주 기진맥진했습니다
  lexicon: 약하다
  rationale: 현재 상태의 쇠약함을 자연스럽게 드러내기 위해 ‘약해졌고’로 옮겼고, ualde는 ‘몹시’로 강화했습니다.
- source_word: nec modica est in me uirtus
  english_pob_choice: there is not even a little strength in me
  chosen_korean: 제 안에는 조금의 힘도 없습니다
  alternatives_korean:
  - 제 안에 작은 힘도 없습니다
  - 제 안에는 힘이 거의 없습니다
  lexicon: 힘
  rationale: nec modica est는 부정의 강도를 살려 ‘조금의 힘도 없습니다’로 직역에 가깝게 옮겼습니다.
- source_word: a multo timore quem expaui nocte hac
  english_pob_choice: because of the great fear that terrified me this night
  chosen_korean: 이 밤에 제가 겪은 큰 두려움 때문에
  alternatives_korean:
  - 이 밤에 저를 크게 두렵게 한 두려움 때문에
  - 이 밤에 제가 아주 두려워했던 그 큰 두려움 때문에
  lexicon: 두려움
  rationale: expaui는 단순히 ‘느꼈다’보다 ‘크게 두려워하다/떨다’의 뜻이므로, POB의 수정 취지에 따라 ‘제가 겪은’으로 풀어 문맥상 강한 공포를 보존했습니다.
theological_decisions:
- issue: 밤중의 공포와 신체적 쇠약의 연결
  chosen_reading: 두려움이 단순한 감정이 아니라 영과 힘을 약화시키는 실제적 압박으로 제시된 것으로 옮겼습니다.
  alternative_readings:
  - 감정적으로만 두려웠다고 완화해서 옮김
  - 육체적 쇠약만 강조하고 영적 차원을 약화시킴
  rationale: 원문은 ‘영’의 약함과 ‘힘’의 결핍을 공포의 결과로 직접 연결하므로, 그 긴장을 약화시키지 않도록 유지했습니다.
  doctrine_reference: 인간의 내적 상태와 공포가 전체 존재에 미치는 성경적 묘사
