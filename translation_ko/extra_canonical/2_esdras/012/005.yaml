  naturalness: ‘제 영은 몹시 쇠약하고’ 및 ‘조금의 힘도 없습니다’는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 병렬을 유지합니다.
  terminology: spiritu는 ‘영’, uirtus는 문맥상 ‘힘’으로 유지하는 것이 적절합니다. expaui의 강한 공포 의미를 ‘몹시 두려워한’으로 반영합니다.
