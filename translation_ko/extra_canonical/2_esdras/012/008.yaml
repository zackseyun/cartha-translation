translation:
  language: ko
  text: 이 두려운 환상의 해석과 구분을, 제 영혼을 온전히 위로하실 수 있도록 해 주십시오. 이는 당신께서 저를 합당한 사람으로 여기셨기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘환상의 해석’은 환상을 설명해 달라는 요청으로 읽을 수도 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: interpretationem
  english_pob_choice: the interpretation
  chosen_korean: 해석
  alternatives_korean:
  - 풀이
  - 해명
  lexicon: interpretation
  rationale: 환상의 의미를 풀어 주는 뜻이므로 가장 직접적인 ‘해석’을 택했습니다.
- source_word: distinctionem
  english_pob_choice: the distinction
  chosen_korean: 구분
  alternatives_korean:
  - 분별
  - 차이
  lexicon: distinction
  rationale: 라틴어 distinctio는 단순한 설명보다 환상의 요소들을 나누어 밝히는 뉘앙스가 있어 ‘구분’이 가장 근접합니다.
- source_word: visus horribilis huius
  english_pob_choice: this dreadful vision
  chosen_korean: 이 두려운 환상
  alternatives_korean:
  - 이 무서운 환상
  - 이 끔찍한 환시
  lexicon: vision
  rationale: horribilis의 강한 공포감을 살리되, 현대 한국어에서 자연스러운 ‘두려운’으로 옮겼습니다.
- source_word: plenissime consoles animam meam
  english_pob_choice: so that you may fully comfort my soul
  chosen_korean: 제 영혼을 온전히 위로하실 수 있도록
  alternatives_korean:
  - 제 영혼을 충분히 위로하시도록
  - 제 영혼을 완전히 위로하시도록
  lexicon: comfort
  rationale: plenissime의 충만함을 ‘온전히’로 살리고, 목적절 구조를 자연스럽게 반영했습니다.
- source_word: Dignum enim me habuisti
  english_pob_choice: For you have counted me worthy
  chosen_korean: 이는 당신께서 저를 합당한 사람으로 여기셨기 때문입니다
  alternatives_korean:
  - 왜냐하면 당신께서 저를 합당하다고 여기셨기 때문입니다
  - 이는 당신께서 저를 합당하게 여기셨기 때문입니다
  lexicon: worthy
  rationale: dignum me habuisti는 ‘합당한 사람으로 여기다’가 가장 자연스럽고, 존칭 대상인 하나님께는 합쇼체를 유지했습니다.
theological_decisions:
- issue: 기도문에서의 직접 청원과 존칭 화법
  chosen_reading: 하나님께 드리는 직접 청원으로 처리하되, 한국어 서술은 합쇼체를 유지하고 2인칭 대명사를 ‘당신’으로 명시했습니다.
  alternative_readings:
  - ‘주님’으로 대체하여 경건체를 강화하는 읽기
  - 청원을 간접화하여 평서문처럼 만드는 읽기
  rationale: 원문은 청원의 직접성이 강하므로 그 긴장을 보존해야 하며, 동시에 현대 합쇼체 문체를 유지하는 것이 본문 전달에 가장 적합합니다.
  doctrine_reference: 기도의 직접 호소와 존칭 화법의 균형
- issue: animam meam의 번역
  chosen_reading: ‘제 영혼’을 유지했습니다.
  alternative_readings:
  - ‘제 마음’을 사용
  - ‘저 자신’을 사용
  rationale: anima는 단순한 감정이 아니라 인격적 내면 전체를 가리킬 수 있으므로, 원문의 범위를 넓게 보존하는 ‘영혼’이 적절합니다.
  doctrine_reference: 인간 내면의 전체성
