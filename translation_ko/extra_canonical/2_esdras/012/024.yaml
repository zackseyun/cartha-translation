  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: terram, Et qui habitant in ea cum labore multo super omnes qui fuerunt ante hos; propter hoc ipsi uocati sunt capita
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/024.yaml
  text: the earth and those who dwell in it, with much oppression, more than all who were before them; therefore they are called the heads
translation:
  language: ko
  text: 땅과 그 안에 사는 자들은, 그들보다 앞선 모든 이들보다 더 큰 고난 가운데 있었으니, 그러므로 그들은 머리라고 불립니다.[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 직역하면 ‘많은 수고/노고 가운데’이지만, 이 절에서는 억눌림과 고통의 뉘앙스가 강하게 드러납니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: terram
  english_pob_choice: the earth
  chosen_korean: 땅
  alternatives_korean:
  - 세상
  - 땅과 그곳에 사는 사람들
  lexicon: terra
  rationale: 라틴어 terram은 본문 전개상 ‘지면/땅’의 의미가 자연스러우므로, POB의 단순한 ‘the earth’를 따라 간결하게 ‘땅’으로 옮겼습니다.
- source_word: Et qui habitant in ea
  english_pob_choice: and those who dwell in it
  chosen_korean: 그 안에 사는 자들은
  alternatives_korean:
  - 그곳에 거주하는 이들은
  - 그 안에 사는 사람들은
  lexicon: habito
  rationale: habitāre는 단순한 거주를 뜻하므로, 문어체이면서도 직접적인 ‘사는 자들’로 옮겨 거주 의미를 살렸습니다.
- source_word: cum labore multo
  english_pob_choice: with much oppression
  chosen_korean: 더 큰 고난 가운데
  alternatives_korean:
  - 큰 압제 가운데
  - 많은 수고 가운데
  lexicon: labor
  rationale: labor는 문맥상 단순한 ‘수고’보다 억눌림과 고통을 포괄하는 표현이어서, 영어 POB의 ‘oppression’ 취지를 반영해 ‘고난’으로 옮겼습니다.
- source_word: capita
  english_pob_choice: the heads
  chosen_korean: 머리라고
  alternatives_korean:
  - 우두머리라고
  - 수장이라고
  lexicon: caput
  rationale: capita는 여기서 비유적으로 ‘우두머리들/머리들’을 뜻하므로, 직역성을 살리되 한국어에서 자연스러운 ‘머리’ 표현을 유지했습니다.
theological_decisions:
- issue: labor multo의 의미 범위
  chosen_reading: 사회적 압제와 고통을 포괄하는 표현으로 이해해 ‘고난’으로 번역했습니다.
  alternative_readings:
  - ‘많은 수고’로 더 문자적으로 번역
  - ‘압제’로 좁혀 번역
  rationale: 문맥상 단순 노동보다 더 넓은 억압적 상태를 가리키므로, 한쪽으로 과도하게 좁히지 않으면서도 POB의 ‘oppression’ 의미를 드러냈습니다.
  doctrine_reference: 문맥 우선 원칙
- issue: ‘heads’의 비유적 호칭
  chosen_reading: 직역적 이미지를 살려 ‘머리라고 불립니다’로 유지했습니다.
  alternative_readings:
  - ‘우두머리라고 불립니다’로 해석 번역
  - ‘지도자라고 불립니다’로 풀어 번역
  rationale: 본절은 지배적 지위의 은유를 사용하는데, 전통적 관용구로 완전히 바꾸면 원문의 비유성이 약해지므로 직역을 택했습니다.
  doctrine_reference: 은유 보존 원칙
