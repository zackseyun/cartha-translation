lexical_decisions:
- source_word: Regnabunt
  english_pob_choice: will reign
  chosen_korean: 다스릴 것입니다
  alternatives_korean:
  - 통치할 것입니다
  - 왕노릇할 것입니다
  lexicon: regnare
  rationale: 라틴어 동사 regnabunt는 왕으로서 통치하는 뜻이므로, 한국어에서는 자연스럽고 직설적인 ‘다스리다’를 택했습니다.
- source_word: in ea
  english_pob_choice: in it
  chosen_korean: 그 나라에는
  alternatives_korean:
  - 그 안에서
  - 그 안에
  lexicon: ea
  rationale: 문맥상 앞절에서 언급된 영역/나라를 가리키므로, 한국어에서는 지시성을 살려 ‘그 나라’로 옮겼습니다.
- source_word: XII reges
  english_pob_choice: twelve kings
  chosen_korean: 왕 열둘
  alternatives_korean:
  - 열두 왕
  - 왕이 열둘
  lexicon: XII reges
  rationale: 숫자-명사 배열은 한국어에서 ‘왕 열둘’이 가장 간결하며, 수사적 강조도 유지합니다.
- source_word: unus post unum
  english_pob_choice: one after another
  chosen_korean: 차례로
  alternatives_korean:
  - 하나씩 서로 뒤이어
  - 한 사람씩 차례차례
  lexicon: unus post unum
  rationale: 직역하면 어색해지므로, 이어서 하나씩 왕위/통치가 바뀐다는 순차성을 자연스럽게 드러내는 ‘차례로’를 선택했습니다.
theological_decisions:
- issue: 왕권의 연속성을 어떻게 표현할지
  chosen_reading: ‘왕 열둘이 차례로 다스릴 것입니다’로, 숫자와 순차성을 그대로 보존했습니다.
  alternative_readings:
  - ‘열두 왕이 차례로 이어 통치할 것입니다’
  - ‘열두 왕이 연이어 다스릴 것입니다’
  rationale: 이 절의 핵심은 왕들의 수와 순차적 통치라는 예언적 정보이므로, 해석을 덧붙이지 않고 원문의 예고성을 유지했습니다.
  doctrine_reference: extra-canonical prophetic narration
