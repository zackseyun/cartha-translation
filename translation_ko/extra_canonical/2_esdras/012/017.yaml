    rationale: 라틴어 Et quoniam audisti는 ‘그리고/또 네가 들었으므로’라는 인과절이며, 앎이나 추정의 내용을 표현하지 않습니다.
  - severity: medium
    issue: ‘목소리가 말한 것’이 원문의 관계절을 부정확하고 어색하게 처리합니다.
    rationale: uocem quae locuta est는 ‘말한/말하는 목소리’이지 ‘목소리가 말한 것’이 아닙니다.
  - severity: medium
