    reason: source_note
lexical_decisions:
- source_word: audisti uocem quae locuta est
  english_pob_choice: you heard a voice speaking
  chosen_korean: 네가 들은 목소리가 말한 것
  alternatives_korean:
  - 네가 목소리 하나가 말하는 것을 들은 것
  - 네가 말하는 목소리를 들은 것
  lexicon: audio / vox / loquor
  rationale: 라틴어의 ‘들음’과 ‘말함’의 연결을 자연스럽게 살리되, 불필요한 확대 없이 직접적으로 옮겼습니다.
- source_word: non de u.g. capitis
  english_pob_choice: not from its heads
  chosen_korean: 그 머리들에서 나온 것이 아니라
  alternatives_korean:
  - 그 머리들로부터가 아니라
  - 머리들에서 나오지 않고
  lexicon: caput
  rationale: 영문 POB의 ‘heads’에 맞추면서도, 라틴어의 방향성(de)을 한국어의 ‘에서 나온 것이 아니라’로 자연스럽게 반영했습니다.
- source_word: de medio corporis
  english_pob_choice: from the midst of its body
  chosen_korean: 몸 한가운데에서 나온 것
  alternatives_korean:
  - 몸의 한가운데에서 나온 것
  - 그 몸의 중심에서 나온 것
  lexicon: medius / corpus
  rationale: ‘midst’를 ‘한가운데’로, ‘body’를 ‘몸’으로 옮겨 시각적 대비가 분명하게 드러나도록 했습니다.
theological_decisions:
- issue: 환상적 표상의 구체성 유지
  chosen_reading: 머리들과 몸 한가운데라는 대비를 문자적으로 보존했습니다.
  alternative_readings:
  - 비유적으로 완화해 ‘겉부분이 아니라 중심에서’로 옮김
  - 상징을 풀어 설명하는 방식
  rationale: 본문은 소리가 어디서 나는지를 대비적으로 묘사하므로, 상징성을 과도하게 풀지 않고 이미지 자체를 유지하는 것이 source-direct합니다.
