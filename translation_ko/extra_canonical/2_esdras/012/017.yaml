  source_fidelity: 초안은 ‘말하는 목소리’를 ‘목소리가 말한 것’으로 바꾸어 수식 관계가 어색해졌고, 원문과 영어 POB에 없는 ‘알게 되었을 것입니다’를 덧붙였습니다. 또한 et quoniam의 인과적 연결을 보존해야 합니다.
  naturalness: ‘그 머리들에서 나온 것이 아니라 몸 한가운데에서 나온 것임을 알게 되었을 것입니다’는 한국어 문장으로 부자연스럽고, 본문이 말하는 청각 행위를 지식의 획득으로 변경합니다. ‘…말하는 목소리를 들으셨으므로’가 자연스럽습니다.
  terminology: ‘머리들’, ‘몸 한가운데’는 환상 표상의 대비를 적절히 보존합니다. ‘나온’은 가능하나, 여기서는 소리가 발화하는 위치를 나타내므로 ‘…에서 말하는 목소리’가 더 직접적입니다.
