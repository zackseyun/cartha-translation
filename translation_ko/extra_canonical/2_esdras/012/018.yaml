  - marker: a
    text: Or 'after the time of that kingdom'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것이 그 해석입니다. 그 왕국이 있은 지 얼마 뒤에 적지 않은 분쟁들이 일어날 것이며, 그 왕국은 무너질 위험에 처하겠지만 무너지지는 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘그 왕국이 있은 지 얼마 뒤에’: 라틴어 post tempus regni illius는 왕국의 시대가 끝난 뒤라는 뜻이라기보다, 그 왕국이 존속한 지 얼마 뒤라는 뜻으로 이해될 수 있습니다.'
    reason: source_note
lexical_decisions:
- source_word: Haec est interpretatio
  english_pob_choice: This is the interpretation
  chosen_korean: 이것이 그 해석입니다
  alternatives_korean:
  - 이것이 해석입니다
  - 이것이 뜻입니다
  lexicon: interpretatio
  rationale: 예언적 상징을 푸는 공식 문구이므로, 단순한 설명보다 '해석'을 써서 원문의 기능을 드러냈습니다.
- source_word: post tempus regni illius
  english_pob_choice: after the time of that kingdom
  chosen_korean: 그 왕국의 때가 지난 뒤에
  alternatives_korean:
  - 그 왕국의 시간 뒤에
  - 그 왕국의 시기 후에
  - 그 왕국의 때 이후에
  lexicon: post tempus
  rationale: lat. post tempus는 '시간이 끝난 뒤'보다 '때가 지난 뒤/후에'의 관용적 의미가 자연스러워, 왕국이 곧바로 끝난다는 오해를 피하면서도 흐름을 살렸습니다.
- source_word: non modicae
  english_pob_choice: no small
  chosen_korean: 적지 않은
  alternatives_korean:
  - 작지 않은
  - 만만치 않은
  - 상당한
  lexicon: non modicae
  rationale: 직역의 부정을 유지하면서 한국어에서 자연스럽고 강한 정도를 드러내는 표현으로 옮겼습니다.
- source_word: periclitabitur ut cadat, et non cadet
  english_pob_choice: it will be in danger of falling; but it will not fall
  chosen_korean: 무너질 위험에 처하겠지만, 무너지지는 않을 것입니다
  alternatives_korean:
  - 넘어질 위험에 처하겠지만, 넘어지지는 않을 것입니다
  - 무너질 듯하겠지만, 무너지지는 않을 것입니다
  lexicon: periclitabitur / cadat
  rationale: '''위험에 처하다''로 불안정함을, ''무너지다''로 정치적 붕괴의 이미지를 유지해 원문의 대비를 분명히 했습니다.'
theological_decisions:
- issue: 왕국의 붕괴 가능성과 최종 보존의 긴장
  chosen_reading: 왕국은 실제로 무너질 위험에 놓이지만, 결국 무너지지 않습니다.
  alternative_readings:
  - 위험만 암시하고 실제 붕괴 가능성은 약화하는 읽기
  - 완전한 안전 보장으로 재구성하는 읽기
  rationale: 본문은 위협의 실재와 최종적 불가붕괴를 함께 말하므로, 둘 중 하나를 약화시키지 않고 병치했습니다.
  doctrine_reference: 본문 내 예언적 긴장 보존
