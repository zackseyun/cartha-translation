review_pass:
  verdict: revise
  source_fidelity: 첫 절은 라틴어 *gladius eos comedet*를 충실히 옮깁니다. 그러나 둘째 절의 *Vnius*는 주격 수사 ‘하나의’가 아니라 남성 단수 속격으로, *gladius*를 수식하는 ‘한 사람의 칼’입니다. 따라서 ‘한 칼’은 원문의 통사 관계를 바꿉니다. 또한 *eo*는 남성 단수이므로, 자연스럽게는 그 ‘한 사람’을 가리키며 ‘그와 함께 있는 사람’으로 옮기는 것이 적절합니다.
  naturalness: ‘그들을 삼킬 것입니다’는 심판 은유로 자연스럽습니다. 다만 ‘참으로 한 칼이 그것과 함께 있는 이’는 한국어에서 지시 관계가 부자연스럽고, ‘한 칼’은 흔히 한 차례의 베기라는 뜻으로도 들립니다.
  terminology: '*gladius*를 ‘칼’로 옮긴 것은 현대 표준어에서 적절합니다. 번역문 자체에 ‘검’ 대안을 설명하는 주석은 본문 이해에 필요한 본문 주석이 아니므로 제거하는 편이 좋습니다.'
  issues:
  - severity: high
    issue: Vnius의 속격을 ‘한 칼’로 번역함
    rationale: '*Vnius enim gladius*는 문자적으로 ‘한 사람의 칼’이며, ‘하나의 칼’이라면 라틴어는 *unus gladius*여야 합니다.'
  - severity: medium
    issue: eo를 칼로 지시하여 ‘그것과 함께’로 번역함
    rationale: '*eo*는 남성 단수이며, 직전의 속격 선행사 ‘한 사람’과 연결되는 ‘그와 함께’가 통사적·문맥적으로 더 자연스럽습니다. 영어 POB의 ‘with it’은 라틴어의 성과 속격 구조를 충분히 반영하지 못합니다.'
  - severity: low
    issue: 번역 선택을 설명하는 어휘 주석
    rationale: ‘칼’ 선택은 본문에 필요한 독자 주석이 아니며, 본문 주석 체계를 불필요하게 늘립니다.
  revised_text: 칼이 그들을 삼킬 것입니다. 한 사람의 칼이 그와 함께 있는 사람을 삼킬 것입니다.
