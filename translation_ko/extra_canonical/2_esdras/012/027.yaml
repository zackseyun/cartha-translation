  to: 칼이 그들을 삼킬 것입니다. 한 사람의 칼이 그와 함께 있는 사람을 삼킬 것입니다.
  rationale: 라틴어 원문을 우선하여 *unius gladius*의 속격 관계를 ‘한 사람의 칼’로, *qui cum eo*를 ‘그와 함께 있는 사람’으로 바로잡았습니다. ‘삼키다’는 *comedet*의 파괴적 비유를 유지합니다. 영어 감사 이력의 ‘one sword … with it’은 원문 형태론과 충돌하므로 따르지 않았습니다.
