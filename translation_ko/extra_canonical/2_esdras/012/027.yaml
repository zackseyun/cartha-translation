  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/027.yaml
  text: the sword will devour them[a]. For one sword will devour him who is with it,
  footnotes:
  - marker: a
    text: Or '“And because you saw that the larger head disappeared, this means that one of them will die on his bed, but still with torments.'.
    reason: previous_rendering
translation:
  language: ko
  text: 칼이 그들을 삼킬 것입니다. 참으로 한 칼이 그것과 함께 있는 이를 삼킬 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 gladius는 문자적으로 ‘검’이지만, 여기서는 현대 한국어에서 더 자연스러운 일반적 무기어인 ‘칼’로 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: gladius
  english_pob_choice: the sword
  chosen_korean: 칼
  alternatives_korean:
  - 검
  - 도
  lexicon: gladius
  rationale: 라틴어 gladius는 문자적으로 ‘검/칼’이지만, 이 문맥의 파괴적 비유를 자연스럽게 살리기 위해 현대 한국어에서는 ‘칼’이 가장 직관적입니다.
- source_word: eos comedet
  english_pob_choice: will devour them
  chosen_korean: 그들을 삼킬 것입니다
  alternatives_korean:
  - 그들을 먹어치울 것입니다
  - 그들을 집어삼킬 것입니다
  lexicon: comedo
  rationale: comedet의 강한 소멸·파괴 이미지를 살리되, 한국어에서는 비유적 용법으로 자연스러운 ‘삼키다’를 택했습니다.
- source_word: Vnius enim gladius
  english_pob_choice: For one sword
  chosen_korean: 참으로 한 칼이
  alternatives_korean:
  - 한 칼이
  - 한 사람의 칼이
  lexicon: unus + gladius
  rationale: vnius(enim)는 ‘한/하나의’라는 수량 강조로 이해하여, 소유격을 덧붙이지 않고 ‘한 칼’로 옮겼습니다.
- source_word: qui cum eo
  english_pob_choice: him who is with it
  chosen_korean: 그것과 함께 있는 이를
  alternatives_korean:
  - 그와 함께 있는 이를
  - 그것과 함께 있는 자를
  lexicon: qui + cum eo
  rationale: 영문 수정본처럼 동반 대상이 칼을 가리키는 것으로 읽히므로, 대명사 ‘그것’을 유지해 관계를 분명히 했습니다.
theological_decisions:
- issue: 비유적 심판 이미지의 직접성
  chosen_reading: 칼이 사람들을 ‘삼킨다’는 직설적 심판 은유를 그대로 유지했습니다.
  alternative_readings:
  - ‘죽일 것입니다’처럼 의미를 풀어 쓰는 번역
  - ‘멸할 것입니다’로 완화하는 번역
  rationale: 원문 comedet의 폭력적·파괴적 은유를 약화하지 않고, 독자가 본문의 경고성을 그대로 느끼도록 했습니다.
  doctrine_reference: 예언적 환상 언어의 이미지 보존
- issue: 대명사 지시 대상
  chosen_reading: 두 번째 절의 eo를 칼을 가리키는 것으로 처리했습니다.
  alternative_readings:
  - 사람을 가리키는 것으로 읽는 번역
  rationale: 수정된 영어 POB와 라틴어 어순 모두 ‘한 칼’이 다시 주어가 되는 구조를 지지하므로, 지시 대상을 칼로 잡는 것이 가장 일관됩니다.
  doctrine_reference: 문맥상 대명사 지시 해석
