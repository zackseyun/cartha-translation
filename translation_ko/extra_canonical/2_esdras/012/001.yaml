  rationale: 라틴어 leo는 일반적으로 ‘사자’를 뜻하므로, 영어 POB의 lion에 맞춰 직역했습니다.
- source_word: ad
  english_pob_choice: to the eagle
  chosen_korean: 독수리에게
  alternatives_korean:
  - 독수리에게로
  - 독수리한테
  lexicon: 표준 조사/부사격
  rationale: ad는 방향·대상을 가리키므로 문맥상 ‘독수리에게’가 가장 자연스럽고 원문 관계를 보존합니다.
- source_word: dum loqueretur
  english_pob_choice: while ... was speaking
  chosen_korean: 말하고 있었습니다
