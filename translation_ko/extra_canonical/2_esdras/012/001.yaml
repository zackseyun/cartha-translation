  lexicon: 라틴어 접속·과거진행상
  rationale: dum + 미완료 접속법은 동시 진행을 나타내므로, 사건의 진행 중임을 드러내는 현재진행형 과거 표현으로 옮겼습니다.
theological_decisions:
- issue: 서사 도입구의 시제와 진행감
  chosen_reading: ‘이러할 때에’와 ‘말하고 있었습니다’로, 사건이 끊어진 완료가 아니라 진행 중인 장면임을 살렸습니다.
  alternative_readings:
  - ‘그때’로 단순화
  - ‘말했습니다’로 평서 완료형 처리
  rationale: 이 절은 본격 대화의 시작 직전 상황을 제시하므로, 진행형을 유지해야 장면 전환의 긴장을 보존할 수 있습니다.
