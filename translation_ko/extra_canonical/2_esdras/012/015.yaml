    text: Or 'But the second who begins to reign will hold power for a longer time than the twelve.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 둘째가 통치하기 시작하면 더 오래 권세를 잡을 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Nam
  english_pob_choice: For the second who begins to reign will hold power longer
  chosen_korean: 그러므로
  alternatives_korean:
  - 왜냐하면
  - 또한
  - 그런데
  lexicon: nam
  rationale: 라틴어 nam은 설명·이유를 덧붙이는 연결사이므로, 대조를 만드는 '그런데/하지만'보다 원인 설명의 '그러므로'가 문맥에 맞습니다.
- source_word: secundus
  english_pob_choice: the second
  chosen_korean: 둘째
  alternatives_korean:
  - 두 번째 사람
  - 둘째 왕
  - 두 번째
  lexicon: secundus
  rationale: 여기서는 왕위 계승의 순서를 가리키므로, 자연스러운 한국어로 '둘째'가 가장 간결하고 문맥에도 맞습니다.
- source_word: incipiet regnare
  english_pob_choice: begins to reign
  chosen_korean: 통치하기 시작하면
  alternatives_korean:
  - 다스리기 시작하면
  - 왕이 되기 시작하면
  - 즉위하면
  lexicon: incipio + regnare
  rationale: regnare는 단순한 즉위가 아니라 통치의 시작을 가리키므로 '통치하기 시작하면'이 의미를 가장 직접적으로 옮깁니다.
- source_word: ipse tenebit amplius
  english_pob_choice: will hold power longer
  chosen_korean: 더 오래 권세를 잡을 것입니다
  alternatives_korean:
  - 더 오래 다스릴 것입니다
  - 더 오래 권력을 유지할 것입니다
  - 더 오래 버틸 것입니다
  lexicon: tenere + amplius
  rationale: tenebit는 '붙들다/잡다'의 동사 뉘앙스를 살려 '권세를 잡다'로 옮겼고, amplius는 비교적의 '더 오래'로 처리했습니다.
