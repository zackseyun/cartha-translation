lexical_decisions:
- source_word: ostendere mihi temporum finem et temporum nouissima
  english_pob_choice: to show me the end of the times and the last things of the times
  chosen_korean: 시대의 끝과 시대의 마지막 일들
  alternatives_korean:
  - 때의 끝과 때의 마지막 일들
  - 시기들의 끝과 시기들의 마지막 일들
  lexicon: tempos/temporum → 시대/때; finem → 끝; nouissima → 마지막 일들
  rationale: 라틴어의 복수형 temporum을 살려 ‘시대’와 ‘마지막 일들’을 병렬로 옮겨, 단순한 시간 종료가 아니라 종말론적 국면의 완결을 드러냈습니다.
- source_word: ostendere mihi
  english_pob_choice: to show me
  chosen_korean: 나에게 보여 주시려고 하셨습니다
  alternatives_korean:
  - 나에게 보여 주려고 하셨습니다
  - 나에게 보이려고 하셨습니다
  lexicon: ostendere → 보여 주다
  rationale: 문맥상 앞절의 목적 구문을 자연스럽게 살려, 단순 서술보다 의도/목적을 드러내는 한국어로 옮겼습니다.
- source_word: et dixit ad me
  english_pob_choice: And he said to me
  chosen_korean: 그리고 그가 나에게 말씀하셨습니다
  alternatives_korean:
  - 그리고 그가 나에게 말했습니다
  - 그리고 그가 내게 말씀하셨습니다
  lexicon: dixit ad me → 나에게 말씀하셨다
  rationale: 신적/환상적 대화의 공적 어조를 고려해 ‘말씀하셨습니다’를 택해, 라틴어의 직접 화행과 한국어의 격식을 맞췄습니다.
- source_word: Haec est interpretatio uisionis huius quam
  english_pob_choice: This is the interpretation of this vision that
  chosen_korean: 이것은 이 환상의 해석입니다. 이것은…
  alternatives_korean:
  - 이것은 이 환상의 해석입니다
  - 이것이 바로 이 환상의 뜻입니다
  lexicon: interpretatio → 해석; uisio → 환상
  rationale: 제공된 라틴어 원문이 다음 절로 이어지는 미완 문장임을 반영하여, 절 경계에 맞게 끊되 다음 절로 이어짐을 시사하는 생략부호를 두었습니다.
theological_decisions:
- issue: 라틴어 본문의 절 분할과 영어 POB 개정 이력의 불일치
  chosen_reading: 2절 본문에 해당하는 라틴어 구문을 그대로 포함하되, 한국어는 현 절 내부에서 시작된 해석 진술이 다음 절로 이어지는 형태로 처리했습니다.
  alternative_readings:
  - 영어 POB처럼 앞부분만 두고 뒤 문장을 다음 절로 완전히 넘기는 방식
  - 절 번호 관행에 맞춰 뒤 문장을 생략하는 방식
  rationale: 감사 이력에 따르면 영어 초안은 뒤 구문을 누락했으나, 제공된 소스 문자열은 그 구문을 포함하므로 원문 우선 원칙에 따라 반영했습니다.
  doctrine_reference: source_text_priority
