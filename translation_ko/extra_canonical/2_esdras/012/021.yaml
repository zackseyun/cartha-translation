id: 2ES.12.21
reference: 2 Esdras 12:21
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: leuia et anni citati, et duo quidem ex ipsis perient Adpropinquante tempore medio, quattuor autem seruabuntur in tempore cum incipiet adpropinquare tempus eius ut finiatur,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/021.yaml
  text: whose times will be brief and whose years swift. Two of them will perish when the middle time draws near[a], but four will be preserved for the time when its end begins to draw near,
  footnotes:
  - marker: a
    text: Or 'whose times will be light and whose years swift.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 시간은 짧고 그들의 해는 빠릅니다. 둘은 중간 시기가 가까워질 때 죽고, 넷은 그 끝이 가까워지기 시작할 때까지 보존될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 leuia는 여기서 ‘가벼운’보다 ‘짧은, 덧없는’이라는 뜻으로 이해하는 것이 문맥에 더 적절합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: leuia
  english_pob_choice: whose times will be brief
  chosen_korean: 그들의 시간은 짧고
  alternatives_korean:
  - 그들의 시간은 가볍고
  - 그들의 시기는 짧고
  lexicon: leuia
  rationale: 라틴어 leuia는 시간과 함께 쓰일 때 ‘가볍다’보다 ‘짧다, 덧없다’의 의미가 더 자연스럽습니다. 영어 POB의 수정도 이 점을 반영하므로 한국어도 ‘짧고’로 옮겼습니다.
- source_word: anni citati
  english_pob_choice: and whose years swift
  chosen_korean: 그들의 해는 빠릅니다
  alternatives_korean:
  - 그들의 해는 신속합니다
  - 그들의 연대는 빠릅니다
  lexicon: citatus
  rationale: citati는 해가 빠르게 지나감을 가리키므로, 현대 한국어에서 자연스러운 ‘빠릅니다’로 옮겨 속도감과 덧없음을 살렸습니다.
- source_word: seruabuntur
  english_pob_choice: will be preserved
  chosen_korean: 보존될 것입니다
  alternatives_korean:
  - 지켜질 것입니다
  - 간직될 것입니다
  lexicon: servo
  rationale: 라틴어 seruabuntur는 단순한 ‘보관’이 아니라 앞으로의 시간까지 안전하게 유지됨을 뜻하므로, 영어 POB의 ‘preserved’에 맞추어 ‘보존될 것입니다’로 번역했습니다.
theological_decisions:
- issue: 두 무리의 운명 대비(죽음 vs 보존)
  chosen_reading: 둘은 중간 시기가 가까워질 때 죽고, 넷은 그 끝이 가까워지기 시작할 때까지 보존됩니다.
  alternative_readings:
  - 둘은 중간 때가 가까워질 때 사라지고, 넷은 끝이 다가오기 시작할 때까지 남아 있습니다.
  rationale: 본문은 숫자적 대비를 통해 앞의 둘은 소멸하고 뒤의 넷은 끝까지 남는다는 예언적 구도를 제시하므로, 그 대조를 흐리지 않도록 직설적으로 옮겼습니다.
  doctrine_reference: 예언적 상징과 종말 서술의 대비
