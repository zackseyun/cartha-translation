id: 2ES.12.48
reference: 2 Esdras 12:48
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et fortis non est oblitus uestri in contentione. Ego enim non dereliqui uos neque excessi a uobis, sed ueni in hunc locum ut deprecarer pro desolatione Sion, et ut quererem misericordiam pro humilitate sanctificationis uestrae. Et nunc ite unusquisque uestrum in domum suam et ego ueniam ad uos post dies istos. Et profectus est populus sicut dixi ei in ciuitatem. Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/048.yaml
  text: For I have not forsaken you, nor have I departed from you, but I came to this place to pray for the desolation of Zion and to seek mercy for the humiliation of your sanctuary.
translation:
  language: ko
  text: 내가 너희를 버리지도 않았고 너희에게서 떠나지도 않았습니다. 그러나 나는 시온의 황폐함을 위해 기도하고, 너희 성소의 비천함을 위해 긍휼을 구하려고 이곳에 왔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non dereliqui uos
  english_pob_choice: I have not forsaken you
  chosen_korean: 너희를 버리지도 않았고
  alternatives_korean:
  - 너희를 저버리지도 않았고
  - 너희를 떠나지 않았고
  lexicon: derelinquō
  rationale: forsaken은 관계를 끊고 외면하는 의미가 강하므로 한국어도 ‘버리다’로 직접 옮겨, 뒤의 ‘떠나다’와 구별했습니다.
- source_word: neque excessi a vobis
  english_pob_choice: nor have I departed from you
  chosen_korean: 너희에게서 떠나지도 않았습니다
  alternatives_korean:
  - 너희 곁을 떠나지도 않았습니다
  - 너희에게서 물러나지도 않았습니다
  lexicon: excedō
  rationale: revision pass의 ‘departed from you’를 따라, 단순한 이동보다 관계적 이탈을 드러내는 ‘떠나다’를 선택했습니다.
- source_word: desolatione Sion
  english_pob_choice: the desolation of Zion
  chosen_korean: 시온의 황폐함
  alternatives_korean:
  - 시온의 황폐
  - 시온의 폐허
  lexicon: desolātiō
  rationale: 명사적 표현을 살려 재난 이후의 황폐 상태를 뜻하는 ‘황폐함’으로 옮겼습니다.
- source_word: humilitate sanctificationis uestrae
  english_pob_choice: the humiliation of your sanctuary
  chosen_korean: 너희 성소의 비천함
  alternatives_korean:
  - 너희 성소의 낮아짐
  - 너희 성소의 수치
  lexicon: humilitas / sanctificatio
  rationale: POB의 ‘humiliation’을 문자적으로 반영해 ‘비천함’을 택했고, sanctificationis는 여기서 ‘성소’로 이해되는 문맥에 맞춰 처리했습니다.
theological_decisions:
- issue: 시온과 성소에 대한 중보 기도의 목적 표현
  chosen_reading: 이스라엘의 회복을 위한 탄식이 아니라, 시온의 황폐와 성소의 비천함을 두고 하나님께 긍휼을 구하는 기도로 읽었습니다.
  alternative_readings:
  - 포로 공동체 전체를 위한 일반적 중보
  - 성소의 정결 회복을 위한 기도
  rationale: 라틴 본문과 POB가 모두 장소·상태를 구체화하므로, 기도의 초점을 시온/성소의 실제 상태에 두는 것이 더 직접적입니다.
  doctrine_reference: 공동체적 중보와 성소 회복
