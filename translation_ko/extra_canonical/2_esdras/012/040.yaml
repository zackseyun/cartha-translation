  to: 그리고 온 백성이 일곱 날이 지났는데도 내가 성으로 돌아오지 않았다는 것을 들었을 때, 가장 낮은 이부터 가장 높은 이까지 모두 함께 모여 와서[a]
  rationale: 원문에 없는 ‘그에게’를 삭제하고, 한국어 문말을 연결형 ‘와서’로 처리하여 목적어가 다음 절에 이어지는 원문의 미완성 구조를 보존했습니다. 범위 관용구는 현대 한국어에서 자연스럽도록 다듬되, 공동체 전체의 포괄성과 대조를 유지했습니다.
