  text: ostendere tibi. Et profectus est a me. et factum est cum audisset omnis populus, quoniam pertransierunt septem dies, et ego non fuissem reuersus in ciuitatem, et congregauit se omnis a minimo usque ad maximum et uenit ad
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/040.yaml
  text: And it happened, when all the people heard that seven days had passed and I had not returned to the city, that all of them gathered together, from the least to the greatest, and came to
translation:
  language: ko
  text: 그리고 온 백성이 일곱 날이 지났는데도 내가 성으로 돌아오지 않았다는 것을 들었을 때, 가장 낮은 이부터 가장 높은 이까지 모두 함께 모여 와서[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 원문은 여기서 ‘와서’에 해당하는 말로 끝나며, 목적어와 이어지는 내용은 다음 절에 계속됩니다. 영어 POB도 “came to”로 문장을 열어 둡니다.
    reason: source_note
lexical_decisions:
- source_word: factum est cum audisset
  english_pob_choice: And it happened, when ... heard
  chosen_korean: “...을/를 들었을 때”로 옮기고, 앞의 사건 전환은 “그리고 ...”로 처리했습니다.
  alternatives_korean:
  - “그리고 ...를 듣게 되었을 때”
  - “...을 듣고 나서”
  lexicon: factum est cum + 접속문
  rationale: 라틴어의 사건 전환과 종속시간절 구조를 자연스러운 한국어 서술로 옮기되, 원문의 서사적 흐름을 유지했습니다.
- source_word: omnis populus
  english_pob_choice: all the people
  chosen_korean: “모든 백성”
  alternatives_korean:
  - “온 백성”
  - “모든 사람들”
  lexicon: populus
  rationale: 집합적 공동체를 가리키는 표현으로, 영어 POB의 “all the people”을 과도하게 개인화하지 않도록 했습니다.
- source_word: a minimo usque ad maximum
  english_pob_choice: from the least to the greatest
  chosen_korean: “가장 작은 사람부터 가장 큰 사람까지”
  alternatives_korean:
  - “가장 낮은 사람부터 가장 높은 사람까지”
  - “지위가 가장 낮은 사람부터 가장 높은 사람까지”
  lexicon: idiom a ... usque ad ...
  rationale: 라틴어 관용구의 포괄성을 살리면서 현대 한국어에서 자연스럽고 서열 대비가 분명한 표현으로 옮겼습니다.
- source_word: ad ...
  english_pob_choice: and came to
  chosen_korean: 문장 끝의 미완성 방향성을 살려 “그에게 왔습니다”로 처리했습니다.
  alternatives_korean:
  - “...로 왔습니다”
  - “...에게 왔습니다”
  lexicon: ad + 목적지/대상
  rationale: 원문이 다음 절로 이어지는 미완성 형태이므로, 한국어에서도 완결을 강하게 만들지 않고 도착 방향만 남겼습니다.
theological_decisions:
- issue: 본문이 다음 절로 이어지는 미완성 종결
  chosen_reading: 문장 말미를 완결된 독립절로 만들지 않고, 다음 절로 이어지는 서술의 긴장을 보존했습니다.
  alternative_readings:
  - 완결형으로 “...왔습니다.”라고 단정적으로 마무리하기
  - 줄임표로 미완성을 과도하게 강조하기
  rationale: 라틴어 원문과 영어 POB 모두 끝이 이어지는 형식이므로, 한국어도 서사적 미완성을 보존하는 쪽이 원문 충실도가 높습니다.
  doctrine_reference: source-text integrity
- issue: ‘백성’의 집합적 범위
  chosen_reading: 개별 인물들의 단순 합이 아니라 공동체 전체가 반응한 것으로 읽었습니다.
  alternative_readings:
  - “사람들”로 일반화하기
  - “무리”로 축소하기
  rationale: omnis populus는 공동체 전체를 뜻하므로, 서술의 규모와 공적 성격을 유지하는 번역이 적절합니다.
  doctrine_reference: narrative semantics
