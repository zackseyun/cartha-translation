translation:
  language: ko
  text: 당신이 보신 대로입니다[a]. 그리고 당신이 보신, 숲에서 깨어나 포효하며 독수리에게 말하고 그 독수리의 불의한 행위들과 그가 한 모든 말을 책망하던 그 사자는, 당신이 들으신 그대로입니다—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 보셨습니다.’
    reason: 라틴어 uidisti는 앞선 환시를 확인하는 독립 진술(‘당신이 보셨습니다’)로도, ‘당신이 보신 대로’라는 연결 표현으로도 옮길 수 있습니다.
lexical_decisions:
- source_word: uidisti
  english_pob_choice: as you saw.
  chosen_korean: 당신이 보셨습니다.
  alternatives_korean:
  - 당신이 보신 대로입니다.
  - 보셨습니다.
  lexicon: Latin uidisti
  rationale: 문맥상 다음 절로 넘어가기 전 화자의 확인 진술이므로, 단순 과거로 옮겨 서술의 흐름을 유지했습니다.
- source_word: silua
  english_pob_choice: forest
  chosen_korean: 숲
  alternatives_korean:
  - 숲속
  - 삼림
  lexicon: Latin silua
  rationale: latin silua의 기본 의미를 자연스럽게 살리되, 문학적이면서도 현대 한국어에서 무리 없는 ‘숲’을 택했습니다.
- source_word: leonem ... euigilantem mugientem et loquentem
  english_pob_choice: the lion ... rousing itself ... roaring and speaking
  chosen_korean: 일어나 포효하며 말하고 있던 사자
  alternatives_korean:
  - 잠에서 깨어 포효하며 말하는 사자
  - 깨어나 포효하며 말하는 사자
  lexicon: Latin euigilantem / mugientem / loquentem
  rationale: euigilantem은 단순히 ‘깨어나다’보다 ‘일어나’가 장면성을 더 잘 살리고, mugientem의 동물 울음은 ‘포효하다’가 가장 직접적입니다.
- source_word: arguentem eam iniustitias ipsius et omnes sermones eius
  english_pob_choice: reproving it for its injustices and all its words
  chosen_korean: 그 독수리의 불의와 그 말들을 모두 책망하던
  alternatives_korean:
  - 그것의 불의와 모든 말을 꾸짖던
  - 그 독수리의 불의와 모든 말을 질책하던
  lexicon: Latin arguere / iniustitiae / sermones
  rationale: arguere는 단순 비난보다 ‘책망하다’가 대화적·예언적 뉘앙스를 더 잘 반영하며, iniustitias는 도덕적·법적 잘못으로서 ‘불의’가 적절합니다.
theological_decisions:
- issue: Latin source의 장면 연결을 한국어에서 어떻게 유지할지
  chosen_reading: 앞 절의 ‘당신이 보셨습니다’ 뒤에 사자 장면을 이어 붙여, 환시의 연속성과 해설적 말하기를 유지했습니다.
  alternative_readings:
  - 사자에 대한 부분을 새 문장으로 끊는 방식
  - ‘당신이 보신 대로’로만 요약하는 방식
  rationale: 이 절은 단순한 시각 보고가 아니라 환시 해석의 연결부이므로, 장면을 생략하거나 약화하면 본문의 논증 흐름이 손상됩니다.
  doctrine_reference: 본문 해석의 연속성
