source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: qui perficient nouissima eius. Et quoniam uidisti caput maius non apparescens, quoniam unus ex eis super lectum suum morietur, et tamen cum tormentis. Nam duo qui superauerunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/026.yaml
  text: and complete its final acts. And because you saw the larger head disappearing[a], it means that one of them will die on his bed, yet with torments. For the two who survived,
  footnotes:
  - marker: a
    text: Or 'and complete its last acts.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 마지막 일들을 완수할 것입니다. 그리고 더 큰 머리가 사라지는 것을 보았으니, 그것은 그들 가운데 하나가 자기 침상에서 죽되, 고통을 겪으면서 죽을 것임을 뜻합니다. 살아남은 두 사람은[a]
  philosophy: formal
  footnotes:
  - marker: a
    text: 또는 ‘그 마지막 일들을 완수할 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: perficient nouissima eius
  english_pob_choice: and complete its final acts
  chosen_korean: 그리고 그 마지막 일들을 완수할 것입니다
  alternatives_korean:
  - 그리고 그것의 마지막 일을 끝마칠 것입니다
  - 그리고 그것의 최후의 일들을 이룰 것입니다
  lexicon: perficere / nouissima
  rationale: perficient는 단순한 ‘끝내다’보다 ‘완수하다’가 더 적합하며, nouissima는 문맥상 ‘마지막 일들’로 옮겨 원문의 종결·마무리 뉘앙스를 살렸습니다.
- source_word: caput maius non apparescens
  english_pob_choice: the larger head disappearing
  chosen_korean: 더 큰 머리가 사라지는 것
  alternatives_korean:
  - 더 큰 머리가 보이지 않는 것
  - 더 큰 머리가 나타나지 않는 것
  lexicon: caput maius / non apparescens
  rationale: non apparescens은 ‘나타나지 않다’의 상태를 가리키지만, 전체 문맥에서는 ‘사라지는 것’이 자연스럽고 의미를 잘 드러냅니다.
- source_word: super lectum suum morietur, et tamen cum tormentis
  english_pob_choice: will die on his bed, yet with torments
  chosen_korean: 자기 침상에서 죽되, 고통을 겪으면서 죽을 것
  alternatives_korean:
  - 자기 침상에서 죽되, 고통 속에서 죽을 것
  - 자기 침상에서 죽지만, 고통이 따를 것
  lexicon: super lectum suum morietur / cum tormentis
  rationale: super lectum suum은 문자적으로 ‘자기 침상 위에서’이며, cum tormentis은 완화하지 않고 ‘고통을 겪으면서’로 직접 살렸습니다.
theological_decisions:
- issue: 이 구절은 예언적 상징을 해석하는 설명문으로서, 직설적 예고와 상징 해석을 함께 유지해야 합니다.
  chosen_reading: 상징을 해설하는 서술을 그대로 따라, ‘그것은 ... 뜻합니다’로 해석 관계를 분명히 했습니다.
  alternative_readings:
  - 보다 완곡하게 ‘그 의미는 ...입니다’
  - 상징을 약화해 단순 서술형으로 처리
  rationale: 원문은 단순 묘사가 아니라 환상 해석의 일부이므로, 해석 표지를 분명히 두어 독자가 상징-해석 구조를 놓치지 않게 해야 합니다.
  doctrine_reference: 예언 해석의 문맥 보존
