    reason: 영어 POB 감사 이력에 보존된 비교급 대안을 한국어에서도 각주로 제시합니다. 본문은 제공된 라틴어의 비비교급 명사형을 따라 유지합니다.
lexical_decisions:
- source_word: super terram
  english_pob_choice: upon the earth
  chosen_korean: 땅 위에
  alternatives_korean:
  - 땅에
  - 지상에
  lexicon: super + acc.
  rationale: 라틴어 전치사구는 위치를 분명히 하므로, ‘upon the earth’를 따라 문장 앞에 ‘땅 위에’로 옮겨 원문의 범위를 보존했습니다.
- source_word: erit
  english_pob_choice: it will be
  chosen_korean: 될 것입니다
  alternatives_korean:
  - 입니다
  - 되겠습니다
  lexicon: sum/fut.
  rationale: 미래 시제를 평이하고 공손한 합쇼체로 처리해, 원문의 예언적 진술을 자연스럽게 살렸습니다.
- source_word: timoratio omnium regnorum
  english_pob_choice: the terror of all the kingdoms
  chosen_korean: 모든 왕국들의 두려움
  alternatives_korean:
  - 모든 왕국들의 공포
  - 모든 왕국들을 떨게 하는 존재
  lexicon: timoratio + omnium regnorum
  rationale: POB가 채택한 최종 의미를 따라 비교급을 덧붙이지 않고, 라틴어 명사구의 핵심 의미인 ‘두려움/공포의 대상’으로 옮겼습니다.
- source_word: quae fuerunt ante eam
  english_pob_choice: that were before it
  chosen_korean: 그 전에 있었던
  alternatives_korean:
  - 그 앞에 있었던
  - 이전의
  lexicon: quae fuerunt ante eam
  rationale: ‘it’은 앞선 왕국을 가리키므로, 자연스러운 한국어 관계절로 풀어 ‘그 전에 있었던’으로 처리했습니다.
theological_decisions:
- issue: 예언적 진술의 시제와 강도
  chosen_reading: 미래형 예언 진술로 유지하되, 본문에 없는 비교급 강화는 넣지 않았습니다.
  alternative_readings:
  - ‘모든 왕국보다 더 두려운’ 식의 비교급 강화
  rationale: 최신 수정본이 라틴어 timoratio를 비교급이 아닌 ‘두려움’의 명사로 보라고 조정했으므로, 그 의미 긴장을 그대로 보존했습니다.
  doctrine_reference: source fidelity / textual semantics
