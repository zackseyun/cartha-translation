  terminology: ‘왕국’과 ‘공포’는 본문의 정치적 범위와 `timoratio`의 위협적 명사 의미를 자연스럽게 전달합니다. 비교급은 본문에 넣지 않았으며, 영어 POB 감사 이력의 대안은 각주로만 보존했습니다.
