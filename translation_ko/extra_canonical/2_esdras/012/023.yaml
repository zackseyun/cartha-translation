  verdict: revise
  source_fidelity: 본문의 핵심 의미는 대체로 정확합니다. 특히 in ea를 단수로 반영한 ‘그 안에서’와, 세 왕국을 일으키시는 분 및 그들이 다스린다는 주어의 구분은 라틴어에 충실합니다. 다만 현재 각주의 대안 문구가 본문 번역과 동일하여, 영어 POB 감사 기록의 복수 대안(‘in them’)을 반영하지 못합니다.
  naturalness: ‘세 개의 머리’보다 상징적 대상의 수를 셀 때 자연스러운 ‘세 머리’가 더 현대 한국어 성서 문체에 잘 맞습니다. 나머지 문장은 합쇼체의 격식 있는 예언적 문체로 자연스럽습니다.
  terminology: ‘지극히 높으신 분’, ‘왕국’, ‘해석’은 적절합니다. ‘새롭게 하다’는 renovabit의 의미 범위를 과도하게 좁히지 않는 안전한 선택입니다.
