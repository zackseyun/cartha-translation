id: 2ES.12.23
reference: 2 Esdras 12:23
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'quiescentia, Haec est interpretatio : in nouissimis eius suscitabit altissimus tria regna et renouabit in ea multa et dominabunt'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/023.yaml
  text: 'And because you saw three heads at rest[a], this is the interpretation: in its last days the Most High will raise up three kingdoms and renew many things in it, and they will rule.'
  footnotes:
  - marker: a
    text: Or 'renew many things in them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너는 세 개의 머리가 쉬고 있는 것을 보았으므로, 이것이 해석입니다. 그 마지막 때에 지극히 높으신 분께서 세 왕국을 일으키시고 그 안에서 많은 것들을 새롭게 하실 것이며, 그들이 다스릴 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그 안에서 많은 것들을 새롭게 하실 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: quiescentia
  english_pob_choice: three heads at rest
  chosen_korean: 세 개의 머리가 쉬고 있는 것
  alternatives_korean:
  - 세 머리가 잠잠한 것
  - 세 머리가 휴식하고 있는 것
  lexicon: quiescentia → '쉬고 있는'
  rationale: 라틴어 quiescentia는 ‘쉬다/잠잠하다’의 상태를 가리키므로, 단순히 형태만 옮겨 ‘쉬고 있는 것’으로 자연스럽게 살렸습니다.
- source_word: Haec est interpretatio
  english_pob_choice: this is the interpretation
  chosen_korean: 이것이 해석입니다
  alternatives_korean:
  - 이것이 뜻입니다
  - 이것이 해석입니다
  lexicon: interpretatio → '해석'
  rationale: 문맥상 상징의 의미를 푸는 진술이므로, 평이하면서도 주석적 기능을 드러내는 ‘해석’이 적절합니다.
- source_word: altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지존자
  - 가장 높으신 분
  lexicon: altissimus → '지극히 높으신 분'
  rationale: 하나님을 가리키는 초월적 칭호를 한국어에서 자연스럽게 드러내면서도, 위격적 존칭을 유지했습니다.
- source_word: renouabit in ea multa
  english_pob_choice: renew many things in it
  chosen_korean: 그 안에서 많은 것들을 새롭게 하실 것이며
  alternatives_korean:
  - 그 안에서 많은 것을 갱신하실 것이며
  - 그 안에서 많은 것들을 회복하실 것이며
  lexicon: renovare → '새롭게 하다'
  rationale: 라틴어 renovabit은 단순 보수보다 갱신·새로움의 뉘앙스가 있어, POB의 ‘renew’에 맞춰 ‘새롭게 하다’로 옮겼습니다.
- source_word: in ea
  english_pob_choice: in it
  chosen_korean: 그 안에서
  alternatives_korean:
  - 그것 안에서
  - 그 안에
  lexicon: in ea → '그 안에서'
  rationale: audited revision이 지적하듯 ea는 여성 단수로 대상 전체를 가리키므로, ‘그 안에서’로 반영해 전치사 의미와 지시 대상을 함께 살렸습니다.
theological_decisions:
- issue: 지극히 높으신 분의 주권적 행위와 이어지는 통치 주체의 표현
  chosen_reading: ‘지극히 높으신 분께서 … 일으키시고 … 새롭게 하실 것이며, 그들이 다스릴 것입니다’로 옮겨 주권적 행위와 피동적 통치를 함께 드러냈습니다.
  alternative_readings:
  - ‘일으키실 것이며 … 그들이 통치할 것입니다’
  - ‘세 왕국을 세우시고 … 그들이 다스릴 것입니다’
  rationale: 본문은 하나님이 먼저 역사하시고 그 결과로 ‘그들이 다스림’을 말하므로, 주어와 동사의 관계를 분리해 신학적 긴장을 보존했습니다.
  doctrine_reference: 섭리와 역사 주권
- issue: ‘세 왕국’의 정치적 이미지와 ‘많은 것들을 새롭게 함’의 범위
  chosen_reading: ‘세 왕국’과 ‘많은 것들을 새롭게 하실 것’은 상징적-역사적 예언으로 유지하고, 더 구체화하지 않았습니다.
  alternative_readings:
  - ‘세 나라’
  - ‘많은 것들을 회복하실 것’
  rationale: 라틴어 regna는 문자적으로 왕국들을 뜻하므로 이를 약화하지 않았고, renovabit의 범위도 원문이 허용하는 만큼만 일반적으로 표현했습니다.
  doctrine_reference: 예언 상징의 해석
- issue: 문장 종결의 미래 서술
  chosen_reading: 미래형 ‘다스릴 것입니다’를 사용해 예언적 선언의 톤을 유지했습니다.
  alternative_readings:
  - ‘다스립니다’
  - ‘다스릴 것입니다’
  rationale: 본문 전체가 해석형 예언 진술이므로, 한국어에서도 미래형으로 일관성을 살렸습니다.
  doctrine_reference: 예언체 문체
