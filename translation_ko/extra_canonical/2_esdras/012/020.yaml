    rationale: 라틴어 미래 능동 직설법은 '일어날 것입니다'가 직접 대응합니다. '-게 되다'는 사건이 어떤 경위로 발생하게 됨을 암시하여 원문에 없는 뉘앙스를 보탭니다.
  - severity: low
