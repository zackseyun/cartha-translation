  text: 'uidisti subalares octo coherentes alis eius, Haec est interpretatio : exsurgent enim in ipso octo reges, quorum erunt tempora'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/020.yaml
  text: '“And because you saw eight little wings clinging to its wings, this is the interpretation: eight kings will arise in it,'
translation:
  language: ko
  text: 「그리고 네가 그 날개들에 붙어 있는 여덟 개의 작은 날개를 보았으니, 그 해석은 이렇습니다. 곧 그 안에서 여덟 왕이 일어날 것입니다,」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uidisti
  english_pob_choice: you saw
  chosen_korean: 그대가 ... 보았으니
  alternatives_korean:
  - 보았으니
  - 보셨으니
  - 보았다면
  lexicon: Lat. uidisti
  rationale: 서술형 직설을 유지하되, 이어지는 해석 도입부와 연결되도록 이유를 나타내는 '-았으니'로 옮겼습니다.
- source_word: subalares octo
  english_pob_choice: eight little wings
  chosen_korean: 여덟 개의 작은 날개
  alternatives_korean:
  - 여덟 작은 날개
  - 여덟 개의 날갯죽지
  - 여덟 날개
  lexicon: Lat. subalares octo
  rationale: subalares는 날개에 붙은 작은 날개/보조 날개를 가리키므로, POB의 'little wings'를 자연스러운 한국어로 풀어 '작은 날개'로 옮겼습니다.
- source_word: coherentes alis eius
  english_pob_choice: clinging to its wings
  chosen_korean: 그의 날개에 붙어 있는
  alternatives_korean:
  - 그의 날개에 달라붙어 있는
  - 그의 날개에 매달린
  - 그의 날개에 밀착한
  lexicon: Lat. coherentes alis eius
  rationale: coherentes의 결속·부착 감각을 살려 '붙어 있는'으로 옮겼고, alis eius는 대상의 소유격을 반영해 '그의 날개'로 처리했습니다.
- source_word: exsurgent enim in ipso octo reges
  english_pob_choice: eight kings will arise in it
  chosen_korean: 곧 그 안에서 여덟 왕이 일어나게 될 것입니다
  alternatives_korean:
  - 곧 그 안에서 여덟 왕이 일어날 것입니다
  - 여덟 왕이 그 안에서 일어날 것입니다
  - 그 안에서 여덟 왕이 나올 것입니다
  lexicon: Lat. exsurgent ... octo reges
  rationale: exsurgent은 단순 출현보다 역사적 부상·등장을 담아 '일어나게 될 것입니다'로 번역했고, in ipso는 '그 안에서'로 공간/범위 관계를 드러냈습니다.
theological_decisions:
- issue: 해석문 도입부의 문체와 예언적 미래 시제
  chosen_reading: 「이것이 그 해석입니다」와 「일어나게 될 것입니다」로 예언 해석의 선언성과 미래성을 함께 살렸습니다.
  alternative_readings:
  - 이것이 뜻입니다
  - 이렇게 해석됩니다
  - 일어날 것입니다
  rationale: 본문이 환상 해석의 공식 문구와 미래 예언을 함께 담고 있으므로, 해석 도입과 예언 시제를 분명히 구분해 전달했습니다.
  doctrine_reference: apocalyptic interpretation formula
