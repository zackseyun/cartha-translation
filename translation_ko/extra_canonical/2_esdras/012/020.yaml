  source_fidelity: 라틴어의 핵심 요소(여덟 작은 날개, 날개들에 붙어 있음, 그 안에서 일어날 여덟 왕)는 대체로 반영되었습니다. 다만 exsurgent의 단순 미래를 '-게 될 것입니다'로 옮기면 불필요하게 사역·전개 뉘앙스가 더해질 수 있어 직접적인 미래형이 더 충실합니다. alis는 복수이므로 '날개들'로 명시하는 편이 안전합니다.
  naturalness: 합쇼체 문장으로 자연스럽지만, '그대가'와 '-입니다/-것입니다'의 결합은 현대 표준어 성서 문체에서는 다소 문어적이고 혼합적으로 들립니다. '네가'가 더 자연스럽습니다. '그 해석입니다'보다 환상 해석의 관용적 도입인 '그 해석은 이렇습니다'가 매끄럽습니다.
  terminology: subalares는 본문 내에서 별도 전문 용어로 고정할 필요 없이 '작은 날개'로 유지할 수 있습니다. '왕' 및 '해석'도 적절합니다. in ipso의 지시 대상은 환상의 독수리이지만, 원문의 대명사적 모호성을 보존하여 '그 안에서'로 유지합니다.
  issues:
