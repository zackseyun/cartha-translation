  rationale: 제공된 원문에 있는 secreta haec를 보완하고, uisum fuerit의 관용적 의미와 ut tibi ostendatur의 수동적 결과를 구별하여 옮겼습니다. 제공된 라틴어에는 영어 감사 기록에 있는 ‘그리고 그가 내게서 떠났다’에 해당하는 문구가 없으므로, 원문 우선 원칙에 따라 개정문에 추가하지 않았습니다.
