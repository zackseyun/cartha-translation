  text: But you, remain here still for seven more days, so that whatever it may please the Most High to show you may be shown to you.” And he departed from me.
translation:
  language: ko
  text: 그러나 당신은 여기서 아직 일곱 날 더 머무르십시오. 그러면 지극히 높으신 분께서 당신에게 보이시고자 하시는 것은 무엇이든지 당신에게 보일 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 sustine는 여기서 단순한 ‘기다리다’보다 ‘그 자리에서 머무르다/견디다’의 뉘앙스를 갖습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: Tu autem adhuc sustine hic alios dies septem
  english_pob_choice: But you, remain here still for seven more days
  chosen_korean: 그러나 당신은 여기서 아직 일곱 날 더 머무르십시오
  alternatives_korean:
  - 그러나 당신은 여기서 아직 일주일 더 기다리십시오
  - 그러나 당신은 여기서 아직 일곱 날 더 참고 있으십시오
  lexicon: sustinere
  rationale: sustine를 단순한 ‘기다리다’보다 더 가까운 ‘머무르십시오’로 옮겨, 자리에서 그대로 머무르라는 요청을 살렸습니다.
- source_word: quicquid uisum fuerit altissimo
  english_pob_choice: whatever it may please the Most High to show you
  chosen_korean: 지극히 높으신 분께서 당신에게 보이시고자 하시는 것은 무엇이든지
  alternatives_korean:
  - 지극히 높으신 분이 당신에게 보이실 무엇이든지
  - 지극히 높으신 분께서 당신에게 보여 주시려는 것은 무엇이든지
  lexicon: uisum fuerit / altissimo
  rationale: visum fuerit의 ‘보이실 것’이라는 수동적 뉘앙스를 살리면서, altissimo는 하나님을 가리키는 칭호로 ‘지극히 높으신 분’으로 옮겼습니다.
- source_word: altissimo
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 이
  - 지극히 높으신 하나님
  lexicon: altissimus
  rationale: 문맥상 인격적 호칭이므로 단순 형용사보다 칭호형 표현을 택해, ‘Most High’의 위격적 의미를 드러냈습니다.
theological_decisions:
- issue: 하나님 호칭을 어떻게 옮길지
  chosen_reading: altissimo를 ‘지극히 높으신 분’으로 옮겨, 본문이 직접 ‘하나님’이라고 명시하지 않더라도 신적 호칭으로 읽히게 했습니다.
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 이
  rationale: 라틴 본문은 칭호만 제시하므로, 원문의 절제된 표현을 유지하면서도 한국어에서 자연스럽게 신적 지시를 전달하는 중립적 호칭을 택했습니다.
  doctrine_reference: 신적 칭호의 번역 관례
