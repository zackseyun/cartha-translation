  source_fidelity: 초고는 제공된 라틴어 첫 구절 "seruare secreta haec"(‘이 비밀들을 지키다/보존하다’)을 옮기지 않아 본문 요소 하나가 누락되었습니다. 또한 "quicquid uisum fuerit altissimo"는 직역하면 ‘지극히 높으신 분께 좋게 여겨지는 것은 무엇이든지’라는 관용적 표현이며, 뒤의 수동형 "ut tibi ostendatur"가 그것이 독자에게 보이게 됨을 나타냅니다.
  naturalness: ‘여기서 아직 일곱 날 더 머무르십시오’는 자연스럽고 합쇼체에도 적절합니다. 다만 ‘보이시고자 하시는’은 원문의 ‘좋게 여기다’ 관용구보다 해석적이므로, ‘좋게 여기시는’으로 옮기는 편이 더 충실합니다. ‘보이게 될 것입니다’는 한국어에서 자연스럽게 수동의 의미를 전달합니다.
  terminology: altissimo는 원문의 절제된 신적 칭호를 따라 ‘지극히 높으신 분’으로 유지할 수 있습니다. ‘비밀들’은 secreta의 복수형을 반영합니다.
