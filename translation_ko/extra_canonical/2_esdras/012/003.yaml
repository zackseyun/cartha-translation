  naturalness: ‘큰 마음의 혼란’보다 ‘큰 정신적 혼란’이 현대 표준어에서 자연스럽습니다. 또한 각주 표지는 대안 번역의 대상인 excessu mentis 바로 뒤에 두는 것이 명확합니다.
