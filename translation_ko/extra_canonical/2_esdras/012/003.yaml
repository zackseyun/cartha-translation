revisions:
- from: 그러자 나는 큰 마음의 혼란과 큰 두려움에서 깨어났고, 내 영에게 말했습니다. “보십시오, 당신이 이것들을 내게 가져오셨습니다. 왜냐하면”[a]
  to: 그러자 나는 큰 정신적 혼란[a]과 큰 두려움에서 깨어나 내 영에게 말했습니다. “보십시오, 당신이 이런 일들을 내게 겪게 하셨습니다. 이는”
  rationale: ‘정신적 혼란’은 excessu mentis의 의미를 현대 한국어로 자연스럽게 전달합니다. haec의 복수는 ‘이런 일들’로, praestitisti mihi의 문맥적 효과는 ‘내게 겪게 하셨습니다’로 반영했습니다. in eo quod가 뒤 문장으로 이어지는 점은 마침표 뒤의 ‘이는’으로 보존했으며, 대안 번역 각주는 해당 표현에 직접 연결했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:30:14Z'
