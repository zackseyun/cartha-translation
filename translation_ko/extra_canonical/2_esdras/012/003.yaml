  text: 'et ego a multo excessu mentis et a magno timore uigilaui, et dixi spiritui meo: Ecce tu mihi praestitisti haec in eo quod'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/003.yaml
  text: Then I awoke from great bewilderment of mind and from great fear[a], and I said to my spirit, “See, you have brought these things upon me, because
  footnotes:
  - marker: a
    text: Or 'the great excess of my mind'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 나는 큰 정신적 혼란[a]과 큰 두려움에서 깨어나 내 영에게 말했습니다. “보십시오, 당신이 이런 일들을 내게 겪게 하셨습니다. 이는”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 황홀 상태’로 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: a multo excessu mentis
  english_pob_choice: from great bewilderment of mind
  chosen_korean: 큰 마음의 혼란에서
  alternatives_korean:
  - 깊은 황홀상태에서
  - 큰 정신의 과잉에서
  - 큰 혼란에서
  lexicon: excessus mentis
  rationale: 라틴어 관용구인 excessus mentis는 단순한 ‘과잉’이 아니라 정신의 동요·혼란 상태를 가리키므로, 직역보다 의미를 드러내는 ‘마음의 혼란’이 원문 기능에 가깝습니다.
- source_word: a magno timore
  english_pob_choice: from great fear
  chosen_korean: 큰 두려움에서
  alternatives_korean:
  - 큰 공포에서
  - 몹시 두려운 마음에서
  lexicon: timor
  rationale: timor의 기본 의미를 살려 ‘두려움’으로 옮기되, 문맥상 병렬 구조를 유지해 앞 구절과 같은 종결형으로 맞췄습니다.
- source_word: haec
  english_pob_choice: these things
  chosen_korean: 이것들을
  alternatives_korean:
  - 이 일들을
  - 이러한 것들을
  lexicon: haec
  rationale: 지시대명사 복수형을 한국어에서도 복수 목적어로 반영해, 영어 개정판이 수정한 복수 감각을 그대로 드러냈습니다.
- source_word: in eo quod
  english_pob_choice: because
  chosen_korean: 왜냐하면
  alternatives_korean:
  - ~하기 때문에
  - ~한 까닭에
  - ~라는 점에서
  lexicon: in eo quod
  rationale: 문장이 여기서 끊기지만 라틴어 표현은 원인 설명을 시작하므로, 한국어에서는 자연스러운 접속 표현으로 그 기능을 표시했습니다.
theological_decisions:
- issue: visionary/psychological state of awakening
  chosen_reading: ‘마음의 혼란’으로 옮겨, 깨어남(uigilaui)이 단순한 수면 각성이 아니라 환시적·심리적 상태에서의 소생임을 드러냈습니다.
  alternative_readings:
  - ‘깊은 황홀상태’
  - ‘정신의 과잉’
  rationale: 이 구절은 예스라가 어떤 비정상적 내적 상태에서 깨어나는 장면이므로, 경험의 성격을 과도하게 신비화하지 않으면서도 원문의 강도를 유지하는 표현을 택했습니다.
  doctrine_reference: extra-canonical vision narrative
