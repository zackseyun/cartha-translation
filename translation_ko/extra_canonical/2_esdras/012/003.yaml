    rationale: in eo quod는 다음 구절로 이어지는 미완의 근거절입니다. 한국어에서는 ‘이는’으로 그 이어짐을 보존할 수 있으며, 대안 번역 각주는 해당 구 바로 뒤에 놓아야 합니다.
