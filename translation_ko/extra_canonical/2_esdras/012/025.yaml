    reason: textual_variant
lexical_decisions:
- source_word: aquilae
  english_pob_choice: of the eagle
  chosen_korean: 독수리의 것입니다
  alternatives_korean:
  - 독수리의 것
  - 그 독수리의 것입니다
  lexicon: aquila
  rationale: 라틴어 속격 aquilae를 독수리의 소유/연관을 나타내는 표현으로 옮겼습니다. 한국어에서는 간결하게 ‘독수리의 것입니다’가 문맥상 자연스럽습니다.
- source_word: recapitulabunt
  english_pob_choice: will bring its impieties to a head
  chosen_korean: 그 불경을 끝까지 몰아갑니다
  alternatives_korean:
  - 그 불경을 한데 모읍니다
  - 그 불경을 요약합니다
  - 그 불경을 절정에 이르게 합니다
  lexicon: recapitulabunt
  rationale: 해당 동사는 단순한 ‘요약’보다 악이 완결점에 이르도록 몰아가는 뜻이므로, POB의 수정된 뉘앙스인 ‘bring to a head’를 살려 ‘끝까지 몰아가다’로 옮겼습니다.
- source_word: impietates
  english_pob_choice: impieties
  chosen_korean: 불경
  alternatives_korean:
  - 경건치 않음
  - 불경건함
  - 악행
  lexicon: impietas
  rationale: 라틴어 impietates는 하나님께 대한 불경과 경건 없음의 복수형이므로, 도덕 일반보다 신학적 위반을 드러내는 ‘불경’이 가장 직접적입니다.
theological_decisions:
- issue: apocalyptic pun and consummation of evil
  chosen_reading: ‘끝까지 몰아가며’로 번역해 악이 누적되어 절정에 이르는 묵시적 뉘앙스를 살렸습니다.
  alternative_readings:
  - ‘요약하며’
  - ‘한데 모으며’
  rationale: POB의 수정 이유가 ‘bring to a head’와 앞절의 ‘heads’ 말장난을 반영하는 것이므로, 단순한 정리나 요약이 아니라 악의 성숙/완결을 드러내는 표현을 택했습니다.
  doctrine_reference: 묵시문학의 심판적 누적-완결 이미지
- issue: 문장 결속의 마지막 접속사 et
  chosen_reading: 한국어에서 문장 끝의 ‘그리고/또’는 생략하고 미완결 어미로 처리했습니다.
  alternative_readings:
  - ‘그리고’
  - ‘또’
  rationale: 라틴어 et를 직역해도 한국어에서는 어색하므로, 본절이 다음 절로 이어지는 구조를 살리면서 자연스럽게 연결했습니다.
  doctrine_reference: 문장 연결의 문체적 처리
