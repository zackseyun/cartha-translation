  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et sicut portus naui saluatae a tempestate. Aut non sufficiunt
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/043.yaml
  text: and like a harbor for a ship saved from the storm.
translation:
  language: ko
  text: 그리고 폭풍에서 구해진 배에게는 항구처럼 그랬습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: sicut portus
  english_pob_choice: like a harbor
  chosen_korean: 항구처럼
  alternatives_korean:
  - 항만처럼
  - 피난처처럼
  - 안전한 정박지처럼
  lexicon: portus → 항구
  rationale: 라틴어 portus는 배가 들어와 머무는 항구를 가리키므로, 영어 POB의 ‘harbor’를 따라 가장 직접적인 한국어인 ‘항구’로 옮겼습니다.
- source_word: naui saluatae
  english_pob_choice: for a ship saved
  chosen_korean: 구해진 배에게는
  alternatives_korean:
  - 구원받은 배에게는
  - 구조된 배에게는
  - 무사히 건진 배에게는
  lexicon: navis + salvata → 배 + 구해진
  rationale: saluatae는 단순히 ‘안전한’이 아니라 폭풍에서 ‘구해진’ 상태를 나타내므로, 결과 상태를 드러내는 수동 표현으로 옮겼습니다.
- source_word: a tempestate
  english_pob_choice: from the storm
  chosen_korean: 폭풍에서
  alternatives_korean:
  - 폭풍으로부터
  - 풍랑에서
  - 폭풍의 사나움에서
  lexicon: tempestas → 폭풍
  rationale: tempestas는 날씨 일반보다 폭풍/풍랑의 거센 위험을 뜻하므로, 영어의 ‘storm’을 따라 자연스럽게 ‘폭풍’으로 렌더링했습니다.
theological_decisions:
- issue: 비유적 연결 구조
  chosen_reading: ‘그리고 …처럼 그랬습니다’로 앞 문맥의 비교 비유를 이어 주었습니다.
  alternative_readings:
  - 직설적으로 ‘…와 같았습니다’로 처리
  - 문장형식 없이 명사구로만 처리
  rationale: 본문은 항구와 구출된 배의 관계를 비유로 제시하므로, 한국어에서도 비교의 기능을 분명히 드러내는 것이 원문의 힘을 가장 잘 보존합니다.
  doctrine_reference: 문맥적 비유 보존
