  source_fidelity: 라틴어의 비교 표현 *sicut portus naui saluatae a tempestate*는 ‘폭풍에서 구해진 배에/배에게 항구와 같은’이라는 뜻입니다. 초안의 ‘항구처럼 그랬습니다’는 비교의 기준과 서술 관계가 불분명하며, 원문 뒤의 *Aut non sufficiunt*도 누락되었습니다.
  naturalness: ‘배에게는 항구처럼 그랬습니다’는 현대 한국어에서 부자연스럽고 ‘그랬습니다’의 지시 대상도 불명확합니다. ‘폭풍에서 구해진 배에게 항구와 같습니다’가 비유의 관계를 자연스럽고 분명하게 나타냅니다.
  terminology: portus는 ‘항구’, tempestas는 ‘폭풍’, saluata는 ‘구해진’으로 옮긴 선택이 적절합니다. 신학적 전문 용어는 해당 구절에 없습니다.
  issues:
