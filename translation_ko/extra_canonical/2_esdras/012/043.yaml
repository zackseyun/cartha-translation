    rationale: 제시된 라틴어 원문에 포함된 수사의문문을 번역에 반영해야 합니다. 목적어는 발췌문만으로 명시되지 않으므로, 한국어에서는 앞 문맥을 가리키는 중립적 대명사로 보존합니다.
  - severity: medium
