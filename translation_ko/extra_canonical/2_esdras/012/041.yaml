    issue: 절 첫머리의 me가 번역에서 누락됨
    rationale: 라틴어 본문은 앞 문맥에서 이어지는 목적격 ‘me’로 시작한 뒤 ‘et dixerunt mihi’를 이어 갑니다. 초안의 첫 ‘저에게’는 뒤의 mihi만 반영합니다.
  - severity: low
    issue: ‘말하며 이렇게 말했습니다’의 중복
    rationale: dicentes를 한국어에서 별도로 ‘말하며’로 옮기면 ‘말했습니다’와 의미가 중복됩니다.
