  verdict: revise
  source_fidelity: 첫머리의 목적격 me와 뒤이은 mihi를 모두 반영해야 합니다. 초안은 첫 me를 누락하고, mihi만 ‘저에게’로 옮겼습니다. 또한 quid iniuste egimus in te는 ‘불의를 행하다’보다 ‘무슨 부당한 일을 했습니까’가 현대 한국어에서 더 자연스럽고 원문의 질문을 충실히 드러냅니다. 절 끝의 미완 문장과 derelinquens dereliquisti의 강조는 유지합니다.
  naturalness: ‘그들이 저에게 말하며 이렇게 말했습니다’는 라틴어 dicentes의 직역 흔적 때문에 중복되고 부자연스럽습니다. ‘그들이 저에게 이렇게 말했습니다’가 자연스럽습니다. 다만 본문 발췌가 앞 절에서 이어짐을 보이기 위해 첫머리의 단편 ‘저를 … 그리고’는 보존합니다.
  terminology: ‘죄를 짓다’, ‘부당한 일을 하다’, ‘완전히 버리다’는 현대 표준어 합쇼체 문맥에 적절합니다. 기존 각주는 본문과 실질적으로 같은 뜻을 ‘직역’이라고 설명하면서 ‘무엇으로’라는 부자연스러운 표현을 사용하므로, quid peccauimus의 가능한 ‘어떻게’ 해석을 제시하도록 고칩니다.
  issues:
