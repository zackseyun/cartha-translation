    rationale: ‘무엇으로 죄를 지었습니까’는 한국어로 부자연스럽고, 주본문의 ‘무슨 죄를 지었습니까’와의 차이도 분명하지 않습니다.
  revised_text: 저를 … 그리고 그들이 저에게 이렇게 말했습니다. “우리가 당신에게 무슨 죄를 지었으며, 당신에게 무슨 부당한 일을 했습니까? 당신이 우리를 완전히 버리고…”[a]
