base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/041.yaml
  text: me. And they said to me[a], “How have we sinned against you, and what wrong have we done to you, that you have utterly forsaken us and
  footnotes:
  - marker: a
    text: Or 'What have we sinned against you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들이 저에게 말하며 이렇게 말했습니다. “우리가 당신에게 무슨 죄를 지었습니까, 또 당신에게 무슨 불의를 행했습니까? 당신이 우리를 완전히 버리고…”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “우리가 당신에게 무엇으로 죄를 지었습니까”에 가깝습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: Quid peccauimus tibi
  english_pob_choice: How have we sinned against you
  chosen_korean: 우리가 당신에게 무슨 죄를 지었습니까
  alternatives_korean:
  - 우리가 당신에게 어떻게 죄를 지었습니까
  - 우리가 당신에게 어떤 죄를 범했습니까
  lexicon: peccare
  rationale: 라틴어 질문형 표현을 한국어 자연문으로 옮기되, English POB의 수정된 ‘How have we sinned’가 드러내는 항의적·탄식적 뉘앙스를 살렸습니다.
- source_word: quid iniuste egimus in te
  english_pob_choice: what wrong have we done to you
  chosen_korean: 당신에게 무슨 불의를 행했습니까
  alternatives_korean:
  - 당신에게 무슨 잘못을 저질렀습니까
  - 당신에게 어떤 부당한 일을 했습니까
  lexicon: iniuste agere
  rationale: iniuste는 단순한 실수보다 ‘불의/부당함’의 의미가 강하므로, 죄와 병렬되도록 ‘불의를 행하다’로 옮겼습니다.
- source_word: derelinquens dereliquisti nos
  english_pob_choice: you have utterly forsaken us
  chosen_korean: 당신이 우리를 완전히 버리고
  alternatives_korean:
  - 당신이 우리를 아주 버리고
  - 당신이 우리를 철저히 버리고
  lexicon: derelinquere
  rationale: 중복 동사형이 강조하는 ‘완전히/철저히 버림’을 살리기 위해 직역적 반복성을 유지하되, 한국어 문장 완결은 다음 절과의 연속을 고려해 생략형으로 마무리했습니다.
theological_decisions:
- issue: 원문이 절 끝에서 문장이 미완으로 끊기는 형태
  chosen_reading: 한국어도 종결을 닫지 않고 여운을 남기는 미완 구조를 유지했습니다.
  alternative_readings:
  - 문장을 임의로 완결하여 자연스럽게 정리함
  - 후속 절 내용을 보충해 완역함
  rationale: 이 절은 원문 자체가 연결 중에 끝나므로, 번역에서 임의 완결을 하면 본문의 수사적 긴박감과 전승된 단락 경계를 훼손할 수 있습니다.
  doctrine_reference: 본문 비평/문학적 형식 보존
