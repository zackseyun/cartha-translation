  lexicon: quod
  rationale: 라틴어 quod를 영어 POB처럼 단순히 ‘무엇’으로 두기보다, 바로 앞 문맥의 환시 내용을 가리키는 중성적 지시로 풀어 ‘네가 보았던 것’이라고 옮겼습니다.
- source_word: uidisti
  english_pob_choice: you saw
  chosen_korean: 보았던 것
  alternatives_korean:
  - 본 것
  - 보신 것
  lexicon: video
  rationale: 과거 시제를 유지하면서도 해석문 도입 공식의 흐름을 살리기 위해 ‘보았던’으로 옮겼습니다.
- source_word: haec interpretatio eius
  english_pob_choice: this is its interpretation
  chosen_korean: 이것이 그 해석입니다
  alternatives_korean:
  - 이것이 그 뜻입니다
  - 이것이 그 설명입니다
  lexicon: interpretatio
  rationale: interpretatio를 단순한 ‘뜻’보다 원문의 해석 제시 공식에 가깝게 ‘해석’으로 유지했고, eius는 앞의 환시를 가리키는 관계를 살려 ‘그’로 처리했습니다.
theological_decisions:
- issue: 해석 공식의 문체
  chosen_reading: 직설적인 소개문으로 처리하여, 앞선 환시에 대한 설명이 곧바로 이어지는 구조를 드러냈습니다.
  alternative_readings:
  - ‘네가 본 것이며, 이것이 그 뜻입니다’처럼 더 설명적으로 옮기는 방식
  rationale: 이 절은 자체 신학 진술보다 다음 해석 단락으로 넘어가는 도입부이므로, 과잉 설명 없이 라틴어의 간결한 공식을 보존하는 것이 적절합니다.
  doctrine_reference: 해석 도입 공식
