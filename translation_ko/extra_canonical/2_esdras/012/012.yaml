id: 2ES.12.12
reference: 2 Esdras 12:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: uel interpretatus sum. Ecce dies ueniunt et exsurget regnum
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/012.yaml
  text: or as I have interpreted it. Behold, days are coming, and a kingdom will arise,
translation:
  language: ko
  text: 혹은 내가 해석한 대로입니다. 보십시오, 날들이 오고 있으며, 한 나라가 일어날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uel interpretatus sum
  english_pob_choice: or as I have interpreted it
  chosen_korean: 혹은 내가 해석한 대로입니다
  alternatives_korean:
  - 혹은 내가 풀이한 대로입니다
  - 혹은 내가 번역한 대로입니다
  lexicon: interpretatus sum → 해석하다/풀이하다
  rationale: 라틴어의 ‘해석하다’는 단순 직역보다 말씀의 뜻을 풀어 옮겼다는 뉘앙스를 가지므로, 문맥상 가장 자연스럽고 중립적인 ‘해석한 대로’로 옮겼습니다.
- source_word: Ecce
  english_pob_choice: Behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 자
  lexicon: ecce → 보라/보십시오
  rationale: 경고와 주의를 환기하는 감탄사이므로, 현대 한국어에서 문어체로도 자연스럽고 공손한 ‘보십시오’를 택했습니다.
- source_word: dies ueniunt
  english_pob_choice: days are coming
  chosen_korean: 날들이 오고 있으며
  alternatives_korean:
  - 날들이 오고 있습니다
  - 날들이 올 것입니다
  lexicon: dies veniunt → 날들이 오다
  rationale: 진행 중인 도래를 나타내는 현재형을 살려, 단순 미래 예고보다 임박한 전개를 드러내는 ‘오고 있으며’로 옮겼습니다.
- source_word: regnum
  english_pob_choice: a kingdom
  chosen_korean: 한 나라
  alternatives_korean:
  - 한 왕국
  - 하나의 나라
  lexicon: regnum → 나라/왕국
  rationale: 라틴어 regnum은 왕권과 통치 영역을 함께 가리킬 수 있으나, 본문이 짧고 추상적이어서 한국어에서는 ‘한 나라’가 가장 간결하고 과도한 제도화를 피합니다.
theological_decisions:
- issue: ‘regnum’의 정치·종말론적 함의
  chosen_reading: 구체적 지상 왕국보다 ‘다가오는 통치 영역/나라’의 선포로 보되, 본문 자체가 범위를 더 규정하지 않으므로 ‘나라’로만 유지했습니다.
  alternative_readings:
  - ‘왕국’으로 좁혀 왕정적 이미지를 강조하는 읽기
  - ‘하나님의 나라’로 해석을 덧붙이는 읽기
  rationale: 주어진 라틴어에는 소유격이나 신적 주어가 없으므로, 본문이 말하는 것 이상으로 신학적 대상을 확정하지 않고 열린 형태를 유지했습니다.
  doctrine_reference: 본문 충실성 원칙
