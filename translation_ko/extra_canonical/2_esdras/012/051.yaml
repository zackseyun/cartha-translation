id: 2ES.12.51
reference: 2 Esdras 12:51
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Ego autem sedi in campo vii diebus, sicut mihi mandauit, et manducabam de floribus solummodo agri, de herbis facta est mihi esca in diebus illis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/051.yaml
  text: But I sat in the field seven days[a], as he commanded me, and I ate only the flowers of the field; in those days my food was made from herbs.
  footnotes:
  - marker: a
    text: Or 'from the herbs my food was made'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 나는 그가 내게 명령한 대로 일곱 날 동안 들에 앉아 있었으며, 들의 꽃만 먹었습니다. 그동안 내 먹을 것은 풀로 마련되었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그동안 풀로 내 먹을 것이 마련되었습니다.”
    reason: 원문의 de herbis facta est mihi esca의 가능한 한국어 어순을 제시하며, ‘풀에서’라는 장소적 오해를 피합니다.
lexical_decisions:
- source_word: sedi in campo vii diebus
  english_pob_choice: I sat in the field seven days
  chosen_korean: 들에 이레 동안 앉아 있었고
  alternatives_korean:
  - 들에 일곱 날 동안 앉아 있었고
  - 들판에서 이레 동안 머물렀고
  lexicon: sedi / campo / vii diebus
  rationale: 라틴어의 단순 과거 서술을 자연스러운 합쇼체로 옮기되, POB의 'seven days'에 맞춰 '이레'를 사용해 반복된 기간성을 살렸습니다.
- source_word: sicut mihi mandauit
  english_pob_choice: as he commanded me
  chosen_korean: 명령받은 대로
  alternatives_korean:
  - 그가 나에게 명령한 대로
  - 그가 내게 명하신 대로
  lexicon: sicut / mandauit
  rationale: 명령의 종속성을 간결하게 드러내며, 라틴어의 'as he commanded me'를 자연스럽게 압축해 전달합니다.
- source_word: de floribus solummodo agri
  english_pob_choice: I ate only the flowers of the field
  chosen_korean: 들의 꽃들만 먹었습니다
  alternatives_korean:
  - 들의 꽃만 먹었습니다
  - 들판의 꽃들만 먹었습니다
  lexicon: de floribus / solummodo / agri
  rationale: solummodo의 배타성을 '만'으로 살리고, agri를 '들'로 옮겨 반복되는 장소 이미지를 유지했습니다.
- source_word: de herbis facta est mihi esca
  english_pob_choice: my food was made from herbs
  chosen_korean: 내 음식은 풀로 만들어졌습니다
  alternatives_korean:
  - 내 음식은 풀에서 만들어졌습니다
  - 내 음식은 풀로 지어졌습니다
  lexicon: de herbis / facta est / esca
  rationale: 라틴어의 수동 구문을 그대로 반영하되, 'herbae'를 식물성 재료인 '풀'로 옮겨 문맥상 최소한의 의미 확장을 유지했습니다.
theological_decisions:
- issue: 7일간의 금식/절제 서술 방식
  chosen_reading: 본문은 단순한 행동 묘사로 유지하고, 금욕적 뉘앙스를 과장하지 않았습니다.
  alternative_readings:
  - 금식했다
  - 절식했다
  rationale: 라틴어는 먹는 것의 제한을 말할 뿐 금식이라는 직접 표현은 없으므로, 과도한 신학적 해석을 피했습니다.
  doctrine_reference: source-clarity principle
