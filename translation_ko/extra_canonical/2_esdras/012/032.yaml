id: 2ES.12.32
reference: 2 Esdras 12:32
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: hic est unctus, quem reservavit Altissimus in finem ad eos et impietates ipsorum. arguet illos de iniustitiis ipsorum et infulciet coram ipsis spretiones eorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/032.yaml
  text: This is the Anointed One[a], whom the Most High has reserved for the end against them and their impieties[b]. He will rebuke them for their injustices and will set their contempt before them.
  footnotes:
  - marker: a
    text: Latin 'unctus' is literally 'anointed.' In this vision the figure functions as the end-time deliverer who rebukes the eagle-kingdom and rescues the remnant, so the messianic force should be heard even where the main text keeps the literal title.
    reason: messianic_passage
    anchor_ref: '12:32'
  - marker: b
    text: Or '“And the lion that you saw rousing itself from the forest, roaring and speaking to the eagle and reproving it for its injustices and all its words, as you heard—'.
    reason: previous_rendering
translation:
  language: ko
  text: 이분이 곧 기름부음받은 분[a]이십니다. 지극히 높으신 분께서 그들과 그들의 불경을 대적하시려고 마지막 때를 위하여 그분을 예비해 두셨습니다. 그분은 그들의 불의를 꾸짖으시고, 그들이 보인 멸시를 그들 앞에 드러내실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 unctus는 문자적으로 ‘기름부음받은 이’라는 뜻입니다. 이 환상에서 이 인물은 마지막 때에 독수리 왕국을 꾸짖고 남은 이들을 구원하는 종말론적 해방자로 나타나므로, 본문은 문자적 칭호를 유지하면서도 메시아적 함의를 지닙니다.
    reason: messianic_passage
lexical_decisions:
- source_word: unctus
  english_pob_choice: the Anointed One
  chosen_korean: 기름부음받은 이
  alternatives_korean:
  - 메시아
  - 그리스도
  lexicon: unctus
  rationale: 라틴어 원문의 직역 의미를 살리되, 이 비전에서 종말론적 해방자라는 메시아적 기능이 분명하므로 한국어 본문은 직역에 가까운 표현을 두고 각주로 메시아적 의미를 보완했습니다.
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Altissimus
  rationale: 하나님 호칭으로서의 위계를 자연스럽게 드러내는 표준적 현대 한국어 표현을 택했습니다.
- source_word: reservavit ... in finem
  english_pob_choice: has reserved ... for the end
  chosen_korean: 끝을 위해 ... 남겨 두셨습니다
  alternatives_korean:
  - 마지막을 위해 ... 보존하셨습니다
  - 끝때를 위해 ... 예비하셨습니다
  lexicon: reservavit / in finem
  rationale: reservavit의 ‘따로 남겨 두다, 예비하다’라는 뜻과 in finem의 종말론적 방향을 함께 살리기 위해 ‘남겨 두셨습니다’를 사용했습니다.
- source_word: spretiones
  english_pob_choice: their contempt
  chosen_korean: 그들의 경멸
  alternatives_korean:
  - 그들의 멸시
  - 그들의 조롱
  lexicon: spretiones
  rationale: 라틴어 복수형이 가리키는 경시·멸시의 태도를 가장 직접적으로 드러내는 말로 옮겼습니다.
theological_decisions:
- issue: unctus의 메시아적 함의
  chosen_reading: 본문은 ‘기름부음받은 이’로 번역해 라틴어의 직접 의미를 보존하되, 주석 a에서 종말론적 메시아로 읽히는 점을 드러냅니다.
  alternative_readings:
  - 본문을 ‘메시아’로 바로 번역
  - 본문을 ‘그리스도’로 번역
  rationale: 원문은 직역상 unctus이지만, POB 영어도 메시아적 기능을 분명히 하므로 의미를 지우지 않으면서도 원문 표면형을 유지하는 절충이 필요합니다.
  doctrine_reference: 메시아 이해와 종말론적 구원자 표상
- issue: eos et impietates ipsorum의 관계
  chosen_reading: ‘그들의 불경과 함께 그들을 향해’로 옮겨, 심판의 대상과 그들의 불경이 함께 겨냥된다는 구조를 보존했습니다.
  alternative_readings:
  - ‘그들과 그들의 불경을 향해’
  - ‘그들과 그들의 불경에 맞서’
  rationale: 라틴어는 대상(eos)과 그들의 불경(impietates ipsorum)을 병치하며 심판의 방향을 강조하므로, 한국어도 이를 분리하지 않고 함께 제시했습니다.
  doctrine_reference: 종말 심판과 불경에 대한 책망
