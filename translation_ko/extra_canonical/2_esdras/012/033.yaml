base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/033.yaml
  text: And it will be[a], when he has reproved them, then he will destroy them[b]. For the remnant
  footnotes:
  - marker: a
    text: The clause rendered 'will set their contempt before them' is textually difficult in Latin. The sense appears to be that their scornful deeds will be exposed publicly before them rather than hidden.
    reason: textual_variant
    anchor_ref: '12:33'
  - marker: b
    text: Or 'this is the Anointed One, whom the Most High has kept for the end, against them and against their impieties. He will rebuke them for their injustices and will set their contempt before them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 그들을 책망하신 뒤에, 그들을 멸하실 것입니다. 이는 남은 자가[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 원문은 이 절에서 문장을 끝내지 않고 다음 구로 이어지므로, 한국어도 미완결 형태를 유지했습니다.
    reason: source_note
lexical_decisions:
- source_word: arguerit eos
  english_pob_choice: when he has reproved them
  chosen_korean: 그들이 책망을 받을 때가 오면
  alternatives_korean:
  - 그들을 꾸짖으실 때가 오면
  - 그들을 책망하실 때가 오면
  lexicon: arguo
  rationale: 라틴어 arguo는 단순한 질책보다 잘못을 드러내어 꾸짖는 뜻이 있어, 영어 POB의 reprove를 따라 「책망하다」로 옮겼습니다.
- source_word: tunc corrumpet eos
  english_pob_choice: then he will destroy them
  chosen_korean: 그다음에는 그분이 그들을 멸하실 것입니다
  alternatives_korean:
  - 그때 그들을 파괴하실 것입니다
  - 그러면 그들을 없애실 것입니다
  lexicon: corrumpo
  rationale: corrumpet는 문맥상 단순히 손상시키는 것이 아니라 심판으로 멸망시키는 뜻이므로, 한국어에서는 「멸하다」로 강도를 살렸습니다.
- source_word: Nam residuum
  english_pob_choice: For the remnant
  chosen_korean: 이는 남은 자가
  alternatives_korean:
  - 남은 자는
  - 그 남은 자를 위하여
  lexicon: residuum
  rationale: residuum는 이어질 문맥을 예고하는 잔여/남은 부분을 가리키므로, 절이 아직 미완성된 상태를 드러내는 「남은 자가」로 시작했습니다.
theological_decisions:
- issue: 문장 경계와 절 분절이 원문상 12:33의 마지막이 미완성으로 남는 문제
  chosen_reading: 본문은 라틴어가 12:33에서 문장이 미완성으로 끝나므로, 한국어도 다음 절로 이어질 것을 예고하는 열린 형태를 유지했습니다.
  alternative_readings:
  - 문장을 완결시켜 자연스럽게 번역함
  - 이 절을 앞 절과 합쳐 완성형으로 옮김
  rationale: source_payload의 라틴어가 'Nam residuum'에서 끊기므로, 완결형으로 매끈하게 만들면 원문 증거를 훼손합니다.
  doctrine_reference: textual fidelity / verse segmentation
