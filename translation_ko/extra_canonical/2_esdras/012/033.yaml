  verdict: revise
  source_fidelity: 라틴어 arguerit eos의 주어는 앞 문맥의 그 인물이며, 초안의 수동 표현 「그들이 책망을 받을 때」는 이를 흐립니다. 또한 cum arguerit은 책망이 이루어진 뒤의 심판이라는 시간 관계를 자연스럽게 나타낼 수 있습니다. corrumpet eos는 문맥상 「그들을 멸하실 것입니다」가 적절합니다. Nam residuum은 다음 절로 이어지는 미완결 구절이므로 이를 완결하지 않아야 합니다.
  naturalness: 「그가 그들을 책망하신 뒤에, 그들을 멸하실 것입니다」는 현대 표준 한국어 합쇼체로 자연스럽고, 원문의 주어와 시간 관계를 분명히 합니다. 미완결된 마지막 구절은 원문의 절 경계를 보존하기 위해 의도적으로 열어 둡니다.
  terminology: arguo는 여기서 「책망하다」, corrumpo는 심판 문맥에서 「멸하다」로 옮기는 것이 적절합니다. residuum은 문맥상 집합적 표현이지만 제공된 본문이 미완결이므로 「남은 자가」로 다음 절에 이어지게 둡니다.
  issues:
