source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: Et profectus est populus sicut dixi ei in ciuitatem.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/050.yaml
  text: And the people departed into the city, as I told him.
translation:
  language: ko
  text: 그리고 내가 그에게 말한 대로 백성은 도시로 떠났습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: profectus est
  english_pob_choice: departed
  chosen_korean: 떠났습니다
  alternatives_korean:
  - 나갔습니다
  - 출발했습니다
  - 가 버렸습니다
  lexicon: proficisci
  rationale: 라틴어 perfect 동사 profectus est는 단순한 이동이 아니라 목적지로 ‘떠나 감’을 나타내므로, POB의 ‘departed’를 따라 자연스럽고 엄정하게 ‘떠났습니다’로 옮겼습니다.
- source_word: populus
  english_pob_choice: the people
  chosen_korean: 백성
  alternatives_korean:
  - 사람들
  - 민중
  - 군중
  lexicon: populus
  rationale: 문맥상 집단 전체를 가리키는 populus는 한국어에서 가장 직접적이고 성경적인 집합 명사인 ‘백성’이 적합합니다.
- source_word: ciuitatem
  english_pob_choice: into the city
  chosen_korean: 도시로
  alternatives_korean:
  - 성읍으로
  - 도성으로
  - 그 도시로
  lexicon: civitas
  rationale: ciuitas/civitatem은 도시·성읍을 뜻하므로, 지리적 이동을 분명히 하는 ‘도시로’가 본문 의미를 가장 간결하게 드러냅니다.
- source_word: dixi ei
  english_pob_choice: as I told him
  chosen_korean: 내가 그에게 말한 대로
  alternatives_korean:
  - 내가 그에게 일러 준 대로
  - 내가 그에게 말했듯이
  - 내가 그에게 지시한 대로
  lexicon: dico
  rationale: ei가 단수 대명사이므로 POB의 ‘him’을 반영해 ‘그에게’로 두었고, as의 종속 관계를 한국어 관용에 맞게 ‘말한 대로’로 표현했습니다.
theological_decisions:
- issue: 문장의 단순 서술을 과장 없이 보존할지 여부
  chosen_reading: 사건의 순서와 지시 관계만 드러내는 평서문으로 옮기고, 해석적 확대를 넣지 않았습니다.
  alternative_readings:
  - 백성이 그대로 도시로 들어갔습니다
  - 그 말대로 백성이 도시 안으로 갔습니다
  rationale: 본문은 신학적 확장보다 서술적 사실 전달이 중심이므로, 원문의 담백한 진행을 유지하는 것이 가장 충실합니다.
  doctrine_reference: 문맥 보존과 서술 충실성 원칙
