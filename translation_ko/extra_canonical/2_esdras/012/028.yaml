lexical_decisions:
- source_word: sed tamen
  english_pob_choice: but this one also
  chosen_korean: 그러나 이 사람도
  alternatives_korean:
  - 하지만 이 사람도
  - 그런데 이 사람도
  lexicon: sed tamen
  rationale: sed tamen은 단순한 역접을 넘어 앞선 흐름을 약간 되돌리면서도 새 정보를 덧붙이는 말로, 합쇼체에서 자연스러운 ‘그러나’로 옮기고 h ic를 지시대명사로 ‘이 사람’이라 살렸습니다.
- source_word: gladio
  english_pob_choice: by the sword
  chosen_korean: 칼에
  alternatives_korean:
  - 칼로
  - 검에
  lexicon: gladius
  rationale: 라틴어 gladio는 도구/수단의 뜻이므로 한국어에서는 자연스럽게 ‘칼에’로 처리해 수동적 피격을 드러냈습니다.
- source_word: in nouissimis
  english_pob_choice: in the last days
  chosen_korean: 마지막 날에
  alternatives_korean:
  - 끝날에
  - 말세에
  lexicon: novissimis
  rationale: novissimis는 종말적 시간을 가리키므로 직설적인 ‘마지막 날에’가 본문의 시기표현을 가장 분명하게 전달합니다.
- source_word: Et quoniam uidisti
  english_pob_choice: And because you saw
  chosen_korean: 그리고 당신이 보았으므로
  alternatives_korean:
  - 그리고 네가 보았으므로
  - 그리고 네가 보았기에
  lexicon: quoniam + vidisti
  rationale: quoniam은 이유를, vidisti는 2인칭 단수 과거를 나타내므로 공손한 직설문으로 ‘당신이 보았으므로’라고 옮겨 후속 설명의 연결을 살렸습니다.
theological_decisions:
- issue: 종말 표현의 범위
  chosen_reading: ‘마지막 날’은 단순한 먼 미래가 아니라 심판과 종말을 포함한 종말론적 시점을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - ‘말세’
  - ‘끝날’
  rationale: 라틴어 in nouissimis의 시간 표지 자체가 종말론적이며, 본문이 역사적 사건보다 종말적 결말을 강조하므로 의미를 약화하지 않는 표현을 택했습니다.
  doctrine_reference: 종말론
