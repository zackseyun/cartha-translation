  text: but two will be preserved until the end. And because you saw three heads
translation:
  language: ko
  text: 그러나 두 개는 끝까지 보존될 것입니다. 그리고 당신이 세 개의 머리를 보았기 때문에
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: duo uero
  english_pob_choice: but two
  chosen_korean: 그러나 두 개는
  alternatives_korean:
  - 그런데 둘은
  - 하지만 두 개는
  lexicon: duo / uero
  rationale: duo는 수량을 분명히 살려 ‘두 개’로 옮기고, uero는 앞뒤 대조를 나타내는 접속부사로 ‘그러나’가 가장 자연스럽습니다.
- source_word: seruabuntur
  english_pob_choice: will be preserved
  chosen_korean: 보존될 것입니다
  alternatives_korean:
  - 지켜질 것입니다
  - 간직될 것입니다
  lexicon: seruare
  rationale: English POB의 ‘preserved’에 맞추어 단순 생존보다 보존·유지의 뉘앙스를 살렸습니다.
- source_word: in finem
  english_pob_choice: until the end
  chosen_korean: 끝까지
  alternatives_korean:
  - 마지막까지
  - 종말까지
  lexicon: in finem
  rationale: 종말론적 의미를 해치지 않으면서 한국어에서 자연스럽고 압축된 표현으로 옮겼습니다.
- source_word: Et quoniam uidisti tria capita
  english_pob_choice: And because you saw three heads
  chosen_korean: 그리고 당신이 세 개의 머리를 보았기 때문에
  alternatives_korean:
  - 그리고 네가 세 개의 머리를 보았기 때문에
  - 그리고 네가 세 머리를 보았으므로
  lexicon: quoniam / uidisti / tria capita
  rationale: 라틴어의 인과절을 그대로 살려 ‘때문에’로 옮겼고, tria capita는 수량을 드러내기 위해 ‘세 개의 머리’로 직역했습니다.
