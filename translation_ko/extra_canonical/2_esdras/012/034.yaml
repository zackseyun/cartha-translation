id: 2ES.12.34
reference: 2 Esdras 12:34
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: populum meum liberabit cum misericordia, qui saluati sunt super fines meos, et iocundabit eos, quoadusque ueniat finis, dies iudicii, de quo locutus sum tibi ab initio. Hoc est somnium
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/034.yaml
  text: he will deliver my people with mercy[a], those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning. This is the dream,
  footnotes:
  - marker: a
    text: Or 'And when he has reproved them, then he will destroy them. But he will deliver the remnant of my people with mercy, those who have been preserved within my borders, and he will make them rejoice until the end comes, the day of judgment, of which I spoke to you from the beginning.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 내 백성을 자비로 구원하시고, 내 경계 안에 보존된 자들을 기쁘게 하실 것입니다. 그것은 끝, 곧 내가 처음부터 너에게 말한 심판의 날이 올 때까지입니다. 이것이 그 꿈입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 다르게 번역하면, “그들을 책망하신 뒤에는 그들을 멸하실 것입니다. 그러나 그는 내 백성의 남은 자, 곧 내 경계 안에 보존된 자들을 자비로 구원하시고, 끝, 곧 내가 처음부터 너에게 말한 심판의 날이 올 때까지 그들을 기쁘게 하실 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: populum meum liberabit cum misericordia
  english_pob_choice: he will deliver my people with mercy
  chosen_korean: 그는 내 백성을 자비로 구원하시고
  alternatives_korean:
  - 그는 내 백성을 긍휼로 건져내시고
  - 그는 내 백성을 자비로 구해내시고
  lexicon: liberabit / misericordia
  rationale: liberabit는 단순한 해방보다 구원·건짐의 의미가 강해 구원하시고로 옮겼고, cum misericordia는 행위의 방식이므로 자비로를 유지했습니다.
- source_word: qui saluati sunt super fines meos
  english_pob_choice: those who have been preserved within my borders
  chosen_korean: 내 경계 안에서 보존된 자들을
  alternatives_korean:
  - 내 경계 안에 남겨진 자들을
  - 내 지경 안에서 구원받은 자들을
  lexicon: saluati sunt / fines
  rationale: saluati sunt는 '구원받다'도 가능하지만 문맥상 남겨 보존된 무리를 가리키므로 보존된으로, fines meos는 '내 경계/경계선'의 공간적 표현을 살려 번역했습니다.
- source_word: iocundabit eos
  english_pob_choice: he will make them rejoice
  chosen_korean: 기뻐하게 하실 것이며
  alternatives_korean:
  - 즐겁게 하실 것이며
  - 기쁨으로 채우실 것이며
  lexicon: iocundabit
  rationale: iocundabit는 외적 감정 유발을 뜻하므로 직역적인 '기뻐하게 하다'가 가장 자연스럽고 원문 충실합니다.
- source_word: quoadusque ueniat finis, dies iudicii
  english_pob_choice: until the end comes, the day of judgment
  chosen_korean: 끝이 올 때까지, 곧 … 심판의 날까지
  alternatives_korean:
  - 마지막이 올 때까지, 곧 심판의 날까지
  - 종말이 올 때까지, 곧 심판의 날까지
  lexicon: quoadusque / finis / dies iudicii
  rationale: quoadusque ueniat finis는 시간의 종결을, dies iudicii는 그 종결을 특정하는 심판의 날을 가리키므로 병렬 구조를 살려 번역했습니다.
- source_word: Hoc est somnium
  english_pob_choice: This is the dream,
  chosen_korean: 이것이 그 꿈입니다.
  alternatives_korean:
  - 이것이 꿈입니다.
  - 이것이 그 환상입니다.
  lexicon: somnium
  rationale: somnium은 여기서 계시적 내용으로서의 '꿈'이 가장 직접적이며, 영어 POB의 dream을 따라 자연스럽게 옮겼습니다.
theological_decisions:
- issue: fines meos의 의미 범위
  chosen_reading: '''내 경계 안에서''로 옮겨, 하나님이 정하신 보호·귀속의 영역을 드러냈습니다.'
  alternative_readings:
  - '''내 지경 안에서'''
  - '''내 경계들 안에서'''
  rationale: 단순한 영토 경계보다 보존과 소속을 함께 드러내는 표현이 문맥에 더 적합합니다.
  doctrine_reference: 문맥상 남은 자 보존과 하나님의 보호권을 강조하는 종말론적 서술
- issue: cum misericordia의 수식 관계
  chosen_reading: '''자비로''를 동작의 방식으로 두어 구원이 자비에 근거함을 드러냈습니다.'
  alternative_readings:
  - '''자비와 함께'''
  - '''긍휼로'''
  rationale: 라틴어 전치사구는 구원의 수단/방식을 나타내므로, 행위의 원인인 자비를 간명하게 표현하는 것이 적절합니다.
  doctrine_reference: 하나님의 자비에 근거한 구원
