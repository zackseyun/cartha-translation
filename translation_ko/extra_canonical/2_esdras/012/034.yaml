  terminology: ‘자비’, ‘구원’, ‘심판의 날’, ‘꿈’은 현대 표준어 성서 문체에 적절합니다. fines meos는 ‘내 경계 안에’로 유지할 수 있습니다. 현 각주는 영어 POB 감사 기록의 이전 번역 이문을 반영하지 않고, 본문에 없는 보호적 해석을 덧붙이므로 교체하는 것이 적절합니다.
