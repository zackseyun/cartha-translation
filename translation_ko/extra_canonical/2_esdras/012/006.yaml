  yaml_path: translation/extra_canonical/2_esdras/012/006.yaml
  text: Now therefore I will pray to the Most High, that he may strengthen me to the end.”
translation:
  language: ko
  text: 그러므로 지극히 높으신 분께서 끝까지 저를 강하게 해 주시도록 기도하겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: altissimum
  english_pob_choice: the Most High
  chosen_korean: 가장 높으신 분
  alternatives_korean:
  - 지극히 높으신 분
  - 지존자
  lexicon: Lat. altissimus
  rationale: 하나님을 가리키는 신적 호칭으로, 비교급의 높음 자체를 살려 ‘가장 높으신 분’으로 옮기되 한국어 문맥에서 자연스럽게 들리도록 했습니다.
- source_word: me confortet
  english_pob_choice: strengthen me
  chosen_korean: 저를 강하게 해 주시기를
  alternatives_korean:
  - 저를 굳세게 해 주시기를
  - 저를 격려해 주시기를
  lexicon: Lat. confortare
  rationale: 문맥상 단순한 위로나 격려보다 실제적 힘 부여가 핵심이므로 ‘강하게 해 주시다’로 옮겼습니다.
- source_word: usque in finem
  english_pob_choice: to the end
  chosen_korean: 끝까지
  alternatives_korean:
  - 마지막까지
  - 종말까지
  lexicon: Lat. usque in finem
  rationale: 기간의 지속과 인내의 완결을 가장 सीधे하게 드러내는 관용적 표현으로 ‘끝까지’를 선택했습니다.
theological_decisions:
- issue: ‘Most High’의 신적 호칭 처리
  chosen_reading: 본문의 기도 대상은 일반적인 최상급 표현이 아니라 하나님을 가리키는 호칭으로 읽어 ‘가장 높으신 분’으로 번역했습니다.
  alternative_readings:
  - 단순히 ‘지극히 높으신 분’으로 완화
  - 고유명사적 음역을 사용
  rationale: 영어 POB의 ‘the Most High’와 라틴어 altissimum은 신적 호칭으로 기능하므로, 경어적이면서도 직접적인 호칭을 유지했습니다.
  doctrine_reference: 구약-제2성전기 전통의 신칭(神稱) 사용
- issue: ‘strengthen me to the end’의 종말 지향성
  chosen_reading: 기도의 내용은 현재의 도움보다 최종 완결까지의 지속적 보존에 초점이 있으므로 그 뉘앙스를 살렸습니다.
  alternative_readings:
  - 단순 현재적 도움 요청으로 축소
  - ‘끝’의 의미를 약화
  rationale: 라틴어 문장은 인내와 보존의 종말적 목표를 포함하므로, 한국어에서도 그 지속성을 분명히 했습니다.
  doctrine_reference: 인내와 보존에 대한 성경적 기도
