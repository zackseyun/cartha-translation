lexical_decisions:
- source_word: sed iterum
  english_pob_choice: but will again
  chosen_korean: 그러나 다시
  alternatives_korean:
  - 하지만 다시
  - 그렇지만 다시
  lexicon: sed + iterum
  rationale: 라틴어의 역접과 재차성을 간결하게 살려, 앞뒤 논리 전환과 반복을 자연스러운 현대 한국어로 표현했습니다.
- source_word: constituetur
  english_pob_choice: will be restored
  chosen_korean: 회복될 것입니다
  alternatives_korean:
  - 다시 세워질 것입니다
  - 다시 정해질 것입니다
  lexicon: constituo (passive)
  rationale: passive로 된 'constituetur'는 단순한 '세우다'보다 원상 복귀의 뉘앙스가 살아 있는 '회복되다'가 문맥상 더 적절합니다.
- source_word: in suum initium
  english_pob_choice: to its beginning
  chosen_korean: 그 시작으로
  alternatives_korean:
  - 그 시작에
  - 원래의 시작으로
  lexicon: initium
  rationale: POB의 'to its beginning'을 따라, 'suum'이 가리키는 고유한 출발점/기원을 한국어로 자연스럽게 옮겼습니다.
- source_word: Et quoniam
  english_pob_choice: And because
  chosen_korean: 그리고
  alternatives_korean:
  - 그리고 그것은
  - 왜냐하면
  lexicon: quoniam
  rationale: 이 절편은 접속사구만 남아 있어 독립된 이유절로 완결시키지 않고, 남아 있는 연결 표지를 그대로 드러내는 최소 번역을 택했습니다.
