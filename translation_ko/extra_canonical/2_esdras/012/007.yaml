source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nator domine, si inueni gratiam ante oculos tuos, et si iustificatus sum apud te prae multis, et si certum ascendit deprecatio mea ante faciem tuam, Conforta me et ostende seruo tuo mihi
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/007.yaml
  text: And I said[a], “O Sovereign Lord, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has surely gone up before your face, strengthen me and show yourself to me, your slave.”
  footnotes:
  - marker: a
    text: Or 'And I said, “Lord, Master, if I have found favor before your eyes, and if I have been justified before you more than many, and if my petition has truly gone up before your face, strengthen me'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 말했습니다. “오 주권자이신 주님, 제가 주님의 눈앞에서 은혜를 얻었고, 제가 많은 사람들보다 주님 앞에서 의롭다 하심을 받았으며, 제 간구가 참으로 주님의 얼굴 앞에 올라갔다면, 저를 굳세게 하시고 당신의 종인 저를 보여 주십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 기도는 ‘show yourself to me’까지 포함합니다.
    reason: source_note
lexical_decisions:
- source_word: domine / dominator domine
  english_pob_choice: O Sovereign Lord
  chosen_korean: 오 주권자이신 주님
  alternatives_korean:
  - 오 주님, 주인이신 주님
  - 오 통치자 주님
  lexicon: κύριος / dominator domine
  rationale: 라틴어의 ‘dominator domine’는 단순한 ‘주님’보다 통치권과 주권을 함께 드러내는 호칭이므로, 한국어에서는 ‘주권자이신 주님’으로 옮겨 원문의 위계를 살렸습니다.
- source_word: iustificatus sum
  english_pob_choice: I have been justified
  chosen_korean: 의롭다 하심을 받았으며
  alternatives_korean:
  - 의롭다 여김을 받았으며
  - 정당하다고 인정받았으며
  lexicon: iustificare
  rationale: 법정적·관계적 선언을 담는 표현이므로, 교회적 용례를 살리면서도 수동적 선언성을 분명히 하는 ‘의롭다 하심을 받다’를 택했습니다.
- source_word: seruo
  english_pob_choice: your slave
  chosen_korean: 당신의 종인 저를
  alternatives_korean:
  - 당신의 노예인 저를
  - 당신의 종인 저를
  lexicon: seruus
  rationale: POB 영어판은 최종 개정에서 ‘slave’로 분명히 하였지만, 한국어에서는 직역적 ‘노예’가 한국어 독자에게 과도한 오해를 낳을 수 있어, 이 장르의 기도문 맥락에서는 소속과 겸비를 강조하는 ‘종’으로 옮겼습니다.
- source_word: certum ascendit
  english_pob_choice: has surely gone up
  chosen_korean: 참으로 주님의 얼굴 앞에 올라갔다면
  alternatives_korean:
  - 확실히 주님의 얼굴 앞에 올라갔다면
  - 분명히 주님의 얼굴 앞에 올라갔다면
  lexicon: certum ascendit deprecatio mea
  rationale: ‘certum’의 확실성은 기도문의 확신으로 드러나므로 ‘참으로’로 자연스럽게 살렸고, ‘주님의 얼굴 앞에’는 원문의 방향성과 시적 이미지를 유지했습니다.
theological_decisions:
- issue: 기도자 자신에 대한 겸손한 자기지칭의 정도
  chosen_reading: ‘당신의 종인 저를’로 낮추어, 기도자가 하나님 앞에서 자신을 종으로 규정하는 자기-비하적 겸손을 드러냈습니다.
  alternative_readings:
  - ‘당신의 노예인 저를’
  - ‘주님의 종인 저를’
  rationale: 문맥상 간구의 마지막 청원은 단순한 호칭이 아니라 관계적 복종을 강조하므로, 기도체의 품격을 유지하면서도 자기 낮춤을 분명히 하는 표현을 선택했습니다.
  doctrine_reference: 성경의 겸손한 기도 언어와 종-주 관계
- issue: ‘show yourself to me’의 번역
  chosen_reading: ‘보여 주십시오’보다 관계적 드러남을 살린 ‘보여 주십시오’ 대신 ‘보여 주십시오’와 동일한 요청 의도를 유지하되, 전체 문장에서 하나님이 자신을 드러내 주시기를 구하는 뜻으로 이해했습니다.
  alternative_readings:
  - ‘저에게 자신을 보여 주십시오’
  - ‘저를 나타내 주십시오’
  rationale: 라틴어 ostende mihi는 단순 시각적 제시가 아니라 인격적 현현의 요청이므로, 한국어에서는 ‘보여 주십시오’로 자연스럽게 옮기되 문맥상 자기현시의 의미를 잃지 않도록 했습니다.
  doctrine_reference: 하나님의 현현과 계시 언어
