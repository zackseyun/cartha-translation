  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/047.yaml
  text: For the memory of you is before the Most High[a][b],
  footnotes:
  - marker: b
    text: The title 'the Mighty One' renders Latin 'fortis' as a divine epithet, not merely an adjective.
    reason: lexical_alternative
    anchor_ref: '12:47'
  - marker: a
    text: Or 'For your remembrance is before the Most High, and the Mighty One has not forgotten you in the struggle.'.
