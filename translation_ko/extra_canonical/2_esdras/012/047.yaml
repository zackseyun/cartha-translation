translation:
  language: ko
  text: 야곱의 집이여, 너희에 대한 기억이 지극히 높으신 분 앞에 있습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: tu domus Jacob
  english_pob_choice: For the memory of you is before the Most High
  chosen_korean: 야곱의 집이여
  alternatives_korean:
  - 야곱의 집아
  - 야곱의 집이여, 너희여
  lexicon: domus
  rationale: 라틴어 호격 표현을 살려 공동체를 직접 부르는 말로 옮겼습니다. 본문은 개별 인물보다 ‘야곱의 집’ 전체를 향한 부름이므로, 자연스러운 합쇼체 호격으로 처리했습니다.
- source_word: memoria uestri
  english_pob_choice: the memory of you
  chosen_korean: 너희에 대한 기억
  alternatives_korean:
  - 너희의 기억
  - 너희를 기억하심
  lexicon: memoria
  rationale: uestri는 목적격적 속격이어서 ‘너희를 기억하는 행위’보다 ‘너희에 대한 기억’이 더 정확합니다. 한국어로는 ‘너희에 대한 기억’이 가장 직접적으로 이 관계를 드러냅니다.
- source_word: coram altissimo
  english_pob_choice: before the Most High
  chosen_korean: 지극히 높으신 이 앞에
  alternatives_korean:
  - 지극히 높으신 분 앞에
  - 가장 높으신 분 앞에
  lexicon: altissimus
  rationale: Most High를 하나님을 가리키는 칭호로 읽고, 한국어에서는 ‘지극히 높으신 이’가 문체와 경외감을 함께 살립니다.
theological_decisions:
- issue: ‘Most High’의 신적 호칭 처리
  chosen_reading: ‘지극히 높으신 이’를 하나님에 대한 칭호로 유지했습니다.
  alternative_readings:
  - ‘가장 높으신 분’으로 일반적 형용사처럼 옮김
  - 전통적으로 ‘지극히 높으신 하나님’으로 명시
  rationale: 라틴어 문맥에서 altissimus는 단순 비교급이 아니라 신적 호칭으로 기능하므로, 그 긴장과 경외감을 보존하는 번역이 적절합니다.
  doctrine_reference: 신적 칭호의 보존
