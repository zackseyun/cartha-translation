  - 바다에서 솟아오르는
  lexicon: 올라오다
  rationale: ascendentem은 진행 중인 상승을 나타내므로 '올라오는'이 가장 자연스럽고 원문의 동작성을 잘 살립니다.
theological_decisions:
- issue: 해석 도입문과 상징 식별을 어디까지 분명히 할지
  chosen_reading: “이것은 …의 해석입니다”라는 직설적 도입을 유지하고, 이어지는 상징 식별도 끊지 않고 제시했습니다.
  alternative_readings:
  - “이것은 …를 해석한 것입니다”
  - “이 환상의 뜻은 이러합니다”
  rationale: 라틴어 hoc est는 해석 선언을 직접적으로 열어 주므로, 완화된 의역보다 선언적 구조를 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 본문 해석의 명시성 보존; 문학적·예언적 담화 구조
