  philosophy: optimal-equivalence
lexical_decisions:
- source_word: uidisti / visionem
  english_pob_choice: the vision that you saw
  chosen_korean: 당신이 본 환상
  alternatives_korean:
  - 당신이 본 이상
  - 당신이 본 시현
  lexicon: 환상
  rationale: 라틴어 uidisti와 visio 계열을 자연스러운 현대 한국어로 옮기되, 본문이 예언적 환시를 가리키므로 '환상'이 가장 직접적입니다.
- source_word: Aquilam
  english_pob_choice: the eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 독수리새
  - 응
  lexicon: 독수리
  rationale: Aquila는 문자 그대로 '독수리'이며, 상징적 동물 표상을 유지하는 것이 원문과 POB의 해석 연결을 보존합니다.
- source_word: ascendentem de mari
  english_pob_choice: coming up from the sea
  chosen_korean: 바다에서 올라오는
  alternatives_korean:
  - 바다에서 올라오는 중인
  - 바다에서 솟아오르는
  lexicon: 올라오다
  rationale: ascendentem은 진행 중인 상승을 나타내므로 '올라오는'이 가장 자연스럽고 원문의 동작성을 잘 살립니다.
theological_decisions:
- issue: 해석 도입문과 상징 식별을 어디까지 분명히 할지
  chosen_reading: “이것은 …의 해석입니다”라는 직설적 도입을 유지하고, 이어지는 상징 식별도 끊지 않고 제시했습니다.
  alternative_readings:
  - “이것은 …를 해석한 것입니다”
  - “이 환상의 뜻은 이러합니다”
  rationale: 라틴어 hoc est는 해석 선언을 직접적으로 열어 주므로, 완화된 의역보다 선언적 구조를 보존하는 편이 원문 효과를 더 잘 전달합니다.
  doctrine_reference: 본문 해석의 명시성 보존; 문학적·예언적 담화 구조
