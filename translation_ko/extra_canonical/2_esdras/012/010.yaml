  lexicon: 환상
  rationale: 라틴어 uidisti와 visio 계열을 자연스러운 현대 한국어로 옮기되, 본문이 예언적 환시를 가리키므로 '환상'이 가장 직접적입니다.
- source_word: Aquilam
  english_pob_choice: the eagle
  chosen_korean: 독수리
  alternatives_korean:
  - 독수리새
  - 응
  lexicon: 독수리
  rationale: Aquila는 문자 그대로 '독수리'이며, 상징적 동물 표상을 유지하는 것이 원문과 POB의 해석 연결을 보존합니다.
- source_word: ascendentem de mari
  english_pob_choice: coming up from the sea
  chosen_korean: 바다에서 올라오는
  alternatives_korean:
