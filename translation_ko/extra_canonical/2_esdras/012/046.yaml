translation:
  language: ko
  text: 그리고 내가 그들에게 대답하여 말했습니다[a]. 「이스라엘아, 용기를 내고 슬퍼하지 마십시오」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
