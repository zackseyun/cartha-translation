  source_fidelity: '본문의 핵심 번역은 라틴어 ‘et respondi ad eos et dixi: Confide Israel, et noli tristari’에 충실합니다. 다만 현 각주는 이 절의 라틴어 본문에 없는 ‘야곱의 집’을 대안 본문처럼 제시합니다. 제공된 판본과 영어 감사 기록 모두 이 표현이 다음 절에 속함을 확인하므로, 이 절에서는 삭제해야 합니다.'
