  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Confide
  english_pob_choice: Take courage
  chosen_korean: 용기를 내고
  alternatives_korean:
  - 담대하십시오
  - 안심하십시오
  - 힘을 내십시오
  lexicon: confide
  rationale: 라틴어 confide는 단순한 감정 위로보다 ‘두려워하지 말고 용기 있게 하라’는 격려를 뜻하므로, 합쇼체로 자연스럽고 직접적인 ‘용기를 내고’로 옮겼습니다.
- source_word: Israel
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘아
  - 이스라엘 백성아
  lexicon: Israel
  rationale: 호격이므로 한국어에서는 자연스럽게 ‘이스라엘아’로 처리해 직접 호소의 뉘앙스를 살렸습니다.
- source_word: noli tristari
  english_pob_choice: do not grieve
  chosen_korean: 슬퍼하지 마십시오
  alternatives_korean:
  - 근심하지 마십시오
  - 애통해하지 마십시오
  - 마음 아파하지 마십시오
  lexicon: tristari
  rationale: tristari는 단순한 걱정보다 슬픔/비탄의 정서를 가리키므로, 문맥에 충실하게 ‘슬퍼하지 마십시오’로 번역했습니다.
theological_decisions:
- issue: 직접 인용의 종결 방식
  chosen_reading: 이스라엘에게 주는 위로의 명령문을 따옴표 안에서 직접화법으로 처리했습니다.
  alternative_readings:
