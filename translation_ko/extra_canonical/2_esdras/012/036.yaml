translation:
  language: ko
  text: 그러나 오직 당신만이 지극히 높으신 분의 이 비밀을 알기에 합당하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘찾아 합당하다고 여겨지셨습니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: Tu autem
  english_pob_choice: But you alone
  chosen_korean: 그러나 오직 당신만이
  alternatives_korean:
  - 하지만 당신만이
  - 그런데 당신만이
  lexicon: tu, autem
  rationale: 대조 접속을 살리되, 강조된 배타성을 위해 ‘오직’을 넣어 원문의 ‘you alone’를 분명히 드러냈습니다.
- source_word: solus
  english_pob_choice: alone
  chosen_korean: 오직 당신만이
  alternatives_korean:
  - 당신 홀로
  - 당신만
  lexicon: solus
  rationale: ‘혼자’라는 물리적 뉘앙스보다 배타적 선택을 나타내는 의미가 핵심이어서 문장 초반의 강조 구조로 옮겼습니다.
- source_word: dignus fuisti
  english_pob_choice: were worthy
  chosen_korean: 합당하셨습니다
  alternatives_korean:
  - 가치가 있으셨습니다
  - 자격이 있으셨습니다
  lexicon: dignus,sum
  rationale: 라틴어는 ‘worthy’이지 ‘found worthy’가 아니므로, 문맥상 자연스러운 합쇼체로 ‘합당하셨습니다’라고 옮겨 자격/합당성의 의미를 유지했습니다.
- source_word: altissimi secretum hoc
  english_pob_choice: this secret of the Most High
  chosen_korean: 지극히 높으신 분의 이 비밀
  alternatives_korean:
  - 가장 높으신 분의 이 비밀
  - 지극히 높으신 이의 비밀
  lexicon: altissimus, secretum
  rationale: 직역보다 한국어에서 자연스러운 ‘비밀’을 유지하고, 소유격은 ‘~의’로 처리해 원문의 관계를 분명히 했습니다.
theological_decisions:
- issue: Most High의 호칭 처리
  chosen_reading: ‘지극히 높으신 분’으로 의인화된 신적 칭호를 유지했습니다.
  alternative_readings:
  - ‘지존자’
  - ‘가장 높으신 분’
  rationale: 본문의 ‘altissimi’는 하나님의 초월성과 권위를 가리키므로, 전통적이지만 다소 딱딱한 ‘지극히 높으신 분’을 택해 신적 호칭의 무게를 살렸습니다.
  doctrine_reference: 신적 초월성에 대한 성경적 호칭 보존
- issue: ‘dignus fuisti’의 의미
  chosen_reading: ‘합당하셨습니다’로 옮겨 단순한 감정적 칭찬이 아니라 지혜의 비밀을 알 자격/적격성을 나타냈습니다.
  alternative_readings:
  - ‘가치가 있으셨습니다’
  - ‘자격이 있으셨습니다’
  rationale: 문맥상 지혜의 비밀을 받는 자격을 말하므로, ‘worthy’의 윤리적·관계적 적합성을 드러내는 표현이 필요했습니다.
  doctrine_reference: 계시와 선택의 적합성
