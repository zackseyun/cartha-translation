revisions:
- from: 그리고 당신이 오른쪽에 있는 머리 쪽으로 두 개의 작은 날개가 지나가는 것을 보았기 때문에, 이것이 그 해석입니다. 이것들은 지극히 높으신 분께서 마지막을 위해 보존하신 자들입니다. 이 나라는 짧았고 혼란으로 가득했습니다.」[a]
  to: “그리고 당신이 작은 날개 두 개가 오른쪽에 있는 머리 쪽으로 지나가는 것을 보셨으므로, 그 뜻은 이러합니다. 그들은 지극히 높으신 분께서 그 끝을 위하여 보호해 두신 이들입니다.[a] 그 나라는 오래가지 못했고 혼란으로 가득했습니다.”
  rationale: 소유격 suam의 의미와 그에 따른 선행사 모호성을 보존하고, 자연스러운 현대 한국어 문장으로 다듬었습니다. 제공된 영어 감사본의 ‘brief kingdom and full of turmoil’도 ‘오래가지 못했고 혼란으로 가득했습니다’로 충실히 반영했습니다. 발췌 끝의 Sicut은 다음 문맥으로 이어지는 미완의 연결어이므로, 독립된 한국어 접속사로 덧붙이지 않았습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:32Z'
