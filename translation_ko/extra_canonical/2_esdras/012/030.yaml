  source_fidelity: 라틴어 finem suam의 소유격 suam은 ‘그/그것의 끝’이라는 관계를 나타내지만, 제공된 발췌만으로 그 선행사는 확정하기 어렵습니다. 초안의 ‘마지막을 위해’는 이 소유 관계를 지워 버리므로, ‘그 끝을 위하여’로 옮겨 모호성을 보존하는 편이 안전합니다. regnum exile은 영어 감사본의 ‘brief kingdom’에 맞추어 ‘오래가지 못한 나라’로 자연스럽게 옮길 수 있습니다.
  naturalness: ‘두 개의 작은 날개’보다 ‘작은 날개 두 개’가 자연스럽고, ‘이것이 그 해석입니다’는 ‘그 뜻은 이러합니다’가 문맥상 더 자연스럽습니다. 또한 인용부호가 닫는 부호만 있어 문장 형식도 바로잡아야 합니다.
  terminology: ‘지극히 높으신 분’은 Most High에 적절하며, 사람을 대상으로 한 ‘보존하신 자들’은 가능하나 ‘보호해 두신 이들’이 현대 한국어에서 더 자연스럽습니다. ‘혼란으로 가득했습니다’도 turbationis plenum을 잘 반영합니다.
