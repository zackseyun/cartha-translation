base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/030.yaml
  text: '“And because you saw two little wings passing over to the head on the right side, this is the interpretation: these are the ones whom the Most High has preserved for its end. This was a brief kingdom and full of turmoil,”'
translation:
  language: ko
  text: “그리고 당신이 작은 날개 두 개가 오른쪽에 있는 머리 쪽으로 지나가는 것을 보셨으므로, 그 뜻은 이러합니다. 그들은 지극히 높으신 분께서 그 끝을 위하여 보호해 두신 이들입니다.[a] 그 나라는 오래가지 못했고 혼란으로 가득했습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 finem suam은 직역하면 ‘그/그것의 끝’을 뜻합니다. 이 발췌만으로는 소유격의 선행사를 확정하기 어려우므로, 번역도 ‘그 끝’으로 그 관계를 보존했습니다.
    reason: source_note
lexical_decisions:
- source_word: finem suam
  english_pob_choice: for its end / the end
  chosen_korean: 마지막을 위해
  alternatives_korean:
  - 그 끝을 위해
  - 종말을 위해
  - 마지막 때를 위해
  lexicon: finis
  rationale: 라틴어 finem suam은 문자 그대로 ‘그 끝’이지만, 영어 POB가 자연스러운 ‘the end’로 정리한 점을 따라 한국어에서도 목적·종결의 의미를 살려 ‘마지막을 위해’로 옮겼습니다.
- source_word: regnum exile
  english_pob_choice: a brief kingdom
  chosen_korean: 이 나라는 짧았고
  alternatives_korean:
  - 이 왕국은 짧았고
  - 이 나라의 통치는 짧았고
  - 이 제국은 짧았고
  lexicon: regnum
  rationale: regnum은 정치적 통치권과 나라/왕국의 뜻을 함께 가지므로, 문맥상 설명적 표현인 ‘이 나라’로 풀어 POB의 간결한 역사적 서술을 살렸습니다.
- source_word: turbationis plenum
  english_pob_choice: full of turmoil
  chosen_korean: 혼란으로 가득했습니다
  alternatives_korean:
  - 소동으로 가득했습니다
  - 동요로 가득했습니다
  - 격변으로 가득했습니다
  lexicon: turbatio
  rationale: turbatio는 단순한 감정적 불안이 아니라 질서가 흔들리는 혼란을 가리키므로, 한국어로는 ‘혼란으로 가득했습니다’가 가장 직접적입니다.
- source_word: Sicut
  english_pob_choice: ''
  chosen_korean: 그리고
  alternatives_korean:
  - 마치
  - 같이
  - 그와 같이
  lexicon: sicut
  rationale: 본문이 절 말미에서 다음 단락으로 넘어가는 연결어로 남아 있어, 문장 흐름을 자연스럽게 이어 주는 최소한의 접속사로 처리했습니다.
theological_decisions:
- issue: 지극히 높으신 분의 소유격 표현
  chosen_reading: 지극히 높으신 분께서 마지막을 위해 보존하신 자들
  alternative_readings:
  - 지극히 높으신 분의 마지막을 위해 보존된 자들
  - 지극히 높으신 분이 끝을 위해 간직하신 자들
  rationale: 라틴어는 보존의 주체를 지극히 높으신 분으로 분명히 하므로, 한국어에서도 주어-동작 관계를 살려 하나님의 보존 행위를 분명하게 드러냈습니다.
  doctrine_reference: 섭리, 보존
