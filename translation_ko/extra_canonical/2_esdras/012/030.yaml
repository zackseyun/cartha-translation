  alternative_readings:
  - 지극히 높으신 분의 마지막을 위해 보존된 자들
  - 지극히 높으신 분이 끝을 위해 간직하신 자들
  rationale: 라틴어는 보존의 주체를 지극히 높으신 분으로 분명히 하므로, 한국어에서도 주어-동작 관계를 살려 하나님의 보존 행위를 분명하게 드러냈습니다.
