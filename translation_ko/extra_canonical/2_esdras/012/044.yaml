    rationale: 원문에 시간 부사 ‘이미’에 해당하는 말이 없습니다. 문맥상 암시될 수는 있으나 번역문에서는 생략하는 편이 더 직접적입니다.
  - severity: low
    issue: ‘그러므로’의 연결
    rationale: si ergo는 여기서 결론을 단정하기보다 ‘그렇다면’이라는 조건적·수사적 전환으로 옮기는 것이 자연스럽습니다.
  - severity: medium
    issue: 하나님께 대한 ‘당신께서’ 호칭
    rationale: 현대 표준 한국어의 공적 성서 문체에서 하나님께 직접 말할 때 ‘당신’은 대체로 부자연스럽거나 무례하게 들릴 수 있습니다. 본문 문맥에 맞는 ‘주님께서’가 적절합니다.
  - severity: low
    issue: 각주 표현의 어색함
    rationale: ‘불타는 불 속에서’는 한국어에서 중복되고 부자연스럽습니다. 라틴어의 어근 반복이 주는 표현 가능성은 ‘불길 속에서 불탔더라면’으로 자연스럽게 제시할 수 있습니다.
