base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/012/044.yaml
  text: Or are not the evils that have happened to us enough? If then you forsake us[a], how much better it would have been for us if we too had been burned in the fire
  footnotes:
  - marker: a
    text: Or 'burned in the burning'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리에게 닥친 그 재앙들이 이미 충분하지 않습니까? 그러므로 당신께서 우리를 버리신다면, 우리도 불 속에서 타버렸더라면 얼마나 더 좋았겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘불타는 불 속에서’.
    reason: previous_rendering
lexical_decisions:
- source_word: nobis mala quae contigerunt
  english_pob_choice: the evils that have happened to us
  chosen_korean: 우리에게 닥친 그 재앙들
  alternatives_korean:
  - 우리에게 일어난 악들
  - 우리에게 닥친 불행들
  lexicon: mala
  rationale: 라틴어 mala는 단순한 ‘악’보다 이 본문에서 실제로 겪은 재난·불행의 뉘앙스가 강하므로, 현대 한국어에서는 ‘재앙들’이 가장 자연스럽고 원문 긴장을 잘 살립니다.
- source_word: Si ergo tu nos dereliqueris
  english_pob_choice: If then you forsake us
  chosen_korean: 그러므로 당신께서 우리를 버리신다면
  alternatives_korean:
  - 그러니 당신이 우리를 떠나신다면
  - 그렇다면 당신께서 우리를 버리신다면
  lexicon: derelinquere
  rationale: derelinquere는 단순한 물리적 이탈보다 관계적 유기를 뜻하므로 ‘버리시다’가 적절합니다. 2인칭 직접 호칭이므로 ‘당신께서’로 합쇼체를 유지했습니다.
- source_word: essemus succensi et nos in incendio
  english_pob_choice: if we too had been burned in the fire
  chosen_korean: 우리도 불 속에서 타버렸더라면
  alternatives_korean:
  - 우리도 불에서 불탔더라면
  - 우리도 화염 속에서 타버렸더라면
  lexicon: succendere / incendium
  rationale: English POB의 ‘burned in the fire’를 따라, 라틴어 incendio를 ‘불 속’으로 옮겨 의미를 분명히 했습니다. 과장된 직역 ‘불에서 불타다’보다 한국어 문맥에서 자연스럽습니다.
theological_decisions:
- issue: 절 전체의 수사 의문과 조건문의 감정 강도
  chosen_reading: 하나님을 향한 항의적 탄식으로, 재앙의 충분함과 버림받음의 공포를 강하게 드러내는 표현으로 옮겼습니다.
  alternative_readings:
  - 완곡한 질문조로 약화시키는 번역
  - 단순한 정보 진술로 바꾸는 번역
  rationale: 본문은 단순한 사실 확인이 아니라 고통 속에서 제기되는 격한 탄식이므로, 한국어에서도 질문과 가정법의 압박감을 유지해야 합니다.
  doctrine_reference: lament rhetoric; source-sense preservation
