  verdict: revise
  source_fidelity: 라틴어의 수사 의문, 조건절(si ergo), 비교 강조(quanto ... melius), 그리고 ‘우리도’(et nos)는 대체로 충실히 반영되었습니다. 다만 ‘이미’는 현존 라틴어 구절에 명시되지 않았고, ‘그러므로’는 조건부 전환인 si ergo보다 한국어에서 다소 인과적으로 들립니다.
  naturalness: ‘당신께서’는 하나님께 드리는 탄원 문맥의 현대 한국어 성서 문체로는 부자연스럽고, 각주 ‘불타는 불 속에서’도 한국어 표현으로 어색합니다. ‘그렇다면’, ‘주님께서’, ‘불에 타 버렸더라면’이 자연스럽습니다.
  terminology: mala는 문맥상 ‘재앙들’로 적절합니다. dereliqueris는 ‘버리신다면’으로, succensi ... in incendio는 ‘불에 타 버렸더라면’으로 충실히 옮길 수 있습니다. 신적 청자를 가리키는 호칭은 본문의 기도 문맥에 맞춰 ‘주님’으로 처리하되, 교리적 해석을 덧붙이지 않습니다.
