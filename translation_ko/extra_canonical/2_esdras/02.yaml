base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/02.yaml
  text: '1 Thus says the Lord: I brought this people out from slavery[16], and I gave them commandments through my servants the prophets, but they were unwilling to listen and made my counsels void.

    2 The mother who bore them says to them, “Go, my children, for I am a widow and forsaken.

    3 I raised you with gladness, and I lost you with mourning and sorrow,

    4 because you sinned before the Lord God and did what is evil before me. But now what shall I do for you? For I am a widow and forsaken. Go, my children, and ask mercy from the Lord.”

    5 But I call upon you, Father, as witness against the mother of these children, because they were unwilling to keep my covenant,

    6 that you may give them shame and give their mother over to plundering, so that

    7 their offspring may not come to be. Let them be scattered among the nations; let their names be blotted out from the earth, because they despised my covenant.

    8 Woe to you, Assyria, who hide the unrighteous with you, evil nation!

    9 Remember what I did to Sodom and Gomorrah, whose land lies in clods of pitch and heaps of ashes. So I will do to those who did not listen to me, says the Lord Almighty.

    10 Thus says the Lord to Ezra: Announce to my people that I will give them the kingdom of Jerusalem, which I was going to give to Israel.

    11 And I will take to myself their glory, and I will give them the everlasting tabernacles that I had prepared for them.

    12 The tree of life shall be for them like the fragrance of ointment, and they shall neither labor nor grow weary.

    13 Ask, and you will receive; pray for a few days for yourselves, that they may be shortened. The kingdom is already prepared for you; keep watch.

    14 Call heaven and earth to witness, for I have put away evil and created good, because I live, says the Lord.

    15 Mother, embrace your children; bring them up with gladness, like a dove; strengthen their feet, because I have chosen you, says the Lord.

    16 And I will raise the dead from their places, and I will bring them out from the tombs, because I have known my name in them.

    17 Do not fear, mother of children, because I have chosen you, says the Lord.

    18 I will send you help—my servants Isaiah and Jeremiah. By their counsel I have sanctified and prepared for you twelve trees laden with various fruits,

    19 and as many springs flowing with milk and honey[13], and seven mighty mountains having rose and lily, by which I will fill your children with joy.

    20 Vindicate the widow, judge for the orphan, give to the needy, protect the fatherless, clothe the naked.

    21 Care for the broken and the weak; do not mock the lame; shelter the maimed, and admit the blind to the sight of my glory.

    22 Keep safe within your walls the old and the young. Wherever you find the dead, mark them and commit them to the grave,

    23 and I will give you the first place in my resurrection. Pause and rest,

    24 my people, for your rest will come. Good nurse, nourish your children, and strengthen their feet.

    25 None of the servants whom I have given you will perish, for I will require them from your number.

    26 Do not be anxious, for when the day of distress and anguish comes, others will weep and be sorrowful, but you will be cheerful and abundant.

    27 The nations will be jealous, but they will be able to do nothing against you, says the Lord.

    28 My hands will cover you, so that your children may not see Gehenna.

    29 Rejoice, mother, with your children, because I will deliver you, says the Lord.

    30 Remember your children who sleep, because I will bring them out from the hidden places of the earth,

    31 and I will show mercy to them, because I am merciful, says the Lord Almighty.

    32 Embrace your children until I come, and proclaim mercy to them, because my springs overflow and my grace does not fail.

    33 I, Ezra, received a command from the Lord on Mount Horeb, that I should go to Israel; but when I came to them, they rejected me and despised the commandment of the Lord.

    34 Therefore I say to you, nations that hear and understand: await your shepherd; he will give you eternal rest, because he is near—the one who will come at the end of the age.

    35 Be ready for the rewards of the kingdom, because everlasting light will shine for you through all eternity.

    36 Flee the shadow of this age; receive the gladness of your glory. I bear witness openly to my Savior.

    37 Receive what has been entrusted to you by the Lord, and rejoice, giving thanks to him who has called you to the heavenly kingdoms.

    38 Rise and stand, and see the number of those who have been sealed at the Lord’s banquet,

    39 who have passed over from the shadow of this age and have received splendid garments from the Lord.

    40 Receive your number, Zion, and gather in your robed ones, who have fulfilled the law of the Lord.

    41 The number of your children, whom you longed for, is complete. Ask for the Lord’s authority, that your people may be sanctified, who were called from the beginning.

    42 I, Ezra, saw on Mount Zion a great multitude that I could not number, and they all were praising the Lord with songs.

    43 And in the midst of them was a young man of lofty stature, taller than all the rest, and he was placing crowns on the head of each one of them, and he was more exalted still; and I was held in wonder.

    44 Then I asked the angel and said, “Who are these, my lord?”

    45 He answered and said to me, “These are the ones who have put off the mortal garment and put on the immortal, and they have confessed the name of God. Now they are being crowned and receiving palms.”

    46 Then I said to the angel, “Who is that young man who places crowns on them and puts palms into their hands?”

    47 He answered and said to me, “He is the Son of God, whom they confessed in the age.” Then I began to magnify those who had stood bravely for the name of the Lord.

    48 Then the angel said to me, “Go[47][40][23], announce to my people what sort of things and how great are the wonders of the Lord God that you have seen.”'
  footnotes:
  - marker: '16'
    text: Latin only witness. The clause 'because I have known my name in them' is textually awkward and could be understood more idiomatically as 'because my name is known in them' or, by conjecture, 'because they have known my name.' The main text preserves the extant Latin's strangeness.
    reason: textual_variant
  - marker: '13'
    text: The line about praying that the days be 'few and shortened' is difficult in Latin. It likely refers to the shortening of the present age or present distress rather than to a wish for a short lifespan.
    reason: lexical_alternative
  - marker: '23'
    text: '''The first place in my resurrection'' renders a Latin phrase literally involving a ''first seat.'' The sense is probably priority or honor in the resurrection, not merely sitting down.'
    reason: lexical_alternative
  - marker: '40'
    text: The Latin word behind 'your robed ones' is literally related to white clothing and can also mean 'candidates.' Here the clothing image fits the visionary scene better than a political sense.
    reason: lexical_alternative
  - marker: '47'
    text: This explicit identification of the crowned figure as 'the Son of God' is a hallmark of the chapter's later Christian compositional layer and should not be read back uncritically into the Jewish apocalypse of chapters 3–14.
    reason: compositional_layer
translation:
  language: ko
  text: '1 주님께서 이렇게 말씀하십니다. “내가 이 백성을 노예 상태에서 이끌어 내었고, 내 종들인 예언자들을 통해 그들에게 명령들을 주었으나, 그들은 듣기를 원치 않았고 내 뜻들을 헛되게 만들었습니다.


    2 그들을 낳은 어머니가 그들에게 말합니다. ‘가거라, 내 자녀들아. 나는 과부이며 버림받은 몸이다.


    3 내가 너희를 기쁨으로 키웠으나, 너희를 슬픔과 비탄으로 잃었구나.


    4 너희가 주 하나님 앞에서 죄를 지었고, 내 앞에서 악한 일을 행했기 때문이다. 그런데 이제 내가 너희를 위해 무엇을 하겠느냐? 나는 과부이며 버림받은 몸이니, 가거라, 내 자녀들아. 그리고 주님께 자비를 구하여라.’


    5 그러나 저는 아버지이신 당신께 이 자녀들의 어머니를 대적하는 증인으로 호소합니다. 그들이 제 언약을 지키려 하지 않았기 때문입니다.


    6 그러므로 그들에게 수치를 주시고 그들의 어머니를 약탈에 넘기셔서,


    7 그들의 후손이 생겨나지 못하게 하소서. 그들을 민족들 가운데로 흩으시고, 그들의 이름을 땅에서 지워 버리소서. 그들이 제 언약을 업신여겼기 때문입니다.


    8 앗수르야, 너는 너의 가운데에서 불의한 자들을 숨기는구나! 악한 민족아, 너에게 화가 있을 것이다!


    9 내가 소돔과 고모라에 대해 행한 일을 기억하여라. 그 땅은 역청 덩어리들과 재더미 위에 놓여 있다. 그러므로 내 말을 듣지 않은 자들에게도 내가 그렇게 하리라. 전능하신 주님께서 말씀하십니다.


    10 주님께서 에스라에게 이렇게 말씀하십니다. “내 백성에게 선포하여라. 내가 그들에게 예루살렘의 왕국을 주겠노라. 그것은 내가 이스라엘에게 주려고 했던 것이다.


    11 내가 그들의 영광을 내게로 취하고, 내가 그들을 위해 마련해 두었던 영원한 장막들을 그들에게 주겠노라.


    12 생명나무는 그들에게 향유의 향기처럼 될 것이며, 그들은 수고하지도 않고 피곤해하지도 않을 것이다.


    13 구하여라, 그러면 받을 것이다. 너희 자신을 위해 며칠을 짧게 해 달라고 기도하여라. 이미 왕국이 너희를 위해 준비되어 있다. 깨어 있어라.


    14 하늘과 땅을 증인으로 부르라. 내가 악을 제거하고 선을 창조했기 때문이다. 내가 살아 있기 때문이다. 주님께서 말씀하십니다.


    15 어머니여, 자녀들을 끌어안고 기쁨으로 그들을 길러라. 비둘기처럼 그리하라. 그들의 발을 굳게 하라. 내가 너를 선택했기 때문이다. 주님께서 말씀하십니다.


    16 내가 죽은 자들을 그들이 있던 곳에서 일으키고, 무덤들에서 그들을 이끌어 내리라. 내가 그들 안에서 내 이름을 알고 있기 때문이다.


    17 자녀들의 어머니여, 두려워하지 말아라. 내가 너를 선택했기 때문이다. 주님께서 말씀하십니다.


    18 내가 너희를 돕기 위해 내 종들인 이사야와 예레미야를 보내겠다. 그들의 조언으로 내가 너희를 위해 여러 열매가 달린 열두 그루의 나무를 거룩하게 하고 마련하였으며,


    19 우유와 꿀이 흐르는 샘들도 그 수만큼, 그리고 장미와 백합을 지닌 거대한 일곱 산도 마련하였으니, 그것들로 내가 너희 자녀들을 기쁨으로 채우겠다.


    20 과부를 의롭게 하고, 고아를 재판하며, 궁핍한 자에게 주고, 아버지 잃은 자를 보호하고, 벌거벗은 자에게 옷을 입혀라.


    21 부서진 자와 약한 자를 돌보아라. 저는 자를 조롱하지 말며, 불구를 보호하고, 맹인을 내 영광의 봄으로 들어오게 하라.


    22 늙은이와 젊은이를 너의 성벽 안에 안전하게 지켜 두어라. 죽은 자를 어디에서 찾든지 표시하고 무덤에 맡겨라.


    23 그러면 내가 너에게 내 부활에서 첫 자리를 주겠다. 잠시 멈추고 쉬어라,


    24 내 백성아, 너희의 안식이 올 것이기 때문이다. 선한 양육자여, 네 자녀들을 먹이고 그들의 발을 굳게 하여라.


    25 내가 너희에게 준 종들 가운데 아무도 멸망하지 않을 것이니, 내가 그들을 너희 수에서 다시 찾을 것이기 때문이다.


    26 염려하지 말아라. 고난과 압박의 날이 오면 다른 이들은 울며 슬퍼하겠지만, 너희는 기쁘고 풍성할 것이다.


    27 민족들은 시기하겠지만, 너희를 거슬러 아무것도 할 수 없을 것이다. 주님께서 말씀하십니다.


    28 내 손이 너희를 덮을 것이니, 너희 자녀가 게헨나를 보지 않게 하려는 것이다.


    29 기뻐하여라, 어머니여, 네 자녀들과 함께. 내가 너를 구해 내겠기 때문이다. 주님께서 말씀하십니다.


    30 잠들어 있는 네 자녀들을 기억하여라. 내가 그들을 땅의 숨은 곳들에서 이끌어 내겠기 때문이다.


    31 나는 자비롭기 때문이다. 전능하신 주님께서 말씀하십니다. 내가 그들에게 자비를 베풀겠다.


    32 내가 오기까지 네 자녀들을 끌어안고, 그들에게 자비를 선포하여라. 내 샘들은 넘쳐흐르고 내 은혜는 결코 다하지 않기 때문이다.


    33 나 에스라는 호렙 산에서 주님께 명령을 받았습니다. 내가 이스라엘로 가야 했기 때문입니다. 그러나 내가 그들에게 가자 그들은 나를 거절하고 주님의 명령을 업신여겼습니다.


    34 그러므로 듣고 깨닫는 민족들아, 내가 너희에게 말한다. 너희의 목자를 기다려라. 그는 너희에게 영원한 안식을 주실 것이다. 그분은 가까이 계시니, 세상 끝에 오실 그분입니다.


    35 왕국의 상급들을 받을 준비를 하여라. 영원한 빛이 영원한 세월 동안 너희에게 비출 것이기 때문이다.


    36 이 시대의 그림자를 피하여라. 너희 영광의 기쁨을 받아라. 나는 내 구원자를 공개적으로 증언합니다.


    37 주님께서 너희에게 맡기신 것을 받아 기뻐하고, 너희를 하늘의 왕국들로 부르신 이에게 감사드려라.


    38 일어나 서서, 주님의 잔치에 도장을 받은 자들의 수를 보아라.


    39 이 시대의 그림자에서 건너와 주님께로부터 찬란한 옷을 받은 자들이다.


    40 시온아, 네 수를 받아라. 그리고 주님의 율법을 완수한 네 흰옷 입은 자들을 모아라.


    41 네가 그토록 바라던 자녀들의 수가 다 찼다. 시작부터 부름받은 네 백성이 거룩하게 되도록 주님의 권세를 구하여라.


    42 나 에스라는 시온 산에서 내가 셀 수 없는 큰 무리를 보았는데, 그들은 모두 노래로 주님을 찬양하고 있었습니다.


    43 그들 가운데는 키가 아주 큰 젊은이가 있었는데, 모든 사람보다 더 컸고, 각 사람의 머리 위에 관을 씌워 주고 있었으며, 또 그보다 더 높이 높임을 받았습니다. 그래서 저는 놀라움에 사로잡혔습니다.


    44 그러자 내가 천사에게 물었습니다. “내 주여, 이들은 누구입니까?”


    45 그가 대답하여 저에게 말했습니다. “이들은 죽을 옷을 벗어 버리고 죽지 않을 옷을 입었으며, 하나님의 이름을 고백한 자들입니다. 이제 그들은 관을 받고 있으며 손바닥 가지들을 받고 있습니다.”


    46 그러자 내가 천사에게 말했습니다. “그들에게 관을 씌우고 그들의 손에 손바닥 가지들을 쥐여 주는 저 젊은이는 누구입니까?”


    47 그가 대답하여 저에게 말했습니다. “그는 하나님의 아들입니다. 그들은 그 시대에 그를 고백했습니다.” 그러자 나는 주님의 이름을 위해 담대히 선 자들을 높이기 시작했습니다.


    48 그러자 천사가 저에게 말했습니다. “가서, 네가 본 주 하나님의 놀라운 일들이 어떤 것들이며 얼마나 큰지 내 백성에게 전하여라.”[a][b][c]'
