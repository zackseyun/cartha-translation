source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: '1 Haec dicit dominus : ego eduxi populum istum de seruitute, quibus mandata dedi per pueros meos prophetas, quos audire noluerunt, sed irrita fecerunt mea consilia.

    2 Mater, quae eos generauit, dicit illis : ite, filii, quia ego uidua sum et derelicta :

    3 Educaui uos cum laetitia et amisi uos cum luctu et tristitia,

    4 quoniam peccastis coram domino deo et quod malum est coram me fecistis. Modo autem quid faciam uobis? ego enim uidua sum et derelicta: ite, filii, et petite a domino

    5 misericordiam. Ego autem te, pater, testem inuoco super matrem filiorum, quia noluerunt testamentum meum seruare,

    6 Vt des eis confusionem et matrem eorum in direptionem, ne

    7 generatio eorum fiat. Dispergantur in gentes, nomina eorum deleantur a terra, quoniam spreuerunt testamentum meum.

    8 Vae tibi, Assur, qui abscondis iniquos penes te! gens mala,

    9 memorare quid fecerim Sodomae et Gomorrae, Quorum terra iacet in picis glebis et aggeribus cinerum: sic dabo eos qui me non audierunt, dicit dominus omnipotens.

    10 Haec dicit dominus ad Ezram: adnuntia populo meo, quoniam dabo eis regnum Hierusalem, quod daturus eram Israel.

    11 Et sumam mihi gloriam illorum et dabo eis tabernacula aeterna,

    12 quae praeparaueram illis. Lignum uitae erit illis in odorem unguenti, et non laborabunt neque fatigabuntur.

    13 Petite et accipietis, rogate uobis dies paucos ut minorentur; iam paratum est uobis regnum: uigilate.

    14 Testare, testare caelum et terram, omisi enim malum et creaui bonum, quia uiuo ego, dicit dominus.

    15 Mater, complectere filios tuos, educa illos cum laetitia sicut columba, confirma pedes eorum, quoniam te elegi, dicit dominus.

    16 Et resuscitabo mortuos de locis suis et de monumentis educam illos, quoniam cognoui nomen meum in illis.

    17 Noli timere, mater filiorum, quoniam te elegi, dicit dominus.

    18 Mittam tibi adiutorium pueros meos Isaiam et Hieremiam, ad quorum consilium sanctificaui et paraui tibi arbores xii grauatās uariis

    19 fructibus Et totidem fontes fluentes lac et mel et montes inmensos septem habentes rosam et lilium, in quibus gaudio replebo

    20 filios tuos. Viduam iustifica, pupillo iudica, egenti da, orfanum tuere, nudum uesti, Confractum et debilem cura, claudum

    21 inridere noli, tutare mancum et caecum ad uisionem claritatis meae admitte, Senem et iuuenem intra muros tuos serua,

    22 Mortuos ubi inueneris, signans commenda sepulchro, et dabo

    23 tibi primam sessionem in resurrectione mea. Pausa et quiesce,

    24 populus meus, quia ueniet requies tua. Nutrix bona, nutri

    25 filios tuos, confirma enim pedes eorum. Seruos quos tibi dedi,

    26 nemo ex eis interiet, ego enim eos requiram de numero tuo, Noli satagere, cum uenerit enim dies pressurae et angustiae,

    27 alii plorabunt et tristes erunt, tu autem hilaris et copiosa eris. Zelabunt gentes et nihil aduersus te poterunt, dicit dominus.

    28 Manus meae tegent te, ne filii tui gehennam uideant. Iocundare,

    29 mater, cum filiis tuis, quia ego te eripiam, dicit dominus.

    30 Filios tuos dormientes memorare, quoniam ego eos educam de

    31 latibulis terrae et misericordiam cum illis faciam, quoniam misericors sum, dicit dominus omnipotens. Amplectere natos

    32 tuos usque dum uenio et praedica illis misericordiam, quoniam exuberant fontes mei, et gratia mea non deficiet. Ego Ezra accepi praeceptum a domino in monte Choreb,

    33 ut irem ad Israel; ad quos cum uenirem, reprobauerunt me et respuerunt mandatum domini. Ideoque uobis dico, gentes,

    34 quae auditis et intellegitis: expectate pastorem uestrum, requiem aeternitatis dabit uobis, quoniam in proximo est ille, qui in finem saeculi adueniet. Parati estote ad praemia regni,

    35 quia lux perpetua lucebit uobis per aeternitatem temporis. Fugite umbram saeculi huius, accipite iocunditatem gloriae

    36 uestrae; ego testor palam saluatorem meum. Commendatum

    37 domini accipite et iocundamini gratias agentes ei qui uos ad

    38 caelestia regna uocauit. Surgite et state et uidete numerum

    39 signatorum in conuiuio domini. Qui se de umbra saeculi

    40 transtulerunt, splendidas tunicas a domino acceperunt. Recipe, Sion, numerum tuum et conclude candidatos tuos, qui legem

    41 domini compleuerunt. Filiorum tuorum, quos optabas, plenus est numerus, roga imperium domini, ut sanctificetur populus tuus, qui uocatus est ab initio.

    42 Ego Ezra uidi in monte Sion turbam magnam, quam numerare non potui, et omnes canticis conlaudabant dominum.

    43 Et in medio eorum erat iuuenis statura celsus, eminentior omnibus illis, et singulis eorum capitibus inponebat coronas, et magis exaltabatur: ego autem miracul[o] tenebar.

    44 Tunc interrogaui angelum et dixi: qui sunt hi, domine?

    45 Qui respondens dixit mihi: hi sunt qui mortalem tunicam deposuerunt et inmortalem sumpserunt et confessi sunt nomen dei: modo coronantur et accipiunt palmas.

    46 Et dixi ad angelum: ille iuuenis quis est, qui eis coronas inponit et palmas in manus

    47 tradit? Qui respondens dixit mihi: ipse est filius dei, quem in saeculo confessi sunt. ego autem magnificare eos coepi, qui

    48 fortiter pro nomine domini steterunt. Tunc dixit mihi angelus: uade, adnuntia populo meo, qualia et quanta mirabilia domini dei uidisti.'
