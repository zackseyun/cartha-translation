    reason: 라틴어 creatura는 단일한 피조물뿐 아니라 집합적인 창조 세계를 가리킬 수 있습니다.
  revision_rationale: 원문의 조건 논증을 보존하고, 마지막 절의 문법적 주어를 creatura로 바로잡았습니다. 신적 호칭을 ‘주님’으로 통일했으며, 각주는 creatura의 집합적 의미를 드러내도록 수정했습니다.
