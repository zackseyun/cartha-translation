id: 2ES.5.45
reference: 2 Esdras 5:45
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'cabis a te creatam creaturam in unum ? si ergo uiuentes uiuent in unum et sustinebit creatura, poterit et nunc portare praesentes in unum. Et dixit ad me : interroga matricem mulieris et'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/045.yaml
  text: And I said[a], “How then did you say to your servant that you will surely give life to the creation created by you all at once? If then the living will live all at once and the creation will endure, it can also now bear those who are present all at once.”
  footnotes:
  - marker: a
    text: Or 'the creature created by you'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 말했습니다. 「그렇다면 주님께서 당신의 종에게 당신이 지으신 피조물을 한꺼번에 살리시겠다고 말씀하신 것은 어떻게 된 일입니까? 그러므로 살아 있는 자들이 한꺼번에 살고 피조물이 견딘다면, 지금 있는 이들도 한꺼번에 감당할 수 있습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신이 지으신 피조물’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: creatam creaturam / creatura
  english_pob_choice: the creation created by you / the creation
  chosen_korean: 피조물
  alternatives_korean:
  - 창조물
  - 창조된 존재들
  lexicon: creatura
  rationale: 라틴어 creatura의 집합적 의미를 따라 단수형이지만 전체 창조 세계를 가리키는 말로 보고, 현대 한국어에서는 ‘피조물’이 가장 자연스럽게 그 집합성과 피조성 둘 다를 드러냅니다.
- source_word: sustinebit
  english_pob_choice: will endure
  chosen_korean: 견딘다면
  alternatives_korean:
  - 버틴다면
  - 지속된다면
  lexicon: sustinere
  rationale: 문맥상 ‘붙들다’보다 창조 세계가 감당하고 버텨 내는 지속 능력을 말하므로, POB의 ‘endure’를 따라 ‘견디다’로 옮겼습니다.
- source_word: poterit ... portare
  english_pob_choice: it can also now bear
  chosen_korean: 지금 있는 이들도 한꺼번에 감당할 수 있습니다
  alternatives_korean:
  - 지금 있는 자들도 한꺼번에 운반할 수 있습니다
  - 지금 이들을 또한 한꺼번에 تحمل할 수 있습니다
  lexicon: portare
  rationale: portare는 물리적 ‘운반’보다 ‘감당하다/떠받치다’의 의미가 문맥에 더 적합하므로, 한국어에서는 ‘감당하다’로 자연스럽게 풀었습니다.
- source_word: ad me
  english_pob_choice: And I said
  chosen_korean: 내가 말했습니다
  alternatives_korean:
  - 내가 말했습니다
  - 내가 대답했습니다
  lexicon: dico / dicere
  rationale: 서술자의 응답을 표준적인 현대 한국어 서술로 정리하되, 추가 해석 없이 단순한 발화 동사로 유지했습니다.
theological_decisions:
- issue: 집합적 ‘creation’의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘피조물’로 번역해 전체 창조 세계의 집합적 대상임을 유지했습니다.
  alternative_readings:
  - ‘창조’
  - ‘창조된 것’
  rationale: 다음 절의 복수적 ‘살아 있는 자들’과 맞물려 단일 개체가 아니라 창조 전체를 가리키므로, 집합성과 피조성을 동시에 보존하는 번역이 필요합니다.
  doctrine_reference: 창조론/피조물의 보편성
- issue: 라틴어 수사 질문의 종말론적 긴장 유지
  chosen_reading: ‘한꺼번에’와 ‘견딘다면’의 반복을 살려 창조 세계가 감당할 수 있는가라는 긴장을 유지했습니다.
  alternative_readings:
  - 문장을 더 매끈하게 정리하는 방식
  - ‘동시에’로 완화하는 방식
  rationale: 원문의 반복은 논증의 압박감을 형성하므로, 한국어에서도 그 리듬을 보존해 질문의 강도를 약화시키지 않았습니다.
  doctrine_reference: 본문 수사 구조 보존
