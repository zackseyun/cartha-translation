id: 2ES.5.55
reference: 2 Esdras 5:55
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: his qui ante uos, Et qui post uos quam et uos, quasi iam senescentis creaturae et fortitudinem iuuentutis praeterientis.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/055.yaml
  text: 'Therefore consider also for yourself: you are smaller in stature than those before you, and those who come after you will be smaller than you, as of a creation already growing old and passing beyond the strength of youth.'
translation:
  language: ko
  text: 그러므로 그대 자신도 생각해 보십시오. 그대는 그대보다 앞선 이들보다 키가 작고, 그대 뒤에 올 이들은 그대보다 더 작을 것입니다. 이는 이미 늙어 가며 젊음의 힘을 지나가고 있는 창조 세계와 같습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: his qui ante uos / qui post uos
  english_pob_choice: those before you / those who come after you
  chosen_korean: 너보다 앞선 이들 / 너보다 뒤에 올 이들
  alternatives_korean:
  - 당신보다 앞선 사람들 / 뒤에 올 사람들
  - 너보다 먼저 온 자들 / 너보다 뒤에 올 자들
  lexicon: ante, post
  rationale: 라틴어의 시간적 대비를 살려 ‘앞선 이들’과 ‘뒤에 올 이들’로 옮겨, 단순한 연대 비교가 아니라 세대 간 대비가 드러나게 했습니다.
- source_word: quasi iam senescentis creaturae
  english_pob_choice: as of a creation already growing old
  chosen_korean: 마치 이미 늙어 가고 있는 피조물과 같습니다
  alternatives_korean:
  - 마치 이미 노쇠해 가는 창조물과 같습니다
  - 마치 이미 늙어 가는 창조세계 같습니다
  lexicon: creatura
  rationale: creatura를 신학적으로 넓게 풀어 ‘피조물’로 옮겨, 세계 전체의 노쇠 이미지를 보존하면서도 자연스러운 한국어가 되도록 했습니다.
- source_word: fortitudinem iuuentutis praeterientis
  english_pob_choice: passing beyond the strength of youth
  chosen_korean: 젊음의 힘을 지나가고 있는
  alternatives_korean:
  - 청춘의 힘을 지나치고 있는
  - 젊은 시절의 힘을 넘어가고 있는
  lexicon: fortitudo, iuventus
  rationale: ‘젊음의 힘’은 라틴어의 직결된 이미지를 살리면서도 한국어에서 비유적으로 이해되기 쉬운 표현입니다.
theological_decisions:
- issue: '비유의 범위: 인류 세대의 쇠퇴를 피조세계 전체의 노쇠 이미지로 표현할지 여부'
  chosen_reading: ‘이미 늙어 가고 있는 피조물’로 옮겨, 인간 세대의 비교를 넘어서는 창조 질서의 쇠약 이미지를 드러냈습니다.
  alternative_readings:
  - ‘이미 늙어 가는 창조세계’
  - ‘이미 노쇠해 가는 세상’
  rationale: 문맥의 비교는 사람들의 키와 세대 변화이지만, 라틴어는 이를 ‘피조물’의 노쇠에 비유하므로 그 우주론적 함의를 보존하는 편이 더 source-direct합니다.
  doctrine_reference: 창조 세계의 타락/쇠잔 이미지(창 3장, 롬 8:20-22와의 주제적 연관)
