- from: 그러므로 너 자신을 위해서도 생각하십시오. 너는 너보다 앞선 이들보다 키가 작고, 너보다 뒤에 올 이들도 너보다 더 작을 것입니다. 마치 이미 늙어 가며 젊음의 힘을 지나가고 있는 피조물과 같습니다.[a]
  to: 그러므로 그대 자신도 생각해 보십시오. 그대는 그대보다 앞선 이들보다 키가 작고, 그대 뒤에 올 이들은 그대보다 더 작을 것입니다. 이는 이미 늙어 가며 젊음의 힘을 지나가고 있는 창조 세계와 같습니다.
  rationale: The revision regularizes the formal-polite address, makes the opening idiomatic, and renders creatura as ‘창조 세계’ to preserve the image of the created order aging. The comparative statements and the ambiguous, poetic final comparison remain intact. The unnecessary lexical footnote is removed.
