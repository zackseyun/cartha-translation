revisions:
- from: 그대는 그 여자에게 이렇게 말할 것입니다. 「어째서 그대가 지금 낳은 아이들은 전에 낳은 아이들과 같지 않고, 키가 더 작습니까?」
  to: 그대는 그 여인에게 이렇게 말할 것입니다. “왜 그대가 지금 낳은 이들은 앞서 태어난 이들과 같지 않고 몸집이 더 작습니까?”
  rationale: 원문의 예고 뒤 직접 질문이라는 구조와 출산 행위를 보존했습니다. 비교 대상에 원문에 없는 ‘앞서 낳은’이라는 구체화를 피하고, statu를 ‘몸집’으로 옮겨 신장에만 한정되지 않는 ‘stature’의 의미를 살렸습니다. 직접화법은 현대 표준 한국어 합쇼체로 다듬었습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:35:48Z'
review_pass:
  verdict: revise
  source_fidelity: 핵심 의미는 대체로 전달되었으나, 라틴어 his qui ante는 ‘전에 낳은 아이들’이라고 출산 행위를 다시 명시하기보다 ‘앞서 태어난 이들/먼저 있던 이들’로 옮겨 비교 대상의 표현을 보존하는 편이 안전합니다. statu는 단순한 신장만을 뜻한다고 단정하기보다 ‘체격/몸집’의 외형적 크기를 가리키므로, 한국어에서는 ‘몸집이 더 작다’가 더 포괄적입니다.
  naturalness: ‘그 여자’는 현대 한국어의 공적 성경 문체에서 다소 거칠고 대상화하는 인상을 줄 수 있으므로 ‘그 여인’이 적절합니다. 또한 ‘어째서’보다 ‘왜’가 현대 합쇼체의 직접 질문에 더 자연스럽습니다.
  terminology: ‘낳은 이들’은 peperisti의 출산 행위를 유지합니다. ‘앞서 태어난 이들’은 his qui ante의 비교 대상을 자연스럽게 나타내며, ‘몸집’은 statu의 외형적 크기라는 뜻을 과도하게 ‘키’로 한정하지 않습니다.
  issues:
  - severity: medium
    issue: 비교 대상에 ‘전에 낳은’을 추가함
    rationale: his qui ante는 문자상 ‘앞서 [있던/온] 이들’이며, 영어 POB도 ‘those who came before’로 처리합니다. 앞선 출산이라는 해석은 문맥상 가능하지만 원문 표현보다 구체화합니다.
  - severity: low
    issue: statu를 ‘키’로 한정함
    rationale: statu는 stature, 즉 외형적 크기나 몸집을 가리킵니다. ‘키’만으로 번역하면 의미 범위가 다소 좁아집니다.
  - severity: low
    issue: ‘그 여자’의 문체상 어감
    rationale: 합쇼체 공적 문체에서는 ‘그 여인’이 더 중립적이고 자연스럽습니다.
  revised_text: 그대는 그 여인에게 이렇게 말할 것입니다. “왜 그대가 지금 낳은 이들은 앞서 태어난 이들과 같지 않고 몸집이 더 작습니까?”
