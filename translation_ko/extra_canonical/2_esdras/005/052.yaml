  yaml_path: translation/extra_canonical/2_esdras/005/052.yaml
  text: For you will say to her, "Why are those whom you have now borne not like those who came before, but smaller in stature?"
translation:
  language: ko
  text: 그대는 그 여인에게 이렇게 말할 것입니다. “왜 그대가 지금 낳은 이들은 앞서 태어난 이들과 같지 않고 몸집이 더 작습니까?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quos peperisti
  english_pob_choice: those whom you have now borne
  chosen_korean: 그대가 지금 낳은 아이들
  alternatives_korean:
  - 그대가 지금 낳은 자녀들
  - 그대가 지금 낳은 이들
  lexicon: peperisti = 낳다/출산하다
  rationale: 출산 행위를 직접 살리되, 한국어에서는 자연스럽게 ‘아이들’로 풀어 인물보다 자녀를 가리키는 뜻을 분명히 했습니다.
- source_word: nunc non sunt similes his qui ante
  english_pob_choice: not like those who came before
  chosen_korean: 전에 낳은 아이들과 같지 않고
  alternatives_korean:
  - 먼저 낳은 아이들과 같지 않고
  - 앞서 태어난 아이들과 닮지 않고
  lexicon: similes = 같다/비슷하다
  rationale: similes의 비교를 자연스럽게 옮기면서, 영어 POB의 순서를 따라 ‘전에’와 ‘같지 않고’를 배치했습니다.
- source_word: sed minores statu
  english_pob_choice: but smaller in stature
  chosen_korean: 키가 더 작습니다
  alternatives_korean:
  - 체구가 더 작습니다
  - 키가 더 작고 몸집이 작습니다
  lexicon: minores statu = smaller in stature
  rationale: statu의 ‘키/체구’ 뉘앙스를 간결하게 살려, 외형적 크기 차이를 직접적으로 드러냈습니다.
theological_decisions:
- issue: 대화의 호칭과 직접화법
  chosen_reading: 서술문 안에서 ‘그대는 … 말할 것입니다’로 예고하고, 인용문에서는 여인에게 직접 묻는 형태를 유지했습니다.
  alternative_readings:
  - ‘당신은 … 말할 것입니다’
  - 간접화법으로만 처리
  rationale: 본문의 예고-인용 구조를 보존해 장면의 긴장을 살렸고, 합쇼체 안에서 직접 질문의 자연스러운 흐름을 유지했습니다.
  doctrine_reference: n/a
