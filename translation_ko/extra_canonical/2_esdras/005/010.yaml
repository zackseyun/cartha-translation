revisions:
- from: 그리고 그것은 많은 사람들에게서 찾게 되겠지만 발견되지 않을 것이며, 불의와 방종이 땅 위에 더 많이 퍼질 것입니다.
  to: 그리고 많은 사람이 그것을 찾을 것이나 찾아내지 못할 것이며, 불의와 무절제가 땅 위에 더욱 많아질 것입니다.
  rationale: 행위 주체를 올바르게 반영하도록 multis를 ‘많은 사람이’으로 고쳤습니다. 불특정 선행사를 가진 ‘그것’을 유지하여 원문의 문맥 의존적 지시를 보존했습니다. incontinentia는 ‘무절제’로, multiplicabitur는 ‘더욱 많아지다’로 옮겨 라틴어의 기본 의미를 충실히 반영했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:35Z'
review_pass:
  verdict: revise
  source_fidelity: ‘많은 사람들에게서’는 라틴어 multis(‘많은 사람들에 의해/많은 사람이’)를 장소·출처처럼 잘못 처리합니다. 또한 incontinentia는 주로 ‘자기 절제의 결여, 무절제’를 뜻하므로 ‘방종’보다 ‘무절제’가 더 직접적입니다. multiplicabitur는 ‘퍼지다’보다 우선적으로 ‘증가하다/많아지다’입니다.
  naturalness: ‘많은 사람이 그것을 찾을 것이나 찾아내지 못할 것이며’는 한국어에서 자연스럽고, 수동 미래 quaeretur의 의미도 행위 주체를 밝혀 충실히 전달합니다. ‘땅 위에 더욱 많아질 것입니다’도 현대 합쇼체 문체에 맞습니다.
  terminology: iniustitia는 ‘불의’로 적절합니다. incontinentia는 본문의 윤리적 의미를 과도하게 특정하지 않는 ‘무절제’가 적절합니다.
  issues:
  - severity: high
    issue: multis의 격 기능 오역
    rationale: 초안의 ‘많은 사람들에게서’는 ‘많은 사람들로부터’라는 출처 의미가 되어, ‘많은 사람들에 의해 찾힐 것’이라는 수동문의 행위 주체를 바꿉니다.
  - severity: medium
    issue: incontinentia의 의미가 다소 강하고 좁게 번역됨
    rationale: ‘방종’은 제멋대로 행동함을 강조하지만, 라틴어 incontinentia의 기본 뜻은 자기 절제의 부재입니다. ‘무절제’가 더 정확하고 중립적입니다.
  - severity: low
    issue: multiplicabitur의 양적 증가 의미 약화
    rationale: ‘더 많이 퍼지다’는 확산을 앞세우지만, 원문은 불의와 무절제가 증가함을 말합니다. ‘더욱 많아지다’가 더 가깝습니다.
  revised_text: 그리고 많은 사람이 그것을 찾을 것이나 찾아내지 못할 것이며, 불의와 무절제가 땅 위에 더욱 많아질 것입니다.
  revised_footnotes: []
