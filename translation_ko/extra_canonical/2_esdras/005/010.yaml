source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et quaeretur a multis et non invenietur, et multiplicabitur iniustitia et incontinentia super terram.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/010.yaml
  text: And it will be sought by many and will not be found, and unrighteousness and lack of self-control will be multiplied on the earth.
translation:
  language: ko
  text: 그리고 많은 사람이 그것을 찾을 것이나 찾아내지 못할 것이며, 불의와 무절제가 땅 위에 더욱 많아질 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: quaeretur
  english_pob_choice: it will be sought
  chosen_korean: 찾게 되겠지만
  alternatives_korean:
  - 구해질 것이지만
  - 찾아질 것이지만
  - 찾으려 할 것이지만
  lexicon: quaerere
  rationale: 수동적 미래 의미를 살리되, 한국어에서 자연스러운 ‘찾게 되다’로 옮겨 ‘many’의 탐색 행위를 드러냈습니다.
- source_word: multis
  english_pob_choice: by many
  chosen_korean: 많은 사람들에게서
  alternatives_korean:
  - 많은 이들에게서
  - 많은 사람들에 의해
  - 많은 자들에게서
  lexicon: multi
  rationale: 행위 주체를 분명히 하면서도 현대 한국어에서 매끄러운 표현으로 처리했습니다.
- source_word: iniustitia
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의함
  - 의롭지 않음
  - 불법
  lexicon: iniustitia
  rationale: 도덕적·신학적 반대 개념을 직설적으로 살려, 단순한 법적 위반보다 넓은 의미를 유지했습니다.
- source_word: incontinentia
  english_pob_choice: lack of self-control
  chosen_korean: 방종
  alternatives_korean:
  - 절제 없음
  - 자제력 없음
  - 무절제
  lexicon: incontinentia
  rationale: 라틴어의 자기 절제 부재를 한국어의 윤리적 함의가 있는 ‘방종’으로 옮겨, POB의 도덕적 진단을 간결하게 반영했습니다.
theological_decisions:
- issue: 악이 ‘땅 위에 더 많이 퍼질 것입니다’라는 종말론적 진술의 강조
  chosen_reading: 증가하는 불의와 방종이 지면 전체를 덮는 방향성을 살렸습니다.
  alternative_readings:
  - 땅에서 늘어날 것입니다
  - 세상에 널리 퍼질 것입니다
  rationale: 원문의 multiplicabitur super terram은 단순한 양적 증가뿐 아니라 지상 전역으로의 확산을 함축하므로, ‘더 많이 퍼질 것입니다’로 그 긴장을 유지했습니다.
  doctrine_reference: 2 Esdras의 묵시적 경고 문맥
