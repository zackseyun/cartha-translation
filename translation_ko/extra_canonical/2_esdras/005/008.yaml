translation:
  language: ko
  text: 그리고 혼돈이 여러 곳에 생기고,[a] 불이 자주 뿜어져 나오며, 들짐승들이 자기 지역을 떠날 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘여러 곳에 깊은 틈이 생길 것입니다.’
    reason: chaos는 문맥과 전승에 따라 물리적인 심연 또는 균열을 가리키는 것으로 이해될 수 있습니다.
lexical_decisions:
- source_word: Et chaos fiet per loca multa
  english_pob_choice: And chaos will come in many places
  chosen_korean: 그리고 혼란이 여러 곳에 일어나며
  alternatives_korean:
  - 그리고 공허가 여러 곳에 일어나며
  - 그리고 깊은 틈이 여러 곳에 생기며
  lexicon: chaos
  rationale: 라틴어 chaos는 여기서 영어 POB의 최신 판단처럼 단순한 ‘혼돈’보다 광범위한 재난·뒤집힘을 가리키는 표현으로 읽히므로, 한국어에서는 문맥상 자연스럽고 포괄적인 ‘혼란’을 택했습니다.
- source_word: per loca multa
  english_pob_choice: in many places
  chosen_korean: 여러 곳에
  alternatives_korean:
  - 많은 곳에
  - 곳곳에
  lexicon: per + loca multa
  rationale: 장소의 분포를 간결하게 살리기 위해 ‘여러 곳에’로 옮겼습니다.
- source_word: et ignis frequenter emittetur
  english_pob_choice: and fire will often break out
  chosen_korean: 불이 자주 일어나며
  alternatives_korean:
  - 불이 자주 터져 나오며
  - 불이 자주 번지며
  lexicon: ignis frequenter emittetur
  rationale: emittetur는 ‘내보내지다/터져 나오다’의 뉘앙스가 있으나, 재난의 자연발화·발생을 한국어로 가장 직접적으로 드러내는 ‘일어나다’를 사용했습니다.
- source_word: et bestiae agrestes transmigrabunt regionem suam
  english_pob_choice: and wild beasts will leave their own region
  chosen_korean: 들짐승들이 자기의 지역을 떠날 것입니다
  alternatives_korean:
  - 들짐승들이 자기 지역을 옮길 것입니다
  - 들짐승들이 본래 살던 곳을 옮길 것입니다
  lexicon: bestiae agrestes / transmigrabunt regionem suam
  rationale: agrestes는 ‘들/야생의’ 의미를 살려 ‘들짐승들’로 옮기고, transmigrabunt는 단순 이동보다 ‘자기 지역을 떠나다’가 문맥에 맞아 그 방향으로 번역했습니다.
theological_decisions:
- issue: 묵시적 재난 표상인 chaos의 한국어 처리
  chosen_reading: ‘혼란’으로 옮겨, 지질학적 ‘틈’보다 재난과 질서 붕괴의 총체적 표상을 드러냈습니다.
  alternative_readings:
  - ‘틈’ 또는 ‘구멍’처럼 물리적 균열을 강조하는 번역
  rationale: 영어 POB의 최종 판단은 라틴 chaos를 단순한 물리적 균열보다 더 넓은 종말론적 재난 표지로 읽습니다. 따라서 한국어에서도 그 신학적·문학적 효과를 보존하는 쪽이 적절합니다.
  doctrine_reference: 묵시문학의 재난 표상
