id: 2ES.5.25
reference: 2 Esdras 5:25
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus abyssis maris replesti tibi rivum unum, et ex omnibus aedificatis civitatibus sanctificasti tibimet ipsi Sion,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/025.yaml
  text: and from all the depths of the sea you filled for yourself one stream[a], and from all the cities that have been built you sanctified Zion for yourself,
  footnotes:
  - marker: a
    text: Or 'and from all the birds that have been created you named for yourself one dove, and from all the cattle that have been formed you provided for yourself one sheep,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 당신께서는 바다의 모든 심연 가운데서 한 물줄기를 자신을 위하여 채우셨고, 세워진 모든 도시들 가운데서 시온을 자신을 위하여 거룩하게 하셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ex omnibus abyssis maris
  english_pob_choice: from all the depths of the sea
  chosen_korean: 바다의 모든 깊은 곳에서
  alternatives_korean:
  - 바다의 모든 심연에서
  - 바다의 모든 깊은 데서
  lexicon: abyssus / maris
  rationale: abyssi(s) 마리스는 단순한 ‘바다’보다 더 깊고 밑바닥의 이미지를 지니므로, ‘깊은 곳’으로 옮겨 원문의 공간적 중량을 살렸습니다.
- source_word: replesti tibi rivum unum
  english_pob_choice: you filled for yourself one stream
  chosen_korean: 한 개울을 당신 자신을 위해 채우셨고
  alternatives_korean:
  - 한 시내를 당신 자신을 위해 채우셨고
  - 한 냇물을 당신 자신을 위해 채우셨고
  lexicon: replere + rivus
  rationale: replesti는 ‘채우셨다’가 직접 대응하고, rivum unum은 자연스러운 작은 물줄기인 ‘개울’로 옮겨 의미를 유지했습니다.
- source_word: sanctificasti tibimet ipsi Sion
  english_pob_choice: you sanctified Zion for yourself
  chosen_korean: 시온을 당신 자신을 위해 거룩하게 하셨습니다
  alternatives_korean:
  - 시온을 당신을 위해 거룩하게 하셨습니다
  - 시온을 당신께 속한 것으로 구별하셨습니다
  lexicon: sanctificare + Sion
  rationale: sanctificare는 단순 헌납보다 ‘거룩하게 하다/성별하다’의 의미가 강하므로, 시온에 대한 선택적 구별을 드러내는 표준적 표현을 사용했습니다.
- source_word: aedificatis civitatibus
  english_pob_choice: from all the cities that have been built
  chosen_korean: 지어진 모든 도시들 가운데서
  alternatives_korean:
  - 세워진 모든 도시들 가운데서
  - 건설된 모든 도시들 가운데서
  lexicon: aedificare + civitas
  rationale: aedificatis civitatibus는 이미 세워진 도시들을 가리키므로, ‘지어진’으로 직역성 있게 옮겼습니다.
theological_decisions:
- issue: 시온의 ‘거룩하게 하다’ 표현
  chosen_reading: 하나님께서 시온을 당신 자신을 위해 구별하여 거룩한 소유로 삼으셨다는 뜻으로 읽었습니다.
  alternative_readings:
  - 시온을 의례적으로 정결하게 하셨다는 읽기
  - 시온을 단순히 축복하셨다는 완화된 읽기
  rationale: sanctificasti는 본문상 시온을 특별히 구별하는 행위를 말하므로, ‘거룩하게 하다’가 지닌 성별 의미를 유지하는 것이 가장 충실합니다.
  doctrine_reference: 성별/성화의 어휘 범주
