id: 2ES.5.22
reference: 2 Esdras 5:22
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et resumpsit anima mea spiritum intellectus, et iterum coepi loqui coram Altissimo sermones
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/022.yaml
  text: And my soul recovered the spirit of understanding[a], and again I began to speak before the Most High.
  footnotes:
  - marker: a
    text: Or "And I said, 'Lord, Master, from every forest of the earth and from all its trees you chose for yourself one vine,".
    reason: previous_rendering
translation:
  language: ko
  text: 그러자 내 영혼이 깨달음의 영을 다시 얻었고, 나는 다시 지존자 앞에서 말하기 시작했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: resumpsit anima mea
  english_pob_choice: my soul recovered
  chosen_korean: 내 영혼이 다시 얻었고
  alternatives_korean:
  - 내 영혼이 회복되었고
  - 내 영혼이 다시 받아들였고
  lexicon: anima
  rationale: anima는 여기서 생명 원리보다는 화자의 내적 존재를 가리키므로 ‘영혼’으로 옮기되, resumpsit의 회복/재획득 뉘앙스를 살려 ‘다시 얻었고’로 표현했습니다.
- source_word: spiritum intellectus
  english_pob_choice: the spirit of understanding
  chosen_korean: 깨달음의 영
  alternatives_korean:
  - 이해의 영
  - 총명의 영
  lexicon: spiritus intellectus
  rationale: 직역형 ‘이해의 영’도 가능하지만, 한국어에서 더 자연스럽고 문맥상 인식의 회복을 드러내는 ‘깨달음의 영’이 원문의 의미를 잘 전달합니다.
- source_word: iterum coepi loqui
  english_pob_choice: again I began to speak
  chosen_korean: 나는 다시 말하기 시작했습니다
  alternatives_korean:
  - 나는 다시 말하기를 시작했습니다
  - 나는 다시 말하기 시작하였습니다
  lexicon: coepi loqui
  rationale: 라틴어 sermones가 별도의 목적어를 요구하지 않으므로, 개정된 영어처럼 자연스러운 한국어로 ‘말하기 시작했습니다’라고 옮겼습니다.
- source_word: coram Altissimo
  english_pob_choice: before the Most High
  chosen_korean: 지존자 앞에서
  alternatives_korean:
  - 지극히 높으신 분 앞에서
  - 가장 높으신 분 앞에서
  lexicon: Altissimus
  rationale: Altissimo는 하나님의 호칭이므로 직역적이면서도 경건한 호칭인 ‘지존자’를 사용해 인격적 대면의 의미를 살렸습니다.
theological_decisions:
- issue: Altissimo의 신적 호칭 처리
  chosen_reading: ‘지존자’로 번역해 하나님 앞에서의 직접적 발화를 분명히 했습니다.
  alternative_readings:
  - ‘지극히 높으신 분’
  - ‘가장 높으신 이’
  rationale: 원문은 추상적 고유명사보다 하나님의 절대적 높으심을 강조하는 호칭이므로, 한국어 성서 문체에서 충분히 알아볼 수 있으면서도 직접성을 유지하는 표현을 택했습니다.
  doctrine_reference: 하나님의 초월성과 직접 현전
- issue: ‘영혼’과 ‘영’의 구분
  chosen_reading: anima는 ‘영혼’, spiritum intellectus는 ‘깨달음의 영’으로 구분했습니다.
  alternative_readings:
  - 둘 다 ‘영’으로 통일
  - 둘 다 ‘혼’으로 통일
  rationale: 원문은 화자의 내적 주체(anima)와 새로 얻은 인식의 능력(spiritum intellectus)을 구분하므로, 한국어에서도 같은 구분이 드러나게 했습니다.
  doctrine_reference: 인간 내면의 회복과 인식의 은사
