id: 2ES.5.37
reference: 2 Esdras 5:37
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: reuirida mihi aridos flores, Et aperi mihi clausa prumptuaria et produc mihi inclusos in eis flatos, aut monstra mihi uocis imaginem, et tunc ostendam tibi eum laborem quem rogas
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/037.yaml
  text: Restore to me the dried flowers[a], and open for me the storehouses that are shut, and bring out for me the winds enclosed in them, or show me the image of a voice; then I will show you that labor which you ask.
  footnotes:
  - marker: a
    text: Or 'the labor that'.
    reason: previous_rendering
translation:
  language: ko
  text: 마른 꽃들을 나에게 되돌려 주고, 닫혀 있는 창고들을 열어 주며, 그 안에 갇힌 바람들을 나에게 꺼내 주거나, 소리의 형상을 나에게 보여 주십시오. 그러면 내가 당신이 묻는 그 일을 보여 드리겠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그 고난을’.
    reason: alternative_reading
lexical_decisions:
- source_word: reuirida mihi aridos flores
  english_pob_choice: Restore to me the dried flowers
  chosen_korean: 마른 꽃들을 나에게 되돌려 주고
  alternatives_korean:
  - 마른 꽃들을 회복시켜 주고
  - 시든 꽃들을 나에게 돌려주고
  lexicon: reuirida / aridos flores
  rationale: 동사 reuirida는 ‘되살리다/회복시키다’의 뉘앙스를 가지지만, 여기서는 앞선 요청에 응답하는 병렬 구조를 살려 ‘되돌려 주고’로 옮겨 원문의 회복·반환 요구를 드러냈습니다.
- source_word: clausa prumptuaria
  english_pob_choice: the storehouses that are shut
  chosen_korean: 닫혀 있는 창고들
  alternatives_korean:
  - 닫혀 있는 곳간들
  - 봉해진 저장고들
  lexicon: clausa prumptuaria
  rationale: prumptuaria는 저장 공간을 가리키므로 일상적이면서도 문맥에 맞는 ‘창고들’로 옮겼고, clausa는 상태를 나타내는 ‘닫혀 있는’으로 처리했습니다.
- source_word: produc mihi inclusos in eis flatos
  english_pob_choice: bring out for me the winds enclosed in them
  chosen_korean: 그 안에 갇힌 바람들을 나에게 꺼내 주며
  alternatives_korean:
  - 그 안에 갇힌 바람들을 나에게 끌어내며
  - 그 안에 봉해진 바람들을 나에게 내보이며
  lexicon: inclusos...flatos
  rationale: flatos는 ‘숨/바람’의 물리적 이미지를 유지해야 하므로 추상화하지 않고 ‘바람들’로 옮겼고, inclusos는 억압된 상태를 살려 ‘갇힌’으로 번역했습니다.
- source_word: monstra mihi uocis imaginem
  english_pob_choice: show me the image of a voice
  chosen_korean: 소리의 형상을 나에게 보여 주십시오
  alternatives_korean:
  - 목소리의 형상을 나에게 보여 주십시오
  - 소리의 모양을 나에게 보여 주십시오
  lexicon: uocis imaginem
  rationale: vox는 단순한 ‘목소리’보다 넓게 들릴 수 있으나, 원문의 기이한 표현을 보존하기 위해 비유성을 살린 ‘소리의 형상’으로 직역에 가깝게 유지했습니다.
- source_word: eum laborem
  english_pob_choice: that labor
  chosen_korean: 그 일을
  alternatives_korean:
  - 그 고통을
  - 그 수고를
  lexicon: eum laborem
  rationale: 직전 맥락에서 laborem Iacob이 ‘야곱의 고난/괴로움’이지만, 여기서는 지시어 eum이 앞 절의 항목들을 가리키는 답변 구조이므로 한국어에서는 자연스럽게 ‘그 일’로 받아 후행 설명을 살렸습니다.
theological_decisions:
- issue: laborem의 의미 범위와 앞선 문맥 연결
  chosen_reading: 5:37의 '그 일'은 앞선 5:35의 '야곱의 고난'을 포함하는 답변으로 읽되, 본절에서는 추상적 '노동'보다 문맥상 '일/사건'의 응답 표현을 택했습니다.
  alternative_readings:
  - 그 고난을
  - 그 수고를
  - 그 노동을
  rationale: 라틴어 labor는 여기서 ‘일’보다 ‘고난/괴로움’ 쪽이 강하지만, 본절의 문장 전체는 에즈라가 묻는 ‘그것’을 가리키는 답변이므로 한국어에서는 과도한 신학화 없이 문맥 지시를 우선했습니다.
  doctrine_reference: 문맥적 지시어 해석; 2 Esdras 5:35-37 연속성
