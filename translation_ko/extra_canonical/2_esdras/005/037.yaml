revisions:
- from: 마른 꽃들을 나에게 되돌려 주고, 닫혀 있는 창고들을 열어 주며, 그 안에 갇힌 바람들을 나에게 꺼내 주거나, 소리의 형상을 나에게 보여 주십시오. 그러면 내가 당신이 묻는 그 일을 보여 드리겠습니다.[a]
  to: 마른 꽃들을 나에게 되돌려 주고, 닫혀 있는 창고들을 열어 주며, 그 안에 갇힌 바람들을 나에게 꺼내 주거나, 소리의 형상을 나에게 보여 주십시오. 그러면 내가 당신이 물으신 그 고난을 보여 드리겠습니다.
  rationale: 앞 절에서 에즈라가 제기한 ‘야곱의 고난’을 가리키는 라틴어 eum laborem의 문맥적 지시를 본문에서 회복했습니다. 이에 따라 ‘고난’을 단순한 대안으로 처리하던 각주를 삭제했습니다. 그 밖의 표현은 라틴어의 병렬 구조와 의도적으로 역설적인 이미지를 유지했습니다.
