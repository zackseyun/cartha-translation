  text: And he said to it, “If you bear ten, why over time? Ask it therefore to give birth to ten at one time.” And I said, “Certainly it cannot, but—”
translation:
  language: ko
  text: 그가 그것에게 말했습니다. “네가 열 명을 낳는다면, 왜 시간을 두고 낳습니까? 그러므로 그것에게 열 명을 한 번에 낳으라고 하십시오.” 그러자 제가 말했습니다. “그것은 분명히 할 수 없습니다. 그러나—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dices ad eam
  english_pob_choice: And he said to it
  chosen_korean: 그가 그에게 말했습니다
  alternatives_korean:
  - 그가 그것에게 말했습니다
  - 그가 그에게 이르렀습니다
  lexicon: Latin pronoun reference
  rationale: 라틴어 대명사 지시 대상을 과도하게 특정하지 않고, 영어 POB의 중립적 지시를 따라 자연스럽게 옮겼습니다.
- source_word: decem si paris
  english_pob_choice: If you bear ten
  chosen_korean: 네가 열을 낳는다면
  alternatives_korean:
  - 네가 열 명을 낳는다면
  - 네가 열을 배면
  lexicon: pario
  rationale: pario의 출산/낳다 의미를 살리되, 한국어에서 가장 직접적이고 읽기 쉬운 표현으로 옮겼습니다.
- source_word: per tempus
  english_pob_choice: why over time
  chosen_korean: 왜 시차를 두어야 합니까
  alternatives_korean:
  - 왜 시간을 두어야 합니까
  - 왜 단계적으로 합니까
  lexicon: per tempus
  rationale: 시간을 나누어 두는 뜻을 반영하되, 원문의 비교적 난해한 표현을 한국어로도 난해함이 남도록 유지했습니다.
- source_word: in unum
  english_pob_choice: at one time
  chosen_korean: 한꺼번에
  alternatives_korean:
  - 한 번에
  - 동시에
  lexicon: in unum
  rationale: 여러 번이 아니라 한 시점에 함께라는 의미를 자연스러운 한국어로 전달했습니다.
- source_word: non utique poterit, sed
  english_pob_choice: Certainly it cannot, but—
  chosen_korean: 분명히 그것은 할 수 없습니다. 그러나—
  alternatives_korean:
  - 물론 그것은 할 수 없습니다. 그러나—
  - 결코 그것은 할 수 없습니다. 그러나—
  lexicon: non utique poterit
  rationale: 단정적인 불가능을 살리면서도, 문장이 끊기는 원문 상태를 한국어에서도 그대로 보존했습니다.
theological_decisions:
- issue: 출산 비유의 직접성 유지
  chosen_reading: 원문에 없는 완곡화 없이 출산 이미지를 직접적으로 살렸습니다.
  alternative_readings:
  - ‘낳다’를 ‘생기다’처럼 완곡하게 처리
  - 비유를 일반적 생성 표현으로 완화
  rationale: 라틴어 pario와 문맥상 출산 비유의 충격과 직접성을 약화시키지 않는 것이 원문 충실성에 더 부합합니다.
  doctrine_reference: 문학적/수사적 충실성
- issue: 끊어진 인용문의 보존
  chosen_reading: 마지막 절을 ‘그러나—’로 끝내어 미완성된 발화를 유지했습니다.
  alternative_readings:
  - 문장을 매끈하게 종결
  - 추정 보완어를 덧붙임
  rationale: 영어 POB와 라틴어 모두 말이 끊기는 효과를 갖고 있으므로, 이를 한국어에서도 보존해야 합니다.
  doctrine_reference: 본문 비평 및 서사 수사
