- from: 그가 그에게 말했습니다. “네가 열을 낳는다면, 왜 시차를 두어야 합니까? 그러니 그에게 열을 한꺼번에 낳아 주라고 하십시오.” 그러고 나서 제가 말했습니다. “분명히 그것은 할 수 없습니다. 그러나—”
  to: 그가 그것에게 말했습니다. “네가 열 명을 낳는다면, 왜 시간을 두고 낳습니까? 그러므로 그것에게 열 명을 한 번에 낳으라고 하십시오.” 그러자 제가 말했습니다. “그것은 분명히 할 수 없습니다. 그러나—”
  rationale: 비인칭 여성 지시 대상의 정체를 원문에 없는 ‘여자의 태’ 등으로 특정하지 않으면서, 한국어에서 남성 인물로 오해될 수 있는 ‘그에게’를 ‘그것에게’로 바로잡았습니다. 출산의 시간적 분산이라는 수사적 논리를 ‘시간을 두고 낳다’로 명료하게 반영했으며, 원문의 미완 문장은 유지했습니다.
