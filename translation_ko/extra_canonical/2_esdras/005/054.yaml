  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Considera ergo et tu
  english_pob_choice: Therefore consider also for yourself
  chosen_korean: 그러므로 너 자신도 살펴보십시오
  alternatives_korean:
  - 그러므로 너도 생각해 보십시오
  - 그러므로 너 자신도 고려하십시오
  lexicon: considera → 살펴보십시오
  rationale: 명령형의 촉구를 살리되, 단순한 지적 행위보다 자신을 돌아보라는 뉘앙스를 자연스럽게 담았습니다.
- source_word: minores statu estis
  english_pob_choice: you are smaller in stature
  chosen_korean: 키가 더 작습니다
  alternatives_korean:
  - 체구가 더 작습니다
  - 키가 더 작으십니다
  - 신체적으로 더 작습니다
  lexicon: minores statu → 작은 체구/키가 더 작다
  rationale: 라틴어 문맥의 비교적·신체적 의미를 직설적으로 옮겨, 추상화하지 않고 외형적 작음을 드러냈습니다.
- source_word: prae his qui ante uos
  english_pob_choice: than those before you
  chosen_korean: 너희보다 앞선 사람들보다
  alternatives_korean:
  - 너희 이전의 사람들보다
  - 너희보다 먼저 있던 이들보다
  lexicon: prae his qui ante vos → before you/earlier than you
  rationale: 비교 대상이 시간적으로 앞선 사람들임을 드러내기 위해 ‘앞선 사람들’로 옮겼습니다.
