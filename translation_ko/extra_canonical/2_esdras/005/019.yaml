source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'et dixi ei: vade a me et non ad me accedas usque diebus septem, et tunc venies ad me. et audivit ut dixi et recessit a me.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/019.yaml
  text: And I said to him[a], 'Go away from me, and do not come near me until seven days have passed, and then you may come to me.' And he did as I said and withdrew from me.
  footnotes:
  - marker: a
    text: Or 'And I fasted seven days, wailing and weeping, as Uriel the angel had commanded me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 그에게 말했습니다. 「내게서 떠나가라. 그리고 칠 일이 지나기까지는 내게 가까이 오지 마라. 그런 다음 내게 오너라.」 그는 내가 말한 대로 하여 내게서 물러갔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: vade a me
  english_pob_choice: Go away from me
  chosen_korean: 내게서 떠나가라
  alternatives_korean:
  - 내 곁을 떠나라
  - 내게서 물러가라
  lexicon: vade
  rationale: 명령형의 거리감을 분명히 살리면서도 현대 한국어에서 자연스럽고 직접적인 표현으로 옮겼습니다.
- source_word: non ad me accedas
  english_pob_choice: do not come near me
  chosen_korean: 내게 가까이 오지 마라
  alternatives_korean:
  - 내게 다가오지 마라
  - 내 앞으로 오지 마라
  lexicon: accedas
  rationale: 접근 금지를 그대로 반영해, 단순한 이동보다 ‘가까이 오다’의 의미를 살렸습니다.
- source_word: usque diebus septem
  english_pob_choice: until seven days have passed
  chosen_korean: 칠 일이 지나기까지는
  alternatives_korean:
  - 일곱 날이 지나기까지는
  - 칠 일 동안은
  lexicon: usque + dies septem
  rationale: 기한의 경과를 나타내는 구문이므로, 단순 기간보다 ‘지나기까지’가 더 정확합니다.
- source_word: audivit ut dixi
  english_pob_choice: he did as I said
  chosen_korean: 제가 말한 대로 하고
  alternatives_korean:
  - 제가 말한 것을 듣고
  - 제가 시킨 대로 하고
  lexicon: audivit ut dixi
  rationale: 문맥상 ‘듣다’보다 순종/이행의 뜻이 자연스럽고, 영어 POB의 수정도 이 방향을 지지합니다.
