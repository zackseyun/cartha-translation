review_pass:
  verdict: revise
  source_fidelity: 라틴어 본문을 대체로 충실히 옮겼습니다. usque diebus septem은 ‘칠 일이 지나기까지’, audivit ut dixi는 문맥상 명령을 따랐다는 뜻으로 번역한 것이 적절합니다. 다만 tunc에는 ‘그때에/그런 다음’의 시간 순서만 있으며 ‘-야’의 강조·제한은 없습니다.
  naturalness: 서술은 현대 표준어 합쇼체로 자연스럽습니다. 인용된 명령형 ‘떠나가라/오지 마라/오너라’는 화자의 직접 명령으로 적절합니다. ‘그러고 나서야’만 불필요한 강조를 피하여 ‘그런 다음’으로 다듬는 편이 낫습니다.
  terminology: 인명이나 신학 용어가 없는 구절입니다. ‘내게서 떠나가라’, ‘내게 가까이 오지 마라’, ‘물러갔습니다’는 원문의 거리 두기와 명령의 어조를 잘 살립니다.
  issues:
