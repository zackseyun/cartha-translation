  yaml_path: translation/extra_canonical/2_esdras/005/032.yaml
  text: the angel who had come to me on the previous night was with me[a], and he said to me, 'Hear me, and I will instruct you; pay attention to me, and I will add further.'
  footnotes:
  - marker: a
    text: Or "And I said, 'Speak, my lord.' And he said to me, 'You have become greatly carried away in your mind over Israel. Have you loved him more than he who made him?'".
    reason: previous_rendering
translation:
  language: ko
  text: 지난밤에 내게 왔던 그 천사가 나와 함께 있었습니다. 그가 내게 말했습니다. “내 말을 들으십시오. 그러면 내가 당신을 가르치겠습니다. 내게 귀를 기울이십시오. 그러면 내가 더 덧붙이겠습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: est angelus ... ad me
  english_pob_choice: the angel ... was with me
  chosen_korean: 천사가 ... 나와 함께 있었습니다
  alternatives_korean:
  - 천사가 ... 내게 있었습니다
  - 천사가 ... 나를 찾아왔습니다
  lexicon: angelus = 천사
  rationale: 라틴어 est angelus ad me는 단순 출현보다 현존/동반의 상태를 강조하므로, POB의 영어처럼 ‘was with me’의 관계를 살려 ‘나와 함께 있었습니다’로 옮겼습니다.
- source_word: praeterita nocte
  english_pob_choice: on the previous night
  chosen_korean: 지난 밤에
  alternatives_korean:
  - 전날 밤에
  - 지난밤에
  lexicon: praeterita nocte = 지난 밤에
  rationale: 시간 부사는 직역하되 한국어에서 자연스러운 현대 문체로 다듬었습니다. 문맥상 단순한 이전 시점을 뜻하므로 ‘전날 밤에’도 가능하지만, 본문 호흡에는 ‘지난 밤에’가 더 직접적입니다.
- source_word: audi me et instruam te, et intende mihi et adiciam
  english_pob_choice: Hear me, and I will instruct you; pay attention to me, and I will add further.
  chosen_korean: 내 말을 들으십시오. 그러면 내가 당신을 가르치겠습니다. 내게 귀를 기울이십시오. 그러면 내가 더하여 말씀드리겠습니다
  alternatives_korean:
  - 내 말을 들으십시오. 그러면 내가 당신을 가르치겠습니다. 내게 주의하십시오. 그러면 내가 더하겠습니다
  - 내 말을 들으십시오. 그러면 내가 당신을 훈계하겠습니다. 내게 귀를 기울이십시오. 그러면 내가 더 말씀하겠습니다
  lexicon: instruam = 가르치겠습니다; intende mihi = 내게 귀를 기울이십시오; adiciam = 더하여 말씀드리겠습니다
  rationale: instruam은 단순 정보 전달보다 지시·가르침의 뉘앙스가 있어 ‘가르치겠습니다’가 적합합니다. adiciam은 문맥상 뒤에 더 말하겠다는 뜻이므로, 한국어에서는 ‘더하여 말씀드리겠습니다’로 자연스럽게 풀었습니다.
theological_decisions:
- issue: 천사의 발화체를 한국어에서 어떻게 처리할지
  chosen_reading: 천사의 직접 인용은 명령형 합쇼체로 유지해 권위 있는 구어적 권면을 드러냈습니다.
  alternative_readings:
  - 평서형으로 완화하여 번역
  - 더 전통적인 경어체로 높임
  rationale: 원문은 명령형 연속이므로, 한국어에서도 청자에게 직접 요구하는 음성을 보존하는 것이 적합합니다. 다만 현대 독자가 읽기 쉬운 합쇼체로 정리했습니다.
  doctrine_reference: source fidelity / discourse force
