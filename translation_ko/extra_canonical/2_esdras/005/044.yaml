  revision_rationale: 원문의 saeculum을 ‘그 시대’로 명시하여 둘째 절의 주어와 ‘그 안에서’의 지시 대상을 회복했습니다. sustinere는 문맥에 맞고 자연스러운 ‘감당하다’로 조정했습니다. in unum의 수식 범위가 논의될 수 있으므로 ‘모두 한꺼번에’를 유지해 영어 POB의 ‘all at once’를 반영하되 불필요한 해석은 더하지 않았습니다.
