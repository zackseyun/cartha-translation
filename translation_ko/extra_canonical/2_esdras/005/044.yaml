language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'spondit ad me et dixit : non potest festinare creatura super creatorem, nec sustinere saeculum qui in eo creati sunt in unum. Et dixi : quomodo dixisti seruo tuo, quoniam uiuificans uiuifi-'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/044.yaml
  text: And he answered me and said[a], 'The creature cannot hasten faster than the Creator, nor can the age sustain those who were created in it all at once.'
  footnotes:
  - marker: a
    text: Or 'The creature cannot hasten beyond the Creator'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 내게 대답하여 말했습니다. 「피조물은 창조주보다 더 빨리 서두를 수 없으며, 그 시대도 그 안에서 지음받은 자들을 모두 한꺼번에 감당할 수 없습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘피조물은 창조주를 넘어 서두를 수 없습니다’.
    reason: super creatorem을 비교적 ‘창조주보다 더 빨리’로 이해하는 본문 번역과 달리, ‘창조주를 넘어’로 이해할 수 있는 대안적 표현을 제시합니다.
lexical_decisions:
- source_word: spondit ad me et dixit
  english_pob_choice: And he answered me and said
  chosen_korean: 그가 내게 대답하여 말했습니다
  alternatives_korean:
  - 그가 내게 응답하여 말했습니다
  - 그가 내게 대답하고 말했습니다
  lexicon: respondere / dicere
  rationale: 라틴어의 응답-발화 이중구조를 자연스러운 한국어로 옮기되, 서술체의 문학적 긴장을 유지했습니다.
- source_word: creatura
  english_pob_choice: The creature
  chosen_korean: 피조물
  alternatives_korean:
  - 창조된 것
  - 창조물
  lexicon: creatura
  rationale: 여기서는 개별 생물보다 창조된 존재 전체를 가리키는 집합적 의미가 강하므로, ‘피조물’이 본문 뜻을 가장 직접적으로 드러냅니다.
- source_word: super creatorem
  english_pob_choice: than the Creator
  chosen_korean: 창조주보다
  alternatives_korean:
  - 창조주를 넘어
  - 창조주보다 더
  lexicon: super + comparative
  rationale: 라틴어 super가 단순한 공간적 ‘넘어서’보다 비교의 의미를 띠므로, ‘보다’로 처리해 계층적 대비를 보존했습니다.
- source_word: sustinere saeculum ... in unum
  english_pob_choice: nor can the age sustain those who were created in it all at once
  chosen_korean: 또한 그 안에서 지음받은 자들을 한꺼번에 붙들어 둘 수도 없습니다
  alternatives_korean:
  - 또한 그 시대는 그 안에서 지음받은 자들을 한꺼번에 견디지 못합니다
  - 또한 그 시대는 그 안에 지음받은 자들을 한 번에 감당할 수 없습니다
  lexicon: sustinere / saeculum / in unum
  rationale: sustinere는 단순 ‘견디다’보다 ‘붙들어 두다/감당하다’의 지속적 지탱 의미가 있어, saeculum을 ‘시대’보다 ‘그 안에서 지음받은 자들’과의 관계가 드러나는 ‘한꺼번에’ 구조로 살렸습니다.
theological_decisions:
- issue: 피조물과 창조주의 위계적 대비
  chosen_reading: 피조물이 창조주보다 앞서거나 더 빨리 나아갈 수 없다는, 창조 질서의 비대칭을 그대로 드러냈습니다.
  alternative_readings:
  - 피조물이 창조주를 넘어설 수 없다는 완화된 표현
  - 피조물이 창조주보다 앞서 서두를 수 없다는 시간적 표현
  rationale: 본문은 존재론적·시간적 우선순위를 함께 강조하므로, 지나친 해석적 완화를 피하고 원문의 대비를 유지했습니다.
  doctrine_reference: 창조론 / 섭리
- issue: saeculum의 의미
  chosen_reading: saeculum은 단순한 ‘세상’보다 피조된 시대·질서의 전체를 가리키는 말로 보아 ‘그 안에서 지음받은 자들’과 연결했습니다.
  alternative_readings:
  - 세상
  - 시대
  rationale: 뒤절의 병행이 ‘시대’라는 추상보다 그 안의 피조 존재들의 한계에 초점을 두므로, 의미 관계를 드러내는 번역을 택했습니다.
  doctrine_reference: 종말론 / 창조 질서
