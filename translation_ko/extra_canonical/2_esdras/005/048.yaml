  text: terrae his qui seminati sunt super eam per tempus. Quem-
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/048.yaml
  text: And he said to me, 'So I also gave the womb of the earth to those who were sown upon it in their time.'
translation:
  language: ko
  text: 그리고 그가 내게 말씀하셨습니다. 「나도 땅의 태를 그 땅 위에 뿌려진 자들에게 그들의 때에 주었습니다.」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: terrae
  english_pob_choice: the womb of the earth
  chosen_korean: 땅의 태
  alternatives_korean:
  - 땅의 태반
  - 땅의 자궁
  - 대지의 태
  lexicon: terra / womb metaphor
  rationale: 라틴어의 ‘태’(womb) 은 땅을 생명 산출의 자리로 의인화한 은유이므로, 직설적이면서도 한국어에서 문학적으로 이해되는 ‘땅의 태’로 옮겼습니다.
- source_word: seminati sunt
  english_pob_choice: were sown
  chosen_korean: 뿌려진 자들
  alternatives_korean:
  - 심겨진 자들
  - 씨 뿌림을 받은 자들
  - 파종된 자들
  lexicon: semino / passive participle
  rationale: 수동 의미를 살리되 자연스러운 합쇼체 문장 안에서 대상 집단을 드러내기 위해 ‘뿌려진 자들’로 처리했습니다.
- source_word: per tempus
  english_pob_choice: in their time
  chosen_korean: 그들의 때에
  alternatives_korean:
  - 제때에
  - 때를 따라
  - 그 시기에
  lexicon: tempus / temporal phrase
  rationale: 라틴어의 복수 대상과 시간성에 맞추어, EN POB의 수정을 따라 ‘각각’보다 ‘그들의 때에’가 더 직접적으로 대응합니다.
theological_decisions:
- issue: 땅의 ‘태’ 은유를 직역할지 완화할지
  chosen_reading: 은유를 보존한 채 ‘땅의 태’로 직역했습니다.
  alternative_readings:
  - ‘땅의 자궁’으로 풀어 생물학적 이미지를 강화
  - ‘대지의 품’으로 완화
  rationale: 본문은 생명을 낳는 땅의 이미지를 강하게 의도하므로, 전통적 완화어보다 원문의 충격과 상징성을 보존하는 쪽이 더 충실합니다.
  doctrine_reference: 창조 상상력과 땅의 의인화에 관한 성서적 비유 읽기
- issue: 지시 대상의 복수성
  chosen_reading: ‘그들의 때에’로 복수 주어와 시간 표현을 맞췄습니다.
  alternative_readings:
  - ‘각자 때에’
  - ‘제때에’
  rationale: EN POB의 최신 정리와 라틴어 복수 표현에 따라, 개별적 분배보다 공동체적 복수 대상을 분명히 하는 번역이 더 적절합니다.
  doctrine_reference: 문맥상 집합적 대상과 분배적 시간 표현의 대응
