source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'me interrogasti? Et dixit ad me: quomodo non potes facere unum de his quae dicta sunt, sic non poteris inuenire iudicium'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/040.yaml
  text: And he said to me[a], 'Just as you cannot do one of these things that have been spoken[b], so you cannot find out the judgment.'
  footnotes:
  - marker: a
    text: Or 'the outcome/goal of the love that I promised to my people.' The Latin leaves open whether the emphasis is on the final result of divine love or its consummation.
    reason: alternative_reading
    anchor_ref: '5:40'
  - marker: b
    text: Or 'the end of the love'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 나에게 말했습니다. “당신이 나에게 물었습니까? 말해진 이 일들 가운데 하나도 할 수 없듯이, 당신도 그 판단을 찾아낼 수 없습니다.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Et dixit ad me
  english_pob_choice: And he said to me
  chosen_korean: 그가 저에게 대답하여 이르렀습니다
  alternatives_korean:
  - 그리고 그가 저에게 말했습니다
  - 그가 저에게 이르렀습니다
  lexicon: dixit / dicere
  rationale: 라틴어의 단순 발화보다 앞선 문맥의 질문에 대한 응답이라는 점을 살려 「대답하여 이르렀습니다」로 자연스럽게 옮겼습니다.
- source_word: his quae dicta sunt
  english_pob_choice: one of these things that have been spoken
  chosen_korean: 이 일들 가운데 하나
  alternatives_korean:
  - 말해진 것들 가운데 하나
  - 이렇게 말해진 것들 가운데 하나
  lexicon: haec + dicta sunt
  rationale: 지시대명사 his quae를 반영해 「이」를 살리고, 문맥상 여러 ‘말해진 일들’ 중 하나를 가리키므로 복수의 항목성을 유지했습니다.
- source_word: iudicium
  english_pob_choice: the judgment
  chosen_korean: 그 판결
  alternatives_korean:
  - 판단
  - 심판
  - 재판
  lexicon: iudicium
  rationale: 이 절에서는 법적·판정적 의미가 강해 「판결」이 가장 직접적이며, 추상적인 「판단」보다 원문의 무게를 더 잘 보존합니다.
theological_decisions:
- issue: '문장의 범위: 추가된 ''사랑의 목표/끝'' 구문을 포함할지 여부'
  chosen_reading: 현존 라틴어 본문에 있는 내용만 반영해 마지막은 단순히 '그 판결'로 번역했습니다.
  alternative_readings:
  - '''내가 내 백성에게 약속한 사랑의 목표''를 포함하는 해석'
  - '''그 사랑의 끝''을 포함하는 이전 독법'
  rationale: 제공된 라틴어에는 해당 구가 없으므로, 본문 범위를 넘는 해석을 본문에 넣지 않고 주석 가능성으로만 남기는 것이 소스 충실성에 맞습니다.
  doctrine_reference: textual criticism / source fidelity
