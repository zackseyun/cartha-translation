translation:
  language: ko
  text: “그를 지으신 분보다 그를 더 높이려는 것입니까?” 내가 말했습니다. “아닙니다, 주님. 그러나 제가 근심 속에서 말하였습니다. 제 속사람이 매시간 저를 괴롭히니, 제가 지극히 높으신 분의 길을 붙잡고 그분의 심판의 일부를 살피려 하기 때문입니다.” 그러자 그분이 저에게 말씀하셨습니다. “너는 할 수 없습니다.” 내가 말했습니다. “왜입니까, 주님? 아니면 제가 왜 태어났습니까? 아니, 어째서 제 어머니의 태가 제 무덤이 되지 않았습니까? 그리하여 제가 야곱의 고난을 보지 않게 하셨을 텐데요.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그를 지으신 분보다 그를 더 높이려는 것입니까?” 내가 말했습니다. “아닙니다, 주님. 그러나 제가 근심 속에서 말하였습니다. 제 속사람이 매시간 저를 괴롭히니, 제가 지극히 높으신 분의 길을 붙잡고 그분의 심판의 일부를 살피려 하기 때문입니다.” 그러자 그분이 저에게 말씀하셨습니다. “너는 할 수 없습니다.” 내가 말했습니다. “왜입니까, 주님? 아니면 제가 왜 태어났습니까? 아니, 어째서 제 어머니의 태가 제 무덤이 되지 않았습니까? 그리하여 제가 야곱의 고난을 보지 않게 하셨을 텐데요.”
    reason: previous_rendering
lexical_decisions:
- source_word: torquent enim me renes mei per omnem horam
  english_pob_choice: for my inward parts torment me every hour
  chosen_korean: 제 속사람이 매시간 저를 괴롭히니
  alternatives_korean:
  - 제 내장들이 매시간 저를 괴롭히니
  - 제 창자들이 매시간 저를 괴롭히니
  lexicon: renes
  rationale: 라틴어 renes는 문자 그대로는 신장/허리 부위지만, 문맥상 고통과 깊은 내적 괴로움을 가리키므로 현대 한국어에서 자연스럽고 오해를 줄이는 ‘속사람’으로 옮겼습니다.
- source_word: querentem adprehendere semitam altissimi et inuestigare partem iudicii eius
  english_pob_choice: as I seek to grasp the path of the Most High and to search out part of his judgment
  chosen_korean: 제가 지극히 높으신 분의 길을 붙잡고 그분의 심판의 일부를 살피려 하기 때문입니다
  alternatives_korean:
  - 제가 지극히 높으신 분의 길을 이해하고 그분의 심판의 일부를 찾아내려 하기 때문입니다
  - 제가 지극히 높으신 분의 길을 붙들고 그분의 판단의 일부를 캐내려 하기 때문입니다
  lexicon: s emitam / inuestigare
  rationale: adprehendere는 단순 이해보다 ‘붙잡다’가 더 강하고, inuestigare는 ‘탐구하다/살피다’의 의미여서 ‘살피다’로 옮겨 탐색의 절박함을 살렸습니다.
- source_word: domine
  english_pob_choice: lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: domine
  rationale: 직접 호칭이므로 현대 합쇼체에서 자연스러운 ‘주님’이 적절하며, 경외의 대화체를 유지합니다.
- source_word: matrix matris meae mihi sepulchrum
  english_pob_choice: my mother's womb ... my grave
  chosen_korean: 제 어머니의 태가 제 무덤이 되지 않았습니까
  alternatives_korean:
  - 제 어머니의 태가 제 묘가 되지 않았습니까
  - 어머니의 태가 제 무덤이 되지 않았습니까
  lexicon: matrix
  rationale: matrix는 ‘태/자궁’의 의미로, 본문이 죽음의 소망을 강하게 표현하므로 직설적인 ‘무덤’과 결합해 원문의 충격을 보존했습니다.
- source_word: laborem Iacob
  english_pob_choice: Jacob's trouble
  chosen_korean: 야곱의 고난
  alternatives_korean:
  - 야곱의 환난
  - 야곱의 고통
  lexicon: laborem
  rationale: labor는 단순한 감정적 슬픔보다 무거운 고난/수고를 뜻하므로, POB의 ‘trouble’을 한국어 성경 문체에 맞게 ‘고난’으로 옮겼습니다.
theological_decisions:
- issue: 지극히 높으신 분의 길과 심판을 인간이 완전히 파악하려는 한계
  chosen_reading: ‘그분의 길을 붙잡고 그분의 심판의 일부를 살피려’는 시도는 진리 탐구의 열망이지만, 결국 ‘너는 할 수 없습니다’라는 신적 경계로 제한됩니다.
  alternative_readings:
  - 단순한 지적 탐구의 좌절
  - 인간 이성에 대한 전면적 거부
  rationale: 본문은 인간의 이해 욕구를 부정하기보다, 하나님의 길과 판단이 부분적으로만 접근 가능함을 강조합니다.
  doctrine_reference: 신명기 29:29; 욥기 38–42장; 로마서 11:33-36
