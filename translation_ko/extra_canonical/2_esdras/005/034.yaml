  text: 'illum super eum qui fecit illum? Et dixi: non, domine, sed dolens locutus sum, torquent enim me renes mei per omnem horam querentem adprehendere semitam altissimi et inuestigare partem iudicii eius. Et dixit ad me: non potes. et dixi: quare, domine? aut quid nascebar? aut quare non fiebat matrix matris meae mihi sepulchrum, ut non uiderem laborem Iacob'
