source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: nem facient. Et mare Sodomiticum pisces reiciet, et dabit uocem noctu, quam non nouerunt multi, omnes autem audient
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/007.yaml
  text: And the Sea of Sodom will cast out fish[a], and by night it will utter a sound that many have not known[b], but all will hear it.
  footnotes:
  - marker: a
    text: The phrase 'the Sodomitic sea' likely refers to the Dead Sea, but the translation keeps the Latin's allusive wording rather than substituting the later conventional name.
    reason: cultural_note
    anchor_ref: '5:7'
  - marker: b
    text: Or 'And the Sodomitic sea will cast out fish, and by night it will give a voice that many have not known, but all will hear its voice.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 소돔의 바다는 물고기들을 내쫓고, 밤에는 많은 이들이 알지 못하는 소리를 내겠지만, 모두가 그것을 들을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소돔의 바다’는 통상 ‘사해’를 가리키는 우회 표현일 가능성이 있으나, 여기서는 라틴어의 암시적 표현을 그대로 살렸습니다.
    reason: cultural_note
  - marker: b
    text: 또는 “소돔의 바다는 밤에 많은 이들이 알지 못하는 소리를 내겠지만, 모두가 그 소리를 들을 것입니다.”
    reason: previous_rendering
lexical_decisions:
- source_word: mare Sodomiticum
  english_pob_choice: the Sea of Sodom
  chosen_korean: 소돔의 바다
  alternatives_korean:
  - 소돔 바다
  - 사해
  - 소돔 호수
  lexicon: 지명/비유적 지시
  rationale: 라틴어의 형용사적 지시를 직역하되, 후대의 통용명인 ‘사해’로 바꾸지 않고 소돔과의 암시를 살렸습니다.
- source_word: reiciet
  english_pob_choice: will cast out
  chosen_korean: 내쫓고
  alternatives_korean:
  - 내던지고
  - 밖으로 내보내고
  - 토해 내고
  lexicon: 동사 의미역
  rationale: 물고기를 밖으로 밀어내는 동작을 자연스럽게 살리면서도, 원문의 강한 배출 이미지를 유지했습니다.
- source_word: dabit uocem noctu
  english_pob_choice: will utter a sound by night
  chosen_korean: 밤에는 … 소리를 내겠지만
  alternatives_korean:
  - 밤에 소리를 내겠지만
  - 밤에 음성을 내겠지만
  - 밤에 목소리를 내겠지만
  lexicon: vocem=voice/sound
  rationale: vocem은 여기서 인격적 ‘목소리’보다 비인격적 ‘소리’가 더 자연스럽고, POB의 ‘utter a sound’에 맞춥니다.
- source_word: quam non nouerunt multi
  english_pob_choice: that many have not known
  chosen_korean: 많은 이들이 알지 못하는
  alternatives_korean:
  - 많은 이들이 알지 못했던
  - 많은 사람이 알지 못하는
  - 많은 이들이 익히 알지 못하는
  lexicon: 완료 시제 nouerunt
  rationale: 라틴어 완료형의 경험적 뉘앙스를 살려 ‘알지 못하는’보다 약간 더 회고적인 뜻이 드러나도록 했습니다.
theological_decisions:
- issue: 소돔 바다의 지시 대상
  chosen_reading: 직접적인 역사 지명이라기보다, 소돔을 암시하는 우회적 명칭으로 보존합니다.
  alternative_readings:
  - ‘사해’로 명시적으로 풀이
  - 설명 없이 일반 바다로 완화
  rationale: 영문 POB가 후대의 통용 지명으로 치환하지 않고 allusive wording을 보존하므로, 한국어도 동일하게 암시를 유지했습니다.
  doctrine_reference: 본문의 지리적/상징적 암시를 훼손하지 않는 번역 원칙
