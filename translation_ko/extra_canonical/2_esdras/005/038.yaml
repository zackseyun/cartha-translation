id: 2ES.5.38
reference: 2 Esdras 5:38
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'uidere. Et dixi: dominator domine, quis enim est qui potest haec scire, nisi qui cum hominibus habitationem non habet?'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/038.yaml
  text: And I said, 'Lord, Master, who indeed can know these things, except one who does not dwell among men?'
translation:
  language: ko
  text: 그리고 제가 말했습니다. 「주님, 주인이시여, 이 일들을 알 수 있는 사람이 과연 누구이겠습니까? 사람들 가운데서 거하지 않는 이 외에는 아무도 알 수 없습니다」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominator domine
  english_pob_choice: Lord, Master
  chosen_korean: 주님, 주인이시여
  alternatives_korean:
  - 주님, 주님이시여
  - 주인이시여, 주님
  lexicon: dominator = 주인/주님
  rationale: Latin의 두 호칭을 각각 살려, 첫 호칭은 경배적 ‘주님’으로, 둘째 호칭은 권위와 소유의 뉘앙스를 지닌 ‘주인이시여’로 옮겨 중첩된 호칭 구조를 보존했습니다.
- source_word: quis enim est qui potest haec scire
  english_pob_choice: who indeed can know these things
  chosen_korean: 이 일들을 알 수 있는 사람이 과연 누구이겠습니까
  alternatives_korean:
  - 누가 참으로 이 일들을 알 수 있겠습니까
  - 이것들을 알 수 있는 자가 과연 누구이겠습니까
  lexicon: quis...potest scire = who can know
  rationale: 반문 형식을 자연스럽게 살리면서도, 원문의 ‘과연/누구’ 대비를 유지해 지식의 한계를 강조했습니다.
- source_word: nisi qui cum hominibus habitationem non habet
  english_pob_choice: except one who does not dwell among men
  chosen_korean: 사람들 가운데서 거하지 않는 이 외에는
  alternatives_korean:
  - 사람들 가운데 살지 않는 이 외에는
  - 인간들 가운데 거처를 두지 않는 이 외에는
  lexicon: habitationem non habet = does not dwell
  rationale: 영문 POB의 ‘dwell among men’에 맞추어 단순한 ‘살다’보다 거처와 동거의 뉘앙스를 지닌 ‘거하다’를 택해, 인간 사회와 분리된 존재만이 이 비밀을 안다는 뜻을 보존했습니다.
theological_decisions:
- issue: ‘dominator domine’의 이중 호칭 처리
  chosen_reading: ‘주님, 주인이시여’로 두 호칭을 모두 드러냈습니다.
  alternative_readings:
  - ‘주님, 주님이시여’로 평행화
  - ‘주인이시여, 주님’으로 순서 변경
  rationale: 원문의 중첩 호칭을 단순화하면 화자의 경외와 종속 고백이 약해질 수 있어, 한국어에서도 서로 다른 결의 호칭을 병렬로 살렸습니다.
  doctrine_reference: 경외와 주권 고백의 언어
