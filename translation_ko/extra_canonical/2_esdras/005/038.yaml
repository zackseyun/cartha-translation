revisions:
- from: 그리고 제가 말했습니다. 「주님, 주인이시여, 이 일들을 알 수 있는 사람이 과연 누구이겠습니까? 사람들 가운데서 거하지 않는 이 외에는 아무도 알 수 없습니다」
  to: 그리고 저는 말했습니다. “주님, 주권자시여, 사람들과 함께 거처하지 않는 이가 아니고서야, 과연 누가 이것들을 알 수 있겠습니까?”
  rationale: 원문의 단일 수사의문문을 보존하고, nisi 이하를 한국어의 자연스러운 예외 조건 표현으로 옮겼습니다. 이중 호칭은 유지하되 dominator의 통치적 의미가 드러나도록 조정했습니다.
  reviewer_model: gpt-5.6-terra
