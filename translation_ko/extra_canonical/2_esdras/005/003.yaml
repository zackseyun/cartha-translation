id: 2ES.5.3
reference: 2 Esdras 5:3
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et erit inconposita vestigio quam nunc vides regnare regionem, et videbunt eam desertam.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/003.yaml
  text: And the region that you now see ruling will be a trackless waste, and they will see it desolate.
translation:
  language: ko
  text: 그리고 지금 다스리고 있는 것을 당신이 보는 그 지역은 발자취조차 없는 황무지가 될 것이며, 그들은 그 지역이 황폐해진 것을 보게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: regionem
  english_pob_choice: the region
  chosen_korean: 그 지역
  alternatives_korean:
  - 그 땅
  - 그 나라
  - 그 지방
  lexicon: regionem → 지역
  rationale: latin regionem을 영어 POB의 ‘region’에 맞춰 ‘지역’으로 옮겨, 단순한 지리적 ‘땅’보다 통치 아래 있던 구역이라는 넓은 의미를 살렸습니다.
- source_word: vestigio
  english_pob_choice: trackless waste
  chosen_korean: 발자취 없는 황무지
  alternatives_korean:
  - 발자취 없는 폐허
  - 흔적 없는 황무지
  - 길 없는 황무지
  lexicon: vestigium/vestigio → 발자취
  rationale: vestigio를 ‘발자취’로 받아, POB의 ‘trackless’가 암시하는 길/흔적의 부재를 한국어에서 자연스럽게 드러냈습니다.
- source_word: inconposita
  english_pob_choice: trackless waste
  chosen_korean: 황무지
  alternatives_korean:
  - 무질서한 폐허
  - 정돈되지 않은 땅
  - 황폐한 곳
  lexicon: inconposita → 정돈되지 않음/무질서
  rationale: inconposita의 ‘정돈되지 않음, 뒤섞임’이라는 상태를 직역하기보다, 결과 상태인 ‘황무지’로 옮겨 전체 문맥의 폐허 이미지를 살렸습니다.
- source_word: desertam
  english_pob_choice: desolate
  chosen_korean: 황폐한
  alternatives_korean:
  - 버려진
  - 황량한
  - 폐허가 된
  lexicon: deserta/desolare → 황폐하다
  rationale: desertam을 ‘황폐한’으로 옮겨, 단순히 사람이 없는 상태보다 버려지고 황폐해진 상태라는 의미를 유지했습니다.
theological_decisions:
- issue: 예언적 미래 시제와 관찰 동사
  chosen_reading: ‘될 것이며 … 보게 될 것입니다’로 미래의 파괴와 그 목격을 분명히 나눠 표현했습니다.
  alternative_readings:
  - ‘될 것이고 … 볼 것입니다’
  - ‘되어 … 보게 됩니다’
  rationale: 원문의 erit와 videbunt eam의 미래성을 한국어에서 분명히 드러내되, 예언 문맥에 맞는 자연스러운 합쇼체로 정리했습니다.
  doctrine_reference: 예언/심판 선언의 서술 시제 일치
