id: 2ES.5.20
reference: 2 Esdras 5:20
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ego ieiunavi diebus septem ululans et plorans, sicut mihi mandavit Urihel angelus.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/020.yaml
  text: And I fasted for seven days[a], wailing and weeping, as Uriel the angel had commanded me.
  footnotes:
  - marker: a
    text: Or 'And it happened after seven days that the thoughts of my heart were again very grievous to me.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는 칠 일 동안 단식하며, 울부짖고 눈물을 흘렸습니다. 그것은 천사 우리엘이 제게 명령한 대로였습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ieiunavi diebus septem
  english_pob_choice: And I fasted for seven days
  chosen_korean: 칠 일 동안 단식하며
  alternatives_korean:
  - 일곱 날 동안 금식하며
  - 칠 일 동안 금식하며
  lexicon: ieiunavi → 단식하다
  rationale: 라틴어 ieiunavi는 음식 섭취를 끊는 행위를 가리키므로, 현대 한국어에서는 ‘단식하다’가 가장 자연스럽고 직접적입니다. ‘동안’으로 기간을 분명히 살렸습니다.
- source_word: ululans et plorans
  english_pob_choice: wailing and weeping
  chosen_korean: 울부짖고 눈물을 흘렸습니다
  alternatives_korean:
  - 통곡하며 울었습니다
  - 울며 통곡했습니다
  lexicon: ululans → 울부짖다; plorans → 눈물을 흘리다
  rationale: ululans의 강한 통곡성 음성을 ‘울부짖다’로, plorans의 눈물 흘림을 ‘눈물을 흘리다’로 나누어, 반복적 애통의 강도를 보존했습니다.
- source_word: Urihel angelus
  english_pob_choice: Uriel the angel
  chosen_korean: 천사 우리엘
  alternatives_korean:
  - 우리엘 천사
  - 천사 우리헬
  lexicon: Urihel → 우리엘
  rationale: 고유명사는 현대 외래어 표기와 한국어 성서 관행에 맞춰 ‘우리엘’로 옮기고, ‘천사’를 뒤에 배치해 원문의 호칭 구조를 자연스럽게 반영했습니다.
theological_decisions:
- issue: 명령의 근거를 드러내는 종결 구조
  chosen_reading: “그것은 … 명령한 대로였습니다”로 인과·기준 관계를 분명히 했습니다.
  alternative_readings:
  - “내게 명령한 대로였습니다”
  - “명령하신 대로였습니다”
  rationale: 라틴어 sicut mihi mandavit는 ‘~가 내게 명령한 대로’라는 준거를 나타내므로, 결과만이 아니라 순종의 기준을 살리는 문장으로 옮겼습니다.
  doctrine_reference: 본문의 서사적 순종 표현을 보존하는 번역 원칙
