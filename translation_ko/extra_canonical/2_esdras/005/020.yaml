  to: 그리고 저는 천사 우리엘이 제게 명령한 대로 칠 일 동안 금식하며 울부짖고 눈물을 흘렸습니다.[a]
  rationale: 'The revision preserves the Latin syntax and sense: “I fasted for seven days, wailing and weeping, as Uriel the angel commanded me.” It replaces the indirect demonstrative second sentence with a direct modifier of the first-person action, uses standard biblical Korean terminology, and retains the supplied audit-trail note with an anchor.'
