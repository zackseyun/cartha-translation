    reason: 영어 POB 감사 이력에 보존된 이전 번역을 반영한 주입니다. 이는 현 라틴어 본문의 번역이 아니라 이전의 절 정렬 오류로 인해 이 절에 놓였던 문구임을 나타냅니다.
