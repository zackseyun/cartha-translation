source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'meum aut finem caritatis quam populo meo promisi. Et dixi: sed ecce, domine, tu praees his qui in fine sunt, et quid facient qui ante nos sunt aut nos aut hi qui post nos ? Et dixit ad'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/041.yaml
  text: And I said[a], 'But behold, Lord, you preside over those who are at the end. And what will those do who were before us, or we ourselves, or those who will be after us?'
  footnotes:
  - marker: a
    text: Or 'lord, you preside over those who are at the end. But what'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 말했습니다. 「보십시오, 주님, 당신은 끝자락에 있는 이들을 다스리고 계십니다. 그렇다면 우리보다 먼저 있었던 자들은, 우리 자신은, 또 우리 뒤에 올 자들은 어떻게 하겠습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 라틴어의 sed ecce는 전환 표지이므로, 문맥상 '하지만/그런데 보십시오'로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: sed ecce
  english_pob_choice: But behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 하지만 보십시오
  - 그런데 보십시오
  lexicon: 표현/담화
  rationale: 라틴어의 전환 표지와 주의를 끄는 감탄을 한국어에서 자연스럽게 살려, 직역형 '하지만 보십시오'보다 담화 기능이 분명한 '보십시오'를 택했습니다.
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주
  lexicon: 주님
  rationale: 직접 호칭이므로 합쇼체 맥락에 맞는 정중한 '주님'을 사용했고, 라틴어 vocative의 격식을 반영했습니다.
- source_word: tu praees his qui in fine sunt
  english_pob_choice: you preside over those who are at the end
  chosen_korean: 당신은 끝자락에 있는 이들을 다스리고 계십니다
  alternatives_korean:
  - 당신은 마지막에 있는 이들 위에 계십니다
  - 당신은 끝에 있는 이들을 주재하십니다
  lexicon: praees
  rationale: praees는 단순한 위치가 아니라 '앞서 이끌고 통솔하다'는 뜻이어서, 한국어에서는 '다스리고 계십니다'로 권위와 현재 진행성을 함께 살렸습니다.
- source_word: quid facient... aut nos aut hi qui post nos
  english_pob_choice: what will those do ... or we ourselves, or those who will be after us?
  chosen_korean: 그렇다면 우리보다 먼저 있었던 자들은, 우리 자신은, 또 우리 뒤에 올 자들은 어떻게 하겠습니까?
  alternatives_korean:
  - 그러면 우리 이전 사람들과 우리와 우리 이후 사람들은 어떻게 되겠습니까?
  - 우리보다 앞선 이들과 우리와 뒤따를 이들은 무엇을 하겠습니까?
  lexicon: quid facient
  rationale: 질문의 핵심은 미래 행위/처지에 대한 물음이므로 '어떻게 하겠습니까?'로 옮겨, 영어 POB의 질문 구조와 라틴어의 quid facient을 자연스럽게 반영했습니다.
theological_decisions:
- issue: 하나님/주님 직접 호칭의 존칭 수준
  chosen_reading: 문장 전체는 서술은 합쇼체로 유지하되, 직접 호칭은 '주님'으로 번역했습니다.
  alternative_readings:
  - 주여
  - 주
  rationale: 라틴어 호격 domine의 예의 바른 청원을 한국어 예배체로 과장하지 않으면서도, 본문의 간청적 분위기를 보존하기 위한 선택입니다.
  doctrine_reference: 공경어/화행 일치
