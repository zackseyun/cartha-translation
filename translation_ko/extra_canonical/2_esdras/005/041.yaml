  source_fidelity: 라틴어의 sed ecce(‘그러나/그런데 보십시오’)가 본문에서 빠져 있고, 뒤의 et quid(‘그리고/또 무엇을’)가 ‘그렇다면’으로 인과적으로 강화되어 있습니다. 또한 qui in fine sunt는 ‘끝자락’보다 ‘끝에 있는 이들’이 더 직접적이며 해석을 덜 보탭니다.
  naturalness: 합쇼체 직접 발화로 자연스럽게 다듬을 수 있습니다. ‘주님께서는’과 ‘다스리십니다’는 존대와 문체를 안정적으로 유지합니다.
  terminology: domine는 ‘주님’으로 적절합니다. praees는 여기서 통솔·관할의 뜻이므로 ‘다스리십니다’가 가능하지만, ‘끝자락’은 원문의 시간적·상황적 ‘끝’에 불필요한 공간적 뉘앙스를 더합니다.
