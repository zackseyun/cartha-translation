  to: 그리고 내가 말했습니다. 「그러나 보십시오[a], 주님, 주님께서는 끝에 있는 이들을 다스리십니다. 우리보다 앞선 이들은, 우리 자신은, 또 우리 뒤에 있을 이들은 무엇을 하겠습니까?」
