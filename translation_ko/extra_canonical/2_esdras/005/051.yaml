  yaml_path: translation/extra_canonical/2_esdras/005/051.yaml
  text: And he said[a], 'Ask a woman who bears, and she will tell you. For you will say to her, "Why
  footnotes:
  - marker: a
    text: Or "And he answered me and said, 'Ask the woman who bears, and she will tell you.".
    reason: previous_rendering
translation:
  language: ko
  text: 그가 말했습니다. 「해산하는 여인에게 물어보십시오. 그러면 그가 당신에게 말할 것입니다. 왜냐하면 당신은 그에게 ‘왜’라고 말할 것이기 때문입니다」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 dixit는 단순히 ‘말했습니다’이며, 영어 POB의 ‘answered me’는 뒤의 문맥을 보충한 이전 번역 전통입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: dixit
  english_pob_choice: And he said
  chosen_korean: 그가 말했습니다
  alternatives_korean:
  - 그리고 그가 말했습니다
  - 그가 대답하며 말했습니다
  lexicon: dico
  rationale: 라틴어에는 단순히 dixit만 있으므로, 영어 POB의 ‘answered me’는 따르지 않고 단순 발화로 옮겼습니다.
- source_word: interroga
  english_pob_choice: Ask
  chosen_korean: 물어보십시오
  alternatives_korean:
  - 질문하십시오
  - 물으십시오
  lexicon: interrogo
  rationale: 직접 명령형의 의미를 살리되 현대 한국어에서 자연스러운 공손 명령으로 옮겼습니다.
- source_word: quae parit
  english_pob_choice: a woman who bears
  chosen_korean: 해산하는 여인
  alternatives_korean:
  - 출산하는 여인
  - 아이를 낳는 여인
  - 아이를 배는 여인
  lexicon: pario
  rationale: quae parit는 일반적·현재적 성격의 ‘출산하는/해산하는’ 여인을 뜻하므로, 특정한 여자가 아니라 일반 유형을 드러내는 표현으로 옮겼습니다.
- source_word: 'Dices enim ei : quare'
  english_pob_choice: For you will say to her, "Why
  chosen_korean: 왜냐하면 당신은 그에게 ‘왜’라고 말할 것이기 때문입니다
  alternatives_korean:
  - 그러면 당신은 그에게 ‘왜’라고 말할 것입니다
  - 당신이 그에게 ‘왜’라고 말할 것이기 때문입니다
  lexicon: dico; quare
  rationale: 서술이 다음 절로 이어지는 미완성 문장 형태를 유지해야 하므로, 라틴어의 불완전한 종결을 한국어에서도 미완결감이 드러나도록 옮겼습니다.
theological_decisions:
- issue: 장면의 화자와 직접 인용의 종결
  chosen_reading: 화자는 단순히 ‘그가 말했습니다’로 처리하고, 인용문은 본문이 끊기는 지점까지 그대로 둡니다.
  alternative_readings:
  - 그가 나에게 대답하며 말했습니다
  - 인용을 완결된 문장으로 매끈하게 정리함
  rationale: 라틴어 원문이 절 말미에서 끊기므로, 영어 POB의 확장된 표현을 따르지 않고 본문 단절을 보존했습니다.
  doctrine_reference: source fidelity / verse alignment
