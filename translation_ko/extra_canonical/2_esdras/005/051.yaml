  source_fidelity: 라틴어 dixit를 단순 발화로 옮긴 점과, 절 말미의 미완결된 quare를 다음 절로 넘기지 않은 점은 원문에 충실합니다. 그러나 여성 선행사에 남성 대명사 ‘그’를 쓴 것은 명백한 지시 대상 오류이며, 인용문의 종결 표시는 원문이 절 끝에서 끊기는 상태를 평탄화합니다.
  naturalness: ‘그가 당신에게’는 여성인 ‘해산하는 여인’을 가리키기에 부자연스럽고 오해를 낳습니다. 또한 ‘왜냐하면 … 때문입니다’는 중복된 인과 표지이지만, 여기서는 원문 자체가 이어지는 미완결 문장이므로 ‘왜냐하면 … 말할 것입니다. ‘왜…’처럼 절단을 드러내는 방식이 더 적절합니다.
  terminology: ‘해산하는 여자’는 quae parit의 일반적 의미를 자연스럽게 전달합니다. ‘여자’는 이 문맥에서 중립적이고 현대적인 표현이며, 동일 대상을 ‘그 여자’로 반복하여 대명사 성별 혼동을 피합니다.
