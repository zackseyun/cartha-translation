  terminology: ‘양 떼’, ‘목자’, ‘악한 늑대들’은 비유적 표현과 종교 문헌의 격조를 적절히 유지합니다. ‘드십시오’도 요청 대상에게 쓰는 공손한 명령으로 문맥에 적합합니다.
