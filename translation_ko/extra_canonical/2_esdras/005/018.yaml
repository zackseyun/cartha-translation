  source_fidelity: 라틴어의 명령(‘일어나서’, ‘드십시오’, ‘버리지 마십시오’)과 목자·양 떼·악한 늑대의 비유 구조를 충실히 보존했습니다. ‘빵을 좀’은 제공된 영어 감사본의 ‘some bread’와 일치하며, alicuius의 라틴어 형태가 다소 이례적인 점은 이 구절의 기존 영어 처리 범위 안에서 의미를 과도하게 특정하지 않은 안전한 번역입니다.
