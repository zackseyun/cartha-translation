id: 2ES.5.18
reference: 2 Esdras 5:18
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: exsurge ergo et gusta panem alicuius, etnon derelinquas nos sicut pastor gregem suum in manibus luporum malignorum.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/018.yaml
  text: Rise therefore and eat some bread[a], and do not abandon us like a shepherd his flock into the hands of evil wolves.
  footnotes:
  - marker: a
    text: Or "And I said to him, 'Go away from me, and do not come near me for seven days; then you may come to me.' And he heard what I said and withdrew from me.".
    reason: previous_rendering
translation:
  language: ko
  text: 그러므로 일어나서 빵을 좀 드십시오. 그리고 악한 늑대들의 손에 자기 양 떼를 넘기듯 우리를 버리지 마십시오.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: exsurge ergo
  english_pob_choice: Rise therefore
  chosen_korean: 그러므로 일어나서
  alternatives_korean:
  - 일어나십시오
  - 그러므로 일어나십시오
  lexicon: exsurge
  rationale: 명령형 exsurge를 자연스러운 현대 한국어로 옮기되, ergo의 인과를 앞에 둬서 ‘그러므로’의 흐름을 살렸습니다.
- source_word: gusta panem alicuius
  english_pob_choice: eat some bread
  chosen_korean: 빵을 좀 드십시오
  alternatives_korean:
  - 빵을 좀 먹으십시오
  - 빵을 조금 드십시오
  lexicon: gusta / panem
  rationale: gusta는 단순히 ‘먹다’이지만 문맥상 초대·권유의 어조가 있어 공손한 ‘드십시오’로 옮겼고, alicuius는 ‘some’의 분량감으로 처리했습니다.
- source_word: gregem suum
  english_pob_choice: his flock
  chosen_korean: 자기 양 떼
  alternatives_korean:
  - 그의 양 떼
  - 자신의 양 떼
  lexicon: grex
  rationale: 목자-양의 비유를 살리면서 소유격을 한국어스럽게 표현했습니다.
- source_word: in manibus luporum malignorum
  english_pob_choice: into the hands of evil wolves
  chosen_korean: 악한 늑대들의 손에
  alternatives_korean:
  - 악한 늑대들의 손으로
  - 악한 늑대들에게
  lexicon: in manibus / lupi maligni
  rationale: 라틴어의 ‘손에’라는 이미지가 ‘맡겨짐/넘겨짐’의 위험성을 드러내므로 직역을 유지했습니다.
theological_decisions:
- issue: 목자-양 비유의 보존
  chosen_reading: 화자가 자신과 공동체를 목자와 양 떼의 관계로 표현하는 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 비유를 풀어서 ‘우리를 보호하지 마십시오’처럼 의미만 옮김
  rationale: source text의 수사적 긴장과 위기감을 약화시키지 않기 위해 비유 구조를 보존했습니다.
  doctrine_reference: 성경적 목자 이미지의 문맥 보존
