  text: And it happened on the second night that Phaltiel, leader of the people, came to me and said, 'Where were you, and why is your face sad?
translation:
  language: ko
  text: 둘째 밤에, 민족의 지도자 팔티엘이 내게 와서 말했습니다. “당신은 어디에 있었습니까? 그리고 어찌하여 당신의 얼굴은 슬퍼 보입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '둘째 밤에: 라틴어 in nocte secunda를 직역한 시간표현입니다.'
    reason: source_note
lexical_decisions:
- source_word: Et factum est in nocte secunda
  english_pob_choice: And it happened on the second night
  chosen_korean: 둘째 밤에
  alternatives_korean:
  - 그리고 둘째 밤에
  - 둘째 밤에 그 일이 일어났습니다
  lexicon: Latin factum est / nocte secunda
  rationale: 서술 관용구는 한국어에서 자연스러운 시간 부사구로 압축해도 원문의 사건 진행은 유지됩니다.
- source_word: Phalthiel dux populi
  english_pob_choice: Phaltiel, leader of the people
  chosen_korean: 민족의 지도자 팔티엘
  alternatives_korean:
  - 백성의 지도자 팔티엘
  - 백성의 우두머리 팔티엘
  lexicon: Latin dux populi
  rationale: dux는 ‘지도자’가 가장 직접적이며, populi는 단순 집단이 아니라 공동체 전체를 가리켜 ‘민족’으로 옮겼습니다.
- source_word: uultus tuus tristis
  english_pob_choice: why is your face sad
  chosen_korean: 당신의 얼굴은 슬퍼 보입니까
  alternatives_korean:
  - 왜 당신의 얼굴은 슬픕니까
  - 어찌하여 당신의 얼굴빛이 슬픕니까
  lexicon: Latin vultus / tristis
  rationale: vultus는 단순한 ‘얼굴’보다 표정·얼굴빛까지 포함할 수 있으나, 문맥상 간결하게 ‘얼굴’로 두고 ‘슬퍼 보입니까’로 표정 상태를 살렸습니다.
