id: 2ES.5.12
reference: 2 Esdras 5:12
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: pertransiit iustitia, iustum faciens ? et haec negabit. Et erit in illo tempore, et sperabunt homines et non impetrabunt,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/012.yaml
  text: Has righteousness passed through[a], or one who does righteousness? And it will say no. And it will be at that time that men will hope and not obtain;
  footnotes:
  - marker: a
    text: Or 'And that one will say no. And at that time men will hope and not obtain; they will labor, and their ways will not be directed.'.
    reason: previous_rendering
translation:
  language: ko
  text: 의로움이 지나갔습니까, 아니면 의를 행하는 사람입니까? 그리고 그는 아니라고 말할 것입니다. 그때가 되면 사람들이 바라겠지만 얻지 못할 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 그는 아니라고 말할 것입니다. 그때가 되면 사람들이 바라겠지만 얻지 못할 것입니다. 그들은 수고하겠지만 그들의 길은 바로잡히지 않을 것입니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: pertransiit iustitia
  english_pob_choice: Has righteousness passed through
  chosen_korean: 의로움이 지나갔습니까
  alternatives_korean:
  - 의가 지나갔습니까
  - 의로움이 통과했습니까
  - 정의가 지나갔습니까
  lexicon: iustitia → 의로움/의
  rationale: 라틴어 iustitia를 단순히 추상적 ‘정의’보다 문맥상 추적되는 상태를 드러내는 ‘의로움’으로 옮겨, 질문 형식을 자연스럽게 살렸습니다.
- source_word: iustum faciens
  english_pob_choice: one who does righteousness
  chosen_korean: 의를 행하는 사람
  alternatives_korean:
  - 의를 행하는 자
  - 의를 행하는 이
  - 의롭게 만드는 사람
  lexicon: iustum faciens → 의를 행하는 사람
  rationale: 문구는 ‘사람을 의롭게 하는’ 뜻이 아니라 ‘의를 행하는 사람’이라는 행위 주체를 가리키므로, 한국어도 그 구조를 그대로 반영했습니다.
- source_word: Et erit in illo tempore
  english_pob_choice: And it will be at that time
  chosen_korean: 그리고 그때가 되면
  alternatives_korean:
  - 그리고 그때가 올 것입니다
  - 그때가 되면
  - 그리고 그 시기에
  lexicon: Et erit in illo tempore → 그때가 되면
  rationale: 예언적 시점 전환을 한국어에서 가장 간결하게 드러내는 표현으로 옮겼습니다.
- source_word: sperabunt homines et non impetrabunt
  english_pob_choice: men will hope and not obtain
  chosen_korean: 사람들이 바라겠지만 얻지 못할 것입니다
  alternatives_korean:
  - 사람들은 바라겠지만 얻지 못할 것입니다
  - 사람들이 희망하겠지만 얻지는 못할 것입니다
  - 사람들이 소망하겠지만 이루지 못할 것입니다
  lexicon: sperare / impetrare → 바라다 / 얻다
  rationale: sperabunt는 단순한 ‘희망하다’보다 대상의 실현을 기대하는 뜻이 강해 ‘바라다’로, impetrabunt는 ‘얻다’로 자연스럽게 대응시켰습니다.
theological_decisions:
- issue: 의(justitia)와 의를 행하는 사람의 병렬 질문
  chosen_reading: 서로 다른 두 항을 병렬로 유지해, ‘의로움 자체’와 ‘의를 행하는 사람’에 대한 질문으로 읽게 했습니다.
  alternative_readings:
  - ‘의롭게 되는 사람’으로 통합
  - ‘의가 사람을 통과했는가’로 재구성
  rationale: 라틴어는 iustitia와 iustum faciens을 병렬로 놓아 동일 개념을 반복하기보다 하나는 상태, 하나는 실천 주체를 묻습니다. 한국어도 그 긴장을 보존해야 합니다.
  doctrine_reference: 본문 문맥 보존 원칙
