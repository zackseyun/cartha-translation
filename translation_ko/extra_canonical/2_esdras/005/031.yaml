    reason: source_note
lexical_decisions:
- source_word: Et factum est
  english_pob_choice: And it happened
  chosen_korean: 그리고
  alternatives_korean:
  - 그 일이 있었습니다
  - 그리하여
  lexicon: et factum est
  rationale: 라틴어 관용구를 자연스럽게 옮기되, 다음 절과 이어지는 서술적 전환을 살려 합쇼체로 간결하게 처리했습니다.
- source_word: cum locutus essem sermones istos
  english_pob_choice: when I had spoken these words
  chosen_korean: 내가 이 말들을 하였을 때
  alternatives_korean:
  - 내가 이 말들을 말하였을 때
  - 내가 이 말씀들을 하였을 때
  lexicon: cum + locutus essem + sermones istos
  rationale: sermones istos는 특정한 앞선 발화를 가리키므로 ‘이 말들’로 옮기고, 완료적 시간관계를 ‘-하였을 때’로 반영했습니다.
- source_word: et missus
  english_pob_choice: and was sent
  chosen_korean: 보내어졌습니다
  alternatives_korean:
  - 파견되었습니다
  - 보냄을 받았습니다
  lexicon: missus
  rationale: 수동 분사로서 ‘보내다/파견하다’의 수동을 드러내며, 문맥상 주어가 생략된 미완결 절이므로 한국어도 동일하게 열린 종결로 유지했습니다.
theological_decisions:
- issue: Verse boundary leaves the clause incomplete in the source text
  chosen_reading: 끝을 완결하지 않고 ‘보내어졌습니다’로 끊어, 5:32로 이어지는 미완결 문장을 드러냈습니다.
  alternative_readings:
  - ‘보내심을 받았습니다’로 완결형처럼 매끈하게 처리
  - 다음 절의 내용을 끌어와 문장을 완성
  rationale: 라틴어 본문과 POB 영어가 모두 5:31을 미완결로 두므로, 인위적으로 매끈하게 만들지 않고 본문의 절 경계를 보존했습니다.
  doctrine_reference: 문맥 보존과 절 경계 존중
