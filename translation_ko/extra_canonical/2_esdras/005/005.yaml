id: 2ES.5.5
reference: 2 Esdras 5:5
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et de ligno sanguis stillabit, et lapis dabit vocem suam; et populi commovebuntur, et gressus commutabuntur.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/005.yaml
  text: And blood will drip from wood[a], and the stone will give its voice, and peoples will be shaken, and steps will be changed.
  footnotes:
  - marker: a
    text: Or 'the stone will give its voice'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나무에서 피가 흐를 것이며, 돌이 자기의 소리를 낼 것이며, 민족들은 흔들릴 것이며, 걸음은 바뀔 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자기의 소리’는 라틴어 dabit vocem suam의 직역적 표현으로, 한국어에서는 ‘소리를 내다’가 더 자연스럽습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: et de ligno sanguis stillabit
  english_pob_choice: And blood will drip from wood
  chosen_korean: 그리고 나무에서 피가 흐를 것이며
  alternatives_korean:
  - 그리고 나무에서 피가 뚝뚝 떨어질 것이며
  - 그리고 나무로부터 피가 흐를 것이며
  lexicon: lignum, sanguis, stillo
  rationale: Latin은 '나무에서'와 '피가 흐르다'의 이미지를 직접 제시하므로, 한국어도 원문의 물리적·예언적 이미지를 살려 자연스럽게 옮겼습니다.
- source_word: lapis dabit vocem suam
  english_pob_choice: the stone will give its voice
  chosen_korean: 돌이 자기의 소리를 낼 것이며
  alternatives_korean:
  - 돌이 자기의 목소리를 낼 것이며
  - 돌이 소리를 낼 것이며
  lexicon: lapis, vox, dare vocem
  rationale: dabit vocem suam은 직역 투이지만, 한국어에서는 '소리를 내다'가 가장 자연스럽고, '자기의'를 넣어 의인화된 자기 발화를 유지했습니다.
- source_word: populi commovebuntur
  english_pob_choice: peoples will be shaken
  chosen_korean: 민족들은 흔들릴 것이며
  alternatives_korean:
  - 백성들은 흔들릴 것이며
  - 민족들은 뒤흔들릴 것이며
  lexicon: populi, commoveor
  rationale: populi는 복수 집단을 가리키므로 단수의 '백성'보다 '민족들'이 더 가깝고, commovebuntur의 수동적 동요를 '흔들리다'로 간결하게 반영했습니다.
- source_word: gressus commutabuntur
  english_pob_choice: steps will be changed
  chosen_korean: 걸음은 바뀔 것입니다
  alternatives_korean:
  - 걸음이 바뀔 것입니다
  - 걸음걸이가 바뀔 것입니다
  lexicon: gressus, commuto
  rationale: gressus는 '걸음/발걸음'의 의미가 강하므로, POB의 'steps'를 따라 '걸음'으로 옮기되 변화의 결과를 담는 동사 '바뀌다'를 사용했습니다.
theological_decisions:
- issue: Apocalyptic personification of inanimate objects
  chosen_reading: 나무와 돌의 발화 이미지를 문자적 사건 묘사보다 종말론적 표징으로 유지했습니다.
  alternative_readings:
  - 상징적으로 완화해 '징조가 나타날 것이며'로 처리
  - 의인화를 약화해 평이하게 의역
  rationale: Latin 원문은 나무와 돌에 발화와 동요를 부여해 비정상적 종말 징조를 강조하므로, 이를 완화하지 않고 그대로 살리는 것이 문맥에 충실합니다.
  doctrine_reference: 2 Esdras의 묵시적 표상 보존
- issue: Plural 'populi' and universal disturbance
  chosen_reading: 민족들로 옮겨 집단적·보편적 동요를 드러냈습니다.
  alternative_readings:
  - 사람들이 흔들릴 것입니다
  - 백성들이 흔들릴 것입니다
  rationale: populi의 복수성과 묵시문맥의 광범위한 충격을 살리기 위해 단일 민족이나 일반적 '사람들'보다 '민족들'이 더 적합합니다.
  doctrine_reference: 묵시문학의 세계적 동요 표상
