revisions:
- from: 불의와 절제 없음이 땅 위에 더해질 것입니다. 그리고 한 지역이 자기 이웃 지역에게 묻고 이렇게 말할 것입니다. “의가 너를 지나갔느냐?”[a]
  to: 불의와 자기 절제의 부족이 땅 위에 더욱 많아질 것입니다. 그리고 한 지역이 이웃 지역에게 물으며 이렇게 말할 것입니다. “의가 그대를 지나갔습니까?”
  rationale: 문장 전체를 현대 표준 한국어 합쇼체로 다듬고, incontinentia의 의미를 자연스럽게 명시했습니다. ‘의가 그대를 지나갔습니까?’는 제공된 영어 POB의 간결한 표현을 따르며, 의를 의로운 사람이나 의롭게 하는 힘으로 풀어쓰지 않습니다. 불필요한 해석 각주는 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:39Z'
review_pass:
  verdict: revise
  source_fidelity: ‘incontinentia’를 ‘자기 절제의 부족’으로 옮겨 도덕적 자기 통제의 결여라는 뜻을 보존했습니다. 질문의 ‘의’와 ‘지나가다’는 제공된 영어 POB 감사 문구를 따라 유지하되, 원문의 간결하고 다소 난해한 표현을 해설로 확장하지 않았습니다.
  naturalness: ‘절제 없음’은 현대 한국어 문장 안에서 다소 명사 나열식으로 들립니다. 또한 인용문 ‘지나갔느냐?’는 요청된 현대 합쇼체와 맞지 않습니다. ‘자기 절제의 부족’ 및 ‘지나갔습니까?’로 고쳤습니다.
  terminology: iniustitia는 ‘불의’, incontinentia는 ‘자기 절제의 부족’, iustitia는 ‘의’로 일관되게 처리했습니다. 지역을 의인화한 직접 호칭은 한국어에서 ‘너’보다 문어적이면서 정중한 ‘그대’가 적절합니다.
  issues:
  - severity: medium
    issue: 인용문의 종결형이 합쇼체가 아님
    rationale: ‘지나갔느냐?’는 해라체 의문형입니다. 대상 번역의 지정된 현대 formal-polite register에 맞추어 ‘지나갔습니까?’로 해야 합니다.
  - severity: low
    issue: ‘절제 없음’이 부자연스러움
    rationale: 의미는 전달하지만 현대 한국어 산문에서는 ‘자기 절제의 부족’이 incontinentia의 뜻을 더 자연스럽고 정확하게 나타냅니다.
  - severity: low
    issue: 각주가 본문에 없는 문맥 해석을 제시함
    rationale: 본문의 난해함을 보존하는 데 별도 각주가 필요하지 않으며, 현 각주는 ‘통과’라는 해석 가능성을 덧붙입니다. 제공된 영어 POB의 비확장 원칙에 따라 삭제하는 편이 안전합니다.
  revised_text: 불의와 자기 절제의 부족이 땅 위에 더욱 많아질 것입니다. 그리고 한 지역이 이웃 지역에게 물으며 이렇게 말할 것입니다. “의가 그대를 지나갔습니까?”
