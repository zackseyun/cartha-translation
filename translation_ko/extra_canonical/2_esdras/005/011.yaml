source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'multiplicabitur iniustitia et incontinentia super terram. Et interrogabit regio proximam suam et dicet: numquid per te'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/011.yaml
  text: Injustice and lack of self-control will be multiplied upon the earth. And one region will ask its neighbor and say, 'Has righteousness passed through you?'
translation:
  language: ko
  text: 불의와 절제 없음이 땅 위에 더해질 것입니다. 그리고 한 지역이 자기 이웃 지역에게 묻고 이렇게 말할 것입니다. “의가 너를 지나갔느냐?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 이 질문은 ‘의가 너를 통과했느냐’라는 뜻으로 읽힐 수 있으나, 본문에는 그 이상의 해석이 없습니다.
    reason: source_note
lexical_decisions:
- source_word: multiplicabitur iniustitia
  english_pob_choice: Injustice will be multiplied
  chosen_korean: 불의가 더해질 것입니다
  alternatives_korean:
  - 불의가 증가할 것입니다
  - 불의가 배가될 것입니다
  lexicon: iniustitia → 불의
  rationale: 라틴어 iniustitia는 단순한 도덕적 ‘부정’이 아니라 의의 반대인 불의를 가리키므로, 한국어에서도 교회적 완곡어인 ‘불법’보다 직접적인 ‘불의’가 원문 의미를 잘 드러냅니다.
- source_word: incontinentia
  english_pob_choice: lack of self-control
  chosen_korean: 절제 없음
  alternatives_korean:
  - 자기통제의 결핍
  - 방종
  lexicon: incontinentia → 절제 없음
  rationale: incontinentia는 금욕적·도덕적 ‘자기 절제의 부재’를 뜻하므로, 현대 한국어에서 지나치게 해석적인 ‘방종’보다 원문의 상태를 직접 말하는 ‘절제 없음’이 더 가깝습니다.
- source_word: regio proximam suam
  english_pob_choice: one region will ask its neighbor
  chosen_korean: 한 지역이 자기 이웃 지역에게
  alternatives_korean:
  - 한 땅이 자기 이웃 땅에게
  - 한 지방이 자기 이웃 지방에게
  lexicon: regio / proximam suam → 지역 / 이웃 지역
  rationale: English POB의 ‘region’을 따라 라틴어 regio를 ‘지역’으로 옮기고, proximam suam의 상호성은 ‘이웃 지역’으로 살려 문맥의 질문 주체와 대상 관계를 분명히 했습니다.
- source_word: numquid per te
  english_pob_choice: Has righteousness passed through you?
  chosen_korean: 의가 너를 지나갔느냐?
  alternatives_korean:
  - 의가 네게서 지나갔느냐?
  - 의가 너를 통과했느냐?
  lexicon: numquid per te → 의가 너를 지나갔느냐
  rationale: 라틴어 질문은 문맥상 ‘너를 통해 의가 지나갔는가’라는 의미를 담지만, POB가 본문에 추가한 해석적 확장을 따르지 않고 최소한의 의미만 남기기 위해 직역에 가깝게 처리했습니다.
theological_decisions:
- issue: 첫 절의 도덕적 쇠퇴 진술과 뒤이은 질문의 관계
  chosen_reading: 본문은 먼저 땅 위에 불의와 절제 없음이 증대된다는 종말론적 진술을 한 뒤, 지역들 사이에서 의의 부재를 탐문하는 질문으로 이어진다고 보았습니다.
  alternative_readings:
  - 질문을 의가 실제로 ‘사람을 의롭게 하는 힘’인지 묻는 것으로 확장하는 읽기
  - ‘의’ 대신 ‘의로운 자’로 풀어 설명하는 읽기
  rationale: 라틴어 원문과 최신 POB 수정은 해석적 덧붙임을 제거하고 질문 자체를 간결하게 유지하므로, 본문도 그 긴장을 보존해야 합니다.
  doctrine_reference: 2 Esdras 5:11; source revision note (2026-04-23)
