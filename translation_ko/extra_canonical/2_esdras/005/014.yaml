  text: Then I awoke, and my body shuddered greatly, and my soul
translation:
  language: ko
  text: 그때 나는 깨어났습니다. 내 몸은 몹시 떨렸고, 내 영혼도 그러했습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: euigilaui
  english_pob_choice: Then I awoke
  chosen_korean: 그때 나는 깨어났습니다
  alternatives_korean:
  - 그때 내가 깨어났습니다
  - 그러고 나서 나는 잠에서 깼습니다
  lexicon: awake
  rationale: 라틴어 euigilaui는 단순한 ‘깨어나다’의 완료 시점을 가리키므로, 한국어도 자연스럽고 간결하게 ‘깨어났습니다’로 옮겼습니다.
- source_word: corpus meum horruit ualde
  english_pob_choice: my body shuddered greatly
  chosen_korean: 내 몸은 몹시 떨렸고
  alternatives_korean:
  - 내 몸이 크게 떨렸고
  - 내 몸은 심하게 떨렸고
  lexicon: body / shudder greatly
  rationale: horruit ualde는 단순한 떨림을 넘어 강한 전율·오한의 반응을 나타내므로, ‘몹시 떨렸고’로 강도를 살렸습니다.
- source_word: anima mea
  english_pob_choice: and my soul
  chosen_korean: 내 영혼도 그러했습니다
  alternatives_korean:
  - 그리고 내 영혼도 떨렸습니다
  - 내 혼도 크게 떨렸습니다
  lexicon: soul
  rationale: anima mea는 여기서 육체적 반응과 나란히 제시되는 내면 전체를 가리키므로, 문맥을 따라 ‘내 영혼도 그러했습니다’로 대응해 앞 절의 반응을 이어 주었습니다.
theological_decisions:
- issue: anima mea의 범위
  chosen_reading: ‘영혼’으로 옮기되, 육체의 떨림과 병렬되는 내적 존재의 반응으로 읽었습니다.
  alternative_readings:
  - ‘마음’으로 완화하여 옮기는 읽기
  - ‘숨/생명’으로 더 물질적으로 읽는 해석
  rationale: 문맥상 화자의 전인적 충격을 표현하는 병렬 구조이므로, 전통적이면서도 본문에 충실한 ‘영혼’을 유지했습니다.
  doctrine_reference: 인간 이해에서 영혼/내면의 반응을 전면에 드러내는 서술
- issue: 감탄이나 설명을 덧붙이지 않음
  chosen_reading: 원문의 간결한 서술을 유지했습니다.
  alternative_readings:
  - ‘그리고 두려움이 몰려왔습니다’ 같은 해석적 보충
  - ‘내 몸과 영혼이 떨렸습니다’로 통합
  rationale: 라틴어는 사실 진술만 제시하므로, 설명적 보충 없이 대응시키는 것이 소스에 가장 충실합니다.
  doctrine_reference: 원문 서술의 절제 유지
