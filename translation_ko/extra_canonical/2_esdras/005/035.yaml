  yaml_path: translation/extra_canonical/2_esdras/005/035.yaml
  text: And he said to me[a], 'You cannot.' And I said, 'Why, Lord? Or why was I born? Or why did my mother's womb not become my grave, so that I might not see the trouble of Jacob and the weariness of the stock of Israel?'
  footnotes:
  - marker: a
    text: Or "and the weariness of the stock of Israel?'".
    reason: previous_rendering
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. “너는 할 수 없다.” 제가 말했습니다. “왜입니까, 주님? 아니, 제가 왜 태어났습니까? 어찌하여 제 어머니의 태가 제 무덤이 되지 않아, 제가 야곱의 고난과 이스라엘 민족의 쇠진을 보지 않아도 되었을 텐데요?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: non potes
  english_pob_choice: You cannot.
  chosen_korean: 너는 할 수 없다
  alternatives_korean:
  - 당신은 할 수 없습니다
  - 그럴 수 없다
  lexicon: Latin potes / English cannot
  rationale: 짧고 단호한 부정 응답을 살리면서도, 앞뒤의 탄식체와 맞게 직설적으로 옮겼습니다.
- source_word: domine
  english_pob_choice: Lord
  chosen_korean: 주님
  alternatives_korean:
  - 주여
  - 주인님
  lexicon: Latin domine
  rationale: 기도문 맥락의 직접 호칭이므로 한국어 교회용어인 ‘주님’을 사용하되, 고어체 ‘주여’는 피했습니다.
- source_word: matrix matris meae
  english_pob_choice: my mother's womb
  chosen_korean: 제 어머니의 태
  alternatives_korean:
  - 제 어머니의 배
  - 제 어머니의 태중
  lexicon: Latin matrix / matris meae
  rationale: 문자적 ‘womb’에 해당하는 ‘태’를 쓰되, 한국어 자연성을 위해 ‘어머니의 태’로 풀었습니다.
- source_word: laborem Iacob et defatigationem generis Israhel
  english_pob_choice: the trouble of Jacob and the weariness of the stock of Israel
  chosen_korean: 야곱의 고난과 이스라엘 자손의 피곤함
  alternatives_korean:
  - 야곱의 고생과 이스라엘 족속의 지침
  - 야곱의 환난과 이스라엘의 쇠약함
  lexicon: Latin labor / defatigationem; genus Israhel
  rationale: labor는 단순한 ‘수고’보다 고난·고생의 의미가 강하고, defatigationem은 지침·피곤함의 중첩을 살려 ‘피곤함’으로 옮겼습니다. genus는 혈통/계열을 뜻하므로 ‘자손’으로 자연화했습니다.
theological_decisions:
- issue: 탄식문의 누적 구조 보존
  chosen_reading: ‘왜입니까… 아니면… 아니면…’의 연쇄 질문을 그대로 살려 절망과 항의의 정서를 유지했습니다.
  alternative_readings:
  - 질문을 하나의 매끄러운 문장으로 통합
  - 의역하여 감정만 요약
  rationale: 원문은 이유를 묻는 연쇄적 탄식이므로, 문장 구조를 단순화하면 수사의 강도가 약해집니다.
  doctrine_reference: lament literature / rhetorical repetition
