id: 2ES.5.27
reference: 2 Esdras 5:27
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus multiplicatis populis adquisisti tibi populum unum, et ab omnibus probatam legem donasti huic quem desiderasti populo.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/027.yaml
  text: and from all the multiplied peoples you acquired for yourself one people[a], and to this people whom you desired you gave the law approved by all.
  footnotes:
  - marker: a
    text: Or 'And now, Lord, why have you handed over the one to the many, and prepared the one root above the others, yet scattered your only one among the many?'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 모든 불어난 민족들 가운데서 당신께서 한 백성을 당신의 것으로 얻으셨고, 당신이 원하신 이 백성에게 모든 이에게 인정받은 율법을 주셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그리고 이제, 주님, 어찌하여 하나를 많은 자에게 넘기시고, 하나의 뿌리를 다른 것들 위에 세우시고서도, 당신의 유일한 이를 많은 자들 가운데 흩으셨습니까?’
    reason: previous_rendering
lexical_decisions:
- source_word: ex omnibus multiplicatis populis
  english_pob_choice: from all the multiplied peoples
  chosen_korean: 모든 번성한 민족들 가운데서
  alternatives_korean:
  - 번성한 모든 민족들 가운데서
  - 수많이 늘어난 민족들 가운데서
  lexicon: multiplicatis populis
  rationale: multiplicatis는 단순한 ‘많은’보다 ‘번성하여 불어난’ 뉘앙스가 있어, ‘번성한 민족들’로 자연스럽게 옮겼습니다.
- source_word: adquisisti tibi populum unum
  english_pob_choice: you acquired for yourself one people
  chosen_korean: 한 백성을 당신의 것으로 얻으셨고
  alternatives_korean:
  - 한 백성을 당신께서 얻으셨고
  - 한 백성을 당신의 것으로 취하셨고
  lexicon: adquisisti tibi
  rationale: adquirere는 ‘얻다/획득하다’의 소유 취득을 드러내므로 ‘당신의 것으로 얻으셨고’로 옮겨 자기 소유로 삼으신 뜻을 살렸습니다.
- source_word: legem donasti huic
  english_pob_choice: you gave the law to this people
  chosen_korean: 당신이 원하신 이 백성에게는 … 율법을 주셨습니다
  alternatives_korean:
  - 이 백성에게 율법을 주셨습니다
  - 이 백성에게 법을 주셨습니다
  lexicon: legem donasti
  rationale: lexem은 토라/율법을 가리키는 일반적 용례이므로, POB 기본어인 ‘율법’을 유지했습니다.
- source_word: probatam lege(m) ... ab omnibus
  english_pob_choice: the law approved by all
  chosen_korean: 모든 이가 인정한 율법
  alternatives_korean:
  - 모두가 입증한 율법
  - 모든 이에게 인정받은 율법
  lexicon: probatam
  rationale: probatam은 ‘검증되어 승인된’ 의미가 강해, ‘인정한’으로 압축하되 보편적 승인이라는 문맥을 유지했습니다.
theological_decisions:
- issue: 하나님이 한 민족을 선택해 율법을 주시는 서술의 강조점
  chosen_reading: 민족들의 다수성 속에서 하나님께서 한 백성을 자기 것으로 취하시고, 그 백성에게 특별한 율법을 주신다는 선택-언약 구조를 살렸습니다.
  alternative_readings:
  - 단순히 ‘한 백성에게 율법을 주셨다’로 평평하게 읽는 방식
  - 선택의 주체성을 약화시키는 중립적 표현
  rationale: 이 구절은 분산된 여러 민족과 대비되는 하나의 선택된 백성을 강조하므로, 소유·선택의 관계를 분명히 드러내야 합니다.
  doctrine_reference: 선택과 언약, 율법 수여의 구별
- issue: ab omnibus probatam의 해석
  chosen_reading: ‘모든 이가 인정한’으로 옮겨 율법의 공적 정당성과 보편적 승인성을 드러냈습니다.
  alternative_readings:
  - ‘모든 이가 검증한’
  - ‘모두에게 좋은 것으로 입증된’
  rationale: probatam은 단순 호감이 아니라 검증/승인의 의미를 포함하므로, 율법의 객관적 정당성을 해치지 않는 방향으로 번역했습니다.
  doctrine_reference: 율법의 권위와 정당성
