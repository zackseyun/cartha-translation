    issue: multiplicatis populis를 ‘번성한 민족들’로 번역함
    rationale: multiplicatis는 ‘증가한, 불어난’이라는 수량적 의미가 중심입니다. ‘번성한’은 경제적·사회적 번영의 의미를 불필요하게 더할 수 있습니다.
  - severity: low
    issue: ab omnibus probatam의 수동 관계 표현
    rationale: ‘모든 이가 인정한’은 뜻이 통하지만, ‘모든 이에게 인정받은’이 ‘모든 이로부터 승인된’이라는 원문의 관계를 더 명료하게 반영합니다.
  revised_text: 그리고 모든 불어난 민족들 가운데서 당신께서 한 백성을 당신의 것으로 얻으셨고, 당신이 원하신 이 백성에게 모든 이에게 인정받은 율법을 주셨습니다.[a]
