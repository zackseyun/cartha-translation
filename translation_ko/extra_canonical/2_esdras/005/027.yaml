revisions:
- from: 그리고 모든 번성한 민족들 가운데서 당신께서 한 백성을 당신의 것으로 얻으셨고, 당신이 원하신 이 백성에게는 모든 이가 인정한 율법을 주셨습니다.[a]
  to: 그리고 모든 불어난 민족들 가운데서 당신께서 한 백성을 당신의 것으로 얻으셨고, 당신이 원하신 이 백성에게 모든 이에게 인정받은 율법을 주셨습니다.[a]
  rationale: 원문의 multiplicatis가 나타내는 ‘불어남’을 ‘불어난’으로 바로 옮기고, probatam ... ab omnibus의 수동 의미를 ‘모든 이에게 인정받은’으로 명료화했습니다. 각주에는 영어 POB 감사 기록에 보존된 이전 번역을 의미 변경 없이 유지했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:25:35Z'
review_pass:
  verdict: revise
  source_fidelity: ‘번성한’은 multiplicatis의 핵심인 ‘증가한/불어난’보다 번영·번성의 뜻을 더 강하게 내포합니다. 또한 ab omnibus probatam은 ‘모든 이가 인정한’도 가능하지만, 한국어에서는 ‘모든 이에게 인정받은’이 수동 관계를 더 직접적으로 나타냅니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하며, ‘모든 이에게 인정받은 율법’이 원문의 수동 분사구문을 자연스럽게 재현합니다.
  terminology: populus는 ‘백성’, lex는 이 문맥에서 관례적인 ‘율법’으로 유지했습니다. desiderasti는 해석을 덧붙이지 않고 ‘원하신’으로 옮겼습니다.
  issues:
