base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/021.yaml
  text: And it happened after seven days that the thoughts of my heart were again very grievous to me[a].
  footnotes:
  - marker: a
    text: Or 'And my soul took up again the spirit of understanding, and again I began to speak words before the Most High.'.
    reason: previous_rendering
translation:
  language: ko
  text: 칠 일이 지난 뒤, 내 마음속의 생각들이 다시 나를 몹시 괴롭혔습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: post dies septem
  english_pob_choice: after seven days
  chosen_korean: 칠 일이 지난 뒤에
  alternatives_korean:
  - 일곱 날 후에
  - 일주일 뒤에
  lexicon: dies
  rationale: 라틴어 직역 구조를 살리면서도 자연스러운 현대 한국어 시간 표현으로 옮겼습니다. '일주일'은 의미상 가능하지만 원문의 'dies septem'을 더 직접적으로 반영하는 '칠 일'을 택했습니다.
- source_word: cogitationes cordis mei
  english_pob_choice: the thoughts of my heart
  chosen_korean: 내 마음의 생각들
  alternatives_korean:
  - 내 마음의 생각
  - 내 심장의 생각들
  lexicon: cogitatio / cor
  rationale: 라틴어의 관용적 표현인 'heart'를 한국어의 '마음'으로 자연스럽게 옮겼습니다. 복수형은 문맥상 계속 밀려오는 내적 생각들을 드러내기 위해 '생각들'로 처리했습니다.
- source_word: molestae erant mihi valde
  english_pob_choice: were again very grievous to me
  chosen_korean: 다시 내게 매우 괴로웠습니다
  alternatives_korean:
  - 다시 나를 몹시 괴롭게 했습니다
  - 다시 내게 심히 번거로웠습니다
  lexicon: molestus
  rationale: molestae erant mihi는 단순한 감정 묘사보다 내면에 주어진 고통과 괴로움을 나타내므로 '괴로웠습니다'로 옮겼습니다. 'very'는 '매우'로 직접 반영했습니다.
theological_decisions:
- issue: 본문의 내적 고통 진술을 심리적 표현으로 유지할지, 신학적으로 완화할지
  chosen_reading: 화자가 다시 떠오르는 내면의 생각들 때문에 실제로 괴로움을 겪는다는 진술로 유지했습니다.
  alternative_readings:
  - 영적 시험의 시작으로 완화해 표현
  - 단순한 감상적 번민으로 축소해 표현
  rationale: 라틴어 원문은 화자의 내적 상태를 직접 서술하며, 이 절에서 신학적 해석을 덧씌워 약화시킬 근거는 없습니다. 따라서 감정의 강도를 그대로 살렸습니다.
  doctrine_reference: 내적 संघर्ष / lament language
