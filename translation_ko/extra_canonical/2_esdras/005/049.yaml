id: 2ES.5.49
reference: 2 Esdras 5:49
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'admodum enim infans non parit nec ea quae senuit adhuc, sic ego disposui a me creatum saeculum. Et interrogaui et dixi : cum iam dederis mihi uiam, loquar'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/049.yaml
  text: For just as an infant does not bear children[a], nor does one who has grown old bear any longer, so I ordered the age that I created.'
  footnotes:
  - marker: a
    text: Or 'nor one who has grown old any longer'.
    reason: previous_rendering
translation:
  language: ko
  text: 실로 갓난아이는 아이를 낳지 못하고, 늙은 사람도 더는 낳지 못하듯이, 나도 내가 지은 세상을 그렇게 정하였습니다.' 그리고 나는 묻고 말했습니다. '이제 저에게 길을 주시면, 제가 말하겠습니다.'[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 '더는 늙은 사람도…'
    reason: previous_rendering
lexical_decisions:
- source_word: admodum enim infans non parit
  english_pob_choice: For just as an infant does not bear children
  chosen_korean: 갓난아이는 아이를 낳지 못하고
  alternatives_korean:
  - 갓난아이는 출산하지 못하고
  - 어린아이는 아이를 낳지 못하고
  lexicon: infans
  rationale: infans는 단순히 '어린이'보다 출생 직후의 미성숙함을 가리켜, 한국어에서는 '갓난아이'가 가장 자연스럽고 직설적으로 대응합니다.
- source_word: nec ea quae senuit adhuc
  english_pob_choice: nor does one who has grown old bear any longer
  chosen_korean: 늙은 사람도 더는 낳지 못하듯이
  alternatives_korean:
  - 늙은 이도 더는 낳지 못하듯이
  - 나이가 든 사람도 더는 낳지 못하듯이
  lexicon: senuit / adhuc
  rationale: senuit는 '늙다/나이가 들다'의 완료 상태를 가리키며, adhuc는 문맥상 '아직/더는'의 의미를 살려 '더는'으로 옮겼습니다.
- source_word: sic ego disposui a me creatum saeculum
  english_pob_choice: so I ordered the age that I created
  chosen_korean: 나도 내가 지은 세상을 그렇게 정하였습니다
  alternatives_korean:
  - 내가 창조한 시대를 그렇게 정하였습니다
  - 내가 만든 세상을 그렇게 정하였습니다
  lexicon: disposui / saeculum
  rationale: disposui는 단순 제작이 아니라 질서를 세워 '정하다'는 뜻이 강하고, saeculum은 이 문맥에서 '시대'와 '세상'이 모두 가능하나 한국어에서는 독자가 자연스럽게 이해할 수 있는 '세상'을 택했습니다.
- source_word: cum iam dederis mihi uiam, loquar
  english_pob_choice: '''When you have given me the way, I will speak.'''
  chosen_korean: 이제 저에게 길을 주시면, 제가 말하겠습니다.
  alternatives_korean:
  - 이제 제게 길을 주시면, 말하겠습니다.
  - 이미 저에게 길을 주시면, 제가 말하겠습니다.
  lexicon: uiam / loquar
  rationale: uiam은 단순한 통로보다 발언할 기회·방향을 가리키는 비유로 읽혀 한국어에서 '길'을 유지했고, loquar는 미래적 조건 응답으로 '말하겠습니다'가 자연스럽습니다.
theological_decisions:
- issue: 세대/시대 표현인 saeculum의 번역
  chosen_reading: '''세상''으로 옮겨 창조된 질서 전체를 가리키는 폭을 유지했습니다.'
  alternative_readings:
  - '''시대''로 옮겨 시간적 의미를 강조할 수 있습니다.'
  - '''세대''로 옮겨 인간 공동체의 연속성을 강조할 수 있습니다.'
  rationale: 문맥상 '내가 지은' 대상은 단순한 연대가 아니라 하나님이 마련하신 창조 질서이므로, 한국어에서 가장 포괄적인 '세상'이 의미 범위를 잘 담습니다.
  doctrine_reference: 창조론/섭리
- issue: '''길''의 은유적 사용'
  chosen_reading: '''길''을 문자적 통로보다 발언권을 여는 조건적 은유로 유지했습니다.'
  alternative_readings:
  - '''방도''로 옮겨 기회·수단의 뉘앙스를 살릴 수 있습니다.'
  - '''기회''로 풀어 말할 수 있습니다.'
  rationale: 문맥에서 '길'은 단순 이동이 아니라 '말할 수 있는 상태'를 비유하므로, 직설적으로 풀기보다 원문의 은유를 살리는 편이 स्रोत에 더 가깝습니다.
  doctrine_reference: 문학적 은유 보존
