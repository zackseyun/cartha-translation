    rationale: 라틴어는 ‘늙은 여자’를 가리키는 여성형 표현을 사용합니다. 출산 비유의 병행도 한국어에서 명료해집니다.
  - severity: medium
    issue: 각주 a의 내용과 위치가 부정확함
    rationale: ‘또는 더는 늙은 사람도…’는 완결된 대안 번역이 아니며, 본문 끝의 ‘말하겠습니다’에 붙어 있어 해당 어구의 변이도 설명하지 못합니다. 영어 감사 기록의 이전 표현용 각주는 한국어 본문에 유지할 필요가 없습니다.
