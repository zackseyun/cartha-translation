  rationale: 라틴어 insipiens는 지혜 없음과 어리석음을 가리키므로, 문맥상 자연스럽고 자책의 뉘앙스를 살리는 ‘어리석습니다’로 옮겼습니다.
- source_word: quomodo potero dicere
