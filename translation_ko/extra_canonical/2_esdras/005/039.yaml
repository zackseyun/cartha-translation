    reason: source_note
lexical_decisions:
- source_word: insipiens
  english_pob_choice: I am foolish
  chosen_korean: 저는 어리석습니다
  alternatives_korean:
  - 저는 미련합니다
  - 저는 무지합니다
  lexicon: insipiens
  rationale: 라틴어 insipiens는 지혜 없음과 어리석음을 가리키므로, 문맥상 자연스럽고 자책의 뉘앙스를 살리는 ‘어리석습니다’로 옮겼습니다.
- source_word: quomodo potero dicere
  english_pob_choice: how then can I speak
  chosen_korean: 그러니 어떻게 … 말할 수 있겠습니까
  alternatives_korean:
  - 그러면 어떻게 … 말하겠습니까
  - 그렇다면 어떻게 … 말할 수 있겠습니까
  lexicon: quomodo + potero dicere
  rationale: 반문 형태를 살리되, 합쇼체에 맞는 자연스러운 한국어로 ‘말할 수 있겠습니까’로 표현했습니다.
- source_word: de his quibus
  english_pob_choice: about these things concerning which
  chosen_korean: 이런 일들에 대해
  alternatives_korean:
  - 이 일들에 관해
  - 이것들에 대해
  lexicon: de + relative construction
  rationale: 라틴어의 불완전한 관계절을 과도하게 보충하지 않고, 문맥상 남아 있는 범위만 반영하여 ‘이런 일들’로 간결하게 옮겼습니다.
theological_decisions:
- issue: Source text is incomplete and the English audit trail had a removed addition not present in Latin
  chosen_reading: 본문에 실제로 보존된 내용만 번역하고, 질문받은 대상이나 보충된 문구는 넣지 않았습니다.
  alternative_readings:
  - ‘당신들이 물은 것들에 대해’와 같이 보충하는 읽기
  - 문맥상 완결된 문장으로 재구성하는 읽기
  rationale: 감정과 수사 구조는 유지하되, 제공된 라틴어와 최신 수정판이 허용하는 범위를 넘지 않도록 절제했습니다.
  doctrine_reference: source-criticism / textual fidelity
