  lexicon: quomodo + potero dicere
  rationale: 반문 형태를 살리되, 합쇼체에 맞는 자연스러운 한국어로 ‘말할 수 있겠습니까’로 표현했습니다.
- source_word: de his quibus
  english_pob_choice: about these things concerning which
  chosen_korean: 이런 일들에 대해
  alternatives_korean:
  - 이 일들에 관해
  - 이것들에 대해
  lexicon: de + relative construction
  rationale: 라틴어의 불완전한 관계절을 과도하게 보충하지 않고, 문맥상 남아 있는 범위만 반영하여 ‘이런 일들’로 간결하게 옮겼습니다.
