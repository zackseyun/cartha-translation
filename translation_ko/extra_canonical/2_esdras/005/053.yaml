  text: 그리고 그녀 자신도 당신에게 이렇게 말할 것입니다[a]. 「젊은 시절의 왕성함 가운데 태어난 이들과, 자궁이 쇠약해지는 노년 무렵에 태어난 다른 이들은 다릅니다.」
  philosophy: optimal-equivalence
  footnotes:
