translation:
  language: ko
  text: 그리고 그녀 자신이 당신에게 이렇게 말할 것입니다[a]. 「젊은 시절의 힘 가운데 태어난 이들과, 노년의 때를 향해 태어난 이들은 다릅니다. 태가 약해지고 있을 때에 태어난 이들도 마찬가지입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는, 「그녀 자신이 당신에게 이렇게 말할 것입니다. ‘젊은 시절의 힘 가운데 태어난 이들과…’」.
    reason: previous_rendering
lexical_decisions:
- source_word: nati sunt
  english_pob_choice: those born
  chosen_korean: 태어난 이들
  alternatives_korean:
  - 난 자들
  - 출생한 이들
  lexicon: natus
  rationale: 출생 상태를 직접 드러내는 표현으로 옮겨, 단순한 일반적 ‘사람들’이 아니라 ‘태어난 이들’이라는 대비를 살렸습니다.
- source_word: sub tempus senectutis
  english_pob_choice: toward the time of old age
  chosen_korean: 노년의 때를 향해
  alternatives_korean:
  - 노년의 시기에
  - 노년의 때에
  lexicon: senectus
  rationale: sub는 단순한 시점보다 ‘다가가는/향하는’ 뉘앙스를 가지므로, POB의 수정 취지를 반영해 ‘향해’로 옮겼습니다.
- source_word: deficiente matrice
  english_pob_choice: when the womb is failing
  chosen_korean: 태가 약해지고 있을 때
  alternatives_korean:
  - 자궁이 쇠해지고 있을 때
  - 태가 힘을 잃고 있을 때
  lexicon: matrix
  rationale: matrix를 직역하면 다소 생소할 수 있으나, 본문의 생식·출산 문맥을 유지하기 위해 ‘태’로 옮기고, ‘deficiente’의 쇠약·결핍 의미를 ‘약해지고 있을 때’로 반영했습니다.
theological_decisions:
- issue: 생식 능력의 대비를 노골적이면서도 품위 있게 전달할지 여부
  chosen_reading: 본문의 생물학적 대비를 완화하지 않고 그대로 살리되, 현대 한국어에서 과도하게 도식적인 표현은 피했습니다.
  alternative_readings:
  - 완곡하게 ‘아이를 낳는 때’로 바꾸기
  - 전통적 경어체로 추상화하기
  rationale: 이 절은 출생 시점과 자궁의 쇠약을 병치하는 비유적 대비가 핵심이므로, 의미를 희석하지 않는 번역이 필요합니다.
  doctrine_reference: source-faithfulness
