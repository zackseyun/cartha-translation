  to: 그리고 그녀 자신도 당신에게 이렇게 말할 것입니다[a]. 「젊은 시절의 왕성함 가운데 태어난 이들과, 자궁이 쇠약해지는 노년 무렵에 태어난 다른 이들은 다릅니다.」
  rationale: 원문의 병렬 대조를 한 문장으로 복원했습니다. sub tempus senectutis는 노년에 이르는 가까운 시점을 나타내도록 ‘노년 무렵’으로, deficiente matrice는 ‘자궁이 쇠약해지는’으로 옮겼습니다. ipsa의 강조는 ‘그녀 자신도’로 반영했습니다.
