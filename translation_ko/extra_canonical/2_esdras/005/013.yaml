id: 2ES.5.13
reference: 2 Esdras 5:13
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: laborabunt et non dirigentur uiae eorum. Haec signa dicere tibi permissum est mihi, et si oraueris iterum et ploraueris sicut et nunc et ieiunaueris septem diebus, audies iterato horum maiora.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/013.yaml
  text: They will labor[a], but their ways will not be directed. I have been permitted to tell you these signs; and if you pray again and weep as you do now, and fast for seven days, you will hear again things greater than these.
  footnotes:
  - marker: a
    text: Or 'I have been permitted to tell you these signs; and if you pray again and weep as now, and fast for seven days, you will hear again things greater than these.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 수고할 것이나, 그들의 길은 바로잡히지 않을 것입니다. 나는 이 표징들을 당신에게 말하도록 허락받았습니다. 그리고 당신이 지금처럼 다시 기도하고 울며 일주일 동안 금식하면, 당신은 이보다 더 큰 것들을 다시 듣게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 표징들을 당신에게 말하도록 허락받았습니다’는 라틴어 Haec signa dicere tibi permissum est mihi의 연결을 따라, 이전 절로 넘어간 것으로 보이는 개행/절 구분 문제를 반영한 것입니다.
    reason: source_note
lexical_decisions:
- source_word: laborabunt
  english_pob_choice: They will labor
  chosen_korean: 그들은 수고할 것이나
  alternatives_korean:
  - 그들은 일할 것이나
  - 그들은 애쓸 것이나
  lexicon: laboro
  rationale: 문맥상 단순한 노동보다 헛수고와 고된 수고의 뉘앙스가 있어 ‘수고하다’로 옮겼습니다.
- source_word: non dirigentur uiae eorum
  english_pob_choice: their ways will not be directed
  chosen_korean: 그들의 길은 바로잡히지 않을 것입니다
  alternatives_korean:
  - 그들의 길은 인도되지 않을 것입니다
  - 그들의 길은 정해지지 않을 것입니다
  lexicon: dirigo / via
  rationale: 라틴어 직역인 ‘지정되다/인도되다’보다, 행로가 제대로 서지 못한다는 뜻을 한국어로 자연스럽게 드러냈습니다.
- source_word: Haec signa
  english_pob_choice: these signs
  chosen_korean: 이 표징들을
  alternatives_korean:
  - 이 징조들을
  - 이 표적들을
  lexicon: signum
  rationale: 예언적 문맥에서 단순한 ‘표시’보다 미래를 가리키는 ‘표징’이 원문 기능을 더 잘 살립니다.
- source_word: iterum et ploraueris sicut et nunc et ieiunaueris septem diebus
  english_pob_choice: if you pray again and weep as you do now, and fast for seven days
  chosen_korean: 당신이 지금처럼 다시 기도하고 울며 일주일 동안 금식하면
  alternatives_korean:
  - 당신이 다시 기도하고 지금처럼 울며 칠 일 동안 금식하면
  - 당신이 다시 기도하고 울고 지금처럼 금식하며 칠 일 동안 금식하면
  lexicon: oraueris / ploraueris / ieiunaueris
  rationale: 세 동작의 병렬을 살리되, ‘sicut et nunc’의 비교를 ‘지금처럼’으로 자연스럽게 배치했습니다.
theological_decisions:
- issue: 예언적 응답의 어조
  chosen_reading: 직설적 미래형과 조건절을 유지해, 표징을 더 듣게 될 것이라는 계시적 약속의 긴장을 살렸습니다.
  alternative_readings:
  - 완곡한 가능형으로 완화하는 번역
  - 명령형 중심으로 재구성하는 번역
  rationale: 원문은 조건을 전제로 한 확정적 약속을 말하므로, 한국어에서도 그 긴장을 약화시키지 않는 것이 중요합니다.
  doctrine_reference: 계시와 예언의 조건적 약속 표현
- issue: ‘dirigentur’의 의미 처리
  chosen_reading: ‘바로잡히지 않을 것입니다’로 옮겨, 단순한 방향성보다 성공·성취의 부재를 암시하는 문맥적 의미를 반영했습니다.
  alternative_readings:
  - ‘인도되지 않을 것입니다’
  - ‘성공하지 못할 것입니다’
  rationale: 라틴어 동사는 문자적으로는 ‘곧게 하다/인도하다’이지만, 여기서는 길의 형통함이 막히는 뜻으로 읽히며, 한국어에서도 그 결과를 드러내는 표현이 더 적절합니다.
  doctrine_reference: 본문의 관용적 표현과 문맥적 의미 우선 원칙
