revisions:
- from: 그들은 수고할 것이나, 그들의 길은 바로잡히지 않을 것입니다. 나는 이 표징들을 당신에게 말하도록 허락받았습니다. 그리고 당신이 지금처럼 다시 기도하고 울며 일주일 동안 금식하면, 당신은 이보다 더 큰 것들을 다시 듣게 될 것입니다.[a]
  to: 그들은 수고할 것이나, 그들의 길은 인도함을 받지 못할 것입니다. 제가 이 표징들을 당신에게 말할 수 있도록 허락받았습니다. 그리고 당신이 지금처럼 다시 기도하고 울며 칠 일 동안 금식하면, 당신은 이보다 더 큰 것들을 다시 듣게 될 것입니다.
  rationale: 첫 절은 라틴어의 수동형 non dirigentur를 한국어의 ‘인도함을 받지 못하다’로 옮겨, 성공·형통으로 한정하거나 ‘바로잡음’이라는 추가 의미를 넣지 않았습니다. permissum est mihi는 ‘제가 … 허락받았습니다’로 자연스럽게 표현했고, septem diebus는 ‘칠 일 동안’으로 보존했습니다. 기존 각주는 번역 본문에 필요한 주석 기능을 하지 않으므로 제거했습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:26:12Z'
review_pass:
