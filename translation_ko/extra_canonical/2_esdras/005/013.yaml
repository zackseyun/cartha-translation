  source_fidelity: 첫 절의 laborabunt et non dirigentur uiae eorum를 포함한 점과 조건절 및 ‘다시’의 반복을 보존한 점은 원문에 충실합니다. 다만 ‘바로잡히지 않다’는 dirigentur에 원문에 없는 교정·회복의 뜻을 더하므로, 수동적 ‘인도됨’의 표현으로 고치는 편이 안전합니다.
  naturalness: ‘그들의 길은 인도함을 받지 못할 것입니다’는 현대 한국어에서 자연스럽고, 원문의 수동형 및 다소 열려 있는 의미를 유지합니다. ‘제가 … 말할 수 있도록 허락받았습니다’도 기존 문장보다 자연스럽습니다.
  terminology: signa는 이 예언적 문맥에서 ‘표징’으로 적절합니다. ‘수고하다’, ‘금식하다’, ‘칠 일’도 적합합니다. 기존 각주는 번역상의 대안이나 본문 이문을 제시하지 않고 편집상의 추정을 담고 있어, 본문 주석으로 유지할 필요가 없습니다.
