id: 2ES.5.2
reference: 2 Esdras 5:2
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et multiplicabitur iniustitia super hanc quam ipse tu vides et super quam audisti olim.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/002.yaml
  text: And unrighteousness will be multiplied beyond what you yourself see, and beyond what you heard long ago.
translation:
  language: ko
  text: 불의가 당신이 직접 보는 것보다도, 또 오래전에 들은 것보다도 더 많이 늘어날 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: iniustitia
  english_pob_choice: unrighteousness
  chosen_korean: 불의
  alternatives_korean:
  - 불의함
  - 의롭지 않음
  - 불법
  lexicon: δικαιοσύνη ↔ 불의(antonymic equivalent)
  rationale: 라틴어 iniustitia는 단순한 도덕적 악보다 의의 부재와 반대되는 상태를 가리키므로, 한국어에서는 성경적 대립항인 ‘불의’가 가장 직접적이고 간결합니다.
- source_word: multiplicabitur
  english_pob_choice: will be multiplied
  chosen_korean: 증식할 것입니다
  alternatives_korean:
  - 증가할 것입니다
  - 늘어날 것입니다
  - 배가될 것입니다
  lexicon: multiplico
  rationale: 단순한 ‘늘다’보다 수가 불어나고 퍼지는 뉘앙스를 살리기 위해 ‘증식하다’를 사용했습니다.
- source_word: super hanc quam ipse tu vides
  english_pob_choice: beyond what you yourself see
  chosen_korean: 당신이 직접 보는 것보다 더 많이
  alternatives_korean:
  - 당신 자신이 보는 것보다 더
  - 당신이 직접 보는 바를 넘어
  - 당신이 지금 보는 것보다 더
  lexicon: super + relative clause
  rationale: super를 단순한 장소적 ‘위에’가 아니라 비교의 ‘~보다 더/넘어’로 처리해야 하므로, 자연스러운 비교 표현으로 옮겼습니다.
- source_word: quam audisti olim
  english_pob_choice: what you heard long ago
  chosen_korean: 오래전에 들은 것보다 더 많이
  alternatives_korean:
  - 옛날에 들은 것보다 더
  - 예전에 들은 것보다 더
  - 한때 들은 것보다 더
  lexicon: olim
  rationale: olim은 막연한 과거가 아니라 ‘예전에/오래전에’의 시간적 거리감을 주므로, ‘오래전에’로 옮겨 앞절의 비교 구조를 유지했습니다.
theological_decisions:
- issue: iniustitia의 범주
  chosen_reading: 개별 죄행의 나열보다, 공동체 전반에 퍼지는 ‘불의’의 증대로 읽었습니다.
  alternative_readings:
  - ‘불법’으로 읽어 법적 위반의 색채를 강화하는 해석
  - ‘악함’으로 일반화하는 해석
  rationale: 문맥상 양적 증대가 핵심이므로, 도덕적·사회적 질서를 무너뜨리는 상태 전체를 가리키는 ‘불의’가 가장 적절합니다.
  doctrine_reference: 성경의 죄-의 대조 어휘
