id: 2ES.5.26
reference: 2 Esdras 5:26
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnibus creatis volatilibus nominasti tibi columbam unam, et ex omnibus plasmatis pecoribus providisti tibi ovem unam,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/026.yaml
  text: and from all the birds that have been created you named for yourself one dove[a], and from all the cattle that have been formed you provided for yourself one sheep,
  footnotes:
  - marker: a
    text: Or 'and from all the peoples that have multiplied you acquired for yourself one people, and to this people whom you desired you gave the law approved above all.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 만들어진 모든 새들 가운데서 너를 위해 한 마리 비둘기를 지명하셨고, 만들어진 모든 가축 가운데서 너를 위해 한 마리 양을 마련하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 nominasti는 문자적으로는 '이름 지으셨다'이지만, 문맥상 '특정 대상으로 지정하셨다'는 뜻도 담을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: volatilibus
  english_pob_choice: birds
  chosen_korean: 새들
  alternatives_korean:
  - 날짐승들
  - 새
  lexicon: volatilis
  rationale: 라틴어 volatilia/volatilibus는 날아다니는 짐승, 곧 새들을 가리키므로 문맥상 자연스러운 표준어로 '새들'을 택했습니다.
- source_word: nominasti tibi
  english_pob_choice: you named for yourself
  chosen_korean: 너를 위해 ... 지명하셨고
  alternatives_korean:
  - 자기 자신을 위해 ... 이름 지으셨고
  - 당신을 위해 ... 부르셨고
  lexicon: nominare
  rationale: nominasti는 단순히 이름을 붙이다보다 '특정 용도로 지정하다'는 뜻이 있어, 대상 선택의 의미를 살려 '지명하셨고'로 옮겼습니다.
- source_word: pecoribus ... ovem unam
  english_pob_choice: from all the cattle ... one sheep
  chosen_korean: 모든 가축 가운데서 ... 한 마리 양을 마련하셨습니다
  alternatives_korean:
  - 모든 가축 가운데서 ... 한 마리 양을 제공하셨습니다
  - 모든 짐승 가운데서 ... 한 마리 양을 택하셨습니다
  lexicon: pecus / ovis
  rationale: pecora는 집짐승, 가축의 범주이며 ovis는 양이므로 의미를 분명히 하되, 시적 대비를 유지하기 위해 '가축'과 '양'을 대응시켰습니다.
theological_decisions:
- issue: 직접 주소 형태의 대명사 처리
  chosen_reading: 원문과 전통적 축약을 따라 2인칭 단수 '너'를 유지했습니다.
  alternative_readings:
  - 당신
  - 주님
  rationale: 이 구절은 시적·비유적 서술 속에서 하나님께 직접 말하는 방식이므로, 원문의 직접성을 살려 '너'를 유지하는 편이 더 적절합니다.
  doctrine_reference: 수사적 직접화법 보존
