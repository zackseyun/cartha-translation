  source_fidelity: 초안은 2인칭 단수 tibi를 '너를 위해'로 옮겨, 화자인 기도자가 아니라 하나님을 위한 것이라는 원문의 재귀적 의미를 바꾸었습니다. 또한 nominasti의 기본 의미인 '이름 지으셨다'를 본문에서 '지명하셨다'로 좁혔습니다. 이를 바로잡아 원문의 표현과 선택의 함의를 함께 보존했습니다.
  naturalness: 현대 합쇼체의 하나님께 드리는 직접 호칭으로 '당신께서는'을 사용하고, '자신을 위하여'로 tibi의 지시 대상을 분명히 했습니다. '창조된 모든 날짐승'과 '빚어진 모든 가축'은 원문의 대비를 자연스럽게 유지합니다.
  terminology: volatilia는 포괄적인 '날짐승', pecora는 '가축', ovis는 '양'으로 옮겼습니다. nominasti는 본문에서 '이름 지으셨다'로 번역하고, 문맥상 선택·구별의 뉘앙스는 각주에 제한적으로 설명했습니다.
