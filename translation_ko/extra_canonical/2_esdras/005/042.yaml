  yaml_path: translation/extra_canonical/2_esdras/005/042.yaml
  text: 'And he said to me[a], ''I will liken my judgment to a crown: as there is no delay for the last, so there is no haste for the first.'''
  footnotes:
  - marker: a
    text: '''Crown'' may also be understood as ''circle'' or ''ring,'' which would make the comparison emphasize symmetry between first and last.'
    reason: lexical_alternative
    anchor_ref: '5:42'
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. 「나는 내 심판을 관에 비유하겠습니다. 마지막 자들에게는 지체가 없는 것처럼, 첫째 자들에게도 서두름이 없습니다」.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘관’은 ‘원’ 또는 ‘고리’로도 이해할 수 있어, 첫째와 마지막 사이의 대칭성을 강조할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: adsimilabo
  english_pob_choice: I will liken
  chosen_korean: 비유하겠습니다
  alternatives_korean:
  - 비교하겠습니다
  - 닮게 하겠습니다
  lexicon: adsimilabo
  rationale: 라틴어 adsimilabo는 단순한 비교보다 둘 사이의 형상적 대응을 드러내는 ‘비유하다/비유하겠습니다’가 가장 자연스럽고 직접적입니다.
- source_word: iudicium meum
  english_pob_choice: my judgment
  chosen_korean: 내 심판
  alternatives_korean:
  - 내 판단
  - 내 재판
  lexicon: iudicium
  rationale: 문맥상 추상적 ‘판단’보다 종말론적·재판적 성격이 있는 ‘심판’이 한국어 독자에게 원문의 무게를 더 잘 전달합니다.
- source_word: coronae
  english_pob_choice: crown
  chosen_korean: 관
  alternatives_korean:
  - 왕관
  - 원형
  lexicon: corona
  rationale: 영어 POB 각주가 ‘circle/ring’ 가능성을 열어 두므로, 본문에서는 왕권 이미지를 과도하게 좁히지 않는 중립적 ‘관’을 택했습니다.
- source_word: sicut non nouissimorum tarditas, sic nec priorum uelocitas
  english_pob_choice: as there is no delay for the last, so there is no haste for the first
  chosen_korean: 마지막 자들에게는 지체가 없는 것처럼, 첫째 자들에게도 서두름이 없습니다
  alternatives_korean:
  - 끝자들에게 늦어짐이 없는 것처럼, 먼저인 자들에게도 서두름이 없습니다
  - 뒤에 있는 자들에게 지체가 없는 것처럼, 앞에 있는 자들에게도 서두름이 없습니다
  lexicon: tarditas / uelocitas
  rationale: 대구 구조를 살리되 ‘delay/haste’의 시간 감각을 한국어로 자연스럽게 옮기기 위해 ‘지체’와 ‘서두름’을 대응시켰습니다.
theological_decisions:
- issue: 심판과 시간성의 대구
  chosen_reading: 하나님의 심판은 마지막과 첫째를 서로 대칭적으로 다루며, 어느 쪽에도 지체나 서두름으로 인한 불공정이 없다는 뜻으로 읽었습니다.
  alternative_readings:
  - 단순히 순서에 대한 속도 비유로 읽는 것
  - 왕권 상징인 관만 강조하는 읽기
  rationale: 원문의 핵심은 속도 자체가 아니라 심판의 공정성과 질서의 대칭성에 있습니다. 영어 POB 각주도 crown/ring의 대칭 가능성을 열어 둡니다.
  doctrine_reference: divine justice / eschatological judgment
