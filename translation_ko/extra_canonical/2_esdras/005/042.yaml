    rationale: It is present in the supplied Latin source and introduces the following response; omission loses source content and the syntactic continuation.
  - severity: medium
    issue: “관” is ambiguous in contemporary Korean and most readily means “coffin.”
    rationale: For Latin corona, “왕관” supplies the primary meaning without introducing an unintended object. The alternate circle/ring sense can be preserved in the note.
  - severity: medium
    issue: “첫째 자들에게” is not natural Korean for priorum.
    rationale: “처음 사람들에게” preserves the contrast with “마지막 사람들” in idiomatic modern Korean without importing a specific theological interpretation.
  - severity: low
