  terminology: “심판” appropriately renders iudicium in this context, and “비유하겠습니다” is a suitable rendering of adsimilabo. “왕관” should replace “관”; the alternative circular/ring sense can remain in a footnote. The footnote anchor should attach directly to “왕관.”
  issues:
