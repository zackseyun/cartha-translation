base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/033.yaml
  text: '...before you.'' And I said[a], ''Speak, my lord.'' And he said to me, ''You have become greatly beside yourself in mind over Israel; or have you loved him more...'
  footnotes:
  - marker: a
    text: Or "And I said, 'No, lord, but I have spoken in grief, for my inward parts torment me every hour as I seek to grasp the way of the Most High and to search out part of his judgment.'".
    reason: previous_rendering
translation:
  language: ko
  text: …당신 앞에서요. 내가 말했습니다. 「말씀하십시오, 내 주여.」 그러자 그가 내게 말했습니다. 「너는 이스라엘 때문에 마음이 크게 혼란에 빠졌구나. 아니면 그를 더 사랑했느냐…」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어의 in excessu mentis는 직역하면 ‘마음/정신의 과도한 이탈’에 가깝습니다. 영어 POB의 ‘beside yourself in mind’를 따라 자연스럽게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: coram te
  english_pob_choice: '...before you.'
  chosen_korean: …당신 앞에서요.
  alternatives_korean:
  - …당신 앞에.
  - …당신 앞에서.
  lexicon: coram
  rationale: 직접적인 위치 관계를 살리되, 문맥상 이어지는 발화를 위해 자연스러운 종결 어미를 붙였습니다.
- source_word: loquere, dominus meus
  english_pob_choice: Speak, my lord.
  chosen_korean: 「말씀하십시오, 내 주여.」
  alternatives_korean:
  - 「말하세요, 내 주인이시여.」
  - 「말해 주십시오, 내 주님.」
  lexicon: loquere / dominus meus
  rationale: loquere의 명령형을 공손한 청유로 옮기고, dominus meus는 문맥상 호칭으로서 ‘내 주여’가 가장 직접적입니다.
- source_word: valde in excessu mentis factus es
  english_pob_choice: You have become greatly beside yourself in mind
  chosen_korean: 너는 마음이 크게 혼란에 빠졌구나
  alternatives_korean:
  - 너는 정신이 크게 빗나갔구나
  - 너는 마음이 크게 제정신을 잃었구나
  lexicon: in excessu mentis factus es
  rationale: 라틴어의 ‘마음/정신의 과도한 이탈’을 한국어로 과장 없이 드러내기 위해 ‘마음이 크게 혼란에 빠졌다’로 옮겼습니다.
- source_word: in Israel
  english_pob_choice: over Israel
  chosen_korean: 이스라엘 때문에
  alternatives_korean:
  - 이스라엘에 대하여
  - 이스라엘에 관하여
  lexicon: in Israel
  rationale: 문맥상 대상에 대한 강한 정서적 반응을 나타내므로 ‘때문에’가 더 자연스럽고 원문의 감정적 무게를 살립니다.
