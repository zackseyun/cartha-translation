translation:
  language: ko
  text: …당신 앞에서. 내가 말했습니다. 「말씀하십시오, 내 주여.」 그러자 그가 내게 말했습니다. 「너는 이스라엘에 관하여 정신이 몹시 혼미해졌구나[a]. 아니면 그를 더 사랑했느냐…」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 in excessu mentis factus es는 문자적으로 ‘정신의 벗어남 속에 있게 되었다’는 뜻입니다. 문맥상 정신적으로 크게 제자리를 잃거나 혼미해진 상태를 가리킵니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: coram te
  english_pob_choice: '...before you.'
  chosen_korean: …당신 앞에서요.
  alternatives_korean:
  - …당신 앞에.
  - …당신 앞에서.
  lexicon: coram
  rationale: 직접적인 위치 관계를 살리되, 문맥상 이어지는 발화를 위해 자연스러운 종결 어미를 붙였습니다.
- source_word: loquere, dominus meus
  english_pob_choice: Speak, my lord.
  chosen_korean: 「말씀하십시오, 내 주여.」
