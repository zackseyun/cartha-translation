  naturalness: ‘큰 공포 속에 사로잡힐’보다 ‘큰 공포에 사로잡힐’이 현대 한국어에서 더 자연스럽습니다. 또한 마지막 절은 ‘믿음이 메마른 곳이 될 것입니다’로 하면 불모의 비유를 유지하면서도 문법적 관계가 명료해집니다.
