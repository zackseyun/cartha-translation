id: 2ES.5.1
reference: 2 Esdras 5:1
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: 'de signis autem: ecce dies venient, et adprehendentur qui inhabitant super terram in excessu multo, et abscondetur veritatis via, et sterilis erit a fide regio.'
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/001.yaml
  text: 'But concerning the signs: behold[a], days are coming when those who dwell on the earth will be seized with great terror, and the way of truth will be hidden, and the land will be barren of faith.'
  footnotes:
  - marker: a
    text: Or 'in great bewilderment'.
    reason: previous_rendering
translation:
  language: ko
  text: 그런데 표징들에 관하여 말하자면, 보십시오, 날들이 오고 있습니다. 그때에는 땅 위에 사는 자들이 큰 공포에 사로잡힐 것이며, 진리의 길은 숨겨질 것이고, 그 땅은 믿음이 메마른 곳이 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 혼란 속에’.
    reason: 라틴어 *in excessu multo*는 문맥상 큰 공포나 공황을 가리키는 것으로 읽히지만, 큰 혼란 또는 당혹의 뉘앙스로 이해될 여지도 있습니다.
lexical_decisions:
- source_word: de signis autem
  english_pob_choice: But concerning the signs
  chosen_korean: 그런데 표징들에 관하여 말하자면
  alternatives_korean:
  - 그런데 징조들에 대하여
  - 그런데 이 표적들에 관하여
  lexicon: signum
  rationale: 라틴어 signa는 종말론적 맥락에서 ‘징조/표징’을 뜻하므로, 본문 주제를 드러내는 ‘표징들에 관하여’로 옮겼습니다.
- source_word: ecce
  english_pob_choice: behold
  chosen_korean: 보십시오
  alternatives_korean:
  - 보라
  - 여기 보십시오
  lexicon: ecce
  rationale: 문어적이면서도 현대 합쇼체에 맞는 주의 환기 표현으로 ‘보십시오’를 택했습니다.
- source_word: in excessu multo
  english_pob_choice: with great terror
  chosen_korean: 큰 공포 속에 사로잡힐
  alternatives_korean:
  - 큰 혼란에 빠질
  - 크게 동요할
  lexicon: excessus
  rationale: 영문 POB의 수정판과 라틴어의 문맥이 단순한 당혹감보다 종말적 공포/경악을 가리키므로, ‘사로잡힐’로 상태의 압도됨을 살렸습니다.
- source_word: abscondetur veritatis via
  english_pob_choice: the way of truth will be hidden
  chosen_korean: 진리의 길은 숨겨질 것이고
  alternatives_korean:
  - 진리의 길은 가려질 것이고
  - 진리의 길은 감추어질 것이고
  lexicon: via veritatis
  rationale: ‘via’를 직역해 ‘길’로 유지하고, 수동 미래형의 감춰짐을 ‘숨겨질’로 자연스럽게 옮겼습니다.
- source_word: sterilis erit a fide regio
  english_pob_choice: the land will be barren of faith
  chosen_korean: 그 땅은 믿음이 메말라 버릴 것입니다
  alternatives_korean:
  - 그 나라에는 믿음이 없을 것입니다
  - 그 땅은 믿음으로부터 황폐할 것입니다
  lexicon: sterilis / fides / regio
  rationale: sterilis의 ‘불모/메마름’ 이미지를 살려, 신앙의 부재를 단순 부정이 아니라 황폐 상태로 나타내기 위해 ‘메말라 버릴 것입니다’로 옮겼습니다.
theological_decisions:
- issue: apocalyptic affect of 'in excessu multo'
  chosen_reading: 종말론적 상황에서 임하는 집단적 공포와 경악으로 이해해 번역했습니다.
  alternative_readings:
  - 큰 혼란
  - 황홀경
  rationale: 영문 POB의 개정 사유가 지적하듯, 이 표현은 문맥상 인지적 혼란보다 재난 앞의 압도적 공포를 뜻하는 쪽이 더 적합합니다.
  doctrine_reference: 종말 심판과 재난의 공포에 대한 묵시문학적 언어
