source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et mulieres parient menstruata monstra. Et in dulcibus aquis salsae inuenientur, et amici omnes semetipsos expugnabunt, et abscondetur tunc sensus, et intellectus separabitur in promptuarium suum, Et queretur a multis et non inuenietur, et
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/009.yaml
  text: and women will give birth to monstrous things in menstruation. And in sweet waters salty waters will be found[a], and all friends will make war on one another, and then understanding will be hidden, and insight will withdraw into its storehouse.
  footnotes:
  - marker: a
    text: Latin 'menstruata monstra' is obscure. The main text renders the phrase broadly as monstrous births; a more wooden rendering would be difficult English and may overstate precision the surviving Latin does not securely provide.
    reason: lexical_alternative
    anchor_ref: '5:9'
translation:
  language: ko
  text: 그리고 여자들은 월경과 관련된 기이한 것들을 낳을 것이며, 담수에서는 짠물이 발견될 것입니다. 또한 모든 친구가 서로를 공격할 것이며, 그때 분별은 숨겨지고 통찰은 자기 저장고로 물러날 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 라틴어 menstruata monstra는 뜻이 분명하지 않습니다. menstruata는 문법상 ‘기이한 것들’을 수식하지만, 그 정확한 뜻과 여자들의 출산에 어떤 관계인지 확실하지 않습니다. 본문은 이 불확실성을 보존하여 ‘월경과 관련된 기이한 것들’로 넓게 옮겼습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: et mulieres parient menstruata monstra
  english_pob_choice: and women will give birth to monstrous things in menstruation
  chosen_korean: 여자들은 월경 중에 괴물 같은 것들을 낳을 것이며
  alternatives_korean:
  - 여자들은 월경 속에서 괴물 같은 것들을 낳을 것이며
  - 여자들은 월경하는 동안 괴물 같은 것들을 낳을 것이며
  lexicon: menstruata / monstra
  rationale: menstruata를 단순히 '괴물 같은 것들'로만 두지 않고 월경의 시기를 분명히 드러내기 위해 '월경 중에'를 넣었습니다. monstra는 확정적 단수 명칭보다 불확실한 복수적 묘사에 가까워 '괴물 같은 것들'로 옮겼습니다.
- source_word: Et in dulcibus aquis salsae inuenientur
  english_pob_choice: And in sweet waters salty waters will be found
  chosen_korean: 달콤한 물에서는 짠 물이 발견될 것입니다
  alternatives_korean:
  - 달콤한 물에서는 소금기 있는 물이 발견될 것입니다
  - 단 물에서는 짠 물이 발견될 것입니다
  lexicon: dulcibus aquis / salsae
  rationale: dulcibus aquis와 salsae의 대조를 살리기 위해 '달콤한 물'과 '짠 물'의 직설적 대비를 유지했습니다.
- source_word: et amici omnes semetipsos expugnabunt
  english_pob_choice: and all friends will make war on one another
  chosen_korean: 모든 친구들이 서로를 대적하여 싸울 것이며
  alternatives_korean:
  - 모든 친구들이 서로를 공격할 것이며
  - 모든 친구들이 서로에게 전쟁을 일으킬 것이며
  lexicon: amici / semetipsos expugnabunt
  rationale: expugnabunt는 단순한 감정적 불화보다 상호 공격과 적대 행위를 가리키므로, 자연스러운 현대 한국어로 '서로를 대적하여 싸울'을 택했습니다.
- source_word: abscondetur tunc sensus, et intellectus separabitur in promptuarium suum
  english_pob_choice: then understanding will be hidden, and insight will withdraw into its storehouse
  chosen_korean: 그때 이해는 숨겨질 것이고 지혜는 자기 저장고로 물러날 것입니다
  alternatives_korean:
  - 그때 이해는 감춰질 것이고 통찰은 자기 저장고로 물러날 것입니다
  - 그때 분별은 숨겨질 것이고 지식은 자기 저장고로 물러날 것입니다
  lexicon: sensus / intellectus / promptuarium
  rationale: sensus와 intellectus의 중첩을 한국어에서 완전히 분리하기 어렵기 때문에, POB의 구분을 따라 '이해'와 '지혜'로 대응시켰습니다. promptuarium은 물리적 '저장고'의 이미지를 보존했습니다.
theological_decisions:
