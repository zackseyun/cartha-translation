    rationale: 라틴어 dulcis aqua는 통상 담수·민물을 가리키며, 뒤의 salsae와는 담수/염수의 역설적 대조입니다.
  - severity: medium
    issue: menstruata monstra를 ‘여자들은 월경 중에 … 낳을 것’으로 확정함
    rationale: menstruata는 문법상 monstra를 수식하며, 보존 라틴어에서 이 표현의 정확한 의미는 불확실합니다. 여성의 월경 시기라는 해석만을 본문에 확정하면 모호성을 잃습니다.
