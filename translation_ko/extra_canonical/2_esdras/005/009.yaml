  source_fidelity: 개정이 필요합니다. dulcibus aquis는 이 문맥에서 맛이 ‘달콤한 물’이라기보다 ‘민물/담수’의 뜻이며, salsae(생략된 aquae)를 ‘짠물’과 대비해야 합니다. 또한 난해한 menstruata monstra는 문법상 monstra와 결합하지만 정확한 뜻과 관계가 불확실하므로, 여성이 ‘월경 중에’ 출산한다는 한 가지 해석으로 고정하지 않는 편이 안전합니다.
  naturalness: 합쇼체 미래 서술은 적절합니다. 다만 ‘달콤한 물’은 현대 한국어에서 음료의 단맛을 우선 떠올리게 하므로 재난 표징의 물-대조를 자연스럽게 전달하지 못합니다. ‘이해’와 ‘지혜’보다 ‘분별’과 ‘통찰’이 sensus/intellectus의 병렬을 더 자연스럽게 유지합니다.
  terminology: monstra는 확정된 생물 분류로서의 ‘괴물’보다 ‘기이한 것들/괴이한 출생물’이라는 표징적 의미를 가질 수 있습니다. promptuarium의 저장 이미지와 intellectus의 인격화는 ‘자기 저장고로 물러날’로 보존할 수 있습니다.
