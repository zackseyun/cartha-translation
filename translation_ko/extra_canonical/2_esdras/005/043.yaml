  text: And I answered and said[a], 'For could you not make those who have been made, and those who are, and those who will be, all at once, so that you might show your judgment more quickly?'
  footnotes:
  - marker: a
    text: Or 'Could you not make'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 대답하여 말했습니다. 「어째서 당신은 이미 만들어진 것들과 지금 있는 것들과 장차 있을 것들을 한꺼번에 지으실 수 없으셨습니까? 그리하여 당신의 심판을 더 빨리 나타내실 수 있지 않습니까?」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘만들 수 없으셨습니까’이지만, 문맥상 앞선 논지를 잇는 반문이어서 ‘어째서’로 자연화할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: nec enim
  english_pob_choice: For ...
  chosen_korean: 어째서 ...
  alternatives_korean:
  - 왜냐하면 ...
  - 그리고 진정 ...
  lexicon: Latin nec enim
  rationale: enim이 설명적·논리적 연결을 더하므로, 단순한 질문이 아니라 앞선 논지를 잇는 반문으로 한국어를 자연스럽게 구성했습니다.
- source_word: poteras facere
  english_pob_choice: could you not make
  chosen_korean: 지으실 수 없으셨습니까
  alternatives_korean:
  - 만드실 수 없으셨습니까
  - 하실 수 없으셨습니까
  lexicon: Latin possum + facere
  rationale: 가능성/능력을 묻는 반문이므로 ‘지으시다’를 택해 창조 행위의 어감을 살렸고, 현대 합쇼체에 맞게 공손한 반문형으로 옮겼습니다.
- source_word: qui facti sunt et qui sunt et qui futuri sunt
  english_pob_choice: those who have been made, and those who are, and those who will be
  chosen_korean: 이미 만들어진 것들과 지금 있는 것들과 장차 있을 것들
  alternatives_korean:
  - 만들어진 자들과 있는 자들과 장차 있을 자들
  - 생긴 것들과 있는 것들과 앞으로 있을 것들
  lexicon: Latin relative clauses with temporal sequence
  rationale: 인격화 여부가 문맥상 두드러지지 않아 ‘것들’로 넓게 옮겨 시간적 총괄을 유지했습니다.
- source_word: iudicium tuum
  english_pob_choice: your judgment
  chosen_korean: 당신의 심판
  alternatives_korean:
  - 당신의 판단
  - 당신의 재판
  lexicon: Latin iudicium
  rationale: 본문의 신학적·재판적 의미를 살려 ‘심판’을 선택했습니다.
theological_decisions:
- issue: 반문 형식과 하나님의 행위 능력
  chosen_reading: 질문은 하나님의 창조 능력을 전제한 반문으로 처리했습니다.
  alternative_readings:
  - 단순한 정보 질문으로 평서화
  - ‘어째서’ 대신 직설적 가능성 질문으로 번역
  rationale: 문맥상 에스라의 항변은 하나님이 하실 수 없었는지 묻는 것이 아니라, 그렇게 하시면 심판을 더 빨리 드러내실 수 있지 않느냐는 논증입니다.
  doctrine_reference: 창조주 하나님의 주권과 심판의 계시
- issue: ‘현재/미래’의 대상 표현
  chosen_reading: 사람을 직접 지칭하기보다 시간 범주를 포괄하는 표현으로 옮겼습니다.
  alternative_readings:
  - ‘자들’로 인격화
  - ‘존재들’로 철학화
  rationale: 라틴어 관계절의 반복은 존재의 총체성을 강조하지만, 한국어에서 과도한 철학화나 어색한 인격화를 피하면서도 범위를 보존해야 했습니다.
  doctrine_reference: 창조 질서의 총괄성과 종말 심판
