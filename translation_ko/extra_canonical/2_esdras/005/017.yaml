  text: 아니, 당신은 이스라엘이 그들이 유배된 땅에서 당신에게 맡겨졌다는 것을 알지 못하십니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “아니, 당신은 이스라엘이 그들의 유배지에서 당신에게 맡겨졌다는 것을 알지 못하십니까?”
    reason: previous_rendering
lexical_decisions:
- source_word: tibi creditus est
  english_pob_choice: has been entrusted to you
  chosen_korean: 당신에게 맡겨졌다는
  alternatives_korean:
  - 당신에게 신탁되었다는
  - 당신에게 위탁되었다는
  - 당신에게 부탁되었다는
  lexicon: creditus est
  rationale: 받는 이에게 책임과 보관 의무가 주어졌다는 점을 살려 ‘맡겨지다’로 옮겼습니다.
- source_word: Israel
  english_pob_choice: Israel
  chosen_korean: 이스라엘
  alternatives_korean:
  - 이스라엘 백성
  - 야곱의 자손
  lexicon: Israel
  rationale: 고유명사를 그대로 음역하되, 문맥상 민족/공동체를 가리키는 것으로 읽히게 했습니다.
- source_word: in regione trans migrationis eorum
  english_pob_choice: in the land of their exile
  chosen_korean: 그들의 이주지에서
  alternatives_korean:
  - 그들의 유배지에서
  - 그들의 나그네 땅에서
  - 그들의 포로 생활의 땅에서
  lexicon: regio / trans migratio
  rationale: 라틴어의 직역인 ‘이주지’를 유지해 본문이 말하는 장소적·상태적 긴장을 살렸습니다.
theological_decisions:
- issue: 이스라엘의 신적 위탁 책임
  chosen_reading: 이스라엘은 하나님의 소유로서 사람이 아니라 수신자에게 맡겨진 책임 있는 대상입니다.
  alternative_readings:
  - 단순한 정치적 관할권 위임
  - 비유적 보호 요청
  rationale: 문맥상 ‘creditus est’는 단순 소유권이 아니라 관리·책임을 포함한 위탁을 강조합니다.
  doctrine_reference: 청지기 책임, 하나님의 백성에 대한 위탁
