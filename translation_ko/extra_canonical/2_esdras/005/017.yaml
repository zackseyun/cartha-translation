  verdict: revise
  source_fidelity: 본문의 절 경계는 올바르게 5:17의 질문에서 끝납니다. 다만 ‘그들의 이주지’는 라틴어 transmigratio가 이 문맥에서 가리키는 강제 이주·유배의 뜻을 충분히 드러내지 못합니다.
  naturalness: ‘혹시 당신은’은 수사 의문문인 Aut nescis에 비해 지나치게 완화되어 있으며, ‘그들의 이주지’도 현대 한국어에서 다소 부자연스럽습니다. ‘아니, 당신은 … 알지 못하십니까?’와 ‘그들이 유배된 땅’이 자연스럽습니다.
  terminology: creditus est는 ‘맡겨졌다’로 적절합니다. ‘유배’는 이 문맥의 transmigratio를 가장 명료하게 전달하며, 특정 교리적 해석을 더하지 않습니다.
