id: 2ES.5.24
reference: 2 Esdras 5:24
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et ex omnium terrarum orbis elegisti tibi foveam unam, et ex omnibus floribus orbis elegisti tibi lilium unum,
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/024.yaml
  text: and from all the lands of the world you chose for yourself one pit[a], and from all the flowers of the world you chose for yourself one lily,
  footnotes:
  - marker: a
    text: Or 'and from all the depths of the sea you filled for yourself one stream, and from all the cities that have been built you sanctified Zion for yourself,'.
    reason: previous_rendering
translation:
  language: ko
  text: 또 주께서는 온 세상의 모든 땅 가운데서 주님을 위하여 한 구덩이를 택하시고, 온 세상의 모든 꽃 가운데서 주님을 위하여 백합 한 송이를 택하셨습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “바다의 모든 깊은 곳에서 주님을 위하여 한 시내를 채우시고, 세워진 모든 성읍 가운데서 시온을 주님을 위하여 거룩하게 하셨습니다.”
    reason: textual_variant
lexical_decisions:
- source_word: foveam unam
  english_pob_choice: one pit
  chosen_korean: 한 구덩이
  alternatives_korean:
  - 한 웅덩이
  - 한 구멍
  - 한 구덩이 하나
  lexicon: fovea
  rationale: 라틴어 fovea는 문자 그대로 ‘구덩이, 판 함몰’의 뜻이므로, 시적 이미지와 직역성을 함께 살려 ‘구덩이’로 옮겼습니다.
- source_word: ex omnium terrarum orbis
  english_pob_choice: from all the lands of the world
  chosen_korean: 온 땅의 모든 곳에서
  alternatives_korean:
  - 세상의 모든 땅에서
  - 온 세계의 모든 땅에서
  lexicon: orbis terrarum
  rationale: orbis terrarum은 단순한 ‘세계’보다 ‘땅의 둥근 테두리/전 세계’를 가리키는 표현이라, 자연스러운 한국어로 ‘온 땅의 모든 곳에서’로 풀었습니다.
- source_word: lilium unum
  english_pob_choice: one lily
  chosen_korean: 백합 한 송이
  alternatives_korean:
  - 한 백합
  - 백합 하나
  lexicon: lilium
  rationale: lilium은 상징성을 가진 꽃 이름이므로 ‘백합’으로 옮기고, 한국어 자연성을 위해 수량 표현을 ‘한 송이’로 처리했습니다.
- source_word: elegisti tibi
  english_pob_choice: you chose for yourself
  chosen_korean: 자신을 위해 택하시고
  alternatives_korean:
  - 스스로를 위해 선택하시고
  - 자신을 위해 선택하시고
  lexicon: eligere
  rationale: 반복되는 선택의 행위를 살리기 위해 ‘택하시고’를 사용했고, tibi의 수혜·귀속 뉘앙스는 ‘자신을 위해’로 드러냈습니다.
theological_decisions:
- issue: 시적·상징적 병치(구덩이와 백합)
  chosen_reading: 원문의 대비를 그대로 살려, 의미를 평준화하지 않고 병치된 이미지를 직역에 가깝게 유지했습니다.
  alternative_readings:
  - 구덩이를 ‘샘’이나 ‘물길’로 의미화하는 해석
  - 백합을 상징적으로 다른 꽃 이름으로 일반화하는 해석
  rationale: 이 절은 후대 해석보다 라틴어 본문 자체의 이미지 충격과 대비가 중요하므로, 상징을 과잉 해설하지 않고 그대로 드러내는 쪽이 본문 충실성에 맞습니다.
  doctrine_reference: 성서시의 이미지 보존 원칙
- issue: 주체를 직접 언급하는 방식
  chosen_reading: ‘주께서는’으로 시작해 신적 행위의 주체를 분명히 했습니다.
  alternative_readings:
  - ‘당신께서는’
  - 주어 생략
  rationale: 한국어 문장에서는 주어를 명시하는 편이 자연스럽고, 본문이 말하는 선택 행위의 주체가 분명히 드러나도록 했습니다.
  doctrine_reference: 문맥상 신적 화자/주체의 명료화
