    rationale: 제공된 영어 감사 이력은 이전 번역 문구를 대안으로 제시할 뿐, 한국어 각주가 특정 전승의 성격을 단정할 근거를 충분히 제공하지 않습니다. 대체 독법 문구만 중립적으로 제시해야 합니다.
