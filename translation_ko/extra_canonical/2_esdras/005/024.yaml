  to: 또 주께서는 온 세상의 모든 땅 가운데서 주님을 위하여 한 구덩이를 택하시고, 온 세상의 모든 꽃 가운데서 주님을 위하여 백합 한 송이를 택하셨습니다.[a]
  rationale: 본문은 라틴어의 반복되는 ‘온 세상 … 가운데서’와 elegisti tibi의 수혜 표현을 더 정확하고 자연스러운 한국어로 다듬었습니다. 구덩이와 백합의 낯선 병치는 보존했습니다. 각주는 제공된 대체 문구를 중립적으로 제시하여, 뒷받침되지 않는 전승·절 번호 설명을 제거했습니다.
