  source_fidelity: 수정이 필요합니다. 라틴어 coram te는 대화 상대를 특정하여 ‘주님’으로 만들지 않으므로 ‘당신 앞에서’가 적절합니다. 또한 de qua dixisti mihi는 ‘당신이 제게 말씀하신 그분’(그 어머니가 화자에게 말했다는 뜻)이라는 뜻이 아니라, ‘당신이 제게 말씀해 주셨던/말씀하셨던 우리 어머니’라는 뜻입니다. nam의 논리적 연결도 본문에 반영해야 합니다.
  naturalness: 합쇼체 문장으로 자연스럽게 다듬었습니다. ‘말씀하실 길’은 상대가 앞으로 화자에게 말할 길을 준다는 뜻으로 읽힐 수 있어, ‘제게 길을 열어 주셨으니’로 바로잡았습니다.
  terminology: 대화 상대는 이 문맥에서 주님으로 단정할 수 없으므로 존칭 명사 ‘주님’을 쓰지 않았습니다. ‘우리 어머니’와 ‘젊다/노년에 가까워지다’의 비유적·공동체적 표현은 유지했습니다.
  issues:
