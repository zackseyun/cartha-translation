base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/050.yaml
  text: 'And I asked and said[a], ''Since you have now given me a way, I will speak before you: is our mother, of whom you spoke to me, still young, or is she already drawing near to old age?'''
  footnotes:
  - marker: a
    text: Or 'our mother, of whom you spoke to me, is she still young'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 저는 묻고 말했습니다. “지금 제게 말씀하실 길을 주셨으니, 제가 주님 앞에서 말하겠습니다: 우리 어머니, 곧 저에게 말씀하신 그분은 아직 젊습니까, 아니면 이미 노년에 가까워지고 있습니까?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “우리 어머니, 곧 저에게 말씀하신 그분은 아직 젊습니까?”라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: coram te
  english_pob_choice: before you
  chosen_korean: 주님 앞에서
  alternatives_korean:
  - 당신 앞에서
  - 주님 면전에서
  lexicon: coram
  rationale: 대화 상대가 하나님/주권적 존재로 암시되는 문맥이므로, 단순한 공간적 '앞에서'보다 존칭이 드러나는 '주님 앞에서'가 한국어 합쇼체에 자연스럽습니다.
- source_word: nam
  english_pob_choice: 'Since you have now given me a way, I will speak before you: ...'
  chosen_korean: 지금 제게 말씀하실 길을 주셨으니
  alternatives_korean:
  - 이제 제게 길을 주셨으니
  - 당신이 이제 제게 말씀하실 길을 주셨으므로
  lexicon: nam
  rationale: 라틴어 nam의 논리적 연결을 살려 앞선 비유에 근거한 발화를 이어 주는 이유절로 옮겼습니다.
- source_word: mater nostra
  english_pob_choice: our mother
  chosen_korean: 우리 어머니
  alternatives_korean:
  - 우리의 어머니
  - 어머니
  lexicon: mater
  rationale: 직역에 가까운 '우리 어머니'가 소유·공동체적 관계를 가장 자연스럽게 보존합니다.
- source_word: adhuc iuuenis est / iam senectuti adpropinquat
  english_pob_choice: still young / already drawing near to old age
  chosen_korean: 아직 젊습니까, 아니면 이미 노년에 가까워지고 있습니까
  alternatives_korean:
  - 아직 젊습니까, 아니면 이미 늙어가고 있습니까
  - 아직 젊으십니까, 아니면 이미 노쇠에 가까워지고 있습니까
  lexicon: iuuenis / senectuti adpropinquat
  rationale: 대조되는 두 상태를 한국어의 자연스러운 병렬 의문으로 살렸고, '노년'은 senectus의 상태를 직접 반영합니다.
theological_decisions:
- issue: 화자 존칭 처리
  chosen_reading: 직접 화법에서 하나님/주권적 상대에게는 '주님'을 사용하고, 바깥 서술은 합쇼체로 유지했습니다.
  alternative_readings:
  - 전면적으로 평서체로 둘 것
  - 모든 직접화법을 동일하게 낮출 것
  rationale: 본문은 예언/대화 형식의 경어층위가 중요하므로, 한국어 독자가 발화 관계를 오해하지 않도록 최소한의 존칭을 반영했습니다.
  doctrine_reference: 문맥상 경외의 직접화법 처리 원칙
- issue: 우리 어머니라는 표현의 관계성
  chosen_reading: '''우리 어머니''를 유지해 화자 공동체가 공유하는 인물이라는 관계성을 드러냈습니다.'
  alternative_readings:
  - '''어머니''로 축약'
  - '''우리의 어머니''로 더 명시'
  rationale: 라틴어 mater nostra의 소유격은 단순 호칭이 아니라 공동체적 관계를 나타내므로, 이를 약화하지 않는 방향을 택했습니다.
  doctrine_reference: 원문 관계성 보존 원칙
