  text: And one whom those who dwell on the earth do not expect will reign, and the birds will migrate.
translation:
  language: ko
  text: 그리고 땅 위에 사는 사람들이 기대하지 않는 이가 다스릴 것이며, 새들은 이동할 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: et regnabit
  english_pob_choice: will reign
  chosen_korean: 다스리실 것이며
  alternatives_korean:
  - 통치하실 것이며
  - 왕으로 군림하실 것이며
  lexicon: regnabit
  rationale: 라틴어 regnabit의 핵심인 왕적 통치를 자연스럽게 살리되, 한국어에서 과도하게 직역적인 '군림하다'보다 중립적인 '다스리다'를 택했습니다.
- source_word: quem non sperant
  english_pob_choice: one whom ... do not expect
  chosen_korean: 기대하지 않는 이
  alternatives_korean:
  - 바라지 않는 이
  - 예상하지 못하는 이
  lexicon: sperant
  rationale: sperant은 단순한 정보 부족보다 '기대하다/고대하다'의 뉘앙스가 강하므로, POB의 의미를 따라 '기대하지 않는 이'로 옮겼습니다.
- source_word: qui inhabitant super terram
  english_pob_choice: those who dwell on the earth
  chosen_korean: 그 땅에 사는 사람들이
  alternatives_korean:
  - 땅 위에 거주하는 사람들이
  - 땅에 거하는 사람들이
  lexicon: inhabitant super terram
  rationale: super terram의 공간적 표현을 너무 경직되게 옮기지 않고, 한국어에서 자연스러운 '그 땅에 사는 사람들'로 풀었습니다.
- source_word: volatilia conmigrationem facient
  english_pob_choice: the birds will migrate
  chosen_korean: 새들도 이동할 것입니다
  alternatives_korean:
  - 새들도 이동할 것입니다
  - 새들도 옮겨 갈 것입니다
  lexicon: volatilia / conmigrationem facient
  rationale: 라틴어의 이동/이주 의미를 살리되, 종교적·시적 문맥에서도 무난한 현대 한국어 동사 '이동하다'를 사용했습니다.
theological_decisions:
- issue: 왕권 선포의 주어와 시제
  chosen_reading: 미래형으로, 기대하지 않는 이가 왕권을 행사하실 것처럼 번역했습니다.
  alternative_readings:
  - 현재형으로 '다스립니다'
  - 더 직접적으로 '왕이 되실 것입니다'
  rationale: 본문의 eschatological한 전망을 보존하기 위해 미래형을 유지했습니다.
  doctrine_reference: 종말론적 왕권 선포
