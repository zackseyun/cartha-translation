  source_fidelity: 본문은 라틴어의 핵심 구문을 대체로 반영하지만, 각주가 원문 대안 번역 자체가 아니라 ‘이전 번역을 뜻할 수 있다’는 메타 설명으로 바뀌어 있어 영어 POB 감사 기록의 각주 기능과 내용에 맞게 고쳐야 합니다. 또한 et는 문맥 연결이므로 ‘그리고’보다 ‘그러자’가 자연스럽습니다.
