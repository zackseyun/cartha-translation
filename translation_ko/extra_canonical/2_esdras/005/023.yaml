  terminology: Dominator Domine은 ‘주권자이신 주님’으로, vineam unam은 문맥상 ‘포도나무 하나’로 옮깁니다. ‘땅의 모든 숲과 그 모든 나무들 가운데서’는 라틴어의 병렬된 ex 구문을 자연스러운 한국어로 유지합니다.
