base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/023.yaml
  text: And I said[a], 'Sovereign Lord, from every forest of the earth and from all its trees you have chosen one vine,
  footnotes:
  - marker: a
    text: Or 'and from all the lands of the world you chose for yourself one pit, and from all the flowers of the world you chose for yourself one lily,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 말했습니다. 「주권자 주님, 땅의 모든 숲과 그 모든 나무들 가운데서 한 포도나무를 택하셨습니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘땅의 모든 땅들 가운데서 한 구덩이를, 세상의 모든 꽃들 가운데서 한 백합을 택하셨습니다’라는 이전 번역을 뜻할 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: Dominator Domine
  english_pob_choice: Sovereign Lord
  chosen_korean: 주권자 주님
  alternatives_korean:
  - 지배자 주님
  - 주권하시는 주님
  - 통치자 주님
  lexicon: κύριος/지배권 표현의 존칭적 호칭
  rationale: 라틴어의 Dominator Domine은 단순 호칭보다 주권과 통치를 함께 드러내므로, POB의 ‘Sovereign Lord’를 살려 ‘주권자 주님’으로 옮겼습니다.
- source_word: ex omni silva terrae
  english_pob_choice: from every forest of the earth
  chosen_korean: 땅의 모든 숲에서
  alternatives_korean:
  - 세상의 모든 숲에서
  - 온 땅의 모든 숲에서
  lexicon: silva / terra
  rationale: terrae의 범위를 ‘땅’으로 직역해 원문의 지리적 총체성을 보존했습니다.
- source_word: ex omnium arborum eius
  english_pob_choice: from all its trees
  chosen_korean: 그 모든 나무들 가운데서
  alternatives_korean:
  - 그의 모든 나무들 가운데서
  - 그 나무들 모두 가운데서
  lexicon: omnium arborum eius
  rationale: eius의 소유격을 ‘그’로 살리면서, 선택의 대상들 가운데서 한 그루를 뽑는 뉘앙스를 ‘가운데서’로 자연스럽게 표현했습니다.
- source_word: vineam unam
  english_pob_choice: one vine
  chosen_korean: 한 포도나무를
  alternatives_korean:
  - 한 덩굴을
  - 한 포도원을
  lexicon: vinea
  rationale: 문맥상 한 그루의 포도나무를 가리키므로 ‘포도나무’를 택해 이미지의 선명도를 유지했습니다.
theological_decisions:
- issue: 호칭의 위상과 경어
  chosen_reading: 내레이터의 보고문은 ‘말했습니다’로 처리하고, 하나님께 대한 호칭은 ‘주권자 주님’으로 높여 번역했습니다.
  alternative_readings:
  - ‘내가 말하였습니다’
  - ‘주권하시는 주님’
  rationale: 기도/탄원의 맥락에서 화자의 진술과 하나님 호칭의 위계를 분명히 하되, 현대 합쇼체의 자연스러움을 유지했습니다.
  doctrine_reference: 하나님의 주권과 기도적 خطاب
- issue: 선택 이미지의 보존
  chosen_reading: ‘숲’과 ‘나무들’의 대조를 그대로 살려, 창조 전체 중에서 하나를 택하시는 이미지를 유지했습니다.
  alternative_readings:
  - 의미를 단순화해 ‘모든 것 가운데서’로 포괄화
  rationale: 원문은 포괄적 선택을 구체적 창조 이미지로 제시하므로, 이미지를 약화시키지 않는 방향을 택했습니다.
  doctrine_reference: 창조주께서 피조물 가운데서 선택하시는 주권
