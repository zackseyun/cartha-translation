id: 2ES.5.29
reference: 2 Esdras 5:29
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et conculcaverunt qui contradicebant sponsionibus tuis quique tuis testamentis credebant.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/029.yaml
  text: And those who opposed your promises have trampled those who believed your covenants[a].
  footnotes:
  - marker: a
    text: Or "And if in hatred you hated your people, they ought to be chastised by your own hands.'".
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 당신의 약속에 반대하던 자들은 당신의 언약을 믿던 자들을 짓밟았습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: conculcaverunt
  english_pob_choice: have trampled
  chosen_korean: 짓밟았습니다
  alternatives_korean:
  - 밟아버렸습니다
  - 유린했습니다
  lexicon: conculcare
  rationale: 물리적으로 짓밟는 행위를 분명하게 살리되, 본문이 말하는 폭력성과 모욕감을 한국어로 자연스럽게 전달하기 위해 ‘짓밟았습니다’를 선택했습니다.
- source_word: contradicebant
  english_pob_choice: opposed
  chosen_korean: 반대하던
  alternatives_korean:
  - 거슬러 대항하던
  - 맞서던
  lexicon: contradicere
  rationale: 단순한 의견 차이보다 약속에 ‘맞서는’ 의미를 살리면서도 문맥상 과도하게 군사화하지 않기 위해 ‘반대하던’으로 옮겼습니다.
- source_word: sponsionibus tuis
  english_pob_choice: your promises
  chosen_korean: 당신의 약속
  alternatives_korean:
  - 당신의 서약
  - 당신의 보증
  lexicon: sponsio
  rationale: 라틴어 sponsio의 핵심은 약속/서약이지만, 한국어에서 본문 흐름을 가장 자연스럽게 받쳐 주는 기본어는 ‘약속’이어서 이를 택했습니다.
- source_word: testamentis
  english_pob_choice: covenants
  chosen_korean: 언약
  alternatives_korean:
  - 계약
  - 맹세
  lexicon: testamentum
  rationale: POB의 문맥상 testamenta는 하나님과 백성 사이의 언약을 가리키므로, 신학적 무게를 유지하는 표준어 ‘언약’을 사용했습니다.
theological_decisions:
- issue: 두 병렬 표현(sponsionibus / testamentis)의 의미 관계
  chosen_reading: ‘약속’과 ‘언약’을 나란히 두어, 앞절의 일반적 약속과 뒤절의 더 공식적인 언약 표현을 구분했습니다.
  alternative_readings:
  - 둘 다 ‘언약’으로 통일
  - 둘 다 ‘약속’으로 통일
  rationale: 라틴어는 두 단어를 구분해 병렬시키므로, 한국어에서도 같은 단어로 평준화하지 않고 의미 차이를 남겨 두는 편이 원문 긴장을 더 잘 보존합니다.
  doctrine_reference: 언약 신학 / 본문 의미 보존
