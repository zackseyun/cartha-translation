id: 2ES.5.4
reference: 2 Esdras 5:4
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: si autem tibi dederit Altissimus vivere, et videbis post tertiam turbatam, et relucescet subito sol noctu et luna interdie.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/004.yaml
  text: But if the Most High grants that you live[a], you will see after the third disturbance that the sun will suddenly shine at night, and the moon by day.
  footnotes:
  - marker: a
    text: Or 'after the third upheaval'.
    reason: previous_rendering
translation:
  language: ko
  text: 그러나 지극히 높으신 분께서 네가 살도록 허락하시면, 너는 세 번째 격변이 있은 뒤에 해가 밤에 갑자기 비치고 달이 낮에 비치는 것을 보게 될 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘세 번째 혼란 뒤에’.
    reason: 라틴어 turbatam은 ‘혼란, 소요, 격변’ 등으로 폭넓게 이해될 수 있습니다.
lexical_decisions:
- source_word: Altissimus
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Most High
  rationale: 라틴어 Altissimus를 신격 칭호로 살리면서도, 직역투를 피하고 현대 한국어에서 자연스러운 존칭 표현으로 옮겼습니다.
- source_word: tibi dederit vivere
  english_pob_choice: grants that you live
  chosen_korean: 네가 살아 있게 하시면
  alternatives_korean:
  - 네게 살기를 주시면
  - 네가 살도록 허락하시면
  lexicon: live
  rationale: 단순한 생존을 뜻하는 구문으로 보아, ‘살아 있게 하시면’으로 자연스럽게 옮겨 조건절의 의미를 유지했습니다.
- source_word: post tertiam turbatam
  english_pob_choice: after the third disturbance
  chosen_korean: 셋째 격변 후에
  alternatives_korean:
  - 셋째 소동 후에
  - 셋째 혼란 후에
  lexicon: disturbance
  rationale: 개정된 영어 본문의 ‘disturbance’를 따라, 종말론적 사건의 격렬함을 드러내는 ‘격변’을 선택했습니다.
- source_word: relucescet subito sol noctu et luna interdie
  english_pob_choice: the sun will suddenly shine at night, and the moon by day
  chosen_korean: 해가 밤에 갑자기 비치고 달이 낮에 비치는 것
  alternatives_korean:
  - 해가 밤에 갑자기 빛나고 달이 낮에 빛나는 것
  - 해가 밤에 갑자기 밝아지고 달이 낮에 밝아지는 것
  lexicon: sun / moon
  rationale: 라틴어의 역설적 종말 표지를 직설적으로 살려, ‘밤에 비치다’와 ‘낮에 비치다’로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 지극히 높으신 분의 호칭과 조건적 약속의 구조
  chosen_reading: 조건절을 그대로 살려, 지극히 높으신 분의 허락 아래 ‘살아 있음’이 사건 계시를 보는 전제임을 분명히 했습니다.
  alternative_readings:
  - 평서형으로 완화하여 단순 예언처럼 옮기는 방식
  rationale: 본문은 계시를 받는 자의 생존이 전제된 조건문이므로, 약속의 조건성을 보존해야 합니다.
  doctrine_reference: apocalyptic revelation and conditional promise
