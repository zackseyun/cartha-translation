- from: 지극히 높으신 분께서 네가 살아 있게 하시면, 너는 셋째 격변 후에 해가 밤에 갑자기 비치고 달이 낮에 비치는 것을 보게 될 것입니다.[a]
  to: 그러나 지극히 높으신 분께서 네가 살도록 허락하시면, 너는 세 번째 격변이 있은 뒤에 해가 밤에 갑자기 비치고 달이 낮에 비치는 것을 보게 될 것입니다.[a]
  rationale: 라틴어 본문에 따라 ‘격변’을 유지하고, 필사적 복원을 전제하는 ‘나팔’은 채택하지 않았습니다. 조건절을 자연스럽게 다듬고, 중복되던 각주를 실제 의미 범위를 보여 주는 대안으로 교체했습니다.
  reviewer_model: gpt-5.6-terra
