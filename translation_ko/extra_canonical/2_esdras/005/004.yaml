  source_fidelity: 라틴어 조건문(si autem ... dederit ... vivere)과 ‘셋째 [혼란/격변] 뒤에’, 그리고 밤의 해와 낮의 달이라는 표지를 충실히 반영합니다. 현행 ‘셋째 격변 후에’도 뜻은 맞지만, 각주가 본문과 완전히 동일하여 대안 독법의 기능을 하지 못합니다.
  naturalness: ‘네가 살아 있게 하시면’은 이해되지만 ‘네가 살도록 허락하시면’이 현대 한국어 합쇼체 문맥에서 더 자연스럽습니다. ‘세 번째 격변이 있은 뒤에’는 명사화된 라틴어 표현을 한국어로 분명하게 풀어 줍니다.
