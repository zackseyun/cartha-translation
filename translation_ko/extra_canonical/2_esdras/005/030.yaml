reference: 2 Esdras 5:30
language:
  code: ko
  name: Korean
  variant: 표준어 / modern formal-polite (합쇼체)
source:
  edition: Bensly 1895 (Texts and Studies III.2) + Bensly 1875 Missing Fragment, cleaned Latin
  text: et si odiens odisti populum tuum tuis manibus debet castigari.
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/030.yaml
  text: And if you indeed hate your people[a], they ought to be chastised by your own hands.
  footnotes:
  - marker: a
    text: Or 'And it happened, when I had spoken these words, that the angel who had come to me on the former night was sent to me,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 만일 당신이 정말로 당신의 백성을 미워하신다면, 그들은 당신의 손으로 징계를 받아야 합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: odiens odisti
  english_pob_choice: indeed hate
  chosen_korean: 정말로 미워하신다면
  alternatives_korean:
  - 참으로 미워하신다면
  - 진정으로 미워하신다면
  - 몹시 미워하신다면
  lexicon: Latin emphatic infinitive absolute / intensive repetition
  rationale: odiens odisti는 단순한 ‘미워하다’가 아니라 강조를 더하는 중첩 표현이므로, 한국어에서도 강한 확신을 나타내는 ‘정말로’로 그 강조를 살렸습니다.
- source_word: populum tuum
  english_pob_choice: your people
  chosen_korean: 당신의 백성
  alternatives_korean:
  - 당신의 ժողովուրդ
  - 당신의 민족
  - 당신의 사람들
  lexicon: populus
  rationale: populum tuum은 단순 집단보다 언약적 관계를 지닌 공동체를 가리키므로, POB의 직역적 의미를 살려 ‘백성’으로 옮겼습니다.
- source_word: castigari
  english_pob_choice: be chastised
  chosen_korean: 징계를 받아야 합니다
  alternatives_korean:
  - 매를 맞아야 합니다
  - 벌을 받아야 합니다
  - 훈계를 받아야 합니다
  lexicon: castigare
  rationale: castigari는 단순 처벌보다 교정·징계의 뜻이 강해, ‘징계를 받다’로 옮겨 도덕적·교정적 뉘앙스를 유지했습니다.
- source_word: tuis manibus
  english_pob_choice: by your own hands
  chosen_korean: 당신의 손으로
  alternatives_korean:
  - 당신의 직접적인 손으로
  - 친히 하셔서
  - 당신 자신이 손수
  lexicon: manus
  rationale: tuis manibus는 대리 없이 직접 행하는 행위를 뜻하므로, 한국어에서는 자연스럽게 ‘당신의 손으로’라고 옮겼습니다.
theological_decisions:
- issue: 하나님의 직접 징계와 문장 주어의 직접성
  chosen_reading: 문장은 하나님께 직접 말하는 형식으로, ‘당신의 손으로’가 실제 신적 개입을 뜻하도록 유지했습니다.
  alternative_readings:
  - ‘당신이 직접’으로 완화하는 읽기
  - 일반적 처벌로 중화하는 읽기
  rationale: 본문의 수사적 긴장은 하나님이 백성을 직접 징계하신다는 점에 있으므로, 이를 완화하지 않고 원문의 직접성을 살렸습니다.
  doctrine_reference: 신적 심판과 징계의 직접성
