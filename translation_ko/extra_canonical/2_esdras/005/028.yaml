  text: et nunc Domine, ut quid tradidisti unum plurimiset praeparasti unam radicem super alias et dispersisti unicum tuum in multis?
  language: Latin
base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_esdras/005/028.yaml
  text: And now[a], Lord, why have you handed over the one to the many, and prepared one root above the others, and scattered your only one among the many?
  footnotes:
  - marker: a
    text: Or 'And those who opposed your promises have trampled those who believed your covenants.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 주님, 어찌하여 하나를 많은 이들에게 넘기시고, 한 뿌리를 다른 것들 위에 마련하시고, 당신의 유일한 것을 많은 이들 가운데 흩으셨습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 이전 번역은 ‘왜 당신의 언약들을 믿는 이들을 짓밟도록 내버려 두셨습니까?’였습니다. 이는 이 절의 다른 본문 번역이 아니라, 절 번호가 한 절 어긋난 이전 번역입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ut quid tradidisti unum plurimis
  english_pob_choice: why have you handed over the one to the many
  chosen_korean: 어찌하여 한 사람을 많은 사람에게 내주셨으며
  alternatives_korean:
  - 왜 한 분을 많은 자들에게 넘기셨으며
  - 어찌하여 하나를 많은 것들에게 넘기셨으며
  lexicon: tradidisti → 내주다; unum → 한 사람; plurimis → 많은 사람에게
  rationale: 라틴어 tradidisti는 단순한 ‘넘기다’보다 책임 있게 넘겨 맡기거나 내어주는 뉘앙스를 가지므로 ‘내주셨으며’로 옮기고, unum/plurimis는 문맥상 개체와 다수의 대비를 살려 ‘한 사람/많은 사람에게’로 번역했습니다.
- source_word: unam radicem super alias
  english_pob_choice: one root above the others
  chosen_korean: 한 뿌리를 다른 것들보다 높이 두셨으며
  alternatives_korean:
  - 한 뿌리를 다른 것들 위에 두셨으며
  - 다른 것들보다 한 뿌리를 높이 세우셨으며
  lexicon: unam radicem → 한 뿌리; super alias → 다른 것들보다 위에
  rationale: radix는 문자 그대로 ‘뿌리’이므로 이를 유지하고, super alias는 단순 위치뿐 아니라 우월/우선의 대비를 담아 ‘다른 것들보다 높이’로 자연스럽게 풀었습니다.
- source_word: dispersisti unicum tuum in multis
  english_pob_choice: scattered your only one among the many
  chosen_korean: 당신의 한 사람을 많은 사람들 가운데 흩으셨습니까
  alternatives_korean:
  - 당신의 외아들을 많은 사람들 가운데 흩으셨습니까
  - 당신의 유일한 이를 많은 이들 가운데 흩으셨습니까
  lexicon: unicum tuum → 당신의 한 사람/유일한 이; dispersisti → 흩으셨습니까
  rationale: unicum은 ‘유일한’의 강한 의미를 가지지만, 본절 전체가 수사적 탄식이므로 과도한 신학적 고정어를 피하고 ‘한 사람’으로 앞절의 대비를 유지했습니다. dispersisti는 ‘흩다/분산시키다’의 의미를 살려 수동적 분산이 아니라 능동적 흩으심으로 옮겼습니다.
theological_decisions:
- issue: ‘one / root / only one’의 수사적 병렬
  chosen_reading: 본문의 세 표현을 각각 ‘한 사람 / 한 뿌리 / 당신의 한 사람’으로 분리해, 동일 인물을 가리키는 상징적 병렬로 유지했습니다.
  alternative_readings:
  - 모두를 ‘한 분’으로 통일하는 해석
  - ‘외아들’로 기독론적으로 정리하는 해석
  rationale: 라틴어는 인칭·은유를 교차시키며 탄식의 긴장을 만들므로, 이를 한 가지 교리 용어로 평평하게 만들지 않고 원문의 수사적 흐름을 살리는 편이 더 충실합니다.
  doctrine_reference: 문학적-수사적 평행 구조
