  text: And he said to me, 'Count for me those who have not yet come, and gather for me the scattered drops, and
translation:
  language: ko
  text: 그가 제게 말씀하셨습니다. 「나를 위해 아직 오지 않은 이들을 세어 보고, 나를 위해 흩어진 물방울들을 모으고,」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: numera mihi qui necdum uenerunt
  english_pob_choice: Count for me those who have not yet come
  chosen_korean: 나를 위해 아직 오지 않은 이들을 세어 보고
  alternatives_korean:
  - 아직 오지 않은 이들을 내게 세어 드리고
  - 아직 오지 않은 자들을 계산하여 내게 보여 주고
  lexicon: numera / necdum uenerunt
  rationale: numera는 단순한 산술 계산보다 ‘세어 보다’가 자연스럽고, mihi는 요청의 방향을 살려 ‘나를 위해’로 옮겼습니다. necdum uenerunt는 ‘아직 오지 않은’으로 직접 반영했습니다.
- source_word: collige mihi dispersas guttas
  english_pob_choice: gather for me the scattered drops
  chosen_korean: 나를 위해 흩어진 물방울들을 모으고
  alternatives_korean:
  - 나를 위해 흩어진 방울들을 거두고
  - 나를 위해 흩어진 이슬방울들을 모으고
  lexicon: collige / dispersas guttas
  rationale: collige는 ‘모으고’로 옮겨 수집·집결의 동작을 살렸고, guttas는 문자적으로 ‘물방울들’로 번역해 이미지의 낯섦을 보존했습니다.
theological_decisions:
- issue: 원문에 있는 이미지의 비유성을 얼마나 풀어 설명할지
  chosen_reading: 문자적 이미지인 ‘흩어진 물방울들’을 그대로 유지했습니다.
  alternative_readings:
  - ‘흩어진 자들’처럼 해석적으로 풀어 옮김
  - 상징적 의미를 각주로만 설명
  rationale: 라틴어는 물방울의 이미지 자체를 제시하므로, 해석을 앞세우기보다 독자가 원문의 기이함과 상징성을 그대로 느끼도록 두는 것이 본문 충실도에 더 가깝습니다.
  doctrine_reference: 본문의 문학적 이미지 보존 원칙
