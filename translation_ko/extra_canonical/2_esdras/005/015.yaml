  yaml_path: translation/extra_canonical/2_esdras/005/015.yaml
  text: it labored to the point of failing. And the angel who had come, who was speaking in me, took hold of me and strengthened me and set me on my feet.
translation:
  language: ko
  text: 그것은 쓰러질 정도로 수고하였습니다. 그리고 와서 내 안에서 말씀하던 천사가 나를 붙들고 힘을 주며 내 발로 세웠습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 Latin의 in me는 영어 POB의 ‘in me’를 따르는 내면적/내재적 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: laborauit, ut deficeret
  english_pob_choice: it labored to the point of failing
  chosen_korean: 그것은 쓰러질 정도로 수고하였습니다
  alternatives_korean:
  - 기진맥진할 정도로 애썼습니다
  - 쓰러질 지경까지 수고하였습니다
  lexicon: laborare / deficere
  rationale: lat. laborauit, ut deficeret의 ‘노력하다/수고하다’와 ‘힘이 빠져 쓰러지다’의 긴장을 살려, 원문의 상태를 과도하게 심리화하지 않고 결과 중심으로 옮겼습니다.
- source_word: qui loquebatur in me
  english_pob_choice: who was speaking in me
  chosen_korean: 내 안에서 말씀하던
  alternatives_korean:
  - 내 안에서 말하던
  - 내 안에 계셔서 말씀하시던
  lexicon: loqui + in + me
  rationale: in me를 단순한 ‘with me’가 아니라 내면적 작용으로 반영하되, 한국어에서는 자연스럽게 ‘내 안에서’로 처리했습니다.
- source_word: angelus
  english_pob_choice: the angel
  chosen_korean: 천사
  alternatives_korean:
  - 사자
  - 천사들
  lexicon: angelus
  rationale: 원문이 단수의 천사를 가리키므로 표준적인 ‘천사’를 사용했습니다.
- source_word: statuit me super pedes
  english_pob_choice: set me on my feet
  chosen_korean: 내 발로 세웠습니다
  alternatives_korean:
  - 제 발로 서게 했습니다
  - 다시 일으켜 세웠습니다
  lexicon: statuere + super pedes
  rationale: 직역의 생경함을 피하면서도 ‘세우다’의 동작과 회복의 이미지를 모두 살렸습니다.
theological_decisions:
- issue: loquebatur in me의 내적 발화 방식
  chosen_reading: ‘내 안에서 말씀하던’으로, 천사가 외부에서만 대화한 것이 아니라 내면적으로 전달하고 있었음을 드러냈습니다.
  alternative_readings:
  - ‘나에게 말하던’으로 평이하게 처리
  - ‘내 속에서 말하던’으로 더 직설적으로 처리
  rationale: 문맥상 환시적 체험의 내면성을 유지하는 것이 중요하므로, 관계를 약화시키는 외향적 번역보다 원문의 긴장을 보존했습니다.
  doctrine_reference: 환시/계시 서술의 서사적 내재화
- issue: laborauit, ut deficeret의 강도
  chosen_reading: ‘쓰러질 정도로 수고하였습니다’로, 단순 피로가 아니라 무너질 경계에 이른 상태를 나타냈습니다.
  alternative_readings:
  - ‘지칠 대로 지쳤습니다’
  - ‘망할 정도로 힘들었습니다’
  rationale: 원문은 심리적 낙담보다 기능 상실에 가까운 소진을 말하므로, 과도한 정서 해석을 피하고 상태의 임계점을 보존했습니다.
  doctrine_reference: 서사적 묘사 보존
