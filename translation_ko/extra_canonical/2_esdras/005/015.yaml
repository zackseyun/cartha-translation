revisions:
- from: 그것은 쓰러질 정도로 수고하였습니다. 그리고 와서 내 안에서 말씀하던 천사가 나를 붙들고 힘을 주며 내 발로 세웠습니다.[a]
  to: 그것은 기진할 지경까지 애썼습니다. 그리고 와 있던, 내 안에서 말하던[a] 천사가 나를 붙들고, 힘을 주고, 내 발로 서게 하였습니다.
  rationale: 주어의 선행 내용을 보충하지 않은 채 laborauit, ut deficeret의 소진을 자연스러운 한국어로 옮겼습니다. in me의 이례적 표현은 본문에서 보존하되, ‘내면성’이라는 특정 해석을 각주에서 단정하지 않았습니다. 또한 천사의 발화에는 일반 동사 ‘말하다’를 사용하고, 세 완료 동사를 병렬적으로 번역했습니다.
