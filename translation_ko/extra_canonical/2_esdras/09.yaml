theological_decisions:
- issue: 9:7의 works and faith
  chosen_reading: 행위와 믿음을 둘 다 유지하여, ‘자기 행위로든 혹은 자기가 믿은 그 믿음으로든’이라고 옮겼습니다.
  alternative_readings:
  - 행위든 믿음이든
  - 행위와 믿음 가운데 하나
  rationale: 라틴은 두 범주를 병렬로 제시하므로, 후대 신학 체계로 조화시키지 않고 본문의 긴장을 보존했습니다.
  doctrine_reference: 'Translation philosophy: source-weighted, tension-preserving rendering'
- issue: 9:9-12의 심판 언어
  chosen_reading: 죽은 뒤에도 ‘고통 가운데서 그것을 알아야 합니다’라고 직설적으로 옮겼습니다.
  alternative_readings:
  - 사후에 벌을 알게 됩니다
  - 죽은 후 형벌로 알게 됩니다
  rationale: 본문의 경고성을 약화시키지 않도록, 사후 형벌과 인식의 결합을 분명히 유지했습니다.
  doctrine_reference: Preserving hard eschatological edges in apocalyptic text
- issue: 9:45의 Deus / Fortem
  chosen_reading: Deus는 ‘하나님’, Fortem은 ‘전능하신 분’으로 구분했습니다.
  alternative_readings:
  - 둘 다 하나님
  - 둘 다 능하신 분
  rationale: 라틴이 서로 다른 신칭을 쓰므로 한국어도 동일화하지 않고, 문맥상 고유한 찬양 어감을 반영했습니다.
  doctrine_reference: Consistency of divine titles across the chapter
