    75 내 택한 자들아, 들으십시오. 주께서 말씀하십니다. 보십시오, 환난의 날들이 가까이 왔으니, 내가 그들로부터 여러분을 건져 내겠습니다.


    76 두려워하지도 말고 의심하지도 마십시오. 하나님이 여러분의 인도자이시기 때문입니다.


    77 그리고 내 계명들과 내 규례들을 지키는 여러분은, 주 하나님께서 말씀하십니다. 여러분의 죄가 여러분을 짓누르게 하지 말고, 여러분의 불의가 여러분을 이기게 하지 마십시오.


    78 자기 죄에 단단히 묶이고 자기 불의에 덮인 자들에게 화가 있습니다. 마치 밭이 숲에 둘러싸이고 그 씨앗이 가시덤불에 덮여 아무도 지나갈 수 없게 되는 것처럼, 그것은 막혀서 불에 삼켜질 것입니다.[a][b][c][d]'
