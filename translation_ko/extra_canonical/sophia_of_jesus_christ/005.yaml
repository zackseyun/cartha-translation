translation:
  language: ko
  text: '## 불멸의 인간과 소피아와 오그도아드


    마태가 그분께 물었습니다. “주님, 구원자시여, 인간[a]은 어떻게 나타났습니까?”


    완전한 구원자께서 말씀하셨습니다. “나는 그대들이 세상보다 먼저 나타난 이를 알기 바랍니다.


    “태초에, 빛나며 말로 표현할 수 없는 빛으로 충만한, 무한하고 스스로 자라났으며 [본문 훼손][b] 스스로 이루어진 아버지께서 자신의 형상이 큰 능력이 되기를 택하셨을 때, 그 빛의 근원 원리가 갑자기 죽지 않는 양성적 인간[c]으로 나타났습니다. 이는 그들이 그 불멸의 인간을 통하여 구원을 얻고, 해석자로 파송된 이를 통하여 망각에서 깨어나게 하려는 것이었습니다. 그 해석자는 궁핍한 도둑들이 끝날 때까지[d] 그대들과 함께 거합니다. 그의 짝은 위대한 소피아입니다. 소피아는 처음 나타난 불멸의 인간에게서, 곧 신성과 왕권으로서, 스스로 생겨난 아버지에 의해 태초부터 그와 결합하도록 정해졌습니다. 이는 ‘인간’, ‘스스로 아버지인 이’라고 불리는 아버지께서 [본문 훼손][e] 이것을 나타내셨기 때문입니다. 그는 자신의 위엄을 위하여 ‘오그도아드’[f]라는 강력한 아이온[g]을 창조하셨고, 그에게 큰 권세를 주어 궁핍한 창조 세계까지 다스리게 하셨습니다.


    “그는 그 빛과 자신의 짝 소피아에게 속한 삼중의 남성 영으로부터, 섬기게 하려고 신들과 천사들과 <대천사들을>[h] 셀 수 없이 많이 창조하셨습니다. 이 하나님께서 신성과 왕권을 창조하셨으므로, 그는 ‘신들의 하나님’, ‘왕들의 왕’이라 불리셨습니다. 그 안에서 태초의 인간은 자신만의 정신과 생각을 지니고 있습니다. 그것들은 바로 생각, 숙고와 관조, 이성, [본문 훼손][i] 능력입니다. 존재하는 모든 속성은 완전하며 죽지 않습니다.


    “멸하여 없어지지 않는다는 점에서는 그들이 실제로 동등하지만, 능력에서는 차이가 있습니다. 그 차이는 아버지와 아들, <아들과>[j] 생각, 그리고 생각과 그 뒤에 남는 것 사이의 차이와 같습니다. 내가 앞서 말했듯이, 창조된 것들 가운데서는 모나드[k]가 먼저입니다. 그리고 다른 모든 것 뒤에 나타난 것은 무엇이든 그의 능력에서 계시되었습니다. 창조된 것들에서 만들어진 모든 것이 나타났고, 만들어진 것에서 형태를 갖춘 것이 나타났으며, 형태를 갖춘 것에서 이름 붙여진 것이 나타났습니다. 이와 같이 처음부터 끝까지 태어나지 않은 이들 사이에 차이가 생겨났습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘인간’은 인류 일반만이 아니라 우주론적 존재의 칭호로 사용됩니다.
    reason: 한국어에는 영어의 대문자 표기로 특수 명칭을 표시하는 방식이 없으므로 용법을 설명합니다.
  - marker: b
    text: 이 지점의 원문은 훼손되어 있습니다.
    reason: 증언의 대괄호가 나타내는 본문 결락을 보존합니다.
  - marker: c
    text: ‘양성적’은 남성과 여성의 성격을 함께 지녔다는 뜻입니다.
    reason: 고대 우주론적 표현이 현대 독자에게 오해되지 않도록 설명합니다.
  - marker: d
    text: ‘궁핍한 도둑들이 끝날 때까지’라는 구절은 뜻과 문법 관계가 불분명합니다.
    reason: 난해한 원 증언을 임의로 평탄화하지 않았음을 알립니다.
  - marker: e
    text: 이 지점의 원문은 훼손되어 있습니다.
    reason: 증언의 대괄호가 나타내는 본문 결락을 보존합니다.
  - marker: f
    text: ‘오그도아드’는 문자적으로 여덟 또는 여덟째 영역과 관련된 명칭입니다.
    reason: 음역된 우주론적 고유 명칭의 기본 의미를 제공합니다.
  - marker: g
    text: ‘아이온’은 ‘시대’를 뜻할 수도 있으나, 이 문맥에서는 신적·우주론적 실재를 가리킵니다.
    reason: 다의적인 고대 종교 용어를 한 의미로 과도하게 축소하지 않습니다.
  - marker: h
    text: 꺾쇠괄호 안의 ‘대천사들을’은 편집자가 보충한 말입니다.
    reason: 영어 증언의 편집상 복원 표시를 보존합니다.
  - marker: i
    text: 이 지점의 원문은 훼손되어 있습니다.
    reason: 증언의 대괄호가 나타내는 본문 결락을 보존합니다.
  - marker: j
    text: 꺾쇠괄호 안의 ‘아들과’는 편집자가 보충한 말입니다.
    reason: 영어 증언의 편집상 복원 표시를 보존합니다.
  - marker: k
    text: ‘모나드’는 ‘하나’ 또는 ‘단일체’를 뜻하며, 여기서는 최초의 단일 원리를 가리키는 우주론적 용어입니다.
    reason: 전문 용어를 음역하면서 독자가 문맥상 의미를 파악하도록 돕습니다.
lexical_decisions:
- source_word: Human
  choice: 인간
  rationale: 본문에서 우주론적·원형적 존재를 가리키는 칭호로 쓰이지만, 한국어에 문법적 대문자 구별이 없으므로 ‘인간’으로 옮기고 각주에서 특수 용법을 밝혔습니다.
- source_word: androgynous
  choice: 양성적
  rationale: 남성과 여성의 성격을 함께 지닌 존재라는 뜻을 간결하게 보존하며, 현대 한국어에서 불필요하게 생물학적 세부로 한정하지 않습니다.
- source_word: Sophia
  choice: 소피아
  rationale: 여기서는 일반 명사 ‘지혜’이면서 인격적 존재의 고유 명칭으로 기능하므로 음역하여 그 긴장을 보존했습니다.
- source_word: aeon
  choice: 아이온
  rationale: 단순한 ‘시대’가 아니라 우주론적 실재를 가리킬 가능성이 크므로 전문 용어를 음역하고 각주로 설명했습니다.
- source_word: Ogdoad
  choice: 오그도아드
  rationale: ‘여덟/여덟째 영역’과 관련된 고유 명칭이므로 의미를 단정하여 풀어 쓰지 않고 음역했습니다.
- source_word: monad
  choice: 모나드
  rationale: 우주론적 최초의 단일 원리를 가리키는 기술적 용어이므로 ‘단일체’로 해석을 고정하지 않고 음역했습니다.
- source_word: self-grown / self-made / self-begotten / Self-Father
  choice: 스스로 자라난 / 스스로 이루어진 / 스스로 생겨난 / 스스로 아버지인 이
  rationale: 서로 연관되지만 동일하지 않은 자기 기원 표현들의 어휘적 차이를 가능한 한 유지했습니다.
- source_word: impoverished thieves / impoverished creation
  choice: 궁핍한 도둑들 / 궁핍한 창조 세계
  rationale: 난해한 수식 관계를 신학적으로 교정하지 않고 증언 본문의 의미와 반복을 보존했습니다.
theological_decisions:
- issue: ‘인간’의 정체
  choice: 우주론적 칭호로 읽히도록 문맥과 각주를 제공하되 특정 전통의 교리적 인물과 동일시하지 않음
  alternative: 아담, 원인간, 하늘 인간 등으로 해석하여 번역
  rationale: 본문 자체가 ‘인간’, ‘불멸의 인간’, ‘태초의 인간’을 사용하므로 그 명칭과 내적 긴장을 보존했습니다.
- issue: 대명사와 창조 주체의 모호성
  choice: 가능한 곳에서 원 증언의 ‘그/그들이’를 유지함
  alternative: 아버지, 불멸의 인간, 하나님 등 특정 주체를 반복 삽입
  rationale: 복잡한 문장 속 지시 대상이 불확실하므로 번역자가 임의로 신학적 위계를 확정하지 않았습니다.
- issue: 소피아의 기원과 결합을 설명하는 난해한 구문
  choice: ‘처음 나타난 불멸의 인간에게서’라는 수식 관계를 유지함
  alternative: 소피아가 불멸의 인간에게서 나왔다거나 아버지에게서 나왔다고 명확히 재구성
  rationale: 현존 영어 증언의 구문 자체가 불안정하며 직접 콥트어 검토가 남아 있으므로 모호성을 보존했습니다.
- issue: 멸하지 않는 존재들의 동등성과 능력의 차이
  choice: 동등성과 위계적 차이를 모두 그대로 진술함
  alternative: 본질적 동등 또는 종속 가운데 하나를 강조
  rationale: 본문이 두 명제를 긴장 속에 함께 제시하므로 어느 한쪽으로 조화시키지 않았습니다.
- issue: ‘창조된 것들’과 ‘태어나지 않은 이들’의 관계
  choice: 마지막의 역설적으로 보이는 표현을 그대로 유지함
  alternative: ‘태어난 이들’로 교정하여 논리적 일관성을 확보
  rationale: 원 증언이 가진 신학적·본문 비평적 난점을 번역에서 조용히 제거하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 문장은 일반 독자가 따라갈 수 있도록 나누되, 원 증언의 복잡한 우주론적 계열과 대명사 모호성은 유지했습니다. 현재 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 나그함마디 문서 III,4와 베를린 코덱스 8502,3의 콥트어 본문에 대한 직접 검토가 필요합니다. 대괄호로 표시된 훼손과 꺾쇠괄호로 표시된 편집상 보충을 본문과 각주에 명시했습니다.
