  revised_text: '## 불멸의 인간과 소피아와 오그도아드


    마태가 그분께 물었습니다. “주님, 구원자시여, 인간[a]은 어떻게 나타났습니까?”


    완전한 구원자께서 말씀하셨습니다. “나는 그대들이 세상보다 먼저 나타난 이를 알기를 바랍니다.


    “태초에, 빛나며 말로 표현할 수 없는 빛으로 충만한, 무한하고 스스로 자라났으며 [본문 훼손][b] 스스로 이루어진 아버지께서 자신의 형상이 큰 능력이 되기를 택하셨을 때, 그 빛의 근원 원리가 갑자기 죽지 않는 양성적 인간[c]으로 나타났습니다. 이는 그들이 그 불멸의 인간을 통하여 구원을 얻고, 해석자로 파송된 이를 통하여 망각에서 깨어나게 하려는 것이었습니다. 그 해석자는 궁핍한 도둑들이 끝날 때까지[d] 그대들과 함께 거합니다. 그의 짝은 위대한 소피아입니다. 소피아는 그 안에서, 처음 나타난 불멸의 인간에게서, 곧 신성과 왕권으로서, 스스로 생겨난 아버지에 의해 태초부터 결합을 위하여 정해졌습니다. 이는 ‘인간’, ‘스스로 아버지인 이’라고 불리는 아버지께서 [본문 훼손][e] 이것을 나타내셨기 때문입니다. 그는 자신의 위엄을 위하여 ‘오그도아드’[f]라는 강력한 아이온[g]을 창조하셨고, 그에게 큰 권세를 주어 궁핍한 창조 세계까지 다스리게 하셨습니다.


    “그는 그 빛과 자신의 짝 소피아에게 속한 삼중의 남성 영으로부터, 섬기게 하려고 신들과 천사들과 <대천사들을>[h] 셀 수 없이 많이 창조하셨습니다. 이는 이 하나님께서 신성과 왕권을 창조하셨기 때문이며, 그리하여 그는 ‘신들의 하나님’, ‘왕들의 왕’이라 불리셨습니다. 그 안에서 태초의 인간은 자신만의 정신과 생각을 지니고 있습니다. 그것들은 바로 (생각), 숙고와 관조, 이성, [본문 훼손][i] 능력입니다. 존재하는 모든 속성은 완전하며 죽지 않습니다.


    “멸하여 없어지지 않는다는 점에서는 그들이 실제로 동등하지만, 능력에서는 차이가 있습니다. 그 차이는 아버지와 아들, <아들과>[j] 생각, 그리고 생각과 그 뒤에 남는 것 사이의 차이와 같습니다. 내가 앞서 말했듯이, 창조된 것들 가운데서는 모나드[k]가 먼저입니다. 그리고 다른 모든 것 뒤에 나타난 것은 무엇이든 그의 능력에서 계시되었습니다. 창조된 것들에서 만들어진 모든 것이 나타났고, 만들어진 것에서 형태를 갖춘 것이 나타났으며, 형태를 갖춘 것에서 이름 붙여진 것이 나타났습니다. 이와 같이 처음부터 끝까지 태어나지 않은 이들 사이에 차이가 생겨났습니다.”'
