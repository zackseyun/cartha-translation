  revised_text: '그분께서 죽은 이들 가운데서 살아나신 뒤, 그분의 열두 제자와 일곱 여인은 계속 그분을 따르며 갈릴리로 가서 ‘거두는 곳과 기쁨’이라 불리는 산 […]에 이르렀습니다.[a] 그들이 한자리에 모였을 때, 그들은 세계의 근본 본성, 그 계획, 신적 섭리, 권세자들의 능력, 그리고 신적 계획의 신비 안에서 구원자께서 그들과 어떻게 관계하시는지를 두고 의문에 잠겼습니다. 구원자께서는 이전의 보이는 모습으로가 아니라 보이지 않는 영으로 나타나셨습니다. 그분의 형상은 키가 크고 빛나는 천사의 형상과 같았습니다. 그러나 그분이 어떤 모습과 같은지는 제가 묘사해서는 안 됩니다. 어떤 죽을 존재도 그것을 감당할 수 없기 때문입니다. 그 모습은 전적으로 순수하고 완전한 육체였으며, 그분께서 갈릴리의 ‘올리브의 산’이라 불리는 산에서 우리에게 가르쳐 주신 바와 같았습니다.[b]


    그분께서 말씀하셨습니다. “평안이 여러분과 함께하기를 바랍니다! 내 평안을 여러분에게 줍니다!” 그러자 그들은 모두 두려움에 사로잡혀 경외하였습니다.


    구원자께서는 […] 웃으시며 그들에게 물으셨습니다.[c] “무엇을 깊이 생각하고 있습니까? 어찌하여 의문에 잠겨 있습니까? 무엇을 찾고 있습니까?”


    빌립이 말했습니다. “세계의 근본 본성과 그 계획을 찾고 있습니다.”


    구원자께서 그들에게 말씀하셨습니다. “여러분이 이것을 깨닫기를 원합니다. 세상의 기초가 놓인 때부터 지금까지 땅에서 태어난 모든 사람은 흙으로 된 존재입니다. 그들은 하나님과 그분의 존재와 형상을 탐구했지만 그분을 찾아내지 못했습니다. 그들 가운데 가장 뛰어난 현자들은 세계가 질서를 이루는 방식과 움직여 가는 방식을 근거로 추측했지만, 그들의 추측은 진리에 이르지 못했습니다.


    “모든 철학자는 우주의 질서가 서로 다른 세 가지 방식으로 이끌린다고 말합니다. 그러므로 그들은 서로 의견이 다릅니다. 어떤 이들은 세계가 스스로를 이끈다고 주장합니다. […] 다른 이들은 섭리가 그렇게 한다고 주장하고, 또 다른 이들은 운명이 그렇게 한다고 주장합니다. 그러나 이 가운데 어느 것도 사실이 아닙니다.[d]


    “다시 말하지만, 내가 방금 말한 세 가지 주장은 모두 인간의 추측이므로 진리에 가까이 가지 못합니다. 그러나 나는 무한한 빛에서 나왔습니다. 나는 그분을 알며, 진리가 무엇인지 여러분에게 정확히 알려 주려고 여기에 왔습니다. 스스로 생겨난 것은 스스로 만들어진 것이므로 그 생명은 불결합니다. 섭리라는 이론에는 지혜로운 것이 없고, 운명이라는 이론에도 통찰이 없습니다.[e]


    “그러나 여러분에게는 아는 것이 허락되었습니다. 지식을 받을 자격이 있는 다른 누구든 그것을 받을 것입니다. 곧 불결한 마찰로 씨를 뿌려 생겨난 이가 아니라, 처음으로 보내심을 받은 이를 통해 태어난 사람입니다. 그분은 죽을 자들 가운데 있는 불멸자이기 때문입니다.”[f]'
