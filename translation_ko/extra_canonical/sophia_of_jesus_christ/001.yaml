translation:
  language: ko
  text: '그분이 죽은 이들 가운데서 살아나신 뒤, 열두 제자와 일곱 여인은 계속 그분을 따르며 갈릴리로 가서 ‘거두는 곳과 기쁨’이라 불리는 산 […]에 이르렀습니다.[a] 그들은 한자리에 모였을 때, 세계의 근본 본성, 그 계획, 신적 섭리, 권세자들의 능력, 그리고 신적 계획의 신비 안에서 구원자가 그들과 어떻게 관계하시는지를 두고 의문에 잠겼습니다. 구원자께서는 이전의 보이는 모습으로가 아니라 보이지 않는 영으로 나타나셨습니다. 그분의 형상은 키가 크고 빛나는 천사의 형상과 같았습니다. 그러나 그분이 무엇과 같은지는 제가 묘사해서는 안 됩니다. 어떤 죽을 존재도 그것을 감당할 수 없기 때문입니다. 그것은 전적으로 순수하고 완전한 육체로서, 그분이 갈릴리의 ‘올리브의 산’이라 불리는 산에서 우리에게 가르쳐 주신 것과 같았습니다.[b]


    그분이 말씀하셨습니다. “평안이 여러분과 함께하기를 바랍니다! 내 평안을 여러분에게 줍니다!” 그러자 그들은 모두 두려움에 사로잡혀 경외하였습니다.


    구원자께서는 […] 웃으시며 그들에게 물으셨습니다.[c] “무엇을 깊이 생각하고 있습니까? 어찌하여 의문에 잠겨 있습니까? 무엇을 찾고 있습니까?”


    빌립이 말했습니다. “세계의 근본 본성과 그 계획을 찾고 있습니다.”


    구원자께서 그들에게 말씀하셨습니다. “여러분이 이것을 깨닫기 바랍니다. 세상의 기초가 놓인 때부터 지금까지 땅에서 태어난 모든 사람은 흙으로 된 존재입니다. 그들은 하나님과 그분의 존재와 형상을 탐구했지만 그분을 찾아내지 못했습니다. 그들 가운데 가장 뛰어난 현자들은 세계가 질서를 이루는 방식과 움직여 가는 방식을 근거로 추측했지만, 그들의 추측은 진리에 이르지 못했습니다.


    “모든 철학자는 우주의 질서가 서로 다른 세 가지 방식 가운데 하나로 이끌린다고 말합니다. 그러므로 그들은 서로 의견이 다릅니다. 어떤 이들은 세계가 스스로를 이끈다고 주장합니다. […] 다른 이들은 섭리가 그렇게 한다고 주장하고, 또 다른 이들은 운명이 그렇게 한다고 주장합니다. 그러나 이 가운데 어느 것도 사실이 아닙니다.[d]


    “다시 말하지만, 내가 방금 말한 세 가지 주장은 모두 인간의 추측이므로 진리에 가까이 가지 못합니다. 그러나 나는 무한한 빛에서 나왔습니다. 나는 그분을 알며, 진리가 무엇인지 여러분에게 정확히 알려 주려고 여기에 왔습니다. 스스로 생겨난 것은 스스로 만들어진 것이므로 그 생명은 불결합니다. 섭리라는 이론에는 지혜로운 것이 없고, 운명이라는 이론에도 통찰이 없습니다.[e]


    “그러나 여러분에게는 아는 것이 허락되었습니다. 지식을 받을 자격이 있는 다른 누구든 그것을 받을 것입니다. 곧 불결한 마찰로 씨를 뿌려 생겨난 이가 아니라, 처음으로 보내심을 받은 이를 통해 태어난 사람입니다. 그분은 죽을 자들 가운데 있는 불멸자이기 때문입니다.”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호의 생략 부호는 이 지점의 사본 본문이 훼손되었거나 빠졌음을 나타냅니다. ‘거두는 곳과 기쁨’이라는 산 이름은 잠정 번역입니다.
    reason: 제공된 영어 증언의 본문 손상 표시와 특이한 지명을 독자에게 알리기 위함입니다.
  - marker: b
    text: ‘올리브의 산’은 문자적인 잠정 번역입니다. 널리 알려진 ‘감람산’과 같은 곳을 뜻하는지는 이 증언만으로 확정하기 어렵습니다.
    reason: 갈릴리라는 지리 표기와 전승상의 명칭 사이의 긴장을 임의로 바로잡지 않기 위함입니다.
  - marker: c
    text: 이 지점에도 사본의 결손 또는 복원 불확실성을 나타내는 표시가 있습니다.
    reason: 원문 증언의 결손 신호를 보존하기 위함입니다.
  - marker: d
    text: ‘세계가 스스로를 이끈다’, ‘섭리’, ‘운명’은 세계 질서의 원인을 설명하는 세 철학적 견해로 제시됩니다.
    reason: 세 항목의 논증 구조를 명료하게 하되 본문 밖의 교리를 덧붙이지 않기 위함입니다.
  - marker: e
    text: ‘스스로 생겨난 것’과 이어지는 섭리·운명 비판은 원문이 난해합니다. 문장 사이의 논리 관계를 보충하지 않고 옮겼습니다.
    reason: 불확실한 원문의 논리를 번역자가 임의로 체계화하지 않기 위함입니다.
  - marker: f
    text: ‘불결한 마찰’, ‘처음으로 보내심을 받은 이’, ‘불멸자’의 정확한 관계와 마지막 대명사의 지시 대상은 불확실합니다.
    reason: 성적·우주론적 은유와 대명사 지시의 진정한 모호성을 보존하기 위함입니다.
lexical_decisions:
- source_word: fundamental nature
  choice: 근본 본성
  rationale: 세계의 기원만이 아니라 본질적 성격까지 가리킬 수 있는 표현이므로 의미 범위를 좁히지 않았습니다.
- source_word: plan
  choice: 계획
  rationale: 문맥의 우주론적 배열이나 경륜을 포괄하되 특정 교단의 전문 용어로 고정하지 않았습니다.
- source_word: divine providence / providence
  choice: 신적 섭리 / 섭리
  rationale: 철학적 가설로 논의되는 ‘providence’를 한국어 독자에게 익숙하면서도 중립적인 말로 옮겼습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 인간 통치자와 초월적 세력을 모두 암시할 수 있는 복수 인격 명칭을 보존했습니다.
- source_word: invisible spirit
  choice: 보이지 않는 영
  rationale: ‘비가시적 영’보다 자연스러우면서 원문의 대조를 직접 보존합니다.
- source_word: likeness
  choice: 형상
  rationale: 외적 모습과 닮음을 함께 나타내되 ‘본체’로 과도하게 해석하지 않았습니다.
- source_word: Infinite Light
  choice: 무한한 빛
  rationale: 고유한 초월적 기원처럼 쓰이는 표현의 장엄함을 유지했습니다.
- source_word: impure rubbing
  choice: 불결한 마찰
  rationale: 성적 생식을 완곡하게 가리키는 듯한 난해한 은유를 설명적으로 풀지 않고 보존했습니다.
theological_decisions:
- issue: 구원자의 출현 양태
  choice: ‘이전의 보이는 모습’과 ‘보이지 않는 영’의 대조를 그대로 유지했습니다.
  alternative: 부활체 또는 환영으로 명시
  rationale: 본문은 출현의 존재론을 체계적으로 설명하지 않으므로 특정 기독론적 해석을 덧붙이지 않았습니다.
- issue: ‘순수하고 완전한 육체’와 ‘보이지 않는 영’의 긴장
  choice: 두 표현을 모두 문자적으로 보존했습니다.
  alternative: ‘영적 몸’처럼 조화시켜 번역
  rationale: 본문 자체의 역설적 긴장을 해소하지 않는 것이 원문 충실성에 맞습니다.
- issue: 세 가지 우주 통치 이론에 대한 부정
  choice: 자율적 세계, 섭리, 운명을 각각 철학적 주장으로 제시했습니다.
  alternative: 하나님의 섭리 일반을 부정하는 교리 진술로 확대
  rationale: 발화의 직접 대상은 당시 철학자들의 세 이론이므로 범위를 그 문맥에 한정했습니다.
- issue: ‘처음으로 보내심을 받은 이’의 정체
  choice: 대명사적 표현을 유지했습니다.
  alternative: 예수, 구원자, 특정 천상 존재로 명시
  rationale: 제공된 증거만으로 지시 대상을 확정할 수 없어 모호성을 보존했습니다.
- issue: 마지막 문장의 ‘그분’ 지시 대상
  choice: 남성 단수 지시의 모호성을 유지했습니다.
  alternative: ‘처음 보내심을 받은 이’ 또는 ‘그를 통해 태어난 사람’으로 확정
  rationale: 문법적·신학적 지시 관계가 번역 증거만으로 확실하지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 경전적 품위를 유지하되 지나치게 고어적인 어휘를 피했습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언에 근거한 잠정 초안이며, 사본 결손은 […]로 표시했습니다.
