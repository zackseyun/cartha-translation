  naturalness: 현대 표준 한국어 합쇼체로 자연스럽고, 직접 발화와 서술의 격조도 적절합니다. ‘모든 총체의 전체’와 ‘움직이지 않는 세대’는 다소 낯설지만, 이 문헌의 기술적·우주론적 어법을 보존하기 위한 선택으로 수용 가능합니다.
  terminology: ‘지성’, ‘무한자’, ‘존재하시는 영’, ‘스스로 난 하나님’, ‘썩지 않음’은 영어 증언의 용어 대비와 신학적 비결정성을 대체로 잘 보존합니다. ‘나지 않으신 아버지’도 unbegotten을 과도하게 교리화하지 않는 적절한 번역입니다.
  issues:
  - severity: medium
    issue: 빈 대괄호([]) 세 곳이 [a] 각주 표지로만 대체되어, 본문 자체의 결락·판독 불확실성 표지가 사라졌습니다.
    rationale: 제공된 증언은 해당 지점들을 명시적으로 []로 표시합니다. 각주 앵커를 유지하되 []도 본문에 남겨야 증언의 비평적 표기를 보존할 수 있습니다.
  - severity: medium
    issue: ‘having the power <of> a begetter’의 꺾쇠괄호 보충 표지가 번역에서 누락되었습니다.
    rationale: ‘낳는 이<의> 능력’처럼 한국어의 관계 표지에 꺾쇠괄호를 적용하면, 의미를 바꾸지 않으면서 영어 증언의 복원 신호를 보존할 수 있습니다.
