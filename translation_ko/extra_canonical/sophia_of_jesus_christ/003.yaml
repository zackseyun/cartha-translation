translation:
  language: ko
  text: '빌립이 물었습니다. “주님, 그렇다면 그는 완전한 이들에게 어떻게 나타났습니까?”


    완전한 구원자께서 그에게 말씀하셨습니다. “보이는 것은 무엇이든 보이게 되기 전에, 위엄과 권세가 그 안에 존재했습니다.[a] 그는 모든 총체의 전체를 품지만, 그를 품는 것은 아무것도 없기 때문입니다. 이는 그가 온전히 지성이며, 생각과 성찰과 숙고와 추론과 능력이기 때문입니다. 이들은 모두 동등한 능력들로서 모든 총체의 근원입니다. 그리고 그들의 온 계보는 처음부터 마지막까지, 무한하고 나지 않으신 아버지의 예지 안에 있습니다.”


    도마가 그에게 물었습니다. “주님, 구원자시여, 이것들이 생겨난 까닭은 무엇이며, 왜 드러났습니까?”


    완전한 구원자께서 말씀하셨습니다. “나는 여러분에게 모든 것을 알려 주려고 무한자에게서 나왔습니다. 존재하시는 영께서 낳으신 분이었습니다. 그분은 낳는 이의 능력과[a] 형상을 [부여하는] 이의 본성을 지니셨으니, 이는 그분 안에 감추어진 큰 부요가 드러나게 하려는 것이었습니다. 그분은 자비와 사랑 때문에 스스로 열매를 맺기를 바라셨습니다. 이는 그분 홀로 자기 선하심을 <누리려는> 것이 아니라, 움직이지 않는 세대의 다른 영들도 썩지 않음 가운데서 몸과 영, 영광과 존귀, 그리고 그분의 무한한 선물을 산출하게 하려는 것이었습니다. 그리하여 그분의 보물이 스스로 난 하나님, 곧 모든 썩지 않음과 그 뒤에 생겨날 이들의 아버지를 통하여 나타나게 하려는 것이었습니다. 그들은 아직 눈에 보이게 나타나지 않았습니다. 썩지 않는 이들 사이에는 큰 차이가 있습니다.”


    그분은 큰 소리로 외치셨습니다. “무한한 이들에 관하여 들을 귀가 있는 사람은 들으십시오!” 또 말씀하셨습니다. “나는 깨어 있는 이들에게 말했습니다!”


    그분은 계속해서[a] 말씀하셨습니다. “썩어 없어지는 것에서 생겨난 것은 모두 썩어 없어질 것입니다. 썩어 없어지는 것에서 생겨났기 때문입니다. 그러나 썩지 않는 것에서 생겨난 것은 썩어 없어지지 않고, 썩지 않을 것입니다.


    그러므로 많은 이가 이 차이를 알지 못하여 잘못에 빠졌고, 죽었습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 원문에는 결락 또는 판독 불확실성이 있습니다. 번역은 제공된 공개 영역 영어 증언을 잠정적으로 따랐습니다.
    reason: 빈 대괄호로 표시된 세 곳의 본문 손상 또는 불확실성을 독자에게 알리기 위해 같은 표지를 사용했습니다.
lexical_decisions:
- source_word: the Totalities
  choice: 모든 총체
  rationale: 이 문헌의 우주론적 복수 개념을 일반적인 ‘만물’로 평준화하지 않고, 다소 낯선 전문적 표현을 보존했습니다.
- source_word: mind
  choice: 지성
  rationale: 사유 능력과 원리를 함께 가리키는 문맥이므로 일상적 ‘마음’보다 ‘지성’을 택했습니다.
- source_word: unbegotten
  choice: 나지 않으신
  rationale: ‘창조되지 않은’으로 확대 해석하지 않고 출생·발생 부정의 의미를 직접 보존했습니다.
- source_word: the Infinite
  choice: 무한자
  rationale: 인격적 근원을 가리키는 명칭으로 쓰이므로 ‘무한’이라는 추상명사보다 ‘무한자’로 옮겼습니다.
- source_word: The Spirit Who Is
  choice: 존재하시는 영
  rationale: 존재를 강조하는 칭호의 성격을 살리면서 한국어로 자연스럽게 표현했습니다.
- source_word: unmoving generation
  choice: 움직이지 않는 세대
  rationale: ‘불변의 종족’ 등으로 교리적으로 해석하지 않고 원문의 공간적·상태적 표현과 집단 의미를 보존했습니다.
- source_word: self-begotten God
  choice: 스스로 난 하나님
  rationale: 발생 방식에 관한 고유한 표현을 ‘독생자’ 같은 익숙한 교리 용어로 대체하지 않았습니다.
- source_word: indestructability / imperishable
  choice: 썩지 않음 / 썩지 않는
  rationale: 명사와 형용사 형태를 구별하면서도 동일한 어근의 반복과 대조를 드러냈습니다.
theological_decisions:
- issue: ‘그’와 아버지 및 존재하시는 영의 관계
  choice: 원문의 대명사와 칭호를 유지하여 동일성 여부를 확정하지 않음
  alternative: 모든 대명사를 ‘아버지’로 명시
  rationale: 본문 자체의 지시 관계가 복합적이므로 번역에서 인물 관계를 단정하지 않았습니다.
- issue: 낳음과 형상 부여의 주체
  choice: ‘존재하시는 영’을 낳는 주체로 번역
  alternative: ‘존재하시는 영’이 태어난 대상으로 번역
  rationale: 제공된 증거의 문장 구조를 따르되, 원어 검토 전의 잠정성은 각주로 표시했습니다.
- issue: 썩지 않는 이들 사이의 ‘큰 차이’
  choice: 차이가 무엇인지 설명하지 않고 진술 그대로 보존
  alternative: 위계나 본질 차이로 구체화
  rationale: 본문이 차이의 성격을 명시하지 않으므로 신학적 체계를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 질문과 직접 발화는 자연스럽게 다듬되, 문헌의 반복과 낯선 우주론적 용어는 지나치게 평이화하지 않았습니다. 꺾쇠괄호와 대괄호는 증언 본문의 보충·복원 신호를 보존했습니다. 콥트어 직접 검토가 아직 이루어지지 않았으므로 본 번역은 제공된 공개 영역 영어 증언에 근거한 잠정 초안입니다.
