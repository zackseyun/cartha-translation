translation:
  language: ko
  text: '마리아가 그분께 물었습니다. “그러면 주님, 우리가 그것을 어떻게 알 수 있습니까?”


    완전한 구원자께서 말씀하셨습니다. “감추어진 것들에서 시작하여 보이는 것들의 끝에 이르십시오. 그러면 생각의 유출이, 태어나지 않으신 아버지께 속한 보이지 않는 것들에 대한 믿음을 어떻게 보이는 것들 안에서 찾을 수 있는지 여러분에게 친히 드러낼 것입니다.[a] 들을 귀가 있는 사람은 들으십시오!


    “세상의 주는 ‘아버지’라 불리지 않고 ‘선조’라 불립니다. <아버지는> 장차 보이게 될 것들의 근원이시기 때문입니다. 그러나 그분은 [] 시작이 없는 [그] 선조이십니다.[b] 그분은 거울을 보듯 자기 안에서 자신을 바라보시며, 자신의 형상 가운데 신적인 자아-아버지로 나타나셨고, <또한> 반영하는 자들 위에 계신 반영자, 곧 처음으로 존재한 분이며 태어나지 않으신 아버지로 나타나셨습니다.[c] 그분은 실로 자기 앞에 있는 빛과 <같은> 연대에 속하지만, 능력에서는 그 빛과 같지 않습니다.[d]


    “그 뒤에 그분은 영광 가운데 존재하는, 반영하며 스스로 태어난 많은 이들을 드러내셨습니다. 그들은 같은 연대와 같은 능력을 지녔으며, 참으로 셀 수 없이 많았습니다. 그들의 족속은 ‘그 위에 아무 왕국도 없는 세대’라고 불립니다. 여러분 자신도 이 <왕국들> 가운데 한 곳에서 보이게 되었습니다.[e] 그리고 그 위에 아무 왕국도 없는 그 온 무리는 [] ‘태어나지 않으신 아버지의 자녀들’, ‘하나님’, ‘[구원자]’, ‘하나님의 아들’이라 불리며, 그의 형상이 여러분과 함께 거합니다.[f]


    “그분은 알 수 없는 분이며, 온갖 소멸하지 않는 영광과 말로 다 할 수 없는 기쁨으로 충만하십니다. 그들은 모두 그분 안에서 안식하며, 결코 변하지 않는 그분의 영광과 헤아릴 수 없는 환희로 말미암아 말로 다 할 수 없는 기쁨 속에서 끊임없이 즐거워합니다. 지금까지 이것은 모든 아이온과 그 세계들 가운데서 한 번도 들리거나 알려진 적이 없습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘생각의 유출’은 ‘생각’이 흘러나오거나 발출한다는 표현입니다. 이 문장에서 ‘보이는 것들’과 ‘태어나지 않으신 아버지께 속한 것들’의 정확한 문법적 관계는 다소 모호합니다.
    reason: 추상적 전문 표현과 구문상의 진정한 모호성을 알립니다.
  - marker: b
    text: 빈 대괄호 []는 사본의 손상이나 판독할 수 없는 부분을 나타냅니다. 꺾쇠괄호 < > 안의 말은 문맥에 따라 보충된 말입니다.
    reason: 제공된 증언의 본문 비평 표지를 보존하고 설명합니다.
  - marker: c
    text: ‘자아-아버지’와 ‘반영자’는 이 문헌의 특수한 칭호입니다. ‘반영자’와 ‘반영하는 자들’은 앞의 거울 비유와 연결됩니다.
    reason: 낯선 합성 칭호와 어휘 반복을 설명합니다.
  - marker: d
    text: ‘그분’, ‘자기 앞에 있는 빛’, 그리고 앞서 언급된 칭호들이 정확히 누구를 가리키는지는 현존 문장만으로 확정하기 어렵습니다.
    reason: 대명사 지시와 존재론적 관계의 모호성을 보존합니다.
  - marker: e
    text: ‘세대’는 혈통 집단이나 동류의 무리를 뜻할 수 있습니다. ‘왕국들’은 증언에서 보충된 말입니다.
    reason: 핵심 표제의 의미 범위와 보충 상태를 밝힙니다.
  - marker: f
    text: ‘[구원자]’의 대괄호는 손상된 본문을 복원한 말임을 나타냅니다. 또한 한 ‘무리’에 ‘하나님’, ‘구원자’, ‘하나님의 아들’이라는 단수 칭호가 붙는 형태를 그대로 살렸습니다.
    reason: 복원 표지와 수의 불일치를 설명합니다.
lexical_decisions:
- source_word: Forefather
  choice: 선조
  rationale: ‘조상’보다 위계적·기원적 칭호의 느낌을 살리면서도, 본문의 ‘아버지’와 구별되는 자연스러운 현대 한국어 표현입니다.
- source_word: emanation of Thought
  choice: 생각의 유출
  rationale: 후기 고대 사상 문헌의 발출 개념을 섣불리 풀어 해석하지 않고, ‘Thought’의 인격화 가능성을 보존하기 위해 ‘생각’을 사용했습니다.
- source_word: unbegotten Father
  choice: 태어나지 않으신 아버지
  rationale: ‘unbegotten’의 존재론적 함의를 ‘창조되지 않은’으로 바꾸지 않고, 원문의 출생·발생 어휘를 직접 보존했습니다.
- source_word: Self-Father
  choice: 자아-아버지
  rationale: 특수한 신적 칭호임을 드러내고 ‘스스로 아버지가 된 분’ 등으로 의미를 확정하지 않기 위해 결합어 형태를 유지했습니다.
- source_word: reflector / reflecting ones
  choice: 반영자 / 반영하는 자들
  rationale: 거울 비유와 어근 반복을 살리며, ‘비추는 자’로 옮길 때 생길 수 있는 빛의 발산 의미와 구별했습니다.
- source_word: aeons
  choice: 아이온
  rationale: 시대·영원·초월적 존재 영역 가운데 어느 하나로 단정하지 않고 이 문헌의 전문적이고 다의적인 용법을 보존했습니다.
- source_word: Generation Above Which There Is No Kingdom
  choice: 그 위에 아무 왕국도 없는 세대
  rationale: 표제적 명칭의 역설적 구조와 kingdom의 반복을 보존했으며, ‘세대’는 혈통 집단과 시대라는 양면성을 남깁니다.
theological_decisions:
- issue: ‘Lord of the World’, ‘Father’, ‘Forefather’의 관계
  choice: 각 칭호를 구별하여 직역하고 동일 존재인지 별개 존재인지 확정하지 않았습니다.
  alternative: ‘세상의 주’가 곧 ‘태어나지 않으신 아버지’라고 명시적으로 연결할 수 있습니다.
  rationale: 현존 증언의 대명사와 손상된 구절이 관계를 불분명하게 하므로 본문의 긴장을 유지해야 합니다.
- issue: ‘he’와 ‘light’의 관계
  choice: ‘그분’과 ‘빛’을 서로 구별되는 지시 대상으로 유지했습니다.
  alternative: 빛을 그분의 자기 현현이나 상위 신적 존재로 해설할 수 있습니다.
  rationale: 본문은 연대와 능력을 비교하지만 정확한 존재론적 관계를 설명하지 않습니다.
- issue: 집합적 무리에 붙는 단수·복수 칭호
  choice: ‘하나님’, ‘구원자’, ‘하나님의 아들’이라는 단수 칭호를 그대로 보존했습니다.
  alternative: 문맥상 복수형 ‘신들’, ‘구원자들’, ‘하나님의 아들들’로 일치시킬 수 있습니다.
  rationale: 증언에 나타난 수의 긴장 자체가 본문 해석에 중요하므로 문법적으로 평준화하지 않았습니다.
- issue: ‘Unknowable’의 인식 가능성
  choice: ‘알 수 없는 분’으로 옮겼습니다.
  alternative: ‘불가지자’ 또는 ‘인식될 수 없는 분’으로 옮길 수 있습니다.
  rationale: 철학적 전문어를 과도하게 부과하지 않으면서 인식 불가능성의 진술을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 계시 문헌에 맞는 장중함을 유지했습니다. 직접 인용 속 명령은 존중 표현인 ‘-십시오’를 사용했습니다. 제공 자료가 영어 공공영역 증언이며 콥트어 원문 검토가 보류된 상태이므로, 번역은 잠정적입니다. 대괄호와 꺾쇠괄호는 증언의 손상·복원 표지로 보존했습니다.
