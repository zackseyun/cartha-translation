review_pass:
  verdict: revise
  source_fidelity: 영어 증언을 기준으로 전반적인 칭호, 반복, 사본 비평 표지, 그리고 존재론적 모호성을 대체로 충실히 보존했습니다. 다만 ‘태어나지 않으신 아버지께 속한’의 수식 범위를 ‘보이지 않는 것들’로 확정한 점과, ‘from the one’ 구절을 단순한 장소 진술로 바꾼 점은 증언의 구문 및 관계를 좁히거나 바꿉니다. 이를 수정했습니다. 콥트어 직접 검토가 보류되어 있으므로, 이 평가는 제공된 영어 증언에 대한 잠정 검토입니다.
  naturalness: 합쇼체와 인용문의 장중한 문체는 자연스럽습니다. ‘빛과 같은 연대에 속하다’는 한국어에서 다소 딱딱하고 뜻이 흐려질 수 있어 ‘빛만큼 오래되었다’로 다듬었습니다. ‘자기 안에서 자신을 바라보다’도 거울 비유의 구조가 드러나도록 조정했습니다.
  terminology: ‘선조’, ‘생각의 유출’, ‘태어나지 않으신 아버지’, ‘자아-아버지’, ‘반영자’, ‘아이온’은 증언의 특수 용어와 반복을 적절히 보존합니다. ‘최초의 존재자’는 first existent의 위상을 더 직접적으로 나타냅니다. 집합 명사에 붙은 단수 칭호와 [구원자]의 복원 표지는 유지했습니다.
  issues:
  - severity: medium
    issue: ‘things that belong to the unbegotten Father’의 수식 범위가 변경됨
    rationale: 초안은 ‘태어나지 않으신 아버지께 속한 보이지 않는 것들에 대한 믿음’으로 옮겨, 소유 관계를 ‘보이지 않는 것들’에 연결했습니다. 영어 증언의 어순상 이 말은 바로 앞의 ‘보이는 것들’을 동격적으로 설명할 가능성이 높으며, 적어도 원문의 모호성을 유지해야 합니다.
  - severity: high
    issue: ‘from the one in which you yourselves have become visible among these <kingdoms>’의 관계가 누락됨
    rationale: 초안의 ‘여러분 자신도 이 <왕국들> 가운데 한 곳에서 보이게 되었습니다’는 ‘from the one’이 나타내는 출처·소속 관계를 삭제하고 ‘왕국들 가운데 한 곳’을 임의로 보충합니다. 증언의 다소 어색한 관계절을 유지하면서, 그 족속에서 나왔다는 최소한의 관계를 번역해야 합니다.
  - severity: low
    issue: ‘as old as’의 표현이 부자연스럽고 의미가 흐려짐
    rationale: ‘같은 연대에 속하다’는 존재론적 또는 역사적 시대 소속처럼 읽힐 수 있습니다. 비교되는 오래됨을 직접 나타내는 표현이 더 자연스럽고 충실합니다.
  revised_text: '마리아가 그분께 물었습니다. “그러면 주님, 우리가 그것을 어떻게 알 수 있습니까?”


    완전한 구원자께서 말씀하셨습니다. “감추어진 것들에서 시작하여 보이는 것들의 끝에 이르십시오. 그러면 생각의 유출이, 태어나지 않으신 아버지께 속한 보이는 것들 안에서 보이지 않는 것들에 대한 믿음을 어떻게 찾을 수 있는지 여러분에게 친히 드러낼 것입니다.[a] 들을 귀가 있는 사람은 들으십시오!


    “세상의 주는 ‘아버지’라 불리지 않고 ‘선조’라 불립니다. <아버지는> 장차 보이게 될 것들의 근원이시기 때문입니다. 그러나 그분은 [] 시작이 없는 [그] 선조이십니다.[b] 그분은 거울 속에서처럼 자신 안에 있는 자신을 보십니다. 그분은 자신의 형상으로 신적인 자아-아버지로, <또한> 반영하는 자들 위에 계신 반영자로, 곧 최초의 존재자이며 태어나지 않으신 아버지로 나타나셨습니다.[c] 그분은 실로 자기 앞에 있는 빛만큼 오래되었으나, 능력에서는 그 빛과 같지 않습니다.[d]


    “그 뒤에 그분은 영광 가운데 존재하는, 반영하며 스스로 태어난 많은 이들을 드러내셨습니다. 그들은 같은 연대와 같은 능력을 지녔고, 그 수는 참으로 헤아릴 수 없습니다. 그들의 족속은 ‘그 위에 아무 왕국도 없는 세대’라고 불립니다. 여러분 자신도 이 <왕국들> 가운데서 보이게 된 바로 그 족속에서 나왔습니다.[e] 그리고 그 위에 아무 왕국도 없는 그 온 무리는 [] ‘태어나지 않으신 아버지의 자녀들’, ‘하나님’, ‘[구원자]’, ‘하나님의 아들’이라 불리며, 그 형상이 여러분과 함께 거합니다.[f]


    “그분은 알 수 없는 분이며, 온갖 소멸하지 않는 영광과 말로 다 할 수 없는 기쁨으로 충만하십니다. 그들은 모두 그분 안에서 안식하며, 결코 변하지 않는 그분의 영광과 헤아릴 수 없는 기쁨으로 말미암아 말로 다 할 수 없는 기쁨 속에서 끊임없이 즐거워합니다. 지금까지 이것은 모든 아이온과 그 세계들 가운데서 한 번도 들리거나 알려진 적이 없습니다.”'
