translation:
  language: ko
  text: '그때 바돌로매가 그분께 물었습니다. “복음서에서는 어떻게 <그분을> [본문 훼손] ‘인간’과 ‘인자’라고 부릅니까? 그렇다면 이 둘 가운데 어느 것이 아들에게 해당합니까?”[a]


    거룩하신 분이 그에게 말씀하셨습니다. “나는 그대가 이것을 알기 바랍니다. 태초의 인간은 ‘낳는 이’, ‘스스로 완성된 정신’이라고 불립니다. 그는 자신의 짝인 위대한 소피아와 함께 깊이 생각하여, 처음 난 아들, 곧 남성과 여성을 함께 지닌 아들을 나타냈습니다. 그 남성의 이름은 ‘처음 낳는 하나님의 아들’이라 불리고, 그 여성의 이름은 ‘처음 낳는 소피아, 우주의 어머니’이며, 어떤 이들은 그 여성을 ‘사랑’이라고 부릅니다.[b] ‘그리스도’라고 불리는 그 처음 난 이는 아버지에게서 권세를 받았으므로, 영과 빛으로부터 섬기게 할 수없이 많은 [본문 훼손] 천사들을 창조했습니다.”


    그분의 제자들이 말씀드렸습니다. “주님, ‘인간’이라고 불리는 이에 관해 저희에게 밝혀 주십시오. 그러면 저희도 그의 영광을 정확히 깨달을 수 있겠습니다.”


    완전한 구원자께서 말씀하셨습니다. “들을 귀가 있는 사람은 들으십시오! 처음 낳는 아버지는 찬란한 빛에서 비롯되었으므로 ‘아담, 빛의 눈’이라는 이름을 지닙니다. 그리고 말로 표현할 수 없고 그림자가 없는 그의 거룩한 천사들은 자기들의 아버지에게서 받은 형상들을 두고 끊임없이 기뻐하며 즐거워합니다. ‘하나님의 아들’이라고 불리는 인자의 온 나라는 말로 표현할 수 없고 그림자가 없는 기쁨, 결코 변하지 않는 환희로 가득합니다. 그들은 소멸하지 않는 그의 [본문 훼손] 영광을 두고 기뻐합니다. 이 영광은 그 뒤에 생겨난 아이온들과 그 세계들에서 지금까지 아무도 듣지 못했고 누구에게도 계시되지 않았습니다.[c] 나는 모든 것을 그대들에게 드러내려고, 스스로 생겨난 태초의 무한한 빛에서 비롯되었습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증언의 꺾쇠괄호는 필사본에서 보충된 말임을, 빈 대괄호는 본문 훼손이나 결락이 있음을 나타냅니다. 이 번역에서는 이를 각각 < >와 ‘[본문 훼손]’으로 표시했습니다.
    reason: 본문 상태와 편집상의 보충을 독자에게 투명하게 알리기 위해서입니다.
  - marker: b
    text: ‘처음 낳는’은 제공된 증언의 First-Begetting을 옮긴 말로, 앞의 ‘처음 난’(first-begotten)과 구별됩니다. 직접 콥트어 대조가 이루어지면 이 능동·수동 구별을 재검토해야 합니다.
    reason: 유사하지만 서로 다른 표현의 의미 차이와 현재 번역의 잠정성을 보존하기 위해서입니다.
  - marker: c
    text: ‘아이온’은 이 문헌의 우주론에서 영원한 영역·실재 또는 시대를 가리킬 수 있는 말입니다. 여기서는 한 가지 뜻으로 좁히지 않고 음역했습니다.
    reason: 전문 용어의 실제적인 의미 범위와 신학적 모호성을 유지하기 위해서입니다.
lexical_decisions:
- source_word: the Human / the Son of Man
  choice: ‘인간’ / ‘인자’
  rationale: 두 호칭을 구별하여 원문의 질문과 긴장을 보존했습니다. ‘인자’는 익숙한 복음서 호칭이지만, ‘인간’과의 어휘적 연관도 문맥에서 드러나게 했습니다.
- source_word: Primal Human
  choice: 태초의 인간
  rationale: 시간적·원형적 선행성을 나타내되 특정 교파의 전문 술어를 덧붙이지 않았습니다.
- source_word: the Begetter / First-Begetting
  choice: 낳는 이 / 처음 낳는
  rationale: ‘낳아진’ 존재와 ‘낳는’ 존재 사이의 능동·수동 차이를 가능한 한 보존했습니다.
- source_word: Self-Completed Mind
  choice: 스스로 완성된 정신
  rationale: 자기 충족적 완결성과 지성적 실재라는 두 요소를 직역에 가깝게 살렸습니다.
- source_word: androgynous
  choice: 남성과 여성을 함께 지닌
  rationale: 현대 독자가 이해할 수 있는 표현을 쓰면서 남성명과 여성명이 이어지는 문맥을 보존했습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌에서 우주론적 실재나 시대를 가리킬 수 있는 전문어의 다의성을 ‘영겁’이나 ‘시대’ 하나로 확정하지 않았습니다.
- source_word: reflections
  choice: 형상들
  rationale: ‘반영들’보다 자연스럽되, 아버지에게서 받은 모상 또는 반영이라는 의미를 지나치게 해석하지 않도록 했습니다.
theological_decisions:
- issue: 처음 난 양성적 아들의 남성명과 여성명의 관계
  choice: 한 존재 안의 남성명과 여성명으로 번역
  alternative: 서로 구별되는 두 존재로 번역
  rationale: 제공된 증거는 단수의 ‘처음 난 … 아들’을 말한 뒤 그 남성명과 여성명을 제시하므로, 그 문법적 연결을 유지했습니다.
- issue: ‘그리스도’와 처음 난 이의 동일성
  choice: 동격 관계를 그대로 제시
  alternative: 후대 정통 그리스도론의 개념으로 풀어 설명
  rationale: 본문 자체의 우주론적 용법을 보존하고 외부 교리 체계로 의미를 확정하지 않았습니다.
- issue: 화자의 기원
  choice: ‘스스로 생겨난 태초의 무한한 빛에서 비롯되었다’로 번역
  alternative: 화자를 그 빛 자체이거나 피조물로 명시
  rationale: 원문 증거가 표현하는 기원 관계만 제시하고 존재론적 지위를 추가로 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 계시 담화의 장중함은 유지하되 지나치게 고어적인 어순은 피했습니다. 이 초안은 제공된 공개 영역 영어 증언에 근거한 잠정 번역이며, 나그함마디 코덱스 III,4와 베를린 코덱스 8502,3의 콥트어 본문에 대한 직접 대조가 필요합니다.
