id: SOJC.006
reference: Sophia of Jesus Christ — The First-Begotten Androgynous Son
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Bartholomew then asked him: “How (is) <he> named [] ‘the Human’ and ‘the Son of Man’ in the Gospel? So, which one of them pertains to the Son?”


    He who is holy said to him, “I desire that you know that the Primal Human is called ‘the Begetter,’ ‘the Self-Completed Mind.’ He contemplated with his consort, Great Sophia, and manifested his first-begotten, androgynous son. Its male name is called ‘First-Begetting Son of God,’ while its female name is ‘First-Begetting Sophia, Mother of the Universe,’ some calling her ‘Love.’ The first-begotten, who is called ‘Christ,’ created a multitude of countless [] angels for service from the Spirit and the Light because he wields authority from his Father.”


    His disciples said to him: “Lord, disclose to us concerning the one called ‘the Human’ so that we can also precisely understand his glory.”


    The perfect Savior said: “Let whoever has ears to hear, hear! On account of his origin from radiant light, the first-begetting Father is named ‘Adam, the Eye of Light,’ [and] his inexpressible, shadowless holy angels continually rejoice in gladness over the reflections they obtained from their Father. The entire kingdom of the Son of Man, who is called ‘the Son of God,’ is replete with inexpressible and shadowless joy, and rejoicing that never changes, rejoicing over his indestructible [] glory, until now unheard and unrevealed in the aeons and their worlds that originated thereafter. I originated from the self-begotten and primal Infinite Light so that I could reveal all things to you.”'
