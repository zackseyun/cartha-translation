  text: 'Then Thomas asked [him], “Lord, Savior, how many aeons are above the heavens?”


    The perfect Savior said, “I praise you for asking about the great aeons, because your roots dwell in the infinities. When those whom I discussed before were revealed, he [supplied . . .]


    (Coptic pages 109 and 110 are missing)


    […] [] and arrive at a unity, we call them the ‘Assembly of the Ogdoad.’ It appeared as androgynous and was named partly male and partly female. The male is called ‘Assembly,’ while the female is called ‘Life,’ so that it could be shown that the life of all the aeons came from a female.


    “And all names were received from the originating principle. This was because, from his harmony with his thought, the powers appeared very quickly and were called ‘gods.’ On the basis of their wisdom, [the] gods of the gods revealed gods, <and the gods> on the basis of their wisdom revealed lords. The lords of the lords, on the basis of their acts of thought, revealed lords, and the lords, on the basis of their power, revealed archangels. The archangels, on the basis of their words, revealed angels, [] likenesses appearing from them that possessed structure, shape, and names for all the aeons and their worlds.


    “And the immortals I have just described all exercise authority from the Immortal Human, who is called ‘Silence,’ because when they contemplated silently, without outward speech, the majesty that belongs to her was brought to completion. Because the indestructible ones possessed authority, each one created a great kingdom in the Ogdoad, as well as thrones, temples, and firmaments for their respective majesties, because all of them came into being through the will of the Mother of the World.”


    Then the holy apostles said to him, “Lord, Savior, tell us about those who dwell in the aeons, because it is necessary for us to inquire about them.”


    The perfect [] Savior said, “You may ask about anything, and I will give you the answer.


    “They created angelic hosts—countless myriads—for service and for their glory. They created virgin spirits, the inexpressible and unwavering lights, because they experience no infirmity or weakness but instead display will.


    “In this way the aeons were quickly completed, together with the heavens and the firmaments, in the glory of the Immortal Human and his consort Sophia. From there, all the aeons and worlds, and those that came afterward, received the model for creating their likenesses, both in the heavens of chaos and in their worlds. And every nature, beginning with the revelation of chaos, dwells in the shadowless light, in indescribable joy, and in unspeakable rejoicing. They continually enjoy their glory, which never fades, [] and their infinite rest, which is indescribable among all the aeons and all their powers that came into being afterward. Everything I have now told you, I said so that you might shine in the light even more than these.”'
translation:
  language: ko
  text: '그때 도마가 [그분께] 물었습니다. “주님, 구원자여, 하늘들보다 높은 아이온들은 얼마나 많습니까?”


    완전한 구원자께서 말씀하셨습니다. “네가 위대한 아이온들에 관해 물으니, 내가 너를 칭찬합니다. 너의 뿌리가 무한한 영역들에 머물러 있기 때문입니다. 내가 앞서 말한 이들이 드러났을 때, 그는 [마련하였습니다……]


    (콥트어 사본 109쪽과 110쪽은 소실되었습니다.)[a]


    […] [] 하나 됨에 이르면, 우리는 그들을 ‘오그도아드의 회중’이라고 부릅니다. 그것은 양성의 모습으로 나타났으며, 일부는 남성이고 일부는 여성이라고 불렸습니다. 남성은 ‘회중’이라 하고 여성은 ‘생명’이라 하는데, 이는 모든 아이온의 생명이 여성에게서 왔음을 보여 주기 위한 것입니다.


    “그리고 모든 이름은 근원적 원리에서 비롯되었습니다. 이는 그의 생각과 이루는 조화에서 ‘신들’이라 불리는 권능들이 매우 빠르게 나타났기 때문입니다. 그들의 지혜에 따라 [그] 신들의 신들이 신들을 드러냈고, <그 신들은> 그들의 지혜에 따라 주들을 드러냈습니다. 주들의 주들은 그들의 사유 행위에 따라 주들을 드러냈고, 주들은 그들의 권능에 따라 대천사들을 드러냈으며, 대천사들은 그들의 말에 따라 천사들을 드러냈습니다. [] 그들에게서 모상들이 나타났는데, 그것들은 모든 아이온과 그 세계들을 위한 구조와 형태와 명칭을 지니고 있었습니다.


    “그리고 내가 방금 설명한 불멸자들은 모두 ‘침묵’이라 불리는 불멸의 인간에게서 권위를 받아 행사합니다. 이는 그들이 바깥으로 말을 내지 않고 침묵 가운데 관조했을 때, 그녀에게 속한 위엄이 완성되었기 때문입니다.[b] 멸할 수 없는 이들은 권위를 지니고 있었으므로, 저마다 오그도아드 안에 큰 왕국을 만들고, 각자의 위엄을 위한 보좌와 신전과 궁창도 만들었습니다. 그들 모두가 세계의 어머니의 뜻을 통해 생겨났기 때문입니다.”


    그러자 거룩한 사도들이 그분께 말했습니다. “주님, 구원자여, 아이온들 안에 거하는 이들에 관해 말씀해 주십시오. 우리가 그들에 관해 묻는 것이 필요합니다.”


    완전한 [] 구원자께서 말씀하셨습니다. “무엇이든 물어도 좋습니다. 내가 대답해 주겠습니다.


    “그들은 섬김과 자신들의 영광을 위해 무수히 많은 천사들의 무리를 창조했습니다. 그들은 처녀 영들, 곧 말로 표현할 수 없고 흔들리지 않는 빛들을 창조했습니다. 그들에게는 어떠한 질병이나 약함도 없으며, 오히려 의지를 나타내기 때문입니다.


    “이와 같이 아이온들은 하늘들과 궁창들과 함께 불멸의 인간과 그의 짝 소피아의 영광 안에서 신속히 완성되었습니다. 거기에서 모든 아이온과 세계와 그 뒤에 온 이들은 하늘들, 곧 혼돈의 하늘들과 자신들의 세계에서 그와 닮은 것들을 창조할 본을 얻었습니다.[c] 혼돈이 드러난 때부터 모든 본성은 그림자 없는 빛과 형언할 수 없는 기쁨과 말로 다 할 수 없는 환희 가운데 거합니다. 그들은 결코 사라지지 않는 자신들의 영광을 [] 끊임없이 누리며, 그 뒤에 생겨난 모든 아이온과 그 모든 권능 가운데서도 이루 말할 수 없는 무한한 안식을 누립니다. 내가 지금 이 모든 것을 너희에게 말한 것은 너희가 이들보다도 빛 가운데서 더욱 빛나게 하려는 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점에서 콥트어 사본 두 쪽이 소실되어 앞뒤 문맥이 이어지지 않습니다.
    reason: 중대한 사본 결락을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 이 문장은 ‘불멸의 인간’을 가리키는 남성형 표현과 ‘그녀에게 속한 위엄’이라는 여성형 지시를 함께 보존합니다.
    reason: 본문의 성별 지시가 불일치하거나 복합적으로 나타나는 점을 숨기지 않기 위해서입니다.
  - marker: c
    text: ‘하늘들, 곧 혼돈의 하늘들’로도, ‘혼돈의 하늘들’이라는 하나의 구로도 이해할 수 있습니다. 번역은 후자의 연결을 드러내되 원문의 다소 불분명한 구조를 유지했습니다.
    reason: 구문적 모호성을 과도하게 확정하지 않기 위해서입니다.
lexical_decisions:
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌에서 우주론적 실재 또는 영역을 가리키는 전문 용어이므로 일반적인 ‘영겁’이나 ‘시대’로 환원하지 않고 음역했습니다.
- source_word: Ogdoad
  choice: 오그도아드
  rationale: ‘여덟으로 이루어진 집단/영역’이라는 전문 우주론 용어의 고유성을 보존하기 위해 음역했습니다.
- source_word: Assembly
  choice: 회중
  rationale: 집합체와 인격화된 명칭이라는 양면을 살리며, 인용 부호로 전문 명칭임을 표시했습니다.
- source_word: Immortal Human
  choice: 불멸의 인간
  rationale: 신화적·원형적 존재를 가리키는 칭호의 문자적 긴장을 보존했습니다.
- source_word: Sophia
  choice: 소피아
  rationale: ‘지혜’라는 뜻으로 번역할 수도 있으나 여기서는 짝으로 등장하는 고유한 존재명이므로 음역했습니다.
- source_word: simulacra / likenesses
  choice: 모상들 / 닮은 것들
  rationale: 첫 문맥에서는 형상화된 복제물의 뜻을 살려 ‘모상들’, 후속 창조 문맥에서는 자연스러운 ‘닮은 것들’을 사용했습니다.
theological_decisions:
- issue: ‘침묵’이라 불리는 불멸의 인간의 성별 지시
  choice: ‘불멸의 인간’은 문법적으로 남성형 표현을 유지하되, 위엄은 원문 증언대로 ‘그녀에게 속한’ 것으로 번역했습니다.
  alternative: 성별을 일관되게 남성 또는 여성으로 통일
  rationale: 본문 자체의 성별 긴장이나 복합적 신화 구조를 해소하지 않고 보존했습니다.
- issue: 여성에게서 모든 아이온의 생명이 왔다는 진술
  choice: 원문의 진술을 직접적으로 유지했습니다.
  alternative: ‘여성적 원리’ 등으로 추상화
  rationale: 본문의 명시적인 여성 표상을 교리적 이유로 약화하거나 재해석하지 않았습니다.
- issue: ‘gods’와 ‘lords’의 번역
  choice: 각각 ‘신들’과 ‘주들’로 번역했습니다.
  alternative: ‘신적 존재들’, ‘통치자들’
  rationale: 계층적 계시 구조와 반복되는 명칭을 그대로 드러내며, 유일신론적 조화를 위해 표현을 완화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 경건하고 위엄 있는 문체를 유지하되 과도한 고어체는 피했습니다. 대괄호, 말줄임표, 꺾쇠괄호와 사본 결락 표시는 제공된 증언의 본문비평적 신호를 그대로 보존했습니다. 콥트어 원문 직접 검토가 아직 이루어지지 않았으므로, 이 초안은 제공된 공개 영역 영어 증언을 토대로 한 잠정 번역입니다.
