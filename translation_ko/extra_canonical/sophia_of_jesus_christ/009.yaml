    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: ko
  text: '마리아가 그분께 물었습니다. “거룩하신 주님, 주님의 제자들은 어디에서 비롯되었으며 어디로 가고 있습니까? 또 이곳에서는 어떻게 처신해야 합니까?”


    완전한 구원자께서 그들에게 말씀하셨습니다. “나는 여러분이 이것을 알기를 바랍니다. 곧 세상의 어머니이며 배우자인 소피아는 자신의 남성 짝 없이 혼자서 이것들을 존재하게 하려고 했습니다. 그러나 세상의 아버지의 뜻에 따라, 그분의 헤아릴 수 없는 선하심이 드러나도록, 그분은 불멸자들과 그 뒤에 생겨난 이들 사이에 휘장을 만드셨습니다. 그리하여 그 결과로 [···]


    (콥트어 사본 115–116쪽 소실)[a]


    [···] “그리고 숨이 있으며, 둘이 하나가 될 수 있게 하셨습니다. 처음부터 그러했던 것처럼 말입니다. 이는 여러분이 많은 열매를 맺고, 말로 다 할 수 없는 기쁨과 영광과 [존귀와] [세상의 아버지께서 주시는] 선물 가운데, 처음부터 계신 분께로 올라가게 하려는 것입니다.[b]


    “[그러므로] [아버지를 온전한] 앎으로 아는 사람은 [아버지께로 가서] 나지 않으신 [아버지 안에서 안식할 것입니다]. 그러나 [그분을 불완전하게 아는 사람은] [결핍으로 가서] [여덟째 영역에서] 안식할 것입니다.[c]


    “[이제] 깊이 생각하고 진리에 동의함으로써 빛의 불멸하는 [영]을 고요히 아는 사람이 보이지 않는 분의 표징들을 내게 보이면, 그는 고요한 영 안에서 빛이 될 것입니다. 사람의 아들을 앎과 사랑으로 아는 사람이 사람의 아들의 [···] 표징을 내게 보이면, 그는 여덟째 영역에 있는 이들의 거처로 갈 수 있습니다.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점에서 콥트어 사본의 두 쪽이 소실되어 앞뒤 문맥이 이어지지 않습니다.
    reason: 중대한 사본 결락을 독자에게 명시합니다.
  - marker: b
    text: 대괄호 안의 말과 줄임표는 사본의 훼손 부분을 번역자가 복원했거나 본문이 남아 있지 않음을 나타냅니다. 이 단락은 소실된 부분 뒤에서 문장 중간부터 다시 시작합니다.
    reason: 복원문과 결락 신호의 의미를 설명합니다.
  - marker: c
    text: ‘여덟째 영역’은 그리스어계 용어 ‘오그도아드’(Ogdoad)에 해당하며, 문자적으로는 ‘여덟으로 이루어진 것’ 또는 ‘여덟째’를 뜻합니다. 여기서는 특정한 초월적 영역을 가리키는 듯하지만, 본문은 그 구조를 자세히 설명하지 않습니다.
    reason: 낯선 우주론 용어를 최소한으로 설명하되 해석을 확정하지 않습니다.
  - marker: d
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 콥트어 원문에 대한 직접 대조 검토는 아직 이루어지지 않았습니다.
    reason: 직접 원어 검토가 보류된 자료 상태를 투명하게 밝힙니다.
lexical_decisions:
- source_word: Sophia
  choice: 소피아
  rationale: 고대 문헌의 인격화된 고유 존재를 가리키므로 ‘지혜’로만 번역하지 않고 음역하여 고유명사성을 보존했습니다.
- source_word: consort
  choice: 배우자
  rationale: 짝을 이룬 여성 존재라는 관계를 자연스럽게 나타내되, 혼인 관계인지 우주론적 짝인지 본문이 확정하지 않는 점을 보존했습니다.
- source_word: male (counterpart)
  choice: 남성 짝
  rationale: 단순한 ‘남편’보다 원문의 대응 관계를 드러내고 특정한 혼인 해석을 피했습니다.
- source_word: curtain
  choice: 휘장
  rationale: 두 영역을 가르는 막이라는 상징적·우주론적 이미지를 유지했습니다.
- source_word: Ogdoad
  choice: 여덟째 영역
  rationale: 독자가 뜻을 짐작할 수 있도록 기능적으로 옮기면서도, 특정 우주론 체계를 과도하게 보충하지 않았습니다.
- source_word: Son of Man
  choice: 사람의 아들
  rationale: 전통적으로 익숙한 표현인 ‘인자’보다 일반 독자가 바로 이해할 수 있는 형태를 택하되 칭호의 모호성을 유지했습니다.
- source_word: unbegotten
  choice: 나지 않으신
  rationale: 발생하거나 출생하지 않았다는 원문의 부정적 속성을 간결하게 보존했습니다.
- source_word: repose
  choice: 안식하다
  rationale: 도착, 평안, 정착의 종교적 함의를 함께 담을 수 있는 자연스러운 한국어를 선택했습니다.
theological_decisions:
- issue: 소피아가 ‘이것들’을 존재하게 하려 했다는 문장의 지시 대상
  choice: ‘이것들’을 그대로 유지
  alternative: 제자들 또는 뒤에 생겨난 존재들로 명시
  rationale: 현존 문맥만으로 지시 대상을 확정할 수 없으므로 본문의 진정한 모호성을 보존했습니다.
- issue: ‘세상의 아버지’의 뜻과 창조 행위의 주체
  choice: 대명사 ‘그분’을 유지
  alternative: 세상의 아버지가 직접 휘장을 창조했다고 명시적으로 반복
  rationale: 제공된 증거의 대명사 구조를 따르면서도 한국어에서 가장 가까운 선행사를 자연스럽게 가리키게 했습니다.
- issue: 온전한 앎과 불완전한 앎에 따른 서로 다른 안식처
  choice: 두 행선지의 대조를 그대로 번역
  alternative: 구원과 정죄라는 교리적 범주로 해설
  rationale: 본문 자체의 단계적 우주론과 신학적 긴장을 후대의 교리 체계로 재규정하지 않았습니다.
- issue: ‘표징들을 내게 보인다’의 의미
  choice: 행위의 의미를 설명하지 않고 직역에 가깝게 유지
  alternative: 신앙 고백, 비밀 표지, 성례적 증표 등으로 해석
  rationale: 표징의 성격이 불명확하므로 특정 종파적 또는 의례적 해석을 들여오지 않았습니다.
- issue: ‘고요한 영’과 ‘고요히 안다’의 관계
  choice: 동일 어근의 반복을 살려 번역
  alternative: 각각 ‘침묵의 영’, ‘말없이 깨닫다’로 분리
  rationale: 침묵·고요와 영적 앎 사이의 문학적 연관성을 보존하되 의미를 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 질문과 가르침은 자연스럽고 장중하게 다듬되, 영지주의적 우주론 용어와 사본의 불연속성은 평이하게 바꾸어 해소하지 않았습니다. 대괄호와 줄임표를 보존하여 복원과 훼손의 경계를 드러냈습니다.
