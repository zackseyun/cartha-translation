status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언과 대조할 때 전반적인 인명, 우주론 용어, 대괄호 복원 표시 및 사본 결락 표시는 잘 보존되었습니다. 다만 결락 뒤 재개되는 문장에서 영어 증언의 가능·불완전 문장 구조를 ‘둘이 하나가 될 수 있게 하셨습니다’라는 완결된 사역문으로 바꾸어, 원문 증언에 없는 행위 주체를 보충했습니다. 또한 ‘결핍’과 ‘오그도아드의 안식’은 병렬된 목적지이므로 이를 더 직접적으로 드러내는 편이 안전합니다.
  naturalness: 합쇼체의 문체는 일관되고 자연스럽습니다. 다만 결락 직후의 문장은 본래 문장 중간에서 시작하므로, 자연스러움을 위해 문법적 주체를 보충하기보다 파편성을 남기는 것이 사본 상태와 번역 원칙에 더 부합합니다. ‘오그도아드’는 음역을 본문에 유지하고 첫 용례 각주에서 설명하면 고유 용어와 독해성을 함께 확보할 수 있습니다.
  terminology: ‘소피아’, ‘세상의 어머니’, ‘남성 짝’, ‘휘장’, ‘사람의 아들’, ‘보이지 않는 분’은 증언의 모호성을 보존합니다. ‘Ogdoad’를 ‘여덟째 영역’으로만 번역하면 해당 고유 우주론 용어의 형태가 다소 약화되므로 ‘오그도아드’로 옮기고 각주에서 뜻을 설명합니다. ‘unbegotten’은 ‘나지 않으신’보다 현대 한국어에서 ‘생겨나지 않으신’이 더 명료합니다.
  issues:
  - severity: medium
    issue: 결락 뒤의 ‘could from two become one’을 사역문으로 보충함
    rationale: ‘둘이 하나가 될 수 있게 하셨습니다’는 영어 증언에 없는 ‘하신’이라는 행위 주체와 사역 의미를 추가합니다. 결락으로 인해 선행 문맥이 없는 만큼 ‘둘에서 하나가 될 수 있으며’처럼 가능 표현과 문장 파편성을 보존해야 합니다.
  - severity: low
    issue: ‘repose [of the Ogdoad]’의 병렬 관계가 약화됨
    rationale: ‘[결핍으로 가서] [여덟째 영역에서] 안식할 것입니다’도 가능한 해석이지만, 증언은 ‘결핍’과 ‘오그도아드의 안식’을 함께 향하는 대상으로 제시합니다. ‘결핍과 [오그도아드의] 안식으로 갈 것입니다’가 더 가깝습니다.
  - severity: low
    issue: Ogdoad의 고유 용어성이 본문에서 소실됨
    rationale: ‘여덟째 영역’은 기능적 설명이지만, 전문 용어의 음역을 보존하면 원문의 불확정적인 우주론적 명칭을 더 투명하게 유지할 수 있습니다.
  revised_text: '마리아가 그분께 물었습니다. “거룩하신 주님, 주님의 제자들은 어디에서 비롯되었으며 어디로 가고 있습니까? 또 이곳에서는 어떻게 처신해야 합니까?”


    완전한 구원자께서 그들에게 말씀하셨습니다. “나는 여러분이 이것을 알기를 바랍니다. 곧 세상의 어머니이며 배우자인 소피아는 자신의 남성 짝 없이 혼자서 이것들을 존재하게 하려고 했습니다. 그러나 세상의 아버지의 뜻에 따라, 그분의 헤아릴 수 없는 선하심이 드러나도록, 그분은 불멸자들과 그 뒤에 생겨난 이들 사이에 휘장을 만드셨습니다. 그리하여 그 결과로 [···]


    (콥트어 사본 115–116쪽 소실)[a]


