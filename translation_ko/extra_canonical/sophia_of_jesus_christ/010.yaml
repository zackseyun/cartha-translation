  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 명령문은 ‘-십시오’, 설명과 서술은 ‘-습니다’로 통일했습니다. 난해한 우주론 용어는 과도하게 풀어 쓰지 않았고, 에온·어머니·으뜸 창시자·빛의 아들들과 같은 문헌 고유의 긴장을 유지했습니다. 대괄호 복원 표시는 빠짐없이 본문에 보존했습니다.
