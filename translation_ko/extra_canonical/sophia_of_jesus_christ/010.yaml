  revised_text: '“보십시오! 나는 여러분에게 완전하신 분의 이름과 거룩한 천사들의 어머니의 온전한 뜻을 밝혀 주었습니다. 이는 여기서 남성의 [무리]가 완성되게 하고, [에온들 안에] [무한한 영역들과, 또한] 위대한 보이지 않는 [영의,] 헤아릴 수 없는 [풍요 속에서 생겨난 이들이 나타나게 하며, 그들이] 모두 [그분의 선하심에 참여하게 하고,] 아무 [왕국도 그 위에 없는 그들의 안식의] 풍요에 참여하게 하려는 것입니다.


    “나는 태초부터 존재하시는 분을 여러분에게 밝혀 주려고 [처음] 보냄을 받은 이에게서 나왔습니다. 으뜸 창시자와 그의 천사들이 스스로를 자랑하며 자신들이 신들이라고 말하는 교만 때문입니다.[b] 나는 그들을 그들의 눈먼 상태에서 풀어 주고, 세상 위에 거하시는 하나님에 관하여 모든 사람에게 선포하려고 왔습니다.


    “그러므로 그들의 무덤을 짓밟고, 그들의 악한 의도를 수치스럽게 하며, 그들의 멍에를 꺾고, 내 사람들을 깨우십시오. 나는 빛의 아들들인 여러분에게 모든 것에 대한 권세를 주었습니다. 그러므로 여러분은 [여러분의] 발로 그들의 권세를 짓밟을 수 있습니다.”


