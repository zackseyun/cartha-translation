  text: '“Behold! I have disclosed to you the name of the Perfect One, the entire will of the Mother of the holy angels, so that here the masculine [host] may be brought to completion, so that [in the aeons] there [could appear the infinities, as well as] those that [came into existence in the] unfathomable [riches of the Great] Invisible [Spirit, so that they] all [could partake in his benevolence], even the riches [of their repose] without any [kingdom over it].


    “I originated [from the first] sent one, that I could disclose to you He Who Is from the beginning, on account of the pride of the arch-begetter and his angels, because they boast about themselves, saying that they are gods. And I came to free them from their blindness, so that I could announce to everyone concerning the God who dwells above the world.


    [] “Tread, therefore, on their graves, shame their evil intention, break their yoke, and awaken my own. I have granted you authority over everything as the Sons of Light, so that with [your] feet you could tread on their power.”


    These are the matters [the] blessed Savior [spoke, and he vanished] from their midst. [All the disciples] were then in [great, unspeakable joy] in [the Spirit from] that day onward. [And his disciples] began preaching [the] divine Gospel of [the] eternal, indestructible [Spirit]. Amen.


    The Sophia of Jesus Christ'
translation:
  language: ko
  text: '“보십시오! 나는 여러분에게 완전하신 분의 이름과 거룩한 천사들의 어머니가 뜻하시는 모든 것을 밝혀 주었습니다. 이는 여기에서 남성의 [무리]가 완성되고,[a] [에온들 안에] [무한한 영역들과, 위대한] 보이지 않는 [영의] 헤아릴 수 없는 [풍요 속에서 생겨난 이들이 나타나며, 그들이] 모두 [그분의 선하심에 참여하게] 하려는 것입니다. 곧 그 위에 아무런 [왕권도 없는, 그들이 누릴 안식의] 풍요에 참여하게 하려는 것입니다.


    “나는 태초부터 존재하시는 분을 여러분에게 밝혀 주려고 [처음] 보냄받은 이에게서 나왔습니다. 으뜸 창시자와 그의 천사들이 교만하여 스스로를 자랑하며 자기들이 신들이라고 말하기 때문입니다.[b] 나는 그들을 눈먼 상태에서 풀어 주고, 세상 위에 거하시는 하나님을 모든 사람에게 선포하려고 왔습니다.


    “그러므로 그들의 무덤을 짓밟고, 그들의 악한 의도를 수치스럽게 하며, 그들의 멍에를 꺾고, 내 사람들을 깨우십시오. 나는 빛의 아들들인 여러분에게 모든 것에 대한 권세를 주었습니다. 그러므로 여러분은 [여러분의] 발로 그들의 권세를 짓밟을 수 있습니다.”


    이것이 [복되신] 구원자께서 [말씀하신] 내용입니다. 그러고 나서 그분은 그들 가운데서 [사라지셨습니다]. [모든 제자는] 그날부터 [영 안에서 말로 다 할 수 없는 큰 기쁨]에 잠겼습니다. [그분의 제자들은] 영원하고 썩지 않는 [영의] 거룩한 복음을 전하기 시작했습니다.[c] 아멘.


    예수 그리스도의 지혜'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 대괄호는 사본의 훼손된 부분을 편집자가 복원한 말임을 나타냅니다. 이 번역은 콥트어 사본을 직접 대조하기 전의 잠정 번역입니다.
    reason: 복원 표지를 보존하고 현 단계의 본문 근거를 투명하게 밝히기 위해서입니다.
  - marker: b
    text: ‘으뜸 창시자’는 이 작품의 우주론에서 하위 세계의 생성과 연관된 존재를 가리키는 칭호입니다. 여기서는 그를 ‘태초부터 존재하시는 분’과 동일시하지 않습니다.
    reason: 원문의 위계적 구별을 드러내되 특정 교파의 해석을 덧붙이지 않기 위해서입니다.
  - marker: c
    text: 제시된 결론 증언은 마지막 대상을 복원하여 ‘영’이라고 읽습니다. 이 작품 안에 뒤이어 전해지는 유사한 결말은 이 자리에 ‘아버지’를 둡니다.
    reason: 복수의 결말 형태에서 나타나는 실제 본문 차이를 숨기지 않기 위해서입니다.
lexical_decisions:
- source_word: Perfect One
  choice: 완전하신 분
  rationale: 인격적 칭호를 살리면서도 특정 교리적 등치어를 덧붙이지 않았습니다.
- source_word: masculine [host]
  choice: 남성의 [무리]
  rationale: 성별을 나타내는 원문의 독특한 우주론적 표현을 완화하거나 해석하지 않고 보존했습니다. 복원된 ‘host’는 대괄호로 표시했습니다.
- source_word: aeons
  choice: 에온들
  rationale: 이 문헌의 전문적인 우주론 용어를 일반적인 ‘시대’로 환원하지 않고 음역했습니다.
- source_word: He Who Is
  choice: 태초부터 존재하시는 분
  rationale: 문맥의 ‘from the beginning’을 자연스럽게 결합하되, 존재론적 칭호의 긴장을 유지했습니다.
- source_word: arch-begetter
  choice: 으뜸 창시자
  rationale: 최상위 신을 뜻하는 ‘창조주’로 오해되지 않도록 피하면서, 기원·생성을 일으키는 우두머리라는 의미를 살렸습니다.
- source_word: Sons of Light
  choice: 빛의 아들들
  rationale: 고대 종교 문헌의 집단 칭호를 포괄어로 바꾸지 않고 형식과 상징성을 보존했습니다.
- source_word: repose
  choice: 안식
  rationale: 단순한 휴식이 아니라 초월적이고 종말론적인 머묾을 가리키는 문맥을 반영했습니다.
theological_decisions:
- issue: ‘거룩한 천사들의 어머니’와 그 뜻의 관계
  choice: “거룩한 천사들의 어머니가 뜻하시는 모든 것”
  alternative: “어머니와 거룩한 천사들의 모든 뜻”
  rationale: 제시된 결론 증언은 Mother를 holy angels와 결속시키므로 그 문법 관계를 우선 보존했습니다.
- issue: 으뜸 창시자와 그의 천사들을 ‘눈먼 상태에서 풀어 준다’는 대상 관계
  choice: 대명사 ‘그들’을 그대로 유지
  alternative: ‘사람들을 그들의 눈멀게 함에서 풀어 준다’로 대상 변경
  rationale: 원문 증언의 대명사적 긴장과 다소 뜻밖의 진술을 해석으로 고쳐 쓰지 않았습니다.
- issue: 마지막 복음의 속격
  choice: “영원하고 썩지 않는 [영의] 거룩한 복음”
  alternative: “영원하며 영원히 썩지 않는 아버지의 거룩한 복음”
  rationale: 지정된 결론 본문은 복원어를 Spirit로 제시하므로 이를 따랐으며, 같은 작품의 다른 결말 형태에 나타나는 Father를 본문에 혼합하지 않았습니다.
