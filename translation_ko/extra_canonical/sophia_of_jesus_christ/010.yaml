    “From that light and the threefold male Spirit, which belongs to Sophia, his consort, he created gods and angels and archangels, [] countless myriads for service. This was because divinity and kingdom originated from this God, so that he was called ‘God of gods,’ ‘King of kings.’ Within him, the Primal Human possesses his singular mind and thought, being precisely (thought), reflection and contemplation, reason and power. All the [] existent qualities are [perfect, deathless].


    “Regarding indestructability, they are in fact equal, though regarding power, there is a difference similar to the difference between father and son, and son and thought, and the thought and what remains (thereafter). As I stated before, among created entities, the monad <. . .> comes first. And at the end, he who revealed everything, revealed everything from his power. And from created entities appeared everything that was fashioned [], and from what was fashioned appeared what was formed, (and) from what was formed (appeared) what was named. This is how from beginning to end the difference arose among the unbegotten ones.”


    Bartholomew then asked him: “How is he named ‘the Human’ and ‘the Son of Man’ in the Gospel? So, which one of them pertains to the Son?”


    He who is holy said to him, “I desire that you know that the Primal Human who is called ‘the Begetter,’ ‘the Self-Completed [] Mind,’ contemplated with his consort, [Great] Sophia, and manifested his first-<begotten>, androgynous son. Its male name is called ‘First-Begetting Son of God,’ its female name being ‘First-Begetting Sophia, Mother of the Universe,’ some calling her ‘Love.’ Consequently, the first-begotten, who is called ‘Christ,’ created a multitude of [] countless angels for [service] from [the Spirit and] the Light because he wields authority from his Father.”


    His disciples said to him: “Christ, instruct us concerning the Father, who is called ‘the Human,’ so that we can also precisely understand his glory.”


    The perfect Savior said: “Let whoever has ears to hear, hear! On account of his origin from light, the first-begetting Father is named ‘Adam, the Eye of Light,’ and his entire kingdom comprises shining light, and his [] [inexpressible, shadowless] holy angels continually rejoice in gladness over the reflections they obtained from their Father. The kingdom of the Son of Man, who is called ‘Christ,’ is replete with inexpressible and shadowless joy, <and> rejoicing that never changes, rejoicing over his indestructible glory, until now unheard and unrevealed in <the> aeons and [] their worlds that originated thereafter. [I] originated [from the self-begotten] and from the primal Infinite Light so that I could instruct you in all these things.”


    His disciples yet again said: “Christ, instruct us plainly about <how> the truly existent ones descended from the invisibilities, from the deathless (realms) to the world of mortality.”


    The perfect Savior said: “The Son of Man consorted with his companion Sophia, and manifested a [] [mighty] androgynous [light]. Its male name is called ‘Savior, All-Begetter,’ and its female name is ‘All-Begetter Sophia,’ some calling her ‘Pistis.’


    “Like a droplet from the light, everyone who enters the world is sent by him to the world of the Almighty, so that they can be watched over by him. And by the will of [] Sophia the fetter of his oblivion bound the light, [so that] by means of this, the affair could be revealed [to] the entire impoverished world, namely, (the Almighty’s) pride and blindness, and the ignorance that named him.


    “I, however, by the will of the great Light, originated from the places above. I have loosed that <fetter>, having halted the activity of the thieving tomb. I have aroused that droplet sent from Sophia, so that through me it could bear much fruit and be perfected, and never again become [] defective, but through me, I being the Great Savior, that his glory could be manifested, so that Sophia could also be rectified of <that> defect, so <that> her children <could never> again grow defective, but could obtain honor and glory and ascend to their Father, and understand the manner of the speech of the Light.


    “And you were sent by the Son, who (himself) was sent so that you could obtain light and [] separate yourselves from the oblivion of the authorities, and that it could never again come to manifestation on your account, that is, the impure rubbing that originates from the envy that comes from their phallus, and so that you could tread on his evil intention.”


    Then Thomas asked him: “Christ, Savior, how many aeons surpass the heavens?”


    The perfect Savior said: “I praise you for asking about the great aeons, because your roots dwell in the infinities. [] When those whom I discussed before were revealed, the self-begetting Father rapidly took to creating twelve aeons for service for the twelve angels. All of them are perfect and good. In this way the deficiency in the female appeared.”


    And <he> asked him: “How many aeons of the immortals are there, beginning with the infinities?”


    The perfect Savior said: “Let whoever has ears to hear, [] hear! The first aeon is the Son of Man, who is called ‘First-Begetter,’ who is called ‘Savior,’ the one who has appeared. The second aeon is the Human, who is called ‘Adam, the Eye of Light.’ What encompasses these is the aeon above which there is no kingdom, of the eternal, infinite God, the self-begotten aeon of the aeons that dwell therein, of the immortals, whom I explained earlier, [] being above the Seventh that manifested from Sophia, who is the first aeon.


    “The Immortal Human manifested aeons and powers and kingdoms and granted authority to everyone who appears in him, so that they might carry out their wishes until the last things above chaos, because these united with one another and revealed every magnificence, even from the Spirit, multitudes of glorious and countless lights. In the beginning, these [] were named the first aeon, and <the second>, and <the third>. The first <is> called ‘Unity and Repose.’ Each one bears its (appropriate) name, because the <third> aeon was called ‘Assembly’ on account of the great multitude that had appeared, a multitude revealing itself as one. It is because the multitudes [] gather together and become one that <they> are called ‘Assembly,’ on account of that Assembly that transcends heaven.


    Therefore the Assembly <of> the Ogdoad was manifested as androgynous and was named part masculine and part feminine. The male is called ‘Assembly,’ whereas the female is called ‘Life,’ so that it could be demonstrated that the life [] for all the aeons came from a female.


    “And all names were obtained from the originative principle. This was because from his harmony with his thought, the powers appeared most rapidly who were called ‘gods,’ and on the basis of <their> contemplation, the gods of the gods revealed <the> divine gods, and on the basis of their wisdom the gods revealed <the lords> of <lords>, and <on the basis> of their acts of thought the <lords> of the <lords> revealed <lords>, and on the basis of their power the <lords> [] revealed archangels, and on the basis of their words the archangels revealed angels, and <simulacra> appeared from them possessing structure and shape and appellation for all the aeons and their worlds.


    “And the immortals I have just now described, they all wield authority from the Immortal Human, who is called ‘Silence,’ <because> by reflecting (silently) without (outward) speech, [] the majesty that is his was brought to completion. Because the indestructible ones possessed authority, they created a large kingdom, each one dwelling [in] his Ogdoad together with his firmament <and> thrones and temples for their respective majesties, because all of them originated through the will of the Mother of the World.”


    The holy apostles then said to him: “Christ, Savior, reveal the aeons to us, because it is necessary for us to inquire concerning them.”


    The perfect [] Savior said: “You can ask about anything, and I will give you the answer.


    “They created angelic hosts, countless myriads for service and their glory. And they created virgin spirits, the inexpressible and unwavering lights, because they experience no infirmity or weakness, but (instead show) will. In this way were the aeons rapidly completed together with the heavens and the firmaments in the glory of the Immortal Human [] and his consort Sophia. [From there] all the aeons and worlds <and> those that arrived thereafter obtained models for the creation of <their> likenesses, (both) in the heavens <of> chaos and in their worlds. And every nature, beginning with the revelation of chaos, dwells in the shadowless light and in indescribable joy and in unspeakable rejoicing. They continually rejoice [] over their glory that never fades and their infinite repose, which is indescribable among all the aeons and all their powers that came into being thereafter. Everything I have now told you, I said so that you could shine in the light even more than these.”


    Mary asked him: “Holy Christ, from where did your disciples originate, and to where are they going, and how should they act here?”


    The perfect [] Savior said: “I desire that you know concerning Sophia, the Mother of the Totalities. I will manifest his benevolence, and it will be manifested (that) together with his mercy and his unfathomable nature he created the curtain between the immortals and those that arrived thereafter, that the result could follow every aeon and chaos, so that the deficiency of the female could <appear>, and that it could transpire that Error would struggle with her. And these came to comprise [] the curtain of the Spirit.


    “As I earlier mentioned, from <the> aeons above the emanations of Light, a droplet from the Light and the Spirit descended to the lower places of chaos belonging to the Almighty, so that their molded shapes could appear from that droplet, because it is a judgment on him, the arch-begetter, who is called ‘Yaldabaoth.’ That droplet revealed their molded shapes through breath, operating as a [] living soul. It was wilted and it slept in the ignorance of the soul. Then it grew hot because of the breath of the great male light, and it contemplated, (and) when the breath blew into (the immortal one), names were obtained from that immortal one by everyone in the world of chaos and by everything in it.


    “When, however, this transpired by the will of Mother Sophia, so that in that place the Immortal Human could sew together [] garments as a judgment against the thieves, <he> subsequently greeted the exhalation of that breath. Because, however, he was soulish, he was unable to gain that power for himself before the number of those of chaos was completed, before the time ordained by the great angel is completed.


    “I have now instructed you concerning the Immortal Human, and have loosed the fetters of the thieves from him. In front of them I shattered the gates of [] the merciless ones, shaming their evil intention, and all of them have been disgraced, and have <not> risen from their ignorance. This is why, then, I came to this place, that they could be joined with that Spirit and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory and honor and the gift [] of the Father of the World.


    “Consequently, whoever knows the Father in perfect knowledge will go to the Father and repose in the unbegotten Father. However, whoever knows him imperfectly will remain in the deficiency and repose in the Ogdoad.


    “Now, whoever silently knows the immortal Spirit of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the [] silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of the Son of Man, he can go to dwell with those in the Ogdoad.”


    “Behold! I have instructed you concerning the name of the Perfect One, the entire will of the holy angels and of the Mother, so that the male host may be brought to completion, so that in all the aeons they could appear, from [] the infinities to those that came into existence in the unfathomable riches of the Great Invisible Spirit, so that they all could partake in his benevolence, even the riches <of their place of repose> without any kingdom over it.


    “And I originated from first sent one, that I could disclose to you He Who Is from the beginning, on account of the pride of the arch-begetter and his angels, because they boast about themselves, saying that they are gods. And I [] came to free them from their blindness, so that I could announce to everyone concerning the God who dwells above the world.


    “Tread, therefore, on their graves, shame their evil intention, break their yoke, and awaken whoever is my own, because I have granted you authority over everything as the Sons of Light, so that with your feet you could tread on their power.”


    These are the matters the blessed Savior spoke, and he [] vanished from their midst. And they were in great, unspeakable joy in the Spirit from that day onward. And his disciples began preaching the divine Gospel of the eternal Father, indestructible forever.


    The Sophia of Jesus Christ


