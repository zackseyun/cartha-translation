  text: 'Matthew said [] to him, “Lord, no one can discover the truth except through you, so teach us the truth.”


    The Savior said, “He Who Is cannot be expressed. No power knew him, no authority, nothing contingent, nor anything created from the foundation of the world until now, but he alone and any to whom he wishes to grant revelation through the one who originated from the First Light. From this point on, I am the Great Savior. This is because he is deathless and eternal.


    “He is eternal, without birth, because anyone who has been born will be destroyed (in death). He is unbegotten, without beginning, because anyone who had a beginning will have an end. Because no one rules over him, he is nameless, since anyone with a name has been created by someone else. And He Who Is has an appearance uniquely his own, [] unlike anything you have seen and understood. Yet it is an enigmatic appearance that transcends everything and surpasses the world. It gazes in every direction (simultaneously) and beholds itself from itself.


    “Because it is infinite, he can never be comprehended.

    He is forever indestructible, with nothing resembling him.

    He is the good that never changes.

    He is without defect.

    He is eternal.

    He is blessed.

    He cannot be known, but he knows himself.

    He is beyond measure; he cannot be traced out.

    He is perfect, without imperfection.

    His blessedness is indestructible.

    He is called ‘Father of the World.’”'
translation:
  language: ko
  text: '마태가 그분께 말했습니다.[a] “주님, 주님을 통하지 않고서는 아무도 진리를 발견할 수 없으니, 저희에게 진리를 가르쳐 주십시오.”


    구원자께서 말씀하셨습니다. “계신 분은 말로 표현할 수 없습니다. 세상이 시작된 때부터 지금까지 어떤 능력도, 어떤 권세도, 우연히 존재하게 된 어떤 것도, 어떤 피조물도 그분을 알지 못했습니다. 오직 그분 자신만이 자신을 아시며, 그분이 첫 빛에서 비롯된 이를 통하여 계시를 주고자 하시는 사람만이 그분을 압니다. 이제부터 나는 위대한 구원자입니다. 이는 그분이 죽지 않으시며 영원하시기 때문입니다.


    “그분은 영원하시며 태어나지 않으셨습니다. 태어난 이는 누구나 죽음으로 멸망할 것이기 때문입니다. 그분은 나신 적이 없고 시작도 없으십니다. 시작이 있는 이는 누구나 끝도 맞을 것이기 때문입니다. 아무도 그분을 다스리지 않으므로 그분에게는 이름이 없습니다. 이름을 가진 이는 누구나 다른 누군가에게 창조되었기 때문입니다. 계신 분에게는 그분만의 고유한 모습이 있습니다.[b] 그것은 여러분이 보고 이해한 그 어떤 것과도 같지 않습니다. 그 모습은 신비로워서 모든 것을 초월하고 세상보다 뛰어납니다. 그것은 동시에 모든 방향을 바라보며, 자기 자신에게서 자기 자신을 봅니다.


    “그분은 무한하시므로 결코 이해될 수 없습니다.


    그분은 영원히 멸망하지 않으시며, 그분을 닮은 것은 아무것도 없습니다.


    그분은 결코 변하지 않는 선이십니다.


    그분에게는 흠이 없습니다.


    그분은 영원하십니다.


    그분은 복되십니다.


    그분은 알려질 수 없으나 자기 자신을 아십니다.


    그분은 헤아릴 수 없으며, 그 자취를 찾아낼 수도 없습니다.


    그분은 완전하시며 불완전함이 없습니다.


    그분의 복되심은 없어지지 않습니다.


    그분은 ‘세상의 아버지’라고 불리십니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 지점의 대괄호는 사본의 손상이나 탈락 부분을 나타냅니다.
    reason: 제공된 증거본문의 첫 번째 빈 대괄호를 독자가 오탈자로 오해하지 않도록 설명합니다.
  - marker: b
    text: 이 지점에도 사본의 손상이나 탈락 부분이 있습니다.
    reason: 제공된 증거본문에서 ‘고유한 모습’ 뒤에 놓인 두 번째 빈 대괄호를 표시합니다.
lexical_decisions:
- source_word: He Who Is
  choice: 계신 분
  rationale: 존재를 가리키는 칭호의 간결성과 신비성을 보존하면서도, 특정 교리적 해석을 본문에 덧붙이지 않도록 ‘스스로 계신 분’보다 중립적으로 옮겼습니다.
- source_word: inexpressible
  choice: 말로 표현할 수 없습니다
  rationale: 추상적인 ‘불가언적이다’보다 현대 독자가 쉽게 이해할 수 있으면서도 초월성을 나타내는 표현을 택했습니다.
- source_word: nothing contingent
  choice: 우연히 존재하게 된 어떤 것도
  rationale: 제공된 영어 증거본문의 형이상학적 가능성을 성급히 확정하지 않고, contingent의 우연성·비필연성 의미를 비교적 투명하게 드러냈습니다.
- source_word: unbegotten
  choice: 나신 적이 없고
  rationale: 앞의 ‘태어나지 않으셨습니다’와 구별하면서도 ordinary reader에게 이해되는 말로 옮겼습니다.
- source_word: cannot be traced out
  choice: 그 자취를 찾아낼 수도 없습니다
  rationale: 완전히 탐색하거나 규명할 수 없다는 비유적 의미를 자연스러운 한국어로 보존했습니다.
- source_word: Father of the World
  choice: 세상의 아버지
  rationale: ‘세계의 아버지’보다 자연스러운 한국어를 사용하되, 칭호를 해석적으로 확장하지 않았습니다.
theological_decisions:
- issue: ‘He Who Is’의 신명 해석 가능성
  choice: 계신 분
  alternative: 스스로 계신 분 / 존재하시는 분
  rationale: 출애굽기 신명과의 동일성을 번역 단계에서 단정하지 않고 원문의 존재론적 칭호를 보존했습니다.
- issue: ‘he alone and any to whom...’의 통사적 모호성
  choice: 오직 그분 자신만이 자신을 아시며, 그분이 … 계시를 주고자 하시는 사람만이 그분을 압니다
  alternative: 그분 홀로, 그리고 그분이 … 계시를 주고자 하시는 누구든 그분을 알았습니다
  rationale: 문맥상 생략된 ‘안다’를 보충해 한국어 문장을 성립시켰으나, 계시는 그분의 뜻과 ‘첫 빛에서 비롯된 이’를 통해 주어진다는 구조는 유지했습니다.
- issue: ‘From this point on, I am the Great Savior’와 뒤따르는 ‘he’의 관계
  choice: 이제부터 나는 위대한 구원자입니다. 이는 그분이 … 때문입니다
  alternative: 이제부터 나는 위대한 구원자입니다. 이는 내가 … 때문입니다
  rationale: 증거본문의 인칭 전환을 수정하거나 동일시하지 않고 그대로 보존하여 신학적 긴장을 남겼습니다.
- issue: ‘the good’의 인격적·추상적 의미
  choice: 그분은 결코 변하지 않는 선이십니다
  alternative: 그분은 결코 변하지 않는 선한 분이십니다
  rationale: 원문의 명사적 ‘the good’을 보존하고, 단순한 도덕적 성품으로 축소하지 않았습니다.
- issue: appearance를 받는 대명사의 성별 변화
  choice: 그 모습은 … 그것은 … 봅니다
  alternative: 그분은 … 바라보시며 자신을 보십니다
  rationale: 증거본문이 ‘appearance’를 중성 대명사로 이어 가는 구조를 반영해, 모습 자체가 주어로 제시되는 낯선 표현을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 문답 부분은 자연스러운 존대법으로 처리하고, 신적 주체에는 일관되게 높임 표현을 적용했습니다. 병렬 찬술은 행갈이를 유지하여 원문의 장엄한 리듬을 살렸습니다. 이 초안은 제공된 공공 영역 영어 증거본문을 토대로 한 잠정 번역이며, 콥트어 사본 직접 검토가 이루어지면 ‘contingent’, ‘Beginning now’, 대명사 전환, 결락부 등을 재검토해야 합니다.
