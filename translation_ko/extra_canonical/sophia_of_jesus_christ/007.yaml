translation:
  language: ko
  text: '그분의 제자들이 다시 말했습니다. “보이지 않는 영역들에서, 곧 죽지 않는 것으로부터 죽을 수밖에 없는 세계로 그들이 어떻게 내려왔는지 저희에게 분명히 말씀해 주십시오.”


    완전한 구원자께서 말씀하셨습니다. “사람의 아들은 자신의 짝인 소피아와 결합하여, 강력한 양성적 빛을 나타냈습니다. 그 빛의 남성 이름은 ‘구원자, 만물의 낳은 이’라 불리고, 여성 이름은 ‘만물의 낳은 이 소피아’라 불리는데, 어떤 이들은 그 여성을 ‘피스티스’라고 부릅니다.[a]


    “마치 [본문 일부 소실] 빛에서 나온 한 방울처럼, 세상에 들어오는 모든 이는 그에 의해 전능자의 세계로 보내집니다. 이는 그가 그들을 지켜보게 하려는 것입니다. 그리고 소피아의 뜻에 따라 그의 망각의 사슬이 그 빛을 묶었습니다. 그리하여 이 일을 통해 전능자의 교만과 눈멂, 그리고 그에게 이름을 붙인 무지가 궁핍한 온 세상에 <드러나게> 되었습니다.[b]


    “그러나 나는 위대한 빛의 뜻에 따라 위의 처소들에서 나와, 그 사슬에서 <풀어 주고> 도둑들의 활동을 멈추게 했습니다. 나는 소피아에게서 보내진 그 한 방울을 일깨웠습니다. 이는 그것이 나를 통해 많은 열매를 맺고 완전하게 되어 다시는 결함을 지니지 않게 하려는 것입니다. 도리어 위대한 구원자인 나를 통해 <결합되어>, 그의 영광이 나타나고 소피아도 그 결함에서 바로잡히게 하려는 것입니다. 그리하여 소피아의 [본문 일부 소실] 자녀들이 다시는 결함을 지니지 않고 존귀와 영광을 얻으며, 자신들의 아버지께로 올라가 남성적 빛의 말을 깨닫게 하려는 것입니다.[c]


    “또한 여러분은 아들에 의해 보내졌습니다. 아들 자신도 보냄을 받았으니, 이는 여러분이 빛을 얻고 권세자들의 망각에서 벗어나게 하려는 것입니다. 또 그것이 여러분 때문에 다시는 나타나지 않게 하려는 것이니, 곧 그들의 남근에서 뿜어져 나온 무시무시한 불에서 생겨나는 불결한 마찰입니다. 그들의 악한 의도를 짓밟으십시오.”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소피아’는 그리스어로 ‘지혜’, ‘피스티스’는 ‘믿음’이라는 뜻이지만, 여기서는 모두 이름으로 쓰였으므로 음역했습니다.
    reason: 독자가 고유명사의 어원적 의미를 알 수 있게 하면서 본문에서는 이름의 기능을 보존하기 위해서입니다.
  - marker: b
    text: 대괄호는 전승 본문의 소실을, 꺾쇠괄호는 편집자가 문맥에 따라 복원한 말을 나타냅니다. 이 대목의 대명사들이 가리키는 대상은 분명하지 않습니다.
    reason: 현재 제공된 영어 증언이 표시하는 본문 훼손과 복원 및 지시 대상의 불확실성을 투명하게 보존하기 위해서입니다.
  - marker: c
    text: ‘그의 영광’, ‘자신들의 아버지’가 정확히 누구를 가리키는지는 문맥상 확정하기 어렵습니다.
    reason: 우주론적 인물들의 관계를 번역자가 임의로 단정하지 않기 위해서입니다.
  - marker: d
    text: ‘불결한 마찰’에 해당하는 표현은 성적이고 우주론적인 이미지를 담고 있으나, 정확한 의도는 불분명합니다.
    reason: 난해한 성적 비유를 완곡하게 삭제하거나 특정 의례·교리로 단정하지 않기 위해서입니다.
lexical_decisions:
- source_word: invisibilities
  choice: 보이지 않는 영역들
  rationale: 복수형의 우주론적 공간 개념을 살리면서 현대 한국어에서 자연스럽게 이해되도록 했습니다.
- source_word: androgynous light
  choice: 양성적 빛
  rationale: 남성과 여성의 성격을 함께 지닌 빛이라는 의미를 보존하되, 생물학적 의미로만 좁혀지는 ‘자웅동체’는 피했습니다.
- source_word: All-Begetter
  choice: 만물의 낳은 이
  rationale: ‘모든 것을 낳는 자’라는 생성의 의미를 보존하고, 특정 교리 용어를 덧씌우지 않았습니다.
- source_word: Pistis
  choice: 피스티스
  rationale: 이 문맥에서는 소피아의 별칭인 고유명사이므로 ‘믿음’으로 번역하지 않고 음역했습니다.
- source_word: fetter of his oblivion
  choice: 그의 망각의 사슬
  rationale: ‘그의’가 누구를 가리키는지 불분명한 원문의 긴장을 해소하지 않고 유지했습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 영적·우주론적 지배 세력을 가리키는 복수 명칭을 보존했습니다.
- source_word: phallus
  choice: 남근
  rationale: 성적·신체적 이미지의 노골성을 완화하거나 우회하지 않고 품위 있는 표준어로 옮겼습니다.
theological_decisions:
- issue: ‘전능자’와 그 교만·눈멂의 관계
  choice: 전능자의 교만과 눈멂으로 직접 옮김
  alternative: 괄호를 덧붙여 별개의 하위 창조자라고 해설함
  rationale: 본문의 비판적 우주론을 보존하되, 특정 종파의 체계로 명시하여 모호성을 해소하지 않았습니다.
- issue: 소피아의 결함과 회복
  choice: ‘그 결함에서 바로잡히다’로 번역
  alternative: ‘죄에서 구원받다’ 또는 ‘타락에서 회복되다’
  rationale: 원문이 말하지 않은 죄론이나 타락 교리를 도입하지 않고, defect/rectified의 대응을 유지했습니다.
- issue: 남성적 빛
  choice: ‘남성적 빛’으로 번역
  alternative: ‘남성인 빛’ 또는 신적 위격의 고유명사화
  rationale: 빛의 문법적·상징적 성격과 인격적 가능성 사이의 모호성을 보존했습니다.
- issue: 아들과 제자들의 파송
  choice: 아들이 보냄을 받았고 제자들이 아들에 의해 보내졌다는 구조를 그대로 유지
  alternative: 보낸 주체를 하나님 또는 상위 빛으로 명시
  rationale: 생략된 파송 주체를 추정하여 신학적으로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언을 토대로 한 잠정 번역입니다. 본문 훼손과 편집자 복원 표시는 각각 대괄호와 꺾쇠괄호로 유지했습니다.
