translation:
  language: ko
  text: '제자들이 [말했습니다. “주님], 찾는 이는 누구이며 [드러내는] 이는 누구입니까?”


    [주님께서 그들에게] 말씀하셨습니다. “찾는 이가 곧 [드러내는 이]입니다.”


    마태가 [다시 주님께 말했습니다. “주님], 제가 [주님의 말씀을 들을] 때와 제가 말할 때, [말하는] 이는 누구이며 듣는 이는 누구입니까?”


    [주님께서] 말씀하셨습니다. “말하는 이가 곧 [듣는 이]이며, 볼 수 있는 이가 곧 드러내는 이입니다.”


    마리아가 말했습니다. “주님, 보십시오. 제가 [몸을 입고 있는] 동안, 제 눈물은 어디에서 흘러나오며 제 웃음은 어디에서 나옵니까?”[a]


    주님께서 말씀하셨습니다. “[몸이] 자기가 한 일들 때문에 울며, [아직 해야 할] 일들 때문에도 웁니다. 정신은 [영의 열매 때문에] 웃습니다.[b] 어둠 속에 [서 있지] 않은 사람은 [빛을 볼 수 없을] 것입니다.[c]


    내가 여러분에게 말합니다. [빛이 없는 것은 무엇이든] 어둠이며, 어둠 속에 [서 있지 않은 사람은 빛을 볼 수 없을] 것입니다.[c] 그러나 [속임의 아들들은] 끌려 나갔습니다. […] 여러분은 빛을 입을 것이며, [그리하여 영원히 살] 것입니다. […] [만일 …] 그러면 위와 아래에 있는 [모든] 권세가 여러분을 가혹하게 다룰 것입니다. 그곳에서는 [모든] 것의 종말을 두고 울며 [이를 갈] 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “몸을 입고 있다”는 표현은 몸을 옷처럼 입는다는 본문의 비유를 그대로 옮긴 것입니다.
    reason: 독자가 자연스럽지 않은 표현을 번역 오류로 오해하지 않도록 비유를 설명합니다.
  - marker: b
    text: 이 문장은 공급된 영어 증언에서도 괄호와 복원 표지가 불완전합니다. “영의 열매 때문에”는 손상된 부분의 잠정적 복원입니다.
    reason: 필사본 손상과 증언 자체의 불확실성을 공개합니다.
  - marker: c
    text: “어둠 속에 서 있지 않은 사람은 빛을 볼 수 없을 것입니다”라는 역설적 문구는 공급된 증언의 복원([un]able)을 따랐습니다. 직접적인 콥트어 대조가 필요합니다.
    reason: 문맥에 맞추어 부정을 삭제하지 않고 중요한 본문 불확실성을 알립니다.
lexical_decisions:
- source_word: seeks
  choice: 찾는
  rationale: 탐구·추구의 의미를 열어 둔 채 일상적이고 직접적인 표현을 사용했습니다.
- source_word: reveals
  choice: 드러내는
  rationale: ‘계시하는’보다 자연스러우면서도 감추어진 것을 나타낸다는 의미를 보존했습니다.
- source_word: wearing a body
  choice: 몸을 입고 있는
  rationale: 몸을 옷처럼 ‘입는다’는 원문의 독특한 비유를 평준화하지 않고 유지했습니다.
- source_word: mind
  choice: 정신
  rationale: ‘마음’이나 ‘지성’으로 의미를 한정하지 않고, body 및 spirit과 구별되는 요소를 나타냈습니다.
- source_word: spirit
  choice: 영
  rationale: 문맥의 신학적·인간학적 함의를 특정 교리로 확정하지 않는 전통적이고 폭넓은 대응어입니다.
- source_word: sons of deceit
  choice: 속임의 아들들
  rationale: 셈어적 관계 표현의 낯섦을 보존하고 ‘사기꾼들’처럼 해석적으로 축소하지 않았습니다.
- source_word: powers
  choice: 권세
  rationale: 단순한 능력인지 인격적 세력인지 확정하지 않으면서 고대 종교 문헌의 용례를 반영합니다.
theological_decisions:
- issue: 찾는 이와 드러내는 이, 말하는 이와 듣는 이의 동일성
  choice: ‘곧 … 이입니다’로 동일성 진술을 그대로 보존했습니다.
  alternative: 상호 작용이나 내적 자아에 관한 설명을 덧붙일 수 있습니다.
  rationale: 본문이 그 동일성의 성격을 설명하지 않으므로 특정 신비주의적·심리학적 해석을 주입하지 않았습니다.
- issue: 몸·정신·영의 관계
  choice: 세 용어를 구별하여 번역했습니다.
  alternative: 정신과 영을 모두 ‘마음’ 또는 ‘영혼’으로 옮길 수 있습니다.
  rationale: 본문에 나타난 긴장과 구분을 유지하고 특정 인간론으로 조화시키지 않았습니다.
- issue: 어둠 속에 서 있지 않은 사람은 빛을 볼 수 없다는 역설적 진술
  choice: 영어 증언의 부정 표현을 두 차례 그대로 살렸습니다.
  alternative: 문맥상 ‘어둠 속에 서 있는 사람은 빛을 볼 수 없다’로 교정할 수 있습니다.
  rationale: 현 증언은 [un]able이라는 복원을 제시하며 직접 콥트어 검토도 미완료이므로, 난해한 표현을 임의로 바로잡지 않았습니다.
- issue: 모든 것의 종말을 두고 우는 주체
  choice: 한국어에서 주체를 명시하지 않았습니다.
  alternative: ‘그들이’ 또는 ‘여러분이’ 울 것이라고 명시할 수 있습니다.
  rationale: 공급된 증언 자체가 주체를 분명히 특정하지 않으므로 그 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 대화는 존칭을 유지하되 지나치게 고어적인 표현을 피했습니다. 대괄호와 줄임표는 필사본 손상 및 편집적 복원 신호로 보존했습니다. 이 초안은 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역이며, 나그함마디 문서 III,5의 콥트어 원문에 대한 직접 검토가 필요합니다.
