translation:
  language: ko
  text: '**구원자와의 대화 — 서문**[a]


    구원자께서 제자들에게 말씀하셨습니다.


    “형제들이여, 이제 우리가 일을 멈추고 안식 가운데 서야 할 때가 왔습니다. 안식 가운데 서는 사람은 누구나 영원히 안식할 것이기 때문입니다. 내가 여러분에게 말합니다. 언제나 [. . .] 시간성을 [. . .] 넘어서십시오. [내가] 여러분에게 [말합니다.] [. . .] 여러분을 [. . .] 이들을 두려워[하지 마십시오.] 내가 [여러분에게 말합니다.] 분노는 두려운 것이며, [분노를] 일으키는 [사람은 두려운 사람입니다.] 그러나 여러분이 [고난을 견딜 수 있었으므로], 그것이 여러분에게서 나올 수도 있습니다 [. . .].


    “사람들은 분노에 관한 이 말씀들을 두려움과 떨림으로 받아들였습니다. 아무도 분노를 피할 수 없기 때문에, 분노는 그들 위에 통치자들[b]을 세웠습니다. 그러나 내가 왔을 때, 나는 길을 열어 주었고, 선택받은 이들과 홀로 선 이들, 곧 아버지를 알고 진리에 충실한 이들에게 건너가는 길을 가르쳐 주었습니다. [] 그리고 여러분은 찬양을 드렸습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 나그함마디 문서 III,5의 콥트어 본문에 대한 직접 대조가 아직 이루어지지 않은 상태에서, 제공된 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역입니다. 본문의 대괄호와 생략점은 사본의 훼손 또는 복원된 문구를 나타내며, 빈 대괄호 []도 해당 증언의 표기를 그대로 보존한 것입니다.
    reason: 직접 원어 검토가 보류 중이라는 자료상의 한계와 본문 기호의 의미를 독자에게 투명하게 알리기 위해서입니다.
  - marker: b
    text: ‘통치자들’은 흔히 ‘아르콘들’이라고 음역되는 존재들을 가리킬 수 있습니다. 이 문헌에서 정치적 통치자들인지 우주적 권세들인지 본문만으로 지나치게 한정하지 않았습니다.
    reason: 전문 용어의 가능성을 알리면서도 특정 우주론적 해석을 본문에 강요하지 않기 위해서입니다.
lexical_decisions:
- source_word: Savior
  choice: 구원자
  rationale: 문헌의 인물 호칭을 교파적 용어로 좁히지 않으면서 현대 한국어에서 자연스럽고 존엄하게 전달했습니다.
- source_word: stand at rest / rest
  choice: 안식 가운데 서다 / 안식하다
  rationale: ‘서다’와 ‘쉬다·안식하다’가 결합된 원문 증언의 반복과 개념적 긴장을 평탄화하지 않고 보존했습니다.
- source_word: transcend
  choice: 넘어서다
  rationale: 공간적·영적 함의를 모두 열어 두는 일상적이면서도 격조 있는 표현을 택했습니다.
- source_word: temporality
  choice: 시간성
  rationale: 단순히 ‘시간’으로 환원하지 않고 추상적 성격을 보존했습니다.
- source_word: anger
  choice: 분노
  rationale: 감정과 의인화된 세력이라는 두 기능을 모두 담을 수 있는 말로 일관되게 옮겼습니다.
- source_word: archons
  choice: 통치자들
  rationale: 고대 문헌의 우주론적 전문 용어일 가능성을 각주로 밝히되, 본문에서는 이해 가능한 기능적 번역을 사용했습니다.
- source_word: elect and solitary
  choice: 선택받은 이들과 홀로 선 이들
  rationale: ‘solitary’를 수도자나 특정 공동체 신분으로 단정하지 않고 문자적·상징적 양면을 보존했습니다.
- source_word: crossing over
  choice: 건너가는 길
  rationale: 이동의 은유를 유지하면서 그 목적지나 구원론적 의미를 본문에서 임의로 확정하지 않았습니다.
theological_decisions:
- issue: ‘안식’의 성격
  choice: ‘안식 가운데 서다’라는 역설적 표현을 유지함
  alternative: ‘일을 그만두고 영원히 쉬다’로 평이하게 의역함
  rationale: 현세적 휴식인지 영적 상태인지 확정하지 않고 증언의 신학적 긴장을 보존했습니다.
- issue: 분노의 행위 주체성
  choice: ‘분노는 … 통치자들을 세웠습니다’로 의인화를 유지함
  alternative: ‘분노 때문에 통치자들이 그들을 지배했습니다’로 인과관계를 명시함
  rationale: 분노가 통치자들을 임명하는 행위 주체로 나타나는 난해한 진술을 해소하지 않았습니다.
- issue: ‘선택받은 이들과 홀로 선 이들’의 관계
  choice: 두 표현을 병렬 집단 또는 겹치는 명칭으로 모두 읽을 수 있게 둠
  alternative: ‘홀로 선 선택받은 이들’로 단일 집단화함
  rationale: 공급된 영어 증언의 통사적 모호성을 보존하고 특정 공동체론을 도입하지 않았습니다.
- issue: ‘그것이 여러분에게서 나올 수도 있다’의 지시 대상
  choice: 대명사 ‘그것’을 유지함
  alternative: ‘분노가 여러분에게서 나올 수도 있다’로 지시 대상을 확정함
  rationale: 파손된 문맥에서 지시 대상이 불확실하므로 분노로 단정하지 않았습니다.
translation_notes:
  register: 본문은 현대 표준 한국어의 격조 있는 합쇼체로 옮겼습니다. 구원자의 직접 발화는 명령과 선언의 힘을 살리되 고어투를 피했습니다. 파손·복원 표시는 공급된 증언대로 유지했으며, 불완전한 구절은 한국어 문법이 허용하는 범위에서만 연결하고 결락 내용을 추가로 추정하지 않았습니다.
