translation:
  language: ko
  text: '마태가 말했습니다. “어떻게 [. . .]?”


    [] 구원자께서 말씀하셨습니다. “[여러분이] 자기 안에 있는 것을 [질서 있게 지키지 않으면, 여러분이 한 일]은 남겠지만, 여러분은 [남지 않을 것입니다].”[a]


    유다가 [말했습니다]. “주님, 이 작은 이들에게 [속한] 영혼들이 하는 [모든] 일을 [알고 싶습니다]. 그들이 [. . .] 때, 어디에 머물겠습니까? [. . .] 영은 [. . .]?”


    주님께서 [말씀하셨습니다. “. . . 그들을 받아들이십시오]. 그들은 죽지도 멸망하지도 않습니다. 그들이 [자기들의] 동료들과 그들을 받아들일 이를 깨달았기 때문입니다. 진리는 지혜로운 이들과 의로운 이들을 찾기 때문입니다.”[b]


    구원자께서 [말씀하셨습니다]. “몸의 등불은 정신입니다. 여러분 [안에 있는 것], 곧 [영혼]이 질서 있게 유지되는 동안에는 여러분의 몸이 [빛날 것입니다]. 그러나 여러분의 마음이 어두워져 있는 동안에는, 여러분이 [] 바라는 빛이 [여러분에게서 멀리 떨어져 있을 것입니다]. 나는 곧 떠날 것이므로 [여러분을 내게로 불렀습니다]. 이는 여러분이 [서로 가운데서] 내 말을 [받아들이게 하려는 것입니다. 보십시오], 내가 그 말을 [여러분에게] 보냅니다.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 사본의 손상된 부분을 편집자가 복원한 것이며, [. . .]는 읽을 수 없거나 빠진 부분을 나타냅니다. 빈 대괄호 []도 공급된 증언의 손상 표기를 그대로 보존한 것입니다.
    reason: 독자가 확실히 남아 있는 본문과 현대 편집자의 복원을 구별할 수 있도록 하기 위함입니다.
  - marker: b
    text: ‘동료들’과 ‘그들을 받아들일 이’가 누구를 가리키는지는 손상된 문맥 때문에 분명하지 않습니다.
    reason: 지시 대상의 실제 모호성을 보존하고 특정 신학적 해석으로 단정하지 않기 위함입니다.
  - marker: c
    text: 이 번역은 나그함마디 문서 III,5의 콥트어 본문을 직접 대조하기 전, 제공된 공개 영어 번역 증언을 바탕으로 한 잠정 번역입니다.
    reason: 직접적인 원어 검토가 아직 이루어지지 않았다는 본문 비평상의 한계를 투명하게 밝히기 위함입니다.
lexical_decisions:
- source_word: Savior
  choice: 구원자
  rationale: 문헌의 호칭을 교회 전통의 특정 칭호로 좁히지 않으면서 자연스럽고 직접적으로 옮겼습니다.
- source_word: maintain in order
  choice: 질서 있게 지키다 / 질서 있게 유지되다
  rationale: 내면을 정돈한다는 해석으로 단정하지 않고, 공급된 증언이 지닌 ‘질서 있는 상태를 보존하다’라는 의미와 수동적 표현을 살렸습니다.
- source_word: work / deeds
  choice: 한 일 / 하는 일
  rationale: 첫 문맥의 단수 work와 뒤 문맥의 복수 deeds를 구별하되, ‘업적’이나 ‘공덕’ 같은 교리적 함의를 피했습니다.
- source_word: mind
  choice: 정신
  rationale: 같은 문단의 ‘마음’ 및 ‘영혼’과 구별하면서 인식과 이해의 기능을 나타내도록 옮겼습니다.
- source_word: soul / spirit
  choice: 영혼 / 영
  rationale: 증언에서 구별된 두 용어를 한국어에서도 구별하여 원문의 개념적 긴장을 보존했습니다.
- source_word: accept
  choice: 받아들이다
  rationale: 사람과 말씀 모두에 적용되는 원문의 반복을 유지하고, ‘영접하다’처럼 특정 종교 어법으로 좁아지는 것을 피했습니다.
theological_decisions:
- issue: ‘여러분이 한 일은 남지만 여러분은 남지 않는다’는 대조
  choice: 대조를 문자적으로 보존
  alternative: 행위의 결과나 구원 여부를 해설하여 풀어쓰기
  rationale: 문맥이 손상되어 있어 ‘남는다’의 존재론적·도덕적 의미를 확정할 수 없으므로 해석을 덧붙이지 않았습니다.
- issue: ‘그들’, ‘동료들’, ‘그들을 받아들일 이’의 지시 대상
  choice: 대명사와 단수·복수의 모호성을 유지
  alternative: 영혼들, 천상 존재, 또는 구원자로 명시
  rationale: 손상된 문맥만으로 지시 대상을 확정하면 특정 우주론이나 구원론을 본문에 주입하게 됩니다.
- issue: 진리가 지혜롭고 의로운 이들을 ‘찾는다’는 표현
  choice: 의인화된 표현을 그대로 유지
  alternative: 지혜롭고 의로운 이들이 진리를 찾는다고 역전
  rationale: 공급된 증언의 주어와 신학적 긴장을 보존했습니다.
- issue: 몸의 등불과 정신의 관계
  choice: ‘몸의 등불은 정신’으로 직접 번역
  alternative: 정신을 눈, 양심, 영 등으로 해석
  rationale: 인접한 ‘마음’, ‘영혼’과의 구별을 지키며 은유를 해설하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용했습니다. 서술부에는 ‘말했습니다/말씀하셨습니다’를 쓰고, 구원자와 주님의 발화에는 존엄하면서도 일반 독자가 이해하기 쉬운 문장을 사용했습니다. 사본 손상과 편집 복원 표시는 공급된 증언과 같이 보존했으며, 복원된 인칭은 한국어 문맥상 필요한 범위에서 ‘여러분’으로 드러냈습니다. 콥트어 직접 검토가 보류된 상태이므로 이 초안은 잠정적입니다.
