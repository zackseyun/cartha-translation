  revised_text: '그분은 유다와 마태와 마리아를 [데리고] 가셔서, 그들에게 하늘과 땅의 [맨 끝]을 보여 주셨습니다.[a] 그분이 그들 위에 [손]을 얹으시자, 그들은 그것을 [볼] 수 있으리라고 기대했습니다.


    유다가 위를 바라보니 아주 높은 곳이 보였고, 아래로는 심연이 있는 곳이 보였습니다.


    유다가 마태에게 말했습니다. “형제여, 거기에는 큰 지옥과 큰 공포가 있는데, 누가 이처럼 높은 곳으로 올라가거나 아래의 심연으로 내려갈 수 있겠습니까?”


    바로 그 순간, 높은 곳에서 한 말씀이 나왔습니다. 유다는 그 자리에 서서 그 말씀이 내[려오는] 모습을 보았습니다.[b]


    그가 그 말씀에게 물었습니다. “왜 내려오셨습니까?”


    인자가 그들에게 인사하며 말했습니다. “어떤 권능에서 나온 씨 하나가 온전하지 못하여 땅의 심연으로 내려갔습니다. 위엄께서 [그 씨를] 기억하시고, 그것에게 [말씀을] 보내셨습니다. 첫 말씀이 사라지지 않도록, 그 말씀이 그 씨를 위엄의 [면전]으로 들어 올렸습니다.”[c]


    [그분의] 제자들은 그분이 들려주신 모든 것에 놀랐고, 불의를 생각하는 것은 아무 소용이 없다는 것을 알면서 그 모든 것을 충실히 받아들였습니다.[d]


    그때 그분이 제자들에게 말씀하셨습니다. “선한 것은 보이는 음성과 번갯불처럼 빛으로 들어 올려질 것이라고 내가 여러분에게 말하지 않았습니까?”[e]


    그분의 모든 제자가 그분을 찬양하며 말했습니다. “주님, 주님께서 이곳에 나타나시기 전에는 누가 주님을 찬양했겠습니까? 모든 찬양이 주님의 것이기 때문입니다. 또 누가 [주님을] 복되다 했겠습니까? 모든 복이 주님의 것이기 때문입니다.”


    그들이 그곳에 서 있을 때, 그분은 두 영이 한 영혼을 함께 데려가는 것을 보셨습니다. 그리고 큰 번갯불이 번쩍였습니다. 인자에게서 한 말씀이 나왔습니다. “그들에게 그들의 옷을 주십시오!”[f]


    그러자 작은 이가 큰 이와 같아졌습니다. 그들은 위로 받아들여진 이들과 [같았습니다]. [] 그들 사이에는 [차이가 없었습니다]. 그분이 [말씀하신 말씀은 제자들을 확신시켰습니다].


    마리아가 [그분께 말했습니다. “보십시오, 저는] 사람들이 서로 함께 살아갈 때 처음부터 [그들에게 영향을 미치는] 악을 봅니다.”


    주님께서 [그녀에게] 말씀하셨습니다. “그들을 보면, 그대는 [많은 것을 압니다]. 그들은 [그곳에 함께 머물지 않을 것입니다]. 그러나 그대가 영원히 계시는 분을 보면, 그것이 위대한 광경이 될 것입니다.”[g]


    그들이 모두 그분께 말했습니다. “그것을 저희에게 설명해 주십시오.”


    그분이 그들에게 말씀하셨습니다. “여러분은 그것을 어떤 방식으로 보고 싶습니까? [사라지는] 광경으로 보고 싶습니까, 아니면 영원히 남는 광경으로 보고 싶습니까?”


    그분은 계속해서 말씀하셨습니다. “여러분 [뒤에] 남을 것을 구해 내기 위해 힘닿는 데까지 애쓰십시오. 그것을 찾고, 그 안에서 말하십시오. 그러면 여러분이 찾는 것이 무엇이든 여러분 자신과 조화를 이룰 것입니다. 내가 여러분에게 진실로 말합니다. 살아 계신 하나님께서는 여러분 안에 [계시며], [] [여러분도] 하나님 안에 [있습니다].”[h]'
