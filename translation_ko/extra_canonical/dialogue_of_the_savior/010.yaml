translation:
  language: ko
  text: '그분은 유다와 마태와 마리아를 [데리고] 가셔서, 그들에게 하늘과 땅의 [맨 끝]을 보여 주셨습니다.[a] 그분이 그들 위에 [손]을 얹으시자, 그들은 그것을 [볼] 수 있으리라고 기대했습니다.


    유다가 위를 바라보니 아주 높은 곳이 보였고, 아래로는 심연이 있는 곳이 보였습니다.


    유다가 마태에게 말했습니다. “형제여, 거기에는 거대한 불길과 큰 공포가 있는데, 누가 이처럼 높은 곳으로 올라가거나 아래의 심연으로 내려갈 수 있겠습니까?”


    바로 그 순간, 높은 곳에서 한 말씀이 나왔습니다. 유다는 그 자리에 서서 그 말씀이 내[려오는] 모습을 보았습니다.[b]


    그가 그 말씀에게 물었습니다. “왜 내려오셨습니까?”


    인자가 그들에게 인사하며 말했습니다. “어떤 권능에서 나온 씨 하나가 온전하지 못하여 땅의 심연으로 내려갔습니다. 위엄께서 [그 씨를] 기억하시고, 그것에게 [말씀을] 보내셨습니다. 첫 말씀이 사라지지 않도록, 그 말씀이 그 씨를 위엄의 [면전]으로 들어 올렸습니다.”[c]


    [그분의] 제자들은 그분이 들려주신 모든 것에 놀랐고, 불의를 생각해 보아도 아무 소용이 없음을 알면서도 그 모든 것을 믿음으로 받아들였습니다.[d]


    그때 그분이 제자들에게 말씀하셨습니다. “선한 것은 보이는 음성과 번갯불처럼 빛으로 들어 올려질 것이라고 내가 여러분에게 말하지 않았습니까?”[e]


    그분의 모든 제자가 그분을 찬양하며 말했습니다. “주님, 주님께서 이곳에 나타나시기 전에는 누가 주님을 찬양했겠습니까? 모든 찬양이 주님의 것인데 말입니다. 또 누가 [주님을] 복되다 했겠습니까? 모든 복이 주님의 것인데 말입니다.”


    그들이 그곳에 서 있을 때, 그분은 두 영이 한 영혼을 함께 데려가는 것을 보셨습니다. 그리고 큰 번갯불이 번쩍였습니다. 인자에게서 한 말씀이 나왔습니다. “그들에게 그들의 옷을 주십시오!”[f]


    그러자 작은 자가 큰 자와 같아졌습니다. 그들은 위로 받아들여진 이들과 [같았습니다]. [] 그들 사이에는 [차이가 없었습니다]. 그분이 [하신 말씀은 제자들을 확신시켰습니다].


    마리아가 [그분께 말했습니다. “보십시오, 저는] 사람들이 서로 함께 살아갈 때 처음부터 [그들에게 영향을 미치는] 악을 봅니다.”


    주님께서 [그녀에게] 말씀하셨습니다. “그들을 보면, 그대는 [많은 것을 압니다]. 그들은 [그곳에 함께 머물지 않을 것입니다]. 그러나 그대가 영원히 계시는 분을 보면, 그것이 위대한 광경이 될 것입니다.”[g]


    그들이 모두 그분께 말했습니다. “그것을 저희에게 설명해 주십시오.”


    그분이 그들에게 말씀하셨습니다. “여러분은 그것을 어떤 방식으로 보고 싶습니까? [사라지는] 광경으로 보고 싶습니까, 아니면 영원히 남는 광경으로 보고 싶습니까?”


    그분은 계속해서 말씀하셨습니다. “여러분 [뒤에] 남을 것을 구해 내기 위해 힘닿는 데까지 애쓰십시오. 그것을 찾고, 그 안에서 말하십시오. 그러면 여러분이 찾는 것이 무엇이든 여러분 자신과 조화를 이룰 것입니다. 내가 여러분에게 진실로 말합니다. 살아 계신 하나님께서는 여러분 안에 [계시며], [] [여러분도] 하나님 안에 [있습니다].”[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목은 사본이 훼손되어 여러 단어가 복원된 것입니다. 대괄호는 번역 증언에서 보충되거나 불확실한 부분을 나타냅니다.
    reason: 첫 문장의 공백과 복원 범위가 넓어 독자에게 본문 상태를 알릴 필요가 있습니다.
  - marker: b
    text: 여기서 ‘말씀’은 높은 곳에서 나와 내려오며 질문을 받는 존재처럼 묘사됩니다. 그 정확한 정체는 이 대목만으로 확정하기 어렵습니다.
    reason: 인격화된 ‘word’의 의미와 정체에 관한 모호성을 보존합니다.
  - marker: c
    text: ‘권능’, ‘씨’, ‘위엄’, ‘첫 말씀’은 이 문헌의 상징적·우주론적 용어입니다. 훼손된 본문 때문에 이들의 관계와 ‘첫 말씀’의 정확한 뜻은 불확실합니다.
    reason: 핵심 용어의 난해성과 본문 결손을 표시합니다.
  - marker: d
    text: ‘불의를 생각해 보아도 아무 소용이 없다’에 해당하는 문장은 앞뒤 논리 관계가 분명하지 않으며, 다른 방식으로 이해될 가능성이 있습니다.
    reason: 영어 증언 자체의 난해한 구문을 번역에서 과도하게 매끄럽게 만들지 않았음을 밝힙니다.
  - marker: e
    text: ‘보이는 음성’은 역설적인 원문 표현을 반영한 것입니다. ‘음성이 나타나는 것’처럼 이해할 수도 있습니다.
    reason: 감각이 혼합된 표현의 모호성과 가능한 독법을 알립니다.
  - marker: f
    text: ‘그들’이 두 영만을 가리키는지, 두 영과 한 영혼 모두를 가리키는지는 분명하지 않습니다.
    reason: 복수 대명사의 지시 대상이 모호합니다.
  - marker: g
    text: ‘그들’의 지시 대상과 ‘그곳에 함께 머물지 않을 것’이라는 복원 문구는 모두 불확실합니다.
    reason: 심각한 본문 결손과 대명사 모호성을 표시합니다.
  - marker: h
    text: 마지막 문장은 사본 결손을 포함합니다. ‘여러분 뒤에 남을 것’은 죽음 뒤에 남는 것, 뒤에 두고 갈 것, 또는 지속되는 것을 가리킬 수 있습니다.
    reason: 시간적·존재론적 의미를 하나로 확정하지 않도록 합니다.
lexical_decisions:
- source_word: word
  choice: 말씀
  rationale: 인격적으로 내려오고 질문을 받으며 파송되는 존재를 가리키므로 ‘말’보다 ‘말씀’이 문맥과 종교적 문체에 적합합니다. 다만 고유한 신학 체계로 단정하지 않도록 보통명사적 표현을 유지했습니다.
- source_word: abyss
  choice: 심연
  rationale: 물리적 깊이와 우주론적 아래 영역을 함께 나타내는 모호성을 보존합니다.
- source_word: power
  choice: 권능
  rationale: 단순한 힘뿐 아니라 인격화되거나 우주론적인 세력을 가리킬 가능성을 열어 둡니다.
- source_word: Majesty
  choice: 위엄
  rationale: 신적 존재를 가리키는 칭호의 추상성과 독특함을 보존하며 특정 전통의 통상 신명으로 대체하지 않았습니다.
- source_word: seed
  choice: 씨
  rationale: 후손, 본질의 일부, 문자적 씨앗이라는 상징적 가능성을 해석으로 좁히지 않습니다.
- source_word: spirits / soul
  choice: 영들 / 영혼
  rationale: 서로 다른 원어 개념일 가능성이 반영된 영어 증언의 구별을 그대로 유지했습니다.
- source_word: Eternally Existent One
  choice: 영원히 계시는 분
  rationale: 존재의 영속성을 나타내는 칭호를 자연스러운 한국어로 옮기되 대상의 정체를 추가로 규정하지 않았습니다.
- source_word: garments
  choice: 옷
  rationale: 의복의 상징적 의미를 설명하거나 영적 몸 등으로 치환하지 않고 구체적 비유를 보존합니다.
theological_decisions:
- issue: ‘말씀’과 인자의 관계
  choice: 본문이 둘을 구별하거나 동일시하는 정도를 확정하지 않음
  alternative: ‘말씀’을 곧 인자나 특정 신적 위격으로 명시함
  rationale: 장면 전환과 화자의 관계가 불분명하므로 원문의 긴장을 유지했습니다.
- issue: ‘권능에서 나온 씨’의 정체
  choice: 상징적 표현을 그대로 유지함
  alternative: 인간 영혼, 신적 불꽃, 선택받은 자 등으로 해석함
  rationale: 본문 자체가 씨의 정체를 명시하지 않으므로 특정 교리 체계를 도입하지 않았습니다.
- issue: 내재성 진술
  choice: ‘하나님께서는 여러분 안에… 여러분도 하나님 안에’로 상호 내재를 보존함
  alternative: 하나님과 인간의 본질적 동일성 또는 단순한 임재로 한정함
  rationale: 강한 상호 내재 표현을 약화하거나 존재론적 동일성으로 확대하지 않았습니다.
- issue: 선한 것의 승귀
  choice: ‘선한 것’이라는 중성적·추상적 표현 유지
  alternative: ‘선한 사람들’로 인격화함
  rationale: 영어 증언의 genuine ambiguity를 보존했습니다.
- issue: 작은 자와 큰 자의 동일화
  choice: 크기·지위의 차이가 사라지는 장면으로만 번역
  alternative: 구원받은 자의 완전한 평등이라는 교리적 설명 추가
  rationale: 상징의 의미를 본문 이상으로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘-했습니다’, 직접 발화는 주로 ‘-습니까/-십시오’로 통일했습니다. 사본의 대괄호 복원 표시는 유지하되, 독서를 방해하는 사본 쪽수 [16]–[18]은 제외했습니다. 빈 대괄호 []는 영어 증언에 보존된 결손 표시이므로 그대로 두었습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다.
