translation:
  language: ko
  text: '마리아가 말했습니다. “저는 모든 것을 [있는 그대로 정확히] 이해하고 싶습니다.”


    주님께서 말씀하셨습니다. “생명을 찾는 사람에게는 이것이 그의 보물이 될 것입니다. 세상이 (주는) [안식]은 거짓되고, 세상의 금과 은은 사람을 속이기 때문입니다.”


    제자들이 주님께 물었습니다. “우리의 일이 완성되려면 우리가 무엇을 해야 합니까?”


    주님께서 그들에게 [말씀하셨습니다]. “어떤 처지에서도 준비되어 있으십시오. [] [싸움을 알고 자기 눈으로] 전투를 본 사람은 복이 있습니다. 그는 죽이지도 않았고 [죽임을 당하지도] 않았으며, 오히려 승리하여 나왔습니다.”


    유다가 물었습니다. “주님, 길의 시작이 무엇인지 말씀해 주십시오.”


    주님께서 말씀하셨습니다. “사랑과 선함입니다. 이것들 가운데 하나라도 아르콘들[a] 사이에 있었더라면, 악은 결코 생겨나지 않았을 것입니다.”


    마태가 말했습니다. “주님, 주님께서는 만물의 종말에 관하여 어려움 없이 말씀하셨습니다.”


    주님께서 말씀하셨습니다. “여러분은 내가 말한 모든 것을 이해했고, 그것을 신실하게 받아들였습니다. 그것을 안다면 그것은 여러분의 것입니다. 알지 못한다면 그것은 여러분의 것이 아닙니다.”


    그들이 주님께 물었습니다. “우리는 어느 곳으로 가고 있습니까?”


    주님께서 말씀하셨습니다. “여러분이 이를 수 있는 곳을 차지하십시오.”


    마리아가 물었습니다. “이와 같이 마련된 모든 것이 보입니까?”


    주님께서 말씀하셨습니다. “볼 수 있는 사람이 곧 드러내는 사람이라고 내가 여러분에게 말했습니다.”


    열두 제자가 주님께 물었습니다. “선생님, [평온함으로] [] [. . .] 저희를 가르쳐 주십시오 [. . .].”


    주님께서 말씀하셨습니다. “[내가 여러분에게 말한] 모든 것을 [이해했다면], 여러분은 [죽지 않게 될 것입니다. 여러분이] [. . .] 모든 것을.”


    마리아가 말했습니다. “진리의 비밀에 관하여 제가 주님께 [말씀드릴] 것은 오직 한 가지입니다. 우리는 그 안에 서 있으며, 그 안에서 세상에 속한 것들에 투명하게 드러납니다.”[b]


    유다가 마태에게 말했습니다. “우리가 [육신]의 썩어 없어질 상태에서 벗어날 때 어떤 옷을 입게 될지 이해하고 싶습니다.”


    주님께서 말씀하셨습니다. “통치자들과 관리자들은 잠시만 주어지고 지속되지 않는 옷을 가지고 있습니다. 그러나 진리의 아들들인 여러분은 잠시만 지속되는 그런 옷을 입어서는 안 됩니다. 오히려 내가 여러분에게 말합니다. 여러분이 옷을 벗을 때 복이 있을 것입니다. [] [겉에 있는 것을 벗어 버리는 일은] 대단한 일이 아니기 때문입니다.”[c]


    [. . .]가 말했습니다. “말하는 이가 저이며, [. . .]을 받아들이는 이도 저입니까?”


    주님께서 말씀하셨습니다. “그렇습니다. [이성적인 방식으로] 여러분의 아버지를 [받아들이는 사람입니다].”[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아르콘’은 그리스어에서 ‘통치자’를 뜻하는 말입니다. 이 문헌에서는 세상을 지배하는 우주적 권세들을 가리킬 수 있습니다.
    reason: 낯선 전문 용어를 설명하면서 존재의 성격을 지나치게 확정하지 않기 위해서입니다.
  - marker: b
    text: ‘세상에 속한 것들에 투명하게 드러납니다’에 해당하는 표현의 정확한 뜻은 불분명합니다. 세상과 관련하여 드러나 있거나 꿰뚫어 보인다는 뜻일 수 있습니다.
    reason: 난해한 비유의 진정한 모호성을 보존하기 위해서입니다.
  - marker: c
    text: 여기서 ‘옷’과 ‘겉에 있는 것’은 상징적인 표현일 수 있으나, 본문은 그 의미를 분명히 밝히지 않습니다.
    reason: 특정한 육체관이나 구원론을 번역에 주입하지 않기 위해서입니다.
  - marker: d
    text: 마지막 문장은 사본 손상과 복원 때문에 문법과 의미가 매우 불확실합니다. ‘이성적인 방식으로’도 잠정적인 번역입니다.
    reason: 자료의 불확실성과 번역의 잠정성을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: '[rest]'
  choice: '[안식]'
  rationale: 문맥상 세상이 제공하는 쉼 또는 안식을 가리키지만 복원어이므로 대괄호를 유지했습니다.
- source_word: archons
  choice: 아르콘들
  rationale: 이 문헌의 우주론적 통치 세력을 가리킬 가능성이 있어 단순히 ‘통치자들’로 확정하지 않고 음역하고 각주로 설명했습니다.
- source_word: wealth
  choice: 보물
  rationale: 생명을 찾는 이가 얻게 되는 참된 가치라는 문맥을 자연스럽게 전달하며 물질적 부와의 대조를 살렸습니다.
- source_word: occupy
  choice: 차지하십시오
  rationale: 도달 가능한 장소를 점유하라는 강한 명령의 뉘앙스를 보존했습니다.
- source_word: transparent
  choice: 투명하게 드러납니다
  rationale: 원문의 비유적이고 불분명한 표현을 해석으로 평탄화하지 않으면서 한국어 문장으로 성립하게 했습니다.
- source_word: destructibility
  choice: 썩어 없어질 상태
  rationale: 육신의 부패 가능성과 소멸성을 함께 전달하는 평이한 표현을 택했습니다.
- source_word: garments
  choice: 옷
  rationale: 상징적 의미를 특정 교리로 해석하지 않고 원문의 구체적 비유를 그대로 유지했습니다.
- source_word: logical way
  choice: 이성적인 방식
  rationale: 제공된 증거의 어색하고 불확실한 표현을 보존하되 한국어로 직해 가능하게 옮겼습니다.
theological_decisions:
- issue: 아르콘의 정체
  choice: ‘아르콘들’로 음역
  alternative: ‘통치자들’ 또는 ‘권세자들’
  rationale: 영적 존재인지 세속 권력자인지 번역문에서 단정하지 않고 문헌 특유의 신학적 긴장을 보존했습니다.
- issue: 생명과 세상의 안식의 대조
  choice: 세상의 안식을 거짓된 것으로 진술
  alternative: ‘세상의 나머지 것’을 거짓된 것으로 진술
  rationale: 제공된 영어 증거가 [rest]를 복원하지만 확정적이지 않으므로 대괄호를 유지했습니다.
- issue: 죽지 않게 됨
  choice: '[죽지 않게 될 것입니다]'
  alternative: ‘불멸하게 될 것입니다’
  rationale: 일반 독자에게 자연스러운 표현을 사용하되 손상 본문의 복원임을 대괄호로 밝혔습니다.
- issue: 옷을 벗는 행위의 의미
  choice: 상징을 해설 없이 보존
  alternative: 육체 이탈이나 금욕으로 명시
  rationale: 원문은 옷과 외적인 것의 비유를 사용하지만 정확한 교리적 함의를 확정하지 않으므로 특정 해석을 본문에 넣지 않았습니다.
- issue: 아버지를 받는 방식
  choice: '[이성적인 방식으로]'
  alternative: ‘말씀에 합당한 방식으로’ 또는 ‘영적인 방식으로’
  rationale: 기초 증거가 불확실하므로 다른 신학적 개념으로 치환하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 화자 표지는 일관되게 서술형 존댓말로 처리했고, 주님의 직접 발화는 청자를 존중하는 명령형과 진술형으로 옮겼습니다. 대괄호는 편집적 복원, 빈 대괄호는 해결되지 않은 결락, [. . .]는 사본 손상을 나타내도록 그대로 보존했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증거에 근거한 잠정 초안입니다.
