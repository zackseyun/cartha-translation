translation:
  language: ko
  text: '《구주와의 대화》 — 창조와 할례


    유다가 물었습니다. “주님, [하늘과] 땅이 생겨나기 전에 무엇이 [존재했는지] [우리에게] 말씀해 주십시오.”


    주님께서 말씀하셨습니다. “어둠과 물이 있었고, [] 한 영이 [물] 위에 있었습니다. 내가 [진실로] 여러분에게 말합니다. 보십시오. 여러분이 찾고 물어보는 것은 여러분 안에 [있으며], 그것은 영의 능력과 [그] 비밀을 [지니고] 있습니다. 그것이 [영에게서 비롯되기] 때문입니다. 불의가 들어와 정신을 [끊임없이 파괴하려 했습니다]. 보십시오, […].”[a]


    [마태]가 말했습니다. “주님, [혼]은 어디에 자리 잡고 있으며 참된 [정신]은 어디에 머무는지 말씀해 주십시오.”


    주님께서 [말씀하셨습니다]. “영의 불이 그 둘 [사이에서] 생겨났고, 그리하여 [영]이 생겨났으며, 그들 안에는 참된 정신이 생겨났습니다. 누군가 혼을 높은 곳에 세운다면, 혼은 [높아질 것입니다].”


    마태가 주님께 물었습니다. [] “할례를 [참된 해석에 따라] 이해한다면, [할례가 필요하지 않습니까]?”


    주님께서 [말씀하셨습니다. “할례는] 여러분의 [행위보다] 더 유익합니다. 여러분을 [박해할 수 있는 것], 곧 여러분의 마음속에 있는 모든 것을 여러분 자신에게서 [제거하십시오]. 여러분의 마음이 [할례를 받는] 만큼, 위와 아래의 권세들을 이길 길을 [찾게 될] 것이기 때문입니다. 내가 여러분에게 말합니다. [권세를 지닌] 사람은 그것을 [버리고] 회개하며, [깨닫는] 사람은 찾고 발견하여 기뻐하십시오.”[b]


    유다가 말했습니다. “보십시오. [저는] 모든 것이 [정확히] [땅] 위에 있는 표징과 같다는 것을 봅니다. 바로 그 때문에 그것들이 이런 방식으로 생겨났습니다.”


    주님께서 [말씀하셨습니다]. “아버지께서 세상을 세우셨을 때, 세상의 물 가운데 일부를 [한데 모으셨고], 그 물에서 말씀이 나왔습니다. [] 그것은 많은 [고난을 겪었지만], 온 땅을 둘러싼 [별들의] 길보다 높은 곳에 있었습니다.”[c]


    [주님께서 계속 말씀하셨습니다.] “[위에] 한데 모인 물은 별들 너머에 있고, 물 [너머에는] 거대한 불바다가 ⟨있어⟩ 별들을 성벽처럼 둘러싸고 있습니다. 내부에 있던 몇몇 존재가 나머지와 갈라지자, 시간의 구간을 [계산하기 시작했습니다].


    “[전체가] 세워졌을 때, 그가 아래를 [내려다보았습니다]. 아버지께서 그것에게 말씀하셨습니다. ‘가서, 네 안에서 [무언가를 내보내라]. 그리하여 [땅에] 대대로, [세대에서] 세대로 아무것도 부족하지 않게 하여라.’[d]


    “그러자 [그것은] 자기 안에서 젖의 샘과 꿀의 샘과 기름과 포도주의 샘, 좋은 열매와 맛있는 것들과 몸에 좋은 뿌리들을 내보냈습니다. 이는 땅에 대대로, 세대에서 세대로 아무것도 부족하지 않게 하려는 것이었습니다.


    “그것은 […] 위에 있습니다. [] 서서 그 아름다움을 [드러냈습니다] […]. 그리고 바깥에는 [큰 빛이 있었는데], 그것과 닮은 빛보다 [더] 밝았습니다. 그 빛이 위와 아래의 [모든] 아이온을 다스리기 때문입니다. [빛은] 불에서 뽑혀 나와 위와 아래의 [궁창에] 흩뿌려졌습니다. 위의 하늘을 다스리는 자들과 아래의 땅을 다스리는 자들은 그것들에 매달려 있습니다. 모든 것이 그것들에 매달려 있습니다.”[e]


    유다는 이 말씀을 듣고 무릎을 꿇고 엎드려 주님을 찬양했습니다.


    [a] 대괄호는 손상된 사본의 복원 또는 불확실한 판독을, 빈 대괄호와 […]는 본문이 유실된 곳을 나타냅니다. 이 번역은 콥트어 원문 대조가 아직 이루어지지 않은 공공 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다.


    [b] 여기서 ‘할례’가 육체의 할례인지 마음의 할례인지에 관한 긴장은 그대로 두었습니다. 이어지는 문장은 마음의 할례를 말하지만, 첫 문장의 비교 대상과 논리 관계는 사본의 손상 때문에 불확실합니다.


    [c] ‘그것’이 ‘물’을 가리키는지 ‘말씀’을 가리키는지는 문맥상 분명하지 않습니다.


    [d] 이 단락의 ‘그’, ‘그것’ 및 명령을 받는 대상은 손상된 본문에서 지시 대상이 분명하지 않으므로 임의로 특정하지 않았습니다.


    [e] ‘아이온’은 긴 시대를 뜻할 수도 있고 우주적 영역 또는 존재들을 가리킬 수도 있는 말입니다. 여기서는 의미를 하나로 확정하지 않고 음역했습니다. 마지막의 ‘그것들’이 무엇을 가리키는지도 분명하지 않습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호는 손상된 사본의 복원 또는 불확실한 판독을, 빈 대괄호와 […]는 본문이 유실된 곳을 나타냅니다. 이 번역은 콥트어 원문 대조가 아직 이루어지지 않은 공공 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다.
    reason: 본문 비평 표지와 번역 기반의 한계를 독자에게 알리기 위해서입니다.
  - marker: b
    text: 여기서 ‘할례’가 육체의 할례인지 마음의 할례인지에 관한 긴장은 그대로 두었습니다. 이어지는 문장은 마음의 할례를 말하지만, 첫 문장의 비교 대상과 논리 관계는 사본의 손상 때문에 불확실합니다.
    reason: 신학적 의미를 한쪽으로 확정하지 않고 손상된 본문의 불확실성을 보존하기 위해서입니다.
  - marker: c
    text: ‘그것’이 ‘물’을 가리키는지 ‘말씀’을 가리키는지는 문맥상 분명하지 않습니다.
    reason: 영어 증언의 대명사 지시가 모호함을 밝히기 위해서입니다.
  - marker: d
    text: 이 단락의 ‘그’, ‘그것’ 및 명령을 받는 대상은 손상된 본문에서 지시 대상이 분명하지 않으므로 임의로 특정하지 않았습니다.
    reason: 우주론적 행위자의 정체를 번역자가 임의로 결정하지 않기 위해서입니다.
  - marker: e
    text: ‘아이온’은 긴 시대를 뜻할 수도 있고 우주적 영역 또는 존재들을 가리킬 수도 있는 말입니다. 여기서는 의미를 하나로 확정하지 않고 음역했습니다. 마지막의 ‘그것들’이 무엇을 가리키는지도 분명하지 않습니다.
    reason: 핵심 우주론 용어의 다의성과 대명사의 불확실성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: spirit
  choice: 영
  rationale: 창조 장면과 인간 내면에 관한 문맥 모두에서 원문의 반복과 의미적 연결을 보존했습니다.
- source_word: mind / true mind
  choice: 정신 / 참된 정신
  rationale: ‘마음’은 뒤의 할례 문맥에 사용되므로 구별하고, 인식 능력이라는 뜻을 살리기 위해 ‘정신’을 택했습니다.
- source_word: soul
  choice: 혼
  rationale: ‘영’과 구별되는 본문의 용어 대조를 유지하기 위해 ‘혼’으로 옮겼습니다.
- source_word: word
  choice: 말씀
  rationale: 인격적·우주론적 함의의 가능성을 열어 두면서도 기독교계 문헌의 격조 있는 관용을 따랐습니다.
- source_word: powers
  choice: 권세들
  rationale: 단순한 능력보다 위와 아래에 있는 우주적 세력 또는 권력의 의미를 담되 정체를 단정하지 않았습니다.
- source_word: aeons
  choice: 아이온
  rationale: ‘시대’, ‘영역’, ‘우주적 존재’ 사이의 의미적 다의성을 보존하기 위해 음역하고 각주로 설명했습니다.
- source_word: inferno
  choice: 불바다
  rationale: 거대한 불의 영역이 벽처럼 둘러싼다는 우주론적 이미지를 현대 독자가 자연스럽게 이해하도록 옮겼습니다.
theological_decisions:
- issue: 할례의 성격
  choice: 육체적 할례와 마음의 할례 사이의 긴장을 본문에 그대로 유지함
  alternative: 전체를 영적·내면적 할례로 명시함
  rationale: 질문은 할례 자체의 필요성을 묻고 답변은 마음의 할례로 이어지므로, 한쪽 의미로 환원하지 않았습니다.
- issue: ‘말씀’의 정체
  choice: ‘말씀’으로 번역하되 특정한 위격이라고 해설하지 않음
  alternative: 로고스 또는 그리스도로 명시함
  rationale: 본문은 물에서 나온 ‘말씀’을 언급하지만 그 정체를 명시하지 않으므로 후대의 교리적 동일시를 들여오지 않았습니다.
- issue: 영, 혼, 정신의 관계
  choice: 세 용어를 각각 영, 혼, 정신으로 구별함
  alternative: 모두 영혼 또는 마음으로 통합함
  rationale: 본문이 이들을 구별하며 그 관계를 논하므로 개념적 긴장을 보존했습니다.
- issue: 우주론적 대명사의 지시 대상
  choice: ‘그것’과 ‘그것들’을 유지하고 각주로 불확실성을 밝힘
  alternative: 물, 세계, 빛, 별 등 특정 대상을 보충함
