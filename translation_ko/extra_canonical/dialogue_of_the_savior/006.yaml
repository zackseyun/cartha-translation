    [마태]가 말했습니다. “주님, [혼]은 어디에 자리 잡고 있으며 참된 [정신]은 어디에 머무는지 말씀해 주십시오.”


    주님께서 [말씀하셨습니다]. “영의 불이 그 둘 [사이에서] 생겨났고, 그리하여 [영]이 생겨났으며, 그들 안에는 참된 정신이 있었습니다. 누군가 혼을 높은 곳에 세운다면, 혼은 [높아질 것입니다].”


    마태가 주님께 물었습니다. [] “할례를 [참된 해석에 따라] 이해한다면, [할례가 필요하지 않습니까]?”


    주님께서 [말씀하셨습니다. “할례는] 여러분의 [행위보다] 더 유익합니다. 여러분을 [박해할 수 있는 것], 곧 여러분의 마음속에 있는 모든 것을 여러분 자신에게서 [제거하십시오]. 여러분의 마음이 [할례를 받는] 만큼, 위와 아래의 권세들을 이길 길을 [찾게 될] 것이기 때문입니다. 내가 여러분에게 말합니다. [권세를 지닌] 사람은 그것을 [버리고] 회개하게 하며, [깨닫는] 사람은 찾고 발견하여 기뻐하게 하십시오.”[b]


    유다가 말했습니다. “보십시오. [저는] 모든 것이 [정확히] [땅] 위에 있는 표징과 같다는 것을 봅니다. 바로 그 때문에 그것들이 이런 방식으로 생겨났습니다.”


    주님께서 [말씀하셨습니다]. “아버지께서 세상을 세우셨을 때, 세상의 물 가운데 일부를 [한데 모으셨고], 그 물에서 말씀이 나왔습니다. [] 그것은 많은 [고난을 겪었지만], 온 땅을 둘러싼 [별들의] 길보다 높은 곳에 있었습니다.”[c]


    [주님께서 계속 말씀하셨습니다.] “[위에] 한데 모인 물은 별들 너머에 있고, 물 [너머에는] 거대한 불바다가 ⟨있어⟩ 그것들을 성벽처럼 둘러싸고 있습니다. 내부의 몇몇 존재가 나머지와 갈라지자, 시간의 구간을 [계산하기 시작했습니다].


    “[전체가] 세워졌을 때, 그가 아래를 [내려다보았고], 아버지께서 그것에게 말씀하셨습니다. ‘가서, 네 자신에게서 [무언가를 내보내라]. 그리하여 [땅에] 세대에서 세대로, 시대에서 시대로 아무것도 부족하지 않게 하여라.’[d]


