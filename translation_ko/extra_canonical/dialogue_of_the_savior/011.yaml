translation:
  language: ko
  text: '유다가 [말했습니다]. “저는 참으로 [모든 것을 배우고 싶습니다].”


    [주님]께서 그에게 말씀하셨습니다. “살아 계신 [하나님은] 이 결핍의 온 [영역 어디에도] 거하지 [않으십니다].”


    유다가 [물었습니다]. “누가 [우리를 다스리겠습니까]?”


    주님께서 대답하셨습니다. “[보십시오. 여기에] 남아 있게 될 것들 [가운데] 존재하는 모든 것이 [거합니다]. 여러분이 그것들을 [다스릴 것입니다].”


    유다가 말했습니다. “보십시오. 아르콘들이 우리 위에 있으니, 그들이 우리를 다스릴 것입니다.”[a]


    주님께서 대답하셨습니다. “오히려 여러분이 그들을 다스릴 것입니다. 여러분이 자신에게서 질투를 없애면, 빛을 옷 입고 혼인방에 들어갈 것입니다.”[b]


    유다가 물었습니다. “[우리의] 옷은 어떻게 우리에게 마련되겠습니까?”


    주님께서 대답하셨습니다. “어떤 이들은 그것들을 여러분에게 마련해 줄 것이고, 다른 이들은 [그것들을] 받을 것입니다. [] 바로 그들이 여러분에게 여러분의 옷을 [줄 것입니다]. 누가 그토록 [두려운] 그곳에 이를 수 있겠습니까? 그러나 생명의 옷은 사람들이 자신이 가게 될 길을 알기 때문에 그들에게 주어질 것입니다. 사실 나조차도 그곳에 이르기는 어렵습니다.”[c]


    마리아가 말했습니다. “이와 같이, 그날의 괴로움은 그날로 <충분합니다>. 일꾼은 자기 먹을 것을 받을 자격이 있습니다. 제자들은 자기 스승들과 같아질 것입니다.”[d]


    마리아는 모든 것을 이해한 여인으로서 이렇게 말했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아르콘’은 문자적으로 ‘통치자들’을 뜻하며, 이 문헌에서는 인간 위에 있는 우주적 권세들을 가리키는 전문 용어로 쓰입니다.
    reason: 낯선 음역어의 기본 의미와 문헌적 용법을 설명합니다.
  - marker: b
    text: ‘혼인방’은 이 문헌의 상징적 표현입니다. 본문은 여기서 그것이 특정 의례인지, 하늘의 장소인지, 또는 구원의 상태인지 명시하지 않습니다.
    reason: 상징의 진정한 모호성을 보존하면서 독자의 과도한 단정 해석을 막습니다.
  - marker: c
    text: 이 단락의 괄호와 빈 괄호 []는 사본의 손상 또는 번역 증언에서 복원된 부분과 공백을 나타냅니다. 특히 옷을 마련하고 받는 이들을 말하는 문장은 훼손 때문에 정확한 관계가 불분명합니다.
    reason: 심하게 훼손된 구문의 불확실성을 공개합니다.
  - marker: d
    text: 꺾쇠괄호 < >는 번역 증언에서 문맥에 따라 보충한 말을 나타냅니다. 이 세 문장은 각각 알려진 예수의 격언들과 닮았지만, 여기서는 마리아의 연속된 발언으로 제시됩니다.
    reason: 편집적 보충과 상호본문적 특징을 알리되 본문을 다른 전승에 맞추어 변경하지 않습니다.
lexical_decisions:
- source_word: archons
  choice: 아르콘들
  rationale: 이 문헌의 우주론적 통치자들을 가리키는 전문 용어의 의미 범위를 성급히 ‘권세자들’로 확정하지 않도록 음역하고 각주로 풀이했습니다.
- source_word: bridal chamber
  choice: 혼인방
  rationale: 의례적·상징적 함의를 해석으로 확정하지 않고 공간 비유를 직접 보존했습니다.
- source_word: garments of life
  choice: 생명의 옷
  rationale: ‘옷’의 상징성을 풀어 쓰지 않고 원문의 구체적 은유를 유지했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: 우주론적 전문 개념일 가능성을 보존하면서도 현대 독자가 이해할 수 있는 직접적 대응어를 택했습니다.
- source_word: students
  choice: 제자들
  rationale: 스승과 배우는 이의 관계를 나타내는 문맥에 자연스럽고, 인접한 전승의 격언 형식에도 부합합니다.
theological_decisions:
- issue: 아르콘들과 제자들의 통치 관계
  choice: ‘오히려 여러분이 그들을 다스릴 것입니다’로 대조를 분명히 하되 그 통치의 성격은 설명하지 않았습니다.
  alternative: 영적 승리나 종말론적 지배로 구체화하는 번역
  rationale: 본문 자체가 통치의 방식과 시점을 규정하지 않으므로 신학적 체계를 덧붙이지 않았습니다.
- issue: 빛을 옷 입음과 혼인방 입장
  choice: 두 상징을 그대로 병치했습니다.
  alternative: 구원·세례·특정 의례로 해설하여 번역
  rationale: 본문의 상징적 긴장과 다의성을 보존하기 위해 특정 교리나 의례와 동일시하지 않았습니다.
- issue: ‘나조차도 이르기 어렵다’의 화자와 의미
  choice: 주님의 직접 발화로 그대로 유지했습니다.
  alternative: 필사 오류로 보거나 수사적 표현으로 완화하는 번역
  rationale: 신학적으로 난해하더라도 현존 증언의 표현을 침묵 속에서 수정하지 않았습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용했습니다. 대화는 존엄하면서도 평이하게 다듬었고, 원 증언의 대괄호·빈 대괄호·꺾쇠괄호를 모두 보존했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다.
