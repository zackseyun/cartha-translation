translation:
  language: ko
  text: '**생명의 처소**[a]


    마리아가 형제들에게 물었습니다. “여러분이 인자께 여쭙는 [이런][b] 물음들을 어디에 간직하겠습니까?”


    주께서 마리아에게 [말씀하셨습니다]. “자매여, 마음속에 [] 그것들을 간직할 자리를 지닌 사람이 [아니면] [아무도] 이런 일들에 관해 물을 수 없습니다. 그런 사람은 [세상]을 떠나 [생명의] 처소로 들어갈 수 있으며, 이 가난의 세상에 붙들려 있지 않을 것입니다.”


    마태가 말했습니다. “주여, 저는 불의가 없고 오직 순수한 [빛]만 있는 [그] 생명의 처소를 [보고] 싶습니다.”


    주께서 대답하셨습니다. “형제 마태여, 그대가 육신을 입고 있는 [동안에는] 그곳을 볼 수 없습니다.”


    마태가 말했습니다. “주여, [제가] 그곳을 볼 수 없다면, 적어도 그곳을 알게 해 주십시오.”


    주께서 말씀하셨습니다. “자기 자신을 안 사람은 누구나 그곳을 보았습니다. 그는 자신에게 하도록 주어진 모든 일을 행합니다. 그러므로 그런 사람은 선함 가운데 그 처소와 [같이] 되었습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 콥트어 사본(Nag Hammadi Codex III,5)에 대한 직접 대조가 아직 이루어지지 않은 상태에서, 제공된 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역입니다.
    reason: 직접적인 원어 검토가 보류 중이라는 본문 기반의 한계를 독자에게 투명하게 밝힙니다.
  - marker: b
    text: 본문의 대괄호는 사본의 손상·공백으로 인해 번역자가 복원한 말이나 불확실한 부분을 나타냅니다. 내용이 없는 []는 복원되지 않은 공백을 나타냅니다.
    reason: 복원 표기와 사본 결락을 독자가 구별하여 이해하도록 합니다.
lexical_decisions:
- source_word: place of life
  choice: 생명의 처소
  rationale: ‘place’의 공간적 이미지를 유지하면서도 반복되는 핵심 개념에 어울리는 dignified한 표현으로 ‘처소’를 선택했습니다. ‘생명의 자리’도 가능하지만 본문의 초월적 장소 이미지를 덜 분명하게 만들 수 있습니다.
- source_word: world of poverty
  choice: 가난의 세상
  rationale: 물질적 빈곤인지 존재론적 결핍인지 확정하지 않고 원문 증언의 긴장을 보존하기 위해 직역에 가까운 표현을 택했습니다.
- source_word: wear the flesh
  choice: 육신을 입고 있다
  rationale: 육체를 옷처럼 입는 원문의 은유를 보존했습니다. 단순히 ‘살아 있다’로 풀어 쓰면 본문의 인간론적 함의를 과도하게 해석하게 됩니다.
- source_word: known himself
  choice: 자기 자신을 알다
  rationale: 후대의 특정 교리 체계로 환원하지 않고 자기 인식이라는 문면을 그대로 유지했습니다.
- source_word: in goodness
  choice: 선함 가운데
  rationale: 이 구절이 사람의 성품, 상태, 혹은 처소와 닮게 되는 방식 가운데 무엇을 가리키는지 단정하지 않도록 다소 열린 표현을 사용했습니다.
theological_decisions:
- issue: ‘생명의 처소’가 실제 장소인지 영적 상태인지
  choice: 일관되게 ‘처소’로 번역하되 어느 한 해석으로 규정하지 않음
  alternative: ‘생명의 경지’ 또는 ‘생명의 상태’
  rationale: 마태가 그곳을 ‘보다’라고 말하고 주께서 ‘들어가다’라고 하시는 공간적 언어를 보존하면서도 상징적 의미의 가능성을 닫지 않았습니다.
- issue: ‘자기 자신을 아는 것’과 생명의 처소를 보는 것의 관계
  choice: 원문의 직접적인 등치 진술을 그대로 유지함
  alternative: 자기 자신을 알면 그 처소를 깨닫게 된다고 해설적으로 번역함
  rationale: 인식과 봄의 관계를 설명하거나 특정 구원론으로 체계화하지 않고 본문의 신학적 긴장을 보존했습니다.
- issue: 마지막 문장의 ‘그 처소와 같이 되었다’
  choice: 비교 대상을 ‘그 처소’로 유지함
  alternative: ‘그 처소에 합당하게 되었다’ 또는 ‘그 처소에 이르렀다’
  rationale: 합당성이나 도달이라는 개념을 보충하지 않고, 다소 이례적인 유사성 표현 자체를 살렸습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 대화는 자연스럽게 다듬되 반복되는 ‘처소’, ‘보다’, ‘알다’의 연결을 유지했고, 사본 복원 표시는 영어 증언에 나타난 형태대로 보존했습니다. ‘형제’, ‘자매’, ‘주여’는 문헌의 고대 종교적 분위기를 살리는 범위에서 사용했습니다.
