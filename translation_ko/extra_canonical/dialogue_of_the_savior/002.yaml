translation:
  language: ko
  text: '“여러분이 찬양을 드릴 때에는 이렇게 하십시오.


    아버지, 저희의 말을 들어 주십시오.

    아버지의 외아들의 말을 들어 주시고,

    그를 아버지께로 받아들이셨던 것처럼 하여 주십시오.

    [아버지께서는] 그가 많은 [수고]에서 벗어나 안식을 누리게 하셨습니다.

    저희의 능력은 [꺾이지 않습니다].

    [이는] 아버지의 전투 대오가 [꺾이지 않기 때문입니다].

    [……] 빛 [……] 살아 있는 [……] 다가갈 수 없는 […… 살아 있는].

    [참된] 말씀은 생명에 이르는 회개를 [주셨으며],

    [이것은] 아버지에게서 [나왔습니다].

    아버지는 홀로 있는 이의 생각이며 완전한 고요이십니다.[a]

    다시 한번 저희의 말을 들어 주십시오.

    아버지께서 택하신 이들의 말을 들어 주셨던 것처럼 하여 주십시오.

    아버지의 희생으로 택하신 이들이 들어갈 것입니다.[b]

    그들은 선한 행실로 눈먼 육체의 지체들에서 자기 영혼을 해방하였습니다.[c]

    그리하여 영원히 [] 존재할 수 있게 하였습니다.

    아멘.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘홀로 있는 이’는 독신자, 고독한 사람 또는 단독자를 뜻할 수 있습니다. 현재의 증언만으로는 어느 의미인지 확정하기 어렵습니다.
    reason: 의미가 여러 갈래인 표현의 모호성을 보존하고 독자의 오해를 줄이기 위해서입니다.
  - marker: b
    text: ‘아버지의 희생으로’는 아버지가 행하신 희생 또는 아버지와 관련된 제사를 가리킬 수 있습니다.
    reason: 소유격 관계와 제의적 의미가 불확실하므로 한 해석으로 고정하지 않기 위해서입니다.
  - marker: c
    text: 이 문장은 선한 행실이 영혼을 ‘눈먼 육체의 지체들’에서 해방한다고 말합니다. 훼손된 문맥과 표현의 특성상 그 정확한 사상적 함의는 불확실합니다.
    reason: 본문의 신학적 긴장을 그대로 두고 후대 교리로 조화시키지 않기 위해서입니다.
lexical_decisions:
- source_word: offer up praise
  choice: 찬양을 드리다
  rationale: 제의적 뉘앙스를 살리면서도 현대 한국어 예배 문맥에서 자연스럽고 격조 있게 들리도록 옮겼습니다.
- source_word: only Son
  choice: 외아들
  rationale: 유일한 아들이라는 관계적 의미를 간결하게 전달하되, 특정 교리적 해석을 덧붙이지 않았습니다.
- source_word: rest
  choice: 안식
  rationale: 단순한 휴식보다 종교 문헌에서의 깊은 쉼과 완결의 함의를 보존합니다.
- source_word: battle forces
  choice: 전투 대오
  rationale: 군사적 집단 또는 진영이라는 이미지를 유지하면서 ‘군대’로 의미를 지나치게 확정하지 않았습니다.
- source_word: the solitary
  choice: 홀로 있는 이
  rationale: 금욕자, 독신자, 단독자 가운데 하나로 특정하지 않고 원문의 의미적 폭을 보존했습니다.
- source_word: bodily limbs
  choice: 육체의 지체들
  rationale: 신체의 기관 또는 부분을 가리키는 표현을 유지하고, 육체 자체와 동일시하지 않았습니다.
theological_decisions:
- issue: ‘your sacrifice’가 아버지가 행한 희생인지 아버지께 드린 제사인지
  choice: 아버지의 희생으로
  alternative: 아버지께 드린 제사로
  rationale: 영어 증언의 소유격이 지닌 모호성을 가능한 한 유지했으며, 희생의 주체나 방향을 교리적으로 확정하지 않았습니다.
- issue: 선한 행실과 영혼의 해방 사이의 관계
  choice: 그들은 선한 행실로 … 자기 영혼을 해방하였습니다
  alternative: 그들의 선한 행실이 … 영혼을 해방하였습니다
  rationale: 증언 본문의 직접적인 인과 진술을 보존하되, 이를 후대의 구원론 체계로 해설하거나 완화하지 않았습니다.
- issue: ‘thought’의 존재론적 의미
  choice: 생각
  alternative: 사유 / 정신
  rationale: ‘thought’를 추상적 원리나 특정 영지주의 전문 용어로 확정하지 않고 일반적 의미를 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 기도 부분에서는 ‘아버지’를 반복하여 호칭 관계를 분명히 했습니다. 대괄호와 말줄임표는 사본 훼손 및 편집자 복원 표지를 그대로 보존했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다.
