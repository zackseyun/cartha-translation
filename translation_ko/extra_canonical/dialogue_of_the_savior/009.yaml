translation:
  language: ko
  text: '“완전함의 행위를 [알지 못하는] 사람은 아무것도 알지 못합니다.[a]


    “어둠 속에 서 있지 않는 사람은 […] 빛을 볼 수 없습니다.[b]


    “불이 어떻게 생겨났는지 [깨닫지] 못하는 사람은 그 기원을 알지 못한 채 그 불 속에서 타 버릴 것입니다.


    “먼저 물을 깨닫지 못한다면, 그 사람은 아무것도 알지 못합니다. 그런 사람이 그 물로 세례를 받은들 무슨 유익이 있겠습니까?


    “불어오는 바람이 어떻게 생겨났는지 깨닫지 못하는 사람은 그 바람과 함께 휩쓸려 갈 것입니다.


    “자기가 입고 있는 몸이 어떻게 생겨났는지 깨닫지 못하는 사람은 그 몸과 함께 멸망할 것입니다.


    “또 아들을 알지 못하는 사람이 어떻게 [아버지]를 알겠습니까?


    “만물의 뿌리를 알지 못하는 사람에게는 모든 것이 감추어져 있습니다.


    “불의의 뿌리를 알지 못하는 사람에게 불의는 낯선 것이 아닙니다.


    “자신들이 어떻게 왔는지 깨닫지 못하는 사람들은 자신들이 어떻게 떠날지도 깨닫지 못할 것입니다.


    “그리고 이 세상에 낯설지 않은 사람은 [자기를 높이고], 그리하여 낮아질 것입니다.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 손상되거나 빠진 필사본 본문을 편집자가 복원한 것입니다. 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 원문 대조가 남아 있습니다.
    reason: 복원 표지를 설명하고 직접 원문 검토가 아직 이루어지지 않았다는 본문 상태를 투명하게 밝히기 위해서입니다.
  - marker: b
    text: ‘[…]’는 이 지점에 판독하거나 복원하지 못한 결락이 있음을 나타냅니다.
    reason: 결락을 추정으로 메우지 않고 독자에게 원문 상태를 알리기 위해서입니다.
  - marker: c
    text: 마지막 문장은 제공된 영어 증언에서 ‘이 세상에 낯설지 않다’, ‘자기를 높이다’, ‘낮아지다’의 관계가 압축적으로 표현되어 있어 뜻과 구문에 여지가 있습니다.
    reason: 모호한 문장 관계를 하나의 확정적 신학 해석으로 고정하지 않기 위해서입니다.
lexical_decisions:
- source_word: deed of completeness
  choice: 완전함의 행위
  rationale: ‘completeness’의 상태와 ‘deed’의 행위성을 모두 보존하고, 이를 특정 교리 용어로 좁히지 않았습니다.
- source_word: stands not in the darkness
  choice: 어둠 속에 서 있지 않는
  rationale: 문맥상 역설적으로 들리더라도 증언 본문의 부정 표현을 고쳐 해소하지 않고 그대로 보존했습니다.
- source_word: knows / understands
  choice: 알다 / 깨닫다
  rationale: 제공된 증언이 구별하는 ‘knows’와 ‘understands’를 가능한 범위에서 각각 ‘알다’와 ‘깨닫다’로 옮겼습니다.
- source_word: the body he wears
  choice: 자기가 입고 있는 몸
  rationale: 몸을 옷처럼 ‘입는다’는 원문의 비유를 평면화하지 않고 유지했습니다.
- source_word: root of iniquity
  choice: 불의의 뿌리
  rationale: ‘iniquity’를 특정한 죄목이나 교리 체계로 제한하지 않는 넓은 표현을 택했습니다.
- source_word: no stranger to
  choice: 낯선 것이 아니다 / 낯설지 않다
  rationale: ‘그것과 무관하지 않다’ 또는 ‘그것에 익숙하다’는 함의를 지니는 원문의 간접 표현을 보존했습니다.
theological_decisions:
- issue: 어둠과 빛에 관한 역설
  choice: ‘어둠 속에 서 있지 않는 사람은 … 빛을 볼 수 없습니다’로 부정문을 유지함
  alternative: ‘어둠 속에 서 있는 사람은 빛을 볼 수 없습니다’로 문맥을 교정함
  rationale: 제공된 증언 자체의 긴장과 필사본 결락을 번역자가 임의로 해소하지 않았습니다.
- issue: 물과 세례의 관계
  choice: 물을 먼저 깨닫는 것과 세례의 유익 사이의 조건적 질문을 그대로 제시함
  alternative: 세례의 효력이나 무효에 관한 교리적 진술로 풀이함
  rationale: 본문은 수사적 질문을 제시할 뿐이므로 특정 성례론을 덧붙이지 않았습니다.
- issue: 몸과 함께 멸망한다는 진술
  choice: ‘몸과 함께 멸망할 것입니다’로 직역에 가깝게 유지함
  alternative: 육체를 악한 것으로 규정하거나 영혼의 구원을 명시함
  rationale: 본문에 없는 이원론적 또는 교파적 해석을 추가하지 않았습니다.
- issue: 마지막 문장의 높아짐과 낮아짐
  choice: 복원된 ‘자기를 높이고’와 그 결과인 ‘낮아질 것’을 연결함
  alternative: 자기 비하나 심판 등 구체적 신학 의미를 명시함
  rationale: 증언 본문의 인과관계를 살리되 행위의 주체와 신학적 원인을 과도하게 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 반복되는 지혜 격언의 리듬을 살리기 위해 ‘…사람은’ 구조를 유지하되, 수사적 질문은 자연스러운 현대어로 다듬었습니다. 제공 자료상 콥트어 직접 검토가 보류되어 있으므로 복원과 결락을 표시하고 번역의 잠정성을 각주에 명시했습니다.
