translation:
  language: ko
  text: '유다가 대답하여 말했습니다. “주님, 말씀해 주십시오. [지진의] 흔들림은 어떻게 땅을 흔듭니까?”[a]


    주님께서는 돌 하나를 집어 손에 드셨습니다. [그분이 그에게 말씀하셨습니다. “내가] 손에 무엇을 들고 있느냐?”[b]


    그가 대답했습니다. “[그것은] 돌입니다.”


    그분이 그들에게 말씀하셨습니다. “그 [땅]을 떠받치는 것은 하늘을 떠받치는 것과 같은 것이다. 한 말씀이 ‘위엄’으로부터 나올 때, 그것은 하늘과 땅을 떠받치는 것과 마주하게 될 것이다. 땅은 움직이지 않을 것이다. 땅이 움직인다면 무너져 내릴 것이지만, 첫 말씀이 실패하지 않도록 움직이지 않는다. 그 말씀은 세상을 세웠고, 그 안에서 살았으며, 그 향기를 맡았다. 사람의 아들들인 너희 모두에게, 나는 움직이지 않는 모든[것]을 선포한다.[c] 너희가 그곳에서 왔기 때문이다. 너희는 기쁨과 진리 안에서 말하는 이들의 마음속에 산다. 그 말씀이 아버지의 몸에서 나와 사람들 가운데 이르렀는데도 그들이 받아들이지 않으면, 그것은 자기 자리로 되돌아갈 것이다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘[지진의]’는 손상되거나 불분명한 본문을 편집자가 복원한 말입니다. 질문의 반복적인 어법은 증언문을 따라 보존했습니다.
    reason: 편집 복원과 원문의 난해한 중복 표현을 알립니다.
  - marker: b
    text: 이 문장 앞부분은 사본이 손상되어 복원된 부분입니다.
    reason: 대괄호가 표시하는 본문 상태를 설명합니다.
  - marker: c
    text: ‘모든[것]’의 일부는 편집자가 복원한 것입니다. ‘사람의 아들들’은 원 증언의 복수 표현을 직역한 것으로, 단수 칭호 ‘사람의 아들’과 동일하다고 단정할 수 없습니다.
    reason: 부분 복원과 신학적으로 중요한 복수형을 독자에게 알립니다.
lexical_decisions:
- source_word: '[earthquake] shaking'
  choice: '[지진의] 흔들림'
  rationale: 편집자가 복원한 말과 이어지는 ‘흔들림’을 모두 보존하여 원문의 중복적 표현과 본문 손상 상태를 드러냈습니다.
- source_word: Majesty
  choice: ‘위엄’
  rationale: 신적 호칭일 가능성을 살리기 위해 따옴표와 고유 호칭에 준하는 표현을 사용하되, 특정 교리적 명칭으로 확정하지 않았습니다.
- source_word: a word / the word / first word
  choice: 한 말씀 / 그 말씀 / 첫 말씀
  rationale: 문맥상 인격화 가능성이 있으나 이를 단정하지 않고, 한국어에서 신학적 무게와 일반 명사의 양쪽 가능성을 유지하도록 ‘말씀’을 사용했습니다.
- source_word: Sons of Man
  choice: 사람의 아들들
  rationale: 익숙한 단수 칭호 ‘인자’로 바꾸지 않고 복수형과 낯선 표현을 그대로 보존했습니다.
- source_word: Father’s body
  choice: 아버지의 몸
  rationale: 은유를 ‘품’이나 ‘본질’로 해석해 풀지 않고 신체적 표현을 직접 보존했습니다.
theological_decisions:
- issue: ‘말씀’의 인격성
  choice: 대명사 ‘그것’을 사용하면서 ‘말씀’의 인격화된 행위 표현은 그대로 유지했습니다.
  alternative: ‘그분’으로 받아 완전히 인격적 존재로 번역할 수 있습니다.
  rationale: 본문은 말씀이 세상을 세우고 살며 향기를 맡았다고 하지만, 제공된 증거만으로 특정한 기독론적 동일시를 확정하지 않는 것이 적절합니다.
- issue: 첫 말씀과 땅의 불변성 사이의 관계
  choice: ‘첫 말씀이 실패하지 않도록’으로 목적 관계를 그대로 옮겼습니다.
  alternative: ‘첫 말씀이 헛되지 않았음을 보여 주려고’처럼 설명적으로 번역할 수 있습니다.
  rationale: 난해한 논리와 신학적 긴장을 해소하지 않고 증언문에 나타난 관계를 보존했습니다.
- issue: ‘그곳’의 지시 대상
  choice: ‘그곳’을 그대로 두었습니다.
  alternative: ‘움직이지 않는 곳’ 또는 ‘위엄이 계신 곳’으로 명시할 수 있습니다.
  rationale: 선행 문맥에서 지시 대상이 확실하지 않으므로 해석을 본문에 삽입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 인물의 직접 발화에서는 존대 질문과 평서형을 문맥에 맞게 구분했습니다. 대괄호는 사본 손상 또는 편집 복원을 나타내므로 모두 유지했고, 문장을 방해하던 사본 쪽수 13과 14는 본문에서 제외했습니다. 콥트어 직접 검토가 아직 이루어지지 않았으므로 제공된 공공영역 영어 증언에 근거한 잠정 번역입니다.
