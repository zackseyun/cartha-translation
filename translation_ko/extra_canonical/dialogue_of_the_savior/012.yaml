review_pass:
  verdict: revise
  source_fidelity: 대체로 영어 증언의 대조와 괄호·꺾쇠괄호 표지를 충실히 보존합니다. 다만 ‘[You have] asked’에서 편집 보충 표지인 대괄호가 한국어 본문에서 빠졌으며, ‘forsaken (by)’의 불명시된 행위자를 ‘진리’로 확정한 것은 증언보다 해석적입니다. 마리아의 마지막 발화도 결락 뒤의 단편적 어순과 수식 관계를 더 투명하게 보존할 필요가 있습니다. 콥트어 직접 대조가 보류된 상태이므로, 평가는 제공된 영어 증언을 기준으로 한 잠정적 검토입니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체이며 대화문도 자연스럽습니다. ‘그의 빛’, ‘충만함’, ‘결핍’, ‘안식’은 의도적인 낯섦을 유지하면서도 읽을 수 있습니다. 마지막 마리아의 발화는 원문의 손상 상태 때문에 완전한 한국어 문장으로 매끈하게 만들기보다 단편성을 드러내는 편이 정확합니다.
  terminology: ‘충만함/결핍’, ‘진리’, ‘사람을 살아 있게 하는 것’, ‘안식’, ‘짐들’의 선택은 영어 증언의 개념적 대조와 모호성을 적절히 보존합니다. ‘여자’ 역시 원문의 표현을 완화하거나 교리화하지 않아 적절합니다.
  issues:
  - severity: medium
    issue: ‘[You have] asked’의 대괄호 표지가 본문에서 누락되었습니다.
    rationale: 영어 증언은 주어·조동사에 해당하는 부분을 편집 보충으로 표시합니다. 한국어도 ‘[너희는] 내게 물었다’로 표시하여 본문 상태를 보존해야 합니다.
  - severity: medium
    issue: ‘a place that is forsaken (by)’를 ‘진리에게 버림받은 곳’으로 번역하여 생략된 행위자를 확정했습니다.
    rationale: 증언의 괄호 친 ‘(by)’는 버린 주체가 본문상 불명시되어 있음을 나타냅니다. ‘버림받았거나 진리가 없는 곳’으로 옮기면 행위자 미상의 상태와 뒤따르는 대안을 보존할 수 있습니다.
  - severity: medium
    issue: 마리아의 마지막 발화에서 결락 뒤의 ‘even [like a consuming fire] to those who know [you] not’가 완결 문장 안에 재배열되어 단편성과 연결이 다소 불투명합니다.
    rationale: 결락과 보충구가 있는 문장을 억지로 완결시키지 않고, ‘[…] 주님을 알지 못하는 이들에게조차 [삼키는 불처럼].’처럼 단편으로 두면 증언의 손상 상태와 어순을 더 잘 반영합니다.
  revised_text: '제자들이 그분께 물었습니다. “충만함이란 무엇이며, 결핍이란 무엇입니까?”


    그분께서 대답하셨습니다. “너희는 충만함에서 왔으며, 결핍의 처소에 머물고 있다.


    보아라, 그의 빛이 내 위에 쏟아져 내렸다.”[a]


