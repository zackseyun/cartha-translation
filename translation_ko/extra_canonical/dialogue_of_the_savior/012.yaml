translation:
  language: ko
  text: '제자들이 그분께 물었습니다. “충만함이란 무엇이며, 결핍이란 무엇입니까?”


    그분께서 대답하셨습니다. “너희는 충만함에서 왔으며, 결핍의 처소에 머물고 있다.


    보아라, 그의 빛이 내 위에 쏟아져 내렸다.”[a]


    마태가 물었습니다. “주님, 죽은 이들이 어떻게 죽으며 살아 있는 이들이 어떻게 사는지 말씀해 주십시오.”


    […][b] 주님께서 말씀하셨습니다. “너희는 눈으로 본 적이 없는 [참된] 말씀에 관하여 내게 물었다.[c] 그리고 나는 그것을 오직 너희에게서만 들었다. 그러나 내가 너희에게 말한다. 사람을 살아 있게 하는 것이 그에게서 제거되면 그는 죽었다고 불릴 것이며, 살아 있는 것이 죽은 것 안으로 <들어가면> 그것은 살아 있다고 불릴 것이다.”[d]


    유다가 물었습니다. “진실로 말씀해 주십시오. 어째서 어떤 이들은 <죽고> 어떤 이들은 삽니까?”[e]


    주님께서 말씀하셨습니다. “진리에서 나오는 것은 무엇이든 죽지 않을 것이다. 여자에게서 나오는 것은 무엇이든 죽을 것이다.”


    마리아가 물었습니다. “주님, 제가 이곳에 온 것은 얻기 위해서입니까, 아니면 잃기 위해서입니까?”


    주님께서 대답하셨습니다. “너는 드러내는 이의 풍요를 드러낸다.”[f]


    마리아가 그분께 물었습니다. “주님, 그렇다면 진리에게 버림받았거나 진리가 없는 곳이 있습니까?”[g]


    주님께서 말씀하셨습니다. “내가 머물지 않는 곳이다.”


    마리아가 말했습니다. “주님, 주님을 알지 못하는 이들에게 주님은 두려움과 경이를 불러일으키십니다. […] 심지어 [삼키는 불과도 같습니다].”[h]


    마태가 물었습니다. “어째서 우리는 당장 안식하지 못합니까?”


    주님께서 말씀하셨습니다. “너희가 가지고 갈 수 없는 것을 뒤에 남겨 둘 때, 그제야 안식할 것이다.”


    마태가 물었습니다. “작은 것이 어떻게 큰 것과 조화를 이룹니까?”


    주님께서 말씀하셨습니다. “이 짐들을 뒤에 남겨 둠으로써 그렇게 된다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의’가 누구를 가리키는지는 전승된 문맥만으로 분명하지 않습니다.
    reason: 대명사 선행사의 진정한 모호성을 독자에게 알립니다.
  - marker: b
    text: 이 지점에는 사본의 결락 또는 판독할 수 없는 부분이 있습니다.
    reason: 영어 증언의 빈 대괄호가 나타내는 본문 손상을 가시화합니다.
  - marker: c
    text: 대괄호 안의 ‘참된’은 손상된 본문을 편집자가 보충한 말입니다.
    reason: 복원된 낱말을 확정 본문과 구별합니다.
  - marker: d
    text: 꺾쇠괄호 안의 ‘들어가면’은 문맥에 따라 편집자가 보충한 말입니다.
    reason: 영어 증언에 표시된 편집적 보충을 보존합니다.
  - marker: e
    text: 꺾쇠괄호 안의 ‘죽고’는 편집자가 보충한 말입니다.
    reason: 본문 복원 상태를 투명하게 표시합니다.
  - marker: f
    text: ‘드러내는 이’가 누구인지, 또 ‘풍요’가 무엇을 뜻하는지는 이 문장 자체로 확정하기 어렵습니다.
    reason: 의도적으로 압축된 신학적 표현을 하나의 해석으로 고정하지 않습니다.
  - marker: g
    text: 이 질문은 ‘진리에게 버림받은 곳’과 ‘진리가 없는 곳’이라는 두 가지로 이해될 수 있습니다.
    reason: 영어 증언에 보존된 문법적·의미론적 양면성을 드러냅니다.
  - marker: h
    text: 이 문장은 사본이 손상되어 있으며, ‘삼키는 불과도 같습니다’는 복원된 구절입니다.
    reason: 결락과 편집적 복원이 함께 있는 상태를 설명합니다.
lexical_decisions:
- source_word: fullness
  choice: 충만함
  rationale: 추상적·우주론적 함의를 특정 교리 체계로 좁히지 않으면서 원문의 fullness와 deficiency의 대조를 보존했습니다.
- source_word: deficiency
  choice: 결핍
  rationale: ‘부족함’보다 명사적 대조가 선명하며, 존재 상태와 장소를 함께 가리킬 수 있는 열린 표현입니다.
- source_word: what animates a person
  choice: 사람을 살아 있게 하는 것
  rationale: 이를 곧바로 ‘영혼’이나 ‘영’으로 규정하지 않고 원문의 기능적이고 모호한 표현을 유지했습니다.
- source_word: truth
  choice: 진리
  rationale: 발언 전체에서 반복되는 핵심 추상명사를 일관되게 옮겼습니다.
- source_word: woman
  choice: 여자
  rationale: ‘여자에게서 나오는 것’이라는 원문의 거친 보편 진술을 완화하거나 ‘육신’으로 교리화하지 않았습니다.
- source_word: rest
  choice: 안식하다
  rationale: 단순한 휴식뿐 아니라 종말론적·영적 뉘앙스도 열어 두되, 특정 교리로 한정하지 않는 성서적 문체를 택했습니다.
- source_word: burdens
  choice: 짐들
  rationale: 앞의 ‘가지고 갈 수 없는 것’과 연결되는 구체적 비유를 살렸습니다.
theological_decisions:
- issue: ‘his light’의 지시 대상
  choice: ‘그의 빛’으로 그대로 보존
  alternative: ‘그분의 빛’ 또는 ‘하나님의 빛’으로 명시
  rationale: 제공된 증거만으로 대명사의 선행사를 확정할 수 없으므로 모호성을 해소하지 않았습니다.
- issue: 사람에게 생명을 주는 요소의 정체
  choice: ‘사람을 살아 있게 하는 것’
  alternative: ‘영혼’ 또는 ‘영’
  rationale: 원문 증거가 특정 인간론적 용어를 명시하지 않으므로 교리적 동일시를 피했습니다.
- issue: ‘진리에서/여자에게서 나오는 것’의 의미
  choice: 출처를 나타내는 병행 구조를 직역에 가깝게 유지
  alternative: ‘영적인 것은/육적인 것은’로 해석
  rationale: 진리와 여자의 대조가 지닌 신학적 긴장을 보존하고 후대의 이원론적 체계로 치환하지 않았습니다.
- issue: ‘rest’의 의미
  choice: ‘안식하다’
  alternative: ‘쉬다’ 또는 ‘구원받다’
  rationale: 일상적 휴식과 궁극적 안식의 가능성을 모두 남기며, 이를 직접 ‘구원’으로 해석하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술부는 존대 과잉을 피하면서도 예수에 대해서는 ‘그분’, 호칭에서는 ‘주님’을 사용했습니다. 문장은 일반 독자가 이해할 수 있도록 자연스럽게 다듬되, ‘충만함/결핍’, ‘진리’, ‘안식’ 같은 핵심 개념의 낯섦과 긴장은 유지했습니다. 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조가 아직 필요합니다.
