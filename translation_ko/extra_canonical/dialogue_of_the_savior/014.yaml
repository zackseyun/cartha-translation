review_pass:
  verdict: revise
  source_fidelity: 영어 증거 본문과 대조한 결과, 전반적인 내용·화자 구분·반복되는 ‘일들’ 및 전문 용어의 처리는 충실합니다. 다만 원문의 빈 대괄호([])를 줄임표 대괄호([…])로 바꾼 부분과, ‘내가 그것을 없앨 때마다’에서 원문상 보충된 대명사의 대괄호를 누락한 부분은 손상·복원 표지의 충실성을 해칩니다. ‘그들에 맞설 준비’는 ‘prepared for them’의 방향성을 다소 좁히므로 중립적으로 고쳤습니다. 콥트어 직접 대조가 보류되어 있으므로 이 평가는 제공된 영어 공용영역 증거에 대한 잠정 검토입니다.
  naturalness: 합쇼체는 일관되고 대화체도 현대 표준 한국어로 자연스럽습니다. 다만 ‘참된 마음에서 말씀하셨습니다’는 한국어 결합이 다소 어색하여 ‘참된 마음에서 우러나’로 다듬었고, 손상 표지는 빈 대괄호로 정확히 보존했습니다.
  terminology: ‘아르콘’, ‘아이온’, ‘만물의 어머니’, ‘일들’, ‘해체하다’는 원문의 우주론적·반복적 어휘를 과도하게 교리화하지 않고 잘 보존합니다. ‘여자/여성’의 구별도 문맥상 유지했습니다. ‘생명을 낳습니다’는 generative의 생성·출산 어휘를 살리는 안전한 번역으로 유지했습니다.
  issues:
  - severity: medium
    issue: 빈 결락 표지 []가 […]로 변경됨
    rationale: 영어 증거는 빈 대괄호를 보존합니다. […]는 복원 불능의 생략을 별도로 암시할 수 있으므로, 본문의 물리적 손상·편집 복원 상태를 바꾸지 않도록 []로 유지해야 합니다.
  - severity: medium
    issue: ‘내가 그것을 없앨 때마다’의 보충 대명사 표지가 일부 누락됨
