translation:
  language: ko
  text: '마리아가 물었습니다. “겨자씨는 [어떤] 종류입니까? 하늘에 속한 것입니까, 아니면 땅에 속한 것입니까?”[a]


    주님께서 말씀하셨습니다. “아버지께서 자신을 위하여 세상을 세우신 뒤, 남아 있던 많은 것을 만물의 어머니에게 남겨 두셨습니다. 그 때문에 그는 씨를 뿌리고 일합니다.”


    유다가 말했습니다. “주님께서는 참된 마음에서 이것을 우리에게 말씀하셨습니다. 우리가 기도할 때에는 어떻게 기도해야 합니까?”


    주님께서 말씀하셨습니다. “여자가 없는 곳에서 기도하십시오.”


    마태가 말합니다. “그분은 우리에게 ‘여자가 없는 곳에서 기도하십시오’라고 말씀하십니다. 이것은 여성의 일들을 없애라는 뜻입니다. 이는 다른 종류의 출생이 있기 때문이 아니라, 그들이 [아이 낳기를] 그쳐야 하기 때문입니다.”


    마리아가 말했습니다. “그것들은 결코 없어지지 않습니까?”


    주님께서 말씀하셨습니다. “[여러분은] 그것들이 [다시 한번] 사라질 것을 압니다. […] 그리고 [여기 있는 여성의 일들]도 [없어질] 것입니다.”


    유다가 [마태에게] 말했습니다. “[여성]의 일들은 참으로 사라질 것입니다. 그러면 아르콘들은 [자기들의 아이온들을 불러낼] 것이고, 우리는 그들에 맞설 준비를 갖추게 될 것입니다.”[b]


    주님께서 말씀하셨습니다. “그들이 [여러분을 볼 것이며, 또] 여러분을 받아들이는 이들을 보겠습니까? 보십시오. 아버지에게서 참된 말씀이 침묵 가운데 번갯불과 함께 심연으로 나오는데, 그것은 생명을 낳습니다. 그들이 그것을 봅니까, 아니면 그것을 이깁니까? 참으로 여러분은 [천사도] 권세도 알지 [못하는 길]을 더 잘 알고 있습니다. 그 길은 아버지와 아들의 길입니다. 둘은 하나이기 때문입니다. 여러분은 자신이 알게 된 [길]로 나아갈 것입니다. 아르콘들이 아무리 거대해져도 그 길에는 이를 수 없습니다. 내가 여러분에게 [진실로] 말합니다. 나조차도 그 길에 이르기는 어렵습니다.”


    […] [마리아가 주님께] 물었습니다. “일들이 [없어진다면, 도대체] 무엇이 일을 없앱니까?”


    [주님께서 말씀하셨습니다.] “[내가] 그것을 없앨 [때마다, 그것은] 제자리로 간다는 것을 여러분은 압니다.”


    유다가 말했습니다. “영은 어떻게 보이게 됩니까?”


    주님께서 말씀하셨습니다. “칼은 어떻게 [보이게 됩니까]?”


    유다가 말했습니다. “빛은 어떻게 보이게 됩니까?”


    주님께서 말씀하셨습니다. “[빛은] 스스로 말미암아 영원히 [보이게 됩니다].”


    유다가 물었습니다. “누가 누구의 일들을 해체합니까? 일들이 세상을 [해체]합니까, 아니면 세상이 일들을 해체합니까?”


    주님께서 [대답하셨습니다.] “[깨닫는 사람이 곧 일들을 해체하는 사람입니다.] 이는 일들을 알게 된 사람은 아버지의 [뜻]을 행해야 하기 때문입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 사본에는 여러 결락이 있습니다. 대괄호 안의 말은 손상된 본문을 보충한 것이며, […]는 복원할 수 없는 결락을 나타냅니다. 이 초안은 공개 영역 영어 번역 증거를 바탕으로 하며 콥트어 원문 대조는 아직 이루어지지 않았습니다.
    reason: 본문의 불완전성과 초안의 자료적 한계를 독자에게 알립니다.
  - marker: b
    text: ‘아르콘’과 ‘아이온’은 이 문헌의 우주론에 쓰이는 용어입니다. 아르콘은 통치하는 권세 또는 존재를, 아이온은 시대·영원 또는 초월적 영역이나 존재를 가리킬 수 있습니다.
    reason: 음역한 전문 용어의 의미 범위를 설명하되 하나의 체계로 확정하지 않습니다.
lexical_decisions:
- source_word: works
  choice: 일들
  rationale: 이 대목에서 반복되는 핵심어의 연결을 보존하고, 행위·산물·작용 가운데 하나로 의미를 좁히지 않기 위해 포괄적인 표현을 사용했습니다.
- source_word: woman / female
  choice: 여자 / 여성
  rationale: 인물을 가리키는 문장에는 ‘여자’, 출산 및 ‘일들’과 결합하는 추상적·범주적 용례에는 ‘여성’을 써서 원문의 긴장과 반복을 유지했습니다.
- source_word: Mother of the All
  choice: 만물의 어머니
  rationale: 우주론적 칭호임을 드러내되 특정 교파나 후대 체계의 전문 용어를 덧붙이지 않았습니다.
- source_word: archons
  choice: 아르콘들
  rationale: 고대 영지주의 문헌의 통치 권세들을 가리키는 기술적 용어이므로 음역하고 각주로 설명했습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 시대·영원·초월적 존재라는 중의성을 번역어 하나로 해소하지 않도록 음역했습니다.
- source_word: dissolve
  choice: 해체하다
  rationale: 앞부분의 ‘destroy’와 구별하면서도 세상과 일들의 결합을 풀어 없앤다는 의미를 살렸습니다.
- source_word: generative
  choice: 생명을 낳습니다
  rationale: ‘낳는 힘이 있다’는 의미를 자연스러운 한국어로 옮기되, 앞선 출생 모티프와의 연관을 보존했습니다.
theological_decisions:
- issue: ‘여자가 없는 곳’과 ‘여성의 일들’의 의미
  choice: 난해하고 불편한 원문 표현을 그대로 두고 마태의 내부 해설만 제시했습니다.
  alternative: 금욕, 독신, 육체 초월 또는 특정 의례를 뜻한다고 풀이할 수 있습니다.
  rationale: 본문 자체가 의미를 완전히 해명하지 않으므로 특정 신학적 해석으로 고정하지 않았습니다.
- issue: 아버지와 아들이 ‘하나’라는 진술
  choice: ‘둘은 하나’로 직역에 가깝게 보존했습니다.
  alternative: 뜻이나 본질이 하나라고 명시할 수 있습니다.
  rationale: 일치의 성격을 원문보다 구체화하지 않고 존재론적·기능적 가능성을 열어 두었습니다.
- issue: 주님조차 길에 이르기 어렵다는 진술
  choice: 난해한 진술을 완화하거나 교리적으로 수정하지 않았습니다.
  alternative: 제자들이 이르기 어렵다는 뜻으로 교정하거나 비유적으로 풀 수 있습니다.
  rationale: 전승의 신학적 긴장과 본문상의 난점을 그대로 보존했습니다.
- issue: 세계와 여성의 일들의 소멸
  choice: 우주론적 진술로 번역하되 선악 판단이나 현대의 성별관을 덧붙이지 않았습니다.
  alternative: 물질세계와 생식 자체에 대한 단정적 부정으로 해설할 수 있습니다.
  rationale: 직접 콥트어 검토가 보류된 상황에서 해석적 확장을 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 대화의 반복과 논증 구조를 살렸으며, 결락과 편집적 복원은 대괄호로 보존했습니다. 다만 원자료가 콥트어 직접 검토가 아닌 공개 영역 영어 증거이므로 모든 세부 선택은 잠정적입니다.
