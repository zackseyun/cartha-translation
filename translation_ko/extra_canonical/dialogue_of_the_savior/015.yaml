translation:
  language: ko
  text: '“여러분 자신에 관해서는, [분노]와 질투에서 벗어나도록 힘써 애쓰십시오. 여러분의 [행위]를 벗어 버리고, [. . .]하지 마십시오. [] [. . .] 책망 [. . .]. 내가 [여러분에게, . . .] 말합니다. 여러분은 [. . .] 많은 [. . .] 받을 것입니다. 찾던 이는 [참된 생명을 발견했으므로], [안식에 이르고] 영원히 살 것입니다. 내가 [여러분에게 말합니다. 자신을 지키십시오]. 그리하여 여러분의 영들과 영혼들을 그릇된 길로 이끌지 마십시오.”[a]


    [구원자와의 대화]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 본문은 여러 곳이 훼손되어 있습니다. 대괄호는 편집자가 복원한 말을, 대괄호 안의 생략점은 복원할 수 없는 부분을 나타냅니다. 이 번역은 공개 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 원문에 대한 직접 검토가 필요합니다.
    reason: 사본 손상과 번역 근거의 한계를 독자에게 명시하고, 복원문과 결락을 확정 본문처럼 보이지 않게 하기 위함입니다.
lexical_decisions:
- source_word: wrath
  choice: 분노
  rationale: 복원된 어구임을 대괄호로 보존하면서 현대 한국어에서 자연스럽고 직접적인 대응어를 택했습니다.
- source_word: jealousy
  choice: 질투
  rationale: 윤리적 경계의 의미를 평이하고 정확하게 전달합니다.
- source_word: works
  choice: 행위
  rationale: ‘일’보다 도덕적·실천적 함의를 열어 두며, 무엇을 가리키는지 단정하지 않았습니다.
- source_word: strip from yourselves
  choice: 벗어 버리십시오
  rationale: 의복을 벗는 원문의 비유적 힘을 살리고 명령의 강도를 유지했습니다.
- source_word: true life
  choice: 참된 생명
  rationale: 단순한 생존보다 종교적·질적 의미가 있는 ‘life’를 ‘생명’으로 옮겼습니다.
- source_word: rest
  choice: 안식
  rationale: 일상적 휴식 이상의 종교적 함의를 보존하되 그 의미를 교리적으로 규정하지 않았습니다.
- source_word: spirits and souls
  choice: 영들과 영혼들
  rationale: 서로 다른 두 명사를 합치지 않고 복수형의 구별을 보존했습니다.
- source_word: The Savior
  choice: 구원자
  rationale: 작품명의 인물 칭호를 특정 교파의 관용 표현으로 좁히지 않고 직역했습니다.
theological_decisions:
- issue: ‘행위’를 벗어 버리라는 표현의 의미
  choice: ‘여러분의 [행위]를 벗어 버리고’로 번역
  alternative: ‘여러분의 [업적/악행]을 버리고’
  rationale: 행위의 성격이 손상된 문맥에서 확정되지 않으므로 선행·악행·업적 가운데 하나로 한정하지 않았습니다.
- issue: ‘참된 생명’을 찾은 자와 영생의 관계
  choice: 발견, 안식, 영원한 삶의 흐름을 그대로 유지
  alternative: 구원 획득의 명시적 인과관계로 풀어 번역
  rationale: 본문의 신학적 관계를 체계화하지 않고 단편적인 진술의 긴장과 모호성을 보존했습니다.
- issue: 영과 영혼의 구별
  choice: 두 용어를 모두 복수로 별도 번역
  alternative: ‘영혼’을 하나의 합성 개념으로 번역
  rationale: 원문 증언에 나타난 이중 표현을 신학적으로 통합하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면과 경고의 어조는 단정하고 품위 있게 유지했으며, 심하게 훼손된 구절은 문법적으로 과도하게 재구성하지 않았습니다. 작품명 자체도 복원되어 있으므로 대괄호를 유지했습니다.
