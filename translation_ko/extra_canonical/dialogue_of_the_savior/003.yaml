translation:
  language: ko
  text: '“멸망의 때가 언제 닥칠지 내가 여러분에게 가르쳐 주겠습니다.[a] 어둠의 첫째 권세가 여러분을 덮칠 것입니다. 두려워하지 말고,[b] ‘보십시오, 때가 왔습니다’라고도 말하지 마십시오.[c] 그러나 홀로 선 지팡이를 보게 될 때에는 [···].[d] [···] 일에서 [···] 그리고 통치자들이 [···] 여러분을 덮친다는 것을 아십시오 [···]. 두려움이야말로 [어둠의] 참된 힘입니다. 그러므로 곧 여러분을 덮칠 것을 두려워하면, 그것이 여러분을 제압할 것이며, 그들 가운데 누구 하나도 여러분을 풀어 주거나 불쌍히 여기지 않을 것입니다. 오히려 여러분 [안에 있는 것]을 바라보십시오.[e] 여러분은 땅에 속한 모든 것을 이미 다스렸기 때문입니다. 이것이 여러분을 위로 이끌어, 지배도 [폭군도] 없는 [곳]으로 데려갈 것입니다. 여러분이 [···] 때, 그들을 [···] 볼 것이며, 여러분도 [그들의 말을 듣게 될 것입니다. 내가] 여러분에게 말합니다. 이성은 [···]. 이성은 진리가 [있는 곳에서 ···]입니다. 그러나 그들은 [···], 여러분은 [···] 진리를 [···]. 이것은 살아 있는 [정신 안에 ···] 있습니다. 그러므로 [···] 여러분의 기쁨이 [···], 그리하여 [···] 여러분의 영혼들이 [···], 그리하여 말씀이 [···] 않게 하십시오. 그들이 [···] 들어 올렸으나 [그것을 깨닫지] 못했습니다 [···]. 여러분 안에 [있는 것]과 여러분 밖에 [있는 것]을 하나가 되게 하십시오.[f]


    그 [···] 건너는 곳은 참으로 [여러분이] 보기에 두렵지만, 주저하지 말고 그곳을 지나가십시오. 그 깊이는 크고 [그] 높이는 아득합니다! [한마음이 되십시오 ···]. 불은 [···], 이슬방울들은 [···], 모든 권세는 [···] 여러분을 [···]. 그들은 [···], [모든] 권세는 [···], 그들은 전에 [···]. 내가 [여러분에게] 말합니다. [···] 영혼은 [···] 될 것이며 [···] 그들 모두 안에서 [···] 여러분은 [···], 그리고 [···] 잠들지 마십시오 [···] 아들들은 [···], 여러분은 [···] 여러분은 [···].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 증거문을 바탕으로 한 잠정 번역입니다. 나그함마디 문서 III,5의 콥트어 본문에 대한 직접 검토가 필요합니다.
    reason: 번역 근거와 원어 검토의 한계를 투명하게 밝힙니다.
  - marker: b
    text: ‘여러분’은 영어 증거문의 단복수 구별이 드러나지 않는 대명사를 문맥상 복수로 옮긴 것입니다.
    reason: 수의 잠정적 판단을 알립니다.
  - marker: c
    text: ‘때’가 멸망의 때와 정확히 같은 때를 가리키는지는 파손된 문맥 때문에 확정하기 어렵습니다.
    reason: 지시 대상의 모호성을 보존합니다.
  - marker: d
    text: ‘홀로 선 지팡이’의 의미는 불분명합니다. 원문의 파손 때문에 상징인지 실제 표지인지 판단할 수 없습니다.
    reason: 난해한 상징을 임의로 해석하지 않습니다.
  - marker: e
    text: 대괄호는 증거문에서 복원되었거나 불확실한 말을 나타내며, [···]는 사본의 결락 또는 읽을 수 없는 부분을 나타냅니다.
    reason: 본문의 복원 및 파손 표기를 설명합니다.
  - marker: f
    text: ‘하나가 되게 하십시오’는 안과 밖의 일치 또는 통합을 말하지만, 그 정확한 성격은 본문만으로 확정할 수 없습니다.
    reason: 신학적·철학적 긴장을 해설하되 해소하지 않습니다.
lexical_decisions:
- source_word: destruction
  choice: 멸망
  rationale: 종말론적 파괴를 가리킬 수 있는 의미의 무게를 보존하면서도 문맥을 특정 교리로 좁히지 않습니다.
- source_word: power
  choice: 권세
  rationale: 단순한 물리적 힘보다 인격적·우주적 세력일 가능성을 열어 둡니다. 다만 ‘real power’에서는 자연스러운 대조를 위해 ‘참된 힘’으로 옮겼습니다.
- source_word: archons
  choice: 통치자들
  rationale: 그리스계 콥트어 문헌에서 지배 세력을 가리키는 용어의 일반 의미를 살리고, 음역어가 초래할 불필요한 전문성을 피합니다.
- source_word: logic
  choice: 이성
  rationale: 제공된 영어 증거문의 ‘logic’을 우선 반영하되, 원어가 로고스·추론·이성 가운데 무엇을 뜻하는지는 직접 검토 전까지 확정하지 않습니다.
- source_word: living mind
  choice: 살아 있는 정신
  rationale: ‘mind’를 마음이나 지성으로 단정하지 않고 인지적·내적 의미 범위를 비교적 넓게 유지합니다.
- source_word: crossing place
  choice: 건너는 곳
  rationale: 통과 지점인지 경계인지 불분명한 상태를 보존하며 구체적 우주론을 덧붙이지 않습니다.
theological_decisions:
- issue: 두려움과 어둠의 권세의 관계
  choice: ‘두려움이야말로 [어둠의] 참된 힘’이라는 역설을 그대로 유지했습니다.
  alternative: 두려움이 어둠에게 힘을 준다는 해설적 번역
  rationale: 본문은 존재론적 진술과 심리적 경고 사이의 긴장을 지니므로 한쪽으로 해소하지 않습니다.
- issue: ‘안에 있는 것’의 정체
  choice: 대상을 특정하지 않고 ‘여러분 안에 있는 것’으로 옮겼습니다.
  alternative: 내면의 빛, 영, 신적 자아
  rationale: 파손된 문맥이 대상을 확정하지 않으므로 특정 영지주의 체계나 교리를 주입하지 않습니다.
- issue: ‘안’과 ‘밖’을 하나로 만드는 명령
  choice: 문장의 통합적 표현을 직역에 가깝게 보존했습니다.
  alternative: 내면과 외면이 일치하게 행동하라는 윤리적 의역
  rationale: 존재론적·윤리적·의례적 의미 가운데 어느 하나를 독점적으로 선택하지 않습니다.
- issue: ‘지배도 폭군도 없는 곳’
  choice: 정치적·우주론적 양면을 열어 둔 표현을 사용했습니다.
  alternative: 하나님의 왕국 또는 특정 천상 영역으로 명시
  rationale: 본문 자체가 그 장소의 정체를 명시하지 않으므로 교리적으로 보충하지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 계시적이고 권고적인 어조는 유지하되 지나치게 고어적인 표현은 피했습니다. 인용문 안의 대괄호와 [···]를 통해 복원과 결락을 가시적으로 보존했으며, 문법적으로 이어지지 않는 파손 구절도 추측으로 메우지 않았습니다.
