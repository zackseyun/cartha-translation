  source_fidelity: 전반적으로 제공된 영어 증언의 의미와 본문비평 표지(대괄호·빈 대괄호·꺾쇠괄호)를 충실히 따릅니다. 다만 빈 대괄호를 본문에서 설명문으로 바꾼 것은 증언의 표지를 보존한다는 번역 원칙과 맞지 않으며, ‘[touch]’를 ‘[만지지도]’로 옮긴 것은 ‘-도’의 추가 강조를 넣습니다. 마지막 문장의 ‘in their own image’도 ‘자기들의 형상을 따라’보다 ‘자기들의 형상을 본떠’가 더 직접적입니다.
