  revised_text: '아르콘들은 아담을 데려다가 동산에 두어, 그곳을 돌보고 지키게 했습니다. 그들은 아담에게 명령하며 말했습니다. “너는 동산의 [모든] 나무에서 열매를 먹어도 된다. 그러나 선과 악을 아는 나무의 열매는 먹지 마라. 그것을 [만지지] 마라. 네가 그것을 먹는 날에는 반드시 죽을 것이다.”[a]


    그들은 [이 말을] [그에게 했지만], 자신들이 [그에게 한 말]이 무엇인지 깨닫지 못했습니다. 오히려 그들이 이런 방식으로 말한 것은 아버지[]의 뜻에 따른 것이었습니다. 이는 아담이 실제로 먹게 하고, 또 아담이 철저히 물질적인 사람이 생각하듯 그들을 생각하지 <않게> 하려는 것이었습니다.[b][c]


    아르콘들은 서로 모의하여 말했습니다. “자, 아담이 깊은 잠에 빠지게 하자.” 그러자 아담이 잠들었습니다. 그들이 아담에게 내리게 하여 그가 잔 그 깊은 잠은 무지입니다. 그들은 살아 있는 여자처럼 그의 옆구리를 열었습니다.[d] 그런 다음 그 자리를 살로 닫았고, 아담은 단지 혼적인 존재가 되었습니다.[e]


    영적인 여자가 그에게 다가와 말했습니다. “일어나십시오, 아담.”


    아담은 그 여자를 바라보고 말했습니다. “당신이 나에게 생명을 주셨습니다. 당신은 ‘살아 있는 이들의 어머니’라고 불릴 것입니다. 그 여자가 나의 어머니이기 때문입니다. 그 여자는 의사이며, 여자이며, 출산한 이입니다.”[f]


    권세자들이 자기들의 아담에게 다가왔습니다. 그들은 아담의 여성 짝이 그와 이야기하는 것을 보고 흥분하여 그 여자를 향해 욕정을 품었습니다. 그들은 서로 말했습니다. “자, 우리의 씨를 그 여자 안에 뿌리자.” 그러고는 그 여자를 뒤쫓았습니다. 그러나 그 여자는 그들의 어리석음과 눈멂 때문에 그들을 비웃었습니다. 그들이 그 여자를 붙잡자, 그 여자는 나무가 되었습니다. 그리고 그들 앞에 자신의 그림자 같은 형상을 내놓자, 그들은 그것을 몹시 추악하게 더럽혔고, 그 여자의 목소리의 인장까지 더럽혔습니다.[g] 그리하여 그들은 자기들의 형상을 본떠 빚어 낸 형상을 통하여 스스로에게 심판을 불러왔습니다.[h]'
  revised_footnotes:
  - marker: a
    text: 대괄호 안의 ‘모든’과 ‘만지지’는 현존 본문의 손상이나 번역 증언의 보충을 표시합니다. 이 번역은 제공된 영어 증언의 본문 기호를 보존합니다.
