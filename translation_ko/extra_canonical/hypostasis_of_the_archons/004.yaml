  - marker: b
    text: 제공된 증언에는 ‘아버지’ 뒤에 빈 대괄호 []가 있어, 원문에 결락이 있음을 나타냅니다. 한국어 본문도 이 표지를 보존합니다.
    reason: 결락의 위치와 본문비평적 상태를 드러내기 위해서입니다.
  - marker: c
    text: <않게>의 꺾쇠괄호는 번역 증언에서 교정 또는 편집상 보충된 표현임을 나타냅니다. 이 부정어의 본문비평적 확정은 콥트어 원문 대조가 필요합니다.
    reason: 부정어 하나가 문장의 의미를 크게 바꾸므로 불확실성을 보존하기 위해서입니다.
  - marker: d
    text: ‘살아 있는 여자처럼’이 ‘옆구리’를 꾸미는지, 옆구리를 여는 행위나 그 결과를 묘사하는지는 문장이 불분명합니다. 번역은 제공된 증언의 어순과 모호성을 가급적 유지했습니다.
    reason: 난해한 구문을 자의적으로 해소하지 않기 위해서입니다.
  - marker: e
    text: ‘혼적인’은 영적인 것과 구별되는 ‘혼에 속한’ 상태를 가리키는 번역어입니다. 단순히 ‘영혼이 있는’이라는 긍정적 뜻으로 확정하지 않습니다.
    reason: 특수한 인간론적 용어를 일상적 의미로 오해하지 않도록 하기 위해서입니다.
  - marker: f
    text: 말은 ‘당신’에서 ‘그 여자’로 갑자기 바뀝니다. 이 인칭 불일치는 증언에 나타난 그대로 보존했습니다. ‘의사’와 ‘출산한 이’도 해당 호칭들을 해설하지 않고 옮긴 것입니다.
    reason: 본문의 불연속과 열거의 난해성을 감추지 않기 위해서입니다.
  - marker: g
    text: ‘목소리의 인장’은 난해한 표현입니다. 목소리, 표지, 형상 사이의 관계를 특정한 방식으로 해석하지 않고 직역에 가깝게 두었습니다.
    reason: 원문의 상징적 표현을 교리적으로 해설하여 대체하지 않기 위해서입니다.
  - marker: h
    text: ‘자기들의 형상을 본떠 빚어 낸 형상’이 정확히 아담, 그림자 같은 형상, 또는 그들이 만든 다른 형상을 가리키는지는 이 대목만으로 분명하지 않습니다.
    reason: 대상의 지시 관계에 있는 진정한 모호성을 보존하기 위해서입니다.
