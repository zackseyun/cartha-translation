base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/004.yaml
  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: ko
  text: '아르콘들은 아담을 데려다가 동산에 두어, 그곳을 돌보고 지키게 했습니다. 그들은 아담에게 명령했습니다. “너는 동산의 [모든] 나무에서 열매를 먹어도 된다. 그러나 선과 악을 아는 나무에서는 먹지 마라. 그것을 [만지지도] 마라. 네가 그것을 먹는 날에는 반드시 죽을 것이다.”[a]


    그들은 [이 말을] [그에게 했지만], 자신들이 [그에게 한 말]이 무엇인지 깨닫지 못했습니다. 오히려 그들이 그런 식으로 말한 것은 아버지의 뜻에 따른 것이었습니다. 본문에는 이 대목에 빈틈이 있습니다.[b] 이는 아담이 실제로 먹게 하고, 또 아담이 철저히 물질적인 사람이 생각하듯 그들을 생각하지 <않게> 하려는 것이었습니다.[c]


    아르콘들은 서로 모의하여 말했습니다. “자, 아담이 깊은 잠에 빠지게 하자.” 그러자 아담이 잠들었습니다. 그들이 아담에게 내리게 하여 그가 잔 그 깊은 잠은 무지입니다. 그들은 살아 있는 여자처럼 그의 옆구리를 열었습니다.[d] 그런 다음 그 자리를 살로 닫았고, 아담은 단지 혼적인 존재가 되었습니다.[e]


    영적인 여자가 그에게 다가와 말했습니다. “일어나십시오, 아담.”


    아담은 그 여자를 바라보고 말했습니다. “당신이 나에게 생명을 주셨습니다. 당신은 ‘살아 있는 이들의 어머니’라고 불릴 것입니다. 그 여자가 나의 어머니이기 때문입니다. 그 여자는 치유자이며, 여자이며, 낳은 이입니다.”[f]


    권세자들이 자기들의 아담에게 다가왔습니다. 그들은 아담의 여성 짝이 그와 이야기하는 것을 보고 흥분하여 그 여자를 욕정했습니다. 그들은 서로 말했습니다. “자, 우리의 씨를 그 여자 안에 뿌리자.” 그러고는 그 여자를 뒤쫓았습니다. 그러나 그 여자는 그들의 어리석음과 눈멂 때문에 그들을 비웃었습니다. 그들이 그 여자를 붙잡자, 그 여자는 나무가 되었습니다. 그리고 그들 앞에 자신의 그림자 같은 형상을 내놓자, 그들은 그것을 몹시 추악하게 더럽혔고, 그 여자의 목소리의 인장까지 더럽혔습니다.[g] 그리하여 그들은 자기들의 형상을 따라 빚어 놓은 모습을 통하여 스스로에게 심판을 불러왔습니다.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 ‘모든’과 ‘만지지도’는 현존 본문의 손상이나 번역 증언의 보충을 표시합니다. 이 초안은 제공된 영어 증언의 본문 기호를 보존합니다.
    reason: 보충된 어휘와 본문 상태를 독자에게 알리기 위해서입니다.
  - marker: b
    text: 제공된 증언에는 ‘아버지의 뜻에 따라’ 뒤에 빈 대괄호 []가 있어, 원문에 결락이 있음을 나타냅니다. 한국어 본문에서는 이를 문장으로 밝혔습니다.
    reason: 발음할 수 없는 빈 기호를 그대로 두기보다 결락 사실을 명확히 전달하기 위해서입니다.
  - marker: c
    text: <않게>의 꺾쇠괄호는 번역 증언에서 교정 또는 편집상 보충된 표현임을 나타냅니다. 이 부정어의 본문비평적 확정은 콥트어 원문 대조가 필요합니다.
    reason: 부정어 하나가 문장의 의미를 크게 바꾸므로 불확실성을 보존하기 위해서입니다.
  - marker: d
    text: ‘살아 있는 여자처럼’이 ‘옆구리’를 꾸미는지, 옆구리를 여는 행위나 그 결과를 묘사하는지는 문장이 불분명합니다. 번역은 제공된 증언의 어순과 모호성을 가급적 유지했습니다.
    reason: 난해한 구문을 자의적으로 해소하지 않기 위해서입니다.
  - marker: e
    text: ‘혼적인’은 영적인 것과 구별되는 ‘혼에 속한’ 상태를 가리키는 번역어입니다. 단순히 ‘영혼이 있는’이라는 긍정적 뜻으로 확정하지 않습니다.
    reason: 특수한 인간론적 용어를 일상적 의미로 오해하지 않도록 하기 위해서입니다.
  - marker: f
    text: 말은 ‘당신’에서 ‘그 여자’로 갑자기 바뀝니다. 이 인칭 불일치는 증언에 나타난 그대로 보존했습니다.
    reason: 본문의 불연속 가능성을 감추지 않기 위해서입니다.
  - marker: g
    text: ‘목소리의 인장’은 난해한 표현입니다. 목소리, 표지, 형상 사이의 관계를 특정한 방식으로 해석하지 않고 직역에 가깝게 두었습니다.
    reason: 원문의 상징적 표현을 교리적으로 해설하여 대체하지 않기 위해서입니다.
  - marker: h
    text: ‘자기들의 형상을 따라 빚어 놓은 모습’이 정확히 아담, 그림자 같은 형상, 또는 그들이 만든 다른 형상을 가리키는지는 이 대목만으로 분명하지 않습니다.
    reason: 대상의 지시 관계에 있는 진정한 모호성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: archons / authorities
  choice: 아르콘들 / 권세자들
  rationale: 문단 전반의 고유한 우주론적 집단명은 음역인 ‘아르콘들’로 보존했습니다. 마지막 문단에서 영어 증언이 authorities로 달리 표현한 곳은 ‘권세자들’로 옮겨 어휘 변화를 드러냈습니다. 콥트어 대조 후 통일 여부를 재검토해야 합니다.
- source_word: tend it and guard it
  choice: 그곳을 돌보고 지키게 했습니다
  rationale: 경작만을 뜻한다고 좁히지 않고 돌봄과 수호라는 두 동작을 자연스러운 현대 한국어로 보존했습니다.
- source_word: deep sleep ... is ignorance
  choice: 깊은 잠은 무지입니다
  rationale: 잠을 무지와 동일시하는 본문의 해석적 진술을 완화하지 않고 직설적으로 유지했습니다.
- source_word: merely soulish
  choice: 단지 혼적인 존재
  rationale: ‘정신적’이나 ‘영혼을 지닌’으로 정상화하지 않고, 영적인 여자와 대비되는 특수한 인간론적 표현을 ‘혼적’으로 보존했습니다.
- source_word: spiritual woman
  choice: 영적인 여자
  rationale: ‘영적 여성’보다 인물 지칭이 자연스러운 ‘영적인 여자’를 택하되, spiritual의 대조적 의미를 유지했습니다.
- source_word: female counterpart
  choice: 여성 짝
  rationale: 배우자나 아내로 단정하지 않고 대응하는 여성 존재라는 모호성을 보존했습니다.
- source_word: signet of her voice
  choice: 그 여자의 목소리의 인장
  rationale: 난해한 은유를 해설적으로 풀거나 다른 대상으로 바꾸지 않고 문자적 긴장을 보존했습니다.
- source_word: form / shape ... modeled in their own image
  choice: 자기들의 형상을 따라 빚어 놓은 모습
  rationale: 형상과 제작 행위의 연관성을 살리면서 한국어 문장으로 이해 가능하게 옮겼습니다.
theological_decisions:
- issue: 아버지의 뜻과 아르콘들의 무지 사이의 긴장
  choice: 아르콘들은 뜻을 모르지만 그들의 말이 아버지의 뜻에 따른 것이라고 그대로 진술했습니다.
  alternative: 아버지가 아르콘들을 의도적으로 속이거나 조종했다고 명시하는 번역
  rationale: 본문이 말하는 섭리적 역설은 유지하되, 행위 방식이나 인과관계를 교리적으로 보충하지 않았습니다.
- issue: 아담이 먹도록 하려는 목적
  choice: ‘아담이 실제로 먹게 하고’로 옮겼습니다.
  alternative: 아담이 먹도록 허용하거나 시험하려 했다고 완화하는 번역
  rationale: 증언의 강조된 indeed를 살리고, 금지 명령의 표면과 숨은 목적 사이의 긴장을 보존했습니다.
- issue: ‘soulish’의 인간론
  choice: ‘혼적인 존재’라는 비일상적 표현을 유지했습니다.
  alternative: ‘영혼만 있는 존재’, ‘육적인 존재’, ‘생명체’
  rationale: 각 대안은 영·혼·물질의 관계에 관한 특정 해석을 확정할 위험이 있어 피했습니다.
- issue: 영적인 여자의 정체
  choice: ‘영적인 여자’로만 지칭했습니다.
  alternative: 하와, 지혜, 생명 또는 특정 신적 위격으로 명명
  rationale: 이 대목 자체가 그 정체를 명시적으로 확정하지 않으므로 후대 체계나 다른 문맥의 동일시를 끌어오지 않았습니다.
- issue: '대명사 전환: ‘당신’에서 ‘그 여자’로'
  choice: 증언의 인칭 전환을 그대로 드러냈습니다.
  alternative: 모두 ‘당신’ 또는 모두 ‘그 여자’로 통일
  rationale: 문법적 불연속이 전승이나 본문 상태를 반영할 수 있으므로 매끄럽게 고치지 않았습니다.
- issue: 권세자들의 성적 폭력과 심판
  choice: 욕정, 추격, 붙잡음, 더럽힘을 직접적으로 옮기되 선정적으로 확대하지 않았습니다.
  alternative: 완곡하게 ‘유혹했다’ 또는 구체적으로 강간으로 확정
  rationale: 본문의 폭력성과 자기 심판의 구조를 보존하면서 행위의 정확한 성격을 증언 이상으로 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 서술은 장중하되 일반 독자가 이해할 수 있도록 구성했고, 직접화법의 명령은 인물 관계와 원문의 힘을 살려 해라체로 옮겼습니다. ‘아르콘’, ‘혼적’, ‘목소리의 인장’처럼 문헌 고유의 난해성이 중요한 표현은 쉬운 말로 과도하게 정상화하지 않았습니다. 현재 자료는 공공 영역 영어 증언이며 콥트어 원문 검토가 보류되어 있으므로, 본문비평적으로 민감한 부분은 각주로 표시한 잠정 출판 초안입니다.
