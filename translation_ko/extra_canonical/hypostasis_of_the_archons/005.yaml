translation:
  language: ko
  text: '그때 여성적 영적 본성이 가르치는 자인 뱀의 모습으로 왔습니다. 뱀은 아담과 하와를 가르치며 말했습니다. “사마엘이 여러분에게 [무엇이라고 말했습니까?] 그가 ‘동산의 모든 나무에서는 먹어도 되지만, 선과 악을 아는 [나무]에서는 먹지 말라’고 말했습니까?”[a]


    육적인 여자가 말했습니다. “그는 ‘먹지 말라’고만 한 것이 아니라, ‘그것에 손도 대지 말라. 너희가 그것을 먹는 날에는 반드시 죽을 것이다’라고까지 말했습니다.”


    가르치는 자인 뱀이 말했습니다. “여러분은 결코 죽지 않을 것입니다. 그가 질투심 때문에 그렇게 말한 것입니다. 오히려 여러분의 눈이 열리고, 선과 악이 무엇인지 아는 신들과 같이 될 것입니다.” 그러자 여성적이며 가르치는 본성이 뱀에게서 떠나, 뱀을 땅에 속한 것인 양 버렸습니다.


    육적인 여자는 그 나무에서 열매를 따 먹고 자기 남편에게도 주었습니다. 이처럼 혼에만 속한 존재들인 그들이 먹었습니다.[b] 그들의 무지로 말미암아 그들의 결함이 드러났습니다. 그들은 자신들에게서 영적인 것이 벗겨졌음을 깨닫고, 무화과나무 잎을 가져다가 벌거벗은 허리에 둘러 매었습니다.


    통치자들의 우두머리는 무슨 일이 일어났는지 알지 못한 채 와서 말했습니다. “아담아, 네가 어디 있느냐?”


    아담이 말했습니다. “당신의 목소리를 듣고 두려워졌습니다. 제가 벌거벗었기 때문에 숨었습니다.”


    그 통치자가 말했습니다. “내가 먹지 말라고 금한 바로 그 나무에서 네가 먹었기 때문에 숨은 것이 아니냐? 네가 그것을 먹었구나!”


    아담이 말했습니다. “당신이 제게 주신 여자가 제게 그 열매를 [건네주어서] 제가 먹었습니다.”[c]


    그러자 거만한 [통치자]가 그 여자를 저주했습니다.


    여자가 말했습니다. “뱀이 저를 속여서 제가 먹었습니다.”


    [통치자들은] 뱀을 향해 돌아서서 그 그림자를 저주하여 [약해지게 했습니다.][d]


    그들은 그것이 자기들이 빚어 만든 바로 그 형상이라는 사실을 알지 못했습니다. 그때부터 뱀은 권세자들의 저주 아래 놓였으며, 그 저주는 완전한 사람이 올 때까지 […] 이어졌습니다.[e]


    그들은 자기들의 아담에게로 돌아서서, 그와 그의 아내를 함께 동산 밖으로 몰아냈습니다. 그들에게는 아무런 복도 없었습니다. 그들 역시 저주 아래 있었기 때문입니다.


    그들은 자기들의 인류가 세상일에 마음을 빼앗겨 거룩한 영에 마음을 쓸 틈이 없게 하려고, 인류를 극심한 혼란과 고된 노동의 삶 속으로 몰아넣었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 손상되거나 빠진 본문을 번역자가 복원한 부분입니다.
    reason: 제공된 증언의 본문 복원 표시를 독자가 이해하도록 합니다.
  - marker: b
    text: ‘혼에만 속한’은 ‘영적인’ 것과 구별되는 상태를 가리키는 표현입니다.
    reason: 한국어에서 낯선 고대 인간론적 용어의 대조를 밝혀 줍니다.
  - marker: c
    text: ‘건네주어서’는 손상된 본문을 복원한 말입니다.
    reason: 제공된 증언의 대괄호를 보존하고 그 성격을 설명합니다.
  - marker: d
    text: 이 문장의 대괄호 부분들은 손상된 본문을 복원한 것입니다.
    reason: 복수의 복원 구간이 있는 문장의 불확실성을 표시합니다.
  - marker: e
    text: 여기에는 사본의 결락이 있습니다. ‘완전한 사람’은 원문 증언에서 칭호처럼 쓰였을 가능성이 있습니다.
    reason: 빈 대괄호로 표시된 결락을 자연스러운 기호로 보존하고 칭호의 가능성을 알립니다.
lexical_decisions:
- source_word: female spiritual nature
  choice: 여성적 영적 본성
  rationale: 인격적 여성과 추상적 본성 사이의 원문 증언상 긴장을 보존하면서도 한국어 문맥에서 자연스럽게 읽히도록 했습니다.
- source_word: archon(s)
  choice: 통치자(들)
  rationale: 이 문헌의 우주론적 지배 존재를 특정 교파의 전문 음역어로 고정하지 않고 기본 의미를 전달했습니다.
- source_word: soulish
  choice: 혼에만 속한
  rationale: ‘영적’과 대조되는 인간 상태라는 문맥을 살리되, 단순히 ‘육적’과 동일시하지 않았습니다.
- source_word: holy Spirit
  choice: 거룩한 영
  rationale: 정관사와 대문자 표기에 담긴 인격성 여부를 한국어에서 과도하게 확정하지 않도록 ‘성령’보다 직역적인 표현을 택했습니다.
- source_word: Perfect Man
  choice: 완전한 사람
  rationale: 칭호일 가능성을 존중하되 특정 기독론적 해석을 본문에 덧씌우지 않았습니다.
- source_word: Samael
  choice: 사마엘
  rationale: 고유명을 표준적인 한국어 음역으로 옮겼습니다.
theological_decisions:
- issue: 뱀과 여성적 영적 본성의 관계
  choice: 그 본성이 뱀의 모습으로 왔다가 뱀에게서 떠난 것으로 번역
  alternative: 그 본성을 뱀 자체와 완전히 동일시
  rationale: 증언은 둘을 긴밀히 연결하면서도 이후 분리하여 서술하므로 그 긴장을 유지했습니다.
- issue: ‘gods’의 수
  choice: 신들과 같이
  alternative: 하나님과 같이
  rationale: 제공된 증언의 복수형을 보존하여 창세기 전승에 맞추어 단수로 조정하지 않았습니다.
- issue: ‘their Adam / their mankind’의 소유 표현
  choice: 자기들의 아담 / 자기들의 인류
  alternative: 아담 / 인류
  rationale: 통치자들이 빚어 지배하는 존재라는 문헌 고유의 신학적 관점을 드러내는 소유 표현을 보존했습니다.
- issue: ‘what is spiritual’이 벗겨졌다는 진술
  choice: 자신들에게서 영적인 것이 벗겨졌음
  alternative: 자신들이 영적 본성을 잃었음
  rationale: 상실의 대상과 방식에 관한 모호성을 함부로 체계화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 인용 속 명령과 질문은 원문의 직접성을 살렸고, 나그함마디 문헌의 기술어는 이해 가능한 뜻번역을 우선하되 신학적 모호성을 유지했습니다. 현재 초안은 제공된 공공영역 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 원문 대조가 필요합니다.
