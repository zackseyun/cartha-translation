    가르치는 자인 뱀이 말했습니다. “여러분은 결코 죽지 않을 것입니다. 그가 질투심 때문에 여러분에게 이렇게 말한 것입니다. 오히려 여러분의 눈이 열리고, 선과 악이 무엇인지 아는 신들과 같이 될 것입니다.” 그러자 여성적이며 가르치는 본성은 뱀에게서 분리되었고, 뱀을 땅에 속한 것처럼 버렸습니다.



    육적인 여자는 그 나무에서 먹고 자기 남편에게도 주었습니다. 이처럼 혼에만 속한 존재들인 그들이 먹었습니다.[c] 그들의 무지 때문에 그들의 흠이 드러났습니다. 그들은 자신들에게서 영적인 것이 벗겨졌음을 깨닫고, 무화과나무 잎을 가져다가 벌거벗은 허리 둘레에 동여맸습니다.



    통치자들의 우두머리는 무슨 일이 일어났는지 알지 못했기 때문에 와서 말했습니다. “아담아, 네가 어디 있습니까?”



    아담이 말했습니다. “당신의 목소리를 듣고 두려워졌습니다. 제가 벌거벗었기 때문에 숨었습니다.”



    그 통치자가 말했습니다. “내가 너에게 먹지 말라고 금한 그 한 나무에서 먹었기 때문이 아니라면, 왜 숨었습니까? 네가 그것을 먹었군요!”



    아담이 말했습니다. “당신이 제게 주신 여자가 제게 그 열매를 [건네주어서][d] 제가 먹었습니다.”



    그러자 거만한 [통치자]가 그 여자를 저주했습니다.



    여자가 말했습니다. “뱀이 저를 속여서 제가 먹었습니다.”



    [통치자들은] 뱀을 향해 돌아서서 그 그림자를 저주하여 [그것을] 약하게 했습니다.[e]



