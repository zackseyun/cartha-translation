  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: ko
  text: '내가 말했습니다. “나의 주님, 저도 그들의 물질에서 비롯되었습니까?”


    “그대와 그대의 자손은 태초부터 계셨던 아버지에게서 비롯되었다.


    “영혼들은 위로부터, 소멸하지 않는 빛으로부터 비롯된다. 그러므로 권세자들은 영혼들 안에 있는 진리의 영 때문에 그들에게 가까이 갈 수 없다. 이 진리의 길을 아는 사람은 누구나 죽을 수밖에 없는 인간들 가운데서 죽지 않을 것이다.


    “그러나 그 씨는 아직 알려지지 않을 것이다. 세 시대가 지난 뒤에야 알려질 것이며, 그때 그들을 권세자들의 미혹에 얽매인 상태에서 해방할 것이다.”


    내가 물었습니다. “나의 주님, 이 일이 이루어지려면 얼마나 더 있어야 합니까?”


    그가 내게 말했습니다. “빚을 수 있는 물질 안에 있는 참사람이 아버지께서 보내신 [진리의 영을] 드러내는 때까지이다.[a]


    [본문 일부가 유실되었습니다.] “그러면 그는 왕 없는 세대에게서 받은 영원한 생명의 기름을 그들에게 발라 주며, 모든 것에 관하여 그들을 가르칠 것이다.


    “그때 그들은 눈먼 생각에서 해방될 것이다. 그들은 권세자들에게서 비롯된 죽음을 짓밟고, 그 씨가 거하는 무한한 빛으로 올라갈 것이다.


    “그때 권세자들은 자신들에게 주어진 때를 내놓을 것이다. 그들의 천사들은 그들이 멸망한 까닭에 울고, 그들의 악령들은 그들이 죽은 까닭에 슬퍼할 것이다.


    “그때 빛의 모든 아들은 진리와 자신들의 뿌리와 만물의 아버지와 거룩한 영을 참으로 알게 될 것이다. 그들은 모두 한목소리로 선포할 것이다. ‘아버지의 진리는 의롭다. 아들이 만물을 다스리신다.’ 그리고 모든 이가 선포할 것이다. ‘영원무궁토록 거룩하시다, 거룩하시다, 거룩하시다! 아멘.’”


    권세자들의 실체[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빚을 수 있는 물질’은 그리스어 차용어 플라스마(plasma)를 옮긴 말입니다. 이 문장은 ‘참사람’과 그 물질의 관계, 그리고 아버지께서 보내신 것이 ‘진리’인지 복원된 ‘진리의 영’인지에 관해 본문상 불확실성이 있습니다.
    reason: 핵심 원어와 손상·복원에 따른 구문 및 신학적 모호성을 공개하기 위해서입니다.
  - marker: b
    text: 제목의 ‘실체’는 그리스어 휘포스타시스(hypostasis)를 옮긴 말입니다. 여기서는 권세자들의 영적 본성보다는 그들이 비롯된 물질적 바탕, 형성된 틀, 또는 존립을 가리키는 것으로 이해될 수 있습니다. ‘권세자들의 물질적 바탕’이라고 옮길 수도 있습니다.
    reason: 후대 신학 용어인 ‘위격’으로 오해하지 않도록 이 문헌에서의 구체적·물질적 의미를 설명하기 위해서입니다.
lexical_decisions:
- source_word: matter (hylē)
  choice: 물질
  rationale: 권세자들의 구체적·물질적 기원을 묻는 문맥을 살리고, 영적 ‘본질’로 오해되는 것을 피했습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 통치 권력을 가진 인격적 존재들을 가리키므로 ‘권세들’보다 자연스러운 인격 명사를 사용했습니다.
- source_word: seed
  choice: 씨
  rationale: 집단·후손·영적 계보를 함께 암시하는 원문의 비유를 해석적으로 좁히지 않고 보존했습니다.
- source_word: ages
  choice: 시대
  rationale: 우주론적 기간을 가리키는 표현의 폭을 유지하기 위해 특정한 연수나 ‘세대’로 확정하지 않았습니다.
- source_word: True Man
  choice: 참사람
  rationale: 칭호적 성격을 살리되 현대 한국어에서 지나치게 교리적으로 특정되지 않도록 옮겼습니다.
- source_word: moldable substance (plasma)
  choice: 빚을 수 있는 물질
  rationale: 형태를 부여할 수 있는 물질적 바탕이라는 뜻을 드러내며, 단순히 ‘형체’나 ‘피조물’로 환원하지 않았습니다.
- source_word: kingless generation
  choice: 왕 없는 세대
  rationale: 독특한 우주론적 명칭의 낯섦과 문자적 의미를 보존하고 특정 신학 체계로 풀어 쓰지 않았습니다.
- source_word: blind thought
  choice: 눈먼 생각
  rationale: 인지적 무지와 영적 눈멂을 함께 담는 원문의 은유를 유지했습니다.
- source_word: the All
  choice: 만물
  rationale: 우주적 총체를 뜻하는 표현으로 읽기 쉽고 장중한 한국어를 선택했습니다.
- source_word: hypostasis
  choice: 실체
  rationale: 제목에서는 ‘기원’만이 아니라 물질적 바탕·존립이라는 의미도 품도록 ‘실체’를 택하고 주석으로 범위를 밝혔습니다.
theological_decisions:
- issue: 영혼들과 ‘그들’의 지시 대상
  choice: 영혼들을 직접 지시하는 흐름을 유지했습니다.
  alternative: ‘그들’을 씨의 구성원이나 노레아의 후손으로 명시할 수 있습니다.
  rationale: 본문은 영혼, 후손, 씨를 긴밀히 연결하지만 완전히 동일시하지는 않으므로 대상을 교리적으로 단정하지 않았습니다.
- issue: ‘죽지 않을 것이다’의 의미
  choice: ‘죽을 수밖에 없는 인간들 가운데서 죽지 않을 것이다’로 직역에 가깝게 보존했습니다.
  alternative: ‘불멸하게 될 것이다’로 옮길 수 있습니다.
  rationale: 육체적 죽음, 영적 불멸, 종말론적 생명 가운데 하나로 의미를 제한하지 않기 위해 역설적 표현을 유지했습니다.
- issue: 아버지가 보낸 대상
  choice: 본문 복원 표시를 살려 ‘[진리의 영을]’로 번역했습니다.
  alternative: ‘진리’를 목적어로 보아 ‘아버지께서 보내신 진리를 드러낸다’로 옮길 수 있습니다.
  rationale: 전승 본문의 결손과 복원 가능성을 독자에게 숨기지 않았습니다.
- issue: ‘참사람’과 ‘빚을 수 있는 물질’의 관계
  choice: ‘빚을 수 있는 물질 안에 있는 참사람’으로 연결했습니다.
  alternative: ‘빚을 수 있는 물질로 된 참사람’ 또는 ‘참사람이 빚을 수 있는 물질 안에서’로 옮길 수 있습니다.
  rationale: 구문의 관계가 신학적으로 중요하면서도 다소 모호하므로, 성육신이나 단순한 물질 창조로 확정하지 않는 표현을 택했습니다.
- issue: 권세자들이 ‘자신들의 때를 내놓는다’는 표현
  choice: 그들의 지배 기간이 끝난다는 함의를 가지되 원문 은유를 유지했습니다.
  alternative: ‘그들의 시대가 끝날 것이다’로 의역할 수 있습니다.
  rationale: 자발적 포기인지 강제적 종결인지 본문이 명확히 밝히지 않으므로 해석을 확정하지 않았습니다.
- issue: 아들의 통치
  choice: ‘아들이 만물을 다스리신다’로 옮겼습니다.
  alternative: ‘아들이 만물 위에 왕으로 계신다’로 옮길 수 있습니다.
  rationale: ‘reigns over’의 왕권 의미를 살리면서도 자연스러운 현대 한국어로 표현했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 노레아의 질문과 서술은 공손한 합쇼체로, 계시자의 직접 발화는 장중한 해라체로 처리하여 화자 관계를 자연스럽게 드러냈습니다. 원문의 반복되는 ‘그때’를 유지해 종말론적 전개의 리듬을 살렸고, 손상 표시는 독자가 이해할 수 있도록 본문 안에 명시했습니다. 직접 콥트어 대조가 아직 이루어지지 않았으므로 제공된 공공 영역 영어 증언과 그 원어 주석을 근거로 작성한 잠정 원전 지향 번역입니다.
