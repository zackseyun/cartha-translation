  revised_text: '내가 말했습니다. “나의 주님, 저도 그들의 물질에서 비롯되었습니까?”


    “그대와 그대의 자손은 태초부터 계셨던 아버지에게서 비롯되었습니다.


    “영혼들은 위로부터, 소멸하지 않는 빛으로부터 비롯됩니다. 그러므로 권세자들은 영혼들 안에 있는 진리의 영 때문에 그들에게 가까이 갈 수 없습니다. 이 진리의 길을 아는 사람은 누구나 죽을 수밖에 없는 인간들 가운데서 죽지 않을 것입니다.


    “그러나 그 씨는 아직 알려지지 않을 것입니다. 세 시대가 지난 뒤에야 알려질 것이며, 그때 그들을 권세자들의 미혹에 얽매인 상태에서 해방할 것입니다.”


    내가 물었습니다. “나의 주님, 이 일이 이루어지기까지 얼마나 더 남았습니까?”


    그가 내게 말씀하셨습니다. “빚을 수 있는 물질 안에 있는 참사람이 아버지께서 보내신 [진리의 영을] 드러내는 때까지입니다.[a]


    [] “그러면 그는 왕 없는 세대에게서 받은 영원한 생명의 기름을 그들에게 부어 주며, 모든 것에 관하여 그들을 가르칠 것입니다.


    “그때 그들은 눈먼 생각에서 해방될 것입니다. 그들은 권세자들에게서 비롯된 죽음을 짓밟고, 그 씨가 거하는 무한한 빛으로 올라갈 것입니다.


    “그때 권세자들은 그들의 때를 내놓을 것입니다. 그들의 천사들은 그들이 멸망한 까닭에 울고, 그들의 악령들은 그들이 죽은 까닭에 슬퍼할 것입니다.


    “그때 빛의 모든 아들들은 진리와 자신들의 뿌리와 만물의 아버지와 거룩한 영을 참으로 알게 될 것입니다. 그들은 모두 한목소리로 선포할 것입니다. ‘아버지의 진리는 의롭습니다. 아들이 만물을 다스리십니다.’ 그리고 모든 이가 선포할 것입니다. ‘영원무궁토록 거룩하십니다, 거룩하십니다, 거룩하십니다! 아멘.’”


