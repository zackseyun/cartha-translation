    rationale: ‘만드십시오/숨으십시오/놓으십시오’로 통일하면 현대 격식체의 요구를 충족하면서 원문의 명령을 유지합니다.
  revised_text: '통치자들은 서로 모의하며 말했습니다. “자, 우리 손으로 홍수를 일으켜 사람과 짐승, 곧 모든 육체를 멸절합시다.”


    세력들의 통치자가 그들의 계략을 알고 노아에게 말했습니다. “썩지 않는 나무로 방주를 만드십시오. 당신은 자녀들과 짐승들, 하늘의 새들, 곧 작은 것과 큰 것 모두와 함께 그 안에 숨으십시오. 그리고 그것을 시르 산에 놓으십시오.”


    그때 오레아[3]가 방주에 타려고 노아에게 다가갔습니다. 노아가 그 여자를 거절하자, 오레아는 방주에 입김을 불어 방주가 불에 삼켜지게 했습니다. 그래서 노아는 두 번째로 방주를 만들었습니다.'
