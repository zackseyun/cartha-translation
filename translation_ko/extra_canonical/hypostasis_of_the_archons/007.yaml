    rationale: 영어 증언은 Noah가 자녀들 및 동물들과 ‘함께’ 방주 안에 숨는다는 명령입니다. 동반자 전체가 숨는 구조를 명시해야 합니다.
  - severity: low
    issue: 본문의 ‘오레아[3][a]’는 영어 증언에 있는 [3]에 번역자 각주 표지 [a]를 덧붙인 형태입니다.
    rationale: '[3] 자체가 사본 또는 편집 표지로 보류되어야 하나, [a]는 원문 증언의 표지가 아니며 본문 안에서 중복된 표지처럼 보입니다. 번역 근거의 한계는 프로젝트 메타데이터로 이미 제시되어 있으므로 본문 각주로 반복하지 않는 편이 낫습니다.'
