    Orea [3] then approached Noah, desirous to board the ark. When he refused her, she blew on the ark so that it was devoured by fire. So a second time he made an ark.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: ko
  text: '통치자들은 서로 모의하며 말했습니다. “자, 우리 손으로 홍수를 일으켜 사람과 짐승을 비롯한 모든 육체를 멸절합시다.”


    세력들의 통치자가 그들의 계략을 알고 노아에게 말했습니다. “썩지 않는 나무로 방주를 하나 만들어, 너와 네 자녀들과 짐승들과 하늘의 새들을 크고 작은 것 할 것 없이 그 안에 숨기고, 그 방주를 시르산에 두어라.”


    그때 오레아[3][a]가 방주에 타려고 노아에게 다가갔습니다. 노아가 오레아를 받아들이지 않자, 오레아는 방주에 입김을 불었고 방주는 불에 삼켜졌습니다. 그래서 노아는 두 번째로 방주를 만들었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문의 [3]은 제공된 영어 증언에 있는 사본상 또는 편집상의 표지를 그대로 보존한 것입니다. 현재 번역은 공개 영역 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 원문 대조는 아직 이루어지지 않았습니다.
    reason: 대괄호 숫자의 성격과 번역 근거의 한계를 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: archons
  choice: 통치자들
  rationale: 이 문헌에서 우주적 권세자들을 가리키는 용어의 의미를 살리면서, ‘아르콘’이라는 음역보다 일반 독자가 곧바로 이해할 수 있게 옮겼습니다.
- source_word: all flesh
  choice: 사람과 짐승을 비롯한 모든 육체
  rationale: ‘모든 육체’라는 고대적 표현을 보존하되, 뒤따르는 humans and beasts의 범위를 자연스럽게 드러냈습니다.
- source_word: archon of the forces
  choice: 세력들의 통치자
  rationale: forces를 특정한 군대나 천상 계급으로 단정하지 않고 원문의 모호성을 유지했습니다.
- source_word: ark
  choice: 방주
  rationale: 홍수 이야기의 문맥에서 한국어 독자에게 익숙한 용어를 사용했습니다.
- source_word: blew on the ark
  choice: 방주에 입김을 불었고
  rationale: 행위의 기이하고 신화적인 성격을 합리화하지 않고 문자적 이미지를 보존했습니다.
- source_word: Mount Sir
  choice: 시르산
  rationale: 지명을 번역하거나 다른 산과 동일시하지 않고 음역했습니다.
theological_decisions:
- issue: 홍수를 계획한 통치자들과 노아에게 경고한 ‘세력들의 통치자’의 관계
  choice: 양자의 관계나 도덕적 지위를 설명하지 않고 서술 그대로 보존했습니다.
  alternative: 노아에게 경고한 존재를 선한 최고 신 또는 통치자들의 우두머리로 명시할 수 있습니다.
  rationale: 본문 자체가 그 정체와 관계를 명확히 해설하지 않으므로 신학적으로 단정하지 않았습니다.
- issue: 오레아가 방주를 불태운 행위의 성격
  choice: 초자연적 행위를 설명하거나 평가하지 않고 그대로 옮겼습니다.
  alternative: 입김을 불어 기적적으로 불태웠다고 해설할 수 있습니다.
  rationale: 본문의 긴장과 간결성을 유지하고 해석을 본문에 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 자연스럽게 다듬되, ‘모든 육체’, ‘입김을 불다’, ‘세력들의 통치자’처럼 문헌의 고대적·신화적 긴장을 담은 표현은 평이하게 해소하지 않았습니다.
