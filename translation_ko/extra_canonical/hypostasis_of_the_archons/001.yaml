  text: '[] Concerning the substance of the authorities (from which they were made). [2] By the spirit of the Father of truth, the great apostle mentioned the authorities of darkness, and informed us that “our battle is not against flesh and [blood], but against the cosmic authorities and the spirits of evil.” I have sent you this writing because you inquired concerning the substance of the authorities (from which they were made).'
translation:
  language: ko
  text: '권세들의 본질에 관하여(그들이 무엇으로 만들어졌는지에 관하여)


    진리의 아버지께로부터 온 영을 통하여, 위대한 사도는 어둠의 권세들을 언급하며 우리에게 이렇게 알려 주었습니다. “우리의 싸움은 살과 [피]를 상대하는 것이 아니라, 우주를 다스리는 권세들과 악의 영들을 상대하는 것입니다.”[a] 당신이 권세들의 본질, 곧 그들이 무엇으로 만들어졌는지를 물었으므로, 내가 이 글을 당신에게 보냅니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에베소서 6:12을 연상시키는 인용입니다. 이곳의 문구는 전해지는 신약 본문과 일부 표현이 다릅니다. 대괄호로 표시한 [피]는 손상되었거나 복원된 본문을 나타냅니다.
    reason: 상호본문성을 알리고, 원문 증언에 보존된 대괄호의 문헌학적 기능을 설명하기 위해서입니다.
lexical_decisions:
- source_word: substance
  choice: 본질
  rationale: 문맥상 권세들이 무엇으로 이루어졌는지를 묻는 말이지만, 제목의 철학적·존재론적 함의를 보존하기 위해 ‘본질’을 쓰고 괄호의 설명을 유지했습니다.
- source_word: authorities
  choice: 권세들
  rationale: 초월적 지배 세력들을 가리키는 반복 핵심어이므로 인격적 복수성을 살린 ‘권세들’로 일관되게 옮겼습니다.
- source_word: cosmic authorities
  choice: 우주를 다스리는 권세들
  rationale: ‘우주적 권세들’보다 현대 독자에게 뜻이 분명하면서도 cosmic의 지배 영역을 드러냅니다.
- source_word: spirits of evil
  choice: 악의 영들
  rationale: ‘악한 영들’로 성격을 단정하기보다 원문의 속격 관계를 보존했습니다.
- source_word: battle
  choice: 싸움
  rationale: 군사적 대결의 뜻을 자연스럽고 직접적인 현대 한국어로 전달합니다.
theological_decisions:
- issue: ‘Father of truth’와 영의 관계
  choice: 진리의 아버지께로부터 온 영
  alternative: 진리의 아버지의 영
  rationale: 영이 아버지에게서 비롯된다는 영어 증언의 ‘of/from’ 관계를 드러내되, 두 존재의 관계를 교리적으로 더 규정하지 않았습니다.
- issue: 권세들의 존재론적 성격
  choice: ‘권세들’이라는 명칭과 ‘무엇으로 만들어졌는지’라는 설명을 그대로 유지
  alternative: 악령들 또는 타락한 천사들로 명시
  rationale: 본문이 권세들의 정체를 특정 교리 범주로 확정하지 않으므로 그 긴장과 모호성을 보존했습니다.
- issue: 사도 인용문의 성격
  choice: 본문에 있는 표현만 인용하고 특정 성경 구절 표기는 각주에서 설명
  alternative: 본문에 ‘바울이 말했습니다’ 또는 구절 번호 삽입
  rationale: ‘위대한 사도’가 누구인지 본문 자체보다 더 명시하지 않으면서 문학적 형태를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 제목과 반복 문구는 문헌의 철학적 어조를 살리되, 괄호의 풀이를 통해 일반 독자가 이해할 수 있도록 했습니다. 원고의 맨 앞 빈 대괄호와 쪽수 [2]는 본문 내용이 아니므로 제외했으며, 손상·복원을 나타내는 [피]는 보존했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로 공개 영역 영어 증언에 근거한 잠정 초안입니다.
