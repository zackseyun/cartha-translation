translation:
  language: ko
  text: '그들의 우두머리는 눈먼 자입니다. 그는 [자신의] 권능과 무지와 교만 때문에 자기 [권능]으로 이렇게 선언했습니다. “나는 하나님이다. [나 외에는] 다른 이가 없다.”


    그가 이렇게 말했을 때, 그는 [만유]를 거슬러 죄를 지었습니다.[a] 이 자랑은 불멸성에까지 올라갔고, [] 불멸성으로부터 한 음성이 응답하여 말했습니다. “사마엘아, 너는 잘못되었다.” ‘사마엘’은 “눈먼 신”이라는 뜻이니, 그의 생각들이 눈멀어 있었기 때문입니다. 그는 자기 권능, 곧 자신이 내뱉은 신성 모독을 쏟아 냈고, 피스티스 소피아의 이끄심을 받아 그것을 따라 카오스와 자기 어머니인 심연에게까지 내려갔습니다.[b] 피스티스 소피아는 그의 자손 하나하나를 그 권능에 맞게, 높은 곳의 영원한 아이온들을 닮도록 세웠습니다. 보이는 것은 보이지 않는 것에서 생겨났기 때문입니다.


    불멸성은 물들이 있는 곳을 내려다보았습니다. 그의 형상이 물 위에 비친 모습으로 나타나자, 어둠의 권세자들은 그 형상에 마음을 빼앗겼습니다. 그러나 그들은 미약했기 때문에 물 위에 나타난 형상을 붙잡을 수 없었습니다. 혼에 속할 뿐인 것은 영에 속한 것을 붙잡을 수 없습니다. 권세자들은 아래에서 생겨났지만 불멸성의 형상은 위에서 왔기 때문입니다.[c]


    그러므로 불멸성은 아버지의 뜻에 따라 그들 모두를 빛과 하나 되게 하려고 그곳을 내려다보았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 전승 본문의 손상되거나 불확실한 부분을 보충한 것입니다. 빈 대괄호 []는 복원되지 않은 결락을 나타냅니다.
    reason: 제공된 증언문에 보존된 본문비평 표지를 독자가 이해하도록 설명합니다.
  - marker: b
    text: “그것을 따라”가 정확히 무엇을 가리키는지는 문장 구조상 분명하지 않습니다. 여기서는 그 모호성을 그대로 두었습니다.
    reason: 대명사의 지시 대상을 번역자가 임의로 확정하지 않기 위해서입니다.
  - marker: c
    text: “혼에 속한 것”과 “영에 속한 것”은 이 문헌의 서로 다른 우주론적 범주를 가리킵니다.
    reason: 현대적 의미의 감정과 정신의 단순한 대조로 오해되는 것을 막습니다.
lexical_decisions:
- source_word: indestructability / indestructibility
  choice: 불멸성
  rationale: 파괴되지 않음과 썩지 않음을 가리키는 의인화된 추상 실재를 간결하게 나타냈습니다. 문맥에서 인칭적 행위자로 나타나지만 별도의 고유명사로 단정하지 않았습니다.
- source_word: the All
  choice: 만유
  rationale: 영지주의 문헌에서 총체적 실재를 가리킬 수 있는 용어의 전문적 울림을 유지하면서도 현대 한국어 독자가 이해할 수 있도록 옮겼습니다.
- source_word: authorities
  choice: 권세자들
  rationale: 단순한 추상적 권력이 아니라 인격화된 우주적 지배자들을 가리키므로 ‘권세자들’로 번역했습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 이 문헌의 특수한 우주론적 존재 또는 영역이라는 의미를 보존하기 위해 일반어 ‘시대’로 풀지 않고 음역했습니다.
- source_word: soulish / spiritual
  choice: 혼에 속한 / 영에 속한
  rationale: 서로 대조되는 인간론·우주론적 범주를 유지하되 ‘정신적’처럼 현대 심리학적으로 오해될 표현은 피했습니다.
- source_word: Abyss
  choice: 심연
  rationale: 고유한 우주론적 장소이자 모성적 존재로 의인화된 점을 살려 ‘심연’으로 옮겼습니다.
theological_decisions:
- issue: “I am God; there is no other except me”의 신명 표현
  choice: “나는 하나님이다. [나 외에는] 다른 이가 없다.”
  alternative: “나는 신이다. [나 외에는] 아무도 없다.”
  rationale: 화자의 유일신적 주장을 자연스럽게 드러내되, 본문이 그 주장을 오류와 신성 모독으로 규정하는 긴장을 그대로 보존했습니다.
- issue: 불멸성의 존재론적 성격
  choice: 추상명사 ‘불멸성’을 유지하고 인격적 행동을 그대로 서술함
  alternative: ‘불멸의 존재’ 또는 특정 신적 존재로 명시함
  rationale: 본문의 의인화는 살리되 그것이 속성, 영역, 아이온, 인격적 존재 중 무엇인지 번역에서 단정하지 않았습니다.
- issue: 빛과의 결합
  choice: “그들 모두를 빛과 하나 되게 하려고”
  alternative: “그들 모두를 빛에 결합시키려고”
  rationale: 연합의 의미를 자연스럽게 전달하면서도 구원론적 방식이나 결과를 구체적으로 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 고대 영지주의 문헌의 장엄하고 논증적인 어조를 유지하되 문장을 지나치게 고어화하지 않았습니다. 제공 자료가 콥트어 직접 대조가 완료되지 않은 공개 영역 영어 증언문이므로, 대괄호와 결락 표지를 보존하고 불명확한 대명사 및 존재론적 범주를 임의로 해소하지 않았습니다.
