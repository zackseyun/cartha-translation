  - severity: low
    issue: ‘전제자의 위 영역에 있는 불의’가 소유 관계를 다소 약화합니다.
    rationale: 원문의 ‘the injustice of the upper realm of the autocrat’는 전제자에게 속한 위 영역의 불의를 가리킵니다. ‘전제자의 위 영역의 불의’가 더 직접적입니다.
