base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: ko
  text: '얄다바오트의 아들 사바오트는 그 천사의 권능을 보고 회개하였으며, 자신이 비방하던 아버지와 어머니인 물질에게 심판을 선고하였습니다.


    그는 위에 있는 소피아와 그녀의 딸 조에에게 찬양의 노래를 불렀습니다. 소피아와 조에는 그를 들어 올려, 위 영역과 아래 영역을 가르는 휘장 아래의 일곱째 하늘을 다스리도록 세웠습니다. 그는 ‘만군의 하나님 사바오트’라고 불립니다. 소피아가 그를 세워 혼돈의 군대들을 다스리게 하였기 때문입니다.


    이 일들이 일어난 뒤, 사바오트는 자신을 위하여 얼굴이 넷인 거대한 그룹들의 병거를 만들고, 자신을 섬길 무수한 천사들과 수금과 비파도 만들었습니다.


    소피아는 자기 딸 조에를 데려와 그의 오른편에 앉히고, 여덟째 하늘의 일들을 그에게 가르치게 하였습니다. 그리고 진노의 천사를 그의 왼편에 두었습니다.


    그날부터 [그의 오른편]은 ‘생명’이라 불렸고, [a] 왼편은 전제자의 위 영역에 있는 불의를 상징하게 되었습니다. 여러분이 존재하기 전부터 이 일들은 이미 일어나 있었습니다.


    얄다바오트는 사바오트가 이처럼 큰 위엄을 지니고 그토록 높이 들린 것을 보고 그를 시기하였습니다. 그의 시기는 남성과 여성의 성격을 함께 지닌 존재가 되었습니다. 이렇게 시기가 생겨났고, 시기는 죽음을 낳았습니다. 죽음은 자손들을 낳고, 그들 각자를 저마다의 하늘을 다스리도록 세웠습니다. 혼돈의 모든 하늘은 그들의 무리로 가득 찼습니다.


    그러나 이 모든 일은 만유의 아버지의 뜻에 따라, 위에 있는 모든 것의 본을 좇아 일어났습니다. 이는 혼돈이 완결되게 하려는 것이었습니다.


    보십시오. 나는 여러분에게 집정자들의 형상과, 그 안에서 드러난 물질과, 그들의 어버이와 세계에 관하여 가르쳐 주었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 사본은 손상되었거나 일부가 빠져 있어, 문장의 연결과 정확한 복원이 불확실합니다.
    reason: 제공된 증거문에 빈 복원 괄호([])가 있어 본문 손상과 불확실성을 독자에게 알릴 필요가 있습니다.
lexical_decisions:
- source_word: Sabaoth / God of hosts
  choice: 사바오트 / 만군의 하나님
  rationale: 고유명사 사바오트는 음역하고, 칭호는 한국어 성서 전통에서 널리 이해되는 ‘만군의 하나님’으로 옮겨 본문의 어원적 설명을 살렸습니다.
- source_word: Sophia / Zoe
  choice: 소피아 / 조에
  rationale: 인격화된 고유 존재의 이름이므로 음역하되, 조에가 뒤에서 ‘생명’과 연결되는 의미 관계는 본문에서 드러나게 하였습니다.
- source_word: archons
  choice: 집정자들
  rationale: 영지주의 문헌에서 우주적 통치 세력을 가리키는 기술적 용어로서 ‘집정자’를 사용하였습니다.
- source_word: autocrat
  choice: 전제자
  rationale: 독자적으로 권력을 행사하는 지배자라는 부정적 함의를 보존하면서 특정 신학적 동일시를 피했습니다.
- source_word: Matter
  choice: 물질
  rationale: 어머니로 인격화된 원리라는 긴장을 보존하기 위해 보통명사 뜻을 살려 번역했습니다.
- source_word: androgynous entity
  choice: 남성과 여성의 성격을 함께 지닌 존재
  rationale: 현대 독자가 의미를 바로 이해하도록 풀어 옮기되, 원문의 양성적 성격을 축소하지 않았습니다.
- source_word: summation of chaos
  choice: 혼돈이 완결됨
  rationale: ‘summation’의 의미가 총합인지 완성·완결인지 불확실한 가운데, 우주론적 과정의 성취를 나타내는 문맥에 맞추되 모호성을 완전히 해소하지 않았습니다.
- source_word: mold
  choice: 형상
  rationale: 틀·주형·형태의 의미 가능성 가운데 자연스러운 한국어를 택했으며, 물질적 조형의 뉘앙스를 어느 정도 유지했습니다.
theological_decisions:
- issue: 사바오트의 지위와 ‘하나님’ 칭호
  choice: ‘만군의 하나님 사바오트’라는 본문의 칭호를 그대로 보존함
  alternative: 정통 신학의 하나님과 혼동되지 않도록 ‘신’ 또는 설명적 칭호로 완화함
  rationale: 이 문헌 자체의 우주론과 칭호를 번역자가 교정하거나 특정 교리 체계에 맞추지 않고 그대로 제시했습니다.
- issue: 물질의 인격화
  choice: ‘어머니인 물질’로 번역함
  alternative: ‘물질이라는 어머니’ 또는 고유명사처럼 ‘마테르’로 음역함
  rationale: 원문 증거층에 제시된 Matter의 개념적·인격적 이중성을 유지했습니다.
- issue: 오른편과 왼편의 상징
  choice: 오른편은 생명, 왼편은 전제자의 위 영역에 있는 불의의 상징으로 제시함
  alternative: 후대의 선악 이분법으로 명시적으로 해석함
  rationale: 본문이 말하는 상징 관계만 보존하고 추가적인 교리 해석을 넣지 않았습니다.
- issue: 만유의 아버지의 뜻과 혼돈의 사건들
  choice: 악하거나 혼돈스러운 사건들조차 그 뜻에 따라 일어났다는 본문의 긴장을 유지함
  alternative: ‘허용’으로 완화하여 번역함
  rationale: 의지와 허용의 신학적 차이를 번역자가 임의로 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 현재 초안은 제공된 공용 영어 번역 증거와 감수된 영어 POB를 바탕으로 하며, 콥트어 원문 대조가 아직 이루어지지 않았으므로 복원 지점과 일부 전문 용어의 선택은 잠정적입니다.
