    rationale: ‘얼굴이 넷인 그룹들로 된 거대한 병거’는 four-faced cherubim의 관계를 명확히 하고, ‘남성과 여성의 특성을 함께 지닌 존재’는 androgynous의 뜻을 자연스럽게 보존합니다.
