    Regarding that angel, I am unable to speak of his power. His appearance resembles fine gold, and his garment resembles snow. My mouth is truly unable to speak of his power and the appearance of his face.


    The great angel Eleleth spoke to me, and said: “I am Wisdom, being one of the Four Lights who stand in front of the great unseen Spirit. Do you (really) imagine that these archons are able to exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Also, these authorities will be unable to defile you and that generation, because your abode is in indestructibility, where abides the virgin Spirit, who is superior over the authorities of chaos and over their world.”'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: ko
  text: '천사가 말했습니다. “나는 거룩한 영 앞에 서 있는, 지혜인 위대한 천사 엘렐렛입니다. 나는 당신과 이야기하고 무법한 자들의 손에서 당신을 구원하도록 보냄을 받았습니다. 또한 당신의 뿌리[a]에 관하여 가르쳐 주겠습니다.”


    그 천사에 관해서는 내가 그의 능력을 이루 다 말할 수 없습니다. 그의 모습은 순금 같고, 그의 옷은 눈 같습니다. 참으로 내 입으로는 그의 능력과 얼굴 모습을 이루 다 말할 수 없습니다.


    위대한 천사 엘렐렛이 내게 말했습니다. “나는 지혜이며, 위대하고 보이지 않는 영 앞에 서 있는 네 빛 가운데 하나입니다. 당신은 이 지배자들이 당신에게 무슨 권세라도 행사할 수 있다고 정말로 생각합니까? 그들 가운데 어느 하나도 진리의 뿌리를 이기지 못할 것입니다. 진리의 뿌리 때문에 그가 마지막 날들에 나타났고[b], 이 권세들은 갇히게 될 것이기 때문입니다. 또한 이 권세들은 당신과 그 세대를 더럽히지 못할 것입니다. 당신의 거처는 파괴될 수 없는 곳[c], 곧 혼돈의 권세들과 그들의 세계보다 높은 처녀 영이 머무는 곳에 있기 때문입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘뿌리’는 기원, 혈통 또는 영적 소속을 가리킬 수 있으나, 여기서는 뜻을 하나로 확정하지 않았습니다.
    reason: 상징어의 다의성을 보존하기 위해 필요합니다.
  - marker: b
    text: ‘그가’가 누구를 가리키는지는 제공된 영어 증언만으로 분명하지 않습니다. 콥트어 원문 대조가 필요합니다.
    reason: 대명사의 선행사에 관한 실제적인 모호성과 자료의 한계를 공개합니다.
  - marker: c
    text: 직역하면 ‘파괴될 수 없음’ 또는 ‘불괴성’입니다. 여기서는 거처를 나타내는 문맥에 맞추어 ‘파괴될 수 없는 곳’으로 옮겼습니다.
    reason: 추상적 우주론 용어를 자연스럽게 번역하면서 원뜻을 알립니다.
lexical_decisions:
- source_word: Eleleth
  choice: 엘렐렛
  rationale: 고유명사의 영어 증언 표기를 바탕으로 음역했습니다. 콥트어 원문 대조가 이루어지면 표기를 재검토해야 합니다.
- source_word: Wisdom
  choice: 지혜
  rationale: 인격적 존재의 자기 정체성을 나타내면서도 원문의 보통명사 의미를 보존했습니다.
- source_word: root
  choice: 뿌리
  rationale: 기원·혈통·영적 소속을 함께 암시할 수 있는 상징어를 해석적으로 풀지 않고 직역했습니다.
- source_word: archons
  choice: 지배자들
  rationale: 특정 전통의 음역어만 사용하지 않고 통치 권세를 뜻하는 명칭으로 자연스럽게 옮겼습니다. 이어지는 authorities와의 관련성도 드러납니다.
- source_word: authorities
  choice: 권세들
  rationale: 앞의 지배자들을 다시 가리키면서 권력적 성격을 나타내도록 번역했습니다.
- source_word: Four Lights
  choice: 네 빛
  rationale: 고유한 우주론적 집단 명칭일 가능성을 살리되, 의미가 드러나는 번역어를 사용했습니다.
- source_word: indestructibility
  choice: 파괴될 수 없는 곳
  rationale: 추상명사를 한국어에서 자연스러운 공간 표현으로 옮기되, 불멸성인지 불괴성인지 단정하지 않았습니다.
- source_word: virgin Spirit
  choice: 처녀 영
  rationale: 원문의 독특한 칭호를 ‘순결한 영’으로 해석해 좁히지 않고 문자적 긴장을 보존했습니다.
theological_decisions:
- issue: ‘그가 마지막 날들에 나타났다’의 선행사
  choice: 남성 단수 대명사 ‘그가’를 그대로 두고 각주로 불확실성을 밝혔습니다.
  alternative: ‘진리의 뿌리가 나타났다’ 또는 특정 구원자 명칭으로 명시할 수 있습니다.
  rationale: 제공된 영어 증언만으로 대명사의 지시 대상을 확정할 수 없으므로 진정한 모호성을 보존했습니다.
- issue: 지배자들이 행사하는 권세
  choice: 수사적 질문과 ‘무슨 권세라도’라는 표현을 유지했습니다.
  alternative: 지배자들에게 권세가 전혀 없다고 평서문으로 단정할 수 있습니다.
  rationale: 본문은 질문 형식으로 그들의 권세를 부정하거나 도전하므로, 이를 교리적 진술로 평탄화하지 않았습니다.
- issue: ‘뿌리’의 정체
  choice: 영적 씨족, 기원, 본성을 특정하지 않고 ‘뿌리’로 유지했습니다.
  alternative: ‘근원’, ‘영적 혈통’, ‘본성’ 등으로 해석할 수 있습니다.
  rationale: 본문의 우주론적·계보적 다의성을 보존하기 위해서입니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 천사의 발화도 합쇼체로 통일하여 위엄과 가독성을 함께 살렸습니다. 제공 자료가 공개 영역 영어 증언이며 콥트어 원문 검토가 아직 이루어지지 않았으므로, 본문은 잠정 번역입니다.
