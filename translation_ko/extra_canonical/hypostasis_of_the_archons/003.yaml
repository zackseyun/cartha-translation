base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/003.yaml
  text: 'The archons plotted and said, “Come, let us create a man to be soil of the earth.”


    They fashioned their creation as an entirely earthly being.


    The archons have bodies that are both female [and male], and their faces are the faces of beasts. They took [soil] from the earth and fashioned [their man] according to their own bodies and [according to the image] of God that had appeared [to them] on the water.


    They said, “[Come], let us seize the image through the form we have molded, [so that] the image may gaze upon its male counterpart [and become enamored with it], [] and so that we may grasp it in the form we have molded.” Because they were powerless, they did not understand the power of God.


    He blew into the man’s face, and the man received a soul, but he remained on the ground for several days. Because they were powerless, the archons could not make him rise. They kept blowing like stormy winds, trying to seize the image that had appeared to them on the waters, but they did not know its power.


    All these events happened by the will of the Father of the All.


    Afterward, the Spirit looked upon the soulish man on the ground. The Spirit came forth from the Adamic Land. It descended and made its dwelling within him, and that man became a living soul. The Spirit called his name Adam because he was found moving on the ground.


    A voice from indestructibility came forth to help Adam. The archons gathered all the animals of the earth and all the birds of the sky and brought them before Adam to learn what Adam might call them, so that he could give names to all the birds and all the animals.'
translation:
  language: ko
  text: '아르콘들은 계략을 꾸미며 말했습니다. “자, 우리가 사람을 만들어 땅의 흙이 되게 합시다.”


    그들은 자신들이 만든 것을 온전히 땅에 속한 존재로 빚었습니다.


    아르콘들의 몸은 여성인 동시에 [남성이며], 그들의 얼굴은 짐승의 얼굴입니다. 그들은 땅에서 [흙을] 취하여 자기들의 몸을 따라, 또 물 위에 [그들에게] 나타났던 하나님의 [형상을 따라] [자기들의 사람을] 빚었습니다.


    그들은 말했습니다. “[자], 우리가 빚은 형체를 통하여 그 형상을 붙잡읍시다. [그리하여] 그 형상이 자기의 남성 짝을 바라보고 [그에게 마음을 빼앗기게 하며], [···] 우리가 빚은 형체 안에서 그 형상을 붙잡을 수 있게 합시다.” 그러나 그들은 무력했으므로 하나님의 능력을 깨닫지 못했습니다.


    그가 그 사람의 얼굴에 숨을 불어넣자, 그 사람은 혼을 지니게 되었지만 여러 날 동안 땅바닥에 그대로 있었습니다. 아르콘들은 무력했으므로 그를 일으켜 세울 수 없었습니다. 그들은 폭풍 같은 바람처럼 계속 숨을 불어, 물 위에 자기들에게 나타났던 형상을 붙잡으려 했으나 그 능력을 알지 못했습니다.


    이 모든 일은 만유의 아버지의 뜻에 따라 일어났습니다.


    그 뒤 영이 땅바닥에 있는 혼적인 사람을 바라보았습니다. 영은 아담의 땅[a]에서 나와 내려가 그의 안에 거처를 정했습니다. 그러자 그 사람은 살아 있는 혼이 되었습니다. 영은 그의 이름을 아담이라 불렀으니, 그가 땅바닥에서 움직이는 것이 발견되었기 때문입니다.[b]


    불멸의 영역에서 한 음성이 나와 아담을 도왔습니다.[c] 아르콘들은 땅의 모든 짐승과 하늘의 모든 새를 한데 모아 아담 앞으로 데려왔습니다. 아담이 그것들을 무엇이라 부를지 알아보고, 그가 모든 새와 모든 짐승에게 이름을 붙이게 하려는 것이었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아담의 땅’은 제공된 영어 증거의 Adamic Land를 옮긴 말입니다. ‘아담의 영역’ 또는 ‘아다마의 땅’으로 이해될 가능성이 있으며, 콥트어 원문 대조가 필요합니다.
    reason: 원언어 검토가 보류된 상태에서 고유한 우주론적 지명 또는 어원 유희일 가능성을 표시합니다.
  - marker: b
    text: ‘아담’과 ‘땅’의 관계를 설명하는 어원적 말장난이 반영되어 있습니다. 한국어에서는 그 소리의 연관성이 드러나지 않습니다.
    reason: 번역에서 재현하기 어려운 명명 설명을 알립니다.
  - marker: c
    text: 직역하면 ‘불멸성에서 한 음성이 나와 아담에게 도움이 되었습니다’입니다. 여기서는 음성이 나오는 초월적 영역을 나타내는 것으로 옮겼습니다.
    reason: ‘불멸성’이 추상적 속성인지 영역인지에 관한 의미상의 여지를 밝힙니다.
lexical_decisions:
- source_word: archons
  choice: 아르콘들
  rationale: 이 문헌의 우주론적 지배자들을 가리키는 전문 용어이므로 일반어인 ‘통치자들’로 평준화하지 않고 음역했습니다.
- source_word: soul / soulish
  choice: 혼 / 혼적인
  rationale: 본문이 뒤이어 말하는 ‘영’과 구별되는 층위를 보존하기 위해 ‘영혼’ 대신 ‘혼’을 사용하고, 형용사도 ‘혼적인’으로 대응했습니다.
- source_word: Spirit
  choice: 영
  rationale: ‘혼’과의 대조를 선명하게 유지하며, 원문의 인격적 행위를 반영했습니다.
- source_word: image
  choice: 형상
  rationale: 창조 서사의 상호본문성과 물 위에 나타난 초월적 원형이라는 의미를 함께 살리는 전통적이고 자연스러운 표현입니다.
- source_word: form
  choice: 형체
  rationale: 아르콘들이 물질로 빚은 외적 몸과 초월적 ‘형상’을 구별하기 위해 별도의 용어를 택했습니다.
- source_word: Father of the All
  choice: 만유의 아버지
  rationale: ‘All’을 우주론적 총체로 읽을 수 있는 여지를 보존하면서 한국어 종교 문체에 자연스럽게 옮겼습니다.
- source_word: indestructibility
  choice: 불멸의 영역
  rationale: 추상적 속성만이 아니라 음성이 나오는 초월적 차원을 가리키는 문맥을 반영했습니다.
theological_decisions:
- issue: 숨을 불어넣은 주체의 모호성
  choice: ‘그가’로 유지
  alternative: ‘한 아르콘이’ 또는 특정 아르콘의 이름을 명시
  rationale: 제공된 증거에서 단수 대명사의 지시 대상이 명확하지 않으므로 해석으로 보충하지 않았습니다.
- issue: 인간의 혼과 영의 관계
  choice: 처음에는 ‘혼을 지니게’ 되고 뒤이어 영이 거처하여 ‘살아 있는 혼’이 되는 순서를 그대로 보존
  alternative: 두 사건을 하나의 생명 부여 사건으로 통합
  rationale: 본문의 우주론적·인간론적 긴장과 두 단계의 서술을 교리적으로 조화시키지 않았습니다.
- issue: 모든 사건과 아버지의 뜻
  choice: ‘만유의 아버지의 뜻에 따라’로 직접 번역
  alternative: 아버지의 허용이나 섭리로 완화
  rationale: 악의적 계략까지 포함하는 듯한 신학적 긴장을 원문대로 남겼습니다.
- issue: 창세기와의 관계
  choice: 창세기 용어를 연상시키되 본문의 독자적 재서술을 유지
  alternative: 정경 창세기의 익숙한 문구로 전면 동화
  rationale: 상호본문성은 살리면서 이 문헌 특유의 아르콘·형상·혼·영의 구도를 지웠지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 고대 종교 문헌에 어울리는 절제되고 품위 있는 문체를 유지했습니다. 대괄호는 보충·복원된 본문을 나타내므로 모두 보존했고, 원문의 빈 대괄호는 독자가 손상 부분임을 알아볼 수 있도록 [···]로 표시했습니다. 제공 자료가 공용 영어 번역 증거이며 콥트어 원문 검토가 아직 이루어지지 않았으므로, 특히 ‘아담의 땅’, 대명사 지시 대상, 손상부 복원은 잠정적입니다.
