    그들은 말했습니다. “[자], 우리가 빚은 형체를 통하여 그 형상을 붙잡읍시다. [그리하여] 그 형상이 자기의 남성 짝을 바라보고 [그에게 마음을 빼앗기게 하며], [] 우리가 빚은 형체 안에서 그 형상을 붙잡을 수 있게 합시다.” 그러나 그들은 무력했으므로 하나님의 능력을 깨닫지 못했습니다.


    그가 그 사람의 얼굴에 숨을 불어넣자, 그 사람은 혼을 지니게 되었지만 여러 날 동안 땅바닥에 그대로 있었습니다. 아르콘들은 무력했으므로 그를 일으켜 세울 수 없었습니다. 그들은 폭풍 같은 바람처럼 계속 숨을 불어, 물 위에 자기들에게 나타났던 형상을 붙잡으려 했으나 그 형상의 능력을 알지 못했습니다.


