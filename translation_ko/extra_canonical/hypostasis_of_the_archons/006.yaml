base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/006.yaml
  text: 'Next, Eve gave birth to their son Cain, and Cain cultivated the land. Then Adam knew his wife. She became pregnant again and gave birth to Abel, and Abel was a shepherd. Cain brought crops from his field, while Abel brought an offering from among his lambs. God looked favorably on Abel’s offering, but he did not accept Cain’s offerings.


    The fleshly Cain pursued his brother Abel.


    God said to Cain, “Where is your brother Abel?”


    Cain answered, “Am I my brother’s keeper?”


    God said to Cain, “Listen! The voice of your brother’s blood cries out to me. You have sinned with your mouth. It will return to you. Whoever kills Cain will unleash seven acts of revenge, and you will live moaning and trembling on the earth.”


    Adam once again [knew] his female counterpart Eve, and she became pregnant and bore [Seth] to Adam. She said, “I have given birth to [another] man through God, to replace [Abel].”


    Eve became pregnant again and gave birth to [Norea]. Eve said, “He has begotten a virgin for me to help many generations of humans.” [] She is the virgin whom the forces did not defile.


    And humanity began to multiply and progress.'
translation:
  language: ko
  text: '그 뒤에 하와는 그들의 아들 카인을 낳았고, 카인은 땅을 경작했습니다. 그러고 나서 아담이 자기 아내를 알았습니다.[a] 하와는 다시 임신하여 아벨을 낳았고, 아벨은 목자였습니다. 카인은 자기 밭에서 거둔 곡식을 가져왔고, 아벨은 자기 어린양들 가운데서 제물을 가져왔습니다. 하나님께서는 아벨의 제물은 호의로 보셨으나, 카인의 제물들은 받아들이지 않으셨습니다.


    육신에 속한 카인은 자기 동생 아벨을 뒤쫓았습니다.[b]


    하나님께서 카인에게 말씀하셨습니다. “네 동생 아벨이 어디 있느냐?”


    카인이 대답했습니다. “제가 제 동생을 지키는 사람입니까?”


    하나님께서 카인에게 말씀하셨습니다. “들어라! 네 동생의 피가 내게 부르짖는 소리가 들린다. 너는 네 입으로 죄를 지었다.[c] 그것이 네게 돌아갈 것이다. 누구든지 카인을 죽이는 자는 일곱 번의 복수를 불러일으킬 것이며, 너는 땅 위에서 신음하고 떨며 살 것이다.”


    아담이 다시 자기의 여성 짝인 하와를 [알았고], 하와는 임신하여 아담에게 [셋을] 낳아 주었습니다.[d] 하와가 말했습니다. “내가 하나님을 통하여 [또 다른] 남자를 낳았습니다. [아벨을] 대신하게 하려는 것입니다.”


    하와는 다시 임신하여 [노레아를] 낳았습니다.[d] 하와가 말했습니다. “그분께서 나를 위하여 한 처녀를 낳게 하셨습니다. 수많은 인간 세대를 돕게 하시려는 것입니다.” […][e] 그 여자가 바로 세력들이 더럽히지 못한 처녀입니다.[f]


    그리하여 인류는 번성하고 발전하기 시작했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘알다’는 부부의 성적 결합을 완곡하게 이르는 표현입니다.
    reason: 현대 독자가 문자적 인지만을 뜻하는 것으로 오해하지 않도록 설명합니다.
  - marker: b
    text: ‘뒤쫓았습니다’에 해당하는 표현은 이 문장만으로는 카인이 아벨을 붙잡았거나 죽였는지까지 명시하지 않습니다.
    reason: 원문 증언의 서사적 생략과 모호성을 보존합니다.
  - marker: c
    text: ‘네 입으로 죄를 지었다’는 제공된 증언의 난해한 문구입니다. 살인이나 거짓말 가운데 하나로 한정하지 않았습니다.
    reason: 불확실한 본문을 해석으로 매끄럽게 고치지 않았음을 알립니다.
  - marker: d
    text: 대괄호 안의 말은 손상되었거나 불확실한 본문을 복원한 부분임을 나타냅니다.
    reason: 제공된 영어 증언의 본문 복원 표시를 보존합니다.
  - marker: e
    text: 이 지점에는 본문이 빠진 흔적이 있습니다.
    reason: 제공된 증언의 빈 대괄호를 독자가 이해할 수 있는 결락 표시로 나타냅니다.
  - marker: f
    text: ‘세력들’은 이 작품에 등장하는 초인간적 권세들을 가리키지만, 여기서는 그 정체를 더 구체적으로 규정하지 않습니다.
    reason: 작품 특유의 용어를 설명하되 교리적으로 과도하게 특정하지 않습니다.
lexical_decisions:
- source_word: knew
  choice: 알았습니다 / [알았고]
  rationale: 성적 결합을 완곡하게 나타내는 성서적 표현의 중의성과 반복 구조를 보존했습니다.
- source_word: fleshly Cain
  choice: 육신에 속한 카인
  rationale: 단순히 ‘육체를 지닌’이라는 뜻으로 축소하지 않고, 본문의 육신적 성격 규정을 자연스러운 한국어로 나타냈습니다.
- source_word: pursued
  choice: 뒤쫓았습니다
  rationale: 제공된 증거가 살해 행위 자체를 명시하지 않으므로 ‘죽였다’로 보충하지 않고 추적 행위의 모호성을 보존했습니다.
- source_word: female counterpart
  choice: 여성 짝
  rationale: ‘아내’로 평준화하지 않고 원문 증언의 대응자·짝이라는 독특한 표현을 살렸습니다.
- source_word: forces
  choice: 세력들
  rationale: 이 작품에서 초인간적 적대 존재들을 가리킬 수 있으나, 특정 교리적 명칭을 덧붙이지 않고 일반적이고 열린 표현을 택했습니다.
- source_word: progress
  choice: 발전하다
  rationale: 단순한 수적 증가와 구별되는 진전의 의미를 보존했습니다.
theological_decisions:
- issue: 하나님의 정체를 특정 신학 체계에 맞추는 문제
  choice: 본문의 God을 ‘하나님’으로 번역
  alternative: ‘신’, ‘최고신’ 또는 ‘조물주’로 해석하여 번역
  rationale: 이 대목 자체가 제공하는 호칭을 넘어서 작품의 신적 존재 위계를 단정하지 않았습니다.
- issue: ‘네 입으로 죄를 지었다’의 난해한 진술
  choice: 문면 그대로 보존
  alternative: 카인의 살인이나 거짓말을 명시하도록 의역
  rationale: 증언에 있는 입과 죄의 관계가 불분명하므로, 신학적·서사적으로 원인을 확정하지 않았습니다.
- issue: ‘그분께서 … 낳게 하셨다’의 주어
  choice: 남성 단수 주어를 ‘그분’으로 유지
  alternative: ‘하나님께서’라고 명시
  rationale: 직전 문맥상 하나님을 가리킬 가능성이 크지만, 제공된 증언의 대명사를 고유 명사로 확정하지 않았습니다.
- issue: 세력들이 처녀를 더럽히지 못했다는 진술
  choice: ‘더럽히지 못한’으로 번역
  alternative: 성적 침해 또는 영적 오염 가운데 하나로 명시
  rationale: ‘defile’이 지닌 신체적·의례적·영적 가능성을 열어 두었습니다.
translation_notes:
  register: 전체를 현대 표준 한국어의 정중한 합쇼체로 옮겼습니다. 서술은 간결하고 품위 있게 유지했으며, 직접화법에서도 고대적 분위기를 살리되 일반 독자가 이해할 수 있는 표현을 사용했습니다. 제공 자료가 콥트어 직접 대조 전의 공공 영역 영어 증언에 근거하므로, 대괄호 복원과 결락 및 난해한 문구를 드러내어 잠정성을 보존했습니다.
