translation:
  language: ko
  text: '내가 말했습니다. “나의 주여, 이 권세자들의 [권능]에 관하여 가르쳐 주십시오. 그들은 [어떻게] 생겨났으며, 어떤 본질에서, 또 [] 어떤 물질에서 생겨났습니까? 누가 그들과 그들의 힘을 창조했습니까?”[a]


    지혜인 위대한 천사 엘렐레트가 내게 말했습니다. “불멸성이 무한한 아이온들 안에 거합니다. 피스티스라고 불리는 소피아는 자기 짝과는 별도로, 스스로 무언가를 창조하고자 했습니다. 그가 만들어 낸 것은 위로부터 비롯되었습니다.


    “위쪽 세계와 아래쪽 아이온들 사이에는 휘장이 있습니다. 그 휘장 아래에서 그림자가 생겨났고, 그 그림자는 물질이 되었으며, 그 그림자는 따로 떨어진 한 곳으로 내려앉았습니다.


    “그가 만들어 낸 것은 유산된 태아를 닮은 물질적인 것으로 자라났습니다. 그 형체는 그림자로 빚어졌고, 사자를 닮은 오만한 짐승이 되었습니다. 그것은 내가 앞서 말했듯 남성과 여성을 함께 지닌 존재였습니다. 물질에서 비롯되었기 때문입니다.


    “그가 눈을 뜨고 광대하고 끝없이 펼쳐진 물질을 바라보자 오만해져서 말했습니다. ‘내가 하나님이다. 나 말고는 아무것도 존재하지 않는다.’


    “그는 이렇게 말함으로써 만유를 거슬러 죄를 지었습니다. 그러자 지고한 통치의 영역 위쪽에서 한 음성이 들려와 말했습니다. ‘사마엘아, 너는 잘못 알고 있다.’ 사마엘은 ‘눈먼 신’이라는 뜻입니다.


    “그가 말했습니다. ‘나보다 먼저 존재하는 다른 무엇이 있다면, 그것을 내게 보여라.’


    “소피아는 즉시 손가락을 뻗어 빛을 물질 속에 넣고, 그 빛을 혼돈의 영역까지 아래로 뒤쫓았습니다. 그런 다음 자기 빛이 있는 위쪽으로 돌아갔고, 어둠이 다시 물질 위에 [내려앉았습니다].[b]


    “남성과 여성을 함께 지닌 이 아르콘은 자신을 위하여 광대한 영역, 곧 끝없는 공간을 만들었습니다.


    “[] 그는 자신을 위하여 자손을 만들 생각을 했습니다. 그래서 자기와 마찬가지로 남성과 여성을 함께 지닌 일곱 자손을 만들었습니다.


    “그는 자기 자손에게 말했습니다. ‘나는 만유의 하나님이다.’


    “피스티스 소피아의 딸 조에가 그를 향해 외쳤습니다. ‘사클라야, 너는 잘못 알고 있다.’ 사클라의 다른 이름은 얄다바오트입니다. 조에가 그의 얼굴에 숨을 불어넣자, 그 숨은 조에를 위한 불의 천사가 되었습니다. 그 천사는 얄다바오트를 결박하여 심연 아래 타르타로스에 내던졌습니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 대괄호는 훼손되었거나 복원된 본문을 나타냅니다. 빈 대괄호 []는 원문 증거에 공백이 있음을 뜻합니다. 사본의 쪽수 표시는 본문에서 생략했습니다.
    reason: 제공된 판본의 본문 복원 및 결락 신호를 독자에게 설명하기 위해서입니다.
  - marker: b
    text: ‘내려앉았습니다’에 해당하는 말은 제공된 판본에서 복원된 표현입니다.
    reason: 해당 구절의 불확실성을 숨기지 않고 보존하기 위해서입니다.
lexical_decisions:
- source_word: authorities / archon
  choice: 권세자들 / 아르콘
  rationale: 첫 언급은 일반 독자가 뜻을 파악하도록 ‘권세자들’로 옮기고, 후반의 우주론적 직함은 고유한 전문 개념을 보존하기 위해 ‘아르콘’으로 음역했습니다.
- source_word: aeons
  choice: 아이온들
  rationale: 단순한 ‘시대’뿐 아니라 초월적 영역 또는 존재를 가리킬 수 있는 문헌상의 중의성을 보존했습니다.
- source_word: Indestructibility
  choice: 불멸성
  rationale: 파괴되지 않는 초월적 실재를 가리키는 추상명사로 읽히도록 자연스러운 한국어를 택했습니다.
- source_word: the All
  choice: 만유
  rationale: 우주적 총체라는 의미를 간결하게 보존하며, 특정 교리적 해석으로 좁히지 않았습니다.
- source_word: androgynous
  choice: 남성과 여성을 함께 지닌
  rationale: 현대 독자가 즉시 이해할 수 있게 풀어 옮기되, 성별의 양면성을 지닌다는 원문의 진술을 약화하지 않았습니다.
- source_word: Tartaros
  choice: 타르타로스
  rationale: 그리스적 우주론의 고유한 장소명을 일반적인 ‘지옥’으로 치환하지 않고 음역했습니다.
- source_word: Sophia / Pistis / Zoe
  choice: 소피아 / 피스티스 / 조에
  rationale: 문헌에서 인격화된 고유명으로 기능하므로 각각 음역하여 보존했습니다.
theological_decisions:
- issue: 창조자의 자기 선언에 쓰인 God
  choice: 하나님
  alternative: 신
  rationale: 문맥상 유일신적 자기 주장을 직접 드러내되, 서술자가 그 주장을 승인하는 것으로 오해되지 않도록 인용문 구조를 분명히 했습니다.
- issue: Sophia가 동반자 없이 창조하려 했다는 진술
  choice: ‘자기 짝과는 별도로, 스스로’로 번역
  alternative: ‘배우자 몰래’ 또는 ‘배우자의 허락 없이’
  rationale: 원문 증거가 허락이나 은밀함까지 명시하지 않으므로 관계적 긴장을 보존하면서 과도한 해석을 피했습니다.
- issue: 불멸성과 아이온들의 존재론적 관계
  choice: ‘무한한 아이온들 안에 거합니다’
  alternative: ‘영원한 세대 안에 불멸이 있습니다’
  rationale: 인격화되거나 공간화된 우주론적 표현을 그대로 유지하고 단순한 시간 개념으로 환원하지 않았습니다.
- issue: Yaldabaoth에 대한 심판 장소
  choice: ‘심연 아래 타르타로스’
  alternative: ‘무저갱 아래 지옥’
  rationale: 서로 구별되는 우주론적 용어를 전통적 기독교 지옥 개념으로 합치지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 제공된 자료가 콥트어 직접 대조 이전의 공공 영역 영어 증언이므로 확정적 원전 번역으로 과장하지 않았으며, 대괄호와 결락 표지를 유지했습니다. 고유한 영지주의 우주론 용어는 필요한 경우 음역하고, 문맥으로 이해 가능한 일반 용어는 자연스러운 한국어로 옮겼습니다.
