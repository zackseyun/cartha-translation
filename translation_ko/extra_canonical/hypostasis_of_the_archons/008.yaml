base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/008.yaml
  text: 'The archons went to meet her, plotting to deceive her. Their leader said to her, “Your mother, Eve, came to us.” But Norea turned to them and said, “You are the archons of darkness. Cursed are you! You did not know my mother. Instead, you knew your own female counterpart, because I am not your offspring. I come from the world above.”


    In his might, the arrogant archon turned, and his face became like a flaming [inferno]. He acted presumptuously toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been delegated to me.”


    But Norea, in the power of [God], turned and cried out in a loud voice to the Holy One, the God of the All: [] “Rescue me from the archons of injustice, and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her, “Why do you call upon God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the archons of injustice had withdrawn from her.'
translation:
  language: ko
  text: '집정자들은 노레아를 속이려고 계략을 꾸미며 그를 만나러 갔습니다. 그들의 우두머리가 노레아에게 말했습니다. “네 어머니 하와가 우리에게 왔다.” 그러나 노레아는 그들을 돌아보며 말했습니다. “너희는 어둠의 집정자들이다. 너희에게 저주가 있으라! 너희는 내 어머니를 알지 못했다. 도리어 너희 자신의 여성 짝을 알았을 뿐이다. 나는 너희에게서 난 자가 아니기 때문이다. 나는 위의 세계에서 왔다.”


    오만한 집정자는 자신의 위세를 드러내며 돌아섰고, 그의 얼굴은 불타는 [화염]처럼 되었습니다. 그는 노레아에게 방자하게 굴며 [말했습니다]. “네 어머니 하와가 그랬듯이, 너도 우리에게 성적으로 봉사해야 한다. 왜냐하면 […]이 내게 위임되었기 때문이다.”[a]


    그러나 노레아는 [하나님]의 능력 안에서 돌아서서, 거룩하신 분 곧 만유의 하나님께 큰 소리로 외쳤습니다. [] “불의한 집정자들에게서 저를 건져 주시고, 지금 당장 그들의 손에서 저를 구해 주십시오!”[b]


    한 천사가 하늘에서 내려와 노레아에게 말했습니다. “어찌하여 하나님을 부르느냐? 어찌하여 거룩한 영을 향해 그토록 방자하냐?”[c]


    노레아가 물었습니다. “당신은 누구입니까?”


    그사이 불의한 집정자들은 노레아에게서 물러나 있었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호와 줄임표 […]는 필사본의 훼손 또는 판독·복원상의 공백을 나타냅니다. 무엇이 집정자에게 위임되었다는 뜻인지는 현존 문구만으로 확정할 수 없습니다.
    reason: 중대한 본문 공백과 그로 인한 의미의 불확실성을 알립니다.
  - marker: b
    text: 이 문장 앞의 빈 대괄호 []는 제공된 번역 증거에 보존된 본문 공백 표시입니다.
    reason: 의미 없는 표기처럼 보일 수 있는 빈 대괄호가 원자료의 훼손 신호임을 설명합니다.
  - marker: c
    text: ‘거룩한 영’은 원문의 표현을 가깝게 옮긴 것입니다. 천사의 질문이 노레아를 책망하는 듯한 형태를 띠는 이유는 이 대목만으로 분명하지 않습니다.
    reason: 신학적으로 난해한 화행을 임의로 조화시키지 않고 독자에게 알립니다.
lexical_decisions:
- source_word: archons
  choice: 집정자들
  rationale: 그리스어계 콥트어 문헌에서 권세를 지닌 우주적 통치자들을 가리키는 전문 용어의 성격을 보존했습니다. ‘통치자들’보다 낯설지만 이 문헌의 고유 개념을 분명히 드러냅니다.
- source_word: female counterpart
  choice: 여성 짝
  rationale: 상응하는 여성 존재라는 뜻을 과도하게 해석하지 않으면서 자연스러운 한국어로 옮겼습니다.
- source_word: knew
  choice: 알았다
  rationale: 성적 관계를 함축할 수 있는 성서적·고대적 중의성을 보존하기 위해 ‘관계를 맺었다’로 명시하지 않았습니다.
- source_word: world above
  choice: 위의 세계
  rationale: 공간적·우주론적 대비를 그대로 살리고 ‘천국’처럼 후대의 특정 신학 용어로 좁히지 않았습니다.
- source_word: God of the All
  choice: 만유의 하나님
  rationale: ‘모든 것의 하나님’보다 문어적 존엄성을 지니면서도 우주 전체를 가리키는 원문의 범위를 유지합니다.
- source_word: holy Spirit
  choice: 거룩한 영
  rationale: 본문의 표현을 보존하되, 후대 정통 교리의 고유명사로 단정하지 않도록 ‘성령’ 대신 직역에 가까운 표현을 택했습니다.
theological_decisions:
- issue: 노레아의 기원 진술
  choice: “나는 위의 세계에서 왔다”로 직접 진술
  alternative: ‘나는 천상 세계에 속한다’
  rationale: 기원과 소속 중 어느 쪽이 강조되는지 해석으로 고정하지 않고 제공된 증거의 공간적 표현을 보존했습니다.
- issue: ‘거룩한 영’을 향한 방자함이라는 천사의 책망
  choice: 문맥상 난해함을 그대로 유지
  alternative: 천사가 집정자들을 책망하는 말로 교정
  rationale: 전승의 긴장이나 화자 문제를 본문 안에서 임의로 해결하지 않았습니다.
- issue: 훼손된 위임 구절
  choice: 주어를 보충하지 않고 […]을 유지
  alternative: ‘권세가 내게 위임되었다’ 등으로 복원
  rationale: 필사본 훼손으로 생긴 공백에 신학적·서사적 내용을 임의로 넣지 않았습니다.
translation_notes:
  register: 현대 표준어의 격조 있는 합쇼체 서술을 사용했습니다. 직접화법에서는 인물 관계와 위협적 상황을 반영해 집정자들과 노레아가 서로에게 하는 말은 해라체·반말로, 노레아가 하나님께 드리는 간구와 정체를 알 수 없는 천사에게 하는 질문은 존댓말로 처리했습니다. 원문 언어인 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증거에 근거한 잠정 출판 초안입니다.
