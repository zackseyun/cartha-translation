id: TRES.006
reference: Treatise on the Resurrection — Chosen for Salvation
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: What those who are saved have thought shall not perish. Those who have known (salvation), their mind shall not perish. We were therefore chosen for salvation and redemption because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but that we would enter into the wisdom of those who know the truth. The truth they preserve in fact cannot and will not be lost. Strong is the system of the Fullness. Weak is what broke loose, becoming (the) world. The All, however, is what is preserved. It did not [] come into being; it already existed.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: ko
  text: 구원받은 이들이 생각한 것은 사라지지 않을 것입니다. 구원을 안 이들의 정신은 사라지지 않을 것입니다. 그러므로 우리는 구원과 속량을 위하여 선택되었습니다. 이는 우리가 무지한 이들의 어리석음에 빠지지 않고 진리를 아는 이들의 지혜로 들어가도록 처음부터 미리 정해져 있었기 때문입니다. 그들이 간직하는 진리는 참으로 사라질 수도 없고 사라지지도 않을 것입니다. 충만[a]의 체계는 강합니다. 떨어져 나가 세계가 된 것은 약합니다. 그러나 전체[b]는 보존되는 것입니다. 그것은 [] 생겨난 것이 아니라 이미 존재했습니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘충만’은 이 문헌의 우주론적 총체 또는 완전한 영역을 가리키는 전문 용어일 수 있습니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 의미를 더 좁혀 확정하지 않습니다.
    reason: 전문 용어 가능성과 잠정적 번역 상태를 알리기 위해서입니다.
  - marker: b
    text: ‘전체’는 모든 것의 총체를 가리키는 표현일 수 있습니다. 여기서 ‘충만’과 정확히 어떤 관계인지는 본문만으로 확정하기 어렵습니다.
    reason: 서로 가까운 우주론적 용어를 임의로 동일시하지 않기 위해서입니다.
  - marker: c
    text: 대괄호 []는 전승된 번역 증언이 표시한 사본 훼손 또는 복원상의 불확실성을 나타냅니다. 마지막 문장의 정확한 형태는 콥트어 원문 검토가 필요합니다.
    reason: 제공된 영어 증언의 본문 공백과 자료상의 한계를 투명하게 보존하기 위해서입니다.
lexical_decisions:
- source_word: salvation
  choice: 구원
  rationale: 문맥의 종교적 의미를 자연스럽고 널리 이해되는 한국어 용어로 옮겼습니다. 첫 두 문장의 괄호는 영어 증언의 보충 표기로 보아 본문에서는 자연스럽게 통합했습니다.
- source_word: redemption
  choice: 속량
  rationale: 구원과 병렬된 별개의 개념을 보존하면서 대가를 치러 풀어 줌이라는 전통적 의미를 담았습니다.
- source_word: Fullness
  choice: 충만
  rationale: 보통명사적 충만함을 넘어 문헌의 우주론적 전문 개념일 가능성이 있으므로 고유 개념처럼 읽히도록 처리하고 각주를 붙였습니다.
- source_word: system
  choice: 체계
  rationale: 질서·구조·조직을 모두 열어 두는 중립적인 표현을 선택했습니다.
- source_word: the All
  choice: 전체
  rationale: 우주론적 총체를 가리키는 전문 용어일 가능성을 살리되, 특정 교리 체계로 단정하지 않았습니다.
- source_word: preserved
  choice: 간직하는 / 보존되는
  rationale: 진리를 주체적으로 지키는 경우에는 ‘간직하다’, ‘전체’가 유지되는 경우에는 수동적 의미의 ‘보존되다’를 사용해 문맥 차이를 반영했습니다.
theological_decisions:
- issue: 선택과 예정의 관계
  choice: ‘선택되었습니다’와 ‘처음부터 미리 정해져 있었습니다’를 모두 명시했습니다.
  alternative: 예정을 선택의 직접적 원인이나 특정 교리 체계의 예정론으로 풀어 번역할 수 있습니다.
  rationale: 원문의 because 구조는 보존하되, 예정의 주체·방식·범위를 본문이 말하는 것 이상으로 규정하지 않았습니다.
- issue: ‘충만’과 ‘전체’의 정체
  choice: 서로 구별되는 표현으로 번역하고 설명 각주만 붙였습니다.
  alternative: 둘을 동일한 신적 영역 또는 동일한 우주론적 실재로 통일해 옮길 수 있습니다.
  rationale: 본문은 두 용어의 관계를 명시적으로 설명하지 않으므로 그 긴장과 불확실성을 보존했습니다.
- issue: 세계의 기원과 약함
  choice: ‘떨어져 나가 세계가 된 것은 약합니다’로 번역했습니다.
  alternative: 세계 자체가 본질적으로 악하다는 식으로 의역할 수 있습니다.
  rationale: 원문 증언은 ‘약하다’고만 하므로 ‘악하다’ 같은 평가를 추가하지 않았습니다.
- issue: 마지막 문장의 존재론적 진술
  choice: ‘생겨난 것이 아니라 이미 존재했습니다’로 옮겼습니다.
  alternative: ‘창조되지 않았다’ 또는 ‘영원하다’로 신학적으로 명료화할 수 있습니다.
  rationale: come into being의 의미를 보존하면서 창조·영원성에 관한 더 강한 결론을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 문장은 일반 독자가 이해할 수 있도록 자연스럽게 다듬되, ‘충만’, ‘전체’, ‘미리 정해지다’ 같은 핵심 개념의 모호성과 신학적 긴장은 해소하지 않았습니다. 현재 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 대조가 필요합니다.
