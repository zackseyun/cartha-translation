translation:
  language: ko
  text: '이 모든 것은 나의 [···] 주 예수 그리스도의 은혜로우심에서 얻었습니다. 나의 자녀들이여, 나는 여러분을 굳세게 할 수 있는 것은 하나도 빠뜨리지 않고, 이 일들에 관하여 여러분과 여러분의 [형제자매들]을 가르쳤습니다. 그러나 내가 말씀을 설명하며 쓴 것 가운데 모호한 것이 있다면, 여러분이 물을 때 그것을 설명해 드리겠습니다.


    그러나 이제 여러분 가운데 누구에게든 이것을 나누어 주려고 염려하지 마십시오. 이것이 유익할 수 있기 때문입니다.


    많은 사람이 내가 여러분에게 써 보낸 (문제들을) 살펴보고 있습니다. 그들에게 말합니다. 평화와 은혜가 그들에게 있기를 바랍니다.


    여러분과, 형제자매의 사랑으로 여러분을 사랑하는 이들에게 문안합니다.


    『부활에 관한 논고』[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 나그함마디 문서 I,4의 콥트어 본문에 대한 직접 검토가 아직 필요합니다. 본문 속 대괄호는 사본의 결락 또는 번역자가 복원한 부분을 나타냅니다.
    reason: 직접적인 콥트어 원문 검토가 보류된 상태이며, 대괄호의 본문비평적 기능을 독자에게 밝혀야 합니다.
lexical_decisions:
- source_word: graciousness
  choice: 은혜로우심
  rationale: 주 예수 그리스도의 성품과 호의를 함께 나타내면서도 이를 단순히 ‘은혜’라는 추상 명사로 축소하지 않도록 했습니다.
- source_word: the word
  choice: 말씀
  rationale: 종교적 문맥에 맞는 존엄한 표현을 택했으나, 특정한 교리적 의미로 확정하지 않고 설명의 대상이라는 원문의 폭을 유지했습니다.
- source_word: brothers and sisters
  choice: 형제자매들
  rationale: 공동체 구성원을 성별 포괄적으로 가리키는 영어 증언의 복원을 그대로 반영했습니다.
- source_word: be not anxious to share
  choice: 나누어 주려고 염려하지 마십시오
  rationale: 문맥상 다소 긴장되거나 불분명한 표현을 ‘주저하지 마십시오’ 등으로 해소하지 않고 영어 증언의 의미 구조를 보존했습니다.
- source_word: Treatise
  choice: 논고
  rationale: 교리적 논문이 아니라 특정 주제를 논하는 고대 문헌의 성격을 자연스럽고 격조 있게 나타냅니다.
theological_decisions:
- issue: ‘my [] Lord’의 결락
  choice: 나의 [···] 주
  alternative: 나의 주
  rationale: 대괄호가 사본 훼손 또는 복원 신호라는 제공 자료의 설명을 따라 결락을 가시적으로 보존했습니다.
- issue: ‘because it can be helpful’과 앞 명령의 관계
  choice: 이것이 유익할 수 있기 때문입니다
  alternative: 이것은 유익할 수 있습니다
  rationale: 인과 접속을 그대로 유지하여 원문 증언에 남은 의미상의 긴장을 임의로 제거하지 않았습니다.
- issue: ‘Peace ... and grace’의 문법적 관계
  choice: 평화와 은혜가 그들에게 있기를 바랍니다
  alternative: 그들에게 평화가 있기를 바랍니다. 또한 은혜가 있기를 바랍니다
  rationale: 평화와 은혜를 함께 축원하는 구조로 옮기되, 두 개념 사이의 관계를 신학적으로 더 구체화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서신 결말의 온화하고 격식 있는 어조를 유지했으며, 이해하기 쉬운 문장으로 다듬되 영어 증언에 남아 있는 괄호, 결락, 의미상의 긴장은 보존했습니다. 웹사이트의 FAQ, 연락처, 광고 문구는 고대 작품 본문이 아닌 편집상 부가 자료이므로 제외했습니다.
