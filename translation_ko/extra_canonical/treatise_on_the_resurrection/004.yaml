    rationale: ‘눈에 보이게’가 부사적 수식으로 더 자연스럽고, ‘저물 때’는 해짐과 죽음의 병치라는 본문의 비유를 유지하면서 문장을 매끄럽게 합니다.
  revised_text: 그러면 사도가 실제로 말한 바와 같이, “우리는 그분과 함께 고난을 받았고, 그분과 함께 일어났으며, 그분과 함께 하늘로 올라갔습니다.” 우리가 이 세상에서 눈에 보이게 살아간다면, 우리는 이 세상을 입고 있습니다. 우리는 그분의 빛나는 광선들이며, 우리가 저물 때까지, 곧 이 삶에서 죽을 때까지 그분과 함께 머뭅니다. 아무것에도 가로막히지 않은 채, 광선들이 해에 이끌리듯 우리는 그분에 의해 하늘로 이끌립니다. 이것이 영적인 부활이며, [a] 육체를 삼키듯 영혼을 삼킵니다.
  revised_footnotes:
