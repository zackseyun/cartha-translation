  source_fidelity: 제공된 영어 증언문 및 English POB와 대조할 때, 전반적 의미와 손상 표시는 잘 보존되었습니다. 다만 ‘like beams by the sun’은 광선이 해에 이끌리는 비유인데, 초안의 ‘햇빛이 해에 이끌리듯’은 비교 대상이 ‘햇빛’으로 바뀌어 부정확합니다. 또한 ‘in fact’는 ‘참으로’보다 ‘실제로’가 더 직접적입니다.
  naturalness: 합쇼체와 문체는 대체로 자연스럽습니다. 그러나 ‘눈에 보이는 모습으로 살아간다면’은 다소 장황하므로 ‘눈에 보이게 살아간다면’이 더 자연스럽습니다. ‘우리가 질 때까지’는 의도된 해짐의 비유를 살리지만 한국어에서 다소 어색하므로 ‘우리가 저물 때까지’로 다듬었습니다.
  terminology: ‘이 세상을 입고 있습니다’, ‘빛나는 광선들’, ‘영적인 부활’, ‘삼킵니다’는 해석을 과도하게 덧붙이지 않고 비유와 신학적 긴장을 보존합니다. ‘하늘’과 ‘영혼/육체’도 문맥상 적절합니다.
  issues:
