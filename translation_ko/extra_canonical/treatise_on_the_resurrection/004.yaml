  revision_rationale: 광선과 해의 비유를 원문의 관계에 맞게 바로잡고, 몇몇 표현을 현대 표준 한국어의 격식 있는 문체로 다듬었습니다. 손상된 자리와 영적 부활이 영혼 및 육체를 ‘삼킨다’는 미해결의 비유적 긴장은 보충하거나 교리적으로 해석하지 않았습니다.
