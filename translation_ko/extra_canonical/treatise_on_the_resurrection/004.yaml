    issue: 비교 비유의 대상이 바뀜
    rationale: 원문의 ‘like beams by the sun’은 광선들이 해에 이끌리는 모습을 말합니다. ‘햇빛이 해에 이끌리듯’은 햇빛과 해의 관계로 바꾸어 원 비유를 흐립니다.
  - severity: low
    issue: ‘in fact’의 뉘앙스
    rationale: ‘참으로’도 가능하지만 진술의 사실성을 강조하는 ‘in fact’에는 ‘실제로’가 더 가깝습니다.
  - severity: low
