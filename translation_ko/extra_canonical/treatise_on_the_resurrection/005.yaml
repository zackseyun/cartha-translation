base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/005.yaml
  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: ko
  text: '그러나 어떤 이들이 믿지 않는다면, 그것은 그들이 설득될 수 없기 때문입니다. 내 아들이여, 죽은 이들이 다시 일어나는 것은 믿음에 속한 일이지 논증에 속한 일이 아닙니다.


    이 세상의 철학자들 가운데에도 믿는 이들이 있습니다. 그리하여 적어도 그들은 다시 일어날 것입니다. 이 세상에 있는 철학자는 자기가 스스로 죽음에서 생명으로 돌아온다고 믿으면서 자신을 옳다고 여기지 말아야 합니다. 우리는 믿음으로 말미암아 사람의 아들을 알고, 그분이 죽은 이들 가운데서 다시 일어나셨다고 믿습니다. 우리는 그분을 두고 “그분은 죽음의 소멸이 되셨습니다”라고 선포합니다. 믿음은 위대하며, 믿는 이들도 <위대>하기 때문입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: <위대>는 현존 본문의 결손을 편집자가 보충했음을 나타내는 증언 문헌의 꺾쇠표시를 보존한 것입니다.
    reason: 공급된 영어 증언의 <great>에 표시된 복원 정보를 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: cannot be convinced
  choice: 설득될 수 없습니다
  rationale: 불신의 원인을 지적하는 수동적 의미를 보존하면서도, 능력의 결핍인지 완강함인지 단정하지 않았습니다.
- source_word: pertains to faith, and not to argumentation
  choice: 믿음에 속한 일이지 논증에 속한 일이 아닙니다
  rationale: faith와 argumentation의 대조를 간결하게 살리고, ‘논증’을 현대 독자가 이해할 수 있는 학술적이되 일반적인 말로 옮겼습니다.
- source_word: philosopher
  choice: 철학자
  rationale: 문서가 설정하는 철학자와 신자의 긴장을 해석으로 완화하지 않고 직역에 가깝게 보존했습니다.
- source_word: returns himself (to life from death) by himself
  choice: 자기가 스스로 죽음에서 생명으로 돌아옵니다
  rationale: 반복되는 자기 주체성과 자력성을 드러내고, 괄호의 설명을 자연스럽게 본문에 통합했습니다.
- source_word: Son of Man
  choice: 사람의 아들
  rationale: 전통적 칭호의 의미와 본문의 신학적 여지를 보존하되 특정 교단식 해석을 덧붙이지 않았습니다.
- source_word: the obliteration of death
  choice: 죽음의 소멸
  rationale: 추상명사적 은유를 ‘죽음을 없애신 분’으로 풀어 해석하지 않고, 원문의 압축된 표현과 신학적 긴장을 유지했습니다.
theological_decisions:
- issue: 믿음과 부활의 관계
  choice: “믿는 이들이 있습니다. 그리하여 적어도 그들은 다시 일어날 것입니다”로 옮겼습니다.
  alternative: “다시 일어나기 위해 믿는 이들이 있습니다”
  rationale: 영어 증언의 so that이 목적과 결과 사이에서 지닐 수 있는 모호성을 완전히 해소하지 않으면서, 한국어 문장으로는 결과에 가까운 연결을 사용했습니다.
- issue: 철학자의 자력 부활 주장
  choice: 철학자가 ‘자기가 스스로’ 생명으로 돌아온다고 믿어 자신을 옳게 여기지 말라는 경고로 옮겼습니다.
  alternative: 철학자가 자신의 부활을 정당화한다고 번역
  rationale: ‘feel justified’의 재귀적 자기 확신과 ‘by himself’의 자력성을 함께 보존했습니다.
- issue: ‘죽음의 소멸’이라는 그리스도론적 진술
  choice: 술어 은유를 그대로 유지했습니다.
  alternative: “그분은 죽음을 없애셨습니다”
  rationale: 행위 진술로 평탄화하지 않고, 그분 자신이 ‘죽음의 소멸’이 되셨다는 증언의 강한 존재론적 표현을 살렸습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 권면과 신학적 선언에는 문헌의 고전적 품위를 유지하되 과도한 고어를 피했습니다. 이 초안은 제공된 공공영역 영어 증언을 바탕으로 하며, 콥트어 원문에 대한 직접 대조가 아직 이루어지지 않았으므로 특히 접속 관계와 대명사 지시 대상은 추후 원문 검토가 필요합니다.
