id: TRES.005
reference: Treatise on the Resurrection — Philosophers and Believers
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'If some, however, do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
