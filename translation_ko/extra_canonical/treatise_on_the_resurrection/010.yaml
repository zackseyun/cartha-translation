translation:
  language: ko
  text: '그러므로 레기노스여, 부분적인 진리만을 생각하지 말고, 다른 사람들과 뜻을 맞추려고 이 육신을 따라 살지도 마십시오. 오히려 분열과 속박을 피하십시오. 그러면 지금 부활을 경험할 것입니다. 죽을 수밖에 없는 것이 자기가 죽으리라는 사실을 안다면, 이 생에서 여러 해를 보낸다 해도 마침내 죽음에 이릅니다. 그렇다면 어찌하여 자신을 이미 살아났고 목적지에 이른 사람으로 여기지 않습니까?


    그대가 부활을 소유하고 있다면, 어찌하여 여전히 죽을 사람처럼 계속 행동합니까? 그대는 자신이 이미 죽었다는 것을 알아야 합니다. 그대가 이것을 깨닫지 못하는 것은 훈련이 부족하기 때문입니다. 모든 사람이 여러 방식으로 훈련하는 것이 마땅합니다. 그러면 이 요소[a]에서 풀려나 잘못에 빠지지 않고, 태초부터 있던 것을 다시 받게 될 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이 요소’가 구체적으로 무엇을 가리키는지는 분명하지 않습니다. 육신, 물질적 영역, 또는 현존하는 삶의 조건을 뜻할 수 있습니다.
    reason: 영어 증언 자체가 모호성을 명시하며, 콥트어 원문 대조가 아직 이루어지지 않았으므로 해석 가능성을 독자에게 알립니다.
lexical_decisions:
- source_word: partial (truths)
  choice: 부분적인 진리만
  rationale: 괄호가 드러내는 보충적 의미를 자연스러운 한국어로 옮기되, 전체 진리와 대조되는 부분성이라는 긴장을 보존했습니다.
- source_word: this flesh
  choice: 이 육신
  rationale: 윤리적 삶의 방식과 물질적 몸 모두를 가리킬 수 있는 표현이므로 ‘육신’으로 옮겨 의미를 좁히지 않았습니다.
- source_word: divisions and bondages
  choice: 분열과 속박
  rationale: 공동체적 분열과 영적·실존적 예속의 가능성을 함께 보존하는 직접적인 대응어를 택했습니다.
- source_word: experience the resurrection now
  choice: 지금 부활을 경험할 것입니다
  rationale: 부활의 현재적 경험이라는 본문의 핵심 주장을 미래 종말론으로 환원하지 않고 그대로 살렸습니다.
- source_word: having arrived
  choice: 목적지에 이른
  rationale: 무엇에 도달했는지 명시되지 않은 원문의 표현을 과도하게 교리화하지 않으면서 한국어에서 자연스럽게 이해되도록 최소한으로 보완했습니다.
- source_word: this element
  choice: 이 요소
  rationale: 지시 대상이 불분명한 증언 본문의 모호성을 보존하고 각주로 알렸습니다.
- source_word: what was from the beginning
  choice: 태초부터 있던 것
  rationale: ‘것’의 정체를 생명·본성·상태 등으로 특정하지 않아 원문의 개방성을 유지했습니다.
theological_decisions:
- issue: 현재적 부활과 미래적 죽음의 관계
  choice: ‘지금 부활을 경험’하고 ‘부활을 소유’한다는 표현을 그대로 유지
  alternative: 현재의 부활을 단지 미래 부활의 확신이나 비유로 풀이
  rationale: 본문은 부활을 현재 경험하고 소유하는 실재로 말하므로 그 신학적 긴장을 해소하지 않았습니다.
- issue: ‘이미 죽었다’의 의미
  choice: 설명 없이 문자적 표현을 보존
  alternative: 죄나 육신에 대해 죽었다고 명시
  rationale: 무엇에 대해 죽었는지를 증언 본문이 특정하지 않으므로 특정 교리적 해석을 삽입하지 않았습니다.
- issue: 훈련과 해방의 관계
  choice: 훈련 뒤에 ‘이 요소에서 풀려난다’는 논리 흐름을 유지
  alternative: 훈련을 공로적 구원이나 단순한 영적 수련으로 규정
  rationale: 훈련의 구체적 성격과 해방의 작용이 불분명하므로 인과관계만 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 권면에는 ‘-십시오’, 수사적 질문에는 ‘-습니까’를 써 교훈적이되 지나치게 고어적이지 않게 했습니다. 이 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 콥트어 원문 검토 후 어휘와 구문을 재확인해야 합니다.
