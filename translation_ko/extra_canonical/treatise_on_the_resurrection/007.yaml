translation:
  language: ko
  text: '그러므로 내 아들 레기노스여, 부활을 결코 의심하지 마십시오! 그대가 한때 육신으로 살지 않았다 하더라도, 이 세상에 들어올 때 육신을 입었기 때문입니다.


    그렇다면 그대가 (돌아가) 아이온으로 올라갈 때에는 왜 육신을 입지 않겠습니까?[a] 육신보다 더 나은 것이 생명을 낳습니다. 그대를 위하여 생겨난 것이 그대의 것이 아니겠습니까? 그대의 것이 그대와 함께 있지 않습니까? 그런데 그대가 이 세상에 있는 동안 무엇이 부족합니까? 그대가 그토록 애써 알아내려 한 것이 바로 이것입니다.


    몸이 낳은 후산은 노년이며, 그대는 죽을 수밖에 없는 상태에 있습니다.[b] 그대에게 부족한 것은 오히려 이득입니다. 그대가 떠나더라도 가장 좋은 것을 잃지 않을 것이기 때문입니다. 더 못한 것은 쇠하지만, 그것을 위한 은혜가 있습니다.[c]


    그러므로 아무것도 우리를 이 세상에서 구속할 수 없습니다.[d] 그러나 우리는 전체이며, 그러므로 구원받습니다.[e] 우리는 처음부터 끝까지 구원을 얻었습니다. 이렇게 생각합시다. 이렇게 깨달읍시다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘아이온’은 시대, 영원, 또는 초월적 세계를 뜻할 수 있는 말입니다. 괄호 속 ‘돌아가’는 제공된 영어 증언의 보충 표현을 그대로 표시한 것입니다.
    reason: 전문 용어의 의미 범위와 증언 본문의 괄호를 독자에게 알립니다.
  - marker: b
    text: ‘후산’은 출산 뒤에 나오는 태반과 부속물을 가리킵니다. 여기서는 노년을 몸에서 뒤따라 나오는 것으로 표현한 은유입니다.
    reason: 매우 낯선 원문 은유가 오역으로 보이지 않도록 설명합니다.
  - marker: c
    text: ‘그것’은 문맥상 쇠하는 ‘더 못한 것’을 가리키지만, 구체적으로 육신을 뜻하는지는 확정하지 않았습니다.
    reason: 대명사의 지시 대상에 남아 있는 모호성을 보존합니다.
  - marker: d
    text: 이 문장은 제공된 영어 증언을 따르면 ‘아무것도 우리를 이 세상에서 구속할 수 없다’는 뜻입니다. 콥트어 원문 대조가 이루어지면 재검토가 필요합니다.
    reason: 문맥상 난해한 부정문이며 직접 원문 검토가 보류되어 있음을 밝힙니다.
  - marker: e
    text: ‘전체’는 원문의 형이상학적 총체를 가리킬 수 있으나, 여기서는 특정 신학 체계의 전문어로 확정하지 않았습니다. 괄호로 제시된 ‘그러므로’는 제공된 영어 증언의 보충을 반영합니다.
    reason: 신학적 함의를 과도하게 확정하지 않고 증언의 편집 표시를 설명합니다.
lexical_decisions:
- source_word: flesh
  choice: 육신
  rationale: 단순한 살점보다 인간의 육체적 존재 상태를 가리키는 문맥을 살리면서, 부활 논의의 격조를 유지합니다.
- source_word: aeon
  choice: 아이온
  rationale: ‘영원’, ‘시대’, 초월적 영역 등 여러 함의를 지닐 수 있어 하나로 해석하지 않고 음역했습니다.
- source_word: afterbirth
  choice: 후산
  rationale: 노년을 몸이 낳은 뒤 따라 나오는 것으로 묘사하는 낯선 은유를 평탄화하지 않고 보존했습니다.
- source_word: the All
  choice: 전체
  rationale: 우주적·형이상학적 총체를 가리킬 가능성이 있는 표현을 일반적인 ‘모든 것’과 구별하되, 특정 교리 용어로 확정하지 않았습니다.
- source_word: understand
  choice: 깨닫다
  rationale: 앞의 ‘생각하다’와 구별하며 단순한 정보 이해보다 통찰을 촉구하는 문맥을 자연스럽게 전달합니다.
theological_decisions:
- issue: 아이온으로 올라갈 때 육신을 입는다는 진술
  choice: 원문의 역설적 진술을 그대로 유지함
  alternative: 영적 몸을 입는다고 명시함
  rationale: 본문은 육신과 그보다 나은 것의 관계를 긴장 속에 두며, ‘영적 몸’이라는 해석을 직접 명시하지 않습니다.
- issue: ‘아무것도 우리를 이 세상에서 구속할 수 없다’의 의미
  choice: 부정문의 표면적 의미를 보존함
  alternative: ‘이 세상의 어떤 것도 우리를 구속할 수 없다’로 재구성함
  rationale: 제공된 증거만으로 목적어와 주어의 관계를 바꾸면 의미가 크게 달라지므로 난점을 그대로 남겼습니다.
- issue: ‘우리는 전체이다’의 형이상학적 함의
  choice: ‘전체’로 번역하고 특정 체계로 해설하지 않음
  alternative: ‘우리는 충만이다’ 또는 ‘우리는 만유이다’
  rationale: 영지주의적 전문 개념으로 단정하지 않고 본문의 집합적·우주적 표현을 보존합니다.
- issue: 더 못한 것에도 주어지는 은혜
  choice: 대명사의 지시 대상을 열어 둠
  alternative: 쇠하는 육신에도 은혜가 있다고 명시함
  rationale: 문맥상 몸이나 더 못한 것을 가리킬 수 있지만, 명시적 해석을 본문에 삽입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 스승이 제자 레기노스에게 권면하는 어조를 살리되 고어투는 피했습니다. 제공 자료가 콥트어 직접 대조 전의 공공영역 영어 증언이므로, 난해한 구문과 괄호 및 핵심 용어의 모호성을 각주와 음역으로 보존한 잠정 출판 초안입니다.
