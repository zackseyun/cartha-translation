    issue: 첫 문장의 조건문이 양보절로 바뀜
    rationale: ‘if you once did not live in flesh’는 조건을 제시하는 구문인데, ‘살지 않았다 하더라도’는 ‘비록 …일지라도’의 양보 의미를 더합니다. 조건형으로 유지해야 합니다.
  - severity: low
    issue: ‘afterbirth of the body’의 관계 표현
    rationale: ‘몸이 낳은 후산’은 몸을 행위 주체로 다소 강하게 만들 수 있습니다. 원문의 명사구 관계를 보존하는 ‘몸의 후산’이 더 적절합니다.
  - severity: low
    issue: 영어 증언의 괄호 처리 불일치
    rationale: 초안은 각주 e에서 ‘그러므로’가 괄호 보충이라고 설명하지만 본문에는 괄호가 없습니다. 본문에도 ‘(그러므로)’를 표시해야 각주와 편집 원칙이 일치합니다.
