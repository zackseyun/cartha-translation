base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: ko
  text: 주님께서는 육신으로 사셨을 때, 그리고 자신이 하나님의 아들임을 드러내신 뒤에 어떤 방식으로 선포하셨습니까? 그분은 여러분이 머무는 이곳에 머무시면서 자연적인 것들의 법칙에 관해 말씀하셨습니다. 그러나 나는 그것을 ‘죽음’이라고 부릅니다. 레기노스여, 하나님의 아들은 사람의 아들이셨습니다. 그분은 인성과 신성을 지니시고 그 둘을 모두 자신에게 취하셨습니다. 그러므로 한편으로는 하나님의 아들로서 죽음을 물리치실 수 있었고, 다른 한편으로는 사람의 아들로서 충만[a]을 회복하셨습니다. 이는 그분의 아래쪽 구성체가 생겨나기 전에 그분의 기원이 진리의 씨앗으로서 위로부터 비롯되었기 때문입니다. 이 아래쪽 구성체[b] 안에서 많은 통치 권세와 신적 존재들이 생겨났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘충만’은 완전함 또는 가득 찬 총체를 뜻하며, 이 문헌에서는 신적 실재의 총체를 가리키는 전문 용어일 수 있습니다.
    reason: 핵심 용어의 가능한 기술적 의미를 알리되 지시 대상을 단정하지 않기 위해서입니다.
  - marker: b
    text: ‘아래쪽’은 제공된 영어 증언문에서 괄호로 보충된 말입니다. ‘구성체’가 몸, 형상, 또는 더 넓은 하위 질서를 가리키는지는 분명하지 않습니다.
    reason: 증언문의 보충 요소와 지시 대상의 불확실성을 투명하게 표시하기 위해서입니다.
lexical_decisions:
- source_word: lived in the flesh
  choice: 육신으로 사셨을 때
  rationale: 육체적 삶을 가리키는 표현을 자연스럽게 옮기면서도 육신이라는 신학적 어감을 보존했습니다.
- source_word: the law of natural things
  choice: 자연적인 것들의 법칙
  rationale: 무엇이 ‘자연적인 것들’인지 해석으로 한정하지 않고 증언문의 추상성과 모호성을 유지했습니다.
- source_word: Fullness
  choice: 충만
  rationale: 특정 사상 체계의 뜻을 본문에서 풀어 단정하지 않고 기술적 의미를 지닐 수 있는 명사로 옮겼습니다.
- source_word: structure
  choice: 구성체
  rationale: 몸, 형상, 창조 질서 가운데 하나로 의미를 좁히지 않고 구조화된 실재라는 폭을 남겼습니다.
- source_word: dominions and divinities
  choice: 통치 권세와 신적 존재들
  rationale: 지배 권능과 신성을 띤 존재라는 두 범주를 구별하되 특정 천사론적 위계로 확정하지 않았습니다.
theological_decisions:
- issue: 하나님의 아들과 사람의 아들의 관계
  choice: ‘하나님의 아들은 사람의 아들이셨습니다’라는 동일성 진술을 그대로 유지했습니다.
  alternative: 두 칭호가 단지 서로 다른 역할을 뜻한다고 설명하는 번역
  rationale: 증언문이 제시하는 신성과 인성의 결합 및 그에 따른 긴장을 교리적으로 재구성하지 않기 위해서입니다.
- issue: 인성과 신성을 ‘취함’
  choice: ‘그 둘을 모두 자신에게 취하셨습니다’와 ‘인성과 신성을 지니시고’를 함께 보존했습니다.
  alternative: 성육신이나 양성 교리의 후대 전문 용어로 대체
  rationale: 문헌 자체의 표현을 유지하고 후대 교리 공식을 소급해 넣지 않기 위해서입니다.
- issue: 충만의 회복
  choice: ‘충만을 회복하셨습니다’로 번역했습니다.
  alternative: 우주 전체, 교회, 신적 세계 가운데 하나를 명시
  rationale: ‘Fullness’의 정확한 지시 대상을 단정하지 않고 문헌의 신학적 개방성을 보존했습니다.
- issue: 위로부터 온 기원과 아래쪽 구성체
  choice: 상하 대비를 유지하되 ‘구성체’의 정체는 밝히지 않았습니다.
  alternative: 아래쪽 구성체를 육체 또는 물질세계로 확정
  rationale: 제공된 영어 증언문만으로는 지시 대상이 분명하지 않으므로 해석을 본문에 삽입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용하고, 논설문의 품위를 유지했습니다. 인명은 ‘Rheginos’를 ‘레기노스’로 음역했습니다. 이 초안은 제공된 공개 영역 영어 증언문에 근거한 잠정 번역이며, 나그함마디 문서의 콥트어 원문 대조가 아직 이루어지지 않았으므로 어휘와 구문은 추후 원문 검토에 따라 수정될 수 있습니다.
