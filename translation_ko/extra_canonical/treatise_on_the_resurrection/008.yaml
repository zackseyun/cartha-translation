id: TRES.008
reference: Treatise on the Resurrection — The Resurrection is Real
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'There are some, however, who in the course of their investigation, wish to understand if one who is saved, when discarding the body, will be saved immediately. Let none doubt concerning this. [...]. In fact, the visible limbs that are dead [] shall not be saved, for (in that case) the living [limbs] that exist in them would rise.


    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'There are some, however, who in the course of their investigation, wish to understand if one who is saved, when discarding the body, will be saved immediately. Let none doubt concerning this. [...]. In fact, the visible limbs that are dead [] shall not be saved, for (in that case) the living [limbs] that exist in them would rise.


    Then, what is the resurrection? It is the continuing revelation of those who have risen. Because if you recall reading in the gospel that Elijah appeared, and Moses with him, do not think of the resurrection as an illusion. It is no illusion; instead it is a reality! In fact, it would be more accurate to say the world is an illusion than (to say) the resurrection which has come to pass through our Lord, the Savior, Jesus Christ (is an illusion).'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: ko
  text: '그러나 탐구하는 가운데, 구원받은 사람이 몸을 벗어 버릴 때 곧바로 구원받는지 알고 싶어 하는 이들이 있습니다. 아무도 이것을 의심하지 마십시오. […].[a] 사실 죽어 있는 눈에 보이는 지체들은 구원받지 못할 것입니다. [] 그 경우에는 그 안에 존재하는 살아 있는 [지체들]이 일어날 것이기 때문입니다.[b]


    그렇다면 부활이란 무엇입니까? 그것은 일어난 이들이 계속해서 드러나는 것입니다.[c] 여러분이 복음서에서 엘리야가 나타나고 모세도 그와 함께 있었다는 내용을 읽은 것을 기억한다면, 부활을 환상이라고 생각하지 마십시오. 부활은 환상이 아니라 실재입니다! 사실 우리 주님이시며 구원자이신 예수 그리스도를 통하여 일어난 부활을 환상이라고 말하기보다는, 오히려 세상을 환상이라고 말하는 편이 더 정확할 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '[…]는 전승된 본문에 결락이 있음을 나타냅니다.'
    reason: 생략부가 번역자의 요약이나 임의 생략이 아니라 본문 손상 신호임을 밝힙니다.
  - marker: b
    text: 이 문장에는 본문 결락을 나타내는 빈 대괄호 []와 복원된 말인 [지체들]이 들어 있습니다. 따라서 ‘죽어 있는 지체들’과 ‘살아 있는 지체들’의 정확한 관계는 불확실합니다.
    reason: 공급된 증거에 있는 손상 및 복원 표지를 보존하고 해석상의 불확실성을 알립니다.
  - marker: c
    text: ‘계속해서 드러나는 것’은 ‘지속적인 계시’ 또는 ‘계속되는 현현’으로도 이해할 수 있습니다.
    reason: 영어 증언의 ‘continuing revelation’이 지닌 의미 범위와 문장의 난해함을 보존합니다.
lexical_decisions:
- source_word: discarding the body
  choice: 몸을 벗어 버릴 때
  rationale: 육체를 떠나는 행위를 나타내는 비유를 보존하면서도 현대 한국어에서 자연스럽게 이해되도록 옮겼습니다.
- source_word: limbs
  choice: 지체들
  rationale: 단순히 팔다리만이 아니라 몸을 이루는 부분들을 가리킬 수 있는 표현이며, 원문의 반복과 신학적 함의를 보존합니다.
- source_word: rise / risen
  choice: 일어나다 / 일어난 이들
  rationale: 부활을 뜻할 수 있지만 원문이 사용하는 ‘일어남’의 어휘적 연결을 살려, 해석을 ‘부활하다’로만 한정하지 않았습니다.
- source_word: continuing revelation
  choice: 계속해서 드러나는 것
  rationale: 지속성 및 현현·계시의 의미를 함께 전달하되, 추상적인 전문 용어로 과도하게 고정하지 않았습니다.
- source_word: illusion
  choice: 환상
  rationale: 실재와 대조되는 겉보임 또는 비실재라는 문맥을 자연스럽게 나타냅니다.
- source_word: reality
  choice: 실재
  rationale: ‘환상’과의 존재론적 대조를 분명히 보존합니다.
theological_decisions:
- issue: 몸을 벗은 직후의 구원 여부
  choice: ‘곧바로 구원받는지’라는 질문과 ‘의심하지 말라’는 답을 그대로 두었습니다.
  alternative: 이를 즉각적인 사후 천국 입성이나 특정한 중간 상태 교리로 명시할 수 있습니다.
  rationale: 현존 문장은 구체적인 사후 상태를 설명하지 않으므로 특정 교파의 체계로 빈틈을 메우지 않았습니다.
- issue: 죽은 지체와 살아 있는 지체의 관계
  choice: 원문의 난해한 대조와 복수 표현을 보존했습니다.
  alternative: 죽은 육체와 그 안의 영혼 또는 영적 몸의 대조로 해설할 수 있습니다.
  rationale: 본문 훼손이 있고 ‘살아 있는 지체들’의 정확한 지시 대상이 불확실하므로 해석을 확정하지 않았습니다.
- issue: ‘일어난 이들’의 지속적 드러남으로서의 부활
  choice: 부활을 ‘일어난 이들이 계속해서 드러나는 것’으로 옮겼습니다.
  alternative: ‘부활한 이들에 대한 지속적인 계시’ 또는 ‘부활자들의 계속되는 현현’으로 옮길 수 있습니다.
  rationale: 주체와 대상 사이의 가능한 모호성을 어느 정도 유지하면서 평이한 한국어를 택했습니다.
- issue: 엘리야와 모세의 출현
  choice: 복음서의 장면을 부활의 실재성을 뒷받침하는 본문 자체의 논리로만 제시했습니다.
  alternative: 변모 사건의 교리적 의미나 엘리야의 죽음 여부를 부연할 수 있습니다.
  rationale: 원문에 없는 조화나 교리적 설명을 덧붙이지 않았습니다.
- issue: 세상과 부활의 실재성 대조
  choice: ‘세상을 환상이라고 말하는 편이 더 정확하다’는 강한 비교를 그대로 보존했습니다.
  alternative: 세상이 덧없거나 기만적이라는 완화된 의미로 의역할 수 있습니다.
  rationale: 원문의 존재론적 긴장과 수사적 충격을 약화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 질문과 단언의 수사적 힘을 살리면서도 일반 독자가 이해할 수 있는 어휘를 택했습니다. 현 단계의 번역은 제공된 공용 영어 증언에 근거한 잠정 초안이며, 콥트어 원문 대조가 이루어지면 어휘와 구문을 재검토해야 합니다.
