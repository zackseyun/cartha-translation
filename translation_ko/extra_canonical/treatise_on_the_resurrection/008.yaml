    rationale: 영어 증언은 ‘the visible limbs that are dead [] shall not be saved’로, 결락 표지가 ‘죽어 있는 ... 지체들’과 ‘구원받지 못할 것’ 사이에 있습니다. 한국어에서도 그 위치를 반영해야 손상 범위에 관한 불확실성을 불필요하게 바꾸지 않습니다.
  - severity: low
