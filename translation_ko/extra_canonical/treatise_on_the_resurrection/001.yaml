  text: '[] My son Rheginos, some wish to learn many things. This is their objective when preoccupied with questions whose answers they lack. If they are successful with these, they tend to think of themselves as quite important. I, however, do not believe they have attained to the word of truth. Instead, they look out for their own satisfaction, when we have received (true satisfaction) through our Savior, our Lord Christ. [] We obtained it when we knew the truth and found our repose in it.


    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
translation:
  language: ko
  text: '[] 내 아들 레기노스여, 어떤 사람들은 많은 것을 배우고 싶어 합니다. 그들은 답을 알지 못하는 문제들에 몰두하며 그것을 목표로 삼습니다. 그 답을 얻는 데 성공하면, 자신을 꽤 대단한 사람으로 여기는 경향이 있습니다. 그러나 나는 그들이 진리의 말씀에 이르렀다고 생각하지 않습니다. 오히려 그들은 자기만의 만족을 추구합니다. 그러나 우리는 우리의 구원자이신 주 그리스도를 통하여 참된 만족을 받았습니다.[a] [] 우리는 진리를 알고 그 안에서 안식을 찾았을 때 그것을 얻었습니다.


    그러나 당신이 부활을 올바르게 이해하는 것이 무엇인지 정중히 물었으므로,[b] 나는 당신에게 꼭 필요한 것을 씁니다. 많은 사람이 분명 부활을 믿지 않습니다. 그러나 그것을 발견하는 사람은 적습니다.[c] 그러니 이제 이 주제를 논해 봅시다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘참된’은 번역 증언에서 괄호로 보충된 말입니다. 현 단계의 번역은 콥트어 원문에 대한 직접 검토가 이루어지기 전의 잠정안입니다.
    reason: 보충어의 불확실성과 자료상의 한계를 독자에게 알립니다.
  - marker: b
    text: ‘이해하는 것’에 해당하는 말은 번역 증언에서 ‘해석’으로 괄호 안에 보충되어 있습니다.
    reason: 원문 손상 또는 번역상 보충 가능성을 보존합니다.
  - marker: c
    text: 직역하면 ‘그러나 그것을 발견하는 사람은 적습니다’입니다. 여기서 ‘발견하다’가 부활의 진리를 깨닫는다는 뜻인지, 부활 자체를 경험하거나 얻는다는 뜻인지는 열려 있습니다.
    reason: 신학적으로 중요한 원문의 모호성을 해소하지 않고 설명합니다.
lexical_decisions:
- source_word: My son Rheginos
  choice: 내 아들 레기노스여
  rationale: 스승과 제자 또는 영적 부자 관계를 나타내는 친밀하고 권위 있는 호칭을 자연스러운 한국어 호격으로 보존했습니다.
- source_word: word of truth
  choice: 진리의 말씀
  rationale: ‘진리에 관한 말’과 ‘진리인 말씀’의 가능성을 모두 열어 두는 전통적이면서도 이해하기 쉬운 표현입니다.
- source_word: satisfaction
  choice: 만족 / 참된 만족
  rationale: 증언 본문의 대조를 살리되, 괄호로 보충된 두 번째 용례의 ‘true’를 본문에 반영하고 각주로 표시했습니다.
- source_word: repose
  choice: 안식
  rationale: 단순한 휴식보다 진리 안에서 얻는 안정과 종교적 함의를 함께 전달합니다.
- source_word: correct (interpretation)
  choice: 올바르게 이해하는 것
  rationale: ‘interpretation’이 번역 증언에서 보충된 말이므로 단정적인 전문용어 ‘해석’보다 자연스러우면서도 열린 표현을 택했습니다.
- source_word: find it
  choice: 그것을 발견하는
  rationale: 앞 문장의 ‘믿다’로 평준화하지 않고 원문의 ‘찾다/발견하다’라는 인식적·경험적 긴장을 보존했습니다.
theological_decisions:
- issue: 그리스도를 통한 ‘참된 만족’의 성격
  choice: 우리의 구원자이신 주 그리스도를 통하여 참된 만족을 받았습니다
  alternative: 우리의 구원자, 우리 주 그리스도를 통하여 충족되었습니다
  rationale: 구원의 수단 또는 매개를 나타내는 진술을 보존하되, 특정 교파의 구원론적 체계로 구체화하지 않았습니다.
- issue: 부활을 ‘믿는 것’과 ‘발견하는 것’의 관계
  choice: 믿지 않습니다 / 발견하는 사람은 적습니다
  alternative: 믿지 않습니다 / 믿는 사람은 적습니다
  rationale: 두 동사를 동일하게 만들지 않아, 저자가 의도했을 수 있는 신앙과 깨달음 또는 경험 사이의 긴장을 유지했습니다.
- issue: 부활의 ‘올바른 해석’
  choice: 부활을 올바르게 이해하는 것이 무엇인지
  alternative: 부활에 대한 정통 해석이 무엇인지
  rationale: ‘정통’이라는 표현이 후대의 교리적 경계를 불필요하게 끌어들일 수 있어 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 아버지 또는 스승이 아들에게 권면하는 친밀함을 살리면서 논설문의 차분한 어조를 유지했습니다. 대괄호 []는 제공된 증언에 있는 사본 손상 또는 복원 신호로 그대로 보존했습니다. 콥트어 원문 검토가 아직 이루어지지 않았으므로 모든 결정은 제공된 공개 영역 영어 증언에 근거한 잠정 번역입니다.
