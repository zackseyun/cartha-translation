id: TRES.003
reference: Treatise on the Resurrection — The Savior Swallowed Up Death
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: ko
  text: '나는 내가 [] 복잡한 말로 답을 주고 있음을 압니다.[a] 그러나 진리의 말씀에는 이해하기 어려운 것이 없습니다. 그 답이 나타난 것은 아무것도 감추어진 채로 남지 않고, 존재에 관한 모든 것이 드러나게 하려는 것이었습니다. 그 결과 한편으로는 악이 소멸되고, 다른 한편으로는 선택받은 이들이 드러났습니다. 이 모든 것은 진리와 영의 유출이며, 은혜는 진리에서 나옵니다.


    사람들은 구원자께서 죽음을 삼키셨다는 것을 당신이 모른다고 여기지 않습니다.[b] 그분이 썩어 없어질 세계를 없애셨기 때문입니다. 그분은 [그것을] 썩지 않는 아이온으로 바꾸시고 스스로 일어나셨습니다.[c] 보이지 않는 것을 통하여 보이는 것을 삼키심으로써, 이와 같이 우리가 불멸에 이르는 길을 닦아 놓으셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 빈 대괄호 []는 전승된 본문의 훼손이나 빠진 부분을 나타냅니다.
    reason: 제공된 증언의 본문 상태를 독자에게 알립니다.
  - marker: b
    text: 이 문장은 제공된 영어 증언 자체가 다소 모호합니다. ‘사람들은 당신이 … 모른다고 여기지 않습니다’라는 이중 부정의 구조를 보존했습니다.
    reason: 문법적 모호성을 임의로 해소하지 않기 위해 설명합니다.
  - marker: c
    text: ‘아이온’은 시대, 영원, 또는 초월적 세계·영역을 가리킬 수 있는 말입니다. 여기서는 뜻을 하나로 좁히지 않고 음역했습니다. 대괄호 속 ‘그것을’은 편집자가 보충한 말입니다.
    reason: 핵심 용어의 의미 범위와 편집적 복원을 투명하게 밝힙니다.
lexical_decisions:
- source_word: word of truth
  choice: 진리의 말씀
  rationale: 문맥의 종교적·계시적 함의를 보존하면서도 현대 한국어 독자에게 자연스럽게 전달합니다.
- source_word: emanation
  choice: 유출
  rationale: 근원에서 흘러나옴이라는 고대 사상적 의미를 보존하고, 이를 단순한 ‘결과’나 ‘표현’으로 축소하지 않습니다.
- source_word: aeon
  choice: 아이온
  rationale: ‘시대’, ‘영원’, ‘영역’ 가운데 하나로 의미를 좁히지 않도록 음역어를 유지합니다.
- source_word: swallowed up
  choice: 삼키셨다
  rationale: 죽음과 보이는 것을 압도하여 없애는 원문의 강한 비유를 그대로 살립니다.
- source_word: imperishable
  choice: 썩지 않는
  rationale: ‘perishable’과의 대조를 분명히 하며, 존재의 부패·소멸 가능성을 함께 나타냅니다.
theological_decisions:
- issue: 구원자가 없앤 대상의 범위
  choice: ‘썩어 없어질 세계를 없애셨다’로 번역
  alternative: ‘썩어 없어질 세계를 폐하셨다/벗어 버리셨다’
  rationale: 영어 증언의 ‘dispensed with’가 지닌 불확실성을 인정하되, 문맥상 소멸의 방향을 전달합니다. 특정 교파의 우주론으로 더 구체화하지 않습니다.
- issue: ‘보이지 않는 것을 통하여 보이는 것을 삼킴’의 의미
  choice: 도구·수단 관계를 그대로 보존
  alternative: 영적인 것이 물질적인 것을 이겼다고 해설적으로 번역
  rationale: 원문의 신학적 긴장과 모호성을 유지하고 물질/영의 특정 교리 체계로 단정하지 않습니다.
- issue: ‘raised himself up’의 주체와 태
  choice: ‘스스로 일어나셨습니다’
  alternative: ‘자신을 일으키셨습니다’ 또는 ‘살아나셨습니다’
  rationale: 재귀적 표현을 보존하면서, 외부 행위자에 의해 일으켜졌다고 바꾸지 않습니다.
- issue: 선택받은 이들의 정체
  choice: ‘선택받은 이들’
  alternative: ‘택자들’
  rationale: 원문의 범주를 유지하되 특정 예정론적 체계를 불러올 수 있는 전문 교리 용어를 피합니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문장은 장중하되 지나치게 고어적이지 않게 구성했습니다. 이 초안은 콥트어 직접 검토가 아직 이루어지지 않은 상태에서 제공된 공공 영역 영어 증언과 감사된 영어 POB를 바탕으로 한 잠정 번역입니다.
