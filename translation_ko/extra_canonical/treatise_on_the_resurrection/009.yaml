base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: ko
  text: '그러나 내가 지금 여러분에게 무슨 말을 하는 것입니까? 살아 있는 이들이 죽을 것이라는 말입니까? 그들이 어떻게 환영 속에서 산다는 것입니까? 부자들은 가난해졌고 왕들은 권좌에서 끌어내려졌습니다. 모든 것은 변하기 마련입니다. 내가 실상을 과장하는 것이 아니라면, 세상은 환영입니다.[a]


    그러나 부활은 그와 같은 환영과 덧없음의 성격을 지니지 않습니다. 부활은 굳게 남아 있는 실재이기 때문입니다. 부활은 존재하는 것의 드러남이며, 곧 만물의 변모이자 새로운 것으로의 변화입니다. 썩지 않음이 [] 썩는 것 위에 [내려올] 것이기 때문입니다.[b] 빛은 어둠 위로 흘러내려 그것을 삼킬 것입니다. 그때 충만이 결핍을 채울 것입니다.[c] 이것들은 부활을 나타내는 상징과 형상입니다. 이것이 선을 이룹니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘환영’은 눈앞의 환상만이 아니라, 변하고 사라지는 까닭에 확고한 실재가 아닌 것을 가리킬 수 있습니다. 콥트어 원문 검토 전의 잠정 번역입니다.
    reason: 핵심어의 의미 범위를 보존하고 원어 검토가 아직 이루어지지 않았음을 밝힙니다.
  - marker: b
    text: 빈 대괄호 []는 전승 본문의 손상이나 빠진 부분을, [내려올]은 편집자가 문맥에 따라 복원한 말을 나타냅니다.
    reason: 제공된 영어 증거에 표시된 본문 손상과 편집적 복원을 독자에게 투명하게 전달합니다.
  - marker: c
    text: ‘충만’과 ‘결핍’은 이 문헌에서 서로 대조되는 상징적 개념입니다. 특정 신학 체계의 전문적 정의로 한정하지 않았습니다.
    reason: 상징적·신학적 함의를 보존하면서 교파적 또는 학파적 해석을 강요하지 않습니다.
lexical_decisions:
- source_word: illusion
  choice: 환영
  rationale: 단순한 거짓말보다는 실재처럼 보이지만 덧없이 지나가는 현상이라는 문맥을 살립니다. 콥트어 원문 대조가 아직 이루어지지 않았으므로 잠정적인 선택입니다.
- source_word: the reality that remains firm
  choice: 굳게 남아 있는 실재
  rationale: 부활을 변하는 세계와 대조하면서도 철학적 의미를 과도하게 확정하지 않도록 직역에 가까운 표현을 택했습니다.
- source_word: transfiguration
  choice: 변모
  rationale: 외형만의 변화보다 존재 양상의 변화라는 뜻을 전달하되, 특정 교리 용어로 좁히지 않습니다.
- source_word: imperishability / the perishable
  choice: 썩지 않음 / 썩는 것
  rationale: 서로 대조되는 추상성과 구체성을 유지하고, 불멸성으로 해석 범위를 좁히지 않습니다.
- source_word: Fullness / Deficiency
  choice: 충만 / 결핍
  rationale: 서로 대응하는 개념어로 번역하여 원문의 상징적 대조를 보존합니다.
theological_decisions:
- issue: 부활과 현 세계의 대조
  choice: 부활을 ‘굳게 남아 있는 실재’로, 세계를 ‘환영’으로 표현함
  alternative: 세계를 완전히 비실재적인 것으로 단정함
  rationale: 제공된 증거가 말하는 대조는 유지하되, ‘환영’의 형이상학적 의미를 특정 종파의 우주론으로 확정하지 않았습니다.
- issue: ‘존재하는 것의 드러남’과 ‘만물의 변모’의 관계
  choice: 두 표현을 병렬적으로 유지함
  alternative: 하나를 다른 하나의 해설로 통합함
  rationale: 원문 증거가 지닌 중첩과 긴장을 보존하고 부활의 의미를 단일 해석으로 환원하지 않습니다.
- issue: ‘충만’과 ‘결핍’의 상징성
  choice: 개념어를 그대로 보존하고 각주로 설명함
  alternative: 하나님 또는 구원받은 세계와 같은 해석어로 치환함
  rationale: 특정 신학 체계를 본문에 끌어들이지 않고 문헌 자체의 상징 언어를 유지합니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 수사적 질문과 상징적 대조를 살리되 문장은 일반 독자가 이해할 수 있도록 정돈했습니다. 이 초안은 제공된 공용 영역 영어 번역 증거를 바탕으로 하며, 나그함마디 문서의 콥트어 본문에 대한 직접 검토가 남아 있습니다.
