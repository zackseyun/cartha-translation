base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/015.yaml
  text: 'So they did not nail him, but tied him. Then he, placing his hands behind him and being bound to the stake, like a noble ram out of a great flock for an offering, a burnt sacrifice made ready and acceptable to God, looking up to heaven said:


    “O Lord God Almighty, the Father of your beloved and blessed Son Jesus Christ, through whom we have received the knowledge of you, the God of angels and powers and of all creation and of the whole race of the righteous, who live in your presence: I bless you for that you have granted me this day and hour, that I might receive a portion amongst the number of martyrs in the cup of [your] Christ unto resurrection of eternal life, both of soul and of body, in the incorruptibility of the Holy Spirit. May I be received among these in your presence this day, as a rich and acceptable sacrifice, as you did prepare and reveal it beforehand, and have accomplished it, you who are the faithful and true God. For this cause, yea and for all things, I praise you, I bless you, I glorify you, through the eternal and heavenly High-priest, Jesus Christ, your beloved Son, through whom with him and the Holy Spirit be glory both now [and ever] and for the ages to come. Amen.”'
translation:
  language: ko
  text: '14. 그들은 폴리카르포스를 못 박지 않고 묶었습니다. 그는 두 손을 등 뒤로 돌린 채 기둥에 묶였습니다. 그 모습은 큰 양 떼 가운데서 제물로 뽑힌 훌륭한 숫양, 곧 하나님께서 기쁘게 받으시도록 준비된 번제물과 같았습니다. 그는 하늘을 우러러보며 말했습니다.


    “주 하나님, 전능하신 이여,

    주께서 사랑하시며 복되게 하신 아들 예수 그리스도의 아버지시여,

    우리는 그분을 통하여 주를 알게 되었습니다.

    주께서는 천사들과 권세들과 모든 피조물의 하나님이시며,

    주 앞에서 살아가는 의인들의 온 무리의 하나님이십니다.


    주께서 제게 이 날과 이 시간을 허락하시어,

    순교자들의 수에 들어

    [주께서 보내신][a] 그리스도의 잔에 참여하고,

    성령의 썩지 않음 가운데

    영혼과 몸이 영원한 생명으로 부활하게 하셨으니,

    제가 주를 찬송합니다.


    주께서 미리 마련하시고 보여 주셨으며

    이제 이루신 대로,

    제가 오늘 주 앞에서 그들 가운데 받아들여져

    풍성하고 기쁘게 받으실 제물이 되게 해 주십시오.

    신실하고 참되신 하나님이시여,

    이 일 때문에, 참으로 모든 일 때문에,

    제가 주를 찬양하고 찬송하며 영화롭게 합니다.


    영원하시며 하늘에 계신 대제사장,

    곧 주께서 사랑하시는 아들 예수 그리스도를 통하여 그리합니다.

    그분을 통하여, 그분과 성령과 함께,

    주께 영광이 지금부터 [영원까지][b],

    다가올 모든 세대에 있기를 빕니다. 아멘.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증언에는 ‘your’가 대괄호 안에 있습니다. 이는 본문 복원 또는 사본상의 불확실성을 나타내는 표지이므로 번역에서도 표시했습니다.
    reason: 공급된 증언의 대괄호와 본문 불확실성을 투명하게 보존하기 위해서입니다.
  - marker: b
    text: 제공된 영어 증언에는 ‘and ever’가 대괄호 안에 있습니다. 이는 본문 복원 또는 사본상의 불확실성을 나타내는 표지이므로 번역에서도 표시했습니다.
    reason: 공급된 증언의 대괄호와 본문 불확실성을 투명하게 보존하기 위해서입니다.
lexical_decisions:
- source_word: tied / bound to the stake
  choice: 묶었습니다 / 기둥에 묶였습니다
  rationale: 처형 장면을 현대 독자가 분명히 이해하도록 하되, ‘stake’의 형태를 지나치게 구체화하지 않았습니다.
- source_word: like a noble ram out of a great flock for an offering
  choice: 큰 양 떼 가운데서 제물로 뽑힌 훌륭한 숫양
  rationale: 희생 제물로 선택된 숫양이라는 제의적 비유를 자연스러운 한국어로 보존했습니다.
- source_word: burnt sacrifice
  choice: 번제물
  rationale: 불에 온전히 태워 드리는 제물이라는 고대 제의의 의미를 간결하게 전달하는 익숙한 용어입니다.
- source_word: angels and powers
  choice: 천사들과 권세들
  rationale: ‘powers’를 천상의 존재나 권세로 읽을 수 있는 표현으로 남겨, 천사와 완전히 동일시하거나 지상의 통치자로 한정하지 않았습니다.
- source_word: martyrs
  choice: 순교자들
  rationale: 증언자라는 어원적 의미보다 이 문맥에서 죽음으로 신앙을 증언하는 이들을 가리키는 관용적 의미를 반영했습니다.
- source_word: the cup of Christ
  choice: 그리스도의 잔
  rationale: 그리스도의 고난과 죽음에 참여한다는 성경적·제의적 은유를 해설로 풀지 않고 그대로 보존했습니다.
- source_word: incorruptibility
  choice: 썩지 않음
  rationale: ‘불멸’로 좁히기보다 부패하지 않음이라는 원문의 구체적 이미지를 유지했습니다.
- source_word: High-priest
  choice: 대제사장
  rationale: 예수 그리스도의 중보적·제의적 칭호를 한국어 성경 전통에서 널리 이해되는 말로 옮겼습니다.
theological_decisions:
- issue: ‘성령의 썩지 않음’과 영혼·몸의 부활 사이의 문법적 관계
  choice: ‘성령의 썩지 않음 가운데 / 영혼과 몸이 영원한 생명으로 부활’
  alternative: ‘성령으로 말미암아 썩지 않을 영혼과 몸이 영원한 생명으로 부활’
  rationale: 제공된 영어 증언이 보존하는 수식 관계의 긴장을 유지하고, 성령을 명시적으로 수단으로 규정하거나 ‘썩지 않음’을 영혼과 몸에만 결부하지 않았습니다.
- issue: 그리스도의 잔에 참여하는 주체와 의미
  choice: ‘순교자들의 수에 들어 … 그리스도의 잔에 참여하고’
  alternative: ‘순교자들과 함께 그리스도의 고난을 받으며’
  rationale: 잔의 은유를 해석적으로 ‘고난’으로 대체하지 않고, 순교자 공동체에 몫을 얻는다는 표현을 자연스럽게 연결했습니다.
- issue: 마지막 영광송에서 성부·성자·성령의 관계
  choice: ‘그분을 통하여, 그분과 성령과 함께, 주께 영광이…’
  alternative: ‘성자와 성령께도 영광이…’
  rationale: 제공된 증언의 문법에 따라 영광이 ‘주’ 곧 기도의 수신자인 하나님께 향하고, 그리스도를 통하며 그리스도와 성령이 함께 언급되는 구조를 보존했습니다.
- issue: ‘God’의 한국어 호칭
  choice: 하나님
  alternative: 하느님
  rationale: 현대 한국어 개신교 문헌에서 일반 독자에게 널리 익숙한 표현을 사용했으며, 특정한 교리적 함의를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 경건한 합쇼체를 사용했습니다. 기도문은 운율과 병행 구조가 드러나도록 행을 나누었고, 고대 제의 용어는 이해 가능한 범위에서 유지했습니다. 다만 이 초안은 제공된 공공 영역 영어 증언을 토대로 작성되었으며, 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다.
