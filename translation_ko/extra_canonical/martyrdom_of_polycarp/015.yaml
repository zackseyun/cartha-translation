review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언을 기준으로, 초안의 “[주께서 보내신][a] 그리스도”는 “[Thy] Christ”의 소유격을 ‘보내신’이라는 관계절로 바꾸어 원문 증언에 없는 의미를 더합니다. 이를 “[주님의][a] 그리스도”로 고쳐 대괄호 안의 소유격 복원 표지와 의미를 보존해야 합니다. 또한 ‘이 날과 이 시간을 허락하신’ 목적은 순교자들의 수와 그리스도의 잔 안에서 몫을 받는 것이므로, 이미 부활을 이루어 주셨다는 듯한 직설적 결과 표현을 피하고 목적·청원 구조를 유지했습니다. 그리스어 사본 전통의 직접 대조는 제공되지 않아, 이 검토는 공급된 영어 증언에 대한 충실성 검토입니다.
  naturalness: 합쇼체 기도문의 격식을 유지하면서 ‘의인들의 온 무리’를 ‘의인들의 온 족속’으로, ‘풍성하고 기쁘게 받으실 제물’을 ‘값지고 받아들여질 만한 제물’로 다듬었습니다. 마지막 송영도 ‘지금과 [언제나], 또 오는 세세토록’으로 정리하여 대괄호의 범위와 병행 구조를 더 자연스럽게 드러냈습니다.
  terminology: ‘기둥’, ‘번제물’, ‘권세들’, ‘순교자들’, ‘그리스도의 잔’, ‘성령의 썩지 않음’, ‘대제사장’은 유지했습니다. ‘race of the righteous’는 혈통을 단정하지 않으면서 집단성을 보존하는 ‘의인들의 온 족속’으로 옮겼습니다. ‘rich sacrifice’는 제의적 긍정 평가를 유지하는 ‘값지고 받아들여질 만한 제물’로 옮겼습니다.
  issues:
  - severity: high
    issue: '[Thy] Christ를 ‘[주께서 보내신] 그리스도’로 번역함'
    rationale: 영어 증언의 대괄호 속 ‘Thy/your’는 소유격이며, ‘보내신’은 증언에 없는 의미를 삽입합니다. 대괄호 표지도 소유격에 붙어 있어야 합니다.
  - severity: medium
    issue: ‘영혼과 몸이 영원한 생명으로 부활하게 하셨으니’가 목적·청원 구문을 결과 진술처럼 만듦
    rationale: 증언은 이 날과 시간을 허락하신 까닭을 ‘순교자들의 수 가운데 몫을 받고 … 영원한 생명의 부활에 이르기 위하여’로 표현합니다. 한국어도 ‘몫을 받게 하셨으니’와 ‘부활에 이르도록’의 연결로 불확정적·목적적 구조를 보존하는 편이 안전합니다.
  - severity: low
    issue: ‘rich and acceptable sacrifice’의 의미가 다소 흐려짐
    rationale: ‘풍성하고 기쁘게 받으실’은 가능하지만, ‘rich’의 제의적 가치와 ‘acceptable’의 수납 가능성을 각각 드러내는 ‘값지고 받아들여질 만한’이 더 충실합니다.
  revised_text: '14. 그들은 폴리카르포스를 못 박지 않고 묶었습니다. 그는 두 손을 등 뒤로 한 채 기둥에 묶였고, 제물로 드려지려고 큰 양 떼에서 나온 빼어난 숫양, 곧 하나님께 드리기에 준비되어 받아들여질 번제물과 같았습니다. 그는 하늘을 우러러보며 말했습니다.


    “주 하나님, 전능하신 이여,


    주께서 사랑하시며 복되게 하신 아들 예수 그리스도의 아버지시여,


    우리는 그분을 통하여 주님을 아는 지식을 받았습니다.


    주님은 천사들과 권세들과 모든 피조물의 하나님이시며,


    주님 앞에서 살아가는 의인들의 온 족속의 하나님이십니다.


    주께서 제게 이 날과 이 시간을 허락하셔서,


    제가 순교자들의 수 가운데 한 몫을 받고,


    [주님의][a] 그리스도의 잔 안에서,


    성령의 썩지 않음 가운데


    영혼과 몸이 영원한 생명으로 부활하는 데 이르게 하셨으니,


    제가 주님을 찬송합니다.


    오늘 제가 주님 앞에서 그들 가운데 받아들여져,


    값지고 받아들여질 만한 제물이 되게 하소서.


    주께서 미리 마련하시고 드러내셨으며


    이루신 그대로 되게 하소서.


    신실하고 참되신 하나님이시여,


    이 일 때문에, 참으로 모든 일 때문에,


    제가 주님을 찬양하고 찬송하며 영화롭게 합니다.


    영원하시며 하늘에 계신 대제사장,


    곧 주께서 사랑하시는 아들 예수 그리스도를 통하여 그리합니다.


    그분을 통하여, 그분과 성령과 함께,


    주께 영광이 지금과 [언제나][b],


    또 오는 세세토록 있기를 빕니다. 아멘.”'
  revised_footnotes:
