base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/016.yaml
  text: 'When he had offered up the Amen and finished his prayer, those tending the fire lit the fire. And a mighty flame flashing forth, we to whom it was given to see saw a marvel; yea, and we were preserved that we might relate to the rest what happened.


    The fire, making the appearance of a vault, like the sail of a vessel filled by the wind, made a wall round about the body of the martyr; and it was there in the midst, not like flesh burning, but like [a loaf in the oven or like] gold and silver refined in a furnace. For we perceived such a fragrant smell, as if it were the wafted odor of frankincense or some other precious spice.'
translation:
  language: ko
  text: '그가 “아멘”을 올리고 기도를 마치자, 불을 맡은 이들이 불을 붙였습니다. 거센 불꽃이 타오르자, 그것을 보도록 허락받은 우리는 놀라운 광경을 보았습니다. 그리고 우리는 그 일을 다른 이들에게 전할 수 있도록 살아남았습니다.


    불은 바람을 가득 받은 배의 돛처럼 둥근 천장의 모양을 이루어 순교자의 몸 둘레에 벽처럼 둘러섰습니다. 그 몸은 그 한가운데 있었는데, 타는 살처럼 보이지 않고 [화덕 속의 빵처럼, 또는] 용광로에서 정련되는 금과 은처럼 보였습니다.[a] 우리는 유향이나 다른 값진 향료의 향기가 바람에 실려 오는 듯한 매우 향기로운 냄새를 맡았습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 전승 과정의 본문 복원 또는 사본 손상 가능성을 표시한 것으로, 제공된 영어 증언의 표기를 그대로 보존한 것입니다. 그리스어 사본 전통에 대한 직접 검토는 아직 필요합니다.
    reason: 기초 자료가 대괄호를 본문비평상의 신호로 명시하며, 현재 초안은 그리스어 원문 직접 검토 전 단계이기 때문입니다.
lexical_decisions:
- source_word: offered up the Amen
  choice: “아멘”을 올리고
  rationale: 기도의 끝에서 ‘아멘’을 발한 행위를 제의적 뉘앙스가 있는 ‘올리다’로 표현하되, 의미를 과도하게 풀어 쓰지 않았습니다.
- source_word: firemen / those tending the fire
  choice: 불을 맡은 이들
  rationale: 현대의 직업명인 ‘소방관’으로 오해되지 않도록, 처형의 불을 담당한 사람들을 자연스럽게 나타냈습니다.
- source_word: vault
  choice: 둥근 천장
  rationale: 불꽃이 몸 위로 휘어 아치형 공간을 이룬 시각적 형상을 현대 독자가 이해하기 쉽게 옮겼습니다.
- source_word: martyr
  choice: 순교자
  rationale: 초기 그리스도교 문헌의 문맥에서 정착된 한국어 용어를 사용했습니다.
- source_word: frankincense
  choice: 유향
  rationale: 성경 및 고대 종교 문헌에서 널리 쓰이는 표준 한국어 명칭을 채택했습니다.
theological_decisions:
- issue: 기적적 현상에 대한 서술자의 주장
  choice: ‘보도록 허락받은’, ‘살아남았습니다’로 증언의 관점을 그대로 보존함
  alternative: 현상을 객관화하거나 자연 현상으로 완화하여 서술함
  rationale: 본문은 이를 목격자 공동체가 받은 허락과 보존으로 해석하므로, 그 신학적 관점을 덧붙이거나 약화하지 않고 유지했습니다.
- issue: 불 가운데 있는 몸의 비유
  choice: 빵 및 정련되는 귀금속이라는 두 비유를 모두 보존함
  alternative: 둘 중 하나만 선택하거나 성찬·정화의 의미를 명시적으로 해설함
  rationale: 본문 자체가 제시하는 이미지와 긴장을 유지하고 특정 교리적 해석을 본문에 삽입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교 서사의 장엄함은 유지하되 고어투는 피했습니다. 이 초안은 제공된 공공 영역 영어 증언과 영어 POB를 대조하여 작성한 잠정 번역이며, 그리스어 사본 전통에 대한 직접 원문 검토가 완료되면 어휘와 문장 구조를 재검증해야 합니다.
