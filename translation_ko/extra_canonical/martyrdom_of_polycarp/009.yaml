    And he was met by Herod the captain of police and his father Nicetes, who also removed him to their carriage and tried to prevail upon him, seating themselves by his side and saying, ''Why what harm is there in saying, Caesar is Lord, and offering incense'', with more to this effect, ''and saving thyself?'' But he at first gave them no answer. When however they persisted, he said, ''I am not going to do what ye counsel me.''


    Then they, failing to persuade him, uttered threatening words and made him dismount with speed, so that he bruised his shin, as he got down from the carriage. And without even turning round, he went on his way promptly and with speed, as if nothing had happened to him, being taken to the stadium; there being such a tumult in the stadium that no man''s voice could be so much as heard.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/009.yaml
  text: 'But when at last he finished his prayer, after remembering everyone who had ever crossed his path—small and great, high and low—and the whole universal Church throughout the world, the hour of departure came. They seated him on a donkey and brought him into the city, since it was a high Sabbath.


    Herod, the captain of police, and his father Nicetes met him. They moved him into their carriage, sat beside him, and tried to persuade him, saying, “What harm is there in saying, ‘Caesar is Lord,’ and offering incense,” along with more words to this effect, “and saving yourself?” At first he gave them no answer. But when they persisted, he said, “I am not going to do what you advise me.”


    Then, having failed to persuade him, they spoke threatening words and made him get out quickly, so that he bruised his shin as he stepped down from the carriage. Without even turning around, he continued promptly and quickly on his way, as though nothing had happened to him, while he was taken to the stadium. There was such an uproar in the stadium that no one’s voice could even be heard.'
translation:
  language: ko
  text: '그러나 마침내 그는 기도를 마쳤습니다. 그는 이제껏 자신과 인연을 맺은 모든 사람, 곧 작은 자와 큰 자, 높은 자와 낮은 자를 기억하고, 온 세상에 있는 보편 교회 전체를 기억했습니다. 떠날 시간이 되자, 사람들은 그를 나귀에 태워 도시로 데려갔습니다. 그날은 큰 안식일이었습니다.[a]


    치안대장 헤롯과 그의 아버지 니케테스가 그를 만났습니다. 그들은 그를 자기들의 마차로 옮겨 태우고 그의 곁에 앉아 설득하려 했습니다. 그들은 “『카이사르가 주님이시다』라고 말하고 제사를 드리며, 그에 따르는 일을 하여 목숨을 구하는 것이 무슨 해가 되겠소?”라고 말했습니다. 그러나 그는 처음에는 아무 대답도 하지 않았습니다. 그들이 계속 다그치자, 그는 “나는 당신들이 권하는 대로 하지 않겠습니다”라고 말했습니다.


    그러자 그들은 그를 설득하지 못하자 위협하는 말을 내뱉고, 그를 마차에서 서둘러 내리게 했습니다. 그 때문에 그는 마차에서 내려오다가 정강이에 멍이 들었습니다. 그러나 그는 뒤도 돌아보지 않고, 아무 일도 당하지 않은 듯 곧바로 발걸음을 재촉하여 경기장으로 이끌려 갔습니다. 경기장에는 소란이 어찌나 심한지 아무도 목소리를 들을 수 없을 정도였습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘큰 안식일’은 전승의 표현을 그대로 옮긴 것입니다. 이것이 정확히 어느 절기나 날짜를 가리키는지는 여기서 단정하지 않습니다.
    reason: μεγάλου σαββάτου(‘큰 안식일’)라는 표현의 역사적·달력상 지시 대상이 본문만으로 확정되지 않으므로, 특정 유대 절기나 기독교 축일로 해석을 덧붙이지 않고 원문의 모호성을 보존합니다.
lexical_decisions:
- source_word: remembering all who at any time had come in his way
  choice: 이제껏 자신과 인연을 맺은 모든 사람을 기억하고
  rationale: 단순히 길에서 마주쳤다는 뜻보다 그가 살아오며 관계하거나 접한 사람들을 포괄하는 표현으로 자연스럽게 옮겼습니다.
- source_word: the hour of departure
  choice: 떠날 시간
  rationale: 죽음 또는 순교를 암시하지만 본문의 완곡함과 신학적 여운을 보존하기 위해 ‘죽을 때’로 명시하지 않았습니다.
- source_word: Caesar is Lord
  choice: 카이사르가 주님이시다
  rationale: 로마 황제에 대한 충성 고백과 초기 그리스도교의 주권 고백 사이의 긴장을 보존하도록 ‘주님’으로 옮겼습니다.
- source_word: captain of police
  choice: 경찰대장
  rationale: 고대의 치안 담당 관직임을 현대 독자가 쉽게 이해하도록 하되, 군사 지휘관으로 과도하게 특정하지 않았습니다.
- source_word: stadium
  choice: 경기장
  rationale: 처형과 공개 행사가 이루어지는 고대 도시의 경기장을 가리키는 평이한 현대어를 택했습니다.
theological_decisions:
- issue: ‘떠남’의 의미
  choice: 죽음을 직접 명시하지 않고 ‘떠날 시간’으로 유지
  alternative: ‘죽을 시간이 되자’ 또는 ‘순교할 때가 되자’
  rationale: 원문의 완곡한 표현이 지닌 죽음·출발의 중의성과 순교 서사의 긴장을 보존했습니다.
- issue: 카이사르에 대한 주권 호칭
  choice: ‘주님’이라는 칭호를 그대로 사용
  alternative: ‘주권자’ 또는 ‘황제’
  rationale: ‘카이사르가 주다’라는 정치적·종교적 고백이 그리스도교의 주권 언어와 충돌하는 의미를 약화하지 않았습니다.
- issue: 보편 교회
  choice: ‘온 세상에 있는 보편 교회 전체’
  alternative: ‘전 세계의 가톨릭교회’
  rationale: 이 문맥의 ‘보편적’ 의미를 살리면서 후대의 특정 교파 명칭으로 오해될 가능성을 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 순교 서사의 긴박함을 살리되 과장된 고어체는 피했습니다. 제공된 자료가 영어 공개 저작권 번역 증언에 기반하고 그리스어 원문 검토가 보류된 상태이므로, ‘큰 안식일’ 같은 논쟁 가능 표현은 본문에서 보존하고 각주로 한계를 밝혔습니다.
