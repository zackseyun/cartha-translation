base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/003.yaml
  text: 'Blessed, therefore, and noble are all the martyrdoms that have taken place according to the will of God—for it behooves us to be very scrupulous and to assign to God power over all things.


    For who could fail to admire their nobility, patient endurance, and loyalty to the Master? For, when they were so torn by lashes that the mechanism of their flesh was visible even as far as the inward veins and arteries, they endured patiently, so that the very bystanders had pity and wept; while they themselves reached such a pitch of bravery that none of them uttered a cry or a groan, thus showing us all that at that hour the martyrs of Christ, while being tortured, were absent from the flesh—or rather, that the Lord was standing by and conversing with them.


    And, giving heed to the grace of Christ, they despised the tortures of this world, purchasing at the cost of one hour a release from eternal punishment. And they found the fire of their inhuman torturers cold, for they set before their eyes escape from the eternal fire that is never quenched; while with the eyes of their heart they gazed upon the good things reserved for those who endure patiently, things that neither ear has heard nor eye has seen, neither have they entered into the heart of man, but were shown to them by the Lord, for they were no longer men but already angels.


    And in like manner also those condemned to the wild beasts endured fearful punishments, being made to lie on sharp shells and buffeted with other forms of manifold tortures, so that the devil might, if possible, by the persistence of the punishment bring them to a denial; for he tried many wiles against them.'
translation:
  language: ko
  text: '그러므로 하나님의 뜻에 따라 이루어진 모든 순교[a]는 복되고 고귀합니다. 우리는 매우 신중해야 하며, 모든 것에 대한 권한을 하나님께 돌려 드려야 합니다.


    누가 그들의 고귀함과 끈기 있는 인내와 주님께 대한 충성을 보고 감탄하지 않을 수 있겠습니까? 그들은 채찍에 찢겨 살의 구조가 안쪽 정맥과 동맥에 이르기까지 드러났는데도 인내했습니다. 곁에 서 있던 사람들조차 가엾이 여겨 울었지만, 그들 자신은 그토록 큰 용기를 보여 아무도 비명이나 신음 소리를 내지 않았습니다. 이로써 그들은 우리 모두에게, 그때 고문당하던 그리스도의 순교자들이 육신을 떠나 있었음을[b], 아니 오히려 주님께서 곁에 서서 그들과 말씀을 나누고 계셨음을 보여 주었습니다.


    그들은 그리스도의 은혜에 마음을 두었기에 이 세상의 고문을 대수롭지 않게 여겼으며, 한 시간의 대가로 영원한 형벌에서 풀려남을 샀습니다.[c] 잔인한 고문자들의 불도 그들에게는 차갑게 느껴졌습니다. 그들은 결코 꺼지지 않는 영원한 불에서 벗어날 일을 눈앞에 두고 있었기 때문입니다. 또한 마음의 눈으로, 끝까지 견디는 이들을 위하여 마련된 좋은 것들을 바라보았습니다. 그것들은 어느 귀도 듣지 못하고 어느 눈도 보지 못했으며 사람의 마음에도 떠오르지 않은 것들이지만, 주님께서 그들에게 보여 주셨습니다. 그들은 더 이상 사람이 아니라 이미 천사들이었기 때문입니다.


    이와 마찬가지로 맹수들에게 던져지도록 선고받은 이들도 무서운 형벌을 견뎠습니다. 그들은 날카로운 조개껍데기 위에 눕혀지고[d], 그 밖에도 갖가지 고문으로 시달렸습니다. 마귀는 끈질긴 형벌로 할 수만 있다면 그들이 부인하게 하려고 했습니다. 마귀가 그들을 대적하여 수많은 계략을 꾸몄기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘순교’로 옮긴 말은 본래 ‘증언’이라는 뜻도 지닙니다. 여기서는 그리스도를 증언하다 고난을 겪은 사건을 가리킵니다.
    reason: 초기 그리스도교 문헌에서 해당 단어가 지닌 증언과 순교의 의미 연결을 독자에게 알립니다.
  - marker: b
    text: ‘육신을 떠나 있었다’는 말은 본문의 표현입니다. 저자는 곧바로 ‘아니 오히려’라고 고쳐 말하며, 주님께서 그들과 함께하셨다고 설명합니다.
    reason: 이 표현을 영혼의 실제 이탈이나 단순한 무감각으로 단정하지 않고 본문의 자기 수정 구조를 보존합니다.
  - marker: c
    text: ‘샀습니다’는 극심하지만 짧은 고난과 영원한 형벌에서의 해방을 대조하는 원문의 거래 비유를 살린 표현입니다.
    reason: 현대 독자가 이 문장을 공로로 구원을 구매한다는 체계적 교리 진술로 오해하지 않도록 문학적 비유임을 밝힙니다.
  - marker: d
    text: ‘날카로운 조개껍데기’는 몸을 베고 찌르는 고문 도구를 가리킵니다. 해당 그리스어 표현의 구체적인 형태는 확실하지 않습니다.
    reason: 고대 고문 도구를 가리키는 표현의 역사적·어휘적 불확실성을 투명하게 표시합니다.
lexical_decisions:
- source_word: μαρτύρια
  choice: 순교
  rationale: 이 문맥에서는 그리스도를 증언하다 고난과 죽음을 겪는 사건들을 가리키므로 현대 한국어의 정착된 표현인 ‘순교’를 사용하되, 어근의 ‘증언’ 의미를 각주에 밝혔습니다.
- source_word: φιλοδεσποτία
  choice: 주님께 대한 충성
  rationale: 직역하면 ‘주인을 사랑함’에 가까우나, 여기서는 그리스도를 향한 헌신과 충절을 나타내므로 자연스럽고 품위 있게 옮겼습니다.
- source_word: τῆς σαρκὸς οἰκονομία
  choice: 살 속의 구조
  rationale: 신체 내부의 배열이나 조직이 드러났다는 생생한 묘사를 전달하면서도 ‘육체의 기계 장치’처럼 부자연스러운 표현을 피했습니다.
- source_word: ἀπεδήμουν ἐκ τῆς σαρκός
  choice: 육신을 떠나 있었음
  rationale: 극심한 고통 가운데 육체적 감각을 초월한 듯했다는 원문의 비유적 표현을 해석으로 평탄화하지 않고 보존했습니다.
- source_word: ἐξαγοραζόμενοι
  choice: 대가로 … 풀려남을 샀습니다
  rationale: ‘사다, 값을 치러 얻다’라는 거래 비유를 유지하여 한 시간의 고난과 영원한 형벌의 대비를 살렸습니다.
- source_word: ἄγγελοι
  choice: 천사와 같았기 때문입니다
  rationale: 수사적으로 순교자들의 변화된 상태를 높여 말하는 문맥이므로 한국어에서 존재론적 단정을 피하면서 비유의 힘을 전달했습니다.
theological_decisions:
- issue: 하나님의 뜻과 순교 사건의 관계
  choice: ‘하나님의 뜻에 따라 이루어진’으로 원문의 진술을 유지
  alternative: 하나님이 각 고문을 직접 일으키셨다고 명시
  rationale: 본문은 순교가 하나님의 뜻과 통치 아래 있음을 말하지만 악행의 직접 원인을 하나님께 돌리지는 않으므로 그 긴장을 그대로 두었습니다.
- issue: 순교자들이 ‘육신을 떠나 있었다’는 표현
  choice: 원문의 표현을 보존하고 곧이어 나오는 ‘아니 오히려’를 유지
  alternative: 무감각 상태나 영혼의 실제 이탈로 단정
  rationale: 저자 자신이 첫 설명을 더 나은 설명으로 수정하므로 특정한 인간론이나 신비 체험으로 확정하지 않았습니다.
- issue: ‘더 이상 사람이 아니라 이미 천사’라는 진술
  choice: ‘이미 천사와 같았다’로 수사적 비교를 드러냄
  alternative: 순교자가 문자적으로 천사가 되었다고 번역
  rationale: 인간이 천사 종족으로 변한다는 교리를 도입하지 않으면서, 저자가 강조하는 초인적인 인내와 하늘에 가까운 상태를 전달했습니다.
- issue: 고문의 배후 행위자
  choice: 폭군의 강압과 마귀의 계략을 함께 표현
  alternative: 모든 행동의 주어를 마귀 하나로 통합
  rationale: 그리스어 전승에서 가까운 행위자인 폭군과 궁극적 배후인 마귀가 이어져 나타나는 구조를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교 서사의 엄숙함과 생생함을 유지하되 지나치게 고어적인 표현은 피했습니다. 직접적인 신체 묘사는 원문의 강도를 약화하지 않는 범위에서 일반 독자가 이해할 수 있게 다듬었습니다. 제공된 자료가 그리스어 본문 자체가 아니라 공개 영역 영어 증언문과 ‘그리스어 검토 대기’ 메타데이터를 포함하므로, 알려진 그리스어 전승의 핵심 어휘와 통사 구조를 우선 참조하되 세부적으로 불확실한 고문 도구 표현은 각주로 표시했습니다.
