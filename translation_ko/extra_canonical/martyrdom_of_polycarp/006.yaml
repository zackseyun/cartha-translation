    issue: ‘황홀경에 빠져’
    rationale: 그리스어 전통은 폴리카르포스가 기도하면서 ‘환상을 보았다’고 표현합니다. 황홀경은 환상을 보기 전의 특정 의식 상태를 추가하여 본문의 진술을 넘을 수 있습니다.
  - severity: low
    issue: ‘함께 있던 사람들을 돌아보며’
    rationale: 원문과 영어 증언은 그가 ‘돌아서서/방향을 돌려’ 함께 있던 이들에게 말했다고 합니다. ‘돌아서서’가 동작을 더 충실하게 전달합니다.
  - severity: low
    issue: ‘농장’의 지시 범위
    rationale: ἀγρίδιον은 현대적 생산 시설로서의 농장이라기보다 도시 근처의 작은 시골 거처 또는 농촌 재산을 가리킬 수 있습니다. ‘시골의 한 거처’는 불필요한 현대적 연상을 줄입니다.
