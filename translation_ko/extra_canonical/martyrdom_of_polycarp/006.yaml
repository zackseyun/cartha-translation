review_pass:
  verdict: revise
  source_fidelity: 그리스어 전통의 표현은 기도 중 ‘황홀경에 빠졌다’기보다 ‘환상(ὀψίαν)을 보았다’는 뜻으로 이해하는 것이 더 직접적입니다. 또한 ‘돌아서서 말하였다’는 동작을 ‘돌아보며’보다 명시적으로 옮기는 편이 정확합니다. 나머지 사건 전개, 온 세상 교회들을 위한 기도, 체포 사흘 전의 시점, 산 채로 화형될 필연성은 충실히 보존되어 있습니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 ‘황홀경에 빠져’는 현대 한국어에서 종교적·심리적 상태를 다소 강하게 규정하므로, 원문의 환상 경험을 담담하게 전달하는 ‘환상을 보았습니다’가 더 자연스럽고 절제되어 있습니다. ‘시골의 한 거처’는 여기서 말하는 도시 인근의 농촌 재산/거처를 자연스럽게 포괄합니다.
  terminology: ‘폴리카르포스’, ‘교회들’, ‘붙잡히다’, ‘산 채로 불태워지다’는 적절합니다. ‘영광스러운’은 원문의 찬사 표현을 보존합니다. ‘황홀경’은 원문의 직접 표현으로 보기 어려워 ‘환상’으로 수정합니다.
  issues:
