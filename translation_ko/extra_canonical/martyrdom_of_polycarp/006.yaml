base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/006.yaml
  text: 'When the glorious Polycarp first heard it, he was not at all dismayed, but desired to remain in town. Yet the greater part persuaded him to withdraw. So he withdrew to a farm not far from the city, and there he stayed with a few companions, doing nothing else night and day but praying for all people and for the churches throughout the world; for this was his constant habit.


    And while praying, three days before his apprehension, he fell into a trance and saw his pillow burning with fire. He turned and said to those who were with him, “It must needs be that I shall be burned alive.”'
translation:
  language: ko
  text: '영광스러운 폴리카르포스는 처음 이 소식을 들었을 때 조금도 두려워하지 않고 도시에 그대로 머물고자 했습니다. 그러나 대다수의 사람들이 그를 설득하여 떠나게 했습니다. 그래서 그는 도시에서 멀지 않은 시골의 한 거처로 물러나 몇몇 동료와 함께 머물렀습니다. 그곳에서 그는 밤낮으로 모든 사람과 온 세상에 있는 교회들을 위해 기도하는 일 외에는 아무것도 하지 않았습니다. 이것이 그의 한결같은 습관이었기 때문입니다.


    그는 붙잡히기 사흘 전, 기도하면서 환상을 보았습니다. 자기 베개가 불에 타고 있는 것을 본 것입니다. 그러고는 함께 있던 사람들에게 돌아서서 말했습니다. “나는 반드시 산 채로 불태워질 것입니다.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공공 영역 영어 번역 증언과 제시된 그리스어 사본 전통 정보를 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통에 대한 직접적인 본문 비평 검토는 아직 남아 있습니다.
    reason: 번역의 자료 범위와 그리스어 본문 검토 상태를 독자에게 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: glorious
  choice: 영광스러운
  rationale: 인물에게 주어진 존귀와 찬사를 유지하면서도 후대의 특정 성인 호칭을 덧붙이지 않았습니다.
- source_word: withdraw
  choice: 피하다 / 피하여
  rationale: 단순한 이동이 아니라 체포의 위협을 피해 도시 밖으로 물러났다는 문맥을 자연스럽게 드러냈습니다.
- source_word: farm
  choice: 농장
  rationale: 도시에서 가까운 시골 거처를 가리키는 일반적이고 현대적인 표현을 사용했습니다.
- source_word: trance
  choice: 황홀경
  rationale: 기도 중 일상적 의식 상태를 벗어나 환상을 본 체험을 나타내되, 그 성격을 의학적 현상이나 특정한 계시 유형으로 단정하지 않았습니다.
- source_word: It must needs be
  choice: 반드시 … 될 것입니다
  rationale: 미래 사건의 필연성을 보존하되, 그것이 신적 명령인지 예언적 확신인지 문법만으로 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 폴리카르포스가 본 불붙는 베개의 의미
  choice: 본문에서는 환상과 그의 해석을 차례로 제시함
  alternative: 환상 자체가 하나님께서 주신 순교 예언이었다고 명시함
  rationale: 증언이 말하는 사건과 폴리카르포스의 발언은 보존하되, 환상의 출처와 신학적 성격을 본문보다 더 구체적으로 규정하지 않았습니다.
- issue: ‘반드시’가 나타내는 필연성
  choice: ‘반드시 산 채로 불태워질 것입니다’로 표현함
  alternative: ‘하나님의 뜻에 따라 산 채로 불태워져야 합니다’로 번역함
  rationale: 필연성은 유지하지만, 제공된 증거가 명시하지 않은 신적 뜻이나 명령을 번역에 삽입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교 문헌에 어울리는 품위를 유지하되, ‘도시에 그대로 머물고자 했습니다’, ‘붙잡히기 사흘 전’처럼 일반 독자가 쉽게 이해할 수 있는 현재적 표현을 선택했습니다. 인명은 통용되는 교회사 표기인 ‘폴리카르포스’를 사용했습니다.
