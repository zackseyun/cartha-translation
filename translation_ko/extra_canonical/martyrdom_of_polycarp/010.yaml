  rationale: 수정은 원문 및 영어 증거의 의미 범위를 보존하면서, τύχη의 핵심 의미를 바로잡고, 인용된 명령문의 화행과 강도를 회복하며, ‘brought’가 특정하지 않는 호송 방식을 절제했습니다. 그리스도 부인의 목적어와 하늘의 음성의 발화자, 그리고 여든여섯 해의 기산점은 본문에서 계속 명시하지 않았습니다.
