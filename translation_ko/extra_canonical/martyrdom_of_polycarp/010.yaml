base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/010.yaml
  text: 'But as Polycarp entered the stadium, a voice came to him from heaven: “Be strong, Polycarp, and be courageous.” No one saw the speaker, but those of our people who were present heard the voice. At last, when he was brought up, there was a great uproar, for they had heard that Polycarp had been arrested.


    When he was brought before him, the proconsul asked whether he was the man. When he confessed that he was, the proconsul tried to persuade him to deny Christ, saying, “Have respect for your age,” and other such things, as they usually say: “Swear by the genius of Caesar; repent and say, ‘Away with the atheists!’” Then Polycarp, with a solemn expression, looked at the whole crowd of lawless heathen in the stadium and waved his hand toward them. Groaning and looking up to heaven, he said, “Away with the atheists!”


    But when the magistrate pressed him strongly and said, “Swear the oath, and I will release you. Revile the Christ,” Polycarp said, “For eighty-six years I have been his servant, and he has done me no wrong. How then can I blaspheme my King who saved me?”'
translation:
  language: ko
  text: '9


    폴리카르포스가 경기장에 들어갈 때, 하늘에서 한 음성이 그에게 들려왔습니다. “폴리카르포스야, 굳세어라. 용기를 내어라.”[a] 말한 이를 본 사람은 아무도 없었지만, 그 자리에 있던 우리 교우들은 그 음성을 들었습니다. 드디어 그가 앞으로 이끌려 나오자 큰 소동이 일어났습니다. 사람들이 폴리카르포스가 붙잡혔다는 소식을 들었기 때문입니다.


    그가 총독 앞에 이끌려 오자, 총독은 그가 바로 그 사람인지 물었습니다. 그가 그렇다고 인정하자, 총독은 그를 설득하여 부인하게 하려고 말했습니다. “그대의 나이를 생각하시오.” 그리고 그들이 흔히 하는 대로 이와 같은 다른 말도 하였습니다. “가이사의 행운을 두고 맹세하시오.[b] 마음을 돌이켜 ‘무신론자들을 없애 버려라!’ 하고 말하시오.” 그러자 폴리카르포스는 엄숙한 얼굴로 경기장에 있는 법을 무시하는 이교도 무리를 모두 바라보고, 그들을 향해 손을 내저었습니다. 그는 신음하며 하늘을 우러러보고 말했습니다. “무신론자들을 없애 버려라!”[c]


    총독이 거듭 다그치며 “맹세하시오. 그러면 그대를 풀어 주겠소. 그리스도를 모욕하시오”라고 말하자, 폴리카르포스가 대답했습니다. “나는 여든여섯 해 동안 그분을 섬겨 왔고, 그분은 내게 아무런 잘못도 하지 않으셨습니다.[d] 그런데 나를 구원하신 나의 왕을 내가 어떻게 모독할 수 있겠습니까?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “용기를 내어라”에 해당하는 그리스어 표현은 문자적으로 “남자답게 행하여라”라는 뜻이지만, 여기서는 성별보다 담대함을 촉구하는 관용 표현입니다.
    reason: 고대 관용구의 문자적 형태와 문맥상 의미를 함께 알립니다.
  - marker: b
    text: “가이사의 행운”은 가이사의 τύχη, 곧 황제의 행운·번영을 두고 하는 로마 시대의 맹세 표현입니다. 이 표현에는 황제 권력의 종교·정치적 함의가 있을 수 있습니다.
    reason: τύχη를 ‘운명’으로 오해하지 않도록 하면서, 이를 하나의 특정 신격으로 단정하지 않습니다.
  - marker: c
    text: 당시 그리스도인들은 로마의 신들을 섬기지 않는다는 이유로 “무신론자”라고 불리기도 했습니다. 폴리카르포스는 손을 경기장의 군중 쪽으로 내저으며 이 말을 그들에게 되돌려 말합니다.
    reason: 발언의 역설과 지시 대상을 문맥에 따라 이해하도록 돕습니다.
  - marker: d
    text: “여든여섯 해”가 폴리카르포스의 평생을 뜻하는지, 그리스도를 믿고 섬긴 기간을 뜻하는지는 이 문장만으로 확정하기 어렵습니다.
    reason: 연대 계산과 유아기 신앙 여부에 관한 후대의 교리적 추론을 본문에 강요하지 않습니다.
lexical_decisions:
- source_word: ἴσχυε … καὶ ἀνδρίζου
  choice: 굳세어라. 용기를 내어라
  rationale: 첫 동사의 ‘강건하라’와 둘째 동사의 관용적 의미인 ‘용감하게 처신하라’를 자연스러운 현대 한국어로 구별해 옮겼습니다.
- source_word: ἀνθύπατος
  choice: 총독
  rationale: 로마 속주의 proconsul을 가리키며, 일반 독자가 이해하기 쉬운 관용 번역을 택했습니다.
- source_word: τὴν Καίσαρος τύχην
  choice: 가이사의 운명
  rationale: τύχη의 기본 의미를 보존했습니다. 황제의 신격화된 행운 또는 수호 권능을 가리킬 수 있으므로 각주로 역사적 함의를 밝혔습니다.
- source_word: ἀρνεῖσθαι
  choice: 부인하게 하려고
  rationale: 그리스어에는 목적어가 명시되지 않으므로 본문에 ‘그리스도’를 보충하지 않아 원문의 여지를 보존했습니다.
- source_word: ἀνόμων ἐθνῶν
  choice: 무법한 이방인 무리
  rationale: ‘법 없는’이라는 평가와 비유대 민족·이교 군중을 가리키는 표현을 함께 살렸습니다.
- source_word: βλασφημῆσαι / λοιδόρησον
  choice: 모독할 수 있겠습니까 / 모욕하시오
  rationale: 서로 다른 그리스어 동사인 βλασφημέω와 λοιδορέω의 차이를 한국어에서도 구별했습니다.
theological_decisions:
- issue: 여든여섯 해의 기산점
  choice: 나는 여든여섯 해 동안 그분을 섬겨 왔고
  alternative: 나는 태어난 뒤 여든여섯 해 동안 그분의 종이었고
  rationale: 문맥은 생애 전체 또는 신앙생활의 기간으로 모두 이해될 수 있습니다. 본문은 기간의 시작점을 특정하지 않고 각주에서 모호성을 보존했습니다.
- issue: ‘무신론자들’의 지시 대상
  choice: 폴리카르포스가 손을 군중 쪽으로 내저었다는 서술을 그대로 보존
  alternative: 그리스도인들을 없애라는 총독의 요구에 그대로 동의한 것으로 처리
  rationale: 폴리카르포스가 고발 문구를 군중에게 되돌리는 장면의 역설을 서술 동작과 각주로 드러내되, 본문에 해설을 삽입하지 않았습니다.
- issue: 하늘의 음성
  choice: 하늘에서 그에게 이런 음성이 들려왔습니다
  alternative: 하나님께서 하늘에서 말씀하셨습니다
  rationale: 원문은 말한 이의 정체를 명시하지 않으므로 신적 발화자를 본문에서 단정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교 서사의 엄숙함은 유지하되 고어투를 피했고, 법정 장면에서는 총독의 명령에 하오체를 사용하여 권위적 거리감을 나타냈습니다. 고유명사는 ‘폴리카르포스’, ‘가이사’를 사용했습니다. 제공 자료는 영어 공용 번역을 주 증거로 제시하지만, 문안은 알려진 그리스어 전승의 핵심 어휘와 통사도 대조하여 작성했습니다. 다만 정식 비평판에 따른 직접 원문 검토는 별도로 확정할 필요가 있습니다.
