base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/011.yaml
  text: 'But when he persisted and said again, “Swear by the genius of Caesar,” Polycarp answered, “If you vainly suppose that I will swear by the genius of Caesar, as you say, and pretend not to know who I am, then hear me plainly: I am a Christian. But if you wish to learn the teaching of Christianity, appoint a day and grant me a hearing.”


    The proconsul said, “Persuade the people.” But Polycarp said, “I would have considered you worthy of a discussion, for we have been taught to give rulers and authorities appointed by God the honor that is proper, as long as it does us no harm. But I do not consider these people worthy of hearing me defend myself before them.”'
translation:
  language: ko
  text: '그러나 총독이 계속 다그치며 다시 “카이사르의 수호신을 두고 맹세하라”라고 말하자, 폴리카르포스가 대답했습니다. “당신이 말한 대로 내가 카이사르의 수호신을 두고 맹세하리라고 헛되이 생각하고, 또 내가 누구인지 모르는 체한다면, 분명히 들으십시오. 나는 그리스도인입니다. 그리스도교의 가르침을 배우고 싶다면, 날을 정하여 내 말을 들어 주십시오.”


    총독이 “백성을 설득하라”라고 말했습니다. 그러나 폴리카르포스는 말했습니다. “당신에게는 말씀드릴 만하다고 여겼습니다. 우리는 하나님께서 세우신 통치자들과 권세자들에게 마땅한 존경을, 그것이 우리에게 해가 되지 않는 한, 돌리라고 배웠기 때문입니다. 그러나 저 사람들 앞에서 내가 변론해야 할 만큼 그들을 합당하다고 여기지는 않습니다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: genius of Caesar
  choice: 카이사르의 수호신
  rationale: 로마 종교에서 카이사르를 보호하거나 대표한다고 여긴 영적 존재를 가리키므로, 현대 독자가 ‘재능’으로 오해하지 않도록 역사적 의미를 드러냈습니다.
- source_word: Christian
  choice: 그리스도인
  rationale: 신앙 정체성을 직접 선언하는 간결하고 자연스러운 현대 한국어 표현입니다.
- source_word: doctrine of Christianity
  choice: 그리스도교의 가르침
  rationale: ‘교리’보다 넓을 수 있는 가르침의 의미를 보존하면서 일반 독자도 쉽게 이해하도록 했습니다.
- source_word: princes and authorities
  choice: 통치자들과 권세자들
  rationale: 정치적 지위와 공적 권한이라는 두 범주를 구별하여 살렸습니다.
- source_word: defend myself
  choice: 변론하다
  rationale: 단순한 자기보호보다 공개적으로 자기 입장을 해명하고 답변한다는 법정·수사적 맥락을 반영합니다.
theological_decisions:
- issue: 하나님이 세우신 권세에 대한 존경과 신앙적 한계
  choice: “마땅한 존경을, 그것이 우리에게 해가 되지 않는 한”으로 조건을 명시했습니다.
  alternative: 통치자에게 무조건 복종하라는 뜻으로 평탄화할 수 있습니다.
  rationale: 본문은 공권력에 대한 존경을 인정하면서도, 카이사르의 수호신을 두고 맹세하는 행위는 거부하는 긴장을 유지합니다.
- issue: 군중 앞에서의 변론 거부
  choice: 군중이 ‘합당하지 않다’는 폴리카르포스의 평가를 그대로 보존했습니다.
  alternative: 안전 문제나 재판 절차상의 이유로 의역할 수 있습니다.
  rationale: 본문이 제시하지 않은 동기를 덧붙이지 않고 발언의 날카로운 수사적 성격을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교 문헌의 법정 장면에 맞게 dignified한 어조를 유지하되 고어체는 피했습니다. 제공 자료가 영어 공공영역 증언에 기초하고 그리스어 직접 검토가 아직 예정되어 있으므로, 번역은 잠정적 원문 지향 초안입니다.
