source:
  text: But one man, Quintus by name, a Phrygian newly arrived from Phrygia, when he saw the wild beasts, turned coward. He it was who had forced himself and some others to come forward of their own free will. This man the proconsul by much entreaty persuaded to swear the oath and to offer incense. For this cause therefore, brethren, we praise not those who deliver themselves up, since the Gospel doth not so teach us.
  text_scope: public_domain_english_witness
  manuscript: Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xi.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: But one man, Quintus by name, a Phrygian newly arrived from Phrygia, when he saw the wild beasts, turned coward. He it was who had forced himself and some others to come forward of their own free will. This man the proconsul by much entreaty persuaded to swear the oath and to offer incense. For this cause therefore, brethren, we praise not those who deliver themselves up, since the Gospel doth not so teach us.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/005.yaml
  text: But one man named Quintus, a Phrygian who had recently arrived from Phrygia, lost his courage when he saw the wild beasts. He was the one who had compelled himself and some others to come forward voluntarily. After much urging, the proconsul persuaded him to swear the oath and offer incense. Therefore, brothers, we do not praise those who hand themselves over, since the Gospel does not teach us to do so.
translation:
  language: ko
  text: 그러나 퀸투스라는 사람이 있었는데, 그는 프리기아 사람으로서 얼마 전에 프리기아에서 온 사람이었습니다. 그는 맹수들을 보자 용기를 잃었습니다. 사실 그는 자신뿐 아니라 몇몇 다른 사람들까지도 자진해서 나서도록 강권했던 사람입니다. 총독은 거듭 권유한 끝에 그를 설득하여 맹세하고 향을 바치게 했습니다. 그러므로 형제자매 여러분, 우리는 스스로 나아가 자신을 넘겨주는 사람들을 칭찬하지 않습니다. 복음은 그렇게 하라고 가르치지 않기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 공개 영역 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 그리스어 원문에 대한 직접 검토가 남아 있습니다.
    reason: 제공된 자료가 그리스어 사본 전승을 지시하지만 실제 그리스어 본문은 제공하지 않았으므로, 번역의 증거 기반과 잠정성을 투명하게 밝혔습니다.
lexical_decisions:
- source_word: Quintus
  choice: 퀸투스
  rationale: 그리스어 전승에 보존된 라틴계 인명을 현대 한국어에서 알아보기 쉽게 음역했습니다.
- source_word: Phrygian ... from Phrygia
  choice: 프리기아 사람으로서 ... 프리기아에서 온
  rationale: 출신 민족·지역을 나타내는 반복을 생략하지 않아 원문의 강조를 보존했습니다.
- source_word: turned coward / lost his courage
  choice: 용기를 잃었습니다
  rationale: 인물에 대한 경멸적 낙인보다 상황 속 두려움과 굴복을 자연스럽고 정확하게 전달합니다.
- source_word: forced / compelled
  choice: 강권했던
  rationale: 단순히 권유했다기보다 자신과 다른 이들을 억지로라도 자진 출두하게 한 역설적인 뉘앙스를 살렸습니다.
- source_word: proconsul
  choice: 총독
  rationale: 로마의 관직을 일반 독자가 이해하기 쉬운 통용 표현으로 옮겼습니다.
- source_word: swear the oath and offer incense
  choice: 맹세하고 향을 바치게
  rationale: 당국이 요구한 두 행위를 원문처럼 병렬로 보존하되, 대상이 명시되지 않은 점도 그대로 두었습니다.
- source_word: deliver themselves up
  choice: 스스로 나아가 자신을 넘겨주는
  rationale: 자발적으로 당국에 출두하여 순교를 자청한다는 문맥을 드러내면서도 단순한 체포나 배교로 오해되지 않게 했습니다.
theological_decisions:
- issue: 자발적 순교의 평가
  choice: 스스로 나아가 자신을 넘겨주는 사람들을 칭찬하지 않습니다
  alternative: 자수하는 사람들을 칭찬하지 않습니다
  rationale: 본문은 순교 자체를 부정하는 것이 아니라 자발적으로 당국에 자신을 내맡기는 행위를 경계합니다. 이를 교파적 순교론으로 확대하지 않았습니다.
- issue: 복음의 규범적 가르침
  choice: 복음은 그렇게 하라고 가르치지 않기 때문입니다
  alternative: 복음이 그렇게 가르치지 않기 때문입니다
  rationale: ‘그렇게’가 자발적 출두를 가리킴을 분명히 하면서, 복음이 구체적으로 어느 말씀을 뜻하는지는 확정하지 않았습니다.
- issue: 형제 호칭의 포괄성
  choice: 형제자매 여러분
  alternative: 형제 여러분
  rationale: 공동체 전체를 향한 호칭이라는 기능을 현대 한국어로 자연스럽게 전달했습니다. 성별에 관한 별도의 교리적 주장을 본문에 부가하지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 순교 문헌의 엄숙함은 유지하되 고어체와 과도한 직역은 피했습니다. 문장을 적절히 나누어 일반 독자가 사건의 인과관계를 쉽게 따라갈 수 있게 했습니다.
