review_pass:
  verdict: revise
  source_fidelity: 수신 대상을 ‘형제 공동체’로 한정한 것은 제공된 영어 증거의 brotherhoods에는 대응하지만, 그 배후의 그리스어 전승에서 통상 확인되는 παροικίαι(각 지역의 교회 공동체/교구 공동체)와는 잘 맞지 않습니다. 성별을 특정하지 않는 ‘모든 공동체’가 원문의 집합적·지역적 뜻을 더 안전하게 보존합니다. 발신자·수신자 공식과 ‘자비, 평화, 사랑’의 축원은 유지됩니다.
  naturalness: ‘나그네로 머무는’은 의미상 가능하나 반복될 때 다소 경직됩니다. ‘나그네로 살아가는’은 παροικεῖν의 타향 체류 이미지를 유지하면서 현대 한국어에서 더 자연스럽습니다. 축원은 ‘더하여지기를 빕니다’로 옮기면 원문의 수동 축원형과 격조 있는 합쇼체에 더 가깝습니다.
  terminology: ‘거룩하고 보편적인 교회’는 καθολική의 보편성에 적절하며 특정 교파 명칭을 부당하게 도입하지 않습니다. ‘하나님의 교회’와 ‘우리 주 예수 그리스도’도 유지하는 것이 적절합니다.
