    rationale: 제공된 영어 증거에는 brotherhoods가 있으나, 그리스어 본문 전승의 통상적 표현은 각처의 ‘공동체들/교회 공동체들’을 뜻합니다. ‘형제’로 성별·집단을 한정하지 않고 ‘모든 공동체’로 옮겨야 원문 전승 및 의미 범위를 더 잘 보존합니다.
