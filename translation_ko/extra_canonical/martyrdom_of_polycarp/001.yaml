base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/001.yaml
  text: 'The church of God living as foreigners in Smyrna, to the church of God living as foreigners in Philomelium, and to all the communities of brothers and sisters belonging to the holy and universal church living as foreigners in every place: May mercy, peace, and love from God the Father and our Lord Jesus Christ be multiplied to you.'
translation:
  language: ko
  text: 스미르나에서 나그네로 살아가는 하나님의 교회가 필로멜리온에서 나그네로 살아가는 하나님의 교회와, 거룩하고 보편적인 교회에 속하여 어느 곳에서나 나그네로 살아가는 모든 공동체에 문안드립니다. 하나님 아버지와 우리 주 예수 그리스도에게서 오는 자비와 평화와 사랑이 여러분에게 더하여지기를 빕니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통에 대한 직접 검토가 아직 필요합니다.
    reason: 현재 제공된 자료의 직접적인 번역 근거가 공용 영어 번역 증거임을 밝히고, 그리스어 사본 전통에 대한 검토가 보류되어 있음을 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: sojourneth
  choice: 나그네로 머무는
  rationale: 교회가 세상에서 임시 체류자 또는 타향살이하는 존재라는 고대 그리스도교적 뉘앙스를 보존하면서도 현대 독자가 이해할 수 있게 옮겼습니다.
- source_word: brotherhoods
  choice: 형제 공동체
  rationale: 단순히 남성 개인들만이 아니라 신자들의 공동체를 가리키는 집합적 표현으로 이해하여 자연스럽게 옮겼습니다.
- source_word: holy and universal Church
  choice: 거룩하고 보편적인 교회
  rationale: ‘universal’의 일반적 의미를 살리고, 후대의 특정 교파 명칭으로 오해될 수 있는 표현은 피했습니다.
- source_word: be multiplied
  choice: 더욱 풍성해지기를 바랍니다
  rationale: 서신 인사말의 기원적 의미와 축원의 어조를 자연스러운 현대 한국어 합쇼체로 표현했습니다.
theological_decisions:
- issue: ‘universal Church’의 번역
  choice: 보편적인 교회
  alternative: 가톨릭 교회
  rationale: 여기서는 모든 지역에 퍼져 있는 전체 교회를 뜻하는 보편성을 나타내므로, 후대의 특정 교파를 지칭하는 듯한 인상을 피했습니다.
- issue: 교회의 ‘sojourning’ 이미지
  choice: 나그네로 머무는
  alternative: 거주하는
  rationale: 단순한 지리적 거주 이상으로 세상에서 타향살이하는 공동체라는 신학적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 고대 서신의 발신자·수신자 공식과 축원 형식을 살리되, 지나치게 고어적인 표현은 피했습니다.
