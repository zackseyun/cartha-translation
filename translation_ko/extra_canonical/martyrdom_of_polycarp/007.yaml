review_pass:
  verdict: revise
  source_fidelity: 전반적인 사건 전개와 대조는 영어 증언에 충실합니다. 그러나 ‘고문을 견디지 못하고’는 원문의 ‘고문 아래서 자백했다’보다 심리적·인과적 내용을 덧붙이며, ‘그리스도와 함께 고난에 참여하여’는 ‘그리스도와 함께 참여하는 자가 되어’라는 압축된 표현을 고난으로 특정합니다. 제공된 영어 증언 및 그리스어 직접 검토 보류 상태에서는 이 특정화를 피하는 편이 안전합니다.
  naturalness: 합쇼체 문체는 대체로 자연스럽습니다. 다만 ‘들이닥쳤습니다’는 급습·난입의 뉘앙스를 더하며, 마지막 문장은 헤롯의 의도와 서술자의 신학적 결과 진술을 혼동할 수 있어 문장 구조를 조금 더 가깝게 다듬는 것이 좋습니다.
  terminology: ‘농장’, ‘어린 종’, ‘치안대장’, ‘경기장’, ‘정해진 몫’은 잠정 번역으로 적절합니다. ‘그리스도와 함께 고난에 참여’는 순교 문맥에는 어울리지만 원문의 참여 언어를 해석적으로 한정하므로 ‘그리스도와 함께 참여하는 이’로 보존하고 각주에서 설명합니다.
  issues:
  - severity: medium
    issue: ‘고문을 견디지 못하고 실토했습니다’가 원문 이상의 내용을 보탭니다.
    rationale: 영어 증언은 단지 한 사람이 ‘under torture’ 자백했다고 말합니다. 자백의 원인을 ‘견디지 못함’으로 단정하지 않는 것이 좋습니다.
  - severity: medium
    issue: ‘그리스도와 함께 고난에 참여하여’가 참여의 대상을 특정합니다.
    rationale: 영어 증언의 ‘being made a partaker with Christ’는 그리스도와의 참여를 말하지만 그 참여를 명시적으로 ‘고난’이라고 한정하지 않습니다. 순교 문맥의 함의는 각주로 설명할 수 있습니다.
  - severity: low
    issue: ‘들이닥쳤습니다’와 ‘서둘렀습니다’가 원문의 중립적 서술보다 강한 뉘앙스를 냅니다.
    rationale: ‘came up’과 ‘was eager’에는 도착과 열의가 있으나 반드시 난입 또는 성급함을 뜻하지는 않습니다.
  revised_text: '그를 찾는 사람들이 계속 찾아다니자, 그는 다른 농장으로 옮겨 갔습니다. 곧 그를 찾던 사람들이 그곳에 이르렀습니다. 그들은 그를 찾지 못하자 어린 종 두 명을 붙잡았고, 그중 한 명은 고문을 받는 가운데 자백했습니다.


    그를 배반한 바로 그 사람들이 그의 집안사람들이었으므로, 그가 숨어 있는 것은 불가능했습니다. 마침 헤롯이라는 이름을 가진 치안대장은 그를 경기장으로 데려가기를 간절히 바랐습니다. 이는 폴리카르포스가 그리스도와 함께 참여하는 이가 되어 자신에게 정해진 몫을 이루고, 반면 그를 배반한 자들은 유다 자신이 받은 형벌을 받게 하려는 것이었습니다.[a]'
  revised_footnotes:
  - marker: a
    text: ‘그리스도와 함께 참여하는 이’는 직역에 가까운 표현입니다. 순교 문맥은 그리스도와의 연대와 참여를 시사하지만, 본문은 그 참여의 대상을 명시적으로 ‘고난’이라고 한정하지 않습니다. 또한 ‘유다 자신이 받은 형벌’은 배반자들을 가룟 유다와 대조하는 표현이며, 형벌의 구체적 성격은 밝히지 않습니다.
    reason: 압축된 참여 표현과 유다에 대한 대조를 보존하면서, 본문에 없는 신학적 세부 규정을 피하기 위해서입니다.
  revision_rationale: 영어 증언의 의미 범위를 넘는 심리적·신학적 보충을 제거하고, 도착 및 열망을 더 중립적으로 옮겼습니다. 헤롯이 폴리카르포스를 경기장으로 데려가고자 했다는 문장 구조와, 폴리카르포스 및 배반자들에게 대비되어 제시되는 결과를 유지했습니다.
