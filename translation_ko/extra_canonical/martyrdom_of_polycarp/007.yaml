source:
  text: 'And as those that were in search of him persisted, he departed to another farm; and forthwith they that were in search of him came up; and not finding him, they seized two slave lads, one of whom confessed under torture;


    for it was impossible for him to lie concealed, seeing that the very persons who betrayed him were people of his own household. And the captain of the police, who chanced to have the very name, being called Herod, was eager to bring him into the stadium, that he himself might fulfill his appointed lot, being made a partaker with Christ, while they--his betrayers--underwent the punishment of Judas himself.'
  text_scope: public_domain_english_witness
  manuscript: Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xi.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'And as those that were in search of him persisted, he departed to another farm; and forthwith they that were in search of him came up; and not finding him, they seized two slave lads, one of whom confessed under torture;


    for it was impossible for him to lie concealed, seeing that the very persons who betrayed him were people of his own household. And the captain of the police, who chanced to have the very name, being called Herod, was eager to bring him into the stadium, that he himself might fulfill his appointed lot, being made a partaker with Christ, while they--his betrayers--underwent the punishment of Judas himself.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/007.yaml
  text: 'Those who were searching for him persisted, so he left for another farm. Immediately, those searching for him arrived. When they did not find him, they seized two young slaves, one of whom confessed under torture;


    for it was impossible for him to remain hidden, since the very people who betrayed him were members of his own household. The police captain, who happened to bear the name Herod, was eager to bring him into the stadium, so that he might fulfill his appointed lot by becoming a fellow participant with Christ, while they—his betrayers—underwent the punishment of Judas himself.'
translation:
  language: ko
  text: '그를 찾는 자들이 끈질기게 추적하자, 그는 다른 농장으로 옮겨 갔습니다. 그러자 곧 그를 찾던 자들이 들이닥쳤습니다. 그들은 그를 찾지 못하자 어린 종 두 명을 붙잡았고, 그중 한 명이 고문을 견디지 못하고 실토했습니다.


    그를 배반한 자들이 바로 그의 집안사람들이었으므로, 그가 계속 숨어 있는 것은 불가능했습니다. 마침 헤롯이라는 이름을 가진 치안대장은 그를 경기장으로 끌고 가려고 서둘렀습니다. 이는 폴리카르포스가 그리스도와 함께 고난에 참여하여 자신에게 정해진 몫을 이루고, 그를 배반한 자들은 유다 자신이 받은 형벌을 받게 하려는 것이었습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 폴리카르포스가 ‘그리스도와 함께 참여하는 자’가 되어 자신에게 정해진 몫을 이루는 한편, 배반자들은 ‘유다 자신의 형벌’을 받는다고 대조합니다. 여기서는 순교 문맥을 밝혀 ‘그리스도와 함께 고난에 참여하여’로 옮겼습니다.
    reason: 압축된 참여 언어와 목적절의 신학적 대조를 독단적으로 좁히지 않고 설명하기 위해서입니다.
lexical_decisions:
- source_word: farm (ἀγρίδιον, source reconstruction subject to direct review)
  choice: 농장
  rationale: 피신처로 쓰인 농촌의 소유지라는 문맥을 평이하고 구체적으로 전달합니다.
- source_word: slave lads
  choice: 어린 종
  rationale: 신분과 연령을 모두 드러내되, 현대 한국어에서 지나치게 거친 표현은 피했습니다.
- source_word: captain of the police
  choice: 치안대장
  rationale: 체포를 지휘하는 관리라는 기능을 자연스럽게 나타내며, 현대의 특정 경찰 계급과 동일시하지 않습니다.
- source_word: stadium
  choice: 경기장
  rationale: 공적 심문과 처형이 이루어진 고대의 경기장을 현대 독자가 곧바로 이해할 수 있게 옮겼습니다.
- source_word: appointed lot
  choice: 자신에게 정해진 몫
  rationale: 운명론적으로 단정하지 않으면서, 그에게 배정되거나 예정된 역할·결말이라는 비유를 보존합니다.
- source_word: partaker with Christ
  choice: 그리스도와 함께 고난에 참여하여
  rationale: 순교 문맥에서 참여의 대상을 드러내 자연스럽게 읽히도록 했으나, 원문의 압축된 신학적 표현은 각주에서 밝혔습니다.
theological_decisions:
- issue: 그리스도와 함께 참여한다는 표현의 대상
  choice: 그리스도와 함께 고난에 참여하여
  alternative: 그리스도와 함께 참여하는 자가 되어
  rationale: 문맥상 순교의 고난에 동참한다는 뜻이 강하지만, 원문 표현 자체가 더 압축적일 가능성을 고려해 각주로 직역을 제시했습니다.
- issue: 목적절의 주체와 섭리적 의미
  choice: 폴리카르포스가 정해진 몫을 이루고 배반자들이 형벌을 받게 되는 대조를 유지
  alternative: 헤롯이 의도적으로 이 두 결과를 이루려 했다고 번역
  rationale: 문장의 목적 구조를 보존하되, 헤롯 개인의 신학적 의도라기보다 서술자가 사건의 결과를 섭리적으로 해석하는 문맥으로 읽히도록 인명을 명시했습니다.
- issue: 유다의 형벌
  choice: 유다 자신이 받은 형벌
  alternative: 유다와 같은 형벌
  rationale: 배반자들과 가룟 유다의 대응을 강하게 제시하는 원문의 표현을 보존하면서도 형벌의 구체적 성격은 규정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교 문헌의 엄숙함을 유지하되 문장은 일반 독자가 쉽게 따라갈 수 있도록 정돈했습니다. 제공된 자료가 영어 공개 번역 증언이며 그리스어 직접 검토가 아직 남아 있으므로, 그리스어 어휘에 관한 판단은 잠정적입니다.
