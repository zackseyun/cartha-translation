base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/013.yaml
  text: 'As he said these things and much more, he was filled with courage and joy, and his face was full of grace. Far from falling in dismay at what was said to him, he astonished the proconsul. The proconsul sent his own herald to proclaim three times in the middle of the stadium, “Polycarp has confessed that he is a Christian.”


    When the herald proclaimed this, the whole crowd of Gentiles and Jews living in Smyrna cried out with uncontrollable rage and a loud shout, “This is the teacher of Asia, the father of the Christians, the destroyer of our gods, who teaches many not to sacrifice or worship.” As they said these things, they shouted loudly and asked Philip the Asiarch to release a lion on Polycarp. But he said that he was not permitted to do so, since he had brought the games to an end.


    Then they all agreed to shout that Polycarp should be burned alive. For the vision concerning his pillow had to be fulfilled. He had seen it on fire while he was praying, and he turned and said prophetically to the faithful who were with him, “I must be burned alive.”'
translation:
  language: ko
  text: '이 말과 그 밖의 많은 말을 하는 동안, 폴리카르포스는 용기와 기쁨으로 충만해졌고 그의 얼굴은 은혜로 가득 찼습니다. 그는 자신에게 들려온 말에 낙담하여 얼굴빛이 어두워지기는커녕, 오히려 속주 총독을 놀라게 했습니다. 총독은 자기 전령을 보내 경기장 한가운데서 세 번 이렇게 선포하게 했습니다. “폴리카르포스가 자신은 그리스도인이라고 고백했다!”


    전령이 이렇게 선포하자, 스미르나에 사는 이방인들과 유대인들로 이루어진 온 군중은 걷잡을 수 없는 분노에 휩싸여 큰 소리로 외쳤습니다. “이자는 아시아[a]의 교사요, 그리스도인들의 아버지이며, 우리 신들을 무너뜨리는 자다. 많은 사람에게 제물을 바치지도 말고 경배하지도 말라고 가르치는 자다!” 그들은 이렇게 말하며 큰 소리로 외치고, 아시아르크[b] 필리포스에게 사자를 풀어 폴리카르포스에게 보내 달라고 요구했습니다. 그러나 필리포스는 경기를 이미 끝냈으므로 그렇게 하는 것은 허용되지 않는다고 말했습니다.


    그러자 그들은 모두 한목소리로 폴리카르포스를 산 채로 불태우라고 외쳤습니다. 그의 베개에 관한 환상의 내용이 이루어져야 했기 때문입니다. 그는 기도하던 중 자기 베개가 불타는 것을 보았고, 몸을 돌려 곁에 있던 신자들에게 예언하듯 말했습니다. “나는 산 채로 불태워져야 합니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 여기서 ‘아시아’는 오늘날의 대륙 전체가 아니라 로마 제국의 아시아 속주를 가리킵니다.
    reason: 현대 독자가 지리적 범위를 오해하지 않도록 역사적 의미를 밝힙니다.
  - marker: b
    text: ‘아시아르크’는 로마령 아시아에서 황제 숭배와 공공 축제·경기 운영에 관여하던 고위 인사에게 쓰인 칭호입니다.
    reason: 고대 관직명을 음역하여 보존하면서 그 기능을 설명합니다.
lexical_decisions:
- source_word: θάρσος / χαρά
  choice: 용기 / 기쁨
  rationale: 폴리카르포스의 담대함과 내적 기쁨을 자연스럽고 직접적으로 나타냅니다.
- source_word: χάρις
  choice: 은혜
  rationale: 얼굴에 드러난 호의로움이나 아름다움이라는 뉘앙스도 가능하지만, 초기 그리스도교 문맥의 신학적 울림을 보존하기 위해 ‘은혜’를 택했습니다.
- source_word: ἀνθύπατος
  choice: 속주 총독
  rationale: 로마 원로원 속주의 총독을 가리키는 관직명으로, 일반 독자가 이해할 수 있도록 기능을 드러냈습니다.
- source_word: Ἀσιάρχης
  choice: 아시아르크
  rationale: 로마령 아시아의 종교·공공 경기와 관련된 고위 관직의 고유성을 보존하고 각주로 설명했습니다.
- source_word: προσκυνέω
  choice: 경배하다
  rationale: 단순한 존경보다 신들에게 행하는 종교적 예배 행위를 나타냅니다.
- source_word: δεῖ
  choice: ~해야 합니다 / ~해야 했기 때문입니다
  rationale: 환상의 성취에 따르는 필연성을 보존하되, 그 필연성의 정확한 신학적 성격을 덧붙여 해석하지 않았습니다.
theological_decisions:
- issue: 폴리카르포스의 얼굴을 채운 χάρις의 의미
  choice: ‘은혜로 가득 찼습니다’로 번역
  alternative: ‘기품으로 가득 찼습니다’ 또는 ‘은총으로 가득 찼습니다’
  rationale: 신적 은혜와 외적으로 드러난 온화한 기품 사이의 의미 긴장을 해소하지 않고 익숙한 그리스도교 용어로 남겼습니다.
- issue: 환상이 ‘이루어져야’ 한다는 필연성
  choice: 본문의 필연적 표현을 그대로 유지
  alternative: ‘환상이 그대로 이루어졌습니다’처럼 결과 중심으로 완화
  rationale: 신적 섭리, 예언적 필연성, 서사적 성취 가운데 하나로 단정하지 않고 원문의 긴장을 보존했습니다.
- issue: 군중이 폴리카르포스를 ‘그리스도인들의 아버지’라고 부르는 표현
  choice: ‘그리스도인들의 아버지’로 직역
  alternative: ‘그리스도인들의 지도자’
  rationale: 군중의 적대적인 호칭이면서 공동체 안에서 그의 역할을 암시하는 원문의 가족적 은유를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 읽기 쉽게 다듬되 군중의 격앙된 외침과 순교 서사의 엄숙함을 유지했습니다. 인명은 그리스어 형태에 가까운 ‘폴리카르포스’, ‘필리포스’를 사용했습니다. 제공 자료가 직접 그리스어 대조 검토 전 단계라고 밝히고 있으므로, 현존 그리스어 전승에서 확인되는 핵심 어휘와 공개 영역 영어 증언을 함께 고려한 출판 초안입니다.
