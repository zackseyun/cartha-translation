translation:
  language: ko
  text: '이 일은 말로 다 설명하기도 어려울 만큼 매우 빠르게 진행되었습니다. 군중은 곧바로 작업장과 목욕탕에서 장작과 잔가지를 모아 왔고, 유대인들은 늘 하던 대로 특히 열심히 이 일을 거들었습니다.[a]


    장작더미가 준비되자 폴리카르포스는 겉옷을 모두 벗고 허리띠를 풀었습니다. 그리고 신도들이 언제나 앞다투어 그의 몸에 먼저 손을 대려고 했기 때문에 전에는 직접 신발을 벗을 일이 없었지만, 이제는 신발도 벗으려 했습니다. 그는 백발이 되기 전부터 거룩한 삶으로 말미암아 모든 존경을 받아 왔던 것입니다.[b]


    곧이어 그들은 장작더미에 쓰려고 준비한 도구들을 그의 둘레에 놓았습니다. 그들이 그를 말뚝에 못 박으려 하자, 그가 말했습니다. “나를 이대로 두십시오. 내가 불을 견디게 해 주시는 분께서, 여러분이 못으로 고정하지 않아도 장작더미 위에서 움직이지 않고 서 있게 해 주실 것입니다.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “늘 하던 대로”는 이 순교기 저자가 당시 유대인들을 두고 덧붙인 논쟁적 평가입니다. 모든 시대와 지역의 유대인을 사실상 일반화하는 말로 읽어서는 안 됩니다.
    reason: 고대 반유대적 수사로 오용될 위험을 줄이면서 본문의 역사적 표현을 투명하게 보존하기 위해서입니다.
  - marker: b
    text: 이 문장은 신도들이 폴리카르포스를 크게 존경하여 평소에는 앞다투어 그의 신발을 벗겨 주었다는 뜻으로 이해할 수 있습니다. 제공된 영어 증언을 바탕으로 한 잠정 번역이며, 그리스어 본문에 대한 직접 검토가 필요합니다.
    reason: 문장 논리와 대명사 관계가 압축되어 있고, 현재 자료가 영어 번역 증언이므로 해석의 잠정성을 알리기 위해서입니다.
  - marker: c
    text: “장작더미 위에서”는 화형이 이루어질 자리에서라는 뜻입니다. 못은 그가 불길 속에서 움직이거나 달아나지 못하게 말뚝에 고정하려고 사용하려던 것입니다.
    reason: 현대 독자가 화형 절차와 ‘못으로 고정하다’의 관계를 이해하도록 돕기 위해서입니다.
lexical_decisions:
- source_word: timber and faggots
  choice: 장작과 잔가지
  rationale: 화형용으로 모은 굵은 나무와 묶음용 작은 나뭇가지를 자연스러운 현대 한국어로 구별했습니다.
- source_word: all his upper garments
  choice: 겉옷을 모두
  rationale: 몸의 상부에 입는 모든 옷이라는 오해를 피하고, 외투류를 벗었다는 문맥을 간결하게 전달했습니다.
- source_word: the faithful
  choice: 신도들
  rationale: 교회 공동체의 믿는 이들을 가리키는 말로, 현대 독자가 쉽게 이해할 수 있는 표현을 택했습니다.
- source_word: stake
  choice: 말뚝
  rationale: 화형 장작더미 가운데 죄수를 고정하는 기둥을 뜻하므로 ‘말뚝’으로 옮겼습니다.
- source_word: instruments ... prepared for the pile
  choice: 장작더미에 쓰려고 준비한 도구들
  rationale: 제공된 영어 증언 자체가 구체적인 물품을 특정하지 않으므로 모호성을 보존했습니다.
theological_decisions:
- issue: He that hath granted me to endure the fire의 주어
  choice: 내가 불을 견디게 해 주시는 분
  alternative: 하나님께서 내가 불을 견디게 해 주셨으니
  rationale: 신적 주체는 드러내되, 제공된 증언의 우회적 호칭과 미래적 확신을 보존하고 특정 명칭을 본문에 보충하지 않았습니다.
- issue: 유대인들에 대한 일반화 표현
  choice: 늘 하던 대로
  alternative: 그들의 관습대로
  rationale: 불편한 역사적 진술을 삭제하거나 완화해 원문 증언을 바꾸지 않았습니다. 다만 이것이 저자의 논쟁적 평가임을 각주에서 밝혔습니다.
- issue: holy life
  choice: 거룩한 삶
  alternative: 성덕
  rationale: 후대 교파적 전문 용어를 피하면서, 그의 삶이 거룩하다고 평가받았다는 종교적 의미를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 순교 서사의 엄숙함을 유지하되 고어투는 피했습니다. 인용문은 정중하지만 단호한 말투로 옮겼습니다. 제공 자료가 그리스어 원문이 아니라 공용 영역 영어 증언이고 원어 검토가 보류된 상태이므로, 본 초안은 잠정적입니다.
