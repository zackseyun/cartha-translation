id: MPOL.021
reference: Martyrdom of Polycarp — MartPol. 20
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
  text_scope: public_domain_english_witness
  manuscript: Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xi.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Ye indeed required that the things which happened should be shown unto you at greater length: but we for the present have certified you as it were in a summary through our brother Marcianus. When then ye have informed yourselves of these things, send the letter about likewise to the brethren which are farther off, that they also may glorify the Lord, who maketh election from His own servants.


    Now unto Him that is able to bring us all by His grace and bounty unto His eternal kingdom, through His only-begotten Son Jesus Christ, be glory, honor, power, and greatness for ever. Salute all the saints. They that are with us salute you, and Euarestus, who wrote the letter, with his whole house.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/021.yaml
  text: 'You asked for the things that happened to be presented to you at greater length. But for now, we have informed you of them in summary through our brother Marcianus. When you have learned these things, circulate the letter also among the brothers and sisters who are farther away, so that they too may glorify the Lord, who chooses from among his own servants.


    Now to him who is able, by his grace and generosity, to bring us all into his eternal kingdom through his only-begotten Son, Jesus Christ, be glory, honor, power, and greatness forever. Greet all the saints. Those who are with us greet you, as do Euarestus, who wrote the letter, and his whole household.'
translation:
  language: ko
  text: '여러분은 일어난 일들을 더 자세히 알려 달라고 요청하셨습니다. 그러나 지금은 우리 형제 마르키아누스를 통하여 그 일들을 요약하여 알려 드렸습니다. 그러므로 여러분은 이 일들을 알게 된 뒤에 이 편지를 멀리 떨어져 있는 형제자매들에게도 전해 주십시오. 그들도 자기 종들 가운데서 택하시는 주님께 영광을 돌리게 하려는 것입니다.


    이제 자신의 은혜와 선물로, 자신의 독생자 예수 그리스도를 통하여 우리 모두를 자신의 영원한 나라로 이끌어 들이실 수 있는 분께 영광과 존귀와 권능과 위엄이 영원토록 있기를 빕니다. 모든 성도에게 문안해 주십시오. 우리와 함께 있는 이들이 여러분에게 문안하며, 이 편지를 기록한 에우아레스투스와 그의 온 집안도 문안합니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: certified / informed
  choice: 알려 드렸습니다
  rationale: 현재 제공된 영어 증언의 뜻을 자연스러운 현대 한국어로 전달하면서, 단순한 통보보다 내용을 확인하여 전한다는 문맥을 살렸습니다.
- source_word: send the letter about
  choice: 이 편지를 … 돌려 보내 주십시오
  rationale: 편지를 여러 공동체에 회람하라는 의미가 드러나도록 번역했습니다.
- source_word: brethren
  choice: 형제자매들
  rationale: 공동체 구성원 전체를 가리키는 포괄적 용례로 이해하여 현대 한국어 독자가 오해하지 않도록 표현했습니다.
- source_word: maketh election from His own servants
  choice: 자기 종들 가운데서 택하시는
  rationale: 선택 행위와 그 범위를 모두 보존하고, 무엇을 위해 택하는지는 본문이 명시하지 않으므로 덧붙이지 않았습니다.
- source_word: bounty
  choice: 관대하심
  rationale: 은혜와 병렬되는 풍성한 베풂의 성격을 자연스럽게 나타냈습니다.
- source_word: only-begotten Son
  choice: 독생자
  rationale: 초기 그리스도교 문헌의 전통적 신학 용어를 유지하되 추가 해석은 넣지 않았습니다.
- source_word: saints
  choice: 성도
  rationale: 그리스도인 공동체 구성원을 지칭하는 정착된 한국어 표현을 사용했습니다.
- source_word: house
  choice: 온 집안
  rationale: 가족만이 아니라 가구에 속한 이들을 포함할 수 있는 원문의 폭을 비교적 잘 보존합니다.
theological_decisions:
- issue: 주님이 ‘자기 종들 가운데서 택하신다’는 말의 대상과 목적
  choice: 본문의 표현만 보존하고 대상의 정체나 선택의 목적을 명시하지 않음
  alternative: 순교자를 택하신다는 뜻으로 구체화
  rationale: 현재 증언은 선택의 대상이나 목적을 분명히 한정하지 않으므로 신학적 긴장을 그대로 두었습니다.
- issue: 영원한 나라로 들어가게 하는 주체와 수단
  choice: 하나님이 은혜와 관대하심으로 독생자 예수 그리스도를 통하여 이끄신다는 구조를 유지
  alternative: 예수 그리스도가 직접 데려가신다고 재구성
  rationale: 송영문의 문법적·신학적 관계를 가능한 한 그대로 보존했습니다.
- issue: ‘독생자’의 의미
  choice: 전통 용어 ‘독생자’를 사용
  alternative: 유일한 아들
  rationale: 고대 문헌의 신학적 어감을 보존하면서도, 직접 그리스어 대조가 미완료된 상태에서 의미를 한쪽으로 좁히지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 공동체 서신과 송영문의 품위를 유지하되 고어체는 피했습니다. 제공 자료가 공공 영역 영어 증언에 근거하고 그리스어 원문 대조가 아직 이루어지지 않았으므로, 번역은 잠정적이며 원문 검토 후 인명 표기와 핵심 어휘를 재확인해야 합니다.
