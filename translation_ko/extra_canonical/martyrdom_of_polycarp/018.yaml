base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/018.yaml
  text: 'But the jealous and envious Evil One, the adversary of the family of the righteous, had seen the greatness of his martyrdom, his blameless life from the beginning, how he was crowned with the crown of immortality, and how he had won a reward that no one could deny. So he arranged that not even his poor body would be taken away by us, although many desired to do this and to touch his holy flesh.


    So he put forward Nicetes, the father of Herod and brother of Alce, to plead with the magistrate not to release his body, “lest,” as it was said, “they abandon the crucified one and begin to worship this man.” This was done at the instigation and urgent entreaty of the Jews, who also kept watch when we were about to take it from the fire. They did not know that it will be impossible for us either ever to forsake the Christ who suffered for the salvation of the whole world of those who are saved—though faultless, he suffered for sinners—or to worship anyone else.


    For we adore him because he is the Son of God, but we cherish the martyrs, as disciples and imitators of the Lord, as they deserve because of their matchless affection for their own King and Teacher. May it also be our lot to be found partakers and fellow disciples with them.'
translation:
  language: ko
  text: '그러나 의로운 이들의 가문을 대적하는 자, 곧 시기하고 질투하는 악한 자는 폴리카르포스의 순교가 얼마나 위대한지, 그가 처음부터 얼마나 흠 없이 살아왔는지, 또 불멸의 면류관을 쓰고 아무도 부인할 수 없는 상을 받은 것을 보았습니다. 그래서 많은 사람이 그의 시신을 거두어 그 거룩한 몸에 손을 대고 싶어 했는데도, 악한 자는 우리가 그의 가련한 시신조차 거두지 못하게 일을 꾸몄습니다.


    그리하여 악한 자는 헤로데의 아버지이며 알케의 형제인 니케테스를 내세워, 행정관에게 그의 시신을 내주지 말라고 간청하게 했습니다. 사람들이 말하기를, “그들이 십자가에 못 박히신 분을 버리고 이 사람을 예배하기 시작할까 염려됩니다”라고 했습니다. 이 일은 유대인들이 부추기고 끈질기게 간청하여 벌어진 것입니다. 그들은 우리가 불 속에서 시신을 꺼내려 할 때에도 지켜보고 있었습니다. 그러나 그들은 우리가 구원받는 온 세상의 구원을 위해 고난받으신 그리스도, 곧 아무 잘못이 없으면서도 죄인들을 위해 고난받으신 그리스도를 결코 버릴 수 없으며, 다른 누구도 예배할 수 없다는 것을 알지 못했습니다.


    우리는 그분이 하나님의 아들이시므로 그분을 예배합니다. 그러나 순교자들은 주님의 제자이며 본받는 이들이므로, 자기들의 왕이며 스승이신 분을 향한 비할 데 없는 사랑에 합당하게 귀히 여깁니다. 우리도 그들과 함께 참여하는 이들, 함께 배우는 제자들로 인정받기를 바랍니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Evil One
  choice: 악한 자
  rationale: 인격적 대적자를 가리키는 칭호의 성격을 살리면서 현대 한국어에서 자연스럽게 옮겼습니다.
- source_word: family of the righteous
  choice: 의로운 이들의 가문
  rationale: 집단적 연대와 소속을 나타내는 ‘family’의 비유를 해소하지 않고 보존했습니다.
- source_word: martyrdom
  choice: 순교
  rationale: 죽음의 증언이라는 초기 그리스도교 문맥에서 정착된 한국어 용어를 사용했습니다.
- source_word: poor body
  choice: 가련한 시신
  rationale: 죽은 몸을 뜻하는 문맥과 연민의 뉘앙스를 함께 나타냈습니다.
- source_word: holy flesh
  choice: 거룩한 몸
  rationale: ‘살’이라는 직역이 현대 한국어에서 불필요하게 육질적 인상을 줄 수 있어, 신체를 뜻하는 자연스러운 표현을 택했습니다.
- source_word: adore / worship
  choice: 예배하다
  rationale: 하나님께만 드리는 종교적 경배를 일관되게 표현하여 순교자를 귀히 여기는 행위와 구별했습니다.
- source_word: cherish
  choice: 귀히 여기다
  rationale: 순교자에 대한 존경과 애정을 나타내되, 예배와 혼동되지 않도록 했습니다.
- source_word: partakers and fellow-disciples
  choice: 함께 참여하는 이들, 함께 배우는 제자들
  rationale: 두 표현을 합치지 않고 각각의 공동 참여와 제자도 의미를 보존했습니다.
theological_decisions:
- issue: 그리스도께 드리는 예배와 순교자 존중의 구별
  choice: 그리스도는 ‘예배’하고 순교자는 ‘귀히 여긴다’로 명확히 구별했습니다.
  alternative: 두 동사를 모두 ‘경배하다’ 또는 ‘존경하다’로 평준화할 수 있습니다.
  rationale: 본문 자체가 두 대상에 대한 태도를 의도적으로 구별하므로 그 신학적 대비를 보존했습니다.
- issue: ‘구원받는 이들의 온 세상’이라는 제한적·난해한 표현
  choice: ‘구원받는 온 세상의 구원’으로 구조를 최대한 보존했습니다.
  alternative: ‘온 세상의 구원’으로 단순화할 수 있습니다.
  rationale: 원문 검토가 미완료인 상태에서 보편성과 ‘구원받는 이들’의 범위 사이에 있는 긴장을 임의로 제거하지 않았습니다.
- issue: 순교자들의 거룩함
  choice: ‘거룩한 몸’을 본문에 유지했습니다.
  alternative: ‘존귀한 몸’으로 약화할 수 있습니다.
  rationale: 초기 그리스도교 공동체가 순교자의 몸에 부여한 성별의 언어를 교파적 해석 없이 그대로 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 고유명사는 폴리카르포스, 헤로데, 알케, 니케테스로 음역했습니다. 제공된 자료가 공공 영역 영어 번역 증언이며 그리스어 직접 검토가 보류 중이므로, 문장 구조와 신학적 긴장을 과도하게 확정하지 않는 잠정적 번역으로 작성했습니다.
