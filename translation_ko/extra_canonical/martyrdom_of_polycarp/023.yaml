  revised_text: '형제 여러분, 복음에 따른 예수 그리스도의 말씀을 따라 살아가시는 여러분에게 평안이 있기를 빕니다. 그분과 함께, 하나님께서 택하신 거룩한 이들의 구원을 위하여 하나님께 영광이 있기를 빕니다. 복된 폴리카르포스가 순교한 것처럼, 우리도 그의 발자취를 따라 예수 그리스도의 나라에서 발견되기를 빕니다.



