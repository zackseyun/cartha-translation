  text: 'We bid you God speed, brethren, while you walk by the word of Jesus Christ which is according to the Gospel; with whom be glory to God for the salvation of his holy elect; even as the blessed Polycarp suffered martyrdom, in whose footsteps may it be our lot to be found in the kingdom of Jesus Christ.


    This account Gaius copied from the papers of Irenaeus, a disciple of Polycarp. The same also lived with Irenaeus.


    And I, Socrates, wrote it down in Corinth from the copy of Gaius. Grace be with all men.


    And I, Pionius, again wrote it down from the aforementioned copy, having searched it out (for the blessed Polycarp showed me in a revelation, as I will declare in the sequel), gathering it together when it was now well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Holy Spirit for ever and ever. Amen.


    The three preceding paragraphs as read in the Moscow manuscript: This account Gaius copied from the papers of Irenaeus. The same lived with Irenaeus, who had been a disciple of the holy Polycarp. For this Irenaeus, being in Rome at the time of the martyrdom of the bishop Polycarp, instructed many; and many most excellent and orthodox treatises by him are in circulation. In these he makes mention of Polycarp, saying that he was taught by him. And he ably refuted every heresy, and handed down the catholic rule of the Church just as he had received it from the saint. He mentions this fact also, that when Marcion, after whom the Marcionites are called, met the holy Polycarp on one occasion, and said, “Recognize us, Polycarp,” he said in reply to Marcion, “Yes indeed, I recognize the firstborn of Satan.” The following statement also is made in the writings of Irenaeus, that on the very day and hour when Polycarp was martyred in Smyrna, Irenaeus, being in the city of the Romans, heard a voice
    as of a trumpet saying, “Polycarp is martyred.”


    From these papers of Irenaeus then, as has been stated already, Gaius made a copy, and from the copy of Gaius Isocrates made another in Corinth.


    And I, Pionius, again wrote it down from the copy of Isocrates, having searched for it in obedience to a revelation of the holy Polycarp, gathering it together when it was well nigh worn out by age, that the Lord Jesus Christ may gather me also with his elect into his heavenly kingdom; to whom be the glory with the Father and the Son and the Holy Spirit for ever and ever. Amen.'
translation:
  language: ko
  text: '형제 여러분, 복음에 따른 예수 그리스도의 말씀을 따라 살아가는 여러분이 평안하기를 빕니다. 그분을 통하여, 거룩한 택하신 이들을 구원하신 하나님께 영광이 있기를 빕니다. 복된 폴리카르포스가 순교한 것처럼, 우리도 그의 발자취를 따라 예수 그리스도의 나라에서 발견되기를 빕니다.


    이 기록은 폴리카르포스의 제자 이레나이오스의 문서에서 가이오스가 베껴 쓴 것입니다. 가이오스 자신도 이레나이오스와 함께 지냈습니다.


    그리고 나 소크라테스는 가이오스의 사본을 보고 코린토스에서 이것을 옮겨 적었습니다. 모든 사람에게 은혜가 있기를 빕니다.


    그리고 나 피오니오스는 앞서 말한 사본을 찾아내어 다시 옮겨 적었습니다. 복된 폴리카르포스가 계시 가운데 내게 보여 주었기 때문이며, 이에 관해서는 뒤에서 밝히겠습니다. 나는 세월이 흘러 거의 닳아 없어지게 된 이 기록을 모아 복원하였습니다. 이는 주 예수 그리스도께서 나도 그분의 택하신 이들과 함께 그분의 하늘나라로 모아 주시기를 바랐기 때문입니다. 그분께 아버지와 성령과 함께 영원무궁토록 영광이 있기를 빕니다. 아멘.


    [모스크바 사본에는 앞의 세 문단이 다음과 같이 되어 있습니다.][a]


    이 기록은 이레나이오스의 문서에서 가이오스가 베껴 쓴 것입니다. 가이오스는 거룩한 폴리카르포스의 제자였던 이레나이오스와 함께 지냈습니다. 폴리카르포스 주교가 순교할 당시 로마에 있던 이 이레나이오스는 많은 사람을 가르쳤으며, 그가 쓴 매우 훌륭하고 정통적인 논문도 많이 널리 읽히고 있습니다. 그는 그 글들에서 폴리카르포스를 언급하며 자신이 그에게 가르침을 받았다고 말합니다. 또한 그는 모든 이단을 훌륭히 논박하고, 그 성인에게서 받은 그대로 교회의 보편적 신앙 규범을 전해 주었습니다.[b] 그는 다음 일도 기록합니다. 마르키온파라는 이름의 유래가 된 마르키온이 어느 날 거룩한 폴리카르포스를 만나 “폴리카르포스여, 우리를 알아보시오”라고 하자, 폴리카르포스가 마르키온에게 “그렇고말고. 나는 사탄의 맏아들을 알아보오”라고 대답했다는 것입니다. 이레나이오스의 글에는 다음과 같은 말도 있습니다. 폴리카르포스가 스미르나에서 순교한 바로 그날 그 시각에, 로마 도시에 있던 이레나이오스가 나팔 소리 같은 음성을 들었는데, 그 음성은 “폴리카르포스가 순교하였다”라고 말했다는 것입니다.


    그러므로 앞서 말한 대로 가이오스는 이레나이오스의 이 문서들을 베껴 썼고, 이소크라테스는 가이오스의 사본을 보고 코린토스에서 또 하나의 사본을 만들었습니다.[c]


    그리고 나 피오니오스는 거룩한 폴리카르포스의 계시에 순종하여 이 기록을 찾아낸 뒤, 이소크라테스의 사본을 보고 다시 옮겨 적었습니다. 나는 세월이 흘러 거의 닳아 없어지게 된 이 기록을 모아 복원하였습니다. 이는 주 예수 그리스도께서 나도 그분의 택하신 이들과 함께 그분의 하늘나라로 모아 주시기를 바랐기 때문입니다. 그분께 아버지와 아들과 성령과 함께 영원무궁토록 영광이 있기를 빕니다. 아멘.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이하 마지막 세 문단은 모스크바 사본에 전해지는 대체 형태입니다.
    reason: 본문 전승의 차이를 독자가 분명히 구별하도록 합니다.
  - marker: b
    text: 여기서 ‘보편적’은 특정 후대 교파의 명칭이라기보다 온 교회에 공통된다는 뜻입니다.
    reason: ‘catholic’의 역사적 의미에 대한 교파적 오해를 방지합니다.
  - marker: c
    text: 앞 전승에는 ‘소크라테스’로 되어 있으나, 모스크바 사본 형태에는 ‘이소크라테스’로 되어 있습니다.
    reason: 인명에 관한 사본 전승의 차이를 보존하고 설명합니다.
lexical_decisions:
- source_word: God speed
  choice: 평안하기를 빕니다
  rationale: 고어적 작별·축복 표현을 현대 한국어의 품위 있는 축원으로 옮겼습니다.
- source_word: walk
  choice: 살아가다
  rationale: 삶의 행실을 뜻하는 성경적 비유가 한국어에서 자연스럽게 전달되도록 했습니다.
- source_word: martyrdom / was martyred
  choice: 순교하다 / 순교하였다
  rationale: 초기 그리스도교 문헌의 문맥과 한국어 관용에 맞는 용어를 사용했습니다.
- source_word: catholic rule of the Church
  choice: 교회의 보편적 신앙 규범
  rationale: catholic을 후대 특정 교파명으로 오해하지 않도록 본래의 ‘보편적’ 의미를 드러내고, rule이 신앙의 규범임을 문맥상 밝혔습니다.
- source_word: gathering it together
  choice: 모아 복원하다
  rationale: 노후하여 흩어지거나 훼손된 사본을 수습한 행위를 자연스럽게 표현했습니다.
theological_decisions:
- issue: 첫 문단의 ‘with whom’이 가리키는 대상과 영광의 문법적 관계
  choice: ‘그분을 통하여 … 하나님께 영광’으로 번역
  alternative: ‘그분과 함께 하나님께 영광’ 또는 ‘그분께 영광’
  rationale: 제공된 영어 증거문 자체가 모호하고 그리스어 직접 검토가 보류된 상태이므로, 문맥상 가능한 중개적 의미를 택하되 단정적 교리 확장은 피했습니다.
- issue: ‘holy elect’의 번역
  choice: 거룩한 택하신 이들
  alternative: 거룩한 선택받은 백성
  rationale: 하나님의 선택이라는 원문의 신학적 표현을 유지하면서 집단의 범위를 임의로 한정하지 않았습니다.
- issue: ‘catholic’의 의미
  choice: 보편적
  alternative: 가톨릭
  rationale: 이 문맥에서는 교파 고유명사보다 전체 교회에 공통된 보편성을 나타내는 역사적 의미가 적절합니다.
- issue: 두 결문의 송영 차이
  choice: 첫 전승은 ‘아버지와 성령’, 모스크바 사본 전승은 ‘아버지와 아들과 성령’을 각각 그대로 보존
  alternative: 두 결문을 삼위일체식으로 통일
  rationale: 본문 전승의 실제 차이와 신학적 긴장을 조화시키지 않고 그대로 드러냈습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교 문헌에 맞는 장중함은 유지하되 지나친 한문투와 고어를 피했습니다. 제공 자료가 공공 영역 영어 증거문이며 그리스어 원문 검토가 아직 보류 중이므로, 특히 첫 문단의 대명사 관계와 필사 후기의 세부 표현은 잠정적으로 번역했습니다.
