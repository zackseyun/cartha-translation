    rationale: 뜻은 전달되지만, ‘their’가 가리키는 두려워하던 사람들과 게르마니쿠스의 굳셈의 관계를 ‘두려워하던 이들을 자기 안에 있는 굳건함으로 격려하였다’로 옮기면 더 직접적입니다.
