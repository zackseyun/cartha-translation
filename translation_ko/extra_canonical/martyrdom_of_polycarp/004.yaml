base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/004.yaml
  text: 'But thanks be to God; for He truly prevailed against all. For the most noble Germanicus encouraged their fearfulness through the steadfastness that was in him, and he fought with the wild beasts in a remarkable way. For when the proconsul wished to prevail upon him and bade him have pity on his youth, he used force and dragged the wild beast toward himself, desiring more quickly to obtain a release from their unrighteous and lawless life.


    So after this all the multitude, marvelling at the bravery of the God-beloved and God-fearing people of the Christians, raised a cry: “Away with the atheists! Let search be made for Polycarp.”'
translation:
  language: ko
  text: '그러나 하나님께 감사드립니다. 참으로 그분이 모든 것을 이기셨기 때문입니다. 지극히 고결한 게르마니쿠스는 자기 안에 있는 굳건함으로 두려워하는 이들에게 용기를 북돋아 주었고, 들짐승들과 맞서 빼어나게 싸웠습니다. 총독이 그를 설득하여 젊은 나이를 가엾게 여기라고 명하자, 그는 오히려 힘을 써서 들짐승을 자기 쪽으로 끌어당겼습니다. 불의하고 무법한 자들의 삶에서 더 빨리 풀려나기를 바랐기 때문입니다.[a]


    이 일이 있은 뒤, 온 군중은 하나님께 사랑받고 하나님을 경외하는 그리스도인들의 용기에 놀라 이렇게 외쳤습니다. “무신론자들을 없애라![b] 폴리카르포스를 찾아내라!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘풀려나다’는 여기서 죽음을 통해 불의하고 무법한 이들의 삶에서 벗어나는 것을 가리키는 완곡한 표현입니다. 대명사의 정확한 지시 대상은 문맥상 다소 모호합니다.
    reason: 원문의 완곡법과 대명사 지시의 불확실성을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 당시 이교도들은 제국의 신들을 섬기지 않는 그리스도인들을 ‘무신론자들’이라고 비난했습니다. 여기서는 군중이 그 비난을 그리스도인들에게 돌려 외친 말입니다.
    reason: 현대적 의미의 무신론과 고대의 역사적 비난을 구별하기 위해서입니다.
lexical_decisions:
- source_word: right noble Germanicus
  choice: 지극히 고결한 게르마니쿠스
  rationale: 인물의 높은 품격과 용기를 칭송하는 표현으로 이해하여, 현대 한국어에서 자연스럽고 품위 있게 옮겼습니다.
- source_word: constancy
  choice: 굳건함
  rationale: 박해와 죽음 앞에서도 흔들리지 않는 내적 확고함을 나타냅니다.
- source_word: used violence and dragged the wild beast towards him
  choice: 오히려 힘을 써서 들짐승을 자기 쪽으로 끌어당겼습니다
  rationale: 게르마니쿠스가 맹수와의 죽음을 피하지 않고 적극적으로 맞이한 행동을 원문의 강도에 맞게 표현했습니다.
- source_word: release
  choice: 풀려나기
  rationale: 죽음을 직접 명시하지 않으면서 현세의 악한 삶에서 벗어난다는 원문의 완곡한 표현과 신학적 긴장을 보존했습니다.
- source_word: atheists
  choice: 무신론자들
  rationale: 당시 그리스도인들이 제국의 신들을 인정하지 않는다는 이유로 받은 역사적 비난을 직역하되, 오해를 막기 위해 각주를 달았습니다.
- source_word: Polycarp
  choice: 폴리카르포스
  rationale: 그리스어 이름 Πολύκαρπος에 가까운 한국어 음역을 사용했습니다.
theological_decisions:
- issue: ‘그분이 모든 것을 이기셨다’의 주어와 의미
  choice: 하나님을 가리키는 대명사 ‘그분’을 유지하고 ‘모든 것을 이기셨다’로 번역
  alternative: ‘하나님께서 모든 사람을 이기셨다’ 또는 ‘게르마니쿠스가 모든 고난을 이겼다’
  rationale: 제공된 증거에서 대명사의 지시 대상과 ‘모든’의 범위가 완전히 명시되지 않으므로, 하나님을 받는 문맥은 따르되 목적어의 범위를 확대 해석하지 않았습니다.
- issue: ‘their unrighteous and lawless life’의 지시 대상
  choice: ‘불의하고 무법한 자들의 삶’
  alternative: ‘이 불의하고 무법한 세상살이’ 또는 ‘그들의 불의하고 무법한 삶’
  rationale: 대명사가 박해자들을 가리킬 가능성을 반영하면서도, 죽음을 통한 세상으로부터의 해방이라는 함의를 교리적으로 과도하게 확정하지 않았습니다.
- issue: ‘God-beloved and God-fearing people of the Christians’의 수식 관계
  choice: ‘하나님께 사랑받고 하나님을 경외하는 그리스도인들’
  alternative: ‘하나님을 사랑하고 경외하는 그리스도인들’
  rationale: ‘God-beloved’를 능동적 사랑이 아니라 하나님께 사랑받는 상태로 구별하여 옮겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 순교 서사의 장중함을 유지하되 고어투는 피했습니다. 제공 자료가 공용 영어 번역 증언에 근거하고 그리스어 직접 검토가 보류된 상태이므로, 모호한 대명사와 신학적 함의를 본문과 각주에서 보존했습니다.
