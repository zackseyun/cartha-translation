base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/008.yaml
  text: 'So they took the lad with them, and on Friday, about the supper hour, the gendarmes and horsemen went out with their customary arms, hurrying as though against a robber. Arriving together late in the evening, they found the man himself in bed in an upper chamber of a certain cottage. Although he might have departed from there to another place, he would not, saying, “The will of God be done.”


    When he heard that they had come, he went down and conversed with them. The bystanders marveled at his age and constancy, wondering why there should be such eagerness for the apprehension of an old man like him. Thereupon he immediately gave orders that a table be set for them to eat and drink at that hour, as much as they desired. And he persuaded them to grant him an hour in which he might pray unmolested.


    When they consented, he stood up and prayed, so full of the grace of God that for two hours he could not hold his peace. Those who heard were amazed, and many repented that they had come against such a venerable old man.'
translation:
  language: ko
  text: '그들은 그 소년을 데리고 금요일 저녁 식사 무렵에 길을 나섰습니다. 치안대원들과 기병들은 강도를 잡으러 가기라도 하듯이 평소의 무장을 갖추고 서둘러 갔습니다. 그들은 저녁 늦게 한꺼번에 들이닥쳐 어느 작은 집의 위층 방 침상에 누워 있는 폴리카르포스를 찾아냈습니다. 그는 그곳을 떠나 다른 곳으로 갈 수도 있었지만 그렇게 하지 않고, “하나님의 뜻이 이루어지기를 바랍니다”라고 말했습니다.


    그는 그들이 왔다는 말을 듣고 아래로 내려가 그들과 이야기를 나누었습니다. 곁에 있던 사람들은 그의 고령과 굳건함에 놀랐고, 이처럼 나이 많은 사람 하나를 붙잡으려고 어찌하여 그토록 서두르는지 의아해했습니다. 그러자 그는 곧 사람들에게 명하여 그 시간에도 그들이 원하는 만큼 먹고 마실 수 있도록 상을 차리게 했습니다. 그리고 아무 방해도 받지 않고 기도할 수 있도록 한 시간만 달라고 그들을 설득했습니다.


    그들이 허락하자 그는 일어서서 기도했습니다. 그는 하나님의 은혜로 충만하여 두 시간 동안 말을 그칠 수 없었습니다. 듣고 있던 사람들은 놀랐고, 많은 사람이 이토록 존경할 만한 노인을 잡으러 온 것을 뉘우쳤습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lad
  choice: 소년
  rationale: 앞 문맥에서 체포대가 데려간 젊은 이를 가리키는 일반적 표현으로, 원문 검토가 보류된 상태에서 연령을 지나치게 구체화하지 않았습니다.
- source_word: gendarmes
  choice: 치안대원들
  rationale: 현대적 경찰과 완전히 동일시하지 않으면서 공권력에 속한 체포 인력이라는 기능을 드러냅니다.
- source_word: constancy
  choice: 굳건함
  rationale: 박해 앞에서 흔들리지 않는 태도를 자연스럽게 나타내되 특정 교리 용어로 좁히지 않았습니다.
- source_word: venerable
  choice: 존경할 만한
  rationale: 나이와 인품 때문에 경의를 받을 만하다는 뜻을 현대 한국어로 명료하게 전달합니다.
theological_decisions:
- issue: “The will of God be done”의 양태
  choice: “하나님의 뜻이 이루어지기를 바랍니다”
  alternative: “하나님의 뜻대로 이루어질 것입니다”
  rationale: 기도·수용의 뉘앙스를 보존하고, 단정적 예언으로 해석하지 않았습니다.
- issue: “full of the grace of God”의 관계
  choice: “하나님의 은혜로 충만하여”
  alternative: “하나님의 은혜가 충만하여”
  rationale: 은혜가 기도자를 채운다는 서술을 보존하면서도 그 은혜의 작용 방식을 교리적으로 더 규정하지 않았습니다.
- issue: “repented”의 의미
  choice: “뉘우쳤습니다”
  alternative: “회개했습니다”
  rationale: 문맥상 체포하러 온 행동에 대한 후회를 가리키므로, 구원론적 의미로 과도하게 읽힐 수 있는 ‘회개’를 피했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교 문헌의 품위를 유지하되 고어체를 피하고, 긴 문장을 적절히 나누어 일반 독자가 쉽게 이해하도록 했습니다. 제공 자료가 영어 공공영역 번역 증언이며 그리스어 직접 검토가 보류되어 있으므로, 불확실한 세부를 본문이나 주석에서 단정하지 않았습니다.
