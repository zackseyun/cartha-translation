base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/002.yaml
  text: 'Brethren, we write unto you an account of what befell those who suffered martyrdom, and especially the blessed Polycarp, who stayed the persecution, having, as it were, set his seal upon it by his martyrdom. For nearly all the foregoing events came to pass that the Lord might show us once more an example of martyrdom conformable to the Gospel.


    For he lingered that he might be delivered up, even as the Lord did, to the end that we too might be imitators of him, looking not only to that which concerns ourselves, but also to that which concerns our neighbors. For it is the office of true and steadfast love not only to desire that oneself be saved, but all the brethren also.'
translation:
  language: ko
  text: '형제자매 여러분, 우리는 순교의 고난을 겪은 이들에게 일어난 일, 특히 복된 폴리카르포스에게 일어난 일을 여러분에게 써 보냅니다. 그는 자신의 순교로 박해에 도장을 찍듯이 하여 그 박해를 끝맺었습니다.[a] 앞서 일어난 거의 모든 일은 주님께서 복음에 부합하는 순교의 본을 우리에게 다시 한번 보여 주시려는 것이었습니다.


    그는 주님께서 그러하셨듯이 자신이 넘겨질 때까지 기다렸습니다. 이는 우리도 그를 본받아 자기 일만 돌보지 않고 이웃의 일도 돌보게 하려는 것이었습니다. 참되고 굳건한 사랑은 자기만 구원받기를 바라는 것이 아니라 모든 형제자매도 함께 구원받기를 바라는 것이기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘박해를 끝맺었습니다’에 해당하는 표현은 폴리카르포스가 자신의 순교로 그 박해에 도장을 찍듯 마무리했다는 뜻으로 이해할 수 있습니다. 헬라어 원문에 대한 직접 검토가 아직 필요합니다.
    reason: 제공된 자료가 공용 영어 번역 증언에 기초하며, 해당 구절의 비유와 동사 의미에 원문 검토가 필요한 번역상 불확실성이 있습니다.
lexical_decisions:
- source_word: brethren
  choice: 형제자매 여러분
  rationale: 공동체 전체를 향한 호칭이라는 의미를 현대 표준 한국어에서 자연스럽고 포괄적으로 전달했습니다.
- source_word: suffered martyrdom
  choice: 순교의 고난을 겪은
  rationale: 죽음뿐 아니라 증언을 위해 겪은 고난과 순교 사건을 함께 가리키는 문맥을 살렸습니다.
- source_word: blessed Polycarp
  choice: 복된 폴리카르포스
  rationale: 초기 그리스도교 인물의 이름을 통용되는 헬라어계 음역으로 옮기고, blessed를 교파적으로 과도하게 해석하지 않았습니다.
- source_word: stayed the persecution
  choice: 그 박해를 끝맺었습니다
  rationale: 문맥상 폴리카르포스의 순교가 해당 박해의 절정이자 종결이 되었다는 뜻으로 읽히도록 했습니다. 다만 원문 검토 전의 잠정적 선택임을 각주로 밝혔습니다.
- source_word: conformable to the Gospel
  choice: 복음에 부합하는
  rationale: 순교의 방식이 복음의 모범, 특히 주님의 수난과 일치한다는 관계를 간결하게 보존했습니다.
- source_word: delivered up
  choice: 넘겨질
  rationale: 수난 전승과 연결되는 ‘넘겨주다/넘겨지다’의 함의를 보존하면서도 자연스러운 피동 표현을 사용했습니다.
- source_word: office of true and steadfast love
  choice: 참되고 굳건한 사랑은 … 바라는 것
  rationale: 직역투인 ‘사랑의 직무’를 피하면서 사랑의 본질적 역할을 명제 형태로 자연스럽게 표현했습니다.
theological_decisions:
- issue: 폴리카르포스와 주님의 모범 관계
  choice: 주님께서 그러하셨듯이 자신이 넘겨질 때까지 기다렸습니다
  alternative: 주님처럼 붙잡히기를 기다렸습니다
  rationale: ‘넘겨지다’라는 수난 전승의 신학적 울림을 유지하되 폴리카르포스를 주님과 동일시하지 않고 모방의 관계로 제시했습니다.
- issue: 구원의 범위에 관한 문장
  choice: 자기만 … 아니라 모든 형제자매도 함께 구원받기를
  alternative: 자기 자신뿐 아니라 모든 형제도 구원하기를
  rationale: 사람이 타인을 직접 구원한다는 오해를 피하고, 본문이 말하는 사랑의 소망을 보존했습니다. 동시에 ‘모든’이라는 표현은 축소하지 않았습니다.
- issue: 순교의 복음 부합성
  choice: 복음에 부합하는 순교의 본
  alternative: 복음적인 순교의 본
  rationale: ‘복음적’이 특정 현대 교파를 연상시킬 수 있어, 원문의 관계적 의미를 더 명확히 드러내는 표현을 택했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 교회 문서의 장중함은 유지하되 ‘순교를 당한 자들’, ‘스스로 구원되기를 원하다’ 같은 번역투는 피했습니다. 제공된 자료가 영어 공용 번역 증언이며 헬라어 직접 검토가 보류 중이므로, 특히 ‘stayed the persecution’의 번역은 잠정적입니다.
