base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/022.yaml
  text: The blessed Polycarp was martyred on the second day of the first part of the month Xanthicus, on the seventh day before the Kalends of March, on a great Sabbath, at the eighth hour. He was arrested by Herodes, when Philip of Tralles was high priest, during the proconsulship of Statius Quadratus, but during the reign of the eternal King, Jesus Christ. To him be glory, honor, greatness, and an eternal throne, from generation to generation. Amen.
translation:
  language: ko
  text: 이제 복된 폴리카르포스는 크산티쿠스월 상반부 둘째 날, 곧 3월 칼렌다이 전 일곱째 날, 큰 안식일 제8시에 순교했습니다.[a] 그는 헤로데스에게 붙잡혔습니다. 그때 트랄레스의 필리포스가 대제사장이었고 스타티우스 콰드라투스가 총독으로 재임하고 있었으나, 영원한 왕 예수 그리스도께서 다스리고 계셨습니다. 그분께 영광과 존귀와 위엄과 영원한 보좌가 대대로 있기를 빕니다. 아멘.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 크산티쿠스월, ‘3월 칼렌다이 전 일곱째 날’, ‘큰 안식일’, ‘제8시’는 고대의 달력과 시간 표현입니다. 원문 전승의 표현을 보존하기 위해 현대 날짜와 시각으로 환산하지 않았습니다. 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역이며, 그리스어 원문에 대한 직접 검토가 필요합니다.
    reason: 고대 역법 용어의 불확실성을 알리고, 현재 초안의 자료적 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: Xanthicus
  choice: 크산티쿠스월
  rationale: 고대 월명을 현대 달력과 임의로 일치시키지 않고 음역하되, 월명임을 알 수 있도록 ‘월’을 붙였습니다.
- source_word: the seventh before the calends of March
  choice: 3월 칼렌다이 전 일곱째 날
  rationale: 로마식 날짜 계산법을 현대 날짜로 환산하지 않고 원문의 고대 역법 표현을 보존했습니다.
- source_word: a great Sabbath
  choice: 큰 안식일
  rationale: 어떤 특정 절기나 요일로 단정하지 않고 전승의 모호한 표현을 그대로 유지했습니다.
- source_word: high priest
  choice: 대제사장
  rationale: 당시 제의적 직함을 나타내는 증언의 표현을 그대로 옮겼으며, 교회 직분으로 바꾸지 않았습니다.
- source_word: proconsulship
  choice: 총독으로 재임
  rationale: 로마 행정 직책과 그 재임 시기를 자연스러운 현대 한국어로 전달했습니다.
- source_word: reign
  choice: 다스리고 계셨습니다
  rationale: 세속 총독의 재임과 그리스도의 영원한 통치를 대조하는 문장의 수사적 힘을 살렸습니다.
- source_word: eternal throne
  choice: 영원한 보좌
  rationale: 왕권과 통치를 나타내는 전통적이고 품위 있는 성서 문체를 유지했습니다.
theological_decisions:
- issue: 로마 총독의 재임과 예수 그리스도의 통치 사이의 대조
  choice: ‘재임하고 있었으나, 영원한 왕 예수 그리스도께서 다스리고 계셨습니다’로 대조를 명시했습니다.
  alternative: 두 시기를 모두 중립적으로 ‘~때에’라고 병렬할 수 있습니다.
  rationale: 영어 증언의 ‘but’가 드러내는 신학적·수사적 대조를 보존하되, 그 의미를 더 해설하지 않았습니다.
- issue: 마지막 송영의 지시 대상
  choice: 가장 가까운 선행 대상인 예수 그리스도를 가리키도록 ‘그분께’라고 옮겼습니다.
  alternative: ‘그리스도께’라고 이름을 반복하거나, 지시 대상의 모호성을 더 살려 ‘그에게’라고 할 수 있습니다.
  rationale: 한국어에서 자연스럽고 존중하는 표현을 사용하면서 증언의 문법적 연결을 따랐습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교 기록의 연대기적 엄숙함과 마지막 송영의 장중함을 살리되, 낯선 고대 역법 용어는 음역과 각주로 처리했습니다. 제공 자료가 그리스어 본문 자체가 아니라 공개 영역 영어 증언이며 원어 검토가 보류되어 있으므로, 단정적인 현대 환산이나 본문 교정을 피했습니다.
