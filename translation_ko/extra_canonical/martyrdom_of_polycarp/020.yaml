base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/020.yaml
  text: 'So it happened to the blessed Polycarp, who suffered martyrdom in Smyrna together with those from Philadelphia—twelve in all. He is remembered by everyone more than the others, so that even pagans everywhere speak about him. For he showed himself to be not only a notable teacher but also a distinguished martyr, whose martyrdom everyone desires to imitate, since it followed the pattern of the gospel of Christ.


    By his endurance he overcame the unrighteous ruler in the conflict and thus received the crown of immortality. He rejoices in the company of the apostles and all righteous people, glorifies the almighty God and Father, and blesses our Lord Jesus Christ, the Savior of our souls, the helmsman of our bodies, and the shepherd of the universal church throughout the world.'
translation:
  language: ko
  text: '이와 같이 복된 폴리카르포스는 필라델피아에서 온 이들과 함께 스미르나에서 순교했습니다. 그들은 모두 열두 명이었습니다. 그 가운데서도 그는 모든 사람에게 다른 이들보다 특별히 더 기억되어, 어디서나 이방인들까지도 그에 관해 말합니다. 그는 뛰어난 교사일 뿐 아니라 탁월한 순교자임을 드러냈기 때문입니다. 그의 순교는 그리스도의 복음의 본을 따른 것이어서, 모든 사람이 그것을 본받고자 합니다.


    그는 싸움에서 인내로 불의한 통치자를 이기고, 그리하여 불멸의 면류관을 받았습니다. 그는 사도들과 모든 의인과 함께 기뻐하며, 전능하신 하나님 아버지께 영광을 돌리고, 우리 영혼의 구원자이시며 우리 몸의 키잡이이시고 온 세계에 두루 있는 보편 교회의 목자이신 우리 주 예수 그리스도를 찬송합니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 J. B. 라이트풋의 공개 영역 영어 번역을 바탕으로 한 잠정 번역입니다. 그리스어 사본 전통과의 직접 대조가 아직 필요하며, 특히 ‘복음의 본’, ‘불멸의 면류관’, ‘찬송합니다’에 해당하는 표현은 원문 검토 뒤 조정될 수 있습니다.
    reason: 제공 자료가 영어 번역 증언이며 그리스어 원문 검토가 보류 중이라는 자료적 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: 'μαρτυρέω / μαρτύριον (영어 증언: suffered martyrdom / martyrdom)'
  choice: 순교하다 / 순교
  rationale: 초기 그리스도교 문헌의 문맥에서 죽음으로 증언한 사건을 가리키므로, 현대 한국어 독자에게 분명한 전통 용어를 사용했습니다.
- source_word: 'τύπος/κατὰ τὸ εὐαγγέλιον (영어 증언: after the pattern of the Gospel of Christ)'
  choice: 그리스도의 복음의 본을 따르다
  rationale: ‘복음에 부합했다’로 의미를 단정하지 않고, 모범·형식을 나타내는 ‘본’의 이미지를 보존했습니다.
- source_word: 'βραβεῖον/στέφανος τῆς ἀφθαρσίας (영어 증언: crown of immortality)'
  choice: 불멸의 면류관
  rationale: 경기와 승리의 비유를 살리면서 교회 문체에 익숙한 ‘면류관’을 채택했습니다.
- source_word: 'κυβερνήτης (영어 증언: helmsman)'
  choice: 키잡이
  rationale: 몸을 배에 빗댄 원문의 항해 이미지를 평이하고 자연스러운 현대 한국어로 유지했습니다.
- source_word: 'καθολικὴ ἐκκλησία (영어 증언: universal Church)'
  choice: 보편 교회
  rationale: 후대의 특정 교파 명칭으로 오해될 수 있는 ‘가톨릭교회’를 피하고, 이 문맥의 보편성을 나타냈습니다.
theological_decisions:
- issue: ‘그리스도의 복음의 본’이 뜻하는 범위
  choice: ‘그리스도의 복음의 본을 따른 것’으로 표현
  alternative: ‘그리스도의 복음에 따라 이루어진 것’
  rationale: 순교가 복음의 서술·모범을 따른다는 함의를 보존하되, 정확한 관계를 해석으로 좁히지 않았습니다.
- issue: 순교 후 폴리카르포스의 현재 상태를 나타내는 시제
  choice: ‘함께 기뻐하며 … 영광을 돌리고 … 찬송합니다’
  alternative: ‘함께 기뻐할 것이며 … 영광을 돌릴 것입니다’
  rationale: 영어 증언이 제시하는 현재형을 유지하여 저자가 묘사하는 현재적 천상 교제를 미래형으로 바꾸지 않았습니다.
- issue: 예수 그리스도께 드리는 ‘blesses’의 번역
  choice: ‘찬송합니다’
  alternative: ‘복을 빕니다’ 또는 ‘송축합니다’
  rationale: 상위 존재가 하위 존재에게 복을 베푸는 뜻으로 오해되지 않도록 예배적 칭송의 의미를 드러냈습니다. 다만 원어 직접 대조가 아직 필요함을 각주에 밝혔습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 순교 문헌의 장중함을 유지하되 문장을 적절히 나누어 일반 독자가 쉽게 읽도록 했습니다. ‘이방인’, ‘면류관’, ‘의인’처럼 문헌의 역사적·성경적 결을 지닌 용어는 보존했고, ‘보편 교회’는 특정 현대 교파를 지칭하지 않도록 선택했습니다.
