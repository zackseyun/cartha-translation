review_pass:
  verdict: revise
  source_fidelity: 그리스어 전승의 표현(μετάνοια/μεταβάλλειν, θηρία, καταφλέξω, τὸ ... πῦρ)을 대체로 충실히 반영합니다. 다만 마지막 경고에서 원문은 ‘장차 있을 심판과 영원한 형벌의 불’이라고, ‘불’이 두 속격 표현을 함께 받습니다. 현 초안의 ‘장래 심판의 불과 영원한 형벌’은 불과 형벌을 병렬의 별개 항목처럼 읽히게 합니다. 또한 ‘불에 태워 없애겠소’는 한국어로 다소 부자연스럽고, 불로 죽이겠다는 위협을 완곡하게 흐립니다.
  naturalness: 전반적으로 현대 표준어 합쇼체이며 대화의 긴장도 자연스럽습니다. 다만 ‘더 나은 데서 더 나쁜 데로’보다 ‘더 나은 것에서 더 나쁜 것으로’가 격조 있는 문맥에 더 자연스럽고, ‘맹수들을 대수롭지 않게 여기다’보다 ‘맹수들을 업신여기다’가 ‘despise’의 경멸 의미를 더 잘 살립니다.
  terminology: ‘돌이키다’의 반복은 총독의 요구와 폴리카르포스의 역설적 응답을 보존하는 적절한 선택입니다. ‘맹수들’, ‘의’, ‘불경건한 자들’도 적절합니다. ‘악행’은 제공된 영어 증언의 wrongdoing에 맞으며 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: ‘장래 심판의 불과 영원한 형벌’의 결속 관계
    rationale: 그리스어는 ‘장차 있을 심판과 영원한 형벌의 불’을 가리킵니다. 현 번역은 ‘심판의 불’과 ‘영원한 형벌’을 분리된 병렬물로 읽게 할 수 있으므로, 불이 양쪽 수식어에 걸리도록 고쳐야 합니다.
  - severity: low
    issue: ‘불에 태워 없애겠소’의 자연스러움과 명시성
    rationale: 불로 소멸시키겠다는 위협을 가리키지만 현대 한국어에서는 어색합니다. ‘불태워 죽이겠소’가 원문의 처형 위협을 자연스럽고 직접적으로 전달합니다.
  - severity: low
    issue: ‘대수롭지 않게 여기다’의 어조
    rationale: ‘despise’에는 단순한 경시보다 경멸·업신여김의 뜻이 있습니다.
