  rationale: 그리스어의 문법적 결속 관계를 반영하여 종말론적 ‘불’이 장차 있을 심판과 영원한 형벌 모두에 관련됨을 드러냈습니다. 그 밖의 변경은 위협의 의미와 ‘despise’의 어조를 더 자연스러운 현대 합쇼체로 옮긴 최소한의 문체 수정입니다. ‘돌이키다’는 원문의 반복과 대조를 보존하므로 유지했습니다.
