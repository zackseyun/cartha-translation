source:
  text: 'Whereupon the proconsul said; ''I have wild beasts here and I will throw thee to them, except thou repent'' But he said, ''Call for them: for the repentance from better to worse is a change not permitted to us; but it is a noble thing to change from untowardness to righteousness''


    Then he said to him again, ''I will cause thee to be consumed by fire, if thou despisest the wild beasts, unless thou repent.'' But Polycarp said; ''Thou threatenest that fire which burneth for a season and after a little while is quenched: for thou art ignorant of the fire of the future judgment and eternal punishment, which is reserved for the ungodly. But why delayest thou? Come, do what thou wilt.'''
  text_scope: public_domain_english_witness
  manuscript: Greek manuscript tradition
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://ccel.org/ccel/lightfoot/fathers/fathers.ii.xi.html
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: 'Whereupon the proconsul said; ''I have wild beasts here and I will throw thee to them, except thou repent'' But he said, ''Call for them: for the repentance from better to worse is a change not permitted to us; but it is a noble thing to change from untowardness to righteousness''


    Then he said to him again, ''I will cause thee to be consumed by fire, if thou despisest the wild beasts, unless thou repent.'' But Polycarp said; ''Thou threatenest that fire which burneth for a season and after a little while is quenched: for thou art ignorant of the fire of the future judgment and eternal punishment, which is reserved for the ungodly. But why delayest thou? Come, do what thou wilt.'''
base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/012.yaml
  text: 'Then the proconsul said, “I have wild beasts here, and I will throw you to them unless you repent.” But he said, “Call for them, for repentance from better to worse is a change not permitted to us. But it is a noble thing to change from wrongdoing to righteousness.”


    Then he said to him again, “I will have you consumed by fire if you despise the wild beasts, unless you repent.” But Polycarp said, “You threaten me with a fire that burns for a time and is quenched after a little while, for you are ignorant of the fire of the future judgment and eternal punishment that is reserved for the ungodly. But why do you delay? Come, do what you will.”'
translation:
  language: ko
  text: '그러자 총독이 말했습니다. “내게 맹수들이 있으니, 그대가 돌이키지 않으면 그대를 맹수들에게 던지겠소.” 그러나 폴리카르포스가 말했습니다. “그들을 불러오십시오. 더 나은 것에서 더 나쁜 것으로 돌이키는 일은 우리에게 허락되지 않기 때문입니다. 그러나 악행에서 의로 돌이키는 것은 고귀한 일입니다.”


    총독이 다시 그에게 말했습니다. “그대가 맹수들을 업신여긴다면, 돌이키지 않을 경우 그대를 불태워 죽이겠소.” 그러나 폴리카르포스가 말했습니다. “총독께서는 잠시 타다가 얼마 뒤 꺼지는 불로 나를 위협하십니다. 총독께서 불경건한 자들을 위해 예비된 장차 있을 심판과 영원한 형벌의 불을 알지 못하시기 때문입니다. 그런데 왜 지체하십니까? 자, 뜻대로 하십시오.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: repent / repentance (English witness; Greek review pending)
  choice: 돌이키다 / 돌이키는 것
  rationale: 총독이 요구하는 변절과 폴리카르포스가 말하는 도덕적 전환에 모두 적용되는 반복 어구를 보존하면서, 현대 독자가 자연스럽게 이해하도록 옮겼습니다.
- source_word: wild beasts
  choice: 맹수들
  rationale: 공개 처형에 쓰이는 사나운 짐승들을 간결하고 역사적 문맥에 맞게 나타냅니다.
- source_word: untowardness / wrongdoing
  choice: 악행
  rationale: 모호한 부정적 상태를 지나치게 교리화하지 않으면서 ‘의’와 대조되는 그릇된 행실을 표현합니다.
- source_word: righteousness
  choice: 의
  rationale: 도덕적 올바름과 신학적 울림을 함께 보존하는 익숙하고 간결한 용어입니다.
- source_word: ungodly
  choice: 불경건한 자들
  rationale: 단순한 악인보다 하나님을 공경하지 않는다는 종교적 의미를 보존합니다.
theological_decisions:
- issue: ‘회개/돌이킴’의 양면적 사용
  choice: 두 발언 모두 ‘돌이키다’를 사용함
  alternative: 총독의 말에서는 ‘마음을 바꾸다’ 또는 ‘신앙을 버리다’, 폴리카르포스의 말에서는 ‘회개하다’를 사용함
  rationale: 원문의 수사적 반복과 역전을 살리고, 총독의 요구를 신학적 회개로 오해하게 만들거나 해석적으로 ‘배교’를 덧붙이지 않기 위해 같은 어근을 유지했습니다.
- issue: 장래 심판과 영원한 형벌
  choice: ‘장래 심판의 불과 영원한 형벌’로 병렬 관계를 보존함
  alternative: ‘장래 심판, 곧 영원한 형벌의 불’로 동일시함
  rationale: 제공된 증거가 허용하는 문법적·신학적 긴장을 임의로 해소하지 않았습니다.
- issue: 불경건한 자들을 위해 예비됨
  choice: 형벌의 대상으로 읽히는 전통적 표현을 그대로 보존함
  alternative: 비인격적으로 ‘불경건을 심판하기 위해 예비된’으로 완화함
  rationale: 증언문에 나타난 종말론적 경고의 직접성을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 총독은 위협적이되 공적인 말투로 ‘-겠소’를 쓰고, 폴리카르포스는 존댓말을 유지하면서도 담대하게 응답하도록 했습니다. 다만 현재 제공된 drafting basis가 공용 영역 영어 번역 증언이며 그리스어 원문 대조가 보류 중이므로, 이 초안은 추후 원어 검토가 필요합니다.
