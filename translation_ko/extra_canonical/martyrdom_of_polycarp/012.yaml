    총독이 다시 그에게 말했습니다. “그대가 맹수들을 대수롭지 않게 여긴다면, 돌이키지 않을 경우 그대를 불에 태워 없애겠소.” 그러나 폴리카르포스가 말했습니다. “총독께서는 잠시 타다가 얼마 뒤 꺼지는 불로 나를 위협하십니다. 불경건한 자들을 위해 예비된 장래 심판의 불과 영원한 형벌을 알지 못하시기 때문입니다. 그런데 왜 지체하십니까? 자, 뜻대로 하십시오.”'
