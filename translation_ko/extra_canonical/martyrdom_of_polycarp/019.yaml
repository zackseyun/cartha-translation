base_translation:
  language: en
  yaml_path: translation/extra_canonical/martyrdom_of_polycarp/019.yaml
  text: 'Therefore, when the centurion saw the opposition raised by the Jews, he placed Polycarp in the middle and burned him according to their custom.


    Afterward, we took up his bones, which are more valuable than precious stones and finer than refined gold, and laid them in a suitable place;


    there the Lord will permit us to gather together, as we are able, with gladness and joy, and to celebrate the birthday of his martyrdom, in remembrance of those who have already fought in the contest and for the training and preparation of those who will do so hereafter.'
translation:
  language: ko
  text: '그러므로 백인대장은 유대인들이 거세게 반대하는 것을 보고, 폴리카르포스를 한가운데에 두고 그들의 관례대로 불살랐습니다.[a]


    그 뒤에 우리는 보석보다 더 귀하고 정련한 금보다 더 값진 그의 뼈를 거두어 알맞은 곳에 모셨습니다.


    주님께서 허락하시면, 우리는 가능한 대로 그곳에 함께 모여 기쁨과 환희 가운데 그의 순교 기념일, 곧 그가 새 생명으로 태어난 날을 기념할 것입니다.[b] 이는 이미 경기에 나서 싸운 이들을 기억하고, 앞으로 그렇게 할 이들을 훈련시키고 준비시키기 위한 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 관례대로’가 유대인들의 관례를 가리키는지, 당시 당국의 통상적인 처리 방식을 가리키는지는 문장 구조상 논의의 여지가 있습니다.
    reason: 대명사의 선행 대상과 관례의 주체에 관한 원문의 모호성을 독단적으로 해소하지 않기 위해서입니다.
  - marker: b
    text: 직역하면 ‘그의 순교의 생일’입니다. 초기 그리스도인들은 순교자가 죽음을 거쳐 새 생명에 들어가는 날이라는 뜻으로 순교일을 ‘태어난 날’이라고 부르기도 했습니다.
    reason: 고대 표현의 생명·죽음 이미지를 설명하고 현대 독자의 오해를 막기 위해서입니다.
lexical_decisions:
- source_word: φιλονεικία
  choice: 거세게 반대하는 것
  rationale: 단순한 이견이 아니라 완강하고 다투기까지 하는 반대를 나타내되, 문맥에 없는 구체적 행동은 덧붙이지 않았습니다.
- source_word: κεντυρίων
  choice: 백인대장
  rationale: 로마 군대의 직책을 한국어 성서·고대 문헌 독자에게 익숙한 명칭으로 옮겼습니다.
- source_word: ὀστᾶ
  choice: 뼈
  rationale: 순교자의 물질적 유해를 가리키는 직접적인 표현을 유지했습니다.
- source_word: ἡμέραν γενέθλιον
  choice: 순교 기념일, 곧 그가 새 생명으로 태어난 날
  rationale: γενέθλιος의 ‘태어난 날’이라는 이미지를 보존하면서, 문맥상 순교일을 가리킨다는 점을 자연스럽게 밝혔습니다.
- source_word: προηθληκότων
  choice: 이미 경기에 나서 싸운 이들
  rationale: 순교를 경기로 묘사하는 운동 경기의 은유를 살렸습니다.
- source_word: ἄσκησιν τε καὶ ἑτοιμασίαν
  choice: 훈련시키고 준비시키기
  rationale: 후대의 순교자들이 겪을 일을 위한 단련과 대비라는 병렬 의미를 유지했습니다.
theological_decisions:
- issue: 순교일을 ‘태어난 날’로 부르는 표현
  choice: 순교 기념일과 새 생명으로 태어난 날이라는 표현을 함께 제시했습니다.
  alternative: ‘순교의 생일’이라고 직역하거나 ‘순교 기념일’로만 옮길 수 있습니다.
  rationale: 초기 그리스도교의 죽음과 생명에 관한 함의를 지우지 않으면서도, 현대 독자가 육신의 출생일로 오해하지 않도록 했습니다.
- issue: 유해의 가치에 관한 진술
  choice: ‘보석보다 더 귀하고 정련한 금보다 더 값진’이라는 비교를 그대로 유지했습니다.
  alternative: 상징적 존경의 표현으로 약화하여 의역할 수 있습니다.
  rationale: 본문의 강한 존숭 표현을 보존하되, 유해 공경에 관한 후대의 교리나 관행을 덧붙이지 않았습니다.
- issue: 주님의 허락과 공동체의 모임
  choice: ‘주님께서 허락하시면’으로 옮겼습니다.
  alternative: ‘주님께서 우리에게 허락하실 것입니다’라고 단정적으로 옮길 수 있습니다.
  rationale: 주님의 섭리에 대한 의존을 자연스럽게 나타내면서, 공동체가 실제로 모일 수 있는 형편에 달린 문맥을 반영했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 공동체의 증언이라는 성격을 살려 ‘우리’를 유지했으며, 경기와 탄생의 은유를 가능한 한 보존했습니다. 제공 자료 자체가 그리스어 직접 검토 전의 영어 공개 번역 증언에 기초한다고 밝히므로, 본 초안은 전승된 그리스어 문구와 대조하여 재감수할 필요가 있습니다.
