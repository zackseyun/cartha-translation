    issue: 주님의 허락을 조건절로 처리하고, 기념 행사를 ‘기념할 것입니다’로 재구성했습니다.
    rationale: 원문은 주님께서 공동체가 모여 순교의 생일을 기념하도록 허락하실 것이라는 진술입니다. 조건문으로 바꾸면 원문의 문장 구조와 진술의 무게가 약간 달라집니다.
  - severity: medium
