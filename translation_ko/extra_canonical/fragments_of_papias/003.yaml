base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: ko
  text: 사람들은 저마다 자기 집으로 돌아갔으나, 예수께서는 올리브산으로 가셨습니다. 이른 아침에 예수께서 다시 성전으로 오셨고, [온 백성이 그분께로 왔습니다. 예수께서는 앉아서 그들을 가르치셨습니다]. 율법학자들과 바리새인들이 간음하다가 붙잡힌 여자를 끌고 와서 한가운데 세우고 예수께 말했습니다. “선생님, 이 여자는 간음하는 현장에서 붙잡혔습니다. 모세는 율법에서 이런 여자들을 돌로 치라고 [우리에게] 명령했습니다. 그러면 선생님은 무엇이라고 말씀하시겠습니까?” [그들은 예수를 시험하여 고발할 구실을 얻으려고 이렇게 말했습니다.] 그러나 예수께서는 몸을 굽혀 손가락으로 땅에 무엇인가를 쓰셨습니다. 그들이 계속 [예수께] 묻자, 예수께서는 몸을 일으켜 [그들에게] 말씀하셨습니다. “여러분 가운데 죄 없는 사람이 먼저 이 여자에게 돌을 던지십시오.” 그러고는 다시 몸을 굽혀 땅에 쓰셨습니다. 그들은 이 말씀을 듣고 나이 많은 사람부터 시작하여 하나씩 밖으로 나갔습니다. 예수만 남으셨고, 여자는 그대로 한가운데 서 있었습니다. 예수께서 몸을 일으켜 여자에게 말씀하셨습니다. “여인이여, 그들이 어디 있습니까? 아무도 당신을 정죄하지 않았습니까?” 여자가 대답했습니다. “주님, 아무도 하지 않았습니다.” 예수께서 말씀하셨습니다. “나도 당신을 정죄하지 않습니다. 가십시오. 이제부터는 더 이상 죄를 짓지 마십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '이 대목은 흔히 ‘간음한 여인 이야기’라고 불립니다. 이 초안은 제공된 공용 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 대괄호는 그 증언에서 복원되었거나 불확실한 본문을 표시한 것이며, 그리스어·라틴어 원자료에 대한 직접 검토가 아직 필요합니다. 제공된 증언의 편집자 참조: Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 이하, 91; Lightfoot, Essays on Supernatural Religion, p. 203 이하.'
    reason: 자료의 본문비평적 불확실성과 직접 원어 검토가 보류 중이라는 사실을 독자에게 알리고, 원 증언에 실린 편집자 인용을 보존하기 위해 붙였습니다.
lexical_decisions:
- source_word: scribes
  choice: 율법학자들
  rationale: 현대 독자가 이들의 역할을 바로 이해할 수 있도록 전통적인 ‘서기관들’보다 기능이 분명한 표현을 선택했습니다.
- source_word: Master / Teacher
  choice: 선생님
  rationale: 문맥상 예수를 가르치는 이로 부르는 호칭이며, 현대 한국어의 자연스러운 존칭으로 옮겼습니다.
- source_word: without sin
  choice: 죄 없는
  rationale: 죄의 범위를 특정하지 않는 원문의 포괄성을 그대로 보존했습니다.
- source_word: condemn
  choice: 정죄하다
  rationale: 단순한 비난이 아니라 유죄 판정의 사법적 함의를 살리면서 성서 문체에도 자연스러운 용어를 사용했습니다.
- source_word: Woman
  choice: 여인이여
  rationale: 모욕적이지 않은 직접 호칭이라는 성격을 살리고, 현대적이면서도 품위 있는 문체를 유지했습니다.
theological_decisions:
- issue: ‘죄 없는 사람’이 뜻하는 죄의 범위
  choice: 제한 없이 ‘죄 없는 사람’으로 번역했습니다.
  alternative: ‘이 죄를 짓지 않은 사람’ 또는 ‘간음죄가 없는 사람’
  rationale: 제공된 증거는 죄를 간음이나 특정 범죄로 한정하지 않으므로 그 신학적 긴장을 해소하지 않았습니다.
- issue: 예수께서 땅에 쓰신 내용
  choice: ‘무엇인가를 쓰셨습니다’로 내용이 밝혀지지 않았음을 드러냈습니다.
  alternative: 죄목이나 고발자들의 죄를 쓰셨다고 구체화
  rationale: 본문은 쓰신 내용을 제시하지 않으므로 해석적 추측을 도입하지 않았습니다.
- issue: ‘정죄하지 않는다’와 ‘죄를 짓지 말라’의 관계
  choice: 두 선언을 모두 직접적이고 대등하게 보존했습니다.
  alternative: 용서, 무죄 선고, 회개의 조건 등으로 관계를 명시
  rationale: 본문이 지닌 자비와 윤리적 명령의 긴장을 특정 교리 체계로 풀어 쓰지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 품위 있고 읽기 쉽게 다듬되, 제공된 증언의 대괄호와 반복, 법정적 어휘, 해석상 열린 지점을 보존했습니다. 직접 원어 검토가 보류된 자료이므로 번역의 잠정적 성격을 각주에 명시했습니다.
