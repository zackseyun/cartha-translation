  naturalness: 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. 다만 ‘아무도 하지 않았습니다’는 앞선 ‘정죄하다’를 직접 받는 대답으로는 다소 부자연스러워 ‘아무도 없습니다, 주님’이 더 자연스럽고 원문의 짧은 응답에도 가깝습니다.
  terminology: ‘율법학자들’, ‘바리새인들’, ‘정죄하다’, ‘여인이여’는 문맥과 격식에 적절합니다. ‘선생님’도 Teacher/Master의 호칭을 무리 없이 전달합니다. ‘올리브산’은 현대어로 가능하나, 고유 지명 표기를 ‘올리브 산’으로 띄어 썼습니다.
  issues:
  - severity: medium
    issue: 예수께서 땅에 쓰신 행위에 ‘무엇인가를’를 보탬
    rationale: 증언은 단지 땅에 쓰셨다고 할 뿐, 쓰신 대상이나 내용이 있었음을 명시하지 않습니다. ‘손가락으로 땅에 쓰셨습니다’로 옮기면 미상의 내용을 보존하면서도 덧붙임을 피할 수 있습니다.
  - severity: medium
    issue: 여자가 ‘서 있었다’고 단정함
    rationale: ‘the woman, where she was, in the midst’는 여자가 한가운데 있던 상태를 말할 뿐 자세를 특정하지 않습니다. ‘여자는 있던 곳, 곧 한가운데에 있었습니다’로 보존해야 합니다.
  - severity: low
    issue: ‘such’를 ‘이런 여자들’로 성별 한정
    rationale: 이야기 속 대상은 여자이나 법 조항을 인용하는 ‘such’ 자체는 성별을 명시하지 않습니다. ‘그런 사람들’이 더 직접적입니다.
  - severity: low
    issue: 여자의 응답 표현
    rationale: ‘No man, Lord’는 ‘주님, 아무도 없습니다’가 자연스럽고, 정죄한 이가 없다는 원문의 생략된 동사를 한국어에서 과도하게 반복하지 않습니다.
