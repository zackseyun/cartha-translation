base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: ko
  text: '그가 이 말을 한 것은, 제가 보기에는, 아시아의 히에라폴리스 출신 파피아스를 모호하게 가리킨 것입니다. 파피아스는 당시 감독이었으며 거룩한 복음서 저자 요한의 시대에 이름을 떨쳤습니다.[a] 이 파피아스는 자신의 『주님의 말씀 해설』 제4권에서 부활 때 누릴 즐거움의 원천들 가운데 음식도 언급했습니다. …[b] 리옹의 이레나이우스도 『이단 논박』 제5권에서 같은 말을 하며, 자신의 주장을 뒷받침하려고 앞서 말한 파피아스를 제시합니다.


    — 고백자 막시무스, 『아레오파고스 사람 디오니시우스의 교회 위계론 주해』 제7장'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 ‘요한’은 증언문에서 ‘거룩한 복음서 저자 요한’이라고 불립니다. 이 번역은 그를 ‘사도 요한’이나 다른 요한으로 더 구체적으로 특정하지 않습니다.
    reason: 원증언이 남겨 둔 역사적 동일성의 범위를 보존하기 위해서입니다.
  - marker: b
    text: 생략 부호는 제공된 증언문에 있는 것으로, 빠진 내용이나 인용의 중단을 나타냅니다. 이 단편은 공개 영역 영어 번역 증언을 토대로 잠정 번역했으며, 그리스어·라틴어 원문 대조는 아직 이루어지지 않았습니다.
    reason: 본문의 불완전성과 번역 근거의 한계를 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: darkly indicating
  choice: 모호하게 가리킨 것입니다
  rationale: 간접적이고 분명하지 않은 지시라는 뜻을 보존하면서도 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: flourished
  choice: 이름을 떨쳤습니다
  rationale: 특정 인물의 활동 전성기를 나타내는 전기적 관용 표현으로 이해했습니다. 단순히 생존했다는 의미로 축소하지 않았습니다.
- source_word: Dominical Expositions
  choice: 『주님의 말씀 해설』
  rationale: 파피아스 저술의 전통적 제목이 가리키는 ‘주님의 말씀/말씀들에 대한 해설’을 독자가 이해하기 쉽게 제시했습니다. 다만 직접 원어 검토가 보류되어 있어 각주로 잠정성을 밝혔습니다.
- source_word: viands
  choice: 음식
  rationale: 고어적인 ‘진미’보다 포괄적인 의미를 살리고, 부활의 즐거움과 관련된 음식이라는 진술을 과장 없이 전달했습니다.
- source_word: sources of delights
  choice: 즐거움의 원천들
  rationale: 복수 개념을 유지하고, 음식 자체와 즐거움의 관계를 원문 증언대로 다소 직역하여 보존했습니다.
- source_word: bishop
  choice: 감독
  rationale: 후대 교회 직제에 관한 특정 교파적 번역을 피하면서 초기 그리스도교 직분 명칭의 의미를 비교적 직접적으로 전달했습니다.
theological_decisions:
- issue: 부활 때 음식이 즐거움의 원천이라는 진술
  choice: 설명하거나 영적으로 재해석하지 않고 그대로 보존
  alternative: 상징적 잔치나 영적 복을 뜻한다고 명시
  rationale: 단편은 파피아스가 실제로 무엇을 뜻했는지 충분히 설명하지 않으므로, 후대의 신학적 해석을 본문에 삽입하지 않았습니다.
- issue: 요한의 정체
  choice: ‘거룩한 복음서 저자 요한’으로 번역
  alternative: ‘사도 요한’ 또는 ‘장로 요한’으로 특정
  rationale: 영어 증언이 ‘holy Evangelist John’이라고만 하므로, 논쟁 가능한 역사적 동일성을 더 좁게 확정하지 않았습니다.
- issue: Dominical Expositions의 제목
  choice: 『주님의 말씀 해설』
  alternative: 『주님의 신탁 해설』 또는 『주님의 말씀에 대한 해설』
  rationale: 현대 독자가 이해하기 쉬운 제목을 택하되, 직접 원어 검토 전의 잠정 번역임을 각주에서 명시했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용하되 고대 문헌 인용에 맞는 절제되고 품위 있는 문체를 유지했습니다. 인명과 지명은 한국어에서 널리 쓰이는 형태인 ‘파피아스’, ‘히에라폴리스’, ‘이레나이우스’, ‘막시무스’를 채택했습니다. 문헌 표제는 겹낫표로 표시했습니다. 직접 원어 검토가 보류된 자료이므로 과도한 확정 표현을 피하고, 제공된 영어 증언과 영어 POB를 비판적으로 참고했습니다.
