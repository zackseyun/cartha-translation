base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: ko
  text: '그러나 파피아스는 이렇게 말합니다. 그의 말을 글자 그대로 인용하겠습니다.


    “그분께서는 그들 가운데 일부, 곧 처음에는 거룩했던 천사들에게 우주의 질서를 다스리는 권한도 주셨고, 그 권한을 올바르게 행사하라고 명하셨습니다.


    그러나 그들의 질서는 무너지고 말았습니다. 큰 용, 곧 옛 뱀이며 사탄이라고도 하고 마귀라고도 하는 자가 내던져졌기 때문입니다. 참으로 그와 그의 천사들은 땅으로 내던져졌습니다.”


    — 카이사레아의 안드레아스, 『묵시록 주해』 34장, 설교 12'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: dominion
  choice: 다스리는 권한
  rationale: 단순한 지배보다 위임받은 통치권이라는 문맥을 자연스럽고 명확하게 전달합니다.
- source_word: arrangement of the universe
  choice: 우주의 질서
  rationale: ‘배열’이나 ‘구성’보다 천사들에게 맡겨진 우주적 질서와 운영의 의미를 현대 한국어로 자연스럽게 나타냅니다.
- source_word: array
  choice: 질서
  rationale: 앞 문장의 ‘arrangement’와 이어지는 개념으로 보되, 천사들의 조직이나 정연한 상태를 가리킬 수 있는 원문의 여지를 유지합니다.
- source_word: was cast down
  choice: 내던져졌습니다
  rationale: 묵시문학적 추락과 강제 축출의 강도를 살리며 수동태를 보존합니다.
theological_decisions:
- issue: ‘He’의 지시 대상
  choice: 그분
  alternative: 하나님
  rationale: 제공된 단편만으로 지시 대상이 명시되지 않으므로, 하나님으로 단정하여 본문에 보충하지 않았습니다.
- issue: 거룩했던 천사들의 타락과 용 및 그의 천사들의 관계
  choice: 문장상의 연관성만 보존
  alternative: 두 집단을 명시적으로 동일시
  rationale: 단편은 양자를 긴밀히 연결하지만 동일 집단이라는 해석을 별도로 명문화하지 않으므로 신학적 긴장을 그대로 두었습니다.
- issue: ‘their array’의 의미
  choice: 그들의 질서
  alternative: 그들의 진영 또는 조직
  rationale: 천사들의 직무 체계, 정연한 상태, 진영 가운데 어느 하나로 과도하게 확정하지 않는 표현을 택했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 인용문의 품위를 유지하되 고어체는 피했습니다. 현 단계의 근거가 손상된 공용 영어 증언이며 그리스어·라틴어 원문 대조가 보류 중이므로, OCR상 명백히 복원되는 ‘great’, ‘devil’, ‘his’만 반영하고 불확실한 의미는 과도하게 확정하지 않았습니다. 출전명 ‘in Apocalypsin’은 문헌 성격에 맞추어 『묵시록 주해』로 옮겼습니다.
