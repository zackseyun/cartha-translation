  source_fidelity: 현 초안은 손상된 영어 증언과 영어 POB의 명백한 OCR 복원을 대체로 충실히 따릅니다. 다만 영어 POB가 보존한 ‘And he says next’라는 인용 전환을 누락하고 두 인용을 하나로 합쳤습니다. 또한 ‘그와 그의 천사들은 땅으로’라는 두 번째 절의 수동·강조 구조를 더 직접적으로 보존하는 편이 좋습니다. 그리스어·라틴어 직접 대조가 보류된 상태이므로 ‘array’의 정확한 뉘앙스는 단정하지 않습니다.
  naturalness: 합쇼체와 문체는 전반적으로 자연스럽습니다. 그러나 파피아스의 첫 인용 뒤에 서술자의 전환문을 복원하고, 두 번째 인용을 독립시키면 인용 구조가 훨씬 명료해집니다. ‘질서는 무너지고 말았습니다’는 현대 한국어로 자연스럽고, ‘array’의 폭넓은 의미도 과도하게 좁히지 않습니다.
  terminology: ‘그분’은 선행 지시 대상이 이 단편에 명시되지 않는 점을 보존하며, ‘사탄’, ‘마귀’, ‘큰 용’, ‘옛 뱀’은 영어 증언의 호칭을 충실히 반영합니다. ‘우주의 질서를 다스릴 권한’은 dominion over the arrangement of the universe를 적절히 옮깁니다. 출전의 Andreas of Caesarea 및 Apocalypsin은 ‘카이사레아의 안드레아스, 『묵시록 주해』’로 자연스럽게 처리할 수 있습니다.
