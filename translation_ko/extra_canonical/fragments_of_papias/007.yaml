base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: ko
  text: '그러나 이 책, 곧 『묵시록』의 영감성에 관해서는 …… 신학자 그레고리오스와 키릴로스, 그리고 그보다 더 옛 세대의 사람들인 [파피아스?][a], 이레나이오스, 메토디오스, 히폴리토스도 이 책의 진정성을 증언합니다.[b]


    — 카이사레아의 안드레아스, 『묵시록』 서문'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증거 본문에서 이 이름은 ‘Pz’로 훼손되어 있습니다. 이 단편의 전승 문맥과 알려진 인명 목록에 따라 ‘파피아스’로 추정했으나, 그리스어 원문 대조가 필요합니다.
    reason: 훼손된 고유명사의 추정 복원을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 제공된 증거 본문은 ‘Apocal’ 뒤에서 ‘mean, the Divine)’ 앞까지 결락되거나 심하게 훼손되어 있습니다. 번역문은 전승 문맥상 ‘『묵시록』’과 ‘신학자 그레고리오스’를 반영하되, 결락 부호(……)로 본문의 불완전성을 보존했습니다. 그리스어·라틴어 원전 검토는 아직 이루어지지 않았습니다.
    reason: 직접적인 원어 검토 없이 훼손된 영어 공공 영역 증거 본문을 바탕으로 한 잠정 번역임을 명시하기 위해서입니다.
lexical_decisions:
- source_word: inspiration
  choice: 영감성
  rationale: 책이 영감을 받았다는 성격을 가리키는 말로 옮겨, 뒤의 ‘진정성’과 구별했습니다.
- source_word: the Divine
  choice: 신학자 그레고리오스
  rationale: 전승 문맥상 ‘신학자’라는 칭호를 지닌 그레고리오스를 가리키는 것으로 보입니다. 다만 제공된 영어 증거 본문이 이 대목에서 훼손되었으므로 결락 표시와 함께 제시했습니다.
- source_word: genuineness
  choice: 진정성
  rationale: ‘영감성’과 동일시하지 않고, 이 책이 참되고 권위 있는 전승에 속한다는 주장의 폭을 보존하는 표현을 택했습니다.
- source_word: Apocalypse
  choice: 『묵시록』
  rationale: 한국어 교회 및 문헌 전통에서 작품명을 나타내는 익숙하고 중립적인 명칭을 사용했습니다.
theological_decisions:
- issue: ‘영감성’과 ‘진정성’의 관계
  choice: 두 개념을 별개의 표현으로 유지했습니다.
  alternative: 둘 다 ‘정경성과 영감’을 뜻하는 하나의 주장으로 풀어 쓸 수 있습니다.
  rationale: 증거 본문은 inspiration과 genuineness를 각각 사용하므로, 둘 사이의 신학적 관계를 번역에서 미리 확정하지 않았습니다.
- issue: 훼손된 인명 ‘Papias’의 확정 여부
  choice: '[파피아스?]로 표시했습니다.'
  alternative: 문헌의 편제와 알려진 병행 전승에 따라 ‘파피아스’로 확정할 수 있습니다.
  rationale: 제공된 증거 본문 자체의 인명이 ‘Pz’로 훼손되어 있고 원어 대조가 보류 중이므로 불확실성을 드러냈습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 교부 인명은 통용되는 음역으로 정리했고, 문헌 제목은 겹낫표로 표시했습니다. 훼손된 본문을 매끄럽게 메우지 않고 결락과 인명 불확실성을 본문 및 각주에 드러냈습니다.
