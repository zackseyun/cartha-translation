  yaml_path: translation/extra_canonical/fragments_of_papias/004.yaml
  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: ko
  text: '## 파피아스 단편 V


    신학자 요한의 제자이며 폴리카르포스의 동료였던 히에라폴리스의 감독 파피아스는 『주님의 말씀』 다섯 권을 썼습니다. 그는 사도들의 명단을 제시하면서 베드로와 요한, 빌립과 도마와 마태 다음에 아리스티온과 또 다른 요한도 주님의 제자들 가운데 포함시켰으며, 이 요한을 “장로”라고도 불렀습니다.


    [그는 말하기를], 어떤 이들은 요한의 이름으로 전해지는 짧은 공동서신[a] 두 편을 이 요한이 썼다고 생각한다고 합니다. 그들이 내세우는 근거는 초기의 교부들이 첫째 서신만을 받아들였다는 것입니다. 또 어떤 이들은 묵시록도 이 요한, 곧 장로 요한의 작품이라고 잘못 여겼습니다. 파피아스 역시 천년설[b]에 관하여 잘못을 범했으며, 이레나이오스도 그에게서 영향을 받아 잘못을 범했습니다.


    파피아스는 자신의 둘째 책에서 신학자 요한과 그의 형제 야고보가 유대인들에게 죽임을 당했다고 말합니다. 앞서 말한 파피아스는 빌립의 딸들에게서 들은 이야기를 근거로 다음과 같이 전했습니다. 바르사바라고도 하고 유스도라고도 하는 사람이 믿지 않는 자들의 도전을 받고 주님의 이름으로 뱀의 독을 마셨지만, 아무런 해도 입지 않도록 보호받았다는 것입니다. 그는 이 밖에도 놀라운 이야기들을 전하는데, 특히 죽은 자들 가운데서 살아난 마나임의 어머니[c]에 관한 이야기를 전합니다. 그리스도께서 죽은 자들 가운데서 살리신 사람들은 하드리아누스 시대까지 살아 있었다고도 말합니다.


    — 시데의 필리포스(?), 『그리스도교 역사』


    ## VI


    도미티아누스 뒤를 이어 네르바가 일 년 동안 다스렸습니다. 그는 요한을 그 섬, 곧 파트모스에서 돌아오게 하여 에베소에 살도록 허락했습니다. 당시 요한은 열두 사도 가운데 홀로 살아남은 사람이었으며, 자신의 복음서를 쓴 뒤 순교의 영예를 받았습니다.


    그를 직접 본 증인이었던 히에라폴리스의 감독 파피아스가 『주님의 말씀』 둘째 책에서 요한이 유대인들에게 죽임을 당했다고 말하기 때문입니다. 이로써 요한은 자기 형제와 함께 그들에 관하여 하신 그리스도의 예언과, 그들이 그리스도를 위하여 했던 고백과 약속을 분명히 이루었습니다. 주님께서 그들에게 “내가 마시는 잔을 너희가 마실 수 있느냐?”라고 물으셨을 때, 그들이 선뜻 그렇다고 대답하며 동의하자 주님께서는 “너희가 내 잔을 마실 것이며, 내가 받는 세례를 너희도 받을 것이다”라고 말씀하셨습니다. 이는 당연한 일입니다. 하나님께서는 거짓말하실 수 없기 때문입니다.


    학식 있는 오리게네스도 『마태복음 주해』에서 요한이 순교했다고 확언하면서, 자신이 그 사실을 사도들의 계승자들에게서 배웠다고 밝힙니다. 또한 박식한 에우세비오스도 『교회사』에서 이렇게 말합니다. “도마는 제비를 뽑아 파르티아를 받았고, 요한은 아시아를 받았습니다. 요한은 그곳에 거처를 정했으며 에베소에서 죽었습니다.”[d]


    — 게오르기오스 하마르톨로스, 『연대기』'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “공동서신”은 특정 한 교회가 아니라 여러 교회를 대상으로 한 보편적 서신이라는 뜻입니다. 여기서는 요한이서와 요한삼서를 가리킵니다.
    reason: ‘catholic’이 특정 현대 교파를 뜻하는 것으로 오해될 수 있어 설명했습니다.
  - marker: b
    text: 곧 그리스도의 천년 통치에 관한 종말론적 견해를 말합니다. 이 문장의 평가는 파피아스의 말을 보존한 후대 저자의 판단입니다.
    reason: 신학 용어의 뜻과 평가의 화자를 구별했습니다.
  - marker: c
    text: “마나임”이라는 이름과 이 인물의 신원은 전승 과정에서 불확실합니다. 현 단계 번역은 제공된 영문 증언의 표기를 따릅니다.
    reason: 직접적인 그리스어·라틴어 원문 대조가 보류된 상태이며 고유명사의 판독이 불확실합니다.
  - marker: d
    text: 제공된 영문 증언에는 “에베소” 뒤에 물음표가 있어 판독 또는 인용의 불확실성을 시사합니다. 본문은 문맥에 맞게 옮겼지만, 직접 원문 대조가 필요합니다.
    reason: 손상되거나 불명확한 증언을 확정적으로 보이지 않도록 문헌상의 불확실성을 밝혔습니다.
lexical_decisions:
- source_word: John the Divine
  choice: 신학자 요한
  rationale: 후대 교회 문헌의 전통적 호칭을 살리되, 본문 속 ‘장로 요한’과 구별되도록 일관되게 옮겼습니다.
- source_word: Oracles of the Lord
  choice: 『주님의 말씀』
  rationale: logia에 해당하는 전승적 의미를 ‘말씀’으로 나타내고, 현존하지 않는 저술의 명칭임을 서명 부호로 표시했습니다.
- source_word: the Elder
  choice: 장로
  rationale: 교회 직분 또는 존칭일 수 있는 원문의 여지를 유지하며 ‘원로’로 단정하지 않았습니다.
- source_word: catholic Epistles
  choice: 공동서신
  rationale: 현대 한국어 성서학에서 널리 쓰이는 중립적 용어로, 로마 가톨릭 교파를 뜻한다는 오해를 피했습니다.
- source_word: Apocalypse
  choice: 묵시록
  rationale: 문맥상 요한계시록을 가리키지만, 증언 자체의 명칭을 존중하여 일반적인 고대 문헌명 ‘묵시록’으로 옮겼습니다.
- source_word: Millennium
  choice: 천년설
  rationale: 단순한 기간보다 종말론적 견해를 비판하는 문맥이므로 ‘천년설’로 옮겼습니다.
- source_word: received the honour of martyrdom
  choice: 순교의 영예를 받았습니다
  rationale: 후대 증언자의 가치 판단이 담긴 표현을 삭제하거나 중립화하지 않고 보존했습니다.
theological_decisions:
- issue: 짧은 두 요한서신의 저자
  choice: 일부 사람들이 장로 요한을 저자로 생각했다는 간접 증언으로 번역
  alternative: 두 서신을 장로 요한의 저작으로 확정
  rationale: 본문은 저자 문제를 확정하지 않고 ‘어떤 이들은 … 생각한다’고 보고하므로 그 불확실성을 유지했습니다.
- issue: 파피아스와 이레나이오스의 천년설
  choice: 후대 증언자가 두 사람의 견해를 ‘잘못’이라고 평가한 문장으로 보존
  alternative: 천년설을 중립적으로 소개하거나 평가를 삭제
  rationale: 이는 단편을 보존한 저자의 명시적 평가이므로 번역자가 완화하지 않았습니다.
- issue: 요한의 순교 전승
  choice: 요한이 유대인들에게 죽임을 당했다는 전승을 증언자의 주장으로 제시
  alternative: 일반적인 요한의 자연사 전승과 조화시키기
  rationale: 이 단편은 서로 긴장되는 고대 전승을 담고 있으므로 다른 전승에 맞추어 수정하지 않았습니다.
- issue: 하나님께서는 거짓말하실 수 없다는 논증
  choice: 증언자의 신학적 추론을 그대로 유지
  alternative: 단순히 예언이 성취되었다고 의역
  rationale: 순교 전승을 그리스도의 말씀과 하나님의 진실성에 연결하는 원문의 논리와 긴장을 보존했습니다.
- issue: 그리스도께서 살리신 이들이 하드리아누스 시대까지 생존했다는 주장
  choice: 파피아스에게 귀속된 전승으로 한정하여 번역
  alternative: 역사적 사실로 직접 진술
  rationale: 보고 문맥을 분명히 하여 번역자가 그 주장을 별도로 확증하는 인상을 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 증언자의 논평과 인용된 전승을 구별하되 문체는 품위 있고 쉽게 읽히도록 다듬었습니다. 제공 자료가 OCR 손상이 있는 공용 영문 증언이며 그리스어·라틴어 직접 검토가 보류되어 있으므로, 명백한 행갈이와 철자 손상은 복원하되 논쟁적 내용과 문헌적 불확실성은 각주로 보존했습니다.
