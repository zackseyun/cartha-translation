  revised_text: '## 파피아스 단편 V



    신학자 요한의 제자이며 폴리카르포스의 동료였던 히에라폴리스의 감독 파피아스는 『주님의 말씀』 다섯 권을 썼습니다. 그는 사도들의 명단을 제시하면서 베드로와 요한, 빌립과 도마와 마태 다음에 아리스티온과 또 다른 요한을 주님의 제자들 가운데 포함시켰으며, 이 요한을 “장로”라고도 불렀습니다.



    [그는 말하기를], 어떤 이들은 요한의 이름으로 전해지는 짧은 공동서신[a] 두 편을 이 요한이 썼다고 생각합니다. 그들이 내세우는 근거는 초기의 교부들이 첫째 서신만을 받아들였다는 것입니다. 또 어떤 이들은 묵시록도 이 요한, 곧 장로 요한의 작품이라고 잘못 여겼습니다. 파피아스 역시 천년설[b]에 관하여 잘못을 범했으며, 이레나이오스도 그에게서 영향을 받아 잘못을 범했습니다.



    파피아스는 자신의 둘째 책에서 신학자 요한과 그의 형제 야고보가 유대인들에게 죽임을 당했다고 말합니다. 앞서 말한 파피아스는 빌립의 딸들에게서 들은 이야기를 근거로 다음과 같이 전했습니다. 바르사바라고도 하고 유스도라고도 하는 사람이 믿지 않는 자들의 도전을 받고 주님의 이름으로 뱀의 독을 마셨지만, 아무런 해도 입지 않도록 보호받았다는 것입니다. 그는 이 밖에도 놀라운 이야기들을 전하는데, 특히 죽은 자들 가운데서 살아난 마나임의 어머니[c]에 관한 이야기를 전합니다. 그리스도께서 죽은 자들 가운데서 살리신 사람들은 하드리아누스 시대까지 살아 있었다고도 말합니다.



    — 시데의 필리포스(?), 『그리스도교 역사』



    ## VI



    도미티아누스 뒤를 이어 네르바가 일 년 동안 다스렸습니다. 그는 요한을 그 섬, 곧 파트모스에서 돌아오게 하여 에베소에 살도록 허락했습니다. 당시 요한은 열두 사도 가운데 홀로 살아남은 사람이었으며, 자신의 복음서를 쓴 뒤 순교의 영예를 받았습니다.



    이는 그를 직접 본 증인이었던 히에라폴리스의 감독 파피아스가 『주님의 말씀』 둘째 책에서 요한이 유대인들에게 죽임을 당했다고 말하기 때문입니다. 이로써 요한은 자기 형제와 함께 그 두 사람에 대하여 하신 그리스도의 예언과, 두 사람이 그리스도를 위하여 했던 고백과 약속을 분명히 이루었습니다. 주님께서 그들에게 “내가 마시는 잔을 너희가 마실 수 있느냐?”라고 물으셨을 때, 그들이 선뜻 그렇다고 대답하며 동의하자 주님께서는 “너희가 내 잔을 마실 것이며, 내가 받는 세례를 너희도 받을 것이다”라고 말씀하셨습니다. 이는 당연한 일입니다. 하나님께서는 거짓말하실 수 없기 때문입니다.



    학식 있는 오리게네스도 『마태복음 주해』에서 요한이 순교했다고 확언하면서, 자신이 그 사실을 사도들의 계승자들에게서 배웠다고 밝힙니다. 또한 박식한 에우세비오스도 『교회사』에서 이렇게 말합니다. “도마는 제비를 뽑아 파르티아를 받았고, 요한은 아시아를 받았습니다. 요한은 그곳에 거처를 정했으며 에베소에서 죽었습니다[?].”[d]



    — 게오르기오스 하마르톨로스, 『연대기』'
