  source_fidelity: 제공된 영어 증언의 ‘practised guilelessness towards God’는 하나님과 관련하여 꾸밈없고 악의 없는 태도를 지속적으로 실천했다는 뜻입니다. 초안의 ‘하나님을 대하여’는 현대 한국어로 부자연스럽고, ‘거짓 없이 행한’도 다소 직역투입니다. 또한 ‘used to call’의 반복·습관적 뉘앙스는 ‘부르곤 했습니다’가 더 잘 보존합니다. 원어 직접 검토가 보류된 상태이므로 저술명은 영어 증언에 충실하게 유지하되, 잠정성 각주를 보존합니다.
