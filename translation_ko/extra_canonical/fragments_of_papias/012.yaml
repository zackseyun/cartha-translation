base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: ko
  text: '하나님께 대하여 꾸밈없이 행한 이들을 사람들은 ‘어린아이들’이라고 부르곤 했습니다. 파피아스도 『주님의 말씀 해설』 제1권에서 이를 보여 주고, 알렉산드리아의 클레멘스도 『교육자』에서 이를 보여 줍니다.[a]


    —고백자 막시무스, 『아레오파고스 사람 디오니시우스의 저술에 붙인 주해』, 「교회 위계에 관하여」 제2장'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 단편은 고백자 막시무스의 주해에 보존되어 전해집니다. 여기서는 제공된 공공 영역 영어 번역 증언을 바탕으로 옮겼으며, 그리스어·라틴어 원문에 대한 직접 검토는 아직 이루어지지 않았습니다. 파피아스의 저술명도 잠정적으로 『주님의 말씀 해설』이라 옮겼습니다.
    reason: 전승 출처와 현재 번역의 증거적 한계를 투명하게 밝히고, 저술명 번역의 잠정성을 표시합니다.
lexical_decisions:
- source_word: practised guilelessness towards God
  choice: 하나님을 대하여 거짓 없이 행한
  rationale: ‘guilelessness’의 도덕적·관계적 의미를 ‘거짓 없이’로 살리고, 단순한 성품 묘사보다 실제 삶의 태도를 나타내는 ‘행한’을 사용했습니다.
- source_word: children
  choice: ‘어린아이들’
  rationale: 은유적 호칭임을 드러내면서 원문의 평이한 표현과 신학적 여지를 그대로 보존했습니다.
- source_word: Expositions of the Lord
  choice: 『주님의 말씀 해설』
  rationale: 파피아스 저술의 통상적으로 알려진 내용을 자연스러운 한국어 서명으로 나타냈습니다. 다만 제시된 증거가 영어 번역 증언이므로 각주에서 잠정성을 밝혔습니다.
- source_word: Paedagogue
  choice: 『교육자』
  rationale: 클레멘스 저술명의 의미를 현대 한국어 독자가 이해할 수 있도록 번역했습니다.
theological_decisions:
- issue: ‘어린아이들’의 의미
  choice: 은유를 해설 없이 본문에 유지함
  alternative: ‘하나님의 자녀들’ 또는 ‘영적으로 순수한 사람들’로 풀이함
  rationale: 원문 증언은 ‘children’이라는 호칭만 제시하므로, 교리적 의미나 대상 관계를 덧붙이지 않았습니다.
- issue: 행위 주체가 명시되지 않은 ‘they’
  choice: ‘사람들은’으로 비특정 주어를 유지함
  alternative: ‘초대 교회 사람들은’ 또는 특정 집단명 사용
  rationale: 증언이 호칭을 사용한 집단을 특정하지 않으므로 역사적 주체를 임의로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 짧은 인용 단편의 성격을 살리고, 인용문과 후대 보존자의 서지 표기를 분리했습니다. 원문의 비특정 주어와 ‘어린아이들’이라는 신학적 은유를 과도하게 해석하지 않았습니다.
