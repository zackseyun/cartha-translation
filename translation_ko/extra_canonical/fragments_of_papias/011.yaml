review_pass:
  verdict: revise
  source_fidelity: 전반적인 전승의 구조와 종말론적·풍요의 묘사는 잘 보존했습니다. 그러나 포도나무의 증식 단계에서 원문의 shoots–branches–twigs 구별이 충분히 드러나지 않고, ‘in their turn’을 시간적 순서인 ‘차례로’로 옮긴 것은 부정확합니다. 또한 다른 포도송이의 ‘take me’에 ‘따서’라는 수확 방식의 해석을 덧붙인 점은 피하는 것이 안전합니다.
  naturalness: 합쇼체는 대체로 자연스럽습니다. 다만 ‘포도나무마다 가지가 만 개이고, 가지마다 곁가지가 만 개’는 첫 단계가 빠져 있고, ‘온전히 순종하며 사람에게 복종’은 의미가 중복됩니다. 이를 자연스러운 병렬 표현으로 다듬었습니다.
  terminology: ‘왕국’, ‘피조물’, ‘성도’, ‘주님’, ‘의인’, ‘폴리카르포스’는 문맥과 현대 한국어 문헌 등록에 적절합니다. 계량 단위를 현대 단위로 단정하지 않은 처리도 적절합니다. ‘장로들’은 초기 전승의 elders를 보존하므로 유지했습니다.
  issues:
  - severity: medium
    issue: 포도나무 증식의 첫 단계와 단계적 구별이 불명확합니다.
    rationale: 영어 증언은 vine마다 shoots, 각 shoot마다 branches, 각 branch마다 twigs라고 세 단계를 구별합니다. 초안은 ‘가지–곁가지–잔가지’로 시작하여 shoots에 해당하는 첫 단계를 사실상 ‘가지’로 흡수합니다.
  - severity: medium
    issue: ‘in their turn’을 ‘차례로’로 번역했습니다.
    rationale: 이 문맥은 동물들이 시간 순서대로 변한다는 뜻보다, 그들도 그 결과/그에 상응하여 평화롭고 조화롭게 된다는 뜻입니다.
  - severity: low
    issue: ‘take me’에 ‘나를 따서’라는 구체적 행위를 보탰습니다.
    rationale: 원문은 다른 포도송이가 ‘나를 데려가라/취하라’고 말하는 형태입니다. 수확 방식인 ‘따다’를 명시하지 않는 편이 더 충실합니다.
  - severity: low
    issue: ‘온전히 순종하며 사람에게 복종’은 중복됩니다.
    rationale: obedient to man in all subjection은 사람에게 전적으로 복종한다는 한 표현으로 자연스럽게 옮길 수 있습니다.
  revised_text: '이렇게 예고된 복은 의심할 여지 없이 왕국의 때에 속합니다. 그때 의인들은 죽은 사람들 가운데서 살아나 다스릴 것이며, 피조물도 새롭게 되어 속박에서 풀려나 하늘의 이슬과 땅의 기름진 것으로 온갖 먹거리를 풍성히 낼 것입니다. 주님의 제자 요한을 본 장로들은, 주님께서 그때에 관하여 늘 이렇게 가르치며 말씀하셨다고 요한에게서 들은 바를 전합니다.


    “포도나무들이 자라날 날이 올 것입니다. 포도나무마다 싹이 만 개이고, 싹마다 가지가 만 개이며, 가지마다 다시 잔가지가 만 개이고, 잔가지마다 포도송이가 만 개이며, 포도송이마다 포도알이 만 개일 것입니다. 포도알 하나를 짜면 포도주 스물다섯 단위[a]가 나올 것입니다. 성도 가운데 누군가가 그 포도송이들 가운데 하나를 붙잡으면, 다른 포도송이가 ‘내가 더 좋은 포도송이입니다. 나를 취하여, 나를 통하여 주님을 찬송하십시오’ 하고 외칠 것입니다. 이와 마찬가지로 밀알 하나가 이삭 만 개를 내고, 이삭마다 낟알이 만 개이며, 낟알마다 밝고 깨끗한 고운 밀가루 열 파운드[b]를 낼 것입니다. 다른 열매와 씨앗과 풀도 그와 같은 비율로 소출을 낼 것입니다. 땅에서 난 이 열매들을 먹는 모든 동물도 온순하고 서로 조화롭게 되어, 모든 면에서 사람에게 복종하게 될 것입니다.”


    “이것들은 요한의 말을 들은 사람이자 폴리카르포스의 동료이며 옛 시대의 존경받는 인물인 파피아스가 자기 책 제4권에 글로 증언한 일들입니다. 그가 쓴 책은 모두 다섯 권입니다.” 그는 또 이렇게 덧붙였습니다.


    “그러나 이 일들은 믿는 사람들에게는 믿을 만합니다.”


    배반자 유다가 믿지 않고 “주님께서 어떻게 이처럼 풍성한 소출이 나게 하시겠습니까?” 하고 묻자, 파피아스는 주님께서 “그때에 이르는 사람들이 보게 될 것입니다”라고 말씀하셨다고 전합니다.


    — 이레나이오스, 『이단 반박』 5.33.3–4'
