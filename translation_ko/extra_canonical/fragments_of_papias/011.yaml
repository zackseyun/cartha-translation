base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: ko
  text: '이렇게 예고된 복은 의심할 여지 없이 왕국의 때에 속합니다. 그때 의인들은 죽은 사람들 가운데서 살아나 다스릴 것이며, 피조물도 새롭게 되어 속박에서 풀려나 하늘의 이슬과 땅의 기름진 기운으로 온갖 먹거리를 풍성히 낼 것입니다. 주님의 제자 요한을 직접 본 장로들은 그에게서 들은 바를 이렇게 전합니다. 곧 주님께서 그때에 관하여 늘 이렇게 가르치며 말씀하셨다는 것입니다.


    “포도나무들이 자라날 날이 올 것입니다. 포도나무마다 가지가 만 개이고, 가지마다 곁가지가 만 개이며, 곁가지마다 잔가지가 만 개이고, 잔가지마다 포도송이가 만 개이며, 포도송이마다 포도알이 만 개일 것입니다. 포도알 하나를 짜면 포도주 스물다섯 단위[a]가 나올 것입니다. 성도 가운데 누군가가 포도송이 하나를 붙잡으면 다른 송이가 ‘내가 더 좋은 송이입니다. 나를 따서 나를 통하여 주님을 찬송하십시오’ 하고 외칠 것입니다. 이와 마찬가지로 밀알 하나가 이삭 만 개를 내고, 이삭마다 낟알이 만 개이며, 낟알마다 밝고 깨끗한 고운 밀가루 열 파운드[b]를 낼 것입니다. 다른 열매와 씨앗과 풀도 그와 같은 비율로 소출을 낼 것입니다. 땅에서 난 이 열매들을 먹는 모든 동물도 차례로 온순하고 서로 화목해져, 온전히 순종하며 사람에게 복종할 것입니다.”


    “요한의 말을 들은 사람이자 폴리카르포스의 동료인 옛날의 존경받는 인물 파피아스가 바로 이 일들을 자기 책 제4권에 글로 증언합니다. 그가 쓴 책은 모두 다섯 권입니다.” 그는 또 이렇게 덧붙였습니다.


    “그러나 이 일들은 믿는 사람들에게는 믿을 만합니다.”


    배반자 유다가 믿지 않고 “주님께서 어떻게 이처럼 풍성한 소출이 나게 하시겠습니까?” 하고 묻자, 주님께서는 “그때에 이르는 사람들이 보게 될 것입니다”라고 말씀하셨다고 파피아스는 전합니다.


    — 이레나이오스, 『이단 반박』 5.33.3–4'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘스물다섯 단위’에 해당하는 고대 용량 단위의 정확한 명칭과 크기는 직접적인 그리스어·라틴어 원문 검토가 필요합니다. 여기서는 제공된 영어 증언의 measures를 중립적으로 옮겼습니다.
    reason: 고대 계량 단위를 근거 없이 현대 용량으로 환산하는 것을 피하기 위해서입니다.
  - marker: b
    text: ‘파운드’는 제공된 영어 증언의 pounds를 따른 것입니다. 고대 원문이 가리키는 실제 중량 단위와 현대 파운드는 일치하지 않을 수 있습니다.
    reason: 직접적인 원어 검토가 보류되어 있어 계량상의 불확실성을 알리기 위해서입니다.
lexical_decisions:
- source_word: the times of the Kingdom
  choice: 왕국의 때
  rationale: 종말론적 함의를 유지하되 특정 교파의 천년왕국 용어를 본문에 덧붙이지 않았습니다.
- source_word: creation
  choice: 피조물
  rationale: 자연계만이 아니라 창조된 세계를 폭넓게 가리킬 수 있는 표현을 택했습니다.
- source_word: fatness of the earth
  choice: 땅의 기름진 기운
  rationale: 토지의 비옥함이라는 의미를 현대 한국어로 자연스럽게 전달하면서 원문의 풍요로운 이미지를 보존했습니다.
- source_word: measures
  choice: 단위
  rationale: 직접적인 고대어 검토가 보류된 상태에서 특정 용량으로 환산하지 않고 불확실성을 각주로 밝혔습니다.
- source_word: credible
  choice: 믿을 만합니다
  rationale: ‘믿는 사람들에게 믿어진다’는 어의를 살리면서도 한국어로 자연스럽게 옮겼습니다.
- source_word: hearer of John
  choice: 요한의 말을 들은 사람
  rationale: ‘제자’로 단정하지 않고 청자·수강자라는 증언의 표현을 유지했습니다.
theological_decisions:
- issue: 왕국과 부활 뒤의 통치
  choice: 왕국의 때에 의인들이 살아나 다스린다는 문장을 그대로 보존
  alternative: 특정한 문자적 천년왕국 또는 상징적 통치로 명시
  rationale: 보존 문헌이 제시하는 종말론적 진술을 옮기되 그 체계를 특정 교리로 해설하지 않았습니다.
- issue: 풍요에 관한 묘사의 성격
  choice: 주님의 직접 인용으로 전승된 과장적·기적적 묘사를 그대로 번역
  alternative: 비유 또는 문자적 예언이라고 규정
  rationale: 본문 자체가 그 성격을 명시하지 않으므로 해석을 덧붙이지 않았습니다.
- issue: 유다의 질문에 대한 마지막 답변
  choice: ‘그때에 이르는 사람들이 보게 될 것입니다’
  alternative: ‘그 시대에 들어갈 자들이 볼 것이다’ 또는 ‘그 일에 이르는 자들이 볼 것이다’
  rationale: 지시 대상이 시대인지 사태인지 다소 모호하므로 본문의 괄호 해석을 반영하되 단정적 확장을 피했습니다.
- issue: 요한의 정체
  choice: 주님의 제자 요한
  alternative: 사도 요한
  rationale: 증언의 표현을 따르고 ‘사도’라는 추가 식별은 본문에 도입하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 인용된 예언은 장중하되 쉽게 읽히도록 문장을 나누었고, 전승을 소개하는 서술은 문헌적 거리를 유지했습니다. 제공 자료가 공공 영역 영어 증언이며 그리스어·라틴어 직접 검토가 보류되어 있으므로, 계량 단위에는 각주를 달고 식별과 교리적 해석은 최소화했습니다.
