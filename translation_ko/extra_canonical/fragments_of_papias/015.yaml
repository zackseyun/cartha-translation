base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: ko
  text: '아폴리나리우스: “유다는 목매달려 죽은 것이 아니라, 숨이 막히기 전에 끌어 내려졌기 때문에 살아 있었습니다. 사도행전도 이 사실을 보여 줍니다. 그는 곤두박질하여 몸통이 한가운데서 터지고 내장이 모두 쏟아져 나왔습니다. 요한의 제자 파피아스는 『주님의 말씀 해설』 제4권에서 이 일을 다음과 같이 더 분명하게 전합니다.


    ‘유다는 불경건의 끔찍한 본보기로 이 세상을 돌아다녔습니다. 그의 살은 너무나 부풀어 올라, 수레 한 대가 쉽게 지나갈 만한 곳도 그는 지나갈 수 없었으며, 아니, 그의 머리만도 지나갈 수 없었습니다.[a] 사람들의 말에 따르면, 그의 눈꺼풀은 몹시 부풀어 올라 빛을 전혀 볼 수 없었고,[b] 눈은 표면에서 너무 깊이 들어가 있어서 의사가 기구를 들여다보아도 보이지 않았습니다……’”


    크레이머의 『거룩한 사도들의 행전에 대한 카테나』(1838년), 12쪽 이하 및 그 밖의 자료에서 편집함.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 전승문은 손상되었거나 판독이 불분명합니다. 뜻은 대체로 ‘수레가 쉽게 지나갈 만한 곳도 유다는 지나갈 수 없었고, 그의 머리만도 지나갈 수 없었다’는 것입니다.
    reason: 제공된 영문 증거 본문에 OCR 손상과 ‘text unclear’ 표시가 있어 재구성의 불확실성을 독자에게 알립니다.
  - marker: b
    text: ‘몹시’로 옮긴 부분에는 제공된 증거 본문에 결락이 있습니다. 문맥에 따라 정도를 나타내는 말로 최소한 보완했습니다.
    reason: 원문 증거가 아닌 손상된 영문 증거를 바탕으로 한 보완임을 투명하게 밝힙니다.
  - marker: c
    text: 이 번역은 제공된 공공 영역 영문 증거를 바탕으로 한 잠정 번역입니다. 그리스어·라틴어 전승에 대한 직접 검토가 필요합니다.
    reason: 자료 자체가 source-language review pending이라고 명시하므로 번역의 증거적 한계를 기록합니다.
lexical_decisions:
- source_word: impiety
  choice: 불경건
  rationale: 신이나 경건에 대한 거스름을 뜻하는 종교적·윤리적 의미를 유지하면서 현대 한국어에서 자연스럽고 격조 있게 전달합니다.
- source_word: walked about in this world
  choice: 이 세상을 돌아다녔습니다
  rationale: 유다가 죽지 않고 한동안 살아 움직였다는 문맥을 살리되, 원문의 다소 기이한 표현을 과도하게 해석하지 않았습니다.
- source_word: burst asunder in the midst
  choice: 몸통이 한가운데서 터지고
  rationale: 사도행전 1:18을 암시하는 표현의 신체적 의미를 분명히 하면서도, 정확한 해부학적 위치를 원문 이상으로 특정하지 않았습니다.
- source_word: instrument
  choice: 기구
  rationale: 어떤 종류의 의료·관찰 도구인지 불분명하므로 ‘기구’라는 포괄적 표현으로 모호성을 보존했습니다.
- source_word: the Oracles of the Lord
  choice: 주님의 말씀
  rationale: ‘oracles’가 주님의 발언이나 전승된 말씀을 가리킬 수 있으므로, 특정 정경론적 의미를 덧붙이지 않는 자연스러운 명칭을 택했습니다.
theological_decisions:
- issue: 유다의 죽음에 관한 마태복음과 사도행전의 관계
  choice: 아폴리나리우스가 제시하는 조화 방식, 곧 유다가 목맨 뒤 즉시 죽지 않았다는 주장을 그대로 인용문으로 제시함
  alternative: 두 성경 기록이 모순되지 않는다는 해설을 번역자가 추가함
  rationale: 본문은 후대 저자의 주장이지 번역자의 판정이 아닙니다. 따라서 그 주장을 충실히 전달하되 정경 본문 사이의 관계를 별도로 해결하거나 교리화하지 않았습니다.
- issue: ‘요한의 제자’라는 파피아스의 신분 규정
  choice: 본문의 전승대로 ‘요한의 제자’로 번역함
  alternative: 어느 요한인지 특정하거나 역사적 확실성에 관한 평가를 덧붙임
  rationale: 증언 자체의 표현을 보존하고, ‘요한’의 정체나 역사성에 관한 논쟁을 번역에 끌어들이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 인용 구조를 분명히 하고 고대 증언 특유의 충격적인 신체 묘사는 완곡하게 삭제하지 않았습니다. 다만 손상된 증거 본문은 추정으로 확정하지 않고 각주로 밝혔으며, 서지 문구는 본문과 구별했습니다.
