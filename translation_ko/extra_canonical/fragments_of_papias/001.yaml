base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: ko
  text: '이레나이우스와 그 밖의 사람들은 신학자이자 사도인 요한이 트라야누스 시대까지 생존했다고 전합니다. 그 뒤에 그의 가르침을 들은 히에라폴리스의 파피아스와 스미르나의 감독 폴리카르포스가 널리 알려졌습니다.


    —에우세비오스, 『연대기』(싱켈로스 655, 14), 제220회 올림피아드


    II


    이 무렵 아시아에서는 사도들의 제자인 폴리카르포스가 명성을 떨쳤습니다. 그는 [스미르나 교회와 “…… 주님의 사역자들”에 관한 본문이 훼손되어 판독할 수 없음].[a] 같은 무렵 히에라폴리스 교구의 감독이기도 했던 파피아스도 이름을 떨쳤습니다.


    —에우세비오스, 『교회사』 3.36.1–2


    [a] 제공된 영문 판본의 이 부분은 심하게 훼손되었거나 OCR로 잘못 인식되어, 문장을 신뢰성 있게 복원할 수 없습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영문 판본의 이 부분은 심하게 훼손되었거나 OCR로 잘못 인식되어, 문장을 신뢰성 있게 복원할 수 없습니다.
    reason: 판독 불가능한 내용을 매끄럽게 추정하여 원문인 것처럼 제시하지 않기 위해서입니다.
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: 신학자이자 사도인 요한
  rationale: ‘the Divine’는 여기서 신성을 지닌 존재라는 뜻으로 오해되지 않도록, 요한에게 전통적으로 붙은 호칭 ‘신학자’를 사용했습니다.
- source_word: his hearers
  choice: 그의 가르침을 들은
  rationale: 단순히 소리를 들었다는 뜻보다 스승의 가르침을 직접 청종한 사람이라는 관계를 자연스럽게 드러냅니다.
- source_word: flourished / became distinguished
  choice: 명성을 떨쳤습니다 / 이름을 떨쳤습니다
  rationale: 해당 시대에 활약하며 두드러졌다는 역사 서술의 의미를 현대 한국어로 전달하되, 두 표현의 문맥상 차이를 살렸습니다.
- source_word: bishop / diocese
  choice: 감독 / 교구
  rationale: 고대 교회의 직분과 관할 지역을 특정 현대 교파의 용어로 과도하게 동일시하지 않으면서 통용되는 역사 용어를 사용했습니다.
theological_decisions:
- issue: ‘John the Divine’의 칭호
  choice: ‘신학자’로 번역
  alternative: ‘신적인 요한’ 또는 ‘성 요한’
  rationale: 요한의 본성에 관한 신학적 주장을 새로 덧붙이지 않고, 전승상의 저술가·신학자 칭호로 이해되도록 했습니다.
- issue: 폴리카르포스를 ‘사도들의 제자’라고 한 증언
  choice: 원 증언의 복수형을 그대로 보존
  alternative: 특정 사도의 제자로 한정
  rationale: 제공된 증언이 특정 사도를 지목하지 않으므로 그 모호성과 역사적 주장을 그대로 유지했습니다.
- issue: 훼손된 둘째 인용문의 내용
  choice: 추정 복원하지 않고 훼손 사실을 표시
  alternative: 후대 판본을 바탕으로 문장을 재구성
  rationale: 직접적인 그리스어·라틴어 원문 검토가 아직 이루어지지 않았고 제공 판본도 심하게 손상되어 있으므로, 교회 직분과 계승에 관한 내용을 자의적으로 보충하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했으며, 고대 교회사 문헌에 어울리는 간결하고 품위 있는 문체를 유지했습니다. 다만 이 초안은 제공된 공용 영문 증언에 근거한 잠정 번역으로, 그리스어·라틴어 원자료 대조가 필요합니다.
