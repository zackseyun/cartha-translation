base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: ko
  text: '여기서 요한에 따른 복음서의 개요가 시작됩니다.


    요한복음은 요한이 아직 몸 안에 머물러 있을 때 그에 의해 교회들에 알려지고 전해졌습니다. 히에라폴리스 출신으로 요한의 사랑받는 제자인 파피아스라는 사람이 자신의 다섯 권의 대중용 저술[a]에서 그렇게 전했습니다. 그리고 그는 요한이 불러 주는 대로 그 복음서를 정확히 기록했습니다.


    — 9세기 바티칸 사본


    XX[b]


    이들 가운데 마지막 사람인 요한, 곧 ‘천둥의 아들’이라는 별칭을 가진 이는 이미 매우 늙었을 때 복음서를 자신의 제자인 히에라폴리스의 덕망 있는 파피아스에게 불러 주어 기록하게 했습니다. 이레나이우스와 유세비우스와 그 뒤를 이은 신뢰할 만한 역사가들이 우리에게 전해 준 바에 따르면, 이는 무서운 이단들이 생겨난 무렵의 일이었습니다. 요한이 그렇게 한 것은 그보다 앞서 온 세상 모든 민족에게 말씀을 선포한 이들에게 부족했던 것을 채우기 위해서였습니다.


    — B. 코르더가 출판한 《성 요한에 관한 그리스 교부 연쇄 주석》[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 전승된 영어 증거문은 ‘대중용(exoteric)’이라고 읽되, 이를 ‘주해적(exegetical)’으로 교정해 읽으라는 제안을 괄호 안에 제시합니다.
    reason: 사본 또는 편집상의 이문 교정 제안을 본문에서 숨기지 않기 위해서입니다.
  - marker: b
    text: 제공된 증거문에는 단편 XIX에 이어 단편 XX의 표제와 본문도 함께 실려 있습니다.
    reason: 요청 식별자는 단편 XIX이지만 입력 자료의 실제 범위가 단편 XX까지 포함된다는 점을 밝히기 위해서입니다.
  - marker: c
    text: 라틴어 서명은 Catena Patrum Graecorum in S. Joannem에 해당하며, 요한복음에 관한 그리스 교부들의 발췌 연쇄 주석을 뜻합니다.
    reason: 생소한 문헌 제목의 성격을 독자가 이해하도록 돕기 위해서입니다.
lexical_decisions:
- source_word: argument
  choice: 개요
  rationale: 복음서 앞에 붙은 내용 소개 또는 서론을 가리키는 문헌적 용법을 자연스러운 현대 한국어로 옮겼습니다. 논증이라는 뜻으로 단정하지 않았습니다.
- source_word: while he yet remained in the body
  choice: 아직 몸 안에 머물러 있을 때
  rationale: 단순히 ‘살아 있을 때’로 풀어 의미를 확정하기보다, 육체 안에 있다는 고대 문헌의 표현을 보존했습니다.
- source_word: exoteric (read exegetical) books
  choice: 대중용 저술[a]
  rationale: 전승된 문구의 exoteric를 본문에 반영하되, exegetical로 교정해 읽으라는 편집상의 제안을 각주에 보존했습니다.
- source_word: at the dictation of John / dictated
  choice: 요한이 불러 주는 대로 … 기록했습니다 / 불러 주어 기록하게 했습니다
  rationale: 구술과 필기의 관계를 분명히 나타내면서도 한국어에서 기계적으로 들리는 표현을 피했습니다.
- source_word: Son of Thunder
  choice: ‘천둥의 아들’
  rationale: 성경 전승과 연결되는 별칭을 직역하여 보존했습니다.
- source_word: the word
  choice: 말씀
  rationale: 복음 선포의 문맥에서 신적 메시지를 뜻하는 용례를 반영하되, 특정한 교리적 해석을 덧붙이지 않았습니다.
theological_decisions:
- issue: ‘요한’과 파피아스의 관계 및 복음서 기록 방식
  choice: 증언문이 주장하는 대로 요한의 사랑받는 제자이며 구술 기록자였다고 번역했습니다.
  alternative: 역사적 확정 사실처럼 보이지 않도록 ‘~라고 한다’라는 거리를 본문 전반에 추가할 수 있습니다.
  rationale: 이 단편 자체의 주장을 약화하거나 강화하지 않고 그대로 전달했습니다. 다만 이는 후대 사본과 연쇄 주석에 보존된 증언이며, 번역문은 그 역사성을 별도로 판정하지 않습니다.
- issue: ‘부족했던 것을 채우다’의 대상
  choice: 앞선 선포자들 ‘에게 부족했던 것’이라는 문장 구조를 유지했습니다.
  alternative: 앞선 복음서들에서 빠진 내용을 보충했다고 해석할 수 있습니다.
  rationale: 제공된 증거는 ‘those who … proclaimed’라고 사람들을 지칭하므로, 이를 복음서 문헌으로 조용히 바꾸지 않았습니다.
- issue: ‘말씀’의 의미
  choice: 복음 선포의 내용으로 열어 두었습니다.
  alternative: 그리스도 자신을 가리키는 ‘말씀’으로 명시할 수 있습니다.
  rationale: 문맥만으로 요한복음 1장의 로고스 칭호를 확정하지 않고 신학적 긴장을 보존했습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 고대 증언문의 문헌적 품위를 유지하되 지나치게 고어적인 표현은 피했습니다. 직접적인 그리스어·라틴어 원문 검토가 아직 이루어지지 않았으므로, 제공된 공용 영역 영어 증거문을 바탕으로 한 잠정 번역입니다.
