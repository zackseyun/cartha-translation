base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/006.yaml
  text: 'Irenzeus, a disciple of Papias who was a hearer of John the Eva[...], relates.


    —Jerome, To Theodora, Letter 75 (29), chapter 3.'
translation:
  language: ko
  text: '복음사가 요한의 말을 들은 파피아스의 제자 이레네우스가 다음과 같이 전합니다.[a]


    —히에로니무스, 《테오도라에게 보낸 편지》 75(29), 3장'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증언은 ‘John the Eva’에서 갑자기 끝나며, 원문 훼손 표시는 없습니다. 여기서는 문맥상 ‘John the Evangelist’를 뜻하는 것으로 보고 ‘복음사가 요한’이라고 옮겼지만, 그 보충은 잠정적입니다. 그리스어·라틴어 원자료에 대한 직접 검토가 필요합니다.
    reason: 불완전한 영어 증언을 근거로 한 보충임을 독자에게 알리고, 원문에 없는 확정을 피하기 위해서입니다.
lexical_decisions:
- source_word: Irenzeus
  choice: 이레네우스
  rationale: 공개 영역 영어 증언의 철자는 비표준 형태로 보이며, 한국어에서 통용되는 고대 인명 표기인 ‘이레네우스’로 표준화했습니다.
- source_word: a disciple of Papias
  choice: 파피아스의 제자
  rationale: 인물 사이의 제자 관계를 원문의 구조대로 간결하게 보존했습니다.
- source_word: who was a hearer of John
  choice: 요한의 말을 들은
  rationale: ‘hearer’가 직접 청취자 또는 가르침을 받은 사람을 뜻할 수 있으므로, 더 강한 사제 관계를 단정하지 않는 표현을 택했습니다.
- source_word: the Eva[...]
  choice: 복음사가
  rationale: 문맥상 ‘Evangelist’를 가리키는 것으로 보이는 영어 증언의 미완 표현을 본문에서는 자연스럽게 옮기되, 증언의 절단 상태와 잠정성을 각주에 밝혔습니다.
- source_word: relates
  choice: 다음과 같이 전합니다
  rationale: 뒤이어 인용 또는 전승 내용이 나왔음을 시사하는 동사를 자연스러운 현대 한국어로 옮겼습니다.
theological_decisions:
- issue: 요한의 정체와 칭호
  choice: 복음사가 요한
  alternative: 요한 ‘에바…’ / 전도자 요한
  rationale: 영어 증언은 ‘John the Eva’에서 끊기지만 문맥상 ‘John the Evangelist’일 가능성이 큽니다. 다만 원어 검토가 보류된 상태이므로 각주로 불확실성을 명시해 확정적 동일시를 피했습니다.
- issue: 관계대명사의 선행사
  choice: 요한의 말을 들은 사람을 파피아스로 이해
  alternative: 이레네우스가 요한의 말을 들었다고 이해
  rationale: 제공된 영어 증언의 문장 구조에서는 ‘who’가 바로 앞의 Papias를 수식하는 독해가 가장 자연스럽습니다. 원어 자료를 직접 검토하기 전까지 이 구문을 잠정적으로 따랐습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 짧은 인용 단편의 문헌적 성격을 살리되, 일반 독자가 이해하기 쉬운 어순으로 다듬었습니다. 출전 저자명은 한국어 통용형인 ‘히에로니무스’를 사용했고, 서명은 의미가 드러나도록 번역했습니다. 원어 검토가 보류된 자료이므로 본문과 각주 모두 잠정성을 유지했습니다.
