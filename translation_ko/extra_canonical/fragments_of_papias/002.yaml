revisions:
- from: '파피아스가 쓴 책 다섯 권이 전해지는데, 그 제목은 《주님의 말씀 해설》입니다.[a] 이레나이우스도 이것들이 파피아스가 쓴 유일한 저술이라고 언급하며 다음과 같이 말합니다. “요한의 말을 들은 사람이자 폴리카르포스의 동료였던 옛 교회의 존경받는 인물 파피아스는 자기 책 제4권에서 이 일들을 글로 증언합니다. 그가 저술한 책은 모두 다섯 권입니다.” 여기까지가 이레나이우스의 말입니다.


    그러나 파피아스 자신은 저술의 머리말에서 자기가 거룩한 사도들의 말을 직접 듣고 그들을 직접 본 사람이라고 주장하지 않습니다. 오히려 그가 사용한 표현을 보면, 사도들을 따르던 사람들에게서 신앙에 관한 것들을 전해 받았음을 알 수 있습니다.


    “나는 전에 장로들에게서 주의 깊게 배우고 주의 깊게 기억해 둔 모든 것을 내 해설과 함께 여러분을 위하여 기록하는 일을 주저하지 않을 것이며, 그 진실성을 보증하겠습니다. 나는 많은 사람처럼 말이 많은 이들을 좋아한 것이 아니라 진리를 가르치는 이들을 좋아했고, 낯선 계명들을 전하는 이들이 아니라 주님께서 믿음에 주신 계명들, 곧 진리 자체에서 나온 계명들을 전하는 이들을 좋아했습니다. 또 장로들을 따르던 사람을 만나게 될 때마다 나는 장로들이 하신 말씀을 물었습니다. 곧 안드레아나 베드로, 빌립, 도마, 야고보, 요한, 마태, 또는 주님의 다른 제자들이 무엇을 말했는지, 그리고 주님의 제자들인 아리스티온과 장로 요한이 무엇을 말하는지를 물었습니다.[b] 책에 담긴 내용보다 살아 있고 계속 머무는 목소리에서 더 많은 유익을 얻을 수 있다고 생각했기 때문입니다.”


    여기서 파피아스가 요한이라는 이름을 두 번 열거한다는 점을 살펴볼 필요가 있습니다. 첫 번째 요한은 베드로와 야고보와 마태와 나머지 사도들과 함께 언급하므로, 분명히 복음서 저자를 뜻합니다. 그러나 두 번째 요한은 얼마간 뒤에 언급하면서 사도들의 수에 들지 않는 다른 이들과 같은 부류에 놓고, 그보다 앞에 아리스티온을 둔 다음 그를 분명히 ‘장로’라고 부릅니다. 이로써 아시아에 같은 이름을 가진 두 사람이 있었고, 에베소에도 무덤이 둘 있어서 지금까지 각각 ‘요한의 무덤’이라고 불린다는 사람들의 말이 참임을 아주 분명히 드러냅니다. 이 점은 중요하게 살펴보아야 합니다. 요한의 이름으로 전해지는 계시를 본 사람이 첫 번째 요한이라고 인정하지 않는다면, 아마도 두 번째 요한이었을 것이기 때문입니다. 지금 우리가 말하는 파피아스는 자기가 사도들의 말씀을 그들을 따르던 사람들에게서 전해 받았다고 밝히지만, 자신은 아리스티온과 장로 요한의 말을 직접 들었다고 말합니다. 어쨌든 그는 두 사람의 이름을 자주 언급하고 그들의 전승도 자기 저술에 기록합니다. 이 점들을 제시한 것이 쓸모없는 일은 아니었으리라 생각합니다.


    그러나 위에서 인용한 파피아스의 말에 그의 다른 구절들도 덧붙일 만합니다. 그는 전승으로 전해 받은 다른 놀라운 사건들도 거기에 기록합니다. 사도 빌립이 딸들과 함께 히에라폴리스에 살았다는 사실은 이미 말했습니다. 그러나 그들과 같은 시대에 살았던 파피아스가 빌립의 딸들에게서 놀라운 이야기를 들었다고 전한 사실도 여기서 살펴보아야 합니다. 그는 자기 시대에 어떤 사람이 죽은 사람들 가운데서 살아났다고 전합니다. 또 바르사바라는 이름을 지닌 유스도에 관한 다른 놀라운 이야기도 들려줍니다. 유스도가 치명적인 독을 마시고도 주님의 은혜로 아무런 해도 입지 않았다는 이야기입니다. 사도행전은 이 유스도에 관하여, 구주께서 승천하신 뒤 거룩한 사도들이 배반자 유다를 대신하여 자신들의 수를 채울 사람을 올바로 뽑고자 그를 마티아와 함께 후보로 세우고 기도했다고 기록합니다. 그 구절은 대략 다음과 같습니다. “그들은 두 사람을 내세웠습니다. 하나는 바르사바라고도 하고 유스도라는 별명도 가진 요셉이었고, 다른 하나는 마티아였습니다. 그리고 그들은 기도하며 말했습니다.”[c]


    같은 저자는 구전으로 전해 받았다는 다른 내용들도 기록했습니다. 곧 구주의 기이한 비유 몇 가지와 그분의 가르침들, 그리고 다소 신화적인 성격을 띤 다른 이야기들입니다. 그 가운데 그는 부활 뒤에 약 만 년의 기간이 있을 것이며, 그리스도의 나라가 이 땅에 물질적인 형태로 세워질 것이라고 말합니다.[d] 내 생각에 그는 사도들의 기록을 잘못 이해하여 이런 생각을 갖게 되었습니다. 비유적으로 기록된 것들을 사도들이 신비한 뜻으로 말했다는 사실을 깨닫지 못한 것입니다.


    그 자신의 말을 근거로 판단하자면, 그는 분명 이해력이 매우 부족한 사람이었습니다. 그러나 그가 옛 시대의 인물이었다는 사실을 근거로 삼아, 그 뒤의 수많은 교회 저술가들이 그와 같은 견해를 받아들였습니다. 이를테면 이레나이우스와, 같은 견해를 가졌다고 밝힌 그 밖의 사람들이 그러했습니다. 파피아스는 자기 저술에서 앞서 말한 아리스티온의 권위에 기대어 주님의 말씀에 관한 다른 이야기들도 전하며, 장로 요한의 전승들도 기록합니다. 더 알고 싶은 사람은 그 기록들을 살펴볼 수 있습니다. 여기서는 지금의 목적을 위하여, 위에서 인용한 그의 말에 이 전승 하나만 덧붙이겠습니다. 이것은 이 자료들을 통하여 전해진 것으로, 복음서를 쓴 마가에 관한 전승입니다.


    “장로는 또 이렇게 말했습니다. ‘마가는 베드로의 통역자가 되어, 자기가 기억한 모든 것을 정확히 기록했습니다. 그러나 그리스도께서 말씀하시거나 행하신 것을 순서대로 기록하지는 않았습니다. 마가는 주님의 말씀을 직접 듣지도 않았고 그분을 직접 따르지도 않았기 때문입니다. 그러나 나중에는, 내가 말한 것처럼, 베드로를 따랐습니다. 베드로는 듣는 이들의 필요에 맞추어 가르쳤으며, 주님의 말씀을 체계적으로 엮어 설명하려고 하지는 않았습니다. 그러므로 마가가 기억나는 대로 몇 가지를 기록한 것은 잘못이 아니었습니다. 그는 자신이 들은 것을 하나도 빠뜨리지 않고, 그 안에 거짓된 것을 하나도 기록하지 않는 일만을 유의했기 때문입니다.’”[e]


    이것이 파피아스가 마가에 관하여 전한 내용입니다. 마태에 관해서는 그가 다음과 같이 말합니다.


    “그러므로 마태는 히브리 말로 말씀들을 정리했고, 사람마다 할 수 있는 대로 그것들을 해석했습니다.”[f]


    같은 저자는 요한의 첫째 서신과 베드로의 서신에서도 증언을 인용했습니다. 또 그는 많은 죄로 고발되어 주님 앞에 끌려온 한 여자에 관한 이야기도 전했는데, 이는 ‘…에 따른 복음서’에 나오는 이야기입니다.[g]'
