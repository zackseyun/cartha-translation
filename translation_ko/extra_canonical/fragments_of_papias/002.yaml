  revised_text: '파피아스가 쓴 책 다섯 권이 현존하는데, 그 제목은 《주님의 말씀 해설》입니다.[a] 이레나이우스도 이것들이 파피아스가 쓴 유일한 저술이라고 언급하며 다음과 같이 말합니다. “요한의 말을 들은 사람이자 폴리카르포스의 동료였던, 옛 시대의 훌륭한 사람 파피아스는 자기 책 제4권에서 이 일들을 글로 증언합니다. 그가 저술한 책은 모두 다섯 권입니다.” 여기까지가 이레나이우스의 말입니다.


