  rationale: ‘신탁’보다 초기 그리스도교 문맥의 주님 말씀과 가르침을 자연스럽고 폭넓게 나타냅니다. 다만 구체적인 문학 장르로 단정하지 않았습니다.
- source_word: πρεσβύτερος / elder
  choice: 장로
  rationale: 교회 직분만을 뜻한다고 단정하지 않고, 전승 권위자 또는 앞선 세대 인물을 가리킬 수 있는 원문의 호칭을 보존합니다.
- source_word: ἑρμηνευτής / interpreter
  choice: 통역자
  rationale: 마가가 베드로의 말을 번역하거나 전달한 역할을 가리킬 수 있는 기본 의미를 유지합니다. ‘대필자’나 ‘해설자’로 좁히지 않았습니다.
- source_word: Ἑβραΐδι διαλέκτῳ / Hebrew dialect
  choice: 히브리 말로
  rationale: 히브리어인지 아람어인지에 관한 후대 논쟁을 본문에서 해결하지 않고 전승의 표현을 그대로 살립니다.
- source_word: τάξις / order
  choice: 순서대로
  rationale: 연대적 순서인지 문학적 배열인지 확정하지 않고 원문의 일반적 의미를 보존합니다.
- source_word: ζώσης φωνῆς καὶ μενούσης / living and abiding voice
  choice: 살아 있고 계속 머무는 목소리
  rationale: 구전 증언의 생동성과 지속성을 함께 담은 역설적 표현을 평면화하지 않았습니다.
