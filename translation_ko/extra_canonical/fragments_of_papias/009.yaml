base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: ko
  text: '히에라폴리스의 위대한 파피아스, 곧 그리스도의 품에 기대었던 사도의 제자와, 클레멘스와, 알렉산드리아인들의 장로 판타이노스와, 위대한 학자 암모니오스에게서 출발한 저 고대의 초기 해설자들은, 엿새 동안 이루어진 모든 일을 그리스도와 그분의 교회에 관한 것으로 이해하는 데 서로 의견이 일치합니다.[a]


    — 시나이의 아나스타시오스, 『육일 창조에 관한 관상적·영적 해석』 제1권[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 그리스어·라틴어 원문 대조가 아직 이루어지지 않아, 인물들의 병렬 관계와 ‘제자’라는 수식어의 정확한 범위는 재검토가 필요합니다. 또한 영어 증언의 “priest”는 문맥에 따라 ‘사제’로 옮길 수도 있습니다.
    reason: 직접적인 고대어 원문 검토가 보류된 상태이며, 문장 구조와 직분 명칭에 실제 번역상의 불확실성이 있습니다.
  - marker: b
    text: 작품명은 영어 증언의 축약 표기 “Contempl. Anagog. in Hexaém. i.”를 의미 중심으로 풀어 옮긴 잠정 표기입니다.
    reason: 축약된 라틴어 서지 표기의 정확한 정식 한국어 제목이 확정되지 않았습니다.
lexical_decisions:
- source_word: disciple
  choice: 제자
  rationale: 영어 증언의 관계 표현을 그대로 보존했습니다. 다만 누구의 제자인지는 문장 구조상 모호할 여지가 있어 각주로 밝혔습니다.
- source_word: the Apostle who leaned on Christ’s bosom
  choice: 그리스도의 품에 기대었던 사도
  rationale: 요한복음의 전승적 표현을 자연스럽고 격조 있는 현대 한국어로 옮기되, 사도의 이름을 본문에 보충하지 않았습니다.
- source_word: priest
  choice: 장로
  rationale: 초기 그리스도교 직분을 가리키는 표현으로 이해하여 ‘장로’를 선택했으나, 원어 대조가 미완료된 상태이므로 각주에 ‘사제’ 가능성을 남겼습니다.
- source_word: all the work of the six days
  choice: 엿새 동안 이루어진 모든 일
  rationale: 창세기 1장의 육일 창조를 가리키는 표현을 일반 독자가 이해할 수 있도록 풀어 옮겼습니다.
- source_word: as referring to
  choice: …에 관한 것으로
  rationale: 괄호 속 보충의 해석적 성격을 유지하면서 한국어 문장 안에 자연스럽게 통합했습니다.
theological_decisions:
- issue: 육일 창조의 그리스도론적·교회론적 해석
  choice: ‘그리스도와 그분의 교회에 관한 것으로 이해’한다고 번역
  alternative: ‘그리스도와 그분의 교회를 예표하는 것으로 이해’
  rationale: ‘예표’는 원문의 단순한 관련 의미보다 특정한 유형론을 더 명시할 수 있으므로, 증언이 가진 폭과 긴장을 보존하는 표현을 택했습니다.
- issue: 파피아스와 ‘사도’의 관계
  choice: 영어 증언의 통사적 연결을 유지
  alternative: 파피아스를 사도 요한의 제자로 명시
  rationale: 본문은 사도의 이름을 밝히지 않으며, 구두점과 수식 범위도 원어 검토 전에는 단정하기 어렵습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 교부 문헌의 품위를 유지하되 지나치게 고어적인 표현은 피했습니다. 인용문은 하나의 긴 문장이므로 한국어에서 주어와 서술어의 관계가 드러나도록 재배열했으며, 원문 검토 전 단정할 수 없는 사항은 본문에 보충하지 않고 각주로 처리했습니다.
