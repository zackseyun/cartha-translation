  revised_text: '히에라폴리스의 위대한 파피아스, 곧 그리스도의 품에 기대었던 사도의 제자, 클레멘스, 알렉산드리아인들의 사제 판타이노스, 그리고 위대한 학자 암모니오스에게서 출발한 저 고대의 최초 해석자들은 엿새 동안의 모든 일을 그리스도와 그분의 교회에 관한 것으로 이해하는 데 서로 의견이 일치합니다.[a]


