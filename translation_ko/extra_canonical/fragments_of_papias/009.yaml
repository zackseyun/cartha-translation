  naturalness: 긴 열거 구조를 한국어에서 자연스럽게 정리하되, ‘저 고대의 최초 해석자들’이라는 주어와 ‘의견이 일치합니다’라는 서술의 연결을 유지했습니다. ‘엿새 동안의 모든 일’은 영어 증언의 포괄적 표현을 보존하는 절제된 번역입니다.
  terminology: Papias=파피아스, Clement=클레멘스, Pantaenus=판타이노스, Ammonius=암모니오스, Anastasius of Sinai=시나이의 아나스타시오스로 통일했습니다. priest는 영어 증언에 따라 ‘사제’로 번역했습니다. ‘그분의 교회’는 His Church의 소유 관계를 보존합니다.
