source:
  text: "So then the more ancient expositors of the churches, I mean Philo,\n_ the philosopher, and contemporary of the Apostles, and the famous Papias\n_of Hierapolis, the disciple of John the Evangelist...and their associates,\n  interpreted the sayings about Paradise spiritually, and referred them to the\n  Church of Christ.\n                ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. vii."
  text_scope: public_domain_english_witness
  manuscript: Fragments preserved in Eusebius and later witnesses
  ancient_language: Greek/Latin (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://archive.org/details/apostolicfathers00lighuoft
  witness_translator: J. B. Lightfoot
  witness_license: Public domain witness
  english_witness: "So then the more ancient expositors of the churches, I mean Philo,\n_ the philosopher, and contemporary of the Apostles, and the famous Papias\n_of Hierapolis, the disciple of John the Evangelist...and their associates,\n  interpreted the sayings about Paradise spiritually, and referred them to the\n  Church of Christ.\n                ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. vii."
base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: ko
  text: '그러므로 교회들의 더 옛 주석가들, 곧 철학자이며 사도들과 같은 시대에 살았던 필론과, 복음서 저자 요한의 제자인 히에라폴리스의 저명한 파피아스… 그리고 그들과 함께한 이들은 낙원에 관한 말씀들을 영적으로 해석하고, 그것들을 그리스도의 교회에 적용했습니다.[a]


    — 시나이의 아나스타시우스, 『헥사에메론에 관한 상승적 관상』 7권[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 그리스어 또는 라틴어 전승에 대한 직접 검토가 아직 필요하며, 생략 부호(…)는 영어 증언에 있는 형태를 보존했습니다.
    reason: 직접 원어 검토가 미완료라는 자료상의 한계와 증언의 생략을 독자에게 투명하게 밝히기 위해서입니다.
  - marker: b
    text: 이 단편은 시나이의 아나스타시우스가 인용하여 보존한 증언으로 제시됩니다. 작품명의 번역은 잠정적입니다.
    reason: 파피아스의 저술에서 직접 전해진 본문이 아니라 후대 저자의 저술에 보존된 단편임을 명시하기 위해서입니다.
lexical_decisions:
- source_word: the more ancient expositors of the churches
  choice: 교회들의 더 옛 주석가들
  rationale: 교회 전승 안에서 본문을 풀이한 이들이라는 뜻을 보존하면서, 원문 검토가 미완료인 상태에서 ‘교부’ 같은 후대의 전문 용어를 덧붙이지 않았습니다.
- source_word: contemporary of the Apostles
  choice: 사도들과 같은 시대에 살았던
  rationale: ‘동시대인’보다 일반 독자에게 자연스럽고, 사도들과 개인적으로 교제했다는 의미까지 확대하지 않습니다.
- source_word: John the Evangelist
  choice: 복음서 저자 요한
  rationale: ‘전도자 요한’보다 이 문맥의 전통적 칭호가 가리키는 뜻을 현대 한국어로 분명하게 전달합니다.
- source_word: the sayings about Paradise
  choice: 낙원에 관한 말씀들
  rationale: ‘sayings’의 복수성과 성경적 진술을 가리키는 성격을 살렸습니다.
- source_word: spiritually
  choice: 영적으로
  rationale: 해석 방식에 관한 증언을 그대로 보존하며, 이를 ‘비유적으로’나 ‘우의적으로’로 좁히지 않았습니다.
- source_word: referred them to the Church of Christ
  choice: 그것들을 그리스도의 교회에 적용했습니다
  rationale: 해당 말씀들이 그리스도의 교회를 가리키는 것으로 해석되었다는 뜻을 자연스럽게 나타내되, 단일한 교리적 등식을 단정하지 않습니다.
theological_decisions:
- issue: 낙원 진술의 영적 해석과 교회의 관계
  choice: ‘영적으로 해석하고, 그것들을 그리스도의 교회에 적용했습니다’
  alternative: ‘낙원이 곧 그리스도의 교회라고 해석했습니다’
  rationale: 증언은 낙원과 교회를 단순히 동일시한다고 명시하기보다, 낙원에 관한 말씀을 영적으로 이해하여 교회에 관련짓는다고 말합니다. 따라서 원문의 해석학적 긴장을 보존했습니다.
- issue: ‘요한’의 정체
  choice: 증언에 있는 ‘복음서 저자 요한’이라는 호칭을 그대로 반영
  alternative: ‘사도 요한’ 또는 다른 요한으로 확정
  rationale: 현존 영어 증언이 제공하는 호칭 이상으로 인물의 정체를 교리적·역사적으로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 인명과 지명은 통용되는 음역을 따랐고, 문장은 고대 인용문의 품위를 유지하되 일반 독자가 이해할 수 있도록 다듬었습니다. 원어 자료가 제공되지 않았으므로 영어 증언을 투명하게 활용했으며, 확정할 수 없는 세부는 각주에 밝혔습니다.
