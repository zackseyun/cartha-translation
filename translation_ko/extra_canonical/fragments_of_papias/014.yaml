review_pass:
  verdict: revise
  source_fidelity: 영어 증언문의 핵심 대조 관계(스테파누스가 파피아스와 이레나이우스를 따르지 않음)와 그들이 말하는 내용은 대체로 보존되었습니다. 다만 현행 두 문장 구성은 원문의 "when they say"에 해당하는 종속 관계를 독립 진술로 약화합니다. 이를 한 문장으로 연결해 논리 관계를 명시하는 편이 안전합니다. 직접 그리스어·라틴어 원문 대조가 보류되어 있으므로, 영어 증언문 이상의 역사적·교리적 단정은 피해야 합니다.
  naturalness: 현행문은 이해 가능하나, "음식들을 누리는 데"보다 "음식들을 향유하는 데"가 문어적이고 자연스럽습니다. 또한 두 인물 뒤의 "그들은"은 지시 대상이 명확하기는 하지만, 종속절로 직접 표현하면 더 매끄럽고 정확합니다.
  terminology: '"하늘나라", "주교", "순교자", "거룩한"은 적절합니다. "물질적인"도 뜻은 전달하지만, 학술적 문맥에서는 "물질적"이 간결합니다. 인명 표기는 현행 음역을 유지합니다. 서지명 "비블리오테카"는 정규화된 영어 감사 기록(Bibliotheca)에 부합합니다.'
  issues:
  - severity: medium
    issue: 원문의 "when they say" 종속 관계가 두 독립문으로 풀려 약화되었습니다.
    rationale: 스테파누스가 두 인물을 따르지 않는 것은 바로 그들이 해당 견해를 말할 때라는 원문 구조를 보존하는 것이 좋습니다.
  - severity: low
    issue: '"음식들을 누리는 데"의 결합이 다소 어색합니다.'
    rationale: '"향유하는 데"는 enjoyment를 보존하면서 현대 한국어의 문어적 종교·학술 문맥에 더 자연스럽습니다.'
  revised_text: '또한 스테파누스는 히에라폴리스의 주교이자 순교자인 파피아스나 리옹의 거룩한 주교 이레나이우스가 하늘나라가 어떤 물질적 음식들을 향유하는 데 있을 것이라고 말할 때에도 그들을 따르지 않습니다.


    — 포티오스, 『비블리오테카』 232, 스테파누스 고바루스에 관하여[a]'
  revised_footnotes:
