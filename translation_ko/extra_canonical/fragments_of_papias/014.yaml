base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: ko
  text: '또한 스테파누스는 히에라폴리스의 주교이자 순교자인 파피아스도, 리옹의 거룩한 주교 이레나이우스도 따르지 않습니다. 그들은 하늘나라가 어떤 물질적인 음식들을 누리는 데 있을 것이라고 말합니다.


    — 포티오스, 『비블리오테카』 232, 스테파누스 고바루스에 관하여[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 단편은 포티오스가 스테파누스 고바루스를 논평한 대목에 보존되어 있습니다. 현재 번역은 공개 저작권 영어 증언문을 바탕으로 한 잠정 번역이며, 그리스어·라틴어 원문 대조가 아직 필요합니다. 영어 증언문의 오자로 보이는 “Aibliotheca”는 “Bibliotheca”로 바로잡았습니다.
    reason: 간접 전승의 출처와 번역의 잠정적 성격, 서지 표기의 교정을 독자에게 알리기 위해서입니다.
lexical_decisions:
- source_word: kingdom of heaven
  choice: 하늘나라
  rationale: 현대 한국어 독자가 쉽게 이해하면서도 전통적인 신학 용어의 의미를 유지합니다.
- source_word: material foods
  choice: 물질적인 음식들
  rationale: 해석을 덧붙이지 않고 물질성과 복수의 뉘앙스를 보존했습니다.
- source_word: enjoyment
  choice: 누리는 데
  rationale: 단순한 섭취가 아니라 향유한다는 뜻을 자연스러운 한국어로 나타냈습니다.
- source_word: holy bishop
  choice: 거룩한 주교
  rationale: 증언문에 담긴 존칭적 평가를 생략하지 않고 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: 하늘나라와 물질적 음식의 관계
  choice: “물질적인 음식들을 누리는 데 있을 것”으로 표현
  alternative: “물질적인 음식을 먹는 것으로 이루어질 것”
  rationale: 원 증언이 비판하는 견해를 과도하게 구체화하거나 완화하지 않고, 영어 공개 증언문에 나타난 신학적 긴장을 보존했습니다.
- issue: 스테파누스가 파피아스와 이레나이우스를 따르지 않는다는 문장 구조
  choice: 첫 문장에 부정을 명시하고 둘째 문장에 그들의 견해를 제시
  alternative: “그들이 … 말할 때에도 스테파누스는 … 따르지 않는다”라는 한 문장
  rationale: 복잡한 삽입 구조를 현대 한국어로 명료하게 풀되 논리 관계는 그대로 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 교부 문헌의 품위를 유지하되 복잡한 원문의 삽입 구조는 두 문장으로 나누어 일반 독자가 이해하기 쉽게 했습니다. 직접 원어 검토가 보류된 상태이므로 단정적 재구성은 피했습니다.
