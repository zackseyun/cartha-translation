    text: 이 단편은 포티오스의 『비블리오테카』 232번, 스테파누스 고바루스에 관한 항목에 보존되어 있습니다. 현재 번역은 퍼블릭 도메인 영어 증언문을 바탕으로 한 잠정 번역이며, 그리스어·라틴어 원문과의 직접 대조가 아직 필요합니다. 영어 증언문의 오자로 보이는 “Aibliotheca”는 “Bibliotheca”로 바로잡았습니다.
    reason: 간접 전승의 출처와 번역의 잠정적 성격, 그리고 영어 증언문 서지 표기의 정규화를 밝힙니다.
  revision_rationale: 원문의 삽입·종속 구조를 현대 한국어 한 문장 안에서 명료하게 재현하여, 스테파누스의 비추종과 두 주교의 주장 사이의 관계를 보존했습니다. "enjoyment"는 과도하게 "먹음"으로 한정하지 않고 "향유"로 옮겼습니다. 원어 직접 검토가 보류된 상태이므로 인물의 역사적 칭호와 견해에 대한 추가 판단은 덧붙이지 않았습니다.
