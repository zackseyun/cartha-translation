base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: ko
  text: '파피아스는 요한의 말을 들은 사람이자 아시아의 히에라폴리스 감독으로서, 단 다섯 권의 책만을 썼으며 그 책들에 『주님의 말씀 해설』이라는 제목을 붙였습니다. 그는 그 책의 서문에서 아무 말이나 무분별하게 따르는 것이 아니라 사도들을 권위 있는 근거로 삼는다고 밝히면서 이렇게 말합니다.


    “나는 안드레나 베드로, 빌립, 도마, 야고보, 요한, 마태, 또는 주님의 다른 어느 제자가 무슨 말을 했는지, 또 주님의 제자들인 아리스티온과 장로 요한이 무슨 말을 하고 있는지를 늘 물어보곤 했습니다. 책에서 얻는 것은 지금까지도 생생하고 또렷하게 들려오는 살아 있는 음성만큼 내게 유익하지 않았기 때문입니다.”[a]


    이로써 그의 명단 자체에는 사도들 가운데 하나로 꼽히는 요한이 있고, 또 아리스티온 다음에 열거되는 다른 요한, 곧 장로 요한이 있다는 것이 분명합니다. 앞서 많은 이들의 권위에 근거하여 기록한 바와 같이, 요한의 뒤 두 서신은 사도의 작품이 아니라 장로의 작품이라는 주장 때문에 우리가 이 사실을 언급한 것입니다. 이 파피아스는 천년 왕국에 관한 유대인의 전승을 널리 퍼뜨렸다고 전해집니다. 이레나이우스와 아폴리나리우스와 그 밖의 사람들도 그를 따라, 부활 뒤에 주님께서 성도들과 함께 육신으로 다스리실 것이라고 말합니다.[b]


    히에로니무스, 『명사록』 18장


    VIII


    더 나아가 요세푸스의 책들과 파피아스와 폴리카르포스의 저술들을 내가 번역했다는 그릇된 소문이 내게까지 들려왔습니다. 그러나 나는 이와 같은 저작들을 그에 걸맞은 우아함을 살려 다른 언어로 옮길 만한 여유도 힘도 없습니다.


    히에로니무스, 「루키니우스에게 보낸 편지」 71(28), 5장'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 파피아스 인용문은 히에로니무스가 전한 형태입니다. 현재 제공된 증거는 오래된 영어 번역본이며, 그리스어·라틴어 원문 대조는 아직 이루어지지 않았습니다. 특히 마지막의 ‘살아 있는 음성’에 관한 구절은 전승 과정과 판본에 따라 표현을 재검토할 필요가 있습니다.
    reason: 제공된 원문란이 실제 고대어 본문이 아니라 손상된 영어 인쇄 증언이므로 문헌적 한계를 투명하게 밝혔습니다.
  - marker: b
    text: ‘천년 왕국’은 부활 뒤 주님께서 성도들과 함께 육신으로 다스리신다는 여기의 설명을 가리킵니다. 이 표현만으로 후대의 세부적인 종말론 체계 전체를 확정할 수는 없습니다.
    reason: 본문의 종말론적 주장을 보존하면서 후대 교리 체계의 과도한 소급 적용을 막기 위함입니다.
lexical_decisions:
- source_word: hearer of John
  choice: 요한의 말을 들은 사람
  rationale: 단순한 청각 경험과 제자 관계를 모두 함축할 수 있는 표현으로 옮기되, 원문 증거가 확정하지 않는 공식적 사제 관계를 단정하지 않았습니다.
- source_word: An Exposition of Discourses of the Lord
  choice: 『주님의 말씀 해설』
  rationale: ‘discourses’가 가리키는 말·가르침의 범위를 자연스럽게 포괄하도록 ‘말씀’을 택하고, 작품 제목답게 간결하게 구성했습니다.
- source_word: promiscuous statements
  choice: 아무 말이나 무분별하게
  rationale: 여기서는 성적 의미가 아니라 출처를 가리지 않고 뒤섞인 진술이라는 뜻이므로 현대 한국어의 자연스러운 표현을 사용했습니다.
- source_word: the living voice
  choice: 살아 있는 음성
  rationale: 기록된 책과 현존하는 구전 증언의 대비를 보존하고, 고대 저술에서 중요한 ‘살아 있는 음성’이라는 표현도 유지했습니다.
- source_word: the two later epistles of John
  choice: 요한의 뒤 두 서신
  rationale: 통상 제2·제3요한서를 가리키지만 본문 자체의 표현을 존중하여 서신명을 직접 확정하지 않았습니다.
- source_word: a Millennium
  choice: 천년 왕국
  rationale: 단순한 기간인 ‘천년’보다 문맥상 부활 뒤 주님의 통치를 가리키는 관용적 표현을 사용하되, 구체적인 종말론 체계는 덧붙이지 않았습니다.
- source_word: in the flesh
  choice: 육신으로
  rationale: 통치의 물질적·육체적 성격을 주장하는 문장의 신학적 긴장을 약화하지 않고 직설적으로 보존했습니다.
theological_decisions:
- issue: 두 명의 요한의 구별
  choice: 사도들 가운데 열거된 요한과 아리스티온 뒤의 ‘장로 요한’을 별개의 인물로 서술했습니다.
  alternative: 두 이름이 동일인을 가리킨다고 조화시키는 번역
  rationale: 인용 저자인 히에로니무스의 논증은 두 요한의 구별에 달려 있으므로 이를 그대로 보존했습니다.
- issue: 요한의 뒤 두 서신의 저자
  choice: ‘사도의 작품이 아니라 장로의 작품이라는 주장’으로 옮겼습니다.
  alternative: 장로 저작설을 번역자가 확정된 사실처럼 진술
  rationale: 본문은 전승과 주장에 관한 보고이므로 번역자가 그 저자 문제를 독자적으로 확정하지 않도록 했습니다.
- issue: 천년 통치 전승
  choice: 파피아스가 전승을 퍼뜨렸다고 ‘전해지며’, 추종자들은 주님이 ‘육신으로’ 다스리신다고 말했다고 옮겼습니다.
  alternative: 특정 전천년설 체계의 전문 용어로 해석
  rationale: 역사적 증언의 거리감과 육체적 통치라는 논쟁적 내용을 함께 보존하면서 후대 교파적 체계를 본문에 투사하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 고대 문헌 인용의 격조를 유지하되 문장을 지나치게 한문투로 만들지 않았습니다. 괄호식 편집 표시는 자연스러운 문장으로 풀었고, 두 요한의 구별과 저자 문제 및 천년 통치에 관한 보고의 불확실성은 그대로 유지했습니다. 제공 자료가 고대어 원문이 아니라 스캔 오류가 있는 공용 영어 증언이므로, 이번 원고는 출판 전 그리스어·라틴어 직접 대조가 필요한 잠정 초안입니다.
