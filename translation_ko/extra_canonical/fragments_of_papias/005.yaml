review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언을 기준으로 볼 때 핵심 내용, 두 요한의 구별, 요한의 뒤 두 서신에 대한 귀속 주장, 그리고 부활 뒤 육신으로 다스리신다는 보고는 대체로 충실합니다. 다만 ‘a Millennium’을 ‘천년 왕국’으로 특정한 것은 원문의 기간·전승 표현보다 한 단계 더 해석적인 용어이며, ‘(the persons of) authors’라는 편집상 불확실한 괄호 구절도 본문에서 빠졌습니다. 고대어 본문 직접 대조가 아직 없으므로 이 대목의 문구는 잠정적으로 유지·표지해야 합니다.
  naturalness: 현대 표준 한국어와 합쇼체는 전반적으로 자연스럽습니다. 그러나 ‘사도들을 권위 있는 근거로 삼는다’는 다소 어색하므로 ‘사도들을 권위자로 삼는다’로 다듬는 것이 자연스럽습니다. 또한 ‘그에 걸맞은 우아함을 살려’보다 ‘그에 상응하는 우아함으로’가 증언의 ‘corresponding elegance’에 더 가깝습니다.
  terminology: 히에라폴리스, 아리스티온, 이레나이우스, 아폴리나리우스, 요세푸스, 폴리카르포스의 음역은 무난합니다. ‘감독’은 제공 증언의 bishop을 충실히 반영합니다. Millennium은 특정 종말론 체계를 연상시키는 ‘천년 왕국’ 대신 더 중립적인 ‘천년기’로 옮겨, 바로 뒤의 통치 설명은 본문대로 보존했습니다.
  issues:
  - severity: medium
    issue: ‘a Millennium’을 ‘천년 왕국’으로 번역함
    rationale: 영어 증언은 ‘a Millennium’이라고만 하며, 뒤 문장이 부활 후 통치에 관한 설명을 덧붙입니다. ‘천년 왕국’은 한국어 신학 관용어로서 유용할 수 있으나 원문의 표현보다 체계화된 명칭입니다. ‘천년기’가 더 중립적입니다.
  - severity: medium
    issue: ‘(the persons of) authors’라는 편집상 괄호 구절의 누락
    rationale: 영어 POB가 보존한 괄호 표지는 증언의 불확실하거나 보충된 요소를 나타냅니다. 자연스러운 한국어를 위해 최소한의 보충을 하되 괄호를 남기고, 각주에서 판본·원문 대조 필요성을 밝혀야 합니다.
  - severity: low
    issue: ‘사도들을 권위 있는 근거로 삼는다’의 어색한 결합
    rationale: 사람인 사도들을 ‘근거’라기보다 ‘권위자’ 또는 ‘권위 있는 증인’으로 표현하는 편이 자연스럽고 원문의 authorities에도 가깝습니다.
  - severity: low
    issue: ‘corresponding elegance’의 뉘앙스 약화
    rationale: ‘우아함을 살려’도 의미상 가능하지만, 원문은 다른 언어로 옮길 때 그에 상응하는 문체적 우아함을 낼 능력·여력이 없다는 뜻입니다.
  revised_text: '파피아스는 요한의 말을 들은 사람이자 아시아의 히에라폴리스 감독으로서, 다섯 권의 책만을 썼으며 그 책들에 『주님의 말씀 해설』이라는 제목을 붙였습니다. 그는 그 책의 서문에서 출처를 가리지 않은 말들을 따르는 것이 아니라 사도들을 권위자로 삼는다고 밝히면서 이렇게 말합니다.


    “나는 안드레나 베드로, 빌립, 도마나 야고보, 요한이나 마태, 또는 주님의 다른 어느 제자가 무슨 말을 했는지, 또 주님의 제자들인 아리스티온과 장로 요한이 무슨 말을 하고 있는지를 늘 물어보곤 했습니다. 책을 읽어서 얻는 유익은 (저자들의 인격 안에서) 오늘날까지도 분명히 울려 퍼지는 살아 있는 음성만큼 내게 유익하지 않았기 때문입니다.”[a]


    이로써 그의 명단 자체에는 사도들 가운데 하나로 꼽히는 요한이 있고, 또 아리스티온 다음에 열거되는 다른 요한, 곧 장로 요한이 있다는 것이 분명합니다. 매우 많은 이들의 권위에 근거하여 앞서 기록한, 곧 요한의 뒤 두 서신은 사도의 작품이 아니라 장로의 작품이라는 주장 때문에 우리가 이 사실을 언급한 것입니다. 이 파피아스는 천년기에 관한 유대 전승을 널리 퍼뜨렸다고 전해집니다. 이레나이우스와 아폴리나리우스와 그 밖의 사람들도 그를 따라, 부활 뒤에 주님께서 성도들과 함께 육신으로 다스리실 것이라고 말합니다.[b]


    히에로니무스, 『명사록』 18장


    VIII


    더 나아가 요세푸스의 책들과 파피아스와 폴리카르포스의 저술들을 내가 번역했다는 그릇된 소문이 내게까지 들려왔습니다. 그러나 나는 이와 같은 저작들을 그에 상응하는 우아함으로 다른 언어에 옮길 만한 여유도 힘도 없습니다.


    히에로니무스, 「루키니우스에게 보낸 편지」 71(28), 5장'
