  revised_text: '참으로 그렇습니다. 그러나 하나님께서 조상들에게 맹세하시고 그 백성에게 주겠다고 하신 언약에 관하여, 과연 그것을 주셨는지 살펴봅시다. 하나님께서는 주셨으나, 그들은 자기들의 죄 때문에 그것을 받을 자격이 있는 이들로 드러나지 않았습니다.


    예언자는 이렇게 말합니다. “모세는 백성에게 줄 주님의 언약을 받으려고 시내산에서 사십 일 밤낮을 금식하였습니다. 그리고 [모세]는 영 안에서 주님의 손가락으로 기록된 두 돌판을 주님에게서 받았습니다.”[a] 모세는 그것들을 받아 백성에게 주려고 가지고 내려왔습니다.


    그러자 주님께서 모세에게 말씀하셨습니다. “모세야, 모세야, 어서 내려가라. 네가 이집트 땅에서 이끌어 낸 네 백성이 악을 행하였다.”[b] 모세는 그들이 또다시 자기들을 위하여 부어 만든 형상들을 만들었다는 것을 깨닫고, 손에서 돌판들을 내던졌습니다. 그리하여 주님의 언약의 돌판들이 산산이 깨졌습니다.


    모세는 그것들을 받았으나, 그들은 받을 자격이 있는 이들로 드러나지 않았습니다. 그러면 우리는 어떻게 그것을 받았습니까? 이것을 주목하십시오. 모세는 종으로서 그것을 받았지만, 주님께서는 우리를 위하여 오래 참으시고 친히 그것을 우리에게 주셔서, 우리가 그분의 유업의 백성이 되게 하셨습니다.


    그분께서 나타나신 것은, 한편으로 그들이 자기들의 죄 가운데서 완성되고 다른 한편으로 우리는 그것을 물려받으신 분, 곧 주 예수님을 통하여 언약을 받게 하시려는 것이었습니다.[c] 그분은 바로 이 일을 위하여 미리 준비되셨습니다. 곧 친히 나타나셔서, 이미 죽음에 넘겨지고 미혹이라는 불의에 내맡겨진 우리 마음을 어둠에서 속량하시고, 말씀을 통하여 우리 안에 언약을 세우시려는 것이었습니다.


    아버지께서 그분에게 우리를 어둠에서 건져 내고 자신을 위하여 거룩한 백성을 준비하라고 명하신 것이 기록되어 있습니다.


    그러므로 예언자는 말합니다. “나 주 너의 하나님이 의로 너를 불렀다. 내가 네 손을 붙들고 너를 굳세게 하겠다. 내가 너를 한 민족을 위한 언약으로, 이방 민족들의 빛으로 주었으니, 눈먼 이들의 눈을 뜨게 하고, 결박된 이들을 사슬에서 이끌어 내며, 어둠 속에 앉아 있는 이들을 감옥에서 이끌어 내게 하려는 것이다.”[d] 그러므로 우리는 무엇으로부터 속량되었는지 깨닫습니다.


    또 예언자는 말합니다. “보라, 내가 너를 이방 민족들의 빛으로 세웠으니, 네가 땅끝까지 이르는 구원이 되게 하려는 것이다.”[e] 너를 속량하신 주님, 곧 하나님께서 이렇게 말씀하십니다.


    또 예언자는 말합니다. “주님의 영이 내 위에 계신다. 그러므로 그분께서 내게 기름을 부으셔서 겸손한 이들에게 기쁜 소식을 전하게 하셨다. 그분께서 나를 보내셔서 마음이 상한 이들을 고치고, 포로들에게 해방을, 눈먼 이들에게 시력의 회복을 선포하며, 주님께서 받아 주시는 해와 보응의 날을 선포하고, 슬퍼하는 모든 이를 위로하게 하셨다.”[f]'
