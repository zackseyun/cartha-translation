  yaml_path: translation/extra_canonical/epistle_of_barnabas/014.yaml
  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: ko
  text: '참으로 그렇습니다. 그러나 하나님께서 조상들에게 맹세하시고 그 백성에게 주겠다고 하신 언약에 관하여, 과연 그것을 주셨는지 살펴봅시다. 하나님께서는 주셨으나, 그들은 자기들의 죄 때문에 그것을 받을 자격이 있는 이들로 드러나지 않았습니다.


    예언자는 이렇게 말합니다. “모세는 백성에게 줄 주님의 언약을 받으려고 시내산에서 사십 일 밤낮을 금식하였습니다. 그리고 [모세]는 영 안에서 주님의 손가락으로 기록된 두 돌판을 주님에게서 받았습니다.”[a] 모세는 그것들을 받아 백성에게 주려고 가지고 내려왔습니다.


    그러자 주님께서 모세에게 말씀하셨습니다. “모세야, 모세야, 어서 내려가라. 네가 이집트 땅에서 이끌어 낸 네 백성이 악을 행하였다.”[b] 모세는 그들이 또다시 자기들을 위하여 부어 만든 형상들을 만들었다는 것을 깨닫고, 손에서 돌판들을 내던졌습니다. 그리하여 주님의 언약의 돌판들이 산산이 깨졌습니다.


    모세는 그것들을 받았으나, 그들은 받을 자격이 있는 이들로 드러나지 않았습니다. 그러면 우리는 어떻게 그것을 받았습니까? 이것을 주목하십시오. 모세는 종으로서 그것을 받았지만, 주님께서는 우리를 위하여 오래 참으신 뒤 친히 그것을 우리에게 주셔서, 우리가 그분의 유업의 백성이 되게 하셨습니다.


    그분께서 나타나신 것은, 한편으로 그들이 자기들의 죄를 가득 채우고 다른 한편으로 우리는 그것을 물려받으신 분, 곧 주 예수님을 통하여 언약을 받게 하시려는 것이었습니다.[c] 그분은 바로 이 일을 위하여 미리 준비되셨습니다. 곧 친히 나타나셔서, 이미 죽음에 넘겨지고 미혹의 불의에 내맡겨진 우리 마음을 어둠에서 속량하시고, 말씀을 통하여 우리 안에 언약을 세우시려는 것이었습니다.


    아버지께서 그분에게 우리를 어둠에서 건져 내고 자신을 위하여 거룩한 백성을 준비하라고 명하신 일이 기록되어 있습니다.


    그러므로 예언자는 말합니다. “나 주 너의 하나님이 의로 너를 불렀다. 내가 네 손을 붙들고 너를 굳세게 하겠다. 내가 너를 겨레의 언약으로, 이방 민족들의 빛으로 주었으니, 눈먼 이들의 눈을 뜨게 하고, 결박된 이들을 사슬에서 이끌어 내며, 어둠 속에 앉아 있는 이들을 감옥에서 이끌어 내게 하려는 것이다.”[d] 그러므로 우리는 어디에서 속량되었는지 깨닫습니다.


    또 예언자는 말합니다. “보라, 내가 너를 이방 민족들의 빛으로 세웠으니, 네가 땅끝까지 이르는 구원이 되게 하려는 것이다.”[e] 너를 속량하신 주님, 곧 하나님께서 이렇게 말씀하십니다.


    또 예언자는 말합니다. “주님의 영이 내 위에 계신다. 그러므로 그분께서 내게 기름을 부으셔서 겸손한 이들에게 기쁜 소식을 전하게 하셨다. 그분께서 나를 보내셔서 마음이 상한 이들을 고치고, 포로들에게 해방을, 눈먼 이들에게 시력의 회복을 선포하며, 주님께서 받아 주시는 해와 갚아 주시는 날을 선포하고, 슬퍼하는 모든 이를 위로하게 하셨다.”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 출애굽기 24:18; 31:18; 34:28을 결합해 인용한 표현입니다. 대괄호의 ‘모세’는 제공된 문헌 증거에서 보충된 이름임을 나타냅니다. ‘영 안에서’는 제공된 증거의 표현을 보존한 것이며, 정확한 그리스어·라틴어 본문 대조가 필요합니다.
    reason: 복합 인용과 본문 보충 표시, 잠정적 원문 상태를 독자에게 알리기 위함입니다.
  - marker: b
    text: 출애굽기 32:7-8, 19을 바탕으로 한 인용과 서술입니다.
    reason: 성서 인용의 배경을 밝혀 줍니다.
  - marker: c
    text: ‘그들이 자기들의 죄를 가득 채우고’는 직역하면 ‘그들이 죄들 가운데서 완성되다’에 가까운 난해한 표현입니다. 여기서는 죄가 극점에 이른다는 뜻으로 옮겼습니다.
    reason: 신학적으로 민감하고 원문상 난해한 표현의 번역 선택을 투명하게 밝힙니다.
  - marker: d
    text: 이사야 42:6-7의 형태와 가깝습니다. ‘겨레’에 해당하는 말은 ‘백성’ 또는 ‘민족’으로도 옮길 수 있습니다.
    reason: 인용 출처와 어휘의 가능 범위를 제시합니다.
  - marker: e
    text: 이사야 49:6-7을 결합하거나 축약한 형태와 가깝습니다.
    reason: 인용문이 현행 성서 구절 하나와 정확히 일치하지 않는 이유를 설명합니다.
  - marker: f
    text: 이사야 61:1-2와 42:7의 표현이 함께 나타납니다. ‘받아 주시는 해’는 ‘은혜의 해’ 또는 ‘기쁘게 받아들이시는 해’로도 옮길 수 있고, ‘갚아 주시는 날’은 문맥에 따라 ‘보응의 날’로도 옮길 수 있습니다.
    reason: 복합 인용 및 신학적 함의가 있는 어휘의 번역 가능성을 보존합니다.
lexical_decisions:
- source_word: διαθήκη (covenant)
  choice: 언약
  rationale: 이 장의 핵심인 하나님과 백성 사이의 언약 개념을 일관되게 나타내는 표준적이고 이해하기 쉬운 표현입니다.
- source_word: κληρονομία / inherited (witness wording)
  choice: 유업 / 물려받다
  rationale: ‘상속’보다 성서적 맥락의 공동체적 몫과 계승을 자연스럽게 드러내며, 주 예수께서 언약을 이어받으셨다는 본문의 표현도 보존합니다.
- source_word: ἐλυτρώθημεν / ransomed
  choice: 속량되다
  rationale: 대가를 치르고 해방한다는 의미를 보존하며, 단순한 ‘구출’과 구별되는 본문의 구속 언어를 유지합니다.
- source_word: πραεῖς / humble
  choice: 겸손한 이들
  rationale: 제공된 증거의 ‘humble’을 따라 내적 태도와 낮아짐을 보존했습니다. 문맥상 ‘가난한 이들’이라는 전승형 표현과 혼동하지 않도록 했습니다.
- source_word: λόγος / word
  choice: 말씀
  rationale: 언약이 세워지는 매개를 가리키는 종교적·선포적 의미를 자연스럽게 전달하되, 그 지시 대상을 특정 교리로 한정하지 않습니다.
theological_decisions:
- issue: ‘그들이 자기들의 죄를 가득 채우다’의 의미
  choice: 죄의 진행이 완결점에 이른다는 긴장을 그대로 유지했습니다.
  alternative: 그들이 완전히 죄인이 되다 / 심판받다
  rationale: ‘완성되다’라는 난해한 원문의 논리를 심판이나 본질 변화로 풀어 버리지 않고, 성서적 관용 표현인 ‘죄를 가득 채우다’로 전달했습니다.
- issue: 주 예수께서 언약을 ‘물려받으셨다’는 표현
  choice: ‘그것을 물려받으신 분’으로 직역에 가깝게 보존했습니다.
  alternative: 언약의 중보자 / 언약의 주인
  rationale: 본문 자체의 상속 언어를 다른 신학적 칭호로 대체하지 않고 그 모호성과 긴장을 남겼습니다.
- issue: ‘우리’와 ‘그들’의 대조
  choice: 저자의 논증을 그대로 번역하되 ‘그들’을 특정 현대 집단과 동일시하지 않았습니다.
  alternative: 유대인들 / 교회
  rationale: 본문은 대명사 대조를 사용하므로 번역에서 집단명을 보충하면 반유대적 일반화나 후대의 교회론을 본문에 수입할 위험이 있습니다.
- issue: 언약을 ‘우리 안에’ 세움
  choice: 장소적·내면적 표현인 ‘우리 안에’를 유지했습니다.
  alternative: 우리와 언약을 맺다
  rationale: ‘우리와’로 평준화하지 않고, 내적 변화를 암시하는 본문의 독특한 표현을 보존했습니다.
- issue: 인용문 속 ‘너’의 지시 대상
  choice: 문법적 단수 호칭을 그대로 두었습니다.
  alternative: 그리스도라고 명시
  rationale: 저자는 이 인용을 주 예수께 적용하지만, 인용문 자체에 이름을 삽입하지 않아 예언문과 저자의 해석 사이의 층위를 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 논증 부분은 명료하고 직접적으로, 예언서 인용은 장중하되 고어체가 되지 않도록 옮겼습니다. 제공 자료가 공용 영어 증언에 근거하고 직접적인 그리스어·라틴어 검토가 보류된 상태이므로, 복합 인용과 불확실한 표현은 각주에서 명시했습니다.
