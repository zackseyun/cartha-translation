    그러면 다른 한 마리는 어떻게 해야 합니까? 그분은 “그 한 마리는 저주받은 것이다”라고 말씀하십니다. 예수님의 모형이 어떻게 드러나는지 유의하십시오.


    “너희는 모두 그 염소에게 침을 뱉고 찔러 몰며, 그 머리 둘레에 진홍색 양털을 두른 다음 광야로 내보내라.” 이렇게 한 뒤, 염소를 광야로 데려가는 사람은 그것을 끌고 가서 양털을 벗겨 ‘라키아’라고 하는 가지 위에 올려놓습니다.[e] 이것은 우리가 들에서 발견하면 그 새순을 즐겨 먹는 바로 그 식물입니다. 가시나무 가운데 오직 이것의 열매만 이처럼 달콤합니다.


    그러면 이것은 무엇을 뜻합니까? 주의를 기울이십시오. 한 마리는 제단에 있고 다른 한 마리는 저주받았습니다. 게다가 저주받은 염소는 관을 썼습니다. 그들이 그날에 그분께서 그 몸에 긴 진홍색 옷을 걸치고 계신 것을 보고 이렇게 말할 것이기 때문입니다. “이분은 우리가 전에 십자가에 못 박고 업신여기며 침 뱉었던 바로 그분이 아닌가? 참으로 이분은 그때 자신이 하나님의 아들이라고 말씀하셨던 분이다.”


    그분은 어떻게 그 염소와 같습니까? 이 때문에 염소들이 보기 좋고 서로 닮아야 한다고 말씀한 것입니다. 훗날 그들이 그분께서 오시는 것을 볼 때, 그 염소들이 서로 닮은 것을 보고 놀라게 하려는 것입니다. 그러므로 고난받으실 예수님의 모형을 보십시오.


    그런데 양털을 가시덤불 가운데 놓는 것은 무엇을 뜻합니까? 그것은 교회를 위하여 제시된 예수님의 모형입니다. 진홍색 양털을 가져가려는 사람은 누구든지 그 가시의 무서운 성질 때문에 많은 고난을 겪어야 했고, 환난을 통하여 그것을 제압해야 했기 때문입니다. 그리하여 그분은 이렇게 말씀하십니다. “나를 보고 내 나라에 이르기를 바라는 사람들은 환난과 고난을 통하여 나를 붙들어야 한다.”'
