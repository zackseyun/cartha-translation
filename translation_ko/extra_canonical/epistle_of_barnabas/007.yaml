  rationale: 안전한 문체·용어 교정과 함께, 상처와 생명의 관계 및 두 염소의 닮음에 관한 난해한 논증을 영어 증언 및 알려진 그리스어 문맥에 더 가깝게 보존했습니다. 현존 성경 본문과 일치하지 않는 저자의 의례 인용은 각주에서 계속 구별했으며, 특정 집단이나 교리적 결론을 추가하지 않았습니다.
