base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/007.yaml
  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: ko
  text: '그러므로 기쁨의 자녀 여러분, 선하신 주님께서 모든 것을 우리에게 미리 밝혀 주셨음을 깨달으십시오. 이는 우리가 모든 일에서 누구에게 감사와 찬양을 드려야 하는지 알게 하시려는 것입니다.


    그렇다면 하나님의 아들이시며 주님이시고 장차 산 자와 죽은 자를 심판하실 분께서, 그분의 상처가 우리에게 생명을 주도록 고난을 받으셨다면, 하나님의 아들이 우리를 위해서가 아니고서는 고난을 받으실 수 없었다는 것을 믿읍시다.


    더욱이 그분은 십자가에 못 박히셨을 때 식초와 쓸개를 마시게 하려고 받으셨습니다. 성전의 제사장들이 이 일을 어떻게 밝혀 놓았는지 들어 보십시오. 성경에는 “금식을 지키지 않는 자는 반드시 죽을 것이다”라는 명령이 있습니다.[a] 주님께서는 자신의 영을 담은 그릇을 친히 우리 죄를 위한 희생 제물로 바치려 하셨으므로, 제단 위에 바쳐진 이삭 안에서 제시된 모형도 이루어지게 하려고 명령하셨습니다.[b]


    그러면 예언자 안에서 그분은 무엇이라고 말씀하십니까? “그들이 모든 죄를 위하여 금식 때 바치는 염소를 먹게 하라.” 주의 깊게 들으십시오. “제사장들만이 모두 씻지 않은 내장을 식초와 함께 먹게 하라.”[c]


    무엇 때문입니까? “너희가 내 새 백성의 죄를 위하여 내 육체를 바치려는 나에게 식초를 탄 쓸개를 마시게 할 것이므로, 백성이 굵은베와 재 가운데서 금식하며 슬피 우는 동안 너희만 먹어라.” 이는 그분이 그들의 손에 고난을 받으셔야 한다는 것을 보여 주시려는 것이었습니다.


    그분이 주신 명령에 주의를 기울이십시오. “보기 좋고 서로 닮은 염소 두 마리를 가져다가 바쳐라. 제사장은 그 가운데 한 마리를 죄를 위한 번제물로 삼아라.”[d]


    그러면 다른 한 마리는 어떻게 해야 합니까? 그분은 “그 한 마리는 저주받은 것이다”라고 말씀하십니다. 예수님의 모형이 어떻게 드러나는지 유의하십시오.


    “너희는 모두 그 염소에게 침을 뱉고 찔러 몰며, 그 머리 둘레에 진홍색 양털을 두른 다음 광야로 내보내라.” 이렇게 한 뒤, 염소를 광야로 데려가는 사람은 그것을 끌고 가서 양털을 벗겨 ‘라키아’라고 하는 가지 위에 올려놓습니다.[e] 이것은 우리가 들에서 발견하면 그 새순을 즐겨 먹는 바로 그 식물입니다. 가시나무 가운데 오직 이것의 열매만 이처럼 달콤합니다.


    그러면 이것은 무엇을 뜻합니까? 주의를 기울이십시오. 한 마리는 제단에 있고 다른 한 마리는 저주받았습니다. 게다가 저주받은 염소는 관을 썼습니다. 그들이 그날에 그분께서 그 몸에 긴 진홍색 옷을 걸치고 계신 것을 보고 이렇게 말할 것이기 때문입니다. “이분은 우리가 전에 십자가에 못 박고 업신여기며 침 뱉었던 바로 그분이 아닌가? 참으로 이분은 그때 자신이 하나님의 아들이라고 말씀하셨던 분이다.”


    그분은 어떻게 그 염소와 같습니까? 이 때문에 염소들이 보기 좋고 서로 닮아야 한다고 말씀한 것입니다. 훗날 그들이 그분께서 오시는 것을 볼 때, 그 염소들이 서로 닮은 것을 보고 놀라게 하려는 것입니다. 그러므로 고난받으실 예수님의 모형을 보십시오.


    그런데 양털을 가시덤불 가운데 놓는 것은 무엇을 뜻합니까? 그것은 교회를 위하여 제시된 예수님의 모형입니다. 진홍색 양털을 가져가려는 사람은 누구든지 그 가시의 무서운 성질 때문에 많은 고난을 겪어야 했고, 환난을 통하여 그것을 제압해야 했기 때문입니다. 그리하여 그분은 이렇게 말씀하십니다. “나를 보고 내 나라에 이르기를 바라는 사람들은 환난과 고난을 통하여 나를 붙들어야 한다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문구의 정확한 성경 출처는 분명하지 않습니다. 이 장의 금식일과 염소에 관한 인용들은 레위기 16장의 속죄일 규정과 관련된 전승을 반영하지만, 현존 구약 본문과 그대로 일치하지는 않습니다.
    reason: 독자가 저자의 인용과 정경 본문의 문언적 차이를 오해하지 않도록 설명합니다.
  - marker: b
    text: ‘자신의 영을 담은 그릇’은 여기서 주님의 몸을 가리키는 은유로 이해될 수 있습니다. 이삭의 봉헌 이야기는 창세기 22장에 나옵니다.
    reason: 압축된 은유와 성경적 배경을 밝힙니다.
  - marker: c
    text: 염소의 내장을 씻지 않은 채 식초와 함께 제사장들만 먹는다는 규정은 현존하는 레위기 16장 본문에는 없습니다. 저자는 당시의 의례 전승이나 현재 전해지지 않는 자료를 사용한 것으로 보입니다.
    reason: 비정형 인용의 자료적 불확실성을 정직하게 표시합니다.
  - marker: d
    text: 두 염소에 관한 배경은 레위기 16:5–10, 15–22입니다. 다만 두 염소를 ‘보기 좋고 서로 닮은’ 것으로 고르라는 표현과 이 장의 세부 절차는 현존 히브리어 본문에 그대로 나오지 않습니다.
    reason: 성경 배경과 저자의 확장된 전승을 구별합니다.
  - marker: e
    text: ‘라키아’가 가리키는 식물의 정확한 종류는 불확실합니다. 본문은 그 새순을 먹는다고 하며, 그 열매는 달다고 묘사합니다.
    reason: 불확실한 식물명을 자의적으로 동정하지 않기 위해 음역의 근거를 제공합니다.
lexical_decisions:
- source_word: children of gladness
  choice: 기쁨의 자녀 여러분
  rationale: 초기 기독교 권면문의 호칭을 보존하면서 현대 한국어 독자가 자연스럽게 이해하도록 복수 청자를 드러냈습니다.
- source_word: quick and dead
  choice: 산 자와 죽은 자
  rationale: 고어 quick의 의미를 정확히 풀어 전통적이면서도 명료한 표현으로 옮겼습니다.
- source_word: vessel of His Spirit
  choice: 자신의 영을 담은 그릇
  rationale: 육체를 영의 그릇으로 묘사하는 원문의 은유와 해석적 긴장을 보존했습니다.
- source_word: type
  choice: 모형
  rationale: 후대 사건을 미리 보여 주는 예표적 대응이라는 문맥을 살리되, 본문에서는 일관되게 ‘모형’을 사용했습니다.
- source_word: goad it
  choice: 찔러 몰며
  rationale: 도구로 찌르거나 자극해 몰아가는 행위를 자연스럽고 구체적으로 나타냈습니다.
- source_word: Rachia
  choice: 라키아
  rationale: 식물의 정확한 동정이 불확실하므로 자의적으로 특정하지 않고 음역했습니다.
- source_word: lay hold on Me
  choice: 나를 붙들어야 한다
  rationale: 관계적·구원론적 함의를 한 방향으로 좁히지 않고 원문의 강한 동작 은유를 유지했습니다.
theological_decisions:
- issue: ‘그들의 손에’에서 ‘그들’의 지시 대상
  choice: 그들의 손에
  alternative: 제사장들의 손에 / 유대인들의 손에
  rationale: 지시 범위가 문맥상 완전히 명확하지 않으므로 특정 집단으로 확대하거나 고정하지 않았습니다.
- issue: 염소 의식과 예수님의 관계
  choice: 모형
  alternative: 예언 / 직접적 동일시
  rationale: 저자가 제시하는 예표적 대응을 살리면서도 의식의 역사적 의미 전체를 그리스도론으로 환원하지 않았습니다.
- issue: ‘나의 새 백성’의 교회론적 함의
  choice: 내 새 백성
  alternative: 새 언약 백성 / 교회
  rationale: 원문의 표현을 보존하여 대체신학 등 특정 교리 체계를 본문에 덧붙이지 않았습니다.
- issue: ‘그분의 상처로 우리를 살리시려고’의 인과·목적 관계
  choice: 그분의 상처로 우리를 살리시려고
  alternative: 그분의 상처가 우리에게 생명을 주도록
  rationale: 목적 구문을 자연스럽게 옮기면서 상처와 생명의 역설적 연결을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 권면문 특유의 직접성과 장엄함을 유지하되 지나친 한문투와 번역투를 피했습니다. 제공 자료가 공공 영역 영어 증언에 기초하고 그리스어·라틴어 원문 대조가 아직 보류된 상태이므로, 불확실한 인용과 식물명은 각주로 명시하고 단정적 복원을 피했습니다.
