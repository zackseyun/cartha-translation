- from: '그러므로 기쁨의 자녀 여러분, 선하신 주님께서 모든 것을 우리에게 미리 밝혀 주셨음을 깨달으십시오. 이는 우리가 모든 일에서 누구에게 감사와 찬양을 드려야 하는지 알게 하시려는 것입니다.


    그렇다면 하나님의 아들이시며 주님이시고 장차 산 자와 죽은 자를 심판하실 분께서, 그분의 상처로 우리를 살리시려고 고난을 받으셨다면, 하나님의 아들이 우리를 위해서가 아니고서는 고난을 받으실 수 없었다는 것을 믿읍시다.


    더욱이 그분은 십자가에 못 박히셨을 때 식초와 쓸개를 마시도록 받으셨습니다. 성전의 제사장들이 이 일을 어떻게 밝혀 놓았는지 들어 보십시오. 성경에는 “금식을 지키지 않는 자는 반드시 죽을 것이다”라는 명령이 있습니다.[a] 주님께서는 자신의 영을 담은 그릇을 친히 우리 죄를 위한 희생 제물로 바치려 하셨으므로, 제단에 바쳐진 이삭에게서 주어진 모형도 이루어지게 하려고 명령하셨습니다.[b]


    그러면 예언자 안에서 그분은 무엇이라고 말씀하십니까? “그들이 모든 죄를 위하여 금식 때 바치는 염소를 먹게 하라.” 주의 깊게 들으십시오. “모든 제사장만이 씻지 않은 내장을 식초와 함께 먹게 하라.”[c]


    무엇 때문입니까? “너희가 내 새 백성의 죄를 위하여 내 육체를 바치려는 나에게 식초를 탄 쓸개를 마시게 할 것이므로, 백성이 굵은베와 재 가운데서 금식하며 슬피 우는 동안 너희만 먹어라.” 이는 그분이 그들의 손에 고난을 받으셔야 한다는 것을 보여 주시려는 것이었습니다.


    그분이 주신 명령에 주의를 기울이십시오. “보기 좋고 서로 닮은 염소 두 마리를 가져다가 바쳐라. 제사장은 그 가운데 한 마리를 죄를 위한 온전한 번제로 삼아라.”[d]


    그러면 다른 한 마리는 어떻게 해야 합니까? 그분은 “그 한 마리는 저주받은 것이다”라고 말씀하십니다. 예수님의 모형이 어떻게 드러나는지 유의하십시오.


    “너희는 모두 그 염소에게 침을 뱉고 찔러 몰며, 그 머리 둘레에 진홍색 양털을 두른 다음 광야로 내보내라.” 이렇게 한 뒤, 염소를 광야로 데려가는 사람은 그것을 끌고 가서 양털을 벗겨 ‘라키아’라고 하는 가지 위에 올려놓습니다.[e] 이것은 우리가 들에서 발견하면 그 새순을 즐겨 먹는 바로 그 식물입니다. 가시나무 가운데 오직 이것의 열매만 이처럼 달콤합니다.


    그러면 이것은 무엇을 뜻합니까? 주의를 기울이십시오. 한 마리는 제단에 있고 다른 한 마리는 저주받았습니다. 게다가 저주받은 염소는 관을 썼습니다. 그들이 그날에 그분께서 육체에 긴 진홍색 옷을 두르고 계신 것을 보고 이렇게 말할 것이기 때문입니다. “이분은 우리가 전에 십자가에 못 박고 업신여기며 침 뱉었던 바로 그분이 아닌가? 참으로 이분은 그때 자신이 하나님의 아들이라고 말씀하셨던 분이다.”


    그분은 어떻게 그 염소와 같습니까? 이 때문에 염소들이 보기 좋고 서로 닮아야 한다고 말씀한 것입니다. 훗날 그들이 그분께서 오시는 것을 볼 때, 그분이 그 염소와 닮은 모습에 놀라게 하려는 것입니다. 그러므로 고난받으실 예수님의 모형을 보십시오.


    그런데 양털을 가시덤불 가운데 놓는 것은 무엇을 뜻합니까? 그것은 교회 앞에 제시된 예수님의 모형입니다. 진홍색 양털을 가져가려는 사람은 누구든지 그 가시의 무서운 성질 때문에 많은 고난을 겪어야 했고, 환난을 통하여 그것을 제압해야 했기 때문입니다. 그리하여 그분은 이렇게 말씀하십니다. “나를 보고 내 나라에 이르기를 바라는 사람들은 환난과 고난을 통하여 나를 붙들어야 한다.”'
