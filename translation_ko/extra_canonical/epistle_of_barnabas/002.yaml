base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: ko
  text: '그러므로 때가 악하고, 활동하는 이[a] 자신이 권세를 쥐고 있음을 보니, 우리는 자신을 살피고 주님의 규례를 찾아야 합니다.


    우리 믿음을 돕는 것은 경외함과 인내이며, 우리와 함께 싸우는 벗은 오래 참음과 절제입니다.


    주님께 속한 일들에서 이것들이 순결한 영 안에 머무는 동안, 지혜와 총명과 학식과 지식도 그것들과 함께 기뻐합니다.


    주님께서는 모든 예언자를 통하여 자신이 희생 제물도, 온전한 번제물도, 봉헌물도 원하지 않으신다는 것을 우리에게 밝히셨습니다. 어느 때에는 이렇게 말씀하셨습니다.


    “너희의 수많은 희생 제물이 나에게 무슨 소용이 있느냐? 주님께서 말씀하십니다. 나는 온전한 번제물에 물렸고, 어린양의 기름과 황소와 염소의 피를 원하지 않는다. 너희가 내 앞에 보이러 온다 해도 마찬가지다. 누가 이런 것들을 너희 손에서 요구하였느냐? 다시는 내 뜰을 계속 짓밟지 마라. 고운 곡식 가루를 가져와도 헛될 뿐이며, 향은 나에게 혐오스러운 것이다. 너희의 초하루와 안식일을 나는 견딜 수 없다.”[b]


    그러므로 주님께서는 이런 것들을 폐하셨습니다. 이는 강요의 멍에에서 벗어난 우리 주 예수 그리스도의 새 법이 사람의 손으로 만들지 않은 봉헌물을 갖게 하시려는 것이었습니다.


    또 그들에게 이렇게 말씀하십니다. “내가 너희 조상들을 이집트 땅에서 이끌어 낼 때, 나에게 온전한 번제물과 희생 제물을 바치라고 명령하였느냐?


    아니다. 내가 그들에게 명령한 것은 이것이다. 너희 가운데 아무도 이웃에 대한 악한 원한을 마음에 품지 말고, 거짓 맹세를 좋아하지 마라.”[c]


    그러므로 우리가 깨달음 없는 사람들이 아니라면, 우리 아버지의 선하심이 품은 뜻을 알아야 합니다. 아버지께서는 우리가 그들처럼 길을 잃지 않고 어떻게 자신에게 가까이 나아갈지를 찾기 바라시며 우리에게 말씀하십니다.


    그리하여 우리에게 이렇게 말씀하십니다. “하나님께 드리는 희생 제물은 상한 마음이며, 주님께 향기로운 냄새는 자신을 지으신 분께 영광을 돌리는 마음이다.”[d] 그러므로 형제자매 여러분, 우리는 우리의 구원에 관하여 정확히 배워야 합니다. 악한 자가 우리 안에 미혹이 들어올 길을 내어 우리를 생명에서 내던지지 못하게 해야 합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘활동하는 이’는 제공된 영어 증언문이 보존한 모호한 칭호입니다. 문맥상 악한 세력을 가리킬 수 있으나, 직접 원문 검토 전에는 ‘악한 자’로 확정하지 않습니다.
    reason: 잠재적으로 중요한 원어상의 칭호와 그 해석적 불확실성을 독자에게 알리기 위함입니다.
  - marker: b
    text: 이 인용은 이사야 1:11–13을 중심으로 한 형태이며, 현존 정경 본문의 문구와 배열이 일부 다릅니다.
    reason: 저자가 사용하는 인용 형태가 현대 성경 번역과 정확히 일치하지 않을 수 있음을 밝혀 혼동을 줄입니다.
  - marker: c
    text: 이 단락은 예레미야 7:22–23과 스가랴 8:17 등의 표현을 결합하거나 자유롭게 인용한 것으로 보입니다.
    reason: 단일 구절의 정확한 인용으로 오인하지 않도록 복합적인 성경 전승 배경을 표시합니다.
  - marker: d
    text: ‘상한 마음’은 시편 51:17을, ‘향기로운 냄새’와 창조주께 영광을 돌리는 마음은 다른 성경적 제사 표현을 반영하는 것으로 보입니다.
    reason: 저자의 결합 인용 또는 성경적 표현의 융합을 설명합니다.
lexical_decisions:
- source_word: ὁ ἐνεργῶν / “the Active One” (witness)
  choice: 활동하는 이
  rationale: 직접 원문 검토가 보류된 상태에서 증언문이 보존한 잠재적 칭호와 모호성을 유지했습니다. 문맥상 ‘악한 자’를 뜻할 가능성이 있지만 본문에서 곧바로 그렇게 확정하지 않았습니다.
- source_word: φόβος / “fear”
  choice: 경외함
  rationale: 믿음을 돕는 덕목의 문맥에서 단순한 공포보다 하나님을 향한 두려움과 존중을 함께 나타내되, 종교적 의미를 과도하게 풀어 쓰지 않았습니다.
- source_word: μακροθυμία / “long-suffering”
  choice: 오래 참음
  rationale: 고난과 타인의 잘못을 길이 견디는 덕목의 의미를 자연스러운 현대 한국어로 옮겼습니다.
- source_word: ἐπιστήμη / “science”
  choice: 학식
  rationale: 현대의 자연과학으로 오해되지 않도록 하면서도 체계적으로 익힌 앎이라는 의미를 보존했습니다.
- source_word: προσφορά / “oblation”
  choice: 봉헌물
  rationale: 희생 제물 및 번제물과 병렬되는, 바쳐 드리는 예물을 가리키는 제의적 표현을 유지했습니다.
- source_word: ἀχειροποίητος / “not made by human hands”
  choice: 사람의 손으로 만들지 않은
  rationale: 신학적으로 함축된 관용구를 해석적으로 특정 대상에 한정하지 않고 직역에 가깝게 보존했습니다.
theological_decisions:
- issue: ‘활동하는 이’의 정체
  choice: 모호한 칭호로 보존
  alternative: ‘악한 자’ 또는 ‘사탄’으로 명시
  rationale: 장 끝의 ‘악한 자’와 연결될 수 있으나, 제공된 증언문 자체가 별도의 표현을 사용하므로 동일성을 본문에서 단정하지 않았습니다.
- issue: 제의 규정의 폐지 범위
  choice: 저자의 진술인 ‘이런 것들을 폐하셨습니다’를 그대로 번역
  alternative: 모세 율법 전체가 폐지되었다고 확대
  rationale: 문맥은 희생 제물·번제물·봉헌물과 강요의 멍에를 말하므로, 폐지 범위를 본문보다 넓히지 않았습니다.
- issue: ‘새 법’의 봉헌물
  choice: ‘사람의 손으로 만들지 않은 봉헌물’로 모호성을 유지
  alternative: 찬양, 성찬, 마음, 또는 그리스도의 희생으로 특정
  rationale: 본문이 봉헌물의 정체를 명시하지 않으므로 특정 교파적 해석을 들여오지 않았습니다.
- issue: ‘상한 마음’과 ‘영광을 돌리는 마음’의 관계
  choice: 두 인용문을 병렬로 유지
  alternative: 하나의 영적 제사 교리로 통합하여 해설
  rationale: 서로 다른 성경적 표현을 결합한 저자의 수사와 긴장을 그대로 보존했습니다.
- issue: adelphoi의 포괄적 호칭
  choice: 형제자매 여러분
  alternative: 형제 여러분
  rationale: 공동체 전체를 향한 일반 호칭으로 자연스럽게 전달하되 혈연이나 남성만을 가리키는 것으로 좁히지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 예언서 인용은 장중하되 고어투를 피했고, 논설 부분은 보통 독자가 따라갈 수 있도록 문장을 나누었습니다. ‘주님’과 ‘하나님’을 문맥에 따라 구별했으며, 원문 증거 검토가 보류된 만큼 영어 공개 증언문에서 드러나는 모호성은 각주와 본문에 보존했습니다.
