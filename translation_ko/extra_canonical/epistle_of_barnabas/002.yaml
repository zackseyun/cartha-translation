    “너희의 수많은 희생 제물이 나에게 무슨 소용이 있느냐? 주님께서 말씀하신다. 나는 온전한 번제물에 배불렀고, 어린양의 기름과 황소와 염소의 피를 원하지 않는다. 너희가 내게 보이려고 온다 해도 마찬가지다. 누가 이런 것들을 너희 손에서 요구하였느냐? 다시는 내 뜰을 계속 밟지 마라. 고운 곡식 가루를 가져와도 헛될 뿐이며, 향은 나에게 혐오스러운 것이다. 너희의 초하루와 안식일을 나는 견딜 수 없다.”[b]


    그러므로 주님께서는 이런 것들을 폐하셨습니다. 이는 강요의 멍에에서 벗어난 우리 주 예수 그리스도의 새 법이 사람의 손으로 만들지 않은 봉헌물을 갖게 하시려는 것이었습니다.


    또 그들에게 이렇게 말씀하십니다. “내가 너희 조상들을 이집트 땅에서 이끌어 낼 때, 나에게 온전한 번제물과 희생 제물을 바치라고 명령하였느냐?


