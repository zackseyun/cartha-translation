  revised_text: '모세가 “너희는 돼지나 독수리나 매나 솔개나 까마귀를 먹어서는 안 되며, 비늘이 없는 어떤 물고기도 먹어서는 안 된다”라고 말했을 때, 그는 그 뜻 가운데 세 가지 규례를 깨달았습니다.


    또 하나님께서는 신명기에서 그들에게 이렇게 말씀하십니다. “내가 내 규례를 이 백성에게 언약으로 세우겠다.” 그러므로 이 말씀은 이로 물어 먹지 말라는 하나님의 계명이 아닙니다. 오히려 모세는 영적으로 말했습니다.


    그가 돼지를 언급한 뜻은 이러합니다. 그는 말합니다. “돼지와 같은 사람들을 사귀지 마십시오.” 그런 사람들은 풍족할 때에는 주님을 잊지만, 궁핍해지면 주님을 알아봅니다. 돼지도 먹을 때에는 제 주인을 알지 못하지만, 배가 고프면 소리를 지르고, 다시 먹이를 받으면 잠잠해집니다.


    “독수리나 매나 솔개나 까마귀도 먹어서는 안 됩니다.” 그는 말합니다. “수고하고 땀 흘려 스스로 먹을 것을 마련할 줄은 모르면서, 불법 가운데 남의 것을 빼앗는 사람들을 사귀거나 그와 같아지지 마십시오. 그들은 순진한 척하면서 탐욕으로 빼앗을 사람을 살피고 찾아다닙니다.” 이 새들도 스스로 먹이를 마련하지 않고 한가로이 앉아서 남의 고기를 어떻게 먹을까 궁리하며, 악행을 일삼는 해로운 존재입니다.


    그는 또 말합니다. “칠성장어나 문어나 갑오징어도 먹어서는 안 됩니다.” 그 뜻은 이러합니다. “극도로 악하고 이미 죽음의 판결을 받은 사람들과 같이 되지 마십시오.” 이 물고기들만은 저주받아 깊은 곳에서 헤엄치며, 다른 물고기들처럼 수면에서 헤엄치지 않고 깊은 바다 밑바닥에 삽니다.


    또 “토끼를 먹어서는 안 됩니다.” 왜 그렇습니까? “소년들을 타락시키는 사람이 되어서도 안 되고, 그런 사람들과 같이 되어서도 안 됩니다.” 토끼는 해마다 몸에 구멍을 하나씩 더 얻으므로, 산 햇수만큼 구멍을 지닌다고 합니다.[a]


    또 “하이에나도 먹어서는 안 됩니다.” 그는 말합니다. “간음하는 사람이나 음행하는 사람이 되어서도 안 되고, 그런 사람들을 닮아서도 안 됩니다.” 왜 그렇습니까? 이 동물은 해마다 본성이 바뀌어, 어느 때에는 수컷이 되고 어느 때에는 암컷이 된다고 합니다.[b]


    또한 하나님께서 족제비도 미워하신 것은 당연합니다. 그는 말합니다. “입으로 부정한 악행을 저지른다고 우리가 듣는 사람들과 같이 되지 말고, 입으로 부정한 악행을 저지르는 불결한 여자들을 사귀지도 마십시오.” 이 동물은 입으로 잉태한다고 합니다.[c]


    그러므로 음식에 관하여 모세는 이런 뜻을 지닌 세 가지 규정을 받아 영적인 의미로 말했습니다. 그러나 그들은 육신의 욕망을 따라, 마치 그것들이 먹는 일을 가리키는 것처럼 받아들였습니다.


    다윗도 이 세 규정에 관한 지식을 받아 이렇게 말합니다. “경건하지 않은 자들의 모의에 따라 걷지 않은 사람은 복이 있습니다.” 이는 물고기들이 어둠 속에서 깊은 곳으로 들어가는 것과 같습니다. “죄인들의 길에 서지 않은 사람은 복이 있습니다.” 이는 주님을 두려워하는 체하면서 돼지처럼 죄짓는 자들과 같습니다. “파괴자들의 자리에 앉지 않은 사람은 복이 있습니다.” 이는 먹잇감을 노리고 앉아 있는 새들과 같습니다. 이제 여러분은 음식에 관한 가르침을 온전히 받았습니다.


    모세는 또 말합니다. “굽이 갈라지고 되새김질하는 것은 모두 먹어도 됩니다.” 이 말씀은 무슨 뜻입니까? 먹을 것을 받는 사람은 그것을 주시는 분을 알고, 배불리 먹은 뒤 그분 안에서 기뻐하는 듯 보인다는 뜻입니다. 그는 계명을 염두에 두고 참으로 잘 말했습니다. 그러면 그 뜻은 무엇입니까? 주님을 두려워하는 사람들과 가까이 지내십시오. 곧 자신들이 받은 말씀의 분별을 마음속에 두고 묵상하는 사람들, 주님의 규례를 말하고 지키는 사람들, 묵상이 기쁨의 일임을 알고 주님의 말씀을 되새김질하는 사람들과 가까이 지내십시오. 그런데 왜 굽이 갈라진 짐승입니까? 의인은 이 세상에서 살아가는 동시에 장차 올 거룩한 세상을 바라보기 때문입니다. 여러분은 모세가 얼마나 지혜로운 입법자였는지 알 것입니다.


    그러나 그들이 어떻게 이런 것들을 알아차리거나 이해할 수 있었겠습니까? 우리는 계명을 올바르게 깨달았으므로, 주님께서 뜻하신 대로 그것들을 전합니다. 그분께서 우리의 귀와 마음에 할례를 행하신 것은 우리가 이런 것들을 깨닫게 하시려는 것입니다.'
