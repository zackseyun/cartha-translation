    issue: ‘in spirit’를 ‘성령 안에서’로 번역함
    rationale: 공급된 영어 증언은 ‘Moses spoke it in spirit’라고 하며, 바로 뒤에서 모세가 규정들을 ‘in a spiritual sense’로 말했다고 풀이합니다. 성령을 지시한다고 확정할 근거가 이 자료만으로 충분하지 않으므로 ‘영적으로 말했습니다’가 안전합니다.
  - severity: medium
