  source_fidelity: 전반적인 문단 구성과 바나바서 저자의 알레고리적 음식 규정 해석은 잘 보존했습니다. 다만 ‘in spirit’를 ‘성령 안에서’로 옮긴 것은 영어 증언 및 이 장의 반복되는 ‘spiritual sense’와 비교할 때 성령을 특정하는 과도한 해석입니다. 또한 고대 동물학적 주장에 ‘…다고 여겼기 때문’을 본문에 넣어 저자의 단정적 진술을 간접화한 점은 각주로 처리하는 편이 더 충실합니다.
  naturalness: 현대 표준 한국어 합쇼체는 대체로 자연스럽습니다. 그러나 ‘달라붙지 마십시오’는 사람과의 교제·동조를 뜻하는 문맥에서 다소 물리적이며, ‘그분께서는 … 말씀하십니다’는 서술 시제와 지시 대상이 불안정합니다. 이를 ‘사귀지 마십시오/그와 같아지지 마십시오’ 및 일관된 과거 서술로 정리했습니다.
  terminology: ‘영적으로’는 여기서 원문의 비유적·영적 해석을 보존하면서 성령으로 한정하지 않습니다. ‘규례’와 ‘계명’은 유지했습니다. lamprey는 ‘칠성장어’, polypus와 cuttlefish는 각각 ‘문어’, ‘갑오징어’로 두었습니다. 성적 착취를 가리키는 난해하고 불쾌한 대목은 원문의 직접성을 축소하지 않되 선정적으로 확장하지 않았습니다.
  issues:
