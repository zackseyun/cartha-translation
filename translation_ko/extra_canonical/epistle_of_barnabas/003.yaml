base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: ko
  text: '바나바의 편지 3장


    그러므로 그분은 이 일들에 관하여 그들에게 다시 말씀하십니다. “너희가 어찌하여 나를 위하여 금식하며, 오늘 큰 소리로 외쳐 너희 목소리가 들리게 하느냐? 이것은 내가 택한 금식이 아니다. 주께서 말씀하신다. 사람이 자기 영혼을 낮추는 것도 아니며,


    너희가 목을 고리처럼 굽히고 굵은 베옷을 입으며 재 위에 자리를 편다 하여도 아니다. 그렇게 한다 해도 너희는 그것을 받아들일 만한 금식이라고 부르지 못할 것이다.


    그러나 그분은 우리에게 말씀하십니다. ‘보라, 이것이 내가 택한 금식이다. 주께서 말씀하신다. 모든 악의 결박을 풀고, 강제로 맺은 계약의 팽팽한 끈을 끌러 주며, 억눌려 상한 이들을 자유롭게 보내고, 모든 불의한 멍에를 산산이 부수어라. 네 빵을 떼어 굶주린 이에게 주고, 헐벗은 이를 보면 옷을 입혀 주어라. 거처 없는 이들을 네 집으로 맞아들이고, 낮아진 이를 보면 그를 업신여기지 말며, 네 집안사람이나 네 혈육 가운데 누구도 업신여기지 마라.


    그때 네 빛이 아침처럼 터져 나오고, 네 상처가 속히 아물 것이다. 의가 네 앞에서 나아가고, 하나님의 영광이 너를 둘러쌀 것이다.


    그때 네가 부르짖으면 하나님께서 네 말을 들으실 것이며, 네가 아직 말하고 있을 때에 그분이 “보라, 내가 여기 있다” 하실 것이다. 네가 네게서 멍에와 손가락질과 불평하는 말을 없애고, 굶주린 이에게 진심으로 네 빵을 주며, 낮아진 영혼을 불쌍히 여긴다면 그렇게 될 것이다.’


    그러므로 형제 여러분, 오래 참으시는 분께서는 자신이 사랑하시는 이 안에서 준비하신 백성이 순전한 마음으로 믿게 될 것을 내다보셨습니다. 그래서 모든 일을 우리에게 미리 밝혀 주셨습니다. 이는 우리가 초심자로서 그들의 율법에 부딪혀 파선하지 않게 하시려는 것입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 시나이 사본을 비롯한 그리스어·라틴어 증언에 대한 직접 대조가 아직 필요합니다. 특히 ‘강제로 맺은 계약’, ‘사랑하시는 이 안에서 준비하신’, ‘그들의 율법’의 정확한 문구와 구문은 원문 대조에 따라 조정될 수 있습니다.
    reason: 제공 자료 자체가 원어 검토 대기 상태이므로 번역의 증거적 한계를 독자에게 투명하게 밝힙니다.
lexical_decisions:
- source_word: abasing/humbling his soul
  choice: 자기 영혼을 낮추는 것
  rationale: 금식과 자기 비하를 연결하는 고대 성서적 표현을 보존하면서도 현대 독자가 이해할 수 있게 옮겼습니다.
- source_word: forced contracts
  choice: 강제로 맺은 계약
  rationale: 채무·계약 관계의 강압성을 드러내되, 원문 증거 검토 전 특정 사회 제도로 한정하지 않았습니다.
- source_word: the broken ones
  choice: 억눌려 상한 이들
  rationale: 단순히 신체적으로 ‘부서진’ 상태가 아니라 압제 때문에 꺾인 사람들을 가리키는 문맥을 반영하되 비유적 폭을 유지했습니다.
- source_word: stretching forth of the finger
  choice: 손가락질
  rationale: 비난·모욕의 몸짓을 자연스러운 현대 한국어로 전달했습니다.
- source_word: in simplicity
  choice: 순전한 마음으로
  rationale: 어리석음이 아니라 꾸밈없고 나뉘지 않은 태도라는 긍정적 의미를 살렸습니다.
- source_word: shipwreck ourselves upon their law
  choice: 그들의 율법에 부딪혀 파선하다
  rationale: 항해 비유와 ‘그들의 율법’이라는 논쟁적 표현을 완화하거나 교리적으로 재해석하지 않고 보존했습니다.
theological_decisions:
- issue: ‘그분/주/하나님’의 지시 대상
  choice: 인용 도입부에서는 ‘그분’을 유지하고 인용문 안에서는 ‘주’와 ‘하나님’을 증언된 형태대로 구분함
  alternative: 모든 지시 대상을 하나님 또는 그리스도로 명시함
  rationale: 본문이 화자를 완전히 명시하지 않는 곳에서 후대의 삼위일체적 또는 기독론적 동일시를 번역에 선입하지 않았습니다.
- issue: ‘자신이 사랑하시는 이 안에서’의 정체
  choice: 사랑하시는 이
  alternative: 사랑하시는 아들 또는 그리스도
  rationale: 그리스도를 가리킬 가능성이 높지만, 제공된 증언의 ‘well-beloved’가 가진 표현을 보존하여 번역 자체에서 명칭을 확정하지 않았습니다.
- issue: ‘그들의 율법’의 의미
  choice: 그들의 율법
  alternative: 유대인의 율법 또는 율법주의
  rationale: 대상 집단을 명시하거나 율법을 추상적 교리 문제로 바꾸지 않고 본문의 긴장과 거리 두기를 그대로 남겼습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 본문 인용은 장중하되 과도하게 고어적인 표현을 피했고, 권면은 자연스러운 명령형으로 옮겼습니다. 성서 인용의 반복과 수사적 흐름, 마지막 문단의 항해 비유를 보존했습니다.
