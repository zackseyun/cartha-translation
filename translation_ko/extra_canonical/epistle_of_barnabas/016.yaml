id: BARN.016
reference: Epistle of Barnabas — Barn. 16
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'Moreover I will tell you likewise concerning the temple, how these wretched men being led astray set their hope on the building, and not on their God that made them, as being a house of God.


    For like the Gentiles almost they consecrated Him in the temple. But what saith the Lord abolishing the temple? Learn ye. Who hath measured the heaven with a span, or hath measured the earth with his hand? Have not I, saith the Lord? The heaven is My throne and the earth the footstool of My feet. What manner of house will ye build for Me? Or what shall be my resting place? Ye perceive that their hope is vain.


    Furthermore He saith again; Behold they that pulled down this temple themselves shall build it.


    So it cometh to pass; for because they went to war it was pulled down by their enemies. Now also the very servants of their enemies shall build it up.


    Again, it was revealed how the city and the temple and the people of Israel should be betrayed. For the scripture saith; And it shall be in the last days, that the Lord shall deliver up the sheep of the pasture and the fold and the tower thereof to destruction. And it came to pass as the Lord spake.


    But let us enquire whether there be any temple of God. There is; in the place where he himself undertakes to make and finish it. For it is written And it shall come to pass, when the week is being accomplished, the temple of God shall be built gloriously in the name of the Lord.


    I find then that there is a temple, How then shall it be built in the name of the Lord? Understand ye. Before we believed on God, the abode of our heart was corrupt and weak, a temple truly built by hands; for it was full of idolatry and was a house of demons, because we did whatsoever was contrary to God.


    But it shall be built in the name of the Lord. Give heed then that the temple of the Lord may be built gloriously.


    How? Understand ye. By receiving the remission of our sins and hoping on the Name we became new, created afresh from the beginning. Wherefore God dwelleth truly in our habitation within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching, He Himself prophesying in us, He Himself dwelling in us, opening for us who had been in bondage unto death the door of the temple, which is the mouth, and giving us repentance leadeth us to the incorruptible temple.


    For he that desireth to be saved looketh not to the man, but to Him that dwelleth and speaketh in him, being amazed at this that he has never at any time heard these words from the mouth of the speaker, nor himself ever desired to hear them. This is the spiritual temple built up to the Lord.'
