  source_fidelity: 전반적으로 영어 증언의 논지와 성전 이미지, 인용문의 불확실성을 충실히 옮겼습니다. 다만 ‘실제로 그렇게 되어 갑니다’는 과거의 파괴가 이미 일어났다는 바로 다음 문장과 맞지 않아 ‘그렇게 되었습니다’로 고쳤습니다. 또한 ‘그분의 믿음의 말씀’ 이하의 난해한 열거에 ‘우리 안에 있습니다’를 보태어 원문에 없는 독립 서술을 만들었던 점을 제거하고, 원문의 느슨하고 논쟁적인 통사 구조를 유지했습니다.
  naturalness: 합쇼체의 현대 표준어는 대체로 자연스럽습니다. ‘하나님을 성전 안에 모셔 두었습니다’는 ‘성전 안에 하나님을 가두어 둔다’는 비판적 함의를 자연스럽게 전달합니다. ‘하나님께서 친히 지어 완성하시기로 하신 곳’은 ‘그분께서 친히 세우시고 완성하실 곳’으로 다듬어, 성전과 장소의 관계를 더 매끄럽게 했습니다.
  terminology: ‘성전’, ‘하나님의 집’, ‘회개’, ‘썩지 않는’, ‘영적인 성전’은 일관되고 적절합니다. ‘악령들의 집’은 영어 witness의 ‘house of demons’를 충실히 반영합니다. ‘그 이름’은 원문의 절대적 ‘Name’을 보존합니다.
  issues:
