  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: ko
  text: '16


    또한 성전에 관해서도 여러분에게 말씀드리겠습니다. 곧 그 불쌍한 사람들이 어떻게 미혹되어, 자신들을 지으신 하나님이 아니라 그 건물을 마치 하나님의 집인 양 의지하게 되었는지 말씀드리겠습니다.


    그들은 거의 이방인들처럼 하나님을 성전 안에 모셔 두었습니다. 그러나 성전을 폐하시는 주께서 무엇이라고 말씀하십니까? 배워 두십시오. “누가 손뼘으로 하늘을 재었고, 손으로 땅을 재었느냐? 나 아니냐?” 주께서 말씀하십니다. “하늘은 나의 보좌요, 땅은 내 발의 발판이다. 너희가 나를 위하여 어떤 집을 짓겠느냐? 또는 내가 쉴 곳이 어디이겠느냐?” 여러분은 그들의 소망이 헛되다는 것을 깨닫습니다.


    또 주께서 다시 말씀하십니다. “보라, 이 성전을 헐어 버린 바로 그들이 그것을 세울 것이다.”[a]


    실제로 그렇게 되어 갑니다. 그들이 전쟁을 일으켰기 때문에 성전은 원수들에게 헐렸습니다. 이제는 그 원수들의 종들까지도 그것을 다시 세울 것입니다.[b]


    또 그 도성과 성전과 이스라엘 백성이 어떻게 넘겨질지도 계시되었습니다. 성경은 이렇게 말합니다. “마지막 날들에 주께서 목장의 양들과 우리와 그 망대를 멸망에 넘기실 것이다.” 그리고 주께서 말씀하신 그대로 이루어졌습니다.


    그러면 하나님의 성전이 과연 있는지 살펴봅시다. 있습니다. 하나님께서 친히 지어 완성하시기로 하신 곳에 있습니다. 기록되기를, “그 주간이 끝나 갈 때, 하나님의 성전이 주의 이름으로 영광스럽게 세워질 것이다” 하였습니다.[c]


    그러므로 성전이 있다는 것을 나는 알게 됩니다. 그렇다면 그 성전은 어떻게 주의 이름으로 세워지겠습니까? 깨달으십시오. 우리가 하나님을 믿기 전에는 우리 마음의 거처가 부패하고 약했으며, 참으로 사람의 손으로 지은 성전과 같았습니다. 우리가 하나님을 거스르는 모든 일을 행했으므로, 그곳은 우상 숭배로 가득했고 악령들의 집이었습니다.


    그러나 그 성전은 주의 이름으로 세워질 것입니다. 그러므로 주의 성전이 영광스럽게 세워지도록 주의를 기울이십시오.


    어떻게 그렇게 됩니까? 깨달으십시오. 우리는 죄를 용서받고 그 이름에 소망을 둠으로써 새롭게 되었고, 처음부터 다시 창조되었습니다. 그러므로 하나님께서 참으로 우리 안의 거처에 사십니다. 어떻게 그러하십니까? 그분의 믿음의 말씀, 그분의 약속의 부르심, 규례들의 지혜, 가르침의 계명들이 우리 안에 있습니다. 하나님께서 친히 우리 안에서 예언하시고 친히 우리 안에 거하시며, 죽음에 종노릇하던 우리에게 성전의 문, 곧 입을 열어 주시고 회개를 주심으로써, 우리를 썩지 않는 성전으로 이끄십니다.[d]


    구원받기를 바라는 사람은 말하는 사람을 바라보지 않고, 그 사람 안에 거하시며 말씀하시는 분을 바라봅니다. 그는 그 말하는 이의 입에서 이런 말씀을 전에는 한 번도 들어 본 적이 없고, 자기 자신도 그것을 듣고 싶어 한 적이 없었다는 사실에 놀랍니다.[e] 이것이 주를 위하여 세워진 영적인 성전입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 인용문의 정확한 성경 출처는 분명하지 않습니다. 고대 전승에 알려진 예언적 표현을 인용한 것일 수 있습니다.
    reason: 독자가 정경의 특정 구절로 오인하지 않도록 출처 불확실성을 알립니다.
  - marker: b
    text: ‘원수들의 종들’과 성전 재건에 관한 역사적 지시 대상은 불분명합니다. 일부 고대 문맥에서는 로마 통치 아래의 재건 활동을 가리키는 말로 이해될 수 있습니다.
    reason: 본문이 전제하는 역사적 배경을 단정하지 않고 모호성을 보존합니다.
  - marker: c
    text: ‘그 주간’은 어떤 정해진 기간 또는 예언적 한 주를 가리킬 수 있으나, 이 인용문의 출처와 정확한 의미는 확실하지 않습니다.
    reason: 예언적 시간 표현을 특정 종말론 체계로 고정하지 않습니다.
  - marker: d
    text: 이 문장의 문법적 연결은 복잡합니다. ‘이끄십니다’의 주어를 하나님으로 보았지만, 앞에 열거된 하나님의 말씀과 명령 전체가 우리를 이끈다는 뜻으로도 읽을 수 있습니다.
    reason: 번역에서 불가피하게 선택한 통사적 해석의 대안을 제시합니다.
  - marker: e
    text: ‘말하는 이’는 하나님의 말씀을 전하는 사람을 가리키며, 그 안에서 하나님이 말씀하신다는 뜻입니다. 문장의 마지막 부분은 듣는 사람과 말하는 사람 중 누구의 이전 욕구를 가리키는지 다소 모호합니다.
    reason: 대명사와 관점의 불확실성을 독자에게 알립니다.
lexical_decisions:
- source_word: ναός / templum (temple)
  choice: 성전
  rationale: 건물로서의 예루살렘 성전과 신자 안의 영적 성전이라는 연속된 비유를 보존합니다.
- source_word: οἶκος θεοῦ (house of God)
  choice: 하나님의 집
  rationale: ‘성전’과 구별되는 집의 이미지를 살리면서 현대 독자가 자연스럽게 이해하도록 했습니다.
- source_word: ὄνομα (Name)
  choice: 그 이름
  rationale: 신적 권위와 정체성을 함축하는 절대적 용법을 보존하되, 한국어 문맥상 지시 대상을 분명히 했습니다.
- source_word: ἄφθαρτος (incorruptible)
  choice: 썩지 않는
  rationale: 단순히 ‘영원한’으로 해석해 버리지 않고 부패하지 않음이라는 원래 이미지를 유지합니다.
- source_word: μετάνοια (repentance)
  choice: 회개
  rationale: 마음과 방향의 전환을 가리키는 초기 그리스도교의 통상적 의미를 간결하게 전달합니다.
- source_word: κατοικητήριον / habitation
  choice: 거처
  rationale: 하나님이 사람 안에 거하신다는 성전·주거 이미지를 일관되게 유지합니다.
theological_decisions:
- issue: 물리적 성전과 영적 성전의 관계
  choice: 저자가 물리적 건물에 둔 소망을 비판하고 공동체 또는 신자 안에 세워지는 영적 성전을 제시하는 논리를 그대로 보존했습니다.
  alternative: 후자를 교회 제도나 개인의 몸 중 하나로 명시적으로 한정할 수 있습니다.
  rationale: 본문은 개인과 공동체의 언어를 함께 사용하므로 어느 하나로 단정하지 않는 것이 원문의 긴장을 보존합니다.
- issue: ‘그분의 믿음의 말씀’의 의미
  choice: 소유격의 모호성을 유지하여 ‘그분의 믿음의 말씀’으로 옮겼습니다.
  alternative: ‘그분을 믿는 믿음의 말씀’ 또는 ‘그분의 신실하심에 관한 말씀’으로 풀이할 수 있습니다.
  rationale: 직접 원문 대조가 보류된 자료에서 신학적 의미를 한쪽으로 확정하지 않았습니다.
- issue: 사람 안에서 말씀하시는 분의 정체
  choice: ‘그 사람 안에 거하시며 말씀하시는 분’으로 번역했습니다.
  alternative: 성령 또는 그리스도로 명시할 수 있습니다.
  rationale: 문맥상 하나님을 가리키지만 본문이 위격을 명시하지 않으므로 특정 위격을 삽입하지 않았습니다.
- issue: 이스라엘 백성에 대한 서술
  choice: 고대 저자의 논쟁적 평가를 역사적 본문으로 보존하되 ‘불쌍한 사람들’로 번역했습니다.
  alternative: ‘비참한 자들’처럼 더 강한 경멸 표현을 사용할 수 있습니다.
  rationale: 원문의 비판적 어조를 유지하면서 현대 한국어에서 불필요하게 모욕적인 강도를 더하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 ‘배워 두십시오’, ‘깨달으십시오’, ‘주의를 기울이십시오’로 통일해 고대 교훈문의 엄숙함을 살렸습니다. 성경 인용은 존엄하되 지나치게 고어적인 표현을 피했습니다. 제공 자료가 영어 공용 번역 증언이며 직접적인 그리스어·라틴어 원문 검토가 보류되어 있으므로, 불확실한 통사와 역사적 지시 대상은 각주로 명시했습니다.
