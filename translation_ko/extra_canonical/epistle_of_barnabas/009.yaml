  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
translation:
  language: ko
  text: '## 바나바의 서신 9장


    더 나아가 귀에 관해서는, 그분께서 할례를 행하신 것이 바로 우리의 마음이라고 말합니다. 주님께서 예언자를 통하여 말씀하십니다. “그들은 귀로 듣고 내 말에 귀를 기울였다.” 또 말씀하십니다. “멀리 있는 이들이 귀로 듣고 내가 한 일을 깨달을 것이다.” 그리고 주님께서 말씀하십니다. “너희 마음에 할례를 받으라.”


    또 말씀하십니다. “이스라엘아, 들으라. 주 너의 하나님께서 이렇게 말씀하신다. 영원히 살기를 바라는 사람은 누구냐? 그는 내 종의 목소리를 귀로 들으라.”[a] 또 말씀하십니다. “하늘아, 듣고 땅아, 귀를 기울이라. 주님께서 이 말씀들을 증언으로 하셨다.” 또 말씀하십니다. “이 백성의 통치자들아, 주님의 말씀을 들으라.” 또 말씀하십니다. “내 자녀들아, 광야에서 외치는 이의 목소리를 들으라.” 그러므로 그분께서 우리 귀에 할례를 행하신 것은, 우리가 말씀을 듣고 믿게 하시려는 것이었습니다.


    그러나 그들이 의지하는 할례는 폐지되었습니다. 그분께서 육체에 속하지 않은 할례를 행해야 한다고 말씀하셨기 때문입니다. 하지만 그들은 계명을 어겼습니다. 악한 천사가 그들에게 잔꾀를 가르쳤기 때문입니다.


    그분께서 그들에게 말씀하십니다. “주 너희 하나님께서 이렇게 말씀하신다.” 내가 찾은 계명은 이렇습니다. “가시덤불 가운데 씨를 뿌리지 말고, 너희 주님께로 할례를 받으라.”[b] 그러면 그분께서 무엇이라고 말씀하십니까? “너희 마음의 완고함에 할례를 받으라. 그러면 다시는 목을 곧게 하지 않을 것이다.” 이 말씀도 받아들이십시오. “보라, 모든 민족은 포피에 할례를 받지 않았지만, 이 백성은 마음에 할례를 받지 않았다.” 주님께서 말씀하십니다.


    그러나 여러분은 “참으로 그 백성은 표징으로 할례를 받았습니다”라고 말할 것입니다. 그렇지 않습니다. 시리아 사람과 아라비아 사람도 모두 그러하고, 우상의 제사장들도 모두 그러합니다. 그렇다면 그들도 모두 그들의 언약에 속합니까? 더구나 이집트 사람들도 할례받은 이들 가운데 포함됩니다.


    그러므로 사랑의 자녀들이여, 모든 것을 넉넉히 배우십시오. 처음으로 할례를 정한 아브라함은 세 글자의 규례를 받고 할례를 행할 때, 성령 안에서 예수님을 미리 내다보았습니다.[c]


    성경은 “아브라함이 자기 집안사람 가운데 열여덟 명과 삼백 명에게 할례를 행했다”라고 말합니다.[d] 그렇다면 그에게 주어진 지식은 무엇이었습니까? 먼저 열여덟을 말하고, 한 칸을 띄운 다음 삼백을 말했다는 것을 깨달으십시오. 열여덟에서 ‘Ι’는 십을, ‘Η’는 팔을 나타냅니다. 여기에서 ‘예수’(ΙΗΣΟΥΣ)를 얻습니다. 그리고 ‘Τ’에는 십자가가 은혜를 가져올 것이 나타나므로, 삼백도 말합니다. 이처럼 그분께서는 두 글자로 예수님을, 나머지 한 글자로 십자가를 드러내십니다.[e]


    우리 안에 그분의 언약이라는 타고난 선물을 두신 분께서 아십니다. 아무도 나에게서 이보다 더 참된 말씀을 배운 적이 없습니다. 그러나 나는 여러분이 받을 만한 사람들임을 압니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제공된 영어 증언에는 이 인용문 뒤에 본문과 무관해 보이는 ‘~y’가 있습니다. 필사본 또는 편집상의 표지로 보고 본문에서는 옮기지 않았습니다.
    reason: 겉보기의 페이지·편집 표지를 독자에게 알리면서 본문에 유입시키지 않기 위해서입니다.
  - marker: b
    text: “너희 주님께로 할례를 받으라”는 제공된 증언의 특이한 문구를 보존한 것입니다. 직접 그리스어·라틴어 본문을 대조하면 전치사의 의미와 본문 형태를 재검토해야 합니다.
    reason: 불확실한 문구를 매끄럽게 고쳐 원문의 난점을 숨기지 않기 위해서입니다.
  - marker: c
    text: “세 글자”는 뒤에 나오는 그리스 문자 Ι, Η, Τ를 가리킵니다. 고대 그리스 문자에는 숫자값도 있었습니다.
    reason: 이어지는 문자-수 해석에 필요한 문화적 배경을 제공합니다.
  - marker: d
    text: 이 문장은 창세기 17:23, 27의 할례 이야기와 창세기 14:14의 ‘삼백십팔 명’을 결합하여 읽는 전승을 반영합니다.
    reason: 정경 본문과 인용된 형태 사이의 차이를 설명하되 저자의 논증을 본문에서 교정하지 않기 위해서입니다.
  - marker: e
    text: 그리스 숫자 표기에서 Ι는 10, Η는 8, Τ는 300을 나타냅니다. ΙΗ는 ‘예수’를 뜻하는 그리스어 ΙΗΣΟΥΣ의 앞 두 글자이며, Τ의 모양은 십자가를 연상시킵니다.
    reason: 한국어 번역만으로는 드러나지 않는 저자의 게마트리아 및 문자 형태 논증을 설명합니다.
lexical_decisions:
- source_word: περιτομή / circumcision
  choice: 할례
  rationale: 본문의 육체적 의식과 마음·귀의 비유적 할례를 같은 핵심어로 연결해 논증을 보존했습니다.
- source_word: σφραγίς / seal
  choice: 표징
  rationale: 소유·언약의 인증을 뜻하는 문맥을 자연스러운 현대 한국어로 전달하되 특정 성례론 용어로 한정하지 않았습니다.
- source_word: σοφία/σύνεσις 계열로 추정되는 ‘cleverness’
  choice: 잔꾀
  rationale: 악한 천사에게 배운 부정적인 영리함이라는 문맥을 살렸습니다. 직접 그리스어 대조가 보류된 상태이므로 단정적 전문용어는 피했습니다.
- source_word: ordinances of three letters
  choice: 세 글자의 규례
  rationale: 뒤따르는 문자-수 해석을 가리키는 독특한 표현을 평준화하지 않고 보존했습니다.
- source_word: Ἰησοῦς / IHSOYS
  choice: 예수(ΙΗΣΟΥΣ)
  rationale: 한국어 이름과 함께 그리스 문자 형태를 제시하여 이어지는 Ι, Η의 수치 해석이 이해되도록 했습니다.
- source_word: innate gift
  choice: 타고난 선물
  rationale: 제공된 증언의 의미를 직역에 가깝게 보존했습니다. 원문 검토 전에는 ‘심어 주신 지식’ 등으로 해석을 좁히지 않았습니다.
theological_decisions:
- issue: ‘그분/주님’이 가리키는 대상
  choice: 증언 본문의 지시 관계를 따라 ‘그분’과 ‘주님’을 유지
  alternative: 모든 대명사를 하나님 또는 그리스도로 명시
  rationale: 본문 자체의 유동적인 인용 공식과 신학적 긴장을 임의로 해소하지 않았습니다.
- issue: 육체의 할례에 관한 저자의 주장
  choice: ‘폐지되었습니다’로 저자의 논지를 직접 전달
  alternative: ‘효력이 없어졌습니다’ 또는 완곡한 역사적 설명
  rationale: 제공된 증언의 강한 표현을 보존하되 번역자가 그 주장에 추가적인 교파적 해설을 붙이지 않았습니다.
- issue: 아브라함의 문자-수 예표 해석
  choice: 저자의 예표론적 논증을 그대로 제시하고 주석으로 계산법을 설명
  alternative: 현대 독자를 위해 상징적 해석으로 의역
  rationale: 고대 저자의 신학적 논증을 교정하거나 합리화하지 않고 역사적 형태 그대로 보존했습니다.
- issue: ‘성령 안에서’의 의미
  choice: 성령 안에서
  alternative: 영으로
  rationale: Jesus를 미리 내다본 예언적 통찰이라는 문맥을 반영하되, 대문자화 여부는 직접 원문 검토가 필요한 해석임을 인지하고 전통적으로 자연스러운 표현을 택했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 인용문은 장중하되 이해하기 쉬운 문장으로 다듬었고, 논증 부분은 반복 구조와 수사적 질문을 보존했습니다. 제공 자료가 공용 영어 증언에 근거하며 직접 그리스어·라틴어 검토가 보류되어 있으므로, 난해한 전치사구와 ‘타고난 선물’ 같은 표현은 성급히 평준화하지 않고 주석 또는 보수적 번역으로 처리했습니다.
