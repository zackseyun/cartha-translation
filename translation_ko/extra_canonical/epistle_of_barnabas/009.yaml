  revised_text: '## 바나바의 서신 9장


    더 나아가, 귀에 관하여 그분께서는 우리의 마음에 할례를 행하셨다고 말씀하십니다. 주님께서 예언자를 통하여 말씀하십니다. “그들은 귀로 듣고 내게 귀를 기울였다.” 또 말씀하십니다. “멀리 있는 이들이 귀로 듣고 내가 행한 일을 깨달을 것이다.” 또 주님께서 말씀하십니다. “너희 마음에 할례를 받으라.”


    또 말씀하십니다. “이스라엘아, 들으라. 주 너의 하나님께서 이렇게 말씀하신다. 영원히 살기를 바라는 이는 누구냐? 그는 내 종의 음성을 귀로 들으라.”[a] 또 말씀하십니다. “하늘아, 들으라. 땅아, 귀를 기울이라. 주님께서 이 일들을 증언으로 말씀하셨다.” 또 말씀하십니다. “이 백성의 통치자들아, 주님의 말씀을 들으라.” 또 말씀하십니다. “내 자녀들아, 광야에서 외치는 이의 음성을 들으라.” 그러므로 그분께서 우리의 귀를 할례하신 것은 우리가 말씀을 듣고 믿게 하시려는 것이었습니다.


    그러나 그들이 의지하는 할례는 폐지되었습니다. 그분께서 육체의 할례가 아닌 할례를 행해야 한다고 말씀하셨기 때문입니다. 그러나 그들은 범죄했습니다. 악한 천사가 그들에게 교묘함을 가르쳤기 때문입니다.


    그분께서 그들에게 말씀하십니다. “주 너희 하나님께서 이렇게 말씀하신다.” 내가 계명을 이렇게 찾았습니다. “가시덤불 가운데 씨를 뿌리지 말고, 너희 주님께로 할례를 받으라.”[b] 그러면 그분께서 무엇이라고 말씀하십니까? “너희 마음의 완고함에 할례를 받으라. 그러면 너희는 다시는 목을 곧게 하지 않을 것이다.” 이 말씀도 보십시오. “보라, 모든 이방 민족은 포피에 할례를 받지 않았지만, 이 백성은 마음에 할례를 받지 않았다.” 주님께서 말씀하십니다.


    그러나 여러분은 “참으로 그 백성은 표징으로 할례를 받았습니다”라고 말할 것입니다. 아닙니다. 모든 시리아 사람과 아라비아 사람, 그리고 모든 우상 제사장도 마찬가지입니다. 그렇다면 그들 또한 모두 그들의 언약에 속합니까? 더구나 이집트 사람들도 할례받은 이들 가운데 포함됩니다.


    그러므로 사랑의 자녀들이여, 모든 것에 관하여 충분히 배우십시오. 처음으로 할례를 정한 아브라함은 세 글자의 규례를 받고 할례를 행할 때 영으로 예수님을 미리 내다보았습니다.[c]


    성경은 “아브라함이 자기 집안사람 가운데 열여덟 명과 삼백 명에게 할례를 행했다”라고 말합니다.[d] 그렇다면 그에게 주어진 지식은 무엇이었습니까? 먼저 열여덟을 말하고, 그 뒤에 간격을 두고 삼백을 말했다는 것을 깨달으십시오. 열여덟에서 ‘Ι’는 십을, ‘Η’는 팔을 나타냅니다. 여기에서 예수(ΙΗΣΟΥΣ)를 얻습니다. 그리고 ‘Τ’에는 십자가가 은혜를 지니게 되어 있으므로, 삼백도 말합니다. 이처럼 그분께서는 두 글자로 예수님을, 나머지 한 글자로 십자가를 드러내십니다.[e]


    우리 안에 그분의 언약의 타고난 선물을 두신 분께서 아십니다. 아무도 나에게서 이보다 더 참된 말씀을 배운 적이 없습니다. 그러나 나는 여러분이 그 말씀을 받을 만한 이들임을 압니다.'
