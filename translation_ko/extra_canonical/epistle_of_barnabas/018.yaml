base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: ko
  text: '그러나 이제 다른 교훈과 가르침으로 넘어갑시다. 가르침과 권능에는 두 길이 있습니다. 하나는 빛의 길이고 다른 하나는 어둠의 길입니다. 이 두 길 사이에는 큰 차이가 있습니다. 한 길에는 하나님의 빛을 주는 천사들이 배치되어 있고, 다른 길에는 사탄의 천사들이 배치되어 있습니다.


    한 분은 영원부터 영원까지 주님이시지만, 다른 하나는 지금 이 불의한 시대의 지배자입니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공용 영역 영어 번역 증거를 바탕으로 한 잠정 번역입니다. 그리스어와 라틴어 사본에 대한 직접 검토가 아직 필요합니다. 마지막 문장의 ‘지배자’는 영어 증거에서 ‘Lord’로 되어 있으나, 여기서는 영원한 주님과 현 불의의 시대에 한정된 지배자를 구별하여 옮겼습니다.
    reason: 직접 원어 검토가 보류된 상태와 신학적으로 민감한 호칭의 번역 판단을 독자에게 투명하게 알리기 위해서입니다.
lexical_decisions:
- source_word: lesson and teaching
  choice: 교훈과 가르침
  rationale: 현 단계의 영어 증거가 두 표현을 병렬로 보존하므로, 중복처럼 보이더라도 의미 차이를 섣불리 합치지 않았습니다.
- source_word: two ways
  choice: 두 길
  rationale: 초기 그리스도교의 ‘두 길’ 전승을 드러내는 핵심 은유를 그대로 살렸습니다.
- source_word: power
  choice: 권능
  rationale: 단순한 물리적 힘보다 영적·도덕적 영역의 권세를 나타내도록 격조 있는 용어를 택했습니다.
- source_word: light giving angels
  choice: 빛을 주는 천사들
  rationale: 영어 증거의 수식 관계를 직접 보존하면서도 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: Lord of the season of iniquity that now is
  choice: 지금 이 불의한 시대의 지배자
  rationale: 유일한 주님을 가리키는 호칭과 사탄의 한시적 지배를 한국어에서 구별하되, 원문 증거가 나타내는 통치 개념은 유지했습니다.
theological_decisions:
- issue: 두 존재에게 적용된 ‘Lord’의 번역
  choice: 하나님 쪽은 ‘주님’, 다른 쪽은 ‘지배자’로 번역
  alternative: 둘 다 ‘주’ 또는 ‘주인’으로 번역
  rationale: 첫 존재의 영원한 주권과 둘째 존재의 현시대에 한정된 지배가 대조됩니다. 한국어에서 둘 다 ‘주님’이라 하면 동등한 신적 지위를 암시할 위험이 있어 문맥적 차이를 드러냈습니다. 다만 이 선택은 직접 원어 대조 전까지 잠정적입니다.
- issue: ‘the one’이 가리키는 대상
  choice: 첫째는 인격적 존재이므로 ‘한 분’, 둘째는 ‘다른 하나’로 표현
  alternative: 둘 다 ‘하나는/다른 하나는’으로 표현
  rationale: 첫째가 영원한 주님임을 자연스럽게 드러내면서도, 둘째를 동일한 존칭으로 높이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문장은 공적 낭독에 어울리도록 품위 있게 다듬되, ‘두 길’, ‘빛’, ‘어둠’, ‘영원부터 영원까지’라는 전승적 표현은 보존했습니다. 직접 원어 검토가 보류되어 있으므로 확정적 재구성은 피했습니다.
