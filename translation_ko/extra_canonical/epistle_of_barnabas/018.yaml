  source_fidelity: ‘가르침과 권능에는 두 길’은 영어 증거의 병렬 구조를 다소 흐리며, 여기의 power/authority는 기적적 능력을 뜻하는 ‘권능’보다 ‘권세’가 적절합니다. 마지막 대조에서 첫 대상은 ‘주님’이고 둘째는 현 불법의 시대에 한정된 통치자라는 뜻이므로, ‘다른 하나’ 대신 대조 대상을 자연스럽게 밝혀야 합니다.
  naturalness: 현대 합쇼체의 문장 흐름은 대체로 좋습니다. 다만 ‘가르침과 권능에는 두 길이 있습니다’와 ‘다른 하나는’은 한국어로 다소 어색하거나 관계가 불명확합니다.
  terminology: ‘두 길’과 ‘빛/어둠’은 잘 보존되었습니다. ‘권세’는 이 문맥의 teaching and power/authority에 더 적합합니다. 둘째 존재에 ‘지배자’를 쓰는 것은 호칭을 교리적으로 낮춘 것이 아니라, 영어 증거의 Lord와 달리 원어 전승에서 보고되는 통치자 칭호(archon)의 기능적 대조를 반영하는 안전한 표현입니다.
