  terminology: ‘검은 자’는 본문이 명시하지 않은 ‘마귀/사탄’을 보충하지 않아 적절합니다. ‘의의 보상’, ‘하나님을 두려워하지 않음’, ‘하나님께서 지으신 것들’도 의미 범위를 보존합니다. 문제의 항목은 ‘권세를 높임’으로 조정하고, 각주에서 가능한 직역 범위를 설명하는 편이 안전합니다.
