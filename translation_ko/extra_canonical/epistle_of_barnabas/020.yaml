translation:
  language: ko
  text: '그러나 검은 자의 길은 굽었고 저주로 가득합니다. 그 길은 형벌이 따르는 영원한 죽음의 길이며, 그 안에는 사람들의 영혼을 멸망시키는 것들이 있습니다. 곧 우상 숭배, 방자함, 권세를 높임,[a] 위선, 두 마음을 품음, 간음, 살인, 약탈, 교만, 범법, 배신, 악의, 완고함, 주술, 마술, 탐욕, 하나님을 두려워하지 않음입니다.


    그 길에 속한 사람들은 선한 이들을 박해하고, 진리를 미워하며, 거짓을 사랑합니다. 의의 보상을 깨닫지 못하고, 선한 것과 의로운 심판을 굳게 붙들지 않으며, 과부와 고아를 돌보지 않습니다. 하나님을 두려워하는 일에는 깨어 있지 않고 악한 일에만 깨어 있습니다. 온유와 인내는 그들에게서 멀리, 아주 멀리 떠나 있습니다. 그들은 헛된 것을 사랑하고, 보답받을 것을 뒤쫓으며,[b] 가난한 이를 불쌍히 여기지 않고, 고된 수고에 짓눌린 이를 위해 애쓰지 않습니다. 남을 비방하는 데 민첩하고, 자신들을 지으신 분을 알아보지 못합니다. 아이들을 죽이고, 하나님께서 지으신 것들을 타락시키며, 궁핍한 이를 외면하고, 고난받는 이를 억누릅니다. 부자들의 편을 들고, 가난한 이들을 불의하게 재판하며, 모든 일에서 죄를 짓습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역에 가깝게는 ‘힘’ 또는 ‘권세’를 높이는 일, 곧 ‘권세의 고양’입니다. 제공된 영어 증언의 “exhalation of power”는 이례적인 표현입니다.
    reason: 원문의 명사적·추상적 표현을 보존하고, 영어 증언의 표현을 오기라고 단정하지 않습니다.
  - marker: b
    text: ‘보답’은 대가나 보수를 뜻할 수도 있고, 되갚음이나 보복을 뜻할 수도 있습니다.
    reason: 원어가 지닌 의미 범위를 한쪽으로 확정하지 않기 위해 설명합니다.
lexical_decisions:
- source_word: τοῦ μέλανος / “the Black One”
  choice: 검은 자
  rationale: 이 길을 대표하는 악한 존재를 가리키는 고유한 호칭의 성격을 보존하면서도, 본문이 명시하지 않은 ‘마귀’ 같은 해석어를 덧붙이지 않았습니다.
- source_word: ὕψωμα δυνάμεως / “exhalation of power”
  choice: 권세를 뽐냄
  rationale: 영어 증언의 ‘exhalation’은 비정상적 표현이며, 알려진 그리스어 표현은 힘이나 권세를 높이 내세우는 태도를 뜻합니다. 현대 한국어에서 목록의 악덕으로 자연스럽게 이해되도록 옮겼습니다.
- source_word: διπλοκαρδία
  choice: 두 마음을 품음
  rationale: 내적 분열, 이중성, 불성실을 나타내는 심장/마음 비유를 살렸습니다.
- source_word: ἀνταπόδομα διώκοντες / “pursuing a recompense”
  choice: 보답받을 것을 뒤쫓으며
  rationale: 대가나 되갚음을 추구한다는 뜻의 폭을 유지하고, 그것이 보수인지 보복인지 한쪽으로 단정하지 않았습니다.
- source_word: οὐ γινώσκοντες τὸν ποιήσαντα αὐτούς
  choice: 자신들을 지으신 분을 알아보지 못합니다
  rationale: 창조주를 가리키는 관계절의 의미를 직접 보존하되, 한국어에서 자연스러운 높임을 적용했습니다.
- source_word: φθορεῖς πλάσματος θεοῦ / “corrupters of the creatures of God”
  choice: 하나님께서 지으신 것들을 타락시키며
  rationale: ‘πλάσμα’의 피조물/지어진 것이라는 의미를 살리고, 대상 범위를 특정 부류로 좁히지 않았습니다.
theological_decisions:
- issue: ‘검은 자’의 정체
  choice: 검은 자
  alternative: 마귀 또는 사탄
  rationale: 문맥상 악한 존재를 암시하지만 본문 자체의 색채 호칭을 보존하여 정체를 교리적으로 명시하지 않았습니다.
- issue: ‘영원한 죽음’과 형벌의 관계
  choice: 형벌이 따르는 영원한 죽음의 길
  alternative: 영원한 형벌의 죽음의 길
  rationale: 죽음과 형벌을 함께 말하는 원문의 긴장을 유지하고, 형벌이 곧 죽음과 동일하다고 단정하지 않았습니다.
- issue: ‘의의 보상’의 의미
  choice: 의의 보상
  alternative: 의로운 이들이 받을 상 또는 의로운 행위의 삯
  rationale: 보상이 의 자체에 속하는지, 의로운 사람이나 행위에 주어지는지 원문이 허용하는 여지를 좁히지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 긴 악덕 목록은 문장과 문단을 나누어 읽기 쉽게 하되, 원문의 누적적이고 엄중한 수사 효과를 유지했습니다. 제공 자료가 직접적인 원문 대조를 ‘검토 대기’로 표시하므로, 알려진 그리스어 본문과 병행 전승을 참고하되 불확실한 지점은 각주로 드러냈습니다.
