base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: ko
  text: '그러므로 위에 기록된 주님의 규례를 모두 배우고, 그 규례를 따라 살아가는 것이 좋습니다. 이런 일들을 행하는 사람은 하나님의 나라에서 영광을 받을 것이지만, 그 반대되는 것들을 택하는 사람은 자기 행위와 함께 멸망할 것입니다. 이 때문에 부활이 있고, 이 때문에 보상이 있습니다.


    여러분 가운데 높은 자리에 있는 이들에게 권합니다. 여러분이 나의 선한 충고를 받아들이려 한다면, 여러분이 선을 베풀 수 있는 이들을 여러분 가운데 지켜 주십시오.[a] 소홀히 하지 마십시오.


    악한 자와 함께 모든 것이 멸망할 날이 가까이 왔습니다. 주님께서 가까이 계시며, 그분의 보상도 가까이 있습니다.


    나는 거듭거듭 여러분에게 권합니다. 서로에게 선한 법을 세워 주는 사람이 되고, 자기 자신에게 신실한 조언자로 남으며, 여러분 가운데서 모든 위선을 없애십시오.


    온 세상의 주님이신 하나님께서 여러분에게 지혜와 판단력과 배움과 그분의 규례에 관한 지식과 인내를 주시기를 바랍니다.


    하나님께 가르침을 받으십시오. 주님께서 여러분에게 무엇을 요구하시는지 부지런히 찾고, 심판의 날에 합당한 사람으로 드러나도록 행하십시오.


    여러분이 선한 것을 조금이라도 기억한다면, 이런 일들, 이런 일들을 실천할 때 나를 기억해 주십시오.[b] 그리하여 나의 열망과 깨어 살핌이 조금이나마 좋은 결실을 맺게 해 주십시오. 나는 이것을 호의로 베풀어 달라고 여러분에게 간청합니다.


    이 좋은 그릇, 곧 몸이 여러분과 함께 있는 동안에는[c] 이 가운데 어느 것 하나도 부족함이 없게 하십시오. 오히려 그것들을 끊임없이 살피고 모든 계명을 이루십시오. 그 계명들은 그럴 만한 가치가 있기 때문입니다.[d]


    이 때문에 나는 할 수 있는 데까지 더욱 힘써 여러분에게 편지를 썼습니다. 여러분에게 기쁨을 주기 위해서입니다. 사랑과 평화의 자녀들이여, 평안히 지내십시오. 영광과 모든 은혜의 주님께서 여러분의 영과 함께하시기를 바랍니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높은 자리’와 ‘지켜 주십시오’의 정확한 뜻은 전승과 문맥에 따라 달리 이해될 수 있습니다. 후자는 ‘여러분이 선을 행할 수 있는 사람들을 가까이 두십시오’라는 뜻일 수 있습니다.
    reason: 직접적인 그리스어·라틴어 대조가 아직 완료되지 않았고, 제공된 영어 증언 자체가 해석의 여지를 남깁니다.
  - marker: b
    text: ‘이런 일들’이 두 번 이어지는 것은 제공된 증언의 반복을 그대로 반영한 것입니다. 필사나 전승 과정에서 생긴 중복일 가능성도 있습니다.
    reason: 증언에 있는 이례적인 반복을 삭제하지 않고 독자에게 본문 상태를 알립니다.
  - marker: c
    text: ‘곧 몸’은 ‘좋은 그릇’이 몸을 가리킨다는 전승상의 해석입니다.
    reason: 제공된 증언의 괄호 표현을 본문에 보존하되 그것이 설명적 요소임을 밝힙니다.
  - marker: d
    text: ‘그 계명들은 그럴 만한 가치가 있다’는 문장은 ‘계명들은 마땅히 이행할 가치가 있다’ 또는 ‘그렇게 하는 것이 합당하다’는 뜻으로도 이해할 수 있습니다.
    reason: 대명사의 선행사와 평가 표현이 다소 불분명하므로 가능한 의미를 단정하지 않습니다.
lexical_decisions:
- source_word: ordinances
  choice: 규례
  rationale: 주님의 명령과 정해진 가르침을 함께 나타내면서도 현대 한국어 독자가 이해할 수 있는 존엄한 표현입니다.
- source_word: walk in them
  choice: 그 규례를 따라 살아가다
  rationale: 문자적인 ‘그 안에서 걷다’보다 삶의 지속적인 실천이라는 관용적 뜻을 자연스럽게 전달합니다.
- source_word: recompense / reward
  choice: 보상
  rationale: 문맥상 종말론적 갚음을 가리키되 그것이 상인지 형벌인지 본문보다 더 좁게 확정하지 않습니다.
- source_word: Evil One
  choice: 악한 자
  rationale: 인격적 존재를 가리키는 표현을 보존하되 특정한 교리적 명칭을 덧붙이지 않습니다.
- source_word: good vessel
  choice: 좋은 그릇
  rationale: 본문의 신체 은유를 그대로 살리고, 몸이라는 해석은 설명 형태로 보존했습니다.
theological_decisions:
- issue: 행위와 하나님 나라의 영광 사이의 관계
  choice: ‘행하는 사람은 … 영광을 받을 것’으로 직접적인 조건문을 보존했습니다.
  alternative: 행위를 단지 이미 받은 구원의 증거로 풀어 번역할 수 있습니다.
  rationale: 본문의 권면과 보응의 긴장을 특정 교파의 구원론으로 해소하지 않기 위해 원문의 논리 형식을 유지했습니다.
- issue: 부활과 보상의 의미
  choice: ‘이 때문에 부활이 있고, 이 때문에 보상이 있습니다’로 병행 구조를 보존했습니다.
  alternative: 부활을 보상을 시행하기 위한 수단으로 명시할 수 있습니다.
  rationale: 본문이 두 절의 정확한 인과관계를 충분히 설명하지 않으므로 그 모호성을 남겼습니다.
- issue: 심판의 날에 ‘발견되다’의 평가적 의미
  choice: ‘합당한 사람으로 드러나도록’으로 옮겼습니다.
  alternative: ‘구원받은 사람으로 인정받도록’이라고 번역할 수 있습니다.
  rationale: 구원 여부를 명시하지 않으면서 심판 때의 긍정적 판정을 자연스럽게 전달합니다.
translation_notes:
  register: 현대 표준 한국어의 합쇼체를 사용했습니다. 권면문은 단호하지만 목회적인 어조로 옮겼고, 고어와 과도한 한자어는 피하면서 ‘규례’, ‘심판’, ‘영광’처럼 문헌의 종교적 품위를 이루는 핵심 어휘는 유지했습니다. 직접적인 고대어 본문 검토가 보류된 상태이므로, 제공된 공용 영어 증언에 의존한 잠정 번역이며 불확실한 곳은 각주로 표시했습니다.
