  yaml_path: translation/extra_canonical/epistle_of_barnabas/012.yaml
  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: ko
  text: '12


    이와 같이 그분은 또 다른 예언자를 통하여 십자가에 관해 밝히십니다. 그 예언자는 이렇게 말합니다. “이 일들이 언제 이루어지겠습니까?” 주께서 말씀하십니다. “나무가 굽혀졌다가 똑바로 서고, 나무에서 피가 떨어질 때이다.” 여기서도 여러분은 십자가와 십자가에 못 박히실 분에 관해 배웁니다.


    또 그분은 모세를 통하여 말씀하십니다. 다른 민족 사람들이 이스라엘과 전쟁을 벌였을 때의 일입니다. 그분은 이스라엘이 자기들의 죄 때문에 죽음에 넘겨졌으므로 전쟁을 당한다는 것을 그들에게 일깨워 주고자 하셨습니다. 성령께서는 모세의 마음에 말씀하셔서, 십자가와 고난받으실 분의 모형을 만들게 하셨습니다. 그분에게 소망을 두지 않으면 그들이 영원히 전쟁을 당할 것이라고 말씀하신 것입니다. 그래서 모세는 전투가 한창일 때 무기들을 하나씩 포개어 쌓고,[a] 누구보다 높은 곳에 서서 두 손을 펼쳤습니다. 그러자 이스라엘이 다시 이겼습니다. 그러나 그가 손을 내릴 때마다 그들은 칼에 쓰러졌습니다.


    왜 이런 일이 일어났겠습니까? 그분에게 소망을 두지 않으면 구원받을 수 없다는 것을 그들이 배우게 하려는 것이었습니다.


    또 그분은 다른 예언자를 통하여 말씀하십니다. “나는 온종일 내 두 손을 펼쳐, 내 의로운 길을 거슬러 말하는 순종하지 않는 백성을 불렀다.”


    또 모세는 예수님의 모형을 보여 줍니다. 곧 그분이 고난받으셔야 한다는 것과, 사람들이 없애 버렸다고 여길 바로 그분이 죽어 가던 이스라엘을 표징을 통하여 살리실 것이라는 모형입니다. 주께서는 온갖 뱀들이 그들을 물게 하셨고, 그들은 죽었습니다. 이는 하와의 범죄가 뱀을 통하여 일어났기 때문이며, 그들이 자기들의 범죄 때문에 죽음의 고통에 넘겨진다는 것을 깨닫게 하시려는 것이었습니다.


    더 나아가 모세는 “너희는 너희의 하나님을 나타내는 부어 만든 형상이나 새긴 형상을 두어서는 안 된다”라고 명령했지만, 예수님의 모형을 그들에게 보여 주려고 자신이 직접 형상을 하나 만들었습니다. 모세는 청동 뱀을 만들어 눈에 잘 띄게 세우고 백성을 불러 모았습니다.


    백성이 모이자, 그들은 병이 낫도록 자신들을 위해 중보해 달라고 모세에게 간청했습니다. 모세가 그들에게 말했습니다. “너희 가운데 누구든지 뱀에게 물리면, 나무 위에 놓인 뱀에게로 오십시오. 그리고 그 뱀 자체는 죽어 있지만 사람을 살릴 수 있다고 믿고 소망하십시오. 그러면 곧 구원받을 것입니다.” 그들은 그대로 했습니다. 이 일들에서도 여러분은 예수님의 영광을 다시 봅니다. 만물이 그분 안에 있고 그분을 향해 있습니다.


    그러면 모세가 눈의 아들 예수, 곧 여호수아에게 이 이름을 붙여 주었을 때 그에게 무엇이라고 말합니까?[b] 모세는 예언자로서 그 이름을 주었습니다. 아버지께서 자신의 아들 예수님에 관한 모든 것을 밝혀 주시므로, 온 백성이 오직 그에게 귀를 기울이게 하려는 것이었습니다.


    그러므로 모세는 눈의 아들을 그 땅에 정탐꾼으로 보내면서 그에게 예수라는 이름을 주고 이렇게 말합니다. “책을 손에 들고 주께서 하시는 말씀을 기록하십시오. 마지막 날들에 하나님의 아들이 아말렉의 온 집안을 뿌리째 잘라 버리실 것입니다.”


    보십시오. 여기서 다시 가리키는 이는 예수님입니다. 사람의 한 아들이 아니라 하나님의 아들이십니다. 그분은 모형 가운데 육신으로 나타나셨습니다. 사람들이 그리스도는 다윗의 아들이라고 말할 것이므로, 다윗 자신은 죄인들의 잘못을 알고 두려워하며 이렇게 예언합니다. “주께서 나의 주께 말씀하셨다. ‘내가 네 원수들을 네 발 아래 발판으로 둘 때까지 내 오른쪽에 앉아 있어라.’”


    또 이사야도 이렇게 말합니다. “주께서 나의 그리스도이신 주께 말씀하셨다. 내가 그의 오른손을 붙잡은 것은 민족들이 그의 앞에서 귀를 기울이게 하려는 것이며, 나는 왕들의 세력을 무너뜨릴 것이다.”[c] 다윗이 그분을 아들이라 부르지 않고 주라고 부르는 것을 보십시오.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘무기들을 하나씩 포개어 쌓고’라는 문구는 전승상 난해합니다. 직접적인 그리스어·라틴어 대조가 아직 이루어지지 않았으므로 제공된 영어 증언의 표현을 보존했습니다.
    reason: 본문의 의미가 불확실하며 모세가 앉을 받침을 마련한 장면을 가리킬 가능성도 있으나 단정할 수 없습니다.
  - marker: b
    text: 그리스어 이름 ‘이에수스’는 ‘예수’와 ‘여호수아’를 모두 나타냅니다. 저자는 이 이름의 동일성을 근거로 여호수아를 예수님의 모형으로 해석합니다.
    reason: 한국어에서는 두 이름이 다르게 보이므로 저자의 논증을 이해하는 데 필요한 언어 정보를 제공합니다.
  - marker: c
    text: 이사야 인용문은 알려진 이사야 45:1의 형태와 다소 다릅니다. 여기서는 바나바서에 전해진 특이한 문구를 고치거나 표준 성경 문구에 맞추지 않았습니다.
    reason: 본문 전승의 독특함과 해석상의 긴장을 보존하기 위해서입니다.
lexical_decisions:
- source_word: τύπος / type (witness)
  choice: 모형
  rationale: 십자가, 고난받을 분, 예수님을 미리 보여 주는 인물·행위를 뜻하는 초기 그리스도교의 예표적 용법을 유지했습니다.
- source_word: ξύλον / tree, wood (quotation tradition)
  choice: 나무
  rationale: 십자가로 해석될 수 있으면서도 인용문의 ‘나무’라는 표면 의미를 보존하여 저자의 논증을 독자가 따라가게 했습니다.
- source_word: Ἰησοῦς
  choice: 예수 / 여호수아
  rationale: 그리스어에서는 예수와 여호수아가 같은 이름이라는 논증이 핵심이므로 본문에 두 형태를 함께 제시하고 각주로 설명했습니다.
- source_word: all things are in him and unto him
  choice: 만물이 그분 안에 있고 그분을 향해 있습니다
  rationale: ‘안에’와 ‘향해’라는 방향성을 보존하고, 이를 창조·구원 등 특정 교리로 좁혀 해석하지 않았습니다.
- source_word: molten or carved image
  choice: 부어 만든 형상이나 새긴 형상
  rationale: 금속 주조물과 조각상을 구분하는 원문의 병렬 표현을 자연스러운 현대 한국어로 살렸습니다.
theological_decisions:
- issue: 모세의 펼친 손과 청동 뱀에 대한 기독론적 해석
  choice: 저자가 제시하는 ‘십자가와 예수님의 모형’이라는 주장을 그대로 번역함
  alternative: 구약 본문의 역사적 의미만 드러내도록 완화함
  rationale: 이 해석은 본 장의 논증 자체이므로 현대 독자를 위해 삭제하거나 조화시키지 않았습니다.
- issue: ‘예수/여호수아’ 이름 논증
  choice: 동일한 그리스어 이름에 근거한 저자의 논증을 본문과 각주에서 명시함
  alternative: 모두 ‘여호수아’로 번역하여 언어유희를 감춤
  rationale: 이름의 동일성이 저자의 기독론적 논증에 필수적입니다.
- issue: 그리스도와 다윗의 관계
  choice: ‘다윗의 아들’이라는 진술과 ‘주’라는 호칭 사이의 긴장을 해소하지 않음
  alternative: 후대의 양성론적 설명을 덧붙여 조화함
  rationale: 저자가 제기하는 논쟁적 대비를 그대로 보존하고 특정 교파의 해석을 도입하지 않았습니다.
- issue: ‘사람의 아들’ 표현
  choice: 부정관사를 살려 ‘사람의 한 아들’로 번역함
  alternative: 칭호처럼 ‘인자’로 번역함
  rationale: 제공된 증거는 일반적 인간 혈통과 하나님의 아들을 대조하는 표현으로 보이며, 정형화된 ‘인자’ 칭호로 단정하지 않았습니다.
- issue: 비정형적인 성경 인용문
  choice: 제공된 고대 저술의 인용 형태를 보존함
  alternative: 현대 구약 번역의 정형 문구로 교정함
  rationale: 바나바서가 사용하는 인용문의 독특한 형태와 신학적 논증을 조화 없이 유지했습니다.
