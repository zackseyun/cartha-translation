  revised_text: '12


    이와 같이 그분은 또 다른 예언자를 통하여 십자가에 관해 밝히십니다. 그 예언자는 이렇게 말합니다. “이 일들이 언제 이루어지겠습니까?” 주께서 말씀하십니다. “나무가 굽어졌다가 곧게 서고, 나무에서 피가 떨어질 때이다.” 여기서도 여러분은 십자가와 십자가에 못 박히실 분에 관해 배웁니다.


    또 그분은 모세를 통하여 말씀하십니다. 다른 민족 사람들이 이스라엘과 전쟁을 벌였을 때의 일입니다. 그분은 이스라엘이 자기들의 죄 때문에 죽음에 넘겨졌으므로 전쟁을 당한다는 것을 그들에게 일깨워 주고자 하셨습니다. 성령께서는 모세의 마음에 말씀하셔서, 십자가와 고난받으실 분의 모형을 만들게 하셨습니다. 그분에게 소망을 두지 않으면 그들이 영원히 전쟁을 당할 것이라고 말씀하신 것입니다. 그래서 모세는 전투가 한창일 때 무기들을 서로 포개어 쌓고,[a] 누구보다 높은 곳에 서서 두 손을 펼쳤습니다. 그러자 이스라엘이 다시 이겼습니다. 그러나 그가 손을 내릴 때마다 그들은 칼에 쓰러졌습니다.


    왜 이런 일이 일어났겠습니까? 그분에게 소망을 두지 않으면 구원받을 수 없다는 것을 그들이 배우게 하려는 것이었습니다.


    또 그분은 다른 예언자를 통하여 말씀하십니다. “나는 온종일 내 두 손을 펼쳐, 내 의로운 길을 거슬러 말하는 순종하지 않는 백성에게 보였다.”


    또 모세는 예수님의 모형을 만듭니다. 곧 그분이 고난받으셔야 한다는 것과, 사람들이 없애 버렸다고 여길 바로 그분이 이스라엘이 쓰러져 가고 있을 때 표징 안에서 살리실 것이라는 모형입니다. 주께서는 온갖 뱀들이 그들을 물게 하셨고, 그들은 죽었습니다. 이는 하와 안에서 범죄가 뱀을 통하여 일어났기 때문이며, 그들이 자기들의 범죄 때문에 죽음의 고통에 넘겨진다는 것을 깨닫게 하시려는 것이었습니다.


    더 나아가 모세는 “너희는 너희 하나님으로 부어 만든 형상이나 새긴 형상을 두어서는 안 된다”라고 명령했지만, 예수님의 모형을 그들에게 보여 주려고 자신이 직접 형상을 하나 만들었습니다. 모세는 청동 뱀을 만들어 눈에 잘 띄게 세우고 백성을 불러 모았습니다.


    백성이 모이자, 그들은 병이 낫도록 자신들을 위해 중보해 달라고 모세에게 간청했습니다. 모세가 그들에게 말했습니다. “너희 가운데 누구든지 뱀에게 물리면, 나무 위에 놓인 뱀에게로 오십시오. 그리고 그 뱀 자체는 죽어 있지만 사람을 살릴 수 있다고 믿고 소망하십시오. 그러면 곧 구원받을 것입니다.” 그들은 그대로 했습니다. 이 일들에서도 여러분은 예수님의 영광을 다시 봅니다. 만물이 그분 안에 있고 그분을 향해 있습니다.


    그러면 모세가 눈의 아들 예수, 곧 여호수아에게 이 이름을 붙여 주었을 때 그에게 무엇이라고 말합니까?[b] 모세는 예언자로서 그 이름을 주었습니다. 아버지께서 자신의 아들 예수님에 관한 모든 것을 밝혀 주시므로, 온 백성이 오직 그에게 귀를 기울이게 하려는 것이었습니다.


    그러므로 모세는 눈의 아들을 그 땅을 정탐하러 보내면서 그에게 예수라는 이름을 주고 이렇게 말합니다. “책을 손에 들고 주께서 하시는 말씀을 기록하십시오. 마지막 날들에 하나님의 아들이 아말렉의 온 집안을 뿌리째 잘라 버리실 것입니다.”


    보십시오. 여기서 다시 가리키는 이는 예수님입니다. 사람의 한 아들이 아니라 하나님의 아들이십니다. 그분은 모형 가운데 육신으로 나타나셨습니다. 사람들이 그리스도는 다윗의 아들이라고 말할 것이므로, 다윗 자신은 죄인들의 잘못을 알고 두려워하며 이렇게 예언합니다. “주께서 나의 주께 말씀하셨다. ‘내가 네 원수들을 네 발 아래 발판으로 삼을 때까지 내 오른쪽에 앉아 있어라.’”


    또 이사야도 이렇게 말합니다. “주께서 나의 그리스도이신 주께 말씀하셨다. 내가 그의 오른손을 붙잡은 것은 민족들이 그의 앞에서 귀를 기울이게 하려는 것이며, 나는 왕들의 세력을 무너뜨릴 것이다.”[c] 다윗이 그분을 아들이라 부르지 않고 주라고 부르는 것을 보십시오.'
