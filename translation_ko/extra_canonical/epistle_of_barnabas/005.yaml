  revised_text: '바나바의 편지 5장


    1 주님께서 자신의 육신을 썩어 없어지도록 내어 주는 일을 견디신 것은 바로 이 때문입니다. 곧 우리가 죄를 용서받아 깨끗하게 되게 하시려는 것이며, 이 깨끗하게 됨은 그분의 피 뿌림[a]을 통하여 이루어집니다.


    2 그분에 관한 성경 말씀에는 이스라엘과 관련된 것도 있고 우리와 관련된 것도 있습니다. 성경은 이렇게 말합니다. “그분은 여러분의 범법 때문에 상처를 입으셨고, 우리의 죄 때문에 짓이겨지셨습니다. 그분이 매를 맞으심으로 우리가 나음을 얻었습니다. 그분은 양처럼 도살장으로 끌려가셨고, 털 깎는 사람 앞에서 잠잠한 어린양처럼 입을 열지 않으셨습니다.”


    3 그러므로 우리는 주님께 크게 감사드려야 합니다. 그분께서 우리에게 지나간 일을 밝혀 주셨고, 현재의 일을 지혜롭게 깨닫게 하셨으며, 미래에 관해서도 우리를 깨달음 없이 내버려 두지 않으셨기 때문입니다.


    4 성경은 또 “새들을 향해 그물을 치는 일이 부당한 것은 아닙니다”[b]라고 말합니다. 이는 의의 길을 알면서도 억지로 자신을 어둠의 길로 몰아넣는 사람은 마땅히 멸망한다는 뜻입니다.


    5 형제 여러분, 이 점도 생각해 보십시오. 온 세상의 주님, 곧 세상의 기초가 놓일 때 하나님께서 “우리의 형상과 모양을 따라 사람을 만들자”라고 말씀하신 그분께서 우리 영혼을 위하여 고난을 견디셨다면, 어떻게 사람들의 손에 고난받는 것을 견디셨겠습니까?


    6 깨달으십시오. 예언자들은 그분에게서 은혜를 받아 그분에 관하여 예언했습니다. 그러나 그분 자신은 죽음을 없애고 죽은 자들의 부활을 드러내시려고 고난을 견디셨습니다. 그분은 육신으로 나타나셔야 했기 때문입니다.


    7 또한 그분은 조상들에게 주신 약속을 이루시고[c], 새 백성을 자신을 위하여 준비하심으로써, 땅에 계시는 동안 자신이 부활을 일으킨 뒤에 친히 심판하실 것임을 보여 주시려 하셨습니다.


    8 더 나아가 그분은 이스라엘에게 선포하시고 가르치시며 그토록 많은 놀라운 일과 기적을 행하셨고, 이스라엘을 지극히 사랑하셨습니다.


    9 그분은 자신의 복음을 선포할 사도들을 택하셨습니다. 그들은 모든 죄를 뛰어넘을 만큼 죄인이었던 사람들이었습니다.[d] 그분은 의인을 부르러 오신 것이 아니라 죄인을 부르러 오셨음을 보여 주시려고 그런 이들을 택하셨으며, 그때 자신이 하나님의 아들이심을 나타내셨습니다.


    10 그분이 육신으로 오지 않으셨다면, 사람들은 그분을 바라보고 구원받을 수 없었을 것입니다. 사람들은 언젠가 사라질 태양, 곧 그분의 손으로 지으신 것조차 그 광선을 똑바로 바라볼 수 없기 때문입니다.


    11 그러므로 하나님의 아들이 육신으로 오신 것은 그분의 예언자들을 박해하고 죽인 자들의 죄를 온전히 채우시려는[e] 것이었습니다.


    12 바로 이 때문에 그분은 고난을 견디셨습니다. 하나님께서는 그분의 육신에 난 상처가 그들에게서 비롯되었다고 이렇게 말씀하십니다. “그들이 자기들의 목자를 치면, 그때 양 떼의 양들이 멸망할 것이다.”[f]


    13 그러나 그분 자신이 이와 같이 고난받기를 원하셨습니다. 그분은 나무 위에서 고난받으셔야 했기 때문입니다. 그분에 관하여 예언한 이는 이렇게 말했습니다. “칼에서 내 영혼을 건져 주십시오.” 또 “악을 행하는 무리가 나를 대적하여 일어났으니, 내 육신을 못으로 꿰뚫으십시오.”라고 했습니다.


    14 또다시 그분은 이렇게 말씀하십니다. “보아라, 나는 매질하는 자들에게 내 등을 내주었고, 때리는 자들에게 내 뺨을 내주었다. 나는 내 얼굴을 단단한 바위처럼 굳게 하였다.”'
