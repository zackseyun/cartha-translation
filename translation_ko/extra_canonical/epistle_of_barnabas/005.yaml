  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
translation:
  language: ko
  text: '바나바의 편지 5장


    1 주님께서 자신의 육신이 썩어 없어지도록 내어 주는 일을 견디신 것은 바로 이 때문입니다. 곧 우리가 죄를 용서받아 깨끗해지게 하시려는 것이며, 이 깨끗하게 됨은 그분의 피 뿌림[a]을 통하여 이루어집니다.


    2 그분에 관한 성경 말씀에는 이스라엘과 관련된 것도 있고 우리와 관련된 것도 있습니다. 성경은 이렇게 말합니다. “그분은 여러분의 범법 때문에 상처를 입으셨고, 우리의 죄 때문에 짓이겨지셨습니다. 그분이 매를 맞으심으로 우리가 나음을 얻었습니다. 그분은 양처럼 도살장으로 끌려가셨고, 털 깎는 사람 앞에서 잠잠한 어린양처럼 입을 열지 않으셨습니다.”


    3 그러므로 우리는 주님께 크게 감사드려야 합니다. 그분은 우리에게 지나간 일을 밝혀 주셨고, 현재의 일을 지혜롭게 깨닫게 하셨으며, 미래의 일에 대해서도 깨달음이 없지 않게 하셨기 때문입니다.


    4 성경은 또 “새들이 보는 데서 그물을 치는 것은 까닭 없는 일이 아니다”[b]라고 말합니다. 이는 의의 길을 알면서도 억지로 자신을 어둠의 길로 몰아넣는 사람은 마땅히 멸망한다는 뜻입니다.


    5 형제 여러분, 이 점도 생각해 보십시오. 온 세상의 주님, 곧 세상의 기초가 놓일 때 하나님께서 “우리의 형상과 모양을 따라 사람을 만들자”라고 말씀하신 그분께서 우리 영혼을 위하여 고난을 견디셨다면, 어떻게 사람들의 손에 고난받는 것을 견디셨겠습니까?


    6 깨달으십시오. 예언자들은 그분에게서 은혜를 받아 그분에 관하여 예언했습니다. 그러나 그분 자신은 죽음을 없애고 죽은 자들의 부활을 드러내시려고 고난을 견디셨습니다. 그분은 육신으로 나타나셔야 했기 때문입니다.


    7 또한 그분은 조상들에게 주신 약속을 이루시고[c], 자신을 위하여 새 백성을 준비하셨습니다. 그리하여 땅에 계시는 동안, 자신이 부활을 일으킨 뒤에 친히 심판하실 것임을 보여 주셨습니다.


    8 더 나아가 그분은 이스라엘에게 가르침을 전하시고 그토록 많은 놀라운 일과 기적을 행하셨으며, 이스라엘을 지극히 사랑하셨습니다.


    9 그분은 자신의 복음을 선포할 사도들을 택하셨습니다. 그들은 온갖 죄를 넘어설 만큼 죄 많은 사람들이었습니다.[d] 그분은 의인을 부르러 오신 것이 아니라 죄인을 부르러 오셨음을 보여 주시려고 그런 이들을 택하셨으며, 그때 자신이 하나님의 아들이심을 나타내셨습니다.


    10 그분이 육신으로 오지 않으셨다면, 사람들은 그분을 바라보고 구원받을 수 없었을 것입니다. 사람들은 언젠가 사라질 태양, 곧 그분의 손으로 지으신 것조차 그 광선을 똑바로 바라볼 수 없기 때문입니다.


    11 그러므로 하나님의 아들이 육신으로 오신 것은 그분의 예언자들을 박해하고 죽인 자들의 죄를 온전히 채우시려는[e] 것이었습니다.


    12 바로 이 때문에 그분은 고난을 견디셨습니다. 하나님께서는 그분의 육신에 난 상처가 그들에게서 비롯되었다고 이렇게 말씀하십니다. “그들이 자기들의 목자를 치면, 그때 양 떼의 양들이 흩어질 것이다.”[f]


    13 그러나 그분 자신이 이와 같이 고난받기를 원하셨습니다. 그분은 나무에 달려 고난받으셔야 했기 때문입니다. 그분에 관하여 예언한 이는 이렇게 말했습니다. “칼에서 내 영혼을 건져 주십시오.” 또 “악을 행하는 무리가 나를 대적하여 일어났으니, 내 육신을 못으로 꿰뚫으십시오.”라고 했습니다.


    14 또다시 그분은 이렇게 말씀하십니다. “보아라, 나는 매질하는 자들에게 내 등을 내주었고, 때리는 자들에게 내 뺨을 내주었다. 나는 내 얼굴을 단단한 바위처럼 굳게 하였다.”


    [a] 직역하면 “그분의 뿌림의 피”입니다. 제의적인 피 뿌림을 연상시키는 표현을 살려 옮겼습니다.

    [b] 이 인용문은 통상적인 잠언 1:17의 뜻과 다르게 적용되어 있습니다. 저자는 그물을 보고도 어둠의 길로 들어가는 사람의 책임을 강조합니다.

    [c] “약속을 되찾으시고” 또는 “약속에 보답하시고”로도 이해할 수 있는 표현입니다. 여기서는 조상들에게 주신 약속을 성취한다는 문맥에 따라 옮겼습니다.

    [d] 사도들이 매우 큰 죄인들이었다는 원문의 강한 표현을 완화하지 않고 살렸습니다.

    [e] “그들의 죄를 모두 결산하시려는”으로도 옮길 수 있습니다. 문맥상 예언자들을 박해하고 죽인 자들의 죄가 절정에 이른다는 뜻으로 이해했습니다.

    [f] 인용문의 “자기들의 목자”와 “양들이 흩어질 것이다”는 전승된 본문의 특이한 표현을 반영합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 “그분의 뿌림의 피”입니다. 제의적인 피 뿌림을 연상시키는 표현을 살려 옮겼습니다.
    reason: 비문에 가까운 소유격 표현과 제의적 함의를 설명합니다.
  - marker: b
    text: 이 인용문은 통상적인 잠언 1:17의 뜻과 다르게 적용되어 있습니다. 저자는 그물을 보고도 어둠의 길로 들어가는 사람의 책임을 강조합니다.
    reason: 인용 및 해석의 특이성을 독자가 오역으로 여기지 않도록 알립니다.
  - marker: c
    text: “약속을 되찾으시고” 또는 “약속에 보답하시고”로도 이해할 수 있는 표현입니다. 여기서는 조상들에게 주신 약속을 성취한다는 문맥에 따라 옮겼습니다.
    reason: ‘redeem’에 반영된 원문의 의미 가능성을 보존합니다.
  - marker: d
    text: 사도들이 매우 큰 죄인들이었다는 원문의 강한 표현을 완화하지 않고 살렸습니다.
    reason: 충격적인 표현이 의도적임을 밝힙니다.
  - marker: e
    text: “그들의 죄를 모두 결산하시려는”으로도 옮길 수 있습니다. 문맥상 예언자들을 박해하고 죽인 자들의 죄가 절정에 이른다는 뜻으로 이해했습니다.
    reason: 난해한 동사구의 대안적 해석을 보존합니다.
  - marker: f
    text: 인용문의 “자기들의 목자”와 “양들이 흩어질 것이다”는 전승된 본문의 특이한 표현을 반영합니다.
    reason: 통상적인 성경 문구와 다른 형태를 본문비평적으로 알립니다.
lexical_decisions:
- source_word: deliver His flesh unto corruption
  choice: 자신의 육신이 썩어 없어지도록 내어 주다
  rationale: 육신의 실제 죽음과 부패를 가리키는 강한 표현을 보존하면서 현대 한국어로 자연스럽게 옮겼습니다.
- source_word: the blood of His sprinkling
  choice: 그분의 피 뿌림
  rationale: 제의적 배경을 지닌 ‘뿌림’을 보존하고, 한국어에서 지나치게 모호한 소유격 연쇄는 피했습니다.
- source_word: the way of righteousness / the way of darkness
  choice: 의의 길 / 어둠의 길
  rationale: 두 길 전승의 대조적 은유를 동일한 구조로 유지했습니다.
- source_word: redeem the promise
  choice: 약속을 이루다
  rationale: 문맥상 조상들에게 주어진 약속의 성취를 뜻하는 것으로 보되, 다른 가능성은 각주에 남겼습니다.
- source_word: on a tree
  choice: 나무에 달려
  rationale: 후대의 교리적 전문어로 치환하지 않고 ‘나무’라는 성경 인용 전승의 표현을 유지하면서 처형 문맥을 분명히 했습니다.
- source_word: sum up the complete tale of their sins
  choice: 그들의 죄를 온전히 채우다
  rationale: 죄가 누적되어 절정에 이른다는 난해한 표현을 보존했으며 ‘결산하다’ 가능성은 각주에 제시했습니다.
theological_decisions:
- issue: 그리스도의 고난과 피 뿌림이 죄 사함 및 정결과 맺는 관계
  choice: 죄를 용서받아 깨끗해지며, 이 정결이 그분의 피 뿌림을 통하여 이루어진다고 번역
  alternative: 특정한 속죄 이론의 전문 용어로 명시
  rationale: 본문이 말하는 죄 사함, 정결, 피 뿌림의 연결은 보존하되 그 작동 방식을 특정 교파의 체계로 규정하지 않았습니다.
- issue: 창조 때 하나님의 말씀을 들은 ‘그분’의 정체
  choice: 문맥의 지시 대상을 주님에게 그대로 연결
  alternative: 삼위일체 교리를 해설적으로 삽입
  rationale: 저자가 주님을 창조 전후의 하나님의 말씀과 연결하는 높은 그리스도론을 보존하되 본문 밖의 공식화는 덧붙이지 않았습니다.
- issue: 부활과 심판의 주체
  choice: 그분 자신이 부활을 일으키고 친히 심판하신다는 문장 구조를 유지
  alternative: 하나님이 부활시키고 아들이 심판한다고 주체를 분리
  rationale: 전승된 문장의 주어 연속성을 보존하고 가능한 신학적 긴장을 해소하지 않았습니다.
- issue: 사도들의 죄성에 관한 극단적 진술
  choice: “온갖 죄를 넘어설 만큼 죄 많은 사람들”로 강도를 유지
  alternative: “평범한 죄인들”로 완화
  rationale: 그리스도가 의인이 아니라 죄인을 부르셨다는 저자의 논증에 핵심인 과장적 표현을 삭제하지 않았습니다.
- issue: 예언자들을 죽인 자들의 죄를 아들이 채운다는 표현
  choice: 행위의 주체와 난해함을 본문에 유지하고 각주로 대안을 제시
  alternative: 박해자들이 스스로 죄를 채웠다고 명시적으로 고쳐 번역
