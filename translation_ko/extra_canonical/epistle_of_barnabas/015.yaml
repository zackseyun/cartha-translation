  revised_text: '## 바나바의 편지 15장


    또 안식일에 관해서도, 하나님께서 시내 산에서 모세와 얼굴을 마주하여 말씀하신 ‘열 말씀’[a] 가운데 이렇게 기록되어 있습니다.


    “너희는 깨끗한 손과 깨끗한 마음으로 주님의 안식일을 거룩하게 하여라.”


    또 다른 곳에서 하나님께서는 이렇게 말씀하십니다.


    “내 자녀들이 안식일을 지키면, 내가 그들에게 자비를 베풀겠다.”


    하나님께서는 창조의 시작에서 안식일에 관하여 말씀하십니다.


    “하나님께서는 엿새 동안 그의 손으로 지으신 것들을 만드셨고, 일곱째 날에 마치셨으며, 그날에 쉬시고 그날을 거룩하게 하셨다.”


    자녀들이여, “그분이 엿새 동안 마치셨다”라는 말이 무슨 뜻인지 주의 깊게 살펴보십시오. 이 말은 주님께서 육천 년 안에 모든 것을 끝내실 것이라는 뜻입니다. 주님께는 하루가 천 년을 뜻하기 때문입니다. 주님께서 친히 이 사실을 증언하시며 이렇게 말씀하십니다.


    “보라, 주님의 하루는 천 년과 같을 것이다.”


    그러므로 자녀들이여, 엿새, 곧 육천 년 안에 모든 것이 끝날 것입니다.


    “그분은 일곱째 날에 쉬셨다”라는 말의 뜻은 이러합니다. 그분의 아들이 오셔서 불법한 자의 시대[b]를 없애고, 경건하지 않은 자들을 심판하며, 해와 달과 별들을 바꾸실 때, 그분은 일곱째 날에 참으로 쉬실 것입니다.


    더 나아가 하나님께서는 이렇게 말씀하십니다.


    “너는 깨끗한 손과 깨끗한 마음으로 그날을 거룩하게 하여라.”


    그러므로 지금 누군가가 마음이 깨끗하다 해도 하나님께서 거룩하게 하신 그날을 거룩하게 할 수 있다면, 우리는 완전히 잘못 알고 있는 셈입니다.


    그러나 우리가 의롭다 하심을 받고 약속을 받은 뒤, 불의가 더는 존재하지 않고 주님께서 모든 것을 새롭게 하셔서 우리 자신이 그렇게 할 수 있게 될 때에야 비로소 참으로 쉬며 그날을 거룩하게 할 것입니다. 그때에는 우리 자신이 먼저 거룩하게 되었으므로 그날을 거룩하게 할 수 있을 것입니다.


    마지막으로 하나님께서는 그들에게 이렇게 말씀하십니다.


    “너희의 초하루와 안식일을 나는 견딜 수 없다.”


    이 말씀의 뜻을 여러분은 알 것입니다. 지금 너희가 지키는 안식일들이 나에게 받아들여지는 것이 아니라, 내가 만든 안식일이라는 뜻입니다.[c] 그 안식일에 내가 모든 것을 쉬게 한 뒤, 여덟째 날의 시작을 이루겠습니다. 그날은 다른 세상의 시작입니다.


    그러므로 우리도 여덟째 날을 기쁨으로 지킵니다. 그날에 예수께서 죽은 사람들 가운데서 살아나셨고, 자신을 나타내신 뒤 하늘로 올라가셨기 때문입니다.'
