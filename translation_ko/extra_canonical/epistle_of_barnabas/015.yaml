base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/015.yaml
  text: 'Moreover, concerning the Sabbath, it is likewise written in the Ten Words, which he spoke to Moses face to face on Mount Sinai: “You shall make holy the Sabbath of the Lord with pure hands and a pure heart.”


    And in another place he says, “If my sons observe the Sabbath, then I will bestow my mercy upon them.”


    He speaks of the Sabbath at the beginning of creation: “And God made the works of his hands in six days, and he finished on the seventh day, rested on it, and made it holy.”


    Pay attention, children, to what this means: “He finished in six days.” He means that in six thousand years the Lord will bring all things to an end, for with him a day signifies a thousand years. He himself testifies to me about this, saying, “Behold, the day of the Lord will be as a thousand years.” Therefore, children, in six days—that is, in six thousand years—everything will come to an end.


    “And he rested on the seventh day.” This is what he means: when his Son comes and abolishes the time of the Lawless One, judges the ungodly, and changes the sun, the moon, and the stars, then he will truly rest on the seventh day.


    Yes, and furthermore he says, “You shall make it holy with pure hands and a pure heart.” Therefore, if anyone is now able to make holy the day that God made holy, even though he is pure in heart, we have gone completely astray.


    But if it is only afterward, and not until then, that we will truly rest and make it holy—when we ourselves are able to do so after being justified and receiving the promise, when iniquity is no more and all things have been made new by the Lord—then we will be able to make it holy, because we ourselves will first have been made holy.


    Finally, he says to them, “Your new moons and your Sabbaths I cannot endure.” You see what he means: it is not your present Sabbaths that are acceptable [to me], but the Sabbath that I have made. On that Sabbath, when I have brought all things to rest, I will make the beginning of the eighth day, which is the beginning of another world.


    Therefore, we also keep the eighth day for rejoicing, on which Jesus also rose from the dead and, after being revealed, ascended into the heavens.'
translation:
  language: ko
  text: '## 바나바의 편지 15장


    또 안식일에 관해서도, 하나님께서 시내산에서 모세와 얼굴을 마주하여 말씀하신 ‘열 말씀’[a] 가운데 이렇게 기록되어 있습니다.


    “너희는 깨끗한 손과 깨끗한 마음으로 주님의 안식일을 거룩하게 하여라.”


    또 다른 곳에서 하나님께서는 이렇게 말씀하십니다.


    “내 자녀들이 안식일을 지키면, 내가 그들에게 자비를 베풀겠다.”


    하나님께서는 창조의 시작에 관하여 말씀하시면서 안식일을 언급하십니다.


    “하나님께서는 엿새 동안 손수 하시는 일을 이루시고, 일곱째 날에 마치셨으며, 그날에 쉬시고 그날을 거룩하게 하셨다.”


    자녀들이여, “그분이 엿새 동안 마치셨다”라는 말이 무슨 뜻인지 주의 깊게 살펴보십시오. 이 말은 주님께서 육천 년 안에 모든 것을 끝마치신다는 뜻입니다. 주님께는 하루가 천 년을 뜻하기 때문입니다. 주님께서 친히 이 사실을 증언하시며 이렇게 말씀하십니다.


    “보라, 주님의 하루는 천 년과 같을 것이다.”


    그러므로 자녀들이여, 엿새, 곧 육천 년 안에 모든 것이 끝날 것입니다.


    “그분은 일곱째 날에 쉬셨다”라는 말의 뜻은 이러합니다. 그분의 아들이 오셔서 불법한 자의 시대[b]를 없애고, 경건하지 않은 자들을 심판하며, 해와 달과 별들을 바꾸실 때, 그분은 일곱째 날에 참으로 쉬실 것입니다.


    더 나아가 하나님께서는 이렇게 말씀하십니다.


    “너는 깨끗한 손과 깨끗한 마음으로 그날을 거룩하게 하여라.”


    그러므로 지금 누군가가 마음이 깨끗한 채로 하나님께서 거룩하게 하신 그날을 거룩하게 할 수 있다면, 우리는 완전히 잘못 알고 있는 셈입니다.


    그러나 우리가 의롭다 하심을 받고 약속을 받은 뒤, 불의가 더는 존재하지 않고 주님께서 모든 것을 새롭게 하셔서 우리 자신이 그렇게 할 수 있게 될 때에야 비로소 참으로 쉬며 그날을 거룩하게 할 것입니다. 그때에는 우리 자신이 먼저 거룩하게 되었으므로 그날을 거룩하게 할 수 있을 것입니다.


    마지막으로 하나님께서는 그들에게 이렇게 말씀하십니다.


    “너희의 초하루와 안식일을 나는 견딜 수 없다.”


    이 말씀의 뜻을 여러분은 알 것입니다. 지금 너희가 지키는 안식일들이 나에게 받아들여지는 것이 아니라, 내가 만든 안식일이 받아들여진다는 뜻입니다.[c] 그 안식일에 내가 모든 것을 쉬게 한 뒤, 여덟째 날을 시작할 것입니다. 그날은 다른 세상의 시작입니다.


    그러므로 우리도 여덟째 날을 기쁨으로 지킵니다. 그날에 예수께서 죽은 사람들 가운데서 살아나셨고, 자신을 나타내신 뒤 하늘로 올라가셨기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘열 말씀’은 흔히 ‘십계명’이라고 부르는 계명들을 가리킵니다.
    reason: 고대 명칭을 보존하면서 현대 독자의 이해를 돕기 위함입니다.
  - marker: b
    text: ‘불법한 자의 시대’는 ‘불법의 시대’로 이해할 수도 있습니다. 표현은 인격적 존재와 그가 지배하는 때를 모두 연상시킬 수 있습니다.
    reason: 원표현의 인격적·추상적 해석 가능성을 모두 보존하기 위함입니다.
  - marker: c
    text: “나에게 받아들여지는”은 문맥상 보충된 말입니다.
    reason: 영어 증거 본문이 대괄호로 표시한 보충을 한국어 본문에서는 자연스럽게 옮기되, 보충임을 투명하게 밝히기 위함입니다.
lexical_decisions:
- source_word: οἱ δέκα λόγοι / Ten Words
  choice: ‘열 말씀’
  rationale: 고대 본문의 명칭을 그대로 살리면서, 독자가 통상적인 ‘십계명’을 가리킨다는 것을 알 수 있도록 각주를 붙였습니다.
- source_word: σαββάτον
  choice: 안식일
  rationale: 유대교의 제칠일과 저자가 논하는 종말론적 안식을 함께 가리킬 수 있는 표준 성서 용어를 사용했습니다.
- source_word: ὁ ἄνομος / the Lawless One
  choice: 불법한 자
  rationale: 이를 단순히 추상적인 ‘불법’으로 환원하지 않고 인격적 지시 가능성을 본문에 보존했습니다.
- source_word: νεομηνίαι
  choice: 초하루
  rationale: 달력상의 월삭 제의를 뜻하는 성서적 맥락을 현대 독자가 이해하기 쉬운 ‘초하루’로 옮겼습니다.
- source_word: ἡ ὀγδόη ἡμέρα / the eighth day
  choice: 여덟째 날
  rationale: 저자의 창조 주간 및 새 세계의 도식과 부활일의 연관성을 해석으로 대체하지 않고 직역에 가깝게 보존했습니다.
- source_word: ἄλλος κόσμος
  choice: 다른 세상
  rationale: ‘새 시대’나 특정 종말론 체계로 좁히지 않고 원문의 우주론적 표현과 긴장을 유지했습니다.
theological_decisions:
- issue: 엿새를 육천 년으로 풀이하는 종말론적 시간표
  choice: 저자의 해석을 단정적 진술 형태로 그대로 제시
  alternative: 상징적 비유로 완화하거나 현대적 연대 계산으로 설명
  rationale: 본문 자체가 시편 계열의 ‘하루와 천 년’ 전승을 근거로 명시적인 해석을 제시하므로, 이를 완화하거나 특정 현대 종말론에 맞추지 않았습니다.
- issue: 일곱째 날에 쉬는 주체
  choice: 문맥의 대명사 ‘그분’을 유지
  alternative: 하나님 또는 아들로 명시
  rationale: 문단에서 하나님과 아들이 함께 언급되어 지시 관계에 긴장이 있으므로, 원문 증거가 허용하는 모호성을 번역에서 성급히 해소하지 않았습니다.
- issue: 현재의 안식일 준수와 미래의 참된 안식
  choice: 저자의 현재·미래 대조를 그대로 보존
  alternative: 유대교 비판이나 특정 교파의 주일론으로 명시
  rationale: 저자의 논지는 제시하되, 이를 후대의 안식일·주일 교리 논쟁에 직접 대입하지 않았습니다.
- issue: 여덟째 날의 준수
  choice: ‘기쁨으로 지킵니다’
  alternative: ‘예배일로 지킵니다’ 또는 ‘주일을 지킵니다’
  rationale: 원문이 말하지 않는 구체적인 예배 규정이나 후대 명칭을 덧붙이지 않고, 기쁨을 중심으로 한 준수라는 표현을 유지했습니다.
- issue: 예수의 부활·현현·승천의 시간 관계
  choice: 본문의 서술 순서를 유지
  alternative: 모든 사건이 여덟째 날 하루에 일어났다고 명시하거나 복음서 연대와 조화
  rationale: 문장의 관계가 압축적이므로, 후대의 연대 조화로 본문의 긴장을 제거하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 권면에서는 ‘살펴보십시오’, 설명에서는 ‘것입니다’를 써서 교훈적 문체를 살렸습니다. 성서 인용은 본문의 논증 안에 자연스럽게 들어가도록 별도 단락으로 배치했습니다. 제공 자료가 공용 영역 영어 증거 본문이며 그리스어·라틴어 직접 대조가 아직 완료되지 않았다고 명시되어 있으므로, 현 단계에서는 알려진 원어 용어와 제공된 증거를 함께 참조한 출판 초안으로 작성했으며, 최종 확정 전 사본별 직접 검토가 필요합니다.
