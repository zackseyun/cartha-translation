  text: 'This, then, is the way of light: if anyone desires to travel on the way to his appointed place, he should be zealous in his works. The knowledge given to us, by which we may walk in it, is as follows.


    You shall love the One who made you. You shall fear the One who created you. You shall glorify the One who redeemed you from death. You shall be simple in heart and rich in spirit. You shall not cleave to those who walk the way of death. You shall hate everything that is not pleasing to God. You shall hate all hypocrisy. You shall never forsake the commandments of the Lord.


    You shall not exalt yourself, but shall be lowly minded in all things. You shall not assume glory for yourself. You shall not entertain a wicked design against your neighbor. You shall not admit boldness into your soul.


    You shall not commit fornication. You shall not commit adultery. You shall not corrupt boys. The word of God shall not come forth from you where any are unclean. You shall not make a difference in a person when reproving him for a transgression. You shall be meek. You shall be quiet. You shall fear the words you have heard. You shall not bear a grudge against your brother.


    You shall not doubt whether a thing shall be or not be. You shall not take the name of the Lord in vain. You shall love your neighbor more than your own soul. You shall not murder a child by abortion, nor shall you kill it when it is born. You shall not withhold your hand from your son or daughter, but from their youth you shall teach them the fear of God.


    You shall not be found coveting your neighbor''s goods. You shall not be found greedy for gain. Neither shall you cleave with your soul to the lofty, but you shall walk with the humble and righteous. You shall receive the accidents that befall you as good, knowing that nothing is done without God. You shall not be double-minded or double-tongued.


    You shall be subject to your masters as to a type of God, in shame and fear. You shall not command your bondservant or handmaid in bitterness, though they set their hope on the same God, lest perhaps they cease to fear the God who is over both of you; for He came not to call with respect of persons, but to call those whom the Spirit has prepared.


    You shall make your neighbor partake in all things, and shall not say that anything is your own. For if you are fellow partakers in that which is imperishable, how much rather shall you be in the things that are perishable? You shall not be hasty with your own tongue, for the mouth is the snare of death. So far as you are able, you shall be pure for your soul''s sake.


    Do not be found holding out your hands to receive and drawing them in to give. You shall love as the apple of your eye everyone who speaks to you the word of the Lord.


    You shall remember the day of judgment night and day, and day by day you shall seek out the persons of the saints, either laboring by word and going to exhort them and meditating how you may save souls by your word, or working with your hands for a ransom for your sins.


    You shall not hesitate to give, nor shall you murmur when giving, but you shall know who is the good paymaster of your reward. You shall keep the things you have received, neither adding to them nor taking away from them. You shall utterly hate the Evil One. You shall judge righteously.


    You shall not make a schism, but shall pacify those who contend by bringing them together. You shall confess your sins. You shall not betake yourself to prayer with an evil conscience. This is the way of light.'
translation:
  language: ko
  text: '그러므로 빛의 길은 이러합니다. 누구든지 정해진 곳으로 가는 길을 걷고자 한다면, 자기 행실에 힘써야 합니다. 우리가 그 길을 걸을 수 있도록 주어진 지식은 다음과 같습니다.


    당신을 지으신 분을 사랑하십시오. 당신을 창조하신 분을 경외하십시오. 당신을 죽음에서 속량하신 분께 영광을 돌리십시오. 마음은 순전하고 영은 풍성하십시오. 죽음의 길을 걷는 자들과 어울리지 마십시오. 하나님을 기쁘시게 하지 않는 모든 것을 미워하십시오. 모든 위선을 미워하십시오. 주님의 계명을 결코 저버리지 마십시오.


    자신을 높이지 말고 모든 일에서 겸손한 마음을 품으십시오. 스스로 영광을 취하지 마십시오. 이웃을 해칠 악한 계략을 품지 말고, 방자함이 당신의 영혼에 들어오지 못하게 하십시오.


    음행하지 마십시오. 간음하지 마십시오. 소년들을 타락시키지 마십시오.[a] 부정한 사람들이 있는 자리에서 하나님의 말씀이 당신에게서 나오게 하지 마십시오.[b] 어떤 사람의 잘못을 꾸짖을 때 사람을 차별하지 마십시오. 온유하고 차분하십시오. 당신이 들은 말씀을 두려워하십시오. 형제에게 원한을 품지 마십시오.


    어떤 일이 이루어질지 말지를 의심하지 마십시오.[c] 주님의 이름을 헛되이 부르지 마십시오. 자기 목숨보다 이웃을 더 사랑하십시오. 낙태로 아이를 죽이지 말며, 태어난 아이도 죽이지 마십시오. 아들이나 딸에게서 손을 거두지 말고, 어려서부터 하나님을 경외하도록 가르치십시오.


    이웃의 재물을 탐내는 사람으로 드러나지 마십시오. 이익을 탐하는 사람으로 드러나지 마십시오. 마음으로 높은 자들에게 붙지 말고, 겸손하고 의로운 사람들과 함께 걸으십시오. 당신에게 닥치는 일들을 좋은 것으로 받아들이십시오. 하나님 없이는 아무 일도 일어나지 않는다는 것을 아십시오.[d] 두 마음을 품지 말고, 두 가지 말도 하지 마십시오.


    주인들에게 하나님을 보여 주는 표상에게 하듯[e] 수치심과 두려움으로 복종하십시오. 당신과 같은 하나님께 소망을 둔 남종이나 여종에게 모질게 명령하지 마십시오. 그러다가 그들이 두 사람 모두 위에 계신 하나님을 더는 경외하지 않게 될 수도 있습니다. 그분은 사람을 차별하여 부르러 오신 것이 아니라, 성령께서 준비하신 사람들을 부르러 오셨기 때문입니다.


    모든 것을 이웃과 나누고, 어떤 것도 자기 것이라고 말하지 마십시오. 썩지 않을 것을 함께 나누는 사람들이라면, 썩을 것들은 얼마나 더 함께 나누어야 하겠습니까? 혀를 성급히 놀리지 마십시오. 입은 죽음의 덫이기 때문입니다. 할 수 있는 데까지 당신의 영혼을 위하여 순결을 지키십시오.


    받을 때는 손을 내밀고 줄 때는 거두어들이는 사람으로 드러나지 마십시오. 당신에게 주님의 말씀을 전하는 사람은 누구나 눈동자처럼 사랑하십시오.


    밤낮으로 심판의 날을 기억하십시오. 날마다 거룩한 이들을 찾아가십시오. 말로 수고하며 그들을 격려하러 가고, 당신의 말로 어떻게 영혼을 구할지 깊이 생각하십시오. 그렇지 않으면 손으로 일하여 당신의 죄를 위한 속전을 마련하십시오.[f]


    주기를 주저하지 말고, 줄 때 불평하지 마십시오. 누가 당신의 상을 후하게 갚아 주시는 분인지 아십시오. 받은 것들을 지키되, 거기에 더하지도 말고 거기에서 빼지도 마십시오. 악한 자를 철저히 미워하십시오. 의롭게 판단하십시오.


    분열을 일으키지 말고, 다투는 사람들을 화해시켜 하나가 되게 하십시오. 당신의 죄를 고백하십시오. 악한 양심을 지닌 채 기도하러 나아가지 마십시오. 이것이 빛의 길입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소년들을 타락시키다’는 표현은 고대 문맥에서 소년을 성적으로 착취하거나 부도덕하게 만드는 행위를 가리킬 수 있습니다. 제공된 자료는 직접적인 그리스어·라틴어 대조가 아직 이루어지지 않은 영어 증언입니다.
    reason: 민감하고 의미 범위가 불확실한 표현의 역사적 가능성을 알립니다.
  - marker: b
    text: 이 문장의 정확한 뜻은 불분명합니다. 부정한 사람들 앞에서 하나님의 말씀을 함부로 말하지 말라는 뜻일 수도 있고, 말하는 이 자신의 부정함과 관련된 경고일 수도 있습니다.
    reason: 영어 증언 자체의 구문적 모호성을 보존합니다.
  - marker: c
    text: 직역하면 ‘그 일이 있을지 없을지 의심하지 마십시오’입니다. 기도의 응답, 하나님의 약속, 또는 행동의 결단 가운데 무엇을 가리키는지는 문장만으로 확정하기 어렵습니다.
    reason: 지시 대상이 불명확한 문구를 특정 교리로 단정하지 않습니다.
  - marker: d
    text: ‘하나님 없이는’은 하나님의 허락, 섭리 또는 관여를 뜻할 수 있습니다. 본문은 그 관계를 더 구체적으로 설명하지 않습니다.
    reason: 악과 고난에 관한 신학적 긴장을 섣불리 해소하지 않습니다.
  - marker: e
    text: ‘표상’은 원문의 영어 증언에 있는 ‘type’을 옮긴 말로, 주인을 하나님과 동일시한다는 뜻이 아니라 하나님을 상기시키거나 대표하는 존재처럼 대하라는 유비적 표현입니다.
    reason: 오독 가능성이 큰 고대 사회 윤리 표현을 설명합니다.
  - marker: f
    text: ‘죄를 위한 속전’은 고대의 참회·자선 전승과 연결될 수 있으나, 여기서는 행위가 죄를 어떻게 처리하는지 체계적으로 설명하지 않습니다.
    reason: 공로와 속죄에 관한 후대 교리를 본문에 투사하지 않으면서 난해한 표현을 밝힙니다.
lexical_decisions:
- source_word: way of light
  choice: 빛의 길
  rationale: 두 길 전승의 핵심 은유를 간결하고 일관되게 보존했습니다.
- source_word: simple in heart
  choice: 마음은 순전하고
  rationale: ‘단순하다’보다 도덕적 성실성과 나뉘지 않은 마음을 자연스럽게 전달합니다.
- source_word: corrupt boys
  choice: 소년들을 타락시키지 마십시오
  rationale: 제공된 증거가 구체적 행위의 범위를 확정하지 못하므로 완곡하게 일반화하지 않고 원문의 대상과 도덕적 비난을 보존했습니다.
- source_word: double-minded / double-tongued
  choice: 두 마음을 품지 말고, 두 가지 말도 하지 마십시오
  rationale: 병행 구조와 내적 불일치·언어적 이중성의 이미지를 유지했습니다.
- source_word: type of God
  choice: 하나님을 보여 주는 표상
  rationale: ‘하나님의 모형’이라는 오해를 피하면서도 대표적·유비적 의미를 보존했습니다.
- source_word: ransom for your sins
  choice: 당신의 죄를 위한 속전
  rationale: 불편한 신학적 긴장을 해소하지 않고 속전이라는 교환 이미지를 그대로 살렸습니다.
- source_word: the Evil One
  choice: 악한 자
  rationale: 인격적 지시 가능성을 유지하되 특정 고유명사로 과도하게 확정하지 않았습니다.
theological_decisions:
- issue: 섭리와 사건의 관계
  choice: 하나님 없이는 아무 일도 일어나지 않는다
  alternative: 하나님의 뜻이 아니면 아무 일도 일어나지 않는다
  rationale: ‘뜻’이나 적극적 인과를 덧붙이지 않아 제공된 문구의 열린 의미와 신학적 긴장을 보존했습니다.
- issue: 주인에 대한 복종과 하나님 표상
  choice: 하나님을 보여 주는 표상에게 하듯
  alternative: 하나님께 하듯
  rationale: 주인을 하나님과 동일시하지 않고 ‘type’의 유비적 성격을 드러냈습니다.
- issue: 성령의 준비와 부르심
  choice: 성령께서 준비하신 사람들
  alternative: 영이 준비한 사람들
  rationale: 문맥상 인격적 성령을 가리킬 가능성이 높지만, 교파적 예정론은 덧붙이지 않았습니다.
- issue: 노동과 죄의 속전
  choice: 손으로 일하여 당신의 죄를 위한 속전을 마련하십시오
  alternative: 손으로 일하여 가난한 이들에게 자선을 베푸십시오
