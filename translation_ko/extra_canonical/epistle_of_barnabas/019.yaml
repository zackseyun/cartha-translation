  revised_text: '그러므로 빛의 길은 이러합니다. 누구든지 정해진 곳으로 가는 길을 걷고자 한다면, 자기 행실에 힘써야 합니다. 우리가 그 길을 걸을 수 있도록 주어진 지식은 다음과 같습니다.


    당신을 지으신 분을 사랑하십시오. 당신을 창조하신 분을 경외하십시오. 당신을 죽음에서 속량하신 분께 영광을 돌리십시오. 마음은 순전하고 영은 풍성하십시오. 죽음의 길을 걷는 자들과 어울리지 마십시오. 하나님을 기쁘시게 하지 않는 모든 것을 미워하십시오. 모든 위선을 미워하십시오. 주님의 계명을 결코 저버리지 마십시오.


    자신을 높이지 말고 모든 일에서 겸손한 마음을 품으십시오. 스스로 영광을 취하지 마십시오. 이웃을 해칠 악한 계략을 품지 말고, 방자함이 당신의 영혼에 들어오지 못하게 하십시오.


    음행하지 마십시오. 간음하지 마십시오. 소년들을 타락시키지 마십시오.[a] 어떤 부정함 가운데서도 하나님의 말씀이 당신에게서 나오게 하지 마십시오.[b] 어떤 사람의 잘못을 꾸짖을 때 사람을 차별하지 마십시오. 온유하고 차분하십시오. 당신이 들은 말씀을 두려워하십시오. 형제에게 원한을 품지 마십시오.


    어떤 일이 이루어질지 말지를 의심하지 마십시오.[c] 주님의 이름을 헛되이 부르지 마십시오. 자기 목숨보다 이웃을 더 사랑하십시오. 낙태로 아이를 죽이지 말며, 태어난 아이도 죽이지 마십시오. 아들이나 딸의 양육을 소홀히 하지 말고, 어려서부터 하나님을 경외하도록 가르치십시오.


    이웃의 재물을 탐내는 사람으로 드러나지 마십시오. 이익을 탐하는 사람으로 드러나지 마십시오. 마음으로 높은 자들에게 붙지 말고, 겸손하고 의로운 사람들과 함께 걸으십시오. 당신에게 닥치는 일들을 좋은 것으로 받아들이십시오. 하나님 없이는 아무 일도 일어나지 않는다는 것을 아십시오.[d] 두 마음을 품지 말고, 두 가지 말도 하지 마십시오.


    하나님의 표상에게 하듯 주인들에게 수치심과 두려움으로 복종하십시오.[e] 같은 하나님께 소망을 둔 남종이나 여종에게 모질게 명령하지 마십시오. 그러다가 그들이 두 사람 모두 위에 계신 하나님을 더는 경외하지 않게 될 수도 있습니다. 그분은 사람을 차별하여 부르러 오신 것이 아니라, 성령께서 준비하신 사람들을 부르러 오셨기 때문입니다.


    모든 것을 이웃과 나누고, 어떤 것도 자기 것이라고 말하지 마십시오. 썩지 않을 것을 함께 나누는 사람들이라면, 썩을 것들은 얼마나 더 함께 나누어야 하겠습니까? 혀를 성급히 놀리지 마십시오. 입은 죽음의 덫이기 때문입니다. 할 수 있는 데까지 당신의 영혼을 위하여 정결을 지키십시오.


