base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: ko
  text: '내가 할 수 있는 데까지 모든 것을 여러분에게 쉬운 말로 설명하였으니, 내 영혼은 [구원에 관한 일들 가운데서 아무것도 빠뜨려 내 바람을 이루지 못하는 일이] 없었기를 바랍니다.[a]


    내가 현재의 일이나 장래의 일에 관하여 여러분에게 쓴다 해도, 그것들이 비유로 표현되어 있기 때문에 여러분은 이해하지 못할 것입니다. 이 일에 관해서는 이만하겠습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 전승 본문의 훼손 또는 복원 가능성을 나타내는 것으로, 정확한 문구는 확실하지 않습니다.
    reason: 제공된 영어 증언에 나타난 대괄호의 본문비평적 신호를 독자에게 설명합니다.
lexical_decisions:
- source_word: with all simplicity
  choice: 쉬운 말로
  rationale: 꾸밈없고 명료하게 설명한다는 뜻을 현대 한국어 독자가 자연스럽게 이해하도록 옮겼습니다.
- source_word: my soul hopeth
  choice: 내 영혼은 … 바랍니다
  rationale: 고대 문헌의 신체·인격 표현을 보존하되 한국어 문장으로 자연스럽게 구성했습니다.
- source_word: things immediate or future
  choice: 현재의 일이나 장래의 일
  rationale: 영어 증언의 시간적 대조를 그대로 유지했으며, ‘immediate’의 정확한 원문 어휘는 재검토가 필요합니다.
- source_word: parables
  choice: 비유
  rationale: 상징적이고 간접적인 표현 방식을 가리키는 전통적이며 널리 이해되는 용어를 사용했습니다.
theological_decisions:
- issue: 구원 관련 구절의 본문 확실성
  choice: 대괄호 안에 보존하고 각주로 불확실성을 알림
  alternative: 대괄호를 없애 본문에 확정적으로 포함하거나 본문에서 삭제
  rationale: 제공된 증언이 복원 또는 본문 훼손 신호를 대괄호로 표시하므로, 구원론적 내용을 확정하거나 제거하지 않고 그 긴장을 보존했습니다.
- issue: ‘현재의 일이나 장래의 일’의 구체적 지시 대상
  choice: 해석하여 특정하지 않고 포괄적으로 유지
  alternative: 현세와 종말의 사건 등으로 구체화
  rationale: 직접적인 그리스어·라틴어 검토가 보류된 상태이므로 교리적 또는 종말론적 의미를 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문체는 간결하고 품위 있게 유지했으며, 직접적인 그리스어·라틴어 대조가 아직 이루어지지 않았으므로 제공된 공용 영어 증언에 근거한 잠정 번역입니다.
