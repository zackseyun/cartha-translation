base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/001.yaml
  text: 'I greet you, sons and daughters, in the name of the Lord who loved us, in peace.


    Seeing that the ordinances of God are great and rich unto you, I rejoice with exceedingly great and overflowing joy over your blessed and glorious spirits; so innate is the grace of the spiritual gift you have received.


    Therefore, I congratulate myself all the more, hoping to be saved, because I truly see that the Spirit has been poured out among you from the riches of the Lord’s fountain. The greatly desired sight of you amazed me so much concerning you.


    Being persuaded of this, and knowing within myself that, after saying many things among you, I know that the Lord traveled with me on the way of righteousness, I am also wholly compelled to love you more than my own soul—for great faith and love dwell in you through the hope of the life that is his—considering this, therefore, that,


    if I take care to share with you some portion of what I received, it will become my reward for having ministered to such spirits, I was eager to send you something small, so that together with your faith you might also have complete knowledge.


    Well then, there are three ordinances of the Lord: *the hope of life, which is the beginning and end of our faith; righteousness, which is the beginning and end of judgment; and love displayed in gladness and exultation, the testimony of works of righteousness.*


    For the Lord made known to us through his prophets things past and present, giving us likewise the firstfruits of the taste of things future. Seeing each of these things coming to pass one by one, just as he said, we ought to offer a richer and higher offering to the fear of him. But I, not as though I were a teacher, but as one of you, will set out a few things by which you will be gladdened in the present circumstances.'
translation:
  language: ko
  text: '바나바의 편지 1장


    1 여러분에게 평안이 있기를 빕니다. 우리를 사랑하신 주님의 이름으로 아들딸 여러분에게 문안합니다.


    2 하나님께서 여러분에게 베푸신 규례가 크고 풍성한 것을 보며, 나는 여러분의 복되고 영광스러운 영으로 말미암아 한없이 크고 넘치는 기쁨을 누립니다. 여러분은 영적 선물의 은혜를 이처럼 깊이 심어 받았습니다.


    3 그러므로 나는 구원받기를 바라며 더욱더 나 자신과 함께 기뻐합니다. 주님의 샘에서 나오는 풍성함으로 말미암아 성령께서 여러분 가운데 참으로 부어지신 것을 내가 보기 때문입니다. 그토록 바라던 여러분의 모습을 보고, 나는 여러분에 관해 크게 놀랐습니다.


    4 나는 이것을 확신합니다. 또한 내가 여러분 가운데서 많은 것을 말한 뒤, 주님께서 의의 길에서 나와 함께 걸으셨다는 것을 스스로 압니다. 그래서 나 자신도 여러분을 내 목숨보다 더 사랑하지 않을 수 없습니다. 주님의 생명에 대한 소망으로 말미암아 큰 믿음과 사랑이 여러분 안에 깃들어 있기 때문입니다.


    5 그러므로 나는 이렇게 생각했습니다. 내가 받은 것 가운데 얼마를 여러분과 나누는 데 힘쓴다면, 이와 같은 영들을 섬긴 일이 내게 상이 될 것입니다. 그래서 여러분이 믿음과 더불어 지식도 온전하게 갖추도록, 보잘것없는 글이나마 여러분에게 보내고자 서둘렀습니다.


    6 그러므로 주님의 규례는 세 가지입니다. 곧 우리 믿음의 시작이요 끝인 생명의 소망, 심판의 시작이요 끝인 의, 그리고 기쁨과 환희로 나타나는 사랑, 곧 의로운 행위의 증거입니다.[a]


    7 주님께서는 예언자들을 통하여 지나간 일과 지금의 일을 우리에게 알려 주셨고, 장차 올 일을 맛보는 첫 열매도 우리에게 주셨습니다. 그분이 말씀하신 대로 이 모든 일이 하나씩 이루어지는 것을 보면서, 우리는 그분을 경외하는 일에 더욱 풍성하고 고귀한 제물을 드려야 합니다. 그러나 나는 교사인 양 말하지 않고 여러분 가운데 한 사람으로서, 지금 처한 형편에서 여러분을 기쁘게 해 줄 몇 가지를 밝혀 보이겠습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 세 항목의 문장 구조와 서로의 관계는 압축적입니다. 특히 ‘심판의 시작이요 끝인 의’와 ‘의로운 행위의 증거’가 정확히 무엇을 수식하는지는 여러 방식으로 이해될 수 있으므로, 본문은 그 압축성과 모호성을 유지했습니다.
    reason: 문법적으로 압축된 삼중 진술을 번역에서 한 가지 해석으로 고정하지 않기 위해서입니다.
lexical_decisions:
- source_word: ordinances / δικαιώματα (Greek witness reported in the textual tradition)
  choice: 규례
  rationale: 문맥상 하나님의 요구·정하심·의로운 규범을 가리키는 폭넓은 말로 보아, 법률적 의미에만 한정되는 ‘법령’보다 ‘규례’를 택했습니다.
- source_word: sons and daughters
  choice: 아들딸 여러분
  rationale: 공동체 구성원을 가족적으로 부르는 호칭을 성별을 모두 드러내면서도 자연스러운 현대 한국어로 옮겼습니다.
- source_word: spirits
  choice: 영
  rationale: ‘사람들’로 풀어 의미를 확정하지 않고, 수신자들의 영을 가리키는 원문의 인격적·영적 표현을 보존했습니다.
- source_word: the life which is His
  choice: 주님의 생명
  rationale: 생명이 주님께 속한다는 관계를 간결하게 드러내되, ‘주님이신 생명’으로 동일시하여 신학적 의미를 추가하지 않았습니다.
- source_word: a trifle / something small
  choice: 보잘것없는 글이나마
  rationale: 저자가 보내는 내용의 작고 겸손한 성격을 한국어에서 자연스럽게 나타내고, 실제 전달 매체가 서신임을 문맥적으로 밝혔습니다.
- source_word: firstfruits of the taste
  choice: 맛보는 첫 열매
  rationale: ‘맛봄’과 ‘첫 열매’라는 겹친 비유를 매끄럽게 단순화하지 않고 함께 보존했습니다.
theological_decisions:
- issue: ‘성령/영’의 지시 대상
  choice: 3절의 부어진 영은 ‘성령’으로, 2절과 5절의 수신자들을 가리키는 복수적 표현은 ‘영’으로 구별했습니다.
  alternative: 모든 경우를 단순히 ‘영’으로 옮길 수 있습니다.
  rationale: 주님의 샘에서 부어진 영이라는 3절의 표현은 신적 성령을 가리키는 문맥이 강하지만, 수신자들의 ‘영들’은 인간 공동체 구성원을 지칭하는 표현이므로 구분했습니다.
- issue: ‘심판의 시작과 끝인 의’의 관계
  choice: 문장 구조를 그대로 유지했습니다.
  alternative: ‘의는 심판을 처음부터 끝까지 이끄는 기준’처럼 해설적으로 풀 수 있습니다.
  rationale: 의와 심판의 정확한 관계를 본문이 명시하지 않으므로 모호성과 신학적 긴장을 보존했습니다.
- issue: ‘구원받기를 바라며 나 자신과 함께 기뻐함’
  choice: 저자의 구원 소망과 수신자들의 상태 사이의 논리적 연결을 그대로 두었습니다.
  alternative: 수신자들 때문에 자신의 구원을 확신한다고 풀어 쓸 수 있습니다.
  rationale: 본문은 소망과 기쁨을 말하지만 구원의 확정 방식까지 설명하지 않으므로 교리적으로 보충하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 가족적 호칭과 영적 비유는 살리되 고어투는 피했고, 긴 원문 문장은 읽기 쉽도록 나누었습니다. 제공 자료가 공공 영역 영어 증언과 그리스어·라틴어 전승에 대한 메타데이터에 의존하며 직접적인 원문 대조가 보류된 상태이므로, 이 초안은 원문 증인 재검토 후 확정해야 합니다.
