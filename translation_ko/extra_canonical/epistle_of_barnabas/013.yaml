base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/013.yaml
  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: ko
  text: '이제 이 백성이 유업을 받는지, 아니면 먼저 있었던 백성이 받는지, 또 언약이 우리를 가리킨 것인지 그들을 가리킨 것인지 살펴봅시다.


    그러므로 성경이 두 백성에 관하여 무엇이라고 말하는지 들어 보십시오. “이삭은 자기 아내 리브가가 임신하지 못하였으므로 그를 위하여 기도하였습니다. 그러자 리브가가 임신하였습니다. 그 뒤 리브가는 주님께 여쭈러 나갔습니다. 주님께서 그에게 말씀하셨습니다. ‘두 민족이 네 태 안에 있고, 두 백성이 네 배 속에 있다. 한 백성이 다른 백성을 이길 것이며, 큰 자가 작은 자를 섬길 것이다.’”[a]


    여러분은 이삭이 누구이며 리브가가 누구인지, 또 하나님께서 누구를 두고 한 백성이 다른 백성보다 크다는 것을 보여 주셨는지 깨달아야 합니다.


    또 다른 예언에서 야곱은 자기 아들 요셉에게 더 분명히 말합니다. “보아라, 주님께서 내가 네 얼굴을 다시 보지 못하게 하지는 않으셨구나. 네 아들들을 내게 데려오너라. 내가 그들을 축복하겠다.”[b]


    요셉은 므낫세가 맏아들이므로 그가 축복받기를 바라며 에브라임과 므낫세를 데려왔습니다. 그래서 므낫세를 아버지 야곱의 오른손 쪽으로 이끌었습니다. 그러나 야곱은 성령 안에서 훗날 올 백성의 모형을 보았습니다.[c] 그러면 성경은 무엇이라고 말합니까? “야곱은 두 손을 엇갈리게 하여 둘째이며 어린 에브라임의 머리에 오른손을 얹고 그를 축복하였습니다. 요셉이 야곱에게 말하였습니다. ‘아버지의 오른손을 므낫세의 머리로 옮기십시오. 이 아이가 제 맏아들입니다.’ 야곱이 요셉에게 말하였습니다. ‘안다, 내 아들아. 나도 안다. 그러나 큰 자가 작은 자를 섬길 것이다. 그렇지만 이 아이도 복을 받을 것이다.’”[d]


    하나님께서 누구를 두고 이 백성이 첫째가 되고 언약의 상속자가 되도록 정하셨는지 유의하십시오.


    이뿐 아니라 하나님께서 아브라함을 통하여서도 그것을 기록하셨다면, 우리의 이해는 온전해집니다. 그러면 아브라함이 홀로 믿어 그것이 의로 인정되었을 때, 하나님께서 그에게 무엇이라고 말씀하십니까?[e] “보아라, 아브라함아, 내가 너를 할례받지 않은 채로 하나님을 믿는 민족들의 아버지로 삼았다.”[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 창세기 25:21–23을 인용하거나 변형하여 인용한 대목입니다. 현존 창세기 본문의 일반적 표현과 일부 차이가 있습니다.
    reason: 인용 출처와 문구 차이를 알립니다.
  - marker: b
    text: 창세기 48:11, 9의 내용을 결합하여 인용한 것으로 보입니다.
    reason: 복합 인용의 성격을 밝힙니다.
  - marker: c
    text: ‘모형’은 앞선 인물이나 사건이 훗날의 실재를 미리 나타낸다는 뜻입니다.
    reason: 유형론적 용어의 이해를 돕습니다.
  - marker: d
    text: 창세기 48장의 축복 장면에 창세기 25:23의 ‘큰 자가 작은 자를 섬길 것이다’라는 말이 결합되어 있습니다. 창세기 48:19의 통상적 본문은 에브라임이 므낫세보다 더 크게 되리라고 말합니다.
    reason: 저자의 인용 방식과 성경 본문 사이의 차이를 보존합니다.
  - marker: e
    text: 아브라함의 믿음이 의로 인정되었다는 말은 창세기 15:6을 가리킵니다.
    reason: 암시된 성경 출처를 밝힙니다.
  - marker: f
    text: 창세기 17:5의 표현에 ‘할례받지 않은 채로 하나님을 믿는’이라는 해석적 문구가 덧붙은 형태입니다. ‘민족들’은 문맥에 따라 ‘이방인들’로도 옮길 수 있습니다.
    reason: 인용의 확장과 어휘의 가능한 의미를 알립니다.
lexical_decisions:
- source_word: this people / the first people
  choice: 이 백성 / 먼저 있었던 백성
  rationale: 저자의 대조를 유지하되 ‘첫 백성’이라는 부자연스러운 한국어를 피했습니다. 어느 공동체를 가리키는지는 본문이 전개하도록 두었습니다.
- source_word: inheritance / heir
  choice: 유업 / 언약의 상속자
  rationale: 성경적 배경이 있는 ‘유업’을 첫 문장에 사용하고, 뒤에서는 문장 명료성을 위해 ‘상속자’로 표현했습니다.
- source_word: the greater / the less
  choice: 큰 자 / 작은 자
  rationale: 나이, 지위, 민족적 우위 가운데 하나로 의미를 한정하지 않고 원문의 비교 표현을 보존했습니다.
- source_word: in the Spirit
  choice: 성령 안에서
  rationale: 단순히 영적 통찰로 풀지 않고 신학적 표현과 그 긴장을 보존했습니다.
- source_word: type
  choice: 모형
  rationale: 후대 백성을 미리 나타내는 예표적 관계를 드러내는 전통적이면서 이해 가능한 용어를 선택했습니다.
- source_word: in uncircumcision
  choice: 할례받지 않은 채로
  rationale: 추상 명사 ‘무할례’보다 현대 독자가 쉽게 이해하도록 풀어 쓰되, 할례 여부라는 논점을 보존했습니다.
theological_decisions:
- issue: ‘이 백성’과 ‘먼저 있었던 백성’의 정체
  choice: 대상을 본문 안에서 명시적으로 확정하지 않음
  alternative: 각각 교회와 이스라엘로 직접 표기
  rationale: 저자의 논지는 그러한 대비를 암시하지만, 지시 대상을 번역자가 본문에 삽입하여 해석을 확정하지 않았습니다.
- issue: ‘He/he’의 주체가 하나님인지 성경인지
  choice: 문맥에 따라 ‘하나님께서’와 ‘성경은’으로 구분
  alternative: 모두 ‘그분’ 또는 ‘그것’으로 번역
  rationale: 한국어의 자연스러움을 확보하면서도, 행위의 주체가 정하시는 분일 때는 하나님으로, 인용문을 제시할 때는 성경으로 표현했습니다. 다만 직접 원어 검토 전의 잠정 판단입니다.
- issue: 야곱의 행동이 후대 백성의 예표라는 주장
  choice: 저자의 해석을 ‘모형’으로 그대로 제시
  alternative: 단순한 예견이나 상징으로 완화
  rationale: 저자의 유형론적 논증을 약화하거나 특정 교리 체계로 확대하지 않았습니다.
- issue: 아브라함의 믿음과 의의 인정
  choice: ‘그것이 의로 인정되었다’
  alternative: ‘그가 의로운 사람으로 여겨졌다’
  rationale: 행위가 아니라 믿음이 의로 간주되었다는 성경 인용의 구조를 보존했습니다.
translation_notes:
  register: 현대 표준어 합쇼체를 사용하되, 논증문의 엄숙함을 유지했습니다. 성경 인용은 직접화법으로 명확히 구분했습니다. 제공 자료가 영어 공용 번역 증언이며 그리스어·라틴어 원문 대조가 아직 이루어지지 않았으므로, 대명사 주체와 일부 인용 문구에 관한 결정은 잠정적입니다.
