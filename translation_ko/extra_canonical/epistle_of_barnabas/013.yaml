review_pass:
  verdict: revise
  source_fidelity: 대체로 영어 증언의 논증과 인용 배열을 충실히 옮겼습니다. 다만 첫 문장의 ‘언약이 우리를/그들을 가리킨 것’은 원문의 소유·귀속 관계(‘우리에게 속한 것인가, 그들에게 속한 것인가’)보다 약하며, 마지막의 ‘그것이 의로 인정되었다’는 선행사가 불명확합니다. 또한 ‘성경이 두 백성에 관하여’는 원문의 단수 ‘그 백성에 관하여’를 불필요하게 한정합니다.
  naturalness: 현대 표준어 합쇼체와 인용문의 문체는 전반적으로 자연스럽습니다. ‘주님께서 그에게’는 리브가를 가리키는 대명사로 다소 어색하므로 이름을 반복하는 편이 명료합니다. ‘유의하십시오’도 가능하나 논증적 권면에는 ‘잘 살펴보십시오’가 더 자연스럽습니다.
  terminology: ‘유업’, ‘언약’, ‘모형’, ‘할례받지 않은 채로’는 적절합니다. ‘성령 안에서’는 제공된 영어 증언의 대문자 Spirit을 따른 잠정 번역으로 유지하되, 직접 그리스어·라틴어 대조가 이루어지기 전에는 이를 교리적으로 확대하지 않아야 합니다. ‘언약의 상속자’는 원문의 단수 ‘상속자’에 맞습니다.
  issues:
  - severity: medium
    issue: 언약의 관계를 ‘가리킨 것’으로 번역함
    rationale: ‘whether the covenant had reference to us or to them’은 문맥상 언약이 어느 쪽에 속하거나 향하는가를 묻습니다. ‘우리에게 속한 것인지, 그들에게 속한 것인지’가 논증의 귀속 관계를 더 정확히 보존합니다.
  - severity: low
    issue: ‘성경이 두 백성에 관하여’라는 한정
    rationale: 영어 증언은 ‘the people’이라고 단수로 말합니다. 이어지는 인용에 두 민족·두 백성이 나오더라도 서술자가 여기서 대상을 ‘두 백성’이라고 명시하지는 않습니다.
  - severity: medium
    issue: ‘그것이 의로 인정되었을 때’의 선행사 불명확
    rationale: 아브라함이 믿었고 그 믿음이 그에게 의로 여겨졌다는 인용의 구조를 한국어에서 분명히 해야 합니다. ‘그가 홀로 믿었고 그것이 그에게 의로 여겨졌을 때’로 옮기면 의미가 보존됩니다.
  - severity: low
    issue: ‘누구를 두고’가 복수의 경우를 다소 좁힘
    rationale: ‘in whose cases’는 앞서 든 여러 인물·사례를 가리킵니다. ‘어떤 이들의 경우를 통해’가 원문의 복수성과 논증의 연결을 더 잘 드러냅니다.
  revised_text: '이제 이 백성이 유업을 받는지, 아니면 먼저 있었던 백성이 유업을 받는지, 또 언약이 우리에게 속한 것인지 그들에게 속한 것인지 살펴봅시다.


    그러므로 성경이 그 백성에 관하여 무엇이라고 말하는지 들어 보십시오. “이삭은 자기 아내 리브가가 임신하지 못하였으므로 그를 위하여 기도하였습니다. 그러자 리브가가 임신하였습니다. 그 뒤 리브가는 주님께 여쭈러 나갔습니다. 주님께서 리브가에게 말씀하셨습니다. ‘두 민족이 네 태 안에 있고, 두 백성이 네 배 속에 있다. 한 백성이 다른 백성을 이길 것이며, 큰 자가 작은 자를 섬길 것이다.’”[a]


    여러분은 이삭이 누구이며 리브가가 누구인지, 또 하나님께서 어떤 경우에 한 백성이 다른 백성보다 크다는 것을 보여 주셨는지 깨달아야 합니다.


    또 다른 예언에서 야곱은 자기 아들 요셉에게 더 분명히 말합니다. “보아라, 주님께서 내가 네 얼굴을 다시 보지 못하게 하지는 않으셨구나. 네 아들들을 내게 데려오너라. 내가 그들을 축복하겠다.”[b]


    요셉은 므낫세가 맏아들이므로 그가 축복받기를 바라며 에브라임과 므낫세를 데려왔습니다. 그래서 므낫세를 아버지 야곱의 오른손 쪽으로 이끌었습니다. 그러나 야곱은 성령 안에서 훗날 올 백성의 모형을 보았습니다.[c] 그러면 성경은 무엇이라고 말합니까? “야곱은 두 손을 엇갈리게 하여 둘째이며 어린 에브라임의 머리에 오른손을 얹고 그를 축복하였습니다. 요셉이 야곱에게 말하였습니다. ‘아버지의 오른손을 므낫세의 머리로 옮기십시오. 이 아이가 제 맏아들입니다.’ 야곱이 요셉에게 말하였습니다. ‘안다, 내 아들아. 나도 안다. 그러나 큰 자가 작은 자를 섬길 것이다. 그렇지만 이 아이도 복을 받을 것이다.’”[d]


    하나님께서 어떤 이들의 경우를 통해 이 백성이 첫째가 되고 언약의 상속자가 되도록 정하셨는지 잘 살펴보십시오.


    이뿐 아니라 하나님께서 아브라함을 통해서도 그것을 기록하셨다면, 우리의 이해는 온전해집니다. 그러면 아브라함이 홀로 믿었고 그것이 그에게 의로 여겨졌을 때, 하나님께서 그에게 무엇이라고 말씀하십니까?[e] “보아라, 아브라함아, 내가 너를 할례받지 않은 채로 하나님을 믿는 민족들의 아버지로 삼았다.”[f]'
