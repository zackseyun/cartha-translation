base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: ko
  text: '그러면 그 예표가 무엇을 뜻한다고 생각합니까? 이스라엘에게 명령이 내려져, 죄가 가득 찬 사람들이 암송아지 한 마리를 바쳐 잡아 죽이고 불사르게 하였습니다. 그런 다음 아이들이 그 재를 거두어 그릇들에 담고, 진홍색 양털을 나무에 감고—보십시오. 여기에도 다시 십자가와 진홍색 양털의 예표가 있습니다—우슬초도 함께 든 뒤, 사람들을 한 명씩 뿌려 그 죄에서 깨끗해지게 하였습니다.


    이 말씀이 여러분에게 얼마나 분명하게 주어졌는지 깨달으십시오. 송아지는 예수님이십니다. 그것을 바치는 사람들은 죄인들로서, 예수님을 죽임당하도록 내어 준 자들입니다. 그 뒤로는 더 이상 사람들이 바치는 것이 아니며, 죄인들에게는 더 이상 영광이 없습니다.[a]


    뿌리는 아이들은 우리에게 죄의 용서와 마음의 정결을 선포한 이들입니다. 이스라엘의 지파가 열둘이므로, 그 지파들을 증언하도록 열두 명이 된 이들에게 그분은 복음을 맡기시고 그것을 선포할 권한을 주셨습니다.


    그런데 뿌리는 아이들은 왜 세 명입니까? 아브라함과 이삭과 야곱을 증언하기 위해서입니다. 이들은 하나님 앞에서 큰 권세가 있기 때문입니다.[b]


    또 양털을 나무 위에 놓습니다. 이는 예수님의 나라가 십자가 위에 있으며, 그분께 소망을 두는 이들이 영원히 살 것이라는 뜻입니다.[c]


    그러면 양털과 우슬초는 왜 함께 있습니까? 그분의 나라에는 악하고 더러운 날들이 있을 것이며, 우리는 그 날들 가운데 구원을 받을 것이기 때문입니다. 육체로 고통받는 사람은 우슬초의 더러움을 통하여 낫기 때문입니다.[d]


    이제 우리에게는 이런 일들이 이러한 까닭으로 일어났다는 것이 분명하지만, 그들에게는 어두운 일이었습니다. 그들이 주님의 음성을 듣지 않았기 때문입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “그 뒤로는 더 이상 사람들이 바치는 것이 아니며, 죄인들에게는 더 이상 영광이 없습니다”는 공급된 증언에서도 뜻이 불분명한 문장입니다. 제물을 바치는 주체의 변화 또는 죄인들의 역할과 영예의 종결을 가리킬 수 있습니다.
    reason: 난해한 구문을 번역에서 단정적으로 해소하지 않았음을 알립니다.
  - marker: b
    text: 앞 단락은 뿌리는 이들을 열두 명이라고 하고 여기서는 세 명이라고 합니다. 공급된 증언의 이 차이를 그대로 보존했습니다. “큰 권세가 있다”로 옮긴 말도 ‘위대하다’ 또는 ‘강하다’는 뜻일 수 있습니다.
    reason: 수적 불일치와 어휘적 모호성을 독자에게 투명하게 밝힙니다.
  - marker: c
    text: “예수님의 나라가 십자가 위에 있다”는 표현은 “예수님의 왕권이 십자가에서 드러난다”는 뜻으로 이해할 수도 있으나, 본문의 역설적인 표현을 유지했습니다.
    reason: 신학적 해석을 번역문에 고정하지 않기 위함입니다.
  - marker: d
    text: “우슬초의 더러움을 통하여 낫는다”는 표현은 공급된 증언에서 난해합니다. 우슬초의 거칠거나 떫은 성질을 가리킬 가능성이 있지만, 원어 검토 전에는 확정할 수 없습니다.
    reason: 직접적인 그리스어·라틴어 대조가 아직 이루어지지 않은 부분의 불확실성을 표시합니다.
lexical_decisions:
- source_word: type (τύπος, presumed)
  choice: 예표
  rationale: 의식의 세부가 그리스도와 십자가를 미리 가리킨다는 문맥을 살리면서, 일반 독자도 이해할 수 있는 전통적이고 품위 있는 용어를 선택했습니다.
- source_word: heifer / calf
  choice: 암송아지 / 송아지
  rationale: 영어 증언 자체가 처음에는 heifer, 해석 부분에서는 calf로 바뀌므로 이를 평준화하지 않고 그대로 보존했습니다.
- source_word: children
  choice: 아이들
  rationale: 열두 명과 세 명이라는 난해한 수적 언급을 해석하여 사도나 제자로 바꾸지 않고 원문의 표면적 표현을 유지했습니다.
- source_word: tree / wood (presumed ξύλον)
  choice: 나무
  rationale: 십자가를 가리키는 해석은 본문이 직접 제시하므로, 원상징에서는 ‘십자가’로 미리 치환하지 않고 ‘나무’를 유지했습니다.
- source_word: hyssop
  choice: 우슬초
  rationale: 성경 제의 문맥에서 통용되는 식물명이며 정결 의식과의 연관을 보존합니다.
- source_word: foulness
  choice: 더러움
  rationale: 우슬초와 고난의 관계를 설명하는 난해한 문구를 매끄럽게 재해석하지 않고 원증언의 거친 긴장을 보존했습니다.
- source_word: authority over the Gospel
  choice: 복음을 맡기시고 그것을 선포할 권한
  rationale: ‘복음에 대한 권위’처럼 오해될 수 있는 표현을 피하면서, 선포하도록 위임받았다는 문맥을 자연스럽게 드러냈습니다.
theological_decisions:
- issue: 제사의 기독론적 해석
  choice: 저자의 명시적 동일시인 ‘송아지는 예수님’과 십자가 예표를 그대로 제시
  alternative: 민수기 19장의 정결 의식에 관한 별도 해설을 본문에 삽입
  rationale: 번역은 저자의 해석을 보존해야 하며, 후대 교파적 속죄론이나 성례론을 덧붙이지 않아야 합니다.
- issue: ‘예수님의 나라가 십자가 위에 있다’는 표현
  choice: 공간적이고 역설적인 표현을 그대로 보존
  alternative: ‘예수님의 왕권이 십자가를 통해 나타난다’로 해석적 번역
  rationale: 후자의 표현이 자연스럽지만 원증언의 신학적 긴장과 모호성을 해소하므로 채택하지 않았습니다.
- issue: 아브라함·이삭·야곱의 지위
  choice: ‘하나님 앞에서 큰 권세가 있다’
  alternative: ‘하나님께 크게 인정받는다’ 또는 ‘하나님 앞에서 위대하다’
  rationale: mighty before God의 의미가 원어 대조 전에는 불확실하므로, 중보 교리나 단순한 도덕적 위대함 가운데 하나로 확정하지 않았습니다.
- issue: ‘그들’과 ‘우리’의 대조
  choice: 지시 대상을 보충하지 않고 대명사를 유지
  alternative: ‘유대인들에게’ 또는 ‘이스라엘에게’로 명시
  rationale: 공급된 증언에서 지시 대상은 문맥상 추론 가능하지만 명시적이지 않으므로 반유대적 해석을 본문에 추가하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했고, 권면에서는 ‘깨달으십시오’, 수사 의문에서는 ‘생각합니까?’를 써서 품위와 가독성을 함께 확보했습니다. 문장이 지나치게 길어지지 않도록 첫 문단을 나누되 논리 순서는 유지했습니다. 직접적인 그리스어·라틴어 검토가 보류된 자료이므로, 공급된 공공 영역 영어 증언과 감사된 POB 층을 대조해 작성한 잠정 출판 초안입니다.
