review_pass:
  verdict: revise
  source_fidelity: 공급된 영어 증언 및 English POB와 대조할 때, 핵심 논지와 의도적인 난해성(열둘/셋, ‘그 뒤로는’, 십자가 위의 나라, 우슬초의 ‘foulness’)은 대체로 보존되었습니다. 그러나 첫 문단의 ‘우슬초도 함께 든 뒤’는 영어 증언의 나열 구조를 잘못 처리하여 한국어 문장으로 성립하지 않고, 우슬초가 의식 행위에 포함된다는 내용을 불명료하게 만듭니다. 이를 ‘진홍색 양털과 우슬초를 나무에 매달고’로 고쳐, 원문의 압축적 나열과 불확실성은 유지하면서 문법적 결함을 해소해야 합니다. ‘사람들을 한 명씩 뿌려’도 목적격 표현상 부자연스러우므로 ‘백성 한 사람 한 사람에게 뿌려’로 바로잡았습니다.
  naturalness: 합쇼체의 전반적 격식은 적절합니다. 다만 첫 문단의 서술 시제와 주어가 혼재되어 명령의 내용을 서술하는 문장으로 읽기 어렵고, ‘사람들을 한 명씩 뿌려’는 현대 한국어에서 어색합니다. 수정문은 명령의 내용을 ‘~하라는’ 구조로 통일하고, 정결 예식의 뿌림을 자연스러운 조사와 어순으로 표현합니다.
  terminology: ‘예표’, ‘암송아지/송아지’, ‘우슬초’, ‘복음’, ‘정결’, ‘십자가’는 문맥과 한국어 기독교 문헌 관습에 적절합니다. ‘아이들’은 원문의 표면 표현을 보존하므로 유지할 수 있습니다. 난해한 ‘foulness’는 ‘더러움’으로 보존하고 각주로 불확실성을 밝히는 현 방식이 안전합니다.
  issues:
  - severity: high
    issue: 첫 문단의 ‘우슬초도 함께 든 뒤’
    rationale: ‘들다’의 주체·목적어·연결 관계가 성립하지 않아 한국어 문장으로 이해되기 어렵습니다. 영어 증언이 압축적으로 열거한 진홍색 양털과 우슬초를 의식 행위의 대상으로 명료하게 옮겨야 합니다.
  - severity: medium
    issue: ‘사람들을 한 명씩 뿌려’
    rationale: 한국어에서 액체나 재를 사람 ‘에게’ 뿌리는 것이 자연스럽습니다. 원문의 one by one도 ‘한 사람 한 사람에게’로 보존하는 편이 정확합니다.
  - severity: low
    issue: 첫 문단의 명령 서술 시제 혼재
    rationale: ‘명령이 내려져’ 뒤에 ‘불사르게 하였습니다’가 오면 누가 무엇을 했는지 불분명합니다. ‘~하라는 명령이 주어졌습니다’로 통일하면 의미를 바꾸지 않고 명확해집니다.
  revised_text: '그러면 그 예표가 무엇을 뜻한다고 생각합니까? 이스라엘에게는 죄가 가득 찬 사람들이 암송아지 한 마리를 바쳐 잡아 죽이고 불사르며, 그 뒤에 아이들이 그 재를 거두어 그릇들에 담고 진홍색 양털과 우슬초를 나무에 매달며—보십시오. 여기에도 다시 십자가와 진홍색 양털의 예표가 있습니다—이 일이 이루어진 뒤 아이들이 백성 한 사람 한 사람에게 뿌려, 그들이 죄에서 깨끗해지게 하라는 명령이 주어졌습니다.


    이 말씀이 여러분에게 얼마나 분명하게 주어졌는지 깨달으십시오. 송아지는 예수님이십니다. 그것을 바치는 사람들은 죄인들로서, 예수님을 죽임당하도록 내어 준 자들입니다. 그 뒤로는 더 이상 사람들이 바치는 것이 아니며, 죄인들에게는 더 이상 영광이 없습니다.[a]


    뿌리는 아이들은 우리에게 죄의 용서와 마음의 정결을 선포한 이들입니다. 이스라엘의 지파가 열둘이므로, 그 지파들을 증언하도록 열두 명이 된 이들에게 그분은 복음을 맡기시고 그것을 선포할 권한을 주셨습니다.


    그런데 뿌리는 아이들은 왜 세 명입니까? 아브라함과 이삭과 야곱을 증언하기 위해서입니다. 이들은 하나님 앞에서 큰 권세가 있기 때문입니다.[b]


    또 양털을 나무 위에 놓습니다. 이는 예수님의 나라가 십자가 위에 있으며, 그분께 소망을 두는 이들이 영원히 살 것이라는 뜻입니다.[c]


    그러면 양털과 우슬초는 왜 함께 있습니까? 그분의 나라에는 악하고 더러운 날들이 있을 것이며, 우리는 그 날들 가운데 구원을 받을 것이기 때문입니다. 육체로 고통받는 사람은 우슬초의 더러움을 통하여 낫기 때문입니다.[d]


    이제 우리에게는 이런 일들이 이러한 까닭으로 일어났다는 것이 분명하지만, 그들에게는 어두운 일이었습니다. 그들이 주님의 음성을 듣지 않았기 때문입니다.'
