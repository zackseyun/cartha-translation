  yaml_path: translation/extra_canonical/epistle_of_barnabas/011.yaml
  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: ko
  text: '11


    그러면 주님께서 물과 십자가에 관하여 미리 나타내 보이셨는지 살펴봅시다. 먼저 물에 관해서는, 이스라엘이 죄를 용서받게 하는 세례를 받아들이지 않고 도리어 자기들을 위하여 만들 것이라고 기록되어 있습니다.[a]


    예언자는 이렇게 말합니다. “하늘아, 놀라라. 땅은 이 일로 더욱 몸서리쳐라. 이 백성이 두 가지 악을 저질렀다. 생명의 샘인 나를 버리고, 자기들을 위하여 죽음의 구덩이를 팠다.


    내 거룩한 산 시나이가 메마른 바위냐? 너희는 둥지를 빼앗겨 높은 곳에서 퍼덕이는 어린 새들과 같이 될 것이다.”[b]


    또 예언자는 이렇게 말합니다. “내가 네 앞에 가서 산들을 평평하게 하고, 놋문들을 부수며, 쇠빗장들을 산산이 깨뜨리겠다. 내가 네게 어둠 속에 감추어져 보이지 않는 보물들을 주어, 그들이 내가 주 하나님임을 알게 하겠다.”[c]


    또 이렇게 말합니다. “너는 견고한 바위의 높은 동굴에 살 것이다.” 그리고 “그의 물은 끊이지 않을 것이다. 너희는 영광 가운데 계신 왕을 볼 것이며, 너희 영혼은 주님을 경외하는 일을 깊이 생각할 것이다.”[d]


    또 다른 예언서에서는 이렇게 말씀하십니다. “이런 일들을 행하는 사람은 갈라져 흐르는 물줄기 곁에 심긴 나무와 같아서, 제철에 열매를 맺고 그 잎이 떨어지지 않으며, 그가 하는 모든 일이 잘될 것이다.


    경건하지 않은 자들은 그렇지 않다. 결코 그렇지 않다. 그들은 바람이 땅 위에서 흩어 버리는 티끌과 같다. 그러므로 경건하지 않은 자들은 심판 때에 서지 못하고, 죄인들은 의인들의 모임에 들지 못할 것이다. 주님께서는 의인들의 길을 아시지만, 경건하지 않은 자들의 길은 멸망할 것이다.”[e]


    여러분은 그분께서 물과 십자가를 동시에 가리켜 보이셨음을 깨달을 것입니다. 그 뜻은 이렇습니다. 십자가에 소망을 두고 물속으로 내려가는 사람들은 복이 있습니다. 그분께서 “제철에” 받을 보상을 말씀하시기 때문입니다. 그때에 “내가 갚겠다”라고 말씀하십니다. 그러면 지금에 관해서는 무엇이라고 말씀하십니까? “그 잎이 떨어지지 않을 것이다”라고 하십니다. 이는 여러분의 입에서 믿음과 사랑으로 나오는 모든 말이 많은 사람을 회개와 소망으로 이끌 것이라는 뜻입니다.


    또 다른 예언자는 이렇게 말합니다. “야곱의 땅이 온 땅보다 더 칭송을 받았다.”[f] 그 뜻은 이렇습니다. 그분께서 자기 영의 그릇을 영광스럽게 하십니다.


    그다음에는 무엇이라고 말씀하십니까? “오른쪽에서 강물이 흘러나왔고, 그 강에서 아름다운 나무들이 자라났다. 그것들을 먹는 사람은 누구나 영원히 살 것이다.”[g]


    이렇게 말씀하신 까닭은 우리가 죄와 더러움을 짊어진 채 물속으로 내려갔다가, 마음에 열매를 맺고 영 안에서 예수께 우리의 경외와 소망을 두며 물에서 올라오기 때문입니다. “그것들을 먹는 사람은 누구나 영원히 살 것이다.” 그 뜻은 이렇습니다. “누구든지 이 말씀을 듣고 믿는 사람은 영원히 살 것이다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “자기들을 위하여 만들 것”에서 문장이 갑자기 끝납니다. 현존하는 증언의 불완전한 표현을 보충하지 않고 그대로 두었습니다.
    reason: 본문의 결락 또는 미완성 구문을 독자에게 알리고 추측성 보충을 피하기 위해서입니다.
  - marker: b
    text: 예레미야 2:12–13, 3:19의 표현을 결합하거나 변형하여 인용한 것으로 보입니다. ‘시나이’와 어린 새의 비유는 알려진 구약 본문과 정확히 일치하지 않습니다.
    reason: 인용문의 복합적이고 불안정한 본문 형태를 투명하게 밝히기 위해서입니다.
  - marker: c
    text: 이사야 45:2–3을 자유롭게 인용한 대목입니다.
    reason: 성경 인용의 배경을 제시하기 위해서입니다.
  - marker: d
    text: 이사야 33:16–18을 연이어 인용하거나 변형한 대목입니다.
    reason: 서로 이어진 두 인용문의 출전을 식별하도록 돕기 위해서입니다.
  - marker: e
    text: 시편 1:3–6을 인용한 대목입니다. ‘갈라져 흐르는 물줄기’는 여러 물길 또는 수로를 뜻할 수 있습니다.
    reason: 인용 출전과 표현상의 가능 범위를 제시하기 위해서입니다.
  - marker: f
    text: 이 문구의 정확한 성경 출전과 형태는 불확실합니다.
    reason: 확정하기 어려운 인용을 특정 본문으로 단정하지 않기 위해서입니다.
  - marker: g
    text: 에스겔 47:1–12의 성전 오른쪽에서 흐르는 물과 생명 나무의 환상을 자유롭게 요약한 것으로 보입니다. 이 증언은 나무들을 가리킨 뒤 ‘그것들을 먹는 사람’이라고 표현하므로, ‘열매’라는 말을 보충하지 않았습니다.
    reason: 저자가 세례와 영원한 생명에 연결해 해석하는 성경적 배경을 밝히고, 증언의 비정상적 표현을 추측으로 평이화하지 않기 위해서입니다.
lexical_decisions:
- source_word: τὸ ὕδωρ / water
  choice: 물
  rationale: 세례를 가리키는 저자의 상징적 해석을 보존하면서도 본문이 사용하는 구체적 표상을 그대로 유지했습니다.
- source_word: τὸν σταυρόν / the cross
  choice: 십자가
  rationale: 저자가 물과 함께 병치하는 중심 표상을 직접적으로 옮겼습니다.
- source_word: βάπτισμα / baptism
  choice: 세례
  rationale: 죄 용서와 연결된 초기 그리스도교의 의례를 가리키므로 표준적인 한국어 용어를 사용했습니다.
- source_word: μετάνοια / conversion
  choice: 회개
  rationale: 단순한 소속 변경보다 마음과 삶의 돌이킴이라는 종교적 의미를 전달합니다.
- source_word: σκεῦος τοῦ πνεύματος / vessel of the Spirit
  choice: 영의 그릇
  rationale: 은유를 풀어 설명하지 않고 보존하여 그 대상이 개인인지 공동체인지에 관한 여지를 남겼습니다.
- source_word: φόβος / fear
  choice: 경외
  rationale: 하나님 또는 주님을 향한 태도의 문맥에서는 단순한 공포보다 공경을 포함한 두려움을 자연스럽게 나타냅니다.
theological_decisions:
- issue: 물과 세례의 관계
  choice: 저자의 해석에 따라 물을 세례와 긴밀히 연결하되 둘을 모든 문장에서 동일시하지 않았습니다.
  alternative: 모든 ‘물’을 직접 ‘세례’로 바꾸어 번역할 수 있습니다.
  rationale: 인용문 자체의 물 표상과 저자의 기독교적 해석을 구별하여 원문의 논증 구조를 보존했습니다.
- issue: 십자가에 소망을 둔다는 표현
  choice: ‘십자가에 소망을 두고’를 그대로 유지했습니다.
  alternative: ‘십자가에 달리신 분을 의지하고’처럼 해설적으로 옮길 수 있습니다.
  rationale: 원문의 과감한 환유와 신학적 긴장을 번역자가 해소하지 않도록 했습니다.
- issue: ‘영의 그릇’의 지시 대상
  choice: 대상을 특정하지 않고 ‘자기 영의 그릇’으로 번역했습니다.
  alternative: 교회, 신자, 육체 가운데 하나로 명시할 수 있습니다.
  rationale: 현존 문맥만으로 지시 대상을 확정하기 어려우므로 진정한 모호성을 보존했습니다.
- issue: 세례와 죄 용서
  choice: ‘죄를 용서받게 하는 세례’로 옮겼습니다.
  alternative: ‘죄 용서를 상징하는 세례’ 또는 ‘죄 용서를 위한 세례’로 옮길 수 있습니다.
  rationale: 증언 본문의 인과적 표현을 약화하거나 특정 교파의 성례론으로 재규정하지 않았습니다.
- issue: 예수께 경외와 소망을 둠
  choice: ‘예수께 우리의 경외와 소망을 두며’로 번역했습니다.
  alternative: ‘예수 안에서 경외와 소망을 품으며’로 옮길 수 있습니다.
  rationale: 증언의 구문을 자연스럽게 전달하되 경외의 정확한 대상이나 관계를 과도하게 체계화하지 않았습니다.
translation_notes:
  register: 현대 표준어의 격식 있는 합쇼체를 사용했습니다. 논설 부분은 명료하고 자연스럽게, 예언서 인용은 장중하되 지나치게 고어적이지 않게 처리했습니다. 제공 자료가 공공 영역 영어 증언에 기초하고 직접적인 그리스어·라틴어 대조가 미완료된 상태이므로, 결락과 불확실한 인용은 각주로 명시하고 추측하여 메우지 않았습니다.
