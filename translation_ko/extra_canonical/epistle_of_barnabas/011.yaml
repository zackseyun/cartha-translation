    내 거룩한 산 시나이가 메마른 바위냐? 너희는 둥지를 빼앗겨 높은 곳에서 퍼덕이는 어린 새들과 같이 될 것이다.”[b]


    또 예언자는 이렇게 말합니다. “내가 네 앞에 가서 산들을 평평하게 하고, 놋문들을 부수며, 쇠빗장들을 산산이 깨뜨리겠다. 내가 네게 어둠 속에 감추어져 보이지 않는 보물들을 주어, 그들이 내가 주 하나님임을 알게 하겠다.”[c]


    또 이렇게 말합니다. “너는 견고한 바위의 높은 동굴에 살 것이다.” 그리고 “그의 물은 끊이지 않을 것이다. 너희는 영광 가운데 계신 왕을 볼 것이며, 너희 영혼은 주님을 경외하는 일을 깊이 생각할 것이다.”[d]


    또 다른 예언서에서는 이렇게 말씀하십니다. “이런 일들을 행하는 사람은 갈라져 흐르는 물줄기 곁에 심긴 나무와 같아서, 제철에 열매를 맺고 그 잎이 떨어지지 않으며, 그가 하는 모든 일이 잘될 것이다.


    경건하지 않은 자들은 그렇지 않다. 결코 그렇지 않다. 그들은 바람이 땅 위에서 흩어 버리는 티끌과 같다. 그러므로 경건하지 않은 자들은 심판 때에 서지 못하고, 죄인들은 의인들의 모임에 들지 못할 것이다. 주님께서는 의인들의 길을 아시지만, 경건하지 않은 자들의 길은 멸망할 것이다.”[e]


    여러분은 그분께서 물과 십자가를 동시에 가리켜 보이셨음을 깨달을 것입니다. 그 뜻은 이렇습니다. 십자가에 소망을 두고 물속으로 내려가는 사람들은 복이 있습니다. 그분께서 “제철에” 받을 보상을 말씀하시기 때문입니다. 그때에 “내가 갚겠다”라고 말씀하십니다. 그러면 지금에 관해서는 무엇이라고 말씀하십니까? “그 잎이 떨어지지 않을 것이다”라고 하십니다. 이는 여러분의 입에서 믿음과 사랑으로 나오는 모든 말이 많은 사람을 회개와 소망으로 이끌 것이라는 뜻입니다.


    또 다른 예언자는 이렇게 말합니다. “야곱의 땅이 온 땅보다 더 칭송을 받았다.”[f] 그 뜻은 이렇습니다. 그분께서 자기 영의 그릇을 영광스럽게 하십니다.


    그다음에는 무엇이라고 말씀하십니까? “오른쪽에서 강물이 흘러나왔고, 그 강에서 아름다운 나무들이 자라났다. 그 열매를 먹는 사람은 누구나 영원히 살 것이다.”[g]


    이렇게 말씀하신 까닭은 우리가 죄와 더러움을 짊어진 채 물속으로 내려갔다가, 마음에 열매를 맺고 영 안에서 예수께 우리의 경외와 소망을 두며 물에서 올라오기 때문입니다. “그 열매를 먹는 사람은 누구나 영원히 살 것이다.” 그 뜻은 이렇습니다. “누구든지 이 말씀을 듣고 믿는 사람은 영원히 살 것이다.”'
