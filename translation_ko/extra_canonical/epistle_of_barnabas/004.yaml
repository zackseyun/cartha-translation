  revised_text: '그러므로 우리는 현재의 일들을 깊이 살피고, 우리를 구원할 힘이 있는 것들을 찾아내야 합니다. 불법의 행위들이 우리를 압도하지 못하도록 모든 불법의 행위에서 완전히 달아납시다. 다가올 것을 위하여 사랑받도록 현 시대의 미혹을 미워합시다.


    우리 영혼이 죄인들과 악한 사람들을 사귈 자유를 누리도록 내버려 두지 맙시다. 혹시라도 우리가 그들과 같아지지 않도록 하기 위해서입니다.


    마지막 걸림돌이 가까이 왔습니다. 성경이 이것을 두고 말하며, 에녹도 말한 바와 같습니다.[a] 주인께서 때와 날을 짧게 하신 것은 바로 이 때문입니다. 곧 그분의 사랑받는 이가 서둘러 그분의 유업에 이르게 하시려는 것입니다.


    또한 예언자는 이렇게 말합니다. “열 왕국이 땅 위에서 다스릴 것이며, 그 뒤에 다른 왕 하나가 일어나 세 왕을 하나 아래로 낮출 것입니다.”[b]


    다니엘도 같은 일을 두고 이와 같이 말합니다. “나는 넷째 짐승을 보았습니다. 그것은 사악하고 강하며 땅의 모든 짐승보다 더 다루기 어려웠습니다. 그 짐승에게서 뿔 열 개가 돋아났고, 그 가운데서 작은 뿔 하나, 곧 돌출된 것이 돋아났습니다. 그리고 그것이 큰 뿔 셋을 하나 아래로 낮추는 것을 보았습니다.”[b]


    그러므로 여러분은 깨달아야 합니다. 나는 여러분 가운데 한 사람이며 여러분 각 사람을 내 목숨보다 더 사랑하는 사람으로서, 이 한 가지를 더 부탁합니다. 지금 여러분 자신을 잘 살피십시오. 죄 위에 죄를 쌓으면서도 “우리의 언약은 그들에게도 여전히 속해 있다”라고 말하는 어떤 사람들과 같아지지 마십시오.


    언약은 우리의 것입니다. 그러나 그들은 모세가 언약을 막 받은 뒤에 이런 방식으로 그것을 영원히 잃었습니다. 성경은 이렇게 말합니다. “모세는 산에서 사십 일 밤낮을 금식했고, 주님에게서 언약, 곧 주님의 손의 손가락으로 쓰인 돌판들을 받았습니다.”


    그러나 그들은 우상들에게 돌아섬으로써 언약을 잃었습니다. 주님께서 이렇게 말씀하시기 때문입니다. “모세야, 모세야, 빨리 내려가거라. 네가 이집트 땅에서 이끌어 낸 네 백성이 불법을 저질렀다.” 모세는 알아차리고 두 돌판을 손에서 내던졌습니다. 그리하여 그들의 언약은 산산이 깨졌고, 사랑받는 예수의 언약은 그분을 믿는 데서 솟아나는 소망 안에서 우리 마음에 인쳐지게 되었습니다.[c]


    나는 많은 것을 기꺼이 쓰고 싶었습니다. 교사로서가 아니라, 여러분을 사랑하는 사람으로서 여러분이 우리가 가진 것에 미치지 못하지 않게 하려는 것이었습니다. 여러분의 헌신한 종으로서 여러분에게 쓰고 싶었습니다. 그러므로 이 마지막 날들에 주의합시다. 지금 이 불법의 때와 앞으로 닥칠 걸림돌들 가운데서 하나님의 자녀답게 맞서지 않는다면, 우리가 믿음 안에서 보낸 모든 시간은 아무 유익도 주지 못할 것입니다. 검은 자가 들어올 틈을 얻지 못하게 하려는 것입니다.[d]


    모든 헛된 것에서 달아납시다. 악한 길의 행위들을 철저히 미워합시다. 이미 의롭다 하심을 받은 사람들인 양 은밀히 들어가 따로 떨어져 있지 말고, 함께 모여 모두에게 유익한 것이 무엇인지 의논하십시오.


    성경은 이렇게 말합니다. “스스로 지혜롭다 여기며 자기 눈에 총명하다고 여기는 자들에게 화가 있습니다.” 영적인 사람이 됩시다. 하나님께 온전한 성전이 됩시다. 우리 힘이 닿는 데까지 하나님을 경외하는 일에 힘쓰고, [또] 그분의 계명을 지키려고 힘씁시다.[e] 그리하여 그분의 규례 안에서 기뻐합시다.


    주님께서는 사람을 차별하지 않고 세상을 심판하십니다. 각 사람은 자기 행위에 따라 받을 것입니다. 선한 사람이라면 그의 의가 길에서 그보다 앞서 갈 것이고, 악한 사람이라면 그가 행한 악에 대한 보응이 그의 앞에 놓일 것입니다. 그렇지 않으면, 부르심 받은 사람들이라고 해서 우리가 마음을 놓는다면 죄 가운데 잠들어 버리고, 혹시라도 악의 통치자가 우리를 대적할 권세를 얻어 주님의 나라 밖으로 내던질 수 있습니다.


    형제 여러분, 이것도 깨달으십시오. 이스라엘 가운데 그토록 많은 표징과 놀라운 일들이 이루어진 뒤에도 그들이 버림받은 것을 여러분은 봅니다. 그러므로 우리도 잘 살펴서, 혹시라도 성경이 말하는 “부름받은 사람은 많지만 선택받은 사람은 적다”라는 말씀에 해당하는 자들로 드러나지 않도록 합시다.'
