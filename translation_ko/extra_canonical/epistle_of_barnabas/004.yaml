  source_fidelity: 전반적으로 제공된 영어 증언의 논증 흐름과 논쟁적·종말론적 어조를 충실히 옮겼습니다. 그러나 ‘under one’을 ‘한꺼번에’로 해석한 부분은 증언의 의도적으로 불투명한 표현을 구체화하며, ‘devoted slave’와 마지막 경고문의 조건·결과 관계도 더 직접적으로 옮길 필요가 있습니다. ‘사랑받는 예수’는 소유격 존칭으로 바꾸지 않고 원문의 수식 관계를 보존하는 편이 안전합니다.
