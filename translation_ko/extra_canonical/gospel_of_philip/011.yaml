translation:
  language: ko
  text: '하나님은 염색하는 분이십니다. 좋은 염료는 ‘참된 것’이라고 불리는데, 그것으로 물들인 것과 함께 죽습니다. 하나님께 물든 사람들도 이와 같습니다. 하나님의 염료는 죽지 않으므로, 그들은 그분의 빛깔로 말미암아 죽지 않게 됩니다. 그러나 하나님은 물로 세례를 베푸십니다.


    누구든 참으로 존재하는 것들을 보려면 그것들과 같아져야 합니다. 세상에 있는 사람이 태양을 보면서도 태양이 되지 않고, 하늘과 땅과 그 밖의 모든 것을 보면서도 그것들이 되지 않는 것과는 다릅니다. 그러나 여러분은 그곳에 있는 어떤 것을 보았고, 그것들이 되었습니다. 여러분은 영을 보고 영이 되었으며, 그리스도를 보고 그리스도가 되었고, [아버지를 보고 아버지가] 될 것입니다. 그러므로 [여기에서는] 모든 것을 보면서도 [자기 자신은 보지 못하지만], [그곳에서는] 자기 자신을 봅니다. 여러분이 보는 것이 [될] 것이기 때문입니다.


    믿음은 받고 사랑은 줍니다. 믿음 없이는 [아무도] [받을 수 없고], 사랑 없이는 아무도 줄 수 없습니다. 그러므로 우리는 받기 위하여 믿고, 사랑하기 위하여 줍니다. 사랑으로 주지 않는 사람은 그 일에서 아무것도 얻지 못하기 때문입니다. 주님을 받지 못한 사람은 여전히 히브리인입니다.


    우리보다 앞선 사도들은 그분을 “예수 나사렛 사람 메시아”, 곧 “예수 나사렛 사람 그리스도”라고 불렀습니다. 마지막 이름은 “그리스도”이고, 첫 이름은 “예수”이며, 가운데 이름은 “나사렛 사람”입니다. “메시아”에는 “그리스도”와 “측량된 이”라는 두 뜻이 있습니다.[a] 히브리어로 “예수”는 “구속”이고, “나자라”는 “진리”입니다. 그러므로 “나사렛 사람”은 “진리”입니다. “그리스도”는 측량된 이이고, “나사렛 사람”과 “예수”는 측량된 이들입니다.[b]


    진주는 진흙 속에 던져져도 가치가 줄지 않고, 향유를 발라도 가치가 더 커지지 않습니다. 언제나 그 주인에게 귀합니다. 하나님의 자녀들도 이와 같습니다. 어디에 있든 그들은 여전히 아버지께 귀합니다.


    여러분이 “나는 유대인입니다”라고 해도 아무도 동요하지 않을 것입니다. “나는 로마인입니다”라고 해도 아무도 불안해하지 않을 것입니다. “나는 그리스인입니다”, “야만인입니다”, “종입니다”, [“자유인입니다”]라고 해도 아무도 근심하지 않을 것입니다. [그러나] 여러분이 “나는 그리스도인입니다”라고 [하면], […]가 떨 것입니다. 이런 부류의 […이기만] 한다면, 이 사람은 [그의 이름을 듣는 것을 …] 견디지 못할 것입니다.


    하나님은 사람을 먹는 분이십니다. 그러므로 사람이 그분께 [제물로 바쳐집니다]. 사람이 제물로 바쳐지기 전에는 짐승들이 제물로 바쳐졌습니다. 그것들을 제물로 받던 자들은 신들이 아니었기 때문입니다.[c]


    유리그릇과 질그릇은 불을 거쳐 생겨납니다. 그러나 유리그릇은 깨져도 다시 만들어집니다. 숨결을 거쳐 생겨났기 때문입니다. 반면에 질그릇은 깨지면 버려집니다. 숨결 없이 생겨났기 때문입니다.


    맷돌을 돌리던 나귀가 백 마일을 갔습니다. 그러나 풀려났을 때에도 여전히 같은 자리에 있었습니다. 많은 사람이 길을 가지만 아무 데도 이르지 못합니다. 저녁이 되었을 때 그들은 도시도 마을도, 만들어진 것이나 자연적인 것도, 권능도 천사도 보지 못했습니다. 가련한 이들은 헛되이 수고했습니다.


    성찬은 예수이십니다. 시리아어로 그분을 “파리사타”, 곧 “펼쳐진 이”라고 부르기 때문입니다. 예수께서 세상을 십자가에 못 박으러 오셨기 때문입니다.[d]


    주님께서 레위의 염색 작업장으로 들어가셨습니다. 일흔두 가지 빛깔을 가져다가 염색 통에 던져 넣으시고, 그 모든 것을 희게 꺼내셨습니다. 그리고 말씀하셨습니다. “사람의 아들이 이와 같이 염색하는 이로 [왔습니다].”


    “아이를 낳지 못하는 여인”이라 불리는 지혜는 [천사들의] 어머니이며, [… 마리아] 막달레나의 [짝]입니다.[e] [… 그분은 그녀를] 제자들보다 더 사랑하셨고, 여러 번 그녀의 […]에 입 맞추셨습니다. 나머지 […] […] 그들이 그분께 말했습니다. “어찌하여 우리 모두보다 그녀를 더 사랑하십니까?” 구주께서 그들에게 대답하셨습니다. “어찌하여 내가 그녀처럼 여러분을 사랑하지 않겠습니까? 보지 못하는 사람과 보는 사람이 둘 다 어둠 속에 있을 때에는 서로 다를 것이 없습니다. 빛이 오면 보는 사람은 빛을 볼 것이나, 보지 못하는 사람은 어둠 속에 남을 것입니다.”


    주님께서 말씀하셨습니다. “존재하기 전에 존재하는 사람은 복이 있습니다. 존재하는 사람은 전에도 존재했고 앞으로도 존재할 것이기 때문입니다.”


    인간의 뛰어남은 드러난 데 있지 않고 감추어진 데 있습니다. 그러므로 인간은 자신보다 강한 짐승들, 드러난 면과 감추어진 면에서 자신보다 더 큰 짐승들을 다스립니다. 이로써 짐승들은 살아남습니다. 그러나 인간에게서 떨어져 나가면, 짐승들은 먹이를 찾지 못하여 서로 죽이고 물어뜯고 잡아먹습니다. 그러나 이제는 인간이 땅을 일했기 때문에 먹이를 찾았습니다.


    누군가 물속으로 내려갔다가 아무것도 받지 못한 채 올라와서 “나는 그리스도인입니다”라고 말한다면, 그는 그 이름을 이자를 물고 빌린 것입니다. 그러나 성령을 받는다면, 그는 그 이름을 선물로 받은 것입니다. 선물을 받은 사람에게서는 그것을 도로 빼앗지 않지만, 이자를 물고 빌린 사람은 돌려주어야 합니다. 누군가 신비 안에서 생겨날 때도 이와 같습니다.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘메시아’, ‘그리스도’, ‘측량된 이’를 연결하는 설명은 고대의 언어유희를 반영하지만, 일반적인 히브리어·그리스어 어원 설명과는 일치하지 않습니다.
    reason: 독자가 본문의 어원 풀이를 현대 언어학적 사실로 오해하지 않도록 하기 위함입니다.
  - marker: b
    text: 이 문단의 이름 풀이와 단수·복수 표현은 난해합니다. 번역은 제공된 증언 본문의 형태를 보존했습니다.
