translation:
  language: ko
  text: '[혼인]의 신비는 위대합니다. [그것이 없다면] 세상이 [존재하지 않을] 것이기 때문입니다. 곧 [세상의] 구조는 […] 때문이지만, [… 혼인]의 구조는 그렇지 않습니다. [친밀한 관계가 …] 더럽혀진 것을 생각해 보십시오. 그것에는 […] 힘이 있기 때문입니다. 그것의 형상은 [더럽힘] 가운데 존재합니다.[a][b]


    더러운 영들은 남성과 여성의 [형태]를 취합니다. 남성 영들은 여성의 형태로 거하는 영혼들과 친밀한 관계를 맺는 자들이고, 여성 영들은 불순종을 통하여 남성의 형태로 거하는 이들과 뒤섞이는 자들입니다. 신방의 형상을 따라 남성의 능력과 여성의 능력, 곧 신랑과 신부를 받지 않고서는 아무도 그들에게 붙들리는 데서 벗어날 수 없습니다. 어리석은 여성 영들은 홀로 앉아 있는 남자를 보면 그에게 달려들어 희롱하고 더럽힙니다. 이와 마찬가지로, 어리석은 남성 영들은 홀로 앉아 있는 아름다운 여자를 보면 그 여자를 유혹하고 강압하여 더럽히려 합니다. 그러나 남편과 아내가 함께 앉아 있는 것을 보면, 여성 영들은 남편 안으로 들어갈 수 없고 남성 영들은 아내 안으로 들어갈 수 없습니다. 형상이 천사와 하나가 될 때도 이와 같습니다. 아무도 감히 [남자]나 여자 안으로 들어갈 수 없을 것입니다.


    [a] 이 번역은 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역이며, 콥트어 원문에 대한 직접 검토가 아직 필요합니다.

    [b] 대괄호는 손상된 사본에서 복원되었거나 불확실한 말을, 줄임표는 본문이 소실된 부분을 나타냅니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역이며, 콥트어 원문에 대한 직접 검토가 아직 필요합니다.
    reason: 직접적인 원어 검토가 보류 중이라는 자료상의 한계를 독자에게 투명하게 밝힙니다.
  - marker: b
    text: 대괄호는 손상된 사본에서 복원되었거나 불확실한 말을, 줄임표는 본문이 소실된 부분을 나타냅니다.
    reason: 사본 손상과 편집상 복원 표지를 독자가 정확히 이해하도록 합니다.
lexical_decisions:
- source_word: mystery of marriage
  choice: 혼인의 신비
  rationale: ‘mystery’를 종교적·상징적 깊이를 지닌 ‘신비’로, ‘marriage’를 문맥의 격조에 맞는 ‘혼인’으로 옮겼습니다.
- source_word: structure
  choice: 구조
  rationale: 손상된 문장 안에서 원문의 추상적이고 모호한 표현을 해석으로 좁히지 않도록 직역에 가까운 말을 유지했습니다.
- source_word: impure spirits
  choice: 더러운 영들
  rationale: 윤리적·의례적 불결함 사이의 가능성을 닫지 않으면서 평이한 한국어를 사용했습니다.
- source_word: intimate / mingle
  choice: 친밀한 관계를 맺다 / 뒤섞이다
  rationale: 두 표현의 차이를 보존하고, 성적 함의를 지나치게 노골적으로 확정하지 않았습니다.
- source_word: male power and a female one
  choice: 남성의 능력과 여성의 능력
  rationale: ‘power’를 인격이나 성별 자체로 바꾸지 않고 능력으로 옮겨 본문의 상징적 긴장을 보존했습니다.
- source_word: bridal chamber
  choice: 신방
  rationale: 고대의 혼인방을 가리키면서 이 문헌에서 지닐 수 있는 의례적·상징적 의미를 해설 없이 보존하는 용어입니다.
- source_word: image
  choice: 형상
  rationale: 단순한 시각적 그림보다 원형과 대응하는 상징적 형상이라는 폭넓은 뜻을 담았습니다.
- source_word: angel
  choice: 천사
  rationale: 제공된 증언의 단수 표현을 그대로 유지하여 정체나 기능을 추가로 규정하지 않았습니다.
theological_decisions:
- issue: 신랑과 신부 및 신방의 의미
  choice: 상징을 해설하지 않고 본문 그대로 유지함
  alternative: 특정 성례, 영적 결합, 또는 인간 내면의 양성적 통합으로 명시함
  rationale: 본문 자체가 의미를 단일하게 규정하지 않으므로 특정 교파나 해석 전통의 견해를 끌어들이지 않았습니다.
- issue: ‘형상이 천사와 하나가 됨’의 주체와 성격
  choice: 문법적 모호성을 유지함
  alternative: 영혼이 수호천사나 천상 짝과 결합한다고 풀어 씀
  rationale: 제공된 증언만으로는 ‘형상’과 ‘천사’의 정확한 지시 대상을 확정할 수 없습니다.
- issue: 남성·여성 형태와 영들의 관계
  choice: 영들의 남성·여성 형태와 인간 남녀를 문맥상 구분하되 존재론을 설명하지 않음
  alternative: 악령의 성별 또는 인간 영혼의 본질에 관한 교리로 체계화함
  rationale: 본문의 서술적 구별만 보존하고 그 이상의 교리적 결론은 피했습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 손상된 첫 단락은 대괄호와 줄임표를 그대로 보존하고, 문맥을 매끄럽게 만들기 위한 추정 보충을 최소화했습니다. 성적 위협을 묘사하는 대목은 의미를 약화하지 않되 선정적이지 않은 표현으로 옮겼습니다.
