  naturalness: 현대 표준 한국어 합쇼체는 전반적으로 안정적입니다. 그러나 ‘사람들만 필요한 것이 아니라’는 문법적으로 어색하고 의미 관계가 불명확하며, 일부 결락 구간은 한국어 문장으로 매끈하게 만들기 위해 원문보다 많은 내용을 보충했습니다. 결락부에서는 자연스러움보다 단편성과 불확실성 보존을 우선하도록 다듬었습니다.
  terminology: ‘세상’, ‘권세들’, ‘중간’, ‘안식’, ‘성유’, ‘신방’, ‘충만’은 적절합니다. ‘모형과 형상’도 영어 증언본의 types and images를 구별해 옮기는 안전한 선택입니다. ‘혼과 영’ 및 ‘성유’의 사용도 문헌의 특수한 의례·우주론 언어를 특정 교파의 교리로 한정하지 않습니다.
  issues:
