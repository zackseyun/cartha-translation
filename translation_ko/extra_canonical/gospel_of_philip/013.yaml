    rationale: 영어 증언본의 불명확한 수동 표현을 보존하되, 한국어에서는 ‘…이들에게만 필요한 것이 아닙니다’로 해야 최소한의 문법적 완결성을 확보할 수 있습니다. 뒤의 ‘그분들’은 지시 대상의 불확실성을 유지합니다.
