  revised_text: "세상에서 나온 사람은 누구든지 더는 결박당할 수 없습니다. 그들이 세상 안에 있었기 때문입니다. 그들은 욕망과 [… 그리고] 두려움보다 위에 있는 것으로 드러납니다. 그들은 […]을 다스리며, 시기보다 뛰어납니다. 만일 […] 오면, 그것들 곧 권세들이 [그들을] 결박하고 숨 막히게 합니다. [그들이] 어떻게 [큰 권세들…]에게서 벗어날 수 있겠습니까? 어떻게 그들이 […]할 수 있겠습니까? 어떤 이들이 [말합니다]. “우리는 신실합니다.” […] [더러운 영]과 악령은 […]. 그들에게 성령이 있었다면, 더러운 영은 하나도 그들에게 달라붙지 않았을 것이기 때문입니다. 육체를 두려워하지도 말고 사랑하지도 마십시오. 육체를 두려워하면 그것이 여러분을 지배할 것이고, 사랑하면 그것이 여러분을 삼키고 숨 막히게 할 것입니다.\n\n\n      사람은 이 세상이나 부활이나 중간 영역들 가운데 하나에 있습니다.[a] 나는 결코 그곳에서 발견되지 않기를 바랍니다! 이 세상에는 선과 악이 함께 있습니다. 이 세상의 좋은 것들은 좋지 않고, 악한 것들은 악하지 않습니다. 그러나 이 세상 뒤에는 참으로 악한 것이 있으니, ‘중간’이라 불리는 것입니다. 그것은 죽음입니다. 우리가 이 세상에 있는 동안 우리 자신을 위하여 부활을 얻는 것이 마땅합니다. 그래야 육체를 벗을 때 안식 가운데 있는 것으로 드러나고, 중간을 지나가지 않을 것입니다. 많은 사람이 길에서 헤매기 때문입니다.\n\n\n      사람이 죄를 짓기 전에 세상에서 나오는 것이 좋습니다. 어떤 이들은 원하지도 않고 할 수도 없지만, 다른 이들은 원한다 해도 행하지 않았기 때문에 아무 유익도 얻지 못할 것입니다. 원하는 것이 그들을 죄인으로 만듭니다. 그러나 원하지 않는다 해도 정의는 여전히 그들에게 감추어질 것입니다. 그것은 뜻도 아니고 행위도 아닙니다.[b]\n\n\n      한 사도가 환상 [속에서] 불타는 집에 갇혀 있고 불타는 […]에 묶여 있으며, 불타는 […]의 […]에 던져진\
    \ […] 사람들을 보았습니다. 그들이 그들에게 “[…] 구원받을 수 […]”라고 말했으나, 그들은 원하지 않았고 […] 형벌을 받았습니다. 그 형벌은 ‘[바깥] 어둠’이라 불리는데, 그것이 […]하기 때문입니다.\n\n\n      혼과 영은 물과 불에서 생겨났습니다. 신방의 자손은 물과 불과 빛에서 생겨났습니다.[c] 불은 성유이고, 빛은 불입니다. 내가 말하는 것은 형태 없는 저 불이 아니라 다른 불입니다. 그 불의 형상은 희고, 밝고 아름다우며, 아름다움을 줍니다.\n\n\n      진리는 벌거벗은 채 세상에 오지 않고, 모형과 형상으로 왔습니다.[d] 세상은 다른 방식으로는 진리를 받아들이지 않을 것입니다. 거듭남이 있고 거듭남의 형상이 있습니다. 참으로 형상을 통하여 다시 태어나야 합니다. 부활과 형상은 무엇입니까? 형상을 통하여 그것이 일어나야 합니다. 신방과 형상은 무엇입니까? 형상을 통하여 그들이 진리, 곧 회복에 들어가야 합니다. 아버지와 아들과 성령의 이름을 얻는 이들에게만 필요한 것이 아닙니다. 그분들 또한 여러분을 위하여 얻어지셨습니다.[e] 누가 그분들을 얻지 못하면, 그 이름도 그에게서 빼앗길 것입니다. 그러나 그분들은 십자가의 능력의 […] 성유 안에서 받아들여집니다. 사도들은 이것을 ‘[오른쪽]과 왼쪽’이라고 불렀습니다. 이 사람은 더 이상 [그리스도인]이 아니라 그리스도이기 때문입니다.[f]\n\n\n      주님께서는 모든 것을 신비 안에서 [행하셨습니다]. 곧 세례와 성유와 성찬과 구속과 신방 […]입니다.[g] 그분께서 [말씀하셨습니다]. “나는 [아래를] [위와 같게 하고 바깥을] [안과 같게 하며, 그것들을 하나로 묶으려고] 그곳에 왔다.” […] 여기에서 [모형들을 통하여 …] “[…] 위에 하나가 있다 […”라고 말하는 이들은 잘못입니다. 왜냐하면] 드러난 것은 […], 곧 ‘아래에 있는 것’이라 불리는 것이고, 감추어진 것은 그것에 대하여 그 위에 있는 것이기 때문입니다. 그것은 좋습니다. 그들은 ‘안과 바깥,\
    \ 그리고 바깥의 바깥’이라고 말합니다. 그러므로 주님께서는 멸망을 ‘바깥 어둠’이라고 부르셨습니다. 그 밖에는 아무것도 없습니다.\n\n\n      그분께서는 “숨어 계시는 내 아버지”라고 말씀하셨습니다. 또 이렇게 말씀하셨습니다. “여러분의 골방에 들어가 뒤로 문을 닫고, 숨어 계시는 여러분의 아버지께 기도하십시오.” 이는 곧 그들 모두의 안에 계시는 분을 가리킵니다. 그들 모두의 안에 계시는 분은 충만이십니다.[h] 그보다 더 안쪽에는 다른 아무것도 없습니다. 이것이 ‘그들 위에 있는 것’이라 불리는 것입니다.\n\n\n      그리스도 이전에 어떤 이들은 더는 들어갈 수 없는 곳에서 왔고, 더는 나올 수 없는 곳으로 갔습니다. 그때 그리스도께서 오셨습니다. 그분은 들어간 이들을 이끌어 내셨고, 나간 이들을 이끌어 들이셨습니다."
  revised_footnotes:
  - marker: a
    text: ‘중간 영역들’은 이 문헌이 말하는 사후의 중간 상태 또는 영역을 가리키는 듯하지만, 정확한 성격은 본문에서 분명하지 않습니다.
    reason: 독자에게 특수 용어의 불확실성을 알리기 위해서입니다.
  - marker: b
    text: 이 단락의 논리와 마지막 문장은 매우 난해합니다. 뜻과 행위 중 어느 하나를 구원의 결정적 조건으로 부정하는 것인지, 앞의 특정 사례만 가리키는 것인지 확실하지 않습니다.
