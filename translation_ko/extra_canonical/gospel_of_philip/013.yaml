    A person exists either in this world, in the resurrection, or in the middle places. May I never be found there! There is both good and evil in this world. Its good things are not good, and its evil things are not evil. But there is an evil after this world that is truly evil: what is called “the middle.” It is death. While we are in this world, it is right for us to acquire the resurrection for ourselves, so that when we are stripped of the flesh, we will be found in the rest and will not travel in the middle, because many stray along the way.


    It is good to come out of the world before one sins. Some neither want to nor can, but others, even if they wanted to, would not benefit, because they did not act. Their wanting makes them sinners. But even if they do not want, justice will still be hidden from them. It is not the will, and it is not the act.


