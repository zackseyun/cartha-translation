translation:
  language: ko
  text: '세상에 속한 이들에게 붙여진 이름들은 매우 기만적입니다. 그 이름들이 마음을 올바른 것에서 올바르지 않은 것으로 돌려놓기 때문입니다. 누가 “하나님”이라는 말을 들어도 올바른 것을 생각하지 않고 올바르지 않은 것을 생각합니다. “아버지”, “아들”, “성령”, “생명”, “빛”, “부활”, “교회”, 그리고 그 밖의 모든 이름도 마찬가지입니다. 사람들은 올바른 것을 배운 적이 [없다면], [올바른 것]을 생각하지 않고 [올바르지] 않은 것을 생각합니다. [들려 온 이름들은] 세상에 존재하며 […] [속입니다. 그것들이] 영원한 시대[a]에 [존재했다면], 세상에서 이름으로 쓰이지도 않았을 것이고 세상에 속한 것들 가운데 놓이지도 않았을 것입니다. 그것들은 영원한 시대에 끝이 납니다.[b]


    세상에서 입 밖에 내지 않는 이름이 하나 있습니다. 곧 아버지께서 아들에게 주신 이름입니다. 그 이름은 모든 것 위에 높이 들려 있으며, 아버지의 이름입니다. 아들이 아버지의 이름을 받지 않았다면 아버지가 되지 못했을 것이기 때문입니다. 이 이름을 가진 사람들은 그것을 알지만 말하지 않으며, 이 이름을 가지지 않은 사람들은 그것을 알지 못합니다. 그러나 진리는 우리를 위하여 이름들을 세상으로 가져왔습니다. 이 이름들 없이는 우리가 진리를 배울 수 없기 때문입니다. 진리는 하나뿐이지만 우리에게는 많은 것이 됩니다. 많은 것을 통하여 사랑 안에서 이 하나를 가르치기 위해서입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원한 시대’는 제공된 영어 증거문의 “(eternal) age”를 옮긴 것입니다. 괄호는 번역 증거문에서 보충된 표현임을 나타냅니다.
    reason: 직접 콥트어 검토가 아직 이루어지지 않은 상태에서 번역상 보충과 고대의 시대 개념을 투명하게 알리기 위해서입니다.
  - marker: b
    text: “그것들은 영원한 시대에 끝이 납니다”는 문맥상 다소 난해한 문장입니다. 사본의 결락과 복원 표시는 본문에 대괄호와 줄임표로 그대로 보존했습니다.
    reason: 손상된 대목을 매끄럽게 재구성하여 의미를 단정하지 않고 본문의 불확실성을 드러내기 위해서입니다.
lexical_decisions:
- source_word: worldly / world
  choice: 세상에 속한 / 세상
  rationale: ‘worldly’를 단순히 도덕적인 ‘세속적’으로 좁히지 않고, 본문의 세계와 영원한 시대의 대조를 살렸습니다.
- source_word: what's right / what's not right
  choice: 올바른 것 / 올바르지 않은 것
  rationale: 제공된 영어 증거문의 반복과 대립을 유지하고, 이를 곧바로 ‘진리/거짓’으로 해석하여 긴장을 해소하지 않았습니다.
- source_word: (eternal) age
  choice: 영원한 시대
  rationale: 영어 증거문의 괄호 속 보충을 반영하면서, ‘영원’이나 ‘내세’로 단정하지 않고 시대적 의미를 보존했습니다.
- source_word: name
  choice: 이름
  rationale: 호칭, 명칭, 계시된 이름 사이의 다층적 의미가 본문에서 전개되므로 일관되게 ‘이름’으로 옮겼습니다.
- source_word: Truth
  choice: 진리
  rationale: 후반부에서 행위 주체처럼 의인화된 용법을 유지하되, 한국어 문장에서는 불필요한 해설을 덧붙이지 않았습니다.
theological_decisions:
- issue: 아들이 ‘아버지가 된다’는 진술
  choice: “아버지가 되지 못했을 것”으로 직접 보존
  alternative: 아들이 아버지와 하나가 되거나 아버지의 권위를 받는다는 뜻으로 풀이
  rationale: 본문의 낯설고 신학적으로 긴장된 표현을 특정 교리 체계에 맞추어 완화하지 않았습니다.
- issue: 말해지지 않는 이름의 성격
  choice: 비밀 이름인지 신적 본질인지 규정하지 않음
  alternative: 성호, 구원의 암호, 신적 본질 등으로 명시
  rationale: 본문 자체가 이름의 정체를 밝히지 않으므로 그 모호성을 유지했습니다.
- issue: 하나인 진리가 많은 것이 된다는 진술
  choice: ‘진리는 하나뿐이지만 우리에게는 많은 것이 됩니다’로 번역
  alternative: 하나의 진리가 많은 이름이나 형태로 나타난다고 해설적으로 보충
  rationale: ‘많은 것’이 이름, 표상, 가르침 중 무엇을 가리키는지 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 신학 용어는 익숙한 형태로 옮기되 문장을 과도하게 교회식으로 만들지 않았습니다. 대괄호와 줄임표는 사본 손상 또는 편집적 복원을 나타내는 제공 자료의 표지를 보존합니다. 이 초안은 제공된 공공 영역 영어 증거문에 근거한 잠정 번역이며, Nag Hammadi Codex II,3의 콥트어 원문에 대한 직접 검토가 필요합니다.
