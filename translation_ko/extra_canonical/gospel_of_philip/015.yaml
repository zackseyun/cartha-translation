translation:
  language: ko
  text: '먼저 죽은 뒤에야 부활할 것이라고 말하는 사람들은 잘못되었습니다. 살아 있는 동안 먼저 부활을 받지 못하면, 죽을 때 아무것도 받지 못할 것입니다. 세례를 두고 “세례는 위대한 것입니다”라고 말하는 경우도 마찬가지입니다. 세례를 받는 사람들은 살 것이기 때문입니다.


    사도 빌립이 말했습니다. “목수 요셉은 자기 생업에 쓸 나무가 필요해서 동산을 심었습니다. 자기가 심은 나무들로 십자가를 만든 사람도 그였고, 그의 자손은 그가 심은 것에 달렸습니다. 그의 자손은 예수였고, 그 나무는 십자가였습니다.” 그러나 생명나무는 낙원 한가운데에 있고, 올리브나무에서는 성유가 나왔으며, 거기에서 부활이 나왔습니다.


    이 세상은 시체를 먹습니다. 이 세상에서 먹힌 것은 모두 또한 죽습니다. 진리는 생명을 먹으므로, [진리]로 양육받는 사람은 아무도 죽지 않을 것입니다. 예수께서는 그곳에서 오셨고, 그곳의 음식을 가져오셨습니다. 그리고 원하는 사람들에게 [먹도록 주셨으니, 이는] 그들이 죽지 않게 하시려는 것이었습니다.


    [하나님께서 …] 낙원을, [사람이 …] 낙원에는 […]와 하나님의 […]가 있고 […] 그 안에 있는 이들 […] 나는 [낙원이 …] 그들이 내게 “[이것을 먹어라 …]” 또는 “[저것은] 먹지 마라 […] 바란다”라고 말하기를 바랍니다. 지식의 나무는 내가 모든 것을 먹을 곳입니다. 그 나무는 아담을 죽였지만, 여기서는 인류를 살립니다. 율법이 그 나무였습니다. 율법에는 선과 악에 관한 지식을 주는 힘이 있습니다. 율법은 그들이 악을 행하지 못하게 막지도 않았고 그들을 선 가운데 두지도 않았으며, 오히려 그 열매를 먹은 이들에게 죽음을 만들어 냈습니다. 율법이 “이것은 먹고 저것은 먹지 마라”라고 말했을 때, 죽음의 시작이 되었기 때문입니다.


    성유 도유[a]는 세례보다 낫습니다. 우리가 ‘그리스도인’이라 불리는 것은 성유 때문이지 세례 때문이 아니기 때문입니다. 그리스도께서 그 이름을 얻으신 것도 성유 때문입니다. 아버지께서 아들에게 기름을 부으셨고, 아들은 사도들에게 기름을 부었으며, 사도들은 우리에게 기름을 부었습니다. 기름부음 받은 사람에게는 모든 것, 곧 부활과 빛과 십자가와 성령이 있습니다. 아버지께서 신방[b]에서 그에게 이것을 주셨고, 그는 그것을 받았습니다. 아버지께서 아들 안에 계셨고 아들이 아버지 안에 계셨습니다. 이것이 하늘의 [나라]입니다.


    주께서 [그것을] 잘 말씀하셨습니다. “어떤 사람들은 웃으며 하늘나라에 들어갔다가 […] 그리스도인 […] 그리고 [… 물에 내려가자] 곧 그는 […] 모든 것을 […] 그것은 놀이입니다. [그러나 … 대수롭지 않게 여기면] 이것을 […] [하늘]나라에 […] 그들이 […] 대수롭지 않게 여기고 그것을 놀이처럼 업신여기면, […] 웃으며 [나옵니다].” 빵과 잔과 기름도 마찬가지이지만, 이들보다 더 나은 것이 하나 있습니다.


    세상은 범법으로 말미암아 생겨났습니다. 세상을 만든 자는 세상을 썩지 않고 죽지 않게 만들고 싶어 했기 때문입니다. 그는 떨어져 나갔고 자기가 원하던 것을 얻지 못했습니다. 세상도 썩지 않는 것이 아니었고, 세상을 만든 자도 썩지 않는 존재가 아니었기 때문입니다. 썩지 않는 것은 사물들이 아니라 자녀들입니다. 자녀가 되지 않고서는 아무것도 썩지 않음을 받을 수 없습니다. 받을 수 없는 사람이 어찌 줄 수 있겠습니까?


    기도의 잔에는 포도주와 물이 들어 있습니다. 그 잔은 사람들이 감사를 드리는 그 피의 모형으로 놓였기 때문입니다. 그 잔은 성령으로 가득 차며, 완전히 온전한 사람에게 속합니다. 우리가 이것을 마실 때마다 온전한 사람을 받을 것입니다. 살아 있는 물은 몸입니다. 우리는 살아 있는 사람을 입어야 합니다. 그러므로 물로 내려가는 사람들은 그 사람을 입기 위해 옷을 벗습니다.


    말은 말을 낳고, 사람은 사람을 낳으며, 신은 신을 낳습니다. [신랑]과 [신부들도] 마찬가지입니다. 그들은 […]에서 [생겨납니다]. 어떤 유대인도 […]에서 […] 존재하지 않고 […] 유대인들에게서 […] 그리스도인들은 […] 이들을 “[…]의 선택받은 종족”, “참사람”, “사람의 아들”, “사람의 아들의 씨”라고 불렀습니다. 이 참된 종족은 세상에 알려져 있습니다. 이들이 있는 곳이 신방의 자녀들이 있는 곳입니다.


    이 세상에서 결합은 남자와 여자 사이에 있으며, 그곳은 힘과 약함이 있는 곳입니다. 오는 시대[c]의 결합은 다른 어떤 것과 같지만, 우리는 같은 이름으로 그것들을 부릅니다. 그러나 불리는 모든 이름보다 높은 다른 이름들이 있으며, 그것들은 강한 것보다 더 뛰어납니다. 힘이 있는 곳에는 그보다도 더 강한 이들이 있기 때문입니다. 그것들은 서로 다른 두 가지가 아니라 둘 다 같은 것입니다. 이것은 육적인 마음에는 내려올 수 없는 것입니다.


    모든 것을 가진 사람이라면 누구나 자신을 온전히 알아야 하지 않겠습니까? 자신을 알지 못하는 어떤 사람들은 자기에게 있는 것을 누리지 못하지만, 자신을 깨달은 사람들은 그것을 누릴 것입니다.


    그들은 온전한 사람을 결박할 수 없을 뿐 아니라 그를 볼 수도 없을 것입니다. 그를 보면 결박할 것이기 때문입니다. 사람이 이 은혜를 얻는 길은 온전한 빛을 입고 온전한 [빛이 되는 것밖에는] 없습니다. [그 빛을 입은 사람은] […] 갈 것입니다. 이것이 온전한 […] 우리가 […] 되기 위한 […] 우리가 […] 오기 전에 […] 모든 것을 받는 사람은 […] 이곳들을 […] 그곳을 […] 수 있을 것이나, 그들은 온전하지 못한 채로 [… 가운데에] 있을 것입니다. 이 사람의 끝은 오직 예수만 아십니다.


    거룩한 사람, 곧 사제는 몸에 이르기까지 완전히 거룩합니다. 그가 빵을 받으면 그것을 거룩하게 할 것이고, 잔이나 그 밖에 어떤 것을 받아 정결하게 해도 그렇게 할 것이기 때문입니다. 그렇다면 어찌 몸도 정결하게 하지 않겠습니까?


    예수께서 세례의 물을 온전하게 하신 것처럼 죽음을 쏟아 버리셨습니다. 그러므로 우리는 물속으로 내려가지만 죽음 속으로 내려가지는 않습니다. 이는 우리가 세상의 영 속으로 쏟아져 들어가지 않게 하려는 것입니다. 세상의 영이 불면 겨울이 오고, 성령께서 숨을 내쉬시면 여름이 옵니다.


    진리를 아는 사람은 자유인이고, 자유인은 죄를 짓지 않습니다. “죄를 짓는 사람은 죄의 종”이기 때문입니다. 진리는 어머니이고, 지식은 결합입니다. 죄에 내맡겨지지 않은 사람들은 세상에서 ‘자유인’이라고 불립니다. 죄에 내맡겨지지 않은 이들은 진리를 아는 지식으로 교만해집니다. 그 지식이 그들을 자유롭게 하고 모든 것 위로 높입니다. 그러나 “사랑은 세워 줍니다.” 지식으로 자유롭게 된 사람은 아직 지식의 [자유]에 이를 수 없는 이들을 사랑하기 때문에 종이 됩니다. [그러나] 지식은 그들이 자유롭게 [될] 수 있게 합니다. 사랑은 […] 어떤 것도 자기 것이라고 […] 그것은 […] 자기 것 […] 결코 [“…]” 또는 “이것은 내 것이다”라고 [말하지 않고, “…]은 너희 것이다”라고 합니다. 영적인 사랑은 향기로운 포도주입니다. 그것을 자기 몸에 바르는 사람은 모두 그것을 누립니다. 기름 바른 사람들이 곁에 머무는 동안에는 가까이 있는 사람들도 그 향기를 누립니다. 그러나 향유를 바른 사람들이 그들을 떠나가면, 기름을 바르지 않고 곁에만 있던 사람들은 자기들의 악취 속에 남습니다.

    사마리아 사람은 상처 입은 사람에게 기름 섞은 포도주 말고는 아무것도 주지 않았습니다. 그것은 다름 아닌 향유였고, 상처를 낫게 했습니다. “사랑은 많은 죄를 덮기” 때문입니다.


    여자가 낳은 자녀들은 그 여자가 사랑하는 남자를 닮을 것입니다. 그 남자가 남편이면 자녀들은 남편을 닮고, 간음하는 상대이면 그를 닮습니다. 흔히 여자가 의무 때문에 남편과 잠자리를 같이하면서도 마음은 자기가 정을 통하는 남자에게 가 있는 채 아이를 낳으면, 그 아이는 간음하는 상대를 닮습니다. 그러나 하나님의 아들과 함께 있는 여러분은 세상을 사랑하지 말고 주를 사랑하십시오. 그러면 여러분이 낳을 이들이 세상을 닮지 않고 주를 닮게 될 것입니다.


    사람은 사람과 결합하고, 말은 말과 결합하며, 나귀는 나귀와 결합합니다. 같은 종류는 비슷한 종류와 [결합합니다]. 이와 같이 영은 영과 결합하고, [말씀]은 말씀과 친밀해지며, [빛은 빛과] 친밀해집니다. [여러분이] 사람이 되면 [사람이 여러분을] 사랑할 것입니다. 여러분이 [영]이 되면 성령이 여러분과 결합할 것입니다. [여러분이] 말씀이 되면 말씀이 여러분과 결합할 것입니다. 여러분이 빛이 되면 빛이 여러분과 친밀해질 것입니다. 여러분이 위에 있는 이들 가운데 하나가 되면, 위에 있는 이들이 여러분 위에 머물 것입니다. 그러나 여러분이 말이나 나귀나 송아지나 개나 양이나 그 밖에 바깥이나 아래에 있는 짐승 가운데 하나가 되면, 사람도 영도 말씀도 빛도, 위에 있는 이들도 안에 있는 이들도 여러분을 사랑할 수 없을 것입니다. 그들은 여러분 안에 머물 수 없고, 여러분은 그들과 아무 몫도 없을 것입니다.


    마지못해 종이 된 사람은 자유롭게 될 수 있습니다. 그러나 주인의 은혜로 자유롭게 된 뒤에 자기 자신을 다시 종으로 팔아 버린 사람은 더 이상 자유롭게 될 수 없습니다.[d]'
