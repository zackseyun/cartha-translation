translation:
  language: ko
  text: '하와가 아담 [안에] 있었을 때에는 죽음이 존재하지 않았습니다. 하와가 아담에게서 분리되자 죽음이 생겨났습니다. 아담이 다시 [들어가] 그것을 자기 것으로 받아들이면 죽음은 없을 것입니다.


    “[나의] 하나님, 나의 하나님, 주님, 어찌하여 [나를] 버리셨습니까?” 그분은 십자가 위에서 이렇게 말씀하셨습니다. 그곳에서 나뉘셨기 때문입니다. […] 그분이 […] 하나님에게서 난 그것을 통하여 태어나셨다는 것입니다. 죽은 자들 가운데서 […] 존재하지만, […] 그분은 온전하십니다 […] 육체의 […] 그러나 이것은 […] 참된 육체입니다 […] 참된 것이 아니라 [다만 …] 참된 것의 형상입니다.


    신방[a]은 짐승이나 종이나 부정한 사람을 위한 곳이 아니라, 자유인과 동정인 사람들을 위한 곳입니다.


    우리는 성령을 통하여 다시 태어나지만, 그리스도를 통하여 두 가지로 태어납니다. 우리는 성령을 통하여 기름부음을 받습니다. 우리가 태어났을 때 우리는 하나가 되었습니다.


    빛이 없으면 아무도 물이나 거울 속에서 자신을 볼 수 없습니다. 또한 물이나 거울 없이는 빛 가운데서도 볼 수 없습니다. 그러므로 빛과 물, 이 둘 안에서 세례를 받아야 합니다. 그런데 빛은 성유[b]입니다.


    예루살렘에는 제물을 드리는 집이 세 곳 있었습니다. 서쪽으로 열린 곳은 ‘성소’라고 불립니다. 남쪽으로 열린 다른 곳은 ‘성소 중의 성소’라고 불립니다. 동쪽으로 열린 셋째 곳은 대제사장만 홀로 들어가는 곳으로, ‘지성소’라고 불립니다. 세례는 ‘성소’라는 집입니다. [구속]은 ‘성소 중의 성소’입니다. ‘[지]성소’는 신방입니다. [세례]에는 구속과 [함께] 부활이 포함됩니다. 구속은 신방 안에 있습니다. 그러나 [그] 신방은 […]보다 더 낫습니다. 여러분은 그것의 […] 찾지 못할 것입니다 […] 기도하는 사람들 […] 예루살렘. […] 예루살렘 사람은 [… 예루살렘], 보이게 되어 […] ‘[지성소들]’이라고 불리는 이것들 [… 그] 휘장이 찢어지고 […] 형상 외에는 신방 […] [위에 있는 것. 그러므로] 그 휘장은 위에서 아래까지 찢어졌습니다. 아래에 있는 몇몇 사람이 위로 올라가야 했기 때문입니다.


    권세들[c]은 완전한 빛을 입은 사람들을 볼 수도, 그들을 결박할 수도 없습니다. 사람은 결합의 신비 안에서 그 빛을 입게 될 것입니다.


    여자가 남자에게서 분리되지 않았더라면, 남자와 함께 죽지 않았을 것입니다. 그의 분리는 죽음의 시작이었습니다. 그러므로 그리스도께서는 처음부터 있던 분리를 바로잡으시려고 두 사람을 다시 하나로 결합하러 오셨습니다. 그분은 분리 때문에 죽은 사람들을 하나로 결합하여 살리실 것입니다. 이제 아내는 신방에서 남편과 하나가 되며, 신방에서 하나가 된 사람들은 더 이상 분리되지 않을 것입니다. 하와가 아담에게서 분리된 것은 이 때문입니다. 곧 하와가 신방에서 아담과 하나가 되지 않았기 때문입니다.


    숨결을 통하여 아담의 혼[d]이 생겨났습니다. 그 짝은 영이었습니다. 아담에게 주어진 것은 그의 어머니였습니다. 그의 혼은 [거두어지고], 그 대신 [생명](하와)이 그에게 주어졌습니다.[e] 그가 하나가 되었을 때 […] 권세들보다 더 나은 말들, 그래서 그들은 그를 시기했습니다 […] 영적인 짝 […] 감추어진 […] 곧 […] 그들 자신 […] 신방, 그리하여 […] 예수께서 나타나셨습니다 [… 그] 요르단, 하늘나라의 [충만]. 모든 것보다 먼저 [태어나신] 분이 다시 태어나셨습니다. 먼저 [기름부음을 받으신] 분이 다시 기름부음을 받으셨습니다. 구속받으신 분이 다시 구속받으셨습니다.


    신비에 관하여 말해야 한다면 이러합니다. 만물의 아버지께서 내려온 동정녀와 하나가 되셨고, 그날 불이 그분을 비추었습니다. 그분은 위대한 신방을 드러내셨고, 그리하여 그날 그분의 몸이 생겨났습니다. 그분은 신랑과 신부에게서 생겨난 이처럼 신방에서 나오셨습니다. 이와 같이 예수께서는 모든 것을 자기 안에 세우셨습니다. 제자들도 저마다 이것들을 통하여 그분의 안식에 들어가야 합니다.


    아담은 두 동정녀, 곧 성령과 처녀인 땅에서 생겨났습니다. 그러므로 그리스도께서는 처음에 일어난 타락을 바로잡으시려고 동정녀에게서 태어나셨습니다.


    낙원에는 두 나무가 자랍니다. 하나는 [짐승]을 낳고, 다른 하나는 사람을 낳습니다. 아담은 짐승을 낳는 나무의 열매를 [먹고] 짐승이 되었으며, [짐승]을 낳았습니다. 그래서 아담의 자손들은 [짐승들]을 숭배합니다. 그 나무 […] 열매입니다 […] 이것을 그들이 […] 먹었습니다 […] 그 […] 열매를 […] 사람들을 낳습니다 […] 사람의 […] 하나님은 사람을 만드시고, [… 사람들은] [하나님]을 만듭니다. 이 세상에서는 이와 같습니다. 사람들이 신들을 만들고 자신들이 만든 것을 숭배합니다. 차라리 신들이 사람들을 숭배하는 편이 더 나을 것입니다!


    진실은 이러합니다. 사람의 일은 그들의 능력에서 나오므로, 그들은 ‘권세들’이라고 불립니다. 그들의 일은 그들의 자녀이며, 자녀는 안식을 통하여 생겨납니다. 그러므로 그들의 능력은 그들의 일에 있지만, 안식은 그들의 자녀에게서 드러납니다. 여러분은 이것이 형상에까지 미치는 것을 알게 될 것입니다. 이것이 형상 안에 있는 사람입니다. 그들은 능력으로 일을 하지만, 안식으로 자녀를 낳습니다.


