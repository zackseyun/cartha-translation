review_pass:
  verdict: revise
  source_fidelity: 전반적으로 영어 증거의 역설적 논증과 반복을 잘 보존했습니다. 그러나 사본 결락이 있는 ‘Those […] to strip themselves naked’ 구절에서 결락 뒤의 주어를 ‘사람들’로 확정해 보충한 점, 인용문의 대괄호 범위를 옮긴 점, ‘This saying is in the flesh too’를 ‘육체 안에서 나옵니다’로 해석한 점은 증거문보다 더 확정적이거나 의미가 달라집니다. 또한 ‘great and valuable’의 ‘great’ 및 ‘countless thousands’의 수량 표현을 더 충실히 반영하는 편이 안전합니다.
  naturalness: 합쇼체와 논증적 문체는 대체로 자연스럽습니다. 다만 결락 구절은 한국어 문법을 위해 최소한의 연결어만 보충하고, ‘수없이 많은 수천’은 의도적인 과장·수량 표현으로 유지하되 ‘수천수만’처럼 관용적으로 옮기는 것이 자연스럽습니다.
  terminology: ‘부활’, ‘육체’, ‘살과 피’, ‘말씀’, ‘성령’, ‘상속받다’, ‘성유’의 선택은 문맥상 적절합니다. 예수의 ‘(살)’은 영어 증거의 괄호를 본문에도 유지해야 하며, ‘하나님의 나라’ 인용문의 대괄호는 원문의 불완전성 신호를 지우지 않도록 조정해야 합니다.
  issues:
  - severity: medium
    issue: 결락 구절에 ‘사람들은’이라는 주어를 넣었습니다.
    rationale: 영어 증거는 ‘Those […] to strip themselves naked [are] not naked’로 결락 위치와 문법적 보충을 드러냅니다. ‘사람들’이라는 특정 명사를 넣지 않고 ‘…하려는 이들은’처럼 최소한으로 옮겨야 합니다.
  - severity: medium
    issue: ‘살과 [피는 하나님의] 나라’는 영어 증거의 대괄호 범위를 충실히 보존하지 못합니다.
    rationale: 영어는 ‘Flesh [and blood won’t] inherit [God’s] kingdom’입니다. 한국어 문장에서는 복원된 술어를 피할 수 없더라도, ‘피’와 ‘하나님의’에 해당하는 불확실성 표시는 유지해야 합니다.
  - severity: medium
    issue: ‘그러나 이 말도 육체 안에서 나옵니다’는 ‘this saying is in the flesh too’를 발화의 기원으로 바꿉니다.
    rationale: 증거문은 그 ‘말’ 자체도 육체 안에 있다고 진술합니다. ‘이 말도 육체 안에 있습니다’가 더 직접적이며 해석을 덜 추가합니다.
  - severity: low
    issue: ‘값진 것’ 및 ‘헤아릴 수 없이 많은 돈’이 각각 ‘great’와 ‘countless thousands’를 약화합니다.
    rationale: ‘크고 값진 것’과 ‘수없이 많은 수천’을 ‘수천수만’으로 옮기면 과장된 수량과 대비를 더 잘 살릴 수 있습니다.
  revised_text: '주님께서 먼저 죽으신 뒤에 살아나셨다고 말하는 사람들은 잘못되었습니다. 주님께서는 먼저 살아나신 뒤에 죽으셨기 때문입니다. 먼저 부활을 얻지 못한 사람은 죽지 않을 것입니다. 하나님께서 살아 계심을 두고 말하건대, 그런 사람은 /죽을 것입니다\![a]



    아무도 크고 값진 것을 큰 것 속에 숨기지 않을 것입니다. 그러나 흔히 사람들은 겨우 한 푼어치밖에 안 되는 것 속에 수천수만을 넣어 둡니다. 영혼도 이와 같습니다. 크고 값진 것이 보잘것없는 몸 안에 생겨났습니다.



    어떤 사람들은 자신이 벌거벗은 채로 살아날까 두려워합니다. 그래서 육체로 살아나기를 바라지만, [육체]를 입은 사람들이 벌거벗었다는 것을 알지 못합니다. 자신을 벌거벗기려고 […] 하는 이들은 벌거벗은 것이 아닙니다.[b] “살은 [피와 함께] [하나님의] 나라를 상속받지 못할 것입니다.” 상속받지 못하는 것은 무엇입니까? 우리 위에 걸쳐 있는 것입니다. 그러면 상속받을 것은 또 무엇입니까? 예수의 (살)과 피입니다.[c] 그러므로 그분께서 말씀하셨습니다. “내 살을 먹고 내 피를 마시지 않는 사람에게는 생명이 없습니다.” 그분의 살은 무엇입니까? 말씀입니다. 그분의 피는 성령입니다. 이것들을 받은 사람에게는 먹을 것과 마실 것과 입을 것이 있습니다.



    그러므로 나는 “그것은 살아나지 않을 것이다”라고 말하는 다른 사람들에게 동의하지 않습니다. 양쪽이 모두 잘못되었습니다. “육체는 살아나지 않을 것이다”라고 말하는 사람들이여, 무엇이 살아날 것인지 말해 보십시오. 그러면 우리가 여러분을 존중하겠습니다. 여러분은 “육체 안에 있는 영과, 육체 안에 있는 이 다른 빛”이라고 말합니다. 그러나 이 말도 육체 안에 있습니다. 여러분이 무엇을 말하든 육체를 떠나서는 말할 수 없기 때문입니다. 모든 것이 이 육체 안에 존재하므로, 이 육체 안에서 살아나야 합니다.[d] 이 세상에서는 사람이 자신이 입은 옷보다 더 낫습니다. 하늘나라에서는 옷이 그것을 입은 사람보다 더 낫습니다.



    모든 것은 물과 불로 깨끗해집니다. 보이는 것은 보이는 것으로, 감추어진 것은 감추어진 것으로 깨끗해집니다. 어떤 것들은 보이는 것들에 의해 감추어져 있습니다. 물 안에 물이 있고, 성유 안에 불이 있습니다.[e]'
