translation:
  language: ko
  text: '주님께서 먼저 죽으신 뒤에 살아나셨다고 말하는 사람들은 잘못되었습니다. 주님께서는 먼저 살아나신 뒤에 죽으셨기 때문입니다. 먼저 부활을 얻지 못한 사람은 죽지 않을 것입니다. 하나님께서 살아 계심을 두고 말하건대, 그런 사람은 /죽을 것입니다\![a]


    아무도 크고 값진 것을 큰 물건 속에 숨기지는 않습니다. 그러나 흔히 사람들은 겨우 한 푼짜리 물건 속에 헤아릴 수 없이 많은 돈을 넣어 두었습니다. 영혼도 이와 같습니다. 값진 것이 보잘것없는 몸 안에 생겨났습니다.


    어떤 사람들은 자신이 벌거벗은 채로 살아날까 두려워합니다. 그래서 육체로 살아나기를 바라지만, [육체]를 입은 사람들이 벌거벗었다는 것을 알지 못합니다. 자신을 벌거벗기려고 […] 사람들은 벌거벗은 것이 아닙니다.[b] “살과 [피는 하나님의] 나라를 상속받지 못할 것입니다.” 상속받지 못하는 것은 무엇입니까? 우리 위에 걸쳐 있는 것입니다. 그러면 상속받을 것은 또 무엇입니까? 예수의 살과 피입니다.[c] 그러므로 그분께서 말씀하셨습니다. “내 살을 먹고 내 피를 마시지 않는 사람에게는 생명이 없습니다.” 그분의 살은 무엇입니까? 말씀입니다. 그분의 피는 성령입니다. 이것들을 받은 사람에게는 먹을 것과 마실 것과 입을 것이 있습니다.


    그러므로 나는 “그것은 살아나지 않을 것이다”라고 말하는 다른 사람들에게 동의하지 않습니다. 양쪽이 모두 잘못되었습니다. “육체는 살아나지 않을 것이다”라고 말하는 사람들이여, 무엇이 살아날 것인지 말해 보십시오. 그러면 우리가 여러분을 존중하겠습니다. 여러분은 “육체 안에 있는 영과, 육체 안에 있는 이 다른 빛”이라고 말합니다. 그러나 이 말도 육체 안에서 나옵니다. 여러분이 무엇을 말하든 육체를 떠나서는 말할 수 없기 때문입니다. 모든 것이 이 육체 안에 존재하므로, 이 육체 안에서 살아나야 합니다.[d] 이 세상에서는 사람이 자신이 입은 옷보다 더 낫습니다. 하늘나라에서는 옷이 그것을 입은 사람보다 더 낫습니다.


    모든 것은 물과 불로 깨끗해집니다. 보이는 것은 보이는 것으로, 감추어진 것은 감추어진 것으로 깨끗해집니다. 어떤 것들은 보이는 것들에 의해 감추어져 있습니다. 물 안에 물이 있고, 성유 안에 불이 있습니다.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 “죽을 것입니다”는 제공된 영어 증거에서 /die\로 표시된 이례적 독법입니다. 앞 문장과 긴장을 이루며, 콥트어 원문 대조가 필요합니다.
    reason: 증거문 자체가 표시한 불확실하고 역설적인 독법을 독자에게 알리기 위해서입니다.
  - marker: b
    text: 이 문장은 사본의 결락 때문에 불완전합니다. 대괄호와 생략 부호는 손상되거나 복원된 부분을 나타냅니다.
    reason: 결락을 매끄럽게 보충하여 의미를 확정하지 않기 위해서입니다.
  - marker: c
    text: 제공된 영어 증거는 ‘살’을 괄호 안에 두었습니다. 콥트어 원문 검토 전에는 그 표시의 성격이 확정되지 않습니다.
    reason: 복원 또는 번역상 보충일 수 있는 요소의 불확실성을 보존하기 위해서입니다.
  - marker: d
    text: “이 육체 안에서”는 ‘이 육체로’라고도 이해될 수 있습니다. 본문이 육체를 장소와 매개 가운데 어느 쪽으로 강조하는지는 분명하지 않습니다.
    reason: 전치 관계와 신학적 함의를 하나로 확정하지 않기 위해서입니다.
  - marker: e
    text: “성유”는 기름부음에 쓰는 기름을 가리킵니다. ‘성유 안에 불이 있다’는 표현은 본문의 상징적 진술을 그대로 따른 것입니다.
    reason: 낯선 의례 용어와 상징을 간단히 설명하기 위해서입니다.
lexical_decisions:
- source_word: arose / resurrection
  choice: 살아나다 / 부활
  rationale: 동사형의 반복에는 자연스러운 ‘살아나다’를, 획득하는 실재를 가리키는 명사에는 전통적이고 명확한 ‘부활’을 사용했습니다.
- source_word: flesh
  choice: 육체 / 살
  rationale: 부활의 매개나 인간이 입은 것으로 논하는 자리에서는 ‘육체’를, 예수의 살과 피를 인용하고 해석하는 자리에서는 ‘살’을 사용하여 문맥상의 대비를 보존했습니다.
- source_word: Word
  choice: 말씀
  rationale: 인격적·신학적 함의를 열어 두면서 한국어 성서 전통에 익숙한 표현을 택했습니다.
- source_word: chrism
  choice: 성유
  rationale: 기름부음에 쓰이는 물질과 의례적 함의를 함께 전달하는 일반적 용어입니다.
- source_word: inherit
  choice: 상속받다
  rationale: 왕국을 유업으로 받는다는 원문의 법적·가족적 은유를 보존했습니다.
theological_decisions:
- issue: ‘먼저 살아난 뒤에 죽었다’는 역설
  choice: 표현을 그대로 보존함
  alternative: 영적 부활 뒤 육체적 죽음으로 해설하여 번역함
  rationale: 본문 자체가 역설을 해명하지 않으므로 특정 교리적 해석을 본문에 삽입하지 않았습니다.
- issue: 상속받는 ‘예수의 살과 피’
  choice: 괄호 없이 본문 진술로 번역하고 각주로 증거의 괄호를 알림
  alternative: ‘예수의 (살)과 피’로 본문에 괄호를 유지함
  rationale: 공급된 증거에서 괄호는 번역자 표시일 가능성이 있으나 콥트어 대조가 미완료이므로 각주에서 불확실성을 밝혔습니다.
- issue: ‘이 육체 안에서’의 부활
  choice: 물질적·현세적·상징적 가능성을 확정하지 않고 직역에 가깝게 보존함
  alternative: ‘이 몸으로 부활해야 한다’로 단정함
  rationale: 전후 문맥의 육체·옷 은유가 복합적이므로 교리적 의미를 좁히지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 논증적 문장은 명료하게 다듬되 역설, 결락, 반복, 육체와 옷의 은유는 보존했습니다. 공급 자료가 영어 공개 번역 증거이며 콥트어 원문 검토가 미완료이므로, 본문과 각주에서 복원 및 난해 독법을 과도하게 확정하지 않았습니다.
