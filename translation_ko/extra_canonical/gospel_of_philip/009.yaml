  revised_text: '하늘에 속한 사람의 자녀들은 땅에 속한 사람의 자녀들보다 더 많습니다. 아담에게는 죽는 자녀들도 그토록 많은데, 완전한 사람에게는 얼마나 많은 자녀가 있겠습니까? 그들은 죽지 않고 끊임없이 태어납니다.


    아버지는 아들을 낳지만, 아들은 아들을 낳을 수 없습니다. 태어난 사람이 아들들을 낳는 것은 불가능하기 때문입니다. 아들은 아들들이 아니라 형제들을 낳습니다. 세상에서 태어나는 사람들은 모두 육체적으로 태어나지만, 다른 이들은 […] 안에서 그에게서 태어나 […] 저 밖에서 사람에게 […] 그 […] 하늘의 곳에서 […] 그것을 입으로부터 […] 말씀이 거기서 나왔습니다. 그들은 입으로부터 양육을 받아 [그리고] 완전하게 됩니다. 완전한 사람들은 입맞춤을 통해 잉태되고 태어납니다. 이 때문에 우리도 서로 입맞추며, 서로의 안에 있는 은혜로부터 잉태합니다.


    언제나 주님과 함께 다니던 이들은 세 사람이었습니다. 곧 그분의 어머니 마리아와 그녀의 자매와, 그분의 동반자라고 불리는 막달레나입니다. 마리아는 그분의 자매이고 어머니이며 짝이기 때문입니다.[a]


    “아버지”와 “아들”은 각각 하나의 이름이고, “성령”은 이중의 이름입니다.[b] 그들은 어디에나 있기 때문입니다. 그들은 하늘에도 있고 아래에도 있으며, 감추어져 있기도 하고 드러나 있기도 합니다. 성령은 아래에서는 드러나고 하늘에서는 감추어져 있습니다.


    거룩한 이들은 악한 권세들의 섬김을 받습니다. 성령께서 그 권세들의 눈을 멀게 하셨으므로, 그들은 거룩한 이들을 위해 일하면서도 평범한 사람을 섬긴다고 생각합니다. 그래서 어느 날 한 제자가 세상일에 관하여 주님께 물었습니다. 주님께서 그에게 말씀하셨습니다. “네 어머니께 여쭈어라. 그러면 그분이 다른 이에게서 네게 주실 것이다.”[c]


    사도들이 제자들에게 말했습니다. “우리의 모든 제물이 소금을 얻기를 바랍니다.” 그들은 […]을 “소금”이라고 불렀습니다. 이것이 없으면 제물은 받아들여질 만하게 [되지] 않습니다. 그러나 지혜는 [자녀가 없습니다]. 이 때문에 [그녀는] […]이라고 불립니다. 소금의 이것, 곧 그들이 저마다 자기 방식으로 […]할 곳을 […]. 성령은 […] […] 많은 자녀를 둡니다.[d]


    아버지의 것은 아들의 것입니다. 그러나 아들 자신은 어릴 동안에는 자기에게 속한 것을 맡겨 받지 못합니다. 그가 어른이 되면, 아버지가 자기에게 속한 모든 것을 그에게 줍니다.


    성령에게서 태어나고도 길을 잃는 이들은 성령을 통해서도 길을 잃습니다.[e] 이 때문에 바로 이 한 성령을 통해 그것, 곧 불이 타오르기도 하고 꺼지기도 합니다.


    에카모트(Echamoth)와 에크모트(Echmoth)는 서로 다릅니다.[f] 에카모트는 단순히 지혜이지만, 에크모트는 죽음을 아는 ‘죽음의 지혜’입니다. 이것을 “작은 지혜”라고 부릅니다.'
