base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/009.yaml
  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: ko
  text: '하늘에 속한 사람의 자녀들은 땅에 속한 사람의 자녀들보다 더 많습니다. 아담에게는 죽는 자녀들도 그토록 많은데, 완전한 사람에게는 얼마나 많은 자녀가 있겠습니까? 그들은 죽지 않고 끊임없이 태어납니다.


    아버지는 아들을 낳지만, 아들은 아들을 낳을 수 없습니다. 태어난 사람이 아들들을 낳는 것은 불가능하기 때문입니다. 아들은 아들들이 아니라 형제들을 낳습니다. 세상에서 태어나는 사람들은 모두 육체로 태어나지만, 다른 이들은 […] 안에서 그에게서 태어나 […] 저 밖에서 사람에게 […] 그 […] 하늘의 곳에서 […] 그것을 입으로부터 […] 말씀이 거기서 나왔습니다. 그들은 입으로부터 양육을 받아 [완전하게] 될 것입니다. 완전한 사람들은 입맞춤을 통해 잉태되고 태어납니다. 이 때문에 우리도 서로 입맞추며, 서로의 안에 있는 은혜로부터 잉태합니다.


    언제나 주님과 함께 다니던 이들은 세 사람이었습니다. 곧 그분의 어머니 마리아와 그녀의 자매와, 그분의 동반자라고 불리는 막달레나입니다. 마리아는 그분의 자매이고 어머니이며 짝이기 때문입니다.[a]


    “아버지”와 “아들”은 각각 하나의 이름이고, “성령”은 이중의 이름입니다.[b] 그들은 어디에나 있기 때문입니다. 그들은 하늘에도 있고 아래에도 있으며, 감추어져 있기도 하고 드러나 있기도 합니다. 성령은 아래에서는 드러나고 하늘에서는 감추어져 있습니다.


    거룩한 이들은 악한 권세들의 섬김을 받습니다. 성령께서 그 권세들의 눈을 멀게 하셨으므로, 그들은 거룩한 이들을 위해 일하면서도 평범한 사람을 섬긴다고 생각합니다. 그래서 어느 날 한 제자가 세상일에 관하여 주님께 물었습니다. 주님께서 그에게 말씀하셨습니다. “네 어머니께 여쭈어라. 그러면 그분이 다른 이에게서 받아 네게 주실 것이다.”[c]


    사도들이 제자들에게 말했습니다. “우리의 모든 제물이 소금을 얻기를 바랍니다.” 그들은 […]을 “소금”이라고 불렀습니다. 이것이 없으면 제물은 받아들여질 만하게 [되지] 않습니다. 그러나 지혜는 [자녀가 없습니다]. 이 때문에 [그녀는] […]이라고 불립니다. 소금의 이것, 곧 그들이 […]할 곳을 저마다 자기 방식으로 […]. 성령은 […] […] 많은 자녀를 둡니다.[d]


    아버지의 것은 아들의 것입니다. 그러나 아들 자신은 어릴 동안에는 자기 것을 맡지 못합니다. 그가 어른이 되면, 아버지가 자기에게 속한 모든 것을 그에게 줍니다.


    성령에게서 태어나고도 길을 잃는 이들은 성령을 통해서도 길을 잃습니다.[e] 이 때문에 바로 이 한 성령을 통해 그것, 곧 불이 타오르기도 하고 꺼지기도 합니다.


    에카모트(Echamoth)와 에크모트(Echmoth)는 서로 다릅니다.[f] 에카모트는 단순히 지혜이지만, 에크모트는 죽음을 아는 ‘죽음의 지혜’입니다. 이것을 “작은 지혜”라고 부릅니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 문장은 여러 ‘마리아’의 관계와 지시 대상이 모호합니다. 번역은 그 모호성을 그대로 남겼습니다.
    reason: 인물 지시와 관계를 특정 해석으로 확정하지 않기 위해서입니다.
  - marker: b
    text: ‘이중의 이름’과 뒤따르는 복수 표현은 본문의 독특한 표현입니다. 의미를 하나로 풀어 쓰지 않았습니다.
    reason: 신학적·문법적 긴장을 보존하기 위해서입니다.
  - marker: c
    text: ‘어머니’와 ‘다른 이’가 누구를 가리키는지는 본문만으로 분명하지 않습니다.
    reason: 불명확한 대명사 지시를 알리기 위해서입니다.
  - marker: d
    text: 대괄호와 […]은 사본의 훼손이나 번역 증언에 나타난 복원·결락을 표시합니다. 이 단락은 훼손이 심하여 문맥이 불완전합니다.
    reason: 사본 상태와 번역의 불확실성을 투명하게 나타내기 위해서입니다.
  - marker: e
    text: ‘그것/그 영을 통해’에 해당하는 표현의 정확한 지시와 의미는 불확실합니다.
    reason: 성령과 방황의 관계를 교리적으로 단정하지 않기 위해서입니다.
  - marker: f
    text: 에카모트와 에크모트는 서로 비슷하지만 구별되는 명칭입니다. 정확한 어원과 말놀이는 콥트어 원문 대조가 필요합니다.
    reason: 전문 명칭의 구별을 보존하고 원어 검토의 필요성을 밝히기 위해서입니다.
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: 하늘에 속한 사람 / 땅에 속한 사람 / 완전한 사람
  rationale: ‘human’의 포괄성과 본문의 인간 유형 대조를 살리면서 현대 한국어에서 자연스럽게 표현했습니다.
- source_word: beget / be begotten
  choice: 낳다 / 태어나다
  rationale: 문맥에 따라 능동과 수동을 자연스럽게 구분하되, 육체적 출생과 영적 생성 사이의 의도적 긴장을 보존했습니다.
- source_word: companion / partner
  choice: 동반자 / 짝
  rationale: 서로 다른 영어 표현을 구별하고, 관계의 정확한 성격을 혼인 관계로 단정하지 않았습니다.
- source_word: Word
  choice: 말씀
  rationale: 신학적 함의를 지닌 호칭일 가능성을 반영해 대문자 표기의 기능을 한국어의 관례적 표현으로 옮겼습니다.
- source_word: powers
  choice: 권세들
  rationale: 단순한 능력이 아니라 인격화된 초월적 세력일 수 있는 의미를 보존했습니다.
- source_word: Wisdom
  choice: 지혜
  rationale: 인격화된 여성적 존재를 가리키는 문맥은 대명사 ‘그녀’로 드러내되, 용어 자체는 전통적이고 중립적인 ‘지혜’로 번역했습니다.
- source_word: Echamoth / Echmoth
  choice: 에카모트(Echamoth) / 에크모트(Echmoth)
  rationale: 유사한 두 전문 명칭의 철자 차이가 논지의 핵심이므로 음역과 로마자를 함께 제시했습니다.
theological_decisions:
- issue: ‘Mary’가 자매·어머니·짝이라는 진술의 지시 대상
  choice: 원문의 반복과 모호성을 그대로 유지했습니다.
  alternative: 각 ‘마리아’를 서로 다른 인물로 명시하거나 막달레나만을 짝으로 해석할 수 있습니다.
  rationale: 전승과 문법의 긴장이 있어 특정 인물 관계로 단정하지 않는 것이 적절합니다.
- issue: ‘Holy Spirit’이 ‘double name’이라는 표현과 복수 대명사
  choice: ‘이중의 이름’과 ‘그들’이라는 표현을 보존했습니다.
  alternative: 성령의 이름이 두 영역에 존재한다는 뜻으로 풀어 쓸 수 있습니다.
  rationale: 본문의 독특한 명명론과 수적 긴장을 해소하지 않았습니다.
- issue: 성령에게서 난 이들이 성령을 통해 길을 잃는다는 진술
  choice: ‘성령을 통해서도 길을 잃습니다’로 직역에 가깝게 보존했습니다.
  alternative: ‘그것 때문에 빗나간다’ 또는 ‘그 영에 의하여 방황한다’로 옮길 수 있습니다.
  rationale: 대명사의 지시와 성령의 역할이 난해하므로 교리적으로 완화하거나 설명하지 않았습니다.
- issue: 불과 성령의 관계
  choice: 불이 한 성령을 통해 타오르고 꺼진다는 문장 구조를 유지했습니다.
  alternative: 성령이 불을 붙이고 끈다고 명시할 수 있습니다.
  rationale: 원문 증거가 행위 주체와 관계를 명확히 확정하지 않으므로 인과관계를 추가하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 읽기 쉬운 합쇼체를 사용했습니다. 다만 이 초안은 제공된 공용 영어 증언을 바탕으로 한 잠정 번역이며, 콥트어 사본에 대한 직접 검토가 아직 필요합니다. 사본 결락은 […]로, 증언에 제시된 복원은 대괄호로 보존했습니다.
