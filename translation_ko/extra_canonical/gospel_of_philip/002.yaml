base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: ko
  text: '겨울에 씨를 뿌리는 사람들은 여름에 거둡니다. 겨울은 이 세상이고, 여름은 오는 시대입니다. 그러므로 여름에 거둘 수 있도록 이 세상에서 씨를 뿌립시다. 이런 까닭에 우리가 겨울에 기도하는 것은 옳지 않습니다.[a] 여름은 겨울 뒤에 옵니다. 그러나 누가 겨울에 거두면, 그는 거두는 것이 아니라 뿌리째 뽑는 것입니다. 이런 것은 열매를 맺지 못하기 때문입니다. […] 그것은 그저 나오기만 하는 것이 아니라 […] 다른 안식일에 […] 열매가 없습니다.[b]


    그리스도께서는 어떤 이들은 사려고 오셨고, 다른 이들은 구원하려고 오셨으며, 또 다른 이들은 속량하려고 오셨습니다.[c] 그분은 낯선 이들을 사서 자기 사람으로 삼으셨고, 뜻하신 대로 그들을 따로 세워 담보로 삼으셨습니다.[d] 그분이 뜻하실 때 자기 생명을 내놓으신 것은 그분이 나타나셨을 때만이 아닙니다. 세상이 생겨난 날부터 그분은 뜻하실 때 자기 생명을 내놓으셨습니다. 그러고 나서 그것이 담보로 맡겨져 있었으므로, 그분은 먼저 그것을 되찾으러 오셨습니다.[e] 그것은 자기를 사로잡은 강도들의 지배 아래 있었으나, 그분이 그것을 구원하셨습니다. 또한 그분은 세상에서 선한 이들뿐 아니라 악한 이들도 속량하셨습니다.


    빛과 어둠, 오른쪽과 왼쪽은 서로 형제이며 서로 떼어 놓을 수 없습니다.[f] 그러므로 선한 이들은 선하지 않고, 악한 이들은 악하지 않으며, 생명도 참으로 생명이 아니고 죽음도 참으로 죽음이 아닙니다.[g] 이런 까닭에 각각은 태초부터 있던 자기 근원으로 풀려 돌아갈 것입니다.[h] 그러나 세상보다 높이 올려진 이들은 풀어질 수 없으며 영원합니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘겨울에 기도하는 것’이라는 표현의 정확한 뜻은 불분명합니다. 이 번역은 제공된 영어 증언을 따릅니다.
    reason: 난해한 표현이며 콥트어 원문 대조가 아직 이루어지지 않았음을 알립니다.
  - marker: b
    text: 대괄호 속 줄임표는 사본의 훼손이나 복원이 불확실한 부분을 나타냅니다. 따라서 이 문단 끝부분의 문맥은 단편적입니다.
    reason: 본문의 공백과 불확실성을 독자가 완전한 문장으로 오해하지 않게 합니다.
  - marker: c
    text: ‘사다’, ‘구원하다’, ‘속량하다’는 본문에서 서로 구별되어 있으나, 그 차이가 무엇을 뜻하는지는 분명하지 않습니다.
    reason: 세 동사의 신학적 구분을 임의로 확정하지 않으면서 번역상의 구별을 설명합니다.
  - marker: d
    text: ‘담보’로 옮긴 말은 보증물이나 맡겨 둔 것을 뜻할 수 있습니다. 이 문장에서 누가 누구에게 무엇을 맡겼는지는 모호합니다.
    reason: 소유와 담보의 비유에 남아 있는 문법적·개념적 모호성을 보존합니다.
  - marker: e
    text: ‘그것’이 바로 앞의 ‘생명’을 가리키는지, 담보로 맡겨진 어떤 대상을 가리키는지는 확실하지 않습니다.
    reason: 대명사의 불명확한 지시 대상을 투명하게 밝힙니다.
  - marker: f
    text: 여기서 ‘형제’는 서로 대립하는 것들이 긴밀하게 연결되어 있음을 나타내는 비유적 표현입니다.
    reason: 남성 친족어의 문자적 의미로 오해할 가능성을 줄이되 역설은 유지합니다.
  - marker: g
    text: ‘참으로’는 영어 증언에서 괄호로 보충된 ‘really’를 반영합니다. 원문 대조에 따라 조정될 수 있습니다.
    reason: 보충적 성격의 표현임을 알리고 출전의 불확실성을 표시합니다.
  - marker: h
    text: ‘태초부터 있던 자기 근원’은 ‘각각의 처음 기원’으로도 이해할 수 있습니다.
    reason: 시간적 의미와 기원·근원의 의미가 겹치는 표현의 가능성을 보존합니다.
lexical_decisions:
- source_word: winter / summer
  choice: 겨울 / 여름
  rationale: 계절의 비유를 그대로 보존하고, 이어지는 ‘이 세상/오는 시대’의 해설과 자연스럽게 연결했습니다.
- source_word: the other age
  choice: 오는 시대
  rationale: 현재의 세상과 대비되는 종말론적 시대를 자연스러운 한국어로 나타냈습니다. ‘다른 시대’도 가능하지만 의미 관계가 덜 분명합니다.
- source_word: pray
  choice: 기도하다
  rationale: 영어 증언의 표현을 직접 옮겼습니다. 문맥상 뜻이 난해하므로 ‘청하다’ 등으로 해석해 바꾸지 않았습니다.
- source_word: buy / save / redeem
  choice: 사다 / 구원하다 / 속량하다
  rationale: 본문이 의도적으로 구별하는 세 동사를 합치지 않고 각각 다른 말로 보존했습니다.
- source_word: pledge
  choice: 담보
  rationale: 소유권·되찾음의 문맥을 살리면서도 무엇이 누구에게 맡겨졌는지의 모호성은 유지했습니다.
- source_word: brothers
  choice: 형제
  rationale: 빛과 어둠, 오른쪽과 왼쪽의 역설적 친족 관계를 완화하지 않고 직역했습니다.
- source_word: dissolved / indissoluble
  choice: 풀려 돌아가다 / 풀어질 수 없다
  rationale: 해체와 근원으로의 귀환이라는 의미를 함께 전달하고, 두 표현의 대조를 유지했습니다.
theological_decisions:
- issue: ‘겨울에 기도하는 것은 옳지 않다’의 의미
  choice: 난해한 진술을 그대로 보존
  alternative: ‘겨울에 쉬는 것은 옳지 않다’ 또는 비유를 해설하여 번역
  rationale: 제공된 영어 증언은 ‘pray’로 읽으며, 콥트어 원문 검토가 보류된 상태이므로 교리적 의미를 추정해 고치지 않았습니다.
- issue: 그리스도께서 자기 생명을 세상 창조 때부터 내놓으셨다는 진술
  choice: 시간적·신학적 긴장을 그대로 번역
  alternative: 오직 역사적 죽음을 가리키도록 의역
  rationale: 본문이 발현 시점과 세계의 시작을 대조하므로 이를 특정 성육신론이나 속죄론에 맞추어 해소하지 않았습니다.
- issue: 선과 악, 생명과 죽음의 부정
  choice: ‘선하지 않고… 참으로 생명이 아니다’로 역설을 유지
  alternative: 상대적 선악 또는 현세적 생사라는 해설을 본문에 삽입
  rationale: 본문의 존재론적 또는 수사적 함의가 불확실하므로 특정 해석을 강요하지 않았습니다.
- issue: 선한 이들과 악한 이들의 속량
  choice: 양쪽 모두 속량하셨다고 명시
  alternative: 악한 이들만 속량 대상으로 제한
  rationale: 제공된 증언의 병렬 구조를 그대로 따르며 보편구원 등 후대의 교리적 결론을 덧붙이지 않았습니다.
- issue: 대명사 ‘it’의 지시 대상
  choice: ‘그것’으로 모호성을 보존
  alternative: ‘생명’ 또는 ‘담보’를 명시
  rationale: 영어 증언만으로 지시 대상을 확정하기 어려워 원문의 모호성을 한국어에서도 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 비유와 역설은 설명적으로 평탄화하지 않았고, 반복되는 핵심 동사는 가능한 한 일관되게 옮겼습니다. 다만 제공 자료가 공공 영역 영어 증언이며 콥트어 원문 검토가 보류되어 있으므로, 난해한 대목과 대명사 지시 관계는 각주로 표시한 잠정 번역입니다.
