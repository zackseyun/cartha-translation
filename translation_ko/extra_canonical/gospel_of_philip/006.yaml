base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: ko
  text: “예수”는 감추어진 이름이고, “그리스도”는 드러난 이름입니다. 그러므로 “예수”는 번역되지 않으며, 그분은 “예수”라는 자기 이름으로 불립니다. 그러나 “그리스도”라는 이름은 시리아어로 “메시아”이고, 그리스어로 “그리스도”이며, 그 밖의 모든 이들도 저마다 자기 언어에 따라 그것을 가지고 있습니다.[a] “나사렛 사람”은 감추어진 것을 드러냅니다. 그리스도는 모든 것을 자기 안에 지니고 있습니다. 사람이든 천사든 신비든, 또 아버지든 그러합니다.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 밖의 모든 이들’과 ‘그것’이 정확히 누구와 무엇을 가리키는지는 이 영어 증언문만으로 확정하기 어렵습니다. 문맥상 각 언어권이 ‘그리스도’에 해당하는 이름을 지닌다는 뜻일 수 있습니다.
    reason: 대명사와 지시 대상의 모호성을 알리고 본문에서 과도하게 해소하지 않기 위해서입니다.
  - marker: b
    text: ‘나사렛 사람’이 무엇을 어떤 방식으로 드러내는지는 본문에 더 설명되어 있지 않습니다.
    reason: 역설적 표현의 신학적 의미를 특정 해석으로 제한하지 않기 위해서입니다.
  - marker: c
    text: 마지막 문장의 목록, 특히 ‘아버지’가 앞선 항목들과 맺는 문법적 관계는 불분명합니다. 번역은 이를 병렬 구조로 보존했습니다. 이 초안은 제공된 공개 영역 영어 증언문에 근거하며, 콥트어 원문 대조는 아직 이루어지지 않았습니다.
    reason: 문법적·신학적 긴장과 자료상의 한계를 투명하게 밝히기 위해서입니다.
lexical_decisions:
- source_word: hidden / revealed
  choice: 감추어진 / 드러난
  rationale: 이름에 관한 대조를 자연스러운 현대 한국어로 보존하면서, ‘비밀스러운’이나 ‘계시된’처럼 해석 범위를 좁힐 수 있는 표현을 피했습니다.
- source_word: Christ / Messiah
  choice: 그리스도 / 메시아
  rationale: 음역된 칭호들의 언어별 대응을 본문의 설명대로 구별하여 유지했습니다.
- source_word: the Nazarene
  choice: 나사렛 사람
  rationale: 예수의 출신지와 관련된 호칭이라는 기본 의미를 전달하되, 특정 교리적 의미를 덧붙이지 않았습니다.
- source_word: mystery
  choice: 신비
  rationale: 종교적·계시적 함의를 열어 둔 채 원문의 추상 명사를 간결하게 보존했습니다.
theological_decisions:
- issue: ‘감추어진 이름’과 ‘드러난 이름’의 관계
  choice: 두 표현의 대조를 그대로 제시했습니다.
  alternative: ‘예수’는 비밀 이름이고 ‘그리스도’는 계시된 칭호라고 풀이할 수 있습니다.
  rationale: 본문 자체가 그 대조의 신학적 의미를 명시적으로 해설하지 않으므로 이를 특정 명명론이나 계시론으로 확정하지 않았습니다.
- issue: ‘나사렛 사람’이 감추어진 것을 드러낸다는 진술
  choice: 주어와 목적어의 역설적인 진술을 그대로 유지했습니다.
  alternative: ‘나사렛 사람이라는 이름이 숨은 뜻을 밝혀 줍니다’라고 해설적으로 옮길 수 있습니다.
  rationale: 무엇이 어떻게 드러나는지 원문 증거가 불명확하므로 해석을 본문에 삽입하지 않았습니다.
- issue: 그리스도 안에 있는 것들의 목록과 ‘아버지’의 관계
  choice: 사람, 천사, 신비, 아버지를 병렬 항목으로 보존했습니다.
  alternative: ‘그리스도는 사람과 천사와 신비에 속한 모든 것, 그리고 아버지를 자기 안에 지닙니다’라고 문법 관계를 달리 잡을 수 있습니다.
  rationale: 영어 증언문의 ‘whether …, and the Father’가 문법적으로 긴장되어 있으므로, 아버지를 앞선 항목들과 분리하거나 그리스도와 아버지의 관계를 교리적으로 정리하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고유 칭호는 한국어 독자에게 익숙한 ‘예수’, ‘그리스도’, ‘메시아’로 표기했고, 짧고 선언적인 문장 리듬을 살렸습니다. 직접적인 콥트어 검토가 아직 이루어지지 않았으므로 번역의 확정성을 낮추고 영어 증언문의 모호성을 유지했습니다.
