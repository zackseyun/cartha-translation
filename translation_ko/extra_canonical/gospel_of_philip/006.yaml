source:
  text: '"Jesus" is a hidden name; "Christ" is a revealed name. So "Jesus" is not translated, but he''s called by his name "Jesus." But the name "Christ" in Syriac is "Messiah," in Greek "Christ," and all the others have it according to their own language. "The Nazarene" reveals what''s hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.'
