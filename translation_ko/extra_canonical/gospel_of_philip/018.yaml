translation:
  language: ko
  text: '방에 [들어갈] 사람은 누구나 자기 [등불]을 밝힐 것입니다. 그것은 밤에 치르는 혼인과 같기 때문입니다. 혼인은 […] 밤에 이루어지고, 불은 […] 밤에 타오르다가 꺼집니다. 그러나 이 혼인의 신비들은 낮과 빛 가운데 이루어집니다. 그날도 그 빛도 결코 지지 않습니다.


    누구든지 신방의 자녀가 되면 빛을 받을 것입니다. 누구든지 이곳에 있는 동안 그 빛을 받지 못하면 다른 곳에서도 받을 수 없을 것입니다. 그 빛을 받는 사람은 보이지도 않고 결박되지도 않을 것이며, 이런 사람은 세상에 머무는 동안에도 아무도 괴롭힐 수 없을 것입니다. 더욱이 그들이 세상을 떠날 때에는 이미 형상들 가운데서 진리를 받은 것입니다. 세상은 영원한 시대들이 되었습니다.[a] 영원한 시대가 그들에게 충만함이기 때문입니다. 그것은 이와 같습니다. 곧 그것은 그들에게만 드러납니다. 그것은 어둠과 밤 속에 감추어져 있는 것이 아니라, 완전한 낮과 거룩한 빛 속에 감추어져 있습니다.


    복음


    빌립에 따른'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘영원한 시대들’과 이어지는 단수형 ‘영원한 시대’는 원문의 복수와 단수의 대조를 반영합니다. 이 표현은 ‘영원한 세계들’로도 이해할 수 있습니다.
    reason: ‘age’에 해당하는 표현은 시간적 ‘시대’와 공간적·우주론적 ‘세계’ 양쪽 의미 가능성이 있어 독자에게 대안을 알립니다.
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: 방 / 신방
  rationale: 첫 문장의 일반적인 ‘방’과 이어지는 상징적 ‘신방’을 구분하여 문맥의 전개를 보존했습니다.
- source_word: mysteries
  choice: 신비들
  rationale: 복수형과 종교적·의례적 함의를 살리되 특정 교파의 전문 용어로 한정하지 않았습니다.
- source_word: child of the bridal chamber
  choice: 신방의 자녀
  rationale: 낯선 은유를 해석해 풀지 않고 원문의 긴장과 상징성을 보존했습니다.
- source_word: Truth
  choice: 진리
  rationale: 추상적·신학적 의미를 자연스럽게 전달하며, 대문자 표기는 한국어에서 별도로 재현하지 않았습니다.
- source_word: images
  choice: 형상들
  rationale: 단순한 시각적 ‘그림’보다 원문의 상징적·현현적 가능성을 열어 두고 복수도 보존했습니다.
- source_word: (eternal) ages / (eternal) age
  choice: 영원한 시대들 / 영원한 시대
  rationale: 괄호 속 보충 의미를 본문에 자연스럽게 반영하되, 복수와 단수의 대조를 유지했습니다.
- source_word: fullness
  choice: 충만함
  rationale: 문헌의 신학적 함의를 섣불리 풀어 쓰지 않으면서도 현대 한국어 독자가 이해할 수 있는 표현을 택했습니다.
- source_word: According to Philip
  choice: 빌립에 따른
  rationale: 후대 정경 복음서식 제목과 비슷한 형식을 살리면서 원문의 미완결적인 표제·콜로폰 성격을 유지했습니다.
theological_decisions:
- issue: ‘신방의 자녀’와 빛의 관계
  choice: 빛을 받는다는 조건적·상징적 진술을 그대로 유지
  alternative: 입문 의식, 구원 또는 특정 성례를 명시적으로 지칭하도록 해석
  rationale: 본문 자체가 의미를 명시하지 않으므로 특정 종파적 해석을 도입하지 않았습니다.
- issue: ‘보이지도 않고 결박되지도’의 의미
  choice: 수동 표현을 문자적으로 보존
  alternative: 악한 세력에게 인식되거나 붙잡히지 않는다고 명시
  rationale: 행위 주체와 대상이 불분명하므로 원문의 모호성을 유지했습니다.
- issue: ‘세상은 영원한 시대들이 되었다’의 시제와 존재론
  choice: 완료된 진술로 번역
  alternative: 세상이 장차 영원한 세계로 변한다고 미래적으로 해석
  rationale: 증언문의 완료적 표현을 존중하고 종말론적 체계를 덧붙이지 않았습니다.
- issue: 빛 속에 ‘감추어짐’이라는 역설
  choice: ‘완전한 낮과 거룩한 빛 속에 감추어져 있습니다’로 그대로 보존
  alternative: 빛 속에서 드러난다고 조화롭게 수정
  rationale: 앞 문장의 ‘드러남’과 뒤 문장의 ‘감추어짐’ 사이에 있는 의도적일 수 있는 긴장을 해소하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 문체는 장중하되 평이하게 유지했으며, 대괄호와 말줄임표는 사본의 복원 및 훼손 표시이므로 그대로 보존했습니다. 콥트어 원문 대조가 아직 이루어지지 않은 잠정 초안이므로, 제공된 공개 영역 영어 증언을 바탕으로 작성했습니다.
