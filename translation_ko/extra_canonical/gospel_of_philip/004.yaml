translation:
  language: ko
  text: '통치자들은 인류를 속이려 했습니다. 인류가 참으로 선한 이들과 같은 부류임을 그들이 보았기 때문입니다. 통치자들은 선한 이들의 이름을 가져다가 선하지 않은 자들에게 붙였습니다. 이름으로 인류를 속여 선하지 않은 자들에게 얽어매려는 것이었습니다. 그러고 나서는 그들에게 얼마나 큰 호의를 베푸는지요! 통치자들은 그들을 선하지 않은 자들에게서 데려다가 선한 이들 가운데 둡니다. 통치자들은 자신들이 무엇을 하는지 알고 있었습니다. 자유로운 이들을 데려다가 영원히 종살이하게 하려 했기 때문입니다. 어떤 권세들이 있어[a] […] 인류가 [구원받는] 것을 바라지 않습니다. 그들이 […] 되게 하려는 것입니다. 인류가 [구원받는다면] 희생 제사가 [일어나지 않을] 것이고 […] 권세들에게 짐승을 제물로 바치는 일도 없을 것이기 때문입니다. 제물을 받는 자들이 짐승들이었기 때문입니다. 짐승들은 산 채로 바쳐졌지만, 바쳐질 때 죽었습니다. 한 사람은 죽은 채로 하나님께 바쳐졌고, 그는 살아났습니다.


    그리스도께서 오시기 전에는 세상에 빵이 전혀 없었습니다. 마치 아담이 있던 낙원에는 짐승들이 먹을 나무가 많았지만 인류가 먹을 밀은 없었던 것과 같습니다. 인류는 짐승들처럼 먹곤 했습니다. 그러나 완전한 사람인 그리스도께서 오셨을 때, 그분은 하늘에서 빵을 가져오셔서 인류가 사람에게 맞는 양식을 먹게 하셨습니다.


    통치자들은 자신들의 힘과 뜻으로 그 일을 했다고 생각했지만, 성령께서는 그들을 통하여 자신이 원하시는 모든 것을 은밀히 이루고 계셨습니다. 처음부터 존재해 온 진리는 어디에나 뿌려집니다. 그것이 뿌려지는 것을 보는 사람은 많지만, 거두어지는 것을 보는 사람은 적습니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 대목의 대괄호와 줄임표는 사본의 훼손 또는 복원된 글자를 나타냅니다. 따라서 문장 연결이 불완전합니다.
    reason: 독자가 본문의 단절을 번역상의 오류로 오해하지 않도록 사본 상태를 알립니다.
  - marker: b
    text: 이 번역은 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 콥트어 원문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 현재 제공된 자료의 출처 한계와 번역의 잠정성을 투명하게 밝힙니다.
lexical_decisions:
- source_word: rulers
  choice: 통치자들
  rationale: 우주적 권세를 가리킬 가능성을 열어 두면서도, 제공된 증언의 기본 의미를 직접적으로 보존했습니다.
- source_word: humanity
  choice: 인류
  rationale: 개별 남성이나 한 사람으로 좁히지 않고 집합적 의미를 유지했습니다.
- source_word: kinship
  choice: 같은 부류임
  rationale: 혈연만을 뜻하는 ‘친족 관계’로 한정하지 않고, 존재적 연관성과 친연성을 자연스러운 한국어로 보존했습니다.
- source_word: powers
  choice: 권세들
  rationale: 정치적 권력만이 아니라 초인간적 세력을 포함할 수 있는 의미 폭을 유지했습니다.
- source_word: the perfect human
  choice: 완전한 사람
  rationale: ‘완전한 인간’보다 자연스럽고 존엄한 문체를 택하면서, 그리스도의 인성에 관한 원문의 표현을 해석적으로 확대하지 않았습니다.
- source_word: bread / food of humanity
  choice: 빵 / 사람에게 맞는 양식
  rationale: 빵의 구체적 심상은 보존하고, 반복되는 후반 표현은 짐승의 먹이와 대비되는 인간 고유의 양식이라는 뜻이 드러나게 옮겼습니다.
theological_decisions:
- issue: 선한 이들과 인류의 ‘kinship’ 성격
  choice: 같은 부류임
  alternative: 친족 관계가 있음
  rationale: 혈통, 본성, 영적 친연성 가운데 하나로 단정하지 않고 원문의 긴장을 유지했습니다.
- issue: ‘what a favor they do’의 어조
  choice: 얼마나 큰 호의를 베푸는지요!
  alternative: 그들은 참으로 호의를 베풉니다
  rationale: 문맥상 반어일 수 있지만 번역문 자체가 반어라고 확정하지 않도록 감탄문의 모호성을 보존했습니다.
- issue: 죽은 채 하나님께 바쳐진 ‘한 사람’의 정체
  choice: 한 사람
  alternative: 그 사람 또는 그리스도
  rationale: 그리스도를 암시할 수 있으나 원문 증언의 비한정적 표현을 명시적 동일시로 바꾸지 않았습니다.
- issue: 성령의 행위와 통치자들의 행위 관계
  choice: 성령께서는 그들을 통하여 … 이루고 계셨습니다
  alternative: 성령이 그들의 행위를 조종하셨습니다
  rationale: 통치자들의 책임과 성령의 숨은 역사를 함께 진술하되, 강제 조종이라는 추가 교리를 들여오지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 신학적 용어는 존엄성을 유지하되 일반 독자가 이해할 수 있도록 했으며, 사본 훼손 표지인 대괄호와 줄임표를 그대로 보존했습니다. 하나님과 성령에는 한국어 기독교 문체에서 자연스러운 높임을 적용했지만 통치자들에게는 적용하지 않았습니다.
