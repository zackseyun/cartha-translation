id: GPHIL.004
reference: Gospel of Philip — The Rulers
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'The rulers wanted to deceive humanity, because they (the rulers) saw that they (humanity) had a kinship with those that are truly good. They took the name of those that are good and gave it to those that aren''t good, to deceive them (humanity) by the names and bind them to those that aren''t good; and then, what a favor they do for them! They take them from those that aren''t good and place them among those that are good. They knew what they were doing, because they wanted to take those who were free and place them in slavery forever. There are powers that exist […] humanity, not wanting them to be [saved], so that they may be […] because if humanity [was saved], sacrifices [wouldn''t] happen […] and animals offered up to the powers, because those to whom offerings were made were animals. They were offered up alive, but when they were offered up they died. A human was offered up to God dead, and he lived.


    Before Christ came, there wasn''t any bread in the world – just as Paradise, where Adam was, had many trees to feed the animals but no wheat to feed humanity. Humanity used to eat like the animals, but when Christ, the perfect human, came, he brought bread from heaven so that humanity would be fed with the food of humanity.


    The rulers thought they did what they did by their own power and will, but the Holy Spirit was secretly accomplishing everything it wanted to through them. Truth, which has existed from the beginning, is sown everywhere; and many see it being sown, but few see it being reaped.'
