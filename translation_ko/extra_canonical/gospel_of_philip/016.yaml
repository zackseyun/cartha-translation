translation:
  language: ko
  text: '세상은 네 가지로 경작됩니다. 물과 흙과 바람과 빛을 통해 곡식을 곳간에 거두어들입니다. 이와 마찬가지로 하나님께서도 네 가지, 곧 믿음과 소망과 사랑과 지식을 통해 경작하십니다. 우리의 흙은 우리가 뿌리내린 믿음입니다. [그리고] [물]은 우리가 양분을 얻는 소망입니다. 바람은 우리가 자라게 하는 사랑입니다. 빛은 우리가 [여물게] 하는 지식입니다.


    은혜에는 [네 종류가 있습니다. 곧] 땅에 속한 것과 [하늘에 속한 것과, …] 하늘의 하늘 […]을 통하여 [….] […] 혼을 갖지 않은 사람은 복됩니다. 이분은 예수 그리스도이십니다. 그분은 두루 다니셨지만 아무에게도 짐을 지우지 않으셨습니다. 그러므로 이와 같은 사람은 복됩니다. 그는 완전한 사람이기 때문입니다. 말씀은 그런 삶을 한결같이 이어 가기가 얼마나 어려운지 우리에게 알려 줍니다. 우리가 어떻게 이처럼 큰 일을 이룰 수 있겠습니까? 그가 어떻게 모든 사람을 쉬게 하겠습니까?


    무엇보다도 먼저, 큰 사람이든 작은 사람이든, 믿지 않는 사람이든 믿는 사람이든, 어느 누구도 근심하게 해서는 안 됩니다. 그런 뒤에 넉넉한 이들 가운데서 [이미] 쉬고 있는 사람들을 쉬게 해야 합니다. 넉넉한 사람을 쉬게 해 줌으로 유익을 얻는 이들이 있습니다. 선을 행하는 사람은 그들을 쉬게 할 수 없습니다. 그는 마음대로 무엇이든 할 수 없고, 남을 괴롭게 할 수 없으므로 근심하게 하지도 못하기 때문입니다. 그러나 때로는 넉넉한 사람이 그를 근심하게 합니다. 그가 그런 사람이어서가 아니라, 그들 자신의 악이 그들을 근심하게 하는 것입니다. [완전한 사람의] 본성을 지닌 이는 선한 사람에게 기쁨을 주지만, 어떤 이들은 이것 때문에 몹시 근심합니다.


    어떤 집주인이 자녀와 종과 소와 개와 돼지, 밀[과] 보리와 짚과 풀과 […] 고기와 도토리에 이르기까지 모든 것을 마련했습니다. [그는] 지혜로워서 각각에게 무엇을 먹여야 하는지 알았습니다. 자녀들에게는 빵을 내주었고 […] 그러나 [… 종]들에게는 […]을 내주었으며, 소들에게는 [보리]와 짚과 풀을 던져 주었습니다. 개들에게는 뼈를 던져 주고, [돼지들에게는] 도토리와 음식 찌꺼기를 던져 주었습니다.


    하나님의 제자도 이와 같습니다. 제자가 지혜롭다면 제자가 된다는 것이 무엇을 뜻하는지 압니다. 그는 겉으로 드러난 몸의 모습에 속지 않고, 각 사람의 혼이 어떤 상태인지 살펴 그에 맞게 말할 것입니다. 세상에는 사람의 모습을 하고 만들어진 짐승이 많습니다. 제자는 그들을 알아봅니다. 돼지들에게는 도토리를 던져 주고, 소들에게는 짚과 풀을 섞은 보리를 던져 줄 것입니다. 개들에게는 뼈를 던져 주고, 종들에게는 전채를 주며, 자녀들에게는 완전한 [음식]을 줄 것입니다.


    사람의 아들이 있고, 사람의 아들의 아들이 있습니다.[a] 주님은 사람의 아들이시며, 사람의 아들의 아들은 사람의 아들을 통하여 창조하는 사람입니다. 사람의 아들은 하나님에게서 창조할 능력을 받았습니다. 그에게는 낳을 능력도 있습니다. 창조할 능력을 받은 이는 피조물이고, 낳을 능력을 받은 이는 태어난 존재입니다. 창조하는 이는 낳을 수 없지만, 낳는 이는 창조할 수 있습니다. 사람들은 “창조하는 이가 낳는다”라고 말합니다. 그러나 그들이 낳는 것은 피조물입니다. [그러므로] 그들이 낳은 것들은 그들의 자녀가 아니라 […]입니다. 창조하는 이는 [드러나게] 일하며, 그 자신도 [드러납니다]. 낳는 이는 [은밀히] 낳으며, 그들은 […] 형상 속에 숨겨져 있습니다. [다시 말해], [창조하는 이는] 드러나게 [창조하지만], 낳는 이는 은밀히 자녀를 [낳습니다].


    [남편]과 아내가 서로 결합할 때에는 그들 자신 말고는 아무도 [알 수 없습니다]. 세상의 혼인도 혼인한 이들에게는 신비이기 때문입니다. 더럽혀진 혼인도 감추어져 있다면, 더럽혀지지 않은 혼인은 얼마나 더 참된 신비이겠습니까! 그것은 육체에 속하지 않고 순수하며, 욕망에서 비롯되지 않고 뜻에서 비롯됩니다. 그것은 어둠이나 밤에 속하지 않고 낮과 빛에 속합니다.


    혼인이 벌거벗겨져 드러나면 음란한 구경거리가 됩니다. 신부가 다른 남자의 씨를 받아들일 때만 그런 것이 아닙니다. 신부가 신방에서 나와 다른 이들의 눈에 띄기만 해도 그는 간음하는 것입니다. 신부는 자기 아버지와 어머니와 들러리와 신랑의 자녀들에게 자신을 드러내십시오. 그들은 날마다 신방에 들어갈 수 있습니다. 그러나 다른 이들은 신부의 목소리를 듣고 그의 향기를 누리기만을 갈망하게 하며, 개들처럼 식탁에서 떨어지는 부스러기를 먹게 하십시오. 신랑과 신부는 신방에 속합니다. 누구도 [그들과 같은 사람이 되지] 않고서는 신랑과 신부를 볼 수 없을 것입니다.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 아들’과 ‘사람의 아들의 아들’은 원문 증거가 의도하는 구별을 보존한 표현입니다. 후자를 곧바로 특정한 교리적 칭호로 규정하지 않았습니다.
    reason: 낯선 반복 표현과 그 신학적 모호성을 독자에게 알립니다.
  - marker: b
    text: 이 번역은 제공된 공개 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 대괄호는 훼손된 사본에서 복원된 말이나 불완전한 구절을, […]은 결락을 나타냅니다. 콥트어 원문에 대한 직접 검토가 필요합니다.
    reason: 직접 원어 검토가 보류된 자료적 한계와 결락 표기법을 명시합니다.
lexical_decisions:
- source_word: farm / farmed
  choice: 경작하다 / 경작되다
  rationale: 농경 비유를 유지하면서 하나님이 믿음·소망·사랑·지식을 통해 사람을 기르신다는 문맥의 확장을 보존했습니다.
- source_word: knowledge
  choice: 지식
  rationale: ‘앎’도 가능하지만 네 덕목의 병렬과 개념적 성격을 선명하게 나타내기 위해 ‘지식’을 택했습니다.
- source_word: soul
  choice: 혼
  rationale: ‘영혼’으로 확장하여 영과 혼을 동일시하지 않고, 고대 문헌의 인간론적 긴장을 보존했습니다.
- source_word: Son of Humanity
  choice: 사람의 아들
  rationale: 전통적인 ‘인자’보다 일반 독자가 구성상의 반복과 ‘사람의 아들의 아들’이라는 표현을 알아보기 쉽도록 풀어 옮겼습니다.
- source_word: beget / begotten
  choice: 낳다 / 태어난 존재
  rationale: ‘창조하다/피조물’과 대비되는 생식·발생의 비유를 유지하되, 교리적으로 특정한 ‘독생’ 용어를 들여오지 않았습니다.
- source_word: bridal chamber
  choice: 신방
  rationale: 혼인과 은밀한 결합이라는 상징을 간결하고 품위 있게 전달합니다.
- source_word: pornography
  choice: 음란한 구경거리
  rationale: 현대의 영상물 장르로 좁혀 오해하지 않도록, 공개적으로 벌거벗겨져 관람 대상이 된다는 문맥을 살렸습니다.
theological_decisions:
- issue: ‘혼을 갖지 않은 사람’이라는 훼손 구절
  choice: 문장 구조를 보존하고 결락을 표시함
  alternative: ‘혼을 괴롭히지 않은 사람’ 등으로 의미를 보충함
