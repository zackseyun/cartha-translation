  revised_text: '세상은 네 가지를 통하여 경작됩니다. 물과 흙과 바람과 빛을 통하여 곳간에 거두어집니다. 이와 마찬가지로 하나님께서도 네 가지, 곧 믿음과 소망과 사랑과 지식을 통하여 경작하십니다. 우리의 흙은 우리가 뿌리내린 믿음입니다. [그리고] [물]은 우리가 양분을 얻는 소망입니다. 바람은 우리가 자라게 하는 사랑입니다. 빛은 우리가 [여물게] 하는 지식입니다.


