    [남편이] 아내와 서로 결합할 때를 그들 자신 외에는 아무도 [알 수 없을 것입니다]. 세상의 혼인은 혼인한 이들에게 신비이기 때문입니다. 더럽혀진 혼인도 감추어져 있다면, 더럽혀지지 않은 혼인은 얼마나 더 참된 신비이겠습니까! 그것은 육체에 속하지 않고 순수하며, 욕망에서 비롯되지 않고 의지에서 비롯됩니다. 그것은 어둠이나 밤에 속하지 않고 낮과 빛에 속합니다.


