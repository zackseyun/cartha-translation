base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: ko
  text: '**빌립복음 — 동정녀 탄생**


    어떤 이들은 “마리아가 성령으로 말미암아 잉태했습니다”라고 말합니다. 그들은 잘못 알고 있으며, 자기가 무슨 말을 하는지도 모릅니다. 여자가 여자에 의해 잉태한 일이 언제 있었습니까?[a] “마리아는 어떤 권세도 더럽히지 못한 처녀입니다”라는 말은 (첫) 사도들과 (그) 사도 계승자들이 된 히브리인들의 위대한 증언입니다. 어떤 권세도 더럽히지 못한 그 처녀는 […] 권세들이 자기 자신을 더럽혔습니다.[b]


    또한 주께 다른 아버지가 없었다면, 주께서는 “하늘에 계신 나의 [아버지]”라고 말씀하지 [않으셨을] 것입니다. 그 대신 그저 [“나의 아버지”]라고 말씀하셨을 것입니다. 주께서 [제자들에게 말씀하셨습니다. “……] 모든 [집에서] 가져다가 아버지의 집으로 들이십시오. 그러나 아버지의 집에서 아무것도 훔치거나 가지고 나가지 마십시오.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 반문은 ‘영’에 해당하는 말이 여성 문법 성으로 이해되는 언어적 배경을 전제하는 것으로 보입니다. 현재 번역은 제공된 영어 증거문을 바탕으로 한 잠정 번역이며, 콥트어 원문 대조가 필요합니다.
    reason: 현대 한국어의 ‘성령’만으로는 본문의 여성 지칭 논리가 드러나지 않으며, 직접 원어 검토가 아직 이루어지지 않았음을 알립니다.
  - marker: b
    text: 이 대목에는 사본의 결락이 있어 ‘처녀’와 ‘권세들’ 사이의 정확한 문장 관계를 확정하기 어렵습니다.
    reason: 생략 부호 주변의 문법적·신학적 불확실성을 보존합니다.
  - marker: c
    text: 대괄호는 사본이 손상되었거나 번역자가 문맥에 따라 복원한 부분을, 줄임표는 읽을 수 없는 결락을 나타냅니다. 특히 마지막 말씀은 앞부분이 크게 손상되어 정확한 뜻이 불확실합니다.
    reason: 복원과 결락 신호를 독자가 본문 자체와 혼동하지 않도록 설명합니다.
lexical_decisions:
- source_word: Holy Spirit
  choice: 성령
  rationale: 현대 한국어 독자에게 익숙하고 문맥상 자연스러운 명칭입니다. 다만 이어지는 ‘여자가 여자에 의해’라는 논증의 문법적 배경은 각주에서 보존했습니다.
- source_word: power / powers
  choice: 권세 / 권세들
  rationale: 단순한 힘이나 능력보다 인격적·우주적 세력을 가리킬 가능성이 큰 문맥을 살리면서도, 원문의 단수와 복수 대조를 유지했습니다.
- source_word: defiled
  choice: 더럽히다
  rationale: 성적 훼손과 종교적·도덕적 오염을 함께 암시할 수 있는 원문의 폭을 좁히지 않습니다.
- source_word: apostolic (successors)
  choice: (그) 사도 계승자들
  rationale: 제공된 영어 증거문의 보충 표시를 괄호로 보존하고, 후대의 특정 교파적 직분 개념을 덧붙이지 않았습니다.
- source_word: Father’s house
  choice: 아버지의 집
  rationale: 상징적 의미를 해석하여 풀어 쓰지 않고 가족적·신학적 표현을 그대로 유지했습니다.
theological_decisions:
- issue: ‘여자가 여자에 의해 잉태한다’는 반문의 의미
  choice: 성령을 여성으로 지칭하는 원문의 논리를 그대로 번역
  alternative: 성령의 성별 논증을 완화하거나 ‘어머니’ 등으로 해설하여 번역
  rationale: 본문의 낯설고 논쟁적인 신학적 주장을 교정하지 않고 보존했습니다.
- issue: ‘다른 아버지’의 정체
  choice: ‘다른 아버지’로만 번역
  alternative: ‘육신의 아버지’ 또는 특정 인물을 명시
  rationale: 본문이 그 정체를 명시하지 않으므로 해석을 덧붙이지 않았습니다.
- issue: 권세들이 자신을 더럽혔다는 진술
  choice: 문법적 긴장과 역설을 그대로 유지
  alternative: 처녀를 더럽히려다가 실패했다는 식으로 인과관계를 보충
  rationale: 결락으로 인해 문장 관계가 불확실하므로 신학적 서사를 재구성하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 논쟁적 단언은 완화하지 않았고, 손상된 문장은 매끄럽게 재구성하지 않은 채 대괄호·괄호·줄임표를 보존했습니다. 직접 콥트어 검토 전의 잠정 출판 초안입니다.
