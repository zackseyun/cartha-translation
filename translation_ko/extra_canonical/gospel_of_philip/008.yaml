  source_fidelity: 공급된 영어 증언을 기준으로 볼 때 전반적인 의미와 반복 구조는 잘 보존되었습니다. 다만 첫 문장의 ‘사로잡으셨습니다’는 ‘took’에 포획·정복의 의미를 더할 수 있어, 더 중립적인 ‘은밀히 데려가셨습니다’가 안전합니다. 또한 영어 증언의 대괄호는 복원·결손 신호이므로, 작은 이들에게 나타난 구절에 근거 없이 추가된 대괄호는 제거하고, 큰 이들 및 천사들에 관한 복원 신호는 한국어에서 가능한 범위 안에 일관되게 반영하는 편이 낫습니다. 콥트어 직접 대조는 제공 자료상 아직 불가능하므로, 판단은 영어 증언에 잠정적으로 한정됩니다.
  naturalness: 현대 표준 한국어 합쇼체로 대체로 자연스럽고, ‘큰 이/작은 이’의 다소 낯선 반복도 원문의 의도적 대조를 보존하는 데 적절합니다. ‘은밀히 데려가셨습니다’가 ‘남몰래 사로잡으셨습니다’보다 현대어에서 덜 과잉 해석적입니다.
  terminology: ‘말씀’, ‘성찬례’, ‘성령’, ‘형상들’, ‘어린양’은 교파적 해설을 덧붙이지 않으면서 영어 증언의 용어와 상징성을 적절히 보존합니다. 성찬례 발화의 호격·명령 구문은 난해하지만, 현행의 ‘…하신 분이여’는 가능한 해석으로 유지할 수 있으며 주석이 그 불확실성을 충분히 알립니다.
