translation:
  language: ko
  text: '예수께서는 그들 모두를 남몰래 사로잡으셨습니다. 그분은 본래 모습대로 나타나지 않으시고, 그들이 볼 수 있는 모습으로 나타나셨기 때문입니다. 그분은 그들에게 (이 [모든] 방식으로) 나타나셨습니다. 큰 이들에게는 큰 이로 [나타나셨고], 작은 이들에게는 작은 이로 [나타나셨습니다]. 천사들에게는 천사로 [나타나셨고], 사람들에게는 사람으로 나타나셨습니다. 그리하여 그분의 말씀은 모든 이에게서 자신을 감추었습니다. 어떤 이들은 그분을 보고도 자기 자신을 보고 있다고 생각했습니다. 그러나 그분이 산 위에서 영광 가운데 제자들에게 나타나셨을 때에는 작지 않으셨습니다. 그분은 크게 되셨으며, 제자들도 크게 하셔서 그들이 그분을 큰 분으로 볼 수 있게 하셨습니다.


    그날 성찬례[a] 중에 그분은 이렇게 말씀하셨습니다. “완전한 빛을 성령과 하나 되게 하신 분이여, 천사들도 형상들과 함께 우리와 하나 되게 해 주십시오!”[b]


    어린양을 업신여기지 마십시오. 그가 없이는 문을 볼 수 없기 때문입니다. 아무도 벌거벗은 채로 왕에게 가까이 갈 수 없을 것입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘성찬례’는 공급된 영어 증언의 Eucharist를 옮긴 말입니다. 콥트어 원문에 대한 직접 검토가 아직 이루어지지 않았습니다.
    reason: 번역의 자료적 한계를 밝히고 의례 용어의 잠정성을 표시합니다.
  - marker: b
    text: 이 문장은 손상 또는 복원이 반영된 난해한 대목이며, ‘당신/너희’, ‘천사들’, ‘형상들’ 사이의 문법적 관계가 불확실합니다. 여기서는 첫 구절을 호격으로 이해했습니다.
    reason: 통사적·신학적 모호성을 독자에게 알리고 선택한 해석을 투명하게 제시합니다.
lexical_decisions:
- source_word: took all of them by stealth
  choice: 그들 모두를 남몰래 사로잡으셨습니다
  rationale: ‘took’의 의미가 불확실한 영어 증언을 바탕으로 하되, 단순히 물리적으로 ‘데려갔다’고 확정하지 않고 은밀한 포착·획득의 뉘앙스를 살렸습니다.
- source_word: his Word
  choice: 그분의 말씀
  rationale: 인격적 로고스인지 발화된 말씀인지 확정하지 않고 한국어의 ‘말씀’으로 양쪽 가능성을 열어 두었습니다.
- source_word: great / small
  choice: 큰 / 작은
  rationale: 지위, 영적 역량, 외양 가운데 하나로 해석해 풀어 쓰지 않고 반복되는 대조를 그대로 보존했습니다.
- source_word: Eucharist
  choice: 성찬례
  rationale: 고대 의례를 가리키는 통상적이고 격식 있는 표현을 사용하되 특정 교단의 성찬 신학을 덧붙이지 않았습니다.
- source_word: images
  choice: 형상들
  rationale: ‘상’, ‘모상’, ‘이미지’로 교리화하지 않고 원문의 다의성을 비교적 넓게 유지했습니다.
- source_word: lamb
  choice: 어린양
  rationale: 상징적·그리스도론적 가능성을 보존하는 성서적 표현을 사용하되 지시 대상을 본문에서 확정하지 않았습니다.
theological_decisions:
- issue: 예수의 가변적 현현
  choice: 대상에 따라 여러 모습으로 나타났다는 진술을 문자적으로 보존했습니다.
  alternative: 성육신이나 가현설의 틀로 명시적으로 해설하는 번역
  rationale: 본문 자체의 신학적 긴장을 특정 교리 체계로 해소하지 않았습니다.
- issue: ‘말씀’의 정체
  choice: ‘그분의 말씀’으로 옮겼습니다.
  alternative: ‘그분 곧 말씀’ 또는 ‘그분의 말’
  rationale: 말씀이 예수 자신을 뜻하는지, 그분의 계시·발화를 뜻하는지에 관한 모호성을 유지했습니다.
- issue: 성찬례 발언의 호칭과 명령 구조
  choice: 첫 구절을 호격으로 읽어 ‘…하신 분이여’로 옮겼습니다.
  alternative: 제자들에게 ‘완전한 빛을 성령과 결합한 너희여’라고 직접 말하는 번역
  rationale: 영어 증언의 ‘You who’ve…’는 단수·복수 및 지시 대상이 불분명하므로 가능한 통사 해석 하나를 본문에 두되 주석으로 불확실성을 밝혔습니다.
- issue: 어린양과 문과 왕의 상징
  choice: 상징들을 해설 없이 그대로 유지했습니다.
  alternative: 어린양을 예수, 문을 구원, 옷을 성례나 의로 명시하는 번역
  rationale: 본문이 명시하지 않은 대응 관계를 특정 교리로 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했고, 경전 문체의 품위를 유지하되 지나치게 고어적인 표현은 피했습니다. 대괄호와 괄호는 공급된 영어 증언의 복원 및 보충 신호를 가능한 한 보존했습니다. 다만 이 초안은 콥트어 직접 대조 전의 잠정 번역입니다.
