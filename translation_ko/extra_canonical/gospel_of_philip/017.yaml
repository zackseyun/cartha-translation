  revised_text: '아브라함이 […] 자기가 보게 될 것을 보려고 했을 때, [그는] 포피의 살을 베어 할례를 행하여, 육체를 없애야 한다는 것을 [우리에게 알렸습니다].[a]



    세상의 [대부분의 것들은 그] 속이 감추어져 있는 동안에는 서서 살아갈 수 있습니다. [그것들이 드러나면] 죽습니다. 눈에 보이는 사람이 그 [보기]입니다. 사람의 내장이 감추어져 [있는 동안에는] 그 사람이 살아 있습니다. 그러나 내장이 드러나 몸 밖으로 나오면 그 사람은 죽을 것입니다. 나무도 마찬가지입니다. 뿌리가 감추어져 있는 동안에는 꽃을 피우고 자랍니다. 그러나 뿌리가 드러나면 나무는 말라 버립니다. 세상에서 태어난 모든 것이 이와 같습니다. 드러난 것뿐 아니라 감추어진 것도 그러합니다. 악의 뿌리는 감추어져 있는 동안 강하기 때문입니다. 그러나 그것을 인식하면 풀어지고, 드러나면 죽습니다. 그러므로 말씀이 이렇게 말합니다. “이미 도끼가 나무들의 뿌리에 놓여 있습니다.”[b] 도끼는 그저 베기만 하지 않을 것입니다. 베인 것은 다시 꽃을 피우기 때문입니다. 오히려 도끼는 뿌리를 끌어낼 때까지 땅속을 파고듭니다. 예수께서는 뿌리를 완전히 뽑으셨지만, 다른 이들은 일부만 뽑았습니다. 그러므로 우리는 저마다 자기 안에 있는 악의 뿌리까지 파고 내려가, 우리 안에서 그것을 뿌리째 뽑아냅시다. 우리가 그것을 인식하면 뿌리 뽑힐 것입니다. 그러나 인식하지 못하면 그것은 우리 안에 뿌리를 내리고 우리 안에서 열매를 맺습니다. 그것은 우리를 지배하고, 우리는 억지로 그것을 섬기게 됩니다. 그것은 우리를 사로잡아 우리가 원하지 [않는] 일을 하게 하고, 우리가 원하는 일은 하지 [못하게] 합니다.[c] 우리가 그것을 인식하지 못했기 때문에 [그것은] 강합니다. [그것이 존재하는] 동안에는 활동합니다. [무지]는 [모든 악의] 어머니입니다. 무지는 [죽음을 일으킬 것입니다. 무지]에서 생겨난 것은 존재한 적도 없고, 지금 [존재하지도] 않으며, 앞으로 생겨나지도 않을 것이기 [때문입니다]. […] 온전한 진리가 드러날 때 그것들은 완전해질 것입니다.[d] 진리는 무지와도 같습니다. 감추어져 있을 때에는 자기 안에서 쉬지만, 드러나 인식되면 무지와 오류보다 강하므로
    영광을 받습니다. 진리는 자유를 줍니다. 말씀이 이렇게 말합니다. “여러분이 진리를 알면, 진리가 여러분을 자유롭게 할 것입니다.”[e] 무지는 종살이이고 앎은 자유입니다. 우리가 진리를 알면 우리 안에서 진리의 열매를 찾을 것입니다. 우리가 진리와 하나가 되면, 진리는 우리의 충만함을 받아들일 것입니다.



    이제 우리에게는 창조 세계에서 드러난 것이 있습니다. 우리는 이렇게 말합니다. “강한 것들은 존귀하지만, 감추어진 것들은 약하고 멸시받습니다.” 진리에서 드러난 것들도 이와 같습니다. 그것들은 약하고 멸시받지만, 감추어진 것들은 강하고 존귀합니다. 그러나 진리의 신비들은 모형과 형상으로 드러납니다.[f]



    그러나 방은 감추어져 있습니다. 그곳은 거룩한 것 안의 거룩한 곳입니다.[g] 처음에는 휘장이 하나님께서 창조 세계를 다스리신 방식을 가리고 있었습니다. 그러나 휘장이 찢어져 안에 있는 것이 드러나면, 이 집은 사막[처럼] 버려질 것입니다. 아니, 오히려 [파괴될] 것입니다. 그러면 모든 신성이 이곳들[에서] 달아날 것입니다. 지성소로 달아나는 것은 아닙니다. 그것은 순수한 [빛]과 [흠 없는] 충만함에 결합할 수 없기 때문입니다. [오히려] 그것은 십자가의 날개 아래, [그] 팔 아래에 있게 될 것입니다. 홍수가 그들 위로 밀려올 때 이 방주는 [그들의] 구원이 될 것입니다.[h] 어떤 이들이 제사장직에 속해 있다면, 그들은 대제사장과 함께 휘장 안으로 들어갈 수 있을 것입니다. 그러므로 휘장은 위쪽만 찢어진 것이 아닙니다. 그랬다면 위에 있는 이들에게만 열렸을 것입니다. 아래쪽만 찢어진 것도 아닙니다. 그랬다면 아래에 있는 이들에게만 드러났을 것입니다. 도리어 휘장은 위에서 아래까지 찢어졌습니다. 위에 있는 이들이 우리에게 아래를 열어 주어, 우리가 진리의 비밀로 들어가게 했습니다. 이것이야말로 참으로 존귀하고 강한 것입니다. 그러나 우리는 멸시받는 모형들과 약한 것들을 통하여 그곳에 들어갈 것입니다. 그것들은 완전한 영광 앞에서 낮아집니다. 영광보다 더 나은 영광이 있고, 능력보다 더 나은 능력이 있습니다. 이처럼 완전한 것이 진리의 비밀들과 함께 우리에게 열렸고, 지성소가 드러났으며, 그 방이 우리를 안으로 초대했습니다.



    악은 감추어져 있는 동안 활동하지 않지만, 성령의 씨 가운데서 제거된 것은 아닙니다. 그들은 악의 종입니다.[i] 그러나 악이 드러날 때에는 완전한 빛이 모든 사람 위에 흘러나오고, 그 빛 안에 있는 모든 이가 [기름부음을 받을] 것입니다.[j] 그때 종들은 자유롭게 되고 포로들은 속량될 것입니다. “[하늘에 계신] 내 아버지께서 심지 [않으신 모든] 식물은 [뿌리 뽑힐] 것입니다.”[k] 갈라져 있던 이들은 하나가 되고 […] 충만해질 것입니다.'
