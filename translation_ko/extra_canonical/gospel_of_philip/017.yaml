  naturalness: 현대 표준 한국어 합쇼체는 대체로 자연스럽습니다. 다만 ‘방’과 ‘거룩한 것 안의 거룩한 곳’ 같은 낯선 표현은 원문의 의도적 상징성과 모호성을 보존하므로 유지할 수 있습니다. ‘알아보면’보다 ‘인식하면’이 이 문맥의 반복과 추상적 논증에 더 자연스럽고 일관됩니다.
