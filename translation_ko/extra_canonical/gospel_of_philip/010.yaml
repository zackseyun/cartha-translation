  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: ko
  text: '사람에게 복종하는 짐승들이 있습니다. 송아지와 나귀와 그 밖의 이런 짐승들입니다. 복종하지 않고 광야에서 홀로 사는 짐승들도 있습니다. 사람은 복종하는 짐승들과 함께 밭을 갈며, 그 결과 자신뿐 아니라 복종하는 짐승과 복종하지 않는 짐승을 모두 먹여 살립니다. 완전한 사람도 이와 같습니다. 그는 복종하는 권세들과 함께 밭을 갈아, 앞으로 존재하게 될 모든 이를 위하여 마련합니다. 그러므로 선한 것이든 악한 것이든, 오른쪽이든 왼쪽이든, 온 영역이 존속합니다. 성령께서는 모두를 돌보시며 모든 권세를 다스리십니다. 곧 복종하는 권세와 [복종하지 않는] 권세와 홀로 있는 권세를 다스리십니다. 참으로 성령께서 그들을 […] 가두시므로, [그들이 …] 원하더라도 [떠날] 수 없기 때문입니다.[a]


    [빚어진 이는] [아름답지만], 그의 자녀들은 고귀한 형상들임을 알게 될 것입니다. 그가 빚어진 것이 아니라 낳아진 것이었다면, 그의 씨가 고귀했음을 알게 될 것입니다. 그러나 이제 그는 빚어졌고 또 낳았습니다. 이것이 무슨 고귀함입니까? 먼저 간음이 있었고, 그다음에는 살인이 있었습니다. 그(가인)는 간음으로 태어났으니, 뱀의 아들이었기 때문입니다.[b] 그 때문에 그도 자기 아버지처럼 살인자가 되어 자기 형제(아벨)를 죽였습니다. 서로 같지 않은 이들 사이의 모든 결합은 간음입니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 말은 훼손된 사본에서 복원되었거나 문맥상 보충된 부분이며, […]는 읽을 수 없어 빠진 부분입니다. 이 문장의 정확한 연결은 사본 훼손 때문에 불확실합니다.
    reason: 사본의 결락과 편집상 복원을 독자에게 명시하고, 불확실한 구문을 확정적으로 보이지 않게 하기 위해서입니다.
  - marker: b
    text: ‘가인’과 뒤의 ‘아벨’은 문맥에 따른 인물 식별을 괄호로 밝혀 놓은 것입니다.
    reason: 영어 증언 본문의 편집상 설명을 본문 자체의 명명과 구별하기 위해서입니다.
lexical_decisions:
- source_word: submit / submissive
  choice: 복종하다 / 복종하는
  rationale: 짐승과 권세에 반복 적용되는 핵심 비유의 연결을 보존하기 위해 같은 어근으로 옮겼습니다.
- source_word: perfect human
  choice: 완전한 사람
  rationale: 도덕적 무결함이나 특정 교리적 지위를 덧붙이지 않고 원문의 표현을 직접적으로 보존했습니다.
- source_word: powers
  choice: 권세들
  rationale: 단순한 능력보다 인격적·우주적 세력을 가리킬 가능성을 살리되, 그 정체를 단정하지 않았습니다.
- source_word: the whole place
  choice: 온 영역
  rationale: 물리적 장소로만 좁히지 않으면서도 원문의 공간적 표현을 유지했습니다.
- source_word: shepherds
  choice: 돌보시며
  rationale: 한국어에서 자연스럽게 통치와 보살핌의 의미를 전달하도록 옮겼으며, 목자 비유의 기능을 살렸습니다.
- source_word: formed / forms
  choice: 빚어지다 / 형상
  rationale: 서로 관련되지만 문맥상 품사가 다른 표현을 구별하면서 창조·형성의 뉘앙스를 보존했습니다.
- source_word: begotten / begot
  choice: 낳아지다 / 낳다
  rationale: 수동과 능동의 대조를 유지하고, ‘빚어지다’와의 논리적 긴장을 보존했습니다.
- source_word: partnership
  choice: 결합
  rationale: 혼인, 성적 관계, 영적 연합 가운데 하나로 성급히 한정하지 않도록 폭넓은 말을 선택했습니다.
theological_decisions:
- issue: 성령이 선과 악, 오른쪽과 왼쪽 및 모든 권세를 다스린다는 진술
  choice: 원문의 포괄적이고 긴장된 진술을 그대로 유지했습니다.
  alternative: 악한 권세에 대한 통치를 제한하거나 심판의 의미로 풀어 쓰기
  rationale: 본문이 제시하는 우주론적 긴장을 특정 교리 체계에 맞추어 해소하지 않았습니다.
- issue: 가인을 뱀의 아들이라고 부르는 진술
  choice: 본문의 계보적 표현을 그대로 번역했습니다.
  alternative: 비유적 의미라고 명시하거나 창세기의 계보와 조화시키기
  rationale: 문자적·상징적 가능성을 번역에서 결정하지 않고 원문의 독특한 주장을 보존했습니다.
- issue: 서로 같지 않은 이들의 결합을 간음이라 규정하는 진술
  choice: 보편 명제의 강한 표현을 유지했습니다.
  alternative: 특정 영적 존재나 혼인 관계에만 적용되도록 한정하기
  rationale: 문맥만으로 대상 범위를 확정할 수 없으므로 해석적 제한을 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 비유의 반복어를 일관되게 유지하면서도 문장을 일반 독자가 읽기 쉽게 다듬었습니다. 현재 초안은 제공된 공용 영어 증언 본문에 근거한 잠정 번역이며, 콥트어 원문에 대한 직접 검토가 필요합니다.
