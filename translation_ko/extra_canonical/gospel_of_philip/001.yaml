translation:
  language: ko
  text: '히브리인은 히브리인을 만들어 냅니다. 이런 부류의 사람을 “개종자”라고 부릅니다. 그러나 [개종자]는 또 다른 개종자를 만들어 내지 못합니다. 그들은 […]과 같고, 다른 이들을 만들어 냅니다 […] 그들에게는 그저 생겨나는 것만으로도 충분합니다.[a]


    종은 오직 자유만을 구하며, 주인의 재산은 구하지 않습니다. 그러나 아들은 단지 아들인 데 그치지 않고, 아버지의 유산을 자기 몫으로 요구합니다. 죽은 자들을 상속받는 이들은 자신도 죽어 있으며, 죽은 자들을 상속받습니다. 살아 있는 이들을 상속받는 이들은 자신도 살아 있으며, 살아 있는 이들과 죽은 이들을 모두 상속받습니다. 죽은 자들은 아무것도 상속받을 수 없습니다. 죽은 자들이 어떻게 상속받을 수 있겠습니까? 죽은 자가 살아 있는 이를 상속받으면 죽지 않을 것이며, 오히려 그 죽은 자는 더욱 살아날 것입니다! 이방인은 죽지 않습니다. 죽을 수 있으려면 먼저 살아 있어야 하는데, 그들은 한 번도 살아 있지 않았기 때문입니다. 진리를 믿은 사람은 살아났으며, 죽을 위험에 놓여 있습니다. 그리스도께서 오신 날부터 살아 있기 때문입니다. 세상은 창조되고, 도시들은 새롭게 단장되며, 죽은 자들은 밖으로 실려 나갑니다.[b]


    우리가 히브리인이었을 때에는 아버지가 없었고, 우리에게는 어머니만 있었습니다. 그러나 우리가 그리스도인이 되었을 때에는 아버지와 어머니를 모두 얻게 되었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호 안의 낱말과 줄임표 […]는 사본의 훼손 또는 번역 증언에서 복원되었거나 빠진 부분을 나타냅니다. 이 문단의 정확한 연결은 불확실합니다.
    reason: 독자가 복원문과 결락을 확정된 본문으로 오해하지 않도록 사본 상태를 알립니다.
  - marker: b
    text: “도시들은 새롭게 단장되며”는 제공된 영어 증언의 “the cities gentrified”를 문맥에 맞게 옮긴 잠정 표현입니다. 콥트어 원문을 직접 대조하면 ‘꾸며지다’, ‘정비되다’ 등으로 수정될 수 있습니다.
    reason: 현대 영어 단어의 사회경제적 함의를 그대로 투사하지 않으면서도, 직접적인 콥트어 검토가 아직 이루어지지 않았다는 번역상의 불확실성을 공개합니다.
lexical_decisions:
- source_word: Hebrew
  choice: 히브리인
  rationale: 민족·종교적 명칭을 현대 한국어의 통용 표기로 옮겼으며, 뒤의 ‘그리스도인’과 이루는 대조를 보존했습니다.
- source_word: proselyte
  choice: 개종자
  rationale: 특정 종교 제도에 대한 과도한 해석을 피하면서, 다른 신앙 공동체로 들어온 사람이라는 기본 뜻을 전달합니다.
- source_word: slave
  choice: 종
  rationale: 고대의 주종 관계와 뒤따르는 ‘주인’, ‘아들’, ‘유산’의 비유적 연결을 간결하고 품위 있게 보존합니다.
- source_word: inherit / inheritance
  choice: 상속받다 / 유산
  rationale: 원문의 반복되는 상속 이미지를 유지하고, 아들이 아버지의 재산을 자기 몫으로 요구한다는 법적·가족적 비유를 드러냅니다.
- source_word: gentile
  choice: 이방인
  rationale: 유대교·초기 그리스도교 문맥에서 널리 쓰이는 중립적 성서 용어를 선택했습니다.
- source_word: Truth
  choice: 진리
  rationale: 영어 증언의 대문자 표기는 한국어에서 별도로 표시할 수 없으므로, 인격화나 특정 교리를 덧붙이지 않고 핵심 명사를 그대로 옮겼습니다.
- source_word: gentrified
  choice: 새롭게 단장되며
  rationale: 현대 한국어의 ‘젠트리피케이션’이 지닌 임대료 상승·축출의 사회경제적 함의를 불필요하게 들여오지 않으면서, 도시가 개선되거나 꾸며진다는 영어 증언의 문맥상 의미를 살렸습니다.
theological_decisions:
- issue: 죽은 자와 살아 있는 자의 상속에 관한 역설
  choice: 논리적 모순처럼 보이는 반복과 긴장을 그대로 보존했습니다.
  alternative: ‘죽은 자’를 영적으로 죽은 사람으로, ‘살아 있는 자’를 구원받은 사람으로 명시할 수 있습니다.
  rationale: 본문 자체가 비유의 대상을 명시적으로 풀어 주지 않으므로 특정 구원론적 해석을 번역문에 삽입하지 않았습니다.
- issue: 이방인은 한 번도 살지 않았으므로 죽지 않는다는 진술
  choice: ‘살다’와 ‘죽다’를 반복해 원문의 역설을 직접적으로 옮겼습니다.
  alternative: ‘참된 생명’ 또는 ‘영적 죽음’으로 해설해 옮길 수 있습니다.
  rationale: 그러한 해석은 가능하지만 본문의 의도된 신학적 긴장과 모호성을 좁힐 수 있으므로 본문에는 넣지 않았습니다.
- issue: 그리스도인이 아버지와 어머니를 모두 얻는다는 진술
  choice: 아버지와 어머니의 정체를 밝히지 않은 채 원문의 가족 은유를 유지했습니다.
  alternative: 아버지를 하나님으로, 어머니를 특정한 영적 실재나 공동체로 명시할 수 있습니다.
  rationale: 제공된 증언은 두 존재의 정체를 설명하지 않으므로 특정 교파나 해석 전통의 결론을 도입하지 않았습니다.
- issue: ‘그리스도께서 오신 날부터’의 시간적 의미
  choice: 개인적 회심과 역사적 성육신 가운데 하나로 확정하지 않았습니다.
  alternative: ‘그리스도께서 세상에 오신 때부터’ 또는 ‘그리스도께서 그에게 오신 때부터’로 구체화할 수 있습니다.
  rationale: 영어 증언만으로 지시 범위를 확정하기 어려워 원문의 가능한 중의성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 정중한 합쇼체를 사용했습니다. 반복과 역설은 문학적·신학적 기능을 고려해 가능한 한 유지했으며, 일상 독자가 이해할 수 있도록 문장을 나누되 원문의 논증 순서는 바꾸지 않았습니다. 제공 자료가 공개 영역 영어 번역 증언에 기초하고 콥트어 원문 검토가 보류된 상태이므로, 특히 훼손 구간과 ‘gentrified’에 해당하는 표현은 잠정적입니다.
