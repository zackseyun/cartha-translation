  naturalness: 합쇼체와 문장 흐름은 전반적으로 자연스럽습니다. 다만 사람을 ‘만들어 내다’는 이 문맥에서 다소 부자연스럽고, 혈통·산출의 비유를 훼손하지 않는 범위에서 “낳다”가 더 자연스럽습니다. “자기 몫으로 요구합니다”는 ‘claims … for himself’의 소유 주장보다 분배 청구의 뜻으로 좁아질 수 있어 “자기 것으로 주장합니다”로 다듬었습니다.
  terminology: ‘히브리인’, ‘개종자’, ‘종’, ‘상속’, ‘이방인’, ‘진리’, ‘그리스도인’은 일관되고 적절합니다. ‘진리’와 산 자·죽은 자의 역설은 특정 교리로 해설하지 않고 유지했습니다. ‘gentrified’는 제공 영어 증언 자체가 현대적이고 의미 범위가 불안정하므로, 본문에서는 잠정적으로 ‘새롭게 단장되며’를 유지하고 주석에서 한계를 밝혔습니다.
  issues:
