    rationale: 영어 증언의 “has lived”는 ‘살아났다’가 아니라 ‘살아 있다/살았다’입니다. ‘살아나다’는 부활·회생의 의미를 추가합니다.
  - severity: medium
    issue: “그 죽은 자는 더욱 살아날 것입니다”
    rationale: “will live even more”는 ‘더욱더 살 것이다’라는 역설이지, ‘살아나다’라는 부활 진술이 아닙니다.
  - severity: low
    issue: 사람을 “만들어 내다” 및 유산을 “자기 몫으로 요구하다”
    rationale: 전자는 한국어에서 다소 기계적이며, 후자는 상속분의 청구로 의미를 좁힙니다. 각각 ‘낳다’와 ‘자기 것으로 주장하다’가 영어 증언의 문맥과 표현에 더 가깝습니다.
