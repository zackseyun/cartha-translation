  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/007.yaml
  text: '“Blessed are you who know beforehand what can trip you up and who flee from strange things.

    Blessed are you who are insulted and disrespected because of the love their Lord shows them.

    Blessed are you who weep and are persecuted by those who are without hope, because you will be freed from every captivity.


    “Watch and pray that you may avoid living in the flesh and instead depart from the bitter captivity of this life. When you pray, you will find rest because you have abandoned suffering and shame. For when you depart from bodily sufferings and appetites, you will receive rest from the Good One, and you will reign with the King, you and he united with one another, from now on, forever and ever. Amen.”


    The Book of Thomas

    The Contender

    Writing to the Mature


    Remember me too, my brothers,

    [in] your prayers:

    Peace be to the saints

    and to those of the spirit.'
translation:
  language: ko
  text: '“여러분을 걸려 넘어지게 할 수 있는 것이 무엇인지 미리 알고, 낯선 것들을 피하는 여러분은 복이 있습니다.


    그들의 주님께서 보여 주시는 사랑 때문에 모욕당하고 존중받지 못하는 여러분은 복이 있습니다.[a]


    희망 없는 자들에게 박해를 받으며 우는 여러분은 복이 있습니다. 여러분이 모든 속박에서 풀려날 것이기 때문입니다.


    “깨어 기도하십시오. 그리하여 육신 안에 존재하는 일을 피하고, 도리어 이 삶의 쓰라린 속박에서 떠나십시오.[b] 여러분이 기도할 때 안식을 찾을 것입니다. 고통과 수치를 버렸기 때문입니다. 여러분이 육체의 고통과 욕망에서 떠날 때, 선하신 분에게서 안식을 얻고 왕과 함께 다스릴 것입니다. 여러분과 그분은 서로 하나가 되어, 이제부터 영원무궁토록 그러할 것입니다. 아멘.”


    『도전자 토마스의 책』


    성숙한 이들에게 보내는 글


    형제들이여, 여러분의 기도 가운데

    저도 기억해 주십시오.


    성도들과

    영에 속한 이들에게 평화가 있기를 빕니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 주님’과 ‘보여 주시는 사랑’이 정확히 누구를 가리키는지는 제공된 번역 증거에서 분명하지 않습니다.
    reason: 대명사의 지시 대상에 관한 진정한 모호성을 보존합니다.
  - marker: b
    text: 이 번역은 콥트어 원문을 직접 대조하기 전의 잠정 번역입니다. 제공된 영어 공개 번역 증거를 바탕으로 했습니다.
    reason: 직접적인 원어 검토가 보류 중이라는 자료상의 한계를 독자에게 알립니다.
lexical_decisions:
- source_word: knowledge beforehand
  choice: 미리 알고
  rationale: 제공된 증거가 인지적 의미를 시사하므로 ‘미리 동행하다’ 같은 물리적 표현보다 자연스러운 인지 표현을 택했습니다.
- source_word: strange things
  choice: 낯선 것들
  rationale: 대상이 무엇인지 본문이 규정하지 않으므로 ‘이단’이나 ‘악한 것’으로 구체화하지 않고 모호성을 보존했습니다.
- source_word: existing in the flesh
  choice: 육신 안에 존재하는 일
  rationale: ‘육신을 따라 살다’보다 원문의 존재론적 긴장을 더 직접 보존했습니다.
- source_word: repose / rest
  choice: 안식
  rationale: 단순한 휴식뿐 아니라 구원론적·영적 함의를 지닐 수 있어 품위 있는 성서적 용어를 사용했습니다.
- source_word: the Good One
  choice: 선하신 분
  rationale: 고유한 칭호일 가능성을 살리고, 이를 곧바로 특정 신적 명칭으로 단정하지 않았습니다.
- source_word: those of the spirit
  choice: 영에 속한 이들
  rationale: ‘영적인 사람들’보다 원문의 소속·관계 의미를 유지하면서도 자연스럽게 옮겼습니다.
theological_decisions:
- issue: ‘육신 안에 존재함’과 육체적 고통·욕망에서 떠남의 의미
  choice: 원문의 금욕적·존재론적 표현을 직접적으로 보존
  alternative: ‘죄악된 생활을 피하다’처럼 윤리적 의미로 해석
  rationale: 본문 자체의 육신·육체 언어를 특정 교리 체계로 환원하지 않고 긴장을 남겼습니다.
- issue: 주님의 사랑 때문에 모욕받는 대상의 대명사 불일치
  choice: 본문에는 증거 문구를 가깝게 반영하고 각주로 불명확성을 표시
  alternative: ‘여러분의 주님’으로 일치시켜 교정
  rationale: 제공된 영어 증거의 ‘their Lord / them’이 가리키는 대상은 불명확하므로 침묵 속에 정리하지 않았습니다.
- issue: 왕과의 상호 연합
  choice: ‘여러분과 그분은 서로 하나가 되어’
  alternative: ‘여러분이 그분과 연합하여’
  rationale: 상호성을 나타내는 증거 문구를 살리되 존재의 동일성이라는 교리적 결론까지 확대하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 권면은 ‘-하십시오’, 복 선언은 ‘복이 있습니다’로 통일하여 장중하지만 일반 독자가 이해할 수 있게 했습니다. 후기 표제와 기도 부탁 및 평화 인사는 본문과 구별되도록 행갈이를 유지했습니다. 웹사이트의 주석·연락처·상업 문구는 고대 문헌 본문이 아니므로 제외했습니다.
