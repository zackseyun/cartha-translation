    The Savior said, “Truly, regarding [those], do not consider them human, but consider them [as] animals, because just as animals eat each other, so these people also eat each other. It is exactly the opposite: they have forfeited [the kingdom] through their love, the sweet fire, becoming slaves of death and rushing to perform deeds of decay. They practice the lust of their ancestors. They will be cast down into the abyss to suffer the torment of the bitter evil of their nature, because they will be whipped, making them run backward to where they cannot see, and they [will be separated] from their limbs, not enduring it bravely, but [in] despair. And they are glad because [. . .] insanity and irrationality [. . .] [They] pursue this irrationality without recognizing [their insanity, believing] that they [are] wise. [They . . .] their body [. . .] [] Their mind is selfishly directed, because their thinking is preoccupied with their actions, but the fire will scorch them.”


    Thomas replied, “Lord, what will the person cast down to them do? I am deeply concerned for them, since many attack them.”


    The Savior answered, “What do you yourself think?”


    Judas, called Thomas, said, “Lord, it is right for you to speak and for me to listen.”


    The Savior replied, “Pay attention to what I will tell you, and believe what is true. What sows and what is sown will vanish in the fire, in fire and water, and they will cover themselves in dark graves. After much time has passed, they will reveal the fruit of evil trees, being reproved and killed in the mouths of animals and humans, driven on by the rains, winds, air, and the light shining from above.”


    Thomas replied, “Without a doubt, you have convinced us, Lord. We know in our hearts, and it is clear that this [is the case] and that your word is sufficient. Yet these words you speak to us are laughable and detestable to the world because they are misinterpreted. So how can we go and preach them, since we are [not] respected [in] the world?”


    The Savior replied, “Truly I tell you, whoever hears [your] word and rejects it, mocks it, or laughs at these matters—truly I tell you, he will be handed over to the ruler on high, who rules as king over every power. He will spin that person around in circles and cast him out of heaven and down into the abyss, and he will be confined in a narrow, gloomy place. Furthermore, he will be unable to turn or move because of the tremendous depth of Tartaros and the [ponderous bitterness] of unwavering Hades. [. . .] them to it [. . .] they will not forgive [. . .] chase you. They will hand [. . .] over to [. . .] angel Tartarouchos [. . .] fire chasing them. [] [. . .] fiery whips that spew a shower of sparks into the face of the one being chased.


    If he runs to the west, he will encounter the fire.


    If he runs to the south, he will encounter it there too.


    If he turns to the north, the danger of boiling fire will meet him again.


    Nor will he find a way to the east to flee there and be rescued.


    Because he did not find it in the day when he lived in the body, he will not find it on the day of judgment.”'
translation:
  language: ko
  text: '도마가 대답했습니다. “이런 일들을 듣고 우리가 무슨 말을 할 수 있겠습니까? 눈먼 이들에게 무슨 말을 할 수 있겠습니까? ‘우리는 저주하려고 온 것이 아니라 선을 [행하려고] 이곳에 왔다’고 하면서도, ‘우리가 육신으로 태어나지 않았더라면 결코 [죄]를 알지 못했을 것이다’라고 [말하는] 이 가련한 죽을 자들에게 어떤 가르침을 전해야 하겠습니까?”


    구원자께서 말씀하셨습니다. “진실로 말합니다. [그들을] 사람으로 여기지 말고 [짐승]으로 여기십시오. 짐승들이 서로 잡아먹듯이 이런 부류의 사람들도 서로 잡아먹기 때문입니다. 실상은 정반대입니다. 그들은 자기들의 사랑, 곧 달콤한 불 때문에 [나라를] 잃어버렸으며, 죽음의 종이 되어 썩어 없어질 일들을 하려고 달려갑니다. 그들은 조상들의 욕정을 좇습니다. 그들은 심연에 던져져 자기 본성에 있는 쓰디쓴 악의 고통을 겪을 것입니다. 채찍질을 당하여 보지 못하는 곳을 향해 뒷걸음질 치게 될 것이며, 자기 지체들에서 [분리될] 것입니다. 그들은 이를 용감히 견디지 못하고 [절망에] 빠질 것입니다. 그들은 기뻐합니다. 왜냐하면 […] 광기와 이성 없음 […] [그들은] [자신들의 광기를 깨닫지 못하고 자신들이] 지혜롭다고 [믿으며] 이 이성 없음을 뒤쫓습니다. [그들은 …] 그들의 몸 […] [ ] 그들의 마음은 자신만을 향해 있습니다. 그들의 생각이 자기 행위에만 사로잡혀 있기 때문입니다. 그러나 불이 그들을 태울 것입니다.”


    도마가 대답했습니다. “주님, 그들에게 던져진 사람은 어떻게 되겠습니까? 그들을 공격하는 자들이 많기에 제가 그들을 몹시 걱정합니다.”


    구원자께서 대답하셨습니다. “당신 자신은 어떻게 생각합니까?”


    도마라고 불리는 유다가 말했습니다. “주님, 주님께서 말씀하시고 제가 듣는 것이 마땅합니다.”


    구원자께서 대답하셨습니다. “내가 당신에게 하는 말을 귀담아듣고, 참된 것을 믿으십시오. 씨를 뿌리는 것과 뿌려진 것은 불 속에서, 불과 물 속에서 사라질 것이며, 그들은 어두운 무덤으로 자신을 덮을 것입니다. 오랜 시간이 흐른 뒤 그들은 악한 나무들의 열매를 드러낼 것입니다. 비와 바람과 공기와 위에서 비치는 빛에 떠밀려, 짐승과 사람의 입에서 책망받고 죽임당할 것입니다.”


    도마가 대답했습니다. “주님, 의심할 여지 없이 주님께서 우리를 납득시키셨습니다. 우리는 마음으로 알고 있으며, 그것이 [사실임이] 분명하고 주님의 말씀으로 충분합니다. 그러나 주님께서 우리에게 하시는 이 말씀들은 세상에서 우스꽝스럽고 혐오스러운 것으로 여겨집니다. 잘못 해석되기 때문입니다. 그러니 우리가 어떻게 가서 이 말씀들을 선포할 수 있겠습니까? 우리는 세상에서 [존중받지] 못하기 때문입니다.”


    구원자께서 대답하셨습니다. “진실로 말합니다. [당신들의] 말을 듣고도 그것을 거부하거나 조롱하거나 이 일들을 비웃는 사람은 누구든지—진실로 말합니다—높은 곳의 통치자, 곧 모든 권세 위에 왕으로 군림하는 자에게 넘겨질 것입니다. 그는 그 사람을 빙빙 돌려 하늘에서 심연으로 내던질 것이며, 그 사람은 비좁고 어두컴컴한 곳에 갇힐 것입니다. 더구나 타르타로스[a]의 엄청난 깊이와, 흔들림 없는 하데스[b]의 [무거운 쓰라림] 때문에 몸을 돌리거나 움직일 수도 없을 것입니다. […] 그들을 그곳으로 […] 그들은 용서하지 않을 […] 당신을 뒤쫓습니다. 그들은 […] 넘겨 […] 타르타루코스[c] 천사 […] 불이 그들을 뒤쫓습니다. [ ] […] 불붙은 채찍들이 쫓기는 자의 얼굴에 불꽃 소나기를 뿜어냅니다.


    그가 서쪽으로 달아나면 불과 마주칠 것입니다.


    남쪽으로 달아나도 그곳에서 불과 마주칠 것입니다.


    북쪽으로 돌아서면 끓어오르는 불의 위험이 다시 그를 맞을 것입니다.


    동쪽으로 피하여 구원받을 길도 찾지 못할 것입니다.


    그가 육신 안에 살던 날에 그 길을 찾지 못했으므로, 심판의 날에도 찾지 못할 것입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 타르타로스는 고대 지중해 세계에서 매우 깊은 저승 또는 형벌의 영역을 가리키는 명칭입니다.
    reason: 일반 독자에게 생소한 고유 명칭을 설명하되 ‘지옥’으로 단순화하지 않기 위해서입니다.
  - marker: b
    text: 하데스는 죽은 자들의 영역을 가리키는 고대 명칭입니다. 여기서는 타르타로스와 나란히 언급됩니다.
    reason: 본문이 두 명칭을 구별한다는 점을 독자가 알 수 있도록 하기 위해서입니다.
  - marker: c
    text: 타르타루코스는 본문에 등장하는 천사의 명칭입니다. 손상된 문맥 때문에 그 정확한 역할은 분명하지 않습니다.
    reason: 고유 명칭의 의미와 손상된 문맥에서 비롯되는 불확실성을 밝혀 두기 위해서입니다.
lexical_decisions:
- source_word: Savior
  choice: 구원자
  rationale: 문헌의 호칭을 교파적 확장 없이 직접적이고 자연스럽게 옮겼습니다.
- source_word: abyss
  choice: 심연
  rationale: 형벌의 깊은 영역이라는 공간적 심상을 유지하면서 ‘무저갱’처럼 특정 성경 번역 전통에 치우친 표현을 피했습니다.
- source_word: Tartaros
  choice: 타르타로스
  rationale: 고유한 저승 영역의 명칭을 일반적인 ‘지옥’으로 평준화하지 않고 음역했습니다.
- source_word: Hades
  choice: 하데스
  rationale: 타르타로스와 병렬된 별도 명칭을 보존하고 교리적으로 단일한 ‘지옥’ 개념으로 합치지 않았습니다.
- source_word: Tartarouchos
  choice: 타르타루코스
  rationale: 본문의 고유한 천사 명칭을 기능적 의역 대신 음역하여 정체의 불확실성을 보존했습니다.
- source_word: what sows and what is sown
  choice: 씨를 뿌리는 것과 뿌려진 것
  rationale: 난해한 주어와 수동적 대조를 해석으로 매끄럽게 만들지 않고 가능한 한 그대로 유지했습니다.
theological_decisions:
- issue: ‘sweet fire’가 무엇을 수식하거나 가리키는지 불분명함
  choice: ‘자기들의 사랑, 곧 달콤한 불 때문에’로 병치 관계를 열어 두었습니다.
  alternative: ‘달콤한 불을 사랑했기 때문에’ 또는 ‘사랑을 통해 달콤한 불을 잃었다’
  rationale: 전승문 자체의 구문적·신학적 긴장을 단정적으로 해소하지 않기 위해 동격 가능성을 살렸습니다.
- issue: ‘kingdom’의 복원
  choice: 대괄호를 유지하여 ‘[나라]’로 번역했습니다.
  alternative: ‘[하나님 나라]’ 또는 ‘[천국]’
  rationale: 손상된 본문에 신적 소유 관계나 장소 개념을 덧붙이지 않았습니다.
- issue: 육신과 죄의 관계
  choice: ‘육신으로 태어나지 않았더라면 결코 [죄]를 알지 못했을 것이다’로 진술 자체를 보존했습니다.
  alternative: 육신이 죄의 원인이라는 해설적 번역
  rationale: 화자들이 인용하는 주장인지 문헌의 최종 교리인지 구별되므로, 특정 인간론을 확정하지 않았습니다.
- issue: 심판의 장소와 존재들의 관계
  choice: 타르타로스, 하데스, 타르타루코스를 구별하여 음역했습니다.
  alternative: 모두 ‘지옥’이나 ‘지옥의 천사’로 통일
  rationale: 본문에 나타나는 고유 명칭의 다층성과 고대 우주론적 긴장을 보존했습니다.
- issue: 마지막의 ‘it’이 가리키는 대상
  choice: 문맥상 ‘길’로 번역했습니다.
  alternative: ‘구원’, ‘동쪽’, 또는 대명사 그대로
  rationale: 직전의 ‘동쪽으로 피하여 구원받을 길’을 자연스럽게 이어 주되, 구원을 얻는 수단에 관한 별도의 교리를 삽입하지 않았습니다.
