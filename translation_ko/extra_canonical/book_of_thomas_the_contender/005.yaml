  revised_text: '도마가 대답했습니다. “이런 일들을 듣고 우리가 무슨 말을 할 수 있겠습니까? 눈먼 이들에게 무슨 말을 할 수 있겠습니까? ‘우리는 저주하려고 온 것이 아니라 선을 [행하려고] 이곳에 왔다’고 하면서도, ‘우리가 육신으로 태어나지 않았더라면 결코 [죄]를 알지 못했을 것이다’라고 [말하는] 이 가련한 죽을 자들에게 어떤 가르침을 전해야 하겠습니까?”


    구원자께서 말씀하셨습니다. “진실로 말합니다. [그들을] 사람으로 여기지 말고 짐승[으로] 여기십시오. 짐승들이 서로 잡아먹듯이 이런 부류의 사람들도 서로 잡아먹기 때문입니다. 실상은 정반대입니다. 그들은 자기들의 사랑, 곧 달콤한 불 때문에 [나라를] 잃어버렸으며, 죽음의 종이 되어 썩어 없어질 일들을 하려고 달려갑니다. 그들은 조상들의 욕정을 좇습니다. 그들은 심연에 던져져 자기 본성에 있는 쓰디쓴 악의 고통을 겪을 것입니다. 채찍질을 당하여 보지 못하는 곳을 향해 뒷걸음질 치게 될 것이며, 자기 지체들에서 [분리될] 것입니다. 그들은 이를 용감히 견디지 못하고 [절망에] 빠질 것입니다. 그들은 기뻐합니다. 왜냐하면 […] 광기와 비이성 […] [그들은] [자신들의 광기를 깨닫지 못하고 자신들이] 지혜롭다고 [믿으며] 이 비이성을 뒤쫓습니다. [그들은 …] 그들의 몸 […] [ ] 그들의 마음은 자신만을 향해 있습니다. 그들의 생각이 자기 행위에만 사로잡혀 있기 때문입니다. 그러나 불이 그들을 태울 것입니다.”


    도마가 대답했습니다. “주님, 그들에게 던져진 사람은 어떻게 되겠습니까? 그들을 공격하는 자들이 많기에 제가 그들을 몹시 걱정합니다.”


    구원자께서 대답하셨습니다. “당신 자신은 어떻게 생각합니까?”


    도마라고 불리는 유다가 말했습니다. “주님, 주님께서 말씀하시고 제가 듣는 것이 마땅합니다.”


    구원자께서 대답하셨습니다. “내가 당신에게 하는 말을 귀담아듣고, 참된 것을 믿으십시오. 씨를 뿌리는 것과 뿌려진 것은 불 속에서, 불과 물 속에서 사라질 것이며, 그들은 어두운 무덤으로 자신을 덮을 것입니다. 오랜 시간이 흐른 뒤 그들은 악한 나무들의 열매를 드러낼 것입니다. 비와 바람과 공기와 위에서 비치는 빛에 떠밀려, 짐승과 사람의 입에서 책망받고 죽임당할 것입니다.”


    도마가 대답했습니다. “주님, 의심할 여지 없이 주님께서 우리를 납득시키셨습니다. 우리는 마음으로 알고 있으며, 그것이 [사실임이] 분명하고 주님의 말씀으로 충분합니다. 그러나 주님께서 우리에게 하시는 이 말씀들은 세상에서 우스꽝스럽고 혐오스러운 것으로 여겨집니다. 잘못 해석되기 때문입니다. 그러니 우리가 어떻게 가서 이 말씀들을 선포할 수 있겠습니까? 우리는 세상에서 [존중받지] 못하기 때문입니다.”


