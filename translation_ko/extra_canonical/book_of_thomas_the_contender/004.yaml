  source_fidelity: 제공된 영어 증언을 기준으로 전반적인 내용, 사본 훼손 표기, 보이는 것/보이지 않는 것의 대조, 그리고 난해한 사후 묘사는 충실히 보존되었습니다. 다만 ‘any (evil) spirit they see’를 ‘눈에 보이는 온갖 악한 영’으로 옮긴 부분은 ‘그들이 보는’이라는 관계절과 ‘any’의 범위를 ‘visible’로 바꾸므로 수정이 필요합니다. 또한 ‘all the animals’는 ‘온갖 짐승’보다 ‘모든 짐승’이 더 직접적입니다.
  naturalness: 합쇼체 대화체와 서술체는 자연스럽고 일관됩니다. 다만 ‘그 위에서 안식했다’는 진리를 대상으로 한 한국어 표현으로 다소 부자연스러워 ‘그것 안에서 영원히 안식했다’로 다듬었습니다. 재갈 비유도 행위의 대상을 명시해 자연스럽게 했습니다.
  terminology: ‘구원자’, ‘성숙한 이들’, ‘무지한 자’, ‘안식’, ‘육신의 그릇’은 교단적 해석을 덧붙이지 않으면서 증언의 용어를 적절히 보존합니다. ‘benefactor’는 ‘은혜를 베푸시는 분’도 가능하나, 여기서는 호칭적·관계적 의미를 더 직접적으로 나타내는 ‘우리의 은인’으로 조정했습니다.
  issues:
  - severity: medium
    issue: ‘any (evil) spirit they see’의 범위와 괄호 표기가 변형되었습니다.
    rationale: 초안의 ‘눈에 보이는 온갖 악한 영’은 ‘they see’를 영의 객관적 가시성으로 바꾸고, 증언의 편집적 괄호인 ‘(evil)’도 확정된 본문처럼 처리합니다. ‘그들이 보는 어떤 (악한) 영’으로 옮겨 관계절, 단수적 범위, 편집적 불확실성을 보존해야 합니다.
  - severity: low
    issue: ‘all the animals’를 ‘온갖 짐승’으로 처리했습니다.
    rationale: ‘온갖’도 넓은 총칭이지만, 증언의 ‘all’을 더 직접적으로 반영하는 ‘모든 짐승’이 적절합니다.
  - severity: low
    issue: 진리 위에서 안식한다는 표현이 한국어에서 다소 어색합니다.
    rationale: ‘reposed on it’의 대상인 진리와 지속적 안식의 의미를 유지하면서 ‘그것 안에서 영원히 안식했다’로 자연스럽게 옮길 수 있습니다.
  revised_text: '그때 구원자께서 계속 말씀하셨습니다. “오, 헤아릴 수 없는 빛에 대한 사랑이여! 오, 사람의 몸과 골수에서 타오르는 불의 쓰라림이여! 그 불은 밤낮으로 그들 안에서 타올라 사람의 팔다리를 태우고, 그들의 정신을 취하게 하며 영혼을 미치게 합니다. […] 그들을 (남자와 여자 모두)에게 […] 밤에, 그들은 몸짓을 합니다. […] 은밀한 데서도 보이는 데서도 그러합니다. 남자들은 [여자들에게 … 몸짓을 하고], 여자들은 [남자들에게] 그러하기 때문입니다. [그러므로 이렇게] [] 말합니다. ‘참된 지혜로 진리를 찾는 사람은 모두 날아오를 날개가 돋아, 사람들의 영을 태우는 욕망에서 벗어날 것이며, 그들이 보는 어떤 (악한) 영을 피할 날개도 돋을 것입니다.’”[a]



    토마스가 대답했습니다. “주님, 제가 여쭙는 것이 바로 이것입니다. 주님께서 말씀하신 대로 주님이 우리의 은인임을 제가 깨달았기 때문입니다.”



    구원자께서 다시 대답하셨습니다. “그러므로 우리가 그대에게 말해야 합니다. 이것은 성숙한 이들을 위한 가르침이기 때문입니다. 그대가 이제 성숙해지고자 한다면 이 일들을 행할 것입니다. 그러지 않는다면 그대의 이름은 ‘무지한 자’입니다. 지성 있는 사람은 어리석은 자와 함께 살 수 없기 때문입니다. 지성 있는 사람은 모든 지혜에 있어서 성숙한 사람입니다. 참으로 지혜로운 사람은 진리로 양육받고, ‘굽이치는 시냇가에서 자라는 나무와 같을 것입니다.’[b] 그러나 어리석은 자에게는 선과 악이 똑같습니다. 어떤 이들에게 날개가 있어도, 그들은 진리에서 멀리 떨어진 눈에 보이는 것들을 향해 달려가기 때문입니다. 그들을 이끄는 불이 진리의 환상을 만들어 내고, [덧없는] 아름다움으로 그들을 비추며, 달콤한 어둠 속에 가두고 향기로운 쾌락으로 홀리기 때문입니다.



    “그 불은 꺼지지 않는 욕망으로 그들의 눈을 멀게 하고, 그들의 영혼을 태우며, 결코 뽑아낼 수 없도록 그들의 심장에 박힌 말뚝 같은 것이 될 것입니다. 그리고 그 불은 제 뜻대로, 그들의 입에 물린 재갈처럼 그들을 이리저리 몰아갑니다. 또한 눈에 보이는 것들을 향한 욕망에 사로잡히는 쓰라림으로 그들을 사슬에 묶고, 그들의 모든 팔다리에 족쇄를 채웠습니다. 그 눈에 보이는 것들은 충동에 따라 타락하고 변하며 빗나갑니다. 그들은 줄곧 아래로 끌려갑니다. 그들이 죽임을 당하면, 덧없는 영역의 모든 짐승에게 소화됩니다.”



    토마스가 대답했습니다. “말씀하신 대로 분명합니다. [‘많은 이가 … 알지 못하는 이들입니다] […] 영혼을.’”



    그러자 [구원자께서] 대답하셨습니다. “[복이 있습니다,] 지혜로운 사람은. 그는 [진리를 찾았고,] 그것을 발견했을 때 [] 그것 안에서 영원히 안식했으며, 자신을 흔들려는 자들을 두려워하지 않았습니다.”



    토마스가 대답했습니다. “주님, 우리에게 속한 것들 가운데서 안식하는 것이 우리에게 좋습니까?”



    구원자께서 말씀하셨습니다. “그렇습니다. 그것은 유익하며 그대들에게 좋습니다. 사람들 가운데 눈에 보이는 것들은 사라질 것이기 때문입니다. 그들의 육신의 그릇도 사라질 것입니다. 그것이 아무것도 아닌 것으로 줄어들면, 눈에 보이는 것들, 곧 볼 수 있는 것들 가운데 존재하게 될 것입니다. 그러면 그들이 보는 불이 믿음을 향한 이전의 사랑 때문에 그들에게 고통을 줄 것입니다. 그들은 눈에 보이는 것으로 다시 모일 것입니다. 더욱이 보이지 않는 것들 가운데서 볼 수 있으면서도 가장 큰 사랑을 지니지 않은 이들은, 이 삶에 골몰하다가 불에 타서 멸망할 것입니다. 잠시 뒤에는 눈에 보이는 것이 사라질 것입니다. 그러면 형체 없는 그림자들이 나와, 무덤들 사이에서 시체들 위에 영원히 머물며 고통받을 것이고, 그들의 영혼은 썩어 갈 것입니다.”[c]'
