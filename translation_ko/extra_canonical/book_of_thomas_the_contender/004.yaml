translation:
  language: ko
  text: '그때 구원자께서 계속 말씀하셨습니다. “오, 헤아릴 수 없는 빛에 대한 사랑이여! 오, 사람의 몸과 골수에서 타오르는 불의 쓰라림이여! 그 불은 밤낮으로 그들 안에서 타올라 사람의 팔다리를 태우고, 그들의 정신을 취하게 하며 영혼을 미치게 합니다. […] 남자와 여자 모두에게 […] 밤에, 그들은 몸짓을 합니다. […] 은밀한 데서도 보이는 데서도 그러합니다. 남자들은 [여자들에게 … 몸짓을 하고], 여자들은 [남자들에게] 그러하기 때문입니다. [그러므로 이렇게] [] 말합니다. ‘참된 지혜로 진리를 찾는 사람은 모두 날아오를 날개가 돋아, 사람의 영을 태우는 욕망에서 벗어날 것이며, 눈에 보이는 온갖 악한 영을 피할 날개가 돋을 것입니다.’”[a]


    토마스가 대답했습니다. “주님, 제가 여쭙는 것이 바로 이것입니다. 주님께서 말씀하신 대로 주님이 우리에게 은혜를 베푸시는 분임을 제가 깨달았기 때문입니다.”


    구원자께서 다시 대답하셨습니다. “그러므로 우리가 그대에게 말해야 합니다. 이것은 성숙한 이들을 위한 가르침이기 때문입니다. 그대가 이제 성숙해지고자 한다면 이 일들을 행할 것입니다. 그러지 않는다면 그대의 이름은 ‘무지한 자’입니다. 지성 있는 사람은 어리석은 자와 함께 살 수 없기 때문입니다. 지성 있는 사람은 모든 지혜에서 성숙한 사람입니다. 참으로 지혜로운 사람은 진리로 양육받고, ‘굽이치는 시냇가에서 자라는 나무와 같을 것입니다.’[b] 그러나 어리석은 자에게는 선과 악이 똑같습니다. 어떤 이들에게 날개가 있어도, 그들은 진리에서 멀리 떨어진 눈에 보이는 것들을 향해 달려가기 때문입니다. 그들을 이끄는 불이 진리의 환상을 만들어 내고, [덧없는] 아름다움으로 그들을 비추며, 달콤한 어둠 속에 가두고 향기로운 쾌락으로 홀리기 때문입니다.


    “그 불은 꺼지지 않는 욕망으로 그들의 눈을 멀게 하고, 그들의 영혼을 태우며, 결코 뽑아낼 수 없도록 그들의 심장에 박힌 말뚝 같은 것이 될 것입니다. 그리고 그 불은 제 뜻대로 그들을 몰고 다니는데, 마치 입에 물린 재갈처럼 합니다. 또한 눈에 보이는 것들을 향한 욕망에 사로잡히는 쓰라림으로 그들을 사슬에 묶고, 그들의 모든 팔다리에 족쇄를 채웠습니다. 그 눈에 보이는 것들은 충동에 따라 타락하고 변하며 빗나갑니다. 그들은 줄곧 아래로 끌려갑니다. 그들이 죽임을 당하면, 덧없는 영역의 온갖 짐승에게 소화됩니다.”


    토마스가 대답했습니다. “말씀하신 대로 분명합니다. [‘많은 이가 … 알지 못하는 이들입니다] […] 영혼을.’”


    그러자 [구원자께서] 대답하셨습니다. “[복이 있습니다,] 지혜로운 사람은. 그는 [진리를 찾았고,] 그것을 발견했을 때 [] 영원히 그 위에서 안식했으며, 자신을 흔들려는 자들을 두려워하지 않았습니다.”


    토마스가 대답했습니다. “주님, 우리에게 속한 것들 가운데서 안식하는 것이 우리에게 좋습니까?”


    구원자께서 말씀하셨습니다. “그렇습니다. 그것은 유익하며 그대들에게 좋습니다. 사람들 가운데 눈에 보이는 것들은 사라질 것이기 때문입니다. 그들의 육신의 그릇도 사라질 것입니다. 그것이 아무것도 아닌 것으로 줄어들면, 눈에 보이는 것들, 곧 볼 수 있는 것들 가운데 존재하게 될 것입니다. 그러면 그들이 보는 불이 믿음을 향한 이전의 사랑 때문에 그들에게 고통을 줄 것입니다. 그들은 눈에 보이는 것으로 다시 모일 것입니다. 더욱이 보이지 않는 것들 가운데서 볼 수 있으면서도 가장 큰 사랑을 지니지 않은 이들은, 이 삶에 골몰하다가 불에 타서 멸망할 것입니다. 잠시 뒤에는 눈에 보이는 것이 사라질 것입니다. 그러면 형체 없는 그림자들이 나와, 무덤들 사이에서 시체들 위에 영원히 머물며 고통받을 것이고, 그들의 영혼은 썩어 갈 것입니다.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 대괄호와 줄임표는 사본의 훼손 또는 번역 증언에서 제안된 복원을 나타냅니다. 빈 대괄호 []도 제공된 증언을 그대로 보존한 것입니다.
    reason: 심하게 훼손된 첫 단락에서 확정 본문과 복원문을 구별하기 위해 필요합니다.
  - marker: b
    text: 시편 1:3을 인용하거나 암시합니다. 제공된 증언은 ‘굽이치는 시냇가’라고 읽습니다.
    reason: 정경 인용의 출처와 통상적인 시편 번역과 다른 표현을 알립니다.
  - marker: c
    text: 마지막 단락은 문법과 사상의 연결이 특히 불분명합니다. 콥트어 사본에 대한 직접 대조가 아직 이루어지지 않았으므로, 현재 번역은 제공된 공개 영역 영어 증언을 잠정적으로 따릅니다.
    reason: 직접 원어 검토가 보류된 상태이며 난해한 구절을 과도하게 확정하지 않았음을 밝힙니다.
lexical_decisions:
- source_word: Savior
  choice: 구원자
  rationale: 문헌의 칭호를 교단적 확장 없이 직접 보존했습니다.
- source_word: mature
  choice: 성숙한 이 / 성숙하다
  rationale: 지적·영적 완성이라는 문맥을 살리면서 ‘완전한 자’보다 자연스럽고 과도한 교리화를 피했습니다.
- source_word: Ignoramus
  choice: 무지한 자
  rationale: 인명처럼 붙는 경멸적 호칭의 기능을 유지하되 현대 한국어 독자가 곧바로 이해하도록 옮겼습니다.
- source_word: reposed
  choice: 안식하다
  rationale: 단순히 쉬는 행위와 지속적 정착의 종교적 울림을 함께 담았습니다.
- source_word: visible things
  choice: 눈에 보이는 것들
  rationale: ‘가시적 사물’보다 자연스러우면서 본문의 보이는 것과 보이지 않는 것의 대조를 반복해 보존했습니다.
- source_word: fleshly vessel
  choice: 육신의 그릇
  rationale: 신체를 그릇에 비유하는 원문의 은유를 해설적으로 풀지 않고 유지했습니다.
- source_word: movements
  choice: 몸짓
  rationale: 훼손된 성적 문맥을 인지할 수 있게 하되, 불확실한 구체적 행위를 확정하지 않았습니다.
theological_decisions:
- issue: 빛에 대한 사랑의 평가
  choice: ‘헤아릴 수 없는 빛에 대한 사랑’으로 직역에 가깝게 유지
  alternative: 감탄을 반어로 명시하거나 ‘빛의 사랑’으로 처리
  rationale: 이어지는 욕망 비판과의 긴장을 번역자가 해소하지 않고 남겼습니다.
- issue: ‘former love for the faith’의 의미
  choice: ‘믿음을 향한 이전의 사랑’
  alternative: ‘이전의 신앙적 사랑’ 또는 본문 교정
  rationale: 문맥상 난해하지만 현 증거에서 ‘faith’를 다른 대상으로 바꾸지 않고 모호성을 보존했습니다.
- issue: 보이지 않는 것들 가운데서 보는 자들
  choice: 통사적 난해함을 유지한 채 ‘보이지 않는 것들 가운데서 볼 수 있으면서도’로 번역
  alternative: ‘보이지 않는 것들을 볼 수 있는 이들’로 명료화
  rationale: 영역을 뜻하는지 대상을 뜻하는지 확정하기 어려워 원문 증언의 긴장을 남겼습니다.
- issue: 사후 운명 묘사
  choice: ‘소화됩니다’, ‘영혼은 썩어 갈 것입니다’라는 물질적 이미지를 유지
  alternative: ‘멸망합니다’처럼 추상화
  rationale: 본문 특유의 거칠고 육체적인 심판 이미지를 교리적 용어로 평준화하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 대화의 존칭은 구원자에게는 ‘주님/말씀하셨습니다’, 토마스에게는 서술상 중립적 높임을 적용했습니다. 문체는 장중하되 일반 독자가 이해할 수 있도록 구성했으며, 사본 훼손 표시는 모두 보존했습니다. 이 초안은 콥트어 직접 검토 전의 잠정 번역입니다.
