    Woe to you because of the fire that scorches you from within, for it cannot be quenched! Woe to you because of the wheel that spins inside your minds! Woe to you in the grip of the scorching that dwells within you, for it will visibly consume your flesh and invisibly tear apart your souls, and it will prepare you to join your friends! Woe to you prisoners, for you are chained in caves!


    “You mock and smirk with insane laughter! You are unaware of your damnation, and you do not consider your condition, and [you] have failed to understand that you live in darkness and [death]! Instead, you are intoxicated with fire and [filled] with bitterness. Your mind is insane because of the [scorching that is inside] you, and the venom and attacks of your enemies are sweet to you! Gloom rose for you like light because you surrendered your freedom for slavery! You blackened your hearts and gave up your thoughts to foolishness, and you filled your thoughts with the fiery smoke inside you! And your light [was obscured] in the cloud [of . . .], and the clothes that cover you, you [. . .]. And [you] were captured by an empty [hope]. And whom did [you] believe? Do you [not understand that] all of [you] live among those who [. . .] you as though [you . . .].


    [] You immersed yourselves in the water of gloom! You acted according to your own urges! Woe to you who live in error, who neglect the light of the sun that judges the world and gazes down upon it, and that will encircle all things in order to enslave enemies. Nor do you perceive the moon, which by night and day gazes down, beholding the corpses from your slaughtering! Woe to you who love being close to women and (who love) unclean intercourse with them! Woe to you who are caught in the grip of your bodily powers, for they will torment you! Woe to you who are caught in the grip of the forces of evil demons! Woe to you who lure your limbs with fire!


    “Who will send a shower of cool dew upon you to quench the cloud of fire engulfing you together with your scorching? Who will make the sun shine upon you to dispel the gloom within you and to conceal the gloom and impure water? The sun and moon, together with the air, the wind, the earth, and the water, will grant you a fragrant scent, because if the sun does not shine upon these bodies, they will wither and perish, just like weeds and grass. If the sun shines upon them, they take over and strangle the grapevine. If, however, the grapevine takes over and shades all the weeds and other bushes growing beside them, and [spreads] and increases, it alone will receive the land where it grows and will dominate every place it has overshadowed. When it matures, it will control the entire land and produce abundantly for its master, and it will please him even more, because he will have avoided the great trouble of uprooting these plants. Instead, the grapevine itself got rid of them, even choking
    them, and they died and became as (dead) as the soil.”


    Jesus then continued and said: “Woe to you, because you did not accept the teaching, and those who [. . .] will work at preaching [. . .]. And [you] are running into [. . .] will drive [them] downward [. . .] by day you kill them [] so that they could rise from death.”'
translation:
  language: ko
  text: '**불경건한 자들에 대한 정죄**[a]


    그때 구원자께서 계속 말씀하셨습니다.


    “불경건하며 희망도 없이, 이루어지지 않을 일을 기다리는 여러분에게 화가 있습니다! 멸망할 수밖에 없는 감옥, 곧 육체에 희망을 두는 여러분에게 화가 있습니다! 언제까지 잊은 채로 있겠습니까? 언제까지 썩지 않는 것들도 썩을 것이라고 여기겠습니까? 여러분의 희망은 세상에 매여 있고, 여러분의 신은 이 삶입니다! 여러분은 스스로를 멸망시키고 있습니다!


    여러분 속에서 여러분을 태우는 불 가운데 있는 여러분에게 화가 있습니다. 그 불은 꺼지지 않기 때문입니다!


    여러분의 마음속에서 돌아가는 수레바퀴 때문에 여러분에게 화가 있습니다!


    여러분 속에 자리 잡은 뜨거운 불길에 붙들린 여러분에게 화가 있습니다. 그것이 눈에 보이게 여러분의 육체를 삼키고, 눈에 보이지 않게 여러분의 영혼을 찢어, 여러분이 친구들과 합류하도록 준비시킬 것이기 때문입니다!


    감옥에 갇힌 여러분에게 화가 있습니다. 여러분은 동굴 안에서 사슬에 묶여 있기 때문입니다!


    “여러분은 조롱하며 미친 듯이 웃고 비웃습니다! 여러분은 자신이 받을 정죄를 알지 못하고, 자신의 처지를 헤아리지 않으며, 자신이 어둠과 [죽음] 속에 산다는 것을 깨닫지 못했습니다! 도리어 여러분은 불에 취하고 [쓰라림으로 가득]합니다. 여러분 속의 [뜨거운 불길] 때문에 여러분의 마음은 미쳐 있고, 원수들의 독과 공격은 여러분에게 달콤합니다! 여러분이 자유를 내주고 종살이를 택했으므로, 캄캄함이 여러분에게 빛처럼 떠올랐습니다! 여러분은 마음을 검게 물들이고 생각을 어리석음에 내주었으며, 여러분 속의 불붙은 연기로 생각을 가득 채웠습니다! 여러분의 빛은 [⋯의] 구름 속에서 [가려졌고], 여러분을 덮는 옷을 여러분은 [⋯]. 여러분은 헛된 [희망]에 사로잡혔습니다. 여러분은 누구를 [믿었습니까]? 여러분 모두가 [⋯] 여러분을 마치 [여러분이 ⋯]인 것처럼 대하는 자들 가운데 살고 있다는 것을 [깨닫지 못합니까]?


    [⋯] 여러분은 스스로를 캄캄한 물속에 잠기게 했습니다!


    여러분은 자기 욕망을 따라 행동했습니다!


    그릇된 길에 살면서, 세상을 심판하고 세상을 내려다보는 태양의 빛을 소홀히 하는 여러분에게 화가 있습니다. 그 빛은 원수들을 종으로 삼으려고 모든 것을 에워쌀 것입니다.


    여러분은 밤낮으로 내려다보며 여러분이 살육하여 생긴 시체들을 바라보는 달도 알아보지 못합니다!


    여자들과 가까이하기를 좋아하고 그들과 부정한 성관계를 맺기를 좋아하는 여러분에게 화가 있습니다!


    육체의 힘에 붙들린 여러분에게 화가 있습니다. 그것들이 여러분을 괴롭힐 것이기 때문입니다!


    악한 귀신들의 세력에 붙들린 여러분에게 화가 있습니다!


    불로 자기 지체를 꾀어내는 여러분에게 화가 있습니다!


    “누가 여러분에게 서늘한 이슬비를 내려, 여러분의 뜨거운 불길과 함께 여러분을 휘감은 불구름을 끄겠습니까? 누가 태양을 여러분 위에 비추어, 여러분 속의 캄캄함을 몰아내고 그 캄캄함과 더러운 물을 감추겠습니까? 태양과 달, 공기와 바람, 땅과 물이 여러분에게 향기를 베풀 것입니다. 태양이 이 몸들 위에 비치지 않으면, 그것들은 잡초와 풀처럼 시들어 사라질 것이기 때문입니다. 태양이 그것들 위에 비치면, 그것들이 우거져 포도나무를 옥죄어 죽입니다. 그러나 포도나무가 우거져 그 곁에서 자라는 모든 잡초와 다른 덤불을 그늘로 덮고, [뻗어 나가] 불어나면, 그것만이 자신이 자라는 땅을 차지하고 자기 그늘로 덮은 모든 곳을 다스릴 것입니다. 포도나무가 다 자라면 온 땅을 차지하고 주인을 위해 풍성한 열매를 맺을 것이며, 주인을 더욱 기쁘게 할 것입니다. 주인이 이 식물들을 뿌리째 뽑는 큰 수고를 피하게 되었기 때문입니다. 포도나무가 스스로 그것들을 없애고 옥죄어 죽였으므로, 그것들은 죽어 흙처럼 되었습니다.”


    그때 예수께서 계속 말씀하셨습니다.


    “가르침을 받아들이지 않은 여러분에게 화가 있습니다. 그리고 [⋯] 전하는 일을 할 사람들이 [⋯]. 여러분은 [⋯]로 달려가고 있으며, [그들을] 아래로 몰아갈 것입니다 [⋯]. 낮에 여러분은 그들을 죽입니다 [⋯]. 그들이 죽음에서 일어날 수 있도록 말입니다.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 나그함마디 문서 II,7의 콥트어 본문에 대한 직접 대조 전 단계에서, 제공된 공개 영역 영어 번역 증언을 바탕으로 마련한 잠정 번역입니다. 대괄호와 줄임표는 훼손되었거나 복원이 불확실한 부분을 나타냅니다.
    reason: 독자에게 현재 번역의 자료적 한계와 본문 훼손 표시의 의미를 투명하게 알립니다.
  - marker: b
    text: 마지막 단락은 사본 훼손이 심하여 문장의 주어, 목적어, 연결 관계가 여러 곳에서 불분명합니다. 따라서 뜻을 추정하여 매끄럽게 재구성하지 않았습니다.
    reason: 파편적 구문을 교리적 또는 서사적으로 보충하지 않고 실제 불확실성을 보존합니다.
lexical_decisions:
- source_word: godless
  choice: 불경건한
  rationale: ‘신이 없는’이라는 존재론적 단정보다, 원문 증언이 나타내는 종교적·윤리적 책망을 자연스럽고 폭넓게 전달합니다.
- source_word: flesh
  choice: 육체
  rationale: 단순한 ‘몸’보다 이 문맥의 인간적·소멸적 존재 방식이라는 긴장을 보존합니다.
- source_word: prison
  choice: 감옥
  rationale: 육체와 동격으로 놓인 강한 감금 비유를 완화하지 않았습니다.
- source_word: imperishable things
  choice: 썩지 않는 것들
  rationale: ‘불멸의 것들’로 해석 범위를 좁히지 않고 부패·소멸하지 않음을 직접 나타냅니다.
- source_word: wheel
  choice: 수레바퀴
  rationale: 정확한 상징적 지시 대상이 불분명하므로 일반화하거나 해설하지 않고 구체적 이미지를 유지합니다.
- source_word: souls
  choice: 영혼
  rationale: 육체와 대조되는 비가시적 인간 요소를 드러내는 전통적이면서도 일반 독자가 이해하기 쉬운 표현입니다.
- source_word: bodily powers
  choice: 육체의 힘
  rationale: ‘욕정’이나 특정 교리적 세력으로 단정하지 않고 원문의 다의성을 보존합니다.
- source_word: lure your limbs with fire
  choice: 불로 자기 지체를 꾀어내는
  rationale: 의미가 난해한 비유를 성적 행위나 자해로 단정하지 않고 증언의 낯선 표현을 유지했습니다.
- source_word: grapevine
  choice: 포도나무
  rationale: 비유의 중심 식물 이미지를 그대로 살리되, 그것이 상징하는 대상을 본문에서 특정하지 않았습니다.
theological_decisions:
- issue: 육체를 ‘멸망할 감옥’으로 부르는 표현
  choice: 동격적이고 부정적인 비유를 그대로 보존함
  alternative: 육체를 단지 감옥 ‘안에 있는 것’으로 완화함
  rationale: 본문의 급진적인 육체관을 현대의 특정 신학 체계에 맞추어 순화하지 않기 위해서입니다.
- issue: 태양과 달의 인격화 및 심판 기능
  choice: 태양이 심판하고 달이 시체를 바라본다는 문장을 유지함
  alternative: 하나님이나 그리스도를 가리키는 상징으로 명시함
  rationale: 본문 자체가 상징의 지시 대상을 분명히 밝히지 않으므로 해석을 본문에 삽입하지 않았습니다.
- issue: ‘여자들과 가까이함’에 대한 화 선언
  choice: 본문의 성별 특정과 부정한 성관계라는 표현을 보존함
  alternative: 모든 성적 부도덕을 성중립적으로 일반화함
