  revised_text: '**불경건한 자들에 대한 정죄**[a]


    그때 구원자께서 계속 말씀하셨습니다.


    “불경건하며 희망도 없이, 이루어지지 않을 일을 기다리는 여러분에게 화가 있습니다! 멸망할 수밖에 없는 감옥, 곧 육체에 희망을 두는 여러분에게 화가 있습니다! 언제까지 잊은 채로 있겠습니까? 언제까지 썩지 않는 것들도 썩을 것이라고 여기겠습니까? 여러분의 희망은 세상에 매여 있고, 여러분의 신은 이 삶입니다! 여러분은 스스로를 멸망시키고 있습니다!


    여러분 안에서 여러분을 태우는 꺼지지 않는 불 때문에 여러분에게 화가 있습니다!


    여러분의 마음속에서 돌아가는 수레바퀴 때문에 여러분에게 화가 있습니다!


    여러분 속에 자리 잡은 뜨거운 불길에 붙들린 여러분에게 화가 있습니다. 그것이 눈에 보이게 여러분의 육체를 삼키고, 눈에 보이지 않게 여러분의 영혼을 찢어, 여러분이 친구들과 합류하도록 준비시킬 것이기 때문입니다!


    갇힌 여러분에게 화가 있습니다. 여러분은 동굴 안에서 사슬에 묶여 있기 때문입니다!


    “여러분은 조롱하며 미친 듯이 웃고 비웃습니다! 여러분은 자신이 받을 정죄를 알지 못하고, 자신의 처지를 헤아리지 않으며, 자신이 어둠과 [죽음] 속에 산다는 것을 깨닫지 못했습니다! 도리어 여러분은 불에 취하고 쓰라림으로 [가득] 차 있습니다. 여러분 속의 [뜨거운 불길] 때문에 여러분의 마음은 미쳐 있고, 원수들의 독과 공격은 여러분에게 달콤합니다! 여러분이 자유를 내주고 종살이를 택했으므로, 캄캄함이 여러분에게 빛처럼 떠올랐습니다! 여러분은 마음을 검게 물들이고 생각을 어리석음에 내주었으며, 여러분 속의 불붙은 연기로 생각을 가득 채웠습니다! 여러분의 빛은 [⋯의] 구름 속에서 [가려졌고], 여러분을 덮는 옷을 여러분은 [⋯]. 여러분은 헛된 [희망]에 사로잡혔습니다. [여러분은] 누구를 믿었습니까? 여러분 모두가 [⋯] 여러분을 마치 [여러분이 ⋯]인 것처럼 대하는 자들 가운데 살고 있다는 것을 [깨닫지 못합니까]?


    [⋯] 여러분은 스스로를 캄캄한 물속에 잠기게 했습니다!


    여러분은 자기 욕망을 따라 행동했습니다!


    그릇된 길에 살면서, 세상을 심판하고 세상을 내려다보는 태양의 빛을 소홀히 하는 여러분에게 화가 있습니다. 그 빛은 원수들을 종으로 삼으려고 모든 것을 에워쌀 것입니다.


    여러분은 밤낮으로 내려다보며 여러분이 살육하여 생긴 시체들을 바라보는 달도 알아보지 못합니다!


    여자들과 가까이하기를 좋아하고 그들과 부정한 성관계를 맺기를 좋아하는 여러분에게 화가 있습니다!


    육체의 힘에 붙들린 여러분에게 화가 있습니다. 그것들이 여러분을 괴롭힐 것이기 때문입니다!


    악한 귀신들의 세력에 붙들린 여러분에게 화가 있습니다!


    불로 자기 지체를 유혹하는 여러분에게 화가 있습니다!


    “누가 여러분에게 서늘한 이슬비를 내려, 여러분의 뜨거운 불길과 함께 여러분을 휘감은 불구름을 끄겠습니까? 누가 태양을 여러분 위에 비추어, 여러분 속의 캄캄함을 몰아내고 그 캄캄함과 더러운 물을 감추겠습니까? 태양과 달, 공기와 바람, 땅과 물이 여러분에게 향기를 베풀 것입니다. 태양이 이 몸들 위에 비치지 않으면, 그것들은 잡초와 풀처럼 시들어 사라질 것이기 때문입니다. 태양이 그것들 위에 비치면, 그것들이 우거져 포도나무를 옥죕니다. 그러나 포도나무가 우거져 그 곁에서 자라는 모든 잡초와 다른 덤불을 그늘로 덮고, [뻗어 나가] 불어나면, 그것만이 자신이 자라는 땅을 차지하고 자기 그늘로 덮은 모든 곳을 다스릴 것입니다. 포도나무가 다 자라면 온 땅을 차지하고 주인을 위해 풍성하게 열매를 맺을 것이며, 주인을 더욱 기쁘게 할 것입니다. 주인이 이 식물들을 뿌리째 뽑는 큰 수고를 피하게 되었기 때문입니다. 그러나 포도나무가 스스로 그것들을 없애 버리고, 그것들을 질식시키기까지 하여, 그것들은 죽어 흙처럼 되었습니다.”


    그때 예수께서 계속 말씀하셨습니다.


    “가르침을 받아들이지 않은 여러분에게 화가 있습니다. 그리고 [⋯] 전하는 일을 할 사람들이 [⋯]. [여러분은] [⋯]로 달려가고 있으며, [⋯] [그들을] 아래로 몰아갑니다 [⋯]. 낮에 여러분은 그들을 죽입니다 [⋯]. 그들이 죽음에서 일어날 수 있도록 말입니다.”[b]'
  revised_footnotes:
