  text: '[] The secret sayings that the Savior spoke to Judas Thomas, which I—yes, I, Mathaias—wrote down as I walked along, listening to them speak with one another.'
translation:
  language: ko
  text: '[…] 구원자께서 유다 도마에게 하신 은밀한 말씀들입니다. 나, 바로 나 마타이아스가 길을 걸으며 두 분이 서로 말씀을 나누시는 것을 듣고 기록했습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 나그함마디 문서 II,7의 콥트어 본문을 직접 대조하기 전 단계로, 제공된 공개 영역 영문 번역 증언을 바탕으로 한 잠정 번역입니다.
    reason: 직접적인 원어 검토가 아직 이루어지지 않았다는 본문 자료의 한계를 독자에게 투명하게 알립니다.
lexical_decisions:
- source_word: secret sayings
  choice: 은밀한 말씀들
  rationale: 단순히 공개되지 않은 발언이라는 뜻과 계시적 성격을 함께 살리되, 특정 종파의 전문 용어로 좁히지 않았습니다.
- source_word: Savior
  choice: 구원자
  rationale: 원문의 칭호를 현대 한국어에서 이해하기 쉬운 형태로 직접 옮겼습니다.
- source_word: Judas Thomas
  choice: 유다 도마
  rationale: 두 이름을 모두 보존하고, 이를 다른 인물명이나 칭호로 임의로 조화시키지 않았습니다.
- source_word: Mathaias
  choice: 마타이아스
  rationale: 제공된 영문 증언의 독특한 이름 형태를 보존하여 마태나 맛디아로 단정하지 않았습니다.
- source_word: while I was walking
  choice: 길을 걸으며
  rationale: 기록자가 걸어가면서 대화를 들었다는 동시적 상황을 자연스럽게 나타냈습니다.
theological_decisions:
- issue: ‘secret’의 성격
  choice: 은밀한
  alternative: 비밀스러운 / 감추어진
  rationale: 말씀의 비공개성은 유지하되, 특정한 영지주의 체계나 교리적 의미를 번역 자체에 덧붙이지 않았습니다.
- issue: Judas Thomas의 정체
  choice: 유다 도마
  alternative: 쌍둥이 유다 / 도마라 불리는 유다
  rationale: 제공된 증언이 제시하는 두 이름만 옮기고, ‘도마’의 어원이나 인물 관계를 본문에서 해석하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 읽기 쉬운 합쇼체를 사용했습니다. ‘나, 바로 나’라는 강조를 보존했고, 구원자에 대한 존대를 유지했습니다. 첫머리의 결락 표시는 ‘[…]’로 나타냈습니다.
