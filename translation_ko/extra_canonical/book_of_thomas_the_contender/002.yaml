review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언을 기준으로 볼 때 대체로 충실합니다. 다만 마지막의 “in (self-)ignorance”는 괄호가 표시하는 불확정성을 보존해야 하는데, 초안의 ‘자신을 알지 못하여’는 이를 단정적인 자기-무지로 좁힙니다. 또한 ‘as you concur with me’의 난해한 연결은 본문에서 보존하되 주석으로 불확실성을 알리는 방식이 적절합니다. 콥트어 본문 직접 대조가 보류된 상태이므로 이 평가는 영어 증언에 대한 잠정 검토입니다.
  naturalness: 초안은 전반적으로 자연스럽지만, 목표 문체가 현대 표준 한국어 합쇼체이므로 인용문 안의 해라체 명령형과 서술형을 합쇼체로 통일하는 편이 안전합니다. ‘그와 더불어’는 선행사가 다소 불명확하므로 ‘그 앎과 함께’로 다듬었습니다.
  terminology: ‘구원자’, ‘참된 지식’, ‘쌍둥이’, ‘자신을 아는 이’는 제공된 증언의 개념과 호칭을 불필요하게 교리화하지 않고 잘 전달합니다. ‘자신을 아는 이’는 ‘the one of self-knowledge’의 명명 표현을 자연스럽게 유지합니다.
  issues:
  - severity: medium
    issue: 마지막의 괄호 친 ‘(self-)ignorance’의 불확정성이 사라졌습니다.
    rationale: ‘자신을 알지 못하여’는 무지를 오직 자기-무지로 확정합니다. 영어 증언은 괄호로 ‘무지’와 ‘자기 무지’ 사이의 불확정 또는 보충성을 표시하므로, 한국어 본문에도 ‘(자기) 무지’로 남겨 두는 것이 안전합니다.
  - severity: medium
    issue: 인용문 문체가 목표 합쇼체와 일치하지 않습니다.
    rationale: 서술 도입부는 ‘말씀하셨습니다’인데 직접 발화는 ‘귀담아들어라’, ‘알아내어라’ 등 해라체입니다. 지정된 현대 공식-공손 합쇼체에 맞춰 직접 발화도 ‘-십시오/-습니다’로 통일합니다.
  - severity: low
    issue: ‘그와 더불어’의 지시 대상이 한국어에서 다소 모호합니다.
    rationale: 자기 인식 또는 앎을 가리키는 원문의 동반 관계를 ‘그 앎과 함께’로 밝혀 문맥상 자연스럽게 했습니다.
  revised_text: '구원자께서 말씀하셨습니다. “형제 토마스여, 이 세상에 시간이 남아 있는 동안 내 말을 귀담아들으십시오. 그러면 당신이 마음속으로 궁금해하던 것들을 밝혀 드리겠습니다.


    “당신이 나의 쌍둥이이며 참된 벗이라고 일컬어졌으니, 당신 자신을 살펴보십시오. 그리고 당신이 누구인지, 어떤 방식으로 존재하는지, 앞으로 어떻게 될지를 알아보십시오. 당신은 ‘나의 형제’라고 불릴 것이므로, 자신을 알지 못하는 것은 마땅하지 않습니다. 그러나 나는 당신이 이미 자신을 깨달았음을 압니다. 내가 참된 지식이라는 것을 당신이 이미 깨달았기 때문입니다. 그러므로 비록 당신이 깨닫지 못한다 해도, 나와 뜻을 같이하므로[a] 당신은 이미 지식에 이르렀으며, 그래서 ‘자신을 아는 이’라고 불릴 것입니다. 자신을 아는 지식이 없는 사람은 아무것도 알지 못하지만, 자신을 아는 사람은 그 앎과 함께 이미 모든 것에 관한 깊은 지식을 얻었기 때문입니다. 그러므로 나의 형제 토마스여, 당신은 사람들에게 감추어진 것, 곧 그들이 (자기) 무지 가운데서 걸려 넘어지는 것을 보았습니다.”'
