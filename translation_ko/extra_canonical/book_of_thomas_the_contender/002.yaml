id: BTHC.002
reference: Book of Thomas the Contender — The Savior Speaks with Thomas
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: 'The Savior said: “Brother Thomas, heed me while you have time (left) in the world, and I will disclose to you the things you have wondered about in your mind.


    “Because it has been said that you are my twin and true friend, study yourself and discover who you are, the mode in which you are, and how you will be (in the future). Because you will be called ‘my brother,’ it is not appropriate for you to be self-ignorant, yet I know you have comprehended (yourself), because you already comprehended that I am true knowledge. Thus, even though you do not comprehend, as you concur with me 1 , you have already achieved knowledge, and (so) you will be called ‘the one of self-knowledge.’ This is because whoever has no self-knowledge is a know-nothing, but whoever has self-knowledge has together with it already obtained deep knowledge about everything. Consequently, my brother Thomas, you have gazed on what is veiled to humans, namely, what they in (self-)ignorance stumble over.”'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex II,7
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/thomas-the-contender
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'The Savior said: “Brother Thomas, heed me while you have time (left) in the world, and I will disclose to you the things you have wondered about in your mind.


