base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: ko
  text: '구원자께서 말씀하셨습니다. “형제 토마스여, 네게 이 세상에서 시간이 남아 있는 동안 내 말을 귀담아들어라. 그러면 네가 마음속으로 궁금해하던 것들을 내가 너에게 밝혀 주겠다.


    “네가 나의 쌍둥이이며 참된 벗이라고들 하니, 너 자신을 살펴 네가 누구인지, 지금 어떤 방식으로 존재하는지, 앞으로 어떻게 될지를 알아내어라. 네가 ‘나의 형제’라고 불릴 것이므로, 네가 자신을 알지 못하는 것은 마땅하지 않다. 그러나 나는 네가 이미 자신을 깨달았음을 안다. 내가 참된 지식임을 네가 이미 깨달았기 때문이다. 그러므로 네가 깨닫지 못한다 하더라도, 나와 뜻을 같이하므로[a] 너는 이미 지식에 이르렀으며, 그래서 ‘자신을 아는 사람’이라고 불릴 것이다. 자신을 알지 못하는 사람은 아무것도 알지 못하지만, 자신을 아는 사람은 그와 더불어 이미 모든 것에 관한 깊은 지식을 얻었기 때문이다. 그러므로 나의 형제 토마스여, 너는 사람들에게 감추어진 것, 곧 그들이 자신을 알지 못하여 걸려 넘어지는 것을 바라보았다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘나와 뜻을 같이하므로’에 해당하는 구절의 정확한 관계와 의미는 불분명합니다. 제공된 영어 증언에는 이 대목에 주석 표지 ‘1’이 있으나 주석 내용은 함께 제공되지 않았습니다.
    reason: ‘깨닫지 못한다’는 말과 ‘이미 지식에 이르렀다’는 말 사이의 연결이 난해하므로, 본문에서 이를 임의로 해소하지 않고 독자에게 불확실성을 알립니다.
lexical_decisions:
- source_word: Savior
  choice: 구원자
  rationale: 문헌의 호칭을 교파적 수식 없이 직접적이고 품위 있게 옮겼습니다.
- source_word: heed me
  choice: 내 말을 귀담아들어라
  rationale: 단순히 소리를 듣는 것이 아니라 주의를 기울이고 따르라는 뜻을 자연스러운 현대 한국어로 나타냈습니다.
- source_word: the mode in which you are
  choice: 지금 어떤 방식으로 존재하는지
  rationale: 존재 상태나 양태를 가리키는 추상성을 보존하면서, 한국어 독자가 이해할 수 있도록 ‘존재하다’를 밝혔습니다.
- source_word: true knowledge
  choice: 참된 지식
  rationale: ‘진리의 지식’처럼 의미를 확대하지 않고, 지식 자체가 참되다는 원문의 서술 구조를 유지했습니다.
- source_word: self-knowledge
  choice: 자신을 아는 것 / 자신을 아는 사람
  rationale: 문맥에 따라 명사적 개념과 사람을 가리키는 표현을 자연스럽게 구분하되, 자기 인식이라는 핵심 반복을 보존했습니다.
- source_word: know-nothing
  choice: 아무것도 알지 못하다
  rationale: 현대 한국어에서 경멸적 별칭으로 들릴 수 있는 직역 대신, 문맥의 대조 명제를 분명하게 전달했습니다.
- source_word: stumble over
  choice: 걸려 넘어지다
  rationale: 비유적 긴장과 원문의 장애물 이미지를 유지했습니다.
theological_decisions:
- issue: 토마스를 ‘쌍둥이’라고 부르는 표현의 성격
  choice: 네가 나의 쌍둥이이며 참된 벗이라고들 하니
  alternative: 네가 나의 쌍둥이이며 참된 벗이므로
  rationale: ‘it has been said’를 보존하여 이 호칭을 화자가 직접 확정하는 진술로 강화하지 않았습니다.
- issue: ‘내가 참된 지식이다’라는 동일시
  choice: 내가 참된 지식임을
  alternative: 내가 참된 지식을 지녔음을
  rationale: 화자와 지식을 직접 동일시하는 문헌의 신학적 표현을 완화하거나 해석적으로 바꾸지 않았습니다.
- issue: 이해하지 못함과 이미 지식에 이름 사이의 긴장
  choice: 네가 깨닫지 못한다 하더라도 … 너는 이미 지식에 이르렀으며
  alternative: 네가 아직 온전히 깨닫지는 못했더라도 …
  rationale: ‘아직’이나 ‘온전히’를 보충해 논리적 긴장을 해소하지 않고, 제공된 증언의 역설적 표현을 유지했습니다.
- issue: 모든 것에 관한 깊은 지식의 범위
  choice: 모든 것에 관한 깊은 지식
  alternative: 만물의 신비에 관한 완전한 지식
  rationale: ‘신비’나 ‘완전한’ 같은 신학적 확장을 더하지 않고 제공된 증언의 범위를 따랐습니다.
translation_notes:
  register: 현대 표준 한국어의 품위 있는 합쇼체 서술과 인용문 안의 장중한 해라체 명령을 사용했습니다. 화자와 토마스의 친밀하고 권위적인 관계를 살리기 위해 ‘너’를 유지했습니다. 이 초안은 나그함마디 문서 II,7의 콥트어 본문을 직접 대조한 결과가 아니라, 제공된 공공 영역 영어 증언을 바탕으로 한 잠정 번역입니다. 따라서 콥트어 원문 검토 뒤 어휘, 통사 관계, 대명사 지시 대상 및 난해 구절을 재검토해야 합니다.
