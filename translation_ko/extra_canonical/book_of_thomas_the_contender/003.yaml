  revised_text: '도마가 주님께 말했습니다. “그러므로 간청드립니다. 주님께서 올라가시기 전에 제가 여쭙는 것에 대답해 주십시오. 제가 감추어진 것들에 관하여 주님께 듣고 나면, 그것들을 (드러내 놓고) 말할 수 있을 것입니다.[a] 그리고 다른 사람들 앞에서 진리를 행하기가 어렵다는 것이 제게 분명합니다.”


    구주께서 대답하셨습니다. “보이는 것들도 너희에게 감추어져 있다면, 어떻게 보이지 않는 것들에 관하여 들을 수 있겠습니까? 이 세상에서 보이는 진리의 일들을 행하기도 너희에게 어렵다면, 보이지 않는 높은 곳과 충만에 속한 일들은 과연 어떻게 행하겠습니까?[b] 또 어떻게 너희가 ‘일꾼들’이라 불리겠습니까? 이 점에서 너희는 배우는 사람들일 뿐이며, 아직 완전함의 정상에 이르지 못했습니다.”


    도마가 구주께 대답했습니다. “주님께서 보이지 않는 것들이라 부르시는 것, [그럼에도] 우리에게 감추어진 것에 관하여 설명해 주십시오.”


    구주께서 말씀하셨습니다. “[모든] 몸들은 […] 짐승들은 생겨나고 […] 그것은 […]처럼 드러나며 […] 또한 이것은, 위에 있는 이들은 […] 보이는 것들이지만, [그것들은] 자기 뿌리 안에서는 보이며 [], 그 열매가 그들을 길러 줍니다.[c] 그러나 이 보이는 몸들은 자신들과 닮은 짐승들을 먹으며 살아가고, 그 결과 몸들이 변합니다. 변하는 것은 쇠하여 사라질 것이며, 그것은 그때부터 생명에 대한 어떤 희망도 잃습니다. 그것은 짐승의 몸이기 때문입니다. 그러므로 짐승의 몸들이 사라지는 것처럼, 이 [몸의] 형상들도 사라질 것입니다. 그것들은 짐승들의 것처럼 성교에서 생겨나지 않습니까? 그것 또한 성교에서 생겨난다면, 어떻게 짐승들과 다른 것을 낳겠습니까? 그러므로 너희는 성숙해질 때까지 어린아이로 남아 있을 것입니다.”


    도마가 대답했습니다. “그러므로 주님, 제가 말씀드립니다. 보이지 않는 것들과 해석하기 어려운 것들을 말하는 사람들은 밤에 과녁을 향해 화살을 쏘는 사람들과 같습니다. 그들도 과녁을 향해 쏘므로, 그렇게 쏘는 다른 모든 사람처럼 분명히 화살을 쏘지만, 과녁은 보이지 않습니다. 그러나 빛이 나타나 어둠을 가리면,[d] 그때 각 사람의 행한 일이 드러날 것입니다. 오 주님, 우리의 빛이시여, 우리를 비추어 주십시오.”


    예수께서 말씀하셨습니다. “빛의 본성은 빛입니다.”[e]


    도마가 말했습니다. “주님, 사람들을 위하여 비치는 이 보이는 빛은 왜 떠올랐다가 집니까?”


    구주께서 대답하셨습니다. “복된 도마여, 이 보이는 빛이 너희를 위하여 비치는 것은 물론 너희가 여기에 머물게 하려는 것이 아니라, 오히려 떠나게 하려는 것입니다. 모든 선택받은 이들이 짐승의 상태를 벗어 버리면, 이 빛은 자기 본질로 (다시) 올라가 그 빛을 맞이할 것입니다.[f] 이는 이 빛이 선한 종이기 때문입니다.”'
