translation:
  language: ko
  text: '도마가 주님께 말했습니다. “그러므로 간청드립니다. 주님께서 올라가시기 전에 제가 여쭙는 것에 대답해 주십시오. 제가 감추어진 것들에 관하여 주님께 듣고 나면, 그것들을 [드러내 놓고] 말할 수 있을 것입니다.[a] 그리고 다른 사람들 앞에서 진리를 행하기가 어렵다는 것이 제게 분명합니다.”


    구주께서 대답하셨습니다. “보이는 것들도 너희에게 감추어져 있다면, 어떻게 보이지 않는 것들에 관하여 들을 수 있겠습니까? 이 세상에서 보이는 진리의 일들을 행하기도 너희에게 어렵다면, 보이지 않는 높은 곳과 충만에 속한 일들은 과연 어떻게 행하겠습니까?[b] 또 어떻게 너희가 ‘일꾼들’이라 불리겠습니까? 이 점에서 너희는 배우는 사람들일 뿐이며, 아직 완전함의 정상에 이르지 못했습니다.”


    도마가 구주께 대답했습니다. “주님께서 보이지 않는 것들이라 부르시는 것, [그러나] 우리에게 감추어진 것에 관하여 설명해 주십시오.”


    구주께서 말씀하셨습니다. “[모든] 몸은 […] 짐승들은 태어나고 […] 그것은 […]처럼 드러나며 […] 또한 이것은, 위에 있는 이들은 […] 보이는 것들이지만, [그것들은] 자기 뿌리 안에서는 보이며 [], 그 열매가 그들을 길러 줍니다.[c] 그러나 이 보이는 몸들은 자신들과 닮은 짐승들을 먹으며 살아가고, 그 결과 몸들이 변합니다. 변하는 것은 쇠하여 사라질 것이며, 그때부터 생명에 대한 어떤 희망도 잃습니다. 그것은 짐승의 몸이기 때문입니다. 그러므로 짐승의 몸들이 사라지는 것처럼, 이 [몸의] 형상들도 사라질 것입니다. 그것들은 짐승의 몸과 마찬가지로 성교에서 생겨나지 않습니까? 그것도 성교에서 생겨난다면, 어떻게 짐승과 다른 것을 낳겠습니까? 그러므로 너희는 성숙해질 때까지 어린아이로 남아 있을 것입니다.”


    도마가 대답했습니다. “그러므로 주님, 제가 말씀드립니다. 보이지 않는 것들과 해석하기 어려운 것들을 말하는 사람들은 밤에 과녁을 향해 화살을 쏘는 사람들과 같습니다. 과녁을 향해 쏘기는 하므로 다른 모든 사람처럼 분명히 화살을 쏘지만, 과녁은 보이지 않습니다. 그러나 빛이 나타나 어둠을 가리면,[d] 그때 각 사람의 행한 일이 드러날 것입니다. 오 주님, 우리의 빛이시여, 우리를 비추어 주십시오.”


    예수께서 말씀하셨습니다. “빛의 본성은 빛입니다.”[e]


    도마가 말했습니다. “주님, 사람들을 위하여 비치는 이 보이는 빛은 왜 떠올랐다가 집니까?”


    구주께서 대답하셨습니다. “복된 도마여, 이 보이는 빛이 너희를 위하여 비치는 것은 물론 너희가 여기에 머물게 하려는 것이 아니라, 오히려 떠나게 하려는 것입니다. 모든 선택받은 이들이 짐승의 상태를 벗어 버리면, 이 빛은 자기 본질로 다시 올라가 그 빛을 맞이할 것입니다.[f] 이는 이 빛이 선한 종이기 때문입니다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘드러내 놓고’는 문맥을 보충한 말입니다. 현 증언은 이를 괄호로 표시합니다.
    reason: 영어 witness의 편집적 보충 표시를 한국어 본문에서도 명시하기 위함입니다.
  - marker: b
    text: ‘높은 곳’과 ‘충만’은 이 문헌의 우주론적 표현으로 보이지만, 둘의 정확한 관계는 현 증언만으로 확정하기 어렵습니다.
    reason: 전문 개념의 모호성과 신학적 긴장을 보존하기 위함입니다.
  - marker: c
    text: 이 단락은 사본의 큰 결손 때문에 문맥이 심하게 끊겨 있습니다. 대괄호와 […]는 복원된 말과 결손을 나타내며, 빈 대괄호 []도 제공된 증언에 그대로 남아 있습니다.
    reason: 파손 본문을 매끄럽게 재구성한 것으로 오해하지 않도록 하기 위함입니다.
  - marker: d
    text: 현 증언은 빛이 어둠을 ‘가린다’고 되어 있습니다. 문맥상 ‘걷어 낸다’는 뜻일 가능성도 있으나, 여기서는 난해한 표현을 그대로 보존했습니다.
    reason: 의미를 임의로 교정하지 않고 실제 증언의 난점을 알리기 위함입니다.
  - marker: e
    text: ‘빛의 본성은 빛입니다’는 원문의 압축된 표현을 따른 것으로, 그 뜻을 더 풀어 쓰지 않았습니다.
    reason: 순환적이거나 격언적인 진술의 열린 의미를 유지하기 위함입니다.
  - marker: f
    text: ‘그 빛’이 앞의 가시적 빛과 같은 빛인지, 다른 근원적 빛인지 분명하지 않습니다. ‘다시’도 현 증언의 괄호 속 보충을 반영합니다.
    reason: 대명사의 지시 대상과 편집적 보충에 관한 불확실성을 표시하기 위함입니다.
lexical_decisions:
- source_word: Fullness
  choice: 충만
  rationale: 문헌의 우주론적 전문 개념일 가능성을 보존하면서도 특정 교파의 해석을 덧붙이지 않는 표현입니다.
- source_word: workers
  choice: 일꾼들
  rationale: 행위와 자격을 함께 암시하는 원 증언의 비유적 명칭을 직설적으로 유지했습니다.
- source_word: animal body / animal state
  choice: 짐승의 몸 / 짐승의 상태
  rationale: 단순히 ‘육체적’이나 ‘본능적’으로 해석해 완화하지 않고, witness의 거친 대조를 보존했습니다.
- source_word: intercourse
  choice: 성교
  rationale: 생물학적 발생 논증을 모호하게 만들지 않도록 명시적으로 옮겼습니다.
- source_word: essence
  choice: 본질
  rationale: 빛이 근원적 존재 상태로 돌아간다는 형이상학적 언어를 중립적으로 보존했습니다.
- source_word: nature
  choice: 본성
  rationale: ‘빛의 본성은 빛’이라는 압축적이고 순환적으로 들리는 진술을 해설 없이 유지했습니다.
theological_decisions:
- issue: ‘높은 곳’과 ‘충만’의 관계
  choice: ‘보이지 않는 높은 곳과 충만에 속한 일들’로 병렬적 긴장을 유지함
  alternative: ‘보이지 않는 지고한 충만에 속한 일들’로 하나의 개념처럼 통합함
  rationale: 영어 증언만으로 두 표현이 동격인지 별개 영역인지 확정하기 어려워 문법적 모호성을 남겼습니다.
- issue: 선택받은 이들이 버리는 animal state
  choice: ‘짐승의 상태를 벗어 버리다’
  alternative: ‘동물적 본성을 버리다’ 또는 ‘육체를 벗다’
  rationale: 도덕적 본성이나 육체 자체로 단정하지 않고 상태를 뜻하는 증언의 범위를 보존했습니다.
- issue: 마지막 문장의 두 빛
  choice: ‘이 빛’과 ‘그 빛’을 구별하되 동일성 여부는 확정하지 않음
  alternative: 둘을 모두 ‘빛’으로 처리하거나 신적 빛과 가시적 빛으로 명시함
  rationale: 가시적 빛이 자기 본질로 올라가 무엇을 맞이하는지 원 증언이 불분명하므로 해석을 강제하지 않았습니다.
- issue: 빛이 어둠을 ‘가린다’는 역설
  choice: 증언대로 ‘어둠을 가리면’으로 유지함
  alternative: 문맥상 ‘어둠을 걷어 내면’으로 교정함
  rationale: 전승의 역설, 번역상의 난점, 또는 본문 문제일 수 있으므로 자연스럽게 고쳐 의미를 확정하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 대화는 지나치게 고어화하지 않았으며, ‘구주’, ‘충만’, ‘본질’처럼 문헌의 종교적·형이상학적 성격에 필요한 핵심어는 유지했습니다. 콥트어 직접 대조가 아직 이루어지지 않았으므로, 제공된 공공 영역 영어 증언에 근거한 잠정 번역입니다. 사본 결손, 편집 복원, 괄호 및 애매한 지시 관계를 임의로 해소하지 않았습니다.
