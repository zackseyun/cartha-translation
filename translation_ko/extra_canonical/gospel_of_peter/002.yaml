    (5) And Herod said, "Brother Pilate, even if someone hadn''t asked for him, we would''ve buried him, since also Sabbath is beginning, because it''s written in the Law, ''The sun shouldn''t set on one who''s been killed.''"'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/002.yaml
  text: '(3) Joseph was standing there, a friend of Pilate and of the Lord. When he saw that they were about to crucify him, he went to Pilate and asked for the Lord’s body for burial. (4) Pilate sent word to Herod and asked him for the body.


    (5) Herod said, “Brother Pilate, even if no one had asked for him, we would have buried him, since the Sabbath is also beginning. For it is written in the Law, ‘The sun must not set on one who has been killed.’”'
translation:
  language: ko
  text: '(3) 빌라도와 주님의 친구인 요셉이 그곳에 서 있었습니다. 그는 사람들이 주님을 십자가에 못 박으려 하는 것을 보고 빌라도에게 가서, 장사할 수 있도록 주님의 시신을 내달라고 요청했습니다. (4) 빌라도는 헤롯에게 사람을 보내 그 시신을 내달라고 요청했습니다.


    (5) 헤롯이 말했습니다. “빌라도 형제여, 아무도 그분을 내달라고 요청하지 않았더라도 우리가 그분을 장사했을 것입니다. 안식일도 시작되려 하기 때문입니다. 율법에 ‘죽임을 당한 사람 위로 해가 지게 해서는 안 된다’라고 기록되어 있습니다.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: friend of Pilate and the Lord
  choice: 빌라도와 주님의 친구
  rationale: 요셉이 빌라도와 주님 두 사람 모두의 친구라는 병렬 관계를 그대로 보존했습니다.
- source_word: body of the Lord
  choice: 주님의 시신
  rationale: 장사를 위한 죽은 몸이라는 문맥을 현대 한국어에서 분명하고 품위 있게 나타냈습니다.
- source_word: for burial / buried
  choice: 장사할 수 있도록 / 장사했을 것입니다
  rationale: 시신을 매장하거나 장례 절차를 행한다는 성서적 문맥에 맞추어 ‘장사하다’를 사용했습니다.
- source_word: Sabbath is beginning
  choice: 안식일도 시작되려 하기 때문입니다
  rationale: 안식일이 임박했다는 시간적 의미를 자연스럽게 전달하면서 시작 시점을 구체적으로 덧붙이지 않았습니다.
- source_word: Brother Pilate
  choice: 빌라도 형제여
  rationale: 친족 호칭인지 우호적·공적인 호칭인지 단정하지 않고 원문의 호칭을 보존했습니다.
theological_decisions:
- issue: 헤롯이 예수의 시신을 내주는 권한을 가진 듯한 서술
  choice: 빌라도는 헤롯에게 사람을 보내 그 시신을 내달라고 요청했습니다
  alternative: 빌라도는 헤롯에게 시신 처리에 관해 허락을 구했습니다
  rationale: 정경 복음서와 조화시키거나 행정적 배경을 보충하지 않고, 현존 증언의 긴장과 서술 구조를 유지했습니다.
- issue: 율법 인용의 표현
  choice: 죽임을 당한 사람 위로 해가 지게 해서는 안 된다
  alternative: 그 시체를 밤새 나무 위에 두어서는 안 된다
  rationale: 신명기 21:23의 익숙한 정경 문구로 교정하지 않고, 제공된 증언에 나타난 인용 형태를 번역했습니다.
- issue: 헤롯의 ‘그분’ 지시 대상
  choice: 그분을 내달라고 요청하지 않았더라도 우리가 그분을 장사했을 것입니다
  alternative: 그 시신을 요청하지 않았더라도 우리가 그것을 장사했을 것입니다
  rationale: 영어 증언의 인칭 지시가 예수 자신과 그 시신 사이를 오가는 특징을 지나치게 해소하지 않되, 한국어에서 예수를 가리키는 존칭을 사용했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있고 공손한 합쇼체를 사용했습니다. 본문은 제공된 공공 영역 영어 증언을 토대로 한 잠정 번역이며, 아크밈 코덱스의 그리스어 원문에 대한 직접 검토가 아직 필요합니다. 문장은 일반 독자가 이해하기 쉽게 다듬되, 헤롯의 권한과 율법 인용 방식에서 생기는 문헌 고유의 긴장은 그대로 두었습니다.
