revisions:
- from: '그러자 유대인들과 장로들과 제사장들은 자기들이 스스로에게 얼마나 큰 악을 저질렀는지 깨닫고, 슬피 울며 말하기 시작했습니다. “우리의 죄가 화를 불러왔구나! 심판과 예루살렘의 종말이 가까이 왔다!”


    그러나 나와 내 동료들은 슬픔에 잠겼고 마음에 깊은 상처를 입어 숨어 지냈습니다. 그들이 우리를 악을 저지른 자들, 곧 성전을 불태우려 한 자들로 여기고 찾아다녔기 때문입니다. 이 모든 일에 더하여 우리는 안식일까지 밤낮으로 금식하며 앉아서 슬퍼하고 울었습니다.'
  to: '그러자 유대인들과 장로들과 제사장들은 자기들이 자신들에게 얼마나 큰 잘못을 저질렀는지 알고 애통하기 시작하며 말했습니다. “우리의 죄에 화가 있도다! 심판과 예루살렘의 종말이 가까이 왔다!”


    그러나 나는 동료들과 함께 슬퍼했고, 마음에 상처를 입어 숨어 있었습니다. 그들이 우리를 악을 행한 자들로, 또 성전을 불태우려는 자들로 여겨 찾고 있었기 때문입니다. 이 모든 일에 더하여, 우리는 안식일까지 밤낮으로 금식하고 앉아 슬퍼하며 울었습니다.'
  rationale: 직접 인용의 탄식과 두 혐의의 병렬을 영어 증언에 더 가깝게 보존했습니다. ‘자기들이 스스로에게’는 한국어에서 중복감이 있으므로 ‘자기들이 자신들에게’로 다듬되 재귀 의미는 유지했습니다. 그리스어 원문 직접 검토가 보류된 상태이므로, 본문이 허용하는 범위를 넘는 해석적 보충은 피했습니다.
