  yaml_path: translation/extra_canonical/gospel_of_peter/007.yaml
  text: 'Then the Jews, the elders, and the priests, knowing how much wrong they had done to themselves, began to mourn and say, “Woe to our sins. The judgment and the end of Jerusalem is near!”


    But I with my companions was grieved, and being wounded in mind, we were hiding, because we were being sought by them as wrongdoers and as wanting to burn the temple. On top of all this, we were fasting, sitting, mourning, and weeping night and day until the Sabbath.'
translation:
  language: ko
  text: '그러자 유대인들과 장로들과 제사장들은 자기들이 자신들에게 얼마나 큰 잘못을 저질렀는지 알고 애통하기 시작하며 말했습니다. “우리의 죄에 화가 있도다! 심판과 예루살렘의 종말이 가까이 왔다!”


    그러나 나는 동료들과 함께 슬퍼했고, 마음에 상처를 입어 숨어 있었습니다. 그들이 우리를 악을 행한 자들로, 또 성전을 불태우려는 자들로 여겨 찾고 있었기 때문입니다. 이 모든 일에 더하여, 우리는 안식일까지 밤낮으로 금식하고 앉아 슬퍼하며 울었습니다.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: the Jews
  choice: 유대인들
  rationale: 제공된 고대 본문 정보와 영어 증언의 집단 명칭을 그대로 보존하되, 이어지는 ‘장로들과 제사장들’과 병렬되도록 옮겼습니다.
- source_word: how much wrong they had done to themselves
  choice: 자기들이 스스로에게 얼마나 큰 악을 저질렀는지
  rationale: 행위의 심각성과 그 결과가 자신들에게 돌아간다는 재귀적 의미를 함께 살렸습니다.
- source_word: Woe to our sins
  choice: 우리의 죄가 화를 불러왔구나
  rationale: 단순히 죄 자체를 향해 ‘화가 있다’고 말하는 어색함을 피하면서도, 탄식과 임박한 재앙의 뜻을 자연스러운 한국어로 표현했습니다.
- source_word: being wounded in mind
  choice: 마음에 깊은 상처를 입어
  rationale: 정신적 고통을 나타내는 상처의 비유를 유지하면서 현대 독자가 자연스럽게 이해하도록 했습니다.
- source_word: wrongdoers
  choice: 악을 저지른 자들
  rationale: 법률적 유죄로 좁히지 않고 도덕적·범죄적 비난을 포괄하도록 옮겼습니다.
- source_word: the temple
  choice: 성전
  rationale: 예루살렘의 성전이라는 문맥에 맞는 관용적 성서 용어를 사용했습니다.
theological_decisions:
- issue: ‘심판’과 ‘예루살렘의 종말’의 관계
  choice: 심판과 예루살렘의 종말이 가까이 왔다
  alternative: 심판, 곧 예루살렘의 종말이 가까이 왔다
  rationale: 두 표현을 동격으로 단정하지 않고 병렬된 채로 두어 원문의 가능한 구별과 긴장을 보존했습니다.
- issue: 유대인 집단에 대한 서술 범위
  choice: 본문의 열거를 그대로 유지
  alternative: 일부 유대 지도자들로 한정
  rationale: 본문은 ‘유대인들과 장로들과 제사장들’을 구별하여 열거하므로 이를 임의로 축소하거나 확대하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 직접 인용의 탄식은 감정이 살아나도록 해라체 감탄문으로 처리했습니다. 절 번호는 요청 자료의 English POB 관례에 따라 본문에서 생략했습니다. 제공 자료상 그리스어 직접 대조가 아직 보류 중이므로, 문안은 공개 영역 영어 증언과 확인 가능한 원문 어의에 기대어 신중하게 작성했습니다.
