  source_fidelity: 영어 증언을 기준으로 볼 때, 초안은 전반적 사건 전개를 충실히 옮겼습니다. 그러나 “Woe to our sins”를 ‘우리의 죄가 화를 불러왔구나’로 바꾼 것은 원문의 죄를 향한 직접 탄식을 인과 진술로 구체화합니다. 또한 ‘wrongdoers and as wanting to burn the temple’의 두 आरोप을 ‘곧’으로 동격 처리한 것은 원문의 병렬을 약화합니다. 제공 자료에서 그리스어 직접 검토가 보류되어 있으므로, 영어 증언의 구조와 모호성을 보존하는 수정이 안전합니다.
