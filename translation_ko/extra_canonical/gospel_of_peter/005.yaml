  terminology: ‘유대’, ‘쓸개즙’, ‘신 포도주’, ‘성전의 휘장’은 적절합니다. ‘그것이 들어 올려졌습니다’는 다소 낯선 표현이지만, 원문의 지시 대상 및 사건 의미가 확정되지 않는 상황에서 그 낯섦 자체가 모호성 보존에 기여합니다.
