base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/005.yaml
  text: '(15) It was midday, and darkness covered all Judea. They were troubled and distressed that the sun might set while he was still alive. It is written to them, “The sun must not set on someone who has been killed.” (16) One of them said, “Give him bile mixed with sour wine to drink.” They mixed it and gave it to him to drink. (17) They fulfilled all things and piled up sins upon their own heads. (18) Many people went around with lanterns, thinking it was night, and some fell down.


    (19) The Lord cried out, saying, “My Power, the Power, you have left me!” When he said this, it was taken up. (20) At that very hour, the veil of the temple in Jerusalem was torn in two.'
translation:
  language: ko
  text: '(15) 한낮이 되었는데, 어둠이 온 유대를 짙게 뒤덮었습니다. 그들은 그가 아직 살아 있는 동안 해가 질까 염려하며 괴로워했습니다. 그들에게는 “죽임당한 사람 위로 해가 져서는 안 된다”라고 기록되어 있습니다.[a] (16) 그들 가운데 한 사람이 말했습니다. “그에게 쓸개즙을 신 포도주에 섞어 마시게 하시오.” 그들은 그것을 섞어 그에게 마시게 했습니다. (17) 그들은 모든 일을 이루었고, 자기들 머리 위에 죄를 쌓았습니다. (18) 많은 사람이 밤인 줄 알고 등불을 들고 돌아다녔으며, 더러는 넘어졌습니다.


    (19) 주께서 큰 소리로 외치셨습니다. “나의 능력이여, 능력이여, 당신은 나를 떠나셨습니다!” 그분이 이렇게 말씀하시자, 그것이 들어 올려졌습니다.[b] (20) 바로 그 시각에 예루살렘 성전의 휘장이 둘로 찢어졌습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 인용문은 신명기 21:22–23과 관련되어 보이지만, 알려진 본문과 표현이 정확히 같지는 않습니다. ‘그들에게’가 누구를 가리키는지도 분명하지 않습니다.
    reason: 인용의 배경과 대명사의 모호성을 알립니다.
  - marker: b
    text: ‘그것’이 무엇을 가리키는지는 분명하지 않습니다. 본문은 주님 자신, 그분의 능력, 영이나 생명 등이 들려 올라갔다고 명시하지 않습니다.
    reason: 원문의 중요한 문법적·신학적 모호성을 보존하고 설명합니다.
lexical_decisions:
- source_word: darkness held fast
  choice: 어둠이 … 짙게 뒤덮었습니다
  rationale: 어둠이 유대 전역을 강하게 장악한 모습을 자연스러운 현대 한국어로 나타냈습니다.
- source_word: bile with sour wine
  choice: 쓸개즙을 신 포도주에 섞어
  rationale: ‘bile’과 ‘sour wine’을 각각 구별하면서 혼합 관계를 문맥에 맞게 밝혔습니다.
- source_word: My Power, the Power
  choice: 나의 능력이여, 능력이여
  rationale: 이례적인 호칭과 반복을 익숙한 성경 구절로 바꾸지 않고 그대로 보존했습니다.
- source_word: veil of the temple
  choice: 성전의 휘장
  rationale: 성전 내부의 가림막을 가리키는 전통적이면서도 널리 이해되는 표현을 사용했습니다.
theological_decisions:
- issue: “it was taken up”의 지시 대상과 의미
  choice: 그것이 들어 올려졌습니다
  alternative: 그분이 들려 올라가셨습니다 / 그분의 영이 거두어졌습니다
  rationale: 제공된 증거만으로 대명사의 지시 대상이나 사건의 성격을 확정할 수 없으므로, 해석을 덧붙이지 않고 모호성을 보존했습니다.
- issue: “They fulfilled all things”의 성취 대상
  choice: 그들은 모든 일을 이루었고
  alternative: 그들은 모든 예언을 이루었고
  rationale: 본문에 ‘예언’이나 ‘성경’이라는 목적어가 명시되어 있지 않으므로 이를 보충하지 않았습니다.
- issue: ‘나의 능력’이라는 호칭의 정규화 여부
  choice: 나의 능력이여, 능력이여
  alternative: 나의 하나님, 나의 하나님
  rationale: 다른 수난 전승의 문구로 조화시키지 않고 이 문헌의 독특한 표현과 신학적 긴장을 유지했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 서술은 장중하되 평이하게 유지했으며, 반복적이고 이례적인 표현은 매끄럽게 고쳐 쓰지 않았습니다. 이 초안은 제공된 공용 영역 영어 증언을 근거로 하므로, 그리스어 원문 대조가 이루어지면 어휘와 구문을 재검토해야 합니다.
