review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언과 대체로 충실하게 대응합니다. 다만 “본래 오신 곳”의 ‘본래’는 증언에 없는 뉘앙스를 보태므로 “오셨던 곳”으로 고치는 것이 더 직접적입니다. 또한 “믿지 못하겠거든”은 믿을 능력이 없다는 뜻으로도 읽힐 수 있어, 조건절의 단순한 불신을 나타내는 표현으로 조정하는 것이 적절합니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. “십자가에 못 박히신 그분이 아닙니까?”는 원문의 단편적 의문을 비교적 잘 보존하지만, 앞선 ‘누구를 찾습니까?’와 연결하여 목적어를 밝혀 주면 한국어에서 더 명료하고 자연스럽습니다.
  terminology: ‘무덤’, ‘어떤 젊은이’, ‘빛나는 긴 옷’은 적절하며, 젊은이를 천사로 특정하지 않은 점도 좋습니다. ‘일어나셨습니다’는 제공된 증언의 어휘적 표현을 유지합니다. 예수에 대한 높임 표현은 한국어 종교 문맥과 격식체에 부합합니다.
  issues:
  - severity: low
    issue: “본래 오신 곳”
    rationale: 제공된 증언은 단지 ‘그가 온 곳(where he came from)’이라고 할 뿐 ‘본래’라는 시간적·본질적 뉘앙스를 명시하지 않습니다. “오셨던 곳”이 모호성을 더 충실히 보존합니다.
  - severity: low
    issue: “믿지 못하겠거든”
    rationale: ‘믿지 못하다’는 능력이나 사정 때문에 믿을 수 없다는 의미를 띨 수 있습니다. 원문의 ‘if you do not believe’에는 “믿지 않는다면”이 더 직접적으로 대응합니다.
  - severity: low
    issue: 단편 의문의 한국어 연결
    rationale: 원문의 짧고 돌출된 의문 형식은 보존할 수 있으나, “십자가에 못 박히신 그분을 찾는 것이 아닙니까?”로 하면 앞 질문과의 문법적 연결이 분명해지면서도 의문형의 기능을 유지합니다.
