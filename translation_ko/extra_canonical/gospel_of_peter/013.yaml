id: GPET.013
reference: Gospel of Peter — Encounter at the Tomb
language:
  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: '(55) And having gone, they found the tomb had been opened. And having approached, they bent down and saw there a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) "Why did you come? Whom do you seek? Not that one who was crucified? He arose and went away. But if you don''t believe, bend down and see where he was lying, that he''s not there, because he arose and went to where he came from."


    (57) Then the women were afraid, and fled.'
  text_scope: public_domain_english_witness
  manuscript: Akhmim Codex, P.Cair. 10759
  ancient_language: Greek (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.gospels.net/peter
  witness_translator: Mark M. Mattison
  witness_license: Public domain witness
  english_witness: '(55) And having gone, they found the tomb had been opened. And having approached, they bent down and saw there a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) "Why did you come? Whom do you seek? Not that one who was crucified? He arose and went away. But if you don''t believe, bend down and see where he was lying, that he''s not there, because he arose and went to where he came from."


    (57) Then the women were afraid, and fled.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/013.yaml
  text: '(55) They went and found that the tomb had been opened. When they came near, they bent down and saw a certain young man sitting in the middle of the tomb. He was beautiful, having clothed himself with a long, shining robe. He said to them, (56) “Why did you come? Whom are you looking for? Not that one who was crucified? He arose and went away. But if you do not believe, bend down and see where he was lying, that he is not there, because he arose and went to where he came from.”


    (57) Then the women were afraid and fled.'
translation:
  language: ko
  text: '(55) 여자들은 가서 무덤이 열려 있는 것을 발견했습니다. 가까이 다가가 몸을 굽혀 들여다보니, 무덤 한가운데에 어떤 젊은이가 앉아 있었습니다. 그는 모습이 아름다웠고, 빛나는 긴 옷을 입고 있었습니다. 그가 여자들에게 말했습니다. (56) “왜 왔습니까? 누구를 찾습니까? 십자가에 못 박히신 그분이 아닙니까? 그분은 일어나 떠나셨습니다. 믿지 못하겠거든 몸을 굽혀 그분이 누워 계시던 곳을 보십시오. 그분은 여기에 계시지 않습니다. 일어나셔서 본래 오신 곳으로 가셨기 때문입니다.”[a]


    (57) 그러자 여자들은 두려워서 달아났습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 아크밈 코덱스의 그리스어 본문에 대한 직접 검토는 아직 이루어지지 않았습니다.
    reason: 제공 자료가 고대어 본문의 직접 전사가 아니라 영어 번역 증언이므로, 독자에게 번역의 증거 기반과 잠정성을 명시합니다.
lexical_decisions:
- source_word: tomb
  choice: 무덤
  rationale: 일반 독자가 자연스럽게 이해할 수 있는 표준어이며, 문맥상 매장 장소를 분명히 나타냅니다.
- source_word: a certain young man
  choice: 어떤 젊은이
  rationale: 인물의 정체를 단정하지 않고 원문의 비특정성을 보존합니다.
- source_word: beautiful
  choice: 모습이 아름다웠고
  rationale: 인물의 외양에 관한 묘사임을 자연스러운 한국어로 드러내되, 천사라는 해석을 덧붙이지 않습니다.
- source_word: long, shining robe
  choice: 빛나는 긴 옷
  rationale: 옷의 길이와 광채라는 두 묘사를 간결하게 보존합니다.
- source_word: arose
  choice: 일어나셨습니다
  rationale: ‘부활하셨습니다’라고 신학적으로 명시하기보다 ‘일어나다’라는 표현을 유지하여 제시된 증거의 어휘적 폭을 보존합니다.
- source_word: went to where he came from
  choice: 본래 오신 곳으로 가셨기
  rationale: 출발지의 정체를 하늘 등으로 특정하지 않고, 오신 곳으로 돌아갔다는 진술의 여지를 그대로 둡니다.
- source_word: fled
  choice: 달아났습니다
  rationale: 두려움에 따른 급한 이탈을 자연스럽고 분명하게 전달합니다.
theological_decisions:
- issue: 무덤 안의 젊은이의 정체
  choice: ‘어떤 젊은이’로 번역
  alternative: ‘천사’ 또는 ‘천사 같은 젊은이’
  rationale: 본문 자체가 제시하는 인물 묘사만 옮기고, 그의 정체를 해석으로 확정하지 않았습니다.
- issue: ‘arose’의 부활 의미
  choice: ‘일어나셨습니다’로 번역
  alternative: ‘부활하셨습니다’
  rationale: 문맥상 부활을 가리키지만, 제시된 번역 증거가 사용하는 동사의 형태를 살려 신학적 함의를 과도하게 명시하지 않았습니다.
- issue: ‘where he came from’의 장소
  choice: ‘본래 오신 곳’으로 번역
  alternative: ‘하늘’ 또는 ‘아버지께서 계신 곳’
  rationale: 본문이 목적지를 명명하지 않으므로 그 모호성을 보존했습니다.
- issue: ‘Not that one who was crucified?’의 단편적 의문문
  choice: ‘십자가에 못 박히신 그분이 아닙니까?’
  alternative: ‘십자가에 못 박히신 그분을 찾습니까?’
  rationale: 다소 돌출된 원문의 의문 구조를 유지하면서도 한국어로 이해 가능하게 옮겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 명료하고 장중하게 유지하되 고어체는 피했습니다. 예수를 가리키는 대명사와 동사에는 문맥에 맞는 높임을 적용했으며, 젊은이의 정체나 예수께서 가신 장소를 본문 이상으로 특정하지 않았습니다.
