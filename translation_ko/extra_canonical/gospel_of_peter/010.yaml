  naturalness: 합쇼체 서술은 전반적으로 자연스럽습니다. 그러나 ‘여러 하늘로부터 들려오는 음성을 들었습니다’는 지각 동사와 진행 관형어의 결합이 다소 중복되고 부자연스럽습니다. ‘여러 하늘에서 들려온 음성’을 쓰면 과거 사건 서술에 더 자연스럽습니다.
  terminology: ‘백부장’, ‘장로들’, ‘무덤’, ‘십자가’, ‘잠든 이들’, ‘선포하다’는 적절합니다. ‘하늘’/복수 ‘heavens’의 대조와 십자가가 응답하는 비범한 묘사도 보존했습니다.
