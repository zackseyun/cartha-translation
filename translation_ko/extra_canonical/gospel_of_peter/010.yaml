base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/010.yaml
  text: '(38) When the soldiers saw this, they woke the centurion and the elders, because they too were there keeping watch. (39) While the soldiers were explaining to them what they had seen, they again saw three men coming out of the tomb. Two of them were supporting the third, and a cross was following them. (40) The heads of the two reached as high as heaven, but the head of the one they were leading reached beyond the heavens.


    (41) They heard a voice from the heavens saying, “Have you proclaimed to those who sleep?”


    (42) A reply was heard from the cross: “Yes!”'
translation:
  language: ko
  text: '(38) 군인들은 이것을 보고 백부장과 장로들을 깨웠습니다. 그들도 그곳에서 함께 지키고 있었기 때문입니다. (39) 군인들이 자신들이 본 것을 그들에게 설명하고 있을 때, 그들은 다시 세 사람이 무덤에서 나오는 것을 보았습니다. 그 가운데 둘은 한 사람을 부축하고 있었고, 십자가 하나가 그들의 뒤를 따르고 있었습니다. (40) 두 사람의 머리는 하늘에 닿았으나, 그들이 이끌고 가는 사람의 머리는 여러 하늘 너머까지 닿았습니다.[a]


    (41) 그리고 그들은 여러 하늘로부터 들려오는 음성을 들었습니다. “잠든 이들에게 선포하였느냐?”[b]


    (42) 그러자 십자가에서 “그렇습니다!”라는 대답이 들려왔습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 ‘하늘’(단수)과 ‘여러 하늘’(복수)을 구별합니다. 이는 두 사람과 그들이 이끄는 사람의 크기를 대조하는 표현입니다.
    reason: 영어 증거 본문에 보존된 단수와 복수의 차이를 독자에게 알리기 위해서입니다.
  - marker: b
    text: ‘잠든 이들’은 죽은 이들을 가리키는 표현일 수 있습니다. 그러나 본문은 그 대상을 직접 ‘죽은 이들’이라고 부르지 않습니다.
    reason: 본문의 완곡한 표현과 해석상의 여지를 보존하기 위해서입니다.
lexical_decisions:
- source_word: centurion
  choice: 백부장
  rationale: 로마 군대의 계급을 나타내는 익숙하고 정확한 성서 용어입니다.
- source_word: supporting
  choice: 부축하고
  rationale: 두 인물이 가운데 인물의 이동을 돕는 장면을 자연스럽게 나타내되, 그가 약했는지 또는 운반되었는지는 단정하지 않습니다.
- source_word: cross
  choice: 십자가
  rationale: 본문이 십자가를 스스로 뒤따르고 응답하는 존재처럼 묘사하는 특이성을 그대로 보존합니다.
- source_word: those who sleep
  choice: 잠든 이들
  rationale: 죽은 이들을 가리킬 가능성이 있으나, 본문의 완곡하고 신학적으로 함축적인 표현을 직접 풀어 쓰지 않고 보존합니다.
- source_word: proclaimed
  choice: 선포하였느냐
  rationale: 선포의 내용과 대상에 대한 신학적 해석을 덧붙이지 않으면서 공적인 전달 행위를 나타냅니다.
theological_decisions:
- issue: ‘하늘’과 ‘여러 하늘’의 구별
  choice: 40절의 단수 heaven은 ‘하늘’, 복수 heavens와 41절의 heavens는 ‘여러 하늘’로 옮겼습니다.
  alternative: 모두 ‘하늘’로 통일할 수 있습니다.
  rationale: 제공된 증거가 강조하는 단수와 복수의 대조를 보존하며, 우주론적 의미를 별도로 확정하지 않습니다.
- issue: 잠든 이들의 정체
  choice: ‘잠든 이들’로 직역에 가깝게 유지했습니다.
  alternative: ‘죽은 이들’로 명시할 수 있습니다.
  rationale: 죽은 자들에게 한 선포라는 해석 가능성은 크지만, 본문 자체의 은유와 신학적 긴장을 그대로 남깁니다.
- issue: 십자가의 응답
  choice: 십자가에서 대답이 들렸다고 그대로 표현했습니다.
  alternative: 십자가를 든 존재나 십자가 곁의 누군가가 응답했다고 해석할 수 있습니다.
  rationale: 본문의 기이하고 의인화된 묘사를 해소하거나 합리화하지 않습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 사건 서술은 명료하게 다듬되, 환상적 묘사와 신학적 모호성은 설명으로 해소하지 않았습니다. 현재 초안은 제공된 공용 영어 번역 증거에 근거한 잠정 번역이며, 그리스어 원문 직접 검토가 필요합니다.
