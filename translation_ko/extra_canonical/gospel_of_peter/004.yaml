base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/004.yaml
  text: '(10) They brought two wrongdoers and crucified the Lord between them, but he remained silent, as though he felt no pain. (11) When they raised the cross, they wrote, "This is the king of Israel." (12) They laid his clothes in front of him, divided them, and cast lots for them.


    (13) But one of those wrongdoers rebuked them, saying, "We are suffering like this because of the wrong we did, but this one, who became the Savior of humanity—what wrong has he done to you?"


    (14) They became angry with him. They commanded that the legs not be broken, so that he might die under torture.'
translation:
  language: ko
  text: '(10) 그들은 죄인 두 사람을 끌고 와서 그들 사이에 주님을 십자가에 못 박았습니다. 그러나 주님께서는 마치 아무 고통도 느끼지 않으시는 듯 잠잠하셨습니다. (11) 그들은 십자가를 세운 뒤, “이 사람은 이스라엘의 왕이다”라고 써 붙였습니다. (12) 그리고 주님의 옷을 그분 앞에 놓고 서로 나눈 다음, 그것을 두고 제비를 뽑았습니다.


    (13) 그러나 그 죄인들 가운데 하나가 그들을 꾸짖으며 말했습니다. “우리는 잘못을 저질렀기 때문에 이런 고통을 당하지만, 인류의 구원자가 되신 이분이 당신들에게 무슨 잘못을 저질렀습니까?”


    (14) 그러자 그들은 그에게 화를 냈습니다. 그들은 그가 고통을 겪으며 죽도록 다리를 꺾지 말라고 명령했습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가’가 누구를 가리키는지는 분명하지 않습니다. 가까운 문맥에서는 예수를 변호한 죄인을 가리킬 수 있지만, 주님을 가리키는 것으로 이해할 여지도 있습니다.
    reason: 다리를 꺾지 않을 대상에 관한 지시어의 진정한 모호성을 보존하기 위해서입니다.
lexical_decisions:
- source_word: wrongdoers
  choice: 죄인
  rationale: 범죄나 악행을 저지른 사람을 뜻하는 문맥을 자연스럽고 간결하게 전달합니다. 특정 법률상 죄목으로 범위를 좁히지 않습니다.
- source_word: the Lord
  choice: 주님
  rationale: 작품이 예수를 가리키는 존칭으로 사용하는 표현을 한국어의 전통적이고 자연스러운 호칭으로 옮겼습니다.
- source_word: Savior of humanity
  choice: 인류의 구원자
  rationale: 구원의 대상을 성별에 한정하지 않고 모든 인간으로 명확히 나타내며, 원문의 칭호적 성격을 보존합니다.
- source_word: silent
  choice: 잠잠하셨습니다
  rationale: 단순히 말을 하지 않았다는 뜻과 고통 앞에서 반응을 드러내지 않았다는 문맥을 함께 살리는 존대 표현입니다.
- source_word: die tortured
  choice: 고통을 겪으며 죽다
  rationale: 죽음에 이르는 고통의 지속을 자연스럽게 표현하되, 원문보다 구체적인 고문 방식을 덧붙이지 않습니다.
theological_decisions:
- issue: ‘인류의 구원자가 되신’이라는 표현의 상태·과정성
  choice: 인류의 구원자가 되신
  alternative: 인류의 구원자이신
  rationale: 제공된 증거의 ‘having become Savior’를 따라 ‘되신’의 과정적 표현을 보존하여, 이를 단순한 정적 칭호로 바꾸지 않았습니다.
- issue: 다리를 꺾지 말라는 명령의 대상
  choice: 본문에서는 ‘그가’로 옮기고 각주로 지시 대상의 불확실성을 밝혔습니다.
  alternative: 회개한 죄인의 다리를 꺾지 말라고 명령했습니다.
  rationale: 문맥상 앞 절에서 말한 죄인을 가리킬 가능성이 크지만, 제공된 문장만으로는 지시 대상을 단정하기 어려우므로 해석을 고정하지 않았습니다.
- issue: 주님의 무통성처럼 들릴 수 있는 표현
  choice: 마치 아무 고통도 느끼지 않으시는 듯
  alternative: 아무 고통도 느끼지 않으셨습니다.
  rationale: ‘마치 … 듯’이라는 비교 표현을 보존하여 실제로 고통이 없었다고 단정하지 않고, 서술된 외적 모습에 초점을 두었습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 고대 수난 서사의 장중함을 유지하되, 지나치게 고풍스럽거나 교파적인 어휘는 피했습니다. 현재 제공 자료가 영어 공개 번역 증거이며 그리스어 직접 검토가 보류 중이므로, 어순이나 세부 뉘앙스를 과도하게 확정하지 않았습니다.
