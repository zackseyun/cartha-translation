  code: ko
  name: Korean
  native_name: 한국어
  variant: Standard Korean; modern formal-polite 합쇼체
source:
  text: (1) But of the Jews no one washed the hands, neither Herod nor one of his judges, and when they didn't want to wash Pilate stood up. (2) And then Herod the king, commanding the Lord to be brought, said to them, "Do whatever I commanded you to do to him."
