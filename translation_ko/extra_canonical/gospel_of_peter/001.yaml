base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/001.yaml
  text: (1) But none of the Jews washed their hands, neither Herod nor any of his judges. When they did not want to wash, Pilate stood up. (2) Then Herod the king ordered the Lord to be brought before him and said to them, “Do whatever I commanded you to do to him.”
translation:
  language: ko
  text: (1) 그러나 유대인들 가운데서는 아무도 손을 씻지 않았습니다. 헤롯도 그의 재판관들 가운데 어느 누구도 씻지 않았습니다. 그들이 손 씻기를 원하지 않자, 빌라도는 일어섰습니다. (2) 그때 헤롯 왕은 주님을 데려오라고 명령하고 그들에게 말했습니다. “내가 그분에게 하라고 명령한 대로 행하십시오.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 아크밈 사본의 그리스어 원문에 대한 직접 검토가 아직 남아 있습니다.
    reason: 사용 가능한 자료가 원문 자체가 아니라 영어 번역 증언이며, 사용자 자료에도 원어 검토가 보류 중이라고 명시되어 있으므로 번역의 잠정성을 투명하게 밝혔습니다.
lexical_decisions:
- source_word: washed the hands
  choice: 손을 씻지 않았습니다
  rationale: 책임을 부인하는 의례적 행위를 가리키는 표현이지만, 현재 제공된 증거가 영어 번역 증언뿐이므로 해석을 본문에 덧붙이지 않고 구체적 행위를 그대로 옮겼습니다.
- source_word: judges
  choice: 재판관들
  rationale: 통치자 헤롯과 함께 판단에 관여한 이들을 뜻하는 일반적 사법 용어로 자연스럽게 옮겼습니다.
- source_word: stood up
  choice: 일어섰습니다
  rationale: 자리에서 일어난 행위인지 그 자리를 떠났다는 뜻인지 현재 증거만으로 확정하지 않고, 영어 증언의 표면적 의미를 보존했습니다.
- source_word: the Lord
  choice: 주님
  rationale: 서술자가 예수를 가리켜 사용하는 존칭을 그대로 보존했습니다.
- source_word: brought
  choice: 데려오라고
  rationale: 목적지나 ‘자기 앞’이라는 요소가 영어 원문 증언에는 명시되지 않으므로 이를 본문에 추가하지 않았습니다.
theological_decisions:
- issue: 손 씻기의 주체와 책임 묘사
  choice: 유대인들 가운데 아무도 손을 씻지 않았으며 헤롯과 그의 재판관들도 그러지 않았다고 직역에 가깝게 제시했습니다.
  alternative: 집단 전체가 예수의 죽음에 책임이 있다고 해설적으로 확대할 수 있습니다.
  rationale: 본문의 논쟁적 집단 표현은 보존하되, 그 범위나 신학적 책임을 번역자가 확대하지 않았습니다.
- issue: 헤롯의 마지막 명령이 가리키는 내용
  choice: “내가 그분에게 하라고 명령한 대로”로 모호성을 유지했습니다.
  alternative: 십자가형이나 특정 학대를 명시할 수 있습니다.
  rationale: 제공된 본문에는 명령의 구체적 내용이 나타나지 않으므로 문맥 밖의 내용을 보충하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체를 사용했습니다. 외경적 고대 서사의 품위를 유지하면서도 짧고 명료하게 읽히도록 했으며, 제공된 영어 증언이 반복하는 부정 표현과 지시 대상의 모호성을 가능한 한 보존했습니다.
