    (51) Taking her friends with her, she went to the grave where he was laid. (52) And they were afraid lest the Jews might see them, and were saying, "If on the day he was crucified we weren''t able to weep and mourn, even now we might do this on his grave. (53) But who will roll away for us the stone that has been placed at the door of the grave so that we might go in, sit by him, and do our duties? (54) Because the stone is great, and we''re afraid lest someone sees us. And if we aren''t able, at least let''s place at the door what we''re bringing in memory of him, and we''ll weep and mourn until we return to our house."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/012.yaml
  text: '(50) At dawn on the Lord’s day, Mary Magdalene, a disciple of the Lord, had not done at the Lord’s grave what women customarily do for their loved ones who have died, because she was afraid of the Jews, since they were inflamed with anger.


    (51) Taking her friends with her, she went to the grave where he had been laid. (52) They were afraid that the Jews might see them, and they said, “If we were not able to weep and mourn on the day he was crucified, perhaps even now we might do this at his grave. (53) But who will roll away for us the stone placed at the entrance to the grave, so that we may go in, sit beside him, and perform our duties? (54) For the stone is large, and we are afraid that someone may see us. And if we are not able, let us at least place at the entrance what we are bringing in memory of him, and we will weep and mourn until we return to our house.”'
translation:
  language: ko
  text: '(50) 주님의 날 새벽에, 주님의 제자인 막달라 마리아는 유대인들이 격분해 있었기 때문에 그들을 두려워하여, 사랑하는 이가 죽었을 때 여자들이 으레 하는 일을 주님의 무덤에서 하지 못했습니다.[a]


    (51) 마리아는 친구들을 데리고 그분이 안치된 무덤으로 갔습니다. (52) 그들은 유대인들에게 들킬까 두려워하며 이렇게 말했습니다. “그분이 십자가에 못 박히신 날에는 우리가 울며 애도하지 못했지만, 이제라도 그분의 무덤에서 그렇게 할 수 있을 것입니다. (53) 그러나 우리가 안으로 들어가 그분 곁에 앉아 마땅히 할 일을 하도록, 무덤 입구에 놓인 돌을 누가 우리를 위해 굴려 줄까요? (54) 돌은 크고, 우리는 누군가에게 들킬까 두렵습니다. 들어갈 수 없다면, 적어도 그분을 기억하여 가져온 것들을 입구에 놓고, 집으로 돌아갈 때까지 울며 애도합시다.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 번역은 제공된 공개 영역 영어 번역 증언을 바탕으로 한 잠정 번역입니다. 현존 그리스어 사본에 대한 직접 대조가 필요합니다.
    reason: 고대어 원문 검토가 아직 이루어지지 않았다는 자료상의 한계를 독자에게 명시하기 위해서입니다.
lexical_decisions:
- source_word: Lord’s day
  choice: 주님의 날
  rationale: 초기 그리스도교의 특정한 날을 가리키는 표현을 ‘주일’로 교파화하지 않고 원문의 형태와 역사적 뉘앙스를 보존했습니다.
- source_word: grave
  choice: 무덤
  rationale: 본문 전체에서 장소를 일관되게 나타내는 자연스러운 현대 한국어입니다.
- source_word: friends
  choice: 친구들
  rationale: 동행한 이들의 관계나 성별을 본문 이상으로 특정하지 않았습니다.
- source_word: do our duties
  choice: 마땅히 할 일
  rationale: 구체적인 장례 행위를 본문이 열거하지 않으므로 모호성을 유지하면서 문맥상 의무를 자연스럽게 표현했습니다.
- source_word: in memory of him
  choice: 그분을 기억하여
  rationale: 가져온 물품이 추모를 위한 것이라는 의미를 자연스럽게 전달하되 그 종류는 추정하지 않았습니다.
theological_decisions:
- issue: ‘주님의 날’의 정체
  choice: 주님의 날
  alternative: 주일/일요일
  rationale: 후대의 전례 용어나 현대 요일 명칭으로 단정하지 않고 원문의 역사적 표현을 보존했습니다.
- issue: 마리아가 관습적 행위를 하지 못한 이유와 시점
  choice: 두려움 때문에 주님의 무덤에서 하지 못했다는 구조를 유지
  alternative: 무덤 방문 자체를 하지 못했다고 의역
  rationale: 본문은 방문 여부보다 죽은 이를 위해 여자들이 행하는 관습을 수행하지 못한 데 초점을 두므로 이를 구별했습니다.
- issue: 여인들이 하려던 행위의 성격
  choice: 마땅히 할 일
  alternative: 시신에 향품을 바르다/장례 의식을 행하다
  rationale: 본문이 특정 행위를 명시하지 않으므로 정경 복음서의 세부 내용을 끌어오지 않았습니다.
- issue: ‘유대인들’에 대한 서술
  choice: 본문의 집단 명칭을 유지하되 당시 서사 속 인물 집단으로 번역
  alternative: 유대 지도자들
  rationale: 근거 없이 범위를 축소하지 않았습니다. 동시에 이 표현을 모든 시대의 유대인에게 일반화하는 해석도 본문에 덧붙이지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 서술은 ‘했습니다’, 인용된 대화는 공손하면서도 자연스러운 ‘-까요/-합시다’ 형식으로 옮겼습니다. 인물들이 예수를 지칭할 때는 존대를 반영해 ‘그분’을 사용했습니다.
