  terminology: '''주님의 날'', ''막달라 마리아'', ''무덤'', ''마땅히 할 일''은 일관되고 적절합니다. ''유대인들''은 제공된 증언의 집단 명칭을 유지하며, 번역 자체에 시대나 범위를 일반화하는 해석을 덧붙이지 않았습니다. ''그분을 기억하여 가져온 것들''도 물품의 종류를 추정하지 않아 적절합니다.'
