review_pass:
  verdict: revise
  source_fidelity: 21절의 못을 손에서 뽑아 땅에 둔 일, 땅의 진동과 큰 두려움, 22절의 제구 시, 23절의 장사를 위한 시신 인도, 24절의 씻김·아마포·요셉의 무덤이라는 사건 순서는 영어 증언 및 알려진 그리스어 문맥과 충실히 맞습니다. 23절의 두 단수 대명사는 지시 대상이 문맥상 추정되더라도 본문 형태만으로 기계적으로 확정하지 않는 편이 안전합니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체이며 장례 서술의 격식도 적절합니다. 다만 “이는 그가 그가 행한 모든 선한 일을 보았기 때문”은 같은 위치의 ‘그가’가 연속되어 현대 한국어에서 비문에 가깝고 독해가 지나치게 막힙니다. 어순을 바꾸어 같은 모호성을 더 자연스럽게 보존할 수 있습니다.
  terminology: ‘주님’, ‘시신’, ‘장사하다’, ‘아마포’, ‘동산’은 문맥과 격식에 알맞습니다. ‘제구 시’는 원문의 시간 표현을 보존하는 적절한 선택이며, 환산 각주도 유익합니다. ‘요셉의 동산’은 명칭으로 처리한 방식이 적절합니다.
  issues:
  - severity: medium
    issue: 23절의 연속된 ‘그가’ 표현
    rationale: 원문의 대명사 지시상 불확실성을 보존하려는 의도는 타당하지만, “그가 그가 행한”은 자연스러운 현대 한국어 문장이 아닙니다. ‘그가 행한 … 일을 그가 보았기’로 어순을 조정하면 두 대명사의 지시 대상은 확정하지 않으면서 문장성을 확보합니다.
