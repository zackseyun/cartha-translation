    (22) Then the sun shone and it was found to be the ninth hour. (23) And the Jews rejoiced, and gave Joseph his body to bury, since he had seen all the good he had done. (24) And having taken the Lord, he washed him and wrapped him in linen, and brought him into his own tomb, which was known as "Joseph''s Garden."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/006.yaml
  text: '(21) Then they pulled the nails from the Lord’s hands and laid him on the ground. The whole earth shook, and great fear came.


    (22) Then the sun shone, and it was found to be the ninth hour. (23) The Jews rejoiced and gave Joseph his body to bury, since he had seen all the good he had done. (24) After taking the Lord, Joseph washed him, wrapped him in linen, and brought him into his own tomb, which was known as “Joseph’s Garden.”'
translation:
  language: ko
  text: '(21) 그러고 나서 그들은 주님의 손에서 못을 뽑아 그분을 땅에 내려놓았습니다. 그러자 온 땅이 흔들리고 큰 두려움이 닥쳤습니다.


    (22) 그때 해가 빛났고, 때는 제구 시로 밝혀졌습니다.[a] (23) 유대인들은 기뻐하며 요셉에게 그분의 시신을 내주어 장사하게 했습니다. 이는 그가 그가 행한 모든 선한 일을 보았기 때문이었습니다.[b] (24) 요셉은 주님을 모셔다가 씻기고 아마포로 감싼 뒤, ‘요셉의 동산’이라고 알려진 자기 무덤으로 모셨습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 제구 시는 당시의 일반적인 계산법으로 대략 오후 세 시입니다.
    reason: 고대 시간 표현을 보존하면서 현대 독자가 이해할 수 있도록 환산 정보를 제공합니다.
  - marker: b
    text: 이 문장의 두 ‘그’가 각각 누구를 가리키는지는 제공된 영어 증언에서 분명하지 않습니다. 그리스어 원문 검토가 필요합니다.
    reason: 중간 증언이 보존한 대명사상의 모호성을 알리고 번역이 이를 임의로 해소하지 않았음을 밝힙니다.
lexical_decisions:
- source_word: the Lord
  choice: 주님
  rationale: 본문이 사용하는 존칭과 신학적 무게를 유지하면서 현대 한국어에서 자연스럽고 품위 있게 들리도록 했습니다.
- source_word: earth / ground
  choice: 땅 / 온 땅
  rationale: 첫 용례는 시신을 내려놓은 지면을, 둘째 용례는 진동의 광범위한 범위를 나타내므로 문맥에 따라 구별했습니다.
- source_word: the ninth hour
  choice: 제구 시
  rationale: 고대의 시간 계산법을 본문에 보존하고 현대 시각은 각주에서 설명했습니다.
- source_word: linen
  choice: 아마포
  rationale: 장례에 쓰인 천을 나타내는 전통적이면서도 이해 가능한 한국어 표현입니다.
- source_word: Joseph’s Garden
  choice: ‘요셉의 동산’
  rationale: 고유한 명칭으로 알려졌다는 본문의 설명을 살려 따옴표로 표시했습니다.
theological_decisions:
- issue: 23절의 대명사 지시 대상
  choice: “그가 그가 행한 모든 선한 일을 보았기 때문”으로 지시 대상의 모호성을 보존했습니다.
  alternative: “요셉이 주님께서 행하신 모든 선한 일을 보았기 때문”이라고 명시할 수 있습니다.
  rationale: 제공된 영어 증언 자체가 두 대명사의 지시 관계를 명확히 확정하지 않으며, 그리스어 원문 대조가 아직 이루어지지 않았으므로 해석을 본문에 미리 확정하지 않았습니다.
- issue: 시신을 씻긴 주체
  choice: 24절에서는 문맥상 요셉을 주어로 밝혔습니다.
  alternative: “주님을 모셔다가 그분을 씻기고”처럼 주어를 생략할 수 있습니다.
  rationale: 앞 절에서 시신을 넘겨받아 장사하는 인물이 요셉이고 자기 무덤으로 모시는 행위가 이어지므로, 한국어의 자연스러운 흐름을 위해 주체를 명시했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 장례 장면에 맞는 품위 있는 어휘인 ‘시신’, ‘장사하다’, ‘모시다’를 사용하되 지나치게 교파적이거나 고어적인 표현은 피했습니다. 현 단계의 초안은 공개 영역 영어 증언에 근거한 잠정 번역이며, 아크밈 코덱스의 그리스어 본문에 대한 직접 검토가 필요합니다.
