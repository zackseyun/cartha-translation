review_pass:
  verdict: revise
  source_fidelity: 초안은 전반적으로 제공된 영어 증거의 사건 순서와 폭력·조롱의 강도를 충실히 옮깁니다. 그러나 첫 문장의 ‘그들의’는 영어 증거에 없는 소유 관계를 보태며, (6)의 ‘이제’와 ‘마음대로’는 ‘having authority over him’의 잠정적이고 다소 불명확한 표현을 과도하게 의역합니다. 이를 제거하고 권세의 행사라는 최소 의미만 보존하는 편이 안전합니다.
  naturalness: 수정문은 현대 표준 한국어의 격식 있는 서사체와 합쇼체 직접화법을 유지합니다. ‘의롭게 재판하시오’는 ‘Judge justly’의 의미와 재판석 장면을 자연스럽게 연결하며, ‘이러한 존경으로 … 공경하자’는 의도적인 잔혹한 반어를 보존합니다.
  terminology: ‘무교절’, ‘주님’, ‘하나님의 아들’, ‘재판석’, ‘가시관’, ‘채찍질’은 적절합니다. ‘purple’은 색상만을 나타내는 ‘자주색 옷’으로, ‘piercing … with a reed’는 제공된 증거를 따라 ‘갈대로 찔렀습니다’로 유지했습니다.
  issues:
  - severity: medium
    issue: 첫 문장의 ‘그들의 무교절’
    rationale: 공급된 증거는 ‘their festival of the Unleavened Bread’라고 하지만, 한국어에서는 이를 곧바로 ‘그들의 무교절’로 하면 문맥상 특정 집단의 소유를 부자연스럽게 강조합니다. ‘무교절 축제의 첫날’로 옮겨 절기와 축제의 관계를 자연스럽게 나타냈습니다.
  - severity: medium
    issue: (6)의 ‘이제 우리가 그를 마음대로 할 수 있으니’
    rationale: ‘이제’와 ‘마음대로’는 영어 증거의 ‘having authority over him’에 명시되지 않은 시간적·자의적 뉘앙스를 추가합니다. 원어 직접 검토가 보류된 상태이므로 ‘그분에게 권세를 행사할 수 있으니’처럼 더 절제된 표현과 불확실성 각주가 적절합니다.
  - severity: low
    issue: (7)의 ‘공정하게 재판하시오’
    rationale: 가능한 번역이나, ‘justly’의 윤리적·법적 의미는 ‘의롭게’가 더 직접적으로 보존합니다.
  revised_text: '그는 무교절 축제의 첫날 전에 그분을 백성에게 넘겨주었습니다. (6) 주님을 붙잡은 자들은 달려가며 그분을 떠밀면서 말했습니다. “그분에게 권세를 행사할 수 있으니, 하나님의 아들을 끌고 가자!”[a]


    (7) 그들은 그분에게 자주색 옷을 입히고 그분을 재판석에 앉힌 뒤 말했습니다. “이스라엘의 왕이여, 의롭게 재판하시오!” (8) 그들 가운데 한 사람이 가시관을 가져와 주님의 머리에 씌웠습니다.


    (9) 곁에 있던 다른 자들은 그분의 얼굴에 침을 뱉었고, 또 다른 자들은 그분의 뺨을 때렸습니다. 다른 자들은 갈대로 그분을 찔렀고, 몇몇은 그분을 채찍질하며 말했습니다. “이러한 존경으로 하나님의 아들을 공경하자!”'
  revised_footnotes:
  - marker: a
    text: ‘그분에게 권세를 행사할 수 있으니’는 공급된 영어 증거의 “having authority over him”을 잠정적으로 옮긴 것입니다. 그리스어 본문을 직접 검토하기 전에는 이 분사구문의 정확한 문법적 관계와 뉘앙스를 확정할 수 없습니다.
    reason: 제공된 영어 증거 자체가 이 구문의 관계를 완전히 해소하지 못하며, 원어 직접 검토도 보류되어 있으므로 불확실성을 보존합니다.
  revision_rationale: 영어 증거에 없는 소유·시간·자의성의 함의를 제거하고, (6)의 논쟁적 분사구문은 최소한으로 번역하여 각주에 잠정성을 밝혔습니다. 조롱의 반어는 본문의 병렬적인 ‘존경/공경’ 표현으로 충분히 드러나므로 해설성 각주는 삭제했습니다. 나머지 사건 순서, 호칭, 폭행의 강도, 절 번호는 유지했습니다.
