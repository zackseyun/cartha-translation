translation:
  language: ko
  text: '그는 그들의 무교절 첫날이 되기 전에 그분을 백성에게 넘겨주었습니다. (6) 주님을 넘겨받은 자들은 달려가면서 그분을 떠밀며 말했습니다. “이제 우리가 그를 마음대로 할 수 있으니, 하나님의 아들을 끌고 가자!”[a]


    (7) 그들은 그분에게 자주색 옷을 입히고 재판석에 앉힌 뒤 말했습니다. “이스라엘의 왕이여, 공정하게 재판하시오!”[b] (8) 그들 가운데 한 사람이 가시관을 가져다가 주님의 머리에 씌웠습니다.


    (9) 곁에 서 있던 다른 자들은 그분의 얼굴에 침을 뱉었고, 또 다른 자들은 그분의 뺨을 때렸습니다. 다른 자들은 갈대로 그분을 찔렀고, 몇몇은 그분을 채찍질하며 말했습니다. “이런 영예로 하나님의 아들을 높여 드리자!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “우리가 그를 마음대로 할 수 있으니”에 해당하는 문구는, 공급된 영어 증거에서 직역하면 “그에게 권한을 가지고”입니다. 그리스어 원문 직접 검토가 남아 있으므로 문법적 관계는 잠정적입니다.
    reason: 권한의 주체와 분사구문의 관계에 있는 진정한 불확실성을 독자에게 알립니다.
  - marker: b
    text: 그들은 주님을 재판석에 앉혀 왕이자 재판관인 것처럼 조롱하고 있습니다.
    reason: 발화의 반어와 재판석 장면의 연결을 명확히 하되 본문 안에서 과도하게 해설하지 않습니다.
  - marker: c
    text: “영예”와 “높여 드리자”는 진정한 공경이 아니라 폭행을 공경인 양 부르는 조롱입니다.
    reason: 원문의 반어를 보존하면서 현대 독자가 발화 의도를 오해하지 않게 합니다.
lexical_decisions:
- source_word: festival of the Unleavened Bread
  choice: 무교절
  rationale: 한국어 성서 독자에게 익숙하면서도 유대 절기의 의미를 정확하고 간결하게 전달합니다.
- source_word: the Lord
  choice: 주님
  rationale: 인물에 대한 본문의 존칭과 초기 그리스도교 문헌의 호칭을 자연스러운 현대 한국어로 보존합니다.
- source_word: purple
  choice: 자주색 옷
  rationale: 왕권을 조롱하는 장면임을 드러내되, 원문 증거가 옷의 구체적 종류를 특정하지 않으므로 ‘옷’을 일반적으로 표현했습니다.
- source_word: seat of judgment
  choice: 재판석
  rationale: 심판 또는 재판이 행해지는 좌석이라는 제도적 의미와 뒤따르는 ‘재판하시오’의 언어유희를 살립니다.
- source_word: thorn crown
  choice: 가시관
  rationale: 현대 한국어 성서 문체에서 널리 이해되는 간결하고 품위 있는 표현입니다.
- source_word: piercing him with a reed
  choice: 갈대로 그분을 찔렀고
  rationale: 공급된 증거의 ‘piercing’을 약화해 ‘쳤다’로 바꾸지 않고 공격 행위의 강도를 보존했습니다.
- source_word: scourging
  choice: 채찍질하며
  rationale: 단순한 구타보다 형벌적이고 반복적인 폭행을 나타내는 표현입니다.
theological_decisions:
- issue: ‘having authority over him’의 주체와 뉘앙스
  choice: “이제 우리가 그를 마음대로 할 수 있으니”
  alternative: “그에게 권세를 행사하면서” 또는 “그를 지배할 권한이 있으니”
  rationale: 문구가 가해자들이 예수를 자기 처분 아래 두었다고 주장하는 뜻으로 읽히도록 자연스럽게 옮겼으나, 그 권위가 합법적이라는 신학적 판단은 덧붙이지 않았습니다. 직접 그리스어 검토 전의 잠정 번역임을 각주에 밝혔습니다.
- issue: 예수를 재판석에 앉힌 행위의 의미
  choice: 문면 그대로 “재판석에 앉힌”으로 번역
  alternative: “재판석 앞에 앉힌”
  rationale: 공급된 증거는 예수가 재판하는 자의 자리에 앉혀진 조롱 장면을 나타냅니다. 정경 복음서와 조화시키려고 위치를 바꾸지 않았습니다.
- issue: ‘Judge justly’의 명령 대상
  choice: 예수에게 직접 “공정하게 재판하시오”라고 조롱하는 말로 번역
  alternative: “의롭게 심판하소서”
  rationale: 재판석과 왕 칭호의 문맥을 살리면서, 경건한 청원이 아니라 조롱임을 현대 한국어 높임 명령형으로 나타냈습니다.
- issue: ‘honor’의 반어적 성격
  choice: “이런 영예로 … 높여 드리자”
  alternative: “이러한 존경으로 … 공경하자”
  rationale: 폭행을 영예라고 부르는 잔혹한 반어를 보존하고, 이를 실제 예배나 진정한 공경으로 오해하지 않도록 각주로 설명했습니다.
translation_notes:
  register: 현대 표준 한국어 합쇼체의 품위 있는 서사 문체를 사용했습니다. 가해자들의 직접화법은 조롱의 거칠음과 반어를 살리되 지나치게 고어적인 종결형은 피했습니다. 절 번호 (6)–(9)는 제공된 증거대로 유지했습니다. 현 단계의 고대어 자료는 그리스어 본문 자체가 아니라 공공 영역 영어 번역 증거이며, 직접 원어 검토가 보류 중이므로 특히 (6)의 분사구문은 잠정적으로 처리했습니다.
