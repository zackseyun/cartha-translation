  source_fidelity: 전반적으로 제공된 영어 증거 본문을 충실히 따르며, ‘안식일’과 ‘주님의 날’을 구별하고 두 인물의 정체를 보충하지 않은 점이 적절합니다. 다만 37절의 ‘무덤이 열리자’는 원문의 단순 접속(‘무덤이 열렸고, 두 젊은이가 들어갔다’)을 시간·조건 관계로 바꾸므로 수정이 안전합니다. 36절의 ‘찬란한 빛에 휩싸인’은 ‘having much radiance’가 말하는 광채의 소유를 외부에서 빛에 둘러싸인 모습으로 다소 구체화하므로 더 중립적으로 조정했습니다.
  naturalness: 합쇼체가 일관되고 자연스럽습니다. ‘하늘들이 열리는 것을’ 및 ‘큰 광채를 지닌’은 현대 한국어에서 이해 가능하면서도 공급된 증거 본문의 표현을 더 직접적으로 보존합니다.
  terminology: ‘안식일’, ‘주님의 날’, ‘무덤’, ‘두 사람’ 및 ‘두 젊은이’를 유지했습니다. ‘주님의 날’을 특정 요일이나 교회 전통의 명칭으로 해석하지 않았으며, 두 사람을 천사로 명시하지 않았습니다.
