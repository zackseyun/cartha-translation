base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/009.yaml
  text: (34) When the morning of the Sabbath dawned, a crowd from Jerusalem and the surrounding countryside went to see the grave that had been sealed. (35) But during the night, before the Lord’s Day dawned, while the soldiers kept watch two by two as guards, there was a great voice in heaven. (36) They saw the heavens open, and two men descended from there, shining with great radiance, and approached the tomb. (37) The stone that had been placed at the entrance rolled away by itself and moved partly aside. The tomb was opened, and both young men went in.
translation:
  language: ko
  text: '(34) 안식일 아침이 밝아 올 무렵, 예루살렘과 그 주변 지역에서 온 무리가 봉인된 무덤을 보려고 갔습니다. (35) 그런데 주님의 날이 밝기 전 밤중에, 군인들이 둘씩 짝을 지어 경비를 서고 있을 때, 하늘에서 큰 음성이 들렸습니다. (36) 그들은 하늘들이 열리고, 찬란한 빛에 휩싸인 두 사람이 그곳에서 내려와 무덤으로 다가가는 것을 보았습니다. (37) 문 어귀에 놓여 있던 돌이 저절로 굴러 일부 비켜섰고[a], 무덤이 열리자 두 젊은이가 모두 안으로 들어갔습니다.


    [a] 이 표현은 돌이 완전히 치워진 것이 아니라 일부만 비켜선 것으로도 이해될 수 있습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 표현은 돌이 완전히 치워진 것이 아니라 일부만 비켜선 것으로도 이해될 수 있습니다.
    reason: 공급된 영어 증거 본문의 다소 불분명한 ‘made way in part’를 과도하게 확정하지 않고 부분적 이동이라는 뉘앙스를 알립니다.
lexical_decisions:
- source_word: Sabbath
  choice: 안식일
  rationale: 유대교의 특정한 날을 가리키는 전통적이고 널리 이해되는 명칭을 사용했으며, 이어지는 ‘주님의 날’과의 구별도 보존했습니다.
- source_word: the Lord's day
  choice: 주님의 날
  rationale: 본문의 고유한 시간 표현을 교회 전통의 특정 해석으로 풀어 쓰지 않고 직역에 가깝게 보존했습니다.
- source_word: the heavens
  choice: 하늘들
  rationale: 공급된 증거 본문의 복수 표현을 보존하여 단수 ‘하늘’로 평준화하지 않았습니다.
- source_word: having much radiance
  choice: 찬란한 빛에 휩싸인
  rationale: 두 사람에게서 강한 광채가 드러난다는 의미를 자연스러운 현대 한국어로 전달했습니다.
- source_word: made way in part
  choice: 일부 비켜섰고
  rationale: 의미가 다소 불분명한 증거 본문의 표현을 완전히 치워졌다고 단정하지 않고 부분성까지 보존했습니다.
- source_word: both the young men
  choice: 두 젊은이가 모두
  rationale: 앞 절의 ‘두 사람’이 여기서는 ‘젊은이들’로 불리는 본문의 표현 변화를 그대로 살렸습니다.
theological_decisions:
- issue: ‘안식일’과 ‘주님의 날’의 연속적 언급
  choice: 두 표현을 구별하여 그대로 유지했습니다.
  alternative: 두 표현을 모두 현대 요일명으로 바꾸어 시간 관계를 명확히 할 수 있습니다.
  rationale: 본문 자체의 시간적 긴장이나 고대 용례를 번역자가 임의로 해소하지 않기 위해 서로 다른 명칭을 보존했습니다.
- issue: 하늘에서 난 큰 음성의 주체
  choice: 주체를 밝히지 않고 ‘큰 음성이 들렸습니다’로 옮겼습니다.
  alternative: 하나님이나 천사의 음성으로 명시할 수 있습니다.
  rationale: 공급된 증거 본문은 음성의 주체를 특정하지 않으므로 신학적으로 보충하지 않았습니다.
- issue: 빛나는 두 사람의 정체
  choice: ‘두 사람’과 ‘두 젊은이’로만 표현했습니다.
  alternative: 천사들로 해석하여 번역할 수 있습니다.
  rationale: 본문이 이들을 명시적으로 천사라고 부르지 않으므로 그 정체의 여지를 남겼습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 장중하되 일반 독자가 쉽게 이해할 수 있도록 구성했습니다. 이 초안은 제공된 공공 영역 영어 증거 본문에 근거한 잠정 번역이며, 아크밈 사본의 그리스어 원문에 대한 직접 검토가 아직 남아 있습니다.
