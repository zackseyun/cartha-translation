review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증언에 따르면 (28)의 grumbling은 ‘탄식’으로 한정하기보다 불평·웅성거림의 여지를 지닌 표현으로 옮기는 편이 충실합니다. 직접 그리스어 대조가 아직 보류된 상태이므로, (32)의 비정상적인 ‘백인대장과 군인들에게/에게 돌을 굴렸다’는 관계는 해석으로 평탄화하지 않고 보존해야 합니다. ‘죽은 사람들 가운데서 살아나다’, 일곱 봉인, 사흘간의 경비 요청은 잘 보존되어 있습니다.
  naturalness: 전체적으로 현대 표준 한국어의 격식 있는 합쇼체가 안정적입니다. 다만 ‘탄식하며’는 원문의 grumbling보다 의미를 좁히므로 ‘웅성거리며’로 고치는 것이 자연스럽고 의미 폭도 보존합니다. 인용문의 ‘보십시오’는 ‘그가 얼마나 의로운 사람이었는지 보십시오!’처럼 문장 끝에 두는 편이 한국어 어순상 더 자연스럽습니다.
  terminology: ‘율법학자들’, ‘바리새인들’, ‘장로들’, ‘백인대장’, ‘봉인’, ‘무덤’은 적절합니다. Πετρώνιος의 직접 그리스어 표기 대조가 보류되어 있으나, 영어 증언의 Petronius에 따른 ‘페트로니우스’는 현 단계에서 유지할 수 있습니다.
  issues:
  - severity: medium
    issue: (28)의 ‘grumbling’을 ‘탄식하며’로 번역함
    rationale: ‘탄식’은 애도와 비통의 뜻으로 의미를 제한합니다. 제공된 증언은 grumbling이라고 하므로, 가슴을 치는 행위와 병치되어 있더라도 불평·수군거림의 가능성을 남기는 ‘웅성거리며’가 더 안전합니다.
  - severity: low
    issue: (28) 인용문의 ‘보십시오’ 위치
    rationale: 의미 오류는 아니지만, 원문의 ‘see how ...’에 대응하는 한국어는 ‘그가 얼마나 의로운 사람이었는지 보십시오!’가 더 자연스럽습니다.
  - severity: low
    issue: (32)의 난해한 돌 굴리기 구문의 주석 설명
    rationale: 본문은 난해한 구문을 보존하고 있으나, 주석은 ‘...에게 굴려 간’이라는 한국어 표현을 그대로 되풀이해 다소 불명확합니다. 영어 증언의 어순과 직접 그리스어 대조 보류 사실을 분명히 밝히면 독자가 의도적인 보존임을 더 잘 알 수 있습니다.
  revised_text: '(28) 율법학자들과 바리새인들과 장로들은 온 백성이 웅성거리며 가슴을 치고 “그가 죽을 때 이토록 큰 표징들이 일어났으니, 그가 얼마나 의로운 사람이었는지 보십시오!”라고 말하는 것을 듣고 한자리에 모였습니다.


    (29) 장로들은 두려워서 빌라도에게 가서 간청하며 말했습니다. (30) “저희에게 군인들을 내주셔서 사흘 동안 그의 무덤을 지키게 해 주십시오. 그러지 않으면 그의 제자들이 와서 그를 훔쳐 가고, 백성이 그가 죽은 사람들 가운데서 살아났다고 생각하여 저희에게 해를 끼칠지도 모릅니다.”


    (31) 빌라도는 무덤을 지키도록 백인대장 페트로니우스와 군인들을 그들에게 내주었습니다. 장로들과 율법학자들도 그들과 함께 무덤으로 갔습니다. (32) 그곳에 있던 사람들은 모두 큰 돌을 백인대장과 군인들에게 굴려 간 뒤,[a] 그것을 무덤 입구에 놓았습니다. (33) 그들은 그 돌에 일곱 개의 봉인을 하고, 그곳에 천막을 친 뒤 지켰습니다.'
  revised_footnotes:
  - marker: a
    text: 공급된 영어 증언은 이 구절을 직역하면 “큰 돌을 백인대장과 군인들에게 굴려 간 뒤”라고 전합니다. 돌을 굴린 방향 또는 백인대장과 군인들의 역할을 분명히 하지 않는 이례적인 구문이므로, 직접적인 그리스어 원문 검토가 이루어지기 전에는 이를 ‘백인대장과 군인들이 큰 돌을 굴렸다’ 또는 ‘그들과 함께 돌을 굴렸다’로 확정하여 고쳐 읽지 않고 보존했습니다.
    reason: 난해한 전승 구문의 모호성을 보존하고, 직접 그리스어 대조 전에는 행위자나 관계를 추정으로 확정하지 않기 위해서입니다.
  revision_rationale: (28)의 핵심 동사만 ‘탄식하며’에서 ‘웅성거리며’로 조정하여 제공된 영어 증언의 의미 폭을 회복했습니다. 인용문의 어순을 자연스럽게 다듬었고, (32)의 난해한 표현은 본문에서 유지하되 주석이 보존의 이유와 한계를 더 명확히 설명하도록 수정했습니다. 나머지 용어와 서술은 증언의 내용 및 합쇼체 문체에 충실하므로 유지했습니다.
