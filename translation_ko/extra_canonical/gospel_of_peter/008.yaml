base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/008.yaml
  text: '(28) The scribes, the Pharisees, and the elders gathered together after hearing all the people grumbling, beating their chests, and saying, “If these greatest signs happened at his death, see how just he was!”


    (29) The elders were afraid and went to Pilate, begging him and saying, (30) “Give us soldiers so that we may guard his grave for three days. Otherwise, his disciples may come and steal him, and the people may think that he rose from the dead and do us wrong.”


    (31) Pilate gave them Petronius the centurion, along with soldiers to guard the tomb. Elders and scribes went with them to the grave. (32) After rolling a great stone to the centurion and the soldiers, everyone who was there placed it at the entrance of the grave. (33) They put seven seals on it, pitched a tent there, and kept watch.'
translation:
  language: ko
  text: '(28) 율법학자들과 바리새인들과 장로들은 온 백성이 탄식하며 가슴을 치고 “그가 죽을 때 이토록 큰 표징들이 일어났으니, 보십시오. 그가 얼마나 의로운 사람이었는지!”라고 말하는 것을 듣고 한자리에 모였습니다.


    (29) 장로들은 두려워서 빌라도에게 가서 간청하며 말했습니다. (30) “저희에게 군인들을 내주셔서 사흘 동안 그의 무덤을 지키게 해 주십시오. 그러지 않으면 그의 제자들이 와서 그를 훔쳐 가고, 백성이 그가 죽은 사람들 가운데서 살아났다고 생각하여 저희에게 해를 끼칠지도 모릅니다.”


    (31) 빌라도는 무덤을 지키도록 백인대장 페트로니우스와 군인들을 그들에게 내주었습니다. 장로들과 율법학자들도 그들과 함께 무덤으로 갔습니다. (32) 그곳에 있던 사람들은 모두 큰 돌을 백인대장과 군인들에게 굴려 간 뒤,[a] 그것을 무덤 입구에 놓았습니다. (33) 그들은 그 돌에 일곱 개의 봉인을 하고, 그곳에 천막을 친 뒤 지켰습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 공급된 영어 증언은 직역하면 “큰 돌을 백인대장과 군인들에게 굴려 간 뒤”라고 되어 있습니다. 문장이 이례적이지만, 직접적인 그리스어 원문 검토가 이루어지기 전에는 이를 ‘백인대장과 군인들이 큰 돌을 굴렸다’로 고쳐 읽지 않고 그대로 보존했습니다.
    reason: 전승 본문의 난해하거나 비정상적인 구문을 독자에게 알리고, 근거 없이 행위자를 바꾸지 않기 위해서입니다.
lexical_decisions:
- source_word: scribes
  choice: 율법학자들
  rationale: 당시 율법 문서의 필사와 해석을 맡았던 집단을 현대 독자가 이해하기 쉽게 나타냈습니다.
- source_word: grumbling
  choice: 탄식하며
  rationale: 문맥상 백성이 불평한다기보다 죽음과 표징을 보고 비통하게 반응하는 장면이므로, 이어지는 ‘가슴을 치고’와 자연스럽게 연결했습니다. 다만 공급된 영어 증언의 어휘가 지닌 불평·수군거림의 가능성은 직접 그리스어 검토 시 재확인이 필요합니다.
- source_word: just
  choice: 의로운 사람이었는지
  rationale: 도덕적 무죄와 올바름을 함께 내포하는 종교적 표현을 보존했습니다.
- source_word: rose from the dead
  choice: 죽은 사람들 가운데서 살아났다고
  rationale: 부활을 뜻하는 전통적 의미를 유지하면서 원문의 공간적 표현을 드러냈습니다.
- source_word: centurion
  choice: 백인대장
  rationale: 로마군의 지휘관 계급을 한국어 성서 문체에서 익숙하면서도 정확하게 나타냈습니다.
- source_word: grave / tomb
  choice: 무덤
  rationale: 본문에서 두 영어 표현이 같은 매장 장소를 가리키므로 일관된 자연스러운 한국어로 옮겼습니다.
- source_word: seven seals
  choice: 일곱 개의 봉인
  rationale: 봉인의 수와 공식적인 봉쇄 행위를 모두 분명히 보존했습니다.
theological_decisions:
- issue: 백성이 예수를 ‘의롭다’고 평가하는 말의 강도
  choice: “그가 얼마나 의로운 사람이었는지!”
  alternative: “그가 의로운 사람이었다는 것을 보십시오!”
  rationale: 감탄의 강도를 살리되, 이 말이 신학적 칭호인지 일반적인 무죄·의로움의 인정인지 본문이 확정하지 않는 여지를 남겼습니다.
- issue: ‘죽은 사람들 가운데서 살아났다’는 장로들의 우려
  choice: 그들의 발언과 우려로 그대로 제시
  alternative: 서술자가 부활을 직접 단언하는 문장으로 평탄화
  rationale: 이 대목은 장로들이 백성의 예상 반응을 말하는 인용문이므로, 서술자의 신학적 단언으로 바꾸지 않았습니다.
- issue: ‘저희에게 해를 끼치다’의 의미
  choice: 포괄적인 ‘해를 끼치다’
  alternative: ‘우리를 죽이다’ 또는 ‘우리를 고발하다’
  rationale: 공급된 증언의 ‘do us wrong’이 구체적인 위해의 종류를 밝히지 않으므로 모호성을 보존했습니다.
translation_notes:
  register: 현대 표준 한국어의 격식 있는 합쇼체를 사용했습니다. 서술은 장중하되 일반 독자가 이해할 수 있도록 구성했습니다. 현재 초안은 제공된 공공 영역 영어 증언에 근거한 잠정 번역이며, 아크밈 코덱스의 그리스어에 대한 직접 검토가 남아 있습니다.
