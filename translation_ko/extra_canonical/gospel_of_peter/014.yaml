review_pass:
  verdict: revise
  source_fidelity: 제공된 영어 증거 및 영어 POB와 대조할 때 절기 종료, 제자들의 애도와 귀가, 베드로·안드레의 바다행, 레위의 동행이라는 내용은 충실합니다. 다만 60절의 영어 ‘Levi ... whom the Lord . . .’는 레위를 목적어로 받는 미완의 관계절인데, 초안의 ‘그는 주님께서…’는 그 관계를 충분히 드러내지 못합니다.
  naturalness: 전반적으로 현대 표준 한국어 합쇼체로 자연스럽습니다. ‘무교절의 마지막 날이었습니다’와 ‘주님께서 그를…’는 각각 서술의 자연스러움과 미완 관계절의 문법적 방향을 더 분명히 합니다.
  terminology: ‘무교절’, ‘주님의 열두 제자’, ‘시몬 베드로’, ‘안드레’, ‘알패오’, ‘레위’는 적절합니다. ‘바다’는 제공된 증거가 특정 바다를 명시하지 않는다는 점을 보존합니다.
  issues:
  - severity: medium
    issue: 60절의 미완 관계절 처리
    rationale: 영어 증거의 ‘whom the Lord . . .’에서 Levi는 뒤따를 미완 절 안의 목적어입니다. ‘그는 주님께서…’보다 ‘주님께서 그를…’가 이 문법 관계와 사본의 미완성을 정확히 보존합니다.
  revised_text: (58) 무교절의 마지막 날이었습니다. 축제가 끝났기 때문에 많은 사람이 떠나 자기 집으로 돌아가고 있었습니다. (59) 그러나 주님의 열두 제자인 우리는 울며 슬퍼했고, 일어난 일 때문에 저마다 슬퍼하면서 집으로 돌아갔습니다. (60) 그러나 나 시몬 베드로와 내 형제 안드레는 그물을 챙겨 바다로 갔습니다. 알패오의 아들 레위도 우리와 함께 있었는데, 주님께서 그를…[a]
  revised_footnotes:
  - marker: a
    text: 현존 사본은 여기에서 끝나므로 문장이 완성되지 않습니다.
    reason: 말줄임표가 문체적 생략이 아니라 사본의 불완전한 끝을 표시한다는 점을 독자에게 알립니다.
  revision_rationale: 60절을 안전하게 수정하여 레위가 ‘주님께서’로 시작하는 미완 관계절의 목적어임을 나타냈습니다. 사본 결락 이후의 내용을 보충하거나 레위의 신원을 다른 문헌과 동일시하지 않았습니다. 나머지 표현은 제공된 영어 증거의 반복적 애도와 서술 순서를 자연스럽게 보존하므로 유지했습니다.
