  text: (58) Now it was the last day of Unleavened Bread, and many people were leaving and returning to their homes because the festival was over. (59) But we, the Lord’s twelve disciples, were weeping and grieving, and each of us returned home, grieving because of what had happened. (60) But I, Simon Peter, and my brother Andrew took our nets and went to the sea. Levi, the son of Alphaeus, was with us, whom the Lord . . .
translation:
  language: ko
  text: (58) 무교절 마지막 날이 되었습니다. 축제가 끝났으므로 많은 사람이 떠나 자기 집으로 돌아가고 있었습니다. (59) 그러나 주님의 열두 제자인 우리는 울며 슬퍼했고, 일어난 일 때문에 저마다 슬퍼하면서 집으로 돌아갔습니다. (60) 그러나 나 시몬 베드로와 내 형제 안드레는 그물을 챙겨 바다로 갔습니다. 알패오의 아들 레위도 우리와 함께 있었는데, 그는 주님께서…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 현존 사본은 여기에서 끝나므로 문장이 완성되지 않습니다.
    reason: 말줄임표가 문체적 생략이 아니라 사본의 불완전한 끝을 표시한다는 점을 독자에게 알립니다.
lexical_decisions:
- source_word: Unleavened Bread
  choice: 무교절
  rationale: 유대 절기의 관용적이고 널리 이해되는 한국어 명칭을 사용했습니다.
- source_word: the twelve disciples of the Lord
  choice: 주님의 열두 제자
  rationale: 소유 관계와 제자 집단의 수를 자연스럽고 정확하게 보존했습니다.
- source_word: sea
  choice: 바다
  rationale: 제공된 증거가 특정 지명을 명시하지 않으므로 ‘갈릴리 바다’ 등으로 구체화하지 않았습니다.
- source_word: having taken our nets
  choice: 그물을 챙겨
  rationale: 그물을 가지고 떠났다는 선행 동작을 자연스러운 현대 한국어로 나타냈습니다.
- source_word: Levi, the son of Alphaeus
  choice: 알패오의 아들 레위
  rationale: 인명과 부칭을 전통적인 한국어 성경 음역에 맞추되 본문이 말하는 범위를 넘어서 인물을 동일시하지 않았습니다.
theological_decisions:
- issue: ‘열두 제자’라는 표현과 이어지는 개별 인물들의 관계
  choice: 원문 증거의 표현을 그대로 유지
  alternative: 정경 복음서의 제자 명단과 조화시키거나 인물의 신원을 설명
  rationale: 본문 자체의 역사적·신학적 긴장을 다른 문헌에 근거해 해소하지 않았습니다.
- issue: 레위를 수식하는 미완 문장의 의미
  choice: ‘그는 주님께서…’로 미완 상태를 보존
  alternative: 주님이 부르신 사람 등으로 문장을 보충
  rationale: 사본의 결락 때문에 술어를 알 수 없으므로 추정하여 완성하지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 격조 있는 합쇼체를 사용했습니다. 반복되는 ‘울며 슬퍼했고’와 ‘슬퍼하면서’는 원문 증거의 강조를 보존했습니다. 고대 그리스어 직접 검토가 아직 이루어지지 않았으므로, 제공된 공개 영역 영어 번역 증거와 감사된 영어 POB를 토대로 한 잠정 번역입니다.
