base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_peter/011.yaml
  text: '(43) Then those men decided together to go and report these things to Pilate. (44) While they were still considering this, the heavens were again seen opening, and a certain man descended and entered the tomb. (45) When those with the centurion saw these things, they left the tomb they had been guarding and hurried by night to Pilate. They described everything they had seen, greatly distressed and saying, “Truly he was the Son of God!”


    (46) Pilate replied, “I am innocent of the blood of the Son of God, and this is clear to us.”


    (47) Then all who had come begged him and urged him to command the centurion and the soldiers to say nothing about what they had seen. (48) “It is better for us,” they said, “to be guilty of a great sin before God than to fall into the hands of the Jewish people and be stoned.” (49) So Pilate commanded the centurion and the soldiers to say nothing.'
translation:
  language: ko
  text: '(43) 그러자 그 사람들은 함께 가서 이 일들을 빌라도에게 보고하기로 뜻을 모았습니다. (44) 그들이 아직 이 일을 의논하고 있을 때, 다시 하늘이 열리는 것이 보였고, 어떤 사람이 내려와 무덤 안으로 들어갔습니다. (45) 백부장과 함께 있던 사람들은 이 일들을 보고, 지키고 있던 무덤을 떠나 밤중에 서둘러 빌라도에게 갔습니다. 그들은 몹시 괴로워하며 자신들이 본 모든 일을 설명하고 말했습니다. “참으로 그는 하나님의 아들이었습니다!”


    (46) 빌라도가 대답했습니다. “나는 하나님의 아들의 피에 대하여 결백합니다. 이것은 우리에게 분명합니다.”[a]


    (47) 그러자 그곳에 온 모든 사람이 빌라도에게, 백부장과 군인들에게 그들이 본 것을 아무에게도 말하지 말라고 명령해 달라고 간청하며 재촉했습니다. (48) 그들은 말했습니다. “우리가 유대 백성의 손에 넘어가 돌에 맞아 죽는 것보다, 하나님 앞에서 큰 죄를 짓는 편이 우리에게 더 낫습니다.” (49) 그래서 빌라도는 백부장과 군인들에게 아무 말도 하지 말라고 명령했습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “피에 대하여 결백하다”는 말은 그 죽음에 대한 책임이 없다는 빌라도 자신의 주장입니다.
    reason: 화자의 자기변호와 서술자의 판정을 혼동하지 않도록 신학적·서사적 긴장을 보존합니다.
lexical_decisions:
- source_word: grave / tomb
  choice: 무덤
  rationale: 문맥상 예수의 매장 장소를 가리키므로 현대 한국어에서 자연스럽고 일관된 ‘무덤’을 사용했습니다.
- source_word: centurion
  choice: 백부장
  rationale: 로마 군대의 계급을 나타내는 전통적이면서도 널리 이해되는 성서 용어입니다.
- source_word: the Son of God
  choice: 하나님의 아들
  rationale: 기독교 문헌의 핵심 칭호를 교파적 확장 없이 직접 옮겼습니다.
- source_word: the Jewish people
  choice: 유대 백성
  rationale: 집단 전체를 현대의 민족·종교 공동체와 무비판적으로 동일시하지 않으면서, 제시된 고대 서사의 집단 명칭을 보존했습니다.
- source_word: clean of the blood
  choice: 피에 대하여 결백합니다
  rationale: 피 흘림에 대한 책임이 없다는 셈어적·법정적 표현의 의미를 자연스러운 한국어로 전달했습니다.
theological_decisions:
- issue: ‘하나님의 아들’에 대한 진술의 시제
  choice: “참으로 그는 하나님의 아들이었습니다”
  alternative: “참으로 그는 하나님의 아들입니다”
  rationale: 제공된 증거문헌의 과거 시제(was)를 보존하여 화자들의 인식과 서사적 시점을 임의로 현재화하지 않았습니다.
- issue: 빌라도의 무죄 주장
  choice: 본문의 자기변호를 그대로 인용하되 각주로 화자 발언임을 밝혔습니다.
  alternative: 빌라도가 실제로 무죄라고 단정하는 서술로 처리
  rationale: 이 문장은 빌라도 자신의 주장이지 서술자의 명시적 판정이라고 단정할 수 없으므로, 본문의 긴장을 보존했습니다.
- issue: ‘유대 백성’이라는 집단 표현
  choice: 고대 서사 속 등장인물들이 두려워한 집단을 지칭하는 표현으로 번역했습니다.
  alternative: ‘유대인들’ 또는 특정 지도층으로 한정
  rationale: 제공된 증거문헌은 ‘Jewish people’로 되어 있어 임의로 지도층만을 뜻하게 좁히지 않았습니다. 동시에 현대 유대인 전체에 대한 일반화로 읽지 않도록 각주 필요성을 검토했으나, 원문 언어 검토 전에는 본문 외 설명을 과도하게 늘리지 않았습니다.
translation_notes:
  register: 현대 표준 한국어의 정중하고 품위 있는 합쇼체를 사용했습니다. 문장은 일반 독자가 쉽게 따라갈 수 있도록 정리하되, 반복되는 보고·목격·침묵 명령의 흐름을 유지했습니다. 이 초안은 제공된 공공 영역 영어 증거문헌을 토대로 작성한 잠정 번역이며, 아크밈 코덱스의 그리스어 원문에 대한 직접 검토가 아직 필요합니다.
