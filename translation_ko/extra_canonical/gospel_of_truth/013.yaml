  text: '그는 선하십니다—아버지의 생각[a] 안에서, 관조 가운데 있습니다.


    그의 묵상의 말—그 하나하나, 그 모든 말은 그의 뜻의 일입니다. 그것들은 빛 안의 말씀이며, 밖에 있는 것으로서 그의 말에 속합니다. 그들이 아직 그의 생각의 깊은 곳에 있을 때, 말씀—가장 먼저 밖으로 나온 이—가 그것들을 드러냈으며, 한 영이 없는 은혜 가운데 하나의 말씀을 말하는 마음과 함께했습니다. 그는 그것들이 밖으로 드러나기 전에 그 안에 있었기 때문에 “생각”이라 불렸습니다. 그리고 마침내 그것을 원하는 이의 뜻이 기뻐한 때에, 그가 가장 먼저 밖으로 나오는 일이 일어났습니다.


    이제 뜻은 아버지께서 안식하시는 것입니다. 그분 없이 일어나는 것은 아무것도 없으며, 아버지의 뜻 없이 일어나는 것도 아무것도 없습니다. 그러나 그분의 뜻은 헤아릴 수 없습니다. 그의 흔적은 뜻입니다. 아무도 그분을 알 수 없으며, 그들이 그분을 살펴서 붙잡을 수 있도록 그분이 존재하시는 것도 아닙니다. 오히려 그가 원하시는 것—이것이 일어나는 것입니다. 그들의 시야가 하나님 앞에서 전혀 기쁘지 않더라도 그렇습니다. 아버지께서 그들의 시작과 끝을 모두 아시기 때문입니다. 그들의 끝에서 그분은 그들을 마주하여 맞이하실 것입니다[c][b]. 그리고 끝은 숨겨진 분을 아는 지식입니다. 숨겨진 분은 아버지이십니다. 그분에게서 시작이 나왔고, 그에게서 나온 모든 이가 그분께로 돌아갈 것입니다. 그들은 그 이름의 영광과 기쁨을 위해 드러났습니다.'
