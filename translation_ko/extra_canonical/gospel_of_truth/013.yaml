  revised_text: '이것은 아버지의 생각[a] 안에 있는 충만이며, 그의 숙고입니다.


    그의 숙고의 말씀, 곧 그의 말씀 하나하나는 그의 뜻의 일입니다. 그것들은 그의 말씀의 계시 안에서 생명으로 나왔습니다. 그것들이 아직 그의 생각의 깊은 곳에 있을 때, 가장 먼저 나온 말씀께서 그것들을 드러내셨습니다. 그분은 하나의 말씀을 말씀하시는 마음과 함께, 침묵한 은혜 가운데 계셨습니다. 그것들이 드러나기 전에 그 안에 있었으므로, 그는 ‘생각’이라 불렸습니다. 그러므로 그분은 그것을 원하신 이가 기뻐하신 때에 가장 먼저 나오셨습니다.


    아버지는 자신의 뜻 안에서 쉬시며 그것을 기뻐하십니다. 그분 없이는 아무것도 일어나지 않으며, 아버지의 뜻 없이는 아무것도 일어나지 않습니다. 그러나 그분의 뜻은 헤아릴 수 없습니다. 그분의 자취는 뜻입니다. 아무도 그분을 알 수 없으며, 사람들이 그분을 살펴보고 붙잡을 수 있도록 그분이 존재하시는 것도 아닙니다[c]. 오히려 그분이 원하시는 것은 무엇이든 이루어집니다. 그것이 하나님 앞에서 그들에게 전혀 기쁘게 보이지 않는다 해도 그러합니다. 아버지께서는 그들 모두의 시작과 끝을 아십니다. 그들의 끝에서 그분은 그들을 얼굴을 마주하여 맞이하실 것입니다[b]. 끝이란 숨겨진 분에 대한 앎이며, 숨겨진 분은 아버지이십니다. 시작은 그분에게서 나왔고, 그분에게서 나온 모든 이는 그분께로 돌아갈 것입니다.


