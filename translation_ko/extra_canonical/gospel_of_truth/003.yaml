  naturalness: ‘포용될 수 없는 분’은 현대 한국어에서 부자연스러우므로 ‘헤아릴 수 없으신 분’으로 고쳤습니다. ‘유언이 열리다’는 법률 비유에 맞게 ‘유언장이 아직 개봉되지 않다’로, ‘망각에 의해 벗겨진’은 자연스러운 수동 표현으로 다듬었습니다. 문체는 현대 합쇼체를 유지했습니다.
