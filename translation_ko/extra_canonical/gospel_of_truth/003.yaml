- from: '아버지—곧 포용될 수 없는 분—는 모든 것을[a] 자신 안에 간직하신 분이시며, 모든 것은 그분 안에 있고, 모든 것은 그분을 필요로 합니다. 그분은 그들의 온전함을 자신 안에 간직하셨습니다. 그분과 그분의 지체들 사이에 무슨 질투가 있겠습니까? 만일 모든 것이 이와 같이 이미 그것을 받았다면, 그들은 그분에게 올 수 없었을 것입니다. 그분은 그것을 자신 안에 그들을 위해 간직해 두셨다가, 그들이 한 몸 안에서 하나의 앎으로 그분에게 돌아오도록 그것을 그들에게 주십니다.


    알려지지 않은 분처럼, 그분은 알려지기를 바라시고 사랑받기를 바라십니다—왜냐하면 아버지의 앎 말고 모든 것이 또 무엇을 필요로 하겠습니까? 그분은 인도자가 되셨습니다—평안하고 서두르지 않으시는 분으로. 그분은 배움의 자리들에 오셔서 교사로서 말씀을 선포하셨습니다. 자기 마음에 지혜롭다고 여기는 이들이 그분을 시험하려고 올라왔지만, 그분은 그들을 어리석은 자들이므로 당혹하게 하셨습니다. 그들은 진리 안에서 지혜롭지 않았기 때문에 그분을 미워했습니다. 그들 다음에는 어린아이들이 또한 왔습니다. 그들에게는 아버지의 앎이 있습니다. 그들이 강해졌을 때, 그들은 아버지의 표현들에 대한 가르침을 받았습니다. 그들은 알았고, 그들도 알려졌습니다. 그들은 영광을 받았고 영광을 돌렸습니다. 그들의 마음에는 살아 있는 자들의 살아 있는 책이 드러났습니다. 그것은 아버지의 생각과 마음 안에, 그리고 만물의 기초가 놓이기 전에, 그분의 헤아릴 수 없으심 안에 기록되어 있었습니다. 이 책은 아무도 빼앗을 능력이 없습니다. 왜냐하면 그것을 집어 드는 자가 죽임을 당하도록 정해져 있기 때문입니다. 그 책이 나타나지 않는다면, 구원을 맡은 이들 가운데서 아무도 드러날 수 없습니다.


    이 때문에 자비로우시고 신실하신 예수께서는 그 책을 취하실 때까지 인내하며 견디셨습니다. 그분은 자신의 죽음이 많은 이들에게 생명이라는 것을 아시기 때문입니다. 아직 유언이 열리지 않았을 때에는, 죽은 집주인의 재산이 숨겨져 있습니다. 이와 같이 모든 것은, 모든 것의 아버지께서 보이지 않으실 때 숨겨져 있었습니다. 그것들은 그분에게서 왔고, 모든 영역이 그분으로부터 나옵니다. 그러므로 예수께서 드러나셨고, 그 책을 입으셨고, 나무에 못 박히셨고, 십자가에서 아버지의 칙령을 공표하셨습니다.


    오, 얼마나 큰 가르침입니까! 그분은 자신을 죽음으로 낮추셨고, 영원한 생명을 입으셨고, 썩어 없어질 누더기를 벗어 버리셨고, 아무도 그분에게서 빼앗을 수 없는 썩지 않음을 입으셨습니다. 그분이 공포의 빈 영역들로 들어가셨을 때, 그분은 망각에 의해 벗겨진 이들 사이를 지나가시며—지식과 온전함이 되셔서—마음속에 있는 것을, 가르침을 받을 준비가 된 이들에게 선포하셨습니다.'
