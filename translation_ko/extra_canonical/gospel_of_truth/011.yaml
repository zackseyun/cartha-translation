  revised_text: '비틀거리는 이들의 발을 굳게 하십시오[a]. 병든 이들에게 손을 내미십시오. 굶주린 이들에게 먹을 것을 주고, 지친 이들에게 쉼을 주십시오. 일어나기를 원하는 이들을 일으키고, 잠자는 이들을 깨우십시오. 여러분은 칼집에서 뽑힌 이해이기 때문입니다. 힘이 이와 같으면 더욱 강해집니다.


    자신들을 돌보십시오. 여러분이 자신에게서 내버린 다른 것들을 돌보지 마십시오. 다시 돌아가 자기 토한 것을 먹지 마십시오. 좀먹지도 말고 벌레 먹지도 마십시오. 여러분이 이미 그것을 떨쳐 버렸기 때문입니다. 마귀의 집이 되지 마십시오. 여러분이 이미 그를 무력하게 만들었기 때문입니다. 무너져 가는 여러분의 걸림돌들을, 마치 여러분이 지지대인 양 떠받치지 마십시오. 불의한 자는 아무것도 아니므로, 의로운 자보다 더 엄하게 다루어져야 합니다. 그는 다른 이들 가운데서 자기 일을 행합니다.


    그러므로 아버지의 뜻을 행하십시오. 여러분은 그분에게서 났기 때문입니다. 아버지는 달콤하시며, 선함이 그분의 뜻 안에 있습니다. 그분은 여러분에게 속한 것들을 아시므로, 여러분이 그것들 안에서 쉼을 얻도록 하십니다. 사람들이 열매로 여러분에게 속한 것들을 알기 때문입니다. 아버지의 자녀들은 그분의 향기입니다. 그들이 그분의 얼굴의 은혜에서 비롯되었기 때문입니다. 이 때문에 아버지는 그분의 향기를 사랑하시고 모든 곳에서 그것을 드러내십니다. 그것이 hylē[a]와 섞일 때, 그분은 그 향기를 빛에게 주시며, 그분의 고요함 가운데서 그것이 모든 형체와 모든 소리를 능가하게 하십니다. 향기를 맡는 것은 귀가 아니라 영입니다. 영은 그 향기를 자기에게로 끌어당기고 아버지의 향기 속으로 가라앉습니다. 그러면 그분은 그것을 감싸 보호하시고, 그것이 나온 곳, 곧 차가워졌던 처음의 향기로부터 나온 곳으로 이끄십니다. 그것은 영혼을 지닌 형성물 안에 있는 어떤 것으로, 마치 부스러지기 쉬운 흙덩이 속에 가라앉은 차가운 물과 같습니다[b]. 그것을 보는 이들은 그것이 그저 흙이라고 생각합니다. 그러나 나중에 그것은 다시 풀립니다. 숨결이 그것을 끌어당기면, 그것은 따뜻해집니다.


    이처럼 차가운 향기들은 분열에서 비롯됩니다. 이 때문에 믿음이 왔습니다. 믿음은 분열을 풀어 버리고 사랑으로 따뜻한 Pleroma[c]를 가져왔습니다. 이는 차가움이 다시 돌아오지 않고, 오히려 완전함의 생각의 하나됨이 있게 하려는 것입니다. 이 Logos가 그것을 드러냈습니다.'
