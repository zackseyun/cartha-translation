  yaml_path: translation/extra_canonical/gospel_of_truth/011.yaml
  text: 'Make firm the feet of those who stumble[a]; stretch out a hand to the sick. Give food to those who are hungry, and give rest to those who are weary. Raise up those who wish to arise, and awaken those who sleep—for you are the Understanding that has been unsheathed. And if strength is of this sort, it grows stronger.


    Be concerned for yourselves; do not be concerned with other things that you have cast away from yourselves. Do not turn back to eat your vomit. Do not be moth-eaten, do not be worm-eaten, for you have already shaken it off. Do not become a house for the Devil, for you have already brought him to nothing. Do not prop up your stumbling-blocks that are collapsing, as though you were a support. For the lawless one is nothing, to be dealt with more severely than the just, while doing his works among others.


    Therefore do the Father’s will, because you are from him. For the Father is sweet, and goodness is in his will. He knows what is yours, so that you may find rest in them. For by the fruits they know what is yours, because the children of the Father are his fragrance, since they come from the grace of his Face. For this reason the Father loves his fragrance and reveals it in every place; and when it mingles with hylē, he gives his fragrance to the Light, and in his quiet he causes it to surpass every form and every sound. For it is not the ears that smell the fragrance, but the Spirit smells it, draws the fragrance to itself, and sinks down into the fragrance of the Father. Then he shelters it and leads it back to the place from which it came—from the first fragrance that had grown cold. It is something within a soul-endowed formation, like cold water sunk into a clod of loose earth[b]. Those who see it suppose it is only earth; afterward it is dissolved again. And if a breath draws it,
    it becomes warm. Thus the fragrances that are cold are from the division. Because of this, Faith came: it dissolved the division and brought the Pleroma that is warm with agapē, so that the cold would not return, but rather the unity (monad) of Thought of perfection[c]. This Logos made it manifest.'
  footnotes:
  - marker: a
    text: Or 'Do not be eaten by worms'.
    reason: previous_rendering
  - marker: b
    text: Or 'soul-endowed delusion'.
    reason: previous_rendering
  - marker: c
    text: Or 'causes it to ascend above'.
    reason: previous_rendering
translation:
  language: ko
  text: '그러므로 아버지의 뜻을 행하십시오. 여러분은 그분에게서 났기 때문입니다. 아버지는 달콤하시며, 선함이 그분의 뜻 안에 있습니다. 그분은 여러분의 것이 무엇인지 아시니, 여러분이 그것들 안에서 쉼을 얻도록 하십니다. 열매를 보면 여러분의 것이 무엇인지 알 수 있기 때문입니다. 아버지의 자녀들은 그분의 향기이며, 그분의 얼굴의 은혜에서 나왔기 때문입니다. 이 때문에 아버지는 그분의 향기를 사랑하시고, 모든 곳에서 그것을 드러내십니다. 그것이 hylē와 섞일 때, 그분은 그 향기를 빛에게 주시며, 그분의 고요함 안에서 그것을 모든 형체와 모든 소리보다 더 뛰어나게 하십니다. 향기를 맡는 것은 귀가 아니며, 영이 향기를 맡습니다. 영은 그 향기를 자기에게로 끌어당기고, 아버지의 향기 속으로 가라앉힙니다. 그러면 그분은 그것을 보호하시고, 그것이 왔던 곳으로—처음의 향기, 곧 차가워졌던 곳으로—되돌려 보내십니다. 그것은 영혼이 깃든 형성 안에 있는 어떤 것으로, 마치 느슨한 흙덩이에 가라앉은 차가운 물과 같습니다[b]. 그것을 보는 사람들은 그것이 그냥 흙이라고 생각합니다. 그러나 뒤에 가서는 다시 풀립니다. 숨결이 그것을 끌면, 그것은 따뜻해집니다.


    이렇게 차가운 향기들은 분열에서 나온 것입니다. 그러므로 믿음이 왔습니다. 믿음은 분열을 해체하고, 사랑으로 뜨거운 Pleroma를 가져왔습니다. 그리하여 차가움이 다시 돌아오지 않고, 오히려 완전함의 생각의 하나됨이 있게 하려는 것입니다[c]. 이 Logos가 그것을 드러냈습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: hylē는 물질, 곧 ‘matter’를 가리키는 발렌티누스계 기술용어입니다.
    reason: source_note
  - marker: b
    text: 또는 ‘영혼이 깃든 덫/유혹’로도 옮길 수 있으나, 여기서는 πλασμα(plasma)의 의미를 살려 ‘형성’으로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘완전함의 생각을 넘어 솟아오르게 하려는 것입니다’로도 읽을 수 있으나, Coptic 동사는 ‘surpass’의 뜻이 더 자연스럽습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁϫⲣⲟ
  english_pob_choice: Do the Father’s will
  chosen_korean: 아버지의 뜻을 행하십시오
  alternatives_korean:
  - 아버지의 뜻을 하십시오
  - 아버지의 뜻을 이루십시오
  lexicon: Crum; NH Coptic usage
  rationale: 권면의 핵심은 ‘뜻을 실행하다’이므로 한국어에서는 자연스러운 합쇼체 명령인 ‘행하십시오’로 옮겼습니다.
- source_word: ⲥⲧⲁⲉⲓ
  english_pob_choice: fragrance
  chosen_korean: 향기
  alternatives_korean:
  - 향내
  - 냄새
  lexicon: Crum; Layton
  rationale: 문맥상 단순한 냄새가 아니라 정체성과 영적 표지를 지닌 ‘fragrance’이므로 ‘향기’가 가장 적절합니다.
- source_word: ⲡⲗⲁⲥⲙⲁ
  english_pob_choice: formation
  chosen_korean: 형성
  alternatives_korean:
  - 조형
  - 형태
  - 피조물
  lexicon: Greek loanword in Coptic (plasma)
  rationale: ‘delusion’로 풀면 과잉해석이 되므로, 빚어진 상태를 살리는 ‘형성’으로 옮겼습니다.
- source_word: ⲣ-ⲥⲁⲧⲡⲉ
  english_pob_choice: surpasses
  chosen_korean: 더 뛰어나게 하십니다
  alternatives_korean:
  - 더 높이십니다
  - 더 우월하게 하십니다
  lexicon: Crum
  rationale: 이 동사는 공간적 ‘올라감’보다 질적 우월/능가를 뜻하므로, ‘뛰어나다’ 계열로 옮겨 의미를 보존했습니다.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  english_pob_choice: Pleroma
  chosen_korean: Pleroma
  alternatives_korean:
  - 충만
  - 충만함
  lexicon: Valentinian technical term
  rationale: 발렌티누스 전승의 기술용어이므로 일반어로 평평하게 만들지 않고 음역을 유지했습니다.
theological_decisions:
- issue: ‘Faith came’의 인격화 여부
  chosen_reading: ‘믿음이 왔습니다’로 두되, 추상명사 그대로 번역해 인격화는 강제하지 않았습니다.
  alternative_readings:
  - ‘믿음’이 하나의 존재처럼 왔다고 읽기
  - ‘신실함이 왔다’로 읽기
  rationale: 문맥상 믿음이 분열을 해체하는 주체로 기능하지만, 본문 자체가 꼭 고유한 위격을 요구하지는 않으므로 과도한 신격화 표지는 피했습니다.
  doctrine_reference: Valentinian/gnostic discourse on Pistis
- issue: ‘the grace of his Face’의 해석
  chosen_reading: ‘그분의 얼굴의 은혜’로 직역했습니다.
  alternative_readings:
  - ‘그분의 현현의 은혜’
  - ‘그분의 표정의 은혜’
  rationale: face는 단순 신체 부위보다 현존/드러남의 표지로 기능하므로, 본문에 있는 긴장감을 유지하려고 직역을 택했습니다.
  doctrine_reference: Theophany/manifestation motif in the source tradition
