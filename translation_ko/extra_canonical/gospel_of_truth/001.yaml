translation:
  language: ko
  text: 진리의 복음은 진리의 아버지에게서 은혜를 받은 이들에게 기쁨입니다. 이는 그들이 플레로마(Pleroma)에서 나오신, 아버지의 생각과 마음 안에 계신 말씀의 능력으로 그분을 알게 되기 때문입니다. 그분은 “구원자”라고 불리십니다. 그것은 아버지를 알지 못하게 된 이들을 구원하시기 위해 그분이 행하실 일의 이름입니다. 또한 “복음”이라는 이름은 소망의 계시이며, 그분을 찾는 이들이 발견하게 되는 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  english_pob_choice: Gospel
  chosen_korean: 복음
  alternatives_korean:
  - 좋은 소식
  lexicon: Crum; Greek loan εὐαγγέλιον in Coptic
  rationale: 본문이 자기 지시적으로 쓰는 명칭이므로, 단순히 ‘좋은 소식’보다 ‘복음’이 기능과 전통적 표지를 더 정확히 드러냅니다.
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  english_pob_choice: Pleroma
  chosen_korean: Pleroma
  alternatives_korean:
  - 충만
  - 온전함
  lexicon: Greek loan πλήρωμα; Crum/BDAG
  rationale: 여기서는 발렌티누스 전승의 기술 용어이므로 음역을 유지해 개념망을 보존했습니다.
- source_word: ⲡⲥⲁϫⲉ
  english_pob_choice: Word
  chosen_korean: 말씀
  alternatives_korean:
