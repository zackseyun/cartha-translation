  chosen_reading: ‘구원자’라고 불리며, 그분의 일은 아버지를 알지 못하게 된 이들을 구원하는 것입니다
  alternative_readings:
  - ‘구세주’라고 불리며…
  - ‘구원자’는 그분이 하실 일의 이름입니다
  rationale: 본문은 이름과 사역을 연결해 설명하므로, 호칭과 구원의 대상을 함께 드러내는 표현을 택했습니다.
