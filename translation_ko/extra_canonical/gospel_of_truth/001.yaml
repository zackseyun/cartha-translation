  lexicon: Crum
  rationale: 인격화된 ‘Word’에 대응하되, 한국어에서는 ‘말씀’이 가장 자연스럽고 신학적 함의를 과도하게 줄이지 않습니다.
- source_word: ⲡⲥⲱⲧⲏⲣ
  english_pob_choice: Savior
  chosen_korean: 구원자
  alternatives_korean:
