  rationale: 영어 POB의 ‘Unity’는 본문에서 글자들을 기록한 근원적 일치를 가리키므로, 한국어에서도 신학적 개념을 과도하게 실체화하지 않도록 했습니다.
  doctrine_reference: 영지주의/발렌티누스계 형이상학 어휘
