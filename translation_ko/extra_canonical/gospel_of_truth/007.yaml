revisions:
- from: '그들이 아직 형태도 이름도 받지 못했기 때문입니다. 아버지께서는 그들을 나오게 하십니다. 그런 다음 그들이 그의 앎을 통해 형태를 받으면, 참으로 그 안에 있으면서도 그를 알지 못합니다. 그러나 아버지께서는 온전하셔서, 그 안에 있는 모든 공간을 아십니다. 그분이 원하시면, 누구든지 원하시는 이를 드러내시며, 그들에게 형태를 주시고 이름을 주십니다. 그들에게 이름을 주시고, 아직 생겨나기 전에 자기들을 지으신 이를 알지 못하던 이들이 생겨나게 하십니다.


    그러므로 아직 생겨나지 않은 이들을 아무것도 아니라고 말하지 마십시오. 오히려 그들은 그분이 원하실 때 생겨나게 하실 그분 안에 존재합니다—마치 뒤늦은 때처럼 말입니다. 모든 것이 드러나기 전에, 그분은 자기 때에 무엇을 빚으실지 아십니다. 그러나 아직 드러나지 않은 열매는 아직 아무것도 알지 못하며, 아무것도 하지도 못합니다.


    더 나아가 아버지 안에 있는 모든 아이온은 존재하는 분에게서 나왔고, 그분은 비존재로부터 그것들을 세우십니다. 뿌리가 없는 이들에게는 열매도 없습니다. 그들은 자기들 속으로 “내가 생겨났다”라고 말하지만, 스스로 해체될 것입니다. 그러므로 전혀 존재하지 않았던 이들은 존재하지 않을 것입니다.[a]'
  to: '그들이 아직 형태도 이름도 받지 못했기 때문입니다. 아버지께서는 그들을 낳으십니다. 그런 다음 그들이 그분의 앎을 통해 형태를 받으면, 참으로 그분 안에 있으면서도 그분을 알지 못합니다. 그러나 아버지께서는 온전하셔서, 그분 안에 있는 모든 공간을 아십니다. 그분이 원하시면, 원하시는 누구든지 드러내시며 그들에게 형태와 이름을 주십니다. 그들에게 이름을 주시고, 아직 생겨나기 전에 자기들을 지으신 이를 알지 못하던 이들이 생겨나게 하십니다.


    그러므로 아직 생겨나지 않은 이들을 아무것도 아니라고 말하지 마십시오. 오히려 그들은 그분이 원하실 때 생겨나게 하실 분 안에 존재합니다. 아직 오지 않은 때와 같이 말입니다. 모든 것이 드러나기 전에, 그분은 자신이 무엇을 낳으실지 아십니다. 그러나 아직 드러나지 않은 열매는 아직 아무것도 알지 못하며, 아무것도 하지도 않습니다.


    더 나아가 아버지 안에 있는 모든 아이온은 존재하는 분에게서 나왔고, 그분은 비존재로부터 그것들을 세우십니다. 뿌리가 없는 이들에게는 열매도 없습니다. 그들은 속으로 “내가 생겨났다”라고 말하지만, 스스로 녹아 없어질 것입니다. 그러므로 전혀 존재하지 않았던 이들은 존재하지 않을 것입니다.'
  rationale: 핵심 용어와 원문의 모호한 존재론적 대비는 유지하되, 한국어의 비유와 문장 연결을 자연스럽게 다듬었습니다. 출처가 뒷받침하지 않는 이전 번역을 ‘또는’으로 제시한 각주는 삭제했습니다. 이는 본문 의미를 바꾸지 않으며, 오히려 형태와 이름, 앎, 생겨남이라는 반복 구조를 보존합니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:38:31Z'
review_pass:
  verdict: revise
  source_fidelity: 본문의 주요 대응어(형태, 이름, 아버지, 모든 공간, 비존재, 아이온, 존재하는 분)는 콥트어의 존재론적·비유적 어법과 영어 감사본을 대체로 충실히 반영합니다. 다만 ‘마치 뒤늦은 때처럼’은 ⲕⲁⲓⲣⲟⲥ의 ‘아직 오지 않은/뒤의 때’라는 비유를 한국어에서 불명료하게 만들며, 기존 각주는 현재 본문과 콥트어 본문이 지지하지 않는 ‘입히시며’ 등의 내용을 대안 번역처럼 제시합니다.
  naturalness: ‘그들을 나오게 하십니다’, ‘누구든지 원하시는 이’, ‘자기들 속으로’, ‘스스로 해체될 것입니다’는 현대 격식체 한국어에서 어색하거나 의미가 불필요하게 기계적으로 들립니다. ‘낳으십니다’, ‘원하시는 누구든지’, ‘속으로’, ‘스스로 녹아 없어질 것입니다’로 고치면 문맥과 문체가 자연스럽습니다.
  terminology: ‘형태’, ‘이름’, ‘아버지’, ‘모든 공간’, ‘비존재’, ‘아이온’, ‘존재하는 분’은 일관되고 적절합니다. ‘비존재’는 존재/비존재의 대조를 보존하며, ‘아이온’은 기술어를 평면화하지 않습니다.
  issues:
  - severity: medium
    issue: 비유의 불명료한 번역
    rationale: ‘마치 뒤늦은 때처럼’은 한국어에서 무엇이 무엇에 비유되는지 분명하지 않습니다. ‘아직 오지 않은 때와 같이’는 뒤의/미래의 때라는 원문의 비유를 명료하게 보존합니다.
  - severity: medium
    issue: 출처가 뒷받침하지 않는 대안 각주
    rationale: 기존 각주는 형태·이름의 반복과 ‘생겨나게 하심’을 대체하는 내용으로 ‘그들을 입히시며’ 등을 제시합니다. 이는 영어 감사 이력에서도 폐기된 이전 번역이며 제시된 콥트어 본문이 뒷받침하지 않으므로, 본문 주석으로 남겨 두면 독자를 오도합니다.
  - severity: low
    issue: 일부 비자연적 표현
    rationale: ‘나오게 하십니다’와 ‘해체될 것입니다’는 각각 출산/발현 및 녹아 사라짐의 비유를 충분히 자연스럽게 전달하지 못합니다.
