    approximate_i3_alignment: NHC I.3 pp. 35-37 area — Parable of the Jars / Coming into Being
    alignment_confidence: approximate
  warnings: []
  consult_excerpt: 'It’s like some who’ve left their home, having jars that weren’t any good in places. They broke them, but the master of the house doesn’t suffer any loss. Instead he rejoices, because in place of the bad jars are ones that are full and complete. For this is 26 the judgment that’s come from above; it’s judged everyone. It’s a drawn, two-edged sword which cuts both ways. The Word, which is in the hearts of those who speak it, appeared. It isn’t just a sound, but it was incarnated (embodied).

    A great disturbance arose among the jars, because some were empty, others filled; some provided for, others poured out; some purified, others broken. All the realms were shaken and disturbed, because they didn’t have order or stability. Error was anxious. It didn’t know what to do; it grieved, mourned, and hurt itself, because it knew nothing. The knowledge, which is its (Error’s) destruction, approached it (Error) and all that emanated from it. Error is empty, with nothing inside it.

    Truth came into their midst, and all that emanated knew it. They welcomed the Father in Truth with a complete power that joins them with the Father. Truth is the Father’s mouth; the Holy Spirit is his tongue. Everyone who loves the Truth and are joined to the 27 Truth are joined to the Father’s mouth. By his tongue they’ll receive the Holy Spirit. This is the revelation of the Father and his manifestation to his generations. He revealed what was hidden of himself; he explained it, because who has anything, if not the Father alone?'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/006.yaml
  text: 'For this is the judgment that came down from above[a]; it judged everyone. It is a sword, two‑edged, that cuts on both sides. The Word, which is in the hearts of those who speak it, appeared: it is not a mere sound, but it put on a body. A great disturbance arose among the jars: some were empty, and others were filled; some were provided for, and others poured out; some were purified, and others were broken. All the realms were shaken and agitated, for they had neither order nor stability.


    Error became anxious within itself; it did not know what it should do. It grieved and mourned and struck at itself, for it knew nothing. The Knowledge that is its undoing approached it—and all that had come forth from it—for Error is empty and has nothing within it.


    Truth came in their midst, and all who are from it knew it. They greeted the Father in Truth with a complete Power that joins them to the Father. Truth is the mouth of the Father; the Holy Spirit is his tongue. Whoever is joined to the mouth of the Father will receive the Holy Spirit by his tongue. This is the revelation of the Father and his manifestation to his generations: he revealed what of himself was hidden, he explained it—for who has anything[b], if not the Father alone?'
  footnotes:
  - marker: a
    text: Or 'The Word, which is in the hearts of those who speak, appeared'.
    reason: previous_rendering
  - marker: b
    text: Or 'It came to be among the vessels,\nso that there arose a great disturbance among the jars'.
    reason: previous_rendering
translation:
  language: ko
  text: '판단은 위로부터 내려왔습니다[a]. 그것은 모든 사람을 심판했습니다. 그것은 양쪽에서 베는 양날의 칼입니다. 말하는 이들의 마음에 있는 말씀이 나타났습니다. 그것은 단순한 소리가 아니라 몸을 입었습니다. 그릇들 사이에 큰 동요가 일어났습니다. 어떤 것은 비어 있었고, 어떤 것은 채워져 있었으며, 어떤 것은 공급을 받았고, 어떤 것은 쏟아졌으며, 어떤 것은 정결하게 되었고, 어떤 것은 부서졌습니다. 모든 영역이 흔들리고 뒤흔들렸습니다. 그것들은 질서도 안정도 없었기 때문입니다.


    오류는 자기 안에서 불안해졌습니다. 그것은 자신이 무엇을 해야 하는지 알지 못했습니다. 그것은 슬퍼하고 애곡하며 자신을 해쳤습니다. 아무것도 알지 못했기 때문입니다. 오류를 무너뜨리는 지식이 오류에게, 그리고 오류에게서 나온 모든 것에게 다가갔습니다. 오류는 비어 있고, 안에 아무것도 없습니다.


    진리가 그들 가운데 들어왔고, 거기서 나온 모든 이가 그것을 알았습니다. 그들은 아버지와 결합시키는 완전한 능력과 함께 진리 안에서 아버지를 맞이했습니다. 진리는 아버지의 입이고, 성령은 그의 혀입니다. 아버지의 입과 하나 된 사람은 누구나 그의 혀를 통해 성령을 받게 될 것입니다. 이것은 아버지와 그의 세대들에 대한 계시이며, 그가 자신에 대해 숨겨졌던 것을 드러낸 것입니다. 그는 그것을 풀어 설명하셨습니다. 아버지만을 제외하고 누가 무엇인가를 가지고 있습니까?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말하는 이들의 마음에 있는 말씀이 나타났습니다’로도 옮길 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲡⲥⲁⲁⲧⲡⲉ
  english_pob_choice: judgment
  chosen_korean: 판단
  alternatives_korean:
  - 심판
  - 판결
  lexicon: Sahidic Coptic lexical tradition
  rationale: 위로부터 내려오는 평가적/분별적 행위를 가리키므로, 교리적 색채가 강한 ‘심판’보다 먼저 행위 자체를 드러내는 ‘판단’이 원문에 가깝습니다.
- source_word: ⲙⲫⲟⲥⲛⲉⲩ
  english_pob_choice: two-edged
  chosen_korean: 양날의
  alternatives_korean:
  - 두 날의
  - 이중 날의
  lexicon: Coptic loan from Greek διστόμος
  rationale: 칼의 비유를 자연스럽게 살리면서도, 양쪽으로 베는 이미지를 압축적으로 전달합니다.
- source_word: ⲣⲟⲩⲥⲱⲙⲁ
  english_pob_choice: put on a body
  chosen_korean: 몸을 입었습니다
  alternatives_korean:
  - 육신을 입었습니다
  - 몸을 취했습니다
  - 몸이 되었습니다
  lexicon: Coptic verbal idiom
  rationale: ‘입다’는 원문의 착의 비유를 살리면서도 현대 한국어에서 ‘성육신/체현’의 뉘앙스를 과도하게 신학화하지 않습니다.
- source_word: ⲧⲡⲗⲁⲛⲏ
  english_pob_choice: Error (personified)
  chosen_korean: 오류
  alternatives_korean:
  - 오류(인격화된 존재)
  - 미혹
  - 그릇됨
  lexicon: Greek πλάνη; Valentinian technical term
  rationale: 이 문헌에서 ⲧⲡⲗⲁⲛⲏ는 인격화된 힘처럼 서술되므로, 추상명사 ‘오류’로 옮겨 personification을 유지했습니다.
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  english_pob_choice: Knowledge (Gnosis)
  chosen_korean: 지식
  alternatives_korean:
  - 앎
  - 영지
  - 지식(영지)
  lexicon: Valentinian usage
  rationale: 원문 대비가 ‘오류’와 맞서는 인식의 힘이므로 기본어 ‘지식’을 쓰되, 지나친 용어 고정 없이 문맥의 기능을 살렸습니다.
- source_word: ⲡⲉⲣⲱϣ / ⲡⲓⲡⲛⲁ ⲉⲧⲟⲩⲁⲁⲃ
  english_pob_choice: mouth / the Holy Spirit
  chosen_korean: 입 / 성령
  alternatives_korean:
  - 입술 / 성령
  - 입 / 거룩한 영
  lexicon: Crum; standard Coptic Christian usage
  rationale: ‘입-혀’의 병렬을 직역해 계시의 신체적 은유를 유지했고, divine-Spirit 문맥이 분명하므로 ‘성령’으로 옮겼습니다.
- source_word: ⲥⲕⲉⲩⲟⲥ
  english_pob_choice: vessels (jars)
  chosen_korean: 그릇들
  alternatives_korean:
  - 항아리들
  - 용기들
  - 기명
  lexicon: Coptic ⲥⲕⲉⲩⲟⲥ; household context
  rationale: 가정용 항아리 이미지이지만 한국어에서는 더 포괄적이고 자연스러운 ‘그릇들’이 비유의 기능을 잘 드러냅니다.
theological_decisions:
- issue: ‘판단/심판’의 뉘앙스
  chosen_reading: ‘판단’으로 시작하되 곧바로 ‘심판했다’로 이어, 위로부터 내려온 분별/평가가 전면적 판정으로 작동한다는 긴장을 살렸습니다.
  alternative_readings:
  - 처음부터 ‘심판’으로 통일
  - ‘결정’으로 완화
  rationale: 원문은 법정적 단죄와 평가적 판별이 겹칩니다. 한국어에서는 하나로 평평하게 만들기보다 두 층위를 함께 보이게 하는 편이 원문에 충실합니다.
  doctrine_reference: 텍스트 내부의 종말론적 판정 이미지
- issue: 말씀의 ‘몸을 입음’
  chosen_reading: ‘단순한 소리가 아니라 몸을 입었습니다’로 직역해, 말씀이 단지 음성 현상이 아니라 구체적 실재로 나타난다는 뜻을 보존했습니다.
  alternative_readings:
  - ‘육화되었습니다’
  - ‘성육신했습니다’
  rationale: 이 문헌은 요한적/기독론적 어휘를 직접 쓰지 않고도 구현의 신체성을 강조하므로, 해석어보다 이미지 중심의 번역이 더 안전합니다.
  doctrine_reference: 계시와 현현의 신체성
