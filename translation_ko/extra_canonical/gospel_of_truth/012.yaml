revisions:
- from: '복음의 말은 위로부터 오는 구원을 기다리는 이들을 위한 것입니다[a]. 그들이 그것을 기다리는 동안, 소망은 그들의 형상이 그림자 하나 없는 빛인 이들에게 속합니다. 그러므로 Fullness가 이르러도 hylē(물질)의 필요는 아버지의 헤아릴 수 없음에서 나오는 것이 아닙니다. 그는 필요에 때를 주시러 오십니다. 그러나 아무도 불멸하시는 분이 그런 방식으로 오신다고 말할 수는 없습니다. 오히려 아버지의 깊음은 커지고 늘어났고, Error의 생각은 그와 함께 있지 않았습니다. Error는 타락입니다—돌아올 자가 다시 돌아가는 그 대상으로 찾을 때 쉽게 바로 세워질 수 있는 것입니다. 왜냐하면 돌아감은 마음의 변화라고 불리기 때문입니다.


    이 때문에 불멸이 내쉬어졌습니다. 그것은 죄를 지은 이를 뒤따라가, 그가 쉬게 하려고 그렇게 한 것입니다. 필요 가운데 있는 빛에게 남아 있는 것은 용서—Fullness의 말씀—이기 때문입니다. 의사는 병이 있는 곳으로 서둘러 갑니다. 그것이 그가 원하시는 일이기 때문입니다. 그러므로 필요에 있는 이는 그것을 숨기지 않습니다. 누군가가 그가 필요한 것을 가지고 있기 때문입니다. 이런 방식으로 필요가 없는 Fullness가 필요를 채우기 위해 자기 자신으로부터 공급하였으니, 그들이 은혜를 받게 하려는 것입니다. 그들이 필요에 있었을 때는 은혜가 그들과 함께 있지 않았기 때문입니다. 그러므로 은혜가 없는 곳에서 줄어듦이 일어났고, 줄어든 것이 회복되었을 때 필요는 Fullness로 드러났습니다. 이것이 그들을 비추어 밝힌 진리의 빛을 발견한 것이니, 그것은 변하지 않기 때문입니다.


    그러므로 그들은 그들 가운데 계신 메시아에 대하여 이렇게 말했습니다. “찾으십시오. 그러면 동요하던 이들이 돌아오고, 그가 그들에게 기름을 바르실 것입니다.” 그 기름은 아버지의 긍휼이니, 그분이 그들에게 긍휼을 베푸실 것입니다. 그러나 그가 기름 바르신 이들은 완전한 이들입니다. 가득 찬 그릇들만이 기름을 바르기 때문입니다. 그런데 하나의 기름부음이 풀리면 그것은 비게 되고, 필요의 원인은 기름이 새어 나가는 그 자리입니다. 왜냐하면 한 숨과 그 힘이 그것을 끌어내기 때문입니다. 그러나 필요가 없는 이에게서는 어떤 인장도 느슨해지지 않고, 아무것도 비워지지 않습니다. 오히려 그가 필요로 하는 것은 완전하신 아버지께서 그와 함께 다시 채우십니다. 그는 선하십니다. 그는 자기의 심은 것들을 아시기 때문입니다. 그것은 그가 자신의 낙원에 그들을 심으신 분이시기 때문입니다. 이제 그의 낙원은 그의 안식의 장소입니다.'
