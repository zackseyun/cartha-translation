  consult_excerpt: As for the others, then, may they know, where they’re at, that it’s not right 43 for me, having come to the place of rest, to say anything else, but I’ll come to be in it, and will devote myself continually to the Father of all and the true brothers (and sisters), those upon whom the Father’s love is emptied and in whose midst there is no need. They’re the ones who are revealed in Truth; they exist in the true eternal life, and they speak of the light that’s complete and that’s filled with the Father’s seed, and that’s in his heart and in the fullness. His Spirit rejoices in it, and glorifies the one in whom it existed, because he’s good. And his children are complete, and worthy of his name, because he’s the Father. It’s children like this that he loves.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/016.yaml
  text: 'As for the others, may they recognize where they stand. But as for me—having come to the Place of Rest—it is proper not to add anything further; rather, I will come to be in it, and I will devote myself without ceasing to the Father of the All and to the true siblings: those upon whom the love of the Father has been poured, and in whose midst there is no deficiency.


    These are the ones revealed in the Truth; they exist in the true life, and they speak of the Light that is complete and filled with the Father’s seed, that is in his heart and in the Fullness. His Spirit rejoices in it and glorifies the one in whom it existed, because he is good. And his children are complete and worthy of his name, for he is the Father; such are the children whom he loves.


    [… large lacuna in the manuscript …]


    Yet there are some whose thoughts are upon toil: they become drunk in seeking, and they lose their mind. But the holy ones are those whose thought has not been defiled by wickedness; their thought remains within them. For the Logos of the Thought searches out what is above—his unsayability—I have [borne/spoken] by means of the mouth of all: the Good—the Messiah.'
translation:
  language: ko
  text: '다른 이들은 자신들이 어디에 서 있는지 깨달아야 합니다. 그러나 저는—안식의 곳에 이르렀으므로—그 밖의 아무 말도 덧붙이지 않는 것이 마땅합니다. 오히려 저는 거기 안에 있게 될 것이며, 만유의 아버지와 참된 형제자매들에게 끊임없이 헌신할 것입니다. 곧 아버지의 사랑이 부어져 있고 그들 가운데 결핍이 없는 이들입니다.


    이들은 진리 안에서 드러난 이들이며, 참된 생명 안에 존재하고, 완전하고 아버지의 씨로 가득한 빛에 대해 말합니다. 그 빛은 그의 마음과 충만 가운데 있으며, 그의 영이 그 안에서 기뻐하고, 그 안에 존재하던 이를 영광스럽게 합니다. 그가 선하시기 때문입니다. 그리고 그의 자녀들은 완전하고 그의 이름에 합당합니다. 그가 아버지이기 때문입니다. 그가 사랑하시는 이들은 바로 이런 자녀들입니다.


    [… 사본에 큰 결락이 있음 …]


    그러나 어떤 이들은 수고에 마음을 두고 있습니다. 그들은 찾는 일 속에서 술에 취해 제정신을 잃습니다. 그러나 거룩한 이들은 악함에 의해 생각이 더럽혀지지 않은 이들이며, 그들의 생각은 그들 안에 머물러 있습니다. 생각의 로고스는 위에 있는 것—곧 그의 말할 수 없음—을 찾아냅니다. 저는 모든 이의 입을 통해 그것을 전하였습니다: 선하신 이—메시아.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘안식의 곳’은 단순한 휴식이 아니라, 이 문헌에서 화자가 이르러 참여하는 구원론적 안식의 장소를 가리킵니다.
    reason: theological_note
  - marker: b
    text: ‘로고스’는 직역하면 ‘말씀’이지만, 여기서는 철학적·신학적 용어로 쓰여 음차를 유지했습니다.
    reason: lexical_alternative
