  rationale: 본문은 단순 소실보다 ‘풀려서 해체되는’ 과정을 말하며, 완성/지식/빛의 도래와 연결된 구조적 소멸을 강조합니다.
  doctrine_reference: Valentinian contrast of deficiency and completion
