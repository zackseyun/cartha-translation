revisions:
- from: '예수, 무한한 달콤함[a].


    아버지는 자신의 가슴을 드러내셨습니다. 그의 가슴은 성령입니다. 그는 자기 자신에게서 숨겨진 것을 나타내셨습니다. 자기 자신에게서 숨겨진 것은 그의 아들이니, 아버지의 긍휼을 통해 아이온들이 그를 알고, 아버지를 찾는 일을 그치고, 그 안에서 쉬게 하시려는 것입니다. 곧 이것이 안식임을 알게 하시려는 것입니다.


    아버지는 결핍을 채우시고 그 겉모습을 해체하셨습니다—그 겉모습은 그가 그 안에서 섬기던 세상입니다. 질투와 다툼이 있는 곳에는 결핍이 있고, Unity가 있는 곳에는 완성이 있습니다. 결핍은 아버지가 알려지지 않았기 때문에 생겨났으므로, 아버지가 알려지면 그때부터 결핍은 더 이상 존재하지 않을 것입니다. 마치 사람이 지식을 얻으면 무지가 해체되고, 빛이 나타나면 어둠이 해체되는 것처럼, 결핍도 완성에 의해 해체됩니다. 그러므로 그 겉모습은 그때부터 더 이상 드러나지 않으며, Unity의 조화 속에서 해체될 것입니다.


    지금은 그들의 일들이 흩어져 있습니다. 그러나 때가 되면 Unity가 아이온들을 완성할 것입니다. Unity 안에서 각각은 자신을 받아들이고, Knowledge 안에서 그들은 다중성에서 Unity로 자신을 정결하게 하여, 불처럼 자기 안에서 물질을 태우고, 빛으로 어둠을, 생명으로 죽음을 태울 것입니다. 참으로 이런 일들이 우리 각 사람에게 일어났다면, 전체를 생각하는 것이 우리에게 마땅합니다[d][c][b]. 그러면 이 집은 Unity를 위해 거룩하고 고요하게 될 것입니다.'
