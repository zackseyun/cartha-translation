  revised_text: '예수, 무한한 감미로움이신 분입니다.


    아버지께서는 자신의 품을 드러내셨습니다. 그의 품은 성령입니다. 그는 자신 안에 감추어진 것을 드러내셨습니다. 자신 안에 감추어진 것은 그의 아들이니, 아버지의 긍휼로 세대들이 그를 알고, 아버지를 찾는 일을 그치며, 그 안에서 쉬게 하시려는 것입니다. 곧 이것이 안식임을 알게 하시려는 것입니다.


    아버지께서는 결핍을 채우시고 그 겉모습을 해체하셨습니다. 그 겉모습은 그것이 섬기던 세상입니다. 질투와 다툼이 있는 곳에는 결핍이 있고, 하나됨이 있는 곳에는 완성이 있습니다. 결핍은 아버지가 알려지지 않았기 때문에 생겨났으므로, 아버지가 알려지면 그때부터 결핍은 더 이상 존재하지 않을 것입니다. 사람이 앎을 얻으면 무지가 해체되고, 빛이 나타나면 어둠이 해체되는 것처럼, 결핍도 완성으로 해체됩니다. 그러므로 그 겉모습은 그때부터 더 이상 드러나지 않으며, 하나됨의 조화 속에서 해체될 것입니다.


    지금은 그들의 일들이 흩어져 있습니다. 그러나 때가 되면 하나됨이 아이온들을 완성할 것입니다. 하나됨 안에서 각자는 자기 자신을 받을 것이며, 앎 안에서 그들은 다수성으로부터 하나됨 안으로 자신을 정결하게 할 것입니다. 그들은 불처럼 자기 안에서 물질을 삼키고, 빛으로 어둠을, 생명으로 죽음을 삼킬 것입니다. 참으로 이러한 일들이 우리 각자에게 일어났다면, 우리는 전체에 관하여 숙고해야 합니다. 그러면 이 집은 하나됨을 위하여 거룩하고 고요하게 될 것입니다.'
