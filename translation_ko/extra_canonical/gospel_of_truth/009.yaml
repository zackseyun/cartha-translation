  consult_excerpt: 'When he was revealed, he taught them about the Father, the uncontainable one, and breathed into them what’s in the thought, doing his will. When many had received the light, they turned 31 to him. For the material ones were strangers, who didn’t see his form or know him. For he came by means of fleshly form, and nothing could block his path, because incorruptibility can’t be grasped. Moreover, he said new things while he spoke about what’s in the Father’s heart and brought out the complete Word. When the light spoke through his mouth, and by his voice gave birth to life, he gave them thought, wisdom, mercy, salvation, and the Spirit of power from the infinity and sweetness of the Father. He caused punishments and torments to cease, because they led astray into Error and bondage those who needed mercy. He dissolved and confounded them with knowledge. He became:

    a Way for those who were led astray,

    knowledge for those who were ignorant,

    a discovery for those who were searching,

    strength for those who were wavering, and

    purity for those who were impure.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/009.yaml
  text: 'When he was revealed[a], he taught them of the Father—the uncontainable one—and he breathed into them what is in the Thought, accomplishing his will. Many received the Light and turned to him, for the material ones were strangers; they did not behold his form nor know him. He came by means of a fleshly form, and nothing was able to block his way, because incorruptibility is ungraspable.


    He spoke things new, speaking out what is in the Father’s heart, and he brought forth the complete Word; when the Light spoke from his mouth, and his voice gave birth to life, he gave them Thought, understanding, mercy, salvation, and the Spirit of power, from the infinity and sweetness of the Father.


    He caused punishments and scourges to cease, because they were leading into Error and into captivity those who had need of mercy. He dissolved them, and he confounded them by Knowledge.


    Thus he became:

    - a Way for those who were wandering,

    - Knowledge for those who were ignorant,

    - a Discovery for those who were seeking,

    - Strength for those who were wavering,

    - and Purity for those who were defiled.'
  footnotes:
  - marker: a
    text: Or 'he uttered it outside, in the place of the One Light. Yet an ignorance remained beside him.\n\nWhen the Light spoke through his mouth and by his voice brought forth life, he gave to them Thought, understanding, mercy, salvation, and the Spirit of power, from the infinity and sweetness of the Father. The Beginning is the Father, the immeasurable one.'.
    reason: previous_rendering
translation:
  language: ko
  text: '그가 드러나셨을 때, 그는 그들에게 아버지를—그분은 담을 수 없으신 분이십니다—가르치셨고, 생각 안에 있는 것을 그들 안에 불어넣어 아버지의 뜻을 이루셨습니다. 많은 사람이 빛을 받아 그에게 돌아왔습니다. 육적인 자들은 낯선 사람들이었기 때문입니다. 그들은 그의 형상을 보지도 못했고 그를 알지도 못했습니다. 그는 육신의 형상으로 오셨고, 아무것도 그의 길을 막을 수 없었습니다. 썩지 않음은 붙잡을 수 없기 때문입니다.


    그는 새것들을 말씀하셨고, 아버지의 마음에 있는 것을 말해 내셨으며, 완전한 말씀을 끌어내셨습니다. 빛이 그의 입에서 말씀하셨고, 그의 음성이 생명을 낳았을 때, 그는 그들에게 생각, 이해, 긍휼, 구원, 그리고 아버지의 무한함과 달콤함에서 온 능력의 영을 주셨습니다.


    그는 형벌과 채찍질을 멈추게 하셨습니다. 그것들이 자비가 필요한 자들을 미혹 안으로, 그리고 포로 상태 안으로 이끌고 있었기 때문입니다. 그는 그것들을 지식으로 해체하시고 혼란에 빠뜨리셨습니다.


    그래서 그는

    - 방황하던 이들에게는 길,

    - 무지한 이들에게는 지식,

    - 찾고 있던 이들에게는 발견,

    - 흔들리던 이들에게는 힘,

    - 더럽혀진 이들에게는 순수함이 되셨습니다.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그가 밖으로 말해 내셨다’라는 전승적 대안이 있으나, 여기서는 본문 흐름에 따라 ‘그가 드러나셨을 때’로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ⲁⲣⲁϥ / ⲁϥⲉⲓ
  english_pob_choice: When he was revealed / he came
  chosen_korean: 그가 드러나셨을 때 / 오셨고
  alternatives_korean:
  - 그가 나타나셨을 때 / 오셨고
  - 그가 계시되셨을 때 / 오셨고
  lexicon: Crum; Coptic narrative usage
  rationale: 문맥상 단순 출현이 아니라 드러남·계시의 성격이 강하므로 ‘드러나셨을 때’로 옮기고, 뒤의 동작은 자연스러운 서술로 ‘오셨고’라고 처리했습니다.
- source_word: ⲁⲧⲧⲉⲕⲟ
  english_pob_choice: incorruptibility
  chosen_korean: 썩지 않음
  alternatives_korean:
  - 썩지 않음의 특성
  - 부패하지 않음
  lexicon: Crum; contextual theological usage
  rationale: POB의 ‘incorruptibility’를 한국어로 너무 추상화하지 않고, 의미를 분명히 드러내는 ‘썩지 않음’으로 옮겼습니다.
- source_word: ⲡⲉⲧϩⲙⲫⲏⲧ
  english_pob_choice: what is in the Father’s heart
  chosen_korean: 아버지의 마음에 있는 것
  alternatives_korean:
  - 아버지의 심중에 있는 것
  - 아버지의 마음속에 있는 것
  lexicon: Crum (ⲫⲏⲧ ‘heart’)
  rationale: 관용적이면서도 원문의 구체성을 살리기 위해 ‘마음에 있는 것’으로 옮겼습니다.
- source_word: ⲡⲛⲁ
  english_pob_choice: Spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 바람
  lexicon: Crum; POB default
  rationale: 이 대목은 주어진 은사의 목록 속 항목이므로, 신적 영을 가리키지만 과도한 교회식 고정어보다 원문 긴장을 살리는 ‘영’을 기본으로 하되 문맥상 ‘능력의 영’으로 구체화했습니다.
- source_word: ⲕⲟⲗⲁⲥⲓⲥ / ⲙⲁⲥⲧⲓⲅⲝ
  english_pob_choice: punishments and scourges
  chosen_korean: 형벌과 채찍질
  alternatives_korean:
  - 벌과 매질
  - 형벌과 매
  lexicon: BDAG; Coptic loanwords
  rationale: 두 단어의 병렬과 강한 징벌 이미지를 살리기 위해 ‘형벌과 채찍질’로 옮겼습니다.
theological_decisions:
- issue: ‘Error’와 ‘captivity’의 실체화
  chosen_reading: 사람들을 미혹 안으로, 그리고 포로 상태 안으로 이끄는 객관적 억압의 상태로 이해했습니다.
  alternative_readings:
  - 단순한 착오와 억압의 은유로 이해
  - 심리적 혼란으로 축소
  rationale: 영문 POB와 문맥상 이 둘은 단순 추상 명사가 아니라 구원에 қарсы되는 작동하는 상태이므로, 한국어에서도 힘을 유지했습니다.
  doctrine_reference: Gospel of Truth의 구원론적 이원구조
- issue: ‘Spirit of power’의 구조
  chosen_reading: ‘능력의 영’으로 번역해 영의 정체성과 수여된 능력을 함께 드러냈습니다.
  alternative_readings:
  - ‘힘의 영’
  - ‘권능의 영’
  rationale: 목록의 다른 은사들과 평행을 이루면서도, 원문의 수여 구조를 너무 해석적으로 풀지 않는 표현으로 판단했습니다.
  doctrine_reference: Coptic genitive of quality; POB rendering
