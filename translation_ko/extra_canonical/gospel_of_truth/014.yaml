    text: Or 'He can be seen; the name, however, is invisible, for it is not out of words and naming that his name is, but it is an invisible one.'.
    reason: previous_rendering
  - marker: b
    text: Or 'before them'.
    reason: previous_rendering
  - marker: c
    text: Or 'he revealed his things'.
