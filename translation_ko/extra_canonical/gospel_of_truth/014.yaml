translation:
  language: ko
  text: '아버지의 이름은 아들입니다. 그는 자신에게서 나왔으며 자신이기도 한 이에게 먼저 이름을 주시고, 그를 아들로 낳으셨습니다. 그는 그에게 자기의 이름을 주셨습니다. 아버지 주위에 있는 모든 것은 그의 것입니다. 이름도 그의 것이고 아들도 그의 것입니다. 그는 보일 수 있으나, 이름은 보이지 않습니다. 이름만이 보이지 않는 것의 신비이며, 그분에 의해 그것으로 완전히 채워진 귀에 이르기 때문입니다. 참으로 아버지의 이름은 말해지는 것이 아니라 아들을 통하여 드러납니다.


    이처럼 이름은 큽니다. 그러므로 그 큰 이름을 그분에게 붙여 부를 수 있는 이는 누구이겠습니까? 이름이 속한 그분과 이름의 자녀들, 곧 아버지의 이름이 그들 안에 머물고 그들 또한 차례로 그의 이름 안에 머무는 이들 외에는 아무도 없습니다. 아버지는 나지 않으셨으므로, 아이온들을 내시기 전에 자신을 위하여 그를 이름으로 낳으신 분은 그분 홀로이십니다. 이는 아버지의 이름이 그들의 머리 위에 주님으로 있도록 하려는 것이며, 곧 완전한 권능 가운데 그의 명령으로 확증된 참된 이름입니다. 그의 이름은 말과 명명에서 나온 것이 아니라 보이지 않는 것입니다. 그는 존재하는 그 한 분에게만 이름을 주셨습니다. 존재하지 않는 이는 이름을 받을 수 없기 때문입니다. 존재하지 않는 이에게 무슨 이름을 주겠습니까? 그러나 존재하는 이는 자기의 이름과 함께 존재하며, 그분만이 그것을 아십니다. 그리고 그분은 오직 그 한 분에게만 이름을 주셨습니다.


    이분이 아버지이시며, 그의 이름은 아들입니다. 그는 그것을 자기 안에 감추지 않으셨습니다. 오히려 그것은 존재했습니다. 아들만이 이름을 주셨습니다. 그러므로 이름은 아버지에게 속합니다. 아버지의 이름은 사랑하는 아들입니다. 참으로 그가 아버지 외에 어디에서 이름을 찾겠습니까?


    그러나 틀림없이 누군가는 이웃에게 이렇게 물을 것입니다. “그보다 먼저 존재했던 이에게 누가 이름을 주겠습니까?” 마치 자손들이 자신을 낳은 이들에게서 이름을 받지 않는 것처럼 말입니다. 그러므로 먼저 이름이 무엇인지를 생각하는 것이 마땅합니다. 그것은 참된 이름, 아버지에게서 온 이름이며, 고유한 이름입니다. 그는 다른 이들이 각자 생겨나는 방식에 따라 이름을 빌려 받는 것처럼 이름을 받지 않으셨습니다. 이것이 고유한 이름입니다. 그에게 그것을 준 다른 이는 아무도 없습니다. 오히려 그는 이름 붙일 수 없고, 말로 다 할 수 없으며, 묘사할 수 없습니다. 완전하신 분이 오직 그분에 관하여 말씀하실 때까지 그러합니다. 그분은 그의 이름을 말하고 그를 볼 권능을 지니셨습니다.


    그분께서 자신의 사랑하는 이름이 아들이 되는 것을 기뻐하시고, 깊음에서 나온 이에게 이름을 주셨을 때, 그분은 자신의 비밀들을 드러내셨습니다. 아버지께서 시기하지 않으심을 아셨기 때문입니다. 이 때문에 그분은 그를 내보내셔서, 그가 그 장소와 자신이 나온 안식처에 관하여 말하고, 플레로마와 그의 이름의 위대함과 아버지의 감미로움을 찬양하게 하셨습니다.'
