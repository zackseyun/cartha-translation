  english_pob_choice: terror / disturbance / instability / division / doubt
  chosen_korean: 두려움 / 동요 / 불안정 / 분열 / 의심
  alternatives_korean:
  - 공포 / 혼란 / 불안정 / 분열 / 의문
  - 경외 / 혼란 / 흔들림 / 분열 / 의심
  lexicon: Crum
  rationale: 심리·인식 상태들의 연쇄를 한국어에서도 병렬로 유지했습니다. ‘terror’는 여기서 과도하게 극적인 ‘공포’보다 ‘두려움’이 자연스럽지만, 문맥상 강도를 유지합니다.
- source_word: ⲙⲙⲛⲧⲁ
  english_pob_choice: vain nothingness
  chosen_korean: 헛된 무(無)
  alternatives_korean:
  - 헛됨과 무
  - 공허한 무(無)
  lexicon: Crum
  rationale: POB의 ‘vain nothingness’는 단순한 공허가 아니라 존재론적 부정과 헛됨을 함께 품으므로, ‘무(無)’를 본문에 살리고 ‘헛된’으로 수식했습니다.
- source_word: ⲙⲛⲧⲁⲧⲥⲁⲩⲛⲉ
  english_pob_choice: ignorance
  chosen_korean: 무지
  alternatives_korean:
  - 알지 못함
  - 무인식
  lexicon: Crum; Thomassen
  rationale: 이 작품의 핵심 대립항이므로 신학적으로도 통용되는 ‘무지’를 유지했습니다. ‘알지 못함’은 설명적이지만 표제적 개념어로는 덜 적합합니다.
- source_word: ⲡⲓⲡⲛⲁ
  english_pob_choice: the Spirit
  chosen_korean: 영
  alternatives_korean:
  - 성령
  - 숨
  lexicon: Crum
  rationale: 원문에는 ‘holy’가 없으므로 기본적으로 ‘영’으로 두어, 뒤에서 살리고 가르치며 일으키는 인격적 행위를 보이게 했습니다.
- source_word: ⲧⲛⲉ / ϫⲓⲧ
  english_pob_choice: taste / grasp
  chosen_korean: 맛보고 / 붙잡게 하셨습니다
  alternatives_korean:
  - 맛보게 하고 / 파악하게 하셨습니다
  - 음미하고 / 이해하게 하셨습니다
  lexicon: Crum
  rationale: 지각 동사들의 연쇄를 보존하기 위해 감각적 ‘맛보다’와 촉각적 ‘붙잡다’를 유지했습니다. ‘그를’은 바로 앞 문맥의 아들에 대한 지시를 따른 것입니다.
theological_decisions:
- issue: ‘the Spirit’의 표기
  chosen_reading: 본문에서는 ‘영’으로 번역하되, 문맥상 인격적으로 살리고 세우며 가르치는 하나님의 영으로 이해합니다.
  alternative_readings:
  - 성령
  - 숨
  rationale: 원문 Coptic은 ‘holy’를 명시하지 않으므로 ‘성령’으로 보강하지 않았습니다. 동시에 단순한 비인격적 ‘숨’으로 축소하지 않기 위해 ‘영’을 택했습니다.
  doctrine_reference: 성령론 일반; 본문 문맥상 인격적 행위
- issue: ‘Good is the one who returns and awakens!’의 평가어
  chosen_reading: ‘선합니다’로 옮겨, Coptic의 ‘good’와 이어지는 ‘복됩니다’의 다른 어휘를 구분했습니다.
  alternative_readings:
  - 복됩니다
  - 좋습니다
  rationale: 영어 POB의 수정 이력을 따라, 첫 절은 ‘good’, 둘째 절은 ‘blessed’의 차이를 한국어에서도 분리해야 합니다. ‘좋습니다’보다 서술적 평가인 ‘선합니다’가 더 문학적이고 문맥에 맞습니다.
  doctrine_reference: 문장 어휘 구별; 축복 공식
