  issues:
  - severity: medium
    issue: 첫 문장에서 ‘themselves’에 해당하는 재귀적 대상을 누락했습니다.
    rationale: 원문은 그들이 자기 자신을 밤의 그림자와 환영처럼 여기게 하려 했다는 내용입니다. ‘자기 자신들에 관하여’를 보충해야 합니다.
  - severity: medium
    issue: 빛이 비칠 때의 결과를 ‘드러납니다’로만 옮겨, 그들이 그것이 무라고 ‘안다’는 원문의 인식 행위를 누락했습니다.
    rationale: 원문의 핵심은 빛에 의해 공포의 비실재성을 깨닫는 데 있으므로 ‘그들은 … 압니다’를 명시하는 편이 충실합니다.
  - severity: medium
    issue: ‘많은 헛된 환영들’과 ‘헛된 무’의 병렬 구조가 한국어 문장 안에서 성립하지 않습니다.
    rationale: 두 항목 모두 그들 가운데 작용한 것으로 연결하여 열거의 의미와 문법을 회복해야 합니다.
  - severity: low
