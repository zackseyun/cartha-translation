review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 첫 문장의 재귀적 대상(‘자기 자신들에 관하여’)과 빛을 받은 이들이 ‘그것이 아무것도 아님을 안다’는 인식 동사가 초안에서 약화·누락되었습니다. 또한 ‘헛된 무’가 병렬 명사구로 자연스럽게 연결되지 않아 원문의 열거 구조가 불분명합니다.
