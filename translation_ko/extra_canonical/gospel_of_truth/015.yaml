theological_decisions:
- issue: Father’s glory and the negative series about him
  chosen_reading: 아버지의 영광을 깎아내리지도 않았고, 그분을 작다고도, 거칠다고도, 분노하신 분이라고도 여기지 않았습니다.
  alternative_readings:
  - 아버지의 영광을 원하지도 않았고, 그분을 작거나 거칠거나 분노하신 분으로 보지도 않았습니다
  - 아버지의 영광을 손상하지도 않았고, 그분을 작은 분으로도, कठ한 분으로도, 분노한 분으로도 여기지 않았습니다
  rationale: 원문은 아버지를 왜곡해서 낮추는 세 가지 인식을 부정하며, 그 뒤의 긍정적 묘사(악 없음, 동요 없음, 달콤함)와 대조를 이룹니다.
  doctrine_reference: Coptic source text; POB applied revision on ϣⲱⲱⲧ
- issue: Rest in the Spirit and the soul
  chosen_reading: 영 안에서 새롭게 되어 쉽니다 … 자기 영혼에 손실을 입지 않을 것입니다.
  alternative_readings:
  - 성령 안에서 쉬며 … 자기 혼을 잃지 않을 것입니다
  - 영 안에서 쉬며 … 자기 생명에 손실을 입지 않을 것입니다
  rationale: 이 문맥의 πνεῦμα는 명시적으로 신적 영을 가리키는 표지가 없으므로 ‘성령’으로 단정하지 않고 ‘영’으로 두었습니다. 또한 ψυχή는 일반적으로 ‘영혼’으로 옮겨, 손실/보존의 대조를 살렸습니다.
  doctrine_reference: POB glossary on πνεῦμα and ψυχή; source context
