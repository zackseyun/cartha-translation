theological_decisions:
- issue: 타락한 천사들의 정체를 어떻게 표현할지
  chosen_reading: ‘유혹한 천사들’로 능동적 책임을 드러냈습니다.
  alternative_readings:
  - ‘유혹을 받은 천사들’
  - ‘미혹된 천사들’
  rationale: 원문 상대절은 천사들을 유혹의 행위자들로 묘사하므로, 에녹서의 반역한 천사 전승을 흐리지 않도록 능동 표현을 유지했습니다.
  doctrine_reference: 에녹서 고유의 천사 타락 전승을 보존하고, 후대의 악령론으로 평준화하지 않습니다.
