base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
  footnotes:
  - marker: a
    text: Traditional English 'brimstone' is a possible rendering for the sulfur term here.
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez of this verse is difficult in places; 'it was joined with those waters' may also be understood as 'it mixed with those waters.'
    reason: alternative_reading
  - marker: c
    text: Or 'And all this happened from that fiery stream, and in that place there was produced a smell of sulfur'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 모든 일이 일어났을 때, 그 불의 흐름과 그곳에서 일어난 그들의 격동으로 말미암아 유황 냄새가 생겨나 그 물들과 결합되었으며, 그릇된 길로 이끈 천사들의 그 골짜기는 그 땅 아래에서 불타고 있습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘유황’은 전통적인 영어 성경 번역에서 ‘브림스톤’(brimstone)으로도 옮깁니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 물들과 결합되었다’는 ‘그 물들과 섞였다’로도 이해할 수 있습니다. 이 구절의 게에즈어는 일부 표현에서 해석이 어렵습니다.
    reason: alternative_reading
  - marker: c
    text: '또는: “그 모든 일이 그 불의 흐름으로 말미암아 일어났고, 그곳에서 유황 냄새가 생겨났습니다.”'
    reason: previous_rendering
