  source_fidelity: 본문은 시간 접속사와 ‘그들의 격동’을 번역하여 이전에 지적된 누락을 피하고 있습니다. 그러나 ነጠብጣብ እሳት은 ‘불 같은’(불과 유사한)보다 ‘불의 흐름’이 원문의 불 자체가 흐르는 표상을 더 정확히 보존합니다. 또한 ‘유혹한’은 አስሐቱ의 ‘그릇된 길로 이끌다/미혹하다’보다 성적 유혹으로 좁혀 들릴 수 있으므로 수정이 안전합니다. 결합 동사는 ‘섞이다’보다 ‘결합되다’로 옮겨 물리적 혼합인지의 여지를 보존했습니다.
  naturalness: 수정문은 현대 표준 한국어 합쇼체를 유지하며, 긴 원문 문장의 인과 관계와 최종 절의 현재적 지속성을 자연스럽게 드러냅니다. ‘그곳의 그들의 격동’은 소유 관계가 다소 어색하므로 ‘그곳에서 일어난 그들의 격동’으로 명료하게 했습니다.
  terminology: ‘천사’, ‘유황’, ‘골짜기’, ‘땅 아래’는 적절합니다. ‘그릇된 길로 이끈 천사들’은 원문의 능동성을 유지하면서 ‘유혹’보다 넓은 의미를 보존합니다. 초안의 lexical_decisions에서 ሀውኮሙ를 ‘유황 냄새’로 배정한 것은 본문 및 제공된 감사 기록과 불일치하며, 이 낱말은 여기서 ‘그들의 격동/동요’에 해당합니다.
