base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
  footnotes:
  - marker: a
    text: The term rendered 'indulgence' is uncertain in this Ge'ez-only section. It may also suggest pleasure, wantonness, or possibly deception associated with their flesh.
    reason: lexical_alternative
translation:
  language: ko
  text: 그들에게 심판이 임할 것입니다. 이는 그들이 자기 육체의 방종[a]을 신뢰하고 주님의 영을 부인하기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 어휘는 뜻이 분명하지 않아 ‘방종’으로 옮겼지만, ‘쾌락’, ‘음란함’, ‘기만’ 같은 뉘앙스도 가능합니다.
    reason: lexical_alternative
