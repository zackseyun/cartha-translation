  rationale: POB가 밝힌 어휘 불확실성을 반영해, 성적 쾌락으로 과도하게 좁히지 않으면서도 육체적 자기방임의 의미를 드러내는 ‘방종’을 택했습니다.
- source_word: ወመንፈሰ እግዚአ
  english_pob_choice: and deny the Spirit of the Lord
  chosen_korean: 주님의 영
  alternatives_korean:
  - 주님의 성령
  - 주님의 호흡
  - 주님의 기운
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 ‘주님의 영’을 말하므로, 여기서는 후대 교리문구를 덧씌우기보다 직접적인 ‘영’을 유지했습니다. POB의 대문자화 의도는 한국어에서 어휘 선택으로 반영합니다.
theological_decisions:
- issue: ‘the Spirit of the Lord’의 범위
  chosen_reading: 주님께 속한 영, 곧 그들이 부인하는 신적 영을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 그들의 본래 영성
  - 주님께서 주신 인간의 영
  - 성령
  rationale: 원문은 인간 내면만을 가리킨다고 단정하기보다, 주님과 관련된 영을 부인하는 대조를 형성합니다. 따라서 후대 교리 용어로 평탄화하지 않고 긴장을 남겨 두었습니다.
  doctrine_reference: 원문이 허용하는 범위 안에서 의미를 보존하고, 후대 신학 체계를 과잉투사하지 않음
