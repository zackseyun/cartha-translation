theological_decisions:
- issue: 불모/결실의 난해한 부정구 처리
  chosen_reading: ‘불모가 없을 것이나’로 옮겨, 씨의 지속과 번성이라는 문맥이 드러나도록 했습니다.
  alternative_readings:
  - ‘그들은 마른 땅 위에서 의논하지 않을 것입니다’
  - ‘마른 땅 위에서 계획하지 않을 것입니다’
  rationale: 게으즈 본문의 문제 있는 동사를 그대로 음영 처리하기보다, POB가 채택한 문맥상 유력한 불모/결실 대조를 한국어 본문에 반영하는 편이 더 투명합니다.
  doctrine_reference: source-text priority and contextual emendation transparency
- issue: ‘주’의 표현
  chosen_reading: ‘주님의 이름으로’로 옮겼습니다.
  alternative_readings:
  - ‘주의 이름으로’
  - ‘여호와의 이름으로’
  rationale: 기본 주님 호칭을 사용하되, 본문이 가리키는 하나님의 이름-권위의 구문을 자연스럽게 살렸습니다.
  doctrine_reference: respecting divine-name register without over-specifying
