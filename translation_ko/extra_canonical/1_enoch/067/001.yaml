base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/001.yaml
  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
  footnotes:
  - marker: a
    text: Or 'your lot has ascended before me.' The Ge'ez keeps the imagery of upward movement into the divine presence.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'without blame' may also be translated 'blameless' or 'without reproach.' Because the Parables are effectively preserved only in Ge'ez here, the nuance should be held with some caution.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날들에 주님의 말씀이 내게 임했습니다. 주님께서 내게 말씀하셨습니다. “노아야, 네 몫이 내 앞에 올라왔습니다[a]—흠 없는 몫[b], 사랑과 올바름의 몫입니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 몫이 내게 올라왔습니다.” 게에즈어는 하나님께로 올라가는 상향의 이미지를 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 “책망할 데 없는”, “흠잡을 데 없는”. 이 구절은 강한 칭찬을 담지만, 이 대목은 게에즈어로 보존되어 있으므로 그 뉘앙스는 신중히 이해해야 합니다.
    reason: lexical_alternative
