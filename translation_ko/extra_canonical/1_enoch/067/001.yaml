theological_decisions:
- issue: ‘노아의 몫’에 담긴 배당/지위/평가의 중의성
  chosen_reading: “네 몫이 내 앞에 올라왔습니다”로 번역해 할당된 몫과 하나님 앞에 드러난 평가를 함께 남겼습니다.
  alternative_readings:
  - “네 분깃이 내 앞에 올라왔습니다”
  - “네 몫이 내게 올라왔습니다”
  rationale: 원문은 단순 소유가 아니라 하나님 앞에 제시된 할당된 몫을 말하므로, 의미를 한쪽으로 확정하지 않고 중의성을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘흠이 없는’의 강도
  chosen_reading: 노아를 절대적 무죄 상태로 단정하지 않고, 책망/결함이 없는 긍정적 평가로 옮겼습니다.
  alternative_readings:
  - 흠 없는
  - 책망할 데 없는
  - 흠잡을 데 없는
  rationale: 원문과 POB 주석이 허용하는 범위 안에서, 칭찬의 강도는 유지하되 죄 없음을 교리적으로 과잉 확정하지 않기 위함입니다.
  doctrine_reference: Original-language primacy over translation tradition; preserve local sense.
