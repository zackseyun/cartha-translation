  - 소동
  - 혼란
  - 격변
  rationale: 문맥은 환상 속 심판 장면이므로, 자연 현상이 뒤틀리는 강도를 약화시키지 않는 표현이 필요합니다. 반복 구조도 유지해 원문의 강조를 드러냈습니다.
  doctrine_reference: Apocalyptic imagery should remain concrete and severe; do not flatten cosmic disturbance into generic unrest.
