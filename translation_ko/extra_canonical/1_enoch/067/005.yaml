translation:
  language: ko
  text: 그리고 나는 그 골짜기를 보았습니다. 그곳에는 큰 격동과 물들의 격동이 있었습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘큰 격변과 물들의 격변’. 반복된 게에즈어 표현은 골짜기 안의 격렬한 흔들림을 강조하며, 뉘앙스는 혼란에서 격변까지 넓을 수 있습니다.
    reason: lexical_alternative
