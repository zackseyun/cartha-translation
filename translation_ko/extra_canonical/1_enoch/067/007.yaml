base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/007.yaml
  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
  footnotes:
  - marker: a
    text: Or 'streams of fire.' The Ge'ez image is of flowing channels of fire issuing from the fiery heat.
    reason: lexical_alternative
  - marker: b
    text: Literally 'those who dwell upon the dry land.' This may simply mean human inhabitants of the earth, but the more concrete wording has been retained.
    reason: lexical_alternative
  - marker: c
    text: Or 'And in proportion to the heat of that fire, rivers of fire came forth,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 골짜기들 사이로 불의 강들이 흐르며,[b] 그곳에서 마른 땅 위에 사는 자들을 그릇된 길로 이끈 그 천사들이 심판을 받게 됩니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마른 땅 위에 사는 자들’입니다. 이는 일반적으로 땅의 주민을 가리킬 수 있지만, 본문은 구체적인 지형 표현을 사용합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘불의 강들’은 복수의 불타는 물줄기 또는 강을 가리킵니다. ‘강들’은 원문의 복수형과 흐르는 형상을 살린 번역입니다.
    reason: lexical_alternative
