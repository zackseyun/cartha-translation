theological_decisions:
- issue: 심판받는 천사들의 신원
  chosen_reading: '본문은 단지 땅 위에 사는 자들을 잘못 이끈 천사들이 심판받는다고 말하며, 특정 전승명(예: 감시자들)을 본문 안에 덧붙이지 않았습니다.'
  alternative_readings:
  - 감시자 전승의 천사들로 구체화할 수 있음
  - 초월적 존재 일반으로 더 넓게 읽을 수 있음
  rationale: 에녹서의 현재 문맥과 Ge'ez 본문에 충실하게, 독자가 본문 밖 전승을 자동으로 끌어오지 않도록 신원 규정을 최소화했습니다.
  doctrine_reference: 본문 고유의 표지를 넘어서지 않기
