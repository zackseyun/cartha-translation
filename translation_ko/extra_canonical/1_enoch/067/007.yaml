  naturalness: ‘그 골짜기들 사이로 불의 강들이 흐르며’는 현대 표준 한국어 합쇼체에서 자연스럽고, 불의 강들이 골짜기를 따라 흐르는 환상적 이미지를 유지합니다. ‘그릇된 길로 이끈’은 사역적 ‘lead astray’를 자연스럽게 드러냅니다.
  terminology: ‘불의 강들’, ‘천사들’, ‘심판을 받게 됩니다’는 적절합니다. ‘마른 땅 위에 사는 자들’을 본문에 유지하여 የብስ의 구체성을 보존해야 합니다. 현행 b 각주의 ‘뜨거운 열기’ 설명은 현 본문 및 이 구절의 지형어 해석과 맞지 않으므로 삭제·교체해야 합니다.
