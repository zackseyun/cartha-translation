  rationale: 에녹서의 현재 문맥과 Ge'ez 본문에 충실하게, 독자가 본문 밖 전승을 자동으로 끌어오지 않도록 신원 규정을 최소화했습니다.
  doctrine_reference: 본문 고유의 표지를 넘어서지 않기
