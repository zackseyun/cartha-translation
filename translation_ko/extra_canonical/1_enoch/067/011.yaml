  source_fidelity: 본문의 핵심 구조, 곧 물들의 변화, 천사들이 ‘그 물들 가운데서’ 심판받음, 샘들의 변화, 천사들의 올라감과 물이 차가워짐의 연계는 대체로 충실히 옮겼습니다. 그러나 강조사 ኪያሁ는 ‘그 물들은’만으로는 충분히 드러나지 않으므로 ‘물들 자체가’로 옮기는 것이 적절합니다. 또한 ‘이 물의 샘들’은 한국어 소유·수식 관계가 어색하므로 ‘이 물의 샘들’보다 ‘이 샘들’ 또는 ‘이 물 샘들’이 자연스럽습니다.
  naturalness: 합쇼체는 일관되지만, ‘그 이유는 … 때문입니다’는 원문의 연결을 다소 무겁고 설명적으로 만듭니다. 한 문장 안에서 ‘이는 … 때문입니다’로 연결하면 현대 한국어 문장으로 더 자연스럽습니다. ‘샘들의 물도’의 ‘도’는 원문에 없는 첨가이므로 제거하는 편이 좋습니다.
  terminology: ‘심판을 받다’, ‘천사들’, ‘샘’, ‘변화되다’, ‘차가워지다’는 문맥과 격식에 적합합니다. ‘올라갈 때’는 የዐርጉ의 문자적 상향 운동을 보존하며, 그 장면을 과도하게 해석하지 않습니다.
  issues:
