base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
  footnotes:
  - marker: a
    text: The Ge'ez wording is difficult in the middle of the verse. The phrase rendered 'the heat of those springs of water' may more literally refer to the hot condition of the water-springs; the sense is inferred from the closing statement that they 'grow cold.'
    reason: lexical_alternative
  - marker: b
    text: The clause 'when the angels ascend' is retained literally. In context it may refer to the judged angels coming up in relation to the springs or fiery waters, but the exact picture is uncertain in the Ethiopic witness.
    reason: alternative_reading
  - marker: c
    text: Or 'for when those angels are judged, the heat of those springs of water will be changed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들에 물들 자체가 변화될 것입니다. 이는 그 천사들이 그 물들 가운데서 심판을 받을 때 이 샘들이 변화될 것이며, 그 천사들이 올라갈 때[a] 그 샘들의 물이 변화되어 차가워질 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘천사들이 올라갈 때’는 문자적으로 옮긴 것입니다. 에티오피아어 본문은 이 올라감이 샘들이나 물과 어떤 관계에 있는지를 더 자세히 설명하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ኪያሁ / ተውላጠ
  english_pob_choice: the waters themselves will be changed
  chosen_korean: 그 물들은 … 변화될 것입니다
  alternatives_korean:
  - 그 물 자체가 바뀔 것입니다
  - 그 물들이 변하게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어인 ‘물들’을 앞세우고, 자기지시적 강조를 살려 ‘그 물들’로 옮겼습니다. ተውላጠ의 상태 변화 의미는 ‘변화될 것입니다’로 자연스럽게 표현했습니다.
- source_word: በውእቱ፡ ማያት
  english_pob_choice: in those waters
  chosen_korean: 그 물들 가운데서
  alternatives_korean:
  - 그 물들 속에서
  - 그 물들 안에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판의 장소를 나타내는 전치사구를 유지하기 위해 ‘가운데서’로 옮겼습니다. 공간적 내포를 드러내면서도 문맥상 자연스럽습니다.
- source_word: አንቅዐተ ማያት
  english_pob_choice: springs of water
  chosen_korean: 이 물의 샘들
  alternatives_korean:
  - 물 샘들
  - 물의 샘들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수형 이미지와 샘의 구체성을 살리기 위해 ‘샘들’로 옮겼습니다. 앞뒤 문맥의 반복을 고려해 ‘이 물의 샘들’로 다듬어 지시성을 반영했습니다.
- source_word: ይድይትዌለጡ / ይትዌለጥ
  english_pob_choice: will change
  chosen_korean: 변화될 것이며 / 변화되어
  alternatives_korean:
  - 바뀔 것이며 / 바뀌어
  - 변할 것이며 / 변하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동일한 변화 동사를 반복해 바뀌는 상태를 강조하므로, 두 번 모두 ‘변화-’ 계열로 맞추었습니다. 첫 항목은 미래형, 후속 항목은 결과 연결을 위해 ‘변화되어’로 처리했습니다.
- source_word: የዐርጉ
  english_pob_choice: ascend
  chosen_korean: 올라갈 때
  alternatives_korean:
  - 올라올 때
  - 상승할 때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상향 운동을 나타내는 기본 의미를 살리되 한국어 문맥에서는 ‘올라갈 때’가 가장 자연스럽습니다. 지나친 해석을 피하면서도 장면의 움직임을 유지합니다.
- source_word: ይቈርሩ
  english_pob_choice: grow cold
  chosen_korean: 차가워질 것이기 때문입니다
  alternatives_korean:
  - 식어질 것이기 때문입니다
  - 서늘해질 것이기 때문입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘grow cold’는 과정적 냉각을 뜻하므로 ‘차가워질’이 가장 직결됩니다. 앞의 변화와 대비되는 결과를 자연스러운 한국어로 드러냅니다.
theological_decisions:
- issue: 천사들의 심판과 물의 변화의 관계
  chosen_reading: 천사들이 그 물들 가운데서 심판을 받을 때 샘들이 변화한다는 연결을 그대로 유지했습니다.
  alternative_readings:
  - 천사들이 그 물에 의해 심판받는다는 뜻으로 더 해석할 수 있습니다
  - 물의 변화가 상징적으로만 표현된 것으로 볼 수 있습니다
  rationale: 본문은 심판의 장소와 물의 변화 사이를 연결하지만 그 메커니즘을 설명하지 않습니다. 따라서 해석을 체계화하지 않고, 본문이 제시하는 긴장을 그대로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 반복되는 변화 표현의 번역 방식
  chosen_reading: ‘변화될 것입니다 / 변화되어’로 반복을 살려 물의 상태 변화를 강조했습니다.
  alternative_readings:
  - ‘바뀔 것입니다 / 바뀌어’로 더 평이하게 옮길 수 있습니다
  - ‘변하게 될 것입니다’로 중립적으로 옮길 수 있습니다
  rationale: 원문의 반복은 단순한 문장 장식이 아니라 같은 변화 모티프를 강화합니다. 한국어에서도 동일 어근을 반복해 장면의 일관성과 압박감을 유지했습니다.
  doctrine_reference: Maintain repeated source imagery and progression.
