base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
  footnotes:
  - marker: a
    text: The Ethiopic line is difficult. The clause rendered 'so a change comes upon them forever and ever in spirit' may also be understood more literally as 'thus there is for them a change of spirit forever and ever.'
    reason: alternative_reading
  - marker: b
    text: Or 'there is none before the Lord of Spirits who can utter a matter against them.' The wording has a judicial or adversarial flavor.
    reason: lexical_alternative
  - marker: c
    text: Or 'who can speak a word against them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들의 몸이 몹시 타듯이, 그들에게는 영 안에서 영원토록 변화가 임합니다. 이는 영들의 주 앞에는 헛된 말을 하는 이가 하나도 없기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈 본문은 난해합니다. ‘그들에게는 영 안에서 영원토록 변화가 임합니다’는 더 문자적으로 ‘그들에게는 영의 변화가 영원토록 있다’로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ / burning
  english_pob_choice: burning
  chosen_korean: 타는 고통
  alternatives_korean:
  - 불타는 것
  - 불탐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판의 문맥에서 단순한 ‘열기’보다 실제적이고 구체적인 불의 형벌 이미지를 드러내는 표현이어서 ‘타는 고통’으로 옮겼습니다.
- source_word: ሥጋሆሙ / their bodies
  english_pob_choice: their bodies
  chosen_korean: 그들의 몸
  alternatives_korean:
  - 그들의 육체
  - 그들의 살
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 ‘살’도 가능하지만, 현대 한국어에서는 신체적 실체를 분명하게 드러내는 ‘몸’이 더 자연스럽고 명료합니다.
- source_word: ተውላጠ / a change comes upon
  english_pob_choice: a change comes upon
  chosen_korean: 변화가 임합니다
  alternatives_korean:
  - 변화가 일어납니다
  - 그들이 바뀝니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동·결과적 뉘앙스를 살리기 위해 행위 주체를 전면에 내세우지 않고, ‘임합니다’로 변화가 그들에게 닥치는 느낌을 보존했습니다.
- source_word: ለመንፈስ / in spirit
  english_pob_choice: in spirit
  chosen_korean: 영 안에서
  alternatives_korean:
  - 영으로
  - 영에 있어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 변화가 일어나는 영역을 표시하는 표현으로 이해하여, 육체의 타는 고통과 대비되는 차원을 분명히 하는 ‘영 안에서’로 옮겼습니다.
- source_word: እግዚአ መንፈሳት / the Lord of Spirits
  english_pob_choice: the Lord of Spirits
  chosen_korean: 영들의 주
  alternatives_korean:
  - 영들의 주님
  - 영의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹 문헌의 고유한 신적 칭호를 살리면서도 한국어에서는 소유격형이 더 자연스러워 ‘영들의 주’로 옮겼습니다.
- source_word: ዘይነግር ነገረ በከ / speaks a vain word
  english_pob_choice: who speaks a vain word
  chosen_korean: 헛된 말을 하는 이
  alternatives_korean:
  - 공허한 말을 하는 이
  - 무익한 말을 하는 이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: adjudicator가 확정한 의미인 ‘vain/empty’에 따라 ‘헛된 말’로 옮겼고, משפט적 함의를 과도하게 좁히지 않기 위해 ‘하는 이’로 처리했습니다.
theological_decisions:
- issue: ‘영원무궁토록’의 시간 표현과 ‘영 안에서’의 결합
  chosen_reading: 몸의 타는 고통과 대비되는 차원에서, 변화는 ‘영 안에서’ 일어나며 그 지속은 ‘영원무궁토록’이라고 읽었습니다.
  alternative_readings:
  - ‘영원무궁토록’이 ‘변화’가 아니라 ‘영’에 걸리는 읽기
  - ‘영’이 성령을 가리킨다는 읽기
  rationale: 주어진 영어 POB와 게즈 문맥은 변화의 영역을 ‘영’으로 두되, 지속성은 끝없는 시기로 강조합니다. 본문은 여기서 성령을 직접 가리킨다고 단정할 근거가 약하므로 일반적 ‘영’으로 유지했습니다.
  doctrine_reference: 본문의 문법적 중의성을 보존하고, 불필요한 삼위일체적 명시화를 피함
