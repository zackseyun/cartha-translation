base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
  footnotes:
  - marker: a
    text: Or 'toward the west'; the word can also mean 'at evening,' but the surrounding place-markers favor a western location.
    reason: lexical_alternative
  - marker: b
    text: The metal named after iron is uncertain in this witness; possibilities include 'tin,' 'electrum,' or another refined/soft metal.
    reason: lexical_alternative
  - marker: c
    text: Or 'And they bound'.
    reason: previous_rendering
  - marker: d
    text: Or 'which had first been shown to me, Enoch,'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 저주를 나타낸 그 천사들을, 내 조부 에녹이 서쪽에서 내게 미리 보여 준 그 불타는 골짜기에서, 금과 은과 철과 연한 금속과 납의 산들 곁에 가두었습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የዐጽዎሙ
  english_pob_choice: they bound
  chosen_korean: 가두었습니다
  alternatives_korean:
  - 묶었습니다
  - 봉쇄했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 ‘묶다’보다 더 구체적으로 가두어 못 나오게 하는 제약을 뜻하므로, 심판 장면의 강한 구속감을 살려 ‘가두었습니다’로 옮겼습니다.
- source_word: እሙንቱ መላእክት
  english_pob_choice: those angels
  chosen_korean: 그 천사들
  alternatives_korean:
  - 그 메신저들
  - 그 사자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 문맥상 대상은 인간 사자가 아니라 천사적 존재들이므로, ‘그 천사들’이 가장 직접적입니다.
- source_word: እለ አርአይዋ ለዓመፃ
  english_pob_choice: who had shown lawlessness
  chosen_korean: 저주를 나타낸
  alternatives_korean:
  - 불법을 드러낸
  - 반역을 보인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈 동사의 핵심은 어떤 것을 ‘보여 주다/드러내다’는 뜻이어서, 도덕적·심판적 성격을 유지하면서도 한국어로 자연스럽게 ‘저주를 나타낸’으로 옮겼습니다.
- source_word: ቈላ እንተ ትነድድ
  english_pob_choice: burning valley
  chosen_korean: 불타는 골짜기
  alternatives_korean:
  - 타오르는 골짜기
  - 불붙은 골짜기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지속적으로 타는 지형적 이미지를 가장 자연스럽게 살리는 표현으로 ‘불타는 골짜기’를 선택했습니다.
- source_word: በዓረብ
  english_pob_choice: in the west
  chosen_korean: 서쪽에서
  alternatives_korean:
  - 서쪽으로
  - 저녁에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주변의 장소 표지가 이어지므로 시간 의미의 ‘저녁에’보다 방향 의미인 ‘서쪽에서’가 더 적합합니다.
- source_word: እምሔውየ ሄኖክ
  english_pob_choice: my grandfather Enoch
  chosen_korean: 내 조부 에녹
  alternatives_korean:
  - 내 할아버지 에녹
  - 나의 선조 에녹
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 발화 화자의 조상을 가리키므로, 보다 직접적인 친족 관계를 드러내는 ‘내 조부 에녹’으로 옮겼습니다.
theological_decisions:
- issue: ‘lawlessness’의 처리
  chosen_reading: 문맥상 심판 대상의 부정한 상태를 가리키는 표현으로 받아 ‘저주를 나타낸’으로 옮겼습니다.
  alternative_readings:
  - ‘불법을 드러낸’
  - ‘반역을 보인’
  rationale: 게으즈 원문은 단순한 행위 서술보다 ‘드러냄/나타냄’의 뉘앙스를 가지므로, 그 긴장을 유지하면서도 한국어 독자가 즉시 이해할 수 있게 심판적 결과를 포함한 표현을 택했습니다.
  doctrine_reference: 원어의 묘사적 긴장을 보존하고, 해석을 지나치게 평탄화하지 않습니다.
