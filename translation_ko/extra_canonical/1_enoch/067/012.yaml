base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
  footnotes:
  - marker: a
    text: Or 'a witness against the kings and the mighty.' The Ge'ez noun can mean either 'testimony' or 'witness' in a forensic sense.
    reason: lexical_alternative
  - marker: b
    text: Literally 'the dry land.' The phrase may denote the inhabited land under human rule rather than the earth in a fully cosmic sense.
    reason: lexical_alternative
translation:
  language: ko
  text: “이 심판은 천사들이 심판받는 심판이니, 왕들과 세력가들, 곧 땅을 차지한 자들에 대한 증언입니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세력가들’은 원문의 ‘the mighty’를 권력층으로 풀어낸 것입니다.
    reason: korean_style_note
  - marker: b
    text: ‘땅을 차지한 자들’은 문자적으로는 ‘마른 땅/육지’를 소유한 자들이라는 뜻으로, 인간 지배 아래 있는 땅을 가리킬 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ / ያውሥእ፡ ወይብል
  english_pob_choice: And I heard Michael answering and saying
  chosen_korean: “나는 미가엘이 대답하며 말하는 것을 들었습니다”
  alternatives_korean:
  - “나는 미가엘이 응답하며 말하는 것을 들었습니다”
  - “나는 미가엘이 대답하여 말하는 것을 들었습니다”
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 인칭 서술의 ‘들었습니다’로 청각 동사를 살리고, ‘대답하며 말하는’으로 Ge'ez의 관용적 쌍을 자연스럽게 옮겼습니다.
- source_word: ኵነኔ
  english_pob_choice: judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  - 정죄
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥이 종말론적 법정이므로 ‘심판’이 가장 넓고도 자연스럽게 판정 행위와 결과를 함께 담습니다.
- source_word: ሰማዕተ
  english_pob_choice: a testimony against
  chosen_korean: 증언입니다
  alternatives_korean:
  - 증거입니다
  - 증언이 됩니다
  - 증언으로 삼습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB가 지적한 대로 이 명사는 법정적 ‘증언/증거’ 의미를 가지며, 한국어에서는 ‘~에 대한 증언’으로 간결하게 처리하는 것이 가장 자연스럽습니다.
- source_word: ለነገሥት ወለዐዚዛን
  english_pob_choice: the kings and the mighty
  chosen_korean: 왕들과 세력가들
  alternatives_korean:
  - 왕들과 강한 자들
  - 왕들과 권세자들
  - 왕들과 힘센 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘the mighty’를 교회적 관용어로 굳히지 않고, 정치·사회적 권력을 가진 집단으로 드러나게 ‘세력가들’로 옮겼습니다.
- source_word: እለ ይእኅዝዋ ለየብስ
  english_pob_choice: those who possess the dry land
  chosen_korean: 곧 땅을 차지한 자들
  alternatives_korean:
  - 곧 마른 땅을 소유한 자들
  - 곧 땅을 소유한 자들
  - 곧 육지를 점유한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 각주처럼 የብስ는 우주적 ‘땅’보다 인간 지배 아래 있는 ‘육지/대지’를 가리킬 수 있으므로, 자연스러운 한국어이면서도 소유·지배의 뉘앙스를 살려 번역했습니다.
theological_decisions:
- issue: 이 심판의 주체와 대상 관계
  chosen_reading: 천사들이 심판받는 그 심판 자체가 왕들과 세력가들에 대한 증언이 됩니다.
  alternative_readings:
  - 천사들의 심판이 왕들과 세력가들을 향한 증언입니다.
  - 천사들은 왕들과 세력가들에게 증언합니다.
  rationale: 원문의 관계절은 ‘천사들이 심판받는 심판’을 먼저 말하고, 이어 그 심판이 누구를 향한 것인지 밝히므로, 법정적 긴장을 유지하는 쪽이 가장 충실합니다.
  doctrine_reference: 종말론적 심판의 공적 성격을 보존하고, 원문의 다의적 법정 언어를 평탄화하지 않습니다.
