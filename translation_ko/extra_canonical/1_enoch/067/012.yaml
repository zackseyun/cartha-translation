  rationale: 원문의 관계절은 ‘천사들이 심판받는 심판’을 먼저 말하고, 이어 그 심판이 누구를 향한 것인지 밝히므로, 법정적 긴장을 유지하는 쪽이 가장 충실합니다.
  doctrine_reference: 종말론적 심판의 공적 성격을 보존하고, 원문의 다의적 법정 언어를 평탄화하지 않습니다.
