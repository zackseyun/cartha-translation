review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 제공된 게으즈어 발췌는 페이지 경계에서 잘린 것으로 보이지만, 감사 이력에 보존된 후속 게으즈어 본문과 영어 POB 본문은 67:13 전체가 ‘심판의 물들’이라는 구문 뒤에 계속됨을 일관되게 보여 줍니다. 현 초안은 그 첫 구절만 독립문으로 처리하여 절의 나머지 내용을 누락합니다.
  naturalness: ‘이것들은 심판의 물들입니다’는 문법적으로 가능하나, 전체 절에서는 주어를 독립문으로 끝내지 말고 ‘이 심판의 물들은 … 위한 것입니다’로 이어야 합니다. ‘육체의 욕망’은 원문의 반복과 긴장을 보존하면서도 현대 표준 한국어로 이해 가능합니다.
  terminology: ‘심판’은 ኵነኔ의 사법적·종말론적 범위를 적절히 보존합니다. 복수 영상은 ‘물들’로 유지하되, 한국어에서 자연스럽게 관형 구조인 ‘심판의 물들’로 제시합니다. ‘영원히 타는 불’은 불이 되어 계속 타는 원문의 종말론적 표현을 과도하게 해석하지 않고 옮깁니다.
  issues:
  - severity: high
    issue: 절의 후반부가 누락되었습니다.
    rationale: 감사 이력과 영어 POB가 보존한 페이지 경계 뒤의 게으즈어 본문에는 왕들의 육체를 낫게 함, 육체의 욕망, 보지 못함과 믿지 않음, 물이 변하여 영원히 타는 불이 됨이 포함됩니다. 현 초안은 이 내용을 번역하지 않습니다.
  - severity: low
    issue: 현전 발췌만을 근거로 절 전체를 배제한다는 번역 방침입니다.
    rationale: 발췌 원문 자체의 불완전성은 이미 기록되어 있으며, 검증 이력은 해당 절의 후속 본문을 특정합니다. 따라서 확인된 보충 본문을 반영하는 편이 본문 충실성에 부합합니다.
  revised_text: 이 심판의 물들은[a] 왕들의 육체를 낫게 하고 그들의 육체의 욕망을 채우기 위한 것입니다. 이 때문에 그들은 보지 못하며, 그 물들이 변하여 영원히 타는 불이 되리라는 것을 믿지 않습니다.[b]
  revised_footnotes:
  - marker: a
    text: 또는 ‘이 심판의 물은’. 게으즈어를 집합적으로 이해할 경우 단수로 옮길 수 있으나, 여기서는 장면의 구체적 이미지를 보존하기 위해 복수 ‘물들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘이것들은 심판의 물들입니다’로 시작할 수 있습니다. 그러나 이 절에서는 이 구절이 뒤따르는 서술의 주어로 이어집니다.
    reason: previous_rendering
  revision_rationale: 페이지 경계에서 잘린 원문 발췌만을 독립된 완결문으로 번역하지 않고, 감사 이력에 보존된 해당 절의 후속 게으즈어 본문을 반영하여 67:13 전체를 복원했습니다. ‘심판’과 ‘물들’은 유지했으며, 왕들의 육체를 낫게 함과 육체의 욕망이라는 난해한 병렬은 교리적으로 조정하거나 완화하지 않고 그대로 옮겼습니다.
