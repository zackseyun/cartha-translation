  naturalness: ‘너희에게 화가 있도다’ is biblical-archaic rather than the requested modern formal-polite register. The repeated ‘너희에게’ and the phrase ‘너희에 대한 기억은 악합니다’ are also awkward. The revision uses modern formal-polite endings while retaining a solemn prophetic tone.
  terminology: ‘죄인들아,’ ‘바다 한가운데,’ and ‘마른 땅’ are suitable. ‘기억’ is retained as the most neutral Korean equivalent for the disputed remembrance/memorial term. ‘불리합니다’ supplies a natural Korean rendering of the adverse force in the difficult closing expression; the footnote records the unresolved alternatives.
  issues:
