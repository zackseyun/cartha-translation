  rationale: 소유 관계를 원문에 맞게 ‘너희의 기억’으로 바로잡고, 난해한 마지막 요소의 적대적·심판적 뉘앙스를 자연스러운 한국어 ‘너희에게 불리합니다’로 옮겼습니다. 이 해석적 선택은 본문 주석에서 대안들과 함께 명시하여 불확실성을 보존했습니다. 또한 요청된 현대 합쇼체에 맞추어 ‘있습니다’를 사용하고 각 주석 표지를 해당 구절에 배치했습니다.
