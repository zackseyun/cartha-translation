  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 ‘당신들에 대한 기억/기억됨’의 의미가 열려 있으므로, 영어 POB의 ‘memory’를 따라 가장 중립적인 ‘기억’으로 옮겨 의미의 긴장을 보존했습니다.
- source_word: እኩይ ዴቤክሙ
  english_pob_choice: evil against you
  chosen_korean: “너희에 대한 … 악합니다”
  alternatives_korean:
  - “너희에게 해롭습니다”
  - “너희를 거슬러 악합니다”
  - “너희에게 불길합니다”
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 마지막 구절은 문법적으로 난해하므로, 영문 주석이 제시하는 ‘너희에 대한 기억/기념이 악하다’는 읽기를 따라 한국어도 관계적 대상을 분명히 하되 과도하게 해석하지 않았습니다.
theological_decisions:
- issue: 마지막 절의 난해한 결말
  chosen_reading: ‘너희에 대한 기억은 악합니다’로 옮겨 심판적 의미를 보존했습니다.
  alternative_readings:
  - ‘너희의 기억은 악합니다’
  - ‘너희의 기념은 악합니다’
  - ‘악한 기억이 너희를 거슬러 있습니다’
  rationale: 게에즈 구문은 텍스트적으로 난해하므로, 해석을 단정하기보다 죄인들의 이름/기억이 부정적으로 판정된다는 공적·심판적 힘을 드러내는 쪽을 택했습니다.
  doctrine_reference: 의미가 불확실한 경우, 본문이 허용하는 범위 안에서 긴장을 보존하고 과잉 확정을 피합니다.
