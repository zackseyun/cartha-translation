base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
  footnotes:
  - marker: a
    text: The final clause is difficult. It may mean 'your memory is evil,' 'your memorial is evil,' or 'evil remembrance clings to you.'
    reason: lexical_alternative
  - marker: b
    text: The pairing 'in the midst of the sea and upon the dry land' likely functions as a totalizing image, extending the denunciation everywhere people dwell or travel.
    reason: cultural_note
translation:
  language: ko
  text: “너희에게 화가 있도다, 죄인들아. 바다 한가운데와 마른 땅 위에 있는 너희에게, 너희에 대한 기억은 악합니다.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 마지막 구절은 ‘너희의 기억은 악하다’, ‘너희의 기념은 악하다’, 또는 ‘악한 기억이 너희에게 달라붙어 있다’는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바다 한가운데와 마른 땅 위에’라는 병렬은 사람들이 사는 곳과 이동하는 모든 범위를 포괄하는 총체적 이미지일 가능성이 큽니다.
    reason: cultural_note
