base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/009.yaml
  text: And now let us do what we planned[a], for we have gathered silver, and we have filled our storehouses like water[d][c][b], and many are the laborers of our houses.
  footnotes:
  - marker: a
    text: Or 'what we thought' or 'what we devised.' The Ge'ez verb can cover both thinking and planning.
    reason: lexical_alternative
  - marker: b
    text: '''Like water'' is a literal simile. It likely expresses abundance or overflowing fullness.'
    reason: cultural_note
  - marker: c
    text: The word rendered 'farmers' may also mean agricultural workers more generally; some uncertainty remains in this clause.
    reason: lexical_alternative
  - marker: d
    text: Or 'farmers of our houses'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 우리가 계획한 일을 합시다.[a] 우리는 은을 모았고, 우리 곳간들을 물처럼 가득 채웠으며,[b] 우리 집들의 일꾼들이 많습니다.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘계획한 일’은 ‘생각한 일’ 또는 ‘꾀한 일’로도 옮길 수 있습니다. 게에즈 동사는 사고와 계획을 모두 포함할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘물처럼’은 문자적인 비유입니다. 풍성함이나 넘침을 강하게 드러냅니다.
    reason: cultural_note
  - marker: c
    text: 여기서 ‘일꾼들’에 해당하는 말은 농업 노동자 일반을 가리킬 수도 있어, 의미가 다소 넓습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘우리 집들의 농부들’로도 옮길 수 있습니다.
    reason: previous_rendering
