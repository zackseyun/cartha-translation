base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
  footnotes:
  - marker: a
    text: Or 'your ruin' or 'your downfall' for both occurrences of the noun rendered 'destruction.'
    reason: lexical_alternative
  - marker: b
    text: The opening clause is terse in Ge'ez; 'it shall come upon you' brings out the threatening sense of the warning.
    reason: lexical_alternative
  - marker: c
    text: Or 'Know that it shall come upon you, because'.
    reason: previous_rendering
translation:
  language: ko
  text: 알아 두십시오. 지극히 높으신 분은 여러분의 멸망을 기억하시며, 하늘의 천사들은 여러분의 멸망을 두고 기뻐합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እሙረ ይከውን ለክሙ
  english_pob_choice: Know that
  chosen_korean: 알아 두십시오
  alternatives_korean:
  - 알게 하십시오
  - 확실히 알아 두십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시적으로 경고를 여는 관용구로 이해하여, 직설적이면서도 현대 한국어에서 자연스러운 경고 표현으로 옮겼습니다.
- source_word: ልዑል
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 가장 높으신 분
  - 지존자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 신칭을 한국어에서 위격적으로 자연스럽게 살리되, 너무 교회식으로 굳어진 표현은 피했습니다.
- source_word: ሐጕልክሙ / ሐጕለ ዚአክሙ
  english_pob_choice: your destruction
  chosen_korean: 여러분의 멸망
  alternatives_korean:
  - 여러분의 파멸
  - 여러분의 몰락
  - 여러분의 파괴
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 명사를 같은 말로 유지해 강조를 보존했고, 심판 맥락에서 가장 강한 대응어인 ‘멸망’을 택했습니다.
- source_word: መላእክተ ሰማይ
  english_pob_choice: the angels of heaven
  chosen_korean: 하늘의 천사들
  alternatives_korean:
  - 하늘의 사자들
  - 천상의 천사들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유격 구조를 자연스럽게 옮기면서도, ‘천사들’의 종교적 어휘를 유지했습니다.
theological_decisions:
- issue: 천사들이 멸망을 두고 기뻐한다는 강한 종말론적 진술의 처리
  chosen_reading: 천사들이 ‘여러분의 멸망을 두고 기뻐합니다’라는 직설을 그대로 살렸습니다.
  alternative_readings:
  - 천사들이 여러분의 멸망을 보고 기뻐합니다
  - 천사들이 하나님의 न्याय를 기뻐합니다
  rationale: 본문의 기쁨 동사는 명시적이며, 심판 경고의 날카로움을 완화하지 않는 것이 원문의 의도에 더 가깝습니다.
  doctrine_reference: apocalyptic imagery and theological tension should be preserved rather than softened
