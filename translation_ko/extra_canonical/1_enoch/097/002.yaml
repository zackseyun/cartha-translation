  naturalness: “알아 두십시오”와 “지극히 높으신 분은 … 기억하시며”는 현대 표준 한국어 합쇼체에서 자연스럽고, 엄중한 예언적 경고의 어조에도 알맞습니다. “멸망을 두고 기뻐합니다”도 문법적으로 자연스럽고 원문의 직접 목적 관계를 불필요하게 완화하지 않습니다.
  terminology: ‘지극히 높으신 분’은 ልዑል의 신적 칭호를 위격적이고 높임말에 맞게 옮깁니다. ‘하늘의 천사들’은 መላእክተ ሰማይ를 충실히 반영하며, ‘멸망’은 문맥상 ሐጕል의 파국·파멸 의미에 적절합니다.
