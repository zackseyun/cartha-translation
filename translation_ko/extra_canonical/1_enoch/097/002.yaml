base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
  footnotes:
  - marker: a
    text: Or 'your ruin' or 'your downfall' for both occurrences of the noun rendered 'destruction.'
    reason: lexical_alternative
  - marker: b
    text: The opening clause is terse in Ge'ez; 'it shall come upon you' brings out the threatening sense of the warning.
    reason: lexical_alternative
  - marker: c
    text: Or 'Know that it shall come upon you, because'.
    reason: previous_rendering
