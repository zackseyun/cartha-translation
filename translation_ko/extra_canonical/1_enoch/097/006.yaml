base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
  footnotes:
  - marker: a
    text: Or 'all the matters of your lawlessness,' if ነገረ is taken more broadly than 'words.'
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be rendered 'every deed done in lawlessness shall be cast away'; the underlying verb appears to suggest something established or grounded, but the exact nuance is difficult.
    reason: lexical_alternative
  - marker: c
    text: Or 'your faces shall be covered with shame'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희의 모든 불법의 말이 큰 거룩하신 이 앞에서 낭독될 것이며, 너희의 얼굴은 부끄러움을 당할 것이며, 불법 위에 세워진 모든 행위는 버려질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 불법에 관한 모든 일’로도 옮길 수 있습니다. ነገረ를 ‘말’보다 더 넓은 ‘일/사실’로 볼 여지가 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 ‘불법 가운데 행해진 모든 행위는 버려질 것이다’로도 옮길 수 있습니다. 원문의 동사는 ‘세워지다/기초를 두다’의 뉘앙스를 띱니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘너희의 얼굴은 수치를 당할 것입니다’라고도 옮길 수 있습니다.
    reason: previous_rendering
