  naturalness: ‘그들에 대하여 증언이 될 것입니다’도 이해되지만, 현대 한국어에서는 ‘그들을 거슬러 증언이 될 것입니다’가 법정적이고 불리한 증언의 뜻을 더 명료하고 자연스럽게 전달합니다. ‘죄인들의 동료가 되었습니다’는 문맥과 문체에 맞는 자연스러운 표현입니다.
  terminology: ‘증언’은 ሰማዕተ의 증언/증거 기능을 잘 반영합니다. ‘한패’는 공모나 부정한 패거리를 암시하여 ‘동료·동반자·연합한 자’라는 원문의 범위보다 해석적이므로 ‘동료’로 조정해야 합니다. 각주도 실제 해당 어구 바로 뒤에 배치하고, ‘말씀’처럼 종교적으로 특정될 수 있는 표현은 대안으로 제시하지 않는 것이 좋습니다.
