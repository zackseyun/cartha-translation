base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
  footnotes:
  - marker: a
    text: Or 'those about whom this saying is heard.' The Ge'ez syntax in this clause is difficult in the OCR witness.
    reason: alternative_reading
  - marker: b
    text: '''This word'' could also be rendered ''this saying'' or ''this matter.'''
    reason: lexical_alternative
  - marker: c
    text: '''Companions of sinners'' may also be understood as ''companions with sinners'' or ''associates of sinners.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'those of whom it is heard that this word is said about them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희도 그들처럼 되어, 이 말이 그들에 대하여 증언이 될 것입니다. 「너희는 죄인들과 한패가 되었습니다.」[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘이 말은 그들에 대하여 증언이 될 것입니다’입니다.
    reason: source_note
  - marker: b
    text: ‘말’은 여기서 ‘말씀’보다 중립적인 ‘말’ 또는 ‘말씀/진술’의 뜻을 가질 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그들처럼’은 ‘그들과 같이’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘한패’는 문맥상 ‘동료’보다 죄와의 결속을 더 강하게 드러냅니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  english_pob_choice: you will become
  chosen_korean: 되어
  alternatives_korean:
  - 되실 것입니다
  - 되게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 미래적 결과 상태를 나타내므로 한국어에서는 ‘되어’로 자연스럽게 옮기되, 경고의 진행성을 살렸습니다.
- source_word: ከማሆሙ
  english_pob_choice: like them
  chosen_korean: 그들처럼
  alternatives_korean:
  - 그들같이
  - 그들과 같이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비교 표현을 가장 간결하게 살려, 대상과의 닮아감을 직접적으로 드러냈습니다.
- source_word: ሰማዕተ ይከውን
  english_pob_choice: will be a witness
  chosen_korean: 증언이 될 것입니다
  alternatives_korean:
  - 증인이 될 것입니다
  - 증거가 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적·증언적 힘을 살리기 위해 ‘증언’으로 옮겼습니다. 단순한 ‘듣다’의 의미가 아니라, 그 말 자체가 그들을 향한 증거가 된다는 점을 반영합니다.
- source_word: ዴቤሆሙ ዝንቱ ነገር
  english_pob_choice: against whom this word
  chosen_korean: 이 말이 그들에 대하여
  alternatives_korean:
  - 이 말이 그들을 상대로
  - 이 말이 그들에 관하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘대하여’는 증언의 방향성을 살리면서도 과도하게 형사적 뉘앙스로 좁히지 않습니다.
- source_word: ሱቱፋነ
  english_pob_choice: companions
  chosen_korean: 한패가 되었습니다
  alternatives_korean:
  - 동무가 되었습니다
  - 동료가 되었습니다
  - 한편이 되었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 동행보다 죄인들과의 결속·연루를 드러내는 표현이므로, 부정적 결속을 띠는 ‘한패’로 옮겼습니다.
- source_word: ለኃጥኣን
  english_pob_choice: of sinners
  chosen_korean: 죄인들과
  alternatives_korean:
  - 죄인들의
  - 죄인들과 함께
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 한국어에서는 관계를 자연스럽게 드러내기 위해 ‘-들과’로 풀어, 문맥상 동류·연합의 뜻을 살렸습니다.
theological_decisions:
- issue: The verse’s judicial warning force
  chosen_reading: 이 말 자체가 그들을 향한 증언이 된다는 법정적 경고를 유지했습니다.
  alternative_readings:
  - 단순한 일반 진술로 완화하는 읽기
  - ‘듣다’ 중심의 보고문으로 읽는 방식
  rationale: 게에즈 원문과 수정 이력은 ‘증언’의 법정적 기능을 요구하므로, 경고의 날카로움을 약화시키지 않았습니다.
  doctrine_reference: 본문의 심판 경고를 보존하고, 해석으로 완화하지 않음.
