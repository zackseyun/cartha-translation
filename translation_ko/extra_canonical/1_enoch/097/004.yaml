base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
  footnotes:
  - marker: a
    text: Or 'those about whom this saying is heard.' The Ge'ez syntax in this clause is difficult in the OCR witness.
    reason: alternative_reading
  - marker: b
    text: '''This word'' could also be rendered ''this saying'' or ''this matter.'''
    reason: lexical_alternative
  - marker: c
    text: '''Companions of sinners'' may also be understood as ''companions with sinners'' or ''associates of sinners.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'those of whom it is heard that this word is said about them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희는 그들과 같이[a] 될 것이며, 이 말이 그들을 거슬러[b] 증언이 될 것입니다[c]. ‘너희는 죄인들의 동료가 되었습니다[d].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들처럼’.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘그들에게 불리하게’. 이 표현은 단순히 ‘그들에 관하여’가 아니라 그들을 대항하는 방향을 나타냅니다.
    reason: source_note
  - marker: c
    text: ‘증언’은 ‘증거’ 또는 ‘증인이 하는 증언’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘죄인들과 어울리는 자들이 되었습니다’, ‘죄인들의 동반자가 되었습니다’.
    reason: lexical_alternative
