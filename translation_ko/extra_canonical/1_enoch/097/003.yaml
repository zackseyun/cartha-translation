base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
  footnotes:
  - marker: a
    text: Or 'the voice of the prayer of the righteous.' The Ge'ez term can denote 'voice,' 'sound,' or 'word.'
    reason: lexical_alternative
  - marker: b
    text: Or 'the sound of the prayer'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희 죄인들아, 무엇을 하겠느냐? 그 심판의 날에 어디로 도망하겠느냐? 의인들의 기도의 소리를 들을 때에 말입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘소리’는 여기서 ‘음성’ 또는 ‘말’의 뉘앙스를 함께 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 심판의 날’은 문자적으로 ‘그 날’이지만, 문맥상 심판의 날로 이해됩니다.
    reason: source_note
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  english_pob_choice: What will you do
  chosen_korean: 무엇을 하겠느냐
  alternatives_korean:
  - 무엇을 하겠습니까
  - 무엇을 하려 하느냐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 현재형보다 임박한 심판을 향한 미래적 도전을 살려 질문형으로 옮겼습니다.
- source_word: ኃጥኣን
  english_pob_choice: you sinners
  chosen_korean: 너희 죄인들아
  alternatives_korean:
  - 죄인들아
  - 너희 죄인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접 호격이 분명하므로 ‘너희’와 호격 어미 ‘-아’를 살려 예언적 책망의 톤을 유지했습니다.
- source_word: አይቴ፡ ትጐይዩ
  english_pob_choice: where will you flee
  chosen_korean: 어디로 도망하겠느냐
  alternatives_korean:
  - 어디로 달아나겠느냐
  - 어디로 피하겠느냐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말 심판 문맥에서 단순한 이동보다 피신·도피의 의미가 강하므로 ‘도망하다’가 가장 자연스럽습니다.
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  english_pob_choice: the voice of the prayer of the righteous
  chosen_korean: 의인들의 기도의 소리
  alternatives_korean:
  - 의인들의 기도의 음성
  - 의인들의 기도의 울림
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge‘ez ቃል은 ‘소리/음성/말’의 범위를 가지므로, 기도와 결합할 때 한국어에서는 ‘소리’가 가장 직접적으로 들림의 이미지를 전달합니다.
theological_decisions:
- issue: ‘기도의 소리’가 심판 장면에서 갖는 의미
  chosen_reading: 의인들의 기도는 단순한 소음이 아니라 하나님께 상달되는 호소로서, 죄인들이 심판 때 듣게 되는 결정적 증언처럼 제시됩니다.
  alternative_readings:
  - 의인들의 기도가 아니라 의인 자신들의 외침을 뜻한다고 볼 수 있습니다
  - ‘소리’보다 더 강하게 ‘음성’으로 옮길 수 있습니다
  rationale: 원문은 ‘기도’와 ‘소리’를 함께 두어, 의인의 호소가 심판의 순간에 들려오는 구조를 분명히 합니다. 이를 과도하게 해석하지 않고 그대로 살렸습니다.
  doctrine_reference: 원문 우선 원칙을 따르며, 묵시 문학의 심판 역전 구조를 보존합니다.
