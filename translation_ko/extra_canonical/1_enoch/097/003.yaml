  rationale: 직접 호격이 분명하므로 ‘너희’와 호격 어미 ‘-아’를 살려 예언적 책망의 톤을 유지했습니다.
- source_word: አይቴ፡ ትጐይዩ
  english_pob_choice: where will you flee
  chosen_korean: 어디로 도망하겠느냐
