  - 의인들의 기도의 울림
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge‘ez ቃል은 ‘소리/음성/말’의 범위를 가지므로, 기도와 결합할 때 한국어에서는 ‘소리’가 가장 직접적으로 들림의 이미지를 전달합니다.
theological_decisions:
- issue: ‘기도의 소리’가 심판 장면에서 갖는 의미
  chosen_reading: 의인들의 기도는 단순한 소음이 아니라 하나님께 상달되는 호소로서, 죄인들이 심판 때 듣게 되는 결정적 증언처럼 제시됩니다.
  alternative_readings:
  - 의인들의 기도가 아니라 의인 자신들의 외침을 뜻한다고 볼 수 있습니다
  - ‘소리’보다 더 강하게 ‘음성’으로 옮길 수 있습니다
  rationale: 원문은 ‘기도’와 ‘소리’를 함께 두어, 의인의 호소가 심판의 순간에 들려오는 구조를 분명히 합니다. 이를 과도하게 해석하지 않고 그대로 살렸습니다.
  doctrine_reference: 원문 우선 원칙을 따르며, 묵시 문학의 심판 역전 구조를 보존합니다.
