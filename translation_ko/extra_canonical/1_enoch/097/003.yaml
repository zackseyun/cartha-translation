  - 어디로 피하겠느냐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말 심판 문맥에서 단순한 이동보다 피신·도피의 의미가 강하므로 ‘도망하다’가 가장 자연스럽습니다.
