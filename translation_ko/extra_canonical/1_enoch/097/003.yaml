translation:
  language: ko
  text: 너희 죄인들아, 그 심판의 날[b]에 의인들의 기도의 음성[a]을 듣게 될 때, 너희는 무엇을 하겠으며 어디로 도망하겠습니까?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘음성’은 여기서 ‘소리’ 또는 ‘말’의 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 문자적으로 ‘그 날’이라고 하나, 문맥상 심판의 날을 가리킵니다.
    reason: source_note
