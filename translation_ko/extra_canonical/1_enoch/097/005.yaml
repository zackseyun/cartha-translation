theological_decisions:
- issue: ‘성도’의 대상 범위
  chosen_reading: 여기서는 하늘 존재보다는 의인/신실한 자들의 기도를 가리키는 것으로 두었습니다.
  alternative_readings:
  - 천사들
  - 하늘의 거룩한 존재들과 땅의 경건한 자들을 포괄하는 표현
  rationale: 이 단락의 화복 선언 구조상 억압받는 의인들의 기도가 하나님께 상달된다는 대비가 더 자연스럽기 때문에, 의미를 과도하게 특정하지 않고도 한국어로는 ‘성도들’이 가장 적절합니다.
  doctrine_reference: 문맥 우선 원칙; 종말론적 경고의 대상과 의인의 호응을 보존
