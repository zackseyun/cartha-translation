base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
  footnotes:
  - marker: a
    text: Or 'the prayers of the saints.' The Ge'ez term literally means 'holy ones.'
    reason: lexical_alternative
  - marker: b
    text: The final phrase is textually difficult in this witness. It likely refers to the coming days of reckoning or punishment for the addressed wicked.
    reason: textual_variant
translation:
  language: ko
  text: 그리고 그 날들에 성도들의 기도가 주께 이르고, 너희의 심판의 날이 너희에게 닥칠 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘거룩한 이들’입니다. 이 본문은 ‘성도들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 구절의 마지막 절은 전승상 난해합니다. 문맥상 너희에게 닥칠 장차의 심판을 가리키는 것으로 보입니다.
    reason: textual_variant
