base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
  footnotes:
  - marker: a
    text: Or 'not in righteousness'; the phrase may describe either the manner of acquiring the wealth or the moral character of the gain more generally.
    reason: lexical_alternative
  - marker: b
    text: Or 'We have become rich with wealth, and we have acquired everything we desired.'.
    reason: previous_rendering
  - marker: c
    text: Or 'heap up'.
    reason: previous_rendering
translation:
  language: ko
  text: 의롭게 은과 금을 얻지 않고 이렇게 말하는 이들에게 화가 있습니다. ‘우리는 재물로 부유해졌고, 재산도 생겼으며, 우리가 바란 모든 것을 얻었습니다.’[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘의롭게 얻지 않고’는 직역하면 ‘의 안에서가 아니라’이며, ‘의롭지 않게’로도 옮길 수 있습니다. 이 말은 재물을 얻는 방식이 의롭지 않았음을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘재산도 생겼으며’는 직역하면 ‘재산이 우리에게 있게 되었다’에 가깝습니다.
    reason: source_note
