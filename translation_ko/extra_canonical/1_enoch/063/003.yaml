revisions:
- from: 그리고 당신의 권능은 모든 숨은 것 가운데서 모든 세대에 걸쳐 빛나며, 당신의 영광은 영원히 영원합니다. 깊도다, 당신의 모든 숨은 것들은 — 그것들은 헤아릴 수 없으며 — 당신의 의는 계산할 수 없습니다.[a][b][c]
  to: 당신의 권능은 모든 숨은 것[a] 가운데서 모든 세대에 걸쳐 빛나고[c], 당신의 영광은 영원무궁합니다. 당신의 모든 숨은 것들은 깊고 그 수를 셀 수 없으며, 당신의 의는 계산할 수 없습니다[b].
  rationale: 원문의 동사와 전치사구를 우선하여 ‘권능은 ... 빛나고’로 유지했습니다. 현대 합쇼체에 맞추어 고어적 종결과 어색한 중복을 고쳤고, 원문의 ‘깊음’, ‘무수함’, ‘계산 불가능함’을 각각 보존했습니다. 각주 표지를 해당 어구로 옮기고, 원문과 양립하기 어려운 이전 번역은 대안 번역이 아니라 번역 전통의 기록으로 한정했습니다.
  reviewer_model: gpt-5.6-terra
