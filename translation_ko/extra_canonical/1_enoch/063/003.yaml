base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
  footnotes:
  - marker: a
    text: Or 'your secrets' / 'your mysteries' for 'your hidden things.' The Ge'ez is more literally 'your hidden [things].'
    reason: lexical_alternative
  - marker: b
    text: Or 'your justice' for 'your righteousness.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And blessed be your hidden power'.
    reason: previous_rendering
translation:
  language: ko
  text: 당신의 권능은 모든 숨은 것[a] 가운데서 모든 세대에 걸쳐 빛나고[c], 당신의 영광은 영원무궁합니다. 당신의 모든 숨은 것들은 깊고 그 수를 셀 수 없으며, 당신의 의는 계산할 수 없습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘당신의 비밀들’ 또는 ‘당신의 신비들’로 옮길 수 있습니다. 게에즈어는 더 문자적으로 ‘당신의 숨은 [것들]’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘당신의 정의’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이전 번역 전통에는 ‘당신의 숨은 권능은 복되도다’라는 번역이 있습니다. 그러나 여기서는 동사 ይበርህ를 ‘빛나다’로, በኵሉ ኅቡእ를 ‘모든 숨은 것 가운데서’로 이해합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ይበርህ
  english_pob_choice: shines
  chosen_korean: 빛나며
  alternatives_korean:
  - 비추며
  - 빛납니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez 동사 ይበርህ는 ‘밝게 빛나다/비추다’의 뜻이므로, POB의 개정된 이해를 따라 ‘빛나며’로 옮겨 뜻을 바로 드러냈습니다.
- source_word: በኵሉ ኅቡእ
  english_pob_choice: in every hidden thing
  chosen_korean: 모든 숨은 것 가운데서
  alternatives_korean:
  - 모든 숨은 것 안에서
  - 모든 숨은 것 속에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구는 ‘숨은 것들’에 대한 범위를 나타내므로, ‘가운데서’로 옮겨 빛남의 장소/영역을 자연스럽게 살렸습니다.
- source_word: ለትውልደ ትውልድ
  english_pob_choice: throughout all generations
  chosen_korean: 모든 세대에 걸쳐
  alternatives_korean:
  - 세대에서 세대로
  - 영원한 세대마다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관용적인 지속 표현을 한국어로 자연스럽게 살리면서, 시간적 연속성을 분명히 드러내기 위해 ‘모든 세대에 걸쳐’를 선택했습니다.
- source_word: ጽድቅ ዚአከ
  english_pob_choice: your righteousness
  chosen_korean: 당신의 의
  alternatives_korean:
  - 당신의 righteousness(의로움)
  - 당신의 정의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 도송적 문맥에서 ጽድቅ은 하나님의 성품을 가리키므로, 프로젝트 기본어인 ‘의’를 사용해 문맥과 일관성을 유지했습니다.
- source_word: ኃሳበ አልቦ
  english_pob_choice: beyond reckoning
  chosen_korean: 계산할 수 없습니다
  alternatives_korean:
  - 헤아릴 수 없습니다
  - 헤아림이 없습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원어의 핵심은 ‘계산/계수의 불가능성’이므로, 수량적 불가산성을 직접 드러내는 표현을 택했습니다.
theological_decisions:
- issue: 서두의 동사를 ‘복되다/찬송받다’가 아니라 ‘빛나다’로 둘 것인가
  chosen_reading: ‘당신의 권능은 … 빛나며’로 두어, Ge'ez ይበርህ의 의미를 그대로 반영했습니다.
  alternative_readings:
  - ‘당신의 권능은 복되도다’
  - ‘당신의 숨은 권능이 복을 받습니다’
  rationale: 주석 전통의 기존 읽기보다 원문 동사를 우선해야 하므로, 축복 공식이 아니라 발광/현현의 의미를 보존했습니다. 이로써 ‘숨은 것 가운데서’라는 수수께끼적 대구도 유지됩니다.
  doctrine_reference: 원문 우선 및 어휘적 긴장 보존
- issue: ‘당신의 의’와 ‘당신의 정의’ 중 어느 쪽을 택할 것인가
  chosen_reading: ‘당신의 의는 계산할 수 없습니다’
  alternative_readings:
  - ‘당신의 정의는 계산할 수 없습니다’
  - ‘당신의 공의는 헤아릴 수 없습니다’
  rationale: 도송문맥에서 ጽድቅ은 하나님의 성품을 찬양하는 말로 읽는 것이 가장 자연스럽고, 기본 용례인 ‘의’가 문맥을 덜 좁힙니다.
  doctrine_reference: 핵심 용어 일관성 유지
- issue: ‘숨은 것들’을 ‘비밀/신비’로 확장할 것인가
  chosen_reading: ‘숨은 것들’로 유지했습니다.
  alternative_readings:
  - 비밀들
  - 신비들
  rationale: POB 영어 주석이 지적하듯 원문은 구체적으로 ‘숨은 것들’에 가깝기 때문에, 후기 신비주의 용어를 덧씌우지 않고 긴장을 그대로 살렸습니다.
  doctrine_reference: 추가 해석보다 원문 어휘 보존
