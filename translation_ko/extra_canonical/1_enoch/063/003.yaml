  terminology: ‘권능’, ‘영광’, ‘숨은 것들’, ‘의’는 원문의 어휘적 폭과 도송적 문맥에 적절합니다. ‘비밀들/신비들’ 및 ‘정의’는 가능한 대안으로 각주에 남깁니다. ‘숨은 권능은 복되도다’라는 이전 번역은 현 원문 분석과 맞지 않으므로 가능한 대안 번역으로 제시하지 않는 것이 안전합니다.
