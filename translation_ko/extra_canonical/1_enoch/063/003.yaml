  source_fidelity: 서두의 ይበርህ는 문맥과 형태상 ‘복되다’가 아니라 ‘빛나다/비추다’로 옮기는 것이 타당합니다. በኵሉ ኅቡእ는 ‘모든 숨은 것 가운데서’로, ለትውልደ ትውልድ는 지속적 범위로 보존했습니다. 후반의 ‘깊다’, ‘수없다’, ‘계산할 수 없다’도 원문의 세 개 진술을 구별하여 반영했습니다.
