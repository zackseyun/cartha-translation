- issue: 회개 행위의 성격—진정한 회개인지 강요된 굴복인지
  chosen_reading: 본문은 그들이 잠시 유예를 구하며 엎드려 경배하고 죄를 고백하려 한다고 말할 뿐, 그 고백이 받아들여지는지나 내적 진정성을 확정하지 않습니다.
  alternative_readings:
  - 진심 어린 회개로 읽기
  - 형벌 앞의 강제된 인정으로 읽기
  rationale: 원문의 긴장을 풀어버리지 않고, 요청과 행위만 보고 수용 여부는 유보하는 것이 본문 충실성에 맞습니다.
  doctrine_reference: 본문이 말하는 만큼만 말하고, 의미의 긴장은 유지한다.
