  - 재앙
  - 괴로움
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘고난’과 짝을 이루는 고통/압제의 의미를 살리면서, 종말론적 탄식에 익숙한 한국어 표현인 ‘환난’을 선택했습니다.
- source_word: ገጹ / ኢይነሥኡ
  english_pob_choice: his judgments show no partiality
  chosen_korean: 사람을 편파적으로 대하지 않기 때문입니다
  alternatives_korean:
  - 사람을 외모로 취하지 않기 때문입니다
  - 사람에게 치우치지 않기 때문입니다
  - 얼굴을 들어 주지 않기 때문입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘얼굴을 들지 않는다’는 관용구를 한국어 독자에게 바로 이해되도록 풀어, 재판에서의 편파 없음이라는 법적 의미를 드러냈습니다.
- source_word: ጽድቁ
  english_pob_choice: his righteousness
  chosen_korean: 그의 의
  alternatives_korean:
  - 그의 의로움
  - 그의 정의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님의 품성과 심판을 함께 아우르는 성경적 핵심어이므로, 표준적인 ‘의’로 옮겼습니다.
theological_decisions:
- issue: ኢንረክብ ዕረፍተ ንእመን의 난해한 구조
  chosen_reading: 우리는 쉴 곳도 믿을 곳도 찾지 못할 것입니다
  alternative_readings:
  - 우리는 믿을 수 있는 쉼을 찾지 못할 것입니다
  - 우리는 쉼도 희망도 얻지 못할 것입니다
  rationale: 게에즈 구문이 난해하므로, ‘rest’와 ‘believe/trust’의 긴장을 모두 남기면서 한국어로는 문법적으로 읽히는 형태로 옮겼습니다. 의미를 매끈하게 정리해 원문의 난점을 지워버리기보다, ‘쉴 곳도 믿을 곳도’로 불확실성을 드러냈습니다.
  doctrine_reference: 텍스트의 난점을 보존하는 번역 원칙; 불확실한 경우 해소보다 투명성을 우선함.
- issue: 마지막 절의 재판 관용구
  chosen_reading: 사람을 편파적으로 대하지 않기 때문입니다
  alternative_readings:
  - 얼굴을 들어 주지 않기 때문입니다
  - 사람에게 치우치지 않기 때문입니다
  rationale: ‘얼굴을 들다/받다’의 관용은 직역하면 난해하므로, 심판의 핵심인 불편파성을 한국어 법률·성경 문맥에 맞게 명시했습니다.
  doctrine_reference: 관용구의 의미를 보존하되 현대 한국어에서 명료하게 전달하는 최적 대응
