  - 수고
  - 곤경
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 노동보다 압박과 곤란의 상태를 가리키므로, ‘고난’이 가장 자연스럽고 엄중한 대응입니다.
- source_word: ምንዳቤነ
  english_pob_choice: our affliction
  chosen_korean: 환난
  alternatives_korean:
