  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간 표지를 단순한 시점보다 재난의 특정한 날로 살려, 종말론적·심판적 뉘앙스를 유지했습니다.
- source_word: ስራሕነ
