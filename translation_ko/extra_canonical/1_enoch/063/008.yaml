base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
  footnotes:
  - marker: a
    text: The clause 'we shall find no rest to believe' is textually and syntactically difficult in the Ge'ez. It may mean 'we shall find no rest in which to trust' or 'we shall find no respite for hope.'
    reason: alternative_reading
  - marker: b
    text: Literally, the final clause refers to judgment not 'lifting up the face'—an idiom for showing no favoritism or partiality.
    reason: lexical_alternative
  - marker: c
    text: Or 'in all his works and in his judgments; and his judgment shows no partiality.'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리의 고난의 날과 우리의 환난의 날에 그는 우리를 구원하지 않으실 것이며, 우리는 쉴 곳도 믿을 곳도 찾지 못할 것입니다. 왜냐하면 우리 주께서는 그의 모든 일과 그의 심판과 그의 의에 신실하시며, 그의 심판은 사람을 편파적으로 대하지 않기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈의 ‘우리는 쉴 곳도 믿을 곳도 찾지 못할 것입니다’는 구조가 난해하여, ‘쉴 곳’과 ‘믿을 곳’의 병행으로 옮겼습니다.
    reason: source_note
  - marker: b
    text: 마지막 절은 문자적으로 ‘얼굴을 들어 주지 않다’는 재판 관용구로, 곧 편파를 보이지 않는다는 뜻입니다.
    reason: lexical_alternative
