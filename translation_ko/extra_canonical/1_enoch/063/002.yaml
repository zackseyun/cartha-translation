base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
  footnotes:
  - marker: a
    text: The Ge'ez repeats 'Lord of ...' across each social class and abstract quality; the English keeps that repetition rather than compressing it.
    reason: cultural_note
  - marker: b
    text: The phrase rendered 'the rich' may also be understood more broadly as those who possess wealth or property.
    reason: lexical_alternative
  - marker: c
    text: Or 'the Lord of the kings, the Lord of the mighty, the Lord of the rich, the Lord of glory, and the Lord of wisdom.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 영들의 주를 찬송하고 찬양하며 이렇게 말할 것입니다. 「영들의 주는 복되십니다. 왕들의 주, 용사들의 주, 부유한 자들의 주, 영광의 주, 지혜의 주도 복되십니다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez 원문은 각 칭호 앞에 ‘그리고’를 반복해 나열의 장중함을 강조합니다.
    reason: source_note
lexical_decisions:
- source_word: ይባርክዎ / ይሴብሕዎ
  english_pob_choice: they will bless / praise
  chosen_korean: 찬송하고 찬양하며
  alternatives_korean:
  - 축복하고 찬양하며
  - 복을 빌고 찬양하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사가 병렬로 반복되어 예배적 호응의 강도를 이루므로, 한국어에서도 두 표현을 나란히 두어 아첨이나 단순 축원의 뜻으로 약화되지 않게 했습니다.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  english_pob_choice: Lord of spirits
  chosen_korean: 영들의 주
  alternatives_korean:
  - 영들의 주님
  - 영들 위에 계신 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1에녹의 고유한 신적 칭호를 살리기 위해 ‘주’ 구조를 유지하고, ‘spirits’를 ‘영들’로 옮겨 초월적 존재를 직접 드러냈습니다.
- source_word: ቡሩክ ውእቱ
  english_pob_choice: Blessed is
  chosen_korean: 복되십니다
  alternatives_korean:
  - 복됩니다
  - 복되시도다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 선언문형 ‘Blessed is’를 한국어 합쇼체로 자연스럽게 옮겨, 축복 선언이면서도 예배적 존칭을 유지했습니다.
- source_word: እግዚኦሙ ለነገሥት / ዐዚዛን / ብዑላን
  english_pob_choice: the Lord of the kings / the mighty / the rich
  chosen_korean: 왕들의 주, 용사들의 주, 부유한 자들의 주
  alternatives_korean:
  - 왕들의 주, 강한 자들의 주, 부유한 자들의 주
  - 왕들의 주, ძლ센 자들의 주, 재물 많은 자들의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 ‘주’ 구조를 보존하되, ‘mighty’를 문맥상 권세자 일반보다 힘 있는 인물로 읽어 ‘용사들’로 옮겼고, ‘rich’는 재산 보유의 의미를 드러내어 ‘부유한 자들’로 번역했습니다.
- source_word: እግዚአ ስብሐት / እግዚአ ጥበብ
  english_pob_choice: the Lord of glory / the Lord of wisdom
  chosen_korean: 영광의 주, 지혜의 주
  alternatives_korean:
  - 영광의 주, 지혜의 주님
  - 영화의 주, 지혜의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 마지막 두 칭호도 동일한 소유격 구조로 유지해 대구를 살렸고, ‘glory’는 ‘영광’, ‘wisdom’은 ‘지혜’로 직역하여 어휘적 중첩을 보존했습니다.
theological_decisions:
- issue: 반복되는 신적 칭호와 사회 계층 칭호의 선언 형식
  chosen_reading: 영들의 주를 찬양하는 동시에, 각 칭호를 ‘복되십니다’라는 선언으로 반복해 예배적 환호를 살렸습니다.
  alternative_readings:
  - 축복합니다/찬양합니다 같은 평서형
  - ‘복되시옵소서’ 같은 기원형
  rationale: 본문은 기도라기보다 군왕들이 외치는 찬가이므로, 간청형보다 선언형이 원문 장면과 더 잘 맞습니다. 또한 반복 구조를 유지해 아포칼립스적 장중함을 보존했습니다.
  doctrine_reference: Translation philosophy §2, §3
