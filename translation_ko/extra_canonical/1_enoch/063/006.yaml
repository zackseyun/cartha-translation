base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
  footnotes:
  - marker: a
    text: The clause rendered 'we cannot seize it' is terse and may mean 'we cannot grasp/lay hold of it,' probably continuing the thought of unattainable rest or security.
    reason: lexical_alternative
  - marker: b
    text: The word rendered 'dwelling' is difficult in this Ge'ez line; 'habitation' is another possible rendering. The sense is that darkness becomes their enduring lot.
    reason: lexical_alternative
  - marker: c
    text: Or 'Now we seek rest for ourselves'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 우리는 조금의 안식을 원하지만 그것을 찾지 못합니다. 우리는 쫓겨나고 그것을 붙잡을 수도 없으며,[a] 빛은 우리 앞에서 사라졌고, 어둠은 영원무궁토록 우리의 거처가 될 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그것을 붙잡다’의 목적어는 원문에서 명시되지 않습니다. 앞의 ‘안식’을 가리킬 가능성이 크지만, 얻고자 하는 안전이나 구원을 넓게 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘거처’는 난해한 게에즈어 명사 ምኅባሪነ의 가능한 번역입니다. ‘거주지’ 또는 ‘처소’로도 옮길 수 있으며, 문맥상 어둠이 그들의 영속적인 몫이 된다는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  english_pob_choice: Now we desire a little rest
  chosen_korean: 지금 우리는 조금의 안식을 원하지만
  alternatives_korean:
  - 지금 우리는 조금의 쉼을 바라지만
  - 지금 우리는 잠시의 안식을 구하지만
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ንስቲተ’는 ‘조금의’를 뜻하고 ‘ንትሜነይ’는 ‘원하다/갈망하다’에 해당하므로, ‘조금의 안식을 원하지만’이 원문 구조를 가장 직접적으로 반영합니다.
- source_word: ወኢንረክብ
  english_pob_choice: but we do not find it
  chosen_korean: 찾지 못하고
  alternatives_korean:
  - 얻지 못하고
  - 발견하지 못하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 안식을 대상으로 한 ‘find’의 의미를 한국어에서는 자연스럽게 ‘찾다’로 옮기는 것이 가장 간결하고 직역에 가깝습니다.
- source_word: ንሰደድ
  english_pob_choice: we are driven away
  chosen_korean: 쫓겨나며
  alternatives_korean:
  - 몰려나며
  - 내쫓기며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동적 추방·축출의 뉘앙스를 살리기 위해 ‘쫓겨나며’로 옮겼습니다.
- source_word: ወኢንእኅዝ
  english_pob_choice: we cannot seize it
  chosen_korean: 붙잡을 수도 없고
  alternatives_korean:
  - 움켜쥘 수도 없고
  - 붙들 수도 없고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘seize/grasp’의 감각적 힘을 살리되 한국어 문맥에서는 ‘붙잡다’가 가장 자연스럽습니다.
- source_word: እምቅድሜነ፡ ኀለፈ
  english_pob_choice: the light has passed away from before us
  chosen_korean: 빛은 우리 앞에서 사라졌으며
  alternatives_korean:
  - 빛은 우리 앞에서 지나가 버렸으며
  - 빛은 우리 앞에서 떠나갔으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘from before us’의 공간적 이미지를 ‘우리 앞에서’로 보존하고, ‘has passed away’는 종결성과 상실감을 살려 ‘사라졌으며’로 옮겼습니다.
- source_word: ምኅባሪነ
  english_pob_choice: will be our dwelling
  chosen_korean: 우리의 거처가 될 것입니다
  alternatives_korean:
  - 우리의 거주지가 될 것입니다
  - 우리의 처소가 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어려운 명사이지만 문맥상 지속적 귀속처를 뜻하므로, 너무 신학화하지 않고 ‘거처’로 옮겼습니다.
theological_decisions:
- issue: ‘어둠’과 ‘빛’의 종말론적 성격
  chosen_reading: 어둠을 단순한 정서적 비유로 약화하지 않고, 상실된 빛과 대비되는 심판적·종말론적 이미지로 유지했습니다.
  alternative_readings:
  - 내적 절망의 비유
  - 단순한 물리적 어둠
  rationale: 이 절은 회고적 탄식이 아니라 심판 장면의 선언이므로, 이미지의 긴장과 무게를 그대로 살리는 것이 원문 의도에 더 가깝습니다.
  doctrine_reference: 종말론적 심판 이미지를 보존하고, 의미를 단일화하지 않습니다.
