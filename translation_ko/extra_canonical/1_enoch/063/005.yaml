  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 심판 아래서의 ‘휴식/유예’ 뉘앙스를 살리기 위해 ‘쉼’을 택했습니다. 교회 문맥의 ‘안식’보다 더 중립적이고 직접적입니다.
- source_word: ንሰብሖ
  english_pob_choice: praise
  chosen_korean: 찬양하고
  alternatives_korean:
  - 찬송하고
  - 영광 돌리고
  - 기리고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님/영광 앞에서 드리는 행위를 직접적으로 드러내는 ‘찬양하다’를 사용했습니다.
- source_word: ወናአኵቶ
  english_pob_choice: thank
  chosen_korean: 감사하며
  alternatives_korean:
  - 감사하고
  - 고마워하며
  - 감사드리며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘감사하다’의 의미를 자연스럽게 살리되 앞뒤의 병렬 구조에 맞춰 연결어미로 처리했습니다.
- source_word: ወንእመን
  english_pob_choice: believe
  chosen_korean: 믿을 수 있게
  alternatives_korean:
  - 믿으며
  - 믿고
  - 인정하며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 Ge'ez 동사는 여기서 ‘믿다’로 읽는 것이 본문의 어휘 반복과 더 잘 맞으므로, POB의 최신 판정에 따라 ‘믿다’로 옮겼습니다. 다만 한국어에서는 ‘믿다’의 목적어가 없어 다소 어색하므로 결과 가능성을 드러내는 표현으로 처리했습니다.
- source_word: ቅድመ ስብሐቲከ
  english_pob_choice: before your glory
  chosen_korean: 당신의 영광 앞에서
  alternatives_korean:
  - 당신의 영광 앞에
  - 당신의 영광 면전에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘before’를 공간적·법정적 대면을 살리는 ‘앞에서’로 옮겼고, ‘your glory’는 공경의 대상으로서 ‘당신의 영광’으로 직역했습니다.
theological_decisions:
- issue: ‘믿다’의 의미와 문장 내 기능
  chosen_reading: 이 구절의 마지막 동사는 POB 최신 판정에 따라 ‘믿다’로 이해하되, 한국어에서는 목적어 없는 ‘믿다’가 부자연스러워 ‘믿을 수 있게’로 옮겼습니다.
  alternative_readings:
  - ‘고백하다’ 또는 ‘인정하다’로 옮김
  - ‘믿고’처럼 동작 나열로 단순화
  rationale: Ge'ez 어휘상 63:5에서 마지막 동사는 63장 안의 주제적 반복과 맞물려 ‘믿다’로 읽는 해석이 유력합니다. 다만 수사적 탄식의 문장 구조를 무너뜨리지 않기 위해 의미를 과도하게 확정하지 않고 한국어 자연성도 확보했습니다.
  doctrine_reference: '의미의 긴장 보존: 본문이 허용하는 범위를 넘어서 교리적으로 평탄화하지 않음'
