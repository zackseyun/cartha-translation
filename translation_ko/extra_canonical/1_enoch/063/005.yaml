  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님/영광 앞에서 드리는 행위를 직접적으로 드러내는 ‘찬양하다’를 사용했습니다.
- source_word: ወናአኵቶ
