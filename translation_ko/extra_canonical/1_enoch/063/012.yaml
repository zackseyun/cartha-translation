base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/012.yaml
  text: 'Thus said the Lord of Spirits: "This is the ordinance and the judgment for the mighty."[a][b][c]'
  footnotes:
  - marker: a
    text: 'The transmitted verb ይቤ commonly means ''he said.'' In this line, however, the text appears compressed, and the sense is best represented in English as a declarative clause: ''this is the ordinance and the judgment.'''
    reason: textual_variant
  - marker: b
    text: The final phrase may also be understood as 'against the mighty,' depending on how the preposition is taken in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'For this is the ordinance and the judgment of the Lord of Spirits'.
    reason: previous_rendering
translation:
  language: ko
  text: 이같이 만군의 주께서 말씀하셨습니다. 「이것이 권정과 심판입니다 — 그 강한 자들을 위한 것입니다.」[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘이같이’는 ከመዝ의 연결어 기능을 살린 번역입니다.
    reason: source_note
  - marker: b
    text: ‘권정’은 ሥርዓቱ의 법정·규범적 뉘앙스를 살리기 위한 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘그 강한 자들’을 위한은 ለዐዚዛን의 대상 관계를 드러낸 번역으로, 문맥상 ‘그 강한 자들을 향한’으로도 읽을 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከመዝ
  english_pob_choice: Thus
  chosen_korean: 이같이
  alternatives_korean:
  - 그러므로
  - 그리하여
  - 이로써
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥에서 앞선 탄식에 이어지는 선언문을 여는 연결어로 보아, ‘이같이’가 선언적 도입의 힘을 살리면서도 과도한 인과 해석을 피합니다.
- source_word: እግዚአ መናፈስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 본문은 1 에녹의 고유한 신적 칭호를 가리키지만, 한국어에서는 ‘주’의 위엄을 살리면서도 통용되는 경외 표현으로 옮겼습니다. 다만 ‘만군의 주’는 문맥상 ‘주’의 군주적 권위를 드러내는 번안이며, 고정 칭호의 소리값을 완전히 평준화하지 않도록 했습니다.
- source_word: ሥርዓቱ
  english_pob_choice: the ordinance
  chosen_korean: 권정
  alternatives_korean:
  - 규례
  - 명령
  - 법도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법적·종말론적 선언의 성격을 살리기 위해 단순한 ‘질서’보다 판정된 규범의 뜻이 강한 ‘권정’을 택했습니다.
- source_word: ወኵነኔሁ
  english_pob_choice: and the judgment
  chosen_korean: 심판
  alternatives_korean:
  - 판결
  - 재판
  - 정죄
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘judgment’의 법정적 의미를 살리되, 종말론적 선언의 무게를 위해 ‘심판’으로 옮겼습니다. 소유 접미사는 지시적·관용적 기능으로 보아 한국어에서 별도로 풀지 않았습니다.
- source_word: ለዐዚዛን
  english_pob_choice: for the mighty
  chosen_korean: 그 강한 자들을 위한
  alternatives_korean:
  - 강한 자들을 향한
  - 그 ძლ센 자들에게 대한
  - 그 권세자들을 위한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사의 방향성은 문맥상 ‘대상/관계’를 둘 다 열어 두지만, 본문이 심판 선언이므로 ‘for’의 관계를 유지한 채 ‘그 강한 자들’을 택해 권세 있는 자들을 가리키는 뜻을 살렸습니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 칭호 처리
  chosen_reading: 문맥의 종말론적 신적 칭호로서 ‘만군의 주’로 옮겨, 위엄과 선언성을 살렸습니다.
  alternative_readings:
  - 영들의 주
  - 영의 주
  rationale: 직역형도 가능하지만, 한국어에서 자연스럽고 권위 있는 신적 호칭을 택해야 이 고대 묵시문헌의 선언체가 살아납니다.
  doctrine_reference: 고유 칭호 번역은 의미 기능을 우선하되, 원문의 경외적 어조를 보존합니다.
- issue: 접미사 -hu의 처리
  chosen_reading: ‘그의’로 풀지 않고 ‘심판입니다’로 자연화했습니다.
  alternative_readings:
  - 그의 심판입니다
  - 그의 판결입니다
  rationale: 게에즈의 접미사는 여기서 소유격보다 정관성·지시성을 띠는 것으로 보이므로, 한국어에서 불필요한 소유 표현을 넣지 않는 편이 원문에 더 가깝습니다.
  doctrine_reference: 형태소의 기능을 문맥에 따라 판별하고, 한국어에서는 과잉 명시를 피합니다.
