  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 권고·의무의 뉘앙스를 살리기 위해 '해야 함'을 택했고, መባርኮ를 교회적 '축복하다'보다 더 직접적인 '복을 빌다'로 옮겼습니다.
