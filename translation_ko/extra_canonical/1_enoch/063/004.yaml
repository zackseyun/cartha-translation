theological_decisions:
- issue: ‘왕들의 주’와 ‘모든 왕들 위에 다스리시는 분’을 분리해 두 번 말하는 구조를 어떻게 살릴 것인가
  chosen_reading: 두 표현을 분리해 병렬로 옮겼습니다.
  alternative_readings:
  - ‘왕들의 왕’으로 압축해 번역하기
  - 한 번만 ‘주권자’로 통합하기
  rationale: 원문과 영어 POB가 의도적으로 두 겹의 왕권 찬양을 유지하므로, 익숙한 공식어로 합치지 않고 각각을 드러내는 편이 본문 증언에 충실합니다.
  doctrine_reference: Translation philosophy §§1, 3
- issue: 화자 공동체의 의무 표현을 명령문으로 강하게 만들지 여부
  chosen_reading: ‘찬양하고 복을 빌어야 함을 압니다’로 인식된 의무를 표현했습니다.
  alternative_readings:
  - ‘찬양하고 복을 빕니다’
  - ‘찬양하고 복을 빌어야 합니다’
  rationale: 문맥은 단순한 미래 약속보다 ‘마땅함’을 깨닫는 고백에 가깝기 때문에, 공적인 선언 어조를 유지하면서도 의무성을 드러내는 표현이 적절합니다.
  doctrine_reference: Translation philosophy §§3, 5
