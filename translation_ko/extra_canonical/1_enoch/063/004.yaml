base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
  footnotes:
  - marker: a
    text: Or 'let us praise and bless.' The Ge'ez verbal forms can carry a hortatory or subjunctive sense.
    reason: lexical_alternative
  - marker: b
    text: The title is rendered directly from the Ge'ez as 'Lord of the kings' rather than compressed into the traditional phrase 'King of kings.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 우리는 왕들의 주[b]를 찬양하고 송축해야[a] 하며, 모든 왕을 다스리시는 분을 찬양하고 송축해야 함을 압니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사 형태는 ‘찬양하고 송축하자’라는 권면 또는 의지의 뜻으로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 전통적인 ‘왕 중의 왕’으로 압축하지 않고, ‘왕들의 주’라는 직접적인 표제를 사용합니다.
    reason: lexical_alternative
