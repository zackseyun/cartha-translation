- from: 그리고 그 뒤에 그들의 얼굴은 그 사람의 아들 앞에서 어둠과 수치로 가득 찰 것이며, 그들은 그의 얼굴 앞에서 쫓겨날 것이고, 칼은 그들의 한가운데에 머물러 있을 것입니다.[a][b]
  to: 그 후에 그들의 얼굴은 그 인자[a] 앞에서 어둠과 수치로 가득 찰 것이며, 그들은 그의 얼굴 앞에서 쫓겨날 것이고, 칼은 그의 얼굴 앞에 그들의 한가운데에 머물러 있을 것입니다.[b]
  rationale: 제공된 게에즈어 본문과 영어 POB의 반복된 ‘그의 얼굴 앞에’를 모두 반영했습니다. 묵시적 호칭은 자연스러운 한국어 성서 문체인 ‘그 인자’로 옮기고, 문장 종결을 현대 공식 합쇼체로 통일했습니다. 각주는 가능한 상징적 의미를 덧붙이지 않고, 난해한 어순 및 공간 이미지 자체만 설명하도록 수정했습니다.
