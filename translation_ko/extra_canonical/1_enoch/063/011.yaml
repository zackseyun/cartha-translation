theological_decisions:
- issue: '''그 사람의 아들''을 고유한 종말론적 칭호로 유지할지 여부'
  chosen_reading: 에녹서 본문의 내적 용례를 따라 '그 사람의 아들'로 옮겼습니다.
  alternative_readings:
