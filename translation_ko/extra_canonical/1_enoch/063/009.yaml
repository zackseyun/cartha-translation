base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
  footnotes:
  - marker: a
    text: Or 'from his presence.' The Ge'ez reads literally 'from before his face,' a vivid expression for standing before the divine judge.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also be understood as 'all our sins are counted justly' or 'are taken into account in righteousness.' The Ge'ez is judicial in tone but not fully explicit about the exact nuance.
    reason: alternative_reading
  - marker: c
    text: Or 'we pass away from before his face'.
    reason: previous_rendering
translation:
  language: ko
  text: 우리는 우리의 행위 때문에 그의 얼굴 앞에서 사라져 가며, 우리의 모든 죄는 의 가운데서 계산됩니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그의 얼굴 앞에서’는 직역으로, ‘그의 임재에서’라는 뜻으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의 가운데서’는 ‘의에 따라’ 또는 ‘의롭게’로도 이해될 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 동사는 ‘사라져 갑니다’보다 단순히 ‘지나갑니다’로도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወነኀልፍ
  english_pob_choice: we pass away / we pass
  chosen_korean: 사라져 갑니다
  alternatives_korean:
  - 지나갑니다
  - 떠납니다
  - 지나쳐 갑니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 단순한 이동보다 ‘지나가며 없어지다/사라지다’의 뉘앙스를 가질 수 있어, 심판 장면의 소멸적·배제적 감각을 살리는 ‘사라져 갑니다’로 옮겼습니다.
- source_word: እምገጹ
  english_pob_choice: from before his face
  chosen_korean: 그의 얼굴 앞에서
  alternatives_korean:
  - 그의 임재에서
  - 그의 앞에서
  - 그의 얼굴 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역인 ‘얼굴 앞에서’는 원문의 구체적이고 셈어적인 표상을 보존합니다. ‘임재에서’는 매끄럽지만 심판석에 선 느낌이 약해집니다.
- source_word: በእንተ ምግባሪነ
  english_pob_choice: because of our deeds
  chosen_korean: 우리의 행위 때문에
  alternatives_korean:
  - 우리의 행실 때문에
  - 우리의 행위로 말미암아
  - 우리의 일들 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 원인 표지를 자연스러운 현대 한국어로 풀어 ‘때문에’로 처리했습니다. ‘행위’는 중립적이고 본문의 자백적 어조를 유지합니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의 가운데서
  alternatives_korean:
  - 의 안에서
  - 의로
  - 의에 따라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구는 단순 부사적으로만 좁히기보다 심판의 기준/영역을 함께 드러냅니다. ‘의 가운데서’는 판단이 의의 척도 아래 이루어진다는 점을 살리면서도, 문장의 법정적 긴장을 유지합니다.
- source_word: ትኈለቍ
  english_pob_choice: are counted
  chosen_korean: 계산됩니다
  alternatives_korean:
  - 헤아려집니다
  - 세어집니다
  - 기록됩니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 회계적·법정적 ‘계산/산정’의 느낌이 있어 ‘계산됩니다’로 옮겼습니다. 이는 죄가 임의로 넘겨지지 않고 정확히 산정된다는 인상을 줍니다.
theological_decisions:
- issue: ‘얼굴 앞에서’라는 신인화적 표현을 완화할지 여부
  chosen_reading: 그의 얼굴 앞에서
  alternative_readings:
  - 그의 임재에서
  - 그의 앞에서
  rationale: 묵시적 심판 장면의 긴장과 거리감을 유지하려면, 추상화된 ‘임재’보다 원문의 신체적 표상을 보존하는 편이 좋습니다.
  doctrine_reference: '번역 철학: 원문 이미지의 강도를 유지하고, 독자가 본문의 장면성을 직접 보도록 함.'
- issue: 마지막 구절의 ‘의 가운데서’와 ‘계산됩니다’의 법정적 의미
  chosen_reading: 의 가운데서 계산됩니다
  alternative_readings:
  - 의에 따라 헤아려집니다
  - 의롭게 판단됩니다
  - 공정하게 계산됩니다
  rationale: 원문은 죄가 단순히 용서되거나 삭제된다는 말이 아니라, 의의 기준 아래서 산정된다는 긴장감을 가집니다. 이를 완화하지 않기 위해 ‘계산됩니다’를 택했습니다.
  doctrine_reference: '번역 철학: 해석을 과도하게 정리하지 말고, 심판과 의의 긴장을 보존함.'
