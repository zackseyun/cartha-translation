base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
  footnotes:
  - marker: a
    text: The phrase rendered 'of unjust gain' is textually and lexically difficult in the Ge'ez and may refer more broadly to wealth acquired by wrongdoing.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the weight/heaviness of Sheol.' The image is of oppressive descent into the realm of the dead, not merely burial.
    reason: lexical_alternative
  - marker: c
    text: '''Sheol'' is retained rather than ''hell'' to preserve the ancient Jewish apocalyptic sense of the underworld.'
    reason: cultural_note
  - marker: d
    text: Or 'Now they will say,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 그들은 그들에게 말할 것입니다. 「우리 영혼은 불의한 이득으로 배불렀으나, 그것이 우리를 그 한가운데에서 내려가게 하는 것을 막지는 못합니다. 곧 시올의 무거운 짐으로 내려가게 하는 것을 말입니다」.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘불의한 이득’이며, 더 넓게는 부정으로 얻은 재물이나 부를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘시올의 무게/무거움’으로도 옮길 수 있습니다. 핵심 이미지는 억압적인 하강입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘시올’은 후기 기독교의 ‘지옥’이 아니라 고대 유대 묵시문학의 저승 개념을 보존하기 위해 음역했습니다.
    reason: cultural_note
  - marker: d
    text: 또는 ‘이제 그들은 말할 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ይእዜ / Now
  english_pob_choice: Now
  chosen_korean: 이제
  alternatives_korean:
  - 지금
  - 그때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 장면 전환을 알리는 시간 부사로서 간결한 ‘이제’가 가장 자연스럽고, 종말론적 발화의 긴박함도 살립니다.
- source_word: ይብልዎሙ / they will say to them
  english_pob_choice: they will say to them
  chosen_korean: 그들은 그들에게 말할 것입니다
  alternatives_korean:
  - 그들은 말할 것입니다
  - 그들은 그들에게 말하리라
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사에 포함된 목적어 표지를 반영해 수신자를 분명히 드러냈습니다. 한국어에서는 중복을 피하되 ‘그들에게’를 유지해 직접 화법의 방향성을 보존했습니다.
- source_word: ትጸግብ ነፍስነ / Our soul has had its fill
  english_pob_choice: Our soul has had its fill
  chosen_korean: 우리 영혼은 … 배불렀으나
  alternatives_korean:
  - 우리 영혼은 만족했습니다
  - 우리 영혼은 흡족했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘배부르다’가 단순 만족보다 과잉 충족의 뉘앙스를 잘 살려, 탐욕스러운 충족 상태를 드러냅니다.
- source_word: እምጥየየ ዐመፃ / of unjust gain
  english_pob_choice: of unjust gain
  chosen_korean: 불의한 이득으로
  alternatives_korean:
  - 부정한 재물로
  - 불의한 재산으로
  - 불의한 수익으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB가 유지한 ‘unjust gain’의 도덕적 평가를 한국어에서도 직접적으로 드러내기 위해 ‘불의한 이득’으로 옮겼습니다. ‘재물’보다 ‘이득’이 획득 행위를 더 분명히 드러냅니다.
- source_word: ለክበደ ሲኦል / into the burden of Sheol
  english_pob_choice: into the burden of Sheol
  chosen_korean: 시올의 무거운 짐으로
  alternatives_korean:
  - 시올의 짐으로
  - 시올의 무게로
  - 음부의 무거운 짐으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘무거운/무게’ 이미지가 핵심이므로 이를 살려 ‘무거운 짐’으로 옮겼습니다. 전통 교회어 ‘음부’보다 음역 ‘시올’이 유대 묵시문학의 고유한 지시 대상을 더 정확히 보존합니다.
theological_decisions:
- issue: 시올(underworld) 용어 보존
  chosen_reading: 시올을 음역해, 사후 세계의 고유한 유대 묵시적 개념을 그대로 유지합니다.
  alternative_readings:
  - 음부
  - 지옥
  - 무덤
  rationale: 이 문맥은 후기 기독교적 ‘지옥’보다 고대 유대교의 저승 개념을 가리키므로, 의미를 확장하거나 협소화하지 않고 ‘시올’을 유지하는 것이 적절합니다.
  doctrine_reference: local-context first; avoid harmonizing apocalyptic underworld language with later Christian hell terminology.
