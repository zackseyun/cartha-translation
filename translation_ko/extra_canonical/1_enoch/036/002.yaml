  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘ሖርኩ’는 단순한 이동/진행을 뜻하므로, 과도한 해석을 피하고 서술 흐름을 살린 ‘갔습니다’를 택했습니다.
- source_word: መንገለ፡ አዜብ / መንገለ፡ ጽባሕ
  english_pob_choice: toward the east
