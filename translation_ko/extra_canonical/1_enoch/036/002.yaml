  - 좁은 문들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 크기의 대비를 살리면서도, 원문이 말하는 것은 문의 규모이지 ‘좁음’의 상징이 아니므로 ‘작은 문들’로 옮겼습니다.
theological_decisions:
- issue: 천상의 공간 표상과 번역의 보존성
  chosen_reading: 원문의 우주론적 이미지를 그대로 살려 ‘하늘의 끝들’과 ‘열린 하늘의 세 문’으로 옮겼습니다.
  alternative_readings:
  - 상징적으로 풀어 ‘하늘의 경계’라고 옮길 수 있음
  - 의역하여 ‘천국의 문’으로 옮길 수 있음
  rationale: 이 구절은 환시의 공간 구조를 보여 주는 묘사이므로, 상징을 일반화하거나 신학적으로 해석해 좁히지 않고 시각적 이미지를 보존하는 것이 더 충실합니다.
  doctrine_reference: Apocalyptic vision imagery; source-text fidelity
- issue: 문장 결말의 완결성
  chosen_reading: 마지막 절은 서술이 완결된 형태로 옮기되, 원문의 이동-시각 묘사 흐름을 유지했습니다.
  alternative_readings:
  - 파편성을 드러내기 위해 생략 부호로 끝낼 수 있음
  - 영어 주석처럼 문장을 이어 보충할 수 있음
  rationale: 제공된 게에즈 본문은 완결된 절로 제시되어 있으므로, 한국어도 불필요한 단절 표시 없이 완결형으로 번역하는 편이 적절합니다.
  doctrine_reference: Textual integrity / manuscript-based translation
