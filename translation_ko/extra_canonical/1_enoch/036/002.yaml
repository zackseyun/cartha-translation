base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/002.yaml
  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
  footnotes:
  - marker: a
    text: The surviving witness supplied for this verse contains only the connective phrase 'And from there'. The English retains the fragmentary form rather than completing the sentence from translation tradition.
    reason: textual_variant
  - marker: b
    text: Or 'And from there—'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기에서 나는 하늘의 끝들까지 동쪽으로 갔습니다[a]. 나는 하늘의 동쪽을 향해 열린 하늘의 세 문을 보았고[b], 그 위에는 작은 문들이 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단순한 연결어와 이동 동사를 통해 이전 환시 장면에서 동쪽 방향으로 이동했음을 말합니다.
    reason: source_note
  - marker: b
    text: 직역하면 ‘열린 하늘의 세 문’입니다. 영어 POB의 ‘portals’는 한국어에서는 문맥상 ‘문’으로 옮기는 것이 자연스럽습니다.
    reason: lexical_alternative
