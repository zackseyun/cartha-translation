  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 방향 부사구이므로 자연스러운 현대 한국어인 ‘동쪽으로’가 가장 सीधे한 대응입니다.
- source_word: በአጽናፈ፡ ምድር / በአጽናፈ፡ ሰማይ
  english_pob_choice: to the ends of heaven
  chosen_korean: 하늘의 끝들까지
