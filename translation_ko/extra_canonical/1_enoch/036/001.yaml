  - 하늘의 세 개의 창
  lexicon: Dillmann
  rationale: 영문 POB의 ‘portals’에 맞춰 하늘의 구조적 개구부라는 이미지를 살렸고, ‘열린’으로 상태를 반영했습니다.
- source_word: ጠል
  english_pob_choice: dew
