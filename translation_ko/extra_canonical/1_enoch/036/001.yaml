base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
  footnotes:
  - marker: a
    text: The Ge'ez term rendered 'mist' can also be understood as 'dew.'
    reason: lexical_alternative
  - marker: b
    text: 'The expression ''three open portals of heaven'' reflects visionary cosmic geography: the sky is pictured as having openings through which weather emerges.'
    reason: cultural_note
  - marker: c
    text: Or 'mist'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기서 나는 남쪽으로, 땅의 끝들까지 갔습니다. 그리고 거기서 나는 하늘의 세 개의 열린 통로를 보았고, 거기서 남풍과 이슬과 비와 바람이 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 지시부사 ‘거기서’는 서술의 이동을 표시하는 관용적 표현입니다.
    reason: korean_style_note
  - marker: b
    text: ‘열린 통로’는 하늘에 있는 구조적 개구부라는 비전적 이미지를 살린 번역입니다.
    reason: cultural_note
  - marker: c
    text: ‘이슬’은 Ge'ez ጠል을 ‘mist’가 아니라 ‘dew’로 본 최신 판정에 따른 번역입니다.
    reason: lexical_alternative
