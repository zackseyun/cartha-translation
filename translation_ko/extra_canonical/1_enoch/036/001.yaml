  - 안개
  lexicon: Dillmann
  rationale: 개정된 POB 판단에 따라 ‘mist’가 아니라 ‘dew’의 의미를 따라야 하며, 한국어에서는 ‘이슬’이 가장 직접적입니다.
- source_word: ዝናም
  english_pob_choice: rain
  chosen_korean: 비
  alternatives_korean:
  - 강우
  lexicon: Dillmann
  rationale: 일반적인 기상 현상 표현으로 가장 자연스럽고 과도한 문어성을 피합니다.
- source_word: ነፋስ
  english_pob_choice: wind
  chosen_korean: 바람
  alternatives_korean:
  - 풍
  - 회오리바람
  lexicon: Dillmann
  rationale: 비전의 기상 항목 목록에서 물리적 의미의 일반어 ‘바람’이 적절합니다.
theological_decisions:
- issue: 하늘의 개구부를 묘사하는 우주론적 이미지
  chosen_reading: 하늘의 세 개의 열린 통로
  alternative_readings:
  - 하늘의 세 개의 문
  - 하늘의 세 개의 창
  rationale: 본문은 비가 드나드는 구조화된 하늘을 그리므로, 전통적 상투어보다 비전적 우주 지리를 드러내는 표현을 택했습니다.
  doctrine_reference: 묵시문학의 우주론 이미지를 보존하고, 본문이 말하는 구조를 약화시키지 않습니다.
