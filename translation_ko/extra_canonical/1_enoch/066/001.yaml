    rationale: ‘그리고 이 뒤에’보다 ‘그 후에’가 자연스럽고, 천사들의 준비 상태를 명사를 직접 수식하게 하면 원문의 ‘그가 … 천사들을 보여 주었는데, 그들은 준비되어 있었다’라는 구조를 더 매끄럽고 정확하게 전달합니다.
