base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/066/001.yaml
  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
  footnotes:
  - marker: a
    text: The clause 'who are prepared' reflects a difficult Ge'ez form; 'who are ready' is also possible.
    reason: lexical_alternative
  - marker: b
    text: '''Open all the power of the waters'' likely means to unleash or release the full force of the waters, but the main text keeps the more transparent image ''open.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'to open all the power'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 후에 그는 와서 물의 모든 힘을 풀어놓을 준비가 되어 있는 형벌의 천사들을 내게 보여 주었습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어의 이 형식은 ‘준비된’ 또는 ‘준비되어 있는’으로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘풀어놓다’는 여기서 물의 힘을 해방하거나 풀어 놓는다는 뜻을 살린 번역입니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘물의 모든 힘을 열다’에 가깝지만, 한국어에서는 ‘풀어놓다’가 더 자연스럽습니다.
    reason: previous_rendering
