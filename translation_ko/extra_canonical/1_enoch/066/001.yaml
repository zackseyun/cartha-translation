  to: 그 후에 그는 와서 물의 모든 힘을 풀어놓을 준비가 되어 있는 형벌의 천사들을 내게 보여 주었습니다.[a][b][c]
  rationale: 불필요한 주체 높임을 제거하고, 시간 표현과 문장 구조를 현대 표준어 합쇼체에 맞게 다듬었습니다. ‘형벌의 천사들’, ‘물의 모든 힘’, ‘풀어놓다’는 원문의 묵시적 심판 이미지와 어휘적 여지를 유지합니다. 각주는 준비 상태 및 ‘열다/풀어놓다’의 번역 가능성을 보존합니다.
