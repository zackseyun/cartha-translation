base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
  footnotes:
  - marker: a
    text: The opening clause is textually and syntactically difficult in the Ge'ez. The sense may be that the wicked are excluded from both heaven and earth, or more generally that no cosmic refuge remains for them.
    reason: textual_variant
  - marker: b
    text: Or 'the day of oppression and distress.' The paired expression intensifies the coming judgment.
    reason: lexical_alternative
  - marker: c
    text: Or 'And heaven will not receive them, nor will the earth reach them; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 하늘에 오르지 못하고, 땅에 이르지도 못할 것입니다. 그러므로 이것은 주님의 이름을 부인한 죄인들의 몫이 될 것이며, 그들은 고난과 환난의 날을 위해 그렇게 보존되어 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 구절은 게으즈에서 문법상·의미상 난해합니다. 이 구절은 죄인들이 하늘과 땅 양쪽에서 모두 배제된다는 뜻일 수 있으며, 더 넓게는 그들에게 우주적 피난처가 남아 있지 않다는 뜻일 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘고난과 환난’은 ‘압제와 곤고’로도 옮길 수 있습니다. 결합 표현은 다가올 심판의 강도를 강조합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርጉ
  english_pob_choice: ascend
  chosen_korean: 오르지 못하고
  alternatives_korean:
  - 올라가지 못하고
  - 승천하지 못하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 기본 방향성은 ‘오르다’이지만, 한국어에서는 부자연스러운 직역보다 ‘오르지 못하다’가 문맥상 더 자연스럽고 원문의 거부/차단 의미를 살립니다.
- source_word: ይበጽሑ
  english_pob_choice: reach
  chosen_korean: 이르지도 못할 것입니다
  alternatives_korean:
  - 도달하지도 못할 것입니다
  - 다가가지도 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘이르다’는 도착/도달의 의미를 잘 보존하며, 하늘·땅의 대구 구조 안에서 종말론적 도달 불가를 분명히 드러냅니다.
- source_word: ክፍለ
  english_pob_choice: portion
  chosen_korean: 몫
  alternatives_korean:
  - 분깃
  - 할당분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 문맥의 ‘할당된 분량’이라는 의미를 한국어로 간명하게 전달하면서도, 종말론적 배분의 뉘앙스를 살립니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 주님의
  alternatives_korean:
  - 영들의 주님의
  - 만군의 주님의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 고유 칭호를 한국어에서 자연스럽게 옮기되, 1 Enoch의 고정 호칭이라는 점을 해치지 않도록 ‘주님의 이름’으로 유지했습니다.
- source_word: ይትዐቀቡ
  english_pob_choice: are kept
  chosen_korean: 보존되어 있습니다
  alternatives_korean:
  - 지켜지고 있습니다
  - 간직되어 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 보관보다 심판을 위한 예비 상태를 드러내기 위해 ‘보존되어 있습니다’를 택했습니다. 행위자는 생략된 수동 구조를 유지합니다.
theological_decisions:
- issue: 첫 절의 하늘/땅 구문을 어떻게 이해할지
  chosen_reading: 죄인들은 하늘에도 올라가지 못하고 땅에도 이르지 못하는, 우주적 거부의 상태에 놓여 있습니다.
  alternative_readings:
  - 하늘이 그들을 받아들이지 않고 땅이 그들에게 미치지 못한다
  - 그들은 하늘에 도달하지도 땅에 도착하지도 못한다
  rationale: 게으즈 원문과 POB의 개정 이력을 따라, 주어를 하늘·땅으로 돌리지 않고 죄인들의 도달 불가능으로 유지해 본문의 긴장을 보존했습니다.
  doctrine_reference: 텍스트의 난점을 해소해 버리지 않고, 심판의 배제라는 종말론적 이미지를 그대로 드러냅니다.
