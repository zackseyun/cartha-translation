  terminology: ‘마른 땅’은 የብስ의 구체적이면서도 우주적 범위를 과도하게 좁히지 않는 번역입니다. ‘내 택한 자들’은 원문의 소유격과 선택의 범주를 보존하며, ‘죄와 불법’도 두 병렬 항을 유지합니다. ‘거하다’는 문어적이지만 현대의 격식 있는 성서 번역 등록에 적합합니다.
