base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
  footnotes:
  - marker: a
    text: The clause 'he will choose their works and their resting-places' is difficult. The verb may imply selecting, sorting, or determining, and 'resting-places' could also be rendered 'dwellings' or 'stations.'
    reason: lexical_alternative
  - marker: b
    text: The text shifts from the singular 'my Chosen One' to the plural 'my Chosen Ones.' This may reflect a deliberate distinction between the enthroned figure and the community associated with him, though the wording is textually difficult.
    reason: textual_variant
  - marker: c
    text: Or 'he will choose their works and their resting-places without number'.
    reason: previous_rendering
  - marker: d
    text: Or 'those who have called upon'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 내가 택한 이는 영광의 보좌에 앉을 것이며, 그가 그들의 행위와 거처를 고르실 것입니다.[a] 그 수는 헤아릴 수 없을 것입니다.[c] 그리고 그들이 내가 택한 이들과[b] 나의 영광스러운 이름을 피난처로 삼은 이들을[d] 볼 때, 그들의 영혼은 그들 안에서 강건해질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 행위와 거처를 고르다’에 해당하는 구절은 원문상 해석이 어렵습니다. 동사는 ‘선택하다, 가려내다, 정하다’로, ‘거처’는 ‘자리, 머무는 곳’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 보좌에 앉는 단수 ‘내가 택한 이’에서 복수 ‘내가 택한 이들’로 전환됩니다. 이 구별은 본문에 따라 보존했습니다.
    reason: textual_variant
  - marker: c
    text: 원문의 ‘수가 없다’는 앞의 ‘행위와 거처’의 수가 헤아릴 수 없다는 뜻으로 옮겼습니다. 이를 ‘그가 셀 수 없이 고르실 것이다’로 연결할 가능성도 제시되어 왔습니다.
    reason: previous_rendering
  - marker: d
    text: ‘피난처로 삼은 이들’은 게에즈어 동사의 ‘피하다, 피난하다’라는 뜻을 반영합니다. 영어 번역 전통에서는 ‘이름을 부른 이들’로 옮기기도 합니다.
    reason: lexical_alternative
