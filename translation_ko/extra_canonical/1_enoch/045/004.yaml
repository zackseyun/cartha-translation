base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
  footnotes:
  - marker: a
    text: Literally, 'in their midst.'
    reason: lexical_alternative
  - marker: b
    text: Or 'my Elect One.'
    reason: lexical_alternative
  - marker: c
    text: Or 'an eternal blessing and light'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 나는 내 선택한 이를 그들 가운데 거하게 하고, 하늘을 변하게 하여 영원히 복과 빛이 되게 하겠습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 한가운데에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 택한 이’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영원한 복과 빛’으로 읽을 수 있으나, 여기서는 `לָעוֹלָם`에 해당하는 지속 표현을 부사적으로 옮겼습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: በይእቲ ዕለት
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 예언 공식의 시간 표현으로, 현대 한국어에서 자연스럽고 단정한 ‘그날에’가 원문의 장르를 잘 살립니다.
- source_word: አነብር ማእከሎሙ
  english_pob_choice: I will cause my Chosen One to dwell among them
  chosen_korean: 내 선택한 이를 그들 가운데 거하게 하고
  alternatives_korean:
  - 내 선택한 이를 그들 가운데 살게 하고
  - 내 선택한 이를 그들 한가운데 두고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘거하게 하다’는 단순한 위치 이동보다 ‘머물게 하다/정주하게 하다’의 뉘앙스를 살리며, ‘그들 가운데’는 원문의 ‘in their midst’에 해당하는 공간 감각을 보존합니다.
- source_word: ለኅሩየ ዚአየ
  english_pob_choice: my Chosen One
  chosen_korean: 내 선택한 이
  alternatives_korean:
  - 내 택한 이
  - 내 택자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB의 ‘Chosen One’을 따라 칭호성을 살리면서도, 한국어에서는 ‘선택한 이’가 가장 투명하고 과도한 교회 용어화를 피합니다.
- source_word: ወእዌልጦ ለሰማይ
  english_pob_choice: I will transform heaven
  chosen_korean: 하늘을 변하게 하여
  alternatives_korean:
  - 하늘을 바꾸어
  - 하늘을 변화시켜
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 ‘변형/변환’ 동사를 따라, 단순한 수정보다 우주적 갱신을 드러내는 ‘변하게 하여’를 택했습니다.
- source_word: ወእገብራ በረከተ ወብርሃነ
  english_pob_choice: and make it a blessing and a light
  chosen_korean: 복과 빛이 되게 하겠습니다
  alternatives_korean:
  - 복과 빛으로 만들겠습니다
  - 복과 빛이 되도록 하겠습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에티오피아어의 목적어 ‘하늘’을 다시 받아 ‘~이 되게 하다’로 옮겨, 결과 상태를 자연스럽게 드러냈습니다. ‘복과 빛’은 두 명사를 그대로 살립니다.
- source_word: ለዓለም
  english_pob_choice: forever
  chosen_korean: 영원히
  alternatives_korean:
  - 영원토록
  - 세세토록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 검토본이 지적한 대로 이는 형용사가 아니라 지속의 부사적 표현이므로, 한국어도 부사 ‘영원히’로 옮겨 원문의 문법 기능을 보존합니다.
theological_decisions:
- issue: ‘Chosen One’의 칭호성 유지와 메시아 용어로의 과도한 동화 방지
  chosen_reading: 내 선택한 이
  alternative_readings:
  - 메시아
  - 그리스도
  rationale: 이 구절은 1 Enoch의 고유한 ‘선택된 이’ 칭호를 말하므로, 후대 기독교의 정식 칭호로 미리 동일시하지 않고 본문 자체의 언어를 유지하는 것이 더 충실합니다.
  doctrine_reference: 본문 고유 칭호 보존; 후대 신학어로의 무리한 일치화 금지
- issue: 하늘의 변화가 상징이 아닌 우주적 갱신임을 유지
  chosen_reading: 하늘을 변하게 하여 복과 빛이 되게 하겠습니다
  alternative_readings:
  - 하늘을 복되고 빛나는 것으로 바꾸겠습니다
  - 하늘을 영원한 복과 빛으로 만들겠습니다
  rationale: 원문은 하늘 자체의 상태 변화를 말하므로, 이를 단순한 은유적 위로나 도덕적 개선으로 약화시키지 않고 재창조적 갱신의 이미지를 살렸습니다.
  doctrine_reference: 묵시문학적 우주 갱신 이미지 보존
