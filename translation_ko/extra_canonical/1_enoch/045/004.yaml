translation:
  language: ko
  text: 그날에 나는 내가 선택한 이를[b] 그들 가운데[a] 거하게 하고, 하늘을 변화시키고 그것이 영원히[c] 복과 빛이 되게 하겠습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들 한가운데에’입니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘내 택한 이’입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘영원한 복과 빛’으로 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: በይእቲ ዕለት
  english_pob_choice: On that day
  chosen_korean: 그날에
  alternatives_korean:
  - 그날
  - 그때에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 예언 공식의 시간 표현으로, 현대 한국어에서 자연스럽고 단정한 ‘그날에’가 원문의 장르를 잘 살립니다.
- source_word: አነብር ማእከሎሙ
  english_pob_choice: I will cause my Chosen One to dwell among them
  chosen_korean: 내 선택한 이를 그들 가운데 거하게 하고
  alternatives_korean:
  - 내 선택한 이를 그들 가운데 살게 하고
