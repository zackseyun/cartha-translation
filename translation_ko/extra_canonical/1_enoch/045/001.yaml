base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
  footnotes:
  - marker: a
    text: The Ge'ez wording after 'deny the name' is difficult. The phrase may mean 'the name of the dwelling of the holy ones and of the Lord of Spirits,' but other construals are possible.
    reason: textual_variant
  - marker: b
    text: '''Holy ones'' may refer to heavenly holy beings, the righteous, or a deliberately overlapping idea in this apocalyptic context.'
    reason: lexical_alternative
  - marker: c
    text: Or 'another parable'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 거룩한 이들의 거처와 영들의 주님의 이름을 부인하는 자들에 관한 둘째 비유입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 이들의 거처와 영들의 주님의 이름’을 함께 부인한다는 구조는 원문상 다소 압축되어 있어, 다른 문법적 연결로도 읽힐 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘거룩한 이들’은 천상적 거룩한 존재, 의인, 또는 둘이 겹친 개념일 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘둘째 비유’는 1 Enoch의 비유들이 번호로 배열된 문맥을 반영한 번역입니다.
    reason: previous_rendering
