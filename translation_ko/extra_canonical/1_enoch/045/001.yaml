  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘holy ones’를 전통 교회어 ‘성도’로 고정하지 않고, 에녹서의 천상적·종말론적 의미 가능성을 열어 두는 ‘거룩한 이들’로 옮겼습니다.
