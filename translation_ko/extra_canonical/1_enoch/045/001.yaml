  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 용어가 천상 존재와 의인 공동체를 모두 가리킬 수 있다는 점을 보존하기 위해, 교단 전통이 강한 ‘성도’ 대신 중립적인 표현을 택했습니다.
