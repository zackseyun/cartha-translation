base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
  footnotes:
  - marker: a
    text: Literally, 'I saw in the vision of my sleep.'
    reason: lexical_alternative
  - marker: b
    text: The animal imagery is symbolic within the Dream Visions; the translation preserves the vision's own terms rather than supplying identifications in the main text.
    reason: cultural_note
  - marker: c
    text: Or 'And again I saw with my eyes as I slept'.
    reason: previous_rendering
translation:
  language: ko
  text: 내가 네 어머니 에드나를 아내로 맞기 전에, 나는 내 침상에서 환상을 보았습니다[a]. 그런데 보니, 수소 한 마리가 땅에서 올라왔습니다[b]. 그 수소는 희었습니다. 그 뒤에 암송아지 한 마리가 나왔고, 그 암송아지와 함께 수소 두 마리가 나왔는데, 그중 한 마리는 검고 한 마리는 붉었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘내 잠자리의 환상에서’입니다.
    reason: lexical_alternative
  - marker: b
    text: 이 동물 이미지는 꿈의 환상 안에 있는 상징적 서술이므로, 본문은 해석을 덧붙이지 않고 동물 용어 자체를 유지했습니다.
    reason: cultural_note
