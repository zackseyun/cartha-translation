  rationale: ‘onto the earth’의 공간적 이동을 살리면서도, ‘into the earth’처럼 지하로 들어감을 미리 해석하지 않도록 ‘땅으로’로 옮겼습니다.
theological_decisions:
- issue: 환상 속 동물 이미지를 해석하지 않고 표면 형상대로 유지할지 여부
  chosen_reading: 검은 송아지와 붉은 송아지라는 환상적 표상을 그대로 보존했습니다.
  alternative_readings:
  - 가인과 아벨로 직접 풀어 쓰기
  - 상징 의미를 본문에 덧붙이기
