base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
  footnotes:
  - marker: a
    text: The Ge'ez wording suggests violent contact followed by pursuit. 'Struck' could also be rendered 'gored' in light of the bovine imagery.
    reason: lexical_alternative
  - marker: b
    text: '''Onto the earth'' may also be understood as ''to the ground'' or ''into the earth,'' depending on how concretely the motion is taken.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And that black heifer struck the red one and pursued it onto the earth, and after that I could no longer see that red heifer.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 검은 송아지가 그 붉은 송아지를 쳐서 땅으로 뒤쫓아갔고[a][b], 그 후에는 내가 그 붉은 송아지를 더 이상 볼 수 없었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 동사는 단순히 치는 것보다 더 거칠게 ‘들이받다’라는 뉘앙스도 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘땅으로’는 ‘땅 위로’나 ‘땅에’로도 옮길 수 있으며, 지면을 향한 이동을 나타냅니다.
    reason: lexical_alternative
