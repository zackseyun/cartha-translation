  rationale: 개정된 영문 POB가 ‘calf’를 채택하므로, 성별을 미리 단정하지 않는 중립적 보통명사 ‘송아지’가 가장 적합합니다.
- source_word: ውስተ ምድር
  english_pob_choice: onto the earth
