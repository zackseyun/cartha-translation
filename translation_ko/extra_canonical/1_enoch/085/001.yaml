  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 계시의 시각적 성격을 살려 ‘보여 주겠습니다’로 옮겼습니다.
theological_decisions:
- issue: ኵሎ ሕልመ의 범위
  chosen_reading: ‘또 다른 꿈’의 전체 내용
  alternative_readings:
  - 모든 꿈들
  - 꿈의 각 항목
  rationale: 문맥상 직전의 단수 ‘또 다른 꿈’을 가리키므로, 이 구절은 여러 꿈을 총칭하기보다 그 꿈 전체를 말하는 것으로 읽는 것이 가장 자연스럽습니다. 원문의 긴장을 살리되 범위를 과도하게 넓히지 않았습니다.
