base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
  footnotes:
  - marker: a
    text: Or “the vision of a dream.” The Ge'ez phrase combines seeing/vision language with dream language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에녹이 소리를 높여 자기 아들 메투셀라에게 말했습니다. 「너에게 말합니다, 내 아들아. 내 말을 들으십시오. 그리고 네 아버지의 꿈-환상에 귀를 기울이십시오.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “꿈의 환상.” 게에즈 표현은 ‘보다/환상’과 ‘꿈’의 언어를 함께 담고 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወአንሥአ
  english_pob_choice: lifted up his voice
  chosen_korean: 소리를 높여
  alternatives_korean:
  - 말을 시작하고
  - 목소리를 높여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 ‘말하다’보다 격식 있고 장중한 발화를 드러내는 동작이므로, 한국어에서는 자연스러운 관용인 ‘소리를 높여’로 옮겨 서술적 긴장과 엄숙함을 살렸습니다.
- source_word: ለከ እብለከ
  english_pob_choice: To you I speak
  chosen_korean: 너에게 말합니다
  alternatives_korean:
  - 너에게 말하노라
  - 내가 너에게 말합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞에 놓인 ‘너에게’로 대상 강조를 살리고, 현대 한국어 합쇼체로 직접성을 유지했습니다.
- source_word: ነገርየ
  english_pob_choice: my words
  chosen_korean: 내 말
  alternatives_korean:
  - 내 말씀
  - 내 이야기
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수성보다 발화 내용 전체를 가리키는 뜻이므로, 지나치게 경직된 ‘말씀’보다 중립적인 ‘내 말’이 원문에 더 가깝습니다.
- source_word: አጽንን እዝነከ
  english_pob_choice: incline your ear
  chosen_korean: 귀를 기울이십시오
  alternatives_korean:
  - 귀를 굽히십시오
  - 귀를 돌려 주십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역형보다 한국어에서 청취의 집중을 가장 분명히 드러내는 표현을 택하되, 요구하는 자세와 주의 깊은 경청의 의미는 유지했습니다.
- source_word: ለርእየ ሕልመ አቡከ
  english_pob_choice: the vision of your father’s dream
  chosen_korean: 네 아버지의 꿈-환상
  alternatives_korean:
  - 네 아버지의 꿈의 환상
  - 네 아버지의 환상적 꿈
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 ‘보기/환상’과 ‘꿈’의 결합을 모두 보존하려고 하이픈으로 결합해, 단순한 꿈으로 축소하지 않았습니다.
theological_decisions:
- issue: 꿈과 환상의 중첩 표현(ርእየ ሕልመ)
  chosen_reading: ‘꿈-환상’으로 병기해 두 요소를 함께 드러냅니다.
  alternative_readings:
  - ‘꿈’만 사용
  - ‘환상’만 사용
  - ‘꿈의 환상’
  rationale: 이 본문은 단순한 수면 경험이 아니라 계시적 시각성을 포함하므로, 한쪽 의미로 평탄화하지 않고 두 층위를 함께 남기는 것이 원문과 주석 전통에 더 충실합니다.
  doctrine_reference: 'Translation philosophy: preserve apocalyptic imagery; source-grounded optimal equivalence'
