base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
  footnotes:
  - marker: a
    text: Or “the vision of a dream.” The Ge'ez phrase combines seeing/vision language with dream language.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에녹은 목소리를 높여 자기 아들 메투셀라에게 말했습니다. 「내 아들아, 내가 너에게 말합니다. 내 말을 들으십시오. 그리고 네 아버지가 꾼 꿈의 환상[a]에 귀를 기울이십시오.」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “네 아버지의 꿈-환상.” 게에즈어 표현은 ‘보다/환상’의 어휘와 ‘꿈’의 어휘를 함께 결합합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወአንሥአ
  english_pob_choice: lifted up his voice
  chosen_korean: 소리를 높여
  alternatives_korean:
  - 말을 시작하고
