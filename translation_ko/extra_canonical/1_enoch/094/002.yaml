base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
  footnotes:
  - marker: a
    text: Or 'the ways of violence and death.' The Ge'ez noun is literally 'paths/ways' and is likely moral-metaphorical.
    reason: lexical_alternative
  - marker: b
    text: Or 'to the wise among men, from generation to generation'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 한 세대의 어떤 사람들에게는[a] 폭력과 죽음의 길들이 드러날 것이며, 그들은 그 길들에서 멀리 떨어져 그 길들을 따르지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘어떤 사람들’로 옮긴 말은 ‘알려진 사람들’을 뜻할 수도 있으며, ‘지혜로운 사람들’로 이해하는 번역도 있습니다. 이어지는 표현은 ‘한 세대에서/한 세대의’를 뜻합니다.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: እሙራን ለሰብእ
  english_pob_choice: to the wise among men / to certain men of a generation
  chosen_korean: 지혜로운 사람에게는
  alternatives_korean:
  - 사람들 가운데 지혜로운 이들에게는
  - 어떤 사람들에게는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영문 POB가 본문을 지혜의 수혜 대상으로 읽었지만, 후속 교정에서 እሙራን을 ‘certain men’으로 보기도 하므로, 한국어는 과도한 신학화 없이 수혜 대상을 간결하게 ‘지혜로운 사람’으로 두었습니다.
- source_word: ይትከሠት
  english_pob_choice: will be shown
  chosen_korean: 드러나며
  alternatives_korean:
  - 보여지며
  - 계시되며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동·반사적 의미의 ‘드러남’을 살려, 단순한 정보 전달보다 길 자체가 사람 앞에 나타나는 이미지를 유지했습니다.
- source_word: ፍኖዋተ ግፍዕ ወሞት
  english_pob_choice: the paths of violence and death
  chosen_korean: 폭력과 죽음의 길
  alternatives_korean:
  - 폭력과 죽음의 길들
  - 압제와 죽음의 길
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 복수형 ‘paths/ways’ 이미지를 한국어에서는 자연스럽게 단수 집합명사로 옮기되, moral-metaphorical 뉘앙스를 유지했습니다.
- source_word: ይርኅቁ እምኔሆሙ ወኢይትለውዎሙ
  english_pob_choice: they will keep far from them and will not follow them
  chosen_korean: 그들은 그 길에서 멀리 떨어져 그것을 따르지 않을 것입니다
  alternatives_korean:
  - 그것들로부터 멀리 떨어질 것이며 따르지 않을 것입니다
  - 그 길들을 멀리하며 뒤따르지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘멀리 떨어지다’와 ‘따르지 않다’로 거리 두기와 추종 거부를 함께 살려, 도덕적 회피의 의미를 분명하게 했습니다.
theological_decisions:
- issue: 지혜 수혜자의 범위
  chosen_reading: ‘지혜로운 사람’으로 옮겨, 본문이 특정 집단에게 길이 드러난다는 점은 유지하되, 2차 교정에서 제기된 ‘certain men’ 가능성도 신학적으로 과잉 확정하지 않았습니다.
  alternative_readings:
  - 어떤 사람들에게는
  - 사람들 가운데 지혜로운 이들에게는
  rationale: 본문은 길의 계시가 보편이 아니라 선택된 대상에게 주어진다는 점을 말하지만, 한국어 본문에서 그 선택성을 지나치게 좁히면 원문의 유동성을 잃을 수 있습니다.
  doctrine_reference: '번역학적 절제: 본문이 허용하는 범위 안에서만 대상의 특성을 표현함'
- issue: 폭력과 죽음의 길이라는 이미지
  chosen_reading: 추상화된 ‘악의 길’로 풀지 않고 ‘폭력과 죽음의 길’이라는 직유적 표현을 유지했습니다.
  alternative_readings:
  - 악한 길
  - 파멸의 길
  rationale: 게에즈의 구체적 도상은 경고의 강도를 높이므로, 교훈적 평준화보다 이미지 보존이 본문 의미를 더 잘 전달합니다.
  doctrine_reference: apocalyptic wisdom imagery preservation
