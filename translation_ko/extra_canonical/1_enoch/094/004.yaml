translation:
  language: ko
  text: 그러나 여러분 자신을 위하여 의로움과 좋은 삶[a]을 구하고 선택하십시오. 평강의 길들[b]을 따라 걸으십시오. 그리하면 여러분은 살고 번성할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘좋은 삶’에 해당하는 게에즈어 표현의 어절 분할과 판독은 이 OCR 전승에서 다소 불확실합니다. 여기서는 선함 또는 올바름으로 특징지어지는 삶이라는 뜻으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: 또는 ‘평강의 길을 따라 걸으십시오.’ 원문은 ‘길들’이라는 복수 이미지를 사용합니다.
    reason: lexical_alternative
