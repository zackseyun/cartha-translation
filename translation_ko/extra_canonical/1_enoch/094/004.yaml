translation:
  language: ko
  text: 그러므로 의로움과 좋은 삶을 여러분을 위해 선택하고, 평강의 길들을 걸으십시오. 그러면 여러분이 살고 번성할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 게에즈 구절은 OCR 및 분절이 다소 불확실하여, POB는 이를 ‘좋은 삶’으로 이해했습니다.
