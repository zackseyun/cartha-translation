  source_fidelity: 현 번역은 첫 권면 동사 ‘구하다/추구하다’(ፍቅዱ)를 누락하고 이를 ‘선택하다’로 대체했습니다. 또한 문두의 전환은 영어 POB 감사 기록과 개정 판독에 따라 ‘그러므로’보다 ‘그러나’가 적절합니다. 나머지의 ‘의로움’, ‘좋은 삶’, 평화의 길을 걷는 비유, 삶과 번성의 결말은 대체로 원문 및 영어 POB와 부합합니다.
  naturalness: ‘의로움과 좋은 삶을 여러분을 위해 선택하고’는 한국어에서 목적어와 여격 성분의 결합이 부자연스럽고, 두 동사 가운데 하나가 빠져 있습니다. ‘여러분 자신을 위하여 … 구하고 선택하십시오’로 하면 두 명령을 모두 보존하면서 자연스러운 합쇼체 권면이 됩니다. 각주 표지는 해당 어구 바로 뒤에 두는 것이 명확합니다.
  terminology: ‘의로움’은 포괄적인 윤리적 의의 의미를 유지하는 적절한 선택입니다. ‘평강’도 본문 문체에서 가능하나, 이 게에즈어 어구에 특정 교리적 함의를 부가하지 않도록 ‘평강의 길들’은 단지 본문의 복수 비유로 이해해야 합니다. ‘번성할 것입니다’는 물질적 부만을 뜻하도록 한정하지 않는 적절한 표현입니다.
