base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
  footnotes:
  - marker: a
    text: The clause rendered 'lay deceitful foundations' is somewhat uncertain in the Ge'ez wording, but it clearly continues the building image and links it with falsehood or fraud.
    reason: lexical_alternative
  - marker: b
    text: Or 'Woe to those who build up unrighteousness and oppression, and who lay deceitful foundations, for they will be swiftly overthrown, and they will have no peace.'.
    reason: previous_rendering
translation:
  language: ko
  text: 불의와 압제를 쌓아 올리고, 속임수의 기초를 놓는 자들에게 화가 있습니다. 그들은 속히 뒤엎어질 것이며, 평강이 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘속임수의 기초를 놓는’이지만, 원문은 건축 은유를 통해 기만의 기반을 세우는 행위를 가리키는 것으로 보입니다.
    reason: source_note
  - marker: b
    text: ‘뒤엎어질’은 건축된 악이 무너지는 이미지를 살린 번역입니다.
    reason: korean_style_note
