base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
  footnotes:
  - marker: a
    text: Or 'you have done it for reproach and for violence'; the opening verb can be rendered more literally as 'made/done,' but the context supports the sense of preparing something for a destined outcome.
    reason: lexical_alternative
  - marker: b
    text: '''The shedding of blood'' may also be rendered ''bloodshed.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'You have prepared it for reproach and for violence'.
    reason: previous_rendering
translation:
  language: ko
  text: 그대들은 수치와 폭력을 저질렀으며, 피가 흘려지는 날과 어둠의 날과 큰 심판의 날을 위하여 스스로를 예비하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘수치와 폭력을 행하였습니다’로 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘피가 흘려지는 날’은 ‘유혈의 날’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 목적어 표지가 붙은 연쇄로, ‘어둠의 날’이라는 종말론적 날 공식을 이룹니다.
    reason: source_note
lexical_decisions:
- source_word: ገበርክምዋ
  english_pob_choice: you have committed
  chosen_korean: 저질렀으며
  alternatives_korean:
  - 행하였으며
  - 범하였으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez 동사 ገበረ는 여기서 단순히 '하다'보다 죄책을 띤 '저지르다/범하다'가 문맥에 맞습니다. 영어 POB의 최종 수정도 'committed'로 정리되어 있어 이를 반영했습니다.
- source_word: ለጽርፈት ወለዓመፃ
  english_pob_choice: reproach and violence
  chosen_korean: 수치와 폭력
  alternatives_korean:
  - 치욕과 폭력
  - 모욕과 폭력
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ጽርፈት은 수치, 모욕, 비난의 뜻이 있으나, 종말 심판 문맥에서는 공동체적 수치와 수치를 가져오는 행위의 뉘앙스를 살리는 '수치'가 자연스럽습니다. ዓመፃ는 폭력적 악행을 가리키므로 '폭력'을 택했습니다.
- source_word: ወድልዋነ ኮንክሙ
  english_pob_choice: and you have made yourselves ready
  chosen_korean: 스스로를 예비하였습니다
  alternatives_korean:
  - 스스로 준비하였습니다
  - 스스로를 갖추었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절은 자신들이 다가올 날을 향해 준비된 상태가 되었다는 뜻이므로, 반사적 의미를 살려 '스스로를 예비하다'로 옮겼습니다. 격식 있는 종말 경고 문맥에도 잘 맞습니다.
- source_word: ለዕለተ ክዕወት ደም
  english_pob_choice: for the day of the shedding of blood
  chosen_korean: 피가 흘려지는 날
  alternatives_korean:
  - 피 흘림의 날
  - 유혈의 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB와 달리 더 직접적으로 원문 이미지에 붙여 옮겼습니다. '흘려지는'은 피가 흘러나오는 사건성을 드러내며, 원문의 종말적 날 공식도 유지합니다.
- source_word: ወለዕለተ ጽልመት
  english_pob_choice: and for the day of darkness
  chosen_korean: 어둠의 날
  alternatives_korean:
  - 흑암의 날
  - 캄캄한 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 '날' 공식과 결합할 때 '어둠의 날'이 간결하고 직역에 가깝습니다. 종말적 심판 이미지도 충분히 보존됩니다.
- source_word: ወለዕለተ ኵነኔ ዐቢይ
  english_pob_choice: and for the day of the great judgment
  chosen_korean: 큰 심판의 날
  alternatives_korean:
  - 위대한 심판의 날
  - 대심판의 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ዐቢይ는 '큰, 위대한'의 뜻이므로 '큰'을 택해 직설적으로 살렸습니다. '심판'은 ኵነኔ의 핵심 의미를 안정적으로 전달합니다.
theological_decisions:
- issue: ‘reproach and violence’의 수사적 성격과 심판 경고의 강도
  chosen_reading: 윤리적 비난이 아니라 종말 심판을 부르는 죄악 목록으로 읽어, 수치와 폭력을 저지른 결과가 다가올 심판의 날들과 연결되도록 옮겼습니다.
  alternative_readings:
  - 일반적인 도덕적 비난으로 완화하는 읽기
  - 폭력을 '억압'으로 순화하는 읽기
  rationale: 본문은 '날' 공식의 연쇄로 종말론적 경고를 형성하므로, 죄의 무게와 심판의 임박성을 약화시키지 않는 번역이 필요합니다.
  doctrine_reference: 에녹서의 묵시적 심판 언어를 보존하고, 죄와 심판의 연쇄를 희석하지 않음.
