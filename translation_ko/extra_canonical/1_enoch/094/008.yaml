base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
  footnotes:
  - marker: a
    text: Or 'you will depart from your riches.' The wording may imply being stripped of wealth, or more broadly leaving it behind in judgment.
    reason: lexical_alternative
  - marker: b
    text: Or 'from your riches you will go out'.
    reason: previous_rendering
translation:
  language: ko
  text: 너희 부자들에게 화가 있습니다. 너희는 너희 재물을 의지하였고, 너희 재물에서 떠나게 될 것이며[b], 너희가 재물을 누리던 때에 지극히 높으신 분을 기억하지 않았기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 직역하면 ‘너희 재물에서 떠나게 될 것이다’입니다. 이는 재물을 남겨 두고 떠나는 것 또는 심판으로 재물과 분리되는 것을 암시할 수 있으나, 원문은 그 방식과 범위를 분명히 밝히지 않습니다.
    reason: alternative_reading
