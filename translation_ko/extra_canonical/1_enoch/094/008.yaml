theological_decisions:
- issue: 재물에서 떠남의 정확한 범위
  chosen_reading: 재물 자체를 떠나는 이미지로 유지하되, 죽음이나 강제 박탈로 명시하지는 않았습니다.
  alternative_readings:
  - 재물을 버리고 떠나게 될 것
  - 재물에서 쫓겨나게 될 것
  - 죽어서 재물을 남기게 될 것
  rationale: 게으즈어 표현이 압축적이므로, 본문이 허용하는 심판의 분리 이미지를 보존하고 해석을 과잉 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: '''지극히 높으신 분''의 호칭 처리'
  chosen_reading: 하나님의 고유호칭으로서 인격적·묵시적 어조를 유지했습니다.
  alternative_readings:
  - 지극히 높으신 하나님
  - 가장 높으신 분
  rationale: 본문은 단순한 수식이 아니라 심판을 내리시는 신적 주권자를 가리키므로, 경어적이면서도 직접적인 호칭을 유지했습니다.
  doctrine_reference: Divine title in Jewish apocalyptic diction.
