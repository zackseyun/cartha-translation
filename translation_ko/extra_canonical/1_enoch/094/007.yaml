base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: ko
  text: 죄로 자기 집을 짓는 자들에게 화가 있습니다. 그들은 모든 기초에서 무너져 내릴 것이며, [칼에 쓰러질 것이며,] 금과 은을 모으는 자들은 심판에서 속히 멸망할 것입니다.[a][b]
  philosophy: formal
  footnotes:
  - marker: a
    text: ‘죄로’는 ‘by sin’의 원인·수단적 의미를 살린 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘모든 기초에서’는 문자적으로는 ‘모든 그들의 기초로부터’에 해당합니다.
    reason: source_note
lexical_decisions:
- source_word: በኃጢአት
  english_pob_choice: by sin
  chosen_korean: 죄로
  alternatives_korean:
  - 죄로써
  - 죄 가운데
  - 죄를 가지고
  lexicon: ኃጢአት
  rationale: 행위의 수단/방식을 나타내는 표현으로 이해하여, ‘by sin’을 자연스럽게 ‘죄로’라고 옮겼습니다. ‘죄로써’도 가능하지만 현대 한국어에서는 다소 문어적입니다.
- source_word: የሐንጹ፡ አብያቲሙ
  english_pob_choice: build their houses
  chosen_korean: 자기 집을 짓는
  alternatives_korean:
  - 그들의 집을 짓는
  - 집들을 세우는
  - 집을 건축하는
  lexicon: ቤት / ሐነፀ
  rationale: ‘집을 짓다’는 본문 이미지와 직접 대응하며, 과도한 건축 전문 용어보다 경고문맥에 더 적합합니다.
- source_word: እምኵሉ፡ መሠረቶሙ
  english_pob_choice: from all their foundations
  chosen_korean: 모든 기초에서
  alternatives_korean:
  - 모든 터전에서
  - 모든 토대에서
  - 모든 기초로부터
  lexicon: መሠረት
  rationale: ‘foundation’의 물리적·상징적 의미를 살리면서, 무너짐의 결과를 분명히 드러내기 위해 ‘기초’로 옮겼습니다.
- source_word: ወለብሩር
  english_pob_choice: gold and silver
  chosen_korean: 금과 은
  alternatives_korean:
  - 황금과 은
  - 금과 은을
  - 금은
  lexicon: ወርቅ / ብሩር
  rationale: 두 금속의 병렬을 그대로 살려 간결하게 옮겼습니다. ‘황금’은 가능하지만 본문은 일반적인 ‘금’이 더 직접적입니다.
theological_decisions:
- issue: 최종 심판 표현
  chosen_reading: ‘심판에서 속히 멸망할 것입니다’로 옮겨, 단순한 시간적 파멸이 아니라 판결적·종말론적 파괴를 드러냈습니다.
  alternative_readings:
  - ‘재판에서’
  - ‘판결 속에서’
  - ‘심판으로 곧 무너질 것입니다’
  rationale: 본문의 ‘빠르게/속히’와 파괴 어휘를 결합할 때, 결과가 하나님의 심판 행위 안에서 일어남을 분명히 하는 번역이 가장 적합합니다.
  doctrine_reference: 종말론적 심판
- issue: 칼에 쓰러질 것이라는 삽입구
  chosen_reading: 대괄호 안의 문구를 본문에 유지해, 전승상 부가되었을 가능성이 있는 경고를 삭제하지 않았습니다.
  alternative_readings:
  - 본문에서 생략
  - 각주로만 처리
  rationale: 영문 POB가 괄호로 보존한 전승적 이질성을 한국어 본문에서도 그대로 보여 주는 것이 감사 가능성을 높입니다.
  doctrine_reference: 본문 비평/전승 보존
