  - 그 안에서 걸어가십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 비유적 ‘길/행위’의 이미지를 살리기 위해 ‘걷다’를 유지했고, ‘그 안에서’로 의를 삶의 방식으로 연결했습니다.
- source_word: ፍኖዋተ ዓመፃ
  english_pob_choice: the paths of iniquity
  chosen_korean: 불의의 길들
  alternatives_korean:
