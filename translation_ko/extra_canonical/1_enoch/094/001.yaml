  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주어진 본문비평 흐름에 따라 ዓመፃ를 ‘불의’로 옮겨, 다음 절의 ‘폭력’ 어휘와 구별되는 반의어적 대비를 보존했습니다.
- source_word: ይትሐጐላ ወየሐፅፃ
  english_pob_choice: will quickly be destroyed and vanish
  chosen_korean: 속히 무너지고 사라질 것입니다
  alternatives_korean:
  - 속히 무너지고 사라질 것입니다
  - 속히 파괴되고 사라질 것입니다
  - 곧 무너져 없어질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사의 중첩된 종말감을 한국어로 과도하게 장황하지 않게 살리기 위해 ‘무너지다’와 ‘사라지다’를 병렬로 옮겼습니다.
theological_decisions:
- issue: ጽድቅ의 번역
  chosen_reading: ‘의’로 번역하여 삶의 방식과 언약적 윤리를 함께 드러냄
  alternative_readings:
  - ‘의로움’
  - ‘정의’
  rationale: 이 절은 지혜적 권면 속에서 삶의 길을 대조하므로, 사회법정적 뉘앙스가 더 강한 ‘정의’보다 넓은 윤리적·관계적 범위를 지닌 ‘의’가 본문 기능에 더 잘 맞습니다.
  doctrine_reference: 'POB 핵심어 일관성: צדק/δικαιοσύνη → 의'
