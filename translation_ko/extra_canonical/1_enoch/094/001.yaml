base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
  footnotes:
  - marker: a
    text: The Ge'ez wording behind 'worthy and acceptable' is somewhat difficult; the sense is that the paths of righteousness are fitting and approved, in contrast to the doomed paths of violence.
    reason: lexical_alternative
  - marker: b
    text: '''Violence'' may also be understood more broadly as injustice or wrongdoing; the verse contrasts two moral ways rather than merely two private choices.'
    reason: lexical_alternative
  - marker: c
    text: 'Or ''And now I say to you, my children: love righteousness, and walk in it; for the paths of righteousness are worthy and acceptable, but the paths of violence will quickly be destroyed and vanish.''.'
    reason: previous_rendering
translation:
  language: ko
  text: 내 자녀들아, 이제 내가 너희에게 말합니다. 의를 사랑하고 그 길을 걸으십시오.[b] 의의 길들은 마땅하며 받아들여지지만, 불의의 길들은[a] 속히 무너지고 사라질 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘불의’는 단지 개인적 비행만이 아니라, 의와 대조되는 넓은 도덕적·공동체적 왜곡을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 길을 걸으십시오’는 문자적 이동이 아니라, 의를 삶의 방식으로 따르라는 비유입니다.
    reason: korean_style_note
