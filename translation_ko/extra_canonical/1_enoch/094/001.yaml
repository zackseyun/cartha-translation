  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접적인 발화 공식을 한국어의 자연스러운 합쇼체로 옮겨, 권면의 구어성을 살리면서도 문체를 무너뜨리지 않았습니다.
