  - 내 아이들아
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 친자식적이고 교훈적인 호칭을 보존하되, 남성 한정이 되지 않도록 ‘자녀들’로 옮겼습니다.
- source_word: አፍቅርዋ ለጽድቅ
  english_pob_choice: love righteousness
  chosen_korean: 의를 사랑하고
  alternatives_korean:
