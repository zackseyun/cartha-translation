base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
  footnotes:
  - marker: a
    text: Or 'charge them in the intention of your hearts.' The Ge'ez combines inward thought/intention with the heart as the seat of resolve.
    reason: lexical_alternative
  - marker: b
    text: The clause 'no place will be found for it' is difficult. 'Place' may mean literal place, room, or opportunity for the evil teaching.
    reason: alternative_reading
  - marker: c
    text: The final clause is uncertain; it may mean that no affliction will remove it or cut it short.
    reason: textual_variant
  - marker: d
    text: Or 'And command them'.
    reason: previous_rendering
  - marker: e
    text: Or 'instruct'.
    reason: previous_rendering
  - marker: f
    text: Or 'trial'.
    reason: previous_rendering
translation:
  language: ko
  text: 여러분의 마음속 생각으로 그들에게 명하십시오. 내 말이 여러분의 마음에서 지워지게 하지 마십시오. 나는 죄인들이 사람들을 유혹하여 악한 지혜를 행하도록 할 것을 알고 있기 때문입니다. 그것은 설 자리를 전혀 찾지 못할 것이며, 어떤 유혹도 그것을 약화시키지 못할 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마음속 생각’은 원문의 ሐሊና와 ‘마음’을 함께 살린 표현으로, 내면의 의도와 숙고를 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘설 자리’는 문자적인 장소뿐 아니라 악한 지혜나 유혹이 들어설 여지 또는 기회를 가리킬 수 있습니다.
    reason: alternative_reading
  - marker: c
    text: 마지막 절은 본문이 난해합니다. ‘어떤 유혹도 그것을 약화시키지 못할 것입니다’ 외에, ‘어떤 환난도 그것을 끊어 내지 못할 것입니다’로 이해될 수도 있습니다.
    reason: alternative_reading
