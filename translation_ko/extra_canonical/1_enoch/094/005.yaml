  - 그들에게 명하시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령하다/명하다는 원문의 강한 권고·지시성을 살리며, 부드러운 ‘가르치다’보다 더 직접적으로 대응합니다.
- source_word: በሐሊና ልብክሙ
  english_pob_choice: in the thought of your hearts
  chosen_korean: 마음의 생각으로
  alternatives_korean:
  - 마음의 의도로
  - 마음의 뜻으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘생각/의도’와 ‘마음’이 함께 있는 내면적 결의의 표현을 한국어로 자연스럽게 옮기되, 단순한 감정보다 의식적 내적 결정을 드러내도록 했습니다.
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  english_pob_choice: sinners will tempt men
  chosen_korean: 죄인들이 사람들을 유혹하여
  alternatives_korean:
  - 죄인들이 사람들을 꾀어
  - 죄인들이 사람들에게 시험을 주어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기록된 수정과 어근 연결에 따라 ‘유혹하다’로 옮겨, 단순한 가르침이 아니라 악으로 끌어들이는 행위를 분명히 했습니다.
- source_word: ይግበሩ ጥበበ እኩየ
  english_pob_choice: practice evil wisdom
  chosen_korean: 악한 지혜를 행하게
  alternatives_korean:
  - 악한 지혜를 실천하게
  - 사악한 꾀를 행하게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘지혜’라는 역설적 표현을 유지해, 단순한 악행이 아니라 왜곡된 지혜/꾀라는 사본의 긴장을 살렸습니다.
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  english_pob_choice: no place will be found for it
  chosen_korean: 그것이 설 자리는 전혀 발견되지 않을 것이며
  alternatives_korean:
  - 그것을 위한 자리는 전혀 발견되지 않을 것이며
  - 그것이 들어갈 곳은 전혀 없을 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘place’를 문자적 장소보다 비유적 ‘설 자리/기회’로 살리되, 원문의 난해함을 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: 마지막 절의 ‘መከራ’와 동사 종결이 뜻하는 바
  chosen_reading: ‘어떤 유혹도 그것을 약화시키지 못할 것입니다’로, 원문의 난해한 종결을 일반화된 ‘줄어듦/약화’로 옮겼습니다.
  alternative_readings:
  - 어떤 환난도 그것을 끊어내지 못할 것입니다
  - 어떤 시험도 그것을 짧게 하지 못할 것입니다
  rationale: 게에즈 종결부는 본문상 불확실하므로, 의미를 좁혀 단정하지 않고 ‘유혹/시험의 효력 상실’이라는 문맥적 요지를 유지했습니다.
  doctrine_reference: 본문 난해 구절은 확정적 교리화보다 문맥 보존을 우선합니다.
