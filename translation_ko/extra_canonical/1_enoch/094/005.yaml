  to: 여러분의 마음속 생각으로 그들에게 명하십시오. 내 말이 여러분의 마음에서 지워지게 하지 마십시오. 나는 죄인들이 사람들을 유혹하여 악한 지혜를 행하도록 할 것을 알고 있기 때문입니다. 그것은 설 자리를 전혀 찾지 못할 것이며, 어떤 유혹도 그것을 약화시키지 못할 것입니다.[a][b][c]
  rationale: 문법적으로 잘못된 ‘그들을 명령하십시오’를 ‘그들에게 명하십시오’로 고치고, 직역투인 ‘마음의 생각’을 자연스러운 현대 한국어로 다듬었습니다. 죄인들이 사람들을 ‘유혹한다’는 수정된 어휘 판단, ‘악한 지혜’의 역설, 그리고 마지막 두 절의 난해함과 대명사 지시의 모호성은 유지했습니다.
