  chosen_korean: 마음의 생각으로
  alternatives_korean:
  - 마음의 의도로
  - 마음의 뜻으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘생각/의도’와 ‘마음’이 함께 있는 내면적 결의의 표현을 한국어로 자연스럽게 옮기되, 단순한 감정보다 의식적 내적 결정을 드러내도록 했습니다.
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  english_pob_choice: sinners will tempt men
  chosen_korean: 죄인들이 사람들을 유혹하여
  alternatives_korean:
  - 죄인들이 사람들을 꾀어
  - 죄인들이 사람들에게 시험을 주어
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기록된 수정과 어근 연결에 따라 ‘유혹하다’로 옮겨, 단순한 가르침이 아니라 악으로 끌어들이는 행위를 분명히 했습니다.
- source_word: ይግበሩ ጥበበ እኩየ
  english_pob_choice: practice evil wisdom
  chosen_korean: 악한 지혜를 행하게
  alternatives_korean:
  - 악한 지혜를 실천하게
  - 사악한 꾀를 행하게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘지혜’라는 역설적 표현을 유지해, 단순한 악행이 아니라 왜곡된 지혜/꾀라는 사본의 긴장을 살렸습니다.
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  english_pob_choice: no place will be found for it
  chosen_korean: 그것이 설 자리는 전혀 발견되지 않을 것이며
