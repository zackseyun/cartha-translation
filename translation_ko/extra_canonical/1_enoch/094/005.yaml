  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘place’를 문자적 장소보다 비유적 ‘설 자리/기회’로 살리되, 원문의 난해함을 과도하게 해석하지 않도록 했습니다.
theological_decisions:
- issue: 마지막 절의 ‘መከራ’와 동사 종결이 뜻하는 바
  chosen_reading: ‘어떤 유혹도 그것을 약화시키지 못할 것입니다’로, 원문의 난해한 종결을 일반화된 ‘줄어듦/약화’로 옮겼습니다.
  alternative_readings:
  - 어떤 환난도 그것을 끊어내지 못할 것입니다
  - 어떤 시험도 그것을 짧게 하지 못할 것입니다
  rationale: 게에즈 종결부는 본문상 불확실하므로, 의미를 좁혀 단정하지 않고 ‘유혹/시험의 효력 상실’이라는 문맥적 요지를 유지했습니다.
  doctrine_reference: 본문 난해 구절은 확정적 교리화보다 문맥 보존을 우선합니다.
