  - 여러분이 사라지지 않도록 하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결과·목적을 나타내는 경고절이므로 한국어에서는 의도 표현으로 풀어 주되, 종말론적 심판의 강도를 ‘멸망’으로 유지합니다.
theological_decisions:
- issue: ‘them’의 지시 대상
  chosen_reading: ‘그들’은 단지 추상적 ‘길’만이 아니라 그 악한 길과 죽음의 길에 속한 사람들까지 포함하는 경고로 이해했습니다.
  alternative_readings:
  - 추상적 길 자체만 가리킨다
  - 길과 그 길을 따르는 사람들을 모두 아울러 가리킨다
  rationale: 복수 대명사와 ‘가까이 가지 말라’는 경고는 단순한 공간적 접근보다 악한 삶의 방식과 그에 속한 사람들과의 결합을 경계하는 뜻이 더 자연스럽습니다.
  doctrine_reference: 에녹서의 윤리적 권면과 분리의 경고
