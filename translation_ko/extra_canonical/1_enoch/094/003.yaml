base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
  footnotes:
  - marker: a
    text: Or 'ways' instead of 'paths'; the image is the familiar moral metaphor of a course of life.
    reason: lexical_alternative
  - marker: b
    text: The final warning may also be rendered 'lest you perish' or 'lest you be swept away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 여러분에게 말합니다, 의로운 이들이여. 악한 길[a]이나 죽음의 길을 걷지 말고, 여러분이 멸망하지 않도록 그들에게 가까이 가지 마십시오.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 원문의 ‘paths/ways’에 해당하며, 도덕적 삶의 경로라는 비유를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 경고는 ‘멸망하지 않도록’ 외에 ‘망하지 않도록’ 또는 ‘휩쓸려 사라지지 않도록’으로도 옮길 수 있습니다. ‘그들’의 지시 대상은 악한 길과 죽음의 길을 따르는 이들로 이해할 수 있으나, 문맥상 넓게 남겨 두었습니다.
    reason: lexical_alternative
