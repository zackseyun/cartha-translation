base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
  footnotes:
  - marker: a
    text: Or 'ways' instead of 'paths'; the image is the familiar moral metaphor of a course of life.
    reason: lexical_alternative
  - marker: b
    text: The final warning may also be rendered 'lest you perish' or 'lest you be swept away.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이제 내가 여러분에게 말합니다, 의로운 이들이여. 악한 길로도, 죽음의 길로도 걷지 말고, 그들에게 가까이 가지 마십시오. 그러다가 여러분이 멸망하지 않도록 하십시오.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘길’은 원문의 ‘paths/ways’에 해당하며, 도덕적 삶의 경로라는 비유를 살린 표현입니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 경고는 ‘멸망하다’ 외에 ‘사라지다’, ‘휩쓸리다’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  english_pob_choice: And now
  chosen_korean: 이제
  alternatives_korean:
  - 그리고 이제
  - 이제 또
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 새로운 권면을 여는 시간 표지이므로, 한국어에서는 간결한 ‘이제’가 담화 전환을 가장 자연스럽게 살립니다.
- source_word: እብል
  english_pob_choice: I say
  chosen_korean: 내가 ... 말합니다
  alternatives_korean:
  - 내가 ... 말하노라
  - 내가 ... 이릅니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접적인 권면 발화이므로 ‘말합니다’가 화자의 선언성을 유지하면서 현대 합쇼체에 맞습니다.
- source_word: ለጻድቃን
  english_pob_choice: the righteous
  chosen_korean: 의로운 이들
  alternatives_korean:
  - 의인들
  - 의로운 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 윤리적 범주를 살리면서도 현대 한국어에서 자연스럽고 사람 지칭으로 부드럽게 읽히는 표현입니다.
- source_word: በፍኖዋተ እኩይ / ሞት
  english_pob_choice: in the paths of evil / in the paths of death
  chosen_korean: 악한 길로도, 죽음의 길로도
  alternatives_korean:
  - 악의 길로도, 죽음의 길로도
  - 악한 길과 죽음의 길로도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘paths/ways’의 도덕적 은유를 ‘길’로 옮겨 보존했고, ‘악한’과 ‘죽음의’는 병렬 구조를 살려 두 위험한 삶의 방향을 분명히 합니다.
- source_word: ኢትቅረቡ ኀቤሆሙ
  english_pob_choice: do not draw near to them
  chosen_korean: 그들에게 가까이 가지 마십시오
  alternatives_korean:
  - 그들에게 접근하지 마십시오
  - 그들에게 다가가지 마십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 대상은 악과 죽음의 길에 속한 이들까지 포함하는 경고로 이해되므로, ‘가까이 가지 마십시오’가 단순 이동이 아니라 교류·접근의 금지를 드러냅니다.
- source_word: ከመ ኢትትሐጐሉ
  english_pob_choice: lest you be destroyed
  chosen_korean: 그러다가 여러분이 멸망하지 않도록 하십시오
  alternatives_korean:
  - 여러분이 멸망하지 않도록
  - 여러분이 사라지지 않도록 하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결과·목적을 나타내는 경고절이므로 한국어에서는 의도 표현으로 풀어 주되, 종말론적 심판의 강도를 ‘멸망’으로 유지합니다.
theological_decisions:
- issue: ‘them’의 지시 대상
  chosen_reading: ‘그들’은 단지 추상적 ‘길’만이 아니라 그 악한 길과 죽음의 길에 속한 사람들까지 포함하는 경고로 이해했습니다.
  alternative_readings:
  - 추상적 길 자체만 가리킨다
  - 길과 그 길을 따르는 사람들을 모두 아울러 가리킨다
  rationale: 복수 대명사와 ‘가까이 가지 말라’는 경고는 단순한 공간적 접근보다 악한 삶의 방식과 그에 속한 사람들과의 결합을 경계하는 뜻이 더 자연스럽습니다.
  doctrine_reference: 에녹서의 윤리적 권면과 분리의 경고
