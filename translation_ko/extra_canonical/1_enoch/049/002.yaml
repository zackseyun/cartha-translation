  naturalness: 현대 표준 한국어 합쇼체에서 ‘숨은 모든 일들에서 강하십니다’와 ‘지속됨이 없을 것입니다’는 어색합니다. ‘모든 숨은 일에 능하십니다’, ‘더는 존속하지 못할 것입니다’가 자연스럽습니다. ‘영원히 영원하며’는 반복을 기계적으로 옮긴 표현이므로, 관용적이면서도 영속성을 보존하는 ‘영원무궁할 것이며’로 다듬었습니다.
  terminology: ‘의’, ‘불법’, ‘영들의 주님’은 묵시문학적 대조와 고유 신칭호를 적절히 보존합니다. ኅሩይ는 이 문맥에서 반복되는 인물 칭호이므로 ‘선택된 이’로 처리하고 해당 위치에 주석을 붙였습니다. 기존 주석 c와 d는 각각 영광과 선택된 분에 잘못 연결되어 있었으므로, 선택된 이와 ‘서 계시며’에 재배치하고 내용을 원문 및 한국어 번역에 맞게 수정했습니다.
