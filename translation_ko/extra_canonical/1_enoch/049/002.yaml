base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
  footnotes:
  - marker: a
    text: Or 'hidden matters of righteousness.' The Ge'ez phrase may refer to concealed dimensions or secrets belonging to righteousness.
    reason: lexical_alternative
  - marker: b
    text: Or 'will have no continuance.' The expression literally denies standing or abiding to lawlessness.
    reason: lexical_alternative
  - marker: c
    text: '''Chosen One'' is a recurring title in the Parables for the exalted figure associated with judgment and vindication.'
    reason: cross_reference
  - marker: d
    text: Or 'has stood'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 의의 숨은 모든 일들에서 강하십니다[a]. 그리고 불법은 그림자처럼 지나가며 지속됨이 없을 것입니다[b]. 이는 선택된 분이 영들의 주님 앞에 서 계시고, 그의 영광은 영원히 영원하며[c][d], 그의 권능은 대대로 있기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘의의 숨은 것들/비밀들’이 될 수 있습니다. Ge'ez의 복수형과 은폐된 차원을 함께 살리기 위해 본문은 ‘숨은 모든 일들’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 불법이 ‘서지/머무르지’ 못한다는 뜻을 담습니다. ‘지속됨이 없다’는 이를 자연스러운 한국어로 풀어 쓴 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘선택된 분’은 이 책의 반복되는 고유한 인물 호칭입니다. 여기서는 한국어 가독성을 위해 서술형으로 옮겼습니다.
    reason: cross_reference
  - marker: d
    text: 직역하면 ‘그의 영광은 영원히 영원하며’입니다. 반복형 영원 표현을 한국어의 관용적 종결로 살렸습니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ኃያል
  english_pob_choice: mighty
  chosen_korean: 강하십니다
  alternatives_korean:
  - 능력 있으십니다
  - 권능 있으십니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘강하다’는 위엄 있는 묵시 문맥에서 ‘mighty’를 자연스럽게 살리며, 단순한 체력적 강함보다 능력과 위세를 함께 드러냅니다.
- source_word: ኅቡአተ ጽድቅ
  english_pob_choice: hidden things of righteousness
  chosen_korean: 의의 숨은 모든 일들
  alternatives_korean:
  - 의의 숨은 것들
  - 의의 비밀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 복수형과 ‘숨은/감추어진’ 뉘앙스를 살리기 위해 ‘숨은 모든 일들’로 옮겼고, ‘비밀들’보다 덜 기술적이어서 본문 자체의 표현을 보존합니다.
- source_word: ዓመፃ
  english_pob_choice: lawlessness
  chosen_korean: 불법
  alternatives_korean:
  - 법 없음
  - 무법
  - 악
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘righteousness’와의 대조를 선명하게 유지하면서, 단순한 도덕적 악보다 질서와 규범의 부정을 드러내는 한국어로 ‘불법’을 택했습니다.
- source_word: ምቅዋመ አልቦ
  english_pob_choice: have no permanence / have no standing
  chosen_korean: 지속됨이 없을 것입니다
  alternatives_korean:
  - 서지 못할 것입니다
  - 머무름이 없을 것입니다
  - 지속되지 못할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 ‘서다/서 있음’ 이미지를 한국어에서 자연스럽게 전달하면서도, 심판 맥락의 ‘남지 못함’과 ‘지속되지 않음’을 함께 나타내기 위해 ‘지속됨이 없을 것입니다’로 번역했습니다.
- source_word: ኅሩይ
  english_pob_choice: Chosen One
  chosen_korean: 선택된 분
  alternatives_korean:
  - 택하신 이
  - 택함을 받은 이
  - 선택자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 절에서는 고유한 칭호라기보다 서술적으로 기능하므로, 현대 한국어에서 자연스럽고 과도한 기독교 용어화를 피하는 ‘선택된 분’을 사용했습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: Lord of Spirits
  chosen_korean: 영들의 주님
  alternatives_korean:
  - 영들의 주
  - 영들의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 표준 한국어의 경건한 호칭으로 ‘주님’을 사용하되, 복수형 ‘영들’의 집합적 표현을 그대로 살려 1 Enoch의 고유한 신칭호를 보존했습니다.
theological_decisions:
- issue: ‘선택된 분’의 칭호성 여부
  chosen_reading: 본문에서는 칭호를 과도하게 고정하기보다 서술형으로 번역했습니다.
  alternative_readings:
  - ‘선택자’로 음역성 있게 처리
  - ‘택하신 이’로 더 전통적 어법 사용
  rationale: 1 Enoch의 문맥상 인물 지칭은 중요하지만, 본절에서는 한국어 독자가 즉시 이해할 수 있도록 서술형을 택했습니다. 이는 후대 기독론적 용어를 본문에 덧씌우지 않으면서도 인물의 탁월성을 보존합니다.
  doctrine_reference: 본문 고유 의미 보존; 후대 용어 과잉투사 방지
- issue: ‘불법’과 ‘의’의 대조
  chosen_reading: 법적·도덕적 질서를 부정하는 ‘불법’으로 옮겼습니다.
  alternative_readings:
  - ‘악’
  - ‘무법’
  - ‘불의’
  rationale: 이 절은 의와 대칭되는 상태를 말하므로, 단순한 윤리적 악보다 질서의 부정을 드러내는 표현이 적합합니다. 이렇게 해야 ‘그림자처럼 지나감’과 ‘지속됨 없음’의 심판적 성격이 살아납니다.
  doctrine_reference: 묵시문학의 심판/질서 대조 유지
