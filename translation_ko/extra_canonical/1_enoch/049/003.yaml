base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
  footnotes:
  - marker: a
    text: Or 'dwelt upon him.' The Ge'ez verb can denote abiding or lodging.
    reason: lexical_alternative
  - marker: b
    text: Or 'the spirit of understanding.' The Ge'ez expression may describe either a spirit characterized by understanding or one that imparts it.
    reason: lexical_alternative
  - marker: c
    text: Literally 'those who sleep in righteousness'; likely an apocalyptic reference to the righteous dead, though 'those who rest in righteousness' is also possible.
    reason: alternative_reading
  - marker: d
    text: Or 'And upon him rested'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 안에는 지혜의 영, 깨닫게 하는 영[b], 가르침과 능력의 영[d], 그리고 의 안에서 잠든 이들의 영[c]이 거합니다[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그 안에 거한다’입니다. 게에즈 동사는 지속적으로 거함 또는 머묾의 뉘앙스를 가질 수 있습니다.
    reason: source_note
  - marker: b
    text: ‘깨닫게 하는’은 원문의 동사적 표현을 살린 번역입니다. ‘이해의 영’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 직역하면 ‘의 안에서 잠든 이들’입니다. 이는 묵시문학에서 의로운 죽은 이들을 가리키는 표현일 가능성이 크지만, ‘의 안에서 쉬는 이들’로도 이해할 수 있습니다.
    reason: theological_note
  - marker: d
    text: ‘가르침’은 원어의 teaching 또는 instruction에 해당합니다. ‘교훈’으로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦቱ፡ የኃድር
  english_pob_choice: And in him dwells
  chosen_korean: 그 안에 … 거하며
  alternatives_korean:
  - 그 안에 … 머물며
  - 그 안에 … 산다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보투(ቦቱ)는 ‘그 안에’로 읽는 것이 자연스럽고, የኃድር는 지속적 내주를 나타내므로 ‘거하다’가 ‘dwells’의 문맥과 어울립니다.
- source_word: መንፈሰ፡ ጥበብ
  english_pob_choice: the spirit of wisdom
  chosen_korean: 지혜의 영
  alternatives_korean:
  - 지혜를 주는 영
  - 지혜의 영이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 열거 구조를 살리기 위해 명사구로 압축했습니다. ‘지혜의 영’이 가장 सीधे(직접적)이며, 지혜의 성격을 지닌 영이라는 뜻을 보존합니다.
- source_word: ወመንፈስ፡ ዘያሌቡ
  english_pob_choice: and the spirit that gives understanding
  chosen_korean: 깨닫게 하는 영
  alternatives_korean:
  - 이해를 주는 영
  - 깨달음의 영
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ျaሌቡ의 동사적 힘을 살려 단순한 속성명사보다 ‘깨닫게 하는’으로 옮겼습니다. 이해/깨달음의 결과를 일으키는 영이라는 점을 드러냅니다.
- source_word: ወመንፈሰ፡ ትምህርት፡ ወኃይል
  english_pob_choice: and the spirit of instruction and might
  chosen_korean: 훈계와 능력의 영
  alternatives_korean:
  - 가르침과 능력의 영
  - 훈련과 힘의 영
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ትምህርት은 단순한 teaching보다 권면·훈육을 포함할 수 있어 ‘훈계’가 적절합니다. ኃይል은 격식을 살려 ‘능력’으로 옮겼습니다.
- source_word: ወመንፈሰ፡ እለ፡ ኖሙ፡ በጽድቅ
  english_pob_choice: and the spirit of those who sleep in righteousness
  chosen_korean: 의로 잠든 자들의 영
  alternatives_korean:
  - 의 안에서 쉬는 자들의 영
  - 의롭게 잠든 자들의 영
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘잠든’은 apocalyptic한 ‘sleep’ 이미지를 보존하며, ‘의로’는 በጽድቅ의 전치사적 의미를 간결하게 반영합니다.
theological_decisions:
- issue: 마지막 영 구절의 대상
  chosen_reading: 이 구절은 의로운 자들이 죽음 가운데서 ‘잠든’ 상태를 가리키며, 단순히 살아 있는 의인들의 안식을 말하는 것보다 죽은 의인의 범주를 우선적으로 떠올리게 합니다.
  alternative_readings:
  - 의 안에서 쉬는 자들의 영
  - 의로운 자들의 영
  rationale: ‘잠들다’는 묵시문학적 용례에서 죽음을 완곡하게 가리키는 경우가 많으므로, 그 긴장을 풀지 않고 한국어에서도 ‘잠든’ 이미지를 유지했습니다.
  doctrine_reference: 문맥이 허용하는 묵시적 표현은 평평하게 만들지 않고 보존합니다.
