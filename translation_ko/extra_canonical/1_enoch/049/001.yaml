  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
  footnotes:
  - marker: a
    text: The pronoun 'him' is left unspecified in the Ge'ez here; the wider context may point to a previously mentioned exalted figure, but the verse itself does not name the referent.
    reason: alternative_reading
  - marker: b
    text: Or 'glory will not come to an end before him.'
    reason: lexical_alternative
  - marker: c
    text: Or 'will be poured out'.
    reason: previous_rendering
translation:
  language: ko
  text: 지혜가 물처럼 쏟아져 나왔습니다[a][c][b], 그리고 영광은 그 앞에서 영원무궁토록 사라지지 않을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈 본문은 여기서 ‘그’의 선행사를 밝히지 않습니다. 더 넓은 문맥은 이전에 언급된 높은 존재를 가리킬 수 있으나, 이 절만으로는 특정할 수 없습니다.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘영광은 그 앞에서 끝나지 않을 것입니다.’
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘부어졌습니다’로 옮길 수 있습니다.
    reason: previous_rendering
