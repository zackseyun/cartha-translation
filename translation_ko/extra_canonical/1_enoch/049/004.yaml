theological_decisions:
- issue: ‘Chosen One’ 칭호의 한국어 처리
  chosen_reading: ‘택함 받은 이’로 옮겨 고유 칭호성을 유지하되, 후대 기독교적 정식 용어로 단정하지 않았습니다.
  alternative_readings:
  - 선택된 이
  - 택하심을 받은 이
  rationale: 이 에녹서 본문은 종말론적 인물을 가리키는 칭호를 사용하지만, 본문 자체의 어법을 넘어서는 동시대 교회 용어로 고정할 필요는 없습니다.
  doctrine_reference: Extra-canonical apocalyptic title preservation; avoid harmonization to later christological terminology.
- issue: ‘before the Lord of Spirits’의 관계 표현
  chosen_reading: ‘주 영들의 앞에서’로 본문 내 위치와 종속 관계를 살렸습니다.
  alternative_readings:
  - 영들의 주 앞에서
  - 영들의 주님 앞에서
  rationale: 지배격 구조를 직역해 칭호의 위계를 보존하되, 한국어로 읽히는 문장성을 확보했습니다.
  doctrine_reference: Source-order preservation; retain apocalyptic title structure.
