base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/034/001.yaml
  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
  footnotes:
  - marker: a
    text: Or 'a great resting-place.' The Ge'ez expression may denote either rest as a condition or a place characterized by rest; the context favors a location within Enoch's visionary journey.
    reason: lexical_alternative
  - marker: b
    text: Or 'toward the south'.
    reason: previous_rendering
  - marker: c
    text: Or 'a great place of rest'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 거기서 나는 북쪽[a]으로, 땅의 끝[c][b]들로 갔습니다. 그리고 거기서 나는 큰 놀라움을 보았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘북쪽을 향하여’.
    reason: alternative_reading
  - marker: b
    text: 또는 ‘남쪽으로’.
    reason: previous_rendering
  - marker: c
    text: 또는 ‘큰 휴식의 장소’.
    reason: previous_rendering
lexical_decisions:
- source_word: መስዕ
  english_pob_choice: toward the north
  chosen_korean: 북쪽으로
  alternatives_korean:
  - 북으로
  - 북방으로
  lexicon: Dillmann
  rationale: Ge'ez መስዕ는 ‘북쪽’을 뜻하므로, 영어 POB의 수정된 방향을 따라 한국어도 분명하게 ‘북쪽으로’로 옮겼습니다.
- source_word: በ'አጽናፈ ምድር
  english_pob_choice: to the ends of the earth
  chosen_korean: 땅의 끝들로
  alternatives_korean:
  - 땅 끝으로
  - 땅의 가장자리로
  lexicon: Dillmann
  rationale: 종말론적·우주론적 지리 언어를 살려 ‘땅의 끝들’로 옮겼고, ‘로’는 이동 방향을 드러냅니다.
- source_word: መንክረ ዐቢየ
  english_pob_choice: a great wonder
  chosen_korean: 큰 놀라움
  alternatives_korean:
  - 큰 경이
  - 큰 기이한 일
  lexicon: Dillmann
  rationale: 개정 판단에 따라 이 구는 ‘rest’가 아니라 ‘wonder, marvel’에 해당하므로, 현대 한국어에서 자연스럽고 직접적인 ‘큰 놀라움’으로 옮겼습니다.
- source_word: ርኢኩ
  english_pob_choice: I saw
  chosen_korean: 보았습니다
  alternatives_korean:
  - 보았습니다
  - 목격했습니다
  lexicon: Dillmann
  rationale: 환시 서술의 평이한 과거형을 살려, 문체를 높이되 과도하게 문학화하지 않는 ‘보았습니다’를 선택했습니다.
theological_decisions:
- issue: 장소/사건의 성격을 어떻게 보존할 것인가
  chosen_reading: ‘큰 놀라움’으로 옮겨, 장소 자체로 단정하지 않고 환시 속에서 본 기이한 광경이라는 열린 의미를 유지했습니다.
  alternative_readings:
  - 큰 경이
  - 큰 기이한 일
  rationale: 소스는 단순한 시각적 목격을 말하며, 위치 설명보다 ‘놀라움/경이’의 성격이 핵심입니다. 이를 지나치게 해석해 특정 장소 개념으로 고정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
