base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
  footnotes:
  - marker: a
    text: The 'second week' belongs to the symbolic week-structure of Enoch's historical apocalypse, not necessarily a literal seven-day period.
    reason: cultural_note
  - marker: b
    text: '''A man shall be saved'' preserves the singular. Many readers understand this as an allusion to Noah, but the verse does not name him.'
    reason: cross_reference
  - marker: c
    text: Or 'an ordinance/rule shall be enacted for the sinners'; the Ge'ez may imply a law concerning or even against sinners.
    reason: lexical_alternative
  - marker: d
    text: Or 'great evil; and deceit shall have sprung up in it. And in it'.
    reason: previous_rendering
translation:
  language: ko
  text: 나 뒤에 둘째 주에[a] 큰 악이 일어날 것이며, 그 안에서 속임수가 싹틀 것입니다. 그 안에서는 첫 번째 끝이 있을 것이며, 그 안에서 한 사람이 구원받을 것입니다[b]. 그 주가 끝난 뒤에는 불의가 자랄 것이며, 죄인들을 위하여 법이 제정될 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘둘째 주’는 문자적인 7일이 아니라 에녹서의 상징적 역사 주기 구조를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: ‘한 사람이 구원받을 것이다’는 단수형을 보존한 표현입니다. 많은 독자가 이를 노아에 대한 암시로 이해하지만, 본문은 그 이름을 밝히지 않습니다.
    reason: cross_reference
  - marker: c
    text: ‘법이 제정될 것입니다’는 ‘규례/질서가 세워질 것’으로도 옮길 수 있습니다. ‘죄인들을 위하여’는 죄인들을 위한, 죄인들에 관한, 또는 죄인들을 향한 법이라는 뉘앙스를 모두 남깁니다.
    reason: lexical_alternative
