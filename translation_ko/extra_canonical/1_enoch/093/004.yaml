  rationale: Ge‘ez의 수동/비인칭 구문을 살려 ‘제정되다’로 옮겼고, 전치사 ‘for’의 방향성은 본문 그대로 두었습니다.
theological_decisions:
- issue: ‘한 사람’의 정체
  chosen_reading: 본문의 단수성을 유지하고, 노아로 특정하지 않았습니다.
  alternative_readings:
  - 노아를 가리키는 한 사람으로 명시
  - 인류 일반을 뜻하는 집합적 표현으로 완화
  rationale: 에녹서의 더 넓은 문맥이 노아를 연상시킬 수는 있지만, 이 절 자체는 이름을 밝히지 않으므로 해석을 앞서지 않았습니다.
  doctrine_reference: 원문 우선과 해석 절제
- issue: ‘죄인들을 위하여 율법이 제정될 것’의 모호성
  chosen_reading: 법/규범의 제정이라는 가장 직접적인 의미를 본문에 유지했습니다.
  alternative_readings:
  - 죄인들을 향한 심판이 정해질 것이다
  - 죄인들에 대한 규례가 시행될 것이다
  rationale: Ge‘ez가 허용하는 의미 범위를 본문에서 미리 하나로 좁히지 않고, 독자가 후속 문맥과 함께 판단하도록 남겨 두었습니다.
  doctrine_reference: 의도적 모호성 보존
