  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 지적 무지보다 상태의 상실을 드러내는 ‘눈멀다’를 택해, POB가 유지한 영적·도덕적 무감을 살렸습니다.
