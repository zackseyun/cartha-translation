base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
  footnotes:
  - marker: a
    text: Or 'all within it will be blind/darkened.' The Ge'ez wording likely describes the people of the sixth week as spiritually blinded.
    reason: lexical_alternative
  - marker: b
    text: Or 'a man will arise.' The verb can suggest rising or ascending; the more literal 'ascend' is kept to preserve the text's ambiguity.
    reason: lexical_alternative
  - marker: c
    text: '''House of the kingdom'' may refer broadly to the royal order or dynasty, not necessarily only a physical building.'
    reason: lexical_alternative
  - marker: d
    text: '''Chosen root'' combines lineage imagery with plant imagery; it may denote an elect line or remnant.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이 일 후에, 여섯째 주에 그 안에 있는 모든 이가 눈멀 것이며[a], 그들 모두의 마음은 지혜를 잊을 것입니다. 그 안에서 한 사람이 올라갈 것이며[b], 그 주기가 끝날 때 왕국의 집은 불에 타버릴 것이고[c], 그 안에서 선택된 뿌리의 온 족속이 흩어질 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘눈멀 것입니다’는 ‘어두워질 것입니다’로도 옮길 수 있습니다. 원문은 여섯째 주에 속한 이들의 눈멂 또는 어두워짐의 상태를 묘사합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘올라갈’은 ‘일어날’ 또는 ‘등장할’의 뜻을 가질 수도 있습니다. 여기서는 원문의 상승 이미지를 보존하기 위해 ‘올라갈’로 옮겼습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘왕국의 집’은 단순한 건물만이 아니라 왕조나 통치 질서를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘선택된 뿌리’는 혈통과 식물의 이미지를 함께 지닌 표현입니다. 특정 인물이나 단일 계보로 한정하지 않았습니다.
    reason: theological_note
