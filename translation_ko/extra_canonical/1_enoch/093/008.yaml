theological_decisions:
- issue: ‘한 사람이 올라갈’의 정체
  chosen_reading: 대상을 특정하지 않고 ‘한 사람이 올라갈 것’으로 유지했습니다.
  alternative_readings:
  - 메시아적 인물이 일어날 것이다
  - 어떤 통치자가 등장할 것이다
  - 한 사람이 일어날 것이다
  rationale: 원문은 단지 ‘한 사람’과 ‘올라가다’만 말하므로, 역사적·메시아적 동일시를 덧씌우지 않고 모호성을 보존했습니다.
  doctrine_reference: 원문 우선, 의미 과잉 규정 금지
- issue: ‘왕국의 집’의 범위
  chosen_reading: ‘왕국의 집’으로 직역해 왕조/통치 질서/궁전 가능성을 모두 열어 두었습니다.
  alternative_readings:
  - 왕실
  - 왕조
  - 궁전
  rationale: 불에 타는 대상이 제도인지 건물인지 원문이 좁혀 주지 않으므로, POB의 투명성을 따라 의미 범위를 보존했습니다.
  doctrine_reference: 해석적 축소를 피하고 긴장을 유지
