  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 아포칼립스의 주기적 구조를 가리키는 표현이므로, 문자적 안식일보다 상징적 기간을 드러내는 ‘주’가 적절합니다.
