  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 불특정 단수 인물을 지시하므로 ‘한 사람’으로 옮기고, 수동적 선택의 의미를 ‘택함을 받을’로 살렸습니다.
- source_word: ለተክለ ኵነኔ ጽድቅ
  english_pob_choice: as the plant of righteous judgment
  chosen_korean: 의로운 심판의 나무로
  alternatives_korean:
  - 의의 심판의 나무로
  - 의로운 판결의 나무로
  - 의로운 심판의 식물로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 식물 비유를 유지하면서, 한국어에서 자연스러운 은유인 ‘나무’로 옮겨 원문의 식물성 이미지를 보존했습니다.
- source_word: ለተክለ ጽድቅ
  english_pob_choice: the plant of righteousness
  chosen_korean: 의의 나무
  alternatives_korean:
  - 의의 식물
  - 의로운 나무
  - 의의 심는 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 식물 이미지를 앞선 구절과 맞추어 ‘나무’로 유지하여, 이후에 이어지는 출현 이미지를 일관되게 살렸습니다.
- source_word: ለዓለመ ዓለም
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁하도록
  alternatives_korean:
