  lexicon: Dillmann, Lexicon Liguae Aethiopicae
  rationale: 겹겹의 영속 표현을 한국어의 격식 있는 지속 표현으로 옮겼습니다.
theological_decisions:
- issue: 선택된 ‘사람’의 신원
  chosen_reading: 본문은 이름을 밝히지 않으므로, 본문 그대로 ‘한 사람’으로 남깁니다.
  alternative_readings:
  - 에녹
  - 노아
  - 아브라함
  - 의로운 지도자 일반
  rationale: 시 자체가 특정 인물을 명시하지 않으므로, 해석을 본문에 앞서 주입하지 않고 모호성을 보존합니다.
  doctrine_reference: '번역 원칙: 본문이 해소하지 않은 긴장을 임의로 해결하지 않음'
- issue: 식물 비유의 보존
  chosen_reading: 두 절 모두 식물 이미지를 유지해 ‘나무’로 번역합니다.
  alternative_readings:
  - 후손
  - 계보
  - 공동체
  rationale: 원문은 종말론적 상징으로서 식물 비유를 분명히 사용하므로, 추상화하여 의미를 평탄화하지 않습니다.
  doctrine_reference: '번역 원칙: 상징적 이미지를 설명문으로 바꾸지 않음'
