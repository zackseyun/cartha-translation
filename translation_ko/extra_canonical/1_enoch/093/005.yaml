  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘셋째 주’를 받는 말로서 그 기간의 종결 지점을 자연스럽게 나타냅니다.
- source_word: ይትኃረይ ብእሲ
  english_pob_choice: a man shall be chosen
  chosen_korean: 한 사람이 … 택함을 받을 것이며
