base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
  footnotes:
  - marker: a
    text: Or 'the glorious house and the kingdom shall be built forever,' if መንግሥት is taken as a second coordinated element rather than part of the house's description.
    reason: alternative_reading
  - marker: b
    text: In the Apocalypse of Weeks, 'week' refers to a symbolic period in Enoch's historical vision, not necessarily a literal seven-day span.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 그 뒤에, 다섯째 주에, 그것이 끝날 때까지 영광과 왕권의 집이 세워질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘영광스러운 집과 왕권이 세워질 것입니다’로도 옮길 수 있습니다. መንግሥት을 집의 수식이 아니라 별도의 병렬 요소로 볼 경우입니다.
    reason: alternative_reading
  - marker: b
    text: 여기서 ‘주’는 문자적인 7일이 아니라 에녹의 묵시적 역사 시퀀스 속 상징적 기간을 가리킵니다.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  english_pob_choice: after this
  chosen_korean: 그리고 그 뒤에
  alternatives_korean:
  - 이후에
  - 이 일 뒤에
  - 그 다음에
  lexicon: Dillmann
  rationale: 시간 전환 공식으로서 앞선 환상을 이어 주므로, 한국어에서는 간결한 순차 표현인 ‘그리고 그 뒤에’가 문맥과 잘 맞습니다.
- source_word: ኃምስ ሰንበት
  english_pob_choice: the fifth week
  chosen_korean: 다섯째 주
  alternatives_korean:
  - 다섯째 주간
  - 다섯째 칠일 기간
  - 다섯째 안식일
  lexicon: Dillmann
  rationale: 이 문맥의 ሰንበት은 문자적 안식일이 아니라 예언적 주기이므로, 한국어도 ‘주’로 옮겨 상징적 시기라는 점을 살렸습니다.
- source_word: ቤተ ስብሐት ወመንግሥት
  english_pob_choice: the house of glory and kingship
  chosen_korean: 영광과 왕권의 집
  alternatives_korean:
  - 영광의 집과 왕권
  - 영광스러운 집과 왕권
  - 영광과 나라의 집
  lexicon: Dillmann
  rationale: ‘집’에 두 명사를 연결한 구조를 살려, ‘영광’과 ‘왕권’을 분리된 두 건물이 아니라 한 집의 성격으로 보이게 했습니다.
- source_word: ይትሐነጽ
  english_pob_choice: shall be built
  chosen_korean: 세워질 것입니다
  alternatives_korean:
  - 지어질 것입니다
  - 건축될 것입니다
  - 세워집니다
  lexicon: Dillmann
  rationale: 성전적 이미지를 유지하면서도 현대 한국어에서 자연스러운 완성 표현인 ‘세워질 것입니다’를 택했습니다.
theological_decisions:
- issue: መንግሥት을 ‘kingdom’으로 나눌지, ‘왕권’으로 볼지
  chosen_reading: ‘왕권’으로 읽어 영광과 함께 하나의 집을 수식하는 표현으로 처리했습니다.
  alternative_readings:
  - ‘영광의 집과 나라가 세워질 것입니다’
  - ‘영광과 왕국의 집이 세워질 것입니다’
  rationale: 게에즈 구문은 ‘집’과 뒤의 두 명사를 가장 자연스럽게 결합하므로, 두 요소를 분리하기보다 왕적 통치의 성격을 드러내는 ‘왕권’으로 옮기는 것이 본문의 긴장을 보존합니다.
  doctrine_reference: 묵시적 상징어의 다의성을 보존하고, 텍스트가 제시하는 성전-왕권 이미지를 과도하게 분해하지 않습니다.
