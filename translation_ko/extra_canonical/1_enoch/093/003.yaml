- issue: 문장 말미의 윤리어 짝
  chosen_reading: ‘의와 정의가 아직도 지속되고 있었습니다’로 처리했습니다.
  alternative_readings:
  - 의와 공의가 아직도 지속되고 있었습니다
  - 의와 의로움이 아직도 지속되고 있었습니다
  rationale: 원문 말미는 시대의 특징을 묘사하는 긍정적 윤리 짝이므로, 한국어에서도 서로 구분되는 두 윤리 개념을 유지했습니다.
