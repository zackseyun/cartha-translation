base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
  footnotes:
  - marker: a
    text: The phrase 'from the books' likely presents Enoch as reading or reciting from written records, not merely speaking spontaneously.
    reason: cultural_note
  - marker: b
    text: '''First week'' refers to the symbolic historical periodization of the Apocalypse of Weeks, not necessarily to a literal seven-day week.'
    reason: cross_reference
  - marker: c
    text: The word rendered 'uprightness' is textually difficult in this OCR witness; alternatives such as 'truth,' 'integrity,' or 'justice' are possible.
    reason: textual_variant
  - marker: d
    text: Or 'until the time when righteousness and uprightness shall endure.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 에녹은 책들[a]에서 말하기 시작하며, 이렇게 말했습니다. “나는 첫째 주에 일곱째로 태어났습니다[b][c], 그때는 의와 정의가 아직도 지속되고 있었습니다[d].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘책들에서’는 에녹이 즉흥적으로 말하는 것이 아니라 기록된 문헌을 출처로 삼아 말한다는 뜻을 살립니다.
    reason: source_note
  - marker: b
    text: ‘첫째 주’는 문자적 일주일이 아니라 아포칼립스의 주기적 역사 구분을 가리킵니다.
    reason: cross_reference
  - marker: c
    text: 이 구절의 끝부분은 필사 전승상 어휘가 불안정하여, 윤리어의 정확한 대응은 문맥에 따라 다소 달라질 수 있습니다.
    reason: textual_variant
  - marker: d
    text: 영문 본문의 ‘still endured’는 과거 시점에서의 지속 상태를 나타냅니다.
    reason: previous_rendering
