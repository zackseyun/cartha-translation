  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
  footnotes:
  - marker: a
    text: Or 'the holy ones and the righteous.' The Ge'ez expression can be read substantivally, and the exact referent may remain somewhat open in apocalyptic context.
    reason: lexical_alternative
  - marker: b
    text: The final noun is difficult. It may suggest something planted, enclosed, or prepared for them; compare possibilities such as 'garden' or 'planting.'
    reason: lexical_alternative
  - marker: c
    text: Or 'an order for generation after generation shall be made for them, and an enclosure shall be made for them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 일 후에, 네 번째 주가 끝날 무렵에, 거룩한 자들과 의인들의 환상이 보일 것이며, 그들을 위해 세대에서 세대로 이어질 율법과 울타리가 마련될 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘거룩한 자들과 의인들’로도 읽을 수 있습니다. 게에즈 표현은 명사적으로 읽힐 수 있어, 정확한 지시 대상은 묵시문학 문맥에서 다소 열려 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 명사는 뜻이 어렵습니다. 심어진 것, 둘러싸인 것, 또는 그들을 위해 마련된 것을 가리킬 수 있으며, ‘정원’이나 ‘심음’과 비교할 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘세대에서 세대로 이어질 질서가 그들을 위해 마련될 것이며, 울타리가 그들을 위해 마련될 것이다’로도 옮길 수 있습니다.
    reason: previous_rendering
