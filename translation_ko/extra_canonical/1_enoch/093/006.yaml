theological_decisions:
- issue: ‘거룩한 자들과 의인들’의 referent
  chosen_reading: 주로 믿는 자들의 집단을 가리키며, 본문에서는 인간적·윤리적 범주를 우선 드러냅니다.
  alternative_readings:
  - 천상적 거룩한 존재들
  - 천사와 의인의 혼합 집단
  rationale: ‘의인들’과의 병렬은 인간적 독자를 강하게 시사하지만, 묵시문학의 상징성은 완전히 닫지 않도록 남겨 둡니다.
  doctrine_reference: 해석의 긴장을 보존합니다.
- issue: ‘율법’의 범위
  chosen_reading: 세대마다 지속될 규범적 질서로서의 율법입니다.
  alternative_readings:
  - 단순한 질서
  - 규례
  - 법
  rationale: 이 절은 앞선 심판/질서와 대비되는 언약적·규범적 장치를 가리키므로, 의미를 약화시키지 않는 범위에서 '율법'을 택했습니다.
  doctrine_reference: 해석의 긴장을 보존합니다.
