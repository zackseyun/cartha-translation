base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
  footnotes:
  - marker: a
    text: Or 'chosen of the age,' if ዓለም is heard in the sense of an age or world-order rather than the created world as such.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'tablets of heaven' reflects a common Enochic image of heavenly records; the Ge'ez expression may also be understood more generally as the writing or books of heaven.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''And Enoch said concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness: of these I will speak to you''.'
    reason: previous_rendering
  - marker: d
    text: Or 'in a vision of heaven'.
    reason: previous_rendering
  - marker: e
    text: Or 'from the words of the holy angels'.
    reason: previous_rendering
translation:
  language: ko
  text: 에녹이 말했습니다. “의의 자녀들과 세상의 선택된 이들[a]과 올곧음의 식물에 관하여, 나의 자녀들이여, 나 에녹은 하늘의 환상으로부터 내게 보인 것과 거룩한 천사들의 말로부터 내가 알게 된 것과 하늘의 서판들[b]에서 내가 깨달은 것을 너희에게 말하고 알려 드리겠습니다.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘세상의’는 ዓለም을 문자적으로 따른 것입니다. 문맥상 ‘세대의’ 또는 ‘시대의’로도 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 서판들’은 에녹 문학에서 흔한 하늘의 기록 이미지입니다. 더 일반적으로 ‘하늘의 글’ 또는 ‘하늘의 책들’로도 옮길 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  english_pob_choice: children of righteousness
  chosen_korean: 의의 자녀들
  alternatives_korean:
  - 의의 아들들
  - 의로운 자녀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 혈연 은유를 유지하되, 한국어에서는 '자녀들'이 성별을 좁히지 않으면서 집단 정체성을 자연스럽게 드러냅니다. '의'는 에녹 문맥의 종말론적 의인 집단을 가장 직접적으로 반영합니다.
- source_word: ኅሩያነ፡ ዓለም
  english_pob_choice: chosen of the world
  chosen_korean: 세상의 선택된 자들
  alternatives_korean:
  - 세상의 선택자들
  - 세대의 선택된 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''선택된 자들''은 POB의 ''chosen''을 현대 한국어에서 자연스럽게 살리고, ''세상''은 본문의 literal한 대응을 유지합니다. ''age''의 가능성은 본문이 열어 두므로 주석으로 처리하는 편이 더 적절합니다.'
- source_word: ተክለ፡ ርትዕ
  english_pob_choice: plant of uprightness
  chosen_korean: 올곧음의 식물
  alternatives_korean:
  - 의의 새싹
  - 올바름의 심은 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 식물 이미지를 보존하여 에녹계의 비유적·묵시적 어조를 살렸습니다. '올곧음'은 ርትዕ의 도덕적 직선성과 단단함을 함께 전달합니다.
- source_word: እምራእየ፡ ሰማይ / እምቃለ፡ ቅዱሳን፡ መላእክት / እምነ፡ ጸፍጸፈ፡ ሰማይ
  english_pob_choice: what was shown to me from a vision of heaven / what I learned from the words of the holy angels / understood from the tablets of heaven
  chosen_korean: 하늘의 환상에서 내게 보여 준 것 / 거룩한 천사들의 말씀에서 내가 배운 것 / 하늘의 판들에서 내가 깨달은 것
  alternatives_korean:
  - 하늘의 환상으로부터 내게 보인 것
  - 거룩한 천사들의 말을 통해 내가 배운 것
  - 하늘의 돌판들에서 내가 깨달은 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 개의 출처 표지를 각각 '에서'로 살려, 계시의 근원을 병렬로 드러냈습니다. '판들'은 에녹문학의 하늘 기록 이미지를 유지하며, '말씀'은 ቃል의 단수성을 반영해 천사적 계시의 전달 내용을 살립니다.
theological_decisions:
- issue: 세 집단 명칭의 관계
  chosen_reading: 본문은 의의 자녀들, 세상의 선택된 자들, 올곧음의 식물을 에녹계 묵시어로 병렬 제시하며, 동일 집단인지 서로 겹치는지 단정하지 않고 긴장을 유지합니다.
  alternative_readings:
  - 세 표현을 단순한 동의적 수식으로 보는 해석
  - 각각 다른 종말론적 집단으로 구분하는 해석
  rationale: 원문은 설명 없이 복수의 호칭을 포개므로, 번역도 이를 해소하지 않고 그대로 드러내는 것이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 하늘의 판들 이미지
  chosen_reading: '''하늘의 판들''을 실제 기록 매체의 묵시적 이미지로 보존했습니다.'
  alternative_readings:
  - '''하늘의 책들''로 일반화하는 해석'
  - 단순히 '하늘의 기록'으로 완화하는 해석
  rationale: 에녹 문학의 전형적 모티프를 흐리지 않고, 문자 그대로의 형상을 살리기 위해 구체적 이미지를 유지했습니다.
  doctrine_reference: Original-language primacy over smoothing toward generic paraphrase.
