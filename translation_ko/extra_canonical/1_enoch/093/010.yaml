base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
  footnotes:
  - marker: a
    text: Or 'the seven instructions,' or 'the seven kinds of instruction.' The Ge'ez phrase after 'will be given to them' is difficult, and the numeral may modify the teaching as a complete sevenfold body.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'plant of righteousness' preserves the text's agricultural image rather than reducing it to an abstract idea such as 'community' or 'foundation.'
    reason: cultural_note
  - marker: c
    text: Or 'and to them will be given'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그것이 완성될 때에, 선택받은 의로운 이들이 영원한 의의 식물에서 가려질 것이며, 그들에게는 그가 창조하신 모든 것에 관한 일곱 겹의 교훈이 주어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘일곱 교훈’ 또는 ‘일곱 종류의 교훈’입니다. ‘교훈’ 앞의 수사 표현은 해석하기 어려우며, 교훈 전체가 일곱 겹의 체계를 이룬다는 뜻일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘의의 식물’은 이를 ‘공동체’나 ‘기초’ 같은 추상적 개념으로 바꾸지 않고, 원문의 농경적 이미지를 보존한 번역입니다.
    reason: cultural_note
lexical_decisions:
- source_word: በተፍጻሜታ
  english_pob_choice: at its completion
  chosen_korean: 그것이 완성될 때에
  alternatives_korean:
  - 그 끝에
  - 완성될 때
  lexicon: Dillmann
  rationale: 앞선 기간의 종결 시점을 나타내는 시간부사구이므로, 문맥을 과잉특정하지 않으면서 자연스럽게 옮겼습니다.
- source_word: ይትኃረዩ ኅሩያን ጻድቃን
  english_pob_choice: will be selected / the chosen righteous ones
  chosen_korean: 선택된 의로운 자들이 ... 선택될 것이며
  alternatives_korean:
  - 선택된 의인들이 ... 뽑힐 것이며
  - 택함 받은 의로운 자들이 ... 택함 받을 것이며
  lexicon: Dillmann
  rationale: 선택됨과 의로움이라는 두 요소를 모두 살리되, 한국어에서 어색한 중복을 최소화하기 위해 앞의 수식은 명사구로, 뒤의 동사는 수동 미래로 옮겼습니다.
- source_word: እምተክለ ጽድቅ ዘለዓለም
  english_pob_choice: from the eternal plant of righteousness
  chosen_korean: 영원한 의의 나무에서
  alternatives_korean:
  - 영원한 의의 식물에서
  - 영원한 의의 심긴 것에서
  lexicon: Dillmann
  rationale: POB의 'plant'는 추상화하지 말고 식물/나무의 농경적 이미지를 보존해야 하므로, 자연스러운 성서 한국어 감각을 고려해 '나무'로 옮겼습니다.
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  english_pob_choice: the sevenfold instruction
  chosen_korean: 일곱fold의 교훈
  alternatives_korean:
  - 일곱 가지 교훈
  - 일곱fold의 가르침
  - 일곱 종류의 교훈
  lexicon: Dillmann
  rationale: 어려운 구문이라는 점을 반영해 수량적 총체성을 유지하되, 본문의 불확실성을 드러내기 위해 '일곱fold'를 그대로 표기했습니다.
- source_word: በኵሉ ፍጥረት ዚአሁ
  english_pob_choice: concerning all his creation
  chosen_korean: 그의 모든 창조에 관한
  alternatives_korean:
  - 그의 모든 피조물에 관한
  - 그의 모든 창조에 대하여
  lexicon: Dillmann
  rationale: 범위와 주제를 나타내는 구문이므로 '관한'으로 자연스럽게 연결했고, collective sense를 살려 '창조'를 택했습니다.
theological_decisions:
- issue: 선택과 의로움의 병렬 유지
  chosen_reading: 선택된 의로운 자들
  alternative_readings:
  - 택함 받은 의인들
  - 의롭게 선택된 자들
  rationale: 선택과 의로움은 서로 다른 강조점이므로 하나로 흡수하지 않고 병렬로 유지해 본문의 종말론적 긴장을 보존했습니다.
  doctrine_reference: 원문 우선, 신학적 긴장 보존
- issue: 농경적 이미지 보존
  chosen_reading: 의의 나무
  alternative_readings:
