base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
  footnotes:
  - marker: a
    text: Or 'hear the word/speech of the Holy One'; the Ge'ez noun can cover voice, word, or utterance. 'Voice' is chosen because it follows 'hear' most naturally in English.
    reason: lexical_alternative
  - marker: b
    text: '''The works of heaven'' may refer broadly to the operations, structures, or ordered phenomena of the heavens, not merely visible objects.'
    reason: cultural_note
  - marker: c
    text: Or 'for his mind to comprehend'.
    reason: previous_rendering
translation:
  language: ko
  text: 이는 모든 인간 가운데 누가 거룩하신 분의 음성을 듣고도 흔들리지 않을 수 있겠습니까? 또 누가 그분의 생각을 헤아릴 수 있겠습니까? 또 누가 하늘의 모든 일을 바라볼 수 있겠습니까?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 모든 일’은 눈에 보이는 대상만이 아니라 하늘의 작용, 질서, 현상 전반을 넓게 가리킬 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: ውሉደ ሰብእ
  english_pob_choice: the children of men
  chosen_korean: 모든 사람의 자녀
  alternatives_korean:
  - 인간들
  - 인간의 자녀
  - 사람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 셈어적 인간 일반 표현을 살리면서, 한국어에서는 직역체인 ‘사람의 자녀’보다 ‘모든 사람의 자녀’가 장중한 수사와 의미를 함께 전달합니다.
- source_word: ለቅዱስ
  english_pob_choice: the Holy One
  chosen_korean: 거룩하신 이
  alternatives_korean:
  - 거룩하신 분
  - 성자
  - 거룩한 이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 압도적인 신적 호칭이므로, 신격을 분명히 하되 후대 기독론적 호칭으로 좁히지 않도록 ‘거룩하신 이’로 옮겼습니다.
- source_word: ወኢይትሀወክ
  english_pob_choice: and not be shaken
  chosen_korean: 흔들리지 않을 수 있겠습니까
  alternatives_korean:
  - 동요되지 않을 수 있겠습니까
  - 당황하지 않을 수 있겠습니까
  - 혼란에 빠지지 않을 수 있겠습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 감정이 아니라 신적 음성 앞에서의 내적 불안정과 전복 가능성을 담기 위해 ‘흔들리다’를 택했습니다.
- source_word: ከመ የሐሊ፡ ኅሊናሁ
  english_pob_choice: to comprehend his thoughts
  chosen_korean: 그의 생각을 헤아릴 수 있겠습니까
  alternatives_korean:
  - 그의 생각을 이해할 수 있겠습니까
  - 그의 생각을 깨달을 수 있겠습니까
  - 그의 생각을 생각할 수 있겠습니까
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈의 ‘생각/사유를 마음에 품고 헤아리다’는 뜻을 반영하면서, 영어 POB의 ‘comprehend’보다 한국어에서는 ‘헤아리다’가 더 자연스럽고 사유의 깊이를 살립니다.
- source_word: ምግባረ ሰማይ
  english_pob_choice: the works of heaven
  chosen_korean: 하늘의 모든 일
  alternatives_korean:
  - 하늘의 모든 일들
  - 하늘의 역사
  - 하늘의 모든 행적
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘works’를 단순 물체가 아니라 하늘의 작용과 질서 전체로 넓게 이해하여, 의미를 과도하게 좁히지 않는 표현으로 옮겼습니다.
theological_decisions:
- issue: 거룩하신 이의 음성 앞에서의 인간 한계 표현
  chosen_reading: 이 구절은 인간이 신적 음성을 온전히 감당할 수 없고, 그 생각과 하늘의 일을 다 헤아릴 수 없다는 수사적 질문으로 읽었습니다.
  alternative_readings:
  - 단순한 지식 부족의 진술
  - 예언자적 과장법
  rationale: 세 개의 반복 질문이 인간의 인식·존재적 한계를 강조하므로, 감탄적 수사보다 경외와 무력함을 드러내는 독법이 본문 흐름에 맞습니다.
  doctrine_reference: 피조물과 창조주 사이의 구별, 계시 앞에서의 인간의 유한성
