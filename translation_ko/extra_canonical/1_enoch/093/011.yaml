- from: 그러므로 모든 사람의 자녀 가운데 누가 거룩하신 이의 음성을 듣고도 흔들리지 않을 수 있겠습니까? 또 누가 그의 생각을 헤아릴 수 있겠습니까? 또 누가 하늘의 모든 일을 바라볼 수 있겠습니까?[a]
  to: 이는 모든 인간 가운데 누가 거룩하신 분의 음성을 듣고도 흔들리지 않을 수 있겠습니까? 또 누가 그분의 생각을 헤아릴 수 있겠습니까? 또 누가 하늘의 모든 일을 바라볼 수 있겠습니까?[a]
  rationale: The revision corrects the opening connective, improves modern Korean idiom, and retains the source’s repeated rhetorical questions and semantic breadth. ‘그분의 생각’ makes the antecedent of the possessive clear in Korean while preserving the source’s reference to the Holy One.
