base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
  footnotes:
  - marker: a
    text: Literally 'seventh sabbath/week.' In this section the term refers to the symbolic week-period of the historical vision, not a single day.
    reason: cultural_note
  - marker: b
    text: The final noun may also be rendered 'error,' 'perversion,' or 'rebellion.' 'Apostasy' is chosen to preserve the religious force of the description.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 후, 일곱째 주간에 배교한 세대가 일어날 것이며, 그 행위는 많고, 그 모든 행위는 배교일 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘일곱째 안식일/주간’입니다. 이 대목에서 이 말은 하루를 뜻하는 것이 아니라 역사 비전 안의 상징적인 주기(주간)를 가리킵니다.
    reason: cultural_note
  - marker: b
    text: 마지막 명사는 ‘오류’, ‘왜곡’, 또는 ‘반역’으로도 옮길 수 있습니다. 여기서는 종교적 이탈이라는 강한 뜻과 앞의 ‘배교한’을 살려 ‘배교’로 번역했습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በሳብዕት ሰንበት
  english_pob_choice: in the seventh week
  chosen_korean: 일곱째 주간에
  alternatives_korean:
  - 일곱째 안식일에
  - 일곱째 주에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 역사 도식에서 ሰንበት은 문자적 안식일이 아니라 주간/칠중 구간을 가리키므로, 본문의 상징적 기간을 살려 ‘주간’으로 옮겼습니다.
- source_word: ትትነሣእ
  english_pob_choice: will arise
  chosen_korean: 일어나고
  alternatives_korean:
  - 일어설 것이고
  - 나타나고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘일어나다’는 출현·부상·등장을 자연스럽게 아우르며, 묵시적 역사 진행을 한국어로 간결하게 전달합니다.
- source_word: ዕሉት
  english_pob_choice: apostate
  chosen_korean: 타락한
  alternatives_korean:
  - 배교한
  - 반역한
  - 사악한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 형용사는 단순한 도덕적 악함보다 하나님에게서 돌아선 상태를 강조하므로, 한국어에서는 ‘배교한’의 종교적 결을 유지하되 문맥상 더 유연한 ‘타락한’을 택했습니다.
- source_word: ዕልወት
  english_pob_choice: apostasy
  chosen_korean: 배교
  alternatives_korean:
  - 타락
  - 배반
  - 반역
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 형용사와 어휘 대응을 이루도록 명사형은 ‘배교’로 옮겨, 세대의 성격과 그 행위의 본질이 같은 종교적 이탈임을 드러냈습니다.
- source_word: ምግባራቲሃ
  english_pob_choice: its deeds
  chosen_korean: 그들의 행위
  alternatives_korean:
  - 그들의 행실
  - 그들의 일들
  - 그들의 활동
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 행위/작위의 의미를 살리면서도 심판 문맥에 맞게 ‘행위’로 번역했습니다. 대명사는 직전의 ‘세대’에 자연스럽게 연결했습니다.
theological_decisions:
- issue: ‘apostate generation / apostasy’를 한국어에서 도덕적 악함으로 완화할지, 종교적 이탈로 보존할지
  chosen_reading: ‘타락한 세대’와 ‘배교’로 대응시켜, 단순한 일반 악이 아니라 하나님에게서 떠난 종교적·언약적 이탈을 드러냅니다.
  alternative_readings:
  - ‘사악한 세대’와 ‘사악함’
  - ‘패역한 세대’와 ‘패역’
  rationale: 본문의 쌍어법(형용사와 추상명사)이 같은 종류의 이탈을 반복 강조하므로, 의미를 약화하지 않는 방향으로 종교적 긴장을 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; consistency of key terms, or documented exception.
