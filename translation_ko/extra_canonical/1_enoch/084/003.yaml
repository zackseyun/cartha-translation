base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
  footnotes:
  - marker: a
    text: The clause 'not even a single wisdom passes beyond the throne of your dwelling' is difficult in the Ge'ez. It may refer to no wise plan, thought, or matter being beyond God's royal dwelling-place.
    reason: lexical_alternative
  - marker: b
    text: The final sentence repeats the theme of total divine knowledge; some witnesses appear to preserve an explicit concluding line, 'for you see all things.'
    reason: textual_variant
  - marker: c
    text: Or 'and no deed opposes you'.
    reason: previous_rendering
  - marker: d
    text: Or 'For you have made all things, and over all things you rule'.
    reason: previous_rendering
translation:
  language: ko
  text: 주님께서 모든 것을 지으셨고, 모든 것 위를 다스리십니다. 어떤 일도 주님께는 너무 어렵지 않으며, 주님의 거처의 보좌를 지나가는 지혜 하나도 없고, 주님의 얼굴 앞에서 돌아서는 것도 없습니다. 주님께서는 모든 것을 아시고, 보시고, 들으시며, 주님께 숨겨진 것은 아무것도 없습니다. 주님께서는 모든 것을 보십니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘지혜 하나도’는 원문의 ‘한 지혜’에 가깝게 옮긴 것으로, 여기서 지혜가 ‘생각’, ‘계획’, ‘사안’ 가운데 무엇을 가리키는지는 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 끝부분의 ‘주님께서는 모든 것을 보십니다’는 앞의 총체적 지식 진술을 반복하며, 일부 전승은 이 문장을 명시적으로 보존합니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘어떤 일도 주님께 대항하지 못합니다’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘주님께서는 모든 것을 지으셨고, 모든 것 위를 다스리십니다’로 읽을 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ገበርከ
  english_pob_choice: have made
  chosen_korean: 지으셨고
  alternatives_korean:
  - 만드셨고
  - 지으셨습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사 ገበርከ는 기본적으로 ‘하다/만들다’의 넓은 의미를 가지며, 여기서는 ‘모든 것’을 대상으로 하므로 창조적 행위를 자연스럽게 드러내는 ‘지으셨다’가 가장 적절합니다.
- source_word: ወለኵሉ
  english_pob_choice: over all things
  chosen_korean: 모든 것 위를
  alternatives_korean:
  - 모든 것 위에
  - 만물 위를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사적 결합이 지배권의 공간적 이미지를 띠므로, 단순히 ‘위에’보다 ‘위를 다스리신다’는 구조가 통치의 뉘앙스를 더 잘 살립니다.
- source_word: ትመልክ
  english_pob_choice: you rule
  chosen_korean: 다스리십니다
  alternatives_korean:
  - 통치하십니다
  - 군림하십니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 왕권적 통치를 뜻하므로 교회 전통어인 ‘주권을 가지다’보다 직설적인 ‘다스리다’가 원문의 통치성을 잘 보존합니다.
- source_word: ኢይጸንዐከ ግብር
  english_pob_choice: no deed is too hard for you
  chosen_korean: 어떤 일도 주님께는 너무 어렵지 않으며
  alternatives_korean:
  - 어떤 일도 주님을 막지 못하며
  - 어떤 일도 주님께는 불가능하지 않으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구문은 ‘대적하다’가 아니라 ‘너무 어렵다/감당하기 어렵다’는 관용구이므로, 하나님의 능력에 대한 진술을 직접적으로 살려 번역합니다.
- source_word: ወአሐቲ ጥበብ
  english_pob_choice: not even a single wisdom
  chosen_korean: 지혜 하나도
  alternatives_korean:
  - 한 가지 지혜도
  - 어떤 지혜의 생각도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 직역하면 ‘하나의 지혜’이므로, 의미를 과도하게 해석하지 않고 한국어에서도 비정상적이지만 투명한 ‘지혜 하나도’로 남깁니다.
- source_word: እምንባራተ ምንባሪከ
  english_pob_choice: the throne of your dwelling
  chosen_korean: 주님의 거처의 보좌
  alternatives_korean:
  - 주님의 거처 보좌
  - 주님의 거주하시는 자리의 보좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘보좌’와 ‘거처’의 이중 이미지를 유지하되, 한국어 문장에서는 자연스럽게 ‘거처의 보좌’로 옮겨 왕권과 거주 공간의 결합을 살렸습니다.
- source_word: ኢትትመየጥ ኢእምገጽከ
  english_pob_choice: nor turns away from before your face
  chosen_korean: 주님의 얼굴 앞에서 돌아서는 것도 없습니다
  alternatives_korean:
  - 주님의 얼굴 앞에서 물러나는 것도 없습니다
  - 주님의 얼굴 앞을 떠나는 것도 없습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘before your face’의 시각적·관계적 이미지를 보존하기 위해 ‘얼굴 앞에서’로 옮기고, 동작은 ‘돌아서다’로 자연스럽게 처리했습니다.
- source_word: ታአምር / ወትሬኢ / ወትሰምዕ
  english_pob_choice: you know all things, and see, and hear
  chosen_korean: 주님께서는 모든 것을 아시고, 보시고, 들으시며
  alternatives_korean:
  - 주님께서는 모두 아시고, 보시고, 들으시며
  - 주님께서는 모든 것을 이해하시고, 보시고, 들으시며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 동사를 나란히 둔 열거를 그대로 살려, 인지-시각-청각의 전면성을 한국어에서도 유지했습니다.
theological_decisions:
- issue: 하나님의 전능과 전지 표현
  chosen_reading: 이 절을 하나님이 모든 것을 지으시고 다스리시며, 어떤 일도 너무 어렵지 않고, 아무것도 숨겨지지 않는다는 강한 찬양으로 읽고 번역했습니다.
  alternative_readings:
  - 일반적인 경배 수사로 완화하기
  - 지혜 관련 부분을 인간의 계획 정도로 축소하기
  rationale: 원문은 총체적 표현을 반복하며 하나님의 통치와 인식을 극대화하므로, 이를 약화시키지 않고 그대로 드러내는 것이 source-direct입니다.
  doctrine_reference: 원문 우선 원칙; 신학적 긴장을 해소하지 말고 보존하기.
