  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 열거된 말의 기관과 능력을 그대로 살리기 위해 ‘영과 혀와 입’을 유지했습니다.
theological_decisions:
- issue: መንፈስ을 '영'으로 옮길지 '숨/호흡'으로 옮길지
  chosen_reading: 문맥의 말하기 능력과 창조된 생기라는 긴장을 살리기 위해 ‘영’을 채택했습니다.
  alternative_readings:
  - 숨
  - 호흡
  - 성령
  rationale: 이 절은 인간의 발화 능력과 그 창조적 부여를 함께 말하므로, ‘영’이 가장 직접적으로 본문의 어휘를 살리면서도 지나친 제한을 피합니다.
  doctrine_reference: Original-language primacy over translation tradition; preserve tension rather than resolve it.
- issue: ‘Holy and Great One’의 호칭을 어떻게 표기할지
  chosen_reading: ‘거룩하고 위대하신 분’으로 옮겼습니다.
  alternative_readings:
  - 거룩하고 위대하신 이
  - 거룩하고 위대하신 분
  rationale: 원문의 이중 수식은 신적 호칭이므로, 한국어에서 자연스럽고 경외를 살리는 인칭화 표현을 택했습니다.
  doctrine_reference: Respect divine titling without importing later confessional formulas.
