  rationale: 기도의 몸짓으로서 손을 드는 동작을 살리기 위해 ‘들어 올렸고’를 택했습니다.
- source_word: በጽድቅ
  english_pob_choice: in righteousness
  chosen_korean: 의로
  alternatives_korean:
