  - 의롭게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수식 부사로 풀기보다 기도 행위의 성격을 나타내는 전치사구로 간결하게 옮겼습니다.
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  english_pob_choice: I blessed the Holy and Great One
  chosen_korean: 거룩하고 위대하신 분을 찬송하였으며
  alternatives_korean:
  - 거룩하고 위대하신 분을 축복하였으며
  - 거룩하고 위대하신 이를 찬양하였으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님께 드리는 말로서 한국어 종교문맥에 익숙한 ‘찬송하였으며’를 쓰되, 호칭의 인격성을 살리기 위해 ‘분’을 유지했습니다.
- source_word: መንፈስ አፉየ
  english_pob_choice: the breath/spirit of my mouth
  chosen_korean: 내 입의 영
  alternatives_korean:
  - 내 입의 숨
  - 내 입의 호흡
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 መንፈስ은 말의 기관과 연결된 생기/호흡의 뜻을 가지므로, 영적 의미를 과도하게 신학화하지 않으면서도 ‘영’으로 옮겼습니다.
- source_word: በልስነ ሥጋ
