  naturalness: 초안의 ‘내 입의 영’, ‘육의 혀’, ‘사람의 육의 자녀들’은 현대 표준 한국어에서 다소 부자연스럽거나 신학적으로 오해되기 쉽습니다. ‘입의 숨결’, ‘육신의 혀’, ‘사람의 육신의 자녀들’은 원문의 의도적인 신체성을 유지하면서 더 자연스럽습니다.
