  to: 저는 의 가운데서 제 두 손을 들고, 거룩하고 위대하신 분을 찬송하였으며, 제 입의 숨결[a]과 육신의 혀로 말하였습니다. 하나님께서는 사람의 육신의 자녀들[b]이 그것으로 말하게 하시려고 그 혀를 지으셨습니다. 또 그들에게 숨결과 혀와 입을 주셔서, 그것들로 말하게 하셨습니다.
