  - 육체의 혀
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 물질적·체현적 표현을 살리기 위해 ‘육’과 ‘혀’의 결합을 유지했습니다.
- source_word: ውሉደ ሥጋ ሰብእ
  english_pob_choice: the children of the flesh of men
  chosen_korean: 사람의 육의 자녀들
  alternatives_korean:
  - 사람의 육체의 자녀들
  - 육의 사람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 POB가 강조한 체현적 반복을 보존하되, 한국어에서 자연스럽게 읽히도록 ‘사람의 육의 자녀들’로 직역했습니다.
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  english_pob_choice: and he gave them spirit and tongue and mouth
  chosen_korean: 그분은 그들에게 영과 혀와 입을 주셔서
