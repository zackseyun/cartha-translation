- from: 찬양받으소서, 주님, 크신 왕이시며 당신의 위대하심 안에서 능력 있으신 분이시여. 하늘의 모든 창조물의 주님, 왕들의 왕, 온 세상의 하나님이십니다. 당신의 왕권과 당신의 나라와 당신의 위대하심은 영원무궁하며, 당신의 권위는 모든 세대의 모든 세대에 걸쳐 있습니다. 그리고 모든 하늘은 영원히 당신의 보좌이며, 온 땅은 당신의 발의 발판입니다, 영원무궁합니다.[a][b][c][d]
  to: 복되십니다, 주님, 크신 왕이시며 위대하심 가운데 능하신 분이시여! 주님은 하늘의 모든 피조물의 주님이시며[b], 왕들의 왕, 온 세상의 하나님이십니다. 당신의 왕권[a]과 나라와 위대하심은 영원히 또 영원히 지속되며, 당신의 권세는 모든 세세대대에 걸쳐 있습니다. 모든 하늘은 영원히 당신의 보좌이고[c], 온 땅은 영원히 또 영원히 당신의 발판입니다[d].
  rationale: 직접적인 축복 선언, 왕권 관련 난해성, 권세의 독립 절, 그리고 보좌·발판에 각각 연결된 영원 표현을 보존했습니다. 동시에 청원형으로 바뀐 첫 문장, 비자연스러운 반복, 마지막 절의 문법적 불명료성을 바로잡았습니다. 주석 앵커도 설명 대상에 맞게 재배치했습니다.
  reviewer_model: gpt-5.6-terra
