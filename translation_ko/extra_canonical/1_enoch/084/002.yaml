base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
  footnotes:
  - marker: a
    text: The term rendered 'your majesty' is textually difficult in the OCR witness; it may also be understood as 'your dominion' or 'your glory.'
    reason: textual_variant
  - marker: b
    text: The phrase 'all creation of heaven' is literal to the Ge'ez sequence and may mean 'all heavenly creation.'
    reason: lexical_alternative
  - marker: c
    text: Compare the biblical throne-and-footstool image in Isa 66:1; the Enochic verse uses the same kind of cosmic royal imagery without requiring identical wording.
    reason: cross_reference
  - marker: d
    text: Or 'and through all generations of generations. All the heavens'.
    reason: previous_rendering
translation:
  language: ko
  text: 찬양받으소서, 주님, 크신 왕이시며 당신의 위대하심 안에서 능력 있으신 분이시여. 하늘의 모든 창조물의 주님, 왕들의 왕, 온 세상의 하나님이십니다. 당신의 왕권과 당신의 나라와 당신의 위대하심은 영원무궁하며, 당신의 권위는 모든 세대의 모든 세대에 걸쳐 있습니다. 그리고 모든 하늘은 영원히 당신의 보좌이며, 온 땅은 당신의 발의 발판입니다, 영원무궁합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘찬양받으소서’는 직역상 ‘복되십니다’에 해당하는 예배적 번역으로, 축복 선언과 찬양의 뉘앙스를 함께 살렸습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘하늘의 모든 창조물’은 문자적으로는 ‘하늘의 모든 피조물/창조물’에 가깝고, ‘천상적 창조 전체’의 의미로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘보좌’는 이사야 66:1과 유사한 우주적 왕좌-발판 이미지를 한국어 성서어휘로 유지한 표현입니다.
    reason: cross_reference
  - marker: d
    text: ‘영원무궁합니다’는 ‘영원히, 또 영원히’의 반복을 한국어의 관용적 영원 표현으로 압축한 것입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: ቡሩክ
  english_pob_choice: Blessed are you
  chosen_korean: 찬양받으소서
  alternatives_korean:
  - 복되십니다
  - 복을 받으소서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘에 대한 축복 선언이면서 동시에 찬양의 도입부이므로, 한국어에서는 직설적 축복형보다 예배적 호칭인 ‘찬양받으소서’가 문맥의 경배성을 더 잘 살립니다.
- source_word: ንጉሥ ዐቢይ ወኃያል
  english_pob_choice: great King and mighty
  chosen_korean: 크신 왕이시며 … 능력 있으신 분이시여
  alternatives_korean:
  - 크고 능하신 왕이시여
  - 위대하신 왕이시며 강하신 분이시여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 왕호와 능력을 병렬로 살리되, 한국어에서 자연스러운 경배체로 풀어 ‘크신 왕’과 ‘능력 있으신 분’을 분리해 표현했습니다.
- source_word: ኵሉ ፍጥረት ሰማይ
  english_pob_choice: all creation of heaven
  chosen_korean: 하늘의 모든 창조물
  alternatives_korean:
  - 하늘의 온 피조물
  - 하늘의 모든 피조세계
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 순서를 유지하면서도 한국어 문법에 맞게 ‘창조물’을 사용해 천상적 창조 전체를 가리키는 뜻을 보존했습니다.
- source_word: ስልጣንከ
  english_pob_choice: your authority
  chosen_korean: 당신의 권위
  alternatives_korean:
  - 당신의 권세
  - 당신의 통치권
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 단순한 권한보다 왕권적 통치의 지속을 가리키므로, 예배 문체에서 자연스럽고 위엄 있는 ‘권위’를 택했습니다.
- source_word: ኵሎሙ ሰማያት መንበርከ
  english_pob_choice: All the heavens are your throne
  chosen_korean: 모든 하늘은 당신의 보좌이며
  alternatives_korean:
  - 모든 하늘이 당신의 보좌입니다
  - 온 하늘은 당신의 보좌이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 다중 하늘의 이미지를 살려 ‘모든 하늘’을 유지하고, 천상 왕좌의 이미지를 한국어 교회어휘로는 ‘보좌’가 가장 직접적으로 전달합니다.
- source_word: ኵላ ምድር መካይደ እገሪከ
  english_pob_choice: the whole earth is the footstool of your feet
  chosen_korean: 온 땅은 당신의 발의 발판입니다
  alternatives_korean:
  - 온 땅은 당신의 발판입니다
  - 온 땅은 당신의 발등상입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘발판’은 원문의 발-의자 이미지를 비교적 자연스럽게 살리면서도, 전통적 ‘발등상’보다 현대 한국어에서 더 직관적입니다.
theological_decisions:
- issue: 하늘-보좌와 땅-발판의 우주적 왕권 이미지
  chosen_reading: 직접적인 우주적 통치의 묘사로 유지했습니다.
  alternative_readings:
  - 단순한 경건 찬송으로 완화하기
  - 상징을 약화해 추상적 통치로 바꾸기
  rationale: 이 구절은 에녹문헌 특유의 묵시적 왕권 찬양이므로, 보좌와 발판 이미지를 그대로 살려 하나님의 보편 통치를 구체적으로 드러냈습니다.
  doctrine_reference: 묵시문학의 상징 보존; 시적 이미지를 추상화로 환원하지 않음
- issue: ‘왕들의 왕, 온 세상의 하나님’의 호칭 배치
  chosen_reading: 직함들을 병렬로 유지해 하나님께 집중된 절대 주권을 드러냈습니다.
  alternative_readings:
  - 호칭을 하나로 합쳐 단순화하기
  - ‘세상의 하나님’을 약화해 일반적 창조주 표현으로 바꾸기
  rationale: 원문은 여러 왕호를 누적해 찬양 강도를 높이므로, 한국어에서도 병렬 구조를 유지해야 원문의 신학적 압박감이 보존됩니다.
  doctrine_reference: 예배문 맥락에서의 누적적 찬양 수사 보존
