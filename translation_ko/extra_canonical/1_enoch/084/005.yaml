  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: ko
  text: 이제 하나님이시며 주님이시며 위대한 왕이신 분이여, 제 기도를 저를 위하여 이루어 주시기를 간구하며 구합니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ወእግዚእ፡ ወንጉሥ፡ ዐቢይ፡
  english_pob_choice: O God and Lord and great King
  chosen_korean: 하나님과 주와 큰 왕이신 분이여
  alternatives_korean:
  - 하나님과 주와 위대한 왕이신 분이여
  - 하나님과 주와 큰 임금이신 분이여
  lexicon: 하나님 / 주 / 왕
  rationale: 원문은 세 호칭을 병렬로 두며 마지막에 '큰/위대한'이 왕을 수식하므로, 한국어에서도 병렬성을 살려 압축적으로 옮겼습니다. '왕'은 성경적 직함을 유지하되 현대어로 자연스럽게 '큰 왕'으로 처리했습니다.
- source_word: አስተበቍዕ፡ ወእስእል፡
  english_pob_choice: I beseech and ask
  chosen_korean: 간구하고 구합니다
  alternatives_korean:
  - 간구하며 구합니다
  - 애원하며 청합니다
  lexicon: 간구하다 / 구하다
  rationale: 두 동사는 반복적 청원을 강화하므로, 한국어에서도 동의적 중첩을 살려 '간구하고 구합니다'로 직역에 가깝게 옮겼습니다.
- source_word: ከመ፡ ታቅም፡ ሊተ፡ ስእለተየ፡
  english_pob_choice: that you establish my prayer for me
  chosen_korean: 제가 드리는 제 기도를 제게 이루어 주시기를
  alternatives_korean:
  - 제 기도를 제게 굳게 세워 주시기를
  - 제 기도를 제 편에서 성립시켜 주시기를
  lexicon: 기도하다 / 이루다 / 세우다
  rationale: 문맥상 단순히 '허락'하는 것이 아니라 기도가 실제로 성취·확립되기를 구하는 뜻이므로, '이루어 주시기를'을 택해 결과 지향성을 살렸습니다.
theological_decisions:
- issue: 기도의 대상 호칭을 그대로 유지할지, '주님'처럼 통합할지
  chosen_reading: 하나님과 주와 큰 왕이신 분
  alternative_readings:
  - 하나님이시며 주이시며 큰 왕이신 분
  - 주님이신 하나님, 큰 왕
  rationale: 원문은 호칭을 삭제하지 않고 누적적으로 쌓아 올리므로, 한국어도 삼중 호칭을 보존해 경외감과 수사적 강도를 유지했습니다.
  doctrine_reference: 원문 수사 구조 보존 원칙
- issue: ‘for me’를 기도 전체에 연결할지, '제 기도'에만 붙일지
  chosen_reading: 제가 드리는 제 기도를 제게 이루어 주시기를
  alternative_readings:
  - 제 기도를 저를 위해 이루어 주시기를
  - 저를 위해 제 기도를 성취해 주시기를
  rationale: English POB audit trail이 'for me'를 최종적으로 보존하므로, 기도의 성취가 화자에게 귀속됨을 분명히 하되 한국어 어순에 맞게 중복을 최소화했습니다.
  doctrine_reference: audit-trail consistency
