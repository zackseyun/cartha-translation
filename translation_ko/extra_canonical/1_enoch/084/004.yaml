translation:
  language: ko
  text: 그리고 이제 당신의 하늘에 있는 천사들은 범죄하였고, 당신의 진노는 심판의 큰 날까지 사람들의 육체 위에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람들의 육체’는 문자적으로는 다소 낯설지만, 본문이 인류를 필멸적 육체의 상태로 가리키는 이미지를 보존합니다.
    reason: korean_style_note
  - marker: b
    text: 마지막 표현은 전승 및 에티오피아어 OCR의 난점 때문에 불확실성이 있으나, 문맥상 ‘심판의 큰 날’로 읽는 것이 가장 타당합니다.
    reason: textual_variant
