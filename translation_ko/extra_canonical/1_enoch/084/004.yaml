  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
  footnotes:
  - marker: a
    text: The closing words are difficult in the Ethiopic OCR. The sense is likely a qualifier such as 'of judgment' or 'of recompense' attached to 'the great day.'
