translation:
  language: ko
  text: 그리고 이제 하늘의 천사들은 죄를 지었고, 당신의 진노는 사람의 육체 위에 큰 심판의 날까지 임해 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘사람의 육체’는 문자적으로는 낯설지만, 본문의 거친 인류학적 이미지를 보존합니다.
    reason: korean_style_note
  - marker: b
    text: 마지막 표현은 본문 전승상 ‘심판의 날’로 읽는 것이 가장 자연스럽습니다.
    reason: textual_variant
