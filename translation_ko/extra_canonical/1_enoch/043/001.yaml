base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
  footnotes:
  - marker: a
    text: Or 'each by name'; the Ge'ez expression is distributive.
    reason: lexical_alternative
  - marker: b
    text: The final verb is literally 'hear him'; in context this may also imply responsive obedience.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''another thing: the lightning flashes''.'
    reason: previous_rendering
  - marker: d
    text: Or 'by their names'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는 다른 번개들과 하늘의 별들을 보았으며, 그분이 그것들을 각각 그 고유한 이름으로 모두 부르시는 것과 그들이 그분의 말씀을 듣는 것을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈어의 분배적 반복 전치사(‘각각’)를 반영한 번역입니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 문자적으로는 ‘듣다’이며, 문맥상 ‘순종하다’의 뜻이 내포될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  english_pob_choice: and I saw
  chosen_korean: 그리고 저는 ... 보았습니다
  alternatives_korean:
  - 그리고 나는 ... 보았습니다
  - 그리고 제가 ... 보았습니다
  lexicon: Dillmann
  rationale: 환상 보고의 반복 공식으로서 단순 과거 서술을 유지하되, 현대 합쇼체에 맞게 자연스럽게 옮겼습니다.
- source_word: ካልአ መባርቅተ
  english_pob_choice: other lightnings
  chosen_korean: 다른 번개들
  alternatives_korean:
  - 다른 벼락들
  - 다른 번개
  lexicon: Dillmann
  rationale: 수량적 형용사 ካልአ가 앞선 맥락의 번개 현상을 수식하므로, 명사화하지 않고 ‘다른 번개들’로 옮겨 문법 관계를 보존했습니다.
- source_word: ወከዋክብተ ሰማይ
  english_pob_choice: the stars of heaven
  chosen_korean: 하늘의 별들
  alternatives_korean:
  - 하늘의 별
  - 천상의 별들
  lexicon: Dillmann
  rationale: 격식 있는 천체 표현을 한국어의 자연스러운 성서 문체로 살리되, 과도한 문어화를 피했습니다.
- source_word: በበአስማቲሆሙ
  english_pob_choice: by their respective names
  chosen_korean: 각각 그 고유한 이름으로
  alternatives_korean:
  - 각각의 이름으로
  - 제각기 그 이름으로
  lexicon: Dillmann
  rationale: 중복 전치사가 주는 분배적 의미를 반영하여 ‘각각’과 ‘고유한 이름’을 넣어 이름 부르심의 개별성을 드러냈습니다.
- source_word: ወይሰምዕዎ
  english_pob_choice: and they hear him
  chosen_korean: 그들이 그분의 말씀을 듣는 것을
  alternatives_korean:
  - 그들이 그분을 듣는 것을
  - 그들이 그분께 순종하는 것을
  lexicon: Dillmann
  rationale: 기본 의미는 ‘듣다’이므로 본문에는 청취를 유지했고, 문맥상 내포될 수 있는 순종은 추가하지 않았습니다.
theological_decisions:
- issue: 하늘의 별들이 단순한 물체인지, 인격적으로 응답하는 존재로 묘사되는지
  chosen_reading: 천체를 인격적으로 부르심을 받고 응답하는 존재처럼 묘사하는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 별들을 단순한 자연현상으로 완화하여 번역
  - ‘순종한다’로 바꾸어 응답성을 해석적으로 강화
  rationale: 본문은 별과 번개를 호칭하고 응답하는 대상으로 그려 apocalyptic한 인격화의 긴장을 드러내므로, 그 강도를 약화하거나 과잉 해석하지 않았습니다.
  doctrine_reference: 본문의 묵시적 표현을 있는 그대로 보존
- issue: ‘듣다’의 번역에서 순종의 뉘앙스를 본문에 직접 넣을지 여부
  chosen_reading: 본문은 ‘듣다’로 두고, 순종은 문맥상 가능한 의미로만 남겼습니다.
  alternative_readings:
  - ‘순종하다’로 번역
  - ‘응답하다’로 번역
  rationale: 게즈어 동사의 기본 의미를 보존하여 문면의 소리를 유지하고, 해석적 확대는 피했습니다.
  doctrine_reference: 어휘의 기본 의미 우선 원칙
