base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
  footnotes:
  - marker: a
    text: Or 'each by name'; the Ge'ez expression is distributive.
    reason: lexical_alternative
  - marker: b
    text: The final verb is literally 'hear him'; in context this may also imply responsive obedience.
    reason: lexical_alternative
  - marker: c
    text: 'Or ''another thing: the lightning flashes''.'
    reason: previous_rendering
  - marker: d
    text: Or 'by their names'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는 다른 번개들과 하늘의 별들을 보았으며, 그분이 그것들을 모두 저마다의 이름으로 부르시는 것과 그들이 그분의 말을 듣는 것을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈어의 반복 전치사는 분배적 의미를 나타내므로, ‘저마다의 이름으로’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: 동사는 문자적으로는 ‘그분을 듣다’입니다. 문맥상 순종의 뜻이 내포될 수 있으나, 본문에서는 ‘듣다’로 옮겼습니다.
    reason: lexical_alternative
