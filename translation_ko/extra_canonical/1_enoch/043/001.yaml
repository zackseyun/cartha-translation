theological_decisions:
- issue: 하늘의 별들이 단순한 물체인지, 인격적으로 응답하는 존재로 묘사되는지
  chosen_reading: 천체를 인격적으로 부르심을 받고 응답하는 존재처럼 묘사하는 긴장을 그대로 유지했습니다.
  alternative_readings:
  - 별들을 단순한 자연현상으로 완화하여 번역
  - ‘순종한다’로 바꾸어 응답성을 해석적으로 강화
  rationale: 본문은 별과 번개를 호칭하고 응답하는 대상으로 그려 apocalyptic한 인격화의 긴장을 드러내므로, 그 강도를 약화하거나 과잉 해석하지 않았습니다.
  doctrine_reference: 본문의 묵시적 표현을 있는 그대로 보존
- issue: ‘듣다’의 번역에서 순종의 뉘앙스를 본문에 직접 넣을지 여부
  chosen_reading: 본문은 ‘듣다’로 두고, 순종은 문맥상 가능한 의미로만 남겼습니다.
  alternative_readings:
  - ‘순종하다’로 번역
  - ‘응답하다’로 번역
  rationale: 게즈어 동사의 기본 의미를 보존하여 문면의 소리를 유지하고, 해석적 확대는 피했습니다.
  doctrine_reference: 어휘의 기본 의미 우선 원칙
