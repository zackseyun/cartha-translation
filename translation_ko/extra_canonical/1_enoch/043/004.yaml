  rationale: 직역상 ‘마른 땅/마른 땅 위’이지만, 문맥의 대조를 살리면서 한국어에서 더 자연스러운 ‘땅 위에’로 옮겼습니다.
- source_word: ወየአምኑ በስሙ
  english_pob_choice: and believe in the name
  chosen_korean: 이름을 믿는
