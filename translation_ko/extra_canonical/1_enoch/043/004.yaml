theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 신적 칭호 처리
  chosen_reading: 만군의 주
  alternative_readings:
  - 영들의 주
  - 영들의 주님
  rationale: 문헌의 고유한 신적 칭호를 한국어 성서 독자에게 익숙한 경외적 칭호로 옮기되, 칭호성을 보존했습니다.
  doctrine_reference: Apocalyptic divine-title translation; preserve reverent titular force without flattening to a generic noun phrase.
- issue: ‘the holy ones who dwell upon the dry ground’의 정체
  chosen_reading: 땅 위에 거하며 믿는 거룩한 자들
  alternative_readings:
  - 하늘의 거룩한 자들
  - 천사적 거룩한 자들
  rationale: 거처와 믿음이라는 한정절이 지상에 있는 신실한 자들을 가리키는 흐름을 살려, 천상 존재로 미리 해석하지 않았습니다.
  doctrine_reference: Preserve local apocalyptic imagery and the immediate referent of the source clause.
