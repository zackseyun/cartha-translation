- source_word: እሉ እሙንቱ አስማቲሆሙ
  english_pob_choice: these are the names
  chosen_korean: 이것들은 … 이름입니다
  alternatives_korean:
  - 이것들이 … 이름입니다
  - 이들은 … 이름입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게으즈의 지시·동격 구조를 한국어의 자연스러운 동격문으로 옮기되, 반복된 ‘이름’의 강조를 살렸습니다.
- source_word: እለ የኃድሩ ዲበ የብስ
  english_pob_choice: who dwell upon the dry ground
  chosen_korean: 땅 위에 거하며
  alternatives_korean:
  - 마른 땅에 거하며
