theological_decisions:
- issue: 이 구절의 우주적 이미지와 도덕적 언어의 긴장
  chosen_reading: ‘의의 저울’, ‘나타남’, ‘신실함’을 그대로 살려, 천체의 질서와 도덕적 충실성이 겹쳐지는 표현으로 유지했습니다.
  alternative_readings:
  - 순수한 천문 묘사로만 축소
  - 상징을 곧바로 인간 윤리로 환원
  rationale: 에녹서의 묵시적 문체는 천체 질서와 윤리적 의미를 함께 말하는 경우가 많으므로, 한쪽으로 해석을 고정하지 않고 긴장을 보존하는 것이 본문에 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
