theological_decisions:
- issue: ‘숨겨진 것’의 계시적 긴장 유지
  chosen_reading: ‘숨겨진 것’으로 직접 옮겨, 아직 드러나지 않았던 실재가 비전 가운데 밝혀진다는 점을 남겼습니다.
  alternative_readings:
  - ‘비밀스러운 것’
