  rationale: 본문은 단순 정보 전달보다 계시의 구조를 강조하므로, 지나치게 추상화하거나 설명적으로 풀지 않고 숨김과 드러남의 긴장을 보존하는 편이 더 적절합니다.
  doctrine_reference: 묵시문학의 계시-은폐 대비를 유지
