base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/003.yaml
  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
  footnotes:
  - marker: a
    text: Or “the hidden things” / “the secret things.” The Ge'ez term points to realities concealed until shown in the vision.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 나와 함께 갔던 천사, 곧 나에게 숨겨진 것을 보여 준 그에게 물었습니다. “이것들은 무엇입니까?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘숨겨진 것들’ 또는 ‘비밀스러운 것들’도 가능합니다. 게즈어는 비전에서 드러나기 전까지 감추어진 실재를 가리킵니다.
    reason: lexical_alternative
