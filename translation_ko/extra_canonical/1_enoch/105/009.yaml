base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
  footnotes:
  - marker: a
    text: The Ge'ez expression rendered 'alter the word of uprightness' may also be understood as 'pervert' or 'distort' the word/matter of righteousness.
    reason: lexical_alternative
  - marker: b
    text: The clause about idols is difficult. The verb likely means 'reckon, consider, account,' so the sense may be 'do not esteem your idols' or 'do not regard your idols as anything.'
    reason: lexical_alternative
  - marker: c
    text: '''The great holy word'' could also be rendered ''the holy great word'' or, less likely, ''the great holy matter.'''
    reason: lexical_alternative
  - marker: d
    text: Or 'Do not err'.
    reason: previous_rendering
  - marker: e
    text: Or 'the great holy word'.
    reason: previous_rendering
  - marker: f
    text: Or 'do not speak falsely against'.
    reason: previous_rendering
translation:
  language: ko
  text: 마음속에서 그릇되게 행하지 말고, 거짓말하지 말며, 바른 말씀을 왜곡하지 말고, 크고 거룩한 말씀을 거짓이라고 선언하지 말며, 여러분의 우상들을 염두에 두지 마십시오.[a][b][c] 여러분의 모든 거짓과 모든 더러움은 의를 위한 것이 아니라 큰 죄를 위한 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 동사는 ‘그릇되다’, ‘잘못되다’ 또는 ‘길을 잃다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바른 말씀’은 ‘의의 말씀’ 또는 ‘진리의 말씀’으로도 옮길 수 있습니다. ‘왜곡하다’에 해당하는 동사는 ‘바꾸다’나 ‘비틀다’의 뜻도 지닐 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘크고 거룩한 말씀’은 ‘거룩하고 큰 말씀’으로도 옮길 수 있습니다. 우상에 관한 동사는 ‘헤아리다, 생각하다, 간주하다’의 뜻 범위를 지니므로, ‘우상들을 존중하지 말라’ 또는 ‘신뢰하지 말라’로 단정하기는 어렵습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትርሥዑ በልብክሙ
  english_pob_choice: Do not be wicked in your hearts
  chosen_korean: 마음속에서 악하게 굴지 말며
  alternatives_korean:
  - 마음속에서 그릇되지 말며
  - 마음속에서 죄를 짓지 말며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 내면 지향의 금지를 자연스러운 합쇼체로 옮기면서, ‘악하게 굴다’로 도덕적 일탈을 드러내되 ‘마음속’의 내적 초점을 유지했습니다.
- source_word: አትሚጥዋ ለነገረ ርትዕ
  english_pob_choice: do not alter the word of uprightness
  chosen_korean: 의의 말씀을 왜곡하지 말며
  alternatives_korean:
  - 의의 말씀을 바꾸지 말며
  - 의의 말씀을 굽게 하지 말며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 ‘변질·왜곡’ 가능성을 살려 ‘왜곡하다’로 옮겼고, ርትዕ는 뒤의 ጽድቅ과 구별하기 위해 ‘의의’로 간결하게 처리했습니다.
- source_word: ታሐስውዋ ለነገረ ቅዱስ ዐቢይ
  english_pob_choice: do not declare false the word of the Great Holy One
  chosen_korean: 크고 거룩하신 분의 말씀을 거짓이라 선언하지 말며
  alternatives_korean:
  - 크고 거룩한 말씀을 거짓이라 하지 말며
  - 큰 거룩하신 분의 말씀을 거짓이라 하지 말며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: A-기능의 factitive 뉘앙스를 살려 ‘거짓이라 선언하다’로 옮겼고, 인격적 호칭이므로 ‘분의 말씀’으로 자연스럽게 처리했습니다.
- source_word: ትሕስብዋ ለጣዖትክሙ
  english_pob_choice: do not account your idols as anything
  chosen_korean: 여러분의 우상들을 아무것도 아닌 것으로 여기지 말며
  alternatives_korean:
  - 여러분의 우상들을 아무것으로도 여기지 말며
  - 여러분의 우상들을 하찮게 여기지 말며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 재고·판단의 동사를 한국어에서는 ‘여기다’로 옮겨 인지적 평가의 힘을 살렸고, 문맥상 우상의 무가치를 분명히 하기 위해 ‘아무것도 아닌 것으로’라고 했습니다.
- source_word: ኃጢአት ዐቢይ
  english_pob_choice: great sin
  chosen_korean: 큰 죄
  alternatives_korean:
  - 큰 죄악
  - 중대한 죄
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 경고의 무게는 유지하되, 합쇼체 한국어에서 가장 직접적이고 자연스러운 표현으로 정리했습니다.
theological_decisions:
- issue: 우상을 평가하는 동사 ትሕስብዋ의 의미를 한국어에서 어떻게 드러낼지
  chosen_reading: ‘여러분의 우상들을 아무것도 아닌 것으로 여기지 말며’로 옮겨, 우상의 실재적 가치 없음에 대한 판단을 강조했습니다.
  alternative_readings:
  - 여러분의 우상들을 신뢰하지 말며
  - 여러분의 우상들을 생각하지 말며
  - 여러분의 우상들을 존중하지 말며
  rationale: 어근이 ‘헤아리다/간주하다’ 계열이므로 단순한 숭배 금지보다 평가·판단의 뉘앙스를 보존하는 것이 원문의 논점을 더 잘 드러냅니다.
  doctrine_reference: 원문의 인지적 동사를 유지해 해석을 과도하게 신학화하지 않음.
- issue: ‘크고 거룩하신 분’의 표기를 인격적 호칭으로 유지할지 여부
  chosen_reading: ‘크고 거룩하신 분’으로 두어 하나님을 가리키는 인격적 호칭으로 읽히게 했습니다.
  alternative_readings:
  - ‘거룩하고 크신 분’
  - ‘크고 거룩한 말씀’
  rationale: 문맥상 단순한 ‘말씀’의 수식이라기보다 신적 호칭에 가까운 표현이므로, 한국어에서도 인격성을 살리는 것이 자연스럽습니다.
  doctrine_reference: 호칭의 인격적 성격 유지, 1 Enoch의 신적 담화 방식 존중.
