- from: 희망하십시오. 그리고 여러분의 희망을 버리지 마십시오. 큰 기쁨이 여러분에게 있을 것이기 때문입니다 — 하늘의 천사들처럼.[a][b]
  to: 희망을 가지십시오. 그리고 여러분의 희망을 버리지 마십시오. 하늘의 천사들과 같은 큰 기쁨이 여러분에게 있을 것이기 때문입니다.[a]
  rationale: 명령을 현대 표준 한국어의 자연스러운 합쇼체로 다듬고, 천사들과의 비교를 ‘큰 기쁨’에 직접 연결했습니다. 이 표현은 약속된 기쁨의 비교를 보존하면서 천사와의 존재론적 동일시를 추가하지 않습니다. 기존의 스타일 설명 각주는 수정 후 더 이상 해당하지 않아 제거하고, 본문에 남아 있는 비교의 의미 범위를 설명하는 각주만 유지했습니다.
