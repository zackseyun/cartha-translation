translation:
  language: ko
  text: 희망을 가지십시오. 그리고 여러분의 희망을 버리지 마십시오. 하늘의 천사들과 같은 큰 기쁨이 여러분에게 있을 것이기 때문입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 천사들과 같은’은 천사들과의 비교를 유지한 표현입니다. 본문은 비교의 정확한 범위, 곧 기쁨·복된 상태·보상의 어느 측면을 가리키는지는 명시하지 않으며, 천사로 변한다는 뜻으로 단정하지 않습니다.
    reason: theological_note
