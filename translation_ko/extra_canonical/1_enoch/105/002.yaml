  - 기대하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령/권고의 직접성을 살리면서도 한국어 합쇼체에 맞게 다듬었습니다. ‘희망하다’는 ‘Hope’의 직설적 호소를 가장 자연스럽게 옮깁니다.
- source_word: ቀዳሚ
