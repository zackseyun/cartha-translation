base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
  footnotes:
  - marker: a
    text: Or 'by wickedness and by suffering.' The Ge'ez compactly links shame with both evil and distress, without specifying whether evil is personal, social, or circumstantial.
    reason: lexical_alternative
  - marker: b
    text: The image 'the windows of heaven' is a cosmic expression for heaven opened toward the righteous; the text does not specify exactly what comes through that opening.
    reason: cultural_note
  - marker: c
    text: Or 'the windows of heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 희망하십시오[a]. 이전에는 여러분이 악과 고난[b]으로 인해 수치를 당했지만, 이제는 하늘의 빛처럼 빛날 것이며, 빛나서 드러날 것이고[c], 하늘의 문들이 여러분에게 열릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악함과 고난으로 인해.’ Ge'ez는 수치와 악/고난을 압축적으로 연결하므로, 악을 사람이나 상황 어느 한쪽으로만 한정하지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘악함과 고난’. 원문은 수치를 당한 이유를 넓게 제시합니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘하늘의 문들’이라고도 옮길 수 있습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ተስፈዉ
  english_pob_choice: Hope
  chosen_korean: 희망하십시오
  alternatives_korean:
