base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
  footnotes:
  - marker: a
    text: Or 'by wickedness and by suffering.' The Ge'ez compactly links shame with both evil and distress, without specifying whether evil is personal, social, or circumstantial.
    reason: lexical_alternative
  - marker: b
    text: The image 'the windows of heaven' is a cosmic expression for heaven opened toward the righteous; the text does not specify exactly what comes through that opening.
    reason: cultural_note
  - marker: c
    text: Or 'the windows of heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 소망하십시오. 이전에는 여러분이 악과 고난으로 말미암아 수치를 당했지만[a], 이제는 하늘의 빛처럼 빛날 것이며, 빛나고 보이게 될 것입니다. 하늘의 문들이 여러분을 위하여 열릴 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘악함과 고난으로 말미암아.’ 원문은 ‘악’을 악한 사람, 개인의 악행, 또는 악한 상황 가운데 어느 하나로 한정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስፈዉ
  english_pob_choice: Hope
  chosen_korean: 희망하십시오
  alternatives_korean:
  - 소망하십시오
  - 기대하십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 명령/권고의 직접성을 살리면서도 한국어 합쇼체에 맞게 다듬었습니다. ‘희망하다’는 ‘Hope’의 직설적 호소를 가장 자연스럽게 옮깁니다.
- source_word: ቀዳሚ
  english_pob_choice: formerly
  chosen_korean: 이전에는
  alternatives_korean:
  - 옛날에는
  - 먼저
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 과거의 수치와 현재의 영광을 대비하는 시간 부사를 한국어에서 가장 분명하게 드러냅니다.
- source_word: ኃሠርክሙ በእኩይ ወበምራኅ
  english_pob_choice: you were put to shame by evil and by affliction
  chosen_korean: 악과 고난으로 인해 수치를 당했
  alternatives_korean:
  - 악과 고난 때문에 수치를 겪었
  - 악과 환난으로 수치를 당했
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 압축된 전치사구는 원인/상황을 넓게 포괄하므로, ‘~로 인해’로 처리해 악과 고난의 이중 원인을 과도하게 특정하지 않았습니다. ‘수치를 당했’은 passive sense를 자연스럽게 살립니다.
- source_word: ኆኅተ ሰማይ
  english_pob_choice: the portals of heaven
  chosen_korean: 하늘의 문들
  alternatives_korean:
  - 하늘의 문턱들
  - 하늘의 창문들
  - 하늘의 포털들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 우주론적 용례를 고려해 단순한 ‘창문’보다 ‘문들’이 source-dependent meaning을 더 잘 반영합니다. 한국어에서는 ‘문들’이 가장 자연스러우며, 복수형을 살려 구조적 개방성을 드러냅니다.
theological_decisions:
- issue: 마지막 하늘 이미지의 범위
  chosen_reading: 이 구절은 의인들에게 주어지는 하늘의 개방과 vindication을 말하며, 그 구체적 결과를 ‘영적 복’이나 ‘천상 진입’으로 좁히지 않습니다.
  alternative_readings:
  - 하늘의 복이 그들에게 쏟아진다는 뜻
  - 그들이 직접 하늘에 들어간다는 뜻
  rationale: Ge'ez 원문은 하늘의 문들이 그들을 위해 열린다고만 말하므로, 본문이 말하지 않는 방향으로 의미를 단정하지 않고 apocalyptic 이미지를 보존합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
