base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
  footnotes:
  - marker: a
    text: The verb rendered 'will be neglected' is uncertain in the Ethiopic OCR; the sense appears to be that the righteous message loses standing or is set aside.
    reason: textual_variant
  - marker: b
    text: The verb rendered 'will turn aside' may reflect a difficult or corrupt reading; alternatives such as 'go astray' are possible.
    reason: alternative_reading
  - marker: c
    text: Or 'they will devise great inventions/compositions.' The Ethiopic expression can denote things formed or produced; here the context of lying favors 'fabrications.'
    reason: lexical_alternative
  - marker: d
    text: Or 'for the word of righteousness will be neglected, and many sinners will turn aside'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제 나는 이 비밀을 압니다. 곧 많은 죄인들이 의의 말씀을 바꾸어 그것을 왜곡하고[a] 악한 말을 하며 거짓말을 하고, 또 그들은 큰 꾸며낸 것들을 만들며[c][b] 자기들의 말에 관한 책들을 쓸 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 ‘의의 말씀’을 죄인들이 바꾸어 왜곡하는 능동형 표현입니다.
    reason: textual_variant
  - marker: b
    text: ‘큰 꾸며낸 것들’은 원문의 ‘만들다/형성하다’ 계열 동사를 문맥상 부정적으로 살린 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘큰 발명/구성물들을 만들며’로도 옮길 수 있습니다.
    reason: alternative_reading
