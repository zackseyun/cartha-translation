theological_decisions:
- issue: 마지막 문장이 책 쓰기 자체를 정죄하는지 여부
  chosen_reading: 정죄의 초점은 책 자체가 아니라, 죄인들이 자기들의 거짓된 말을 지지하기 위해 책들을 쓰는 행위에 있습니다.
  alternative_readings:
  - 모든 추가 저술을 포괄적으로 비난한다
  - 문학 활동을 중립적으로 예고한다
  rationale: 문맥이 거짓말과 왜곡된 말의 연장선에 있기 때문에, 한국어에서도 저술 행위의 목적을 분명히 드러내는 편이 원문에 더 가깝습니다.
  doctrine_reference: 원문 우선 원칙; 문맥이 허락하지 않는 일반화를 피함
