  terminology: ‘의인들’, ‘죄인들’, ‘폭력’, ‘하늘의 선한 이들’은 적절합니다. 특히 ኄራነ ሰማይ는 ‘하늘의 군대’가 아니라 ‘하늘의 선한 이들’로 옮기는 것이 원문의 윤리적 대조에 충실합니다.
