base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
  footnotes:
  - marker: a
    text: Or 'the heavenly host.' The closing phrase may refer to the company of heaven in general, not only to angels as a narrowly defined class.
    reason: lexical_alternative
  - marker: b
    text: Or 'the host of heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 이제, 의인들아, 죄인들이 강성해지고 그들의 길에서 형통하는 것을 본다고 해서 두려워하지 마십시오. 그들의 동료가 되지 말고, 그들의 폭력[b]에서 멀리 떨어져 있으십시오. 여러분은 하늘의 선한 이들[a]의 동료가 될 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘하늘의 선한 이들’은 하늘의 공동체 전체를 가리킬 수 있으며, 천사들만을 뜻한다고 단정하지는 않습니다.
    reason: theological_note
  - marker: b
    text: 원문의 ‘폭력’은 억압이나 불의까지 포함할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  english_pob_choice: do not fear
  chosen_korean: 두려워하지 마십시오
  alternatives_korean:
  - 무서워하지 마십시오
  - 두려워 말십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 의인들에게 주는 직접적인 금지 명령이므로, 자연스럽고 단호한 합쇼체로 옮겼습니다.
- source_word: ጻድቃን
  english_pob_choice: righteous ones
  chosen_korean: 의인들
  alternatives_korean:
  - 의로운 이들
  - 의인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 대조 구조에서 집합적 명칭으로 기능하므로, 한국어에서도 명사적 집단을 드러내는 '의인들'이 적절합니다.
- source_word: ይጸንዑ / ይደልዉ
  english_pob_choice: growing strong and prospering
  chosen_korean: 강성해지고 ... 형통해 보인다고
  alternatives_korean:
  - 굳세어지고 ... 잘되어 간다고
  - 강해지고 ... 번성한다고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사는 죄인들의 겉보기에 번성하는 상태를 함께 묘사하므로, 힘의 증대와 성공의 인상을 함께 살렸습니다.
- source_word: ፍኖቶሙ
  english_pob_choice: their ways
  chosen_korean: 그들의 길
  alternatives_korean:
  - 그들의 행로
  - 그들의 삶의 길
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 행실과 삶의 방식을 뜻하는 비유적 표현이므로, 익숙하면서도 도덕적 함의를 지닌 '길'로 옮겼습니다.
- source_word: ሱቱፋነ
  english_pob_choice: companions
  chosen_korean: 동료
  alternatives_korean:
  - 동반자
  - 동참자
  - 동료가 되는 사람
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 같이 속하거나 함께하는 관계를 나타내므로, 두 번 반복되는 병행성을 살릴 수 있는 '동료'를 택했습니다.
- source_word: ኄራነ ሰማይ
  english_pob_choice: the good ones of heaven
  chosen_korean: 하늘의 선한 이들
  alternatives_korean:
  - 하늘의 좋은 이들
  - 하늘의 선한 자들
  - 하늘의 의인들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주석상의 수정에 따라 이 표현은 '하늘의 선한 이들'로 옮겨, 땅의 죄인들과 하늘의 선한 자들 사이의 윤리적 대조를 보존했습니다.
theological_decisions:
- issue: ‘하늘의 선한 이들’의 범위
  chosen_reading: 천상의 공동체를 가리키되, 본문이 명시하지 않은 ‘천사들’로 좁히지 않았습니다.
  alternative_readings:
  - 하늘의 군대
  - 천사들
  rationale: 지시 대상이 집합적·윤리적 표현이므로, 천사로 한정하면 본문의 대조 구조와 범위를 좁힐 수 있습니다.
  doctrine_reference: 해석을 서두르지 않고 본문이 말하는 윤리적-종말론적 대비를 유지합니다.
