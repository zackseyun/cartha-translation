    text: 여기서는 빛과 어둠, 낮과 밤이 모든 죄를 목격하는 증인처럼 묘사됩니다. 문맥상 ‘드러나게나 숨겨지게나, 언제나’라는 뜻을 내포할 수도 있습니다.
    reason: cultural_note
