  source_fidelity: 마지막 절의 핵심 동사들은 현재 본문처럼 ‘너희를 약탈한 자들을 도운’으로 옮기는 것이 적절합니다. 다만 현행 각주 b는 이미 배제된 ‘압제하고 유혹한’ 해석을 대안으로 제시하여 원문 어휘와 맞지 않습니다. 또한 ዚአክሙ의 ‘너희를 위하여/너희에 관하여’라는 방향을 본문에 더 직접적으로 반영하는 편이 낫습니다.
  naturalness: ‘너희의 부르짖음에 대해서는, 부르짖으십시오’는 한국어로 다소 번역투입니다. ‘너희를 위하여 부르짖으십시오’가 현대 표준어 합쇼체에서 더 자연스럽고 원문의 지시 대상도 드러냅니다. ‘천사들로부터 … 추적될’도 한국어에서는 부자연스러우므로, 출처·책임의 대상으로 조사되는 뜻을 살려 ‘천사들에게서 … 찾아내질’로 다듬었습니다.
  terminology: ‘천사들’, ‘고난’, ‘약탈한 자들’은 1에녹의 묵시적 문맥과 보정된 어휘 판정에 부합합니다. ‘압제하다/유혹하다’라는 각주상의 대안은 አርደእዎሙ(돕다)와 የሀይዱክሙ(약탈하다)의 의미를 반영하지 못하므로 삭제해야 합니다.
