base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
  footnotes:
  - marker: a
    text: The clause 'he will make it known to you' reflects a difficult stretch of the Ge'ez text; 'he will show/reveal it to you' is also possible.
    reason: lexical_alternative
  - marker: b
    text: The final phrase is syntactically uncertain. It may also be understood as 'from all who oppressed and led you astray' or 'from all those who oppressed you and misled you.'
    reason: alternative_reading
  - marker: c
    text: Or 'And cry out on your behalf, and he will make it known to you;'.
    reason: previous_rendering
  - marker: d
    text: Or 'those who oppressed those who led you astray'.
    reason: previous_rendering
  - marker: e
    text: Or 'from among the angels'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희의 부르짖음에 대해서는, 부르짖으십시오. 그러면 그가 너희에게 그것을 드러내실 것입니다. 이는 너희의 모든 고난이 천사들로부터, 또 너희를 약탈한 자들을 도운 모든 이에게서 추적될 것이기 때문입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 너희에게 그것을 드러내실 것입니다’는 난해한 지점을 따라 계시적 의미를 살린 번역입니다. ‘보여주실 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 구절은 해독이 다소 불확실합니다. ‘너희를 약탈한 자들을 도운 모든 이’ 외에 ‘너희를 압제하고 유혹한 모든 이’ 등으로도 이해할 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወጽራኅ
  english_pob_choice: and cry out
  chosen_korean: 부르짖으십시오
  alternatives_korean:
  - 외치십시오
  - 소리치십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 공적인 강한 외침의 명령형으로 이해하여, 예언적·묵시적 어조를 살린 ‘부르짖다’로 옮겼습니다.
- source_word: ኵነኒ / ወያስተርኢ
  english_pob_choice: he will make it known / and he will make it known
  chosen_korean: 그가 너희에게 그것을 드러내실 것입니다
  alternatives_korean:
  - 그가 너희에게 그것을 알리실 것입니다
  - 그가 너희에게 그것을 보여주실 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 동사가 함께 ‘드러내다/보여주다’의 계시적 의미를 이루므로, 지나치게 평면적인 ‘알리다’보다 ‘드러내다’가 본문의 계시성을 더 잘 보존합니다.
- source_word: መላእክት
  english_pob_choice: angels
  chosen_korean: 천사들
  alternatives_korean:
  - 사자들
  - 메신저들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1에녹의 묵시 문맥에서는 일반적 ‘사자’보다 하늘 존재를 가리키는 ‘천사들’이 더 직접적이므로 이를 따랐습니다.
- source_word: እለ አርደእዎሙ / ለእለ የሀይዱክሙ
  english_pob_choice: those who helped those who plundered you
  chosen_korean: 너희를 약탈한 자들을 도운 모든 이
  alternatives_korean:
  - 너희를 약탈한 자들을 도운 자들
  - 너희를 노략한 자들을 도운 모든 사람
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 보정된 해독에 따라 አርደእዎሙ는 ‘돕다’, የሀይዱክሙ는 ‘약탈하다/노략하다’로 읽어, 두 행위의 관계를 그대로 반영했습니다.
- source_word: ኵሉ ምንዳቤክሙ
  english_pob_choice: all your affliction
  chosen_korean: 너희의 모든 고난
  alternatives_korean:
  - 너희의 모든 고통
  - 너희의 모든 환난
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 광범위한 고난·압박을 가리키는 표현이므로, 의미를 좁히지 않는 ‘고난’을 기본값으로 삼았습니다.
theological_decisions:
- issue: መላእክት의 의미를 천상 존재로 볼지, 권세자들로 볼지
  chosen_reading: 천사들
  alternative_readings:
  - 권세자들
  - 통치자들
  rationale: 주어진 문자형과 1에녹의 묵시적 세계관을 우선하여 천상 존재로 읽었습니다. 본문이 지상적 억압을 말하더라도, 계시 문맥에서는 ‘천사들’이 텍스트의 고유한 우주론을 더 잘 보존합니다.
  doctrine_reference: 원문 우선 번역; 묵시문학의 우주론 보존
