  chosen_korean: 기록하지 않는다 / 기록되고 있습니다
  alternatives_korean:
  - 적어 두지 않는다
  - 기록되어 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 반복 동사는 ‘기록하다’의 계속적 행위를 나타내므로, 인용문 안에서는 현재 부정으로, 결론절에서는 진행 수동으로 대비를 살렸습니다.
theological_decisions:
- issue: 인용문 안의 주체가 누구인지
  chosen_reading: 인용문은 죄인들이 하나님/심판자에게 자기 죄가 추적·기록되지 않는다고 주장하는 말로 읽었습니다.
  alternative_readings:
  - 죄인들이 자기들끼리 하는 말
  - 그들이 자신들이 추적되지 않는다고 말하는 모호한 진술
  rationale: 게으즈 구문에서 ‘너희 죄인들’은 말하는 주체에 붙어 있고, 인용문 내부는 그들의 주장으로 이어지므로 심판 맥락에서의 항변으로 번역하는 것이 가장 자연스럽습니다.
  doctrine_reference: 심판과 기록의 묵시적 이미지를 평면화하지 않고 유지합니다.
