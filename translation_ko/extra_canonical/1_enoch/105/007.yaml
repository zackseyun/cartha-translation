  rationale: 감탄조가 아니라 2인칭 복수 화자 진술이므로 ‘너희 죄인들이’로 처리하고, 인용을 여는 ‘말하기를’로 문장 구조를 명확히 했습니다.
- source_word: ኢትኅሥሡ
  english_pob_choice: are not sought out
  chosen_korean: 찾아내지 않고
  alternatives_korean:
  - 조사하지 않고
  - 찾지 않고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 탐색·조사·추적의 뜻을 가지므로, 여기서는 죄를 추적해 드러내지 않는다는 뉘앙스를 살려 ‘찾아내지’로 옮겼습니다.
- source_word: ይጽሐፉ ሀለዉ
