  source_fidelity: 수정이 필요합니다. 게으즈어 본문의 አንትሙ ኃጥኣን은 인용문 밖에서 ትብሉ(‘너희가 말한다’)의 주어인 ‘너희 죄인들’에 붙습니다. 또한 인용문 안의 ኢትኅሥሡ는 2인칭 복수, ይጽሐፉ … ሀለዉ는 3인칭 복수의 계속적 서술로 보아, 초안처럼 ‘우리 죄는 찾아내지 않고’ 및 수동태로 평준화하지 않는 편이 원문 형태에 더 충실합니다.
  naturalness: ‘이는 … 때문입니다’로 원인절을 독립적으로 처리하고, 직접 인용은 ‘라고 말하지만’으로 연결하여 현대 표준 한국어 합쇼체 문장으로 자연스럽게 다듬었습니다. 원문의 의도적인 듯한 인칭 전환은 본문에서 보존하되 각주로 설명했습니다.
  terminology: 심판의 법정적 어감을 지닌 ‘조사하다’와 기록 모티프를 보존하는 ‘기록하다’를 사용했습니다. 기록 주체를 본문에 없는 특정 존재로 규정하지 않고 ‘그들’로 남겼습니다.
  issues:
  - severity: high
    issue: 인용문 안의 인칭과 태가 평준화됨
    rationale: 초안의 ‘우리 죄는 찾아내지 않고’는 원문의 2인칭 복수 동사 ኢትኅሥሡ를 1인칭 복수 수동/무주체 표현으로 바꿉니다. 또한 ‘기록되고 있습니다’는 원문의 3인칭 복수 동작 주체를 지웁니다.
  - severity: high
    issue: 각주가 원문에 없는 자기지시적 읽기를 사실상 확정함
    rationale: 전달된 본문은 인용문 밖에 ‘너희 죄인들’을 두며, 인용 안에는 ‘너희는’, ‘우리의 죄’, 결론의 ‘너희의 죄’가 나타납니다. 이를 모두 죄인들의 자기지시로 해소하면 인칭 전환이라는 본문상의 난점을 감춥니다.
  - severity: medium
    issue: 첫 연결어 ‘그리고’가 እስመ의 원인 관계를 약화함
    rationale: እስመ는 ‘왜냐하면/…때문입니다’의 원인절입니다. 한국어에서는 앞 절이 제시되지 않은 단독 절이라는 점을 고려하여 ‘이는 … 때문입니다’로 옮기는 것이 적절합니다.
  revised_text: 이는 너희 죄인들이 ‘너희는 조사하지 않고, 그들은 우리의 모든 죄를 기록하지 않는다’라고 말하기 때문입니다. 그러나 그들은 너희의 모든 죄를 날마다 기록하고 있습니다.[a]
  revised_footnotes:
  - marker: a
    text: 전달된 게으즈어 본문은 인용문 안에서 ‘너희는’(2인칭 복수), ‘우리의 죄’(1인칭 복수)를 함께 사용하고, 뒤의 선언에서는 다시 ‘너희의 죄’(2인칭 복수)로 전환합니다. 번역은 이 인칭 전환을 보존합니다. ‘그들’은 원문에 명시되지 않은 기록의 행위자이며, 특정 존재로 단정하지 않았습니다.
    reason: textual_variant
  revision_rationale: 영어 POB 감사 기록에는 인용문을 수동태 및 1인칭 자기진술로 재구성한 단계가 있으나, 최신 영어 개정도 그 재구성을 되풀이합니다. 이에 비해 제시된 게으즈어 형태 자체의 인칭·동사 형태를 우선하여, 2인칭 복수 ‘너희는 조사하지 않고’와 3인칭 복수 ‘그들은 기록한다’를 보존했습니다. 불규칙하거나 난해한 인칭 전환은 교리적으로 조화시키지 않고 각주로만 밝혔습니다.
