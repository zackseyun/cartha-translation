base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
  footnotes:
  - marker: a
    text: 'The transmitted wording in the quotation is awkward: the Ethiopic has a second-person pronoun near ''sinners,'' but the sense of the speech is most naturally the sinners'' own claim, hence ''we sinners.'''
    reason: textual_variant
  - marker: b
    text: The verb rendered 'sought out' can also mean 'investigated' or 'searched for,' with a judicial sense in context.
    reason: lexical_alternative
  - marker: c
    text: Or 'And because you say, ‘We sinners are not sought out, and all our sins are not written down’'.
    reason: previous_rendering
  - marker: d
    text: Or 'behold, all your sins are being written down'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희 죄인들이 말하기를, 「우리 죄는 찾아내지 않고, 우리의 모든 죄도 기록하지 않는다」 하니 — 모든 너희 죄는 매일 기록되고 있습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문의 2인칭 복수 표현은 화자 표지상 ‘너희 죄인들’에 해당하지만, 전체 의미는 죄인들이 자기 죄를 두고 항변하는 진술로 읽는 것이 가장 자연스럽습니다.
    reason: textual_variant
