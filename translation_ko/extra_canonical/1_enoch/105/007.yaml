  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 원인절로 시작하지만 한국어에서는 뒤의 인용문을 자연스럽게 이끄는 연결로 풀어 쓰는 것이 문장 흐름을 가장 잘 살립니다.
- source_word: ትብሉ + አንትሙ ኃጥኣን
