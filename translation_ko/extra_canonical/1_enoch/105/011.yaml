base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
  footnotes:
  - marker: a
    text: Literally, 'in/upon their tongues'; here rendered 'in their languages' because the context concerns writing Enoch's words for different linguistic communities.
    reason: lexical_alternative
  - marker: b
    text: The closing phrase is compressed in the Ethiopic and may also be understood as 'all the former things' rather than explicitly 'all that was written before.'
    reason: alternative_reading
  - marker: c
    text: Or 'all my words are written down truthfully in their languages, and they neither alter'.
    reason: previous_rendering
  - marker: d
    text: Or 'all that was written before'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들이 자기들의 언어들[a]로 모든 말을 진실하게 쓰며, 내 말에서 아무것도 바꾸지 않고 또 아무것도 빼지 않으며, 오히려 모든 것을 진실하게 곧 예전의 모든 것을[b] 씁니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘그들의 혀 위에’이지만, 문맥상 여러 언어로 옮겨 적는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이전에 쓰인 모든 것’으로도 이해할 수 있습니다.
    reason: alternative_reading
