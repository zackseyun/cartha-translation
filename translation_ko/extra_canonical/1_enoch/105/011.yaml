review_pass:
  verdict: revise
  source_fidelity: The draft correctly treats ይጽሐፉ as active and preserves the final compressed expression as ‘예전의 모든 것.’ However, it omits the temporal force of ወሶበሰ (‘when’), which is explicit in the source and retained in the English audit text. The prohibitions are more clearly and faithfully coordinated in Korean by placing ‘내 말에서’ over both altering and omitting.
  naturalness: ‘자기들의 언어들’ and ‘진실하게 쓰다’ are somewhat literal and awkward in modern standard Korean. Korean ordinarily leaves this plural unmarked (‘그들의 언어로’), and ‘바르게 기록하다’ better conveys faithful/correct textual recording without suggesting merely subjective sincerity. Because the source verse is an unfinished temporal clause, a terminal dash appropriately preserves its syntactic incompleteness.
  terminology: No names or doctrinal terms occur. ‘기록하다’ is suitable for the repeated scribal-writing verb in this context, and the same verb is retained for both occurrences.
  issues:
  - severity: medium
    issue: The temporal connective ‘when’ is absent.
    rationale: ወሶበሰ introduces a temporal clause. Rendering the line as independent coordinated statements loses the source syntax and the English POB’s ‘And when.’
  - severity: low
    issue: The Korean scope of ‘내 말에서’ is potentially limited to omission alone.
    rationale: The source prohibits alteration and removal in relation to the speaker’s words. ‘내 말에서 아무것도 바꾸거나 빼지 않으며’ clearly applies the phrase to both verbs.
  - severity: low
    issue: Some phrasing is overly literal or less idiomatic.
    rationale: ‘자기들의 언어들’ is unnatural pluralization in Korean, and ‘진실하게 쓰다’ can imply sincerity rather than accurate, faithful recording. ‘그들의 언어로’ and ‘바르게 기록하다’ are natural while preserving the sense.
  revised_text: 그리고 그들이 그들의 언어로 모든 말을 바르게 기록하고, 내 말에서 아무것도 바꾸거나 빼지 않으며, 오히려 모든 것을 바르게, 곧 예전의 모든 것을 기록할 때에—
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘그들의 혀 위에’이지만, 문맥상 여러 언어로 옮겨 기록하는 뜻으로 이해하는 것이 자연스럽습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘이전에 기록된 모든 것’으로도 이해할 수 있습니다.
    reason: alternative_reading
  revision_rationale: 시간 접속사와 미완결 절의 형태를 복원하여 원문의 구문을 보존했습니다. ‘내 말에서’가 ‘바꾸다’와 ‘빼다’ 모두에 걸리도록 조정했고, 현대 한국어의 자연스러운 문체를 위해 ‘언어들’과 ‘진실하게 쓰다’를 각각 ‘언어로’와 ‘바르게 기록하다’로 다듬었습니다. 마지막 표현은 원문의 압축성과 모호성을 유지하여 ‘예전의 모든 것’으로 남겼습니다.
