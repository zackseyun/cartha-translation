base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/007/001.yaml
  text: And all the others with them took wives for themselves[a], and each chose one for himself.
  footnotes:
  - marker: a
    text: Or 'took women for themselves.' The Ge'ez noun can denote women generally, but in this construction it commonly carries the sense 'wives.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그들과 함께한 나머지 이들도 모두 아내들을[a] 취했고, 각자 자신을 위하여 한 사람씩 골랐습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자신들을 위하여 여자들을 취했다’로 옮길 수 있습니다. 게에즈어 명사는 일반적으로 ‘여자들’을 뜻할 수 있지만, 이 구문에서는 대개 ‘아내들’의 뜻으로 읽힙니다.
    reason: lexical_alternative
