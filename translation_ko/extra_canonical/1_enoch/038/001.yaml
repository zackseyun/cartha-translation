review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the heading, the temporal protasis that continues into v. 2, the appearance of the righteous assembly, judicial treatment of sinners on account of their sins, and expulsion. However, ‘땅의 얼굴 앞에서’ misconstrues the idiom ‘from the face/surface of the ground’; Korean requires ‘땅 위에서’ (with the literal ‘마른 땅의 표면에서’ retained in a note). ‘자기 죄들로’ is also an unnatural and less precise rendering of the causal/judicial force.
  naturalness: ‘…쫓겨날 때입니다’ falsely completes the temporal clause and is not natural in this context. The verse should remain an intentionally unfinished ‘…때,’ clause because its apodosis follows in the next verse. The revised wording uses modern formal Korean while preserving that syntax.
  terminology: ‘비유,’ ‘의인들의 회중,’ and ‘심판을 받으며’ are suitable. ‘심판을 받다’ preserves the judicial sense without prematurely narrowing it to condemnation. ‘땅 위에서’ is the idiomatic contextual rendering, and the literal dry-ground imagery is documented in the footnote.
  issues:
  - severity: high
    issue: The temporal protasis is rendered as a complete sentence (‘…때입니다’).
    rationale: Ge'ez ሶበ introduces a ‘when’ clause whose completion occurs in v. 2. Closing it with ‘때입니다’ changes the syntax and disrupts the inter-verse construction.
  - severity: high
    issue: ‘땅의 얼굴 앞에서’ is an erroneous Korean rendering of ‘from the face of the ground.’
    rationale: The phrase denotes removal from the surface/face of the ground, not expulsion from in front of a face. ‘땅 위에서’ is idiomatic; the literal image belongs in a note.
  - severity: medium
    issue: Footnote anchors are both placed at the end of the verse rather than at the relevant heading and ground phrase.
    rationale: The lexical note should anchor ‘땅 위에서,’ while the alternate whole-verse rendering should anchor the heading or sentence-level opening.
  - severity: low
    issue: ‘자기 죄들로’ is awkward Korean.
    rationale: The preposition marks the basis/cause of judgment. ‘자기 죄 때문에’ is natural and preserves that force.
  revised_text: 첫 번째 비유입니다.[b] 의인들의 회중이 나타나고, 죄인들이 자기 죄 때문에 심판을 받으며, 땅 위에서[a] 쫓겨날 때,
  revised_footnotes:
  - marker: a
    text: 직역하면 ‘마른 땅의 표면에서’입니다. 이 표현은 관용적으로 ‘땅 위에서’ 또는 ‘땅에서’를 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: '또는 ‘첫 번째 비유: 의인들의 회중이 드러나고, 죄인들이 자기 죄 때문에 심판을 받으며, 마른 땅의 표면에서 쫓겨날 때,’'
    reason: previous_rendering
  revision_rationale: The revision preserves the source's heading plus incomplete temporal clause, corrects the ground-surface idiom, improves Korean causal phrasing, and relocates the notes to their relevant anchors. It does not resolve ‘judged’ as ‘condemned’ or otherwise add doctrinal interpretation.
