translation:
  language: ko
  text: 첫 번째 비유입니다. 의인들의 회중이 나타나고, 죄인들이 자기 죄들로 심판을 받으며, 땅의 얼굴 앞에서 쫓겨날 때입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘마른 땅의 얼굴 앞에서’입니다. 관용적으로는 ‘땅 앞에서’ 또는 ‘땅에서’로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘의인들의 회중이 드러나고, 죄인들이 자기 죄들로 심판을 받으며, 마른 땅의 얼굴 앞에서 쫓겨날 때입니다.’
    reason: previous_rendering
