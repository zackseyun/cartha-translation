  english_pob_choice: It would have been better for them had they not been born
  chosen_korean: 그들은 태어나지 않았더라면 더 나았을 것입니다
  alternatives_korean:
  - 그들이 태어나지 않았더라면 더 좋았을 것입니다
  - 차라리 태어나지 않았더라면 더 나았을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 강한 심판적 관용구를 자연스러운 현대 한국어로 옮겼습니다. 종결의 완곡함보다 판결문의 कठ연한 느낌을 유지했습니다.
