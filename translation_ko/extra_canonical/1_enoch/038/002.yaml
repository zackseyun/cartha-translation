  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시각적·신체적 현현을 보존하기 위해 직역적 이미지를 유지했습니다. ‘얼굴 위에’는 나타남의 가시성을 살립니다.
- source_word: ተግባሮሙ ስቁል በእግዚአ፡ መናፍስት
  english_pob_choice: whose deeds hang upon the Lord of Spirits
