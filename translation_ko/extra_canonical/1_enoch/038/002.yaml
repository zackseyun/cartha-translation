  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥에서 드러나는 하나님 앞의 바름과 의인의 공적 표지를 살리기 위해 ‘의로움’으로 옮겼습니다. 단순한 규범적 ‘의’보다 현현하는 성격이 조금 더 살아납니다.
- source_word: በገጾሙ
  english_pob_choice: on the faces of them
  chosen_korean: 의인들의 얼굴 위에
  alternatives_korean:
  - 그들의 면전에
  - 그들의 얼굴에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시각적·신체적 현현을 보존하기 위해 직역적 이미지를 유지했습니다. ‘얼굴 위에’는 나타남의 가시성을 살립니다.
- source_word: ተግባሮሙ ስቁል በእግዚአ፡ መናፍስት
  english_pob_choice: whose deeds hang upon the Lord of Spirits
  chosen_korean: 선택된 자들의 행위는 영들의 주님께 매달려 있으며
  alternatives_korean:
  - 선택된 자들의 행위는 영들의 주님께 의존하고 있으며
  - 선택된 자들의 행위는 영들의 주님 앞에 붙들려 있으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘매달리다’는 기묘하지만 원문의 비유를 가장 직접적으로 보존합니다. POB의 난해한 이미지와 문법적 긴장을 한국어에서도 평평하게 만들지 않았습니다.
- source_word: የኃድሩ ዲበ የብስ
  english_pob_choice: who dwell on the dry ground
  chosen_korean: 마른 땅에 거하는
  alternatives_korean:
