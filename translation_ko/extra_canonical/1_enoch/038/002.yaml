  - 마른 땅에서 사는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘dry ground’를 일반적인 ‘땅’으로 풀지 않고, 지시된 우주론적 이미지를 살려 ‘마른 땅’으로 유지했습니다.
- source_word: ክሕድዎ
  english_pob_choice: denied
  chosen_korean: 부인한
  alternatives_korean:
  - 거부한
  - 부정한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘영들의 주님’을 향한 종교적·법정적 거절의 강도를 살리기 위해 ‘부인한’을 택했습니다. 한국어에서 비교적 직접적으로 배반/부인의 뉘앙스를 전합니다.
