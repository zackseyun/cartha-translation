base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
  footnotes:
  - marker: a
    text: The phrase 'whose deeds hang upon the Lord of Spirits' is difficult. It may mean that their deeds depend on him or are upheld before him.
    reason: lexical_alternative
  - marker: b
    text: '''Dry ground'' is a literal rendering; it likely refers to the inhabited land in contrast to the cosmic waters.'
    reason: cultural_note
  - marker: c
    text: Or 'And righteousness will appear'.
    reason: previous_rendering
  - marker: d
    text: Or 'and he will show light'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 의로움이 의인들의 얼굴 위에 나타나고, 선택된 자들의 행위는 영들의 주님께 매달려 있으며, 빛도 의인들과, 마른 땅에 거하는 선택된 자들에게 나타날 것입니다. 그러면 죄인들의 거처는 어디에 있으며, 영들의 주님을 부인한 자들의 쉬는 곳은 어디에 있겠습니까? 그들은 태어나지 않았더라면 더 나았을 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘선택된 자들의 행위는 영들의 주님께 매달려 있으며’는 난해한 표현입니다. ‘의존하고 있으며’ 또는 ‘그분 앞에 붙들려 있으며’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: ‘마른 땅’은 문자적으로는 건조한 땅/육지를 가리키며, 아마도 우주적 물과 대비되는 거주 세계를 뜻합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘의로움이 나타날 것입니다’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘빛이 나타날 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ጽድቅ
