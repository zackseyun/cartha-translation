  source_fidelity: 개정이 필요합니다. 초안은 핵심 어휘와 심판의 취지를 대체로 보존하지만, ‘선택된 자들’을 ‘의인들’과 병렬된 별도 집단처럼 처리하여 원문의 ‘의인들, 곧 선택된 이들’이라는 동격 및 그들의 행위라는 수식 관계가 흐려졌습니다. 또한 원문의 시간적 조건과 두 번 반복되는 ‘나타나다’를 한국어 문장 안에서 더 분명히 드러낼 필요가 있습니다.
  naturalness: ‘얼굴 위에’는 한국어에서 다소 직역투이므로, 가시적 이미지를 잃지 않는 ‘얼굴에’가 자연스럽습니다. ‘마른 땅에 거하는’도 문어적으로 가능하나 현대 표준어 합쇼체 본문에서는 ‘마른 땅에 사는’이 더 자연스럽습니다. 난해한 ‘매달려 있다’는 원문의 비유를 보존하되, 문장 구조를 정리하면 읽기 쉬워집니다.
  terminology: ‘의로움’, ‘영들의 주님’, ‘부인한’, ‘거처’, ‘쉬는 곳’은 원문의 핵심 개념을 무리 없이 반영합니다. ‘선택된 자들’은 가능하지만 현대 한국어에서는 ‘선택된 이들’이 더 자연스럽고, 선택됨이라는 집단 표지를 유지합니다. ‘행위’는 원문의 ‘deeds’를 충실히 반영합니다.
  issues:
  - severity: medium
    issue: ‘의인들’과 ‘선택된 자들’ 및 ‘그들의 행위’의 관계가 불분명합니다.
    rationale: 원문은 의인들을 선택된 이들과 연결하고, 뒤의 ‘행위’를 그들에게 귀속시키는 구조입니다. 초안은 ‘선택된 자들의 행위’를 독립 절로 처리하여, ‘의인들, 곧 선택된 이들’이라는 관계가 약화됩니다.
  - severity: low
    issue: ‘의인들의 얼굴 위에’가 부자연스럽습니다.
    rationale: 원문의 구체적 얼굴 이미지는 유지되어야 하나, 현대 한국어에서는 ‘얼굴에 나타나다’가 자연스럽고 의미 손실이 없습니다.
  - severity: medium
    issue: 각주 c와 d가 본문 및 서로의 대안 관계를 정확히 반영하지 못합니다.
    rationale: c는 본문 첫 동사의 현재형처럼 보이는 표현에 대한 시제 대안으로 제시되지만, 개정문은 원문의 종말론적 미래를 일관되게 사용합니다. d는 초안 본문과 동일한 ‘빛이 나타날 것입니다’를 대안으로 제시하므로 유효한 대안이 아닙니다. 원문의 반복 동사는 각주에서 ‘드러날 것입니다’라는 번역 대안으로 기록하는 편이 적절합니다.
  revised_text: 의로움이 의인들, 곧 선택된 이들의 얼굴에 나타나고, 그들의 행위가 영들의 주님께 매달려 있으며[a], 빛이 마른 땅에 사는 의인들과 선택된 이들에게 나타날 때[b], 죄인들의 거처는 어디에 있겠으며, 영들의 주님을 부인한 이들의 쉬는 곳은 어디에 있겠습니까? 그들은 태어나지 않았더라면 더 나았을 것입니다.
