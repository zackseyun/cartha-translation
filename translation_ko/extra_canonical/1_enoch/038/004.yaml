  source_fidelity: 첫 절의 게에즈어 구문에서는 ‘땅을 차지한 자들’이 주어이고, ‘강하고 높은’이 부정되는 서술어입니다. 따라서 현 초안처럼 ‘능력자들과 높임을 받은 자들’을 주어로 삼아 ‘더는 그러하지 못하다’라고 하면 한국어에서 지시 대상과 의미가 불명확해집니다. 또한 ‘더는 없을 것이다’라는 각주는 지위 상실을 존재의 소멸로 바꾸므로 본문 근거가 약합니다. 수정문은 땅을 지배하는 자들이 더 이상 권세 있고 높은 자들이 아니게 된다는 뜻, 얼굴을 바라보지 못한다는 표현, 그리고 선택된 의로운 거룩한 이들의 얼굴 위에 빛이 나타나는 이미지를 보존합니다.
  naturalness: ‘더는 그러하지 못할 것이며’는 현대 한국어에서 무엇을 가리키는지 불분명합니다. ‘더 이상 권세 있고 높은 자들이 아닐 것이며’는 합쇼체 문체로 자연스럽고 원문의 술어 관계도 명확합니다. ‘택하신 이들’보다 ‘택함을 받은 이들’이 이 문맥에서 수식 관계를 더 분명히 드러냅니다.
  terminology: ‘영들의 주님’은 에녹서의 고정 신명으로 유지할 수 있습니다. ዐዚዛነ/እልዑላነ은 사회적·정치적 권세와 높은 지위를 함께 나타내므로 ‘권세 있고 높은 자들’로 옮겼습니다. ‘거룩한 이들, 의로운 이들, 택함을 받은 이들’은 원문의 세 호칭을 구별해 유지합니다.
