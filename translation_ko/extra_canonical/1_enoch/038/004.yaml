  - 권세자들과 높임을 받은 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 형용적 칭호 두 개를 그대로 살리되, 한국어에서는 자연스러운 병렬 명사구로 옮겨 지위와 힘의 뉘앙스를 함께 유지했습니다.
- source_word: ይእኅዝዋ ለምድር
  english_pob_choice: who possess the earth
  chosen_korean: 땅을 차지한
  alternatives_korean:
  - 땅을 붙든
  - 땅을 소유한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지속적 지배·장악의 뜻을 살려 ‘차지하다’로 옮겼습니다. ‘붙들다’는 동작이 너무 물리적이고, ‘소유하다’는 소유권 개념이 더 강해 문맥보다 좁아집니다.
- source_word: ገጸ ቅዱሳን
  english_pob_choice: the face of the holy ones
  chosen_korean: 거룩한 이들의 얼굴
  alternatives_korean:
  - 거룩한 이들의 면전
  - 거룩한 이들의 얼굴 앞
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘얼굴’이라는 관용적 이미지와 직접 대면의 의미를 함께 보존하기 위해 직역에 가깝게 유지했습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 영들의 주님
  alternatives_korean:
  - 영들의 주인
  - 영의 주님
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 고정된 신적 호칭을 한국어로 자연스럽게 옮기되, ‘주님’으로 하나님 호칭의 위상을 유지했습니다.
- source_word: አርአየ ብርሃኖ
  english_pob_choice: has caused his light to appear
  chosen_korean: 자신의 빛을 나타내셨기 때문입니다
  alternatives_korean:
  - 자신의 빛을 드러내셨기 때문입니다
  - 자신의 빛이 나타나게 하셨기 때문입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 사역적 ‘보이게 하다/나타나게 하다’ 의미를 살리면서도, 한국어에서는 ‘나타내셨다’가 가장 간결하고 자연스럽습니다.
theological_decisions:
- issue: ‘look on the face’의 의미
  chosen_reading: 단순한 시각 행위가 아니라 접근과 대면의 금지로 읽되, 원문의 얼굴 이미지는 유지했습니다.
  alternative_readings:
  - ‘거룩한 이들의 면전에 나아갈 수 없다’로 풀어 쓰는 방식
  - 그저 ‘볼 수 없다’로 단순화하는 방식
  rationale: 에녹적 표현은 직접 대면과 접근의 가능성을 포함하므로, 이미지의 힘을 살리면서도 한국어 문장은 과도하게 해설적으로 바꾸지 않았습니다.
  doctrine_reference: apocalyptic imagery and idiom preservation
