base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/003.yaml
  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
  footnotes:
  - marker: a
    text: Or 'their secrets.' The Ge'ez can denote what has been concealed, but the verse does not specify whether these are deeds, identities, or grounds of vindication.
    reason: lexical_alternative
  - marker: b
    text: Literally 'from the face of the righteous and the chosen,' an exclusion-from-presence formula common in judgment scenes.
    reason: cultural_note
  - marker: c
    text: Or 'Then the hidden things of the righteous will be revealed, and sinners will be judged'.
    reason: previous_rendering
translation:
  language: ko
  text: 의인들의 숨은 것들이 드러날 때[a], 죄인들은 심판을 받고, 악인들은 의인들과 택함을 받은 이들 앞에서 내쫓길 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘의인들의 비밀들’. 게에즈어는 감추어진 것들을 가리키지만, 그것이 행위인지, 정체인지, 또는 의롭다 하심의 근거인지는 특정하지 않습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሶበ
  english_pob_choice: When
  chosen_korean: -할 때
  alternatives_korean:
  - -하면
  - 그때
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시간을 여는 조건적/미래적 종속절이므로 한국어에서도 ‘-할 때’로 옮겨 apocalyptic한 긴장감을 살렸습니다.
- source_word: ኅቡኣቲሆሙ
  english_pob_choice: the hidden things of them
  chosen_korean: 그분들[a]의 숨은 것들
  alternatives_korean:
  - 그들의 비밀
  - 그분들의 감춰진 일들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘숨은 것들’은 원문의 복수성과 의미의 개방성을 유지하며, 단순히 ‘비밀’로 좁혀 버리지 않습니다.
- source_word: ይትኴነኑ
  english_pob_choice: will be judged
  chosen_korean: 심판을 받습니다
  alternatives_korean:
  - 판결을 받습니다
  - 정죄를 받습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적 수동을 살리면서도 ‘정죄’처럼 결과를 미리 확정하지 않도록 ‘심판을 받다’로 옮겼습니다.
- source_word: እምገጸ
  english_pob_choice: from the face of
  chosen_korean: 얼굴 앞에서
  alternatives_korean:
  - 앞에서
  - 면전에서
  - 임재 앞에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 이미지를 살려 ‘얼굴 앞에서’로 옮겼습니다. 이는 단순한 거리감이 아니라 판결 장면에서의 배제 이미지를 드러냅니다.
theological_decisions:
- issue: ‘hidden things’의 범위
  chosen_reading: 그분들[a]의 숨은 것들
  alternative_readings:
  - 그들의 비밀
  - 그들의 감춰진 행위
  rationale: 원문은 무엇이 숨겨졌는지 구체화하지 않으므로, 행위·정체·변증적 드러남의 가능성을 열어 두는 표현이 더 적절합니다.
  doctrine_reference: 의도적 모호성 보존
- issue: 마지막 배제 표현의 강도
  chosen_reading: 얼굴 앞에서 쫓겨날 것입니다
  alternative_readings:
  - 면전에서 물러나게 될 것입니다
  - 앞에서 제거될 것입니다
  rationale: 종말 심판의 배제 이미지를 완화하지 않기 위해 단순 이동보다 강한 ‘쫓겨나다’를 택했습니다.
  doctrine_reference: 원문 이미지 보존
