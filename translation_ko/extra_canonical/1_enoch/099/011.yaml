review_pass:
  verdict: revise
  source_fidelity: 수정이 필요합니다. 이 절의 통상적인 찰스 판본 독법과 문맥상 후반의 장소어는 ‘스올에서’이며, ‘너희 이웃에 의해’로 옮길 근거는 충분하지 않습니다. 전반의 በቢጽክሙ는 악을 퍼뜨리는 대상인 ‘너희 이웃에게/이웃들을 향해’로 옮기는 것이 적절합니다.
  naturalness: 초안은 합쇼체로 대체로 자연스럽지만, ‘너희 이웃에게 … 자들에게’는 호격 대상이 다소 겹치고, 후반의 ‘너희 이웃에 의해’는 의미상 부정확합니다. 직접 호격과 인과절을 분명히 하면 현대 한국어 문장으로 더 자연스럽습니다.
  terminology: ‘스올’은 고대 이스라엘의 죽은 자들의 영역을 가리키는 고유한 종교·문학 용어이므로 음역을 유지하는 것이 안전합니다. ‘화가 있습니다’는 심판 선언으로서 ‘화로다’보다 현대 합쇼체에 더 잘 맞습니다.
  issues:
  - severity: high
    issue: 후반절을 ‘너희 이웃에 의해 너희는 죽임을 당할 것’으로 번역함
    rationale: 이 절의 알려진 찰스 판본 독법은 ‘스올에서 죽임을 당할 것’입니다. 제공된 게에즈 전사문의 በቢጸል은 스올(በሲኦል)에 대한 OCR·전사 혼동일 가능성이 높으며, 현 번역은 이웃에 의한 보응이라는 근거 없는 의미를 본문에 부가합니다.
  - severity: medium
    issue: 각주가 번역 본문 대신 편집 이력과 ‘최신 수정안’을 설명함
    rationale: 성경 번역 각주는 독자에게 본문상 의미 있는 정보를 제공해야 하며, 내부 수정 이력을 말해서는 안 됩니다. ‘스올’의 의미를 간단히 설명하는 각주로 교체하는 것이 적절합니다.
  - severity: low
    issue: 호격 대상의 표현이 다소 중복됨
    rationale: ‘너희 이웃에게 악을 퍼뜨리는 자들에게’도 이해되지만, ‘… 너희에게’로 직접 이어 주면 원문의 ‘너희에게 화가 있다’는 구조가 더 선명합니다.
  revised_text: 너희 이웃에게 악을 퍼뜨리는 너희에게 화가 있습니다. 이는 너희가 스올에서 죽임을 당할 것이기 때문입니다.[a]
  revised_footnotes:
  - marker: a
    text: ‘스올’은 고대 이스라엘의 표현으로, 죽은 자들의 영역을 가리킵니다.
    reason: source_note
  revision_rationale: 전반절은 이웃을 악의 대상으로 유지하고, 후반절은 찰스 판본의 ‘스올’ 독법에 따라 번역했습니다. 이로써 이웃/동료의 반복을 전제로 한 보응 도식을 제거하고, 본문의 심판 선언을 과도한 해석 없이 보존했습니다. 각주는 내부 편집 설명을 삭제하고 용어 이해에 필요한 최소한의 정보만 제공합니다.
