  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 맥락의 수동적 미래를 한국어에서 가장 직접적으로 드러내는 표현을 택했습니다. ‘죽임을 당하다’는 가해 주체가 있음을 보존합니다.
