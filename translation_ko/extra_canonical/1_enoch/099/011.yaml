  text: Woe to you who spread evil to your neighbors[c][b][a], for by your neighbors you will be slain.
  footnotes:
  - marker: a
    text: 'The Ge''ez repeats the companion-word in both clauses, likely for rhetorical effect: those acting with companions are judged by companions.'
    reason: lexical_alternative
  - marker: b
    text: The first companion-phrase could also be rendered 'through your companions' if taken instrumentally rather than associatively.
    reason: lexical_alternative
  - marker: c
    text: Or 'spread out evil with your companions, for by companions you will be slain.'.
    reason: previous_rendering
