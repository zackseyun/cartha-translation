  chosen_reading: 악을 퍼뜨린 자들이 그 이웃에 의해 죽임을 당하는 측량대로의 심판을 드러낸다고 보았습니다.
  alternative_readings:
  - 단순히 이웃 때문에 죽는다는 일반 진술
  - ‘이웃’ 반복을 약화한 평범한 인과 진술
  rationale: 같은 ‘이웃’ 계열 표현이 양 절에 반복되므로, 도덕적 반전을 드러내는 보응 구조를 본문 속에 남겼습니다.
