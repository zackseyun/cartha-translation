  rationale: 제공된 최신 수정과 어휘 주석을 따라, 뒤쪽 절은 도구적/행위자적 관계를 드러내는 ‘~에 의해’로 옮겼습니다. 이웃/동료라는 반복을 유지해 보응의 대응 구조를 보이게 했습니다.
