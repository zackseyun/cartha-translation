    reason: textual_variant
  - marker: b
    text: ‘증언’으로 옮긴 말은 더 문자적으로 ‘증거’ 또는 ‘증인’으로도 이해될 수 있습니다. 본문에는 이 말과 별도로 ‘천사들’이 명시되어 있습니다.
