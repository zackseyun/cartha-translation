  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
  footnotes:
  - marker: a
    text: The Ethiopic verb in the clauses about the angels is textually difficult in this OCR witness; the sense may be 'read,' 'recite,' or more generally 'present.'
    reason: textual_variant
  - marker: b
    text: The word rendered 'angels' may also be understood more literally as 'hearers' or 'witnesses,' but the heavenly-court setting favors 'angels.'
    reason: lexical_alternative
  - marker: c
    text: Or 'the righteous will be prepared, so that your prayers may rise as a memorial, and the angels may read them before the Most High as a memorial against the sins of the sinners.'.
    reason: previous_rendering
translation:
  language: ko
  text: 이러한 날에, 너희 의인들아, 너희의 기도가 기억을 위한 기념물이 되게 하도록 준비하십시오. 또한 그것을 천사들 앞에 증언으로 내놓으십시오. 그러면 그들이 죄인들의 죄를 지극히 높으신 분 앞에 기억을 위한 기념물로 내놓을 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본문은 OCR 전승상 어려운 동사를 포함하므로, 문맥에 따라 ‘내놓다/제시하다/읽어주다’의 뜻으로 이해될 수 있습니다.
    reason: textual_variant
  - marker: b
    text: ‘천사들’은 더 문자적으로는 ‘듣는 이들’ 또는 ‘증인들’로도 볼 수 있으나, 문맥상 하늘 법정의 천사들이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 ‘죄인들의 죄’를 ‘지극히 높으신 분 앞에’ 기억의 기념물로 두는 구조로도 읽을 수 있습니다.
    reason: alternative_reading
