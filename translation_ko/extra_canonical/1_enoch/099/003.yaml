theological_decisions:
- issue: ‘기념물’과 하늘 법정의 기억 언어
  chosen_reading: 기도는 단순히 사적으로 기억되는 것이 아니라, 지극히 높으신 분 앞에서 죄인들의 죄를 드러내는 증언적 기념물로 제시됩니다.
  alternative_readings:
  - 기도가 단지 하나님께 기억되기만 하는 것으로 볼 수 있습니다.
  - 천사들이 기도의 내용을 단순 전달하는 역할만 한다고 볼 수 있습니다.
  rationale: 반복되는 '기념물/기억' 표현과 '천사들 앞에' 및 '지극히 높으신 분 앞에'라는 구조가 하늘 법정의 증언·고발 기능을 가리킵니다.
  doctrine_reference: Preserve apocalyptic courtroom imagery without flattening it into generic devotion.
