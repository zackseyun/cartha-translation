base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
  footnotes:
  - marker: a
    text: The opening sequence after 'in those days' is textually difficult in the Ethiopic OCR. The rendering follows the verse's evident pattern of childbirth, violent taking, and abandonment, but some words could be understood differently, such as 'go out' or 'bring out' instead of 'seize.'
    reason: textual_variant
  - marker: b
    text: The repeated references to children, infants, and beloved ones intensify the picture of judgment by portraying the collapse of ordinary family mercy.
    reason: cultural_note
  - marker: c
    text: Or 'they will bring forth and seize their children'.
    reason: previous_rendering
  - marker: d
    text: Or 'from among them they will strike down their infants'.
    reason: previous_rendering
  - marker: e
    text: Or 'while they look on'.
    reason: previous_rendering
translation:
  language: ko
  text: 그때에는 아이를 낳는 이들이 나가서 자기 자녀를 내던져 버릴 것이며, 그들의 자손도 그들에게서 떨어져 나갈 것입니다. 또 젖을 먹이는 동안에도 자기 자녀를 내버리고 그들에게 돌아가지 않을 것이며, 자기 사랑하는 이들에게도 자비를 베풀지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 에티오피아어 본문, 특히 첫 동사들의 연쇄는 난해합니다. 여기서는 출산 뒤 자녀를 내버리는 행동으로 옮겼습니다. 일부 표현은 ‘나가다’ 또는 ‘데리고 나오다’로 이해될 수도 있습니다. 그러나 수유 중 자녀를 버리고 돌아가지 않는다는 후반부의 뜻은 분명합니다.
    reason: textual_variant
