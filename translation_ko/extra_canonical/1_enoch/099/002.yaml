theological_decisions:
- issue: ‘죄인이 아니라고 여기는’ 난해 구절의 처리
  chosen_reading: 본문의 난해함을 평탄화하지 않고, 자기의로 자신을 무죄시하는 태도를 드러내는 방향으로 최소한만 정리했습니다.
  alternative_readings:
  - ‘땅에서 죄인이 아니었으나’라는 과거 상태 진술로 읽기
  - 본문 훼손 가능성을 이유로 의미를 약화시키기
  rationale: 게으즈 본문과 영어 POB 모두 이 절을 난해한 구절로 취급하므로, 임의로 해소하지 않고 자기기만/자기무죄화의 의미를 보존하는 것이 투명합니다.
  doctrine_reference: Preserve textual tension rather than forcing a harmonized reading.
