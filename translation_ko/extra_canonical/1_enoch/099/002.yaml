base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
  footnotes:
  - marker: a
    text: The clause 'though they were not sinners upon the earth' is textually difficult. The Ethiopic wording may preserve an awkward or corrupt line; some interpreters understand it differently, such as implying a claim to innocence rather than an actual former innocence.
    reason: textual_variant
  - marker: b
    text: The image 'twist their heads around' is kept close to the Ethiopic. It likely expresses deliberate turning aside from what is right, but the bodily imagery is part of the verse's force.
    reason: lexical_alternative
  - marker: c
    text: Or 'and twist their heads around, though they were not sinners upon the earth; they shall be trampled down.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들에게 화가 있을지어다. 그들은 의의 말씀과 영원한 규례를 왜곡하고, 자신들은 죄인이 아니라고 여깁니다. 그들은 땅 위에서 짓밟힐 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘자신들은 죄인이 아니라고 여깁니다’에 해당하는 게으즈 표현은 문법과 전승 상태가 난해합니다. 이를 ‘땅 위에서 죄인이 아니었다’로 이해하는 견해도 있으나, 여기서는 스스로를 죄인이 아니라고 여긴다는 뜻으로 옮겼습니다.
    reason: textual_variant
  - marker: b
    text: ‘왜곡하고’는 의의 말씀과 영속하는 규례를 본래의 바름에서 비틀어 벗어나게 한다는 뜻을 나타냅니다.
    reason: lexical_alternative
