translation:
  language: ko
  text: 화 있을진저, 악을 행하는 너희와 거짓의 말을 찬양하고 존중하는 너희여! 너희는 멸망할 것이며, 너희에게는 좋은 생명이 없을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez의 ነገረ는 복수 ‘말들’보다 단수 ‘말/사건/일’에 가깝게 읽을 수 있습니다.
    reason: source_note
  - marker: b
    text: 원문은 ‘좋은 생명’의 부재를 말하며, 이를 번영 상실로만 좁히지 않습니다.
    reason: theological_note
