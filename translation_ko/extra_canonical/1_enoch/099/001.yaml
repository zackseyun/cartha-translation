translation:
  language: ko
  text: 악을 행하며 거짓된 말[a]을 찬양하고 높이는 너희에게 화가 있을 것입니다! 너희는 멸망할 것이며, 너희에게는 좋은 삶이 없을 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈어 ነገረ는 단수형입니다. 여기서는 ‘말’ 외에 ‘일’ 또는 ‘사안’으로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘너희에게 좋은 삶은 없을 것이다’입니다. ‘좋은 삶’의 범위는 본문이 더 구체적으로 규정하지 않습니다.
    reason: theological_note
