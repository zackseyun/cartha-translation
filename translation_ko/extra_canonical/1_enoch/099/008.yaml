base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
  footnotes:
  - marker: a
    text: Or 'their eyes will be darkened.' The image may describe dimmed perception, terror-struck sight, or a figurative loss of clarity.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'visions of their dreams' keeps both the seeing-language and the dream-language of the Ge'ez, rather than reducing it to simply 'dreams.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And they will be terrified'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 마음의 미친 상태로 인해 감각을 잃을 것이며, 그들의 눈은 마음의 두려움과 그들의 꿈의 환상 때문에 어두워질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘감각을 잃을 것입니다’는 ‘두려워할 것입니다’보다 원문의 의미에 가깝게, 마음의 혼미로 분별력을 잃는 상태를 드러냅니다.
    reason: previous_rendering
  - marker: b
    text: ‘꿈의 환상’은 단순히 ‘꿈들’로 줄이지 않고, 보는 언어와 꿈의 언어를 함께 보존한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: ‘어두워질 것입니다’는 눈이 실제로 멀어진다는 뜻이라기보다, 두려움 속에서 인식이 흐려지는 이미지를 살린 표현입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  english_pob_choice: they will become senseless
  chosen_korean: 감각을 잃을 것입니다
  alternatives_korean:
  - 정신을 잃을 것입니다
  - 제정신을 잃을 것입니다
  - 무감각해질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 동사는 ‘두려워하다’가 아니라 마음의 혼란으로 분별력을 잃는 뜻이어서, ‘감각을 잃다’로 옮기면 무지하거나 혼미해진 상태를 자연스럽게 드러냅니다.
- source_word: እበደ ልቦሙ
  english_pob_choice: the madness of their heart
  chosen_korean: 마음의 미친 상태
  alternatives_korean:
  - 마음의 광기
  - 마음의 어리석음
  - 마음의 망상
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘heart’는 단순 감정보다 사고와 의지를 포함하는 중심이므로 ‘마음’으로 두고, እበደ의 강한 이상 상태를 약화하지 않기 위해 ‘미친 상태’를 택했습니다.
- source_word: ይጼለሉ አዕይንቲሆሙ
  english_pob_choice: their eyes will grow dark
  chosen_korean: 그들의 눈은 … 어두워질 것입니다
  alternatives_korean:
  - 그들의 눈은 … 흐려질 것입니다
  - 그들의 시야는 … 어두워질 것입니다
  - 그들의 눈은 … 캄캄해질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 시각 기관을 직접 말하는 표현을 살리면서, 물리적 실명보다 인지적·상징적 어두워짐을 함께 담기 위해 ‘어두워질 것입니다’로 옮겼습니다.
- source_word: በርእየ ሕልሞሙ
  english_pob_choice: through the visions of their dreams
  chosen_korean: 그들의 꿈의 환상 때문에
  alternatives_korean:
  - 그들의 꿈의 환상으로 인해
  - 그들의 꿈에서 본 환상 때문에
  - 그들의 꿈의 비전들 때문에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘seeing/vision’과 ‘dreams’를 둘 다 남기기 위해 ‘꿈의 환상’으로 옮겼고, 원문의 원인 구문을 한국어에 자연스럽게 풀어 ‘때문에’로 처리했습니다.
theological_decisions:
- issue: 마음의 혼미와 두려움의 관계
  chosen_reading: 이 절은 마음의 광기에서 비롯된 감각 상실과, 그 결과로 나타나는 시각의 어두워짐을 묘사하며, 꿈의 환상이 그 혼미를 더하는 방식은 열어 둡니다.
  alternative_readings:
  - 꿈 자체가 직접적인 신적 심판 환상이다
  - 단지 죄책감이 낳은 심리적 공포일 뿐이다
  rationale: 게즈어 본문은 결과들을 나열할 뿐 그 메커니즘을 단정하지 않으므로, 해석의 긴장을 보존하는 쪽이 본문의 범위를 가장 잘 따릅니다.
  doctrine_reference: 텍스트가 말하지 않는 원인론을 확정하지 않고 긴장을 보존함
- issue: register shift in quoted speech
  chosen_reading: 인용문이 아닌 서술문이므로 표준 합쇼체를 유지했습니다.
  alternative_readings:
  - 직접화법으로 낮춘 반말
  - 예언적 격식체
  rationale: 이 절은 내러티브/예언적 진술로 구성되어 있어, 한국어 출판 본문에서는 현대 표준 서술체가 가장 안정적입니다.
  doctrine_reference: 현대 한국어 성경체 일관성 유지
