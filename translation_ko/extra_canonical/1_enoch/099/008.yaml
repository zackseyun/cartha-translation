base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
  footnotes:
  - marker: a
    text: Or 'their eyes will be darkened.' The image may describe dimmed perception, terror-struck sight, or a figurative loss of clarity.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'visions of their dreams' keeps both the seeing-language and the dream-language of the Ge'ez, rather than reducing it to simply 'dreams.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And they will be terrified'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 마음의 광기 때문에 분별력을 잃을 것이며, 그들의 눈은 마음에 있는 두려움과 그들의 꿈의 환상 때문에 어두워질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘분별력을 잃을 것입니다’는 단순히 두려워한다는 뜻이 아니라, 마음의 혼미로 판단력과 분별을 잃는 상태를 나타냅니다.
    reason: previous_rendering
  - marker: b
    text: ‘꿈의 환상’은 단순히 ‘꿈들’로 줄이지 않고, 보는 것/환상의 언어와 꿈의 언어를 함께 보존한 표현입니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그들의 눈이 어두워질 것입니다.’ 이는 두려움으로 시야가 흐려지는 모습이나 인식이 어두워지는 모습을 가리킬 수 있습니다.
    reason: lexical_alternative
