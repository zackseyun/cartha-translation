base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
  footnotes:
  - marker: a
    text: The phrase rendered 'the measure of sin' is difficult. The Ge'ez word can mean 'measure' or 'standard,' so the line may also mean 'the full measure of sin' or 'the standard of sin.'
    reason: lexical_alternative
  - marker: b
    text: The verb rendered 'provoke it' is uncertain in this form. It may mean to stir up, incite, or spread the preceding evil upon the earth.
    reason: lexical_alternative
  - marker: c
    text: Or 'practice the measure of sin and deceit, and to those who provoke it'.
    reason: previous_rendering
translation:
  language: ko
  text: 불행하여라, 너희는 죄와 거짓의 분량을 채우고, 땅 위에 쓰라림을 일으키는 자들이여. 그것 때문에 그들이 멸망할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''분량''은 원문의 ''measure/standard'' 이미지를 살린 번역입니다. 더 직역하면 ''죄의 기준''이나 ''죄의 전체 분량''으로도 읽을 수 있습니다.'
    reason: lexical_alternative
  - marker: b
    text: '''쓰라림''은 수정 전승이 가리키는 ''bitterness''의 이미지를 반영한 표현입니다. 일부 전승/해독에서는 ''거짓''과 연결된 다른 읽기도 가능합니다.'
    reason: textual_variant
