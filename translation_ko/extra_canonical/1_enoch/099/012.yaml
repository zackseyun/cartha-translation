  - 그것으로 말미암아 그들이 사라질 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 인과·수단 관계를 한국어의 자연스러운 결과 표현으로 옮겼습니다. '멸망'은 심판 맥락을 분명히 드러냅니다.
