  rationale: 해당 어근은 허위와 속임을 가리키므로, 한국어에서는 가장 직접적이고 넓은 의미를 지닌 '거짓'을 택했습니다.
- source_word: ታምርሩ / ዲበ ምድር
  english_pob_choice: cause bitterness upon the earth
  chosen_korean: 땅 위에 쓰라림을 일으키는
  alternatives_korean:
  - 땅 위에 괴로움을 퍼뜨리는
  - 땅 위에 쓰디쓴 것을 더하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수정된 전승이 가리키는 '쓰라림/쓴 것'의 이미지를 살려, 단순한 감정어가 아니라 땅 전체에 미치는 해악으로 표현했습니다.
- source_word: ቦቱ ይትዌደኡ
  english_pob_choice: for by it they will be destroyed
  chosen_korean: 그것 때문에 그들이 멸망할 것입니다
  alternatives_korean:
