  naturalness: ‘불행하여라, 너희는 … 자들이여’는 현대 표준 한국어 합쇼체의 문장으로 다소 부자연스럽고, ‘불행하여라’는 요구된 격식체와도 맞지 않습니다. ‘너희에게 화가 있습니다’라는 예언적 경고 형식이 현대적이면서도 원문의 강도를 유지합니다.
  terminology: ‘죄와 거짓의 저울’은 죄와 거짓에 물든 도량형이라는 문맥적 이미지를 보존합니다. ‘쓰라림’은 bitterness의 비유를 유지하되, 이를 단순한 감정으로 한정하지 않습니다. ‘멸망할 것입니다’는 심판 문맥의 파멸 동사를 적절히 옮깁니다.
  issues:
  - severity: high
    issue: ‘죄와 거짓의 분량을 채우고’
    rationale: 원문의 ‘만들다/행하다’에 없는 ‘채우다’를 도입하여 의미를 구체화합니다. 또한 부정한 도량형을 암시하는 표현을 ‘분량을 채우다’로 바꾸어 버립니다.
  - severity: medium
    issue: ‘불행하여라, 너희는 … 자들이여’
    rationale: 예언적 화 선언의 문장 구조로 부자연스럽고 현대 formal-polite 합쇼체와도 맞지 않습니다.
  - severity: medium
    issue: 각주 b의 ‘일부 전승/해독에서는 … 다른 읽기’
    rationale: 본문 채택 읽기를 설명하지 않고 막연한 전승 차이를 언급합니다. 실제 본문에 반영한 ‘쓰라림’의 의미와 불확실성만 간결하게 밝혀야 합니다.
  revised_text: 너희에게 화가 있습니다. 너희는 죄와 거짓의 저울을 만들고[a] 땅 위에 쓰라림을 일으킵니다.[b] 그것 때문에 그들은 멸망할 것입니다.
