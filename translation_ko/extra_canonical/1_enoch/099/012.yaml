  rationale: 원문의 'measure/standard' 이미지를 살리면서, 영어 POB의 난해한 표현을 한국어에서 보다 분명한 '분량'으로 옮겼습니다. '채우고'는 축적·완성의 뉘앙스를 유지합니다.
