  rationale: 문맥이 상업적 저울/분량의 이미지를 암시하므로, 이를 추상화하지 않고 '분량'으로 유지했습니다. 영어 POB가 지적한 난해성을 한국어에서도 보존합니다.
  doctrine_reference: Translation philosophy §§1, 3, 5
- issue: 최종 절의 파괴가 죄 자체의 결과인지, 하나님의 심판인지
  chosen_reading: 그것 때문에 그들이 멸망할 것입니다
  alternative_readings:
  - 그것 때문에 그들이 죽을 것입니다
  - 그것으로 인해 그들이 심판받을 것입니다
  rationale: 원문은 앞선 악행과 멸망을 직접 연결하므로, 본문 수준에서는 원인-결과 구조를 우선 살리고 더 넓은 심판 배경은 암시로 남겼습니다.
  doctrine_reference: Translation philosophy §3
