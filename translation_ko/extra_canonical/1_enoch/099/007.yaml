    reason: lexical_alternative
  - marker: c
    text: Or 'make images of gold and silver and wood and clay'.
    reason: previous_rendering
  - marker: d
    text: Or 'they will receive no help from them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 돌에게 절하는 자들과,[a] 금과 은과 나무와 흙으로 형상을 만드는 자들과,[c] 악한 영들과 귀신들과 모든 우상에게 깨달음 없이 절하는 자들은[b] 그들에게서 아무 도움도 찾지 못할 것입니다.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단수형 ‘돌’이라고 합니다. 여기서는 일반적으로 돌로 된 숭배 대상을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악한 영들’은 문자적으로 ‘악한 혼들’ 또는 ‘악한 영혼들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 원문은 형상과 금·은·나무·흙의 재료 목록을 연결합니다. ‘금과 은과 나무와 흙으로 형상을 만드는’으로 옮겼으나, 형상과 각 재료의 정확한 문법적 연결은 다르게 분석될 여지가 있습니다.
    reason: source_note
  - marker: d
    text: 직역하면 ‘그들에게서 아무 도움도 찾지 못할 것입니다’입니다. ‘도움을 얻지 못할 것입니다’로도 자연스럽게 옮길 수 있습니다.
    reason: lexical_alternative
