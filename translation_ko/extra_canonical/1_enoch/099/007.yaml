base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
  footnotes:
  - marker: a
    text: The opening phrase literally says 'bow down to stone'; the singular likely stands for stone cult-objects in general.
    reason: lexical_alternative
  - marker: b
    text: The phrase rendered 'evil spirits' could also be understood more literally as 'evil souls' or 'wicked souls.'
    reason: lexical_alternative
  - marker: c
    text: Or 'make images of gold and silver and wood and clay'.
    reason: previous_rendering
  - marker: d
    text: Or 'they will receive no help from them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 돌에 엎드리는 자들과, 금과 은과 나무와 흙으로 형상을 만드는 자들과, 악한 영들과 귀신들과 깨닫지 못하는 모든 우상에게 엎드리는 자들은—그들에게서 전혀 도움을 얻지 못할 것입니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 단수형 ‘돌’을 직역한 것이며, 여기서는 돌 우상 일반을 가리키는 말로 이해할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘악한 영들’은 문자적으로는 ‘악한 혼들/영혼들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 재료 목록은 ‘금과 은과 나무와 흙으로’라는 형상 제작의 재료를 가리킵니다.
    reason: source_note
  - marker: d
    text: 마지막 절은 ‘그들에게서 도움을 받지 못할 것입니다’로도 옮길 수 있습니다.
    reason: lexical_alternative
