theological_decisions:
- issue: ‘악한 영들과 귀신들’의 의미
  chosen_reading: 초자연적 존재들을 가리키는 것으로 이해했습니다.
  alternative_readings:
  - 죽은 인간의 혼령들로 이해할 수 있습니다.
  - ‘악한 영들’을 보다 문자적으로 ‘악한 혼들’로 옮길 수 있습니다.
  rationale: 이 절은 우상 숭배를 비판하는 문맥이며, 바로 뒤의 ‘귀신들’ 및 ‘우상’과 병렬을 이루므로 초자연적 존재로 읽는 것이 전체 흐름에 더 부합합니다.
  doctrine_reference: 문맥 우선의 해석과 의미 긴장 보존
- issue: ‘깨닫지 못하는 모든 우상’의 수식 관계
  chosen_reading: 우상 자체의 무지함을 말하기보다, 우상을 섬기는 자들의 깨닫지 못함을 함축하는 표현으로 처리했습니다.
  alternative_readings:
  - 우상들이 이해가 없다는 뜻으로 직역할 수 있습니다.
  - ‘이해하지 못하는’이 제사적 무지의 상태를 직접 수식한다고 볼 수 있습니다.
  rationale: 게으름 없이 직역하면 한국어에서는 우상이 ‘깨닫는다’는 부자연스러움이 생기므로, 원문의 공격성을 유지하면서도 문맥상 의미가 드러나도록 정리했습니다.
  doctrine_reference: 원문 수사와 한국어 자연성의 균형
