base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/004.yaml
  text: In those days nations shall be thrown into confusion, and the clans of the nations shall rise up on the day of destruction.
  footnotes:
  - marker: a
    text: Or 'the kindreds/tribes of the nations.' The Ge'ez term can denote kin-groups or related peoples.
    reason: lexical_alternative
  - marker: b
    text: Or 'on the day of slaughter' or 'ruin,' depending on how strongly the final noun is taken.
    reason: lexical_alternative
translation:
  language: ko
  text: 그 날들에 민족들이 혼란에 빠질 것이며, 민족들의 씨족들이[a] 멸망의 날에[b] 일어설 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘씨족들’은 ‘친족 집단들’ 또는 ‘부족들’로도 옮길 수 있습니다. 게에즈어 አዝማድ는 혈연이나 친족 관계로 맺어진 집단을 가리킬 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘멸망’은 ‘파멸’, ‘파괴’, 또는 ‘살육’으로도 옮길 수 있습니다. 마지막 낱말 ሐጕል의 정확한 강도는 문맥에 따라 달리 이해될 수 있습니다.
    reason: lexical_alternative
