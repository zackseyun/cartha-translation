theological_decisions:
- issue: ‘지극히 높으신 이’와 ‘그의 의’의 관계 표현
  chosen_reading: 하나님의 초월적 통치와 그에 합당한 윤리적 행로를 함께 드러내는 문장으로 유지했습니다.
  alternative_readings:
  - 단순히 ‘가장 높으신 분’으로 평이화할 수 있음
  - ‘그분의 의로운 길’로 합칠 수 있음
  rationale: 본문은 지혜 수용, 행함, 길 걷기, 의의 행보를 병렬로 쌓아 올려 apocalyptic 윤리의 긴장을 만듭니다. 이를 하나의 평이한 문장으로 흡수하지 않고 구별을 유지했습니다.
  doctrine_reference: 의미의 긴장 유지; 윤리적-종말론적 구조 보존
- issue: ‘그들과 함께 악을 행하지’의 집단 대비
  chosen_reading: 의인과 악인의 구별을 ‘함께’의 여부로 표현해 공동체적 분리를 살렸습니다.
  alternative_readings:
  - ‘그들과 어울리지 않는다’로 완화 가능
  - ‘같은 길을 가지 않는다’로 의역 가능
  rationale: 원문은 단순 개인 윤리가 아니라 악을 행하는 자들과의 동참 거부를 말하므로, 공동체적 경계선을 유지하는 번역이 필요합니다.
  doctrine_reference: 공동체 윤리와 종말론적 분리
