base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
  footnotes:
  - marker: a
    text: Or 'they will perish in disgrace.' The final verb-noun combination is difficult and may denote destruction accompanied by public reproach.
    reason: lexical_alternative
  - marker: b
    text: Literally 'they worshiped a stone,' likely a concrete image of idolatry rather than a generic reference to religion.
    reason: cultural_note
  - marker: c
    text: Or 'They will forget'.
    reason: previous_rendering
  - marker: d
    text: Or 'in shame'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 잊어버리고[a] 두려워할 것입니다. 그들이 모든 일을 거짓으로 행하고 돌에게 경배했으며[b], 순식간에 멸망할 것이기 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들은 잊힐 것입니다.’
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘돌에게 경배했다’입니다. 문맥상 구체적인 우상숭배 이미지를 가리키는 것으로 보입니다.
    reason: cultural_note
lexical_decisions:
- source_word: ይረሰዑ
  english_pob_choice: they will forget
  chosen_korean: 잊어버릴 것입니다
  alternatives_korean:
  - 기억하지 못할 것입니다
  - 잊힐 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 주체가 그들 자신이므로 능동적 미래 의미를 살려 ‘잊어버릴 것입니다’로 옮겼습니다. POB의 본문 선택을 따르되 한국어에서는 자연스러운 서술로 다듬었습니다.
- source_word: ይፈርሁ
  english_pob_choice: be afraid
  chosen_korean: 두려워할 것입니다
  alternatives_korean:
  - 무서워할 것입니다
  - 떨게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 공포 반응을 나타내므로 과도한 강화를 피하고 ‘두려워할 것입니다’로 옮겼습니다.
- source_word: በሐሰት
  english_pob_choice: in falsehood
  chosen_korean: 거짓으로
  alternatives_korean:
  - 거짓 안에서
  - 속임수로
  - 헛되이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 행위의 방식과 도덕적 성격을 함께 드러내는 표현이므로 ‘거짓으로’가 가장 간결하고 정확합니다.
- source_word: ለአብን
  english_pob_choice: a stone
  chosen_korean: 돌
  alternatives_korean:
  - 돌 하나
  - 돌 우상
  - 돌덩이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시 대상이 단수의 물체이므로 본문은 일반화하지 않고 ‘돌’로 유지했습니다. 문맥상 우상숭배를 가리키는 구체적 이미지라는 점은 각주로 보완했습니다.
- source_word: በምዕር
  english_pob_choice: in an instant
  chosen_korean: 순식간에
  alternatives_korean:
  - 갑자기
  - 한순간에
  - 즉시
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 어구는 시간의 급박함을 나타내므로, POB의 최종 확정 의미에 따라 ‘순식간에’로 옮겼습니다.
theological_decisions:
- issue: ‘돌’의 단수 유지와 우상숭배의 구체성
  chosen_reading: 본문은 ‘돌에게 경배했다’고 단수 이미지를 그대로 유지했습니다.
  alternative_readings:
  - 돌들에게 경배했다
  - 돌 우상에게 경배했다
  rationale: 게즈 본문이 단수 목적어를 사용하므로, 우상숭배를 일반화하지 않고 구체적이고 도발적인 이미지를 살리는 편이 원문에 더 충실합니다.
  doctrine_reference: Translation philosophy §1, §4
- issue: 최종 심판 표현의 성격
  chosen_reading: ‘순식간에 멸망할 것입니다’로 옮겨 파멸의 급작스러움을 살렸습니다.
  alternative_readings:
  - 수치 가운데 멸망할 것입니다
  - 비난 속에 멸망할 것입니다
  rationale: 공동체적 수치보다 시간적 급박함이 최신 교정에서 핵심으로 확정되었으므로, 심판의 급작스러운 소멸을 드러내는 번역을 택했습니다.
  doctrine_reference: Translation philosophy §3
