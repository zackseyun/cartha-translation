base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/006.yaml
  text: 'And again I swear to you[a], sinners: sin has been prepared for the day of blood that does not cease.'
  footnotes:
  - marker: a
    text: Or, 'punishment/judgment has been prepared for the day of bloodshed.' The Ge'ez text reads 'sin,' but the line may use the word for sin in a compressed sense for its consequence.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 다시 내가 너희에게, 죄인들아, 맹세합니다. 피의 날을 위하여 죄가 예비되어 있습니다. 그 날은 멈추지 않습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘벌/심판이 피 흘림의 날을 위하여 예비되어 있습니다.’ 게에즈 본문은 ‘죄’라고 읽히지만, 압축된 표현으로 그 결과를 가리킬 수도 있습니다.
    reason: lexical_alternative
