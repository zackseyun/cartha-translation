base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
  footnotes:
  - marker: a
    text: Or 'revealed to humankind.' The Ge'ez verb can denote making something seen or known; in context this may refer to illicit knowledge disclosed by the Watchers.
    reason: lexical_alternative
  - marker: b
    text: The doubled expression 'petition or supplication' preserves the verse's formal, emphatic denial of intercession.
    reason: cultural_note
  - marker: c
    text: Or 'no petition or supplication will be granted for you'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 너희에게는 자비도 간구도 허락되지 않을 것입니다[a]. 이는 너희가 폭력을 가르쳤기[c][b] 때문이며, 사람들에게 드러낸 모든 모독과 폭력과 죄의 행위 때문입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘사람들에게 드러난’. 게이즈어 동사는 무엇인가를 보이거나 알려 주는 뜻을 가질 수 있으므로, 문맥상 타락한 지식의 공개를 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이중 표현 ‘간구 혹은 탄원’을 살려, 본문의 형식적이고 강조적인 중보 거절을 보존합니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘너희에게는 간구도 탄원도 허락되지 않을 것입니다’.
    reason: previous_rendering
lexical_decisions:
- source_word: ሣሕት / ስእለት
  english_pob_choice: mercy or petition
  chosen_korean: 자비도 간구도
  alternatives_korean:
  - 용서도 청원도
  - 은총도 간청도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 개정된 영어 근거에 따라 첫 항을 ‘자비’, 둘째 항을 ‘간구’로 구분해, 형식적이고 중층적인 금지 표현을 한국어에서도 살렸습니다.
- source_word: ኢይከውከ
  english_pob_choice: will be granted to you
  chosen_korean: 허락되지 않을 것입니다
  alternatives_korean:
  - 주어지지 않을 것입니다
  - 허여되지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부정 미래의 수여/성취 의미를 살려, 단순한 존재 부정보다 ‘허락’의 판결적 뉘앙스를 반영했습니다.
- source_word: ዘመሀርከ
  english_pob_choice: you have taught
  chosen_korean: 가르쳤기
  alternatives_korean:
  - 가르쳐 주었기
  - 가르쳐서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 감추어진 지식을 전달하는 행위가 아니라, 본문이 직접 말하는 ‘가르침’을 간명하게 옮겼습니다.
- source_word: ግፍዐ
  english_pob_choice: violence
  chosen_korean: 폭력
  alternatives_korean:
  - 포학
  - 학대
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥의 윤리적·사회적 비난을 가장 직접적으로 전달하는 현대 한국어 대응어로 ‘폭력’을 택했습니다.
- source_word: ዘአርአይከ ለሰብእ
  english_pob_choice: you have shown to humankind
  chosen_korean: 사람들에게 드러낸
  alternatives_korean:
  - 인류에게 보여 준
  - 사람들에게 보여 준
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 본문의 ‘shown’과 주해상 가능한 ‘revealed’의 긴장을 남기기 위해, 본문에는 ‘드러낸’을 두어 공개/노출의 의미를 함께 살렸습니다.
theological_decisions:
- issue: ‘mercy or petition’의 병렬성
  chosen_reading: 본문의 이중 표현을 한국어에서도 ‘자비도 간구도’로 유지해, 공식적이고 단호한 거절을 드러냈습니다.
  alternative_readings:
  - ‘자비나 간구’처럼 단일화할 수 있습니다.
  - ‘용서도 요청도’로 더 해석적으로 옮길 수 있습니다.
  rationale: 게으른 동의어 중화 없이 두 항의 병렬을 유지해야 경고문의 법정적 어조가 보존됩니다.
  doctrine_reference: Preserve rhetorical doubling and refusal of intercession.
- issue: ‘shown’의 공개/계시 의미
  chosen_reading: ‘드러낸’으로 옮겨 행위의 노출과 전달을 함께 열어 두었습니다.
  alternative_readings:
  - ‘보여 준’으로 더 직접적으로 옮길 수 있습니다.
  - ‘revealed’에 가깝게 ‘드러내 보인’으로 옮길 수 있습니다.
  rationale: 본문은 단지 행위를 목격하게 한 것인지, 금지된 지식을 계시/노출한 것인지 긴장을 남기므로 한쪽으로 과도하게 확정하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
