base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/004.yaml
  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
  footnotes:
  - marker: a
    text: Or 'a prayer of remembrance' or 'a written petition for remembrance.' The Ge'ez phrase combines ideas of remembrance and supplication.
    reason: lexical_alternative
  - marker: b
    text: The unfinished final clause reflects the verse as transmitted here and leads into the next line, where Enoch's ascent or presentation of the petition is further developed.
    reason: textual_variant
  - marker: c
    text: Or 'and that I might ascend'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들은 내게 자기들을 위해 기념 청원문[a]을 쓰라고 요청하였는데, 그들에게 용서가 있게 하려 함이었고[b], 또 내가 그것을 올려드리게 하려는 것이었습니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘기억의 청원’ 또는 ‘기억을 위한 기도문’도 가능합니다. 게으즈어 구는 기억과 간구의 뜻을 함께 담고 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 문장은 전승된 형태상 다음 절로 이어지는 미완의 목적절입니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘내가 올라가게 하려 함’으로도 옮길 수 있습니다. 여기서는 አዕርግ의 타동적 의미를 반영했습니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ተስእሉኒ
  english_pob_choice: they asked me
  chosen_korean: 내게 ... 요청하였는데
  alternatives_korean:
  - 내게 ... 간청하였는데
  - 내게 ... 청하였는데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사는 단순한 요청/청구의 의미이므로, 현대 한국어에서 직접성과 자연스러움이 있는 ‘요청하다’로 옮겼습니다.
- source_word: ተዝካረ ስእለት
  english_pob_choice: petition of remembrance
  chosen_korean: 기념 청원문
  alternatives_korean:
  - 기억의 기도문
  - 기념의 간구문
  - 기억 청원문
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘기억/기념’과 ‘청원/간구’가 함께 있는 복합구이므로, 의례적이면서도 문서성을 드러내는 ‘기념 청원문’으로 압축해 두 요소를 살렸습니다.
- source_word: ይኩኖሙ ኅድገተ
  english_pob_choice: there might be forgiveness for them
  chosen_korean: 그들에게 용서가 있게 하려 함이었고
  alternatives_korean:
  - 그들에게 사면이 있게 하려 함이었고
  - 그들이 용서를 받게 하려 함이었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 형벌에서의 해제/용서 가능성을 가리키므로, 한국어에서는 가장 직접적인 ‘용서’로 옮겼습니다. ‘사면’도 가능하지만 더 법정적 뉘앙스가 강합니다.
- source_word: አዕርግ
  english_pob_choice: I might bring it up
  chosen_korean: 내가 그것을 올려드리게 하려는
  alternatives_korean:
  - 내가 그것을 올리게 하려는
  - 내가 그것을 가져올리게 하려는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 ‘올라가다’보다 위로 ‘올려드리다/올리다’의 타동적 의미가 적합하며, 하늘로 가져다 바치는 수직적 이미지를 살리기 위해 ‘올려드리다’를 택했습니다.
theological_decisions:
- issue: 청원문의 성격
  chosen_reading: 단순한 기도라기보다 하늘 법정에 제출될 수 있는 기념 청원문으로 읽었습니다.
  alternative_readings:
  - 기억을 위한 기도문
  - 기록된 간구문
  rationale: 게으즈어 복합구는 기억과 간구의 의미를 함께 담고 있어, 아포칼립스적 문맥의 공적 청원을 드러내는 번역이 본문의 의도를 더 잘 보존합니다.
  doctrine_reference: Apocalyptic heavenly-court imagery; do not flatten the document into a generic prayer.
- issue: 마지막 절의 동사 방향성
  chosen_reading: ‘내가 그것을 올려드리게 하려는’으로 타동적 상승을 반영했습니다.
  alternative_readings:
  - 내가 올라가게 하려는
  - 내가 그것을 올리게 하려는
  rationale: 주체가 단지 올라가는 것이 아니라 청원을 위로 가져가 바치는 행위이므로, 상승의 방향성과 봉헌성을 함께 드러내는 것이 문맥에 맞습니다.
  doctrine_reference: Preserve the narrative of mediation and ascent without intransitive distortion.
