base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
  footnotes:
  - marker: a
    text: Or 'judgment' or 'decree' for 'sentence'; the Ge'ez term is juridical and introduces the punishment that follows.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 에녹이 아자젤에게 가서 말했습니다. 「너에게는 평안이 없을 것이다. 너를 거슬러 큰 판결이 나왔으니, 너는 묶일 것이다.」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘심판’, ‘선고’. 게즈어의 용어는 법정적이며 뒤따르는 처벌을 도입합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃሊፎ
  english_pob_choice: went
  chosen_korean: 가서
  alternatives_korean:
  - 가고
  - 지나가서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹의 이동 뒤 발화를 나타내는 서술이므로, 한국어에서는 자연스럽게 연결되는 ‘가서’로 옮겨 사건 순서를 살렸습니다.
- source_word: ይቤሎ
  english_pob_choice: said to
  chosen_korean: 말했습니다
  alternatives_korean:
  - 그에게 말했습니다
  - 선포했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직접화법을 이끄는 기본 발화동사이므로 과도한 수사 없이 표준적 서술인 ‘말했습니다’를 택했습니다.
- source_word: ኢይከውከ ሰላም
  english_pob_choice: you shall have no peace
  chosen_korean: 너에게는 평안이 없을 것이다
  alternatives_korean:
  - 너는 평안을 얻지 못할 것이다
  - 너에게 평안은 없을 것이다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복된 결과의 부재를 뜻하는 금지/부정 선언이므로, 종말론적 판결 어조를 유지하는 ‘평안이 없을 것이다’로 옮겼습니다.
- source_word: ኵነኔ
  english_pob_choice: sentence
  chosen_korean: 판결
  alternatives_korean:
  - 심판
  - 선고
  - 정죄
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단어는 단순한 ‘심판’보다 법정적 선고의 뉘앙스가 강하고 뒤의 ‘묶일 것이다’와도 맞물리므로, 한국어의 법정 용어 ‘판결’이 가장 적절합니다.
- source_word: ወጽአ ላዕሌከ
  english_pob_choice: has gone out against you
  chosen_korean: 너를 거슬러 … 나왔으니
  alternatives_korean:
  - 너에게 대하여 나왔으니
  - 너를 향해 나왔으니
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘against you’의 적대적 방향성을 살리기 위해 ‘너를 거슬러’로 옮겨, 판결이 Azazel에게 불리하게 내려진 점을 분명히 했습니다.
- source_word: ይእስርከ
  english_pob_choice: you will be bound
  chosen_korean: 너는 묶일 것이다
  alternatives_korean:
  - 너는 결박될 것이다
  - 너는 속박될 것이다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈어의 처벌적 ‘binding’을 직접 반영하되, 한국어에서 가장 자연스럽고 명료한 피동형인 ‘묶일 것이다’로 옮겼습니다.
theological_decisions:
- issue: 에녹의 발화가 예언인지 판결 선언인지
  chosen_reading: 법정적 판결 선포로 읽되, 직접화법의 예언적 어조는 유지했습니다.
  alternative_readings:
  - 단순한 경고
  - 예언적 저주
  rationale: 문맥상 아자젤에게 내려진 처분을 공표하는 장면이므로, ‘판결’ 어휘를 택하되 공포를 과장하지 않고 본문의 예언-판결 결합을 보존했습니다.
  doctrine_reference: apocalyptic judgment speech; preserve juridical force without flattening into generic warning.
- issue: 평안 부정문의 강도
  chosen_reading: ‘너에게는 평안이 없을 것이다’로 강한 판결형 부정을 유지했습니다.
  alternative_readings:
  - 평안이 없으리라
  - 평안이 너의 것이 아니다
  rationale: 이 문장은 단순한 인사말이 아니라 저주적/법정적 판결문의 일부이므로, 미래형 판결로 번역해 선고의 무게를 살렸습니다.
  doctrine_reference: Preserve apocalyptic imagery and judgment formulas.
