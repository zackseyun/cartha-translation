  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘against you’의 적대적 방향성을 살리기 위해 ‘너를 거슬러’로 옮겨, 판결이 Azazel에게 불리하게 내려진 점을 분명히 했습니다.
- source_word: ይእስርከ
  english_pob_choice: you will be bound
  chosen_korean: 너는 묶일 것이다
  alternatives_korean:
  - 너는 결박될 것이다
  - 너는 속박될 것이다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게즈어의 처벌적 ‘binding’을 직접 반영하되, 한국어에서 가장 자연스럽고 명료한 피동형인 ‘묶일 것이다’로 옮겼습니다.
theological_decisions:
- issue: 에녹의 발화가 예언인지 판결 선언인지
  chosen_reading: 법정적 판결 선포로 읽되, 직접화법의 예언적 어조는 유지했습니다.
  alternative_readings:
  - 단순한 경고
  - 예언적 저주
  rationale: 문맥상 아자젤에게 내려진 처분을 공표하는 장면이므로, ‘판결’ 어휘를 택하되 공포를 과장하지 않고 본문의 예언-판결 결합을 보존했습니다.
  doctrine_reference: apocalyptic judgment speech; preserve juridical force without flattening into generic warning.
- issue: 평안 부정문의 강도
  chosen_reading: ‘너에게는 평안이 없을 것이다’로 강한 판결형 부정을 유지했습니다.
  alternative_readings:
  - 평안이 없으리라
  - 평안이 너의 것이 아니다
  rationale: 이 문장은 단순한 인사말이 아니라 저주적/법정적 판결문의 일부이므로, 미래형 판결로 번역해 선고의 무게를 살렸습니다.
  doctrine_reference: Preserve apocalyptic imagery and judgment formulas.
