- issue: 두려움 표현의 누적과 강도
  chosen_reading: ‘두려워하였고, 두려움과 떨림이 그들을 사로잡았습니다’로 반복을 유지해 공포의 누적을 드러냅니다.
  alternative_readings:
  - ‘몹시 두려워하였고, 떨림이 그들을 덮쳤습니다’
  - ‘두려움에 사로잡혀 떨었습니다’
  rationale: 게즈어 원문은 동사와 명사구를 중첩해 공포를 증폭하므로, 이를 하나로 줄이지 않고 서술적 긴장을 유지했습니다.
  doctrine_reference: 묵시문학적 경외와 심판 반응의 반복적 강조를 보존
