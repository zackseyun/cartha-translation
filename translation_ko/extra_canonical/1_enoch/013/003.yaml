  text: 그러자 내가 가서 그들 모두에게 한꺼번에 말하였습니다[a]. 그들은 모두 두려워하였고, 두려움과 떨림이 그들을 사로잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
