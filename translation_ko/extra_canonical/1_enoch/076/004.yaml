  - 축복과 평안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 긍정적 효력의 바람이라는 점을 살리되, 종교적 어휘의 격을 유지하기 위해 ‘축복과 평강’을 선택했습니다.
- source_word: መቅሠፍት
  english_pob_choice: scourging
  chosen_korean: 채찍질의
  alternatives_korean:
  - 징벌의
  - 징계의
  - 재앙의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 재난보다 징벌적 타격의 이미지를 드러내기 위해 ‘채찍질’로 옮겨, 영어 POB의 강한 심판 어감을 보존했습니다.
- source_word: ይደመስስዋ
  english_pob_choice: bring ruin upon
  chosen_korean: 파멸을 가져옵니다
  alternatives_korean:
  - 멸망을 가져옵니다
  - 무너뜨립니다
  - 파괴합니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 결과 중심의 파괴를 나타내므로, 대상들을 직접 서술하기보다 ‘파멸을 가져오다’로 옮겨 원문의 누적적 파괴 감각을 유지했습니다.
theological_decisions:
- issue: 출구 포털의 수와 범위가 4와 8으로 구분되는 우주론적 구조를 어떻게 반영할지
  chosen_reading: ‘네 포털’과 ‘그 여덟’으로 구분하여, 4개의 축복/평강의 포털과 8개의 채찍질의 포털이라는 대칭 구조를 드러냈습니다.
  alternative_readings:
  - ‘네 개’와 ‘여덟 개’
  - ‘네 개의 문’과 ‘여덟 개의 문’
  rationale: 이 본문은 단순 수량보다 정돈된 우주론적 배열을 강조하므로, 수사의 정정과 함께 구조적 대조를 살리는 번역이 필요합니다.
  doctrine_reference: '번역 원칙: 원문 우선, 본문의 우주론적 구조 보존'
