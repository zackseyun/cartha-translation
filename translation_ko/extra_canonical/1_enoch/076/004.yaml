  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 장의 ነፋሳት는 개인 영이 아니라 우주적 바람이므로 ‘바람’으로 옮기고, 출현 동사를 자연스럽게 ‘나오다’로 처리했습니다.
- source_word: በረከት፡ ወሰላም
  english_pob_choice: blessing and peace
  chosen_korean: 축복과 평강
  alternatives_korean:
