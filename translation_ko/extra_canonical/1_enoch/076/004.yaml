base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
  footnotes:
  - marker: a
    text: Or 'winds of punishment' or 'winds of affliction.' The Ge'ez term denotes destructive chastisement; 'scourging' is chosen to preserve the force of the image.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the water upon it' is rendered closely from the Ge'ez. It may refer to the waters associated with the earth/land in this cosmological description.
    reason: cultural_note
  - marker: c
    text: Or 'From three of them'.
    reason: previous_rendering
translation:
  language: ko
  text: 네 포털을 통하여는 축복과 평강의 바람이 나오고, 그 여덟에서부터는 채찍질의 바람들이 나오니, 그들이 보내질 때에는 온 땅과 그 위의 물과 그 위에 사는 모든 자와 물속에 있는 모든 것과 마른 땅 위에 있는 모든 것 위에 파멸을 가져옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘채찍질’이지만, 본문은 파괴적 징계를 가리키므로 ‘징벌의 바람’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 위의 물’은 지상에 속한 물을 가리키는 듯한 우주론적 표현입니다.
    reason: cultural_note
lexical_decisions:
- source_word: በ፫/፬እምኔሆሙ
  english_pob_choice: Through four of them
  chosen_korean: 네 포털을 통하여는
  alternatives_korean:
  - 그 네 개를 통하여는
  - 네 개 가운데서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 12개 포털 가운데 4개를 가리키므로 수사를 4로 바로잡고, በ의 통로/매개 의미를 살려 ‘통하여’로 옮겼습니다.
- source_word: ይወፅኡ ነፋሳት
  english_pob_choice: come forth winds
  chosen_korean: 바람이 나오고
  alternatives_korean:
  - 바람들이 나오고
