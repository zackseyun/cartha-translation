base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
  footnotes:
  - marker: a
    text: Or 'sweet smell' / 'good fragrance.' The Ge'ez expression combines a noun for odor or fragrance with an adjective meaning 'good' or 'pleasant.'
    reason: lexical_alternative
  - marker: b
    text: '''Peace'' may also carry the sense of well-being or wholeness, not only the absence of conflict.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And through the opening that is beside the middle one'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 중간의 개구부를 통하여, 그 옆에 있는 그 문으로부터 좋은 향기와 이슬과 비와 평강과 생명이 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘개구부’는 여기서 영어 POB의 ‘opening’을 따른 것으로, 특정한 건물 요소로 한정하지 않습니다.
    reason: source_note
  - marker: b
    text: ‘평강’은 단순히 전쟁이 없는 상태만이 아니라 온전함과 복된 안녕까지 아우를 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 Ge'ez는 중간의 개구부 자체를 가리키며, ‘가운데의 것 옆에 있는 개구부’라는 뜻으로 옮기지 않습니다.
    reason: textual_variant
