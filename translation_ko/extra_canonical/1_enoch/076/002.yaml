base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
  footnotes:
  - marker: a
    text: Or possibly, 'on the right side of heaven ... on the left side,' which some readers may understand as south and north depending on the text's cosmic orientation.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'in the face of heaven' keeps the text's literal cosmic imagery; it may denote the front or visible expanse of the sky.
    reason: cultural_note
  - marker: c
    text: Or 'in the face of heaven'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들 가운데 셋은 하늘의 앞에 열려 있고, 셋은 서쪽에, 셋은 하늘의 오른쪽에, 셋은 왼쪽에 있습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈의 ‘하늘의 앞’은 문자적으로는 ‘하늘의 얼굴’이지만, 방향적 비유로 읽히는 표현입니다.
    reason: source_note
  - marker: b
    text: ‘오른쪽’과 ‘왼쪽’은 일부 해석에서 각각 남쪽과 북쪽으로 이해될 수 있습니다.
    reason: alternative_reading
lexical_decisions:
