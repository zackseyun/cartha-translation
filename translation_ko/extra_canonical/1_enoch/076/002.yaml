- issue: ‘하늘의 얼굴’ 계열 표현을 한국어에서 어떻게 처리할지
  chosen_reading: ‘하늘의 앞’로 번역해 방향성을 드러내되, 본문 이미지를 평면화하지 않았습니다.
  alternative_readings:
