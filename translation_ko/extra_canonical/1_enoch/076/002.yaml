  chosen_korean: 하늘의 오른쪽 / 왼쪽
  alternatives_korean:
  - 하늘의 남쪽 / 북쪽
  - 하늘의 오른편 / 왼편
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 신체적·우주론적 방향 언어를 유지하기 위해, 해석을 앞서 고정하지 않고 ‘오른쪽/왼쪽’으로 옮겼습니다.
theological_decisions:
- issue: ‘하늘의 얼굴’ 계열 표현을 한국어에서 어떻게 처리할지
  chosen_reading: ‘하늘의 앞’로 번역해 방향성을 드러내되, 본문 이미지를 평면화하지 않았습니다.
  alternative_readings:
  - 하늘의 얼굴
  - 하늘 앞
  rationale: 이 문맥은 우주를 몸의 방향 감각으로 묘사하므로, ‘얼굴’의 문자적 표현보다 방향성과 이미지가 함께 살아나는 표현이 더 적절합니다.
  doctrine_reference: 'Translation philosophy: preserve original-language primacy and preserve theological tension rather than resolve it'
