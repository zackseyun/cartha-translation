  - -편에
  lexicon: Dillmann
  rationale: 반복되는 방향 표지를 한국어에서는 자연스럽게 ‘-을 향하다’로 풀어, 열거된 방위가 실제 방향성임을 살렸습니다.
- source_word: በድኅረ እሉ
  english_pob_choice: after these
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 이들 뒤에
  - 이후에
  lexicon: Dillmann
  rationale: 앞선 열거를 이어 주는 전이 표현이므로 시간적 ‘이후’보다 공간·순서 모두를 담을 수 있는 ‘그 뒤에’가 적절합니다.
- source_word: በፀጋም
  english_pob_choice: on the left
  chosen_korean: 왼쪽
  alternatives_korean:
  - 좌측
  - 왼편
  lexicon: Dillmann
  rationale: 고대 동쪽을 향한 기준에서 ‘왼쪽’은 북쪽을 가리키는 보조 표지이므로, 본문에 그대로 남겨 그 방향 체계를 보이게 했습니다.
theological_decisions:
- issue: 왼쪽 표지와 방위 명칭을 함께 살릴지 여부
  chosen_reading: ‘왼쪽 곧 남쪽’을 본문에 유지하여, 본문이 가진 동쪽 기준의 방향 체계를 드러냈습니다.
  alternative_readings:
  - 왼쪽을 생략하고 방위만 제시
  - 왼쪽만 제시하고 방위를 빼기
  rationale: 이 절은 고대의 동쪽 기준 방향 체계를 반영하므로, 표지어와 실제 방위를 함께 두어 현대 독자가 그 세계관을 오해 없이 보도록 하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3, source-worldview preservation
- issue: 남쪽과 북쪽의 배열이 겉보기상 어긋나는 지점
  chosen_reading: 소스가 가진 배열과 긴장을 그대로 두었습니다.
  alternative_readings:
  - 정상적인 방위 순서로 재배열
  - 본문의 긴장을 주석 없이 조정
  rationale: 전승 본문에는 방위 배열과 ‘왼쪽’ 표지가 함께 있어 긴장이 생기지만, 이를 매끄럽게 재배열하면 स्रोत가 실제로 말하는 바를 덮어버리게 됩니다.
  doctrine_reference: Translation philosophy §3, preserve tension/ambiguity where present
