  naturalness: ‘첫째 셋’보다 ‘첫 세’가 현대 한국어의 수량 묶음 열거에 자연스럽습니다. 또한 긴 삽입 대시 대신 절을 분명히 나누면 합쇼체 문장으로 더 매끄럽습니다.
  terminology: 동쪽·북쪽·남쪽·서쪽 및 ‘왼쪽’은 적절합니다. ‘왼쪽 곧 남쪽’은 방향어의 의미를 잘못 조화시키므로 수정해야 합니다. 문화 주석도 통상적 동향 기준과 이 절의 실제 배열 간의 긴장을 명시해야 합니다.
