base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
  footnotes:
  - marker: a
    text: The phrase 'on the left' reflects the ancient convention of facing east; in that scheme, the left side corresponds to the north, just as the right side corresponds to the south.
    reason: cultural_note
  - marker: b
    text: The bracketed portion in the supplied Ethiopic witness suggests some textual uncertainty around 'after these, on the left'; the translation keeps the phrase but signals the uncertainty here.
    reason: textual_variant
  - marker: c
    text: Or 'And three of them are on the east side, and three on the south side, and after these, on the left, three on the north side and three on the west.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 첫째 셋은 동쪽을 향하고, 셋은 북쪽을 향하며, 셋은 그 뒤에 — 왼쪽 곧 남쪽을 향하고, 셋은 서쪽을 향합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 고대에는 동쪽을 향해 서 있다고 보고 왼쪽을 북쪽, 오른쪽을 남쪽으로 이해하는 관습이 있었습니다.
    reason: cultural_note
  - marker: b
    text: 전해지는 에티오피아어 증언에는 ‘그 뒤에, 왼쪽에’라는 구절 주위에 본문 불확실성이 있습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘그리고 그들 가운데 셋은 동쪽 편에 있고, 셋은 남쪽 편에 있으며, 그 뒤에 왼쪽에 셋은 북쪽 편과 서쪽 편에 있습니다.’
    reason: previous_rendering
lexical_decisions:
- source_word: ቀዳማያት
  english_pob_choice: the first three
  chosen_korean: 첫째 셋
  alternatives_korean:
  - 처음의 셋
  - 첫 세
  lexicon: Dillmann
  rationale: 방향 목록 안에서 숫자의 순서를 표시하는 말이므로 단순한 서수보다 ‘첫째 셋’으로 옮겨 첫 묶음임을 분명히 했습니다.
- source_word: መንገለ
  english_pob_choice: toward / side
  chosen_korean: -을 향하고
  alternatives_korean:
