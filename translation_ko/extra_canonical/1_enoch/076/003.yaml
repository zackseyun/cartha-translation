base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
  footnotes:
  - marker: a
    text: The phrase 'on the left' reflects the ancient convention of facing east; in that scheme, the left side corresponds to the north, just as the right side corresponds to the south.
    reason: cultural_note
  - marker: b
    text: The bracketed portion in the supplied Ethiopic witness suggests some textual uncertainty around 'after these, on the left'; the translation keeps the phrase but signals the uncertainty here.
    reason: textual_variant
  - marker: c
    text: Or 'And three of them are on the east side, and three on the south side, and after these, on the left, three on the north side and three on the west.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 첫 세는 동쪽을 향하고, 세는 북쪽을 향하며, 그 뒤에 왼쪽에 있는 세는 남쪽을 향하고, 세는 서쪽을 향합니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 고대에는 동쪽을 향해 서 있는 것을 기준으로 왼쪽을 북쪽, 오른쪽을 남쪽으로 이해하는 관습이 있었습니다. 그러나 이 절은 ‘왼쪽’과 ‘남쪽’을 함께 언급합니다.
    reason: cultural_note
  - marker: b
    text: 전해지는 에티오피아어 증언에는 ‘그 뒤에, 왼쪽에’라는 구절 주위에 본문상의 불확실성이 있습니다.
    reason: textual_variant
  - marker: c
    text: 또는 ‘그리고 그들 가운데 셋은 동쪽 편에 있고, 셋은 남쪽 편에 있으며, 그 뒤에 왼쪽에 있는 셋은 북쪽 편에 있고, 셋은 서쪽 편에 있다.’
    reason: previous_rendering
lexical_decisions:
- source_word: ቀዳማያት
  english_pob_choice: the first three
  chosen_korean: 첫째 셋
  alternatives_korean:
  - 처음의 셋
  - 첫 세
  lexicon: Dillmann
  rationale: 방향 목록 안에서 숫자의 순서를 표시하는 말이므로 단순한 서수보다 ‘첫째 셋’으로 옮겨 첫 묶음임을 분명히 했습니다.
- source_word: መንገለ
  english_pob_choice: toward / side
  chosen_korean: -을 향하고
  alternatives_korean:
  - -쪽에
  - -편에
  lexicon: Dillmann
  rationale: 반복되는 방향 표지를 한국어에서는 자연스럽게 ‘-을 향하다’로 풀어, 열거된 방위가 실제 방향성임을 살렸습니다.
- source_word: በድኅረ እሉ
  english_pob_choice: after these
  chosen_korean: 그 뒤에
  alternatives_korean:
  - 이들 뒤에
  - 이후에
  lexicon: Dillmann
  rationale: 앞선 열거를 이어 주는 전이 표현이므로 시간적 ‘이후’보다 공간·순서 모두를 담을 수 있는 ‘그 뒤에’가 적절합니다.
- source_word: በፀጋም
  english_pob_choice: on the left
  chosen_korean: 왼쪽
  alternatives_korean:
  - 좌측
  - 왼편
  lexicon: Dillmann
  rationale: 고대 동쪽을 향한 기준에서 ‘왼쪽’은 북쪽을 가리키는 보조 표지이므로, 본문에 그대로 남겨 그 방향 체계를 보이게 했습니다.
theological_decisions:
- issue: 왼쪽 표지와 방위 명칭을 함께 살릴지 여부
  chosen_reading: ‘왼쪽 곧 남쪽’을 본문에 유지하여, 본문이 가진 동쪽 기준의 방향 체계를 드러냈습니다.
  alternative_readings:
  - 왼쪽을 생략하고 방위만 제시
  - 왼쪽만 제시하고 방위를 빼기
  rationale: 이 절은 고대의 동쪽 기준 방향 체계를 반영하므로, 표지어와 실제 방위를 함께 두어 현대 독자가 그 세계관을 오해 없이 보도록 하는 편이 더 충실합니다.
  doctrine_reference: Translation philosophy §3, source-worldview preservation
- issue: 남쪽과 북쪽의 배열이 겉보기상 어긋나는 지점
  chosen_reading: 소스가 가진 배열과 긴장을 그대로 두었습니다.
  alternative_readings:
  - 정상적인 방위 순서로 재배열
  - 본문의 긴장을 주석 없이 조정
  rationale: 전승 본문에는 방위 배열과 ‘왼쪽’ 표지가 함께 있어 긴장이 생기지만, 이를 매끄럽게 재배열하면 स्रोत가 실제로 말하는 바를 덮어버리게 됩니다.
  doctrine_reference: Translation philosophy §3, preserve tension/ambiguity where present
