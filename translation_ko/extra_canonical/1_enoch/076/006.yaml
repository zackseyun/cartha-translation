base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/006.yaml
  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
  footnotes:
  - marker: a
    text: The sequence 'famine ... rain and fruit and peace and dew' is textually and conceptually abrupt. The Ge'ez is translated as given rather than smoothed; some readers may expect a contrast or a different ordering of effects.
    reason: textual_variant
  - marker: b
    text: Or 'aridity' for 'dryness.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And from the second middle gate famine comes out, and from it come rain and fruit and peace and dew; and from the third gate, which is toward the south, frost comes out and dryness.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 두 번째 중앙 문을 통해서는 풍성함이 나오고, 그 문으로부터는 비와 열매와 평강과 이슬이 나오며, 세 번째 문은 북쪽을 향해 있는데, 그 문을 통해서는 서리와 건조함이 나옵니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 본절은 문들에서 나오는 것들의 배열이 다소 갑작스럽게 보일 수 있으나, 원문이 제시하는 순서를 그대로 따랐습니다.
    reason: textual_variant
  - marker: b
    text: ‘건조함’은 ‘메마름’ 또는 ‘건조’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: ‘북쪽’은 본문 방향어 መስዕ을 따른 번역입니다.
    reason: source_note
lexical_decisions:
- source_word: በ*፪*ኆኅት፡ ማእከላዊት፡ ይወፅእ፡ *ርኅብ፡
  english_pob_choice: And through the second middle gate abundance comes out
  chosen_korean: “두 번째 중앙 문을 통해서는 풍성함이 나오고”
  alternatives_korean:
  - “두 번째 중간 문을 통해서는 풍요가 나오고”
  - “두 번째 중앙 문에서 풍성함이 나오고”
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ኆኅት은 천상 통로의 이미지가 살아 있는 ‘문’보다도 ‘문’/‘문턱’ 계열이 가능하지만, 본문 반복 구조를 살리기 위해 ‘문’을 택했습니다. ርኅብ은 영어 POB가 최종적으로 ‘abundance’로 정리한 점을 반영해 ‘풍성함’으로 옮겨, 기상·생산력의 풍부함을 자연스럽게 드러냈습니다.
- source_word: ወይወፅእ፡ እምኔሃ፡ *ዝናም፡ ወፍሬ፡ ወሠላም፡ ወጤለ፡
  english_pob_choice: and from it come rain and fruit and peace and dew
  chosen_korean: “그 문으로부터는 비와 열매와 평강과 이슬이 나오며”
  alternatives_korean:
  - “그 문에서 비와 열매와 평화와 이슬이 나오며”
  - “그 문으로부터 비와 열매와 평강과 이슬이 나옵니다”
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 열거 구조를 그대로 살려 ‘비, 열매, 평강, 이슬’의 순서를 유지했습니다. ሠላም은 일반적·포괄적 의미의 ‘평강’이 가장 무리 없고, 본문이 단순한 기상 묘사를 넘어 풍요와 안정을 함께 그린다는 점도 반영합니다.
- source_word: ወበ*ሣልስ፡ ኆኅት፡ *እንተ፡ መንገለ፡ መስዕ፡
  english_pob_choice: and through the third gate, which is toward the south
  chosen_korean: “세 번째 문은 북쪽을 향해 있는데”
  alternatives_korean:
  - “세 번째 문은 남쪽을 향해 있는데”
  - “세 번째 문은 북쪽을 향하고 있는데”
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: English POB의 최신 정리와 주해를 반영해 መስዕ을 ‘북쪽’으로 옮겼습니다. 관계절은 한국어에서 매끄럽게 풀어 ‘북쪽을 향해 있는데’라고 했고, 원문의 방향 표지를 유지했습니다.
- source_word: ቍር፡ ወየብስ፡
  english_pob_choice: frost comes out and dryness
  chosen_korean: “서리와 건조함이 나옵니다”
  alternatives_korean:
  - “서리와 메마름이 나옵니다”
  - “서리와 건조가 나옵니다”
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ቍር은 계절적·기상적 효과를 살려 ‘서리’로, የብስ은 직역에 가까운 ‘건조함’으로 옮겼습니다. ‘가뭄’보다 원문이 지시하는 물리적 상태를 더 직접적으로 보존합니다.
theological_decisions:
- issue: 천상 문과 기상 현상의 직접적 발출 이미지
  chosen_reading: 문을 통해 비·열매·평강·이슬, 서리·건조함이 ‘나온다’는 구조를 그대로 유지했습니다.
  alternative_readings:
  - ‘문에서 비와 열매가 생긴다’처럼 의미를 풀어 쓰기
  - 천문학적 상징을 약화시키고 일반 자연현상 설명처럼 번역하기
  rationale: 에녹서는 우주가 질서 있게 배치된 천상 구조를 강조하므로, 생성 동사를 완화하지 않고 ‘나오다’를 반복해 원문의 묵시적 우주관을 보존했습니다.
  doctrine_reference: 'Translation philosophy: apocalyptic cosmology should remain visible in translation; avoid domestication of source imagery.'
