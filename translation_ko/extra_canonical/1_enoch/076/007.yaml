  language: ko
  text: 그리고 이 바람들 뒤에, 남쪽 길로 그들은 두 문을 통해 나갑니다. 첫째 문을 통해, 동쪽을 향해 기울어져 있는 곳에서 죽음의 바람이 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으스 문장은 ‘첫 문’의 앞뒤 관계를 압축해서 말하므로, 출구들의 정확한 배열은 다소 축약되어 있습니다.
    reason: source_note
