  source_fidelity: 초안은 ‘두 문’, ‘죽음의 바람’ 및 남쪽·동쪽의 방향성을 대체로 충실히 반영합니다. 그러나 게에즈어의 여성 단수 관계절은 ‘첫째 문’을 수식하는데, 초안의 ‘동쪽을 향해 기울어져 있는 곳에서’는 이를 장소를 가리키는 표현으로 바꾸어 문장 관계를 흐립니다.
