base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
  footnotes:
  - marker: a
    text: The clause 'whose name is Sea, and which come out' is textually difficult in the Ethiopic transmission and may reflect a variant or expansion, but it is retained here because it is present in the supplied witness.
    reason: textual_variant
  - marker: b
    text: A bracketed phrase in the witness may read 'toward the west.' Because its placement is uncertain in the OCR text, it is not represented in the main translation.
    reason: alternative_reading
  - marker: c
    text: Or 'from the south'.
    reason: previous_rendering
  - marker: d
    text: Or 'from the seven openings'.
    reason: previous_rendering
  - marker: e
    text: Or 'come forth from them as dew'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 뒤에, 남쪽에서 오는 바람들—그 이름은 바다이며, 동쪽을 향한 일곱 개의 문에서 나오는—그것에서 이슬이 나옵니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 이름은 바다이며, 그리고 나오는’이라는 절은 에티오피아어 전승에서 본문상 난해하며, 변이 또는 확장일 수 있지만, 제공된 증언에 있으므로 본문에 유지했습니다.
    reason: textual_variant
  - marker: b
    text: 괄호친 구절은 OCR 문맥상 ‘서쪽을 향한’으로 읽힐 수 있으나, 위치가 불확실하여 본문에는 반영하지 않았습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘남쪽에서’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘일곱 개의 문에서’.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘그것들에서 이슬로 나옵니다’.
    reason: previous_rendering
