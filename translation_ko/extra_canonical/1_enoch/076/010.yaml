translation:
  language: ko
  text: 그리고 이 뒤에는 남쪽에서 불어오는 바람들이 있습니다. 그 이름은 ‘바다’라고 하며, 그 바람들은 동쪽을 향한 일곱째 문에서 나옵니다. 그 문에서 이슬이 나옵니다.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 이름은 바다라고 하며, 그 바람들은 나온다’라는 절은 에티오피아어 전승에서 본문상 난해하며, 이문 또는 확장일 수 있습니다. 그러나 제공된 증언에 있으므로 본문에 유지했습니다.
    reason: textual_variant
  - marker: b
    text: 증언에 대괄호로 된 구절은 ‘서쪽을 향한’으로 읽힐 수 있습니다. 그 위치와 본문 관계가 불확실하므로 본문에는 반영하지 않았습니다.
    reason: alternative_reading
  - marker: c
    text: 또는 ‘남쪽의 바람들’.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘동쪽을 향한 일곱 개의 문에서’.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘그것들에서 이슬로 나옵니다’.
    reason: previous_rendering
