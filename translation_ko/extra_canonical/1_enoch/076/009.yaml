  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
  footnotes:
  - marker: a
    text: The final term may denote snow or another form of frozen precipitation; 'hail' is a possible alternative.
    reason: lexical_alternative
  - marker: b
    text: Or 'mist and rain and frost and snow'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 셋째 문을 통해, 서쪽을 향하여, 그곳으로부터 이슬과 비와 우박과 파괴가 나옵니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘우박’에 해당하는 것으로 읽었습니다. 본 전통에서는 얼음성 강수 전반을 가리키는 더 넓은 뜻일 가능성도 있어, 다른 판본에서는 ‘서리’처럼 옮길 여지도 있습니다.
    reason: lexical_alternative
