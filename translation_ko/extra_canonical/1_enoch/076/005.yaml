  rationale: 『에녹서』의 천문/우주론 문맥에서는 바람들이 질서정연하지만 해로운 힘으로 제시되므로, 그 재앙성을 그대로 보존했습니다.
  doctrine_reference: Apocalyptic imagery should not be flattened into generic weather description.
