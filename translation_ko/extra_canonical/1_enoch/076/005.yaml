base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'inclining toward the south' is difficult; it may also be understood as 'turning southward.'
    reason: lexical_alternative
  - marker: b
    text: The transmitted form before 'and destruction' is textually difficult in this OCR witness. The context favors a climatic calamity such as 'heat' or 'scorching heat.'
    reason: textual_variant
  - marker: c
    text: Or 'that is on the way of the east; and inclining toward the south, from there come forth desolation, drought, heat, and destruction.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 첫째 바람은 그 문들에서 나옵니다. 그 이름은 동풍이며, 동쪽을 향한 첫째 문을 통합니다. 그리고 남쪽으로 기울어져, 그로부터 황폐와 가뭄과 죽음과 파멸이 나옵니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘남쪽으로 기울어져’는 난해한 구문이므로, ‘남쪽으로 향하여’로도 이해할 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 전승 본문은 이 자리에 기상 재앙을 가리키는 다른 표현을 시사할 가능성이 있습니다. 그러나 현존 게이즈 본문은 ‘죽음’으로 읽힙니다.
    reason: textual_variant
