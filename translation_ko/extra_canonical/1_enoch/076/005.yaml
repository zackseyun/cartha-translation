revisions:
- from: 그리고 첫째 바람은 그 문들에서 나옵니다. 그 이름은 동풍이며, 동쪽을 향한 첫째 문을 통합니다. 그리고 남쪽으로 기울어져, 그로부터 황폐와 가뭄과 죽음과 파멸이 나옵니다.[a][b]
  to: 그리고 동풍이라 불리는 첫째 바람은 그 문들에서 나옵니다. 그것은 동쪽을 향하고 남쪽으로 기울어진 첫째 문을 통합니다. 그 문에서 황폐와 가뭄과 죽음과 파멸이 나옵니다.[a]
  rationale: 현존 게이즈 본문이 분명히 말하는 ‘죽음’을 그대로 유지했습니다. 근거 없는 이문 가능성을 제시하던 각주 b를 삭제하고, 난해한 방향 구문에 대한 제한적인 대안만 각주로 남겼습니다. 또한 ‘그 문에서’로 출처의 지시 대상을 분명히 하고 문장 흐름을 다듬었습니다.
