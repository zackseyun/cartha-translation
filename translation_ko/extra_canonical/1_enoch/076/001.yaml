base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
  footnotes:
  - marker: a
    text: The Ge'ez term rendered 'portals' could also be translated 'gates' or 'openings.' 'Portals' is chosen to preserve the structured cosmic imagery of the vision.
    reason: lexical_alternative
  - marker: b
    text: Or 'twelve portals, open all around, for all the winds'.
    reason: previous_rendering
translation:
  language: ko
  text: 땅의 끝에서 나는 열두 개의 문[a]을 보았습니다. 그 모든 문은 모든 바람을 위해 열려 있었으며, 그 문들에서 바람들이 나와 땅 위로 불었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez의 해당 어휘는 ‘문’ 외에도 ‘관문’이나 ‘입구’로 옮길 수 있습니다. 여기서는 비전의 구조적 이미지를 살리기 위해 ‘문’으로 옮겼습니다.
    reason: lexical_alternative
