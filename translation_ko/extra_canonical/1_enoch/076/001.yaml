  - 모든 영들을 위하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 천상의 통로를 통해 나오는 기상 현상을 말하므로 ‘바람’으로 옮겼습니다. ‘영들’은 이 절의 우주론적 문맥에 맞지 않습니다.
