    rationale: ‘사방으로’는 ኃዋላው을 잘못 읽은 데서 나온 대안이며, 최근 감사 기록은 이를 ‘그 문들’로 교정했습니다. 따라서 이 각주는 독자에게 근거 없는 본문 대안을 제시합니다.
