base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'long cords' could also be understood more specifically as 'long ropes' or possibly 'measuring cords.'
    reason: lexical_alternative
  - marker: b
    text: The wording 'those angels' may also be read 'the other angels,' depending on how the demonstrative is taken.
    reason: alternative_reading
translation:
  language: ko
  text: 그리고 나는 그날들에 긴 줄들이 그 천사들에게 주어지고, 그들이 스스로 날개를 가져다가 날아 북쪽을 향해 갔음을 보았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 '긴 줄들'이지만, 문맥에 따라 '긴 밧줄들' 또는 '측량줄들'로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 문장의 '그'는 문맥에 따라 '그 다른 천사들'로도 읽을 수 있습니다.
    reason: alternative_reading
