    issue: ‘날개를 가져다가’
    rationale: ‘가져오다’는 원문에 없는 이동·반입의 의미를 암시할 수 있습니다. ሎሙ의 재귀적/여격적 뉘앙스는 ‘스스로 날개를 취해’로 더 직접적으로 살릴 수 있습니다.
  - severity: medium
    issue: 각주 표지의 위치와 각주 b의 지시 표현
    rationale: a는 ‘긴 줄들’의 어휘 대안, b는 ‘그 천사들’의 대안 독법에 연결되어야 합니다. 초안처럼 문장 끝에 함께 두면 어느 표현을 주석하는지 불분명하며, ‘이 문장의 그’는 명사구 전체를 정확히 가리키지 못합니다.
  - severity: low
