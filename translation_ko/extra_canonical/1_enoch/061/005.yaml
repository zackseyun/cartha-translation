base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/005.yaml
  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
  footnotes:
  - marker: a
    text: The verb rendered 'be supported' is difficult; it may also be understood as 'be upheld' or possibly 'be gathered together.'
    reason: lexical_alternative
  - marker: b
    text: '''The Chosen One'' is a title used in the Parables for the eschatological figure associated with judgment and vindication.'
    reason: cross_reference
  - marker: c
    text: The final clause is compressed in Ge'ez. The sense is that no one can finally perish in the presence of the Lord of Spirits.
    reason: textual_variant
  - marker: d
    text: Or 'And these shall reveal'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이 측량들은 땅 깊은 곳에 숨겨진 모든 것과 광야에서 멸망한 이들과 들짐승에게 삼켜진 이들과 바다의 물고기에게 삼켜진 이들을 드러낼 것입니다.[a] 그리하여 그들이 택함을 받은 이의 날에[b] 돌아와 붙들림을 받게 될 것입니다. 영들의 주 앞에서는 아무도 멸망하지 않으며, 아무도 멸망할 수 없기 때문입니다.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘측량들’(Ge'ez እምጣን)은 원문에 명시되어 있습니다. 이 표현은 앞 문맥의 측량 또는 척도와 연결되는 것으로 보이나, 이 절만으로 그 정확한 지시 대상을 확정하기는 어렵습니다.
    reason: source_note
  - marker: b
    text: ‘택함을 받은 이’는 이 비유들에서 종말의 심판과 회복에 관련된 인물을 가리키는 칭호입니다.
    reason: cross_reference
  - marker: c
    text: 마지막 구절은 Ge'ez에서 압축적으로 표현되어 있습니다. 여기서는 영들의 주 앞에서 아무도 최종적으로 멸망하지 못한다는 뜻을 반복으로 옮겼습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ወእሉ እምጣን
  english_pob_choice: And these measures shall reveal
  chosen_korean: 그리고 이들은
  alternatives_korean:
  - 그리고 이 측량들은
  - 그리고 이 기준들은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영어 본문과 개정 이력에는 'measures' 처리의 긴장이 있으나, 아므하릭 문장 자체는 이 지시대명사+명사구가 선행 맥락의 주체를 가리키는 구조로 읽혀 한국어 본문은 지시력만 살려 옮겼습니다.
- source_word: ለዕመቀ ምድር
  english_pob_choice: in the depth of the earth
  chosen_korean: 땅의 깊은 곳에 있는
  alternatives_korean:
  - 땅의 깊이에 있는
  - 땅속 깊은 곳에 있는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''깊은 곳''은 지하/매장된 사물의 이미지를 자연스럽게 살리면서도 원문의 지중적 감각을 유지합니다.'
- source_word: ይትመረጐዙ
  english_pob_choice: be supported
  chosen_korean: 붙들리게 하려는 것입니다
  alternatives_korean:
  - 붙들리게 하려는 것입니다
  - 지탱되게 하려는 것입니다
  - 힘을 얻도록 하려는 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 동사는 'support'보다 '붙들다/지탱하다' 쪽이 더 근접해, 부활·회복의 수동적 보존 의미를 드러내는 한국어로 처리했습니다.
- source_word: በዕለተ ኅሩይ
  english_pob_choice: on the day of the Chosen One
  chosen_korean: 택하신 이의 날
  alternatives_korean:
  - 선택받으신 이의 날
  - 택함 받은 이의 날
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1 Enoch의 칭호는 'Chosen One'의 인칭적·메시아적 기능을 가지므로, 직역적이되 한국어에서 제목처럼 읽히는 '택하신 이'로 옮겼습니다.
- source_word: አልቦቱ ዘይትኃጐል ... ወአልቦ ዘይክል ተኃጕሎተ
  english_pob_choice: for none shall perish ... and none can perish
  chosen_korean: 아무도 망하지 않으며, 아무도 망할 수 없기 때문입니다
  alternatives_korean:
  - 아무도 멸망하지 않으며, 아무도 멸망할 수 없기 때문입니다
  - 아무도 죽지 않으며, 아무도 죽을 수 없기 때문입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 번 반복되는 동사 어근의 압축을 살리면서, 앞의 'destroyed' 계열과도 맞물리도록 '망하다'를 반복해 최종 불가능성을 한국어로 분명히 했습니다.
theological_decisions:
- issue: '''Chosen One'' 칭호의 한국어 처리'
  chosen_reading: 택하신 이
  alternative_readings:
  - 선택받으신 이
  - 택함 받은 이
  rationale: 이 칭호는 단순 형용사가 아니라 종말론적 인물의 칭호이므로, 개인적 인격성을 유지하는 동시에 한국어에서 과도하게 교회화된 용어를 피했습니다.
  doctrine_reference: 1 Enoch Parables의 메시아적 칭호를 본문 내부 용법대로 보존
- issue: 마지막 절의 이중 부정과 소멸 표현
  chosen_reading: 아무도 망하지 않으며, 아무도 망할 수 없기 때문입니다
  alternative_readings:
  - 아무도 멸망하지 않으며, 아무도 멸망할 수 없기 때문입니다
  - 아무도 파멸하지 않으며, 아무도 파멸할 수 없기 때문입니다
  rationale: 원문은 '죽다'보다 '소멸/멸망' 계열의 강한 부정으로, 존재론적 파괴 불가능성을 강조합니다. 한국어에서는 같은 동사를 반복해 압축감을 살렸습니다.
  doctrine_reference: 종말론적 보존과 심판 앞의 무망(無亡) 선언을 과도하게 약화하지 않음
