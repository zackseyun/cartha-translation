base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
  footnotes:
  - marker: a
    text: The clause rendered 'beyond measure from power' is textually and syntactically difficult in the Ethiopic witness. It may convey the idea of flesh endowed with surpassing strength or abundance of power.
    reason: textual_variant
  - marker: b
    text: '''Who do not sleep'' likely refers to wakeful heavenly beings in perpetual attendance, not merely to human vigilance.'
    reason: cultural_note
  - marker: c
    text: Or 'May all who do not sleep in the heights of heaven bless you; may all the holy ones who are in heaven bless you'.
    reason: previous_rendering
  - marker: d
    text: Or 'and all flesh beyond measure from power shall glorify and bless'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘의 높은 곳에서 잠들지 않는 모든 이들이 그를 찬송할 것이며, 하늘에 있는 모든 거룩한 이들이 그를 찬송할 것이며, 생명의 동산에 거하는 모든 선택된 이들이 그를 찬송할 것이며, 또 빛의 모든 영들—찬송하고 영화롭게 하고 높이며 거룩하게 하는 일을 감당할 수 있는 이들이—당신의 복된 이름을 찬송하고 찬양할 것이며, 모든 육체가 능력으로 더욱더 당신의 이름을 영원무궁토록 찬양하고 찬송할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높은 곳’은 하늘의 높은 영역을 가리키며, 천상 질서의 상층부라는 공간 이미지를 보존한 표현입니다.
    reason: source_note
  - marker: b
    text: ‘잠들지 않는’은 단순한 인간의 각성이 아니라, 끊임없이 대기하는 천상 존재의 관용적 묘사로 이해할 수 있습니다.
    reason: cultural_note
lexical_decisions:
- source_word: እለ ኢይነውሙ
  english_pob_choice: who do not sleep
  chosen_korean: 잠들지 않는
  alternatives_korean:
  - 잠들지 않는 이들
  - 잠들지 않는 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영적·천상적 깨어 있음의 이미지를 살리되, 합쇼체 문맥에서 자연스러운 현재분사형으로 옮겼습니다.
- source_word: ቅዱሳን
  english_pob_choice: holy ones
  chosen_korean: 거룩한 이들
  alternatives_korean:
  - 성도들
  - 거룩한 존재들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥에서는 지상 교회 용어인 ‘성도’보다 천상적 범주의 중립적 표현이 더 적합하므로, ‘거룩한 이들’로 옮겼습니다.
- source_word: ኅሩያን
  english_pob_choice: chosen ones
  chosen_korean: 선택된 이들
  alternatives_korean:
  - 택함 받은 이들
  - 택자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 종말론적 용어를 한국어로 직접 드러내되, 교리적 선입견을 덜어내기 위해 ‘선택된’으로 옮겼습니다.
- source_word: ገነት ሕይወት
  english_pob_choice: the garden of life
  chosen_korean: 생명의 동산
  alternatives_korean:
  - 생명의 낙원
  - 생명 동산
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문의 정원 이미지와 POB의 ‘garden’ 선택을 유지하기 위해 ‘동산’을 사용했습니다.
- source_word: መንፈሰ ብርሃን
  english_pob_choice: spirit of light
  chosen_korean: 빛의 영
  alternatives_korean:
  - 빛의 정신
  - 광명의 영
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역에 가깝게 관계구조를 보존하면서도 한국어 어순에서는 ‘빛의 영’이 가장 간결하고 자연스럽습니다.
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  english_pob_choice: to bless and glorify and exalt and sanctify
  chosen_korean: 찬송하고 영화롭게 하고 높이며 거룩하게 하는
  alternatives_korean:
  - 복을 빌고 영화롭게 하고 높이며 거룩하게 하는
  - 찬양하고 영화롭게 하고 높이며 거룩하게 하는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 네 개의 동사를 모두 살리되, 한국어에서는 중복을 줄이기 위해 첫 동사는 ‘찬송하다’로, 뒤의 동사들은 동작의 연속을 드러내는 연결형으로 옮겼습니다.
- source_word: ዘትክል
  english_pob_choice: that is able
  chosen_korean: 감당할 수 있는
  alternatives_korean:
  - 할 수 있는
  - 합당한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순 능력보다 ‘맡은 바를 해낼 수 있음’의 뉘앙스를 살려, 네 동사를 수행할 수 있는 역량을 더 정확히 전달했습니다.
- source_word: ፈድፋደ እምኃይል
  english_pob_choice: exceedingly and with power
  chosen_korean: 능력으로 더욱더
  alternatives_korean:
  - 힘으로 더욱더
  - 극히 능력 있게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최종 절의 부사적 수식어를 한국어에서 자연스럽게 재배치해 ‘아주/더욱더’와 ‘능력으로’를 함께 드러냈습니다.
- source_word: ለዓለመ ዓለም
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 세세토록
  - 영원히 또 영원히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 영속성을 담는 관용적 한국어를 택하되, 전통적 교회 어법에 지나치게 기대지 않는 표현으로 옮겼습니다.
theological_decisions:
- issue: 천상 존재들의 범주를 특정하지 않음
  chosen_reading: ‘거룩한 이들’, ‘선택된 이들’, ‘빛의 영들’을 서로 구별되는 천상 범주로 남기고, 천사·의인 중 누구인지 단정하지 않았습니다.
  alternative_readings:
  - 모두 천사로 특정
  - 선택된 이들을 구속받은 인간으로 특정
  rationale: 본문은 여러 천상적 집단을 나열하지만 그 존재론을 해설하지 않으므로, 원문의 긴장을 보존하는 편이 더 충실합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
