revisions:
- from: 하늘의 높은 곳에서 잠들지 않는 모든 이들이 그를 찬송할 것이며, 하늘에 있는 모든 거룩한 이들이 그를 찬송할 것이며, 생명의 동산에 거하는 모든 선택된 이들이 그를 찬송할 것이며, 또 빛의 모든 영들—찬송하고 영화롭게 하고 높이며 거룩하게 하는 일을 감당할 수 있는 이들이—당신의 복된 이름을 찬송하고 찬양할 것이며, 모든 육체가 능력으로 더욱더 당신의 이름을 영원무궁토록 찬양하고 찬송할 것입니다.[a][b]
  to: 하늘의 높은 곳[a]에서 잠들지 않는[b] 모든 이들이 그를 찬송할 것이며, 하늘에 있는 모든 거룩한 이들이 그를 찬송할 것이며, 생명의 동산에 거하는 모든 선택된 이들이 그를 찬송할 것이며, 당신의 복된 이름을 찬송하고 영화롭게 하며 높이고 거룩하게 할 수 있는 모든 빛의 영이 찬송할 것이며, 모든 육체가 매우 힘차게[c] 당신의 이름을 찬양하고 찬송할 것입니다.
  rationale: 빛의 영에 관한 네 겹의 찬미 동사를 모두 보존하고, 그것들이 ‘당신의 복된 이름’을 직접 수식하도록 문장을 재구성했습니다. 또한 마지막 절에서는 원문의 찬양 동사와 축복/찬송 동사를 각각 ‘찬양하다’와 ‘찬송하다’로 옮겼습니다. 3인칭 ‘그를’에서 2인칭 ‘당신의 이름’으로 바뀌는 원문의 호칭 전환은 그대로 유지했습니다. 어려운 부사구는 자연스러운 한국어로 옮기되 각주로 불확실성과 대안을 밝혔습니다.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-13T20:16:36Z'
review_pass:
  verdict: revise
  source_fidelity: 개정이 필요합니다. 초안은 앞부분의 3인칭 남성 단수 목적어(‘그를’)와 후반부의 2인칭 소유 표현(‘당신의 이름’)의 전환을 보존한 점, 그리고 선택된 이들의 찬송을 보충한 점은 적절합니다. 그러나 ‘빛의 영’ 절에서 원문의 네 동사(축복하다/영화롭게 하다/높이다/거룩하게 하다)가 실제로 ‘당신의 복된 이름’을 향하는 서술로 완결되지 않고, 이어지는 ‘찬송하고 찬양하다’가 그 자리를 대신하여 동사들의 구별과 통사 관계를 훼손합니다. 최종 절은 서로 다른 두 동사인 ‘찬양하다’와 ‘찬송하다’를 구별하여 옮겨야 합니다.
  naturalness: 개정문은 현대 표준 한국어의 격식 있는 문체를 유지하면서, 긴 병렬 나열을 ‘것이며’로 연결하고 마지막 절에서 종결합니다. ‘능력으로 더욱더’보다 ‘매우 힘차게’가 한국어에서는 더 자연스럽지만, 해당 게에즈어 구절의 문법과 의미가 불확실하므로 각주에서 그 불확실성을 밝혔습니다.
  terminology: ‘거룩한 이들’, ‘선택된 이들’, ‘생명의 동산’, ‘빛의 영’, ‘모든 육체’는 원문의 범주와 이미지를 보존합니다. ‘찬송’은 축복/찬송의 동사에, ‘찬양’은 마지막 절의 찬양 동사에 대응시켜 반복되는 예배 언어와 두 동사의 차이를 유지했습니다. ‘복된 이름’도 원문의 수식 관계를 충실히 반영합니다.
  issues:
  - severity: high
    issue: 빛의 영에 관한 절이 원문의 네 동사를 직접 서술하지 않습니다.
    rationale: 원문은 빛의 영이 ‘당신의 복된 이름을 찬송하고, 영화롭게 하고, 높이고, 거룩하게’ 할 수 있다고 말합니다. 초안은 이를 ‘…하는 일을 감당할 수 있는 이들’로 명사화한 뒤 ‘당신의 복된 이름을 찬송하고 찬양할 것’이라고 하여 ‘영화롭게 하다·높이다·거룩하게 하다’를 탈락시킵니다.
  - severity: medium
    issue: 최종 절의 부사구에 대한 본문상 불확실성이 각주로 표시되지 않습니다.
    rationale: ፈድፋደ እምኃይል은 문법적·본문상 어려움이 있는 구절입니다. ‘매우 힘차게’는 문맥상 가능한 자연스러운 번역이지만, 독자가 이를 확정적 해석으로 오해하지 않도록 해당 어구에 각주를 달아 대안을 제시하는 것이 안전합니다.
  - severity: low
    issue: 기존 각주 표지가 해당 표현에 직접 붙어 있지 않습니다.
    rationale: ‘높은 곳’과 ‘잠들지 않는’에 관한 각주는 각 표현 뒤에 배치해야 각주 앵커가 명확해집니다.
