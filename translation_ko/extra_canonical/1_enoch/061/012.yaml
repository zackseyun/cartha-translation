  rationale: 최종 절의 부사적 수식어를 한국어에서 자연스럽게 재배치해 ‘아주/더욱더’와 ‘능력으로’를 함께 드러냈습니다.
- source_word: ለዓለመ ዓለም
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁토록
  alternatives_korean:
  - 세세토록
  - 영원히 또 영원히
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 종말론적 영속성을 담는 관용적 한국어를 택하되, 전통적 교회 어법에 지나치게 기대지 않는 표현으로 옮겼습니다.
