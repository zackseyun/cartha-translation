base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
  footnotes:
  - marker: a
    text: Or 'in a spirit of faithfulness'; the Ge'ez term can denote faith or fidelity.
    reason: lexical_alternative
  - marker: b
    text: The final virtue may also be rendered 'goodness,' 'kindness,' or 'nobility'; the Ge'ez term is broad.
    reason: lexical_alternative
  - marker: c
    text: The repeated expression 'spirit of ...' is left transparent. It may denote the disposition of praise, divinely given qualities, or more personified heavenly endowments.
    reason: alternative_reading
  - marker: d
    text: Or 'generosity'.
    reason: previous_rendering
  - marker: e
    text: Or 'Blessed be he, and blessed be'.
    reason: previous_rendering
translation:
  language: ko
  text: 그날에 그들은 한 목소리를 높여, 믿음의 영 안에서, 지혜의 영 안에서, 인내의 영 안에서, 긍휼의 영 안에서, 의와 평강의 영 안에서, 선함의 영 안에서 복을 빌며 찬양하고 높일 것입니다. 그리고 그들 모두는 한 목소리로 말할 것입니다. 「그가 복을 받으시기를, 그리고 영들의 주님의 이름이 영원무궁하도록 복을 받으시기를」.[a][b][c][d][e]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘믿음’은 여기서 ‘신실함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 덕목은 ‘선함’ 외에 ‘친절’ 또는 ‘호의’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 반복되는 ‘…의 영’ 표현은 그대로 살려, 예배의 방식인지 은사인지에 대한 해석을 열어 둡니다.
    reason: alternative_reading
  - marker: d
    text: ‘영들의 주님’은 1 Enoch에서 굳어진 호칭이므로, 더 일반적인 ‘영들의 주’로 풀지 않았습니다.
    reason: source_note
  - marker: e
    text: 앞의 축복은 ‘그가 복을 받으시기를’로, 뒤의 축복은 ‘그 이름이 복을 받으시기를’로 나뉩니다.
    reason: theological_note
lexical_decisions:
- source_word: ይነሥኡ *አሐደ ቃለ
  english_pob_choice: they shall raise one voice
  chosen_korean: 한 목소리를 높여
  alternatives_korean:
  - 한 소리를 들어
  - 한 목소리로 외쳐
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘목소리/소리’를 높인다는 관용으로 공동체적 합창의 뜻을 자연스럽게 살리되, 단순한 ‘외치다’보다 예배적 울림을 보존했습니다.
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  english_pob_choice: they shall bless and praise and exalt
  chosen_korean: 복을 빌며 찬양하고 높일 것입니다
  alternatives_korean:
  - 축복하며 찬양하고 높일 것입니다
  - 복을 빌고 찬양하고 높일 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 동사를 구분해 옮기되, ‘바르다/찬양하다/높이다’의 누적적 찬양 행위를 한국어 예배 문체로 자연스럽게 재현했습니다.
- source_word: በመንፈሰ ሃይማኖት
  english_pob_choice: in the spirit of faith
  chosen_korean: 믿음의 영 안에서
  alternatives_korean:
  - 신실함의 영 안에서
  - 믿음의 정신으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB가 지적한 ‘spirit of ...’ 반복을 그대로 살리기 위해 ‘영 안에서’ 구조를 유지했고, ሃይማኖት은 기본값인 ‘믿음’으로 옮겼습니다.
- source_word: ቡሩክ ወይትባረክ ስሙ ለእግዚአ መናፍስት
  english_pob_choice: Blessed be he, and blessed be the name of the Lord of Spirits
  chosen_korean: 그가 복을 받으시기를, 그리고 영들의 주님의 이름이 영원무궁하도록 복을 받으시기를
  alternatives_korean:
  - 그가 복되시기를, 그리고 영들의 주님의 이름이 복되시기를
  - 복받으시기를, 그리고 영들의 주님의 이름이 복받으시기를
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문법상 첫 번째는 선언적 축복, 두 번째는 축원형이므로 ‘복을 받으시기를’로 옮겨 구별했고, ‘Lord of Spirits’는 프로젝트의 고유 호칭인 ‘영들의 주님’으로 유지했습니다.
theological_decisions:
- issue: ‘영들의 주님’ 호칭과 축복의 대상 구분
  chosen_reading: 첫 절은 그 자신을 향한 축복, 뒤 절은 그의 이름을 향한 축복으로 구분해 번역했습니다.
  alternative_readings:
  - 이름만을 향한 축복으로 이해
  - 동일 대상을 반복 강조한 한 문장으로 이해
  rationale: 게에즈의 이중 축복 구조와 영어 POB의 해설을 따라, 인격 주체와 이름을 구분해 예배적 긴장을 보존했습니다.
  doctrine_reference: 예배 호칭의 문법적 구분을 유지하는 번역 원칙
- issue: ‘믿음의 영… 선함의 영’의 의미
  chosen_reading: 이 표현들은 예배의 방식과 영역을 드러내는 반복구로 두고, 독립된 존재론적 영들로 확정하지 않았습니다.
  alternative_readings:
  - 천상적 영적 존재들의 목록
  - 특정 은사들의 인격화
  rationale: POB가 남겨 둔 해석상의 긴장을 한국어에서도 그대로 보존해, 본문이 말하는 예배의 성격을 과도하게 체계화하지 않았습니다.
  doctrine_reference: 본문의 해석 여지를 보존하는 원칙
