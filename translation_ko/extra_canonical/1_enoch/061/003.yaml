base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'abundance' may also be understood as 'measure' or 'fullness.'
    reason: lexical_alternative
  - marker: b
    text: The expression rendered 'storehouses' could also be translated 'treasuries' or 'reserves.'
    reason: lexical_alternative
  - marker: c
    text: The verb rendered 'rely on' may also carry the sense 'lean on,' 'be supported by,' or 'trust in.'
    reason: lexical_alternative
  - marker: d
    text: Or 'from the abundance of the righteous and from the storehouses of the righteous, which have come for the righteous'.
    reason: previous_rendering
translation:
  language: ko
  text: 나와 함께 가던 천사가 나에게 말했습니다[a]. 「이것들은 의인들의 측량과 의인들의 줄입니다. 그것들은 의인들에게 와서, 영들의 주님의 이름 위에 그들이 의지하도록 하려는 것이며, 영원무궁하도록 하려는 것입니다」.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘함께 가던’은 에녹을 인도하는 천사라는 반복되는 장면을 살린 표현입니다.
    reason: korean_style_note
lexical_decisions:
- source_word: መልአክ ዘምስሌየ የሐውር
  english_pob_choice: the angel who went with me
  chosen_korean: 나와 함께 가던 천사
  alternatives_korean:
  - 나와 함께 간 천사
  - 나와 함께 걸어가던 천사
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동행하는 안내 천사라는 반복된 에녹서의 장면을 살리면서, 진행형 느낌의 ‘가던’으로 자연스럽게 옮겼습니다.
- source_word: እሙንቱ / እምጣነ ጻድቃን / ወማእሰረ ጻድቃን
  english_pob_choice: these are the measures of the righteous and the cords of the righteous
  chosen_korean: 이것들은 의인들의 측량과 의인들의 줄입니다
  alternatives_korean:
  - 이것들은 의인들의 눈금과 의인들의 줄입니다
  - 이것들은 의인들의 측량선과 의인들의 줄입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수량/측량을 뜻하는 표제를 ‘측량’으로, 이어지는 ‘cords’를 실제 측정용 줄로 이해하여 ‘줄’로 살렸습니다. 61:1-2의 측량 도구 맥락을 반영했습니다.
- source_word: ይመጽኡ ለጻድቃን
  english_pob_choice: they will come to the righteous
  chosen_korean: 그것들은 의인들에게 와서
  alternatives_korean:
  - 그것들은 의인들에게 올 것이며
  - 그것들은 의인들을 위해 올 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 완료가 아니라 미완료/미래의 뉘앙스를 따라 ‘와서’로 연결해 목적절과 자연스럽게 이어지도록 했습니다.
- source_word: ከመ ይትመረጐዙ
  english_pob_choice: so that they may rely on
  chosen_korean: 그들이 의지하도록 하려는 것이며
  alternatives_korean:
  - 그들이 기대도록 하려는 것이며
  - 그들이 기대어 서도록 하려는 것이며
  - 그들이 신뢰하도록 하려는 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 줄/측량 도구가 주는 지지의 이미지를 살리되, 영어 POB가 지적한 ‘lean on / be supported by / trust in’의 긴장을 한국어로 자연스럽게 묶어 ‘의지하다’로 옮겼습니다.
- source_word: ስሙ ለእግዚአ መናፍስት
  english_pob_choice: the name of the Lord of Spirits
  chosen_korean: 영들의 주님의 이름
  alternatives_korean:
  - 영들의 주, 곧 주님의 이름
  - 영들의 주 되시는 분의 이름
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 고유 칭호 ‘Lord of Spirits’를 직역적이면서도 한국어 제목으로 유지했습니다. POB의 ‘Lord of Spirits’ 관용을 따랐습니다.
- source_word: ለዓለመ ዓለም
  english_pob_choice: forever and ever
  chosen_korean: 영원무궁하도록
  alternatives_korean:
  - 영원토록
  - 세세토록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 관용구의 지속성과 장엄함을 현대 한국어 합쇼체 문맥에서 가장 자연스럽게 전달하는 표현으로 처리했습니다.
theological_decisions:
- issue: ‘측량’과 ‘줄’의 관계를 어떻게 이해할지
  chosen_reading: 이 구절은 의인들에게 주어지는 하늘의 측량 도구/규격이 결국 그들이 영들의 주님의 이름 위에 의지하게 하려는 목적을 가진다고 읽었습니다.
  alternative_readings:
  - 의인들이 곧 이 ‘측량’과 ‘줄’의 근원 또는 소유자로 제시된다고 볼 수도 있습니다.
  - ‘의지하다’보다 ‘기대다/지탱되다’의 물리적 뉘앙스를 더 강하게 볼 수도 있습니다.
  rationale: 개정 내역이 지적하듯 핵심 명사는 측량 도구를 가리키며, 목적절은 단순 정보보다 의존과 지지를 강조합니다. 한국어에서는 두 의미를 함께 보존하기 위해 ‘의지하다’를 택했습니다.
  doctrine_reference: 본문 의미의 긴장을 보존하고, 측량 이미지와 신뢰의 목적을 과잉해석하지 않음.
