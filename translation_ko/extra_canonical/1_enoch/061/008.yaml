base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
  footnotes:
  - marker: a
    text: Or 'the Elect One.' The Ge'ez title ኅሩይ can be rendered either way; 'Chosen One' is preferred here for readable modern English.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'the holy ones' may refer to the holy community, heavenly holy beings, or intentionally encompass both; the Ge'ez wording does not require a narrower choice.
    reason: alternative_reading
  - marker: c
    text: Literally evokes weighing in a balance or on scales, a standard image of judicial evaluation.
    reason: cultural_note
  - marker: d
    text: Or 'and their deeds will be weighed in the balance.'.
    reason: previous_rendering
translation:
  language: ko
  text: 영들의 주께서 택하신 이를 영광의 보좌에 앉히셨고, 그분은 하늘 높은 곳의 거룩한 이들[a]의 모든 행위를 심판하시며 그들의 행실을 저울에 달아 보실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘거룩한 이들’은 거룩한 공동체, 천상적 거룩한 존재들, 또는 양자를 포괄할 수 있습니다. 본문의 표현은 어느 하나로 한정하지 않습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: እግዚአ መናፍስት
  english_pob_choice: the Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 고유한 천상 칭호로서 위엄과 통치성을 살리기 위해 ‘주’를 택했고, 한국어에서는 ‘만군의 주’가 유사한 장엄한 신적 칭호의 울림을 가장 잘 전달합니다.
- source_word: መንበረ ስብሐት
  english_pob_choice: the throne of glory
  chosen_korean: 영광의 보좌
  alternatives_korean:
  - 영광의 왕좌
  - 영광스러운 보좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하늘 왕좌 이미지가 핵심이므로 직역에 가까운 ‘영광의 보좌’로 옮겨, 지위와 찬란함을 함께 유지했습니다.
- source_word: ለኅሩይ
  english_pob_choice: the Chosen One
  chosen_korean: 택하신 이
  alternatives_korean:
  - 선택받은 이
  - 택자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 특정한 호칭이지만 한국어에서는 ‘택하신 이’가 자연스럽고, 인물의 선별·임명된 신분을 분명히 드러냅니다.
- source_word: ይኴንን
  english_pob_choice: he will judge
  chosen_korean: 심판하시고
  alternatives_korean:
  - 판단하시고
  - 재판하시고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 법정적 판결 행위를 뜻하므로 ‘심판하다’가 가장 적절하며, 이어지는 저울 이미지와도 잘 맞습니다.
- source_word: ለቅዱሳን
  english_pob_choice: the holy ones
  chosen_korean: 성도들의
  alternatives_korean:
  - 거룩한 이들의
  - 거룩한 자들의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서 문맥에서 공동체적·천상적 의미가 열려 있으므로, 신약 한국어 관용과도 접점이 있는 ‘성도들’을 택하되 그 범위를 과도하게 좁히지 않도록 했습니다.
- source_word: በመዳልው
  english_pob_choice: in the balance
  chosen_korean: 저울로
  alternatives_korean:
  - 천칭으로
  - 저울판 위에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 판정의 비유를 한국어로 자연스럽게 살리기 위해 ‘저울로 달아보다’의 관용을 사용했습니다.
theological_decisions:
- issue: ‘the holy ones’의 범위
  chosen_reading: 성도들로 옮기되, 이들이 지상 공동체인지 천상 존재인지 한정하지 않았습니다.
  alternative_readings:
  - 거룩한 이들
  - 천사들
  rationale: 본문은 대상의 범위를 명시적으로 좁히지 않으므로, 의미적 긴장을 보존하면서도 한국어 독자가 이해하기 쉬운 표현을 택했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: ‘he will judge’와 ‘weigh’의 관계
  chosen_reading: ‘심판하시고… 저울로 달아보십니다’로 두 동사를 분리했습니다.
  alternative_readings:
  - 심판하시며… 달아보십니다
  - 심판하시고… 달아보실 것입니다
  rationale: 원문은 판결과 계량적 평가를 함께 제시하므로, 심판 행위와 저울질 이미지를 나누어 번역해 사법적 긴장을 선명하게 유지했습니다.
  doctrine_reference: Maintain the source’s forensic imagery without smoothing it into a single abstract idea.
