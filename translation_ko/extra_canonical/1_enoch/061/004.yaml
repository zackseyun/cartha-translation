base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
  footnotes:
  - marker: a
    text: The opening may more fully mean, 'the chosen ones shall rest and dwell with the chosen ones'; the Ge'ez uses two closely related verbs.
    reason: lexical_alternative
  - marker: b
    text: Or 'for faithfulness' or 'for steadfastness' instead of 'for faith.'
    reason: lexical_alternative
  - marker: c
    text: '''Measures'' may mean measured portions, allotted shares, or standards; the exact nuance is uncertain in this line.'
    reason: textual_variant
  - marker: d
    text: Or 'And the chosen ones shall rest with the chosen ones, and those are the measures'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 선택된 자들은 선택된 자들과 함께 머물고 거주할 것입니다[a]. 이것들은 믿음을 위해[d] 주어질 분량들이며[b][c], 의를 굳게 할 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 첫 동사의 정확한 뜻은 확실하지 않습니다. ‘쉬다’, ‘정착하다’, 또는 ‘시작하다’로 이해되기도 합니다. 여기서는 뒤따르는 ‘거주하다’와 함께 두 동사를 반영했습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘분량들’은 재어진 몫, 할당된 분량, 또는 기준을 뜻할 수 있으며, 정확한 뉘앙스는 문맥상 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: c
    text: 이 구절의 게즈어는 ‘주어질 것이다’라는 수동형의 공적 선포 어조를 유지합니다.
    reason: source_note
  - marker: d
    text: ‘믿음’은 여기서 ‘신실함’ 또는 ‘충실함’으로도 옮길 수 있습니다.
    reason: lexical_alternative
