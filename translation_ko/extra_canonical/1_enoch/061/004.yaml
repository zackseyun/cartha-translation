theological_decisions:
- issue: 믿음/신실함의 의미 범위
  chosen_reading: 본문에는 ‘믿음’을 두되, 한국어 표현은 ‘믿음을 위해’로 유지했습니다.
  alternative_readings:
  - 신실함
  - 충실함
  rationale: 게즈어 ሃይማኖት은 의미 범위가 넓지만, 본문은 그 긴장을 해소하지 않고 기본 의미를 보존하는 편이 적절합니다. 따라서 본문은 ‘믿음’으로 두고, 대안 의미는 각주로 남깁니다.
  doctrine_reference: Translation philosophy § Preserve theological tension rather than resolve it.
- issue: 의를 ‘강하게/굳게’ 하는 표현
  chosen_reading: ‘의를 굳게 할 것입니다’
  alternative_readings:
  - 의를 세울 것입니다
  - 의를 확립할 것입니다
  - 의를 강하게 할 것입니다
  rationale: 원문의 능동적 강화 의미를 살리면서도 ‘의’를 추상적 명제보다 공동체적 실제로 느끼게 하기 위해 ‘굳게 하다’를 택했습니다.
  doctrine_reference: Lexical principle § Preserve the source's force without over-domesticating the image.
