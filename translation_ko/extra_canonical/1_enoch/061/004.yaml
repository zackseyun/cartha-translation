  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기본값인 ‘믿음’을 따르되, 문맥상 ‘신실함/충실함’ 가능성도 열려 있으므로 한국어에서는 목적의미를 드러내는 ‘믿음을 위해’로 옮겼습니다.
