base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
  footnotes:
  - marker: a
    text: Or “companies,” “groups,” or “assemblies” for “bands.” The Ge'ez refers to gathered collectives, but their precise characterization is not explicit in this verse alone.
    reason: lexical_alternative
  - marker: b
    text: The final clause may also mean “so that they may be apportioned” or “so that their measure may be determined.” Because this section is effectively preserved only in Ge'ez for this workflow, the more concrete wording “be measured” is retained.
    reason: alternative_reading
  - marker: c
    text: Or '“Why have those bands risen and gone?” And he said to me, “They have gone so that they may be measured.”'.
    reason: previous_rendering
translation:
  language: ko
  text: 저는 천사에게 이렇게 물었습니다. “그들은 왜 이 줄들을 가져가 떠났습니까?” 그러자 그가 제게 말했습니다. “그들은 측량하려고 갔습니다.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “그들이 나누어 주려고 갔습니다” 또는 “그들의 몫을 정하려고 갔습니다”로 이해할 수도 있습니다. 이 대목은 게즈어 전승에 의존하므로, 본문에서는 더 구체적인 뜻인 ‘측량하다’를 유지합니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ተስአልክዎ / asked
  english_pob_choice: I asked
  chosen_korean: 제가 물었습니다
  alternatives_korean:
  - 제가 질문했습니다
  - 제가 물어보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 청자가 듣는 즉시 이해할 수 있는 자연스러운 서술로, 질문을 직접적으로 제시하는 동사로 옮겼습니다.
- source_word: መላእክ / the angel
  english_pob_choice: the angel
  chosen_korean: 천사에게
  alternatives_korean:
  - 메신저에게
  - 천사한테
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥은 환상 속 해석자이므로 ‘천사’가 가장 직접적이고 문맥에 맞습니다.
- source_word: እሎንቱ አኅበለ / those cords
  english_pob_choice: these cords
  chosen_korean: 이 줄들을
  alternatives_korean:
  - 이 끈들을
  - 이 밧줄들을
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문과 영어 POB가 가리키는 것은 집단이 아니라 끈/줄이며, 한국어에서는 ‘줄’이 가장 무난하게 이미지와 기능을 살립니다.
- source_word: ከመ ይመጥኑ / so that they may measure
  english_pob_choice: so that they may measure
  chosen_korean: 측량하기 위해
  alternatives_korean:
  - 재기 위해
  - 재어 보기 위해
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동사의 구체적 의미를 살려 ‘측량하다’로 옮기면 도구성과 목적이 분명해집니다.
theological_decisions:
- issue: ‘be measured’가 아니라 ‘measure’로 이해되는 목적절
  chosen_reading: 그들은 측량하기 위해 갔습니다
  alternative_readings:
  - 그들은 측량되기 위해 갔습니다
  - 그들은 분배받기 위해 갔습니다
  rationale: 게즈 원문과 최신 교정에 따라 목적은 수동적 ‘측량됨’이 아니라 능동적 ‘측량함’입니다. 따라서 본문이 말하는 행위의 방향을 바꾸지 않고 유지했습니다.
  doctrine_reference: 원문이 지시하는 행위 주체와 목적을 보존해야 하며, 해석을 과도하게 신학화하지 않습니다.
