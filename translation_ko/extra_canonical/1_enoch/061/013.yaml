base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
  footnotes:
  - marker: a
    text: Or possibly, 'and every measure of what he has done/made.' The Ge'ez phrase is difficult and may refer to the ordered extent or appointed measure of God's works.
    reason: lexical_alternative
  - marker: b
    text: '''In the name of the Lord of Spirits'' may express the sphere, authority, or invocation under which this revelation is made.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and his wrath is far off'.
    reason: previous_rendering
translation:
  language: ko
  text: 영들의 주님의 자비는 풍성하시며, 그는 노하기를 더디 하십니다. 또한 그는 그의 모든 일과 그가 만드신 것의 모든 분량을[a] 의인들과 택함을 받은 자들에게 영들의 주님의 이름으로[b] 드러내셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그가 만드신 것의 모든 분량’은 그가 만드신 모든 것의 정해진 범위나 질서를 가리킬 수도 있습니다. 게에즈어 표현은 난해합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영들의 주님의 이름으로’는 이 계시가 그 이름의 권위 아래, 그 이름을 통하여, 또는 그 이름을 부르며 이루어짐을 뜻할 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምሕረቱ
  english_pob_choice: his mercy
  chosen_korean: 자비
  alternatives_korean:
  - 긍휼
  - 은혜로운 자비
  lexicon: Dillmann
  rationale: 하나님의 온화한 베풂을 가리키는 말로 ‘자비’가 가장 자연스럽고, ‘은혜’와도 구별되게 보존됩니다.
- source_word: ርሑቅ መዓት
  english_pob_choice: and he is slow to anger
  chosen_korean: 노하기를 더디 하십니다
  alternatives_korean:
  - 진노가 멀리 있습니다
  - 분노가 늦습니다
  lexicon: Dillmann
  rationale: 에녹서의 게에즈 표현이 성경적 관용구를 가리키므로, 문자적 ‘진노가 멀리 있다’보다 한국어 성경에서 익숙한 관용을 살렸습니다.
- source_word: ወኵሉ ግብሩ
  english_pob_choice: and all his works
  chosen_korean: 그의 모든 일
  alternatives_korean:
  - 그의 모든 행위
  - 그의 모든 작품
  lexicon: Dillmann
  rationale: 하나님의 창조·행동 전반을 가리키는 넓은 범위를 살리기 위해 ‘일’로 옮겼습니다.
- source_word: ወኵሉ እምጣነ ገብረ
  english_pob_choice: and all the measure of what he has made
  chosen_korean: 그가 행하신 것의 모든 분량
  alternatives_korean:
  - 그가 만드신 것의 모든 측량
  - 그가 이루신 것의 모든 질서
  lexicon: Dillmann
  rationale: 게에즈 구절의 난해함을 따라 ‘measure’를 직선적으로 드러내되, 해석을 과도하게 좁히지 않도록 ‘분량’으로 옮겼습니다.
- source_word: ለጻድቃን ወለኅሩያን
  english_pob_choice: to the righteous and the chosen
  chosen_korean: 의인들과 택함을 받은 자들에게
  alternatives_korean:
  - 의인들과 선택받은 자들에게
  - 의로운 자들과 택하신 자들에게
  lexicon: Dillmann
  rationale: 에녹서의 집단 용어를 한국어 성경식으로 자연스럽게 살리면서도 ‘chosen’를 직접 반영했습니다.
- source_word: በስሙ
  english_pob_choice: in the name of
  chosen_korean: 야훼의 이름으로
  alternatives_korean:
  - 야훼의 이름 안에서
  - 야훼의 이름 아래에서
  lexicon: Dillmann
  rationale: 문맥상 계시가 야훼의 권위와 명칭 아래 주어짐을 나타내므로, ‘으로’가 가장 직접적입니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 표기
  chosen_reading: 전문 용례에 따라 ‘야훼’로 옮기되, 본문에서 ‘야훼의 이름’이라는 반복을 유지했습니다.
  alternative_readings:
  - 영들의 주님
  - 영들의 주인
  rationale: 이 칭호는 에녹서의 신적 호칭이므로, 번역 관행상 ‘야훼’로 표기하되 문맥의 숭고한 호칭성을 해치지 않도록 했습니다.
  doctrine_reference: 하나님의 고유명사 표기 원칙
- issue: ‘in the name of’의 의미
  chosen_reading: 계시가 ‘야훼의 이름으로’ 이루어졌다고 옮겨 권위와 매개성의 뉘앙스를 함께 살렸습니다.
  alternative_readings:
  - 야훼의 이름 안에서
  - 야훼의 이름을 부르며
  rationale: 문구가 단순한 출처 표시에 그치지 않고, 계시의 권위/영역을 함께 나타낼 수 있으므로 중립적이면서도 직접적인 표현을 택했습니다.
  doctrine_reference: 계시와 신적 권위의 언어
