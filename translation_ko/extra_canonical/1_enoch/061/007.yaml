  - severity: low
    issue: ‘지혜 가운데서’는 가능하지만 이 병렬 찬양 동사에 붙을 때 ‘지혜로’가 더 자연스럽습니다.
    rationale: 수단·방식을 나타내는 በጥበብ을 간결하게 반영하면서 한국어 문장의 흐름을 개선합니다.
