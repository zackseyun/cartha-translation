  source_fidelity: 첫 절은 ወለዉእቱ መቅድመ ቃለ를 ‘그에게는 첫 말이 있습니다’로 이해하여, ‘그 앞에서/음성으로’라는 이전의 구문 오독은 피했습니다. 다만 마지막 ይጠብቡ는 ‘지혜롭게 할 것입니다’가 아니라 자동사적으로 ‘지혜로울 것입니다’ 또는 ‘지혜롭게 행동할 것입니다’로 옮겨야 합니다. በነገር과 መንፈሰ ሕይወት의 병렬도 유지하였습니다.
  naturalness: 초안의 ‘말과 생명의 영 안에서 지혜롭게 할 것입니다’는 목적어가 없는 타동사 ‘지혜롭게 하다’를 사용하여 문법적으로 부자연스럽습니다. ‘말과 생명의 영에 있어서 지혜로울 것입니다’로 고치면 현대 표준어 합쇼체에서 자연스럽고, 원문의 영역을 나타내는 전치사구도 보존됩니다. ‘지혜 가운데서’보다 ‘지혜로’가 이 문맥에서는 더 간결하고 자연스럽습니다.
  terminology: ‘첫 말’은 መቅድመ ቃለ의 귀속 구문을 보존합니다. ‘송축하다’는 예배·찬양 문맥에서 ይባርኩ를 자연스럽게 옮기며, ‘생명의 영’은 spirit/breath의 의미 긴장을 과도하게 해소하지 않습니다. 각주에서는 ‘생명의 숨’과 ‘지혜롭게 행동하다’를 대안으로 남깁니다.
