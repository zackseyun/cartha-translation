base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
  footnotes:
  - marker: a
    text: Or 'with a voice'; the Ge'ez ቃለ can denote 'voice,' 'word,' or 'speech.'
    reason: lexical_alternative
  - marker: b
    text: Or 'they shall act wisely in word and in the breath of life.' The final phrase is difficult in this Ge'ez-only section of the Parables.
    reason: alternative_reading
  - marker: c
    text: Or 'And before him they shall bless with the voice, and they shall exalt'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 첫 말은 그에게 속합니다[a]. 그들은 지혜로[b] 송축하고 높이며 찬양할 것이며, 말과 생명의 영에 있어서 지혜로울 것입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘말의 시작’. 게에즈 ቃለ는 ‘말’, ‘음성’, 또는 ‘언설’을 뜻할 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘지혜 가운데서’.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘말과 생명의 숨에 있어서 지혜롭게 행동할 것입니다’. 이 마지막 구절은 파라볼라 부분의 게에즈 본문에서 해석이 어려운 표현입니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ወለዉእቱ መቅድመ ቃለ
  english_pob_choice: And to him belongs the first word
  chosen_korean: 그에게는 첫 말이 있습니다
  alternatives_korean:
  - 그에게는 말의 첫째가 있습니다
  - 그에게는 첫 말씀이 있습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문구를 ‘before him’으로 읽지 않고 ‘그에게는’으로 옮겨, 소스가 말하는 소유/귀속 관계를 살렸습니다. መቅድመ ቃለ는 ‘첫 말/첫 언표’의 의미를 살려 자연스러운 한국어로 옮겼습니다.
- source_word: ይባርኩ ወያሌዕሉ ወይሴብሑ
  english_pob_choice: they shall bless and exalt and praise
  chosen_korean: 복을 빌고 높이며 찬양하고
  alternatives_korean:
  - 축복하고 높이며 찬양하고
  - 복 주며 높이며 찬양하고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 동사의 병렬을 살리되, 예배적·찬양적 어조가 드러나도록 ‘복을 빌다 / 높이다 / 찬양하다’로 옮겼습니다.
- source_word: በጥበብ
  english_pob_choice: with wisdom
  chosen_korean: 지혜 가운데서
  alternatives_korean:
  - 지혜로
  - 지혜로써
  - 지혜 안에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 전치사구의 형식을 유지하면서도 한국어에서 가장 자연스럽게 지혜의 영역/방식을 드러내는 표현으로 옮겼습니다.
- source_word: በነገር
  english_pob_choice: in speech
  chosen_korean: 말
  alternatives_korean:
  - 말씀
  - 언어
  - 발언
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ቃለ를 ‘첫 말’로 살렸으므로, 뒤의 በነገር은 같은 뉘앙스로 중복시키지 않고 ‘말’로 간결하게 옮겨 말/언설의 영역을 나타냈습니다.
- source_word: መንፈሰ ሕይወት
  english_pob_choice: the spirit of life
  chosen_korean: 생명의 영
  alternatives_korean:
  - 생명의 숨
  - 생명 주는 영
  - 생명령
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 영적·종말론적 문맥을 보존하면서도 한국어에서 자연스러운 결합인 ‘생명의 영’을 택해, 본문이 가진 생명-영의 긴장을 그대로 두었습니다.
theological_decisions:
- issue: መንፈሰ ሕይወት을 ‘숨’으로 구체화할지, ‘영’으로 유지할지
  chosen_reading: 생명의 영
  alternative_readings:
  - 생명의 숨
  - 생명 주는 영
  rationale: 천상 찬양의 문맥에서는 단순한 생물학적 호흡보다 영적 실재를 가리킬 가능성이 크므로, 그 긴장을 해소하지 않고 ‘영’으로 보존했습니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
- issue: 개정 내역이 지적한 መቅድመ ቃለ의 구문 오독을 어떻게 반영할지
  chosen_reading: ‘그에게는’과 ‘첫 말’로 귀속 관계를 분명히 함
  alternative_readings:
  - 그 앞에서
  - 그에게서
  rationale: 소스는 전치사적 ‘before him’이 아니라 귀속 구조이므로, 한국어에서도 주어-소유 관계가 드러나도록 번역했습니다.
  doctrine_reference: Source syntax and audit trail alignment.
