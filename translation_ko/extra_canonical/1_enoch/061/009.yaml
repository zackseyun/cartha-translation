    rationale: ‘그들을 의의 길에 세우실 때’라는 대안은 አሰረ ዚአሆሙ를 동사로 처리한 이전 독법입니다. 현재 확정된 분석에서는 ‘그들의 걸음들’이라는 명사구가 앞의 ‘숨은 길들’과 병렬을 이루므로, 이 대안 각주는 삭제해야 합니다.
