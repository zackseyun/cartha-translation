    issue: ‘Lord of Spirits’를 ‘만군의 주’로 번역함
    rationale: ‘만군’은 군대·천상 군대(hosts)를 뜻하는 관용 신칭이며, መናፍስት(spirits)의 의미를 보존하지 못합니다. 원문의 독특한 호칭은 ‘영들의 주’가 적절합니다.
