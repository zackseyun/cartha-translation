  verdict: revise
  source_fidelity: ‘Lord of Spirits’(እግዚአ መናፍስት)는 ‘만군의 주’가 아니라 ‘영들의 주’로 옮겨야 합니다. ‘만군’은 통상 ‘hosts’를 뜻하여 원문의 ‘spirits’를 다른 신칭으로 바꿉니다. 또한 አሰረ ዚአሆሙ는 ‘그들을 세우다’가 아니라 ‘그들의 걸음들/발자취’를 가리키며, 심판의 병렬 대상이라는 최근의 원문 재검토를 본문과 주석에 일관되게 반영해야 합니다.
  naturalness: 현 초안의 ‘말씀으로, 또 … 길로 심판하실 때’는 조사와 병렬 관계가 다소 불안정합니다. 두 심판 대상을 각각 제시하고, 후반 찬양 동사들은 ‘말하여’로 연결하면 현대 한국어의 격식 있는 문체에서 더 자연스럽습니다. ‘이름을 복 주고’는 한국어에서 목적어 관계가 어색하므로 ‘이름을 복되다 하고’로 고쳤습니다.
  terminology: 1에녹의 특징적 신칭은 ‘영들의 주’로 일관되게 보존합니다. ‘의’와 ‘거룩하게 하다’는 원문의 윤리적·예전적 어휘를 유지합니다. ‘이름의 말씀’은 난해한 원문 구조를 성급히 해석하지 않기 위해 유지합니다.
  issues:
