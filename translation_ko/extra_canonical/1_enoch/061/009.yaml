base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
  footnotes:
  - marker: a
    text: 'Or ''their secret ways.'' The image is moral and judicial: their courses of life, though hidden, are exposed to judgment.'
    reason: lexical_alternative
  - marker: b
    text: The Ge'ez phrase rendered 'by the word of the name of the Lord of Spirits' is difficult. It may mean by the utterance, authority, or command associated with the divine name.
    reason: alternative_reading
  - marker: c
    text: The verb rendered 'he sets them' is uncertain in this line as transmitted by the Ethiopic witness; the sense appears to be that they are established or directed onto the path of righteousness.
    reason: textual_variant
  - marker: d
    text: Or 'and he sets them on the path of righteousness'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그가 얼굴을 들어 영들의 주의 이름의 말씀으로 그들의 숨은 길들을[a], 영들의 주의 의의 길로 그들의 걸음들을[c] 심판하실 때에, 그들 모두는 한 목소리로 말하여 영들의 주의 이름을 복되다 하고, 찬양하고, 높이고, 거룩하게 할 것입니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 숨겨진 행로들’로 옮길 수 있습니다. ‘길들’은 심판의 문맥에서 감추어진 도덕적·행위적 행로를 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영들의 주의 이름의 말씀으로’는 원문의 다소 난해한 구조를 가깝게 옮긴 것입니다. 이는 그 이름과 관련된 말씀, 권위 또는 명령을 뜻할 수 있습니다.
    reason: source_note
  - marker: c
    text: ‘그들의 걸음들’은 ‘그들의 숨은 길들’과 병렬을 이루는 심판의 대상입니다. 이를 ‘그들을 의의 길에 세우다’라는 동사구로 읽는 해석도 있었으나, 여기서는 명사구로 이해합니다.
    reason: textual_variant
lexical_decisions:
- source_word: ያሌዕል ገጾ
  english_pob_choice: he lifts up his face
  chosen_korean: 그가 얼굴을 들어
  alternatives_korean:
  - 그가 얼굴을 높이 들어
  - 그가 얼굴을 들어 올려
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역적 이미지를 살리면서도 한국어에서 자연스럽고 공적인 문체로 옮겼습니다.
- source_word: ፍኖቶሙ እንተ ኅቡእ
  english_pob_choice: their hidden paths
  chosen_korean: 그들의 숨은 길들
  alternatives_korean:
  - 그들의 숨겨진 길들
  - 그들의 비밀한 길들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 윤리적·심판적 문맥의 ‘길/행로’ 이미지를 유지하고, ‘hidden’을 과장 없이 ‘숨은’으로 옮겼습니다.
- source_word: አሰረ ዚአሆሙ
  english_pob_choice: their steps
  chosen_korean: 그들의 걸음들
  alternatives_korean:
  - 그들의 발걸음들
  - 그들의 행실
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 ‘걸음/발자취’ 계열이 가장 가깝고, 앞절의 ‘길들’과 평행을 이루도록 했습니다.
- source_word: በነገረ ስሙ ለእግዚአ መናፍስት
  english_pob_choice: by the word of the name of the Lord of Spirits
  chosen_korean: 만군의 주의 이름의 말씀으로
  alternatives_korean:
  - 만군의 주의 이름의 말로
  - 만군의 주의 이름에 속한 말씀으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘word of the name’의 낯선 구조를 과도하게 매끄럽게 만들지 않고, 이름에 수반된 권위의 매개를 드러내는 표현을 택했습니다.
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  english_pob_choice: they will bless and praise and exalt and sanctify
  chosen_korean: 복 주고, 찬양하고, 높이고, 거룩하게 할 것입니다
  alternatives_korean:
  - 축복하고, 찬양하고, 높이고, 성별할 것입니다
  - 복을 빌고, 찬양하고, 높이고, 거룩하게 할 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 네 동사의 연속을 그대로 유지하되, 마지막 동사는 cultic force를 살려 ‘거룩하게 하다’로 옮겼습니다.
- source_word: እግዚአ መናፍስት
  english_pob_choice: Lord of Spirits
  chosen_korean: 만군의 주
  alternatives_korean:
  - 영들의 주
  - 영들 위에 계신 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 1에녹의 고유한 신칭을 한국어에서 자연스럽게 전달하기 위해 전통적 용례에 가까운 ‘만군의 주’를 택하되, 본문 전체의 반복성을 살렸습니다.
theological_decisions:
- issue: ‘Lord of Spirits’의 한국어 신칭 처리
  chosen_reading: 본문에서는 자연스러운 신칭으로 ‘만군의 주’를 사용했습니다.
  alternative_readings:
  - 영들의 주
  - 영들 위에 계신 주
  - 만군의 하나님
  rationale: 1에녹의 반복되는 호칭을 한국어에서 예배적·문학적으로 읽히게 하되, 과도한 설명을 피했습니다. 다만 직역 가능성은 lexical_decisions에 남겨 두었습니다.
  doctrine_reference: 고유 신칭은 문맥상 안정된 한국어 관용을 우선하되, 원문 구조를 가리지 않아야 합니다.
- issue: 문장 속 주어의 지시
  chosen_reading: ‘그가’로 단수 주어를 유지하되, 본문 안에서 인물을 특정하지 않았습니다.
  alternative_readings:
  - 만군의 주께서
  - 선택된 이가
  - 인자가
  rationale: 게즈어가 단수 동사를 쓰지만 지시 대상이 이 구절만으로 완전히 확정되지 않으므로, 본문은 모호성을 유지했습니다.
  doctrine_reference: 불확실한 지시대상은 본문에서 단정하지 않고 보존합니다.
