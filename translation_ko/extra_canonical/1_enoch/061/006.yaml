  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
  footnotes:
  - marker: a
    text: The Ethiopic text in the latter half of the verse is difficult in this witness. The phrase rendered 'the strength and the voice of the light' may also be understood with 'brightness/radiance' instead of 'light.'
    reason: textual_variant
  - marker: b
    text: Or 'all who were in the height of heaven.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And they received the command—all those in the highest heaven—and the strength and the voice of the light were like fire.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 하늘의 높은 곳에 있는 모든 이가 명령과 능력과 음성과 불 같은 빛을 받았습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 “하늘의 높은 곳에 있는 모든 이”로도 옮길 수 있습니다.
    reason: alternative_reading
  - marker: b
    text: 원문의 병렬 구조상 ‘명령과 능력과 음성과 빛’이 모두 함께 받았다는 뜻으로 읽을 수 있습니다.
    reason: source_note
  - marker: c
    text: ‘불 같은’은 직역에 가까운 비유 표현입니다.
    reason: korean_style_note
