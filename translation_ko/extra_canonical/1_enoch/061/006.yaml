translation:
  language: ko
  text: 그리고 하늘 높은 곳에 있는 모든 이가 명령과 능력과 음성과 불 같은 빛을 받았습니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 후반부는 “그들이 명령을 받았고—하늘 높은 곳에 있는 모든 이가—그 능력과 빛의 음성은 불과 같았다”로도 이해할 수 있습니다.
    reason: textual_variant
