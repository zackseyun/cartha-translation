theological_decisions:
- issue: '''하늘의 높은 곳''의 대상 범위'
  chosen_reading: 특정한 천사 계급으로 좁히지 않고, 하늘의 높은 곳에 있는 모든 존재를 포괄적으로 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 특정 천사적 질서
  - 하늘의 군대 전체
  rationale: 원문은 대상을 명시하지 않으므로, 후대 체계화를 덧씌우지 않고 범위를 넓게 두는 편이 본문 충실도에 더 가깝습니다.
  doctrine_reference: 본문의 범위를 해석적으로 확정하지 않고 긴장을 보존합니다.
