  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 문맥에서 ኅሩይ는 제목화된 칭호로 기능하지만, 한국어에서는 과도한 신학적 선이입을 피하기 위해 최소한의 제목성을 가진 ‘선택된 이’로 옮겼습니다.
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  english_pob_choice: that are on the dry land and over the water
  chosen_korean: 마른 땅과 물 위에 있는
  alternatives_korean:
  - 마른 땅 위에 있고 물 위에 있는
  - 육지와 물 위에 있는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: የብስ는 단순한 ‘땅’보다 ‘마른 땅’이 더 정확하며, 물과 대비되는 우주적 영역 구분을 살렸습니다.
theological_decisions:
