  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서 ኃይል은 추상적 ‘능력’보다 천상 존재들의 집합을 가리키는 ‘군대’가 문맥상 더 적합합니다.
- source_word: ኪሩቤን, ሱራፌን, እፋኒን
  english_pob_choice: Keruben, Seraphen, and the Ophannin
  chosen_korean: 케루벤, 세라펜, 오파닌
  alternatives_korean:
  - 케루빔, 세라핌, 오파님
  - 그룹, 스랍, 바퀴들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기즈어 증언을 따라 음역을 유지해 이 본문 특유의 천상 질서 명칭을 보존했습니다. 전통 교회 용어로 평준화하지 않았습니다.
- source_word: መላእክተ አጋእዝት
  english_pob_choice: angels of principalities
  chosen_korean: 통치들의 천사들
  alternatives_korean:
  - 주권들의 천사들
  - 권세들의 천사들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: א가에즈트 계열의 지배·통치 질서를 한국어로 가장 직접적으로 드러내면서도, ‘천사들’이라는 병렬 구조를 유지했습니다.
- source_word: ኅሩይ
  english_pob_choice: the Chosen One
  chosen_korean: 선택된 이
  alternatives_korean:
