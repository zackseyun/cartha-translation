  chosen_reading: 케루벤, 세라펜, 오파닌처럼 기즈어 친화적 음역을 유지했습니다.
  alternative_readings:
  - 그룹, 스랍, 바퀴들
  - 케루빔, 세라핌, 오파님
  rationale: 이 절은 후대 정통 성서어휘보다 1 Enoch의 천상 질서 목록 자체를 보여 주는 본문이므로, 독자가 이 전승의 낯섦과 특수성을 그대로 접하도록 했습니다.
  doctrine_reference: 본문 고유의 천사론적 목록을 평준화하지 않고 보존
