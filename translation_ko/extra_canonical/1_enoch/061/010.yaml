base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
  footnotes:
  - marker: a
    text: Or 'shall cry out' or 'shall call aloud'; the Ge'ez verb denotes a vocal outcry.
    reason: lexical_alternative
  - marker: b
    text: '''Ophannin'' is a transliterated name for a heavenly order; some would gloss it as ''wheels'' from throne-vision imagery.'
    reason: lexical_alternative
  - marker: c
    text: '''Angels of principalities'' reflects a term for ruling orders or ranks; ''dominions'' is another possible rendering.'
    reason: lexical_alternative
  - marker: d
    text: Or 'And all the hosts of the heavens, and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One, and the other powers that are on the earth and over the water, shall raise their voice.'.
    reason: previous_rendering
translation:
  language: ko
  text: 하늘의 모든 군대와 높은 곳에 있는 모든 거룩한 이들과 주님의 군대, 곧 케루벤과 세라펜과 오파닌[b]과 모든 권능의 천사들과 모든 통치권의 천사들[c]과 선택된 이[d]와 마른 땅과 물 위에 있는 다른 모든 권세들이 외칠 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘외칠 것입니다’는 기즈어 동사가 공적으로 소리 내어 외치거나 부르짖는다는 뜻을 지님을 반영합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘오파닌’은 천상 질서의 명칭을 음역한 것입니다. 일부는 이를 왕좌 환상 전승과 관련하여 ‘바퀴들’로 풀이합니다.
    reason: lexical_alternative
  - marker: c
    text: ‘통치권의 천사들’은 지배하거나 다스리는 천상 질서 또는 등급을 가리킵니다. ‘주권들의 천사들’ 또는 ‘통치 세력의 천사들’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: d
    text: ‘선택된 이’는 이 문맥에서 칭호처럼 기능하는 표현을 옮긴 것입니다. ‘택함받은 이’로도 번역할 수 있습니다.
    reason: lexical_alternative
