  naturalness: ‘나무들이 아몬드나무처럼 가득하고 튼튼했습니다’에서 ‘가득하다’는 나무 자체의 상태를 서술할 때 다소 부자연스럽고 무엇으로 가득한지 불분명합니다. ‘아몬드나무처럼 무성하고 튼튼했습니다’가 현대 표준어 합쇼체에서 자연스럽습니다.
  terminology: ‘산’, ‘나무’, ‘아몬드나무’, ‘튼튼하다’는 문맥과 현대 한국어에 적절합니다. 원문의 비교 범위를 불필요하게 좁히지 않도록 ‘아몬드나무처럼’은 ‘무성하고 튼튼한’ 상태 전체를 수식하게 두었습니다.
