base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/002.yaml
  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
  footnotes:
  - marker: a
    text: The Ge'ez text is difficult in the middle of the verse. The clause rendered 'I perceived fragrant plants' may reflect aromatic or pleasing vegetation; a more literal but less clear rendering would be 'and those trees/plants were full ...'
    reason: textual_variant
  - marker: b
    text: '''Like carob'' preserves a probable botanical comparison in the Ge''ez. The exact point of comparison may be the species itself, its pods, or its form.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and I perceived fragrant plants, full and strong, like carob.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 산 위에서 나는 또 다른 산을 보았습니다. 그 안에는 나무들이 있었습니다. 그 나무들은 아몬드나무처럼 무성하고 튼튼했습니다.
  philosophy: optimal-equivalence
