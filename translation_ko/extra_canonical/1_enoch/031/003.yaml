translation:
  language: ko
  text: 그리고 그 열매를 짓이기면, 그것은 모든 향기보다 더 좋습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 말미의 표현은 OCR 전승상 다소 불확실합니다. 남아 있는 게에즈는 열매를 모든 향기와 비교하는 뜻으로 읽히며, ‘모든 향수보다’로도 옮길 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 이 절은 열매의 일반적 품질보다 그 향기로운 성질을 말하는 것으로 이해할 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 열매를 들어 올렸을 때, 그것은 모든 향기보다 더 좋습니다’로도 옮길 수 있습니다.
    reason: previous_rendering
