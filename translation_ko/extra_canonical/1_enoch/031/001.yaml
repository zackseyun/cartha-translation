base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
  footnotes:
  - marker: a
    text: The botanical identification of serera is uncertain; the Ge'ez appears to preserve the name of an aromatic substance rather than a common descriptive noun.
    reason: lexical_alternative
  - marker: b
    text: Galbanum is an aromatic resin known from ancient incense traditions; the underlying Ge'ez term may also be left transliterated as kelbene.
    reason: cultural_note
  - marker: c
    text: Or 'another mountain, in which'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 다른 산들[a]을 보았습니다. 그 안에는 나무들이 있었고, 거기에서 꿀같은 것[c][b]이 나왔는데, 그 이름은 세레라와 갈반눔이었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 본문은 ‘다른 산들’의 복수형을 가리킵니다.
    reason: source_note
  - marker: b
    text: ‘갈반눔’은 고대 향료인 갈바눔을 가리킬 가능성이 높지만, 본문의 게에즈 표기는 음역으로 남길 여지도 있습니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그 안에서’.
    reason: previous_rendering
