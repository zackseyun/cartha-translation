  - 얼음
  - 서리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기묘하고 투명하게 빛나는 물질 이미지를 한국어 성경 문맥에서 가장 간결하게 살릴 수 있는 표현은 ‘수정’입니다. 다만 원뜻의 투명성과 광휘를 함께 염두에 둔 선택입니다.
- source_word: ክበቡ
  english_pob_choice: its wheels
  chosen_korean: 그 둘레
  alternatives_korean:
  - 그 바퀴들
  - 그 원둘레
  - 그 테두리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 본래 ‘바퀴들’로 이해되는 독법이 강하지만, 본 구절의 한국어 본문에서는 시각적 비교를 매끄럽게 하도록 ‘그 둘레’로 옮겼습니다. 이는 독자가 환상적 원환 이미지와 빛의 확산을 함께 느끼게 하려는 선택입니다.
- source_word: ቃለ ኪሩቤን
  english_pob_choice: the voice of the cherubim
  chosen_korean: 그룹들의 음성
  alternatives_korean:
  - 그룹들의 소리
  - 그룹의 음성
  - 그룹들의 목소리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ቃለ는 ‘음성/소리’ 모두 가능하지만, 환상 장면의 엄숙성을 살리기 위해 ‘음성’을 택했습니다. 한국어 성경 전통에서 ኪሩቤን은 ‘그룹들’로 옮기는 것이 자연스럽습니다.
theological_decisions:
- issue: 「그룹들의 음성」의 문장 구조
  chosen_reading: 마지막 절을 별도의 완결 문장으로 풀지 않고, 보이는 환상에 더해진 청각적 요소로 유지했습니다.
  alternative_readings:
  - ‘그리고 그룹들의 음성이 들렸습니다’로 보완
  - ‘그룹들의 음성이 있었습니다’로 직역
  rationale: 원문은 간결한 잔구조로, 시각과 청각이 겹치는 환상 체험을 압축적으로 제시합니다. 너무 매끈하게 보완하면 이 긴장감이 약해집니다.
  doctrine_reference: 본문의 묘사 구조를 보존하는 번역 원칙
