  - 드높은 왕좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥은 환상 중에 보이는 하나님의 보좌를 가리키므로 ‘왕좌/보좌’가 자연스럽습니다. ‘높은’은 ልዑለ의 높음과 위엄을 직접 살립니다.
- source_word: አስሐትያ
  english_pob_choice: crystal
  chosen_korean: 수정
  alternatives_korean:
