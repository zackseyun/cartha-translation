base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
  footnotes:
  - marker: a
    text: The word rendered 'crystal' may also suggest ice, frost, or a bright crystalline substance; the image is one of dazzling transparency and brilliance.
    reason: lexical_alternative
  - marker: b
    text: Or 'its circuit' or 'what surrounded it,' if the focus is on the encircling radiance rather than geometric shape.
    reason: lexical_alternative
  - marker: c
    text: 'The final phrase is terse in Ge''ez: literally ''and the voice of the cherubim,'' likely adding an auditory feature to the throne vision rather than forming a complete clause.'
    reason: lexical_alternative
  - marker: d
    text: Or 'its circumference'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 저는 바라보아 그 안에 높은 왕좌를 보았습니다[a]; 그 모습은 수정 같았고, 그 둘레는 빛나는 해 같았으며, 그룹들의 음성이 있었습니다[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘높은’은 보좌의 위엄과 높음을 드러내며, 원문의 ልዑለ가 지닌 ‘높음/드높음’의 뉘앙스를 반영합니다.
    reason: korean_style_note
  - marker: b
    text: 원문 ክበቡ는 문맥상 바퀴로 이해될 수 있지만, 본문에서는 시각적 둘레/환영을 살리는 방향으로 번역했습니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 구절은 지극히 간결하여, ‘그룹들의 음성’은 환상에 더해진 청각적 요소로 읽힐 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነጸርኩ፡ ወርኢኩ፡
  english_pob_choice: And I looked and saw
  chosen_korean: 그리고 저는 바라보아 보았습니다
  alternatives_korean:
  - 그리고 저는 보고 보았습니다
  - 그리고 저는 바라보고 보았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 두 시각 동사를 나란히 살려 환상 보고의 긴박함과 장면 전환을 유지했습니다. 한국어에서는 합쇼체 흐름에 맞게 ‘바라보아 보았습니다’로 자연화했습니다.
- source_word: መንበረ፡ ልዑለ
  english_pob_choice: a lofty throne
  chosen_korean: 높은 왕좌
  alternatives_korean:
  - 높은 보좌
  - 높은 옥좌
  - 드높은 왕좌
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥은 환상 중에 보이는 하나님의 보좌를 가리키므로 ‘왕좌/보좌’가 자연스럽습니다. ‘높은’은 ልዑለ의 높음과 위엄을 직접 살립니다.
- source_word: አስሐትያ
  english_pob_choice: crystal
  chosen_korean: 수정
  alternatives_korean:
  - 크리스털
  - 얼음
  - 서리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기묘하고 투명하게 빛나는 물질 이미지를 한국어 성경 문맥에서 가장 간결하게 살릴 수 있는 표현은 ‘수정’입니다. 다만 원뜻의 투명성과 광휘를 함께 염두에 둔 선택입니다.
- source_word: ክበቡ
  english_pob_choice: its wheels
  chosen_korean: 그 둘레
  alternatives_korean:
  - 그 바퀴들
  - 그 원둘레
  - 그 테두리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 원문은 본래 ‘바퀴들’로 이해되는 독법이 강하지만, 본 구절의 한국어 본문에서는 시각적 비교를 매끄럽게 하도록 ‘그 둘레’로 옮겼습니다. 이는 독자가 환상적 원환 이미지와 빛의 확산을 함께 느끼게 하려는 선택입니다.
- source_word: ቃለ ኪሩቤን
  english_pob_choice: the voice of the cherubim
  chosen_korean: 그룹들의 음성
  alternatives_korean:
  - 그룹들의 소리
  - 그룹의 음성
  - 그룹들의 목소리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ቃለ는 ‘음성/소리’ 모두 가능하지만, 환상 장면의 엄숙성을 살리기 위해 ‘음성’을 택했습니다. 한국어 성경 전통에서 ኪሩቤን은 ‘그룹들’로 옮기는 것이 자연스럽습니다.
theological_decisions:
- issue: 「그룹들의 음성」의 문장 구조
  chosen_reading: 마지막 절을 별도의 완결 문장으로 풀지 않고, 보이는 환상에 더해진 청각적 요소로 유지했습니다.
  alternative_readings:
  - ‘그리고 그룹들의 음성이 들렸습니다’로 보완
  - ‘그룹들의 음성이 있었습니다’로 직역
  rationale: 원문은 간결한 잔구조로, 시각과 청각이 겹치는 환상 체험을 압축적으로 제시합니다. 너무 매끈하게 보완하면 이 긴장감이 약해집니다.
  doctrine_reference: 본문의 묘사 구조를 보존하는 번역 원칙
