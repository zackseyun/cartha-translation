  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 동사가 단순한 이동보다 능동적 호소를 나타내므로, 과도하게 의례적인 ‘소환’보다 직접적인 ‘부르다’를 택했습니다.
- source_word: ሩጸተ ከዋክብት
  english_pob_choice: the course of the stars
  chosen_korean: 별들의 길
  alternatives_korean:
