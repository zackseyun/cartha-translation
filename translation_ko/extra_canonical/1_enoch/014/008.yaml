base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
  footnotes:
  - marker: a
    text: Or 'the rushing of the stars' or 'the paths of the stars'; the Ge'ez expression evokes the stars in motion rather than merely stars as static objects.
    reason: lexical_alternative
  - marker: b
    text: '''Winds'' could also be rendered ''spirits,'' but the immediate context favors atmospheric forces participating in Enoch''s ascent.'
    reason: lexical_alternative
  - marker: c
    text: Or 'And this is how the vision showed me:'.
    reason: previous_rendering
translation:
  language: ko
  text: '그리고 한 환상이 내게 이와 같이 보여 주었습니다: 보십시오, 환상 속에서 구름들이 나를 부르고 있었고, 안개가 나를 부르고 있었습니다. 별들의 길[a]과 번개들이 나를 몰아가고 재촉하고 있었으며, 환상 속에서 바람들[b]이 나를 날게 하고 데려가며 하늘로 이끌어 올리고 있었습니다.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘별들의 급류’ 또는 ‘별들의 길’; 게에즈 표현은 별들을 정적인 물체가 아니라 움직이는 존재로 암시합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘바람들’은 ‘영들’로도 옮길 수 있으나, 바로 앞뒤의 문맥은 에녹의 상승에 참여하는 대기적·우주적 힘들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
