  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB의 주석처럼 이 표현은 정지한 별 자체보다 별들의 운동을 가리키므로, 한국어에서는 그 운동성을 짧고 선명하게 드러내는 ‘길’로 처리했습니다.
- source_word: ያበርሩኒ / ያንጉጹኒ / አነሥኡኒ
  english_pob_choice: were making me fly / carrying me off / lifting me upward
