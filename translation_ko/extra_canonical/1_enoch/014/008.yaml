  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 문맥에서 단순한 시각 경험보다 계시적 장면을 가리키므로, 합쇼체 문맥에서 자연스러운 ‘환상’으로 옮겼습니다.
