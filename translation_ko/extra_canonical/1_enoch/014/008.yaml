theological_decisions:
- issue: ነፋሳት의 의미를 ‘바람들’로 둘지 ‘영들’로 둘지
  chosen_reading: 바람들
  alternative_readings:
  - 영들
  - 바람의 힘들
  rationale: 앞뒤에 구름, 안개, 별, 번개가 이어지는 자연·우주적 이미지가므로, 인격화된 존재를 도입하지 않고 ‘바람들’로 옮겨 환상의 상승 장면을 그대로 보존했습니다.
  doctrine_reference: '문맥 우선 원칙: 본문이 분명히 요구하지 않는 영적 존재론은 주입하지 않습니다.'
