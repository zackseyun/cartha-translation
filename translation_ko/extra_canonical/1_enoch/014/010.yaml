- source_word: በእእባነ በረድ / በእእባን ዘእምበረድ
  english_pob_choice: of hailstones
  chosen_korean: 우박돌들
  alternatives_korean:
  - 우박석들
  - 우박으로 된 돌들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘hailstones’의 물질성을 직접 살리기 위해 ‘우박돌들’로 옮겼습니다. 반복되는 우박 이미지도 동일하게 유지했습니다.
- source_word: ምድረ በረድ
  english_pob_choice: its floor was hail
  chosen_korean: 그 바닥은 우박이었습니다
  alternatives_korean:
  - 그 바닥은 우박돌이었습니다
  - 그 마루는 우박이었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 집 안의 문맥상 ምድር는 ‘바닥’이 가장 자연스럽고, 서술어는 원문의 충격적인 물질성을 살려 ‘우박이었습니다’로 처리했습니다.
