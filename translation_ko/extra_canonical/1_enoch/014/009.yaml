base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
  footnotes:
  - marker: a
    text: Or 'a building' or 'a house'; the Ge'ez term denotes a constructed object, but the exact architectural nuance is not certain from this witness alone.
    reason: lexical_alternative
  - marker: b
    text: Literally 'stones of hail.' This may mean hailstones, but the more literal wording preserves the verse's strange visionary texture.
    reason: lexical_alternative
  - marker: c
    text: The final clause is textually difficult in this OCR witness; the sense is that the sight of it began to frighten Enoch.
    reason: textual_variant
  - marker: d
    text: Or 'a structure'.
    reason: previous_rendering
  - marker: e
    text: Or 'tongues of fire surrounded it'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 나는 안으로 들어가서 돌로 된 우박의 구조물[a] 가까이까지 이르렀습니다. 그리고 불의 혀가 그것을 둘러싸고 있었으며[e][d][c][b], 그것이 나를 두렵게 하기 시작했습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘건물’, ‘집’으로 옮길 수도 있습니다. 게으즈어는 지어진 물체를 가리키지만, 정확한 건축적 뉘앙스는 이 증언만으로 확정하기 어렵습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘우박의 돌들’입니다. ‘우박돌’로 풀 수도 있지만, 더 문자적인 표현이 이 구절의 낯선 환상적 질감을 보존합니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 절은 이 OCR 증언에서 본문이 다소 어렵습니다. 뜻은 에녹이 그것을 보고 두려워하기 시작했다는 것입니다.
    reason: textual_variant
  - marker: d
    text: 또는 ‘구조물’로 옮길 수 있습니다.
    reason: previous_rendering
  - marker: e
    text: 또는 ‘불의 혀들이 그것을 둘러쌌다’로 옮길 수 있습니다.
    reason: previous_rendering
