  rationale: 이 절 자체는 이전 환시 맥락을 전제하지만, 여기서는 특정 건축 명칭을 보태기보다 눈앞의 묘사를 그대로 살리는 편이 원문에 더 가깝습니다.
  doctrine_reference: source transparency over interpretive expansion
