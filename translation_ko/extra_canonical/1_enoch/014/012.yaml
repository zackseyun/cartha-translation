  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문은 불의 सक्रिय/격렬한 상태를 말하므로, 단순한 ‘불’보다 ‘불꽃’으로 강한 시각적 이미지를 살렸습니다.
