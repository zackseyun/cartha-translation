base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
  footnotes:
  - marker: a
    text: Or 'the Watchers'; the Ge'ez term literally denotes those who are wakeful or watchful.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'from eternity' may also mean 'from of old,' emphasizing ancient origin rather than absolute eternality.
    reason: lexical_alternative
  - marker: c
    text: Or 'according as'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것은 의의 말씀과 옛적부터 있는 깨어 있는 자들[a][b]에 대한 책망의 책입니다. 이는 거룩하고 위대하신 분께서 그 환상에서 명하신 그대로입니다[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘파수꾼들’(Watchers). 게에즈어는 문자적으로 깨어 있거나 지켜보는 이들을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘영원부터’. 이 표현은 절대적 영원성보다 아득히 오래된 기원을 가리킬 수도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 또는 ‘그 환상에 따라’.
    reason: previous_rendering
