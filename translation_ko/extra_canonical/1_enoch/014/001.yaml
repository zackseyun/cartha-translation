theological_decisions:
- issue: ትጉሃን의 정체
  chosen_reading: ‘깨어 있는 자들’로 번역하되, 본문 맥락상 천상적 존재들, 곧 Watchers를 가리키는 용법으로 유지했습니다.
  alternative_readings:
  - 파수꾼들
  - 감시하는 자들
  - 근면한 자들
  rationale: 이 문맥은 1 Enoch의 ‘Watcher’ 전승을 전제하므로 단순한 도덕적 수사로 평준화하지 않고, 어휘적 의미와 전승적 용법을 함께 살렸습니다.
  doctrine_reference: 묵시문학의 고유한 천상 존재 범주를 보존해야 합니다.
- issue: እምዓለም의 시원성
  chosen_reading: ‘태초부터 있었으며’로 옮겨, 절대적 영원성 단정과 ‘옛적부터’의 역사적 뉘앙스 사이의 긴장을 남겼습니다.
  alternative_readings:
  - 옛적부터
  - 영원부터
  - 시대 이전부터
  rationale: 주석 전통이 지적하듯 이 표현은 ‘from eternity’와 ‘from of old’ 사이에서 다의적이므로, 한국어도 한쪽으로 과도하게 좁히지 않도록 처리했습니다.
  doctrine_reference: 의도된 모호성을 보존하여 신학적 긴장을 유지해야 합니다.
