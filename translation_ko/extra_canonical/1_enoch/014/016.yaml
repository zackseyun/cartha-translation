  english_pob_choice: with splendor
  chosen_korean: 빛남
  alternatives_korean:
  - 광휘
  - 찬란함
  - 영광
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서는 ‘찬양’이 아니라 눈에 보이는 영화로운 광채를 가리키므로, 의미를 분리해 ‘빛남’으로 옮겼습니다.
- source_word: በክብር
  english_pob_choice: and glory
  chosen_korean: 영광
  alternatives_korean:
  - 존귀
  - 위엄
  - 명예
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직전의 ‘빛남’과 구별되는 존귀·위엄의 차원을 살리기 위해 ‘영광’을 유지했습니다.
- source_word: በዕበይ
  english_pob_choice: and greatness
  chosen_korean: 위대함
  alternatives_korean:
  - 크심
  - 장엄함
  - 광대함
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 크기와 탁월성을 함께 지닌 어휘이므로, 한국어에서는 추상명사 ‘위대함’이 가장 무난하게 대응합니다.
- source_word: ኢይክል፡ ዜንዎተክሙ
  english_pob_choice: I am unable to tell you
  chosen_korean: 나는 … 여러분에게 말할 수 없습니다
  alternatives_korean:
  - 나는 … 여러분에게 설명할 수 없습니다
  - 나는 … 여러분에게 전할 수 없습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 구절은 ‘너희 눈이 볼 수 없다’가 아니라 화자가 직접 ‘말할 수 없다’고 하는 진술이므로, 주어와 동사를 분명히 살렸습니다.
theological_decisions:
- issue: 지시대상(“그것의 빛남 … 그것의 위대함”)의 처리
  chosen_reading: 지시 대상을 특정하지 않고 ‘그’로만 받아, 눈앞의 하늘 구조/장면 자체를 가리키는 모호성을 유지했습니다.
  alternative_readings:
  - 하나님의 임재의 빛남과 위대함
  - 보좌/집의 빛남과 위대함을 함께 가리키는 혼합 지시
  rationale: 본문은 3인칭 소유 접사를 쓰되 대상을 명시하지 않으므로, 신학적으로 더 강한 해석으로 미리 닫지 않고 문맥상의 모호성을 보존했습니다.
  doctrine_reference: 해석적 긴장 보존
