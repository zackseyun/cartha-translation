base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
  footnotes:
  - marker: a
    text: Or 'was surging/abounding with splendor and glory and greatness.' The Ge'ez verb suggests abundant effusion rather than mere existence.
    reason: lexical_alternative
  - marker: b
    text: The pronoun 'its' likely refers to the heavenly structure in view, though the vision may intentionally blur the splendor of the place with the splendor of the divine presence.
    reason: alternative_reading
  - marker: c
    text: Or 'so that your eyes were not able to look because of its splendor and because of its greatness.'.
    reason: previous_rendering
  - marker: d
    text: Or 'And all around it was overflowing'.
    reason: previous_rendering
translation:
  language: ko
  text: 그는 모든 면에서 빛남과 영광과 위대함으로 뛰어났습니다. 그래서 나는 그 빛남과 그 위대함에 대해 여러분에게 말할 수 없습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘빛남’은 여기서 ‘찬양’이 아니라 눈에 보이는 광휘를 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: 문맥상 이 대명사는 눈앞에 보이는 하늘의 구조/장면을 가리키는 것으로 보는 것이 가장 자연스럽습니다.
    reason: theological_note
lexical_decisions:
- source_word: ይፈደፍድ
  english_pob_choice: excelled
  chosen_korean: 뛰어났습니다
  alternatives_korean:
  - 넘쳐났습니다
  - 풍성했습니다
  - 월등했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시문맥의 핵심은 단순한 상태가 아니라 탁월함/우월성입니다. 한국어에서는 ‘뛰어났습니다’가 과도한 장식 없이 그 결과적 의미를 자연스럽게 살립니다.
