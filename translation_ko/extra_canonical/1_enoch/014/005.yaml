  naturalness: ‘영원한 모든 날 동안’보다 ‘영원의 모든 날 동안’이 원문의 반복적 기간 표현을 살리면서도 더 자연스럽습니다. ‘너희가 … 결박될 것이라고 선언되었습니다’로 옮기면 수동적 선언과 그 내용을 명료하게 연결하면서 현대 합쇼체 문체를 유지합니다.
