base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
  footnotes:
  - marker: a
    text: 'The Ethiopic uses two overlapping duration formulas in this verse: one after the ban from heaven and another after the sentence of binding. The translation preserves both rather than merging them into a single ''forever.'''
    reason: lexical_alternative
  - marker: b
    text: The passive phrase 'it has been declared' leaves the speaker or authority implicit; the context suggests a heavenly judicial decree.
    reason: cultural_note
translation:
  language: ko
  text: 그리고 이제부터는 하늘로 올라가지 못하며, 온 땅에 그것이 선언되었으니 너희는 영원한 모든 날 동안 묶이게 될 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 에티오피아어 원문은 이 절에서 서로 겹치는 두 개의 기간 공식을 사용합니다. 하나는 하늘에 오르지 못한다는 금지 뒤에, 다른 하나는 결박의 선고 뒤에 붙어 있으므로, 이를 하나의 ‘영원히’로 합치지 않았습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘선언되었으니’는 주어를 드러내지 않는 수동 표현으로, 원문이 암시하는 천상 법정의 판결 성격을 살린 것입니다.
    reason: theological_note
lexical_decisions:
- source_word: እምይእዜ
  english_pob_choice: from now on
  chosen_korean: 이제부터
  alternatives_korean:
  - 지금부터
  - 이제는
  - 이로부터
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 새로운 판결 상태를 여는 시간 부사로서, 현대 한국어에서 가장 자연스럽고 단호한 표현은 ‘이제부터’입니다.
- source_word: ኢትዓርጉ
  english_pob_choice: you shall not ascend
  chosen_korean: 하늘로 올라가지 못하며
  alternatives_korean:
  - 하늘로 올라가지 않을 것이며
  - 하늘로 오르지 못하며
  - 올라가서는 안 되며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 금지된 상승을 선언하는 판결문이므로, 단순 명령형보다 결과적 금지를 드러내는 ‘~하지 못하며’가 원문의 선언성을 잘 살립니다.
- source_word: ውስተ ሰማይ
  english_pob_choice: into heaven
  chosen_korean: 하늘로
  alternatives_korean:
  - 하늘 안으로
  - 천상으로
  - 하늘에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 우주적 대비가 하늘 대 땅으로 형성되므로, ‘하늘로’가 방향성과 금지의 이미지를 가장 간결하게 전달합니다.
- source_word: ይእስርክሙ
  english_pob_choice: you shall be bound
  chosen_korean: 묶이게 될 것입니다
  alternatives_korean:
  - 매이게 될 것입니다
  - 속박되게 될 것입니다
  - 결박되게 될 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 감옥처럼 추상화하기보다 결박의 구체적 이미지를 보존해야 하므로, ‘묶이다’ 계열을 택했습니다.
- source_word: በኵሉ መዋዕለ ዓለም
  english_pob_choice: for all the days of eternity
  chosen_korean: 영원한 모든 날 동안
  alternatives_korean:
  - 영원의 모든 날 동안
  - 영원의 모든 날 동안
  - 모든 영원한 날 동안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 중첩된 기간 공식을 하나의 ‘영원히’로 합치지 않고, ‘모든 날 동안’의 반복성을 살려 원문의 판결 어조를 유지했습니다.
theological_decisions:
- issue: ‘it has been declared’의 주체를 드러낼지 여부
  chosen_reading: 그것이 선언되었으니
  alternative_readings:
  - 선포되었으니
  - 판결되었으니
  - 하늘의 명령이 내려졌으니
  rationale: 주체를 명시하지 않는 수동태를 유지하여, 원문이 남겨 둔 천상 법정의 권위와 간접성을 그대로 보존했습니다.
  doctrine_reference: Source transparency in apocalyptic judicial speech; avoid over-specifying implied authority.
- issue: 두 개의 기간 공식을 어떻게 처리할지 여부
  chosen_reading: 영원한 모든 날 동안
  alternative_readings:
  - 영원히
  - 영원의 모든 날 동안
  - 영원하고도 영원히
  rationale: 하늘 금지와 결박 형벌 뒤에 각각 다른 기간 공식을 둔 점을 합치지 않고, 반복적·법정적 울림을 유지했습니다.
  doctrine_reference: Preserve repeated duration formulas rather than flattening them into a generic eternity formula.
