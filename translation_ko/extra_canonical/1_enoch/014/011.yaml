  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
  footnotes:
  - marker: a
    text: The phrase rendered 'path of the stars' could also be understood as 'course of the stars' or more literally 'running of the stars.'
    reason: lexical_alternative
  - marker: b
    text: '''Their heaven was water'' is a difficult phrase. It may refer to the watery heaven associated with the fiery cherubim or with the upper region of the visionary structure.'
    reason: alternative_reading
  - marker: c
    text: Or 'path of the stars and the flashes of lightning'.
    reason: previous_rendering
translation:
  language: ko
  text: 그것의 천장은 별들의 길과 번개와 같았고, 그들 가운데에는 불붙은 그룹들이 있었으며, 그들의 하늘은 물이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별들의 길’은 ‘별들의 경로’ 또는 더 문자적으로는 ‘별들의 달음질’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 하늘은 물’은 난해한 표현으로, 불붙은 그룹들과 관련된 위쪽 영역이나 환상적 구조를 가리킬 수 있습니다.
    reason: alternative_reading
