    reason: alternative_reading
  - marker: c
    text: Or 'path of the stars and the flashes of lightning'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 천장은 별들의 길과 번개와 같았고, 그들 가운데에는 불의 그룹들이 있었으며, 그들의 하늘은 물이었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별들의 길’은 ‘별들의 경로’ 또는 더 문자적으로는 ‘별들의 달음질’로도 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 하늘은 물’은 난해한 표현입니다. 이는 불의 그룹들과 관련된 물의 하늘을 가리킬 수도 있고, 환상 속 구조물의 위쪽 영역을 가리킬 수도 있습니다.
    reason: alternative_reading
