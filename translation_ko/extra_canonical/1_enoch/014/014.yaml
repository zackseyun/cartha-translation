    text: 또는 ‘내가 혼란에 빠져 떨고 있을 때에’로 옮길 수 있습니다. 앞의 두 동사는 서로 가깝고 함께 강한 두려움 또는 동요를 나타냅니다.
    reason: lexical_alternative
