base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'no delight of life' is difficult. It may mean that no life-giving pleasantness was inside the house, or more broadly that nothing of living comfort was there.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 나는 그 집[a] 안으로 들어갔습니다. 그리고 그곳은 불처럼 뜨겁고 얼음처럼 차가웠으며, 그 안에는 생명의 기쁨이 전혀 없었습니다. 두려움이 나를 덮었고, 떨림이 나를 사로잡았습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez의 해당 구절은 해석이 어려우며, ‘생명의 기쁨’이란 표현은 그 안에 생명을 살게 하는 쾌적함이나 활력이 없다는 뜻일 수도 있습니다.
    reason: lexical_alternative
