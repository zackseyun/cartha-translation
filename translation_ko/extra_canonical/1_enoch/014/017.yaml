base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
  footnotes:
  - marker: a
    text: The phrase rendered 'the path of the stars' may also be understood as 'the course of the stars,' referring to their ordered movement across the heavens.
    reason: lexical_alternative
  - marker: b
    text: The word rendered 'ceiling' could also be translated 'roof' or, less likely, 'vault/firmament,' depending on how strongly the line is read as architectural versus cosmic imagery.
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 그 바닥은 불이었고, 그 위에는 번개와 별들의 길[a]이 있었으며, 그 천장은 타오르는 불이었습니다.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘별들의 길’은 ‘별들의 궤도’ 또는 ‘별들의 행로’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘천장’은 ‘지붕’ 또는, 덜 가능하게는 ‘궁창/돔’으로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
