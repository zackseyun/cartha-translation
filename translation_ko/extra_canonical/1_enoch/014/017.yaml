  - 불의
  - 불로 이루어진
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역형 ‘불의’도 가능하지만 한국어에서는 서술형으로 풀어야 문장이 자연스러워져서, 바닥의 재질을 그대로 드러내는 ‘불이었습니다’ 계열로 옮겼습니다.
