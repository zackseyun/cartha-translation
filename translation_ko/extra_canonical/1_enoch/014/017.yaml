  english_pob_choice: above it / its ceiling
  chosen_korean: 그 위에는 … 그 천장은
  alternatives_korean:
  - 그 위에는 … 그 지붕은
  - 그 위에는 … 그 둥근 천장은
  - 그 위에는 … 그 덮개는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상단의 공간을 가리키는 표현을 문맥상 ‘천장’으로 옮겨, 내부 구조를 유지하되 ‘하늘 궁창’으로 과도하게 우주화하지 않도록 했습니다.
- source_word: ምርዋፀ ከዋክብት
  english_pob_choice: the path of the stars
  chosen_korean: 별들의 길
  alternatives_korean:
  - 별들의 궤도
  - 별들의 행로
  - 별들의 경로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘path/course’의 의미를 살리면서도 시적·묵시문학적 어감을 유지하기 위해 ‘길’을 택했습니다. ‘궤도’는 현대적이지만 원문의 이미지성을 다소 약화시킵니다.
- source_word: እሳት ዘይነድድ
  english_pob_choice: blazing fire
  chosen_korean: 타오르는 불
  alternatives_korean:
  - 불타는 불
  - 활활 타는 불
  - 맹렬히 타는 불
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복을 과도하게 살린 ‘불타는 불’보다, 강도를 유지하면서도 한국어로 매끄러운 ‘타오르는 불’이 적절합니다.
theological_decisions:
- issue: 건축적 이미지와 우주적 이미지를 함께 보존할지 여부
  chosen_reading: ‘바닥-위-천장’의 건축적 틀을 유지하면서 ‘번개들’과 ‘별들의 길’의 우주적 요소도 그대로 살렸습니다.
  alternative_readings:
  - ‘궁창’이나 ‘돔’처럼 우주적 용어로 통일하기
  - 건축적 표현을 줄이고 단순한 천상 광경으로 완화하기
  rationale: 이 구절은 성전/왕좌 방의 구조와 하늘의 현상을 겹쳐 보여 주므로, 어느 한쪽으로 평탄화하지 않는 것이 원문과 POB의 해석을 가장 잘 반영합니다.
  doctrine_reference: 묵시적 상징의 긴장을 보존
