base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
  footnotes:
  - marker: a
    text: Or 'the Watchers, the sons of heaven.' The Ge'ez term here is related to wakefulness or vigilance and likely refers to the angelic beings central to the Book of the Watchers.
    reason: lexical_alternative
  - marker: b
    text: The clause 'to these he created and gave reproach' is textually difficult in the Ethiopic witness; the sense may be that, unlike humankind, the heavenly beings received a negative portion or condition.
    reason: textual_variant
  - marker: c
    text: Or 'For he created and gave to humankind the word of understanding, but to these he created and gave reproach—to the vigilant sons of heaven.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 인간에게 지식의 말씀을 깨닫게 하려고 창조하고 주셨듯이, 그도 나를 창조하여 하늘의 아들들인 감시자들에게 견책을 주셨습니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብእ
  english_pob_choice: humankind
  chosen_korean: 인간
  alternatives_korean:
  - 인류
  - 사람들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 집합적 인간 일반을 가리키므로 성중립적이고 현대적인 ‘인간’이 가장 자연스럽습니다.
- source_word: ቃለ አእምሮ
  english_pob_choice: the word of knowledge
  chosen_korean: 지식의 말씀
  alternatives_korean:
  - 이해의 말씀
  - 앎의 말씀
  - 지식의 말
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ቃል의 ‘말씀’과 አእምሮ의 인지·앎 의미를 함께 살리면서, 추상적 능력으로만 좁히지 않기 위해 ‘지식의 말씀’으로 옮겼습니다.
- source_word: እዝልፎሙ
  english_pob_choice: reproof
  chosen_korean: 견책
  alternatives_korean:
  - 책망
  - 질책
  - 꾸짖음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥상 인간에게 주어진 것과 대비되는 부정적 몫/성격을 유지하면서, 도덕적·법정적 뉘앙스를 가진 ‘견책’이 가장 가깝습니다.
- source_word: ትጉሃን ውሉደ ሰማይ
  english_pob_choice: the vigilant sons of heaven / the Watchers
  chosen_korean: 하늘의 아들들인 감시자들
  alternatives_korean:
  - 하늘의 아들들인 깨어 있는 자들
  - 하늘의 아들들인 파수자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본문의 문자적 뜻을 살리기 위해 ‘하늘의 아들들’과 ‘감시자들’을 함께 두었고, 이 책의 기술적 명칭도 독자가 알아볼 수 있게 반영했습니다.
theological_decisions:
- issue: 첫째 절의 주체와 1인칭 자기-언급
  chosen_reading: ‘그도 나를 창조하여… 주셨습니다’로 옮겨, 본문이 인간에 대한 진술에서 화자 자신에게로 전환되는 1인칭 구조를 드러냈습니다.
  alternative_readings:
  - ‘그가… 나를 창조하여’만 두고 1인칭 전환을 약화함
  - ‘그도 나를 창조하여 견책하도록 하셨습니다’처럼 목적절로 풀어씀
  rationale: 에티오피아어 본문 전승의 어려움이 있으나, 최신 교정안이 요구하는 1인칭 화자 전환을 보존해야 하므로 이를 본문에 반영했습니다.
  doctrine_reference: 본문 내 화자 전환과 수사 구조를 보존하는 번역 원칙
- issue: ‘감시자들’의 번역 방식
  chosen_reading: 본문에는 기술어를 살리되, ‘하늘의 아들들인 감시자들’로 설명적으로 처리했습니다.
  alternative_readings:
  - ‘감시자들’만 사용
  - ‘깨어 있는 하늘의 아들들’만 사용
  rationale: 이 단락의 전승적 용어인 Watchers를 과도하게 일반화하지 않으면서도, 직역된 형용사 ‘하늘의 아들들’을 함께 제시해 원문의 이중 표현을 유지했습니다.
  doctrine_reference: 본문 고유 용어와 서술적 풀이의 균형
