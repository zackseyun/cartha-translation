base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
  footnotes:
  - marker: a
    text: Or 'all its doors were open before me.' The Ge'ez phrase can be rendered either distributively ('every doorway') or collectively ('all its doors').
    reason: lexical_alternative
  - marker: b
    text: '''Tongues of fire'' preserves the concrete image of flame-like tongues or fiery projections in the structure; some translators smooth this to ''flames of fire.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'greater than this one'.
    reason: previous_rendering
translation:
  language: ko
  text: 보십시오[a], 또 다른 집이 있었는데, 그것은 저것보다 더 컸습니다. 그리고 모든 문이 내 앞에 열려 있었고[b], 그 집은 불의 혀들로 지어져 있었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문은 환상 서술의 주목을 나타냅니다.
    reason: source_note
  - marker: b
    text: 게에즈 표현은 ‘모든 문’으로도, ‘각 문’으로도 옮길 수 있습니다.
    reason: lexical_alternative
