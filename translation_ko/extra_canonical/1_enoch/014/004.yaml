  - severity: medium
    issue: 마지막 ‘그것도’의 선행사 불명확
    rationale: 원문은 앞선 청원의 거절을 반복하지만, 한국어 ‘그것도’는 판결이나 다른 내용을 가리키는 것으로도 읽힐 수 있습니다. ‘그 청원’으로 명시해야 반복된 거절이 분명합니다.
