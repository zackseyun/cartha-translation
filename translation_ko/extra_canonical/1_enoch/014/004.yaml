base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
  footnotes:
  - marker: a
    text: The Ge'ez phrase rendered 'for all the days of eternity' is literally 'for all the days of the age/eternity,' an emphatic formula of unending duration.
    reason: lexical_alternative
  - marker: b
    text: The word rendered 'sentence' may also be understood as 'decree' or 'final decision'; the sense is that a definitive judgment has already been fixed against the Watchers.
    reason: lexical_alternative
  - marker: c
    text: Or 'your petition will not be granted to you for all the days of eternity; and the sentence against you has been fully decreed'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 당신들의 간청을 기록하였고, 내 환상에서 다음과 같이 보였습니다. 곧 당신들의 간청은 영원한 모든 날 동안 당신들에게 허락되지 않을 것이며, 당신들에 대한 판결은 끝났고, 그것도 당신들에게 허락되지 않을 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게즈어 구문은 문자적으로 ‘영원의/세대의 모든 날들’에 가깝지만, 여기서는 끝없는 기간을 강조하는 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 게즈어의 표현은 ‘판결’보다 넓게 ‘결정/선고’로도 옮길 수 있으나, 문맥상 최종 심판의 사법적 의미가 분명합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስእለትክሙ
  english_pob_choice: your petition
  chosen_korean: 당신들의 간청
  alternatives_korean:
  - 당신들의 청원
  - 당신들의 요청
  - 당신들의 기도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상위자에게 올리는 공식적 청을 가리키는 말이므로, ‘간청’이 법정적·탄원적 뉘앙스를 가장 잘 살립니다.
- source_word: ጻሐፍኩ
  english_pob_choice: I wrote down
  chosen_korean: 기록하였고
  alternatives_korean:
  - 적어 두었고
  - 써 두었고
  - 기록했습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 필기가 아니라 환시 내용의 공식적 보존을 드러내기 위해 ‘기록하다’를 택했습니다.
- source_word: በራእየየ ከመዝ ያስተርኢ
  english_pob_choice: in my vision it was shown thus
  chosen_korean: 내 환상에서 다음과 같이 보였습니다
  alternatives_korean:
  - 내 환시에서 이렇게 보였습니다
  - 내 환상 가운데 이렇게 드러났습니다
  - 내가 본 환상에서 이렇게 나타났습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 계시적 ‘vision/seeing’의 의미를 살리면서 현대 한국어에서 자연스럽게 읽히도록 ‘환상’과 ‘보였습니다’를 결합했습니다.
- source_word: መዋዕለ ዓለም
  english_pob_choice: for all the days of eternity
  chosen_korean: 영원한 모든 날 동안
  alternatives_korean:
  - 영원의 모든 날 동안
  - 영원토록
  - 모든 영원의 날들 동안
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 장중함을 유지하되 한국어 문장성도 확보하기 위해 ‘영원한 모든 날 동안’을 사용했습니다.
- source_word: ፍጽምት ላዕሌክሙ
  english_pob_choice: the sentence against you has been completed
  chosen_korean: 당신들에 대한 판결은 끝났고
  alternatives_korean:
  - 당신들에 대한 결정은 완료되었고
  - 당신들에 대한 선고는 마무리되었고
  - 당신들에 대한 판결이 완결되었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 여기서 핵심은 최종 확정된 심판 결과이므로, ‘판결’이 ‘decree/sentence’의 사법적 의미를 가장 분명하게 드러냅니다.
- source_word: ወኢይከውነ ክሙ
  english_pob_choice: and it will not be granted to you
  chosen_korean: 그것도 당신들에게 허락되지 않을 것입니다
  alternatives_korean:
  - 그리고 그것도 당신들에게 주어지지 않을 것입니다
  - 또한 당신들에게 허용되지 않을 것입니다
  - 그것은 당신들에게 일어나지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 반복되는 거절을 자연스럽게 살리되, 앞절의 ‘허락되지 않을’ 표현과 연결해 압박감을 유지했습니다.
theological_decisions:
- issue: '문장의 성격: 응답 거절인가, 단순 통보인가'
  chosen_reading: 탄원에 대한 최종적 사법 거절로 읽었습니다.
  alternative_readings:
  - 단순한 예언적 통보
  - 기도 응답의 미성취
  rationale: 문맥상 간청이 기록되고 환시로 선고가 제시되므로, 관계적 위로보다 판결 선언의 성격이 더 강합니다.
  doctrine_reference: 원문 우선, 종말론적 심판 어휘를 약화시키지 않기
- issue: ‘영원한 모든 날 동안’의 처리
  chosen_reading: 장황해 보여도 반복적·강조적 영속 표현으로 유지했습니다.
  alternative_readings:
  - 그냥 ‘영원히’
  - ‘영원한 세월 동안’
  rationale: 게즈어의 강조 공식이 지닌 중첩감을 평탄화하지 않기 위해, 의미는 동일하더라도 압박감이 살아 있는 표현을 택했습니다.
  doctrine_reference: 소스의 수사적 긴장 보존
