  source_fidelity: 개정이 필요합니다. 원문의 እስመ는 환시에서 드러난 내용의 도입이므로 ‘곧’으로 분명히 살렸습니다. ፍጽምት ላዕሌክሙ는 문맥상 그들에 대해 확정·완료된 사법적 판결을 가리킵니다. 제공된 게즈어 전사에는 이 구절 앞에 비문맥적인 OCR/전사 문제가 보이나, 확립된 문맥 및 영어 POB 감사 이력의 ‘판결’ 읽기를 따라 번역하되 본문에 불필요한 해석을 덧붙이지 않았습니다. 마지막 반복은 같은 청원을 가리키므로 한국어에서 지시 대상이 분명하도록 ‘그 청원’으로 옮겼습니다.
