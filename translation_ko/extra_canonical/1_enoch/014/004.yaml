  terminology: 공식적인 상소·탄원의 성격에는 ‘간청’보다 ‘청원’이 더 적절합니다. ‘판결’은 최종적 사법 판단이라는 문맥을 잘 보존합니다. ‘확정되었습니다’는 ‘완료되었다’라는 원문의 종결성과 판결의 법적 효력을 자연스러운 한국어로 전달합니다.
