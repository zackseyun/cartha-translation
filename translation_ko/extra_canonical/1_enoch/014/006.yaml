base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
  footnotes:
  - marker: a
    text: The word rendered 'treasures' is textually difficult in the OCR Ge'ez and may also mean 'wealth' or 'possessions.'
    reason: lexical_alternative
  - marker: b
    text: Or 'you shall see the destruction of your beloved sons,' if the verbal form is taken more simply as future rather than future perfect.
    reason: lexical_alternative
  - marker: c
    text: Or 'and you will not have their treasures,'.
    reason: previous_rendering
translation:
  language: ko
  text: 이것보다 먼저, 너희는 너희 사랑하는 아들들의 멸망을 보게 될 것이며, 너희는 그들로 말미암아 아무 유익도 얻지 못할 것이지만, 그들은 칼에 맞아 너희 앞에 넘어질 것입니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게에즈 전승은 손상되어 있어, 해당 표현은 ‘재산/소유물’ 계열이나 ‘유익/향유’ 계열로 이해될 수 있습니다.
    reason: textual_variant
  - marker: b
    text: 문맥상 이 동사는 단순 미래로도 읽을 수 있어, ‘멸망을 보게 될 것입니다’로 옮길 여지도 있습니다.
    reason: alternative_reading
  - marker: c
    text: 전승상 어려운 표현을 따라 ‘그들에 대한 소유/향유’를 나타낼 가능성도 있습니다.
    reason: lexical_alternative
