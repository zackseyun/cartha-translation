translation:
  language: ko
  text: 이 일보다 먼저, 너희는 너희가 사랑하는 아들들의 멸망을 보게 될 것이며, 그들에게서 아무 유익도 얻지 못할 것이며, 그들은 칼에 쓰러져 너희 앞에 넘어질 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘그들에게서 아무 유익도 얻지 못할’: 이 대목의 게에즈어 전승은 손상되어 있습니다. 해당 낱말은 ‘재산/소유물’로 이해될 수도 있으나, 다른 전승을 따르면 ‘그들로 인한 유익 또는 향유’라는 뜻으로 이해될 수 있습니다.'
    reason: textual_variant
  - marker: b
    text: '‘보게 될 것’: 이 동사는 단순 미래로도 읽을 수 있으므로, ‘멸망을 볼 것입니다’로 옮길 여지도 있습니다.'
    reason: alternative_reading
