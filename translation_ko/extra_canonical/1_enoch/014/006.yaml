theological_decisions:
- issue: 부패한 게에즈 표현 ጥራያኒሆሙ의 처리
  chosen_reading: 게에즈 표면 독법을 그대로 따르지 않고, 본문의 손상 지점을 인정한 채 ‘그들로 말미암아 아무 유익도 얻지 못할’로 옮겼습니다.
  alternative_readings:
  - ‘그들의 보물/소유’를 잃게 될 것입니다
  - ‘그들로 말미암아 즐거움이 없을 것입니다’
  rationale: 이 절은 게에즈 전승이 불명확하므로, 본문 비평상 더 분명한 독법을 반영해 의미를 번역해야 합니다. 이렇게 해야 장차 검토자가 손상된 지점을 추적할 수 있습니다.
  doctrine_reference: '본문비평 우선 원칙: 손상 전승은 의미 보정으로 다루되, 해석을 과도하게 확정하지 않습니다.'
