base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
  footnotes:
  - marker: a
    text: Or 'with my spirit.' The Ge'ez term can denote breath or spirit; the immediate context of tongue and speaking favors 'breath.'
    reason: lexical_alternative
  - marker: b
    text: '''Heart'' here refers to inward understanding, not merely emotion.'
    reason: cultural_note
  - marker: c
    text: Or 'which the Great One has given to men'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 내 잠 속에서 보았습니다. 나는 지금 육신의 혀와 내 영[a]으로 말합니다. 그분이 사람들에게 입[c][b]으로 주신 것이니, 그들이 그것으로 말하고 마음으로 깨닫게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 숨’. Ge'ez의 이 단어는 숨 또는 영을 가리킬 수 있으며, 앞의 ‘육신의 혀’와 ‘말한다’는 문맥은 ‘숨’을 더 잘 받쳐 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘마음’은 단순한 감정이 아니라 내면의 이해를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그분이 사람들에게 주신 입으로’.
    reason: previous_rendering
