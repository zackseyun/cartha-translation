  lexicon: Dillmann
  rationale: Ge'ez의 መንፈስ이 ‘숨/호흡/영’의 범위를 가지므로, 원문의 중의성을 살리기 위해 ‘영’을 본문에 두고 a각주로 대안을 밝혔습니다.
