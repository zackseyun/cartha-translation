base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
  footnotes:
  - marker: a
    text: Or 'with my spirit.' The Ge'ez term can denote breath or spirit; the immediate context of tongue and speaking favors 'breath.'
    reason: lexical_alternative
  - marker: b
    text: '''Heart'' here refers to inward understanding, not merely emotion.'
    reason: cultural_note
  - marker: c
    text: Or 'which the Great One has given to men'.
    reason: previous_rendering
translation:
  language: ko
  text: 나는 내 잠 속에서 보았습니다. 나는 지금 육신의 혀와 내 영[a]으로 말합니다. 그분이 사람들에게 입[c][b]으로 주신 것이니, 그들이 그것으로 말하고 마음으로 깨닫게 하려는 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘내 숨’. Ge'ez의 이 단어는 숨 또는 영을 가리킬 수 있으며, 앞의 ‘육신의 혀’와 ‘말한다’는 문맥은 ‘숨’을 더 잘 받쳐 줍니다.
    reason: lexical_alternative
  - marker: b
    text: 여기서 ‘마음’은 단순한 감정이 아니라 내면의 이해를 가리킵니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘그분이 사람들에게 주신 입으로’.
    reason: previous_rendering
lexical_decisions:
- source_word: ርኢኩ
  english_pob_choice: I saw
  chosen_korean: 나는 … 보았습니다
  alternatives_korean:
  - 나는 … 보았다고 말합니다
  - 나는 … 보았노라
  lexicon: Dillmann
  rationale: 환시 서술의 단순 과거를 자연스러운 현대 한국어로 옮기되, 예언적 보고체를 유지했습니다.
- source_word: በንዋምየ
  english_pob_choice: in my sleep
  chosen_korean: 내 잠 속에서
  alternatives_korean:
  - 꿈에서
  - 잠자는 가운데
  lexicon: Dillmann
  rationale: sleep-state를 직접 드러내면서도 환시적 분위기를 살리기 위해 ‘잠 속에서’를 택했습니다.
- source_word: ወበመንፈስየ
  english_pob_choice: and with my breath
  chosen_korean: 내 영
  alternatives_korean:
  - 내 숨
  - 내 호흡
  lexicon: Dillmann
  rationale: Ge'ez의 መንፈስ이 ‘숨/호흡/영’의 범위를 가지므로, 원문의 중의성을 살리기 위해 ‘영’을 본문에 두고 a각주로 대안을 밝혔습니다.
- source_word: ዘወሀበ ዓቢይ አፈ ለሰብእ
  english_pob_choice: which the Great One has given as a mouth to men
  chosen_korean: 그분이 사람들에게 입으로 주신 것이니
  alternatives_korean:
  - 그분이 사람들에게 입으로 주신 바
  - 그분이 사람들에게 입을 주신 것이니
  lexicon: Dillmann
  rationale: 아파(입)를 보존하면서도 한국어에서 자연스럽게 ‘입으로 주신 것’으로 정리해, 문법적 관계와 의미를 함께 살렸습니다.
- source_word: ወይለብዉ በልብ
  english_pob_choice: and understand in the heart
  chosen_korean: 마음으로 깨닫게 하려는 것입니다
  alternatives_korean:
  - 마음에서 깨닫게 하려는 것입니다
  - 마음으로 이해하게 하려는 것입니다
  lexicon: Dillmann
  rationale: ‘heart’의 고대 인류학적 의미를 현대 한국어의 ‘마음’으로 옮기되, 단순 감정보다 내적 이해를 드러내기 위해 ‘깨닫다’를 선택했습니다.
theological_decisions:
- issue: መንፈስ의 의미를 ‘영’으로 둘지 ‘숨/호흡’으로 둘지
  chosen_reading: 본문에는 ‘영’, 각주에는 ‘숨/호흡’ 가능성을 제시
  alternative_readings:
  - 숨
  - 호흡
  - 영과 호흡의 중의성 유지
  rationale: 문맥상 육신의 혀와 대조되는 인간의 발화 능력을 가리키지만, Ge'ez 어휘의 폭을 지우지 않기 위해 본문은 ‘영’으로 두고 대안 독법을 각주로 보존했습니다.
  doctrine_reference: 의도적 중의성 보존
- issue: ‘The Great One’의 번역
  chosen_reading: 그분
  alternative_readings:
  - 위대하신 분
  - 큰 이
  rationale: 한국어 본문에서는 반복되는 신적 지시대명사를 자연스럽게 유지하고, 고유한 Enochic 호칭의 격조는 해치지 않기 위해 ‘그분’으로 정리했습니다.
  doctrine_reference: 에녹서의 신적 호칭 보존
