  lexicon: Dillmann
  rationale: 아파(입)를 보존하면서도 한국어에서 자연스럽게 ‘입으로 주신 것’으로 정리해, 문법적 관계와 의미를 함께 살렸습니다.
- source_word: ወይለብዉ በልብ
  english_pob_choice: and understand in the heart
  chosen_korean: 마음으로 깨닫게 하려는 것입니다
  alternatives_korean:
  - 마음에서 깨닫게 하려는 것입니다
  - 마음으로 이해하게 하려는 것입니다
  lexicon: Dillmann
  rationale: ‘heart’의 고대 인류학적 의미를 현대 한국어의 ‘마음’으로 옮기되, 단순 감정보다 내적 이해를 드러내기 위해 ‘깨닫다’를 선택했습니다.
theological_decisions:
- issue: መንፈስ의 의미를 ‘영’으로 둘지 ‘숨/호흡’으로 둘지
  chosen_reading: 본문에는 ‘영’, 각주에는 ‘숨/호흡’ 가능성을 제시
  alternative_readings:
  - 숨
  - 호흡
  - 영과 호흡의 중의성 유지
  rationale: 문맥상 육신의 혀와 대조되는 인간의 발화 능력을 가리키지만, Ge'ez 어휘의 폭을 지우지 않기 위해 본문은 ‘영’으로 두고 대안 독법을 각주로 보존했습니다.
  doctrine_reference: 의도적 중의성 보존
- issue: ‘The Great One’의 번역
  chosen_reading: 그분
  alternative_readings:
  - 위대하신 분
  - 큰 이
  rationale: 한국어 본문에서는 반복되는 신적 지시대명사를 자연스럽게 유지하고, 고유한 Enochic 호칭의 격조는 해치지 않기 위해 ‘그분’으로 정리했습니다.
  doctrine_reference: 에녹서의 신적 호칭 보존
