base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
  footnotes:
  - marker: a
    text: Or 'your prayer ... will not come to pass.' The Ge'ez says literally 'will not be,' but in context of a petition this likely means it will not be granted.
    reason: lexical_alternative
  - marker: b
    text: The final clause is difficult. It may imply that the Watchers cannot present, repeat, or make use of Enoch's written plea before God.
    reason: alternative_reading
  - marker: c
    text: Or 'and on your own behalf—you yourselves will weep and make supplication, but you will not speak'.
    reason: previous_rendering
translation:
  language: ko
  text: 그들을 위한 너희의 간청은 허락되지 않을 것이며, 너희 자신을 위한 간청도 허락되지 않을 것입니다. 너희 자신도 울며 간구하면서, 내가 쓴 책에서 한마디도 말하지 못할 것입니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘너희의 기도 …는 이루어지지 않을 것이다.’ 게에즈 본문은 문자적으로 ‘되지 않을 것이다’에 가깝지만, 청원의 문맥에서는 허락되지 않는다는 뜻일 가능성이 큽니다.
    reason: lexical_alternative
  - marker: b
    text: 마지막 절은 어렵습니다. 이는 감시자들이 하나님 앞에서 에녹의 기록된 간청을 제시하거나 되풀이하거나 그것을 사용할 수 없다는 뜻일 수 있습니다.
    reason: alternative_reading
lexical_decisions:
- source_word: ስእለትክሙ
  english_pob_choice: your petition
  chosen_korean: 너희의 간청
  alternatives_korean:
  - 너희의 청원
  - 너희의 기도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 말은 단순한 기도보다 공식적인 요청·탄원에 가깝기 때문에 ‘간청’이 문맥의 청원적 성격을 살립니다.
- source_word: በእንቲአሆሙ
  english_pob_choice: on their behalf
  chosen_korean: 그들의 일을 위한
  alternatives_korean:
  - 그들을 위해
  - 그들에 관하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 중재·대리의 의미를 살리되, 한국어에서 자연스럽게 들리도록 ‘…을 위한’으로 옮겼습니다.
- source_word: ኢይከውን
  english_pob_choice: will not be granted
  chosen_korean: 허락되지 않을 것이며
  alternatives_korean:
  - 이루어지지 않을 것이며
  - 되지 않을 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 ‘되지 않다’이지만, 청원 맥락에서는 ‘허락되다/받아들여지다’가 더 정확하게 거절의 뜻을 전달합니다.
- source_word: ኢምንተ ቃለ
  english_pob_choice: a single word
  chosen_korean: 한마디도
  alternatives_korean:
  - 한 단어도
  - 한 말도
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 부정의 강조를 한국어로 자연스럽게 드러내는 표현으로 ‘한마디도’를 택했습니다.
theological_decisions:
- issue: 마지막 절의 의미가 ‘책에서 말을 꺼내지 못함’인지, ‘그 책으로 변호를 제시하지 못함’인지
  chosen_reading: ‘내가 쓴 책에서 한마디도 말하지 못할 것입니다’로 옮겨, 발화의 금지/무력함을 그대로 드러냈습니다.
  alternative_readings:
  - 그 책으로 아무 말도 변호하지 못할 것입니다
  - 그 책을 통해 아무 말도 할 수 없을 것입니다
  rationale: 게에즈 본문은 발화를 직접 부정하므로, 그 표면 의미를 유지하되 구체적 함의는 열어 두는 편이 원문에 더 충실합니다.
  doctrine_reference: 해석의 긴장을 해소하지 않고 보존합니다.
