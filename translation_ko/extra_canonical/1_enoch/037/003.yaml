  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문자적으로는 '머리/시작'이 가능하지만, 한국어에서는 '지혜의 시작'이 가장 자연스럽고 본문의 핵심 이미지를 보존합니다.
theological_decisions:
- issue: '''아끼지 않다''의 의미 범위'
  chosen_reading: 지혜를 뒤의 이들에게도 제한 없이 전하되, 숨기거나 억제하지 않겠다는 뜻으로 읽었습니다.
  alternative_readings:
  - 지혜를 나누어 주겠다는 뜻
  - 지혜를 공개하겠다는 뜻
  - 지혜를 보류하지 않겠다는 뜻
  rationale: Ge'ez의 1인칭 복수 부정형은 단순한 전달보다 '보류/억제의 거부'를 드러내므로, 한국어도 그 긴장을 유지했습니다.
  doctrine_reference: 문자적-의미적 일치와 해석 절제 원칙
