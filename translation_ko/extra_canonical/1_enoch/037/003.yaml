  - 우리는 ... 막지 않을 것입니다
  - 우리는 ... 거두지 않을 것입니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 어근의 '막다/억제하다' 의미를 한국어에서 가장 자연스럽게 드러내기 위해 '아끼지 않다'를 선택했습니다. 단순한 제공보다 '주지 않거나 숨기지 않음'의 뉘앙스를 함께 담습니다.
- source_word: ርእሳ ለጥበብ
  english_pob_choice: the beginning of wisdom
  chosen_korean: 지혜의 시작
