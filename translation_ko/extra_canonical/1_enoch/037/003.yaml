base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
  footnotes:
  - marker: a
    text: The Ethiopic wording of this verse is difficult, especially in the phrases rendered 'beginning' and 'another beginning of wisdom.' The translation stays close to the transmitted Ge'ez; the sense may be that this opens the first parable and that no second opening of wisdom follows.
    reason: textual_variant
  - marker: b
    text: Or 'This is the beginning of the first parable; and afterward there will not be another beginning of wisdom.'.
    reason: previous_rendering
translation:
  language: ko
  text: 앞선 이들에게 말하는 것이 더 낫습니다. 그러나 뒤의 이들에게도 우리는 지혜의 시작을 감추지 않을 것입니다.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 그에즈어 본문의 표현은 어려우며, 특히 ‘지혜의 시작’에 해당하는 구절의 정확한 관계가 분명하지 않습니다. 여기서는 앞선 이들과 뒤의 이들을 대조하고, 뒤의 이들에게도 지혜의 시작을 보류하지 않겠다는 뜻으로 옮겼습니다.
    reason: source_note
