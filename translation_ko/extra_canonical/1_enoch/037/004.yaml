translation:
  language: ko
  text: 지금까지 내가 받은 것은 영들의 주 앞에서 내게 주어지지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘내가 받은 것’으로 옮긴 동사는 ‘취하다’, ‘들어 올리다’ 또는 문맥상 ‘말하기 시작하다’로도 이해될 수 있습니다. 주어진 게에즈 본문에서는 그 동사의 목적어가 명시되어 있지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘영들의 주 앞에서’는 직역에 가까운 표현입니다. 전치사구는 ‘영들의 주께로부터’로도 옮길 수 있습니다.
    reason: previous_rendering
