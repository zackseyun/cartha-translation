translation:
  language: ko
  text: 지금까지는, 내가 받은 것은 만군의 주 앞에서 나에게 주어지지 않았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 끝의 동사는 ‘말하기 시작한 것’, ‘들어 올린 것’, ‘받은 것’ 등으로 이해될 수 있으나, 주어진 게에즈 본문은 목적어를 분명히 밝히지 않습니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘영들의 주’입니다. 본문에서는 신적 호칭의 위엄을 살리기 위해 한국어 관용의 위격적 표현으로 옮겼습니다.
    reason: korean_style_note
