base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
  footnotes:
  - marker: a
    text: Or 'another vision of wisdom.' The Ge'ez adjective can mean 'other' or 'another'; 'second' is chosen here because the heading appears to mark sequence.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'son of' formula is kept to preserve the genealogy exactly as the heading presents it.
    reason: cultural_note
  - marker: c
    text: Or 'The second vision of wisdom that Enoch son of Jared, son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam, saw.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 본 둘째[a] 환상, 곧 야렛의 아들이며 마할랄렐의 아들이며 가이난의 아들이며 에노스의 아들이며 셋의 아들이며 아담의 아들인 에녹이 본 지혜의 환상입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘다른’ 또는 ‘또 하나의’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ራእይ / ራእየ
  english_pob_choice: vision / saw
  chosen_korean: 환상 / 본
  alternatives_korean:
  - 계시 / 보신
  - 이상 / 목격한
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 예언적·묵시적 시야를 드러내기 위해 ራእይ는 ‘환상’으로, ዘርእየ는 자연스러운 과거 관형인 ‘본’으로 옮겼습니다.
- source_word: ካልእ
  english_pob_choice: second
  chosen_korean: 둘째
  alternatives_korean:
  - 다른
  - 또 하나의
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문장 머리말에서 순차적 표지를 나타내므로, 단순한 ‘다른’보다 ‘둘째’가 영어 POB의 판단과 같은 기능을 더 분명히 드러냅니다.
- source_word: ጥበብ
  english_pob_choice: wisdom
  chosen_korean: 지혜
  alternatives_korean:
  - 지식
  - 깨달음
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 명사는 일반적으로 ‘지혜’를 뜻하므로, 환상을 규정하는 핵심 명사를 그대로 살렸습니다.
- source_word: ወልደ
  english_pob_choice: son of
  chosen_korean: 아들이요
  alternatives_korean:
  - 후손이요
  - 자손이요
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 계보의 반복 공식을 본문대로 보존하기 위해 각 연결을 ‘아들이요’로 유지했습니다.
theological_decisions:
- issue: 문장 머리말의 이중적 구조(‘둘째 환상’과 ‘지혜의 환상’)
  chosen_reading: ‘그가 본 둘째 환상은… 지혜의 환상입니다’로 두 표현을 함께 살렸습니다.
  alternative_readings:
  - 둘째 지혜의 환상
  - 그가 본 두 번째 환상, 곧 지혜의 환상
  rationale: 게즈 본문은 ‘둘째 환상’과 ‘지혜의 환상’을 겹쳐 제시하므로, 하나로 평평하게 만들지 않고 병렬적 강조를 유지했습니다.
  doctrine_reference: 번역 원칙 §원문 우선; §의미의 긴장 보존
