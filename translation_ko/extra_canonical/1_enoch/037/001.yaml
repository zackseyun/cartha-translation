base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
  footnotes:
  - marker: a
    text: Or 'another vision of wisdom.' The Ge'ez adjective can mean 'other' or 'another'; 'second' is chosen here because the heading appears to mark sequence.
    reason: lexical_alternative
  - marker: b
    text: The repeated 'son of' formula is kept to preserve the genealogy exactly as the heading presents it.
    reason: cultural_note
  - marker: c
    text: Or 'The second vision of wisdom that Enoch son of Jared, son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam, saw.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그가 본 둘째 환상은, 야렛의 아들이요[a] 마할랄엘의 아들이요, 가이난의 아들이요, 에노스의 아들이요, 셋의 아들이요, 아담의 아들인 에녹이 본 지혜의 환상입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 ‘야렛의 아들’은 에녹의 계보를 가리키는 반복 공식입니다.
    reason: source_note
  - marker: b
    text: 영어 POB도 계보를 끝까지 보존하며, 이 구절은 서두 표제로서 에녹을 아담까지의 계보 안에 위치시킵니다.
    reason: cross_reference
lexical_decisions:
- source_word: ራእይ / ራእየ
