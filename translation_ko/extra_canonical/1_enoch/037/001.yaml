  rationale: 계보의 반복 공식을 본문대로 보존하기 위해 각 연결을 ‘아들이요’로 유지했습니다.
theological_decisions:
- issue: 문장 머리말의 이중적 구조(‘둘째 환상’과 ‘지혜의 환상’)
  chosen_reading: ‘그가 본 둘째 환상은… 지혜의 환상입니다’로 두 표현을 함께 살렸습니다.
  alternative_readings:
  - 둘째 지혜의 환상
  - 그가 본 두 번째 환상, 곧 지혜의 환상
  rationale: 게즈 본문은 ‘둘째 환상’과 ‘지혜의 환상’을 겹쳐 제시하므로, 하나로 평평하게 만들지 않고 병렬적 강조를 유지했습니다.
