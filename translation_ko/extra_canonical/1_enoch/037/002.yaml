base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
  footnotes:
  - marker: a
    text: Or 'to those who live on the earth.' The Ge'ez reads more literally 'on the dry land.'
    reason: lexical_alternative
  - marker: b
    text: '''Former ones'' and ''latter ones'' likely address earlier and later generations, preserving a broad summons across time.'
    reason: cultural_note
  - marker: c
    text: Or 'in the presence of the Lord of Spirits.'
    reason: lexical_alternative
  - marker: d
    text: Or 'the word of the Holy One that I will speak'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 이것은 내가 들어 올려 말하고 선포하는 지혜의 말씀의 시작입니다. 마른 땅에 거하는 이들아, 들으십시오. 이전 세대들이여, 보십시오 — 내가 거룩한 말씀을 야훼 만군의 주 앞에서 말합니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘마른 땅’은 문자적으로는 ‘건조한 육지’입니다.
    reason: lexical_alternative
  - marker: b
    text: ‘이전 세대들’과 ‘이후 세대들’은 시간 전체를 가로지르는 호칭일 가능성이 큽니다.
    reason: cultural_note
  - marker: c
    text: 또는 ‘영들의 주 앞에서’입니다.
    reason: lexical_alternative
  - marker: d
    text: 또는 ‘내가 말할 거룩한 말씀’입니다.
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ
  english_pob_choice: And this is
  chosen_korean: 그리고 이것은
  alternatives_korean:
  - 그리고 이것
  - 이것은
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 도입부의 지시적·선언적 기능을 살려 한국어에서도 문두의 연결과 강조를 자연스럽게 반영했습니다.
- source_word: ርእሱ
  english_pob_choice: the beginning
  chosen_korean: 시작
  alternatives_korean:
  - 머리
  - 첫부분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역의 ‘머리’보다 담화 도입의 구조를 살리는 ‘시작’이 더 자연스럽고, 본문의 서문 기능을 잘 드러냅니다.
- source_word: ነገረ፡ ጥበብ
  english_pob_choice: the word of wisdom
  chosen_korean: 지혜의 말씀
  alternatives_korean:
  - 지혜의 일
  - 지혜의 담화
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Ge'ez의 ‘말/담화’를 한국어 성서체의 ‘말씀’으로 옮겨 격식을 유지하되, 지혜 전승의 발표문이라는 느낌을 살렸습니다.
- source_word: ዘ*አንሣእኩ፡ እትናገር፡ [እብል፡]
  english_pob_choice: that I lifted up to speak and say
  chosen_korean: 내가 들어 올려 말하고 선포하는
  alternatives_korean:
  - 내가 높이 들어 말하는
  - 내가 말하려고 들어 올린
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘들어 올리다’의 표상을 살리면서도 한국어에서는 어색한 직역을 피하고, 반복 동사의 선포성을 ‘말하고 선포하는’으로 반영했습니다.
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ
  english_pob_choice: to those who dwell on the dry land
  chosen_korean: 마른 땅에 거하는 이들
  alternatives_korean:
  - 땅에 사는 이들
  - 육지에 거하는 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘dry land’의 구체적 이미지를 보존하기 위해 ‘마른 땅’으로 옮겼고, 넓은 지시 대상을 뜻하는 ‘이들’로 청중을 자연스럽게 처리했습니다.
- source_word: ቀደምት
  english_pob_choice: you former ones
  chosen_korean: 이전 세대들이여
  alternatives_korean:
  - 옛사람들이여
  - 먼저 온 이들이여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 순차적 대비를 드러내는 호격으로 풀어, 시간적 선후를 담는 ‘이전 세대들’이 가장 분명하다고 보았습니다.
- source_word: ወርእዩ ደኃርያን
  english_pob_choice: and see, you latter ones
  chosen_korean: 보십시오
  alternatives_korean:
  - 그리고 보십시오
  - 뒤에 오는 이들이여, 보십시오
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 한국어에서는 ‘이전 세대들이여, 보십시오’로 병렬을 묶어 읽히게 하여, 후행 호격을 중복하지 않으면서 명령의 긴박함을 살렸습니다.
- source_word: ነገረ፡ ቅዱሰ
  english_pob_choice: the holy words that I speak
  chosen_korean: 거룩한 말씀
  alternatives_korean:
  - 거룩한 말들
  - 거룩한 말씀들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수식어가 ‘Holy One’의 소유격이 아니라 형용사라는 주해를 반영하여 ‘거룩한 말씀’으로 옮기고, 복수성은 한국어 집합명사로 자연스럽게 처리했습니다.
- source_word: ቅድመ እግዚአ መንፈሳት
  english_pob_choice: before the Lord of Spirits
  chosen_korean: 야훼 만군의 주 앞에서
  alternatives_korean:
  - 영들의 주 앞에서
  - 영들의 주 면전에서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: Enoch의 신적 칭호를 직역하면 ‘영들의 주’가 되지만, 한국어 독자가 주어를 즉시 알아듣도록 ‘주 앞에서’ 구조를 살리되 칭호 본체는 각주 없이 본문에 ‘야훼 만군의 주’로 옮겼습니다.
theological_decisions:
- issue: ‘영들의 주’라는 에녹서 특유의 신적 칭호를 어떻게 처리할지
  chosen_reading: 직역보다 가독성을 우선해 ‘야훼 만군의 주’로 옮기고, 본문 관계는 ‘앞에서’로 유지했습니다.
  alternative_readings:
  - 영들의 주
  - 영의 주
  rationale: 칭호의 낯섦을 완전히 지우지 않으면서도, 한국어 독자가 하나님을 지칭하는 엄중한 종결을 즉시 인식하도록 했습니다. 다만 ‘만군의’는 원문에 없는 확장 요소이므로 엄밀성보다 관용적 신칭호를 택한 부분입니다.
  doctrine_reference: extra-canonical divine title rendering; preserve reverence while avoiding obscurity.
