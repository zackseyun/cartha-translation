  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
  footnotes:
  - marker: a
    text: The Ethiopic wording after 'in those days' is textually difficult in this OCR witness; 'in one place' is a cautious locative rendering.
    reason: textual_variant
  - marker: b
    text: Or 'will fight one another.' The verb likely denotes reciprocal violence.
    reason: lexical_alternative
  - marker: c
    text: 'The final clause is intentionally vivid: the image is of bloodshed so great that it becomes a flowing stream.'
    reason: cultural_note
  - marker: d
    text: Or 'fathers together with their sons will strike one another, and brothers together with their companions; and they will fall in death'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 날들에, 한 곳에서 아버지들은 아들들과 함께 쓰러지고, 형제들은 그들의 동료들과 함께 죽음에 이르며, 그들의 피에서 시냇물이 흐를 때까지 이릅니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘한 곳에서’는 아티오피아어 본문의 난해한 자리표현을 신중하게 옮긴 것입니다.
    reason: textual_variant
  - marker: b
    text: 직역하면 ‘그들의 피로부터’의 뜻으로, 피가 너무 많이 흘러 시냇물을 이루는 과장을 담고 있습니다.
    reason: cultural_note
