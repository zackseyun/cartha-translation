  naturalness: ‘그 날들에’와 ‘한 곳에서’는 격식 있는 묵시문학 문맥에 적절합니다. ‘죽음에 이르며’와 마지막 ‘이릅니다’의 연쇄는 현대 표준 한국어로 어색하며, 특히 무엇이 ‘이르는지’가 불명확합니다. ‘죽음에 쓰러질 것이며’와 ‘그렇게 될 것입니다’로 병렬과 종결을 분명히 하는 편이 자연스럽습니다.
