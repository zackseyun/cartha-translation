base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
  footnotes:
  - marker: a
    text: Or 'his children' for 'his sons'; the Ge'ez term can be broader than male offspring in some contexts.
    reason: lexical_alternative
  - marker: b
    text: '''His honored brother'' may also mean ''his noble brother,'' depending on whether the emphasis is personal honor or social standing.'
    reason: lexical_alternative
translation:
  language: ko
  text: 이는 사람이 자기 아들들[a]에게서도, 또 자기 아들들의 아들들에게서도 손을 거두지 않고 그들을 죽이려고 할 것이기 때문입니다. 또 죄인도 자기 존귀한 형제[b]에게서 손을 거두지 않을 것입니다. 새벽부터 해가 질 때까지 그들은 서로를 죽일 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘자녀들’. 게에즈 용어는 일부 문맥에서 남자 자손보다 더 넓게 쓰일 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘귀한 형제’, ‘고귀한 형제’. 강조점이 개인적 존귀함인지 사회적 지위인지에 따라 달라질 수 있습니다.
    reason: lexical_alternative
