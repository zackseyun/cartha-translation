  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 해당 동사가 단순한 감정적 괴로움보다 지속적이고 폭력적인 가학을 가리키므로, 문맥상 가장 넓고 직접적인 ‘억압하다’를 사용했습니다.
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  english_pob_choice: on the day of fierce distress
  chosen_korean: 괴로운 날에
  alternatives_korean:
  - 극심한 고난의 날에
  - 혹독한 환난의 날에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: POB가 ‘tribulation’의 기술어화를 피한 점을 따라, 직역적이되 한국어로는 자연스러운 ‘괴로운 날’로 옮겨 원문의 고난 강도를 간명하게 드러냈습니다.
- source_word: ታነድድዎሙ በእሳት
  english_pob_choice: burn them with fire
  chosen_korean: 불로 태울 때에
  alternatives_korean:
