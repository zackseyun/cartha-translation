  alternative_readings:
  - ‘하나님께서 너희에게 보응하실 것입니다’처럼 주체를 명시할 수 있습니다.
  - 보응을 단순한 결과로만 중성적으로 번역할 수도 있습니다.
  rationale: 게즈 본문과 POB는 모두 직접적인 심판 선언을 유지하지만, 행위의 보응이 누구에 의해 어떻게 집행되는지는 명시적으로 좁히지 않습니다. 따라서 신학적 긴장을 보존하는 쪽이 원문에 가깝습니다.
  doctrine_reference: Preserve theological tension rather than resolve it; do not over-interpret agency beyond the source wording.
