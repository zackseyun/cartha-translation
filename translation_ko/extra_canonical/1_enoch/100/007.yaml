  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 폭력적 심판 이미지를 완화하지 않기 위해 ‘태우다’를 유지했고, 수단을 나타내는 ‘불로’로 게즈 본문의 직설성을 살렸습니다.
- source_word: ከመ፡ ምግባራቲክሙ
  english_pob_choice: according to your deeds
  chosen_korean: 너희 행위에 따라
  alternatives_korean:
