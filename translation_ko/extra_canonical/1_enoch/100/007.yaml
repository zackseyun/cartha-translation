base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
  footnotes:
  - marker: a
    text: The phrase rendered 'day of fierce distress' is literally a 'day' marked by severe affliction/intensity; 'tribulation' is possible but was avoided in the main text to keep the wording locally grounded rather than tied to later technical usage.
    reason: lexical_alternative
  - marker: b
    text: The verb translated 'oppress' may also be understood as 'afflict' or 'persecute,' depending on how specifically the violence against the righteous is construed.
    reason: lexical_alternative
translation:
  language: ko
  text: 죄인들아[a], 너희에게 화가 있습니다. 너희가 극심한 고난의 날에[b] 의인들을 억압하고 불로 태울 때, 너희는 너희 행위에 따라 보응을 받을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희에게 화가 있습니다’는 죄인들을 향한 예언자적 심판 선언입니다.
    reason: source_note
  - marker: b
    text: 직역하면 강력하고 심한 고난의 날이라는 뜻입니다. 문맥에 따라 ‘극심한 고난의 날’ 또는 ‘혹독한 환난의 날’로 옮길 수 있으나, 본문에서는 후대의 기술적 용법을 피했습니다.
    reason: lexical_alternative
