base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
  footnotes:
  - marker: a
    text: The clause 'which your godlessness has done' is syntactically difficult in English. It likely gathers both the speech and the deeds into one charge and attributes them to the sinners' impious wickedness.
    reason: lexical_alternative
  - marker: b
    text: Or 'in blazing flames of fire you shall burn.'.
    reason: previous_rendering
translation:
  language: ko
  text: 죄인들아, 너희에게 화가 있습니다[a]. 너희 입의 말과 너희 손의 행위 때문에, 곧 너희 불경함이 행한 그것들 때문에, 너희는 불보다 더 뜨거운 화염의 열기 속에서 타게 될 것입니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘너희 불경함이 행한 그것들’이라는 표현은 문법적으로 난해한 원문의 관계절을 옮긴 것입니다. 이 표현은 앞의 ‘입의 말’과 ‘손의 행위’를 함께 가리키는 것으로 이해될 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 또는 ‘불보다 더 타오르는 불꽃 속에서’로 옮길 수 있습니다.
    reason: previous_rendering
