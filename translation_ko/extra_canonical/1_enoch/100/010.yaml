    rationale: 편집 이력에 인용된 Charles 1906의 계속되는 게으즈 본문은 이 절의 나머지 내용을 포함합니다. 이를 생략하면 행위의 조사와 의인들에 대한 심판이라는 핵심 내용을 잃습니다.
  - severity: medium
