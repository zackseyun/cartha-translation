  revised_text: 그리고 이제, 아십시오[a]. 여러분의 행위는 하늘의 천사들과 해와 달과 별들이 여러분의 죄에 관하여 조사할 것입니다. 이는 여러분이 땅에서 의인들에게 심판을 집행하기 때문입니다.
