  source_fidelity: 수록된 절 단위 게으즈 추출문은 ወይእዜኒ፡ አእምሩ፡까지만 담고 있으나, 제공된 편집 이력은 Charles 1906의 1에녹 100:10 전체가 그 뒤에 계속됨을 구체적인 게으즈 본문과 함께 확인합니다. 따라서 현 초안처럼 세 단어만 번역하면 절 전체를 누락하게 됩니다. 복원된 본문에 따라 ‘행위’의 조사, 하늘의 천사들과 해·달·별, 죄, 그리고 의인들에게 심판을 집행하는 일을 모두 반영했습니다.
  naturalness: ‘그리고 이제, 아십시오’는 현대 표준어 합쇼체의 권면·경고 문맥에 자연스럽습니다. 기존 ‘아시오’는 하오체이므로 지정된 합쇼체와 맞지 않습니다. 긴 문장은 한국어에서 주어와 행위자를 분명히 하여 자연스럽게 다듬었습니다.
  terminology: ‘천사’, ‘죄’, ‘의인’, ‘심판’은 본문 및 한국어 성서 문체에서 통용되는 용어입니다. ‘의인들에게 심판을 집행하다’는 원문의 의인들을 향한 심판 행위를 보존하며, 원문에 명시되지 않은 교리적 해석을 더하지 않습니다.
  issues:
