base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
  footnotes:
  - marker: a
    text: The clause rendered 'all those who helped sin descend' is difficult. It may also mean 'those through whom sin came down' or 'those who caused sin to descend.'
    reason: lexical_alternative
  - marker: b
    text: '''Hidden places'' may also be rendered ''secret places,'' suggesting concealed locations where the wicked are rounded up for judgment.'
    reason: lexical_alternative
  - marker: c
    text: Or 'In those days the angels will descend into the hidden places, and they will gather together into one place all those who helped sin descend; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그 날들에 천사들이 숨은 곳들로 내려와, 죄를 끌어내린 이들[a][b][c]을 한곳에 모을 것이며, 지극히 높으신 분께서 심판의 그 날에 일어나 죄인들 가운데서 큰 심판을 집행하실 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 이 절의 게어즈 표현은 ‘죄를 끌어내린 이들’로 옮길 수 있지만, ‘죄를 내려보낸 이들’, ‘죄를 가져온 이들’처럼 더 강하게 원인성을 드러내는 번역도 가능합니다.
    reason: alternative_reading
  - marker: b
    text: ‘숨은 곳들’은 ‘비밀한 곳들’로도 옮길 수 있으며, 악인들이 심판을 위해 모이는 은폐된 장소들을 가리킵니다.
    reason: alternative_reading
  - marker: c
    text: 영어 POB는 본 절을 ‘가운데서 큰 심판을 집행하실 것입니다’로 옮기며, 심판의 공개성과 불가피성을 강조합니다.
    reason: previous_rendering
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  english_pob_choice: In those days
  chosen_korean: 그 날들에
  alternatives_korean:
  - 그때에
  - 그 시절에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 에녹서의 종말론적 시간 공식을 살려, 반복되는 ‘days’의 뉘앙스를 한국어에서도 유지했습니다.
- source_word: ውስተ ምኅባእት
  english_pob_choice: into the hidden places
  chosen_korean: 숨은 곳들로
  alternatives_korean:
  - 비밀한 곳들로
  - 감추인 곳들로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 복수의 은폐된 장소라는 감각을 살리되, 한국어에서 자연스럽고 음산한 결을 주는 표현으로 옮겼습니다.
- source_word: ወይገብእዎሙ በአሐዱ መካን
  english_pob_choice: and they will gather together into one place
  chosen_korean: 한곳에 모을 것이며
  alternatives_korean:
  - 한곳으로 모아들일 것이며
  - 한곳에 집결시킬 것이며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 심판 장면의 강제적 집합을 드러내면서도, 원문의 ‘한 곳’ 이미지를 간결하게 보존했습니다.
- source_word: ለእሉ እለ ይወርደዋ ለኃጢአት
  english_pob_choice: all those who led others into sin
  chosen_korean: 죄를 끌어내린 이들
  alternatives_korean:
  - 죄를 내려보낸 이들
  - 죄를 가져온 이들
  - 죄에 협력한 이들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 기초 어형은 죄와의 연관을 직접 보여 주지만 문법적으로 난해하므로, POB의 해석 흐름을 따르되 ‘끌어내리다’로 하강 이미지를 보존했습니다.
- source_word: ልዑል
  english_pob_choice: the Most High
  chosen_korean: 지극히 높으신 분
  alternatives_korean:
  - 지극히 높으신 이
  - 가장 높으신 분
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 하나님의 호칭으로서의 위엄을 자연스러운 한국어 존칭으로 옮기되, ‘Most High’의 높임 의미를 분명히 했습니다.
- source_word: በይእቲ ዕለት ኵነኔ / ኵነኔ ዐቢየ
  english_pob_choice: on that day of judgment / great judgment
  chosen_korean: 심판의 그 날에 / 큰 심판
  alternatives_korean:
  - 판결의 그 날에 / 중대한 심판
  - 심판 날에 / 엄중한 심판
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘judgment’를 단순한 처벌이 아니라 공식적 심판 행위로 유지하고, ‘great’는 규모와 강도를 함께 드러내는 ‘큰’으로 옮겼습니다.
theological_decisions:
- issue: ‘죄를 끌어내린 이들’의 범주
  chosen_reading: 단순한 일반적 ‘죄인들’보다, 죄의 하강/유입과 연결된 책임 있는 이들을 가리키는 표현으로 유지했습니다.
  alternative_readings:
  - 죄인들
  - 죄를 지은 사람들
  - 죄를 퍼뜨린 사람들
  rationale: 게어즈 원문과 POB의 비평 주석은 이 구절이 단순한 도덕적 범주보다 더 구체적인 인과 관계를 암시함을 보여 주므로, 그 긴장을 평준화하지 않았습니다.
  doctrine_reference: 원문 우선 원칙; 해석의 긴장 보존
- issue: ‘지극히 높으신 분’의 서술 방식
  chosen_reading: 예언적/묵시적 서술을 따라 3인칭 존칭으로 번역했습니다.
  alternative_readings:
  - 지극히 높으신 이
  - 지존자
  rationale: 본문은 하나님을 직접 호명하는 기도문이 아니라 서술문이므로, 한국어에서도 서술적 존칭을 유지하는 것이 문체와 신학적 기능에 맞습니다.
  doctrine_reference: 문맥에 따른 호칭 번역
