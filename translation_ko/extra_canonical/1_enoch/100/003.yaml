    rationale: 원문은 말이 피 속을 이동하며 피가 그 가슴까지 이르는 장면입니다. ‘가슴까지 잠긴 채’로 상태를 명시해야 합니다.
  - severity: low
    issue: 각주 a–d가 본문의 필요한 이문·번역 선택을 적절히 제시하지 못합니다.
    rationale: a는 번역 본문 대신 판정 자체를 단정하고, c는 원문 주석으로 확인되지 않은 해설을 보태며, d는 실질적인 대안 번역이 아닙니다. 현 본문에는 각주 없이도 핵심 의미를 충실히 옮길 수 있습니다.
  - severity: low
