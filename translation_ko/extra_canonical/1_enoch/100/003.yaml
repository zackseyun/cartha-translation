base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/003.yaml
  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
  footnotes:
  - marker: a
    text: The term እንግድዓሁ may denote “its bridle” (equestrian gear) or an anatomical “chest.” The imagery permits either; we render “bridle” for vividness and coherence.
    reason: lexical_alternative
  - marker: b
    text: The form የሐውር is uncertain. It can be read adjectivally (“of whiteness,” i.e., a white horse) or verbally, supplying the motion implied by the line. The parallel with chariots sinking favors an implied motion (“will wade/go”).
    reason: lexical_alternative
  - marker: c
    text: Compare the apocalyptic image of blood reaching horse-bridles in Rev 14:20; the Enochic verse stands on its own terms but employs similar hyperbolic judgment imagery.
    reason: cross_reference
  - marker: d
    text: Or 'And horses will be up to their bridles in the blood of sinners, and chariots will be sunk up to their tops.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 한 말이 죄인들의 피 속을 가슴까지 잠긴 채 걸어갈 것이며, 전차들은 윗부분까지 잠길 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: የሐውር
  english_pob_choice: will walk
  chosen_korean: 걸어갈 것입니다
  alternatives_korean:
  - 갈 것입니다
  - 헤쳐 나아갈 것입니다
  lexicon: Dillmann (Ge'ez)
  rationale: 동사는 단순한 정지 상태가 아니라 물속을 지나 이동하는 동작을 나타내므로, 한국어에서는 ‘걸어가다’로 풀어 원문의 운동성을 살렸습니다.
- source_word: እንግድዓሁ
  english_pob_choice: its chest
  chosen_korean: 자기 가슴
  alternatives_korean:
  - 자기 가슴팍
  - 가슴까지
  - 고삐
  lexicon: Leslau (Ge'ez) / Dillmann (Ge'ez)
  rationale: 기수 장비가 아니라 신체 부위인 ‘가슴’이라는 판정에 따라 직역에 가깝게 옮겼습니다. POB의 ‘bridle’은 본문 판정과 맞지 않으므로 따르지 않았습니다.
- source_word: እስከ
  english_pob_choice: up to
  chosen_korean: …까지
  alternatives_korean:
  - …에 이르러
  - …만큼
  lexicon: Leslau (Ge'ez)
  rationale: 도달 한계를 나타내는 전치사이므로, 한국어에서도 종결점 표시인 ‘까지’가 가장 자연스럽습니다.
- source_word: ውስተ ደመ ኃጥኣን
  english_pob_choice: in the blood of sinners
  chosen_korean: 죄인들의 피 속에서
  alternatives_korean:
  - 죄인들의 피 가운데서
  - 죄인들의 피 안에서
  lexicon: Leslau (Ge'ez)
  rationale: ‘혈액/피’라는 매체 속으로 들어가는 장면을 살려 ‘피 속에서’로 옮겼고, ‘죄인들’은 윤리적 범주를 분명히 유지합니다.
- source_word: ሰረገላት ... ትሰጠም
  english_pob_choice: chariots will sink up to their tops
  chosen_korean: 전차들은 꼭대기까지 잠길 것입니다
  alternatives_korean:
  - 전차들은 윗부분까지 가라앉을 것입니다
  - 전차들은 꼭대기까지 묻힐 것입니다
  lexicon: Leslau (Ge'ez) / Dillmann (Ge'ez)
  rationale: ‘잠기다’는 물속에 가라앉아 보이지 않게 되는 이미지를 전달하며, ‘꼭대기까지’는 침수의 정도를 보존합니다.
theological_decisions:
- issue: 죄인들에 대한 종말론적 심판 이미지
  chosen_reading: ‘죄인들’로 직역해 도덕적 책임을 전면에 두었습니다.
  alternative_readings:
  - ‘유죄한 자들’
  - ‘범한 자들’
  rationale: 본절은 심판의 공포와 죄의 결과를 묘사하므로, 법정 용어보다 도덕적 범주가 더 직접적입니다.
  doctrine_reference: 'POB contested terms policy: moral categories are rendered plainly unless the context clearly demands legal nuance.'
