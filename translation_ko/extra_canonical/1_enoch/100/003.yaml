    rationale: 전차의 잠김 정도에는 ‘윗부분까지’가 현대 한국어에서 더 자연스럽습니다.
  revised_text: 그리고 한 말이 죄인들의 피 속을 가슴까지 잠긴 채 걸어갈 것이며, 전차들은 윗부분까지 잠길 것입니다.
