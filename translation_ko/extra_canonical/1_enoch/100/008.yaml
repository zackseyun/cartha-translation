  - 단순한 내면적 불안에 대한 경고
  rationale: 서두의 화 선언, 대상의 성격 규정, 도움받지 못한다는 결말이 함께 예언적 정죄의 구조를 이루므로, 이를 흐리지 않고 그대로 살렸습니다.
  doctrine_reference: 심판 경고와 예언적 탄식을 평탄화하지 않고 보존하는 번역 원칙
