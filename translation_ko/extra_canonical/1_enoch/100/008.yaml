base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
  footnotes:
  - marker: a
    text: The verb rendered 'keep watch' may also suggest lying in wait or being intent on something; the sense here is deliberate vigilance directed toward evil.
    reason: lexical_alternative
  - marker: b
    text: Or 'fear will overtake you.' The underlying verb can mean 'find,' 'reach,' or 'overtake.'
    reason: lexical_alternative
  - marker: c
    text: Or 'keep watch so as to devise evil'.
    reason: previous_rendering
translation:
  language: ko
  text: 마음이 완고한 여러분에게 화가 있을 것입니다. 여러분은 악을 꾸미려고 깨어 있지만,[a] 두려움이 여러분에게 닥칠 것이며,[b] 여러분을 도와줄 사람은 아무도 없을 것입니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘깨어 있다’로 옮긴 말은 ‘깨어 있다’, ‘경계하다’, 또는 어떤 일을 하려고 주의를 기울이다라는 뜻도 될 수 있습니다. 여기서는 악을 꾸미기 위한 의도적인 각성을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘두려움이 여러분을 찾을 것입니다’에 가깝습니다. 이 동사는 ‘찾다’, ‘미치다’, 또는 ‘덮치다’라는 뜻도 될 수 있습니다.
    reason: lexical_alternative
