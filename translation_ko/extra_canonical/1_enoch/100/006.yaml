  source_fidelity: 현 초안은 ብዕሎሙ를 ‘재물’로 옮기고, 그것이 사람들을 구원하지 못한다는 문장 구조를 보존한 점에서 최근 영어 감사 이력과 게에즈어 구문에 부합합니다. 다만 ‘자기들의 죄의 파멸’은 한국어에서 ‘죄 자체가 멸망한다’는 뜻으로도 읽혀, በመዳቀ ኃጢአቶሙ의 재난·멸망 맥락을 충분히 전달하지 못합니다. ‘그들의 죄로 말미암은 멸망’으로 옮기면 원문의 관계를 자연스럽게 드러내면서도 과도한 신학적 해석을 피합니다. 불확실한 እሙነ는 최신 교정의 판단에 따라 별도 목적어로 보충하지 않았습니다.
  naturalness: ‘땅의 모든 자녀’는 묵시문학의 관용적 표현을 보존할 수 있으나, 조사와 문장 연결을 다듬는 것이 자연스럽습니다. ‘자기들의 죄의 파멸에서 자신들을’의 반복도 ‘그들의 죄로 말미암은 멸망에서 그들을’로 정리할 수 있습니다.
  terminology: ‘지혜로운 사람들’, ‘땅의 모든 자녀들’, ‘이 책의 모든 내용’, ‘재물’, ‘구원’은 현대 격식체에서 적절합니다. 독자용 주석으로는 번역 대안과 무관한 편집 이력(현행 b 주석)을 남기지 않는 것이 바람직합니다.
