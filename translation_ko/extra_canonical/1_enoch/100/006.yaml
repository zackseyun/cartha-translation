base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
  footnotes:
  - marker: a
    text: The final phrase is difficult. It may also be rendered 'by casting off their sins' or 'by diminishing their sins.' The main text chooses 'by denying their sins' because the verse emphasizes failed self-deliverance through evasion of guilt.
    reason: lexical_alternative
  - marker: b
    text: Or 'And the wise among men will see'.
    reason: previous_rendering
  - marker: c
    text: Or 'they cannot save themselves by denying their sins'.
    reason: previous_rendering
translation:
  language: ko
  text: 지혜로운 사람들은 보게 되고, 땅의 모든 자녀들은 이 책의 모든 내용을 깨닫게 되며, 그들은 자기들의 재물이 그들의 죄로 말미암은 멸망에서 그들을 구원할 수 없다는 것을 알게 될 것입니다.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰብአ ጠቢባን
  english_pob_choice: wise men
  chosen_korean: 지혜로운 사람들
  alternatives_korean:
  - 지혜로운 남자들
  - 지혜로운 자들
  - 지혜자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 인간 집단을 가리키는 표현으로, 성별을 굳이 부각하지 않으면서도 ‘wise men’의 인칭성과 집단성을 자연스럽게 살렸습니다.
- source_word: ውሉደ ምድር
  english_pob_choice: the children of the earth
  chosen_korean: 땅의 모든 자녀
  alternatives_korean:
  - 땅의 자녀들
  - 땅의 사람들
  - 땅에 속한 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시문학적 직유를 살리기 위해 직역에 가깝게 유지하되, 한국어에서의 가독성을 위해 ‘모든’을 덧붙였습니다.
- source_word: ኵሎ ነገረ ዛቲ መጽሐፍ
  english_pob_choice: every matter of this book
  chosen_korean: 이 책의 모든 내용
  alternatives_korean:
  - 이 책의 모든 일
  - 이 책의 모든 말
  - 이 책에 있는 모든 것
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ነገረ의 폭넓은 의미를 살리면서도, 한국어 문맥에서는 ‘내용’이 가장 자연스럽고 포괄적입니다.
- source_word: ብዕሎሙ አድኅኖቶሙ በመዳቀ ኃጢአቶሙ
  english_pob_choice: their wealth cannot save them from the destruction of their sins
  chosen_korean: 자기들의 재물이 자기들의 죄의 파멸에서 자신들을 구원하지 못함
  alternatives_korean:
  - 자기들의 재물이 자기들의 죄의 멸망에서 자신들을 구원하지 못함
  - 자기들의 재물이 자기들의 죄가 무너지는 데서 자신들을 건지지 못함
  - 자기들의 재물이 자기들의 죄의 파괴에서 자신들을 구원하지 못함
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 최신 수정을 따라, 주어는 ‘재물’이고 핵심은 재물이 죄의 파멸/파괴에서 사람을 구할 수 없다는 뜻입니다. ‘구원하지 못함’은 반대 구조를 그대로 보존합니다.
theological_decisions:
- issue: 마지막 절의 의미를 회개 촉구로 완화할지, 재물로는 자기 구원이 불가능하다는 경고로 읽을지
  chosen_reading: 재물은 죄의 파멸에서 사람을 구원하지 못한다는 자기구원의 불가능성 경고로 옮겼습니다.
  alternative_readings:
  - 회개하여 죄를 버리라는 권고로 읽을 수 있습니다.
  - 죄를 부정하거나 축소하는 인간의 변명은 사람을 구원하지 못한다는 뜻으로 읽을 수 있습니다.
  rationale: 최신 교정이 지적하듯 `ብዕሎሙ`는 ‘그들의 재물’이고, 문맥은 재산이 심판을 막아주지 못한다는 경고에 가깝습니다. 원문의 긴장을 보존하기 위해 도덕화하지 않았습니다.
  doctrine_reference: Preserve theological tension rather than smoothing the source into a more familiar moralizing paraphrase.
