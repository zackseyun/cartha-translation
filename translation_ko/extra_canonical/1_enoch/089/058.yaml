base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
  footnotes:
  - marker: a
    text: '''Into the hand'' is a literal idiom for being delivered into the power or control of another.'
    reason: lexical_alternative
  - marker: b
    text: The three verbs 'devoured,' 'swallowed up,' and 'destroyed' are retained as a cumulative sequence rather than reduced to a single English verb, to preserve the verse's escalating judgment imagery.
    reason: cultural_note
  - marker: c
    text: Or 'And that one kept still while he watched, and he rejoiced because they were devoured and swallowed up and destroyed'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그것들을 보면서 잠잠히 있었고[a], 그것들이 먹히고 삼켜지고 끌려가는 것을 보고 기뻐하였으며[b], 그것들을 모든 짐승들의 손에 음식이 되도록 내주었습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘손’은 여기서 단순한 신체 부위가 아니라, 누군가의 권세나 통제 아래에 넘겨졌음을 나타내는 셈어적 관용구입니다.
    reason: lexical_alternative
  - marker: b
    text: 세 동사 ‘먹히고’, ‘삼켜지고’, ‘끌려가는’은 하나의 뜻으로 줄이지 않고, 심판이 점점 강해지는 누적 이미지를 살렸습니다.
    reason: cultural_note
lexical_decisions:
- source_word: አርመመ
  english_pob_choice: kept still
  chosen_korean: 잠잠히 있었고
  alternatives_korean:
  - 가만히 있었고
  - 침묵하고 있었고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 본 동사는 말하지 않음과 함께 정지된 상태를 뜻하므로, 서사적 흐름을 살리면서도 과도하게 관용적이지 않은 ‘잠잠히 있었다’를 택했습니다.
- source_word: እንዘ ይሬኢ
  english_pob_choice: while he watched
  chosen_korean: 그것들을 보면서
  alternatives_korean:
  - 그가 지켜보는 동안
  - 보는 가운데
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동시적 행위를 나타내는 구문이므로 한국어에서는 자연스러운 동시 진행 표현인 ‘보면서’로 옮겼습니다.
- source_word: ተበልዑ / ተውሕጡ / ተሀይዱ
  english_pob_choice: were devoured and swallowed up and carried off
  chosen_korean: 먹히고 삼켜지고 끌려가는
  alternatives_korean:
  - 먹히고 삼켜지고 사라지는
  - 먹히고 삼켜지고 빼앗겨 가는
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 세 동사의 누적적 심판 이미지를 유지하되, 마지막 동사는 ‘snatched away/ carried off’의 강한 이동·탈취감을 살리기 위해 ‘끌려가는’으로 옮겼습니다.
- source_word: ኃደጎሙ ውስተ እዴ ኵሎሙ አራዊት
  english_pob_choice: he abandoned them into the hand of all the beasts
  chosen_korean: 그것들을 모든 짐승들의 손에 … 내주었습니다
  alternatives_korean:
  - 그것들을 모든 짐승들의 손에 … 버려 두었습니다
  - 그것들을 모든 짐승들의 권세에 … 맡겼습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘손에’는 셈어적 관용구로서 지배·권세를 뜻하므로 직역을 유지했고, ‘내주다’는 의도적 방치와 넘겨줌의 뉘앙스를 함께 살립니다.
- source_word: ለመብልዕ
  english_pob_choice: for food
  chosen_korean: 음식이 되도록
  alternatives_korean:
  - 먹이가 되도록
  - 먹을 것이 되도록
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 목적/결과를 나타내는 표현이므로, 포식의 이미지를 직접 드러내는 ‘음식이 되도록’으로 자연스럽게 옮겼습니다.
theological_decisions:
- issue: 심판의 동작을 단순한 방치로 볼지, 적극적 인도/넘겨줌으로 볼지
  chosen_reading: 그것들을 모든 짐승들의 손에 음식이 되도록 내주었습니다.
  alternative_readings:
  - 그것들을 모든 짐승들의 손에 버려 두었습니다.
  - 그것들을 모든 짐승들의 손에 맡겼습니다.
  rationale: 게에즈의 ‘떠나게 하다/내버려 두다’와 ‘손에’라는 관용구를 함께 살려, 단순 방치보다 더 강한 심판적 넘겨줌을 드러냈습니다.
  doctrine_reference: 원문이 허락하는 심판의 강도를 보존하고, 이후 신학적 해석을 번역에서 미리 약화하지 않습니다.
