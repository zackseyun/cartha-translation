  naturalness: 합쇼체와 문체 수준은 적절합니다. 그러나 각주 a의 앵커가 ‘잠잠히 있었고’에 붙어 있으면서 내용은 뒤의 ‘손’ 관용구를 설명하므로, 독자가 오해하지 않도록 ‘손에’ 뒤로 옮겨야 합니다. ‘음식’보다 포식 장면에서는 ‘먹이’가 더 자연스럽고 선명합니다.
  terminology: ‘짐승’, ‘손에’, ‘내주었습니다’는 이 우화적·성서적 문맥에 적합합니다. ‘먹히고 삼켜지고 끌려가다’는 세 동사의 누적을 보존합니다. ‘먹이’는 ለመብልዕ의 ‘for food’를 자연스러운 한국어 포식 표현으로 옮긴 것입니다.
