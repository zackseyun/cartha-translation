base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
  footnotes:
  - marker: a
    text: Or 'by the command of the Lord.' The Ge'ez phrase can denote action undertaken in response to divine speech or command.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'made them hear' is retained close to the Ge'ez. It likely means that the wolves were compelled to listen to what the two sheep said.
    reason: lexical_alternative
  - marker: c
    text: Or 'would no longer ravage them'—the final object is specified as 'the sheep' in the verse, clarifying the wolves' predatory action.
    reason: lexical_alternative
  - marker: d
    text: Or 'made them hear, so that from then on they would no longer ravage'.
    reason: previous_rendering
translation:
  language: ko
  text: 한 양이 야훼의 말씀으로 늑대들에게 갔고, 또 다른 양이 그를 만나 함께 갔습니다. 두 양은 함께 그 늑대들의 모임에 들어가 그들에게 말하고, 그들에게 경고하여, 이제부터는 양들을 더 이상 해치지 말게 하였습니다.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게에즈 표현은 단순히 ‘말씀’에 응답했다는 뜻을 넘어, 신적 권위에 따른 파견·명령의 뉘앙스를 가질 수 있습니다.
    reason: source_note
  - marker: b
    text: 게에즈 관용구는 직역하면 ‘듣게 하다’에 가깝지만, 문맥상 ‘경고하다’의 기능을 더 분명히 드러냅니다.
    reason: lexical_alternative
  - marker: c
    text: 마지막 목적절은 늑대들이 이후에는 양들을 더 이상 해치지 않도록 하는 뜻입니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  english_pob_choice: sheep
  chosen_korean: 양
  alternatives_korean:
  - 양들
  - 양 한 마리
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 상징적 동물 이미지로서 성별·연령을 특정하지 않는 일반명사 ‘양’이 가장 자연스럽고, 반복되는 표상을 유지합니다.
- source_word: አዝእብት
  english_pob_choice: wolves
  chosen_korean: 늑대들
  alternatives_korean:
  - 이리들
  - 사나운 짐승들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 포식성 이미지를 직접 살리기 위해 ‘늑대들’로 옮겼습니다. 완곡한 표현보다 원문의 위협성을 보존합니다.
- source_word: በቃለ፡ እግዚእ
  english_pob_choice: at the word of the Lord
  chosen_korean: 야훼의 말씀으로
  alternatives_korean:
  - 주님의 말씀으로
  - 야훼의 명령으로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 표현은 단순 발화보다 신적 권위에 근거한 파견을 뜻하므로, 본문 전승의 신학적 무게를 살려 ‘야훼의 말씀으로’로 번역했습니다.
- source_word: ወአስምዑ ዲቤሆሙ
  english_pob_choice: made them hear
  chosen_korean: 그들에게 경고하여
  alternatives_korean:
  - 그들이 듣게 하여
  - 그들에게 듣게 하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 게에즈 관용구의 결과는 단순 청각 유발보다 권고·경고의 기능을 띱니다. 따라서 의미를 드러내되, 본문의 금지적 목적을 선명히 하는 ‘경고하여’를 택했습니다.
- source_word: ኢይግሥሥዎሙ
  english_pob_choice: they should not ravage the sheep
  chosen_korean: 양들을 더 이상 해치지 말게
  alternatives_korean:
  - 양들을 더 이상 황폐하게 하지 말게
  - 양들을 더 이상 짓밟지 말게
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 동물 상징 문맥에서 ‘ravage’의 포식적 폭력을 살리면서도 한국어로 과도하게 문학화하지 않기 위해 ‘해치다’를 선택했습니다. ‘더 이상’은 계속성을 드러냅니다.
theological_decisions:
- issue: 신적 호칭 እግዚእ의 한국어 표기
  chosen_reading: 야훼
  alternative_readings:
