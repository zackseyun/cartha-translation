  - 주
  rationale: 이 텍스트는 신적 권위를 가리키는 호칭을 사용하므로 프로젝트 기본값에 따라 ‘야훼’를 유지했습니다. 이는 독자가 출처의 신학적 지시 대상을 분명히 보게 합니다.
  doctrine_reference: 'POB glossary: YHWH / እግዚእ in covenantal-divine reference rendered as 야훼'
