  source_fidelity: 원문의 እግዚእ는 여기서 일반적인 신적 호칭인 ‘주님/the Lord’에 해당하며, 본문 자체에 야훼라는 고유한 신명이 명시되어 있지 않습니다. 따라서 ‘야훼’는 과도한 특정화입니다. 또한 ወአስምዑ ዲቤሆሙ는 직역적으로는 ‘그들이 듣게 하다’에 가깝지만, ‘그들에게 경고하다’라는 관용적 이해도 가능한 논쟁적 표현입니다. 본문에서는 이를 과도하게 확정하지 않고 ‘듣게 하다’로 보존하는 편이 안전합니다.
  naturalness: 초안의 ‘그들에게 경고하여, 이제부터는 … 말게 하였습니다’는 쉼표와 연결 어미의 결합이 다소 부자연스럽고, 늑대들이 금지를 실행하는 주체라는 관계도 흐려집니다. 목적절을 ‘… 말아야 한다는 것을 듣게 하였습니다’로 풀면 현대 표준 한국어 합쇼체로 자연스럽고 원문의 인과 관계를 유지합니다.
  terminology: ‘주님의 말씀에 따라’는 원문의 ‘at/by the word of the Lord’를 자연스럽게 옮기면서도 ‘야훼’로 신명을 특정하지 않습니다. ‘양’, ‘늑대들’, ‘모임’은 지속되는 동물 표상과 집단성을 적절히 유지합니다. ‘해치지 말아야 한다’는 포식적 폭력을 다소 넓게 보존하는 안전한 번역입니다.
