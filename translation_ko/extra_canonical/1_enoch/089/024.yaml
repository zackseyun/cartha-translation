  - 수로
  - 물의 통로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시되는 것은 물의 일반 개념이 아니라 갈라질 수 있는 한정된 물의 공간이므로, ‘물웅덩이’로 옮겨 시각적 이미지와 반복을 살렸습니다.
