  - 찢어졌으며
  - 쪼개졌으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 갈라짐의 급격한 분리를 드러내면서도 한국어 문맥에서 자연스럽게 들리도록 ‘갈라졌으며’로 옮겼습니다.
- source_word: በቅድመ ገጾሙ
  english_pob_choice: before their faces
  chosen_korean: 그들의 얼굴 앞
  alternatives_korean:
  - 그들 앞
  - 그들 앞쪽에
  - 그들의 얼굴 앞에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역에 가까운 ‘얼굴 앞’을 유지해 꿈/환시의 구체성을 보존했고, POB의 해석 주석처럼 단순히 ‘그들 앞’으로 평평하게 만들지 않았습니다.
- source_word: እግዚኦሙ
  english_pob_choice: their Lord
  chosen_korean: 그들의 주인
  alternatives_korean:
  - 그들의 주님
  - 그들의 주
  - 그들의 통치자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단락은 동물 비유 안에서 양 떼의 지도자를 가리키는 표현이므로, 신적 호칭으로 고정하지 않고 서술층을 살릴 수 있는 ‘주인’을 택했습니다.
- source_word: ወቆመ
  english_pob_choice: stood
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 멈춰 있었습니다
  - 자리를 지켰습니다
  - 서 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 물에 대해서도 ‘서 있다’가 반복되지만, 두 번째 절에서는 주어가 ‘그들의 주인’이므로 동일 동사를 살려 대조와 병행을 드러냈습니다.
theological_decisions:
- issue: ‘their Lord’의 지시 대상
  chosen_reading: 이 절의 ‘그들의 주인’은 환시 속 양 떼의 인도자를 가리키며, 이 구절만으로 곧바로 하나님 호칭으로 확정하지 않았습니다.
  alternative_readings:
  - 하나님을 직접 가리키는 주님
  - 지도자와 신적 인도가 겹쳐지는 의도적 이중 의미
  rationale: 바로 앞뒤 문맥이 인도 행위와 동물 비유를 함께 사용하므로, 원문 층위를 유지해 해석을 닫지 않는 것이 더 충실합니다.
  doctrine_reference: 원문이 허용하는 비유적 층위를 보존하고, 번역에서 과잉 해석으로 단정하지 않습니다.
