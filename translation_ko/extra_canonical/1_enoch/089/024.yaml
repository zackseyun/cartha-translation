  naturalness: ‘그들의 얼굴 앞 여기와 저기에’ 및 ‘그들 가운데에, 그리고 늑대들 가운데에’는 현대 표준어로 부자연스럽고 의미 관계도 흐립니다. ‘그들 앞 양쪽에’와 ‘그들과 늑대들 사이에’가 자연스럽고 정확합니다. 합쇼체에 맞추어 주어인 ‘주인’에는 ‘인도하시면서/서 계셨습니다’를 사용했습니다.
  terminology: ‘그들의 주인’은 원문의 소유·권위 관계를 보존하며, ‘주님’으로 신학적으로 확정하지 않습니다. ‘물웅덩이’는 제공된 영어 POB의 최신 확정문 및 현 번역의 어휘 선택과 일치하게 유지하되, 각주에서 가능한 ‘수로/물길’의 뉘앙스를 밝혔습니다.
