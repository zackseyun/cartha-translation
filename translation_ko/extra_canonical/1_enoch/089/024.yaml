base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
  footnotes:
  - marker: a
    text: Or 'watercourse' or 'channel of water.' The Ge'ez expression points to a bounded course of water rather than water in general.
    reason: lexical_alternative
  - marker: b
    text: The phrase 'before their faces' is more literally 'before their faces'; the English could also be simplified to 'before them.'
    reason: lexical_alternative
  - marker: c
    text: The final clause likely means that the standing water formed a barrier separating the flock from the wolves.
    reason: cultural_note
  - marker: d
    text: Or 'and before their lord, while he was leading them; and it stood between them and between the wolves.'.
    reason: previous_rendering
  - marker: e
    text: Or 'water-channel'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 물웅덩이는 갈라졌으며, 물은 그들의 얼굴 앞 여기와 저기에 서 있었습니다. 그리고 그들의 주인이 그들을 이끌고 있는 동안 그들 가운데에, 그리고 늑대들 가운데에 서 있었습니다.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 직역하면 ‘물의 통로/수로’에 가깝습니다. 여기서는 한정된 물의 공간이라는 점을 살려 ‘물웅덩이’로 옮겼습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그들의 얼굴 앞’은 더 평이하게 ‘그들 앞’로도 옮길 수 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 뒤 문맥상 물은 양 떼와 늑대들 사이를 가로막는 장벽으로 그려집니다.
    reason: cultural_note
  - marker: d
    text: ‘그들의 주인’은 이 구절 안에서 환시의 동물 비유에 속한 인도자를 가리키는 표현일 수 있습니다.
    reason: theological_note
lexical_decisions:
- source_word: ዐይገ ማይ
  english_pob_choice: pool of water
  chosen_korean: 물웅덩이
  alternatives_korean:
  - 물길
  - 수로
  - 물의 통로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지시되는 것은 물의 일반 개념이 아니라 갈라질 수 있는 한정된 물의 공간이므로, ‘물웅덩이’로 옮겨 시각적 이미지와 반복을 살렸습니다.
- source_word: ተሠጠ
  english_pob_choice: was split
  chosen_korean: 갈라졌으며
  alternatives_korean:
  - 나뉘었으며
  - 찢어졌으며
  - 쪼개졌으며
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 갈라짐의 급격한 분리를 드러내면서도 한국어 문맥에서 자연스럽게 들리도록 ‘갈라졌으며’로 옮겼습니다.
- source_word: በቅድመ ገጾሙ
  english_pob_choice: before their faces
  chosen_korean: 그들의 얼굴 앞
  alternatives_korean:
  - 그들 앞
  - 그들 앞쪽에
  - 그들의 얼굴 앞에
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직역에 가까운 ‘얼굴 앞’을 유지해 꿈/환시의 구체성을 보존했고, POB의 해석 주석처럼 단순히 ‘그들 앞’으로 평평하게 만들지 않았습니다.
- source_word: እግዚኦሙ
  english_pob_choice: their Lord
  chosen_korean: 그들의 주인
  alternatives_korean:
  - 그들의 주님
  - 그들의 주
  - 그들의 통치자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 단락은 동물 비유 안에서 양 떼의 지도자를 가리키는 표현이므로, 신적 호칭으로 고정하지 않고 서술층을 살릴 수 있는 ‘주인’을 택했습니다.
- source_word: ወቆመ
  english_pob_choice: stood
  chosen_korean: 서 있었습니다
  alternatives_korean:
  - 멈춰 있었습니다
  - 자리를 지켰습니다
  - 서 있었습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 물에 대해서도 ‘서 있다’가 반복되지만, 두 번째 절에서는 주어가 ‘그들의 주인’이므로 동일 동사를 살려 대조와 병행을 드러냈습니다.
theological_decisions:
- issue: ‘their Lord’의 지시 대상
  chosen_reading: 이 절의 ‘그들의 주인’은 환시 속 양 떼의 인도자를 가리키며, 이 구절만으로 곧바로 하나님 호칭으로 확정하지 않았습니다.
  alternative_readings:
  - 하나님을 직접 가리키는 주님
  - 지도자와 신적 인도가 겹쳐지는 의도적 이중 의미
  rationale: 바로 앞뒤 문맥이 인도 행위와 동물 비유를 함께 사용하므로, 원문 층위를 유지해 해석을 닫지 않는 것이 더 충실합니다.
  doctrine_reference: 원문이 허용하는 비유적 층위를 보존하고, 번역에서 과잉 해석으로 단정하지 않습니다.
