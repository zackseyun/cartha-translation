base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
  footnotes:
  - marker: a
    text: The phrase rendered 'every kindred of the nations' is difficult. It may also be understood more generally as 'every sort' or 'every class,' but the word for 'nations/peoples' is present in the Ge'ez witness.
    reason: lexical_alternative
  - marker: b
    text: Several animal names in this verse are uncertain in exact species identification; alternatives include jackals for 'hyenas' or 'foxes,' hawks for 'falcons,' and crows for 'ravens.'
    reason: lexical_alternative
  - marker: c
    text: Or 'squirrels'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 들의 짐승들과 새들을 낳기 시작하였으며, 그들 가운데에서 온갖 부류의 민족들이[a] 나왔습니다. 곧 사자들, 표범들, 이리들, 개들, 하이에나들, 들멧돼지들, 여우들, 산토끼들[c], 돼지들, 매들, 독수리들, 솔개들, 큰독수리들, 까마귀들이었습니다[b]. 그리고 그들 한가운데에서 흰 수소 한 마리가 태어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘온갖 부류의 민족들’로 옮긴 표현은 해석하기 어렵습니다. 더 넓게는 ‘온갖 종류’ 또는 ‘온갖 부류’로 이해할 수도 있으나, 게에즈어 본문에는 ‘민족들/백성들’을 뜻하는 말이 들어 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 목록의 몇몇 동물 이름은 정확한 종의 식별이 확실하지 않습니다. 예를 들어 ‘하이에나들’은 ‘자칼들’, ‘여우들’은 ‘자칼들’, ‘매들’은 ‘새매들’, ‘까마귀들’은 ‘큰까마귀들’로 옮길 가능성도 있습니다.
    reason: lexical_alternative
  - marker: c
    text: 게에즈어 이 동물명은 이전 번역 전통에서 다른 동물로 이해된 적도 있으나, 어휘학적으로는 ‘산토끼들’ 또는 ‘들토끼들’로 보는 것이 더 타당합니다.
    reason: textual_variant
