theological_decisions:
- issue: 비전의 상징 언어를 해석적으로 풀어 쓰지 않을지 여부
  chosen_reading: ‘목자들’과 ‘양들’을 그대로 유지해 상징을 보존했습니다.
  alternative_readings:
  - 목자들을 통치자들로, 양들을 백성으로 풀어 쓰기
  - 상징 의미를 본문에 덧붙여 설명하기
  rationale: 이 장면은 일관된 예언적 상징을 통해 전달되므로, 본문 차원에서는 상징을 해체하지 않는 편이 원문의 힘과 독자의 이해를 더 잘 보존합니다.
  doctrine_reference: 1 Enoch의 환상적·묵시적 서술 방식 보존
- issue: ‘그들의 동료들’의 모호성을 어떻게 처리할지 여부
  chosen_reading: ‘그들의 동료들’로 직역해 모호성을 보존했습니다.
  alternative_readings:
  - 그들과 함께한 자들
  - 그들의 동반자들
  - 목자들과 관련된 무리
  rationale: 원문과 영어 POB 모두 이 표현을 다소 불확실하게 다루므로, 해석을 좁히지 않고 열린 형태로 옮겼습니다.
  doctrine_reference: 불확실한 어휘의 의미 범위를 본문에서 과도하게 특정하지 않음
