base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
  footnotes:
  - marker: a
    text: The phrase rendered 'their companions' is somewhat uncertain; it likely refers to those associated with the shepherds.
    reason: lexical_alternative
  - marker: b
    text: The Ethiopic text repeats the number seventy in the address ('all seventy of you'). The translation brings out the distributive sense as 'each of you' after already stating 'seventy shepherds.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그가 칠십 명의 목자들을 불러 그 양들을 그들에게 넘겨 주어 그들을 치게 하였습니다. 그리고 목자들과 그들의 동료들에게 말하였습니다. “이제부터 너희 각자는 양들을 치고, 내가 너희에게 명하는 것은 모두 행하십시오.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그들의 동료들’에 해당하는 표현은 다소 불확실하며, 목자들과 관련된 자들을 가리키는 것으로 보입니다.
    reason: lexical_alternative
  - marker: b
    text: 원문은 앞서 ‘칠십’을 말한 뒤 여기서도 분배적 의미를 다시 드러내므로, 이를 ‘너희 각자’로 옮겼습니다.
    reason: lexical_alternative
