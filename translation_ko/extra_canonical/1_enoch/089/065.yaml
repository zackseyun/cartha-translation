- from: 그리고 내가 보니, 그 목자들이 그들의 때에 풀을 뜯기더니, 곧 그들에게 명령된 것보다 훨씬 더 많이 죽이고 멸하며, 그 양들을 사자들의 손에 버려 두었습니다.[a][b]
  to: 그리고 나는 그 목자들이 정해진 때에[a] 양 떼를 돌보다가, 그들에게 명령된 것보다 훨씬 더 많이 죽이고 멸하기 시작했으며, 그 양들을 사자들의 손에 내버려 두었습니다.[b]
