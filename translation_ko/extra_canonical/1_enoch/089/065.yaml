  rationale: 게에즈 본문과 영어 POB의 주석 흐름은 ‘위임된 권한의 남용’을 가리키므로, 그 긴장을 약화하지 않고 초과성을 분명히 살렸습니다.
  doctrine_reference: 위임된 권한의 남용이라는 예언적/심판적 긴장을 보존합니다.
