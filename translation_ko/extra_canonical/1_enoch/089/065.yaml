  - 명령받은 것보다 더 많이
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘명령/지시의 범위를 넘어서’라는 초과 의미를 분명히 드러내기 위해 비교 구문으로 옮겼습니다.
- source_word: ኃደጉ ... ውስተ እደ አናብስት
  english_pob_choice: they abandoned those sheep into the hand of the lions
  chosen_korean: 그 양들을 사자들의 손에 버려 두었습니다
  alternatives_korean:
  - 그 양들을 사자들의 손에 넘겼습니다
