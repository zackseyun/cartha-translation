  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘into the hand of’의 관용적 의미를 살리되, 책임 있는 방치를 나타내는 ‘버려 두다’로 번역했습니다.
theological_decisions:
- issue: 목자들의 행위가 위임된 권한 안인지, 그보다 초과한 것인지
  chosen_reading: 목자들은 자신들에게 명령된 범위를 훨씬 넘어 죽이고 멸했습니다.
  alternative_readings:
  - 명령된 범위 안에서 행했습니다
  - 단지 양만 더 많이 죽였습니다
  rationale: 게에즈 본문과 영어 POB의 주석 흐름은 ‘위임된 권한의 남용’을 가리키므로, 그 긴장을 약화하지 않고 초과성을 분명히 살렸습니다.
  doctrine_reference: 위임된 권한의 남용이라는 예언적/심판적 긴장을 보존합니다.
