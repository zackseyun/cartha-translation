  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 정해진 기간이나 지정된 때를 가리키는 표현이므로, 한국어에서는 가장 자연스럽게 ‘그들의 때에’로 옮겼습니다.
