base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
  footnotes:
  - marker: a
    text: Or 'in their time.' The phrase indicates the appointed period of the shepherds' activity.
    reason: lexical_alternative
  - marker: b
    text: Literally, 'from their command' or 'beyond their command'—that is, beyond what had been ordered for them.
    reason: lexical_alternative
  - marker: c
    text: Or 'many beyond what had been commanded them'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 내가 보니, 그 목자들이 그들의 때에 풀을 뜯기더니, 곧 그들에게 명령된 것보다 훨씬 더 많이 죽이고 멸하며, 그 양들을 사자들의 손에 버려 두었습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘그들의 때에’. 이 구절은 목자들의 활동에 정해진 기간을 가리킵니다.
    reason: lexical_alternative
  - marker: b
    text: 직역하면 ‘그들의 명령에서’ 또는 ‘그들의 명령을 넘어서’입니다.
    reason: lexical_alternative
