  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 앞의 ‘영광스럽고’와 구별되게 빛남의 감각을 살리기 위해 ‘찬란하며’로 옮겼습니다.
- source_word: ግሩም
  english_pob_choice: terrible to behold
  chosen_korean: 보기에는 두려웠습니다
