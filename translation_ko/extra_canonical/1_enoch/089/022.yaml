theological_decisions:
- issue: ‘terrible’의 정서 강도
  chosen_reading: ‘보기에는 두려웠습니다’로 옮겨, 경외를 동반한 두려움의 강도를 유지했습니다.
  alternative_readings:
  - 보기에는 경외로웠습니다
  - 보기에는 무서웠습니다
  rationale: 이 단어는 악함이 아니라 압도적인 위엄에서 오는 떨림을 나타내므로, 감각을 약화하지 않되 오해도 피하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §1; apocalyptic awe imagery
- issue: 양 떼의 주의 호칭
  chosen_reading: ‘양 떼의 주’로 유지해 상징적 동물 이미지와 위격을 함께 보존했습니다.
  alternative_readings:
  - 목자
  - 주인
  rationale: 이 본문은 해설보다 환상 이미지 자체를 통해 의미를 전달하므로, 상징을 평이한 산문으로 풀지 않는 것이 적절합니다.
  doctrine_reference: Translation philosophy §§1, 5; apocalyptic symbol preservation
