  rationale: 영문 POB의 각주가 밝히듯 도덕적 악이 아니라 경외와 떨림의 감각을 가리키므로, ‘두려웠습니다’로 번역해 과도한 약화를 피했습니다.
- source_word: ለርእይ
  english_pob_choice: to behold
  chosen_korean: 보기에는
  alternatives_korean:
  - 보기에
