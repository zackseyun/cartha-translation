base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
  footnotes:
  - marker: a
    text: Or 'majestic' for 'splendid'; the Ge'ez adjective can denote honor or weightiness as well as visible magnificence.
    reason: lexical_alternative
  - marker: b
    text: '''Terrible to behold'' expresses awe-filled dread, not moral evil.'
    reason: lexical_alternative
translation:
  language: ko
  text: 그리고 양 떼의 주께서 그들을 이끄시며 그들과 함께 가셨고, 그의 모든 양이 그를 따랐습니다. 그의 얼굴은 영광스럽고 찬란하며 보기에는 두려웠습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘보기에는 두려웠습니다’는 악함이 아니라 경외를 동반한 떨림을 뜻합니다.
    reason: lexical_alternative
  - marker: b
    text: ‘양 떼의 주’는 소유와 통치를 함께 드러내는 표현입니다.
    reason: source_note
lexical_decisions:
- source_word: እግዚኦሙ ... ለአባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양 떼의 주
