  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 소유격과 위격을 함께 살리기 위해 ‘양 떼의 주’로 옮겼습니다. ‘주인’이나 ‘목자’는 관계를 바꾸거나 의미를 좁힐 수 있어 피했습니다.
- source_word: ይመራሖሙ
