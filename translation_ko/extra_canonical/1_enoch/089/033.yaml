base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
  footnotes:
  - marker: a
    text: The clause 'it came down from the lofty rock' is syntactically difficult. The Ethiopic most naturally points back to 'that sheep,' but some may understand the subject differently.
    reason: alternative_reading
  - marker: b
    text: '''Blinded'' could also be rendered ''darkened'' or ''dimmed,'' preserving the image of impaired sight rather than total loss of vision.'
    reason: lexical_alternative
  - marker: c
    text: Or 'and he recognized that sheep; and it came down from the lofty rock'.
    reason: previous_rendering
translation:
  language: ko
  text: 양들의 주인은 그들에게 몹시 노하셨고, 그 양은 그것을 알고 바위의 꼭대기에서 내려와[a] 양들에게 가서, 그들 가운데 눈이 어두워지고 길을 잃은 이들이 대다수인 것을 발견했습니다[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘그 양은 그것을 알고, 바위의 꼭대기에서 내려와’라는 구절은 통사적으로 다소 어렵습니다. 원문과 직전 문맥에서는 ‘그 양’이 알고 내려온 것으로 읽는 것이 가장 자연스럽지만, 일부 해석은 주어의 연결을 다르게 이해합니다.
    reason: alternative_reading
  - marker: b
    text: ‘눈이 어두워지고’는 ‘눈이 흐려지고’ 또는 ‘눈이 가려지고’로도 옮길 수 있습니다. 이는 완전한 시력 상실이라기보다 시각이 손상되거나 가려진 이미지를 보존합니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주인
  alternatives_korean:
  - 양들의 주님
  - 양 떼의 주인
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 지배·소유 관계를 분명히 하되, 이 책의 우주적 통치자 이미지를 한국어에서 과도하게 교회화하지 않기 위해 ‘주인’을 택했습니다.
- source_word: ተምዐዐ ዲቤሆሙ መዐተ ዐቢየ
  english_pob_choice: was exceedingly angry with them
  chosen_korean: 그들에게 몹시 노하셨고
  alternatives_korean:
  - 그들에게 크게 진노하셨고
  - 그들에게 격노하셨고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 중첩된 분노 표현의 강도를 살리면서도 현대 한국어에서 자연스럽게 읽히는 동사 ‘노하다’로 옮겼습니다.
- source_word: ዘጽሉለ አዕይንቲሆሙ
  english_pob_choice: with their eyes blinded
  chosen_korean: 그들의 눈이 흐려진 채 있는
  alternatives_korean:
  - 그들의 눈이 가려진
  - 그들의 눈이 어두워진
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 참조 영어의 ‘blinded’는 완전한 상실보다 시각의 훼손을 가리키므로, 한국어에서는 상태를 드러내는 ‘흐려진 채 있는’으로 참여적 뉘앙스를 살렸습니다.
- source_word: እለ ስሕቱ
  english_pob_choice: those who had gone astray
  chosen_korean: 길을 잘못 들었던 자들
  alternatives_korean:
  - 빗나갔던 자들
  - 방황하던 자들
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 양 이미지와 도덕적 일탈을 함께 보존하기 위해 물리적 ‘길’과 추상적 ‘잘못 들다’를 결합했습니다.
theological_decisions:
- issue: ‘the Lord of the sheep’의 한국어 처리
  chosen_reading: ‘주님’ 대신 ‘주인’으로 옮겨, 창조주적 통치와 소유 관계를 드러내되 후대 교회 용어로 고정하지 않았습니다.
  alternative_readings:
  - 양들의 주님
  - 양 떼의 주인
  rationale: 본문의 동물 우화적 표층과 통치자 이미지를 동시에 살리는 것이 중요하므로, 신약적 칭호를 직접 유입시키는 번역은 피했습니다.
  doctrine_reference: Original-language primacy; preserve genre-specific imagery
- issue: 마지막 절의 ‘눈이 흐려진 채’ 표현
  chosen_reading: ‘흐려진 채 있는’으로 상태를 유지해, 시력의 훼손을 묘사하되 완전 소실로 단정하지 않았습니다.
  alternative_readings:
  - 눈이 멀어진
  - 눈이 어두워진
  rationale: 영어 POB의 주석처럼 원문은 ‘darkened/dimmed’의 여지를 남기므로, 완전한 실명보다 훼손된 시각의 상태를 보존하는 쪽이 더 적합합니다.
  doctrine_reference: Preserve lexical tension; avoid over-specification
