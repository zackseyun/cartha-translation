  - marker: b
    text: '''Cry out over them'' could also be understood as ''cry out concerning them'' or, less likely, ''cry out against them.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'And I sent'.
    reason: previous_rendering
  - marker: d
    text: Or 'that they might hear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그들이 들리게 하고 그 양들에 대하여 부르짖도록 다른 많은 양들을 그 양들에게 보내셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘들리게 하다’로 옮긴 동사형은 사역형으로 보입니다. 문맥에 따라 ‘듣게 하다’, 또는 ‘선포하다/증언하다’로 이해될 수도 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘그 양들에 대하여’는 ‘그 양들 위로’, ‘그 양들에 관하여’, 또는 덜 가능하게는 ‘그 양들에 맞서’로도 이해될 수 있습니다.
    reason: lexical_alternative
