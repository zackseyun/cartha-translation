    text: '''Cry out over them'' could also be understood as ''cry out concerning them'' or, less likely, ''cry out against them.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'And I sent'.
    reason: previous_rendering
  - marker: d
    text: Or 'that they might hear'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그는 그 다른 많은 양들을 그 양들에게 보내어, 그들이 듣고 그들에 대하여 부르짖게 하셨습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘듣다’로 옮겼지만, 동사형은 문맥상 ‘듣게 하다/들리게 하다’의 사역적 뉘앙스를 가질 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: ‘부르짖다’는 여기서 ‘그들에 대하여’, 덜 가능하게는 ‘그들에 맞서’로도 이해될 수 있습니다.
    reason: lexical_alternative
