  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
  footnotes:
  - marker: a
    text: The clause rendered 'that they might hear' is difficult; the underlying verb may carry a causative nuance ('make hear' / 'proclaim so as to be heard').
