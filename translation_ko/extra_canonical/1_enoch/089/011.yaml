    text: 게에즈어의 `አድገ ገዳም`은 OCR이 불안정하지만, 이 자리에서는 단수 ‘들나귀’로 읽는 것이 가장 자연스럽습니다.
    reason: lexical_alternative
  - marker: c
    text: '대안: “그들의 한가운데서 태어난 그 흰 수소는 들나귀 하나와 함께 흰 수소를 낳았고…”'
    reason: previous_rendering
