  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
  footnotes:
  - marker: a
    text: The opening clause is textually difficult in the OCR. The verb likely describes mutual violent action among the animals; 'gore one another' preserves the probable bovine imagery.
    reason: textual_variant
  - marker: b
    text: The phrase rendered 'bull-calves of the field' is uncertain. The Ge'ez may point instead to 'wild asses' or similar animals of the open country. The main text keeps the immediate bovine flow of the passage while preserving the uncertainty here.
    reason: lexical_alternative
  - marker: c
    text: Or 'but among them there was born a white bull-calf, and after it there were born many bull-calves of the field and white cattle with them.'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들은 서로 들이받기 시작하였습니다[a]. 그들의 한가운데서 태어난 그 흰 수소는 들나귀 하나와 그와 함께 있는 흰 수소를 낳았고[c][b], 들나귀들은 크게 불어났습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 문맥상 짐승들 사이의 상호 폭력을 가리키는 난해한 동사구입니다.
    reason: textual_variant
