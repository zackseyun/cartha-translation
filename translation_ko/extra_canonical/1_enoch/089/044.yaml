  source_fidelity: 핵심 동물 비유와 행위의 순서는 충실합니다. 특히 ዘእንበለ ተደላ는 ‘아무도 제지하지 않음’보다 품위·합당함의 결여를 가리키므로 ‘품위 없이’가 적절합니다. 다만 현 번역의 첫 문장은 ‘자기의 영광’의 소유자가 숫양임을 문법적으로 더 분명히 할 필요가 있습니다.
  naturalness: ‘그 양은 … 그 숫양이 … 버린 것을 보았습니다’도 해석되지만, 관계절이 길고 ‘자기’의 지시 대상이 잠시 불분명합니다. 숫양을 목적어로 세우고 이후 행동의 주어를 명시하면 현대 표준 한국어 합쇼체에서 더 자연스럽고 명료합니다.
  terminology: ‘양’, ‘숫양’, ‘영광’, ‘뿔로 받다’, ‘짓밟다’는 환상의 동물 상징과 원문의 폭력적 동작을 적절히 보존합니다. 영어 감사 기록의 ‘without restraint’ 및 그에 따른 대안은 게에즈어 ተደላ의 의미를 정확히 반영하지 않으므로 유지하지 않는 것이 좋습니다.
