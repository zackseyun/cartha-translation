base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
  footnotes:
  - marker: a
    text: Or 'among the sheep.'
    reason: lexical_alternative
  - marker: b
    text: The phrase 'abandoned its glory' is likely symbolic within the vision; it may refer to lost honor, splendor, or status.
    reason: cultural_note
  - marker: c
    text: The final clause may also be rendered 'and it went on unchecked' or 'with no one hindering it.'
    reason: lexical_alternative
  - marker: d
    text: Or 'went on without anyone restraining it'.
    reason: previous_rendering
translation:
  language: ko
  text: 눈이 열렸던 그 양은 양들 가운데[a] 있던, 자신의 영광을 버린[b] 그 숫양을 보았습니다. 그 숫양은 그 양들을 뿔로 받기 시작하고 짓밟았으며, 품위 없이 다녔습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 또는 ‘양들 가운데서’.
    reason: lexical_alternative
  - marker: b
    text: ‘자신의 영광을 버린’은 환상 안의 상징적 표현으로, 잃어버린 명예나 위엄을 가리킬 수 있습니다.
    reason: cultural_note
