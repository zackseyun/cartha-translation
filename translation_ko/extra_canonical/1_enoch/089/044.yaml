  rationale: 지시된 어휘는 단순한 외적 제어 부재가 아니라 품위·품행의 결여를 뜻하므로, 그 의미를 드러내는 표현을 택했습니다.
theological_decisions:
- issue: ‘영광’을 구체적으로 무엇으로 볼지
  chosen_reading: ‘자기의 영광’을 그대로 두어 명예, 위엄, 영화의 상실 가능성을 열어 둡니다.
  alternative_readings:
  - 명예
  - 위엄
  - 광채
  rationale: 이 환상은 상징적 층위가 넓으므로, 특정 정치적·윤리적 의미로 과도하게 좁히지 않고 원문의 긴장을 보존하는 것이 적절합니다.
  doctrine_reference: Preserve theological tension rather than resolve it.
