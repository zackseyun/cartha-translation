  source_fidelity: 첫 절의 난해한 사역형을 영어 POB의 신중한 처리('늑대들이 양들에게 자신을 드러냈다')에 맞춰 보존했으며, 늑대·양·물줄기라는 환상적 동물 이미지를 해설로 바꾸지 않았습니다. 다만 두 번째 절의 물줄기와 관련된 이동의 도착점을 '가운데로'로 유지하는 것이 ማእከለ의 공간성을 더 잘 반영합니다.
  naturalness: 합쇼체는 일관되고 전반적으로 자연스럽습니다. 그러나 첫 번째 '그들은'은 바로 앞의 '늑대들'을 받을 가능성도 있어, 실제로 물줄기 가운데로 들어가는 양들을 명시하는 편이 현대 한국어에서 더 분명합니다.
  terminology: '''늑대들'', ''양들'', ''물줄기''는 상징 이미지를 충실하고 자연스럽게 보존합니다. ''모습을 드러냈다''는 난해한 첫 동사를 과도하게 해석하지 않는 적절한 선택입니다. ''따라가서''와 ''뒤쫓았다''는 뒤 절의 반복적 추격 표현을 잘 살립니다.'
