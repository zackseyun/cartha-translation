base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
  footnotes:
  - marker: a
    text: The verb rendered 'make the sheep see' is difficult. It may mean that the wolves caused the sheep to notice something, or more loosely that they showed them the way.
    reason: lexical_alternative
  - marker: b
    text: The final clause is textually awkward in the Ethiopic witness, with repetition around 'those wolves' and 'that stream of water.' The translation keeps the probable sense without smoothing away the repetition entirely.
    reason: textual_variant
  - marker: c
    text: Or 'And those wolves began to make the sheep see'.
    reason: previous_rendering
  - marker: d
    text: Or 'turned against'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그 늑대들은 다시 양들에게 모습을 드러냈고, 그들은 그 물줄기 가운데로 들어갔습니다. 그리고 그 늑대들은 양들을 따라가서 그 물줄기 안으로 그들을 뒤쫓았습니다.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 원문 동사는 직역하면 '보이게 하다/드러내다'에 가깝고, 상황상 '나타나다'로도 읽을 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 에티오피아어 증거는 뒤 구문에서 같은 대상을 반복해 말해 약간 어색하지만, 본문은 그 반복을 지나치게 매끈하게 만들지 않고 살렸습니다.
    reason: textual_variant
lexical_decisions:
- source_word: ወ*ጓዲሆሙ፡ ዝኩ፡ አዝእብት፡ አርእይዎሙ፡ ለአባግዕ፡
  english_pob_choice: And those wolves again showed themselves to the sheep
  chosen_korean: 그리고 그 늑대들은 다시 양들에게 모습을 드러냈고
  alternatives_korean:
  - 그리고 그 늑대들은 양들에게 다시 나타났고
  - 그리고 그 늑대들은 양들에게 다시 보였고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 첫 절의 동사는 단순한 '추격'보다 '보이게 하다/드러내다'에 가까운 난해한 원형을 반영해야 하므로, 한국어에서는 문맥상 자연스럽지만 능동적 드러남을 살린 '모습을 드러냈고'로 옮겼습니다.
