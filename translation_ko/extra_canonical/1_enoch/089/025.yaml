  english_pob_choice: the sheep
  chosen_korean: 양들
  alternatives_korean:
  - 양 떼
  - 양
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 묵시적 동물 상징을 유지하기 위해 집합적 풀림보다 구체적인 복수형 '양들'을 택했습니다.
- source_word: ማእከለ፡ ዝኩ፡ ዐይገ፡ ማይ፡
  english_pob_choice: into the midst of that stream of water
  chosen_korean: 그 물줄기 가운데로
  alternatives_korean:
  - 그 물줄기 한가운데로
  - 그 물의 흐름 가운데로
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: '''중심 한가운데''의 공간감을 살리되, 한국어에서는 중복을 피하고 자연스럽게 ''가운데로''로 정리했습니다. ''stream of water''는 규모를 과장하지 않게 ''물줄기''로 옮겼습니다.'
- source_word: ተለውዎሙ፡ ለአባግዕ፡ ወረጹ፡ ድኅሬሆሙ፡
  english_pob_choice: followed the sheep and ran after them
  chosen_korean: 양들을 따라가서 그들을 뒤쫓았습니다
  alternatives_korean:
  - 양들을 따라가서 달려갔습니다
  - 양들을 뒤따라 달렸습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 뒤의 반복 구문은 '따르다/뒤쫓다'의 이중 동작을 보여 주므로, 첫 동사는 방향성을, 둘째는 속도와 긴박감을 살려 각각 '따라가서'와 '뒤쫓았습니다'로 나누어 옮겼습니다.
