base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
  footnotes:
  - marker: a
    text: Or 'cried out to the sheep' or 'cried out concerning the sheep'; the Ge'ez preposition can be taken more than one way here.
    reason: lexical_alternative
  - marker: b
    text: '''For the sheep'' may also mean ''to the sheep'' or ''on behalf of the sheep.'''
    reason: lexical_alternative
  - marker: c
    text: Or 'saved it from them for the sheep'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 그들 가운데 하나가 도망하여 죽임을 당하지 않았습니다. 그것이 일어나 양들 위에서 소리쳤고[a], 그들은 그것을 죽이려 했습니다. 그러나 양들의 주님께서 그것을 양들 가운데서 구해 내시어 제게로 끌어올리시고 내려놓으셨습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ge'ez 전치사는 ‘양들 위에서’ 외에 ‘양들에게’ 또는 ‘양들에 관하여’로도 이해될 수 있습니다.
    reason: lexical_alternative
lexical_decisions:
- source_word: ድኅነ
  english_pob_choice: escaped
  chosen_korean: 도망하여
  alternatives_korean:
  - 벗어나
  - 탈출하여
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 직후의 ‘죽임을 당하지 않았다’와 함께, 위협에서 빠져나온 동작을 자연스럽게 살리기 위해 ‘도망하여’를 택했습니다.
- source_word: ኢተቀትለ
  english_pob_choice: was not killed
  chosen_korean: 죽임을 당하지 않았습니다
  alternatives_korean:
  - 살해되지 않았습니다
  - 죽지 않았습니다
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 수동 부정의 직접 의미를 분명히 드러내면서도, 한국어 서술체로 자연스럽게 옮겼습니다.
- source_word: ጸርኀ
  english_pob_choice: cried out
  chosen_korean: 소리치자
  alternatives_korean:
  - 외치자
  - 부르짖자
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 강한 외침의 뉘앙스를 살리되, 환상 서술의 흐름에 맞게 간결하게 표현했습니다.
- source_word: እግዚአ አባግዕ
  english_pob_choice: the Lord of the sheep
  chosen_korean: 양들의 주님
  alternatives_korean:
  - 양들의 주인
  - 양들의 주
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 이 작품의 상징 언어에서 하나님을 가리키는 존칭이므로, 단순한 소유자보다 주권을 드러내는 ‘주님’이 더 적절합니다.
- source_word: አድኃኖ
  english_pob_choice: saved it
  chosen_korean: 구하셔서
  alternatives_korean:
  - 구원하셔서
  - 건지셔서
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 단순한 구조 요청보다 구출 행위를 자연스럽게 드러내는 동사로 옮겼습니다.
- source_word: እምኔሆሙ ለአባግዕት
  english_pob_choice: from among the sheep
  chosen_korean: 양들 가운데서
  alternatives_korean:
  - 양들에게서
  - 양들로부터
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: 문맥과 주해상 ‘from them’이 양들을 가리키는 표지이므로, 그들 사이에서 분리해 내는 뜻을 ‘가운데서’로 살렸습니다.
- source_word: አዕረጎ ኀቤየ
  english_pob_choice: brought it up to me
  chosen_korean: 제게로 끌어올리시고
  alternatives_korean:
  - 제게로 데려오시고
  - 제게로 올려 보내시고
  lexicon: Dillmann, Lexicon Linguae Aethiopicae
  rationale: ‘올려’라는 상향 운동과 환상 속 시인의 위치를 반영했습니다.
theological_decisions:
- issue: 「양들의 주님」이라는 신적 칭호의 처리
  chosen_reading: 상징적 동물 환상 안에서 하나님을 가리키는 존칭으로 보아 ‘양들의 주님’이라고 옮겼습니다.
  alternative_readings:
  - 양들의 주인
  - 양들의 주
  rationale: 이 칭호는 단순한 관리자가 아니라 양 떼를 다스리고 구출하는 주권자를 가리키므로, 한국어에서도 신학적 격을 유지하는 표현이 필요합니다.
  doctrine_reference: Translation philosophy §2, 'Translate titles; transliterate names'
