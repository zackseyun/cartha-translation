base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/008.yaml
  text: And the water began to descend into them until the earth was laid bare[a]; and that vessel rested upon the earth, and darkness was removed[d][c][b], and light came to be.
  footnotes:
  - marker: a
    text: The Ge'ez noun rendered 'abyss' is difficult and may also be understood as 'chasm,' 'pit,' or 'depth.'
    reason: lexical_alternative
  - marker: b
    text: The line's movement from darkness to light likely evokes creation or restoration imagery, but the wording here is kept close to the Ge'ez rather than conformed to a standard Genesis-style English formula.
    reason: cross_reference
  - marker: c
    text: Or 'that abyss was in the earth'.
    reason: previous_rendering
  - marker: d
    text: Or 'And water descended into their midst'.
    reason: previous_rendering
translation:
  language: ko
  text: 그리고 물이 그들 속으로 계속 내려가서 마침내 땅이 드러났습니다[a] — 그 물건이 땅 위에 머물렀고, 어둠이 걷히고[b][c][d], 빛이 생겼습니다.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 게으즈어의 해당 명사는 ‘깊은 곳/심연’ 계열로도 읽힐 수 있습니다.
    reason: lexical_alternative
  - marker: b
    text: 이 빛의 도래는 창조 또는 회복을 떠올리게 하지만, 본문은 그 익숙한 창세기 공식을 그대로 따르지 않습니다.
    reason: cross_reference
  - marker: c
    text: 또는 ‘그 심연이 땅에 있었다’로도 옮길 수 있습니다.
    reason: previous_rendering
  - marker: d
    text: 또는 ‘그들 가운데로 물이 내려갔다’로도 볼 수 있습니다.
    reason: previous_rendering
